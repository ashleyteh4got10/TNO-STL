 CPC_Black_Market_category:0 "地下交通线"
 CPC_Black_Market_category_desc:0 "高宗武的南京伪政府腐败到了无以复加的地步，伪军的将领们如果不付出令人满足的贿赂，甚至无法获得自己应得的装备。\n这些腐败的官僚们会将仓库里的装备卖给任何出得起价的人。\n即使是他们口中的“共匪”。"
