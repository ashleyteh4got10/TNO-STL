 STATE_1706_Desc: "尽管海地共和国与多米尼加共和国曾试图于三十至四十年代进行和解，但两国关系仍因地缘政治立场分歧停滞不前。这一紧张局势最终引发了史称“1948年闪电战”的武装冲突，多米尼加共和国在此期间夺取了虽为海地领土，却也曾属于伊斯帕尼奥拉岛西班牙语区的§Y因查地区§!。\n\n自那时起，海地与多米尼加的关系便跌至谷底，而在特鲁希略政权大肆迫害海地移民后更是一发不可收拾。这些无谓的流血事件无时无刻不在刺激着海地政府，迫使其去抓住哪怕最微小的机会来收复失地。"
 STATE_1706_Desc_spa: "尽管海地共和国与多米尼加共和国曾试图于三十至四十年代进行和解，但两国关系仍因地缘政治立场分歧停滞不前。这一紧张局势最终引发了史称“1948年闪电战”的武装冲突，多米尼加共和国在此期间夺取了虽为海地领土，却也曾属于伊斯帕尼奥拉岛西班牙语区的§Y因查地区§!。\n\n自那时起，海地与多米尼加的关系便跌至谷底，而在特鲁希略政权大肆迫害海地移民后更是一发不可收拾。这些无谓的流血事件无时无刻不在刺激着海地政府，迫使其去抓住哪怕最微小的机会来收复失地。"
 STATE_2442_Desc: "在新河与科兰太因河之间，坐落着一片名为§Y蒂格里地区§!（英国人称之为§Y新河三角§!）的争议领土。1814年的《英荷条约》将科兰太因河确立为了英属圭亚那与苏里南的边界，并借助库塔里河完善了边界的划定，因为当时的人们认为库塔里河便是科兰太因河的源头。\n\n然而在1871年，英国探险家发现了另一条名为新河的支流（尼德兰人称之为上科兰太因河），两方无法就哪条边界是正确的达成共识，这也为持续至今的争端埋下了伏笔。\n\n如今，双方均在边境线两端陈列重兵。尼德兰人正虎视眈眈，一旦英国人露出任何破绽，他们便会伺机而动。"
