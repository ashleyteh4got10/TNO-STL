 Assoc_Region_Santa_Cruz_Dept_Desc_stc: "尽管玻利维亚官方仍宣称§Y[1675.GetName]§!及其周边省份属于§Y圣克鲁斯省§!，但该地区或是在东部社会党的领导下维持着名义上的独立，或是已被并入巴拉圭。玻利维亚能否收复失地，唯有时间能给出答案。"
 Assoc_Region_Santa_Cruz_Dept_Desc_stc_spa: "尽管玻利维亚官方仍宣称§Y[1675.GetName]§!及其周边省份属于§Y圣克鲁斯省§!，但该地区或是在东部社会党的领导下维持着名义上的独立，或是已被并入巴拉圭。玻利维亚能否收复失地，唯有时间能给出答案。"
 Assoc_Region_Santa_Cruz_Dept_Desc_bol_unify: "在圣克鲁斯政权垮台后，§Y圣克鲁斯省§!最终尽数落入玻利维亚共和国的掌控之中。尽管距离根除东部社会党及其支持者的残余势力仍有一段时日，但历经数十年的丧权辱国与领土沦丧，玻利维亚人民此刻终于能奔走相告，隆重庆祝这场大胜。"
 Assoc_Region_Santa_Cruz_Dept_Desc_bol_unify_spa: "在圣克鲁斯政权垮台后，§Y圣克鲁斯省§!最终尽数落入玻利维亚共和国的掌控之中。尽管距离根除东部社会党及其支持者的残余势力仍有一段时日，但历经数十年的丧权辱国与领土沦丧，玻利维亚人民此刻终于能奔走相告，隆重庆祝这场大胜。"
