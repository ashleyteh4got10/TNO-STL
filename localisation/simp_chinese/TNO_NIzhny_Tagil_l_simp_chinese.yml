 MILITARY_NIKOLAI_ANDREEV_DESC: "§L尼古拉·特罗菲莫维奇·安德烈耶夫1905年出生于莫斯科，在1935年加入红军前，他当过信使、铁匠学徒和印刷工，后来在第93步枪师担任步兵指挥官，并于1938年成为伊尔库茨克州泰舍特区的军事委员。德国入侵苏联时，安德烈耶夫原本渴望奔赴前线，却被派往东部参加军官培训。然而随着苏联在德国攻势下开始崩溃，政治局向东撤离，他却竭力拖延被派往前线，并与一同毕业于军官学校的同伙们在下塔吉尔市巩固了权力。起初，安德烈耶夫一伙受到中西伯利亚共和国的怀疑，他们被拆散分配到不同的岗位，安德烈耶夫本人被置于尼古拉·克雷洛夫的指挥之下。但在西伯利亚战争期间，安德烈耶夫敏锐察觉形势变化，重新集结旧部势力，在老根据地发动兵变反对克里洛夫，终结了中西伯利亚共和国。§!"
 MILITARY_ALEXEY_PESTEREV_DESC: "§L阿列克谢·伊万诺维奇·佩斯捷列夫于1910年出生于布里亚特，曾以集体农庄庄员和建筑工人的身份工作。1939年加入苏联共产党，1941年应征加入红军。作为第209步兵师的政治委员，他凭借个人战功与德军攻势下部队遭受的严重减员，迅速晋升为第932步兵团代理团长。在炮火猛烈袭击下，他率领残部撤至乌拉尔山脉以东。随后，他被划至尼古拉·安德烈耶夫麾下。安德烈耶夫对佩斯捷列夫的坚毅果敢颇为赞赏，很快将他吸纳进自己的小圈子。在针对尼古拉·克雷洛夫的叛乱中，佩斯捷列夫发挥了关键作用，他控制了叶尼塞河的渡口，致使克雷洛夫麾下的几支部队被困于西岸，最终被西伯利亚黑军歼灭。§!"
 MILITARY_NIKOLAI_LYASHCHENKO_DESC: "§L尼古拉·格里戈利耶维奇·利亚先科于1910年出生于伊尔库茨克，早年生活在吉尔吉斯斯坦，当过马夫和铁匠，后加入当地工会委员会，并于1929年自愿参加红军。他在中苏冲突中表现卓越，被送往中亚军事学校深造，并于1932年毕业，出任第73步兵师步兵指挥官。因1936年的战功获颁红星勋章，后以军事顾问身份参加西班牙内战，归来时获颁红旗勋章，随即被派往深造。在苏联解体期间，利亚先科是尼古拉·安德烈耶夫麾下毕业生小团体的早期成员之一。作为中西伯利亚共和国为瓦解该派系行动的一部分，利亚申科被派往新西伯利亚，在西伯利亚战争中英勇作战，展现出了非凡的勇气。然而，好景不长，在亚历山大·波克雷什金背叛共和国后，他返回下塔吉尔，最终自己也背叛了共和国。§!"
 MILITARY_ALEKSANDRA_SAMUSENKO_DESC: "§L亚历山德拉·格里戈里耶夫娜·萨姆森科生于1922年，据传十几岁时便参加过西班牙内战，1935年加入红军。最初在步兵排服役，先后参与苏芬“冬季战争”，后毕业于坦克学院，作为唯一女性坦克兵加入第一近卫坦克军。因其英勇表现，萨穆先科荣获多项荣誉并获颁红星勋章。在“巴巴罗萨行动”后率第97近卫坦克旅残部跨越乌拉尔山脉，所部加入中西伯利亚共和国。萨姆森科在尼古拉·克雷洛夫麾下效力时，共和国主力坦克部队于西伯利亚战争中被歼灭，这促使她转而投身尼古拉·安德烈耶夫针对克雷洛夫的叛乱，而这也成为共和国覆灭的最后一击。§!"
 NTG_memories_of_the_father: "父忆如昔"
 NTG_memories_of_the_father_desc: "回溯既往，以缅怀故领袖列夫·托洛茨基，我们光辉运动的掌舵人与奠基者，实属必要。我们国家所立足的一切，皆由其思想中喷薄而出。纵然他已辞世近十载，其面容依旧傲然展现于布告与旗帜之上。至为关键的是，其子，我们光荣的主席，亦将此铭记于心。"
 NTG_remember_the_past: "铭记历史"
 NTG_remember_the_past_desc: "苏维埃联盟的初创岁月何等壮美。那是个希望与梦想迸发的年代，无数革命思想在此间勃然兴起。与此同时，列夫·托洛茨基亦开始了他的行动。即便这一切最终招致了工人国家的畸变与俄罗斯的崩塌，我们亦不应遗忘这段岁月。毕竟，无有过往，便无未来可言。"
 NTG_reflect_on_the_present: "反思当下"
 NTG_reflect_on_the_present_desc: "而如今的我们身在何处？冰封千里的荒原上，散落着几座孤城。俄罗斯已然倾覆，但生活仍在继续。或许前路黯淡无光，但生活仍在继续。或许某天，一切终将改变。"
 NTG_look_to_the_future: "展望未来"
 NTG_look_to_the_future_desc: "未来看似朦胧。但只要我们仍在战斗，心跳尚存，自由、正直的俄罗斯之理念便不会消亡！若我们能达成目标，全世界都将见证无产阶级的意志，世界革命的梦想将更接近实现！"
 NTG_the_legacy_of_trotskyism: "托洛茨基主义的遗产"
 NTG_the_legacy_of_trotskyism_desc: "必须回望历史、铭记我们的老领袖列夫·托洛茨基，我们光辉运动的缔造者与引路人。我们国家建立的一切根基皆源于他的理想与教诲。然而，我们并非独处于西伯利亚林区。\n\n下塔吉尔是块飞地，四周被新西伯利亚的官僚资本家、克麦罗沃癫狂之王的朝廷、坎斯克的匪帮以及托木斯克的中西伯利亚共和国残余势力所包围，他们全副武装，与我们以及我们为西伯利亚工人所秉持的理想为敌。\n\n革命的前景看似黯淡，但，我们绝不会在这场挑战面前退缩。我们将向世界证明：我们必将存活下去，让托洛茨基的梦想席卷西伯利亚平原，并最终传遍全俄！"
 NTG_vanguard_of_the_revolution: "革命先锋"
 NTG_vanguard_of_the_revolution_desc: "列夫塞多夫总书记的一生充满艰辛——他亲眼目睹父亲的革命事业在伪革命者的破坏下分崩离析，见证祖国在苏德战争中满目疮痍。\n\n但他从未因此退缩。作为托洛茨基主义的先锋和旗手，他遵循着列宁与马克思的谆谆教诲，在真正的革命道路上无畏前行，而盘踞在秋明和伊尔库茨克的伪革命者都与之相形见绌。\n\n正是托洛茨基的愿景与列宁的远见，铸就了苏维埃联盟的诞生与革命的胜利。他所锻造的红军在战争中奋不顾身、浴血奋战；他未竟的政治蓝图，仍将工人阶级推向更高远的繁荣之境。\n\n如今，列夫·塞多夫必将继承父亲的遗志，秉持着托洛茨基革命哲学，在这个动荡的时代继续破浪前行。因为先锋者，永不言退。"
 NTG_in_his_name: "以他之名"
 NTG_in_his_name_desc: "布尔什维克的继承路线原本清晰而明朗：毫无悬念，列宁的接班人理应是托洛茨基。毕竟，这位\"赤色革红王子\"注定要继承列宁的遗志，将国际共产主义事业进行到底。\n\n然而，反革命势力的阴谋与肮脏交易改变命运的轨迹。尼古拉·布哈林用伪装的反动思想蒙蔽了列宁，窃取了总书记之位，将托洛茨基驱逐出他应有的位置。今日之所为又为斯大林日后颠覆联盟铺平了道路，最终让苏联的万千人民深陷长达数十年的灾难深渊。\n\n如今，我们的使命就是重振托洛茨基的思想，恢复\"不断革命\"的理念，让所有被压迫民族都能参与其中。身为托洛茨基的继承者，列夫·塞多夫将接过父亲手中的衣钵，引领这场新革命，于黑暗中开辟一个崭新的时代。\n\n在这场浩浩荡荡的革命征程中，资本主义与法西斯主义的奴役将被彻底粉碎，俄罗斯祖国将在红旗之下重归于一统，而历史终将得到最公平的修正。"
 NTG_denounce_the_false_revolutionaries: "谴责伪革命者"
 NTG_denounce_the_false_revolutionaries_desc: "时至今日，我们必须直面一个关键问题：那些仍在影响社会主义思想、破坏革命阵营团结的\"伪革命者\"。\n\n布哈林的思想虽在实践中有缺陷，但正是他的政策，才使苏联在重建年代走出困境。然而，他也必须为战争初期的指挥失误承担部分责任。\n\n至于斯大林这个叛徒及其集团——他们依靠排挤与背叛的手段爬上权力巅峰，不仅破坏了我们的战争成功，更辜负了红军将士的英勇牺牲。正是他们为苏维埃联盟钉上了最后一根棺钉。\n\n塞多夫同志决定借此年度党代会的契机，既要彻底揭露这群革命叛徒的真面目，也会为布哈林恢复应有的名誉地位。\n\n或许，唯有如此，我们才能弥合裂痕，携手缔造更为光明的未来。"
 NTG_stalin_sins: "揭露斯大林之罪恶"
 NTG_stalin_sins_desc: "约瑟夫·斯大林——伪革命者之魁首。\n\n他曾在内战中同其他老一辈布尔什维克并肩作战，被誉为英雄，更一度被视为列宁的三大接班人之一。我们当初是何等天真！\n\n当\"巴巴罗萨\"之灾难降临，整个苏联危在旦夕之时，这个叛徒趁机却发动政变，镇压了那些尝试揭露这场闹剧的忠诚党员。西俄罗斯战线在他的指挥下陷入僵局，他却逃回自己的老巢，任由占领区的人民自生自灭。\n\n他是苏维埃联盟的谋杀者，是俄罗斯分崩离析的罪魁祸首，更是苏联人民中的最大叛徒。斯大林及其党羽将被永远钉在历史的耻辱柱上，从党的记忆中彻底抹去。"
 NTG_show_mercy_to_bukharinists: "施予布哈林主义者以仁慈"
 NTG_show_mercy_to_bukharinists_desc: "尼古拉·布哈林的名字至今仍被主席团和代表们所唾弃。但有一点我们必须承认：布哈林的政策带来的益处远超我们的想象。\n\n他的\"西伯利亚计划\"曾为下塔吉尔等城市提供了珍贵的工业发展机遇，直至该计划悲剧性地夭折。尽管存在种种缺陷和管理不善，但至少确保了民众的生活水平优于沙皇及其鹰犬统治时期。\n\n我们应当宽恕这些误入歧途者——他们不过是被野心和目标蒙蔽了双眼。惟有如此，才能弥合革命同志间的裂痕，让我们的联盟重振国际威望。"
 NTG_the_party_of_the_people: "人民的党"
 NTG_the_party_of_the_people_desc: "自始至终，我们都是属于人民的政党。\n\n在国家建设的每个领域，在社会主义社会的方方面面，都镌刻着党的印记。正是党为人民提供了安全保障，让他们得以在这片曾被暴乱与混沌肆虐多年的土地上安居乐业。\n\n党将矢志不渝地确保每位公民：居有其所、食有所供、病有所医、学有所教、劳有所得。\n\n而人民则以参与国家建设、投身社会事务作为回报。没有党，我们将重陷疯狂与无序的深渊；没有人民，我们只得沦为世界法西斯与资本势力的猎物。既然这样的错误我们不慎犯过一次，那我们就绝不会再给敌人以可乘之机。\n\n这，才是真正属于人民、依靠人民、为了人民的政权。"
 NTG_the_issue_of_militias: "民兵问题"
 NTG_the_issue_of_militias_desc: "当整个俄罗斯陷入无政府状态，在下塔吉尔的文官政府于中西伯利亚战争末期重组之际，军队遗弃了武器库和军事基地，将宝贵的武器装备留给了平民。\n\n这些武器使得志愿民兵组织得以组建，他们用这些武器武装自己，抵御那些胆敢在西伯利亚荒原上劫掠的土匪和流寇。\n\n然近来局势步入稳定，我们的军队得已建立，守卫着我们的边疆。但这些民兵组织依然存在，在新生的工人国家中同军队分庭抗礼，甚至敢胆质疑我们的统治合法性。而新的问题也随之油然而生：我们该如何以最好的方式解决民兵问题呢？"
 NTG_an_olive_branch: "友谊的橄榄枝"
 NTG_an_olive_branch_desc: "这些民兵组织不论其意识形态立场如何，确实为民众提供了良好服务。自无政府状态时期以来，这些人在保护我们现有领土、协助军队重建方面发挥了至关重要的作用。\n\n如今，这些志愿民兵组织主动提出加入正规军，愿意接受党的训练并上缴武器，向我们的士兵传授极为宝贵的实战经验。此外，他们还协助维持治安和行政管理，弥补了我们行政体系的不足。\n\n迄今为止，他们已充分证明了自己的价值。我们应暂时保留其合法地位，待日后逐步完成整合工作。"
 NTG_reform_the_red_army: "红军改革"
 NTG_reform_the_red_army_desc: "一个颇为严重的问题是——我们驻防于下塔吉尔的部队装备严重不足。\n\n部分单位缺编过半，士兵所用的步枪之龄甚于其父，乃至仍有部队以锹为兵。当前形势确实严峻……当然，情况并非全然无望。\n\n于近期获得合法地位和相应权益的部分民兵组织，主动上缴了富余装备，并提供了诸多关于散落在广阔平原上的废弃军火库和军事基地的情报。\n\n与此同时，在混乱与破坏中幸存下来的工业机器已逐步重启，工人们正为英勇的战士们生产新的军事装备。崭新的制式装备以缓慢但源源不断之势配发到部队。"
 NTG_no_compromises: "绝不妥协！"
 NTG_no_compromises_desc: "若要维持红军的实力、独立性与坚韧意志，我们必须坚定不移地遵循托洛茨基主义路线。要想实现完全的军事自主与强大实力，就绝不能向反对势力作出丝毫妥协。\n\n倘若在军队和民兵组织中推行这些反革命改革，其恶果必将在未来数年持续困扰我们——那将是对我军在第一次卫国战争中灾难性的历史重演。\n\n而这种情况绝不能被允许，我们必须坚持这条客观正确的道路，即托洛茨基主义的道路。塞多夫同志将确保其不受任何形式的玷污。除非确有必要，我们必须严禁对军事管理体系进行任何重大改革——这是捍卫我们公社军事能力的根本原则。"
 NTG_stay_true_to_our_ideas: "遵循传统!"
 NTG_stay_true_to_our_ideas_desc: "主席团中某些成员提出的这些军事改革方案荒谬不堪、效率低下，某些内容甚至违背我们的革命理想，堪称反革命行径。\n\n尽管多数民兵组织已经选择同我们合作，但其存在本身仍是个棘手问题。\n\n更为重要的是，我们绝不能背离托洛茨基为红军确立的核心价值。我们不会忘记，当年他乘坐钢铁列车英勇领军，以摧枯拉朽之势，把沙皇军队一路击溃至太平洋沿岸，将自由、社会主义与解放带给人民。\n\n列夫·塞多夫将坚持红军与赤卫队民兵的正统教条，以确保公社的国防安全，并为即将到来的永恒革命夯实基础。\n\n我们必将坚守革命初心。"
 NTG_the_most_important_day: "至关重要之日……"
 NTG_the_most_important_day_desc: "未来已至。\n\n托洛茨基主义的堡垒，巍然屹立于中西伯利亚，比以往任何时候都更加强大。\n\n我们依照卡尔·马克思与列夫·托洛茨基思想推行的改革已见成效：\n\n组建起一支强大的红军、建立起运转良好的政治体系、实现了较为彻底的农民民主、完成了相当重要经的济集体化。\n\n如今，下塔吉尔的工人阶级不再为奴隶般的工时和微薄薪资所困，农民不再为口粮发愁，更不会让国家陷入饥荒。这既是最伟大的成就。\n\n然而，春日将至。军阀们蠢蠢欲动、相互攻伐的传闻甚嚣尘上。恐惧在平原上蔓延，人们担忧战火与苦难恐将再度降临。\n\n但红军已严阵以待。工人们在车间为军队生产装备，农民在田间为军民耕种粮食。托洛茨基主义的火焰在他们心中再度熊熊燃烧，解放的曙光已然显现。命运的馈赠，就此开启。"
 NTG_the_moderate_bourgeoisie_question: "温和派资产阶级问题"
 NTG_the_moderate_bourgeoisie_question_desc: "列宁主义的核心信条之一，就是要彻底消灭作为资本主义压迫者与暴政刽子手的上层精英阶级。迄今为止，红旗所到之处，我们已成功清除了这些势力。然而如今，我们却面临着与这一信条相关的新难题。\n\n过去十年来，肆虐祖国的经济与社会动荡催生了一个新的\"温和派资产阶级\"阶层，主要来自新兴富农和野心勃勃的工厂主。我们的原则要求铲除这些不平等的拥护者，但若彻底清除，将公社内大量知识分子和忠诚的联盟支持者势将流失。\n\n为此，主席团将审慎权衡，作出决议。"
 NTG_exile_the_hardliners: "流放强硬派"
 NTG_exile_the_hardliners_desc: "随着我们对俄罗斯人民意识形态倾向进行更为深入的调查，我们发现在俄罗斯无政府状态期间，滋长了一股十分危险的暗流。\n\n君主主义者、法西斯分子和纳粹分子结成的秘密团体正在阴影中蠢蠢欲动，乃有颠覆政权之企图。这些信奉着曾奴役人民、摧毁国家根基的意识形态的敌人，其威胁甚至远超社会主义阵营内部的思想分歧。\n\n因此，我们将开始全面镇压这些势力，将他们驱逐出我们的工人国家。情报部门将揪出这些反动分子，让其接受人民的正义审判。这些顽固派与反动派在我们的社会中没有容身之处，他们必将被彻底清除。\n\n这群阴险的保皇党与法西斯分子，将被送往劳改营或放逐至西伯利亚荒原——在那里，他们要么通过劳动赎罪来服务工人阶级，要么就等着葬身狼腹。"
 NTG_form_a_bolshevik_democracy: "建立布尔什维克民主"
 NTG_form_a_bolshevik_democracy_desc: "在我们开展革命斗争与反法西斯行动的历程中，民主理想始终是我们竭力捍卫的最高准则。然而，自1918年首次选举以来，反动势力屡屡渗透选举机制，并暗中作祟。鉴于此，加之西方世界那些所谓形形色色的虚伪民主，我们开创了一种新型民主模式——既能保障人民在国家决策中的自由，又可抵御资本主义与极权主义的侵蚀。\n\n布尔什维克民主，即在共产主义国家监督与保护下实行充分民主选举的制度。我们将以此结合托洛茨基主义，作为其最为根本的方针。毕竟，若背离人民意志，革命事业何以为继？\n\n而这项受保障的民主制度，理论上仅为过渡之策，是为最终实现完全自由、不受拘束的社会主义民主的临时体系。确保子孙后代乃至整个社会抵达这一光明未来，也是我们的神圣使命。"
 NTG_our_path_finally_secured: "前路终安"
 NTG_our_path_finally_secured_desc: "如今，在这片狭小的飞地中，我们已走过漫长征途。近期推行的军队改革、政治格局重塑与党内分歧弥合，终见成效。\n\n曾几何时，工人们在工厂里没有发言权，如今却能组建工人委员会，直接推动变革与革新。农民们终日辛劳耕作，如今若遇歉收或农机故障，大可安心向我们求援。\n\n为我们承受深沉苦难的工农阶级们，再也不必为\"服务人民\"而承受无谓的苦难。\n\n我们的战士们已武装就绪，他们将保卫国家，解放俄罗斯破碎山河上受压迫的劳动者，终有一日更将把革命火种带往仍在纳粹铁蹄下的故土。\n\n今日，我们固守下塔吉尔；明日，我们将掌控西伯利亚；而后，莫斯科、明斯克、基辅与斯摩棱斯克，祖国故土都必将重归红旗之下。"
 NTG_crush_the_reactionaries: "碾碎反动派"
 NTG_crush_the_reactionaries_desc: "反动分子对我们来说是极其危险的威胁，甚至比包围我们的敌人更为致命。\n\n他们潜伏在光天化日之下，这使得他们最难对付。其中大多数人试图迫使我们维持现状，在这种现状下，我们工人阶级仍然遭受着卑鄙资本家的压迫和奴役，为他们而非我们自己的利益劳作。\n\n另一些则更为极端，要求恢复君主制及其绝对权力，或是寻求类似法西斯主义的制度。\n\n在我们的社会中，这些人绝不能被容忍。我们的责任就是彻底铲除他们，将他们那卑劣、压迫和充满仇恨的言论从我们的社会中抹去。"
 NTG_the_foundations_of_the_red_army: "赤旗再立"
 NTG_the_foundations_of_the_red_army_desc: "红军曾是一个团结的整体，在十月革命中推翻了亚历山大·克伦斯基的腐败政权。在列昂·托洛茨基的领导下，它成为东方不可忽视的强大力量。\n\n然而，党内的政治倾轧使其支离破碎，战争更令其面目全非。红军分裂为众多军阀割据势力，其中多数早已丧失保卫人民的初心。\n\n我们下塔吉尔的部队虽自诩为红军的正统继承者，实则由满腔热忱的志愿兵和亡命之徒组成，手持的武器比他们的年龄还要老旧。\n\n士兵们缺乏战斗的信念，军官们既无学习新战术的自觉，更无创新的胆识。志愿报效国家者寥寥无几，我们的红军至今仍缺乏明确的奋斗目标。\n\n看来，我们必须再次奠定红军的根基。"
 NTG_employ_an_offensive_doctrine: "采用进攻学说"
 NTG_employ_an_offensive_doctrine_desc: "随着红军重建工作完成，我们必须为即将到来的冲突选定战略方针。\n\n尽管部分将领主张采取守势，但塞多夫总理与阿列克谢耶夫做出了最终决定：进攻性战略更符合长远利益。我们将依托下塔吉尔为核心基地，以迅雷不及掩耳之势发动攻势，趁敌人措手不及之际将其击溃。\n\n毕竟，进攻才是最好的防守。"
 NTG_start_the_draft: "开启征兵"
 NTG_start_the_draft_desc: "若要在军事力量上压倒虎视眈眈的邻国，实施义务兵役制势在必行。当前红军的规模与西伯利亚部分地区武装力量相比仍存在不小差距。\n\n为解决这一棘手的问题，副政委阿列克谢耶夫已制定预备役征兵计划，以扩充红军兵力。\n\n该制度将根据国家的实际需要，灵活调整征兵规模：打仗时则多征，平时就少征。这样才能让我们更好地对随时可能发生的战争做好准备。\n\n。然而，我们不能过于激进地广泛征召。倘若征召人员大大增加，将意味着工厂工人寥寥无几，田野农民屈指可数——而这可能将在战争时期对我们的国家产生极为不利的负面影响。"
 NTG_fight_for_the_revolution: "为革命而战！"
 NTG_fight_for_the_revolution_desc: "红军的前辈们用行动证明了自己——他们推翻了亚历山大·克伦斯基的资产阶级政权，攻占冬宫，将外国势力一一逐出我们的祖国。\n\n已故领袖列夫·托洛茨基将工农红军打造成东半球最强大的武装力量之一，为被资本家奴役的人民而战，粉碎枷锁，解放众生。\n\n自那时起，红军就为一切而战：为家园，为亲人，为战友，为祖国。今日亦然。红军的原则很简单：保卫我们的劳动者，解放广袤国土上仍被奴役的工人。\n\n我们不仅为人民的生存权利而战，更是为一切而战！"
 NTG_the_military_science_committee: "成立军事科学委员会"
 NTG_the_military_science_committee_desc: "军队与科学领域向来密不可分。科学创新推动着新装备、新战术的发展，促使军队不断革新与自我振兴，同敌人抗衡。\n\n在下塔吉尔，亦是如此。许多技术专家已以一种临时方式向军队提供服务：改进武器设计，并探寻提升武器装备可靠性的新方案。军队一方面持续呼吁认可技术专家们的研究成果，另一方面通过为他们的科研项目提供急需资金给予支持。\n\n为此，我们将正式成立军事科学委员会，让军官与技术专家协同工作，从而减少技术专家为寻求创新解决方案而向军队接洽的冗余时长。"
 NTG_subsidize_war_industries: "滋养战争机器"
 NTG_subsidize_war_industries_desc: "在筹划解放西西伯利亚地区的行动之际，我们必须启动急需武器的生产工作。但若不通过补贴来弥补武器与弹药生产对民用产能的挤占，我们将难以实现枪支弹药的足量生产。\n\n迄今为止，我们的经济计划主要侧重于民用工业，以促进经济增长并提升民众生活水平。然而鉴于当前的危急形势，必须将部分产能转向武器和制服生产，并对军事工业予以补贴。\n\n此举短期内或会拖累经济增长，但这对我们的持续生存，乃至最终实现祖国一统大业都至关重要——待国内统一后，我们方能以全力资助全球范围内的永恒革命。"
 NTG_modernize_our_troops: "战术现代化"
 NTG_modernize_our_troops_desc: "历史一再证明，装备技术领先的军队总能毫无悬念地夺取战争的胜利。\n\n时至今日，这一真理依然成立。若没有更为精良的武器装备，我们必将被周边敌人轻易击溃，被他们抓住机会，任由其将祖国拖回所谓反动与堕落的“理想”旧时代。\n\n我们必须加倍努力，立即加快推进部队的现代化进程： 以自动步枪替换栓动步枪，以新式制服换装旧式套装。唯有如此，我们的战士才能在与永久革命之敌的对抗中占据上风。"
 NTG_gather_old_military_plans: "重启旧军事方案"
 NTG_gather_old_military_plans_desc: "近日，我军在一处改建军事基地内发现了印有旧斯大林大本营徽章的重要文件。这些文件已按指挥层级逐级呈递，目前正陈列于将领们的案头。\n\n文件中详尽记载了西俄罗斯战争与伟大卫国战争的作战计划。尽管这些方案并不能完全适用于我军现状，但总参谋部仍可从中汲取战术精髓，将其融入我们下一阶段战争的战略规划。\n\n通过研究这些历史方案，我们将制定适用于多种实战场景的新作战计划。这不仅能为对抗敌人提供战术优势，更能为缺乏前辈经验传承的将领们补上重要一课。"
 NTG_a_red_sky: "赤色长空"
 NTG_a_red_sky_desc: "我们在伟大卫国战争中的惨败以及西俄罗斯战争的失利，让我们从敌人身上汲取了深刻教训。\n\n其中一个关键启示便是拥有强大空军的重要性：如有一支装备精良、训练有素且现代化的空军，能够争夺制空权、支援地面部队进攻并守卫领空，将带来显著的战场优势，甚至可能扭转整个战局。\n\n值得庆幸的是，我方勘察人员发现了一处废弃空军基地，这里曾用于西西伯利亚空军的维护。我们有望重新改造该基地，重建苏联空军，从而在与周边敌人的对抗中获得优势，甚至挑战\"猎鹰\"的空中霸权。"
 NTG_a_red_land: "红色袤陆"
 NTG_a_red_land_desc: "摩托化始终是红军建设的优先事项，自国内卡车投产以来即是如此。内战结束后的第一个十年内，我们便组建起一支属于自己的摩托化部队。\n\n尽管在西俄罗斯战争中不幸失利，但我们学到了比以往更为丰富的作战经验。装备精良的摩托化部队凭借其速度与火力优势，轻松撕裂德国法西斯的防线，解放大片被占领土。\n\n当下，我们将如法炮制：组建自己的摩托化部队，以迅猛之势横扫敌人，并在他们有机会组织攻击之前将其歼灭。而速度与火力，就是摩托化部队的生命保障。"
 NTG_expand_industrial_capacity: "扩大工业产能"
 NTG_expand_industrial_capacity_desc: "布哈林主席构想的“西伯利亚计划”原本旨在将这片祖国腹地打造为工业中心，为广袤平原带来新的经济与就业机遇。\n\n然而如今，这里的工厂悉数闲置，西伯利亚经济停滞不前，各政权不得不相互掠夺以求在荒原中生存。机械锈蚀废弃，沦为破铜烂铁。\n\n鉴于现状，党中央已宣布将通过经济规划与投资重振工业与经济，以期扩大国家的工业产能。"
 NTG_preobrazhensky_economic_plan: "普列奥布拉任斯基的经济计划"
 NTG_preobrazhensky_economic_plan_desc: "尽管塞多夫的计划是社会主义的正途，但我们必须时刻警惕民意波动与周边邻国造成的不稳定因素。因此，我们将逐步收缩战时共产主义政策。军队仍将保持强大战力与充足拨款，但需调整资金流向，使其注入民用经济领域，而非投入到非必要的开支泥潭上。\n\n与此同时，列夫·塞多夫宣布两项要政：\n其一，成立国家计划委员会。该机构将统筹经济数据，制定经济规划，为永恒革命提供决策支持。\n\n其二，启动首个五年计划。此举将扭转当前蜗行牛步的国有化与中央化进程，由亚历山大·别洛博罗多夫领导的内务人民委员部负责政策推行。\n首个五年计划还将实现全俄农业定居点的集体化，然而，这并不如我们的工业国有化进程那般迅速。但这将确保农民和农场主有充足时间去适应集体生活。\n此外，我们还将建立\"推手\"机制，与工会协同监督各工业人民委员完成生产指标，未达标者将予以撤职。\n由此，我们将正式转向计划经济体制——当陷入通胀攀升或经济下行的困境时，国家可及时介入调控。"
 NTG_nikolaevschina: "尼古拉耶维奇的经济提案"
 NTG_nikolaevschina_desc: "另一位干部提出了替代方案。尼古拉·尼古拉耶维奇·伊诺泽姆采夫向主席团提交提案，主张改革现行计划经济：减少国家干预，推行更独立的市场化改革以重振破碎的经济，同时通过国家干预和组建工人大队来保障劳动者权益。\n\n这一方案赢得了党内长期呼吁经济改革者的支持。他们认为，该方案能在不过度依赖国家干预的情况下改善工人生活质量和就业状况。但他们也指出，若改革力度过大，可能会导致我们滑向\"伪革命者\"的歧路。\n\n客观来看，伊诺泽姆采夫作为资深革命者，曾参加伟大卫国战争的红军队列。但与普列奥布拉任斯基及其助手们不同，他缺乏经济学经验，我们难以评估这些改革能否奏效。但为摆脱当前困境，我们必须一试。"
 NTG_collectivize_farms: "农场集体化"
 NTG_collectivize_farms_desc: "正如马克思所阐述、列宁所实践、布哈林所部分延续的那样，国家集体化国有资产的经济战略始终是托洛茨基主义乃至整个共产主义原则的核心。塞多夫同志并没有忘记这一优先事项，并于近期向主席团提交实施范围涵盖整个公社的系列新集体化提案，这一提案深刻体现出塞多夫同志在此方面的深谋远虑。这项罕见获得党内两翼共同支持的行动，虽被宣称为打击新富农和资产阶级的又一记重拳，但仍存些许隐忧。\n\n而最大的担忧莫过于粮食安全问题：西伯利亚经济崩溃导致农业产出出现自内战以来最严重的滑坡，并使该问题日益严峻。而今年集体化的重点恰恰是农场，数以千计的农民将直接受此影响，从而更进一步凸显了这一忧虑。\n\n我们必须确保未来的经济发展计划既能维护经济平等，又能使公社免遭饥荒威胁。"
 NTG_entact_the_welfare_programme: "制定福利项目"
 NTG_entact_the_welfare_programme_desc: "迄今为止，福利计划已在试点地区取得成效。报告显示，越来越多的家庭因此摆脱了贫困大地袭扰。\n\n毕竟，提升民众生活质量始终是我们的首要目标，而家人安康、温饱无忧的工人，在工厂里也会更加勤勉。\n\n然而，我们也发现了一些弊端：部分工人将福利金用于购买如酒精等不良商品，或参与赌博，滥用这些救济金。\n\n为此，我们必须对当前的福利项目进行改革：以购物券和配给票取代救济金直接补助，来确保这些补助用于购买生活必需品。"
 NTG_distribute_goods: "配给产品"
 NTG_distribute_goods_desc: "尽管这些经济计划短期内对部分领域造成冲击，但整体已取得巨大成功！我们可以看到，那些政治敌人和反革命分子在本地的农业合作社中作业，与思想健康的农民和工人彻底相隔离开来。得益于我们对农业的大量投入，以及循序渐进式集体化保障了粮食储备，这一进程出人意料地顺利且成功——这些合作社不仅提高了总体产量，而且我们的改革还赢得了民心并创造了财政盈余，这些盈余将会返还给劳动者。\n\n国家计划委员会现已开始向忠诚的农民和工人发放大笔\"社会劳动养老金\"。此举不仅进一步提升了我们的支持率，更使贫困在我们的国家迅速消失！此外，粮食、汽车以及住房等过剩产品将分配给工人阶级，这将更加确立我们作为卡尔·马克思唯一真正继承者的地位！\n\n作为这个慷慨的工人国家最后的礼物，我们将向失业者和非体力劳动者分发剩余物资，并为贫困人口建造公寓楼。最后，若布哈林分子、保皇派等工人国家的叛徒能证明自己已摒弃堕落思想，他们或许能获得这些绝对剩余产品，并免于遣往古拉格的惩罚。"
 NTG_reestablish_the_nep: "重建新经济政策"
 NTG_reestablish_the_nep_desc: "迄今为止，伊诺泽姆采夫的政策已结出累累硕果。\n\n通过减少国家对经济的过度干预，人民获得了更多经济自主权，得以在社会中立足。同时，福利计划的实施帮助众多公民摆脱了贫困。\n\n然而，其最新提出的\"重行新经济政策\"却遭到强烈反对。该政策原由已故列宁总理用于过渡新生联盟破碎的经济。托洛茨基虽曾支持此策，但主张国家应收回全部产出，用于资本积累与农业集体化转型。\n\n如今，伊诺泽姆采夫与独立干部们提议重启新经济政策，以重建凋敝的经济，并提升民众生活质量。尽管党内对此反对声浪高涨，但最终仍须由主席团定夺。"
 NTG_a_crimson_renaissance: "绯红文艺复兴"
 NTG_a_crimson_renaissance_desc: "随着改革全面展开，许多人曾对快速国有化与渐进集体化的成效表示担忧，并指责我们在这些议题上不是操之过急就是畏缩不前。然而今日不同以往，我们已用事实驳倒了这些反革命者的谬论。\n\n我们取得了前所未有的成就：工业国有化使我们能直接管控生产指标、质量标准和投资规模，这与中央计划委员会的改革数据完美契合——该机构与内务人民委员部协作，提供了精准的统计资料。我们的工人福利与社会养老金计划也深受劳动者欢迎，我们还免费或以极低价格分配公寓及过剩食品物资，让贫困现象如晨雾般消散！\n\n内务人民委员部则在肃清破坏分子与反革命者方面成效显著，这些叛徒都被送往古拉格集体劳改。集体化改革同样成果斐然，其渐进特性尤显智慧。我们已消灭所有孤立的村社，代之以国营农业集体，这使中央计划委员会能更高效地组织人口普查、生产统计及后续经济发展。农场为人民生产面包，人民在工厂劳作，工人则为农民和全体民众建造住房——这正是卡尔·马克思与列夫·托洛茨基憧憬的图景。\n\n五年计划虽以辉煌成就收官，但中央计划委员会的预测令人遗憾：从长远看，这尚不足以彻底振兴经济。其带来的繁荣虽不可低估，但永恒革命需要更加持久的解决方案。"
 NTG_the_beginning_of_the_permanent_revolution: "永恒革命之始"
 NTG_the_beginning_of_the_permanent_revolution_desc: "经过数月来对经济政策的彻底改革、工业产能的重振以及政治战线的巩固，主席团认定我军已具备统一西西伯利亚地区的实力。\n\n为此，我们将启动作战准备：\n\n首先，我们必须集中精力重点打击周边军阀势力。我们将开始动员红军及预备役部队，制定速战速决的作战方案以在不造成大量流血的情况下攻占周边军阀，同时暂时减少 民用 生产，以保障军需供给备。\n\n最后，我们将通过无线电向老战友——伟大卫国战争的老兵们和西西伯利亚受压迫的工人们发出号召：加入革命斗争，解放自我！\n\n在这决定联盟命运的关键时刻，我们将召集他们，为我们的联盟服役！凭借改革后的武装力量、技术优势，以及更坚定的意志，敌人将在我们神圣的军队前不堪一击。\n\n永恒革命，就此踏上它的征途！"
 NTG_lev_sedov_bizarre_adventures: "列夫·谢多夫奇妙历险"
 NTG_lev_sedov_bizarre_adventures_desc: "不久前，列夫·谢多夫和托派分子还只是盘踞在俄罗斯无政府状态中的又一伙暴政之徒，将危险思想传播给西伯利亚人民。\n\n但事实远非如此。谢多夫一生游历世界，从欧洲到小亚细亚传播革命。在苏联最黑暗的岁月里，他悄然归来，潜入雅戈达共和国，继而转赴西伯利亚。在那里，他开始以父亲的理想为指引，构建公社原则。\n\n谢多夫的努力终获回报。当苏联解体时，他联系上逃往下塔吉尔的布尔什维克残部，建立了父亲憧憬的工人国家。\n\n此后我们历经艰辛，建立起乌托邦式的民主政体与有效运作的国家。但若不继续传播思想，不将我们的联盟重建为真正的工人国家，这一切又有何意义？\n\n列夫·谢多夫见证过无数悲剧、个人冲突与失败，但这是一场新的冒险。在这场冒险中，他将实现父亲的梦想，或许还能为俄罗斯人民创造更美好的生活。"
 NTG_prioritize_the_military: "聚焦军事"
 NTG_prioritize_the_military_desc: "在战时，牺牲每天都在发生。\n\n从战壕里为国捐躯的士兵，到放弃平民生活扛起枪的征召兵，再到送他们上战场的家人。\n\n这些人在捍卫社会主义理想！我们必须确保他们获得所需的支援与补给，以赢得战争，避免历史性失败重演。\n\n这意味着将工厂产能从黄油面包转向武器装备，意味着军需品优先于民用物资。虽属临时措施，但要想战胜敌人，我们就必须这么做。"
 NTG_a_call_to_arms: "武装号召"
 NTG_a_call_to_arms_desc: "十月革命爆发时，当我们的士兵和水兵奋起抗击高尔察克集团，工人们万众一心推翻不得民心的政府；他们占领交通枢纽，踊跃捐输军需，由此开始建设我们的联盟。\n\n必须重现这种军民同心支援红军的壮举，让志愿者和觉悟工人为红军征服西伯利亚提供补给与协助。就像1917年那样，我们将通过共同奋斗重建联盟。\n\n为此我们将发布武装号召：工人捐款充实红军经费，募集物资与废铁支援军火生产。\n\n有了人民群众的支持，红军必将胜利！"
 NTG_the_homefront: "后方"
 NTG_the_homefront_desc: "在战争中，有一个战线比任何军事计划、行动或战役都更为重要，然而它既不体现在总命令中，也不标注在地图上。这个战线被称为后方。\n\n后方是任何战争最核心的要素。若不能在此合理调配资源，将引发灾难性后果，甚至可能导致国家覆灭，正如第一次世界大战期间沙皇政权和高尔察克政权遭遇二月革命与十月革命的下场。\n\n如果我们想要赢得这场战争，就必须获得人民的支持。正是他们在兵工厂生产炮弹和枪械，在乡村与工厂承受着严酷的配给制度，还要时刻提防敌人的轰炸和炮击。正是他们持续不断的努力，才让我们的士兵有可能取得胜利。\n\n因此，我们必须让他们明白：他们的坚韧与付出是战争胜利的关键，必须在这些动荡岁月中坚守岗位。\n\n为此，主席团已责成政治宣传部门制作宣传海报并开展专项运动，以强化民众对战争的支持，确保后方战线坚如磐石。"
 NTG_restore_order: "恢复秩序"
 NTG_restore_order_desc: "周边战火纷飞，内部冲突不断，混乱已如野火蔓延。\n\n难民如潮水般涌入，试图逃离战乱，我们的边防军和民兵正竭力确保入境人员接受审查。若继续收容所有难民，粮食危机将迫在眉睫。\n\n不仅如此，人口激增已使边境城镇不堪重负。尽管边防人员严防死守，破坏分子潜入工矿农田制造事端的风险依然高企。\n\n必须重整秩序与管控。代表们已起草临时法案：在主要入境点搭建简易庇护所，同时严格限制现阶段入境人数。"
 NTG_over_valleys_over_mountains: "越山谷，跨重峦"
 NTG_over_valleys_over_mountains_desc: "社会改革使我们深得下塔吉尔民心。工人阶级不再为微薄薪资忍受漫长工时，普通农民亦无需担忧每日口粮。\n\n这是我们伟大的成就，更是区域统一战争中要播撒的理想。\n\n军队已动员，将士整装待发，我们必将让理想之光照耀西伯利亚平原。\n\n在西伯利亚的冰封大地上，工人们曾麻木地劳作，梦想被寒霜禁锢。而今解放的曙光降临，社会主义之火重燃他们心田。命运之祝福已然开启。\n\n越过西伯利亚的深谷与崇山，我们的红旗必将所向披靡。"
 NTG_for_trotskyism: "为托洛茨基主义而战！"
 NTG_for_trotskyism_desc: "当战火与混乱席卷西伯利亚时，我们已证明自己无愧为托洛茨基理想的继承者。通过对经济和民用工业的全面改革，我们极大提升了这个新生国家的生活质量。但这仅仅是第一步。列昂·托洛茨基曾主张将这些理想传遍世界，作为他的火炬手，我们必须承担起传播其思想的重任。\n\n为此，我们将通过红军向西伯利亚的工人们证明：我们正在为奠基者的理想而战，为一个不受堕落侵蚀的自由工人国家而战！在这里，劳动者能健康幸福地生活，不必畏惧资本家与封建领主的剥削压迫。\n\n我们将为托洛茨基主义奋战到底！"
 NTG_for_the_motherland: "为祖国而战！"
 NTG_for_the_motherland_desc: "The Rodina（祖国）。她曾骄傲地屹立在第聂伯河岸至符拉迪沃斯托克的广袤疆域上，如同照耀全球的社会主义明灯。\n\n然而希特勒匪帮及其爪牙的入侵，将她从地图上、从她曾屹立的世界舞台中彻底抹去。她的领袖们抛弃了她，或为私利利用她。她倒下了，化为覆盖这片荣耀疆域的黑暗废墟。\n\n我们绝不容忍这种不公不义的错误继续存在。祖国诞生于每个居住在前苏联土地上的公民心中，作为她的儿女，恢复祖国自然疆界是吾等义不容辞之责。"
 NTG_arise_fellow_russians: "觉醒吧，同胞们！"
 NTG_arise_fellow_russians_desc: "尽管革命事业与托洛茨基主义对我们运动至关重要，但另一个关键因素是俄罗斯人民。\n\n俄罗斯人——或许是几个世纪来最坚韧、最饱经沧桑的民族，依然保有为自己伟大事业、自由与解放而战的精神。我们熬过沙皇的漫长暴政，挺过内战烽火，承受法西斯入侵的恐怖，经历联盟解体的阵阵剧痛，如今又面对破碎山河上的新动荡时代。我们已失去祖国衣钵的守护权，任由反动势力趁虚而入，他们一旦得势必将给人民带来更深重的灾难。这种局面决不能以任何形式延续。\n\n因此，我们的社会主义运动将强调俄罗斯人在实现祖国革命解放中的角色。在组织框架内，我们将植入重振受压迫的俄罗斯人与抗击纳粹的核心理念，以此招募工人与士兵为革命而战。\n\n请放心，我们会确保宣传基调不与赤裸裸的民族主义和种族优越论同流合污。但在前进道路上，俄罗斯的工人、农民与士兵的力量必将得到彰显。"
 NTG_proletarians_of_the_world_rise_up: "全世界的无产者，联合起来！"
 NTG_proletarians_of_the_world_rise_up_desc: "苏维埃联盟曾是自由工人国家的典范，是我们解放全世界勤劳忠诚的劳动人民最接近成功的实践。我们曾有机会将理想传播至七大洋，梦想着消除世间一切不公与暴政。\n\n但这个梦想先被一国社会主义的支持者窃取，而后又遭德国战争机器彻底摧毁。共产国际的瓦解使得帝国与专制政权得以肆无忌惮地压迫工人与无产者。我们绝不能再容忍这种局面！决不能坐视同胞工人们惨遭屠戮！\n\n我们将号召田间地头的劳作者们、工厂车间的生产者们，共同加入解放斗争。让暴君们胆战心惊，让全世界劳动者重燃希望。让我们转动历史的齿轮，呼唤全世界无产者：永久革命的曙光即将降临！\n\n全世界无产者，联合起来！粉碎禁锢我们的锁链！"
 NTG_for_it_is_our_duty: "因为这是我们的责任..."
 NTG_for_it_is_our_duty_desc: "西伯利亚的统一已指日可待，无论我们是否做好准备。敌人在边境陈兵列阵，战争机器蓄势待发，只待冲突爆发便会汹涌扑来。\n\n在这风起云涌的关键时刻，公民责任显得尤为重要。从生产线上的普通工人们，到工人议会选举的代表们，从集体农庄的农民们，到戍守边疆的战士们。\n\n国家通过福利制度保障了他们的劳动成果，作为回报，他们也将为国家奉献力量，为社会主义事业而战。\n\n联盟对公民的社会责任有着神圣期待，每个人都必须铭记：无论男女老幼，都应以自己的方式报效国家。"
 NTG_to_stand_and_fight: "...誓死奋战！"
 NTG_to_stand_and_fight_desc: "目前，红军已成功挫败敌人的进攻，并展开了解放大片领土的军事行动。这些地区曾长期遭受资产阶级独裁者和封建军阀的统治。\n\n我们的战士英勇作战，捍卫着社会主义堡垒，抗击一切企图奴役我们的敌人。他们选择以勇气和坚韧为国家而战。\n\n从中西伯利亚统一战役开始至今，英勇的红军战士们始终保持着高昂斗志。他们将为平等与社会主义的旗帜奋战到底，让红旗从托木斯克到坎斯克，插遍西伯利亚每座城市！"
 NTG_the_question_of_control: "控制权的问题"
 NTG_the_question_of_control_desc: "自我们宣告成立公社以来，那些在中西伯利亚战争混乱中分裂出去的复仇主义者、资本家与假社会主义者，始终将我们视为待宰羔羊。\n\n如今，在完成军队、工业与社会的全面改革后，是时候证明他们的错误了。但还有一个关键问题亟待解决——如何处置我们的敌人？\n\n新征服的土地需要妥善整合，不仅要建立行政体系实施管控，更要防范可能的叛乱。这引出了一个根本性问题：被我们推翻的旧政权将面临怎样的命运？\n\n谢多夫已要求下塔吉尔中央委员会就以下事项作出决议：如何确保党的理想与治理原则，巩固地区控制权，以及战败政权的处置方案。\n\n为保障战时稳定，我们必须尽快决策，方能确保对该区域的绝对掌控。"
 NTG_a_necessary_evil: "必要之恶"
 NTG_a_necessary_evil_desc: "在这片曾经的联盟土地上，盘踞着腐蚀数万俄罗斯人思想的恶性肿瘤——反动思想。\n\n这条反动九头蛇仍未彻底消灭。如同希腊神话所述，它长着多个头颅：第一个是为利润杀人的资本窃贼，第二个是以纯洁之名行凶的法西斯，第三个是假借神明施暴的神权者，第四个是奉王权屠戮的保皇党。\n\n这头怪物在祖国大地投下阴影，在它夺取更多生命前，我们有责任斩除这头腐兽。为此，公社将实施全面安保肃清措施：赤卫队与后方营将驻防反动思潮滋生的城镇，以铁腕手段清除顽抗分子。\n\n若要建设工农平等共荣的联盟，就必须施行必要的革命恐怖，根除暴力反动势力。"
 NTG_peace_over_violence: "以和止戈"
 NTG_peace_over_violence_desc: "“若受托治理人民，当以人道待之”——米哈伊尔·加里宁同志在革命初期的这句箴言，至今仍振聋发聩。\n\n不同于内战时期联盟的征服行动，我们不能再像土匪般肆意劫掠——这片土地早已饱受匪患摧残。为彰显我们与流寇的本质区别，必须关注并满足公社治下万千新子民的需求。\n\n自此，苏维埃的行为准则将探索并优先采用和平手段进行占领与整合。新解放区的民众将免受劫掠迫害之苦，我们将确保红军始终是革命解放力量，而非帝国主义屠刀。\n\n在推进区域统一的进程中，新苏联将始终恪守“以和止戈”的准则。"
 NTG_law_and_order: "法律与秩序"
 NTG_law_and_order_desc: "在征服区及下塔吉尔本埠屡遭反革命恐怖分子袭击后，我们清醒认识到：必须采取更坚决的手段，才能彻底肃清这些反社会主义毒瘤。\n\n经与红军高层及内务部门深入研讨，谢多夫总理宣布即刻实施全新安保条例，旨在将保皇派、资产阶级及反动分子连根拔除。\n\n新措施包括：追加安保预算、向城市增派军警联合巡逻队，以及在反革命活跃区实施全域宵禁。\n\n这些临时性安全法案，将为地区稳定与秩序重建提供保障。中央主席团承诺：待中西伯利亚之敌彻底肃清之日，即是特别法案废止之时。"
 NTG_forgive_the_unforgiven: "赦不可赦"
 NTG_forgive_the_unforgiven_desc: "对于政治犯处置，我们既往政策不外乎监禁、劳改乃至极刑。\n\n但随着祖国统一战役推进，在押政治犯数量激增四倍，迫使我们必须寻求新的绥靖之策。\n\n在主席团改革派与温和派主导下，我们将对数千名新占领区在押军官启动改造计划。\n\n此项改造仅适用于经严格审查的合格对象，严防反动分子与堕落者混入红军队伍。\n\n尽管强硬派代表声称这将导致军队腐化，但他们的反对注定徒劳——若要铸就真正牢不可破的联盟，就必须在原则范围内，向迷途羔羊展现革命者的人道光辉。"
 NTG_we_shall_fight_for_justice: "为了公义而战..."
 NTG_we_shall_fight_for_justice_desc: "当德意志的铁蹄践踏祖国，当西俄战争失败后的权力倾轧撕裂联盟，我们便坠入了无政府的深渊。在这片充斥着土匪、压迫者和掠夺者的荒原上，投机军阀趁势而起，在混乱中割据称王。\n\n这无政府状态带来了深重苦难：土匪掠夺者横行无忌，各军阀政权对治下工农犯下罄竹难书的罪行。这些暴行是对全体下塔吉尔人民的挑衅，我们绝不继续容忍！\n\n如今我们已更强大——整装待发的军队与觉醒的公民，都准备在这西伯利亚荒原上为正义而战，将迫害人民的罪魁祸首绳之以法。\n\n从今往后，我们将为受资本家及其走狗压迫的工人而战！为遭强盗劫掠的民众而战！为捍卫无产阶级神圣尊严而战！\n\n我们为人民正义而战！"
 NTG_and_the_union: "...还有联盟！"
 NTG_and_the_union_desc: "红军战士的斗志不仅源于对正义的追求。\n\n许多战士投身入伍，是为保护家园亲人，为确保妻儿能在我们的红旗下安居乐业；在这里，人人温饱无忧，居有定所。\n\n正是这些理想，激励战士们为公社事业挺身而战。为家人，为明天，为红旗下的新生活。这些朴素的信念，将驱使他们为我们致力重建的联盟浴血奋战。\n\n1918年，他们的父辈曾创造奇迹；今天，他们将再次续写传奇！"
 NTG_a_red_siberia: "红色西伯利亚"
 NTG_a_red_siberia_desc: "历经严冬风雪，跨越平原战场，伴随战争的恐怖，我们英勇粉碎敌人，最终完全控制中西伯利亚。\n\n随着红军战胜那些战败诸国的军队，各城市再次飘扬着鲜艳的红旗。我们回到了先辈们曾经出发的地方。\n\n如今我们必须着眼当下、展望未来，整顿行政体系，将目光投向远东土地。重建发展新占领土，推进治愈与统一的进程，为恢复联盟而战，并在塞多夫总理的带领下，巩固我们对共和国的新统治，共同迈向光辉的新起点。。\n\n同志们，光明的未来在等待我们！联盟万岁！塞多夫总理万岁！"
 NTG_intro.1.t: "革命之父"
 NTG_intro.1.d: "列夫坐在桌前，目光投向窗外，俯瞰着下塔吉尔的景象。父亲辞世已近十年，纵使父亲仍在，这段岁月也绝不会轻松。倘若列夫·托洛茨基目睹俄国如今的这般光景——反动派、法西斯败类以及革命的叛徒几乎遍布每个角落——他定会惊骇万分。当然，他的父亲想必早已运筹帷幄，推动革命滚滚向前。\n\n可俄国自身尚且满目疮痍，又何谈推动世界革命？他们甚至连西伯利亚的革命都无力推进。谢多夫清晰地记得童年的一幕：父亲在莫斯科各处奔走不息，竭力争取数十名同仁与各个工会，而年幼的列夫则始终寸步不离地跟在父亲身后。父亲身上蕴藏着一股儿子自觉永远无法企及的魄力。那些能让托洛茨基热血沸腾的组织工作与雷厉风行的直接行动，到了列夫这里，却只剩下疲惫与茫然不知所措。\n\n但父亲是对的，社会主义必须不断跨越国界，这至关重要。在静谧的时刻，老列夫会激情澎湃地谈论那些可以将社会主义推向的地方：印度支那和黎凡特，拉丁美洲和不列颠，乃至德国。主席从座位上站起身，立于窗前，俯瞰着街道——那里车水马龙，工人们行色匆匆，在衣物的边角处，都尽可能地缀着一抹鲜红。列夫苦涩一笑。父亲或许已不在人世，他若目睹今日下塔吉尔乃至整个俄国的境况，也绝不会感到欣慰。但列夫也绝不会让他失望。"
 NTG_intro.1.a: "父亲，我不会辜负您的…"
 NTG_intro.2.t: "往昔…"
 NTG_intro.2.d: "下塔吉尔市的中心，列夫·谢多夫独自静坐桌前，沉浸在对父亲，亦是他的前辈，列夫·托洛茨基思想的深深思索之中。他回想起那个世界曾被法西斯的狰狞威胁所笼罩的时代，那个他父亲的思想曾是受压迫群众希望灯塔的时代。托洛茨基临终的遗愿，便是希望谢多夫能够继承其未竟的事业，将革命推向新的高峰。在忠诚同志们的协助下，谢多夫解放了下塔吉尔，开始为一个和平与繁荣的新时代铺平道路。\n\n岁月流逝，谢多夫不懈的努力为这片混乱的地区带来了稳定，并付诸实施了许多他父亲生前未能亲手实现的革命理念。谢多夫继承了不断革命的纲领，为工人与受压迫者的权利而不懈奋斗，并重申了他对世界革命的承诺。微风吹拂着他的发梢，他眺望着整座城市，心中明了，父亲定会为他所成就的一切，这唯一合法的革命，这不断革命而感到自豪。他继承了托洛茨基主义的遗产，并将理论付诸实践。\n\n当夕阳沉入地平线，夜幕降临下塔吉尔，谢多夫闭上双眼，深深吸入那刺骨的寒气。在同志们与下塔吉尔人民的支持下，他将继续为不断的革命而战，将父亲的革命精神火炬传递给未来。"
 NTG_intro.2.a: "我们将实现社会主义！"
 NTG_intro.3.t: "…当下..."
 NTG_intro.3.d: "下塔吉尔的夜色宜人却也深沉。谢多夫伫立片刻，俯瞰着这座他与他的政党已统治多年的城市，享受着微风拂面的惬意。这座古老的城市，是祖国少数几座未被法西斯战火吞噬的宏伟都市之一，尽管它依然裹挟着残酷的现实。\n\n尽管谢多夫初抵下塔吉尔时曾满怀憧憬，但他不得不向自己承认，此地可谓一塌糊涂。无论街头巷尾树立起多少红色的旗帜，无论墙壁上张贴了多少托洛茨基主义的宣传海报，这座城市依旧是一个灰暗且令人失望的城区。\n\n但谢多夫内心深处依然怀揣着希望——希望这座城市能被无产阶级的烈焰所重铸，克服周遭军阀混战所滋生的贫民窟景象，它将成为真正革命的灯塔。为这理想化的前景更添一笔的是，近期的经济改革已初见成效，就业岗位不断增加，该地区的贫困状况也终于开始有所缓解。\n\n但谢多夫依旧清楚，前路漫漫。他比任何人都清楚，不能天真地以为这就是终点。不，他知道这片广阔的城市区域蕴藏着更大的潜力，有更多尚待发掘。革命尚未能完全唤醒这座城市的生机。随着苏维埃的扩张，向那些该死的军阀们进军，下塔吉尔必将成为一座璀璨的灯塔，一个苏维埃文化的中心，一个社会主义的乌托邦。\n\n但这都是后话了，谢多夫提醒自己。他必须立足当下，开始为他所构想的最终目标铺路搭桥。当他结束思绪，转身准备走回办公室时，又最后一次望向阳台之外——俯瞰着散落在钢筋水泥丛林中的点点灯火，他仿佛看到了辉煌的未来正在前方等待。"
 NTG_intro.3.a: "因为革命将点亮世间的奇迹！"
 NTG_intro.4.t: "…以及未来"
 NTG_intro.4.d: "列夫有时会自问：未来的俄国应当是怎样的？当然，两个词立刻浮现在脑海：自由与公正。但这些词语的真正含义又是什么呢？每个人都认为自己的政权最为公正，而关于自由的观点更是数以百计，莫衷一是？\n\n未来俄国的自由是什么？是随心所欲的能力吗？是在选举中投票给骗子，还是从自己的人民身上攫取利润的自由？不，不应如此。一个人，当他能以任何方式实现自我价值时，才是真正自由的。归根结底，是劳动使猿进化为人。在未来的俄国，每个人都将有机会成为他心目中的自己，以便用他所擅长的方式贡献社会。\n\n那么，未来俄国的公正又将是怎样的？它会是一个被谎言家们用作挡箭牌的华丽辞藻吗？世间的权贵会凭借他们的财力将其推向幕后吗？不，当然不。每个人都将拥有平等的机会，而国家将确保每个人都享有这一权利。不存在基于性别或民族的歧视。不存在利益分配上的不公。每个人都将得到他通过自身努力所应得的一切。\n\n这是最早的社会主义理论家们所梦想的宏伟蓝图。无数的实验最终都以失败告终。但或许，正是托洛茨基的思想，将成为那把开启通往光明未来之路的钥匙？"
 NTG_intro.4.a: "唯有时间能给出答案…"
 NTG_intro.5.t: "哀恸"
 NTG_intro.5.d: "今天的天气为何如此糟糕？该死的降水让车辆无法通行。有时即便身份特殊也无济于事。大自然根本不在乎你是谁、你的亲人遭遇了什么、你正为何事奔波。它更不会在意娜塔莉娅·塞多娃已病危垂死，而列夫正心急如焚地赶往她身边。一通电话让他冲出办公室，跳上了最近的那辆卡车。\n\n当老旧卡车刚停稳，列夫便子弹般跳下车冲向医院大楼。剧烈的心跳声盖过了呼啸的风声和警卫们的喊叫。血液在他头颅里奔涌抽痛，但他无法停下脚步。他绝不能迟到，必须及时赶到。\n\n列夫如飓风般冲进病房，地板上散落着从国外带来的各种药物。主席一个箭步冲到娜塔莉娅·伊万诺夫娜的病床前。“妈妈，妈妈，您听得见吗？！”他情绪失控地喊道。当他抓住母亲的手，随即瘫软地跌坐在地——那只手早已冰凉。他迟了一步。泪水从这个男人的脸上滚落下来。"
 NTG_intro.5.a: "他甚至没来得及见她最后一面……"
 NTG_intro.6.t: "最后的告别……"
 NTG_intro.6.d: "并非每个人都能享有国葬的哀荣。毕竟在俄罗斯，每天都有数十人死去——或病亡，或中弹。无数人的命运终将被历史遗忘。但此刻，谁又能责备一个刚刚失去母亲的儿子呢？\n\n葬礼严格遵循东正教仪轨举行。或许列夫憎恶宗教，但他不能违背母亲的临终遗愿。当神父将泥土撒向白色裹尸布后，棺盖便永远合上了。这是谢多夫最后一次见到母亲。棺木缓缓降入墓穴时，这位主席完全陷入了沉思。\n\n连日来，悲痛如同溃烂的伤口，从内部啃噬着列夫的理智。但他最终明白：自己已无暇沉溺。他没能及时挽救至亲，但此刻行动，还能拯救多少生命？多少母亲与孩子将因他的决断而得救？这或许是场惨痛却必要的教训。等待的时刻，该结束了。"
 NTG_intro.6.a: "是时候行动了！"
 NTG_presmuta.1.t: "忆往昔"
 NTG_presmuta.1.d: "谢多夫难得偷得片刻清闲——这样的时光对他来说实在稀少。他打开一瓶上好的伏特加，细细品味起来。经过又一个与那些顽固派就工业改革问题彻夜谈判的不眠之夜，他确实需要这瓶酒来放松。想到那些家伙在会上暴跳如雷的样子，谢多夫差点又怒火中烧。\n\n当他正提醒自己要审阅边境东部无政府主义袭击的报告时，思绪却不自觉飘向过去，飘向那个联盟，飘向他的父亲列夫。他忆起父亲那些激昂的演讲，如何在数百万即将觉醒的布尔什维克心中点燃赤色火焰；想起父亲如何将保皇党和黑男爵一路赶至堪察加半岛；又想起布哈林如何带着他那愚蠢透顶的市场社会主义理念，把整个联盟搅得天翻地覆。即便当西边的法西斯恶魔粉碎了联盟，布哈林不知逃往何处时，父亲仍在西伯利亚的广袤土地上坚守阵地，重整旗鼓准备向德国人反击。他记得当战线崩溃、更多同志倒在德军铁蹄下时的悲痛；更记得斯大林和卡冈诺维奇临阵脱逃导致前线溃败时，自己心中燃起的滔天怒火。\n\n如今，谢多夫肩负着确保兄弟姐妹们的牺牲不会白费的使命——要光复联盟，让红旗再次在祖国上空骄傲飘扬，让父亲为他骄傲。\n\n不过此刻，他得先喝上一杯。"
 NTG_presmuta.1.a: "路漫漫其修远兮……"
 NTG_presmuta.2.t: "革命之父"
 NTG_presmuta.2.d: "坐在办公桌前，谢多夫的思绪又不由自主地飘远——自从担任总书记以来，有个问题始终困扰着他：\n\n父亲会怎么做？\n\n当联盟解体后面对这个军阀割据的残局时，那位下塔吉尔全民敬仰的共产主义实践者、列夫·托洛茨基会如何应对？\n\n其实谢多夫根本无需费力揣测父亲的态度。他清楚记得父亲对布哈林、斯大林、亚戈达的憎恶，仔细想来，父亲对那群在法西斯铁蹄踏进莫斯科前把持联盟政权的官僚们几乎都深恶痛绝。\n\n尽管父亲也有缺陷，但在谢多夫心中，他始终是联盟唯一的救世主。那些理论与著作若得以正确实践，不仅能重建联盟，更能让列宁与马克思的精神传遍全球。因此，他必须让自己的思维与父亲同频——成为一台在暴政面前永不停歇的进步引擎。俄罗斯人民需要的领袖应当谦逊而不卑微，谨慎而不多疑，勇敢而不鲁莽。谢多夫明白，只要继承父亲的思想，即便不冠其姓氏，自己也足以胜任这些要求。\n\n那么该从何处着手？沉思片刻后，谢多夫突然想起父亲临终赠予的珍贵遗物。他起身走向书架，从最深处取出一本布满灰尘的旧书。拂去封面的积尘，父亲的黑白照片赫然映入眼帘，下方印着醒目的书名：《被背叛的革命》。他重新落座，翻开书页，开始潜心阅读。"
 NTG_presmuta.2.a: "父行子效。"
 NTG_presmuta.3.t: "铭记斯派之罪"
 NTG_presmuta.3.d: "“同志们！”\n\n谢多夫的声音在大厅中回荡。代表们早已齐聚，在会议厅内落座。\n\n“在今天召开的年度党代会上，我有一篇特别的讲话。”\n\n“距我们彻底击败保皇党、巩固政权，使新生的国家在世界舞台上站稳脚跟，已过去近四十年。”\n\n他停顿片刻。\n\n“但我们不曾察觉，革命队伍中早已混入叛徒和阴谋家，尤其是约瑟夫·斯大林这个头号叛徒。”\n\n“他在布哈林总理缺席期间发动政变，镇压一切反对声音，还利用职权在内阁和军队高层安插亲信，彻底断送了我们击退外敌的机会。”\n\n会场泛起低语，又归于沉寂。\n\n“他的罪行不可饶恕，是对联盟犯下的最深重罪孽——正是他煽动分裂，导致国家支离破碎。这些背叛行径给人民带来无尽苦难。因此，任何与斯大林有牵连的成员，都将受到正义审判。”"
 NTG_presmuta.3.a: "喝彩与咒骂同时响起。"
 NTG_presmuta.4.t: "宽恕布哈林主义者"
 NTG_presmuta.4.d: "谢多夫继续向大会代表们发表演说。他对斯大林及其追随者的批判早已传遍四方，此刻，他的矛头转向了那个导致联盟崩溃的人。\n\n“我知道，我们许多人认为革命是被一个人，尼古拉·布哈林背叛的。”\n\n谢多夫长叹一声，继续他的演讲。\n\n“尽管尼古拉·布哈林的政策最终导致联盟的瓦解，但他的初衷并非毫无道理。他在内战恢复期推行的“西伯利亚计划”和工业化尝试，其贡献不可忽视。他曾协助伟大的列宁同志实施新经济政策，帮助国家复苏。尽管历经艰难，他的努力不应被全盘否定。”\n\n他停顿片刻，因为他知道，自己的父亲也曾支持过这些政策，尽管后来有所批评。\n\n“我们绝不能忘记，真正葬送联盟的最后一击，是斯大林发动的政变。正是这场动乱，让我们的联盟四分五裂，使人民陷入多年的苦难。而非仅仅归咎于一人之过。尼古拉·布哈林的本意，是希望人民在工业化进程中走向繁荣与幸福。\n\n因此，我们必须宽恕布哈林主义的同志们。他们只是被误导了，误以为自己在践行列宁的愿景。唯有如此，才能弥合党内的裂痕，团结一致，让我们的联盟重归世界舞台。"
 NTG_presmuta.4.a: "很快，大会爆发出赞同的呼声。"
 NTG_presmuta.6.t: "为了祖国"
 NTG_presmuta.6.d: "广播中，《国际歌》的旋律渐渐淡去，信号切换至主席团大楼内谢多夫的直播讲话。\n\n他深吸一口气，对着话筒向全体下塔吉尔人民宣告：\n\n“同志们！红军战士们！指挥员与政委们！男女工人们！集体农庄庄员们！知识分子同志们！兄弟姐妹们！\n\n我代表布尔什维克党，祝贺我们共同取得的成就；在如此短暂的时间里，我们便从数十年的停滞中复苏，改善了生活。”\n\n谢多夫停顿片刻，目光扫过创造这一奇迹的经济专家们，继续演讲：\n\n“但胜利之下，危机犹存。近来，周边反动势力活动猖獗，更有传言称他们正在集结军队，企图在开春时摧毁我们的生活方式。”\n\n他微微颔首，向坐在角落的军人们致意：\n\n“在识破这些反动阴谋并积极备战的同时，让我们铭记：必将清算反动派带给我们的失败！过去五年，我们白手起家建设的一切——在这黑暗降临之际，我们誓死捍卫！\n\n我呼吁你们，亲爱的同志们，共同守护列宁留给我们的遗产。我们必将让光荣的联盟，重归世界之巅！”\n\n“在列宁的旗帜下，向胜利前进！”\n\n演讲在雷鸣般的掌声与欢呼中结束。"
 NTG_presmuta.6.a: "“光荣祖国万岁！为自由而战！”"
 NTG_presmuta.7.t: "如何处置温和派？"
 NTG_presmuta.7.d: "主席团成员在党中央总部召开月度会议。\n\n这原本是讨论国家事务的例行程序。当众人围坐长桌旁，拉狄克在议程中突然提出新议题：\n\n“同志们，我们必须讨论无政府状态中诞生的新社会阶层——温和资产阶级。他们可能威胁我们的统治，但其学识又是国家科研教育不可或缺的。他们的命运该如何决定？”\n\n沉默中，弗拉基米尔·奥夫谢延科率先打破僵局：\n\n“内战时期的经验很明确：没收财产，通过劳动改造进行思想灌输。收缴的资金可填补公共建设缺口。”\n\n这番话立即遭到奥波科夫和斯米尔加的激烈反驳：\n\n“这种粗暴手段会葬送在西伯利亚重建社会主义的可能！现在不是1917年了，这些人也不同往日。他们多是专业人才，应当保留。我们只需通过革命教育确保其忠诚。”\n\n会场顿时爆发激烈争论，最终形成两大阵营。拉狄克敲桌制止：\n\n“同志们安静！既然存在改造整合与劳动教化两种意见，就请谢多夫总理裁决吧。”"
 NTG_presmuta.7.a: "“奥波科夫和斯米尔加同志是正确的。我们将保留他们，但必须进行社会主义优越性教育。”"
 NTG_presmuta.7.b: "“奥夫谢延科同志的方案更妥当。没收资产，让他们为国家建设填补人力缺口。”"
 NTG_presmuta.8.t: "红军之基石"
 NTG_presmuta.8.d: "红军诞生于十月革命的烈火中，由托洛茨基亲手创建，为击败沙皇势力与白军而战。\n\n弗拉基米尔·安东诺夫-奥夫谢延科深知这段历史。但当他审视当下时，这位老战士敏锐察觉到了异常——下塔吉尔的红军出了问题。\n\n“阿列克谢耶夫，告诉我，你认为我们光荣的红军存在什么问题？”他凝视着训练场，“坦白说，你有畅所欲言的权利。”\n\n阿列克谢耶夫从办公桌前起身汇报：\n“多数人宁愿加入民兵也不愿参军，导致民兵强盛而正规军衰弱。”他稍作停顿，在奥夫谢延科示意下继续：\n“战术思想严重落后，装备全靠中西伯利亚战争和对德作战的缴获。除了战至最后一兵一卒，我们根本没有应对入侵的预案。”\n\n“观察得很透彻。”奥夫谢延科转身面对他：\n“解决之道在于：让更多战士在红旗下接受正规训练，制定主动出击的战略，为红军确立共同奋斗目标，同时统一指挥体系。唯有如此才能根除隐患。”\n\n奥夫谢延科点头表示赞同，随后再次开口。"
 NTG_presmuta.8.a: "“阿列克谢耶夫，看来你已为我们新红军奠定了基石。”"
 NTG_presmuta.9.t: "军官训令"
 NTG_presmuta.9.d: "三列新兵站在阅兵场上，行囊堆在脚边。运送他们的卡车早已驶离——从今天起，他们将接受军士长们的严苛训练。\n\n“早啊，新兵蛋子们。”沙哑的嗓音划破寂静。\n\n听到这陌生的声音，新兵们条件反射般挺直腰板。\n\n“你们被征召来履行一项使命——保护家人，捍卫我们的生活方式。”\n\n军官扫视着人群，有些人正为被迫离家而皱眉。\n\n“我知道你们有人不满：要远离亲友，要当兵卖命。但如果不是你们，谁来阻挡那些土匪和强奸犯？”\n\n“未来三个月，我不会粉饰你们将经历的考验。它们会打磨你们，塑造你们。我相信——”军官突然提高声调，“你们终将成为当年横扫西俄法西斯防线的那支铁军！”\n\n“今天分配营房，明日开始训练。记住，新兵们—"
 NTG_presmuta.9.a: "—联盟感谢你们的服役。”"
 NTG_presmuta.10.t: "新红军"
 NTG_presmuta.10.d: "阿列克谢耶夫对军队现状心知肚明。这位前内务人民委员部军官深谙情报分析之道，此刻正凝视着桌面的报告——在奥夫谢延科支持下就任军事副委员的他，比谁都清楚下塔吉尔红军的致命软肋：那些锈迹斑斑的装备根本打不赢下一场战争。\n\n雪片般的文件堆满办公桌。老将军日渐衰颓，多数时日只能居家休养，将权柄移交给他。数据报表上的数字看似乐观，但装备代差的阴影始终萦绕心头。\n\n窗外西伯利亚的积雪覆盖原野，他恍惚间又看见卫国战争中被钢铁洪流碾碎的红军身影。远东法西斯匪帮、克麦罗沃的疯子僭主、还有那些在秋明鼓吹斯大林路线的叛徒...这些幽灵正在冻土带另一端虎视眈眈。\n\n指节在实木桌面上叩出闷响。怒火灼烧着阿列克谢耶夫的胸腔，既然奥夫谢延科将改革重担托付给他，纵使赌上性命，他也要让红军浴火重生。"
 NTG_presmuta.10.a: "次日清晨，这份文件将送达谢多夫案头，并被签署生效。"
 NTG_presmuta.11.t: "普列奥布拉任斯基计划"
 NTG_presmuta.11.d: "尽管年事已高，普列奥布拉任斯基始终是个野心勃勃、精力旺盛的人。谢多夫也不例外；在这艰难时世里，他们都不过是勉强存活的老人。当谢多夫坐在办公桌前时，他对财政部长提出的计划将信将疑。但仍听着普列奥布拉任斯基以乐观语调阐述改革重建国家的蓝图。\n\n“我和经济部的同志们历时数周制定这项计划，”普列奥布拉任斯基以昂扬的声调开始演说，“相信必将为我们这个虽小却坚强的联盟带来新的黄金时代。方案包括对工业部门的投资改革，以及集体化技术的改进。”他越说越自信，手势也变得有力。谢多夫突然直起身子，示意他继续。\n\n“首先要把国家支出的重头划拨给工业部门，不仅要扩建城市，更要提高物资产量。其次必须推行改良的集体化进程，为国家提供更充沛的资源。最后我们将投资民用领域，让低级经济区从零开始建设，从而建立更强大的内部流通体系，改善人民生活。这只是整体规划的简版，如果您需要查看细节——”\n\n“批准。”谢多夫打断道，脸上混杂着诧异与困惑。\n\n“您连民用提案都通过了？”普列奥布拉任斯基难以置信。\n\n“不，是整个计划。下塔吉尔的发展工作，政府里我只信任你一人。所以你的方案将获得全权推行。”"
 NTG_presmuta.11.a: "没有意见？很好，立即开始执行。"
 NTG_presmuta.13.t: "补给线"
 NTG_presmuta.13.d: "市中心排起了长队，共产党总部外的空地上尤其拥挤。男女老少列队等候，领到物资的人匆匆离开，带着配给品走向归途。\n\n官员们核对着身份证件，分发剩余食品、日用品和只能在城内少数国营商店使用的代金券。\n\n谢尔盖盯着自己的证件。他希望能领到足够养活小家庭的份额。\n\n“维亚奇托夫同志，国家已确保您家庭的温饱。”发放物资的干部说道，“您家能领取额外配给，作为机械师的工作还能获得少量货币补偿。国家感谢您的贡献。”\n\n谢尔盖收好东西，松了口气。谢天谢地，家人暂时不用挨饿了。他仔细清点着到手的物资，嘴角浮现笑意。"
 NTG_presmuta.13.a: "或许情况真的在好转。"
 NTG_presmuta.14.t: "劳动果实终显现"
 NTG_presmuta.14.d: "与往日不同，谢多夫对即将开始的会议难得地充满热情——试问谁又能不兴奋呢？经济计划（被当事人戏称为“普列奥布拉任斯基方案”）几乎在各方面都取得了巨大成功。放眼望去，下塔吉尔的经济不仅日益强健，更已超越周边军阀割据地区的经济水平，这无疑昭示着苏维埃未来的繁荣景象。\n\n谢多夫正沉浸在这般理想主义的思绪中，普列奥布拉任斯基终于携一名助手步入会议室，手中捧着记录过去一年增长数据的各类文件与图表。这位财政部长以一段演说开启了会议：\n\n“同志们，过去数月间，下塔吉尔的各项国家机构都经历了积极革新。我们的工业与原材料产量显著提升，部分经济中心报告工厂生产率增长近三倍。经济改革大幅提高了苏联男女工人的就业率与工资水平，贫困率全面下降。”\n\n苏维埃核心圈成员们报以雷鸣般的掌声，谢多夫本人也因这成功而心潮澎湃。当普列奥布拉任斯基继续发言时，这股自豪感仍在持续高涨：\n\n“虽然收复祖国的事业仍任重道远，但当前成果证明，我们的联合政策与规划必将带领我们建成近乎乌托邦的国度。汇报完毕——联盟万岁！”这最后一句庄严口号在会议室墙壁间回荡，全体政府成员齐声应和。"
 NTG_presmuta.14.a: "普列奥布拉任斯基，你这牛逼的混球！"
 NTG_presmuta.15.t: "燃油短缺"
 NTG_presmuta.15.d: "试车场上，卡车喷吐着刺鼻的浓烟。少校望着摩托化步兵在旷野中疾驰而过。\n\n“长官，恕我直言，这仍是个糟糕的主意。”一名军官紧握着记事板说道，“我们搜遍所有隐蔽仓库和补给站，能找到的燃油十分有限。一个摩托化部队一天就能耗尽所有库存，如果运气好的话。”\n\n“你的意见已收到，同志。”少校头也不回地回答，“但要想对敌人取得优势，这是必要之举。我问个简单的问题：士兵一天能行军多远？”\n\n“每天20到40公里，少校同志。”\n\n“那这些卡车加满油能跑多远？”\n\n“约150至200公里，少校同志，如果一切正常的话。”\n\n“所以总参谋部才要试验摩托化方案。有了摩托化师，我们就能省下士兵的血汗，不必在深雪中徒步进攻，让卡车载着战士们穿越地形。”\n\n少校从观测台上举起望远镜，看见卡车骤停，步兵鱼跃而下展开进攻演练。他放下镜筒，意味深长地说道："
 NTG_presmuta.15.a: "这些部队总有一天会开进莫斯科"
 NTG_presmuta.16.t: "铁翼重振"
 NTG_presmuta.16.d: "阿尔谢尼·沃罗热伊金和伊万·阔日杜布凝视着眼前的空军基地。机械师们正在抢修停机坪上的战机。\n\n“比不上咱们当年的家伙，但也够用了。”\n\n沃罗热伊金看着机械师们调试的飞机，这些被西伯利亚风雪掩埋的钢铁之鹰。整个基地完好得像个奇迹：封存的战机有的直接停在机库，有的还装在板条箱里。现在，它们正被重新赋予翱翔蓝天的资格。\n\n“你觉得咱们还能再飞上天吗，阿尔谢尼？”阔日杜布望向基地旧食堂里集结的飞行员和志愿兵。\n\n“我这把老骨头怕是不行了。”沃罗热伊金提起装满飞行训练笔记的沉甸甸公文包，“但我会让你的飞行员们达到我们当年的水准。”\n\n他拍了拍老战友的肩膀：\n\n“走吧，该给雏鹰们上课了。”"
 NTG_presmuta.16.a: "两位王牌转身离去，身后将崛起新的苍穹卫士。"
 NTG_presmuta.17.t: "惊人之笔"
 NTG_presmuta.17.d: "“如果我没理解错的话，尼古拉·尼古拉耶维奇，你是在提议允许公民创办私营企业？”谢多夫将牛皮纸文件夹重重扔在办公桌上。\n\n“正是，列夫·列沃维奇。根据这个提案，未来这将推动我国经济达到新高度。”\n\n辛亚夫斯基站在谢多夫办公室里，接受着关于他提交给全联盟布尔什维克共产党中央委员会的质询，那份允许公民组建合作社或劳动组合的提案。按照尼古拉·伊诺泽姆采夫的构想，这些企业实质上将成为私营性质。尽管违背党的路线，但伊诺泽姆采夫坚信这会结出硕果。\n\n“你竟敢提议向市场经济迈进一小步。很清楚主席团会作何反应吧？”\n\n“是的，列夫·列沃维奇。如有必要，我准备在主席团会议上坚持到底。相信这将提升人民生活质量。”\n\n谢多夫凝视着这位年轻经济学家，长叹一声终于让步：\n\n“好吧，尼古拉·尼古拉耶维奇。我会向主席团提出此事。但念在你作为年轻有为的经济学家，提醒你：做好在直属上司叶夫根尼·阿列克谢耶维奇·普列奥布拉任斯基面前辩护的准备。”\n\n伊诺泽姆采夫并未被总书记的话震慑：\n\n“我会做好准备，列夫·列沃维奇。必将捍卫我的主张。”\n\n“很好。你可以走了，伊诺泽姆采夫同志。”"
 NTG_presmuta.17.a: "胆识铸就成功"
 NTG_presmuta.18.t: "家传工坊"
 NTG_presmuta.18.d: "继承父亲遗志维持家庭工坊是谢尔盖的信念，但日子正变得举步维艰。老列夫在迪夫诺戈尔斯克的军工厂奉献了一生，谢尔盖仍记得父亲作为革命工人的骄傲，也记得联盟解体时他的泪水。即便如此，老人仍靠手艺开了这间工坊。\n\n谢尔盖曾向父亲承诺守住家业，如今却难以为继。过期的配给券、收音机里循环播放的三首老歌，生意比任何时候都惨淡。他意识到，只要国家持续衰败，工坊终将倒闭。\n\n正沉思时，国家经济部的公函突然送达。信笺上写着：\n\n'亲爱的维亚奇托夫同志：\n\n根据联盟经济发展与振兴新政策，您有资格获得月度补贴。望此项补助能与您对国家的服务相辅相成。如有疑问，请联系当地代表。\n\n联盟光荣 总理谢多夫万岁\n财政人民委员 谨启'\n\n惊愕、恍然、释然——谢尔盖攥着信纸的手微微发抖。他环顾斑驳破败的工坊，多年未有的希望之火在胸中重燃。"
 NTG_presmuta.18.a: "人民的新曙光"
 NTG_presmuta.19.t: "经济复兴"
 NTG_presmuta.19.d: "中央委员会主席团会议在庄严肃穆的气氛中举行。这是一次特别会议，专门讨论尼古拉·伊诺泽姆采夫提交的经济改革计划。在非官方场合中，伊诺泽姆采夫的改革方案被戏称为“回归新经济政策”。\n\n人民委员会主席卡尔·拉狄克宣布会议开始。\n\n“同志们，我们聚集在这里讨论一项重大提议。因此，我将把发言权交给政府经济改革筹备委员会主席，尼古拉·尼古拉耶维奇·伊诺泽姆采夫。”\n\n在掌声中，这位经济学家本人走上讲台。\n\n“同志们。我想首先指出，领导层中有些成员未能充分理解我的经济改革方案的本质。其核心在于，借助布尔什维克党老一辈领导的经验，恢复我国经济。”\n\n伊诺泽姆采夫停顿片刻。“我相信人民委员们还记得1921年，我们已故的​人民委员会主席​​弗拉基米尔·列宁宣布了所谓的‘新经济政策’，以及由此引发的激烈争议。必须指出，这项政策是当时局势的唯一出路。同样，在当下，我们也必须承认，除了借鉴新经济政策的某些要素开始复苏国家经济、继而提升经济增长率之外，别无他选。”\n\n礼堂内响起掌声作为回应。伊诺泽姆采夫端起手边的水杯抿了一口，开始总结改革成果，随后结束发言。\n\n“总结迄今实施的改革成果，我们看到我国经济实力正在增长。倘若人民财政委员会的领导批准我们继续推进改革，那么国家将奠定必要基础，为未来在中西伯利亚率先启动、继而推广至全俄罗斯的工业化铺平道路。”"
 NTG_presmuta.19.a: "礼堂内掌声雷动。"
 NTG_smuta.1.t: "托洛茨基主义的悖论"
 NTG_smuta.1.d: "“现在由全联盟共产党（布尔什维克）中央委员会总书记作报告。”卡尔·拉狄克的声音响彻会议室，十五位政治局委员悉数在座。列夫·谢多夫啜饮一口水，随即开始发言。\n\n谢多夫清了清喉咙，起身发言。\n\n“同志们，政治局的委员们：众所周知，俄罗斯当前的境况比1924年更为严峻。在座诸位老同志想必记得，昔日的苏维埃联盟至少尚有发动不断革命的物质基础。而今国土分崩离析，我们已丧失这种基础。”他稍作停顿，目光扫过全场，“因此，我提议采取一项争议性举措——向叛徒斯大林主义者借鉴某些理念。”\n\n叶甫盖尼·普列奥布拉任斯基闻言举手示意。在得到默许后，他抛出了众人心中的疑问\n\n“列夫·洛维奇，你这是什么意思？这简直离经叛道。”\n\n谢多夫对此早有准备，当即回应\n\n“我主张暂时借用‘一国建成社会主义’的构想。这是在考虑转向不断革命之前必要的权宜之计。也就是说，我们必须先在祖国故土巩固实力，而后才能开始不断革命，否则必将遭到碾碎。”\n\n谢多夫话音刚落，政治局候补委员尼古拉·伊诺泽姆采夫出人意料地开口了\n\n“我也许赞同列夫·洛维奇关于在俄罗斯巩固我们阵地的观点。我们都很清楚民众当下的生存状况。以经济学家的立场，我认为此刻向世界播撒共产主义火种实属不切实际。”\n\n其余政治局委员纷纷附议谢多夫。尽管这项提案离经叛道，且可能引发派系裂痕，但仅有卡尔·拉狄克弃权。\n\n“那就这样决定了。在我们向全球传播永久革命之前，我们应专注于在国内建设社会主义。”拉狄克边计票边说。“本次会议到此结束。”"
 NTG_smuta.1.a: "为了革命利益而做出的必要决定。"
 NTG_smuta.2.t: "每一个小小的努力"
 NTG_smuta.2.d: "将阿钦斯克收集中心的工作形容为“富有成效”显然言过其实——至少在米洛科夫的评判标准下如此。作为民众上交战时物资时最先见到的人，他深知此中虚实。\n\n“保佑前线的战士吧，”米洛科夫暗忖。他仍记得在奔萨阻击德军的日夜：白昼浴血奋战，暗夜刺骨严寒，但西伯利亚的无尽煎熬比那风雪更摧残人心。如今他守着这方收集站，为红军募集废料。\n\n他怀念往昔的秩序与安宁。布哈林纵是该死的蠢货，至少曾抗击法西斯，不像如今这帮腐败军阀。\n\n米洛科夫的思绪渐渐消散，目光落在宣传部军官新发的传单上。画面中的红军战士左手提冲锋枪，右手擎赤红旗帜，英姿勃发地呼唤着\"坚守前线需你援手！收集废料支援战争\"的口号——这行醒目标语正横亘在画面中央。\n\n米洛科夫这才明白，原来满城张贴的就是这个，他还以为是哪个宣传画家又在搞鼓舞民心的把戏。他向后靠在椅背上，正要去拿政府印刷的杂志，却被一阵敲窗声打断了。\n\n“您好？这里是收集点吗？”一个小男孩问道，手里攥着个小袋子，想必是装着废料。\n\n米洛科夫转身打量这个最多八岁的孩子。“对，这里是收集点，小家伙，手里拿的是什么？”他问道。\n\n米洛科夫眯眼打量男孩，却猛然看见一群孩子扛着大小不一的麻袋走来，不由得吃了一惊。他转回头，看着眼前这个满眼灿烂的孩子，“所以，你们咋都想起往这儿送废料了？”\n\n男孩抬起头，咧嘴一笑：“我告诉伙伴们收集废料的海报了，家里大人帮着我们攒了些！”\n\n米洛科夫怔了一下，难以置信地凝视着眼前举着登记簿的男孩。静默片刻后，他接过夹板敲上印章，对孩子露出微笑。"
 NTG_smuta.2.a: " 每个小努力都有价值。"
 NTG_smuta.3.t: "第十七区宵禁"
 NTG_smuta.3.d: "两名士兵行走在戒严的街道上。自从新颁布的全国戒严令生效后，警察中队便重新编排了勤务表，抽调人员执行巡逻任务。\n\n安德烈背靠着面包店门板，看着戈尔科夫在口袋里手忙脚乱地摸索打火机。安德烈抬眼瞥了瞥同伴，目光又落回空寂的街道。\n\n“这鬼地方安静得让人发毛，你说呢？”戈尔科夫停下翻找打火机的动作，“嗯，确实瘆得慌，老是——”他突然噤声，视线钉死在街道尽头，“看见没？”\n\n安德烈循声望去，只见一道黑影手持不明物件疾步逼近。安德烈当即架起步枪，戈尔科夫同时摸向腰间配枪。“站住！宵禁期间，立即投降！”黑影非但未停步，反而叫喊着两人听不懂的语言加速前冲。\n\n“再动我们就开——”安德烈的警告话音未落，陌生人停步半刻，随即挥舞着手臂，狂呼着某种方言向他们扑来。两人被迫开火，数声枪响后，黑影倒在积雪中痛苦呻吟。\n\n戈尔科夫走向倒地的陌生人，安德烈的枪口始终锁定目标身体。戈尔科夫踹动躯体使伤者仰面朝天，光线照亮了他胸腹处的三处弹孔。戈尔科夫端详片刻，抬头对安德烈说：“是个哈萨克人，抱着袋面包，我觉得他怕是个面包师傅，可怜虫。”安德烈垂落枪管：“该死......叫政委送他去医院。治完伤再按违令拘押。”戈尔科夫朝面包店努嘴：“街坊们怎么办？”安德烈叹道：“只能另找个烤面包的呗？”两人神经质地干笑两声，继续执行巡逻任务，守护着联盟平民百姓的安全。"
 NTG_smuta.3.a: "生活本就残酷不公。"
 NTG_smuta.4.t: "未敢设想之事"
 NTG_smuta.4.d: "早晨在监狱门的哗啦作响中开始，一位守卫打开门，手持霰弹枪，对格里高利和他的狱友们咆哮着下命令。\n\n“所有囚犯立即前往主监狱大厅，违令者严惩不贷！立马给我动起来！”格里高利把他疲惫的老骨头从床上撑起，挠着胡子，内心咒骂着守卫这么早吵醒牢房区，但他别无选择。\n\n当格里高利和其他狱友沿走廊行进时，他开始意识到被叫来的不只他这一组囚犯，而是整个古拉格，因为大厅里聚集了数百人。囚犯们挤在中央大厅，低语开始蔓延：“他们要处决我们了。”\n\n格里高利自己也不知道即将发生什么，不过他也不太在乎。如今他唯一牵挂的，只有远在家乡的侄女。他已有太久没见过她了，只知道那可怜的女孩被托付给了他的一个远亲，天知道那家伙是怎么照料她的。\n\n正当窃窃私语声达到高潮时，一位政委站上讲台，通过扩音器讲话。\n\n“同志们注意！根据最高苏维埃主席团决议，通过了一项新政策。你们已被认定为值得救赎，因此你们全部被特赦，犯罪记录一并清除。我们将安排释放相关事宜。荣耀属于谢多夫！荣耀属于联盟！”讲完话，政委便走下讲台离开了。\n\n一阵短暂的沉默笼罩着人群，随后是低低的耳语声，最终，爆发出了虽小却真切的庆祝。人们互相拥抱，许多人脸上挂着喜悦的泪水；有些人在这高墙之内仅仅被夺走了几个月的光阴，而有些人则已近数年或数十年。\n\n格里高利自己一时语塞，自多年前家庭破碎、兄长战死沙场、妹妹在他入狱前遭土匪杀害后，他早已不再信仰上帝，然而此时此刻，自由，竟真的降临了。\n\n当这些前囚犯们排着队步出古拉格，等待接送车辆时，男人们都深深呼吸着那个时节宜人天气带来的习习清风，格里高利看着他宝贝侄女的照片，仰望天空，笑了。"
 NTG_smuta.4.a: "更美好的明天就在前方。"
 NTG_pillars.1.t: "与倒吊人的会面"
 NTG_pillars.1.d: "谢多夫走进废弃中学里的临时党委总部。两名士兵立正敬礼，随后开门让他入内。\n\n走向拉狄克办公室时，一路可见红旗和早已逝去的共产党领导人的肖像点缀着各面墙壁。\n\n敲门后，他进入了办公室。\n\n“拉狄克同志，你今天在例行周会之外召见我。那么，究竟有何要事？”他一边落座一边问道。\n\n“谢多夫总理，我深知您身为国家总理日理万机，但党内似乎出了些问题。”拉狄克叹着气，抽出一叠文件。\n\n“许多党员和干部纷纷报告某些地区的民兵现状。报告称，尽管我们在地方选举中获胜，民兵却公然违抗我们的统治。您也知道此事关系重大。若不维持对这些地区的控制，叛徒和叛乱分子就会公开质疑我们的执政合法性，纵使我们手握民意授权。”\n\n谢多夫凝视着这位白发苍苍的同僚，他已几乎无力做任何事。\n\n“我明白我必须采取行动，而这需要您的协助，谢多夫总理。请派遣红军部队随党员进驻这些地区维稳。若能如此，我保证党内将得到充分管控，各项提案也能顺利通过。”\n\n谢多夫又看了他一眼，随后才给出答复。"
 NTG_pillars.1.a: "“包在我身上。现在，让我给弗拉基米尔·奥夫谢延科打个电话。”"
 NTG_pillars.1.b: "“拉狄克同志，很抱歉，我不能允许这种行为。人民不会容忍这种暴行。”"
 NTG_pillars.2.t: "代表们和谢多夫"
 NTG_pillars.2.d: "那天下午，拉狄克邀请谢多夫与几位年长的代表前往党中央的会议室。\n\n既然连守旧派大部分成员都随总理本人一同到场，想必事关重大。很快，众人围坐在长桌旁，拉狄克率先发言。\n\n“同志们，今天召集各位是要商讨国家要务。当前，我们即将敲定振兴祖国的实施方案。”\n\n“我代表今天未能到会的普列奥布拉任斯基同志，向委员会提交最终提案。”坐在长桌左侧的奥波科夫开口道，“经过充分讨论，我们认为政府必须对矿产、农业和国民经济领域进行深刻改革。包括扩建生产设施并将收益用于国民经济建设。”\n\n“教育问题也亟待解决。”坐在长桌右侧的奥博连斯基随即表态，“现行教育体系在无政府状态中严重萎缩。我们感谢维持运转的乡村学校，但孩子们需要正规的教育场所。”\n\n很快，会议室充满此起彼伏的讨论声与温和的争论。拉狄克不得不多次用小木槌敲击桌面。\n\n“同志们，同志们。我们的预算只够投入一个领域。既然双方都已表明立场，就请谢多夫总理定夺吧。”\n\n谢多夫环视全场，最后将目光落在拉狄克身上，缓缓开口。"
 NTG_pillars.2.a: "“我相信奥布连斯基同志是对的。我们要把重点放在教育上。我们的政府需要聪明的新人。”"
 NTG_pillars.2.b: "“财政部将获得资金。我们将获得的这些资源将继续推动革命。”"
 NTG_pillars.3.t: "绅士之间的会面"
 NTG_pillars.3.d: "谢多夫走进废弃中学里临时搭建的党中央。两名卫兵立正敬礼后为他拉开大门。他自己的两名警卫则留在轿车旁等候。\n\n他朝办公室走去。一周前拉狄克同志就约定了这次会面，现在正是赴约之时。\n\n敲门入内后，他看到的却是一张年轻的面孔。\n\n“谢多夫总理，欢迎您，请坐。”\n\n“安东同志，拉狄克同志在哪？是他专门约我来的。”\n\n“拉狄克委员今天身体抱恙。不过他已事先向我交代了要讨论的事项。”\n\n谢多夫接受了这个解释。内阁成员大多年事已高，恶劣的环境也不利于他们的健康。\n\n“请继续吧，安东同志。”谢多夫跷起二郎腿，靠进椅背。\n\n“您知道的，我们的党代表们始终全心全意为人民服务。但有个问题必须重视——下一代的教育。部分代表强调必须向青少年灌输党的价值观。因此我和拉狄克委员提议重建共青团。”\n\n“安东同志，重建青年团能给我们带来什么？”\n\n“青年团能为我们持续输送未来的党代表，巩固党在群众中的根基。同时也能解决青少年课余活动问题，让他们更好地融入社会。”\n\n谢多夫沉思片刻，终于给出了答复。"
 NTG_pillars.3.a: "“我同意你的观点。将做出必要的安排，在全州范围内实施这一政策。”"
 NTG_pillars.3.b: "“我不同意，同志。开展这项计划的资源有限，人口这么少，这是荒谬的。”"
 NTG_pillars.4.t: "战士的请求"
 NTG_pillars.4.d: "下塔吉尔革命军事司令部的大门被推开，凛冽的寒风裹挟着肃杀之气灌进会议室，列夫·谢多夫总理在武装卫队的护送下步入室内，将大衣递给随行人员。拐过走廊转角时，那位白发苍苍的老者正等候着他，握住总理的手时发出爽朗笑声：“谢多夫同志，久违了。作战室就在这边。”\n\n两人走进挂满地图、图表和已故将领肖像的密室，奥弗申柯整了整军装示意总理落座：“感谢您拨冗会面，能联系上您实属不易。”\n\n谢多夫点头回应：“恕我直言，奥弗申柯同志，我们时间紧迫且任务繁重，客套话就免了吧。”\n\n“当然。”老将军咳嗽着抓起水杯灌了一口，“请您来是要商讨周边军阀的威胁。参谋部判断未来一两年内必将爆发战争。但目前我军处境——”一阵干咳打断了他的汇报，“……请原谅，现状不容乐观。自政权崩溃以来，我们的弹药火炮储备始终捉襟见肘。虽然您此前的扩军努力值得称道，但若想取胜还远远不够。”\n\n奥弗申柯双手撑在作战沙盘上，犀利的目光让谢多夫瞬间洞悉了对方的意图。“我谨代表红军请求总理同志追加军费拨款。可以向您保证，总参谋部此前对主席团拨付的每一分钱都精打细算。我深知经济形势严峻，但这事关存亡，同志。”\n\n谢多夫凝视着交握的双手缓缓吐息，沉默在两人之间蔓延。最终，谢多夫转动座椅面向将军："
 NTG_pillars.4.a: "“我马上给你额外拨款。”"
 NTG_pillars.4.b: "“抱歉弗拉基米尔同志，我爱莫能助。”"
 NTG_pillars.5.t: "另一个卑微的请求"
 NTG_pillars.5.d: "下塔吉尔革命军事司令部的大门被推开，凛冽的寒风裹挟着肃杀之气灌进会议室，列夫·谢多夫总理在武装卫队的护送下步入室内，将大衣递给随行人员。\n\n拐过走廊转角时，谢多夫注意到写着“作战室”的小铜牌——奥夫相科肯定在里面。\n\n他叩门走进这个贴满地图、图表，摆满各式文具的狭小房间。奥弗申柯整了整军装示意总理落座：“感谢您拨冗会面，能联系上您实属不易。”\n\n谢多夫点头回应：“恕我直言，奥弗申柯同志，我们时间紧迫且任务繁重，客套话就免了吧。”\n\n“当然。”老将军咳嗽着抓起水杯灌了一口，“请您来是要商讨红军问题——很遗憾，并非好消息。”他给两人各倒了杯水。\n\n“多数将领判断未来一两年内必将爆发战争。但目前我军的现状——”一阵干咳打断了他的汇报，“……请原谅，不容乐观。尽管我们竭尽所能，但训练条件和设施仍像政权崩溃时那般糟糕。虽然您此前的扩军努力值得称道，但若想取胜还远远不够。”\n\n奥弗申柯双手撑在作战沙盘上，犀利的目光让谢多夫瞬间洞悉了对方的意图。“我谨代表红军请求总理同志追加军费拨款。现有的基地和训练方式已不敷使用。阿列克谢耶夫以及总参谋部拟定了新的训练方案和设施建设计划，只需基础物资和最低限度的国家预算，就能确保应征士兵获得战场生存的必要条件。”\n\n谢多夫凝视着交握的双手缓缓吐息，沉默在两人之间蔓延。谢多夫啜饮了一口水，终于抬眼看向这位将军。"
 NTG_pillars.5.a: "“你会得到你的新设施，奥弗申柯，我保证。”"
 NTG_pillars.5.b: "“很抱歉，弗拉基米尔同志，但红军现在只能凑合了。”"
 NTG_pillars.6.t: "与副手会面"
 NTG_pillars.6.d: "下塔吉尔党总部的大门打开，谢多夫快步走进会议室。他已经迟到了，正急着去见一位等候多时的人。\n\n他敲了敲门，迎面见到已经坐在办公桌前的亚历山大·阿列克谢耶夫。\n\n“阿列克谢耶夫同志，抱歉让你久等了。刚才有个会议耽搁了时间。现在让我们开始吧。”他迅速坐下，准备听取阿列克谢耶夫的汇报。\n\n“没关系，谢多夫总理，国家事务要紧。”阿列克谢耶夫从公文包中取出一个牛皮纸文件夹，摊开在桌上。“正如电话中所说，我是来讨论红军相关事宜的。”\n\n“这是我们常备红军部队最近的训练报告，以及红军的整体战备状况。目前整体状况良好，但军事科研环节严重滞后。尽管有军事科学委员会的立项，但我们的研究最多只能算是刚刚起步。”他结束了汇报。\n\n谢多夫翻阅着研究报告。这些项目看起来很有前景，但总是在第二阶段或第三阶段因资金不足而被迫中止。\n\n“因此，谢多夫总理，我请求您批准对军事研究计划进行少量投资。这将使我们的士兵能配备更好的装备，也能确保科学家们有足够经费继续为社会主义事业奋斗。”\n\n谢多夫再次审阅文件，然后作出了答复。"
 NTG_pillars.6.a: "“我同意你的观点，军事科学委员会将获得额外的资金。”"
 NTG_pillars.6.b: "“我向阿列克谢耶夫同志道歉，但这些资金是国家其他方面所必需的。”"
 NTG_pillars.7.t: "讨论经济"
 NTG_pillars.7.d: "谢多夫在市中心办公室里静候，目光随着时钟指针游移。普列奥布拉任斯基今日要求面谈，说是要商讨经济事务。\n\n他正揣测着会谈内容，卫兵推门的声音打断了他的思绪。\n\n“谢多夫总理，普列奥布拉任斯基委员到了。”\n\n“请他进来。”\n\n须臾间，普列奥布拉任斯基已步入室内。\n\n“谢多夫总理，久违了。如先前所言，今日是为国家经济事务而来。”他边说边伸手取了杯水。\n\n“普列奥布拉任斯基同志，但说无妨。”\n\n“新经济政策实施后，储备金中积压着部分闲置资金。经部门商议，我们拟将这笔款项用于购置新型农用与工业设备。”\n\n他啜饮着清水继续道，“尽管政府此前已拨付过类似款项，但目前仍有35%-40%的农场和45%的工业设备沿用落后生产方式。我们的目标是将这个比例压缩至20%。”\n\n他将空杯放下，“不知总理同志可否支持这项计划？”\n\n谢多夫沉思片刻，心中已有定见。"
 NTG_pillars.7.a: "“批准了，同志。务必确保这些设备分配到各公社，将落后生产比例压下来！”"
 NTG_pillars.7.b: "“对不起同志，其他项目也需要资金。”"
 NTG_pillars.8.t: "最终确定生产资料"
 NTG_pillars.8.d: "谢多夫走下轿车，向司机道谢后抬头凝视着下塔吉尔工会大楼的入口——这里已被征用为国家经济会议的会场。门楣上镌刻着“财政人民委员部（下塔吉尔）”的字样，门前矗立着一尊虽已褪色略有破损却依然庄严的列宁雕像。\n\n走进大楼后，谢多夫径直来到规划室，此时普列奥布拉任斯基正与亲信们展开讨论。注意到总理的到来，众人立即停止了交谈。察觉动静的普列奥布拉任斯基立即起身相迎。\n\n“啊！请原谅，谢多夫同志，我们趁着等您的空档先就细节问题展开了讨论。”\n\n谢多夫不以为意地摆手：“别在意，叶夫根尼，任何推动社会主义建设的进展都值得肯定。”他解开大衣纽扣落座，“这次召集的具体议题是？”\n\n普列奥布拉任斯基点头示意，一位幕僚随即取出印有国徽的文件：“最新集体化报告显示生产效率下滑，主要源于农业机械短缺。今年春耕需要更多犁铧、拖拉机等农具。但工业部门未能完成配额。长此以往，未来几年国家将面临集体化资源短缺的风险。”\n\n“这正是核心问题，”普列奥布拉任斯基的发言引得在场经济学家纷纷颔首，“自西伯利亚战争以来，我们首次面临全面集体化所需工具的短缺。现正式申请增加国家工业投资，新资金将专项用于紧缺设备的生产布局，从根本上杜绝供给缺口。”\n\n会议室里空气凝固，所有人都注视着谢多夫。经过短暂思忖，总理长舒一口气，直面普列奥布拉任斯基……"
 NTG_pillars.8.a: "“先生们，我相信这是可能的，主席团会批准的。”"
 NTG_pillars.8.b: "“虽然我非常信任你们，但恐怕我现在无法提供这样的时间和资源。”"
 NTG_pillars.9.t: "计时付费"
 NTG_pillars.9.d: "谢多夫是联盟的干部，沙马洛夫是劳工的代表，两人都是公社的政治家，他们都将在决定公社的未来中发挥作用，更具体地说，是工人的未来。\n\n这对搭档正行走在下塔吉尔的工业区，在这里普通苏联公民都能看到两位政治家。沙马洛夫邀请谢多夫视察一家武器制造厂，数百名工人在这里为红军赶制武器，据介绍，这里的工作强度极高且异常艰苦。\n\n工厂里的男女工人们外表明显饱经风霜，双手布满老茧，磨破的工作服上沾满煤灰和污垢。尽管两人尚未进入车间，走廊里弥漫的汗水和硫磺气味已令谢多夫几乎作呕。\n\n更习惯这种气味的沙马洛夫转向谢多夫：“您看到了吧？这就是我要说的。我们共产党尽管宣称要为工农服务，却从未真正改善过公社工厂的工作条件。我在党代会上无数次推动工作改革提案，但它们总被搁置一旁无人问津，所以我才直接来找您，谢多夫主席。普列奥布拉任斯基同志或许是卓越的经济学家，但他根本不懂自己的某些政策对工人造成的实际伤害。\"\n\n谢多夫会意地点头：\"我明白了，你具体想提议什么，同志？\"\n\n沙马洛夫从大衣里抽出一份文件：\"这个改革提案规模不大：建议将国家规定的每日工时缩短两小时，使工作日缩减为十小时。我知道您可能有顾虑，谢多夫主席，但我向您保证，我计算过数据，这对工业产量的影响微乎其微，同时能确保工人不会因过度劳累而垮掉。我恳请您为工人、他们的家庭和健康着想。\"\n\n谢多夫翻阅着文件。只要他签字，法律就将生效，但这必然引发强硬派的反对，而他最不愿看到的就是派系斗争升温。正当谢多夫伸手去拿口袋里的钢笔时，他突然对沙马洛夫说……"
 NTG_pillars.9.a: "“沙马洛夫，你证明了一个很好的观点。我将在下个月授权实施。”"
 NTG_pillars.9.b: "“我向沙马洛夫同志道歉，但目前革命需要更大的工业产出。”"
 NTG_pillars.10.t: "火车准点"
 NTG_pillars.10.d: "总理谢多夫桌上的电话响起，证实了他预定的下午4点与多姆布罗夫斯基通话的安排。谢多夫拿起听筒：“是多姆布罗夫斯基吗？”\n\n电话那头传来沙哑的笑声：“正是我，谢多夫同志。首先感谢您选择听取我的汇报而非谢列布里亚科夫的。我深知国家基础设施存在问题，但公社、铁路和枢纽站的情况更值令人忧心。”\n\n谢多夫明显提起了兴趣：“具体说说，铁路系统现在是什么情况？”\n\n“简单来说——我们举步维艰。当前拨款连维持铁轨和车厢的维修都捉襟见肘。西伯利亚战争造成的损坏至今未愈，超过半数的铁轨依靠临时修补勉强维持。虽然我们有大量囚犯可以投入维修工作，但这些囚工根本不懂铁路维修。我们需要更多熟练工程师和资深铁道工。”\n\n“所以你想要追加预算？”\n\n“不仅如此，总理同志。德罗布尼斯同志和我的下属共同制定了一项职业教育计划——通过标准化手册培训维修技工，能大幅提升枢纽运转效率。但这个计划需要您的签字和专项资金支持。谢多夫同志，这将是惠及军民运输系统的双赢方案。”\n\n谢多夫陷入迟疑。这个看似长远的利好方案背后，暗藏着绕过谢列布里亚科夫运作的政治风险。他仿佛看见派系分裂正在阴影中滋生，而这恰恰是他最不希望看到的局面。"
 NTG_pillars.10.a: "“你的逻辑十分正确，多姆布罗夫斯基同志。我正式批准你的提议。”"
 NTG_pillars.10.b: "“我真希望能够帮助我的同志，但我们的预算实在捉襟见肘。希望你能理解。”"
 NTG_pillars.11.t: "周六自驾游"
 NTG_pillars.11.d: "一辆汽车转过街角，稳稳停在了谢多夫和他的安保人员面前。司机快步下车，拉开后座车门，满面红光的谢列布里亚科夫张开双臂迎上前来：“谢多夫总理同志！”两人短暂拥抱后，谢列布里亚科夫指向车内：“我有许多事要与您商议，我们车上详谈？”\n\n车厢内的谈话本应富有成效，但驶离城区后，乡间道路的坑洼让行程变得异常煎熬。当谢多夫正要喝水时，一个突如其来的深坑让水瓶在他脸上溅开水花。\n\n谢列布里亚科夫立即注意到这个意外，递给谢多夫一张纸巾：“可惜该地的基础设施亟待资金投入。这些道路本来是给拖拉机使用的，即便如此我们还常收到农民投诉路面的坑洞和碎石。要知道战前它们还算体面，看来轰炸、坦克履带和弹坑对道路寿命不太友好。”\n\n谢多夫擦着脸，对谢列布里亚科夫的讽刺报以轻笑：“确实如此，这些道路确实需要国家……”谢多夫突然住口。\n\n需要吗？当然需要。但在各部门都伸手要钱的当下，优先满足交通系统意味着什么？他眼前浮现出谢列布里亚科夫背后盘根错节的派系网络。此刻每笔拨款都可能成为压垮脆弱经济平衡的最后一根稻草。\n\n“有什么问题吗，谢多夫同志？”谢列布里亚科夫露出关切的神情，“您作出决定了吗？”谢多夫转头望向窗外，字斟句酌地组织着语言。"
 NTG_pillars.11.a: "“放心吧，谢列布里亚科夫同志，预算很快就会批下来。我会通知普列奥布拉任斯基同志着手办理。”"
 NTG_pillars.11.b: "“抱歉了，老朋友，但这事我实在无能为力。”"
