 NTG_Struggle_delegates_progbar_delayed_tt: "§F§e代表§!构成了公社的政治机器，维系着政策落地与政府运转。这些代表们来自国内不同派系与利益集团，这意味着他们的协同程度直接决定了立法效率及政策落实。必须通过有效沟通、公平代议以及诉求回应，才能维持一个团结高效的政府。更要紧的是——若失去他们的支持，重大改革将寸步难行，革命政权也将丧失合法性。§!"
 NTG_Struggle_people_progbar_delayed_tt: "§F§f人民§!是下塔吉尔的命脉。正是他们的劳动让整个国家得以运转。人民的幸福直接关乎社会和谐与经济生产力。正因如此，政府必须通过医疗保障、全民教育、公职岗位、基础建设等各项政策来提升民生福祉。只有当人民获得幸福感，社会才能保持蓬勃稳定，群众才会主动投身革命事业，国家战略目标也才能获得持久支撑。§!"
 NTG_Struggle_military_progbar_delayed_tt: "§F§K军队§!是公社安全的钢铁支柱，对内维持秩序，对外保卫国防。必须确保这支力量始终保持最佳状态——作为政权的武力后盾，他们需要充足的资源配给、严格的作战训练以及高昂的士气支撑。为此我们必须为士兵们配备现代化装备，提供平等薪酬，并铭记那些为保护我们而每日做出的个人牺牲。这支军队抵御着内外威胁，为我们的理想保驾护航。§!"
 NTG_change_focus_tree: "§Y国策树将变化…§!"
