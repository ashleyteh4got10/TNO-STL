 NTG_expansion: "大动乱国策树"
 NTG_april_fools.1.t: "托洛茨基的复活。"
 NTG_april_fools.1.d: "“这被认为是不可能的……但人类的复活终究通过科学手段实现了……列夫·托洛茨基已从死亡中归来……尽管他的器官状况不佳……管他的，至少高兴点，他活过来了，你这蠢货！”\n\n列夫·谢多夫看着我和他复活的父亲，结果吓得他妈的心脏病发作了……"
 NTG_april_fools.1.a: "搞他妈什么玩意？"