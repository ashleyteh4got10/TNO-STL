 NTG_Struggle_Info_Icon_tt: "§F尽管我们的宣传机器竭尽全力将下塔吉尔公社描绘成理想国度，但我们必须认清现实现实——为保住革命的三大支柱，必须做出必要的让步。权力格局围绕着§e代表§!、§K军队§!与§f人民§!运转。\n\n为维持公社稳定，我们必须确保三大支柱的支持率均保持在§G40%§!以上。此外，其中至少两项的支持率需维持在§G60%§!以上。倘若失控，后果将是§b灾难性§!的。§!"
