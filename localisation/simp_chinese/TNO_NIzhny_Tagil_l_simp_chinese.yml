 POLITICS_LEV_SEDOV_DESC: "列夫·塞多夫深知失败是何滋味。\n\n起初是他的父亲在苏联领导权之争落败，后全家被流放至西伯利亚腹地。他们又两度败于德国人之手，最后命运让他失去挚爱的父亲。如今他的母亲也病入膏肓，时日无多。随着俄罗斯的疆域不断萎缩，塞多夫发现自己被挤压进越来越逼仄的角落，节节败退，希望渺茫。\n\n但列夫绝不放弃——为了家族，为了全世界无产者，他必须坚持。革命的烈焰不惜任何代价都要继续燃烧，借助家族余荫与父亲旧部，列夫·塞多夫夺取了下塔吉尔的控制权。马恩列托诸位先贤虽已长眠，但只要塞多夫还能将革命的火种播向四方，先贤的夙愿就不会消亡。\n\n然今党内裂隙丛生，派系相噬，根基未固而四面皆敌。他虽不及父亲那般澎湃的精力，却能以钢铁意志与周密谋划弥补这点。毕竟，改变世界的方式不止一种。终有一天，红旗必将再度插遍俄罗斯，插遍全球，而列夫·塞多夫作为革命的旗手，将亲自带领革命走向胜利。从下塔吉尔到日耳曼尼亚，从东京到华盛顿，永恒革命终将胜利。\n\n也必须胜利……"
 POLITICS_YURY_DOMBROVSKY_DESC: "§Y共产党总书记§!\n--------------\n尤里·奥西波维奇·多布罗夫茨基是一位杰出的苏联学者和作家，1909年2月2日出生于俄罗斯莫斯科。\n\n他成长于一个知识分子家庭，自幼便在父母的耳濡目染下接触文学和哲学。这样的成长环境让少时的多布罗夫茨基表现出对学习的强烈渴望和对文字独到且深刻的见解。青年时期时，多布罗夫茨基成为苏联共产党内的一名积极分子，并在党内担任过多个职务。\n\n然而随着年龄增长，多布罗夫茨基开始质疑党的执政方法和理念，尤其是当其对艺术和思想自由拷上的枷锁愈发牢固时。苏联解体后，他毅然向西前行，历经重重阻碍最终抵达下塔吉尔。期间其既要应对旅途中的诸多困难，又要躲避德国人对其组织的追捕。\n\n哪怕生活艰辛、命运坎坷，多布罗夫茨基也从未放弃他所热爱的写作事业，并于1955年出版了其代表作《无用知识系》。这部作品深刻剖析了人类的生存状态，审视了艺术、哲学与政治间的复杂关系，同时也有对苏联政权审查制度和思想压制的隐晦批判。下塔吉尔革命爆发后，多布罗夫茨基决定与塞多夫同志并肩作战，只因他们内心都装着一个共同的愿景——将他们遭受万千苦难的俄罗斯母亲从压迫中解放出来。\n\n如今，尤里领导着党内的改革派，并在未来的某次契机中，以极大可能接过塞多夫手中的重任——以及他们共同为之奋斗的事业。"
 POLITICS_VALRAM_SHALAMOV_DESC: "§Y共产党总书记§!\n--------------\n瓦尔拉姆·季洪诺维奇·沙拉莫夫在1907年6月16日的清晨出生于俄罗斯的沃洛格达市，他的短暂童年则在西伯利亚科雷马地区的布图格恰格市度过。1929年加入苏联共产党后，沙拉莫夫曾担任记者、矿工等职。1937年是沙拉莫夫人生的第一次转折点——那年他因“反革命托洛茨基主义活动”而被内务人民委员会逮捕，并被判处在科雷马劳改营监禁十七年。尽管服刑期间的生活条件十分恶劣，但沙拉莫夫始终没有放弃自己的政治理想，不过多次未曾成功的越狱计划也让他的生活前景愈发渺茫。\n\n终于，在服刑的第八个年头，随着苏联的庞大身躯在德国国防军的铁蹄下土崩瓦解，沙拉莫夫得以抓住这一最为混乱的时机，逃离了这座险些索其性命的冰封监狱。\n\n但在亚戈达眼中，这名危险的托派分子势必会对其统治带来极大的不稳定因素，为逃避内务人民委员会的再次追捕，沙拉莫夫不得不逃往当时尚坐落于中西伯利亚共和国的托木斯克市——在那里，他得到了知己鲍里斯·帕斯捷尔纳克的庇护。随着远东苏维埃最高主席团同这个新生共和国陷入的旷日持久的战乱当中，沙拉莫夫敏锐地预见到两个政权都将迎来不可避免的崩溃。于是乎，当列夫·塞多夫领导的托派革命横扫下塔吉尔时，沙拉莫夫毅然开启自己的东行朝圣之旅，来到这面旗帜之下——既为自保，也为考察塞多夫能否在将来成为一名更优秀的领导者。\n\n如今，在下塔吉尔混乱的政治涡流中，这位坚毅之人自然而然地登上了革命的舞台，成为塞多夫的潜在接班人之一。"
 POLITICS_Alexander_Alexeyev_DESC: "§Y共产党总书记§!\n--------------\n亚历山大·伊万诺维奇·阿列克谢耶夫的人生始于1913年8月14日，在伏尔加河畔的科斯特罗马，他用双眼第一次见到了这个世界的模样。\n\n在16岁其父与世长辞后，阿列克谢耶夫随兄长迁居莫斯科，并于1935年考入莫斯科国立大学历史系学习深造。1939年，阿列克谢耶夫作为口译员随苏联志愿军被派往西班牙，期间被内务人民委员会招募，成为其下的一名情报人员。也就是居住在西班牙的那段岁月里，残酷的战争让他的内心留下一段无法愈合的伤疤，也让他对战争的本质进行了深刻的反思。\n\n到了1941年底，在政府的命令下，阿列克谢耶夫再度启程前往伊朗，担任外交官一职。德国对苏联宣战不久后，他即被召回参加对德作战。仍隶属内务人民委员会的他被派往亚戈达处于控制下的远东地区。在以政委身份随红军部队参与中西伯利亚战争的过程中，亚戈达政权的虚伪与战争的残酷让阿列克谢耶夫逐渐对这一切心生厌恶。当战况陷入胶着时，阿列克谢耶夫得以抓住时机，远离了那块是非之地。历经数次辗转后，他选择下塔吉尔驻足，选择与塞多夫共事。\n\n尽管缺乏相关军事经验，但其翻译及外交背景和在内务人民委员会的工作经历使其成为塞多夫托派革命中不可或缺的重要人才。\n\n在下塔吉尔熊熊燃烧的革命烈焰之上，他将运用他的毕生所学，协助塞多夫同志重建联盟——直至革命有成、祖国解放、世界新生。"
 POLITICS_NIKOLAI_ANDREEV_DESC: "尼古拉·特罗菲莫维奇·安德烈耶夫于1905年出生。1935年，他被从预备役中征召，重新加入红军，并成为了西伯利亚的一名政委。最开始他还怀抱与德国人作战的希望，但却进入了军官学校。但随着战争局势变得越来越令人绝望，他却在不断学习越来越多的课程——不是为了磨练技能，而是想拖延时间，避免被派到一场他认为注定失败的事业去。苏联崩溃后，他和军官毕业生同学们结成一个小集团，开始在克拉斯诺亚尔斯克地区巩固权力。当中西伯利亚共和国成立时，共和国政府担心这类事先产生的团体会威胁到其民主制度，于是安德烈耶夫的集团被解散，他们被打散发配到共和国领土的各个偏远角落。安德烈耶夫被安排在尼古拉·克雷洛夫的指挥下，但他仍秘密地与他的同道们保持联系。\n\n随着共和国开始失去对权力的控制，开始分崩离析时，安德烈耶夫集团在克拉斯诺亚尔斯克再次集结，并在克雷洛夫将军向西伯利亚黑军发起那注定失败的攻势时发动了兵变。为了让这座城市的人们相信他们不只是改头换面的军政府，安德烈耶夫和他的军官们许诺了将进行全新的全面的改革：自由贸易！私有财产！外国援助！公开选举！自由！民主！\n\n随着先前秩序的崩溃，安德烈耶夫集团认为统一西伯利亚的重任落在了他们的肩上。要实现统一，向东边大海的冲刺必不可少，并随之获得外国的承认，然后再巩固和准备推动解放整个俄罗斯。但是，安德烈耶夫是否真的能够实现这些承诺，那就是另外一回事了。"
 NTG_bastion_of_the_revolution: "革命堡垒"
 NTG_bastion_of_the_revolution_desc: "伟大的卫国战争爆发前，下塔吉尔曾是反对布哈林及其拥趸的重镇，亦是诸多革命组织的摇篮。时至今日，下塔吉尔依然是俄罗斯革命的坚固堡垒，是争取社会公义与平等的斗争象征。纵然自革命初年以降，俄罗斯历经沧桑巨变，时光荏苒，下塔吉尔始终如警钟长鸣，昭示着革命理想与价值那不朽的传承。"
 NTG_satirical_pamphlets: "讽刺小册"
 NTG_satirical_pamphlets_desc: "某匿名作者正在该地区散发反共讽刺传单。这些纸张在众多小型武装团体间流传，持续腐蚀着我们解放俄罗斯工人的努力。"
 NTG_widespread_armaments: "过度广泛的军备"
 NTG_widespread_armaments_desc: "由于昔日席卷此地的无政府状态，武器库多遭废弃，下塔吉尔的众多村庄与市民纷纷自寻武装，组建起地方上的邻里守望与民兵队伍，以求抵御流窜的匪帮。此事虽暂未酿成大患，但红军与地方党部皆未能将这些持械之人直接纳入掌控，此举或将严重动摇下塔吉尔当权者对暴力手段的专有权。"
 NTG_collectivised_farms: "集体农庄"
 NTG_collectivised_farms_desc: "随着近期农业集体化进程的持续推进，令人欣喜地获悉的报告正不断传来：下塔吉尔地区的农业生产已取得显著成效——粮食产量正稳步提升。基于这一积极态势，我们得以对我国的工人阶级和红军将士们提高定量配给标准。\n\n尽管部分代表同志仍对剩余农产品的分配方向存在异议，但至少我们现在能够暂时放松下来，将目光转移别处了。毕竟，下塔吉尔的粮食安全现已得到基本保障，革命同志们也不必再为饥荒问题而忧心忡忡。\n\n这一成果既是我党集体农庄政策优越性的强力证明，也是我们在巩固无产阶级专政的物质基础的道路上所迈出的坚实一步。"
 NTG_subsidized_war_industries: "喂养战争机器"
 NTG_subsidized_war_industries_desc: "经过革命军事委员会多年来的不懈呼吁，加之边境地区日益严峻的战争局势，党内最终决定批准对武装力量及军工生产体系的新一轮投资计划。\n\n此次战略投资预计将显著提升我军作战能力，为接下来同与周边军阀势力的战斗做好充分准备。而在由下塔吉尔亲自打造的庞大战争机器下，远远不断的新式装备不仅将极大提振红军将士的士气，更将为我们在这场迫在眉睫的战争中奠定决定性优势。"
 NTG_novaja_ekonomiceskaja_politika: "新经济政策"
 NTG_novaja_ekonomiceskaja_politika_desc: "辛尼亚夫斯基的\"新经济政策再实施方案\"现如今取得了重大成功。该政策的实施显著强化并优化了我国的经济实力和财政能力，使我们得以向基础民生服务部门和长期被忽视的政府领域注入更多资金。更令人振奋的是，“新经济政策再实施方案”实施后，民生状况得到明显改善——与下塔吉尔社会共和国刚成立时的贫困潦倒相比，如今我国的大部公民已能轻松负担起诸如购买面包等基本生活所需，并在我党的教育下继续朝着革命的正确方向前进。"
 NTG_Karl_Radek: "卡尔·拉狄克"
 NTG_Leonid_Serebryakov: "列昂尼德·谢列布里亚科夫"
 NTG_Yevgeni_Preobrazhensky: "叶夫根尼·普列奥布拉任斯基"
 NTG_Vladimir_Antonov_Ovseenko: "弗拉基米尔·安东诺夫-奥弗申柯"
 NTG_Karl_Radek_hog_desc: "§Y人民委员会主席\n托洛茨基主义§!\n--------------\n§L卡尔·拉狄克，1885年10月31日生于尚处在奥匈帝国控制之下的莱姆贝格。拉狄克早年便积极投身国际共产主义运动，并在其中扮演着至关重要的角色。在结识列宁前，他活跃于波兰与德国的共产主义组织，在二月革命和十月革命中——不仅协助列宁等人返回俄国建立俄罗斯苏维埃联邦社会主义共和国，还协助德国共产党建立并策划斯巴达克起义。\n\n然天有不测风云，在两次大战间的动荡岁月里，德国革命的失败、托洛茨基支持者的身份，以及其在与格里戈里·季诺维也夫在列宁格勒帮助组织了十月革命十周年的独立示威活动，最终让拉狄克被开除出党。当布哈林将反对派们驱逐到苏联境内的各个偏远地区时，拉德克也未能幸免，几经辗转后，他被流放至托木斯克。1930年拉狄克虽恢复党籍，但1941年德国入侵苏联时，他因对纳粹政权发表暧昧言论再次获罪，在上乌拉尔斯克劳改营服刑八年。\n\n随着苏联解体，这位饱经沧桑的革命老者回到了托木斯克，又在大动乱时期几经迁移，疲惫的拉狄克最终选择定居下塔吉尔。\n\n如今的拉狄克，两鬓皆白却目光如炬，誓死追随着塞多夫的革命事业——这既是对往昔罪愆的救赎，更是对青春年华所燃起那股革命烈焰的不舍与延续。§!"
 NTG_Leonid_Serebryakov_for_desc: "§Y外交人民委员\n托洛茨基主义§!\n--------------\n§L列昂尼德·谢列布里亚科夫，1890年6月11日生于萨马拉。出身工人阶级家庭的谢列布里亚科夫，少年时便离家前往乌法金属厂做工，在此期间加入地下社会主义运动并参与第一次俄国革命，年仅十五岁的他也在那时加入布尔什维克。\n\n经历两年流放后，他作为代表出席1912年的布拉格会议，与列宁结识。返回故乡后屡遭逮捕，最终被征召入沙俄军队。在科斯特罗马驻防期间，他率领部队支持二月革命，协助布尔什维克建立当地苏维埃，并因此崭露头角。\n\n此后谢列布里亚科夫在他的仕途上一路高升——1917年成为莫斯科党组织负责人，1919年当选中央委员会书记处成员。内战期间，其与斯大林在南方战线军事委员会共事，1924年出任运输副人民委员。作为左翼反对派成员，他支持托洛茨基，并签署了知名的《四十五人宣言》，同时身兼中央公路汽车运输管理局局长这一要职。\n\n就在谢列布里亚科夫仕途最得意之时，他不幸于1936年遭诬陷流放，直至二战前才得以恢复党籍，并在战时为红军组织交通运输。\n\n随着斯大林清洗异己，谢列布里亚科夫潜逃至下塔吉尔隐居，直至昔日战友叶夫根尼·普列奥布拉任斯基前来邀他共建新苏维埃政权。已无退路的他，只得选择再次将他的忠诚悉数献给列夫·塞多夫的伟大革命事业。§!"
 NTG_Yevgeni_Preobrazhensky_eco_desc: "§Y财政人民委员\n托洛茨基主义§!\n--------------\n§L叶夫根尼·普列奥布拉任斯基，1886年2月15日出生于奥廖尔省的博尔霍夫。其浓厚的东正教家庭背景，让普列奥布拉任斯基的幼年在浓厚的宗教氛围中度过，从而使他产生了对不平等现状的厌恶。后来，在古典文理中学学习的几年中，普列奥布拉任斯基对政治产生了兴趣，并最终促使他摒弃宗教信仰，投身到社会主义运动当中。\n\n加入俄国社会民主工党后，普列奥布拉任斯基利用他的才华在第一次俄国革命中发挥重要作用——领导奥廖尔地区的学生集会与工人罢工。尽管在被沙皇当局多次逮捕后流放至西伯利亚，但他又成功逃脱并继续为布尔什维克工作。\n\n二月革命期间，他参与东西伯利亚苏维埃代表大会，并当选全俄工兵代表苏维埃第一次代表大会代表。历任中央委员会书记处秘书，后调任财政人民委员部任职，在此期间普列奥布拉任斯基多次公开批判布哈林政策并指责其在工业化的政策上过于软弱。最终他于1927年因参与纪念十月革命十周年的独立示威活动而被开除党籍。\n\n在“宣称”其“在思想和组织上与托洛茨基主义决裂”后，普列奥布拉任斯基被恢复党籍，并先后担任轻工业人民委员部要职及国营农场人民委员部代理部长。在1937年的政治斗争中，普列奥布拉任斯基遭布哈林派系排挤，被贬至乌拉尔地区。在苏联解体前的岁月里，他成功推动乌拉尔地区经济发展，后因公开批评斯大林政策遭亚戈达的追捕，辗转逃至下塔吉尔。\n\n当塞多夫宣布建立下塔吉尔新公社时，这位白发苍苍的老革命家终于卸下他的所有政治面具，毫不犹豫地加入到塞多夫的政治团队中，继续燃烧着心中那团永恒的革命之火。§!"
 NTG_Vladimir_Antonov_Ovseenko_sec_desc: "§Y军事人民委员\n托洛茨基主义§!\n--------------\n§L弗拉基米尔·安东诺夫-奥弗申柯，1883年3月9日生于切尔尼戈夫，其贵族军官的家庭背景注定让奥弗申柯同军事留下不解之缘。1901年从沃罗涅日军校毕业后，奥弗申柯因拒绝宣誓效忠“效忠沙皇和祖国”被尼古拉耶夫军事工程学校开除。\n\n1902年，在圣彼得堡步兵学校研读期间，他秘密加入了俄罗斯社会民主工党，并开始活跃于地下社会主义运动。第一次俄国革命期间，这位少尉军官因领导起义屡遭逮捕，后流亡国外。1914年，一次偶然的机遇，奥弗申柯在法国结识托洛茨基。十月革命中，他率部攻打冬宫，其战役之成功，让这场军事行动成为苏联历史上的一段神话。内战时期，他指挥乌克兰战线和南方战线，为革命的胜利立下了赫赫战功。\n\n战后，因支持托洛茨基，甚至以政变相威胁保护托洛茨基，奥弗申柯成为了布哈林派的眼中钉，并长期为布哈林集团所排挤。1936年，奥弗申柯奉命协助西班牙共和军，归国后即遭贬黜。斯大林大清洗时期，他因签署《四十五人宣言》被以“属于托洛茨基主义恐怖分子和间谍组织”的名义逮捕并处以流放。但奥弗申柯却在押解流放途中奇迹般脱逃，最终在下塔吉尔过上了长期隐居的生活，并暗中组织社会主义运动。\n\n如今这位年过六旬的老将军，正为列夫·塞多夫的新公社整编出一支强大的红色武装。纵使鬓发如霜，这位冬宫征服者的眼眸中，依然跃动着不熄的革命火焰。§!"
 NTG_Valram_Shalamov_hog_desc: "§Y人民委员会主席\n托洛茨基主义§!\n--------------\n§L瓦尔拉姆·季洪诺维奇·沙拉莫夫在1907年6月16日的清晨出生于俄罗斯的沃洛格达市，他的短暂童年随家人在西伯利亚科雷马地区的布图格恰格市度过。这位神父之子仅凭自身努力便跻身进入到当时的政治体系，并最终考入莫斯科国立大学苏维埃法学院。在校期间，沙拉莫夫积极参与了对布哈林政策的批判讨论。\n\n沙拉莫夫曾因参与纪念十月革命十周年的独立示威活动被捕并关押在北乌拉尔劳改营。1932年获释后不久，他又于1937年因“反革命托洛茨基主义活动”而被内务人民委员会逮捕，并被判处在科雷马劳改营监禁十七年。尽管服刑期间的生活条件十分恶劣，但沙拉莫夫始终没有放弃自己的政治理想，不过多次未曾成功的越狱计划也让他的生活前景愈发渺茫。\n\n终于，在服刑的第八个年头，随着苏联的庞大身躯在德国国防军的铁蹄下土崩瓦解，沙拉莫夫得以抓住这一最为混乱的时机，逃离了这座险些索其性命的冰封监狱。\n\n为躲避亚戈达领导下的内务人民委员会的再次追捕，沙拉莫夫不得不逃往当时尚坐落于中西伯利亚共和国的托木斯克市——在那里，他得到了知己鲍里斯·帕斯捷尔纳克的庇护。后来，为逃避中西伯利亚战乱，沙拉莫夫又逃亡至下塔吉尔。当列夫·塞多夫领导的托派革命横扫下塔吉尔时，这位饱经沧桑的知识分子毅然来到这面旗帜之下——既为自保，更为在乱世中守护托洛茨基的仅存的革命火种——与理想。§!"
 NTG_Yury_Dombrovsky_for_desc: "§Y外交人民委员\n托洛茨基主义§!\n--------------\n§L尤里·奥西波维奇·多布罗夫茨基是一位杰出的苏联学者和作家，1909年2月2日出生于俄罗斯莫斯科。\n\n他成长于一个知识分子家庭，自幼便在父母的耳濡目染下接触文学和哲学。这样的成长环境让少时的多布罗夫茨基表现出对学习的强烈渴望和对文字独到且深刻的见解。青年时期时，多布罗夫茨基成为苏联共产党内的一名积极分子，并在党内担任过多个职务。\n\n然而随着党对艺术与思想自由的压迫日益加剧，多布罗夫斯基党抱有的幻想逐渐破灭。苏联解体后，他随华西列夫斯基元帅及红军残部突围，历经极端严酷的天候与无数匪帮的袭击，最终抵达下塔吉尔。\n\n哪怕生活艰辛、命运坎坷，多布罗夫茨基也从未放弃他所热爱的写作事业，并于1955年出版了其代表作《无用知识系》。这部作品深刻剖析了人类的生存状态，审视了艺术、哲学与政治间的复杂关系，同时也有对苏联政权审查制度和思想压制的隐晦批判，这部作品亦成为了流亡知识分子的精神圣经。\n\n下塔吉尔革命爆发后，多布罗夫茨基决定与塞多夫同志并肩作战，只因他们内心都装着一个共同的愿景——将他们遭受万千苦难的俄罗斯母亲从压迫中解放出来。§!"
 NTG_Alexander_Alexeyev_sec_desc: "§Y军事人民委员\n托洛茨基主义§!\n--------------\n§L亚历山大·伊万诺维奇·阿列克谢耶夫的人生始于1913年8月14日，在伏尔加河畔的科斯特罗马，他用双眼第一次见到了这个世界的模样。\n\n在16岁其父与世长辞后，阿列克谢耶夫随兄长迁居莫斯科，并于1935年考入莫斯科国立大学历史系学习深造。1939年，阿列克谢耶夫作为口译员随苏联志愿军被派往西班牙，期间被内务人民委员会招募，成为其下的一名情报人员。也就是居住在西班牙的那段岁月里，残酷的战争让他的内心留下一段无法愈合的伤疤，也让他对战争的本质进行了深刻的反思。\n\n到了1941年底，在政府的命令下，阿列克谢耶夫再度启程前往伊朗，担任外交官一职。德国对苏联宣战不久后，他即被召回参加对德作战。仍隶属内务人民委员会的他被派往亚戈达处于控制下的远东地区。在以政委身份随红军部队参与中西伯利亚战争的过程中，亚戈达政权的虚伪与战争的残酷让阿列克谢耶夫逐渐对这一切心生厌恶。当战况陷入胶着时，阿列克谢耶夫得以抓住时机，远离了那块是非之地，并毅然潜往下塔吉尔投奔安东诺夫-奥弗申柯。\n\n尽管缺乏相关军事经验，但其翻译及外交背景和在内务人民委员会的工作经历使其成为塞多夫托派革命中不可或缺的重要人才。\n\n如今，在下塔吉尔熊熊燃烧的革命烈焰之上，这位\"戴眼镜的政委\"正运用其独到的特工智慧，全力协助塞多夫同志重建联盟——直至革命有成、祖国解放、世界新生。§!"
