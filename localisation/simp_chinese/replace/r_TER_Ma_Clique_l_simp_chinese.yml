 QIN_communist_party_long: "中共余党(CPC)"
 QIN_ma_Jiyuan: "马继援"
 POLITICS_MA_JIYUAN_DESC: "纵使西北大地勉强逃脱被旭日奴役的厄运，仍有一代人在这片土地上献出了生命。这些人的后代满腔忧愤，手握破烂的武器，继续生活在黄土高坡与青藏高原的交界地带。马继援，一名被父亲寄于厚望的年轻人（其名典出自东汉名将马援），便是他们中的一份子。\n\n在马步芳不幸罹难后，仓促继承大权的马继援带领为数不多的青海马家军被迫栖身于第三次统一战线，与中共还有西北国民党残余共同抗敌。但马步芳那恰到好处的离奇死亡，却给年青的马继援心中投下了深深的阴影——到底是不是共产党为了更牢固地掌控西北，阴谋杀害了自己的父亲？在内心深处对中共的真实意图充斥着疑惧，但马继援暂时还没有跟中共撕破脸的打算，毕竟日寇大敌在前，兄弟阋于墙，外御其侮；退一步讲，忍一时才能风平浪静，年轻的将军决定偃旗息鼓，蛰伏起来，静观其变。\n\n直到大跃进的热浪向青海席卷而来，他苦苦等待的时机终于出现了。\n\n雄雄燃烧的清真寺、瘦骨嶙峋的饥民、濒临崩溃的财政、极度紧张的政治局势已经将马家军逼至叛变的边缘。被遍地哀嚎怨言彻底触怒，马继援坚定了反叛的决心：没有共产党和日本人，中国才能得到真主的救赎。\n\n在格尔木的城墙上，马继援向他的马家军下达了向东进军的军令，由马家军士兵、乡间土匪、回民武装甚至极少数的宗教“圣战士”组成的“人民救国军”浩浩荡荡地向国防阵线的心脏地带发起了进攻，进攻初期的顺利让马继援也大吃一惊，但之后解放军几次成功的反击却在他心中种下了忧虑的种子。\n\n马继援自西北大地望向延安的宝塔，对战败的忧虑与胜利（尽管概率越来越小）后何去何从的空虚从他的心底升起。华夏大地正酝酿着一场风暴，但他会是掌握它的那个人吗？"
 QIN_allah_bless: "真主保佑"
 QIN_allah_bless_desc: "安拉，我向您祈祷。愿您垂怜人间疾苦，使自由之剑击碎黑暗……\n安拉，我向您祈祷，愿您主持正义，使您的使者得胜归来，传播您的福音……\n安拉，我向您祈祷，愿您为我扫清迷茫，指明未来的道路……"
 QIN_save_land_people: "保境安民"
 QIN_save_land_people_desc: "过去十年，共产党一直试图把马家挤出西北，独占鳌头。但他们小看了西北这匹悍马的烈性，肆意妄为的粗暴治理令她毫不犹豫地将骑者掀翻在地，带着她的人民奔向她真正的主人——马家。\n\n回族人民指望着我们庇护他们的生活，汉族人民指望我们带回民国荣光。道不同，亦可为谋，保境安民的旗号一石二鸟地将他们团结在人民救国军的旗帜下，再为党国而战。\n\n天时人和已在我手，至于本就属于我们的地利，便要从共匪手中夺回。"
 QIN_two_ma_struggle: "二马相争"
 QIN_two_ma_struggle_desc: "马呈祥是马步青的女婿，也是特意栽培的接班人。但马步芳坑了马步青一家，轻易取走了大哥手中的军队和权力，让苦苦等待的马呈祥空欢喜一场。\n\n马步芳被暗杀后，马呈祥挣脱压制，不停挑战马继援的首脑地位，而这场仓促开始的叛乱使本不和睦的马家雪上加霜。马继援知道这暗流的源头是何处，必须像哪吒一样硬出变出三头六臂，一面指挥前线作战，一面警惕姐夫马呈祥。"
 QIN_kind_words_butter_no_parsnips: "画饼充饥"
 QIN_kind_words_butter_no_parsnips_desc: "过度征召以及后勤上的混乱让贫瘠的青海几乎窒息，前线士兵每天都活在饥饿之中。他们从三三两两进居民家小偷小摸，渐渐发展成明火执仗抢劫。久而久之，人民救国军每过一处便哀鸿遍野。\n\n马继援下令整肃军纪，但显然吃饱肚子是所有士兵誓死不离的权利——更何况其中还有借征粮对民众横征暴敛的军官。过度执法只会让本就不忠诚的军队愈发叛逆，所以得过且过吧。"
 QIN_patchwork_of_rebels: "东拼西凑的反抗军"
 QIN_patchwork_of_rebels_desc: "取消缓征、强制入伍、全民皆兵……但这还不够，人民救国军还需要更多人。\n\n为争取一切力量，马继援一直宣称青海各族团结平等，应当攥成一个拳头向赤匪砸去。但哈萨克人也好、塔吉克人也好，藏人也罢，他们之所以不把枪口对准同他们有血海深仇的马家，仅仅因为他们迫于马家骑兵的淫威，害怕死在征兵官的马刀之下。"