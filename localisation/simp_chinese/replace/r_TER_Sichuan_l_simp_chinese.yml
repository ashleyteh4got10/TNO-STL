 CHQ_Shen_Gan_Duo_You: "矧敢多又"
 CHQ_Shen_Gan_Duo_You_desc: "自1954年建市以后，重庆酒桌上就多出许多来自南京的大员在推杯换盏。他们的地位普遍比本地官员高一级，携中央资产而来，然而对重庆却处处热心，热心于阐释重庆自古以来独立于四川的道理。通过文化造势，制造本土与外乡的隔阂，四川官员被挤走后留下的位置则静待落入有心人之家。不论是一体分肥，还是被硬塞入怀，除少数根基深厚者弃官不做，重庆官员基本都拿了中央的好处。\n\n现在的重庆与四川之间只剩分家不均的愤怒，更遑论私交。二者喋喋不休的争吵会让中央烦躁，但重庆再也不能和四川一起抵抗中央。酒桌上痛饮长江的南京大员们，已经不用人敬酒就能喝得酩酊大醉了。甩下了心中五味杂陈的重庆官员，眼光干干地望着杯中酒。"
 CHQ_Fujitsu_consultant: "广企顾问-富士通"
 CHQ_Fujitsu_consultant_desc: "拜战后多年政治混乱所赐，重庆比云贵川三省更晚拿到招商引资权，但发展势头最猛，合作程度最深，这归功于建市后快速恢复稳定，带来了良好的营商环境。\n\n从自己的专业出发，方贤齐市长选择日本企业富士通开展技术性合作，迎接企业顾问进驻市政，参与市区建设规划。本地的金融行业也乐于接待这些更专业的企业家前来融资，以免亏损。重庆市长的诚意，使富士通向本地商业代表共享了一些前端技术和经营理念。\n\n目前，富士通在重庆建有多家研究所，重庆则是富士通的主流市场之一。"
 CHQ_Jiangcheng_test_group: "江城测试小组"
 CHQ_Jiangcheng_test_group_desc: "为了解决重庆叛乱问题，重庆院辖市和绥靖公署同时成立，最初由客家军人苏绍文担任公署主任兼行政长官，但因为苏将军过于绥靖的手段，被南京方面认定为养寇自重，剥夺了他领导市政府的权力，命他专心剿匪。\n\n位于北方的共产党一直试图渗透重庆，他们自边境偷渡，妆作我党干部，窃据农村地方，纠合散兵游勇对抗市府，使我军屡遭险境。\n\n富士通入驻重庆后，方贤齐市长对苏绍文晓之以情，动之以理，说服军区对企业开放合作，让一线部队担任武器开发的测试员。士兵有了新武器，提高生存率和战斗力，不都是好事么？"

 #国家领袖
 SIC_Liu_Wenhui: "刘文辉"
 SIC_Liu_Wenhui_desc: "在尔虞我诈的军阀时代，刘文辉受侄子刘湘提携一步步晋升为师长。继而在四川混战中占据产盐之地，靠着滚滚而来的税款如鱼得水，成为各路人马争相拉拢的对象。等到爬上四川省长之位那年，刘文辉三十五岁。\n\n一众良莠不齐的军头中，刘文辉是最有小聪明的人，小聪明过多以至没有多少大聪明，结果聪明反被聪明误。\n\n此时刘文辉虽把持省政，却因军队实力不足难登四川王的宝座。为了这个名位，他对内四处撒钱收买变节者，给曾与他并肩作战的同乡们添恶心，对外参与李宗仁、冯玉祥的反蒋联盟给蒋介石添恶心——生生把自己活成众矢之的。结果，在刘湘一手操弄下，刘文辉被众人赶下了台，西康是他的流放地。\n\n关入冷宫，生死不问。接替他统治四川的刘湘不问，从天边来到眼前的蒋介石也不问。当上西康王的刘文辉多少有些失落，小聪明更是憋不住地作祟。\n\n为了扩大地盘，刘文辉切断了康藏与内地的通讯，伙同青海马步芳向西藏扩张，致使西藏高层决心脱离内地。刘文辉除了取得金沙江左岸的昌都城和一些土司效忠，只剩国民政府的一致谴责。\n\n1947年，重庆迎来终结。刘文辉向成都仅存的几位旧人申请回川，但被邓锡侯、田颂尧等人勒令留守本地，不得生事，“稍有抵牾，大兵即至”。\n\n以西康这般贫弱，值此国破民残之际，非死不能活。惶惶如丧家之犬的刘文辉受民盟主席张澜指点，在雅安惴惴不安地拨通秘密电台联络延安，向周恩来表态与南京断交，自建抗日政府，“代为牵制西南诸省”。当时面临日军全面入侵的压力，延安答应其“独立发展”的条件，以待后效。\n\n正所谓不蒸馒头争口气，在共产党的收容之下，刘文辉这朵日渐衰朽的浪花再次朝着心心念念的彼岸翻滚而去。人生无常，万一能稍微够着点上岸的边呢？"
 SIC_Han_Xianchu: "韩先楚"
 XIK_Huang_Yin: "黄隐"
 XIK_Huang_Yin_desc: "许多四川军政首脑是自辛亥革命时期发迹的活化石，述及他们的生平便不得不重复一遍民国发端史，黄隐也不例外。他生于1890年，中学时代加入同盟会，青年投考保定陆军军官学校，与另一位日后川中巨擎邓锡侯成为同学。毕业后分配回四川担任督军参谋。1917年护国战争爆发，黄隐主动投靠蔡锷有功，仅仅二十七岁便获升为旅长，驻防省府成都。\n\n四川拥有相对独立的地理环境，其境内也被高山深壑分割成大小不一的单元，因此四川是一个极易脱离东部政权，且内部极易分裂的省份。这就导致国民党和北洋政府为了争夺四川，无所不用其极地操纵省内大大小小的军阀，发动各自的代理人战争。作为一个小军阀，在二、三十年代的大混战中，黄隐始终与老同学兼上级邓锡侯步调一致，最终存活了下来。\n\n国民党对四川省一直采取步步蚕食的措施，希图完全掌控四川省政。可是四川在民国初年就存在一股强而有力的声音呼吁“川人自治”，极力避免四川成为外人召之即来，挥之即去的奴婢。1937年七七事变后，蒋介石终于能以抗日为由正大光明地把四川军队调离自己的家乡，把中央军开进四川。黄隐及其麾下川军是为数不多留守川中的部队，被同乡故旧视为与蒋介石抗衡的基础，并给予了他极高的期望。\n\n1946年，四川大饥荒，境内十室九空。常年因病居家的潘文华破天荒地主动找到黄隐，策动他火并陈诚的中央军。黄隐对此还有顾虑，表示要再等等。但此时，邓锡侯赫然出现在门外，走进房中面色凝重地对黄隐说：“这日，咱们是抗不下去了。”\n\n黄隐终于下定决心抛弃国民党，可历史向他开了一个地狱般的玩笑——中央军在成都发动了一场大屠杀，只因为成都市民要求国民党退出四川。在这场中日大战中，四川就像一个主动跳下悬崖的傻子，摔得粉身碎骨，死无全尸。\n\n国民党对四川的犯下的罪行罄竹难书，而所有仇恨都促使着黄隐接受日本的和平条件，替外人流血的日子早该结束了，四川只应该听自己人的话！"
 
 CHQ_Fang_Xianqi: "方贤齐"
 CHQ_Fang_Xianqi_desc: "1912年，方贤齐出生在福建福州的一个书香门第，在军阀混战的动荡岁月里完成了上海交通大学的学业，进入浙江省电话局工作。抗日战争时期，方贤齐舍下固守原地的家族只身追随蒋介石迁都重庆——无根的人才好到处扎根，兢兢业业在大后方深耕考察铺设通讯网。但是，中日停战打断了方贤齐的工作，所有前政府人员必须听候南京的指令才能复工。\n\n抱着最纯粹的实用心理，些许“一生襟袍未曾开”的自负，方贤齐在待职人员名单上签下自己的名字。凭着过硬的专业本领以及家族的保佑，他被安排到苏州担任市长，并且很快适应了新工作。突出的政绩使他受到汪精卫夫人陈璧君亲自接见，有意无意向其暗示拉拢。面对高升的机会，方贤齐敬而远之。他无心踏入汪精卫彀中去当一个更大号的汉奸，也没有与自我和解卸任归乡的阔达，只图尽早到海阔凭鱼跃的地方施展才华。体察到年轻人的真实想法后，陈璧君的内侄陈春圃十分体贴地推荐方贤齐升任炙手可热的重庆市长。1956年，方贤齐再次回到动乱平息的重庆。\n\n重庆官员对这位“中央来的人”集体祭出了零容忍，零信任的态度。为了打破坚冰，发展市政，赢得市民支持，方贤齐通过前武汉市长张仁蠡的关系，谈妥了重庆到湖北的航运优惠政策。同时与重庆金融巨头潘昌猷密谈并取得后者支持，将最大的内地供货商竞标让给了他。1959年，方贤齐促成了广东富士通公司与重庆市的合作。这很大程度上缘于他自己的偏爱，对同样是工程师出身的井深大神交已久，让重庆成为富士通的第一批金主是个不错的选择。\n\n硝烟弥散十年后，方贤齐这只断线风筝，轻轻缠绕在重庆这棵无根大树上。推土机轰隆隆地推倒屹立百年的村社，政府规划的新公路将从此经过。夜幕下的重庆再次车水马龙，熠熠生辉。"