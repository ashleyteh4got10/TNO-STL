 TNO_menupic_tooltip_1: "§F每一方§Y文明§!都自诩立于§G世界之巅§!，将自身的兴衰谱写成人类命运的主旋律。§!"
 TNO_menupic_tooltip_2: "§F若不§R憎§!他者，焉能§G爱§!吾身？§!"
 TNO_menupic_tooltip_3: "§F§Y文明§!无界，亦无§G始§!§R终§!。§!"
 TNO_ODF_icon_tt: "§o文明§!的§n碰撞§!"
 TNO_ODF_icon_tt_delayed: "§F两种截然不同的§Y文明§!，两个水火不容的§M世界§!，两条迥然相异的§C宿命§!…\n\n让我们投目西望中欧之地，一座巨人巍然屹立——§o大日耳曼国§!。作为欧洲的霸主，它是当今世界屈指可数的三大§G超级大国§!之一，其势力范围南起温得和克，北至斯匹次卑尔根群岛，西起都柏林，东至德黑兰，可谓是横跨欧亚非三大洲，幅员辽阔，无与伦比。高度发达的工业体系，尤其是汽车制造、 机械工程、化工与电气产业，使其经济繁荣昌盛。至少，一位普通的§o德意志§!公民无需再为果腹的面包和躲避空袭的栖身之所而苦苦挣扎。\n\n如今，望向遥远的东方，跨过伏尔加河，我们眼前浮现的是——§n俄罗斯§!…不，更准确地说，是§R昔日俄罗斯残存的废墟§!。这片与海洋为伴的广袤土地，如今却被数十个§V军阀§!肆意瓜分，各自妄称此地唯一的正统主宰。她仍然富饶，蕴藏无尽的资源——石油、天然气、森林、江河，她仍然伟岸，承载千年的历史与文化，可这一切都无法掩盖如今的残破与屈辱。\n\n现实为何至此？要知道，在§p五十年前§!，§n俄罗斯帝国§!与§j德意志帝国§!还曾并驾齐驱，平分秋色，各自怀揣着雄心壮志，踌躇满志。可短短弹指一挥间，两国命运已天差地别。在这短短半个世纪里，北境的巨熊与中欧的雄鹰便已在殊死搏斗中厮杀了三个回合——先是§R第一次世界大战§!，再是§R第二次世界大战§!，最后是§R西俄罗斯战争§!。但令§n俄罗斯§!扼腕叹息的是，每一次的交锋，都以它的§e惨败§!而告终。\n\n如今的§n俄罗斯§!，正被§f第二次大动乱§!的战火所吞噬——无政府与战乱吞噬着昔日的帝国。但世间万物从无永恒，§n俄罗斯§!终将§G重归统一§!，并再次与§o德意志§!兵戎相见。只是这一次，对这两个国家而言，这都将是§R最后的机会§!，它们将赌上一切，来证明自己无可撼动的§Y霸权地位§!。在双方都手握足以§l毁灭世界§!的核武器库的情况下，这场斗争将不再是一场普通的较量，而是一场你死我活的生存之战。\n\n§x最后一战§!即将打响，而胜者尚未揭晓。§!"
