l_simp_chinese:
autonomy_china_warlord_regime: "军阀政权"
autonomy_china_warlord_regime_tt: "§L今日中国军阀统治的传统，可以追溯至周幽王十一年，犬戎灭西周的秩序崩溃。而中国史上，也有不少仁义厚道的皇帝，如汉光武帝刘秀，便是从小小军阀做起，进而统一天下。光武帝从未杀害身旁任何一位大将或是大臣，甚至放过了其他称帝的汉室宗亲。\n\n外国同行更加凶蛮残暴，将军队的掠夺以及屠杀制度化，但中国这儿的可比他们体面得多。中国的军阀并不像外国的那般受人辱骂，相反，中国军阀基本都是自治的文官或是军官，软弱的中央政权给予他们对地方的控制权，他们可不是些土匪或是疯狂的军人。§!"
autonomy_japan_residence_of_governor_general: "总督府"
autonomy_japan_residence_of_governor_general_tt: "§L总督府应当被视为大日本帝国之国内行政单元，与本岛各都道府县同为大日本帝国之疆域，而非共荣圈内具有名义独立主权的国家。此套殖民行政制度自大正时代便已形成，尽管当下的日本更愿意通过经济控制、代理人战争等手段完成其殖民扩张目标，但总督府制度仍然在一些特定地区延续了下来。§!"
autonomy_china_special_administrative_region: "行政院辖市"
autonomy_china_special_administrative_region_tt: "§L行政院辖市是中华民国的省级行政单位，根据民国38年（1949年）《市组织法》规定：凡经济、人口到达相应规模或具有特殊地位的城市，应设直辖市，受行政院之指挥、监督，且无权抵触中央及上级政府法令。\n\n院辖市的设置，是将富庶发达的城市及周边地区从原省份剥离，由南京控制其人事以加强监察，在国防和预算上给予特殊关照。院辖市同时代表了中央权威，与其相邻的省份——尤其是原省份，有义务以本地之经济支持院辖市的发展。这项地方制度改革，是晚年汪精卫扭转地方独立倾向的一次尝试。§!"
