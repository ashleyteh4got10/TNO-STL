state_lore_initials.377: " LAN "
state_lore_name.377: "兰州"
state_lore_desc.377: "“洮云陇草都行尽，路到兰州是极边。”兰州地处西北边疆，黄河自城中奔流而过，折向北方，白塔山与皋兰山隔河相望，群峰环峙，构成这座古城天然的屏障。凭借控扼河谷、沟通东西的险要地势，作为“捍御秦雍，联络西戎，襟带万里，控制强敌”之要地，自秦汉至隋唐，中原王朝与西北诸族屡次在此交兵，城下烽烟不绝，河岸尸骨累累。一次次兵燹使百姓饱受苦难，也使兰州的军事地位愈发突出。\n\n跨入近代，兰州虽遭陕甘回乱重创，仍维持着西北第二大城市与行政中心的地位，民国肇建，兵戈却未止息，战乱与灾荒交相侵逼，饥民扶老携幼涌入城中，街巷哀鸿遍野，死者无算。抗战爆发后，兰州成为支撑大局的后方重镇。国际交通线横贯此地，苏联援华物资循此运入统一战线；迁来的工业机器甫一抵达，便被送入新建厂房。城外，空袭警报屡屡划破长空，中国空军与意制轰炸机殊死鏖战；城内，第八战区长官朱绍良坐镇长官公署，筹划军务，竭力维系艰难的抗战局面。阵线接下残局后，并未停下建设脚步。焦家湾昔日的宁静，渐被南来北往列车的轰鸣打破；西固与七里河原先荒凉的土地上，一座座厂房拔地而起，烟囱与铁轨一道向远方延伸。\n\n尽管汉中迅速崛起，对兰州阵线第二大城市的地位形成有力竞争，这座黄河之滨的重镇仍旧焕发着蓬勃生机。可以预见，无论未来还有多少灾殃困苦，兰州儿女都将以血汗守护这片土地，保卫西北，保卫革命。"
state_lore_initials.2001: " BJI "
state_lore_name.2001: "宝鸡"
state_lore_desc.2001: "巍巍大秦岭，滔滔渭河水。宝鸡雄踞八百里秦川西端，南倚秦岭，西接关陇，渭河贯通其间，嘉陵江亦发源于此。山川交会，关隘相连，使这座古城自古便是联络关中与西北的交通要冲。\n\n相传神农氏在此留下足迹，周人在这片土地上奠定王业，秦人又由此积蓄力量，终成一统天下之势。千百年间，王朝兴替，宝鸡始终守望着关中西大门。抗日战争爆发后，陇海铁路向西延伸至宝鸡，大批沦陷区的百姓、工商业者与文化人士辗转迁来。厂房沿铁路兴建，商铺在街巷间铺开，昔日万人的小城，人口很快增至十一万，工商日渐兴旺，文化一时繁盛。\n\n然而，日益严峻的战局终究击碎了这段短暂的繁华。九七式轰炸机掠过城头，炸弹落下，洋楼轰然坍塌，街市化为火海；而百姓在战火烈焰与对师管区的棍棒的恐惧之下四散奔逃，繁华的城市唯余满目疮痍。宝鸡解放后，阵线在残存的城市基础上重整交通，兴办工业。宝汉线的通车，将关中与汉中紧紧连接；有色金属厂、石油机械厂相继建成，机器的轰鸣重新响彻车间，铁路的汽笛再次回荡山谷。如今的宝鸡，已成为阵线重要的工业城市与交通枢纽。\n\n可以预见，这座曾在战火中沉寂的古城，将以崭新的钻机、满载的车皮和无数劳动者的汗水，再度焕发光彩，成为阵线立足西北、支撑前方的坚实后盾！"
state_lore_initials.2002: " YCC "
state_lore_name.2002: "银川"
state_lore_desc.2002: "天泽边塞，地眷银川。秀毓古邑，彩溢中原。银川东枕黄河浩瀚，西倚贺兰巍峨，南接六盘险峰，北连万顷草原。凭黄河灌溉之利，这座“塞上江南”的凤凰城，自古便是西北边疆的一片富饶之地。\n\n党项族人在此建立西夏，诸多王侯将相、文人骚客曾在这里留下足迹，使这片土地在中国历史上留下了浓墨重彩的一笔。然而，当回乱的寒风席卷塞上，昔日繁华也随之凋零。教众起事，战乱频仍，饥荒遍野，商旅断绝，原本和睦的民族关系也日渐紧张。马鸿逵主政宁夏后，百姓又陷入新的苦难。“五丁抽二”的征兵政策，层层加码的苛捐杂税，逼得许多家庭拆下房梁抵税，甚至不得不拿儿子抵债。\n\n银川虽绿树成荫，却难掩百业凋敝，民间遂有“一条马路两岗楼，一个警察看两头，一个公园两只猴”的讥讽。随着阵线击败马鸿逵，银川终于迎来了新的春天。银兰铁路的通车打破了长期以来交通闭塞的局面，商旅重新汇集，物资流通日益畅通，市场逐渐恢复往日的热闹。与此同时，前线军队的建设需要也带动了贺兰山下的工业发展，一座座厂房拔地而起，机器轰鸣。\n\n如今，凤凰重新翱翔于贺兰山上，但繁荣的市场声中，却仍夹杂着解放军换装整备、开拔后套的脚步声。"
