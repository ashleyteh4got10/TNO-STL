 ### China

 #101
 CHI_CountryInfo_Folder.101: "命运无常"
 CHI_CountryInfo_Content.1: "国民政府"
 CHI_CountryInfo_Content_desc.1: "1911年的§M辛亥革命§!推翻了§f清王朝§!，£GFX_GNG_chinese_nation_texticon §W中国§!结束了两千年的帝制，迈入了£GFX_LAR_CHI_government_texticon §W民国时代§!。中华民国的政权最初由§s北洋军阀§!掌控，虽然名义上统一了中国，但§R军阀混战§!，§R帝制复辟§!依然困扰着中国人民。\n\n为了建立以£GFX_GNG_chinese_texticon §M“三民主义”§!为思想的£GFX_LAR_CHI_government_texticon §W中华民国§!，§Y孙中山§!建立了£GFX_GNG_chinese_texticon §M中国国民党§!，并与£GFX_LAR_CHI_Communist_Party_texticon §V中国共产党§!展开了合作。然而，1924年孙中山因病离世，只能把统一中国的遗愿寄托在£GFX_GNG_chinese_texticon §M国民党§!身上。作为孙中山遗嘱的见证人，国民革命的坚定追随者，§Y汪精卫§!自认为自己是孙中山思想和事业的唯一合法继承人，意图成为§M国民党§!甚至是整个§W中国§!的最高领导人。\n\n1926年，掌控军权的§Y蒋介石§!领导国民革命军开启§Y北伐战争§!，逐个击败各地军阀后，£GFX_LAR_CHI_government_texticon §W国民政府§!从广州迁往武汉。蒋介石同样也拥有对最高权力的野心，于1927年开始§Y“清党”§!，结束了第一次£GFX_GNG_chinese_texticon §M国§!£GFX_LAR_CHI_Communist_Party_texticon §V共§!§Y合作§!，并在§Y南京另立政府§!。\n\n汪精卫，蒋介石，以及各地军阀不停地相互§J征伐§!、§O妥协§!、§Y合作§!，最终形成了各地豪强军阀名义上承认£GFX_LAR_CHI_government_texticon §W国民政府§!的“统一”局面。£GFX_LAR_CHI_government_texticon §W国民政府§!中，也形成了蒋主党、军，汪主政的格局，但二者对权力的争夺和政治上的分歧始终存在，哪怕直到§R大东亚战争§!也是如此。"
 CHI_CountryInfo_Content.2: "兵燹之祸"
 CHI_CountryInfo_Content_desc.2: "成功解放£GFX_MAN_manchukuo_texticon §O满洲§!后，£GFX_LAR_JAP_flag_texticon §e大日本帝国§!于1937年开启了§e大东亚战争§!，为从§R欧美帝国主义§!手中拯救出亚洲同胞挺身而出。§Y汪精卫§!认为£GFX_GNG_chinese_nation_texticon §W中§!£GFX_GNG_japanese_frustration_texticon §j日§!之间不应该兄弟阋墙，应当携手共建§e“大东亚新秩序”§!，于是在§Y1938年武汉会战§!后和意见相近的国民党官员一起前往河内，投靠£GFX_LAR_JAP_flag_texticon §e日本§!，开启了§e“和平运动”§!。蒋介石则带领国民政府迁都重庆，继续负隅顽抗。\n\n战争期间£GFX_LAR_JAP_flag_texticon §e日本§!先后在§Y华北§!和§Y南京§!建立了§e中华民国临时政府§!和§e中华民国维新政府§!，意图否定£GFX_LAR_CHI_flag_texticon §W重庆国民政府§!的国家主权，成立自己认为§Y“合适的”§!中国统一政权，但苦于网罗的中国政客们难以服众，£GFX_LAR_JAP_flag_texticon §e日本§!的计划一直未能达成。§Y汪精卫§!投入£GFX_LAR_CHI_CPS_texticon §e共荣圈§!的怀抱后，表达了自己对§e大东亚新秩序§!的认可，希望可以带领£GFX_GNG_chinese_nation_texticon §W中国§!与£GFX_GNG_japanese_frustration_texticon §j日本§!携手共进，§e日本§!方面也欣然接受。1940年，在£GFX_LAR_JAP_flag_texticon §e日本§!的协调下，§Y汪精卫§!与另外两个临时政权完成了职位和工作的分配，在保留§e华北政务委员会§!并保障其自治的前提下成功在§Y南京§!组建£GFX_LAR_CHI_national_emblem_texticon §R国民政府§!，其控制的领土范围也随着£GFX_LAR_JAP_flag_texticon §e日本§!在中国的逐渐推进不断扩大。\n\n£GFX_LAR_CHI_flag_texticon §W重庆国民政府§!作为欧美的傀儡政府，多次阳奉阴违，在和平谈判上出尔反尔，但依然无法改变他们在战场上节节败退的事实。1944年，£GFX_LAR_JAP_flag_texticon §e日本§!发动§R“一号作战”§!计划，即§R“豫湘桂战役”§!，打通中国大陆连同南北的交通路线，£GFX_LAR_CHI_flag_texticon §W重庆国民政府§!军队只能继续向西南山区撤退。1945年，§R太平洋战争§!结束，[USA.GetFlag]§B美国§!退出战争，§V苏联§!崩溃，§R英国§!投降，§M同盟国§!其他成员全部战败，£GFX_LAR_CHI_flag_texticon §W重庆国民政府§!失去了所有的外部援助，陷入孤立无援的绝望处境。这时中日双方都精疲力竭，没有能力发动下一步攻势，£GFX_LAR_JAP_flag_texticon §e大日本帝国§!作为仁慈的领导者§Y决定暂时停止进攻，让共荣圈的百姓得以修养生息。§!\n\n1947年，凭借在§Y东南亚和中国的资源§!，§e日本§!在一定程度上恢复了部分元气，决心给予£GFX_LAR_CHI_flag_texticon §W重庆国民政府§!最后一击。最终，重庆陷落，§Y蒋介石§!在逃跑时死于空难，§Y毛泽东§!则失去了踪迹，§Y何应钦§!代表重庆§W国民政府§!宣布投降。大部分£GFX_GNG_chinese_nation_texticon §W重庆国民政府§!成员同意放弃对国家主权的宣称，承认£GFX_LAR_RGOC_flag_texticon §R南京国民政府§!为中国唯一合法政府，退而求其次成为割据一方的§Y地方军阀§!，§Y剩余小部分成员§!拒绝承认£GFX_LAR_RGOC_flag_texticon §R南京国民政府§!，退至§L西北大漠§!继续做着无谓的抵抗；£GFX_LAR_CHI_Communist_Party_texticon §V中国共产党§!同样没有投降，继续作为§V游击队§!在§Y山区和农村§!骚扰着£GFX_LAR_RGOC_flag_texticon §R南京国民政府§!。自此，§R大东亚战争§!结束，以§R欧美帝国主义§!彻底退出亚洲而告终。"
 CHI_CountryInfo_Content.3: "高掌远跖"
 CHI_CountryInfo_Content_desc.3: "§R大东亚战争§!结束，中国大地上终于再次恢复了平静，但摆在£GFX_LAR_CHI_national_emblem_texticon §R南京国民政府§!面前的是一片满目疮痍的国家。经历了战火的洗礼后，£GFX_LAR_CHI_national_emblem_texticon §R南京国民政府§!首先就要面对§W国家统一§!的问题。\n\n£GFX_LAR_CHI_national_emblem_texticon §R南京国民政府§!，虽然名义上是§W中国唯一合法政府§!，但§Y仅在江淮地区有着实际的控制权§!。£GFX_GNG_expats_texticon §e日本§!为了保证可以更有效地从§e“中国合作者”§!这里得到更大的利益，亲自牵头在南京召开了§Y“中国省县市区划会议”§!。为了以最小的让步稳定地方军阀，£GFX_LAR_CHI_national_emblem_texticon §R南京国民政府§!同意§Y晋陕、广西、川西、广东、云南、贵州§!等地区由§Y当地军阀§!担任省长，而其他省市全部由£GFX_LAR_CHI_government_texticon §W南京政府§!直接管辖，省长则由£GFX_LAR_CHI_government_texticon §W中央政府§!直接任命。\n\n§R很可惜，事情并没有那么顺利。§!地头蛇的势力盘根错节，宛若§Y一个个独立王国§!，除去省级事务允许南京官员参与管理，£GFX_LAR_CHI_government_texticon §W中央§!的权力到了§Y市级§!与§Y县级§!就开始§R处处受到抵触§!，£GFX_LAR_CHI_government_texticon §W南京政府§!的政策§R完全无法在各地落实§!。\n\n1947年战争结束后，§Y战时体制§!却并没有结束，§Y行政督察专员§!依然能够指挥§Y地方警察§!和§Y保卫团§!，督察地方行政，甚至还同时兼任了§Y县长职务§!，严重破坏了§W地方文官政府§!。§Y汪精卫§!决定继续进行战时体制，以镇压全国§V反抗§!§M势力§!，并整合全国资源进行重建。但这种加重人民负担的行为引起了§V强烈的抵抗§!，外加§R地头蛇的层层盘剥§!，大部分资源被军政一体的地方§Y行政督察专员§!中饱私囊，所谓的重建更是进展甚微。1950年§V全国抗议爆发§!，让£GFX_LAR_CHI_national_emblem_texticon §R南京国民政府§!明白战时体制已经难以为继，不得不开始§W重建文官政府§!。1952年战时体制宣布§W彻底结束§!，同年£GFX_LAR_CHI_national_emblem_texticon §R南京国民政府§!的经济开始恢复，第一届§W制宪国大§!得以召开。最终£GFX_LAR_CHI_national_emblem_texticon §R南京政府§!基本稳定了§V华北地区§!以外省县，警察局权力也§W得以拆分§!，成为战后难得的好消息。"
 CHI_CountryInfo_Content.4: "或跃在渊"
 CHI_CountryInfo_Content_desc.4: "§Y1955年§!，中华民国军队装备新式武器，胸有成竹地开启§R西北剿匪战争§!，但衣衫褴褛的£GFX_GNG_chinese_texticon §M西北残党§!依然打得§Q国军§!溃不成军，不得不请求£GFX_LAR_JAP_flag_texticon §e日本§!帮忙收拾残局，[GAN.GetFlag]§e西北军政监§!随之成立。病重的§Y汪精卫§!在得知战败的消息后不久就逝世了，这被§M西北匪军§!视作他们的重大胜利，与此同时，§W各地§!§V抵抗§!§M势力§!意识到国军竟是如此不堪一击，开始§R蠢蠢欲动§!，£GFX_LAR_CHI_national_emblem_texticon §R民国政府§!陷入§R内外交困§!的局面，将领们开始思考怎么建设好§Q中国的军队§!。\n\n值此危难时刻，§Y南京却上演着争夺总统之位的大戏§!。§e改组派§!、§s中央派§!、§O公馆派§!之间不断你征我伐，就连§e华北政务委员会§!也对总统宝座表现出极大的兴趣。§Y总统争夺战§!很快§R陷入了混乱§!，各派都没法推出让大部分人满意的人选，情急之下，§R日方顾问§!建议各派都退一步，先选出总统稳定局面，解决燃眉之急再说。于是，各派推选看起来势力最小，没有野心，并且在§Y派系政治§!上相对独立的外交部长§Y高宗武§!接任£GFX_LAR_CHI_national_emblem_texticon §R民国政府§!总统职位。\n\n§Y高宗武§!接手后，政府重新运转，避免了£GFX_LAR_CHI_national_emblem_texticon §R民国政府§!倾覆之危。他首先认为只有开启£GFX_LAR_CHI_agricultur_reform_texticon §B土地改革§!，巩固农村，才能消除£GFX_LAR_CHI_Communist_Party_texticon §V共产党§!农村§V游击队§!的影响，但由于地方官员的§R欺上瞒下§!，各个派系的§R相互倾轧§!，一段时间后第一次土改的尝试§R宣布失败§!。\n\n所幸，£GFX_LAR_CHI_national_emblem_texticon §R民国政府§!在一些方面还是能向好的方向发展。§B教育§!的重要性被所有人认识到后，入学儿童数量§G逐渐上升§!，派往国外留学的§m科学技术人员§!也慢慢§G学成归来§!，引进的§m技术§!也帮助中国推进§L新工厂§!的建设。\n\n1959年§R自然灾害爆发§!，§e华北派§!§R愚蠢的官员§!和§R糟糕的动员能力§!导致§e北方§!§V歉收严重§!，因此§e华北地区§!的§V反抗起义§!此起彼伏。但动乱主力依然是没有经过军事化训练的农民，起义还在可控范围。然而，1960年，正当§e华北派§!认为起义浪潮削弱，可以喘口气的时候，一场§V大规模起义§!突然爆发，在§Y短短一个月的时间§!席卷了整个§e华北地区§!，很明显，一支§V有组织§!，§V有目标§!的正规军参与其中，§e华北治安军§!军力和§s地头蛇武装§!完全无法阻挡起义。后来调查发现这场起义是由潜伏在§e华北地区§!的£GFX_LAR_CHI_Communist_Party_texticon §V共产党§!组织的，他们花了两年的时间串联了几乎整个§e华北§!的£GFX_LAR_CHI_Communist_Party_texticon §V起义军势力§!，庞大的£GFX_LAR_CHI_Communist_Party_texticon §V起义力量§!一度让§e华北治安军§!只能龟缩于大城市和铁路干线中。为了尽快稳定局面，£GFX_LAR_JAP_flag_texticon §e日本§!要求§j关东军§!入关，£GFX_LAR_CHI_government_texticon §W南京政府§!派兵北上协助镇压，同时紧急调集§Y满洲§!，§Y江南§!，§Y中南半岛§!的大量粮食运往§e华北§!，以§Y“边打边赈”§!，跳过官僚，军队包办来处理，终于在1961年§Y平息了动乱§!，保住了§e华北§!岌岌可危的秩序。这场§V华北大起义§!迫使§e华北派§!让步，默许了£GFX_LAR_CHI_government_texticon §W南京政府§!势力在§Y河南§!和§Y山东§!两省站稳脚跟。\n\n政敌的§G让步§!，全国§W一定程度上的统一§!，£GFX_LAR_JAP_flag_texticon §e日本§!的支持，让§Y高宗武§!这个妥协产生的总统§G成功继任§!，在他心中勾勒出的§m中国未来发展蓝图§!也得以提上日程。1962年的新年前夜，§W“五个现代化”§!展示在世人面前，高宗武希望中国能够§Y重新回到世界前列§!的地位，或许，他的脑海中还有着§M更加宏伟和疯狂的计划……§!"

 #102
 CHI_CountryInfo_Folder.102: "乱世浮沉雨打萍"
 CHI_CountryInfo_Content.5: "心似已灰之木"
 CHI_CountryInfo_Content_desc.5: "1932年初，§W高宗武§!在《外交评论》上投稿了《最近日本之总观察》；1932年11月，§Y蒋介石§!决定设立§Y国防设计委员会§!，§W高宗武§!§G受邀加入§!，跻身§W民国名流§!之列；1934年5月，§W高宗武§!被调到§W外交部§!，此时的部长正是§Y汪精卫§!；1935年，未到而立之年的§W高宗武§!出任§W亚洲司司长§!；1936年，因其独特的外交能力，日本驻华大使§Y川樾茂§!甚至指名要求与§W高宗武§!商谈……丰富的外交经验让§W高宗武§!成为亚洲外交界人尽皆知的§G青年才俊§!，他对自己的能力充满自信，也踌躇满志地相信通过外交方式§G可以解决§!国际之间的矛盾和冲突。\n\n§R战火§!在亚洲最大的£GFX_LAR_CHI_flag_texticon £GFX_LAR_JAP_flag_texticon §e两个§!§M国家§!之间点燃后，§W高宗武§!认为这是民族存亡的危难时刻，更狂妄自信地认为是一次机会，决意通过§W外交§!为§G亚洲带来和平§!。§M中§!§e日§!外交断绝后，在§Y周佛海§!的推荐下，§W高宗武§!主动向§Y蒋介石§!请缨前往§Y香港§!与§e日本§!建立联系。随着外交工作的进行，特立独行的§W他§!逐渐脱离了£GFX_LAR_CHI_flag_texticon §W重庆国民政府§!的指示，按照自己的想法推进§G对日外交§!。从日本联系人口中，§W高宗武§!得知自己的老上司，国民党二号人物§Y汪精卫§!正在武汉从事§e“和平运动”§!，敏锐的§W他§!捕捉到了一丝§G和平的曙光§!，决定与§Y汪精卫§!一起展开对日谈判，为中国§G带来和平§!。\n\n1938年，§W高宗武§!与§e日方§!终于确定和平的必要条件——§Y蒋介石§!下台，由§Y汪精卫§!代之。这显然不会得到§Y蒋介石§!的同意，于是国民党§e“和平派”§!便开始筹备在南京建立新的中央政府。然而，1939年，§W高宗武§!和他的好友§W陶希圣§!开始逐渐意识到§e日方§!§R盛气凌人§!，§R贪得无厌§!的野心，他们对§W和平谈判§!的本质也慢慢产生了怀疑。6月，§W高宗武§!、§W陶希圣§!与§Y汪精卫§!一行人前往£GFX_LAR_JAP_flag_texticon §e日本§!进行最后政府筹备谈判，期间他们见证了§P无数§!§e不平等§!§V条约§!的签署，§e日本§!的真面目在此刻暴露无遗，§W高宗武§!和§W陶希圣§!才幡然醒悟，意识到自己成为了§R屠杀同胞的帮凶§!。"
 CHI_CountryInfo_Content.6: "身如不系之舟"
 CHI_CountryInfo_Content_desc.6: "§W高宗武§!在1940年日本病床上经常会回忆以前的事情，如果说他的前十年§G风光无限§!，那现在§W他§!感到的除了§R痛苦§!，§e就剩悔恨§!。谈判结束后突发的肺结核让§W高宗武§!不得不留在日本修养，“养病”期间的§W高宗武§!曾以日本俳句的写了一首小调：§W“北方，南方，高山，海洋，他们全都不属于中国，中国百姓将何以为家？”§!\n\n半年的修养后§W高宗武§!回到了§Y香港§!，在此恭候多时的§W陶希圣§!询问§W高宗武§!是否要及时悬崖勒马，与此同时，£GFX_LAR_CHI_national_emblem_texticon §R南京国民政府§!也向他们发出了邀请。§W高宗武§!意识到抗战已经遭遇到§R前所未有的困难§!，中国进入了§R最危难的时刻§!，§e悲观§!与§e绝望§!涌上了§W他§!的大脑，决定§Y将错就错，接受南京的邀请§!。§W陶希圣§!也认为自己独木难支，与§W高宗武§!一起前往§Y南京§!。这一次，§W高宗武§!收起了傲气，学会了忍耐，学会了伪装，明白了§W想要达成目的，就必须隐藏它§!。\n\n自此，一直到§Y1955年§!，§W他§!一直在维持§e“中日友好关系”§!的第一线，就像§W他§!之前做的事情一样，尽可能地让中国体面下去。但中国孱弱的国力无法支撑自己的外交战略，每一次谈判只能§R不断地妥协§!，§W高宗武§!再一次§R在自己熟悉的领域碰壁了§!。\n\n当命运女神抛出§W硬币§!时，没有人能准确猜出是哪一面落地。1955年§Y汪精卫§!的去世后，几乎没有参与§e改组高层政治决策§!的§W高宗武§!接任了这个位置，得之不易的权力让§W高宗武§!再一次拾起了§W希望§!，或许自己§G还有机会弥补过错§!。\n\n§L工业部门扩大§!，§B全国扫盲教育体系§!，§m现代科研设施§!等等，§W高宗武§!的§G宏伟蓝图§!伴随§W他§!的野心不断扩大，现代化，必须完成现代化，无论付出§R怎么样的代价§!都要完成，他要带着£GFX_GNG_chinese_nation_texticon §W整个国家§!§G向着未来狂奔§!，增加更多的砝码与§e日本§!谈判，让§e日本§!让步，§W甚至更多§!。\n\n§W高宗武§!拿着§W五个现代化§!的演讲稿走上了演讲台，§W他§!仿佛再次回到了1934年11月与§e日§!§O满§!谈判的那个下午，那个签订《通邮协定大纲》的时候，§M不过这一次，§!§W他§!§M将更进一步。§!"

 #103
 CHI_CountryInfo_Folder.103: "往日幽影"
 CHI_CountryInfo_Content.7: "残焰"
 CHI_CountryInfo_Content_desc.7: "纵观§W中国§!的历史，§s永无止境的压迫§!与§s血腥残酷的剥削§!就像是无法挣脱的沉重镣铐。张牙舞爪的§j日本主子§!至今仍盘踞亚洲，诉说着他们那建立在血与泪上的虚伪共荣；§e帝国主义者§!，§o乡绅地主§!，§s反动官僚§!的鞭子抽打在人民的脊背。但在农闲的歇息的土坡上，在默默燃烧的火堆边，总有人依然记得§V那支军队§!，§V那个政党§!，还有那些顽强而永不停止抵抗的人：£GFX_LAR_CHI_Communist_Party_texticon §V中国共产党§!和§V红军§!。\n\n总有人会说，在抗日战争惨败之后，£GFX_LAR_CHI_Communist_Party_texticon §V中国共产党§!便随着毛泽东死在重庆而土崩瓦解。§j日本殖民者§!和§s买办官僚§!则坚定的想要抹去一切§V红军§!曾经存在过的痕迹。但在§V红军战士§!的口中，这些论调会被当做最可笑的谬论：毛主席是独具慧眼的战略家、军事家，领导着红军走完了长征，完成了古往今来任何军队都没有达成过的战略转进。在他领导下的整个党都深知，深入群众的§Y游击战§!才是他们的强项，怎么可能会集结全部兵力跑到重庆只为去做孤注一掷的反抗？每一位革命军人都是一点星火，哪怕毛主席牺牲在了重庆城，他们也依旧没有放弃这最伟大的斗争，他们或是前往§L西北大漠§!保存实力，或是§g就地潜伏§!等待时机。\n\n时光一晃，数十年过去，现今国际局势§Y风云变幻§!，民国政府内部§R危如累卵§!，已经无力再掩盖城市与农村中存在的各类激烈矛盾，村庄间重见天日的§V游击队§!以及城市中再次活跃起来的§V地下组织§!让伪民国的§s腐败官员§!坐立难安。从大西南的崇山峻岭到大西北的荒漠戈壁，从霓虹闪耀的上海城再到华北的广阔农村中，£GFX_LAR_CHI_Communist_Party_texticon §V共产党§!的战士们再次默默地打起了他们的红旗，这些毛泽东思想的传承者们永不放弃，绝不屈服，直到民族解放以及§V“耕者有其田，劳者有其果”§!的伟大梦想实现为止。"
 
