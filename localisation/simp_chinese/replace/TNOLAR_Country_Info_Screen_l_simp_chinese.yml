 CHI_CountryInfo_Folder.104: "一个更伟大的世纪？"
 CHI_CountryInfo_Content.8: "§G==特色==§!"
 CHI_CountryInfo_Content_desc.8: "- 平衡§W立法院§!的各个派系，让大多数人感到满意，并§G让之成为助力§!。\n\n- 体验§G重建§!一个满目疮痍的国家。\n\n- 领导一场现代化，不择手段的现代化。\n\n- 平稳度过石油危机，或是在民众的反对和政敌的污蔑中黯然下台。\n\n- 与仇敌的妥协只是§W精妙的谎言§!，最终的目的是§G复仇与解放§!。"

 

