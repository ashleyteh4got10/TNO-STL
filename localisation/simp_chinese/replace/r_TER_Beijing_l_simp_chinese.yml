BJC_Yu_Luoke: "遇罗克"
BJC_Yu_Luoke_desc: "遇罗克是一名土生土长的北京人，他的父亲是日本留学生，一直在给日本人水电站当工程师，收入可观。因此遇罗克自小便接受了良好的教育，他也没让父母失望，从小学到高中一直成绩优秀。但就在升大学的那一年，一道门槛从天而降：凡在日企工作的中国人，必须将子女送往日本接受高等教育，不准上中国人开办的大学。\n\n遇罗克父子二人十分明白这个命令背后的深意。今非昔比，日本对中国人才的吸引是无所不用其极的，一旦去了日本就再也回不到中国。所以他毅然放弃了考学资格，直面社会，自谋生路。高中学历的遇罗克四处打工，高中学历的他要想找份体面的工作也不是很难，他当过服务员，做过学徒工，给夜校当代课教师，最后他给高中图书馆当图书整理员。社会的温情冷暖让他尝遍劳动者的艰辛，他开始思考为什么在任何时代，底层劳动者都是位卑言轻，命贱如土。\n\n他把自己的思考都记在一个本上，一个同事看过后直呼遇罗克被“赤色思想”洗了脑。对此遇罗克只是微微一笑，他已经开始给某些期刊撰写投稿了……"
