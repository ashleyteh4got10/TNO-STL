KPA_Thakin_Than_Tun: "德钦丹东"
KPA_Thakin_Than_Tun_desc: "德钦丹东的人生与昂山将军和德钦梭缠绕交织。昂山是历经岁月沉淀的政客，梭是高亢忿激的革命者。丹东两者兼有涉猎，但更像一位恬淡温和的诗人。缅甸民族主义者组成的联盟之下，人们各自建起不同的党派，彼此身份重叠、关系复杂。学养深厚，文采出众的丹东被昂山委以宣传联盟的重任，缅甸共产党也因其马克思主义倾向虚席以待。\n\n在如何对待日本的问题上，印度陷入分裂，联盟同样面临着势不可挡的分歧。当合作论调成为主流时，梭退出联盟另建红旗共产党，号召全缅甸的工人农民推翻日本统治。临行前他给继任缅共总书记的丹东留下一句话：“就算和英帝国主义者合作，也比日本法西斯好。”丹东对此不予置评，凭着和昂山将军的关系，他希望留在联盟内做最后一搏。\n\n1949年，经日本授意，昂山和吴努联合其他党派宣布禁止分裂活动，对共产党发动残酷的清洗。许多党员死在背叛的枪口下，包括丹东尚在日本留学的弟弟。淋淋鲜血泼到丹东身上，驻足回首间，人生行至岔路。他有一个重新跪倒在昂山膝下做一名马前卒的机会——他和昂山可是亲戚！但直到警察突入丹东住宅时才发现这里早已人去楼空。在军队朋友的护送下，丹东和他的同志们一路狂奔到红旗派控制下的东北边境小镇勐拉，那里是极左叛徒们最后的栖身之处。\n\n在边境上，德钦丹东遇到一群中国人，军服又破又烂，一片布缝的红星紧紧贴在帽子上，丛林碧玉掩映间鲜艳夺目。来者自称滇桂边纵队，专门联络潜藏在深山中的抗日组织。当他们问及德钦丹东是否愿意加入时，德钦丹东接过枪，向弹仓内压入一颗子弹，回答道：“我已做好战斗的准备。” "
KPA_BUR: "缅甸联邦"
KPA_BUR_DEF: "缅甸联邦"
KPA_democratic_union: "民主联军"
KPA_democratic_union_desc: "缅甸共产党致力于扩大解放阵线，联合所有进步派别组建缅甸民主联军，共同推翻昂山的独裁统治。在民主、独立的承诺下，众多自治邦军和少数民族武装愿与根据地保持表面上的和平，克伦、若开等邦的武装团体选择加入我们的阵营。\n\n经过一段时期的训练和思想教育，联军克服了质量参差不齐的困难，能够胜任革命工作。"
KPA_announcement_in_prison: "狱中宣言"
KPA_announcement_in_prison_desc: "1949年，昂山政权开始大肆搜捕共产党人，党的第四书记德钦巴定及一大批党员不幸被捕入狱。面对反动政权的猖狂进攻，德钦巴定在狱中带领同志们与敌人展开了决绝的斗争，并形成《狱中宣言》作为党的纲领性文件：\n1.彻底消灭日本帝国主义及其走狗；\n2.拒绝投降路线，进行武装斗争；\n3.坚持工人阶级领导，实施土地改革；\n4.建立自下而上的统一战线。"
KPA_fuck_off_the_drugs: "铲除毒草"
KPA_fuck_off_the_drugs_desc: "英、日帝国主义者将罂粟种在缅甸的土地上，使毒品生产像瘟疫一样遍布全国，根据地也未能幸免于难。据不完全估计，根据地的财政收入中有接近四成来自这些毒果的汁液。\n\n可观的毒资让很多党员在“禁毒”问题上噤若寒蝉，对其危害置若罔闻（某些党员甚至亲自贩毒）。全面禁毒是党的核心政策，必须采取雷霆手段打击毒品产业，还缅甸各族人民一个干净清白的新社会。"
KPA_red_guardian: "赤卫军"
KPA_red_guardian_desc: "德钦丹东主席收养了许多不幸失去父母的孤儿，他们来自缅甸各地，出身于不同的民族。在主席的悉心照料下，这些孩子成长为无限忠诚的共产主义战士，将党视作再生父母。他们自称赤卫军，发誓用生命和鲜血保卫红色政权，作一把钢刀狠狠插进阶级敌人和革命叛徒的心脏。"
KPA_storm_coming: "离弃……"
KPA_storm_coming_desc: "昂山的统治覆灭后，抵抗日本的联合战线顷刻开裂。数目繁多的地方武装对共产主义嗤之以鼻，不同路线的党派对领导地位虎视眈眈，党内某些非缅族同志也窃窃私语——这些势力异口同声认定共产党是“背信弃义的觉醒者”。\n\n他们既不追随昂山，亦不追随我们。\n\n赤裸裸的现实摆在眼前，无论多少甜言蜜语都不能消解偏见。革命每推进一步，阶级斗争便愈发尖锐。我们坚信，革命的道路将一直延续下去，永远不会停歇……"

VIN_Ngo_Dinh_Diem: "吴廷琰"
POLITICS_NGO_DINH_DIEM_DESC: "吴廷琰的家境从他的父辈急转直上，自那时起吴家开始侍奉皇帝左右。朴素的国家责任感使吴父放弃前往神学院深造的机会，但他仍然是一位虔诚的天主教徒，这份宗教信仰同样传给三子吴廷琰。\n\n家族联姻给了吴廷琰门阀贵胄的身份加持，使他早早步入越南上流社会。相比于父亲，吴则更显心胸狭隘且妄自尊大。生来就比整个国家的人高贵千百倍的吴廷琰总是认为自己见识高远而聪颖异常。越南对他而言，整个国家就像是唾手可得的囊中之物。而对待同样生长在这片土地上的人，他既不理解，也懒得深究。那些穷乡僻壤里对着佛像跪跪拜拜的愚夫蠢妇，根本入不了吴的法眼。\n\n如果有人出手干预自己做事，吴廷琰的心就像被液压机重重碾过一样痛，他一定要炸开浑身的硬刺顶得来人遍体鳞伤。对同僚如此，对皇室如此，对法国人或日本人亦是如此。在政府工作的岁月里，依托家族势力和“民族主权”的政治诉求，吴廷琰积攒了不少人脉，也得罪了不少人。\n\n越南民族独立重要吗？重要。怎样才算独立呢？吴廷琰说了算的越南才算独立。\n\n有人问吴廷琰：你这辈子为了权术四处奔走不觉得无聊乏味吗？吴立刻滔滔不绝地从家庭传统讲述自己是一位土生土长的越南人，再到反对法国殖民入侵的光辉岁月，最后自己肩负着父兄的期望，以及复兴越南民族的使命，所以他的奋斗历程并不枯燥，也从不乏味。稀里糊涂听完似是而非的套话，让人实在抓不住重点追问下去，只得在吴廷琰的笑脸目送下讪讪离去。\n\n这又是一出好戏。"
SEA_VIN_paternalism_party: "越南民族联盟"
