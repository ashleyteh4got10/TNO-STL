Viet_Cong_Central_Committee: "越共中央委员会"
VIC_TER_Communist_party: "越南共产党"
VIC_TER_Communist_party_long: "越南共产党"
VIN_village_consolidation: "“集并屯”计划"
VIN_village_consolidation_desc: "为隔绝共匪与农民的联系，参照中国华北治安战，总参谋部设计出一整套“集并屯”方案。\n\n这是一种全封闭式的村庄防卫体系，用竹刺枪和木栅栏将村子包围，禁止人员出入。我们的士兵也会驻扎在村子里，随时准备战斗。"
VIN_buddhism_disaster_in_1965: "乙巳法难"
VIN_buddhism_disaster_in_1965_desc: "《基督国教令》激起了全国僧人及佛门信众的不满，这些人在街头游行示威，破坏国家稳定。\n\n安全部队已采取相关行动，封闭全国大小寺院，拘禁和尚，驱散并逮捕那些不知好歹的暴徒。"
VIN_irritating_royalty: "纠缠不休的王室"
VIN_irritating_royalty_desc: "吴廷琰首相在竞选过程中挤走了一众皇亲候选人，而他任命自家宗族进入政府接管要职的举动又动了许多王室成员的蛋糕。现在，吴首相的诸多行政举措都遭到了皇室成员的阻挠，这种泥塘般的政治状态要持续好久——直到吴首相稳定下局势。"
VIN_irritating_JAPANESE_FUCK_YOU: "神厌鬼烦的日本顾问"
VIN_irritating_JAPANESE_FUCK_YOU_desc: "我们曾经希望日本帝国可以向我们传授先进的作战经验，可目前来看这些昭和参谋并没有给自卫队带来多少进步。他们瞧不起我们越南的士兵，又没有真才实学教给我们越南的军官；指挥作战室只懂得瞎冲乱打，行动失败就把责任推到我们头上。军队的人已经受够了这种无缘无故的蔑视。"
VIN_national_self_defence_force: "越南自卫队"
VIN_national_self_defence_force_desc: "在共匪肆虐的时间里，日本帝国只允许我国保留刚好维持治安规模的部队，直到匪军猖獗才猝然允许我国自主动员士兵。"
VIN_a_LITTLE_BIT_of_corruption: "“略显”腐败"
VIN_a_LITTLE_BIT_of_corruption_desc: "吴首相宣誓就职后，政府中就出现了许多首相的亲戚。这些亲戚的生活都非常讲究：汽车要开德国的、厨师要雇中国的、家中仆役要聘菲律宾的、精装家具要用日本的。\n\n当然这些都只是表面上的奢侈，没人知道吴氏宗亲背地里给自己捞了多少钱。"
VIC_fatherland_front: "越南祖国阵线"
VIC_fatherland_front_desc: "越南祖国阵线（汉喃：𩈘陣祖國越南）是全越南第二大红色组织，仅次于我党。它囊括了许许多多的左翼人权团体，接受我党领导，帮助我们与社会上形形色色的阶层进行沟通，保证统一战线政策实行。"
VIC_under_the_dense_forests: "树海迷踪"
VIC_under_the_dense_forests_desc: "我国北部是绵延不绝的崇山峻岭，山上生长着遮天蔽日的原始森林。这是我们天然的隐形外衣，保护我们的人民，我们的士兵，我们的工厂不受敌人轰炸的威胁。"
VIC_Ho_Chi_Minh_lane: "胡志明小道"
VIC_Ho_Chi_Minh_lane_desc: "自越南广治省穆加山口开始，一路向南延伸600公里，途径老挝、柬埔寨，再次回到越南，进入西原地区。这条诡谲多变，错综复杂的山路就是我党游击队的生命线。开通这条进攻路线，敌人根本探查不到我们的战略意图，还为解放南方创造了优越条件。"
VIC_live_off_the_fat_of_the_land: "靠山吃山"
VIC_live_off_the_fat_of_the_land_desc: "虽然能通过海上补给线充实我们的后勤，但根据地所需的各种生产原料仍然很难凑齐。为此我们专门组建地质勘探队，搜索矿山。同时精进我们的挖掘技术，不浪费一点矿石。"
VIC_adapt_the_bomber: "熟悉轰炸，按点报时"
VIC_adapt_the_bomber_desc: "长期革命战争，让我们摸清楚日军轰炸的规律。我们照此制定了作息时间表,只要不发生意外，就当日本飞机丢下一堆废铜烂铁。"
VIC_military_adviser_from_QYC: "琼崖顾问"
VIC_military_adviser_from_QYC_desc: "中国共产党海南支部给予我们有力的支持。他们定期会向根据地派遣顾问团，协助我们整训军队。党中央每月给这些革命同志发1000斤大米作为工资。"

##尽可能保持原版设定并覆写TER设定
VIC_comrades_from_the_north: "北方来的同志"
VIC_comrades_from_the_north_desc: "每当稻子成熟的季节，一个身着短袖衬衫、头顶竹盔、眼戴墨镜的“贵人”就会拄着登山杖，率领一队人马驮着货物，前呼后拥地运进越盟控制的地区，此人便是中国共产党华南局第一书记——叶剑英。\n\n自1947年起，中共为了应对抗战失利的局面重新筹备建立华南局，用来联络大陆南方的抗日武装，其中包括越盟。叶剑英通过伪装身份，成为广东华人中间数一数二的黑市商人。在定期采购必需物资后，经过海南中转站，带到越盟根据地开展贸易。而且，叶剑英还能把越盟根据地的资金带到广东周转。\n\n中共带来的不止金钱还有军事专家，由韦国清、朱鹤云、卢绍武、萧向荣等人组成的顾问团从广西十万大山潜入越盟，帮助他们组建军队，对抗日本侵略者。\n\n虽然越共和中共共同铸造了长达十五年的友谊，但这种受制于人的援助招致了越南共产党部分“内向”党员的反感，这种刻意的情绪可能会在越盟境遇得到改善后迅速扩散，给中越双方带来并不愉快的合作。\n-------------------\n本精神将为越盟带来§G1个£tt_prod_unit 额外生产单位§!"
VIC_victory_in_lang_son: "谅山大捷"
VIC_victory_in_lang_son_desc: "在中共将领韦国清的协助下，越盟总司令武元甲策划了夏秋边境战役，第一次取得了对日本的重大军事胜利。在几周内，越盟部队击败了第38军第5师，占领了谅山市，迫使其撤退至鸿基。这场出乎意料的胜利让日本措手不及，也撼动了越南公众，他们现在转而反对无力处理危机的帝国政府。政府分崩离析之时，越盟也加快了扩张的步伐，继续与日本和越南两大帝国作斗争。"
VIC_20_years_of_resistance: "二十年来的抵抗"
VIC_20_years_of_resistance_desc: "自1941年越共中央八次会议决议成立越盟，举起反对日本帝国主义和法国帝国主义的义旗以来，我们已坚持抵抗了二十余年。二十年来，在越共坚强领导下，越盟击退了日本、泰国接连不断的入侵，扩大了根据地，在印支半岛上成长为一支不可忽视的抗日力量。我们已经坚持抵抗了二十年，只要帝国主义和日本侵略者还存在于印支半岛上，我们将毫不畏惧地再抵抗二十年！"
VIN_idea_viet_minh_desc: "任意摊开一张世界地图，上面都会标明：越南帝国是一个统一的国家，由位于顺化的中央政府统治。然而只要踏入越南的乡间就会发现，这里既无警察也无巡逻的日本兵，有的只是越南独立同盟，即越盟的武装部队。为争取越南独立，越盟曾在1941年对抗法国，而现在它的目标转变为了越南政府与驻扎当地的日本军队。在两位颇具魅力的领袖——胡志明与长征的领导下，越盟收获了全国各地乃至国外的大量援助，其中一部分便来自中国共产党。虽然从1950年代起，越盟的活动频率愈发减少，但他们正静候时机，准备趁政府势力衰微之际，一举发动其口中的§R“革命”§!……"
POLITICS_HO_CHI_MINH_DESC: "这个被全世界称为胡志明的人也叫“阮生恭”和“胡伯伯”，此外还有五十到二百个笔名。除了1890年出生于越南中部并在法国和俄罗斯接受马克思主义政治培训外，几乎没有人知道他的私生活如何。然而，全体越南人——甚至是他的敌人——都知道他是一个通晓多种语言的有为诗人，他用汉字和国语字写成的诗歌几乎可以让所有越南人轻松阅读、聆听。\n\n可如今经过二十多年的斗争，人们比以前更了解他了。首先是与法国的斗争，然后是与维希法国的斗争，最后是与日本的斗争——胡志明非常清楚，这都是同一种帝国主义。哪怕形势再怎么危急，他也绝不会举手投降。胡志明在越南北部开辟了一片解放区，将地下工作者派到了全国各地。此时他并非仅仅只是一个领袖，更是日越两国政府的噩梦，身上好似有解不完的谜团。在敌人眼里，他就像一个神话中的英雄。\n\n但胡志明年事已高，即使日本对亚洲的控制力已然减弱，他也自知大限将至，可能再也看不到越南作为独立国家傲然雄踞东南亚的时候了。胡伯伯在越南民间家喻户晓，人人拥护。可他走后，人民要跟随谁呢？"
POLITICS_TRUONG_CHINH_DESC: ""
