CPC_ANRL_events.1.t: "焦头烂额"
CPC_ANRL_events.1.d: "泰柬战争的爆发无疑是对新生东南亚革命联盟的一次重大考验，或许也是对邓小平个人能力的一次重大考验，从大清早踏进书记处办公室开始，秘书处就源源不断地向自己递送来自海南、越南、缅甸等地的电报。为了捋清楚这两天东南亚究竟发生了什么，他甚至不得不请人送来了一张中南半岛全图铺在自己办公室的地砖上，然后一屁墩坐在上面开始拿着笔到处标画。密集的信息流逐渐拼成了一条完整的事件链，在他面前铺开——\n\n泰国军队几乎如入无人之境，在极短的时间内占领了金边，柬共高层并未被俘，而是转移到了北部深山和越南境内，准备寻求东革盟援助——然而，越共与柬共素来不睦，将被迫撤进越南的柬共军队全部缴械，并驱逐了英萨利，此事惹得波尔布特大为恼火，向海南连发七封电报以示抗议。冯白驹打算居中调停，奈何两党争端级别太高，仅仅一个海南支部书记还无权擅自决断，他只好向西安发电请求中共中央下场调解越共和柬共冲突。\n\n及至夤夜，邓小平的脑子仍在高速运转着，思索着既能让西北全身而退，又能保全东南亚来之不易的革命果实的办法——直到门外的敲门声越来越重。\n\n他有些不悦地拉开门：“我已经说过了我今晚——”\n\n他抬眼一看，声音便突然小了许多——来人是毛泽东的秘书。\n\n“邓书记，毛主席让您尽快去他那一趟。”"
CPC_ANRL_events.1.o: "“知道了，这就去。”"
CPC_ANRL_events.2.t: "夜谈"
CPC_ANRL_events.2.d: "邓小平推开毛泽东的房门，“主席，找我有什么事吗？”\n\n话音刚落，他撇眼看见了坐在一旁的陈毅。\n\n“恩来去汉中做调研了，所以中央这段时间的任务都压在你们身上，辛苦了，今晚叫你们来主要是来讨论东南亚最近的事情的——请陈老总讲讲外交部那边的消息吧。”毛泽东坐在办公桌后，手中攥着一份文件，抬了抬眼。\n\n陈毅深吸一口气，从沙发上站起：“缅甸共产党总书记德钦丹东向我外交部求援，泰国策动缅甸克伦邦武装，连同克钦老解放区内反动军阀发动叛乱，局势暂时失控，希望我们给予军援。”\n\n话音刚落，邓小平点点头：“海南那边也有消息说越共柬共有冲突，想请中央出面调停。”\n\n“东南亚最近乱子不少。”毛泽东放下手中的文件，“东盟成立不久，就要接受泰国这个什么‘东南亚老大’的挑战……“\n\n两人连声应和。\n\n“……本质上是纸老虎。”毛泽东话锋一转，“泰国不是搞什么‘泰族复兴’嘛，可这些年转来转去都是几个反动军头的家族内斗，我看不出这里面有什么复兴的道理，以我看泰柬战争僵持时间不会超过三个月。”\n\n邓小平脑子转得快，一下反应过来：“主席的意思是，我们的目光要更……”\n\n“更放远些！”毛泽东说到这时已难掩内心的兴奋，自己站了起来，“这一段时间以来东南亚的行动已经撼动了日本帝国主义链条上最脆弱的环节，接下来将是一个我们党团结和带领起东南亚其他共产党，在亚洲掀起共产主义运动的好时机！”\n\n邓小平和陈毅对视一眼，互相都明白了毛主席的意思。"
CPC_ANRL_events.2.o: "“等总理回来，我们就组织一个中央的正式会议。”"
CPC_ANRL_events.3.t: "会议当日"
CPC_ANRL_events.3.d: "邓小平站在巨大的中南半岛全图前正侃侃而谈，尽管形体差距令他在这样大的地图前显得有些不太合衬，但在场的中央各负责同志应该不会在意这个，随着邓小平的讲述，所有人都开始畅想一个光明无限的未来——一次由中国共产党领导的国际共产主义运动的复兴。\n\n“……总结一下，我们认为，由我们党出头建立一个国际性的共产主义阵营的时机已经成熟，就当前国际形势而言，将东亚东南亚各国共产党紧密团结起来，对于我们打倒日本帝国主义、解放东亚的总目标是必要的。”话音刚落，整个会堂响起如潮掌声。\n\n毛泽东起立，接着邓小平的话讲下去：“小平同志已经把我想说的说差不多了，我提两点，第一点，这一个联盟是要为了打倒日本帝国主义，要为了亚洲受压迫民族的解放而建起来的，所以应当叫它‘亚洲民族革命联盟’；第二点，这一个联盟不单单是为了打倒日本帝国主义而建立的，哪怕迈过了解放战争的坎，我们党的同志也要看到，这个世界上还有很多其他形态的帝国主义，有德国的纳粹帝国主义，有美国的自由主义的帝国主义，我们党的担子会随着我们革命力量的壮大而越来越沉，我们当中的年轻同志要做好思想准备，未来要领导好我们的党，领导好这个联盟，坚持走革命的路线，坚持走反帝的路线，坚持走人民的路线。”\n\n众人再度鼓掌，深以为然。"
CPC_ANRL_events.3.o: "外交部要忙起来了。"
CPC_ANRL_events.4.t: "河内新景"
CPC_ANRL_events.4.d: "列车刚一进站，透过车窗，伍修权就看到了迎风飘扬的排排红旗，也看到了人群簇拥着欢呼中共代表团——当然，最重要的还是随处可见的，熟悉的镰锤标志，自1917年以来，镰锤就有着特别的魔力：无产者无论身处何方，只要看到镰刀锤子交叉的金色徽标，那里就一定会有共产党——无产者的政党，人民的政党。\n\n他从窗外能看见一些军装模样的代表，手捧着鲜花站在月台上静静候着，为首的一员将领器宇轩昂，与自己差不多岁数。\n\n“带头那个应该就是武元甲了，人称奠边府之虎，打起仗来没得说，是这个。”罗长青凑到伍修权身旁，竖起大拇指，“他在云南讲武堂读过书，算起来应该是朱老总的校友。”\n\n伍修权点点头：“我还记得他们夏秋边境战役胜利的消息传到延安的时候，主席相当激动，拿着报纸到处夸武元甲是个虎将，韦国清是个好军师……”话音刚落，他像是想起了什么：“说起韦国清，华南局的代表同志们好像没有过来？”\n\n“这次可是大谈判，所以才请中央派全权代表团来的，我听说叶书记肖书记他们还跟马万祺在广东澳门的黑市干啥来着……做房产和家电的生意，还要到处搜集广东的情报，还要协助海南冯书记那块的近海防卫……乱得很，要来也没空。”\n\n两人哈哈笑起来，这时列车汽笛发出长鸣，两人脚下一晃，列车随即停稳。\n\n两人对视一眼，点点头，走到即将开启的车门前。"
CPC_ANRL_events.4.o: "他们相信，门外将是花团锦簇。"
CPC_ANRL_events.5.t: "会间小憩"
CPC_ANRL_events.5.d: "关于军事同盟筹建的会议刚刚结束，伍修权和罗长青收起刚刚签署的文件阔步走出会堂。\n\n大会堂外是尚在施工的河内革命广场，吊车正将一棵树苗缓缓放下，从大会堂台阶上还能远远眺望到工人们将树苗扶正，拍土。\n\n“老罗你知道我想起啥来吗。”伍修权的脚步放慢了些，“看这些树苗我一下子想起归有光写的《项脊轩志》来。”\n\n“庭有枇杷树，吾妻死之年所手植也……”罗长青下意识地背出这段话，伍修权立刻接上了最后一句，“……今已亭亭如盖矣。”\n\n沉默半晌，伍修权指了指远处河内革命广场刚栽下的树苗：“你说那些东西会不会也能亭亭如盖呢？”\n\n罗长青叹口气：“咱俩可不一定能看见那天。”两人对视一眼，互相笑笑。\n\n“初创亚革盟何尝不像这些树苗呢，咱们是亲手种下亚洲革命树苗的人。”伍修权的脸上似乎已经洋溢着自豪的笑容。"
CPC_ANRL_events.5.o: "“就让咱们的子孙后代去享受绿荫吧！”"
CPC_ANRL_events.6.t: "万里征途……"
CPC_ANRL_events.6.d: "雄壮的国际歌响彻河内，新生亚洲民族革命联盟的所有筹备议程已经全部顺利结束，而今天，就是它正式向全世界宣告成立的庆典之日。\n\n伍修权早已按耐不住自己激动的心情，他甚至能想象到远在万里之外的西安，毛主席他们也一定正在聆听着大会的实时广播，他攥紧了手中的发言文件，仔细倾听着耳机里大会主持人黎笋发言的同声传译。\n\n“……本次大会授权中国共产党中央委员会特命全权代表：伍修权同志，来宣读《亚洲民族革命联盟宣言》。全体起立，高呼：全世界无产者联合起来！”\n\n汉语、越语、柬埔寨语、缅甸语的呼号此刻一齐喷薄而出，在会场内形成热情似火的狂潮——但伍修权什么都听不见了，他只能听见自己的心跳，听见自己的脚步，听见自己的呼吸。\n\n在掌声与口号簇拥中，伍修权昂首阔步走上了发言台。"
CPC_ANRL_events.6.o: "……自今日始。"
CPC_ANRL_events.7.t: "《亚洲民族革命联盟宣言》"
CPC_ANRL_events.7.d: "自东南亚各国革命运动广泛兴起以来，亚洲局势已经产生重大的变化，广大受日本帝国主义压迫，受剥削的民族正在奋起反抗侵略者的残酷统治。面对这样的形势，缔约各国认为需要建立一个由所有亚洲革命国家组成的反帝联盟，才能推翻共荣圈这个建立在亚洲各族人民头上的囚笼。以此宗旨为核心，各缔约国派遣全权代表，经过协商一致，正式达成如下协议，成立亚洲民族革命联盟。\n\n一、缔约国以通过革命斗争来推翻日本共荣圈的殖民统治，解放亚洲各国人民为首要目标。凡与日本帝国主义勾结者皆属缔约国共同之敌，同时对于维持中立的国家缔约国愿意在尊重各国主权独立，不干涉内政与平等共处的原则基础上进行正常交流。\n二、缔约国应本着加强革命国家之间团结互助的精神，就涉及其共同利益的所有重要国际问题进行磋商。\n三、当亚洲发生了任何一国或国家集团对缔约国的武装进攻，所有缔约国应实行单独或集体的自卫反击权力，以一切它可以采用的合理形式（包括派遣武装）对受攻击国进行全力支援。\n四、缔约国应成立联合指挥中心，统一协调各国在有关军事活动中的配合协作，各派代表进入联合指挥中心担任职责。\n五、缔约国应成立常设政治协商机构，负责联盟的日常工作，审议，批准并落实来自各国的提案。缔约国各派代表进入政治协商机构担任职责。\n六、缔约国之间应互相尊重领土完整，主权独立，互不干涉内政，在经济领域与军事领域上互相帮助，团结一致，并且积极援助各国的反帝力量，为实现亚洲民族的完全解放而战。\n\n缔约国代表签字：中国：伍修权；越南：武元甲；缅甸：德钦丹东；柬埔寨：乔森潘[GET_MLY_Chin_Peng][GET_CPI_ANRL_event]"
CPC_ANRL_events.7.o: "起来，不愿做奴隶的人们！"
