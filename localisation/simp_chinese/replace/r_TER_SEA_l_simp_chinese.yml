CRC_Pol_pot: "波尔布特"
CRC_Pol_pot_desc: "波尔布特，原名沙洛特绍，出生于柬埔寨磅同省一个小乡绅的家中。作为第八个孩子，父亲和兄长们希望把他培养成一个出类拔萃的知识分子，以便进入政府求职。在二哥经商资助下，沙洛特绍出色地完成了中学教育，争取到法国留学名额，这让他的家人喜不自胜。但是，走入法国的沙洛特绍丢下家人的期盼，毅然决然选择了自己的人生。\n\n与其他留学的同乡比，沙洛特绍的成绩不甚理想。由于出身农村，使他与发达的西方世界格格不入。沉沦在被白人歧视的边缘化生活里，政治很快便占据了沙洛特绍的私人时间。追随法国学生的反德游行然后被军警殴打是必由之路，而日、泰瓜分柬埔寨的新闻让沙洛特绍恨上了送他来留学的政府。\n\n日本和泰国气焰滔天的权势在柬埔寨汇合，泰国希望吞并柬埔寨，日本需要其保持中立。两国明争暗斗，势同水火，酿成柬埔寨的战后十年苦旅。由泰国扶持，旨在推翻柬埔寨当局的“自由高棉运动”成为沙洛特绍归国后的栖身之处。为了销毁旧身份加入游击队，沙洛特绍自此易名波尔布特。\n\n收拢失意人群，扩充麾下武装，三年游击让波尔布特变成一名老练的游击队领导人。在看清“自由高棉运动”是仰泰国鼻息而存的走狗后，波尔布特感到极度愤怒与失望，以至于亲自开枪杀死了泰国派来的监视者。在汩汩淌血的尸体前，死亡亦当畏惧波尔布特。他发誓为柬埔寨完全独立终身战斗，率领追随自己的游击队员钻进柬埔寨北部的深林，向日本和泰国这两尊庞然大物宣战。"
CRC_Sat_Tee_Touy: "手握安卡"
CRC_Khieu_Samphan: "乔森潘"
CRC_Khieu_Samphan_desc: "乔森潘1931年出生于柴桢省，父亲是一名地方法官。乔森潘是个极具天赋的孩子，二十岁那年取得了前往日本留学的奖学金。主修经济专业，回国便有公务员当，前途可谓一片光明。但天有不测风云，地狱就在脚下。乔森潘用毕业论文证明柬埔寨在对日贸易中受到不公正待遇，其中愤愤不平的议论导致日本导师将他举报。可怜的大学生成了泛亚友谊的牺牲品，不仅学位泡汤，乔森潘本人也被柬埔寨警方百般羞辱，只为博得日方满意。\n\n见孩子难以走出自己的路，家乡的父亲给寓居金边的乔森潘寄来法学书籍，希望他勤加学习，有朝一日子承父业。但乔森潘已然不想给政府打工，他一边在名不见经传的中学里教历史和日语，一边自修法律帮穷人打官司赚点零花钱。在反对当局的报纸上经常出现乔森潘撰写的文章，惹来便衣暴徒时常光顾他的出租屋。这导致课堂上的学生总要诧异，老师的脸上不是挂彩就是青一块紫一块。\n\n枯黄的报纸上记载着乔森潘的反日倾向，一个神秘组织试着招募乔森潘。小知识分子的软弱令乔森潘举棋不定，他不会出卖组织，他也不想放弃这尚且能一步一捱的日子。但很快，命运帮他做了选择。反政府暴动发生后，乔森潘作为敏感人物被列入暗杀名单。面对死亡威胁，乔森潘丢下金边的小窝，失魂落魄逃进深山，投进了游击队的怀抱。从蝇营狗苟的书生变成游击战士，乔森潘通体遍染自由光，人生苦痛亦随之化解。"
CRC_avengers_from_the_past: "昨日之仇"
CRC_avengers_from_the_past_desc: "从共和国到“联合卫国抵抗军”，这些傻子幻想出高棉帝国雄伟的身影，然后一个个醉死在侵略者的甜言蜜语中，什么都没有做。\n\n上个世纪，为了赶走越南人，柬埔寨请来了法国人。\n四十年代，为了赶走法国人，柬埔寨请来了日本人。\n五十年代，为了赶走日本人，柬埔寨请来了泰国人。\n我不明白，这般逃不出脱不掉的奴隶宿命还要回环反复几多时。游击队还要摘下多少颗项上人头，才有资格赢取一个内无饥馁，外无屈辱的祖国？\n\n我倦了，休息一下就好。"
CRC_secret_garden: "秘境"
CRC_secret_garden_desc: "为了隐藏组织，保护领袖，击退反动军队的围剿，一套严格的保密准则和代号被应用于日常工作。\n\n根据地拥有一个秘密代号“安卡（意为组织）”，游击队员和干部则被称为“黑衣”（军服颜色）。领袖始终居于一个不为人所知的地点，靠五名贴身联络员发出命令，层层下发给各级组织忠实执行。对于命令的源头，严禁质疑、追溯、外传等无纪律行为。\n\n与领袖合作的越南红党对这种近似独裁的做法颇有微词，一直敦促领袖在游击队领导权上做出一些让步，我们不关心他们的指责。这种不正规但行之有效的方法，使敌人难以探听虚实，保持我军的战斗力，有助于广泛开展游击战争。"
CRC_avengers_from_the_future: "如鲠在喉"
CRC_avengers_from_the_future_desc: "取得全国胜利后，波尔布特迫不及待开始大规模整肃，许多非高棉人死于非命，包括马德望省的泰人、湄公河下游的京族、金边城里的日本人和华人……疯狂的举动招致疯狂的报复，泰军入侵如期而至，波尔布特也因“路线错误”被越南红党赶下了台。\n\n我在中国同志面前据理力争，才使柬埔寨堪堪免于被越南傀儡的厄运。周恩来保证，当国际局势稳定后越军就撤回国内。对柬埔寨游击队乱捕乱杀的行为，则下达了严厉警告。为了维护阶级感情，不允许我们仇视越南兄弟党，还指定缅共作了执行监督人。\n\n流血事件随时都在发生，派去阻止暴行的士兵往往会加入暴行。难道真的要再发动一次清洗，将忠于柬埔寨的老战士送上刑场，只为完成中国人下达的任务么？我沉入深黑的困惑之海，或许残忍和孤僻才是高棉民族想要的正确答案。"
CRC_secret_garden_get_fucked: "秘境遭劫"
CRC_secret_garden_get_fucked_desc: "马德望、暹粒等省份是游击队的发祥之地，坐落着许多发展成熟的老根据地。但是泰国军队在此地制造无人区，撤退前还埋了上万颗地雷，罪行罄竹难书。另一方面，越共以“思想工作”为借口，开始有计划渗透柬埔寨政府和军队，每个部长和军官背后都必须配有一名越南人……统筹全局。\n\n“祖国彻底独立”已经近乎成为一个伪命题。国家被外人由内而外窥测得一干二净，还有难以疗愈的战争破坏，使内政和国防统统患上了衰弱症，令党内难掩沮丧。在饥饿渐渐吞噬人民的时刻，毫不避讳地讲，我们接手的政权比共和国时期还烂。"
