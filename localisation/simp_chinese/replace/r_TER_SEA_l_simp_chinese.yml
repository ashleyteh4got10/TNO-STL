SEA_Yang_Wenming: "杨文明"
VIN_final_party_long: "紧急军事内阁"
VIN_final_party: "紧急军事内阁"

SEA_news.1.t: "[Get_newspaper_header]日本海军省发表安全声明"
SEA_news.1.desc: "为应对印支半岛出现的未知形势，日本政府由海军主导成立南洋防卫司令部，一支驱逐舰队从北婆罗洲纳闽港出发驶入南海海域。\n\n《声明》称南洋诸国的安全局势仍在掌控之中。《声明》还照会越南首相吴廷琰，督促其尽快消灭北方的共产武装叛乱，同时告知日本国民在近期内不要前往越南。"
SEA_news.1.a: "我特别喜欢这个词，“掌控之中”"
SEA_news.2.t: "[Get_newspaper_header]越南佛教大难"
SEA_news.2.desc: "越南首相吴廷琰签署《基督国教令》宣布天主教成为越南主流宗教，并发动了一场清洗佛教的运动，这项国策给本土佛教徒的信仰带来巨大危机。\n\n在西贡，军警依照命令封闭多所寺院，并且粗暴驱散了正在举行盂兰盆会的僧人和信众，随之引发大量抗议示威与斗殴事件。"
SEA_news.2.a: "南辕北辙的典范。"
SEA_news.3.t: "[Get_newspaper_header]越盟宣布夺取河内"
SEA_news.3.desc: "西贡的政治动乱给越盟提供了绝佳的进攻机会，在不到一周时间里，越盟占领了越南北部的重要城市——河内。\n\n吴廷琰桀骜不驯的执政方针以及反共形势恶化令日本政府大为光火，日本特使于河内被攻占当夜抵达顺化，与越南高层展开紧急会谈。"
SEA_news.3.a: "老主人坐不住了。"
SEA_news.4.t: "[Get_newspaper_header]越南战争局势扩大"
SEA_news.4.desc: "据可靠消息，越盟军队已抵近越南首府顺化。日本启动特别军事行动，就输送军事人员与越南达成协议，数万日本士兵会被送上越南战场。\n\n另据悉，云南省主席卢汉已经响应日本主人的召唤，正式向越盟宣战。"
SEA_news.4.a: "（翻走）看看别的新闻。"
SEA_news.5.t: "[Get_newspaper_header]越南首相吴廷琰遇害"
SEA_news.5.desc: "越南首相吴廷琰被日本特种部队拘捕，一番严刑拷打后遭到枪决，新政府在日本特使授意下暂时由杨文明领军事委员会集体管摄。\n\n吴廷琰显然是个自大、鹰视狼顾的政客，从逼迫保大皇帝退居深宫到树立基督国教都印证他独揽大权的希图，这当然也妨碍到日本对越南政府的控制。当然，没有妥善处理共产武装叛乱，让日本陷入战争泥坑不能脱身是吴廷琰最大的死因。"
SEA_news.5.a: "气急败坏地弄死一条癞皮狗。"
SEA_news.6.t: "[Get_newspaper_header]云南省主席卢汉遭遇越共袭击"
SEA_news.6.desc: "自前线返回后方指挥所的过程中，一伙游击队突然出现袭击了卢汉的车队。经过一番激烈的战斗，护卫队击退了偷袭者，卢汉本人身受重伤，但日本军事发言人未透露任何受伤详情。\n\n中国部队已缓慢撤离中越边境，昆明方面单方面宣布不再参与越南战争事宜。"
SEA_news.6.a: "要不，养好伤继续？"
SEA_news.7.t: "[Get_newspaper_header]吴廷琰接任越南首相"
SEA_news.7.desc: "一番经典而隐秘的竞争后，年过六旬的吴廷琰终于从一众越南政要中脱颖而出。这位出身越南中部广平省的首相在宣誓就职时将自己反对共产主义，维护越南民族地位的政治目标广而告之。\n\n吴廷琰和其胞弟吴廷瑈提倡“东方人为主义”，这种根植于天主教哲学的古怪思想呼吁社会革命。他们人数虽寡，但势力强大，越来越多的人担忧天主教徒会完全接管越南，最极端的担忧认为，这可能将令在越南本土扎根已数百年的佛教蒙受大灾。\n\n日本方面已确认吴廷琰当选首相的消息，没有发出反对声音。"
SEA_news.7.a: "该结束的都结束了。"
SEA_news.8.t: "[Get_newspaper_header]泰柬战争"
SEA_news.8.desc: "东南亚局势的颠覆性变化，尤其是共产武装频频胜利使得泰国政府大为光火，今天的新闻发布会上军方发言人公开宣称“日本对印支半岛等盟友的安全保障只是一句空谈”。\n\n在日本永田町未做任何回应的情况下，泰国公然退出共荣圈，并动员军队亲自剿灭半岛上的“赤匪”。"
SEA_news.8.a: "凡事都该自己上。"
SEA_news.9.t: "[Get_newspaper_header]东革盟加入泰柬战争"
SEA_news.9.desc: "面对泰国的攻势，赤色暹粒军队没有形成有效抵抗，防线一溃千里。金边沦陷后，赤暹最高领导人波尔布特逃入柬埔寨北方深山，赤暹政府内部派出特使与越南领导人黎笋展开密谈，谈判达成了什么样的协议我们不得而知。越南和缅甸的军队已经在边境动员起来，对泰国展开军事行动。"
SEA_news.9.a: "拉人下场。"
SEA_news.10.t: "[Get_newspaper_header]东革盟击退泰国入侵"
SEA_news.10.desc: "在历时数十天的入侵战争中，泰国没有取得任何战略进展，柬埔寨治安战和四面受敌的全面战争均告失败。战争破坏了泰国脆弱的经济，通胀债务居高不下，国内反战情绪激烈，游行群众要求停止战争，改善人民生活。\n\n诸多压力下，泰国已派出谈判代表与越南、缅甸、柬埔寨三国就停火协议达成共识，泰国军队完全撤出柬埔寨，并承诺向三国赔付一定数量的战争赔款。\n\n耐人寻味的是，代表柬埔寨政府出席会议的最高领导人不是波尔布特，而是乔森潘。据外界人士推测，这可能与战争期间柬埔寨与越南达成的单边协议有关。"
SEA_news.10.a: "恭喜赢家。"
SEA_news.11.t: "[Get_newspaper_header]东南亚革命联盟成立"
SEA_news.11.desc: "河内新生革命政权日前宣布，在经数轮讨论和协商后，与缅甸、柬埔寨等国共同成立了名为“东南亚革命联盟”的国际组织。位于中国西北地区的共产主义政权对此强烈支持，并祝贺“东南亚人民获得解放”。\n\n有消息称，日本帝国海军正尝试在国会通过加强南中国海巡防的提议，但日本外务省发言人旋即在新闻发布会上表示，对于东南亚的局势变化日本政府无可奉告。这种不置可否的态度，引发了日本政府内部和日本社会各界人士激烈的争吵。"
SEA_news.11.a: "哑巴吃黄连。"
SEA_news.12.t: "[Get_newspaper_header]柬埔寨进入内战状态"
SEA_news.12.desc: "在一片混乱的东南亚时局中，来自柬埔寨的零星消息正向世人一点一点地勾勒出这场血腥厮杀的全貌：蛰伏已久的柬埔寨共产党在披汶颂堪（马德望省）举兵南下，兵锋直指金边；而一支自称“联合卫国抵抗军”的柬埔寨王室复辟武装也在桔井宣布起义；柬埔寨陆军最高指挥官朗诺将军立即宣布柬埔寨全国进入紧急状态，即日起金边等重大城市实施宵禁及灯火管制措施。\n\n就结果而言，当前的柬埔寨毫无疑问已经陷入了三方内战的泥潭，日本外务省对柬埔寨时局表达严重关切，呼吁内战各方保持克制，保护在柬日侨的合法利益，并再三强调日本帝国陆海军将有可能“在局势无可挽回前彻底肃清东南亚乱局”。"
SEA_news.12.a: "净吹牛！他们忙着在广东赚钱呢！"
SEA_news.13.t: "[Get_newspaper_header]越南军警开始行动"
SEA_news.13.desc: "越南传来消息，遵从顺化方面的指示，军警力量开始在越南各地展开清乡运动，并在北部地区执行宵禁，吴廷琰政府称，此举是“为肃清共产流毒，加强越南广大农民的安全防共意识”。\n\n但进一步的消息指出，在行动开始的一周内，越南政府已经逮捕了至少两千名“农村共产党嫌犯”，据信其中多为佛寺僧人，外界分析认为，吴廷琰政府此举似乎是更大政治运动的前兆——但其矛头似乎另有所指。"
SEA_news.13.a: "一鱼两吃。"
