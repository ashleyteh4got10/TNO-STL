TER_SEA_Huanan_Bureau.1.t: "备忘录-关于建立华南局的提议（节录）"
TER_SEA_Huanan_Bureau.1.d: "党中央、毛主席：\n\n日本使用原子弹轰炸珍珠港迫使美国退出战争，使中国的抗战形势继续向消极方向发展，我们建立在各处的党组织和民主政权面临着日伪以及重庆方面严重的威胁。各级党员干部、军事指战员要做好充分的思想准备，应对未来可能发生的变故。\n……\n我们集体向中央建议，在避免无谓牺牲的前提下，保留中共中央在各地建立的党组织，并设立地方分局统一管理，以顺应对敌长期斗争的趋势。\n……\n广东及周边各省将陷入长期黑暗孤立的局面，但也不要过高估计反动力量，轻视自己的努力，以致于对未来前景丧失信心。我们需要华南局各级干部坚持斗争，保存干部和武装力量，做长久打算——要立下埋头苦干十年八年的决心，把现有力量分散出去，变成钉子牢牢扎在敌人的后方。\n\n刘少奇、朱德、周恩来、任弼时、董必武"
TER_SEA_Huanan_Bureau.1.o: "1945年7月X日"
TER_SEA_Huanan_Bureau.2.t: "备忘录-一九四六年的任务"
TER_SEA_Huanan_Bureau.2.d: "党中央、毛主席并刘朱周、中委、军委：\n\n华南局没有完成统战夏威的任务，因此根据中央指示转变目标，了解并巩固华南地区的反日基础，准备开展持久斗争。在两广群众运动发展的阶段上，我们总策略方针是尽可能的造成全民族的反帝统一战线，来聚合和联合一切可能的，虽然是不可靠的动摇力量，与共同的敌人——日本帝国主义及其走狗斗争。\n\n夏威虽然明确拒绝了中央带去的共同抗日提议，但他并没有驱逐我党在广西的组织，且在群众运动的问题上，大多数情况都会“网开一面”。这是夏威所希望的合作方式，我们必能牢牢抓住这次机会，壮大统一战线的队伍。\n\n东江纵队和江左纵队已与华南局建立长期联系。在重庆国民党政府对日媾和的前景下，南方抗日游击队面临着被日伪军全面围剿的严峻形势。因此，当下任务是在最短的时间内，整合我方能够掌握的武装力量，及时转移到安全地带，跳出敌人的包围圈。\n\n华南局\n\n书记叶剑英、韦国清、卢绍武、肖向荣"
TER_SEA_Huanan_Bureau.2.o: "1945年12月X日"
TER_SEA_Huanan_Bureau.3.t: "备忘录-联络越盟"
TER_SEA_Huanan_Bureau.3.d: "党中央并中委、军委：\n\n越南独立同盟会，是由越南籍共产党员胡志明、武元甲等人建立的抗日革命组织。1943年，胡志明曾秘密潜入中国，希望与蒋介石政府取得联系，但遭到国民党当局逮捕，蒋介石死后被释放归国。\n\n昨日，汕头城工部及闽粤韩江纵队向华南局报告，胡志明同志将再次尝试与中国抗日政权建立联系，希望能够得到中国政府经济、军事上的资助。我们回应，务必请胡志明同志到访由我党领导的抗日民主政权，并安排韦国清、卢绍武同志进行前期接洽，防止国民党投降派及日伪的破坏行动。\n\n我们准备将越南革命纳入华南局抗日斗争的范畴，倾力协助越南独立同盟会在广西-越南边境开辟根据地，牵制印支半岛方向的日军。这样，广西、广东地区的抗日力量在较长的时间里得到发展，并与越南在地区局势上形成南北呼应。与胡志明领导下的越南抗日武装建立关系有利之处较多，现盼军委对我们的意见给予指示。\n\n汕头党委书记李碧山转华南局"
TER_SEA_Huanan_Bureau.3.o: "1946年8月X日"
TER_SEA_Huanan_Bureau.4.t: "备忘录-琼崖纵队失联"
TER_SEA_Huanan_Bureau.4.d: "中央军委：\n\n在海南党委完成潜伏任务后，中央将与琼崖纵队失去联系，此后联络事务均由华南局单方面处理。\n\n另，日本强迫南京在海南取消国民党党部，转而建立“特区”（暂时交由中国人管理）。华南局认为，这是日本殖民中国的试探行动，也是我党打入海南统治层的机会，盼望中央给予指示。\n\n华南局\n\n书记叶剑英、肖向荣"
TER_SEA_Huanan_Bureau.4.o: "1947年1月X日"
TER_SEA_Huanan_Bureau.5.t: "备忘录-日伪分裂广东阴谋及我应对策略"
TER_SEA_Huanan_Bureau.5.d: "党中央、刘少奇副主席：\n\n南京政府已与日本签订《广东议定书》，割让广东省所有主权，按照日本的要求建立伪政权，日本对中国实行全面殖民野心昭然若揭。\n\n华南局全体同志认为，保存实力仍然是我们当下最紧要的任务，不应该贸然发动武装起义，过分暴露脆弱的党组织。我们要用更加细致入微的政治工作，以经济斗争作为主要手段，打入广东社会的方方面面，发展群众，争取在五年之内完成扎根基层的任务。\n\n华南局\n\n书记叶剑英、肖向荣"
TER_SEA_Huanan_Bureau.5.o: "1950年10月X日"
TER_SEA_Huanan_Bureau.6.t: "备忘录-关于协助建立越北根据地的决议"
TER_SEA_Huanan_Bureau.6.d: "华南局叶剑英并转援越军事顾问团：\n\n1948年华南局会议决议通过向越盟提供军事支援抗击日帝、法帝后，我代表团与华南局各负责同志打通防城-谅山陆路，联络越共中央同志，为越盟游击战士提供必要物资并指导训练，并策划在高平地区秘密开拓革命根据地。\n\n经过一年的发展，华南地区各地党组织正在慢慢恢复，海南支部财政物资丰馈；日帝经济陷入战后衰退，越南亲日政府控制力迅速衰败；内外有利因素极大增强了越盟同志的抗日信心与能力，以高平地区为根据地，我代表团协助越盟进行了广泛深入的人民战争、游击战争，尤其是策划了夏秋边境战役并取得了谅山大捷，越盟首次取得对日帝军事胜利，有效震慑了越南亲日政府。\n\n目前，越盟同志已经深入谅山、奠边府等地区，采取策划农民起义，伏击日帝军队、袭扰越南军队等手段，逐步进逼河内，越南帝国政府已濒临崩溃，我代表团仍将继续同越盟同志一道，坚持以游击战争，人民战争的方式，促成抗日大业。\n\n团长韦国清、参谋长卢绍武"
TER_SEA_Huanan_Bureau.6.o: "196X年6月X日"
TER_SEA_Huanan_Bureau.7.t: "备忘录-广东伪政权发展现状"
TER_SEA_Huanan_Bureau.7.d: "发送者：华南局叶肖马\n\n收件者：中共中央\n\n自1950年《广东议定书》签署后，日帝将我广东地区从汪伪民国政府强硬分离，建立伪“广东国”，此为日帝在我国建立之第二个人造殖民国家，以下为伪广东国简要情报。\n\n一、政治上，伪广为日帝殖民资本主义之实验政体，其元首称“行政长官”，由日帝指定派驻，现由铃木贞一担任；其立法与行政机构为广东立法会，常设100个议员席位，负责颁布及修订国内法律条例，立法会实为日帝垄断企业之鹰犬，唯企业马首是瞻，日帝垄断企业详情见本文第二点。\n\n二、经济上，伪广全部经济命脉由四家日帝垄断企业把持，分别为安田（代表董事：松泽卓二）、索尼（总裁：盛田昭夫）、松下（总裁：松下正治）、富士通（总裁：井深大），除安田主营金融及银行业务外，其余三家企业均主要着力于电器制造和电子科技研究。\n\n三、军事上，由于伪广之军事防务需求由日帝承担，因此仅留有少量广东本地警察及日本宪兵部队用于基本治安，另已查明，日帝“凰”机械化师团作为日帝陆军派驻力量，现驻扎于广州，并听从伪广指挥。\n\n四、外交上，由于《广东议定书》堪称历代不平等条约之最，伪民国对伪广态度冷漠。现任伪民国驻广总领事为宋之光，原为我党党员，新四军一师政治部敌工部干事，自1946年后与党组织失联。现任日帝驻广总领事为高岛益郎，军事代表为永野茂门。\n\n五、其他方面，自1956年始，伪广人口普查行动中新增一民族称“珠人”，详细分析后我们得出结论如下，日帝妄图通过分化我中产阶级华胞民族身份制造所谓“华人珠人矛盾”，并以此制造汉奸，用意险恶歹毒，今后需多加留意该群体动向。"
TER_SEA_Huanan_Bureau.7.o: "1961年6月X日"
TER_SEA_Huanan_Bureau.8.t: "备忘录-录音文档一份"
TER_SEA_Huanan_Bureau.8.d: "地点：马万祺私宅\n谈话人：李嘉诚，何鸿燊，马万祺\n（在一番寒暄后主宾落座，开始谈话）\n马万祺（以下简称马）：我还是要说些老生常谈的话，现在这个时代，不要总细分什么出身，只要生在这片地上就是广东人，而长实就是咱们广东的公司。年轻人啊，我喜欢你的事业，也喜欢你的干劲。\n李嘉诚（以下简称李）：当初被富士通到处围剿的时候，没有何兄处处庇护，我李嘉诚走不到今天。这些旧情还没报答，现在万叔的话更让我受宠若惊，我一定要先敬您一杯。\n何鸿燊（以下简称何）：万叔是贤伯的交契，日占时期就是澳门翘楚，自然十分清楚个中辛苦，他经常教我遇到同仁困难帮一把应该的，毕竟不能让日本人把生意全抢走。\n（三人举杯共饮）\n马：说得好。阿燊，你能回到澳门全靠贤伯四处疏通，你可不能辜负他对你的厚望。你给嘉诚讲讲当时澳门商界都提过什么条件，不用多，三条就够。\n何：第一，何鸿燊到澳门，人人能取他的性命；第二，澳门酒店不准接待香港赌客；第三，香港赌客不准乘港船来澳门参赌……\n李：这摆明不想让何兄来澳门经营啊。\n马：所以你也就知道，我和贤伯为了保你们这些人花了多大力气吧。\n何：万叔，我再敬您一杯。\n（三人再次举杯）\n马：说回正事，嘉诚的日本朋友已经进了广州的立法会，你们两个有什么打算么？\n何：（抢在李嘉诚前说话）万叔，我们目前还没有打算……因为万叔不是说过立法会是日本人的地方，咱们广东人不能……那不是，当汉奸嘛……\n马：（夹了一口菜）万叔我曾经一腔热血，但是这十年我想清楚了，日本人一定是常驻下来，怎么也斗不过了。咱们澳门想要发展，上面就必须得有自己人。与其让真汉奸把持着位置，不如咱们这些人去争取。澳门的叔伯给了你们赚钱的机会，你们不能忘了我们，随时要想着我们。我身体不好你也是知道的阿燊，现在就需要你们这些人上进一点，把生意做到立法会里去，也让我们长辈能安度晚年。\n李：昭夫——我的日本朋友，正要拉着我一起进立法会，只是我的资产还不足。如果万叔不嫌弃，我愿意帮万叔完成进立法会的愿望。\n马：好，我就知道嘉诚敢想敢干。有你这句话，以后把澳门商会当你的家。生意上有什么困难，尽管和我提，只要不是杀人放火的勾当，万叔我不会吐一个“不”字。\n李：全仗万叔扶持。\n（三人举杯）\n何：（借故离开饭桌的低语）万叔不是最讨厌日本人么，怎么态度转向这么突然……（下略）\n（谈话内容由索尼生产录音机记录，录音带音色清晰，能够清楚辨认出李何二人的声音，可以存档备用）\n签字：叶剑英、马万祺\n抄送：华南局各常委，并归档华南局秘书处机要室"
TER_SEA_Huanan_Bureau.8.o: "录音时间：1960.X.XX晚19:00-21:00"
TER_SEA_Huanan_Bureau.9.t: "备忘录-关于恢复宋之光党籍的请示"
TER_SEA_Huanan_Bureau.9.d: "毛主席并刘朱周：\n\n在中央关于同意尝试与宋之光重新接触的指示电接收后，我们从华南局内挑出了一位在新四军一师政治部与宋交情深厚的熟人作为线人，派他在宋之光经常出没的华人社区潜伏。在宋于街道上露面后，他上前故意装作近身相撞，暴露自己的真容，同时以他们二人才懂的暗号示意宋跟着他。宋当即便会意，跟身边的人以会晤“老朋友”的说辞独自一人跟上脚步,在一处偏僻树林里，二人才坦诚布公的相认，宋很激动的抱住对方不放，表示他们二人已经多少年没见过面了，没想到还有活着重逢的一天。在确定宋并无恶意之后，我们详细询问了他这些年的具体经历，概况如下：\n\n宋说47年新四军从敌后撤退时他们所在的那股小队遭到伪军埋伏打击队伍彻底被打散，他也因此负伤昏厥假死，被敌人误以为阵亡。在醒来后队伍已经完全离开，他也就此失去了和党组织军队的联系。回城后他也试图重新联络组织，但是当时白区内地下党系统已经被完全破坏，汪伪政权也在积极镇压内部抵抗力量，他多方寻觅始终无果，为了能够摆脱困境，他改换身份考入了南京的外交学院，混入汪伪的外交部，在成为外交官后第一站就是前往西俄试图寻找可能有的党组织，可惜当时在俄国内部混乱的局势下西俄并没有我党的人员活动，他依然无功而返。关于他与南京当局的关系，宋表示南京当局似乎对于他的真实身份亦有所察觉，但是始终未表，现在还将他派遣到了广东，看来可能是希望由他来充当搅乱广东局势的工具。如今，终于和组织重新接触，他愿意服从组织安排，即刻便能归队。\n\n以我们根据相关人员的意见以及长期的观察看，宋之光过去与现在都是一个忠诚的共产党员，即便身处敌营仍然努力寻找党组织，在平日生活上积极接触帮助穷苦华人，可见他并非卖国求荣的叛徒之类，我们建议重新恢复他与党组织的关系，保持秘密联系，请中央尽快批示。\n\n签名：叶剑英、肖向荣\n[Get_CPC_Huanan_write_back]"
Get_CPC_Huanan_write_back_1: "\n\n\n\n£GFX_write_back\n\n\n\n"
Get_CPC_Huanan_write_back_2: "（回复：同意你们的意见，允许恢复宋之光党员身份，宋应继续留守领事岗位，党组织关系上隶属于华南局编制，由叶本人单独负责对其指导，具体行动等候中央指示。）"
