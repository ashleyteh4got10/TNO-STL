#新闻
CPC_ANRL_events.8.t: "[Get_newspaper_header]东亚剧变"
CPC_ANRL_events.8.d: "日本撤出越南这件事好像还发生在昨天，今日亚洲局势便天翻地覆。东南亚各国共产党在越南河内签署联合《宣言》，共同组建新的国际组织“亚洲民族革命联盟”。该组织宣称要挑战盘踞在太平洋西岸的日本帝国，解放被压迫剥削的亚洲人民。\n\n由于形势骤变，老挝政府宣布退出共荣圈，保持中立，这难以拯救的局面令日本政府大为光火。\n\n中国政府对东南亚发生的变故表示强烈关切，南京方面已向日本发出外交照会，请求临时召开中日会谈，商讨有关加强治安的议题。"
CPC_ANRL_events.8.o: "有些东西正在解体，但我说不准。"

CPC_ANRL_events.9.t: "[Get_newspaper_header]东亚对峙局面升级"
CPC_ANRL_events.9.d: "“赤祸”是中国境内报刊上的热门词汇，连同报刊一起焦虑的还有中国政府。\n\n中日会谈进展飞速，[JAP.GetLeader]表示中国政府应当尽早担负起维护亚洲和平繁荣的重任，加强其在国内的治安力量，阻止共产主义继续荼毒亚洲人民。\n\n为了整合国内武装力量对抗“赤祸”，南京当局发出召回省务的命令，分布于各地的军阀离开自己统治数十年的省份前往南京，在《防共协定》上签下了自己的名字。《协定》要求地方军队均需在中央登记，并将指挥部迁移到首都南京。\n\n面对不容忽视的威胁，永田町将对华财政做出如下调整：允许中国无限延期偿还日本国债，并免除利息，同时开放日企军械租售。如此优惠的条件，彰显出其扼杀共产主义的决心。"
CPC_ANRL_events.9.o: " 日本人不能亲自出手吗？难道他们……"