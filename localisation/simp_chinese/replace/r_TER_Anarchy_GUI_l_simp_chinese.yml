l_simp_chinese:
 TNO_Anarchy_CPC_hell_tt: "§f大西北§!"
 TNO_Anarchy_CPC_hell_tt_delayed: "中国的历史很久远，久到三十年的时间也只像大河里一颗孤零零的水珠；哪怕蕴含着流血漂橹、赤染渭水的苦厄，与其他水珠相比依然是那样的平凡，它的滋味绝不超过一杯刚刚晾好的白开水。\n\n遗忘的救主很快便会降临到人间，那些令人可歌可泣的豪言壮语，那些令卿牵肠挂肚的音容笑貌，流沙会用最快的速度将其掩埋，直到世界毁灭。你不用惋惜自己未曾知晓这些反抗者的姓名，人间的很多事情本来就不必知晓，饭照样吃，觉照样睡，太阳照常升起，尚存一息的人们早已明白反抗是一件愚蠢透顶的事。\n\n雪铺在伤痕累累的西北大地上，盖住寸草不生的真实而后沉沉死去。旋风突至，卷起玉树，升腾在无边的旷野上，弥漫在这窒息的人间。\n\n§m“是的，那是孤独的雪，是死掉的雨，是雨的精魂。”§!"

 ZXB: ""
 ZXB_DEF: "中国西北的无政府地区"
 ZXB_ADJ: "无政府地区"
 CPC_eternal_damage_1: "天降业火"
 CPC_eternal_damage_1_desc: "没人为这场灾难负责，大西北已然寿终正寝，听不见后来人的痛哭与哀悼。\n\n核爆摧毁了城市，辐射杀死了土地和生命。即使是脑中有些贵恙的人也不至于大言不惭地宣称这里适宜生存，需要开发。这片土地的结局已经由踏上西北、身穿防护服的日本专家发表在学术期刊上，供研究人员探讨。\n\n血泪之上是累累白骨，一层又一层堆满深壑池头，他们都是灾难的见证者。等到几十年几百年后，也许造物主会重新把生命放置于这片土地，直到那时，尘封旧案方能重启。"
 CPC_eternal_damage_2: "无药可治"
 CPC_eternal_damage_2_desc: "没人为这场灾难负责，大西北已然寿终正寝，听不见后来人的痛哭与哀悼。\n\n在古代，火葬一直被视作噩兆，除非大疫降临，死者无数，才会草草挖坑焚烧，但焚尸赤焰昼夜不息确是有史以来不曾有过。是时候讨论为何中国人没能从鼠疫与霍乱中自救了，也许是现代医学技艺不精的缘故，但这对已死之人来说毫无意义。\n\n血泪之上是累累白骨，一层又一层堆满深壑池头，他们都是灾难的见证者。等到几十年几百年后，也许造物主会重新把生命放置于这片土地，直到那时，尘封旧案方能重启。" 

CPC_eternal_damage_3: "焦土之国"
CPC_eternal_damage_3_desc: "战争给中华大地带来了触目惊心的创伤，或许再过百年也无法抚平。\n\n废墟的灰黑与焦土的黑黄变成了这片曾被赋予“中央之国”美名的土地的主色调——几乎可以确定的是，若再不采取断然措施，这片土地不日便将面临饥荒与死亡的灾厄。\n\n这片土地上的人们仍在尽力挣扎着活下去，也许终有一天，他们能从布满绝望的现状中撕出一条活路——但不是现在。"
CPC_eternal_damage_4: "毒污之墟"
CPC_eternal_damage_4_desc: "战争给中华大地带来了触目惊心的创伤，或许再过百年也无法抚平。\n\n曾经肥沃富饶的天府之国，如今寸草不生；曾经生机勃勃的西南雨林，如今叶落木枯；曾经人声鼎沸的市井街坊，如今尸横遍野……\n\n这片土地上的人们仍在尽力挣扎着活下去，也许终有一天，他们能从布满绝望的现状中撕出一条活路——但不是现在。"