l_simp_chinese:
CPC_Wang_Hongwen_THE_CHAMPION: "王洪文"
POLITICS_WANG_HONGWEN_DESC: "-我不知道你怎么做到的！但是他来延安了！\n\n-那么，代价是什么呢？\n\n-整个大西北无法承受这种过于激烈的现实修改行为而直接变成废土了，我们完蛋啦！\n\n-现实修改？见鬼，我看你是想恶心我。\n\n-行吧，你如果觉得被冒犯了我道歉。\n\n-先不管这些，他为什么在这里？\n\n-废土效果测试占位符，为即将到来的解放战争版本做准备，如果你对代码熟悉一些说不定还能调出真正的解放战争超事件，当然，随着内容的完善，大概下个大版本你就见不到他了\n\n-那为啥非得是他？\n\n-第一是个人兴趣，第二是做废土效果的时候手头恰好有他头像就拿来占位了，好了祝你下个存档游玩愉快，再见！"
TER_SAVE_THIS_FUCKING_WORLD.1.t: "小王如闪电般归来"
TER_SAVE_THIS_FUCKING_WORLD.1.d: "小王如闪电般归来"
TER_SAVE_THIS_FUCKING_WORLD.1.o: "小王如闪电般归来"
TER_SAVE_THIS_FUCKING_WORLD_NEWS.1.t: "[Get_newspaper_header]冠军莅临"
TER_SAVE_THIS_FUCKING_WORLD_NEWS.1.d: "古城西安的轻微异动是一切的开端。外界收到了零星的情报，尽管之前仅在自己的空间内活动。异常先进的二十八代半深空空间折叠战斗机已经开始探访古老的，快被遗忘的中国，并对任何外国反动势力发动攻击。现在，他们的目的和使命已经昭然若揭了。我们现在知道这个共产主义中国已经整装待发，他们恢复了调查信标的数据链，并重新启用了那些在他们退缩到目前边境之时废弃的侦察哨站。情报显示，他们的意图是重新回到全世界的棋盘上。航天空母编队正在集结，军队已经下达了征召令，神秘出现的工厂再一次发出轰鸣声。共产主义中国开始将他们的目光投注到边境线外的世界——\n\n现在，整个地球都在关注同一个问题：当这位一度沉睡的巨人决定恢复旧日荣光时，谁会成为第一个螳臂当车的宵小呢？"
TER_SAVE_THIS_FUCKING_WORLD_NEWS.1.o: "无关心"
