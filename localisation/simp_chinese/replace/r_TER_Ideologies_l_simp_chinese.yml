communist_mao_zedong_thought_TER_subtype_desc: "毛泽东思想脱胎于列宁主义，在深受布尔什维主义浸润的同时具有相对独立性——这种独立性来源于对部分教条化苏联马克思主义的否定。这就是说，毛泽东和其他共产主义思想家的最终理想是一致的，主要区别于手段。\n\n长期国内革命战争的试炼中，毛泽东发现中国与马克思所定义的理想革命发生地相距甚远，他不得不为“无产阶级”这一概念做扩张解释，把革命目光移向最广大的群体：农民（其中包括完全依附地主阶级的佃农、雇农和拥有少量土地的自耕农）。完成“土地革命”是此时中国革命的主要目标，在这之后先锋队还要跟进某些手段（当时尚未有定论）促成社会主义诞生。\n\n以中国战败为分界点，持续十五年的地方割据划开了毛泽东思想的两个阶段。面对新困境，毛泽东沿袭了布尔什维主义中“区域扩散”的观点——在割据政权内形成社会主义高潮，并随着外部形势变化扩张至全国。生产关系变动上升为主要目标，社会主义改造总计划、工业跃进和农业合作化作为“三面红旗”注入毛泽东思想，成为纲领性条文。\n\n虽然在执行过程中出现偏差并造成信任危机，毛泽东思想和创立者本人仍被视为中国共产党人宝贵的财富。部分人还相信毛的思想具有普适性，能够影响千千万万个与中国人民境遇相同的落后国家人民，并帮助他们实现解放。"
communist_liu_shaoqi_thought_subtype_desc: "从起源来看，刘少奇思想是毛泽东思想的延续，它是由不断适应中国本土的马克思主义原则所支撑，最终成为时代发展的产物。与毛泽东专注于破坏旧秩序不同的是，刘少奇更倾向探索共产党管理国家的方式。四十年代的整风运动中毛泽东所表现出的道德中心主义倾向被刘少奇继承，并以理论著作呈现，使保守的农民愿意接受共产党的统治。同样，党的权威在刘少奇这里也是不容置疑的，但这不是刘少奇思想的全部。\n\n刘少奇思想的根本逻辑是，人处在不同环境就会有不同的意识，比起强迫他人接受新观念，用实在的历史经验启发民众自省更具备传播优势。这种乡土式共产主义不会被排斥为“异类”，反而会内化成一个民族与生俱来的烙印，更有利于共产党领导无产阶级进行革命斗争。\n\n在国际上，刘少奇思想通常会影响已经建立政权（无论地上还是地下）的共产党，促进共产主义思想与当地民众融合。"
progressivism_rural_construction_subtype_desc: "中国是一个农民的国度，因此有识之士就不能抛下农民去空谈国政。\n\n二十世纪二三十年代，国家政治秩序动荡，军阀战乱频繁，匪患遍地，广大农村不断成为内战的战场和土匪侵扰的对象；水旱灾害频发，受灾面积广阔，受灾人口众多；自由市场的商品倾销进一步加剧小农破产。这种全方位的经济灾变，是历代农民不曾遭遇，也引发了惨绝人寰的悲剧。与经济落后相伴而生的，是文化愚昧和政治失温。这些都是建立现代国家的巨坑，需要人为填补。\n\n乡村建设运动对农村问题的关注由点到面，基本上包含政治改革、文化教育、科技改良和推广、卫生保健、组织合作社、移风易俗、自卫保安等内容，当时常概括为“政、教、富、卫”四个方面，即众多的乡建流派最终汇合成有相同内涵的乡建运动。"
communist_tibet_secret_socialism_subtype_desc: "在接纳中国共产党输入藏地的理论学说时，班禅·确吉坚赞为保证藏传佛教生存延续，开始寻求佛学与马克思主义的调和形式，并著书立说向西安交付一份满意的答卷——\n\n佛曰：众生平等，普欲度脱一切众生。如果采用通俗的人本观点重新诠释这句话，即释迦摩尼佛是赞同人人平等，人人都拥有自由解放的权利；而人想要获得解脱，弃绝烦恼，就必须斩断俗世色相，金钱财货自然也包括在内，故而佛家倡导‘施无厌’这种生活资料共享的经济制度；佛家讲求功业因果，意指人的不同活动所产生不同的影响，以此揭示人的社会关系。综上所述，佛教思想符合社会主义原则，是为无产阶级服务的学说。\n\n中共党内理论家坚称，所谓“佛教社会主义”只是宗教势力应对社会主义改造的缓兵之计，处处透露着不彻底性，并针锋相对提出“经济革命”的要求。刘少奇认为，这种思想能够消除藏区人民对西北国防阵线政府的猜疑和畏惧，有利于统战工作和社会稳定。"
liberalism_He_Shang_liberalism_subtype_desc: "胡适说，争你们个人的自由，便是为国家争自由；争你们自己的人格，便是为国家争人格。现在他死了，连他的承诺也一起破产了。训政终结却带来专制，一记响亮的耳光打在中国人的脸上：泛亚民主完全是一场骗局。在主流的缝隙间，一种逆反思潮传遍中国北方的大学课堂——\n\n归咎于地理环境，中国是一个极难引发变革的国度。中国是以大河、大陆为根基的内向式“黄色文明”，得天独厚的农业条件使中国人先天缺乏与外界交流的主观愿望，修建长城固步自封便是证明。因此中国就变得越来越保守、愚昧、崇拜过去、甘于落后，最终被日本这种先发学习欧美文明的国家击败。\n\n对中国而言，日本倡导的泛亚理论恰恰是阻止中国自强自救的镣铐。如何解决这个问题呢？黄河已殇，不可复收。中国必须抛弃东亚民族的概念，向以海洋为根基的“蓝色文明”学习，学习美国的民主制度，建立自由的经济，由此才能激活中国昏睡不起的亿万人民，重新屹立于世界之林。\n\n也许没人在意河殇所倡议的“自由”“民主”为何物，尤其是在政治话题讳莫如深，人人缄默不语的社会里。但是河殇理论一直在劝导人们不要盲从，要敢于表达自己的诉求，凿开矛盾的豁口，那么一切改变都会水到渠成。"
communist_pan_huism_subtype_desc: "为了与盛世才的六大政策相抗衡，流落新疆的中国共产党员协助马仲英设计了伊斯兰交融马克思主义的意识形态。由于错综复杂的民族矛盾，这位回族军阀的统治思想被新疆非回民族和盛世才诬称为“东干主义”或“泛回主义”。\n\n泛回主义继承了马克思和列宁的阶级斗争理论，承认废除生产资料私有制的必然性，反对资本主义和帝国主义的压迫。不同之处在于，思想创立者马仲英更珍视伊斯兰教的地位，安拉复兴即是新世界。\n\n尽管共产党员会被强制放弃宗教信仰，泛回主义者却不必放弃伊斯兰信仰。踏入革命的教门，他们慎终追远，自先知圣训中摘取更加严厉简朴的教义和行为规范，杜绝华而不实的仪轨和奢靡淫逸的教风。当其他穆斯林指责此等异端篡改经典，妨害自己的贵族生活时，泛回主义者会回答：一个清真的穆斯林不须像异教徒那样掌控任何财产并设法役使他人。\n\n泛回主义者从不自称泛回主义，它的形成是多方妥协的结果，这些妥协会随着革命发展逐渐解体，最终迎来真正的共产主义。"

#这两个介绍大概就是我想说的了，祝大家生活愉快
communist_peoples_democracy_subtype_desc: "人民民主到底代表着什么？所有想探讨这一问题的人可能都不得不重新钻进故纸堆去调查研究一番——一般人会认为人民民主是人民阵线理论的延伸，是反法西斯统一战线发展到冷战时期的新理论；而马克思列宁主义者可能会搬出第三国际七大上共产党人寻求同社会党人扩大统一战线的努力尝试，强调其反法西斯的积极性和阶级妥协的局限性；左翼共产主义者则坚定认为实行社会主义民主是社会主义的本质要求，民主与社会主义社会的本质具有根本的一致性和不可分割的联系。\n\n对人民民主制度的争论一定程度上反映了它本身所处的位置：先锋队主义者会批判其阶级立场充满妥协，尽管共产党主持政府的构建与运作，这一制度却并未贯彻共产主义者的阶级斗争立场；自由意志主义者则会冷眼旁观，担忧无产阶级自身的政治权利也被先锋队政党“代表”，徒留名存实亡的民主空壳。于是，“人民民主”的轮廓也在这样的争论中逐渐明晰起来：一个由无产阶级先锋队政党主导的，团结全社会大部分“进步反法西斯阶级”的过渡民主制度。它可能向前发展，最终走向无产阶级民主、共产主义的理想社会；可能就此停滞，走入阶级协作的修正主义道路；也可能彻底倒退：包办替代，逐步蚕食，最后剥夺普罗大众的政治参与。\n\n人民民主制度未来究竟会走向何方？或许只有人民的意志可以在历史给出的宏大命题前作出回答。"
communist_workerism_subtype_desc: "工人主义，学术上称为马克思自治主义，该术语所能概括的思想体系尽管年轻，但却庞大而深邃——20世纪60年代初意大利的街头巷尾就频频现出工人主义者的身影，而1963年安田危机所带来的亚洲经济危机中，不堪重压的广东工人自治团体则自发地形成了这一理念。\n\n工人主义的早期核心由一小撮马克思主义知识分子构成，这些人对列宁时代以来共产主义者当中流行的马克思主义阐释进行了批判性修正。工人主义的核心思想是，传统共产主义思想中所谓“工人阶级的阶级斗争是对资本主义发展的回应”这一观点实际上在开历史倒车：根据工人主义者的说法，资本主义发展是对被剥削工人斗争的回应。\n\n因此，工人阶级实际上是资本主义发展的“被动引擎”，进一步讲，一切革命策略都必须由工人自发产生，并由工人自己来推动，同时要严防§R资产阶级协作主义工会§!的腐蚀干扰，还要排除剥削性质的§R所谓先锋队政党§!。实际上，工人主义者认为工人阶级应该拒绝与所谓的§R“进步”或“有同情心”的资产阶级§!联合——工人阶级必须自力更生，靠自己的力量夺取政权。要完成这一目标，就必须依靠暴力革命与严密的基层组织。目前，工人主义颇具活力，并以其对共产主义的全新阐述吸引了一大批政治热情尚未熄灭的年青学生和工人。\n\n工人主义者们相信，旧时代的共产主义理论已不再能拯救新秩序铁靴下流血哀嚎的全世界——他们将打碎一切旧组织，从头开始组织真正的工人阶级战斗队伍。"

#经济体制
Econ_Subtype_Revolutionary_Transitional_System: "革命过渡制经济"
Econ_Subtype_Revolutionary_Transitional_System_desc: "革命初胜之时，由于发展水平差异，造成多种经济成分并存。因此需要革命政府充分指导，将统治区域内所有落后的经济基础推进至“黎明前夕”——即完成社会所有制变革。指导手段中不乏资本主义在散发余温，也蕴含新的生长因子，归总起来便被称为革命过渡制经济。\n\n马克思主义者认为，这项经济制度是临时的，不稳定的。它可能向前发展出先进的生产关系，也可能后退回革命之前的状态。"