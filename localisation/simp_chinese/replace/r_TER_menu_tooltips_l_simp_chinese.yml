l_simp_chinese:
 TER_version_intro_tt: "§L关山月§!\n\n§L《关山月》§!为汉代横吹鼓乐。曲调自北地胡人马上所得，至§O西北边关§!§x汉军§!营中广为传唱。常伴以大鼓、金铙、筚篥、笛、箫，曲风雄浑苍凉，多§R久戍不归之属，伤怨别离之遇§!。魏晋以来其词不存，南朝梁代续有填词，至盛唐李白所作§L《关山月》§!横空出世，始为滥觞——\n\n对应TNO版本：§Q乌鸦§!与§h公牛§! - Ver.1.8.x"
 TER_version_intro_tt_delayed: "§F明月出天山，苍茫云海间。\n长风几万里，吹度玉门关。\n汉下白登道，胡窥青海湾。\n由来征战地，不见有人还。\n戍客望边邑， 思归多苦颜。\n高楼当此夜， 叹息未应闲。"
