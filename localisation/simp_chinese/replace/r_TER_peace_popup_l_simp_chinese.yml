l_simp_chinese:
TNO_PEACE_POPUP_WAR_CONSLUSION_TRCW_WIN: "在§V伟大的亚洲人民解放战争§!中，§Y[CPC.GetNameWithFlag]§!击败了§Y[losing_country.GetNameWithFlag]§!伪政权，§x解放之梦§!更近一步。"
TNO_PEACE_POPUP_WAR_CONSLUSION_TRCW_LOSE_BY_NUKE: "石油危机肆虐，但§j日本帝国主义§!獠牙毕现，§e剧毒与辐射§!摧毁了§f大西北§!，§x解放之梦§!彻底破碎。"
TNO_PEACE_POPUP_WAR_CONSLUSION_TRCW_LOSE_BY_RGOC: "§V东亚乱局§!以§Y[CHI.GetFlag][CHI.GetName]§!戡平内乱而告终，§S中华民族§!的§x解放事业§!自此走入§m异路歧途§!。"
TNO_PEACE_POPUP_WAR_CONSLUSION_TRCW_WE_FUCK_JAP: "§V伟大的亚洲人民解放战争§!以§Y[CPC.GetFlag][CPC.GetName]§!胜利而告终，§r日本帝国主义§!被迫缩回本岛，§x解放之梦§!终得实现。"
TNO_PEACE_POPUP_WAR_CONSLUSION_TRCW_WE_GET_FUCKED: "§V东亚乱局§!以§Y[JAP.GetFlag][JAP.GetName]§!胜利而告终，§x中国§!四分五裂，曝尸于东亚大地上，§x解放之梦§!遥遥无期。"
TNO_PEACE_POPUP_FLAVOR_MEN: "天长雁影稀，月落山容瘦。"
TNO_PEACE_POPUP_FLAVOR_MEN_TRCW: "聒碎乡心梦不成，故园无此声。"
TNO_PEACE_POPUP_FLAVOR_MON: "自是荒服者不至。"
TNO_PEACE_POPUP_FLAVOR_QIN: "雪上空留马行处。"
TNO_PEACE_POPUP_FLAVOR_XIN: "神龟虽寿，犹有竟时。"
TNO_PEACE_POPUP_FLAVOR_ETR: "衣带渐宽终不悔，为伊消得人憔悴。"
TNO_PEACE_POPUP_FLAVOR_SIC: "蚕丛及鱼凫，开国何茫然。"
TNO_PEACE_POPUP_FLAVOR_SHX: "嗟乎！陵与卫律之罪，上通于天！" #山西
TNO_PEACE_POPUP_FLAVOR_LOY: "便断碣残碑，都付与苍烟落照。" #云南
TNO_PEACE_POPUP_FLAVOR_KIS: "上人箸百尺楼上，儋梯将去。" #段希文 - 广西
TNO_PEACE_POPUP_FLAVOR_CHI: "仁义不施而攻守之势异也。" #中国
TNO_PEACE_POPUP_FLAVOR_GNG: "致瞬息万变之物，及亘古不变之物。" #广东
TNO_PEACE_POPUP_FLAVOR_MAN: "今我来思，雨雪霏霏。" #满洲
TNO_PEACE_POPUP_FLAVOR_CPC: "知我者谓我心忧，不知我者谓我何求？"
TNO_PEACE_POPUP_FLAVOR_TRCW_JAP: "我们还要发愿：要人类都受正当的幸福。"