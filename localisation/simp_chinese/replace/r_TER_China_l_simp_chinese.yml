 CHI_state_of_emergency_against_the_Communist_Rebellion: "紧急动员戡乱状态"
 CHI_state_of_emergency_against_the_Communist_Rebellion_tt: "§R时任总统高宗武发布总统令，宣布即日起进入动员戡乱时期，一切以戡平共匪叛乱为重！§!" 
 CHI_state_of_emergency_against_the_Communist_Rebellion_desc: "战事一触即发，西部边境的战士们早已做好应战准备。我们必须倾尽全国之力与赤匪作战。尽管我们也不是毫无准备，但防线在猛烈的攻势下已经显得摇摇欲坠，成千上万的民众慌不择路的逃难，人民蜂拥向沿海地区逃去只为了远离血腥的战场。此诚危急存亡之时，诸君当需愈加奋力！高总统已经宣布进入动员戡乱时期，我们将运用一切力量消灭共匪！" 
 CHI_national_mobilisation: "全国总动员"
 CHI_national_mobilisation_desc: "为了更有效的对共匪，整个国家都要动员起来。我们要保证军队有足够多的人手来击败西边的共匪；我们要保证后工厂能生产足够多的武器支援前线士兵们；我们要保证一切阻碍胜利的因素都将消除。在把他们解决掉后，我们的政权就不会再有敌人了。" 
 CHI_total_martial_law: "总戒严"
 CHI_total_martial_law_desc: "前方乱，后方不能更乱。高总统已颁布中华民国总戒严令，在全国范围内分区由戒严司令部进行管理。我们要对所有扰乱治安的人重拳出击，彻底安定后方人民。"
 CHI_all_out_attack: "总进军"
 CHI_all_out_attack_desc: "检验我们这几年的成果的时候到了。饱受训练的士兵，经验丰富的军官，高效的指挥部，团结的军阀。高总统只有一个命令“向着沦陷区进军，解救沦陷区人民”，胜利终将属于我们！"
 CHI_Execution_of_communist_spies: "赤色匪谍一个不留"
 CHI_Execution_of_communist_spies_desc: "我们已经将后方安定下来了，但还远远不够。暗地里匪谍在还在谋划革命，我们必须挖出他们。若不采取直接、果断的行动，我们的国家将陷入水深火热之中。"
 CHI_NSA_site_overloaded_operation: "国安局超负荷行动"
 CHI_NSA_site_overloaded_operation_desc: "匪谍在国内四处活动，但不代表我们就不能这样。最后时刻就不用再有所保留了，匪区的所有国安局各地方行动组，已在马不停蹄正式展开行动，我们要最大力度对共匪进行打击。"
 CHI_Communist_atrocities: "红鬼暴行"
 CHI_Communist_atrocities_desc: "共产共妻、吃小孩的红毛鬼，这种流传了三四十年的谣言对民众已无震慑力。只有开展新的宣传攻势，让民众知道共匪在四川、青海掠夺百姓财产“归共所有”的暴行，我们才能真正的震慑住民众，让他们激起愤慨之心，保卫国家。"
 CHI_Southwest_experience: "西南经验"
 CHI_Southwest_experience_desc: "西南一直是动乱之地，不管是横跨了五六十年代的大剿匪，还是几年前的广西叛乱，正因如此我们也积攒下了丰富的作战经验。现在要做的，就是将西南经验传至全军，让他们成为抵抗共匪的专家。"
 CHI_Solidarity_for_victory: "精诚团结争胜利"
 CHI_Solidarity_for_victory_desc: "现在已经到了战争的关键时刻，每个人都要有一份力便尽一份力。将特务编入军队，总统院长去前线，全国必须精诚团结，只有如此才能争取胜利"
 CHI_share_the_same_hatred_Promoting_national_unity: "同仇敌忾促统一"
 CHI_share_the_same_hatred_Promoting_national_unity_desc: "目前中国所做的一切虽是为了反抗日本，但大难临头两国的利益目前是一致的，我们只有一个敌人，就是中国共产党。开展广泛的中日合作，共同抵御共产党，日本的各项援助将随之而来。"
 CHI_without_slacking: "不准懈怠"
 CHI_without_slacking_desc: "到现在，不管是前方还是后方，均有人流露出了懈怠的姿态，只要我们顶住，一切还很有办法，共匪不是无法战胜的。"
 CHI_Defend_the_Three_Principles_of_the_People_at_all_costs: "不惜一切代价捍卫三民主义"
 CHI_Defend_the_Three_Principles_of_the_People_at_all_costs_desc: "如果再不迅速扭转局面，那广大革命先烈用鲜血捍卫的三民主义共和国的前途和命运，就面临着严重的威胁！"  
 CHI_Defend_the_Three_Principles_of_the_People_at_all_costs_tt: "§R战胜强权，复兴中华，协和万邦，威振迩遐！§!"