JAP_showa_emperor_ter: "昭和天皇"
JAP_showa_emperor_ter_desc: "昭和天皇，御名裕仁，他被塑造成皇祚延绵、武运昌隆的象征，国家稳定、社会发展的保证。但他自即位起便对政治漠不关心，或许是认为帝国的累累罪行早已无望纠正了。\n\n在东亚大陆的溃退与战败使得内阁轰然倒塌，共荣圈体系摇摇欲坠，曾建立在战争胜利基础上的胜利果实也被往日的魂灵撕得粉碎。为了帝国的稳定，裕仁天皇从失败的翼赞会手中接过了他一生都在逃避的权力与使命，以天皇的名义再度将濒临破碎的帝国团结起来——然而，他能如愿吗？\n\n§R赤祸如洪水侵没亚洲，朕何以保神州不灭，谢皇祖皇宗之神灵哉？§!"
CHI_small_army_TER_1: "恢复军备"
CHI_small_army_TER_1_desc: "中共威胁日笃，在他们悍然出兵侵占成都重庆之后，我们的日本宗主终于意识到了这一威胁，现在，我们被部分允许着手整顿内部防务——得益于日本的倾囊相授，我军的战力正在逐渐恢复。"
CHI_small_army_TER_2: "放虎出笼"
CHI_small_army_TER_2_desc: "得益于越发严峻的亚洲赤色危机以及中共的威胁，日本终于允许国军重新武装化了，尽管军队整编仍然受到日本人的严格监控，但我们依然在国防自主上迈出了一大步。"
CHI_small_army_TER_tt: "现在，§m中华民国陆军§!可训练、组建新部队。"
JAP_CountryInfo_Content_desc.4: "尽管由中国，英国及其帝国以及美国所组成的所谓§Q“联合国家”§!在亚洲发起了英勇的抗争，但还是无法与神国列岛的战争机器相抗衡。虽然美国海军与中英联合军取得了一系列意义重大的逆转胜利，将日本帝国陆军拖入了血腥的拉锯战之中，但也只不过是垂死挣扎罢了。§Q蒋介石§!的离奇死亡让重庆政权再无抵抗意志，最终俯首向帝国称臣；§C毛泽东§!率领§C共产党§!领导着残余抵抗政权在西北苟延残喘。\n\n美利坚是最后一个向轴心国屈膝投降的国家。虽然双方的海军在大洋上你来我往互有胜负，但美国本土依旧逐步滑入孤立之中。然而，这还不能算是至恶之时。在一个晴朗的早上，一枚奇异的炸弹落到了珍珠港和夏威夷的上空，在全人类的脸上刻下了一道触目惊心的伤痕，§V永世不褪§!。"
GNG_Product_Cycle_Market.76.desc: "在开始的时候，一切都还是很完美的。\n\n南京、北平和上海已经完成了互联化与计算机化。整个过程就像在日本一样简单快捷。在宁波和福州的工作遇到了些许困难，但在安装了数种改进装备后，上海港的货物日装载量几乎在数月内提升了一倍，遇到的困难想必很快就能解决。\n\n但在太原和桂林，这简直就是一场灾难。那些乡巴佬军阀显然无法理解什么叫做“与中央政府合作”，以及这项工作能够如何帮助他们收上更多的税。而且就算他们愿意合作，如何记账又成了一个问题：许多农村地区依旧在使用清代留存下来的纸质存档系统——但同时有些地区却已经用上了来自日本的新方法。在云南，甚至连谁是话事人都成了问题：在这山高皇帝远的大西南，一件事在这个人这儿是这回事，在那个人那儿又成了另一回事，而人们还没搞明白这件事到底是谁的哪件事的时候，线缆与电脑就已经不翼而飞了。\n\n井深大闭上双眼，再一次将问题简化为数字，限制与极致。在中国内陆花费太多可能会满盘皆输——但也可能会有不少收获。在这巨大的花销之后，富士通将会成为政府运作过程中的重要环节，从此让富士通在珠三角的牌桌上有了一手好牌。而人们可以把这当做一项投资，一项能够在未来带来回报的投资，一项能够……"
guangdong_commonRiots.203.desc: "“总领事，你应该最明白我现在的处境了！我在管理一个自废武功的国家，好几座混乱的城市，还有一个跟我处处作对的立法会——我不是救世主，我不能创造奇迹，但是我真的尽力了，我真是烦透了这一切。”\n\n“你做得不够，远远不够。”[GNG.GetLeader]瘫坐在椅子上，无神的望向窗外血色的夕阳，似是在为这座城市送终。“东京现在焦虑得脑子都快要炸开了，中国形势正在发生剧变，到处都是战争与暴乱，国共两军鏖战正烈，从山西到武汉，从贵州到昆明，战火可能很快就会烧到广东了。东京的那些大人们都恨不得立刻派出军队保护广东。行政长官，这怪不了他们。”高岛吐出一口烟气，继续说：“那你有办法吗？”\n\n“我当然有。”没错，即使事情一直不按预期发展，他也有办法，一有人质疑他到底有没有办法，他就头疼得要死。“高岛——”\n\n“请叫我‘总领事’。”\n\n“得了吧，高岛，你听我说，我们共事这么多年，你应该是最了解我的情况，我在管理国家的时候总是得忙着去救火；你也知道在过去的十年间永野和华人一直对我虎视眈眈，我能维持稳定就不错了，我承认现在事态很难控制，但是求你告诉他们，与其派军队过来平息事件，还不如用原子弹直接把珠三角炸平。”\n\n电话那头沉默许久后，高岛用疲惫的声音说：“我已经告诉东京，你还能稳住局势，务必，务必尽快把局势稳住，不能再晚了。”"
guangdong_sonyOC.14.desc: "“现在谈什么避免裁员也太晚了，我们这里刚裁掉两百号人。”\n\n李骏观察着广东工商联合会执行会议上的那些疲惫的面孔，看着无法忽视的绝望之情将他们牢牢地压在自己的席位上。他们夜以继日地工作，只为让白手起家的珠人们挺过这场风波。但行政长官到哪里去了？松下、富士通和日立向他们施加无情的压力——不管是索尼，还是他的雇主长江实业，貌似都对此束手无策。\n\n李骏想着，失望二字不足以形容他们的感受，他们都觉得当初相信盛田是愚蠢之举。\n\n---\n\n“林警官！”良子用日语喊道，她在酒吧拥挤的人群中挥了挥手，示意林巧川坐到她这一桌，然后便换了粤语。“想喝点什么吗？我听说你已经开始两班倒了。”\n\n“啤酒就挺好的。”林巧川也不跟她客气，嘟囔一声。“每个人的钱包都瘪下去了，没人想让安田那档事再来一次——”\n\n“这难道不就是正在发生的事吗？”良子的指尖因寒冷微微发紫，她将啤酒递给了巧川。“失业的人挤满小巷，抗议者纷纷走上街头。”\n\n“可能会更糟。”林巧川几乎将杯中的啤酒一饮而尽，然后转向良子。“我们看到了一些新的涂鸦，什么追求变革的华人委员会——我们之前都没听说过这样的团体。而且这样的涂鸦越来越多了，人们不止是感到绝望，安川，他们还很愤怒。尤其是在南京政府陷入内乱之后——”"
chi.1.d: "中国可能是人类有史以来可能最漫长而复杂的文明，她曾统御万邦，亦曾寄为人奴。月有阴晴圆缺，中国亦有迭起兴衰，而当下她已忍受过多年的耻辱，也就是后世所谓的百年国耻。但当起义者占领南京，清朝覆灭之时，人们再度燃起希望，渴望着由汉人统治的崭新民国，渴望着没有军阀草菅人命、唯有人人皆享自由的真正、持久的和平时光。\n\n然而，那令二十年代为之激情动荡的自由与专制、善与恶的斗争因日本的全面入侵戛然而止。中国革命的双子星，国民党和共产党，面对日本大军压境选择携手御敌，而后随着美国退出亚洲战场与蒋介石的意外死亡，风雨飘摇的重庆政府落在李宗仁的手上时已无力回天，政权最终分崩离析，只剩下中共领导着残余的统一战线继续顽抗在西北的大地上。\n\n旧时代的残党或是落幕或是退却，但历史的车轮依然在继续转动。曾忠于国民党的汪精卫投奔日本，希望打败蒋介石和他的党羽。但当他开始与日本人谈判时，却发现日本人除了把中国变成一个纯粹的殖民地外，别无他想。日本人迅速解散了原政府，改组了一个更乐于“合作”的国民政府。汪精卫自知将中国拖入了又一段屈辱的年代，接受了自己的命运，不久于人世。\n\n大多数中国人对日伪政权也只是忍气吞声，逆来顺受。虽然日本人没有兑现民族自决的承诺，但也没让中国沦入二十年前蒋政府的混乱时代。虽然军阀仍然猖獗于山野，但在多数人的眼中现状还算稳定，甚至还有利可图。叛逃的国民党元老们身居高位，恣意享乐，全然不顾党国之本心……\n\n中国的方方面面都束上了日本的枷锁。日本毫不掩饰他们对中国政府的全面控制；中国军队全然受制于日本陆军，仅能持有二战时期的旧式武器，所能完成的行动也仅限于卫戍和维持治安。日本政府正慢慢解除对中国的苛刻限制，但那贪婪的嘴却从未离开我们人民的血。中国政府打算用来改善民生和工业化的资金全都流进了日本投资者的腰包，留下中国这片非工业化的日本殖民地。而最发达的广东与满洲地区尽管能为中国带来些许利润，但它们也被牢牢控制在日本手中。在中国的银行和经济集团皆由日本规划的情况下，中国的货币也完全和日元挂钩。"
chi.5.d: "重庆的沦陷标志着中华民国的灭亡。之后在日本的掣肘之下，中国军队受到了种种大规模限制。尽管它们暂未解除，日本人似乎正在慢慢撤出在中国的驻军，留下四处的叛乱、抵抗运动——以及来自西北的中共威胁，任我们人怯马弱、装备匮乏的本地军队去应付。\n\n时过境迁，伟大的民国早已不复存在，但如今的中国再也无法忍受这些屈辱的限制了。高宗武认为，是时候组建一支对外宣称为“特警部队”，平日不轻易出现于纸面之上的“秘密军队”来为中国服务了。在高大总统不懈的努力下，这支“特警部队”的规模不断扩大，且直接听命于总统本人。这样一来，他们的勇武智谋终将帮助中华民族的儿女赢得解放。"
chi.6.d: "现代化，这一带领中国走向现代的伟大计划可谓步步惊心。一旦日本人意识到了我们的抱负，特别是要求正统中国政府取得更多的自治权时，他们绝不会放过我们任何的动作，更不用说高宗武的秘密军队了。秘密军队的存在决不能让帝国主义者们知道，我们的努力可不能在此功亏一篑。\n\n值得庆幸的是，我们并不是完全没有机会。冷战的爆发和前几任政府的努力迫使日本人从我们的领土上撤出或削减了近半数军队。但中国大部分政府机构仍为日本官员控制，这些机构早晚有一天会嗅出我们的计划。\n\n为了避免此类情况的发生，高宗武将通过新成立的国家安全局来隐藏我们的中国复兴计划。只有少数官员知道我们的现代中国梦和秘密军队的创建，扼住我们喉咙的手越少越好。"
chi.477.d: "我们和一个小村庄的长者安排了一场会面，他是一位老兵。将要欢迎熟脸孔时，他仍换上了那套破破烂烂的制服。这里是他的家，并且他希望一直这样下去。\n\n南京危机？别给我提这个。高宗武，这日本人的马屁精，任由鬼子予取予求，还献上了更多。不过，他确实把鬼子们弄出去了。日本人来占领之前，你也清楚，我们这儿只是一个宁静的小村庄。老毛和他的干部来过，但他们没有强迫我们做很多事，只要我们不无事生非，共产党可不会突然逮捕我们。但是奇怪啊，我后来真对共产主义产生了兴趣。我认为需要激进的变化，为这时代点上句号。也许在另一个世界，我们的事业能成。而在我们的世界，没有剧变却来了日本入侵。总之，我参军入伍，加入统一战线，尽心尽力对付日本人和通敌的伪军。但现在，看来我们才是通敌卖国的汉奸。（说到这，他苦着脸笑了）原以为不会有太大变化。财阀不可能剥削到每一个山疙瘩里的村子，可是他们还真行。原来我们的镇子静静地耕作，现在却变成煤镇。共荣圈到处有人跑来这里。高宗武是把他们赶走了，但伤疤还在。矿山还是在开采，而我怀疑开采会一直一直持续下去。不过，所有的外国矿工都离开了，我们村子的精神也留了下来。"
 chi.471.t:0 "武汉兵工厂"
 chi.471.d:0 "他是一个中年工人。手掌里深深的渗进了火药的痕迹。这位煅铁匠挥舞着铁锤，打造出的枪械见证了无数的腥风血雨。\n\n我以前在一个兵工厂里干过，报纸上都登过的。那可不是什么简单地方。承租的日本老板搞些中国人当奴工，我不晓得多少，但是我一个好朋友还有另外一个同事工作都拿不到薪水，每天晚上都只能在工厂外面的旧楼睡草席。我那时候还算个正经工人，每晚都能回家和家人团聚。他们就没那么幸运了。\n\n在武汉兵工厂干活的那段时间，有一天我记得特别清楚。好多一起干活的同事——后来我才知道他们是奴工——没有来上班，就来了一个人。他来的时候我瞧到他笑呵呵的，跟明天就能退休一样。然后他走进承租老板的办公室，就轰隆一声爆炸了，肯定是从兵工厂了偷了个手榴弹出来。就走了狗屎运，那日本老板没给炸死。他变本加厉压迫那些奴工，让他们遭了好几年的罪，搞得他们一天比一天不成人样。我那时还憨憨地以为他们在节食。节你妈个雀雀！辣么多人都死在武汉兵工厂了。\n\n你采访肯定会经常听说这种事，不过我还是得说，政府太软弱了。政府最后也没抓了那个日本老板，就光把他赶出中国了。那些死掉人的家里拿到的抚恤金也少的可怜。在武汉兵工厂的深处，那个人的尸体还躺在灰烬里。"
 chi.479.d:0 "他准备回南京闹市区之前，正擦拭着自己的机器脚踏车，而我们就在这时候找到了他。他转过身，和我们问好，额头上带着道深深的伤疤。他要求匿名接受采访。\n\n危机之后一切都变了。可能只是我自身的原因吧，但是最近我们也确实什么事都没好好摆平。这破事开始的时候，我和一群小子和几个老哥组成的政治帮派搭上了关系。政治倒还算挺左的呢。但有个小子因为涂反日涂鸦被吊死了之后我们也就散了。这事干的真不地道。有些时候我感觉他们搞的狗屁政治就是贩毒的遮羞布。但当时我还觉得自己挺像样的。我还曾经差点因为从条子那逃走被枪打到。现在，我回到正轨上了，但有些东西是找不回来了。过去的感觉倒是有一点点，那感觉……\n\n（作者注：我们和他谈话到一半时，他就开始加快脚步离开。他叫我们滚蛋之后我们就让他走了。）"
WORLD.16605.desc: "石油危机持续动摇国际社会，东亚更是已经沦于内战战火。最新的受害者则是坐落于华南地区的一个企业统制之国——广东国。\n\n广东社会长期奉行族群隔离政策，在全球陷入混乱的当下，作为大规模经济动荡带来的恶果，长期积累的民怨终于以反日反企业暴力抗争的形式爆发，据传工人暴动团体已经接管雷州半岛地区，其余地区的暴动更是愈演愈烈。当局已宣布实施戒严令，但各大城市秩序仍已近乎完全崩溃。\n\n广东行政长官已就此事发表公报，表达了维持秩序的意向。目前尚无法判断他的措施是否能成功，又能有多少成效。"
speerphase3.13.desc: "日本国情报告\n外交部\n\n日本帝国已经开始分崩离析。自60年代以来一系列的革命风暴，共荣圈已经显露颓势。在第三次中日战争爆发后，一个前所未见的中国正以全新的姿态逐渐崛起，并使日本遭遇前所未有的挑战。我们分析认为，新生的红色中国将成为日本的亚洲秩序最有力的敌手，这也意味着共荣圈的内部与外部稳定已经开始坍塌。\n\n建议与自由国家组织建立更稳固的外交与贸易关系——尤其是美国。相比日本，美国国内的政治环境更加稳定，其经济体量庞大且仍在增长，我国可以利用这一点来扩大自身利益，亦可获得大量剩余原材料与加工产品。除此以外，中国也是一个拥有大量未开发人口、工业潜力可观，具备广泛经济前景的国家。然而，红色中国秉持的意识形态与我国曾经面对的“布尔什维主义”有众多相似之处，当前阶段不建议同中国建立外交关系。关于日中关系的报告详见第一页至第十五页。本页结束。"
speerphase3.13.a: "看来泛亚主义的败亡近在眼前了。"
jap_oil.2.d: "“大将，第38军发来一份报告。广西边境又发生了一次袭击，是越共动的手。103师团司令部表示这次袭击明显是亚革盟在东南亚发起的试探性进攻，请求总部增援。”\n\n将军挥了挥手，让这份报告回到那一大摞东南方面陆军司令部收到的紧急军情之中。\n\n中国内战爆发，广东方面通讯失联，现在印度尼西亚也有逃离日本手掌心的危险。日本陆军面临着成堆的问题要去对付。仅剩的石油储备得节省着用，从全亚洲调配部队增援也绝非易事。最后，在将军的副官如坐针毡好长一段时间后，将军终于下达了命令。\n\n“先把婆罗洲的石油储备转移到防城港，然后执行空军轰炸。不够的石油就先从海军那边调过来。必要的时候把卡车和民用汽车油箱里的油抽出来。轰炸必须在两个小时内开始。另外，把独立混成第21旅团调来广西以弥补当地驻军的损失。虽然第21旅团前不久刚刚重组，但我相信皇军战士的精神。婆罗洲的储备一到，就着手把该死的共产党击溃，把那群越共赶回林子去。”\n\n“但我们前线的部队怎么办，他们会不会被误伤？”副官不安地提问。\n\n“他们必须习惯这种状况。从现在开始，一切战乱都必须被以这种严酷的方式镇压。”"
jap_oil.2.a: "他们会适应尸体燃烧的味道。"

