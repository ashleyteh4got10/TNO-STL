STATE_2413: "汉中"
state_lore_initials.385: "HNZ"
state_lore_name.385: "汉中"
state_lore_desc.385: "汉中位于陕西省南部，地处秦蜀之间，北隔巍峨耸立的秦岭，南界延绵不绝的巴山，横贯其中的汉水冲积形成了大面积的谷地平坝，自古以来素有“天汉”之称，是一片古老富饶的沃土。\n\n远在战国时期，楚国便以“汉中”为名在此设置郡县。秦末楚汉争霸，刘邦率军攻克咸阳，秦王子婴亲自开门投降，项羽因畏惧刘邦将其封地由关中排挤至汉中，本欲与项羽决裂的刘邦接受萧何等人意见，韬光养晦，专心经营汉中，“明修栈道，暗度陈仓”，最终出奇兵，定三秦，仅用五年就使昔日不可一世的楚霸王于乌江自刎，统一全国。\n\n抗战后，汉中由于形势的变化再一次成为后方重镇，国民政府宣布设置汉中行营，以巩固西北国防，拱卫陪都重庆。大量军事机构的迁入导致人口激增，工业与城市规模在国防建设的背景下开始加快扩张。\n\n中国共产党接管陕西省后，在原有的城市基础上，继续巩固汉中的战略地位。西安通过汉宝铁路，将源源不断的物资运输向西康，使刘文辉部队与解放军西南兵团能够长期立足于险峻的横断山脉之间。\n\n如今，随着大局势变化，汉中已然成为西北国防阵线最后的一道抗战屏障，在可以预期的未来中，将作为中国解放事业的第二中心在历史上重新焕发她的耀眼光芒。"

state_lore_name.376: "万州"
state_lore_desc.376: "当日本陆军逼近蒋介石国民党最后的堡垒重庆之时，万州在北方挡住了侵略者冲向民国陪都的步伐。血腥的万州保卫战打了整整七天七夜，几乎所有能动弹的男男女女都加入了国军部队，与强大的敌人战斗，阻拦他们向重庆发动进攻。前前后后数万人因此丧生，万州城血流漂橹，然而守军等来的却是一纸投降电令——这是背叛。\n\n在那场战役中幸存下来的人们从未忘记这背叛。万州人民憎恨向日本主子摇尾乞怜的通敌汉奸，但更憎恨让他们白白流血牺牲的混蛋：蒋介石国民党及其残余势力。对他们来说，中国必须解放，但这解放绝不属于青天白日。" 
state_lore_name.382: "西宁"
state_lore_desc.382: "两千年来，西宁始终是河西走廊边的商贸中心、抵御外来入侵者的强固堡垒，对昔日的游牧部落如此，于今日的叛军而言亦然。宗喀巴圣地塔尔寺、东关清真大寺等诸多地标坐落于此，因而对附近的许多非汉族民众来说，西宁同样拥有非凡的意义。\n\n自1928年青海正式从甘肃版图中析出，西宁便以其独特的地理位置，奠定了作为青海省会的基石，同时也成为了青马军阀势力的重要据点。至1949年，随着西部抗日统一战线的形成，西宁成为西北国防阵线上一颗自治的璀璨明珠。虽不似兰州与西安那般繁华喧嚣，人流如织，西宁却以它独有的宁静与坚韧，吸引着寻求安全与自由的心灵。"
state_lore_name.412: "湛江"
state_lore_desc.412: "湛江从前名唤广州湾，原先只是一座平静的小村庄，直到法国注意到此地控扼雷州半岛的战略潜力，才出手将其租借为自由港，取名叫做“贝亚德堡”，是法国唯一的在华殖民地。抗战期间，广州湾是少数几个受列强保护的安全港埠之一，因此有大量难民涌入其中，带来了短暂的繁荣。但法国政府向日本投降后，难民潮也随之迅速消退。\n\n根据《广东协定》，湛江与海南岛治权归属于南京政府。然而，这是一块南京鞭长莫及的飞地，湛江很快就化作了叛乱与异见的温床，最终在1950年的危机中彻底陷入混乱，西南军阀便趁机假借“绥靖”之名，出兵驱逐了南京在当地派出的官员。此后，湛江便一直处于军阀的控制之下。\n\n作为西南唯一的主要港口，湛江因其繁荣而得到了急需的资源与投资倾斜。毋庸置疑，湛江是西南自治的重要支柱，它的地位只会越来越高，即使某些外部势力对此并不乐见。"
state_lore_name.413: "海口"
state_lore_desc.413: "海口的历史可以追溯到宋朝，长久以来都是中国最南方省份的门户，扼守通向中国南海的大门。由于其战略地位，海南在近代史上吸引了各大帝国主义列强的目光，但幸运的是，列强之间的内讧使得海南未曾沦入殖民统治——直到日本帝国吞并此处，当地才陷入空前的最黑暗、最血腥的时代。\n\n华南风暴与《广东协定》签署后，鉴于中国内部的险峻形势，日本帝国海军不得不无奈地将海南岛移交予民国政府。如今，广东全省已经基本落入日本和地方军阀之手，海南则是南京控制下最后的地盘。南京方面允许海南以“特别行政区”的名义自治，希望以此争取广东民众。\n\n现在的海口是海南特区首府，民国最繁忙的中转港口之一。然而，在海口繁荣的背后，是沉默的大众，他们从未忘记帝国主义留下的伤痕，以及不仅对暴政视而不见，甚至还要背叛祖国的通敌者。"
state_lore_name.380: "武威"
state_lore_desc.380: "千年古城武威，其历史可谓波澜壮阔。忆往昔，城市尚名凉州之时，乃是抵御匈奴的关隘要地，亦是丝绸之路的关键节点。时过境迁，西汉的奔马、西夏的王陵，无不诉说着这座藏于盛唐荣光之下的城市往日的辉煌。\n\n西北解放后，东接兰州、南靠西宁、北临银川和内蒙、西通新疆的武威成为西北的重要交通枢纽。随着陕西省移民的大量涌入，城市正渐渐回归丝绸之路时期的繁华。"
WORLD_CAM.8.d: "作为彻底镇压东亚大陆共产主义叛乱的余音，日本对印支半岛下达了他们的最终解决方案：其已发动针对越柬缅三国共产主义政权的反击，以“将民众解放出共产主义的压迫”。作为旧日“亚革盟”的残余，三国已发表联合声明，谴责日本的帝国主义行径，誓言决不会在争取自由的斗争中屈膝投降。\n\n然而，无论印支三国是否愿意投降，似乎都难逃被超级大国压倒性实力所击败的命运。而且，这次他们已经无路可退，再次转入地下游击或许可行，但日本势必对印支半岛采取更高压态势以镇压共产主义。眼下来看，印支半岛人民自由的日子已经屈指可数了。"
state_lore_desc.386: "迪化，“十三国之地”，起初是丝绸之路咽喉要道上的一处聚落交汇地带。千百年的时间里，中国历代王朝都在努力巩固这一地区，慢慢地，在现代迪化城的位置上形成了一些小群落，负责当地的行政管理。至于迪化城本身，则是于1755年准噶尔灭族之后，紧邻另一座新城、围绕军营建设扩展而来。\n\n随着汉、回、满居民人口的迅速增长，两座城池在十九世纪不断扩建，吸引了众多商人的目光，人们对它的兴趣也与日俱增，将其称作东部中国文化传入突厥斯坦的光辉典范。此后，迪化逐渐在当地城市中显得鹤立鸡群起来，于1884年被定为新疆省会。民国崩塌后，迪化成为地方军阀治下的首府，经历了一系列的政治动荡，在维吾尔人的大规模暴动之中挣扎。\n\n如今，盛世才的统治已经处在四面包围。迪化正站在十字路口上，又一次在它的起源和心田之间徘徊。"