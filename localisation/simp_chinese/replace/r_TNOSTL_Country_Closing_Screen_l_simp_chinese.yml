 TNO_CountryClosing_epilogue_CPC_end_RGOC: "革命并未得胜，§m国民革命军§!将§C平等、民主、自由§!的§x解放之梦§!扼杀在潼关以西，中华民族的未来§m道阻且长§!。\n\n§x自由中国最后抵抗者§!的故事至此告一段落，但§S中华民族§!的故事或许还会继续下去，台北峰会蓄势待发，全世界都在等待：高歌凯旋的§m中华民国§!将以何种姿态面对高居其上四十载的§j日本帝国§!。\n\n时值[GetYear]年，光阴六十载，§x中国解放之梦§!终究走入了§m异路歧途§!。\n--------------------\n感谢您的游玩！至此，您已经游玩了§x新秩序：雄关漫道§!中§x新秩序：东方红§!§Y Ver.1.1：关山月§!的完整内容，并令§x中国解放之梦§!走向了§m另一个方向§!。模组里大量的工与TER作成果当然要感谢我们的团队，但假如没有您的游玩，一切都是一场空。您可以在东方红的创意工坊界面找到并加入我们的Discord社区讨论！"
 TNO_CountryClosing_credits_0: "TNO:STL制作组\n§W现成员§!\n\n§G总策划：橘 雪莉、奶茶、Hayase Yuuka\n§G策划：枫丹不知名网友、暠旻、小黄瓜、天藤千禧\n§G美工：阿浩、一只大吉岭酱、星光书记、锅包肉\n§G文案：大元帅、恒、小黄瓜、小邮差、天藤千禧\n§G程序：橘 雪莉、奶茶、天藤千禧、恒、olele114、Entityback、暠旻、Gewalthaufen、GdanskInPolska\n§G测试：用了十五吨煤、卡利斯·塔留斯§!\n§G特别鸣谢：总设计师、sergey taboritsky、秋起、斫青客、前路、梦轻泷、LuckySmartPlayer、concored55\n§x——以及长久以来一直支持着我们的，你。§!\n\n"
 TNO_CountryClosing_credits_1: "后记\n\n--------------------\n\n成员 天藤千禧\n\n各位好，我的名字是天藤千禧，不知道各位玩这个整合包还开心吗？\n\n回想起自己加入雄关漫道的时候，手中只有一个半成品的东方红扩展内容。当时的我本打算将这个应用于新秩序：东方红中，但由于东方红的主策划已另有安排，于是我打算将其作为独立扩展发布，不过却因为迟迟找不到美工而一再搁置。\n\n后来，我听说了新秩序：雄关漫道，于是我又凭借这个半成品加入到其中。经过组内商量后，我花费一个月的时间进行代码的兼容和部分GUI和国家精神的重置，最终完成了这个扩展。这个扩展就是雄关漫道的东北局内容。该扩展已经成为雄关漫道的独立制作内容，并且收到了一定良好的反响，我感到十分荣幸。另外，感谢雄关漫道制作组内的其他成员，尤其是美工成员的大力支持。\n\n"
 TNO_CountryClosing_credits_2: "特别鸣谢\n\nTNO坦克设计扩展及新秩序：东方红适配作者\n新秩序：朔月坠雨制作团队\n新秩序：光自贝加尔湖来制作团队\n秋起图书馆"
