 TNO_CountryClosing_epilogue_CPC_end_people_dem: "十年前，没人会想到被封锁在潼关以西的§x共产党§!竟是浩浩荡荡六十载人民革命的最终主角——但他们坚持了下来，取得了人民革命的最终胜利。\n\n纵使已经迎来太多落幕，但革命终究§G得胜§!，§S人民民主§!——这一不同于苏联的§R社会主义模式§!正在这片满目疮痍的大地上§G生根发芽§!，并以滚滚春雷之势将旧民国空喊六十年之§C“平等民主”§!口号深深植入这一代中国人民的心中。\n\n时值[GetYear]年，§x中§!§j日§!§Y冷战§!的阴云正从西太平洋滚滚而来，但大会堂内，兴高采烈的§R新一代左翼政治家们§!正为新生共和国的未来规划蓝图——§S人民民主§!只是个开始，共和国必将在波澜壮阔的社会主义改造和建设中达到§G他们梦寐以求的远大目标§!——§x无产阶级民主§!。\n--------------------\n感谢您的游玩！至此，您已经游玩了§x新秩序：雄关漫道§!中§x新秩序：东方红§!§Y Ver.1.1：关山月§!的完整内容，并达成§S人民民主结局§!。模组里大量的工作成果当然要感谢我们的与TER团队，但假如没有您的游玩，一切都是一场空。您可以在东方红的创意工坊界面找到并加入我们的Discord社区讨论！"
 TNO_CountryClosing_epilogue_CPC_end_party_mao: "十年前，没人会想到被封锁在潼关以西的§x共产党§!竟是浩浩荡荡六十载人民革命的最终主角——但他们坚持了下来，取得了人民革命的最终胜利。\n\n纵使已经迎来太多落幕，但革命终究§G得胜§!，§G毛主席§!的门徒们沿着[CPC.Capital.GetName]的古城楼缓缓走到中国权力的高台，望向这片满目疮痍的大地——他们心中作何抱负暂不得而知，但可以肯定的是，§G毛主席§!未了的夙愿将由§G他们§!着手实现。\n\n时值[GetYear]年，§x中§!§j日§!§Y冷战§!的阴云正从西太平洋滚滚而来，而这一次，在§x中国共产党§!的带领下，中国人民坚信自己§G定能得胜§!。\n--------------------\n感谢您的游玩！至此，您已经游玩了§x新秩序：雄关漫道§!中§x新秩序：东方红§!§Y Ver.1.1：关山月§!的完整内容，并达成§G党权结局-毛派§!。模组里大量的工作成果当然要感谢我们与TER的团队，但假如没有您的游玩，一切都是一场空。您可以在东方红的创意工坊界面找到并加入我们的Discord社区讨论！"
