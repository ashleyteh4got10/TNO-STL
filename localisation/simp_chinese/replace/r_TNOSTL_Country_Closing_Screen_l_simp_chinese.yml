 TNO_CountryClosing_epilogue_CPC_end_lin_coup: "革命或许得胜——但革命的发展或许并不一帆风顺：没人知道本已决意远离政治的§L林彪§!为何登上了中国权力的最高宝座，也许是屡次需要他出山调停的§R混乱政坛§!激起了他的厌恶，又也许是经营不善导致的§R民心离散§!让他感到失望。总之，隐忍多年的§L林彪§!终于动手了，这次，他将亲自走到台前——§x中国§!必将随着他的指引走向§L他理想的未来§!。\n\n时值[GetYear]年，§x中§!§j日§!§Y冷战§!的阴云正从西太平洋滚滚而来，在§L林主席§!的指引下，£TER_texticon_PLA §R中国人民解放军§!做好了抵御一切来犯之敌的准备，誓要§L保卫胜利§!。\n--------------------\n感谢您的游玩！至此，您已经游玩了§x新秩序：雄关漫道§!中§x新秩序：东方红§!§Y Ver.1.1：关山月§!的完整内容，并§L引起了林彪的不满§!。模组里大量的工作成果当然要感谢我们的与TER团队，但假如没有您的游玩，一切都是一场空。您可以在东方红的创意工坊界面找到并加入我们的Discord社区讨论！"
 TNO_CountryClosing_epilogue_CPC_end_all_gone: "雪铺在伤痕累累的西北大地上，盖住寸草不生的真实而后沉沉死去。旋风突至，卷起玉树，升腾在无边的旷野上，弥漫在这窒息的人间。\n\n§x自由中国最后抵抗者§!的故事至此告一段落，放眼世界，§m美国§!正因§e日本§!獠牙毕现而开始紧急组织OFN安理会峰会，§o德国§!则宣布将在印度洋地区加快部署洲际导弹——§V大西北的毁灭§!似乎奏响了这癫狂世界§x走向终结§!的序曲。\n\n时值[GetYear]年，光阴六十载，§x中国解放之梦§!已彻底化为§o历史的灰烬§!。\n--------------------\n感谢您的游玩！至此，您已经游玩了§x新秩序：雄关漫道§!中§x新秩序：东方红§!§Y Ver.1.1：关山月§!的完整内容，并§V让大西北彻底死去§!。模组里大量的工作成果当然要感谢我们的与TER团队，但假如没有您的游玩，一切都是一场空。您可以在东方红的创意工坊界面找到并加入我们的Discord社区讨论！"
