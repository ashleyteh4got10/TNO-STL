 CAM_Norodom_Sihanouk: "诺罗敦·西哈努克"
 POLITICS_NORODOM_SIHANOUK_DESC: "每当西哈努克坐上先王的王座时，他都如坐针毡，这位在日本刺刀之下登基的亲王，无时无刻不处于失去国土的恐惧之中。\n\n万幸的是，柬埔寨单纯的贫穷使日本帝国移开了她贪梦的目光：大战中这里没有日本人投下的炸弹，大战后这里没有日本人挥舞的皮鞭。祖先的故土就一直这样和平安详，掩映在密林中。——假如抛开泰国对北方省份入侵的话。\n\n统治柬埔寨的二十年里西哈努克尽己所能，在共荣圈成员间纵横捭阖，在不可侵犯的主子日本面前为自己的国家争取到一番优厚的外贸条件。外汇似涓涓细流淌入国库，春雨慢慢哺育了柬埔寨的乡间村野。\n\n可是仆人终究是仆人，西哈努克不能违抗主人的命令，哪怕是无理的命令……"
