 TNO_CountryClosing_epilogue_CPC_end_RGOC: "革命并未得胜，§m国民革命军§!将§C平等、民主、自由§!的§x解放之梦§!扼杀在潼关以西，中华民族的未来§m道阻且长§!。\n\n§x自由中国最后抵抗者§!的故事至此告一段落，但§S中华民族§!的故事或许还会继续下去，台北峰会蓄势待发，全世界都在等待：高歌凯旋的§m中华民国§!将以何种姿态面对高居其上四十载的§j日本帝国§!。\n\n时值[GetYear]年，光阴六十载，§x中国解放之梦§!终究走入了§m异路歧途§!。\n--------------------\n感谢您的游玩！至此，您已经游玩了§x新秩序：东方红§!§Y Ver.1.1：关山月§!的完整内容，并令§x中国解放之梦§!走向了§m另一个方向§!。模组里大量的工作成果当然要感谢我们的团队，但假如没有您的游玩，一切都是一场空。您可以在东方红的创意工坊界面找到并加入我们的Discord社区讨论！"
 TNO_CountryClosing_credits_0: "§W制作组成员名单§!\n组长：雾岛小枝\n\n剧情主管：雾岛小枝\n\n代码主管：Crys7aL_L1nE\n\n玩法主管：Crys7aL_L1nE、雾岛小枝\n\n社区主管：Crys7aL_L1nE、雾岛小枝\n\n美工组-图标：Chuny_、Dafid25、芙兰朵露多诺娃、FullyAutomaticCirnoBot、普通的苏联人、人畜无害的魔女、克里斯伯伯、雾岛小枝、人生如夢、穿林北腿常凯申\n\n美工组-CRT风格界面&科技树：Crys7aL_L1nE、FullyAutomaticCirnoBot\n\n音乐组：bipedalisticpig（游戏主题作编曲）、Crys7aL_L1nE（超事件音乐）、雾岛小枝（超事件音乐）\n\n写手组：233、Crys7aL_L1nE、Chef Kang、普通的苏联人、尴尬中的自语、Mortis、KangNi、SpringBridgeM1917A2、笠少仔、尝尝酒酒、Oktinner逆旅、镰刀锤子布、SCARFACE、雾岛小枝、ZhouFengMing\n\n合作开发者：Ashley、超人、Die_Zero、INGSOC、Makerd、马桶、晋人、Mr.Cellophane、旧事、Socialist闲汉、苏油田、十一月三十一、Beer Mengzi\n\n英文本地化团队：火星方阵（组长）、RexNatura、sendhelp、ZhouFengMing\n\n特别鸣谢：TNO开发团队、TNO汉化组、美丽新世界-亚洲团队、晨曦之地、鹿鸣河、正道沧桑、馀生、道阻且长、苍山如海、子夜余生、赤潮：雨打芭蕉\n\n特别鸣谢：Aliusars、渤海湾冲浪里、灿然辉光、麻吉、Matsuo_Basho、Sakuya（虚空）、TaikangRW（太康）、馍羽、TQR、Volkov_su55、信选组组长、Layefe（拉菲）、SiberiaThea\n\n前成员：233、托洛茨基在1917、F1end、Wopy、诗人、台尔曼"
 TNO_CountryClosing_credits_1: "后记\n\n《新秩序：东方红》最初由托老（知乎托洛茨基在1917）构思制作，他是国内涉足TNO剧情类子模组的第一批人。东方红在2020年进入制作环节，10月发布beta版。紧接着在当时各方组员的协助下，托老完成了跨度达十年的内容，并于半年后发布了正式版本。如果用现在的眼光看，最初版本的东方红有许多地方不尽如人意，但当时这绝对是可圈可点的成绩，在公共平台上引发了广泛的讨论。\n\n2021年年底，由于TNO子模组之间的技术竞争，组内一些成员希望给东方红翻新，让游戏更贴合TNO的风格。此时托老正忙于开发《千禧黎明：红色之梦》和《革命的遗产KR/KX》，没有精力投入东方红的制作，所以将模组转交给文案雾岛小枝，Crys7aL_L1nE也在此时成为核心成员。本年第四季度，制作组重新评估现状，对东方红展开大刀阔斧的修改。具体补充了旧版东方红的背景设定，放弃了1965年解放全国和建国后的内容，同时保留第一阶段剧情（大跃进危机，蒙古危机，新疆内战，解放四川）进行代码重编。2022年3月，经过重制的《新秩序：东方红》在创意工坊发布。\n\n新版东方红前后共经历“千里之行，始于足下”、“鱼腹藏剑”（2023愚人节版为“愚腹藏剑”）、“白虹贯日”、“关山月”四个大版本。“鱼腹藏剑”在2022年夏季更新，增加了策动东南亚起义的内容，此后不断补充，于当年年底形成了以九大作为结尾的定版。第二个版本的开发过程也是制作组不断成长壮大的过程。很多托老时期的朋友一直关注模组的进程，随着开发不断深入，Polyboy承担起了英化任务，中文马克思主义文库编辑者Socialist闲汉源源不断地为我们提供资料。同时有许多新朋友加入了我们，233在9月加入制作组，为东方红的设定文案指点迷津。我们还要由衷感谢原《新秩序：美丽新世界（BNW）》的亚洲开发团队，他们是第一个与东方红达成合作关系的制作组，为我们慷慨提供了史料史评以及技术加持，其严谨细致的创作精神重塑了我们对TNO子模组的认知。此外，我们对《新秩序：馀生》开发团队、《新秩序：明日革命》开发团队、《赤潮：雨打芭蕉》开发团队、《新秩序：欧洲末日》开发团队及汉化组等在制作过程中给予过我们帮助的团体或个人致以诚挚感谢，感谢你们在不同时期为东方红提供的帮助。\n\n经过三年的不懈努力，目前《新秩序：东方红》已更新“关山月”版本，用解放战争为十年剧本画上休止符，不过这并不意味着结束。自从模组重制发布之后，玩家们给东方红提出许许多多富有建设性的意见，我们的组员也在不断进步，我们相信这个过程不会随版本大更新而停止。正如托老时期的东方红一样，面对社区各方检验，我们不能仅仅做到适配游玩，还要更正不成熟、不实际的游戏创作，“翻新”将再一次成为工作的主题。\n\n——写于2024年，白虹贯日版本发布后。"