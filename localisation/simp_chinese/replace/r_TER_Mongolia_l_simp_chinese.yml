 WORLD.16509.d: "蒙古草原的军政领导人德穆楚克栋鲁普亲王死于一场严重的病毒性胃肠炎，这位老人去世前的几周饱受病痛折磨。德穆楚克栋鲁普亲王的名号是蒙古历史上一个鲜明的印记，在借助日本的力量使内蒙与外蒙实现了短暂的统一后，却又因为他无能的统治，导致六十年代初蒙古内部爆发的共产主义叛乱再一次地撕裂了蒙古民族。有人谴责他是日本的傀儡，也有人宣扬他是泛蒙古主义的拥护者，但不管人们怎么想，德王现在已经去世了。虽贵为国家元首，但德王的葬礼略显冷清，日本前来参加葬礼的最高级别政要是驻南京大使。随着先王去世，备受瞩目的都固尔苏隆亲王正式登基。"