 MON_Gelekdorjiin_Demid: "格勒克道尔吉·德米德"
 MON_Gelekdorjiin_Demid_desc: "青年时期的德米德游历四方，在形形色色的人手下打工，目睹了落后残破的蒙古社会。在革命爆发后，他主动参加人民军，抗击“疯男爵”和中国干涉军。由于作战勇猛，在当年成功入党，并被人民革命党派往苏联深造，回国后成为第一书记根登的左膀右臂，总领军队建设。1936年，德米德指挥下的部队在抗击日本入侵的战斗中贡献突出，被授予共和国第一元帅的称号。\n\n1939年，联共以追究“错误领导”的名义，将蒙古党政首脑根登和阿马尔传唤至伊尔库茨克隔离审查，时间长达三个月。三个月，足够一场政变从策划到成功，是德米德在国内牢牢监视着那些亲俄分子，粉碎了政变的阴谋。最终，面无血色的根登被释放回国，他向德米德控诉苏联人的威逼恫吓：他们只想要一条马首是瞻的忠犬，而不要一名真正的布尔什维克。\n\n面对根登的惨状和未遂的政变，真正的布尔什维克心中有所动摇。过去十年，为了一些理念之争浪费许多精力，到现在一事无成，以至于被莫斯科讥讽“游牧民的建设就是没有建设”。德米德意识到，比起精神胜利，蒙古更需要现实的结果。在《蒙苏同盟条约》的谈判中，他不再一律严拒，而是开始讨价还价，希望用自己的立场转变换来迫在眉睫的援助。果然，苏联以为德米德屈服了，于是愿意在食肉之余舍下几口盐汤，喂给嗷嗷待哺的蒙古。\n\n至于根登，他再次被俄国顾问要求前往乌克兰观摩学习，一去就再也没回来。苏德战争中，有一大批软禁在乌克兰的蒙古领导人被德军俘虏，死在了集中营。这笔血债，德米德始终记在苏联头上。当苏联一败涂地之时，他打开一坛尘封的老酒，自斟自饮，把酸苦辣咸通通咽下。世界没有给德米德留有悲伤的时间，复仇的漩涡再添新痛，日本鬼子的啸叫近在眼前。\n\n日本肆无忌惮地蹂躏着南方和东方的同胞，德米德正带领人民走过最黑暗的时刻。争取民族独立统一的欲望从未如此高涨，骄傲的红色蒙古永不屈服。"
 MON_Daryzavyn_Losol: "达理扎布·洛索勒"
 MON_Daryzavyn_Losol_hog: "达理扎布·洛索勒"
 MON_Daryzavyn_Losol_hog_desc: "§Y政府主席兼财政委员会主席\n$communist_bolshevism_subtype$§!\n§F------------§!\n§F孩童时，洛索勒被家人送人寺庙出家。博克多汗国建立后，作为护法僧人随军抗击外敌。在军队中，他倾心结识其他革命者，成为蒙古人民党建党七人之一，以远东代表身份出席共产国际大会。回国后，洛索勒正式还俗，并长期担任政府首脑。\n\n1936年，洛索勒与德米德共同编纂蒙人党党史，淡化了革命时期苏联对蒙古的影响。当根登被流放，蒙人党群龙无首时，洛索勒凭借资历和威望驳回了俄国顾问更换乔巴山为最高领导人的无理动议，全力支持德米德接任总书记，保证国家仍掌握在自己人手中。\n\n洛索勒对民族主体性的追求没有上限，蒙古革命注定是一场社会主义革命，她决定了蒙古民族的未来，因此不允许那些“擅长革命”的外人横加干预。§!"
 MON_Sonombaljiryn_Buyannemekh: "索诺木巴尔济勒·布雅内梅赫"
 MON_Sonombaljiryn_Buyannemekh_eco: "索诺木巴尔济勒·布雅内梅赫"
 MON_Sonombaljiryn_Buyannemekh_eco_desc: "§Y教育委员会主席\n$communist_national_communism_subtype$§!\n§F------------§!\n§F索诺木巴尔济勒·布雅内梅赫出生在一个难以承担赡养的赤贫家庭，5岁时被另一个善良的富人家收养。养父母将他视若已出，尽心竭力培养这个孩子，希望他长大后当一个学富五车的学者。不过，布雅内梅赫在学校中受革命感召加人人民党，由他重新填词的蒙古国际歌得到广泛传唱，并成为共和国国歌。\n\n1927年，年仅25岁的布雅内梅赫荣升首都乌兰巴托的党委主席。党员大会上他受宠若惊，发言称，从没想过自己身为一个知识分子竟能如此深度参与政治。利用自己的影响，布雅内梅赫支持蒙古语的拉丁化改革。但莫斯科叫停境内的拉丁化运动后，明里暗里推销布哈林式的泛斯拉夫同化，使得俄罗斯境内的蒙古人最终接受了西里尔字母。\n\n为了实现蒙古民族文化上的统一，布雅内梅赫在四十年代向现状妥协，同意采用俄式拼写改造蒙古语。这更让他下定决心，加人德米德的反俄队伍，伸张更适合蒙古的现代化革命。§!"
 MON_Sonomyn_Avardzed: "索诺木·阿瓦尔泽"
 MON_Sonomyn_Avardzed_for: "索诺木·阿瓦尔泽"
 MON_Sonomyn_Avardzed_for_desc: "§Y外交委员会主席\n$communist_national_communism_subtype$§!\n§F------------§!\n§F如同军队在战时一般，蒙古人民共和国的外交部门在工作中往往刺刀见红，又因先天弱小而受尽摧残。有经验的外交官总是因为这样或那样的爱国操守，出访苏联后下落不明。日军人侵蒙古后，派去日本交涉的人员更是侈谈安全，各种暗杀层出不穷。\n\n一辈辈先烈倒下，一代代新人再次站起。相比其他出生于本世纪最初十年的老革命，年仅四十便跻身外交首脑的阿瓦尔泽可谓是年富力强的政坛成员。阿瓦尔泽与历代前任肩负的使命别无二致，祖国的根本利益绝不会在他发起的外交博弈中用来讨价还价，这也是德米德所看重的品质。§!"
 MON_Sereenen_Givaapil: "色仁恩·吉瓦皮尔"
 MON_Sereenen_Givaapil_sec: "色仁恩·吉瓦皮尔"
 MON_Sereenen_Givaapil_sec_desc: "§Y人民军总参谋长兼工业委员会主席\n$communist_national_communism_subtype$§!\n§F------------§!\n§F吉瓦皮尔是一名严厉的军官，他的严厉大多来自对共产主义一片由衷的热诚。1932年，经他组建的内卫部队负责镇压喇嘛掀起的反革命叛乱。事后，前总书记根登为逃避引发叛乱的责任，将吉瓦皮尔作为“左倾分子”抛弃，遣送他赴苏考察。考察途中，吉瓦皮尔向党中央写信愤怒控诉：如果我有罪，请用正当罪名惩罚我，而不是像俄罗斯法西斯分子那样把我流放出去。\n\n收到信的根登十分懊悔，随后以经济建设缺乏人才为由，将吉瓦皮尔引渡回国，委派他管理国营企业。经吉瓦皮尔管理的企业个个风生水起，战场纪律的确有助于扭转散漫的游牧习性，培养熟练工人。\n\n苏联崩溃后，摆脱束缚的德米德代替根登对吉瓦皮尔郑重道歉，并启用他重新施展军事才能。吉瓦皮尔不遑多让，领受了德米德的重托，正如他在十年前的信中所写：如果日本帝国主义者有一天进犯蒙古，我一定会纵马驰回保卫祖国。§!"
 MON_leader: "领袖"
 
 MON_hidden_sick: "隐疾"
 MON_hidden_sick_desc: "蒙古民族是一个弱小的民族，在经济、政治、文化上都需要依附于其他民族。成吉思汗征服的土地因此而分裂，现代蒙古也正走在这条钢丝之上。\n\n为了联合中国还是联合苏联红军的路线问题，一幕幕争吵在党内不断重现。谬论催生偏见，偏见巩固立场。随着蒙中合作政策实施，同志之间更是矛盾丛生,党中央对此无力制约。\n\n只有消灭日本傀儡，解放蒙古人民，建立蒙古联邦，实现民族统一，我们才能停止争吵，真真正正团结在同一片蓝天白云之下。"
 MON_we_are_still_friend: "前缘未了"
 MON_we_are_still_friend_desc: "严峻的形势逼迫我们采取和中共合作的迂回抗日路线，以高岗为首的援蒙小组来到我党决策层，负责协调行动。我们同样允许中共的组织进入南蒙策划武装起义，帮助我们的军队分担前线压力。\n\n我们希望中国同志知悉：蒙中双方相互尊重领土和主权完整，彼此之间是亲密的战友，亲密的伙伴；蒙中共同对抗日本帝国主义，这份用鲜血倾注的友谊值得永远纪念。"
 MON_bloody_field: "血洒旷野"
 MON_bloody_field_desc: "自从国家取得独立，蒙古与苏联的每一次来往都是那样不快。但当蒙古与苏联失去联系时，输血式外援亦随之消失，国家又迅速走向崩溃。人民军付出了巨大的牺牲，却没能阻止日本人侵。\n\n苏联驻蒙军团和流落西蒙的红军部队在抗击日寇的战斗中出力甚多，攻无不克的装甲师令我们的基层军官为之着迷。于是他们崇拜起更加强大的俄军，对丧权失地的长官们极尽鄙夷。继而蠢蠢欲动，企图取而代之。"

