Asia_National_Revolutionary_League: "亚洲民族革命联盟"
econ_sphere_name_tab_CPC: "亚洲经济合作共同体" #ANRL-Economic Cooperation
econ_sphere_name_long_CPC: "亚洲经济合作共同体"
econ_sphere_name_CPC: "亚洲经济合作共同体"
ANRL_Leader: "亚洲民族革命领袖"
ANRL_Leader_effect: "[!ANRL_Leader]"
ANRL_Leader_desc: "三十年蹉跎岁月，中国共产党选择了一条矢志不渝的革命道路，成为亚洲众多革命的策源地，最终荣获“亚洲民族革命领袖”这实至名归的桂冠。\n\n亚洲民族的独立与自由无时无刻不受日本帝国的威胁，自革命烈火中诞生的新国家需要团结一致，抵御帝国主义随时到来的入侵。为了铲除泛亚殖民主义，为了亚洲人民永恒的幸福，中国共产党集合各国共产党齐聚越南，共同签署《河内协定》，成立亚洲民族革命联盟。\n\n§x“所有受到日本帝国侵略、控制、干涉和欺负的国家和人民联合起来，打倒我们共同的敌人！”§!"
ANRL_Core_member: "亚革盟正式成员国"
ANRL_Core_member_effect: "[!ANRL_Core_member]"
ANRL_Core_member_desc: "核心领土防御：§G+10%§!\nGDP增长率提升：§Y5%§!\n\n亚洲民族革命联盟致力于亚洲民族独立发展。凡亚洲内倾向社会主义的独立国家均可以向联盟提交加入联盟的申请，由联盟经过一段时间考察后授予其正式成员国的身份。正式成员国在联盟内拥有完全权利地位，可以参与最高决策，管理日常事务，发动或指挥联合军事行动。\n\n为区别于不完全权利地位的成员和领袖国，正式成员国有时会被称为独立成员国。"
ANRL_sub_member: "亚革盟受监管国"
ANRL_sub_member_effect: "[!ANRL_sub_member]"
ANRL_sub_member_desc: "核心领土防御：§G+10%§!\nGDP增长率提升：§Y5%§!\n\n由于新兴国家的治理经验不足，在尊重其国家主权的前提下，通过申请监管进入“受监管”状态，然后某一独立成员国将获得指导权利，以便对受监管国进行外部指导和援助。\n\n申请监管的持续时间不能低于一年，不能超过五年，监管状态到执行期满自动解除。受监管国也可以在执行开始后一个月内提出解除，之后执行一年以上可以提出解除。准成员国提出的监管时长不能超过自身考核期。\n\n如果在监管过程中受监管国与指导国发生冲突，可以到监管仲裁会议提出申诉，将由利益不相关成员国进行裁决。在仲裁会议中，受监管国与独立成员国拥有同等的地位。"
ANRL_federation_member: "亚革盟-联邦成员"
ANRL_federation_member_effect: "[!ANRL_federation_member]"
ANRL_federation_member_desc: "核心领土防御：§G+10%§!\nGDP增长率提升：§Y5%§!\n\n亚革盟内，联邦制国家的非主导成员国在亚革盟享受同正式成员国一致的经济优惠待遇，但不具备完全权利地位。联邦成员可派出独立代表参与列席联盟代表大会并发表意见，但在亚革盟内的重要事项决策权和军事指挥权由其联邦的主导成员代行。"
ANRL_puppet: "亚革盟专区政府"
ANRL_puppet_effect: "[!ANRL_puppet]"
ANRL_puppet_desc: "核心领土防御：§G+10%§!\nGDP增长率提升：§Y10%§!\n\n专区政府不是亚洲民族革命联盟的独立成员国，而是各成员国在其领土上设立的地方临时机构，其管辖范围通常包括一个或数个省份，并用地理方位为之命名。\n\n在战争或备战状态下，专区政府可以使当局进行有效规划和重建，保持地区稳定，消除日本的影响。\n\n各成员国拥有为彼此专区政府沟通联系的权利，但专区政府的主权最终归于设立国当局，其他成员国不能干涉。"
ANRL_observer: "亚革盟准成员国"
ANRL_observer_effect: "[!ANRL_observer]"
ANRL_observer_desc: "GDP增长率提升：§G+2.5%§!\n\n当一个独立亚洲国家提出加入联盟的申请后，联盟正式成员国会通过集体审议接纳与否，获得多数赞成通过后即成为准成员国，并进入一段考察期。在此期间，准成员国不能享受与正式成员国同等权利地位，但准成员国的行动在大多数情况下也不受联盟管制，并且在某些经济协定中可以享受优惠待遇。\n\n考察期由正式成员国和准成员国共同决定，时长不能超过五年。考察期结束后自动加入联盟，成为正式成员国。"

#Kyoeiken
Sphere_special_administrative_region: "中华民国行政院辖市"
Sphere_special_administrative_region_effect: "[!Sphere_special_administrative_region]"
Sphere_special_administrative_region_desc: "行政院辖市是中华民国的省级行政单位，根据民国38年（1949年）《市组织法》规定：凡经济、人口到达相应规模或具有特殊地位的城市，应设直辖市，受行政院之指挥、监督，且无权抵触中央及上级政府法令。\n\n院辖市的设置，是将富庶发达的城市及周边地区从原省份剥离，由南京控制其人事以加强监察，在国防和预算上给予特殊关照。院辖市同时代表了中央权威，与其相邻的省份——尤其是原省份，有义务以本地之经济支持院辖市的发展。这项地方制度改革，是晚年汪精卫扭转地方独立倾向的一次尝试。"
Sphere_residence_of_governor_general_GGC: "帝国总督府§F\n--------------\n依据£GNG_japanese_frustration_texticon §j《日韩合并条约》§!及其后续法条，朝鲜防务目前由£GNG_japanese_frustration_texticon §j大日本帝国陆军第17方面军§!负责。§!"
Sphere_residence_of_governor_general_GGC_effect: "[!Sphere_residence_of_governor_general_GGC]"
Sphere_residence_of_governor_general_GGC_desc: "总督府应当被视为大日本帝国之国内行政单元，与本岛各都道府县同为大日本帝国之疆域，而非共荣圈内具有名义独立主权的国家。此套殖民行政制度自大正时代便已形成，尽管当下的日本更愿意通过经济控制、代理人战争甚至军事管制等手段完成其殖民扩张目标，但总督府制度仍然在一些特定地区延续了下来。\n\n《日韩合并条约》签订后，日本在朝鲜半岛的监理统治机构“统监府”被改组为朝鲜总督府，受属天皇直辖，日本由此开始了在朝鲜半岛一以贯之的殖民吞并进程——官方口径称之为“内鲜一体”。"
Sphere_residence_of_governor_general_TWN: "帝国总督府§F\n--------------\n依据£GNG_japanese_frustration_texticon §j《台湾军司令部条例》§!及其后续法条，台湾防务目前由£GNG_japanese_frustration_texticon §j大日本帝国陆军第10方面军§!负责。§!"
Sphere_residence_of_governor_general_TWN_effect: "[!Sphere_residence_of_governor_general_TWN]"
Sphere_residence_of_governor_general_TWN_desc: "总督府应当被视为大日本帝国之国内行政单元，与本岛各都道府县同为大日本帝国之疆域，而非共荣圈内具有名义独立主权的国家。此套殖民行政制度自大正时代便已形成，尽管当下的日本更愿意通过经济控制、代理人战争甚至军事管制等手段完成其殖民扩张目标，但总督府制度仍然在一些特定地区延续了下来。\n\n在日本的所有海外殖民地中，台湾的被殖民历史最早，因而日本化的程度也最深，旭日统御七十载，看来彻底吞并台湾的辉煌时刻已是近在咫尺。看客诸君无需过分多虑台湾本土民众会怎么看待这一必将完成的历史进程，毕竟在世界列强的国家机器面前，蕞尔小民的所思所想并不重要。"

#East Asia Anti Communist Pact
Kyoeiken_EAACP: "共荣圈-东亚防共协定"
Kyoeiken_EAACP_Leader: "东亚防共协定-中华民国"
Kyoeiken_EAACP_Leader_effect: "[!Kyoeiken_EAACP_Leader]"
Kyoeiken_EAACP_Leader_desc: "为应对急剧变化的亚洲局势，在共荣圈框架下，中华民国联合滇黔桂晋四省政府在南京签署《东亚防共协定》。\n\n国共冲突这一贯穿中国现代历史的暗线即将浮出水面，掀起滔天巨浪。幸赖日本慷慨解囊，中华民国的军力正在迅速恢复，但时间仍然相当有限，南京国民政府必须尽快重新集结起足以抗衡西部共产党军队的力量，否则，§x中华民国六十载的艰难国运就将被共产党的怒火吞噬殆尽……§!"
Kyoeiken_EAACP_CHI_warlord: "东亚防共协定-中国军阀"
Kyoeiken_EAACP_CHI_warlord_effect: "[!Kyoeiken_EAACP_CHI_warlord]"
Kyoeiken_EAACP_CHI_warlord_desc: "为应对急剧变化的亚洲局势，在共荣圈框架下，中华民国联合滇黔桂晋四省政府在南京签署《东亚防共协定》。\n\n除非有极其迫切的外部威胁，否则要想让军阀和南京政府拧成一条绳，恐怕比登天还难——但中共做到了，所有割据省份自治的军阀们迫于西部压力纷纷来到南京，《东亚防共协定》的签署让中华民国再次得以“统一”——尽管听命于人对这些占山为王的军阀们毫无疑问是难以接受的，但相比来势汹汹的§x共产党§!，南京国民党中央的面目立刻就显得§G亲善慈和§!了起来。"

TNO_Cold_War_Victory_ID_501: "第三次中日战争"