XGZ_Qogyi_Gyacan: "确吉坚赞"
Qogyi_Gyacan_DESC: "额尔德尼·确吉坚赞出生于青海省循化县温都乡一户贫苦的农民家中，俗名贡布慈丹，而他年幼的命运随着九世班禅圆寂而改变。1944年，重庆政府在中原兵败如山倒的一年，经日喀则堪布会议厅占卜降神指引，七岁的贡布慈丹被认定为前任活佛的转世灵童。一众身披紫金袈裟的高僧把他从家中带到塔尔寺受戒出家，得法名“确吉坚赞”。\n\n西藏噶厦政府一直与国民政府保持着若即若离的关系，而噶厦内部存在着两大活佛世系的政教纷争。尤其民国以降，身处日喀则的班禅一直受到来自拉萨达赖喇嘛的倾轧。因此班禅世系向来与中原统治者来往密切，为自己在西藏的地位争取外援，这也成为九世班禅横遭噶厦政府驱逐的重要原因。\n\n确吉坚赞继任活佛后，他明显感到自己仍然没有跳脱九世班禅当年所处的困地。虽然沉于经学，收敛自己的政治诉求能够应付拉萨方面的无端诘难。可青藏高原以外风云变换的世界，使确吉坚赞越来越难以独善其身。一股翻天覆地的洪流，正势不可挡地向他压来。"
XGZ_now_is_ours: "我们将§m团结§!现已秘密转移至§Y昌都§!的§Y班禅·确吉坚赞§!，为§G解放西藏§!做好准备。"
