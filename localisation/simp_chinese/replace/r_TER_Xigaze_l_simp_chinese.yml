TIB_AZH_1950_border_memorandum: "《藏印1950年边界备忘录》"
TIB_AZH_1950_border_memorandum_tt: "备忘录规定§R麦克马洪线§!无效，仍以§G噶厦政府宣称线§!为准。"
TIB_AZH_1950_border_memorandum_desc: "西藏和印度的边界争端由来已久，一路可上溯至英属印度时期英国人划下的“麦克马洪线”——但很显然，无论是藏地噶厦政权或是东边的民国政府，从未真正承认过此条边界线合法。\n\n既然英国佬划的线靠不住，那涉事各方免不了要在争议领土上舞刀弄枪一番：彼时印度刚刚独立未曾分裂，势头正盛，于阿鲁纳恰尔邦布置五千精兵严阵以待；而民国却刚从§R西北和华南的狂风骤雨§!中逃出生天，只得从国民革命军拼凑几个残兵败将，再拖着装备散杂语言不通的藏军驻扎达旺抵御印军。两军势头天差地别，看来这场边境战争就要以印度的大胜告终——\n\n可惜战端未起，那属于印度的胜利女神也就未曾露面：出于安抚民国政府的考虑，也为了拉拢噶厦使共荣圈势力范围继续向内陆扩张，日本选定仰光为备忘录签署地，邀请了南京、拉萨、新德里代表前来签署边界备忘录。\n\n在此等外交场合对日本感恩戴德的民国代表自不必多说，前往仰光署名的第五世热振活佛也捻着佛珠对协调签字的日本代表连连颔首致谢。这倒是引来了藏地隐寺中的些许怨怼——若是就此沾染尘间因果，搅乱他们清修，可怎了得？"

AZH_TIB_1950_border_memorandum: "《印藏1950年边界备忘录》"
AZH_TIB_1950_border_memorandum_tt: "备忘录规定§R麦克马洪线§!无效，仍按§G习惯边界线§!为准。"
AZH_TIB_1950_border_memorandum_desc: "仰光备忘录令全印蒙羞，阿富汗战争和紧随其来的两印分裂又令印度虚弱，现在这曾雄立南亚次大陆的巨象只能倚着世界屋脊勉力支撑：停火线上剑拔弩张的同胞已经耗尽了新德里和加尔各答的全部精力，同北方邻居的边界争议问题也就被搁置了下来。\n\n但这不代表印度没有夺回阿鲁纳恰尔邦的计划，或许等时机成熟，它会示意§R仆从拥趸§!率先发难。"