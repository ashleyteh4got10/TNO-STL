CPC_TRCW_warzone_btn_1_tt: "动员民兵\n--------------------\n将有§Y1§!支§Y民兵师§!立即部署到该战区，所有§Y民兵师§!在战争结束后将被§Y解散§!。\n\n花费£command_power §Y20§!指挥点数与§Y4300§!人力。\n每月，每战区仅可采取§Y1次§!战区行动。\n\n该行动只可于§G后方战区§!实施。"
CPC_TRCW_warzone_btn_2_tt: "动员生产\n--------------------\n将有§Y300§!单位§Y步兵装备§!、§Y100§!单位§Y支援装备§!及§Y75§!单位§Y火炮§!被立即添加至库存。\n\n花费£pol_power §Y20§!政治点数与§Y0.5%§!战争支持度。\n每月，每战区仅可采取§Y1次§!战区行动。\n\n该行动只可于§G后方战区§!实施。"
