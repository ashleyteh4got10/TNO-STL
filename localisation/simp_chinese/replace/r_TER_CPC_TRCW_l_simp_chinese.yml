TRCW_info_tt: "§V伟大的亚洲人民解放战争§!已经打响，目前所有§G解放区§!均已转入§Y战备状态§!，由§R中央军委§!及§G中央前敌委员会§!统领全面战争的军政事宜。\n---------------\n-§Y战争指数系统§!\n战争的总体进程可被量化为界面中的§Y战争指数§!：§f轰炸烈度§!、§n污染程度§!，分别反映根据地遭敌轰炸的破坏程度及遭敌细菌战污染的严重程度。可以通过§Y战时政策§!抑制§Y战争指数§!的增长，§Y战争指数§!§R越高§!，则代表我后方根据地§R受破坏程度§!越高，§Y战争指数§!到达一定阈值将§x造成不可预知的严重后果§!。\n\n-§Y战区机制§!\n在本界面地图中，全国被分为§Y数十个战区§!，而所有战区总共又可以归为以下几类。\n§G解放§!区：所有§Y下辖地区§!完全由§G友方势力§!实控的战区。\n§R敌占§!区：所有§Y下辖地区§!完全由§R敌方势力§!实控的战区。\n§O交战§!区：§R敌§!§G我§!均至少实控§Y一个下辖地区§!的战区。\n§Y战争指数系统§!仅在§G解放区§!启用，其详细信息请查看下方的交互界面。\n\n§Y每15天§!，我们将获得所有新近§G解放§!地区的§G核心宣称§!。"
TRCW_info_warpoint_tt: "§Y战争指数系统§!详情\n--------------------\n§f轰炸烈度§!及§n污染程度§!的实际每月增速为所有§G解放区§!的§Y每月增速加权平均值§!。\n\n§G后方战线§!与§O前敌战线§!的§Y战时修正§!详细数值由所有§G解放§!地区的§Y地区重心§!决定，所有地区的§Y地区重心§!默认为§Y平衡§!。同时，§Y战时修正§!将受到§f轰炸烈度§!及§n污染程度§!平均值的§R百分比削弱§!。\n\n§G后方战线§!\n每周稳定度变化：[?CPC.CPC_TRCW_modifier_weekly_st|+=%]\n生产效率上限：[?CPC.CPC_TRCW_modifier_production_cap|+=%]\n生产效率增长：[?CPC.CPC_TRCW_modifier_production_growth|+=%]\n额外£tt_prod_unit 生产单位：[?CPC.CPC_TRCW_modifier_PUs|+0]\n\n§O前敌战线§!\n单位攻击：[?CPC.CPC_TRCW_modifier_attack|=%+]\n单位防御：[?CPC.CPC_TRCW_modifier_defence|=%+]\n单位组织度：[?CPC.CPC_TRCW_modifier_org|=%+]\n单位组织度恢复：[?CPC.CPC_TRCW_modifier_org_regain|=%+]\n增援率：[?CPC.CPC_TRCW_modifier_support_rate|=%+]\n\n§f防空防核§!（§f轰炸§!烈度：[?CPC.CPC_TRCW_total_bomb_progress|=2-]%）\n地区建筑数量上限：[?CPC.CPC_TRCW_modifier_buildings_cap|=%+]\n免费维修：[?CPC.CPC_TRCW_modifier_free_fix|+=%]\n生活消费品额外需求：[?CPC.CPC_TRCW_modifier_consumer_needs|-=%]\n\n§n防疫卫生§!（§n污染§!烈度：[?CPC.CPC_TRCW_total_bio_progress|=2-]%）\n月度人力：[?CPC.CPC_TRCW_modifier_monthly_manpower|+=%]\n适役人口：[?CPC.CPC_TRCW_modifier_suitable_manpower|+=%]\n医保水平每月变化：[?CPC.CPC_TRCW_modifier_soc_dev_medical|+=2]"
