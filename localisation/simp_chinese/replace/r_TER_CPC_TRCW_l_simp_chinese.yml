#替换TNO
MAN_Kwantung_Army_TER: "关东军"
MAN_Kwantung_Army_TER_desc: "安全令实施后，关东军成为东北地区唯一的军事力量。表面上，它“只是大日本帝国陆军的一部分”，但实际上，这种认识过于粗浅，只是流于表面。事实是，满洲政府与日本“统治者”之间的联系十分密切，你中有我、我中有你。比如，各部大臣都有一名日本次长，以此过滤掉任何有损日本利益的提议，以确保日本在满洲国的绝对权威。\n\n不过，关东军也存在内部分歧，可分为满洲派和正统派。前者包括满洲国军和日本陆军的温和派；后者则由那些思想可追溯至全体主义和国民精神总动员时期的人组成，致使满洲国军“接受”关东军指挥层领导的1955年军事合作法加强了这一派系。"

#广东暴乱接口GUI
CPC_TRCW_GNG_Riots_GUI: "§x广东起义§!"
TER_TRCW_GNG_Riots_Info_Normal_tt: "§V二十年的压迫、各族群间不断激化的紧张关系、弱肉强食的社会，§!这些都是£GFX_GNG_Guangdong_texticon §S广东§!的£GNG_rioters_texticon §u起义者们§!面临许久、也正要求解决的问题。\n\n£GNG_CCL_texticon §V华人劳工委员会§!组织起£GNG_chinese_nation_texticon §i华人§!，而£GNG_zhujin_texticon §E珠人§!则团结在£GNG_GFT_texticon §n广东工商联合会§!旗下，两组织均不同程度受到£CPC_texticon §G中国共产党华南局§!的资助。他们的行为激进与否取决于其£GNG_riot_strength_texticon §e实力§!和£GNG_riot_radicalism_texticon §x激进程度§!。\n\n我们可以通过§Y控制起义规模与暴力程度§!，在维持较高£GNG_riot_radicalism_texticon §x激进程度§!与£GNG_riot_strength_texticon §e实力§!的同时，尽量不过分惹怒£GNG_japanese_frustration_texticon §j日本§!，以免造成§x广东局势失控，徒增工人牺牲§!。\n\n请注意，若某组织的£GNG_riot_radicalism_texticon §x激进程度§!低于§Y25%§!，£GFX_GNG_Guangdong_texticon §S伪广东政府§!将有可能发起谈判行动令其§S服从政府管制§!；若某组织的£GNG_riot_radicalism_texticon §e实力§!低于§Y25%§!，£GFX_GNG_Guangdong_texticon §S伪广东政府§!将有可能发起肢解行动令其§S彻底失能§!。"
