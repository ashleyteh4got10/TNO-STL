 TNO_ugly_american_icon_tt_delayed: "§F1494年的§H《托德西利亚斯条约》§!曾试图将新世界一分为二，由§O西班牙§!和§n葡萄牙§!独占。§O西§!§n葡§!两国在教宗的祝福下将地球分割，成为遍布金银的新大陆的主人。然而，欧洲其他列强眼红不已，纷纷撕破脸皮，试图在这块蛋糕上多分几刀。时过境迁，§n葡萄牙§!与§O西班牙帝国§!日渐衰落，§J英国§!、§i法国§!和§u荷兰§!将条约弃如敝屣，亲自在美洲争夺广袤的领土。最终，曾经不可一世的§O伊比§!§n利亚§!双雄只剩下几缕残影。\n\n第二次世界大战的结束催生了另一份新条约。这一次，原子弹为其背书，将地球重新划分为§m美§!§q德§!§e日§!三个超级大国的势力范围，各自牢牢掌控着自己的地盘。巨头强权彼此猜忌，唯恐对手暗中作梗，遂将所有可用手段摆上台面，在当代的惊涛骇浪中互相拆台。\n\n放眼昔日§O西§!§n葡§!帝国的腹地拉丁美洲，§m美国§!凭借地理优势和美元霸权一家独大。然而，它对美洲的控制已显松动。形形色色的理想主义者与政变策划者痛恨华盛顿的颐指气使，急于挣脱枷锁，却又迫不及待要套上新的锁链。\n\n正如当年的§H《托德西利亚斯条约》§!一样，总有一些国家垂涎这个已被瓜分殆尽的世界，渴望跳出来争夺自己的霸权。故事回到起点——§O伊比§!§n利亚§!半岛，昔日帝国的残躯如今再度联手，试图从灰烬中重铸旧日荣光。隔海相望，它们的逆子§K墨西哥§!与§n巴西§!也紧盯着邻国，盘算着自己的崛起之路。六十年代将成为群雄互相碰撞的舞台，而§O当代托德西利亚斯§!或许会同五百年前的初版一样，最终不过是一纸空文。§!"
