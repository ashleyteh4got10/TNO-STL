 KOR_Nam_Deok_u: "南德祐"
 KOR_Kim_Sin: "金信"
 KOR_Park_Chung_hee: "朴正熙"
 KOR_Choi_Kyu_hah: "崔圭夏"
 KOR_pro_Japanese_elements: "亲日分子"
 KOR_Nam_Deok_u_desc: "什么才能造就一个伟大而强盛的国家？南德祐的回答是“钱，钱，钱！无数的钱和腾飞的经济！” \n\n南德祐，他是怎样的人？看起来与民族性似乎有些距离，然而，他对于新生的大韩民国而言，其重要性毋庸置疑。南德祐以优异的成绩毕业于京城帝国大学经济学系，随后取得博士学位，他曾在朝鲜银行中工作，亦受邀前往东京帝国大学，成为一名杰出的经济学家。随着大东亚战争爆发与日本战败，他决心在重获独立的祖国开辟自己的道路。他以令人叹为观止般卓越的专业能力，很快便赢得中国官员们的信任，随后于崭新的民族国家中，代表众多资本家与经济精英的利益，登临总统宝座。\n\n现在，大部分人都认为，这片在炮火中化作废墟，曾依附于旧宗主国的半岛不可能迎来重生。不过若是这样想，那么从现在起将发生的事会十分有趣。南德祐将目光投向南京，聚焦于高宗武。他钦佩高宗武一夜之间将稻谷化作宝石的壮举，并相信自己也能做到——哪怕付出“些许牺牲”，也要将大韩民国打造成资本主义的伟大国家，就像当年日本治下的广东一般，成为熠熠生辉的亚洲新明珠。\n\n在总统办公室中准备就职演说的他，反复地低声念着一句话：“五年内，超越英国。”"
 KOR_Kim_Sin_desc: "他出生的时代充满了民族的痛苦与叹息。祖国在异国铁蹄下呻吟，他的童年被这黑暗的阴影压得喘不过气。然而，金信的心中仍燃着一簇火焰，那是对独立永不熄灭的渴望。他的心脏为韩民族的自由搏动，他的意志比钢铁更为坚强。\n\n年少时，金信便对自身的命运有所觉悟。他没有选择执笔，而是握住中国空军的操纵杆, 又在美国的航空学校中精进。他的航迹越过无数山川，向祖国的自由前进，如夜空中独自闪烁的明星，在俯瞰大地的飞机上露出微笑。紧随大东亚战争爆发，金信重返中国空军，这位受中国军人风趣称呼的“红围巾”，再一次与祖国的仇寇正面交战。\n\n金信眼中的火焰在日帝投降，祖国独立之后愈加炽烈——这次他决定退伍，以民间身份参加总统选举。他之所以能够成为新生大韩民国的总统，固然与身为金九之子不无关系，但他更相信是因自己一生的不懈奋斗使然。"
 KOR_Park_Chung_hee_desc: "朴正熙的一生充满了曲折，如果东京的股票交易者将他的生平画成曲线图，他们一定会惊讶得目瞪口呆。从一个普通农民的儿子，到成为满洲国的军官，那些贬低他的人，根本无法理解他为此而付出的时间和努力。声称他在满洲国过着舒适生活的蠢货们，根本不知道他虽然达到了朝鲜人能到达的最高位置，但却一直紧张地生活在四面八方的利刃威胁之中。在满洲国的傻瓜和东京的疯子之间，为了生存，他不得不做任何事情。\n\n当满洲国遭遇中国的进攻时，他预见了未来。朴正熙找到中国军队，提供所能提供的一切协助。他用如同献出肝胆般的举动，迅速赢得了中国军队的信任，成为日本关东军战俘的中间管理者。后来，当他的朝鲜半岛故乡被日本帝国抛弃后，他以“中华民国国军朝鲜人自卫队队长”的身份，投入到朝鲜占领区的行政工作中。\n\n然而，一如既往，他的民族再次令他失望。\n\n这些像蛆虫一样的家伙，即使日本把他们像狗一样抛弃，他们也仍然只盯着它们的旧主人，高喊着自己是皇国臣民。朴正熙对这些蛆虫般的人感到厌恶。\n\n看不到现实的家伙，必须被强迫看清前方，而他必须是那个让他们看清的人。\n\n所以，当那些愚蠢的旧帝国军人提议政变时，他如何不发笑呢？\n\n于是，他威风凛凛地站在讲台上，为了把这个病态的民族带上世界舞台，将‘民族心’塞进这些蠢货的嘴里。那些旧帝国军的傻瓜会反对他的改革，但他们闭嘴吧。因为这个大韩民国的统治者是他自己,\n\n§x只有他才能正确地引领这个大韩向前!§!"
 KOR_Choi_Kyu_hah_desc: "崔圭夏对于引起关注并不陌生,在满洲国吉林省，他一直是位能干的行政官员。对于居住在吉林省的朝鲜人来说，崔圭夏因与其他日本统治者截然不同而备受瞩目。在吉林省，他努力照顾自己昔日的同胞，因此在有“巨人的地狱”之称的满洲国中，唯有吉林省未堕入深渊。\n\n之后，大东亚战争爆发，随着满洲国被解放，他向中国军队投降。由于在吉林省的突出表现，中国方面任命他为朝鲜占领区内务部长。随后，在选定参加新民族国家之全面选举的朝鲜代表时，崔圭夏毫不犹豫地成为候选人，并最终入主总统府。\n\n尽管朝鲜半岛已获得解放，但朝鲜同胞依然怀念解放前的时光，停滞不前。这样的行为让我们的新主人——中国感到极大的不安。作为这个新生独立国家的总统，他不能忽视这一点。\n\n在当前形势下，领导这个国家并非易事。朝鲜人怀念旧主，中国感到忧虑，经济和基础设施都需从头开始建设。崔圭夏计划像在吉林省那样，保持他一贯严厉的态度来解决这些问题。最后，当一切结束时，是否放开手中的权柄，将由他自己决定。"
 
