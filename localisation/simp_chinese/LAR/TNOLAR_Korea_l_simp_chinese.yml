 KOR_LAR_failure_of_integration_idea:"“内鲜一体”的失败"
 KOR_LAR_failure_of_integration_idea_desc:0 "自1910年，大韩帝国与大日本帝国签订《日韩合并条约》，我们的国家和民族便被奴役鱼日本帝国的铁蹄之下。为了实现真正统治韩半岛的企图，阴险的日本帝国主义者曾推行宣扬韩民族与日本同宗同源的“内鲜一体”政策，实则大力输出日本文化，妄图将“把半岛人改造成忠良的皇国臣民”，实现“形、血、心、肉的一体”，达成彻底同化韩半岛的目的。然而想要消灭我们韩民族，绝非易事。数十年过去，被强制推行的日本文化不但没有取代韩文化，反与后者诞生出一个畸形的怪胎，扎根在韩半岛上。"
 
 KOR_LAR_Independence_under_the_white_sun_idea:"白日之下的独立"
 KOR_LAR_Independence_under_the_white_sun_idea_desc:0 "60多年过去，朝鲜虽在大选后获得独立，脱离了日本帝国的枷锁，但现实是：无人可以忘记如今的独立，是来自中国对半岛的解放。即使中国在官方立场上表示对于我们国家主权的尊重，其政治与经济影响力和庞大的军队是客观存在的。这导致我们的国家实际上处于中国的掌控之中，无论我们做什么，都需要时刻谨记中国永远能够用“解放者”的地位与强大的经济影响力在幕后影响我们的行动。\n\n由于“仰赖”中国的解放，迫使我们在表达自身主张的同时，必须谨慎地调整好“独立”与“忠诚”的天平，如此以来，白日之下的祖国方有繁荣之景。"
 
 KOR_LAR_Desolate_Han_River_idea:"萧瑟汉江"
 KOR_LAR_Desolate_Han_River_idea_desc:0 "就像曾经存在的满洲国与广东国一样，朝鲜数十年间的所谓“经济成就”，只是为日本本岛服务，与本土人民毫无关系。朝鲜人的受教育水平大多止于小学，堪堪胜任产业工人的职务；近乎所有的工厂和企业都为日本人所有，而它们已经离开这片土地，留下废弃的厂房与设备；朝鲜的资源曾被疯狂地采掘，再经由铁路，港口与公路流入日本的工业引擎……\n\n一言蔽之，今日的新生韩国徒有工业化的外表，而其内里，则是经济的完全崩溃，以及作为前殖民地延续至今的无数苦痛。"
 
 KOR_LAR_Thorns_on_back_idea:"芒刺在背"
 KOR_LAR_Thorns_on_back_idea_desc:0 "曾任伪满洲国军人的亲日派军官高木正雄——不，现在是朴正熙——据传正与其他亲日派军人密谋策划一项行动！这无疑令人费解，根据情报显示，朴正熙是第一批向中华民国宣誓效忠的满洲国军官，而中国方面对此人的忠诚毫无怀疑，因此部分人猜测这样古怪的密谋必有隐情。但不论如何，§e如果无法揭开这“传闻”的真相，某些人幻想中的景象或许将成为现实……!§!"
 
 KOR_LAR_Caeser_of_Korea_idea:"凯撒旧事，大独裁官"
 KOR_LAR_Caeser_of_Korea_idea_desc:"公元前49年，罗马将领凯撒违反禁令，率兵渡过卢比孔河，成为罗马共和国的独裁官。或许在如今执掌总统印玺的朴正熙看来，自己正是韩国的凯撒大帝。\n\n议会中那些低效，混乱，无能且争吵不休的议员们在枪口下学会闭嘴，在朴正熙无言的嘲笑中通过真正有益于韩民族的议案。至于那些鼓动政变的亲日分子，早已成为朴正熙向中国表现忠心的工具，逐个吃了子弹。也许，这反映出朴正熙内心深处最想隐藏的东西——无论是作为‘亲日派军官’的过往，还是曾经参与的一切，他都想要彻底否定，并从所有人的记忆中抹去。\n\n现在，朴正熙作为总统的权力是无限的。在他勾画出的蓝图中，韩民族必须，也只有彻底倒向中国，才可以重拾自己高贵的民族性，尽除倭人污秽，创造出远超殖民地时代虚假繁荣的经济奇迹。§x这就是韩半岛未来的样貌，没有什么比它更加重要。§!"
