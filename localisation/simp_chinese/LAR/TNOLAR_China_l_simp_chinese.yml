 #CHI_gao_zongwu:0 "高宗武"
 POLITICS_GAO_ZONGWU_DESC:0 "所有人生命中都有那个瞬间——站在十字路口，命运的齿轮开始转动，你只能选择一个方向，不回头地走下去，你每个能做出的选择，结果或许都会南辕北辙。于高宗武而言，广州那个雨夜便是命运齿轮转动之时。他当时正逐字逐句地推敲汪精卫所起草的中日条约，字里行间的细节之处让他不由得心头一怵。阴郁的情感交织在一起，在他脑海中横冲直撞；那是对导师与领袖的无限忠诚，亦是不甘中华民族蒙冤受辱的冲天怒火。他秉持的理想汇聚成滚滚洪流，将他染上形形色色的气质性情。他思考着，脑海如一口煮开了的大锅，肮脏的邪念在锅中翻滚，沸腾的浮沫涌了出来，变为对内心的质问：他，到底是什么人？\n\n高宗武咳嗽了一声。他面前有着无数种可能，但他的慢性肺结核还是占了上风，将他从纷纷扰扰的国际舞台上拉了回来，回到一个普通人的生活。高宗武想着，要是他选择继续当教授，永不过问时政，那该有多轻松啊。可或许，自他进入九州帝国大学求学那时起，便注定要与如潮水起伏般变幻的中日关系同呼吸、共命运。高宗武不顾自己的病体，接受汪精卫的邀请，加入他的外交使团。高宗武对自己的工作十分得心应手——毕竟，他说得一口流利的日语；一名与他打过交道的同僚说过，他的日语天赋比绝大多数土生土长的日本人还要强，这不过是奉承之词，但高宗武的个人魅力毋庸置疑。\n\n高宗武游走于两个不同民族的楚河汉界之间，他内心深处，仍深爱着他的祖国。他敬仰孙中山，坚信汪精卫会继承总理遗志，将国父的理想发扬光大。汪精卫没能活到这一切实现的那天，周佛海和陈公博也接连下台；现在，轮到他坐上总统宝座。高宗武时常想起广州那夜——世界会怎样天翻地覆！\n\n他明白，历史已成定局。唯一能做的唯有紧握当下，弥补过错。"
 POLITICS_GAO_ZONGWU_POSTWAR_DESC:0 "千年荏苒，在吴越故地还是重演了春秋旧事，昔日臣服的弱者再一次对征服者发起了决死的复仇。\n\n神州陆沉后三十年间，高宗武以无比激进的现代化为中华民族重塑了新的脊梁，并与一众心怀逐日鸿志的反抗者并肩而战，砸碎了共荣圈之主的虚幻王座，让中国乃至亚洲人民迎来了新一轮的民族解放。现在，他端坐庙堂之上，享受着无尽的歌颂，成为了所有人昂首难及的存在。高宗武已经在中华民国总统这个位置上呆了太久太久，他眷恋着权力的滋味，而凭借着声望和功绩，在可以预见的未来之中，亦无人能望其项背。\n\n但立于群峰之上，亦有狂风呼啸，数十年光阴过去，时近古稀的身体早已积劳成疾，总统深知那终末之时的回响正步步逼近……\n\n§R假若国家失去他掌舵多年的舵手，他的人民又将何去何从呢？§!"
 
 CHI_Tao_Xisheng_hog:0 "陶希圣"
 CHI_Tao_Xisheng_hog_desc:0 "§Y行政院院长\n家长制§!\n----------------\n当中国的现代化计划尚处草案阶段时，陶希圣便看中了由国家强力主导的统制经济，长久以来作为高宗武最得力的助手伴随左右。\n\n十余年之间，藉由“维新派”，这群精明强干的技术官僚们，再辅之以绝对的政治地位，中国的面貌翻天覆地。再没有人敢说中国是一个贫弱又落后的国家，中国头脑们创造出无数新技术，电力，自来水与道路亦如蛛网般放射开去……从东海之滨到西北大漠，从北疆林海到南洋群屿，现代化之火正狂野地燃烧着，中国的地平线上笼罩着无数工厂的滚滚烟尘。在陶希圣于总统府中的茶余饭后，或许偶尔会担心南京城愈加糟糕的空气质量。但放眼举国之间，许许多多的中国人，早将自己与煤炭一起铲入了高炉之中……"
 CHI_Fang_Xianjue:0 "方先觉"
 CHI_Fang_Xianjue_sec:0 "方先觉"
 CHI_Fang_Xianjue_sec_desc:0 "§Y国防部长\n家长制§!\n----------------\n如履薄冰，这或许就是方先觉后半生的写照。战争结束后，他每晚都会梦到衡阳，梦到那尸横遍野，梦到那残垣断壁，每每梦到这些都会让他惊醒，他不止一次觉得如果他和他的战友们死在衡阳那该多好啊。\n\n死者不会复生，而活着的人将带着他们的意志前行，军队的民族派领袖方先觉，他提拔少壮派，主张革新，对训练严格，对士兵关心。在明面上，他是军队中的激进派领袖，对待任何人不偏不倚，依法惩处，就连日本人都赞叹有周亚夫军细柳的影子。可这一切，对于方先觉来说不过是为了一次孤注一掷，一次让他重新再来的资本。了却君王天下事，赢得生前身后名，如今，他走上了台前，带着他培养了半生的资本，一支崭新的“第十军”，来到了新的“衡阳”，但这一次，他将率领这支民族之师，血洗百年民族之耻。"
 CHI_Shen_Changhuan:0 "沈昌焕"
 CHI_Shen_Changhuan_for:0 "沈昌焕"
 CHI_Shen_Changhuan_for_desc:0 "§Y外交部长\n民族自由主义§!\n----------------\n“外交教父”，“民国外交部真正的操手”，“民主主义者”，这些头衔对于沈昌焕而言没有任何意义，他是一个对自身理想不加掩饰的人：实现一个独立的自由民主的国家。\n\n1947年之后，沈昌焕失去了进入国民党权力中心的贵人蒋介石，随何应钦来到贵州，帮忙维系贵州和南京之间脆弱的联系。如果不是得高宗武相助，他可能得一直待在贵州小小的联络部里度过余生。借着高宗武与陶希圣的赏识，他终于有机会在南京大展拳脚，不久便成为了民国最年轻的副部长，以明面高派三把手的身份进入中央。而在高宗武坐稳总统府后，外交部除决策权为陶希圣，其余则全归沈昌焕来操作。二十年磨一剑，他很清楚接下来将会面对什么：在做好自己能做的所有工作后，义无反顾的和高宗武陶希圣他们去疯狂，既为知遇之恩，亦为民主理想。"
 CHI_Sun_Yaodong:0 "孙曜东"
 CHI_Sun_Yaodong_eco:0 "孙曜东"
 CHI_Sun_Yaodong_eco_desc:0 "§Y财政部长\n贵族保守主义§!\n----------------\n“十里洋场，如梦如幻”，孙曜东，他富比陶朱，他与党国要人为伍，与大奸巨憝为邻，他的人生就和上海一样，既有自由一面，亦有浮萍的一面，如痴如醉，不得清醒。\n\n他是金融财阀，纸醉金迷；他是达官显贵，周佛海秘书，三十年腥风血雨，潮起潮落，这一切仿佛都和他没关系，他宛如一个不倒翁，站在权力的中心，哪怕他的老上司周佛海倒下，对于他也几乎没有什么影响。手眼通天，他在金融的势力已经是树大根深了，仿佛只要有他掌控经济，无论是如何的风波，危机，都无法将他吹倒。而如今，这位花甲老者来到了财政部长的位置，用他过去一直屹立不倒的身躯，为这个国家的经济保驾护航。"
 
 GAN_seihoku_council:0 "西北临时军事委员会"
 POLITICS_SEIHOKU_COUNCIL_DESC_XIBEI:0 "旭日在共荣圈的军事权威出现了一丝裂痕——日本帝国陆军第一次在东亚被后发国家击败了。陆军愤怒异常，很多人叫嚣着要彻底踏平西北之地，甚至是焚毁这些敢于反抗的忤逆之人：也包括坐在南京的那个笑面小丑。\n\n但结局就是这样了，日本人在战场上得不到的，谈判桌上也得不到，不断的妥协后，日本保住了这一方“军管地”，但代价是，马家军要无条件服从中央政府，这就变相的承认了西北匪寇的无罪。\n\n日本咬着牙接受了这份协定，但所谓的军管只是一种临时停战，西北将会被打造成切入中华民国腹地的毒钉——既然战争无法避免，那就在它爆发时更猛烈些。\n\n§x这些野兽誓要洗刷自己身上的耻辱，无论手段如何。§!"
 POLITICS_SEIHOKU_COUNCIL_DESC_NINGXIA:0 "旭日在共荣圈的军事权威出现了一丝裂痕——日本帝国陆军第一次在东亚被后发国家击败了。陆军愤怒异常，很多人叫嚣着要彻底踏平西北之地，甚至是焚毁这些敢于反抗的忤逆之人：也包括坐在南京的那个笑面小丑。\n\n但结局就是这样了，日本人在战场上得不到的，谈判桌上也得不到，不断的妥协后，日本保住了这一方“军管地”，但代价是，马家军要无条件服从中央政府，这就变相的承认了西北匪寇的无罪。\n\n日本咬着牙接受了这份协定，但所谓的军管只是一种临时停战，宁夏将会被打造成切入中华民国腹地的毒钉——既然战争无法避免，那就在它爆发时更猛烈些。\n\n§x这些野兽誓要洗刷自己身上的耻辱，无论手段如何。§!"
 
