 CHI_LAR_The_Constitution_law:0 "£GFX_LAR_CHI_national_emblem_texticon §R民国四十一年宪法§!"
 CHI_LAR_japchi_relations_agreement_law:0 "£GFX_GNG_japanese_frustration_texticon §j日§!£GFX_GNG_chinese_texticon §M华§!新关系调整协议"
 CHI_LAR_land_reform_law:0 "£GFX_LAR_CHI_agricultur_reform_texticon §B农村土地改革法§!"
 CHI_LAR_GNG_Autonomy_Agreement_law:0 "£GFX_GNG_Guangdong_texticon §S广东自治协定§!"

 CHI_get_law_tooltip:0 "[GetAssortedLawsDescCHI]"
 CHI_LAR_The_Constitution_law_desc:0 "§W刚刚成立时，£GFX_LAR_CHI_national_emblem_texticon §R改组国民政府§!也曾大力鼓吹即将实行宪政。§Y汪精卫§!这样做不是因为他是民主宪政的忠实信徒，只是急于宣布完成了先总理的§M“民权主义”§!，自己是先总理的唯一正统继承人，以维护自己的独裁统治。§R大东亚战争§!落下帷幕后，£GFX_LAR_CHI_national_emblem_texticon §R改组国民政府§!军政合一的§s战时体制§!仍然还在持续，受不了高压统治的民众奋起反抗£GFX_LAR_CHI_national_emblem_texticon §R改组国民政府§!，要求立即结束§s战时体制§!，结束§s训政§!，开启§M宪政§!。在镇压民众失败后，为了维持自身统治的£GFX_LAR_CHI_national_emblem_texticon §R改组国民政府§!不得不让步，逐步结束§s战时体制§!，开启§Y制宪国大§!。\n\n民国四十一年，也就是1952年，£GFX_LAR_CHI_national_emblem_texticon §R改组国民政府§!在国民大会上宣布：基于1936年的五五宪草，制定并通过了[CHI.GetFlag]§M中华民国§!的第一部宪法。但拥有宪法并不意味着中国就此走上了民主共和的道路，§Y真正的“民权主义”究竟哪天能实现，没有任何人知道。§!§!"
 CHI_LAR_japchi_relations_agreement_law_desc:0 "§W一、£GFX_GNG_chinese_texticon §M[CHI.GetName]§!承认£GFX_MAN_manchukuo_texticon §O[MAN.GetName]§!的主权存在与领土完整。\n\n二、为帮助£GFX_GNG_chinese_texticon §M中国§!维持治安稳定与防共，£GFX_GNG_IJA_riots_texticon §q日本帝国陆军§!可在§e蒙疆§!和§e华北§!地区§R永久驻扎§!，并获得§Y青岛、海南、威海卫§!等地区的驻屯权，其他地区可驻扎至治安完全确立。\n\n三、[JAP.GetFlag]§e大日本帝国§!可优先获取[CHI.GetFlag]§M中华民国§!境内战略性物资的开采权，同时，[CHI.GetFlag]§M中华民国§!的工业、财政、金融、贸易、关税、交通、运输等各方面都必须接受[JAP.GetFlag]§e大日本帝国§!的“援助”。\n\n四、§e日本驻华大使§!可代表£GFX_jap_govt_stability_texticon §C日本政府§!与£GFX_LAR_CHI_government_texticon §W中国政府§!商谈重大事务。£GFX_LAR_CHI_government_texticon §W中国政府§!及其直属机关须要聘请§e日本顾问§!，华北政务委员会须要设置§e日本联络专员§!，在必要时§e日本联络专员§!可派至地方省、市政府提供“服务”。\n\n五、£GFX_LAR_CHI_mil_progress_texticon §Q中国最高军事机关§!应当聘请§e日本军事顾问§!，成立£GFX_counter_intelligence_JAP §R最高军事顾问团§!，“指导”[CHI.GetFlag]§M中华民国§!完成国防建设，£GFX_LAR_CHI_mil_progress_texticon §Q中国军队§!的调动、建制变动等军事活动需要“咨询”£GFX_counter_intelligence_JAP §R最高军事顾问团§!。§!"
 CHI_LAR_land_reform_law_desc:0 "§W§V共产主义§!对农村的侵蚀一直是与£GFX_LAR_CHI_government_texticon §W南京国民政府§!迫在眉睫的头等威胁，£GFX_LAR_CHI_Communist_Party_texticon §V共产党§!的土地政策对农民有着强大的吸引力，逼迫£GFX_LAR_CHI_government_texticon §W南京国民政府§!不得不§Y在1955年对自己的土地政策做出改革§!。\n\n£GFX_LAR_CHI_government_texticon §W南京国民政府§!要求购买地主的土地，希望他们将获得的资金投入£GFX_LAR_CHI_industry_reform_texticon §L工业领域§!。同时，£GFX_LAR_CHI_government_texticon §W国民政府§!将收购的土地分给£GFX_LAR_CHI_agricultur_reform_texticon §B佃农§!并签订协议：佃农§Y需要将每年的37.5%的收成或等价货币上交给政府，如此不间断10年后即可获得土地的所有权。§!\n\n§R然而，政策的结果却去预期相违。§!£GFX_LAR_CHI_government_texticon §W南京政府§!对地方的控制力微乎其微，只有§Y南京§!及其§Y周边地区§!真正推行了£GFX_LAR_CHI_agricultur_reform_texticon §B改革政策§!，其他地方几乎没有一点进展；即便有地主选择合作，他们获得资金后并没有£GFX_LAR_CHI_industry_reform_texticon §L投资工业§!，而是§Y继续低价收购其他农民的土地，继续曾经的地主生活§!；§R即便有农民获得了土地，当地部分官僚会与地主勾结，在农民因变故没有能力还款时强行终止协议，收回土地使用权，让土地再回到地主手里。§!§!"
 CHI_LAR_GNG_Autonomy_Agreement_law_desc:0 "§W为促进£GFX_LAR_CHI_CPS_texticon §e共荣圈§!之经济共荣、£GFX_GNG_japanese_frustration_texticon §j日§!£GFX_GNG_chinese_texticon §M华§!经济合作，[CHI.GetFlag]§M中华民国§!特设立高度自治之£GFX_GNG_Guangdong_texticon §S广东自治区§!。£GFX_GNG_Guangdong_texticon §S广东自治区§!以粤人治粤，有独立之司法、立法、行政权力。允许其建立独立的£GNG_police_texticon §Q警察系统§!以维持治安，并邀请进驻广东的企业和日方的行政官员进驻£GNG_legco_texticon §S立法会§!和£GFX_GNG_Guangdong_texticon §S政府§!提供意见。§!"

