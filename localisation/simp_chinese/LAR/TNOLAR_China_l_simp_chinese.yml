 tnolar_chi.205.t:0 "新的一天" #通用
 tnolar_chi.205.d:0 "不到早上六点，刘金福就从他们休息的帐篷里走了出来——他一直习惯早起，刚一到外面，西南清晨的湿冷寒风就令他不禁打了个寒战，“这该死的地方可真冷啊！”他在心中暗暗说到，随即从口袋中掏出一包香烟，在确认没有受潮之后，便点着香烟，靠着一棵树抽了起来。此时太阳还尚未升起，整个工地还沉寂在朦胧的夜色之中，为西南的原始群山增添了几分现代文明的亮色。\n\n刘金福望着眼前的山景，不由回忆起昔日生活过的村子，那里也不算很远，记得就在重庆附近的什么地方，40多年前，他就是在那里出身的……童年时候的美景再度浮现眼前——在那个与世隔绝的村子中的，清贫而平凡的生活……\n\n可是有一天，一切都变了，他记得是1942年，他当时才6岁，一群穿着军服的人开着卡车进了村子，说是要抓壮丁，那时他还小，不是很明白发生了什么，只知道自己的哥哥和父亲穿上和那群人很像的衣服，走了，再也没有回来……母亲之后整日哭泣，他同样不知道为什么，只能抓着母亲的衣角一同啜泣。然后，又过了两年……\n\n烟云从嘴里缓缓地吐了出来，他突然收住思绪，不再回忆，他也不想回忆那天的事情，虽然他也不记得多少——印象中只有巨大的轰鸣声从头顶传来，天空中有什么东西不断落下，巨大的火焰吞噬了农田和群山，远处的重庆城更是一片火海，人们在哀嚎，奔走，奔走，不断的奔走……\n\n就在这时，上工的铃声从工地的中心响起，他随即掐灭香烟，走回帐篷，对着仍在睡觉的工友喊道:“喂！伙计们，赶紧起床吧！该上工了！”他叫醒工友，向着工地的方向走去。\n\n“我说，老刘，你今天怎么回事，从起床开始，你就心不在焉。”他正走在前往施工点的书上，他的工友一边摆弄手中的翻轨器往前走，一边对刘金福小声说道，“你是不是，又想起大轰炸的事了啊。”\n\n刘金福没有说话，只是望了他一眼，便继续沿着蜿蜒向前铁路往前走去。\n\n“唉，不用你说，我也知道，你每次回想起那件事，总是这么一副表情。”工友苦笑了一声说。“那真是一场灾难，后来……唉，你也知道，就变成这个样子了……”他不禁长叹一声，一边看向刘金福。\n\n话音刚落，他们就走到了施工点，刘金福只是说到：“还是先干活吧。”说完便抄起工具，从昨天结束的地方继续干起。\n\n工友摇了摇头，对着他的背影说了最后一句话：“反正，终有一天，一切都会结束的，"
 tnolar_chi.205.a:0 "不是他们，就是我们。”"

 tnolar_chi.206.t:0 "总有一天" #西康是傀儡
 tnolar_chi.206.d:0 "宋立军觉得自己是个幸运的人，在这个该死的世界里绝对如此，不仅仅因为他曾是旧国民革命军的一员，居然没在当年的战争中牺牲，更因为他居然能逃离战后几年的大追捕，还因为，他居然能活到今天，还在如今的军队中某得一官半职。因此，他对自己捡来的这条命总是感到惊奇，为了回报这意料之外的好运，他早就决定要安安稳稳的度过后半生，绝对不愿生事，比如他就希望这次普通的勘探工作可以顺利……就在他这么想时，卡车轻微一晃，代表他们已经到地方了，于是他走下车，面带笑容地面对将要与他们合作西康勘探队……\n\n可当他刚看清对方，脸上的笑容便早已僵住了，随即便转为忧虑，如果他们的地图正确，那显然这里便是这只西康军方勘探队的驻地，但是要说面前这些人便是西康勘探队的成员的话，他就不敢苟同了。在他面前的是逐渐聚拢过来的百来名男女，从他们的衣着可以勉强认出那是一种制服，但是泥土，灰尘与补丁早已让那些衣服面目全非了，他们无不好奇而又诧异的望向从十几辆卡车上鱼贯而下，全身上下笔挺如新的人们。\n\n宋立军的视线又转向他们的营地，那处由几十顶破损帐篷覆盖着的山顶平地，要说这里是流亡灾民的暂住地也绝不为过。\n\n“看来这次的任务，不会那么轻松啊。“他在心中叹道。\n\n”我想，你就是来跟我们合作的人的头儿吧。”一位中年人向他走来，虽然看着与他，年岁相仿，却是面色蜡黄，头发花白。那中年人走近后继续说道“我是这边的领队……啊，你不必客气，叫我老李就行了。”来人见宋立军正准备敬礼，连忙补上后面的几句话。\n\n“你看看，我手下的这些乡巴佬，一看到你们这些人，连嘴巴都合不拢了，哈哈，算是让他们见见世面喽。”老李转头看向自己身后的那一群依旧在不断围拢的人群，一边说着一边抽出一支烟。\n\n“瞧瞧你们的家伙，都是小鬼子的高级货，我们队里的几个年轻小伙子估计要有点意见，他们几个提起日本就来劲……”说着他便走进一辆卡车，仔细打量着车里的各种装备“唉，但是这些东西，比我们用的几十年前的旧货好多了啊。”\n\n“啊，上级嘱咐过，如果你们需要，这些都是可以留给你们的。“听见老李的感慨，宋立军连忙上前提议。\n\n“嗯，嗯，那样是很好啊，只是但愿有一天，这些都能是我们自己的啊……”老李一边说着，眼神却依旧停留在日本公司的标签之上。\n\n宋立军听罢，望向不远处的人群，和他们背后的营地，以及更远处的连绵群山……缓缓说到："
 tnolar_chi.206.a:0 "“总会有那么一天的，总有一天……”"

 tnolar_chi.207.t:0 "总有一天" #西康不是傀儡
 tnolar_chi.207.d:0 "宋立军觉得自己是个幸运的人，在这个该死的世界里绝对如此，不仅仅因为他曾是旧国民革命军的一员，居然没在当年的战争中牺牲，更因为他居然能逃离战后几年的大追捕，还因为，他居然能活到今天，还在如今的军队中某得一官半职。因此，他对自己捡来的这条命总是感到惊奇，为了回报这意料之外的好运，他早就决定要安安稳稳的度过后半生，绝对不愿生事，比如他就希望这次普通的勘探工作可以顺利……就在他这么想时，卡车轻微一晃，代表他们已经到地方了，于是他走下车，面带笑容地面对将要与他们合作西康军队：“你们好，我是……”只是，他话说到一般就被打断了。\n\n“哟，民国的大爷们来了啊?”面前的士兵中传来一声戏谑，不禁让他皱起了眉头。就在这时，人群中站出一个人，似乎是这群人的长官，看起来很年轻，他用鄙夷的目光看着他眼前的人，冷冷地说：“显然，你们就是我的长官命令我在这次勘探工作中合作的人，很好，你是这些人的长官是吧，跟我到这边来，我们来谈谈我们工作的细节。”他的语气显然缺乏热忱，还带着毫无疑问的轻蔑，不过或许，在他看向他们整洁的军服和保养精良的器具时，还有那么一丝的……羡慕？在宋立军跟着那人往前走的时候，总是能感受到周围人投来的绝不友善的目光，让他浑身不自在，不过他并没有表现出来。\n\n“如果不是上级的命令，我是绝对不会愿意跟你们这些人合作的。可是很可惜，军令如山……”那人继续没好气地说。\n\n“我希望我们能逐渐消除彼此的隔阂，毕竟未来几周，我们都要在一起工作，我相信我们对于中华民族……”宋立军的话说到一半，又被打断了。\n\n“事到如今，还谈什么民族啊，哼，中华民族……”前面那人闷声说道“好了，我们到了，您先请。”他指着眼前一座帐篷的入口说到。“我也不会把你们怎么样，这是毕竟工作，我能做的就是好好合作，至于消除隔阂，我可不敢保证。”\n\n宋立军走进帐篷，在进去的一瞬间，他用没人听的见的声音默默地叹了一句："
 tnolar_chi.207.a:0 "“兄弟阋墙啊……”"

 tnolar_chi.208.t:0 "大渡河畔"
 tnolar_chi.208.d:0 "第二次世界大战并没有使世界的每个地方都发生巨变，比如这个中国西南深山中大渡河边的小村，纵使外界枪林弹雨，这里的生活并没有发生太大的变化。\n\n但就在最近一段时间，这里的生活似乎真的要发生巨变了。村子旁边修了一条公路，那路通到山里边，通到一个被铁丝网封起来的山谷里。每天都有数不清的大卡车拉着满满的东西进去，空着出来，车队像河一样昼夜流个不停。那些东西都用绿色的篷布盖着，或装在大箱子里，不知道是什么，但它们要是堆起来，怕也有村后那座山高了。有时还有那种顶上转着电扇的飞机飞进山谷，下面吊着个什么东西，飞出来时那东西就没了。\n\n就这样又过了好几天的时间，村子里来了一些穿着制服，戴着头盔，手里拿着奇怪的仪器的人，他们在河边走来走去，不时摆弄一下手中的仪器，然后交谈几句，便出发到下一个地点。没人知道他们在做什么，即使是村子里德高望重的老人也只是摇摇头表示不解。于是，就这样又过了几周，村子里又来人了，他们是从那个被铁丝网封起来的山谷里来的，他们从来时乘坐的卡车中卸下许多看起来像是建筑工具的东西，开始用铁丝网封锁通往山里的公路。然后，一个看起来像是他们的头的人走向围观的人群，对他们说到：“乡亲们，从这条路往上，是政府所有的重要设施，你们绝对不得擅自闯入，明白了吗?”村民们并没有什么反应，只是茫茫然的面面相觑，然后随口答应——反正那里平时也没什么人会去，至于拉起围栏封锁的公路上竖着的那个指示牌，村子里也没几个人能看得懂，那上面写道："
 tnolar_chi.208.a:0 "“泸定县水电站”"

 tnolar_chi.209.t:0 "往日之影"
 tnolar_chi.209.d:0 "春生今年就要10岁了，生于西南大山中的他几乎终其一生都要在这里过着平静无波的日子，对他而言，整个世界不过是山脚下流过的大河，村前村后的群山，以及身边几十户淳朴善良的人家。\n\n但是，不论如何，他的心中还是有足够的好奇心，比如对于他的爷爷——爷爷几乎从来没有下过屋子里的那张床，虽然他倒是知道这是因为爷爷的小腿不见了，可是这又是为什么呢?自打他记事起爷爷的腿就是那样了，即使他问起，也从来没有人告诉过他原因，大人们只是叹一口气，然后对他说以后他就会知道的，可是以后又是什么时候啊?这他同样不知道。而且，爷爷每天晚上都会很晚才睡觉，他总是在床上半坐着，拿着一些他不知道的东西，再时不时的发出一两声轻微的叹息……那究竟是什么东西啊?\n\n不过现在，生活要发生一点变化了。就在前几天，村子里来了很多穿着奇怪衣服，还带着圆帽子的人，他们拉来了许多奇奇怪怪的玩意，拉起来几根线，然后就点亮了一个叫灯泡的小玻璃球。看到这近乎法术一样的新鲜玩意，几个孩子顿时欢呼雀跃，这种突如其来的新闻属实为他们平淡的生活增添了意想不到的乐趣。\n\n于是，春生便也有了他自己的计划，就在他们家通上电灯的那一晚，他悄悄的溜到电灯开关的附近，然后……\n\n“春生，你又溜过来了。”从房间另一头的黑暗处传来爷爷的呼唤。\n\n“爷爷，不是……我……”一听到这句话，春生一如既往地语塞了，呆呆地站在原地，等待着被叫回去睡觉。\n\n可是，他并没有被叫走，他听见爷爷继续说道：“把灯打开吧，有些事情，你早晚都要知道，你马上就十岁了，也可以告诉你了。”\n\n春生拉动开关，房间顿时大放光明，只见爷爷坐在炕上，用和蔼的笑容示意让他过来，然后从枕头底下拿出一个小包，放在床头，他缓缓的打开那个小包，掏出里面的物品，那是几张照片和一些纸张。春生拿起一张照片，看着照片上的小字，磕磕绊绊的读到：“一…九…三……八年……三月……二十七……日……于……于……爷爷，这后面几个字，我认不到。”\n\n“于台儿庄。”爷爷缓缓的说。\n\n“那是，什么地方啊?我从来没听过。”春生一脸困惑的望向爷爷。\n\n“你会知道的，那是个离这里很远很远的地方，也是一段很远很远的故事……我现在就讲给你听……”爷爷摸了摸孙子的头，让他坐到身边，开始向他讲述那一段四十年前尘封的往事……周围万籁俱寂，除了偶尔从窗外传来的虫鸣鸟叫和轻柔的江水之声外，便只有爷爷那苍老，缓慢的声音，在昏黄灯光的照射下，传递着那久远的记忆，它在新一代人的心中永远回响，如同那永不停息的滚滚江水……"
 tnolar_chi.209.a:0 "长夜终将迎来光明……"

 tnolar_chi.210.t:0 "学堂与县衙"
 tnolar_chi.210.d:0 "在沈明看来，从成都一路到义敦的旅程绝对称不上是愉快，甚至可以称作是一种折磨，先是在人挤人的狭小客车中一路开往边界，然后又在边检站阴冷潮湿的环境中等了将近4个小时，虽说现在西康省与中央政府的来往愈加频繁，但每次的入境流程还是一件繁琐的工作，在入境之后，他又不得不在群山中来回穿梭——虽然道路翻新和完善的工作已经开始，但很多地方还是当地人千百年来踩出来的土路，再加上这几天阴雨连绵，等他抵达义敦时，他已经是灰头土脸，狼狈不堪了。\n\n“妈的，要不是因为他们说所有自愿到西康援助的职员都将涨整整一倍的薪水，我打死也不会跑这一趟的。”刚抵达旅馆房间的沈明还没坐下就对着空气小声骂道。\n\n“不过总之，我还是先去政府报道吧，希望那里不算远。”他心里这么想着，匆匆收拾了一下证明文件便离开了旅店。\n\n此时的沈明正站在他以为是县政府的双层水泥建筑前，但是，他显然搞错了，这里不可能是县政府，因为三五成群的孩童正在门口进进出出。他看向大门口上方的门牌，上面赫然写到：义敦县小学。\n\n就在他困惑的时候，他听见身后传来一声叫唤：“年轻人，你是呆站在这里做撒子啊？”他转头望去，看见那是一位当地的老人，正用关切的目光望向他，于是，他像找到了救命稻草一样急切地问道：“那个，大爷，我想问一下，请问您知道去县政府的路怎么走吗？”\n\n“哈哈，年轻人，俺就知道，你们外地人就是会搞糊涂，”那位老人发出憨厚的笑声，用沙哑低沉的嗓音说道，“我带你去吧”。\n\n没有一会儿，他来到站在真正的县政府门口，却更加的困惑不解，在他面前的是一座破败不堪的单层土房，但这显然就是县政府，因为钉在门左侧的牌子上显然是“义敦县政府”几个字。\n\n“老人家，你们在怎么学校这么好，县政府这么破旧啊？按理来说官员不应该先把钱花到自己身上吗？”\n\n老人家一看见他的表情便哈哈大笑：“瞧瞧你，困惑成这个样子，这个啊，是我们刘主席的命令，刘主席说了，如果县政府的房子比学校好，县长就地正法！所以啊，县政府就被‘贬’到这里来啦。”"
 tnolar_chi.210.a:0 "啊？"

 tnolar_chi.211.t:0 "终得一夜闲"
 tnolar_chi.211.d:0 "夜晚的总统府一向十分寂静，但这并不意味着这里停止了日常的工作，实际上，夜晚的总统府有时会更加忙碌，至少根据警卫的描述，几乎从来没有人见过子超楼二层的灯光有熄灭的时候……\n\n“把这份稿子交给日报，要求他们后天印在头版上。”高宗武说着拿起办公桌上的一张文件递给了秘书。\n\n“之后不用再跟我回报了，就这点事，你肯定办得好……”\n\n“是，总统阁下。”\n\n秘书刚一离开，高宗武就往身后的椅子上一靠，缓缓合上双眼，长促一口气，轻轻叹道：“上次像这样放松下来，不知道是什么时候了……”至少是几个月前了，他心想，印象里自从他命人把床铺搬到自己的办公室，他还没有怎么用过，那至少是几个月前的事了。\n\n“至少今晚，我总该休息一会了。”他自言自语到，随即便缓缓起身，走到了办公室墙壁上的那一副中国地图前，眼睛死死的盯着它。就在昨天，这幅地图才刚刚挂起——将西康省完全并入了原先的地图之中……只是，这一小步距离迈向那一片完整的秋海棠叶，还有很长很长的路……"
 tnolar_chi.211.a:0 "又一块拼图到位了。"

 #山西

 tnolar_chi.220.t:0 "邀请傅作义"
 tnolar_chi.220.d:0 "南京，总统府门外，轿车的门被缓缓打开，一位身子还算硬朗的老人走了下来。\n\n老人的脸上千沟万壑，凝结了三十年风霜的皱纹肆意地蔓延，一直伸展到脑后的白发旁。\n\n老人向四处望了望，发出了一声难以被人察觉到的叹息。\n\n事实证明，高宗武的现代化建设是卓有成效的，现在的南京早已不是当年的南京。傅作义想到——可他也没有忘记，南京城下，还有三十万无名厉鬼……\n\n刹那，老人的目光怔住了。\n\n他注意到了总统府上的青天白日旗，或许整个南京都发生了翻天覆地的变化，但这面旗帜还在这里飘扬。然而，住在这座府邸里的高宗武，他究竟配不配得上它?\n\n但是，老人紧接着反应了过来，旗帜上还有一排“和平建国”的小字，他的脸也迅速阴了下来。随后，走进了总统府。\n\n傅作义清楚地知道，高宗武收回晋陕桂三省的行动是经过日本人允许的，所以在接下来的公开会谈里，他将惜字如金——而糊弄完媒体之后的秘密会谈才是重头戏。\n\n“傅作义将军，您好。”高宗武面带微笑着伸出了手。"
 tnolar_chi.220.a:0 "“您好，高宗武阁下。”"

 tnolar_chi.221.t:0 "秘密会谈"
 tnolar_chi.221.d:0 "傅作义将军，我需要您的帮助。”高宗武的双眼紧紧注视着傅作义。“如果中国不能形成一个强而有力的整体，那么我们就根本不可能把日本人逐出中国。1936年的统一战线的失败就是如此。所以，山西和陕西能否回归中央？”\n\n傅作义闭上了眼睛，回想起了那段难以启齿的往事……\n\n当年的晋绥军，那也是有着精良装备的虎狼之师，可是面对日军的猛攻，太原最终沦陷。原本，我可以说服阎长官坚持下去，我们的后方好歹还有共产党的武装，但是，但是……\n\n日本鬼子最终还是占领了中国。\n\n而他和阎锡山却苟且偷生，三十年，三十年啊!\n\n他欠中国人民欠得太多了。\n\n终于，傅作义睁开了眼。\n\n“高宗武先生，我相信你能负得起责任，我同意两省回归。”傅作义紧紧盯着高宗武。“为了大东亚战争，我傅宜生定当全力而为!”\n\n“谢谢您，将军!”高宗武终于笑了。"
 tnolar_chi.221.a:0 "“我说，我们什么时候才能把国旗上的‘和平建国’撕下去啊？”"

 tnolar_chi.222.t:0 "手握钢枪"
 tnolar_chi.222.d:0 "“阁下，我得说明一点，你收回山西和陕西面临的最大阻力从来不是我傅作义。”傅作义顿了顿。“而是在两省的土地上作威作福的日本人，他们的特务无孔不入，你想瞒着他们秘密收编我手底下这群老兵油子，难度很大。我傅宜生可以帮你整顿我手底下的老丘八，但对付鬼子只能靠你，别让我感到失望。”\n\n秦晋两省名义上回归中央已经过去许多天了，我们派过去的军官发来了一份又一份电报，报告秘密收编任务的进程。事实证明，傅老将军的担忧并不是空穴来风，我们必须在明面上遣散他大部分的旧部，只留下少量士兵作为安保部队。\n\n不过我们要知道，晋绥军——或者叫晋秦军，他们可是身经百战，涿州硬扛张学良、中原鏖战国民党、陕北较量土G匪、太原猛击东洋狼。我们怎么可能放弃这支力量?所以，我们会把他们也纳入秘密军队。相信经过整体的训练和爱国主义改造后，我们能把这群老兵油子变成攻无不克战无不胜的精锐之师。\n\n想到这些后，高宗武走到窗台前，望向奔涌向前的扬子江，不禁微笑了起来。"
 tnolar_chi.222.a:0 "“傅老将军，我不会让你失望的。”"

 tnolar_chi.223.t:0 "大同煤矿"
 tnolar_chi.223.d:0 "“哗啦”，老张干净利落地将铁锹里的煤倒进推车里，又用脏兮兮的胳膊抹了抹额头上的汗，紧接着又跑回阴暗狭窄的矿洞。\n\n“妈的，”新来的小冯使劲地敲下了几块石头后，一屁股摊在了煤渣堆里。“你们大同煤场一直都这么累吗？”\n\n“知道你是新来的，额也不太为难你，但你可要知道，煤矿就是如此，你哪怕死了也不会有人管你。也许额们脚下，就有一位倒下的矿工。”老张瞟了他一眼，说道。\n\n听到这话，小冯叹了口气，又站起来继续抡锹。\n\n“张哥，你叫什么名字，在这干多久了?”小冯问道。\n\n老张笑着摇了摇头。“额也不知道额叫什么名字，那太久远了，你让一个奔六十使劲的人回忆小时候，那太为难额哩。不过额记得额大概来这干了四十年哩。当初额爹走西口哇，在兴安生滴额，但是额十几岁的时候，额爹亏本被仇人追杀，额就自己流浪多年跑回了大同当童工。后来鬼子打下了中国，额的部队解散，回家一看，老房子已经废了，老婆孩子也不见，额就只能接着来这家破煤场干。唉。你呢?”\n\n“我叫狗泽，”小冯压低了声音。“当时东北闹匪，听说鬼子要派兵到我老家，我怕出事，就偷偷跑出来了。道上我打听到不少事，说上海那些大城市缺少电力，上头很重视山西的煤炭资源，所以我才来这，没想到这么累人啊。”\n\n说罢，两人各铲了一锹煤，向洞外的推车走去。"
 tnolar_chi.223.a:0 "“哗啦”"

 tnolar_chi.224.t:0 "中共同情者"
 tnolar_chi.224.d:0 "在我们的保安部队接管傅作义的地盘时，发现了一些新的问题。\n\n在陕北千沟万壑的黄土高坡上、百转千回的汤汤黄河旁，处处都隐藏着当年让阎锡山心惊胆战、让蒋介石坐立难安、让冈村宁次费尽心思的共产党人。\n\n虽然八路军在二战后期的几场战役和永无终点的撤退中几近全军覆没，但仍有许多共产党人留在了所谓的“陕甘宁抗日根据地”继续进行那以卵击石般的抗日战争。\n\n几十年的时间过去了，留下来的老一辈赤色分子风吹雨打去，可新的赤色分子又接过他们手中的枪和红旗继续游击下去——哪怕毛主席已经离去。蒋介石、阎锡山、日军不过是流水的压迫者，而对红军的怀念、崇拜与钦佩则仿佛铁打一般深深地刻进了黄土高原上的人民心里，是以红军生生不息。\n\n“所以，我们该怎么处理傅作义地盘上的那些游击队呢……”高宗武自言自语般地说道。\n\n“共产党人虽然和我们是不死不休的敌人，但他们好歹也是中国人，当初正是他们联合张学良和杨虎城要求蒋介石抗日。我们没有必要放弃这么有战斗经验的一支友军。”高宗武想。\n\n可他转念一想，如果他的秘密部队在战争中表现不如共产党，让他们逐渐获得抗战的主导权和民众的支持，那该怎么办?战争结束后，共产党又会不会推翻我们这群“地主”、“买办”、“资本家”呢?\n\n高宗武考虑良久，终于在有关残余赤匪和百姓普遍认可共产党的报告上做出了决定。"
 tnolar_chi.224.a:0 "不去管他们。"
 tnolar_chi.224.b:0 "要让他们知道，现在的秦晋两省姓高不姓毛。"

 tnolar_chi.225.t:0 "本是同根生"
 tnolar_chi.225.d:0 "破晓时分，晋冀边境，太行山上，某八路军根据地。\n\n“报告!”两个战士推着一个俘虏走进了指挥部。\n\n“怎么回事?”师长将目光从桌上的地图移了过来。\n\n“我们在巡逻的时候，看见这家伙鬼鬼祟祟，不像什么好人，后来在他的兜里发现了汪伪政府的证件。”\n\n“指战员先生，您误会了。”那个被捕的家伙抬起头来，紧紧地盯着眼前身穿破衣烂衫，满脸沧桑的男人。“我有话对您说。我并不是来打探你们情报的特务，而是高宗武总统派来联系你们对付日本人的。”\n\n师长怔住了。\n\n“你大可以派人看着我下山，我会到地方取来弹药补给。另外，你也应该知道，南京方面的部队刚刚接管山西，我们并没有为难说你们好话的老百姓。因为，我们是一家人，我们都有共同抗日的决心。而我们总统之所以在日本人那里当傀儡，是因为他想借日本的力量壮大自己，最后反咬他们一口。先生，请您相信我。”\n\n师长与政委耳语一阵，最终派了几个人随他下山取弹药。\n\n“老刘，”政委似笑非笑地说道。“我真是没想到啊，高宗武居然还会来支援我们。我们师空有师的名号，现在也不过只有几个连的兵力罢了!”\n\n“老张啊……”师长没再说下去，只是默默地注视着墙上悬挂着的毛主席的照片。"
 tnolar_chi.225.a:0 "他走出指挥部，望向了微微泛着鱼肚白的天边。"

 tnolar_chi.226.t:0 "相煎何太急"
 tnolar_chi.226.d:0 "傍晚时分，晋冀边境，太行山上，某八路军根据地。\n\n“兄弟们，我们中华民国第六十二保安部队团已经包围了赤匪的贼窝!胜利就在眼前了!”\n\n“轰!”\n\n“师长，师长，伪军从山下冲上来了!”两个八路军战士慌忙跑进了师部。\n\n“他们来了多少人?”政委急切地问道。\n\n“大概一个团吧!”\n\n“妈的。”师长拔出一把盒子炮。“之前伪军就抓了不少支持我们的乡亲，我们早就该想到的!现在完了，我们这几百个人算是逃不出去了，只能玩命打一把了!”\n\n“没办法了，冲吧，老刘。”政委轻声但却有力地说道。\n\n“师长，伪军已经快逼近师部了!”\n\n“啪!”赶来报告的小战士应声倒地，只见背后一名手持70式步枪的保安部队的士兵冲了出去，看见正朝自己赶来的赤匪指战员，他果断扣动了扳机……"
 tnolar_chi.226.a:0 "子弹贯穿了师长的头颅，正好击碎了他背后的裱着毛主席照片的相框。"

 tnolar_chi.227.t:0 "操你妈的日本鬼子！"
 tnolar_chi.227.d:0 "照片里是一个日本兵，他手上的武士刀还滴着鲜血，而旁边则是人头堆叠起来的小山。看到报纸上的这张照片，矿工老张有点反胃，他一生中看到过的所有肮脏的东西都没有这照片一半恶心。\n\n“你还认识字呢？”小冯走了过来，可当他看到那张令人寒毛直竖的照片后，他就后悔自己不应该来凑这个热闹。“这这……这是什么啊?”\n\n“辻政信那个疯子，他和他手下西北方面军的日本鬼子，在甘肃、宁夏、青海，无恶不作……”\n\n老张的声音很小，但却掷地有声。\n\n“西北方面军在哪啊？”\n\n“就是以前宁夏甘肃那里啊，在日本人那里叫西北方面军，是一条最凶狠的恶狗。”\n\n小冯瘫坐在地上，一时半会也没回过神来。\n\n“他迟早会遭报应的。”老张义愤填膺道。\n\n“可他们那么凶狠……”\n\n“他们越凶狠，额们就越要和他斗！”老张充满血丝的眼睛坚定地望着天空。“额听说，伪军地方也有一些爱国志士，他们给青海的马继援不少物资呢。”\n\n“但愿吧……”\n\n“嘿，”老张用肘子怼了一下小冯，轻声说道。“知不知道南京大屠杀?”\n\n“不知道……”\n\n“唉，”老张叹了一口气。“也不怪你，日本人很不想让这些尘封的历史重见天日。额来给你讲讲吧。”"
 tnolar_chi.227.a:0 "可怜地下魂不散，无名厉鬼三十万。"

 tnolar_chi.228.t:0 "山西汉子!"
 tnolar_chi.228.d:0 "听完关于南京大屠杀的描述，小冯又一次被震惊了。\n\n“跟额去趟关帝庙吧。”老张看到小冯无助的样子，严肃地说道。\n\n“……行。”\n\n进了庙里，只见堂上关公捋着胡须，手持《春秋》，正襟危坐；周仓和关平则立在两旁，高大魁梧，给人以浩然正气、凛然大义之感。\n\n老张没有说话，只是默默地给关公上了香火。\n\n“为什么带我来这?”小冯问道。\n\n“你总应该知道关二爷吧?”\n\n“嗯。”\n\n“二爷，是额们山西汉子自古以来最勇武的代表，也是中国人的忠义一肩挑。额来这拜二爷，是为了告诉二爷，额们山西人没有辜负您，额们山西人不是怂瓜，额们山西汉子是有血性的!阎老西儿和傅作义丢了山西的脸面，额都替关二爷瞧不起他们!”\n\n“他们怎么了？”\n\n“当初抗日战争失败，额们签订投降书，就是那阎老西儿和傅作义投靠了日本人呐!蒋介石和毛泽东都以身作则，知道团结起来抗战到底，可他阎老西儿却三个鸡蛋上跳舞，最后直接当了汉奸!”\n\n听到这里，小冯也沉默了。半晌，他走上前去，毕恭毕敬地拜了拜关公。\n\n“满洲也对不起他肩上的忠与义。”\n\n“哎，”老张拍了拍小冯，“别让额们山西汉子一提及满洲就想到张学良!要让额们知道，你们东北汉子也是勇武之士!你也不要太悲观，现在的山西正在为复仇挑大梁，额们大同挖出来的煤运往四面八方，额们黄河冲出来的水流向五湖四海，为全国提供源源不断的电力啊！总有一天，额们山西汉子会像当年二爷一样，像群狮一般，向东冲出鬼子的封锁，一直杀到东京去，洗刷我们曾经的耻辱!”\n\n说罢，老张又抬头看向关公，缓缓唱道:“他有个二弟汉寿亭侯，青龙偃月神鬼皆愁。白马坡前诛文丑，在古城曾斩过老蔡阳的头……”"
 tnolar_chi.228.a:0 "山西定当一雪前耻!"

