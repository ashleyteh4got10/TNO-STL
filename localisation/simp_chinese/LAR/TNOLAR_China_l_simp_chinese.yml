 CHI_LAR_remilitarization_status_dynamic_modifier_1_localization_key:0 "军事现代化：§R糟糕透顶§!"
 CHI_LAR_remilitarization_status_dynamic_modifier_2_localization_key:0 "军事现代化：§Y渐入佳境§!"
 CHI_LAR_remilitarization_status_dynamic_modifier_3_localization_key:0 "军事现代化：§M雄狮觉醒§!"

 CHI_LAR_remilitarization_status_dynamic_modifier_desc:0 "[ROOT.GetCHIremilitarizationstatusdynamicmodifierdesc]"
 CHI_LAR_remilitarization_status_dynamic_modifier_desc_1_localization_key:0 "我们的军队是什么样子？好吧，如果把会扣动扳机、枪口正确对准前方的大头小子能称为‘士兵’，那把他们称为‘军队’也没什么大不了的。中华民国的国军到底是堕落到了何种程度，居然连面对西北的马家军匪徒都手足无措？亏这些军官还都是军校毕业的、士兵还都‘刻苦训练’过，这就说明我们的国军从里到外都烂完了！这样的军队，别说反抗日本佬，也许我们该庆幸还没发生什么大规模暴动，不然我们都看不到明天的太阳了。"
 CHI_LAR_remilitarization_status_dynamic_modifier_desc_2_localization_key:0 "现在的国军差不多能算上一支真正意义上的军队了，我们的士兵训练有素、不会让一百个人被十个人追着跑；我们的将军足智多谋、不会连步坦协同是什么都不知道；除此之外，所有人都对现代战争有了一些基本认知，你随便去找一个军官他能说出来闪电战的三要素。但这还不够，想当年一个日本兵要我们五六个国军士兵才能杀死，想要以这支军队去和日本人碰一碰那是不知死活，更别说现代战争早就不是拼精神头就能打赢的了，我们还有很长的路要走。"
 CHI_LAR_remilitarization_status_dynamic_modifier_desc_3_localization_key:0 "成功了！说真的我站在这儿都不敢相信我们居然真的成功了！我们只用了十几年的时间，就让这支落后世界将近一百年的军队脱胎换骨重获新生！现在的国军士兵纪律严明，即使面对十倍数量的敌人也不会退缩；军官们经验丰富，作战效率高超；各个军种之间配合默契，发挥着一加一大于二的力量；但最重要的是，随着军用科技的发展，现在的国军是一支科技化的王牌之师，这支军队欢迎任何挑战、不会惧怕任何敌人。拿破仑曾说过‘中国是一只沉睡的雄狮，一旦苏醒，全世界都将畏惧它的强大’，也许现在该让这预言成真了。"

 CHI_LAR_remilitarization_status_dynamic_modifier_tt:0 "§R无法在未经§!§Y日本宗主许可§!§R时训练部队、解散部队或编辑部队模板。§!"

