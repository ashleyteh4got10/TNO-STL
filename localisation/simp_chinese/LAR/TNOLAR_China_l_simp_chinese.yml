 ### GAW GUI General ###
 CHI_Great_Asian_War_GUI_bg_info_icon_tt:0 "§R大东亚战争§!\n§W--------------§!\n\n\n£GFX_Great_Asian_War_GUI_bookmark\n\n\n\n\n§a兵者，家国之大事。§!自1947年之后，[CHI.GetFlag]§W中华民国§!就再也没有卷入如此庞大的战争漩涡中。\n\n§R“大东亚战争”§!，这一曾经被£GFX_LAR_CHI_CPS_texticon §e日本帝国主义者§!用于代称东亚的第二次世界大战，对于被侵略的人民来说不堪回首的混账词语，如今被赋予了全然不同的含义——§W争取£GFX_LAR_CHI_government_prestige_texticon 民族解放和£GFX_LAR_CHI_flag_texticon 国家自由。§!\n\n面对规模如此宏大的战争，即使£GFX_LAR_CHI_mil_progress_texticon §Q国防部§!在战前已经殚精竭虑，但§R万事虽备，终有一阙§!。§O风云变幻之快速§!，§O情报交换之频繁§!必将远超预期，双方的一切动作犹如在盲盒中猜拳，§O命令§!如何执行，§O行动§!是否准时，§O战况§!是否有利，£GFX_LAR_CHI_mil_faction_texticon §O胜利的天平倾斜何方……§!§R战斗§!结束前，这一切都是未知。面对日本大本营的各种方略，我们所能做的只有§u见招拆招§!，§O统筹资源§!、§L发挥优势§!、§s阻滞支援§!、§B削弱敌势§!，直至§G毕其功于一役§!。\n\n§R战争§!以何种情势结束，不仅取决于§R战线§!的推动状况，更取决于[CHI.GetFlag][JAP.GetFlag]§O参战各国§!对§R战火煎熬§!的§O承受能力§!。战场上§O大获全胜§!者却又可能§R满盘皆输§!，最后的棋手亦会如§R风中残烛§!，经不得半点折腾。唯一能够确定的是——§O浴火方能涅槃§!。新生的£GFX_LAR_CHI_government_texticon §W中华民国§!将在此战过后，真真正正§W一扫往日阴霾，傲立于亚洲之巅。§!"

