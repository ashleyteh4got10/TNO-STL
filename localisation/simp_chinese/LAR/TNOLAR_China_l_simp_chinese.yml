 #战后开局精神
 CHI_LAR_Victor_of_GAW_idea:0 "大东亚战争的胜利者"
 CHI_LAR_Victor_of_GAW_idea_desc:0 "连天炮火归于沉寂，飘荡于整个亚洲之上的旭日帝国被连根拔起，龟缩回他们的小岛上舔舐伤口。与三极之一的旷世大战让中国确实伤痕累累，确实遍体鳞伤，但中国和全亚洲所有被压迫的国家打碎了旭日的重压，击碎了它的牢笼，将触手难及的未来牢牢的抓在了自己的手中。战后的中国自粉碎的旧秩序中浮现而来，这片土地上的人民欢呼着，庆祝着，每个人都得以深吸一口气，品味新生的滋味，自由的甜美。\n\n现在的中国，比百年以来的任何时期都要强大。所有人都在屏气噤声，等待这苏醒的巨龙发出震撼世界的咆哮。自旧秩序的阴影中，新世界的一角已经破茧而出。\n\n欢呼吧！为了被洗刷的屈辱，为了中国的自由与强大，为了属于中国的未来，欢呼吧！"

 CHI_LAR_The_fruits_of_modernization_idea:0 "现代化之成果"
 CHI_LAR_The_fruits_of_modernization_idea_desc:0 "“五个现代化”乃是高宗武总统在近二十年来制定的，在中国发展方向上具有举足轻重地位的政策，它让中国从一个落后的农业国逐渐发展成足矣与日本抗衡的现代化工业国家。而在现代化的过程中发展起的完备的重工业体系，近现代的科研系统，合理的土地制度和教育体系，以及最重要的，强大的军队，无不给予了中国能够同日本掰手腕的资本。可以说，没有“五个现代化”，就没有今朝强大的中国。\n\n而在旭日已被荡平的今日，现代化的成果仍然能为中国的平稳发展，国防的巩固安危提供有力的支持。这是一代人的努力的结晶，更是下一代人发展的根基。"

 CHI_LAR_Uninhibited_frontier_idea:0 "不羁边疆"
 CHI_LAR_Uninhibited_frontier_idea_desc:0 "走私，土匪，军阀，甚至是外国间谍长期肆虐于无人管控的边境线上。我们自古以来的瑰宝，漫长的边境线被这些蛀虫啃食的千疮百孔，满目疮痍。数十年的分离使得生活在边境的人们自出生以来就从未有过一个统一的，强大的中华民族的概念。地图上的，法理上的领土光复从来不意味着人心的光复。建立一套高效且强而有力的戍边军队，告诉一切违法分子与地方分离主义者他们已经不再被统一的中华民族所容纳，已经变成了迫在眉睫的事实。"

 CHI_LAR_Elegy_of_War_idea:0 "败枝枯梗"
 CHI_LAR_Elegy_of_War_idea_desc:0 "大东亚战争留下的唯有残垣断壁，我们的人民挣扎着求生在被战火摧毁的城市中。尸体越堆越高，不仅仅因为战火，还因为救济的迟滞。每一天都有无数的伤员因为缺少药品而死，饥饿与寒冷无时无刻不在摧毁民众对于我们政府的信任与爱戴。再不迅速扭转局势，等待着我们的便只有民心尽失的未来。"

 CHI_LAR_Uncontrollable_army_idea:0 "桀骜之军"
 CHI_LAR_Uncontrollable_army_idea_desc:0 "大东亚战争的胜利带来的是庞大且臃肿的军队。我们现有的军队远远超过了和平时代维护国防所需要的数量。战时的大规模扩招使得军队素养普遍下滑，违反军纪的事件屡见不鲜。但更惹人担忧的，还是军队之中大有仗着大东亚战争的胜利鼓吹军队强劲，无需在意软弱政府官员的毒瘤理论。骄傲且自满的军队如同一位凯旋而归的将军，将耀武扬威的尖刀对准了压在自己头上的自己人……"

 CHI_LAR_Shadows_of_the_Past_idea:0 "往日之影"
 CHI_LAR_Shadows_of_the_Past_idea_desc:0 "五个现代化所带来的灾难性的副作用使得在十几年发展中一直潜藏的社会矛盾如炸弹一般爆炸，无数的小工厂主不得不大规模的降低员工本就不多的待遇亦或是直接大量裁员以求得自保。而要求现政府变革的声音也如雨后春笋一般从动荡的社会舆论中钻出。早在大东亚战争前就已经在民间成立的民主党派组成同盟，带领群众向现政府游行示威以要求改革与变化。而现政府一直视作眼中钉，肉中刺的红色幽灵，则借着这动荡的时期放弃虚无缥缈的形态，大有卷席着被压迫者的怒火重新登上舞台的意图……"


