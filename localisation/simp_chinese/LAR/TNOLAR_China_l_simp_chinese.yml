####  Military Tree  |  军事现代化国策  ####

 CHI_LAR_Military:0 "军事"
 CHI_LAR_Military_desc:0 "军事对一个国家的主权十分重要。要强国，先强军；要强军，先改革；要改革，先计划。我们现在，就在计划！"
 CHI_LAR_Military_tt:0 "§Y我们将会发起一系列计划来实现中国的£GFX_LAR_CHI_mil_progress_texticon §Q再军事化§!。§!\n\n§M现在§Q国防部§!将会随国策进行逐步解锁新的§Y现代化决议§!。§!"
 CHI_LAR_Military_modernization_trigger_tt:0 "§Y在更进一步之前，我们必须得给未来的现代化进程打好基础。§!"
 CHI_LAR_Develop_military_technology:0 "发展军事技术"
 CHI_LAR_Develop_military_technology_desc:0 "古人云：“工欲善其事，必先利其器。”\n\n经过十年来的现代化努力，现在每天都有无数装着中国产品的集装箱经由港口输送到国外。我们可以毫不夸张地说，中国是名副其实的“共荣圈工厂”。\n\n但我们有更宏伟的雄心，而时间愈发紧迫。鉴于中国军工的现状，有人认为从国外引进技术是必不可缺的一环，另一部分认为，我们要侧重于一步一个脚印地打下基础，确保有独立的军事生产能力。"
 CHI_LAR_self_reliance:0 "自力更生"
 CHI_LAR_self_reliance_desc:0 "很显然，如果不能打好现在的基础，努力建设国内的军工生产体系，那么无论对于现在进行的计划，还是未来的发展，都是十分不利的。国产军火的质量和技术或许会稍逊一筹，但通过不断的磨练，未来我们一定会成为世界级军工强国。"
 CHI_LAR_State_owned_enterprise_orders:0 "国企订单"
 CHI_LAR_State_owned_enterprise_orders_desc:0 "源源不断的订单正涌向中国企业，在庞大现金流与军方严格要求的刺激下，军火的产能和质量每周都在不断提升。流水线昼夜不息，工人轮班上岗，每天都有新武器送到士兵手中。更重要的是，国军不再需要担心后勤供给不足，因为输出血液的，是中国军工之心。"
 CHI_LAR_Technology_introduction:0 "技术引进"
 CHI_LAR_Technology_introduction_desc:0 "打好现在的基础固然重要，只是为了赢取更多的胜算，脚步必须再快一点，更多地引入国外已有的先进技术。也许现在中国的科研人员还无法将其全部化为己有，但仅仅是化为己用，我们能做到。"
 CHI_LAR_Comprehensive_reverse_research:0 "全面逆向"
 CHI_LAR_Comprehensive_reverse_research_desc:0 "日本人的智慧无愧于三极之名，但美国与德国亦有日本不能企及之所长。我们将尝试从其他两极那里获取日本人不愿提供给我们的技术，无论通过何种渠道，何种手段。为了未来的自由，不得吝惜当下的筹码。"
 CHI_LAR_Japanese_orders:0 "日企订单"
 CHI_LAR_Japanese_orders_desc:0 "现实一点，国军长期以来使用的皆是日械，我国的军工企业亦是起步于日本技术，继续扩大日本技术引进，收益是最大的。况且中日名义上依旧是共荣圈的战友，向日企购买军火不但能降低日本的警惕性，更能表现出我们建设中日亲善，共存共荣的泛亚联军之决心。"
 CHI_LAR_combined_warfare:0 "三军共进"
 CHI_LAR_combined_warfare_desc:0 "尽管我国的海军和空军与日本相比有很大差距，但我们不能忽视海军和空军在战争中的重要地位。现在有了多年现代化打下的工业和科研基础，我们已经具备缩小这一差距的必要条件。为了适应现代战争的变化，更是为了赢得眼前的战争，海陆空三军应当共同发展。"
 CHI_LAR_Land_battle_first:0 "陆战制胜"
 CHI_LAR_Land_battle_first_desc:0 "不得不承认，我们在海军和空军上与日本的差距如同天堑。而想要赢得这场战争，我们只能寄希望于在陆地上击败敌人。所以，为了取得更多的胜算，我们必须将资源向陆军倾斜，全力提高陆军的作战能力，以期能在战争开始时追上甚至部分超过日本陆军。"
 CHI_LAR_Start_mechanization:0 "开启机械化"
 CHI_LAR_Start_mechanization_desc:0 "机械化部队，是以坦克、装甲运输车和步兵战车实施运动和战斗的部队。而相比于已经基本完成机械化的日本军队，我军现在只有精锐部队完成了摩托化。为了改变这一现状，我们应当立即通过加大研究投入和扩大生产等方法开始对机械化军的建设。"
 CHI_LAR_Heavy_military_industry:0 "大国重器"
 CHI_LAR_Heavy_military_industry_desc:0 "通过多年的现代化努力，我们已经在军工领域取得了长足的进步。但这还远远不够，为了让中国成为世界级军工强国，我们必须在以导弹、新一代主战坦克等为代表的高精尖武器上开拓出我们自己的道路，以期让我们在不远的将来拥有属于自己的大国重器。"
 CHI_LAR_Revitalize_Whampoa_spirit:0 "重振黄埔精神"
 CHI_LAR_Revitalize_Whampoa_spirit_desc:0 "黄埔军校，一段遥远的记忆，一段峥嵘的岁月。这所国府最高等级的军事院校不仅培养出无数能征善战的指挥官，更给我们的军队乃至社会带来了难得可贵的高尚品格。尽忠职守、热爱祖国、百折不挠，诸如种种的优良品质不应该被埋葬在历史之中。我们要重启的不止是一所院校，更是一种精神，一种名为黄埔的奋斗精神。"
 CHI_LAR_Under_the_blue_sky:0 "青天之下"
 CHI_LAR_Under_the_blue_sky_desc:0 "笕桥是位于杭州东郊的一座古老小镇，作为中国空军的诞生地之一，这里发生了大东亚战争史上的首次空战，在中国空军健儿顽强抗击下，赢得了完胜。而可惜的是，蒋介石政府贪污无能，中国空军没有足够的飞机，只能开着老旧飞机迎战，最后还是战败。虽然日本人不会支持我们建设空军，但我们已经下定决心要凭自己的力量发展空中力量，而这将再次从笕桥而始。"
 CHI_LAR_Under_the_blue_sky_buff_tt:0 "“§Y中国军事化现状§!”获得修正\n§Y效果变化：§!\n   §Y王牌机师的产生概率：§!§G+25%§!\n   §Y空军经验增长：§!§G+0.20%§!\n"
 CHI_LAR_above_the_blue_waves:0 "碧波之上"
 CHI_LAR_above_the_blue_waves_desc:0 "海军是最能反映国家综合实力的晴雨表，往往需要倾尽一个国家的所有的工业实力，花费几十年才能建设出一支强大的海军军队。我们的海军依然只是停留在本世纪初的水平，拥有的只是一堆老旧古董，形同虚设，完全没有战斗力，但我们可以从零开始，从军官开始慢慢建设我们自己的现代化海军。考虑到我们还没有过多的工业产能来建设海军，当前海军的建设方针也就只是打造防御性舰队而已。"
 CHI_LAR_above_the_blue_waves_buff_tt:0 "“§Y中国军事化现状§!”获得修正\n§Y效果变化：§!\n   §Y海军速度：§!§G+5%§!\n   §Y海军组织度：§!§G+5%§!\n   §Y屏卫舰攻击：§!§G+10%§!\n   §Y屏卫舰防御：§!§G+10%§!\n   §Y海军经验增长：§!§G+0.10%§!\n"
 CHI_LAR_perfect_war_theory:0 "完善战争理论"
 CHI_LAR_perfect_war_theory_desc:0 "不同时代，不同地区的战争需要不同的战争理论来指导，时至今日，我们战争理论已经漏洞百出，不再适用当前情况，现在也必须做出一点改变。更复杂的是，不同的派系对战争有着自己的理解，选择对应派系的理论必定会对国防部派系的格局产生重大影响。"
 CHI_LAR_New_theory:0 "新锐理论"
 CHI_LAR_New_theory_desc:0 "曾经的理论只会带来再一次的失败，若想取得胜利，就必须彻底摈弃老将领口中的陈词滥调，发展出面向未来的全新作战理论。"
 CHI_LAR_New_theory_tt:0 "我们已决定采纳§m新锐理论§!。"
 CHI_LAR_traditional_thinking:0 "传统思路"
 CHI_LAR_traditional_thinking_desc:0 "新的理论是构建在原先的理论之上的，抛弃原有的理论去重新编造一个新的理论宛如搭造空中楼阁，最后只会坍塌。所以，最好的方法就是修补理论中的漏洞，用传统的方法解决问题。"
 CHI_LAR_traditional_thinking_tt:0 "我们已决定采纳§L传统思路§!。"
 CHI_LAR_Reuse_young_officers:0 "鼎新革故"
 CHI_LAR_Reuse_young_officers_desc:0 "大幅度改变理论和思想正中了民族派的下怀，他们终于能够抓住机会实施那冒进的计划。不过民族派依然不能为所欲为，最高军事顾问团将打起十二分的精神盯紧他们的一切动向，防止中国的军队走上错误的道路。"
 CHI_LAR_Hire_Japanese_officers:0 "傍人篱壁"
 CHI_LAR_Hire_Japanese_officers_desc:0 "无论是新方法，还是老思路，都可以从领衔亚洲军事的日本帝国军队身上学习，摸着石头过河总比像无头苍蝇一样自己摸索要好。可如果选择学习日本的经验必定会增加华北派的话语权，打破国防部当前的派系格局，甚至对文官政府也产生影响。"
 CHI_LAR_Rehiring_retired_officers:0 "历久弥新"
 CHI_LAR_Rehiring_retired_officers_desc:0 "其他人的军事经验最多只能当作参考，不能直接在中国军队付诸实践，靠自己摸索才能因地制宜，对症下药。而最了解中国军队的还是那些长期服役的中央派老将领，由中央派主导军事理论的发展也就是理所应当的。"
 CHI_LAR_independent_command_system:0 "独立指挥体系"
 CHI_LAR_independent_command_system_desc:0 "老旧的指挥体系已经不能适应新时代军事发展的需要，现在必须要做出改变。中国应该根据实际的国防需求改革现有体系，而不是单纯地生搬硬套他国的指挥体系，这样才能保障指挥与作战更加顺畅，行动更加高效"
 CHI_LAR_Japanese_command_system:0 "日本指挥体系"
 CHI_LAR_Japanese_command_system_desc:0 "中国在世界大战中的胜利绝大部分功劳要归功于日本的指挥，这证明了日本指挥体系的优越性，只有在日本帝国军队的领导下中国才能取得新的胜利。对接日本指挥体系能够允许指挥层迅速交接，当中国无法独自处理国防问题时也能更高效地接受日本的援助。"
 CHI_LAR_command_system_buff_tt:0 "“§Y中国军事化现状§!”获得修正\n§Y效果变化：§!\n   §Y指挥点数上限增长：§!§G+20§!\n"
 CHI_LAR_Reorganize_soldiers:0 "整顿士兵"
 CHI_LAR_Reorganize_soldiers_desc:0 "曾几何时，为祖国服役是一种至高的光荣。然而现在，散发着铜臭的腐败无能之徒正在败坏着中国军队的声名。不能再忍下去了！一定要对这些宵小之徒施以最彻底的铁拳！我们将在各部队中开展声势浩大的整风运动，剔除生活作风问题严重的堕落分子，把中国军人的精气神彻底扭转过来，建成一支听从指挥，作风优良的铁骨强军。"
 CHI_LAR_technical_officer:0 "重视技术军官"
 CHI_LAR_technical_officer_desc:0 "技术军官，就是在军队中从事技术研究和学术研究等工作的军官，他们虽然不会直接指挥军队，但实际上是决定战斗中军事实力的重要因素。他们比一般的研究人员更加了解军事，更加清楚战斗中需要什么样的武器，所以无论是在追赶世界顶尖技术还是在独立设计武器时，技术军官都是更加值得重视的。"
 CHI_LAR_young_officer:0 "提拔青年军官"
 CHI_LAR_young_officer_desc:0 "任何一支处在发展中的军队都必须接受新鲜血液，否则将永远停滞不前，然而在派系林立的国防部里，提拔军官也成为了明争暗斗的权力交锋。各大派系为了让自身能在将来达到统治地位，都会极力推荐自己青睐的新一代军官，最大胜利果实究尽鹿死谁手，也就只能由他们自己决定了。"
 CHI_LAR_Corrupt_officer:0 "整治贪腐军官"
 CHI_LAR_Corrupt_officer_desc:0 "军队中发生了贪腐就像利刃上生了锈，再优秀武器也会没法像以前一样锋利。军队就是我们的利刃，无论是为了自卫还是杀敌都应该时刻保持锋利，那么反腐就成了必要。\n\n不过军中腐败实在过于普遍，没法快刀挖烂肉，我们只能先杀鸡儆猴，让剩下的人收敛一些，之后的问题再放在之后解决吧。"
 CHI_LAR_Political_Warfare_Bureau:0 "总政治作战部"
 CHI_LAR_Political_Warfare_Bureau_desc:0 "军队的思想教育和社会的舆论管控是这些年来我们一直忽视的重要问题，这导致了我们军队军心涣散，毫无战斗力，社会上又充斥着对政府的猜疑和反对，让我们像步入泥潭一样举步维艰。发现这些问题之后，国防部将下设总政治作战部，以三民主义为中心思想对内进行政治教育，保证对党对国的忠诚；对外设立官方媒体，进行文化宣传和舆论管控，同时，总政治作战部还将负责检查、管理、官兵福利等事务。"
 CHI_LAR_Political_Warfare_Bureau_buff_tt:0 "“§Y中国军事化现状§!”获得修正\n§Y效果变化：§!\n   §Y战争支持度：§!§G+10%§!\n   §Y投降界限：§!§G+10%§!\n"
 CHI_LAR_Nation_first:0 "国族至上"
 CHI_LAR_Nation_first_desc:0 "我们的士兵必须明白，他们是中华民族的利剑，作为中国的军队，无论何时都要为中国的利益而战。即便我们可能会站在世界上最强大的国家的对立面，即便曾经挚爱的亲朋背叛成我们的敌人，将士们也能为了祖国迎难而上。"
 CHI_LAR_Pan_Asian_Pioneer:0 "泛亚先锋"
 CHI_LAR_Pan_Asian_Pioneer_desc:0 "自从先总理孙中山提出大亚洲主义后，泛亚主义一直是我们所坚定的信念。在大东亚战争里，汪总统领导我们与日本盟友一起将欧美帝国主义驱逐出亚洲，为亚洲带来了解放。如今，帝国主义依然盘踞在我们的卧榻之侧，我们将继续与亚洲同胞们一起争取独立与解放。"
 CHI_LAR_Iron_Discipline:0 "纲纪铁律"
 CHI_LAR_Iron_Discipline_desc:0 "优良的纪律是军队战斗力的重要保障，然而，国军军纪之差也早已臭名远扬：军队外欺男霸女、鱼肉百姓，军队内欺上瞒下、滥用职权，“兵匪”是对国军的最好形容。\n\n想要打造一支现代化的军队，必须让每一个士兵明白，遵守军纪是军人的义务，保家卫国是为国效忠，而不是为了追求高高在上的权力，更不能利用军人身份欺压百姓。很明显，这些道理不可能轻易就让每一个士兵都能理解，但宪兵队会帮他们理解的。"
 CHI_LAR_Rearmament:0 "厉兵秣马"
 CHI_LAR_Rearmament_desc:0 "懒散的部队需要更多的时间来适应战场，只有在今天做好充分的准备和训练，才能让士兵们在明天勇敢地踏上沙场。\n\n要注意的是，过高强度的训练不仅会引起士兵们的不满，也同样会引起最高军事顾问的警惕，怀疑我们的训练动机，适当的训练强度才能兼得军队战斗力和日本对我们的安心。"
 CHI_LAR_Seeking_countermeasures:0 "寻求反制手段"
 CHI_LAR_Seeking_countermeasures_desc:0 "尽管我国军火的产能和质量每周都在不断提升，然而我军在坦克装甲车等重装备的数量上依然远远落后于日军。面对即将到来的战争，我们很难在开战前大幅度地缩小这一差距，但我们可以通过大规模装备反坦克火箭筒等方法来提高我军的反制能力。"
 CHI_LAR_Area_Denial_Strategy:0 "“拒止战略”"
 CHI_LAR_Area_Denial_Strategy_desc:0 "国防部根据我国当前和未来的国防形势提出了“拒止战略”。即通过在沿海地区部署大量防空，反舰手段来划定禁区的方式，以限制或控制敌方进入我国外围的陆地、海洋和空域。\n\n显然，以我国当前的国家实力难以实现，在将来的十年甚至到下个世纪都不一定真正实施这一战略构想，我们能做的只有不断地发展它，使其在将来有机会发光发热。"
 CHI_LAR_Ten_years_sword_sharpening:0 "十年磨剑"
 CHI_LAR_Ten_years_sword_sharpening_desc:0 "日本人为我们规定了军事红线，我们明面上的军队只能在他们的限制之内发展，这是远远不够的。虽然暂时不能完全跨过红线，试探至少是可以试试的，一只脚踩在红线上或者仅仅是一只脚趾越过红线都是一次富有意义的尝试，接下来日本人的反应将会决定我们未来的行动。"
 CHI_LAR_Showing_sharp_edge:0 "锋芒毕露"
 CHI_LAR_Showing_sharp_edge_desc:0 "显然，日本人对我们稍微出格的行为并没有什么强烈的反对，这或许意味着我们得到了东京方面的默许，有所微词的只有军事委员会的日本顾问们。他们同意中国军队需要扩大和现代化，但这件事不能只由中国自己来做，必须要在军事顾问的监督和帮助下完成。或许这不是我们所期待的最好结局，至少我们得到了我们想要的，尽管是要朝着“正确”的方向。"
 CHI_LAR_Showing_sharp_edge_trigger_tt:0 "§e[JAP.GetNameWithFlag]§!已批准我们提出的£GFX_LAR_CHI_army_limit_texticon §O扩军请求§!。"
 CHI_LAR_Showing_sharp_edge_tt:0 "我们的£GFX_LAR_CHI_army_limit_texticon §O军队数量上限§!将§G增加10§!。"
 CHI_LAR_Keep_low_profile:0 "韬光晦迹"
 CHI_LAR_Keep_low_profile_desc:0 "可惜，日本人立即对我们一点点的小动作发出了强烈反对，看来无论如何他们都不会支持我们任何扩军提议。现在，我们的野心也被日本人知晓，他们必将更加严格地监视我们，未来的道路会变得更加艰辛。"
 CHI_LAR_Keep_low_profile_trigger_tt:0 "§e[JAP.GetNameWithFlag]§!否决了我们提出的£GFX_LAR_CHI_army_limit_texticon §O扩军请求§!。"
 CHI_LAR_Raise_recruitment_standards:0 "提高征兵标准"
 CHI_LAR_Raise_recruitment_standards_desc:0 "一支没有好兵的军队是不可能背负中国的命运走向远方的，而想训练好兵就得从入伍抓起。虽然我们欢迎每一个愿意为中华之崛起而奋斗的男女，但是兵家之事不容儿戏。征召官理应优先考虑身强力壮、精神饱满、斗志昂扬的应征者，而其他人一样可以在别的地方为祖国发光发热。"
 CHI_LAR_Cycle_the_Reserves:0 "循环预备役"
 CHI_LAR_Cycle_the_Reserves_desc:0 "日本强加给我们的军事限制让我们没法拥有足够的现役士兵，有趣的是，这并没有限制预备役的数量。即使在志愿兵役制度下，中国因其庞大的人口也会拥有不计其数的年轻人试图加入军队，其中素质优秀的将会加入现役军队，剩下符合基本要求的将会在经历过一段时间的严格训练之后成为预备役。进入预备役的小伙子们并不会在军队中停留很久，在完成训练之后就会退伍，回到社会，所以从表面上看我们没有太多的军队，而实际上会打枪的中国人可是不少，虽然不如职业军队，但至少到需要的时候他们也会派上用场。\n\n除此之外在民间，大量的成年男子也会被登记为预备役，不过他们不一定会上战场，而是作为后勤部队或技术人员参与军事行动。"
 CHI_LAR_Cycle_the_Reserves_buff_tt:0 "“§Y中国军事化现状§!”获得修正\n§Y效果变化：§!\n   §Y训练程度下限：§!§G-5%§!\n"
 CHI_LAR_Waking_the_Tiger:0 "唤醒猛虎"
 CHI_LAR_Waking_the_Tiger_desc:0 "几千年以来，我们凭借着广阔富饶的土地和勤劳的双手维持着强者的地位，渐渐变得固步自封，忽视了工业化，直到西方的坚船利炮击碎了天朝上国的幻想才逐渐意识到我们已经被时代抛弃。于是，从1840年开始，太多人来欺侮我们，西方的列强，北方的沙俄，甚至万里之外的美国也想从这获取利益，最后，我们败给了日本，成为了武士的囚徒，旭日的奴隶。就这样，我们慢慢地沉睡着。\n\n可我们不能一直睡下去。几十年的摸爬滚打，卑躬屈膝终于换来了发展，校园里的学生孜孜不倦，实验室里的学者苦心孤诣，工厂里的工人兢兢业业，军营里的战士厉兵秣马。现在，这江山社稷已经追上了这时代，中国不再会沉睡，不再惧怕敌人的欺辱，千年的猛虎将回归到属于自己的世界地位，那些曾经的敌人，今日的仇敌都将愤怒下被她彻底撕碎。"



 chi.Nagasaki_Summit_AcceptJapan.tt:0 "§R我们将度过更艰险的难关…§!"
 chi.Nagasaki_Summit_Middle.tt:0 "§R这能有多难？§!"
 chi.Nagasaki_Summit_Press.tt:0 "§W他们会明白的！§!"


 CHI_Distribution_Networks_tt:0 "§R一旦我国所有的军火库都通过现代化的铁路连结起来，中国就将能在任意方向上采取主动防御姿态。§!"
 CHI_Hidden_Arsenals_tt:0 "我们将得到更多的选择以进一步加快我们的秘密再武装进程。"
 CHI_Disguised_Inventories_tt:0 "我们盘根错节的官僚机构是我们解放同盟的军火库中另一枚不安全的炮弹。"
 CHI_Mil_Propoganda_tt:0 "我们将鼓舞人民保家卫国，直到日本人流的血足以染红长江！"


 ####  Reunification Tree  |  主权统一国策  ####

 CHI_LAR_Sovereignty:0 "主权"
 CHI_LAR_Sovereignty_desc:0 "我们祖国的版图原来就像秋海棠叶一样美观，但自战争结束以来，她就变得支离破碎。我们作为中国唯一的合法政府，理应对那些军阀控制的土地重申主权。我们要收回那些属于我们的土地，恢复我们广阔的版图，只有这样，我们才能成为共荣圈中举足轻重的国家。"
 CHI_LAR_Sovereignty_tt:0 "§R我们将团结全中国的力量，就像三十年前那样，再一次抵御日寇！§!\n"
 CHI_northwestwar_has_resolved_trigger_tt:0 "我们已§B打消§!军阀们心中的§Y疑虑§!"
 CHI_LAR_Meet_Xia_Wei:0 "会见卢汉"
 CHI_LAR_Meet_Xia_Wei_desc:0 "在龙云死后，云南、贵州，这样两个贫穷、落后、偏远的省份正处在旧军人卢汉的统治之下。他从未对外宣称过自己屈服于国民政府————无论是云贵统一后，还是共产党在中原的势力基本覆灭后，他从未向我们献出自己的真心。卢汉是一个忠诚的军人，但他忠诚的对象不是我们，而是中国。他心里明白仅凭云贵的力量无法再次获得中国的自由，我们必须让他明白只有服从中央的管辖中国才会有自由的未来。"
 CHI_LAR_Dispel_Doubts:0 "打消质疑"
 CHI_LAR_Dispel_Doubts_desc:0 "龙云对中国的自由事业有着无比的热情。卢汉虽不像龙云那样热爱自由，可过去的几十年间他从未真正信任过我们，仅仅把我们——国民政府看成日本人的提线木偶。是时候摆出我们的诚意了，除了口头上的承诺，实际的行动会更有说服力。只有中华民族团结一致，才有可能斩断禁锢我们的枷锁！"
 CHI_LAR_Restart_War_Machine:0 "重启战争机器"
 CHI_LAR_Restart_War_Machine_desc:0 "在卢汉的治理下，云贵成为了一个等待发动的战争机器。虽然厂房的技术与军队的武器都十分落后，但是这些正是我们所擅长的。让中央的资金，技术，人才，武器源源不断地流入云贵，让云贵这部可怕的战争机器更加高效的运转起来。"
 CHI_LAR_Love_For_Homeland:0 "炙热的爱"
 CHI_LAR_Love_For_Homeland_desc:0 "那场战争遗留的仇恨仍然扎根于云贵人民的心中，更在龙云、卢汉的心中。这片向往着自由的土地，拥有着对中华民族最炙热的感情。云贵人民将这片赤子之心埋藏在内心中，当斩断锁链那天到来之时，云贵人民必然会发出令人震颤的怒吼！"
 CHI_LAR_Never_Give_Up_Until_Die:0 "不死不休"
 CHI_LAR_Never_Give_Up_Until_Die_desc:0 "反日的思想在云贵早已蔓延。云贵的人民一直准备着与日本人战斗，为了中国的自由战斗！他们渴望为中国的自由而战，即使会面对大量的牺牲，无数的死亡，云贵人民也毫不畏惧。不论有多少牺牲，无论结果如何，云贵人民都会战斗到最后一刻，不死不休！"
 CHI_LAR_Calm_Down:0 "稍安勿躁"
 CHI_LAR_Calm_Down_desc:0 "云贵人民不畏惧日本人的铁蹄，也渴望为了自由而战。但所有人都愿意获得胜利而非失败——中国的自由事业更是如此。我们不能让仇恨压制了理智，中国需要静候时机，在武士最为虚弱的时刻果断地拔出利刃。"
 CHI_LAR_Wolf_Soldier:0 "西南联大"
 CHI_LAR_Wolf_Soldier_desc:0 "抗日战争之时，北京大学、清华大学、南开大学合并为“国立西南联合大学”，持续至今。只要时机合适，西南联大的学生们必定会奋起抗敌。\n\n丛林里的狼不惧怕死亡，因为他们已经没有什么可以再失去的了，他们渴望着自由。"
 CHI_LAR_Loyal_Guangxi:0 "忠诚的云贵"
 CHI_LAR_Loyal_Guangxi_desc:0 "卢汉选择了忠诚，让卢汉继续忠诚于中国。他们将像狼一样默默潜伏，等待猎杀。云贵会像之前一样，不断地将自己变成只会战斗的机器。她的学府，她的人民，她的军队会将忠诚之心化为中国的利刃，凶猛的刺向那夺走中华民族自由的武士。"
 CHI_LAR_Visit_Zhang_Zhizhong:0 "密电马仲英"
 CHI_LAR_Visit_Zhang_Zhizhong_desc:0 "马仲英将军是一个易于交流的对象。在共产党覆灭后，他默默地经营着中国最西北的地方，希望中国能够自由。或许我们还没有达到他的期望，不过我们可以共同向着自由前进。\n\n尽管在战争后新疆已经平稳地度过了许多年，那只是因为马将军精心平衡国防阵线中的各派，不代表新疆内部也像表面一样平稳，我们要想收回新疆就要处理好那些暗中汹涌的各派势力。"
 CHI_LAR_Destroy_Remants:0 "剿灭残部"
 CHI_LAR_Destroy_Remants_desc:0 "显然，共产党和国民革命军残部并不想和我们合作，无论是政治分歧还是在国家未来上我们都无法达成共识。为了收回新疆，我们只能选择将他们剿灭。现在，和平收回新疆已经是不可能的了。"
 CHI_LAR_Incorporate_Remnants:0 "收编残部"
 CHI_LAR_Incorporate_Remnants_desc:0 "只要花点时间，艰难的谈判也能达成想要的结果。人民解放军的残部虽然并不喜欢我们，但良禽择木而栖，他们还是决定接受我们的收编，条件是必须在将来反对日本人的统治，建立一个孙先生所设想的中国。\n\n这样的条件他们认为是我们不可能同意的，可事实上这也是我们的目的之一，于是，我们戏剧性地握手言和，再次为中国而奋斗。"
 CHI_LAR_Another_Rupture:0 "又一次决裂"
 CHI_LAR_Another_Rupture_desc:0 "曾经我们与共产党合作过，只不过结果是决裂的。现在，他们又一次与我们意见不合，那么结果也只能和上次是一样的了。"
 CHI_LAR_Appease_Minorities:0 "安抚少数民族"
 CHI_LAR_Appease_Minorities_desc:0 "我们的出现打破了新疆这几十年以来的一尘不变的生活，少数民族们就像惊弓之鸟一样害怕着，同时，也可能酝酿着反叛。为了尽可能地减少新疆社会动荡，安抚少数民族就是我们必须的工作。"
 CHI_LAR_Another_Collaboration:0 "又一次合作"
 CHI_LAR_Another_Collaboration_desc:0 "与共产党的谈判更加困难，因为我们之间在太多的方面有着分歧，不仅仅是对日态度上，还是在国内政策上。\n\n为了防止发生暴力冲突，我们只能慢慢谈判。幸好对方并没有太多的激进分子，沟通还是能继续的，至于结果如何，估计只能取决于我们能让步多少了。"
 CHI_LAR_Reclaim_And_Garrision:0 "屯田戍边"
 CHI_LAR_Reclaim_And_Garrision_desc:0 "结束了剿灭残部的任务之后，主动反对我们的势力就消失了，只要我们安抚好少数民族，新疆唾手可得。\n\n古人的智慧是值得学习的，我们在几百年前就知道要在边疆驻兵，现在，我们也将向新疆派军驻守。可惜的是我们暂时没有办法向新疆输送足够的物资来供养我们的军队，他们只能在当地一边维护治安，一边自己种地了。"
 CHI_LAR_Production_And_Construction_Corps:0 "生产建设兵团"
 CHI_LAR_Production_And_Construction_Corps_desc:0 "做出了巨大的让步之后，我们与共产党达成了收编的协议。共产党向我们展示了他们他们控制之下的村镇，并要求新疆的建设一定要按照他们的要求来进行。\n\n对比之下，他们的村镇更加和谐，居民的生活更加富足，我们没有理由拒绝他们的提议。如果运用他们的方式来管理新疆，共产党将获得更多的权力，他们的思想也将更加难以控制。之后如何处理谈判带来的问题也是一个棘手的问题。"
 CHI_LAR_Unstable_Xinjiang:0 "不稳的新疆"
 CHI_LAR_Unstable_Xinjiang_desc:0 "几番周折之后，我们也终于取得了新疆。可惜的是，新疆并不是那么稳定的一个地方。它就像一个海胆一样，外表充满尖刺，内部却十分鲜美。假如我们处理好新疆的问题，其能带来的效益是无可估计。我们要做的就是找到解决新疆内部各个问题的解决方法。"
 CHI_LAR_Appointment_With_Liu_Wenhui:0 "赦免刘文辉"
 CHI_LAR_Appointment_With_Liu_Wenhui_desc:0 "自中日议和之后，刘文辉就带领着他的军队退居到群山之间，他们拒绝向日本人投降，迫切期待着中国能够重新获得自由。\n\n尽管刘文辉并不承认我们政府的合法性，但他追求自由中国的理想是和我们完全相符的，或许，我们之间的分歧可以通过一次会面来消除。"
 CHI_LAR_Connect_Road:0 "连通道路"
 CHI_LAR_Connect_Road_desc:0 "自刘文辉退守西康之后，西康与外界的道路基本上都中断了，现在想让西康与外界恢复联系，就必须将道路连上。"
 CHI_LAR_Wooing_Lower_level_Officials:0 "拉拢下级官员"
 CHI_LAR_Wooing_Lower_level_Officials_desc:0 "早在西南叛乱的时候我们就已经与西康的部分官员有所接触，其他的官员也拒绝反对我们。只要我们将下级官员都拉拢过来，西康的回归就指日可待了。"
 CHI_LAR_Explore_the_Terrain:0 "勘探地形"
 CHI_LAR_Explore_the_Terrain_desc:0 "西康的地形十分复杂，但与之俱来的是丰富的自然资源。只要我们勘探好西康的地形，那么不仅能好好利用那里的资源，也能推动西康的回归。"
 CHI_LAR_Hydraulic_Engineering:0 "兴修水利工程"
 CHI_LAR_Hydraulic_Engineering_desc:0 "崎岖的山地有着巨大的上下落差，并且，西康也有着大量的水资源。这一切或许可以成为能源的来源，但同时也是洪灾的原因。如果能够充分利用，那么将会给四川和西康带来大量电力。"
 CHI_LAR_Light_the_Lights:0 "点亮电灯"
 CHI_LAR_Light_the_Lights_desc:0 "与水利工程配套的电力运输系统同样也是必需要有的。让电缆不断的延伸进山区，才能让那里的人民享受到现代发明的便利。而电缆能到达的地方，也就的我们能控制的地方。"
 CHI_LAR_Resident_Officials:0 "驻派官员"
 CHI_LAR_Resident_Officials_desc:0 "我们已经帮助西康建设了大量的基础设施，但他们并不知道如何管理，所以我们必须派驻官员与技术人员帮助当地人来管理这些东西。我们也非常乐意提供警察、消防、医疗等服务，当然，我们会派大量的官员来完成任务。"
 CHI_LAR_Regression_of_Xikang:0 "归乡的西康"
 CHI_LAR_Regression_of_Xikang_desc:0 "现在，无论是西康的官员还是老百姓都想回到祖国，刘文辉和原来跟随他的部下也怀念起了故土之情。最终，西康承认了南京政府，并且愿意作为一个省接受中央的管理。\n\n西康的回归也为其他军阀做出了一个榜样，自己另立门户不会是一个好的选择，回到祖国才是唯一的最好结果。"
 CHI_LAR_Support_Ma_Jiyuan:0 "支援马继援"
 CHI_LAR_Support_Ma_Jiyuan_desc:0 "西北地区的冲突已经吸引了共荣圈内所有国家的注意力，我国在迫于内外的压力只能被迫声明支持西北方面军，不过在实际上我们没有做出任何实质性的帮助。\n\n无论是从现实政治的角度，还是从中华民族的角度上来说，我们更应该支持马家军，所以我们选择提供援助。西北方面军只要失败，我们就有理由扩军。假如马家军同意了和平谈判，我们将收回西部，打通通往新疆的走廊。"
 CHI_LAR_Stick_Out_an_Olive_Branch:0 "伸出橄榄枝"
 CHI_LAR_Stick_Out_an_Olive_Branch_desc:0 "马家军并不愿意直接同我们交流，我们之间的初步沟通只能通过民间人士来牵线搭桥。尽管我们不对他们接受援助这件事抱有希望，我们依然会慢慢尝试。"
 CHI_LAR_Provide_War_Materiel:0 "提供战争物资"
 CHI_LAR_Provide_War_Materiel_desc:0 "青海落后的工业甚至不能满足他们本身的战争需求，枪支、子弹都十分短缺。如果我们提供物资，他们只能用马刀来对抗日本的机械化部队。为了不引起日本的怀疑，我们不能直接提供物资，只能偷偷运输，或者用奇怪的方式把资源给他们。"
 CHI_LAR_Advisers_Westbound:0 "顾问西行"
 CHI_LAR_Advisers_Westbound_desc:0 "马家军的军官们基本上都没有接受过合格的军事训练，他们的战术就像是土匪一样拙劣。为了取得胜利，专业的军官将为他们提供专业的建议。虽然不能完全指挥军队，这也是我们这几十年来第一次可以在军事上对抗日本，我们也将从中获得宝贵的军事经验。"
 CHI_LAR_Camouflage_Volunteers:0 "伪装志愿军"
 CHI_LAR_Camouflage_Volunteers_desc:0 "秘密军队是缺乏磨练，而学习如何对付日本人的最好教材就是日本人。秘密军队将会伪装成马家军，直面我们的宿敌。"
 CHI_LAR_Refugees_Move_East:0 "难民东迁"
 CHI_LAR_Refugees_Move_East_desc:0 "西部的战乱严重影响了当地百姓的生活，士兵抢走了他们的粮食，战火摧毁了他们的家园，他们只能逃往我们的境内。出于人道主义，这些难民将会被安置并且会得到帮助。而这些也将为我们收回西部提供舆论支持。"
 CHI_LAR_Negotiation:0 "谈判"
 CHI_LAR_Negotiation_desc:0 "西部的战争终于结束了，马家军出乎意料地取得了胜利，日本人离开了西部，现在轮到我们来处理结果了。\n\n日本准备再次集结军队发动进攻，马家军也切断了与我们之间的联系，战火又将再一次点燃。总统亲自出面表示反对再启战端，愿意以谈判的方式来解决问题。尽管日本军方十分傲慢地否定了提议，而日本内部的部分文官却愿意采纳，他们为我们争取了时间。现在，我们将主动与马家军谈判。"
 CHI_LAR_Vengeful_Qinghai:0 "复仇的青海"
 CHI_LAR_Vengeful_Qinghai_desc:0 "杀父之仇，如此刻骨铭心的仇恨只能用敌人的血来洗刷，现在马继援终于做到了，把强盗们赶出了自己的土地。如今马家军选择顺从于国民政府只是迫于现实，所以他们的心并没有真正服从。不过这样就足够了，我只需要一个能在战争中痛击敌人的朋友。\n\n青海等待着再一次复仇，等待让民族仇恨化作怒火再一次吞噬敌人。"
 CHI_LAR_invite_Fu_Zuoyi:0 "邀请傅作义"
 CHI_LAR_invite_Fu_Zuoyi_desc:0 "傅作义在早年是就是闻名的将军，但就在中日刚刚议和时就他和阎锡山积极地投向日本，人们指责他是卖国的叛徒，可人们更希望他是忍辱负重的勾践。\n\n毋庸置疑的是，傅作义是爱国的，他精心治理着两省，放任爱国言论，哪怕是中共，只要他们依然热爱祖国，傅作义也允许他们存在。他等待着机会，他已经为了这个机会放弃荣耀多年了，我们将给予他这个机会。"
 CHI_LAR_Transfer_of_Military_Power:0 "转交军权"
 CHI_LAR_Transfer_of_Military_Power_desc:0 "和傅作义的谈判相当顺利，这位年近八十的老人已经同意山西回归。既然山西已经要回归中央管理，山西的军队也理所应当收归中央军。但是军阀部队处处立山头拉帮派令我们无法有效管理。为了提高新整编部队的战斗力，我们必须彻底控制前陕西军队的指挥权。"
 CHI_LAR_Economic_Integration:0 "经济整合"
 CHI_LAR_Economic_Integration_desc:0 "山西已经在名义上服从中央统治，接下来我们应当处理山西和中央的经济问题。山西拥有极其丰富的煤炭资源可以用来发电，这恰恰是经济发达的沿海地区所急缺的。我们要整合山西的经济来融入民国的经济，将山西变成中国的发动机。"
 CHI_LAR_CCP_Sympathizers:0 "中共同情者"
 CHI_LAR_CCP_Sympathizers_desc:0 "陕北曾经是中共的根据地，尽管这群赤色分子已经离开这片土地近三十年的时间，他们的领袖也在那场惨烈的战斗中牺牲，但他们曾经高效民主的统治仍然令无数民众怀念他们。而且在黄土高原的千沟万壑当中，依然有坚定的赤色分子在进行抗日运动。这片深厚的红色土壤之下，埋藏着红色的幽灵，而这幽灵，也深藏在无数民众的心中。如何面对无处不在的中共同情者，是我们必须处理的问题。"
 CHI_LAR_Suppress_Sympathizers:0 "打压同情者"
 CHI_LAR_Suppress_Sympathizers_desc:0 "我们需要山西的稳定，而这些赤色分子以及他们的信仰无疑会侵蚀山西民众的内心，我们应当重拳出击，让这些同情者明白只有国民政府才是中国的希望！他们必须相信国民政府。"
 CHI_LAR_Ignore_Sympathizers:0 "无视同情者"
 CHI_LAR_Ignore_Sympathizers_desc:0 "虽然中共和我们的信仰不同，但是他们坚定的反日，这同样利于民众投入到抗日的斗争之中。面对这群红色的幽灵，和时时刻刻禁锢着我们的枷锁，我们还是决定先斩断枷锁，而这同样需要同情者们的合作与帮助。而赤色分子对日本人的骚扰也是我们乐意看见的。无视他们的动作，默认他们的行动是我们最佳的选择。"
 CHI_LAR_Incite_Hatred_of_Japan:0 "煽动仇日情绪"
 CHI_LAR_Incite_Hatred_of_Japan_desc:0 "山西紧邻西北方面军，而西北方面军的残暴是令所有人胆寒的。他们烧杀抢掠无恶不作，因此山西人民对西北方面军乃至日本人的仇恨都是极为深刻的！我们要利用这种情绪，并且激化这种情绪，这样山西人民就会更加团结起来并投入到为中国的真正解放之战的准备之中去！"
 CHI_LAR_Revengeful_Shanxi:0 "雪耻的山西"
 CHI_LAR_Revengeful_Shanxi_desc:0 "经过我们的努力，山西已经彻底归于中国的控制之下。他们将输送源源不断的资源推动我们的经济，也将在战争中为祖国奋斗。\n\n存在主义思想让山西屈辱地生活了几十年，他们痛恨着耻辱，痛恨着给与他们耻辱的日本人。耻辱不可怕，放弃洗刷耻辱才可怕。山西将会抓住我们给予他们的机会，用敌人的血来洗刷他们的耻辱。"
 CHI_LAR_Redistribute_The_War_Zone:0 "重划战区"
 CHI_LAR_Redistribute_The_War_Zone_desc:0 "军阀们逐渐回归之后国民政府能够控制的地区扩大了许多，为了更好地控制军队，分配军事力量，国民政府必须重新将目前控制的地方划分成不同的区域来管理。"
 CHI_LAR_Transfer_Officer:0 "调任军官"
 CHI_LAR_Transfer_Officer_desc:0 "各个军阀在其原来的地盘拥有着复杂的势力网，要想真正控制这些地方就要逐步消除他们的势力。在划分不同的战区的同时也是将那些军官们调离的好时机，同时也让我们能加强中央的控制力。"
 CHI_LAR_Negotiations_with_Tibet:0 "与西藏谈判"
 CHI_LAR_Negotiations_with_Tibet_desc:0 "辛亥革命以来，国民政府都没有实质性地控制西藏，并且西藏在战后就宣布独立了。西藏自始至终都是中国的领土，我们有充分的理由要求他们回到中央的控制，将会与他们举行协商讨论如何回归。当然，我们仍将拥有采取军事行动的权利。"
 CHI_LAR_Negotiations_with_Tibet_tt:0 "我们将会邀请西藏政府的首脑们进行会谈，希望能够以此达成西藏自治的协议。"
 CHI_LAR_Military_Operations:0 "军事打击"
 CHI_LAR_Military_Operations_desc:0 "本质上西藏和其他不服中央的军阀一样都是叛乱省，用军事行动来收回就是天经地义的选择。而西藏内部的政治制度可怕到令人作呕的地步，我们也有义务消灭西藏的政治制度，建设一个现代的，人道的西藏。"
 CHI_LAR_Autonomous_Tibet:0 "自治的西藏"
 CHI_LAR_Autonomous_Tibet_desc:0 "我们终于收回了脱离中国控制多年的西藏，现在如何治理西藏成为了一个问题。由于当地更多的是藏族人民，能更好地管理西藏的目前只有他们自己。我们将建立一个由中央派人监督，西藏人民自治的政府。在将来我们会采用新的方法来让西藏更加受到中央的控制。"
 CHI_LAR_Unify_Road_Standards:0 "车同轨"
 CHI_LAR_Unify_Road_Standards_desc:0 "为了更好地在各个省之间来往，道路的连同和建设时必不可少的。只要道路畅通无阻，无论是对于政治还是对于经济而言都是大有裨益的。"
 CHI_LAR_Unify_Frastructure:0 "同标准基建"
 CHI_LAR_Unify_Frastructure_desc:0 "经济上的紧密联系会使各省越来越无法与我们分离。建设相同的基础设施，不仅会促进当地的发展，也会让整个国家内部更加统一。"
 CHI_LAR_Half_a_Begonia_Leaf:0 "半片秋海棠"
 CHI_LAR_Half_a_Begonia_Leaf_desc:0 "曾几何时，我们将中国地图爱称为秋海棠叶，因为她就像秋海棠一样美丽。一场痛苦难忘的战争之后，中国就变得山河破碎，美丽的秋海棠叶被肢解，中华民族自此臣服于旭日之下。\n\n我们正试图一片片地将祖国拼凑回当初的模样，中华民族正一点点抬起自己的头颅，而现在，我们已经将拼好了半片秋海棠。我们不会止步于此，我们会继续前进，中华秋海棠终将再归一统。"
 CHI_LAR_Half_a_Begonia_Leaf_trigger_tt:0 "已完成£GFX_LAR_CHI_mil_progress_texticon §Q军事改革§!。"

 CHI_LAR_Appointment_With_Liu_Wenhui_tt:0 "帮助§M西康§!进行建设不仅能够让他们更加亲近§W我们§!，还能提高§W我们§!与§M马家军§!的联系，改善§L运输条件§!，让§W我们§!能够在他们陷入危机时伸出援手"
 CHI_LAR_Wooing_Lower_level_Officials_tt:0 "§W我们§!将加强对§M西康§!的控制，§Y接下来的建设任务将更加顺利!§!"
 CHI_LAR_Resident_Officials_tt:0 "被派往的官员将加强§W南京§!对§M西康§!的控制，§Y同时也会协助£GFX_LAR_CHI_supply_route_smooth_rate_texticon §L运输任务§!§!"
 CHI_LAR_Support_Ma_Jiyuan_tt:0 "西北突发的冲突是一次危机，也是一次机遇，或许，§W我们§!能够借此收复西北地区……"
 CHI_LAR_Stick_Out_an_Olive_Branch_tt:0 "与§M马家军§!的联系将被建立：£GFX_LAR_CHI_supply_route_smooth_rate_texticon §L路线畅通率§G增加10%§!§!，§W我们§!§R将能够派出一支军队来帮助§!§M马家军§!"
 CHI_LAR_Refugees_Move_East_tt:0 "提供人道主义援助将允许§W我们§!直接进入§M青海§!，这将使西北的百姓更加亲近§W我们§!，也为运输行动提供了便利：£GFX_LAR_CHI_supply_route_smooth_rate_texticon §L路线通畅率§G增加10%§!§!"
 CHI_LAR_Advisers_Westbound_tt:0 "面对强大的§x西北方面军§!，§M马家军§!需要符合现代的军事建议"
 CHI_LAR_Provide_War_Materiel_tt:0 "战争需要大量的武器和装备，为了胜利，§W我们§!将尽可能提供给§M马家军§!武器，§G路线畅通率增加10%§!"
 CHI_LAR_Negotiation_tt:0 "西北战争的帷幕终于落下，§B人§!与§B马§!倒在了§R枪§!与§R炮§!之下，§Y风§!与§Y沙§!也将埋葬§x血§!与§x肉§!，但真正的和平还没有到来。接下来决定西北百姓命运不再会是子弹而是言语，一场万众瞩目的§x谈判§!将决定他们的未来。"

 ####  Social Reform Tree  |  社会改革国策  ####

 CHI_LAR_The_Urgent_Reform:0 "刻不容缓的改革"
 CHI_LAR_The_Urgent_Reform_desc:0 "自中东的暴乱发生之后，动荡的风波已经席卷了中国太久太久，以至于人们几乎习惯了新的生活的模样，尽管他们是被迫的。每天早上坊市依旧喧嚷，之前是来自摊贩与顾客，如今是来自游行的人群。我们自西南戡乱以来所竭力赢得的信誉，我们所建立起来的关于现代化的一切，正和油箱里面的柴油一样逐渐见底……血管被割开了，遍体鳞伤，血流如注。\n\n我们该做点什么了，要快。汽油会有的，不限号会有的，晚上的灯光也会有的……"
 CHI_LAR_Radical_Reform:0 "刮骨疗毒"
 CHI_LAR_Radical_Reform_desc:0 "最终陶希圣撞开了高宗武心里的最后一层顾虑。南京事件的余波至今依然深深地影响着中国的每一个人，甚至让街头巷尾的贩夫走卒都渴望那烟熏硕鼠的弥天大勇。他们或许日日夜夜在狭小的屋子里咒骂着总统府里的满座高朋，但你知道你只有他们可以依靠。人民渴望公正，渴望自由，渴望劳有所得，渴望抬起头来活着。那些纸牌屋里衣冠楚楚的贵胄大贾，那些振振有词“必信必忠”、“一心一德”的人，稍有异变就会一拥而上，把你和你苦心维护的立法院、你的中华民国再撕成一具白骨。"
 CHI_LAR_Land_Redemption:0 "土地赎买"
 CHI_LAR_Land_Redemption_desc:0 "高宗武知道他自己在做什么，他在做一个古往今来都从未完成的任务。历朝历代，从秦皇汉武唐宗宋祖，乃至康乾三代，一个又一个地向土地低下了头。每当天下再没了闲田的时候，那个名叫“土地兼并”的幽灵，就飘荡在了每一个统治者的头顶，无论他叫皇帝，将军，总统，总理…还是委员长，然后便再无安安饿殍，遍地奋臂螳螂。\n\n土地问题是烫手的山芋，可要想为现代化的成果扫清障碍，要想将中国社会的面貌彻底扭转过来，就要从乡土开始。放眼望去，华北平原上豪强横行，东南群山里遍布日资工厂，我们的头顶上还高悬着烈日……完成这项任务的前途茫茫，但我们不是水上担忧倾覆的行舟，不是那些认为“民可使由之，不可使知之”的劳心大儒，团结的中国不应只在庙堂之上。\n\n我们会正视农民的呼声，让我们微笑着，把堕落的日本走狗一步一步地逼到悬崖边上。"
 CHI_LAR_Land_To_The_Tiller:0 "耕者有其田"
 CHI_LAR_Land_To_The_Tiller_desc:0 "不得不承认的是，现代化的爆炸式进步确实让一部分农村的人地矛盾得到了缓解，但当这“二十年的和平”过后，土地兼并的事实仍旧狰狞，仍旧残忍。“皇权不下乡”，代表着基层动员能力的短板，代表着上层的文职官僚和下层的自治乡村社会之间虚假的“三明治的和平”，代表着我们事实上只是如法王一般统治着一群法兰西岛之外的贵族土王。\n\n立法院将拟定出台五十年代的《耕者有其田法》修正案，我们得进行一个大工程了。让我们向农民运动“让出一大步”，然后着手重组基层。"
 CHI_LAR_Golden_Surge:0 "金黄浪涌"
 CHI_LAR_Golden_Surge_desc:0 "当我们提到“乡村”一词时，我们往往想到的是“蒙昧”、“破败”与“落后”，特别是当我们看到一片片破落的荒村时，很难想象到曾经丰年里它们富庶的样子。这归功于几十年来难以逆转的乡村空心化：精壮劳动力在向城市流失，孩童为了更好的教育也只能离开家乡前往城镇，留下来耕种土地的只剩下妇女和老人，粮食的产量也越来越难以增长。虽然千家万户的事情总是千头万绪无从抓起，离开家乡的理由也千姿百态，但是在现代技术的帮助下人们也将慢慢回到乡村。新农村里化肥逐渐推广开来，轰鸣的拖拉机正在协助收割和运输，土坯房也慢慢被砖瓦房取代，这些告诉了我们一群骄傲的新农民正在挺身站起。\n\n如果你想问，那个团结的中国在哪里，那就请看那蓝天下翻涌的金黄稻浪；如果你想问，那个自由的中国在哪里，那就请看那大河边麦田里那秆上的麦芒。"
 CHI_LAR_Moderate_Reform:0 "适可而止"
 CHI_LAR_Moderate_Reform_desc:0 "你知道你们将在钢丝上起舞，你们将在纸牌上起舞，你们将在火药桶上起舞，一着不慎，满盘皆输，粉身碎骨，万劫不复。直到你安全地走下钢丝的另一端，直到你可以再无顾忌地把这该死的纸牌屋烧个精光，直到那火药桶沉进东海……你都如履薄冰，每一日，日复一日。那些人的支持对于我们依旧不可或缺，让一切各得其所好了，至少我们的力量每一天都在稳健而不可逆地潜滋暗长…\n\n这一切都是值得的，一定。"
 CHI_LAR_Old_Bottle_New_Wine:0 "旧桶新酒"
 CHI_LAR_Old_Bottle_New_Wine_desc:0 "华北平原上横行的地主，名义上是国民政府派去的村长，其实却是剥削农民的土皇帝。几十年来农民们都叫苦不迭；现在他们盘踞在土地上，也给我们的农赈，以工代赈的工作带来了极大的麻烦。我们建立了一些新的制度，来确保赈济的同时不受这些士绅的打搅——当然，我们还没有能力和足够的公务人员来完全取代他们在农村的地位，所以只能采取一些其他的办法,谈话，威胁，贿赂……怎样都可以，只要这些士绅能把手里的地拿给国家就好。"
 CHI_LAR_Cultivating_The_Barren_Land:0 "开垦去荒"
 CHI_LAR_Cultivating_The_Barren_Land_desc:0 "乡村的人地矛盾远远未达到不可调和而一触即发的地步，我们根本无需对那些地主动刀。我们也仍旧需要地主和本土实力派的支持，贸然行动，只会令本就在危机中无法自拔的政府伤筋动骨。我们完全可以将人地矛盾引导向我们所期望的地方——政府将鼓励农民，去开垦无主的荒田荒地，以现代的技术与工具，和古老的智慧和坚毅。\n\n我们将进行一场新的摊丁入亩——从农民，到国家，都需要更多的土地、更多的矿藏，来度过黑暗中的岁月。"
 CHI_LAR_Grassroots_Expansion:0 "基层扩张"
 CHI_LAR_Grassroots_Expansion_desc:0 "在新确立的开垦制度下，分流的农村人口将像一百年前一样，建起星罗棋布的，大大小小的新村镇。基层官僚机构的扩张虽然可能带来基层的腐败，但我们对于土地的控制也在稳步增长，带来的行政能力提高能够缓解农民对我们的不满。\n\n稳定住农村就能带来稳定的粮食产出，也就能稳定住整个社会，基层官僚的扩张确实会带来新的问题，可它能为乡村带来稳定，那么这就是一次利大于弊的选择。同时，得益于对基层控制能力的加强，在下一次发生类似的情况时我们也能够更加轻松地处理危机危机。"
 CHI_LAR_No_More_Tolerance:0 "无须再忍"
 CHI_LAR_No_More_Tolerance_desc:0 "这场闹剧是时候该结束了，它早已卷入了太多不该卷入的东西：总统的案头上，东京方面的质问早已堆成了小山；立法院里，每天也有那些无论进步还是保守的议员不长眼睛地站起来，把这里或者那里出现的这样或那样的事情扣在对方的头上；坊间还传着我们早被满洲特务渗透了个进进出出……搞得高宗武都有点怀疑自己的特勤是不是真的吃干饭。\n\n我们该把目光转向闹剧本身了，要么安抚他们，要么让他们闭嘴。"
 CHI_LAR_Win_Over_The_People:0 "金口玉言"
 CHI_LAR_Win_Over_The_People_desc:0 "我们不会做什么“防民之口甚于防川”的勾当，毕竟那条随时会冲下来的“大川”早就摆在我们面前。对我们而言，民意汹涌不是一件坏事，就像南京危机时一样，它恰恰证明在教育的现代化下，中华民族已经是自强而骄傲的了，并且我们确信，每当危机重临之时，这数万万同胞还会重新起来，像黄河一样咆哮。\n\n我们会接纳一些立法院里激进的热血小年轻们喊破喉咙的主张。现代化的成果要惠及每个人本身，就要让他们，乃至街头巷尾每个人的呼声被真正尊重而热切地审视。每次看到这些的时候，高宗武想起了四十多年前那次五四运动。"
 CHI_LAR_Reward_For_Labor:0 "劳有所得"
 CHI_LAR_Reward_For_Labor_desc:0 "看看这些人吧，那些早晚两头黑，一周见一次太阳的人；那些在十多层楼高的脚手架上坐成一排顶着太阳吃着盒饭的人；那些起早贪黑推着早点摊站在十字路口盯着城管的人；那些正在节衣缩食一点点地为孩子积攒着学费的人……看一看，现代化，多少罪恶假汝之名以行。\n\n我们一味强调了效率，却忽视了公平；只知道回避旭日的凝视，却忘了天视自我民视，天听自我民听。无论如何，我们承担不起“不惜一切代价”的代价了，上下一心…同仇敌忾。"
 CHI_LAR_Healing_For_Wound:0 "伤有所养"
 CHI_LAR_Healing_For_Wound_desc:0 "或许我们只要把前线的野战医院的架构摆到生产中来，完善上到司法下到慈善的福利制度，工伤者就不再是被一沓钱买走了一条腿。能够让济贫院里的孩子也保证有学上，“鳏寡孤独废疾者皆有所养，男有分，女有归……”。多好的理想，可我们并非复古三代之治。\n\n这些伤残者受到过这样那样的不公，或者说，他们的身体，已是现代化“阵痛”的力证。对一个残障者的救济不仅仅拯救了他本人，也拯救了一个个的家庭——对伤残者的照顾，不会再是一件天塌下来的事情，他们的家人不必再蒙上一层“照顾余生”的阴霾，而政府的大力救济，与民众的小心监督，将解放消费、解放岗位，让一个个家庭再度敢于追梦。\n\n想法很好，但我们的财政实在太紧了。所谓的救济制度也就只能搭上一个框架，至于彻底落实这个制度，那就是我们能力范围之外了。"
 CHI_LAR_Wipe_Out_The_Enemy:0 "犁庭扫穴"
 CHI_LAR_Wipe_Out_The_Enemy_desc:0 "常言道大灾之后必有大疫，沧海横流之中，有得是涌现出来的辈出英雄，也有得是如蚁附膻的成群蠹虫。真正的石油“危机”不只是石油短缺带来的影响本身，而是打砸抢烧、人心离散、匪盗横行、囤积居奇。特勤会配合当地治安力量，通过一些手段，把潮水退去之后的跳梁小丑们…连根拔起。"
 CHI_LAR_Execute_A_Warning:0 "以儆效尤"
 CHI_LAR_Execute_A_Warning_desc:0 "那些死性不改的华北派老顽固们，他们吃定了软弱人，可惜的是，我们并不软弱。国安局将调查他们的关系网与资金来源，尽管这是一个路人皆知的事情，但敲山震虎的时候到了。\n\n当然，还没有到把这群人连根拔起的时候。但拉起一派，打掉一派，把一些人制服，让另一群人噤声——至少现在是这样。让他们暂时闭嘴。"
 CHI_LAR_Influence_In_The_Shadows:0 "暮夜怀金"
 CHI_LAR_Influence_In_The_Shadows_desc:0 "目的，总是为手段赋予了正义的嘛。那些立法院中的反对派，我们总可以让他们闭嘴几天再去“颠倒黑白”。至于手段，古已有之，天知地知，你知我知。\n\n张仁蠡帐下的那些文人和我们特勤已经算是老熟人了，这些人嘴上满口“泛亚主义”，心里一肚子男盗女娼。只要钱财和态度到位，他们乐意做任何事，就算有死硬派，铁拳也会让他们闭嘴——风波过后，留得秋后算账。"
 CHI_LAR_Dust_Settled:0 "尘埃落定"
 CHI_LAR_Dust_Settled_desc:0 "街头人潮已经几近平息，我们的锐意改革的决心与巨大的让步，重新赢得了老百姓的信任与支持。民众纷纷回到各自的工作岗位，美好的明天等着你，等着我，等着中国。"
 CHI_LAR_Nothing_Happened:0 "无事发生"
 CHI_LAR_Nothing_Happened_desc:0 "今天的立法院静悄悄。一小撮仍旧在和政府阳奉阴违的反对派，终于罕见地，投下了他们的赞成票。得益于我们的一些来自行政和特勤方面的压力，他们已是降的降，调的调——华北派准会发现他们的一些关系已经受到了威胁。\n\n表面上波澜不惊却内里波诡云谲的立法院，我们现在只好牺牲一些原则，让它如臂使指。"
 CHI_LAR_Stable_And_Improved:0 "稳中向好"
 CHI_LAR_Stable_And_Improved_desc:0 "料峭的春寒过去了，整片田野又是草长莺飞。街头已经渐渐恢复了正常的生产生活秩序，我们的石油供给也在稳步地恢复，黑亮的血液为工厂带来的充足的动力和原料，每一条马路上又变得川流不息；到处是和睦的乡里，到处是劳动的工人……阔别已久的那“正常”的生活回来了，泉涌的黑金之上都是泉涌的热泪。\n\n中国无法时时刻刻四海承平。但放眼我们一路走来的日子里，每一次危机都令中国更加团结、更加强大——我们有同自己的敌人血战到底的气概，有在自力更生的基础上光复旧物的决心，有自立于世界民族之林的能力。\n\n我们一定有。"
 CHI_oil_crisis_has_resolved_trigger_tt:0 "石油危机已被化解"
 CHI_Social_Reform_successful_trigger_tt:0 "社会危机业已平息"

 CHI_social_crisis_abated_trigger_tt:0 "当前的£GFX_LAR_CHI_government_prestige_texticon §W政府声望§!足以继续支撑我们对石油危机的干预"

 CHI_LAR_Radical_Reform_tt:0 "§W我们将专注于更彻底的改革。§!"
 CHI_LAR_Moderate_Reform_tt:0 "§W我们将专注于平息明面上的事态。§!"

 CHI_LAR_Grassroots_Expansion_tt:0 "\n§G立即添加等同于当前£GFX_LAR_CHI_government_prestige_texticon §W政府声望§!的政治点数。§!"


 ####  Great Asian War Prepare Tree  |  大东亚战争预热国策  ####

 CHI_LAR_The_Of_Summit:0 "峰会结束"
 CHI_LAR_The_Of_Summit_desc:0 "举世瞩目的南京峰会迎来了最糟糕的结尾，狂妄自大的日本帝国又一次彻底否决了我们的合理要求，拒绝让中华民族得到统一，还幻想能像以前一样把中国人踩在脚下，肆意地蹂躏中国人的尊严，而现在，他们不再是刀俎，我们也不再是鱼肉。\n\n蓬勃发展的中国经济取得了举世瞩目的成就，哪怕与日本相比都能做到望其项背，可日本人只是傲慢地把这当作他们善意的施舍，否定了我们的努力，等到我们想要取得与经济地位相对等的政治地位时日本人又一次拒绝了，在他们的眼里，我们似乎只能卑躬屈膝地做他们的奴隶。\n\n妥协和让步不会让狂妄的敌人给予我们尊重和独立，谈判的破裂就意味着若想维护中国合法合理的权利，夺回中国本应拥有的一切只能通过暴力，向世界证明我们已经有足够的能力来换取世人的尊重。当然这不会是最好的选择，因为这将会是残酷和血腥的，但为了自由和解放，我们必须要面对即将到来的暴风骤雨。"
 CHI_LAR_Focus_On_Domestic:0 "聚焦国内"
 CHI_LAR_Focus_On_Domestic_desc:0 "外交任务推进的同时，也不能忘记处理国内大大小小的问题，要想击败难以应付的强敌没有内部的稳定和团结是不可能的，只有在国内做好合理的规划和完善的部署才能激发出全部的战争力量。\n\n首先，民众们对目前的状况有着多种多样的看法，分歧的严重性已经到达了不得不处理的地步，并且对内的宣传也会引起外部的意见，假如不能统一意见否则我们不仅将会是一盘散沙，在国际上也会孤立无援。其次，强烈的政治动荡传导了经济层面，大大小小不同企业的营业额遭到了重创，企业家们个个焦头烂额，像无头苍蝇一般不知所措，如果不能稳定经济那么整个社会都将处在崩溃的边缘。\n\n最后，也是最重要的，就是制订合适的战争计划。尽管中国的领土还没有完全恢复，但领土面积依然是世界上名列前茅的，这为我们提供了敌人完全没法拥有的战略纵深。据此条件，我们将中国分成了三个部分：沿海及与敌方交界的边境地区，富饶且较为安全的中部地区，作为最后抵抗堡垒的西部地区。三部分的地区特点各异，在战争中将有不同的地位，扮演不同的角色，如此安排，无论是在优势中进攻还是在劣势时防御都能充分迸发出中国每个地区的战争潜力，互帮互助，有机统一，构建出中华民族新的战略长城。\n\n"
 CHI_LAR_Dilemma_Of_The_Sea_And_Defenselessness:0 "有海无防的困境"
 CHI_LAR_Dilemma_Of_The_Sea_And_Defenselessness_desc:0 "漫长的海岸线是自然给予中国的礼物和恩赐，但中国目前的海军还不能保护这笔恩赐免受敌人的侵扰，尽管无奈，这依然是骨感的事实。海军官兵们愿意拿出勇气面对强大敌人，这值得称赞，可惜再大的勇气也不能弥补敌我之间令人绝望的实力差距，那么在称赞的同时我们也要寻求困境的解决办法，分担海军的压力。\n\n解决问题的方法不一定只有一种，其他解法或许不够完美却依然有效，而我们也将寻求其他的方案解决海防危机。当然，任何计划在实施前也要思考最坏的结果是什么，海防力量全灭的可能性不是没有，我们也必须做好反登陆准备，在滩涂上与日军决一死战。"
 CHI_LAR_Glimpse_On_The_Sea_Sky:0 "海空掠影"
 CHI_LAR_Glimpse_On_The_Sea_Sky_desc:0 "曾几何时，只凭海中巨兽即可主宰海洋，只可惜当空中铁鹰问世后海洋不再只由舰船主宰了。同理海军的短板也可以试图通过建设空军来弥补，面对敌人强大的海军时我们也将不会束手无策。日本帝国海军拥有世界上最强的航母舰队，世界上能与之匹敌的只有太平洋彼岸的美利坚舰队，但他们不可能提供直接的帮助，我们只能孤身直面日本航母的锋芒，用更加强大的空军保护我们的海空。\n\n有人会说这只不过是蚍蜉撼树，但我们无所畏惧，哪怕将赤红的鲜血洒向湛蓝的海空，我们保卫祖国的信念会让我与我的身躯将和铁鹰融为一体，化作子弹射向来袭的巨兽。"
 CHI_LAR_Lightning_From_Shore:0 "岸火惊雷"
 CHI_LAR_Lightning_From_Shore_desc:0 "科技的进步让“御敌千里之外”这种战争设想成功步入现实，利用导弹即可击溃远在地球另一边的敌人，因此导弹就成为了保卫国家安全的利剑。导弹的种类有很多，其中一种导弹——岸舰导弹能够有效针对海上来袭的敌人，唯一的问题就是中国暂时没有这方面武器，但可以相信，勤劳智慧的中国工程师可以运用已有的导弹经验最快地研制出来岸舰导弹，让来自陆地的火焰焚烧海上的造物。"
 CHI_LAR_Weapons_Of_Wuhan:0 "江汉锋镝"
 CHI_LAR_Weapons_Of_Wuhan_desc:0 "前线武器装备的首要来源是处在前线的省份，但仅凭他们自己绝无可能完全满足战争需求，那么就需要远离战火的省份源源不断地提供武器。\n\n作为自清朝以来的现代武器生产中心，武汉制造武器的能力首屈一指，处于中部地区也能够免受战火侵扰，工业机器也能全速运转。得天独厚的地理条件也方便了武器的运输，既能沿着长江运输到滨海地区，也能通过铁路北上南下，大后方制造的武器也可以借道武汉送往四面八方，武汉将成为全中国的武器运输中心。"
 CHI_LAR_Industruction_Of_Chongqing:0 "天府重工"
 CHI_LAR_Industruction_Of_Chongqing_desc:0 "重要的工业生产线暴露在敌人的打击范围内是相当致命的，将它们统一转移到后方才能保障安全，众多城市之中，坐落于四川盆地的成都是转移目的地的最优选择。\n\n负有“天府之国”盛名的成都是西部最大的城市，其本身的工业能力能够允许其接手各种各样的工业生产线，当工业转移完成，作为第三阶梯的核心，成都将会是中国最后的堡垒。"
 CHI_LAR_The_fire_of_public_opinion:0 "舆论之火"
 CHI_LAR_The_fire_of_public_opinion_desc:0 "中日之间紧张的关系让所有人屏息，人们感觉到似乎一切正在不可避免地滑向恐怖的战争，风起云涌之时，所有人都预见了即将到来的风暴，而置身于风暴中的将是我们所有人。\n\n每个人对战争有着自己的态度，有人渴望战争带来地位、尊严、荣誉、权力，有人认为战争将会毁灭它们拥有的一切，更多的人则是摇摆不定，对于未来不知所措。当不同的意见在社会上开始碰撞，语言的火花点燃了舆论的火焰，社会开始割裂，稳定将不复存在。如果不能压制熊熊燃烧的火焰，国内将变得无比动荡，同时，如果将舆论引导向我们希望的方向，那么舆论将为战争机器提供源源不断的动力。"
 CHI_LAR_truth_of_Pan-Asian:0 "泛亚“真相”"
 CHI_LAR_truth_of_Pan-Asian_desc:0 "尽管这几十年以来日本人一直在宣传所谓的“泛亚主义”、“东亚共荣”，但实际上他们的所作所为与他们所说的完全背道而驰：他们宣称自己是为了赶走殖民者而战，然而当西方人被赶走之后他们就立即鸠占鹊巢，到处建立军政监，肆意屠杀当地居民；他们宣称将会解放亚洲人民，可东北和广东的百姓们无时无刻不被奴役着，消耗着生命满足他们无穷无尽的欲望，好让他们过上纸醉金迷的生活。\n\n在日本人的“泛亚”里，“共荣”的是他们自己，其他人则是代价，而深受日本人荼毒最深的就是我们中华民族。我们必须反抗，必须战斗，必须向世人揭示这数十年骗局的真相！"
 CHI_LAR_our_Pan-Asian:0 "我们的泛亚"
 CHI_LAR_our_Pan-Asian_desc:0 "日本人的表里不一并不意味着泛亚这种思想是错误的，实现亚洲人民互帮互助，携手共进的前提是亚洲各国互相尊重领土主权、互不侵犯、互不干涉内政，而不是一国明面上宣扬平等，实际上却在进行着帝国主义殖民行径。\n\n曾经虚伪的泛亚必须被丢尽历史的垃圾桶里，为了全亚洲人民的未来，真正平等的亚洲必须建立起来。中国将率先举起平等的旗帜，带领亚洲人民走向真正的互利互惠、和平共处的美好未来！"
 CHI_LAR_our_Pan-Asian_tt:0 "获得§Y泛亚解放同盟§!\n效果:\n稳定度[?CHI_GAWMUP_Liberation_Alliance_stability_factor|=%+]\n\n§Y此国家精神会随着前共荣圈国家加入我方阵营而逐渐增强。§!\n"
 CHI_LAR_decoupling_in_progress:0 "脱钩进行时"
 CHI_LAR_decoupling_in_progress_desc:0 "峰会的结果表明了中日之间的关系不再像以前一般，中国将要寻求更高的地位，更多的利益，这意味着争夺，意味着政治将延伸为战争。率先感受到变化的是商人，他们将国外的企业逐渐召回，纷纷关闭外地工厂，采用本国产品替代外来产品，只为了彻底摆脱与对方的关系，而无数企业都开始做同样的事时，经济脱钩就开始了。\n\n几十年的共同发展让中日的经济如同连体婴儿一般骨肉相连，如果要割肉断骨，彻底断绝与对方的经济联系无异于走向自杀，但当时我们选择这一切时，就已经和仇敌一起走上了毁灭之路，比拼的就是谁的太阳最后落下。"
 CHI_LAR_Economic_Internal_Circulation:0 "经济内循环"
 CHI_LAR_Economic_Internal_Circulation_desc:0 "如果不是迫在眉睫的危机，中国也不会认为有一天将再一次回到内循环的经济状态，只不过上一次是因为愚昧，这一次是为了自卫。\n\n外资企业的撤出以及进口工业产品的极度下降逼迫我们不得不独自完成所有工业上的每一个环节，尽我们所能来替代外国产品。然而依然有大量产品无法被立即替代，导致下游产品的生产完全停滞，市场供应严重不足。并且，原先被外企雇佣的员工猝不及防地成为了失业人口，现有企业也没办法雇佣更多的工人，国内需求也大幅度萎靡。\n\n可以说问题很多，但至少，我们已经了解了奋斗的方向，简单概括就是让生产者和消费者都变成自己，自己的需求自己满足，让需求刺激供给，供给刺激需求，完成内部正反馈循环，在经济上做到独立自主。"
 CHI_LAR_Flood_into_rivers:0 "漫水入百川"
 CHI_LAR_Flood_into_rivers_desc:0 "外贸出口也因为与日本脱钩的关系面临着有史以来的寒冬。中国制造的产品绝大多数都是低端的日常生活用品，其生产数量远远超过了国内的需求量，产品的积压再次降低了自身的价格，进一步恶化了企业的经营环境，更多的人也因此失业。\n\n产能过剩就像大水淹没的堤坝，疏与堵应当同时进行。首先要尽可能向外寻求出口，缓解产品积压，让原有的工厂重新运转起来，让工人回到岗位，接着就要将生产能力转向其他方面，要么转向军事生产，要么升级产业，由生产低端产品转向生产高端产品，将漫出的水引向其他地方。\n\n漫水入百川，百川东到海，问题自解，可重点是如何引水入川。外部的购买力同样萎靡，想要售出可能只有低价贱卖，产业升级同样也不是一蹴而就的，能否完成向高端产业的跨越依然是一个未知数。"
 CHI_LAR_Flood_into_rivers_tt:0 "§Y泛亚解放同盟§!新增效果：\nGDP增长率[?CHI_GAWMUP_Liberation_Alliance_gdp_growth_modifier|=%+]\n通货膨胀率修正[?CHI_GAWMUP_Liberation_Alliance_inflation_rate_modifier|=%-]\n"
 CHI_LAR_Coming_events_cast_their_shadows_before:0 "山雨欲来风满楼"
 CHI_LAR_Coming_events_cast_their_shadows_before_desc:0 "所有人都恐惧战争、厌恶战争、批判战争，但可惜的是，我们的历史永远伴随着战争，当我们试图创造历史时，战争就如期而至。\n\n我们不会置身事外，因为这是我们的历史；\n\n我们不会逃避，因为这将决定我们的未来。"
 CHI_LAR_Friends_to_help:0 "彼岸的援手"
 CHI_LAR_Friends_to_help_desc:0 "试图挑战旭日秩序的不仅仅只有我们自己，在身旁，在远方，千千万万的人都在用不同的方式支持着我们。\n\n被日本残忍压迫的国家不止我们一个，旭日炙烤之下每一个民众都挣扎求生，苦不堪言。不在压迫中怒吼，就在压迫中灭亡，当我们第一个举起反抗的大旗时，他们同样选择拿起枪，向高高在上的太阳发起决死的抗争。\n\n远在地球的另一边，世界另外两极也同样表达了他们对我们的支持和赞许。他们在这几十年里不知道幻想了多少次落日的到来，如今我们成为了后羿射向太阳的箭矢，而他们只需要适当地施加援手即可欣赏令人满意的日暮。\n\n§m滴水之恩，定当涌泉相报。§!"
 CHI_LAR_Hump_route:0 "驼峰航线"
 CHI_LAR_Hump_route_desc:0 "世界的屋脊阻断了中国与印度交流，老旧的飞机试图翻越雪山之巅充满了危险与死亡，半数的飞机在这条航线上坠落，以至于在长达800余公里的深山峡谷、雪峰冰川间，一路上都散落着这些飞机碎片，在天气晴好的日子里，这些铝片会在阳光照射下烁烁发光，这里就成为了著名的“铝谷”。驶向这条航线就意味着半步踏进了天堂，但正义的信念支撑着二战期间同盟国飞行员依然坚持跨越喜马拉雅山脉为中国提供宝贵的援助。\n\n历史又将再次重演时，天空骑士又一次决定挺身而出，所幸时代的进步降低了飞行员们面临的危险，死亡之神终于不是时刻相伴了。但决定卷入一场战争就意味着自己与安全暂别，他们依然要在异国他乡直面死亡，只为了帮助一群素未谋面的朋友。\n\n§m勇士的灵魂像山巅之雪般纯洁，让我们为他们献上至高的崇敬。§!"
 CHI_LAR_The_call_of_blood_relatives:0 "血亲的呼唤"
 CHI_LAR_The_call_of_blood_relatives_desc:0 "小时候\n乡愁是一枚小小的邮票\n我在这头\n父亲在那头\n\n长大后\n乡愁是一张窄窄的车票\n我在这头\n新娘在那头\n\n后来啊\n乡愁是一方矮矮的坟墓\n我在外头\n父亲在里头\n\n而现在\n乡愁是一道高高的关隘\n我在这头\n中国在那头\n\n§R你听到了吗？§!"
 CHI_LAR_Take_them_home:0 "带他们回家"
 CHI_LAR_Take_them_home_desc:0 "万里长城万里长\n长城外面是故乡\n高梁肥 大豆香\n遍地黄金少灾殃\n自从大难平地起\n奸淫掳掠苦难当\n苦难当 奔他方\n骨肉离散父母丧\n没齿难忘仇和恨\n日夜只想回故乡\n大家拼命打回去\n哪怕倭奴逞豪强\n\n万里长城万里长\n长城外面是故乡\n十万万同胞心一样\n新的长城万里长\n十万万同胞心一样\n新的长城万里长\n\n§R等你们回家。§!"
 CHI_LAR_Wait_for_us_to_get_home:0 "等我们回家"
 CHI_LAR_Wait_for_us_to_get_home_desc:0 "我的家在东北松花江上，\n那里有森林煤矿，\n还有那满山遍野的大豆高粱。\n我的家在东北松花江上，\n那里有我的同胞，\n还有那衰老的爹娘。\n九一八，九一八，\n从那个悲惨的时候！\n九一八，九一八！\n从那个悲惨的时候，\n脱离了我的家乡，\n抛弃那无尽的宝藏，\n流浪！流浪！\n整日价在关内，流浪！\n哪年，哪月，\n才能够回到我那可爱的故乡？\n哪年，哪月，\n才能够收回那无尽的宝藏？！\n爹娘啊，爹娘啊。\n什么时候，\n才能欢聚一堂？！\n\n§R带我们回家。§!"
 CHI_LAR_friends_expectations:0 "友人的期望"
 CHI_LAR_friends_expectations_desc:0 "追求自由和解放、独立与尊严的口号撕裂了摇摇欲坠的共荣圈，但真正摧毁亚洲秩序的直接原因是中日两国的分道扬镳。双方在政治与经济上的冲突所产生的波动在他们眼里只是泛起的涟漪，而在其他国家眼里则是卷起的巨浪，这场风浪席卷了整个亚洲，所有国家都变得动荡不安，等人们回过神来，才发现中日已经分化成了两个剑拔弩张的阵营。野心家们蠢蠢欲动，革命者们伺机而动，风雨将至，没有人能独善其身，所有人只能从两个阵营里选择一个，进而和盟友一起同舟共济，携手同行。\n\n盟友越多，胜利的希望就越大，不仅仅是盟友希望我们能够帮助对方共克时艰，我们也希望盟友能够给予我们更多的支持和帮助，双方想要相互利用，想要相辅相成，等到利益终于一致时，所有的期望变成一句简单的话：\n\n§m要变天了，幸好，我在你这边。§!"
 CHI_LAR_flag_of_resistance:0 "反抗的旗帜"
 CHI_LAR_flag_of_resistance_desc:0 "一篇篇关于历史上日本殖民真相的报道击碎了泛亚的幻梦，亚洲人民终于看穿了日本帝国宣称共荣实则独霸的狼子野心，反抗殖民、寻求民族解放的呼声如海潮般此起彼伏。现在亚洲各国决意抛弃高高在上的暴君，曾经的共荣圈之主已是国际上的众矢之的，人们所熟悉的亚洲秩序在众目睽睽之下逐渐解离崩塌。\n\n反抗难能可贵，但反抗双方的力量实在悬殊。暴君之所以能成为暴君，是因为他拥有无可匹敌的力量，普通国家依旧难以直视天上的旭日。他们需要同一目标，同一战线的另一个庞然大物来与日争辉，于是，众人期盼的目光落到了我们身上，期盼我们能够扛起反抗的大旗，迎接亚洲的落日。\n\n另一方面来说，单打独斗也就意味着腹背受敌，我们也同样需要国际上的伙伴共同面临强敌，因此领导民族解放阵线的重担我们也绝不能推辞，反抗的涓涓细流必须汇聚在一起才能化为吞天沃日的波涛江海。\n\n§W众人试图拉下§e今日§!，托举起§m明日§!。§!"
 CHI_LAR_flag_of_resistance_tt:0 "§Y泛亚解放同盟§!新增效果：\n基础战争支持度[?CHI_GAWMUP_Liberation_Alliance_war_support_factor|=%+]\n"
 CHI_LAR_Long_night_breaks:0 "旭日如夜，长夜破晓"
 CHI_LAR_Long_night_breaks_desc:0 "曾经白日的光芒短暂地为黎民带来了未来的曙光，但国父陨落后短暂的白日也失去了本来的光辉，一切又回到了原来的灰暗；曾经我们相信东方的旭日将会带给我们的新的希望，但他们的所作所为带来的只是更加黑暗的绝望。上次世界大战里，日本人宣称要解放全亚洲，然而无数应当被解放的中国百姓被他们肆意屠杀，到战争结束后，日本人试图剥离中国最富裕的领土，随心所欲地攫取中华大地上的资源，尽情享用他们掠取来的战利品，我们却只能像案板上的鱼肉一样任人宰割。\n\n旭日炙烤之下中国早已遍体鳞伤，等到中华民族身上一道道深深的伤口逐渐结出血痂，我们才终于明白，命运必须要掌握在自己手里，未来必须由自己开拓，哪怕我们积贫积弱，我们也要竭尽全力大步向前，让这片古老的土地再次追上这时代。勤劳勇敢的中华民族用了几十载向世人展现了现代发展的奇迹，五个现代化重新点燃了希望的火种，暗淡的白日自从再次光芒万丈，即将升起的会是我们自己的太阳。\n\n再苦的痛也会迎来终结，再黑的夜也会迎来黎明。在子弹和炸药的声音里，被黑夜包裹的我们，将迎接全新黎明的到来。"
 CHI_LAR_Long_night_breaks_trigger_tt:0 "当前没有进行中的£GFX_BRA_pdc_texticon §V外交博弈§!。"

 #假国策
 CHI_LAR_Long_night_breaks_mainpage:0 "旭日如夜，长夜破晓"
 CHI_LAR_Long_night_breaks_mainpage_desc:0 "曾经白日的光芒短暂地为黎民带来了未来的曙光，但国父陨落后短暂的白日也失去了本来的光辉，一切又回到了原来的灰暗；曾经我们相信东方的旭日将会带给我们的新的希望，但他们的所作所为带来的只是更加黑暗的绝望。上次世界大战里，日本人宣称要解放全亚洲，然而无数应当被解放的中国百姓被他们肆意屠杀，到战争结束后，日本人试图剥离中国最富裕的领土，随心所欲地攫取中华大地上的资源，尽情享用他们掠取来的战利品，我们却只能像案板上的鱼肉一样任人宰割。\n\n旭日炙烤之下中国早已遍体鳞伤，等到中华民族身上一道道深深的伤口逐渐结出血痂，我们才终于明白，命运必须要掌握在自己手里，未来必须由自己开拓，哪怕我们积贫积弱，我们也要竭尽全力大步向前，让这片古老的土地再次追上这时代。勤劳勇敢的中华民族用了几十载向世人展现了现代发展的奇迹，五个现代化重新点燃了希望的火种，暗淡的白日自从再次光芒万丈，即将升起的会是我们自己的太阳。\n\n再苦的痛也会迎来终结，再黑的夜也会迎来黎明。在子弹和炸药的声音里，被黑夜包裹的我们，将迎接全新黎明的到来。"

 #tooltips
 CHI_LAR_The_Of_Summit_tt:0 "解锁£GFX_BRA_pdc_texticon §V共荣圈外交博弈§!GUI"

 ####  Great Asian War Tree  |  大东亚战争国策  ####

 CHI_LAR_War:0 "战端之始"
 CHI_LAR_War_desc:0 "随着我们的第一支装甲部队冲入满洲国的边境，伟大的东亚解放战争拉开序幕，在一团死气中被奴役的东亚人民再度拿起了武器，为自由斗争，为解放而战！\n\n双日同天，万众瞩目，这是中华民族最后的斗争，是东亚人民最后的机会。我们必须竭尽全力，这一场战争，不容失败，绝不能再败。\n\n§R敌不灭，怒不休，头可断，志不屈，若不能自由而生，吾愿战斗而死！§!"
 CHI_LAR_War_tt:0 "启动大东亚战争§D£GFX_LAR_CHI_Command_system_texticon 指挥系统§!GUI"
 CHI_LAR_National_Defense_Council:0 "最高国防会议"
 CHI_LAR_National_Defense_Council_desc:0 "我们所面对的敌人强大无匹，如今国家正处于最为紧要的关头，最为凶险的时刻，我们的每一步都如履薄冰。因此，现在绝对不能在一些鸡毛蒜皮的小事上浪费一分一秒！高总统决定关闭烦人的立法院，结束无止无休的聒噪，一切战时问题都将由总统府中的最高国防事会议处理。"
 CHI_LAR_National_Defense_Council_tt:0 "为了胜利，必须彻底清扫那些扰人的杂音！\n§a立法院§!将被§a封锁§!。"
 CHI_LAR_War_Economics_Commission:0 "战时经济委员会"
 CHI_LAR_War_Economics_Commission_desc:0 "为了全中国的解放，过去发展时期的经济政策已经不管用了。现在我们需要将全国的供应都倾向军队，以取得战争的胜利。为此我们迫切需要组建一个能够组织全国进入战时经济的委员会。来让全国都拧成一股绳，劲往一处使。"
 CHI_LAR_Acquisition_of_materials:0 "秋毫无犯"
 CHI_LAR_Acquisition_of_materials_desc:0 "在上次中日冲突中，重庆政府为了维持战争的供应，在收缴粮食和军需品时，对人民展开了残酷的剥削。我们应当温和地收购物资，在确保前线供应的同时，也不至于让后方起火。"
 CHI_LAR_Acquisition_of_materials_tt:0 "在每周结算时，我方控制战区的£GFX_LAR_CHI_war_supply_blue_texticon §D战争物资§!每周生产将§G增加§!£GFX_LAR_CHI_war_supply_blue_texticon §D1单位§!。\n"
 CHI_LAR_Forcible_collection_of_materials:0 "皆为胜利"
 CHI_LAR_Forcible_collection_of_materials_desc:0 "一个人饿肚子他会死，如果军队饿肚子就会亡国！分不清轻重缓急的民众应当牢记，假如神州再次沦丧于日寇的铁蹄之下，中国只会沦为地狱，我们一切努力都会白费！为了我们的事业和中国的解放，付出多大的代价都在所不惜。"
 CHI_LAR_Forcible_collection_of_materials_tt:0 "在每周结算时，我方控制战区的£GFX_LAR_CHI_war_supply_blue_texticon §D战争物资§!每周生产将§G增加§!£GFX_LAR_CHI_war_supply_blue_texticon §D2单位§!。\n"
 CHI_LAR_Shift_Working:0 "班组轮替"
 CHI_LAR_Shift_Working_desc:0 "生产！生产！生产！与日寇的战争无时无刻不考验着我们的生产能力，我们需要让我们的机器以最大功率开动。只需要准备好维护，工厂里的机器是可以一天24小时生产开动的，然而我们的工人必须得到休息，为了保证物资的计划，我们将实行工人轮班制，好让工厂昼夜不分地生产。"
 CHI_LAR_Shift_Working_tt:0 "§Y“落日行动”§!获得修正\n效果变化：\n    £GFX_prod_eff 生产效率增长：§G+10.00%§!\n"
 CHI_LAR_Mandatory_Overtime:0 "强制加班"
 CHI_LAR_Mandatory_Overtime_desc:0 "每个工人都应该明白，他是中国的一颗齿轮。正在驰骋的战车需要各个精密部件的通力配合，为了国家和民族的存续，应当无偿的献出自己的劳动来让祖国母亲一雪前耻。而不是向紧缩的政府索要报酬。请想想在日本人血汗工厂里工作的奴工！在自由的中国不会再有这样的景象了。"
 CHI_LAR_Mandatory_Overtime_tt:0 "§Y“落日行动”§!获得修正\n效果变化：\n    £GFX_prod_eff_cap 生产效率上限：§G+10.00%§!\n"
 CHI_LAR_Seizure_Japanese_property:0 "收缴日本资产"
 CHI_LAR_Seizure_Japanese_property_desc:0 "万恶的日本侵略者在中华大地上播种罪恶，日企一间间的血汗工厂和这一帮日本肥猪就是最好的证明。不过他们的资产现在是我们的了，我们会最大限度地利用他们来不及撤离的资产，用这份礼物好好的回敬他们。"
 CHI_LAR_Protecting_basic_livelihoods:0 "保障基本民生"
 CHI_LAR_Protecting_basic_livelihoods_desc:0 "打仗，并不意味着后方会出现饥荒和骚乱的现象，前线要胜利，后方也要稳定。我们将实施配给制，使每个人都能领用到足额的物资度过战争。同时打击囤积居奇的奸商、保障中小企业度过难关、加强治安力量，让人民明白我们不仅有能力赢得战争，而且有资格领导中国。"
 CHI_LAR_Protecting_basic_livelihoods_tt:0 "在每周结算时，我方控制战区的£GFX_LAR_CHI_war_supply_blue_texticon §D战争物资§!每周消耗将§R增加§!£GFX_LAR_CHI_war_supply_blue_texticon §D1单位§!。\n"
 CHI_LAR_Overall_resource_orientation:0 "资源全面倾斜"
 CHI_LAR_Overall_resource_orientation_desc:0 "争愈演愈烈，用我们原有的资源分配体系去支持现在的战争已经有点力不从心了。现在已经到了中华民族争取自由的关键时刻，我们绝不能出任何差错。全国的经济将继续向战时体制转变，同时资源也将全面向战争方向倾斜，全力支持战争。"
 CHI_LAR_Overall_resource_orientation_tt:0 "在每周结算时，我方控制战区的£GFX_LAR_CHI_war_supply_blue_texticon §D战争物资§!每周消耗将§G减少§!£GFX_LAR_CHI_war_supply_blue_texticon §D1单位§!。\n"
 CHI_LAR_Stabilizing_financial_markets:0 "稳定金融"
 CHI_LAR_Stabilizing_financial_markets_desc:0 "在保障人民最基本的生活后，我们必须出手调控逐渐失控的市场，假如金融秩序崩溃，社会秩序将如多米诺骨牌一般轰然倒塌，彻底掐灭希望的火苗。约束金融行业，保障银行存取，打击投机商业活动，每一项的举措都将稳定市场的秩序，避免我们的货币变成一堆废纸！"
 CHI_LAR_Wartime_General_Staff:0 "总参谋部"
 CHI_LAR_Wartime_General_Staff_desc:0 "如果把一支军队比喻成一个人，曾经的国军就是一个四肢躯干和脑袋缝在一起的人型生命，虽然外表看起来和常人别无二致，但实际上连走路都不协调，以至于所有的动作都达不到预想效果。在第二次中日战争中这种事情就发生了几百万次，后来我们审视原因的时候就发现了问题所在，这个“人”缺乏小脑，而这个小脑就是总参谋部。\n\n从现在开始，各个战区、各个前线对应的师团将会收到的命令都将从总参谋部发出，所有的军事计划都将在总参谋部统一又高效的指挥策划中，如同时钟一样准确无误地运转……"
 CHI_LAR_Quick_Plan:0 "雷厉风行"
 CHI_LAR_Quick_Plan_desc:0 "德国人之所以征服全欧洲，是因为他们所到之处的每个国家无一例外都是被快速解决的，他们称之为闪电战，也就是奇袭、突袭、快袭三者的完美结合。我们也得做到这几点，毕竟战场就在我们国家，这场战争每多持续一秒钟都会给我们的土地多造成一分的损伤，而我们可能要花很长时间去治愈这些伤口。\n\n全亚洲乃至全世界都在看着我们，如果我们能以闪电般的速度击败日本，不仅可以大大振奋我们的民族自信，更能让国际社会对我们刮目相看。我们需要总参谋部更快地拿出新的作战计划，将军们更快地执行新的计划，尽量快地击败日本人。"
 CHI_LAR_Quick_Plan_tt:0 "制订£GFX_LAR_CHI_Command_system_texticon §D战争计划§!的冷却时间将§G减少75%§!。"
 CHI_LAR_Detailed_Plan:0 "百密无疏"
 CHI_LAR_Detailed_Plan_desc:0 "这一场战争是决定中华民族命运的伟大时刻，一旦失败我们将万劫不复，中华民族再无东山再起的可能，所以我们必须取得战争的胜利，为每一次战役提供更加详细的计划，避免失误与失败的发生。\n\n总参谋部的每一份军事计划我们都要做预案，还要做预案的预案，发动大脑中的所有细胞尽可能地思考到每一个可能发生的情况，然后针对每一种情况都做出详细妥当的安排。正所谓“凡事预则立，不预则废”，听起来可能有些复杂，但战争不就是如此复杂吗？"
 CHI_LAR_Detailed_Plan_tt:0 "£GFX_LAR_CHI_Command_system_texticon §D进攻计划§!与§D防御计划§!所产生的效果将§G大幅增强§!。"
 CHI_LAR_Urban_Offensive:0 "城市攻坚战"
 CHI_LAR_Urban_Offensive_desc:0 "自古以来攻城都是一件难事，在钢筋混凝土建筑大面积出现之后这一点就更加明显。街头巷尾、房前屋后都可以作为战场，高楼大厦间狙击手和反坦克手也将伺机狩猎，而想要彻底夷平城市需要不计其数的弹药，想要真正攻下城市必须投入步兵参与绞肉战，这对于双方而言都是巨大的损耗。\n\n火力压制，空中支援，能使用的手段都将派上战场，无论多大的损失都必须拿下敌人的阵地。"
 CHI_LAR_Urban_Offensive_tt:0 "§Y“落日行动”§!获得修正\n效果变化：\n    计划速度：§G+5.00%§!\n    侦察：§G+5.00%§!\n"
 CHI_LAR_Theory_tested_in_combat:0 "实战检验理论"
 CHI_LAR_Theory_tested_in_combat_desc:0 "诸君都在军事学校里进修了不少时间，学了不少东西，肚子里灌了不少墨水，可谓是博览群书，学识渊博。现在正是需要诸君的时候，用你们的知识，指导我们的士兵们作战，好给予日寇迎面痛击。相信经过战争的铁与血的洗礼，诸君的学识会更加精进。今后对于军队之建设，国家之振兴更有裨益。\n\n§R惟愿诸君将振兴中华之责任，置之于自身之肩上。§!" 
 CHI_LAR_Urban_Fortification:0 "城市要塞化"
 CHI_LAR_Urban_Fortification_desc:0 "现代战争不会计较一城一地的得失，即使首都沦陷也不一定就意味着国家的战败，谁的有生力量相对更多才是判定胜负的标准。这一点我们在上一次战争中就已经学到了，而且这方面也是我们为数不多的几个优势之一。\n\n日本的人口无法和中国比较，所以只要他们流了足够多的血，哪怕我们还没开进朝鲜半岛他们就会求和。若要达到目的我们就要强化城市防御力量，每一栋建筑、每一条街道都将被强化成坚固的堡垒。届时就像凡尔登也耗尽了德国人的血一样，我们也要利用城市的复杂地形让日军大本营排队把他们的士兵送进绞肉机里，每前进一步的代价都是无数的伤亡。"
 CHI_LAR_Urban_Fortification_tt:0 "§Y“落日行动”§!获得修正\n效果变化：\n    计划速度：§G+5.00%§!\n    侦察：§G+5.00%§!\n"
 CHI_LAR_Mobile_Warfare:0 "机动作战"
 CHI_LAR_Mobile_Warfare_desc:0 "天下武功唯快不破，而旷日持久的战争无论是从哪个方面想都不划算，要快速消灭日军以免这场战争给我们国家乃至整个东亚造成更多难以估量的损失。我们的军官也很清楚闪电战中坦克和飞机的快速机动是制胜的法宝，所幸如今我们的工业能力也能满足精锐部队的装备需求，让精锐部队能够充当进攻的矛头，冲垮敌人的战线。"
 CHI_LAR_Mobile_Warfare_tt:0 "§Y“落日行动”§!获得修正\n效果变化：\n    单位速度：§G+10.00%§!\n    装甲攻击：§G+10.00%§!\n"
 CHI_LAR_High_frequency_bombing:0 "高频率轰炸"
 CHI_LAR_High_frequency_bombing_desc:0 "轰炸的意义不仅仅在于破坏敌人的基础设施和工厂，更能消磨敌人的战斗意志。频繁的轰炸更能让敌人不堪其扰，让他们疲惫于不停地修复设施和建筑，让生活在我们的轰炸下的敌人绷紧神经，造成精神上的打击。"
 CHI_LAR_High_frequency_bombing_tt:0 "£GFX_LAR_CHI_Command_system_texticon §D战略轰炸§!对敌方£GFX_LAR_CHI_war_confidence_red_texticon §R战争信心§!的打击将§G略微增加§!。"
 CHI_LAR_Wide_area_bombardment:0 "大面积轰炸"
 CHI_LAR_Wide_area_bombardment_desc:0 "导弹的产量无法允许我们在保障发射数量的同时兼具较高的发射频率，那么选择减少频率，让一次轰炸产生对敌人足够的伤害更可能彻底毁灭敌人的重要设施，造成不可逆的损失，达成局部地区的战略优势。"
 CHI_LAR_Wide_area_bombardment_tt:0 "£GFX_LAR_CHI_Command_system_texticon §D战略轰炸§!对敌方建筑的破坏效果将§G略微增强§!。"
 CHI_LAR_Modern_Trench_Warfare:0 "现代战壕"
 CHI_LAR_Modern_Trench_Warfare_desc:0 "总有人声称堑壕战的时代早已过去，坦克和飞机是战场的主宰，现代战争中早已没有堑壕的位置。然而，随着部队反坦克和防空能力的不断提升，这些钢铁巨兽也不能完全决定战争的走向，同时对于普通步兵而言，泥土比钢铁更能有效地抵挡住子弹和火炮，所以堑壕依然是极佳的防御手段。\n\n这并不意味着战争是一尘不变的。攻防手段发生变化后，堑壕的构建和形式也要随着现代化发生改变，在新时代继续发挥出优秀的防御能力。"
 CHI_LAR_Modern_Trench_Warfare_tt:0 "§Y“落日行动”§!获得修正\n效果变化：\n    堑壕上限：§G+10.00%§!\n    堑壕速度：§G+10.00%§!\n"
 CHI_LAR_All_Terrain_Adaptation:0 "全地形适应"
 CHI_LAR_All_Terrain_Adaptation_desc:0 "当谈论到中国的面积时，别人第一反应都会是大，很大，非常大，然后就会想起近乎取之不尽和无奇不有的资源，但是这一次我们要感叹的是中国面积之大蕴含了几乎世界上所有的地形——蒙古的草原、华北的平原、华南的丘陵、云南的热带雨林、新疆的沙漠、西藏的高原等等。这也就意味着我们需要拥有一支适应所有地形的军队、拥有任何条件下都能拿出百分之百战斗力的士兵。\n\n总参谋部将对各个战区各条战线面对的地形做出更具针对性的部署计划，让适应特殊地形的兵种能够在擅长的环境下战斗，最大程度发挥他们的实力。"
 CHI_LAR_All_Terrain_Adaptation_tt:0 "§Y“落日行动”§!获得修正\n效果变化：\n    地形惩罚降低：§G+10.00%§!\n"
 CHI_LAR_Special_Commando:0 "特种突击队"
 CHI_LAR_Special_Commando_desc:0 "精锐的特种部队永远是国家最锋利的利刃，即便敌人的战线固若金汤，他们也能寻找出破绽将其击破。有时他们也能开启渗透作战攻击敌人后方阵地，获取重要的情报，用卓越的战斗技巧和坚定的战斗意志完成危险的任务。\n\n漫长的战线决定了我们对特种部队的需求远比之前大，新组建的特种部队投入战场后将像钉子般穿透敌人的防线，为我们带来胜利。"
 CHI_LAR_Special_Commando_tt:0 "§Y“落日行动”§!获得修正\n效果变化：\n    特种部队容量上限乘数：§G+10.00%§!\n    特种攻击：§G+10.00%§!\n"
 CHI_LAR_Coast_defense_bastions:0 "岸防堡垒群"
 CHI_LAR_Coast_defense_bastions_desc:0 "日本的海军一直以来都是最强大的海上力量之一，可能只有大洋彼岸的美国人有能力和他们掰掰手腕，而我们的海军依然是短板，不可能阻止日本海军进攻我们的海岸线。\n\n但像淞沪会战那样失败不会再有了，我们将在一些重要沿海城市建设反登陆据点，还会使用岸舰导弹阻止敌人登陆，设立机场来阻止敌舰提供火力支援，尽可能地阻击敌人的一切登陆企图。"
 CHI_LAR_Coast_defense_bastions_tt:0 "§Y“落日行动”§!获得修正\n效果变化：\n    §Y海岸要塞§!建造速度：§G+10.00%§!\n"
 CHI_LAR_To_victory:0 "唯有胜利"
 CHI_LAR_To_victory_desc:0 "在全东亚的团结之下，我们的力量已经不容小觑，那东方的血日已不足为惧。日寇将要面临的是全东亚人民受尽苦难的愤怒，争取自由的怒吼！同胞们，团结起来！为了最后的胜利！"
 CHI_LAR_War_Propaganda_Committee:0 "战时宣传委员会"
 CHI_LAR_War_Propaganda_Committee_desc:0 "什么中日亲善、东亚共荣、兄友弟恭啊，全都是骗人的鬼话，但多年的宣传让不少国民真的相信这种谎言，进而导致他们并不支持这场战争。再加上第二次中日战争时日本鬼子摧枯拉朽地击溃了我们的军队，更是在一代中国人心中留下了深刻的阴影，他们不明白我们为什么要打这场仗，以及怎么打赢这场仗。\n\n是时候启动我们的宣传机器来扭转局面了。日本人在中华大地上的罪行罄竹难书，随便抓一把抛出去都能让人气得怒发冲冠，我们还得让国民以及全世界都明白我们能打败日本人，这就需要我们取得实质性的胜利。但更重要的是，我们现在可以把所有的黑锅都扣在日本人头上，包括我们国民政府的一些见不得光的事情，反正他们早已遗臭万年。"
 CHI_LAR_Diplomatic_cooperation:0 "合纵求于外"
 CHI_LAR_Diplomatic_cooperation_desc:0 "诚然，我们有高昂的斗志，有必胜的信念，有不屈的意志，但是面对叱诧风云的世界三极之一，光靠我们自己的力量也许很难取得胜利，即便取得，那也必将是一场残酷的炼狱，让胜利不过只是惨败的一个动听的代名词而已。\n\n因此，我们必须将眼光放向世界，团结在东南亚饱受欺压的人民，号召全世界反抗暴政的勇士，以及在远端盘旋的，两只虎视眈眈的雄鹰……"
 CHI_LAR_Diplomatic_cooperation_tt:0 "所有§Y泛亚解放同盟§!阵营成员-获得修正\n效果变化：\n    战争支持度：§G+5.00%§!\n"
 CHI_LAR_Patriotic_mobilization:0 "组织爱国动员"
 CHI_LAR_Patriotic_mobilization_desc:0 "我们的同胞并非不爱自己的国家，只是他们中大多数自幼接受的日本式宣传让他们感到困惑和迷茫。我们有必要当一次催化剂，推动他们摆脱迷茫。开动宣传机器吧，把我们的舆论阵地夺回来，把同胞们的爱国力量重聚起来！\n\n§R九州同心，誓卫华夏。§!"
 CHI_LAR_Emphasis_on_discipline:0 "强调纪律"
 CHI_LAR_Emphasis_on_discipline_desc:0 "尽管我们在训练军队的时候就把一些基础的纪律思想灌输给了他们，但还是不得不承认，我们的国军还是一幅兵痞和军阀的样子。他们来到盟国定居点后轻则作奸犯科，重则杀人夺财，让我们的军队在前进过程中并没有受到想象中箪食壶浆般的欢迎场面。\n\n无论如何我们都得管一管，国军代表的是中华民国——东亚真正的解放者，如果想站在道德的制高点上讨伐日本鬼子，我们就得表现得像个解放者。必须命令前线军队收敛他们行动，同时还要展开人道主义救援工作，让盟国朋友都明白青天白日要胜过日本人的猩红旭日。"
 CHI_LAR_Emphasis_on_discipline_tt:0 "§Y“落日行动”§!获得修正\n效果变化：\n    抵抗目标：§G-10.00%§!\n    每日顺从度增长：§G+0.50%§!\n"
 CHI_LAR_Intelligence_sharing:0 "情报共享"
 CHI_LAR_Intelligence_sharing_desc:0 "左右战争局势的重要因素之一就是情报。然而我们的情报部门尚不成熟，尤其面对长期执行国际间谍工作的日本特高科面前更是显得无力。为了全东亚的自由，与OFN和团结协定的情报共享是可以接受的，CIA与阿勃维尔已经同意将他们长久以来对日工作的部分情报与我们共享，并且派出专业的顾问支援工作，相信在他们老牌情报部门的协助下，我们的情报部门一定能够使我们的战争更加顺利。"
 CHI_LAR_Intelligence_sharing_tt:0 "所有§Y泛亚解放同盟§!阵营成员-获得修正\n效果变化：\n    （[JAP.GetNameWithFlag]）我国对其突破：§G+5.00%§!\n"
 CHI_LAR_The_Righteous_Army:0 "正义之师"
 CHI_LAR_The_Righteous_Army_desc:0 "记住，肆意复仇不是我们的目的，我们要做的是解放东亚，贯彻真正的东亚共荣和泛亚主义，为每一个渴望光明未来的东亚人带去光明的未来。是的，也包括日本人。我们的敌人是日本帝国主义势力和他们的政治走狗，而不是无辜的日本平民，如果我们面对手无寸铁的日本平民也扣动扳机，那我们和日本鬼子有什么区别？\n\n对平民的无差别报复行径都将被禁止，同时我们将确保战俘得到妥善监管，随意伤害战俘的行为将得到惩戒，杀戮只能换来更多的杀戮。孔子就说过要以直报怨而不是以怨报怨，尽管这或许会让一些极端的民族主义者批评我们懦弱无能。但为了践行我们建设一个和谐团结的东亚的理想，这些都是必要之举。"
 CHI_LAR_The_Righteous_Army_tt:0 "§Y“落日行动”§!获得修正\n效果变化：\n    抵抗目标：§G-10.00%§!\n    每日顺从度增长：§G+0.50%§!\n"
 CHI_LAR_A_tooth_for_a_tooth:0 "血债血偿"
 CHI_LAR_A_tooth_for_a_tooth_desc:0 "日本人对中国从未手下留情：从旅顺，到济南，平顶山，再到镇江，南京。屠杀从未结束，他们要摧毁中国的抵抗意志，而代价就是无数中华儿女的未来。而第一次大东亚战争结束至今，中国也失去了太多太多，在日本划开的伤口上有无数条水蛭，日夜吮吸着中国的鲜血。没有日本人是无辜的，他们每一个人都享受着敲骨吸髓换来的繁荣，这不公平。累累血债已不能计数，必要血来偿。\n\n但我们绝不能忘记我们是理智的人。对日本平民，我们将剥夺一切财产并统一管理，绝不得有任何虐待，迫害之行为；而对于那些犯下累累暴行的日本士兵，现在正是还债之时：将他们送去劳动营中以极低待遇日夜劳动。我们依旧将追溯虐杀战俘的罪名，但“略施惩戒”，无所谓。"
 CHI_LAR_A_tooth_for_a_tooth_tt:0 "§Y“落日行动”§!获得修正\n效果变化：\n    （[GNG.GetNameWithFlag]、[MAN.GetNameWithFlag]）：\n        我国对其进攻修正：§G+5.00%§!\n        我国对其防御修正：§G+5.00%§!\n\n    抵抗目标：§R+10.00%§!\n    每日顺从度增长：§R-0.50%§!\n"
 CHI_LAR_The_Chinese_Expeditionary_Force:0 "中国远征军"
 CHI_LAR_The_Chinese_Expeditionary_Force_desc:0 "必须注意的是，相比起我们，我们的盟友十分弱小，他们可能无力单独支撑起他们与日本监管军的对决。但是他们绝不会孤军作战，他们都是东亚争取自由与解放的重要部分，我们将派遣我们军队中的部分精锐作为远征军，跨出国境帮助他们争取自由。如同当年的大战一样，我们将于他们一起支撑战线，而这一次我们决不会失败。\n\n§R为国赴千里，何所惧征伐？§!"
 CHI_LAR_The_Chinese_Expeditionary_Force_tt:0 "所有§Y泛亚解放同盟§!阵营成员-获得修正\n效果变化：\n    每日陆军经验增长：§G+0.20§!\n"
 CHI_LAR_The_will_to_win:0 "坚定必胜意志"
 CHI_LAR_The_will_to_win_desc:0 "是，没错，日寇的武器是比我们要精进些，是比我们要成熟些。可是长年的军国体制早已摧残了他们的意志！而这正是我们最不缺乏的！我们要避我所短，扬我所长，用对自由的呐喊冲破他们可笑的“武士道”！起来呀，奋斗呀，胜利一定是我们的！让我们夺回迟到的荣光，你们所渴求的自由，不就在那阵地的前方吗？！"
 CHI_LAR_The_will_to_win_tt:0 "在每周结算时，我方£GFX_LAR_CHI_war_confidence_blue_texticon §D战争信心§!获得将额外§G增加§!£GFX_LAR_CHI_war_confidence_blue_texticon §D2单位§!。\n"
 CHI_LAR_At_dusk:0 "黄昏时分"
 CHI_LAR_At_dusk_desc:0 "在东北无尽的林海雪原之间，昔日叱诧风云的日本帝国陆军在山野中狼狈溃退。\n\n在中华民国漫长的海岸之上，过去被日军视若无物的岸防成为了他们新的墓碑。\n\n在东南亚的茂密雨林之中，神出鬼没的游击纵队让日本人焦头烂额，夜不能寐。\n\n在远在对岸的日本本土之内，游行与动乱此起彼伏，政治与经济危机已经迫在眉睫……\n\n现在，所有人都明白，胜利的天平已然倾斜，但是我们依旧不能大意，现在应当集中一切力量，对日本帝国主义发动最后一击，将他们踹进坟墓。\n\n§R旭日依山尽……§!"
 CHI_LAR_At_dusk_tt:0 "所有§Y泛亚解放同盟§!阵营成员-获得修正\n效果变化：\n    （[JAP.GetNameWithFlag]）\n        我国对其进攻：§G+5.00%§!\n        我国对其防御：§G+5.00%§!\n"
 CHI_LAR_Sabotage_by_force:0 "下谋其兵"
 CHI_LAR_Sabotage_by_force_desc:0 "日本佬没什么可怕的，他们身材矮小、愚昧无知，除了狂热之外和科技优势之外一无所有——这是他们在上一次战争中留给我们的印象，但这一次他们连这些优势都没有了。在中华大地惨遭折磨的几十年间，每一个中国人都比他们更狂热；在现代化之后，他们所谓的科技优势早就成了老古董。而除此之外，而我们时时刻刻不在期盼着这一天，将士们的热血激情足以让江河湖海奔腾汹涌。\n\n已经没有什么需要做的了，我们的士兵骁勇善战、士气高昂，光是勇气和信念就足以让那些倭寇魂飞魄散，最终的结果一定是我们将以钢铁般坚定的意志夺取战争的胜利。"
 CHI_LAR_Sabotage_by_force_tt:0 "§Y“落日行动”§!获得修正\n效果变化：\n    （[JAP.GetNameWithFlag]）：\n        我国对其进攻修正：§G+5.00%§!\n        我国对其防御修正：§G+5.00%§!\n"
 CHI_LAR_Sabotage_by_psychological:0 "上谋其心"
 CHI_LAR_Sabotage_by_psychological_desc:0 "1937年时日本面对的是一个什么中国？是一个四分五裂、军阀混战、民不聊生、愚昧无知的中国，他们可以说是趁火打劫趁虚而入才赚了个盆满钵盈，那场战争无论从哪个角度上看我们都没有哪怕一丝胜算，这种情绪遍布国军的每一个士兵，没人觉得我们能赢，那战争就不可能赢，所以我们才会支持汪精卫的和谈而不是蒋介石的顽抗。\n\n但现在的日本面对的是一个什么中国？是一个兵强马壮、科技发达、今非昔比的中国！日本又是什么样子？他们的政府党同伐异，他们的军队互相对立，而他们的国民，还沉浸在三十年前的胜利中醉生梦死。\n\n几乎没有士兵希望死在没有任何胜利希望的战争中，现如今我们的敌人就处在这样的战争里。假如我们通过宣传瓦解他们的信心，或许就能促使他们投降，达到不战而屈人之兵的目的。"
 CHI_LAR_Sabotage_by_psychological_tt:0 "在每周结算时，敌方£GFX_LAR_CHI_war_supply_red_texticon §R战争信心§!获得将额外§G减少§!£GFX_LAR_CHI_war_supply_red_texticon §R2单位§!。\n"
 CHI_LAR_Golden_Crow_lift_wings:0 "赤乌解羽"
 CHI_LAR_Golden_Crow_lift_wings_desc:0 "顽强不屈的华夏同胞们，敢于斗争的东亚战友们，团结一致的世界人民们，我们的胜利就在前方！在泛亚解放同盟的攻势下，日寇的铁蹄即将迎来他们的末日，猩红的旭日终将被勇士击落。我们将带着逝去者的荣光，生还者的希望而继续战斗，粉碎他们的顽抗，将他们逼上谈判席，我们将告诉他们，而今的东亚今非昔比，一切帝国主义的豺狼都将在她的面前粉身碎骨！\n\n§R万里尸归魂壮烈，踏破雄关旌旗扬！§!"
 CHI_LAR_Golden_Crow_lift_wings_tt:0 "§Y“落日行动”§!获得修正\n效果变化：\n    （[JAP.GetNameWithFlag]）：\n        我国对其进攻修正：§G+5.00%§!\n        我国对其防御修正：§G+5.00%§!\n"

 CHI_LAR_GAW_in_progress_trigger_tt:0 "§R大东亚战争§!尚未结束。"

 # Renli(Gongbo)'s New Modernization Tree | 张仁蠡（陈公博）新政国策树

 CHI_LAR_New_Modernization:0 "新的现代化"
 CHI_LAR_New_Modernization_desc:0 "高宗武作为总统的执政基石是承诺让中国迎来一个新纪元。其核心纲领被称为五个现代化，意图十分高尚，中国也因此理应成为一个令人倾慕的国家。然而高宗武却失败了，其原因在于其行事方式。他驱逐日本人，让我们在外交上处于孤立，并顽拒对我们走向繁荣的国家的任何援助。与高宗武相反的是，张仁蠡会同与中国共事的友邦合作。"
 CHI_LAR_Revitalization:0 "复兴"
 CHI_LAR_Revitalization_desc:0 "在中国，秩序已然濒临崩溃。封建王朝的瓦解，蒋介石的国民政府四分五裂，军阀横行，中日战争的惨痛失败，如今又经历了高宗武统治的结束…亲高派和新政府都有这样一个共识：中国已饱受磨难。但在此时此刻，中国已无力自医。随着日本给予我们所预期的援助，中国的工业将因受到刺激而重新盈利，中国以此在百年间重回稳定。"
 CHI_LAR_Reject_Zongwu:0 "拒绝高宗武思想"
 CHI_LAR_Reject_Zongwu_desc: "高宗武虽不再是中国的掌舵人，但其意志仍然徘徊在中华大地上。坦白说，在中国人民万念俱灰的情况下，高宗武给了他们新的希望，即一个新的中国。前总统的大胆想法引起了人民的关注，这为他赢得了大救星的美誉。因此要想根绝高宗武的影响绝非易事，我们首先要指出他所谓“伟大设想”的纰漏，并借机炫耀我们政策的伟大成就。"
 CHI_LAR_Cancel_the_Expansions:0 "取消扩军"
 CHI_LAR_Cancel_the_Expansions_desc:0 "从对高宗武办公室的洗劫式搜查中获得的一份令人不快的情报表明，军事预算的大幅上涨可不仅仅是用于国防，同时还用在了侵略的准备上。他竟然要对我们的盟友露出獠牙！在这日元蓬勃流动的现状下，浪费时间几乎称得上是叛国行径，但是为了制裁旨在让全亚洲都陷入战乱的军队的话，这种浪费无疑是完全正当的。\n\n高宗武说的都是要把中国的市场引导进入现代，并确保人人都有平等受教育的权利，但他做的却是让绝大多数的预算流向了军队。而陈总统的想法则是内部改良，而不是制造冲突。"
 CHI_LAR_Buy_Chinese:0 "买国货！"
 CHI_LAR_Buy_Chinese_desc:0 "完了，整个工业全完了，上一届政府的经济政策就是一团糟。他们过于强调西方模式，忙于模仿那些加害者从而忽视了实际国情，使其陷入了孤立无援，毫无防备的境地。国货本应是中国骄傲，而不是二手垃圾。政府对当地企业的补贴将保障国家繁荣发展。"
 CHI_LAR_Fat_Trim:0 "刳脂剔膏"
 CHI_LAR_Fat_Trim_desc:0 "中国的股民们只能无助地看着股价在疯狂的波动。股利随着这场波动达到了高峰而跟着上涨，随后的几百公里之外的商人们的操作让直线上升的股利又瞬间跌落谷底，一切曾经的努力都化为乌有。中国同样也是这场试炼与磨炼的承受者。所有人的钱袋子都必须要捂紧，只有到了最紧要的关头才能拿出来用。从高宗武设立的那一堆纯粹浪费国库的工程里抢出来的款项，将会回到人民的手中。而这些钱，将会成为我国经济腾飞的重要关键点。"
 CHI_LAR_Austerity_Ship:0 "节俭行船"
 CHI_LAR_Austerity_Ship_desc:0 "中国不再是那个富产黄金与丝绸的帝国了。说实话，我们没有足够的资金来维持高总统的所有项目。有很多只要我们有钱就可以解决的问题困扰着中国，遗憾的是，我们没有钱，也没有神奇的摇钱树。\n\n在我们考虑解决小问题之前，我们必须考虑日本在其他国家中的巨额债务。"
 CHI_LAR_All_of_China:0 "中华民族团结起来！"
 CHI_LAR_All_of_China_desc:0 "中国人民对于国家的分裂早已司空见惯。很少有人会记得那曾经令人畏惧的大一统中国。尽管在大多数中国人眼里，中国的分裂只是一个浅而易见的事实，但这并不应该是中国的最终命运。\n\n东部富裕且人口稠密的城市与中西部广大的农村的差距，并没有减缓中华民族认同感的消亡。许多人感觉到他们已经被政府彻底抛弃掉了。但是我们可以让一个自东向西整个繁荣起来的中国告诉他们，中国依旧是一个统一的国家。"
 CHI_LAR_Not_Alone:0 "何必孤军奋战？"
 CHI_LAR_Not_Alone_desc:0 "补贴、就业和保护，除了这些还能希求他们为我们提供什么？我们的兄弟们把我们从脱亚入欧的噩梦中惊醒，结果高宗武和他的亲信却“狗咬吕洞宾”！若形势不同，高宗武的愚蠢政策可能有益于国家，但我们没有足够的资源来改革整个国家。如果日本伸出援手，我们理应接受。共同建设更强大的中国，更强大的亚洲。"
 CHI_LAR_Import_Labor:0 "引进劳力"
 CHI_LAR_Import_Labor_desc:0 "尽管中国人口众多，但只有一部分人可以在现代工厂中工作。日新月异的世界不会等待中国崛起，如果我们要保持我们的竞争力，我们就必须欢迎而非回避外国劳工。他们不仅符合大多数企业的标准，还不会要求太高的工资。"
 CHI_LAR_Art_Deal:0 "交易之道"
 CHI_LAR_Art_Deal_desc:0 "中华民族从高总统的外交官经历中看到了他专业知识的成果。有人认为有专门与日本合作的背景的人与亚洲的强权建立良好关系易如反掌。还有，我们都很清楚高总统在战争之初还曾尝试的对日和谈的结果。避开那些大国让中国倒退了许多年，现在我们所能做的只有减轻其影响。\n\n我们的首要任务，应该是重新确立我们在共荣圈的位置。尽管他们可能会有自己的小算盘，但我们所要做的就是向他们表明中国的商业开放。"
 CHI_LAR_Import_Quotas:0 "进口配额"
 CHI_LAR_Import_Quotas_desc:0 "作为我们泛亚同盟及合作主义的一部分，我们的高级外交官员在一个个不眠之夜里与邻国的官员通电话以达成交易。虽然多数条款都并非不能妥协，但有一件事绝不容更改；所有的共荣圈国家都必须达到我国进口的配额，才能保持我们的伙伴关系。我国作为亚洲第二大强权，我们的兄弟国家应该明智地保持与我们的密切联系。为此，商品必须得到流通。"
 CHI_LAR_Chinese_Zaibatsu:0 "中国财阀"
 CHI_LAR_Chinese_Zaibatsu_desc:0 "回顾日本的快速崛起，有许多因素促成了他们成功超越西方殖民者，并与他们分庭抗礼直到如今。日本人的军事实力让他们赢得了谈判桌上的一席之地，但同时他们也控制住了市场，这是其他国家无法做到的。这一点要归功于财阀们的巨型企业集团，这些集团并未选择互相斗争，而是合并成了一个具有强大实力的实体以完全控制经济。鉴于这种经济手段已经被证明是成功的，将我们的主要企业整合成一个也将推动我们走向成功。"
 CHI_LAR_Bankruptcy:0 "破产优待"
 CHI_LAR_Bankruptcy_desc:0 "经营不善和缺乏机会折断了我们本可腾飞的勘探企业的翅膀，害得许多企业被迫破产。这些初创的公司分崩离析时，原本在天空盘旋窥伺的秃鹫飞驰而下，肆意地挑拣起它们的尸体，好一顿免费的午餐。不得不说，扶持所有企业是不切实际的想法，但我们可以保证，这些从亚洲起步的爱国企业家会留在亚洲，为伟大的亚洲复兴做出贡献。通过确保中国和日本公司抢占先机，我们可以将流失到西方的业务合同数量降至最低。"
 CHI_LAR_River_Rights:0 "通航权利"
 CHI_LAR_River_Rights_desc:0 "在我们统治的国土内，有着各种千奇百怪的地形。丘陵和山谷，草原和湿地，沙漠和沃土散布在全国各地。如此庞大的疆域对商业活动和行政治理来说是个巨大的挑战。幸运的是，我们有长江和海河作为联系相互隔绝的村庄和大都市之间的天然纽带。现在，这些重要航道的控制权被牢牢掌握在中国和日本手中，有力地巩固了我们对该地区的控制。"
 CHI_LAR_Pop_Exchange:0 "民族交流"
 CHI_LAR_Pop_Exchange_desc:0 "亚洲是不同民族的摇篮，汉人、泰人、罗兴亚人、亚齐人，不胜枚举。除此之外，亚洲也是每一个人的摇篮，一个民族的人有权在其他民族的土地上平等地工作、生活与探索。我们鼓励国人去亚洲各地开拓眼界，把自己的独特文化带向亚洲各地。我们也会大开国门，让最优秀与最聪明的人才涌入中国寻找机遇。"
 CHI_LAR_Pan_Asianist_Society:0 "泛亚社会"
 CHI_LAR_Pan_Asianist_Society_desc:0 "亚洲被帝国主义的铁蹄蹂躏了太久了，西方强权为了自身名利教唆我们互相对抗，让我们继续陷入分裂，是日本的警策让我们大梦方醒，了解到当下的处境。高宗武一派的臭老鼠反对日本的美妙造物，还妄图破坏我们的亚洲兄弟情。中国人民坚决抵制这种行径，我们严正宣布，打倒西方人的理想从未有像今天这样接近实现。\n\n我们已经向所有以亚洲为家的人们证明了自己，我们是值得信赖的盟友，而我们将不惜一切代价保卫亚洲！"
 CHI_LAR_Only_Way:0 "必经之路"
 CHI_LAR_Only_Way_desc:0 "尘埃落定，南京街道上的人群熙熙攘攘，人们终于找回了工作，经济也已站稳脚跟。我们无疑走对了路子，但在此难得的安宁时刻之中，我们有了一丝空闲去反思我们的作为。是什么在领导着我们走到今天？是为了和平作出的艰难抉择，是为了安宁抛洒的热血。还有其他让我们迈向今日的方法吗？"
 CHI_LAR_Right_Thing:0 "我们做得对"
 CHI_LAR_Right_Thing_desc:0 "没有，答案是我们别无选择。也许那一无是处、一事无成的高宗武，也会对我们在此完成的事业惊叹不已。我们做出的选择并不受人待见，但我们正是在这样的情况之下建设出了一个令人骄傲的国家。顺着都城的天际线望出去，我们可以看到人流往来不绝的市场，也能闻到从大工厂飘来的烟味。来自亚洲各个角落的人们和谐共处，共同劳动。我们不用对任何事情感到羞愧。"
 CHI_Renli_Tree_tt:0 "§R张仁蠡§!现在将按照§R自己的愿景§!推进£GFX_LAR_CHI_national_emblem_texticon §R中国§!的现代化进程。这是救亡图存的§R唯一道路§!。"
 CHI_Renli_1_tt:0 "高宗武强行将£GFX_GNG_chinese_nation_texticon §W中国§!带上一条危险的道路，这无疑会给中国和中国民众带来毁灭。"
 CHI_Renli_2_tt:0 "£GFX_LAR_CHI_national_emblem_texticon §R张仁蠡总统§!决定§R摒弃§!§a“军事现代化”§!和§W“国家统一”§!的道路。他将与§e日本§!达成特殊关系，为£GFX_LAR_CHI_national_emblem_texticon §R中国§!注入新的生机。"
 CHI_Renli_3_tt:0 "高宗武的§Y理想§!和他的§R专断政策§!对脆弱的£GFX_LAR_CHI_national_emblem_texticon §R中国§!很有害，我们会推翻这些政策。"
 CHI_Renli_4_tt:0 "取消扩军，£GFX_LAR_CHI_national_emblem_texticon §R中国§!将得以更多地投资国内。"
 CHI_Renli_5_tt:0 "购买国货既能满足政府的需要，又能支持§R本国产业§!，何乐而不为呢？"
 CHI_Renli_6_tt:0 "削减一部分§Y高宗武§!时代的计划将为我们的投资提供更多的§Y资源§!。"
 CHI_Renli_7_tt:0 "节俭将会化为£GFX_LAR_CHI_government_texticon §W民国政府§!的力量，节省下来的§R资源§!越多，政府的§R投资§!也越有效。"
 CHI_Renli_8_tt:0 "通过对£GFX_LAR_CHI_national_emblem_texticon §R中国§!其他省份的投资，全国人民都将感受到中国西部的§R繁荣§!。"
 CHI_Renli_9_tt:0 "£GFX_LAR_CHI_national_emblem_texticon §R中§!£GFX_GNG_japanese_frustration_texticon §j日§!之间的特殊关系将为中国的生产部门带来§R丰厚利益§!。"
 CHI_Renli_10_tt:0 "£GFX_LAR_CHI_national_emblem_texticon §R中国§!的工厂将会看到§R向国外更廉价的劳动力敞开大门的好处§!。"
 CHI_Renli_11_tt:0 "与其他£GFX_LAR_CHI_CPS_texticon §e共荣圈成员国§!协商§R特别经济协议§!将会为中国经济带来§R巨大利益§!。"
 CHI_Renli_12_tt:0 "通过§Y大量进口商品§!，£GFX_LAR_CHI_national_emblem_texticon §R中国§!将与£GFX_LAR_CHI_CPS_texticon §e共荣圈§!的其他成员国建立更好的关系。"
 CHI_Renli_13_tt:0 "允许§W中国企业§!整合为类似§R财阀§!的§R垄断组织§!将让我们得以更好地§R控制§!市场以及§R提高§!工业效率。"
 CHI_Renli_14_tt:0 "给予£GFX_GNG_japanese_frustration_texticon §j日本§!和£GFX_LAR_CHI_national_emblem_texticon §R中国§!各企业以吞并其他破产企业的优先权将有助于保持市场的§R稳定§!与§R安全§!。"
 CHI_Renli_15_tt:0 "允许人口在中国和其他£GFX_LAR_CHI_CPS_texticon §e共荣圈§!国家之间自由迁徙将能让外国的尖端人才、技术与优秀文化为中国所用。"
 CHI_Renli_16_tt:0 "给予£GFX_LAR_CHI_national_emblem_texticon §R中§!£GFX_GNG_japanese_frustration_texticon §j日§!各企业专属水路权将有助于加强对§Y工业基础设施§!的§R控制§!。"
 CHI_Renli_17_tt:0 "中国因其价值在£GFX_LAR_CHI_CPS_texticon §e共荣圈§!中§R独一无二§!。"
 CHI_Renli_18_tt:0 "§R最艰难的抉择§!，需要§e最坚强的意志§!。"
 CHI_Renli_19_tt:0 "§R汪精卫§!对£GFX_LAR_CHI_national_emblem_texticon §R中国§!的构想是实现§Y和平§!的唯一道路。如果这就是他所期望的一切，那§e我§!究竟§R做错了什么？§!"


 ####  Post War Transition Tree  |  战后衔接国策  ####

 CHI_LAR_White_Sun_Rise_Again:0 "青天白日再升起……"
 CHI_LAR_White_Sun_Rise_Again_desc:0 "四十多年前，日本人带着他们的野心与虚伪踏侵入中华民国的国土，但纵然中华民族上下奋起反抗，却终究被迫向日寇低下了头，而后日本用铁链与枷锁束缚着我们度过三十多年的漫漫长夜……\n\n而如今我们还是取得了胜利，再一次向世界证明中华民族永远不会屈服于强权，永远不会被真正征服！\n\n所以啊，同胞们！庆祝吧！欢呼吧！为那百年的屈辱，终在今日血洗而重光！\n\n§R卧薪尝胆数十载，§!§a春风终度山海关！§!"
 CHI_LAR_White_Sun_Rise_Again_tt:0 "£GFX_LAR_CHI_government_texticon §W历史翻开了新的一页……§!\n"
 CHI_LAR_But_at_What_Cost:0 "……可是代价呢？"
 CHI_LAR_But_at_What_Cost_desc:0 "旧秩序在往日的战火中走向末路，新生的人民在胜利的烟花中迈向新生，在那庆典结束之际，花火已然沉寂，礼炮哑然无声，鲜花凋落飘落……\n\n从欢庆中冷静下来的芸芸众生再一次展望当下与未来，却发现自己依旧被迷雾所阻……"
 CHI_LAR_Land_of_Ten_Thousand_Miles:0 "万里边疆之境"
 CHI_LAR_Land_of_Ten_Thousand_Miles_desc:0 "中华民族的努力的得到了回报，历经数十年，我们终于再度光复我们大部分的法理领土，中华的秋海棠叶再度统一在了同一面旗帜之下。但在这几十年中，这些领土中的大部分或是被军阀割据，或是沦为外国势力的傀儡，而后者的结果无疑最为严重，从黑龙江到帕米尔高原，从蒙古大漠到珠江三角洲，地方分离主义几乎充斥于我们的每一处边境，我们必须要让他们明白，任何妄图分裂中华秋海棠叶的行为都将招致最严厉的怒火。"
 CHI_LAR_Under_the_rubble:0 "残垣瓦砾之下"
 CHI_LAR_Under_the_rubble_desc:0 "纵观中外，古往今来，不论动机是卫国还是侵略，不论结果是凯旋还是败北，战争对于双方的影响都永远是残酷的，其所带来的伤痛刻骨铭心，大东亚战争虽是一场伟大的解放战争，其代价仍不例外：东北的重工业区在双方的争夺中被毁灭殆尽，沿海的许多城市由于日本的轰炸行动亟待重建，而想要让这个国家平稳的从战时状态平稳度过度回和平年代同样并非易事……"
 CHI_LAR_Above_the_High_Towers:0 "高台楼阁之上"
 CHI_LAR_Above_the_High_Towers_desc:0 "随着战争的胜利，华北派在唾骂声中土崩瓦解，维新派则借着民族主义的浪潮快速崛起，保守派们同样在战争中攫取了他们的利益，而高宗武总统更是通过解放东亚事业的伟大胜利累积了雄厚的政治力量，立法院的牌局已然翻新，下一场对局即将开始……"
 CHI_LAR_Vision_of_disillusioned_prosperity:0 "幻灭繁荣之景"
 CHI_LAR_Vision_of_disillusioned_prosperity_desc:0 "五个现代化为我国的工农业和科技发展带来了本质上的飞跃，但是如此高速且不计后果的发展无疑是一种竭泽而渔，无数的社会裂痕就此扎根在了我们的经济体系当中；而伴随着战争的影响，这种不健康的发展模式便开始展现出它的恶果，无数从农村被赶到城市的成为工人的人们只能生活在阴冷破败的房屋中，工作场所乌烟瘴气，缺乏任何基本的保障，而在工厂老板的各种盘剥之下，他们的收入同样屈指可数……对于他们来说，自己只是迈向胜利所需的燃料，而所谓的胜利不过是将脑满肠肥的日本人变成了脑满肠肥的中国人罢了……\n\n而今的国内经济已宛若盛夏后的寒秋，只余凄冷悲风……"
 CHI_LAR_Midst_of_thousands_troops:0 "千军万马之中"
 CHI_LAR_Midst_of_thousands_troops_desc:0 "我们的军队向我们最直观的证明的五个现代化所带来辉煌成就，作为三极之一的日本已经败倒其下，但是这决不能证明我们的军队的现代化之路就此走到了尽头：而今的军队依旧缺乏海军与空军作战实力；战时的大规模扩招同样开始导致军队素养普遍开始下滑，军费开支与日俱增；而大东亚战争的胜利同样开始让军队中的各路派系死灰复燃，并且变得愈发桀骜不驯，愈发渴望干预国家的各种政治事务……若不及时整治军队中的病灶，其日后必是我国政治生态的毒瘤，亦会是国防安全的重大隐患。"
 CHI_LAR_Shadow_of_The_Past:0 "迫近的往日之影"
 CHI_LAR_Shadow_of_The_Past_desc:0 "不论如何，有一件事情我们必须正视，那个在中华大地徘徊五十载的身影从未消逝，他们依然活跃，依然强大，从乡村到城市，从学校到工厂，从军队到政府，他们无处不在，只要中国人民身上的枷锁一日不被斩断，他们就一日不会消失……"
 CHI_LAR_Long_and_Arduous_Road:0 "任重道远，道阻且长"
 CHI_LAR_Long_and_Arduous_Road_desc:0 "回首向来萧瑟处，十几年漫漫长路，五个现代化带领中华民国走向新生，斩断了日寇囚禁着中华民族的层层枷锁，带领东亚人民走向真正的解放。\n\n但是大东亚战争的胜利并未抚平五个现代化的创口，人民蓦然发现自己成为了胜利的代价。而在中国的街头巷尾，那个死去的幽灵似乎又重新活跃起来，在中日冷战的阴霾下，无人能断言中华民国的未来。\n\n无数阴云之下，民国的未来将何去何从，是再一次披荆斩棘走向新时代的荣光，亦或是在烈火与绝望中堕入深渊……\n\n§v任重道远，道阻且长……§!"

