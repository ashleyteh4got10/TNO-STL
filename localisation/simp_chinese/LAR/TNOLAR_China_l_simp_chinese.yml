 CHI_Ministry_of_National_Defense_GUI_nationalists_progressbar_tt:0 "§a中华民国国防部：民族派§!\n\n派系领袖：§Y方先觉§!\n\n\n\n\n\n\n£GFX_MND_GUI_nationalists_leader_bookmark\n\n\n\n\n\n\n\n£GFX_LAR_CHI_mil_loyalty_texticon §O派系忠诚度§!：[?CHI_MND_GUI_nationalists_loyalty_var|.1%]\n\n£GFX_LAR_CHI_mil_faction_texticon §O派系影响力§!：§a[?CHI_MND_GUI_nationalists_influences_var]§!/§q[?CHI_MND_GUI_conservatives_influences_var]§!/§q[?CHI_MND_GUI_japanophiles_influences_var]§!\n\n在如今南京政府的军队里，多半都是在大东亚战争中愿意与日本合作的将领，但也有一部分是迫于形式而不得不选择合作的妥协者，这些妥协者们构成了§a最初的民族派§!。由于依然保留着民族主义情绪，§a民族派§!们主张必须保留军事的独立性，不愿意在任何形式上作为§e日本军队§!的附庸，因此被§R最高军事顾问团§!高度警惕。\n\n对于军事建设，§a民族派§!有着比较激进的态度，他们并不介意新锐的技术和理论是源自于§e日本§!、§B美国§!还是§j德国§!，只要在下一场战争里能带来胜利，那么中国就应该学习。而为了完成军事建设计划必须与思想保守的老将领对抗，§a民族派§!也不得不倾向于提拔更多的年轻将领。\n\n这种愿意革新的思想在年轻军官中受到了欢迎，特别是出身背景普通的基层军官为了自己的仕途对这一派系青睐有加。被提拔的§a民族派年轻将领§!对于军事建设的态度更加激进，他们希望军队更加职业化，贪污腐败的现象能够得到遏制，但这往往触犯到了§s中央派§!的利益。"
 CHI_Ministry_of_National_Defense_GUI_nationalists_progressbar_tt_delayed:0 "[ROOT.GetCHIMinistryofNationalDefenseGUInationalistsprogressbartt]\n\n月度£GFX_LAR_CHI_mil_progress_texticon §Q现代化进度§!数值变化：§G+3§!\n基础£GFX_counter_intelligence_JAP §R最高军事顾问团警惕等级§!：§R+1§!\n§s中央派§!基础忠诚度：§R-10%§!\n§e华北派§!基础忠诚度：§R-20%§!"
 CHI_Ministry_of_National_Defense_GUI_conservatives_progressbar_tt:0 "§s中华民国国防部：中央派§!\n\n派系领袖：§Y任援道§!\n\n\n\n\n\n\n£GFX_MND_GUI_conservatives_leader_bookmark\n\n\n\n\n\n\n\n£GFX_LAR_CHI_mil_loyalty_texticon §O派系忠诚度§!：[?CHI_MND_GUI_conservatives_loyalty_var|.1%]\n\n£GFX_LAR_CHI_mil_faction_texticon §O派系影响力§!：§q[?CHI_MND_GUI_nationalists_influences_var]§!/§s[?CHI_MND_GUI_conservatives_influences_var]§!/§q[?CHI_MND_GUI_japanophiles_influences_var]§!\n\n§s中央派§!的前身是汪精卫总统在前维新政府部军事力量的基础上所建立的§s和平建国军§!。随着在大东亚战争中看清现实，愿意为亚洲解放效力的将领越来越多，和平建国军的队伍也逐渐壮大，战后演变成军队中最大派系，§s中央派§!。不过庞大的将领数量也导致了§s中央派§!内部存在着不同的小派系，各自有着不同的利益与诉求。\n\n为了保障国防安全，§s中央派§!也认为应当注重军事建设，只不过不需要那么操之过急，只需要及时查缺补漏，让国防体系正常运转即可。比起如何发展国防，§s中央派§!更在意的是怎样平衡§B自身独立性§!和§e日本的控制§!，毕竟他们也不想彻底沦为寄人篱下的掌中玩物。或许是曾经作为同僚的“默契”，§s中央派§!时常与§B前重庆政府§!的将领交流，反思曾经犯下的军事错误，换句话说，他们一直困在上次战争的失败之中。\n\n可对于年轻军官而言，§s中央派§!就显得没什么吸引力。再加上即便是§B中央军官学校§!毕业的，没有关系与背景也难以触及权力的中心，年轻军官们也逐渐流向了§a民族派§!与§e华北派§!。"
 CHI_Ministry_of_National_Defense_GUI_conservatives_progressbar_tt_delayed:0 "[ROOT.GetCHIMinistryofNationalDefenseGUIconservativesprogressbartt]\n\n月度£GFX_LAR_CHI_mil_progress_texticon §Q现代化进度§!数值变化：§G+0.5§!"
 CHI_Ministry_of_National_Defense_GUI_japanophiles_progressbar_tt:0 "§e中华民国国防部：华北派§!\n\n派系领袖：§Y张岚峰§!\n\n\n\n\n\n\n£GFX_MND_GUI_japanophiles_leader_bookmark\n\n\n\n\n\n\n\n£GFX_LAR_CHI_mil_loyalty_texticon §O派系忠诚度§!：[?CHI_MND_GUI_japanophiles_loyalty_var|.1%]\n\n£GFX_LAR_CHI_mil_faction_texticon §O派系影响力§!：§q[?CHI_MND_GUI_nationalists_influences_var]§!/§q[?CHI_MND_GUI_conservatives_influences_var]§!/§e[?CHI_MND_GUI_japanophiles_influences_var]§!\n\n大东亚战争初期，为了保障华北地区的稳定，应对£GFX_LAR_CHI_Communist_Party_texticon §V共产党§!游击队，§e华北治安军§!随即成立。南京政府成立后在名义上统一指挥各地中国军队，但实际上§e华北治安军§!的指挥权仍然在§e日本帝国陆军§!手里。加上§e华北治安军§!拥有自己的军官学校和教育体系，战后他们形成了与其他人泾渭分明的派系——§e华北派§!。\n\n秉持着胜者可为师的思想，§e华北派§!认为在每一个方面中国军队都应当学习§e日本帝国军队§!的优点，无论是日常管理、指挥体系，还是武器型号、军衔职位，都应当与日本对接。§e华北派§!的最终目的不仅仅是借鉴日本经验以保障自身安全，而是将中国军队打造成§e泛亚§!的最先锋，与共荣圈之主一起组建事实上的§e东亚联军§!。\n\n年轻军官中也不乏有向往日本军事力量的人，他们大多选择入学§e华北陆军军官学校§!，其中优秀者又会被派往日本留学。待到§e亲日派§!军官毕业和归国后便成为了§e华北派§!的中坚力量，在军事上为所谓的§e“泛亚”§!呕心沥血。"
 CHI_Ministry_of_National_Defense_GUI_japanophiles_progressbar_tt_delayed:0 "[ROOT.GetCHIMinistryofNationalDefenseGUIjapanophilesprogressbartt]\n\n月度£GFX_LAR_CHI_mil_progress_texticon §Q现代化进度§!数值变化：§G+1§!\n基础£GFX_counter_intelligence_JAP §R最高军事顾问团警惕等级§!：§G-2§!\n§s中央派§!基础忠诚度：§R-10%§!\n§a民族派§!基础忠诚度：§R-20%§!"
 
