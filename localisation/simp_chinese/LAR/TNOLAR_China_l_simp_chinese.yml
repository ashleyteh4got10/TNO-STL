 TNOLAR_CHI_Northwest_War_Category:0 "西北战事"
 CHI_Northwest_War_GUI_info1_XIKexist_localization_key:0 "西北边界的烽火再次燃起，得益于我们与地方军阀的前期交流工作，我们可以借过国民革命军四十集团军的地界，向困守西北的马家军提供援助。同时，根据国家安全局的情报显示，日本人在之后很可能介入这次冲突，这种扩张日本在华影响力的机会是不会被那些老练政客错过的。对于我们来说，这次机会同样千载难得，对于西南暴动的镇压在很大程度上影响了我们与地方军阀的整合进程，是时候展现我们的诚意了——我们是真心为了中国的统一以及自由而战的。虽然这次冲突注定不会发展成全面战争，但我们仍要做好各项准备，尽可能抓住这次机会达到利益最大化。"
 CHI_Northwest_War_GUI_info1_XIKNOTexist_localization_key:0 "西北边界的烽火再次燃起，得益于西南暴动后对西部的重建，我们现在可以越过横断山脉，向困守西北的马家军提供援助。同时，根据国家安全局的情报显示，日本人在之后很可能介入这次冲突，这种扩张日本在华影响力的机会是不会被那些老练政客错过的。对于我们来说，这次机会同样千载难得，对于西南暴动的镇压在很大程度上影响了我们与地方军阀的整合进程，是时候展现我们的诚意了——我们是真心为了中国的统一以及自由而战的。虽然这次冲突注定不会发展成全面战争，但我们仍要做好各项准备，尽可能抓住这次机会达到利益最大化。"
 CHI_Northwest_War_GUI_info2:0 "西北地区当前处于：[ROOT.GetCHINorthwestWarGUIregionalphase]"
 CHI_Northwest_War_GUI_regionalphase_1_localization_key:0 "§Y对峙阶段§!"
 CHI_Northwest_War_GUI_regionalphase_2_localization_key:0 "§R冲突阶段§!"
 CHI_Northwest_War_GUI_clock_desc_tt:0 "[ROOT.GetCHINorthwestWarGUIclockdesctt]"
 CHI_Northwest_War_GUI_clock_desc_tt_localization_key:0 "当前的战争进程为 §Y[?Northwest_War_timeleft]/60§!！"
 CHI_Northwest_War_GUI_clock_desc_delay_tt:0 "[ROOT.GetCHINorthwestWarGUIclockdescdelaytt]"
 CHI_Northwest_War_GUI_clock_desc_delay_tt_localization_key:0 "§Y战争进程§!代表着双方的战争烈度以及日本对西北冲突的关注程度，若时间归零时一方仍未彻底投降，双方将被迫签订§Y和平协议§!。\n我们预计，如果马家军在谈和时没有完全控制自己的战前领土，协议结果将会对我们§R极为不利§!"
 CHI_Northwest_War_GUI_info3:0 "目前的£GFX_LAR_CHI_supply_route_smooth_rate_texticon §L补给路线畅通率§!为§Y[?CHI_Northwest_War_GUI_progressbar_var]%§!\n至少需要§Y30%§!的 £GFX_LAR_CHI_supply_route_smooth_rate_texticon §L路线畅通率§!才能正常行动"
 CHI_NorthwestWar_GUI_progressbar_desc_tt:0 "[ROOT.GetCHINorthwestWarGUIprogressbardesctt]"
 CHI_Northwest_War_GUI_progressbar_desc_tt_XIKexist_localization_key:0 "通往§B西北§!的路途遥远而艰难，为了掩人耳目，我们不得不借道[XIK.GetFlag]§Y[XIK.GetName]§!以此支援马家军。\n四川西部的横断山脉遍地皆是深切而狭窄的河谷，自古便是难以通行之地，虽然我们赶在§B西北战争§!爆发前援助修建了大量基础设施，但对于战争物资的运输而言依然显得捉襟见肘，我们必须小心维护§Y西部公路§!，以免影响对马继援的援助。"
 CHI_Northwest_War_GUI_progressbar_desc_tt_XIKNOTexist_localization_key:0 "通往§B西北§!的路途遥远而艰难，为了掩人耳目，我们不得通过西康省向马家军运输物资。\n四川西部的横断山脉遍地皆是深切而狭窄的河谷，自古便是难以通行之地，虽然我们赶在§B西北战争§!爆发前援助修建了大量基础设施，但对于战争物资的运输而言依然显得捉襟见肘，我们必须小心维护§Y西部公路§!，以免影响对马继援的援助。"
 CHI_Northwest_War_GUI_info4:0 "我们当前可以伪装 §Y[?CHI_current_number_volunteers]个师§! 作为马家军的作战力量\n\n自开战以来，第四十集团军已接收来自我们的\n§Y[?CHI_NWW_EQ_firearms]箱枪械§! §Y[?CHI_NWW_EQ_artillery]门火炮§! §Y[?CHI_NWW_EQ_armor]辆装甲车§!"
 
