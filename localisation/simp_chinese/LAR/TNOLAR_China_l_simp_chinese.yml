 CHI_Great_Asian_War_warconfidence_GUI_cn_confidence_progressbar_tt:0 "£GFX_LAR_CHI_war_confidence_blue_texticon §D战争信心§!\n§W--------------§!\n£GFX_LAR_CHI_war_confidence_blue_texticon §D战争信心§!代表了我方阵营对战争局势的预期，§D时间§!、§D战线§!与£GFX_LAR_CHI_war_supply_blue_texticon §D战争物资§!会共同影响£GFX_LAR_CHI_war_confidence_blue_texticon §D战争信心§!的每周增减。\n\n若我方£GFX_LAR_CHI_war_confidence_blue_texticon §D战争信心§!过低则会为我们带来诸多§R负面影响§!。\n§W--------------§!\n当前，我方阵营的£GFX_LAR_CHI_war_confidence_blue_texticon §D战争信心§!为：§D[?CHI_Great_Asian_War_GUI_cn_confidence_var]§!§W/100§!，其将产生以下影响：\n\n核心领土单位攻击：[?CHI_Great_Asian_War_GUI_cn_confidence_var_army_core_attack_factor|%=+]\n核心领土单位防御：[?CHI_Great_Asian_War_GUI_cn_confidence_var_army_core_defence_factor|%=+]\n战争支持度：[?CHI_Great_Asian_War_GUI_cn_confidence_var_war_support_factor|%=+]"
 CHI_Great_Asian_War_warconfidence_GUI_jp_confidence_progressbar_tt:0 "£GFX_LAR_CHI_war_confidence_red_texticon §R战争信心§!\n§W--------------§!\n£GFX_LAR_CHI_war_confidence_red_texticon §R战争信心§!代表了敌方阵营对战争局势的预期，§R时间§!、§R战线§!与£GFX_LAR_CHI_war_supply_red_texticon §R战争物资§!会共同影响£GFX_LAR_CHI_war_confidence_red_texticon §R战争信心§!的每周增减。\n\n若敌方£GFX_LAR_CHI_war_confidence_red_texticon §R战争信心§!过低将会为敌人带来诸多§G负面影响§!。\n§W--------------§!\n当前，敌方阵营的£GFX_LAR_CHI_war_confidence_red_texticon §R战争信心§!为：§R[?CHI_Great_Asian_War_GUI_jp_confidence_var]§!§W/100§!，其将产生以下影响：\n\n单位攻击：[?CHI_Great_Asian_War_GUI_jp_confidence_var_army_core_attack_factor|%=+]\n单位防御：[?CHI_Great_Asian_War_GUI_jp_confidence_var_army_core_defence_factor|%=+]\n战争支持度：[?CHI_Great_Asian_War_GUI_jp_confidence_var_war_support_factor|%=+]"
 CHI_Great_Asian_War_warconfidence_GUI_cn_supply_progressbar_tt:0 "£GFX_LAR_CHI_war_supply_blue_texticon §D战争物资§!\n§W--------------§!\n£GFX_LAR_CHI_war_supply_blue_texticon §D战争物资§!代表了我方阵营对战区的掌控与补给能力，由我方§D完全控制§!的每个战区在每周结束时都会为我们生产额外的£GFX_LAR_CHI_war_supply_blue_texticon §D战争物资§!。\n除对各战区进行补给外，£GFX_LAR_CHI_war_supply_blue_texticon §D战争物资§!还可用于制订各类£GFX_LAR_CHI_Command_system_texticon §D战争预案与计划§!，以此为我们提供种种增益。\n\n然而，若未能合理平衡计划与后勤，当我方£GFX_LAR_CHI_war_supply_blue_texticon §D战争物资§!库存过低时又会为我们带来诸多§R负面影响§!。\n§W--------------§!\n当前，我方阵营的£GFX_LAR_CHI_war_supply_blue_texticon §D战争物资§!库存为：§D[?CHI_Great_Asian_War_GUI_cn_supply_var]§!§W/300§!，其将产生以下影响：\n\n适役人口修正：[?CHI_Great_Asian_War_GUI_cn_supply_var_conscription_factor|%=+]\n陆军组织度：[?CHI_Great_Asian_War_GUI_cn_supply_var_army_org_factor|%=+]\n非战斗补给耗尽惩罚：[?CHI_Great_Asian_War_GUI_cn_supply_var_out_of_supply_factor|%=-]"
 CHI_Great_Asian_War_warconfidence_GUI_jp_supply_progressbar_tt:0 "£GFX_LAR_CHI_war_supply_red_texticon §R战争物资§!\n§W--------------§!\n£GFX_LAR_CHI_war_supply_red_texticon §R战争物资§!代表了敌方阵营对战区的掌控与补给能力，由敌方§R完全控制§!的每个战区在每周结束时都会为敌人生产额外的£GFX_LAR_CHI_war_supply_red_texticon §R战争物资§!。\n§W--------------§!\n当前，敌方阵营的£GFX_LAR_CHI_war_supply_red_texticon §R战争物资§!库存为：§R[?CHI_Great_Asian_War_GUI_jp_supply_var]§!§W/300§!，其将产生以下影响：\n\n适役人口修正：[?CHI_Great_Asian_War_GUI_jp_supply_var_conscription_factor|%=+]\n陆军组织度：[?CHI_Great_Asian_War_GUI_jp_supply_var_army_org_factor|%=+]\n非战斗补给耗尽惩罚：[?CHI_Great_Asian_War_GUI_jp_supply_var_out_of_supply_factor|%=-]"

