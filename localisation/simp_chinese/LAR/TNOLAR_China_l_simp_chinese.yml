 #tnolar_chi_flavor.#.t:0 "暗堡"
 #tnolar_chi_flavor.#.d:0 "半夜，街头灯光吱呀闪烁着。安静的街道上一名黑衣男子靠着墙穿过灯光走到了立法院门口。守卫还在打瞌睡。黑衣人确认无误后立刻窜进了立法院的大楼里。伸手不见五指的大厅中，他打开了胸灯，轻车熟路的在各个重要席位旁安上了闪烁着红蓝光色的管状物——那是炸弹。\n\n不一会，黑衣人完成了任务，正准备溜之大吉，忽然灯光昼亮快要扎瞎他的眼，警卫从各个门口鱼贯而入。绝望的黑衣人打算立刻引爆炸弹，但来自国安局特工精准的一枪直接打穿了他的手腕。随后这个恐怖分子被缉拿归案，至于他开不开口已经无所谓了，以后有的是方法让他开口。"
 #tnolar_chi_flavor.#.a:0 "准备请客吃饭了。"
 #tnolar_chi_flavor.#.a.tt:0 "§a国安局§!介入为政治行动保护了安全的环境，£GFX_GNG_Guangdong_texticon §R广东行政长官§!更一步向我们靠拢了"

 #坎通尼亚的结局
 #索尼-和谈
 tnolar_chi.1150.t:0 "夜半会谈时"
 tnolar_chi.1150.d:0 "立法会的夜晚向来是大门锁死，任何人不得入内。但此时，长靴踏地的踢踏声回荡在立法会漆黑的长廊。靴子主人的步伐略显踌躇，有些犹豫。而当他推开走廊尽头一扇不起眼的木门后，昏黄的灯光自门内泄出，坐在门内等候来者许久的，正是广东国此刻最有权势的二人：盛田昭夫和李嘉诚。\n\n“宋先生。”盛田昭夫看着此刻正在关门的宋之光，起身以粤语问好道，“战事将近，此前我们已磋商数次。今夜叫您前来，也是为了给您一个答复。”尽管表现得冷静非凡，但盛田昭夫的心脏也跳的前所未有的快。他的手心此刻也已然汗湿，正装作不经意的搓揉自己的衣角。\n\n“当然，行政长官阁下。”宋之光理了理自己的衣领，“您的意愿便代表了广东国政府的意愿，我诚恳的想要知道您此刻的态度。”\n\n“嘉诚。”盛田昭夫仅是轻呼其挚友的名字，李嘉诚便点头，开口向宋之光问道：“在表达我们的意愿前，我们更想知道，中华民国对于我们提出的要求是何态度？”\n\n“我已经亲自请示了高总统。”宋之光故意停顿片刻，引出了面前二人对于他话的好奇，“对于二位的要求，无论是保持既有的《广东民生条例》及改革不得变动，还是李嘉诚先生特别强调的，赋予所有珠人中华民国国籍的要求，高总统表示全部同意。而战后，二位无论是加入我们新组建的政府，还是打算就此退休，我们都绝无有任何干涉。”\n\n听到这里，李嘉诚和盛田昭夫无不长呼出一口气。他们都知道，广东就是他们的一切，活在旭日的阴影之下，自己的改革随时都有可能被疯狂的日本宪兵，陆军或者满洲的境外势力付之一炬。想到这里，盛田昭夫挠了挠自己白发，沉思片刻之后，一字一顿的说道。\n\n“宋先生，请帮我致电高总统。在接下来的战事之中，广东国将作为抗击日本的一份子参战，而在战后，将不再作为独立国家，正式并入中华民国，成为中国的一份子。”\n\n在盛田昭夫说完之后，李嘉诚走上前，拍了拍宋之光的肩膀，低声在他的耳边说道：“为了广东和广东人民的未来，为了我们所有人的未来，我恳切的希望中华民国不要辜负所有人的期望。”\n\n听到这话，宋之光的脸上露出了难得的真切笑容。随后，便是郑重的承诺。"
 tnolar_chi.1150.a:0 "“为了广东数千万生灵之未来，宋某定效犬马之劳，万死不辞。”"
 
 #松下-和谈
 tnolar_chi.1151.t:0 "最好答卷"
 tnolar_chi.1151.d:0 "广东松下集团总部的高楼如一柱哨塔般伫立于广东繁华商业区的中心。几年前，宋之光曾经听闻松下正治父亲的办公室在大阪被称为“鹰巢”。而现在，当他从电梯里走出来的时候才意识到，松下正治的办公室和他父亲相比相比起恐怕是有过之而无不及。\n\n仅仅是站在这面环绕半屋的玻璃之后便能看到整个广东沉溺于霓灯溢彩的夜景，而松下正治本人此刻站在窗前，霓虹灯的闪耀模糊了他的脸庞，让宋之光都难以推断这位行政长官此刻在想什么。\n\n“宋领事。”松下在转身之前，以平淡却不容置疑的口吻说道，“我希望您这次同高总统会面之后，能给我带来满意的答复。”\n\n“当然。”宋之光走上前，从公文包里拿出一摞文件，摊在松下正治面前的桌子上，“高总统完全同意了您的要求，无论是在解放与松下集团展开亲密合作，还是对于您所做的商业改革保持最大的尊重，广东将会作为中国的经济开发区而独立存在……”\n\n宋之光的话没有继续往下说，因为他注意到松下此刻已经全身心的投入到对于文件的阅读中。出于外交上的礼貌，他选择保持沉默，房间里此刻只剩下木质时钟摆锤滴答晃动的轻微声响。直到一声纸张摊平桌面的轻响，松下的嘴角露出了克制的微笑，他缓缓起身，向宋之光伸出了手。\n\n“我很高兴民国政府能够同我们达成共识，宋领事，我同意这份协议。”\n\n“很高兴您愿意同意，这也就意味着，广东将会同民国在即将而来的战事中站在一边。”\n\n宋之光同松下握了握手，尽管如此，他仍然疑虑于松下的决心。这个本家在日本本岛的大亨真的会放弃他的家族，转而同中国合作吗？\n\n“行政长官阁下，这件合作的达成，对您而言意味着什么？”宋之光以精明的角度发问道，“您看起来如此轻松，这件事情对您而言同签一份商业合作一样简单吗？”\n\n听闻此言，松下仅仅是扯了扯嘴角，随后便转身看向了广东的万家灯火，“在十年前，我曾迫切的渴望本家的认可，那时候的我出台任何法案，都是为了达到更高的效益，为了能够满足本家的胃口。那时候我很担心自己能不配位，即便将石油危机引发的种种事宜都处理干净，我都寝食难安。直到，我想起我父亲和我说过的一句话。”\n\n他没有继续说下去，直到吊起宋之光的胃口，才一字一句道，“松下的未来在于创新。”\n\n“这一次的合作，便是我向我父亲交出的最后一份答卷。”他看向宋之光，喃喃说道，“在同民国的合作中，广东松下电器会超越一切的日本财阀。自然，也会超越本家。这便是松下集团超越了派系的企业精神，也是我贯彻至今的精神。”\n\n在宋之光最终离开之前，松下正治以一句话结束了这次的谈话。"
 tnolar_chi.1151.a:0 "“合作才能走的更远，对吧，宋领事？”"
 
 #松下&索尼-军事解放
 tnolar_chi.1152.t:0 "未来几何？"
 tnolar_chi.1152.d:0 "街角，李俊带着工友围坐在一张展开的塑料桌，桌上放着几瓶从冰水里捞出来的啤酒。为了庆祝迟到了数十年的解放。餐厅的老板给李俊一伙人送上了一盘新鲜的白切鸡做下酒菜，“今天的酒和菜我请了，你们敞开肚皮喝，能喝多少喝多少！”老板阔绰的一拍胸膛，对面前的几位老客咧开了大嘴，随后便转身招待起了前来庆祝的人潮，每个人的嘴里都说着恭喜恭喜，好不热闹。\n\n“真的解放了啊。”李俊晃了晃脑袋，看了眼身后大街上庆祝欢呼的人潮，随后便拿起桌上的玻璃杯，将啤酒一饮而尽，“十几年前我们全家被铃木贞一的狗官从我乡下赶到广东来，那时候的日子苦啊。我至今都记得，那个日本监工把我改进设备的功劳全抢了，想都不敢想竟然还能看到日本人被打跑的那一天。”\n\n“李哥，这么多年来，我们可算是统一了，不用当亡国奴了。”坐在他身旁的年轻人嘴里此刻还嚼着白切鸡，说话声音有点嘟囔，“你看了电视没，民国军队已经查封了立法会了，很快就会正式入主广东了。到时候，我们就真的都是中国人了。”\n\n正当年轻人脸色红润，朝气磅礴说着美好前景的时候，坐在他对面的丁老头叹了一口气，脸上的皱纹也皱到了一起，“也不知道他们要怎么对待盛田昭夫和李嘉诚。要我说，他们两人不错。整整十多年来，要是没他们两个，我们只会被日本人欺负的更狠。你看看那个日立，那是人干的事情吗？逼得那劳工会都反了！”\n\n“是啊。”李俊点了点头，随后长呼出一口气，“不过，如果为他们求求情，我倒是还愿意。要是让他们一直干，我心里多少有些嘀咕。他们显得好，也只是和那些吃人恶鬼比显得好。不管怎么说，他们再怎么富有人情味，也还是甘于给日本人打下手打到现在。”说到这里，李俊似乎想起了几年前长江实业的专车差点把他和他弟弟一口气撞死的事情，免不住皱起了眉头。\n\n“李哥你说的有道理，人是不错，但是卖国贼就是卖国贼嘛。和咱们自家人比不了。”年轻人听着李俊的话，止不住的点起了头，“对了，李哥，你之后打算怎么做？广东重建在招人，我们要不要去看看？”\n\n“先把这酒喝了吧！”李俊伸了个懒腰，接着说道，“咱们也别苦大仇深了，当初日子那么苦咱们都挺过来了。现在解放了，未来肯定会更好！来，干了！”\n\n“干！”几个酒杯在酒桌上叮的一声碰撞在了一起，“敬广东的未来！”"
 tnolar_chi.1152.a:0 "至此，广东翻开了新的篇章。"

 #富士通-和谈
 tnolar_chi.1153.t:0 "长此以往"
 tnolar_chi.1153.d:0 "宋之光此刻正快步在会客大厅前的走廊上，在走进大厅前。他的余光瞥到了富士通公司的招牌：冷峻的纯白与理性的宝石蓝，齿轮般环扣的半圆，就如转动的思考齿轮一般。他曾经不止一次思考过代表这个双半圆标志的人是否如同这标志色彩一般冰冷，高效，也同时不近人情。\n\n“您迟到了，宋领事。”当他推开面前的大门时，井深大就站在会客厅的窗边“我不止一次同盛田说过，提前五分钟才叫做准时，准时只能叫做迟到。”\n\n他摘下眼镜，疲惫的揉了揉自己的眼睛，甚至没有同宋之光握手就坐在了椅子上。整个人的背都佝偻蜷缩了起来。\n\n“行政长官阁下，我想您日理万机，我就不必再多赘述了。”宋之光坐在了对面，语气带有些许的不容置疑，“即便在我刚才前来的路上都看到有华人正在游行要求广东国同民国的统一，您作为行政长官，不可能不知道这一点？”\n\n“我知道，盛田那个家伙已经在我耳边从第一起示威游行就喋喋不休到现在了。”他用食指和拇指掐着自己的眉心，显得烦躁而疲惫，“我为了广东国的生存已经对那些工人选择了妥协，而现在那些华人和珠人就连我的立足之地都要抢走不成？”\n\n“绝非此意，行政长官阁下。”宋之光谨慎考虑着措辞，面前的井深大看起来敏感而憔悴，近期的示威游行一定又让他回忆起数年前广东大暴乱的情景，“我想高总统本人开出的条件您也绝对看过了，日本人的条件会如此丰厚且优渥吗？就我们所知道的消息而言，他们不派出军队进行宵禁管理，血腥镇压就已经是极限了。”\n\n宋之光的话让井深大的嘴角抽了抽，他的高傲让他不愿意向民国政府低头，但盛田说的也绝非空话，很明显，选择日本带来的只会是更多的流血和牺牲。他作为工程师的理性强迫他做出最优解，至少，是做出最符合他曾经笃定发誓要关心的人民的利益。\n\n想到这里，井深大浑身瘫在了靠椅上，揉了揉自己的双眼，有气无力的咕哝道，“我不得不承认您说的完全正确，宋领事，我别无选择，我的理性让我只能同意您的要求。”\n\n“很高兴您做出了如此正确的决定。”\n\n“……你应该去感谢盛田，而不是我。”\n\n宋之光礼节性点了点头，在得到了满意的答复之后。他礼貌的起身，在有气无力的井深大继续抱怨之前就迈步离开了。"
 tnolar_chi.1153.a:0 "井深大沉默的看着宋之光的背影，一时语塞。"

 #富士通-军事解放
 tnolar_chi.1154.t:0 "终有未来日"
 tnolar_chi.1154.d:0 "李俊的双眼死死的盯着面前的闪烁着的霓虹灯标志——蓝与白的齿轮富士通公司的招牌曾经伫立于广东的每一寸土地。在曾经的行政长官井深大的嘴里，这色彩代表着秩序，理性与未来。但是生活在广东的华人，却在这冷峻的色彩之下哪怕蜷缩起身体也毫无的生存空间可言。自杀者的数量居高不下，珠江上漂浮垃圾与日俱增。精英主义的金字塔在铸成之日起，就压弯了广东无数华人的脊椎。\n\n但是这样扭曲的未来也终归不会长久，李俊深知这一点。他手中的铁棒狠狠地砸碎了面前闪烁的霓虹灯，蓝与白的光辉破裂成碎块撒在了街道之上。而在他的身后，无数华人多年的血泪早已变为了难以抑制的愤怒。富士通的标语和招牌被示威的华人们通通掀翻在地，满街满巷的摄像头被踩成了废铁。李俊只有两个字来形容面前游行的场景：报应。\n\n他注意到，自己在此之前被愤怒的人群裹挟到了居民区中。或者说，是珠人的居民区，井深大口中的努力者。他注意到自己正站在一栋设计紧凑的公寓前，尽管这栋公寓同旁边的建筑并无差异，他却仍然对此感到一丝熟悉感。不过，仅仅数秒之后，他就对自己没有迈步离开而感到后悔了。\n\n“大哥？”\n\n在楼道的拐角处，李俊看到了他的弟弟，李晞。正憔悴颓丧的站在他的面前。原本精干的西服此刻也已然松松垮垮，就连领带都耷拉在了一边。原来如此，自己曾经在隔离线外看着他的弟弟丢下父母搬进这公寓。\n\n顿时，李俊感觉到一股无名怒火自心中腾起，喉咙的深处就如同胃酸逆流般隐隐发酸。他想要痛斥李晞，痛斥他和那个井深大追求的未来就如此不堪一击。他也想要嘲笑自己，嘲笑自己这工人黝黑的皮肤，满是老茧的双手，怎么可能是他这天才的哥哥。但到最后，他也不过死死的抓紧了手中的棍柄。看着他憔悴的弟弟，他的亲弟弟一步一晃的走到了他的面前。\n\n李晞盯着李俊布满血丝的双眼，蠕动着嘴唇想要说些什么，但到最后，也仅仅是低下了头，以咕哝的声音说道。\n\n“……对不起。”\n\n对不起，当他抛弃父母，去寻找“远见者的未来”时，他的对不起在哪？当他帮着那些日本人剥削他的华人兄弟时，他的对不起在哪？李俊的视野都被愤怒冲成了一片模糊，当他回过神来的时候，捏紧的拳头已经狠狠地把李晞打倒在地。他想要怒吼，想要辱骂，到最后却也只是一口气憋在了胸口，憋出了一句冷冰冰的关心。\n\n“不想死的话，就别出门。”\n\n说完这话，李俊便头也不回钻回了游行的队伍之中。当李晞慌乱起身想要找到他大哥的身影时，李俊早就已经消失在了怒吼的人群之中了。"
 tnolar_chi.1154.a:0 "大梦初醒一场空。"
 
 #日立-军事解放
 tnolar_chi.1155.t:0 "终审"
 tnolar_chi.1155.d:0 "驹井此刻因恐惧而难以抑制的呜咽，浑身无力的跌倒在地。愤怒的工人们砸开了厚重的大门，把他从躲藏用的地堡中如拖死狗一般拖了出来。他优雅笔挺的西装在暴雨中的拖行中此刻沾满污泥。而当他被压住双肩，跪在政府大楼中的空地上时，他绝望的透过被打湿的头发四下张望。却只能看到众多“暴民”围成圆环，怒目圆瞪的无数视线好似要将他生吞活剥一般尖锐。\n\n“一群害虫还打算审判你们的主人吗？！”尽管说话已经模糊不清，驹井仍然用含混不清的日语嘟囔着说道，“杀了我也没用，用不了多久陆队就会把你们这些鬣狗通通镇压，你们那些北方的华人，也别想着能打倒天皇陛下的忠诚部队，到时候你们都得死……”\n\n“你个死扑街！”没等驹井说完，面前的壮汉一把揪住了他的头发，坚实的膝盖狠狠地撞在了他的鼻梁上，痛觉和冲击力让驹井倒在了地上，鲜血同雨水混杂在一起，“十几年，我们他妈的忍了你这牲口十几年！别指望你们那些宪兵和日本狗能救你了！”\n\n驹井听不懂面前这个华人用污秽的粤语在叭叭些什么，他在心里痛骂永野将军嘴上在开战初说着天天说着一旦华人暴动就让宪兵队的小伙子们发泄发泄。结果现在竟然让他，整个广东最至高无上的凯撒被一群畜生摆布！他挣扎着跪起身子，看向他的视线没有分毫同情，一时间，瓢泼的雨声在此刻竟显得极其刺耳。\n\n“死刑！”\n\n不知是谁在人群中高呼一句，如同一枚炸雷一般瞬间引爆了整个人群。群情激奋的群众脚踏声如同雷鸣一般此起彼伏，震撼大地，高举的双臂仿若千斤的铁锤一般势必要砸断驹井的脊椎！所有人的口中都高声呼喊着同一个词！\n\n“死刑！死刑！死刑！”\n\n喊杀震天的场面让驹井恐惧到再也无法佯装镇定了，哀嚎着挪动着身躯向后扭曲。他看到面前的壮汉抽出了一支手枪，就把枪口抵在他的脑门上。伴随着一声震天响的枪响，暴怒的人群沉默了。驹井发现自己额前的那支枪并没有开火，可没等他庆幸支援到来，脊背的剧痛让他意识到自己被人从身后打了个对穿。\n\n他倒在了地上，在他涣散的视线中，他注意到一个少年手中的枪正冒着白烟，几滴泪水自他满溢着怨怒的双眼中挤出，和瓢泼的大雨混杂在了一起没有分毫同情。"
 tnolar_chi.1155.a:0 "驹井如同虫子一般蜷缩在了一起，就这么死了。"
 
 #广东军政监/永野茂门的结局
 tnolar_chi.1156.t:0 "永野茂门的判决"
 tnolar_chi.1156.d:0 "法官神情严肃，仿佛判决的结果已是既定。身穿民国军服者排满两侧，脸上满是对于被告的戏谑嘲笑。而被告席上，那人的眼神满是怨恨，几道沾满了鲜血的绷带草草的系在了他的腹部。他让视线四下环视着在广场上草草搭成的法庭，挤满皱纹的脸如恶鬼一般狰狞。\n\n“被告永野茂门，屠戮百姓，镇压起义，于广东省残暴执政数年之久。累累罪恶，罄竹难书。”法官发话了，“尽管如此，出于义务，本庭仍将赐予被告发表结束语机会。尽管无论被告怎样发言，亦绝无使本庭转而施以仁慈的机会，此类事宜，提前告知。被告可以发言了。”\n\n永野茂门的双手近乎如钳子一般掐进了被告席的木扶手，他神经质的抬头，用布满血丝的双眼死死的盯着面前的法官，嘴巴一张一合。\n\n“我一生无愧于军人的荣耀，但唯有两件事让我追悔莫及。第一，便是我拒绝了副官帮我介错的美意，执意要以剖腹致死的痛苦来报效天皇陛下。以至于让我被你们这草台班子法庭给抓住，羞辱至此！”\n\n他的情绪似乎愈发激动，甚至连腹部的伤口在大喘气中再度开裂的疼痛都难以察觉。而口中说出的话近乎是以尖叫了起来。\n\n“第二件事！就是我没有杀光你们这些支那猪！我早就说过你们这些猪是天生的反骨，天生要反对大东亚共荣，反对泛亚主义的理想与愿望！再给我一次机会，我绝对不会让整个广东国有一个活着的华人！！”\n\n接连受辱似乎让永野陷入了疯狂，但是他得到的只有身旁翻译尖酸挖苦的嘲笑声。而得知了永野的结束语，连法官都忍不住大笑了起来，“我想您已经再无缘军人和宪兵的事业了，永野先生。为了让您能够在合理的范围内延长您的痛苦。我们特意把刑场设在了五公里外，还请您登上为您准备的敞篷专车，街旁的百姓们都等不及要欣赏永野将军您的英姿了。”\n\n一匹瘦马拉着的木笼子缓缓的走到了永野的面前，这让永野近乎气的快要跌倒在地。他身旁的士兵把他架上了笼子，而法官此刻也高举起了审判的木锤。"
 tnolar_chi.1156.a:0 "判决结果：游街后绞刑。"
 
 #GAW
 
 tnolar_gaw.1.t:0 "王道不施"
 tnolar_gaw.1.d:0 "山海关原本矗立着一座高耸的石碑，上面刻着“王道乐土大满洲国”八个大字，宣告着中国原来的北方边界，也是中国耻辱的象征。\n\n电光火石的彻夜战斗后，王兴揉了揉干涩泛红的眼睛，和老张一起打扫战场。顺着部队的前进的方向，他看见了一个被炸毁的石墩，旁边散落着无数的碎片，依稀还能从碎片上看出原来还刻着字。\n\n“老张，这是满洲那个大石碑吧？我记得上面写着什么‘王道乐土’之类的东西。”\n\n“狗屁胡扯的日本人，他们要真搞什么王道，我们还用得着来打他们？”老张不屑地踢走了脚下的碎石块，跟上大部队的步伐，踏上了解放满洲的道路。"
 tnolar_gaw.1.a:0 "泛亚的泡影和石碑一同碎裂开来。"

 tnolar_gaw.2.t:0 "意外发现"
 tnolar_gaw.2.d:0 "赵二杆子刚从地里出来，就看见有一辆辆协和军的卡车歪七扭八地开过去，车尾冒着刺鼻黑烟，上面拖着缺胳膊少腿的满洲士兵，最后面那辆还拖的是死人。他接过老婆递来的毛巾问\n\n“咋回事？这些兵咋这个样子？”\n\n“啥呀，你还没听讲中国军队打回来了？”\n\n赵二杆子听了很是震惊，他急忙扔了耙子往镇公所赶，给在里面当公证人的大儿子报个信，叫他回来，躲在家里别出来。结果半路上撞到了自己里长和两个协和军，把他拉住喝到：“皇上有令，所有成年男子都得入伍 ，保卫满洲，为皇帝尽忠！”赵二杆子满头大汗，但是两杆子硬家伙顶在腰上，他没那个胆子逃开。\n\n一阵灰尘扬起，两个协和军立刻摆开架势瞄准。但是还没等他们反应过来，一梭子7.62就把他们的钢盔连带头骨给掀开了，当然，伴随着一阵没吐完的类似狗一样的哀嚎。里长逃走了，只留下已经瘫软在地湿了裤子的赵二杆子。\n\n车停了，上面跳下来几个士兵，架起他。等到赵二杆子看清他们头盔上的青天白日之后，他立刻告饶：“老总们，咱就是种地的，没干过坏事哇！”驾驶楼里跳下来一个下等军官，摘下帽子站在他面前笑到：“赵大爷，你不认得我了，我是胡德良啊？”赵二杆子颤颤巍巍抬起头，然后惊呼到：“你不是隔壁胡家逃出去的二小子吗？”"
 tnolar_gaw.2.a:0 "总有些东西会回来的，人也不例外。"

 tnolar_gaw.3.t:0 "沈阳光复"
 tnolar_gaw.3.d:0 "夜晚，此时的沈阳再无战前的繁华，城内到处都是火光与枪炮声，天空被不时升起的照明弹照亮的如同白昼。在战前原本繁华的四平街，此时街上到处都是弹坑和燃烧的街垒，往常在街道上行驶的电车现在被燃烧的装甲车和坦克所代替。经过几场激烈的战斗后，几名中国士兵在沈阳市政公署升起了青天白日旗。\n\n南京，突然响起的敲门声将高宗武让文件堆中抬起头来，一声进来过后，秘书走进了书房，向高宗武递出了手上的报告，脸上带着兴奋的神情说：“总统，东北战区报告。”高宗武急忙接过报告阅读起来。\n\n“我军经过数天艰苦作战，于今晚攻克了沈阳市政公署。城内有组织的抵抗已经瓦解，城内守军大部被歼，但仍有少量日军依托大和旅馆等要塞式建筑负隅顽抗。城外敌军在收拢部分守军后向东溃退，目前已与我军脱离接触。至此，沈阳已确认落入我军手中。同时，沈阳经过数日战斗，损毁及其严重，火车站和机场已经无法使用。据悉，日军在撤退前有计划地炸毁了发电站和自来水厂等重要设施。战区希望在恢复沈阳市正常运转前，暂时停止攻势。中华民国万岁！”\n\n高宗武读完报告后，他的内心瞬间高兴起来，甚至连报告的后半部分也有意地忽略了。“总统，是否马上公布这个消息？”秘书问道。高宗武点点头，随后他让秘书拿来了录音机，带着喜悦的心情，对着录音机发表了讲话。\n\n一小时后，当沈阳光复的消息从收音机传出后。原本安静的南京城变得躁动起来，欢呼声从城内各个地方响起，甚至开始有烟花飞上天空，照亮了南京的夜晚。高宗武在窗前看着烟花，默默地在心里告诉自己。"
 tnolar_gaw.3.a:0 "这只是一个开始。"

 tnolar_gaw.4.t:0 "皇冠落地"
 tnolar_gaw.4.d:0 "新京，满洲的心脏，南满铁路的大动脉，日满亲善的桥梁……\n\n至少昨天还是如此。\n\n王兴没能看见新京繁华的街市，映入他眼中的不过是一轮轮炮火袭击和轰炸后的瓦砾堆，店铺上的招牌被炸得残缺不全，马路正中央铺满了砖瓦碎玻璃，散布其中的还有鲜血淋漓的残肢断臂。炮弹在大街上留下一个个大坑，以至于王兴他们班的汽车都被颠的半路抛了锚。\n\n沈阳之战后，老张和王兴在部队整编中被分到了两个不同的团。王兴所在的第四团参加新京战役，老张则被调去了其他地方。王兴和老张很幸运，被分别任命为各自团的旗手。在清扫了皇宫的最后一处抵抗据点后，王兴明白时间到了。他拿着旗杆小跑着，甚至没有注意到路过的关东军司令办公室，里面早已人去楼空，只有一堆散乱的文件默默躺在地上。富丽堂皇的宫殿没有勾走王兴的注意力，毕竟装饰得再美丽也没法掩盖宫殿中所饱含的，属于东北人民的痛苦与血汗。此时此刻王兴只想升起国旗，宣告解放的到来。\n\n抵达了皇宫屋顶，利索地升起了国旗，王兴骄傲地看向了正在飘扬的旗帜，又俯视这片所谓的皇城。象征皇权的宫殿被他这样的普通人踩在脚下，自辛亥革命以来中国终于彻底没有了皇帝，从本世纪开始的历史使命终于在此刻完成。"
 tnolar_gaw.4.a:0 "三千载帝政枷锁，六十年黄粱一梦。"

 tnolar_gaw.5.t:0 "海上烈火"
 tnolar_gaw.5.d:0 "“井上，快点装货，鬼知道支那佬什么时候就把弹片崩你脸上了！”\n\n“大连丸号”货轮即将在今天完成她在役的最后一次航行。按照计划，这次航行抵达长崎港后，“大连丸号”就会退役，拆成废铁，另有用途。井上是这条船的老水手了，尽管自己既不是水手长也不是大副，十年来依然尽心尽力为她装货卸货，不知道从满洲运走了多少宝藏和财富，今天他手头的这最后一批来自满洲的货物是他职业生涯中最值钱的那批，全是价值连城的黄金白银。这些都是满洲国的奴隶们用四十年的血泪产出的珍宝，如今都要从满洲的血管中流淌出去，成为支撑赤日燃烧的燃料。\n\n不过他们的算盘这回没打对。\n\n井上恍惚听见喷气式飞机低飞时特有的嗤嗤作响，随后就在爆鸣声中失去了意识。几只机翼上画着青天白日的飞机擦船而过，射下几十枚金黄色的火热嘲讽。“大连丸号”船身开了几个大洞，甲板陷入了一片火海，井上感到一阵晕眩，跌入了大海之中。海浪的拍打激起了井上求生的欲望，他努力让自己逐渐恢复清醒，奋力游向岸边。\n\n十分钟后，“大连丸号”完成了数十年的服役历史，光荣地成为了一堆废铜烂铁，只不过不是在长崎的船坞内，而是在异国他乡一处已经炸的稀烂的港口。岸边，井上撑起精疲力竭的身体，无助地看着大海上的烈火，他明白在中国军队到来之前自己和船上的财富已经无法离开满洲，只能绝望地跪在地上祈祷自己的命运。"
 tnolar_gaw.5.a:0 "掠夺成为了历史。"

 tnolar_gaw.6.t:0 "象牙塔下的阴影"
 tnolar_gaw.6.d:0 "胡德良曾是哈尔滨本地人，在当地民间流行着一个神秘的传言。医院总是莫名其妙有病人失踪，一家锅炉房的地下室，夜半时分总是会传出撕心裂肺的惨叫，却无人知晓来源。锅炉房被宪兵队严格把守，任何试图接近的人都会立刻被扭送警务厅或者就地击毙。神秘的惨叫声就这样困惑了所有人几十年，成为了哈尔滨市民们心中挥不去的阴影和谜团。\n\n现在胡德良将要亲手揭露这个秘密。在副官的汉阳造成功射杀了最后一个宪兵后，胡德良站在了那道神秘的钢化门前。他深吸一口气，招呼副官和突击队员们躲避起来，点燃了炸药引线。一声巨响后，钢化门被成功破坏，但是里面只是如同一个普通的锅炉房一样，几乎空无一物，除了那个大得吓人的锅炉。直觉告诉他锅炉并不对劲，于是士兵们七手八脚地拆开了锅炉，露出了涂有生物危害标志的门。队员们戴上了防毒面具和防化服，砸开了门，眼前的一幕让他们终生难忘：\n\n他们从来没见过那么多死相如此凄惨的尸体——有的身上长满了黑色脓疮，脖子鼓起如同甲状腺肥大，散发着恶臭停在玻璃罩里；有的肿胀如鼓，黄得透明的皮肤下面还流动着清澈的液体；有的则相反，只剩下了连干尸都自愧不如的皮囊，还有的……不管怎么样，即使这群老兵已经见过不知道多少肝脑涂地的场面，见到此类情形还是有不少人直接呕吐在了防毒面具下……胡德良早已全身发抖，可是他看见了旁边另一道门，他用颤抖的双手打开，而接下来的情形让他下半辈子永远在悔恨中度过，悔恨那个七十年代的傍晚为什么是自己那该死的双手要亲自打开那扇门，自己那该死的双眼为什么让惨状映入眼帘：\n\n手术台上，一具尸体被从喉咙到小腹地全面划开，内脏流得到处都是，而它那干枯的胃部似乎证明它生前挨饿的历史如同所谓的“满洲国”一样长，更可怕的是，数量并不多的尸斑似乎象征着直到哈工大光复前他才屈辱死去。胡德良已经说不出话，只张大嘴巴任由愤怒的泪水灌进嘴里，喉咙深处发出一种痛苦的哀嚎。"
 tnolar_gaw.6.a:0 "“不过，至少再不会有中国人为这场百年国耻买单了。”"

 tnolar_gaw.7.t:0 "兴安赤魂"
 tnolar_gaw.7.d:0 "叶为麟在抗联里待了几十年，也啃了几十年树皮树叶，为数不多的打牙祭时刻也就是到游击区的村庄里时，接受那些没忘自己中国人身份的村民们拿出的苞谷糊糊和高粱窝头。近四十年的折磨早就让已经年近花甲的叶为麟的消化道脆弱不堪，但也为他挣得了北满支队一个师长的位置。\n\n不过今天情况可就大不同了。\n\n夜半时分，警卫员把叶为麟摇醒，对他耳语了几句，随后他和哨兵们唤醒了所有营地里的抗联战士。大家还没有反应过来怎么回事，叶为麟就掏出了全师唯一一把信号枪，装上唯一一颗信号弹。\n\n“同志们，时候到了！”他喊到。随后天上就升起一朵绚丽的蓝色烟花，照亮了全师营地。大伙没反应过来怎么回事，随后发现夜幕中亮起了几十朵一模一样的蓝花。而在亮如白昼的绀青之上，他们听见了喷气机的呼啸，从西南方向掠过，向远处的齐齐哈尔城区飞去。营地离市区不远，战士们听见了炸弹乒乒乓乓的声响，齐齐哈尔顿时燃起了数以百计的烟火，如同神话时代祝融在世上兴风作浪的景象。\n\n“同志们，我们中国的爱国军队已于刚才发动了收复龙江城的行动。而现在，就是一雪前耻的时刻！全体都有，向龙江城进发！”叶为麟高喊道。营地里顿时向起热烈的欢呼，人人都喜极而泣，为了一个自由的中国，为了一个爱国者能吃饱穿暖的中国，为了一个不再被烈日炙烤、也不被雄鹰、巨熊撕咬的中国。\n\n上午十点，国军上等兵王兴举着国旗来到了齐齐哈尔市政公署，哦不，应该叫龙江市政府的大楼里。他绕过了残肢断臂与血泊，抵达楼顶的旗杆处。他发现旗杆下堆着一堆协和军和日军的尸体，下面似乎遮盖着什么。王兴用汉阳造的枪托砸开上面的残躯，发现了下面的叶为麟。他身上插着几把刺刀，头上还有一个弹孔，而僵硬的双手却拿着一把大刀，砍进一名日军的脖子里。王兴从他身上满是补丁和破棉絮的军装中找到了中国共产党的党员证，然后默默地替他合上眼睛，用军帽盖上了叶为麟刚毅而清癯的脸庞，升起了国旗。在这瓦蓝的青天和明媚的白日之下，在这四十年前马占山将军拼死守护的中华民国在东北的最后领土上，王兴惊讶的发现，他没注意的顶楼平台到楼梯道内，长眠了几百位东北抗日联军烈士们的英灵。"
 tnolar_gaw.7.a:0 "“他们睡在了自己的国旗下。”"

 tnolar_gaw.8.t:0 "海的彼岸"
 tnolar_gaw.8.d:0 "自从中国军队跨过长白山脉以来，日军在满洲地区的抵抗就已经减弱了许多，在攻克了周围几座村庄后没几天，第一支军队便已经开进了海参崴市中心，除了在外围郊区和几处关键的市政机关之外，他们并未遭遇任何激烈的抵抗。到了第二天，更多的军队进入了城市，市政府的牌匾被匆匆更换，一面青天白日满地红的旗帜飘扬在旗杆顶端。本地的华人照例在军队进城的街道两旁热情欢呼，而城中的俄罗斯人只是站在他们的身后漠然地望着……就这样，这座城市迎来了它一百年间的第五位主人。\n\n不久后的一个黄昏，老张和王兴倚在海滨的栏杆上休息。街上的行人寥寥无几，由于灯火管制的原因，即使现在已经是日落时分，四周的建筑依旧大多淹没在黑暗之中，若有若无的轮廓随着天色一点点淡去……\n\n傍晚的日本海是如此令人沉醉，海水拍打着海岸线，轻柔而悦耳。远处的水天相接之处晚霞和着云彩，俯视着激荡的水花，映出一片波光粼粼的画卷。海风吹拂，带来阵阵咸味，二人凝望着远方的海岸线，许久未发一言。如若是平时这里未尝不是垂钓或露营的好去处，但如今没人再会想到这一点，在他们的身后，远处的细微黑烟昭示着战火依旧肆虐……\n\n“老张，我们和日本人打了这么久，要是把大海对面的日本人全部杀光，我们就会自由吗？”\n\n“这个嘛，”老张点燃了一根香烟，吐出的烟雾也随着呼吸溶解在海光中，“日本也有善良的人，也有无辜的人，他们和这场战争无关。”\n\n“那我们解放了整片大陆后，能过上幸福的好日子吗？”\n\n“谁知道呢。”"
 tnolar_gaw.8.a:0 "春风再抚北海岸，何日遍开自由花？"

 tnolar_gaw.9.t:0 "一江西去分两岸"
 tnolar_gaw.9.d:0 "鸭绿江的水腥味和长江不一样，或许旁人分辨不出，但从武汉来的小范分得清。他胸前挂着望远镜，独自站在岸边，望向江中。近千米宽的江面上仅余两列残存的桥墩，不必多说，这是日寇的杰作。为了将满洲和朝鲜结合为一体，日本人修建了两座大桥……无数血泪经由它们，流入殖民者的工业机器之中，润滑机器的齿轮，铸成帝国的荣耀。\n\n小范想起了武汉跨越长江，联系三镇的几座大桥同样铺设有铁轨和公路，川流不息，日夜不停，同样是经济的动脉。\n\n但它们不一样，小范想。他记得自己乘军列，从汉阳出发，借由大桥一路畅通无阻地跨过长江。江上航行着中国的货船，在两岸的港口之间运送货物，或顺江而下，船上载着很多东西……这般那般的回忆零碎地涌上，他脑中的世界像倒着磁带一样转了回去。\n\n父亲，母亲，街坊邻居，很多很多人的音容笑貌都一一浮现，定格在他登上军列，回头告别的时候。“也是该写信回去了，寄给李叔吧，他认字，能读信。”小范吹着江边的风，这样想着，心里斟酌起要写点什么：首先当然要向父母问候报平安，自己还全须全尾；然后是看着自己长大的老街坊们……\n\n忽然地，一阵湿冷把小范的精神唤回来，他俯下视线，看见江水已经拍打上立足的堤岸，溅湿了迷彩的裤脚；又抬头看向江水滚滚去处，在那岸，赤日如血，垂垂将落。光芒从江这边缓缓褪去，也将不再照耀那边，只是时间罢了。\n\n小范算了算时间，也该换岗了。临走前他最后用望远镜巡视了一次，看见江对岸的朝鲜民众正在日军监督下取水。可能是鬼使神差，他解下自己腰间的行军壶，也从岸边舀走了满满的江水。"
 tnolar_gaw.9.a:0 "二日争辉隔一国。"


 tnolar_chi_flavor.600.t:0 "返景入深林"
 tnolar_chi_flavor.600.d:0 "当第一支先遣侦察部队披着星光点映的夜空，跨过了山海关的崇山峻岭，再次踏上分裂了四十余年的陌生国土时，他们中的每个人心里都有说不出的感慨。\n\n领头的队长年纪不大，是个二十刚过半农村娃。他还记得自己从山坳坳里被从来没见过的大东西——高高的四轮卡车带出来时，第一次看到的连绵山脉之外的景色。幸好他自己还算努力，义务教育给了他从山沟沟里走出来的机会，勤工俭学外加高总统的奖学金，让他顺利大学毕业，找了份体面的好工作，也让家里的辛苦一辈子的父母能来城市里过些安稳日子，弟弟妹妹也是上了高中，老师们都夸奖他们是聪明孩子。他是发自内心的感谢那个素未谋面，只在报纸上看到过的高宗武高先生。\n\n很多事情他心里也很清楚，在大学里，同学们之间难免会流传一些“见不得人”的、“上不了台面”的书，甚至还有些被视为禁书的红封面本子，它们记录着日本人在二十年前的所作所为、政府领袖们的丑恶嘴脸，广大人民所受的压迫究竟来自何处……但他不想想，也不愿意想，因为他只是个好不容易从农村走出来的普通人，他还有双亲需要供奉，还有小辈需要培养……\n\n然而现在日本人又要来了，满洲国的二狗子和他们的主子又开始磨刀霍霍，所以他选择加入新生的国民革命军，成为吹响反攻号角的第一批人。中国的曾经的积贫积弱让他们深受其苦，但至少现在，他们还有反抗的机会。\n\n全队人埋入森林之中，他抬头望向远处边界的哨所，看向漫天的闪烁星辰，他在历史书上看到的一句话重上他心头："
 tnolar_chi_flavor.600.a:0 "“自社稷沦丧，宗庙之不血食四十年于兹矣。”"

 tnolar_chi_flavor.601.t:0 "别样烟火"
 tnolar_chi_flavor.601.d:0 "石猛带着自己的突击小队在满洲要塞的废墟中穿梭着，天空中时不时划过呼啸的引擎声，随之便是从天空陨落的钢铁巨鸟拖曳着燃烧的尾炎重重地撞在地上。战争已经到了最白热化的阶段，每个士兵都在拼尽全力，为了胜利，更是为了生存，为了活下去。\n\n通讯兵的耳机中传来一线上隆隆的炮声，日本人已经疯狂到对胶着的战线进行无差别的轰炸，战壕以及工事中仍在厮杀的士兵们无一例外的都被烈焰吞没，被弹片撕碎。随即两边又再一次冲上去争夺脚下的寸寸土地，这里距离新京只有五十公里，过了这里就将是一马平川。\n\n石猛的任务很简单，带着自己的小队，前往位于最后方的日军炮兵阵地，摧毁他们，协助进攻部队从中间彻底撕开以要塞为核心的共荣圈联军防线。直到目前为止一切都很顺利，他们已经成功的摸到了炮兵阵地边上，他让所有成员就地休息三分钟，检查好武器装备，毕竟马上就要玩命了。\n\n短暂的休整让石猛的思绪飞回了千里之外的乡村小镇，他想起了自己的爹妈，想起了村口的老槐树和破破烂烂的学校，想起了自己的老师，想起了第一次在农村看到的烟花——那是李老师在元宵节那天从城里带来的，虽然简陋，只是单调的亮白色和英红色，但那是他人生中最美好的回忆，那天开始他就立志要让自己的父母能过上好日子。\n\n炮兵阵地上喷涌的火光以及震天动地的声响将他从回忆中拉了回来，没时间怀念过去了，活下来，到新京，取得胜利，之后就有的是时间去规划未来。他检查了下自己步枪的状况，带头冲进了炮队的掩体中，随即火光迸裂，周围安静的就只剩下战壕内回荡的激烈枪声。\n\n夜晚八点五十分，所有人都看到了要塞后方的剧烈的爆炸，被冲击波抛向天空的弹头在空中化为朵朵烟花，阵地上的信号弹随之腾空而起，中方所有部队在同一时刻开始最后的冲击，此刻炮兵阵地上的弹药彻底殉爆了。"
 tnolar_chi_flavor.601.a:0 "那是所有人都没见过的别样烟火"

 tnolar_chi_flavor.602.t:0 "猎杀"
 tnolar_chi_flavor.602.d:0 "一列中国装甲部队正沿着河套平原的公路突进，最前方的步兵战车和侦察装甲车把武器对准了两边远处的林线。他们接受到的任务是快速穿插到地方的补给中心附近，为后续部队打开通路，一路上已经有数只小股日军步兵被他们歼灭，他们自己只因为机械故障损失了几辆装甲车和坦克，天空中时不时传来的音爆声以及坠落下的飞机残骸提醒所有人，这一区域正处于最激烈的争夺当中。\n\n随着前沿侦察部队通过这段最危险的路程，后续的主力也跟了上来。十五辆69G式坦克成队列加速通过这段公路。排头车的车长正从车长观察塔中向外窥视，时刻提防着可能出现的敌情。\n\n远处的林线中迸发出剧烈的火光，数颗尾翼稳定曳光破甲弹划过道道弧线击中了排头车的炮台，车内的弹药被引燃，巨大的爆炸将沉重的炮塔掀起数十米高。坦克队列立刻掉头转向迎敌，指挥车迅速的发现了目标所在方位。火炮齐射的巨大冲击波掀起路边的尘土，脱壳穿甲弹带着橘红色的曳尾飞入树林中。突然，另一方向又传来的炮声，三辆尾车在被集火的瞬间便被金属射流从车体侧面打了对穿，燃油泄露后将战车烧为了一堆废铁。\n\n但坦克队列并没有慌乱，他们释放了引擎烟雾和抛射烟雾弹，白磷弹爆开，剩余的十一辆坦克躲进其中。“这群支那懦夫只会这种等死战术吗？”伏击车队的日本指挥官在战车中嘲讽道：“和几十年前相比完全没有长进，看你们还能藏多久……”\n\n出乎他意料的，剩下的坦克并没有溃退，反而是从烟雾中冲了出来，直奔他们的伏击阵地。105毫米火炮已经切装回了最新式的尾翼稳定脱壳穿甲弹，随着矛头阵型的第一辆车发现目标并开火后，日本指挥官听到了炮塔外的巨响。伏击位置稍微靠前的两辆友军坦克已经被击毁，车内弹药正在熊熊燃烧，发出冲天的火光。日军坦克立刻展开还击，这一轮互射中双方各自损失了两辆坦克，之间的距离还在不断被缩小。第二轮齐射开始，又有两辆日军坦克被击毁，中方只损失了一辆。接着是第三轮、第四轮……\n\n日军指挥官的头上已经渗出了汗水，他耳边无线电中传来下属要求撤退的慌乱声音，观察窗中69G式坦克离他们越来越近，而烟雾还没有散开，第二轮烟雾弹又临空爆开，另一侧的日军还没能计算好距离就再一次丢失了目标。"
 tnolar_chi_flavor.602.a:0 "“在这一刻，谁是猎人？”"




 tnolar_gaw.1000.t:0 "最后通牒"
 tnolar_gaw.1000.d:0 "急电从东京传来。显然，面对当下的战争进程，他们送来了最后通牒：停火或核打击。然而我们无法确定他们的威胁究竟几分真实。我们可以试着停止战争、主动谈和，或者是把他们的威胁当成虚张声势。\n\n由你决定。"
 tnolar_gaw.1000.a:0 "是时候坐下来谈谈了。"
 tnolar_gaw.1000.b:0 "空洞的威胁不会阻止我们！"

 tnolar_gaw.2000.t:0 "OFN和团结协定送来了军事援助"
 tnolar_gaw.2000.d:0 "根据战前的军事援助协议，定期会有大量的运输机从印度洋上的德国航母、太平洋上的美国航母以及印度和高加索的机场起飞，他们横跨上千公里飞到了我们的上空，投下了这些武器、装备、弹药以及其他军需物资和生活物资，我们敢肯定这些东西已经在他们的军用仓库里吃了几辈子灰了，但都这个时候了有总比没有好。\n\n不过也会有例外，比如德国人会送来先进的坦克来到战场上测试性能，而美国人会给我们一笔以他们的标准来说利息很低的贷款。很明显其他两个超级大国对于日本失去他在东亚的霸权十分感兴趣，或是把这些援助做为未来和我们谈条件的筹码，不管他们出于何种目的，我们都会照用不误。"
 tnolar_gaw.2000.a:0 "能抓到耗子的就是好猫"

 #GAW后
 
 tnolar_chi.700.t:0 "终战之日"
 tnolar_chi.700.d:0 "清晨的总统府总是格外寂静，太平湖边，高宗武独自漫步，从子超楼缓缓走向太平湖东侧的忘飞阁，在那里望着平静无波的湖水，“但愿今天不会下雨……”高宗武一边心里这么想着，一边走向一处窗口，望向湖面上的薄雾，以及天边的一片片乌云。\n\n就在他独享几个月来难得的空闲时，飞奔而来的秘书打断了他的思路。“总统阁下，外交部传来的紧急电讯，是……是日本外务省的声明，他们……他们要求停战……同意与我们进行谈判!”\n\n高宗武转向秘书，严肃的表情中看不出他的情绪，他说到：“详情禀上。”\n\n或许是被上司的表情所影响，秘书打开电报的动作显然有些慌乱，他急忙念到：\n\n“敬告中华民国总统： \n\n迄今为止，我们两国之间所进行的战事已经造成了巨大的，难以挽回的牺牲，世界局势同样因此动荡，这一切令我们感到惋惜，我们相信这同样是贵国政府所不希望见到的。因此，天皇陛下为谋求帝国臣民康宁与东亚和平，已决定发布终战诏书，同时日本政府对贵国政府提出以下倡议：\n\n一、日军与贵国军队任何地方之一切军队及公民，即刻停止敌对行动。\n\n二、日本及其盟国于贵国及其盟国以当前战线确定一条军事分界线，建立非军事区作为缓冲区，双方均不得在非军事区内进行任何敌对行为。\n\n三、在停战协定生效后的30天内，各方应将其收容下的一切坚持遣返的战俘分批直接遣返。\n\n四、日方愿意同贵国展开谈判，谈判地点交由贵国决定。\n\n望贵国政府能诚为东亚之和平，尽早予以答复。”\n\n听罢，总统的表情由严肃转为一丝冷笑 “这么说一切结束还早，不过在相当的程度上，是他们认输了......走吧，还有很多事情要做。”\n\n他又望了一眼远处的云朵，正巧看见东方的地平线上显出一抹金光，点亮了半边天空，驱散了那重重密云，在湖面的薄雾里织成了一道道金线……此时此刻，那升起的已然不仅仅是一轮升起的骄阳，更是一种感慨，一种欣喜，一种激动……"
 tnolar_chi.700.a:0 "以及明日的希望……"

 tnolar_chi.701.t:0 "广播"
 tnolar_chi.701.d:0 "清晨的太阳尚未在东京的地平线上升起，但来往上班的人群早已川流不息，所有人以为今天会是和往常别无二致的一天，但这种想法在早晨的通勤中便已灰飞烟灭。他们像这几个月来一样拖着疲惫不堪的身体走进电车，席卷东亚战火已然让经济危在旦夕，不论是工厂还是公司的加班都已经是没完没了，电车中总是一种疲惫与昏沉的气氛笼罩，伴随着与铁轨的撞击声不断行驶着。\n\n但是今天，突然响起的电车广播打破了有节奏的撞击声，新闻播报员的声音从中传来：“各位大日本帝国的臣民，现插播一条重要广播，天皇陛下将对当前局势发表重要讲话……”\n\n霎时间，车厢里昏沉的气氛烟消云散，每个人都从昏昏欲睡中惊醒，他们或多或少都能听出播报员声音中所加杂的紧张与不安……\n\n“……朕深鉴于东亚大势及帝国之现状，欲采取非常之措施，收拾时局，兹告尔等臣民。朕已饬令帝国政府通告中华民国及其盟国政府，泛亚之内皆兄弟，奈何刀兵四起，愿展开和平磋商，以求太平安康。\n\n盖谋求帝国臣民之康宁，同享万邦共荣之乐，斯乃皇祖皇宗之遗范，亦为朕所眷眷不忘者；数十载间，帝国素来以东亚之安定共荣为先，至如排斥他国之主权，侵犯他国之领土，固非朕之本志；然交战已阅数载，虽陆海将兵勇敢善战，百官有司励精图治，一亿众庶克己奉公，各尽所能，而战局并未好转，东亚大势亦不利于我。如仍继续作战，则不仅导致东亚山河破碎，万民凋敝；亦将破坏人类之文明。如此，则朕将何以保全亿兆赤子，陈谢于皇祖皇宗之神灵乎！此朕所以饬帝国政府而议和与中华民国者也。\n\n朕对于始终与帝国同为东亚共荣而努力之诸盟邦，不得不深表遗憾；念及帝国臣民之死于战阵，殉于职守，毙于非命者及其遗属，则五脏为之俱裂；至于负战伤，蒙战祸，失家业者之生计，亦朕所深为轸念者也；朕亦深知尔等臣民之衷情，然时运之所趋，朕欲忍所难忍，耐所难耐，以为万世之太平，望尔等臣民善体朕意……”\n\n就在广播结束的时候，电车逐渐靠站，车门缓缓打开，但本应人来人往的车站却没有一个人。突然，车厢后排一个妇女的哭声打破了沉寂，随后，如同连锁反应一般，整个车厢，车站和周围的的街道都陷入无比的嘈杂与混乱。恐惧、悲痛与愤怒的洪流在整个城市中传递，几位歇斯底里的鹰派高喊着口号向市政府的方向涌去，不知所措的人群在惊恐中漫无目的的奔走，就连赶到现场维持秩序的宪兵和警察也难掩崩溃的神情……\n\n在那林立的高楼之间，新一天的太阳正一点点的升起……"
 tnolar_chi.701.a:0 "可是这清晨的日出却如同永恒的落日般刺眼。"

 tnolar_chi.702.t:0 "遮羞布"
 tnolar_chi.702.d:0 "“总统阁下，日本方面的广播在一个小时之前已经报道关于天皇颁布终战诏书一事了，有关内容已经日报已经翻译并且加印，预计今天中午便可以出版了。”秘书一早便来到高总统的办公室。“国内电台转播这条消息可能还需要一段时间，不过情报部门已经截收的日方的广播录音，我想您可能希望听一下。”秘书随手将门关上，然后拿出一卷磁带对总统示意。\n\n“自然如此。”高宗武说完便停下手中的笔，将一张文件放回桌角，起身做到一旁的沙发上，说道：“开始吧。”\n\n“……朕深鉴于东亚大势及帝国之现状，欲采取非常之措施，收拾时局，兹告尔等臣民……\n\n……朕亦深知尔等臣民之衷情，然时运之所趋，朕欲忍所难忍，耐所难耐，以为万世之太平，望尔等臣民善体朕意……”\n\n广播的声音逐渐消失，高宗武却只是坐在椅子上，未发一言，但脑中的思绪却奔腾不止：“同享万邦共荣之乐？以东亚安定共荣为先？这究竟是什么鬼话，难道这群人无耻到这种程度了吗？还说什么固非朕之本意，听起来就好像是他们受了多大的压迫一样，再来一句以为万世之太平，不知道的人或许真的要以为他们的和平天使了......”\n\n“他们输了。”他终于开口对着秘书说道\n\n“至于那些......”他指向磁带机的位置："
 tnolar_chi.702.a:0 "“不过是一张腐臭的遮羞布罢了。”"

 tnolar_chi.703.t:0 "日落"
 tnolar_chi.703.d:0 "随着太阳从东方的地平线上升起，中华大地逐渐恢复了日间的繁忙。乡村里的村民牵着牛前往田地；城市中的职员匆匆吃完早饭便前往公司；年龄各异的学生成群结队的前往学校；但就在这时，无数的熙来攘往被广播，收音机，电视机里的一阵声音所打破：“插播一条最新消息，日本帝国天皇于今日通过日本放送协会正式对外宣布，日本帝国及其盟友向泛亚解放同盟无条件投降，下面将转播日本天皇投降时的广播……”煞那间，几乎所有都停下了原先脚步，涌向最近的可以清楚的收听消息的地方。此时仿佛世间的一切都只剩下了播报员沉着却不失惊喜的讲话声。\n\n“……朕深鉴于东亚大势及帝国之现状，欲采取非常之措施，收拾时局，兹告尔等臣民，朕已饬令帝国政府通告中华民国及其盟国政府，泛亚之内皆兄弟，奈何刀兵四起，愿展开和平磋商，以求太平安康。\n\n盖谋求帝国臣民之康宁，同享万邦共荣之乐，斯乃皇祖皇宗之遗范，亦为朕所眷眷不忘者；数十载间，帝国素来以东亚之安定共荣为先，至如排斥他国之主权，侵犯他国之领土，固非朕之本志；然交战已阅数载，虽陆海将兵勇敢善战，百官有司励精图治，一亿众庶克己奉公，各尽所能，而战局并未好转，东亚大势亦不利于我。如仍继续作战，则不仅导致东亚山河破碎，万民凋敝；亦将破坏人类之文明。如此，则朕将何以保全亿兆赤子，陈谢于皇祖皇宗之神灵乎！此朕所以饬帝国政府而议和与贵国者也。\n\n朕对于始终与帝国同为东亚共荣而努力之诸盟邦，不得不深表遗憾；念及帝国臣民之死于战阵，殉于职守，毙于非命者及其遗属，则五脏为之俱裂；至于负战伤，蒙战祸，失家业者之生计，亦朕所深为轸念者也；朕亦深知尔等臣民之衷情，然时运之所趋，朕欲忍所难忍，耐所难耐，以为万世之太平，望尔等臣民善体朕意……”\n\n在没有人意料到的情况下，这条广播如同春雷般响彻中国的街头巷尾，霎时间行者驻，劳者休，人们不自觉地聚集在广播下、电视前，难以置信地倾听电波带来的消息，试图确定这百年屈辱里来之不易的胜利。百姓并不能听懂广播里的日语，但他们依然奔走相告，向亲朋传递着胜利的好消息。没过多久兴奋的民众就当街敲锣打鼓，舞狮舞龙，鞭炮齐鸣，沉浸在胜利的喜悦之中。"
 tnolar_chi.703.a:0 "耻辱的历史画上了句号。"

 tnolar_chi.704.t:0 "归乡者"
 tnolar_chi.704.d:0 "老人被鸡鸣声吵醒，在恍惚中做起身来，缓缓向床边摸索。等到他下了那张木板床，才算是回过神来——今天该是出发的日子了，他要回家，回东北去。老人其实很早就打算走了，战争刚爆发的时候，他叫嚷着要去参军，却被儿子拦了下来，后来等到东北光复，他又开始说着回去的话，儿子却又说什么也不能允许他到还在打仗的地方。那现在总该是没有问题了，前线停战了，他终于可以回去了吧？可是他昨天吃完晚饭上向儿子提起这事的时候，儿子只是闷哼了一身，便一言不发的回房间了。不过嘛，老人本就没有指望儿子能理解，他明白，儿子只是担心他，况且他是在这西南生长的孩子，肯定不会像他这老骨头这样的……\n\n他走出进院子，看着光线朦胧的天空，依稀记起当年离开家乡的时候也是这样的天色……那天他没能像往常一样起来，而是被窗外的嘈杂声与父母的喊叫声惊醒，他被父亲一把从床上拽了起来，在他还没反应过来的时候就被带上了一辆马车，很快便驶离了他生活十多年的村庄......后来，他们走了很远，很久，他目睹了无数的惨剧，那从天而降的烈焰，那席卷村落的火舌，在这似乎无穷无尽的逃亡中，他失去了他的双亲，他也终于知道了他们为什么要离开，为什么要不断的逃亡。直到那天当他们在广播里得知投降的消息的时候，他们结束了流亡，各自散去，寻找谋生的途径，那天他们都以为自己再也不能以过去的身份重回故土……但今天，命运再次给了他回家的机会，他怎么可能拒绝呢，不论如何他都要回去，回到那片本就属于他的土地。他振奋起了精神，提起早就收拾好的行李，推开了院门。\n\n“爸！”\n\n身后突然传来儿子的叫喊，老人心不由得一沉，本以为自己又要被阻止，转头却看见儿子也拎着一大包行李正站在房子门口，就在他惊讶地说不出话来的时候，儿子快步走上前，一把抓过老人手中的行李，说道；“他们娘俩留下了看家，我跟你去，去一趟我们就赶紧回来，那里可不是多安全的地方。快点跟上吧，这里离车站可还远着呢。”\n\n老人呵呵的笑了两声，便赶忙跟上儿子的脚步，他走在平时走过无数次的乡间土路上，却从未有一次像今天这样步伐轻松，望着远处逐渐升起的太阳，老人不由自主地唱起了昔日的歌谣，他不清楚在如今的中华大地上，还有几人记得那往日的旋律：\n\n“……我的家在东北松花江上，那里有森林煤矿，还有那满山遍野的大豆高粱……”"
 tnolar_chi.704.a:0 "路的尽头是故乡。"

 tnolar_chi.705.t:0 "启程"
 tnolar_chi.705.d:0 "绚烂的烟花已经连续两天点缀着南京城的天空，仿佛无穷无尽的人群在大街小巷高喊着胜利口号，教堂、寺庙、学校、工厂、商店、住户鸣放着汽笛、爆竹、礼炮。欢欣鼓舞之状，绝非笔墨可以尽述。\n\n高宗武站在总统府办公楼的顶层望向被灯光和烟火点缀着的南京城，显然在民众的心中胜利已然到来，但是他内心深知，他现在不过是要踏上另一片战场而已，一片或许更加险峻的战场。日军的海军依旧在中国海疆上肆无忌惮的航行，在海峡的对岸，沦亡近八十载的台湾依旧在日军的铁蹄之下；鸭绿江之后，日本陆军的余部依旧虎视眈眈；而在更远的地方，导弹发射井与挂载核武的轰炸机更如同时刻高悬在东亚头顶的利剑。\n\n身后的脚步声打断了高宗武的思绪，秘书和两名卫兵已经站在了背后。\n\n秘书轻微鞠了一躬，随机说道：“总统阁下，车队已经准备完成，随时可以前往火车站。一路上的安保措施也已经妥善检查完毕。”\n\n“好，我们走吧。”高宗武说着转过身来，将手中的圆顶帽带上，便随同秘书步下了楼梯。\n\n高宗武的车队驶出总统府，感受到周围的欢声雷动。他穿过拥挤的大街小巷，人们纷纷为他鼓掌，向他表示崇敬和感激。他明白，这是因为中国与东亚的解放，是因为他们对他的信任和支持。他不经更对即将到来的谈判感到沉重的责任与使命感。\n\n火车站前人头攒动，车站广场上挤满了追随者和好奇的乘客。无数的横幅与旗帜在广场上招展。\n\n“变化真大啊，几年之前这里还能看见不少游行示威呢……”高宗武不经暗笑了一声，自言自语道。\n\n火车平台上的专列已经整装待发。身边随行的大小文官，武官站立在一旁，各自敬礼，向他表示支持和信任。高宗武驻足望向打开的列车门，深深吸了口气，走入了车厢。\n\n不久，列车呼啸向前，驶出了繁华的市区，穿越月色中美丽的江南风景……"
 tnolar_chi.705.a:0 "它将驶向浴火重生的未来。"

 tnolar_chi.706.t:0 "开场"
 tnolar_chi.706.d:0 "比起这几天以来的全国所有城市，上海的庆祝的盛况有过之而无不及。总统和随行人员的车队行驶在人群簇拥的街道上，漫天的纸屑和鲜花从两旁抛出，激昂的标语贴满了两侧的商铺店面……\n\n车内，秘书从副驾驶向后探身对着总统做着报告：“谈判会场那边表示，日方代表已经到场了，总统阁下。”\n\n总统看了一眼手表，说道：“无妨，让他们等一会吧，就说我们在路上了，这毕竟也是事实” 说罢继续望着窗外。\n\n车队一路缓缓前进，直达上海华懋饭店，总统刚一下车，四周的记者便从各处围拢过来，争相渴望拍下这历史性的时刻，由于这次是一次对全世界各国公开的谈判，各国媒体无不欣喜若狂，纷纷赶来见证这二战以来世界局势的最大的改变。\n\n大厅之中，高宗武见到了前来谈判的日方代表——佐藤荣作，那人他并不陌生，几年前的南京与台北的会议上他们都见过面。不过时过境迁，人是物非，曾经低声下气的民国总统正昂首挺胸的走过一众人群。而昔日大日本帝国的代表却站在一角，显得局促且不安……\n\n佐藤荣作走上前来，深深鞠躬，但是高宗武并没有像过去无数次那样弯下腰来，他只是微微欠身，点头致意，便示意工作人员带他们前往会议室……"
 tnolar_chi.706.a:0 "攻守之势异也。"

 tnolar_chi.707.t:0 "交锋"
 tnolar_chi.707.d:0 "双方代表在会议室中落座，再次简单问候之后，会谈便正式开始。\n\n“我觉得我们并不需要冗长的讨论，我方的条件已经十分明确了……”高宗武总统首先开口道：“中方在主权问题上和追求东亚各国独立上的立场不会退让……而这些……”一边说着，他示意秘书将翻译好的条约文本递给对方。“……这些就是我们的条件。”\n\n佐藤荣作从秘书的手中接过那份文件，一边阅读一边时不时用手帕擦拭鬓角的汗水，双手还在微微颤抖。他在外交领域几乎度过了半生，绝对不是没有经验的，但是他终究还是感到了恐惧，他不能更不敢在这份条约上签字，他在出行前见到了国内那些强硬派的抗议，几乎每天都有威胁恫吓的信件寄到他的住处，要是他在其上签下字，那他无疑将是帝国千古的罪人，他的将在恐惧和责难中度过人生最后的岁月……\n\n不过高宗武并没有去注意佐藤荣作的动作和那背后所反映的情绪洪流，他只是双手抱胸靠在椅背上，眼睛望着桌上的一份一模一样文件，一言不发。\n\n“这……”过了十几分钟，佐藤荣作终于开口。“……我们需要更多的时间思考，我要求与国内通话……”\n\n“嗯，既然这样，那么请便。”高宗武示意工作人员将日方代表带去隔壁的通话室，随即便继续靠在椅子上，一只手搭在桌上，缓缓敲击着桌面……\n\n高宗武回想到曾几何时，自己作为中国代表在外交场合也像日本代表今天一样如坐针毡，而他们始终一副趾高气扬的样子；如今，坐立难安的却是他们，真可谓攻守之势异形也。想到这，高宗武仿佛嘲弄一般，带着苦笑叹了口气……"
 tnolar_chi.707.a:0 "吾之往昔，君之今日。"

 tnolar_chi.708.t:0 "终幕"
 tnolar_chi.708.d:0 "终于，佐藤荣作从通话室中走出，显然恢复了部分的自信。\n\n“我方基本同意贵国所提出的条款，不过显然，部分细节仍然需要讨论……”他刚一坐回座位便开口道。“这点毋庸置疑。”高宗武坐起身，平静的说道……\n\n此后的数个小时之中，无数的细节被讨论，无数的用词，语句被一一斟酌……终于，双方代表起身握手，宣告谈判已经结束。\n\n接下来，双方代表在指引下各自离场，从不同的方向前往了签字的会场。\n\n大厅之中早已座无虚席，各国记者，各界代表齐聚一堂，让本应宽敞的大厅也显得狭窄。而大厅的正中，围出了一小块区域，其中放置的办公桌上，摆放着那份将决定无数人未来的条约，随着大厅两侧的大门的打开，原本嘈杂的会场顿时鸦雀无声。\n\n中日双方的代表从大厅的两头走出，在周围的闪光灯闪烁与快门声的交替中缓步走向会场中央。随着日本代表在签字的桌前坐下，用微微颤抖的手从胸前的口袋中掏出了一支钢笔，笔尖缓缓对准了落款处，在众人和无数摄像机的注视下，写下了第一笔……\n\n……但那一笔却并未写出，只是在纸上留下一道洁白的划痕，那支笔显然已经没墨了。众目睽睽之下，佐藤荣作的脸色登时变得煞白，仿佛日本国内物资的捉襟见肘都因这小小的钢笔暴露无遗。\n\n高宗武见状，当即说道：“阁下，您可以借用我的笔。”说着掏出自己的钢笔递向对方。\n\n佐藤荣作起身接过了钢笔，又用手帕擦拭了一下额头的汗水，用这只中国人的钢笔签下了在他眼中无异于断送了帝国未来的文件，并起身将其递还给高宗武。随后这位七十余岁的老人在双腿一阵轻微晃动中重新坐下，身体微微前倾，将头埋在颤抖的双手之中，直到数分钟后才在秘书的搀扶中缓步离场……\n\n几十分钟之后，会场人去楼空，这场战争画下了句号，无数人的命运将就此拉开新篇……"
 tnolar_chi.708.a:0 "历史的齿轮再一次转动。"
 tnolar_chi.708.tt:0 "§Y国策树将变化……§!"


 ### 战后衔接事件 ###
 tnolar_chi.800.t:0 "演说"
 tnolar_chi.800.d:0 "这并不是高宗武第一次在这个房间进行全国讲话了，但他还是不免感到紧张，也许是因为这是他第一次，第一次真正作为一个独立国家的总统，一个国际阵营的领袖坐在这里，第一次能将自己所想真正的表述出来，而不是一个只能当作傀儡的传声筒……\n\n随着开始的信号发出，在全中国的大江南北，无数的电视机前，收音机旁，都能听见总统讲话的声音。\n\n“亲爱的全国同胞们，无数次我曾畅想这样的时刻。中华民族最忠诚的儿女们勠力同心，将日本侵略者赶出我们的家园，换得真正的自由与解放。\n……\n而如今我们可以真真切切的感受到，大东亚战争以我们的胜利而宣告结束，炎黄子孙世世代代不必再受到旭日的灼烤，中国斩断了枷锁，使我们的祖国再次傲立于世界民族之林。\n……\n中华民族是伟大的民族，5000多年的历史为人类文明做出了不可磨灭的贡献。在这漫长的历史长河中每当中国收到威胁时，中华民族的儿女们便会义无反顾的前来保护她。过去的100多年里中华民族受到了前所未有的劫难。\n……\n然而中华儿女从未屈服。以兢兢业业自强不息的精神完成了现代化，让我们能有足够的实力战胜日本帝国。之前有人向我说过日本是全世界最强的国家之一，以中国的实力向日本挑战是自取灭亡，不如老实待在共荣圈中实现他们所谓的的“共荣”。我对他说到：中国相较于日本看起来似乎显得很弱小，但倘若在这土地上的数万万同胞都能意识到，今天我们是为了中国的自由而奋斗，为了公理和正义而战。那侵略者就像跳进火堆中首尾不能相顾了。\n……\n究其原因这场战争的胜利属于每个中华儿女，和全世界每一个愿为解放和自由而战的仁人志士，如果没有前线作战的勇士突破阵地，后方工厂中的劳工生产武器，田野中的农民提供粮食，这场属于中华民族与全世界人民的胜利就无从谈起，你们用汗水和生命实际诠释了‘同心同德，贯彻始终’的力量，这正是我们国家与民族在未来和过去无数岁月之中，所应秉持的精神力量，我谨以中华民国总统的身份向你们施以最崇高的敬意。\n……”\n"
 tnolar_chi.800.a:0 "青天白日满地红！"

 tnolar_chi.801.t:0 "早间新闻"
 tnolar_chi.801.d:0 "不等太阳从东方的地平线上升起，总统又一次在闹钟的铃声中醒来，总统府的大大小小的工作人员同样开始了又一天的工作……\n\n总统如同往常一样坐在饭桌前，吃完早餐之后，秘书带着一份文件走来，放在了餐桌上。\n\n“总统阁下，这是国安给您的简报，上面包括了最近几天并未在各媒体上刊载的新闻。”\n\n“好，知道了。”总统放下手中的茶杯，接过文件，打开阅读。\n\n这种简报是最近几年他要求国安定期提供的，考虑到各地方政府对与中央可能的或是不满或是谄媚，大量事务或是报喜不报忧或是干脆石沉大海，这种直接向总统汇报的渠道显然更可靠。\n\n虽然每次打开这种简报无疑是充斥了各种地方瞒报的丑闻，不过今天的简报还是让总统心头一紧。显然，这次的文件比往常多出了两三页。\n\n“武汉多家工厂和码头为改善工作场所环境与提高薪资举行联合罢工，厂区安保，地方警察与抗议群众爆发冲突，造成多人死亡，目前情况尚未缓和，可以确定其后有共党势力暗中干预，预计事态有继续蔓延之风险。”\n\n“东北地区匪患严重，多地村庄遭到大规模劫掠，当地治安警力严重不足，基层行政部门急需人员补充。”\n\n“河南多地出现歉收，当地农民与征税人员产生激烈冲突，目前已有多人被捕，其中一人为疑为共党成员。”\n\n“广州多个珠人社区与华人社区产生暴力冲突，目前已蔓延至多个城区，由于局势混乱，暂时无法统计伤亡情况。”\n\n……\n\n总统合上文件，揉了揉眼睛，叹了口气，起身准备回办公室，像这种报告，后面还有好几页纸，他现在已经完全没有在这里喝茶的心情了……"
 tnolar_chi.801.a:0 "总之，先给武汉市长打个电话吧……"
 
 tnolar_chi.802.t:0 "金瓯难固"
 tnolar_chi.802.d:0 "千百年来，中华民族的祖先为了团结与统一而不懈奋斗。通过政治、经济、军事、宗教等手段，将远在瀚海、草原、高山与深林的各族人民紧紧联系。最终随着乾隆皇帝击败准噶尔，将新疆重新纳入中国的管辖之后。各族人民终于打破了政权的隔阂，在同一个中央政府的统治下紧紧地团结在一起。即使西方列强趁着东方的虚弱大肆入侵，但在各族人民的英勇抗争之下，中国也保持着大致的统一。\n\n 然而日本帝国趁着中国的虚弱，将同气连枝的中国人民强行分离。它如同饥饿的猛兽一般，贪婪地撕咬着祖国母亲的血肉。台湾、东北、蒙古、华北.....随着日本攻陷重庆、广东企业国的建立，中国最终在武士刀的切割之下四分五裂。金瓯破碎的中央之国在战败的苦涩中风雨飘摇，而她的人民也不得不在日本扶持的分裂政权下忍受日本人的奴役。\n\n所幸在高总统的领导下，中华民国战胜了她的宿敌日本，将分裂的祖国统一在青天白日之下。但是因长期分裂而留下的隔阂，并没有因为宿敌的失败而打破，反而如处理不慎的刀伤一般渗血、发炎。雪域高原之上，僧侣们与可疑的外来者窃窃私语；瀚海阑干之下，教士煽动着信徒们组建分离武装；钢铁森林之外，溃兵们与城市的野心家密谋作乱；茫茫大漠之内，马匪们打着独立的旗号洗劫市集。就连国民革命的中心，首鼠两端的议员们也企图在分离逆流中捞取更大的利益。这些活动在国内的分离主义暗流犹如体内的病菌一般，严重危害祖国母亲的健康。"
 tnolar_chi.802.a:0 "华夏之土，岂容践踏？"

 tnolar_chi.803.t:0 "生于不义者……"
 tnolar_chi.803.d:0 "凌晨五点，漫天的暴雨倾泻在华东大地之上，几辆军车组成的队伍在夜色之中驶进了这座位于南京郊区的监狱之中。几位穿着雨衣的士兵在向狱警出示证件与文书之后便被带进了监狱的内部……\n\n而在牢房之中那人并不知道外界发生的一切，自从他几个月之前被关押进来……也许是十几个月？他同样不清楚，在这连窗户都没有的地下牢房中，只有阴冷的四壁和向来一言不发的警卫。他只能通过不规律的餐食来计算流逝的时间。\n\n不过今天确实是出现了不一样的情况，在他躺在那名为床铺实际上不过是填充了稻草了破布上睡觉的时候，牢门与钥匙碰撞的金属声将他吵醒，随后在他模糊的视线中两名士兵突然闯入，腹部突来的剧痛让他猛然清醒。\n\n其中一名士兵掏出一张显然是公文的纸，简洁有力的念到：“前华北政务委员会委员，前华北政务委员会财务厅厅长张仲直，根据南京最高法院判决，裁定被告张仲直危害国家安全，行贿受贿，滥用职权等罪名属实，判处被告张仲直死刑，将于今日执行。”\n\n随后那二人一把将他架起拖出牢房，一路向门口走去。在狱警打开外门的时候，张仲直发出虚弱的声音对周围人念念有词：“你们这些……卑鄙的……”但并没有等他说完，一名士兵走上前来喝到：“闭嘴！”随即用枪托劈头打下，他随即失去了意识……\n\n当他再度恢复意识的时候，已身处摇摆的囚车之中，行驶在南京的街道上，愤怒的群众围在街道四周，叫骂声透过囚车的铁壁也能听的一清二楚，时不时还能听到石块撞击车身的清脆响声。\n\n十几分钟之后，囚车在一处十字路口停下，两名士兵将他从车中一把拽下。车门打开的那一刻，群众愤怒的吼声变成滔天的洪水般冲击着他的耳膜。\n\n那两名士兵将他跪坐在路口的中心，行刑的士兵缓步绕到他的背后，“妈的，死杂碎。”与他擦肩而过之时，那士兵冲着他骂道，还不忘一口唾沫淬到他的脸上。\n\n子弹上膛的声音从背后传来，生命的最后一秒是如此的漫长……\n\n“狗汉奸死了！”人群之中爆发出的欢呼声几乎掩盖住了枪响。\n\n那是他听见的最后一句话。"
 tnolar_chi.803.a:0 "……必将死于耻辱。"

 tnolar_chi.804.t:0 "一天"
 tnolar_chi.804.d:0 "清晨的光照进窗前，街上的叫卖声划破寂静，林世被妻子的催促声从睡梦中唤醒，开始了他日复一日的生活。在餐桌上，妻子仍和以往一样抱怨微薄的薪水不够一家人的开支，让他不得不以要迟到的借口逃离妻子的唠叨。他一打开家门，刺鼻的空气就让他忍不住咳嗽起来。他骑着自行车驶往公司，和其他骑行的市民一样用铃铛驱散前面的行人，但此起彼伏的喇叭声将把清脆的铃铛声吞没。一辆豪车无视旁人地在路上奔驰，而长存于城市的雾霾也迫使豪车减缓行驶的速度。林世在想，自己到底有多久没有看到蓝色的天空了。\n\n午间的风徐徐吹拂，随风摆动的麦子掀起金色的浪花。李老头坐在田埂上，吃着老伴送来的午饭，他望着自家耕种的田地，心中涌起了复杂的思绪。年轻人基本上都跑到城里打工，农村里的房前屋后只能看到老人和孩子，曾经鸟语花香的农村如今变得死气沉沉，仿佛失去了未来。他不知道自己的身子还能干多久，但他只知道如果没有人种地，那人就没有东西吃了。\n\n夜晚的路灯照映着行人的身影，工厂里的灯光彻夜不熄。赵伍的轮班结束，约上三两个工友一块吃饭，顺便去工友那里用跌打药酒来治疗监工在背上击打的瘀伤。他们跨过大桥，走进桥边的苍蝇馆子熟练地点餐。桥边河流污水散发的恶臭并没有影响这间餐馆的生意，反而因为餐品的量足价廉使得收入微薄的工人们选择委屈自己的鼻子。正当他和工友准备开始饱餐一顿时，救护车的警笛声划破了餐馆内的喧闹。迟到的工友走到石头身边坐下，一边狼吞虎咽地吃饭，一边说着夜班工友的手掌被机器压断的消息。这让赵伍想起跟他一块打工的同乡，因为事故失去了一只手臂，而老板宁愿花更多的钱贿赂官员，也不愿意花一分钱给他治疗。他在想，或许中国人只是换了本国主子在继续压榨着自己，而他们的贪婪将把所有人榨干。"
 tnolar_chi.804.a:0 "我们赢得了过去，但未来呢？"

 tnolar_chi.805.t:0 "残垣"
 tnolar_chi.805.d:0 "手推车在遍布弹痕瓦砾的街道上吱呀呀地响着，刘有志带着行李和妻儿与第一批返乡者一起回到了阔别已久的城镇，默默地走向曾经的居所。多年前为了活下去逃离贫困的故乡，他只身一人沿着这条主干道走进了车水马龙的闹市，现在，带着家人和财产的他已经无乡可归，再次踏上这条道路时，偌大的城市除了废墟以外似乎并无他物。\n\n现实却总是出乎意料，刘有志扫视一片片建筑物废墟时偶尔总能发现几位老人从窗户和缝隙里探出脑袋，议论着返乡者的归来。无论是因为这些老人的儿女抛弃了他们，还是因为他们不舍得离开这片城镇，老人们最终留了下来，他们成为了遇难者和城镇的送葬人，但可以肯定的是，在他们心里充满了对城市新生到来的衷心期望。一路上有人向刘有志问好，有人主动帮忙清理道路，这些劫后余生者看起来远比刘有志还要激动。\n\n可刘有志并没有那么乐观，他看见埋在地下的水管被炸出地表，电线杆缠绕着被扯断的电线横在马路中央，数不尽的楼房被炸得面目全非，仿佛下一刻就要倒塌。他不知道自己的居处是否完好，不知道还能不能接上水电，也不知道将来几天该怎么解决吃饭的问题，他对活下去的问题一无所知。或许他可以加入工地重建房屋，或许可以接着在原来老板的手下打工，但前提是老板还活着。\n\n返乡的队伍继续前进，陆陆续续已经有人回到了曾经的房屋和店铺，他们按照记忆中的样子打扫着满地的狼藉，没人知道未来会怎么样，但所有人都在尽力将现实拉回正轨。"
 tnolar_chi.805.a:0 "废墟上将会建立起新的城邦。"
 
 tnolar_chi.806.t:0 "典礼之后"
 tnolar_chi.806.d:0 "此处的典礼与全国无数同样正在进行的庆典并无二至，阳光透过蓝天洒向庄严的广场，士兵们身着整齐的军装，胸前挂满了荣誉的勋章，脸上洋溢着自豪和喜悦。\n\n当开场的演讲告一段落，随着乐队奏起雄壮的进行曲，几位士兵被引导到颁奖台前，眼中闪烁着对祖国的忠诚和对和平的渴望。在众人的掌声和欢呼声中，一位高级将领走上前来，授予他们代表最高荣誉的勋章。士兵们骄傲地挺起了胸膛，自信满满地向每一位在场观众敬礼……而后又是一连串同样重复的演说和颁奖……\n\n数小时的庆典终于走向了尾声，两位将领起身从前排的座位中走出，一边交谈一边缓步走向离场的方向，时不时向四周敬礼的士兵点头致意。\n\n“中华民国自此真正地实现了独立自主，三民主义中的‘民族主义’也就算是实现了。”郝柏村喜笑颜开地感慨着“战争虽然结束，但国家的建设才刚刚开始。我觉得下一步中国应该走向民主化，实现‘民权主义’，让人民有更多的参与权和发言权，通过民主的方式，更好地集中民智，促进国家的长期稳定和发展，实现‘民生主义’。你觉得呢，仲苓兄？”\n\n蒋仲苓咽了下口水，沉默片刻，才开口说道：“是高总统带领中国实现了现代化，并且在战争中展现出了卓越的领导力和战略眼光，正是这种坚强的领导，才让中国达成了今天的成就……”他又沉默了几秒才继续说道，仿佛是在犹豫自己是否该说出内心的想法“我觉得应该让总统继续执政，没有必要急于改变现状，保持国家的稳定和政策的连续性才是重中之重，我相信总统会带领国家走向更加繁荣的未来。”\n\n郝柏村停步望向眼前的同事，刚准备开口却看到一旁正有一个士兵向自己快步走来；那士兵行了一个军礼，随即开口道：“将军阁下，有您的电话。”\n\n“既然这样……”郝柏村转头对蒋仲苓说：“抱歉失陪了。”随机转身跟着士兵向另一个方向走去……\n\n二人随即分别，只是在离去的路上，他们不约而同的转头望向对方，紧皱的眉头下多了一丝别样的眼神……\n\n战争的胜利只是开始，国家的未来依旧是未知数……"
 tnolar_chi.806.a:0 "……强权的暴力机器又将如何左右其间？"

 tnolar_chi.807.t:0 "奔逐来日之路"
 tnolar_chi.807.d:0 "在大东亚战争的硝烟散去之后，沉重的劳动再一次支配了欢庆后的人们。这是一家曾经饱受战火摧残，却又顽强挺立的工厂，无数工人的血汗与坚韧支撑了日夜不断的生产线。他们是庞大战争机器上的齿轮，轴承与养料，他们日益不歇的劳动供给了战争的胜利。\n\n工厂的大门缓缓打开，阳光洒在斑驳的墙壁上，映照着工人们忙碌的身影。他们身穿粗布工作服，手持铁锤和扳手，沉默不语地操作着机器，汗水浸湿了他们的衣襟，繁重的劳动压弯了他们的脊背，胜利好似空谈，一切都与胜利前并无二致……\n\n“第二次抗日战争的胜利是建立在人民的牺牲上的，一旦战争带来的庞大需求迅速瓦解，人民作为最大的牺牲者便会再度被抛弃，沉默的吞咽失业，经济衰退与社会动荡的苦果……”\n\n饭后午休，闲暇之余的工人们三两成群围坐在一起，悄悄地传阅那本薄薄的小册子。原本崭新的册子在工人粗糙的手中粘上了机油，汗味，就连册子的封面都变得皱巴巴的。识字的年轻工人小声的将册子上的内容读给不识字的老工人听，每个人都默默的咀嚼着书中的一字一句，每个人都对册中的思想有了自己的理解。在阅读终了后，工人们则各自离开投入到繁重的生产之中，而那本册子则小心的交给了换班的工人……\n\n“运营战争需要庞大的工业体系，而战争的结束带来的则是灾难性的需求减少。退役的军人所带来的庞大就业压力与订单的锐减会导致可怖的裁员风波。在缺乏最基本社会保障的情况下，失去工作就意味着失去收入，敢问读者可否设想究竟有多少家庭会因此而陷入食不果腹的境地……”\n\n出事了，沉重的刀片将工人的两根手指齐根切断，等待他的却只有无情的辞退信。相比起手指被切断的剧痛，小伙子似乎更震惊于工厂的辞退会来的如此之快，草草包扎的伤口又再度溢出鲜血，染红了双手中的辞退信。工友们在他的身旁一片哗然。他们没有忘记，这个小伙子在自己轮班完后仍然愿意为不识字的工友读书认报，教他们写字。他们没有忘记，现在被开除就意味着根本找不到工作，他家里的老娘老爹，兄弟姊妹还靠着他微薄工作勉强活着，他们没有忘记……\n\n工人们没有忘记，当初的日本人是怎么压榨他们的；工人们没有忘记，他们读的小册子里面是告诉他们怎么做的。他们想要不仅仅是没有日本人的未来，而是一个能够不用勒着腰带过日子，不用担心吃了上顿没下顿的未来。\n\n那一天，全厂的工人们都没有上工，他们走上街头，高举的拳头好似汪洋大海般波涛汹涌，齐声的怒吼似困兽犹斗，拼命挣扎想要冲破束缚。而在游行的队伍中，一块由红布拼成的旗帜再度升起，在蓝天的映衬下，似烈火般熊熊燃烧。"
 tnolar_chi.807.a:0 "代表的绝非过去，代表的定是未来。"

 tnolar_chi.808.t:0 "身为独立人…"
 tnolar_chi.808.d:0 "大东亚战争结束，战后紧急重建已近两月。在创伤稍得平复后，中国从今天开始为时一周的休憩与狂欢，慰劳她已付出无数血汗的人民。\n\n此时的北平城，气氛与中国其他大小城市别无二致：道路两侧张灯结彩，往来过客面带微笑，声声“恭喜您内”“贺喜了您”在无数此生只有一面之缘的陌生人间口耳相传。路上时不时有险些摔倒的人，也会被旁人一把拉住，互相会心一笑，那扶人的便离去了——而他也许会因为挺得太直的脊梁和不愿低头看路而重复此情此景。只是若真的点儿背跌倒了，那爬起来也不费什么力。\n\n堂子胡同附近也是如此，不过这里的居民们互相都脸熟了。从早起便三三两两的聚在一起吃过早点，买他几两瓜子，就和左邻右舍，搬着个板凳，在外面一坐，晒着太阳就唠起闲嗑。唠着唠着四处就响起劈里啪啦连串的爆竹，弄得声量得拉高才叫人听得清话。等到声音停了，准能再看见一帮大大小小的胡同孩子拖着一长挂儿鞭炮跑过去。\n\n时过正午，老街坊们正想再去钻饭馆，就看见胡同里走出来个队伍。人还不少，光学生就得有几十号，看着精气神挺足。还有年纪大些的，有几位看着就是教授的文化人模样，也有穿着朴素的工人模样。队伍最前方，一位学生一位教授分列两侧，各举着一杆大旗，一面写着“民主”，另一面写着“科学”。领头的高呼“独立中国万岁！”，队伍就喊“大东亚解放万岁！”，紧接一阵抛帽欢呼，再和道路两侧好奇看过来的居民们挥手笑别。\n\n街坊们跟着游行队伍走到路口，稍作犹豫便随第一个迈步的人远远跟上。人流两侧的旗帜愈增愈多，有同样的“民主科学”旗，也有青天白日旗，还有些上面写着“中国民主同盟”，“中华农工党”，”北京大学“等各式各样的党旗，校旗。人流越发庞大，队伍中掌声阵阵，后来者摇动旗帜，井然有序地勃发着澎湃的活力。\n\n队伍走上西长安街，与已在等待的数支队伍合成一队，和东长安街上同样游行的人群相向而去，要会合到紫禁城前。\n\n无数被吸引而来的北平市民随在其后，饶是风烛残年的老人也拄起拐杖，奋力随着人群而行。"
 tnolar_chi.808.a:0 "无数双手，一同翻动着书页……"

 tnolar_chi.809.t:0 "…直面未知之时…"
 tnolar_chi.809.d:0 "午餐后，高宗武拿起今日份的中华日报返回办公室。秘书已将糕点与一杯热茶摆放在了桌上，都是高宗武喜欢的口味。\n\n他在桌前坐下，稍微旋转椅子摆好方向，便将报纸展开，阅读起来。茶稍有些苦涩，高宗武本能地微微皱眉，不过提神用，刚好。他读着各地庆祝假日的新闻，叉起一块桂花糕冲淡口中的涩味……苦尽甘来。\n\n听着南京城里的鞭炮声，总统阁下长出了一口气。战后重建工作有条不紊，虽说有些要求提高薪资，缩短工时的声音传入府内，不过还不至于引起他的注意。放下报纸，他抬头看向天花板，在脑中排列着未来的计划。\n\n只是一阵急促的电话铃声打断了他的思索，有人拨通了紧急电话。“能有什么事？”他略带不满，不过还是拿起了听筒，准备听取一件值得如此的事情。\n\n“下午好，总统阁下。接警察汇报，现在北平汇集了全国各地的学生，正在举行集会，还有些政治异见分子参与。目前情况仍然可控，是否准备采取强力行动？”这个声音他熟悉，是北平市长。“如果是庆祝大东亚战争胜利，无需在意。”高宗武回复说。”情况超出了庆祝胜利的范围，阁下。“北平市长顿了顿，语气带上了些许紧张继续说道，“他们在借助大东亚战争胜利煽动民众情绪，称要争取平等与自由。”\n\n电话这头一阵失声，高忽然间不知道该说什么为好，视线凝固在了桌面文件露出的一角上。他沉默良久，只给出简单的回复：“不要干涉，让警察维持好会场秩序，协助集会有序进行，不要发生事故即可。”他的声音一如既往的冷静。“明白，总统阁下，请您注意健康。”电话旋即挂断。高宗武默然，几下吃光糕点后将茶水一饮而尽，又翻阅起来文件。\n\n此时的天安门广场上，数千人在由各式校旗，党旗围成的方形区域内席地而坐，远处简易搭起的演讲台上正站着十几个人，共同朗读着一篇文章：“……在淡红的血色中，会依稀看见微茫的希望；真的猛士，将更奋然而前行。”\n\n语毕，无论北平市民还是各地学生，纷纷高举起双手大力鼓掌，集会最重要的部分将来了。"
 tnolar_chi.809.a:0 "事已不能避……"

 tnolar_chi.810.t:0 "…正是历史的起点"
 tnolar_chi.810.d:0 "“欧洲曾有个政治家，他说人们应当追求‘自由，平等，博爱’，我觉得很好。”台上一位身着长袍的老者如是说道，“地无分南北，人无分老幼，人人心中皆有这三者，只是有束缚罢了。我们中国人也是讲求的，老庄之道讲自由，孔孟之儒讲博爱，只是平等这点，确是稍有欠缺。”老者虽然语速不快，但中气十足，“不过我们中国人向来也是擅长学习的，就论这各种各样的科技，以前还不能自产，也是后来我们努力，用着中国的武器打走了日本人。过去有人讲，中国人就是劣于外国人，是吗？现在证明不是的。自百余年前起，国难便当头，那时的中国人找遍了救国救民族的办法，最后说，如果不彻底西化，民族就没有未来。当时中国人要如何的绝望，以至于到如此地步？确实，我们中国的历史悠远，有积累下来的很多好的东西，也确有着很多恶劣的，应当被去除的东西。”\n\n老者稍作停顿，深呼吸了几遍调整节奏，又继续讲道：\n\n“德国有个哲学家叫尼采，他说人人应做超人，不做末人。有人窃取他的学说，理所当然地奴役其他民族，我看这是因为读得太少，完全不懂。尼采确说不要做末人和奴隶，那什么是奴隶呢？一个人骑在其他人的头上作威作福，那被骑者固然是身体的奴隶；那骑人者固然是身体的主人，而他们说，这是超人，我看不是。看似这骑人的要高贵些，但实是更深刻的奴隶：他甘做这种权力的化身，那他自己又在哪里呢？而那被骑的，若是当牛马当出了滋味，自然在精神上是十足的奴隶。”老者停了下来，看着台下人若有所思的面庞，讲出最后的话：“我们因此知道，尼采的奴隶，是精神的奴隶，所谓主人，也全然不是奴隶的对立。奴隶的对立是自由民，而自由民，是不在乎主人或奴隶，在乎自我的了，他也因此成为了超人，直面自我，超越自我的精神。只消一念之间的转变，但有千钧之重。为了中国人皆能为自由民，我们各民主势力一同宣布，中华民主进步联合会从今日起成立，不为什么其他的，只为人人能怀平等之心，博爱各人的自由。”"
 tnolar_chi.810.a:0 "在新的一页上，众人要各执其笔，同书新篇章。"
 tnolar_chi.810.tt:0 "§a十余年的前赴后继，他们是工农，是知识分子，是军人。§W聚无数人的牺牲§!，终成§W中国独立之基§!，坚不可摧。在这块基石上，中国人要去争取各人之自由，正为不负民主宪政的£GFX_LAR_CHI_government_texticon §W辛亥共和之梦§!。§!\n\n§m感谢您游玩§W新秩序：道阻且长§!的游戏内容，我们由衷地感谢您愿意关注并游玩我们的MOD——希望你玩得开心，正如我们制作它时一样！§!"

