 ##西北危机

 tnolar_chi.401.t:0 "西北烽烟"
 tnolar_chi.401.d:0 "正当高宗武还在和各地军阀关于统一事项互相拉扯时，一份急电打到了他的桌前。信件内容很简单，西北区域的马家军终于和西北方面军彻底爆发了军事冲突。\n\n高宗武立刻意识到这对国内统一进程的影响。之前西南暴动中他对于护国军的镇压很大程度上影响了各方面会谈的推进速度以及信任度，如果说这次马家军再出了任何问题，那想都不用想，统一基本上是不可能的。他立马叫来了自己的秘书，让他立刻通知国安局的人到他办公室一趟，这次危机只能由他亲自处理。"
 tnolar_chi.401.a:0 "抓紧时间！"
 tnolar_chi.401.a.tt:0 "§Y西北战争§!结束前，与所有军阀的统一谈判都将被§R搁置§!"

 tnolar_chi.402.t:0 "西北望"
 tnolar_chi.402.d:0 "万众瞩目之下，国民革命军越过了边境线，踏着西北的尘土向着青海前行，马家军的士兵们死死地盯着眼前一辆又一辆的运兵车，用眼神诉说着复杂的感情，疑惑、不甘、愤怒，当情感无法抑制化作言语时一切都凝结成三个字——为什么？\n\n西北的人民仍旧把我们当作日本的走狗，把他们自己当作反抗日本帝国的最后力量，马继援将军就成为了他们的行动和精神上的领袖，可马继援却率先“背叛”了他们，接受了”叛徒“的援助，他们所坚持的一切似乎都失去了意义。\n\n不过随着战事逐渐发展，越来越多的西北人民和士兵理解了他们领袖的作为，爱国民众捐献的物资源源不断输入后方，连绵不断的卡车将战争物资运往前线。那些老谋深算，仍有芥蒂的军阀们虽然置身事外，但也早已得出了自己的结论——南京的中央政府已不再是共荣圈中的一员，而要成为第一个反抗新秩序的力量。他们参与到这场武装冲突中不仅是给广大中国群众看，更是对大日本帝国的一封挑战书。\n\n尽管日本政府和帝国陆军都瞧不上那个神神叨叨的“疯将军”，但是西北方面军仍然是日本的军队。他们不会坐以待毙，任何对日本在中国权威的挑衅都在损害着他们统治的基石，而其他共荣圈成员对这场局部的的态度将会极大影响日后十几年、乃至几十年间亚太地区的格局。不论如何，帝国军队的脸面不容有失，而这场边境冲突也将会迅速升级成中华民国政府与日本帝国的角力，乃至局部战争。共荣圈牢固的利益链条上已经出现了一道深深的裂痕，再也无法隐藏。"
 tnolar_chi.402.a:0 "从中国的西北开始"


 #西北
 tnolar_chi.451.t:0 "噩梦复至"
 tnolar_chi.451.d:0 "北风卷起黄沙，刮过灰蓝色的天空，刘老伯一家就住在黄土高坡的这个屯上。\n\n一家四口里，大儿子托关系给人送到重庆读了书，二儿子跟他一起搭理自家的地，小儿子在家里等着自家哥哥毕业——毕竟对于一个农民之家，同时供给俩孩子读书实在是太困难了。刘老伯妻子走的早又当爹又当妈，日子也就将就这么过了。\n\n只是这最近太阳毒辣的吓人，引来的水在半路上就被蒸走不少，田里的苗萎靡不振，急得俩父子睡不着觉。\n\n又是一晚上，刘老伯在自家茅屋院子里抽烟，望着夜空上明亮的月亮和星星，突然一片还在挪动的星星吸引了他的注意力，伴随着一阵呼啸划破天空，某种不祥感爬上了他干裂的脸庞，那是几年前夺走自己妻子的噩梦，他连忙爬上茅草屋顶，敲着自家的破锣，大喊道——"
 tnolar_chi.451.a:0 "鬼子！鬼子又来啦！"

 tnolar_chi.452.t:0 "谈判暂停"
 tnolar_chi.452.d:0 "兰州马公馆，本来僵持着的谈判突然有了进展——虽然说不是好的进展：马继援派自己的部队包围了外交团队的驻地。\n\n外交官敏锐的意识到，肯定是哪个方向出现了武力冲突，之前虽然双方的接触并不怎么融洽，但至少从未有如此过分——准确的来说是慌乱的举措。\n\n几份电报发来，文件上的信息让外交团队无比震惊——日本人先动手了，西北方面军已经出动，辻政信带着他的恶鬼出笼了。\n\n“主任！总统急电！”又是一封信件，这份出自高宗武本人之手的电报向他们传达了一个信息，这不是小打小闹的边境冲突，日本人在背后支持着这个陆军弃子，想要完全吞下走廊地区，这是我们的机会。\n\n“谨记，此事是拉拢马，蒋二人的绝佳机会，展示我们诚意，无论如何要保第四十集团军。”"
 tnolar_chi.452.a:0 "“宗武亲电。”"

 tnolar_chi.453.t:0 "重建信任"
 tnolar_chi.453.d:0 "前线的报告如雪片一般飞到马继援灯火通明的指挥部内，军队基层指挥在西北方面军的突然袭击下已经乱作一团，脆弱的集团军后勤体系根本经不起这样的大规模战争。这不同于之前和西北方面军的小打小闹，这次的目的是彻底摧毁国民革命军第四十集团军。\n\n巨大的压力让整个集团军指挥层喘不过气来，也就在这时，外交代表团向他们伸出了橄榄枝：南京政府愿意秘密提供他们所需的一切援助——而且是无条件的。\n\n但起初马继援根本不相信他们：倘若南京政府真的如此好心，那么当时就该和毛泽东一起反抗日本人，为何要对奋起同胞痛下杀手，他无法相信手染同胞鲜血的汉奸。就在两方僵持不下的时候，一通来自南京的电话接到了马继援身边。\n\n是高宗武亲自打的电话，电话中他恳求和马继援好好谈谈。作为老练的外交官，他明白多余的解释已经无意义，唯有真诚的行动才可以真的打动，于是他展现了自己的诚意。\n\n“马将军，第一批援助物资已经发出，很抱歉，但我们在暂时也就可以提供那么多，清单等会我们的办事处会提供给您。”话音刚落，一份长长的表格地送到了马继援手中，从弹药到粮食一应俱全。“这就是我们的诚意，希望各位可以接受，恳请各位再相信我们一次，同心协力再对日寇。”\n\n马继援看着面前的清单，思考了足足十分钟，而电话那头在他眼中本来是头号汉奸的高宗武也一直等他的回复。最后，这个年轻的将军松口了："
 tnolar_chi.453.a:0 "“高宗武，高总统，我们愿意相信你一次。请您不要再让我们失望了。”"

 tnolar_chi.454.t:0 "拯救难民"
 tnolar_chi.454.d:0 "攀沿山路的难民队伍停在这片荒山沟子里好几天了。一路上天上时不时飞过的日本人飞机袭击他们，载着行李的拖车被打了粉碎，赶着的家畜也没能幸免，不是死于非命就是被吓得跑的没了影。受伤的人有的已经横死荒野，剩下的也只能苟延残喘。本来就一贫如洗的逃难百姓已经真的是一无所有。\n\n就在他们即将彻底绝望时，螺旋桨搅动空气的声音打破了死寂。低空飞行的直升机，机腹涂成了显眼的红蓝方块色。驾驶员似乎发现了他们，逐渐悬空降低。还站得起来的贫民呼喊着拼命挥手。\n\n再确认了下边人的身份后，驾驶员冒险把直升机降到了附近的平坦地上，机组人员把成箱的水以及应急口粮分给了断粮的队伍，重伤伤员被送上了飞机， 联络员留在了原地负责沟通支援，半小时之后，天边又出现了几只黑影，这只难民队伍顺利获救，而留下的联络员则登上了另一家空着的直升机，去寻找是否还有流落在外的平民百姓。\n\n南京政府临时搭筑的混凝土建筑虽然不美观，但水电齐全，这对于生活在黄土高坡以及戈壁滩上的大多数贫民来说已经是从没过过的好生活。但对于一些人来说，终究是故土难舍，许多老人都没有离开自己生活了几十年的土地——埋骨于此也是落叶归根。"
 tnolar_chi.454.a:0 "不过，至少有了新家"

 tnolar_chi.455.t:0 "西北孤月，壮士浴血。"
 tnolar_chi.455.d:0 "战车连连长李上尉第一个在名单上签下了自己的名字。高总统下令从军队中挑选志愿者前往西北抗击日寇。曾经在西南战场表现优异的李上尉在众人诧异的注视下，带头签下了志愿书。三十岁的他还没结婚，父母也早已去世，无牵无挂的他终于可以去完成自己的心愿：为他曾经犯下的过错赎罪。\n\n许多军人心里都清楚，所谓对“西北疯狗”的反恐活动，实际上就是对反抗日本的爱国同胞的血腥镇压。所谓立功受赏得到的勋章，不过是杀良冒功，用同胞的血染红自己的冠。也许许多没有良心，只想往上爬的人不会有所动摇，但对于李上尉来讲，他不能接受这一切。\n\n从小，父母就教育他，人可以不做官，但一定要做一个正直的人。西南暴动中手刃同胞的噩梦一直盘桓在他脑海间。他甚至都不敢再去见他父母的最后一面；他的父母也不愿再见他这个儿子，许多人都在戳他的脊梁骨。于是，当有这个机会去洗刷自己的耻辱时，李上尉毫不犹豫的签下了自己的名字。\n\n如果自己可以从西北战场上凯旋，那他就可以自豪的带上自己所得到的勋章，那是抗击外敌所得的荣誉；若是牺牲在戈壁之上，那也是对于自己的赎罪，他问心无愧。"
 tnolar_chi.455.a:0 "无惧马革裹尸"

 tnolar_chi.456.t:0 "兵踏沙场"
 tnolar_chi.456.d:0 "铁道线上，货运列车装载着从武汉兵工厂生产线上运下来的武器装备源源不断的送往西康，到了那里再由汽车翻过群山运到西北。与它们同行的则是卸下青天白日帽徽的志愿者。李上尉带着他的机动步兵连全连出动，他感到很欣慰，这些刚加入革命军的年轻人正直且勇敢，高总统也特批了最精良的装备给了他们。平板车上，巨大的战车被防雨布遮的严严实实，一直到了车站才卸下伪装。这是民国最新款的轮式战车，新标准的30口径机炮以及炮塔旁的反坦克导弹在黑夜下反射着微光。\n\n车上的货物正在源源不断的运下去，西北荒凉之地第一次连接上了中央强有力的心脏，鲜活的血液正在不断的冲刷旧血，为前线士兵以及后方人民带来胜利的希望。"
 tnolar_chi.456.a:0 "祖国不会抛弃西北"

 tnolar_chi.457.t:0 "平淡的悲剧"
 tnolar_chi.457.d:0 "远处冲天的狼烟在大漠昏红天穹下直冲而上，上尉的座驾一马当先，身后的车队带着滚滚黄沙跨过了西北方面军的防线。精良训练的炮手在他的指挥下不断开火，机炮的曳光弹咆哮着收割惊慌失措的日军，导弹拖曳着缆线将临时构筑的碉堡送上了天。\n\n这场奇袭持续了一个多小时，然后就在瞬间突然安静下来了。一个小队的日军步兵已经被彻底消灭，车队损伤轻微，战士们开始打扫战场，上尉也终于可以冒头，找个地方点根烟休息片刻。\n\n兄弟部队马上就要跟上了，他这么想；对于曾经参加过镇压西南“暴动”的自己来说，主动来到西北大漠可能算是一种自我救赎，身在一线的自己更明白，那是同胞之间的互相残杀，现在他是真真切切的在抗击日寇，实现自己在许久之前的梦想。\n\n被轰塌半边的楼房中传来了女人的尖叫，把上尉的思绪猛地拉回。跟着战士的指引，他来到了工事的坑道的拐角。一个不成人形的人正在尖叫，拖动自己伤痕累累的四肢缩回墙角，她哭喊着请求不要再摧残她。\n\n几个年轻士兵安慰了她许久，女卫生员拿来水和罐头，喂她吃了些东西，同胞的话语让她恢复了些许理智，在杂乱头发后边的双眼中涌出了热泪。\n\n上尉带着士兵深入到充满恶臭气味以及飞蝇的坑道尽头，一双双年轻，但已经混浊了的绝望眼睛静静的盯着他。"
 tnolar_chi.457.a:0 "他的心冷了，他内疚，他自责，他愤怒，他无处宣泄。"

 tnolar_chi.458.t:0 "生与死"
 tnolar_chi.458.d:0 "女孩蜷缩在病床上，也只有在护士来到她身边询问身体情况时才会吐出几个含糊的字。上尉在处理好战场后，把她交给了后续的兄弟部队转移到后方医院。医护人员的悉心照顾下，她身体上的伤已经好的差不多了。“也许会有伤疤但是没什么大碍的。”医生在检查完她的身体后给了个乐观结论。\n\n杂乱的头发在清理修剪后整齐的梳在了背后。幸好她的脸没受伤——也许是那些恶魔就想看到她清丽的脸在痛苦中扭曲的样子，才没把她的脸毁掉。但是空洞阴郁的双眼衬托的她像是个没生机的尸体——虽然她还活着，但她已经算是死了。\n\n也许，某刻，剩余的一丝生命也会被她自己抛弃。"
 tnolar_chi.458.a:0 "而那时，就是她生命的句号。"

 tnolar_chi.459.t:0 "分号"
 tnolar_chi.459.d:0 "“你为什么要活着？\n\n你这个肮脏的垃圾，被畜牲糟蹋过的烂菜贱货。\n\n你就该死在坑道里，为什么还要苟活？你的父母死了，朋友死了，你活着还有什么意义！\n\n对，就这样，结束吧，只要动动手腕，一切都会结束。”\n\n泪水和汗水混杂在她的脸上，苍白的嘴唇映着咬出的猩红的血。夹杂着血泪的扭曲面容在她耳边低语，死神充满怜悯的望着她，镰刀搭在她的脖颈，只待她自己低下头颅，划过锋刃的边口。"
 tnolar_chi.459.a:0 "谁来都好，救救我，救救我……"

 tnolar_chi.460.t:0 "冒号"
 tnolar_chi.460.d:0 "小林妹妹：\n\n见信好，我们的部队正在后方修整，因此才可以有空写一封信。这封信是我们战车连战友们的心意，还望你能耐心读完。\n\n我们很愧疚，因为各种原因我们来的太晚了。道路问题，向导问题，后勤问题，这些都不足以减少我们的惭愧和你的痛苦。\n\n日本畜牲凌辱杀害了你的好友姐妹，也折磨你让你痛不欲生，但我们希望你可以把一切痛苦都转回到我们身上。我们是战士，将会为你，以及所有受尽日本人残害的同胞复仇。\n\n最近得悉身体状况有所好转，但思想状态依然较差，特寄来此信，附一包朋友从南京寄来的甜点，还望养好身体，来南京游玩，到时必当好好招（潦草的笔迹）"
 tnolar_chi.460.a:0 "窗外明媚的阳光第一次温暖了她的心"

 tnolar_chi.461.t:0 "无垠怒火"
 tnolar_chi.461.d:0 "李上尉正带着自己的战车连执行特殊任务——追猎一个罪大恶极的日本陆军军官。这个任务即是出于私心，也是出于职责。\n\n这个军官就是上次他们突袭营地的总指挥，中佐军衔。小林以及那些姑娘就是被他从延安城中捉出来供士兵们“消遣娱乐”的，只可惜当时中佐和他的亲卫不在现场，不然李上尉一定会留活口——怎么活另说。\n\n漫天黄沙逐渐散去，远处地平线上逐渐冒出黑烟。按地图上来说，那边只有个应该迁走了的村子，一股不妙的恶寒忽然涌上他的心头。\n\n车队踩紧了油门，飞似的撞向村庄，但进村树上已经挂上了老人被折磨致死的尸体，房屋燃烧的噼啪声带着猩红的火焰凉了所有人的心。村中央广场堆满了没来得及逃走的村民尸体。李上尉几乎是从装甲车上瘫着滑了下来，他带着战士们寻找是否还有活人。\n\n到最后，却只剩下一个仰倒在地，肚子被剖开的赤裸孕妇奇迹般地带着最后一口气，直到战士握住她的手，方才松开了自己手中抓住的军章。"
 tnolar_chi.461.a:0 "又是一笔血债难偿。"

 tnolar_chi.462.t:0 "截断"
 tnolar_chi.462.d:0 "西北荒野上，破旧的官路就是连接各个城镇，乡村的动脉。倒不是说不能走野地，但似乎是达成了某种自然的协议，狼群只敢在路边五公里开外游荡。\n\n这当然不是什么自然规律，只是路边哨点卫兵的枪口和挂在门口的狼皮给了畜牲们切实的生命威胁。\n\n在南京方面介入冲突后，换装了现代装备的四十八集团军逐步开始压制住了西北方面军。到了现在，小据点被逐个拔出，大据点和城市则被切断了往外界的道路。胜利的天平逐渐倾斜向了中国方面，如果日本方面再不下场调解，那帝国陆军就会吃下二战以后的最大失败苦果。"
 tnolar_chi.462.a:0 "有人该服软了。"

 tnolar_chi.463.t:0 "捉住狼尾"
 tnolar_chi.463.d:0 "战车连跟着西北大军追着日本人来到了兰州城下，一路上他们主要负责侦查以及火力突袭，就连自诩中国精锐的西北军也不得不倾佩他们的果断与勇敢，马继援甚至打算直接给他颁发勋章，考虑到外交影响方才作罢。\n\n此刻的帐篷中的白板上，密密麻麻的贴着各种照片，军章以及日本勋章，这是他们一路来所追猎的所有第二别动队军人证明，但首恶依旧没有伏法。这个别动队的中佐队长太过狡猾，现在也只是知道他带着残兵躲到了兰州城内。\n\n但这样就足够了，辻政信逃不了，这个中佐也是。李上尉捏紧了拳头，只待总攻发起，他要手刃这个恶鬼，给这一切悲剧画上句号。"
 tnolar_chi.463.a:0 "今晚他给他们的战车绘上了钟馗。"

 tnolar_chi.464.t:0 "终结"
 tnolar_chi.464.d:0 "中佐躲在兰州城西北角的一座废墟中瑟瑟发抖，已经没了所谓的皇军天威。他的残余队伍在乘车往外逃时正好撞上了迂回的战车连。\n\n如果不是战车连为了承担攻坚任务而多带了穿甲弹，中佐就不会有机会在这里苟且偷生，他的剩余同僚在机炮的轰鸣中被穿甲弹打成了肉沫，然后又被反坦克导弹彻底送上天，只有他第一时间跳车得了条性命。\n\n得抓紧机会逃跑，他心想：只要逃出生天，就可以一路往北去蒙疆或者往东去满洲，到时候他就可以依靠自己加工后死里逃生的传奇故事再登大雅之堂。到时候他会再回来狠狠地告诉这些支那人为何日本才是他们的主人。\n\n正当他想入非非时，装甲车的轰鸣再次穿透墙壁传了过来，不止一辆，至少四辆停在了周围，炮塔方向机转动的电机声，高低机降下的齿轮声，就是在宣判他的死刑。\n\n之前在车上打进身体的毒品加速着他的心跳也强化了他的感官，当他想要找个地方逃跑时，他才发现自己的裤裆早已泛黄湿透，战车连就是追着这股尿骚味来的。"
 tnolar_chi.464.a:0 "机炮轰鸣盖过了所有的声音，一个魔鬼的生命终结于此。"
 
 #赢了
 tnolar_chi.465.t:0 "无需审判"
 tnolar_chi.465.d:0 "此时此刻，四十八集团军的战士们正在围攻西北方面军最后的据点。这群日本人把面前的这片城市建成了一只刺猬，到处都是隐藏的火力点，地下通道连接四方，想要完全吃下势必要付出巨大的代价。\n\n最后是民国的特别警察部队接过了这次行动的尖刀任务，作为特别训练过的城市战精锐部队，他们以令人惊讶的速度逐个切入火力点间的通道空间，一片又一片的瘫痪各处暗堡的后勤联系。\n\n在不断的火力消耗中，哪些暗堡逐渐哑火然后被工兵突击队挨个爆破摧毁。一周时间内，辻政信狂妄自大号称坚持一年的防线就彻底土崩瓦解。\n\n此刻的这个“疯将军”正在准备乘车逃离，如果在这里丢了性命，那他就成了日本帝国陆军的奇耻大辱。辻政信钻上了装甲车，装甲小队会拼命把自己的主帅送出城去。但路上却畅通无阻，原本预计要激战十二小时突围的计划没用的上。正当他满心喜悦以为要逃出生天时，炸弹的呼啸划破天空。辻政信只感觉天旋地转就失去了意识。\n\n在昏迷中，他感觉到有人 把自己拖到墙边，但是脑震荡以及失血让他只能勉强睁开眼，看见是中国人后想要拔出配枪，却发现自己的右手被炸的只剩下皮肉挂在胳膊上，剧痛让他乱叫起来。\n\n身穿灰色军装的中国士兵在接收完无线电命令后，把枪口对准了这个罪大恶极的日本将军，在他要开口哀求什么之前，满满一弹匣的子弹就全部送进了他的身体里。西北同胞的亡魂，也在这刻终得一丝安慰。"
 tnolar_chi.465.a:0 "这样的恶魔，屈辱的死亡就是他们最公正的判决。"
 tnolar_chi.465.a.tt:0 "§a辻政信已死，日本人已经失去了谈判的权利，我们第一次用武力收回了自己的国土。§!"

 #平手
 tnolar_chi.466.t:0 "蝇鹰苟狗"
 tnolar_chi.466.d:0 "攻击立止。\n\n四个字，四十八集团军总部发出了这个命令。\n\n“攻击立止！”每个军官都在咆哮他们心有不甘，明明民族的仇敌就在眼前却不能再继续杀敌报恨，明明他们每个都绷紧了神经随时准备为国捐躯——为什么要停下？\n\n“攻击立止！”军令传到了每个士兵耳中，所有人都不敢相信，但前线的炮火已经停了，所有长官都下令禁止开火。他们想要为死去的同胞，枉死的家人报仇，但命令已经下来了——“攻击立止”\n\n为什么要停下！每个人都在愤愤不满。而辻政信则像是个胜利者，大摇大摆的乘专车，在路边的“欢呼声”中离开了兰州城。如今的他已经成为了二战后无数日本年轻人的偶像，在强敌围攻下坚守获胜的英雄，咧开的嘴角遮不住他的得意，最后他大笑，狂笑，奸笑。"
 tnolar_chi.466.a:0 "一步之遥，恶鬼插翅东逃。"
 tnolar_chi.466.a.tt:0 "§Y我们没能在预计时间内拿下西北方面军，只能进行外交谈判。§!"

 #输了
 tnolar_chi.467.t:0 "败绩"
 tnolar_chi.467.d:0 "李上尉带着他的战车连一路退回了西北戈壁，跟在他们身后的是遭受惨痛损失的二十八集团军。日本人的战斗力远超他们的想象，来自本土的正规军不是现在的他们所能匹敌的：也许军事现代化的成果很出色，但是还不够。\n\n在他们仅剩的四辆战车里，坐满了受伤的平民。日本人奸恶到用直升机驱赶在逃亡途中的难民队伍往他们车队前撞，为了保护难民，连队损失了三辆战车，好几个小伙子没来得及从燃烧的残骸中逃出来。\n\n还能去往哪里呢？李上尉从车长舱盖探出身子，远处夕阳西下，半空血红，他点了根烟，白色烟气直飘而上，消散在西北的天空中。"
 tnolar_chi.467.a:0 "至少现在他不会放弃战斗"

 tnolar_chi.468.t:0 "陨火"
 tnolar_chi.468.d:0 "硝烟弥漫在西宁城上空，此刻她已成为孤城一座。第四十集团军的溃败已成事实，马继援在亲卫的拼死支援下，与蒋纬国一起登上了最后一班运输机。望着逐渐远去的地面，两人相望无言，因为他们的失败，无数士兵只得付诸生命才能把他们送出重围。\n\n望着消失在云层中的运输机，李上尉也在他仅剩一辆战车上点起了最后一根沾血的香烟，本来指挥部要求他也撤走，但是最后他选择了留下——战士死在战场上最好不过，他终于能卸下自己的负罪感，父母若是在天有灵，也会原谅自己这个儿子了吧。\n\n只可惜没能再回南京招待林妹子。随着一口猛吸下去，他把香烟扔在地上踩灭，把牺牲的兄弟们掩埋在瓦砾下。\n\n这辆战车已经开不走了，李上尉钻进了已经快没电的炮手位，把弹链接上了弹仓，他等待着敌人的来临。嘈杂的声音伴着叽哩哇啦的日语走来，沉闷的机械转动声响起，李上尉扣紧扳机"
 tnolar_chi.468.a:0 "炮口的火焰过了许久才在爆炸的烟尘里消去"
 tnolar_chi.468.a.tt:0 "§R我们未能成功帮助马家军抵抗日寇，未来的统一之路将更加艰难。§!"


 tnolar_chi.469.t:0 "青海的信"
 tnolar_chi.469.d:0 "高总统勋启，展信安:\n\n前几日于兰州的和平谈判名为会议，实为演戏，如若我等不以粗鲁言行示人，恐引倭寇猜疑，复国大计则胎死腹中。于和平谈判会议上继援言行多有不当，冲撞了总统阁下，还请您多多海涵。\n\n自国破家亡以来我等未忘刻骨铭心之恨，于西北大漠之中痛击倭寇。然我等徒有大勇，而无大谋，不识总统阁下勾践之志，复国之计。今日在您的旁敲侧击之下继援已经知晓您的一片苦心，特写此信以示我等抗日救国之志。\n\n青海已经孤悬塞外廿年有余，武器装备破旧不堪，尚不能与日军相提并论，假使您不及时伸出援手，我军必败无疑，青海军民定将经历一场腥风血雨。此役之胜，举世瞩目，证实日军不是不败之军、中华民国军亦能在与日军的殊死决斗中丕落下风。假以时日定将力压倭寇。\n\n西北已归，众军阀视之，疑虑则除，各地割据势力亦将起归附之心。疆、藏脱离中央已久，如若不能及时收回，则来日更难收归。青海已归，通路已开，此诚收归疆、藏最佳之刻，不宜拖延，请总统阁下当机立断。\n\n此次归附，日寇之所恶。继援已成日寇大恨，必想除之而后快。至于如何处置我等，请您自行定夺，我等毫无怨言，哪怕粉身碎骨，我等亦无所畏惧。"
 tnolar_chi.469.a:0 "£Majiyuan_signature"

 tnolar_chi.480.t:0 "来客"
 tnolar_chi.480.d:0 "李上尉摸着手里的卡宾枪，往里边压住一个满满的弹匣。虽说作为战车连，有时候还是难免要用上这些保命的装备——说实话他不太想用，因为这就象征着要和敌人短兵相接。\n\n折叠好枪托，上尉把它塞到武器箱里，再从车中窜出身子。部队正在兰州城外五十公里修整，日本人把防线收缩到了兰州周边，活像一只铁乌龟，咬不动撬不开。现在他们能做的也就是在营地里修整等待下一步计划与命令。连里其他的小伙子都去找自己的乐子，也就他还在做着日常维护。\n\n营部的通信兵拿着一封信找上了门，是来自重庆军医院的，信封上娟秀的字体已经告诉笔者是何人。李上尉小心的拆开信封，一行行读下去，生命与希望在字里行间重生。他擦了擦有点湿润的眼角，把这封信重新装好，准备到时候在传给那些回来的小伙子们看。"
 tnolar_chi.480.a:0 "军人的使命不只是杀戮，还有拯救生命"

 tnolar_chi.481.t:0 "攻坚"
 tnolar_chi.481.d:0 "李上尉最不喜欢打城市战，因为不知道从哪个角落里伸出来的反坦克火箭就会要了他的命，但作为仅存的几只轻装甲部队之一，如果他们不上，那就只能让兄弟部队用肉身去抗暗堡的火力。\n\n他们连现在还可以用的六辆车展开搜索阵型，在城市外围游猎，追着炮火的声音走，支援他们所遇见的所有友军。如果一定要实话实说，他已经感觉到这就是西北马家军的极限了，连着好久没有进展，士气与后勤都到了极限，或许之后可能有小的突破，但最后也只会止步于此。\n\n对这个结果不满意吗？肯定的，因为第二别动队的主官还没落网，罪魁祸首辻政信依旧逍遥法外，但失去了中央政府的支持，他们什么也做不到。\n\n电台中再次传来友军的求援，没时间浪费了，李上尉带着自己的队伍踩紧了油门狂奔而去。"
 tnolar_chi.481.a:0 "战争还没结束"

 tnolar_chi.482.t:0 "暂止符"
 tnolar_chi.482.d:0 "战车连的装甲车再次运到了火车上，是时候离开了。也许是幸运，李上尉和自己的弟兄们在这场战争中毫发无伤，就连座驾也只是部分受损。\n\n高总统下了命令，让所有志愿部队撤回：西北的战火已经被双方最高政府压下。战争所能解决的事情已经结束，剩下的就只能交给政治家们。\n\n一群换上新国民革命军军装的西北战士在站台旁等候多时了，“英雄战车连”的名声已经传边第四十集团军。在帮忙把重要货物送上车后，两边开始交换自己的战利品。\n\n李上尉拿到了一面烧焦边角的日本军旗，送出去一把日军刺刀。军旗被火燎灼的外圈发黑发黄，上边的旭日都被烟灰熏黑，这是份很有意义的纪念品，他会一直带在身边的。\n\n火车轰鸣，这次的片刻停歇是下一场战争开始的序幕。"
 tnolar_chi.482.a:0 "但至少上尉可以安心的挂上自己的徽章。"


 #结局
 tnolar_chi.497.t:0 "西北战争结束-失败"
 tnolar_chi.497.d:0 "尽管青海的百姓们顽强抵抗，我们也已经提供了能够提供的所有帮助，事情还是走向了最糟糕的结果。西北方面军彻底击败了马家军，现在青海境内只有零星的抵抗，彻底清剿就只是时间问题，马继援本人已经不知去向，或许已经逃往了新疆，也有人猜测他已经死在了日本人的枪口下，只要等待尸体清理工作完成后就可以知道是生是死。\n\n对我们而言最紧迫的问题不是帮助日本人打扫战场，而是彻底毁灭掉我们向马家军提供帮助的所有证据，一旦被日本人发现援助行动的任何蛛丝马迹我们都将万劫不复。帮助马家军是我们武力反抗日本秩序的第一步，只可惜这第一步不仅彻底失败还即将让我们陷入严重的危机之中，接下来必须痛定思痛，反思我们之前的计划与行动，用更好的方法来达成目标。"
 tnolar_chi.497.a:0 "竹篮打水"

 tnolar_chi.498.t:0 "西北战争结束-胜利"
 tnolar_chi.498.d:0 "西北战争的结果走向了大家都没有预想到的方向，马家军不仅抵御住了西北方面军的猛烈进攻，还重整态势发起了一次又一次的反击，节节败退的竟然最终是日本人。敌后游击队与前线战士里应外合给予了敌人迎头痛击，日本侵略者终于被赶出了西北的戈壁，而现在马家军边界与共荣圈接壤的地区由我方士兵封锁。\n\n得知战争的最终结果后日本政府气急败坏，觉得这件事让他们颜面尽失，准备再次进攻马家军，而马家军内部也被突如其来的胜利冲昏了头脑，开始出现一批试图进攻我们的激进军官，而我们正试图调停双方用和平的方式来解决冲突。帮助马家军是我们武力反抗日本秩序的第一步，但这一次行动过于激进，结果也大大超出了我们的预料，为了接下来的计划更加顺利，之后的每次行动还是小心为妙。"
 tnolar_chi.498.a:0 "意料之外"

 tnolar_chi.499.t:0 "西北战争结束-平局"
 tnolar_chi.499.d:0 "长时间的浴血奋战后，西北百姓抵御住了日本人的铁蹄，西北方面军已经停止了进攻，双方除了在前方战线还有小规模交火之外已经逐渐停止了军事行动，战争终于步入了尾声。侵略战争从开始的突击战演变成了拉锯战，占领地区的游击战让日本人疲于奔命，加上后方的补给设施也被当地民众破坏，看不到胜利希望的日本政府决定及时止血停止战争，选择其他的方式解决问题。\n\n帮助马家军是我们武力反抗日本秩序的第一步，援助的过程十分惊险，幸好最后达到了我们预期得到的结果——保住马家军，以及在战场上直面日本人的锋芒。这一次行动为我们带来了宝贵的经验，也成功使日本精心构建的亚洲秩序出现一丝松动，接下来我们将一步步行动，直到将其彻底颠覆。"
 tnolar_chi.499.a:0 "步步为营"



 #南京峰会事件链
 tnolar_chi.4000.t:0 "互换"
 tnolar_chi.4000.d:0 "高宗武站在机场迎宾的红地毯上，身旁的秘书为他撑起了雨伞，红毯两边仪仗兵们站的笔挺。昏暗的云层几乎是压在人们头顶，但这雨就是迟迟不下。远处天空中传来喷气引擎的轰鸣，日本帝国首相的专机从钻出了密云，缓缓地滑行，最后停在了舷梯旁。\n\n飞机舱门缓缓地打开，先是身着黑色西装的警卫钻了出来，之后外务省大臣，大藏省大臣，陆海相，最后才是日本首相，几乎日本现政府的内阁成员全部到了南京，这次参会国家只有两个：中国，以及日本。\n\n两位国家领导人的目光在空中对撞片刻，随后为了尽外交礼数，双方还是走到了一起，对着周围等候已久的记者们握手致意，只不过双方都没有摘下自己的手套。待两人握手礼结束，红地毯两侧的仪仗兵们立刻举枪行礼，目光直视着日本外交团，仿佛一柄柄寒光闪烁的利刃，让在场的所有日本高管心里不禁一紧，警卫们下意识地靠近了各个保护对象，瞬间空气仿佛为之凝固了。\n\n这样的僵持没有持续多久，高宗武先开口了，用的是标准的中国话：“欢迎各位来到南京，”"
 tnolar_chi.4000.a:0 "“我在此等候多时了。”"

 tnolar_chi.4001.t:0 "最后的和睦"
 tnolar_chi.4001.d:0 "民国总统府的礼堂内，最高规格的外交宴会正在进行，身着正装的乐团们演奏着中国传统民乐《茉莉花》。两国高官们三五成群聚在一起，并酬交错之间灯光透过玻璃杯，扭曲地照在每个人的脸上。\n\n罕见的，华北政务委员会的旧党们都到场了，张仁蠡、潘毓桂、汪时璟……他们围着日本内阁成员献殷勤，谄媚地为趾高气昂地日本人赔笑。周佛海，陈公博那一批人辗转在中日之间如鱼得水。高宗武则是和陶希圣他们聚在一起。受邀来的记者拍下了这一充满火药味的场景。直到宴会过半，两政府对接机构地人员才开始互相接触，最后是民国总统和日本首相碰杯。\n\n所有试图互相了解的行为都失败了，没有人愿意透露一点口风，如果是在战场上，那么现在就是宣战前扳机被紧扣的时刻。\n\n最后一曲《精卫》演奏完毕，乐团成员们向在场所有人鞠躬，稀稀拉拉的掌声响起，给这场宴会画上了最后的句号。"
 tnolar_chi.4001.a:0 "形式主义再次“立功”"

 tnolar_chi.4002.t:0 "第一天——经济"
 tnolar_chi.4002.d:0 "日本经连会代表这次居然和四大财阀代表人坐在同一张桌上的同一侧，这放在日本国内可以说是爆炸性新闻，更别提他们中间还坐着大藏省长官。至于为何如此团结，恐怕就要问他们对面的对手了。\n\n陶希圣带着全国经济委员会的各部门主管以及商界农界代表落座，至于张仁蠡这个“总管经济长官”早就被“请”出了谈判团队——这甚至是对他的保护，不少国人等着生吞活剥他。待双方人员到齐，峰会的第一项议程就开始了。\n\n闭门商讨只过去了一个小时，最先受不了离席的就是三井和住友的代表——这两家的基本盘：轻工业和农业早就被民国企业挤压的四处碰壁，自然是不可能给好脸色，在得不到让步后，两家代表直接离席。随后出来的是三菱重工的代表，他刚得到消息，董事长大宫现在正在接受特高和审计委员会的调查，私下的交易不知道什么时候露馅了。最后剩下的只有安田家代表，六十年代初的安田危机之后，他们早已大伤元气，这次来算是凑数的，明锐的感知到谈判无望后他也就乐意作为花瓶陪衬。\n\n经联会的代表努力想要和中国达成某些共识，但在过去的一小时里边，他已经逐渐明白自己的天真和无知——四大财阀对于中国的过度剥削已经把中日通商的众多道路堵死了，互惠互利已经成了奢望，要想打开中国市场就只能吃亏让利。接着他看了眼面色铁青的大藏省长官，他不发话，这个事情就没法谈。\n\n双方又接着对设立新的贸易协定、关税比例的方方面面争吵不休，直到太阳落山，两边不欢而散。一切都是无用功。"
 tnolar_chi.4002.a:0 "结果？要什么结果。"

 tnolar_chi.4003.t:0 "第二天——军事"
 tnolar_chi.4003.d:0 "陆相海相共坐一席，这一幕的冲击力不亚于昨天经济会议经联会和财阀合作，而能压得住他们的也就只有天皇身边的近侍。日本军事力量的最高决策层此刻坐在一起，他们身上释放的巨大压力让昨天还在拍个不停的各个新闻记者都心生胆怯，就像是一柄柄日本武士刀顶在咽喉上。\n\n坐在他们对面的是民国新任国防部长，他们的老对手：方先觉。跟着他一起来的大都是年轻的军官，剩下的也是从当年战争中和日本人作战过的军人。双方目光相交宛如利剑相碰，整个大厅中的氛围立刻被压到了最低点。除了极个别胆大的记者拍了几张照，剩下的早就溜之大吉，留下后排一大片空桌位。\n\n两边没有多余的问好，在最基础的外交礼仪之后，日本陆相就单刀直入对着民国秘密扩军开炮，海相则特别指出民国海军越来越具有攻击性，大量装备的导弹快艇以及导弹驱逐舰已经远远超出台北峰会协议中所规定的区域防御职责。\n\n国民革命军的代表并没有否认一切，而是直接了断的提出了自己的要求——如果想要在军事领域中再次达成共识，那就要解除对于国民革命军的全部限制，并且要全面放开国内军事技术壁垒，从陆到海空全面的支持民国军队。\n\n一名日本将官再也忍不了了，他猛地一拍桌子，直截了当的表示民国吞并共荣圈独立国家西藏的事件已经严重越界，如果不做出实质性的让步和补救，那帝国军队可不会坐视这种破坏共荣圈秩序的卑鄙行为。\n\n面对日本人又一次的赤裸威胁，方先觉没有多做停留，他站了起来，丢下一句话给面前这群和几十年前一样狂妄的恶鬼后，就带着参会人员离开了会场。"
 tnolar_chi.4003.a:0 "“那我们没什么好谈的，子弹会接替谈判的任务”"

 tnolar_chi.4004.t:0 "第三天————国土一统"
 tnolar_chi.4004.d:0 "高宗武再一次坐在了大日本帝国首相的对面，只不过这次不是像以前那种汇报工作的卑微，也不是在台北峰会时期的无能为力，现在他们是真正，绝对真正的平等交流。\n\n他尽力的压下了自己嘴角逐渐放肆的笑容，他身边的挚友陶希圣可就不必遮掩太多，况且平时陶希圣也是笑脸迎人。与之相对的，对面的首相大人和他的下属的脸色可不太好，各个都铁青着脸，压着心里的不满怒火。\n\n今天才是峰会的第三项议程，但外边的报纸上早已经吵翻了天。从中华日报到东亚日报再到朝日新闻，每一份报刊都用头版头条大字体加粗加黑的描述这次事关共荣圈存亡的峰会情况，双方的争吵和冲突逃不过摄像机的镜头，越来越多的照片在高宗武的默许下流传进各个媒体渠道。\n\n日本在过去两天所表达出的意向已经很清楚了——日本才是共荣圈之主，这是不可违背的铁律。任何想要改变共荣圈势力分配现状的行为都将被帝国军队的铁拳粉碎。高宗武也直接了当地表达自己的意见——中国的重新、完全、彻底的统一没有任何人可以阻止，这不是征求意见而是通知。\n\n在无数闪光灯的照射下，双方离席，这也将是在未来战火熄灭前，双方领导层最后的会面，日本首相他们出门就直接前往机场登机离开，无数报纸的头条都被战争硝烟的气味占据："
 tnolar_chi.4004.a:0 "万事借词欲语介休，双日同天无空再谋。"

 tnolar_chi.591.t:0 "决断"
 tnolar_chi.591.d:0 "开弓没有回头箭。高宗武知道，峰会谈判破裂的结果将会是难以预计的，日本将会实施一次又一次的制裁，同时，中国将会面对整个共荣圈。\n\n但他为了等待这一时刻花了近乎30年的时间，这30年里，他选择默默背负了汉奸的罪名，只为换取中国的发展和未来，他对日本官员谄媚假笑，只为争取得技术与知识。现在，几十年的忍辱负重终于让中国拥有了向日本叫板的资本，而他要做的就是领导人民再打一场30年前的那场战争。\n\n高宗武也会担心这次反抗会不会再次失败，但他不会犹豫，中国人民不再是日本人的奴隶了，中国人民不再佩戴倭寇强加于其的桎梏了，中国人民不再容忍鬼子强行侵占自己的大好河山了，无论如何，我们将夺回原属于我们的一切！"
 tnolar_chi.591.a:0 "我们的独立，我们的自由，我们的家！"
 tnolar_chi.591.a.tt:0 "§x我们不再需要任何的掩饰了§!"


 #张仁蠡夺权 - 新的现代化
 tnolar_chi_renli.1.t:0 "弹劾高宗武总统"
 tnolar_chi_renli.1.d:0 "鉴于其面对日本要求阳奉阴违所造成的严重不良后果，立法院动议立即剥夺高宗武总统的行政院最高领导职务。\n\n立法院发言人的声音在大厅中轰鸣，使国民党保守派与改革派都十分震惊，又立刻因这个命令的弦外之音而深受打击。毫无疑问，现代化会停止，日中关系会恢复常态，而数十年中国对日本让步的趋势将会持续。通过微弱的票数优势，以及在富有“创造性”的法律委员会的帮助下，亲日派立法委员成功地通过了高宗武总统的弹劾案，准备在未来选举一位新总统。尽管该命令的措辞含糊，但这一点已经非常清楚：曾经一度失势的政治家，现在日本人的忠犬，张仁蠡将接替高宗武担任总统职务。\n\n除了安静地坐着，看着亲日派趾高气扬地宣读着弹劾表决的全文，高宗武什么都做不了。同样，国民党的其它派系也只能在死一般的宁静中，目视着它不受打断地被通过。中国走向了另一条道路。"
 tnolar_chi_renli.1.a:0 "我们做了些什么？"

 tnolar_chi_renli.2.t:0 "张仁蠡的崛起"
 tnolar_chi_renli.2.d:0 "在前总统高宗武遭到弹劾后，亲日派占主导的立法院选择了张仁蠡为下一任中华民国总统。尽管投票结果十分接近，国民党的其它派系无法得到足够的支持以抵挡亲日派对立法院的控制。计票结束后，新总统张仁蠡开始上台讲话。\n\n张仁蠡从会堂的后方进入，缓慢地走过了走廊。他的肩膀齐平，眼睛清澈，脸上却挂着恶魔般的笑容。国民党反对派的成员只能看着新总统从他们面前走过。这条中国的毒蛇站到了讲台上，在一阵讽刺般的掌声过后开始了讲话。\n\n“我很荣幸可以担任中华民国总统，正如我在高宗武政府工作时的主张一样，我将继续为共荣圈服务。前任政府的失策之处在于他们不愿支持我们的日本盟友的利益，并拒绝接受泛亚洲主义带来的互利共赢。在我的政府之中将不会再出现如此愚蠢的错误。保证中国的自给自足不仅毫无意义，同时也与共荣圈的利益相悖。新政府将停止这种行为，并重新开始从我们与大日本帝国的特殊关系中获益。欢呼吧，国民们，我们将迎接一个全球化和经济繁荣的时代。孙中山先生万岁，共荣圈万岁，民国万岁！"
 tnolar_chi_renli.2.a:0 "前功尽弃。"

 tnolar_chi_renli.3.t:0 "又一次晨间散步"
 tnolar_chi_renli.3.d:0 "高宗武并没有去立法院的会议。相反，他独自一人站在孙中山先生陵墓上飘扬的青天白日旗下回忆过往。十年前，他是如何构想未来的？现在，他建立一个自由的民国的梦想已经随着实现中国现代化的计划失败而彻底无望了。他深知，未来将会无比黑暗。\n\n高宗武回到了十年前他的遐想之中，那时他对即将发生的一切都充满希望。曾经笼罩南京的薄雾如今已经化为了灰黑色的篷布，但这些为日本人制造产品的工厂又有什么意义呢？他不禁问道：\n\n“我们会自由吗？”"
 tnolar_chi_renli.3.a:0 "未来会怎样？中国会怎样？"

 tnolar_chi_renli.4.t:0 "张仁蠡新政"
 tnolar_chi_renli.4.d:0 "中国的荣耀终于恢复了。民国历经了几十年骚乱，国家秩序受到了极大的破坏。而现在，张仁蠡总统重新控制了神州大地。托陈大总统的洪福，他为中国带来了其他任何人无法给予的宝物：稳定。中国在上个世纪所遭受的失败可以说就是政府的失败，是那些自以为是，白日做梦的政客的失败。袁世凯和他狂妄的幻想害得中国支离破碎。蒋介石愚蠢地以为自己能把冉冉升起的旭日拽落大地。他在做哪国春梦？\n\n解决中国目前所面临的问题的秘诀并不藏在什么经史子集里，毕竟将支离破碎的国家乾坤一统又不是什么秘密。工作吧，只要我们同伟大的共荣圈中的兄弟姐妹们一起携手并进，努力工作就好了。西方列强强加给我们的国耻无人能及，而日本的入侵与其说是侮辱不如说是敲响了警钟，它警醒我们不要东施效颦般效仿西方国家，而是全面拥抱正确的泛亚主义意识形态。\n\n日本是亚洲的霸主，当他们张开双臂向我们伸出援手时，我们为什么要浪费生命和财富来挑战他们的权威呢？一向走实用主义路线的张仁蠡总统已经明确表示，他可不会白白浪费这个机会。"
 tnolar_chi_renli.4.a:0 "这没什么好看的！给我滚回去工作！"

 tnolar_chi_renli.5.t:0 "并无过错，只是被误导了"
 tnolar_chi_renli.5.d:0 "前政府的纲领很简单：通过任何必要的手段使中国现代化。高宗武不仅通过怀疑他们的能力来不敬地侮辱伟大的中国人民，还愚蠢地认为，在不接受任何外力的情况下，短期内可以毕其功于一役。尽管有这么多毛病，高宗武推动工业化的努力姑且算是值得称赞，但是完全要求自力更生就很不智。随着他推进改革越来越深入，带着中国从沦陷后的灰烬中快速崛起并完全解放自己的理想，他还给自己树了一大堆敌人。这一切说得好听点是笨，说得难听点是愚不可及。\n\n复杂的五个现代化使我们不能对任何能帮上我们的东西挑肥拣瘦。显然，中国应该是富裕的、文明的、先进的，但是经济下挫、灌输意识形态、对近邻冷眼相待是个好主意吗？我们从高宗武政府的成败中学到了很多东西，解构他的计划，现在它是我的了！"
 tnolar_chi_renli.5.a:0 "取其精华，去其糟粕。"
 
 tnolar_chi_renli.6.t:0 "我们丝毫不落后"
 tnolar_chi_renli.6.d:0 "被罢黜的前总统高宗武撒过最恶心的弥天大谎就是中国必须学习那些西方列强，或者说，全世界现代国家。高宗武在他整个任期的大部分时间都在为他掌控的这个民族唱挽歌。侮辱接着侮辱，高宗武确实很努力地把他的人民贬损为无知、懒惰、落后。不过，张仁蠡倒想问问，高宗武到底为把中国变得更好都做了什么？背弃自己的盟友，胡乱撒钱？\n\n遗憾的是不是每个人都知道高宗武政府是失败的。高宗武对教育系统的改革腐化了中国的青年，把下一代夺走，变成他想要的样子。年轻人应该学习中国自己的价值观：勤奋、亚洲之内皆兄弟、国家强大才是真理。"
 tnolar_chi_renli.6.a:0 "中国永远是引领者，不是跟从者。"


 #GAW战争准备

 tnolar_chi.500.t:0 "礼数周全"
 tnolar_chi.500.d:0 "高宗武拿起手中国家安全局的秘密报告，露出了满意的笑容。\n\n经过十多年的经营和渗透，中国国民党中央执行委员会特务委员会特工总部——这个名义上的国家情报部门已经被彻底架空，成为了一枚袖珍的橡皮图章。它的权能和职责已经被国家安全局所取代。而高宗武之所以这样做，目的则是打造属于自己的匕首，在黑暗中刺向敌人，而现在的敌人就是以张仁蠡为首的华北政务委员会。\n\n在七七事变中日全面战争爆发之前，1935年的《何梅协议》实际上就已经承认了河北独立，之后的各种“华北独立运动”让当局无可奈何的成立以宋哲元为委员长，由日方推荐的王揖唐、王克敏等为委员的“冀察政务委员会”，使冀察两省实际上置于中国行政区域之外。当战争全面爆发时，日本人就急不可耐的成立了“华北政务委员会”，实施分裂中国的阴谋。战争结束后，华北政务委员会经历了一轮人员替换，张仁蠡被日本人送进了民国的权力中枢，成为了坚定的亲日派头头，也是他在现代化中处处设卡、面面为难。\n\n但现在，他已经没有资本和高宗武对抗了，很快他就会收到高宗武的信笺，中华民国的总统会给他两条路：第一条，老老实实地交出所有权力，断绝和日本人的一切联系，那么或许还可以过着不错的生活，留得一条性命；第二条……\n\n高宗武低下头，拿出自己的钢笔，灯光的反光遮住了他的眼睛，他打算开始真诚的写一封信，至少他是觉得自己非常的——真诚："
 tnolar_chi.500.a:0 "“范卿吾兄，见信亲启……”"

 tnolar_chi.501.t:0 "再一"
 tnolar_chi.501.d:0 "波诡云谲的国际局势让南京城内的高官们都感到如芒在背，张岚峰也感受到了国防部内的诡异氛围，隐隐约约意识到似乎有一些不寻常的军队调动在瞒着他进行，他猜测或许现在的这个总统会做出忤逆大日本帝国的狂妄之举。如今这个局面已经脱离了自己的掌控，张岚峰意识到必须前往华北与文官们会晤，否则继续呆在南京只会坐以待毙。\n\n回家之后，妻儿被告知此地不宜久留，立马就开始收拾金银细软准备离开。就在整片豪宅乱作一团时，负责监察健康的私人医生像往常一样按时来访，张岚峰想到收拾东西还需要时间，索性就做着最后一次检查。医生逐渐从包里拿出需要用到器材，做着和以前没什么两样的检查和记录，也正如预想一般很快就结束了，可是私人医生却是满脸愁容，似乎在担心什么。\n\n“老爷，从上次检测的结果看您的血糖就已经很高了，这要是不降下来出行也不方便的。正好今天我带了降血糖的新药，只需要注射使用即可，您要不要试一下？”\n\n“打针而已，无妨。”说罢，张岚峰秀出手臂，示意医生赶快注射，不要耽误时间。结束后，医生长舒了一口气，露出了意味深长的微笑，收起器材就向他告别，几乎像逃离犯罪现场一样夺门而出。\n\n没过几分钟，张岚峰就感到额头发热，开始冒出冷汗。本以为只是新药的副作用，他站起来想要走一走缓解一下，没想到突然眼前发白，浑身无力地倒下，陷入了休克。然而他的家人却还在整理家产，根本没有注意到他已经全是红疹地倒在了地上。等到发现他的时候，张岚峰已经是一具停止呼吸的尸体了。"
 tnolar_chi.501.a:0 "怀中潜藏许久的利刃终于出鞘了。"

 tnolar_chi.502.t:0 "再二"
 tnolar_chi.502.d:0 "夜晚的南京城依旧灯火通明，现代化带来了灯光，带来了电力，带来了美好的现代生活，也带来些更不堪入目的东西。灯红酒绿的秦淮河两岸，到处是喝醉的、衣冠不整地、沉迷享乐的人。也许在这个时代，赚上大钱然后挥霍一空才是最好的选择，至少对于那些干见不得人的事情的手套来说，是这样的。\n\n王凤岗正摇晃着被人搀扶出秦淮岸边最大的风流会所，两位浓妆艳抹的靓丽陪酒女扛着那肥臃的身躯一步一挪的下了台阶，途中还得为男人伸进礼服裙里的揩油行为赔笑。四名身着黑色西装的下属从副委员的座驾上连忙下了车，接过了她们肩上这名醉醺醺的顾客，领头人微微颔首，对自己上司所作所为表示抱歉。之后一群人费劲力气才把他安全送到黑色高级轿车上。汽车发动，车尾灯很快消失在了繁华街道的转角处。\n\n汽车鸣笛声让喝醉的王凤岗脑子清醒了点。“他妈的，高宗武这个狗日的，处处给老子下绊子，”他一边咕哝着，一边睁开朦胧的眼睛，“总算给我抓到把柄了，这次我一定要你……”\n\n车窗外的冷风让他又清醒了不少；奇怪了，今天不是自己单独让司机开了轿车过来接自己吗，怎么会有自家兄弟来……他猛的一激灵，想要伸手去拿自己西装夹克内层的自卫手枪，坐在他左边的黑衣特工摇了摇手里的东西——配枪已经在他手里了。刺耳的急刹车声划过黑夜，但没人会注意到，因为车已经到了紫金山下。黑色塑胶绳套上了副委员的脖子，车灯熄灭，车声开始猛烈地晃动，传出人濒死前的怪叫，随后逐渐平息。四个人下了车，把这具臃肿的烂肉扔到路旁，领头的特工掏出消音手枪对准尸体脑袋连补三枪，随后浇上了汽油，安上了准备好的白磷燃烧剂。\n\n所有人都带好了防毒面具，火柴落下，随即燃烧起烈火，众人注视着熊熊燃烧的尸体，以及升起的白色浓烟，他们遥对着中山陵，深深的鞠了一躬。"
 tnolar_chi.502.a:0 "再一次斩下叛徒。"

 tnolar_chi.503.t:0 "再再三"
 tnolar_chi.503.d:0 "北京火车站的昏黄灯光下，几个身着黑色西装的年轻人低着头，帮扶一位带着大帽子的老绅士晃晃悠悠的走上了登车台阶。\n\n“张委员，您这边请！”乘务长谄媚地碎步上前，接过旁边侍从手里的行李，赶忙给老者赔上笑脸。“您突然要登车前往新京，我们这边也没法做什么准备，只能说是临时给您添一辆专车，准备一节贵宾车厢啊，还望您见谅！”\n\n张仁蠡低沉着脸，在乘务长把行李放好后，他挥挥手让车厢里的无关人员立刻出去，周围的黑衣也立刻拔出西装内层枪套里的手枪，呵斥着所有人离开这节车厢，不一会，这节车厢内就只剩下张仁蠡和他的护卫们。\n\n张仁蠡用颤抖的手摘下了自己的帽子，他不敢想象，与华北派有关的将领居然一个个离奇死亡，这就是赤裸裸的清洗，他也不得不承认自己当初小看了高宗武。在1962年，所有人都认为高宗武不过是个软弱的外交官，是一个所有人都同意的共选项，但就这短短的十几年，他都做到了什么？他脱离了日本的控制，实现了独立的现代化、在峰会上和日本人针芒相对、甚至彻底推翻了战后的国内政治体系，将大权握于己手。在接到那份来自高宗武的亲笔信之后，他很清楚，现在必须立刻离开，离开南京，离开华北，去新京，去东京，他还没有输。\n\n很快，只要他和日本人见上面，那他所失去的一切都会如数奉还，日本人的铁蹄将会提前出动，踏碎高宗武这个疯子的梦想，到那时他将会成为未来的中华民国总统，权力、财富、名望，都将属于他。\n\n张仁蠡这样想着，火车发动了，随着汽笛声越来越快，沿着铁轨即将跨过边界，只要过了前边的隧道，就进了满洲国的地界了，想到这里，张仁蠡不禁得意的笑了："
 tnolar_chi.503.a:0 "“高宗武，你输定了……”"

 tnolar_chi.504.t:0 "斧钺暗鸣"
 tnolar_chi.504.d:0 "国家安全局行动编码：ROCAJ-100020“夜叉”\n档案机密级别：绝密\n查询资格：████\n\n行动目的简述：\n目标为政府内亲日派领袖之一张仁蠡，此人长期把控华北政务委员会，与日本交往密切，在国内现代化进程中多次阻拦与泄密，在大会后仍旧不达成共识，同时在两次峰会期间与日本人依旧往来密切，泄露许多我方议案内容。经国内警察部门以及安全局调查，已经拥有充足证据证明此人犯有严重叛国罪、贪污罪、滥用职权罪、间谍罪、以及其他诸多罪行，现给予国家安全局逮捕权。\n\n补充：\n考虑到目标人物的特殊性，如果发生逃窜行为，可根据实际情况使用致命武力，无需上报。——批注者███\n\n行动结果报告：\n目标于接收到由我局特工乔装的信使送出信的一小时后离开所住宅邸。根据内部电话窃听以及信号拦截，已得知目标计划搭乘专车逃离国内前往日、满控制区。安全局已经提前安排好专车“等候”目标上车，在行驶至国境线边界隧道入口时，切断车厢电源，四名安全局干员头戴夜视仪，从前后车厢持70式突击步枪同时开火，将车内所有目标击毙。经确认，张仁蠡身中12枪，已死亡。目标已完成。\n\n                                                                                愿中国重获自由。"
 tnolar_chi.504.a:0 "高宗武满意的把文件丢进了壁炉里。"



 tnolar_chi.505.t:0 "剑拔弩张"
 tnolar_chi.505.d:0 "谢廖带着自己的僚机从云层中窜出，座机强5的机腹挂架上装满了低阻炸弹，机翼下也装上了对空导弹——这些全都是真家伙，在黄昏的夕阳下反射着猩红的不详光芒。\n\n他们的机翼下方就是广东国——更准确的说，是广东国最后控制的三个城市，中日双方的战争已经一触即发，作为军人的谢廖并不太清楚政治上具体发生了什么，但事实就是：广东国已然四分五裂。新国军和日本帝国陆军各自占据了除核心三城以外的所有地区，只剩下香港、澳门、广州三座孤城。\n\n[GNG.GetLeader]还没有表明自己的立场，他们都清楚，在这场战争中没有中立可言，只要选择一边，另一只庞然大物就会把风中残烛般的广东国吃的一干二净。日本帝国海军已经宣布对珠江出海口海域实施封锁戒严，现在路上和海上交通都被彻底切断了，三座城市立刻陷入了物资短缺，再这样下去，不用等战火蔓延过来，城市就会被自我毁灭，如果他们不做决定，自有人会作出选择。\n\n谢廖从座舱玻璃往下望去，曾经繁华瑰丽的“硅晶三角”现在陷入了一片漆黑，他可以想象现在城市里到底陷入了何等的恐慌之中，他们的命运不再由自己做主——或者更直接点说，从来没有他们做主的权力。\n\n“洞俩，准备进入任务空域。”\n\n“洞俩明白。”\n\n两只银色巨鸟喷吐着炽热的尾焰，调转方向，飞向珠江海口，大日本帝国的庞大舰队停在那里，宛如一座座不可撼动的山峰，高大的雷达天线从航母舰岛上不断搜索着周围任何的可疑目标，一对舰载机已经起飞直冲他们而来。雷达上的光点越来越近，双方已经进入了目视攻击距离。谢廖打开了火控开关，机翼下的导弹已经开始预热。他在等待着上级准许开火的命令。越来越近、越来越近、越来越近……"
 tnolar_chi.505.a:0 "最后双方擦肩而过，各自掉头离去。"


 tnolar_chi.510.t:0 "排艰阻难……"
 tnolar_chi.510.d:0 "自古以来，漫长的海岸线都是中国的瑰宝之一。但想到这里，高宗武不免深深的呼出一口气，自甲午中日海战以来，日本那耀武扬威的海军便疾驰于中国的近海之上，吞吐出的浓烟遮蔽了天空，尖锐的舰首劈开了海洋。而中国漫长的海岸线无疑助长了他们的威风，若是没有反制手段，只要战端一开，无数的海军陆战队便会跟着他们庞大的舰队如蝗虫一般扑向中国的沿海，将海岸线啃的七零八落，满目疮痍。\n\n“一定要有反制的手段。”\n\n高宗武在心中坚定了决心的烈火，中国的海军力量还不足以独自面对庞大的日本舰队。若是想要反制耀武扬威的日军舰队，行之有效的方法就是派空军前去拦截。空中的铁翼早就是海军最大的威胁了，只要投弹精确，数架飞机便可摧毁敌方最为庞大的战舰。但日军的防空火力也绝非空话，若是让空军前去拦截，必然会导致极大的战损，这样的行为是否是值得的，高宗武的心中还是有些犯嘀咕。\n\n同样，最主要的目标是拦截敌方的海军陆战队。若是能够加强岸防，在他们登录前就用岸防武器加将舰船击毁，便能做到御敌于海岸之外。但唯一的问题是，现在海岸的防御基本还以落后的火炮为主。先进的岸防导弹目前还只是纸上谈兵，中国目前还没有这种最有效的反制武器。没有这种武器，岸防便有可能轻松就被敌方摧毁。\n\n想到这里，高宗武不禁咬了咬牙。无论是怎样的代价，只要能守护好中国的海岸线，哪怕是在敌人冲上岸后拿人命上去填，也要把他们赶回海里，让他们永远也无法踏上中国的海岸线。中国面对的是世界上最强大的海军，我们唯有用鲜血，汗水，泪水，才有可能和这海上的巨兽有一战之力。"
 tnolar_chi.510.a:0 "只为中华"

 tnolar_chi.511.t:0 "在深邃的大海上"
 tnolar_chi.511.d:0 "早上六点不到，刘新宇就打开了巡逻艇的舱门——现在是他站岗的时候了。刚一站到巡逻艇的栏边，东海那夹杂着咸味的海风就令他忍不住打了个冷战。\n\n“日出前真冷啊。”他在心里暗暗的嘀咕道。自从峰会之后，火药味越来越浓，现在日本人越来越不安分，海警巡逻的次数越来越频繁了。有好几次他甚至看到日本人的军舰耀武扬威似的在近海兜兜转转，舰船上挂着的帝国国旗看起来极为扎眼。想到这里，刘新宇忍不住往大海里啐了一口吐沫，随即从口袋里掏出一包香烟，确认香烟没有受潮后，便倚着栏杆抽了起来。此时的太阳才刚刚从天边露头，蔚蓝的大海被清晨的阳光撒上了一抹摇曳的金黄，平静的简直让人身心都要在波浪中消逝了一般。\n\n要是清晨就这么舒适就好了，刘新宇的美梦还没做完，就听见舱内的电台传来了紧急的呼叫，空军发现了日本舰船正在向近海靠近！刘新宇当即掐灭了自己手中的香烟，将警帽扣在了自己的头上，敲打着自己的窗户让同事开船朝着空军发现的位置冲了过去。\n\n当自己的小巡逻艇接近那庞大日本的舰船时，刘新宇发现这艘舰船大的甚至要让自己仰视才能看得到舰船之上耀武扬威的帝国军旗，尖锐的撞角似乎能直接把他的巡逻艇撞的粉碎。舰船上的人似乎发现了这不自量力的小艇，他们纷纷走到舰船的栅栏边，低下头，对着刘新宇的小巡逻艇指手画脚。即便刘新宇听不到他们刺耳的日语，他也能感觉到他们对中国人领海权毫不在乎的轻蔑与嘲讽，他们就是来炫耀自己海上霸主的地位的。\n\n“他妈的日本狗。”\n\n巡逻艇毫无作为的沉默跟随非但没有让日本人的行为收敛一点，反而更让他们确定了”支那人”的无能，愈发鄙视刘新宇等人。在他们看来，这些”东亚病夫”就算奋起反抗，也只会像十几年前的抗日战争一样折戟沉沙。\n\n这样沉默的跟随前进了许久，久到刘新宇都觉得这些日本人是不是要直接去打南京了。突然，刘新宇听见湛蓝的天空上传来了引擎的轰鸣，当他抬头的时候，数架翱翔的飞机从日本舰船的上方高速低空掠过，强大的气流把那帝国军旗都吹卷了起来，在旗杆上卷成了一个”日本寿司”。随后，便如同调戏自己的猎物一般故意在日本的舰船旁拉慢速度，盘旋慢飞了起来。\n\n那些日本人气的直骂娘，而他们的脏话却被轰鸣的引擎声给完全盖住了，刘新宇看向那些被飞机气的够呛的日本人，心中燃起了一抹快意，仿佛就连自己驾驶的巡逻艇都跟着迎风长大了几分。他的心中涌现出了一个想法：或许和日本比起来，中国依旧还是那么弱小，但从今时此刻起，战胜日本，终于不再是一个不可触及的幻想，哪怕让他粉身碎骨，也要为这微小的可能性，贡献出自己的全部。"
 tnolar_chi.511.a:0 "今非昔比"

 tnolar_chi.512.t:0 "居外未敢忘忧国"
 tnolar_chi.512.d:0 "摇晃的白炽灯中电流滋滋地响着，窗外已然是一派寂静的夜色，厂房的实验室内仍然人头攒动。在实验室中心的木桌上，被拆开的纯白色的椭圆导弹如同众星捧月般被众人围在中间，所有人都睁着布满血丝的双眼，拖着疲惫的身躯，死死的盯着面前散开的图纸。它是中国海防的希望，为了直面大日本帝国强大的海军，中国必须拥有能够超视距打击的岸防导弹。这是一场科技上的战争，是技术上的鸿沟，面对这样的鸿沟别无他法，只能用工程师们的心血去填平。尽管美国人慷慨地提供了岸防导弹的部分图纸，但从理论设计到实际生产，再到军事部署还有很长的一段路要走，如今战火将近，我们的工程师只能不舍昼夜地拼死向前迈进。\n\n“陈院长。”\n\n在摆弄仪器的陈德仁被迎面走来的青年打断，他抬起头，揉了揉自己疲惫到打颤的双眼，挤出一抹笑意。\n\n“怎么了，杜恩驰，你有什么话要和我说嘛？”\n\n杜恩驰点了点头，打开了手中图纸，平铺在了陈德仁的面前，指着导弹的末尾说道：\n\n“我们现在已经解决了发动机和燃料的问题，很快就能够再进行一次实战测试，陈院长，相信这次取得的进展会更加喜人。”\n\n一边听着杜恩驰的讲述，陈德仁并未停下手上的工作。最后，在一声哈欠声中，杜思驰结束了实验结果的报告。陈德仁轻轻放下了仪器，深深地吸一口气，慈祥地看向青年：”嗯，很好。尽管如此，我们不能太过乐观，哪怕只是多一海里的射程，我们都要拼尽全力去追赶。小杜，你已经很疲惫了，要是累的话就先休息一会，毕竟你是美国派来的工程师，没有必要和我们一样加班加点。”\n\n“……我也是一个中国人，陈院长。”杜恩驰沉默片刻，”尽管我的父母早在抗战开始前就移民美国，但回国是我的选择，我也会同我的同胞一起共进退。”他捏住自己的拳头，使劲伸了个懒腰后，重新拿起桌上的文件夹，将设计草图一页一页的展示给陈德仁看，探讨着如何简化生产的工艺。\n\n窗间过马，外边的太阳不知何时升起，工程师们的精力达到了极限，纷纷走出实验室，准备在短暂的休息后继投入到辛劳的工作之中。看着筋疲力尽的工程师们，杜恩驰收拾着研究的仪器，忍不住喃喃自语般地说道。\n\n“要是我的老师能够回来的话，我们的研究一定就能顺风顺水多了。”\n\n“你的老师？”\n\n陈德仁此时手都累的快要抬不起来了，但他的好奇心还是让他问了出来。他听闻这些华裔学生的老师对援助中国导弹图纸的事情做出了重大的推动，却从来没有听过他们主动谈起过他们的老师。\n\n“他是一个怎样的人？”\n\n“他是一名在NASA任职的火箭专家。当他听闻中国政府向美国政府要求导弹研究方面的援助时，他甚至想要放弃他在NASA的高薪工作，回国援助。尽管不出所料的遭到美国的拒绝，但是他仍然坚持让我们来协助研究。某种意义上，我也是因为他的鼓励才坚定了回国的想法。”\n\n“真没想到，大名鼎鼎的NASA里居然也有中国人，请问尊师贵姓？”\n\n听到这个问题，杜恩驰顿了顿，随后才一字一顿地说道："
 tnolar_chi.512.a:0 "姓钱，钱学森"

 tnolar_chi.513.t:0 "兵工厂和热干面"
 tnolar_chi.513.d:0 "李老汉抬头看向厂房的房梁，晃了晃又酸又累的脖子，顺手将满是机油的黑手在自己的工服上抹了几下。嗡嗡的切割声和叮当的敲打声在他走向食堂的时候也没有停止，所有的工人都在流水线上忙碌作业，整个工厂都进入了战时状态，不分昼夜地生产着提供给军队的枪支大炮。厂长在他来的第一天就下了死命令：流水线不能停，这也是他为什么每天需要工作足足十二个小时才能换来这珍贵的用餐时间。\n\n“真他妈的会用人。”\n\n李老汉一边臭骂厂长的那副嘴脸，一边穿越大半个厂房来到了食堂。说是食堂，也不过是在工厂门口的空地架起了几个大帐篷，工人们只能三三两两的蹲在一旁的空地前风卷残云般快速解决铁碗里的饭菜，连坐的地方都没有。李老汉伸长脖子，瞅见了铁碗里颜色金黄的热干面，忍不住砸吧了两下嘴，能在厂里吃到武汉的特色，那可真是不多见。在他找到一片空地，闻着麻香，正准备享受着这来之不易的面食时，几辆遮着迷彩的卡车从厂里开出，扬起一溜烟尘，把他张开的嘴里填满了尾气的黑烟。\n\n“他妈逼的，老子天天干活干这么久，吃个饭都还要呛的一嘴灰！”\n\n李老汉掐着嗓子干咳起来，骂骂咧咧地冲着扬长而去的卡车们，怄气般的对卡车的尾气吐了一口吐沫。这些卡车一天三趟，每次都把他们制造好的武器一搬而空，让人感觉军队的需求如同无底洞一般永远填不满，李老汉晓得这些武器要拿去打小鬼子，他们的班长也曾经指着地图，喋喋不休的描述着武汉的地理位置有多重要，他们厂的武器要送到前线，要用车、铁路、长江航道把武器运到滨海，南北，去那些李老汉一辈子也没去过的地方，硬要说的话，这些个武器比他们人都重要咧。\n\n“苕头日脑的狗东西，掉底子的家伙事，板马日的……”\n\n在他总算骂完了之后，他低下头，搅弄着碗里的热干面。李老汉希望他造出来的武器能多打碎几个小鬼子的脑壳。不过或许，他更希望这些车在来来往往的时候，不要再尘土飞扬，把他的面搞得满是土灰。骂归骂，骂完了还得继续干活。李老汉嘟囔着带上了安全帽，能不能赢，他心里也打鼓，但他咬了咬牙。"
 tnolar_chi.513.a:0 "爷爷造出的枪能多弄死几个就是赚。"

 tnolar_chi.514.t:0 "雨夜兼程"
 tnolar_chi.514.d:0 "“他妈的！小李！快把篷子拉上！那些精贵的玩意坏了我们赔不起！”\n\n轰隆的雷霆带来了倾盆般的暴雨，卷起了车后的防雨篷布，随车人员赶紧下车发疯般地把那些沉睡的钢铁仪器用的篷布盖上，每个人的眼睛都被雨点打的近乎睁不开。伴随着骂声，小李一咬牙，顶着暴雨一个健步跃上了卡车的后备箱，哗啦一声，张开的防雨布铺满了仪器，总算是没让雨把整个仪器都给淹了。\n\n“丢你姆妈……”\n\n小李一屁股瘫汽车的副驾驶，他一把脱掉了已经湿透的上衣，把双手伸到窗外，一边拧衣服一边骂到，“我们要去哪里？成都？把厂里那些东西七零八落的拆成碎块运到八竿子打不到的地方去？那些指手画脚的厂长倒是坐着飞机就过去了，落得个轻松愉快，留老子们在这路上颠屁股，这山路嘛时候是个头？”\n\n“年轻人就是心浮气躁。”张师傅转了好几下钥匙，这台老旧的卡车才哼哧哈哧的又动了起来，缓缓地跟上了前面再度启动的车队，“你把这些个东西留在上海，那日本人坐着小船，架着飞机就过来拆你，到时候你想跑都跑不掉！往好处想，真打起来了，成都在大后方，安全，总比咱们在上海那香饽饽那待着好。”\n\n“我就是气不过。”\n\n小李撂下一句气话，愣愣地看着如同长蛇一般的车队。张师傅看了眼他棱角分明的侧脸，又瞥了眼他的瞳孔，里面掺杂着仇恨的火焰。\n\n“咋了，看你这样子，想在前线和日本人玩命？”张师傅抽了抽鼻子，目光重新看向了颠簸的山路，“二街那个说书的说得好，说过一句，叫什么……山雨欲来风满楼哦，天要下雨，国要打仗，谁晓得能不能赢哦……我们到后方去，该干嘛干嘛算了。万一赢了，你再回东北……”\n\n“会赢的。”小李突然开口，打断了王师傅接下来的话。\n\n“什么？”\n\n小李转过头来，被打湿的刘海丝毫没有遮盖他如火一般的眼神，他再度张开嘴，一字一句地说道。"
 tnolar_chi.514.a:0 "我说，会赢的。"

 tnolar_chi.515.t:0 "上层的余裕"
 tnolar_chi.515.d:0 "晨香袅袅，在这漫长而又乏味的白日里，还有什么是比与好友促膝长谈更能打发时光的好选择呢？若是往日，陈进定然会听着新来的坎通货放出的曲调，收拾着房间，为一场又一场沙龙做着准备。可惜，今日他眉头微皱，兴致全无，正忧心于中日最近的冲突。\n\n“丰丸？什么风把你给吹来了？”陈进又不确定的瞥了一眼钟表——确实没到时间，“我款待不周，见谅。”\n\n“你先别说那些客套话了，有正事，要出大乱子了。”\n\n见来客神色如此紧张，陈进本来悠闲惬意的心提了起来，“怎么回事？”\n\n“中日两国，要打仗了啊。”\n\n“此话当真？”\n\n“我爹说的，千真万确啊。”\n\n“嘶。那我还能赴日留学吗？”\n\n“现在看来，是不行了。你爹固然本事大，但战端一开，谁还能记得这往昔的情面呢？我看啊，我爹的督办，恐怕也难以维系了。”\n\n俩人便是一番怒斥，而后便是心忧，一个担忧着自己的学位帽，一个担忧着自己的乌纱帽——当然，口头上还得担忧着“大东亚共荣”的未来。\n\n“中日两国如此亲善，若无日本对中国的鼎力相助，中国哪能有今天的成就？总统府那帮人简直是在乱弹琴！”\n\n“就是嘛，日本给中国带来了文明，你看青岛和台湾的环保、教育、医疗、养老和民权，难道不好过他处许多？中国欲弑日本，实乃倒施逆行之举啊。”\n\n“不过，倒也无须过于忧心。毕竟，"
 tnolar_chi.515.a:0 "中国应该不敢的吧？”"

 tnolar_chi.516.t:0 "老人的担忧"
 tnolar_chi.516.d:0 "老李抽着烟，一面等着来换班的人，一面望着隆隆作响的机器。透过香烟的迷雾，他莫名想起来小时候祖父讲的所谓“呲铁”——唉，时光荏苒啊，中国已不再是那时那个自由的中国，而自己，也几乎沦为了这怪物身上的一个小零件。\n\n“李叔，我来了，您回家吧。”不久前新来的那个额头上带着道深深伤疤的青年难掩他脸上的兴奋。\n\n“你小子咋那开心？怎地，找小姑娘，准备要大胖小子了？”\n\n“不是，李叔。您知道吗？今天政治帮派在市里都快闹了一天了。”\n\n“真的？”\n\n“那还能有假？而且现在没人管这事，满大街都在嚷嚷着要赶跑日本人，我合计着咱中国要变天了，要自由了啊！”\n\n“可别忙了吧，想当年那个姓蒋的，嚷叫着要让民族自由解放，结果呢？先是把小伙子征去当炮灰，又是放水淹死了那么多老百姓，人们为了他的所谓“自由”，付出了多大代价？然后呢？山不转，水不也转。小伙子啊，这种事情我看多了，那帮孙子许诺起来一个比一个好听，赶到真的成功的时候，他们便把我们一脚踢开，之前的许诺全是空头支票，你可别上他们的当。”\n\n“可是中国已经今非昔比了啊，而且你想想，上面这意思，就是摆明了要跟日本人干，等咱一打赢，咱就不是奴隶了，而是自由的公民……”\n\n他打断了滔滔不绝的青年，问道：“那要是日本人被赶跑了，咱厂子还能在吗？”\n\n“唉，李叔，你别搞那套老古板了，天下的厂子又不只这一家，等赶跑了日本人，我们想建多少就建多少。”\n\n“话虽这么说，可是……”老李想到了自己的妻儿，如果自己这个顶梁柱没了工作，他们家可该怎么办啊。年轻的自己已经让他们吃尽了苦头，难不成还要再让他们吃不上饭？许诺是谁都会干的，但是谁又能保证实现呢？更别说自己的生活还要因此受牵连，他看了看不谙世事的青年，深深的叹了口气。\n\n“您就别杞人忧天了。”青年笑了笑，拍了拍老李，“至少现在，我感觉我们回到正轨上了，过去的有些东西也找回来了。"
 tnolar_chi.516.a:0 "而这是最重要的。"

 tnolar_chi.517.t:0 "青年的狂热"
 tnolar_chi.517.d:0 "上海的街道两旁店肆林立，商贩的叫卖声此起彼伏，人流中不时可见穿着打扮时尚的年轻男女，在行色匆匆的人群中显得分外另类。\n\n近来邻里颇不太平，不知怎地，反帝涂鸦和猥琐图画如同癣子一般在街头小巷的墙上蔓延开来，打砸日货日商的妖风，也从上海刮到了南京。\n\n不过毛利拓海正忙着上班，无意于参与中国学生的集会与游行。多么聒噪啊，他想着。\n\n可惜现实总不遂人愿，他所厌恶的“聒噪”正直奔紫金山而来，听着中国学生们关于种种“主义”以及万变不离其宗的“打倒日本人”的争论，他终于怒火中烧，大声喝道：\n\n“你们吵什么吵啊，我们日本征服你们支那，就跟蒙元代宋，满清灭明是一样的，怎么对他们就“五族共和”，对我们就……”\n\n他话还没说完，鼻子便似开了个油酱铺，咸的、酸的、辣的一发都滚出来。片刻错愕后，拓海盯着面前的这个近乎比他矮一头的学生，几乎不相信是他出的拳。\n\n“你给我记好了，我们中国人争论所谓“主义”“民族”，是我们自己的私事，轮不到你一个外人来这指手画脚！你个岛国蛮夷，早点滚回你那个小破岛上去吧！”\n\n拓海缓了缓，随即压下怒火，尽量用最委婉的语气答道：“阁下难道不觉得争论这些是很无聊的事吗，毕竟阁下也改变不了什么，更何况在时间的长河中，这一切又是那么微不足道，不如学习一下鄙人，好好的做学问吧……”\n\n突然，一个高瘦的青年从人群里钻了出来，直接一脚踹到了拓海的身上，“和他废什么话啊，锤他就完了。”青年似乎准备上前再打一拳，却被理智一点的同伴拦了下来，拓海也察觉到事态的危急，赶紧夹住公文包一边仓皇逃离，一边回头骂着青年们："
 tnolar_chi.517.a:0 "“真是一群野蛮人！”"

 tnolar_chi.518.t:0 "报纸和电波里的战争"
 tnolar_chi.518.d:0 "还没有踏进报社的大门，胡海文就已经听到了里面嘈杂的喧闹声，而造成喧闹的原因是一则爆炸性的新闻——中国广播电台突然公布了大战期间日军在南京暴行的证据，当天举世哗然。作为《中华日报》的主编，他敏锐地意识到全新的新闻热点已经横空降世，也明白他们必须抓住这个绝妙的机会。\n\n“好了，大家冷静一点，”胡海文推门而入，“我知道大家很激动，但接下来必须冷静分析状况，决定好下一步。” \n\n“胡主编，上面这样做是彻底放弃中日关系了吗？那我们要不要也跟进报道，毕竟当年日本不止在南京犯下了如此大罪，假如仔细调查其他地方，采访当年的幸存者，或许能找到更加爆炸性的新闻。”\n\n“没错，但这样还不够。我们目前还有不少驻外记者，在他们所在的地区日军当年也一定犯下过罪行，不妨眼光放远点，让他们也调查并报道当地的日军历史罪行，这样也能在国际上吸引更多的读者。”\n\n在简单的讨论后，报社立即恢复了运转，新闻随着文字的书写不断地被生产，笔者们期盼着自己创造了下一个热点，为自己带来财富和名誉。胡海文当然注意到了，他们的文字能够一点点摧毁当前糟糕的亚洲秩序，而这就是他们文人报国的方式。"
 tnolar_chi.518.a:0 "硝烟将随着真相在亚洲蔓延开来"

 tnolar_chi.519.t:0 "日企离华"
 tnolar_chi.519.d:0 "小李手上抱着纸箱，回头望着空荡荡的公司大楼以及墙上的三菱标志。那是他多年的回忆所在；山田在候机厅抽着香烟，看着手腕缓缓走动的时针，计算着飞到印尼后要多久才能开始工作。\n\n随着峰会后中日关系降到冰点，东京方面加快了日本企业的撤离速度。日本企业逐渐撤出中国的同时，积极地在东南亚各国投资建厂以替代中国的经济地位。这使得一些主打共荣圈市场的中国企业获得的订单逐渐减少，不得不以解雇员工的方式来维持企业运行。日本资本的加速流失，以及日本企业的加速撤离，也在恶化中国的经济状况。这导致南京、上海、杭州等大城市治安环境的短期恶化，同时也让日本市场的低端工业品的价格小幅上升。联系紧密的两国逐渐敌对，带来的则是天文数字般的财富蒸发、两国经济增长的滞缓，以及民众生活水平的下滑。"
 tnolar_chi.519.a:0 "初步波动"

 tnolar_chi.520.t:0 "股市 “厮杀”"
 tnolar_chi.520.d:0 "香港证券交易所的工作人员忙碌地为变化的股票标价，上海的操盘手正在紧盯着股票的价格，东京的证券投资家拨打一通通电话决定将资金投往何处，而普通股民则跟着瞬息万变的股市形势做出慢半拍的操作。\n\n自峰会上中日关系恶化以来，共荣圈各国正在经历一次经济秩序的变动。白日与旭日为了争夺东亚的经济主导权使出了浑身解数。股市作为国民经济的晴雨表，首当其冲受到直接影响。大盘指数小幅调整、极少数股票强制退市、关键产业股票浮动剧烈成为东亚股市的现状。一些股民损失惨重，不得不“断臂求生”灰溜溜地退出股市。也有股民把握时机赚得盆满钵满，继续在股市中尽情“豪赌”。而两国财团在逐渐脱离对方影响的同时，谋求争夺共荣圈各国的市场份额，而股市也成为他们“厮杀”的战场。可以预见的是，共荣圈市场彻底在白日和旭日的影响下取得动态平衡以前，东亚的股市行情将不会有大的变化。"
 tnolar_chi.520.a:0 "既是危难，也是机遇。"

 tnolar_chi.521.t:0 "汇率变动"
 tnolar_chi.521.d:0 "在中日脱钩之前，中国市场充斥着各种各样的货币，在满洲国与其边境附近的居民，大多使用满洲元。山海关以南、广东经济特区以北多流通法币、日元。然而，无论是满洲国、还是广东经济特区，亦或是四川和云南，日元才是最受欢迎的“纸黄金”。\n\n然而，随着中日关系的恶化，以及中国在共荣圈市场将逐步减少日元结算，这个由日元、满洲元、法币构成的大东亚共荣圈市场的货币体系秩序将面临着巨大变动。以日元结算为主的公司与金融界大鳄不得不考虑减少日元的持有，而增加法币持有数额的企业和投机者也拿不准这步棋下得好不好。\n\n平民百姓对此更是反应不一，持有日元的居民们开始小额地兑换法币，持有法币的人们一点点的兑换日元，而一些以大东亚战争为“赌局”的“赌徒”们则开始“梭哈”，以大量持有某种货币为目标，想要在剧烈变动的局势中大捞一笔。银行的人流量与工作量也因此大增，刚拿到手里的日元和法币还没捂热就被民众换了出去。大量货币的兑换，造成了法币与日元汇率的短期跳动，这将对整个共荣圈的经济造成巨大影响。"
 tnolar_chi.521.a:0 "你要站在哪边？"

 tnolar_chi.522.t:0 "失业浪潮"
 tnolar_chi.522.d:0 "老陈看着碗里的吃食摇摇头，毕竟这是在厂里吃的最后一顿了。小张是刚毕业的大学生，昨天他还在办公楼里坐着，今天他就不得不找新的工作了。而赵老汉不舍地望着大片农田，这是替财东最后一次照料庄稼了。\n\n自中日经济开启脱钩进程之后，以及受到亚洲股市波动以及日企撤资的影响，中国企业的国际订单逐渐减少。以出口为主要盈利方式的中国企业和承接日本低端产业的企业正面临着亏损，不得不以裁员的方式减少消耗，也有少数企业因此破产清算。而日本帝国对中国粮食进口的逐渐减少也导致了农民收入的损失，农民们以减少种植面积减少生产成本，甚至一些农民以毁掉田地农作物的手段企图维持粮食价格。失业人口的增加使得市场萧条、市场萧条又进一步导致企业亏损扩大，而企业亏损又会使得失业人口增加。毫无疑问，这是一个恶性循环，这在消耗我们国家和民族的生命。"
 tnolar_chi.522.a:0 "我们必须做点什么"

 tnolar_chi.523.t:0 "《财经新闻·一》"
 tnolar_chi.523.d:0 "“现在是南京时间晚上7点，财经新闻为您播报最近的经济消息。我方记者报道，自中国与日本的关系恶化以来，以中国和日本为主体的共荣圈经济秩序面临着巨大变动。自脱钩政策以及日资离华之后，东亚的股票指数稳定度正在下降，日经指数呈现一种整体稳定、小幅调整、个别股票价格快速下跌的状态，而一些关键产业领域的指数也呈现出异于常态的表现。与此同时，大量的资金进入、退出股市更加剧了股票指数不稳定的状况。毫无疑问，这将影响共荣圈各国的经济健康。”\n\n“受脱钩政策影响以及股市动荡的波及，日本、伪满洲、广东经济特区、东南亚诸国都将受到这场经济秩序变动的影响。日本、伪满洲等工业化地区的商品积极寻找东南亚地区的买家的同时，也在加大对东南亚地区的产业投资力度。但由于受到多种因素影响，农产品、燃料、矿石原料、初级加工制品等大宗货物的价格在日本市场仍在小幅度上升。这提高了日本企业的运营成本、日本民众的生活成本的同时，也让人们对日本的经济信心有所动摇。在完成对东南亚地区的产业建设以及金融投资以前，日本为主的工业化地区市场将承受一定的经济增长压力以及失业率的上升。”\n\n“由于脱钩政策的实施，以及日资撤离的影响，我国金融业产生了小幅动荡。除了大宗商品的期货指数小幅调整之外，大型农业企业、大型矿产企业以及制造业企业的股票也经历了一定程度的波动，极少数股票则强行退市。而以电子产品、精细加工产品为主要产品的高端制造业企业的股票价格也受供应链、市场、技术版权纷争等因素阴晴不定。”\n\n“受金融业的波动以及国际订单减少的影响，我国农产品、矿石原料、初级加工制品等大宗货物的价格小幅下滑，农业、矿业以及低端制造业企业利润增长减缓。而电子产品、精细加工制品等高端制造业商品的价格则受各种因素影响而浮动。同时日企搬离中国以及日资的加速流失，导致我国曾为日企承接产业链下游的企业生存空间越发狭小。专家预测，这将使我国城镇失业率在短期之内形成一个小高峰。”\n\n“与此同时，我国新近期组成的中国商业联合会与日本财阀正在共荣圈各国争夺经济话语权。在东亚金融业上，双方则开启了一场规模不一的金融战。这也是恶化共荣圈各国经济现状的一个重要因素。”"
 tnolar_chi.523.a:0 "看来生意不好做啊……"

 tnolar_chi.524.t:0 "《财经新闻·二》"
 tnolar_chi.524.d:0 "“现在是南京时间晚上7点，财经新闻为您播报最近的经济消息。我方记者报道，我国遭遇经济增速下行以来，南京政府出台了一系列政策，以期达成维持经济增速目的的同时，促进国民经济健康。通过国家对股市的有力干预，大盘指数的走向开始趋于稳定，绝大多数股票减少了价格调整的幅度，关键产业领域指数的异常表现也开始消解。然而一些股票的价格指数由于中日两国的金融战而加剧动荡。但在整体而言，中国股市的情况在稳定中向好发展。\n\n在金融政策方面，中国央行宣布降低银行贷款利率，以帮助企业度过当前难关。通过降低利率的政策，以及‘国货运动’等因素的影响，大宗商品的期货指数调整幅度减小，农业企业、矿产企业以及制造业企业的股票价格也在以缓慢的速度稳定在一定的幅度之内。以电子产品、精细加工产品为主的高端制造业企业的股票价格经过中国政府的投资，获得了小幅度的增长。但由于高端制造业的方兴未艾、猖獗的技术盗用以及日本方面的金融攻势，中国的技术投资政策效果将逐渐削弱的同时，也为未来的产业发展预期蒙上一层阴影。”\n\n“由于一系列的刺激政策，以及日本替换货源效应的减弱，我国农产品、矿石原料、初级加工制品等大宗货物的价格下滑幅度较原来减小，农业、矿业以及低端制造业企业利润增长下幅逐渐停止。而电子产品、精细加工制品等高端制造业商品的价格则较为混乱。同时我国大型企业以及国家企业对原先承接日本产业链下游企业的逐渐收购与合并，使得原先亏损严重且濒临崩溃的企业不至于轰然倒塌。专家预测，这将使我国城镇失业率上升幅度逐渐减小，并有减少失业率的可能。同时专家强调，在日本以及伪满洲完成对中国市场的代替之前，日本对撤离中国市场的速率调节将对我国经济产生一定的波动。”"
 tnolar_chi.524.a:0 "总比之前的情况好。"

 tnolar_chi.525.t:0 "技术投资"
 tnolar_chi.525.d:0 "自古以来，中国就是著名的技术中心之一，无论奠定现代军事基础的火药、降低知识成本的造纸与印刷、还是方便远航探险的指南针，都是中国人民智慧的结晶。但我们的祖先并没有充分地利用这些技术，反而为了短期的利益和稳定而禁止技术的发展。致使中国已经远远落后于先进国家，处处受制于人。\n\n而在经济脱钩进程加速后，日本逐渐单方面终止技术合作。针对日本的科技封锁，南京政府宣布加大对科技企业的投资力度，并特别注重对电脑技术的升级。除此之外，南京政府还鼓励企业模仿与制造利用日本技术生产的商品，而终止技术合作之后产生的市场空白，除了被一些科技公司接手填补之外，更多的则是许多盗版商品来填补。"
 tnolar_chi.525.a:0 "盗版、仿制，后发国家的必经之路"

 tnolar_chi.526.t:0 "降息政策"
 tnolar_chi.526.d:0 "在以前，中国劳动群众生产的货物源源不断地运出口岸，送到共荣圈各国的市场上。为了在共荣圈市场中获得价格优势，除了尽力压低劳动力成本之外，在货币政策上常常做出有利于售出更多货物的决策。好处十分明显，国家得到发展、一部分人因此富裕起来，部分地区迈向工业化行列。\n\n然而，当日本不再对海量的中国商品买单时，曾经因此经济繁荣的政策转而成为恶化中国经济的慢性毒药。民众因社会保障不足而养成将血汗钱存入银行的习惯，也成为了中国经济“血管”的“血栓”。为了刺激市场以及增强货币流通，中国政府在草拟最低工资标准提案的同时，降低了存款利率以释放货币储蓄来刺激投资。降息政策能否达到理想效果暂不可知，但可以预见的是，中国政府将采取大规模的经济干预来应对中日脱钩之后造成的经济动荡。"
 tnolar_chi.526.a:0 "这是赚钱的好机会吗？"

 tnolar_chi.527.t:0 "国货运动"
 tnolar_chi.527.d:0 "在以前，中国人民消费的商品随着消费能力的不同而有所区别。苏格兰的威士忌、德国的轿车、美国的时奢以及南非的钻石通过隐蔽的走私通道源源不断地送到上层阶级的手里；日本的清酒香烟、广东的收音机以及自由印度的红茶在城市中产圈子里受到热烈追捧；而广大的劳动群众更青睐批发市场上的廉价衣物和划算量大的劣质白酒。\n\n自中日关系恶化以来，大量堆积的商品难以流通。为了将货品售卖出去，商家们自发喊起“爱国用国货”的口号。南京政府顺水推舟，通过官方媒体扩大宣传效果，使得使用国货成为一种新的风尚。支持运动的群体除了日常就在使用国货的劳动群众外，还有一部分因为经济脱钩而使得消费降级的中产市民们。国货运动虽然不能完全盘活市场，但也能起到一定的缓解作用。"
 tnolar_chi.527.a:0 "用国货，就爱国"

 tnolar_chi.528.t:0 "《财经新闻·三》"
 tnolar_chi.528.d:0 "“现在是南京时间晚上7点，财经新闻为您播报最近的经济消息。我方记者报道，我国遭遇经济增速下行以来，南京政府在出台政策的基础之上，扩大了对国民经济的干预力度。通过降息政策以及一系列政策的方向引导，大盘指数的走向稳定中有所涨幅，绝大多数股票的价格下跌已经逐渐停止，甚至有一部分股票价格开始回暖，关键产业领域指数大多恢复正常范围之内。只有个别几只股票的价格指数由于中日两国的金融战以及金融投机者的操作而走向失控。虽然在整体而言，中国股市暂时已经走出寒冷，但仍需要关注中日金融战所带来的金融风险。”\n\n“在金融政策方面，中国央行宣布降低存款利率的同时，在本月份增加了一定量的法币发行。通过国家干预力度的增强，以及军备扩张、货币流通等因素影响。大宗商品的期货指数状况总体上实现好转，农业企业、矿产企业以及制造业企业的股票价格也在稳定中探求上涨空间。以电子产品、精细加工产品为主的高端制造业企业的股票经过中国政府的扩大投资，以及相关政策对大量资金的引导，出现了异于当前经济现状的繁荣景象。但专家表示，由于我国高端制造业的基础较为薄弱、以及日本方面的阻滞和干扰，中国的高端制造业在短期内难以高效利用如此庞大的资金。并警告过量的资金投入容易导致相关产业过热，并对我国的高端制造业造成破坏。”\n\n“由于政策力度的加大，以及军备扩张、公共工程的修建，我国农产品、矿石原料、初级加工制品等大宗货物的价格逐渐停止下滑，农业、矿业以及低端制造业企业利润增长率缓速回暖。而电子产品、精细加工制品等高端制造业商品的价格则因相关产业的扩张而逐渐恢复正常。同时我国大型企业以及国家企业发起一系列的建设计划，一定程度上缓解了失业人口的就业需要。这使得我国城镇失业率停止增长的同时，也让部分省份的城镇失业率缓缓降低。专家表示，虽然我国经济状况正在改善之中，但也要关注内部与外部的潜在风险。”"
 tnolar_chi.528.a:0 "呼，缓过气来了。"

 tnolar_chi.529.t:0 "产业升级"
 tnolar_chi.529.d:0 "在十几年以前，科技现代化的建设使得中国逐步建成了自己的科研体系，并在追赶西方与日本的科技水平上立下了汗马功劳。但不可否认的是，中国在客观上仍然是一个较为落后的国家。在科研上，中国常常以学习与仿制先进国家已有的技术，鲜有中国科研人独立研制出的科学结晶。更不要说将科学成果建成产业链造福人民了。\n\n而中日关系恶化后，日本撤回了大量的科研人才与技术人才。这不仅让依赖于日本技术的部分高端产业被迫停止运转，还使得中国不得不走上自主研发的道路。基于现实上的需要，南京政府除了向德国与美国派出考察团以学习先进的科研体系和高端产业之外，还投入大笔资金增加科研、教育经费以及支持中国高端产业的发展。值得注意的是，中国政府对电脑产业以及相应的精细配件产业尤其重视，扶持高端产业的资金按照一定比例投入到相关产业当中。这些政策能否突破日本的科技封锁以及让中国成功转型还未可知，但起码对中国而言，这是一个好的开始。"
 tnolar_chi.529.a:0 "第二次科技长征？"

 tnolar_chi.530.t:0 "军备扩张"
 tnolar_chi.530.d:0 "在几年前，中国的军事现代化被日本派来的顾问粗暴干涉，不仅插手中国军队的军队编制与规模，还在军事设施的建设数量以及军事装备的生产数量上横加限制。即使中国政府秘密建设武器库时，也时不时被日本查出并加以破坏。日本的企图很明显，就是想将中国军队限制成永远打不赢日本军队的羸弱之师。\n\n但自从峰会之后，中日矛盾被彻底激化。日本的顾问与间谍被毫不留情地赶出中国后，中国政府再也不用看东京的脸色维持一个规模不大的武装了。根据解放同胞、收复故土的民族理想以及刺激经济的现实需要，南京政府宣布在规定地区兴建军工厂、扩大交通建设、布置海陆防线的同时，也在逐渐放开士兵招募的数量。虽然兴建军工厂所容纳的岗位并不能缓解失业潮以及彻底解决经济恶化问题，但军备扩张的政策在短期内却能够实打实地拉动原先低迷的需求，从而使得市场回暖。"
 tnolar_chi.530.a:0 "“爸爸，我也要当兵。”"

 tnolar_chi.531.t:0 "山雨欲来"
 tnolar_chi.531.d:0 "今天是这个月第几次通宵加班，总统先生早就记不清了，就在刚才还有几位经济专家在他办公室里大倒苦水，抱怨形势的艰难导致计划推进十分缓慢。等到他们汇报结束，办公室的门重新关上的一瞬间，高宗武才长长叹出了一口气，精疲力竭地瘫在自己的椅子上。\n\n自打峰会结束，整个南京政府里的所有人都忙得焦头烂额，不论是长江映残阳的傍晚，还是金陵沐朝霞的清晨，总会有人火急火燎地冲进总统办公室里紧急汇报，高宗武不得不时一边处理手上的工作，一边时时刻刻绷紧神经准备应对突发的事件。\n\n“哎，这些家伙们”——他的眉头狠狠跳动了好几下才抽搐着平静下来。扭头看看文件柜里那一堆“报丧”的信件和报告，根本无从发作的无名火瞬间就变成了哀叹……幸好他提前拆掉了那些用来彰显“民主”的意见箱，否则这些像纸钱一样的催命玩意早就能把他活埋了。\n\n他低下头，拿起了办公桌上那一沓金贵无比的报告。成都和武汉方面的进展还都算喜人，至少军方那几个咄咄逼人的老家伙已经好几天没来他这里做客了。得益于那一揽子刺激内需产业升级的政策，打脱钩以来仿佛遭受了致命打击的中国经济，居然又像个老掉牙的机器一样吱吱呀呀运转起来了。在全国宣传机器的引导下，舆论的天平也在逐渐倒向了有利于我们的一边，人民已经认识到了日本人已经不是我们的盟友，而是彻头彻尾的仇敌。或许，时至今日，让中国能够正面对抗日本早已不是痴人说梦，战争的准备也应该步入下一阶段了……\n\n“总统先生，您要的报纸。” 秘书的声音把他纷飞的思绪拉回了现实——\n\n他接过报纸，目光聚焦在那几个醒目无比的大字上：\n\n“挑战秩序的代价”\n\n没等秘书说出来“朝日新闻”这四个字，高宗武就深吸了一口气，喃喃道：“代价是会有的……”\n\n黑压压的乌云遮蔽了阳光，璀璨的闪电骤然划过，又撕裂了沉重的黑暗。\n\n秘书还在等待着最为关键的命令，高宗武已经转过身去，发出了一句无喜无悲的感叹："
 tnolar_chi.531.a:0 "“要下雨了。”"

 tnolar_chi.532.t:0 "利益交换"
 tnolar_chi.532.d:0 "总统办公室的门紧闭着，屋里溜出了自言自语的声音——\n\n“我们的底线就是国家主权，除此之外的所有……”\n\n特使艰难地咽了一下口水，试探着道：“都可以让步？”\n\n回答他的是一片沉默。\n\n特使的手颤抖得更厉害了，他犹豫了足足半分钟，咬了咬牙想要说些什么，看看守在门边面无表情的秘书，又颓然地低下脑袋，意会地点点头，转身离去。\n\n临行前特使回望了一眼笼罩在蒙蒙雾气之中的总统府，弯腰钻进了防弹轿车，几辆满载士兵的军车在前方开道，这位很可能决定未来中国乃至整个东亚命运的“小人物”正式踏上了他的出访之路。\n\n望了一眼窗外厚重的云层，特使突然产生了一种错觉——中华民国的未来，似乎也像是这云层后面的天空一般难以观其全貌……\n\n用指关节敲击了几下桌板，特使才哑然失笑。落日之后的阴凉，本身就是个很有吸引力的筹码，不是吗？傻笑了一会儿，特使才重新思索起一个新问题来——\n\n“团结协定还是自由国家组织？”\n\n思绪里，抉择的硬币正在空中打转，正面还是反面呢……特使的心中已经有了主意。"
 tnolar_chi.532.a:0 "“所立之处，便是潮头。”"

 tnolar_chi.533.t:0 "意外的访客"
 tnolar_chi.533.d:0 "本日，中华民国总统特使突然访问柏林，并向[GER.GetLeader]元首转呈中华民国总统高宗武先生的问候。由于亚洲局势愈发紧张，中日之间的矛盾已经不可调和，战争已经迫在眉睫，中国政府试图在国际上寻求伙伴以缓解将来面临的军事压力。\n\n双方的初步会谈已经在柏林郊外的湖畔别墅开展，中国的特使提出了让大日耳曼国提供武器支援和资金援助的请求，而他所提供的筹码是在战后将本国的市场逐步开放给我国，并且愿意将部分矿产资源的开发权赠与我们。我国的代表请求暂停了会议，要求更多的时间来决定援助协议是否签署。\n\n抛开中国所能提供的经济利益不谈，让日本深陷亚洲战争的泥潭能为我们带来更为庞大的政治利益。届时，日本的全部精力将不得不集中在东亚，其在非洲东部和印度洋的影响力也会大幅度收缩，我们也将可以巧妙运用这一时期的影响力真空，扩大我们对这些地区的控制，取得冷战的主动权。中国能够拖住日本的时间越久，对我们越是有利，所以，无论中国提供的回报是什么，这次援助协议显然是一场一本万利的生意。"
 tnolar_chi.533.a:0 "亚洲要到黄昏了"

 tnolar_chi.534.t:0 "意外的访客"
 tnolar_chi.534.d:0 "本日，中华民国总统特使突然访问华盛顿，并向[USA.GetLeader]总统转呈中华民国总统高宗武先生的问候。由于亚洲局势愈发紧张，中日之间的矛盾已经不可调和，战争已经迫在眉睫，中国政府试图在国际上寻求伙伴以缓解将来面临的军事压力。\n\n双方的初步会谈已经开展，中国的特使提出了让美利坚合众国提供武器支援和资金援助的请求，而他所提供的筹码是在战后将本国的市场逐步开放给我国，并且愿意将部分矿产资源的开发权赠与我们。我国的代表请求暂停了会议，要求更多的时间来决定援助协议是否签署。\n\n抛开中国所能提供的经济利益不谈，让日本深陷亚洲战争的泥潭能为我们带来更为庞大的政治利益。届时，日本的全部精力将不得不集中在东亚，其在太平洋和南美洲的影响力也会大幅度收缩，我们也将可以巧妙运用这一时期的影响力真空，扩大我们对这些地区的控制，取得冷战的主动权。中国能够拖住日本的时间越久，对我们越是有利，所以，无论中国提供的回报是什么，这次援助协议显然是一场一本万利的生意。"
 tnolar_chi.534.a:0 "亚洲要到黄昏了"

 tnolar_chi.535.t:0 "有代价的援助"
 tnolar_chi.535.d:0 "“柏林方面说，他们可以援助我们一批足够武装五个师的军火，还将提供我们迫切需要的战斗机和重型武器，正在与印度协调中转这些物资。考虑到我国的实际情况，他们还将派遣经验丰富的援华军官顾问团来帮助我们更好地利用这些宝贝疙瘩……”\n\n听完秘书的回报，高宗武阴晴不定的表情波动了几分：\n\n“他们的条件呢？”\n\n“因为确实不具备武装干涉的能力，德国人的胃口比我们预期的小很多，目前只要求了战后的经济利益。但谈判过程中他们提到了在中国的驻军权，甚至还对青岛的军港提出过要求，或许将来我们要求扩大援助时他们就会重新提出这些要求。”\n\n“还在意料之中，只要战况顺利这些额外要求就不用理会。那美国的反应呢？”\n\n看着面前低眉顺眼的特使，高宗武微微皱了皱眉，特使的表情也有点不太好看：\n\n“美国人并不认为我们能正面击败日本，他们认为我们充其量只能牵制一下日本方面的战斗力，帮助他们拿回太平洋上的主导权……”\n\n“不过为了表示诚意，他们愿意先行支付一笔军事贷款，如果我们能取得战果，他们会相应加大援助力度……”\n\n取得战果？\n\n高宗武冷哼了一声，打断了特使的话。\n\n取得战果，还用得着他美国人来分一杯羹么？想要把外汇换成实质的援助就只能在国际市场上购买武器，而美国自己就是最大的武器供应商，到最后美元又回到了他们自己的手里。\n\n“轻飘飘的钞票就想让中华民国的战士们流血牺牲，美国人的算盘打的真响亮啊。”"
 tnolar_chi.535.a:0 "到最后，还是要靠自己"

 tnolar_chi.536.t:0 "飞跃屋脊"
 tnolar_chi.536.d:0 "“报告指挥部，现在我们刚刚离开昆明上空，正在向云龙县方向飞行。”刘佑身体紧绷着，全神贯注地盯着自己手中的地图和测距工具。\n\n“小伙子。”祝高驰伸出右手来，拍了拍刘佑的肩膀，“第一次上飞机？”\n\n“是，我刚刚从中央航校毕业没多久……”\n\n“看出来了。”祝高驰笑了几声，这让刘佑放松了不少，“今天天气还不错，基本没什么需要注意的。”\n\n“可日本人……”刘佑声音放低了一些，似乎有很多顾虑。\n\n“自由印度开放了领空，咱们往那边飞，他们可没有理由管咱们。”祝高驰探头看了看左右两侧硕大的涡扇发动机，“看到这两个发动机，就想起来以前我在航校学习的事了。”\n\n“以前和现在教的知识有什么不一样吗？”\n\n“那时候可不像现在啊，开着c1运输机，升限一万一千多米，直接爬升飞过去就好了；那时候我们只有些老式运输机，升限才八千多米，两个星型发动机也不适合高空作业。学员要是问飞到喜马拉雅山这类海拔平均六七千米的地方怎么办，教官就只会教我们像以前的那些老前辈那样做，开着飞机穿行喜马拉雅山。要是遇到强紊流、强风、结冰这些情况，也只能自认倒霉了。”\n\n“现在可好了。”祝高驰依旧羡慕地看着那两个涡扇发动机，“有了这个，咱们也不必再冒险了。”\n\n“比起那些老掉牙的飞机，你还不算落伍，最起码见过这些先进设备。”装卸员的话逗得大家都笑了起来。刘佑也舒展开紧皱的眉头，跟着一起笑了起来。看到这一幕的祝高驰，欣慰地拍了拍年轻人的肩膀，便回过头去观察四周了。"
 tnolar_chi.536.a:0 "钢铁之翼，飞跃屋脊"

 tnolar_chi.537.t:0 "骨断筋连（1）"
 tnolar_chi.537.d:0 "冷风呼啸，空气苦干，满洲的长夜伴随着死的寂静，刺骨的彻寒让人感觉血液都被冻成了鲜红的冰块。在一家日资工厂的门前，王老根被架着胳膊从门里扔了出去，后背先着地，火辣辣的刺痛让他如一只将死的虫子般蜷起身子，浑浊老朽的双眼盯着面前架他出来工人和日本监工，却没有丝毫辱骂，反而如同捣蒜一般磕起头来。\n\n“行行好，老爷，大人，行行好……我干了这么多年……”\n\n谁都知道被厂里丢出来意味着什么。王老根战战兢兢的近乎快要哭出来，满是皱纹的额头近乎在地上磕出了丝丝血痕，嘴里念叨着零碎的讨饶话语。得来的却不是同情，而是一只擦的蹭亮的皮鞋，狠狠地踹在了他的鼻鼻梁上，剧烈的疼痛伴随着温润的鲜血，王老根再一次被狠狠地踹翻在地，鲜血倒灌进了他的鼻腔，呼吸之间满是铁锈味，眼里只剩下了鲜血的赤红。\n\n“别打了，别打了……我走，我走，别打了……”\n\n他痛苦地用手扶着自己被踹他的鼻梁，呜咽着往后挪动着自己的身躯，耳边萦绕的满是日本人云里雾里的脏话，随后便是在他的肋骨，腹部上如雨点一般的暴踹。直到他浑身蜷缩，再也动弹不得，日本监工才丢下了半死不活的王老根，带着两个冷漠麻木的工人回了厂房。\n\n王老根在严寒中躺了许久，他本能想要用自己的手支撑身体想要站起身，但右边空落落的袖筒却让他再一次跌倒在原地。而他蠕动着自己的身体，用左手的手肘再一次撑起了身子，扶着被器械夹断的右手，一步一颤，消失在了满洲的长夜中。\n\n他不停的走着，不停的走着，直到他再也支撑不住，倒在堆积着垃圾的街角。彻骨的严寒将他浑身包围，干瘪的嘴唇的凝固着深黑的血污，他想起了自己那毅然去抗日的哥哥，兄弟之间早已断了联系。他知道自己已然命不久矣，几滴浑浊的眼泪顺着他干瘪的脸颊滴落而下，他哽咽着，多么希望当初自己没有那么软弱，也跟自己的哥哥走，死在战场上，也比死在这无人问津的垃圾堆里好。他蜷缩成一团，抽抽噎噎地痛哭起来。\n\n啜泣声愈来愈小，直到最后的回响也消失殆尽，满洲的长夜再一次恢复了死一般的寂静。"
 tnolar_chi.537.a:0 "王老根死了，到死都未曾看见黎明。"

 tnolar_chi.538.t:0 "骨断筋连（2）"
 tnolar_chi.538.d:0 "卢俊在每天的清晨都要来到屋子里这间狭小的侧卧里，看着这位干瘪的老人，卢俊知道，他的生命已经走了最后。想到这里，他沉默的拉开了窗帘，晨曦的光芒顺着缝隙照亮了老人的脸庞，在他满是皱纹的脸上，那双锐利的双眼此刻也浑浊了起来。 \n\n“小，小卢……”老人在喘息之间开口说道，“你也老了，瞧，你都有白头发了……我，我也老了，扛不动枪了，不中用了。”老人的喉咙里传来了剧烈的咳嗽声，卢俊连忙走到床边，紧紧的握住了老人的手，那是一只怎样的手啊，颤抖，干瘪，甚至能摸出手骨的形状。卢俊的双眼湿润了，带着些许哽咽，开口说道。\n\n“王叔，我告诉你一个好消息，现在镇子上又开始征兵了，我们又要打日本人了。你再撑一撑，到时侯，我背，我也把你背回东北，背回家……”\n\n听到这句话，王叔苍白的脸上红润了些许，但很快又近乎被剧烈的咳嗽涨红了脸，尽管如此，卢俊感觉到一股力量紧紧的握住了他的手，握的他有些生疼。\n\n“好！好啊，打日本人，打的好啊！”王叔长长地呼出一口气，随后便口齿清晰地说道，“东北军的兄弟们都没有白死，你的哥哥们都没有白死，我苟延残喘到现在，也没有白活！”\n\n王叔脸上的笑意却掩盖不住，但片刻的激动之后又露出了一丝遗憾，“可惜，我是看不到胜利的那一天了。”\n\n“王叔，你在说什么！你不是一直和我说，要活着回去吗！”\n\n王叔的另一只手无力的摆了摆，打断了卢俊焦急的话语，“我自己身体什么情况，我自己清楚。我唯一挂念的，只有我那还在老家的弟弟，四十年了……也不知道他还有没有活着。小卢，在我死后，你把我的身子烧了，带回东北，看看我的弟弟过的怎么样……再帮你认识的那些东北军的弟兄们，立个碑，把他们也带回家……”\n\n“王叔，我知道了，王叔。我一定，一定会带你回家，一定会的……”\n\n卢俊的泪水此刻终于如决堤一般夺眶而出，但王叔却笑了，他凝望着天花板，身体慢慢地放松下来，向后仰去，双手无力地耷拉在了床边。王叔看着此刻已经哭成泪人的卢俊，泰然地笑了，断断续续说出了最后的话语："
 tnolar_chi.538.a:0 "“你要替我们回家。”"

 tnolar_chi.539.t:0 "暴风雨的前夜"
 tnolar_chi.539.d:0 "天上响了个炸雷，把熟睡中的王兴吵醒。他不知道火车开了到底有多久，只知道从南京出发时，他们排的大部分人都已经睡的很熟了。王兴站了起来，向窗外望去，外面漆黑一片，除了远处一闪一闪的惊雷，就是一片无边无际的田野。 \n\n“你他妈踩到我了！”老张揉揉眼睛，对着王兴大叫。但是王兴没有理会他，只是伸出手，抄起老张的手臂——他是全排唯一有手表的人——看了看时间，已经是凌晨。王兴的脑袋脑袋缓缓运转，意识到火车已经开了快一天多了。\n\n“哎，你说，这大半夜把我们撵起来，上面人到底是怎么想的？”\n\n“谁他妈知道！要么真要打仗，要么就是姓高的他们脑子有毛病。”老张啐了口唾沫，翻身试图睡去，但是他们俩的交谈已经把大部分人都吵醒了。他们骂骂咧咧，本着下水了也要拉一个的精神摇醒排长。\n\n“排长，这火车开了这么久，到底是要干嘛？！”排长刚准备破口大骂他们多管闲事，火车突然猛震了一下，停了下来。车厢门开了，营长拿着手枪进来，所有人都同时起立。营长满意的扫视了一圈站的笔直的士兵们，清了清嗓子，高声说到："
 tnolar_chi.539.a:0 "“到东北去！”"

 tnolar_chi.540.t:0 "国耻未雪男儿志"
 tnolar_chi.540.d:0 "长夜漫漫，不见星月。王兴率领着他们一整个排潜伏在铁轨两旁的树林之中，透过树梢间的缝隙打量着满洲国的前哨站，他们的防线似乎也仅仅是近期才草草构筑完成，仅仅是用一圈铁丝网和几道沙袋就试图把我们拦在前哨站外。\n\n“老王你瞧，那些个小鬼子还在忙着从火车上卸补给。”\n\n王兴接过了老张手中的望远镜，仔细打量起了面前的阵地。那些日本人此刻仍然马不停蹄地把沙袋，弹药之类的补给从火车上卸下来。而当他看到耸列在两座铁塔之间，刻招牌上的“大满洲帝国”五个大字，以及满洲国的黄底旗耀武扬威的飘荡在招牌的两旁时，他忍不住皱起了眉头，对身旁的士兵嘀咕道。\n\n“等我们打下了这个哨站，第一件事就是把那旗子和招牌给我拔了。老子看着刺挠，有满洲既无中国，知道了吗？”说完这话，他深深的吸了一口气。双手此刻稳稳的端着手中的步枪，如潜伏在黑暗中的老虎一般死死地盯着自己的猎物，等待进攻时间的到来。\n\n伴随着一阵刺啦的声响，两道淡黄色的轨迹划破天际的黑暗，随后耀眼的照明弹便是如同高悬的太阳一般挂在了前哨站上，照亮了他们此刻的一举一动。伴随着一阵枪响，放哨的日本人从他们的哨塔之上跌落而下，砸断了他们飘扬的满洲旗，尖啸一般的骂声顿时夹杂了整个营地。\n\n“打得准！”王兴看着那哨兵的尸体砸断了他们的满洲旗，不免兴奋万分，站起身，高声呼喊道：“兄弟们，跟我上！把手雷都扔出去！”\n\n“杀啊！！！”\n\n浴血的喊杀声划破了死寂的长夜，熊熊的火光冲天，日本人的反应十分迅速，但战士们的攻势更加凶猛。猛烈的攻势甚至活生生把前哨战的防线撕开了一个巨大的口子，战士们冲破了对峙的防线，如锋刃一般鱼贯而入，将匕首插进了敌人的腹地。一瞬间，喊杀冲天。\n\n在战事稍停，厮杀暗淡之后，王兴亲自上前，拔掉了那耻辱的满洲旗，将青天白日满地红的国旗插在了营地之上。战场上的所有人都停下了手中的活计，抬头看向了那有着几个弹孔，此刻却仍然被火光映衬，飘扬在战场之上的国旗。解放满洲的大门被踹开了，唯有鲜血和战火，才能够撕破死寂的长夜，为四十年的压迫和奴役画上最后的终点。"
 tnolar_chi.540.a:0 "日月同辉荡烽烟。"

 tnolar_chi.600.t:0 "大东亚战争"
 tnolar_chi.600.d:0 "太阳带着温暖沁人的光芒与和煦凉爽的微风照常升起。然而，我们从未像今天这样确信：这高悬于天空的烈日，注定不会落下。它如同一只洞悉世间的天眼，坐观尘世的迭起兴衰、秩序的分崩离析，还有，奴隶的奋起反抗。此刻，我们的军队正向昔日的霸主进发，随时准备打破束缚着我们的锁链，解放仍被日本人压迫剥削的同胞，解放我们自己！东风已经悄然拂起，它从最初的一缕微风化作了席卷深山巨谷的狂岚，唤起了亚洲所有饱受压迫的人民，赋予了他们打破枷锁的权力与意志——让龟缩在海外孤岛的帝国主义者颤抖！我们将通过我们在东亚的绝对实力，将日本在大陆上的影响力彻底抹去；我们将在其他饱受旭日帝国残酷压迫的兄弟姐妹们的支持之下，让日本陷入万劫不复的深渊！\n\n现在，赞颂着我们国家、民族脊梁的钟声，已经传遍了祖国的每个角落。钟声不但象征着战争的召唤，也代表着在未来的抗争中，对统一与友爱的高呼。祖国命运的舵手、这场伟大战役的最高指挥官——高宗武总统，在这和谐的钟声中向全世界宣告：这场战争不仅仅会决定中国人民的命运，更将决定整个人类的命运。人民齐声高歌，谱写了这首为夺去中国人民自由的仇敌而作的挽歌。\n\n我们已经准备好了。多年来，我们流血流汗，辛勤工作，只为等到这报仇雪恨、洗刷耻辱的机会。我们将向我们的宿敌进军，把他们从纵情享乐的城堡与高塔中，扔进他们自以为可以掌控的海洋！我们会让日本人知道，一个统一、独立的中国将会迸发出多么强大的力量。我们会告诉全世界，中国人民是不愿做奴隶的人民！"
 tnolar_chi.600.a:0 "向前进！冲破这黑暗世界，向光明未来前进！"
 tnolar_chi.600.a.tt:0 "§R我们终将收复祖国故土！§!\n§R亚洲火药桶再次点燃…§!"

 ##外交博弈

 tnolar_chi.1100.t:0 "共荣圈外交GUI界面开始" #用于初始化GUI_未使用
 tnolar_chi.1100.d:0 ""
 tnolar_chi.1100.a:0 ""

 tnolar_chi.1101.t:0 "博弈对象报告-平等成员国" #用于选定国家时对其进行简单介绍
 tnolar_chi.1101.d:0 "根据情报部门信息和外交部的研判，本次博弈的对象属于共荣圈中的平等成员国。该类国家仅仅是为了利益与日本暂时结盟，在外交选择上拥有足够的自主权，有极大的可能脱离共荣圈，前提是我们能够向他们证明与我方结盟能提供给他们更多的利益。\n\n外交部会议提出的方案中，建议在拉拢博弈的过程中尽可能地怀柔，采取更加温和的方式，而非暴力威胁，否则只会取得适得其反的效果。"
 tnolar_chi.1101.a:0 "厚德载物"

 tnolar_chi.1102.t:0 "博弈对象报告-经济依附国"
 tnolar_chi.1102.d:0 "根据情报部门信息和外交部的研判，本次博弈的对象属于共荣圈中的经济依附国。该类国家的经济与共荣圈的整体经济密不可分，就像树干和枝叶一样，枝叶通过光合作用为树干合成有机物质，树干也为枝叶提供水分和营养。所幸，枝叶也是可以“嫁接”的，假如我们向他们证明日本的无能和贪婪后，中国也能为他们提供充足的市场份额，保障他们在新的经济圈中依然可以正常进行经济活动，这一类国家也就会考虑是否要脱离共荣圈了。\n\n外交部会议提出的方案中指出，即便向经济依附国提供了足够大的市场，他们仍然会因为政治惯性在外交选择上不停踌躇，想要逼迫他们做出选择，有时会不得不需要适当地威胁他们。"
 tnolar_chi.1102.a:0 "软硬兼施"

 tnolar_chi.1103.t:0 "博弈对象报告-政治傀儡国"
 tnolar_chi.1103.d:0 "根据情报部门信息和外交部的研判，本次博弈的对象属于共荣圈中的政治傀儡国。顾名思义，该类国家就是日本的提线木偶，即便在名义上是独立的国家，其一举一动都必须得到日本的授意，想要脱离共荣圈的控制难如登天。\n\n外交部认为这种国家依然有着拉拢的可能，但前提是帮助他们获取政治上的独立或者帮助政治傀儡国的在野反对党派掌控权力，显然这将消耗我们更多的时间和精力。值得注意的是，在政治傀儡国的眼中脱离日本有着更高的政治风险，我们所提供的好处并不一定有着很高的吸引力，拉拢的过程也将更加吃力，博弈也更有可能失败。伴随高风险的往往是高回报，政治傀儡国对于日本而言有着更加重要的意义，每有一个傀儡国脱离控制都会对日本产生不小的打击，所以，本轮博弈是胜利之路上避无可避的磨难。"
 tnolar_chi.1103.a:0 "迎难而上"

 tnolar_chi.1104.t:0 "博弈对象报告-军事占领国"
 tnolar_chi.1104.d:0 "即便没有外交部门的研判，所有人都知道这一类国家是日本的军事占领国，绝无任何拉拢的可能。我们要做的只有尽可能地联系和资助当地的抵抗力量，削弱日本在当地的军事力量，为以后可能的军事打击做准备。"
 tnolar_chi.1104.a:0 "未雨绸缪"

 tnolar_chi.1105.t:0 "博弈对象报告-广东"
 tnolar_chi.1105.d:0 "作为共荣圈中最特殊的政治实体之一，广东是外交博弈中必须特殊处理的对象。广东内部政治被多家企业掌控，每个企业的利益诉求都有所不同，再加上各个性格迥异的企业领导人都有自己的小算盘，广东的政治诉求也更加扑朔迷离。\n\n通过驻广东领事所整理的信息，外交部针对每种可能的情况提供了不同的方案。索尼和长江实业是最容易拉拢的对象，只要许诺足够的自治权很多分歧就能迎刃而解；松下是精明的商人，无论他是否选择返回日本都可以尝试与他进行谈判，毕竟把广东卖出一个好价钱也能向他的岳父证明他的商业能力。如果是日立或者是日本军队控制了广东，唯一的选择只有将精力和资源用在援助抵抗势力上，做好军事解放的准备。富士通的井深大有着截然不同的两种可能，假如他认识到了自己曾经的错误并且好好忏悔，我们依然有可能拉拢他；假如他死不悔改，固执己见，我们就必须砸碎他那可笑的未来之都，从中解放我们的人民。"
 tnolar_chi.1105.a:0 "对症下药"

 tnolar_chi.1106.t:0 "博弈对象报告-蒙疆"
 tnolar_chi.1106.d:0 "尽管蒙疆在名义上一直是我们的自治政府，但从德王与日本人接触开始就一直有着独立的想法，而我们也一直没有能力解决蒙疆自治权的问题，就对他们的逆反之心视若无睹。现在他们趁着共荣圈秩序崩坏的契机抓住了日本人送来的救命稻草，妄图借助日本的力量实现真正的独立，公然站在了我们的对立面，可谓是其心可诛。\n\n外交手段对叛徒毫无意义，要做的只有尽可能地破坏他们的稳定，最后用武力让他们回到中央的统治下。"
 tnolar_chi.1106.a:0 "以武谋独，死路一条。"

 tnolar_chi.1107.t:0 "博弈对象报告-满洲国"
 tnolar_chi.1107.d:0 "曾经有日本人叫嚣：“即便放弃本土，也绝不放弃满洲”，可见满洲对日本人的重要性。作为共荣圈的心脏，日本人对满洲的控制是绝无仅有的，所以满洲从一开始就是我们的敌人，绝无拉拢的可能。\n\n东北沦陷已经四十多年了，我们不知道新一代东北人有多少还认为自己是中国人，不知道东北到底还有多少抵抗力量存在，但我们坚信东北人依然是我们的血亲，东北军残存的执念也依然引导着我们从日寇铁蹄下解放同胞。无论如何，我们都将在战前尽可能地联系东北残存的抵抗力量，为将来战争做好准备。"
 tnolar_chi.1107.a:0 "枕戈待旦"



 tnolar_chi.1120.t:0 "回合开始" #用于每回合开始时的简单介绍及提醒
 tnolar_chi.1120.d:0 "新回合的外交博弈开始了，请集中注意力，胜负有时就在恍惚之间。\n\n发牌既定，但手牌能打出的效果未定。请在心中默默向命运女神祈祷胜利，现在，"
 tnolar_chi.1120.a:0 "请选择手牌"

 tnolar_chi.1121.t:0 "摊牌" #进行事件-通用-地区争夺-胜利
 tnolar_chi.1121.d:0 "本轮外交博弈的结果揭晓，我们以绝对优势取得了胜利，泛亚解放同盟的实力距高居九霄之上的赤色金乌又近了一步，虚伪的泛亚羽翼也被我们折下一只。被折下的羽翼将被我们打造成后羿的箭矢，在最终决战时搭在诛日的神弓之上。"
 tnolar_chi.1121.a:0 "技高一筹"

 tnolar_chi.1122.t:0 "摊牌" #进行事件-通用-地区争夺-失败
 tnolar_chi.1122.d:0 "本轮外交博弈的结果揭晓，微弱的劣势让我们输掉了本轮博弈。显然，我们的实力和共荣圈比起来依然难以望其项背，但一场局部胜败不能完全主导全局的输赢，只要我们总结失误，在下一次博弈中采取更好的决策，我们总会胜利。哪怕在谈判桌上拿不回来，我们也能在战场上拿回来。"
 tnolar_chi.1122.a:0 "棋差半招"

 tnolar_chi.1123.t:0 "摊牌" #进行事件-通用-地区争夺-平局
 tnolar_chi.1123.d:0 "本轮外交博弈的结果揭晓，敌我双方的实力处在了一个绝妙的平衡点上，博弈最终以平局收场。共荣圈和泛亚解放同盟都明白，必须继续取得博弈的胜利才能在实力的天平上添加更多的筹码，所有人都摩拳擦掌准备下一轮博弈。"
 tnolar_chi.1123.a:0 "平分秋色"

 #外交系统进行风味事件
 
 tnolar_chi_flavor.1100.t:0 "大宗贸易" #进行事件-广东回合1
 tnolar_chi_flavor.1100.d:0 "一份简洁的表格被列在魏贺面前，面前这个带着墨镜，身着西装的“同事”正在侃侃而谈：对的，他们在谈生意，一批大宗进口，要从印度尼西亚转手。毕竟现在国际形势危急，不绕道怎么行？\n\n两人相谈甚欢，谈到日落时分方才分别。魏贺在香港曲折的街巷里穿梭，一边走一边从口袋里拿出刚才的表格。夜色之下，原本黑白的表格上赫然闪着淡淡荧光。\n\n读完后，他走到楼道口旁的垃圾桶边，点了根烟——虽然他根本不会抽烟，把烟带着表格一起扔进了垃圾桶里，静静的看着它俩一起化为灰烬。"
 tnolar_chi_flavor.1100.a:0 "暗棋落定"
 tnolar_chi_flavor.1100.a.tt:0 "对于£GFX_GNG_Guangdong_texticon §R广东§!的外交博弈已经开始，目前处于第一阶段：§m舆论争夺§!"

 ##未使用
 #tnolar_chi_flavor.#.t:0 "健步如飞"
 #tnolar_chi_flavor.#.d:0 "“你说这几天主编在搅什么，写了些不知所谓的东西简直是脏眼，哇我都不想看。”广州日报的副社长趁着午休时间和身边的写手们不停的倒苦水。\n\n“现在我天天接到街坊的投诉信啊，说要再不把这个狗汉奸赶出报社就要上门亲自赶人啦。”\n\n副社长摘下眼镜擦了擦，继续说，“可是呢，这日本人也在跟我谈心，黑道直接开着车过来到门口，让我不准开了他，社长现在又不管你们说谁能给个法子啊，总不能最后报社扑街含家产了吧。”\n下边的编辑们叽叽喳喳说了半天，可惜到最后还是没能给出个方法，就当副社长打算彻底撒手学自己上司时，一封邀请函送到了他手上。\n\n居然是民国驻广东使馆寄来的，邀请他们去参加媒体大会，可算找到借口不管这事儿了，副主编连忙招呼自己下属出发。\n\n“对了，让那个刚来的女学生，对就是那个之前去南京实习采访的，叫秋芯的，跟着我们一块去，该让新人见见场面！”"
 #tnolar_chi_flavor.#.a:0 "没过多会，报社的面包车就飞也似地逃离了这是非之地。"
