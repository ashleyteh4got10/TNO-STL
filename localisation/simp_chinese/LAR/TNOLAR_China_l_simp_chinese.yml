 CHI_LAR_Operation_sun_set_0_idea:0 "落日行动"
 CHI_LAR_Operation_sun_set_0_idea_desc:0 "已经过了多少年了？究竟要从何时开始计算？是重庆变成废墟瓦砾的那一年吗？是卢沟桥响彻枪声的那一年吗？是爆炸声回荡在柳条湖那一年吗？亦或者，更早，黄海上舰炮齐鸣的那一年……东南沿海的大明百姓水深火热的那一年……\n\n倭寇打着反对昂撒殖民帝国的旗帜，蹂躏着中华儿女的灵魂；他们喊着泛亚主义东亚共荣的口号，吸食着中华大地的血肉。旭日光芒所至之处，并非欣欣向荣、生机勃勃，反而是成千上万死不瞑目的怨灵。而今天，这一切终于要有个了断了，成千上万的儿郎穿起军装拿起武器，他们将让青天白日回到中国的天空上，而旭日，也将由他们亲手埋葬。"
