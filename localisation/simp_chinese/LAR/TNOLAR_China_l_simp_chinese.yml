 #军事现代化后衔接

 tnolar_chi.1.t:0 "现代中国梦"
 tnolar_chi.1.d:0 "“这些士兵都是精锐中的精锐，总统阁下。”一旁的军事要员告诉道，“自您下达命令的那天起，他们就一直在这里接受训练。这些部队拥有最精良的武器，最老练的军官，最整肃的士兵。”要员环顾了一眼这个始建于旧民国时期的破落军营，又说道：“我很抱歉这里的住宿条件不尽人意，但想要隐藏起这么大一支部队除此之外再无他处了。”\n\n“无需自责，钟长官，你已经做得很好了。无需因任何事自责，你为中国做得已经够好了。”高宗武笑着摆了摆手，示意要员先行离开，眼睛目不斜视地看着面前一排排士兵踏着整齐的步伐行进在营房的大院里。这些士兵的单兵素质或许不如他们的日本对手，但当成千上万的中华儿女被征召起来，时刻准备着为祖国的自由流血牺牲时，个体的素质还重要吗？高宗武是觉得不重要的。\n\n部队在高宗武的前方立定下来，所有士兵同时转向他，靴子并拢发出齐刷刷的响声，手肘到指尖挺得笔直，顶在每个人的太阳穴上。“向！民国总统！致敬！”一名军官喊道，“向民国总统！致敬！”这一千名士兵跟着喊道，他们的声音震耳欲聋，撼动着脚下被蹂躏过的训练场。“向中国的救星！致敬！向祖国的救星！致敬！”这千人之声响彻天地，几乎要把镶在地上的鹅卵石给掀飞起来。“向！高宗武！致敬！！！”十年卧薪尝胆，终于苦尽甘来。他们的喊声似乎在说，一切都是值得的。"
 tnolar_chi.1.a:0 "未来会如何呢？"

 tnolar_chi.2.t:0 "世上事仍未了"
 tnolar_chi.2.d:0 "现代化成果表彰大会圆满结束，欢庆的氛围从南京城散去，喧闹一时的国府礼堂再次安静了下来，高宗武一个人来到了这里，他难得的给自己放了个假。\n\n此刻的他就像是个普通的慈祥老人，望着面前墙上挂着的巨幅照相画——一副是孙中山先生，一幅则是前总统汪精卫。两幅巨画在红色幕墙的映衬下显得格外的，格外的扎眼。作为一个曾经和日本人，现在也在和他们打交道的外交官，高宗武很清楚他们的贪得无厌，之前南京危机中财阀们的丑恶嘴脸，无不映射着这些提线木偶背后操控者的真实面目：所谓的泛亚主义本身就是一个天大的谎言，他打心眼里知道现在捧上神坛的汪精卫到底是什么样的人。\n\n高宗武又望向了另一边，只是一眼，他便挪开了自己的视线——他羞于去面对国父。国父曾经提出的“三民主义”已经被扭曲成了何等的不堪的歪理，而他也是首恶之一。他把民众送入钢铁巨兽的腹中，用枪炮屠戮自己的同胞，在日本主子面前摇尾乞怜，才得到今天第四个现代化的完成，假若万事只论迹不论心，那他毫无疑问就是中国的罪人，他百口难辨。\n\n高宗武看了下表，时间已经差不多了，他给自己放了36个小时的假，是时候重新回到岗位上去了。政府内部的纷争，国家的四分五裂，以及与日本军队的巨大差距可不会等他。高宗武不会再像40年前那样犹豫不决。这次为自由而战的事业不会不了了之。"
 tnolar_chi.2.a:0 "高宗武走出了礼堂，把门轻轻的带上了。"

 tnolar_chi.3.t:0 "假话真说"
 tnolar_chi.3.d:0 "“先总统是一位伟大的政治家，他为了维护中日友好和泛亚共荣圈做出了不懈努力…”，一位日裔教授在课堂上说道。自从他从日本来到国立中央大学讲授历史学，他就知道下面的学生大多是不会信的，但是他们也不会反驳，毕竟只要以此向上面报告，这类学生就会被开除学籍。能到这里来学习的都是聪明人，相信他们不会说什么，而他也乐意取消那些不愿意为共荣圈做贡献的人的受教育机会。\n\n可是这次不一样了，他没有得到他预期的沉默。起初下面只是很小的声音，像一条蜿蜒曲折的溪流，但很快，溪流汇聚成一条波涛汹涌的大江，最后。一个学生站了起来，他大声的说：“泛亚主义没错，可是在日本人的操纵下，泛亚主义的理想现在只剩下了戏仿，歪曲的可憎之物，而共荣圈也只是日本为了获得最大利益压榨中华人民所扯的幌子......”话音未落，另一个学生站起来说：“对的，日本还是中华民族统一的最大阻力，大家看我们的东北有日本扶植的满洲国，西南还有广东国，西北还有日本的西北军，还有台湾....中国目前的军阀林立和地方割据都是源于日本打着共荣圈的名义做的，它真的让我们共荣了吗?”\n\n“够了！你们想干什么，告诉你们，泛亚主义可是国策，咱们学校之前可不是没有人因此被开除？”教授想拿回主动权。可这时，又有一名学生站起来说：“高总统为了中华民族的复兴和统一做了这么多的努力，就是被像你这样的人和你们的主子日本阻挠......”，随着讨论的声音和人数越来越多，老师觉得他已经压不住了，他逃出了会场，他知道，这些学生已经踩了红线，他们是无论如何都保不住学籍了，自己只要向上打个报告，一切问题都将迎刃而解。\n\n然而，他又想错了，报告打上去了，然而结果却不是开除他们的学籍，而仅仅是一个不轻不重的批评，不久，他就被另一名中国的老师取代，离开了教学岗位。"
 tnolar_chi.3.a:0 "某些事情正在起变化。"

 #台北峰会

 tnolar_chi.10.t:0 "裂痕"
 tnolar_chi.10.d:0 "高宗武的工作没有休息日可言，每天都有堆积如山的文件要处理，都有浩如烟海的信件需要回复，尤其是在南京即将举办共荣圈峰会的这个时候，中国太需要这个机会向共荣圈和世界展现自己，为此他也已经好久没休息好了。而今天，一封盖着刺眼国徽火漆的信件送到了他的面前——这是满洲国的来信。\n\n高宗武虽然早有准备，但说实话还是有些意外，这样级别的外交信件居然没有任何的提前通知，作为老练外交家的嗅觉让他皱起了眉头。片刻迟疑之后，他还是拿起了拆信刀，展开了里边金丝绣边的信纸。\n\n“尊敬的中华民国总统——高宗武总统：\n\n作为大东亚共荣圈中诚挚的兄弟之邦，大满洲帝国代表共荣圈全体成员真挚的为你们所取得的辉煌成就感到欣慰。”高宗武拿着信纸的手略微颤抖，但很快他冷静了下来继续往下看。“共荣圈峰会按要求本应该轮替到贵国作为主办方，但最后考虑到本次会议的重要性，以及会议讨论内容的复杂性，共荣圈各国都认为，会议应当在台湾举办，特此……”\n\n高宗武放下了手里的信纸，下边的内容他已经不用看了，这是一个赤裸裸的下马威，或者更直接一些，这是不留情面的羞辱。但他更明白，如果说，民国内部没有人呼应的话，日本人是不会这么毫无顾忌的用这种近似炫耀的方法来直接羞辱自己，这封信，一定有人比他“先拿到”。\n\n高宗武苦笑了下，拿起了电话，他要和这些“朋友们”再好好聊聊，至少现在，他还不能和他们撕破脸面。"
 tnolar_chi.10.a:0 "政治游戏中，没有人可以信任……"
 tnolar_chi.10.tt:0 "下一届§e共荣圈峰会§!的举办地已被临时改换为台北。\n解锁国策§Y台北峰会§!。"

 tnolar_chi.11.t:0 "搭手"
 tnolar_chi.11.d:0 "紫金山脚下，国父陵下，高宗武从自己的专驾上迈下步子，来到了这个他曾为之神伤的地方。过去的理想，现实以及现在的牺牲与献祭，太多的往事思绪浮上心头，他提前了一个半小时到了这里，只是想散步走走，让自己能好好的理清自己的思绪。\n\n略蒙的雾气中，高宗武沿着中山陵的台阶一路向上，露珠沾上了他花白的头发，高宗武驻足在半山腰上，他羞于上前。当他转身向下时，看到了一个熟悉的的身影，那人带着帽子，脖子上裹着围巾，身侧夹着一本厚厚的文件夹。\n\n“希圣，你来得很早啊。”\n\n“你不也是？我这是老习惯了，每次写书倦累了也常来这里。”陶希圣笑着，两人并肩沿着台阶往下走。“高兄，倒是你怎么突然叫我来这里，虽然说我们最近也的确是很久没见面了，但最近南京峰会事务繁杂，我也是忙的满头晕”，说着，他加紧了腋下的文件袋“你也知道，我确实是不擅长政治，现在我也是想找个接班人，然后去国立大学当个老师。”\n\n高宗武望向陶希圣半笑着说出这些话，眼镜在清早的阳光下反射着微光，遮掩了他的眼神。他也用着玩笑的口吻回应：“怎么，你那些年轻学生们又惹你生气了，他们那么有活力，现代化他们出了不少力，这是好事啊。”\n\n“平时确实是好事啊，可也不知道哪来的消息说的日本人又插手了这次峰会，我那些学生们都跟吃了火药似的呛人，但你要知道，连我都不清楚这事儿，谁能说这事是真的？”\n\n两人走到亭子旁，匾额上写着“正气亭”。陶希圣坐在亭子的石凳上，放下了一直夹着的文件袋，从里边掏出来几封文件。“你知道的，我这边能知道的东西肯定不如你，但是的确是不少人都反馈给我这信息，我猜你也是知道了什么，所以我把这些带给你了……”\n\n高宗武没有接话，他把这些文件放在了面前的石桌上，眼镜后闪烁着陶希圣熟悉的狡孑目光。“希圣，这件事情我可以给你透露实情，但之后我需要你的一些帮助……”"
 tnolar_chi.11.a:0 "但至少，他还有这位能算得上真正朋友的人……"

 tnolar_chi.12.t:0 "再回首"
 tnolar_chi.12.d:0 "南京国立大学的学生们再一次聚集在一起，他们举着高高的标语横幅，或是青天白日旗，围在总统府门口，几位学生代表走到简单搭建的讲台上，痛斥着国内泛亚派和保守派对于日本随意更改峰会举办地这种羞辱性行为的妥协，要求高总统为国家尊严去进行外交斗争。警卫们在总统府入口出拉起了警戒线，远远的望着学生们在那里慷慨激昂。\n\n“泛亚主义，在二十年代初，曾象征的是东亚民族的解放，对西方列强奴役的反击，是东亚各国如兄弟般团结的美好愿景，但是现在呢？日本帝国的野心让这一主义蒙羞，这些骗子与暴君只不过是换了副面具，把这一理想主义变成了他们的对东亚各国敲骨吸髓的由头，无数百姓在旭日炙烤下化为枯骨！”\n\n学生代表们的演讲声穿过总统府大门，穿过室内的走廊，穿过办公室的玻璃窗，传到了高宗武的耳朵中。但他只是继续手头的工作，似乎外边的乱象和他一份关系都没有。警卫部长忧心忡忡的走到办公室门前却又被秘书以事务繁忙给拒之门外。\n\n突然不知是窗外哪个学生突然喊道：“卖国贼！张仁蠡！张仁蠡下台！”“打倒卖国贼王荫泰！”本来就如同火药桶的会场瞬间被口号点燃了，领头的学生代表根本控制不了现场的局面，学生们开始高喊着口号向着总统府大门涌来，警卫们立刻拦了上去。双方之间爆发了肢体冲突，这让情况更加的严峻，有人喊出“高宗武也是卖国贼！”“国贼高宗武！”，开始朝警卫扔水瓶和石头，警卫则拿出防暴盾牌和警棍。此刻高宗武终于是从座椅上站起来，给玻璃窗户打开了一条缝，望向窗外的混乱场景，几个学生代表已经被制服按在了地上，更多的学生则是被警卫逼退，场面依旧是一片混乱。\n\n高宗武抿了一下嘴角，回到办公桌前，把刚刚写好的信件盖上私人印章，封进早就准备好的信封里。\n\n今天要寄出去两份信，有两位“朋友”要应约而来。"
 tnolar_chi.12.a:0 "“朋友”多多益善，一时的也可以……"

 tnolar_chi.13.t:0 "自污"
 tnolar_chi.13.d:0 "周佛海在自己保镖的护卫下，钻进了自己的专驾中匆匆离开了总统府，车还能没启动，学生们就围了上来。司机连忙踩着油门鸣笛带着这位权重位高的大人物逃离了愤怒的人群。高宗武则从窗口的缝隙中望向外边，他还在等着另一位“贵客”上门。\n\n不一会，更刺耳的汽笛声响起，总统府门前卷起一阵尘土，一列车队停在了总统府前，从车上下来了大队执行委员会的特工，这群恶名昭著的人渣把冲锋枪的枪口对准了学生人群，高宗武的警卫们连忙全副武装的挡在了他们面前，把学生们从这群人面前隔开，另一队则是高度警惕的盯着这群恶犬。\n\n一辆豪华的丰田轿车终于不紧不慢的停到了面前的广场上。看起来慈眉善目的老先生从车里走了下来，他整理了下自己的礼帽，回头对学生们面带微笑，点头致意。这行为让学生们敢怒不敢言，因为面前是真的有枪口对着他们，也就只能看着在他们眼里“人人得而诛之”的大汉奸张仁蠡在身边两位护卫的搀扶下走进总统府。过了差不多半个多小时，这位亲日派大佬才从楼里出来。这时他脸上早就没了刚开始的笑容，脸色铁青脸上肌肉紧绷，头也不回的坐进车里离开了。高宗武则是目送这位“朋友”的离开，满意的坐回了自己的办公椅，收起了自己桌上之前陶希圣给他的文件。\n\n所以，这就是他的方案，所谓的政治上的清白人士是不存在的。高宗武只是托好友陶希圣帮了个忙。维新派在学生中的基础相当深厚，只要有人以维新派内部的名义放出风声，年轻气盛的学生们就会自发行动起来。高宗武不需要把自己从这次峰会事件中择干净，而是要自己去趟这潭浑水，顺带把保守派以及亲日派也拉下来，虽然这就要苦一下自己的好友了，至少之后这段时间内，另外两派是肯定会重点照顾他。\n\n但他的目的达到了，现在在台北峰会这件事情上，三方势力达成了难得的真正共识——这个黑锅大家要一起背，至于和日本人私下联系勾连密切这件事，暂时高宗武愿意睁一只眼闭一只眼。亲日派作为交换需要和日本人尽量争取更加有利于中国的条件，毕竟他们一直举着“泛亚主义”的旗号，高呼亚洲兄弟的珍贵情谊，而保守派则是要动用自己在商界的强大资源，用金钱的力量影响日本人的决策，之前吞下去的东西总该吐出来点。\n\n窗外的学生们不再喊口号，他们只是保持着沉默，高举着自己的标语和国旗。高宗武叹了口气，拿起了手中的电话。"
 tnolar_chi.13.a:0 "“接一下警察厅……”"

 tnolar_chi.14.t:0 "真假参半"
 tnolar_chi.14.d:0 "整个南京城的高校学生们都行动了起来，各个政府行政楼前都围满了游行人群，这次他们没有像之前那样急躁，而是就那样保持着沉默，他们无声地站立在那里，举着手里的标语。围在南京警察厅的人最多，从今天清晨一直站到了黄昏时分，不少学生都因为劳累和饥饿晕厥了过去，被在一边等候地救护车送去医院。守卫们站在门口，头盔在落日下反射着昏红色光芒。\n\n太阳落下了山，消失在了紫金山后，星星们逐渐爬上了天空，这在逐渐现代化的金陵城里是难得一见的。路灯亮起，照亮了这群学生们明亮地眼神，他们不达目标绝不屈服。\n\n一辆轿车开着大灯驶来，车头插着民国国旗。不少学生开始喊道“高总统来了！”学生们凑了上来，看到车上后座坐的正是高宗武。拥挤地人群让专车不得不停了下来，学生们急切地眼神直直地射向高宗武，他们希望总统能为他们说话，而高宗武对此做出了回应。\n\n他打开了车门，走下了车。警厅守卫立刻拨开人群想要护住他，但最后却看到这位老人挥了挥手，让他们散到了他背后。高宗武清了清嗓子，开始对这群已经焦躁不安地学生们讲话：\n\n“同学们，同学们，我知道你们很愤怒，实不相瞒，我也很愤怒。”高宗武往学生们更靠近了些，“我是第一个拿到这封邀请函的，说实话，我甚至希望我从来没碰过这封信。这封信里充满了日本对我们的冷漠和轻视。在这几年里，我们的国家成长为了共荣圈的骄傲，我们都认为能够获得所有人的尊重，但事实告诉我，我们错了。”\n\n高宗武顿了顿，他看到学生们眼中的怒火，那是对国家收到不公待遇的怒火，他们的手正因这怒火而用力握紧发抖。他叹了口气继续说：“但我希望同学们能冷静些，再冷静些。先总统汪兆铭曾说过，泛亚主义是为了让亚洲兄弟们团结一心，摆脱欧美列强的欺凌，他的理想在这些年已经得到了证实，虽然道路曲折，但我们确实实在没有西方殖民的情况下完成了自己的现代化。这证明这种独立自主的道路是没错的，我想我们也应当继续走这样的道路。”\n\n高宗武环视周围，提高了自己的声音：“国家听到了你们的声音，我也保证，政府会全力的去争取，争取一个我们应得的位置，争取为我们的辛勤劳动得到一个公允的评价，争取为这个国家迈向一个更好的未来！”\n\n“而我对同学们……”高宗武放低了声音，用长辈对后生的温柔语气说道：“我希望同学们可以把人生放在更有意义的地方，爱国之情更应该落实到为国建设的地方，你们是国家未来的希望，是栋梁，一时的冲动解决不了问题，未来应当由你们创造！”\n\n话音刚落，警察厅厚重的大门打开了，那些被捕的学生代表们走了出来，他们身上的衣服干净，之前被按在地上磨破的脸也做好的处理，他们看到了门口欣喜的人群，也看到了等候已久的总统先生。学生们爆发出了欢呼，涌向这些重获自由的英雄。高宗武则是在人群的欢呼中重新登上了专车，在学生们的感谢和爱戴中离开了这里。"
 tnolar_chi.14.a:0 "政客的话语，永远是半真半假的，但他的确怀着真心……"

 tnolar_chi.15.t:0 "登机"
 tnolar_chi.15.d:0 "高宗武登上了前往台北的专机，在引擎的轰鸣声中，他望向窗外看着地面灯光越来越小，最后消失在云层中之下。这次台北之行他已经有了心理准备，作为过去在中日之间斡旋的外交官，有两点他很清楚。第一，任何政客的口头承诺都不要相信，一切要以落实实处为准；第二，如果外交能解决问题那一定是因为外交之外的因素决定的。\n\n所以，他对这次峰会不抱任何希望，对保守派和亲日派的承诺只当放屁，但他又需要这群人作出承诺，因为政治家和平民眼中的承诺是两码事。他要让人们相信，高宗武总统已经竭尽全力为国家争取尊严。把自己拉进泥坑更是为了踩着被他拉进来的人爬出去。\n\n南京危机已经让高宗武对于日本的最后幻想破裂了，或许在此之前他还对所谓的和平崛起抱着一丝希望，但在那之后，他意识到，中国如果想要自由，只有通过战争彻底砸碎自身枷锁这一条路。\n\n但现在中国需要时间，需要动员，需要不论日本是否承认，中华民国已经成为了共荣圈中第二大经济实体和第一大工业实体，就算再不情愿，为了维持共荣圈的平衡稳定，日本最后还是要做出部分让步来缓解矛盾。\n\n飞机在逐渐下降，穿过云层，他看到了灯火通明的台北，一种难以言喻的心情涌上高宗武的心头，这座见证了中国近代屈辱历史的城市，或许难免再见证一次……\n\n飞机终于落地，等候多时的乐队奏响了维新国歌，高宗武走出了机舱，昏暗的天空低沉的压在他的头顶，日本外相正走来迎接他。"
 tnolar_chi.15.a:0 "有时不抱希望才是最好的选择。"

 tnolar_chi.16.t:0 "再低一次头"
 tnolar_chi.16.d:0 "在日本国歌《君之代》的乐声中，共荣圈的各国领导人纷纷走进陈有巨大回型会议桌的会议室，来自全世界的记者举起他们的长枪短炮发出闪光，这次峰会的规模前所未有。很明显，大日本帝国希望用自己全新的开放外貌向世界展示共荣圈建设的成功。\n\n日本帝国首相与各个共荣圈成员国的领导人们亲切的握手，当高宗武走来时，两人的目光在空中猛烈地交错了一轮，双方都清楚，自己今天真正的对手是谁。不到数秒的僵持后，最后还是高宗武低下了头，他略微弯了腰，向面前这位“共荣圈之主”的领导人主动伸了右手。记者们的摄像机敏锐地抓住了这个镜头，一阵快门声响起，日本首相在这阵快门声消散后才慢慢地伸出了自己的右手，脸上依旧带着微笑——傲慢的微笑。\n\n随着各人落座，共荣圈中的外交地位可见一斑。共荣圈的主人：大日本帝国正坐在面对着记者们的正中间位置，身边两侧是广东国的行政长官以及满洲国的执政官，然后是自由印度总理，之后才是中华民国的总统高宗武。\n\n大厅中的音乐逐渐安静下来，现场的影像正在通过摄像机传向世界各地，高宗武面带微笑望着摄像头。"
 tnolar_chi.16.a:0 "他现在所能做的也只有于此。"

 tnolar_chi.17.t:0 "第一轮"
 tnolar_chi.17.d:0 "随行秘书打开了下榻酒店的灯，接过了高宗武的外套挂到了衣架上。茶桌上的热水壶是从美国舶来的产品，刚刚加满水开始启动。高宗武坐到了办公桌前，接过秘书递来的厚厚的会议纪要。\n\n今天的会议内容，说实在的，没有什么可以反对的。而对于高宗武的心理预期来说，内容稀松平常。会议内容主要包括了共荣圈内部设立发展基金会以及加强各国民间交流的内容。发展基金会由各成员国根据其经济体量提供会费，用来资助发展落后的国家建设基础设施。同样的，民间交流协会也和上个议案类似，主要加强各部民间文化和科技交流。共荣圈的小国们都非常支持这两项提案，中国也没有理由反对。在这些新机构中，中国也可以占据相当重要的地位。\n\n高宗武摘下了眼镜，揉了揉有些昏花的双眼。明天还有第二场，他希望也能像今天一样顺利。"
 tnolar_chi.17.a:0 "但他知道这不可能。"

 tnolar_chi.18.t:0 "第二轮"
 tnolar_chi.18.d:0 "高宗武拿过秘书手里的记录本，这个年轻人工作能力很强，今天会议上所有国家的提案，每个代表的发言乃至神态都做了详细记录。高宗武打开了桌头台灯，眯着眼看向这些密密麻麻的字。\n\n“总统阁下……实在抱歉，我的字写的太小了，如果可以的话我能跟您直接复述吗。”年轻的秘书有些胆怯，高宗武笑了笑，把笔记递了回去：“小张，那就按你的想法来，跟我好好分析下今天这个会开的结果。”\n\n“好的，总统阁下！”年轻人打起了精神，开始翻开笔记本，“今天这场会议是对未来共荣圈具体经济分工以及政治体系的讨论。目前共荣圈内的经济体系依旧是日本在大多数产业中占有大头，尤其是高精尖产业。我国现在主要占有优势的是劳动密集型产业，这就让我们和共荣圈的其他国家产生了实际上的贸易冲突。日本提议对我国产品提高关税同时降低其他国家关税，实际上就是在压缩我们的市场空间和发展前景，同时来拉拢像自由印度，柬埔寨以及老挝这样需要日本产业转移的国家……”\n\n高宗武点了点头，示意他继续说下去。“关于政治格局方面，日本方面其实是有意在提高满洲以及广东的地位，尤其是广东，很明显是想从一个经济特区认证成为一个独立国家，这很明显实在刻意压制我国的外交地位。”\n\n“总统阁下，根据我的观察，外交状况其实对我们比较严峻，因为日本其实是通过切割我们的利益来满足其他国家。除了泰国以及自由印度没有表示什么直接意见，其他国家已经是基本默许了这个方案……”\n\n高宗武点了点头，这个年轻人很聪明，也很敏锐，但还是不够老练。“稍微准备下就休息吧，之后还有第三轮。”"
 tnolar_chi.18.a:0 "尚未图穷匕见。"

 tnolar_chi.19.t:0 "第三轮"
 tnolar_chi.19.d:0 "随着投影胶片转完了最后一格，会场的大灯再次亮起，日本首相露出了满意的笑容。刚刚播放的就是新时代的日本帝国军队军事演习的录像，先进的装甲部队与呼啸而过的喷气机协同配合，在预定的战场上势如破竹。海军巨舰上的大炮喷射着烈焰，舰载机成群从航母甲板上起飞。这样震撼的场面让在场所有人都默不作声。\n\n最后还是日本首相先打破了沉默，他提出一个计划——“共荣圈共同防卫协定”，旨在由日本指导帮助共荣圈的兄弟国家建立可以在战时统一指挥的现代化军队，而且这些资金同样可以从发展基金会中借取无息贷款。这个条件对于在场所有国家都是绝对的诱惑，所有人都开始交头接耳，如果可以轻松建立一支类这样的部队，那么再多代价也都可以考虑，而且……\n\n几乎是同时，各个国家的目光都望向了高宗武，和他代表的中华民国，那种巨大的压力几乎是要将他碾碎分食，但他还是稳稳地，微笑地坐在那里。\n\n“所以，高宗武总统，您的意见是？”日本首相微笑着问出了所有人的问题。"
 tnolar_chi.19.a:0 "“中方会保持共荣圈的统一立场，我们赞成这个协定。”"

 tnolar_chi.20.t:0 "斡旋"
 tnolar_chi.20.d:0 "整个中国外交团队都很沮丧，虽然他们中的许多人已经做好了铩羽而归的思想准备，但如此恶劣的外交形势是之前没有预料到的，所有人在会议室里听着窗外瓢泼的雨声，雨点砸在玻璃上，仿佛就是宣判着他们失败的倒计时。\n\n高宗武看着面前这些个都很年轻的外交官，轻轻的敲了敲桌面：“还没到泄气的时候，各位外交官们，”他不算洪亮但中气十足的声音给所有人打了一剂强心针，大家都看向这位国家元首，虽然形势严峻，但他依旧是带着微微的笑容。\n\n“各位在会议流程中已经很清楚，日本人是通过对我们国家利益的切割来满足其他小国，这就是我们的操作空间。”高宗武扶了下眼睛，拿起面前的电话听筒，指了指“如果我们可以直接给这些国家更多呢？日本人可以给五，我们就可以给十，十五，二十，拿出我们的诚意，就算吃了亏，也要从其他地方找补，给足日本人压力。”\n\n团队中的每个人都看到了这个老人眼镜镜片之后掩盖的烈火，人们立刻行动起来，电话接线声以及各种外语交杂在一起，随后外交官们一个个的走出门口前往与各国团队会面。高宗武听着窗外的雨声越发急促，就像是战鼓在隆隆作响。"
 tnolar_chi.20.a:0 "没人会坐以待毙，至少在三十年前他就明白了这个道理。"

 tnolar_chi.21.t:0 "落定"
 tnolar_chi.21.d:0 "高宗武最后还是微笑着，拿起手中的钢笔，代表中华民国，在这份极具羞辱意味的协定上签了字。他已经可以想到日本人得意的狂笑，满洲国和广东国代表讥讽的眼神，还有那些其他共荣圈国家既害怕又兴奋的表情：他们所有人都想从中国的发展成果中分一杯羹。而这就是共荣圈的真相——一个最巨大的饿虎带领着手下似人非人的伥鬼啃食尸体的浮世绘。\n\n但现在这一切都将赤裸裸的公之于众，哪怕日本人再怎么粉饰所谓的“共荣圈兄弟论”，在新一代中国人的心里，他们都将是彻底的敌人。那些高额关税需要从广大的劳动工人身上克扣，那些支援共荣圈各国的粮食也要从刚刚温饱的农民手中抢夺，高精尖科技岗位对于许多大学生来说再无机会。他很庆幸自己已经提前做好了准备，让国内即将爆发的政治风波尽量远离自己。这一次峰会将中国推向了整个共荣圈的对立面，日本人的意思很简单：要么臣服，要么就成为公敌。\n\n但这一切真的就是那么牢不可破吗？高宗武签完字，面带微笑的抬起头，望向坐在环形会议桌的每一位代表，老练的外交本能让他还看到了更多。那是对于日本深深的恐惧，以及愤怒，今天是中国，明天会不会是我呢？但很多国家也就是抱着得过且过的心理不再去想罢了。\n\n高宗武面对闪烁的照相灯深深地鞠了一躬，无数围在电视机前的中国人都看到了他们总统的行为，许多人的怒火都被点燃了。"
 tnolar_chi.21.a:0 "这不仅是外交礼仪，也是一种歉意……"

 tnolar_chi.22.t:0 "爆发"
 tnolar_chi.22.d:0 "中华民国自1949年和平建国之后，从未有过这等混乱的状况。大大小小的民间企业开始停止营业，从工厂主到工人无需组织就自行开始罢工，商界代表们纷纷前往经济发展部请愿，要求抵制这次不公平的贸易政策；学生们也开始罢课，和工人们一起包围了日本大使馆。农民们停止了年复一年的耕作，他们甚至有的已经开上收割机聚集到了各地的农业公司要求停止农产品降价。\n\n立法院门口聚集了大批群众，他们有着不同的诉求，但今天都是为了一个目的而来的——废除《台北峰会协定》。中国人向来是最能忍耐，最吃苦耐劳的，但是在辛苦劳动后却被人变本加厉的剥削是所有人都不能忍受的。哪怕是只能分得部分残羹也好，但现在，有人却想连这些残羹也不留给他们。人们希望民国政府能够站出来，哪怕不是彻底废除，就算是抵制一下也好，至少让他们看到个态度，看到点希望。\n\n但立法院里的达官显贵在干嘛呢？保守派赚的盆满钵满：他们咋走就开始怎么盘算着从一系列条款中大发横财；亲日派也对协议很满意：他们借着自己主子的手狠狠地抽了高宗武一耳光，在政治上和保守派结盟，重新占领了高地。维新派则是陷入了内部的巨大争斗中，激进派与缓和派争得不可开交，短时间内再难达成共识。\n\n所有人的和善面纱在这次峰会后全部被撕扯得干干净净，任何明眼人都能看见中国内部的巨大分裂。作为中华民国总统的高宗武现在在干嘛呢？他在自己的办公室里默默的继续着自己的工作。日本人为了表达所谓的“泛亚共荣思想”，在从中国身上剜去许多血肉后还是给了一些补偿：包括名义上的“支持统一”以及在指导下建立“新式军队”的机会。既然有了这个机会，高宗武就不会放过，所有条件都已经成熟，他终于可以开始推进“五个现代化”中的最后一个，也是最危险的一个了。"
 tnolar_chi.22.a:0 "福兮祸之所倚，祸兮福之所伏。"
 tnolar_chi.22.tt:0 "§Y国策树将变化……§!"

 #中国再武装

 tnolar_chi.100.t:0 "重塑军队"
 tnolar_chi.100.d:0 "南京国民政府的军队状况十分堪忧。军纪基本上成为了摆设，虽然建立了纪律纠察队，但是他们总是睁一只眼，闭一只眼，对违纪行为不闻不问。军队中的腐败现象屡见不鲜，军官们利用自己的职位捞的盆满钵满，个个吃得肠肥脑满，不问事务。除了部分精锐部队，很多编制严重缺乏日常训练。军队的战斗意志十分脆弱，士兵几乎人人恐惧战争，根本没有为国而战，为国捐躯的觉悟。\n\n军用技术的发展也处处受到了日本的限制，他们只愿意卖给我们已经淘汰了的落后设备，尖端的技术根本不愿意与我们分享，假如我们打算自主研制就会遭到他们的强烈反对，甚至让我们的科学家凭空消失。\n\n不同兵种之间也存在着巨大的差距。日本派来的军事顾问只想把我们的军队打造成他们的仆从军队，因此陆军在被限制数量的情况下得到了基本的现代化，空军却因缺少支持和装备止步不前，更不用提需要全国之力发展的海军了。\n\n只要我们追求独立和自由，那就必须拥有一只强大的军队的，更何况我们试图摆脱的是世界上最强大的国家之一的控制，我们必须成为能与之匹敌的力量。到时候，猩红旭日和自由白日同天争辉，最后必定只能有一个胜利者。\n\n尽管我们的军队被处处受限，我们也要全力推进军事现代化。我们就像是一个戴着脚镣的舞者，在聚光灯之下翩翩起舞，我们不能停下，否则中国将永远无法自由。"
 tnolar_chi.100.a:0 "我们必将挣脱全部的枷锁。"

 #国企订单
 tnolar_chi.101.t:0 "中间休息"
 tnolar_chi.101.d:0 "时针一跳到两点的格子上，电喇叭里就响起来“当当当”的响动，声音很吵，不过车间里忙活着的工人们倒是像期待已久似的，纷纷停下了手里的事儿，抬头往声音来源望去。\n\n “大伙休息十分钟，该解手解手，该抽烟抽烟，到点儿继续上工。”陈领班按着规章，把这句大家都喜欢的话播报出去，就往裤兜里掏出包精制卷烟，攥在手里往门外面快步出去了。\n\n “哎，陈领班，您要火不？”刚一踏出车间门，左边就传来了个声音，他下意识扭头看过去，是刚来几天的小张正捏起根火柴，有点讨好似的向前微微俯身，面上带着笑。“你小子故意等我的？”老陈把烟咬上，笑骂了几句才凑上去让他给自己点烟，等烟一燃，他便深吸口气，过了几秒才吐出一团烟雾。\n\n贵确实贵点，跟便宜的就是不一样，劲儿挺纯，老陈这样想着环顾四周。他班上的工人们三三两两地聚在一起，在烟雾缭绕之间有一搭没一搭地小声闲聊着。即使在门外已是午夜，车间内的石英灯光线也依然照得亮如白昼。视线一收，老陈竟发现小张想把火柴扔地上踩灭，慌忙抬手一把拦下来，拿指头反复碾灭几次火苗后，才扔进装满水的水桶里面去。\n\n“你小子下次再这样，就扣你一天班钱。”看着对方点头如捣蒜的样子，老陈才缓和了语气，“厂里头不能随便扔这种东西，你也知道自己造啥呢，不想带着大家和厂子一起被炮弹炸飞吧？下次不能这样了。”语罢他挥挥手，如蒙大赦的小张便赶忙跑开解手去了，看着他的背影，老陈席地坐下来，就着吞云吐雾叹了口气。\n\n一个月前老陈才当上的领班，这之前他已经做了十来年技术工了，近来工厂扩招扩产，才给他机会。不过他干得确实不错，借着十几年的经验加上严格但和善的作风，把自己这班带得也算井井有条，手下人也喜欢他。\n\n但对他来说哪怕离开了流水线，工作也没变得轻松。因为主管天天都提高质量要求，搞得老陈总是要到处检查，没少气得直骂娘。不过随着工人们越来越熟练，像刚开始那样几条线轮着跑的窘境总算不用再经历一次了。\n\n他正神游，手上突觉一阵灼痛，赶忙往水桶里把手一扎扔掉了那点烟屁股，站起来拍拍衣服，招呼一嗓子，叫工人回岗。"
 tnolar_chi.101.a:0 "工还没做完呢。"
 
 #全面逆向
 tnolar_chi.102.t:0 "拿来主义"
 tnolar_chi.102.d:0 "小赵从高中起就一直觉得，中国要进步，就应该独立发展自己的科学技术。\n\n以优秀的理工专业成绩获得大学学位后，小赵顺利进入一家军工国企就职。这份工作确实让他和父母的生活得到很大改善，但每天只是对外国设备进行逆向而已，仅仅经过了数月，辞职的念头便纠缠起他来。\n\n 所幸小赵一直保持着读书报的习惯，可以给他的精神带去些许放松。今天趁着休息时间，他如往常般翻开一本新周刊，首页便是篇讲为什么要引进各种国外技术的社论。“引进”，多好听啊，他暗自发笑。不过出于尊重，他还是选择读完这篇每段都以引用开头，十分符合写作主题的文章：\n\n“中国一向是所谓‘闭关主义’，自己不去，别人也不许来。”——小赵被简单的几个字震住，似乎有什么东西被触动了似的脑中略有些发麻，没有停顿地挪动视线，像只恨自己少长了眼睛一样。他不认识自诩太阳而发疯的狂人尼采是谁，但倒是认可中国确也不是太阳...这时候，他环视一圈身边产自日本的精密科学器械，又低头看起文章。\n\n “……先有英国的鸦片，德国的废枪炮，后有法国的香粉，美国的电影和各种小东西。”有点奇怪，他微微皱眉，感到句子似乎少了些内容。随后又想起近期送到实验室，需要加班加点分析的一批来路不明，写有英文或德文的设备。\n\n “所以我们要运用脑髓，放出眼光，自己来拿！”——绝！小赵不禁拍案。实验室里的其他人都被他吓到，纷纷投来略显微妙的视线。他却全然不在乎，全身心都折服于这些句子的力量，好像是一种呼声，不似一只手帮他拨云见雾，而是让他自己渡过迷津。没错，拿来！\n\n 文中写了一个穷青年，让这位青年先拿一座大宅子；旋即又痛骂起这个穷青年可能做的种种行为，大斥昏蛋，废物。小赵面上发臊，但又不得不承认说得没错，确实如此。只是文章又说：\n\n “‘拿来主义’者是全不这样的。 ”——那会怎么样呢？这个穷青年吃了宅子里有的“鱼翅”，只因为有营养；又说把大烟送去有益的用处，再砸了烟枪；最后送走成群的姨太太，说“要不然，‘拿来主义’怕未免有些危机。”最后又讲，能够让人成为新人，让宅子成为新宅子，是因为这个“拿来主义者”沉着又勇猛，能辨别，不自私。\n\n小赵若有所思，一直盘旋在他脑中的辞职念头，随着阅读已然烟消云散了。"
 tnolar_chi.102.a:0 "现在积累智识，是为明日头脑的自由。"
 
 #日企订单
 tnolar_chi.103.t:0 "日本之行"
 tnolar_chi.103.d:0 "“陶先生，仅仅是和三菱重工的负责人谈话，没必要劳烦您和我们跑一趟吧。”\n\n外交部长陶希圣摆了摆手，指了指秘书膝盖上的公文包说道：“你们手里拿的这些方案，看起来像是一笔笔简单的国际贸易，但这些方案的内容我担心你们处理不好。”\n\n秘书还是有些不安，“您今年都已经六十多岁了，和我们这些小辈一起到处奔波，万一您有了什么闪失，我们不好向高总统交代啊。”\n\n“他也会理解我的，你们放心就好了。”陶希圣让秘书撑起伞，车外三菱重工的负责人大宫英明已经前来迎接。双方微笑着前往会议室开始磋商。\n\n大宫英明在半小时里把方案翻来覆去地看了好几遍，眉头紧皱，脸色阴沉。秘书心中七上八下，忐忑不安，再看向陶希圣，却依旧四平八稳，笑容不改。\n\n在尴尬而又危险的三十分钟之后，大宫英明终于放下了那份方案，看向了外交部长。“陶先生，您能解释一下贵国为什么需要这么多的工业承建项目吗？现在的国际形势搞国际投资可不让人放心啊。”\n\n“贵企可能仍有忧虑，但我还是想向您说明几点。中国在高宗武总统的带领下取得了喜人的现代化成就。相比较于东南亚的国家，我们的技术产业工人数量多，质量好，更能熟练地应用各种工业机械，这是优势之一。”\n\n“我们完成了工业现代化，更能满足各种大型工厂的电力供应——我想这件事情您也应该有所耳闻，毕竟贵国的电力一大部分都是从我国购买的。”\n\n“我国空闲土地能够满足工厂的建设要求；自然资源丰富，能够满足原材料需求。更重要的是我们的军队数量庞大，刚结束的共荣圈峰会上你们的首相也给予了我们采购日本装备的权限。有这么多的优势，我想不可能不考虑一下吧。”\n\n大宫英明听完还是一言不发，陶希圣立刻心领神会，指了指四周。众人纷纷离开会议室，只剩下外交部长和负责人二人留在这里。\n\n陶希圣从西服衣袋里掏出另一份来，放在了桌子上，推到大宫面前。\n\n“这是一份秘密的协议，大宫先生，我想上面的数字会让您满意的。”\n\n负责人拿起支票看了看，脸上紧绷的表情瞬间放松下来，那么高的“额外补贴”和“返利”放在谁的面前都会心动，思考片刻后，大宫只能回复说还要考虑考虑，这种大单董事会中他是没法一言堂的。\n\n会面结束，陶希圣觉得自己之前的口舌有些浪费了，不过还是有些作用的。不过他更希望自己的老伙计高宗武以后更加小心谨慎一点，别被人抓住了马脚。"
 tnolar_chi.103.a:0 "一次愉快的旅行。"
 
 #复兴黄埔精神
 tnolar_chi.104.t:0 "高宗武总统在中央陆军军官学校毕业典礼上的讲话"
 tnolar_chi.104.d:0 "恭喜你们，年轻的军官们！经过在中央陆军军官学校这个革命的摇篮数年的学习，在今天你们均以优异的成绩毕业了。今后的日子里，你们将作为国军的新鲜血液被输送到全国各地，在你们擅长的岗位上散发着光和热。但在你们离开学校之前，我还想再教给你们一些东西，与军事无关。\n\n各位在这里学习数年，肯定非常熟悉学校大门彩楼两旁挂着的那副对联——“贪生怕死请往他处，升官发财莫入斯门。”横批为“革命者来”。\n\n这副对联我念出来各位都会觉得十分熟悉简单，可要是认认真真地做起来，落实到日常战斗生活的点点滴滴当中时，各位还会觉得简单吗？并不见得。有的同学甚至要骂我：“高总统，你身为一国首脑却胡说八道，真是可笑。”同学们都觉得，升官发财、珍爱生命天经地义，反对这两条真理者，理应天诛。\n\n庄子曾讲过：“如使人之所欲莫甚于生，则凡可以得生者何不用也？使人之所恶莫甚于死者，则凡可以辟患者何不为也？”贪生怕死，追求财富乃是人之常情。但是问题在于，帽子上的白日，它赋予你的职责允不允许你贪生怕死，肆意求财。军官是部队的榜样。在战场上只顾自己，战况稍有不佳就撇下自己的部队仓皇逃命，在后方花天酒地、收受贿赂、结党营私、贪赃枉法，久而久之士兵也会有样学样，贪生怕死，花天酒地，整个军队就会腐化，堕落，丧失战斗力，在未来即将到来的战斗中一触即溃，重蹈覆辙。\n\n你们在几年的学习生涯中已经学会了黄埔精神中的五个词——“牺牲、团结、负责、奋斗、奉献”，但对于你们未来的服役生活，我还要送给你们另外两个词——“爱国、革命”。爱国，卫国是各国军人之天职，也是各位做人的根本，我不必多讲。革命则是我们不同于其他国家军人之处。孙中山先生建立国民革命军的初衷就是要打造出一个国民革命的先锋，去击碎所有阻碍和敌人，实现三民主义；先总统汪精卫则建立了和平建国军，领导中国成为泛亚革命的先驱。所以希望各位在日常生活中不仅仅以一名军人自居，更要认识到自己是一位革命者。大家要记住孙中山先生在黄埔军校开学典礼上的训词——“我们要把革命做成功，便要从今天起立一个志愿，一生一世，都不存升官发财的心理，只知道做救国救民的事业。”\n\n谢谢大家。"
 tnolar_chi.104.a:0 "去矣男儿，切莫踟蹰，矢志复兴民族。"
 
 #青天之下
 tnolar_chi.105.t:0 "一堂课"
 tnolar_chi.105.d:0 "中央航空学校没有大日本帝国航空兵那些优秀的资源，就连学员都是从各个地方选拔出来的航空爱好者和学生，他们中的一小部分只开过双翼机，更多的只是空有一腔热血。被反聘回来担任教师的老飞行员很担心，当这些后辈飞向蓝天时，他们的壮志是否会被残酷的战争打得粉碎？\n\n可当他站在讲台上看着那一张张年轻而又充满活力的脸庞时，他之前的想法又有些动摇了。他心中残存的一点点热血在欢呼，在告诉自己，这便是中国空军未来的希望和精英，他应该把自己的毕生所学教给他们。\n\n但他知道，当年自己驾驶着哲生战斗机和日本航空兵缠斗的时候，靠的是技术，是在航校学到的所有知识，却也不仅仅是这些知识，还有着其他的东西在支撑着他。如果不把这个重要的东西交给他们，那么空有技术，怕是不足以御敌。\n\n在课堂上，老师提出了这么一个问题——“谁知道美利坚f104战斗机的机炮弹药数量和挂载弹药数量？”\n\n“20毫米M61“火神”6管炮，备弹量最多为750发，可挂载一枚AAM-1空对空导弹。”几乎是异口同声，教室里的学生准确无误地回答了问题。\n\n“不对，再想想。”老师摇了摇头，看着学生们。\n\n学生们纷纷翻开书本寻找答案，但书本上的答案和他们说得一字不差，同学们不明白老师葫芦里卖的什么药。\n\n“725枚机炮弹药，四枚空对空导弹。”老师顿了顿，看着台下惊讶的学生们，“当任务尚未完成，而你的弹药消耗殆尽时，你就是那枚飞向侵略者的导弹或者机炮子弹。”"
 tnolar_chi.105.a:0 "凌云御风去，报国把志伸。"
 
 #碧波之上
 tnolar_chi.106.t:0 "起锚"
 tnolar_chi.106.d:0 "早晨六点钟的东海海面还没有完全醒过来，只有稀稀拉拉的几艘船飘在水面上。海天线下太阳缓缓升起，阳光下的东海波光粼粼。中央海军学校的一年级新生们，早就握着船桨，坐进木船里了。这与他们想象中的军校生活大相径庭，有的人开始不满意地小声嘟囔起来。\n\n“我将来可是要指挥军舰的，怎么能坐在这里划小船？”\n\n坐在船尾的军官选择性忽略了这些抱怨，直接下达了命令。\n\n“解开系船绳！”\n“全体都有！划船！”\n\n这些学生都是从城里来的孩子，几乎都不会划船摇橹，让他们划船航行，其难度无异于登天。不出所料，几艘木船只是原地打转，未能前进一步。\n\n这些新生们拼命地摇着船桨，可就算他们忙得满头大汗也毫无成效，在船尾坐镇的教官终于忍不住了，他举起扩音喇叭，大声地吼着。\n\n“如果你们连一艘小船都不能轻松掌握，还谈什么指挥军舰？又怎么好意思吹嘘自己是海军军校学生？一艘军舰的正常运行，作战，绝不依靠舰长一个人，而是要全舰的同袍们通力协作，各司其职！你们现在划船都乱作一团，各自为政，以后在军舰上只会更加糟糕！黄埔精神中的‘团结’二字都被你们丢在脑后了吗！”\n\n黄昏的时候，码头上的工人们看见几艘小船伴着晚霞一同归来了。可惜逆着夕阳，看不清船上的人。几艘小船一字排开，队列整齐，速度也很快，像一只只水鸟掠过水面。工人们向他们挥手，小船里的船员也立桨回礼。如果仔细听，还能听见他们欢乐的歌声。\n\n“伙伴们，起锚了\n起上大铁锚！\n学校的生活已过\n启航在破晓！\n在破晓！\n昨夜晚在岸上，\n快乐又逍遥！\n再会吧，伙伴\n祝你早日归来，快乐又逍遥！” "
 tnolar_chi.106.a:0 "海军矗立海洋出，呼声响又亮！"
 
 #完善战争理论
 tnolar_chi.107.t:0 "星期四晚，参谋部"
 tnolar_chi.107.d:0 "高宗武缓步走进了参谋部，看见参谋部的专家们正在黑板上复盘上一次兵棋推演，高宗武摆摆手，示意立正敬礼的总参谋长鲍文樾继续他的讲演。\n\n“这次推演的结果是戏剧性的，”参谋长顿了顿，“代表我们国军的蓝方在战役初期攻势迅猛，拳头部队已经从燕－太防线推进到了海河一线，但之后的战事显得就十分困难了。代表日本陆军的红方部队则有着协同良好的空中和海上火力支援，而且哪怕劣势也会有反冲锋的情况出现，任援道部完全被拴在了燕－太战场上。”\n\n在议席的右侧端坐着张岚峰和几个派至日本帝国留学归来的青年军官，负责在这次兵棋推演里指挥红方，也就是日军和他们的满洲仆从。\n\n“假如从旅顺港出发的日本海军陆战队在大沽成功登陆，我们孱弱的岸防部队绝对会一触即溃；而一旦日本的山地师打下大同合围保定，那么结果一定是日本帝国的胜利。”\n\n“尽管推演中蓝方确实暂时达成了战术目标，但我们的将领使用得最娴熟的战术是添油战术，多么可笑啊，”方先觉一边用手指敲着桌子，一边嘲笑道，“在现如今的战场上，仅凭落后的军事理论绝无可能取得整体战争的胜利，哪怕在开始取得多大的胜利都无法改变失败的结局。”\n\n任援道早已听得气不打一处来，“总参谋部的推演就是打牌，今天你赢，明天我赢，在意什么！开始的战果已经证明我们正在采用的军事思路没有太大的问题，把握好这个方向稳步前进即可打造出现代化的军队。”\n\n高宗武沉思着，军事的现代化绝不仅仅是武器装备的现代化，战争理论同样举足轻重。选择只有两种，要么向前看，同意新军官们将日新月异的指挥艺术漂洋过海带进我们的作战大纲；要么向后看，老牌军官们会把《孙子兵法》般的老古董摆回我们的案头。"
 tnolar_chi.107.a:0 "向前看。"
 tnolar_chi.107.a.tt:0 "§Y我们将在未来开创一种属于中国的新锐军事理论。这一选择也许能极大地增强我们的武装力量，但只有时间才能证明我们的努力是否会成功……§"
 tnolar_chi.107.b:0 "向后看。"
 tnolar_chi.107.b.tt:0 "§Y着力发展军事技术，把我们的古老智慧转化为现代战场的力量。§!"
 
 #革新鼎故
 tnolar_chi.108.t:0 "最新一期《革命军人周刊》文章选段"
 tnolar_chi.108.d:0 "……\n\n注重作战实验。现代战争，往往首先在作战实验室打响。作战实验通过创建可控、可测、近似真实的模拟对抗环境，把军队逼真地带入战斗情境，量化分析作战问题。兵棋推演是实现对抗性博弈、过程性推演、多要素制约、数量化裁决、精细化导控、复盘化讲评的训练工具。两者都是和平时期提高指战员战术水平的科学方法和有效工具。一项战术是否实用、战法是否可行，在无法通过实战检验的情况下，往往可以通过作战实验初见分晓，并以此优化战法、优选方案，提高训练效益。兵棋推演通过设置对抗性较强的氛围环境和最大限度模拟作战对手，使指战员切实感受到战时指挥决策的压力困难，从而更加全面深入地思考研究作战问题、更加主动地提升战术素养。作战实验作为当今时代军事实践的重要方式，可以从哲学高度把握战争形态、战争谋略、作战方式、制胜机理的演变方向和路径，把战术水平培养推向新境界……"
 tnolar_chi.108.a:0 "向前看。"
 
 #傍人篱壁
 tnolar_chi.109.t:0 "新编《国民革命军步兵操典》节选"
 tnolar_chi.109.d:0 "战斗一般之目的，攻击时要夺取敌人的阵地，将敌人驱逐至阵地之外；防御时要击退进攻我方阵地的敌人，保持阵地。这样的进攻与防御，虽然达到了战术上的目的，但是战斗的目的，并没有完全达到。应学习日军的战斗方式—不论进攻与防御，都应该采取进攻行动；情况迫不得已需要防守时，也要抓住战机，果敢地进攻。在进攻中给敌以决定性打击，出敌不意，达成突然性，力求在首次打击中致敌于死地，使之丧失续战能力，这样才是完全达到了战斗的目的。出敌不意，对于奠定胜利基础和取得战果都极为重要。因而必须具备独创的见解和锐意进取的精神才能战胜敌人;必须不断钻研作战经验，洞察未来发展，经常进行必要的有关训练，采取完善的对策，以便先发制敌。\n\n想要达成“出敌不意”的目的，首先应收集情报，掌握敌情，并与积极的欺骗行动相结合:其次是使用敌人意想不到的方法手段。以此来搅乱敌人，给敌心理上的打击。其次应以神速的机动突然出现在敌人的面前，占据主动地位，用积极果敢的运动战和包围歼灭战消灭敌人。……在果敢的正面进攻把敌兵力牵制在正面而使之无暇顾及其他的情况下，用于翼侧包围的兵力越大，其包围的成果会越明显。担任包围的部队，必须隐蔽企图，神速果敢地行动，不给敌人以采取对应措施的时机。同时实施两翼包围或实施一翼和背后包围会取得更大的战果。所以，只要情况允许，就要果断大胆地实施包围。\n\n日军为达成出敌不意的目的，尝尝利用利用夜暗发动进攻，奇袭敌人，团以下小股部队也可效仿……大部队夜间袭击难以隐蔽企图和行动，通常在没有炮火支援的情况下，很容易在敌猛烈的反(冲)击下陷入混乱，最终遭到失败，应谨慎实施……精神力量属于一种无形战斗力，在战斗中应实施以精神力量为基础的勇敢的进攻……指挥官的意志，统帅之妙和高昂的斗志，是战争和作战胜利之首要的决定性因素……我国虽已完成现代化改造，但与其他强国相比，国力较弱，技术较为落后，完全依靠靠物质的战斗力难以取得战争和作战的胜利，要尽力发挥中华民族在精神上的固有优势，才能弥补有形战斗力之不足。"
 tnolar_chi.109.a:0 "取人之长，补己之短。"

 #历久弥新
 tnolar_chi.110.t:0 "军营一夜"
 tnolar_chi.110.d:0 "天色已快要完全黑下来了，向西望去天边还挂着几抹晚霞，衬着不远城市里的霓虹灯光。老樊把沾灰的作训服脱下来抖了抖，点了一根烟，和战友在校场边零星的几张桌子中挑了一张围坐下。他默然了望着渐暗下来的火烧云，听着营房那边装银幕和投影仪的工人手里的活窸窸窣窣地响，今夜营里没有夜训，他也不用出勤站岗，又过了辛苦的一天。\n\n讲到军营里的电影，老樊是十分了解的，那是汪精卫林柏生的大头照展示时间，也是他们士兵们闭目养神的好时候——他对此是没有什么怨言的，有电影看有地方坐就不错了，还要什么别的呢？老樊只打算等入座便沉沉睡去。\n\n一声哨响，列队，入座，电影刚开场，音响中的一声炮响便把士兵们的睡意炸得全无，电影里没写那些和平建国之后的丰功伟绩，只看到一个孩子，他随北伐从奴隶成为将军，只有长城外黑土地上，麦浪滚滚林海蓁蓁，只有南国黄埔门前，“升官发财请走他路，贪生怕死勿入斯门”。\n\n回到营房，电影最后的歌曲一直在老樊脑海中回荡：\n\n“更愿诸君，矢勤矢勇，指戈长白山麓；\n去矣男儿，切莫踯躅，矢志复兴民族。”"
 tnolar_chi.110.a:0 "他想家了。"
 
 #独立指挥体系
 tnolar_chi.111.t:0 "新体系"
 tnolar_chi.111.d:0 "“好，这样应该就可以了”\n\n就在刚刚，罗列完成了国防部国军的指挥体系改革计划书，新的指挥体系将更加独立于日军，将更多的权力集中在中华民国国防部和总统身上。依照此法进行改革，则国军可以多保存一份气力, 尽管日本人把框架设定死了，但是框架之下总是有操作的空间...要是日本人怪罪，自然有人去打圆场。毕竟能爬到这个位置，谁还少不了几把保护伞呢？在加入改组国民政府之前，罗列就已经是国民革命军的中将。南京的花花肠子比重庆也高不到哪里去。罗列自己是民族派的人，尽管像他这样曾效力于国民革命军的人也有不少在改组国民政府供职，但是像罗列这样凭着自身才能爬到这个位置的人寥寥无几。\n\n有的时候，罗列仍会梦到自己往年的经历，一个曾经在北伐战争中身先士卒的士兵，一个黄埔四期的高材生。再看看眼前国防部奢华的办公室，这一切就像梦一样。有的时候国防部的年轻军官会问他，中华民国国防部究竟是为日本而战还是为了中国而战。罗列只能笑一笑，告诉年轻人们他们是为了大东亚共荣圈而战。这个答案骗得了年轻人，但是骗不了罗列自己。\n\n或许有一天，罗列还能为了中国而战，只为了中国。"
 tnolar_chi.111.a:0 "铁马冰河入梦来。"
 
 #日本指挥体系
 tnolar_chi.112.t:0 "新体系"
 tnolar_chi.112.d:0 "“好，这样应该就可以了”\n\n就在刚刚，罗列完成了国防部对于国军的指挥体系改革计划书，新的指挥体系将更加接近于日军，将更多的权力集中在最高军事顾问委员会上。这样的话，无异于收紧了日本人架在南京的镣铐。东京那边动动手指就能让国军上蹿下跳。但是国军也可以以此为由向日本人索要援助之类的东西。在更快学习日本军事科技的同时省出资源，放在军备建设上面。\n\n“如果把资源集中于军备研发，那么国军应该能在一段时间内赶上日本人，甚至在某些方面赶超也说不定。”\n\n罗列知道这些话多少有些安慰的意思，现在的国军和一盘散沙差不了多少。而日本人又时时刻刻盯着南京。如果能在日本人的眼皮低下搞出一个独立的指挥系统是最好的，但是华北派这次贿赂了太多的人，国防部里的民族派棋差一着，只能顺着他们的意思开展改革。\n\n说到底，用着日本人的指挥体系只是面子，能从东京讨多少东西，日后在这套指挥系统里又有多少操作空间，就是以后的事情了。毕竟君子报仇，十年不晚。或许有一天，罗列还能为了中国而战，只为了中国。"
 tnolar_chi.112.a:0 "夜阑卧听风吹雨。"
 
 #整顿士兵
 tnolar_chi.113.t:0 "《中华日报》新闻节选"
 tnolar_chi.113.d:0 "……为重塑国民革命军在国民心中的形象，打造一支优秀的泛亚军队，国防部发言人于今早八时在国防部例行新闻发布会上宣布：经投票表决，中央执行委员会全体通过高总统提出的《关于整顿国民革命军的条例》，并通告全军即日执行。该条例宣布，在原有军纪条令的基础上增加新的条令，以约束军队的日常生活，打造良好的均军事风气。其中，广受民众关注的有以下几条。\n\n第一百二十三条 故意损伤无辜居民，或者故意侵犯居民利益，威胁居民生命财产安全者，情节较轻的，给予记过、记大过处分；情节较重的，给予降职（级）、降衔（级）、撤职处分。\n\n第一百二十五条 禁止在任何军营内设立任何形式的军中妓院，禁止以任何形式包养营妓或者虏掠、强迫妇女成为营妓，违者情节较轻的，给予警告、严重警告处分；情节较重的，给予记过、记大过处分；情节严重的，给予降职（级）、降衔（级）、撤职、开除军籍处分。\n\n第一百四十二条 违反装备管理规定，遗失、遗弃、损坏装备，擅自动用、馈赠、出售、出借、交换、私存装备，或者擅自改变装备编配用途和性能结构造成不良后果和损失，情节较轻的，给予警告、严重警告处分；情节较重的，给予记过、记大过处分；情节严重的，给予降职（级）、降衔（级）、撤职处分。\n\n第一百四十九条 贪污、行贿、受贿者，情节较轻的，给予警告、严重警告处分；情节较重的，给予记过、记大过处分；情节严重的，给予降职（级）、降衔（级）、撤职处分。\n\n该条例的推出为新时期建设新军队提供了新的指导方向，希望全军将士不要辜负党国对军队的期望，定要把中华民国军打造成符合时代要求的全新军队，成为建设美好社会、保障国家安全、维护共荣圈和平稳定的中坚力量。"
 tnolar_chi.113.a:0 "“龙腾虎跃军威壮，忠诚精实风纪扬！” "
 
 #重视技术军官
 tnolar_chi.114.t:0 "建设高素质创新型专业技术军官队伍\n——认真学习贯彻《专业技术军官管理暂行规定》"
 tnolar_chi.114.d:0 "日前，国民政府军事委员会印发《专业技术军官管理暂行规定》。这是激发专业技术军官队伍活力动力、提高人才培养使用质量效益的重要举措，是建设高素质创新型专业技术军官队伍的制度保证，对加强和规范专业技术军官管理、促进专业技术军官职业发展，必将起到重要的牵引和推动作用……\n\n……专业技术军官是建设现代化军队的重要力量，是推动部队创新发展、打赢未来战争的重要支撑。《规定》坚持以战斗力为唯一的根本的标准，以调动专业技术军官积极性、主动性、创造性为着力点，在岗位管理、教育培训、考核评价、职称评定、晋升任用、激励保障等方面推出一系列创新举措，着力重奖重用特殊人才，赋予专业技术军官更多科研创新自主权，实施更为宽松的容错减负措施，切实为专业技术军官履职尽责、成长发展创造良好环境……\n\n……创新驱动实质上是人才驱动，军事竞争归根到底是人才竞争。各级军官要认真抓好《规定》和专业技术人才相关法规政策的贯彻落实……广大专业技术军官要牢记党国和高总统的期望重托，勇于开拓创新，甘于牺牲奉献，努力在强军征程中再立新功、再创佳绩。"
 tnolar_chi.114.a:0 "“我们要使技术发明日日新，我们要用血汗永固中华魂！”"
 
 #整治贪腐军官
 tnolar_chi.115.t:0 "去除毒瘤"
 tnolar_chi.115.d:0 "年轻军官冷漠地看着面前这几位锦衣玉带的老人，点了点头：“各位有什么事，就说吧。”\n\n“听说您马上要进行一些人员调整……”一个年纪最大的老人起身讲道。后面的话军官不听也知道他们的来意了，但无奈还是要耐着性子听他讲完。\n\n“仅仅是小小的人事调动，你们几位又何必亲自前来呢？”年轻军官挤出了一个笑容。\n\n为首的老人笑了笑，接着说道：“犬子不争气……”还没等他说完，年轻军官就打断了他的话：“您的儿子，还有其他几位老先生的儿子确实是不争气，私吞军款军粮，仗势欺人，强取豪夺之事经常发生，我正考虑将他们送上军事法庭。”此话一出，现场的气氛降到了冰点。\n\n“这是南京那边又下什么新命令了吧……”为首的老人脸上有一些挂不住了，“到时我去一封信到南京，问一问情况。”\n\n“我看不必。”军官递给老人一份报纸，“这是今日的《中华日报》，您自己看看吧。”\n\n几个老人凑过去一看，头条标题上的黑体大字令他们有些眩晕——“立法院于今日通过《军事反贪法》，高宗武总统要求各地宪兵和各部队指挥官于今日开始依法行事”。\n\n“这……”为首的老人面如土色，说不出来话。\n\n“不只是您几位的儿子，那些混迹军中的兵痞也会被带走，在监狱里，您的儿子也不会孤单。”年轻军官起身，挥了挥手，“卫兵，送客！”"
 tnolar_chi.115.a:0 "去除毒瘤。"
 
 #总政治作战部
 tnolar_chi.116.t:0 "党务，军务"
 tnolar_chi.116.d:0 "高宗武看着会议桌两旁的国防部诸位将领，终于开了口。“各位讲一讲关于总政治部的看法吧？”\n\n会议室里面鸦雀无声。有的高级将领们则闭目养神，神游天外；有的人目光躲躲闪闪，不敢与高宗武对视。高宗武叹了一口气，接着唱起了这出独角戏。\n\n“我知道大家的想法。我事先声明，总政治部是必须建立的，一切讨论都要基于这个前提才可以进行，至于什么撤销总政治部的话，还是不要讲了。”\n\n鲍文樾慢悠悠地开口了：“设立总政治部可以，我没意见。但鉴于现在的情况，国防部没有多余的精力去挑选政工干部，所以我建议让各级军事主官来代行政治主管。”\n\n“军政一体？”\n\n“是的，总统先生。反正政治宣传无非贴标语，喊喊口号，没有什么实质性的作用，不如一挺机枪来得实在。”\n\n高宗武无奈地摇了摇头，苦笑了一下。\n\n“此言差矣。北伐战争之所以胜利，正是因为我们国军当时拥有着强有力的政治宣传体系和许多信仰坚定的优秀政工干部，动员起了广大群众参与，投身于国民革命的大业中来。”\n\n“那时的政工人员皆是共匪，只会一些蛊惑人心之事罢了。”\n\n“你不能否认的是，这样的‘蛊惑人心’推动了战争的胜利。这样的‘蛊惑人心’塑造出了一个又一个信仰坚定，意志坚强的优秀战士；再看看蒋伪政权的军队，丧失信仰，只知贪污受贿，扩张势力，恃强欺弱，满足自己的私欲，遇到日本人时则兵败如山倒，这样的对比，还不够明显吗？”\n\n“我们可以选出一些政治觉悟高的军官来兼任……”\n\n“部队的政工干部不只是宣传，还有教育监督作用。如果部队的政工干部也由军事主官代替，那谁来教育监督部队呢？谁又来监督军事主官呢？难不成要依靠军事主官的自觉性吗？”\n\n“总政治部的各级官员都由国民党中央委员会委派，各级部队的政工干部将由总政治部进行挑选，分派。总政治部由中央委员会领导，其他各部门无权干扰。各级部队的政治主官与军事主官地位相当，负责教育、监督。”"
 tnolar_chi.116.a:0 "“即日实行，不得延误。”"
 
 #国族至上
 tnolar_chi.117.t:0 "家国情怀"
 tnolar_chi.117.d:0 "晴空万里的早晨，士兵们刚刚完成了日常的体能训练，本想好好休息一下，却突然收到通知有大领导来讲座，顿时感到有点摸不着头脑。\n\n没过一会，一个看起来很年轻的军官昂首阔步地走进了演讲大厅，神采奕奕地在讲台上向台下敬了个礼。\n\n“大家好，我姓胡，你们可以叫我胡参谋。”简单的自我介绍后，士兵们致以欢迎的掌声，也就在此时，一个奇怪的人走进了会议厅，悄悄地坐在了最后一排。胡参谋明白，日本人又派“顾问”来帮他“提供意见”了。掌声渐熄，胡参谋也开始了他的演讲。\n\n“在本世纪初，‘中华民族’的概念首次被提出，随后被先总理写入‘三民主义’中的‘民族主义’，成为我们国民党不断追求和努力的目标之一。今天，我想和大家聊一聊这个话题。”\n\n“中华民国立国根本之一是‘五族共和’，那么各族的利益就是中华民族的利益，更是中华民国的利益。在‘五个现代化’方针引导下，中华民族在各个方面取得了卓越的成就，我们建设了无数工厂，并用这些工厂打造出数不尽的飞机大炮，这是几十年前难以想象的。而且，我们还能够打造出百尺高楼，在将来，我们还能飞上太空，李白诗中的‘手可摘星辰’也将不再是想象。”\n\n“现代化中最重要的一环是军事现代化，因为军事是保障国家利益的坚实屏障。匹夫无罪，怀璧其罪，我们现代化的成就一定会引得他人眼馋，那些帝国主义者一定会来掠夺我们劳动汗水的结晶。在抵抗侵略的先头阵地上，文官们会在外交和经济上尽力抵抗帝国主义者，当他们倒下后，就需要各位保家卫国。我相信即便是世界上最强大的国家，也无法击败意志和血肉构建的万里长城……”\n\n时间过得很快，演讲也逐渐进入了尾声。胡参谋注意到日本顾问铁青的脸色，显然，这场演讲没有让他满意，或许他很快就会在报告里向上级告状，但这都无所谓了。胡参谋只想要让在座的各位明白一件事："
 tnolar_chi.117.a:0 "没有中国的利益，泛亚就毫无意义。"
 
 #泛亚先锋
 tnolar_chi.118.t:0 "难得糊涂"
 tnolar_chi.118.d:0 "陈礼躺在营房的床上睡得正香。但一阵急促的集结哨声响起，他只能一边整理裤腰带一边飞快地冲到操场。那个凶神恶煞的教官已经在等着了。\n\n“你们这些新兵蛋子，今天算你们走运！下午的体能训练取消，王副参谋要来给你们讲讲泛亚理论，大家鼓掌欢迎！”\n\n稀稀拉拉的掌声响起后，一个大腹便便的军人摇摇晃晃走上台来，漫不经心地敬了个礼。然后从屁股后面的腰包里掏出一份讲话稿，故作高深地清了清嗓子，对着话筒开口说：\n\n“从本世纪之初到现今的一切历史中可以看出，中国人的命运和整个亚洲的命运是休戚与共的，中华民国作为共荣圈的重要成员，自然也是泛亚主义的先锋。诸位既然为中华民国国军，是中国军人，更是泛亚的军人，我们必须携手日本和满洲同胞一起，为击败欧美帝国主义势力而不懈奋斗。”\n\n“泛亚主义乃是国父中山先生和汪总统坚持了一生的事业，曾经的中国积贫积弱，饱受欧美帝国主义的欺压。诸位能想象要给那些鹰钩鼻的夷人低三下四的样子吗？幸好有我们的日本兄弟把我们从水深火热中救起来，欢迎我们加入泛亚主义大家庭，我们再也不用害怕帝国主义者了。”\n\n“我能够理解，诸位家中或多或少都有些老人不太能够接受泛亚主义。是的，大日本帝国的个别军人可能做了些对不起他们的事情，但你们要记住，日本和中国是亲密的泛亚兄弟关系，日本对于中国的责骂或者是鞭打，都是对弟弟恨铁不成钢的责之深、爱之切。我希望不只是现在，更在各位离开军营的那一天，你们能作为泛亚主义的使者，身体力行地向家中比较保守的长辈们传达我们泛亚主义家庭的亲善团结！还有，泛亚主义事业需要……”\n\n下午的太阳晒得陈礼头昏脑胀，以至于除“泛亚”二字外都成了无意义的嘈杂。他感到那两个音节就像是一只难缠的章鱼吸附在他的意识中，即使是耗尽整个中国之力也无法将其拔走。"
 tnolar_chi.118.a:0 "但总比体能训练好。"
 
 #铁纪钢律
 tnolar_chi.119.t:0 "重塑纪律"
 tnolar_chi.119.d:0 "军人下营之后该去哪里？官方的说法是军人俱乐部，图书馆，电影院等等。但往往在这些正规的场所见不到军人的影子，大家也都心知肚明，那些官方的说法纯属糊弄外人用的。\n\n城里的赌场，每晚五点，准时有一股军绿色的人流涌进这里，并占据着赌场的每一张赌桌。没错，这就是当地驻防部队的士兵们，每天来这里赌钱，是他们唯一的娱乐项目。当地人对他们的到来见怪不怪，赌场的工作人员也和他们混得很熟，并把他们当作大客户来对待——毕竟最近几年来部队士兵的津贴涨了很多，从他们手里能刮到更多的油水。\n\n一个铁塔似的大个子士兵正站在赌桌旁，跟他的同僚们紧盯着赌桌上的动向，双手攥紧拳头，青筋暴起。他感受到有人在背后拍了拍自己，颇为不满。他不想搭理那人，可那人又开始拍自己，他实在不耐烦了，回身看向拍自己那人，想要给他点教训。\n\n“你他妈的……”他挥起手臂，想要给自己身后那人一个大大的耳光，好好教育教育他。却不料一直在拍自己的那个人虽然是个小个子，但身手不错。小个子抓住大个子的手腕，轻轻一拧，大个子便吱哇乱叫起来。大个子的那些赌友们想要帮帮场子，看到了那个小个子的臂章后却吓得不敢动弹。\n\n“是宪兵！”他们惊呼了出来。\n\n再抬眼望向赌场大门，更多地和这个小个子穿着一样的人也涌入了赌场。一些士兵仓皇逃窜，却与从门口涌进来的宪兵撞了个满怀，只得纷纷束手就擒。 "
 tnolar_chi.119.a:0 "“怎么会这样！？”"
 
 #拒止战略
 tnolar_chi.120.t:0 "《中华民国未来国防战略规划》摘要"
 tnolar_chi.120.d:0 "“经中华民国政府与全国人民上下一心，奋斗不懈，我国已于国防工业领域取得重大进展。有鉴于我国需要与工业能力，国防部参谋本部会议推定，除持续推进陆军现代化进程，以御敌于国门之外为目的，将建设由空中-海中-岸上构成之全面防卫体系。\n\n在空中，为建设一支有能力配合地面雷达部队，敌袭时可快速反应的防御性空军，应主要开发兼具空地作战能力之中型战斗机以填充机队，并以长航程-高载弹量的重型战斗机为辅。亦应开发与下一代国产战机配套之导弹系列，以确保空军之作战能力。\n\n在海中，因水面舰艇建造周期长，成体系时间久，为尽快建立初步防卫，除去必要水面舰艇之建造，其余舰船生产能力将重点投入潜艇部队。因此，将制定开发新型鱼雷与潜射反舰导弹的计划，通过航程适中-运载量高之常规潜艇为搭载主体，以保证海军的区域威慑能力。\n\n在岸上，应由雷达部队与岸基对空，对海导弹结合，力求达成对我国周边海域进行全年不间断之监视，摧毁能力。为此，需研制新一代长程-高精度雷达，配合开发高速-高精确度-低可拦截性之导弹。\n\n此外，有必要掌握对敌来袭导弹进行侦测与拦截之能力。为此，需于全国部署导弹防御系统，以覆盖我国绝大多数具有高战略价值之军民用目标。如有必要，亦应当开发可机动部署之区域防空系统，以作完善防空，反导体系之用。”"
 tnolar_chi.120.a:0 "阅罢，文件封页签下了“高宗武”之名。"
 
 #十年磨剑
 tnolar_chi.121.t:0 "临门一脚"
 tnolar_chi.121.d:0 "夜晚已至，南京城里的霓虹灯光如星星闪烁一般闪耀着，令总统府书房的台灯黯然失色。然而这盏小灯所照亮的昏暗书桌，却能书写出足以影响整个世界的文字。中国的军事力量想要得到发展就必须扩军，但可惜的是中国没有扩军的自主权力，现在，作为一国之君的高总统正在写信，卑微地祈求日本同意中国的计划。\n\n高宗武一遍又一地遍阅读手上的文件，逐字逐句地修改不够礼貌与温和的修辞和语法。但他修改的次数越多，就越显得他内心的担忧和不安。他的文案秘书提出帮他书写这份文件，但被他拒绝了。他的秘书不理解，他的上司作为中华民国的总统，一份递给“友邦”的互利共荣的文件，按道理来说不需要他亲手书写。但高宗武总统所考虑的是，这份文件将关系到中国人民的自由与东亚的未来，任何有可能让日本人勒紧中国脖子上锁链的语言都不应该出现在文件上，即使他对这个年轻秘书的能力感到很满意也必须亲自起草保证符合要求。\n\n随着时间的流逝，南京城的霓虹灯光也逐渐熄灭。但高宗武书桌上的小小台灯却还在亮着，犹如天空中最闪亮的北极星一般，指引着处于黑暗的国家和人们往正确的方向行走。高宗武仍然在思考，要给亲日派和日本人打点多少钱才能堵住他们的嘴，要施行什么政策才能让贪得无厌的保守派们满足，要怎么写这份文件才能不会激怒残暴的日本军人，要怎么做才能让自己苦心经营的军事现代化不让日本强力干预下而导致破产。\n\n高宗武想，目前的国军在处理西南动乱的时候就已经显得捉襟见肘了，更不要说要靠这样的军队实现重整山河和打倒日本人的梦想。他叹了口气，重新阅读了一遍文件上的文字。这回他心里觉得，自己给予的太多而索要的太少。如果按这样的要求扩军，连满洲国的部队都打不过，何况是日本帝国陆军？于是，高宗武把写好的文件扔进垃圾桶，拿出新的纸张写新的文件。"
 tnolar_chi.121.a:0 "“致大日本帝国内阁总理大臣，您的友邦中华民国领导人高宗武向您谦卑地提出请求...”"
 
 #锋芒毕露
 tnolar_chi.122.t:0 "水到渠成"
 tnolar_chi.122.d:0 "“……中华民国作为大东亚共荣圈的核心成员国，以及共荣圈内主要发展引擎，应当在瞬息万变的国际形势中为保卫共荣圈的安全和保障共荣圈的繁荣履行更多的义务。因此我国要求，在我国顾问的指导之下帮助贵国完成扩军事宜，以满足保卫共荣圈安全的军事需求。”高宗武听完秘书的报告，没有说一句话，只是挥挥手让他出去。\n\n高宗武躺在椅子上，各种各样的情绪一瞬间涌入心田。他回想起护国军将领被处决前的不甘，又回想起在请求日本答应扩军时的卑微，要如此低声下气才能拿回自己应有的权利，真是可悲。\n\n时至今日，外部的军事压力已经让日本人如此惊慌，以至于不得不放松对中国的军事控制来缓解来自四面八方的威胁。这样的消息必须马上告诉自己人，以进行下一步计划。高宗武拿起办公桌上的话筒，拨打只有他们知道的秘密号码。等到话筒发出一声“喂”之后，他对着话筒说："
 tnolar_chi.122.a:0 "“希圣兄，日本人答应我们的要求了。”"
 
 #韬光晦迹
 tnolar_chi.123.t:0 "功亏一篑"
 tnolar_chi.123.d:0 "“……我们大日本帝国有保卫共荣圈成员国安全的能力，也能承担维持共荣圈稳定与安全的义务。贵国的扩军要求，是对我国军事实力和泛亚主义的不信任，以及是对共荣圈稳定的潜在破坏。因此我国拒绝贵国无礼的要求。”\n\n听完秘书的报告，高宗武没有说一句话，只是挥挥手让他出去。\n\n他明白自己已经是步步小心时时注意，仓库武器缺口的假账应该不会有人看出来，秘密军队的档案也只被少数人所知。是自己过于疏忽了？还是自己的核心人员背叛了自己？还是亲日派暗中对日本人放出消息？还是日本人单纯不想中国扩军？\n\n无论如何，一切都已经发生了，可能挣脱来自日本的铁链本身就是一件极为困难的事……"
 tnolar_chi.123.a:0 "如果能再小心一点的话……"
 
 #唤醒猛虎
 tnolar_chi.124.t:0 "片刻的清闲"
 tnolar_chi.124.d:0 "高宗武坐在安乐椅里，享受着这清闲的午后。对于他来说，这样的清闲是难得的。这些年来，自己一直在扮演工作狂人的角色，不能也不肯离开那几平方米的牢笼。而今天，他终于能在总统府的花园里放松自己，闭眼享受这明媚的阳光。\n\n闭上眼睛，过去的事情就如潮水般涌来。他想起了自己追随着汪主席，离开蒋伪政府；他也想起了自己当选中华民国大总统的时刻。那时候自己在想什么呢？他自己也不清楚。他只知道，他看到了一个残破不堪祖国，伤痕累累的母亲，长睡不起的雄狮。他心痛，他像所有热爱自己的国家的人一样，感到心痛。但他也知道，仅仅心痛是无用的，想要救国，那就要埋头苦干。\n\n他想起了毛泽东。自己能理解他，能理解所有参加共产党叛军的人。但他不得不这么做，也只能这么做。他只能眼睁睁看着无数祖国的好儿郎仅仅凭着一腔热血，盲目地行事。他能感到无比的心痛，他努力地从日本人的手下救出这些好孩子，让他们继续为祖国发光发热。\n\n有的人骂自己是汉奸，是日本人的狗，但国家贫弱如此，只有隐忍厚积，才能勃发。有的人骂自己是独裁君主，无视政府，一意孤行，但这些年的成就已经足够让他们闭嘴了。他不会忘记自己是一名国民党人，也不会忘记三民主义的理想，永远不会。他想，如果一切顺利的话，他将会实现民族主义，后面的事，就交给后辈吧。总有一天，在这中国人的天下，人人都能当家作主，成为自己的主人。这事不会假，不会像蒋伪政府时期那样，成为一句虚言，但现在，甚至是直到他停止呼吸的那一刻，他要紧握大权一刻不松手。\n\n突然他能理解毛泽东了。自己也站到了他那个位置，手握雄兵百万，蓄势待发。只等自己一声令下，猛虎便要冲下山来，冲破这牢笼与锁链。\n\n只等自己一声令下，无数英雄儿女，便要投身到这场解放当中去，到这场革命中去。"
 tnolar_chi.124.a:0 "车甲已足。"

 #提升征兵标准
 tnolar_chi.125.t:0 "面试"
 tnolar_chi.125.d:0 "董曙光坐在房间外面百无聊赖地看着天花板，当接到面试的通知时他脑袋里有几百万个问号。种类繁多的体检和政治审查他都完美通过，役前训练期的考核中也以第一名的身份通过，半年下来两轮筛选让原本八十多人的新兵中队最后就剩下了十八个人，而这一切居然还没结束，他居然还要进行面试。这又不是应聘公务员，怎么当兵都要面试了？为国捐躯还要分有没有资格吗？他来当兵才不是因为海报上写的“管吃管住，顿顿有肉”、“工资高昂，按时发放”，而是为了那个最纯粹的念头，纯粹到身边人都嘲笑他是傻子的念头。\n\n董曙光看到了上一个人从房间里走出来，那个人神情低落，看来是没有通过面试，这让他心中的疑虑更深了，以至于当他听到里面传出“下一位”的声音时，他的腿比大脑先做出了决定。\n\n面试官是三位校级军官，看着年龄都老大不小了，中间的那个人问道：“董曙光同志，你为什么要加入中华民国国军？”\n\n这个问题让董曙光感到莫名其妙，他试探地说：“为了拯救中国？”\n\n“你对未来可能会面临的一切是否有所觉悟？”\n\n“以此时此刻来说，是的，我会尽量让未来也一样。”\n\n他们问的问题都和士兵素质无关全部都是一些在董曙光看来类似哲学的问题，他不懂这些东西，只能全部如实回答，而随着一个又一个问题被回答，三位面试官的表情都变得和善和欣慰起来。\n\n“最后一个问题。”左边的面试官问道，“如果命令你去死，你会去吗？”\n\n听到这个问题，董曙光握紧拳头：“我个人，不想死……但如果是为了中国光明的明天，我会尽一切我所能。”\n\n三位面试官都露出微笑。"
 tnolar_chi.125.a:0 "欢迎你加入国军"

 #风味事件
 #军事
 tnolar_chi_flavor.1.t:0 "报告"
 tnolar_chi_flavor.1.d:0 "帝国大本营：\n\n对于首相阁下及大本营对中华民国军事现代化之顾虑，顾问团已全数知悉。经今日在中特高课之排查，结合我顾问团分析，我顾问团认为中华民国国防部推行之军事现代化策略，于帝国而言，有利有弊。\n\n中华民国国防部并非铁板一块，其组成人员不尽相同，目前占据主导者谓之中央派，该派系老旧守成，不愿进取，其组成多为原和平建国军之将领，但仍有少数为旧蒋介石派系人员，需多加注意。\n\n其次为华北派，该派成员脱胎于我帝国组建之华北治安军，多为支持日中亲善，泛亚主义之人员，该派为我帝国之忠实盟友，主张军事现代化，主张学习我帝国军队之制度，引进制造我帝国之军备。有基于此，中华民国之军事现代化进程将极大有益于我帝国军工企业之发展，进而促进我帝国经济之进步，同时也可加强巩固中华民国之国防，有效减轻我帝国军队负担。\n\n最后为民族派，该派成员皆为反对日中亲善之顽固分子，极其仇视我帝国及帝国军队。该派同样支持军事现代化，然该派主张军事技术独立自主，鼓励自米、德引进军工技术，是对我帝国军工及经济大不利之事。幸此派人员稀少，势单力薄，尚不能成气候，但仍应多加警惕，以防其对我帝国不利。\n\n综上陈述，我顾问团综合认为，虽中华民国之军事现代化政策有对帝国不利之嫌疑，然其增强中华民国国防，可极大减轻我帝国军队之负担，利大于弊。有鉴于此，我顾问团建议帝国大本营继续同意中华民国军事现代化政策，但请注意提防部分对我帝国不利之分子。\n\n                                                                      帝国驻中华民国最高顾问团"
 tnolar_chi_flavor.1.a:0 "如履薄冰"
 
 #提拔青年军官
 tnolar_chi_flavor.2.t:0 "现实……"
 tnolar_chi_flavor.2.d:0 "“我在此祝愿诸君今后能够在军队中发挥自己在校内之所学，为民国军事之现代化，贡献出自己的一份力量……”毕业仪式末，台上的任援道致辞完毕后。方正就算是正式从中央军官学校毕业，成为一名正式的中华民国国军少尉了。\n\n他就站在那，手中紧握着自己的证书，不禁泪流满面。\n\n	从决定报考军校的那天起，他就在脑海里无数次设想过这个场景，不知道有多少个夜晚为此辗转难眠。而现在，他终于走到了这一步，他是一名少尉了，他马上就能真正进入到军队中去，用自己的本事为他千疮百孔的祖国做贡献了。\n\n可事实好像并非他想的那样，他进了军队后就不知碰了什么钉子，一开始他的新上级见到他学历后对他很是客气，给他最好的待遇，还为他设宴接风洗尘，可过了两天，情况就急转直下了。\n\n	方正的家只是一个在南京勉强求生存的职员家庭，虽已经比外面绝大多数饥民好得多了，但论背景是绝对不够看的。方正是凭自己的成绩实打实入学中央军官学校的，他人如其名，方方正正，竟也没有在校内去攀附那些公子哥，就这样毫无背景地毕业了。他的上级也因此对他十分冷淡，再也没有一开始的那般热情。没有了上级支持，他在同僚中也不是很混得开。\n\n“没权没势的，报考中央军官学校做什么？“他曾经无意间偷听过这样的话语，在他的上级的办公室旁。\n\n方正现在看什么都是一片灰暗了，没有背景，就没有人愿听他的意见，又没有资历，那么任何人都能拿捏他了。他本以为军队会是四处洋溢着热血与激情的地方，却没成想是这般的死气沉沉。"
 tnolar_chi_flavor.2.a:0 "可这就是现实。"

 tnolar_chi_flavor.3.t:0 "陌路"
 tnolar_chi_flavor.3.d:0 "方正在这死气沉沉的军队中待着，连带着他自己的激情也快被燃尽了。\n\n日夜都是被强加的做不完的文书，他在军官学校中学到的东西没有半点施展的空间，他有时甚至分不清，他究竟是一个少尉军官，还只是一个公司小文员？\n\n不过事情似乎迎来了转机。\n\n当方正埋首于无止尽的文书中时，中学老前辈赵四海突然找到他了，方正十分敬重这位老前辈，是他当时鼓励方正报考军校，也是他用自己华北陆军学校学员的身份现身说法，打消了他父母的顾虑。赵四海从华北陆军学校毕业后便动身前往日本留学，他们也有数年未见了。\n\n故人重逢，自然有不少话要说，赵四海引着方正，要到当地最好的一家饭店去喝酒叙旧。方正也是憋着一肚子话：他在军校的学习操练，他报国的意愿，以及他在军队里所遭受的不公对待……这些他都迫切地想向前辈倾诉。\n\n前辈自然也十分为方正鸣不平，他猛地把酒杯砸在桌上：“这些中央派的家伙，个个都是尸位素餐的东西……”方正在一旁默默点头应和，不过他不明白前辈所说的“中央派”是何物，不过那也不太重要，前辈在日本留学多年，一定有不少见闻，他一定有办法帮到自己。\n\n酒过三巡，赵四海对方正说本地有一个军官俱乐部，只要加入，那些俱乐部里身处高位的同僚不会对方正的处境坐视不管，听得方正激动不已。可接下来赵四海的话却让方正猝不及防：“你知道吗，和日本一直合作下去，才是民国巩固国防的最终出路……”他一股脑的把自己在日本受的“教导”搬了出来，诸如泛亚军事同盟，国军协从皇军；又说现在日本军队的力量多么强大，与德美争辉都不在话下……诸如此类，这一切的一切都让方正如此的震惊，眼前的前辈逐渐陌生起来，当初那个晚上和他畅谈民国出路的那个哥哥，似乎已经死了，死在了留学日本的路上。\n\n最后，前辈又吹嘘起他留日归来后被岩井英一，“最高军事顾问团”成员的接见，还从钱包里掏出当时的留影给方正看。但方正什么都没说，只是仰头把杯中酒一饮而尽，在酒精刺激喉咙的微痛中，他的眼里泛出了悲哀的泪花。"
 tnolar_chi_flavor.3.a:0 "他们已经不是同路人了。"

 tnolar_chi_flavor.4.t:0 "希望？"
 tnolar_chi_flavor.4.d:0 "那天的酒局直到最后方正也没有明确同意加入俱乐部，而前辈似乎也看出方正的意愿，自此赵四海再也没来找过方正。方正又回到了文书桌前，机械地做着繁杂且无用的工作，徒劳的等待他被彻底消磨掉激情的那一天。\n\n过了有一个月，方正的部门又来了一个新人，名叫林征。与方正不同，他不是军官学校毕业授予军衔的，而是一个被提拔为军官的原士兵。这让方正十分佩服，和他这种纸上谈兵的学员不同，林征是实实在在在军队里摸爬滚打了很长一段时间。也正因于此，在这部门里没人敢挤兑他，至少不敢明面上给他甩脸色。\n\n出乎意料的是，林征在部门里待得久了后，竟与方正亲近，两人常会在一起交流。久而久之，方正也把他的一肚子牢骚倒了出来。林征听后，竟也要方正参与一个俱乐部，这可把方正吓着了！方正犹豫起来，满口支支吾吾的不肯答应。林征看出了方正的顾虑，笑道：“怎么，以前有人邀过你参加俱乐部？”方正没吭声，只是点头。“是不是华北军事学校的人邀你的？”方正不禁一怔，照理说，军官间组织俱乐部不是什么稀罕事，俱乐部的数量也不算少，可林征怎么会知道……林征看着方正的神情，便知自己猜对了，拍了一把方正的肩：“看样子，我说对了，你放心吧，我们俱乐部不像他们那个一样……”接着就把他们俱乐部的宗旨给方正说了，什么“军事独立自主”啦，什么“遏止门阀，清除腐败”啦，还有什么“万物并包，增强军备”……听得方正云里雾里。他一个少尉小军官，哪听过这些？说毕，方正十分心动，这不就是他军官学校毕业时想的那样嘛！可末了，林征的神情又严肃起来，说他们这俱乐部不像那前辈的，这俱乐部并不受人待见，特别是日本派来的顾问，更是对他们恨之入骨。可方正并不在意这些，他只知道自己报国的门路，可能就在这里面了。\n\n“那些日本人可不喜欢我们这伙人，他们时时刻刻提防着我们，你可想清楚了，稍不注意，前程尽毁都是小事。”\n\n方正并不放在心上，他本就在这军队里没有出路，何不搏一把呢，"
 tnolar_chi_flavor.4.a:0 "去争取最后的希望呢？"

 #国防部演习事件
 tnolar_chi_flavor.20.t:0 "民族派胜利"
 tnolar_chi_flavor.20.d:0 "军队中不同的派系有着各自的军事理论，究尽哪个能在国防部里占据主导，还是要看他们能否通过事实来说服其他人，日常的军事推演和演习结果就成为了最具有话语权的实证。\n\n近日的军演里，民族派取得了最终的胜利。显然，只有不断革新技术，接受新时代发展出来的理论才能在未来取得胜利，那些腐朽的老军官和外国人的提线木偶就带着他们那文物一般的理论走进坟墓里吧。"
 tnolar_chi_flavor.20.a:0 "只有前进才能胜利。"

 tnolar_chi_flavor.21.t:0 "中央派胜利"
 tnolar_chi_flavor.21.d:0 "军队中不同的派系有着各自的军事理论，究尽哪个能在国防部里占据主导，还是要看他们能否通过事实来说服其他人，日常的军事推演和演习结果就成为了最具有话语权的实证。\n\n近日的军演里，中央派取得了最终的胜利。仅仅过去几年而已，战争的基本原理怎么会发生什么多大的改变呢？年轻人就不要浪费精力在所谓的“探索”上，老老实实按照老规矩建设军队才是正道。"
 tnolar_chi_flavor.21.a:0 "保持稳健就能胜利。"

 tnolar_chi_flavor.22.t:0 "华北派胜利"
 tnolar_chi_flavor.22.d:0 "军队中不同的派系有着各自的军事理论，究尽哪个能在国防部里占据主导，还是要看他们能否通过事实来说服其他人，日常的军事推演和演习结果就成为了最具有话语权的实证。\n\n近日的军演里，华北派取得了最终的胜利。无知者才会轻视共荣圈之主的军事力量，这次的胜利就是对无知者最好的警醒。如果那些家伙们还不及时迷途知返回，中国迟早会被叛匪们撕得粉碎。"
 tnolar_chi_flavor.22.a:0 "依靠盟友才能胜利。"

 tnolar_chi_flavor.23.t:0 "演习陷入僵局"
 tnolar_chi_flavor.23.d:0 "军队中不同的派系有着各自的军事理论，究尽哪个能在国防部里占据主导，还是要看他们能否通过事实来说服其他人，日常的军事推演和演习结果就成为了最具有话语权的实证。\n\n尴尬的是，近日的军演里，没有人取得最终的胜利，这次的军演根本没法说服任何人，看来大家都需要好好地再准备一段时间。"
 tnolar_chi_flavor.23.a:0 "真是巧合啊"

 tnolar_chi_flavor.24.t:0 "军演成功"
 tnolar_chi_flavor.24.d:0 "近日，中国军队和日本军队进行了一场模拟演习。日本扮演着进攻的一方，中国军队则作为防守者坚守要塞直到援军到来。经过三天三夜的激战，中日联合军演指挥部判定了这次战斗的结果。\n\n中国军队取得了胜利！在场绝大多数的中国军官都对军演的结果很满意。在这次演习中，他们至少从设定上击败了来袭的日本人，甚至通过反攻端掉了数个大本营，迫使这帮心高气傲的家伙们不情愿地举起双手。士兵们也感到很开心，因为在军演中可以合法地用枪托“不小心”揍到日本鬼子。\n\n消息传到南京，华北派的官员们一脸黑线地保持沉默，张仁蠡本人念叨着“不过是儿戏，终究是鸡蛋碰石头。”而民族派的官员则欢呼雀跃，他们之中甚至有的人落下老泪，想象着要是三十年前中国赢下了那场“演习”该多好。"
 tnolar_chi_flavor.24.a:0 "我们还会取得更大的胜利。"

 tnolar_chi_flavor.25.t:0 "军演失败"
 tnolar_chi_flavor.25.d:0 "近日，中国军队和日本军队进行了一场模拟演习。日本扮演着进攻的一方，中国军队则作为防守者坚守要塞直到援军到来。经过三天三夜的激战，中日联合军演指挥部判定了这次战斗的结果。\n\n中国军队在演习中失败了！当军演结果被判定为中国军队被“全数歼灭”的时候，张岚峰终于松了一口气，将杯里的清酒一饮而尽。他一直反对中国和日本进行军演，更害怕这场精神胜利的军演侥幸打赢了——一想到日本军事顾问的黑脸他就不寒而栗。赢了又有什么用呢？日本人有核弹，有航母，要真打起来，终究只是鸡蛋碰石头。\n\n消息传到南京，尽管没有欢呼雀跃，但在第二天还是能看到不少华北派官员如释重负的笑脸。民族派的官员们则个个如丧考批，他们咬牙切齿地表示这只是一时的失败，中国军队肯定能在下次取得胜利。"
 tnolar_chi_flavor.25.a:0 "要多少个鸡蛋才能砸碎一块石头？"


 #韩人老李
 tnolar_chi_flavor.10.t:0 "遗民（1）"
 tnolar_chi_flavor.10.d:0 "街坊邻居提起开小卖铺的那个老李，没有一个人不说他好的。十来年前，大家看着他风尘仆仆地来，第二天便挨家挨户上门拜访，手里提几斤四川腊味，操着一口不像是四川话的汉语，说自己刚从重庆来，请大家以后多照拂着点，再送上点礼品，哪有不对他笑脸相迎的呢？就这么着，老李也算在武汉三镇里的汉阳落下脚来了。\n\n老李这人心思活泛，来了没多久便在街里头离家五六十步远的地方盘了个小卖铺，靠着比起大百货也不算差的货品和偶有的新奇小物件赢了口碑。你要是下了班，闲的没事，到他那去，跟他说来点儿散烧，他保不准会拿点自己炒的花生米瓜子，掏俩酒杯陪你一起喝。听说还靠着酒量喝服了好几个现在跟他称兄道弟，帮忙进货的男人，进完货，往往还要一起喝酒唠嗑。\n\n小孩也喜欢听他讲发生在三江八道的往事。说几百年前有个和百姓同吃同工的洪义贼，劫富济贫，杀贪官，灭污吏，听得孩子们那叫一个热血沸腾；又有个起义的林大盗，开仓放粮，救济百姓，周旋四方。后来林大盗渐渐落了颓势，被朝廷杀害，孩子们又不由得伤心起来。故事罢了，老李还会给孩子们些难得的糖块吃，伤心的孩子们，又把这些抛之脑后，缠着他要听更多故事了。\n\n他在店里还时常摆着本《易》。有人喝酒的时候调笑过，说让老李给他算一卦，看看明天是吉是凶，他也笑着摆摆手推辞说不会，看着玩。没人来找他的时候，他就摆个八卦出来摊开书看啊看，却不知怎地就落下了泪来，手指就着泪水在桌面上划动着不像汉字的笔迹，写下“李南山”。\n\n老李还喜欢去汉江边上散步，往往一散步就是整天，还会专门在门上挂个牌子，说自己去散步了，让大伙明天再来吧。起初几回还有不信邪的人在门口等他，却直到了天黑才看见老李慢悠悠地回来，也就没人这么干了。\n\n每逢人问起他是哪的人，老李只说自己家里是民国初年搬进四川，自己在四川长大，再多的，就不说了。哪怕接着刨根问底下去，老李也只会打哈哈，糊弄糊弄了事。"
 tnolar_chi_flavor.10.a:0 "糊涂一点，活着开心？"

 tnolar_chi_flavor.11.t:0 "遗民（2）"
 tnolar_chi_flavor.11.d:0 "一年，两年，三年，十几年。老李理所当然地成为了这个街区里不可缺少的一位成员，就像他从小就在这条街上一样，再没有好事者去询问老李从哪里来了。但老李并不真的姓李，没人知道他出生在汉城，也没人知道他九岁的时候曾随着家里大人在公园里听着慷慨激昂的演讲，在游行里和几十万人一起高呼“独立万岁”。那时祖国各地群起响应，当大家都以为沦亡九年的祖国与民族将再次自由时，日本人则调来军队镇压半岛的一切反抗。老李一家又逃过鸭绿江，在回响着独立军战斗事迹的土地上安顿下来。\n\n后来日本人又来了，这时老李是个二十一岁的小伙子，他听说有人组织了大韩民国临时政府，就在关内，于是又带着家人逃啊，逃啊，逃到了山海关那边去。\n\n为什么日本人的胃口总是不会满足？老李想。他三十岁的时候，中国已经和日本打了三年大战。临时政府随国民政府播迁重庆，金九先生还组建了“韩国光复军”，正武装起来要和侵占祖国的鬼子作战。\n\n老李恨透了日本鬼子，所以他入伍了。\n\n他想拿枪去前线杀鬼子，却只能做着后方的繁复工作。当重庆城破，临时政府崩散，找不到其他同志时，他又逃了出去，但这次能逃去哪里？他改了名，在山岭与乡村间躲藏着，待到日本人撤兵，才回到一片废墟的重庆城。\n\n夜里久不能寐时，他便会飘然思念起愈发模糊的汉城，思念从南山上眺望祖国的那条汉江时，收入眼中的景色，思念故乡的亲族。每每不能自已，便从箱子里面拿出一面虽然旧得泛黄却又不染尘埃，写有血书“大韩独立万岁”的太极旗，痛哭流涕。\n\n他已经五十二岁了，余下人生已然不多，也不知道自己此生或尸骨还能不能还乡。祖国的影子随着金九先生的面孔渐渐消逝，连使用韩语说话，都变得生疏起来，恍惚间老李以为，自己的家乡就在这个汉阳。只是他依旧会在许多孤独的深夜中身披太极旗，随着遗存在记忆里的曲调，磕绊地唱起当年同志们的歌："
 tnolar_chi_flavor.11.a:0 "“无穷花，三千里，华丽江山。我等韩人，恪守韩心，同保我族前路。”（谚文）"



 tnolar_chi_flavor.19.t:0 "汉江依旧"
 tnolar_chi_flavor.19.d:0 "老李已经好几个晚上没有睡得踏实了，却一点也不困。全因再过一会，泛亚解放战争后第一班由自由中国航向仁川港的船就要驶离威海，而他正在这条船上。\n\n“祖国！”他看着正挂在自己小小船舱中的太极旗，这样想着。与故土分离的数十年，每逢夜晚，心中都充斥着凌乱纷繁的话语，令他不能安睡。那时他只能与这面旗帜哭诉，抚摸着“大韩独立万岁”的血书，一直从四十岁，到五十岁，再到现在，他已经六十多岁了。\n\n一个月前老李听说日本投降，连朝鲜半岛都完全放弃的时候，欣喜和疯狂冲淡了猛然间的震惊。他那天把自己小卖铺里所有的货物免费赠送给了十来年的老邻居们，见人便先用久未对人说出的韩语讲着“中国与韩国的自由万岁！”，尔后又用汉语复述一遍，老邻居们这才终于得到了许久未知的答案：老李原来是朝鲜人，或者说，是行将新生的大韩民国人。\n\n这段时间，他将几十年攒下的家产变卖为祖国需要的一些金银，仅余1940年金九先生手书加入光复军的证明，几件衣物。又于一周前在邻居们的簇拥下，登上中国政府为韩人们提供的，绘有太极旗的列车。在车厢中，老李和同胞们在觥筹交错间唱起《爱国歌》，强邀中国列车员们痛饮，狂笑着，流泪着，一杯又一杯地庆贺祖国的自由。\n\n“启航了！”随着船员们的喊声，韩人们在甲板上，中国人在港口上，用各自的语言高呼”解放万岁“，交错地挥舞起象征中韩友谊的两国旗帜，告别彼此。老李久久紧绷着的神经终于放松下来，视野因着泪水和涌起的睡意而模糊。\n\n十几个小时后，汽笛鸣响的声音和爆发的欢呼声震醒了老李，他知道，仁川到了，故土到了。船舱中一片混乱，所有人拥抱着彼此，组成庞大的人流涌向甲板，齐齐站在栏杆后面看向前方挂满国旗，模样愈发清晰的仁川港。\n\n汽船缓缓停入港位，身披着太极旗的韩人们早已不能掩住脸上的喜悦，用着最后的克制，排队登上祖国的土地。老李正在其中，他遥望向东，那是汉城的方向，他看见本土的同胞们用数百年前世宗大王创制的文字，欢迎他们归来。\n\n他知道，哪怕过去数十年，历尽无数苦难——"
 tnolar_chi_flavor.19.a:0 "汉江仍在奔流。"


 #唐山大地震
 tnolar_chi_flavor.500.t:0 "天灾"
 tnolar_chi_flavor.500.d:0 "高宗武被突如其来的电话铃声惊醒，顿时没了困意，他知道在这个点从内线打来的电话一定是最为紧急的突发事态，他赶忙起身举起话筒，里面传来秘书的声音：\n\n“总统阁下，有紧急事态，三分钟前北京和天津来电，当地出现小规模地震，北京少量建筑物受损，天津市宁河地区遭受部分损失，同时北方多座城市汇报了震感，核查中发现唐山地区已经全面失联，目前地震局正在……嗯……请稍等，总统阁下。”\n\n秘书的话突然停住，高宗武正想开口询问，秘书却突然继续说道：\n\n“地震局的报告刚刚送达，7月28日凌晨3时42分54秒，座标39.570°N 117.978°E也就是唐山地区丰南县城西9千米、唐山市中心西南18千米，矩震级7.5级，震源深度23千米。”\n\n“7.5级……”总统的嘴里嘟囔着，虽然他并不了解地震学，但这无疑是一场骇人的灾难。\n\n“电令周边主要城市，立刻组织救援队和救援物资，准备开赴救灾，同时联络国防部，让他们抽调周边部队协助救灾工作，还要让财政部拨款……看来免不了准备一次紧急会议了，各部门都要来，尽快通知到位吧。”\n\n“明白了，我立刻去办，总统阁下。”\n\n高宗武放下电话，坐在床边，揉了揉眼睛，长吁了一口气，自言自语道："
 tnolar_chi_flavor.500.a:0 "“人祸可防，天灾难料。”"





 #主权统一

 tnolar_chi.200.t:0 "主权统一"
 tnolar_chi.200.d:0 "自1840年鸦片战争起，中国就陷入了被逐步蚕食的苦难中。在至今的一百多年中，曾经出现过无数为之抗争的英雄人物，他们用自己的智慧、战斗乃至于牺牲为这个国家和民族寻找出路以及希望，然而，他们都失败了。现实很残酷，每失败一次，中国便在绝望的泥潭中多陷入一分。\n\n1949年的失败，可以说几乎彻底打断了中国人的脊梁骨——统一战线的失败象征着全国已经再难维持一个共识。如果在国家民族危难之际的联合都失败了，那么是否可以说明中华民族就是低人一等？这样的消极情绪弥漫在整个中华大地，人们在恍惚中度过了十数载。在战后被分割出去的军阀地区与中央政府的联系越发疏远。广东国从祖国母亲身上割下了一块肉，然后拼凑出了一个扭曲的怪物；满洲大地上，在工厂高耸的烟囱与城郊村外弥漫的罂粟烟中搓出了一个病态的国度。\n\n然而高宗武提出的现代化工程给了人们希望，新一代的年轻人们见到了国家日新月异的变化，从一个农业国迅速成长为一个自主的工业国。年轻人对于统一的呼声越发高涨，而高宗武也得到了千载难逢的机会：日本人同意中央政府收回山西、西康、广西这几个军阀势力，代价则是支出高额的托管费用以及重建费用。这笔巨款对于新兴的中国来说的确不是小数目，但她愿意付出。\n\n对高宗武来说，这几个军阀的回归只是第一步，接下来他要步步小心，时刻注意。"
 tnolar_chi.200.a:0 "中华秋海棠必将归于一统！"

 #西康

 tnolar_chi.201.t:0 "深夜之中" #西康是傀儡
 tnolar_chi.201.d:0 "一辆黑色轿车行驶在康定市夜晚的公路上，默默地向跑马山驶去。高宗武坐在后座中央，望着前方不断蜿蜒的道路，陷入了沉思。身旁的秘书突然打断他的思绪，用细小的声音说道：“总统阁下，您其实没有必要再这么小心翼翼吧，既然我们已经正式整合刘文辉的西康了，何不向昨天抵达的时候一样光明磊落的会谈呢？\n\n高宗武没有看向秘书，只是无言的望向窗外，秘书愣了一下，似乎以为高总统没有听见他的话，他正要再开口时，高宗武转头看向他，然后小声叹了口气，用冷漠而略带几分戏谑的语气对他说道：“光明磊落固然重要，但也要讲究时机和方法，我们当然还会进行很多所谓光明磊落的会谈，讨论经济，行政种种可以拿到上台面的话题。但是，你要知道，他们现在归顺于我们，只是迫于毛泽东和他的同党战败身死的震慑，如果想让这位刘将军真正支持我们，这些可是远远不够的，我们有必要让他知道，我们真正的计划……” \n\n“呃……您说的有道理，总统阁下……”面对总统的目光，秘书的声音显然变得有些紧张，但他还是继续说：“不过，还有一件事，总统阁下，既然您提到了，对于这次的行动，日本人......”\n\n“你提他们做什么，事已至此，我们绝无回头的可能，不成功，便成仁。”高宗武不耐烦的答道，之后便将目光移回了前方的道路。\n\n十五分钟之后，汽车已经到了目的地——跑马山深处的一座小寺庙，他们随便即走出轿车，面向等待着他们的刘文辉。\n\n刘文辉身着昔日国民革命军的军服，身旁站着几名士兵，月光映照在他们手中的武器上，反射着冰冷的光泽，这位主政西康的将军用不带表情的脸孔望向高宗武，说道：“很荣幸能与您会面，总统先生。我希望这场在我们重新建立关系后的首次会谈将会受益良多。不过我本以为会谈会是公开进行的，如今既然阁下如此要求，想必您还有其他想要向我阐明的吧......”说罢，他的目光便转趋严肃，一边缓缓打量着高宗武一行人。\n\n高宗武不为所动，随即便说：“刘将军，很感谢您能答允这次秘密会谈，我相信您必然会对我所言之事感兴趣的，"
 tnolar_chi.201.a:0 "相信我们可以达成让彼此满意的共识”"

 tnolar_chi.202.t:0 "深夜之中" #西康不是傀儡
 tnolar_chi.202.d:0 "一辆黑色轿车行驶在康定市夜晚的公路上，默默地路向跑马山驶去。高宗武坐在后座中央，望着前方不断蜿蜒的道路，陷入了沉思。身旁的秘书突然打断他的思绪，用细小的声音说道：“总统阁下，您真的确定这样做安全吗?您也知道，刘文辉一直在反对我们，而现在我们就带着这么几个人去密会。”他用眼神指了指旁边的一名保镖和正在开车的司机。“真的可以信任这一切吗？”\n\n高宗武没有看向秘书，只是无言的望向窗外，秘书愣了一下，似乎以为高总统没有听见他的话，他正要再开口时，高宗武转头看向他，然后小声叹了口气，用冷漠而略带几分戏谑的语气对他说道：“他要是想动手，大可在我们进入边境时这么做，那样方便得多，现在动手只会招来厄运，有什么理由会比民国总统在康定被暗杀更适合日本人出兵呢?”\n\n“呃…您说的有道理，总统阁下……”面对总统的目光，秘书的声音显然变得有些紧张，但他还是继续说：“不过，还有一件事，总统阁下，既然您提到了，对于这次的行动，日本人……”\n\n“你提他们做什么，事已至此，我们绝无回头的可能，不成功，便成仁。”高宗武不耐烦的答道，之后便将目光移回了前方的道路。\n\n十五分钟之后，汽车已经到了目的地——跑马山深处的一座小寺庙，他们随便即走出轿车，面向等待着他们的刘文辉。\n\n刘文辉身着昔日国民革命军的军服，身旁站着几名士兵，月光映照在他们手中的武器上，反射着冰冷的光泽，这位主政西康的将军用不带表情的脸孔望向高宗武，说道：“很荣幸能与您会面，总统先生。”话虽如此，他的语气中却似乎并没有多少荣幸。\n\n高宗武不为所动，随即便说：“很感谢您答允这次的会面，刘将军，我深深佩服您过人的胆识，"
 tnolar_chi.202.a:0 "相信我们可以达成让彼此满意的共识”"

 tnolar_chi.203.t:0 "一位特工" #西康是傀儡
 tnolar_chi.203.d:0 "张文武表面上只是康定市政府的一位普通公务员，过着平凡琐碎的日子，而实际上，他是现中华民国中执委特工总部的一位特工，在这里的工作只是他任务的一部分，他最近的任务是：“探查西康省政府基层公务员对于民国政府之态度，尽可能拉拢其对民国政府之忠诚，为日后之统一打下基础。”\n\n他放下这份几天前从接头人员那拿到的纸条，面对着书桌上的一盏油灯，看着里面的火焰在眼前一跳一跳，默默地燃烧，“这真不是一份讨喜的工作”他心里想到。他干得这一行，总部称之为“情报工作”，内行人称之为“特工”，浪漫主义作家则称之为“间谍活动”。虽然在上海或广东那些灯红酒绿的地方总是有不少愚蠢的电影来为他这一行做不实宣传，实际上，不论是“情报工作”，“特工”，还是说“间谍活动”，本质上都是卑鄙的勾当，背叛和出卖都是家常便饭……\n\n “至少，你不用参与那些最下流的勾当，不是吗?”他自我安慰到，说着便将那张纸条放在火焰上，看着它被点燃，烧成一小摊灰烬，落在书桌上，随即便被傍晚的微风慢慢吹散......就在这时，传来一阵很响的敲门声，以及一个青年人活泼的声音：“嘿，文武兄，要不要一起出去喝点啊，今天我请你！”果然是柳江清吗?他想到，这个年轻人是他刚来此地就认识的，是一位真正的公务员，而不是他这样的冒牌货，总是热情洋溢的面对着每一天。“他可真快活啊……”他一边想着，一边应道：“可以，没问题，我也正这么想呢！还有，你就不能每次敲门的时候小点声吗?我耳朵很好！”说着便起身前去开门。\n\n“我说，你知道吗，民国那边的广播最近好像特别关注我们这边啊。你说他们会不会是要把我们……兼并?”他们刚坐在平时常去的酒馆的一角，柳江清就突然说道。\n\n “这我可不好说，不过我劝你还是小心点，别老是用你改装的收音机到处乱听。”\n\n“害，不会有事的，你放心。”\n\n“不过，既然你提到了，要是兼并的话，你怎么看?”\n\n“坦白来说吧，我不在乎，我不信他们会把我们这些芝麻小官怎么样，顶多全部撤换呗。\n\n毕竟，你看，虽然我们现在变成了名义上的‘西康省’，日子不还是照着过吗？\n\n“那要是让你继续干呢？”张文武乘机问道\n\n“那当然最好啊，只要他们把我的工资端来，别的谁又在乎呢?”柳江清把双手揣进口袋，不屑地说。\n\n“是啊，你说的是......”张文武平静的答道，转头望向远处日暮中的群山和一片赤红的天际，没有继续说下去。\n\n“好了好了，我看你也没什么兴趣，你想要点什么，我食堂去点?”\n\n“就跟之前一样就行了”他随口应道，便继续望向窗外山边落下残阳，心里默念道："
 tnolar_chi.203.a:0 "“日暮西山……”"

