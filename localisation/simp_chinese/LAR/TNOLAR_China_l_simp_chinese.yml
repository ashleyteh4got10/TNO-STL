 CHI_LAR_Victims_of_diplomatic_games_idea:0 "外交博弈的牺牲品" #用在博弈成功的敌对国家，加debuff
 CHI_LAR_Victims_of_diplomatic_games_idea_desc:0 "在中国有一个古老的神话，是曾经天空上有十个太阳，把大地烤的炽热、把江河湖海烤到蒸发，民不聊生水深火热。一直以来它都被当成一个故事，但现在它却真实发生了——白日与旭日悬挂在我们的天空上，双日的碰撞所发出的烈焰与强光正在吞噬我们的一切，我们没有后羿，能做的只有祈祷，或是祈求其中一方的仁慈……"
 
 #GAW精神
 CHI_LAR_GAW_Operation_sun_set_dynamic_modifier:0 "落日行动"
 CHI_LAR_GAW_Operation_sun_set_dynamic_modifier_desc:0 "已经过了多少年了？究竟要从何时开始计算？是重庆变成废墟瓦砾的那一年吗？是卢沟桥响彻枪声的那一年吗？是爆炸声回荡在柳条湖那一年吗？亦或者，更早，黄海上舰炮齐鸣的那一年……东南沿海的大明百姓水深火热的那一年……\n\n倭寇打着反对昂撒殖民帝国的旗帜，蹂躏着中华儿女的灵魂；他们喊着泛亚主义东亚共荣的口号，吸食着中华大地的血肉。旭日光芒所至之处，并非欣欣向荣、生机勃勃，反而是成千上万死不瞑目的怨灵。而今天，这一切终于要有个了断了，成千上万的儿郎穿起军装拿起武器，他们将让青天白日回到中国的天空上，而旭日，也将由他们亲手埋葬。"
