 #GUI文本
 CHI_Ministry_of_National_Defense_GUI_Info_Info_tt:0 "§a中华民国国防部§!"
 CHI_Ministry_of_National_Defense_GUI_Info_tt_delayed:0 "§a兵者，国之大事，死生之地，存亡之道，不可不察也。§!\n\n自§R“大东亚圣战”§!结束已过去二十余载岁月，在£GFX_GNG_japanese_frustration_texticon §o日本§!的铁腕统治下，§B[CHI.GetFlag]中华民国§!的军事力量受到了严格的限制和监控。眼下，我们只能通过遍布日本势力的国防部来管理自己的部队：§Y而国防部本身，也并非绝对的铁板一块。§!\n\n在各方势力几十年的倾轧之后，现在的国防部中仅余三个主要的派系：§a民族派§!、§s中央派§!与§e华北派§!。不同派系主导将为现代化带来不同的效果，甚至会§R影响游戏结局§!。而他们各自的忠诚度也会进一步影响£GFX_LAR_CHI_mil_progress_texticon §Q军事现代化§!的效率。\n\n当£GFX_LAR_CHI_mil_progress_texticon §Q军事现代化进度§!到达§Y100%§!后，我们便可主动提升§Q军事化等级§!，加强我方的军队作战能力。但与此同时，我们也要小心来自£GFX_counter_intelligence_JAP §R暗处的监视……§!\n\n国防部内派系林立，国防部外处处监视。若要顺利完成£GFX_LAR_CHI_mil_progress_texticon §Q军事改革§!，我们必须在推进§Q现代化进程§!和避免引起§R日本的注意§!之间，努力找到平衡点。"

