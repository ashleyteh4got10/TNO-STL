 TNOLAR_CountryClosing_epilogue_generic: "感谢您玩通了一个国家的完整内容！模组里大量的工作成果当然要感谢我们的团队，但假如没有您，一切都只是一场空——在这一巨作的创造过程中，离不开像您一样的玩家们的鼎力支持：高质量水帖，高强度水群，在开发日志的评论区留言，加入伟大的TNO与TNOLAR社区。\n\n请务必拜访我们的社交媒体站点，点击开局界面右上角的问号按钮即可看到相关链接。\n\n另外，请关注我们的新内容。TNO与TNOLAR会持续更新，内容包括但不限于漏洞修复、补丁发布、内容更新、新国家。最后会有一次大更新，将游戏的时间线延长到1982年！"
 
 TNO_CountryClosing_epilogue_CHI_GAW_Success: "§R一百三十多载恍若无尽的屈辱之中§!，£GFX_GNG_chinese_nation_texticon §W白日§!终究冲破那束缚着的锁链，§W将光芒投向东亚大地§!。各民族沐浴其下，数十年的苦难似乎已然终结，取而代之的是一个更加平等的£GFX_LAR_CHI_government_texticon §W中国新秩序§!，§Y至少目前如此。§!\n\n只是£GFX_GNG_chinese_nation_texticon §W白日虽盛，§!§R却也为此付出了太多太多……§!§Y贫富差距，污染，剥削和城市秩序§!不可避免地恶化着。长久以来被忽视的§D乡村世界§!正悬于崖上：农民得到了自己的土地，但生存却§R愈发艰辛§!。§R大东亚战争§!的胜利推动着§G变革的呼声§!，无论庙堂之上，或市井之间，所有人都想知道，£GFX_LAR_CHI_flag_texticon §W中国§!的未来，是§D自由§!§R——还是踟蹰？§!\n\n时元[GetYear]年，§D终夺独立的中国人民嘶吼着奔向未来。百年来如影随形的漫漫长夜中，又将开出何样的花？§!"
