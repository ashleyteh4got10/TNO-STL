 TNOLAR_CountryClosing_credits_4: "§WTNOLAR制作组§!\n§W前成员§!\n§LAverage USSR Enjoyer, li kuo jan§! \n\nTNOSTL制作组\n§W现成员§!\n\n§G总策划：橘 雪莉、奶茶、Hayase Yuuka\n§G策划：枫丹不知名网友、暠旻、小黄瓜\n§G美工：阿浩、一只大吉岭酱、星光书记、锅包肉\n§G文案：大元帅、恒、小黄瓜、小邮差\n§G程序：橘 雪莉、奶茶、天藤千禧、恒、olele114、Entityback、暠旻、Gewalthaufen、GdanskInPolska\n§G测试：用了十五吨煤、卡利斯·塔留斯§!\n§G特别鸣谢：总设计师、sergey taboritsky、秋起、斫青客、前路、梦轻泷、LuckySmartPlayer、concored55\n§x——以及长久以来一直支持着我们的，你。§!\n\n"
