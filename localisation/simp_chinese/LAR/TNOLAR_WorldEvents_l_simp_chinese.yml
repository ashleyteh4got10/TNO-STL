  TNOLAR_WORLD.4.t: "[Get_newspaper_header]五个现代化宣告完成"
  TNOLAR_WORLD.4.desc: ""
  TNOLAR_WORLD.4.a: "好"

  TNOLAR_WORLD.5.t: "[Get_newspaper_header]共荣圈峰会即将在南京召开"
  TNOLAR_WORLD.5.desc: "共荣圈的形式在数月时间内发生了巨变。中华民国与大日本帝国的矛盾愈发激烈。中国各城市爆发了示威游行，抗议峰会的各种不平等条约，履行各协议的过程中也冲突不断。最后双方在军事现代化方面的相悖而行彻底引爆了矛盾。\n\n日本声称军事现代化是共荣圈的共同事务，需要在日本的领导以及《台北峰会协定》范围内实施，中华民国对于西藏的武力侵犯严重违反了协定，是对共荣圈秩序的赤裸无视。中国政府公开表示，军事现代化、国内统一是中国内政，外部无权干涉。越来越多的信息显示，高宗武政府与国内军阀联系越发密切。\n\n在最后一次外交协商后，双方决定在中华民国首都南京举行原定的共荣圈峰会，以商讨各项政策如何修改以达到真正落实。但更多观察家认为，双方矛盾将会迅速走向白热化。自由国家组织已经公开表示支持中华民国军事独立自主，团结协定也罕见的声明日本应当尊重他国内政自主权，南京再次成为了世界瞩目的焦点。"
  TNOLAR_WORLD.5.a: "还有什么好谈的？"
  TNOLAR_WORLD.5.b: "这群支那人……"
  TNOLAR_WORLD.5.c: "这会是某种前兆吗？"

  TNOLAR_WORLD.6.t: "[Get_newspaper_header]南京峰会谈判破裂"
  TNOLAR_WORLD.6.desc: "在台湾峰会结束后的事件里，作为共荣圈新崛起势力的中华民国和东亚共荣圈的霸主日本之间的矛盾越来越公开化，第一次峰会所达成的共识——经济、政治、民生、军事等各类政策领域中都存在冲突。最终，中华民国在以日本“协助训练”为掩护下进行的军事现代化将双方的矛盾推到了最高点。\n\n为缓和矛盾，中日在南京举行了南京峰会。日本在这次峰会中提出来的优厚条件让人难以拒绝，但高宗武政府最终仍旧否决了日本政府的协议，并表示日本必须在中国国土统一、双边贸易、军事自主上做出更多让步。双方的谈判破裂几成事实。各国观察家都预言，共荣圈内可能将要爆发一场剧烈的冲突，乃至于走向军事热战。无论如何，冷战一极的崩坏已经无法避免了。"
  TNOLAR_WORLD.6.a: "城头烽火再次燃起……"

  TNOLAR_WORLD.9.t: "[Get_newspaper_header]中国封锁青岛和威海" #游戏中暂未使用
  TNOLAR_WORLD.9.desc: "中国政府在没有任何声明的前提下迅速派兵封锁了原先割让给日本的青岛和威海及山东周边海域，并且几乎切断了其与外界的一切通讯手段，现在没有人知道那里发生了什么。\n\n世界各国对中国的强硬反制措施感到震惊，大日本帝国第一时间对中国表达了强烈谴责，指责这是在迫害日本国民，要求中国立即停止封锁，释放日方人员，并保障在鲁日本国民的人身安全。如果中方拒绝，日本将采取必要的军事措施。\n\n中国政府依然选择了向国际社会沉默，但却向突然宣布向团结协定和自由国家组织的新闻记者开放，允许其进入中国进行采访，世界都期待着这个敢于挑战旧秩序的国家会发出怎样的声音。"
  TNOLAR_WORLD.9.a: "让烈火烧得更旺些！"
  TNOLAR_WORLD.9.b: "共荣圈还有未来吗？"

  TNOLAR_WORLD.10.t: "[Get_newspaper_header]大东亚战争"
  TNOLAR_WORLD.10.desc: ""
  TNOLAR_WORLD.10.a: "好"

  TNOLAR_WORLD.12.t: "[Get_newspaper_header]中日签署上海条约"
  TNOLAR_WORLD.12.desc: "随着日本天皇停战诏书的发表，中日之间的博弈便从枪炮交锋战场转移到了舆论与外交的博弈，作为老练外交官的高宗武总统亲自带队开赴上海与日本外交使团展开谈判，而就在十几天漫长的交涉之后，中日双方在各国记者的见证下发表了联合宣言，并签署了上海条约。\n\n根据条约的内容，中华民国与大日本帝国的军事敌对状态将就此结束，中华民国将收回其所宣称的包括广东，满洲，蒙古，海南，威海卫，青岛，库页岛在内的领土；日本放弃对于朝鲜半岛的控制权，交由中华民国政府处置，划定对马海峡两岸周边地区为非军事区；日本将放弃中南半岛各国的控制权，允许其组建新的政府。在条约签署后，虽然各国外交发言人均表示了对于战争真正走向终点的祝贺；但是中国境内部分民族主义者对于台湾问题搁置的愤愤不平以及日本国内愈发严峻的政治经济局势均表明一场跨越西太平洋海岸的冷战正在上演。"
  TNOLAR_WORLD.12.a: "恭喜恭喜。"
  TNOLAR_WORLD.12.b: "……"
  TNOLAR_WORLD.12.c: "至少和平了。"

  TNOLAR_WORLD.13.t: "[Get_newspaper_header]南京宣言"
  TNOLAR_WORLD.13.desc: "就在今天早些时候，以中华民国为代表的泛亚解放同盟的各国高层领导人在中华民国外交部举行了会晤，共同起草并签署了决定东亚未来命运的《南京宣言》。\n\n该宣言表示，“泛亚解放同盟”将更名为“亚洲独立联盟”，并且由一个战时军事同盟转变为一个政治，外交与军事各方面的政府间国际组织；同时，各国还宣布成立了旨在促进各国经济发展与贸易交流的“亚洲经济共同体”作为各方经济合作的新平台。\n\n《南京宣言》的发表无疑代表着对于二战之后所确立的三极格局标志性改变，多国的观察家均表示，日本长久以来建立在其殖民地与傀儡国之上的国际地位将开始瓦解，而其与殖民地与傀儡国高度捆绑的经济系统亦将面临最严峻的挑战，同时由于战争失败对于军队士气和战斗力的打击将代表着日本将在很长一段时间内失去全球投射的实力。"
  TNOLAR_WORLD.13.a: "三十年未有之变。"

  TNOLAR_WORLD.14.t: "[Get_newspaper_header]日本在华秘密实验被揭露"
  TNOLAR_WORLD.14.desc: "近日，随着中国军队于满洲地区的持续推进，在夺取哈尔滨市之后中国部队发现了被称作日本关东军驻满洲第731防疫给水部队的相关设施，虽然该军队败逃之炸毁了部分建筑，但仍有大量设施完好。\n\n根据中国调查结果显示，此处设施是日军假借研究防治疾病与饮水净化为名，实则使用活体中国人、朝鲜人以及他国战俘进行生物武器与化学武器的效果实验，调查结果还表示日军在进行实验时曾大量使用活体解剖，病菌感染，无麻醉医疗等惨无人道的手段，该消息在公布之后立刻激起了国际社会无一例外的强烈谴责，并要求日本政府对这种反人类行为承担责任，虽然日本外务省发言人在第一时间遍否认了中方的调查结果，并将其称之为“可耻的污蔑”，但是其在后续提问中闪烁其词的行为无疑让先前的否认变得苍白无力。"
  TNOLAR_WORLD.14.a: "日寇的又一个罪证。"
  TNOLAR_WORLD.14.b: "这是诽谤！"
  TNOLAR_WORLD.14.c: "一场人道主义灾难…"

  TNOLAR_WORLD.15.t: "[Get_newspaper_header]唐山大地震"
  TNOLAR_WORLD.15.desc: "来自中国的最新消息已被确认，1976年7月28日，中华民国河北省唐山市周边爆发两次7级以上地震，据中国地震局的监测结果显示：主震于当地时间7月28日凌晨3时42分54秒，座标为唐山地区丰南县城西9千米、唐山市中心西南18千米，矩震级7.5级，震源深度23千米；第二次强震在同一天18时45分35秒，矩震级7.4级，座标为唐山市东矿区的吕家坨矿以西2千米、唐山市中心以东19千米，震源深度26千米。\n\n由于地震发生的时间和突然性且唐山地震没有小规模前震，而且发生于凌晨人们熟睡之时，使得绝大部分人毫无防备，对地震现象也甚不熟悉，中国的新闻发言人表示此次灾害的损失可能将极为严重，目前预计唐山超过70%的工业建筑、90%的居民建筑、80%的水泵站以及10%的下水管道遭到毁坏或严重损坏，而人员伤亡将难以估计。\n\n中国总统高宗武在紧急讲话中表示，目前以调集周边地区的军队十余万人奔赴抢险救灾工作，组建完成的医疗队和建筑队也正在开赴现场，希望能尽快恢复地区交通，扩大救援渠道。"
  TNOLAR_WORLD.15.a: "颓垣败壁遍荒村，千村能有几村存。"

##########################
### EMPIRE OF JAPAN 
##########################

  TNOLAR_WORLD.100.t: "[Get_newspaper_header]日本宣布对中华民国实施经济制裁"
  TNOLAR_WORLD.100.desc: "随着南京峰会谈判破裂，大日本帝国联合共荣圈内的其他国家对中华民国实施经济制裁。不仅对向中华民国出口的所有商品加以高额出口税，还勒令在华日企关闭部分工厂，完全撤出中国市场，试图逼迫中国就范。一时间中华民国的经济遭受重创。\n\n高宗武政府对此做出的反应包括实施同等规格的制裁，逐渐对大日本帝国的各项进出口的粮食，矿石产品，煤矿，化工原料等大宗商品实施禁运，取缔关闭的日本企业的工厂，并通过外交手段号召其他共荣圈国家开放对华进口贸易，加深经济合作。团结协定指责日本率先破坏国际贸易，自由国家组织对东亚地区的自由与人权问题表示严正关切，双方都采取了对中国政府的支持立场。各国观察家与政府幕僚都将目光投向了剑拔弩张的东亚地区。"
  TNOLAR_WORLD.100.a: "究竟是谁扼住了对方的喉咙……"
  TNOLAR_WORLD.100.b: "他们竟然还没有屈服？"

  TNOLAR_WORLD.101.t: "[Get_newspaper_header]日本宣布与大满洲帝国在大连地区进行军事演习"
  TNOLAR_WORLD.101.desc: "中日双方的冲突愈发激烈，在双方的互相制裁中，共荣圈的经济内部陷入了一片混乱。中华民国依靠自己庞大的体量撑过了日本的首轮制裁，而日本则陷入了安田危机与石油危机之后最严重的经济危机中。高额的通胀和生活物资稀缺让日本民众生活越发艰难，生产原料来源锐减几乎让工厂无法生产，日本不得已从共荣圈其他国家大量进口来缓解对中国的资源依赖。\n\n作为对中华民国反制裁的威慑，大日本帝国陆海军与大满洲帝国军队在大连及其周边海域地区举办了自1960年“守望珍珠”后最大规模的一次演习，代号“朝阳”。日本首相带领内阁成员全员到场检阅，这次军事演习实质上更像是一场军事威胁，对此高宗武政府仍旧保持着沉默，全世界都紧盯他们如何选择。"
  TNOLAR_WORLD.101.a: "他们以为这样就能吓倒我们吗？"
  TNOLAR_WORLD.101.b: "中国将重回吾等掌中。"
  TNOLAR_WORLD.101.c: "历史会再次重演吗？"

  TNOLAR_WORLD.102.t: "[Get_newspaper_header]日本封锁对马海峡隧道"
  TNOLAR_WORLD.102.desc: "随着中国军队在朝鲜半岛持续性攻势接连取得进展，日本军在该地区防线的不断收缩，日本政府表示为了避免进一步的损失并且确保本岛的安全，在撤出主要的人员和物资的情况下，将会对对马海峡隧道进行封锁。日本政府警告中方，任何强行通过隧道或破坏隧道的行为都将视为对日本本岛的侵犯，日方对此将被迫采取激烈手段。"
  TNOLAR_WORLD.102.a: "不过是狗急跳墙……"
  TNOLAR_WORLD.102.b: "这是必要之举……"
  TNOLAR_WORLD.102.c: "看来胜负已分"

  TNOLAR_WORLD.103.t: "[Get_newspaper_header]日本天皇发表终战诏书"
  TNOLAR_WORLD.103.desc: "随着东亚战事的不断推进，胜利的天平已然倒向了中华民国统领的泛亚解放同盟一方，虽然日本海军依旧牢牢封锁着海岸线，但是陆军早已在泛亚解放同盟军队的轮番攻击下濒临崩溃，国内越发严峻的政治与经济危机也在迫使日本政府退出战争。终于，在今日早晨，日本天皇罕见的对全体国民发表了电视讲话，宣布前线部队停止军事行动并请求与中华民国及其盟国展开和平谈判。\n\n此消息一经发出便对全世界造成了巨大的冲击。OFN以及团结协定的外交官再一次表示了对于中华民国主张的支持，也同样肯定了日本政府推进和平对话的选择。但目前日本外务省并未对外做出有关和平会谈具体细节的任何回应。\n\n不论如何，泛亚解放同盟的胜利已成事实，铺天盖地的鲜花与掌声迎向得胜归来的士兵，声势浩大的胜利游行正在东亚乃至其他国家的各大城市如火如荼的举行。"
  TNOLAR_WORLD.103.a: "终得海棠依旧。"
  TNOLAR_WORLD.103.b: "旭日依山近。"
  TNOLAR_WORLD.103.b: "改天换日终有时。"

  TNOLAR_WORLD.104.t: "[Get_newspaper_header]日本政府宣布成立紧急内阁"
  TNOLAR_WORLD.104.desc: "日本在大东亚战争中的失败无疑将成为二战后影响世界格局的最重大事件之一，这场战争彻底颠覆了日本在东亚乃至全世界的影响力，也使得长期依赖剥削共荣圈国家而获利的日本迅速走向崩溃，如今已经导致了其全国范围内的暴乱事件，各方势力均对现任政府表达了强烈不满。\n\n随着抗议活动的愈演愈烈，现任日本首相已经宣布了辞职，而政府的互相推卸之下更是无人愿意担任首相，于是大政翼赞会宣布将成立一个由文官组成的紧急内阁来维持国家秩序，但是基于国内严重的政治经济危机，和军队以及民众的持续不满，人们对该届内阁的命运并不看好。"
  TNOLAR_WORLD.104.a: "武士迟暮……"

##########################
### REPUBLIC OF KOREA
##########################

  TNOLAR_WORLD.201.t: "[Get_newspaper_header] 南德祐当选总统!"
  TNOLAR_WORLD.201.desc: "新生大韩民国的首次大选已经结束，结果令人难以置信。曾在中国军政时期担任财政长官，现在代表朝鲜半岛企业家和资本家的南德祐候选人当选为大韩民国的总统。\n\n在此次就职典礼上，总统表示大韩民国将成为亚洲的明珠，凭借八千万民族的团结，从广阔的中国市场开始，奠定出口经济的基础，最终在GDP上超越英国，展现出惊人的抱负。\n\n然而，一些人对此表示担忧。总统的承诺和言论仅集中在资本家以及国家财政方面，完全没有提及国民的福利或改善一直以来作为财阀奴隶工作的劳动者的待遇。因此，有些人甚至称总统为“另一个财阀”。"
  TNOLAR_WORLD.201.a: "有些不安啊……"

  TNOLAR_WORLD.202.t: "[Get_newspaper_header] 金信当选总统!"
  TNOLAR_WORLD.202.desc: "尽管社会秩序仍不稳定，但新生的大韩民国依然举行了自己的首次大选。作为金九之子及前中国空军飞行员，金信脱颖而出。\n\n在就职典礼上，金信总统表示，将实现民族和同胞从日帝遗留问题中的完全解放，并为一直作为财阀附属工厂运转的朝鲜半岛向经济民族化转型奠定基础。\n\n热情欢呼的支持者们认为，金信才是真正有资格成为大韩民族领袖的人，但这位新总统能否重振被破坏和遗弃的半岛，还需拭目以待。"
  TNOLAR_WORLD.202.a: "这个国家能存活下来吗？"

  TNOLAR_WORLD.203.t: "[Get_newspaper_header] 朴正熙发动政变"
  TNOLAR_WORLD.203.desc: "最近大韩民国的政治混乱加剧，这个新生国家的情况开始走下坡路。因大选以来一直被排除在外，那些前日本军队中的朝鲜人所组成的派系一直表示不满，今天他们终于决定采取行动。\n\n前满洲军军官高木正雄（朝鲜名朴正熙），现任大韩民国国军少将，召集这些前日本军队出身的派系发动了政变。自称“国家重建最高会议”的他们动用兵力占领了首尔，并取得了前总统的许可印章，作为胜利者登上舞台。\n\n新政权被预期会因为其前日本军队出身的背景而停止前政府的改革，但就任总统的朴正熙却表现出完全相反的态度。在首尔的演讲中，他宣布将“亲中态度、国家发展、民族复兴”作为国策，推动更加激进改革。而同时，对于曾经合作的亲日派军官的大规模逮捕和清洗已经开始。目前南京方面对于此事的反应尚不明朗。"
  TNOLAR_WORLD.203.a: "又一个疯狂开始了。"
  
  TNOLAR_WORLD.204.t: "[Get_newspaper_header] 崔圭夏掌权成为韩国总统！"
  TNOLAR_WORLD.204.desc: "大韩民国显然必须看新主人：中华民国的脸色行事，韩国民众对此心知肚明，因此，崔圭夏胜出也是自然的事。\n\n崔圭夏因其在众多韩国人中以眼光敏锐、知时务且能在屈膝之时仍谋取利益而闻名。这正是因为他在满洲国吉林省任职期间，尽力照顾朝鲜同胞的事迹广为流传所致。凭借国民的高度支持，崔圭夏今天就任大韩民国总统。\n\n然而，他在就职典礼上的威权主义发言引起了一部分观众的不满。除却从日本变成中国，其看待世界的观念仍停留在满洲国时期。不过，尽管崔圭夏总统的威权主义在某种程度上损害了自由，但大多数民众肯定会默默接受这一点。"
  TNOLAR_WORLD.204.a: "在生存之前，自由是奢侈品。"


