 JAP_LAR_showa_emperor_GAW_idea:0 "昭和天皇"
 JAP_LAR_showa_emperor_GAW_idea_desc:0 "昭和天皇，御名裕仁，他被塑造成皇祚延绵、武运昌隆的象征，国家稳定、社会发展的保证。但他自即位起便对政治漠不关心，或许是认为帝国的累累罪行早已无望纠正了。昔日的盟友如今反目成仇，帝国将以天皇的名义集结，一举击败可耻的叛逆。他的名号和所谓旨意将激励大日本帝国军队再次动摇中央之国。\n\n§R日本男儿接连以朕的名义死去。朕是否为天照之后，并不重要；但待朕往生之时，必入地狱之门。§!"
 JAP_LAR_showa_emperor_postwar_idea_tt:0 "稳定度:§R +???%§!"

 JAP_LAR_showa_emperor_postwar_idea:0 "昭和天皇"
 JAP_LAR_showa_emperor_postwar_idea_desc:0 "昭和天皇，御名裕仁，他被塑造成皇祚延绵、武运昌隆的象征，国家稳定、社会发展的保证。但他自即位起便对政治漠不关心，或许是认为帝国的累累罪行早已无望纠正了。反抗的怒火席卷了东亚，外强中干的军队被一步步击垮，而今的帝国失去了百年以来所积累的一切，§R所谓共荣，不过粉饰华年而已…§!\n\n§e罪行累累，罄竹难书，宗庙不问，此乃帝国结局，也是朕之宿命。§!"

