 JAP_TNOLAR_The_Emergency_Cabinet:0 "紧急内阁"
 POLITICS_TNOLAR_THE_EMERGENCY_CABINET_DESC:0 "帝国在大陆上遭遇了史无前例的溃败。共荣圈富庶之地沦丧于敌手。这场灾难性的危机第一个席卷了政界，首相在举国的咒骂中黯然辞职。而大政翼赞会中的政客、武官、部长只顾着互相攻讦，忙着撇清自己的责任，人人深知如今贸然站出来主持大局必然会成为众矢之的。在经过了无数次唇枪舌剑之后，紧急内阁被政客们一厢情愿的组建起来维持秩序并安抚民众，但这终究只是饮鸩止渴。悬挂在东亚数十载的旭日已经落下，这只不过是结束的开始……\n\n§x愿天照大神垂怜我等……§!"
 
