l_simp_chinese:

 TNOLAR_Pan_Asian_Liberation_Alliance: "泛亚解放同盟"
 #泛亚解放同盟
 TNOLAR_PALA_Leader: "解放同盟领导国"
 TNOLAR_PALA_Leader_effect: "[!TNOLAR_PALA_Leader]\n[ROOT.GetCHIGAWLiberationAlliancebaseidea1tt][ROOT.GetCHIGAWLiberationAlliancebaseidea2tt][ROOT.GetCHIGAWLiberationAlliancebaseidea3tt][ROOT.GetCHIGAWLiberationAlliancebaseidea4tt]"
 TNOLAR_PALA_Leader_desc: "在半殖民统治下屈辱生存一个多世纪的中华民族而今终于起而反抗，试图斩断日本禁锢在她身上的重重枷锁，将跨越百年的怒火如数奉还；不仅如此，她更要号召整个泛亚的人民奋起反抗，驱逐虚伪的日本帝国主义者，将真正的自由与解放带给泛亚民族。"

 TNOLAR_PALA_Member: "解放同盟成员国"
 TNOLAR_PALA_Member_effect: "[!TNOLAR_PALA_Member]\n[ROOT.GetCHIGAWLiberationAlliancebaseidea1tt][ROOT.GetCHIGAWLiberationAlliancebaseidea2tt][ROOT.GetCHIGAWLiberationAlliancebaseidea3tt][ROOT.GetCHIGAWLiberationAlliancebaseidea4tt]"
 TNOLAR_PALA_Member_desc: "在昔日共荣圈的重要成员国中华民国的号召之下，一些同样饱受日本帝国主义盘剥的国家选择追寻正义的步伐，加入了泛亚解放同盟的行列，他们将与中华民族一起向一切可耻的侵略者证明他们的祖国与民族永远不会屈服于暴政，一切往日的仇恨都将血债血偿。"

 TNOLAR_PALA_Guangdong: "粤港澳自治区"
 TNOLAR_PALA_Guangdong_effect: "[!TNOLAR_PALA_Guangdong]\n[ROOT.GetCHIGAWLiberationAlliancebaseidea1tt][ROOT.GetCHIGAWLiberationAlliancebaseidea2tt][ROOT.GetCHIGAWLiberationAlliancebaseidea3tt][ROOT.GetCHIGAWLiberationAlliancebaseidea4tt]"
 TNOLAR_PALA_Guangdong_desc: "由于日本对于广东地区长久以来的畸形统治，广东诞生独特的文化和统治形式，根据中华民国与原广东地区领导人的协商，其决定在未来一段时间内将广东作为自治区的形式存在，以此稳定当地民心，同时便于在未来更好的整合广东地区。"

 TNOLAR_Asian_Independent_Alliance: "亚洲独立联盟"
 #亚洲独立联盟
 TNOLAR_AIA_Leader: "泛亚解放者"
 TNOLAR_AIA_Leader_effect: "[!TNOLAR_AIA_Leader]"
 TNOLAR_AIA_Leader_desc: "在历经了大东亚战争的洗礼后，中华民族洗刷百年以来的耻辱，带领亚洲人民赶走了日本帝国主义者的盘剥，将一个崭新的泛亚带到了世人的眼前，以孙中山先生提出的“大亚洲主义”为基础，他们主张联合亚洲其他民族，建立平等自由、互助互利、共谋亚洲发展的亚洲区域主义，确保亚洲人民不受任何形式的帝国主义势力的威胁。"

 TNOLAR_AIA_Coequal: "亚洲独立联盟－平等成员国"
 TNOLAR_AIA_Coequal_effect: "[!TNOLAR_AIA_Coequal]"
 TNOLAR_AIA_Coequal_desc: "根据中华民国为号召反抗日本暴政的《南京宣言》，以及在此基础上提出的泛亚纲领，阵营中所有主权国家不论大小，民族，意识形态之别均享有平等的政治，经济和外交地位，纵然有很多人将之依旧视为一种糖衣炮弹，但不可否认的是这种崭新的泛亚伙伴关系为中华民国的外交扩展打下了良好的基础。"
 
 TNOLAR_AIA_Military_occupation: "亚洲独立联盟－军事占领区"
 TNOLAR_AIA_Military_occupation_effect: "[!TNOLAR_AIA_Military_occupation]"
 TNOLAR_AIA_Military_occupation_desc: "纵然亚洲独立联盟以解放亚洲诸国为主要目标，但是面对不同地区复杂的文化，历史等等问题，有时同样需要采取特殊手段来帮助当地重建秩序。根据《南京宣言》的内容，这些地区将暂时作为军事占领区，由联盟其他成员国协助其重建政府，恢复秩序，在不远的未来，这些地区终将独立。"
 
