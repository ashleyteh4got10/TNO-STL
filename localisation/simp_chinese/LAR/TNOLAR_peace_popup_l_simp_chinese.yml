l_simp_chinese:
  TNOLAR_PEACE_POPUP_WAR_CONSLUSION_GAW_NLF: "在大东亚战争的战火中，§Y[winning_country.GetNameWithFlag]§!击败了§Y[losing_country.GetNameWithFlag]§!殖民政府。"
  TNOLAR_PEACE_POPUP_WAR_CONSLUSION_GAW_CP: "在大东亚战争的战火中，§Y[winning_country.GetNameWithFlag]§!击败了胆敢反抗的§Y[losing_country.GetNameWithFlag]§!。"

  TNOLAR_PEACE_POPUP_WAR_CONSLUSION_NWW_QIN: "在西北荒漠的§O连天炮火§!之中，§Y[winning_country.GetNameWithFlag]§!彻底击溃了§Y[losing_country.GetNameWithFlag]§!，重新从日寇手中救下了饱受蹂躏的陕甘人民。"
  TNOLAR_PEACE_POPUP_WAR_CONSLUSION_NWW_GAN: "在西北荒漠的§R昏昏红日§!之下，§Y[winning_country.GetNameWithFlag]§!彻底消灭了§Y[losing_country.GetNameWithFlag]§!，又一群争取国家独立的志士魂归大地。"
  TNOLAR_PEACE_POPUP_WAR_CONSLUSION_NWW_DRAW: "在西北荒漠的§g滚滚狼烟§!之中，§Y[winning_country.GetNameWithFlag]§!抵御住了§Y[losing_country.GetNameWithFlag]§!的突袭，成功保卫了自己脚下的国土。"

  TNOLAR_PEACE_POPUP_FLAVOR_QIN: "恨不抗日死，留作今日羞。\n国破尚如此，我何惜此头？"
  TNOLAR_PEACE_POPUP_FLAVOR_GAN: "三十年噩梦，醒时归一眠。"
  TNOLAR_PEACE_POPUP_FLAVOR_DRAW: "风在吼，马在叫。\n黄河在咆哮，黄河在咆哮！"

  TNOLAR_PEACE_POPUP_FLAVOR_MAN: "为了发展而发展，是癌细胞的意识形态。"
  TNOLAR_PEACE_POPUP_FLAVOR_GNG: "企业之国轰然倒塌。"
  TNOLAR_PEACE_POPUP_GAW_win: "受降旗上日无色，贺劳樽前鼓似雷。\n莫道长年亦多难，太平看到眼中来。"