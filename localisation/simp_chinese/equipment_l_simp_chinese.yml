 ICBM_equipment:0 "洲际弹道导弹"
 ICBM_equipment_desc:0 "可以轻易对全球目标发动打击的超强力导弹。"
 MRBM_equipment:0 "中程弹道导弹"
 MRBM_equipment_desc:0 "射程几乎可以覆盖全球的强力导弹。"
 SRBM_equipment:0 "短程弹道导弹"
 SRBM_equipment_desc:0 "射程能够覆盖一整片大陆的强力导弹。"
