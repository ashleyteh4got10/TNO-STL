 TYM_anti_air_equipment_4_short:0 "S-300PMU"
 TYM_anti_air_equipment_4_desc:1 "S-300PMU2型由指挥中心、目标搜索雷达、制导站、48N6E2型导弹及4联装发射车等部分组成，能同时拦截6个目标，具有全天侯全空域作战能力。"

