 ENG_anti_air_equipment_4_desc:1 "长剑导弹系统的改进型，增加了一部跟踪雷达，能够装配8枚导弹，实现2枚导弹并行发射。可以攻击超音速、低空飞行和高机动的无人机、巡航导弹、直升机和固定翼飞机，可全天候作战。"

