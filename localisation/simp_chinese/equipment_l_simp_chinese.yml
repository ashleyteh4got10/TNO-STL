 IFV_aa_equipment:0 "轻型自行防空炮"
 IFV_aa_equipment_desc:0 "随着运动战理论被大多数国家所接受，火炮和辅助装备的自行运动势在必行。轻盈灵活、火力凶猛的自行防空炮可以在军队行进或撤退时抵御一切空中威胁。"
