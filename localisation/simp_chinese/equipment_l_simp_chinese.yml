 USA_infantry_equipment_5:0 "M4卡宾枪"
 USA_infantry_equipment_5_short:0 "M4卡宾枪"
 USA_anti_tank_equipment_0:0 "M9A1巴祖卡火箭筒"
 USA_anti_tank_equipment_0_short:0 "M9A1"
 USA_anti_tank_equipment_0_desc:0 "这款火箭筒因其外形类似圆筒状巴祖卡乐器而得名，作为等口径火箭筒的鼻祖，它的鼎鼎大名使得同一时期的其他反坦克武器都相形见绌。"
 USA_anti_tank_equipment_1:0 "M20B1超级巴祖卡火箭筒"
 USA_anti_tank_equipment_1_short:0 "M20B1"
 USA_anti_tank_equipment_1_desc:0 "巴祖卡火箭筒的改进型，口径扩大为89毫米，发射M28A1型破甲弹，最大射程为900米，可以击穿280毫米均质装甲。"
 USA_anti_tank_equipment_2:0 "M72轻型反装甲武器"
 USA_anti_tank_equipment_2_short:0 "M72 LAW"
 USA_anti_tank_equipment_2_desc:0 "M72 LAW最大的特点是采用了一种创新的概念：预封装的可以发射的火箭和使用后即弃的发射器。"
 USA_anti_tank_equipment_3:0 "M47“龙”式反坦克导弹"
 USA_anti_tank_equipment_3_short:0 "M47“龙”"
 USA_anti_tank_equipment_3_desc:0 "一款单兵肩扛便携式反坦克导弹系统，旨在摧毁装甲战斗车辆（尤其是坦克）、受装甲保护物体（如碉堡）和低空飞行的直升机（必要时）。"
 USA_anti_tank_equipment_4:0 "M136 AT4火箭筒"
 USA_anti_tank_equipment_4_short:0 "M136 AT4"
 USA_anti_tank_equipment_4_desc:0 "M136 AT4火箭筒属于预装弹、射击后抛弃的一次性使用武器，采用无后坐力炮发射原理，破甲深度可达420毫米。"
 USA_anti_air_shoulder_equipment_0:0 "SAM-G-1 “牛蛙”防空发射器"
 USA_anti_air_shoulder_equipment_0_short:0 "SAM-G-1 “牛蛙”"
 USA_anti_air_shoulder_equipment_1:0 "FIM-43“红眼”单兵防空导弹"
 USA_anti_air_shoulder_equipment_1_short:0 "FIM-43“红眼”"
 USA_anti_air_shoulder_equipment_1_desc:0 "FIM-43“红眼”地空导弹是美国第一种单兵肩射防空导弹。采用红外制导，该导弹可对付低空、超低空飞行的战斗机、直升机，用作前沿阵地和要地防空。"
 USA_anti_air_shoulder_equipment_2:0 "FIM-92A“毒刺”单兵防空导弹"
 USA_anti_air_shoulder_equipment_2_short:0 "FIM-92A“毒刺”"
 USA_anti_air_shoulder_equipment_2_desc:0 "用于取代老式的FIM-43红眼，FIM-92防空导弹主要用于城市作战和野战条件下单兵和地面装备对低空目标的打击。"
 USA_anti_air_shoulder_equipment_3:0 "FIM-92B“毒刺”单兵防空导弹"
 USA_anti_air_shoulder_equipment_3_short:0 "FIM-92B“毒刺”"
 USA_anti_air_shoulder_equipment_3_desc:0 "采用了POST导引头的防空导弹，使导弹可有效分辨背景讯号/诱饵/目标之间的差别，提高了目标的探测能力和抗红外干扰能力"
 USA_anti_air_shoulder_equipment_4:0 "FIM-92C“毒刺”单兵防空导弹"
 USA_anti_air_shoulder_equipment_4_short:0 "FIM-92C“毒刺”"
 USA_anti_air_shoulder_equipment_4_desc:0 "该型导弹加入了可改编程式微处理器（RMP）设计，让导弹寻标器可用软件升级的手段增强追踪能力、改善反制辨识，可针对战机常装设的反制系统提供反反制的可能性。"
 USA_motorized_equipment_0:0 "GMC CCKW"
 USA_motorized_equipment_1:0 "REO M35"
 USA_motorized_equipment_2:0 "REO M54"
 USA_motorized_equipment_3:0 "AM General M809"
 USA_motorized_equipment_4:0 "Oshkosh HEMTT"
 USA_artillery_equipment_2:0 "M114式155mm榴弹炮"
 USA_artillery_equipment_2_short:0 "M114榴弹炮"
 USA_artillery_equipment_3:0 "M59式155mm榴弹炮"
 USA_artillery_equipment_3_short:0 "M59榴弹炮"
 USA_artillery_equipment_4:0 "M198式155mm榴弹炮"
 USA_artillery_equipment_4_short:0 "M198榴弹炮"
 USA_artillery_equipment_5:0 "M777式155mm榴弹炮"
 USA_artillery_equipment_5_short:0 "M777榴弹炮"
 USA_anti_air_equipment_1:0 "90毫米M2防空炮"
 USA_anti_air_equipment_1_short:0 "M2防空炮"
 USA_anti_air_equipment_1_desc:0 "防空炮主要用来击落敌军的飞机，虽然速射火炮同样对地面目标有效。"
 USA_anti_air_equipment_2:0 "MIM-3“奈基-阿基克斯”地空导弹"
 USA_anti_air_equipment_2_short:0 "MIM-3地空导弹"
 USA_anti_air_equipment_2_desc:0 "MIM-3“奈基-阿基克斯”防空导弹通常被统一部署在大战略性目标周围，很快就取代了老式的大口径防空炮。"
 USA_anti_air_equipment_3:0 "MIM-23“霍克”式地空导弹"
 USA_anti_air_equipment_3_short:0 "MIM-23地空导弹"
 USA_anti_air_equipment_3_desc:1 "一种低层导弹防御系统，主要用于中程、中低空防御。可对付喷气式飞机、旋翼飞机、无人机和巡航导弹等各种目标，该系统为机动式，具有全天候/昼夜作战，火力猛、可靠性高、抗电子干扰能力强等优点。"
 USA_anti_air_equipment_4:0 "MIM-104“爱国者”地空导弹"
 USA_anti_air_equipment_4_short:0 "MIM-104地空导弹"
 USA_anti_air_equipment_4_desc:1 "爱国者防空导弹是美国研制的第三代中远程、中高空地空导弹系统，是美军为适应未来复杂的作战环境和不断变化发展的空中突击力量所造成的威胁而提出研制的。"

