    # 西北国防阵线
 CPC_infantry_equipment_0:0 "六五式步枪"
 CPC_infantry_equipment_0_short:0 "六五步枪"
 CPC_infantry_equipment_0_desc:0 "西北抗日根据地克服艰难环境，在毛瑟步枪基础上设计制造，发射日本六五口径弹药的步枪。"
 CPC_infantry_equipment_1:0 "向应式半自动步枪"
 CPC_infantry_equipment_1_short:0 "向应式"
 CPC_infantry_equipment_1_desc:0 "根据地在日本三八式步枪基础上改进而成的半自动步枪，为纪念关向应同志而以他的名字命名。"
 CPC_infantry_equipment_2:0 "五五式半自动步枪"
 CPC_infantry_equipment_2_short:0 "55式"
 CPC_infantry_equipment_2_desc:0 "通过对缴获自日伪军的五式半自动步枪的研究，根据地兵工厂在其基础上成功地研制了五五式半自动步枪，并对其做出了一系列改进。"
 CPC_infantry_equipment_3:0 "六七式自动步枪"
 CPC_infantry_equipment_3_short:0 "67式"
 CPC_infantry_equipment_3_desc:0 "我们通过解放内蒙后缴获到的日寇概念枪的图纸，研发了这款新型步枪，它具备全自动射击能力，使用20发弹匣供弹并配备两脚架。"
 CPC_infantry_equipment_4:0 "七七式自动步枪"
 CPC_infantry_equipment_4_short:0 "77式"
 CPC_infantry_equipment_4_desc:0 "七七式自动步枪仿自美国M16自动步枪，它采用了轻便的聚合物材料、小口径高初速子弹等我们闻所未闻的技术，具有后坐力低、精度高等优点。七七式自动步枪让我军的轻武器第一次达到国际先进水平。"
 CPC_infantry_equipment_5:0 "八七式自动步枪"
 CPC_infantry_equipment_5_short:0 "QBZ-87"
 CPC_infantry_equipment_5_desc:0 "QBZ-87是一款现代化的自动步枪，轻便灵活，虽然枪管更短，但先进的发射药让它的精度不降反增。可靠性更强，适合各种作战行动，并且可以兼容各种配件。"
 CPC_anti_tank_equipment_0_desc:0 "苏制PTRD-41反坦克步枪和自制的集束手榴弹是我们面对日寇战车的最后一道防线。"
 CPC_anti_tank_equipment_1_desc:0 "我们成功地仿制了日制四式反坦克火箭筒，并在一线部队中普及了二式反坦克枪榴弹，让日寇的战车不得不继续拉开和我们步兵之间的距离。"
 CPC_anti_tank_equipment_2:0 "六七式89mm火箭筒"
 CPC_anti_tank_equipment_2_short:0 "89火"
 CPC_anti_tank_equipment_2_desc:0 "这种单兵肩托式反装甲支援武器，轻便、造价低廉、操作简单而火力强大，除了可以打击日寇战车以外，更可以拔除各种碉堡和火力点。"
 CPC_anti_tank_equipment_3:0 "七七式84mm无后坐力炮"
 CPC_anti_tank_equipment_3_short:0 "84无"
 CPC_anti_tank_equipment_3_desc:0 "这种单兵肩扛式无后坐力炮，以其便携、低成本和可使用多种弹药的特点成为了一种著名的中程多用途武器。"
 CPC_anti_tank_equipment_4:0 "“红箭”-84反坦克导弹"
 CPC_anti_tank_equipment_4_short:0 "HJ-84"
 CPC_anti_tank_equipment_4_desc:0 "基于美国FGM-77“龙”式反坦克导弹研制的第二代单兵便携式反坦克导弹，主要用于中距离攻击坦克、步兵战车和其它装甲车辆，也可攻击野战工事等目标。"
