 MBT_chassis_5:0 "现代主战坦克底盘"
 MBT_chassis_5_desc:0 "新开发的计算机科技能用于制造集成电子火控系统，让主战坦克能够在更远的距离以更高的精度攻击目标，还能减轻车组成员在战斗时的负荷。"
 heavy_tank_equipment:0 "重型坦克"
 heavy_tank_chassis_desc:0 "重型坦克"
 heavy_tank_chassis_0:0 "早期重型坦克底盘"
 heavy_tank_chassis_0_desc:0 "早在二战，重型坦克就是战场之王，拥有着无可比拟的火力与装甲。虽然现在这些令人尊敬的机器仍在次要战场作战，但也难逃逐渐被淘汰的命运。"
 heavy_tank_equipment_0:0 "早期重型坦克"
 heavy_tank_equipment_0_desc:0 "早在二战，重型坦克就是战场之王，拥有着无可比拟的火力与装甲。虽然现在这些令人尊敬的机器仍在次要战场作战，但也难逃逐渐被淘汰的命运。"
 heavy_tank_chassis_1:0 "基础型重型坦克底盘"
 heavy_tank_chassis_1_desc:0 "二战后，重型坦克需要更进一步的发展以适应战场上的新变化，随着飞机和便携式反坦克武器的威胁提升，重型坦克的装甲也需要大幅度加强。"
 heavy_tank_equipment_1:0 "基础重型坦克"
 heavy_tank_equipment_1_desc:0 "二战后，重型坦克需要更进一步的发展以适应战场上的新变化，随着飞机和便携式反坦克武器的威胁提升，重型坦克的装甲也需要大幅度加强。"
 heavy_tank_chassis_2:0 "改良型重型坦克底盘"
 heavy_tank_chassis_2_desc:0 "随着核战威胁的迫近，升级了核防护内衬的重型坦克可以在辐射环境中作战。尽管已经过时，重型坦克仍然能在强大的工业产能支持下有一战之力。"
 heavy_tank_equipment_2:0 "改良型重型坦克"
 heavy_tank_equipment_2_desc:0 "随着核战威胁的迫近，升级了核防护内衬的重型坦克可以在辐射环境中作战。尽管已经过时，重型坦克仍然能在强大的工业产能支持下有一战之力。"
 heavy_tank_chassis_3:0 "先进型重型坦克底盘"
 heavy_tank_chassis_3_desc:0 "尽管重型坦克和主战坦克相比好似一块活化石，但在一些军事氛围浓厚的国家它仍享有展现力量的殊荣。但就坦克乘员来说，他们更喜欢乘员生存性更好的坦克。"
 heavy_tank_equipment_3:0 "先进型重型坦克"
 heavy_tank_equipment_3_desc:0 "尽管重型坦克和主战坦克相比好似一块活化石，但在一些军事氛围浓厚的国家它仍享有展现力量的殊荣。但就坦克乘员来说，他们更喜欢乘员生存性更好的坦克。"
 superheavy_tank_equipment:0 "超重型坦克"
 superheavy_tank_chassis_desc:0 "超重型坦克"
 superheavy_tank_chassis_0:0 "早期超重型坦克底盘"
 superheavy_tank_chassis_0_desc:0 "生于军工满足战争时民意的需要，超重型坦克能像巨大怪兽一般，用它的火力夷平一个小镇，嗯，只要不在出厂时陷在泥里。"
 superheavy_tank_equipment_0:0 "早期超重型坦克"
 superheavy_tank_equipment_0_desc:0 "生于军工满足战争时民意的需要，超重型坦克能像巨大怪兽一般，用它的火力夷平一个小镇，嗯，只要不在出厂时陷在泥里。"
 superheavy_tank_chassis_1:0 "基础超重型坦克底盘"
 superheavy_tank_chassis_1_desc:0 "像是受到世纪初海军军备竞赛的诅咒一般，超重型坦克成了军队力量的象征。被建造得更大并加装对空武器，超重型坦克的存在就是在否定战场常识。"
 superheavy_tank_equipment_1:0 "基础超重型坦克"
 superheavy_tank_equipment_1_desc:0 "像是受到世纪初海军军备竞赛的诅咒一般，超重型坦克成了军队力量的象征。被建造得更大并加装对空武器，超重型坦克的存在就是在否定战场常识。"
 superheavy_tank_chassis_2:0 "改良型超重型坦克底盘"
 superheavy_tank_chassis_2_desc:0 "作为一种宣传意义远大于实战意义的武器平台，超重型坦克向外界展示了一个国家对战争的决心。尽管造价是主战坦克的好几倍，超重型坦克能提供相当大的宣传效能。"
 superheavy_tank_equipment_2:0 "改良型超重型坦克"
 superheavy_tank_equipment_2_desc:0 "作为一种宣传意义远大于实战意义的武器平台，超重型坦克向外界展示了一个国家对战争的决心。尽管造价是主战坦克的好几倍，超重型坦克能提供相当大的宣传效能。"
 superheavy_tank_chassis_3:0 "先进型超重型坦克底盘"
 superheavy_tank_chassis_3_desc:0 "养了个羊\"
 superheavy_tank_equipment_3:0 "先进型超重型坦克"
 superheavy_tank_equipment_3_desc:0 "养了个羊\"
 NSB_MBT_1945_modules_1:0 "扩大燃油容量"
 NSB_MBT_1945_modules_1_desc:0 "扩大战车的燃油容量，能增强其在不停车加油的情况下长时间行动的能力。"
 NSB_MBT_1945_modules_2:0 "安装推土铲"
 NSB_MBT_1945_modules_2_desc:0 "在战车上安装推土铲，使其得以操纵环境并协助建筑堑壕。"
 NSB_MBT_1950_modules_1:0 "主炮稳定器"
 NSB_MBT_1950_modules_1_desc:0 "炮管稳定器，能够在车辆移动时大大降低武器的不稳定性，并能在移动中精确射击。"
 NSB_MBT_1950_modules_2:0 "自动灭火装置"
 NSB_MBT_1950_modules_2_desc:0 "用于扑灭载具内火灾、降低火灾损害的装置"
 NSB_MBT_1960_modules_1:0 "遥控自动火炮"
 NSB_MBT_1960_modules_1_desc:0 "一座小型无人自动机炮，由车体内的一位乘员进行远程控制。"
 NSB_MBT_1960_modules_2:0 "爆破反应装甲"
 NSB_MBT_1960_modules_2_desc:0 "一种先进的防护装甲，旨在通过引爆自身来干扰迎面而来的射弹。"
 NSB_IFV_1945_modules_1:0 "烟幕发射器"
 NSB_IFV_1945_modules_1_desc:0 "允许战车在其前进路径上放出烟幕的装置，还能为友军提供视觉掩护，可能有助于攻势。"
 NSB_IFV_1945_modules_2:0 "改良车长光学设备"
 NSB_IFV_1945_modules_2_desc:0 "改良光学设备可用于协助载具乘员看清周边，在被发现之前识别出敌军方位。"
 NSB_IFV_1950_modules_1:0 "专用取暖器"
 NSB_IFV_1950_modules_1_desc:0 "专为保证乘员温暖、随时准备投入战斗而设计的配置。"
 NSB_IFV_1950_modules_2:0 "改良光学设备"
 NSB_IFV_1950_modules_2_desc:0 "集成式夜视、红外及热成像瞄准设备，专为提升低光照、高烟尘作战环境下的视野清晰度与目标捕捉能力设计。"
 NSB_IFV_1960_modules_1:0 "自动装弹机"
 NSB_IFV_1960_modules_1_desc:0 "自动装填弹药的机械装置，取代了装填手。"
 NSB_IFV_1960_modules_2:0 "专业反装甲武器"
 NSB_IFV_1960_modules_2_desc:0 "冷战时期，坦克装甲技术持续发展，轻量化作战车辆与武器平台为保持作战效能，亟需研发性能更先进的反装甲武器。无论是研制现代化高初速火炮，还是为这类车辆直接配备导弹，各国军工研发部门再次印证了人类的智慧巧思。"
 NSB_artillery_MODULE:0 "车载武器开发"
 NSB_artillery_MODULE_desc:0 "研究用于装甲载具的武器，以同外国不断进步的装甲设计竞争。"
 NSB_antiair_MODULE:0 "车载防空武器开发"
 NSB_antiair_MODULE_desc:0 "车载防空武器的发展，允许载具在保留装甲防护的情况下将敌方飞机阻拦于领空之外。"
 NSB_APC_1950_basic_turret:0 "基础炮塔改进"
 NSB_APC_1950_basic_armor:0 "基础装甲改进"
 NSB_APC_1960_basic_turret:0 "改良型炮塔改进"
 NSB_APC_1960_basic_armor:0 "改良型装甲改进"
 NSB_APC_1970_basic_turret:0 "先进型炮塔改进"
 NSB_APC_1970_basic_armor:0 "先进型装甲改进"
 NSB_APC_1980_basic_turret:0 "半现代炮塔改进"
 NSB_APC_1980_basic_armor:0 "半现代装甲改进"
 NSB_artillery_1950_SA:0 "50年代火炮武器升级"
 NSB_artillery_1950_SA_desc:0 "这些炮弹产量高、成本低，适用于二战时期的火炮。它们能有效地摧毁硬目标、提供火力支持，是现代战争中必不可少的武器。"
 NSB_artillery_1950_SA_2:0 "50年代火炮武器升级"
 NSB_artillery_1950_SA_2_desc:0 "这些炮弹产量高、成本低，适用于近来生产的火炮。它们能有效地摧毁硬目标、提供火力支持，是现代战争中必不可少的武器。"
 NSB_artillery_1950_SA_3:0 "50年代火炮“底排弹”"
 NSB_artillery_1950_SA_3_desc:0 "近来火炮方面产生了一项可以提高射程的创新，名为“底排弹”，是一种从壳体后部释放出少量燃气以提高空气动力学效率的设计。如果设计得当，这种技术可以让炮弹的射程远16-30%。"
 NSB_artillery_1970_SA:0 "70年代火炮武器升级"
 NSB_artillery_1970_SA_desc:0 "这些炮弹产量高、成本低，适用于近来生产的火炮。它们能有效地摧毁硬目标、提供火力支持，是现代战争中必不可少的武器。"
 NSB_artillery_1970_SA_2:0 "70年代火炮“底排弹”"
 NSB_artillery_1970_SA_2_desc:0 "近来火炮方面产生了一项可以提高射程的创新，名为“底排弹”，是一种从壳体后部释放出少量燃气以提高空气动力学效率的设计。如果设计得当，这种技术可以让炮弹的射程远17-30%。"
 NSB_artillery_1970_SA_3:0 "70年代火炮火箭推进炮弹"
 NSB_artillery_1970_SA_3_desc:0 "这些价格昂贵的火箭助推器内部装有小型火箭发动机，可以将炮弹射到实际需要的任何地方。"
 NSB_antiair_1950_AA:0 "50年代防空武器升级"
 NSB_antiair_1950_AA_desc:0 "尽管我们的高炮很强，但面对喷气式飞机时已力不从心。加装改进型观瞄、雷达扫描器、优化告警逻辑能最大程度提升攻击力。"
 NSB_antiair_1950_AA_2:0 "50年代防空高炮口径升级"
 NSB_antiair_1950_AA_2_desc:0 "喷气式飞机使得过去的小口径高炮变得毫无用处。在这个崭新的可怖世界里，口径更大的炮，再配上更长的射程和更快的弹速，是我们唯一实用的选择。"
 NSB_antiair_1950_AA_3:0 "50年代防空高炮雷达"
 NSB_antiair_1950_AA_3_desc:0 "用常规高射炮基本不可能击落喷气式飞机。然而，尽管依然不甚精确，使用雷达引导高炮将有助于炮火击中目标。"
 NSB_antiair_1970_AA:0 "70年代防空武器升级"
 NSB_antiair_1970_AA_desc:0 "尽管我们的高炮很强，但面对喷气式飞机时已力不从心。加装改进型观瞄、雷达扫描器、优化告警逻辑能最大程度提升攻击力。"
 NSB_antiair_1970_AA_2:0 "70年代防空高炮口径升级"
 NSB_antiair_1970_AA_2_desc:0 "喷气式飞机使得过去的小口径高炮变得毫无用处。在这个崭新的可怖世界里，口径更大的炮，再配上更长的射程和更快的弹速，是我们唯一实用的选择。"
 NSB_antiair_1970_AA_3:0 "70年代防空高炮雷达"
 NSB_antiair_1970_AA_3_desc:0 "用常规高射炮基本不可能击落喷气式飞机。然而，尽管依然不甚精确，使用雷达引导高炮将有助于炮火击中目标。"
