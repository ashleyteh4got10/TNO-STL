 MBT_aa_chassis_desc:0 "重型自行防空炮"
 MBT_aa_equipment:0 "重型自行防空炮"
 MBT_aa_equipment_desc:0 "重型防空炮可以用强力的炮弹击落敌军的轰炸机和其他重型飞行器，是保护我方陆军免受轰炸的不二选择。重型自行防空炮不再需要拖曳或是拆分成零件运送，可动的底盘给它们提供了更好的自主性和机动性。"
