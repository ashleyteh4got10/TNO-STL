 WRS_anti_tank_equipment_0:0 "PTRD反坦克步枪"
 WRS_anti_tank_equipment_0_short:0 "PTRD"
 WRS_anti_tank_equipment_0_desc:0 "单发14.5毫米口径反坦克步枪，在攻击早期坦克时表现出良好的性能。即使现在性能落伍，在攻击卡车和其他轻装甲目标时依然十分有效。"
 WRS_anti_tank_equipment_1:0 "RPG-2火箭筒"
 WRS_anti_tank_equipment_1_short:0 "RPG-2"
 WRS_anti_tank_equipment_1_desc:0 "发射超口径空心装药破甲弹，能击毁100m以内的活动和固定的装甲目标，杀伤乘员，破坏武器装备等。"
 WRS_anti_tank_equipment_2:0 "RPG-7火箭筒"
 WRS_anti_tank_equipment_2_short:0 "RPG-7"
 WRS_anti_tank_equipment_2_desc:0 "单兵肩托式反装甲支援武器，轻便、造价低廉、操作简单而火力强大。"
 WRS_anti_tank_equipment_3:0 "RPG-16火箭筒"
 WRS_anti_tank_equipment_3_short:0 "RPG-16"
 WRS_anti_tank_equipment_3_desc:0 "RPG-16火箭筒在RPG-7基础上改进而成，发射原理和结构特征基本相似，但破甲威力和射击精度都明显高于后者。"
 WRS_anti_tank_equipment_4:0 "RPG-29“吸血鬼”火箭筒"
 WRS_anti_tank_equipment_4_short:0 "RPG-29"
 WRS_anti_tank_equipment_4_desc:0 "一种可重复使用的便携式火箭筒，发射串联式空心装药破甲战斗部，主要用来抗击第三代主战坦克。"
