 POLITICS_DAVID_LANSANA_DESC: "当世界在德国装甲部队与日本战舰的威压下颤抖时，旧霸主纷纷陨落，新生的希望之国挣脱枷锁崛起。塞拉利昂共和国便是其中之一——这个昔日的英属非洲殖民地，如今羽翼未丰的民主政体（尽管注定无法长久）。共和国宣告成立、民选政府上台仅四天后，大卫·兰萨纳准将便率军队武力占领了首都。\n\n1922年出生于门德族显赫家族的兰萨纳，是少数被选派赴英国接受军官训练的塞拉利昂人。归国后，他迎娶门德族最高酋长之女，政治人脉愈发盘根错节。随着英国仓促撤离非洲，兰萨纳执掌塞拉利昂武装部队。尽管标榜捍卫民主，但当反对派赢得建国首次大选时，这位将军毫不犹豫发动政变，如今俨然成为新政权领袖。\n\n兰萨纳政权自始便危机四伏：愈演愈烈的门德民族主义与种族优越论激化族群冲突，安德鲁·贾克森-史密斯等将领与地方军阀势力日渐坐大。随着权力根基动摇、经济复苏乏力，这位将军的独裁统治至今未倒，唯一原因或许只是反对派尚未结成统一战线——至少眼下如此。"
