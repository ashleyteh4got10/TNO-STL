 MDI_idea_disloyal_army: "不忠诚的军队"
 MDI_idea_disloyal_army_desc: "军队是塞拉利昂艰难政治局势的缩影——混乱、分裂、支离破碎。大卫·兰萨纳的政变正是依靠该国最重要、最具权势的将军们的支持才得以实施；然而，军队内部的不满情绪依然盛行，这在围绕安德鲁·贾克森-史密斯形成的派系中表现得最为明显。\n\n这支军队不仅缺乏忠诚，而且四分五裂。门迪族将领和士兵普遍支持同族的兰萨纳，但克里奥尔人和泰姆尼人等群体则认为贾克森-史密斯是更平易近人的领袖。更糟的是，反政变的谣言正像野火般蔓延，而兰萨纳绝不愿轻易放弃刚刚攫取的权力。可以肯定的是，塞拉利昂与军队的纠葛远未结束。"
 MDI_idea_disorganized_political_spheres: "混乱的政治领域"
 MDI_idea_disorganized_political_spheres_desc: "西非废墟上的政变素以三大特征闻名——迅疾、频繁、混乱。大卫·兰萨纳领导的塞拉利昂最新政变堪称完美示范。各类运动的支持者在首都高调宣扬各自的主张，而兰萨纳的新政府在这个本就难以治理的地区举步维艰。\n\n更添乱局的是众多反对派领袖的崛起。一方面，被推翻的前总理米尔顿·马尔盖的支持者在塞拉利昂地方政坛仍具影响力；另一方面，民众为崛起的新星西亚卡·史蒂文斯欢呼鼓掌。军方将领们则私下议论，认为需要一位更具凝聚力的领导者——他们相信安德鲁·贾克森-史密斯正是此人。一切迹象都表明，塞拉利昂正走向一场即将爆发的危机高潮。只要混乱持续，这场高潮就会越来越近，直至彻底爆发。"