 SEN_idea_SENofian_stiffness: "塞内加尔的僵局"
 SEN_idea_SENofian_stiffness_desc: "塞内加尔是西非最古老的稳定政权之一，但这种稳定建立在脆弱的基础之上。政府必须谨慎平衡深受桑戈尔派拥护的泛非“黑人精神”意识形态，与希望保持特权地位的沃洛夫族多数群体的利益。这个所谓的共和国距离真正平等的民主制度依然遥远。"