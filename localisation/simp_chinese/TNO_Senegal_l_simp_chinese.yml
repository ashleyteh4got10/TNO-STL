 POLITICS_LEOPOLD_SEDAR_SENGHOR_DESC: "16年的漂泊。这就是塞内加尔共和国首任总统利奥波德·塞达尔·桑戈尔找到心灵归宿所耗费的时光。这位精通法语的诗人与知识分子，是殖民时期少数能进入索邦大学深造的黑人精英，毕业后更成为法语语法教授。尽管他公开抨击法国社会的种族主义，却仍选择加入法军抗击纳粹，坚信未来人类终将平等相待。可惜现实未能如愿。被德军俘虏后，他和战友们因健康原因侥幸免于处决，最终获释离开战俘营。\n\n战争结束时，当欧洲解放的希望彻底破灭，桑戈尔回到西非，从昏聩的维希殖民政府手中夺回控制权。新生的塞内加尔共和国奠基于非洲解放与“黑人精神”原则之上——后者是由桑戈尔参与创立的反殖民理念，强调强大的非洲民族文化认同。然而矛盾的是，桑戈尔总统仍与旧法国保持密切往来，不仅与戴高乐私交甚笃，更允许法国官员进入其政府任职。\n\n这种暧昧立场招致批评者的尖锐指责：他一面呼吁非洲解放，一面对昔日压迫者效忠，这种割裂何其讽刺。毕竟老虎不必声明自己是老虎，它直接扑向猎物；黑人亦无需征得白人的许可来执政，理应夺回天赋之权。由于政府内缺乏有力反对派，塞内加尔政坛逐渐陷入僵化，泛非革命者企图推翻桑戈尔及其法国盟友，建立喀麦隆式的革命政权。但既然已找到归宿，这位漂泊者再无流浪之意。桑戈尔决心将塞内加尔铸就成全非洲的灯塔，为此不惜付出任何代价。"
