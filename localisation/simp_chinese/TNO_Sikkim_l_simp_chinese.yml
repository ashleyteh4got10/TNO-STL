 POLITICS_TASHI_NAMGYAL_DESC: "锡金第十一世却嘉暨首位独立统治锡金的塔希·纳姆加尔，主导了该国二十世纪的历程，引领这个古老国度迈向新时代。\n\n纳姆加尔出生于西藏，因兄长早逝而继承王位，由达赖喇嘛任命为却嘉继任者。年少即位后，他在宫廷和英属印度当局的辅佐下维系着这个封闭王国的安宁，未曾预见即将到来的变革。\n\n当旧秩序被新格局取代时，锡金的主权从英属印度移交至新生的独立印度。面对成长阵痛中的印度，纳姆加尔选择维持现状。随着自由印度政权的成立，他积极与之合作推动锡金现代化，同时强力推行迟滞的土地改革。\n\n尽管他因对医疗、艺术和科学事业的慷慨资助而广受不丹-雷布查族群爱戴，并普遍获得尼泊尔裔民众认可，但纳姆加尔个人的声望并未转化为对整个锡金君主制度的支持。当年迈的却嘉以忧郁目光凝视自己的王国时，心中始终萦绕着一个问题：\n\n“我之后，锡金何去何从？”"
 SIK_Darbar_or_Democracy: "要国王还是要民主？"
 SIK_Darbar_or_Democracy_desc: "当世界其他国家逐渐摒弃贵族统治的理念时，锡金仍深陷关于王室权力范围的争论之中。坚定的保皇派和部分军方将领将任何改革主张斥为“西方舶来的骗局”，认为其不适合锡金国情。\n\n却嘉的立场则微妙得多。变革浪潮终究难以阻挡——尤其在锡金所处的地缘环境中——他选择在保留大部分实权的同时，审慎推动渐进式改革。这种中间路线虽维持了现状，却既无法取悦保守势力，也难以满足宫廷中少数希望加速推进改革与民主化的开明派。"
 SIK_Legacy_of_Tumlong: "图姆隆的遗产"
 SIK_Legacy_of_Tumlong_desc: "自1861年《图姆隆条约》签订以来，锡金的命运便与大国紧密相连——随着大英帝国霸权陨落，这片土地从英国掌控转入印度手中。对稍有理智的人而言，这都是不言自明的事实：锡金永远无法以完全独立的实体捍卫自身。\n\n如今它作为自由印度保护领的存在，国防与外交均由后者掌控。监护国提供的技术支持更主导着当地绝大多数基础设施建设——从公路、学校到医院。除非发生剧变，未来百年间锡金仍将延续过去百年的依附状态。"