l_simp_chinese:
 tukha_ultimatum.29.t:0 "边境上的白旗"
 tukha_ultimatum.29.d:0 "在我国与图哈切夫斯基的西俄革命阵线交界处升起的一连串白旗，已将我国明确标示为他扩张主义欲望的下一个目标。伴随着这一事件的广播消息也毫无疑问地表明了他对我们的野心。\n\n正如无线电报中所说，我们将有三天时间向方面军投降，将我们的军队交给图哈切夫斯基指挥，并将我们的土地交由阿尔汉格尔斯克政府管理。如果我们现在投降，我们的将军和政府将被赦免，可以自由流亡，或者继续在方面军麾下服役。\n\n如果我们不服从，将再发出一次警告，之后我们的政府将不再保证得到赦免。图哈切夫斯基承诺，如果不听从这一警告，我们将只能被红军彻底消灭。\n\n随着日益强大的阵线向我们逼近，他们的旗帜在边境上也清晰可见，现在似乎到了要么屈膝，要么表明立场的时候了。"
 tukha_ultimatum.29.a:0 "为了人民的安全，我们必须让步。"
 tukha_ultimatum.29.b:0 "我们将为沙皇抵御叛徒!"
 tukha_ultimatum.30.t:0 "[FROM.GetName]拒绝了我们的条件！"
 tukha_ultimatum.30.d:0 "[FROM.GetName]拒绝对我们慷慨的投降和特赦提议作出积极回应。我们的侦察兵报告了他们境内的部队调动情况，看来他们正准备击退我军的武装入侵。\n\n他们当然不知道，这样做只会拖延他们的苦果。我们将在他们的边境升起红旗，向他们发出最后的警告。他们拒绝了我们最慷慨的第一次提议，因此，如果他们投降，我们必须通过起诉他们的政府来惩罚他们，但我们要绝对明确地告诉他们，这是他们将收到的最好的——也是最后的——外交提议。\n我们的军队已经准备就绪，我们的军官已经在召集会议，以击败我们潜在的敌人在慌乱中暴露给我们的防御工事，从而进行可行的抵抗。现在有两个选择，而且只有两个。投降，或者被凯旋的红军彻底消灭。"
 tukha_ultimatum.30.a:0 "简单的方法，还是困难的方法。"
 tukha_ultimatum.31.t:0 "[FROM.GetName]投降！"
 tukha_ultimatum.31.d:0 "[FROM.GetName]他们已经接受了我们的投降要求，交出了武器，停止了军事行动，并将其领土的管理权移交给了阵线。我们已经开始对他们的武装部队进行检查，并在必要时对他们进行再培训和再教育，以确保他们有一支可靠的辅助部队。\n\n由于这一幸运的转折，我们统一西俄罗斯的时间大大提前，我们可以自由地开始将新获得的领土全面纳入我们自己的机构。\n\n我们已经在该地区成立了一个军政府，由在我们过去的征战中表现突出的军官担任临时省长，等待当地行政长官的招募。"
 tukha_ultimatum.31.a:0 "好极了。"
 tukha_ultimatum.32.t:0 "最后的警告"
 tukha_ultimatum.32.d:0 "作为对我们拒绝图哈切夫斯基最初条件的回应，前线发出了最后警告。暗红色的旗帜在边境上空飘扬，从我们的前沿阵地可以看到 在地平线外，布尔什维克军队肯定正在准备进攻。\n\n我们国家的最新条件已经在全线广播，清晰明了。我们必须立即投降，解散我们的军队，将所有军事装备移交给前线，并允许他们的部队越过边境，以便为我们国家的合并做好准备。最值得注意的是，关于我们的州长和将军将获得大赦的规定已被取消。\n\n随着关键时刻的临近，我们已经做好了最后的准备，战线后方开始了慌乱的讨论。那些对我们的事业不那么爱国的人已经开始向南迁移，远离入侵的路径(如果入侵真的要来的话)。\n\n这是暴风雨来临前最后且最黑暗的时刻。我们是向红色浪潮投降，还是坚强地站起来，希望战胜它？"
 tukha_ultimatum.32.a:0 "我们别无选择，只得屈身。"
 tukha_ultimatum.32.b:0 "决不！我们绝不会向布尔什维克屈服！"
 tukha_ultimatum.33.t:0 "[FROM.GetName]拒绝了最后警告！"
 tukha_ultimatum.33.d:0 "接受我们最后警告的时刻已经到来，剩下的唯一解决办法就是战争。我们将发动一场全面战争，彻底粉碎[FROM.GetNameDef]内部的反对势力。\n\n应命令我军军官立即开始前进，炮兵开始炮击，以掩护最初的进攻。在我们完成对敌方阵地的监视后，敌人就没有希望抵挡我们压倒性的猛烈攻击了。\n\n当第一发炮弹落在他们的领土上时，我们将宣布正式敌对行动。对祖国的叛徒决不手软。"
 tukha_ultimatum.33.a:0 "就这样吧。"
 tukha_ultimatum.34.t:0 "[FROM.GetName]投降！"
 tukha_ultimatum.34.d:0 "[FROM.GetName]已接受我们的投降要求，交出武器，正式解散军队，并将其领土移交给阵线管理。我们已经占领了他们领土上的重要地点，关闭了边界，查封了档案，以确保他们领导层中的罪犯为自己的罪行受到法律制裁。\n\n随着事态的发展，我们统一西俄罗斯的时间已大大提前，一旦前领导层中的反革命分子被全面整肃，我们就可以自由地开始将新获得的领土全面纳入我们自己的机构。\n\n我们已经在该地区建立了军政府，由在我们过去的征战中表现突出的军官担任临时省长，以待我们扩大对该地区的控制，并直接并入阵线的中心地带。"
 tukha_ultimatum.34.a:0 "足够了。"
 tukha_ultimatum.35.t:0 "风暴来袭"
 tukha_ultimatum.35.d:0 "当黑色的旗帜在我们的边境升起，当我们通过无线电收到宣战书时，第一批布尔什维克炮弹已经落在了我们的领土上。对前线的战争已经来临，我们只能寄希望于我们的部队能够打破大元帅的进攻。\n\n我们的将士将英勇奋战，直到最后一刻，无论是面对化学云、装甲纵队还是步兵增援，我们的军官都自豪地做好了战斗准备。凭借我军的高超技艺和命运的眷顾，我们将成为最后一次击溃西俄罗斯革命阵线的堡垒。\n\n如果我们倒下了，那就让我们像英雄一样倒下；如果我们胜利了，那就让我们在历史的殿堂里永垂不朽--无敌，传奇！"
 tukha_ultimatum.35.a:0 "为摄政王坚守阵地！"