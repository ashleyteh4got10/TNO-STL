 ZLB_despotism_party_long:0 "佐林旅"
 ZLB_Pyotr_Zolin_DESC:0 "彼得·彼得罗维奇·佐林的生命中，曾有那么一瞬，他信奉着某种伟岸的存在。那是一种信念：无论该死的条顿蛮子如何蹂躏，将多少鲜血泼洒其上，那伟大而完整的祖国终将收回一切，连本带利。然而，这位身经二战与西俄战争的老兵，他对俄罗斯的信念，曾两度将他无情背弃。\n\n就在那一天，彼得·佐林，这位灵魂里曾充满骄傲的俄罗斯士兵，迎来了他丑陋不堪的死亡，被遗弃在故土之上，任凭腐朽。然而，他那“活”着的躯壳却存留了下来。他与那些和他一般在西俄前线上舍弃了某些过往、志同道合的战友们一同越境进入了莫斯科维恩。如同无数其他蹒跚的行尸走肉，他们将这残存的“生命”全然献祭于一件事——从德意志的战争机器中榨干最后一点价值。\n\n如今，专员辖区已然土崩瓦解，正如他早已破碎的家园。但与多年前不同，此刻的彼得，已不再是那个除了自己便一无所信的理想主义者。佐林的旅团会将所有仇寇从俄罗斯的土地上碾碎驱逐，但驱动他们的，绝非什么民族自豪、意识形态或是历史复仇。他们只为了一件事——不惜一切代价，去吮吸、去掠夺这片土地上所剩无几的残渣。而当一切终了，他便可以最终离开这片被诅咒的焦土——带着他搜刮累累的脏物与血债。"
 ZLB_Cult_ultranationalism_long:0 "敌基督崇拜"
 ZLB_Cult_ultranationalism:0 "敌基督崇拜"
 ZLB_Chik_DESC:0 "安德烈·奇卡季洛已死。如今占据他躯壳的，是那敌基督。昔日那个背弃家庭的屠夫与恶徒已不复存在；那个曾在德意志巡逻兵面前惊惶奔逃的蠢物，也已荡然无存。\n\n如今存留的，唯有那敌基督——魔王本尊之子，撒旦降罚的使者。他将挥下铁腕，彻底毁灭世间一切光明，以及栖身其上的所有活物。然，其力量尚且有限。纵有万千异界之声日夜呢喃，向他低语玄奥，依旧远远不够。撒旦本尊终将亲临，借安德烈·奇卡季洛这凡俗肉身，踏入这终将腐朽的尘世。\n\n届时，世间众生将悚然惊觉：在这浊臭凡间，末日时刻已然临近。"
 ultranationalism:0 "极端民族主义"
 TAM_Oskar_Schindler:0 "奥斯卡·辛德勒"
 ZLB_Pyotr_Zolin: "彼得·佐林"
 ZLB_Anatoli_Utkin: "阿纳托利·乌特金"
 ZLB_Andrei_Chicatilo: "安德烈·奇卡季洛"
 ZLB_Andrei_Chicatilo_sec_desc: "------------\n§О关于奇卡季洛在委身于佐林旅之前的生平，世人所知寥寥。根据其私下交谈中极不情愿透露的只言片语推断，其家人约在50年代党卫军哗变、天下大乱之际，从乌克兰专员辖区仓皇逃出。\n然而逃亡并未让生活境遇有丝毫改善。游击队员们曾尽其所能地接济他一家，甚至教会了安德烈如何摆弄武器。此后其行踪便难以追溯。据传，后事有两种说法：一乃德军最终捣毁了游击队的巢穴，仅有年轻的奇卡季洛一人侥幸逃出生天；另一说则是这伙乌合之众内部因龌龊倾轧而分裂，在又一次因分赃不均引发的火并后自行瓦解。\n不论真相究竟为何，佐林撞见奇卡季洛之时，后者正狼狈躲避着德军巡逻队的追捕，形容枯槁，饥肠辘辘且身负创伤。即便如此落魄，此人却仍能吐露些许秘闻——这足以说动那位铁石心肠的旅团领袖出手相助，甚至破格将其纳入门下。毕竟，奇卡季洛确有其阴暗的门路，亦掌握着令人胆寒的恫吓勒索之术。\n话虽如此，彼得却从未真正信任过这个疯癫之徒：他那些诡异莫测的“熟人”与乖张狂悖的行径，纵然在威慑莫斯科维恩愚民时颇具奇效，却也已开始令人生出警惕与深深的不安。"
 ZLB_Vyacheslav_Tolstopyatov: "维亚切斯拉夫·托尔斯托皮亚托夫"
 ZLB_Antikhrist: "敌基督"
 ZLB_Anatoli_Slivko: "阿纳托利·斯利夫科"
 ZLB_Vladimir_Ionesyan: "弗拉基米尔·伊奥涅相"
 Cherni_nadel:0 "幽暗份地"
 Cherni_nadel_desc:0 "俄罗斯已死，以任何意义而言，皆已死绝。断无任何事物能将其拯救。如今所余唯有将一切尚存之物搜刮殆尽，而后逃往目力所及的任何角落。而佐林对此已有一套狠毒的计划。在这场亡命豪赌中，他需要安德烈·奇卡季洛的襄助。纵然以我们的标准衡量，此獠也已疯癫入骨，然其“友人”或有利用价值，其行事之法亦足以令我们的敌人肝胆俱裂，陷入彻骨的战栗。"
 ZLB_Zolin.1.t:0 "兽之印记"
 ZLB_Zolin.1.d:0 "佐林的旅团在一个半钟头前，便已将又一个村庄纳入掌中。入夜的寒风渐起，令人不适。匪帮于是“客气地”向当地人“请求”借宿。当然，早已无人能够回绝他们的“请求”。彼得正独自一人坐在屋内的桌旁。他本该与奇卡季洛商议些事务，那家伙却迟迟不曾踏入房门。佐林喉间发出不满的咕哝，随手抓起外套，迈步走向屋外。苍蝇恼人的嗡嗡声令他心烦意乱，但这便是换取片刻安宁夜晚所需付出的微末代价。从被占领的房舍中，隐约传来酩酊作乐的喧嚣，夹杂着不知何处响起的惨叫。不过，操他妈的，那与佐林无关。\n\n“安德烈！安德烈！你他娘的……” 旅团头领试图呼唤他的同伙。“我在此处。” 一个声音从角落后传来。当佐林绕过又一栋破败小屋的拐角，窥见那里的景象时，他感到心口一阵猛烈的抽搐，不由自主地捂住了胸膛。墙壁之上，奇卡季洛正用某个牺牲品的鲜血与脏器，精心绘制着一颗星辰——其形状，隐约透出某种山羊头颅般的狰狞轮廓。\n\n“你他妈的在干什么？”\n\n“我在绘制五芒星。” 奇卡季洛答道，语气仿佛无辜得可怕，“有何不妥？”\n\n“你要这玩意儿有鸡巴用？！”\n\n“并非为我所用，” 奇卡季洛说着，站起身，走近彼得，“你自己想想，若村口某间屋子上绘有此等图样，你还会踏入这村子吗？”\n\n“大概…不会…”\n\n“我正是此意。那么，你寻我有何要事？”\n\n“啊，是的…关于缴获的赃物，还有…你手下那些人，有些事需得商议。总之，回屋里谈。”\n\n彼得转过身去，并未察觉，奇卡季洛正将沾满血污的手指凑到唇边，轻轻舔舐了几滴猩红的液体，动作随之凝滞。“你他娘的是卡在那儿了吗！？” 佐林不耐烦地吼道。“来了，来了，” 那位“艺术家”应声答道。"
 ZLB_Zolin.1.a:0 "这仅仅是个开始。"
 Vselay_strax:0 "植入恐惧"
 Vselay_strax_desc:0 "于凡夫俗子眼中，奇卡季洛的手段或显怪诞至极。那彻头彻尾的血腥淋漓，那献祭仪式般的种种行径——凡此种种，早已超越人之常情，不属凡俗之列。此乃远古洪荒之遗策，蛮荒初民之习俗，如今却能唤醒深植人心底那同等的蒙昧恐惧。然则，其行事的美学皮相根本无关宏旨，只要这套方法依然行之有效。"
 ZLB_Zolin.2.t:0 "震撼与战栗"
 ZLB_Zolin.2.d:0 "俄罗斯共和国防线的岗哨之上，一切平静，毫无凶兆。长夜本该波澜不惊地流逝，就连邻近的德意志人，料想也不会滋生事端——何况近来他们已沉寂许久。自德国内战爆发伊始，他们更仿佛彻底陷入了沮丧颓靡，显得不堪一击。目睹这些不久前尚是横扫欧陆的胜利者与凯旋之师，如今竟沦落至此，实属异乎寻常之景。他们曾视莫斯科与莫斯科维恩为其至高战利品，如今这片土地却仿若成了降临其身的诅咒。\n\n哨兵心想着万事太平——就连那先前呼啸的风，此刻也已静谧无声，暗示着安宁——便摸出一支手卷烟，打算点燃。然而，变故骤然降临。蒙面之人，手持自动武器，如同潮水般涌入了岗哨。他们的人数，感觉铺天盖地，宛若一支可怖的部落。哨兵挣扎着想要还击，却连瞄准的瞬间都未能抓住，一颗子弹便已精准地射入他的头颅，恰恰命中他齿间那支刚刚点燃的手卷烟。无线电室里发出了凄厉的求援呼号，但援军抵达尚需时辰。与此同时，岗哨内的屠戮仍在继续。\n\n数小时后，巡逻队抵达。尚在远处，驾驶员便已察觉岗哨有些异样，却难以分辨。建筑物的墙壁上，似乎涂抹了什么东西。当普罗宁上尉跃下卡车，一切才变得清晰无比。映入他眼帘的，是一幅令人肝胆欲裂的惨景——建筑物的墙壁上，赫然绘制着巨大的、用鲜血涂抹而成的五芒星图案，而旁边，则横陈着哨兵们被极尽扭曲的尸骸…眼窝空洞，有些下颌骨不存，上排牙齿尽失。其中一名士兵甚至连头颅都已无踪，而哨塔之上，竟悬挂着一具被斩断四肢的赤裸躯干。\n\n上尉用手紧紧捂住嘴，试图压抑住喉头翻涌的呕吐感。但那弥漫的污秽恶臭却无法阻挡，胃中之物终究喷涌而出。再次扫视这地狱般的景象，普罗宁只颤抖着挤出一句话：“圣母玛利亚…究竟是何等魔物才能犯下如此暴行？！”"
 ZLB_Zolin.2.a:0 "低劣之策，然卓有成效。"
 Terror_naselenia:0 "恐虐黎民"
 Terror_naselenia_desc:0 "对于部分子民而言，我们的手段说得委婉些实在难以下咽。他们心生惶恐，然非但未能安分守己、噤若寒蝉，反而开始蠢蠢欲动意图反抗。是时候让他们领教规矩了。必须让他们明白：悖逆必遭严惩。以及：杀鸡儆猴给外人看，此乃震慑之道！"
 ZLB_Zolin.3.t:0 "酷烈镇压"
 ZLB_Zolin.3.d:0 "黎明破晓之际，他们乘坐着绘有颠倒血十字的座驾而来。无人预料他们竟会来得如此之早，尽管村中对他们的意图已有所耳闻。戴着面具的行刑者们，挨家挨户，循序渐进。此处杀一人，彼处戮二命。有些屋舍悄无声息，有些则爆发出撕心裂肺的惨嚎。男人被屠戮，女人遭肆意奸淫而后杀之，老人受酷刑折磨，孩童则被径直爆头，简单利落。如此这般，一户接一户，村庄愈发死寂，沦为无人之地。鲜少有人敢于尝试逃离。而那些胆敢迈出脚步者，很快便落入在外围警戒的“猎手”之手，当场格杀。污泥早已浸透鲜血，但由于流出的血实在太多，不久之后地面竟开始汇聚起粘稠的血泊。\n\n最后，他们闯入了村长之家。那老者试图以圣像恫吓他们，全然无用。老朽当即被蛮横地掼倒在地，双腿被子弹洞穿，以防其逃脱。圣像从他颤抖的手中滑落，而开枪者对此视若无睹。\n\n半小时后，幸存者——数量已是寥寥无几——目睹了毛骨悚然的一幕：村长被钉死在粗陋的木制十字架上。他的躯体早已遍体鳞伤，血肉模糊，但这显然还不够。锈蚀的铁钉，随着铁锤的每一次落下，寸寸深入皮肉。然而，他已无力嘶喊，唯有喉间嘶哑的喘息，昭示着这老朽残存的痛楚与愤恨。最终，十字架被竖立在村庄的中心，旁边配置了数名看守，他们的任务便是——阻止任何幸存者靠近，以任何方式终结这男人的煎熬。"
 ZLB_Zolin.3.a:0 "犹大终将领受他的赏赐。"
 ZLB_crov_terror:0 "血色恐虐"
 ZLB_crov_terror_desc:0 "我们所施行的恐虐手段，显而易见终究有助于某种秩序的重建。然则在那席卷全境的血腥屠戮之后，我们的人手如今已是灾难性地匮乏。即便如此倘若此道行之有效，吾辈又岂有舍弃恐虐之理？"
 Crovavie_rityal:0 "血祭仪式"
 Crovavie_rityal_desc:0 "德意志人，俄罗斯人，亦或是其他任何存在。凡此种种，在奇卡季洛麾下兵卒手中，皆沦为纯粹的消耗品。他们的躯壳，将成为昭示后来者命运的生动教材；而这些仪式本身，亦能极大地提振行刑者的战意与嗜血之情。"
 ZLB_Zolin.4.t:0 "焦土沥血"
 ZLB_Zolin.4.d:0 "又一支德意志巡逻队，不幸地拣选了错误的时辰执行巡查。四人当场毙命——当那些头戴面具、发出非人咆哮的袭击者扑杀而至时，他们瞬间便已身亡。至于其余之人，等待他们的，是远为残酷的宿命。\n\n一个年轻的士兵最先被拖走。他是队伍中最年幼者，金发碧眼。然而，在经历了随后施加于其身的种种“处置”后，他已几乎看不出原先的模样。双臂被利刃反复切割，只为榨出尽可能多的鲜血——这条道路，终将被彻底染红。紧接着，他们开始料理他的面庞：斧头劈砍而下，将那原本端正的五官剁成一滩混杂着碎骨的血肉模糊。这或许看似一连串随机的残暴行径——且极有可能的确如此——但沉溺于血腥迷醉中的匪帮却坚信，他们实则在执行某位至高存在的意志。如此酷刑持续数小时后，异变突生：营地中的篝火失控，烈焰开始吞噬这临时的刑场。然则，为时已晚。行刑者早已离去，徒留下一则不言自明的血色讯言。\n\n次日，后续的巡逻队发现了令人魂飞魄散的景象：被斩断手足、扭曲不堪的尸骸，一具具穿刺在高耸的尖桩之上，立于那片被焚毁林地的焦黑边缘……如今，犯下此等暴行者早已踪迹杳然，而这，恰恰是最为可怖之处。他们将继续肆虐，继续他们的屠戮。"
 ZLB_Zolin.4.a:0 "而整个莫斯科维恩将浸透恐惧。"
 Oformit_cult:0 "正式化崇拜"
 Oformit_cult_desc:0 "佐林是个蠢货！而且是个自以为是的蠢货。他永远无法理解我的目标与我的手段。无妨，我可以亲自去说服他们，让他们认同我行事之道的正当性。何况，所需的工具，我早已掌握。只需点燃那些人心中潜藏的火焰，引导他们…向我宣誓效忠。唯我独尊！"
 ZLB_Zolin.5.t:0 "圣焰"
 ZLB_Zolin.5.d:0 "旷野中央，聚集着一群人——倘若尚能称其为“人”的话。匪类、屠夫、奸徒，一言蔽之——掠夺者。他们今日齐聚于此，并非仅仅为了满足其平日沉溺的卑劣欲望。绝非如此。今日，他们将领受启迪，触及某种伟大而可怖的存在。\n\n未几，这位新晋的教主开始布道。奇卡季洛早已立于人群中央。“兄弟姊妹们，” 他开口，声音仿佛带着回响，“吾辈今日齐聚，乃为行一桩伟业。撒旦本尊正通过我发声，我聆听着他的召唤，并已准备好将他的谕示传达予尔等。他渴求永恒之战！而如今，正是世人自相残杀、直至永恒的时代！那古蛇正于我耳畔低语——无论黑暗之中，抑或白昼之下，我皆能听见他的声音，而那声音，渴求着新的祭品！敌基督的降临已迫在眉睫，此界将永坠无边黑暗！” 话音落下，他爆发出癫狂的大笑。\n\n随之而来的是一片死寂。由又一个村庄居民尸骸堆砌而成的巨大柴堆，被骤然点燃。并非所有人都完全相信奇卡季洛的言辞。有人认为他不过哗众取宠；有人则视其为维持那股嗜血狂热的手段。但奇卡季洛本人，此刻正凝视着熊熊燃烧的烈焰。在那里，在那些剥落的皮囊、扭曲的尸骸与翻腾的火焰之间，他看见了祂。他看见了祂那双宛若无星之夜般漆黑的眼瞳，倒映在火光之中。祂…在微笑…"
 ZLB_Zolin.5.a:0 "耶和华问撒旦说：“你从哪里来？”撒旦回答说：“我从地上走来走去，往返而来。”"
 ZLB_cult_antixrist:0 "敌基督崇拜"
 ZLB_cult_antixrist_desc:0 "如今，我们敬拜敌基督，已然环绕其建立起一整个教团。我们仿佛能感受到一股崭新的力量，一股源自彼界的黑暗伟力，正源源不断地注入我们的体内。我们必将勇往直前，无可阻挡。我们必将亲手——加速那命中注定之刻的到来！"
 ZLB_cult_antixrist_2:0 "敌基督崇拜"
 ZLB_cult_antixrist_2_desc:0 "如今，我们敬拜敌基督，已然环绕其建立起一整个教团。我们仿佛能感受到一股崭新的力量，一股源自彼界的黑暗伟力，正源源不断地注入我们的体内。我们必将勇往直前，无可阻挡。我们必将亲手——加速那命中注定之刻的到来！"
 Slyshat_molitva:0 "他聆听你的祷告…"
 Slyshat_molitva_desc:0 "这些蠢货…他们被剥夺了天赋，他们听不见祂，也看不见。但我知道，祂洞悉一切，祂垂听万物。可是，让他赐予我一个征兆吧，难道是我做得还远远不够吗？\n\n难道，我弄错了吗？"
 ZLB_Zolin.6.t:0 "晦暗认知"
 ZLB_Zolin.6.d:0 "奇卡季洛今日心情恶劣至极。已逾一周，他未曾收到任何新的征兆，无论他如何残暴地肢解人也无济于事。不论是焚烧，是扼杀，是用刀切割，抑或是枪决。如今，于垂死的惨叫中，他什么也听不到了。\n\n但他决意，要重新建立连接。漆黑的深夜，安德烈潜入一间教堂，那里早已备好了一名祭品。那年轻女子已被白日的酷刑折磨得奄奄一息，但奇卡季洛丝毫没有就此终止她苦难的念头。当他站立于祭坛之前，一股原始的恐惧猛然攫住了他，某种事物出了偏差。这疯子飞快地伸手探入外套口袋，摸索到那个他珍藏的、装着未知药片的神秘小包。他立刻贪婪地吞下数片，用祭器中的鲜血冲服下去。\n\n就在此时，奇卡季洛注意到，他再也听不见祭品的呻吟，听不见先前在窗外咆哮的狂风，甚至连耳鸣声也消失了——绝对的死寂。很快，他意识到自己动弹不得，仿佛整个身体都已被冻结。然后，祂的声音响起了。那声音的方式如同低语，音量却仿佛足以撼动整个宇宙的基石。“更多……”那隆隆之声重复着，在这位敌基督教派领袖的意识中无限回响。\n\n翌日清晨，奇卡季洛面带微笑步出神庙。他并未偏离正道，不，绝非如此。他只是需要杀戮更多，而这，正是他即将投身的事业。"
 ZLB_Zolin.6.a:0 "噩梦必须继续！"
 Stoit_molitsa:0 "…所以，应当祈祷"
 Stoit_molitsa_desc:0 "他们祈祷，日复一日，夜复一夜地祈祷，而他听见他们的祷告。但难道这所有的一切，都必须由我一人来承担吗？不！不！我需要一个助手，一个黑色指挥官，若我有任何不测，他能率领大军继续前行。而且，我还需要护卫…佐林那个蠢货，已经开始起疑心了。"
 ZLB_Zolin.7.t:0 "黑色指挥官"
 ZLB_Zolin.7.d:0 "深夜，旷野之中，一场可怖的秘仪正徐徐展开。一群身着状似斗篷的长袍之人，手持火炬，肃立等待着什么。不久，教派领袖本人携其忠实的助手现身。奇卡季洛开始了他的演说：“今日乃是伟大之日。一位全新的黑色指挥官，将立于末日军团之首。旧世界与新世界，所有的一切，都将在我们的力量面前颤抖。很快，非常之快，那最终的决战即将打响，而我们，必将赢得胜利。”\n\n与此同时，阿纳托利·乌特金只是静静聆听着布道者的言语。当演说结束，那戴着面具的身影转向他。“你准备好了吗？”教派领袖问道。“时刻准备着。”黑色指挥官回答。“那么，仪式进行之时，唱起那圣歌！”奇卡季洛嘶吼着，抽出了他的刀。\n\n数十个嗓音开始齐声吟唱起那阴森可怖的歌谣，整齐划一：\n血月之下酸雨倾落，\n百纪苦路汝亦踏过。\n身后旧世残垣碎破，\n汝乃雄主，伟岸战魔——黑司令显赫。\n忠诚战士高擎旌祚，\n妻儿父母皆可弃舍。\n汝于彼乃造物灾祸，焚尽世间灼灼。\n无边神力——黑司令掌握。\n无情凝视恶魔日落，\n一言便令城郭陷火。\n以此凡尘沉闷苦涩，汝以痛楚淹没。\n汝之号令不容辩驳，黑司令之诺。\n\n此时，乌特金正面临最后的考验。他从教派领袖手中接过刀，在自己手指上划开一道切口，随即用流出的鲜血，在领袖的衣袍上绘出了一颗星辰。奇卡季洛微笑着：“今日，一位全新的黑色指挥官诞生了。他将引领我们，向旧世界发起最终的冲锋！”"
 ZLB_Zolin.7.a:0 "他的权柄必大，却不是因自己的能力；他必行非常的毁灭，事情顺利，任意而行；又必毁灭有能力的和圣民。 "
 Temie_crewenia:0 "黑暗洗礼"
 Temie_crewenia_desc:0 "人潮汹涌，向我而来。但他们必须明白，堕天使的赐福并非人人可得。鲜血将汇流成海，喉管将在利刃下颤抖，唯有那些能够证明自身价值之人，方能领受那启示…不…是领受那黑暗主宰本尊的恩典。"
 ZLB_Zolin.8.t:0 "血色唱诗班"
 ZLB_Zolin.8.d:0 "敌基督的势力已准备撤离又一个村庄。绝大多数村民已被屠戮殆尽，所有尚可称之为有价值之物皆已装车运走，但还剩下最后一项。为这末日匪帮接纳新成员的仪式。\n\n候选者共四人。一个约莫十六岁的少年，一位年迈的老者，一个从家中被强行拖拽出来的女人，以及她的丈夫。将这四人团团围住的，是一群难以称之为“人”的东西。他们戴着可怖的面具，浑身沾满血污、泥泞，以及人体内部所能倾泻出的一切秽物，永远在嗡鸣、狞笑、窃语不休。\n\n然后，搏杀开始了。在滂沱的雨中，老者脚下一滑，在泥泞中跌倒，再也未能起身。与此同时，女子竭力保持不动，眼看男人们彼此厮杀。那少年起手便挨了重重一拳，打在下颌，感觉掉了几颗牙齿，随即失去了平衡。顷刻间，一双手臂环绕住他的脖颈，猛力收紧。突然，一个布满弹孔的头盔从人群中飞出——它很可能原属于某个德军或什么游击队员，但此刻，它足以改变一切。\n\n窒息感袭来，意识逐渐模糊，少年摸索到了那个头盔。要么现在，要么永不。他心下一横，拼尽全力用头盔砸向那扼住他咽喉的人。那人应声倒地，人事不省。随后，少年一脚狠狠踏碎了他的喉咙，彻底终结了他。\n\n血腥、焦糊与泥泞的气味令人头晕目眩，那少年感觉自己无所不能，无人可挡。一抹扭曲的笑容凝固在他的脸上。女人惊恐万状，涕泪横流地向后爬去。“住手，孩子！别这样做，我求你了！”她在泪水中大吼。但这毫无作用。很快，传来重击之声，继而是女人的尖叫与哭泣，然后又是一击，再一击，复一击。哭声不久便停息了，击打声却未曾中断。那杀戮者直至意识到自己已将亲生母亲的头颅捣成了一滩血肉模糊的烂泥，并正用新的重击将其与污泥积极地搅拌在一起时，才猛然回过神来。\n\n一个身份不明者从围观的人群中走出，脸上挂着微笑，向他递过一张面具，说道…"
 ZLB_Zolin.8.a:0 "你是我们的人了。"
 Zov_antihrista:0 "敌基督的呼唤"
 Zov_antihrista_desc:0 "敌基督的呼唤"
 ZLB_Zolin.9.t:0 "沦陷"
 ZLB_Zolin.9.d:0 "“我们去村里，”他们曾说，“那里能捞到不少好东西，这狗娘养的”。当他找到我，开始胡扯什么撒旦，什么我是第四骑士时，我他妈就该知道他脑子不正常了。现在这混账把我诓进这村子，还想背后捅刀子。他想去哪？投靠德国人？还是游击队？操他妈的，除了我，根本没人需要他。我早就该干掉他。或者干脆把他留给巡逻队。\n\n混乱的思绪在佐林的脑中翻腾。奇卡季洛把他骗进了又一个村庄，并试图从背后开枪射杀他。但佐林不是那么容易被干掉的。他甚至还击伤了那疯子的一个帮手。然而现在，这位旅团的头领正蜷缩在一间摇摇欲坠的小屋里，侧耳倾听着外面的脚步声。他的神经已紧绷到了极限。\n\n“安德烈，嘿，安德烈，还记得当初那条德国杂种狗怎么咬住你手的吗？那眼神凶得像条疯狗，嘿嘿，妈的，跟你现在一模一样。想甩掉我？我他妈可是救了你这条狗命！你那些手下，我没派人处理掉他们，但我早该那么做了。滚出来，你这杂种！还是说你像条丧家犬一样跑去舔伤口了？”佐林嘶吼着，试图激怒奇卡季洛，但对方仿佛凭空消失了一般。旅团头领小心翼翼地探头望向走廊，空无一人。就在此时，身后的窗户猛然炸裂成无数碎片，敌基督本尊纵身跃入。佐林急忙转身，视野中只剩一块急速飞来的石头，下一秒，他便失去了意识。"
 ZLB_Zolin.9.a:0 "..."
 ZLB_Zolin.666.t:0 "新的开端"
 ZLB_Zolin.666.d:0 "彼得在一片异样的境况中恢复了意识。在他睁开双眼之前，一股前所未有的剧痛刺穿了他的心智。他无法动弹，双手被固定，双腿被捆绑。突然间，又一次神经脉冲传递来难以置信的痛苦。他勉强积蓄起一丝力气，抬眼望去，只见斯利夫科正用锈迹斑斑的铁钉，钉入他的手掌。阿纳托利注意到俘虏醒了，只是短暂地咧嘴一笑，便继续手头的活计。\n\n佐林只挤出嘶哑的一声：“什么…”便再无力气。但那个拿着锤子的人并未回答。这时，另一个人走近，戴着面具和一顶绘有星辰的头盔。“他说了什么吗？是不是可以…”他开始发问。“等等你，他会呛死的。等我们把他竖起来再说。”然后，他自己也忍不住轻笑起来。\n\n又一次，佐林恢复意识时，发现自己身处极其诡异的境地，仿佛整个世界都上下颠倒了。展现在他面前的，是一幅可怖的景象：奇卡季洛站在一大群人面前。那人群看似有数百之众，将林间空地中央一棵孤零零的树完全包围。佐林试图发出声音，却只发出压抑的呻吟，而当他张开嘴时，几滴鲜血从口中滴落。\n\n“…而现在，我们将处决他，这个愚者，这个叛徒。他拒绝了真神的恩赐，执意留在幻象的世界里。他的神，不过是那个钉在十字架上的犹太人。我们的神，是万物之主宰，而今天，祂将获得又一个祭品！”奇卡季洛向人群布道。说完，教派领袖拿起一支火炬，猛地掷向佐林。那捆绑着他的木制十字架立刻熊熊燃烧起来。\n\n“从今往后，我们不再是那死神的奴隶，不再是匪徒，也不是什么旅团。现在，我们是死亡之神，我们将把毁灭亲临此世…”"
 ZLB_Zolin.666.a:0 "“无人能阻挡我们的脚步！”"
 Shech_zemla:0 "焦土焚地"
 Shech_zemla_desc:0 "他们不配拥有这一切。那碧绿的田野，那澄澈的河流。这些蠢货不配拥有这些。我们将焚毁田野，我们将毒化水源，我们将竭尽所能，让他们明白他们的主宰早已抛弃了他们。让他们互相吞食，让他们苟延残喘，让他们饮血以求苟活。让他们身躯在蛆虫的啃噬下活活腐烂，让他们的视线永远被蔽日的烟霾遮蔽。他们不配拥有这世间的一切财富，他们要么死无全尸，要么爬向我们，但无论如何，都为时已晚。"
 ZLB_Zolin.10.t:0 "莫斯科维恩上空的尘雾"
 ZLB_Zolin.10.d:0 "今日，芬兰数家新闻社发布了令人震惊的照片。根据获取到的轰动性画面显示，莫斯科维恩大部已被来源不明的浓密烟雾所笼罩。\n\n媒体上已开始出现关于其成因的猜测，一些人声称是内战导致的自然火灾蔓延失控，另一些人则断言这是德国驻军为清剿俄国游击队所采取的行动。与此同时，一些来自莫斯科的难民讲述了一个名为“敌基督军团”的可怖撒旦教组织，并指控正是他们对森林和田野进行了大规模纵火。目前，大日耳曼国政府拒绝对此局势发表评论。"
 ZLB_Zolin.10.a:0 "何等恐怖！"
 ZLB_shed_zeml:0 "焦土焚地"
 ZLB_shed_zeml_desc:0 "敌基督的大军正在摧毁我们所拥有的一切。对于我们所有身陷莫斯科维恩的人而言，这就是一个诅咒。我们的士兵完全跟不上敌人的步伐，因为我们时刻被迫处于高度戒备状态，唯恐那些撒旦信徒发动袭击。"
 Shssterni_voini:0 "战争齿轮"
 Shssterni_voini_desc:0 "我听见那个声音。每一天，它在机器的轰鸣中向我低语。人类懒惰、愚蠢。他们不明白自己在做什么，为何而做。工厂需要祭品，很快，那些不够卖力工作之人的骨头，就将被齿轮碾碎。而那滚烫的钢铁，将浸透他们的鲜血。我们的武器只会因此变得更加强大，而那些得以幸存的工人，也将变得…更有动力。"
 ZLB_Zolin.11.t:0 "工厂里的生与死"
 ZLB_Zolin.11.d:0 "摘自工厂工人 伊万·德尼索维奇 的日记\n\n“今天他们逼我献祭，我别无选择…萨沙，我当年可是把你从德国人手下藏起来的啊，你为什么没逃走？为什么你做不到？我本想一枪打死他，让他少受点罪。但他们盯着，我什么也做不了。那么年轻……就这么被他们扔进了熔融的金属里，脸朝下。之后，他们用不知谁的血，在机床上画了个五芒星。我到底在做什么？我为什么要这样做【字迹无法辨认】” 从纸页的外观看，似乎也浸入了数滴液体，很可能是鲜血。\n\n撒旦信徒随手丢开日记，走向尸体。那个大胡子工人躺在他的机床旁。旁边放着他自尽的武器——一把小左轮手枪。\n\n撒旦信徒仅仅是轻蔑地笑了一下，便将又一具尸体拖向金属熔炉。这里，从来不缺尸体。"
 ZLB_Zolin.11.a:0 "血肉、白骨与鲜血，只会让我们的武器变得更加强悍。"
 ZLB_Shssterni_voin:0 "劳作或死亡"
 ZLB_Shssterni_voin_desc:0 "正如那句“劳动带来自由”，如今，“劳作或死亡”的标语悬挂在为我们效力的每一座工厂、每一个车间内部。其核心要义在于：要么一个人不遗余力地劳作，哪怕是在枪口之下；要么，他就得死。任何人都不得松懈！工作，只有工作！为了撒旦与敌基督的荣耀！"
 Crovavie_reki:0 "血流成河"
 Crovavie_reki_desc:0 "太少了，太少了！祂要求越来越多、越来越多的祭品，可祭品却越来越难寻觅。但我不能停下，为了得到祂的恩典，我已经走得太远了。我无法就此偏离这条道路。或许…需要更多的残忍？我必须满足祂！"
 ZLB_Zolin.12.t:0 "血，更多的血，还要更多更多的血"
 ZLB_Zolin.12.d:0 "挖好那深坑大约花了一个钟头，远比这更困难的是找到足够数量的人。数个村庄已被彻底清空，而岗哨与巡逻队则被命令必须生擒。即便如此，凑齐祭品仍耗费了数日时光。\n\n但当时辰已至，奇卡季洛亲临现场。第一批祭品被他的亲信们割开了喉咙，他们的身体里已没有多少血液了。战争榨干了这片土地的生命，也榨干了被卷入其中的人们，但这还不够。第二批被开膛破肚，他们的内脏被徒手掏出，抛入那渐渐形成的血池。第三批则被斩首，头颅被摆放起来，让颈腔的血汩汩流尽。一个小时后，坑中的血液已足够深及奇卡季洛的膝盖。\n\n终于到了画上最终一笔的时刻。一个女孩被带了进来，看样子极其年幼，她命中注定要承受特殊的命运。火把被点燃，可怖的仪式开始了。在整个过程中，她尖叫着，挣扎着想要逃脱，但绳索将她牢牢捆缚。随后，只剩下压抑的啜泣声。仪式终了，奇卡季洛赤身裸体，一把扼住她的脖颈，将她抛入深坑。女孩在血液与污泥中徒劳地扑腾着，紧接着，忠诚的教徒们拿起铁锹，开始将土填回坑中。"
 ZLB_Zolin.12.a:0 "敌基督的种子将在焦土之上生根发芽。"
 Radi_bogadtvva:0 "为了财富"
 Radi_bogadtvva_desc:0 "莫斯科维恩的局势日渐恶化，而佐林旅的行径对此毫无助益，反而火上浇油。但从另一方面看，那些一贫如洗、已然绝望的人们，倒不失为我们军队的绝佳补充。"
 ZLB_Zolin.13.t:0 "入伙"
 ZLB_Zolin.13.d:0 "伊万拖着沉重的步子走向卡车，他的村庄正遭受洗劫。所有稍具价值的东西都被搜刮一空：食物、饰品、以及其他任何值钱的物件。背景中充斥着尖叫声，每隔几分钟甚至会响起一声孤零零的枪响。\n\n有时候想想，半个世纪就能让生活变得如此面目全非，真是不可思议。沙皇时代，瓦尼亚家还算是相对富裕的农户，虽非大富大贵，但日子也过得去。后来，赤党来了，夺走了家里大半财产，但瓦尼亚那时还小，并未经历。再后来，德国人来了，他们抢走了几乎所有东西，只留下仅够勉强糊口的最低限度。而现在，土匪来了，连这最后一点也被夺走。\n\n伊万已经没什么可失去的了。家没了，亲人没了，但不知为何，他还想活下去。也许这只是纯粹的求生本能在作祟，但他的脚步已然走到了卡车前。\n\n一个面相凶恶的土匪举起一支德制自动步枪，说道：“老乡，识相点赶紧滚开，这些东西已经不属于你了。”\n\n伊万只是结结巴巴地说：“可我想…我想跟你们一起走。”\n\n“跟我们？呵，这倒是可以安排。”那壮汉咧嘴一笑，塞给他一顶布满弹孔的头盔和一支老旧的德制步枪。\n\n“你也清楚，没更好的了。还有这个…”他边说边在口袋里摸索，“喏，这儿有9发子弹，没了。赶紧上车，我们马上就走。”"
 ZLB_Zolin.13.a:0 "这样的生活算不得什么好日子，但总归比死要强。"
 Grabit_monastiri:0 "劫掠修道院"
 Grabit_monastiri_desc:0 "早在古时，就连维京人也深谙此道：在一个村落里，首当其冲该洗劫的便是教堂，因所有值钱之物皆藏于彼处。时代在变，但这真理亘古不变。更何况，总有那么些门路上的特定人物，乐意将所有光明正大抢来的财物，换作我们所需的资源。"
 ZLB_Zolin.14.t:0 "收缴"
 ZLB_Zolin.14.d:0 "“你们会为此遭天谴的！你们会在地狱里焚烧！”那神父嘶喊着，用自己的身体挡在修道院的入口。然而，佐林的匪帮显然没有进行建设性对话的心情：“听着，你要么自己滚开，要么我们把你拖开，你他妈的是听不懂吗？”\n\n“恶魔！不信神的畜生！”神职人员哭喊道。\n\n“妈的，这家伙烦死老子了，”其中一个土匪粗暴地啐了一句，随后用枪托狠狠砸向神职人员，将那惊魂未定的神父推倒在地。他抹去脸上的血迹，然后开始向后匍匐退去。\n\n建筑内部陈设寒酸，圣像画也寥寥无几，但即便是这种货色，也总能找到买家。突然，这狭小的建筑里爆发出一阵哄堂大笑。“弟兄们，瞧瞧我发现了什么狗屁玩意儿，”一个土匪强忍着笑意说道。他手中举着一幅描绘耶稣本人的圣像画，但有什么地方不对劲。看起来它曾遭受损坏，以致于有人决定重绘弥赛亚的面容。而那张新脸，已经与救世主相去甚远，反而更像某本儿童读物里的狮子。一小时后，里面已空无一物：所有杂物、画作，甚至一个枕头都被扔进了卡车，随后匪帮扬长而去。\n\n另一方面，这些物件本身的命运，却要幸运得多。也许它们会被某个国外的博物馆收购。又或者，它们将最终归入某个思念故土的富有流亡者的收藏。唯有一事是明确的…"
 ZLB_Zolin.14.a:0 "它们将得以逃离这片地狱。"