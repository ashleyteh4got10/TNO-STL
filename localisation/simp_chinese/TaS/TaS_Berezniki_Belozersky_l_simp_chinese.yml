 berez_kazahk_news.1.t:0 "[Get_newspaper_header]俄罗斯对哈萨克内战的干涉"
 berez_kazahk_news.1.d:0 "来自前苏联领土的消息令人深感不安。一场爆发于哈萨克人与俄罗斯少数民族之间的血腥内战出人意料地发生了转折。已部分统一的俄罗斯宣布向冲突双方同时宣战，并大举入侵哈萨克斯坦北部边境。\n\n尽管俄罗斯官方已经发表声明，声称“恢复俄罗斯南部地区秩序的行动”将会在“几天内”结束，但军事专家们认为，俄罗斯军队仍需投入数以千计的作战部队，才能彻底占领并控制哈萨克斯坦全境。"
 berez_kazahk_news.1.a:0 "哈萨克斯坦雄鹰已然沦为北境饿熊的盘中餐。"
 berez_kazahk_news.2.t:0 "[Get_newspaper_header]俄罗斯吞并哈萨克斯坦"
 berez_kazahk_news.2.d:0 "今日，西俄罗斯的俄罗斯政府与哈萨克斯坦亲俄政府在奥伦堡签署了一项协议，名为“关于在俄罗斯南部地区建立统一指挥部的协议”。据一些政治分析人士称，这份协议意味着哈萨克作为一个国家的彻底终结，以及俄罗斯人统治地位的确立。\n\n尽管OFN支持俄罗斯“在经历了多年的分离后，最终完成了国家的统一大业”，但共荣圈则对“野蛮的亚洲民族奴役欧洲人”这一行径表达了强烈的不满。据当地新闻机构的民意调查显示，大多数哈萨克人认为，加入俄罗斯是“意料之中，但并非情愿之举”，哈萨克斯坦的未来在他们眼中也“充满着不确定性”。"
 berez_kazahk_news.2.a:0 "有些民族注定无法享有独立的命运。"
 berez_kazahk_news.3.t:0 "[Get_newspaper_header]《阿拉木图条约》的签署"
 berez_kazahk_news.3.d:0 "当地时间今天下午十三时，在哈萨克斯坦首都，一项名为“关于哈萨克斯坦政体变更”的协议正式签署。根据该协议，哈萨克斯坦将进入“过渡期”，在此期间，由哈萨克和俄罗斯官员组成的行政机构将着手为该地区并入俄罗斯的法律、经济和政治体系做好准备工作。\n\n然而，根据该条约，哈萨克斯坦在俄罗斯联邦内的地位被描述为一种在国际标准中都极为罕见的“高度自治”。国际政治专家们将其描述为“仅仅是更换了一面旗帜而已”，但与此同时，他们也表达了对这个新成立的自治政体未来特权和权力可能会被进一步削减的担忧。"
 berez_kazahk_news.3.a:0 "至少，没有人因此丧命。"
 berez_kazahk_news.4.t:0 "[Get_newspaper_header]俄哈谈判破裂"
 berez_kazahk_news.4.d:0 "令人不安的消息从中亚传来。据一些要求保持匿名的哈萨克和俄罗斯的政治家透露，国际新闻机构获悉，哈萨克斯坦和俄罗斯两国政府之间的谈判已宣告破裂。\n\n据悉，根据条约，俄罗斯将吞并哈萨克斯坦，并赋予这些新获得的领土以自治地位作为交换。最终，双方未能就未来条约中的一些关键条款达成一致，从而导致双方都撤回了自己的代表，这实际上也宣告了这些条约已化为泡影。尽管哈萨克斯坦和西俄罗斯方面都否认了谈判的存在，但两国之间的政治紧张局势仍在不断升级，大有一场全面武装冲突一触即发之势。"
 berez_kazahk_news.4.a:0 "饱经苦难的土地上战火恐将再度燃起。"
 berez_kazahk_news.5.t:0 "[Get_newspaper_header]俄罗斯撕毁《阿拉木图条约》"
 berez_kazahk_news.5.d:0 "今天本应举行最终的会议，在漫长的谈判后决定哈萨克斯坦的最终命运。根据该条约，哈萨克斯坦将会获得广泛的自治权以及对俄罗斯的部分主权。\n\n然而，在谈判期间获得了进入哈萨克斯坦领土权利的俄军突然占领了该国的主要行政和后勤中心，彻底瘫痪了该国的防御。俄罗斯代表宣布“由于哈萨克方面持续的挑衅，谈判终止”，并且“俄军将暂时控制南西伯利亚的领土”。\n\n土耳其和OFN的代表对“当前局势表示谨慎的关切”，而大日耳曼国国则宣称这是“俄罗斯这群亚洲野蛮人背信弃义的又一例证”。"
 berez_kazahk_news.5.a:0 "依靠欺诈，兵不血刃征服草原。"
 berez_kazahk_news.6.t:0 "[Get_newspaper_header]俄罗斯举行“南方-70”军事演习"
 berez_kazahk_news.6.d:0 "俄罗斯在其南部地区举行了代号为“南方-70”的大规模军事演习。此次演习涵盖了多种类型的部队，包括机械化步兵和空军。演习的目的是为了加强不同军种之间的协同作战能力，并检验部队执行作战任务的战备水平。哈萨克斯坦政府已就此提出严正抗议，称其无法容忍任何在边境地区的挑衅行为。\n\n此次军演也引发了大日耳曼国的关注，因为在对东欧犯下累累罪行后，俄罗斯军队如今所展现出的战备水平，很可能是在为发动一场旨在恢复其对东欧控制的侵略战争做准备。"
 berez_kazahk_news.6.a:0 "俄罗斯人再次磨刀霍霍。"
 MAR_epilogue.1.t:0 "融合的胜利"
 MAR_epilogue.1.d:0 "俄罗斯一直以来都是两种截然相反的意识形态——君主专制与社会主义——的角力场。这两种极端的制度在俄罗斯的土地上进行着互不妥协的斗争，胜负的天平交替倾斜。若换作旁人身处我们的位置，恐怕早已选择其一，要么就尝试开辟一条不伦不类的中间道路。但我们另辟蹊径，我们寻求到了君主制和社会主义之间的那个微妙的平衡点，而结果证明，我们成功了。\n\n青年俄罗斯联盟缔造了一个真正意义上的、独一无二的国家，一个无法在历史上找到任何参照物的全新国度。我们的国家可能会被外界冠以各种各样的标签，无论是“带有左翼倾向的君主主义者”，还是“以沙皇为首的共产主义者”。但我们既不是前者，也不是后者——我们是青年俄罗斯联盟。俄罗斯人民对我们的领导深信不疑，而命运女神也眷顾着我们，让我们能够统一这片从西起沃洛格达，东抵堪察加的广袤俄罗斯的土地。\n\n一个崭新的、摆脱了过去重重阴霾的国度已然在世界版图上闪耀登场。这台历经沧桑的机器，在涤荡了那些开创者和后继者们所犯下的种种错误后，终于再次轰鸣向前。君主制与社会主义理念的融合为我们带来了无可比拟的辉煌成就，这伟业只有在俄罗斯的土地上才能实现。现在，这台名为“俄罗斯”的巨型机器将一往无前。\n\n没人能够指责我们，说我们没有做到。"
 MAR_epilogue.1.a:0 "我们成功了。"
 MAR_epilogue.2.t:0 "举国欢庆"
 MAR_epilogue.2.d:0 "自从我们的军队挺进到太平洋沿岸，已经过去整整一个星期了。自俄罗斯分崩离析以来，这片土地上究竟流淌了多少鲜血，恐怕早已无法计数。然而，所有的苦难如今都已成为了过去。今天，为了庆祝这一历史性的伟大时刻，全国宣布放假一天。\n\n每个人的庆祝方式都不尽相同：有些人与自己的酒肉朋友们一起，向着酒吧和各式各样的娱乐场所“发起进攻”；另一些人则参加了由青年俄罗斯联盟在沙皇陛下——“统一者”谢尔盖一世的授意下，在各地组织的官方庆祝活动。在普通民众纵情欢庆之时，另一些人却仍然坚守在自己的岗位上。沙皇陛下的外交司电话响个不停，充斥着来自世界各地的祝贺，就连日本政府也向我们发来了贺电，并表示尽管过去存在着一些摩擦，但他们仍然期待着与俄罗斯展开合作。\n\n军队同样一刻不得闲，东部的边境线极其漫长，想要建立一条稳固的陆地边界仍然是一项艰巨的任务。然而，相比起这些问题，那些仍然盘踞在该地区的形形色色的游击队才是我们所要面对的心腹大患。不过，至少剿匪可比打仗要轻松多了。\n\n那么，沙皇的内阁成员们此刻正在做什么呢？关于这一点，恐怕只有那些此刻正驻扎在新西伯利亚附近的部长和沙皇近卫军们才知道了，而沙皇本人也正在那里召开一场重要的御前会议，这场会议将决定整个欧亚大陆的未来。"
 MAR_epilogue.2.a:0 "是时候参加会议了。"
 MAR_epilogue.3.t:0 "沙皇的御前会议"
 MAR_epilogue.3.d:0 "“谢廖沙，我就跟你说了，这桑拿房的火得再旺些才够劲儿，现在这不温不火的算怎么回事嘛。”卡津别克对别洛泽尔斯基抱怨道。\n\n“唉，可惜啊，我已不是当年生龙活虎的士官生了。”别洛泽尔斯基叹了口气，“火烧得再旺些，怕是我们这一把老骨头就得一起命丧这桑拿房里了。行了，少废话，来，把那瓶从美国佬那儿搞来的上好干邑再倒上点儿，让他们知道厉害。”\n\n正当别洛泽尔斯基和卡津别克高谈阔论着桑拿房和美国干邑的优劣时，另外两位今日的主角——阿列克谢·柯西金和弗拉基米尔·吉尔，刚刚从桑拿房外的清新空气中吸饱了氧气，推门而入。\n\n“谢尔盖·谢尔盖耶维奇，您都这把年纪了，还是少喝点儿吧，不然您的肝脏可真要遭殃了。”柯西金一进门就嚷嚷起来，随后一屁股扎进了沙发里。\n\n“不用你小子教训，我心里有数。但今天这大好日子不喝点实在说不过去。沃瓦，你喝不喝？”别洛泽尔斯基回敬了柯西金一句，转而又向吉尔问道。\n\n吉尔把他的眼镜放在床头柜上，随后在扶手椅上坐下，回答说：“嗯，既然是庆祝，那就喝点吧。没准儿我还能想出个好地方来测试我们的‘大宝贝’呢。”\n\n“害，这还用想？直接扔柏林去，这不就是现成的试验场嘛。”阿列克谢抢着说道。\n\n“诶，这主意可以当祝酒词啊！”别洛泽尔斯基提高了嗓门。“来，同志们，为了我们的祖国，也为了柏林上空的那朵‘蘑菇云’，干杯！”\n\n所有人走到桌子前，拿起酒杯，伴随着清脆的碰杯声，他们高声齐呼……"
 MAR_epilogue.3.a:0 "“为了我们的祖国，也为了柏林上空的那朵‘蘑菇云’，干杯。”"
 MAR_Endscreen_Button:0 "感谢游玩！"
 MAR_ENDSCREEN_TEXT:0 "您已在游戏中见证了别列兹尼基在摆脱了纳粹阴霾的俄罗斯大地上所取得的辉煌胜利。从今往后，我们的祖国将万众一心，再也没有什么力量能像布哈林时期那样轻易地将其摧垮。然而，历史的篇章远未结束，它仍静待着续写。\n\n§Y沙皇与苏维埃：TNO别列兹尼基子模组§!的开发团队在此衷心感谢您体验了我们的这款基于§R新秩序：欧洲末日§!制作的模组！毫不夸张地说，我们的团队走过了一段史诗般的历程，从最初一个关于别列兹尼基模组的灵光乍现，到如今展现在您眼前的这一成品，若没有您的鼎力支持，这一切都将无从谈起。是的，正是您的支持，激励着我们不断前行，克服了所有的艰难险阻。尽管前路荆棘密布，但我们披荆斩棘，而您现在所看到的，正是这付出的所有心血所浇灌出的累累硕果。\n\n在此，我们首先要向以下诸位致以最诚挚的谢意：\n\n§B奠基人§!：\n项目领袖和精神领袖——§YLandrayn（尼洛夫）§!\n§YPruss§!\n§YFrost Mango§!\n\n§R图标美工：\nLuftburger\nА123\n米斯捷尔·格里沙\nMCTimur\nGoslya\n\n§!§B写手：\nVartag\nIcelesarius\nEl Whoop\nFINISH_SURVIVORS\n伊利亚·索科洛夫\n阿尔谢尼·比布涅夫\n\n§G肖像美工：\nGla1S\nDZugendov\n布特尔卡·库梅萨\n§!\n§b特别鸣谢：\narturarmyanskiy（代码协助）\nHAKOPMNTE_DEDA（柯西金旗帜）\nOls（英文本地化）\n§!"
