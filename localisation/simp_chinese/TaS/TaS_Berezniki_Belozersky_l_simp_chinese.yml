 berez_exper.6.t:0 "“第三只眼”项目失败"
 berez_exper.6.d:0 "当尼古拉·沙林正在小口小口地抿他的咖啡时，他的雇员们送来一份部里的命令。命令里提到了制造一种搭载火箭炮的试验性重型坦克，作为战场上的一种支援坦克。的确，这种坦克可以参与一线战场的对决，并用它的火箭炮弹把敌人统统发送上天。\n\n项目的工作很快开始了。新坦克的主武器是一种火箭发射器，它会以每分钟4-5轮的速度发射可以打击4千米以内目标的反坦克导弹。火箭也会用作坦克的副武器。设计师们引入了许多改进技术，他们折叠了稳定装置、使用了红外制导技术。\n\n计划完成后，项目本身开始实施。项目选用的原材料颇为贵重。第一台原型机建成只花了八天，随即开始测试。尼古拉·沙林本人就曾经是一名坦克驾驶员，所以他第一时间站了出来。一切……糟糕透顶。\n\n这玩意甚至都开不起来。究其原因，是工作人员出于这款坦克耗能大的考虑，选用了一台大功率的发动机，但是发动机运行的时候爆燃过于剧烈导致了损毁。\n\n所以他们试图用一种功率更低的发动机，但还是开不动。这一次是因为发动机供给的能量不足以克服坦克路径上的摩擦力！所以现在，尼古拉·沙林和他的同事们必须放下项目研发和查找缺陷的工作，而亲自去寻找既能承受住巨大能量，又能保证坦克运行的高材料强度的发动机。\n\n最终坦克是开起来了。速度很慢，但它能动已经是谢天谢地了。就在这时别洛泽尔斯基来了。\n\n别洛泽尔斯基只觉得出离愤怒。这坦克不仅慢得离谱，而且根本没在武器这一坦克的最主要部件上遵循他最初提的要求！尼古拉·沙林真该为这种东西感到羞耻。沙林本人听着别洛泽尔斯基恫吓，说他是纸上谈兵的混账，越来越感觉自己应该找块肉冻一头撞死。别洛泽尔斯基最后还是走了，大家都很沮丧。"
 berez_exper.6.a:0 "有人轰然倒地"
 MAR_Third_eye_fail_tt_effect:0 "§W我们得不到任何实质上的好处§!"
 MAR_EXP_flying_cabin_dec:0 "§B“空中辎车”§!项目"
 MAR_EXP_flying_cabin_dec_desc:0 "好比坦克在未来战争中的角色，直升机将要扮演的角色是不可限量的。我们将以YAK-60工程为抓手，制造一种可以短时长距离运输大量货物的大型货运直升机。但是，这个项目风险很大，给它投资必须要三思而后行。"
 berez_exper.7.t:0 "“空中辎车”项目大获成功"
 berez_exper.7.d:0 "国家给尼古拉·沙林下了一道新命令：制造一种既可以满足民用需要，又可以作为整个空输部队主力机型的新式直升机。毕竟毋需多想，具备这样高速度的部队将有能力抵达任何一条需要援助的前线。因此研发很快就开始了。\n\n基本上，俄罗斯还没有什么直升机，甚至连尼古拉·沙林这样的科学家这辈子还没亲眼见过一架。所以他们首先要来了一批美式直升机的图画。所有人都仔细端详着这些图，试图理解机器是怎么工作的。他们很快针对图中的直升机提出了一些意见：旋翼应该设计得很大，才能让直升机有足够的空气动力升起来；并且为了顺利地制造飞得起来的直升机，应在其上布置两架引擎。\n\n研发工作开始了。虽然一开始试验的客舱颇轻，团队还是用到了进口的旋翼，因为他们的运算经得起这样的浪费。经过两个月的不眠之夜，飞机准备就绪。成品的重量超过了一百吨，其有效载荷达到了约五十吨——这不仅在俄罗斯是一大突破，在世界上也是一大突破！\n\n别洛泽尔斯基甫一抵达机场，就被巨大的直升机惊艳到了。当看到庞然大物升入空中时，他为其完美而喟叹，几乎要幸福得晕过去。直升机有超强的载货能力，可以运送坦克，这一点也在别洛泽尔斯基心中大大地加了分。这种奇迹一般的造物立即被公布了。"
 berez_exper.7.a:0 "天空将掌握在我们手中"
 MAR_Flying_Cabin_sucess_tt_effect:0 "§D单位速度：+5%\n移动损失组织度：-5%§!"
 berez_exper.8.t:0 "“空中辎车”项目部分成功"
 berez_exper.8.d:0 "尼古拉·沙林收到一道新命令：制造一种既可以满足民用需要，又可以作为整个空输部队主力机型的新式直升机。毕竟毋需多想，具备这样高速度的部队将有能力抵达任何一条需要援助的前线。因此研发很快就开始了。\n\n基本上，俄罗斯还没有什么直升机，甚至连尼古拉·沙林这样的科学家这辈子还没亲眼见过一架。所以他们首先要来了一批美式直升机的图画。所有人都仔细端详着这些图，试图理解机器是怎么工作的。他们很快针对图中的直升机提出了一些意见：旋翼应该设计得很大，才能让直升机有足够的空气动力升起来；并且为了顺利地制造飞得起来的直升机，应在其上布置两架引擎。\n\n研发工作开始了。虽然一开始试验的客舱颇轻，团队还是用到了进口的旋翼，因为他们的运算经得起这样的浪费。经过两个月的不眠之夜，飞机准备就绪。成品的重量超过了一百吨，其有效载荷达到了约三十五吨，这在俄罗斯就是一大突破了。但是，进口旋翼的动力并不是很强，这使得直升机只能缓缓起飞，最大高度也低于传统的轰炸机。\n\n别洛泽尔斯基甫一抵达机场，就被巨大的直升机惊艳到了。他紧紧跟在其后，看着这个庞然大物升入空中。当然这个敏感的人怀有更高的期望，但是现在的直升机还是给他留下了深刻印象。\n\n直升机可以成建制地运送步兵排，这为我们的部队提供了良好的机动能力。生产直升机的计划立即被公布了。"
 berez_exper.8.a:0 "我挺满意的"
 MAR_siamese_Flying_Cabin_partial_sucess_tt_effect:0 "§B单位速度：+2.5%\n移动损失组织度：-2.5%§!"
 MAR_EXP_low_start_dec:0 "§o“笨鸟先飞”§!项目"
 MAR_EXP_low_start_dec_desc:0 "还没有人在俄罗斯的领土上尝试过制造这种突破性的喷气式飞机，因此我们必须成为这方面的先行者。T-58VD计划是一大突破，因为它将完全采用国产的涡轮喷气式引擎，我们在这方面已经积累了一定的知识，取得了某些技术进步。现在只需要妥善的实践了。"
 berez_exper.9.t:0 "“笨鸟先飞”项目大获成功"
 berez_exper.9.d:0 "这一次，尼古拉·沙林收到了制造可以快速“升空机动”的战斗机的任务。他明白，这项任务就是要他制造出一种可以在场地极度受限，跑道比较短的条件下起降的战斗机。尼古拉·沙林很热衷于战斗机，他直接向团队其他成员提出，这种飞机肯定需要额外的发动机来帮助实现这样迅捷的起飞与降落。\n\n制作就这样开始了。团队把这个项目定位为“改进型”。他们的的确确就要来了一架老旧的苏联时期的战斗机，更换了其发动机并又增加了一台提供额外升力的发动机。第一次试飞显示飞机的性能提升卓著：当附加的发动机启动时，起飞速度从390千米每小时降到了285千米每小时，对于降落速度则是从315千米每小时降到了225千米每小时。至于起飞滑跑距离，从1170米降至500米，降落滑跑距离则从1000米降至560米。这是很大的进步。并且，那台发动机还能提升飞机的飞行速度！\n\n别洛泽尔斯基坐在检阅台上，看着飞机像鹰隼一般掠过云层，心情好极了。很快那架被命名为T-58VD的飞机着陆。一切都是那么的迅捷，那么的斩钉截铁。别洛泽尔斯基对这一工程的印象很深刻，他立即回到办公室，宣布这种战斗机要大量生产。"
 berez_exper.9.a:0 "大鹏展翅"
 MAR_Low_start_sucess_tt_effect:0 "§F战斗机任务效率：+5%§!"
 berez_exper.10.t:0 "“笨鸟先飞”项目部分成功"
 berez_exper.10.d:0 "这一次，尼古拉·沙林收到了制造可以快速“升空机动”的战斗机的任务。他明白，这项任务就是要他制造出一种可以在场地极度受限，跑道比较短的条件下起降的战斗机。尼古拉·沙林很热衷于战斗机，他直接向团队其他成员提出，这种飞机肯定需要额外的发动机来帮助实现这样迅捷的起飞与降落。\n\n制作就这样开始了。团队把这个项目定位为“改进型”。他们的的确确就要来了一架老旧的苏联时期的战斗机，更换了其发动机并又增加了一台提供额外升力的发动机。第一次试飞显示飞机的性能提升卓著：当附加的发动机启动时，起飞速度从390千米每小时降到了285千米每小时，对于降落速度则是从315千米每小时降到了225千米每小时。至于起飞滑跑距离，从1170米降至500米，降落滑跑距离则从1000米降至560米。这是很大的进步。但是也有其不足：增加的发动机喷出的高温气体明显影响到了飞机的其它部件，机动性大幅下降，载油量也受到了明显的影响。\n\n别洛泽尔斯基坐在检阅台上，看着飞机像鹰隼一般掠过云层，心情好极了。很快那架被命名为T-58VD的飞机着陆。一切都是那么的迅捷，那么的斩钉截铁。不久之后，沙林向别洛泽尔斯基说明了这款战斗机的缺点，提出其不应大量生产，因为那台发动机造成的缺点相对优点来说实在是太明显了。别洛泽尔斯基认真听着尼古拉·沙林讲话。当他不久后回到办公室时，他宣布了一项定做少数T-58VD的命令。"
 berez_exper.10.a:0 "至少这玩意没掉下来"
 MAR_siamese_Low_start_partial_sucess_tt_effect:0 "§F战斗机任务效率：+2.5%§!"
 MAR_EXP_thunder_fury_dec:0 "§m“天怒神威”§!项目"
 MAR_EXP_thunder_fury_dec_desc:0 "这是同一批项目中最不寻常的一个，其目标是制造一种划时代的新武器，让过往所有的装备都相形见绌。我们想制造一种电磁炮，使其轰击任何目标都能造成一定损失。然而我们的科学家对此表示怀疑，他们认为这个项目注定要失败。尽管如此，别洛泽尔斯基还是十分愿意资助这个项目，并且至少得到和他要求的差不多的武器。"
 berez_exper.11.t:0 "“天怒神威”项目大获成功"
 berez_exper.11.d:0 "尼古拉·沙林也算一个地地道道的乐观主义者了，但当他明白国防部要他的科学家团队搞武器化的线圈炮的时候，他觉得自己的大脑要宕机了。是，如果能造出来，这的确会是枪炮中的大杀器，但先要通过物理学这关。常识告诉他肯定做不出来，但是命令就是命令……\n\n要做一个普通版本的小线圈炮不困难，但要做到像狙击步枪那么大，就不是一个级别的问题了。首先，由于整体结构做大了，枪管也要为增大子弹的动能而扩大，那么也需要更多的电容器。其次，为了让武器看起来更像狙击步枪，团队修改了其设计，加上了光学瞄准具和两脚架，等等。\n\n不久测试新武器的一天来到了。扳机一扣，子弹就立即打到了一公里外的目标上。很多人都不知道该做出什么反应，是为此高兴呢，还是想想这愚蠢的造物居然成功了。至少沙林没庆祝，因为他发现虽然子弹的速度很快，但是武器的低效率还是使得这一次射击耗费了巨大的能量。他又花了几天思考怎么提高武器的能量利用效率，减少消耗，并且他不就就想到了——只需要用到一种分阶充能的加速系统！虽然效率还没提到四成，但从百分之三到百分之二十四就是个大突破了。\n\n别洛泽尔斯基来之前，他们刚好造完这种新炮。别洛泽尔斯基立即赶到了这边，从望远镜里看到了目标——一公里外的一辆坦克。啪的一下，他的一个保镖开了枪，坦克上留下了一道贯穿的弹孔，因为子弹没有被弹回来。别洛泽尔斯基很高兴，当他听说这玩意比一般的线圈炮耗能还少的时候，他更高兴了。后来大家发现，他是要给沙皇的护卫队装备这种电磁炮，具体地说，是给某些单位的狙击手，他们要做……很多事……都是国家的大事……"
 berez_exper.11.a:0 "谁会想到呢！"
 MAR_Thunder_Fury_sucess_tt_effect:0 "§D陆军单位进攻+10%\n补给耗尽-10%§!"
 berez_exper.12.t:0 "“天怒神威”项目部分成功"
 berez_exper.12.d:0 "尼古拉·沙林也算一个地地道道的乐观主义者了，但当他明白国防部要他的科学家团队搞武器化的线圈炮的时候，他觉得自己的大脑要宕机了。是，如果能造出来，这的确会是枪炮中的大杀器，但先要通过物理学这关。常识告诉他肯定做不出来，但是命令就是命令……\n\n要做一个普通版本的小线圈炮不困难，但要做到像狙击步枪那么大，就不是一个级别的问题了。首先，由于整体结构做大了，枪管也要为增大子弹的动能而扩大，那么也需要更多的电容器。其次，为了让武器看起来更像狙击步枪，团队修改了其设计，加上了光学瞄准具和两脚架，等等。\n\n不久测试新武器的一天来到了。扳机一扣，子弹就立即打到了一公里外的目标上。很多人都不知道该做出什么反应，是为此高兴呢，还是想想这愚蠢的造物居然成功了。至少沙林没庆祝，因为他发现虽然子弹的速度很快，但是武器的低效率还是使得这一次射击耗费了巨大的能量。他又花了几天思考怎么提高武器的能量利用效率，减少消耗，但他绞尽脑汁也没想明白怎么做才好……\n\n别洛泽尔斯基来之前，他们刚好造完这种新炮。别洛泽尔斯基立即赶到了这边，从望远镜里看到了目标——一公里外的一辆坦克。啪的一下，他的一个保镖开了枪，坦克上留下了一道贯穿的弹孔，因为子弹没有被弹回来。别洛泽尔斯基很高兴，尽管武器的高耗能和高造价给他浇了一瓢冷水，他还是很满意。后来大家发现，他是要给沙皇的护卫队装备这种电磁炮，具体地说，是给一些经验丰富的狙击手，他们要做……很多事……都是国家的大事……"
 berez_exper.12.a:0 "小说成真了？"
 MAR_siamese_Thunder_Fury_sucess_tt_effect:0 "§D陆军单位进攻+5%\n补给耗尽-5%§!"
 berez_exper.13.t:0 "“天怒神威”项目失败"
 berez_exper.13.d:0 "尼古拉·沙林，一个彻头彻尾的乐观主义者。然而，当国防部要求他的团队将高斯线圈炮转化为武器时，他再也无法抑制内心的情感！没错，这玩意儿杀伤力惊人，但物理规律和常识都在呐喊着“不可能”！然而，军令如山啊...\n\n组装一台普通的线圈炮并不难。但将其改造为类似狙击步枪的扩展版本，却完全是另一码事…首先，整个结构都需要扩大：枪管加长以提高速度，并添加了大量的电容器。然后，为了使其看起来像一把狙击步枪，他们还添加了光学瞄准镜、双脚架等设计元素。\n\n试验的日子终于到来了。扣动扳机，子弹瞬间击中了一公里外的目标！然而，武器过热严重——射手立刻将其扔进了沙子里。此外，低效率意味着巨大的能量消耗，浪费的能量都用来加热步枪本身。但这正是线圈炮的主要特点——低效率。由于无法解决这个问题，他们决定更换步枪的材料，选择导热性更低的材料。但找到的材料非常脆弱，似乎一枪就会让整个结构分崩离析…\n\n很快，别洛泽尔斯基亲自前来检查这个项目。他站在线圈炮附近，透过双筒望远镜观察目标——一公里外的一辆坦克。射击。坦克被击穿了，没有发生跳弹，而射手正是别洛泽尔斯基的保镖。别洛泽尔斯基欣喜若狂，但随后他注意到他的卫兵手里拿着的不是线圈炮，而是它的碎片。他要求解释：为什么士兵需要一个开一枪就会散架的东西？尼古拉和其他人只能耸耸肩，别洛泽尔斯基愤怒地带着他的保镖离开了。"
 berez_exper.13.a:0 "不该想得太美的"
 MAR_Thunder_Fury_fail_tt_effect:0 "§R资金打了水漂§!"
 MAR_EXP_edem_dec:0 "§Y“伊甸乐土”§!项目"
 MAR_EXP_edem_dec_desc:0 "信息科技的浪潮席卷而来，军事领域亦无法置身事外。加密技术日趋复杂，人力破译几近天方夜谭，唯有借助机器之力方能破解天机。同时，数据如洪水般爆发式增长，亟需安全的栖身之所。值此之际，我国科学家提议打造一台名为“伊甸园”的超级计算机，它将成为俄罗斯首屈一指的智慧结晶。拥有它，我们将领先于所有敌对势力，在未来数十年内立于科技之巅。"
 berez_exper.14.t:0 "“伊甸乐土”项目大获成功"
 berez_exper.14.d:0 "尼古拉·沙林正襟危坐于办公室中，忽闻国防部来信：建造一台超级计算机，用以储存国家机密和计划，计算可能发生的冲突，并研发和模拟新型武器。此外，这样的超级计算机未来还可用于精简官僚机构。这一提议得到了广泛的赞同。\n\n然而，在俄罗斯，许多人连电话或收音机这样的基础电子设备都尚未拥有，建造超级计算机谈何容易？但我们是科学家，而非普通百姓。尼古拉立即着手组建团队。起初，他们对超级计算机的建造一无所知，但通过招募专家和研读大量科学文献，他们终于迈出了第一步。\n\n首先，他们制造了大量服务器，这些服务器将成为这个庞大项目的基石。接着，他们用高速局域网将这些服务器连接起来，以实现性能的最大化。然后，他们迎来了最艰难的挑战——计算任务的并行化。因为每秒执行的计算数量主要取决于此。\n\n多亏了来自美国的顾问以及自身的智慧，这台超级计算机终于组装完成，并展现出了惊人的性能！它很快就被移交给国防部，并迅速投入使用。仅仅一天的运行，他们就已无法想象没有“超级计算机-1”的生活。"
 berez_exper.14.a:0 "欢迎来到二十世纪，先生们"
 MAR_Edem_sucess_tt_effect:0 "§W我们得不到任何实质上的好处§!"
 berez_exper.15.t:0 "“伊甸乐土”项目部分成功"
 berez_exper.15.d:0 "尼古拉·沙林正襟危坐于办公室中，忽闻国防部来信：建造一台超级计算机，用以储存国家机密和计划，计算可能发生的冲突，并研发和模拟新型武器。此外，这样的超级计算机未来还可用于精简官僚机构。这一提议得到了广泛的赞同。\n\n然而，在俄罗斯，许多人连电话或收音机这样的基础电子设备都尚未拥有，建造超级计算机谈何容易？但我们是科学家，而非普通百姓。尼古拉立即着手组建团队。起初，他们对超级计算机的建造一无所知，但通过招募专家和研读大量科学文献，他们终于迈出了第一步。\n\n首先，他们制造了大量服务器，这些服务器将成为这个庞大项目的基石。接着，他们用高速局域网将这些服务器连接起来，以实现性能的最大化。然后，他们迎来了最艰难的挑战——计算任务的并行化。因为每秒执行的计算数量主要取决于此。\n\n多亏了来自美国的顾问以及自身的智慧，这台超级计算机终于组装完成，并展现出了不错的性能！然而，原本应该高速运行的局域网却出现了问题，导致性能大幅下降，但最终结果仍然令人满意！它很快就被移交给国防部，并迅速投入使用。仅仅一天的运行，他们就已无法想象没有“超级计算机-1”的生活！"
 berez_exper.15.a:0 "还不赖。"
 MAR_siamese_Edem_sucess_tt_effect:0 "§W我们得不到任何实质上的好处§!"
 berez_exper.16.t:0 "“伊甸乐土”项目失败"
 berez_exper.16.d:0 "尼古拉·沙林正襟危坐于办公室中，忽闻国防部来信：建造一台超级计算机，用以储存国家机密和计划，计算可能发生的冲突，并研发和模拟新型武器。此外，这样的超级计算机未来还可用于精简官僚机构。这一提议得到了广泛的赞同。\n\n然而，在俄罗斯，许多人连电话或收音机这样的基础电子设备都尚未拥有，建造超级计算机谈何容易？但我们是科学家，而非普通百姓。尼古拉立即着手组建团队。起初，他们对超级计算机的建造一无所知，但通过招募专家和研读大量科学文献，他们终于迈出了第一步。\n\n首先，他们制造了大量服务器，这些服务器将成为这个庞大项目的基石。接着，他们用高速局域网将这些服务器连接起来，以实现性能的最大化。然后，他们迎来了最艰难的挑战——计算任务的并行化。因为每秒执行的计算数量主要取决于此。\n\n尽管有来自美国的顾问，但这台超级计算机却无法正常工作！服务器根本无法承受这些计算以及数据传输，坦白地说，这也在意料之中，因为他们从未组装过服务器！因此，他们只能将剩余的资金送回国防部…"
 berez_exper.16.a:0 "最好还是把钱用在刀刃上。"
 MAR_Edem_fail_tt_effect:0 "§R资金打了水漂§!"
 MAR_EXP_Nine_lives_dec:0 "§G“九头神蛇”§!项目"
 MAR_EXP_Nine_lives_dec_desc:0 "重型装甲“勇士-1”能够有效抵御轻武器的攻击，从而极大地提高步兵在战场上的生存能力。目前，我方士兵除了头盔外没有任何防护措施，任何一颗流弹都可能让他们命丧黄泉。“勇士-1”装甲将为我们的士兵提供坚不可摧的保护，让他们免受此类伤害。"
 berez_exper.17.t:0 "“九头神蛇”项目大获成功"
 berez_exper.17.d:0 "尼古拉·沙林接到了一个紧急的国家订单：为特种部队研发一款重型作战装甲。为特种部队配备的装甲服……“这有什么意义呢？”沙林不禁这样想到，然而在一番思索之后，他也逐渐理清了思路。毕竟，这款装甲目前只计划配发给特种部队，对他们而言，机动性并不是最重要的，强大的火力和面对精锐敌军时的生存能力才更加关键。想明白这些，他便立即投身到了工作中。\n\n首先，需要找到一种惰性材料，这种材料不能够和任何物质发生反应——包括各种化学试剂。而且，这款装甲还必须具备防弹能力。当然，这款装甲的重量也不能太重，毕竟机动性也同样重要。最终，他发现了一种强度极高的金属复合合金，这种合金中包含了大量的金属元素，这也赋予了这款装甲近乎全能的防御性能。更令人惊喜的是，这款合金的重量也出乎意料地轻——只有区区十八公斤，这意味着一个身体强健的士兵甚至可以穿着它进行奔跑！\n\n这款装甲的样品制成后，一系列的试验紧锣密鼓地展开了：一名身着“战士-1”型装甲的士兵轻松地通过了一处布满致命陷阱的试验场。要知道，即使是经验最为丰富的士兵也绝对不敢轻易涉足其中！这是一次令人瞠目结舌的巨大成功！\n\n现在，别洛泽尔斯基正站在观礼台上，亲眼见证着这台宛如机器人一般的士兵毫不费力地通过这处试验场。他仿佛从中看到了特种部队的未来……甚至有可能是整支军队的未来！"
 berez_exper.17.a:0 "不死士兵横空出世"
 MAR_Nine_Lives_sucess_tt_effect:0 "§D陆军单位进攻+10%§!"
 berez_exper.18.t:0 "“九头神蛇”项目部分成功"
 berez_exper.18.d:0 "尼古拉·沙林接到了又一项需要紧急完成的国家任务：为特种部队研制一套重型战斗装甲。特种部队的装甲……“为什么？”沙林心中充满了疑惑，但他转念一想，特种部队并不需要太高的机动性，他们更需要的是强大的火力和在面对精英部队时的生存能力。于是，他很快便投入了工作。\n\n防空啊——首先，他需要找到一种不会与任何物质发生反应的材料，包括任何化学物质。此外，这套装甲还必须防弹。然而，它的重量不能太大，毕竟机动性也很重要。最终，他找到了一种坚固的金属复合合金，其中包含了大量的金属，使其具备了抵御一切的能力。然而，唯一的问题是，整套装甲重达三十公斤！穿上它，你只能缓慢行走，否则就会被它活活压死…\n\n很快，这套装甲研制完成，并开始了实验：一名装备了“勇士-1”的士兵轻松地通过了一条布满致命陷阱的测试路径。就连经验丰富的士兵也不敢踏足那里！这是一次令人眩目的成功！此刻，别洛泽尔斯基站在讲台上，看着这名机器人般的士兵轻松地通过测试路径。他注意到，这名士兵虽然自信，但却走得很慢——这套装甲太重了。或许，它更适合用于突袭行动，利用出其不意的效果，让敌人无处可逃？"
 berez_exper.18.a:0 "我们只需要找到一个合适的策略"
 MAR_Nine_Lives_partial_sucess_tt_effect:0 "§Division protection +5%§!"
 berez_kazahk_succ_tt:0 "§G我们将兵不血刃地在哈萨克斯坦确立我们的统治§!"