 berez_exper.2.t:0 "“连体双煞”项目部分成功"
 berez_exper.2.d:0 "尼古拉·沙林是西俄罗斯王国顶尖的科学家之一。国防部将一项光荣而艰巨的任务交给了他：研制一款全新的步枪，装备俄罗斯军队，或者，至少是皇家卫队。\n\n项目进展缓慢，但还算顺利。首先，他们需要为这款新式武器选择，或者说，发明一种合适的弹药：5.45×39毫米。这种子弹的优势非常明显：杀伤力比7.62毫米更强；弹道平稳，这意味着士兵在瞄准时需要进行的修正更少；此外，更轻的重量和更高的初速，能够让士兵在战斗中占据先机。\n\n接下来是武器的研发。为了降低成本，便于大规模装备军队，他们选择了较为廉价的材料。然而，第一次试验就遭遇了滑铁卢：子弹卡在了枪管里。很快，第二次试验开始了。这一次，武器总算成功发射了子弹，但随之而来的问题是，枪管过热，导致士兵无法连续射击两次！为了解决这个问题，他们决定使用导热性更低的金属材料，但这同时也意味着更高的成本。然而，这种金属也并非完美无缺：它太重了，会降低士兵的机动性。\n\n为了找到最合适的材料，他们开始尝试各种合金。最终，他们成功了！虽然为此花掉了预算的一半，但总算达成了目标。当然，成品的性能并不像项目之初设想的那样完美，但无论如何，这都是一个巨大的突破！\n\n在新武器即将接受别洛泽尔斯基沙皇陛下检阅的前一天，他们终于为它想好了名字：AO-63。检验开始了，科学家们都紧张极了：万一出现什么差错，或者有什么地方不符合预期，那他们日以继夜的辛苦付出，岂不是付诸东流？尼古拉更是焦虑不安，毕竟，他是这个项目的负责人。\n\n别洛泽尔斯基的一名卫兵拿起一支AO-63步枪，朝着不同的目标射击。沙皇陛下起初目不转睛地盯着射击过程，随后便开始翻阅科学家们递交的文件，想要仔细了解这款武器的材质、射速以及其他性能参数。\n\n检验结束后，别洛泽尔斯基开始了与科学家们的交谈：\n\n“我对这款武器并没有太深刻的印象……我承认，它比旧的AK-47要好得多，但要说是什么突破性的进展……也许是吧，但是它的制造成本太高了，这与我们最初的目标相悖……”\n\n“很遗憾，现实总是很残酷……”尼古拉代表他的团队，低声说道。\n\n别洛泽尔斯基斜了尼古拉一眼。事情本可以做得更好。第二天，一份为皇家卫队配备新型AO-63步枪的命令正式签署。"
 berez_exper.2.a:0 "至少有点东西"
 MAR_siamese_Siblings_partial_sucess_tt_effect:0 "§D陆军攻击：+2.5%\n陆军防御：+2.5%§!"
 berez_exper.3.t:0 "“连体双煞”项目失败"
 berez_exper.3.d:0 "尼古拉·沙林是西俄罗斯王国的主要科学家之一。国防部的命令认为，他的工程才华应该为祖国母亲所用。他和他下属的团队的任务是为俄罗斯军队，也就是皇家卫队，制造一款新的步枪。\n\n这个计划进展缓慢，但也很稳定。首先确定下来或者说发明出来的，是其弹药：5.45 ×39毫米子弹。这种子弹有非常明显的优势，它们对软组织造成的损伤超过7.62毫米子弹，而且弹道非常平直，使得瞄准时的高度修正很小。另外，子弹的轻便甚至其高速都可以让我们在敌人面前不落下风。\n\n之后研发正式开始。选择的材料都很便宜，这样武器生产能够轻易满足部队的要求。第一次试验发现这种武器……糟糕透顶。这种枪根本无法承受子弹带来的压力。后几轮试验中，上一次炸膛了，下一次融化了，再下一次就是枪的结构根本无法承受，直接解体。\n\n需要更多时间来准备……但是验收很快就要来了……别洛泽尔斯基要亲自来看这个智慧的结晶。团队在别洛泽尔斯基抵达的前一天想到了它的名字——AO-63。当验收开始的时候，科学家们都很紧张：如果出了什么事故，事情不按计划进行，他们日日夜夜付出的心血岂不是要付之东流？当然，尼古拉·别洛泽尔斯基本人比他们更紧张。\n\n一位别洛泽尔斯基的保镖拿起一把枪，开始朝不同的目标射击。科学家们祈祷不会出事，但是造化弄人。还没来得及打空一半弹匣，由于压力，步枪就从士兵的手里硬生生炸开了。所有人都明白别洛泽尔斯基会很不高兴。他的确是很不高兴。\n\n“还能是怎么回事？我们不是把钱都花在这上面了吗？我一大早起来是来看这种东西的吗？你们真该造个大炮，至少那玩意不会爆炸！AO-63，或者你们说的什么‘俄罗斯工程的遗产’，赶紧关掉，忘了它吧！”\n\n别洛泽尔斯基离开了实验室，只剩下一群瑟瑟发抖的科学家。"
 berez_exper.3.a:0 "我雇他们来干啥呢？"
 MAR_siamese_Siblings_fail_tt_effect:0 "§W我们得不到任何实质上的好处§!"
 MAR_EXP_third_eye_dec:0 "§o“第三只眼”§!项目"
 MAR_EXP_third_eye_dec_desc:0 "重型坦克这一设计早就过时了，但是设计局相信一种代号为“757号”的重型坦克可以成为一种支持主力部队的坦克。它可以在战场上为我们穿插中的主战坦克提供宝贵的援助。如果这个工程可以完结并在我们的军队中实施，它只会加强我们的部队在战场上的作战能力。"
 berez_exper.4.t:0 "“第三只眼”项目大获成功"
 berez_exper.4.d:0 "当尼古拉·沙林正在小口小口地抿他的咖啡时，他的雇员们送来一份部里的命令。命令里提到了制造一种搭载火箭炮的试验性重型坦克，作为战场上的一种支援坦克。的确，这种坦克可以参与一线战场的对决，并用它的火箭炮弹把敌人统统发送上天。\n\n项目的工作很快开始了。新坦克的主武器是一种火箭发射器，它会以每分钟4-5轮的速度发射可以打击4千米以内目标的反坦克导弹。火箭也会用作坦克的副武器。设计师们引入了许多改进技术，他们折叠了稳定装置、使用了红外制导技术。\n\n计划完成后，项目本身开始实施。项目选用的原材料颇为贵重。第一台原型机建成只花了八天，随即开始测试。尼古拉·沙林本人就曾经是一名坦克驾驶员，所以他第一时间站了出来。一切顺利。\n\n反坦克导弹顺利地飞向敌人，火箭弹完美地击中距离坦克五公里的目标。因为第一次如此出色的表现，科学家们并没有过于担心别洛泽尔斯基比计划提前一周的抵达。\n\n尼古拉·沙林和他的同事们钦佩地看着别洛泽尔斯基钻进坦克里，亲眼查看里面的细节。当他看过了坦克的速度、精准度和机动性后，别洛泽尔斯基觉得很满意。他向尼古拉·沙林致谢，也赞扬了他的英明的头脑与他的同事们。第二天，“第三只眼”产物的生产计划就公布了。"
 berez_exper.4.a:0 "漂亮。"
 MAR_Third_eye_sucess_tt_effect:0 "§T坦克单位攻击：+5%\n坦克单位防御：+5%§!"
 berez_exper.5.t:0 "“第三只眼”项目部分成功"
 berez_exper.5.d:0 "当尼古拉·沙林正在小口小口地抿他的咖啡时，他的雇员们送来一份部里的命令。命令里提到了制造一种搭载火箭炮的试验性重型坦克，作为战场上的一种支援坦克。的确，这种坦克可以参与一线战场的对决，并用它的火箭炮弹把敌人统统发送上天。\n\n项目的工作很快开始了。新坦克的主武器是一种火箭发射器，它会以每分钟4-5轮的速度发射可以打击4千米以内目标的反坦克导弹。火箭也会用作坦克的副武器。设计师们引入了许多改进技术，他们折叠了稳定装置、使用了红外制导技术。\n\n计划完成后，项目本身开始实施。项目选用的原材料颇为贵重。第一台原型机建成只花了八天，随即开始测试。尼古拉·沙林本人就曾经是一名坦克驾驶员，所以他第一时间站了出来。一切……还算不错。\n\n坦克可以正常行进、开火，但是导弹和炮弹的精度差的不是一星半点。它那可怜的速度也让大伙担心它到底能不能对抗机动性强一点的坦克。\n\n团队针对射击精度和速度作出了一系列调整。但如果把射击精度的问题解决了，速度方面又要出问题。他们修改了其空气动力学结构，又升级了引擎，但是这些努力杯水车薪。所以团队又考虑了改换车体材料。他们已经想出来了一套完美的替代方案，但此时别洛泽尔斯基已经来视察工程进度了……\n\n他的反应完全不出乎工作人员们的意料。看过项目演示之后，别洛泽尔斯基赞赏了坦克出色的射击与毁伤能力，称这种钢铁巨兽肯定能让任何敌人吃点苦头。但另一方面，只要有人想做，就很容易摧毁这种坦克，因为其速度实在是太慢了，几乎要成为战场上的活靶子。\n\n“第三只眼”项目的产物还是要投产，整个团队得知这个决定后齐齐长舒了一口气。虽然这也算个胜利，但是所有人都明白，还有不少事情要做……"
 berez_exper.5.a:0 "不错，但本可以更好的"
