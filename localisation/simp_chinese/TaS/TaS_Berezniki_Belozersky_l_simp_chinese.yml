 MAR_experiments_category_desc:0 "说实话，实验开发设计局是一项风险投资。在这里，没有人能对某些开发项目的成功给出明确的保证，这些项目现在充其量只存在于科学家的脑海中。然而，沙皇将军别洛泽尔斯基要求我们在这个行业取得任何成果，他愿意为开发前景技术和军事装备蓝图投入大量资金。\n\n在这个设计局头脑风暴产生的无穷无尽的想法中，我们选择了7个最有前景和可行的项目,这些项目可能决定我们军队的效率。\n§Y“连体双煞”§!项目：[ MAR_EXP_GET_SS_STATUS] \n§g“第三只眼”§!项目：[ MAR_EXP_GET_TE_STATUS]\n§B“空中辎车”§!项目：[ MAR_EXP_GET_FC_STATUS]\n§o“笨鸟先飞”§!项目：[ MAR_EXP_GET_LS_STATUS]\n§m“天怒神威”§!项目 ：[ MAR_EXP_GET_TF_STATUS]\n§Y“伊甸乐土”§!项目：[ MAR_EXP_GET_ED_STATUS]\n§G“九头神蛇”§!项目：[ MAR_EXP_GET_NL_STATUS]"
 MAR_EXP_seameese_twins_dec:0 "§Y“连体双煞”§!项目"
 MAR_EXP_seameese_twins_dec_desc:0 "西蒙诺夫和特卡切夫设计的双管突击步枪之所以必要，从军事角度来看，在每公里战线上我们将拥有明显更高的火力密度，理论上可以在进攻和防御中给予敌人强大优势。如果我们想要获得这种对敌人的优势，那么我们应该认真考虑投资这个项目。"
 berez_exper.1.t:0 "“连体双煞”项目大获成功"
 berez_exper.1.d:0 "尼古拉·沙林是西俄罗斯王国的首席科学家之一。根据国防部的命令，他那天才的工程技能将被用于造福祖国！他和他的团队被赋予了一项重要任务：为俄罗斯军队，或者至少是皇家卫队，研发一款全新的步枪。\n\n项目进展缓慢但顺利。首先，他们需要为新式武器选择，或者说，发明一种合适的弹药：5.45×39毫米。这种子弹的优势非常明显：对软组织的杀伤力比7.62毫米更强；弹道平稳，这意味着士兵在瞄准时需要进行的修正更少；此外，更轻的重量和更高的初速，能够让士兵在战斗中占据先机。\n\n研发工作随后展开。为了降低成本，便于大规模装备军队，他们选择了较为廉价的材料。然而，第一次试验的结果却出乎意料地好！高射速、高精度、高命中率，堪称俄罗斯工程学的杰作。当然，他们还是进行了一些微调，例如改进子弹的气动外形，以获得更完美的性能。\n\n在新武器即将接受别洛泽尔斯基沙皇陛下检阅的前一天，他们终于为它想好了名字：AO-63。检验开始了，科学家们都紧张极了：万一出现什么差错，或者有什么地方不符合预期，那他们日以继夜的辛苦付出，岂不是付诸东流？尼古拉更是焦虑不安，毕竟，他是这个项目的负责人。\n\n别洛泽尔斯基的一名卫兵拿起一支AO-63步枪，朝着不同的目标射击。结果如何呢？这么说吧，别洛泽尔斯基陛下简直要对这款新式步枪垂涎三尺了。\n\n别洛泽尔斯基从座位上站了起来，走向科学家们，兴奋地说道：“太棒了！这简直太棒了！”\n\n随后，别洛泽尔斯基特意与尼古拉攀谈起来。他详细询问了武器的生产成本，当得知AO-63几乎是用“破铜烂铁”拼凑出来的时候，他更是喜出望外。第二天，别洛泽尔斯基签署了一项法令，正式采用AO-63步枪。"
 berez_exper.1.a:0 "干得好！"
