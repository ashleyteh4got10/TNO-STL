l_simp_chinese:
 MAR_the_first_decrees:0 "首批法令"
 MAR_the_first_decrees_desc:0 "如今，别洛泽尔斯基既已加冕为沙皇，国祚亦渐趋稳固，是时候着手草拟首批法令了。曾几何时，为了让国家为争夺西俄罗斯做准备，我们不得不牺牲了劳工们的工作条件。而今，西俄之战已大获全胜，我们也该考虑改善劳工们的生活了。毕竟，这是他们应得的。"
 berez_belozerski.1.t:0 "首批法令"
 berez_belozerski.1.d:0 "“沙皇陛下，颁布第一批法令的时机已到。您打算如何施政？” 顾问询问道。\n\n“我们的第一道法令，或者说我们的下一步行动，我的朋友，将是兑现对人民的竞选承诺。我们曾承诺改善人民的福祉，现在是时候将这一理念付诸实践了。” 别洛泽尔斯基语气坚定地说道。\n\n“那些实业家们会同意这样的限制吗？” 顾问有些怀疑地问道。“毕竟，当初在缙绅会议上支持我们的，正是他们。”\n\n“他们支持我们可不是为了这个。况且，我们提出的工作环境改善措施，对于我们刚刚起步的工业来说，应该不会造成太大的影响，而且，这些措施也不会太过严苛。是的，从某种意义上来说，工厂的生产力可能会下降，但工人们现在正遭受着机器带来的过度劳累之苦。我们先前在西俄战役前颁布的法令，现在适用于整个西俄地区，这些地区现在不应该再进行生产，而且目前也没有必要这样做。因此，我们必须解决这个问题。”\n\n“如您所愿。我随时准备与您共事。”\n\n过了一段时间，别洛泽尔斯基仔细审阅着顾问们起草的法令。很多次，他都因为法令的可行性不足而将其驳回，并要求下属们进行修改和完善，力求将每个细节都打磨得尽善尽美。最终，别洛泽尔斯基终于表示，这些法令的版本已经足够完善，可以发布了。最后，他签署了这份将有助于提高人民福利的文件："
 berez_belozerski.1.a:0 "批准，生效。"
 MAR_integration_of_officials:0 "吸纳旧吏"
 MAR_integration_of_officials_desc:0 "自乌拉尔山脉逶迤至莫斯科边界，广袤的疆域皆归于吾国治下。然而，如此辽阔的版图，治理起来亦非易事。由于官僚体系人手不足，庞杂的政务负荷已然拖累了国家机器，使我等无法顺利推动国家发展。纵使颁布的法令，落实起来也是举步维艰。\n\n回溯到军阀混战的时代，那些盘踞于西俄大地的伪政权也曾试图建立类似国家的架构。任何国家——哪怕仅仅是徒具其表——皆需仰仗官僚体系，这些穷兵黩武的军阀在这方面倒也有所建树。故此，我们当务之急是将这些曾在旧主手下效命的官吏吸纳入我们的队伍中，此举将极大地纾解我们的治理压力，助力国家前行。"
 MAR_freedom_of_choice:0 "选择的“自由”"
 MAR_freedom_of_choice_desc:0 "时至今日，仅凭一人专断已无法统御整个国家。无论君主如何雄才伟略、明察秋毫，在当今的时代，都必须争取人民和各阶层势力的拥戴。1917年的悲剧，根源之一就在于沙皇过分疏离了人民，缺乏实际的联系，这更加削弱了国家的政治力量。\n\n我们绝不会重蹈覆辙。我们的青年俄罗斯主义思想主张，人民也应当参与国家治理。我们必须建立一个议会制的君主立宪制度，容纳国内主要党派的声音。当然，这一切都需要建立在特定的条件之上....."
 berez_belozerski.2.t:0 "选择的“自由”"
 berez_belozerski.2.d:0 "尽管我们希望避免1917年的错误，但我们也必须明白，走向另一个极端同样是不可取的。沙皇的权力和人民的权力应该相辅相成，而不是相互掣肘。显而易见，如果我们建立议会，必然会削弱官方的权威。然而，我们又不能没有议会，否则就会重蹈尼古拉二世的覆辙。因此，我们需要提高组建政党进入议会的门槛。如有必要，甚至可以设置极高的门槛。\n\n于是，议会的筹备工作开始了。别洛泽尔斯基指示他的首相卡津别克着手进行议会改革的准备工作。这是一项艰巨的任务，只能委托给经验丰富的政治家。说来也巧，卡津别克并不需要花费太多时间，因为他最初就有一些现成的方案。他本人深知议会存在的必要性和潜在的危险，因此立即起草了一份法案。\n\n根据卡津别克的方案，议会应被称为最高委员会，由1000人组成，其中750人应为青年俄罗斯的代表，其余250人则代表国内其他政党。此外，政党的成立必须符合相关法律，该法律将与最高委员会法案同时颁布。根据计划，为了建立一个政党，需要满足一系列条件，大约有20条之多。这无疑会增加建立青年俄罗斯联盟反对党的难度。\n\n这些条件的存在最终会导致国内出现一些依附于国家的政党。这些政党的出现将为公民创造一种选择的幻象，而实际上他们根本没有选择。一切早已注定。\n\n卡津别克概述了最高委员会的权利和义务。该机构可以否决沙皇的法律，可以向别洛泽尔斯基提议新的法律，可以向沙皇推荐部长人选等等。但这还不够。卡津别克还提议，在发生权力危机的情况下，别洛泽尔斯基可以将权力完全掌握在自己手中。\n\n别洛泽尔斯基已经做出了他的决定。他知道应该将这项重要的工作托付给谁，于是他在法案上签下了“批准”二字。"
 berez_belozerski.2.a:0 "人们总是轻易的被愚弄……"
 MAR_the_new_soviets:0 "新苏维埃"
 MAR_the_new_soviets_desc:0 "苏维埃制度，理应成为吾国基石中至关重要的一环。曾在布哈林联盟治下的苏维埃，确为解决地方事务之良策。然而，当时的苏维埃深陷政治化泥淖，过分羸弱，离不开国家的扶持，终致联盟经济崩盘。吾辈须引以为鉴，创立形神兼备、契合青年俄罗斯主义的全新苏维埃。\n\n然而，纵使在此议题上，我们依旧面临着重重阻力。一些人对苏维埃制度深恶痛绝，甚至到了闻之色变的地步。因此，我们必须使新生的苏维埃，以一种民众更能接受的方式，应运而生。"
 berez_belozerski.3.t:0 "新苏维埃"
 berez_belozerski.3.d:0 "若要建立“青年俄罗斯”式的国家，下一步便是组建苏维埃。根据最初的构想，苏维埃应当负责处理地方事务，并且在权力所及的范围内，他们也完全有能力胜任这些工作。我们幅员辽阔，为了减轻行政压力，有必要对政府机构进行精简。此外，为了建立君主立宪制的人民政权，我们需要某种形式的议会。而议会的基础，就蕴藏在这些苏维埃之中。\n\n我们本可以轻而易举地直接宣布建立苏维埃制度，但这其中也牵涉到许多复杂的因素。在我们的国家里，仍然存在着一批对“苏维埃”这一概念深恶痛绝的顽固反共分子、保守派和反动分子。在他们看来，苏维埃根本就不应该存在，或者最多只能给予其极为有限的权力。当然，持这种观点的人只是少数，他们并不理解我们所要建立的苏维埃，与他们印象中的苏维埃截然不同。\n\n别洛泽尔斯基责成卡津别克起草一份关于组建苏维埃的法案。几乎是第二天，卡津别克就提交了苏维埃组织法的草案。草案中明确指出，苏维埃必须对人民负责。这意味着，如果公民对其选出的代表感到不满，他们有权罢免该代表。苏维埃的成员应为那些直接参与生产活动的公民，换言之，他们应在从事生产活动的同时履行社会和国家的职责。代表的身份不应成为一种职业，而更像是一种额外的职务。对于那些脱离生产的专职代表，其薪资不得高于普通工人的平均工资水平。\n\n整个方案似乎是一个面面俱到的折衷方案。然而，别洛泽尔斯基对那些将组成最高苏维埃的地方苏维埃提出了一个关键问题：它们的政党构成应如何划分？卡津别克不假思索地回答道，苏维埃中至少应有三分之二的席位属于“青年俄罗斯”党，而根据政党注册法，我们能够有效控制反对派。这样一来，既能维护我们的统治，又能保证我们政权的合法性。\n\n别洛泽尔斯基最终决定签署这份方案。这似乎是一个能够满足社会各阶层诉求的折中方案，因为任何人都可以竞选苏维埃代表，但只有那些拥有投票权的人——即各级苏维埃的代表们——才能参与到最终的决策中来。通过这种方式，我们既能够照顾到人民的利益，也能兼顾那些反对派的诉求。"
 berez_belozerski.3.a:0 "旧瓶装新酒。"
 MAR_governates_borders:0 "省界划定"
 MAR_governates_borders_desc:0 "西俄战事甫定，各地区行政边界的划定问题便浮出水面。许多先前存在的伪政权，彼此间的疆界往往犬牙交错，名义上虽有边界，实则形同虚设。只有在我们的军队驻扎之处，才算得上是有几分国家的边界的样子。然而，这却给我们的行政人员造成了极大的困扰，他们无法确定自己管辖的具体范围。这就导致了有时两位不同的官员可能会收到来自同一地区的两份相同的报告，而这本是不该发生的。现在，我们必须修正这一问题，在我们治下的领土上划定明晰的边界，这些领土将以行省为单位，并且我们的省长们的管辖权也将进一步厘清。"
 MAR_question_of_church:0 "教会问题"
 MAR_question_of_church_desc:0 "在我国面临的诸多问题中，宗教信仰问题尤为突出且棘手。除了东正教，我国还有为数不少的伊斯兰教信众，甚至还有信奉各种基督教派别乃至佛教的群体。在政坛上，有些势力主张将东正教立为西俄地区唯一合法的宗教，而另一些人则希望建立一个政教分离的国家。我们必须在这两种观点中做出抉择，否则这个问题必将在未来引发诸多祸患。"
 berez_belozerski.5.t:0 "教会的命运？"
 berez_belozerski.5.d:0 "听着大臣们汇报着各地请求解决宗教问题的报告，别洛泽尔斯基不禁感到一阵头疼。有些人希望东正教成为唯一合法的宗教，而另一些人则要求国家实行世俗化。他知道，如果放任不管，这个问题势必会干扰到政府的运作，甚至引发社会动荡。他必须采取行动了…\n\n听完报告，别洛泽尔斯基沉思片刻，心中已有决断…"
 berez_belozerski.5.a:0 "我们应该依靠东正教的多数地位。"
 berez_belozerski.5.b:0 "我们必须保障所有人的自由。"
 MAR_scapegoats:0 "替罪羔羊"
 MAR_scapegoats_desc:0 "任何政权都必须展现出其优于前任之处。然而，我们的政权并非布哈林时期苏联的直接继承者，尽管我们确实从中借鉴了一些东西。任何稍有思考能力的人都会明白，我们的政体与其说是苏维埃式，不如说是更偏向于君主制，因此，公民们会将青年俄罗斯与俄罗斯帝国进行比较。\n\n一部分人，尤其是那些狂热的保皇党白卫军分子，会认为尼古拉二世统治的时期才是黄金时代。但我们必须提醒某些人，尼古拉·亚历山德罗维奇究竟为他的国家做了些什么，他又将国家引向了何方..."
 berez_belozerski.6.t:0 "替罪羔羊"
 berez_belozerski.6.d:0 "许多国家的合法性往往不是建立在对过去的崇拜或尊崇之上，而是建立在对旧制度的批判、对所有罪恶的揭露以及对一切腐朽事物的彻底否定之上。那些新近掌权并试图为其合法性——即人民的支持——奠定坚实基础的政权尤其如此。不幸的是，我国有许多人认为，即使在现在，尼古拉二世的统治也比现在更好。这在一定程度上是事实，但他们对这位已故沙皇的盲目信仰正在损害我们的合法性，如果不是这种趋势如此流行，我们本可以容忍这种现象。\n\n别洛泽尔斯基联络了许多报业巨头，委托他们撰写一系列关于尼古拉二世的文章。在与这些巨头的谈判中，这位沙皇将军提出了一个条件——揭露尼古拉二世统治时期所有的问题和失败，向世人展示他究竟有多糟糕。作为回报，他承诺将来会以沙皇的名义给予他们巨额奖金。此外，为了避免共产主义思想再次抬头，我们还必须将第一次世界大战中俄罗斯帝国的失败归咎于布尔什维克和列宁。\n\n一段时间后，这些报纸的编辑们便炮制出了几篇关于这个主题的文章。仔细阅读便不难发现，这些文章对尼古拉二世的统治及其所有行为都进行了尖锐的批评。那些在尼古拉二世统治时期少得可怜的成就，也被歪曲成失败和过失，所有的一切都被推到了尼古拉二世头上。许多经历过那个时代的人对此反应不一，他们中许多人不愿看到自己心目中那个辉煌的时代被描绘成耻辱，但大多数民众还是相信了这些论调。许多指责尼古拉二世无能的文章最后都以攻击列宁领导的布尔什维克告终。文章的作者得出的结论是，列宁非但没有在战争中拯救俄罗斯，反而将其推向了深渊，因此他们也要为帝国的覆灭负责。总而言之，在那个时期，沙皇尼古拉二世本人以及列宁及其共产主义集团都要为俄罗斯的衰落负责。\n\n共产党人和保守的白军失去了民众的支持，这些势力的影响力将因此而大幅下降。"
 berez_belozerski.6.a:0 "谁控制了过去，谁就控制了未来。"
 MAR_remember_glories_of_the_past:0 "昔日荣光"
 MAR_remember_glories_of_the_past_desc:0 "我们已然揭露了尼古拉二世的真面目及其统治的恶果。此举不仅使我们摆脱了国内那些极端烦人的保守派的掣肘，更昭示着那段屈辱的过往已成云烟。然而，倘若有识之士深入思考这一论断，便可能会追溯到更久远的历史长河中去——在我们的历史中，究竟有哪些值得称道的荣光？无论是我国国内还是国外的恐俄分子都可能会利用这一点，并以一种极其可悲和粗暴的方式自行给出答案，诸如：“一无是处，俄罗斯的整个历史就是一段可耻的时期，一个来自东方的野蛮人的黑暗国度”云云。\n\n为了抵御这种思潮的侵蚀，我们必须回溯到留里克王朝的时代。沙皇-将军别洛泽尔斯基本人正是留里克王朝的远亲，这层血缘关系不仅将巩固我们政权的合法性，更将为我国人民注入希望——坚信留里克王朝那段传奇般的盛世终将回归。"
 berez_belozerski.7.t:0 "往昔神话"
 berez_belozerski.7.d:0 "高中生瓦西里来上历史课。他现在上六年级，要学习国家中央集权的建立。他们已经上了几节课，学到了伊凡大帝的时期。老师颇具兴味地讲述了这个时期的各种事情，仿佛亲眼所见一般。哪怕是对历史不甚感兴趣的学生也在屏息凝神地倾听着。许多人脑海里都出现了照片般的想象：伊凡大帝征服诺夫哥罗德，在乌格拉河畔逼退阿黑麻汗，将俄国从鞑靼人的枷锁手中解救出来，最终建立了一个单一制俄罗斯国家。\n\n学生们不免觉得十分钦佩。这些历史事件唤起了俄罗斯人民的爱国主义情绪，也激发了他们许多孩子对过去的关注。有些像瓦西里的学生自然会把历史事件和人物同当下的对号入座，然后得出结论：国家很快就会在我们的沙皇兼大元帅别洛泽尔斯基的努力下统一。这个发现让瓦西里对他的祖国和人民更加自豪了，他相信他们很快就会在一面旗帜下团结起来。\n\n但是这节课过得太快了，很多人都想听到后面发生的事情，而他们还是要去上下一节课的。很多人课后还在讨论这个话题。瓦西里把他的想法告诉了他的朋友们，他们中也有持这种对号入座的观点的，他们蛮支持瓦西里。\n\n瓦西里和他的朋友们很快就因为他们的论点出了名：全体俄罗斯人民都将联合起来对抗所有的他们的敌人；这在将来一定会发生。"
 berez_belozerski.7.a:0 "历史是一个轮回。"
 MAR_lessons_from_zubatov:0 "祖巴托夫的经验"
 MAR_lessons_from_zubatov_desc:0 "工会能够散布共产主义思想，这早已不是什么秘密，而这些思想足以破坏我们的国家根基，并可能将我们的国家再次拖入无序动荡的深渊。尽管我们认为尼古拉二世在其整个统治期间的许多作为都以失败告终，但他的一些想法无疑还是相当有见地的。确实，在某一段时间内，俄罗斯帝国的革命之所以能被遏制，“祖巴托夫运动”功不可没。\n\n谢尔盖·祖巴托夫在他那个时代忠实地为沙皇效力，摧毁了各种伪装成工会的革命组织。我们应当借鉴祖巴托夫关于工会的思想，并利用它们来对付我们国家内部的颠覆分子。"
 berez_belozerski.8.t:0 "“祖巴托夫主义”"
 berez_belozerski.8.d:0 "别洛泽尔斯基正在收集过去一个月的报告，试图为自己勾勒出国家当前状况的全貌。自西俄罗斯统一以来，在他的领导下国家开始迅速崛起发展，这让他感到欣喜若狂。布哈林时期人们只敢在梦中想象这样的景象，而如今一切都在朝着好的方向发展。至少从这些报告来看是如此。\n\n——直到西俄罗斯的内务首席书记，特列季亚科夫·伊凡诺维奇，走进了他的办公室。当然，在此之前他已经征得了进入的许可。他步履匆匆地走了进来，手里还抱着一大摞内务部的报告。报告上用铅笔划了几十道线，标注出了真实的情况。特别是那些几乎毫无缘由就突然爆发的集会事件。\n\n特列季亚科夫走到桌旁，把这堆报告放在其他书记官的报告旁边。\n“这是什么？”几秒钟后，别洛泽尔斯基问道，语气中带着明显的疑惑。\n“陛下，”特列季亚科夫说着，拿起最上面的一份报告，寻找着他之前做过的标记，“这是报告。您知道我国有工会，对吧？”\n“是的，我知道。让我猜猜，你是为这事来的？”别洛泽尔斯基带着些许怀疑问道。\n“是的。就我现在给你的这一批报纸来看，地下的共产主义组织已经在我国境内运作了很长一段时间了。他们从不抛头露面，只是假装自己就是普普通通的工会成员，但他们就是这样危害我们国家的。就是因为有这帮人，我们的企业家在承受惨重的损失。最重要的是，他们开始推动工人进行革命活动。也许，这是西俄革那帮共产党员发动的活动：他们并没有接受失败。”\n“我猜你想对此采取行动。”别洛泽尔斯基问道。\n“是的。”特列季亚科夫说——“我们必须打击这种行为。我们有过去的成功经验，特别是我在警察局的同事祖巴托夫。他的活动表明，打击潜伏在工会内部的共产主义威胁其实很容易。”\n“有趣的建议。”——别洛泽尔斯基专注地听着特列季亚科夫说道，“我想我会允许你开始制定对抗这一祸患的方法。”\n\n“在这种情况下，简单地照搬'祖巴托夫主义'是很困难的。原因在于，尽管工会以这种方式破坏经济，但实际上他们并没有做任何非法的事。因此，我们必须另辟蹊径——登记所有工会，教导他们不要与政府或企业对抗，而是要在谈判中寻求妥协。为此，我们必须理解工人运动和革命运动之间的区别：前者的目标是实际利益，后者则是意识形态理论。这样的解释将使我们的工人不至于被那些舆论破坏分子所煽动。”"
 berez_belozerski.8.a:0 "并非所有陈旧的事物都是糟粕。"
 MAR_establish_prikazy:0 "设立指挥司"
 MAR_establish_prikazy_desc:0 "我们的国家已发展到如此地步，以至于再也无法对所有领域进行面面俱到的管理。我们过去设立的部委，在西俄统一后，已然无法应对摆在眼前日益繁重的各项任务。我们必须改革国家的管理体制，建立全新的中央政府机构。"
 berez_belozerski.4.t:0 "指挥司"
 berez_belozerski.4.d:0 "人们常说世间万物，不过是旧事重提。他们大概是对的，至少对于下面一事来说非常契合。别洛泽尔斯基已经下定决心处理有关国家治理的问题。现在这个议题非常重要，因为我们国家最近的过度扩张已经让政府机构累得喘不过气来了。\n\n别洛泽尔斯基发现一些官员就是做不完他们的工作。几百份——如果不是几千份——文件是这些官员无法处理的。这是因为某些大臣负责的工作面极广，但他们同时还要处理一些专业领域的问题。以前，大臣们需要处理多个方面的问题，但是这已显露出其低效。我们需要改变这一状态。\n\n沙皇想要他的政府机构更高效地运转，所以指示他的朋友卡津别克做一份改革草案。几天之后，卡津别克经过与现任的大臣的商讨，向别洛泽尔斯基提交了一份改革方案。\n\n总的来说，按部展开的改革可以解决行政上的主要问题，包括文字工作量以及各部在各种问题上过大权力和责任。这次改革会大幅压缩各部的职权范围，从而减小他们的工作量，并因此解决了行政机关的工作问题。为了进一步消灭这一问题并优化整个国家的治理，需要建立一些新的部门，负责国家的某些事物，比如数字技术和通讯部。\n\n别洛泽尔斯基阅读了这份计划，被这种大刀阔斧的改革深深打动。然而，他拿起了铅笔，划去了“部”这个词，而在旁边写下了“指挥司”（Prikazy）。卡津别克困惑地扬了扬右眉毛，并皱起了眉头，他很明显不明白别洛泽尔斯基在干什么。这位沙皇兼大元帅告诉他：“你应该记得，我向人们承诺，我们会回到俄罗斯历史上的盛世。那正是伊凡三世大帝和伊凡四世的时代。我觉得我们还是遵守我们的承诺比较好。”卡津别克带着一丝疑虑笑了笑，但他没法不同意沙皇的决定。"
 berez_belozerski.4.a:0 "“旧瓶装新酒，您是这个意思吧？”"
 MAR_land_reform:0 "土地改革"
 MAR_land_reform_desc:0 "土地问题在俄罗斯历史上始终是一个沉疴。纵观历史长河，农民们始终为了生存而劳作，他们为地主、庄园主或集体农庄卖命，而非为了自身，也非为了国家。他们的辛勤付出总是被低估，其劳动成果也总是落入那些不懂得善加利用之人的手中，最终仅是中饱私囊而已。\n\n我们必须帮助农民发展自己的经济。经济部长阿列克谢·柯西金提出了一项方案：解散农村公社，以此激发各个村庄自主发展的积极性。此外，我们还要帮助农村地区实现农业机械化，提高土地灌溉的效率。除此之外，还要扶助我国南部地区抵御周期性的旱灾，这些旱灾经常侵袭南俄大部地区。这些措施无疑将极大改善农业状况，柯西金的计划只需签署便可推行。"
 MAR_creation_of_constitution:0 "筹备宪法"
 MAR_creation_of_constitution_desc:0 "我国宪法将明确规定我们各级权力机关的基本权利和义务。我们近年来推行的所有改革，都应当以宪法的形式加以固定，确立君主立宪制的国体。\n\n宪法将界定沙皇的权利，并明确划分各级政府的职责，为人民与沙皇政权的和谐共存奠定基础。宪法还应当避免权力的天平过于向某一特定分支倾斜，而应当促进议会与沙皇之间互惠互利的合作关系。\n\n宪法草案已近完成，只待最后润色，即可颁布实施。"
 MAR_correct_the_party:0 "党内新声"
 MAR_correct_the_party_desc:0 "尽管表面上一团和气，党内已然暗流涌动，出现了反对派势力，他们对沙皇将军在缙绅会议上的胜利心怀不满。这场会议暴露出，党内远非铁板一块，内部矛盾重重。如今，这一分歧更体现在许多旨在巩固沙皇权力的法案遭到了这群反对派的激烈抵制。如果我们不想让他们成为未来的绊脚石，就必须尽快解决这一问题。\n\n卡津别克甚至在目睹这些后，提出采用各种方式将这些党员清除出去，轻则因某些过失降职，重则直接勒令其退休。所幸，这样的人为数不多，况且如有必要，人民也会站在我们这边。"
 MAR_first_congress_of_soviets:0 "第一次苏维埃大会"
 MAR_first_congress_of_soviets_desc:0 "在推行新政府的首批法令后，我们现在需要画龙点睛的一笔——召开第一次苏维埃大会。各地方自治机构和我国的政治派别都将派代表出席这次会议。这一盛事对我们意义重大，因为它将一揽子解决我们这段时间以来积累的诸多问题。虽然其重要性无法与缙绅会议相提并论，但这次大会的力量同样不可小觑。大会将于7日后开幕。它将做出何种决议？"
 berez_belozerski.9.t:0 "第一届苏维埃代表大会"
 berez_belozerski.9.d:0 "卡津别克首相和别洛泽尔斯基沙皇步入了一座可容纳千人的宏伟大厅。来自全国各地苏维埃和自治机构的代表们济济一堂，他们代表各自的省份和地区，为国家的发展建言献策。代表中绝大多数都是青年俄罗斯联盟的成员，也有一些自由人民联盟的自由派人士，以及劳工党的社会主义者。当国家两位最高领导人出现在会场时，全体代表起立致敬。\n\n别洛泽尔斯基在一个特殊的位置上落座，身后是政府其他重要成员，仿佛一座巍峨的山峰，俯视着整个会场。他的任务是观察大会的进程。卡津别克则快步走上讲台，开始了他的演讲。\n\n“朋友们，今天我们齐聚一堂，召开这个青年俄罗斯国度历史上的第一次苏维埃代表大会！这次大会将解决我国现存的问题，并决定国家未来的发展方向！”卡津别克的声音洪亮有力，在整个大厅回荡。他的讲话引起了代表们的强烈共鸣，雷鸣般的掌声顿时响彻整个会场，人们用这种方式表达着对这次大会的期待和敬意。待掌声平息，首相继续说道：“我们的议程包括行政管理和青年俄罗斯国度的未来发展。我建议我们立即开始讨论这些议题。”\n\n简短的讲话结束后，大会随即进入工作状态。国家领导人们指出了这个年轻国家所面临的主要问题，并针对这些问题提出了各种各样的解决方案。代表们各抒己见，激烈辩论，最终剔除了一些不切实际的方案，采纳了最具可行性的建议。别洛泽尔斯基始终认真倾听着代表们的意见，偶尔也会参与到讨论中，发表自己的看法。他会对一些提案提出建议，引导讨论的方向，尽管这并非他分内之事，但他还是乐于帮助他的官员们。\n\n经过一周的讨论，第一次苏维埃代表大会制定了一份未来一个季度的行动纲领，其中包括旨在减轻官僚系统负担的行政决议，以及国家经济发展计划、外交政策发展计划等等。最重要的是，大会确定了今后的工作机制——每季度召开一次会议。闭幕式上，卡津别克总结了大会的成果，并对所有代表的参与和贡献表示感谢。最后，大会在雄壮的青年俄罗斯联盟国歌声中落下帷幕。"
 berez_belozerski.9.a:0 "大会闭幕，问题解决。"
 MAR_reanimating_the_economy:0 "重振经济"
 MAR_reanimating_the_economy_desc:0 "将西俄统一于同一面旗帜之下后，我们现在亟需建立强大的经济。显而易见，我们需要制定一项计划，以复苏国民经济，并进一步推动其恢复。\n\n只有充分调动一切现有力量——资源、工厂和企业、对外贸易关系，当然还有人民，我们才能实现这一目标。"
 berez_belozerski.15.t:0 "国家的经济"
 berez_belozerski.15.d:0 "柯西金正在向沙皇别洛泽尔斯基汇报改善国家经济状况的方案。作为经济领域的专家，沙皇之前特意指示柯西金制定一份计划，并在近期开始实施。\n\n柯西金的核心思想可以概括为以下几点：首先，建立一个专门负责经济管理的机构，即“国民经济秩序委员会”，负责管理工业、国内外贸易、税收等所有与经济相关的事务。其次，发展国家经济，不仅要依靠自身力量，还要积极吸引外部投资。其中，发展重工业，生产军工产品，是重中之重。\n\n除此之外，教育、中小企业发展、农业发展等问题也需要同步解决。对于这些方面，柯西金也给出了自己的方案，虽然还不够成熟，但也勾勒出了大致的框架。\n\n“陛下，我认为，通过这些措施，我们可以为成千上万的失业者提供就业机会，从而提高人民的生活水平。” 柯西金最后说道。\n\n别洛泽尔斯基沙皇认真听取了柯西金的每一个字。阿列克谢提出的方案在他看来非常有趣，而且很有逻辑。\n\n“我欣赏你的计划，简直无懈可击。” 谢尔盖沉思了片刻，开口问道，“不过，这一切需要我们付出多大的代价呢？”\n\n“花不了您想象的那么多钱，陛下。” 柯西金回答道，“主要取决于您希望我执行计划的规模。”\n\n“从理论上讲，我们需要多少年才能看到成效？”\n\n“大约五年。看看德国的‘四年计划’，他们取得了巨大的成功。我们可以借鉴他们的经验，并将其应用到我国的实际情况中。”"
 berez_belozerski.15.a:0 "计划已获批准"
 MAR_restoration_of_science:0 "复兴科学"
 MAR_restoration_of_science_desc:0 "国家的目光终于落在了我们科学领域的现状之上，这意味着，是时候将这座摇摇欲坠、腐朽不堪的危房改建成一座精致的别墅了。我们首先能做的就是增加拨付给各个看起来有前景的项目和倡议的预算。毕竟，我们没有任何理由认为这些预算会被贪污或在腐败的官僚体系中消失。"
 MAR_petroleum_development:0 "发展石油工业"
 MAR_petroleum_development_desc:0 "发展石油开采为我国经济发展开辟了极具吸引力的前景，然而，在当前的形势下，我们缺乏必要的基础，即受过教育、有才干的人才来进行这项工作。我们将尝试与俄罗斯海外侨民团体建立联系，并向具备相关专业知识的人才提供优厚的待遇，以换取他们对我国发展的助力。"
 MAR_remake_education:0 "重振教育体系"
 MAR_remake_education_desc:0 "尽管我们对新社会中的君主制成分怀有崇高的敬意，但仍须承认，在培养有文化素养的国民这一议题上，布尔什维克做得远胜俄罗斯帝国。根据沙皇的谕令，我们将组建一个新的部委来推行苏联模式的教育改革，该部委将拥有相当大的自主权，独立于国家权力架构之外，并相较于其他部门，享有更充裕的预算。"
 berez_belozerski.16.t:0 "回到学校"
 berez_belozerski.16.d:0 "维亚特卡的一所新学校此刻人声鼎沸，洋溢着无尽的活力。随着清脆的铃声响起，一群群快乐的学生如同潮水般从教室里涌出，他们在课间时光里尽情地嬉戏玩耍。小学老师奥尔加·维克托罗夫娜站在一旁，也深深地感受到了这份轻松与欢乐的氛围。她明白，自己同样需要这短暂的休憩时光；然而，当她再次踏入这所熟悉的学校，内心不禁涌现出一股难以言喻的喜悦。奥尔加的一生都毫无保留地献给了孩子们。尽管命运未曾赐予她自己的孩子，但她却在帮助和关爱别人的孩子中找到了自己存在的价值和意义。三十多年来，她始终如一地帮助孩子们开启探索世界的大门，无论是在阿迪格地区还是基洛夫，她的身影都成为了那里孩子们最温暖的记忆。然而，德国人的到来如同一场突如其来的风暴，让原本就脆弱的教育系统雪上加霜。乌拉尔山脉之外的学校更是匮乏不堪，资源短缺的问题愈发严重，一切都显得捉襟见肘、力不从心。\n\n老师轻轻地侧过头去，那些最为痛苦的回忆如同潮水般涌上心头。她的眼前仿佛又浮现出那支在暴风雪中艰难前行的车队，头顶上空刺耳的飞机轰鸣声与炮弹的爆炸声交织在一起，震耳欲聋。她清晰地记得五岁女孩斯维塔被炸弹炸伤的悲惨场景，以及那个名叫瓦尼亚的男孩——他只能以残羹剩饭充饥，却依然坚强地去工作。奥尔加曾一度无法承受失去他的痛苦……泪水顺着她的脸颊无声地滑落，她想起了那些永远无法忘记的往事。在西伯利亚的那段经历如同梦魇般萦绕在她的心头……她的思绪纷乱如麻，似乎想要逃避这一切。但即使在这混乱之中，她仍然清晰地听到了那个熟悉的声音：“奥尔加·维克托罗夫娜，我能出来吗？”瓦莱拉在询问。她当时并不知道会有飞机飞过头顶，也不知道山外的世界并不安全，她也无从知晓也无法预料这一切。\n\n“奥尔加·维克托罗夫娜，您没事吧……”一个胆怯而关切的声音打断了她的思绪，是她的学生塔尼娅在小心翼翼地询问。\n“没事……我很好。”她努力平复自己的情绪，让声音听起来尽量平静而坚定，“只是稍微有点不舒服而已，我马上就回来。”说完，她正准备走向厕所，却突然感到双腿发软。幸运的是体育老师就在附近及时扶住了她。在平复了情绪后，她再次陷入了沉思之中。当她重新回到学校时，这里已经恢复了往日的生机与和活力。她又可以站在讲台上为孩子们传授知识、听到他们的欢声笑语了。也许真的到了该放下过去的包袱，与学生们一起勇往直前了……"
 berez_belozerski.16.a:0 "但这容易吗？"
 MAR_naukograds:0 "建设科学城"
 MAR_naukograds_desc:0 "得益于我们吸引国外俄语专家的计划取得的成功，以及在新教育部努力下高等教育的萌芽，我们现在可以着手进行一些更为重要的工作——前沿创新。当然，这些工作不会由我们的普通民众来完成，他们对此类事务参与不够，也没有必要的知识。更准确地说，我们将为那些雄心勃勃、却苦于无处获得必要资源的西方学者提供政府支持和预算，以助其实现自己的想法。\n\n当然，这需要他们承诺绝对保密，而我们将采取一切措施确保这一点，包括强制要求所有初级职员都必须从我国国民中选拔，以及要求相关学者必须进驻封闭的科学城，在那里开展工作，直到项目完成并对其贡献做出全面的评估。对于那些企图利用我们的资助谋取私利的骗子和冒牌货，我们绝不姑息！"
 berez_belozerski.17.t:0 "一位老友"
 berez_belozerski.17.d:0 "斯坦尼斯拉夫·戈列茨基是西俄罗斯的科学家之一，曾在苏联接受教育。最近，他被调到了一个新的工作地点——一座新建的科学城，整座城市都致力于科学发现与创新。确切地说，斯坦尼斯拉夫将要生活和工作的这座科学城，是在旧科学城的基础上建立起来的，而旧科学城也始建于苏联时期。\n\n在初到科学城之际，戈列茨基与数位同事一同漫步于街头巷尾，仔细检视着这座城市的每一座建筑、每一条街道，以及那些即将成为他们工作和生活场所的设施。这里的一切都给他们留下了深刻的印象，科学城虽然尚未完全竣工，但已经初具规模，不过仍有些许苏联时代的痕迹隐约可见。\n\n结束参观后，戈列茨基回到了自己的新家，他决定与同事们共同举办一场乔迁派对，以庆祝这个新的开始。然而，就在派对即将开始之际，他在新家门口意外地发现了一幅画像，上面的人物竟是声名狼藉的苏联科学家特罗菲姆·李森科。这幅画像的出现让戈列茨基感到十分震惊，他无法理解为何这里会挂着这样一位在科学界臭名昭著的人物的画像。随着震惊情绪的消退，一种强烈的憎恶感涌上心头，他毅然撕下了这幅画像，并四处寻找垃圾桶将其丢弃。\n\n经过一番寻找，戈列茨基终于找到了一个垃圾桶，他毫不犹豫地将李森科的画像扔了进去。随后，他转身向同事们讲述了自己的发现以及对李森科的看法：\n\n“这个人是个彻头彻尾的疯子！他以苏联科学‘天才’自居，却亲手摧毁了苏联科学的根基，让整个科学界沦为笑柄！他竟敢否认遗传学的科学性，还妄图让整个科学界都追随他的脚步！”\n\n听到戈列茨基的激烈言论，有同事轻声劝慰道：“斯坦尼斯拉夫，你冷静点。那都是过去的事情了，现在已经结束了。”\n\n发泄过后，他向同事们表达了歉意，并邀请他们入座，共同庆祝乔迁之喜。"
 berez_belozerski.17.a:0 "为了新的科学！"
 MAR_naukograds_idea:0 "科学城"
 MAR_naukograds_idea_desc:0 "通过将科研力量集中在一处，我们能够比以往更高效、更迅速地开展研究。现在，无需再花费数日时间等待另一个位于不同城市的科研中心的回复——现在，研究和知识的流通速度将大大加快。"
 MAR_econom_prikaz:0 "计划经济"
 MAR_econom_prikaz_desc:0 "现在，是时候建立“国民经济秩序委员会”（Ekonomicheskiy prikaz narodnogo khozyaistva）了。它将负责管理国家的整体经济，从贸易和生产到对小型企业的扶持，都将纳入其管辖范围。这个机构将确保经济的各个部门都得到发展，及时解决任何冲突，并确保政府资金得到合理利用。当前，我们的首要任务，是让经济发展步伐跟上领土扩张的步伐。我们将不惜一切代价，让我国的经济实力跻身世界强国之列。\n\n作为经济部部长，柯西金将承担更多的责任。这将使他能够对任何问题做出快速反应，并在总体上提高工作效率。"
 MAR_open_doors:0 "开放政策"
 MAR_open_doors_desc:0 "西俄罗斯人民沙皇国如今已能够支配远超以往的庞大资源，我们可以将这些资源用于两个方向：发展本国工业和出口海外。我国拥有充足的资源来同时推进这两项事业。通过出口，我们将获得宝贵的外汇储备和稀缺资源，从而充实国库，这些财富将用于民生福祉，并反哺国内工业。经济部推行“开放政策”，即允许外国资本购买我们的资源以换取资金或其他利益。"
 MAR_attract_investments:0 "吸引外资"
 MAR_attract_investments_desc:0 "我国已开始吸引外国投资者的目光，他们渴望投资于我们。因此，我们将允许他们建立自己的企业，并确保他们未来的安全。为此，我们向许多发达国家发出了一封邀请函，告知他们西俄罗斯人民沙皇国已做好合作的准备。"
 berez_belozerski.19.t:0 "“绝望者”的新家园"
 berez_belozerski.19.d:0 "在欧洲、美洲和亚洲的各地，从小型初创企业到大型跨国公司的企业家们，都陆续收到了一些重要的消息\n\n经营服装生意的企业家罗兰遭受了严重的打击，大型公司的竞争压力几乎要将他的企业碾碎。但就在这样的困境中，有一天，一封仿佛带来希望的信件落入了他的手中。罗兰怀着期待的心情打开信件，仔细阅读起来：\n\n“敬爱的资本主义世界的企业家们，西俄罗斯人民沙皇国政府向你们伸出橄榄枝。我们为你们提供了极为有利的商业环境，全力保障你们的商业利益、生产活动和企业安全。我们热切期盼你们的到来，相信在这里，你们将能够自由翱翔、蓬勃发展，尤其对于那些规模较小的企业家。”\n\n读完这封信，罗兰的目光落在了自己的积蓄上。这些积蓄足以支撑他在那个充满希望和机遇的新国度重新起步，他的服装品牌有可能在那里，甚至在全世界崭露头角。"
 berez_belozerski.19.a:0 "孤注一掷！"
 MAR_mts:0 "机械化拖拉机站的成立"
 MAR_mts_desc:0 "投资者固然重要，但我们也不能忘记农民的困境。只有农业发展了，我们才能彻底解决人民的吃饭问题，并将粮食出口到其他国家。而要发展农业，就必须实现农业机械化。\n\n国民经济秩序委员会已经下令，建立农业机械拖拉机站。通过这些拖拉机站，我们将能够生产出足够的拖拉机，来帮助农民耕种土地，让他们从繁重的体力劳动中解放出来，不再日复一日地辛苦劳作。"
 MAR_support_small_business:0 "扶持小型企业"
 MAR_support_small_business_desc:0 "沿着柯西金的计划，我们将迈出下一步——扩大小型企业的规模。拟议的措施包括：为小型企业提供税收优惠、简化法人注册程序，以及向所有感兴趣的公民免费提供材料和咨询，解释我们在这方面立法工作的细微之处。在一些更为激进的提案中，甚至考虑了直接补贴，但如果要实施，也只会针对那些最贫困和最不发达的地区。"
 MAR_heavy_industry:0 "发展重工业"
 MAR_heavy_industry_desc:0 "我们的地下蕴藏着丰富的资源，需要开采和加工以获取收益。因此，根据经济部的命令，制定了一项计划：在金属和矿产资源丰富的城市建立一系列冶金厂，并在某些城市建造生产技术装备和武器的军工厂。这项计划必定能获得丰厚的回报，因为阿列克谢·柯西金已经深思熟虑，并安排了得力人选来监督这一计划的实施。"
 MAR_resurrection_of_infrastructure:0 "基建革新"
 MAR_resurrection_of_infrastructure_desc:0 "经济部的计划中还包括构建完善的物流链，因为工业需要高效、精确地进行生产，而落后的基础设施只会造成生产停滞，何谈产出产品呢？因此，我们决定快速建设重点城市和工业枢纽的基础设施，雷厉风行。每一条公路，每一条铁路都必须按照高标准进行建设。这样，在完善的基础设施保障下，生产就不会停滞，而是能够持续不断地为我们的国家效力。"
 berez_belozerski.20.t:0 "精准打击"
 berez_belozerski.20.d:0 "在德国炸弹的持续肆虐下，我们民众赖以生存的基础设施遭受了空前的摧残。无情的爆炸不仅夺去了无数无辜男女老少的宝贵生命，更将我们国家的房屋和工厂摧毁殆尽。尤为严重的是，铁路系统遭受了毁灭性的打击，导致众多城市陷入孤立无援的境地。由于农作物供应匮乏，许多小公国的人民和经济陷入了绝境。\n\n现在，轰炸终于停止了。我们可以开始着手修复被摧毁的交通线路了。国民经济秩序委员会已经下令，修复连接各城镇之间的铁路线。沙利亚宾和他的工程队，和其他许多工程队一起，踏上了重建铁路的征程。\n\n当他们抵达指定地点时，眼前的景象却令他们大吃一惊。呈现在他们面前的，哪里还有什么铁路的痕迹？炸弹落下的地方，早已被一片绿色覆盖。只有散落在周围的那些锈迹斑斑的铁轨碎片，无声地诉说着当年的惨烈。看来，德国人的轰炸非常精准，彻底摧毁了这段铁路。已经没有什么可以修复的了。眼前的景象让工人们感到无比震惊。他们都亲身经历过轰炸，但他们从未想过，德国人的轰炸竟然如此“高效”。\n\n沙利亚宾意识到，与其试图修复残骸，不如直接在原址上新建一条铁路。毕竟，有些伤痕，是永远无法抚平的。他向上级申请了新的铁轨，很快，物资就运抵了工地，足够他们修建一条全新的铁路。工程队开始了紧张的工作，他们的目标只有一个：让这条铁路，将两座城市重新连接起来。"
 berez_belozerski.20.a:0 "他们将重塑被夷为平地的一切"
 MAR_industrial_centers:0 "工业中心"
 MAR_industrial_centers_desc:0 "工业中心将设在那些重工业和军事工业最为集中的城市。我们将全力推动这些城市投入生产，使其夜以继日、分秒不停地生产武器、冶炼金属、制造技术装备，并运送至各地。同时，这些中心也将发展轻工业，生产食品、服装和其他生活必需品。这些中心将成为我们祖国工业王冠上璀璨的明珠。"
 berez_belozerski.21.t:0 "新的工作"
 berez_belozerski.21.d:0 "伊万·斯克利亚尔曾因其所在城市缺乏工厂或企业而面临就业困境。由于最近的工厂都远离他的家乡，坐落于繁华的大都市之中，因此他不得不承受巨大的时间、金钱和精力成本才能抵达工作岗位。然而，时移世易，如今的形势正悄然发生变化。\n\n某日，他在阅读报纸时欣喜地发现，政府计划在他所居住的这类尚未工业化的定居点建设新工厂。看到自己的家乡被列入新工厂的建设名单之中，伊万的心情顿时激动起来。他开始憧憬着辞别旧职，在家乡的新工厂工作的美好情景。\n\n就在消息传出的几天后，伊万在下班途中注意到，一队队车辆正络绎不绝地驶向他的家乡。这些车辆载满了前来支援建设的移民工人，以及他们带来的各种设备、机床、建筑材料和施工机械。这一幕幕景象无疑预示着好兆头——不久的将来，他所热爱的这片土地上将矗立起一座座崭新的工厂，而这里的企业也将蓬勃发展，充满活力。届时，伊万终于能够实现在家门口工作的梦想。"
 berez_belozerski.21.a:0 "生活将会变得更好与有趣"
 MAR_foreign_know_how:0 "海外的的“技术诀窍”"
 MAR_foreign_know_how_desc:0 "吸引了外资，各大企业也同我们展开了卓有成效的合作，一些国民也在这些企业中找到了工作。但我们却忽略了一件事……更确切地说，我们的工人某种程度上存在着一种“文盲”现象——他们习惯于操作那些早已过时的老旧设备，而面对新型设备时，便束手无策。经济部与多家大型企业合作，推出了一项海外培训计划。我们那些表现突出的工程师和技术工人将被派往美国，在那里学习我们急需的专业技能，如此一来，掌握最新技术对我们来说便不再是难题。"
 berez_belozerski.22.t:0 "塑造未来之教育"
 berez_belozerski.22.d:0 "在公司旗下的一家企业中，引进了全新的高效产品生产设备，这些机器不仅提升了产量，更优化了质量。然而，经验最丰富的工程师和工人们却显得有些手足无措。他们并非才智不足，而是长久以来习惯了与旧有的设备为伍，突然间面对这些未知的新科技，自然感到有些无所适从。就在众人困惑之际，企业经理缓步走来，轻咳一声以引起注意，然后开始了他的发言。\n\n“诸位，我看得出你们有些不解，但请放心……政府已经为你们安排了前往美国学习的机会，让你们能够掌握这些新技术，并将其发挥到极致。”\n\n听到这个消息，工人们的心情顿时变得复杂起来，既有对未来的迷茫和担忧，也有对新机遇的期待和喜悦。“等你们学成归来，我保证你们的收入会更上一层楼。现在就开始准备行囊吧，因为你们明天就将踏上这段全新的旅程。”\n\n经理的话语落下，他转身回到了自己的办公室，留下了一群面面相觑却又充满期待的工人们。"
 berez_belozerski.22.a:0 "如今，我们不仅能够汲取知识，更能放眼世界"
 MAR_stabilize_ruble:0 "稳定卢布汇率"
 MAR_stabilize_ruble_desc:0 "现在，我们已经建立起了自己的货币体系，接下来需要考虑的是如何让它不仅仅是一张毫无价值的纸片。沙皇的顾问们提出了以下计划：从民众手中回购弗拉基米尔卢布，这种我们在臣服于维亚特卡时被迫使用的货币，同时将所有公用事业和税收支付方式改为现金结算，强制推行新卢布的使用，以此提高新货币的使用价值。"
 MAR_age_of_prosperity:0 "繁荣时代"
 MAR_age_of_prosperity_desc:0 "经济蓬勃发展。外资如潮水般涌入，带来丰厚的回报；农业逐步恢复正常；而工业在经济部的领导下，也蒸蒸日上。人们终于不再为失业而忧心忡忡，也不再忍饥挨饿。柯西金和他的团队完成了一项艰巨而卓越的任务。西俄罗斯人民王国正大步向前…\n\n但这仅仅是万里长征的第一步。"
 berez_belozerski.23.t:0 "青年俄罗斯党式的成功之道"
 berez_belozerski.23.d:0 "在办公室里，柯西金面带微笑，端坐在案前，脸上流露出的满意之情，彰显着他们不凡的成就。各项经济指标均呈现上扬趋势，国内生产总值稳步攀升。工业的蓬勃发展，农业的丰硕成果，让人民的生活有了坚实的保障。这就是青年俄罗斯党对人民的关怀，人民也相信未来会欣欣向荣。\n\n突然，敲门声响起，打破了这份宁静。柯西金抬头望去，只见“沙皇将军”谢尔盖·别洛泽尔斯基亲自造访。他的开场白充满了感激之情：“阿列克谢·尼古拉耶维奇，我特地来此向你表达深深的谢意。你和你的团队创造了奇迹，让每一个年轻的俄罗斯人都怀揣希望，过上了安稳的生活。”\n\n柯西金站起身来，与这位尊贵的客人握手致意。他谦虚地表示：“感谢您的肯定，但我们的工作还远未结束。我正在筹划新的计划，以巩固这来之不易的成果。”\n\n别洛泽尔斯基听后，眼中闪过一丝赞赏：“我坚信，你的下一个项目定能再创辉煌。”\n\n“承蒙吉言，我必将竭尽全力。”阿列克谢坚定地回应道。\n\n两人相视一笑，仿佛达成了某种默契。别洛泽尔斯基感慨道：“前路漫漫，我们仍需并肩作战啊，同志……”言毕，他转身离开了办公室。\n\n柯西金重新坐回办公桌前，陷入了沉思。他知道，未来的道路仍充满挑战，但他坚信，在他们的共同努力下，青年俄罗斯党的明天一定会更加美好。于是，他再次投入到紧张的工作中，继续发布他的经济计划法令。"
 berez_belozerski.23.a:0 "而这仅仅只是开始……"
 MAR_age_of_prosperity_idea:0 "蓬勃的经济"
 MAR_age_of_prosperity_idea_desc:0 "通过我们的努力，创造了让经济尽可能减少任何开支、同时又能保持产品质量的环境。此外，依靠现有的资金储备，我们能够投资建设新工厂，生产新产品。"
 MAR_military_prikaz:0 "军事部"
 MAR_military_prikaz_desc:0 "别列兹尼基军团已初具规模，但仍需解决兵员的训练问题，他们大多分散且缺乏训练，军官亦是如此。因此，为了我们国家和理想的延续，有必要设立军事部——这是一个能够整顿军队、对别列兹尼基军队的一切进行系统化管理的部门。经验丰富的弗拉基米尔·吉尔被任命为该机构的负责人，他有能力掌控日益壮大的青年俄罗斯联盟军事机器。"
 berez_belozerski.24.t:0 "组建部门"
 berez_belozerski.24.d:0 "第0001号军事部指令\n\n“军事部的组建与设立”\n\n别列兹尼基政府兹此郑重宣布，即日起正式成立军事部，负责全面统筹与推进军事事务。其核心职责包括：为部队提供装备、系统训练部队官兵、规划实施军事行动与战术。\n\n经严格筛选与考量，现任命弗拉基米尔·弗拉基米罗维奇·吉尔为军事部部长。吉尔先生在军事领域造诣深厚，对青年俄罗斯党忠诚不渝，实为不二人选。\n\n弗拉基米尔·弗拉基米罗维奇·吉尔部长将肩负以下重要职责：\n\n-彻底整顿军队纪律，深化官兵忠诚教育，以铸就坚不可摧的凝聚力。\n\n-精心培育未来战争所需的军官骨干，确保部队领导层的稳健与高效。\n\n-深入研究历史军事经验，汲取智慧，规避过失，以史为鉴，面向未来。\n\n-全面筹备后勤与工业支持力量，确保部队在未来战争中拥有先进的装备与保障。\n\n为确保各项任务迅速有效地展开，上述指令即刻生效执行。"
 berez_belozerski.24.a:0 "我们开始投入工作"
 MAR_experimental_design_bureau:0 "实验设计局"
 MAR_experimental_design_bureau_desc:0 "对于我们青年俄罗斯党而言，另一个问题是薄弱的科研基础，这影响到了我们的各个领域。然而，要想彻底扭转局面绝非易事，因此，我们需要通过不断的试验，历经重重失败，从而探索出最优方案。新的设计局应当为青年俄罗斯党带来哪怕只是一点点在军事和科学领域的飞跃。在那里，设计师们亲自进行测试，摒弃单打独斗，组成设计团队，共同完成下达的任务。青年俄罗斯党人必须摒弃毫无益处的个人主义桎梏，团结协作。领导层对这一项目充满信心，并希望这种团队合作的方式能够凝聚力量，创造出伟大的成就。"
 berez_belozerski.25.t:0 "新技术"
 berez_belozerski.25.d:0 "一群杰出的科学家和设计师被引领至这座新落成的科学大楼，尽管楼内尚缺现代化设备的装点，但他们深知即刻投入工作的重要性。官员对在场的工作人员进行了细致的检查后，郑重地取出一张纸张并重新审阅，因该纸上详尽地阐述了实验局的基本原则。\n\n“尊敬的科学家们——”官员声音洪亮而清晰，字句间流露出庄重与期待——“你们之所以汇聚于此，是因为你们代表着青年俄罗斯党的智慧精英。你们被委以重任，要用科学的力量来武装别列兹尼基，并且……”\n\n他稍作停顿，为接下来的宣布铺垫气氛：“你们将凝聚为一个不可分割的团队。在此，个人的智慧将融汇成集体的力量，为了别列兹尼基的繁荣与进步，个人主义必须让位于集体主义。”\n\n科学家们纷纷颔首，以示对官员话语的认同与尊重。随后，助理官员与他们并肩而行，他将肩负起描绘设计局未来蓝图的重任。"
 berez_belozerski.25.a:0 "为了青年俄罗斯党的利益全心全意"
 MAR_modern_war_methods:0 "现代战争模式"
 MAR_modern_war_methods_desc:0 "军队是国家的脸面，也是国家的铁拳。它守卫着我们的边疆，为俄罗斯和沙皇而战，也正是它将收复莫斯科和圣彼得堡，为俄罗斯的土地带回正义。因此，军队必须实现现代化，如此才能击败那些所谓的“统一者”，并进而击溃德国的国防军。\n\n然而，我们必须明白，成为世界上最强大的军队，并非仅仅依靠使用更先进的装备，更需要发展现代化的战术。伟大的卫国战争向我们表明，一个新的时代早已到来——机械化的时代。我们必须在军队中大规模使用机械化部队。然而，我们也清楚地认识到仅由坦克和装甲运兵车组成的军队的弱点，因此，我们必须找到一个平衡点，唯有如此，俄罗斯才能真正崛起！"
 MAR_tank_factories:0 "坦克工厂"
 MAR_tank_factories_desc:0 "20世纪的战争已经证明了坦克对战争的巨大影响力。正是坦克碾碎了红军，无论我们是否愿意承认，都必须正视德国人发展坦克是一个正确的决定。我们可以承认自身的错误，并从中吸取教训。因此，我们必须开始为我们的军队大规模生产坦克。别洛泽尔斯基已经下令建立数家坦克制造厂，这些工厂不仅要为我们的军队生产坦克，还要进行相关研究，以提升坦克的性能。"
 MAR_training_advancements:0 "改进训练方法"
 MAR_training_advancements_desc:0 "好了，既然我们终于可以谈及军队的状况，就不得不面对一个多年来一直被我们忽视的棘手问题——新兵。\n\n布哈林开创了一个先例，至今仍被俄罗斯各地大大小小的军阀们所效仿，这个先例给人的感觉仿佛是，新兵蛋子不过是一群乌合之众的炮灰，除了把他们一批批送上前线送死之外别无它用，只期盼能有老兵能活着回来。好吧，但我们不是那些小军阀，也和布哈林那种布尔什维克的老鼠没有任何关系。新军改的关键一环，是强制新兵接受最短期限的军事训练，同时聘请退伍老兵对新兵进行培训。"
 berez_belozerski.26.t:0 "哨所"
 berez_belozerski.26.d:0 "士兵阿列克谢正在部队基地站夜岗。对于每一位士兵而言，站岗无疑是一种崇高的荣誉，然而，在夜幕下坚守岗位却是一项极大的挑战。那些纪律严明、意志如铁的士兵或许能够长时间保持清醒，但意志稍显薄弱者则可能会在巡逻途中陷入沉睡。不幸的是，我们的这位士兵虽然极力抵抗睡意的侵袭，最终却还是没能抵挡住瞌睡虫的诱惑。\n\n就在换岗之前，经历过伟大卫国战争洗礼的老兵伊万和他的战友们走了过来。当他们看到阿列克谢竟然在岗位上沉睡时，无不感到痛心疾首。伊万并没有选择简单地唤醒这名失职的士兵，而是从背后猛地掐住他的脖子，用肘部紧紧锁住他的咽喉，将他粗暴地拖回了走廊。\n\n阿列克谢在突如其来的窒息感中惊醒过来，一时之间竟然无法言语。他惊慌失措地挣扎着，过了十多秒钟才渐渐回过神来。他意识到自己因为在岗位上打瞌睡而被人发现，这对于一名士兵而言无疑是极大的耻辱。然而，伊万却并没有就此罢休，他愤怒地对着阿列克谢咆哮道：\n\n“阿列克谢，你好大的胆子！竟然敢在岗位上睡觉！你知道吗，就因为你的失职，我们所有人都可能付出生命的代价！想当年，我的整个连队就是因为有人疏忽大意而在战争中全军覆没！你给我听好了，这里不是让你来享福的地方，这里是军队！如果明天战争爆发怎么办？你难道还指望敌人会像老师一样耐心地教导你吗？不！他们只会毫不留情地杀死你！”"
 berez_belozerski.26.a:0 "阿列克谢将铭记这一教训，终生不忘。"
 MAR_aircraft_industry:0 "俄罗斯航空工业"
 MAR_aircraft_industry_desc:0 "现在，让我们暂且把陆军和海军放在一边，来关注一下我们的航空力量…如果这也能被称作是航空力量的话。我们使用的还是战前生产的老旧飞机，这些飞机早就应该被送去回炉炼成废铁了——至少这样还能发挥点作用。但我们都记得德国的空军，它们无情地轰炸我们的城市，有时甚至将它们炸成一片废墟和灰烬…正是在那时，我们切身体会到了航空力量对战争进程的巨大影响。\n\n是时候为俄罗斯航空工业奠定基础了，它的雄鹰将保卫我们祖国的领空不受外敌侵犯。我们将从国家财政中拨出大量资金，用于建立研究中心、工厂以及为我们骄傲的雄鹰们建造机场，这些战鹰很快将以超音速翱翔天际，再也不会有人胆敢轰炸俄罗斯的土地。"
 MAR_arms_standarts:0 "武器标准化"
 MAR_arms_standarts_desc:0 "我们的国防部长，也是沙皇别洛泽尔斯基的挚友——吉尔，提出了一项有趣的计划。他建议推行武器装备的标准化，这不仅有利于军事领域，也有利于民用领域。由于俄罗斯长期处于混乱无序的状态，那些在我们广袤的国土上林立的蕞尔小国，开始以自己的方式对AK-47进行着各种魔改。而在统一西俄的过程中，各地的工厂并未统一生产某种特定型号的AK-47，各种装备也是如此，五花八门。这导致我们的官僚机构不得不费力处理这些不同的型号。我们必须在这些型号中进行甄别，选出最优的型号，最重要的是——这种型号要便于生产。这不仅能够改善军队的装备，而且还能进一步扩大我们武器的产量，并减轻官僚机构的负担。我们将利用这一点来削减政府机构的开支。"
 MAR_tsar_guard:0 "沙皇禁卫军"
 MAR_tsar_guard_desc:0 "任何一个自尊自爱的国家都应当拥有自己的特种部队。而这支特种部队将成为我们的皇家近卫军！\n\n许多将领，甚至吉尔本人都对这支特种部队的必要性提出了质疑。然而，沙皇的意志即是律法。因此没有人能违抗沙皇的旨意。皇家近卫军将拥有最精良的装备、最严苛的训练和最优秀的顾问，它不仅将成为新俄罗斯军队的典范，还将担负起执行那些对普通士兵来说难以完成的危险任务的重任。然而，这样一支训练有素、装备精良的部队也可以作为一支专业的宪兵部队来使用——他们将拥有与宪兵部队相同甚至更多的职能。皇家近卫军如此广泛的职能，恰恰对我们的沙皇有利。"
 berez_belozerski.27.t:0 "俄罗斯之子嗣"
 berez_belozerski.27.d:0 "士兵叶戈尔·奇日科夫的经历与许多人迥然不同。在年仅16岁时，他便顽强地经历了伟大的卫国战争的洗礼，与德国人进行了生死搏斗，更在西俄罗斯战争中留下了自己的英勇篇章。如今，他依然忠诚地服务于别洛泽尔斯基的军队。历经无数辉煌战役后，叶戈尔曾深切渴望告别军旅生涯，他感到自己对于当下的战场已不再像过去那样被迫切需要，那些曾经的战斗岁月似乎已逐渐淡出人们的记忆。无妻无子，父母或许早已在故乡维捷布斯克离世，他渴望能过上安稳的平民生活，享受那份宁静与幸福，而不再是与枪林弹雨相伴，与死神擦肩而过。\n\n于是，他找到了亲密的战友兼指挥官基里尔·科尔迪耶维奇，向他透露了自己打算退役的想法。然而，基里尔的话语却打断了他的思绪：\n\n“哦，叶戈尔！我终于找到你了！有个好消息要告诉你！你将被选拔加入沙皇卫队！”基里尔的话语中流露出赞赏与祝贺之情。\n\n“等等，你说什么？沙皇卫队？”叶戈尔一脸疑惑地问道。这时，基里尔从怀中取出一封信件，信封上醒目地写着“致叶戈尔·奇日科夫”几个大字。“你看看这个，继续往下读！”基里尔催促道。\n\n叶戈尔疑惑地从指挥官手中接过信件，开始仔细阅读其中的内容：\n\n“‘致叶戈尔·奇日科夫：作为一名在伟大卫国战争、西俄罗斯战争以及统一战争中都有卓越表现的士兵，你充分展现出了专业士兵所应具备的素养和能力。因此，根据西俄罗斯人民沙皇国国防部的命令，我们荣幸地通知你已被录取为新成立的沙皇卫队的一员。沙皇卫队的职责包括参与特别行动以及打击恐怖主义和有组织犯罪等重要任务。请你于明天早上7点准时前往你所在最近定居点的警察局报到，以获取进一步的指示。’”叶戈尔大声朗读着信中的内容，每个字都充满了震撼与荣耀。\n\n读完信件后，叶戈尔的心情激动得难以言表。他竟然被选拔加入了这支备受尊敬的部队！这是对他过去付出和勇气的肯定，也是他在军旅生涯中新的里程碑。"
 berez_belozerski.27.a:0 "我需要早点睡觉..."
 MAR_ural_guard_lessons:0 "乌拉尔军团的经验"
 MAR_ural_guard_lessons_desc:0 "我们军队的纪律…实在是令人堪忧。面对人数众多的敌军，他们只会吓得腿软，像娘们一样逃离战场。这岂止是丢人现眼，简直是岂有此理！就这样还打着俄罗斯的光荣旗号？当然，是时候整顿军纪，为塑造“新俄罗斯战士”奠定基础了。\n\n别洛泽尔斯基决定借鉴乌拉尔联盟的经验：他们的军队全部由精锐士兵组成，这些士兵熟悉地形，尽管装备简陋，却能给予任何敌人以有力的回击。我们必须学习他们的策略：要么训练，要么死亡。当然，我们不会真的把人练死，但我们必须要榨干这些家伙的每一分潜力，让他们脱胎换骨，成为真正的战士！"
 berez_belozerski.28.t:0 "例行训练"
 berez_belozerski.28.d:0 "科斯蒂亚·多罗霍夫，一位平凡的18岁俄罗斯青年，毅然加入了军队。根据他那位经历过统一战争的哥哥的叙述，他对军队生活有了一定的预期。\n\n“来吧，科斯蒂亚！无须惧怕！步枪只会在战争时刻才会落到你的手中！而且，那里还有属于军人的浪漫情怀呢！”\n\n因此，科斯蒂亚对军队并无太多恐惧。而今……\n\n科斯蒂亚已逐渐适应了军队的新生活节奏。清晨六点，随着士兵们的热身活动开始，新的一天拉开序幕。紧接着，他们踏入森林，进行长达一小时的慢跑训练。第一次尝试时，科斯蒂亚几乎无法坚持到终点，当他终于走出森林，疲惫不堪地摔倒在地。他真的太累了。\n\n然而，至少还有早餐等着他。经过一个如此艰苦的早晨，那碗被称为“粥”的浓稠食物和稍显陈旧的面包，此刻在他口中如同天上的琼浆玉液。但这，仅仅是初入地狱的试炼。随后而来的，才是科斯蒂亚分队指挥官波罗霍夫尼科夫口中所说的“真正的训练”。他们经历了所有挑战：俯卧撑、深蹲、山羊跳，还有长达十分钟的单杠悬挂，以及武术技巧的训练。当然，午餐和晚餐时间是他们难得喘息的片刻。\n\n每晚十点，熄灯号准时响起。当科斯蒂亚终于能够爬上床铺时，他瞬间便沉入了深深的梦乡。当然，随着时间的推移，他已经逐渐适应了这种生活节奏，每一次的训练也变得愈发轻松。很快，他将蜕变成一名真正的俄罗斯战士，肩负起保卫祖国的重任。"
 berez_belozerski.28.a:0 "快了，就快了。"
 MAR_new_russian_soldier:0 "新俄罗斯战士"
 MAR_new_russian_soldier_desc:0 "我们的军事改革耗资巨大：为军队建造了大量的重工业设施，研究中心不断推出武器装备的改进型号，而我们的士兵也能够立即适应各种地形，不让俄罗斯的每一寸土地落入敌手！我们的新俄罗斯战士是用坚不可摧的精钢锻造而成的，没有任何敌人的武器可以将其击溃。我们的改革已经完成，而且大获成功。"
 berez_belozerski.29.t:0 "新俄罗斯士兵"
 berez_belozerski.29.d:0 "亚历山大·舒什金，被亲密的伙伴们昵称为“舒什卡”，是众多经历“改革”洗礼的士兵中的佼佼者。他早已不再是昔日那个手握步枪都显吃力的羸弱青年，而是化身为一位真正的、铁骨铮铮的俄罗斯战士。他不仅以力量和射击精准度著称，更擅长运用战术智慧来克敌制胜。舒什金荣幸地被选拔为少数精英之一，在别洛泽尔斯基将军的亲眼见证下，参与示范战斗。这些战斗不仅是对他们个人能力的考验，更是对军事改革成果的一次盛大展示。\n\n这场示范战斗在别列兹尼基附近的一片宽阔场地上隆重举行。各界人士纷纷受邀前来观战，为观众准备的所有席位很快就座无虚席，人头攒动。\n\n共有二十位勇士，包括舒什金在内，步入了这个充满挑战与荣耀的“竞技场”。尽管他们彼此素未谋面，但一种同袍间的友好情谊瞬间弥漫开来：因为我们都是并肩作战的兄弟！紧接着，一系列严苛的测试拉开了帷幕。首先迎接他们的是射击精准度的考验：每人配备五发子弹、一支莫辛步枪，并设置五个距离300米远的目标。测试要求战士们迅速装填步枪，并在最短时间内精准击中所有目标。\n\n随着裁判一声令下，手枪扳机扣响，计时器开始飞速运转。舒什金与其他战士一样，展现出了非凡的射击技艺：他仅用时8秒便完成了全部射击！这一成绩不仅创下了新纪录，更在观众中掀起了一阵狂热的欢呼。看到这些普通士兵经过训练后能够取得如此骄人的成绩，人们无不为之振奋！\n\n别洛泽尔斯基将军站在高高的领奖台上，手持望远镜仔细地观察着每一位参赛者的表现。他的脸上露出了满意的笑容。不久，他庄严地宣布：\n\n“现在，这些战士已经准备好挺身而出，为俄罗斯的荣耀而战了……从今往后，我们俄罗斯人民将永远不会在德国的威胁面前屈服！”"
 berez_belozerski.29.a:0 "前进，为了新的胜利！"
 MAR_embassy_prikaz:0 "外交司"
 MAR_embassy_prikaz_desc:0 "在很长一段时间里，我们在外交上被整个世界所孤立。自西俄大地上最后一个还算统一的政权崩溃以来，我们的国民就与外部世界隔绝了联系，只有少数军阀和伪政权的头目才能奢侈地拥有与外界的个别联系。例如，我们，尽管当时在体量上与那些军阀相当，但也仅与美国保持着零星的联系。尽管如此，但俄罗斯人已经很久没有建立起过成熟的外交关系了。此外，即使到了现在，我国虽已统一，但仍未与外部世界建立外交联系，虽然许多国家早已清楚地知道我们的存在，但没有人急于与我们建立联系。\n\n我们必须主动与外部世界建立外交联系，但首先要做的是从无到有地建立外交司，它将负责处理与国外的政治联系。"
 berez_belozerski.10.t:0 "使馆部的建立"
 berez_belozerski.10.d:0 "沙皇谢尔盖·别洛泽尔斯基，正如所有英明的统治者一般，具备着审慎和行动连贯性这两项优秀品质。他凝视着世界地图，仿佛在脑海中摆弄着一盘棋局，计算着在世界舞台上采取行动的所有可能结果，以及将会产生的连锁反应。一条清晰的逻辑链条在他脑海中逐渐成型，引导着他的国家走向最终的辉煌——不仅要加强国内统治，更要将青年俄罗斯联盟的疆域向西扩展到德国，向东扩展到太平洋。\n\n然而，一个问题摆在眼前——尽管他将自己视为地缘政治棋盘上的玩家，但他实际上却缺乏参与游戏的棋子。没有任何国家愿意与青年俄罗斯联盟合作，往好了说是因为我们被低估了，往坏了说是因为很少有人意识到我们已经从灰烬中重生。这对别洛泽尔斯基来说是一种无法容忍的冒犯。\n\n没错！我们需要外交官。我们需要建立自己的外交部，或者更确切地说，是使馆部。这个机构将专门负责与其他国家建立外交关系。毕竟，第一次苏维埃代表大会已经通过了我国外交政策发展计划，而我们也迟早都需要开始实施这一计划。\n\n别洛泽尔斯基将建立使节衙门的任务委托给了卡津别克。卡津别克随即开始招募他需要的人才，这些人将成为首批派往其他国家的大使，并开始与潜在盟友建立联系。根据别洛泽尔斯基的指示，大使们将首先前往OFN国家——美国、加拿大和其他类似国家。卡津别克根据他们的受教育程度、是否会说相应的语言、是否足够礼貌以及是否符合优秀外交官所需的标准来挑选人才。\n\n最终，他找到了合适的人选。首批大使和外交官开始准备出国执行任务。青年俄罗斯联盟必须走出外交孤立，接触外部世界。而我们很快就会做到这一点。"
 berez_belozerski.10.a:0 "以言语达成协议，而非诉诸武力。"
 MAR_reestablish_trading_channels:0 "重启贸易通道"
 MAR_reestablish_trading_channels_desc:0 "我们的使节已准备好出访国外，建立外交关系。首先是经济领域的联系，我们将向西方国家出口我们的资源，并从西方国家购买我们所需的商品。在苏联解体后，像咖啡和巧克力这样的稀有商品在西俄已经难得一见，而现在，我们可以通过启动此类商品的采购来改变这一现状。\n\n这些将是互惠互利的条约。所有人都能从中受益——我们的人民终将获得商品，我们的国家将获得资金，而西方国家将获得资源，有时甚至是俄罗斯独有的稀缺资源。"
 berez_belozerski.11.t:0 "采购"
 berez_belozerski.11.d:0 "美国一家工厂的经理最后一次查看了他必须从俄罗斯供应商那里购买的资源清单。这些供应商是最近才出现在这里的，就在西俄罗斯人民王国登上地缘政治舞台之后。这位经理看着这份资源清单，惊讶地发现，与他通常从加拿大或澳大利亚购买的资源相比，从俄罗斯购买的资源非常便宜。事实上，从俄罗斯出口的铁矿石确实比澳大利亚便宜1.5倍，比加拿大便宜3倍。除此之外，铁矿石的质量也很高，完全可以与西方国家的产品相媲美。\n\n他还有足够未来3个月使用的铁矿石储备，但他决定现在就申请购买铁矿石。因为按照他的估计，在货物运抵之前，他的铁矿石储备很可能会耗尽，而他又不得不等待很长时间才能收到下一批货物。因此，这位经理决定提前做好准备。最终，他觉得自己节省了很大一笔钱，并对俄罗斯的矿石即将到来感到高兴。"
 berez_belozerski.11.a:0 "省下来的钱就是赚到的钱。"
 MAR_two_eagles_meeting:0 "双鹰会晤"
 MAR_two_eagles_meeting_desc:0 "我们这个年轻的国家必须与美国建立外交关系。我们已经向西方打开了贸易通道，但这些措施对我们的国家来说还远远不够。我们的经济如饥似渴地需要更多的贸易联系，需要更多来自国外的援助，需要更多我们可以通过与美国贸易赚取的利润。目前来看，尝试与美国建立关系是明智的，因为美国是当今世界上最富有的国家，不与他们合作对我们来说将是一个巨大的错误。或许，他们也并非不愿意与我们合作，毕竟，我们是东方一个极具潜力的国家。\n\n谢尔盖·别洛泽尔斯基将亲赴美国，亲自与美国总统会谈，并说服他，美利坚需要加强与西俄罗斯人民王国的合作。"
 berez_belozerski.12.t:0 "访问自由之土"
 berez_belozerski.12.d:0 "每当目光扫过地图上的美国时，谢尔盖·别洛泽尔斯基都会陷入沉思。在美国空军服役的岁月，总是会浮现在他的脑海中。他曾经在那里晋升为少校，后来，为了心中的理想，他毅然选择回到俄罗斯。谁又能想到，当初那个意气风发的青年军官，会成为俄罗斯的沙皇呢？\n\n别洛泽尔斯基迫切地想要加强与美国的外交关系，这其中固然有现实的考量，但更重要的是出于一种怀旧的思绪。他要如何才能进一步改善与美国的关系呢？他想了很多办法，但收效甚微。看着外交官们递交上来的报告，他感到有些沮丧。\n\n“想做好一件事，最好还是亲力亲为。”别洛泽尔斯基如是想到。他决定亲自前往美国，与美国总统进行面对面的交流，打破外交僵局，为青年俄罗斯争取更多利益。\n\n通过大使的安排，别洛泽尔斯基踏上了飞往华盛顿的跨洋航班。经过近一天的飞行，他抵达了美国首都。在浩浩荡荡的车队护送下，他从机场径直前往白宫。会谈安排在下午三点整开始，别洛泽尔斯基准时抵达。车队缓缓驶入白宫，侍者为他打开车门，白宫卫兵向他致以敬礼。在工作人员的引导下，别洛泽尔斯基穿过走廊，来到了总统办公室。\n\n会谈开始了。别洛泽尔斯基曾经在美国军队服役，英语非常流利，与总统的交流没有任何障碍。他首先向总统简要介绍了自己的人生经历，着重讲述了他在美国军队服役的经历。这段开场白大约持续了半个小时，随后，他们又谈论了一些其他轻松的话题。从总统的表情可以看出，他显然对这位年轻沙皇的传奇经历很感兴趣。在营造了良好的谈话氛围后，沙皇开始将话题引向与美国，乃至整个“自由国家组织”合作的事宜。\n\n别洛泽尔斯基请求美国总统简化两国建交的流程，方便西俄罗斯人民沙皇国招募军事和经济领域的专家，并签署共同对抗德国和其他国家的协议。\n\n与通过大使进行交涉相比，这次会谈的效率要高得多。当然，美国总统在措辞上依然十分谨慎。而别洛泽尔斯基则充分展现了他的口才，向总统阐释了与西俄罗斯合作所能带来的巨大好处，最终，他成功地说服了美国总统，达成了所有预期目标。原定三点结束的会谈，一直持续到深夜。在这短短的几个小时里，别洛泽尔斯基为西俄罗斯的未来发展争取到了宝贵的支持。\n\n与总统告别后，别洛泽尔斯基在华盛顿短暂休息了一天，随后再次踏上归途，返回了自己的祖国。"
 berez_belozerski.12.a:0 "海外的援助将是我们坚强的后盾，西方世界与我们同在！"
 MAR_ofn_support:0 "OFN的支援"
 MAR_ofn_support_desc:0 "尽管我们早在很久以前就致力于提升军队的整体素质，然而，军队战斗力的低下仍然是一个亟待解决的问题。诚然，我们的军队已经能够粉碎那些盘踞在西俄的伪政权，但与其他国家相比，我们的国防力量依然相形见绌。我国的工业也落后于时代，数十年的分裂状态使得我们无法顺利地推进工业化进程。\n\n通过与西方的谈判和协商，我们极大地简化了双边关系的建立过程。现在，我们应该利用这些便利条件，提升经济指标，并消除军队中存在的不专业现象。"
 berez_belozerski.13.t:0 "远道而来的援助"
 berez_belozerski.13.d:0 "今晨的阿尔汉格尔斯克弥漫着一股非比寻常的气氛。这座北方城市，自古以来便依靠与欧洲的贸易而生。然而，随着伟大卫国战争的失利以及苏联的解体，它不再为任何人所需要，无论是俄罗斯的其他地区，抑或是昔日的西方伙伴，都对其漠不关心，这座昔日作为西俄罗斯革命阵线中心的城市，如今只余下一片衰败萧条的景象。\n\n但今天却与往日不同。根据预定计划，一支重要的船队将在今天抵达，它将为阿尔汉格尔斯克带来新生。负责港口事务的瓦西里一直注视着地平线，期待着那支庞大的商船队伍出现。这些巨轮的吨位之大，是自布哈林时代以来俄罗斯从未见过的。从货物清单上判断，船上满载着各种工业设备，还详细列出了它们的分类。瓦西里虽然懂一点英语，但对这些设备的具体型号和先进程度一无所知。然而，凭借常识，他清楚地意识到，这些设备绝对代表着先进的技术水平，是如今的俄罗斯无法企及的。\n\n终于，船队的身影出现在了地平线上。透过望远镜，瓦西里清楚地看到了船头上飘扬的星条旗——美国人如期而至。他立即命令手下做好迎接美国同僚的准备，并允许船只在阿尔汉格尔斯克港口停泊。\n\n巨轮在港口边缓缓停下，阿尔汉格尔斯克仅存的几台卸货设备开始将一个个装满全新机械的箱子从船舱中运出。码头上的每一位工人都怀着敬畏的心情注视着这些箱子，试图猜测里面究竟装着什么。此外，还有几艘船上载着身穿制服的人员，他们正是别洛泽尔斯基亲自邀请的军事专家，前来对俄罗斯士兵进行格斗、战术技巧以及其他方面的专业训练，以全面提升他们的作战能力。这些专家一下船就被一辆军用卡车接走，直接前往军事基地，着手处理他们职责范围内的事务。\n\n卸货工作结束后，瓦西里收到了报告，并立即将其递交给他的上司——贸易办事员。随着第一支船队抵达破败的阿尔汉格尔斯克，这座城市终于迎来了它的新生，以及存在的意义。"
 berez_belozerski.13.a:0 "“设备已运抵，人员已就位，静候进一步指示。”"
 MAR_russian_volunteers:0 "俄罗斯志愿军"
 MAR_russian_volunteers_desc:0 "我们外交司的分析人士指出：世界局势日趋紧张。就在我们处理自己内部问题的时候，一场“冷战”正在我们祖国的国门之外愈演愈烈，这场“冷战”的参与者是三个超级大国——德国、美国和日本。虽然这些超级大国都拥有核武器，而核武器也几乎是避免爆发直接军事冲突的唯一保证，但这种局势却丝毫无助于世界和平。世界局势剑拔弩张，在这种氛围之下，各个地区不断爆发局部冲突，这些冲突是超级大国之间博弈的体现，只是它们选择了在其他国家的战场上，以他国人民为代价进行角力。\n\n我国必将成为一个举足轻重的大国，也必将向着超级大国的目标迈进，因此我们也必须积极参与这些区域性冲突，以维护我们在当地的利益。或者，我们可以向OFN的盟友提供援助，这将有助于增强我们同盟的实力。"
 berez_belozerski.14.t:0 "灼热的沙漠骄阳"
 berez_belozerski.14.d:0 "谢苗和他的部队被派往了中东——那片充斥着沙砾、骄阳和酷热的土地，即使是漫不经心的一点疏忽，都可能葬身于此。他们并非自愿来到这片土地，而是响应当局以及沙皇别洛泽尔斯基将军的号召，毕竟没有人能够违抗沙皇的命令。就这样，他们和他们的部队被祖国派往了中东，这个星球上最动荡不安的地区之一。\n\n“冷战”的阴云，为这颗星球上的许多地区带来了不安与躁动。曾经在第二次世界大战前夕还能保持相对平静的地方，如今也成为了自由国家组织、团结协定和共荣圈之间角力的前线。最近一次冲突爆发于南非，自由国家组织与团结协定的利益在此发生激烈碰撞。而根据坊间传闻，中东将成为下一个力量角逐的舞台。\n\n俄罗斯在中东地区有着不容忽视的利益，谁主导了中东，谁就能扼住俄罗斯的咽喉。对于西俄罗斯人民王国来说，最有利的局面莫过于在中东地区扶持起一个亲俄政权。这将极大巩固俄罗斯在该地区的优势地位。因此，为了实现这一目标，谢苗和他的部队作为军事专家和志愿者被派往了中东，他们已做好了为俄罗斯的利益而献出生命的准备。\n\n抵达中东后，谢苗立刻被派往了一支所谓的“叛军”部队驻扎的营地。随之而来的便是接踵而至的挑战：语言不通、文化隔阂，更要命的是，这群人大多是文盲，除了会使用武器外一无是处。等待着谢苗的是一项无比艰巨的任务——训练这支部队掌握基本的战术技能，将这群乌合之众，至少打造成一支有模有样的军队。除此之外，他还需要忍受难以想象的酷热，在这样的高温下，有时甚至不用生火就能把食物烤熟。"
 berez_belozerski.14.a:0 "如果说人间真有地狱，那一定是这中东的滚滚黄沙了。"
 MAR_volunteer_mladojopa:0 "俄罗斯志愿军"
 MAR_volunteer_mladojopa_desc:0 "在当今的艰难时局下，志愿军是我们影响力的重要工具。我们派出的志愿军越多，对我们就越有利。"
 MAR_infiltrate_the_reich:0 "渗透德国"
 MAR_infiltrate_the_reich_desc:0 "有朝一日，我们将再次与德国人兵戎相见。他们夺走了我们古老的城市，例如莫斯科、圣彼得堡、察里津等等，并将这些城市中的居民贬为奴隶。被桎梏于奴隶制的枷锁与镣铐之中的俄罗斯人民需要获得解放，但我们年轻的俄罗斯党政权尚未做好与德国进行直接冲突的准备，即便有盟友的支持也于事无补。\n\n尽管如此，我们仍可通过在敌人防线的内外环线上找出其薄弱环节来加速我们对抗德国的准备。当战争爆发之时，我们就能利用这些弱点，相对轻松地突破敌人的第一道防线。"
 berez_belozerski.32.t:0 "机会评估"
 berez_belozerski.32.d:0 "1941年，纳粹德国入侵俄罗斯，铁蹄踏碎了无数人的家园，战火燃遍了东欧平原。他们一路向东推进，直至“阿尔汉格尔斯克-阿斯特拉罕”一线，才被迫停下脚步。根据“东方总计划”，纳粹在被占领的俄罗斯领土上建立了多个专员辖区，将这个曾经统一的国家分割成了一块块支离破碎的殖民地。在这些由柏林直接控制的傀儡政权中，有一个与众不同——莫斯科专员辖区。\n\n对于仍然保持独立的俄罗斯人民而言，莫斯科专员辖区是纳粹德国的第一道防线。在西俄罗斯战争期间，当苏军几乎兵临莫斯科、列宁格勒等俄罗斯重镇城下时，是祖国的战士们，率先向侵略者发起了反击。然而，我们最终还是在这场解放战争中败北了。现在，我们与莫斯科之间隔着400公里的战火硝烟，这道天堑，并非那么容易跨越。\n\n尽管莫斯科专员辖区的防御体系漏洞百出，但我们也不能掉以轻心。它虽然相对弱小，但战线却异常漫长，这也是我们需要面对的挑战之一。此外，在我们向莫斯科维亚专员辖区的重要城市挺进的过程中，敌军很可能会采取拖延战术，等待纳粹主力部队的增援。到那时，我们的军事行动就将功亏一篑。\n\n因此，我们的计划是，尽一切可能从内部瓦解莫斯科专员辖区。俄罗斯人民渴望解放，这是毫无疑问的。我们必须利用这一点，派遣特工潜入敌后，煽动俄罗斯士兵叛乱和反抗。为了实现这一目标，我们首先需要制造一场小规模的边境冲突，在敌人防线上撕开一道口子，以便我们的特工能够安全潜入。同时，我们还可以借此机会，摸清敌人的战术意图，评估他们的整体作战能力。\n\n这个计划说起来简单，但执行起来却困难重重。这是一次大胆的冒险，但我们必须这么做，试探一下敌人的虚实。也许，德国人会因为我们这次大胆的行动而率先向我们发动进攻。但他们最近一直在收到来自东部边境的阵亡报告，也许根本不会注意到，又一次微不足道的“袭击事件”。"
 berez_belozerski.32.a:0 "是时候见识一下，我们的敌人究竟是何方神圣了。"
 berez_belozerski.40.t:0 "我军已突破敌军防线，成功开辟走廊！"
 berez_belozerski.40.d:0 "感谢彼得和他的侦察队以及其他部队的英勇奋战，我们成功突破了敌人的防线。我们已经摸清了德军针对我军使用的战术，更加坚定了必胜的信念。此外，我们还完成了主要目标——在莫斯科专员辖区境内为我们的代理人开辟了一条走廊。现在，只待时机成熟，我们便可将敌人从各个角落驱逐出去。\n\n侦察兵彼得和他的小队荣获“英勇勋章”，每位成员的军衔都得到了提升。他们准确地确定了敌军地雷和哨所的位置，这份功勋理应得到嘉奖。"
 berez_belozerski.40.a:0 "恶魔并非传闻中那般可怕！"
 berez_belozerski.41.t:0 "我军已被击退！"
 berez_belozerski.41.d:0 "我军在敌人的防御阵地前遭受重创，被迫撤退。敌人在纵深部署了防御，并调集了生力军阻挡我军的攻势。由于我方侦察工作存在疏漏，未能及时发现敌军的部署，导致部队陷入包围。就好像…他们一直在那里等着我们一样。\n\n在这场看似微不足道的行动中，我们损失了大量年轻士兵和宝贵装备。我们的军队将从中吸取教训，但这场失利无疑打击了士兵们的士气，也对我国的整体局势造成了负面影响。\n\n彼得和他的侦察队深感沮丧，但他们不会放弃。下一次，他们将做好更充分的准备，尽一切努力，更准确地侦察敌人的防御部署。"
 berez_belozerski.41.a:0 "我们早晚会回来的。"
 MAR_anti_german_alliance:0 "反德同盟"
 MAR_anti_german_alliance_desc:0 "我们有充分的理由相信，欧洲终将从德国纳粹的魔爪下获得解放。他们在东欧的统治迟早会结束，而在这片残酷统治的废墟之上，一个崭新的、自由的、摆脱了当前世界残酷暴行的新世界必将诞生。然而，在这一天到来之前，我们必须尽一切可能帮助我们在德国境内受苦受难的斯拉夫兄弟，从简单的资助那些与侵略者作战的游击队，到帮助他们组建流亡政府。\n\n将来，如果一切顺利，他们一定会感激我们的帮助，并对我们更加忠诚。"
 berez_belozerski.30.t:0 "援助之手"
 berez_belozerski.30.d:0 "当我们完成俄罗斯的统一大业后，我们的目光必将转向西方——投向德国乃至整个欧洲。我们国家的梦想是解放俄罗斯的故土，将它们重新纳入帝国的怀抱——这首先指的是莫斯科、乌克兰、东部地区以及其他的帝国专员辖区。然而，为了解放西俄罗斯的剩余地区，我们不仅需要前线的战士，也需要后方的支持。目前，纳粹势力范围内活跃着众多游击队，他们为了消灭共同的敌人——德国人——而进行着殊死搏斗，对纳粹侵略者的仇恨将所有人团结在一起——俄罗斯人、小俄罗斯人、波兰人，甚至犹太人和其他在纳粹铁蹄下呻吟的民族。\n\n我们理应向游击队伸出援手，甚至帮助他们在流亡中建立政府。别洛泽尔斯基已在其命令中指示部下建立专门部门，以帮助国外的游击队，并着手筹建流亡政府部门，首先邀请拒绝服从纳粹的波兰共和国大使前来商议。\n\n这些大使抵达俄罗斯后，便开始与我国建立外交关系。虽然现在谈论任何经济协议还为时尚早，但这些政治举动意义重大——俄罗斯已承诺，将在波兰从纳粹占领者手中解放出来后，帮助其恢复独立。波兰共和国的流亡大使们对我们成为他们的新盟友感到非常高兴，并表示将来必将报答我们的恩情。\n\n与此同时，在这些大使与我们建立关系的同时，我们也成立了协调和联络东欧游击队的部门。我们已经联系了在乌克兰、白俄罗斯以及莫斯科境内活动的游击队，虽然不是全部，但至少是其中规模最大的组织。利用莫斯科边境的漏洞，我们可以将部分装备运往东部，并协调这些游击队的行动，让他们首先攻击我们最需要他们打击的地方。\n\n多亏了我们建立的联络网，我们了解到了帝国的真实情况——奴隶们的处境坦率地说毫无希望，人民已经做好了奋起反抗侵略者的准备。我们只需等待一个完美的时机，便可放手一搏。"
 berez_belozerski.30.a:0 "导火索已经点燃，只差一根火柴…"
 MAR_return_of_the_eagle:0 "雄鹰归来"
 MAR_return_of_the_eagle_desc:0 "世事变迁，沧海桑田，然总有一些东西亘古不变。边界几经变迁，新的玩家不断涌现，但权力总能找到它的一席之地。如果这些论断正确，那么它们无疑也适用于我们的国家。\n\n我们在外交政策上迈出了第一步。我们与美国建立了联系，从那里获得了技术和稀缺资源，此外，我们在俄罗斯境外也拥有了盟友。我们的国家走出了过去的孤立状态，给数百万俄罗斯人民带来了对美好未来的希望。我们剩下的任务，就是向全世界宣告我们的存在。"
 berez_belozerski.31.t:0 "新玩家"
 berez_belozerski.31.d:0 "别洛泽尔斯基欣喜地看着地图——因为他明白，自己终于真正登上了世界政治的舞台。作为国际象棋棋盘上的新玩家，他强势亮相，如今的他既可以随心所欲地影响世界地缘政治，也可以在冷战的天平上为“DOS”阵营加上重要的砝码。\n\n如今冷战正酣，世界各地冲突不断。从今往后，任何影响到俄罗斯利益的冲突，我们都有能力，也有义务进行干预。\n\n由于贸易带来的投资和新型工业技术源源不断地涌入，我国经济欣欣向荣，如同血管得到了新鲜血液的滋养。\n\n我们在另一边的阵营里也建立了联络，如果时机成熟，他们将帮助我们从纳粹的暴政中解放我们自己的领土。\n\n我们的敌人数量众多且实力强大，无论是在国内还是在国外。他们已经磨刀霍霍，想要将俄罗斯人民赶尽杀绝，让我们的国家再次陷入混乱。但他们不会得逞！他们绝不可能得逞！因为我们是俄罗斯人！俄罗斯人民永不屈服，只要祖国还在，我们就将战斗到最后一人！\n\n我们的人民忠于沙皇，热爱自己的国家，他们将战胜一切艰难险阻，度过一切惊涛骇浪。那些试图征服我们土地的条顿骑士没有击垮我们；蒙古人没有击垮我们，我们从鞑靼-蒙古枷锁留下的废墟中再次崛起；内乱没有击垮我们，我们也从这些创伤中恢复了过来；拿破仑和他的大军没有击垮我们；第一次世界大战、伟大的卫国战争以及西俄战争都没有击垮我们。只要还有一个俄罗斯人活着，我们的人民就将为在这个世界上生存的权利而活下去，战斗下去！任何胆敢，或者曾经胆敢伤害我们的人，都将见识到俄罗斯人民的滔天怒火！"
 berez_belozerski.31.a:0 "因为，俄罗斯雄鹰已经归巢！"
 MAR_return_of_the_eagle_idea:0 "俄罗斯雄鹰"
 MAR_return_of_the_eagle_idea_desc:0 "我国重返世界政治舞台。通过这些外交上的联系作为后盾，我们可以更加果断地行动，施展我们的影响力，而无需再担心被当作“被孤立的国家”。我们已然成为一个官方承认的国家。"
 MAR_belozerskiy_flavour.1.t:0 "二重奏"
 MAR_belozerskiy_flavour.1.d:0 "四年级的“学长”们，总是变着法子欺凌一个三年级的小家伙。这孩子势单力薄，每当放学后，其他人早已回家，只剩下他形单影只之时，欺凌便开始了。而这些施暴者，往往因为糟糕的成绩而心情不佳，便将怒火尽数发泄在这个可怜虫身上。\n今天也不例外。当男孩又一次独自踏上回家的路时，厄运再次降临。他试图像模像样地反抗，却被轻易地摔倒在地。“哈哈！小废物！你还能拿我们怎么样？！”、“真是个可笑的小东西，无助的样子真有趣！”，嘲讽与羞辱像毒蛇吐出的信子般，无情地撕咬着男孩的尊严。无边的愤怒在他胸膛中燃烧，他多么希望自己能够站起来，给这些家伙们一次狠狠的反击。可是，他办不到，只能无助地躺在地上，任由屈辱的泪水在眼眶里打转。幸好，今天只有两个人，另外两个不知去向了。\n\n就在这时，一个高大的身影出现在了路口，脚步沉稳有力，仿佛带着一股慑人的气势。只消一眼，便能看出他的力量远在两个欺凌者之上。他显然是出于一种本能的正义感，想要帮助弱者。他大喝一声：\n\n“住手！都给我滚开，不然别怪我不客气！我的拳头可不是闹着玩的！”\n\n突如其来的援助令两个恶霸措手不及，他们看着眼前这个高大强壮的男孩，心中顿时生出一丝惧意，乖乖地闭上了嘴，灰溜溜地逃走了。\n\n他们刚一转身，这个壮实的家伙——结果发现，他竟然也是三年级的学生——就把谢尔盖扶了起来。谢尔盖向他道谢，他们决定在回家的路上聊聊生活和彼此的遭遇。最终，他们决定互相介绍一下。\n“我叫叶戈尔，姓盖达尔，你呢？”\n“谢尔盖·马弗罗迪，很高兴认识你！我们可以成为朋友吗？”"
 MAR_belozerskiy_flavour.1.a:0 "一段伟大而真挚的友谊，就此拉开了序幕。"
 MAR_belozerskiy_flavour.2.t:0 "富农"
 MAR_belozerskiy_flavour.2.d:0 "年过六旬的马克西姆爷爷，一辈子都在田里耕作，从未离开过这片土地。他的家族拥有大片土地，为了耕种，他们雇佣其他农民来为自己干活。这些人，就是人们口中的“富农”。马克西姆曾体会过短暂的富足，那既来自于他自己的辛勤劳作，也来自于雇工们的汗水。\n\n然而好景不长。18岁那年，布尔什维克的战火烧到了家门口，父亲要他留守家业，等待自己回家。这一别，便是经年累月。也许父亲早已战死沙场，埋骨西伯利亚，为高尔察克尽忠去了，谁知道呢？布尔什维克一来，“富农”的日子就不好过了。1928年，集体化浪潮席卷而来，马克西姆家的土地被收归集体所有。\n\n他没有反抗，但却对祖辈留下的土地被轻易夺走感到痛心和不公。他和其他的农民关系融洽，可法律就是法律，集体化势在必行。他加入了集体农庄，继续辛苦劳作。然而战争又一次降临，摧毁了来之不易的新秩序。\n\n卫国战争的硝烟散尽，布哈林时代的苏联已不复存在。集体农庄却依然存在，直到第二次巨变来临——西俄罗斯革命阵线垮台，一个全新的国家在马克西姆的家乡建立，集体农庄被解散了，而土地，却再也没有回到农民手中。\n\n直到青年俄罗斯联盟的到来，这一切才得以改变。马克西姆终于重新分到了一块与当年同样大小的土地。他本可以自己耕种，但岁月不饶人，体力大不如前，关节疼痛，旧疾缠身。好在，双手依然记得如何劳作。他知道，仅凭一己之力，无法完成如此繁重的任务，于是他找到了村里年轻力壮但家境贫寒的农民，雇佣他们为自己干活，并承诺会支付丰厚的报酬。\n\n马克西姆爷爷终于安心了，他知道自己不用再为生计发愁。他的孩子们如今都住在城里，无法为他分担农活。但这不要紧，凭借着丰富的经验，他完全可以照顾好自己，甚至再次致富。或许，我们正在见证着新一代“富农”的崛起。"
 MAR_belozerskiy_flavour.2.a:0 "回到旧日的道路上。"
 MAR_belozerskiy_flavour.3.t:0 "同志"
 MAR_belozerskiy_flavour.3.d:0 "杂货店老板罗森菲尔德是个富得流油的人物。他的小店利润丰厚，足以满足日常所需，甚至还能购置一些价值不菲的玩意儿。或许是因为他的店货真价实、价格公道；也或许是他特别会做生意，总能用各种手段讨好顾客。\n\n不过，罗森菲尔德这个姓氏本身就足以说明，此人绝不简单。他是个犹太人，而且是个虔诚的犹太教徒，不吃那些昂贵又不符合犹太教规的食物。他总是从社群里的朋友那里拿到最好的东西，当然，价格也总是很低，毕竟都是“自己人”。不过，他还有个小秘密：他一直在成功地偷税漏税。也许，这才是他富裕的真正原因。\n\n然而，这样恬静的日子并不会永远持续下去。一天，一个身穿笔挺制服、神色严肃的人来到了他的店里。\n“您好！有什么事吗？” 罗森菲尔德问。\n“您好。很抱歉打扰了，我是税务局的，想检查一下您是否按时缴税。” 罗森菲尔德顿时紧张起来，但他还是不得不拿出税务报表和护照。税务官一开始非常愤怒，因为这个奸商竟然四年多没交税了。他正要开口说罗森菲尔德要么坐牢，要么交巨额罚款，却突然注意到了他的护照。\n“您就是罗森菲尔德？” 税务官的脸上露出了笑容。\n“是的，有什么问题吗？”\n“啊，同志！我也是犹太人，我不能对自己的同志见死不救啊。”\n“真的吗？真是太好了！我该怎么感谢您呢，我的朋友？”\n“我想，如果能尝尝您这儿的马扎和其他犹太美食，我就感激不尽了。您这儿有吧？”\n“当然当然！”"
 MAR_belozerskiy_flavour.3.a:0 "他们找到了共同语言。"
 MAR_belozerskiy_flavour.4.t:0 "出租车司机"
 MAR_belozerskiy_flavour.4.d:0 "弗拉基米尔·佩乔林是纽约布莱顿海滩的一名出租车司机，出身白俄移民世家。他的父辈在内战失利后背井离乡，远走他国。有人去了德国，有人去了法国，还有人逃到西伯利亚，一路辗转至满洲里。而佩乔林一家，则漂洋过海，最终抵达了美国。尽管已经是美国公民，但他骨子里还是个俄罗斯人，理所当然地住进了俄罗斯人聚居的社区。那里，人人都在说俄语。\n\n布莱顿海滩就像是被时间遗忘的角落，保留着1917年之前的俄罗斯风貌。然而，弗拉基米尔从未亲眼见过他的祖国。有关那片土地的一切信息，都来自于每周新闻报纸上寥寥数语的俄罗斯报道。作为一个坚定的反共人士，他痛恨苏联，却依然牵挂着祖国的命运。当得知苏联在卫国战争中解体，俄罗斯最终崩溃时，他的内心充满了悲伤和绝望。此后，报纸上关于俄罗斯的新闻少之又少，而且支离破碎，他只能得出一个简单的结论：俄罗斯消失了。\n\n然而，令他惊讶的是，在另一份报纸上，他看到了俄罗斯开始复苏的消息。尤其引人注目的是，在青年俄罗斯运动的领导下，西俄罗斯地区竟然恢复了君主制。他对青年俄罗斯联盟所知甚少，起初也并不怎么关心。但随着西俄罗斯的统一，大量关于那里的详细报道纷至沓来。他读到，俄罗斯正在进行着真正的创造性工作，他们正在利用现代化的手段，恢复昔日的美好秩序。这一切，令弗拉基米尔·佩乔林深受鼓舞。\n\n在青年俄罗斯联盟的旗帜下，祖国正在复兴。受到这份鼓舞，弗拉基米尔·佩乔林开始考虑带着家人离开纽约，回到遥远的俄罗斯，回到他们真正的家。而他并非唯一心怀此念之人，他的不少顾客，也开始谈论起回国的事情。"
 MAR_belozerskiy_flavour.4.a:0 "是时候回到祖国的港湾了。"
 MAR_belozerskiy_flavour.5.t:0 "锤杀者"
 MAR_belozerskiy_flavour.5.d:0 "一系列手法相同的凶杀案，令整个喀山城人心惶惶。凶手异常猖狂，几周内就夺去了15条人命，还有5人重伤致残。所有的案件都呈现出惊人的相似：袭击地点选在人迹罕至之处，受害者均被重物击打头部，非死即伤。\n\n列昂尼德·卡涅夫斯基探长，独自一人负责调查这起连环凶杀案。根据目前的线索，他已经得出以下结论：凶手总是从背后发动袭击，凶器应该是锤子或者棍棒之类的重物。为了方便称呼，人们给凶手起了一个绰号——“锤杀者”。\n\n那些侥幸生还的受害者，也无法提供凶手的详细信息。至于作案动机，更是无从得知。受害者身上通常不会携带超过100-150卢布的财物，只有极度利欲熏心之徒，才会为了这点钱大开杀戒。而从锤杀者选择作案地点和时机的谨慎来看，他绝非等闲之辈。那么，他只是一个以杀人为乐的疯子吗？还是说另有目的？又或者，这是一群人共同作案？\n\n警方正全力追捕凶手，但目前为止，依然一无所获。"
 MAR_belozerskiy_flavour.5.a:0 "调查仍在继续。"
 MAR_belozerskiy_flavour.6.t:0 "赤色旅"
 MAR_belozerskiy_flavour.6.d:0 "喀山第127学校，一位俄语老师惊慌失措地走向警察局。她手中紧紧攥着一本笔记本，显然，这本笔记就是她如此焦虑的原因，也促使她来到这里。笔记本上的内容令她毛骨悚然。问题不在于内容本身，而是她认为这一切都是自己的学生干的，因为她在工作结束后，在一张课桌里发现了它。\n\n走到警察局门口，她踏上台阶，推开大门，定了定神，径直走向值班警察的窗口。几分钟后，她走进一间办公室，门上的标牌赫然写着“列昂尼德·卡涅夫斯基警官”。\n\n老师把笔记本递给卡涅夫斯基，并将发现经过和盘托出。卡涅夫斯基接过笔记本，快速翻阅起来。首页上的内容让他心头一震，上面写着：“赤色旅——为了真正的共产主义！”，“主义”两个字因为空间不足，被挤在了下方。正中央是一个由纳粹党徽和五角星组成的图案，笔记的内容昭然若揭。笔记本看起来有些年头了，但上面的文字工整流畅，几乎没有错别字和语法错误。其中几行字，格外引人注目：\n\n“…卡津别克的青年俄罗斯联盟，以及沙皇谢尔盖·别洛泽尔斯基之流，都不是真正的俄罗斯精神的承载者。他们披着‘俄罗斯民族主义’的外衣，妄图将最美好的社会主义思想与过去那些荒诞的君主制残余结合起来…”\n\n“…这届政府得到了一些天真民众的支持，这些人相信他们可以轻易地回到过去沙皇和布哈林统治下的富足生活。他们天真地认为，这条道路因为正确，所以就会一帆风顺。事实远非如此。俄罗斯民族真正的发展道路在于‘左翼法西斯主义’，即俄罗斯身份认同与社会主义的结合，这才是俄罗斯意识深处的火种…”\n\n“…为了实现远大目标，任何手段都是正当的：贿赂、敲诈、暗杀、军事恐怖主义、群众鼓动和宣传。‘赤色旅’的目标，就是将自己人安插进现有政权的国家机器中，以便建立一个真正的俄罗斯共产党…”\n\n卡涅夫斯基惊呆了。此外，笔记本中还多次出现了一个“神奇数字”：36。他没有再读下去，而是告诉老师他会处理好这件事。当天，列昂尼德就将笔记本送到了国家安全部的地方部门。笔迹鉴定结果显示，文字出自成年人之手。学生作案的可能性被排除了，但笔记本究竟是如何出现在学校的，依然是个谜。校方立即对学生进行了谈话，但没有人表现出任何精神异常或持不同政见的想法。案情变得更加扑朔迷离。\n\n与此同时，受害者人数已经上升至30人…"
 MAR_belozerskiy_flavour.6.a:0 "民族布尔什维克？"
 MAR_belozerskiy_flavour.7.t:0 "谜团逐渐解开"
 MAR_belozerskiy_flavour.7.d:0 "喀山又一次发生袭击事件，一向冷静的列昂尼德·卡涅夫斯基探长终于忍无可忍，怒火中烧。\n\n“为什么还没抓到那个锤杀者？！这已经是这段时间以来的第36起案件了！你们以为他会就此收手吗？！我们已经浪费了太多时间，而他还在继续杀人！我要求你们立刻加强巡逻，严密监视，彻查所有近期释放的罪犯！无论如何，都要阻止他！”\n\n卡涅夫斯基的命令被迅速执行下去。为了尽快抓捕凶手，他亲自带队，驾驶着警车穿梭于大街小巷。他心意已决，无论付出什么代价，都要将这个暴徒绳之以法。\n\n一天下午，卡涅夫斯基和他的巡逻队像往常一样，在街上巡逻。他们仔细观察着来往的人群，希望能找到蛛丝马迹。起初，一切都很平静，没有发现任何可疑之处。然而，两个站在街角的男人引起了他们的注意。其中一人提着一个公文包，另一人则两手空空。就在这时，那个没有拿东西的男人突然转过身，看到了警车，他拔腿就跑，拼命地向远处逃去。\n\n卡涅夫斯基立刻用对讲机命令后面的警车：\n“二号车，拦住那个拿公文包的！我去追逃跑的！”卡涅夫斯基果断下令。\n“一号车收到，这就去！”\n\n第二辆警车一个急刹车，停在拿公文包的男人面前。他还没反应过来，就被警察按倒在地，押回了警局。而卡涅夫斯基则紧追着逃跑的男人，在车流中穿梭。然而，追捕并没有持续多久，那个男人转过街角，消失在错综复杂的巷道中。想在这样的地方找到一个人，无异于大海捞针。\n\n回到警局，卡涅夫斯基立刻下令搜查那个公文包。包里有一根用破布包裹的木棍，上面还沾着血迹。当警察试图解开破布，查看这根自制凶器的构造时，一股鲜血从中涌出。除此之外，包里还有一份“赤色旅”的宣言，内容与第127学校的俄语老师提供的那份一模一样。然而，公文包的主人只是一个工厂里的普通司机，怎么看都不像是那个犯下累累罪行的杀人狂魔。果不其然，他否认自己杀害了任何人。\n\n在警方的审讯下，司机交代了他的朋友和同伙，其中一个名叫维克托·奥西波夫的男人，身高超过两米，引起了卡涅夫斯基的注意。种种迹象表明，他很有可能就是“锤杀者”。奥西波夫很快就被逮捕归案，警方开始分别审讯这两个人。卡涅夫斯基深信，无论是奥西波夫还是那个司机，都不可能是“赤色旅”的幕后策划者。最终，司机的心理防线彻底崩溃，他供认了一切，并说出了幕后主使的名字——阿列克谢·普斯塔沃。"
 MAR_belozerskiy_flavour.7.a:0 "终结恐怖。"
 MAR_belozerskiy_flavour.8.t:0 "生擒普斯托夫"
 MAR_belozerskiy_flavour.8.d:0 "根据线索，阿列克谢·普斯托夫很可能藏身于城郊一栋不起眼的居民楼里。列昂尼德·卡涅夫斯基决定亲自带队，实施抓捕。算上他自己，行动小队一共六人。夜幕降临，警车悄无声息地停在了居民楼前。就在这时，一个五年级模样的男孩走了过来。特工询问他的名字，男孩却只说了一个姓氏——普斯托夫。\n\n卡涅夫斯基愣了一下，随即问道：“你哥哥阿列克谢在家吗？”男孩点点头，说在家，并告诉了他们门牌号。行动小队立刻行动起来。\n\n短暂的准备之后，抓捕行动开始了。感觉到情况不妙，普斯塔沃心知肚明来者不善。他手边只有一把刀，只能孤注一掷，负隅顽抗。特工们破门而入，普斯托夫挥舞着刀，疯狂地扑向他们。房间里顿时一片混乱。一名特工死死地抱住普斯托夫，其他特工则一拥而上，试图将他制服。然而，丧失理智的普斯托夫却越发疯狂，混乱中，一声枪响，普斯托夫胸口中弹倒地。\n\n卡涅夫斯基简直出离愤怒了：“混蛋！谁让你们开枪的？！我要的是活口！” 怒火过后，他很快冷静下来，命令手下：“立刻搜查房间，收集所有文件和资料。” 在普斯托夫的房间里，特工们找到了一本日记。从字里行间可以看出，他从小就因为身材矮小、戴眼镜而被人欺负。也许，正是童年的阴影，让他走上了这条企图颠覆旧政权、建立理想新世界的道路。\n\n日记里还解释了“36”这个数字的含义：这是俄语字母表中所有字母序号加起来的总和。普斯托夫将自己的名字与拿破仑进行比较，根据他的计算，拿破仑的名字也对应着数字36。\n\n“赤色旅”的领导者死了。消息传开，这个以“锤杀者”之名，犯下累累罪行的团伙，终于被彻底消灭。普斯塔沃崇拜希特勒、拿破仑，梦想着征服世界。然而，他和那些暴君唯一的共同点，就是最终都以悲剧收场。他们自以为有权决定全世界的命运，却最终走向了自我毁灭。"
 MAR_belozerskiy_flavour.8.a:0 "这是杀戮应得的下场。"
 MAR_extracurricular_congress:0 "非常苏维埃大会"
 MAR_extracurricular_congress_desc:0 "在英明的沙皇将军谢尔盖·别洛泽尔斯基的统帅下，我们所向披靡的军队在西西伯利亚取得了决定性的胜利。这次堪比叶尔马克征服乌拉尔以东地区的远征，将被后世永远铭记。俄罗斯人民非但没有在这场征战中蒙受损失，反而愈发强盛，因为我们离恢复整个民族的昔日统一更近了一步。\n\n我们击溃了俄罗斯大地上又一个割据政权，向着统一俄罗斯的目标迈进了一大步。那些曾经被意识形态教条和伪政府边界所分割的人民，如今更加团结。如今自由而强大的俄罗斯，西起与“莫斯科专员辖区”的边境，东至中西伯利亚的边缘。但是，在进行下一步统一、进军国境之外以前，我们必须在新领土上建立起稳定的秩序。\n\n这片新并入的土地上存在着诸多问题，因此，我们必须召开一次特别苏维埃大会，以全面解决因国家版图扩张而产生的种种新问题。"
 berez_belozerski.33.t:0 "新疆域——新问题"
 berez_belozerski.33.d:0 "按照惯例，苏维埃代表大会应每季度召开一次。但这一次情况特殊——卡津别克宣布将在近期召开一次非常代表大会，原因是国家领土扩张至西伯利亚。这片广袤的土地，不仅蕴藏着无尽的财富，也潜藏着各种各样的“顽疾”。\n\n代表大会如期召开。与会代表中，既有参加过第一次代表大会的元老，也有代表着新解放地区的成员——这些地区刚刚建立政权，还没有来得及选出正式代表。\n\n“先生们，同志们，同胞们！”卡津别克以一如既往的慷慨激昂开始了他的演讲。“我们最近取得了前所未有的成就！我国成功进军西伯利亚！”话音刚落，全场爆发出雷鸣般的掌声和欢呼声，经久不息。“乌拉！”的口号声响彻云霄。大约一分钟后，掌声渐渐平息，总理接着说道：“我们离在同一面旗帜下统一俄罗斯的目标又近了一步！我们的人民比任何时候都渴望祖国的统一，我们已经向全世界证明，我们有能力做到这一点！”热烈的掌声再次响起，但这一次的规模明显小于第一次。当会场再次安静下来时，卡津别克向大家说明了召开这次非常代表大会的原因。\n\n“但是，现在还不是停下脚步的时候。如今，我们的领土已经跨越乌拉尔山脉，一直延伸到西西伯利亚的边界。这些新解放的土地上，还有很多问题亟待解决。战争已经结束，我们需要让西西伯利亚融入我们的国家——确保新地区的秩序，为经济发展创造条件，并巩固青年俄罗斯联盟的领导地位。”卡津别克顿了顿，目光扫过每一位与会代表，“我们必须制定行动纲领，立即着手解决这些问题，并将计划付诸行动！”代表大会随即进入紧张的工作阶段。会议结束时，一份旨在解决西西伯利亚问题的行动纲领新鲜出炉。这份纲领的内容，其重要性丝毫不亚于第一次苏维埃代表大会上通过的首份行动纲领。现在，计划已经制定，接下来就是执行。"
 berez_belozerski.33.a:0 "我们将帮助俄罗斯人民实现统一。"
 MAR_siberian_expanse:0 "西伯利亚的广袤空间"
 MAR_siberian_expanse_desc:0 "随着新领土并入我国，更新地图并将当地行政机构纳入我们的体系的需求变得迫在眉睫。在西伯利亚地区，已经成立并确立了第一批苏维埃，它们将在大会上代表各自地区的利益。很快，一旦我们印制了足够数量的地图，这些举措将使西西伯利亚的居民逐步认同自己，从而认可我们是统一俄罗斯的一部分。"
 MAR_omsk_problem:0 "鄂木斯克问题"
 MAR_omsk_problem_desc:0 "曾经盘踞在西西伯利亚的黑色联盟，其势力已经深深地扎根于我们如今拥有的土地上。即使黑色联盟的“树干”已经被我们砍断，但它的根系依然存在，并且在西西伯利亚的土地上越扎越深。亚佐夫的士兵们狂热地忠诚于他们对德国进行“大审判”的理念，他们愿意为了这个或许崇高、但却无比可怕的目标牺牲自己的生命。我们必须承认，黑色联盟体现了一种崇高的愿望，而这种愿望，也正是我们在未来将要集中精力实现的目标——将祖国从纳粹的魔爪中解放出来，并让他们无论如何都要付出代价。然而，他们的方法和追求的规模与我们年轻俄罗斯人存在着矛盾。此外，他们永远不会与非黑色联盟成员谈判，因此对我们构成了严重的威胁——而我们，将不得不与之战斗。"
 berez_belozerski.34.t:0 "黑色联盟的窘境"
 berez_belozerski.34.d:0 "在黑色联盟战败后，实力最为强大的队伍是由拉扎连科领导的。他的队伍只是黑色联盟众多残部之一。拉扎连科的部队驻扎在曾经黑色联盟的中心地带附近，但为了躲避与敌人的正面冲突，他们被迫转移到那些至少还有些许森林的地方。\n\n亚历山大·拉扎连科尽管身经百战，但他麾下的队伍却是一支看似强大实则破败不堪的乌合之众，其中一半士兵甚至衣衫褴褛。拉扎连科努力改善着队伍的后勤，使情况从“无可救药”变成了“略有好转”，然而，许多客观原因决定了这一切不过是杯水车薪。许多人没有黑色联盟的臂章，因为布料都被用来做绷带了；有些人面黄肌瘦，眼窝深陷，还有些人干脆就累倒在地。他们的武器装备也十分堪忧，队伍里各种武器都有，从老旧的PPSh-41冲锋枪到仿制的AK-47突击步枪应有尽有。唯一能将他们与土匪区分开来的，就是他们手里还有一辆T-34-85坦克——这对其他人来说可是个不小的威胁。不过，黑色联盟的士兵身上依然保有一样东西——那就是他们为理想而战的斗志和决绝的信念。\n\n他队伍中的无线电员正试图与其他队伍保持联系，而那些队伍与他们相比，规模更小、也更加弱小。然而，每天与他们保持联系的队伍都在减少，直到联络彻底中断。在黑色联盟的队伍之间，这意味着他们要么失踪了，要么被消灭了，至于是谁干的，那就很难说了，因为最近青年俄罗斯联盟来到了这里——至少在乌拉尔山脉以外流传的传言是这么说的；此外，巴托夫分子那些不成气候的残余也开始活跃起来，不过他们对青年俄罗斯联盟不构成任何威胁。\n\n士兵们一抵达，便开始排成四人一列的队伍，而年轻的军校学员们则站在拉扎连科身后。等所有人都到齐后，拉扎连科开始了他的讲话，为了让自己的讲话听起来既真诚而又充满激情，他已经在脑海里反复斟酌了很久：\n\n“黑色联盟的同志们！我们的侦察兵报告说，一支青年俄罗斯人的军队正朝我们逼近。我们的队伍是所有活着的人中最后的一支了。我们的同志为了祖国，与叛徒战斗到最后一滴血。我们的兄弟姐妹为了让我们的祖国洗刷过去的罪孽而献出了生命！而我们，则是黑色联盟最后的堡垒，是拯救我们伟大祖国的最后希望！”\n\n“我们救赎俄罗斯的理想，活在人民的心中，正是因为有我们，我们的事业才没有消亡。我必须告诉你们，明天对你们所有人来说都将是最重要的一天。明天——我们将迎来一场战斗。或许是最后一场战斗，但对我们子孙后代而言却至关重要。让全俄罗斯都知道我们没有屈服！我们不会向任何人屈服，无论是青年俄罗斯人，还是布尔什维克，还是巴托夫分子！让全俄罗斯都知道我们没有放弃！我们为了孩子、兄弟姐妹、母亲而战，我们为了我们的土地、家园，以及每一个俄罗斯人而战！”\n\n“敌人不会对我们手下留情。那就让他们来吧！我们将用十倍的仇恨来回应我们的敌人！他们将为我们的死付出十倍的代价，我们要么在这里取得胜利，要么自由而不屈地死去！黑色联盟万岁！”\n\n“现在开始工作吧。明天就是决战日！挖好战壕，它们将成为你们的堡垒，或是你们的坟墓…” 拉扎连科最后说道。"
 berez_belozerski.34.a:0 "胜利或死亡！"
 MAR_army_integration:0 "收编军队"
 MAR_army_integration_desc:0 "西西伯利亚战役结束后，许多敌军士兵投降，这并不是因为他们的伪政府选择了投降，而是因为他们仍然认同自己是俄罗斯人。他们只是不愿意继续向自己的同胞开枪，他们明白这样做不会有任何好处。而那些与我们战斗到最后一刻的人，显然也是宝贵的人才，他们对我们的军队来说将会是重要的补充。如果我们将那些在战斗结束后投降的人和那些负隅顽抗到最后一刻的人编入我们的武装力量，我们的军队只会因此变得更加强大——这些人将有机会在沙皇将军麾下效力。"
 MAR_greatest_man: "造就了我们的那个人"
 MAR_greatest_man_desc: "就像历史上的许多人物一样，列宁的名字极具争议性。无论如何评价他，我们的人民对他都怀有爱恨交加的复杂感情，即便根据我们的宣传口径，他是一个背叛者，是俄罗斯帝国的刽子手。然而，如果没有列宁，我们的人民也难以想象他们的生活将会如何。弗拉基米尔·伊里奇对俄罗斯乃至世界历史的贡献，无论怎样强调都不为过。\n\n人们可以长篇累牍地去假设，如果没有他，历史将会走向何方。或许，历史会沿着一条截然不同的道路前进，然而，我们眼下还有更为紧迫的问题。"
 berez_belozerski.35.t:0 "巡视秋明"
 berez_belozerski.35.d:0 "结束连日来的疲惫工作后，别洛泽尔斯基决定去相对较晚并入帝国版图的新领土走走。他带上卫兵，前往西西伯利亚最大的城市之一——秋明。这片土地如今属于他，他理应亲眼见证它。\n\n他一直对秋明的建筑风格很感兴趣。据他所知，秋明曾是卡冈诺维奇的治所，而这位社会主义者曾在尼古拉·布哈林与约瑟夫·斯大林的权力斗争中支持了后者。如果当年斯大林实力更胜一筹，击败了布哈林，历史将走向何方？凝视着秋明城内那些宏伟的建筑，别洛泽尔斯基的思绪飘向了远方。他无法想象，如果斯大林成为那个庞大苏维埃国家的领导人，将会带来怎样的后果。或许，俄罗斯人民的命运会比布哈林时期更加悲惨；也或许，历史会像我们所处的现实一样，没有丝毫改变。如果在那个平行世界里，俄罗斯人民最终战胜了纳粹，那又会是怎样一番景象？他不敢再想下去，这种想法太过可怕，甚至冲淡了眼前宏伟建筑带来的震撼。幸运的是，或者说不幸的是，命运女神做出了截然不同的安排。秋明城内，一座座在纳粹的炮火下依然屹立的建筑，无不彰显着俄罗斯人民的骄傲。即使是别洛泽尔斯基的首府，高楼大厦也算得上是奢侈品，更不用说其他的边远省份了。然而，所有这些建筑在看似平平无奇的列宁墓前都显得黯然失色。这座建筑在周围环境中格外引人注目，因为它里面安放着列宁的遗体——那个亲手缔造了革命，为俄罗斯奠定未来的人。想到这里，别洛泽尔斯基脑海中关于斯大林和布哈林的思绪逐渐被弗拉基米尔·伊里奇所取代。他甚至带着一丝玩世不恭的语气自言自语道，如果不是这个人，这一切都不会发生。如果不是他和他的政党，就不会有六十年代的自己，不会有从废墟中崛起的伟大的俄罗斯。如果没有他，就不会有斯大林，不会有布哈林，也不会有卫国战争，不会有西俄罗斯战争，更不会有青年俄罗斯梦想在俄罗斯的胜利。一切都会化为乌有。他注视着工人们缓缓拆除列宁墓。人们决定将它拆除，在原址建造新的房屋，而列宁的遗体则会被安葬，以告慰他的灵魂。别洛泽尔斯基没有阻止这一切，他驱车继续在秋明城中巡视着。"
 berez_belozerski.35.a:0 "如果我们的时间线并非真实呢？"
 MAR_meeting_with_dragunov:0 "会见德拉古诺夫"
 MAR_meeting_with_dragunov_desc:0 "德拉古诺夫，兹拉托乌斯特的领袖，和他的同志卡拉什尼科夫，在军阀混战和伪国家林立的时期采取了一种对自己极其有利的策略。他利用那些伪领袖们对进一步掠夺俄罗斯的贪婪欲望，向他们所有人出售自己的军工产品，从传奇的AK-47，到火炮，应有尽有。我们不得不承认，他们生产的自动武器是全俄罗斯最优秀的武器之一，因为每一个有头有脸的军阀都必须拥有来自兹拉托乌斯特的武器来对付他们的敌人，这意味着他们精湛的技艺获得了全俄罗斯的公认。\n\n这个人，还有他的团队，现在落到了沙皇联盟的境内，而我们必须利用他们的技能，让他们继续开发武器，只不过这一次是为了我们的军队。我们的国家只会从中受益，而德拉古诺夫和他的人将获得安居乐业的机会。"
 berez_belozerski.36.t:0 "沙皇与制造大鳄"
 berez_belozerski.36.d:0 "一想到德拉贡诺夫的团队，别洛泽尔斯基就五味杂陈。一方面，他钦佩叶夫根尼·费奥多罗维奇和他的团队。在那样一个艰难的处境下，他们居然能在兹拉托乌斯特找到一席之地，并以军火贸易为基础建立起一番事业。也只有这样，他们才能在卫国战争失败后的经济崩溃和无政府状态中生存下来。\n\n但另一方面，他也无法将他们称为“时代的英雄”。诚然，他们的才华不可否认，但这些技能被用来做了什么呢？他们生产的武器，最终落入了那些自封为王的俄罗斯人之手，让他们自相残杀。如果说他们有什么罪过，那就是他们助长了对俄罗斯的掠夺。\n\n或许，“身不由己的恶棍”是对他们最贴切的定义。他们并非自愿选择这样的命运，而是生活所迫，为了生存下去，他们只能像千百万俄罗斯人那样，尽其所能地挣扎求存。然而，时代变了，德拉贡诺夫团队迎来了更有利的时机。我们希望邀请他们加入我们的设计局，为我们贡献力量。\n别洛泽尔斯基亲自致电德拉贡诺夫，邀请他来设计局工作。他承诺，会为他们提供一切必要的条件，让他们能够安心工作，并最大限度地发挥才能。德拉贡诺夫没有多说什么便答应下来，并对沙皇的邀请表示感谢。对他和许多人来说，这份工作不仅仅是唯一的生计来源，更是一种兴趣和爱好，他又怎会拒绝沙皇本人的邀请呢？"
 berez_belozerski.36.a:0 "找到你热爱的工作，你就不会在你的生命中度过任何一天工作日。"
 MAR_wealth_of_zlatoust:0 "兹拉托乌斯特的宝藏"
 MAR_wealth_of_zlatoust_desc:0 "根据某些情报显示，该地区藏有大量在混乱时期生产的武器。军阀强盗们曾花费巨资从兹拉托乌斯特购买高品质的武器，他们甚至没有想过，这些武器制造商自己的仓库里就堆满了优质武器。利用这些仓库，可以武装起一支实力堪比甚至超越我们的强大军队，甚至有可能统一整个俄罗斯。\n如果数据准确无误，那么这些仓库现在仍完好无损，因此，我们必须立即打开它们，将兹拉托乌斯特的所有宝藏据为己有。"
 MAR_trip_to_washington:0 "华盛顿之行"
 MAR_trip_to_washington_desc:0 "别洛泽尔斯基亲赴美国的经验被证明在效率方面大有裨益。相对而言还算新成立的外交司已经成功地与OFN国家建立了初步联系。然而，我们为加强与西方的关系而付出的外交努力不应减弱，因为我们需要它们，就像它们需要我们一样。\n\n为了更有效地拓展外交关系，我们必须再次付出新的努力，为此，别洛泽尔斯基需要再次飞往华盛顿。"
 berez_belozerski.37.t:0 "商业协定"
 berez_belozerski.37.d:0 "在签署了由别洛泽尔斯基本人提出的一系列主要协议后，他决定再次前往华盛顿，商讨在不久的将来可能达成的其他协议。现在是时候加强与自由国家组织成员国的贸易往来，并与西方国家建立更紧密的联系了，这将为我们带来更多有利条件。\n跨越大西洋，再次踏上美利坚的土地，别洛泽尔斯基又一次来到了白宫。他在这里受到了热烈的欢迎。简短地与总统寒暄后，他便开门见山地谈起了正事。别洛泽尔斯基向总统提议签署新的贸易协定，以扩大与美国以及自由国家组织成员国的贸易往来。他表示，由于青年俄罗斯人已经控制了拥有丰富自然资源的新领土，俄罗斯现在可以提供更多的资源。此外，他还提议进一步增加对沙皇联盟的必需品供应。美国总统对此表示赞同，并同意签署这些协议。接着，别洛泽尔斯基提议自由国家组织与沙皇联盟签署互不侵犯条约。从外交辞令的角度来看，这项条约意义重大。这意味着，签署国之间同意通过和平方式解决所有争端。事实上，这对别洛泽尔斯基而言，是一项极具远见的举措。未来，如果一切顺利，俄罗斯将能够毫无顾忌地提出对东欧的要求，而不必担心美国会因此与我们兵戎相见。\n\n然而，美国总统并没有立即接受这项提议。他深知其中的利害关系，在经过一番深思熟虑后，最终还是决定与沙皇联盟签署这份互不侵犯条约。别洛泽尔斯基只能猜测，美国总统在那一刻究竟想了些什么。难道美国人对我们并不是真心实意的吗？管他呢，至少条约已经签署，这就是成功的标志。\n\n完成这一切后，别洛泽尔斯基返回俄罗斯，继续处理政务。"
 berez_belozerski.37.a:0 "我们心中依然怀揣着些许疑虑…"
 MAR_arctic_development:0 "开发北极"
 MAR_arctic_development_desc:0 "我国北部地区，即所谓的北极地区，蕴藏着丰富的自然资源。已探明的资源储量足以满足我国国内生产的需求。然而，由于交通不便，我们根本无法获取这些资源。与开发西伯利亚一样，我们也必须开始开发北极地区，并为其利用和开发做好准备。\n\n我们必须将道路延伸至人迹罕至的边疆，此外，还要在那里建设基础设施，让愿意为我们开发北极地区的勇士们在那里安家落户，建立新的城市。他们将获得所需要的一切，以换取能为俄罗斯带来繁荣的辛勤劳动。"
 MAR_gifts_of_nature:0 "大自然的馈赠"
 MAR_gifts_of_nature_desc:0 "在北极地区建立起新的基础设施后，我们可以着手开始开发当地资源的实际步骤。在那里工作的人们，已经迫不及待地想要收到第一批工具和材料，用于开采石油、铁、天然气和其他资源。北极英雄们将作为敢于前往北方、帮助俄罗斯复兴的劳动者，而被人民永远铭记。\n\n此外，我们掌握着新的资源开采技术，我们应该将其应用于西西伯利亚的其他地区，以增加这些地区的矿产开采量。当我们完成这一切后，大自然将以其丰厚的馈赠回报我们付出的辛劳和坚持。"
 MAR_united_russia:0 "奔向统一的俄罗斯"
 MAR_united_russia_desc:0 "俄罗斯，宛如昔日再现，又一次从屈辱中奋起。往昔的先贤们，例如伊凡三世“大帝”，将俄罗斯从鞑靼人的桎梏下解放。诚然，在伟人的领导下，俄罗斯在那一刻变得强大。但同样不容忽视的是，也正是伟大俄罗斯人民的奋斗，才成就了这一切。\n\n一切都像历史的重演，自西俄战事结束直至今日，我们所走过的道路，足以成为民族复兴的序章。我们的沙皇将军谢尔盖·别洛泽尔斯基为了让俄罗斯能够重新昂首挺胸，呕心沥血，付出了巨大的努力。我们的人民与他们最称职的领袖，一同走过了这段艰难却又同样伟大的道路，为了寻回我们在1917年之后失去的福祉、团结与安全。倘若没有沙皇，没有人民，没有推动着俄罗斯前行的统一目标，这一切都将无从谈起。\n\n不久的将来，全俄罗斯必将统一。人民不愿再生活于分裂的旗帜之下，因此，我们必须赢得这场为了统一俄罗斯的战斗。无论是和平还是流血，我们终将统一这个民族，这已是既成事实，剩下的仅仅是方式和时间的问题。\n\n因此，奔向统一的俄罗斯！"
 berez_belozerski.38.t:0 "对过去的追忆"
 berez_belozerski.38.d:0 "“我还记得，过去的生活是多么简单。我只需要服从父母、老师、长官，以及那个什么‘碉堡’的命令，做好自己的工作就行了。那时候责任更轻，良心上的负担也更少——只需要埋头苦干，听从上级的指示。他们让我离开队伍，向左转，走到军官面前听候命令；他们下令进攻红军，我只需要服从命令，亲自检查部队的作战能力，然后向上级汇报；卡津别克下令让我写一份关于别列兹尼基防御能力的报告，我同样把命令传达给下属，然后等待结果，同时整理好自己的统计数据，交给朋友。\n\n而现在，我成了一国之君，爬上了权力的顶峰。我不再需要事无巨细地监督我的秘书们，只需要给他们指明方向。我只需要下达命令或指示，让他们去做这做那，但我的责任却比以往任何时候都重。没有人站在我身后，监督我的工作。一切都落在了我的肩上，也没有人能够评价我的功绩，现在，我只能自己评价自己。\n\n至少以前的生活更轻松一些——我完成作业，然后得到一个分数，不是5分就是2分。如果得了2分，那就说明我需要更加努力；如果得了5分，那就万事大吉。比起现在，那时的日子真是太轻松了。现在，我每天都要面对一大堆数字，多得让我头昏脑胀。\n\n我无法想象布哈林、尼古拉二世这些统治着庞大帝国的领导人，他们是如何处理这一切的。他们无法立刻判断自己是对是错，也没有人可以给他们指示，告诉他们该怎么做。也许，正是这一点决定了我们的未来，而他们的努力，只有等到后世之人才能评判。\n\n历史会如何评价我？我的理智告诉我，我做出了正确的选择。我遇到过困难，经历过失败，但最终取得了成功。谁会认可这一切呢？我的头上不再有所谓的“上级”，只有那些生活在遥远未来的人们，才能真正理解我的努力。\n\n未来终将到来。我没有权利放弃我的职责，我会坚持到最后一刻。我必须继续努力工作，因为现在正是至关重要的时刻。”"
 berez_belozerski.38.a:0 "我们只能梦想着和平。"
 berez_belozerski.39.t:0 "黑色联盟的末路"
 berez_belozerski.39.d:0 "为了抵御青年俄罗斯联盟的进攻，黑色联盟的士兵们彻夜未眠，一直在构筑防御工事。他们挖好了战壕，准备好了预备阵地，以备不时之需。黑色联盟的最后一道防线距离额尔齐斯河畔不远，那里是他们的指挥部。那些尚未毕业的军校学员们严格按照教材上的内容进行操作，同时还建造了自己的暗堡，准备给敌人一个出其不意的打击。那辆T-34-85坦克占据了有利地形，可以从容地进行射击——他们不能贸然将其投入战斗，因为它的装甲不足以对抗敌人的其他坦克。\n\n透过望远镜，他们发现了青年俄罗斯的身影。他们知道自己面对的是最难对付的敌人，所以他们没有采取游击战术，而是像正规军那样发起了进攻。学员们惊讶地发现，沙皇将军的部队进攻得如此有条不紊。炮弹的呼啸声在森林中响起，学员们的惊讶顿时变成了惊恐。密集的炮火倾泻在守军的阵地上，第一道防线的士兵伤亡惨重，被迫撤退。青年俄罗斯联盟的军队冲入森林，势如破竹，摧毁了所有仍在抵抗的部队。这是一场残酷的森林争夺战，黑色联盟的士兵们将他们的愤怒和仇恨，全部倾泻在了敌人身上。只有意志坚定的人，才能在这场战斗中活下来。但无论如何，青年俄罗斯联盟最终还是突破了敌人的防线。只有少数意志崩溃的士兵选择了投降，向沙皇联盟的军队祈求怜悯。占据有利地形的T-34-85坦克终于开始展现出全部的火力。它接连摧毁了敌人的几辆轻型车辆，正准备转移阵地时，一枚RPG-7火箭弹击中了它的炮塔。炮弹引爆了坦克内部为数不多的弹药，进而引爆了油箱，整辆坦克瞬间变成了熊熊燃烧的火球。坦克兵们被活活烧死，痛苦的哀嚎声响彻天际。伪装用的树枝和灌木丛也被火焰吞噬，大火迅速蔓延，点燃了周围的树木，引发了一场森林火灾。与此同时，青年俄罗斯联盟的军队正在步步逼近黑色联盟的指挥部。拉扎连科和最后剩下的士兵们准备进行最后的抵抗。被火烧死，对黑色联盟来说是最屈辱的死法，因此，他们决定孤注一掷，对青年俄罗斯联盟发起反冲锋。\n\n拉扎连科和他的士兵们高举着黑色联盟的旗帜，发出震耳欲聋的“乌拉！”声，义无反顾地冲向了人数远超他们的敌人。他们用手里的机枪、刺刀、工兵铲与敌人展开殊死搏斗。旗手手中的战旗被森林大火点燃，火焰顺着旗杆迅速向上蔓延。在随后的战斗中，这名旗手倒在了冲锋的路上，那面已经被烧毁了一半的战旗也随之飘落在地。这对黑色联盟来说，是一个悲伤的结局。\n\n拉扎连科和他的士兵们在战斗中展现出了非凡的勇气和决心，他们战斗到了最后一刻，无一人生还。他们的英勇事迹值得被所有人铭记，他们也应该得到应有的荣誉，被安葬在英雄的墓地里。"
 berez_belozerski.39.a:0 "这是一个令人悲伤的结局，但为了我们所有人的福祉，这一切都是必要的牺牲。"
 MAR_project_grozny:0 "“雷霆”计划"
 MAR_project_grozny_desc:0 "一个国家能否跻身“超级大国”行列，最重要的标准之一就是其是否拥有核武器。只有那些能够制造和使用核武器的国家，才算得上拥有真正的话语权。目前，世界上至少有三个这样的国家：美国、纳粹德国和日本帝国。\n\n显然，俄罗斯拥有发展核武器并加以利用的潜力。我们伟大的祖国拥有许多高水平的科学家，他们有能力研发和设计核武器。此外，众所周知，广袤无垠的国土上蕴藏着丰富的铀矿，这将对我们的核计划大有裨益。基于这一切，我们所需要的只是启动“雷霆”计划的政治决心。"
 berez_nuke_belo.1.t:0 "可怕的力量"
 berez_nuke_belo.1.d:0 "毫无疑问，幅员辽阔、在国际上举足轻重的俄罗斯不能坐以待毙。尽管我们拥有广袤的领土，但在超级大国面前依然不堪一击，无论我们多么努力，都无法改变这一点。我们没有核武器，一旦敌人将这种可怕的武器投放到我们的土地上，我们所有的努力都将化为乌有。考虑到我们没有能力对这种胆大妄为的攻击进行报复，敌人就更有可能对我们使用核武器。俄罗斯需要核武器。我们将成为新的超级大国，在世界舞台上占据属于自己的一席之地。但从构想到实现我们的雄心壮志，我们还有很长的路要走。别洛泽尔斯基将弗拉基米尔·吉尔召进了办公室：\n\n“弗拉基米尔，我需要你担负起一项非常重要的任务。” 别洛泽尔斯基开门见山地说道。\n\n“是什么任务？”\n“我国需要核武器。我已经指示科学家们着手准备研制核武器，但我需要一位项目负责人。我认为你是所有人中最合适的人选，由你来负责‘格罗兹尼’计划——为了纪念伊凡雷帝而制定的计划，你明白我的意思吧。你要定期向我汇报项目的进展，并领导项目组的所有成员。”\n弗拉基米尔·吉尔思索了片刻，回答道：\n\n“我明白了。我会负责这个项目。请您放心，俄罗斯需要核武器。我们的敌人环伺左右，一旦爆发战争，即使是美国人也救不了我们。我们需要尽快拥有这种武器。”"
 berez_nuke_belo.1.a:0 "炸弹之王将保卫祖国！"
 MAR_nuclear_department:0 "核技术部"
 MAR_nuclear_department_desc:0 "显而易见，为了发展和平及军事用途的核技术，我们需要建立一个新的部门，专门负责核技术的研究。我们将邀请全国所有著名的核物理学家加入这个新部门，他们将为我们开发这种终极武器。\n\n我们将为核技术部提供我们的科学家所需的一切，以帮助他们成功地开发新技术。一切他们研究所需，我们将优先提供，尤其是提供最好的。毕竟，这关乎整个国家的命运。"
 MAR_attract_foreign_specialists:0 "延揽国外专家"
 MAR_attract_foreign_specialists_desc:0 "我国拥有自己的、经验相当丰富的核物理学理论科学家。然而，如果我们想加快“雷霆”项目的进度，我们就需要吸引更多的科学家，因为我国在这方面存在着严重的人才短缺。\n\n加快项目进度的主要途径，是吸引外国专家到我国来。最重要的是聘用他们，首先我们应当吸引来自美国和整个OFN的核物理学家，将他们视为我们最主要的盟友。我们认为，让俄罗斯——一个已然相当亲密的盟友——变得更加强大，以便能够在未来协助击败纳粹德国，但同时自身又不会被核武器化为灰烬，这符合他们的利益。"
 MAR_uranium_problem:0 "铀矿难题"
 MAR_uranium_problem_desc:0 "在俄罗斯境内，已知存在着铀矿床，然而这些铀矿在我们的国土上还从未得到过开发利用。多年的停滞和国家解体造成了这种状况，这是一个令人相当痛心的事实。尽管如此，目前我们已经积蓄了足够的力量，可以开始在我们推测有铀矿的地区进行开采。\n\n为了获取足量的铀，我们不仅要为我们的采矿队配备最安全、最先进的设备，还必须开始寻找全新的铀矿来源。最终，我们将能够提高铀的总产量，以满足制造核装药的需求。"
 MAR_gift_from_usa:0 "来自美国的礼物"
 MAR_gift_from_usa_desc:0 "即便我们采取了一切措施来加速核技术的发展，但这些还远远不够。显然，迟早我们会依靠自身的力量开发出这些技术，然而俄罗斯迫切需要这些技术，或许就是现在。\n\n我们必须与超级大国之一的美国政府达成协议，让他们向我们提供所有必要的核技术图纸——核弹的构造、核反应堆的设计等等。当然，美国人或许不会轻易将这些图纸交给我们，但最终结果很可能是利大于弊……"
 berez_nuke_belo.2.t:0 "蓝图"
 berez_nuke_belo.2.d:0 "一位头戴黑色礼帽的重要人物的到来，让科学家们大吃一惊。部门主管走上前去与他交谈，却意外地得知他们已经得到了图纸，而且不是普通的图纸，而是各种核技术的图纸！\n\n主管看着这些图纸，惊讶得说不出话来。他不敢相信这些图纸真的到了他们手里，更不用说这些图纸正是他们梦寐以求的，它们详细地阐述了核技术的设计原理。“这些图纸是哪来的？” 主管问道，“你偷来的？”“不，我们费尽心思，好不容易才说服了美国人，让他们把图纸交给我们。而且这还不是全部，只是一小部分，因为他们说，‘剩下的你们自己想办法’。”“你觉得他们为什么要这么做？” 主管又问道。“我想他们另有目的。他们知道俄罗斯迟早会拥有核武器。我有一种预感，将来我们和美国人之间会发生冲突，到那时，他们就会为今天的决定后悔一千次。但也许，他们只是在下一盘更大的棋…”\n\n“你觉得这些图纸是真的吗？” 主管问出了一个更重要的问题。\n\n“说实话，我自己也不确定。根据我们那些‘盟友’的说法，这些图纸是真的。但实际上，我不知道。不过，先研究一下吧，我想总会有用的。”"
 berez_nuke_belo.2.a:0 "俄罗斯距离安全又近了一步，至少现在看来是这样。"
 MAR_kurgan_deposits:0 "库尔干矿藏"
 MAR_kurgan_deposits_desc:0 "在西西伯利亚地区存在着一些理论上可能蕴藏铀矿的矿井。这些信息的依据是，根据早期对这些地方的描述，矿工们在这些矿井工作后会大量死亡。然而，如果真是如此，那么我们必须重新启动那里的铀矿开采，这将使我们能够将核项目扩大到可以接受的规模。\n\n归根结底，我们需要任何铀矿石，哪怕是从地缝里抠出来都行，只要能获得足够的矿石来提炼铀！"
 MAR_handmade_sun:0 "人造太阳"
 MAR_handmade_sun_desc:0 "无论如何，我们已经为我国核工业——无论是军事用途还是民用用途——的蓬勃发展奠定了坚实的基础。核武器的研发速度堪称惊人，甚至超出了我们最为乐观的预期。最终，我们将制造出核武器，并成为全球新的、第四个超级大国，即便是我们最不共戴天的仇敌也必须对我们刮目相看。即便是我们的盟友，美国，也必须重视我们的存在。\n\n世界正在发生着剧变，而俄罗斯将成为率先步入崭新、光明未来的国家之一，在这个未来中，俄罗斯将占据着重要的地位。但距离那个伟大的时刻，我们还有很长的路要走，但任何征途都是从迈出第一步开始的。"
 berez_nuke_belo.3.t:0 "视察"
 berez_nuke_belo.3.d:0 "“格罗兹尼”计划的负责人弗拉基米尔·吉尔来到核技术部门，亲眼看看这项事业的进展情况。他看到研究人员们正埋头苦干，自然不好打扰他们。只是，这些穿着白大褂的学者们，总是不由自主地注意到这个身穿军装的陌生人。每次，吉尔都会提醒他们不要分心，继续工作。只是，也许很少有人知道，究竟是什么样的大人物来到了他们的部门。\n\n吉尔和他的秘书找到部门主管，开始询问工作进展。一开始，只是一些例行公事，比如询问工作进度、遇到的困难等等。随后，他开始询问一些更具体的问题。总的来说，得到的答案令人鼓舞：只要资金持续投入“格罗兹尼”计划，项目就能以创纪录的速度推进，也许俄罗斯很快就能拥有核武器。但是，一旦资金链断裂，项目进度就会放缓，武器的研制也会比我们预期的要晚得多。除此之外，没有遇到什么重大难题，只是需要更多的科研人员加入项目组。部门主管还提到，国家已经提供了最先进的仪器设备，可以进行精确的计算，这对项目的推进很有帮助。吉尔将这一切都记在心里，他的秘书也详细记录了所有问答，以便日后向上汇报。他确信，“格罗兹尼”计划的第一阶段已经接近尾声，只需要几周时间，就可以正式进入下一阶段。"
 berez_nuke_belo.3.a:0 "我们会让他们刮目相看的！"
 MAR_return_to_steppe:0 "重返草原"
 MAR_return_to_steppe_desc:0 "从中亚的资源价值来看，它对俄罗斯而言，并没有那么地具有决定性价值。诚然，那里有石油和其他一些珍贵的资源，然而对于富饶的俄罗斯来说，这无非是沧海一粟。然而，中亚的价值首先在于其地缘政治位置——这简直就是我们门户洞开的南翼，敌人可以由此轻易地向我国腹地发动攻势。\n\n因此，为了保卫我们的国家，除了征服中亚之外，我们别无选择。对俄罗斯来说，这是最为稳妥的方案，因为在那里建立傀儡政权可能比直接的军事入侵风险更大。然而，首先我们必须征服我们的南方邻国——哈萨克斯坦。从那里我们可以向西伯利亚方向行动，也可以向南行动，以进一步向中亚进军。"
 MAR_kazakh_branch:0 "哈萨克党支部"
 MAR_kazakh_branch_desc:0 "征服哈萨克斯坦之后，现在有必要发展那里的基础设施——修复现有的设施，并从无到有地建设其余的物流，以便该地区至少能在良好的条件下发展。然而，在我们开始着手这项工作之前，我们必须确保当地民众的忠诚，使他们不至于反抗我们，更不能让我们平添许多麻烦。\n\n在哈萨克斯坦发展我们自己的党组织，这同样至关重要，因为这实际上就是我们的权力机关。如果我们在没有建立稳固政权的情况下就开始重建该地区，我们将一无所获，因此我们需要在哈萨克斯坦建立青年俄罗斯联盟支部，成员应同时包括哈萨克人和俄语人口。"
 berez_kazahk.1.t:0 "净土之上"
 berez_kazahk.1.d:0 "亚历山大·卡津别克是一位出色的组织者。许多事实都能印证这一点，而青年俄罗斯联盟组织工作的开展便是最有力的证明。事实上，正是他一手组织了该党，乃至后来整个国家的所有工作。虽然他现在只是首相，但此人对党的意义不可估量。没有他，就不会有青年俄罗斯联盟。谢尔盖·别洛泽尔斯基深知卡津别克是一位娴熟的组织者，他也清楚地明白，卡津别克的才能仍有用武之地。而他现在比以往任何时候都更需要他，因为就在几周前，哈萨克斯坦加入了沙皇联盟，他需要在那里建立起青年俄罗斯联盟的势力。为此，他打算让亚历山大从零开始组织一切，以确保万无一失。为什么选择这种方式？因为现在的哈萨克斯坦没有正常的公民和党派力量，只有军事占领，这意味着必须从头开始在那里建立权力。在一块净土之上，就像哈萨克斯坦的草原一样。别洛泽尔斯基将这项任务交给了卡津别克，后者却并没有表现出多大的热情。接受这样的任务意味着，亚历山大将不得不做他在青年俄罗斯党成立之初所做的事情——白手起家，重建党组织。此外，他还不得不离开首都，直接前往哈萨克斯坦，也许是帕夫洛达尔，那个最发达的城市，以便更有效地完成分配给他的任务。不过，他并没有感到太沮丧，因为他的副手将暂时接替他的工作。于是，卡津别克动身前往哈萨克斯坦，去开拓那片尚未经开垦的党务“处女地”。他必须找到支持者，传播意识形态，发展新成员，从零开始组建委员会…"
 berez_kazahk.1.a:0 "一切都将从头再来，如同往昔。"
 MAR_polish_legion:0 "波兰军团"
 MAR_polish_legion_desc:0 "但不幸的是，对波兰人而言，他们沦落至此恰恰是拜德国人的政策所赐，是这些侵略者迫使他们背井离乡，踏上了漫漫的流亡之路。然而，从另一个角度来看，哈萨克斯坦的波兰人对我们来说，也可能是命运馈赠的一份厚礼，在未来尤其是如此。这些远离故土的人们，有的也许会把哈萨克斯坦当成自己新的家园；有的则可能为了解放他们世代生活的故土，而选择投身于我们对抗纳粹的战斗中。无论哪种选择，卡津别克都能为他们找到合适的用武之地，我们不会同他们产生一些毫无意义的冲突。"
 berez_kazahk.2.t:0 "俄国军队中的波兰战士"
 berez_kazahk.2.d:0 "一支由波兰裔士兵组成的营级部队进行着一场非同寻常的宣誓仪式。他们不仅向俄罗斯军队宣誓效忠，更庄严地向波兰人民立下誓言，必将为从纳粹德国手中解放祖国而战。这是卡津别克亲自向他们发出的邀请。这位新近抵达哈萨克斯坦的政要，在意识到这支部队的存在后，决定将其收归麾下。他知道，对于痛恨纳粹的波兰人而言，这无疑是一个求之不得的机会。\n士兵们高举右拳，用波兰语齐声宣读着誓词：\n\n“我，面对饱经磨难的波兰土地与人民，庄严宣誓，将与德国侵略者战斗到底，解放祖国，并加强与俄罗斯人民的友好关系。我宣誓忠实而尽职地履行俄罗斯沙皇军波兰军团士兵的职责，忠实执行交给我的命令，并严格遵守军事机密。我宣誓忠实履行沙皇联盟赋予的盟友义务，决不玷污我的同胞之名。我宣誓成为沙皇联盟和波兰人民最高当局的忠实盟友。我宣誓坚定不移地保卫自由的波兰公民，并帮助俄罗斯人民战胜德国法西斯分子。愿上帝助我！”"
 berez_kazahk.2.a:0 "军团的命运是艰难的，一、二、三！"
 MAR_modernize_steppe:0 "现代化草原"
 MAR_modernize_steppe_desc:0 "如今，在哈萨克斯坦建立起一定程度的统治之后，我们终于有理由向这个国家进行投资了。哈萨克斯坦最主要的问题之一，就是严重缺乏各种社会基础设施——发电站、医院、学校等等。这片广袤的草原上几乎找不到这些设施的踪迹，这也使得这一地区沦为了沙皇联邦中最落后的地区之一。因此，我们必须想办法让该地区能够像我国的其他地区那样飞速发展。\n\n阿列克谢·柯西金可以制定出一套方案，从零开始，以相对较快的速度推动该地区的现代化发展。尽管他本人也承认，这需要耗费相当长的一段时间，并且根据他的估计，在哈萨克斯坦的土地上建设任何设施都将面临极大的困难，因此这可能需要我们投入一笔天文数字般的资金。尽管如此，他仍然向我们保证，这些投入终将在未来得到丰厚的回报。"
 berez_kazahk.4.t:0 "哈萨克计划"
 berez_kazahk.4.d:0 "尽管阿列克谢·柯西金无法亲自前往哈萨克斯坦评估局势，但他已经掌握了足够多的报告，足以了解需要采取哪些措施来扭转哈萨克斯坦糟糕的现状，并确保哈萨克斯坦人民能够享受到俄罗斯人所拥有的种种福利。他很快制定了一个行动计划，并精确地计算了每一笔资金的用途。最终，他为这个地区制定了一个相当可行的经济发展计划。\n\n柯西金将这份“哈萨克计划”送到了卡津别克所在的巴甫洛达尔。当卡津别克从头到尾读完这份计划时，他感到有些惊讶。首先，他惊讶于除了党务工作之外，他还要负责其他事务。其次，他对计划中用于哈萨克斯坦的巨额资金感到震惊。虽然这笔资金相当可观，但该计划主要着眼于长期发展，这意味着它要到未来才能产生效益。\n\n尽管心存疑虑，但卡津别克最终还是接受了这份计划，并开始着手实施。他马不停蹄地将这些法令分配给各部门执行，并动用预算资金予以支持。"
 berez_kazahk.4.a:0 "让我们在空旷的地方建起盛开的花园！"
 MAR_kazakh_highways:0 "哈萨克大公路"
 MAR_kazakh_highways_desc:0 "哈萨克斯坦的道路状况只能用一个词来形容——“糟糕透顶”，即便有一些名义上的“道路”存在，它们也往往不过是车辆在草原上反复碾压形成的车辙而已。像样的柏油马路在这个国家极为罕见，只有在像那些由布哈林所兴建的大城市中才有那么一星半点。铁路的情况也同样不容乐观，它们仅仅连接了少数几个最重要的定居点，但甚至这也没法将这些星星点点的定居点都涵盖进来。需要补充说明的是，由于这些道路在修建时往往直接就是靠人踩出来、十分粗制滥造，一到雨天就泥泞不堪，这使我们在进一步发展该地区的计划严重受阻。\n\n因此，我们不仅要发展城市基础设施，还要着力完善道路交通。这能极大地刺激经济增长，因为物流的效率能够得到显著提升。我们必须投资兴建新的、高质量的柏油公路和铁路。这无疑会为该地区的未来发展注入强劲的动力。\n\n除此之外，我们还有必要对现有道路进行翻修升级——重建旧路，修补破损。哪怕仅仅是这样做，也能极大地促进当地的发展，就算单单是没有了路面坑洼这一项，都能使该地区的人民出行的体验更舒适一些。"
 MAR_Belozerskiy_add_2_inf_in_Kazakhstan:0 "所有哈萨克地区的基建等级提升两级"
 MAR_russification_of_records:0 "俄语化公文"
 MAR_russification_of_records_desc:0 "该地区任何行业的公文都与我们在俄罗斯所使用的有着天壤之别。且不说这些公文许多甚至都不是用俄语写就的，更别提这些文件所遵循的各种五花八门的规章制度了。因此，我们必须对该地区进行公文俄语化，让所有的公务活动都切换到俄语轨道上来——不仅要将这些文件从哈萨克语翻译成俄语，而且还要按照俄罗斯的模式来重塑公文的形制。\n\n这将使得哈萨克斯坦能够尽快融入俄罗斯的经济和政治体系之中，从而不仅增强该地区的潜力，还能够极大地增强我们整个国家的实力。"
 berez_kazahk.5.t:0 "俄式标准"
 berez_kazahk.5.d:0 "新的文件书写规范让哈萨克的书记员们感到无所适从。他们拿到的新文件样本与之前使用的截然不同。这些标准看起来既复杂，却又易于上手。有些人为现在只能用俄语书写而感到难堪，还有些人对此感到恐惧，甚至因此辞去了行政工作，因为他们根本不会说俄语。然而，也有一部分人将此视为学习俄语的动力，并在“实战”中迅速掌握了这门语言。尽管困难重重，拼写错误百出，但这些哈萨克人最终还是掌握了基本的俄语书写能力，能够胜任行政工作。其他人则很快便适应了新的工作方式，但他们仍然需要一段时间才能习惯用新表格来填写文件。那些被派往哈萨克斯坦监督行政工作质量的俄罗斯官员，在初期打回了许多需要修改的文件。这些文件的问题五花八门，包括字体、行距、页边距等等。不过最终，哈萨克的书记员们还是承认，新的文件书写标准确实比以前更加便捷实用。在此之前，文件管理仅仅处于一种无序状态，而现在，一切都已井然有序。"
 berez_kazahk.5.a:0 "一个标准，却带来了翻天覆地的变化！"
 MAR_establish_governor_generals:0 "设立总督区"
 MAR_establish_governor_generals_desc:0 "在该地区的最后一项行政改革措施将会是将这片土地划分为几个更小、更灵活、更高效的总督辖区。如果我们仍然维持这个庞大地区为一个整体，那么管理起来将会极为困难。因此，为了避免出现这一问题，我们需要引入总督管理制度，这些总督将会更清楚如何从经济和军事角度来发展他们所管辖的这片区域。\n\n当然，这肯定不能一劳永逸地解决该地区所有的问题。然而，如此一来行政上的压力将得到大大缓解，而中央将能够更加高效地管理各个总督区。"
 MAR_royal_journey:0 "沙皇之旅"
 MAR_royal_journey_desc:0 "在完成了哈萨克斯坦的主要改造工作后，我们终于得以在这片土地上站稳脚跟，构建起初步的基础设施，并且极大地降低了南部侧翼遭受任何势力突袭的风险。人民对我们充满敬意，党组织吸纳了新的成员，我们对哈萨克斯坦的影响力与日俱增。\n\n为了给哈萨克斯坦的事业画上一个圆满的句号，我们还剩下最后一件事要做，这并非绝对的义务，但从声望和法理角度来看，它意义非凡——我们应该安排沙皇谢尔盖·别洛泽尔斯基对这些草原地区进行巡幸，以此为我们所有的这些变革画上点睛之笔，而这一举动也将在国际社会面前进一步昭告天下：哈萨克斯坦现已明确回归俄罗斯的怀抱，成为沙皇联盟不可分割的一部分。"
 berez_kazahk.6.t:0 "从城市到草原"
 berez_kazahk.6.d:0 "“陛下，哈萨克斯坦的发展速度已经达到了俄罗斯平均水平！” 卡津别克总部传来捷报，电话那头的别洛泽尔斯基沙皇听得心花怒放。亚历山大能够亲自向沙皇汇报工作，本身就证明了一切已经步入正轨。在例行汇报的最后，这位尽职尽责的总理大臣提出了一个建议：为了巩固俄罗斯在该地区的统治，并提升沙皇的权威，应该在哈萨克斯坦进行一次巡视，亲眼见证这片曾经荒芜的草原上所取得的成就。\n\n别洛泽尔斯基沙皇欣然同意了这个提议，并表示他会尽快处理完手头的紧急事务，然后动身前往哈萨克斯坦。在等待沙皇到来的日子里，卡津别克紧张地准备着迎接工作。两天后，一切准备就绪，沙皇也通知卡津别克，他将乘坐飞机前往巴甫洛达尔。\n\n在巴甫洛达尔机场，卡津别克早已等候多时，激动地迎接沙皇的到来。自从离开首都前往哈萨克斯坦后，他已经很久没有见过沙皇了。谢尔盖·别洛泽尔斯基提议，与其在机场浪费时间，不如乘坐火车一起前往各个城市，亲眼看看亚历山大的工作成果。卡津别克欣然接受了这一提议。尽管他知道这次行程将会花费很长时间，但他仍然感到高兴。"
 berez_kazahk.6.a:0 "巡视，就从这里开始吧。"
 berez_kazahk.7.t:0 "从草原回到城市"
 berez_kazahk.7.d:0 "别洛泽尔斯基沙皇和卡津别克总理访问了哈萨克斯坦的几个主要城市。除了巴甫洛达尔之外，他们还访问了卡拉干达、阿克莫林斯克、彼得罗巴甫尔、库斯塔奈、阿克托贝、乌拉尔斯克以及其他几个较小的城镇。尽管城市之间的距离遥远，但这次旅程并没有花费太长时间。\n\n在旅途中，沙皇没有遇到任何意外事件，但这次旅行给他留下了五味杂陈的感受。首先，他对铁路的存在以及其良好的运营状况感到满意。其次，在访问各个城市时，他欣喜地看到民众夹道欢迎，虽然算不上万人空巷，但也足以证明他们对沙皇的拥戴。民众感谢他和整个政府为哈萨克斯坦带来了许多现代文明的成果，让这片曾经荒凉的土地焕发了生机。第三，沙皇还视察了当地的行政机构、工厂、娱乐中心以及其他能够为普通民众提供便利生活的设施，他对许多城市的状况感到满意。\n\n然而，也有一些负面因素令沙皇感到担忧。他对城市之间仍然十分荒凉感到不满。许多地方要么没有得到耕种，要么没有得到利用。而主要城市之间相距甚远，这也让谢尔盖感到担忧。他认为，这些土地应该尽可能多地容纳人口，但目前为止，这方面还没有取得任何进展。值得一提的是，卡津别克和别洛泽尔斯基在旅途中谈论了许多商业话题，也谈论了一些日常生活中的琐事，其中自然也少不了关于哈萨克斯坦的未来发展。他们探讨了在建设过程中遇到的困难以及其他问题。也许，这次旅行能让卡津别克和谢尔盖·别洛泽尔斯基沙皇从繁重的工作中得到久违的放松。\n\n结束了对哈萨克斯坦的访问后，皇室代表团和总理一同乘坐飞机返回了首都。"
 berez_kazahk.7.a:0 "前方还有很长的路要走。"
 berez_kazahk.8.t:0 "三个民族，一个国家"
 berez_kazahk.8.d:0 "结束了一天的辛劳工作后，弗拉基米尔决定去啤酒馆放松一下。他的两位老友，叶尔博拉特和博莱斯瓦夫，早已在那里等候。“你终于来了，沃瓦，我们都在等你呢。今天过得怎么样？” 博莱斯瓦夫用浓重的波兰口音问道。“还是老样子，累！自从青年俄罗斯联盟来了以后，一直在忙着抓捕强盗和其他坏人，一刻也没闲着。”弗拉基米尔说着，坐到了桌旁。“是啊，这片地界上的强盗确实不少。不过我相信，青年俄罗斯联盟和他们的可汗…我是说沙皇陛下，一定能解决这些问题。我们之前根本对付不了那些地方上的赤匪、狂热分子和土匪，希望以后不会再出现这种情况了。”叶尔博拉特说道。“但愿如此吧！来，让我们为青年俄罗斯联盟，为我们国家的辉煌未来干一杯！” 弗拉基米尔说着站起身来，博莱斯瓦夫和叶尔博拉特也纷纷举杯响应。“乌拉！” 三人齐声高呼，碰杯共饮。啤酒馆里的其他人也纷纷举杯，加入了他们的行列。"
 berez_kazahk.8.a:0 "等待和平与安宁。"
 KAZ_mil_annexation_tt:0 "由于我们的行动，§B哈萨克斯坦§!将成为§R俄罗斯§!§G不可分割的一部分§!"
 Civil_War_Kazakhstan_Berezniki_tt: "哈萨克斯坦内战不休，令我们无从谈起和平统一的问题，所以我们将会用§R铁腕§!来建立秩序。"
 Russian_Kazakhstan_Berezniki_tt: "由于俄罗斯人已经控制了哈萨克斯坦的政权，我们能够与他们进行谈判，并最终§G和平地§!实现统一！"
 Kazakh_Kazakhstan_Berezniki_tt: "在哈萨克斯坦取得胜利的势力并没有迅速无条件地加入我们的意愿，我们会尝试与他们就吞并哈萨克斯坦进行§Y协商§!。"
 berez_kazahk.10.t:0 "友谊无界"
 berez_kazahk.10.d:0 "随着哈萨克斯坦政府和平并入俄罗斯，伊戈尔被任命为巴甫洛达尔地区联合行政部门的负责人。他的主要职责是重建热列津斯基地区，该地区70%以上的人口是俄罗斯人。西俄战争结束后，这里涌入了大量难民，他们逃离了黑瑟联盟的疯狂统治、斯大林主义的瘟疫、军政府的独裁统治以及兹拉图斯特资本家的剥削。伊戈尔也因此声名鹊起。\n\n他的任务包括重建所有在内战或德国空军轰炸中受损的住宅楼，以及解决俄罗斯人和哈萨克人之间的安置问题和冲突。\n\n乘坐火车前往曾经的“热列津卡”村时，伊戈尔内心忐忑不安。如今，由于大量难民涌入，这里已经发展成了一座新兴城市。他预料，这里将会充斥着极端的民族主义和种族歧视，无论是来自哈萨克人还是俄罗斯人，这都将成为他工作中面临的主要问题。他必须尽力阻止这两个民族之间的仇恨升级为暴力冲突。\n\n然而，当他抵达目的地时，却被眼前的景象惊呆了。这里安全祥和，没有丝毫的种族仇恨迹象。不同民族的人们热情地欢迎他的到来。在学校里，俄罗斯和哈萨克的孩子们一起学习；在图书馆里，两个民族共同研读彼此的文学作品；在医院里，你可以看到不同民族和文化的融合。\n\n无论是内战还是西俄战争，都没能摧毁这两个民族之间的友谊和爱。"
 berez_kazahk.10.a:0 "统一，而不可分割。"
 berez_kazahk.11.t:0 "[GetDateText]年战情简报"
 berez_kazahk.11.d:0 "哈萨克斯坦爆发于1968年的那场血腥内战仍未停息。时至今日，两股势力之间仍旧鏖战正酣：一方是谋求哈萨克斯坦独立的民族主义分子，另一方则是亲俄的北哈萨克斯坦政府。\n\n前一个派系的代表对我们、我们的国家和我们的人民充满了敌意。对俄罗斯族人口的不断迫害对他们来说已是家常便饭，甚至时常能得到当地政府或军方的纵容。而这一派的领导层也积极谋求在内战中取得胜利，并将大部分的俄罗斯族人口驱逐出他们的土地，谋求一个独立于俄罗斯的政治实体。\n\n第二个派系的代表对我们来说是一个更为理想的选择，尽管他们恐怕依旧不愿与我们进行谈判。由于身处长期的战争环境，他们的思维方式已经被极端化了，心中只有军事行动，对他们所控制区域的哈萨克少数民族也是极尽歧视之能事，本身更是些不称职的政客和军人，无法成什么大事。\n\n最终，除了全面入侵哈萨克斯坦并亲手重建秩序外，我们别无选择。这项行动应刻不容缓地制定并执行，要趁着哈萨克人自顾不暇的这个时间点将其拿下。"
 berez_kazahk.11.a:0 "恢复我们在草原地区的秩序吧！"
 berez_kazahk.12.t:0 "[GetDateText]年战情简报"
 berez_kazahk.12.d:0 "[Get_Event_berez_kazahk_12_Desc]"
 berez_kazahk.12.a:0 "[Get_Event_berez_kazahk_12_Answer]"
 berez_kazahk_12_shelokov:0 "在对哈萨克斯坦的局势进行调查后，我们的分析人员发现，在最近的内战期间，亲俄派成功击败并消灭了哈萨克反对派的力量。\n\n尼古拉·谢洛科夫，一位资深的苏联军人和政治家，如今以胜利者的姿态执掌哈萨克斯坦政权。作为一名普通的抗议者和反哈萨克政府起义的组织者，如今他的足迹已经遍布阿拉木图和阿克套，保障了当地俄罗斯族人的安全，并确立了他所领导的政权对哈萨克人和波兰人的统治。\n\n尽管谢洛科夫曾在任内被指控腐败和窃取哈萨克预算资金，现在也因为对待哈萨克民众的一些不人道行为而饱受非议，但他的胜利对我们而言仍然是一个相对理想的结果。他是一位民粹主义者，成功地动员了几乎所有的俄罗斯族居民为其理想而战，同时也安抚了骚动的哈萨克人和波兰人，令这些曾经对亲俄政权深感不满的群体偃旗息鼓。此外，他本人也多次声明效忠于我们的政权，数次向我们抛出橄榄枝，甚至在内战期间向我们寻求援助。\n\n现在我们需要亲自同尼古拉·谢洛科夫进行接洽，向他提议两国合并以及哈萨克斯坦的军队、政府和经济的全面整合。我们深信他将会同意我们的提议。今天，我们的士兵可以高枕无休了，因为他们知道，哈萨克斯坦很快将重新成为俄罗斯的一部分，而且无需流一滴血。"
 berez_kazahk_12_shelokov_a:0 "为谢洛科夫同志的健康干杯！"
 berez_kazahk_12_solomentsev:0 "在对哈萨克斯坦的局势进行调查后，我们的分析人员发现，在最近的内战期间，亲俄派成功击败并消灭了哈萨克反对派的力量。\n\n米哈伊尔·索洛缅采夫，一位资深的苏联工程师和政治家，如今以胜利者的姿态执掌着哈萨克斯坦政权。作为一名普通的抗议者和反哈萨克政府起义的组织者，如今他的足迹已经遍布阿拉木图和阿克套，终结了这个国家内部的种种民族纷争与仇杀。\n\n作为一名俄罗斯民族主义者，索洛缅采夫对我们而言简直是完美的人选。通过为俄罗斯人和波兰人划定特定区域，打压哈萨克民众，并为俄罗斯少数民族提供发展机会和定居的土地，他的种种政策都与我们的目标和任务不谋而合。因此，由他来担任哈萨克斯坦的领导人简直是天赐良机。\n\n经过内部决议，我们将亲自同米哈伊尔·索洛缅采夫进行接洽，向他提议两国合并以及哈萨克斯坦的军队、政府和经济的全面整合。我们深信他将会同意我们的提议。今天，我们的士兵可以高枕无休了，因为他们知道，哈萨克斯坦很快将重新成为俄罗斯的一部分，而且无需流一滴血。"
 berez_kazahk_12_solomentsev_a:0 "为索洛缅采夫同志的健康干杯！"
 berez_kazahk.13.t:0 "[GetDateText]年战情简报"
 berez_kazahk.13.d:0 "在愈演愈烈的北部边疆骚乱中，哈萨克斯坦政府未能平息俄罗斯难民和军人对当前政府的不满，最终酿成了一场声势浩大的起义。然而，尽管俄国起义者拥有军事力量并控制了大量的工业设施，哈萨克斯坦政府仍然粉碎了他们的反抗，将起义的所有领袖尽数消灭。\n\n即便丁穆罕默德·库纳耶夫曾为哈萨克人民立下过汗马功劳，但他已不再是这个国家的掌舵人。如今，当地反对派势力——哈萨克斯坦民族主义者执掌了大权。他们主张将哈萨克斯坦彻底从俄罗斯的桎梏中解放出来，建立一个独立自主的国家。这当然与我们对这片草原地区的未来规划背道而驰，但或许我们仍有与新政府建立联系的机会。\n\n诚然，我国的许多军方人士主张立即出兵干预并对该地区进行军事吞并。考虑到哈萨克斯坦的军队实力同我们完全不在一个档次上，这可谓是轻而易举的。然而，我们的外交官提出了另一个选项——通过谈判解决问题。灵活应变、做出一些让步，以及发挥我们卓越的外交技巧——通过这种种方式，我们可以通过外交手段吞并哈萨克斯坦，避免无谓的流血冲突和超级大国的责难。\n\n经过简短的磋商，我国政府决定与哈萨克斯坦政府展开谈判。我们必须解决哈萨克权贵和当地居民的问题，还需要通过某种方式来暗示哈萨克人，倘若他们不愿与我们合作，那么将会有什么样的严重后果在等待着他们。任重而道远，但我们必须竭尽全力确保这场谈判以俄罗斯的凯旋而告终。"
 berez_kazahk.13.a:0 "该着手工作了。"
 berez_kazahk.14.t:0 "关于政府权贵的问题"
 berez_kazahk.14.d:0 "摆在我们面前的首要问题是，我们应当如何处置当前的哈萨克斯坦政府？\n\n从一方面来说，直接让他们官复原职似乎有些不妥。他们对愈演愈烈的民族冲突所采取的绥靖纵容态度，最终导致了内战的爆发。\n\n但是，从另一方面来说，这将极大地简化我们对哈萨克地区的整合。哈萨克民众乐见这些官员继续掌权，只不过如今头顶上的旗帜换了而已。而我们派驻到此地的新任总督也无需为人员问题而劳神费心，至少在近期内是这样的。\n\n解决这一问题的方案有很多，但是我们只能从中选择一个。"
 berez_kazahk.14.a:0 "我们的体制中没有他们的位置。"
 berez_kazahk.14.b:0 "只留下那些展现出应有的忠诚的人。"
 berez_kazahk.14.c:0 "我们不得不做出让步。"
 berez_kazahk.15.t:0 "恐吓手段"
 berez_kazahk.15.d:0 "尽管俄罗斯军队实力雄厚，但周围的许多国家仍然低估了我们的军事潜力，哈萨克斯坦也不例外。当地的权贵们普遍认为他们能够在与我们的武装冲突中立于不败之地。我们必须向他们证明，这种想法是大错特错的。\n\n首先，我们可以不必大动干戈，只需在边境进行一些实弹射击演习即可。可以安排边防军来执行这项任务，或者也可以调动一支陆军部队，甚至一个师参与其中。这并不会耗费太多的资源，不过，如此小打小闹的阵仗恐怕也难以给他们留下什么深刻印象。\n\n然而，我们的一些专家提出了一个替代方案。鉴于我们很快将与大日耳曼国开战，我们可以提前展开“南方-70”演习——这是一系列为实战做准备的综合性军事演习。这无疑会对哈萨克人和德国人都产生强烈的震慑作用。然而，演习的代价是昂贵的，而且组织起来也绝非易事。假如我们的指挥层不够称职，组织工作不够周密，亦或士兵不够坚决——那么这场耀武扬威的“肌肉秀”很可能会演变成一场彻头彻尾的灾难，甚至让我们沦为笑柄。\n\n当然，我们也可以选择按兵不动。的确，这样一来哈萨克人并不会感到惊讶，我们也不会从中得到什么好处，但至少我们可以节约下大量的资源。\n\n不过，我们终究需要做出一个抉择。"
 berez_kazahk.15.a:0 "他们已经清楚自己所面对的是什么样的对手，我们不必在这方面浪费资源。"
 berez_kazahk.15.b:0 "或许，在边境进行一些实弹射击能够让他们清醒一些。"
 berez_kazahk.15.c:0 "一箭双雕：举行“南方-70”演习！"
 berez_kazahk.16.t:0 "关于民族的问题"
 berez_kazahk.16.d:0 "最迫在眉睫的问题——是关于哈萨克斯坦民族自身的问题。哈萨克人是这里的主体民族，这是毋庸置疑的事实，但我们必须对这一事实采取一些行动。像往常一样，我们有几条不同的道路可供选择。\n\n首先，我们可以尝试将他们整合进我们的社会中。压制他们的民族主义情绪和传统习俗，逐步将他们同化进一个大俄罗斯的框架中，同时也可以用我们的人口来逐渐填充他们的土地。一方面，从长远来看，这种做法很可能会带来积极的成果。但另一方面，客观来说，这些行为无疑将会引发哈萨克人民的强烈抵触。\n\n另一种方案——建立一个自治政权。允许哈萨克人和他们的官员继续掌权，不对当地的法律进行大的改动，甚至可以将哈萨克语保留为官方语言——通过这种方式，我们可以有效地避免暴乱和抗议活动，同时将哈萨克斯坦为我所用。如果忽略掉这一方案会导致我们的控制力受到一定削弱这一事实的话，那么这或许可以称得上是当前局势下最为务实的选择。\n\n最后一个选项——在建立自治政权的同时，在这片土地上推行积极的差别政策。为哈萨克公民提供额外的津贴，暂时免除他们的税负，为他们提供工作和住房，并在当地行政机关中为他们保留席位。这将进一步拉近当地民众与我们的距离，但这无疑也将会是一笔极为昂贵的开销，其花费将远超其他的选项。\n\n尽管存在争议，但政府必须做出最终决定。"
 berez_kazahk.16.a:0 "整合才是哈萨克斯坦唯一的命运。"
 berez_kazahk.16.b:0 "或许，建立自治政权这个选项并没有那么糟糕？"
 berez_kazahk.16.c:0 "让我们开始积极差别化政策。"
 berez_kazahk.17.t:0 "谈判破裂"
 berez_kazahk.17.d:0 "哈萨克和俄罗斯谈判代表团之间日益紧张的关系导致了一个可以预见的结果。在就哈萨克斯坦北部地区的地位问题无法达成妥协后，双方代表团都退出了谈判。\n\n我国的谈判代表公正地谴责哈萨克斯坦政府“毫无谈判的诚意，并且对俄罗斯极尽排斥与仇视之能事”。与此同时，外交部长向沙皇提议对哈萨克斯坦采取“更加积极的措施”。"
 berez_kazahk.17.a:0 "既然他们拒绝了橄榄枝，那就给他们一根荆棘瞧瞧。"
 berez_kazahk.18.t:0 "谈判的成功"
 berez_kazahk.18.d:0 "在经历了漫长而又令人焦灼不安的数日后，谈判代表团终于传来了回音。而这个结果令我们极其满意！经过一系列相互让步和妥协，哈萨克和俄罗斯的外交官们最终敲定了一份令双方都感到满意的条约。\n\n当沙皇和部长们开启香槟庆祝时，沙皇联盟的军官和士兵们也如释重负地松了一口气。与此同时，哈萨克社会虽然难免因失去国家主权而感到一丝苦涩，但仍然平静地接受了沙皇政权重新回归哈萨克草原这一现实。只有时间才能告诉我们，未来的哈萨克-俄罗斯关系将会走向何方。但至少现在，一切都是以和平的方式开局。"
 berez_kazahk.18.a:0 "好极了！"
 berez_kazahk.19.t:0 "过度的自治？"
 berez_kazahk.19.d:0 "尽管谈判取得了成功，但政府和军队中的某些人士仍然不愿接受这一他们眼中的“投降主义”的谈判结果。“哈萨克人仍然保留着过多的自治权，这完全沦为了换汤不换药的把戏，未来该地区很有可能会因此而滋生分裂主义的风险。”——弗拉基米尔·吉尔领导的反对派如是宣称。\n\n“吉尔集团”计划趁着哈萨克政府放松警惕的这个空档，以迅雷不及掩耳之势占领哈萨克斯坦的主要城市，解除哈萨克军队的武装。在控制哈萨克斯坦全境后，他们将建立一个过渡政府，为哈萨克斯坦加入俄罗斯做好各项准备。然而，俄哈条约的维护者们则警告说，吉尔计划的失败可能会导致一场全面战争的爆发，他们还主张，我们可以运用政治和经济压力来迫使哈萨克斯坦在未来做出更多让步。那么，沙皇究竟会如何抉择呢？"
 berez_kazahk.19.a:0 "吉尔说的对，我们必须推翻之前的谈判结果。"
 berez_kazahk.19.b:0 "我们不会冒这个险。"
 berez_kazahk.20.t:0 "演习前夕"
 berez_kazahk.20.d:0 "“同志们，‘南方-70’不仅仅是一场演习，更是我们力量与决心的展示。我们正处在一个至关重要的战略节点。我们的邻国将会见识到我们的强大实力，但更重要的是，不仅要让我们的盟友，还要让那些潜在的敌人，让整个西方世界都明白：俄罗斯时刻准备着捍卫自己的利益，无论这些利益身处何方。”\n\n在听完上校的简报后，一位中尉走上前。\n\n“上校同志，‘西方-69’演习为我们树立了一个极高的标杆。在那场演习中，我们展示了我们固若金汤的纵深防御体系以及灵活机动的战术调动能力。而现在，是时候展现我们在南方地区发动雷霆一击的实力了。而且，据我所知，此次演习还将成为我们向哈萨克斯坦传递某些信息的契机，对吧？”\n\n“没错。哈萨克斯坦边境是一处重要的门户，无论是我们的盟友，还是那些对我们怀有敌意的势力，都可能通过这里趁虚而入。我们必须展示出我们不仅能够有效防御，更能够在任何战场环境下发动攻势的强大能力。演习计划将涵盖装甲师的机动演练和战略空袭行动——让所有人拭目以待这场军事盛宴吧。”\n\n一位上尉突然插话进来。\n\n“更重要的是，我们必须让年轻的战士们明白：敌人并不会总出现在我们预料之中的地方。大日耳曼国及其盟友正紧盯着我们的一举一动。这次演习就是我们的回应方式，让他们见识到，俄罗斯可以从南部边境向任何方向——从中亚到西欧——发动致命打击。”\n\n“并且让他们好好回想一下，‘西方-69’不仅仅是一场实力的炫耀，更是一次郑重其事的警告。而现在，通过‘南方-70’，我们要让全世界知道，我们南部的防线同样坚不可摧，并且随时能够发动决定性的攻势！”\n\n几位高级军官被中尉这番充满热情的发言逗笑了，紧接着，对讲机里传来“各就各位”的命令。"
 berez_kazahk.20.a:0 "演习开始。"
 MAR_KAZ_ours:0 "我们控制着哈萨克斯坦。"
 MAR_KAZ_yug_70_tt:0 "我们必须在指定时间内，在§B哈萨克斯坦§!边境举行军事演习。"
 MAR_yug_excersices_category:0 "“南方-70”演习"
 MAR_yug_excersices_category_desc:0 "\n\n\n\n\n\n“南方-70”演习是一场综合性的军事演习，模拟在不同的地理环境下与假想敌进行一场现代化战争。通过在哈萨克斯坦边境举行演习，我们将展现我们的战备水平，并改善我们的谈判地位。除了哈萨克斯坦，我们还将向全世界宣告，俄罗斯已经崛起成为一个真正意义上的军事强国，即使面对§R强大的敌人§!也无所畏惧。"
 MAR_yug_do_excersices:0 "举行演习"
 MAR_KAZ_talks_decrease_tt:0 "这将会§R削弱§!我们在谈判中的地位。"
 MAR_KAZ_talks_neutral_tt:0 "这§Y不会§!对我们的谈判地位产生任何影响。"
 MAR_KAZ_talks_increase_tt:0 "这将会§G改善§!我们的谈判地位。"
