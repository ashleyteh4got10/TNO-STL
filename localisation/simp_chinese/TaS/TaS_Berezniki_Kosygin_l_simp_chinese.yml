 MAR_ogas_dynmod_dummy_desc: "§F全国自动化系统安全性的影响\n--------------\n研究速度:[?MAR_ogas_dynomod_array_one^0|.1%=+]\n政治点数增益:[?MAR_ogas_dynomod_array_one^1|.1%=+]\n人力支出修改:[?MAR_ogas_dynomod_array_one^2|.1%=-]\n--------------\n全国自动化系统效率的影响\n--------------\n国内生产总值增长:[?MAR_ogas_dynomod_array_two^0|.1%%=+]\n通货膨胀率调节:[?MAR_ogas_dynomod_array_two^1|.2%%=-]\n工业产能:[?MAR_ogas_dynomod_array_two^2|.1%=+]\n社会项目成本系数:[?MAR_ogas_dynomod_array_two^3|.1%=-]\n行政计划成本系数:[?MAR_ogas_dynomod_array_two^4|.1%=-]\n最大生产效率:[?MAR_ogas_dynomod_array_two^5|.1%=+]\n月度贫困率变化:[?MAR_ogas_dynomod_array_two^6|=+]\n生产单位对国内生产总值的修正:[?MAR_ogas_dynomod_array_two^7|.1%=+]\n建设速度:[?MAR_ogas_dynomod_array_two^8|.1%=+]\n--------------\n全国自动化系统复杂度的影响\n--------------\n稳定性:[?MAR_ogas_dynomod_array_three^1|.1%=+]\n其他支出(占国内生产总值的百分比):[?MAR_ogas_dynomod_array_three^0|.1%%=-]\n--------------\n§!国家会计和处理信息自动化系统是人民王国的先进发展。如果成功，该系统将有助于实现整个部门工作的自动化，但另一方面，系统总会出错。"
 MAR_ogas_modifier: "全国自动化系统"
 MAR_Kosygin_OGAS.1.t: "格卢什科夫在硅谷"
 MAR_Kosygin_OGAS.1.d: "他们以衣冠相见，却以思想相送。这句话是格卢什科夫访问广东的最好写照。大城市的霓虹灯和灯光让人目不暇接，但在它们的背后却隐藏着腐朽、腐败和剥削制度。不过，尽管有种种不完美之处，我们还是可以从中吸取教训。\n\n归根结底，维克多并不是来建立社会正义或解放中国所有工人的。现在，他只对电子领域的科学进步感兴趣，而广东正是在这一领域真正闻名遐迩。处于进步前沿的国家应该成为创建自动化系统的起点。然而，当地的技术更倾向于市场经济。而规划技术在这里只是用来分析市场的。但是，必须从某个地方开始发展。\n\n维克多·格卢什科夫为期一周的访问以与现任行政长官的个人谈话结束。谈话中提出的话题及其结果可能永远不会为公众所知。现在，OGAS的主要研发者离开了这个充满反差的国家。在这里，霓虹灯掩盖了贫穷，而最新技术则让少数人富裕起来。也许有一天，他会带着完全不同的目标回到这里。"
 MAR_Kosygin_OGAS.1.a: "开端已经奠定。"
 MAR_Kosygin_OGAS.2.t: "在学院的第一天"
 MAR_Kosygin_OGAS.2.d: "伊戈尔对国家事务知之甚少，所以他不知道在新岗位上等待他的是什么。毕竟，他在家乡的阿尔汉格尔斯克学院成绩优异，是 “皇家奖学金获得者”之一，因此突然被调到伏尔加河畔一家不知名的企业对他来说似乎很奇怪。也许是高层管理者看中了他。但这又有什么区别呢？\n\n事实是，他被从一所著名的学院转到了伏尔加河畔的某所学院，而这所学院根本没人听说过！就这样，伊戈尔和其他失落的学生一起站在校门口，也许他们每个人都曾做过错事。也许这就是他在北方国立大学学到的最重要的一课。\n\n不一会儿，一位身着商务西装的中年男子出现在大家面前，开始了他的演讲：“你们好，亲爱的伏尔加网络技术学院的学生们。正如你们所理解的，你们在这里的入学看起来很混乱，完全是自发的。不过，我在这里要消除你们所有的疑惑，并解释你们今天来到这里的原因，请跟我来。”\n\n学生们跟在导游后面，里面的建筑看起来非常坚固，但真正的宝藏在房间里。\n\n一排排日本生产的最先进的计算机和装有大型机的房间。\n\n经过这样的演示，学生们深受鼓舞，准备开始学习。伊戈尔尤其高兴，因为他的才能得到了认可和赞赏。"
 MAR_Kosygin_OGAS.2.a: "让我们开始工作吧！"
 MAR_Kosygin_OGAS.3.t: "与蓝色巨人的会面"
 MAR_Kosygin_OGAS.3.d: "纽约阴沉的天气，并没能让来自人民帝国的代表团感到舒心。车队穿梭在繁忙的街道上，彼得·德米切夫望着窗外，眼中映出这座城市的光怪陆离。巨幅广告牌鳞次栉比，行色匆匆的人潮奔涌不息，每个人的脸上都写满了焦虑和对命运的追逐。或许，俄罗斯有朝一日也会变成这样吧……\n\n车队最终停在了IBM公司门前。为了迎接这次来访，IBM可谓是做足了准备：高效干练的管理团队早已严阵以待，就连托马斯·沃森本人也亲自出面，准备为这位远道而来的客人展示他们引以为傲的产品。可惜的是，他们并不知道，这一切，其实毫无意义。\n\n一切都按部就班地进行着。最新款的IBM System/360大型机闪亮登场，各种关于机器性能的吹捧也接踵而至。说实话，彼得·德米切夫对这些新奇玩意儿并不了解，但他还是被IBM员工的热情所感染，仿佛这些冰冷的钢铁巨兽真的拥有改变世界的力量。\n\n最终，会谈的焦点落在了IBM能否满足帝国的需求上。不出所料，IBM非常乐意以优惠的价格出售一批Model 91，并且还可以接受追加订单。最终，双方达成一致：首批10台机器连同技术人员将在下个月运抵俄罗斯。"
 MAR_Kosygin_OGAS.3.a: "德米切夫在这里的工作已经完成。"
 MAR_Kosygin_OGAS.4.t: "伏尔加河上的明珠"
 MAR_Kosygin_OGAS.4.d: "阿列克谢二世本人一直关心与OGAS系统开发有关的问题，因此一直在监督该项目进展情况。因此，当需要在伏尔加河上建造整座城市以继续实施该项目时，沙皇批准了建造工程，并不断要求就已完成的工作提交报告。现在到了城市在全国范围内开放前的最后一次会议。\n\n不出所料，工程已接近尾声，但会议中间却出现了一个意想不到的事实。这座城市仍然没有名字！到目前为止，它在文件中只有一个代号KBR-1，并没有真正的名字。因此，为了想出一个名字，一场紧急的头脑风暴开始了。\n\n尼古拉·马斯连尼科夫提议说：“我建议叫姆拉多格勒。这个名字很有意义，说到底，它体现了控制论的精神！”\n\n阿列克谢二世的脸上没有任何表情，但他不喜欢这个名字。\n\n“而我认为，这座城市应该以圣彼得堡研究所所长、为我国无线电电子学做出巨大贡献的人的名字命名为伯格堡。”格卢什科夫回答道。\n\n阿列克谢二世对这个方案仍然不以为然。一方面，用德语给城市命名，另一方面，用如今这样一个无足轻重的人物的名字来命名...... \n\n柯西金·罗曼诺夫低声说道：“伏尔加河畔的理想城。”\n\n办公室里顿时鸦雀无声。之后，名称获得通过，会议结束。"
 MAR_Kosygin_OGAS.4.a: "那就理想城吧。"
 MAR_Kosygin_OGAS.5.t: "清理区域"
 MAR_Kosygin_OGAS.5.d: "今天，喀山电气厂厂长阿列克谢·卡纳耶夫接到了来自政府的一项非比寻常的命令：他们被要求腾出一间库房大小的空间来放置计算机。显而易见，要找到这样的空间简直难于登天。厂长和经济部门主管只能硬着头皮解决这个难题。\n\n“要不……咱们就说没地方？”经济部门主管瓦西里·伊比亚托夫试探性地问道，“就说咱们厂压根儿腾不出这么大的地方……”\n\n阿列克谢粗暴地打断了他的话，“你小子又想偷懒耍滑是不是？你也不打听打听，上面对这种事情是怎么处理的？”他一边说着，一边用手在脖子上比划了一下。“到时候要是完不成任务，你我脑袋都得搬家，还得连累整个工厂的领导班子一起受罚！你想清楚了！”\n\n“那，那咱们总得找个地方安置那些计算机吧？”瓦西里吓得冷汗直冒，“要不……就把库房腾出来？”\n\n“腾了库房，工具放哪儿去？”\n\n“这...我不知道。要不先让那些文职人员挤一挤？反正他们成天也没啥事。”\n\n“也只能这样了。赶紧叫人手，把库房腾出来。中午之前，那些计算机就会送来，别到时候让人家看笑话！”"
 MAR_Kosygin_OGAS.5.a: "在狭小的空间里，但并不冒犯。"
 MAR_Kosygin_OGAS.6.t: "第001号报告"
 MAR_Kosygin_OGAS.6.d: "主题:在喀山测试“国家会计和处理信息自动化系统”\n\n说明:作为在喀山几家工厂测试“国家自动化系统”的一部分，在工厂安装了专门的信息处理室。\n\n结果:初步结果显示，效率提高了25%，产品核算也得到了改善。但消极的一面是，机器耗电量过大。此外，由于电脑空间的分配过于仓促，最初几天的效果并不理想。需要进一步发展。"
 MAR_Kosygin_OGAS.6.a: "了解。"
 MAR_Kosygin_OGAS.7.t: "新生代工厂"
 MAR_Kosygin_OGAS.7.d: "计算机安装完毕后，喀山电气厂的工作照常进行。除了财务部门，似乎没有人注意到它们的存在。一切如常，就连厂长阿列克谢·卡纳耶夫也在尝试学习如何操作安装在他办公室里的这台机器。这天，阿列克谢又一次坐在电脑前研究，瓦西里·伊比亚托夫兴高采烈地走进办公室。\n\n“廖卡，我跟你说，这些机器真是太好用了。我看啊，咱们的产量还能再往上提一大截。”\n\n“好用是好用，但你就不怕它们以后把你给取代了？”\n\n“它们把我取代了？怎么可能！就说清理库房那事儿，这机器只用了几个小时就算出了怎么清理，还连夜就把电脑给连上了网，这效率，谁能比得了？”\n\n“ 也许是我想多了吧……” 阿列克谢叹了口气，“不过你想想，以后这些机器会写字，会画图，估计大部分工作都能自己完成。到时候，我们这些人该怎么办？”\n\n“到时候咱们都退休了。到时候就好好享受生活，每天钓鱼下棋，岂不快哉。”\n\n听到这话，瓦西里放声大笑起来，而阿列克谢只是若有所思地看着电脑屏幕，眉头紧锁。"
 MAR_Kosygin_OGAS.7.a: "又一天。"
 MAR_Kosygin_OGAS.8.t: "你好，世界！"
 MAR_Kosygin_OGAS.8.d: "今天，伏尔加网络技术学院的研究生们兴奋不已。就在刚才，他们成功将多所大学的计算机连接到了一起，缔造了一个前所未有的网络！这个消息无疑令人振奋，也激发了所有人对未来的无限遐想。但在这兴奋之余，空气中也弥漫着一丝不安。过去与未来只有一线之隔，学生们面对着冰冷的机器，心中不免有些犹豫。这时，一位勇敢的学生站了出来，他就是伊戈尔·涅恰耶夫。在众人的注视下，他走到键盘前，敲下了一行字：“你好，世界！”然后，他按下回车键，信息发送了出去。\n\n房间里顿时鸦雀无声。实验会成功吗？如果在他们眼前功亏一篑怎么办？一秒、十秒、一分钟、两分钟……时间仿佛被无限拉长，每一秒都变得无比漫长。终于，电脑屏幕亮了起来，上面显示出一行新文字，但这并不是之前输入的那一句！伊戈尔赶紧扶了扶眼镜，俯身仔细辨认，然后大声读了出来：“为什么不试试国有化呢？”短暂的沉默过后，房间里爆发出雷鸣般的掌声和欢呼声。"
 MAR_Kosygin_OGAS.8.a: "它成功了。"
 MAR_Kosygin_OGAS.9.t: "人类的命运"
 MAR_Kosygin_OGAS.9.d: "对伊万·费奥多罗夫来说，这是糟糕的一天。他知道，自己迟早会被机器取代。这一天终将到来，只是每次他都安慰自己说，那是将来的事情，还很遥远。然而，明天，不，或许就是今天，末日就将降临。\n\n“我能去哪里呢？我只会做会计工作，而且必须是整个部门一起工作才行。可是现在，只需要几个人，几台电脑就够了……”想到这里，伊万感到一阵莫名的愤怒。他本来打算这周就戒烟，但现在，去他的戒烟计划吧。他拿起早上带过来的报纸，随手翻了翻，希望能找到工作信息，哪怕是一丝希望也好。“国立系统管理员培训班…”一个醒目的标题映入眼帘，“结业后包分配，提供住宿。”\n\n伊万眼前一亮，他赶忙从口袋里掏出笔记本和笔，记下了广告上的地址，然后抓起外套，急匆匆地跑了出去。培训班的大门就要打开了，他必须赶在其他人前面。"
 MAR_Kosygin_OGAS.9.a: "一切仍未结束。"
 MAR_Kosygin_OGAS.10.t: "OGAS，启动！"
 MAR_Kosygin_OGAS.10.d: "再过几天，OGAS系统就要正式启动了。整个俄罗斯，都在期待着这一天的到来，除了格鲁什科夫。自从全面启动的日期公布以来，一种莫名的惆怅便一直萦绕在他的心头，挥之不去。今天，维克托·米哈伊洛维奇要去觐见沙皇。\n\n御书房的大门打开了，阿列克谢二世起身迎接：“你好，维克托·米哈伊尔洛维奇，”他平静地说道，“很快，OGAS就将全面融入我们的国家，所以我想和你谈谈。”\n\n“您好，阿列克谢·尼古拉……米哈伊洛维奇。我很乐意与您谈谈。”\n\n“告诉我，维克托，你在担心什么？很快，全国人民都将见证自动化的奇迹，这难道不是你的梦想吗？”\n\n“这当然是我的梦想…”维克托摘下眼镜，不安地擦了擦镜片，“只是我担心我无法完成我想要做的一切。很多想法，根本无法实现。”\n\n“我明白…”沙皇说着，从椅子上站了起来，走到维克托身边，“你已经为人民做的事情，比任何一个马克思主义理论家或批评家穷其一生所能做的都要多。不要因为你没有做到的事情而自责。你应该感到高兴，因为你已经将一些梦想变成了现实。”\n\n谈话逐渐转向了更实际的议题，但这次谈话却在格鲁什科夫心中留下了不可磨灭的印记。他感觉好多了。也许，正是这次谈话，让他最终下定了决心，迈出那最艰难的一步。"
 MAR_Kosygin_OGAS.10.a: "时机已至。"
 MAR_greater_good_category:0 "福泽天下"
 MAR_greater_good_category_desc:0 "\n\n\n\n\n\n阿列克谢·柯西金-罗曼诺夫希望我们尽最大努力实现他的计划。“福泽天下”计划旨在增进民生福祉，鼓励人民行动起来发展社会。当然，我们现在不可能就把所有资源花在每一个人身上——因此，增进民生福祉的主攻方向由你决定。\n\n该计划预估要长期进行，在此期间，我们完全有能力提高人们的总体生活水平，改善国家各项指标。前进后退都会花很多钱，但这并非纯粹吞金，将来会有回报的，我们的行动亦可视为对未来的投资。"
 MAR_greater_good_help_the_poor:0 "扶贫计划"
 MAR_greater_good_help_the_poor_desc:0 "穷人是最脆弱的人口群体之一。很多时候，穷人甚至无法为自己提供足够的营养，更不用说拥有健康的身体或新公寓了。为了帮助他们，我们可以引入社会福利，增加他们的工资，此外，他们至少有机会吃得好。"
 MAR_greater_good_create_universal_healthcare:0 "全国医保系统扩张"
 MAR_greater_good_create_universal_healthcare_desc:0 "公民健康是国家发展的支柱之一。没有适当和及时的医疗保健，人们就会生病和虚弱。而病弱的人无法战斗、工作或发明创造。因此，我们需要在全国范围内建立一个完善的医疗保健体系，让每一个人，无论是在乡村还是城市，都不会得不到及时的医疗保健。"
 MAR_greater_good_invest_in_scientific_research:0 "加大科技领域投入"
 MAR_greater_good_invest_in_scientific_research_desc:0 "科技进步的成就不仅从经济、军队和电子技术发展的角度来看对我们很重要，而且从普通人生活的平凡角度来看也很重要。我们必须鼓励在开发消费品领域取得科学进步，以帮助人们更好地生活。改进冰箱或炉灶等普通家庭用品并使之现代化，将是我国每个公民的一项重要创新。"
 MAR_greater_good_allocate_education_funding:0 "补贴贫困学生"
 MAR_greater_good_allocate_education_funding_desc:0 "父母想方设法给孩子最好的教育，但有时为了孩子不需要什么，他们甚至牺牲了自己的健康。我们必须尽一切可能帮助这些孩子，帮助这些在教育方面遇到严重经济困难的家庭，使他们不再遇到如此大的困难。我们必须在学校为这些孩子提供优质的热午餐，我们必须为这些家庭提供社会资金，让他们能够购买学习所需的一切：笔、笔记本、校服等等。"
 MAR_greater_good_please_veterans:0 "奖励退伍军人"
 MAR_greater_good_please_veterans_desc:0 "伟大的卫国战争、西俄战争和西俄战役的老兵在我国值得特别尊敬。尽管他们备受尊敬，但他们的生活往往像乞丐一样艰难。那些从战争中归来的人为了胜利付出了一切。那些为了我们孩子和祖国的未来而战斗的人应该得到充分的奖赏。"
 UAR_faction_mech_no_other_decisions:0 "§Y目前尚未就在阿拉伯联合共和国的影响力做出其他决定。§!"
 GC_UAR_influence_battle:0 "中东棋盘"
 TNO_Cold_War_Victory_ID_51:0 "中东棋盘"
 UAR_IBC_desc:0 "中东冲突似乎是俄罗斯的战略死胡同，在那里我们的利益与德国的利益直接交织，导致来自复兴党的“阿拉伯社会主义者”崛起，他们玩世不恭地与维亚特卡和柏林合作。\n\n但我们有机会扭转局面，成为冷战中的一支重要力量。复兴党的阿拉伯国家最近联合起来，成立了阿拉伯联合共和国，准备与团结协定……以及我国合作。我们必须表明，未来与俄罗斯同在，经济繁荣与军事实力也是如此。\n\n影响力[MAR.GetFlag]§m[MAR.GetNameDEF]§!:[?UAR.UAR_faction_influence_array^1](每月增长§Y[?UAR.UAR_faction_influence_gain_array^1]§!)\n影响力[GER.GetFlag]§q[GER.GetNameDEF]§!:[?UAR.UAR_faction_influence_array^2](每月增长§Y[?UAR.UAR_faction_influence_gain_array^2]§!)\n影响力§V[UAR.GetFlag][UAR.GetNameDEF]§!:[?UAR.UAR_faction_influence_array^0](每月增长§Y[?UAR.UAR_faction_influence_gain_array^0]§!)\n\n目前由[UAR.GetFactionUARLeader]主导。§!"
