 MAR_Prestol_Clock_one_tt:0 "§Y你当警醒，坚固那剩下将要衰微的，因我见你的行为，在我神面前，没有一样是完全的。§!"
 MAR_Prestol_Clock_two_tt:0 "§Y那一千年完了，撒旦必从监牢里被释放，出来要迷惑地上的列国。§!"
 MAR_Prestol_Clock_three_tt:0 "§Y地上的君王、臣宰、富户、千夫长、壮士，和一切为奴的、自主的，都藏在山洞和岩穴里。§!"
 MAR_Prestol_Clock_four_tt:0 "§Y在天上、地上、地底下，没有能展开、能观看那书卷的。§!"
 MAR_Prestol_Clock_five_tt:0 "§Y有声音从宝座出来说：“神的众仆人哪，凡敬畏他的，无论大小，都要赞美我们的神！”§!"
 MAR_Prestol_Clock_six_tt:0 "§Y我看见羔羊揭开七印中第一印的时候，就听见四活物中的一个活物，声音如雷，说：“你来！ ”§!"
 MAR_Prestol_Clock_seven_tt:0 "§Y圣灵向众教会所说的话，凡有耳的，就应当听！得胜的，我必将神乐园中生命树的果子赐给他吃。§!"
 MAR_Prestol_Clock_eight_tt:0 "§Y所以要回想你是怎样领受、怎样听见的，又要遵守，并要悔改。§!"
 MAR_Prestol_Clock_nine_tt:0 "§Y那得胜又遵守我命令到底的，我要赐给他权柄制伏列国。§!"
 MAR_Prestol_Clock_ten_tt:0 "§Y看哪，他驾云降临，众目要看见他，连刺他的人也要看见他，地上的万族都要因他哀哭。这话是真实的。阿门！§!"
 MAR_Prestol_Clock_eleven_tt:0 "§Y主神说：“我是阿拉法，我是俄梅戛，是昔在、今在、以后永在的全能者。”§!"
 MAR_Prestol_Clock_twelve_tt:0 "§Y我就观看，见有§W一匹灰马§!，骑在马上的，名字叫做§e“死”§!，§e阴府§!也随着他。§!"
