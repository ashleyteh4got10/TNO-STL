 MAR_ogas_first_stage_effigy:0 "§Y阶段1:§!§G设计§!"
 MAR_ogas_first_spying_for_superpowers:0 "窥探超级大国"
 MAR_ogas_first_spying_for_superpowers_desc:0 "我们的特工将潜入德国、美国、日本和意大利的顶级科研机构，寻找并窃取对开发全国自动化系统有用的秘密知识和信息。"
 MAR_ogas_first_trip_to_guandong:0 "广东之旅"
 MAR_ogas_first_trip_to_guandong_desc:0 "广东是一个为企业和技术官僚创建的实验国度，蕴藏着巨大的潜力。通过前往这里的出差工作，与顶级企业的首席执行官和企业科学家（尤其是索尼公司）会面，我们将获得对开发全国自动化系统至关重要的经验。"
 MAR_ogas_first_imperial_academy:0 "建立帝国网络科学院"
 MAR_ogas_first_imperial_academy_desc:0 "外国经验固然很好，但它无法取代俄罗斯人的聪明才智。通过建立帝国网络科学院，俄罗斯在这一领域最优秀的人才将携手合作，使我们更加接近启动全国自动化系统的那一天。"
 MAR_ogas_first_our_previous_ideas:0 "我们以往的想法"
 MAR_ogas_first_our_previous_ideas_desc:0 "谢天谢地，我们不是从零开始。凭借我们在苏联和一些军阀国家处理大量信息的经验，我们可以更好地理解控制论。即使是这个自学成才的变态狂李森科的作品，或者是瑟克特夫卡尔远视主义者的乌托邦思想，也可能会让我们受益匪浅！"
 MAR_ogas_first_sort_the_designs:0 "明确我们的改进措施"
 MAR_ogas_first_sort_the_designs_desc:0 "在第一阶段结束时，我们有了许多发展和项目！然而，并非所有项目都是完美无缺的。通过对错误进行最后的修正，我们可以进入下一阶段的开发。"
 MAR_ogas_second_stage_effigy:0 "§Y阶段2:§!§G筹备§!"
 MAR_ogas_second_talk_with_ibm:0 "会见IBM公司"
 MAR_ogas_second_talk_with_ibm_desc:0 "国际商业机器公司是一家顶级科技公司。整个OSN的军事和民用机器都在使用他们的产品。利用我们亲爱的别洛泽尔斯基同志的老关系和其他一些方面，我们可以组织一次我们的科学家与IBM公司高层管理人员的会面。无论如何，这次会议一定会取得丰硕成果。"
 MAR_ogas_second_get_all_the_nerds_in_the_one_place:0 "甄选人才"
 MAR_ogas_second_get_all_the_nerds_in_the_one_place_desc:0 "国家需要最优秀的人才，因此应大幅提高通过学期考试和进入帝国网络科学院的要求。只有最聪明的人才有权创造科学和俄罗斯的未来！"
 MAR_ogas_second_math_analyze:0 "方案分析"
 MAR_ogas_second_math_analyze_desc:0 "目前，我们可以说，我们有许多进一步发展全国自动化系统的方案。通过进行数学分析、原理分析、预测分析和其他各种分析，我们必须确定全国自动化系统的哪些方案是最可行的。"
 MAR_ogas_second_cybernetics_cult:0 "控制论崇拜"
 MAR_ogas_second_cybernetics_cult_desc:0 "不仅政府，社会也应为应对OGAS做好准备。公共公司、宣传海报、广播和电视、玩具、儿童聚会表演等等。对控制论的赞美，以及OGAS将不仅是俄罗斯的未来，也是我们蓝色星球的未来的保证，必须完善每个方面。"
 MAR_ogas_second_glushkovs_seminars:0 "格卢什科夫研讨会"
 MAR_ogas_second_glushkovs_seminars_desc:0 "维克托·米哈伊洛维奇·格卢什科夫。他是一个传奇人物，联盟最高科学奖获得者，帝国网络科学院首席科学主任。全国自动化系统的创始人之一。我们必须为他提供舒适的工作条件，将他的工资提高10倍，并满足他的一切要求。通过参加他的研讨会，未来的控制论科学家不仅可以学习控制论，还可以活学活用。"
 MAR_ogas_third_stage_effigy:0 "§Y阶段3:§!§G开发§!"
 MAR_ogas_third_cybergrad_kazan:0 "伏尔加河畔的理想城"
 MAR_ogas_third_cybergrad_kazan_desc:0 "喀山周围的土地非常适合建造一座专门从事OGAS工作的新城市。新的家园将在一片荒芜的土地上拔地而起，成为新一代的城市！"
 VICTORY_POINTS_11339:0 "伏尔加河畔的理想城"
 MAR_ogas_third_tsars_financing:0 "增加融资"
 MAR_ogas_third_tsars_financing_desc:0 "很明显，政府目前为开发OGAS提供的资金不足。需要尽快提供新的资金，以继续开展项目工作。"
 MAR_ogas_third_kibersin:0 "国际合作署"
 MAR_ogas_third_kibersin_desc:0 "在全国自动化前几个阶段的发展过程中，外国以这样或那样的方式帮助了我们。现在是还人情的时候了！我们将向东京、罗马和华盛顿的各国科学家发出在伏尔加河畔的理想城工作的邀请，以便他们能够为人类的未来共同努力。当然，我们也会从中受益。"
 MAR_ogas_third_expand_the_institutions:0 "扩展发展网络"
 MAR_ogas_third_expand_the_institutions_desc:0 "目前，只有IAK、喀山和位于西俄罗斯最大城市的几家公司积极参与OGAS系统的开发。通过在俄罗斯其他地区开设IAK分支机构以及扩大现有的科学实验室和公司，我们将加快发展进程。"
 MAR_ogas_third_prepare_the_places:0 "基础设施的准备"
 MAR_ogas_third_prepare_the_places_desc:0 "遗憾的是，我们的城市还没有为未来做好准备。但这不会太久。通过道路现代化、无线电通讯现代化、安装新雷达，以及让沙皇的臣民普遍体验到技术进步带来的好处，我们将让社会和国家为启动全国自动化系统做好准备！"
 MAR_ogas_fourth_stage_effigy:0 "§Y阶段4:§!§G测试§!"
 MAR_ogas_foutrh_stress_test_kazan:0 "喀山试验系统"
 MAR_ogas_foutrh_stress_test_kazan_desc:0 "尽管OGAS系统已经准备就绪，但仍有许多方面需要测试。为了在工作条件下检验这些方面，我们必须在一个单独的城市——喀山引入OGAS系统，并观察它与其他未接入OGAS系统的邻近城市相比将如何运行。"
 MAR_ogas_foutrh_test_the_factory:0 "测试工厂"
 MAR_ogas_foutrh_test_the_factory_desc:0 "全国自动化系统项目的雄心越来越大，但对项目资金支持的需求也越来越大。进一步发展需要更多的投资。"
 MAR_ogas_foutrh_develop_army_verison:0 "军用系统"
 MAR_ogas_foutrh_develop_army_verison_desc:0 "当纳粹野兽还在我们的土地上肆意践踏时，我们怎么能谈论建设科学和人类未来这样雄心勃勃的计划！通过在我们的军队中引入控制论，我们可以在技术领域超越德国国防军，而德国曾经在这一领域处于领先地位。当最后一名德国惩罚者被自己的鲜血呛死的那一刻，他会知道他是被两名俄罗斯士兵和一名科学家杀死的。"
 MAR_ogas_foutrh_test_it_in_sgvuz:0 "大学测试系统"
 MAR_ogas_foutrh_test_it_in_sgvuz_desc:0 "现在是在高等教育机构系统中测试OGAS的时候了。此外，北方州立大学也是一个不错的选择。"
 MAR_ogas_foutrh_do_the_debug:0 "最终调试"
 MAR_ogas_foutrh_do_the_debug_desc:0 "全国自动化系统的启动工作已基本就绪。只需进行最后的修改，项目就可以启动了。"
 MAR_ogas_fifth_stage_effigy:0 "§Y阶段5:§!§G执行§!"
 MAR_ogas_intergrate_into_civil_economics:0 "融入民政部门"
 MAR_ogas_intergrate_into_civil_economics_desc:0 "全国自动化系统主要是一种改善人民生活的手段。将系统与经济计划系统连接起来，规划民间财政的分配和收支计划，将使沙皇臣民的生活得到质的改善，并释放出大量生产资源。"
 MAR_ogas_intergrate_into_millitary_economics:0 "融入军工复合体"
 MAR_ogas_intergrate_into_millitary_economics_desc:0 "是时候将OGAS纳入军工复合体了。很快，工厂和车间都将与该系统相连。"
 MAR_ogas_intergrate_into_army:0 "融入军队"
 MAR_ogas_intergrate_into_army_desc:0 "全国自动化信息核算和处理系统是沙皇柯西金和维克托·米哈伊洛维奇·格卢什科夫最雄心勃勃的计划。如果我们能够完成这个项目，它将给我们带来巨大的优势。然而，我们应始终实事求是地评估我们的能力。"
 MAR_ogas_fifth_integrate_into_education:0 "融入教育系统"
 MAR_ogas_fifth_integrate_into_education_desc:0 "全国自动化系统确实拥有无限的潜力。几乎可以瞬间获取大量信息的能力将推动教育部门的发展。我们只需将其巧妙地整合到现有系统中即可。"
 MAR_ogas_fifth_semiconductor_valley:0 "半导体谷"
 MAR_ogas_fifth_semiconductor_valley_desc:0 "伏尔加河畔的理想城项目已经证明了自己的价值。因此，我们决定进一步开发这座城市。也许我们不会有自己的硅谷，但半导体谷听起来也不错。"
 MAR_ogas_tick:0 "月度报告"
 MAR_ogas_tick_desc:0 "我们每个月都会收到一份工作报告。"
