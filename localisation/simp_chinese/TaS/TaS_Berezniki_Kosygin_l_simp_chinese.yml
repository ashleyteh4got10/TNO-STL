 MAR_ogas_deccat:0 "全国自动化系统"
 MAR_ogas_deccat_desc:0 "全国自动化信息系统是沙皇柯西金和维克托·米哈伊洛维奇·格卢什科夫最雄心勃勃的计划。如果我们能够完成它，它将给我们带来巨大的优势。然而，我们必须始终实事求是地评估我们的能力。\n\n[GetStageDescOGAS]"
 MAR_ogas_stage_one:0 "当前阶段:§Y设计§!\n\n该项目正处于起步阶段，许多想法尚未诞生。离实施还很遥远。"
 MAR_ogas_stage_two:0 "当前阶段:§Y筹备§!\n\n正确的开端已经成功了一半，因此在工作开始之前，一切都应该非常谨慎。目前，我们需要挑选出最有能力的人，让他们有机会参与到项目中来。"
 MAR_ogas_stage_three:0 "当前阶段:§Y开发§!\n\n积极的工作已经开始，现在是创建基本功能和配置系统的时候了。"
 MAR_ogas_stage_four:0 "当前阶段:§Y测试§!\n\n我们已经跨过了“卢比孔河”，是时候对创建的系统进行测试了。在这一阶段，我们必须测试全国自动化系统的运行情况，并对运行不良的部分进行修改。"
 MAR_ogas_stage_five:0 "当前阶段:§Y实施§!\n\n全国自动化系统的开发工作已经完成，是时候将其应用到人民帝国的实际生活中了。很快，我们的公民就能享受到自动化带来的成果。"
 MAR_OGAS_progress_title_txt:0 "全国自动化系统进程"
