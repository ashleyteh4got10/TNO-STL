 MAR_dossier_title_txt:0 "档案"
 MAR_NARIENMAR_DOSSIER:0 "§Y别列兹尼基的克格勃是否能预料到，在遥远的北方会出现一个极端的黑色百人团教派？无论如何，这个组织如今已经对新俄罗斯的国家安全构成了威胁，克格勃必须采取行动。初步调查结果表明，该组织的首领是伊万神父，一个长期失踪的前通敌分子。该组织的目标尚不明确，他们的行动十分隐秘，而且不择手段，极其残暴。有传言说，他们以“以上帝的名义”，公开处决了许多人，甚至还进行了斩首示众。他们与“宝座”的联系是毋庸置疑的，这也是我们必须不惜一切代价消灭这些恐怖分子的众多原因之一。§!"
 MAR_ARKHANGELSK_DOSSIER:0 "§Y芬兰情报机构和奥涅加“白匪”在阿尔汉格尔斯克附近的活动，早已为西俄罗斯革命阵线所知晓，但一直没有找到合适的机会铲除这些组织。如今，趁着西俄罗斯陷入混乱之际，这些反共分子又从阴影中钻了出来，并且更加肆无忌惮，为未来的“解放北俄罗斯”行动做准备。\n\n外部势力对“宝座”危机的干预，是一个不容忽视的问题，尤其是奥涅加“白匪”为阿尔汉格尔斯克的恐怖分子提供了掩护，这让我们很难抓到他们。除了这种临时性的联盟之外，这些特务和煽动者与“宝座”的领导层并没有直接联系，他们只为其外国主子卖命。§!"
 MAR_SYKTYVKAR_DOSSIER:0 "§Y帝俄复兴协会，是科米共和国众多小型政党中的一个。出人意料的是，就在中央政府忙于筹备维亚特卡代表大会的时候，这个由臭名昭著的安德烈·季基领导的政党，竟然成为了“宝座”的思想核心，并且公开活动，有恃无恐。\n\n对于他们的真实目的，克格勃只能猜测。但有一点是肯定的，他们正在公开煽动人们反对“自封的沙皇”和青年俄罗斯党，还在当地与城市警察和其他团体发生冲突。尽管帝俄复兴协会的行为，明显是为了将人们的注意力从“宝座”的真正领导者身上引开，但我们仍然必须将其扼杀在萌芽状态，哪怕仅仅是为了维护国家公民的和平与安全。§!"
 MAR_GORKY_DOSSIER:0 "§Y阿列克谢·柯西金的上位，不仅引发了右翼势力的强烈反对，也激怒了一些左翼人士。在高尔基坦克军和西俄罗斯革命阵线的老兵中，反政府情绪蔓延，并自发组建了由拉先科将军领导的“人民红军”。\n\n与名字相反，这支“军队”实际上是一个老兵组织，他们反对柯西金社会主义中的“沙皇遗毒”。在与宝座教派的斗争中，与之关系密切的高尔基工厂工会组织，更值得我们关注。克格勃有理由相信，这些人可能与宝座以及全国各地的恐怖袭击事件有关联。§!"
 MAR_PERM_DOSSIER:0 "§Y令我们深感遗憾的是，雅利安兄弟会的匪徒已经渗透进了彼尔姆，其程度远超我们的想象。随着极右翼势力在全国范围内发动大规模起义和恐怖袭击，这些邪教分子也趁机兴风作浪。情报显示，雅利安兄弟会的首领是尼古拉·伊万诺维奇·库库什金，一个臭名昭著的雅利安刽子手，人称“巴德尔·戈尔茨”。目前，他们与“宝座教派”领导层之间的关系尚不明确，尽管一些在维亚特卡代表大会现场的目击者声称，袭击者中可能出现了雅利安兄弟会的成员。\n\n然而在彼尔姆，“雅利安兄弟会”的暴行罄竹难书。大规模处决、建筑物爆炸、村庄焚烧以及虐待妇女等暴行，其残忍程度堪比巴巴罗萨行动期间纳粹刽子手的所作所为。我们必须不惜一切代价，尽快阻止这些暴行。§!"
 MAR_SAMARA_DOSSIER:0 "§Y卡津别克政府曾试图消灭俄罗斯解放委员会，但最终以失败告终。如今，在维克多·马尔采夫的领导下，这些曾经放下武器的士兵和平民，再一次拿起了武器。我们只能猜测这些人是否与“宝座”教派存在联系。\n\n俄罗斯解放委员会目前已经发展成为一支强大的军事力量，控制着伏尔加河流域的多个定居点，包括与莫斯科专员辖区接壤的巴拉科沃市。巴拉科沃市已经成为了新一轮走私活动的中心，其规模之大，堪比安德烈·弗拉索夫在世时米哈伊尔·奥克坦的活动。§!"
