 UAR_Faction_GER_Pro_Pakt_Propaganda:0 "宣传团结协定"
 UAR_Faction_GER_Pro_Pakt_Propaganda_desc:0 "我们要在阿拉伯联合共和国取得成功，最简单的办法就是开展宣传活动，推动他们加入团结协定。我们将用与欧洲主宰者结盟所带来的所有好处来诱惑他们，首先是更好的保护、经济奖励等等。"
 UAR_Faction_GER_Anti_Rus_Propaganda:0 "反俄宣传"
 UAR_Faction_GER_Anti_Rus_Propaganda_desc:0 "我们可以随心所欲地喜欢他们，但如果俄罗斯人更喜欢他们，我们肯定会失去他们的好感。如果我们开始对俄罗斯进行宣传，就会避免这种情况的发生。我们将指出俄罗斯人的无能和自私，指出他们不为阿拉伯人的利益服务，而只为自己的利益服务。"
 UAR_Faction_GER_Invest_in_Arab_Industries:0 "投资阿拉伯工业"
 UAR_Faction_GER_Invest_in_Arab_Industries_desc:0 "在阿拉伯经济，特别是工业领域占有一定份额，我们就能吸引阿拉伯人加入我们的阵营，在冷战中获得一个重要盟友。对其进行一定数量的投资将增加他们对我们投资的依赖性，这将促使他们在不久的将来加入我们的联盟。"
 UAR_Faction_GER_Anti_Independence_Propaganda:0 "反独立宣传"
 UAR_Faction_GER_Anti_Independence_Propaganda_desc:0 "阻止阿拉伯人进入俄罗斯的势力范围固然重要，但他们保持独立也无法为我们带来更多利益。因此，我们应扩大宣传力度，防止阿拉伯人在这场冲突中保持中立。"
 UAR_Faction_GER_send_advisors_to_Arabs:0 "派遣俄罗斯军事顾问前往阿拉伯"
 UAR_Faction_GER_send_advisors_to_Arabs_desc:0 "加强我们与阿拉伯联合共和国的军事关系，是实现这一努力的关键所在。我们的目标是让他们依赖我们的军事实力，使他们免受任何威胁而感到安全。我们将派遣军事顾问前往，协助达成这一目的。"
 UAR_Faction_GER_mediterranean_sea_naval_exercises:0 "在地中海进行军事演习"
 UAR_Faction_GER_mediterranean_sea_naval_exercises_desc:0 "在地中海为德国海军举行军事演习，对阿拉伯和俄罗斯军队来说都是一次重要的实力展示。这将向阿拉伯军队表明，我们统治着波涛汹涌的大海，他们土地的安全得到了帝国的保障，希望以此说服他们远离俄国人，转而投靠我们。"
 GER_Faction_Join_RUS_Mission:0 "§R[UAR.GetFlag]阿拉伯联合共和国倾向[MAR.GetFlag]俄罗斯势力圈§!"
 GER_Faction_Join_RUS_Mission_desc:0 "我们的外交官表示担心，如果外交局势继续这样发展下去，在这场外交对峙结束后，阿拉伯将加入[MAR.GetFlag]§e俄罗斯人民帝国§!。"
 GER_UAR_Faction_Join_Pakt_Mission:0 "§G[UAR.GetFlag]阿拉伯联合共和国加入了我们的势力圈§!"
 GER_UAR_Faction_Join_Pakt_Mission_desc:0 "我们的外交官告诉我们，如果外交形势一如既往，阿拉伯人将加入§s团结协定§!这将加强我们在冷战中的地位。"
 GER_UAR_Faction_Close_Faction_Mechanic_Mission:0 "§V[UAR.GetFlag]阿拉伯联合共和国§!§R将保持独立！§!"
 GER_UAR_Faction_Close_Faction_Mechanic_Mission_desc:0 "我国外交官表示担心，如果外交局势继续如此，阿拉伯联合共和国可能会决定在冷战中§V保持中立§!。"
 GER_Faction_Join_RUS_Mission.tt:0 "§R[UAR.GetFlag]阿拉伯联合共和国将会加入§e俄罗斯势力圈§!§!"
 GER_Faction_Join_Pakt_Mission.tt:0 "§G[UAR.GetFlag]阿拉伯联合共和国将会加入§s团结协定§!§!"
 UAR_Faction_MAR_Pro_RUS_Propaganda:0 "对俄罗斯的宣传"
 UAR_Faction_MAR_Pro_RUS_Propaganda_desc:0 "为了说服阿拉伯联合共和国加入我们的行列，我们将发起一场宣传运动，促进我们两国之间的合作，并提醒他们这一未来联盟的好处。"
 UAR_Faction_MAR_Anti_Pakt_Propaganda:0 "反团结协定宣传"
 UAR_Faction_MAR_Anti_Pakt_Propaganda_desc:0 "我们不能允许我们的阿拉伯朋友回到压迫者的假同盟中去，因此，我们将开展反盟约宣传，详细说明他们无力解决问题，并提醒阿拉伯人与敌人合作的代价。"
 UAR_Faction_MAR_Invest_in_Arab_Industries:0 "投资阿拉伯工业"
 UAR_Faction_MAR_Invest_in_Arab_Industries_desc:0 "为了帮助阿拉伯人做出对我们有利的决定，我们将投资于阿拉伯的工业经济，以促进其发展。我们希望他们理解我们帮助他们的决心，并加入我们的联盟。"
 UAR_Faction_MAR_send_advisors_to_arabs:0 "派遣俄罗斯军事顾问前往阿拉伯"
 UAR_Faction_MAR_send_advisors_to_arabs_desc:0 "通过向阿拉伯联合共和国派遣军事顾问，我们将为他们的军队提供最好的训练和理论，使他们能够保卫自己的国家。此外，这还将加强我们在阿拉伯政治中的影响力，并可能促使他们加入我们的联盟。"
 UAR_Faction_MAR_Remember_who_helps_them:0 "“德国人总是会在背后给你来上一刀”"
 UAR_Faction_MAR_Remember_who_helps_them_desc:0 "阿拉伯人与一个只想奴役他们的法西斯反动国家结盟是毫无意义的。然而，我们不能允许这种情况发生。现在是提醒阿拉伯人他们与法西斯的友谊真正意味着什么的时候了。我们的宣传将大喊“德国人总是会在背后给你来上一刀”。"
