 MAR_Kosygin_UAR.1.t:0 "中东探戈"
 MAR_Kosygin_UAR.1.d:0 "外交部会长久地记住这个夜晚，以及之前的几个夜晚。麻烦始于俄罗斯志愿者在中东战争中与德国人站在同一阵营。这对我们与美洲和亚洲盟国的关系产生了负面影响，因为我们也反对他们的利益。\n\n现在，外交部的每个人都在焦急地等待着最近成立的阿拉伯联合共和国发来相互合作的建议。但它从未到来。至于德国人是否收到过，那就不得而知了，因为柏林的官僚们玩扑克玩得正欢。\n\n“够了，现在是我们自己掌握主动权的时候了。趁现在还来得及，我现在就去大马士革。”这就是因睡眠不足而精疲力竭的德米切夫的决定。接下来的几个小时里，他一直在打电话、听写电报和信件，他在飞机上睡着了。"
 MAR_Kosygin_UAR.1.a:0 "我们只能梦想着和平。"
 MAR_Kosygin_UAR.2.t:0 "双头鹰"
 MAR_Kosygin_UAR.2.d:0 "那是一个格外美好的早晨，即使在国民议会长时间的投票过程中，彼得的心情也丝毫未受影响。大部分时间里，他和手下一直在观察与会的德国代表团的举动，他们的领导人赫尔穆特·布劳恩看起来似乎在期待着什么。不过，也许这只是彼得的一厢情愿。一名身着军装的士兵走上讲台，宣布中期投票结果。显然，一切都朝着有利于俄罗斯的方向发展。\n\n“在座的各位，请注意！”这名将军的喊声打断了阿拉伯和欧洲老人们的窃窃私语。顷刻间，所有目光都集中在了典礼大门口站着的萨拉赫·贾迪德身上。“艾哈迈德·哈桑·贝克尔和他那伙疯狗刚刚试图冲击国民议会！他们手持德国制造的步枪，已被逮捕并缴械，艾哈迈德本人也被拘捕了。”将军一边说着，一边用手势指向德国代表团。\n\n在这番话之后，德国代表团抗议起来，试图与俄罗斯代表团对峙。但他们被联合共和国军队的士兵拦下。经过俄罗斯代表团时,赫尔穆特审视般地打量着露出微笑的彼得。"
 MAR_Kosygin_UAR.2.a:0 "我们只能梦想着和平。"
 MAR_Kosygin_UAR.3.t:0 "黑鹰"
 MAR_Kosygin_UAR.3.d:0 "那是一个格外不愉快的早晨。对彼得来说，而在国民议会的漫长投票过程更是雪上加霜。大部分时间里，他和手下一直在观察与会的德国代表团的举动。他们的领导人赫尔穆特·布劳恩看起来似乎在期待着什么。仿佛有什么人即将闯入一般...一名身着军装的士兵走上讲台，宣布投票结果。显然，双方都没有明显的优势。\n\n“在座的各位，请注意！”这名将军的吼声打断了阿拉伯和欧洲老人们的窃窃私语。顷刻间，所有目光都集中在了典礼大门口站着的艾哈迈德·哈桑·贝克尔和他的私人护卫身上。“俄罗斯代表团已被捕获从事了反共和国的行为！所有成员都必须立即接受惩罚，因为他们试图干涉主权国家的内政！”说完他用手势指向俄罗斯代表团。\n\n虽然彼得明白不会有逮捕，只是遣送回俄罗斯，但这并没给他带来任何欣慰。在艾哈迈德的手下的陪同下走出去时，彼得听到一声嘲弄的“再见！”"
 MAR_Kosygin_UAR.3.a:0 "漫漫归家路..."
 MAR_Kosygin_UAR.4.t:0 "一片羽毛"
 MAR_Kosygin_UAR.4.d:0 "那是一个格外不愉快的早晨。对彼得来说，而在国民议会的漫长投票过程更是雪上加霜。大部分时间里，他和手下一直在观察与会的德国代表团的举动。他们的领导人赫尔穆特·布劳恩看起来似乎在期待着什么。仿佛有什么人即将闯入一般...一名身着军装的士兵走上讲台，宣布投票结果。显然,，双方都没有明显的优势。\n\n“在座的各位，请注意！”这名将军的吼声打断了阿拉伯和欧洲老人们的窃窃私语。顷刻间，所有目光都集中在了典礼大门口站着的哈菲兹·阿萨德身上。\n\n“前所未有的间谍活动和干涉共和国内政的行为已被揭发！德国和俄罗斯特工试图动摇我们的稳定，剥夺我们的自由，将阿拉伯人当作他们全球游戏中的筹码！好吧,告诉你们的主子，我们不打算按你们的规则来玩。”说完他先是用手势指向德国代表团，紧接着又指向俄罗斯代表团。\n\n在这番话之后，德国和俄罗斯代表团完全忘记了自己的阿拉伯伙伴的存在，纷纷扑向对方。\n\n“德国一方试图把责任推给我们！”\n\n“将军手里也有你们卷入其中的情报！是克格勃自己犯了错误,现在想把锅甩给德国一方！”"
 MAR_Kosygin_UAR.4.a:0 "既不为自己，也不为他人。"
 berez_dobrovoltsy_world_news.14.t:0 "[Get_newspaper_header]阿拉伯联合共和国向俄罗斯靠拢"
 berez_dobrovoltsy_world_news.14.d:0 "今日，大日耳曼国与俄罗斯人民帝国为争夺中东政坛新势力——阿拉伯联合共和国的归属而展开的较量终于尘埃落定。或喜或忧，这场外交博弈的胜利者是阿列克谢·柯西金的红色帝国。阿拉伯国家已与俄罗斯签署了关键的合作互助协议，实质上进入了其势力范围。\n\n这一变化也引发了该国政治气候的转变：倡导人民主权和革命变革的坚定拥护者萨拉赫·贾迪德崛起，复兴社会党重申了自己的党名。\n\n俄罗斯的策略奏效了，这个被遗忘的帝国正重返世界舞台。"
 berez_dobrovoltsy_world_news.14.a:0 "这值得骄傲，不是吗？"
 berez_dobrovoltsy_world_news.14.b:0 "新秩序晃动了几下，但没有被推翻。"
 berez_dobrovoltsy_world_news.14.c:0 "妈的。"
 berez_dobrovoltsy_world_news.15.t:0 "[Get_newspaper_header]阿拉伯联合共和国向德国靠拢"
 berez_dobrovoltsy_world_news.15.d:0 "今日，大日耳曼国与俄罗斯人民帝国为争夺中东政坛新势力——阿拉伯联合共和国的归属而展开的较量终于尘埃落定。或喜或忧，这场外交博弈的胜利者是欧洲的霸主。阿拉伯国家已与德国签署了关键的合作互助协议，实质上进入了其势力范围。\n\n这一变化也引发了该国政治气候的转变：随着主张加强党权和阿拉伯优越性的艾哈迈德·贝克尔的崛起，复兴党继续向右倾斜。\n\n俄罗斯虽怀揣着走向全球的雄心壮志，但其策略似乎以失败告终。"
 berez_dobrovoltsy_world_news.15.a:0 "失败，彻底失败！"
 berez_dobrovoltsy_world_news.15.b:0 "魔鬼永远不忘要回施舍出去的东西。"
 berez_dobrovoltsy_world_news.15.c:0 "我们不过是付出巴伐利亚啤酒，再干一杯！"
 berez_dobrovoltsy_world_news.16.t:0 "[Get_newspaper_header]阿拉伯孤立"
 berez_dobrovoltsy_world_news.16.d:0 "今天，大日耳曼国和俄罗斯人民王国为争夺中东政治新角色——阿拉伯联合共和国的命运所展开的竞争已经结束。令一些人高兴和痛苦的是，这场外交对峙以阿拉伯国家对德国和俄罗斯的疏远而告终，最终导致其拒绝与这两个大国签署任何合作协议。阿拉伯联合共和国正在陷入孤立。\n\n这一变化也导致了该国政治气候的转变：在一场不流血的政变中，名不见经传的哈菲兹·阿萨德上台执政，试图尽可能巩固手中的权力。\n\n这块多米诺骨牌已经稳住，而东部的现状仍未改变。"
 berez_dobrovoltsy_world_news.16.a:0 "至少他们没要倒向德国。"
 berez_dobrovoltsy_world_news.16.b:0 "欧洲的命运仍不明朗。"
 berez_dobrovoltsy_world_news.16.c:0 "至少他们没被俄罗斯人绑在一块儿。"
 berez_dobrovoltsy_world_news.17.t:0 "[Get_newspaper_header]中东之战"
 berez_dobrovoltsy_world_news.17.d:0 "今天，俄罗斯外交官在中东沙漠中与德国外交官展开紧张的外交争吵、口水战还有幕后阴谋的对峙，如此激烈也预示着德国国防军与俄罗斯军队终会在战场上有不可避免的对抗。 \n\n阿拉伯联合共和国的出现本是俄德志愿军（或者换个角度看，干预主义带来的结果）意外合作的结果。现在务实的阿拉伯外交陷入停滞，阿拉伯联合共和国将不得不选择一方或孑然于世。"
 berez_dobrovoltsy_world_news.17.a:0 "我们没有犯错的余地。"
 berez_dobrovoltsy_world_news.17.b:0 "德国狼能驯服俄国熊吗？"
 berez_dobrovoltsy_world_news.17.c:0 "犯错可不是德国的权利。"
