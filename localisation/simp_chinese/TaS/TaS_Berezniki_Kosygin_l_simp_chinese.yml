 MAR_antiprestol_decision_one:0 "摧毁宝座基地\n£manpower_texticon §Y500§! £weapon_icon §Y100§!"
 MAR_antiprestol_decision_one_tt:0 "我们将突袭强盗的营地。这次行动的成功实施将导致宝座在这一地区的影响力下降，但必须记住，过于严厉的手段会疏远人民。\n[!MAR_antiprestol_decision_one_click_enabled]\n[!MAR_antiprestol_decision_one_click]"
 MAR_antiprestol_decision_two:0 "开展反对宝座的宣传活动\n£political_power_texticon §Y25§!"
 MAR_antiprestol_decision_two_tt:0 "我们将在这一地区开展宣传活动，诋毁宝座。这不会产生立竿见影的效果，但会降低宝座的声望增长。\n[!MAR_antiprestol_decision_two_click_enabled]\n[!MAR_antiprestol_decision_two_click]"
 MAR_antiprestol_decision_three:0 "清除宝座特工\n£command_power  §Y5§!"
 MAR_antiprestol_decision_three_tt:0 "我们将消灭主要的宝座特工。消灭这些特工将严重打击土匪在这一地区的实力，有助于我们今后的行动。\n[!MAR_antiprestol_decision_three_click_enabled]\n[!MAR_antiprestol_decision_three_click]"
