 MAR_OGAS_increase_progress_tt:0 "§Y当前阶段§!的§G进度§!将增加§Y[?MAR_ogas_gain|1%]§!\n\n"
 MAR_OGAS_increase_stats_tt:0 "特性将通过以下方式增加：\n\n§B安全性:§!§Y[?MAR_ogas_char_gain|1%]§!\n\n§B效率:§!§Y[?MAR_ogas_char_gain|1%]§!\n\n§B复杂度:§!§Y[?MAR_ogas_char_gain|1%]§!\n\n"
 MAR_OGAS_do_the_check_tt:0 "如果当前阶段的进度达到100%，§G就会过渡§!到下一阶段！"
 MAR_ogas_first_stage_spies_tt:0 "我们将在超级大国开展几次间谍活动，希望能产生一些效果。"
 MAR_OGAS_beeg_growth_spy_tt:0 "这将极大地推动我们的进展。"
 MAR_OGAS_mid_spy_tt:0 "这将使我们的效率略有提升"
