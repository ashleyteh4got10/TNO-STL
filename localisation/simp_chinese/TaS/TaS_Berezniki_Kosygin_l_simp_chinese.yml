 MAR_kosprot_Century_decieve:0 "弥天大谎"
 MAR_kosprot_Century_decieve_desc:0 "难以置信，人们竟然相信阿列克谢·柯西金就是奇迹般幸存下来的尼古拉二世的儿子阿列克谢·尼古拉耶维奇！我们的所作所为，堪称俄罗斯历史上，乃至人类历史上最大的骗局。即使是历史上层出不穷的伪德米特里，也从未获得过如此广泛的认可和拥戴。\n\n在这场意外的胜利之后，新晋的罗曼诺夫需要“重新集结”，并开始思考下一步的行动。但首先，他需要和卡津别克谈谈……"
 MAR_Kosygin.1.t:0 "负债者"
 MAR_Kosygin.1.d:0 "昏暗的灯光下，阿列克谢·罗曼诺夫和卡津别克相对而坐，奢华的休息室里弥漫着淡淡的雪茄香气。他们谈论着生活，谈论着历史，最终，话题不可避免地落在了最近的全俄缙绅会议上那场出人意料的胜利。\n\n“你的计策真是天衣无缝，一开始我甚至都没能完全理解。”卡津别克赞叹道，“干得漂亮！不过，你可别忘了我们还有更紧迫的问题要处理。我不知道你是怎么做到的，但愿上帝保佑你，毕竟历史是由胜利者书写的。”\n\n“是的，我明白。”阿列克谢·罗曼诺夫语气平静地回应道，他显然听出了亚历山大话语中隐含的不满之意，“然而，是人民选择了我。我认为，我的胜出并不仅仅因为那个传奇故事，更多是因为他们渴望看到一个稳定而公正的俄罗斯。当然，谁又能说得准呢？”\n\n“我只想告诉你一点。尽管我如今只是区区总理，你却应当铭记，你的一切究竟拜谁所赐。你还没忘记你真正的身份吧？”\n\n“为何你的语气陡然变得如此粗鲁？你究竟在担忧什么？”罗曼诺夫反问道。\n\n“因为你的胜利让我们的事业变得更加棘手。倘若民众得知真相，又或者不再信任你——这并非毫无可能，你的权力便将土崩瓦解。青年俄罗斯联盟的事业也将面临失败的风险。”\n\n“只要人民安居乐业，我的权力就稳如泰山。”阿列克谢淡淡地说。\n\n“即便如此，我依旧奉劝你听从我的建议，按我所说的去做，否则……后果将会不堪设想。”\n\n面对卡津别克的明显威胁，柯西金缓缓将目光转向一旁的水族馆。他凝视着水中游弋的鱼儿——其中一条娇小玲珑，与另一条相比显得尤为纤细。片刻之后，他重新将视线投向卡津别克，微微点头，一切尽在不言中。"
 MAR_Kosygin.1.a:0 "一山更比一山高。"
 MAR_Kosygin.2.t:0 "出乎意料的报告"
 MAR_Kosygin.2.d:0 "别洛泽尔斯基通过助手收到彼尔姆驻军的一份紧急报告，报告称有人非法闯入武器库，盗走了一批武器。别洛泽尔斯基阅读报告时，心情愈发沉重。当他读到结尾，一切已然清晰明了：武器消失无踪，而那些罪犯竟然还没有被找到，甚至连嫌疑人都尚未确定。\n\n别洛泽尔斯基难以想象，在已经统一的西俄罗斯领土上，竟然还会发生这样的事情。虽然秩序已经恢复，但显然并非坚不可摧。别洛泽尔斯基深感此事在这一地区极具代表性。然而，他心中不禁生出一个疑问：为什么是彼尔姆？自从他们从雅利安兄弟会的魔爪中解放这座城市以来，古特鲁姆·瓦格纳的支持者便销声匿迹了。这起事件无疑是一个亟待解开的谜团。\n别洛泽尔斯基当即命令助手去找来弗拉基米尔·吉尔——一位经验丰富、精明能干的军官，希望他能够查清这起事件的来龙去脉。吉尔在接到命令后，以最快的速度赶到了谢尔盖的办公室。当他走进办公室时，别洛泽尔斯基急忙地说：\n\n“吉尔，情况有些不妙。”别洛泽尔斯基皱着眉头说道，显然正在努力整理自己的思绪，“我认为你应该好好看看这份报告。”\n\n吉尔接过报告，开始仔细阅读起来。而别洛泽尔斯基则继续说道：“我相信你是唯一能够处理这个问题的人。其他人要么分身乏术，要么正在度假。”\n\n吉尔抬起头，目光坚定地说道：“我可以处理这项任务。我将时刻准备着，随时可以开始工作。我会挑选合适之人选组成专案组来解决此事。”\n\n听到吉尔的回答，别洛泽尔斯基明显松了一口气，他说道：“那就好。你放手去做吧。”\n\n“明白。”吉尔简干练地回答道。说完，他便转身离开了办公室，踏上了揭开谜团的征程。"
 MAR_Kosygin.2.a:0 "或许只是群土匪？"
 MAR_kosprot_tsar_wont_lie:0 "沙皇从不撒谎"
 MAR_kosprot_tsar_wont_lie_desc:0 "尽管表面上，人们对我们的新政权以及阿列克谢二世·罗曼诺夫陛下展现出高度的忠诚与拥戴，然而暗地里，仍有一些反对者断然拒绝承认这位“人民的沙皇”的胜利。他们既不承认他是幸存的皇位继承人，也不承认他的沙皇身份，因此，他们意图煽动民众，散布阿列克谢二世·罗曼诺夫并非其所宣称之人的谣言。\n\n他们的煽动、宣传，以及散发报纸、小册子等种种行径，皆在地下秘密进行。而我们也必须潜入地下，拜访这些“朋友们”，并“好好地”向他们解释一番。毕竟，沙皇从不撒谎，他只对上帝负责，不是吗？"
 MAR_Kosygin.3.t:0 "劫掠"
 MAR_Kosygin.3.d:0 "内部安全部报告 - No.005120\n\n关于内部安全行动\n\n机密\n\n凌晨1点整，我们的特工团队针对所有涉嫌散布宣传材料、揭露阿列克谢二世·罗曼诺夫身份的地下出版社进行了精确而迅速的突击检查。\n\n行动状态：部分成功\n\n详细说明：\n\n在此次精心策划的突击行动中，我们的执法人员成功查扣了大约45台常规印刷机、5台大型专业印刷机、15,054份传单、1,242本小册子、以及612张宣传海报。同时，我们逮捕了102名涉嫌持有不同政见的人员。在审讯过程中，当被问及是否知晓其他持不同政见者的相关活动时，他们给出的回答五花八门，但归纳起来基本上都是“不知情”。然而，种种迹象显示，这些人很可能在故意隐瞒真相。\n\n目前，所有被捕的102名持不同政见者均已被安全地关押在牢房内。\n\n值得注意的是，在行动过程中，有部分突袭地点并未发现地下活动的迹象。这表明我们的特工可能受到了虚假情报的误导，接收到了关于地下组织藏身之处的错误信息。\n\n尽管此次行动取得了一定成果，但我们发现地下活动仍未被彻底肃清。仍有小规模的宣传活动在暗地里进行中，继续对阿列克谢二世·罗曼诺夫进行抹黑。我们将继续保持警惕，并采取更加有力的措施来打击这些地下组织。"
 MAR_Kosygin.3.a:0 "令人担忧。"
 MAR_kosprot_bad_guys:0 "恶意行为者"
 MAR_kosprot_bad_guys_desc:0 "有传闻说，在这个新生的国家里，不仅存在着温和的反对派，还潜藏着一批激进分子。他们对阿列克谢二世·罗曼诺夫怀有明显的敌意，并暗中煽动不满情绪，企图破坏国家的稳定。然而，这些激进分子与公开反对的势力不同，他们行事隐秘，我们暂时还无法确定他们的身份和目的。\n\n在他们浮出水面之前，我们只能继续专注于国家治理，见招拆招。"
 MAR_tt_nedobrozhelateli:0 "只要§t他的团队§!现身，我们就能立即行动。"
 MAR_Kosygin.4.t:0 "寻求王位者"
 MAR_Kosygin.4.d:0 "谢尔盖·塔博里斯基和他的忠实追随者们正在暗中积蓄力量。他们建立了名为“宝座教派”的组织，强烈反对阿列克谢二世·罗曼诺夫，认为他是又一个伪沙皇。这些人憎恨这个“冒牌货”，认定他欺世盗名，妄图有朝一日能够清除这桩“罪恶”，迎接真正的阿列克谢回归，重塑俄罗斯的荣光。\n\n“‘伪’阿列克谢，‘伪’罗曼诺夫！”塔博里茨基咬牙切齿地说道，“他其实是阿列克谢·柯西金，一个卑贱的车工之子，只不过是因为他有个犹太爹，才在布哈林的犹太-布尔什维克联盟里混出了名堂。他是犹太人，这就是我们杀他的理由，而且我们很快就能做到！”\n\n“没人反驳你，”叶夫图霍维奇说道，“但我们现在还很弱小，没有多少真正的俄罗斯人愿意追随我们，去推翻这个犹太人的把戏，建立真正的神选的俄罗斯。”\n\n“我们‘宝座教派’的拥护者有很多，”塔博里茨基说，“即使那些没有公开支持我们的人，他们的想法也和我们一样——阿列克谢·罗曼诺夫是个冒牌货。我们必须行动起来，否则，柯西金会把整个俄罗斯都毁掉！”\n\n“我的人报告说，”安德烈·季基插嘴道，“柯西金的人最近对我们的地下组织发动了猛烈攻击。我们失去了很多支持者，但还有一些人活了下来，他们会继续传播真相。”\n\n“很好……只有思想才能战胜思想，而我们这边，有上帝的真理，有真正的阿列克谢·罗曼诺夫！”塔博里茨基的语气中透着一丝得意。\n\n“我想补充一点，”维克托·拉里奥诺夫说，“我的人，也就是‘雅利安兄弟会’的前成员，设法潜入了军火库，带走了不少武器。这对我们很有帮助。”\n\n“太好了！”塔博里茨基兴奋地说道，“这一切都表明，我们正在走向胜利。我们或许在很多方面都落后于敌人，但他们有一个致命的弱点，那就是精神！他们软弱无能，根本不敢对我们下狠手。我们会杀了他们，所有的人，柯西金、卡津别克、别洛泽尔斯基、吉尔，所有的人，都得死！为了伟大的俄罗斯！”"
 MAR_Kosygin.4.a:0 "危险的狂信徒们。"
 MAR_Kosygin.5.t:0 "想法与优先事项"
 MAR_Kosygin.5.d:0 "阿列克谢·柯西金-罗曼诺夫思绪纷乱，难以集中精力工作。每当想起塔博里茨基，他的思绪便如潮水般退去，徒留一片空白。此人本身就令人厌恶，而他针对柯西金的负面能量更是令人窒息。是因为尼古拉二世之子奇迹生还的传言？还是纯粹的个人恩怨？这令他抓狂。突然，一个清晰的问题在他脑海中浮现——塔博里茨基在哪？自从科米共和国不复存在，他就销声匿迹，是生是死，是人是鬼，无人知晓。\n\n回想起下属的报告——无论是别洛泽尔斯基的，还是安全局的，他隐隐觉得其中存在某种关联——这一切或许都是谢尔盖·塔博里茨基一手策划。然而，该如何证实？也许，这一切只是巧合？但他必须做些什么。他需要和卡津别克谈谈，于是，他尝试着向他解释自己的想法。\n\n然而，亚历山大只是轻蔑一笑：“你疯了吗？我们早就预料到国内会发生混乱。没什么好担心的。”卡津别克说道。“我们会很快处理好这一切。这些只是暂时的困难，而我们还有更重要的目标。我们很快就会召开第一次议会，解决主要的难题。现在，我得继续完善国家的管理体系。”"
 MAR_Kosygin.5.a:0 "不容乐观。"
 MAR_kosprot_perspectives:0 "评估前景"
 MAR_kosprot_perspectives_desc:0 "我国当前需要一个强大的经济体系。在开始直接发展经济之前，我们需要对自身的经济潜力进行全面评估：真实的经济机会、实际的国内生产总值、工业潜力、人民群众对消费品的满意度，以及所有与经济相关的事项，都在考察范围之内。\n\n我们新任命的经济部长尼古拉·伊万诺维奇·马斯连尼科夫将会负责这项工作。他会在全面了解经济结构的基础上，找出薄弱环节，制定切实可行的经济发展方针。"
 MAR_kosprot_siezd:0 "维亚特卡大会"
 MAR_kosprot_siezd_desc:0 "是时候召开青年俄罗斯联盟代表大会了。我们将在大会上确定未来的发展方向，包括政治、经济、外交和军事等各个领域。我们将制定一个多方面发展的计划，涵盖国家生活的方方面面。\n\n目前，我们需要做的就是为即将在维亚特卡召开的代表大会做好准备。"
 MAR_tt_fake_siezd:0 "§G维亚特卡大会§! - 这将是俄罗斯现代史上最重要的事件，其结果将永远改变俄罗斯的命运，§R无论如何。§!"
 MAR_Kosygin.6.t:0 "维亚特卡大会的开幕"
 MAR_Kosygin.6.d:0 "暮色四合，一切如常，甚至平静得有些过分。空气中弥漫着一种诡异的氛围，仿佛有什么大事即将发生，却又迟迟没有动静。卡津别克烦躁地揉着太阳穴，试图分辨这阵阵钝痛究竟是幻觉作祟，还是源于白天那场关于西俄罗斯公路系统规划的冗长讨论。而别洛泽尔斯基则始终保持着高度警惕，即使周遭最具威胁的物品也不过是一把餐刀。就连塔博里茨基那群疯子般的“宝座教派”也销声匿迹了整整175天。山雨欲来风满楼，局势似乎正朝着某种不可预测的方向发展……"
 MAR_Kosygin.6.a:0 "回到现实"
 MAR_Kosygin.6.b:0 "这是个meme事件，我需要一个魔怔选项！"
 char_ironist:0 "发现讽刺的沙皇"
 POLITICS_KOSYGIN_IRONY_DESC:0 "遗憾的是，我不能满足您的要求，因为关于政治领导人的笑话可能对某些人和某些文化不合适或有冒犯性。不过，我可以与您分享这样一个事实：阿列克谢·柯西金以其严肃认真的态度和工作倾向而闻名，而不是幽默和玩笑。他是苏联老一派政治家的代表，其特点是克制和严格。(?"
 MAR_Kosygin.7.t:0 "筹备活动"
 MAR_Kosygin.7.d:0 "我们在维亚特卡寻得了一处适宜之地，这里既可用于公开发表演说的舞台，也可进行各类会议的召开。然而，国家高层官员的到来尚待时日，所以当务之急是对此地进行细致的检查，并着手进行各项准备工作。我们将对照明与通风设施进行严格审查，并彻底清除可能自上次维亚特卡战役以来一直沉积的尘埃。并且该建筑内的画作大多以国家杜马的人物为题材，而其中最为引人注目且尺寸宏大的作品，便是伊利亚·列宾的杰作《国会典礼》。\n\n此次活动的筹备工作不仅涵盖对照明等基本设施的检验，还涉及餐饮与休息的组织安排，因此需为食堂预留适当的场地。并且我们还需搬运各式家具，以供与会官员使用。椅子作为不可或缺的物品，在会议期间的需求量也大大增加。总而言之，我们必须确保所有必需品一应俱全，并精心布置家具，使每位与会者均拥有舒适的座位。\n\n同时，加强此地的安全防范措施也是紧要任务。这一重任将由当地驻军部队中的一位上尉担当。安保人员需着正装，严阵以待，驻守于建筑内外，并在执勤时采取额外的预防措施，他们将为活动的顺利进行提供有力保障。\n\n距离大会的召开尚有时日，各项筹备工作业已紧锣密鼓地推进之中。"
 MAR_Kosygin.7.a:0 "继续努力，我们必须为高层官员的到来做好准备！"
 MAR_Kosygin.8.t:0 "找到的线索"
 MAR_Kosygin.8.d:0 "吉尔从内务安全部精挑细选了一批得力干将，着手执行别洛泽尔斯基下达的任务。由于谢尔盖即将出席维亚特卡大会，短期内无法联络，吉尔只能独自行动，但他同时也获得了近乎无限的行动授权。\n\n此刻，弗拉基米尔·吉尔正坐在总部，审视着地图上标注着各个小队位置的符号。突然，一群特工押着一个形迹可疑的人闯进了他的办公室。\n\n“指挥官同志，我请求汇报！”下属开口道。\n\n“说。”吉尔言简意赅地答道。\n\n“我们追踪脚印并借助警犬的帮助，抓到了这个人。他很可能就是袭击仓库的盗贼之一。此人携带武器，同伙还有五人，其余的逃脱了，但我们成功抓捕并控制了他。”\n\n“很好。”吉尔略感惊讶地应道。他开始仔细打量这个陌生人。此人衣着简陋，与当地人格格不入：裤子、衬衫、沾满泥土的靴子，以及一张线条粗犷、满是不善的面孔。凭直觉判断，他就是袭击仓库的罪犯之一，那脸上没有丝毫无辜的神情。审视完毕后，吉尔下达了指令：“能找到其他人吗？”\n\n“当然可以。”\n\n“先把他送去审讯室。通知其他小队继续搜捕匪徒。”\n\n“明白，这就去办。”\n\n吉尔和手下将嫌疑人押送至审讯室。他决定亲自审问。\n\n“报上你的名字。”吉尔开门见山。\n\n“我什么都不会说的。”陌生人用略带沙哑的声音答道。\n\n“报上你的名字！”面对如此大胆的回应，吉尔提高了音量。\n\n陌生人试图朝吉尔的脸上吐口水，但没有击中目标，反而落在了他的胸口。吉尔当即挥拳击中了他的脸。这一拳力道十足，甚至能听到颈骨碎裂的声音，但脊椎并未断裂。鲜血从陌生人的牙齿间流了出来。\n\n这个陌生人强忍着剧痛，艰难地吐出了自己的姓名：“列昂尼德·布朗……列昂尼德·布朗！”\n\n审讯仍在继续……"
 MAR_Kosygin.8.a:0 "一切都比我们想象的要复杂得多。"
 MAR_Kosygin.9.t:0 "屠杀计划"
 MAR_Kosygin.9.d:0 "塔博里茨基满心欢喜，因为众多对全俄罗斯缙绅会议结果心怀不满的人士纷纷加入了他的“宝座”组织。这个组织汇聚了所有可能的力量：君主主义者、极端分子、雅利安兄弟会残余，甚至包括弗拉索夫的拥趸和痛恨当前政权的普通公民。并且一些简陋的恐怖分子也在这个组织的羽翼之下。总的来说，几乎所有对当局持负面看法的人都被囊括其中。\n\n人数之众，物质资源之丰，都使得这个组织的力量不容小觑。而其坚定的理念更是根深蒂固。这种理念深得人心，适合众多追随者。现在，塔博里茨基感受到了手中紧握的实权，他的活力与日俱增。他游移不定的目光急切地扫视着西俄的地图，仿佛要尽快洞悉每一个细微之处。然而实际上，他更想了解的是哪些地方的力量处于他的魔爪之下。\n\n当得知青年俄罗斯党的代表大会将在维亚特卡召开时，塔博里茨基意识到时机已到。他必须向世人宣告，“宝座”组织是一股能够推翻犹太布尔什维克柯西金、卡津别克、别洛泽尔斯基及青年俄罗斯党所有高层的强大力量。行动之时已至，因此谢尔盖·塔博里茨基召集了他麾下的所有主要高层，同时，这些高层的势力遍布整个俄罗斯大地。\n\n“朋友们，”塔博里茨基开始了他的演讲，“我们将对犹太布尔什维克发动致命打击。他们假冒为君主制国家，并盗用了阿列克谢·尼古拉耶维奇·罗曼诺夫之名！我们不能再置之不理。他们的代表大会即将召开，但他们无机可寻！——因为我们的行动将比他们演讲的结束还要迅速！\n\n“我们将一举发动毁灭他们的打击，让俄罗斯对我们感激涕零。我们曾未能彻底铲除犹太布尔什维克的毒瘤。如今，这个毒瘤再次化脓，并吞噬着俄罗斯的所有生气。现在，上帝赐予了我们宝贵的机会，我们不会再与机会失之交臂！”\n\n我以真正的、尚在人世的阿列克谢·罗曼诺夫的名义，以及圣父、圣子和圣灵的名义命令你们：开始着手铲除这些可憎的犹太布尔什维克！届时，名为共产主义的锁链将迸裂，整个俄罗斯都将得到解放！”"
 MAR_Kosygin.9.a:0 "他们疯了！谁来阻止他们！"
 MAR_Kosygin.10.t:0 "三位重要人士的到来"
 MAR_Kosygin.10.d:0 "别洛泽尔斯基、卡津别克和阿列克谢·柯西金-罗曼诺夫乘坐专车，缓缓驶向大会举办地。道路两旁，身着礼服的仪仗队如同一堵人墙，将道路与翘首以盼的人群隔离开来。维亚特卡大会即将召开的消息早已通过报纸上的宣传报道传遍了大街小巷，民众们对此次盛会的重要性了然于胸。再加上他们对青年俄罗斯党普遍持积极态度，因此不仅前来集会表达对卡津别克等人的敬意，更是由衷地为他们的到来感到欢欣鼓舞。\n\n会场内，重要的党派领导人早已齐聚一堂，静候大会开幕。只待阿列克谢二世·柯西金-罗曼诺夫宣布大会开始，众人便可摩拳擦掌，投入工作。一些人甚至已经提前行动起来，与其他党员讨论着国家在经济、政治和社会等方面所面临的种种问题。\n\n汽车在建筑物入口处停下，侧门正对着大门。卡津别克率先走出前门，人群立刻爆发出一阵欢呼。紧随其后的是谢尔盖·别洛泽尔斯基，同样受到了热烈的欢迎。最后出现的是柯西金-罗曼诺夫，欢呼声达到了顶峰。他驻足片刻，环视这片人山人海的广场，无数的横幅、阿列克谢·罗曼诺夫的画像以及其他物品无不表达着民众对他的支持。那一刻，阿列克谢·柯西金-罗曼诺夫感到内心无比平静，他与卡津别克和别洛泽尔斯基一同登上台阶。\n\n他们来到顶层，走上早已为演讲者准备好的讲台，上面摆放着麦克风和桌子。卡津别克和别洛泽尔斯基率先发表讲话，柯西金-罗曼诺夫则坐在他们身后。两位领导人慷慨激昂地演讲着，柯西金-罗曼诺夫静静地等待他们结束主要部分。此时，欢呼声逐渐平息，整个会场变得异常安静，安静得令人不安。柯西金隐隐感到有些不对劲……"
 MAR_Kosygin.10.a:0 "这里面肯定有些问题..."
 MAR_Kosygin.11.t:0 "邪恶根源的真正规模"
 MAR_Kosygin.11.d:0 "自弗拉基米尔·吉尔对这位自称列昂尼德·布劳恩的陌生人展开审讯以来，已经过去了整整15分钟。在严酷的拷问之下，揭露了一个令人震惊的事实：他的名字之所以为“布劳恩”，是因为他竟然是雅利安兄弟会残余势力的一员，并且在彼尔姆犯下了盗窃武器的罪行。至于雅利安兄弟会是否还有余孽存在，已然不言而喻。在这短短的时间里，布劳恩的脸上布满了伤痕，从破裂的嘴唇到残缺的眉毛，甚至连这个伪雅利安人的牙齿都被打落几颗。\n\n“你知，知道，指，指挥官，”列昂尼德·布劳恩突然开口说道，语气中透露出一丝对吉尔的戏谑，“你知，知道该如何对待我们这些弱者—”\n\n话音未落，吉尔再次猛地出手，重重地打在布劳恩的身上。布劳恩连同椅子一起飞出一米多远，重重地摔在冰冷而血迹斑斑的地板上。然而，这并未平息吉尔的怒火，他如同踢足球般狠狠地踢向布劳恩的头部，不仅打断了他的鼻子，还猛地踢向他的肚子。鼻血再次喷涌而出，而布劳恩竟还未失去意识。\n\n经过这一系列野蛮的殴打之后，弗拉基米尔·吉尔抓住了这个已经痛苦呻吟、试图通过流血的鼻子艰难呼吸的男人。他粗暴地抓住布劳恩的衣领，将他重新按回椅子上。\n\n“你到底在为谁卖命？！”吉尔简洁明了地问道，\n\n“宝座……”布劳恩艰难地吐出了这个词。\n\n“还有谁是你的同伙？！”吉尔继续追问。\n\n“塔博里茨基……谢尔盖·塔博里茨基。”布劳恩有气无力地回答道。\n\n听到这个名字，弗拉基米尔的怒气开始逐渐平息，他逐渐恢复了冷静。\n\n“你们的目的到底是什么？！”他继续审问道。\n\n“我们要把你们全部杀光！……”布劳恩恶狠狠地说道。\n\n“你还有什么遗言要说？”\n\n而在精神和肉体上都已经彻底崩溃的布劳恩，已开始吐露出所有有价值的信息。\n\n“我们的人在维亚特卡为你们准备了一份大礼。现在，你们正在那里召开代表大会，而我们将会把你们的高层全部炸死!”他得意地说道。\n\n“你们在维亚特卡到底有多少人？！”吉尔急切地问道。\n\n“很多。很快，这座城市就会被我们占领。你们这些肮脏卑鄙的俄罗斯下等奴隶……”\n\n然而，他话还没说完，吉尔又狠狠地给了他一拳。这一次，吉尔明显收敛了力量，只用了一半的力气打在布劳恩的脸上。顿时，血块从布劳恩的嘴里喷溅而出，溅落在地板上。\n\n吉尔决定坐下来，认真思考他所听到的一切。目前他无法与外界取得联系，但他必须立即采取行动。他决定凭借自己的判断来应对这一危机。\n\n“我和你已经无话可谈了。”吉尔最后说道。\n\n“是，是吗？哦，那你是要放我走吗……？”布劳恩试探性地问道。\n\n吉尔没有说话，只是从枪套里拔出了手枪，熟练地上膛，然后瞄准了布劳恩。\n\n“求求你，原谅我……忘记这一切吧……你想让我怎么做？原谅我吗？”布劳恩突然用一种更加生动悲催的语气说道，仿佛看到了一线生机，“求求你，别杀我……我发誓——”\n\n他还没说完，吉尔就扣动了扳机。一声枪响，命中布劳恩的头部，他当场殒命。鲜血和脑浆溅向墙壁，而墙壁也血迹斑斑。\n\n弗拉基米尔·吉尔迅速地离开了审讯室，对他的特工说道：“立即联系离维亚特卡最近的部队！不管是什么部队，尽快联系上！传达我的命令：让他们以最快速度前往维亚特卡维持秩序！这不是演习！”\n\n“是！长官！”特工迅速回答道，然后准备跑向电话。然而，就在这时，吉尔突然又喊住了他："
 MAR_Kosygin.11.a:0 "“记得把尸体清理掉！”"
 MAR_Kosygin.12.t:0 "进攻"
 MAR_Kosygin.12.d:0 "站在巍峨的高楼上，可以居高临下地观察到那个在演讲后迅速陷入沉默的浩渺人群。从这种近乎天神的视角俯瞰，那种肃静的氛围足以让任何人屏住呼吸。原本，这一天应该是充满欢乐与庆祝的，然而今天却有人意图打破这一宁静。\n\n就在几天前的一个寂静夜晚，隶属于“原则”组织的塔博里茨突击小组悄然行动，埋下了只能通过遥控触发的地雷。这些地雷，无需繁琐的引线，却蕴藏着摧毁一切的巨大威力，足以确保将预定目标彻底摧毁。同时，这些地雷的昂贵价格也意味着，“原则”组织只有一次机会，必须一击必杀，将青年俄罗斯联盟的高层一网打尽。\n\n“原则”已经表明了自己的立场。突击小组的计划极为坚决，他们打算夺取整个城市，只是为了防止柯西金、别洛泽尔斯基和卡津别克逃出城去。因此，城内身穿黑色制服的塔博里茨军大约是守备部队人数的两倍。每个人都对自己的胜利充满信心，不会出现差池。\n\n“抵抗是预料之中的事情，这是不可避免的。但是，即使我们最终牺牲，即使我们成功消灭了青年俄罗斯联盟，把俄罗斯大地从犹太布尔什维克的魔爪中解救出来，那又怎么样呢…”高楼上的人沉思着。\n\n在塔博里茨突击小组中，名为安德烈·卡拉切夫的队员正紧握着引爆器。这个引爆器掌握着无数人的生死，只有他的行动，才能决定那些人的命运。现在，一切都已经准备就绪，只剩下等待开始行动的命令……\n\n“女武神一号，这里是雄鹰二号，是否收到请回复！”塔博里茨突击小组的成员通过便携式无线电开始呼叫。\n\n“雄鹰二号，这里是女武神一号，我们听得很清楚。所有目标已经到达集合点，你们的人员是否就位？”\n\n“收到，我们已经准备就绪，随时可以开始行动。”\n\n“很好，现在就是行动的时刻。所有人都在聆听卡津别克和别洛泽尔斯基的演讲。你看到柯西金了吗？”\n\n“看见了，目标就坐在他们的后面。”\n\n“立即引爆炸药，机会不会重来。”\n\n“收到，我会立即完成行动。”\n\n“上帝与我们同在！”\n\n“愿上帝保佑我们……”\n\n安德烈·卡拉切夫深吸一口气，按下了那个决定一切的按钮。"
 MAR_Kosygin.12.a:0 "只是按下..."
 MAR_Kosygin.13.t:0 "冲击"
 MAR_Kosygin.13.d:0 "在片刻的寂静之后，柯西金·罗曼诺夫突然感到一股强大的冲击力将他推向一侧。尽管他尚未失去意识，却听到人群因震惊而发出的尖叫声。刚刚到底发生了什么？柯西金无法理清思绪就立刻陷入了昏迷。而守卫们则果决地冲向那些还有可能生还的人。他们发现了卡津别克和别洛泽尔斯基的尸体，经过短暂的犹豫后，他们决定也将这两具冰冷的尸体带回去。尸体被多处弹片击中，部分肢体残缺不全，甚至有弹片深深嵌入了头颅之中。柯西金居然毫发无伤，这只能归因于上帝保佑。\n\n人群立刻四散奔逃，犹如广场上的一群无头苍蝇。隐藏的宝座教派小队从暗处冲出，攻击四散的小股守卫。守卫们竭尽全力组织起防御，将主要防线牢牢地构筑在国会大厦周围。无线电中传来消息，防线已经沿着主要街道延伸开来，并成功占领了住宅楼作为据点。同时塔博里茨的突击部队却在残忍无道地杀害着青年俄罗斯联盟的士兵和普通平民，这群畜生在血腥的杀戮中对两者并没有做出任何区分。\n\n现在柯西金被安置在大楼深处的沙发上，守卫们用最后的力量奋勇抵抗，确保他没有被敌人抓获的风险。但报告称弹药即将耗尽，他们不得不从阵亡的突击部队身上搜集弹药。形式极其严峻……\n\n而柯西金则在沙发上缓缓恢复了意识，耳边不断传来全城的枪声和爆炸声。他倾听着战斗的声音，同时远处坦克和装甲车的隆隆声也渐渐传入耳中。这是吉尔的援军。再过几个小时，宝座教派的抵抗将被彻底压制。他们的攻击注定以失败告终。"
 MAR_Kosygin.13.a:0 "他们的攻击不会无功而返。"
 MAR_Kosygin.14.t:0 "劫后余波"
 MAR_Kosygin.14.d:0 "柯西金步履沉重地绕着会场建筑巡视，眼前尽是保卫此地的卫兵们受伤的身影。“王座”组织的袭击留下了满目疮痍，触目惊心的血迹无处不在。士兵们因伤痛而发出的呻吟声，让柯西金心中涌起深深的怜悯，但他却无能为力。他不知道卡津别克和别洛泽尔斯基的状况，焦急地四处寻找着他们的踪迹。\n\n最终，他找到了他们。然而，呈现在他眼前的，却是两具冰冷的尸体。他们的身体几乎面目全非，双眼无神，皮肤苍白，鲜血浸染了周围的地面。曾经对这一切漠不关心的柯西金，此刻凝视着昔日战友的遗体，内心五味杂陈。他感到无比的痛苦和不安，却又夹杂着一丝解脱——再也没有人能用他们的要求来威胁他了。悲伤、愤怒、仇恨，各种情绪如潮水般涌上心头，最终化作一股强烈的复仇渴望。他知道这一切是谁所为。我们侥幸活了下来，现在，是时候进行反击了。柯西金在心中默默发誓，不惜一切代价，也要为他们报仇雪恨。\n\n短暂的哀悼之后，柯西金走出建筑，眼前的景象令他触目惊心：演讲台所在的平台被炸毁，街道上横七竖八地躺着平民的尸体，其中一些人尚存气息，却奄奄一息。柯西金一眼就认出了塔博里茨基的冲锋队员制服，他知道这是他的杰作。一切正如他所料——塔博里茨基没有忘记他，在杀死阿列克谢·柯西金-罗曼诺夫之前，他绝不会善罢甘休。\n\n几分钟后，弗拉基米尔·吉尔乘坐装甲运兵车抵达现场。他走下车，四处寻找着战友的身影。当他来到议会大厦的指定楼层，看到别洛泽尔斯基和卡津别克的尸体时，还没来得及表达任何情绪，便看到了正要离开的阿列克谢·柯西金。他走上前去，两人开始了对话。\n\n“我的沙皇，”弗拉基米尔·吉尔努力组织着语言，“维亚特卡的‘宝座’分子已被消灭，城市重新回到了我们的掌控之中。”\n“太好了，”柯西金回答道，“你的部队是来保护我们的吧？”\n“正是如此。我们从俘虏口中得知，他们正在策划对你们进行袭击。”\n“我代表全俄罗斯人民，对你为保卫祖国所展现出的独立、勇敢和决心表示由衷的感谢。”\n“我为俄罗斯服务！”\n“此外，我想要任命你为武装部队总指挥官，你愿意接受吗？”\n“当然！我愿意承担这份重任。”\n“很好。从现在起，你就是武装部队总指挥官了。我的第一个命令，就是对付这些人。他们自称什么来着？”\n“‘宝座’，‘宝座教派’组织。”弗拉基米尔·吉尔回答道。\n“那就去对付他们，”柯西金说道，“我们还有很多事情要做，必须为我们逝去的战友复仇。”"
 MAR_Kosygin.14.a:0 "他们的仇都会报的！"
 MAR_kospol_bloody_day: "日历上的血腥日"
 MAR_kospol_bloody_day_desc: "维亚特卡大会开幕当天发生的恐怖袭击，给了我们当头一棒。政权的稳定性遭到严重破坏，国家面临的危机比以往任何时候都更加严峻。更重要的是，许多无辜的生命在这场暴行中丧生。恐惧的阴霾笼罩着俄罗斯，没有人知道，明天会发生什么，国家会不会就此分崩离析。这一切都极大地动摇了我们本就十分脆弱的统治秩序。\n\n我们必须消灭“宝座”，这是当务之急！但首先，我们要加强自身力量，整合现有资源，做好万全的准备，才能采取行动。只有在彻底粉碎恐怖分子的阴谋之后，我们才能按照自己的意愿改造国家。"
 MAR_prestol_fivedecrease_tt:0 "§R“宝座教派”§!的势力在§G每个地区§!都将§G削弱§!§Y5%§!。"
 MAR_kospol_KGB: "创建克格勃"
 MAR_kospol_KGB_desc: "如果我们的特勤部门工作得更好，维亚特卡大会当天发生的恐怖袭击事件本可以在萌芽阶段就被阻止。如果我们的特勤部门更有效、更强大，他们本可以挫败宝座组织的任何活动，也可以挫败外国特工在我国领土上的任何活动。\n\n旧的特务机构已经无可救药地过时了，因为它们是建立在沙皇俄国安全部和布哈林苏联内务人民委员部的经验基础上的，在遥远的过去，它们既没能阻止革命，也没能阻止外国特工渗透到我国。我们必须建立自己独特的特勤局，它不仅要超越旧特勤局，还要与中情局、阿勃维尔等世界特勤局竞争。"
 MAR_Kosygin.60.t:0 "国家安全委员会"
 MAR_Kosygin.60.d:0 "弗拉基米尔·吉尔正迈步走向尼古拉·阿列克谢耶维奇·杜申的办公室，后者乃是西俄罗斯公国最杰出的反间谍官员之一。他是这支负责捍卫公国内部利益的特别行动小组的一员。然而，无论他多么经验丰富、技艺精湛，一旦高层管理发生不明不白的变动，他的经验便失去了用武之地，效率也随之骤降。\n\n前往杜申办公室的路上，弗拉基米尔·吉尔在心中不断重复：“若非特勤部门的疏忽，维亚特卡的惨案本不该发生。” 他是对的——某种程度上，如果安全部门能够及时察觉威胁，并着手遏制其活动，这一切或许可以避免。然而，事已至此——现在必须着手处理后果。弗拉基米尔·吉尔对这家特勤机构的工作方式颇为不满，因此他下定决心要解决这个问题。\n\n迈进尼古拉的办公室，弗拉基米尔几乎没有任何寒暄，便开门见山地说道：\n\n“我有一则天大的喜讯要告诉你，沙皇陛下亲口谕示。”\n\n“什么消息？” 杜申从繁杂的工作中抬起头，不解地问道。\n\n“旧有的特别行动机构已成为历史，其他的机构也将被取代——我们将组建国家安全委员会。所有特别部门都将被并入这个新的委员会，而你，将亲自执掌它的权柄。”\n\n“这真是无上的荣光……” 杜申喃喃道，显然还没有完全消化这个突如其来的任命，“我何时开始履职？”\n\n“从现在起，你就已走马上任。从此刻起，你要向我汇报国家安全委员会的工作，我希望你能夜以继日，不遗余力地完善它的运作。你可以立即开始工作了。”\n\n“当然，我一定竭尽所能，让一切井然有序。"
 MAR_Kosygin.60.a:0 "由狮子率领的绵羊大军比由绵羊率领的狮子大军更强大。"
 MAR_Kosygin_KGB_agency:0 "国家安全委员会"
 MAR_kospol_army_streets: "街头上的军队"
 MAR_kospol_army_streets_desc: "“宝座”的恐怖分子对我们构成了极其严重的威胁，我们必须调动一切力量与之斗争。为了对抗这个毒瘤，我们不仅要动用安全部门的力量，还要动用正规军。\n\n维亚特卡的恐怖袭击事件告诉我们，“宝座”已经拥有了相当强大的武装力量，他们甚至可以组织起一支装备精良的队伍，占领城市，并以此作为筹码，对我们进行威胁。因此，我们必须调动军队进驻城市，严防恐怖袭击，维护社会稳定。我们将实行宵禁，任何违反宵禁规定的人都会被带到警察局接受调查；任何与“宝座”有牵连的嫌疑人都将受到严厉的审讯。"
 MAR_Kosygin.61.t:0 "把握脉搏"
 MAR_Kosygin.61.d:0 "塔季扬娜·卡拉恰耶娃与兄长尼古拉并肩走在街上。尼古拉年长她五岁，若非近期街头犯罪率激增，塔季扬娜本可独自前往商店。为了保护妹妹的安全，尼古拉总是陪伴左右。“宝座”组织的恐怖袭击阴霾笼罩着城市，抢劫、袭击的恐惧挥之不去。结伴而行，似乎成了寻求安全感的唯一方式。\n\n然而，情况似乎有所转变。当兄妹二人再次前往商店采购时，映入眼帘的是张贴着的新告示——城市进入戒严状态。宵禁令生效，未持有特殊证件者在下午六点后禁止外出，各类违规行为的处罚力度也大幅提升。\n\n最引人注目的，莫过于那些新面孔——身背步枪、面容冷峻的士兵。他们驻守在商店、仓库、工厂、行政机关等重要建筑附近，其目的不得而知。人们畏惧他们所代表的真实力量，不敢直视他们的双眼。然而，在这份恐惧背后，却也潜藏着一丝安稳——光天化日之下的犯罪威胁似乎消散了，取而代之的是一种被保护的安全感。尽管如此，目睹这些铁腕士兵执行着严苛却至关重要的任务，仍让人感到些许不安。\n\n回到家中，尼古拉和塔季扬娜透过窗户观察着这些士兵。突然，其中一名士兵指向两个朝着不明方向行走的人，示意他们停下。两人止步，聆听着士兵的指令，随后转身离去，显然是回家了。但那些胆敢反抗的人呢？更糟的是，如果他们是“宝座”的支持者呢？远处，工厂方向传来阵阵爆鸣声，令人不禁联想到鞭炮的声响。然而，结合当前的局势，这恐怕并非节日庆典的喧嚣。"
 MAR_Kosygin.61.a:0 "只有我们才能证明谁在掌权。"
 MAR_kospol_who_are_against_us: "谁不支持我们，就是反对我们..."
 MAR_kospol_who_are_against_us_desc: "国家正处于危急存亡之秋，我们必须采取果断措施，消除一切隐患。但自由，恰恰也是我们的敌人，它给了我们的敌人可乘之机。“宝座”正是利用了这一点，对我们政权发起了致命一击。为了弥补这个漏洞，我们必须暂时限制一部分公民自由。\n\n我们这么做，与其说是为了对抗“宝座”，不如说是为了保护人民群众自身的安全。在面包和自由之间，人民最终会选择面包，因此，他们不会强烈反对这些举措。当然，也会有一些人批评我们的决定，他们会得到应有的下场…"
 MAR_Kosygin.62.t:0 "闻所未闻的胆识"
 MAR_Kosygin.62.d:0 "一张告示贴在墙上，上面写着：禁止20人以上集会。讽刺的是，许多市民都想看看告示上写了什么，于是便纷纷聚拢过来，你一言我一语地讨论起来，人数很快就超过了30人，而且还在不断增加。尽管告示的内容已经明令禁止集会，但人们还是聚集在一起，表达着对当局的不满。\n\n然而，警察很快就赶到了现场。他们用高音喇叭喊话，要求人群立即散去。一些人乖乖地离开了，但更多的人拒绝服从，他们最终被带到了警察局接受审讯。\n\n起初，警察只是对这些人进行了口头警告，并告诉他们，如果再犯，将会受到严惩。但随着越来越多的人聚集起来，当局的耐心也逐渐消失，逮捕行动将会变得越来越严厉…"
 MAR_Kosygin.62.a:0 "自由死，秩序生。"
 MAR_kospol_motherland_and_tsar: "保卫祖国和沙皇联盟"
 MAR_kospol_motherland_and_tsar_desc: "自从合法政府开始打击“宝座”恐怖分子以来，警察的压力就与日俱增。恐怖袭击事件层出不穷，各种趁乱打劫的犯罪活动也开始在全国各地蔓延。这一切都在严重破坏着我们国家的稳定。\n\n为了帮助警察维护治安，我们必须动员全体人民的力量，组建一支人民民兵队伍。他们将与警察并肩作战，共同维护街头秩序，打击犯罪活动，并在一定程度上参与到对“宝座教派”的围剿行动中来。"
 MAR_Kosygin.59.t:0 "Y字行动"
 MAR_Kosygin.59.d:0 "三个窃贼正密谋盗窃当地一个存放各种杂货的仓库，根据种种迹象判断，那里应该有不少好东西——美酒、装饰剑、乐器等等。对这三个家伙来说，这个仓库的价值在于他们可以把里面的公家美酒洗劫一空，然后转手卖掉，换取钱财去挥霍。他们约定，每个人都能从这次倒卖美酒的行动中至少分得330卢布。\n\n深夜，三人在碰头地点碰面，详细讨论了整个行动计划。其中一个家伙甚至给这次行动起了个代号——“Y字计划”。当被问及为何叫“Y字计划”时，他回答说，这样就没人能知道真正的计划了。的确，这个计划天衣无缝，任何人都无法洞悉其真相或理解行动的本质，从而为他们免于牢狱之灾上了保险。\n\n他们摸到仓库附近，其中一人用撬棍撬开门锁，潜入进去。三人开始搬空仓库——首先，他们盯上了数量丰富、种类繁多的公家美酒，将其一箱箱地搬上他们为此特意准备的卡车。然而，就在这时，他们突然看到一整队民警从街上走来，开始他们的夜间巡逻。民警们一眼就发现了仓库里的异样，迅速朝这边包抄过来，而窃贼们则慌忙试图溜走。然而，一切都是徒劳——他们被团团围住，所有人尽数落入民警之手。\n\n窃贼们被迅速押送到当地派出所，并立即被拘留，等待盗窃案的全部细节被查清。"
 MAR_Kosygin.59.a:0 "盗窃公共财产的强盗！"
 MAR_kospol_security_comeete: "国家应急委员会"
 MAR_kospol_security_comeete_desc: "尽管拥有合法政权，但我们的处境依旧岌岌可危，更雪上加霜的是，整个权力体系已经分崩离析。我们最近失去了可以为沙皇出谋划策的首相。我们的党，青年俄罗斯联盟，也损失了许多优秀人才。如果我们需要巩固我们的地位，就必须召开国家紧急状态委员会，以此来重塑整个西俄罗斯的权力结构。\n\n一旦我们能够做到这一点，就能立即缓解一部分国家管理难题，并显著加强我们与整个国家的联系。"
 MAR_Kosygin.63.t:0 "人事变动"
 MAR_Kosygin.63.d:0 "弗拉基米尔·吉尔快步走向阿列克谢·柯西金-罗曼诺夫的办公室。今天，几位在维亚特卡恐怖袭击中幸存下来的关键部长将在这里举行一场重要会议，商讨建立一个紧急权力机构，以便在西俄罗斯局势稳定下来之前，处理国家内所有重大决策。\n\n吉尔走进办公室，发现其他几位高官已经到齐，正襟危坐地等待着他。他刚一落座，阿列克谢·柯西金-罗曼诺夫便开口说道：\n\n“同志们，我们正面临着极其严峻的形势。‘宝座’的威胁尚未解除，国家政权也处于风雨飘摇之中，卡津别克首相遇刺身亡，政府更是群龙无首。因此，我决定进行一些人事调整。首先，任命弗拉基米尔·吉尔为新一任政府首相，领导青年俄罗斯联盟；同时，任命阿纳托利·瓦维洛夫为新任国防部长。”\n\n“陛下，这是我的荣幸！”弗拉基米尔·吉尔激动地说道，“请问我什么时候可以将国防部的工作交接给瓦维洛夫部长？”\n\n“现在就可以。”阿列克谢回答道，“同时，请各位仔细阅读新政府的完整成员名单。”"
 MAR_Kosygin.63.a:0 "自由死，秩序生。"
 MAR_kospol_universal_good: "清晨"
 MAR_kospol_universal_good_desc: "我们已经解决了维亚特卡大会恐怖袭击造成的许多问题。垂直的权力已经恢复，现在可以开始增加行政机构了。我们成立了克格勃，它将比俄罗斯以前的特务机构更加有效，有了它，我们将能够保护我们的国家不受外国势力和国内有害分子的影响。通过实施戒严令，我们加强了国家的稳定，通过减少公民的一些权利和自由，使我们的人民更加安全。\n\n最后，我们的国家将能够带着对美好未来的希望迎来新的一天。至少是在我们能够承受的范围内。然而，在解决了新问题之后，我们仍有一些老问题未能在此次大会上得到解决。我们需要开始政治改革，使我们能够一举摆脱所有行政负担，并制定我们的未来战略。"
 MAR_kospol_nation_of_soviets: "苏维埃国家"
 MAR_kospol_nation_of_soviets_desc: "布哈林领导下的苏联所采用的苏维埃制度，如果掌握得当，可能会相当有效。我们的行动计划指出，我们应将沙皇俄国和苏维埃俄国的权力共生，从中汲取一切精华。现在是恢复苏维埃制度的时候了。\n\n由于我们失去了青年俄罗斯联盟的主要思想启蒙者之一——卡津别克，但我们不可能像党的创始人所设想的那样创造出真正的苏维埃议会形象。因此，我们必须重新建立苏维埃地方自治制度，消除其过去的弊端，并将青年俄罗斯联盟思想植入其中。"
 MAR_kospol_Soviet_Empire: "苏维埃帝国"
 MAR_kospol_Soviet_Empire_desc: "任何帝国都是将不同民族团结在一个国家内的组织形式，我们也不例外。我们的国家是众多少数民族的家园，他们共同构成了俄罗斯的完整图景。将他们从我国分离出去，无异于丢弃我们祖国所拥有的财富——居住在我们国家的人民。我们的西俄罗斯人民公国也是一种“帝国”。有人称我们不仅仅是一个帝国，而是一个苏维埃帝国，那么从现在起，我们就接受这个称号，因为我们不会歧视少数民族。他们是我们的文化的一部分，承认这些少数民族的平等地位，只会丰富和加强俄罗斯文化。"
 MAR_Kosygin.64.t:0 "面试工作"
 MAR_Kosygin.64.d:0 "一名待业者渴望找到一份工作。他是一位数学好手，精于数字计算，因此他打算到国家银行谋职。在他看来，那里的工作不像会计或搬运工那样繁重，而且收入颇丰，因此他决定前去应聘。\n\n终于，招聘委员会面试的日子到了。在雇主面前，他展现了出色的自我：一位勤奋的知识分子，不仅精通数学，更深谙银行业务的本质。这位待业者似乎已经胜券在握，即将拿下这份工作。然而，雇主突然抛出了一个问题：\n\n“你的民族是？”\n\n“犹太人。”他回答道，语气已不如之前那般自信。\n\n在听到这个问题后，雇主的神情立刻变得凝重，他不断地发出“嗯……”的沉吟声，而我们的主人公心想，恐怕仅仅因为这个原因，他就将被拒之门外。毕竟，如果说犹太人曾经被爱戴和尊敬，那也只是在布哈林的苏维埃时期了，而那段岁月早已一去不复返。\n\n在令人窒息的半分钟等待后，雇主终于开口说道：\n\n“好吧，你被录用了。你的工位已经准备就绪，什么时候可以开始工作？”\n\n“现在就可以。”\n\n“那你可以去报道了。”"
 MAR_Kosygin.64.a:0 "克服偏见。"
 MAR_kospol_nex_siezd: "新一届大会"
 MAR_kospol_nex_siezd_desc: "终于，在迈出解决老问题的第一步后，我们为进一步治理国家奠定了稳定的基础。现在是巩固我们党所取得的成就并制定未来战略的时候了，这将决定外交政策关系、经济部分、军事改革和其他一切方面的主要发展方向。\n\n与维亚特卡大会不同的是，本次大会的准备工作将更加充分，安全性将提高数倍，整个建筑和城市的安全将得到保障，此外，我们必须向全国展示稳定的面貌和对未来成功的坚定信心。"
 MAR_Kosygin.65.t:0 "有始有终"
 MAR_Kosygin.65.d:0 "首届青年俄罗斯党代会在维亚特卡召开，然而，“宝座”组织发动的恐怖袭击却为这次会议蒙上了一层阴影。卡津别克、别洛泽尔斯基……这些国家栋梁的名字，从此与那场血腥的屠杀永远地联系在了一起。本应在这次会议上讨论国家未来的政治体制，却因这场突如其来的袭击而被迫中断。但所有人都明白，新的会议迟早要召开。\n\n这一次，党代会将在首都举行。为避免惨剧重演，克格勃几乎将整栋大楼翻了个底朝天，每一个角落、每一个人、每一件物品都经过了最严格的排查，确保万无一失。\n\n终于，在肃穆的气氛中，党主席兼政府总理弗拉基米尔·吉尔走上讲台，开始了他的讲话：\n\n“亲爱的朋友们，同志们，同仁们！今天，我们将在这里召开这场期待已久的党代会。今天，我们将共同制定未来的发展战略：经济发展计划、外交政策方针、内政总体战略以及西俄罗斯人民公国军事力量发展规划。”\n\n“但在开始这一切之前，让我们共同缅怀那些逝去的友人、同僚，缅怀我们党和国家的缔造者——亚历山大·卡津别克，以及他忠诚的挚友——谢尔盖·别洛泽尔斯基。请全体起立，默哀一分钟。默哀结束后，将由我们的沙皇，阿列克谢二世·罗曼诺夫陛下致辞。”\n\n话音刚落，整个会场便陷入一片庄严肃穆的寂静之中。秒针的跳动声清晰可闻，如同阵阵鼓点，敲击着每一位与会者的心脏。在这一分钟里，他们追忆着维亚特卡那场惨剧，追忆着逝去的同僚，一些人的脸上甚至浮现出痛苦的神色。\n\n一分钟后，众人落座。阿列克谢·柯西金-罗曼诺夫缓步走上讲台，开始了他的讲话：\n\n“同志们，他们的牺牲将永远铭刻在我们的记忆中，失去他们的伤痛将永远留在我们心中。卡津别克和别洛泽尔斯基是我们国家的真正爱国者，但他们还没来得及实现他们所有的计划。我们会非常怀念他们，并将永远铭记他们逝世的这一天。但是，他们的牺牲，以及成千上万俄罗斯人民的牺牲，不会白费。我们不会让青年俄罗斯的理想就此破灭。经历了如此多的苦难和考验，我们将昂首阔步，走向光明的前景，最终实现我们的目标。”\n\n“现在，是时候完成他们未竟的事业了。祝愿同志们在工作中一切顺利，取得成功！”"
 MAR_Kosygin.65.a:0 "永远铭记死亡。"
 MAR_koseco_new_gosplan:0 "国家计划委员会的重建"
 MAR_koseco_new_gosplan_desc:0 "柯西金-罗曼诺夫认为，为了尽快恢复国家经济，我们必须重建经济管理体系。而重建的第一步，就是恢复国家计划委员会。委员会将成为未来经济的基石，指引着我们完成国家重建的伟大事业。\n\n国家计划将作为经济发展的核心，我们将加强对国家工业的控制，严格执行计划方案。只有对极其有限的资源进行人工分配，才能在短期内最大限度地提高经济发展效率，这是任何市场经济都无法比拟的。"
 MAR_Kosygin.15.t:0 "规划国家计划"
 MAR_Kosygin.15.d:0 "毫无疑问，阿列克谢·柯西金-罗曼诺夫是一位杰出的经济学家与数学家。倘若他不是承奉神意，以沙皇之尊统治帝国，那么他必然能在内阁中担任要职，例如在卡津别克或是别洛泽尔斯基手下掌管经济。像他这样的人才在经济领域游刃有余，他们能够化腐朽为神奇，带领国家走出混乱与衰败，最终超越其他国家，将竞争对手远远甩在身后。\n\n柯西金-罗曼诺夫的整个经济理念非常简洁：建立混合经济，将计划经济与市场经济的优势结合起来。在他看来，只有这样的组合才能最大限度地发挥经济效能。最重要的是，这套体系能够满足人民的基本需求，而这本身就是任何经济体系取得成功的保证。\n\n当然，问题也是存在的——即便贵为沙皇，柯西金也并非无所不能。他无法同时兼顾国内发生的所有进程。他需要在其他领域投入大量精力，而他所钟爱的经济领域则需要一位能够时刻关注其发展脉搏的监管者。换言之，他需要一位在这方面得力的助手。\n\n解决这个问题的唯一方法是任命一位值得信赖的人选，一位能够直接向沙皇汇报工作、与其能力相当且不可或缺的人选。因此，在签署关于建立国家计划机构的法令之前，他便已决定任命尼古拉·伊万诺维奇·马斯连尼科夫担任该机构的负责人。"
 MAR_Kosygin.15.a:0 "批准计划，任命尼古拉·马斯连尼科夫为经济部长。"
 MAR_koseco_red_capitalism:0 "社会资本主义"
 MAR_koseco_red_capitalism_desc:0 "新经济的根基已经奠定，现在是时候在其上构建上层建筑了。首先，我们必须打造经济的框架——将市场机制与行政指令体系融合在一起。我们的经济必须在计划与市场之间取得平衡，这将使我们的社会主义区别于其他所有社会主义模式。\n\n这种结合让我们有权将自己的青年俄罗斯社会主义称为具有俄罗斯特色的社会主义。我们可能会被立即贴上共产主义者的标签，但我们不是——我们只是选择了这条道路的青年俄罗斯人。我们的青年俄罗斯社会主义将融入资本主义的元素，而这只会使其更加强大。"
 MAR_Kosygin.16.t:0 "我们的青年俄罗斯式社会主义"
 MAR_Kosygin.16.d:0 "阿列克谢二世·罗曼诺夫，这位西俄人民公国的缔造者，在反复思索着国家的经济政策走向。一个念头始终萦绕在他的脑海：我们的社会主义必须是俄罗斯式的社会主义，而唯有将“民族精神”融入其中，才能彰显其俄罗斯之魂。此外，这种社会主义必须具备高度的灵活性，能够充分响应人民的需求，并通过鼓励私人领域的供给来满足这些需求。从理论上来说，这似乎并不复杂。\n\n然而，倘若最终建立的社会主义如同布哈林时期那样毫无生气，那该怎么办？回想起那段并不遥远的过去，阿列克谢二世意识到，自己很可能重蹈布哈林的覆辙——未能将俄罗斯人民团结起来，未能激发他们的民族精神去对抗敌人，更未能让国家做好应对纳粹侵略的准备。那么，究竟什么是俄罗斯民族精神？\n\n俄罗斯民族精神是全体国民团结一心、众志成城的集体主义精神。俄罗斯人并非一群崇尚个人主义的乌合之众，而是一个团结的集体。无论是曾经惨烈的卫国战争，还是其他无数为保家卫国而战的时刻，虔诚的俄罗斯人民都展现出了令人惊叹的牺牲精神，他们不惜牺牲自己，为了他人，为了逝者，为了民族的存亡而战。正是这种牺牲精神，这种为他人甘愿奉献一切的信念，让我们赢得了1812年卫国战争以及其他数百场战争的胜利。\n\n俄罗斯人民绝不希望看到少数人凌驾于多数人之上。自古以来，我们的人民始终坚信多数人的意志应该决定一切。而在这个语境下，“多数人”究竟是什么？他们是人民的集体。因此，在俄罗斯文化中，为了社会和集体的利益而牺牲个人利益，早已成为一种根深蒂固的传统。这也是集体主义精神的根源所在。\n\n如何才能创建一个将社会主义、资本主义和俄罗斯民族精神融为一体的经济体系？我们不会奉行任何教条主义，无论是马克思主义还是亚当·斯密的自由市场理论，都无法成为我们的指路明灯。我们要走的是一条完全属于我们自己的道路，一条独一无二的俄罗斯道路。"
 MAR_Kosygin.16.a:0 "莫非青年俄罗斯社会主义是所有俄罗斯人的意识形态？"
 MAR_koseco_national_sector:0 "国营部门"
 MAR_koseco_national_sector_desc:0 "创造就业机会，无论是对国家至关重要的岗位，还是其他行业，都可以由私人部门和国家共同承担。然而，与资本家不同，国家永远不会为了利益而故意裁员或无故解雇工人。如果我们持续发展国营部门，就能为人民提供稳定的就业机会，并保证他们在国家经济体系中始终拥有一席之地。届时，悬在工人阶级头上的达摩克利斯之剑将会消失，贫困的阴霾也将一扫而空。\n\n诚然，这需要付出高昂的代价，因为所有资金都将来自国家预算。但是，除了我们自己，还有谁会为国营工厂提供资金呢？因此，我们必须依靠自己的力量来完成这项伟大事业。"
 MAR_koseco_rebuild_infr:0 "基础设施重建"
 MAR_koseco_rebuild_infr_desc:0 "纳粹的狂轰滥炸给我们的国家带来了巨大的创伤，道路、学校、医院以及其他基础设施都遭到了严重破坏。即使在布哈林执政的苏联时期，我们也未能完全恢复这些基础设施，而如今，我们依然没有解决这个问题，仅仅是因为我们忽视了它的存在。为了国家的长远发展，为了人民的福祉，我们必须将基础设施重建工作提上日程，并将其视为一项刻不容缓的国家战略。\n\n大量统计数据表明，仅仅一条道路的修建就能显著促进一个地区的经济发展，更不用说其他基础设施的建设了。如果我们想要加快国家经济增长的步伐，基础设施重建是必不可少的一环。"
 MAR_koseco_foreign_specs:0 "邀请外国专家"
 MAR_koseco_foreign_specs_desc:0 "如果我们想要发展经济，就需要招募优秀的专业人才。然而，尽管我们做了很多努力，国内的专业人才仍然十分匮乏，尤其是能够操作现代化机器设备和掌握先进技术的专业人才。我们现有的技术人员，大多毕业于苏联布哈林时代的学校，即使在当时，他们的知识也已经落后于时代了。\n\n唯一的出路，就是向其他国家的同行学习——主要是瑞典和美国，他们在这些方面最为先进。我们要把他们请到国内来，让他们用丰厚的报酬，来培训我们的技术人员。只有这样，我们才能赶上世界先进水平。"
 MAR_Kosygin.17.t:0 "研讨会的同事"
 MAR_Kosygin.17.d:0 "两个陌生人来到了工厂，其中一个衣着光鲜，举止优雅，怎么看都不像个俄罗斯人。另一个人看起来倒是像个本地人。后来在会上，大家才知道，那个外国人是从美国来的专家。翻译向工人们转达了他的话：\n\n“各位同事，大家好，我是亚当·尼克松，来自美利坚合众国。在接下来的四年里，我将担任你们的教官，指导大家学习新的机器操作方法，并掌握新设备的使用技巧。”\n\n工人们注意到，这个美国人站不稳，总是喜欢用左脚站立，脸上还带着奇怪的笑容，露出了一口牙齿，肢体语言也十分丰富。在俄罗斯人看来，他的很多行为都显得十分怪异。俄罗斯人不怎么喜欢笑，就算笑，一般也不会露出牙齿。在很多人眼里，这个美国人的笑容充满了虚伪和做作。但碍于他的专家身份，以及他可能会教给大家一些东西，所以也没人敢说什么。"
 MAR_Kosygin.17.a:0 "尽管如此，我们在某些方面还是有所不同。"
 MAR_koseco_double_factories:0 "双用工厂"
 MAR_koseco_double_factories_desc:0 "我们的工厂必须是多功能的，随时准备转而生产军工产品。在任何时候，面条厂、火柴厂和锅厂都应该开始生产枪支、子弹和头盔，这些都是我国在战争时期所必需的。\n\n布哈林的苏联并没有为德国强加的战争做好准备，但如果工厂能够适应军工产品的即时生产，苏联本有机会以某种方式抵抗战争。为了不重蹈覆辙，我们必须制定计划，使各地的工厂适应军事需要。"
 MAR_Kosygin.18.t:0 "新命令"
 MAR_Kosygin.18.d:0 "厂长凝视着面条工厂里忙碌的下属，只见那流水线上，各式面条纷至沓来——螺旋状的、管状的，还有简简单单的长条。在西俄罗斯，这些面条已然成了百姓餐桌上的常客。它们价格低廉，不论是真心喜爱，还是囊中羞涩，人人都能负担得起，自然也就成了抢手货。\n\n回到办公室，处理完日常事务，一封看似寻常的信件映入眼帘。拆开信封，赫然映入眼帘的是“以防万一指令......”几个大字，厂长继续往下读去。指令内容明确指出，一旦战事爆发，这家工厂必须立刻转型，全力生产子弹以及其他能够在此地改装生产的军工产品。\n\n虽说早已料到时局动荡，但这份指令仍让厂长倍感意外。唯一的疑问萦绕心头：如何将一家面条工厂，转变为生产金属子弹的兵工厂？好在，行动指南紧随其后，详尽地列出了需要查阅的文件清单。厂长深知，当下必须尽快熟悉这些内容，并将“战时转型”的重任牢记于心。"
 MAR_Kosygin.18.a:0 "如果前线需要，我们就能做到！"
 MAR_koseco_Glushkov_project:0 "格卢什科夫工程"
 MAR_koseco_Glushkov_project_desc:0 "尽管计划经济的优势显而易见，然其弊端亦不容忽视，且随着经济规模空前膨胀，这些弊端日后恐将愈发凸显。其中，首当其冲的便是官僚掣肘，此顽疾必将如跗骨之蛆，难以根除。\n\n官僚习气的滋生在所难免，缘于经济发展、规模扩张的同时，必然伴随着海量文书工作的堆积。长此以往，繁文缛节必将导致整个经济体系僵化，如鲠在喉，使其丧失应对时代挑战的灵活性。\n\n关于此症结，新兴学科——控制论领域涌现出一个引人注目的方案，乃是格卢什科夫与基托夫两位科学家联袂提出的划时代构想。对于他们的建议，我们务必予以高度重视，认真倾听。"
 MAR_tt_ogas_mech:0 "将开放获取有关发展OGAS的决议。"
 MAR_Kosygin.19.t:0 "国家自动化统一系统"
 MAR_Kosygin.19.d:0 "马斯连尼科夫与沙皇柯西金-罗曼诺夫本人正聚精会神地听取着两位控制论科学家——格卢什科夫和基托夫关于一项全新计划的汇报。这项计划的全称冗长拗口，但简而言之，可以称之为：OGAS。\n\n在简明扼要地介绍这项计划时，格卢什科夫和基托夫试图尽可能地吸引在座的每一位西俄罗斯人民公国权贵的注意。格卢什科夫言简意赅地阐述了整个系统的工作原理，以及它的各个组成部分将如何相互连接，数据将如何传输等等。而基托夫则在一旁解释道，一旦我们将大量的资金和精力投入到该项目的实施中，我们将会从中获得怎样巨大的收益。\n\n汇报结束时，马斯连尼科夫和柯西金-罗曼诺夫都对这项计划表现出了极大的兴趣。最重要的是，该项目具有极其广阔的发展前景——它不仅有助于彻底解决未来官僚体系中的文牍主义问题，甚至能够防患于未然，而且在当下，它也能极大地推动科学进步，并显著提高行政管理的效率，这正是我们当下迫切需要的。\n\n“整个项目的实施需要耗费多少资金？”马斯连尼科夫问道。\n\n“这主要取决于项目的研发规模以及OGAS系统在经济领域中的应用程度。”基托夫回答道。\n\n“就目前而言，”格卢什科夫补充道，“我们还尚未对整个项目进行全面而深入的评估。现在我们所看到的仅仅是冰山一角，如果您能够批准，我们将对该项目进行进一步的研发。但无论如何，我们都需要大量的资金投入。”\n\n“依我拙见，”柯西金-罗曼诺夫开口说道，“如果我们现在就投入资金，这个项目在未来将为我们带来难以估量的回报。而投入到OGAS项目中的资金，也将很容易就能收回成本。马斯连尼科夫同志，我认为我们应该重视这个项目，并立即着手为其提供资金支持。”\n\n“我想您说得对。一旦资金到位，我们会立刻将其投入到这个项目中。”"
 MAR_Kosygin.19.a:0 "我们甚至会把德国人甩在身后！"
 MAR_koseco_privats:0 "开放私营企业"
 MAR_koseco_privats_desc:0 "我国经济的第二个组成部分应该是社会主义经济中的市场体系。实践有时表明，与国有企业相比，私营企业更先进、更有效率。他们能够迅速适应市场需求，满足人民的需要。同时，如果我们允许私营个体的存在，我们就可以在不使用自有资金的情况下创造就业机会。\n\n然而，与国家不同的是，他们会受到各种危机的影响。我们必须牢记这一点，必要时，我们的政府需要对私营企业的事务进行干预。"
 MAR_koseco_support_kulaks:0 "国家的伙伴-富农"
 MAR_koseco_support_kulaks_desc:0 "我国经济的第二个组成部分应该是社会主义经济中的市场体系。实践有时表明，与国有企业相比，私营企业更先进、更有效率。他们能够迅速适应市场需求，满足人民的需要。同时，如果我们允许私营个体的存在，我们就可以在不使用自有资金的情况下创造就业机会。\n\n然而，与国家不同的是，他们会受到各种危机的影响。我们必须牢记这一点，必要时，我们的政府需要对私营企业的事务进行干预。"
 MAR_Kosygin.20.t:0 "萨姆-3，萨姆-4"
 MAR_Kosygin.20.d:0 "寒风萧瑟，农夫伊万驾着马车，一路颠簸，向着城里的社会救助中心驶去。 他从报纸上得知，如今每位农夫都有机会领取一份社会补贴，这份补贴旨在帮助他们支付播种和种植各种作物的费用。 在他看来，既然有这样的机会，那就应该好好利用，毕竟，这次的收成并不如他所愿。\n\n“萨姆-3”意味着，从播种的1桶谷物中，伊万只能收获3桶。这样的产量仅仅能够维持生计，勉强够再播种一次。但要想改善生活，他需要达到“萨姆-4”，也就是从1桶谷物中收获4桶。这样一来，他就能将多余的粮食出售到市场，从中获利。然而，事与愿违，伊万这次只达到了“萨姆-3”，所以他需要资金来支持下一季的播种。为此，他策马前往城市，寻求帮助。\n\n抵达专门的资金发放点后，他提供了所有必要的信息，包括他的田地大小。根据这些信息，他获得了刚好够支付播种费用的资金。现在，他手头有了一些闲钱，可以用来购买化肥和种子以外的东西了。如果一切顺利，他甚至可以攒钱买一辆拖拉机。"
 MAR_Kosygin.20.a:0 "有了钱，生活会变得更轻松。"
 MAR_koseco_jap_partners:0 "日本合作方"
 MAR_koseco_jap_partners_desc:0 "与其他国家开展贸易对我国经济和其他任何国家都是必要的。我们不能仅仅依靠自己的资源来发展我们的国家，因此我们必须与其他国家进行交流，主要是那些声誉好、报价高的国家。\n\n俄罗斯经济中的工业设备问题很多，如起重机、挖掘机、推土机等。此外，还有一些简单的消费品，如录音机、电视机、收音机等。目前，日本在这方面占主导地位——他们在这一领域比世界其他国家拥有技术优势。因此，我们必须首先向他们了解我们感兴趣的项目。\n\n当然，我们不可能白白得到这一切：要想得到一些东西，我们就必须给他们一些回报——我们将给他们提供资源，而他们也会对这一提议感到满意。"
 MAR_Kosygin.21.t:0 "工业机器人"
 MAR_Kosygin.21.d:0 "一列不同寻常的卡车载着大型集装箱来到汽车厂。这些集装箱上写着各种象形文字，这在这里很少见。该死，看起来像是日文或中文。看着这些货物的工人们都在猜测里面可能装着什么。\n\n最好奇的工人猜测，里面可能有一些新的工业设备。不过，在打开集装箱之前，谁也无法确定。集装箱里有一些机械装置，如果说它们可以与任何东西相提并论的话，那么它们最像钳子。这些机器人的钳子有几种类型的肢体——吸盘、焊接机、抓手和操纵器。它们引起了汽车厂工人们的极大兴趣。\n\n安装了这些机器人后，工人们继续像往常一样工作，但他们也启动了这些机器人，看看生产效率会提高多少。结果没等多久就出来了：一天结束时，工厂比平时多生产了5辆汽车。"
 MAR_Kosygin.21.a:0 "新技术——新机遇！"
 MAR_koseco_usa_friends:0 "美利坚伙伴"
 MAR_koseco_usa_friends_desc:0 "美利坚合众国是目前世界上最富有的国家。由于其资本主义制度的力量，很大一部分经济联系都与之相关，从而产生了巨大的国内生产总值。他们的经济是一个很好的例子，说明市场上可以为消费者提供多种多样的商品，从而创造了美国的财富和丰富多彩的一切。\n\n当然，美国在某些技术方面并不是最先进的国家，但它在许多指标上都稳居领先地位，是可以想象的最佳贸易伙伴之一。我们可以从他们那里购买我国人民为增加繁荣所必需的消费品：茶叶、咖啡、巧克力和其他异国食品。"
 MAR_Kosygin.22.t:0 "外国佳肴"
 MAR_Kosygin.22.d:0 "彼得是一个8岁的孩子，放学后正在做作业。虽然他不像他的父母那样有很多问题，但他并不是一个娇生惯养的孩子。相反，他相当勤奋和努力，他想要学习和研究。虽然他从课本上听说过有这种难以想象的美味，但他从来没有亲眼见过，他想长大后一定要尝尝这些美味。\n\n然而，他却意外地慷慨解囊。爸爸下班回家，从商店里买了些日用品。妈妈立刻接过食品袋，把它拿到厨房，爸爸拿出一根条子，上面写着孩子同样看不懂的字母。他已经认识并理解了其中的一些字母，但却拼不出一个对他有意义的单词。“吉百利牛奶”——这个词对孩子来说绝对陌生。\n\n“佩蒂亚，这是巧克力。”\n“哇，真的吗？”儿子高兴极了，两眼放光地看着这块巧克力。”\n“是的，你还记得在书上看到过吗？”\n“是的，我记得！”\n“打开吧孩子，尝尝这块巧克力。”\n\n彼得开始拆开这块巧克力的包装，尽量不让它破损或受到任何伤害。他屏住呼吸，看到面前摆着5排3块小方块，他掰下一块放进嘴里。细腻的牛奶巧克力在孩子的口中开始融化，他对这样的美味感到由衷的高兴。彼得还想再尝尝，但他怕现在就吃完，于是他合上了包装，准备以后再吃，也许要过很长时间。\n\n“爸爸，巧克力真甜！”\n“如果你还想要，就说一声，我给你买。”"
 MAR_Kosygin.22.a:0 "快乐是我们能给予孩子的最好东西。"
 MAR_koseco_Technospy:0 "技术间谍"
 MAR_koseco_Technospy_desc:0 "我们的国家毫无希望地落后于世界其他国家。几十年来，俄罗斯在现代技术方面的落后、多年的战争、多年的破坏和混乱导致我们的科学和教育体系即使没有退化，至少也已经落后于当前的趋势。当全世界都已经拥有核技术并将人类送上太空时，我们才刚刚开始掌握工业技术，而这些技术本身大多已经过时，或将在不久的将来被淘汰。\n\n我们所能采取的一切措施都可能是不够的，因此我们必须尝试对其他国家的技术和科学发展进行技术间谍活动。我们最感兴趣的目标是美国，我们将派遣克格勃雇员前往美国，研究那里的现有技术，并渗透到他们的科学中心。"
 MAR_koseco_faster_than_future:0 "超越未来"
 MAR_koseco_faster_than_future_desc:0 "我们已经为未来数十年的经济发展奠定了坚实的基础。我们的体制成功地融合了资本主义和社会主义的主要思想，将计划经济与市场经济的原则合二为一。更重要的是，我们拥有最坚强的后盾——俄罗斯人民的精神力量。我们的社会主义带有俄罗斯特色，也许会招致各种各样的批评——我们不是共产主义者，也不是君主主义者——我们是青年俄罗斯联盟，我们创造了一种真正的俄罗斯精神，并体现在我们的经济体制之中。\n\n现在是迈向未来的时刻了。我们已经为实现国家富强打开了希望之窗，人民很快就会享受到这一切。我们已经取得了举世瞩目的成就，而未来必将更加辉煌。"
 MAR_Kosygin.24.t:0 "马斯连尼科夫的报告"
 MAR_Kosygin.24.d:0 "经济部长马斯连尼科夫直接向阿列克谢·罗曼诺夫汇报了首次经济和科学改革的结果。马斯连尼科夫不仅呈现了报告，还展示了各种图表，试图以最详细的方式讲述一切，同时避免在这几十个数字、图表和百分比的分析中迷失方向。马斯连尼科夫的报告总体上非常出色，给人的印象是这个人不仅准备了汇报，还准备了一份论文答辩。这也可以从马斯连尼科夫的着装中看出——他非常严谨的西装比平时更加严谨，使他显得有纪律性。\n\n报告包括OGAS项目的发展、各个人口群体的社会援助计划、整体工业发展、工人素质提升的统计数据等等，可以继续列举很长时间。总的来说，国内生产总值的发展指标令罗曼诺夫满意——自俄罗斯帝国和布哈林领导下的苏维埃政权初期以来，从记忆中得知，还没有看到过如此快速的经济发展。\n\n即使马斯连尼科夫介绍了主要的积极因素，他也不希望罗曼诺夫被成功冲昏头脑，因此他提醒他经济中存在需要解决的负面问题。然而，罗曼诺夫根本不打算“被成功冲昏头脑”，他是一个终极现实主义者，他只看赤裸裸的事实，统计数据说明了什么——这就是客观现实。\n\n在报告的最后，马斯连尼科夫提到，公国的经济还存在一些系统性上的问题，但总体上是可以解决的。只需调整发展的道路，等待青年俄罗斯联盟活动的进一步成果。阿列克谢·罗曼诺夫赞扬了马斯连尼科夫的整个报告，并表示将为他的艰苦工作颁奖。"
 MAR_Kosygin.24.a:0 "祖国为您骄傲！阿列克谢二世·罗曼诺夫为您颁奖！"
 MAR_koseco_DCP:0 "计算机的发展"
 MAR_koseco_DCP_desc:0 "未来的主要工具将是电子计算机。自从电子计算机出现以来，它们就积极地融入了人们的生活和整个科学，并最终带动了社会各部门最积极的发展。现在很明显，如果没有这些机器，任何国家都有可能完全落后于那些拥有这些计算机的国家。\n\n显然，我们需要这些机器，我们必须开始开发我们自己的机器，以便不再依赖外国计算机技术模型的供应。这不仅关系到经济独立，也关系到我国在世界上的声誉。"
 MAR_koseco_future_technologies:0 "未来技术"
 MAR_koseco_future_technologies_desc:0 "尽管我国目前的技术发展水平不高，但在其他国家尚未成功或发展缓慢的领域，我国仍有一些技术发展机会。在他们止步不前的地方，我们要有所突破；在他们失败的地方，我们很有可能成功；在我们能够做到的地方，我们要勇往直前，努力追赶和超越现有国家。\n\n我们必须在科学领域给予思想自由，让他们充分实现自我。他们将能够实施自己的项目，从而使我们能够赶上世界领先国家。当然，有了一定的伦理道德..."
 MAR_koseco_Best_education:0 "最好的教育"
 MAR_koseco_Best_education_desc:0 "我们的国家已经足够强大和稳定，可以在社会精神领域进行更认真的改革。现在是时候对所有儿童实行免费义务初等教育，将识字率提高到前所未有的高度了。曾几何时，在布哈林主义的苏联，虽然人人都能接受免费教育，但在俄罗斯崩溃期间，国家的视野中失去了这一概念，因为为儿童提供教育的成本实在太高了。\n\n现在，我们有一切手段和机会在我国发展教育，我们必须对所有儿童实行义务教育，每个家长都必须送自己的孩子上学，让他们在学校里接受有关世界的初级知识。只有这样，我们才能为国家的进一步繁荣奠定基础。"
 MAR_Kosygin.23.t:0 "初入校园"
 MAR_Kosygin.23.d:0 "父母带着他们的孩子第一次去上学，进入一年级。他们挑选了符合家长会要求的衣服，不得不跑了将近一半城市去买这些衣服。除了衣服，他们还得购买文具——钢笔、铅笔、笔记本、背包和铅笔盒……每个学生都需要的一切。给一年级的老师买鲜花也值得特别关注。送给一年级老师的花也值得特别关注。他们选择了最茂盛的花朵，就像父亲送给妻子的那种。他们不清楚儿子老师的喜好，所以决定根据自己的喜好来选择。\n\n要说这个过程对任何一个七岁男孩来说都很累人，那简直是轻描淡写了，因为这个男孩早上根本没有睡够觉。最后，男孩和父母一起回到了家，父母给他买了他需要的一切。是时候为第一次上学收拾第一个背包了。教科书将在学校后期发放，现在他们必须准备第一批笔记本和第一个铅笔盒，把男孩需要的一切放进去。\n\n在准备好一切之后，夜晚悄然降临。很快，这将是男孩第一次上学的旅行，他的第一次学校集会，也是他生活中新阶段的开始……"
 MAR_Kosygin.23.a:0 "老师在学校教我们用细钢笔把字母写本子上……"
 MAR_kosmil_to_protect_motherland: "为了保卫祖国！"
 MAR_kosmil_to_protect_motherland_desc: "布哈林领导下的苏联是虚弱的，这不仅是因为它的经济无法承受德国坦克的压力，还因为我们的军队在许多方面——在士兵训练、装备、指挥和参谋计划以及许多其他方面--都极其薄弱。如果我国有一支强大的军队，我们本可以避免1941年夏季和冬季的灾难。\n\n今天，情况丝毫没有改变。祖国的统一主要依靠军事力量，这是不争的事实。如果没有强大的军队，俄罗斯就不可能统一，而在当前形势下，当我们正在积极准备进一步统一俄罗斯时，这一点尤为重要。我们需要一支庞大的、可随时投入战斗的军队，这支军队可以粉碎我们前进道路上的任何敌人。"
 MAR_Kosygin.25.t: "变革之需"
 MAR_Kosygin.25.d: "阿纳托利·瓦维洛夫收到了来自沙皇本人的命令。命令的内容是检查军队的战备状态，以免1941年发生的事情重演。在很短的时间内，他就绘制出了一幅大致统一的图画...... \n\n尽管军队的装备和组织水平相对较高，但与几个月前相比，情况并不理想。军队仍然停留在由仍然在世的卡津别克领导的西俄罗斯战役期间的水平上，战术技能、战斗训练，有的甚至装备仍然大部分来自那个时期。军队即使有能力抵抗，也只是在地区层面，但作为一个整体，它肯定抵挡不住假想中的德国。\n\n在向沙皇罗曼诺夫汇报这一切时，他只问了一句：“你打算如何解决这些问题？”瓦维洛夫粗略地回答道：“如果我们想提高我军的战备状态，那就需要对其进行改革。关于我军具体需要进行哪些改革，我有自己的想法和计划。如果你们给我改正的机会，最终你们会得到一支强大的军队。”\n\n当然，军队不会立即变得强大。起初，需要从小的命令开始，然后再做更严肃的事情。但总的来说——他的话给出了一个保证，一切都会顺利进行。沙皇只是同意了瓦维洛夫的建议，并允许对军队进行这些改革。"
 MAR_Kosygin.25.a: "只有军队强大，俄罗斯才能强大。"
 MAR_kosmil_reorganise_minwar: "重组国防部"
 MAR_kosmil_reorganise_minwar_desc: "我们的军队领导层大多由经验丰富的老军官组成。其中许多军官曾在苏联服役，现在也在我军服役。然而，他们在卫国战争期间学到的东西现在已经过时了。此外，老军官的主导地位阻碍了新军官的晋升，这往往会严重损害整个军队。\n\n我们必须认识到，需要将其中一些军官送入预备役，为年轻有为的军官让路。当然，我们不会将所有老军官都送入预备役，只会将那些战斗力极低的军官送入预备役。其余的平均水平以上的军官可以留下来。"
 MAR_kosmil_expand_Archangelsk_ports: "扩大阿尔汉格尔斯克港"
 MAR_kosmil_expand_Archangelsk_ports_desc: "如果我们想拥有自己的舰队，那么首先必须确保我们的船只存放在港口，并建造新的船只。为此，我国只有一个港口城市是合适的，几个世纪以来，俄罗斯的北大门一直是阿尔汉格尔斯克。只有这样的港口城市才具有巨大的贸易和军事建设潜力。\n\n对于阿尔汉格尔斯克最合理的做法是解封许多以前未使用的港口。此外，我们还必须建造更多的船坞，使我们能够建造特殊尺寸和用途的船只。因此，瓦维洛夫颁布了关于在阿尔汉格尔斯克解封和建造新港口的法令。"
 MAR_kosmil_weapon_modernisation: "武器现代化"
 MAR_kosmil_weapon_modernisation_desc: "我们的武器主要是西俄战争时期的老式武器。可以毫不含糊地说，它们是好武器，几乎是西俄的制胜武器，但我们往往认为敌人拥有更先进的步枪、榴弹发射器和其他一切可以极大地毁掉我们生命的东西。到头来，我们的武器可能只是在射速和可靠性方面落后于敌人，而这在未来会起到重要作用。\n\n为了提前避免这种情况，我们需要对现有类型的武器进行深入的现代化改造，将其投入生产。我们很可能无法从根本上创造出新的步枪，因此我们需要改进已经从正面证明了自己的老式步枪。"
 MAR_kosmil_new_avia: "航空业的发展"
 MAR_kosmil_new_avia_desc: "如果我们需要一支强大的军队，我们就必须确保敌人不会获得对我们的空中优势。分析伟大卫国战争的经验，我们可以权威地断言，航空技术已经变得非常重要，这就强烈需要对其进行控制，因为如果敌人占据优势，他们就会轰炸我们的城市和补给线，削弱我们的防御。\n\n我们的航空技术不先进，这是事实。我们充其量还停留在二十世纪五十年代的水平。我们的战斗机大多还是活塞动力的，而世界其他国家已经达到了超音速的门槛。我们必须纠正这一错误，必须在很短的时间内赶上军事航空领域的先进国家。"
 MAR_kosmil_new_training_methods: "新训练方法"
 MAR_kosmil_new_training_methods_desc: "由于训练水平仍停留在西俄战役期间的水平上，我们需要对士兵的训练进行强有力的审查。如果说以前士兵的理论和体能训练足以抵御伪政权，那么现在的训练水平就至少是不可接受的——它太弱了，无法与更强大的对手抗衡。特别是考虑到乌拉尔山以外的其他国家完全有能力通过军事手段实现俄罗斯的统一。\n\n我们必须在这方面超越他们，而要做到这一点，我们需要改变一切——理论基础、日程安排、负荷水平等等。如果我们这样做了，我们就能在不增加军队规模的情况下立即加强我们的军队。"
 MAR_Kosygin.26.t: "学起来难"
 MAR_Kosygin.26.d: "与前几天相比，营员们起得非常早，因为他们被“连队，起床！”的命令惊醒。每个人都措手不及，尽管他们已经养成了听到命令后迅速起床的习惯，但他们从来没有这么早起过床。\n\n指挥官把整个营集结在操场上，并宣布了以下内容：\n\n“同志们！我们收到了来自西俄罗斯人民公国国防部的命令。从今天起，日程安排、体能和理论训练将有所不同，我们将按照这个日程安排生活。现在我们要做的第一件事是晨跑。绕场一周！”指挥官一说完这句话，整个营180度转身朝向操场。“向前，行进！”\n营员们以晨跑开始了他们的一天，大约持续了一个小时。即使一天还没有开始，许多士兵已经喘不过气来了。早餐期间他们有机会休息，因为他们只有半个小时的时间用于进食和休息。在如此短暂的休息之后，理论课开始了，使用的是根据世界潮流和最近军事冲突经验编写的新教材。士兵们必须对一切可能的内容做笔记，因为这些材料非常重要且全新。\n\n理论课结束后，有更多时间休息和用餐，但午餐后立即开始了全面发展的训练——体操、跑步、肌肉耐力发展等等。在另一堂体育课之后不久，还有一样密集的理论课。\n\n不久之后，在课程结束后，列兵们终于有一些小片刻的自由时间，可以喘口气，擦去脸上的汗水，并进行卫生程序。但他们立即被警告，第二天将进行理论实践，现在他们必须进行演习。演习的内容他们不透露，保持了秘密。稍作休息之后，当地时间大约22:00，下达了“解散”的命令——休息。官兵们在这样的训练中都感到了肌肉疼痛，所以全营几乎立刻就睡着了。"
 MAR_Kosygin.26.a: "也许用起来容易？"
 MAR_kosmil_tank_squads: "坦克部队"
 MAR_kosmil_tank_squads_desc: "伟大的卫国战争和西俄战役的经验表明，坦克部队集结成一个强大的拳头，几乎是突破任何复杂防线的主要工具。坦克只要使用得当，就能使敌方步兵自然败退，因此我们必须以最积极的方式使用坦克。然而，我们的坦克部队存在很大问题--与世界先进国家的坦克相比，它们已经过时。这在很大程度上取决于坦克的功能、速度、装甲和火炮，以及坦克在战场上的效能。\n\n因此，我们必须抓紧时间弥补失去的时间，我们必须开始改进我们的坦克部队——制造出更现代化、更好的坦克，在四分五裂的俄罗斯领土上与外国同类坦克相媲美，并超越别国制造的坦克。"
 MAR_kosmil_military_academies: "创办军事院校"
 MAR_kosmil_military_academies_desc: "我军整个军事改革的最后一环是建立专门培养新军官的军事院校。如果我军没有多少合格的军官，他们的流失将是极其痛苦的，因此，我们必须依靠大量培养新军官，他们将年复一年地从那里走出来。\n\n只要我们建立了军事院校，我们就能完成军事改革。"
 MAR_Kosygin.27.t: "新苏沃洛夫军校"
 MAR_Kosygin.27.d: "在这一天，首都的主要政府代表 - 市长、将军、国防部长阿纳托利·瓦维洛夫和阿列克谢二世·罗曼诺夫齐聚一堂。他们所有人都聚集在这里，为了一个重要的事件——为首都新的苏沃洛夫学院揭幕，该学院采用了全新的建筑风格，与俄罗斯各地的其他类似建筑不同，建筑和内部空间看起来非常现代化，因为它们是用在西俄罗斯能获得的最好材料建造的，与俄罗斯其他类似建筑不同。\n\n剪断象征学院开幕的红丝带后，每位官方代表开始发表讲话。市长谈到他很高兴这座城市收获了如此美丽的建筑，将军谈到了军官和军队的重要性，国防部长谈到了这所学院培养的军官将会有多优秀。阿列克谢-罗曼诺夫谈到这一切都是为了整个俄罗斯的共同利益。\n\n演讲一结束，大会就在军乐进行曲中落下帷幕，就在同一天，学院开始了它的工作..."
 MAR_Kosygin.27.a: "有一种职业以保家卫国为责。"
 MAR_kosfor_red_eagle: "红鹰在天"
 MAR_kosfor_red_eagle_desc: "是时候让我们的国家发出自己的声音了。自从任何有点中央集权的国家解体以来，我们俄罗斯人民就一直处于国际孤立状态。在西俄战役之前和期间，我们的大多数战地指挥官和伪统治者都与外国没有外交关系，只有少数可怜的人与西方或东方有任何接触。但现在情况发生了变化，我们的国家已经出现在世界地图上，总体上已经具备了一个中央集权国家的所有标志，但我们仍然没有与任何人建立适当的外交关系。\n\n我们国家必须利用外交，利用外交来实现我们的想法和利益，在这方面，我们必须覆盖尽可能多的国家和地区。"
 MAR_Kosygin.28.t: "外交部"
 MAR_Kosygin.28.d: "彼得·尼洛维奇·德米切夫，西俄罗斯人民王国的外交部长，向他的外交官们解释了我国外交政策的主要任务和方向。根据德米切夫的说法，他已经制定出了一个计划，这个计划他现在正与阿列克谢·罗曼诺夫一同讲述，因此，外交官和使节们必须不择手段地完成既定任务，因为这不是彼得·德米切夫想要的，而是沙皇本人想要的。\n\n德米切夫开始说：“首先，我们的任务将是与世界的一极——不是美国就是日本建立友好关系。我们绝不能与纳粹合流，因为他们是我们的头号敌人，因此我们应该寻求任何能够同样对抗他们的国家的支持。”\n\n“我们为什么要从这两个选项中选择一个呢？问题是，我们仍在考虑与谁合作更好的多种选择。重要的是，我们不仅要获得军事和政治支持，还要与任何一方建立贸易关系。如果我国领导人宣布我们应与日本等国合作，那么我们就应全力以赴与他们合作。”\n\n德米切夫继续说：“除此之外，我们还应该与其他国家建立某种关系，首先是与第三世界国家，这样我们在世界政治中才能拥有严肃的分量，并在全世界各个角落捍卫我们的利益。”德米切夫以这句话结束了他的发言。“有任何问题吗？”"
 MAR_Kosygin.28.a: "没问题，我们要开始干活了。"
 MAR_kosfor_two_polars: "实力的两极"
 MAR_kosfor_two_polars_desc: "是时候选择我们首先关注冷战的哪一方了。选择支持一方还是另一方，可能会决定世界其他地区的命运，因此，我们不仅要考虑眼前的利益，还要考虑不久后必然到来的未来。\n\n在沙皇阿列克谢二世·罗曼诺夫做出最终决定并告诉德米切夫该怎么做之前，他必须理清我们所面对的每个国家的所有利弊。"
 MAR_Kosygin.29.t: "分析"
 MAR_Kosygin.29.d: "阿列克谢·罗曼诺夫仍在考虑选择哪个国家作为主要经济伙伴。显然，每个国家都有自己的优势和劣势，有时在比较中会表现得很明显。然而，总的来说，虽然看起来很奇怪，但它们是相当对等的。\n\n首先，如果我们把目光投向西方，美利坚合众国似乎是一个非常不错的选择。他们有一支强大的军队，是世界上最强大的经济体之一，而且，总体而言，它几乎是一个消费天堂，有种类繁多的不同产品，可以满足任何口味。如果我们注意一下，许多国家都与美国有贸易往来，因此他们几乎拥有一切可能提供的产品，至少在初期进口一些消费品对人民来说是件好事，可以提高他们的生活水平。\n\n另一方面，如果我们把目光投向太阳升起的东方，也有一个同样不错的选择——日本。日本没有那么强大的经济和军队，但他们的技术几乎是传奇（至少是柯西金所知道的）。据说，他们的工业技术和电子技术超过了美国人，正因为如此，他们正试图在经济方面赶上并超过美国人。由于借鉴了他们的技术，我们自己也可以在经济上赶上并超过其他人。"
 MAR_Kosygin.29.a: "所以，沙皇陛下的选择是？"
 MAR_kosfor_birthplace_of_democracy: "民主之源"
 MAR_kosfor_birthplace_of_democracy_desc: "因此，如果陛下愿意，我们就应该在美国开设大使馆。这意味着我们开始向西方靠拢，我们将从中获得巨大的经济利益。当然，与世界其他国家相比，我们会因为没有选择日本而失去一些技术优势，但我们将通过向人民提供种类繁多的消费品来弥补这一点。\n\n剩下的就是在那里开设大使馆了。只要沙皇一声令下，德米切夫就会派出大使。"
 MAR_Kosygin.30.t: "来自俄罗斯的爱"
 MAR_Kosygin.30.d: "阿列克谢二世·罗曼诺夫决定，最合适的行动方案是尝试与华盛顿建立联系。他命令德米切夫开始与美国建立贸易关系，德米切夫只是简单地回答说“会办到的”。因此，彼得现在需要准备派往美国的使节。\n\n一周后，整个代表团乘坐远程飞机横跨大西洋前往美国。大约10个小时的飞行对使节们来说十分困难，但他们还是顺利抵达了华盛顿，那里已经有人在等着他们，陪同我们的外交官前往白宫。\n\n总统和一些美国部长开始与我国使节进行讨论，并开始了漫长的谈判。这些讨论的主要内容是提供关于西俄罗斯人民公国的一般信息，并讨论他们的意图。根据总统的说法，他们对美利坚合众国总体上是友好的，因此谈判并不十分困难，但在涉及欧洲的问题上却出现了另外的复杂情况。总统和部长们用各种真话和谎言回避了有关这一地区的直接问题。\n\n最后，这次小型会议的坚定成果是决定在华盛顿开设公国官方大使馆。这是一个巨大的成功，尤其是考虑到俄罗斯不久前刚刚分裂成许多小的伪国家，并且在很长一段时间内都处于经济复苏阶段。"
 MAR_Kosygin.30.a: "友谊的第一块基石已经奠定。"
 MAR_kosfor_from_America_with_love: "来自美利坚的爱"
 MAR_kosfor_from_America_with_love_desc: "我们在美国开设大使馆后，立即开始与美国人建立积极的外交关系。在这里，最让我们高兴的是，他们很乐意向我们提供他们的商品，显然这是为了让他们占领我们的市场。我们可以允许他们进入我们的市场，但前提是他们必须继续向我们提供他们的商品，而这些商品对我们的人民来说是必不可少的。\n\n同样重要的是要明白，除了从普通罐头到奇特水果等基本食品之外，我国还需要其他一切——药品、汽车和一般家庭用品。这些商品和其他商品对于我们和其他国家一样都是必需的，因此，如果他们把这些商品带给我们，那么每个人都会从中受益。"
 MAR_Kosygin.31.t: "红十字会药物"
 MAR_Kosygin.31.d: "一辆卡车开到了医院，车上装着一大箱病人用的药品。后来才知道，这些药品来自总部设在美国的红十字会，该会向俄罗斯人民提供人道主义援助。\n\n这些箱子里装的是病人所需的药品，包括阿司匹林、安乃近和其他止痛药的俄国类似物，但只有质量高得多的外国药品。大量需要的青霉素也在这里。绷带、棉垫、棉花本身、止血带、注射器、抗生素，以及一个人生病时需要的各种药品，一应俱全。\n\n当然，在西俄罗斯人民公国境内，即使没有任何外援，也可以获得这些药品和许多其他药品，但生产的数量并不能满足需要。需要这些药品的病人将得到最好的治疗，以便康复和继续工作。"
 MAR_Kosygin.31.a: "人民的健康乃国家要务。"
 MAR_kosfor_pearl_of_Asia: "亚洲明珠"
 MAR_kosfor_pearl_of_Asia_desc: "因此，如果阿列克谢二世·罗曼诺夫希望西俄罗斯人民公国与日本合作，那就合作吧。我们必须在那里开设大使馆，就工业机器人和其他计算机设备的供应问题与他们展开谈判。当然，我们将无法从美国大量接收货物，但我们将以高效的工业来弥补，从理论上讲，我们的工业甚至可以超过日本等先进国家。\n\n现在只剩下在那里开设大使馆了。只要沙皇一声令下，德米切夫就会派出大使。"
 MAR_Kosygin.32.t: "东部之窗"
 MAR_Kosygin.32.d: "阿列克谢二世·罗曼诺夫决定，最合适的解决办法是尝试与日本帝国建立联系。他命令德米切夫开始建立与日本的贸易联系，他只是说了一句“好，就这么办。”因此，彼得·尼洛维奇现在必须为飞往日本帝国的使节做好准备。\n\n一周后，整个代表团乘坐超远程航班横跨大西洋前往日本。这次飞行持续了约十一个小时，对使节们来说非常艰难，但他们还是设法到达了东京，那里已经有人在等着他们，护送我国外交官前往政府大楼。\n\n首相和一些日本官员开始与我国使节进行讨论，并开始了漫长的谈判。最大的困难是语言障碍——如果不是翻译的帮助，俄语和日语之间的差距是很难克服的。这些讨论的主要内容是提供有关西俄罗斯人民公国的一般信息，并解释我们的意图。据首相称，他们对日本帝国普遍相当友好，因此谈判并不太困难，但在有关远东的问题上出现了个别的复杂情况。首相和官员们不择手段地回避有关这一地区的直接问题。\n\n最后，这次小型会议的坚定决定是在东京设立公国的正式大使馆。这是一个巨大的成功，尤其是考虑到俄罗斯最近分裂成许多小的伪国家，而且长期处于经济复苏过程中。"
 MAR_Kosygin.32.a: "我们向东方敞开了一扇窗！"
 MAR_kosfor_tokyo_embassy: "驻东京大使馆"
 MAR_kosfor_tokyo_embassy_desc: "就像彼得出国去大使馆一样，我们的外交官和雇员也必须去日本看看东方有什么有趣的东西。计算机、录音机、无线电设备、工业机器人，总之，一切有用的东西都必须进行审查并运往俄罗斯。当然，我们将为此付出代价，国家将补偿我们为此造成的所有损失。"
 MAR_Kosygin.33.t: "游览东京"
 MAR_Kosygin.33.d: "日本的销售商和企业家显然对让自己的商品充斥外国市场很感兴趣。这些市场是日本通过在其他国家销售自己的产品来充实自己的必要条件，因此日本人很高兴听到我国代表团提出参观日本各种科学成就的建议。\n\n为了让西俄罗斯的使节们高兴，我们为他们安排了一个完整的游览项目，让他们参观人民公国所需要的各种东西。从录音机、电视机、冰箱到机器人，这里应有尽有。顺便说一句，特使们对机器人尤其感兴趣。因此，使节们更感兴趣的是购买这些机器人，总之是签署一份贸易建议书，以高价向俄罗斯提供这些机器人。\n\n尽管日本人千方百计地讨好俄国，想卖出更多的商品，但不幸的是，他们失败了。使节们对自己的愿望毫不妥协，不打算带任何额外的东西回国。尽管使节们基本上走遍了整个东京，吃了很多美食，见识了很多技术，但他们并没有偏离购买特定工业机器人的愿望。最后，合同没有任何附加条款。"
 MAR_Kosygin.33.a: "营销之举没凑效。"
 MAR_kosfor_Delhi_travel: "前往印度"
 MAR_kosfor_Delhi_travel_desc: "除了与超级大国建立外交关系外，我们还必须关注其他可能对我们感兴趣的国家。首先当然是印度。这个国家的现代化潜力不亚于我们自己的国家，他们在发展自己的国家时也需要同样的帮助。因此，如果我们能在亚洲拥有一个巨大的市场，购买我们的商品，其数量之大是我们梦寐以求的，这对我们来说即使不是必须的，也是极为有利的。\n\n通过转售商品，或者例如使用新的机器人生产质量更好的产品，然后销售同样的产品，我们可以使印度人的生活比以前好得多，我们的经济也将从中受益匪浅。"
 MAR_Kosygin.34.t: "帮助近邻"
 MAR_Kosygin.34.d: "印度是世界上最贫穷的国家之一，尽管人口众多，因此劳动力数量庞大。印度没有工业，几乎所有的经济活动都以农业为主，并面临着饥饿的风险。我们甚至还没有提到，印度国内存在许多社会问题，政府正在努力解决这些问题，但都取得了不同程度的成功。\n\n尽管印度是一个贫穷的国家，但它拥有巨大的发展潜力。印度有如此多的工人，如果该国有工业，劳动力成本将与中国的劳动力成本差不多。我们甚至还没有提到，印度的产量可能达到世界产量的三分之一。\n\n虽然印度没有工业，但他们需要消费品。我们有一个印度无法拒绝的建议——我们可以向他们出售我们的消费品，甚至投资印度工厂，帮助他们发展、扩大和生产消费品。我们把时间花在他们身上，就能得到钱，还能在经济和政治领域得到一个非常重要的合作伙伴。因此，如果我们现在与他们接触，我们将在未来为自己赢得有利地位。"
 MAR_Kosygin.34.a: "发送请求"
 MAR_kosfor_Transural_amogus: "渗透到乌拉尔山之外"
 MAR_kosfor_Transural_amogus_desc: "显而易见，在不久的将来，俄罗斯之战仍将继续，俄罗斯也将因此而统一。最大的问题是俄罗斯将在哪一面旗帜下统一。现在还很难确定，因为统一俄罗斯的竞争者太多了。\n\n目前，我们最优先考虑的对手是乌拉尔山脉以外的伪国家。显然，他们的伪领袖也把我们视为对手，很可能会试图消灭我们。至少，他们没有表现出任何希望和平谈判的迹象。因此，我们必须确保西西伯利亚的伪政权从内部遭到破坏，以便民众破坏针对我们的整场战争，将我们视为英雄——解放者，或者至少接受我们为俄罗斯唯一合法的统治者。"
 MAR_Kosygin.35.t: "乌拉尔山之外"
 MAR_Kosygin.35.d: "克格勃“伽马”小队正在穿越乌拉尔山脉进入西西伯利亚境内，他们必须在一夜之间完成任务。这项任务实际上是可以完成的，但难度极大，因此要挑选最优秀、最合适的人员执行任务。\n\n克格勃“伽马”小队的目标是什么？他们要开始破坏西西伯利亚局势的稳定。他们是熟练的特工，可以进行宣传，从而破坏国家的稳定和敌方士兵的战斗精神。宣传和煽动是大规模杀伤性武器，在敌人身上出现最初的负面症状堪比乌龟的速度，而其破坏效果却只有核弹才能与之媲美。语言可以造成轰炸无法造成的破坏。\n\n克格勃“伽马”小队已经潜入西西伯利亚境内，他们穿过森林，躲藏起来，然后向人口稠密的地区进发，他们将在那里开始活动，藏身于人群之中。从那里开始，他们将日复一日地破坏敌人的防线，不管他们是谁。"
 MAR_Kosygin.35.a: "如果在战斗之前就击溃敌人，那么你就已经赢了。"
 MAR_kosfor_Tsar_legion: "沙皇军团"
 MAR_kosfor_Tsar_legion_desc: "美国、日本和德国之间的三方冷战正在全世界肆虐。尽管这场冲突并不公开，但世界的稳定却受到了极大的质疑——由于这三个超级大国的势力边界之间存在紧张关系，世界所有地区都不稳定，也没有和平共处的信念。由于冲突三方都拥有核武器，直接的战争是不可能发生的，但世界上也存在地区冲突，通常是内战或局部性质的战争，如最近的南非战争，美国和德国之间就存在利益冲突。\n\n我国必须尽可能捍卫自己的利益。西俄罗斯人民公国已经成为一支真正的力量，但我们在这个世界上的影响力很小。在这种情况下，我们必须在内战或两个地区国家之间的直接冲突中帮助忠于我们的政权，从而赢得我们在世界上的影响力。在这项艰巨的任务中，沙皇军团必须帮助我们，其人员构成将与法国外籍军团类似，并作为志愿者在国外使用。"
 MAR_Kosygin.36.t: "阳光下的地盘"
 MAR_Kosygin.36.d: "市民们越来越多地从报纸上看到了组建沙皇军团的消息--据报纸生动地描述，这支特殊的部队将招募任何想在他们的军队中服役的人，包括异国的少数民族——各种法国人、黑人、阿拉伯人、美国人，甚至德国人和其他所有渴望在我们的军团中服役的人，当然有一个前提条件。当然有一个前提条件，那就是每一个这样的人都必须忠于我们的国家和沙皇。然而，很明显，在这个军团中，这样的少数民族很少，绝大多数士兵都是加入这个军团服役的俄罗斯人。\n\n报纸上正在直接煽动人们加入沙皇军团。在“你将看到世界”、“你将保护你的国家”等许许多多的承诺中，你可以看到一些虚假的东西。在“我们将保护穷人和需要帮助的人”式的美好愿望背后，给人的感觉是这个国家只需要能为其地缘政治利益而战的人。唯一有吸引力的是巨额的服役工资，有了这笔工资，就可以长期无忧无虑地生活。无论如何，到非洲、中东、亚洲、美洲等世界各地访问的可能性也很有吸引力。"
 MAR_kosfor_third_world: "第四世界国家"
 MAR_kosfor_third_world_desc: "同样值得关注的还有所谓的“第四世界”国家。这些国家是我们所知道的最贫穷的国家，这些国家的贫困程度非常严重，即使一个人拥有一栋房子和一些现代文明带来的好处，也已经被认为是当地人民的极大繁荣。诸如此类的问题给这些国家带来了巨大的麻烦，有时甚至会引发内战。\n\n哪里有战争，哪里就需要武器。我们可以向非洲人出售武器，就像兹拉托乌斯特曾经向俄罗斯的伪统治者们出售武器一样，从中获取一定的利益。我们可以向他们出售简单的步枪，而出售武器的钱可以用于经济发展或进一步刺激这些步枪的生产。"
 MAR_Kosygin.37.t: "公事公办"
 MAR_Kosygin.37.d: "装卸工正在将一箱箱武器装入集装箱，然后用起重机运上货船。箱子上标有AK-47突击步枪的序列号，检查员检查哪些箱子将被运往非洲。一次又一次，检查员在这些箱子和步枪序列号的一连串数字和字母旁边打上一个又一个勾，换做别人，早就被这些数字弄晕了。但检查员没有，他看到的是这些核对符号和数字背后的真金白银，这些钱可以从武器销售中获得。\n\n他想过这些步枪具体会流向哪里、流向谁吗？也许是给了另一个不能与邻国分享的非洲国家？或者是非洲之盾的叛军，或者是任何其他想要推翻其统治者的国家？也许只是给买得起这些步枪的人？谁知道呢？也许这位检查员并没有想到这一点，因为他正全神贯注于自己的工作，此外，他也不能分心。"
 MAR_Kosygin.36.a: "加入军团吧！你会看到世界！"
 MAR_kosfor_global_Russia: "覆盖全球"
 MAR_kosfor_global_Russia_desc: "我们的政策不仅限于欧洲和亚洲。也不局限于俄罗斯及其周边地区。我们的地缘政治不仅覆盖广阔的领土，而且覆盖整个地球！无论在哪里，公国都有自己的地缘政治利益，我们必须以一切可能的方式捍卫这些利益——军事支持、间谍网络、外交压力等等。我们的利益可能千差万别——从建立一个忠于我们的亲俄政权，到在世界各国议会为我们的利益进行游说。我们的青年俄罗斯国家已经在阳光下占有一席之地，我们不应将其拱手相让。\n\n俄罗斯的新时代正在到来。不久，我们的人民将最终团结在我们的旗帜下，一旦我们从过去伟大的阴影中走出来，整个世界都将为之颤抖，因为我们知道，我们的人民没有被打垮，只会变得更加强大。我们将很快感受到这一时刻的伟大。"
 MAR_Kosygin.38.t: "俄罗斯国旗曾经升起的地方，永远都不应再降下"
 MAR_Kosygin.38.d: "就连尼古拉·罗曼诺夫一世也曾说过：'俄罗斯国旗曾经升起的地方，就不应该再降下。'如果这句话适用于我们的现实地缘政治，那么它的意义依然不变。通过这句话，我们宣布，只要我们的利益受到威胁，我们在任何情况下都不会放弃。\n\n任何对“青年俄罗斯帝国主义”的指责都会被一个事实轻易驳倒，那就是我们的利益并不总是损害他人的利益。我们认为，与其他国家的合作，或者说俄罗斯在经济和政治合作中的利益，并不是一件坏事。看看美国、德国或日本——他们在合作中也有自己的利益，他们的利益能被称为帝国主义吗？因此，我们的利益是相同的。\n\n我们可能会被指控赞助破坏世界各地区和亲俄政治团体的稳定。在这里，他们可能会再次发现其他国家也在做同样的事情——美国和德国明确或间接地干预了南非最近的冲突，有人直接赞助了其他任何国家内战中的任何团体。这样做不好吗？从地缘政治的角度来看，只有好处。\n\n在这个残酷的世界上，我们不能没有牙齿。越是坚决，越是“牙尖嘴利”，就越能在地缘政治中捍卫自己的利益。在这个世界上，和平主义与和平如果受欢迎的话，也只是形式上的。实际上，一切都要复杂得多，甚至在呼吁和平的背后也隐藏着某种利益。\n\n我们的政策必须是全面的，只有这样才能保护我们自己和我们的祖国。"
 MAR_Kosygin.38.a: "地缘政治不是给小孩玩的游戏。"
 MAR_kossup_porog: "跨越阈值"
 MAR_kossup_porog_desc: "在解决了西俄罗斯的众多问题并最终跨过乌拉尔山脉的门槛进入西西伯利亚之后，我们终于可以继续采取进一步行动，进一步发展我们俄罗斯人民的帝国。我们的青年俄罗斯国家理应被称为俄罗斯帝国的继承者，因为我们已经代表了一股非常强大的力量，能够将俄罗斯最后的碎片团结起来。\n\n在继续统一俄罗斯之前，我们需要解决一些对我们国家同样重要的问题，这些问题只会为我们的国家添砖加瓦。"
 MAR_Kosygin.39.t: "在过去与现在之间"
 MAR_Kosygin.39.d: "沙皇罗曼诺夫坐在办公室里，回想着他的一生和他的国家所发生的一切。时间已经过去了很久，至少可以对之前发生的事件做出主观评价，而且说实话，有很多事情值得回忆。\n\n他还记得自己是如何成为青年俄罗斯联盟的一员，并请求卡津别克成为缙绅会议的下一任候选人。令人惊讶的是，人们竟然真的把他当成了幸存的阿列克谢·罗曼诺夫。这究竟是怎么回事呢？那些投票给阿列克谢·罗曼诺夫的普通民众心中到底在想些什么？也许他们只是想看看柯西金本人？令人震惊的是，虽然他为获胜做了很多，但这并不是计划的一部分。恰恰相反，计划是有的，但柯西金本人考虑得最少。他本以为会成为别洛泽尔斯基或卡津别克手下的经济部长，没想到却成了正式的沙皇。\n\n维亚特卡会议极大地改变了整个国家的命运。而它之所以能扭转乾坤，不是因为它的召开，而是因为它被“宝座”挫败了。我们只能感叹国内反对派的规模之大，以及这个阴谋几乎无所不包。塔博里茨基确实是个疯子，而柯西金似乎也明白他们为什么要追随他。他们追随他，只是因为他是一个团结了所有激进反对派的人物。如果他的人实现了他们的目标，西俄罗斯人民公国会发生什么，想象一下就令人害怕。具体是什么目标？我们无法确切知道，也许这样最好。塔博里茨基已经死了，因此再担心他们也没有意义了。\n\n国家发生的这些急剧变化对普通民众的生活产生了良好影响。可以肯定地说，人民的生活越来越好。经济飞速发展，而这在布哈林执政时期是没有的。如果卡津别克作为玛丽亚和别洛泽尔斯基沙皇的摄政掌权，大概也可以这样说。但他们死了，在没有其他选择的情况下，柯西金和现在的罗曼诺夫成了这个国家的首脑。\n\n罗曼诺夫沉思了很长时间，直到首相弗拉基米尔·吉尔来到他的办公室。\n\n“我打扰到您了吗，我的沙皇？”弗拉基米尔·吉尔问道。\n\n“不，你可以进来。你有什么问题？”\n\n“我们需要解决整合西西伯利亚的问题，我有一个将其纳入我国领土的计划。”"
 MAR_Kosygin.39.a: "“说吧，我听着呢。”"
 MAR_kossup_ural_archives: "乌拉尔州苏维埃档案馆"
 MAR_kossup_ural_archives_desc: "存放在乌拉尔的档案，或者更准确地说，存放在前乌拉尔地区委员会所在地的档案，隐藏着许多极其有趣的信息。但我们感兴趣的并不是存放在那里的文件本身，而是我们究竟需要找到什么--首先，我们必须消除阿列克谢·罗曼诺夫死亡的任何证据，首先要消除文件证据。必须确保没有人找到这些有损于谋杀现任统治者的文件。否则，我们会被反咬一口。\n\n不过，很明显，我们会在这些档案中发现其他有趣的东西，所以我们必须打开档案，找到一切可以找到的东西。"
 MAR_Kosygin.40.t: "私刑正义"
 MAR_Kosygin.40.d: "几名档案专家打开了乌拉尔州苏维埃的秘密档案馆。这座档案馆建于内战时期，里面存放着大量珍贵文件。专家们的任务是仔细查阅所有资料，寻找与沙皇家族有关的任何蛛丝马迹，尤其是关于他们葬身何处（如果他们真的被埋葬了）、是谁下达了处决命令等等。人们相信，这里应该可以找到很多有价值的线索，因为所有与沙皇命运有关的决定，都应该与乌拉尔州苏维埃脱不了干系。\n\n推开沉重的铁门，一股夹杂着灰尘的霉味扑面而来，仿佛是来自遥远过去的问候。一位专家忍不住打了个喷嚏。打开灯光，昏暗的房间瞬间被照亮。只见房间里堆满了各式各样的文件，几乎没有落脚的地方。一个显而易见的问题是：为什么以前从来没有人来这里查看过这些文件呢？更让人费解的是，从房间里的灰尘厚度来判断，这里似乎已经很久没有人来过了。\n\n或许，这也未尝不是一件好事，因为这意味着档案保存完好，没有遭到任何破坏。即使经过了漫长的岁月，文件上的墨迹依然清晰可见，仿佛在诉说着那个动荡年代的故事。专家们相信，他们一定能从这些文件中找到想要的答案。\n\n专家们仔细翻阅着这些文件，他们发现了很多东西，有些内容十分重要，而有些则显得毫无价值，甚至可以用“荒谬”来形容。其中一些文件可以作为历史研究的素材，但也有一些文件只能被扔进垃圾堆。然而，他们始终没有找到最重要的东西——关于1918年7月17日发生在伊帕季耶夫庄园的那场血腥屠杀的真相。\n\n就在这时，一位专家有了惊人的发现。他在一堆文件中，找到了乌拉尔州苏维埃与列宁之间的往来信件。根据这些信件的内容，专家们发现了一个惊人的事实：列宁并没有下令处决尼古拉二世及其家人！事实上，列宁只要求对沙皇进行审判，并将其囚禁起来。而乌拉尔州苏维埃却自作主张，并没有完全服从莫斯科的命令。换句话说，下令处决沙皇一家的，并不是远在莫斯科的列宁，而是乌拉尔州苏维埃自己！\n\n档案调查还在继续。"
 MAR_Kosygin.40.a: "这真是天意弄人。"
 MAR_kossup_curdes_old_house: "被诅咒的老屋"
 MAR_kossup_curdes_old_house_desc: "事实上，尼古拉二世被枪决并不是因为什么。他被枪决只是因为乌拉尔苏维埃决定举行私刑，如果不是因为他们，我们可能会看到整个王室都身陷囹圄。也许在现实中，他们被枪毙只是为了国家的一面好处。\n\n尽管如此，我们还是终于找到了有关尼古拉二世及其家人的所有信息，知道了埋葬地的确切位置。我们必须紧急前往那里，找到这个墓地，以正常的方式重新安葬他们。"
 MAR_Kosygin.41.t: "意外的启示"
 MAR_Kosygin.41.d: "一个由文件专家和掘墓人组成的小组去寻找埋葬地，而这个埋葬地只能通过乌拉尔地区苏联档案馆的文件才能发现。根据他们找到的文件，尸体被埋葬在叶卡捷琳堡附近，但令人惊讶的是，埋葬地点竟然是一个充满硫酸的洞穴。应该说，这是一种非常严酷的埋葬方式。\n\n到达现场后，许多人担心酸性物质会继续存在，溶解一切，什么也不会留下。谁也说不准那里会发生什么。然而，我们的团队非常幸运——不仅一点都没有，而且还找到了尼古拉二世家族的遗骸。\n\n在洞穴中发现了尼古拉二世本人、他的妻子亚历山德拉·费奥多罗夫娜、奥尔加、塔吉亚娜和阿纳斯塔西娅的尸体，至少根据文件可以确定他们的身份。在这种情况下，最有趣的是发现了其他显然不属于王室的尸体——博特金、特鲁普和安娜·德米多娃。玛丽亚·尼古拉耶夫娜和阿列克谢·罗曼诺夫的尸体没有被发现。没有发现阿列克谢·罗曼诺夫的尸体这一事实在研究小组看来非常有趣——看来现在掌权的阿列克谢-罗曼诺夫二世确实幸存的传言是真的。这很有趣，但同时也非常奇怪。这一切都引发了许多疑问。"
 MAR_Kosygin.41.a: "那怎么，难道玛利亚·尼古拉耶夫娜也还活着？"
 MAR_kossup_make_lenin_leave: "乌里扬诺夫同志，该走了。"
 MAR_kossup_make_lenin_leave_desc: "俄罗斯社会对弗拉基米尔·伊里奇·乌里扬诺夫·列宁的看法颇具争议。在苏联多年的宣传中，列宁几乎被提升到了上帝的高度，被赋予了他所不具备的品质，他在建立苏维埃政府等方面的作用也被高估了。另一方面，热心的君主主义者、保守主义者以及单纯的反共分子都憎恨列宁，他们认为列宁是俄罗斯精神和物质方面的凶手。许多人认为他也是杀害皇室的凶手，尽管这种想法是错误的。\n\n当然，这个人物引起了巨大争议，但我们无法否认他对历史做出了不可磨灭的贡献。然而，与历史上的任何人一样，他必须成为历史的一部分。我们必须让列宁安息，最好是以中立的口吻，否则，这种或那种立场的支持者根本不会理解我们。"
 MAR_Kosygin.42.t: "成为历史的一部分。"
 MAR_Kosygin.42.d: "在秋明，有一座乍一看不起眼的建筑，但对于曾经存在过的卡冈诺维奇的秋明共和国鲜为人知的约瑟夫·斯大林的支持者来说却远非最不重要。这座小而不起眼的建筑物是弗拉基米尔·伊里奇·列宁的陵墓，几乎是战前在莫斯科的陵墓的一个精确复制品。它唯一的不同之处在于，用于这座建筑的材料制作得相对粗糙和匆忙，显然是在考虑到德国人可能会轰炸这座建筑，为了避免浪费钱财，一切都做得相当粗糙。但是，当然并没有采取粗劣的工作。\n\n秋明市居民观看了移走列宁木乃伊遗体的过程。对许多居民来说，这具遗体和陵墓一样，随着时间的推移成为了神圣的东西，就像布哈林时代的数千万苏联居民一样。然而，镇民们不知道该怎么办——列宁被从陵墓中移出，其目的很明确，就是要掩埋遗体。\n\n许多镇民聚集在埋葬地点周围，为了不让镇民和可能同情列宁的人过于悲伤，决定在管弦乐队的伴奏下埋葬列宁，但不发表任何演说。管弦乐队开始演奏苏联国歌。这首国歌可能是最后一次在公开场合奏响，这实际上只会让秋明居民的眼泪流得更多。有人一听到布哈林苏联国歌，就开始唱起了歌词。另一个人也跟着唱了起来，很快整个人群都开始唱了起来。三分钟后，人群唱完了国歌，列宁的遗体被抬上了一辆专车。遗体被放进汽车后，汽车出发了，驶向一个未知的方向。"
 MAR_Kosygin.42.a: "是时候安息了，大步迈向未来。"
 MAR_kossup_topor: "埋葬战争之斧"
 MAR_kossup_topor_desc: "1917年的十月革命和内战导致了俄罗斯社会意识形态的持久分裂。支持苏维埃政权的红军和反对苏维埃政权的白军或许一直将对方视为不共戴天的敌人，尽管现在已经没有白军和红军了。\n\n白军宣布与红军势不两立，红军也是如此。然而，现在是结束这场长达近半个世纪的冲突的时候了——他们需要以最不寻常的方式和解——让他们成为尼古拉二世和列宁同一历史的一部分。"
 MAR_Kosygin.43.t: "冲突根源"
 MAR_Kosygin.43.d: "俄罗斯历史上白军和红军的斗争是俄罗斯人民记忆中最悲惨的事件之一。毫不夸张地说，内战是世界上有史以来最残酷的冲突之一，它无法与第一次世界大战相比，甚至无法与伟大的卫国战争相比，但它仍然同样残酷。\n\n你还能在哪里看到父亲用刺刀或马刀与儿子厮杀，或者兄弟用刺刀或马刀与兄弟厮杀？只有俄国内战将许多家庭的命运分隔开来，而这一切都是因为一个想法。在这方面，俄国内战尤为悲惨。然而，这场斗争有其根源。\n\n俄罗斯有自己的独特性。只有我们的民族具有其他民族所不具备的独特品质——集体主义、团结和正义感。我们的民族与社会主义有许多共同之处，但同时，它也需要一位沙皇，因为它通常对其领袖极为忠诚。内战揭示了俄罗斯人民的这些品质，并将其价值发挥到了极致，这导致了君主制和社会主义两种原则之间的斗争。因此，白军和红军之间的斗争尤为残酷和悲壮。\n\n青年俄罗斯联盟能够把俄罗斯人民的君主原则和社会主义原则结合起来，现在我们的祖国，至少在青年俄罗斯联盟执政的部分，已经没有意识形态上的矛盾了。我们已经将这些理想结合起来，但我们还没有解决最后一个矛盾。我们必须解决这个问题，我们将以最不寻常的方式解决这个问题——我们将为内战中阵亡的共产党员和白军创建一个和解谷，我们将把阵亡的白军和红军的尸体埋葬在那里。"
 MAR_Kosygin.43.a: "我们将通过和解铲除这一冲突根源。"
 MAR_dolina_primirenya_category:0 "和解之谷"
 MAR_dolina_primirenya_category_desc:0 "\n\n\n\n\n\n“和解谷”的象征意义大于实际意义。在这个山谷中，我们将为在内战中牺牲的白军和红军战士修建一座坟墓。通过这座墓园，我们可以重新安葬他们。如果我们这样做了，我们将在俄罗斯人的自我意识中结束这场对抗，宣告斗争已经结束。"
 MAR_build_the_dolina:0 "开始建设山谷"
 MAR_Kosygin.100.t: "和解"
 MAR_Kosygin.100.d: "在我们的努力下，和解谷终于诞生了。这个最像坟墓的地方不仅具有墓地的意义，还代表着白军和红军和解的姿态。许多俄罗斯人都以自己的祖先曾站在白军或红军一边而自豪，但与此同时，他们又对祖辈曾与之战斗过的人怀有敌意。然而，现在这种情况已经结束，因为建立这座纪念馆的目的是为了从精神上团结全俄罗斯，因为俄罗斯人在这个问题上有着矛盾的情感。\n\n作为最终和解的标志，列宁的遗体和尼古拉二世家族的遗体被埋葬在了一起。有谁会想到列宁和尼古拉·罗曼诺夫二世这两个人会相邻而葬呢？也许不会，但他们必须以人道的方式葬在一起，以结束俄罗斯人民的矛盾。"
 MAR_Kosygin.100.a: "安息吧。"
 MAR_kossup_red_midday: "红色正午"
 MAR_kossup_red_midday_desc: "俄罗斯人民帝国正处于其强盛和繁荣的顶峰。在苏联和俄罗斯帝国，我们只能梦想我们正在取得的成功。我们融合了这两个政权的所有精华。这就是我们青年俄罗斯意识形态的独特之处。\n\n我们的政权甚至可以被称为君主社会主义。在这一点上，他们看到的是一种非常奇怪的结合，甚至诅咒或嘲笑我们的政权，说我们试图将不相容的东西结合在一起。诋毁我们的人其实是在羡慕我们的政权，因为它把社会主义的所有优点和君主制的优点都结合在了一起。俄罗斯之日尚未结束，俄罗斯也不会很快看到日落。"
 MAR_Kosygin.44.t: "俄罗斯式君主社会主义"
 MAR_Kosygin.44.d: "在我国建立起了君主社会主义的雏形，这是阿列克谢二世·罗曼诺夫感到自豪的原因。这个政权是两个极端之间的妥协，正如我们所看到的，对立面能够走到一起并得到加强。在俄罗斯，俄罗斯初级君主社会主义的萌芽正在开花结果：我们的国家变得更加强大，军队变得更加强大，经济变得更加稳定，人民变得更加富裕，这是布哈林和尼古拉二世等任何人都无法实现的。\n\n君主社会主义在俄罗斯已经牢固确立，要想破坏它的根基是极其困难的——俄罗斯精神与社会主义原则相结合，再加上君主统治的覆盖，提供了这样的意识形态保护，这是任何一个政权都梦寐以求的。德国人民不再明白他们真正想要的是什么，美国人民正处于十字路口，日本人民无法摆脱他们大脑中的帝国主义。\n\n我们的君主社会主义是进步的，它既面向未来，也面向过去，保留了俄罗斯的传统及其精神，并用正义、平等和繁荣的社会主义思想巩固了这一切。俄罗斯人民的伟大已经成为一个非人为的国家。\n\n而我们不会停下脚步。我们将向世界展示我们的理想，这些理想将长期存在于全世界人民的心中。"
 MAR_Kosygin.44.a: "青年俄罗斯的伟大思想"
 MAR_kossup_thaw: "放宽限制"
 MAR_kossup_thaw_desc: "在我国，直到最近，戒严令仍然有效，尽管随着时间的推移，戒严令的效力明显减弱。由于我国的局势已经稳定下来，“宝座教派”已被击败，抢劫案已减少到几乎是孤立的案件，我们现在有能力将军队撤出城市，并将维护城市治安的所有权力移交给警察和人民民兵。然而，为了确保国家的稳定和人民的安全，在法律的保护下，必须保留一些限制。毕竟，恢复戒严令的可能性尚未取消，不是吗？"
 MAR_Kosygin.45.t: "他们走了"
 MAR_Kosygin.45.d: "塔蒂亚娜·卡拉恰耶娃，也就是现在的斯米尔诺娃，又一次去商店为家人买日用品。自从街上出现了士兵，她就不再害怕一个人去商店了，因为士兵们，即使是那些严厉的士兵，即使从道义上讲，也是一种很好的支持。知道有这样的保护，心里就平静多了。在某些时候，你甚至会觉得这些“铁皮子”士兵就像家人一样，是这座城市不可分割的一部分。起初让人害怕的夜间枪声到最后变得非常罕见。\n\n甚至可以说，按部就班的生活变得更加美好，因为你清楚地知道自己在某个时间必须做什么，这大大增强了自律性和对任何行为的责任感，无论是在工作、学习还是在家里。虽然宵禁时间有了一些变化，但她一直牢记必须在这个时间之前完成所有事情。\n\n但今天她走在街上，并没有看到这些士兵。这并没有让她感到失望或其他负面情绪——她对他们并不那么依恋。她只是在心里想，他们不在那里。她还注意到，这些士兵不知去向，街上张贴着解除戒严的公告。宵禁被取消了，现在不再有对犯罪的处决，只有逮捕和拘留。现在，维持秩序的责任将落在保安人员和人民民兵身上。"
 MAR_Kosygin.45.a: "他们走了，但他们还会回来的，不是吗？"
 MAR_kossup_kosyginki: "“柯西金楼”"
 MAR_kossup_kosyginki_desc: "我国的住房问题仍然是最尖锐的问题之一。尽管轰炸早已结束，但许多人仍住在布哈林联盟时期建造的公共公寓里。有些人买得起好的独立公寓，但这种公寓仍然很少，供应无法满足对这种住房的需求。如果我们想果断地解决这个问题，我们就需要符合所有必要标准、易于建造、人们负担得起的标准化住宅。\n\n因此，我们通过了一项在所有城市建造新型住宅的计划，这种住宅已被命名为“柯西金楼”。这种轻型住宅价格相对低廉，但质量上乘，可以最终解决紧迫的住房问题。最终，几个家庭几乎住在一个房间里的情况将不复存在——现在，每个家庭都将拥有独立的全套两室公寓，以满足个人对自己空间的需求。"
 MAR_kossup_red_and_white: "红与白"
 MAR_kossup_red_and_white_desc: "我们的政权无法明确地定性——它既有君主制的因素，也有社会主义的因素。青年俄罗斯联盟能够创造出一种折中方案，能够将红军的思想和白军的思想统一起来。尽管许多人可能根本不了解我们的制度是如何存在的，但如果它能发挥作用，而且相当有效，那么我们就选择了正确的国家发展道路。\n\n我们结合了布哈林苏维埃和尼古拉二世俄罗斯帝国的所有精华。平等与帝国的自我意识相结合。繁荣与俄罗斯人民的精神力量相结合。忠于祖国，忠于沙皇。所有这一切使我们有权称自己为红色帝国。"
 MAR_Kosygin.46.t: "征兵"
 MAR_Kosygin.46.d: "尼古拉伊·马拉申科前往兵役登记办公室，以入伍成为军队的一名普通士兵。他刚刚满18岁，收到了军事选举委员会的传票。是时候为国家服役，履行他对祖国的责任了。\n\n他来到兵役登记办公室，看到那里有很多人，其他也是收到传票前来等待入伍登记的年轻男子。人很多，大约有40人，他排队等候。随着他在队伍中向前移动，身后似乎也形成了同样的小队伍。这让尼古拉伊有点惊讶，尽管这并不奇怪——没有人试图逃避兵役，至少那些强烈反对的人没有。逃避兵役对一个人来说是不好的行为，如果你对某人说这样的话，会给人留下负面印象。根据他的观察，甚至相反也是真的；他听到许多年轻人都渴望加入军队。\n\n最终，轮到他的时候，他进入了办公室，将个人信息记录下来。\n\n“你好，”尼古拉伊开始说，“我是来应召入伍的，我想加入军队。”\n\n“你好，你想入伍是件好事，”那位大约26-27岁的职员说道，“请给我提供必要的文件。”\n\n尼古拉伊把所有必要的文件放在职员的桌子上，他迅速地抄写下来。\n\n“你已经体检过了吗？”职员问道。\n\n“是的，”马拉申科回答道。\n\n“告诉我你的体能等级。”\n\n“A3。”\n\n“好的，我们会记录下来。”\n\n在记录了一些数据之后，职员说道，\n\n“恭喜，你已经入伍了。你将被分配到一个服役地点，请在一周后到军事选举委员会。他们会告诉你一切。”\n\n“好的，我会去的。”\n\n“你现在可以走了，自由了，”职员友善地说道。"
 MAR_Kosygin.46.a: "我为祖国效力！"
 MAR_kossup_look_to_the_east: "凝望东方"
 MAR_kossup_look_to_the_east_desc: "毫无疑问，为了统一整个俄罗斯，让我们的民族再次团结起来，我们必须流更多的血。在东部、中西伯利亚和远东地区，有一些自封的领导人希望在他们的领导下统一整个俄罗斯，如果他们消灭了我们，俄罗斯的命运显然不会太令人羡慕。我们可以肯定，他们是自封的领导人，他们不想为自己的人民做任何事情，只想为了一己之私统一俄罗斯。\n\n很有可能，我们正面临着一场终结分裂的战争。我们必须统一俄罗斯——没有任何妥协可言。不是他们死，就是我们亡。这就是为什么我们必须为这场战争做好准备，否则他们只会在西伯利亚工业的帮助下将我们碾成尘土。我们必须动员一切可以动员的力量，让自封的领导人遭受毁灭性的失败。打败他们，我们就能确保俄罗斯和我们的人民拥有更美好的未来。\n\n为了祖国，一切都不过分。"
 MAR_kossup_meet_Gil: "与吉尔的会面"
 MAR_kossup_meet_Gil_desc: "如果我们计划与西伯利亚开战以统一俄罗斯其他地区，那么我们就需要制定一个周密的军事行动计划。该计划应考虑到西伯利亚可能做好的抵抗准备、我们自己的能力、攻占城市的期限，等等。俄罗斯已经在翘首以盼谁能统一我们辽阔的祖国，我们必须有资格打败目前在西伯利亚的那些人。\n\n因此，我们的军事行动计划不是由任何人制定的，而是由弗拉基米尔·吉尔首相和国防部长阿纳托利·瓦维洛夫共同制定的。为了制定一个好的计划，必须让有能力的人参与进来，即使是那些一般来说不应该长期参与的人。"
 MAR_Kosygin.47.t: "重拾旧路"
 MAR_Kosygin.47.d: "弗拉基米尔·吉尔正前往军事指挥中心。在担任总理期间，他几乎忘记了自己曾经是军队中的一名将军，而且不仅仅是一名将军，而是一名高级将军。甚至苏联传奇军事领袖之一图哈切夫斯基也采纳了弗拉基米尔·吉尔开发的一些战术。然而，那些时光已经过去，现在他再次穿上了军队将军的制服。\n\n当他进入军事指挥部时，已经有阿纳托里·瓦维洛夫和其他两三名被授予指挥参加西伯利亚战争——统一俄罗斯的最终、决定性战争的荣誉的高级将军在等待他。将军们已经起草了一些箭头和针对西伯利亚地区的国家的军事行动计划。\n\n“你好，吉尔将军同志！”房间里的每个人都向他致以问候。\n\n“你好，畅所欲言。”弗拉基米尔说道，显然在回忆他的军队时光。“我看你已经在努力工作了？”\n\n“确实，将军。我们已经开始制定防御计划和进攻敌人的计划，”瓦维洛夫开始说。\n\n“那就好。让我看看。”吉尔说着，瓦维洛夫带他走到地图边缘。\n\n吉尔详细研究了地图，注意到它们质量很高，与以往不同。然后，他的注意力转向箭头和俄罗斯人民帝国和敌人的师分布位置。根据地图，主要攻击计划在西伯利亚南部，这其中当然有一定的逻辑性 - 西伯利亚南部有主要的人口和工业。然而，计划还不完善。\n\n“我明白了……”吉尔看着所有的地图。“这些还不是最终版本？”\n\n“你说的对。我们几个小时前才开始制定计划，”瓦维洛夫证实说。\n\n“很好。好吧，我可以给你们一些建议，这可能在战争中很有用。”吉尔说道。\n\n之后，吉尔完全投入到了制定战争计划中。人们说，要取得成功，你必须始终为军事行动制定备用计划，为了以防敌人更强大，制定了一个备用计划。为了在敌人上方获得更轻松的空中优势，建造了空军基地，掩体，道路，动员军队——这个总部制定了战争所需的一切。\n\n最终，防御和进攻计划得到了完善。计划最终确定后，弗拉基米尔·吉尔和瓦维洛夫讨论了过去的军事战役。吉尔谈到了自己在战争中的指挥，西俄罗斯战争中的将军身份，以及他是如何在西俄罗斯之战中成功挽救了整个公国免于塔博里茨基和他的“宝座”手中崩溃。这些以及许多其他对话都发生在休息时间，尽管他们希望这些休息时间不要那么频繁，因为整个指挥人员都在为计划努力工作。\n\n最终，计划得到了签署，现在他们只需要等待合适的时间来付诸行动…"
 MAR_Kosygin.47.a: "该计划是强制性的。"
 MAR_kossup_scarlet_etud: "深红色调回旋曲"
 MAR_kossup_scarlet_etud_desc: "俄罗斯人民帝国无疑正在经历最好的发展时期之一。最终，我们百分之百地相信，俄罗斯将在我们的“红色沙皇”——阿列克谢二世·罗曼诺夫的领导下实现完全统一。如果没有他，俄罗斯人民的命运可能会走上完全不同的道路，谁知道呢，如果他没有在正确的时间出现在正确的地点，一切可能会更糟。\n\n俄罗斯的历史尚未结束，也远未结束。俄罗斯的历史仅有1000多年，但它并不打算结束。相反，我们的国家表明，所有这些世纪只是一个新时代的开始，也许是俄罗斯历史上最伟大的时代。我们的人民还没有经历过他们的黄金时代，而这个黄金时代还在我们的前方。众所周知，黎明出现在黑夜最黑暗的时刻之前。黑夜即将结束，我们正目睹俄罗斯民族迎接这深红色调的黎明。\n\n阿列克谢二世·罗曼诺夫过去的性格已经成为过去。他不是柯西金，不是装配工的儿子。在姓罗曼诺夫的陌生人中，他是属于自己的。当然，罗曼诺夫很高兴成为俄罗斯的统治者，但他仍然是一个姓柯西金的车工的普通儿子。他也是一个简单的人——他决定出版自己的回忆录，讲述自己的故事，而不提及自己不是罗曼诺夫。罗曼诺夫曾想用深红色的笔调写下自己的回忆录——讲述自己的一生，讲述自己是如何一直躲在“柯西金”的背后生存下来的。"
 MAR_Kosygin.48.t: "与自己的过往和解"
 MAR_Kosygin.48.d: "一本由阿列克谢二世·罗曼诺夫亲自撰写的书籍近日问世，书名定为《血色回旋曲》。这本书主要讲述了阿列克谢·罗曼诺夫生命中一段鲜为人知的岁月——从1918年到20世纪50年代，可以说，这是一部自传性质的作品。翻开书，首页便是一张沙皇全家福。再翻一页，是出版时间、出版社和书名，接下来便是目录。整本书内容详实，篇幅巨大，将近500页。\n\n在这部作品中，作者，也就是阿列克谢二世·罗曼诺夫沙皇，讲述了他如何化名“柯西金”，以及在此期间的所思所感，几乎事无巨细地记录了他这三十多年的隐姓埋名的人生经历。尽管他从未忘记自己才是俄罗斯帝国的合法继承人，但他还是以“柯西金”的身份生活了三十多年。他努力工作，平步青云，同时也尽自己所能地帮助周围的人，让他们的生活变得更加美好。但是，由于他没有掌握国家的最高权力，所以他无法在国家最需要他的时候挺身而出，力挽狂澜。他坦言，布哈林时期的社会主义思潮对他产生了很大影响，他试图将那个时代的优点与现实相结合，最终创造了我们今天所看到的“俄罗斯人民帝国”。\n\n在《血色回旋曲》的结尾，作者描绘了俄罗斯如何战胜了来自内部的邪恶势力，以及塔博里茨基之死给俄罗斯人民带来的希望。\n\n历史终将对阿列克谢二世·罗曼诺夫对祖国的贡献做出公正的评价。"
 MAR_Kosygin.48.a: "最后的和解，亦是与自己的和解。"
 MAR_kosnuk_Weapon_of_Prometeus: "普罗米修斯的武器"
 MAR_kosnuk_Weapon_of_Prometeus_desc: "即使是那些对政治不感兴趣的人也理解，为了在与美国、日本，尤其是大日耳曼国等超级大国的对话中保持平等，拥有核武器是必要的——这是一种具有巨大破坏力的战略工具。因此，俄罗斯人民帝国的皇帝阿列克谢二世决定成立一个特别的政府委员会，由我们政府的负责人弗拉基米尔·弗拉基米罗维奇·吉尔领导。我们只能向上帝祈祷，希望我们能够及时完成这一手段的创造工作。"
 MAR_Kosygin.49.t: "重要作业"
 MAR_Kosygin.49.d: "政府与皇帝的联席会议即将结束，众人正准备散去之际，阿列克谢二世却请总理弗拉基米尔·吉尔留步，称有要事相商。\n\n“弗拉基米尔·弗拉基米罗维奇,您能否再耽搁20分钟？我们需要讨论一些事情。”\n\n吉尔欣然应允。待门扉紧闭，二人便在他人视线之外继续交谈。\n\n“弗拉基米尔·弗拉基米罗维奇，身为政府首脑，您想必明白我国正全力备战，以期与大日耳曼国一决高下。德国乃是与美、日鼎足而三的超级大国……”\n\n“陛下，恕我直言，我不太明白您这番话的意图所在。”\n\n“弗拉基米尔·弗拉基米罗维奇，其实很简单。德国以及美国、日本都拥有我们所欠缺的东西，那就是核武库。对我们而言，拥有这样一面盾牌至关重要，否则我们就会处于劣势。”\n\n“那么阿列克谢·尼古拉耶维奇，您打算如何做？这与我又有什么关系？”\n\n“我希望任命您这位政府首脑担任核武器研发特别委员会主席。不过,您本人也了解这项工作的特殊性。我们最好避免任何信息泄露，否则邻国可能会趁我们还未拥有这一强有力筹码之际，先发制人。”\n\n“在这个新职位上，我将拥有什么样的权力？”\n\n“你将获得一切必要的资源，以在六个月内，或者在极端情况下一年内，制造出一枚原子弹。全世界都需要知道，俄罗斯正重返世界舞台。”\n\n“遵命，阿列克谢·尼古拉耶维奇陛下。我可以告退了吗？”\n\n“你去忙吧，弗拉基米尔·弗拉基米罗维奇。”\n\n弗拉基米尔·吉尔走出会议室时，因兴奋和被委以如此重任而大汗淋漓。他步出政府大楼时，已不仅仅是政府首脑，更成为俄罗斯人民帝国政府下设原子弹研发特别委员会的主席。"
 MAR_Kosygin.49.a: "国家的命运取决于这个委员会的决定。\n"
 MAR_kosnuk_mythical_inspirations: "科学灵感"
 MAR_kosnuk_mythical_inspirations_desc: "在着手建造核武器之前，我们有必要从理论角度了解其结构，这也是当前所有超级大国的起点。正所谓“不破卵焉得蛋。”\n\n为此，我们应当召集所有现有的核物理学家，请他们助力研发这类炸弹。可以派遣部分人员赴国外接受培训，以便他们学成归来，将我们急需的知识传授于众。"
 MAR_kosnuk_Kurchatov_genius: "昔日天才"
 MAR_kosnuk_Kurchatov_genius_desc: "尽管我们的理念与所谓的超视派存在分歧，但在某些项目上，我们应当考虑并吸收他们的部分研究成果。毕竟，除了安德烈·日丹诺夫，前苏联的杰出科学家和工程师也在其列。因此，我们负责核弹研发的政府委员会应当审阅他们的全部图纸和研究成果。谁知道呢，也许他们想要付诸实践的东西能助我们一臂之力。"
 MAR_kosnuk_new_kind_of_weapon: "新型武器"
 MAR_kosnuk_new_kind_of_weapon_desc: "鉴于我们在军事领域的所有项目在物质技术资源方面都不甚困难，政府委员会应当向皇帝请求额外的财政投入。这是因为核武器的研发不仅是一个劳动密集型的过程，而且需要国家的大量物质投资。派遣科学家出国和成立政府委员会，显然还不足以用于制造核弹。"
 MAR_Kosygin.50.t: ""
 MAR_Kosygin.50.d: ""
 MAR_Kosygin.50.a: ""
 MAR_kosnuk_kurgan_mines: "库尔干矿区"
 MAR_kosnuk_kurgan_mines_desc: "多亏了地质研究，让我们获知库尔干地区蕴藏着巨量铀矿。众所周知，这种资源是制造核武器所必需的。因此，我们将竭尽全力在该地区建设矿井和储存设施。通过开发这种必要的生产，我们将能够比原计划设想更快的提前完成铀矿开采任务。"
 MAR_kosnuk_third_world_uranium: "第四世界的铀"
 MAR_kosnuk_third_world_uranium_desc: "尽管我们国内有铀矿，但不应忘记，我们国家的部分地区正处于德国傀儡政权的控制之下。因此，委员会决定在非洲国家组织铀矿的开采。虽然我们可以在与我们结盟的非洲国家合法地组织铀矿开采，但在其他国家开采铀矿却存在着问题。为此，我们决定通过愿意在我们的事务中为我们提供掩护的第三方，秘密在美国和日本开采铀矿。"
 MAR_kosnuk_tame_the_fire: "驯服烈火"
 MAR_kosnuk_tame_the_fire_desc: "政府委员会致力于研发核武器，时间已经足够向皇帝汇报当前进展。正如现有的政府机构所言，为炸弹研发提供给委员会的资源并非徒劳无功。因此，我们将就委员会自成立以来的工作向皇帝提交一份完整报告。通过这种方式，我们将说服皇帝，我们是在为国效力，而并非虚度光阴。"
 MAR_Kosygin.51.t: "艰难而漫长的谈话"
 MAR_Kosygin.51.d: "政府会议即将开始，弗拉基米尔·吉尔走进内阁。作为特别委员会主席，他深知自己必须亲自向皇帝汇报他和所有下属的工作成果。然而，在政府会议开始前，皇帝要求弗拉基米尔到他的办公室进行私人汇报。\n\n来到指定地点，弗拉基米尔·吉尔从公文包中取出所有必要的文件，在阿列克谢二世对面坐下。\n\n“弗拉基米尔·弗拉基米罗维奇，请向我全面汇报你们委员会所进行的工作。我想亲耳听你说，在原子武器研发方面是否取得了进展。”\n\n“陛下，我可否先问一个问题？”\n\n皇帝颔首表示同意。\n\n“阿列克谢·尼古拉耶维奇，为何我不能在会议上向所有大臣直接汇报？”\n\n“我希望率先亲自了解如此重要的事情。其他大臣由我亲自通知。你可以开始了。”\n\n“这段时间我们的工作成果是，在全国许多城市建设了用于扩散法分离铀同位素的工厂和工业核反应堆。这将有助于组织钚-239和铀-235的工业化生产，它们用于制造原子弹。”\n\n在长时间宣读报告并总结所有已完成的工作后，弗拉基米尔·吉尔以一个令人欣喜的消息结束了他的讲话。\n\n“……如此一来，我们将能够在创纪录的短时间内，甚至比原计划更早进行原子弹试验。”\n\n汇报结束后，首相先生将所有文件放入公文包，遵照皇帝的命令离开了办公室。与此同时，留下的阿列克谢·尼古拉耶维奇脸上露出了微笑，他轻声自语道："
 MAR_Kosygin.51.a: "最后，俄罗斯将就自己发表声明。"
 MAR_koskaz_red_sun_over_steppe: "草原上升起的红日"
 MAR_koskaz_red_sun_over_steppe_desc: "曾几何时，灿烂的阳光照耀着广阔无垠的哈萨克大草原，展现出它的美丽与壮阔。然而，那段美好时光已成过往云烟。如今，哈萨克斯坦分裂成无数个小小军阀割据的势力，他们唯一的野心就是渴求对这片土地的统治权。看来这种局面还将无休无止地持续下去。\n\n是时候喊出“够了!”的声音了。哈萨克人一直以来都是俄罗斯的兄弟。现在是时候结束这个可怜的手足之邦所遭受的苦难了，他们虽然失去了家园，却未曾失去挚友。我们英勇的军队将扫荡过草原，终结那些摧残着这已经备受折磨的民族的内战。"
 MAR_koskaz_red_imams: "红色伊玛目"
 MAR_koskaz_red_imams_desc: "中亚是各种文化和宗教的交融中心，但这些文化和宗教并不总能和睦相处。伊斯兰教仍然是最普遍的宗教。我们的社会不太可能吸引穆斯林。他们的反应尚不可知，所以我们可以期待最坏的选择。\n\n但我们就应该坐以待毙吗？提前行动不是更容易、更正确吗？我们的克格勃雇员将为一些伊玛目和其他伊斯兰仆人开办速成再培训课程。这样，只有不违背政府的真实、正确的信息才能传达到群众中去。至于如何处置其他人......"
 MAR_Kosygin.52.t: "来自俄罗斯的爱"
 MAR_Kosygin.52.d: "“本人认为，对于那些将向信徒传达正确信息的人员的培训需求是完全合理的，并且需要立即开始在克格勃大楼内准备这些人员。培训将通过讲座的形式进行，内容包括提升国家形象的相关课题。经过几场讲座后，受训者需通过一次验证考试。\n\n考试通过的受训者将被要求准备前往哈萨克斯坦出差，时间不定。火车每周日上午10:00发车。若受训者无论因何原因未能按时到达，将被送交法庭，并将宣布处罚措施，如重新培训或最长六个月的监禁。\n\n若考试不通过，受训者必须重修课程。如果受训者没有系统地参加讲座，也将被送交法庭，并将宣布处罚措施，如重新培训或最长六个月的监禁。”\n\n根据《关于在哈萨克斯坦境内改变宗教言论的人员培训》的命令，XX年XX月XX日。"
 MAR_Kosygin.52.a: "命令下达了，我们就开干吧。"
 MAR_koskaz_liquidate_other_ideas: "消除异议"
 MAR_koskaz_liquidate_other_ideas_desc: "在克格勃办公室进行的长时间讨论没有白费，现在阿訇们开始传教，传播所需的信息。但这只是战斗的一半，甚至更少。许多中东信仰的传播者和其他人无法听从我们的劝告，继续将不同意见带入人们的心中。\n\n不幸的是，要解决这个问题，再教育是一个漫长而不便宜的选择。在这种情况下，我们将不得不动用克格勃和其他军事组织来消灭伊斯兰教和其他信仰中的寄生虫残余分子，因为他们会与我们的政府作对。"
 MAR_Kosygin.53.t: "第42198号报告"
 MAR_Kosygin.53.d: "XX年XX月XX日，第42198号报告：\n\n周一下午3点，一伙在阿克套市从事反国家颠覆活动的穆斯林团伙被捕。该团伙由7人组成，头目为阿斯兰·布尔杰诺夫。缴获了3支马卡洛夫手枪、2支卡拉什尼科夫突击步枪、6枚RGD手榴弹以及约500发各种口径的子弹。这伙人已被押送至曼格斯套州监狱。\n\n周三，在曼格什拉克湾一伙企图乘船前往伊朗的人被海岸警卫队拦截。该团伙由4人组成。海警试图逮捕他们时，他们开火反抗，双方进行了短暂交火，最终击毙全部团伙成员。\n\n周四，约20人袭击了阿特劳市克格勃中心。他们是激进的伊斯兰教徒，意图炸毁克格勃大楼。在随后的枪战中，13名匪徒、2名克格勃人员和1名平民丧生，约50人受伤。一名匪徒被制服,目前正被拘留。审讯尚未得出太多信息,但我们相信他很快就会崩溃。匪徒的自制炸弹没有引爆。目前正在阿特劳区展开大规模搜捕行动。"
 MAR_Kosygin.53.a: "这些报告令人不安。"
 MAR_koskaz_kazakh_autobahn: "哈萨克公路"
 MAR_koskaz_kazakh_autobahn_desc: "不可否认，哈萨克斯坦只是一个中转站，是我们向南推进远征的补给基地。不停止向南扩张是至关重要的，上层领导对此也有清醒认识。然而，这里自然产生了一个问题：作为补给基地的哈萨克斯坦，可与德国这个共产主义的典型范例(?)相提并论，简而言之，它作为补给地的条件实在糟糕。\n\n但我们可以改善这一状况。积极动员当地民众参与修建公路，运用新技术，定能很快取得成果。现已开始筑路基，为日后畅通国内各地的运输铺平道路。而所有这一切，当然都是为了人民的利益，是的，全然为了人民的利益..."
 MAR_koskaz_arbeit_macht_frei: "工作让你自由"
 MAR_koskaz_arbeit_macht_frei_desc: "“劳动使人从猿猴进化而来”这是一句著名的表述，它是正确的。我们也可以说，如果一个人不劳动，他就会变成猿猴。而我们的国家不需要猿猴。因此，我们有必要尽可能多地雇佣那些不愿意工作的人，即囚犯。况且，劳动有助于一个人获得自由。\n\n不久的将来，我们将向哈萨克斯坦所有管理特别违纪人员的机构发出相应指示。这样，他们就可以为祖国的利益服务，也许会反思自己的生活，成为社会的有用一员。此外，我们还可以将其他地区的囚犯送到广阔的大草原，在那里监狱无法为他们提供体面的工作岗位。最大限度利用囚犯是解放囚犯的途径。"
 MAR_Kosygin.54.t: "在“冥界”"
 MAR_Kosygin.54.d: "在矿井里，铁锤敲击石头的声音此起彼伏，合为一体。监工们不时大声呵斥工人的动作。囚犯们每天要工作多个4小时的班次，劳作从未停歇。即使在夜里，工作也在持续进行，因为国家的工业决不能因为一座矿山而停滞。在这里，每个人都在为祖国的利益而努力奋斗。\n\n突然之间，一切声音异常安静。所有在场者用手捂住耳朵和头部。几秒钟后,传来一声震耳欲聋的爆炸。在无数条隧道之一，另一块坚硬岩石被炸开了。尽管爆炸声震耳欲聋、令人眩晕，但现场的活动已经开始了重新展开。一些人正将石块装上车厢运往地面，另一些人则在评估爆破效果，寻找新的矿脉。\n\n就在这时，一阵铃声在曲折的隧道里回响。守卫们勉强说道:\"吃午饭的时间到了！\"这个词意味着当班结束。疲惫不堪的囚犯们无声无息地走向地面。在那里，其他应接替他们工作的矿工已经在等候了。他们在矿井里也将不会有轻松时候。没有人在矿井里会过得轻松..."
 MAR_Kosygin.54.a: "但这一切都是为了祖国好！"
 MAR_koskaz_zhuz_aesteisc: "每个玉兹的独特点"
 MAR_koskaz_zhuz_aesteisc_desc: "有一个简单的事实——如果你对所有事物都一视同仁，结果必定会非常糟糕。这一点我们从统一后俄罗斯遗留给我们的中央集权企业中可以看到。幸运的是，我们有一种奇妙的计划经济体制，可以避免这种弊端，我们需要在哈萨克斯坦推行这一体制。\n\n我们备受尊敬的经济部长马斯连尼科夫提出了一个简单而有效的想法——每个玉兹将获得其独特的生产规范，专注于一个生产部门。这一计划将使我们能够优化整个哈萨克斯坦的经济，提高全国各地的生活水平。"
 MAR_koskaz_return_northern_kazakhstan: "重返北哈萨克斯坦"
 MAR_koskaz_return_northern_kazakhstan_desc: "在19世纪和20世纪之交，俄罗斯帝国官员曾经有一个宏伟计划——将北哈萨克斯坦并入俄罗斯。尽管从形式上看这些地区是帝国的一部分，但实际上同化进程要么有限，要么根本没有进行。这导致了这些领土在内战期间成为哈萨克斯坦的一部分。\n\n但现在情况已经不同了。现在我们可以完成近70年前开始的事情。我们需要对哈萨克人和其他非斯拉夫少数民族进行大规模迁往南方的移民安置，并将俄罗斯人安置在那里。尽管这个计划在纸面上看起来困难且几乎无法实现，但实际上它要简单得多,而且更有利可图。再者，我们也不想重蹈过去的覆辙..."
 MAR_Kosygin.55.t: "重绘地图"
 MAR_Kosygin.55.d: "办公室里一片热火朝天的景象。奥伦堡省长和经济部长正在热烈讨论北哈萨克斯坦问题。当初制定解放哈萨克斯坦行动计划时，并未考虑战后行政区划的问题。但现在，这个问题比以往任何时候都更加迫切。\n\n“早在20世纪初，俄罗斯帝国就曾考虑过一项同化并并吞北哈萨克斯坦的计划。不过当时这个计划未能实现。不过现在,我们已经准备好去完成这个计划了。当然，我们需要你的帮助，但我可以向你保证，结果会让你们完全满意。”奥伦堡省长说。\n\n“我向你保证，我们会认真考虑你的论点，并在下次苏维埃会议上讨论这个提议。”经济部长马斯连尼科夫回答道。\n\n“那好，我建议我们拿出地图，来确定边界重划的范围。”\n\n“我没有异议，同事。”\n\n一名助手递给他们一张哈萨克斯坦及其毗邻地区的地图。他们拿起铅笔和其他用具,开始就边界重新划分提出各种建议。争论持续相当长时间，还一度险些演变成争吵，但喝过几杯酒后，他们已经在欢声笑语中离开了行政大楼。"
 MAR_Kosygin.55.a: "这样做是为了国家好。"
 MAR_koskaz_islamic_monbol: "具有伊斯兰特色的君主社会主义"
 MAR_koskaz_islamic_monbol_desc: "自哈萨克斯坦并入俄罗斯之后，已经过去了足够的时间来初步总结在这个中亚国家进行的改革、建设和转型。目前负责哈萨克斯坦重建工作的尼古拉·伊万诺维奇·马斯连尼科夫，准备亲自向沙皇阿列克谢二世展示成果。\n\n我们的君主将花数天时间游览哈萨克斯坦的不同地区，亲眼目睹所做工作的成果。他将由经济部长兼这一项目的主要思想缔造者马斯连尼科夫陪同。他们将走访哈萨克斯坦的各个角落，熟悉所有细节。让我们祝愿沙皇一路平安!"
 MAR_Kosygin.56.t: "阿斯塔纳的庆祝"
 MAR_Kosygin.56.d: "尽管清晨时分，阿斯塔纳依旧熙熙攘攘，人潮涌动。这也难怪，因为阿列克谢二世陛下正在视察新并入俄罗斯版图的哈萨克斯坦首都。这位君主表达了希望亲自游览那些曾经目睹战火肆虐、从将军和其他官员手中获救解放的领土。\n\n在主广场上，哈萨克第17特种营的士兵们自清晨7点起就列队等候，迎接皇帝陛下的到来。酷热难耐，考验着士兵们的耐力。预计陛下8点30分抵达。但8点时，皇家卫队的第一批车辆已开进城内，各军乐队也开始奏乐。皇帝到达后，全城隆重庆祝。民众成群结队涌上街头，相随阿列克谢二世的车队前行。最终，陛下的车辆在广场停下，阿列克谢二世登上新建的讲台。在那里,他发表了早已在别列兹尼基准备好的演说，言及俄罗斯与哈萨克人民的团结，对当地官员顺利实施及时改革表示感谢，并对未来寄予美好祝愿。\n\n演说后，一场空前盛大的阅兵式拉开序幕。哈萨克第17特种营全员参与，手持列宁和尼古拉二世肖像，沿着纪念广场阔步前行。阅兵结束后，阿列克谢二世前往阿斯塔纳主清真寺。伊玛目们热情迎接，与沙皇就各种话题交谈。简短交谈后，作为俄罗斯统治者，阿列克谢二世获得伊玛目的祝福，祈愿他能在捍卫祖国的战争中取得胜利。阿列克谢二世由衷感动于民众已视俄罗斯为家园，并承诺将提供最高级别的资金支持。那一天，似乎不仅仅是阿斯塔纳，整个哈萨克斯坦都在欢庆。"
 MAR_Kosygin.56.a: "万岁阿列克谢二世皇帝！我们的捍卫者、统治者和守护者！"
 MAR_Kosygin.57.t: "前进，迈向未来"
 MAR_Kosygin.57.d: "俄罗斯并非单纯的机器，不是被破坏后重新修复的零件和螺丝钉的集合。俄罗斯代表着未来，是全人类应当追求的典范。我们在诸多领域取得了前所未有的成就，俄罗斯如何实现君主制与社会主义的和谐统一，为全人类树立了楷模。\n\n我们毫无疑问可以展望俄罗斯在不久的将来成为最先进的国家。我们不仅实现了身心合一，更创造出世所罕见的非凡机器。无论是民族、政体、科技还是经济，俄罗斯处处独树一帜。也许有朝一日，全世界将意识到我们的先见之明而效仿我们的脚步。但他们永远无法赶超，因为我们已在万事万物中遥遥领先。\n\n未来将为我们带来何种新挑战？我们毫无惧色，相信定能攻克重围，唯有磨砺才能锻造更为坚韧的民族气节。求知的渴望胜过恐惧，我们渴望阔步走向未来。抑或我们已踏足未来?无论如何,俄罗斯正以喷气式战机飞驰超前的姿态飞快前行。"
 MAR_Kosygin.57.a: "这个红色国度已经击败了所有人。"
 MAR_Kosygin.70.t: "不错的圈套"
 MAR_Kosygin.70.d: "昔日,一支克格勃特遣队正密谋搜捕并消灭一伙藏匿林中已久的反苏维埃武装分子。这些暴徒不仅长期隐匿不明,更是骚扰当地民众,令区域政权忍无可忍。尽管手持武器,但其嚣张行径终将受到严惩。特遣队必将彻查幕后黑手,绳之以法,以绝后患。\n\n行动开始前,队长尼古拉·斯科尔索夫简短地向手下士兵作了任务提示：“言简意赅，免得有人在关键时刻走神而导致不测。敌人约有一个排的规模，已在林地地形占据防御阵地，将所有战利品都汇集在那里。他们营地的位置我们已经掌握，因此我们应该绕开一定距离，避免让那些家伙先发现我们的兵力部署。在靠近距离内，我们将分成多个小队，由中士们率领，以包围圈的形式将那些家伙团团围住。一旦听到射击声响起，或者到了约定时间，我们就开始火力压制。不建议使用手榴弹,因为我们需要俘虏。如果必须使用，也要在不拉引线的情况下投掷。关键是要迅速控制住他们，以便在他们因失血过多而失去意识前审问他们。难道有人为了抽烟而错过了急救课程吗？还有一点需要记住,我们不知道他们是否设置了地雷,或者你会不会踩到一个空罐头,所以很可能我们需要直接突击营地,在没有完全包围的情况下展开攻击。这时,侧翼的任务就是切断敌人的撤退路线，坚持到我们赶上那些试图逃跑的人为止。大家都明白了吗？”所有士兵都表示明白。\n\n队伍向森林内行进18公里后,在帐篷、箱子和挖掘的地沟之间,看到了稀疏的人影。\n\n指挥官通过望远镜观察后,在无线电上命令所有士兵：“十分钟后,准备就绪。”\n\n规定时间过后,无线电再次发出命令，这次是开火的指示，导致那些稀疏的人影开始倒下。反叛分子被打得手足无措，无法组织任何抵抗，其中一些甚至在帐篷里就被无武装擒获。只有当时正在地下掩体内的人设法为迫近的克格勃特工做好了准备，他们向封闭空间内投掷了一枚手榴弹,但直到爆炸过后，并投掷了一枚未拉引线的手榴弹企图造成恐吓后，他们才自己进入掩体内。\n\n当营地被清理完毕，战斗声音停止后，一个声音从清理反叛分子最后藏身处的士兵那里传来，他们正抬着一名腿部在爆炸中被炸断、现已勉强包扎的有着俄罗斯帝国军阶和白卫军时期臂章的蓄着络腮胡子的人。\n\n“我的舌头受伤了，救护员！”尼古拉听到他说。看着那名被来的救护员正在重新包扎的俘虏身上的制服，军官露出了一丝微笑，然后自言自语道："
 MAR_Kosygin.70.a: "这或许正中我们的下怀。"
 MAR_Kosygin.71.t: "维亚特卡之夜"
 MAR_Kosygin.71.d: "弗拉基米尔·奥斯卡罗维奇·亚历山德罗夫-别利亚耶夫虽出身贵族，但在罗曼诺夫王朝统治时期，并未像其父系亲属那般享有特权。在维亚特卡公国并入别列兹尼基之前，他只是一介平民。然而，维亚特卡大会遭遇恐怖袭击后，政府着手重整执法系统，亚历山德罗夫-别利亚耶夫遂决心在新岗位上一试身手。他先是加入民兵，后来因表现出众而受到警察青睐，被招入首都夜间巡逻队，维护街道治安，远离罪犯骚扰。\n\n一夜，亚历山德罗夫-别利亚耶夫与同事在两条街道交界处执勤时，突见数名恶徒逼视一名年轻女子。\n\n“哎哟，这不是个漂亮妞儿被我们逮个正着吗。兄弟们，把她拿下！”为恶徒之一叫嚣道。女子惊恐万状，哀求救助。\n\n亚历山德罗夫-别利亚耶夫沉着冷静，吩咐同伴在原地待命，决定先行介入，查明事由。\n\n弗拉基米尔厉声喝斥那些恶徒:“你们在做什么？放开那个女孩！”\n\n“哎，你这个垃圾，别多管闲事，乖乖走开吧。”恶徒们置之不理。\n\n“我再次命令你们，立刻放开那位女士！”\n\n出乎意料的是，为首那名恶徒从衣袋里掏出一把纳甘左轮手枪，对准亚历山德罗夫-别利亚耶夫，重复道：“我已经说得很清楚了,你最好别插手。”亚历山德罗夫-别利亚耶夫试图夺下那把武器，却不慎被恶徒击中手臂。就在这时，他的同伴赶到，二人合力将犯罪分子拘捕，并呼救警察和救护车。\n\n警察抵达现场展开调查，逮捕了那些罪犯。其中一名警员走上前，希望与亚历山德罗夫-别利亚耶夫交谈，二人就此展开了对话。\n\n“听着，我看这件事已经不归我们管了。”那名警员开门见山地说。\n\n“你怎么突然这么说？”亚历山德罗夫-别利亚耶夫不解地问。\n\n“嗯，最近有个新成立的组织，专门对付犯罪分子，似乎叫克格勃。”\n\n“啊，我也听说过他们。不过他们主要还是负责追查曾在首都实施恐怖袭击的那些恐怖分子吧？”\n\n“是的，但克格勃不会放过这样一个良机，把这起案件牢牢控制在自己手里。毕竟这可是在夜间发生的枪击案，而在恐袭之后，任何类似的案件他们都会直接插手介入。”\n\n那名警员说完，亚历山德罗夫-别利亚耶夫便走向受伤的女子，决定亲自护送她平安回家。"
 MAR_Kosygin.71.a: "夜幕下的首都躁动不安。"
 MAR_Kosygin.72.t: "对摄政王的告别"
 MAR_Kosygin.72.d: "摄政王与沙皇将军，乃是整个人民王国两大政治巨头，如今却并肩长眠于同一马车之中的不同棺椁。他们的离世，宛如一瓢冷水浇醒了整个沉睡中的国度。当这两位重量级人物离世的讯息传遍青年俄罗斯联盟的疆土时，无论贵族还是平民，无不陷入了近乎致命的震惊与茫然之中。\n\n整个都会民兵大队，加上提前支援的卫队装甲营“胜利者圣乔治”中队，共同护卫着这场庄严肃穆的葬礼仪式。百姓纷纷簇拥而来，一方面是为摄政王与沙皇将军做最后道别，另一方面也是期望见证这两位巨头的继任者将是谁。毕竟在许多人眼中，他们曾是不可或缺的存在。\n\n在这场永别的仪式上，当弗拉基米尔·吉尔登场致辞时，他郑重宣告那些实施这起暗杀的凶手将受到法律的最严厉惩治。那些公然反对当权者的人也将遭受同样的命运。随着灵车徐徐驶向安息之地，全国上下无不屏气凝神。当棺椁在国歌《祝我国家永世长存》的庄严圣乐伴奏下缓缓降入墓穴时，场内无人能掩饰眼眶中涌现的泪水。就连大自然在那一刻似乎也肃然静止，万物寂然无声。告别仪式结束后，弗拉基米尔·吉尔亲自前来陪伴皇帝，并护送他上了停驻在附近的车辆。"
 MAR_Kosygin.72.a: "伟人往往都有相应的结局。"
 MAR_Kosygin.73.t: "老鼠窝"
 MAR_Kosygin.73.d: "卡内夫斯基和他手下无疑是执法界的佼佼者,在揭露卡赞的\"铁锤手\"案件后，他们更是成为人民帝国执法体系中活着的传奇。当宝座教派恐怖分子的阴云笼罩这个年轻国家时，弗拉基米尔·吉尔在择取得力干将时自然而然地想到了卡内夫斯基，因为他曾经成功捣毁了无数俄罗斯异端宗教的基地。但这次任务格外棘手，根据一名被审讯的恐怖分子如实供述，塔博里茨基本人今夜就会现身在这处藏身地点。将那名嫌疑人丢在一滩肮脏体液中，卡内夫斯基和手下们便前去缉拿这个西俄罗斯最大的通缉犯。\n\n计划如下：卡内夫斯基率领小队将从正门直捣黄龙，而吉尔调度的民兵旅则将包围住这处藏身点的每一棵树、每一块石头，确保无一逃脱。卡内夫斯基将在当地剧院化妆成遭到殴打的模样，他的队员们则将穿上宝座教派突击队的制服伪装。当宝座教派的教主亲自到场时，当地的宗教异端分子就可以用这份“礼物”来奉承上级了。\n\n一切都按计划进行:卡内夫斯基的小队获准进入,他们开始在藏身处中心狂欢,切断了古俄罗斯异端分子和他们的武器库及警报系统的联系。人民民兵部队则成功捕获或击毙了一个个试图逃窜的\"突击队\"分子。\n\n行动结果：不可弥补的人员伤亡2人，击毙犯罪分子14人，逮捕犯罪分子21人。头目本人则在行动开始前15分钟已经溜之大吉，未能捉拿归案。"
 MAR_Kosygin.73.a: "虽然没能斩草除根，但这条毒蛇已经遭受了重创。"
 MAR_Kosygin.74.t: "一袋故土"
 MAR_Kosygin.74.d: "尼古拉并不怎么热爱俄罗斯。或者说，完全不热爱。但与许多同胞不同的是，他并非厌恶俄罗斯人或俄罗斯国家，而是厌恶俄罗斯这片土地本身。冬天太冷，秋季太泥泞，夏季和春季也不够温暖。在这样的环境下，土地的产量远远不及他的家乡，这意味着尼古拉·格里申科无法正常从事他最喜欢的农活。\n\n但在该地区局势稳定下来，尼古拉攒下了足够的钱购置萨马拉市中心的一块地皮和一处小房产后，他决定摊牌了。在从伊辛河畔的家乡村庄疏散时，他设法带走了6袋乌克兰黑土。尼古拉相信，用黑土种植、由妻子斯维特拉纳烘焙的面包，定能在萨马拉乃至整个地区的市场上横扫而过。\n\n不管怎样，尼古拉认为通过这些行动，他正在保护自己的文化，也让自己能够再次在故乡那片村庄播种和收获小麦的日子更近了一步。"
 MAR_Kosygin.74.a: "到那时，他们再也不会挨饿了。"
 MAR_Kosygin.75.t: "割麦子"
 MAR_Kosygin.75.d: "伊万和费奥多尔。两个伊万诺夫。他们家在取名方面确实不太有创意。但无论如何,他们是兄弟,家里的大多数事情都是一起做的。\n\n今天他们正在耕田。在一年中最炎热的日子里,他们身穿白衬衫,挥舞着镰刀。\n\n“兄弟，我们为什么要全手工做？我们可以叫拖拉机。”其中一人说。\n\n“不行，那个乌克兰佬说不能用机器，否则会毁了他的黑土地。”另一人回应道。\n\n“那黑土地有什么了不起？土就是土。”第一个人反驳。\n\n“诶，老弟，你当初投了谁的票？我投了那个叫玛利亚的。”第二个兄弟问道。\n\n“我投了别洛泽尔斯基。不过最后当选的是阿列克谢。”第一人回答。\n\n“啊，那会儿还蛮有意思的。”第二人感叹道。\n\n“你说，这个阿列克谢到底是不是那个...”第一个兄弟刚开口，另一人就打断了他。\n\n“嘿，闭嘴，傻瓜！”\n\n最老的那个兄弟环顾干净的场地，大声喊道：\n\n“阿列克谢二世·罗曼诺夫是真正的人民沙皇，就是这样！让伪装者下地狱去吧！”\n\n“哦，是的，没错。阿列克谢二世是最受欢迎的沙皇！我和我哥哥都投了他！”"
 MAR_Kosygin.75.a: "“好了，看起来一切都搞定了。继续干活吧。”"
 MAR_Kosygin.76.t: "无产者的午餐"
 MAR_Kosygin.76.d: "尤兹亚和弗拉基米尔两位工人在简陋的工人食堂里席地而坐,狼吞虎咽地吃完了一顿丰盛的午餐。弗拉基米尔擦了擦嘴,满足地说：“呼，像人们常说的那样,我们吃得很饱。对吧，尤兹亚？”\n\n尤兹亚点点头：\"是啊，弗拉基米尔，说得太对了。我们已经攒了一个星期的钱,但为了吃这么好,也是值了。”\n\n“对了，你们车间这个星期超额完成计划多少了?”尤兹亚问道。\n\n“我们以109%的效率完成了本周任务。你看,多棒啊！”弗拉基米尔骄傲地说。\n\n“哈，算什么啊。”尤兹亚不以为然,“我们可是达到了118%,你们还是向我们学习吧!”\n\n“得了吧，别傻了。\"弗拉基米尔皱了皱眉，“至少我还关心我的伙伴们，你们那边怎么样？格里什卡差点没了双手。”\n\n“哦，格里什卡是自己心不在焉，才会被卷入传送带里的。”尤兹亚撇撇嘴。\n\n“他戴了手套吗？没戴？那就不奇怪了！最基本的安全措施都没有，可伟大的列宁同志可是反复强调过这一点。”\n\n“哦？列宁同志在哪里说过？”弗拉基米尔怀疑地看着尤兹亚。\n\n“你是要我把列宁同志说过的每一句话都背出来吗？那可真是一座知识的高山啊，不，是一座巍峨的智慧之峰！”\n\n“好了好了，别争论了。”弗拉基米尔看了看钟，“已经8点了，明早7点我们就要上班了。我们付钱走吧。”\n\n两人看到账单上的价格时，先是吓了一跳，随即想起了阿列克谢的改革，这个价格对于今天的俄罗斯无产阶级来说是完全负担得起的。幸运的是，如今的俄罗斯无产者甚至比美国或德国工人都能吃得更好。"
 MAR_Kosygin.76.a: "生活在沙皇与苏维埃的国家真好！"
 MAR_Kosygin.77.t: "从王子到贫民"
 MAR_Kosygin.77.d: "加布里埃尔·米罗诺夫岑夫于1930年出生，在苏联当局的庇佑下，他得到了一切可能的优渥待遇。20世纪20年代，他的父母是新经济政策时期的私营企业主，因此加布里埃尔的童年生活十分美好。他擅长演奏手风琴，很快就在同龄人中交到了不少朋友。\n\n在战争年代，他的父亲前往前线，不幸在苏沃洛夫行动中的莫斯科保卫战中牺牲。\n\n战后，加布里埃尔自己搬到了别列兹尼基，在经济部当上了一名工人。凭借他的幽默风趣和交际手腕，他很快在那里结交了许多朋友，并开始在被征服的领土上买卖房地产。仅在鞑靼斯坦，他就收购了12000公顷的黑土地，并将其转手卖给了朋友们。他这样做是为了不落伍于时代，迅速融入新的环境。然而,克格勃的建立和对反革命分子的大肆围剿，却彻底破坏了他的计划。原因在于克格勃获知了米罗诺夫岑夫的类似操作，开始针对他收集可疑材料。过了一段时间，他的朋友和同事们纷纷被捕。就在那时，他意识到自己的命运已经注定。\n\n之后，米罗诺夫岑夫被传唤到检察院，在那里他被控以贪污土地财产的罪名。\n\n随后，他被关押在维亚特卡拘留所的牢房里。在那里，他得知他的那个计划还牵连了一些人民代表大会的代表们。这起被称为“土地案件”或“米罗诺夫岑夫案”的大案，成为了当时的重大政治事件。"
 MAR_Kosygin.77.a: "往昔之王侯将相，如今已化作尘泥。"
 MAR_Kosygin.78.t: "移动的图片"
 MAR_Kosygin.78.d: "尽管伊夫多基姆大部分时间都生活在萨马拉偏远的村庄里，但他从小就对科技充满了浓厚的兴趣。11岁那年，他第一次看到了一台奇迹般被苏联政权遗留下来的拖拉机，当时就如同着了魔般地注视着它。从那时起，已经过去了很长一段岗徊流离的岁月。随着弗拉索夫分子的覆灭，如今是人民沙皇执掌大权，而那台破旧的拖拉机也已蜕变成为15台现代化的联合收割机，为伊夫多基姆和他的家人带来了可观的收益。而现在，在家园与日本关系趋暖的大背景下，伊夫多基姆终于可以实现他长久以来的梦想——从广东购买电视机了！\n\n抵达阿尔汉格尔斯克港口后，伊夫多基姆在一名受雇的俄日双语翻译的陪同下，很快通过了检查手续，便急忙赶往最近的索尼工厂。他那种乡村式的朴实、善良和亲和力，对于工厂负责人来说无疑是全新的体验，这或许也帮助这位俄罗斯商人迅速达成了一笔交易，尽管价格有些小小的溢价。但这已经无关紧要了，因为就在那里——一台真正的中日合资的电视机!"
 MAR_Kosygin.78.a: "蔚蓝的屏幕，开心的脸庞。"
 MAR_Kosygin.79.t: "睡着了的警察"
 MAR_Kosygin.79.d: "叶夫多基姆坐在卡车的驾驶座上，陷入深深的沉思。明天他就要启程返回故乡了。他不禁想象亲朋好友们会有多么惊讶的表情。他会观看哪些节目呢?卡津别克会是什么颜色的呢?\n\n就在他百思不得其解时，一条铁链突然砸向车前盖，一只手猛地将他从驾驶座上拽了出来。眨眼之间，叶夫多基姆就躺在了光秃秃的柏油路面上，两个黑帮小混混开始毫无理由地殴打他。有人趁机将他卡车上的电视机抢走，装上另一辆汽车就迅速逃之夭夭了。叶夫多基姆没有躺太久，他爬了起来，内心充斥着无比的愤怒、仇恨，却也隐隐有一丝希望的曙光。他冲向最近的警察局,拽住一名戴着徽章的人。\n\n“Vaben jala!(被抢劫了!)”\n\n“Duibuqi, shenme?(对不起,什么?)”\n\n“Wei ben jidai un bange rei Kuang zule dlangkdi jiti!(我刚刚被一群流氓抢劫了!)”\n\n“Shei pianle ni?(是谁抢劫了你?)”\n\n“Ichin Ivan va vshexen di kvashennaya!(一个叫伊万的家伙和他那帮子人!)”\n\n“Shenme?(什么?)”\n\n“Tfu ty blyad!(你个该死的!)”\n\n希望似乎在叶夫多基姆的心中渐渐黯淡了。但出乎意料的是，它突然燃起了一团熊熊烈火！他记起了卡车被抢时停靠的那条街道。更重要的是，他记起所有抢劫者身上都有一个三只兔子的纹身！\n\n“看这里！”\n\n叶夫多基姆比划了个3的手势，然后用手比作兔子耳朵的形状，最后拍了拍自己的肩膀。\n\n“日本解放者特工！”(?)\n\n出乎叶夫多基姆的意料，那名警察突然来了精神，大声对着窗外的同事喊叫起来。接着,在6名警察的陪同下，他们迅速前往了犯罪现场。\n\n抵达现场后，经过简短的勘察，警方随即前往附近一处仓库，因为那里正是劫匪们的藏身之处。当年轻罪犯们的骨头和生命在执法人员的警棍和靴子下不断粉碎时，叶夫多基姆则将电视机重新装载好，向警员道别，驱车前往港口。他的船只将在1个半小时后启航。"
 MAR_Kosygin.79.a: "记住，儿子，千万别去广东！"
 MAR_Kosygin.80.t: "一棵古老的枫树，一簇年轻的樱花。"
 MAR_Kosygin.80.d: "“卢辛卡，我告诉过你，我们把你的连衣裙放在了行李箱里，而不是在维亚特卡。”\n\n“哦，谢天谢地，我刚刚还很紧张呢。毕竟这是我第一次出国旅行。”\n\n“最重要的是我们没有忘记带相机...”\n\n“噢，科利亚。我们现在在日本，这里到处都是那些先进的技术产品，大把大把的。”\n\n“哦，好吧，又要花钱了...”\n\n听到丈夫语气中隐隐的焦虑，卢辛娜·阿卡季耶夫娜靠在他的背上,双手环抱着他的胸膛。\n\n“亲爱的，老实告诉我，到底什么事让你这么烦恼?”\n\n经过一声沉重的叹息，尼古拉·亚历山大罗维奇倾吐了他的忧虑。\n\n“工作上的报告还没写完，现在就要休假了。我担心会被解雇。”\n\n“科利亚，谁会仅仅因为休假就解雇你?你有没有告诉过你的老板?”\n\n“嗯，我有告诉过他。”\n\n“那就没事了。再说了，在我眼里你是个勤奋、上进、英俊的人。即使被解雇了，我也不会抛弃你的。”\n\n在妻子这番温馨的话语之后，尼古拉的脸上终于浮现出了微笑，他的忧虑也被两人浪漫夜晚的美好回忆所淹没。\n\n“谢谢你，亲爱的。我很需要听到这些。”"
 MAR_Kosygin.80.a: "“最重要的是我们没有忘记带腌制食品的罐子。不过，我在想长崎会不会有蘑菇呢?”"
 MAR_Kosygin.81.t: "长滩的漫长一天"
 MAR_Kosygin.81.d: "帕维尔一直是个勤劳的人，而如今他的努力终于有了回报。他躺在金色的沙滩上，沙滩男孩的歌曲从收音机里响起，清凉的热带椰子冻饮正滋润着他的喉咙。暂且放下饮品，帕维尔正打算小憩片刻，突然有什么东西飞到了他的脸上。睁开眼睛坐起身来，他看到一个面露愧色的男孩，男孩右手拿着一个沙滩球。\n\n“迈克！我告诉过你多少次了，不许在沙滩上玩球？”\n\n男孩垂头丧气地低着头,而他的父亲则指着他,让他去沙滩上人少一些的地方。\n\n“你好。很抱歉我儿子打扰到你了，他不会再来烦你了。”\n\n“别介意，没什么大不了的。”\n\n“听着伙计，你有一口有趣的口音。你是从哪里来的？”\n\n“噢，我吗？我是俄罗斯人。在我们的沙皇和你们总统建立外交关系后，我就来到了这里。”\n\n“嗯，俄罗斯人确实是个有趣的群体。普通的沙滩游客可能会骂我儿子一顿,但你却保持了冷静。”\n\n“相信我，朋友，比起这个橡胶球，我经历过被投掷更重的东西。”\n\n两人都笑了起来,然后那名美国人开始凝视着沙滩的地平线。\n\n“你叫什么名字，美国人？”\n\n“埃里克。埃里克·麦克菲伦。”\n\n“帕维尔·斯列兹金。很高兴认识你。”\n\n两人紧紧地握了握手,然后一同凝视着宁静的海水。\n\n“你知道吗，这个海滩确实不错，但我6岁的时候，我们全家去洛杉矶度假，直到那些黄皮肤的家伙占领了那里。”\n\n“看来我们有共同之处。我的家人过去也常在塞瓦斯托波尔居住和度假，直到德国人入侵为止。嗯，你也知道后来发生了什么。”\n\n“是啊，看来我们并没有想象中那么不同。”\n\n“你知道吗，埃里克？我在想,现在我们两国走到一起了，何不迅速解决掉日本人和德国人的问题?”\n\n“你说得对，如果我们国家能像一直以来那样持续改善关系，5到10年内，我们就能一起乘坐从塞瓦斯托波尔到洛杉矶的航班了。”\n\n“哦...不好意思，那是你儿子吗？”\n\n“什么？！迈克，马上过来！”"
 MAR_Kosygin.81.a: "男孩就是男孩。"
 MAR_Kosygin.82.t: "海外调查"
 MAR_Kosygin.82.d: "“瓦迪姆,我们已经走遍了加利福尼亚州一半的地区。我们问过当地人对各种政治人物的看法。接下来我们该去哪里？”\n\n“听着,尼基塔,别抱怨了。你当初同意和我一起来美国旅行的。我们还得去俄勒冈州呢。”\n\n“俄勒冈州在加州哪个方向?我对美国的地理不太了解。”\n\n“就在加州的邻近。”\n\n这一周,来自“通向青年俄罗斯！”报社的两名记者瓦迪姆·卡尔彭科和尼基塔·瓦西里耶夫一直在横穿美国，他们想了解西海岸公民对美国各种政治人物的看法。他们的工作就是在大小城市对居民进行街头采访。当他们在加利福尼亚州的工作即将结束时，他们决定将目标转移到另一个州。\n\n长途旅行很累人，所以尼基塔决定和同事聊点天，打破沉闷。\n\n“瓦迪姆，我们已经走遍加州一半的地区，但还没总结任何东西呢。没错,我们讨论过听到的内容，但没得出什么结论。”\n\n“有什么好讨论的？有人支持现任政府，有人支持反对党，很正常啊。也确实有人支持格斯·霍尔或弗朗西斯·约基那样的人物，但他们的支持者屈指可数。”\n\n“这正是我想讨论的。你觉得他们将来会变得更有影响力吗？”\n\n“你是在让我预测未来吗？我怎么知道明天会发生什么？我不排除这种可能，但在我看来，可能性不大。”\n\n“嗯，老话说得好，'时间会证明一切。'”\n\n在一家加油站停车时，尼基塔建议采访过路人，了解他们的政治观点。\n\n结果，在受访的八人中，五人表示支持共民联盟，两人支持国家进步党团，一人支持格斯·霍尔领导的国家进步党团左翼。\n\n采访后，尼基塔和瓦迪姆继续前往俄勒冈州。\n\n“等我们回到维亚特卡，应该给这篇文章想个好标题。”瓦迪姆说。\n\n“我觉得等到达州首府再考虑这个问题吧。现在，我们专心把重点放在这上面。先找家旅馆住下，好好休息一夜。”\n\n他们在一家汽车旅馆入住，租了间房。瓦迪姆开始听录音机上录制的对话，而尼基塔在笔记本上记录着。瓦迪姆睡着后，一个标题的点子突然出现在他的脑海中。"
 MAR_Kosygin.82.a: "丰富多彩的美国社会。"
 MAR_Kosygin.83.t: "俄罗斯越野"
 MAR_Kosygin.83.d: "阿卡迪在俄罗斯动荡时期经历了很多。但他从未经历过靴子被雪、石块、树枝和沼泽水填满一半的情况。\n\n“嘿，佩特，我们还要在这片沼泽里跋涉多久？”\n\n“工头说到8点，所以还有一个半小时。”\n\n“至少吧。你知道我在想什么吗？”\n\n“什么？”\n\n“嗯，他们也许比我们先修建了通往苏尔古特的道路。”\n\n“当然，但那些该死的德国人把它搞砸了。”\n\n“不过，与我们西部的道路相比。嗯....当它们遭到炸弹袭击时，也能好一点。”\n\n“都是因为来自苏尔古特的女飞行员。当地人说，这片沼泽里埋藏着许多梅塞尔施米特战斗机。”\n\n阿卡迪和佩特短暂休息，抽了根烟。当他们凝视着沼泽的深处时，阿卡迪说出了一句悲伤但充满希望的话。"
 MAR_Kosygin.83.a: "“只要上帝保佑，我们甚至可以修建一条通往莫斯科的道路。”"
 MAR_Kosygin.84.t: "法庭"
 MAR_Kosygin.84.d: "掩体内灯光昏暗，墙壁冰冷，装饰简陋，除了宣传海报、计划书、地图和类似的废纸外，几乎一无所有。“真是符合切尔尼戈夫人的品味。”什马特科夫中尉心想。他和下属们正在检查亚佐夫的一个备用庇护所。\n\n“除了武器、黑色联盟特工的密码，以及实施某种'大审判'的计划外，什么也没找到，中尉。”\n\n“那就说明你们搜查得不够仔细，少尉。继续搜！”\n\n隔壁房间传来一个尚未变声的嗓音，是帕夫连科列兵的声音。\n\n“中尉，我发现了一些东西！”\n\n听到呼唤，军官们赶到下属身边，只见他正盯着一张撕破的乌拉尔地图。\n\n“怎么了，帕夫连科？”\n\n“中尉，就在这里，这是个什么，洞穴吗？”\n\n列兵将手伸进地图，直没到手肘，随后纸张彻底撕裂，墙上露出一个黑洞洞的窟窿。"
 MAR_Kosygin.84.a: "黑色联盟对我们没什么好藏的。"
 MAR_Kosygin.85.t: "最沉重的事"
 MAR_Kosygin.85.d: "阿列克谢二世·柯西金。无论他是否真正名副其实，此刻他别无选择，唯有成为阿列克谢二世。\n\n青年俄罗斯联盟控制下的乌拉尔地区获得解放后，人们发现了伊帕季耶夫府邸——这个尼古拉全家惨遭杀戮的地方。然而事实证明，并非所有人都遇难了。柯西金不得不亲自出席这座府邸的隆重开放仪式。一队官员和一个排的记者随同沙皇前往，聆听他讲述那个可怕日子里发生的全部经过。不得不说，沙皇的记忆力令人叹服，对那段时期的每一个细节都历历在目。\n\n仪式结束，庆祝活动开始，阿列克谢却独自一人留在了府邸内。在主厅里，皇室最后幸存者的照片被装裱在玻璃画框后。柯西金在那里静默地伫立了约半个小时。\n\n“请原谅我。”阿列克谢·尼古拉耶维奇喃喃自语。出乎意料地，一位年轻助手走进房间，看到沉默的沙皇，情不自禁地问道：“阿列克谢·尼古拉耶维奇，出什么事了吗？”\n\n环顾四周，沙皇开口道：“没什么。我只是想起了从前这里的模样。我马上就来，请在外面等我片刻。”阿列克谢将照片放回原处，迈步走向他的座驾。"
 MAR_Kosygin.85.a: "照片中的人像是那样栩栩如生，仿佛还在昨日。"
 MAR_Kosygin.86.t: "教堂中的谈话"
 MAR_Kosygin.86.d: "“神父瓦西里,我已将圣餐所需之物备好。”年轻的助祭一边说着，一边下到地窖取基督的血肉。\n\n瓦西里神父则登上钟楼。他向来喜爱钟声，即便在大动乱时期最黑暗的日子里，钟声也总能抚慰他的心灵，给他力量。瓦西里像往常一样眺望村庄，却看到了新政权的红旗在风中飘扬。他还不至于老年痴呆，但也足够年长，记得内战期间教会所遭受的苦难。神父为未来忧心忡忡，走下了钟楼。\n\n瓦西里问：“特罗菲姆，你怎么看这个新沙皇？”\n\n“瓦西里神父，那是尘世间的事，与我们何干？”\n\n“换了别的政权也就罢了。但这是共产党人，我不能让教会重蹈布尔什维克时期的覆辙。”\n\n“我偶尔会和邻村的助祭交流，他们没说共产党人做了什么。看来人民帝国是以东正教为根基的...”\n\n就在这时，教堂的门被砰砰地敲响了。瓦西里开门，看到一个衣衫褴褛、身着克格勃制服的男人，身后跟着几个士兵。瓦西里顿时心沉到了脚底，仿佛回到了1918年。\n\n“瓦西里神父，早安。我叫格列布·莫恩科，是国家安全委员会的。我们在扎巴·约瑟连的营地搜查时发现了这些圣像和祭祀用品。你们村是最近的定居点，所以我们认为你是原主人，能确认一下吗?\"\n\n“是的...是的。这群律贼很久以前，唉，天知道有多久了——洗劫了教堂。你们是怎么找到他们的？”\n\n“原来约瑟连比乌拉尔的将军更熟悉尤格拉地区，但我们有更好的装备。再见，瓦西里神父。”\n\n从震惊中缓过神来，瓦西里的心重新升到了胸膛，充满了希望和信念。他的教会不会再遭劫掠和亵渎了。"
 MAR_Kosygin.86.a: "他们虽身披红装，却并非无神论者。"
 MAR_Kosygin.87.t: "从赤红至赤红"
 MAR_Kosygin.87.d: "“您好，我想加入党组织。”\n\n“日安，请告诉我您的姓名和职业。”\n\n“尼基塔·叶戈罗维奇·博尔佐夫。我在秋明南部的肉类加工厂工作。”\n\n“非常感谢。请在调查问卷中填写您的地址，以便我们在接受您的申请后给您寄信。”\n\n尼基塔弯腰在纸上填写时，脑海中只有一个问题：\n\n“我这样做对吗？这帮混合主义法西斯把共产主义整个儿给歪曲了，还搁那立个沙皇当头儿。要不我接着往东跑？没准亚戈达那个最高主席团还在呢。还是说大动乱的时候就被整没了？鬼知道，不过我得试试。但我非得这样吗……不...我跑够了。先是从哈尔科夫跑路，然后从莫斯科跑路，现在又从秋明跑路？不，别想了。没准这些混合主义者还真有道理，妈的。说到底，要是布尔什维克最好也就能选出个卡冈诺维奇和赫鲁晓夫，那我可不当什么布尔什维克了。”"
 MAR_Kosygin.87.a: "和解大街9号11室。"
 MAR_Kosygin.88.t: "地下圣战"
 MAR_Kosygin.88.d: "达尼斯兰无法接受俄罗斯异教徒再次踏入哈萨克斯坦的伊斯兰国土，屠杀圣战勇士，强加他们的宗教信仰于手无寸铁的人民。今晚，他和村里的几个年轻人约好在宣礼员的家中碰面。\n\n“孩子，你走的时候，把墙上挂着的那把枪也带上。”\n\n“父亲的那把枪？真的吗...”\n\n“你父亲曾用这把枪对抗共产党，后来又用它对抗俄国人。这是他的遗愿。”\n\n达尼斯兰扛着这件家传宝物，一路思索着第一次进攻的计划。也许该袭击党的大楼？还是攻击警察局更好？那里或许能弄到些武器。\n\n沉浸在自己的思绪中，达尼斯兰甚至没有注意到他已经走到了宣礼员的家。一种本能的恐惧袭击了达尼斯兰。院子里停着几辆镶嵌红星的汽车，甚至还有几辆装甲运兵车。房子里挤满了克格勃特工。穆萨、哈迪尔和其他朋友熟人躺成一堆，喉咙被割断，脖子上还有弹孔。看不到宣礼员的身影，但能听到他在房子旁的棚屋里的惨叫。达尼斯兰试图去拿父亲的步枪，却听到一阵干脆利落的枪响，随后他便感觉不到自己的右手了。"
 MAR_Kosygin.88.a: "鲜血不断渗出。"
 MAR_Kosygin.89.t: "从烈火跃入火海"
 MAR_Kosygin.89.d: "公路修缮工程已经持续了两个小时。瓦西里早已习惯了第二次大动乱期间的艰辛与苦难，但没人能适应哈萨克斯坦的酷暑。\n\n“瓦迪克,去给米哈雷奇拿混凝土搅拌机，他们又在同一地点炸毁了一段路。”\n\n“我勒个去，真的吗？前天他们才在那个倒霉的地方炸过。我们的兄弟们都还好吧？”\n\n“看样子彼得卡·特列皮约夫被弹片击中了,但军队已经把他送到医院了。他们抓到了那个该死的家伙。”\n\n“行，告诉他们等我把这一段修完就过去。”\n\n当同事朝临时茅厕走去时，瓦迪姆心中百感交集：“从某种意义上说，与阿尔汉格尔斯克相比，这里的报酬简直是皇帝老子的待遇，我肯定能供我闺女上大学了。”"
 MAR_Kosygin.89.a: "“但我去，这鬼地方实在是热得要命。”"
 MAR_Kosygin.90.t: "学习榜样"
 MAR_Kosygin.90.d: "与其他俄语教师不同的是，帕维尔·奇尔金的整个有意识的人生都在阿克莫林斯克度过。他的家族是苏联知识分子的一员，当年被党组织安置在这里，以消除哈萨克斯坦兄弟民族的文盲现象。但在德国入侵后，教育已不再是首要任务，生存才是头等大事。然而，经过最近的一系列事件，帕维尔现在能够同时教授俄语和哈萨克语，而他所在的学校、区域乃至整个城市都在近期的战斗后重建并得到了改善。帕维尔感到，尽管经历了过去的种种悲剧，但生活正重新变得有意义，那就是为祖国和人民服务。不是用枪，而是用俄语和文学的教科书。\n\n在最初的一堂俄语课上，他的一位老学生举手提问。\n\n“帕维尔·叶夫根尼耶维奇，为什么我们现在要学习俄语，而之前却不用学？”"
 MAR_Kosygin.90.a: "“莫尔达别克，我们学习俄语是因为哈萨克斯坦和俄罗斯已经重新成为兄弟了。”"
 MAR_Kosygin.91.t: "基本重建"
 MAR_Kosygin.91.d: "位于科克赛中心的老建筑始建于俄罗斯帝国晚期，在苏联时期未经过任何大规模改造，后来更是被彻底遗忘。然而，值阿列克谢二世皇帝即将莅临该市之际，有关部门决定在其正式访问前三天开始进行大规模修缮。党委书记和他的副手正在主走廊刷白墙壁，而其他党员则忙于翻修房屋的其他工作。\n\n“谢尔盖·谢尔盖耶维奇，我们就不能雇佣当地工人吗？”\n\n“不行，叶夫根尼·叶夫根尼耶维奇。在上次会议上，我们已经决定自己动手进行修缮。再说，劳动创造人！我们也要做出点像样的成绩。”\n\n“那您觉得我们能及时完工吗？陛下后天就要来了，我们还得抛光屋顶，安装新大门呢。”\n\n“外部工程我们已经请人了。听说，就连来自阿尔汉格尔斯克的无产者都受不了这里的酷暑，我们就更可能中暑了。”\n\n“哎呀！谢尔盖·谢尔盖耶维奇，快打开窗户，不然我们要被这油漆毒死了。”\n\n就在这时，一名年轻党员从正门冲了进来，焦急地汇报道：\n\n“谢尔盖·谢尔盖耶维奇，叶夫根尼·叶夫根尼耶维奇！政府那边刚打来电话。他们说沙皇陛下不是后天晚上，而是明天早上就要到了！”"
 MAR_Kosygin.91.a: "看来维修工作将持续到深夜。"
