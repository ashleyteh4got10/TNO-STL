 MAR_Kosygin_Prestol.1.t: "准备...."
 MAR_Kosygin_Prestol.1.d: "报告\n\n致：V.V吉尔\n\n发件人：梅列诺娃·I.Я，国家安全委员会纳里扬马尔省分部部长\n\n自196X年初，我部陆续收到关于拥王者组织在极北地区活动的报告。该组织隶属于“宝座教派”恐怖网络，其动向已引起我部高度重视。经研究决定，派遣（-------）同志潜入该组织进行调查，并设法与其成员建立联系。\n\n得益于（-------）同志的出色工作，在行动的第一个月内，他就成功打入了拥王者组织内部。他与一名同情恐怖分子的当地居民（-------）取得联系，并通过此人参加了拥王者核心成员的秘密集会。\n\n为了不引起怀疑，（-------）同志不得不执行各种任务，引起该组织成员的注意，并对他们的理念表示支持。这也让他获得了更多关于该组织活动、结构、集会地点和行动的情报。\n\n经过一段时间的侦查，我们掌握了足够的信息，确定了拥王者主要成员的藏身之处。他们躲藏在（-------）郊外的一栋废弃建筑内。（-------）同志利用他的专业技能，成功定位了该建筑，并将情报及时传回。\n\n目前，突袭拥王者巢穴的计划已经准备就绪，正等待克格勃总部的指示。\n\n日期：（-------）"
 MAR_Kosygin_Prestol.1.a: "按计划行动。——V.V. 吉尔"
 MAR_Kosygin_Prestol.2.t: "......还有袭击。"
 MAR_Kosygin_Prestol.2.d: "黎明前的黑暗笼罩着这片土地，国家安全委员会的特工、警察和内务部士兵，早已在城市郊外集结完毕。空气中弥漫着一触即发的紧张气氛，所有人的目标只有一个——突袭极端东正教恐怖组织的总部。\n\n此前，克格勃特工已经进行了周密的侦察，锁定了恐怖分子的藏身之处，并制定了行动计划。行动必须迅速而隐秘，以防恐怖分子组织反击。\n\n然而，当特工们抵达现场时，他们意识到计划可能出了岔子——恐怖分子早有准备。这些狂热的东正教徒全副武装，手持突击步枪、手枪和手榴弹，严阵以待。\n\n克格勃指挥官当机立断，决定孤注一掷。在T-62坦克的掩护下，突击小组缓慢接近恐怖分子总部。与此同时，另一支内务部特种部队从侧翼包抄，对恐怖分子形成合围之势。\n\n枪声打破了黎明的寂静，恐怖分子的火力凶猛，我方难以还击。 就在这时，枪声突然停止了。指挥员抓住机会，下令全线进攻。转瞬间，恐怖分子的第一道防线就被突破了。\n\n意识到胜利无望，残余的恐怖分子开始溃逃，试图逃进森林，伺机而动。大部分恐怖分子选择投降，但也有人丢下武器，消失在茫茫林海中。内务部另一支部队奉命追击残敌。\n\n行动最终以我方的胜利告终，几名“宝座”成员被生擒，但更多的人则因负隅顽抗而被击毙。希望“宝座”的毒蛇，再也不能在这里兴风作浪了。"
 MAR_Kosygin_Prestol.2.a: "九头蛇失去了一个脑袋。"
 MAR_Kosygin_Prestol.3.t: "白色恶魔的藏身之处"
 MAR_Kosygin_Prestol.3.d: "今天，位于维亚特卡的克格勃办公大楼内，气氛格外凝重。来自奥涅加的潜伏特工发回了最新情报，行动迫在眉睫。\n\n“同志们，我们得到了一些不太乐观的消息。”特工一边说着，一边从文件夹里抽出几张照片，钉在黑板上，“阿尔汉格尔斯克地区的反共武装，一直在接受来自奥涅加的武器装备，芬兰人可能也参与其中。这些暴徒已经袭击了好几个村庄。”\n\n“另外，根据特工的报告，北方的‘宝座’组织内部出现了分裂，一个叛军村庄宣布加入了所谓的‘人民红军’。结果，反共旅对这些‘叛徒’进行了血腥报复。可惜的是，我们无法利用这一点。但有一点是肯定的，要摧毁‘宝座’的这个据点，我们必须入侵奥涅加。”\n\n会议室里顿时鸦雀无声。在局势如此不稳定的情况下与芬兰开战？这简直是疯了！然而，除此之外，显然别无选择。"
 MAR_Kosygin_Prestol.3.a: "我们必须前进。"
 MAR_Kosygin_Prestol.4.t: "你认得这张脸吗？"
 MAR_Kosygin_Prestol.4.d: "基尔皮奇尼科夫坐在卡车里。作为领袖，比起那些追随他的人，他肩上的责任重了太多。他究竟想要得到什么？或许，连他自己也说不清。也许，他也曾真心相信，将北俄罗斯从那些共产主义者手中解放出来就能让俄国人民过上更好的日子。然而，在他即将被处决的此刻，这一切又有什么意义呢？\n\n突然，一辆反方向驶来的汽车停了下来，士兵们开始大声叫喊。是道路被封锁了吗？还是有人决定孤注一掷，袭击车队？但这些，又还有什么意义呢…在士兵的喊叫声中，他听到一个熟悉的声音回应着什么…那声音中带着释然，却饱含悲伤。“请理解，我需要和他谈谈，”那个不知名的男人想要见某个人，这一点毋庸置疑。\n\n公国的一名士兵跳上卡车，示意基尔皮奇尼科夫下车。白海刺骨的寒风瞬间将他拉回现实——他还活着。几个全副武装的人站在纵队前，但他们并没有表现出对车队的任何敌意。然后，其中一人无视士兵的存在和紧张的气氛，径直冲了过来，他穿着一件白色的制服，戴着一顶鸭舌帽。\n\n冰冷的双手抚摸着基尔皮奇尼科夫的脸。\n\n“沃洛佳，是我！你还记得我吗？” 冲向基尔皮奇尼科夫的老人，似乎忘记了自己已至迟暮，像个孩子一样，为遇见朋友而欣喜若狂。\n\n“萨沙……你还活着，”弗拉基米尔认出了他，亚历山大·梅德韦杰夫，他们曾并肩作战，共同抵抗法西斯。时光荏苒，却并未眷顾他们二人。\n\n“怎么会这样？” 梅德韦杰夫的目光瞬间暗淡了下去，显然，他也明白了眼前的一切意味着什么。一滴泪水，顺着他的脸颊滑落。\n\n叛徒无言以对，往事不堪回首。他只是瞥了对方一眼，便试图转过身去。\n\n“请原谅我所做的一切。永别了。” 那个穿着白色制服的人伸手去摸腰间的东西。而当基尔皮奇尼科夫意识到发生了什么事时，已经太迟了。一声枪响划破天际…"
 MAR_Kosygin_Prestol.4.a: "雪染成了一片深红。"
 MAR_Kosygin_Prestol.5.t: "意外的启示"
 MAR_Kosygin_Prestol.5.d: "曾经，在科米共和国还存在的时候，柯西金与极右法西斯分子，即所谓的“进取组织”打过交道。尽管古米廖夫著作中的许多观点可以（也肯定会）受到质疑，但他的进取理论甚至在科学界也得到了认可。还有一位伊戈尔·沙法列维奇，他在不久前还是一位优秀的数学家，但后来转而从政。在理论上，他也与宝座教派有关。\n\n但他还是不得不与他们交谈。现在的议程是打击“宝座”。虽然他们被关在监狱里，但对我们来说仍然非常危险，因为他们可以联系 \"王座 \"的支持者。我们必须首先设法审讯他们。\n\n第一个进入沙法列维奇审讯室的人开始了审讯。\n\n“姓、名和父名。”第一个审讯者问道。\n“沙法列维奇·伊戈尔·罗斯蒂斯拉夫维奇。”\n“我想和你谈谈。我不会问太复杂的问题，所以......”\n“我会把你需要的一切都告诉你。”沙法列维奇突然打断了他。\n“什么？”审讯者惊讶地说。\n“我不会反抗你的。这对我来说毫无意义。”\n“真没想到。为什么？”\n“我没有理由阻止你们与宝座教派作战。我很清楚你们和塔博里茨基的人是什么关系，我和这个疯子也有过节，如果你能打败他，对我来说会更好。”\n“这出乎我的意料。那好，请把你知道的关于他的一切都告诉我吧。”\n沙法列维奇双臂交叉，闭目而坐，开始讲话：\n“我首先要说的是，这个人是一个真正的疯子，一个相信1918年被布尔什维克处决的阿列克谢·尼古拉耶维奇皇子还活着的极端君主主义者。我很惊讶会有人追随他，因为任何一个正常人都不会接触他。也许这只是个玩笑？”\n“所以，你认为这个人真的相信阿列克谢还活着？那他为什么反对现任沙皇？”\n“因为他相信你们的罗曼诺夫不是真的。”沙法列维奇肯定地说。“如果我没记错的话，他就是柯西金。我曾经在科米共和国的政治舞台上见到他。虽然柯西金他假扮罗曼诺夫，在我看来是本世纪最大的骗子，但他还是比这个疯子塔博里茨基强。”\n“还有什么说的吗？”\n“我确信我的一些同事是这个组织的成员。我不能肯定有多少人，具体是谁，但我肯定他们在那里。毕竟，这在数学上是合乎逻辑的。”\n“你对塔博里茨基的行踪了解多少？”\n“很遗憾，我一点都不清楚。”沙法列维奇说。\n对伊戈尔·沙法列维奇的第一次审讯结束了。接下来还有几次审讯。然而，我们以前从未如此轻易地得到过这样的启示。"
 MAR_Kosygin_Prestol.5.a: "古米廖夫会怎么说？"
 MAR_Kosygin_Prestol.6.t: "没有人会两次踏入同一条河流"
 MAR_Kosygin_Prestol.6.d: "对古米廖夫的审问和对沙法列维奇的审问一样揭示了一些细节。原来，进取组织的成员加入了宝座，他们在科米的主要基地位于瑟克特夫卡尔东郊一栋非常不起眼的房子里。这栋两层楼的房子因是进取组织和其他激进右翼运动的聚会地点而闻名。古米廖夫从同志们那里得知，科米宝座教派的总部也设在这个地方。\n\n得知这一情况后，当地立即派出了一支特工队。以这样一种方式冲进大楼，进取组织甚至来不及反抗。在这个地方开启斩首当地宝座教派的行动，自动给了整个恐怖网络一个沉重的打击，一旦发生这种情况，这个组织的成员就再也无法协调一致地行动了。\n\n突袭计划在凌晨一点进行。特工们开始行动，一切按计划进行。所有这些人一枪未发就被抓获，整个宝座小组被摧毁。整个行动用了大约两分钟。所有这些人都被送进了监狱，以便对他们采取进一步行动。"
 MAR_Kosygin_Prestol.6.a: "最后，这座房子被关闭了。"
 MAR_Kosygin_Prestol.7.t: "罪..."
 MAR_Kosygin_Prestol.7.d: "由于工作条件艰苦，工资低，伊万·普罗霍罗夫不得不想尽办法生存。有人找到他，只要他提供少量的爆炸物，他们就给他一大笔钱。虽然这是犯罪，但伊万觉得这个条件很不错。他已经做过好几次这样的事了，尽管他被检查过是否有这样的罪名。显然，他们并没有注意到这一点。\n\n伊万·普罗霍罗夫又偷了炸药，几乎没有意识到自己在犯下另一项罪行。又一天工作结束后，他平静地离开了，走向他通常提供炸药的地方。没有任何迹象表明他会遇到麻烦，突然，两个人从后面接近他，抓住他的胳膊，把他拖到拐角处。\n\n“嘿，你在干什么？！ 你是谁？！ 放开我！” 普罗霍罗夫说，试图反抗，挣脱那些陌生人的魔爪。\n\n后来，当他们已经把他赶到拐角处时，一个身穿军装的人出现在他面前，对他说：\n\n“伊万·普罗霍罗夫·彼得罗维奇。我是内务部的官员，”他出示了身份证件。“别慌，年轻人，仔细听我说。你在工业场地盗窃过多次，但如果你帮我们，我们可以解决你所有的问题。”\n\n伊万·普罗霍罗夫很害怕，但几秒钟后他平静了一些，说：“你想要什么？”\n\n“我们需要你帮我们找到你卖炸药的人。他们是来自‘宝座教派’组织的恐怖分子。别担心，你不在嫌疑犯名单上，但你可以帮助我们对付他们，”警官解释道。\n\n“是的，我同意......我同意帮你，”伊万·普罗霍罗夫有点困惑地说。\n\n“很好。我很高兴你理解我们。告诉我，他们在哪里？\n"
 MAR_Kosygin_Prestol.7.a: "犯罪源于不利的生活条件。"
 MAR_Kosygin_Prestol.8.t: "...与罚"
 MAR_Kosygin_Prestol.8.d: "伊万·普罗霍罗夫提供了他销售炸药的地点信息。行动小组迅速就位，准备抓捕那些前来接收炸药的人。特工们到达约定地点仅二十分钟后，宝座教派分子就出现了。事实证明，宝座教派本应在此接收一批数量巨大的炸药，计划运往塔博里茨基的主要团伙。从他们的交谈中可以听出，这应该是他们最后一次来这里，他们还指望从高尔基的不同工厂获得更多此类炸药供应商。然而，这一切都不会发生了。\n\n突然间，特工们发起了抓捕行动。所有逃跑路线被立即切断，凡是拒捕者都被当场击中躯干。这个宝座教派小组的头目被生擒，并被押送入狱。\n\n所有与这一组织有关联的人都是极度贫困的工人。因此，特工们向中央提交了一份请求，要求提高高尔基工厂的工资水平。这将有助于防止今后再次发生类似的情况。"
 MAR_Kosygin_Prestol.8.a: "任何一个吃饱喝足的人都不会与当局作对。"
 MAR_Kosygin_Prestol.9.t: "林中追逐"
 MAR_Kosygin_Prestol.9.d: "汉斯头也不回地沿路狂奔。刚才，他那由所谓纯正雅利安人组成的小队，突然遭到了蒙古部队的伏击。那些曾自诩勇敢的战士，在枪林弹雨中四散逃命，企图抵抗者纷纷倒在血泊之中。汉斯心中嘲笑着那些被派来保护他的傻瓜。\n\n周围的森林似乎无边无际，这浓密的林海逐渐压垮了他的意志。高大的树木如同活过来的怪兽，那伸展的枝桠就像瘦骨伶仃的手臂。时而，阴暗中似乎有恐怖的身影在树木后窥探，就仿佛这森林的主宰也在窥视着这场狩猎游戏。\n\n遮天蔽日的树冠下，一种不可名状的恐惧紧紧抓住汉斯的心。突然，他感觉到脚下被什么东西绊住了。他想象中的森林怪物似乎要将他拖入黑暗的深渊……\n\n此时，一名人民帝国军的士兵缓缓走近，决定先歇息片刻。“真是个跑得快的家伙，可恶。”士兵边喘息边自言自语。他看着倒地不动的汉斯，“喂，你怎么不说话？”但雅利安人并未回应，这让士兵感到不寻常。“不，不，别告诉我……”他忘记了疲惫，蹲下检查这具身体。翻过汉斯的身体，他发现这个雅利安人昏迷了，头部似乎撞击了倒下的树枝。士兵苦笑着，因为他现在必须独自将这个昏迷的敌人拖回阵地。"
 MAR_Kosygin_Prestol.9.a: "至少还有人可以审问。"
 MAR_Kosygin_Prestol.10.t: "最后的兄弟"
 MAR_Kosygin_Prestol.10.d: "根据初步审讯的结果,我们已经掌握了一些关于雅利安兄弟会残余分队的情报。他们似乎仍在继续对抗我们的军队。据悉,他们已经与宝座取得了联系,企图夺回在西俄罗斯战役中失去的一切。但他们的阴谋注定不会得逞,我们的特种部队将给予这个恶魔般的组织最后的、决定性的、致命的一击。\n\n“我们的部队处于高度戒备状态。”德米特里通过无线电报告。\n\n“明白，其他单位也已准备完毕。开始万字旗行动。消灭那群纳粹走狗！”军事行动总指挥部回复道。\n\n“遵命，执行。”\n\n清晨8时，信号弹火箭发射器的一声炮响，拉开了这场行动的序幕，惊醒了其他部队。雅利安兄弟会的游击队员们被打了个措手不及，但仍试图组织环形防御。他们用从仓库里偷来的武器抵抗，但行动人员很快就突破了“兄弟们”的第一道防线。值得一提的是，根据命令，普通士兵不准生俘，只有游击队长才需活捉。\n\n整场战斗仅持续约一小时，雅利安兄弟会游击队就此被全歼，整个战场犹如屠宰场。最后一名“兄弟”是一位名叫阿道夫·迈耶的人，他被生擒了，至今仍在受审讯。"
 MAR_Kosygin_Prestol.10.a: "最后，他们被打败了。"
 MAR_Kosygin_Prestol.11.t: "护送任务"
 MAR_Kosygin_Prestol.11.d: "“我们真的要去逮捕这些小虾米吗？为什么不去抓高阶军官呢...”\n\n“司机准确知道去哪里。这辆卡车距离车队也足够远了。”\n\n“他们真的对自己所做的事漠不关心吗?要是我们没有介入,他们会一直跟随到莫斯科吗?”\n\n“甚至到德国去。说到第一个问题——当弗拉索夫离开后，俄罗斯人民解放委员会的权力落到了奥克坦手中，他对于任何不能给他带来金钱的事都无动于衷。”\n\n在通往森林的道路中央，一辆印有俄罗斯人民解放委员会徽记的卡车正陷在泥泞之中，无法动弹。车轮深陷在泥淖里，无法使卡车摆脱困境。几名士兵和司机已经与大自然的力量搏斗了四个小时，但显然，如果没有外援，他们将无计可施。就在这时,他们试图将卡车拖出泥潭的努力被身后传来的呼喊打断了:“陷进去了？需要帮助吗？”这句话出自那领头的嘴里。转眼间，俄罗斯人民解放委员会的成员发现自己被六七名持枪人员包围。士兵们惊讶地放下了武器，而司机则试图爬回驾驶室。然而，这个企图被领导者亲自制止了。\n\n“你要去哪里？”领头的那位说着，一把抓住刚爬上去的司机的腰带，将他拽了过来。几秒钟后，司机便躺在了湿漉漉的泥泞中，正对着一把直指他脸的手枪枪口。“那么，你们要去哪里？”\n\n“别开枪！我们要去莫斯科运送货物。”\n\n“然后你们打算去哪里?”\n\n“我不知道。集结点已经被转移，我们只有越过萨马拉边境后才会获知新的位置。”\n\n“哦，那就准备好吧。我们现在就把你和你的人一起带走。"
 MAR_Kosygin_Prestol.11.a: "总比没有强。"
 MAR_Kosygin_Prestol.12.t: "许可的界限"
 MAR_Kosygin_Prestol.12.d: "国家安全部报告 - 项目编号第007451号\n\n关于国内安全行动的报告。\n\n机密。\n\n我方特工于12:00在萨马拉地区开展了“边境”行动，以阻止“宝座教派”在该地区的活动。\n\n行动状态：完全成功。\n\n说明：\n\n我方特工在该地区侦测到可疑活动。悬挂着“俄罗斯人民解放委员会”标志的卡车，从莫斯科专员辖区的方向，越过了西俄罗斯公国的边境。 “阿尔法”小队在发现目标后，立即对车队发动了攻击。缴获的物资包括：\n\n12辆GAZ-AAA型卡车\n\n100支自动步枪\n\n50枚手榴弹\n\n5具反坦克榴弹发射器\n\n10支手枪\n\n以及配套弹药\n\n车队移动路线图\n\n“阿尔法”小队利用这张地图，协调了其他单位的行动。其他部队对小城镇捷列尼卡地区发动了攻击，俄罗斯人民解放委员会的一个单位就驻扎在那里。 经过短暂的战斗，俄罗斯人民解放委员会的这支部队被我方歼灭，该部队的指挥官被俘。预计将对其进行审讯。\n\n建议：有必要排查我们的边防部队与“宝座教派”是否存在联系。"
 MAR_Kosygin_Prestol.12.a: "但我们不是杀了奥克坦吗？"
 MAR_Kosygin_Prestol.13.t: "“秋日”行动"
 MAR_Kosygin_Prestol.13.d: "通过对先前行动中俘获的“宝座”成员进行审讯，我们终于确定了塔波里茨基的藏身之处，以及整个恐怖网络的核心据点——乌拉尔山脉深处的盖尼地区，与西西伯利亚接壤。\n\n这个发现令弗拉基米尔·吉尔颇感意外，他决定亲自指挥此次行动，誓要将“宝座”连根拔起。\n\n经验最丰富的特工和士兵们，组成了精锐的突击部队。他们身经百战，从枪林弹雨和恐怖袭击中幸存下来，出色地完成了每一项任务。这一次，他们将肩负起最后的使命——彻底埋葬“宝座”。BTR-60装甲车将为他们提供火力支援，确保行动万无一失。\n\n根据计划，行动将于凌晨3:30展开。届时，晨曦将透过乌拉尔山脉的轮廓，为这片土地带来光明，而等待着“宝座”的，将是雷霆万钧的打击。探照灯和手电筒的光芒，将照亮每一个角落，让恐怖分子无所遁形。\n\n3:30，吉尔扣动扳机，一枚红色的信号弹划破夜空，宣告着行动的开始。紧接着，数道刺眼的光柱冲天而起，将目标区域照得如同白昼。在强光和炮火的掩护下，突击队员们快速穿过树林，向塔波里茨基的藏身地逼近。\n\n“宝座”成员已经听到了枪声和爆炸声，他们知道发生了什么事。万字旗行动的惨败，让他们吸取了教训，这一次，他们决心拼死抵抗。叶夫图霍维奇和维克托·拉里奥诺夫，组织起最后的抵抗力量。然而，经过之前的多次围剿，“宝座”已经元气大伤，缺乏足够的武器弹药和人手，防线岌岌可危。但他们心中依然燃烧着对新政权的仇恨，以及战斗到底的决心。\n\n枪声大作，弹片横飞。 “宝座”成员的抵抗，一开始还算顽强，但很快就被撕开了一道道缺口。\n\n“谢尔盖，你快走！我来尽量拖住他们！” 维克托·拉里奥诺夫对谢尔盖·塔波里茨基喊道。\n\n此时的塔波里茨基，内心充满了恐惧和绝望。他知道，末日将至。他接受了拉里奥诺夫的建议，没有任何保护，只身一人逃入了茫茫的乌拉尔山脉，手中紧紧地攥着一本圣经。\n\n战斗仍在继续…"
 MAR_Kosygin_Prestol.13.a: "这个懦夫逃跑了！抓住他！"
 MAR_Kosygin_Prestol.14.t: "降临日"
 MAR_Kosygin_Prestol.14.d: "塔博里茨基已经向乌拉尔山脉的方向逃了很远，似乎只要再往前一点，他就能越过西俄罗斯的边界，到达西西伯利亚西部。他喘着粗气向山上爬去，随着他的前进，山上的积雪越来越多。塔博列茨基的眼睛看到哪里，他就往哪里跑，因为即使在他杂乱无章的脑袋里，他也明白这似乎是终点。神圣的、真正的俄罗斯东正教就这样消失了，它最终倒在了犹太-布尔什维克的模仿者面前。一切都结束了。\n\n当塔博里茨基看到一个反射着月光的很小的湖泊时，他已经完全筋疲力尽了。湖水清澈见底，可以喝到这冰凉的水，而不会有任何危险。塔博里茨基突然感到非常口渴，他想走近这个泉眼。当他向泉水走去时，他放慢了脚步，想看清楚这个泉源，而每过一秒钟，他就会感到越来越恐怖——清澈的泉水变成了血泉。\n\n“这一切意味着什么？幻觉？这是真的吗？这都是什么!”塔博里茨基自言自语，显然不明白发生了什么。\n\n一个突如其来的少年声音吓了他一跳：“你没有完成任务。”\n\n塔博里茨基环顾四周，看到左边有一个男孩的身影，谢尔盖在他身上明确无误地辨认出了阿列克谢·罗曼诺夫。他简直不敢相信自己的眼睛，眼睛里颤抖着各种地狱般的情绪：对接下来会发生什么的恐惧，对自己没有看错的喜悦，对找到阿列克谢的惊喜，以及看到这一切时的震惊。哪一种情绪占了上风？恐惧。这种情绪开始支配其他所有情绪。\n\n“原谅我，阿列克谢... 我做不到，我想，我试过......”塔博里茨基开始说话，向阿列克谢·尼古拉耶维奇下跪。\n\n“没关系。我看到了一切。你失败了，但我原谅你。”\n\n“真的吗？”\n\n“跟我来。我们还有其他事，你会成功的。”\n\n塔博里茨基想和阿列克谢一起走，但他突然感到头痛欲裂，浑身无力，倒在了地上......"
 MAR_Kosygin_Prestol.14.a: "这是开玩笑吧？"
 MAR_Kosygin_Prestol.15.t: "宝座教派之终局"
 MAR_Kosygin_Prestol.15.d: "在一场短暂的战斗中，整个宝座教派匪帮被摧毁，头目被抓获，随后高级搜索队开始在该地区寻找塔博里茨基。大家都担心塔博里茨基已经设法逃到了西西伯利亚，并且已经在策划下一步行动，但幸运之神站在了他们这一边。\n\n先遣队在一个小湖边发现了塔博里茨基的尸体。在他的尸体周围有一小群狼，它们显然想吃掉尸体，但没有这么做。为什么？目前还不清楚。不过，狼群还是被吓得四散奔逃。\n\n尸体很容易辨认，但死因很可能是脑出血。大家决定把塔博里茨基埋葬在那个地方附近，并建一个匿名墓，这样就没有人能认出他了。\n\n吉尔得知了宝座教派最后被摧毁的消息，并把这个消息告诉了阿列克谢·柯西金。既然“宝座教派”已不复存在，那么这个国家就可以真正开始工作了。"
 MAR_Kosygin_Prestol.15.a: "这个疯子终于被制止了。"
 MAR_Kosygin_Prestol.16.t: "覆灭"
 MAR_Kosygin_Prestol.16.d: "阴霾笼罩着柯西金-罗曼诺夫的天空。这场“暗影之战”，亦或是清剿“宝座教派”的斗争，陷入了前所未有的僵局。虽说偶有进展，却始终无法对那盘踞的“宝座教派”施以致命一击。他们的力量如同来自地狱的恶魔，源源不绝，仿佛永远无法被彻底消灭。你只能暂时驱逐他们，但转瞬间，他们便卷土重来。这些恶魔，正在摧毁青年俄罗斯联盟历尽艰辛才建立起来的国家。\n\n自从那次刺杀未遂，已经过去了一年。柯西金深知，他们迟早还会再次出手。或是一周，或是一个月，即便拖延，也不过半年一年光景。如今，最后期限似乎已迫在眉睫，一场预谋已久的暗杀即将得逞。一切徒劳，只剩静待厄运降临——“宝座教派”的力量，远超乎我们的想象。\n\n柯西金需要透一口新鲜空气，驱散笼罩心头的阴郁思绪。然而，就在他探出头的那一刹那，一颗子弹呼啸而至，精准地射向他的头部。早已埋伏在街对面的狙击手，静静等待着他的猎物。柯西金闷哼一声，颓然倒地。\n\n大局已定。柯西金死了。“宝座教派”赢得了这场斗争。一切都结束了。"
 MAR_Kosygin_Prestol.16.a: "青年俄罗斯联盟的悲惨结局。"
 MAR_Kosygin_Prestol.17.t: "青年俄罗斯联盟的尾声"
 MAR_Kosygin_Prestol.17.d: "在塔博里茨基摧毁了柯西金在西俄罗斯的权力后，他的组织宝座教派试图夺取该国的政权。然而，这位自封为神圣俄罗斯帝国摄政王的领袖发现，他的组织开始分崩离析。许多原本支持他的成员，仅仅是因为不认同西俄罗斯的统治，如今纷纷离去。昔日伪政权的残余势力开始脱离组织，在各地区宣布自己的统治权。\n\n与此同时，西俄罗斯人民公国的首相弗拉基米尔·吉尔宣布掌权，但他的力量不足以征服所有其他地区。一个个地区开始脱离公国，国内出现了双重权力。然而，争夺西俄罗斯唯一王位的斗争不会发生——塔博里茨基和吉尔都无法对这片土地建立任何影响力，最终一切都回到了从前的状态。\n\n西俄罗斯正在缓慢但无可避免地陷入混乱。没有统一的权力，没有统一的边界，一度统一的国家内部再次出现了边界，仿佛重回军阀割据的时代。如果西俄罗斯能看到一位统一的统治者，那也绝非短时间内的事。饥饿、战争和毁灭再次降临到了俄罗斯的这片土地上。"
 MAR_Kosygin_Prestol.17.a: "这就是最后的结局了。"
 MAR_Kosygin_Prestol.18.t: "荒野戏剧"
 MAR_Kosygin_Prestol.18.d: "清晨的薄雾尚未散去，一辆厢式货车颠簸在泥泞的林间小路上，驶离幽深的密林，朝着城市的方向驶去。驾驶室内，两人有一搭没一搭地聊着天，电台里播放着舒缓的音乐，一切看似平静无波。然而，剧烈的颠簸让车厢内的货物剧烈摇晃，如同擂鼓般，为这看似平静的旅途增添了一丝诡异的节奏。突然，一个头发花白，满脸络腮胡的怪人从林中冲出，踉踉跄跄地跑到路中央，声嘶力竭地呼救。\n\n货车缓缓停在路边，老人几乎是连滚带爬地挪到车门前，跪倒在地，语无伦次地哭诉着什么。司机和乘客一头雾水，连忙询问老人的情况，然而老人只是不停地抽泣，语不成句。束手无策的两人只得从急救箱里翻找镇定剂，想要先让老人平静下来。但...\n\n砰！砰！两声枪响划破天际，惊起林间无数飞鸟，原本寂静的森林瞬间被恐惧笼罩，鸟兽四散奔逃。两具身体几乎同时倒在了血泊之中，而开枪的男人则平静地收起武器，点燃了一支香烟。\n\n“没用的东西，什么时候才能不用这种垃圾货色？”男人低声咒骂了一句，从口袋里掏出笔记本和铅笔。翻到其中一页，上面工整地写着：“任务：清除‘宝座教派’主要煽动者。务必干净利落。如有可能，获取重要文件并送回总部。任务状态：____”。男人在空白处写下“谢罗夫·伊戈尔 完成”，随后再次扫视了一眼货车，转身消失在茫茫林海之中。"
 MAR_Kosygin_Prestol.18.a: "等待下一步指示，通讯结束..."
 MAR_Kosygin_Prestol.19.t: "快，狠，准"
 MAR_Kosygin_Prestol.19.d: "又是平淡无奇的一天过去了。印刷机规律的轰鸣声回荡在厂房内，宣纸如同瀑布般倾泻而下，转瞬间便化身为一份份油墨飘香的报纸。醒目的头版标题仿佛在无声地呐喊：“阿列克谢·柯西金——骗子！” 这座看似平静的报社，空气中弥漫着油墨与纸张的味道，时间仿佛静止了一般。\n\n时钟的指针缓缓指向数字2，一声震耳欲聋的巨响毫无预兆地炸裂开来，仿佛有人在楼内敲响了一口巨大的铜锣。数秒之内，全副武装的士兵如潮水般涌入，粗暴的怒吼声盖过了所有的声响：“都他妈趴下！趴下！”\n\n仅仅几分钟，一切都结束了。报社的负责人被人从办公室里拖了出来，推搡进一辆早已塞满了报社员工的警车。等待他们的，将是位于彼尔姆边疆区别列兹尼基市的克格勃总部，以及在那里度过余生的冰冷铁窗。与此同时，印刷机的轰鸣声戛然而止，成百上千份印有“大逆不道”字眼的报纸被人从厂房里搬出来，扔进另一辆厢式货车的后备箱里，最后被整齐地装进一个个木箱中。这些纸质刊物的命运早已注定：也许再过一个小时，也许更久，这些箱子和它们的内容物就会在别列兹尼基市郊的某个垃圾填埋场被付之一炬，化为灰烬。士兵们还不忘试图用武器击落那块悬挂在报社门口的招牌——“宝座教派”印刷厂。"
 MAR_Kosygin_Prestol.19.a: "是的，吉尔同志，这次行动执行得非常完美。"
 MAR_Kosygin_Prestol.20.t: "完美的计划"
 MAR_Kosygin_Prestol.20.d: "别列兹尼基的倾盆大雨已经下了两天，据天气预报说，这场雨不会很快结束。雨滴的鼓声在阳台上响彻云霄，让人无法安静地抽烟。他意识到自己无法专心工作，便走进屋里关上了门。“糟糕的天气，”他嘀咕道，“我得快点行动，否则一切都会毁于一旦。”\n\n听完同伴的话，他再次调到无线电接收器，开始疯狂地调整频率。经过几分钟的努力，他终于成功地连接到了所需的频道，并进行了简短的传输：\n\n“呼叫大鹅，这是哈达，完毕。天气很糟，我们得快点行动。”\n\n“哈达，这是大鹅，完毕。明白，我们会尽快行动。”\n\n耳机里再次充满了静电噪音。它似乎与雨滴声完美地融合在一起，创造出不亚于在爱乐大厅和剧院里听到的交响乐。但是，当线路的一端在思考音乐时，另一端却在接收最后的指令： \n\n“...计划有变。我们必须迅速行动。原因是这倾盆大雨。所以，几乎没有时间了。你们只有五分钟的时间。如果你错过了时机，我们就都完了。命令是否清楚？”\n\n“非常清楚！”\n\n“在这种情况下，请各就各位，按计划行事。记住，真理比生命更重要！”\n\n带着这些话，四人躲进了伊卡鲁斯巴士的行李箱，这辆巴士正载着党员前往首都参加大会。他们在那里有大约三个小时的时间，在党员们离开大巴这短暂的五分钟，他们必须将炸药安装在党建大楼的指定位置，然后以同样的方式离开别列兹尼基。\n"
 MAR_Kosygin_Prestol.20.a: "党中央被炸毁。"
 MAR_Kosygin_Prestol.21.t: "塔博里茨基帮"
 MAR_Kosygin_Prestol.21.d: "他再次在“记忆”总部大厅召开会议。但这次比平常的宣传议程更重要。这次他谈到一个真正可怕的事件——波将金街的恐怖袭击。站在讲台后面，他首先默哀一分钟，以纪念死者。在场的每个人，无一例外，都肃静地站了起来。但在向死者致敬后，他开始了他的激烈演讲：\n\n “同志们！我不敢相信这是真的。我不想相信精神正常的人会做出这样的事。我不敢相信一个俄罗斯人会做出这样不道德和可怕的事情！我们的国家是世界上最伟大的国家，我不可能对此保持沉默！我要用尽全力喊出来，让我们所有的伟大人民都能听到真相！真相是臭名昭著的‘宝座教派’组织是这次恐怖袭击的幕后黑手。”\n\n大厅里的人倒抽了一口气，但总体上很明显，他们并不感到惊讶，而是证实了他们的怀疑。\n\n“是的，是的，你们都明白了，我亲爱的朋友们！这一切的背后是塔博里茨基和他那些可悲的随从。这些被社会抛弃的人，对批评不能做出正常反应，而是立即诉诸侮辱，他们就是这样的人！我知道他们是激进分子，而且，我们自己也是阿列克谢二世的激进派，但到了这种程度...... 你能想象一个人为了达到目的不惜杀害自己的同胞吗？我不能，但是塔博里茨基和他的犯罪团伙可以！所以我的判决是：宝座教派和所有为其辩护的人都是俄罗斯和俄罗斯人民的叛徒！他们必须像蟑螂一样被碾碎！这正是我对阿列克谢二世的期望！我会打碎自己的脑袋，但我会赶到他的办公室，说服他采取适当的措施！因为在某人身上——在某人身上，但在阿列克谢·尼古拉耶维奇身上，我不能怀疑。他能用铁腕掐死这些杀人犯和无赖，我知道这一点！毕竟，阿列克谢·尼古拉耶维奇是个伟人！他不分昼夜地通过广播支持人民，采取适当措施，立即命令工兵、工程师和其他专家前往悲剧现场。因为他爱俄罗斯，他爱俄罗斯人，这就是爱国主义的主要方面！为俄罗斯君主阿列克谢·尼古拉耶维奇欢呼！”"
 MAR_Kosygin_Prestol.21.a: "大厅里响起了热烈的掌声。"
 MAR_Kosygin_Prestol.22.t: "时机未到"
 MAR_Kosygin_Prestol.22.d: "夜幕迅速降临，将这座城市笼罩在它的怀抱中。地平线上挤出一小条光线，勉强照亮了高层建筑的顶部。但城市的大部分地区只有路灯和照明灯。几乎所有的窗户都亮了起来，晚餐、会见客人和其他家庭活动开始了。尽管恐怖，但城市仍在继续。\n\n随着城市犯罪率的上升，政府出台了旨在打击犯罪的紧急措施。其中一项措施是实行宵禁，要求所有市民在晚上十点至早上六点期间不得离开居住地。这些措施旨在加强居民的安全。人民民兵和被指派在街上巡逻的军事单位正在监督遵守情况。如果发现违规者，应将其带到警察局。但这些措施并未始终得到严格遵守。\n\n在加强居民保护的某一天晚上十点半，一名士兵走进一个居民区的院子，发现一群孩子在街上玩耍。他看了看时间，走近他们，但他们要么没有注意到他，要么不想注意到他。最后，当他们注意到他时，他径直走向操场。\n\n“年轻人，你们知道现在几点了吗？”\n\n“怎么了，到宵禁点了吗？”\n\n“当然，宵禁时间已经过了半小时了。”\n\n“快回家吧，不然你们就得走到最近的车站去了。”\n\n“谢谢你的信息，我们已经考虑过了，权衡利弊，我们决定接受你的建议。”\n\n“好的。”\n\n结束谈话后，大家相互握手，转身向家门口走去。很快，院子里就只剩下那个士兵了。他意识到任务已经完成，便继续在城里巡逻。"
 MAR_Kosygin_Prestol.22.a: "公民的安全至关重要。"
 MAR_Kosygin_Prestol.23.t: "卫队的工作原则"
 MAR_Kosygin_Prestol.23.d: "五个人沿着被街灯照亮的别列兹尼基空荡荡的街道走着。他们的袖子上佩戴着红色臂章，表示他们属于别列兹尼基市的伙伴卫队组织。由于恐怖袭击党总部导致犯罪大幅增加，伙伴卫队组织在别列兹尼基成立，以维护治安。偶尔会有汽车经过，吸引了伙伴卫队成员的注意，他们会回过头来观察汽车离去。\n\n街道让位于街道，街区让位于街区，但没有发生任何有趣的事情。透过云层探出头来的月亮往往是唯一能加入小分队的同伴。令人惊讶的是，他们的武器库里只有自己的拳头。在一些罪犯确实拥有武器的背景下，这一事实显得更加奇怪。但是，大多数人都只是抢劫商店的掠夺者。\n\n午夜将至。眼睛开始变得沉重，维护别列兹尼基秩序的勇敢战士们开始耷拉着眼皮，打起了哈欠，双腿也开始打结。他们他们想唾弃一切，然后回家，或者寻求帮助，或者就在街上睡着。睡意无情地淹没了他们。如果不是小队长看到了百货商店被打破的窗户，似乎一切都会这样结束。“安静！”他对手下的人厉声喝道。队伍立刻安静下来。指挥官小心翼翼地接近破碎的窗户，召集大家过去。“你们留在这里，也许小偷会试图逃跑。”他对其中一位男孩低声说道。后者只是默默点头表示同意。指挥官环顾四周，爬进了商店，后面跟着其他三名伙伴卫队成员。他用手势指示每个人搜索的方向，径直向前走去。其他人也没有落后，开始搜索百货商店。货架上几乎空空如也，人们的恐慌也说明了这一点。他们一米一米地搜索，快到商店尽头时，街上传来一声刺耳的尖叫。顷刻间，整个小分队已经来到了外面，眼看着留守的同志抓住了小偷。“好了，亲爱的，我们去警察局吧。顷刻间，整个小分队已经来到了外面，眼看着留守的同志抓住了小偷。领导者对被捕的罪犯说道，同时祝贺抓住小偷的伙伴卫队成员。"
 MAR_Kosygin_Prestol.23.a: "我们的卫队将是世界上最棒的卫队！"
 MAR_Kosygin_Prestol.24.t: "记忆和磨刀"
 MAR_Kosygin_Prestol.24.d: "与柯西金一起沿着别列兹尼基走向纪念碑的人列，象征着俄罗斯人的力量。\n\n一大群人聚集在别列兹尼基大楼附近，等待阿列克谢·柯西金出来。许多人手持亲人的肖像，但幸运的是，在场的大多数人都是空手而来。画像上画的都是在党总部恐怖袭击中丧生的人。\n\n最后，阿列克谢·柯西金身着黑衣走出行政大楼。在向聚集在一起的人们致意后，他首先要求默哀一分钟，以此缅怀死者。就这样，游行队伍静静地走向中央公园。当他们穿过城市街道时，人群越来越多。越来越多的人加入他们的行列，为无辜者的死亡感到悲痛。很快，队伍沿着事先为此目的而封闭的主要街道走过，进入公园。公园的正中央竖立着一座雕刻着永恒火焰的纪念碑。纪念碑由花岗岩制成。碑上描绘了一位士兵用玫瑰——和平之花为一位小女孩盖上被子的情景。\n\n最后，在游行结束时，柯西金登上了一个临时搭建的平台，用麦克风发表了讲话：\n\n“同志们！今天我们聚集在这里，纪念我们所爱的人。今天我们在这里团结起来，克服失去亲人的痛苦，送我们所爱的人踏上新的旅程。但我们也在这里团结起来，反对那些安排这场悲剧的人；反对那些毒害普通公民的生活的人，用恶魔般的谎言灌输他们的思想；反对那些质疑俄罗斯人民团结的人；反对一个人——谢尔盖·塔博里茨基。当然，我们不能低估“宝座”在这些问题中的重要性，但塔博里茨基才是罪魁祸首。他想摧毁我们——政府，以便独自统治这个国家。但他失败了。因为我有你们——我的人民，你们在任何情况下都准备好帮助我，我也准备好帮助你们作为回报。无论如何，我们可以一起克服所有困难！”"
 MAR_Kosygin_Prestol.24.a: "俄罗斯人民将永远团结一致！"
 MAR_Kosygin_Prestol.25.t: "又一个黑色早晨"
 MAR_Kosygin_Prestol.25.d: "昨天上午，宝座教派恐怖分子再次犯下暴行。在[数据删除]地区举行的支持青年俄罗斯和阿列克谢二世政府的示威游行中，一群不明身份的人使用了一个临时爆炸装置。\n\n在爆炸引起的恐慌中，又有几十人在踩踏中丧生。随后，恐怖分子在一栋居民楼内劫持人质。特种部队设法进入大楼，消除了威胁，但一些人质未能获救。"
 MAR_Kosygin_Prestol.25.a: "恐怖分子将为他们的罪行负责。"
 MAR_Kosygin_Prestol.26.t: "围攻"
 MAR_Kosygin_Prestol.26.d: "绝密\n\n向安全局局长V.V.吉尔\n\n[数据删除]地区军事基地事件的调查协议。\n\n无论是使用的方法还是对涉案人员的审讯，都毫无疑问，恐怖组织宝座教派应对此次袭击负责。虽然具体细节仍在确定之中，但已证实人员损失惨重，还损失了一些枪支、弹药、爆炸物和军用车辆。另一部分，包括重型武器，在现场被摧毁。\n\n阅读后立即销毁"
 MAR_Kosygin_Prestol.26.a: "..."
 MAR_Kosygin_Prestol.27.t: "办公室袭击事件"
 MAR_Kosygin_Prestol.27.d: "我们党在[数据删除]地区的办事处遭到恐怖组织宝座教派部队的袭击。恐怖分子乘坐一辆没有标志的卡车接近大楼，并向试图阻止他们的警卫开火。袭击者还使用自制燃烧弹试图点燃大楼。然而，当军队开始向大楼集结时，他们被迫撤退，但一些人死亡，大楼受损。"
 MAR_Kosygin_Prestol.27.a: "该死！"
 MAR_Kosygin_Prestol.28.t: ""
 MAR_Kosygin_Prestol.28.d: ""
 MAR_Kosygin_Prestol.28.a: ""
 MAR_Kosygin_Prestol.29.t: "和平的背后"
 MAR_Kosygin_Prestol.29.d: "克格勃总部今天弥漫着一种特殊的气氛。虽然从外面看似乎没有什么变化，但内部却一片混乱。最近落入特工手中的情报应该可以揭露恐怖组织宝座教派头目谢尔盖·塔博里茨基的行踪。\n\n当然，弗拉基米尔·吉尔必须亲自核实这些信息。毕竟，盲目相信俘虏未过于天真。\n\n简报室的门吱呀一声打开了，一位年轻的工作人员拿着一叠文件和照片走了进来。\n\n“有什么消息吗？”弗拉基米尔语气平静，但神情中透露出几分忧虑。\n\n“现有情报已经得到证实。塔博里茨基的藏身处确实在盖尼。根据航拍，我们能够确定据点的大致位置。”\n\n“嗯，就是这样。让我们用一颗纯粹的心去帮助别人吧。”弗拉基米尔说。\n\n随后对该地区进行了分析，并为歼灭行动做准备。本次行动的代号为“陨落”。"
 MAR_Kosygin_Prestol.29.a: "是时候来结束这一切了。"
 mar_prestol_check_berezniki_retard_tt: "§!现在我们应该关注一下别列兹尼基了...§!"
