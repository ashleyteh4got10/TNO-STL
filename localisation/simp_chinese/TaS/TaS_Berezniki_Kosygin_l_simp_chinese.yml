 MAR_SYKTYVKAR_OPERATION_DESC:0 "§B古米廖夫和沙法列维奇是塔博里茨基的潜在同伙，尽管他们目前在监狱里。与其他人相比，我们的行动有些非典型。我们的行动是与这些人的智力游戏。无论我们的对手有多么凶猛，他们都代表着我们的重大利益，可以告诉我们任何对我们有利的事情。如果我们审问他们或说服他们合作，他们就会为我们打击“宝座教派”提供极其宝贵的帮助。§!"
