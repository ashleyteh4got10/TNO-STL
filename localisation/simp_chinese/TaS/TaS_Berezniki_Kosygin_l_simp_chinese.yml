 MAR_prestol_dynmod_dummy: "塔博里茨基的阴谋"
 MAR_prestol_dynmod_dummy_desc: "§F资源开采效率：[?MAR_prestol_dynomod_array^2|2R%+=]\n物资消耗：[?MAR_prestol_dynomod_array^1|2R%-=]\n稳定性：[?MAR_prestol_dynomod_array^3|2R%+=]\n对驻军的破坏：[?MAR_prestol_dynomod_array^0|2R%-=]\nGDP增长：[?MAR_prestol_dynomod_array^4|2R+=]§R%§!\n其他军事开支：§R$[?MAR_prestol_dynomod_array^5|3R-]B§!\n--------------\n§!现在我们知道，在我国有一个极其危险的恐怖组织，他们想从内部摧毁我们的国家。塔博里茨基和他的人在维亚特卡搞了一出特技后，给了青年俄罗斯人一个沉重的打击，现在我们在治理国家方面遇到了明显的困难。此外，\"普列斯托尔\"教派的活动包罗万象：从宣传到公开的恐怖袭击，民众开始对我们失去信任，我们也因此失去了权力的合法性。\n\n在他们彻底摧毁我们之前，我们迫切需要对他们采取一些措施，在这场斗争中不能有任何妥协：要么一场新的动乱袭击俄罗斯，要么我们击败\"普列斯托尔派\"。"
