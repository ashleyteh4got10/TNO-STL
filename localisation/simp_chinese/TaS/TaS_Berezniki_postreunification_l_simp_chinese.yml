 MAR_epilogue.7.t:0 "西伯利亚之旅"
 MAR_epilogue.7.d:0 "正埋头于文件堆中的别洛泽尔斯基突然停下了手中的工作，他的目光转向了“一号专机”的舷窗。窗外，除了翻滚的云层，便是护航战斗机那矫健的身影。别洛泽尔斯基已经在俄罗斯的土地上巡视了很久了，这已经成了他的“日常工作”了。在对俄罗斯欧洲部分的主要城市进行视察之后，他的下一站将是乌拉尔山脉以东的广袤土地。\n\n“别洛泽尔斯基同志，”一个声音打断了他的思绪。\n\n他转过身，发现自己的助手站在一旁。\n\n“什么事？”别洛泽尔斯基问道。“飞行员报告说，我们很快就要降落在叶卡捷琳堡机场了。”助手汇报道。\n\n“很好，你去忙吧。”别洛泽尔斯基说完，便将目光重新投向了窗外。\n\n根据此前送达帝国首都的报告，西西伯利亚的首府理应已经从一片废墟中恢复了生机，而别洛泽尔斯基此行的目的，正是要亲眼验证这一点。在“一号专机”平稳着陆后，移动舷梯缓缓地靠了过来。\n\n当舱门开启的那一刻，机场上所有人的目光都齐刷刷地聚集了过来：城市和地区的领导人们、仪仗队，以及各路媒体记者们。片刻之后，别洛泽尔斯基出现在了舱门口。他站在舷梯的顶端，从容不迫地扫视着整个机场，任由记者们按下快门，记录下这一历史性的瞬间。\n\n“这机场看起来就像是昨天才刚刚建成的一样。”别洛泽尔斯基心想。\n\n他走下舷梯，受到了当地官员们的热烈欢迎，随后便一同前往车队。在接下来的三十分钟里，别洛泽尔斯基一边听取着官员们的汇报，一边认真地观察着沿途崭新的道路，以及道路两侧鳞次栉比的建筑工地。车队驶入市区后，街道两旁早已聚集了大量的民众，他们挥舞着帝国的旗帜，发出雷鸣般的欢呼声，即便隔着紧闭的车窗，这山呼海啸般的热情也清晰可闻。\n\n市区到处都是修葺一新的建筑，各种公共设施、商店和其他营业场所也如雨后春笋般涌现。随着车队越来越靠近市中心，曾经那些破败的废墟早已荡然无存，取而代之的是一幢幢拔地而起的高楼大厦。当车队经过行政大楼时，别洛泽尔斯基看到了一座庄严肃穆的广场。车队风驰电掣般驶过市区，向着郊外飞驰而去。不久之后，车队抵达了一片工业区，一间崭新的工厂出现在了众人的视野中。"
 MAR_epilogue.7.a:0 "俄罗斯正在从废墟中崛起。"
 MAR_epilogue.8.t:0 "全俄罗斯大会"
 MAR_epilogue.8.d:0 "今天，人民代表们的会议在一片略显紧张的氛围中拉开了帷幕。代表们围绕着诸多议题争论不休，包括经济、军事、教育改革等等。然而，所有这些争论都离不开一个大前提——与德国之间那场不可避免的战争，以及为此所必须进行的各项准备工作。\n\n例如，一位代表慷慨陈词，声称应该对德国人“采取一切手段，坚决打击，毫不留情”，但这一提议最终还是被认为过于激进，未能获得通过。当然，激烈的争论持续了很久，而且说实话，这次会议与其说是为了解决实际问题，倒不如说更像是一场面向全世界的外交“表演”，旨在向世界宣告，俄罗斯已经做好了用武力夺回失地的准备。\n\n不出所料，此事立即在媒体上引发了轩然大波。德国媒体将其斥之为“蓄意挑衅”，而许多西方社会学家也就可能爆发的战争纷纷发表了自己的预测。只有一点确定无疑：世界和俄罗斯都在发生着剧变，而这次会议只不过是压倒骆驼的最后一根稻草。整个世界都清楚地意识到，这场冲突已然无法避免。"
 MAR_epilogue.8.a:0 "我们将一如既往地痛击来犯之敌！"
 MAR_kosrus_return_of_empire:0 "§R帝国的归来§!"
 MAR_kosrus_return_of_empire_desc:0 "当尘埃落定，西伯利亚军阀的旗帜尽皆黯然落地，世界格局也随之天翻地覆。曾经那片充斥着混乱、战争和恐怖的广袤土地，如今已换了新天，人民的君主国傲然屹立在这片他们为之抛洒热血的土地之上。在前苏联的废墟之上，在那被血腥的红日与邪恶的万字旗帜蹂躏的土地上，沙皇阿列克谢·罗曼诺夫与他忠诚的臣民们缔造了一个团结一心的强大国度。\n\n从这一刻起，直到最后一名德国鬼子和日本倭寇被彻底赶出俄罗斯神圣的国土，统一后的俄罗斯将会动员全部的兵力，倾尽所有的资源，向着这一崇高的目标奋勇前进。第二次混乱时期已然落幕，神圣而伟大的解放战争自此拉开序幕！"
 MAR_kosrus_new_coronation:0 "新的加冕礼"
 MAR_kosrus_new_coronation_desc:0 "在事实上光复了西伯利亚的领土后，现在是时候将这一切落实到官方的文书之上了。阿列克谢·尼古拉耶维奇·罗曼诺夫的新加冕礼将在西伯利亚军政府的前首府中隆重举行。这一举动意在向西伯利亚的民众展现，他们的沙皇无惧于自己治下的子民，并郑重地选择在这座他们不久前还称之为“首都”的城市加冕。\n\n然而，塔博里茨基匪帮所制造的那场骇人听闻的恐怖袭击的惨痛教训依然历历在目，因此在加冕典礼期间，沙皇以及所有到场宾客的安全将由最为精锐的国家安全委员会特工负责。"
 MAR_kosrus_expanding_ogas:0 "扩展OGAS系统"
 MAR_kosrus_expanding_ogas_desc:0 "俄罗斯的统一带来了前所未有的机遇，其中最重要的莫过于将全苏自动化管理系统扩展到整个中西伯利亚和远东地区。如此一来，我们不仅可以极大地提升这些地区的科学技术水平，加速它们与国内的融合并刺激其经济的发展，还能够检验OGAS系统在新环境下的稳定性。\n\n根据格鲁什科夫同志的报告，在网络扩展的早期阶段，必定会出现个别节点负荷过重、数据传输和/或处理速度降低等问题。因此，在国家相对稳定之时发现并解决这些问题至关重要。"
 MAR_kosrus_expanding_ogas_tt:0 "§Y全国自动化管理系统的效能将提高:§!\n\n§Y国内生产总值增长§!: §G+1%§!\n§Y工厂生产总值§!: §G+3%§!\n§Y建造速度§!: §G+5%§!"
 MAR_kosrus_cerberous_squad:0 "“地狱犬”特遣队"
 MAR_kosrus_cerberous_squad_desc:0 "尽管西伯利亚军阀们已然覆灭，他们昔日的爪牙也放下了手中的武器，但仍然有一些顽固分子选择了负隅顽抗，打起了游击战。但幸运的是，先前针对“宝座”教派的军事行动使我们的国家安全委员会积累了丰富的经验，足以应对任何形式、任何规模的游击队和恐怖组织。\n\n而那支所谓的“地狱犬”特种部队其实并不存在，沙皇从未下达过秘密指示来组建他们，弗拉基米尔·弗拉基米罗维奇·吉尔也从未亲手挑选过这支部队的任何一名成员。“地狱犬”行动队从未以“与恐怖分子有勾结”的莫须有罪名逮捕过任何政府官员；“地狱犬”行动队从未将数十名被怀疑支持恐怖分子的平民草草地埋尸于荒无人迹的原始森林之中；“地狱犬”行动队也从未在突袭了恐怖分子的最后一处大型营地后将他们悉数处决。一切恐怖组织都被彻底肃清，这完全仰赖于克格勃与各地执法机关的通力合作，除此之外再无其他。"
 MAR_kosrus_rebuilding_pacific_portrs:0 "重建太平洋沿岸港口"
 MAR_kosrus_rebuilding_pacific_portrs_desc:0 "我们不得不承认西伯利亚军政府的贡献，虽然客观来讲算不上什么。但无论如何，他们确实将被占领时日军废弃的马加丹港重建到了某种程度上能看的状态。然而，在他们眼中视为终点的成就，对我们来说仅仅只是一个起点而已。我们将会彻底拆除那些腐朽的船台和锈迹斑斑的塔吊，取而代之的是这个时代最为先进的设备。\n\n在完成对马加丹港口以及其他数座太平洋小型港口进行现代化扩建后，来自共荣圈和OFN以及他们盟友的商船便会如同百川归海一般涌向我国，寻求有利可图的贸易机会。这正是所谓“左右逢源，各取所需”。"
 MAR_kosrus_sunny_america:0 "阳光普照美利坚"
 MAR_kosrus_sunny_america_desc:0 "啊，美利坚！作为世界上那个硕果仅存的超级大国，高举着自由与民主的旗帜屹立于世界的西方。然而这些虚名对我们来说无足轻重，重要的是它为了捍卫这些冠冕堂皇的口号时所选择的敌人——大日耳曼国与日本帝国。俄罗斯与美利坚有着共同的敌人，这一事实已不是什么秘密，但现在最为关键的是——俄罗斯已经完全有可能成为一柄分化瓦解敌方阵营的“攻城锤”。\n\n当然，若无美利坚提供的经济和军事技术援助，这柄“攻城锤”则无从谈起，而美国人也深知这一点。虽然他们也许还不会豪爽到无偿送给我们数十亿美元和最先进的喷气式战斗机，但俗话说得好——有总比没有强！"
 MAR_kosrus_neon_sphere:0 "霓虹闪耀之圈"
 MAR_kosrus_neon_sphere_desc:0 "未来属于日本！至少在沙皇的智囊团中，那些主张与日本走得更近一些的人是这么说的。尽管不免有些夸大其词，但他们所言也并非空穴来风。日本在科技领域的发展速度令人瞠目结舌，即使与其他超级大国相比也毫不逊色。\n\n另一方面，收复滨海边疆区的呼声日益高涨，通过展现我们与日本进一步深化合作的积极姿态，可以在未来的领土争端谈判中为我们争取更多筹码。毕竟，为了获得俄罗斯丰富的石油资源，日本是愿意付出高昂代价的。"
 MAR_kosrus_tsar_speech:0 "沙皇的演讲"
 MAR_kosrus_tsar_speech_desc:0 "万事俱备！在彻底巩固了对新收复领土的统治，并确定了未来的外交方针后，沙皇将向全体俄罗斯人民发表一段期待已久的讲话——一段他们苦苦等待了三十年的讲话。解放战争的序幕已然拉开！那曾笼罩在俄罗斯上空的噩梦般的阴霾终将被驱散，正义的光芒终将重新照耀在这片苦难的土地。从今往后，任何外国的元首或天皇都休想再将他们的旗帜插在俄罗斯的土地上！除了人民的沙皇阿列克谢·尼古拉耶维奇·罗曼诺夫之外，将再无人可以号令这片广袤土地上的子民！\n\n当沙皇向全世界宣告解放时代来临的那一刻，全世界的目光都将汇聚到俄罗斯的身上。或许这些眼神中有包含热切的期待，或许有的充斥着深深的恐惧，但无论如何，俄罗斯人民将亲手改变这个几乎凝滞了三十年的旧世界！"
 MAR_Kosygin.92.t:0 "阿列克谢，全俄罗斯的沙皇"
 MAR_Kosygin.92.d:0 "今天，阿列克谢格外地激动。因为今天，将是他人生中最重要的一天，同时也是有史以来所有沙皇人生中最重要的一天——他的加冕礼。这一天，将成为他以柯西金之名走到人生尽头，以罗曼诺夫之名开启另一段崭新篇章的分水岭。他深知这一天的意义，并为此做了漫长的准备：撰写演讲稿，设想各种礼服款式以及考虑如何在自己的子民和外国使节面前展现出最好的精神面貌。现在，这一刻终于到来了。\n\n在众多人员的护卫下，阿列克谢·罗曼诺夫走上了红场——这片国家的心脏。周围部署了数量庞大的安保人员，附近的建筑物屋顶上也布满了狙击手。这些都是吉尔坚持安排的，对此，沙皇本人也并无异议，毕竟不久之前的那场惨剧仍让他心有余悸。终于，在来到典礼举行的地点后，新任沙皇庄严地接过了象征着皇权的标志——一件专门为这次加冕礼而量身定做的、精致而又昂贵的红色长袍穿在了他的身上，一顶为叶卡捷琳娜二世加冕礼而制作的、巧夺天工的皇冠被郑重地戴在了他的头上。待主礼牧师宣布仪式完成后，沙皇开始了他的演讲：\n\n“我的子民们！在我的领导下，我们一同经历了漫漫长夜中的水与火、血与火的考验，一同跨越了无数的艰难险阻，走到了今天！而在你们的鼎力支持下，俄罗斯母亲，在经历了三十年的分离与动荡之后，再一次团结一心！在此，在所有人的见证下，我向你们，向我亲爱的子民们，向俄罗斯母亲庄严宣誓！我发誓，在我的统治下，我们将众志成城，国家将会繁荣昌盛，无论面对怎样的敌人，无论遭遇怎样的灾难，我们都将战无不胜！而为了纪念这一天，这个无论对于我还是对于你们，甚至对于整个国家而言都无比伟大的日子，我宣布，未来三天全国放假！尽情地放松，尽情地欢庆吧！因为俄罗斯已经踏上了一条崭新的康庄大道，一条通往伟大复兴的光明之路！并且，我们已坚定地走在通往伟大复兴的光明之路上，任谁也无法使我们后退分毫！”\n\n人民以雷鸣般的掌声和欢呼声回应了沙皇的演讲，怀着无比崇敬的心情目送着他们的皇帝陛下走下演讲台。\n\n在被护送回到寝宫后，沙皇独自一人静静思考着今天所发生的一切。\n\n“我……我终于正式成为全俄罗斯的沙皇了。我带领着人民走过了漫漫长夜中充满绝望与挣扎的十年，最终迎来了崭新的黎明……我绝不能辜负人民的期望。看得出来，他们对我还算满意，我必须全力以赴，让俄罗斯彻底实现复兴。因为我……阿列克谢二世·柯西金-罗曼诺夫，是全俄罗斯的沙皇，只有我能完成这项伟业。”\n\n在完成内心独白后，坚定了他作为沙皇的决心和信念后，他开始思考起了未来。"
 MAR_Kosygin.92.a:0 "向陛下致敬！"
 MAR_Kosygin.93.t:0 "训练场风云"
 MAR_Kosygin.93.d:0 "整齐划一的脚步声以及士兵们沉重的呼吸声回荡在基地上空。他们是从人民的军队中，被瓦维洛夫、吉尔还有沙皇本人亲自层层选拔、脱颖而出的帝国精英，现在这些年轻力壮的小伙子们正在进行日常的军事训练。\n\n“再跑一圈，快点！你们这帮没用的废物！难道是沙皇陛下瞎了眼才把你们这些狗屎选进近卫军的？！拿出你们的骨气来，证明给沙皇看看，他的眼光没问题！”教官在跑道外对他们大声吼道。\n\n对于已身经百战的扎伊采夫来说——他经历了从第二次大动乱直到解放马加丹的几乎所有战役——即使是他也感到如此高强度的训练有些吃不消。首先是持续了将近两个小时的体能训练，然后是跑步、射击、格斗，以及简短的晚餐，之后继续训练。日复一日，他们的精力被一点点榨干。在一些高难度的训练中，总会有人不幸受伤，甚至是当场死亡，但这并没有阻止他们中的任何一人，所有人都心甘情愿地想要继续训练，以变得更强。毕竟所有人都和扎伊采夫想的一样，能以军人的身份尽忠职守地保卫祖国，就是作为军人的本分，同时也能以尽忠职守来向皇上报恩。就在这时，将军的声音打断了他的思绪。\n\n“好了，小伙子们！今天的训练就先到这里。都赶紧回宿舍，准备接下来的战斗演习！我倒要看看，在面对枪林弹雨时，你们还能不能像平时训练那样英勇无畏。我知道，你们中的大多数人都已经经历过了实战的考验，但不要忘了，我们今后将要面对的，是更为强大的敌人！这可不是一群匪帮能够相提并论的，所以都给我打起十二分的精神来！”教官大声喊道。这将是一次全新的特殊训练。\n\n听到指令，俄罗斯的精英战士们立即集合，在将军的带领下跑步前往训练场。当他们到达训练场地时，他们拿起了自己的装备，走进了模拟训练室。这是一场与大日耳曼国交战的战争模拟训练。他们的任务目标包括摧毁大约5辆敌方坦克，然后通过一条敌我双方都使用实弹（橡胶或彩弹）的交战区域，最后则是由扎伊采夫所领导的小组指挥整个演习的战术，模拟一次真实的战场。参与这次模拟的敌方部队则由从前线调来的一批真正的俄罗斯精锐士兵担任。这是一场困难重重的模拟，扎伊采夫深知这一点，但他并没有感到害怕，这只是他前进道路上又一次小小的试炼罢了。\n\n当演习开始的命令下达后，士兵们立刻冲锋陷阵。在奔跑的过程中，许多士兵向敌方坦克投掷了反坦克手榴弹，希望能幸运地击毁这些移动堡垒。虽然有些人失手了，但仍有一部分人极其幸运，手雷击中了油箱，使那些钢铁巨兽燃起了熊熊大火。而我们的主人公，扎伊采夫则成功潜入了一辆坦克的内部，三下五除二地解决了“车组成员”，并夺取了这辆坦克的控制权。现在，士兵们需要通过满是敌人且遍布着“实弹”的区域，扎伊采夫只能祝他们好运了。紧接着演习来到了下一阶段。在这第二阶段的考验中，一名士兵从高处跌落，橡胶或彩弹击中了他受伤的腿，剧烈的疼痛使得他最终丧失行动能力，从而“阵亡”了。幸运的是，包括扎伊采夫在内，剩下的小伙子都成功地通过了考验。\n\n在这之后，激动人心同时也是最为艰巨的挑战终于到来了——指挥一场实战模拟。扎伊采夫接过了本次的指挥权。他在短短几秒内就制定出了一套行之有效的战术，并向他的“下属”下达了命令。“士兵们，执行命令！”这位临时上任的军官喊道。接到命令，士兵们开始认真地执行长官的命令。\n\n在战场上，两支部队成功地牵制住了敌军的主力，精锐士兵们落入了圈套之中。在几次成功的佯攻和投掷假手榴弹的迷惑行动后，扎伊采夫的小组成功地完成了对敌军的合围，顺利占领了高地。\n\n将军对士兵们的表现赞赏有加，然后又继续训练了一个小时。最终，士兵们得以休息并前去享用他们的晚餐，并回到了他们自己的宿舍中。"
 MAR_Kosygin.93.a:0 "明天的训练仍会像今天这般艰苦卓绝…"
 MAR_Kosygin.94.t:0 "航运业的复兴"
 MAR_Kosygin.94.d:0 "安德烈，一名早在布哈林时期便已在船上工作的老水手，如今正准备去参加一场面试。他穿上了那身尘封已久的水手制服，在镜子前仔细端详了一番，露出了满意的笑容，转身走出了家门。“我都多久没穿过这身衣服了”，安德烈一边走一边心想。\n\n走在街上，他注意到许多人都对最近发生的事情感到不满。一些人抱怨说，港口附近现在变得比过去要嘈杂得多，那些不知疲倦、昼夜不休的船只引擎所发出的轰鸣声严重影响了他们的正常生活。另一些人则满怀恐惧地回忆起了马特科夫斯基统治时期，马加丹作为臭名昭著的“远东特别行政区”首府时的一幕幕人间惨剧。出于这种恐惧，这些人甚至拒绝相信现在正在发生的一切，他们生怕港口的再度繁荣会将马加丹变回“远东特别行政区”，尽管这样的事情早已永远不可能再度发生。还有一些人则对此喜闻乐见，安德烈就是其中的一员。许多年轻人渴望着在那些远洋巨轮上谋得一份好差事，他们认为这是一个难得的、让自己的人生彻底改变命运的机会，或者是野心勃勃的商人们希望能借此机会在海上贸易中大赚一笔，还有一些人则将马加丹航运业的复苏单纯地看作是远东明珠复兴的第一步。一些上了年纪的老人则感慨万千，作为前苏联海军曾经的一员，马加丹港口的再次兴盛使他们仿佛又看到了当年那支强大红海军的影子。在那个时代，马加丹也还只是远东共和国的临时首府。在那个令许多人神往的时代，他们的城市拥有何等崇高的地位啊。\n\n在去往面试地点的路上，安德烈顺道去了一家新开的港口商店，在那儿买了一瓶水，并同自己的老朋友打了个招呼。在路上，他还发现新开了许多的店铺。许多商家都想趁此机会在那些来往于马加丹的船员身上大赚一笔。顺便一提，在几周前，马加丹就和堪察加半岛一道成为了俄罗斯海军新的锚地和母港。\n\n在临近面试地点的路上，他还看到了一座崭新的地标建筑——一座纪念在战争中英勇牺牲的太平洋舰队海军战士的纪念碑。这些可敬的水手在苏联红海军解散后，自愿选择组成舰队与侵占了苏联远东领土的日本人进行了艰苦卓绝的战斗。虽然最后不幸失败，但他们仍是当之无愧的民族英雄。\n\n终于，在到达新的水手招募中心后，安德烈开口说道：“您好，我是…”"
 MAR_Kosygin.94.a:0 "我们将彻底夺回那些曾经属于我们的海上霸权！"
 MAR_Kosygin.95.t:0 "海岸风云"
 MAR_Kosygin.95.d:0 "阿列克谢终于抵达了美国西海岸。但老实说，他并没有像许多人那样对这个国家赞赏有加、顶礼膜拜。不过他终究还是踏上了这片土地，为了巩固两国之间的联系，并寻求美国支持他接下来的行动——重夺那些沦陷的故土。\n\n前来迎接柯西金-罗曼诺夫的是美国国务卿，威廉·罗杰斯。令沙皇颇感意外的是，罗杰斯竟然是一位十分热情好客的主人，两人之间会晤的氛围也是轻松融洽，这倒是与他平日里的古板、严肃截然不同。在会谈开始前，热情的国务卿甚至坚持要尽一番地主之谊，亲自为远道而来的俄国贵客做向导，带领他们遍览西海岸加利福尼亚州的旖旎风光。而我们尊贵的沙皇陛下，阿列克谢二世，也得以借此良机尽情欣赏这西海岸的美好风光。\n\n一行人首先来到了那举世闻名的金门大桥，望着这人类工程史上的奇观，沙皇终于按耐不住想要与其谈论一些重要议题的急切心情，然而罗杰斯又一次打断了他，这位国务卿想尽可能为俄美两国领导人之间创造出更多友好而轻松的氛围。慢慢地，这一番苦心也起到了应有的效果。\n\n在加州的旅行途中，他们还顺道游览了旧金山和洛杉矶。最终沙皇甚至还亲自前往了好莱坞，在那里观摩了一部名为《美国风情画》的电影的制作过程。在那里，他得以同该片的导演——乔治·卢卡斯进行了一番愉快的交谈。\n\n此次行程的最后一站，则是俄罗斯驻美国总领事馆。终于，沙皇和国务卿得以展开正式而严肃的会谈。而此前数日的游览也极大地拉近了两人的关系，会谈在友好融洽的气氛中进行。双方深入讨论了两国进一步加深合作的前景，以及各种投资的可能性。当然，最为关键的，还是关于协助俄罗斯收复故土的问题。谈到这儿，现场的气氛一下子变得严肃了起来。显然，罗杰斯并不希望进一步激化德国、日本与美国之间的关系。但经过沙皇的百般劝说后，罗杰斯最终还是同意了下来，双方签署了相关文件，美国将为俄罗斯收复故土提供必要支持，并承认俄罗斯对这些地区的主权主张。两国之间的贸易也将会进一步深化，双边关税将进一步降低。"
 MAR_Kosygin.95.a:0 "俄罗斯和美国——友谊天长地久！"
 MAR_Kosygin.96.t:0 "霓虹闪耀之圈"
 MAR_Kosygin.96.d:0 "无论阿列克谢有多么不情愿踏上这片土地，为了顾全大局，他也必须强迫自己接受这无奈的现实。请不要误解：诚然，日本是一个十分强大的盟友，在许多方面，尤其是经济和技术方面都位居世界前列。但不要忘了，正是这个国家，成为了沙皇祖国分崩离析的帮凶。正是这个国家，一直在压迫和奴役着他的同胞，他的人民。不行！现在还不是意气用事的时候，实用主义才是当下的最佳选择。更何况，此次出访日本的目标就是加强两国关系、深化双边贸易以及磋商收复阿穆尔地区的事宜。\n\n访问行程的第一项是沙皇与日本帝国外务大臣之间的会晤。令人颇感意外的是，日本外相展现出了非同一般的热情，当然也有可能是出于礼貌，亦或者是试图展示些什么。在简单的欢迎仪式后，他们乘车前往俄驻日大使馆——那里将是他们正式展开磋商的地方。这里可是“共荣圈”的心脏——东京的中心区域。一路上，尽管沙皇竭力不表现出任何异样的情绪，生怕被这个超级大国的官员所察觉，从而给祖国带来负面影响，但东京那繁华的街道和秀美的景色依然给他留下了深刻的印象。望着窗外，他在心里扪心自问，俄罗斯有朝一日能达到这样的水平吗？他能够带领着俄罗斯走向繁荣富强，能够让她超过哪怕是一个像日本这样现在日薄西山的国家吗？\n\n终于，车队抵达了目的地，磋商也正式开始。一开始，一切都进行得十分顺利：各种贸易协定顺利签署，两国关系也变得更加紧密。然而，当沙皇提出关于阿穆尔地区的问题时，谈判的气氛骤然变得紧张了起来……最后，阿列克谢仅得到了日本外相模棱两可的答复，说会将他的建议和要求转达给天皇陛下。就这样，本次会晤也随之草草结束。"
 MAR_Kosygin.96.a:0 "有时，实用主义也不失为一个正确的选择。"
 MAR_Kosygin.97.t:0 "沙皇的演讲"
 MAR_Kosygin.97.d:0 "一场举国瞩目的重大事件即将到来，谢尔盖对此期待已久。因为据他前几天买到的那份报纸报道，今天，此时此刻，沙皇陛下将要发表全国电视讲话！而且几乎可以确信消息绝无虚假，因为不仅报纸，几乎所有工友和自己的家人都在讨论着这件事。因此，谢尔盖招呼全家人一起围坐在电视机前，等候着沙皇的出现。而这，也是沙皇第一次在这被称之为电视的机器上抛头露面。对许多老人来说，能够亲眼见证当今圣上那举世无双的音容笑貌简直是一件不可思议的事情！而像谢尔盖这样年轻一些的人们则更加激动和好奇，他们之中的大多数甚至都从未见过这被吹得神乎其神的“现代奇迹”。\n\n就在这时，他的儿子刚想开口询问沙皇在哪儿，阿列克谢二世的身影便赫然出现在了电视屏幕的中央！而且，沙皇似乎正看着自己的臣民们……不，他正看着自己！沙皇正看着自己！这简直是不可思议！但沙皇的话语打断了他的浮想联翩：\n\n“我的同胞们，大家好！正如你们所知的那样，我们已经在几个月前重新团结在了一起，一个统一的国家又重新建立了起来！然而，我们仍有许多兄弟姐妹生活在他国的藩篱之下，备受压迫与欺凌！无论是大日耳曼国，还是日本帝国，抑或是其他的什么国家，那些身处异国他乡的统治者们无一不想抹杀我们的民族认同，摧毁我们的文化，践踏我们的精神！所以，我们必须对那些仍处于水深火热之中的同胞们伸出援手！\n\n昨天，我和青年俄罗斯联盟的同志们共同决定，我们将发起一场波澜壮阔的解放运动，将我们的神圣领土从德国人、罗马尼亚人、日本人还有那些数不清的侵略者的手中夺回来！兄弟姐妹们，我希望你们能够理解这其中的重大意义。为了捍卫我们自身和民族的尊严与自由，为了让和平的光芒重新普照俄罗斯的每一寸土地，我们必须再次拿起武器，披坚执锐！为了达成这一光荣的目标，我们需要每一个人的力量。现在，我以你们同胞的身份，而不是以你们的沙皇、你们的皇帝的身份，恳求所有人都尽自己的一份力量，保家卫国！有枪法准、身强体健的年轻人，我希望你们能够踊跃参军，让俄罗斯的敌人们见识一下我们民族的伟大力量！如果你觉得自己不适合上战场，那你们可以去工厂中发光发热，为我们的军队提供更多、更好、更先进的武器装备和其他各种物资！行动起来吧，同胞们！为了俄罗斯，我们必须做到这些！”"
 MAR_Kosygin.97.a:0 "为了沙皇和祖国！"
