 MAR_united_and_indivisible:0 "§Y统一且不可分割§!"
 MAR_allrussian_mladorossi_party:0 "全俄罗斯青年联盟"
 MAR_partisan_problem:0 "游击队问题"
 MAR_siberian_amnesty:0 "大赦天下"
 MAR_international_recognition:0 "国际认可"
 MAR_tour_of_russia:0 "巡视俄罗斯"
 MAR_allrussian_congress:0 "全俄罗斯苏维埃大会"
 MAR_united_and_indivisible_desc:0 "这一刻终于到来了。排除万难，跨越无数荆棘险阻，我们完成了这项不可能完成的伟业——统一了我们伟大的祖国，光荣的帝国旗帜在每一座城市高高飘扬。\n\n在我们面前，依旧任重而道远：西方的纳粹分子气焰嚣张，扬言要对我们进行“暴力绥靖”；东方的日本军国主义者仍然牢牢霸占着我们的固有领土；而西伯利亚的广袤土地上，人民起义的怒火正在熊熊燃烧。然而，这些都无法阻挡我们今天纵情庆祝，让伏特加的河流尽情流淌吧！"
 MAR_allrussian_mladorossi_party_desc:0 "我们青年俄罗斯联盟，肇始于别列兹尼基这座小城。想当年，我们不过是在前苏联版图上一个不起眼的小点，但时过境迁，我们不断发展壮大，最终掌控了整个西俄罗斯，随后是西西伯利亚。如今，在青年俄罗斯联盟的领导下，整个俄罗斯都从德国侵略者手中解放出来。我们必须顺应这一历史性的胜利，吸引来自西伯利亚和远东地区的狂热支持者，进一步巩固我们的政权。"
 MAR_partisan_problem_desc:0 "尽管俄罗斯土地上最后一个敌对政权已经垮台，但并非所有人都真心拥护我们的国家。在被征服的土地上，依然存在着抵抗青年俄罗斯联盟的星星之火。这些心怀不满的激进分子，如同附骨之疽般，广泛散布在各地。尽管人数相对较少，但他们仍然对我们的政权构成了一定的威胁。我们必须尽早将他们镇压下去，将这项任务交给国家安全部和吉尔去办。"
 MAR_siberian_amnesty_desc:0 "在俄罗斯解放区，曾经存在过许多国家和政权，有些与丧失人性的土匪无异，但也有一些拥有强大的国家机器。无论如何，这些国家都已经不复存在，取而代之的是“青年俄罗斯”的旗帜。尽管他们的政府已经消失，但关键人物依然存在，并且被关押在监狱里。如果就这样浪费掉这些人力资源，那就太可惜了，尤其是考虑到他们中的一些人已经表达了与我们合作的意愿。"
 MAR_international_recognition_desc:0 "为了进一步推进我们的宏图伟业，我们亟需争取国际社会的支持。团结协定和共荣圈的那些国家，注定是我们的心腹大患，与他们合作无异于与虎谋皮。但是，自由国家组织却对我们展现出了充分的善意，他们也愿意为我们对抗法西斯败类的斗争添砖加瓦。\n\n我们将循序渐进地发展这些友好关系，首先要做的，便是派遣我们的外交部长对自由国家组织成员国展开巡回访问，敦促他们承认我们作为俄罗斯帝国唯一合法继承人的地位。"
 MAR_tour_of_russia_desc:0 "纵观历史，君主制一直是我国至关重要的一个组成部分。我们伟大祖国的命运与历朝历代的沙皇和皇帝们紧密相连，而我们无意割断这种跨越时间的联结。恰恰相反，我们将向每一个平民百姓展现，他们的皇帝时刻关怀着他们每一个人。\n\n为此，别洛泽尔斯基将对新收复地区的各大主要城市进行巡访。在巡访过程中，沙皇将向这些新加入的公民们证明，他们绝不是什么二等公民，更不是可有可无的累赘，他们是我们这个大家庭中平等的一份子。"
 MAR_allrussian_congress_desc:0 "从阿尔汉格尔斯克到堪察加，我们的党如今已成为这片广袤土地上唯一的主宰，我们已成为俄罗斯唯一的合法政府。是时候召开一场真正意义上的、名副其实的全俄苏维埃大会了——在我们历经千辛万苦后。在这次大会上，我们将共同商讨国家未来发展的方向，以及我们在国际舞台上又该何去何从。"
 MAR_unifier_of_russia:0 "俄罗斯的统一者"
 MAR_siberian_amnesty_tt:0 "\n§Y一些西伯利亚军阀麾下的将军们将会加入我们的阵营§!"
 MAR_epilogue.4.t:0 "由蓝至蓝"
 MAR_epilogue.4.d:0 "阿列克谢·阿纳托利耶维奇是一个坚持自己信仰的人，这一点毋庸置疑。年轻时，他曾一度沉迷于激进的社会主义思想，甚至在布哈林执政时期还参加了一场环保抗议活动。当然，随着时间的推移，他头脑中那不切实际的幻想早已消磨殆尽。首先是那场惨烈的卫国战争，以及随之而来的惨败。作为罗科索夫斯基将军麾下的一名士兵，他最初奉命撤退到乌拉尔山脉以东，但在那里等待着他的却是卡加诺维奇的独裁统治。或许他心中的理想主义早已黯淡，但他绝不甘心向暴君俯首称臣。在一些好心人的帮助下，他最终成功地逃到了西伯利亚共和国。\n\n在那里，阿列克谢第一次尝到了自由的滋味。当地的选举、言论自由、出版自由——这一切对于一个曾经的普通苏联公民来说，都如同一股沁人心脾的清风。然而，好景不长。在西俄罗斯战争期间，亚戈达在背后捅了西伯利亚共和国一刀。最终，共和国的领土只剩下了托木斯克一隅之地。也就是在那时，阿列克谢下定决心奋起抗争，他加入了人文党沙龙。\n\n但这都已成为了过眼云烟，权力再次更迭，如今这位曾经的议员手中紧握着一张青年俄罗斯联盟的党证。当年那个意气风发的年轻革命者阿廖沙是否能够想到，未来的自己将会为一位俄国沙皇效力呢？恐怕他自己都无法想象。当然，阿列克谢可不是什么傻瓜，他很清楚，成立这些基层党组织的目的不过是为了“一致”支持沙皇和他的那些“英明”决策。但谁又知道呢？没准在不久的将来，这位曾经为了工人权利而奋斗的战士还能够再度大放异彩呢。"
 MAR_epilogue.4.a:0 "或许这一天就快来了。"
 MAR_epilogue.5.t:0 "崭新的制服"
 MAR_epilogue.5.d:0 "寂静无月的夜晚，远处城市中闪烁的零星灯火。这便是瓦西里·彼得罗维奇这十几年来早已习以为常的景象。他的父亲是一位白俄移民，作为一名自豪的哥萨克，他至死都不愿接受战败的结局。因此，当他一听说远东地区正在酝酿一场起义，他便立刻携家带口，投身到这场运动之中。然而，现实却是残酷的，起义军因为内部分歧而四分五裂，最终一事无成，而俄罗斯则彻底陷入了一片混乱。后来，瓦西里的父亲也在一次与罗扎耶夫斯基部队的冲突中战死沙场。目睹了这一切后，年轻的军官无论如何也不能放弃父亲为之奋斗的理想。\n\n时光荏苒，局势瞬息万变，这位军人也渐渐两鬓斑白。最终，他所效忠的势力也惨遭失败。\n\n就这样，建立一个白色俄罗斯的梦想第二次破灭了，而瓦西里也再一次成为了失败者。尽管俄罗斯如今已经实现了统一，但这种统一究竟是福是祸呢？将红白两种意识形态强行捏合在一起，与过往的历史达成和解——这难道就是父亲为之牺牲的那个理想国度吗？但从另一方面来说，这终究也不是一个由红色布尔什维克所统治的国家，如今带领他们浴血奋战的，终究还是一位沙皇啊…\n\n瓦西里感到，一场大战即将爆发，如果俄罗斯在这场战争中落败，那么或许就再也没有第二次机会了。这或许是一场与魔鬼的交易，一场与良知的较量，但在魔鬼和迷失的祖国之间，瓦西里永远会坚定地站在祖国这一边。他凝视着父亲留下的那把哥萨克骑兵刀，脸上露出了一丝欣慰的笑容。也许很快，他就有机会再度挥舞这把利刃，为了心中的理想国度而战了。"
 MAR_epilogue.5.a:0 "他做出了正确的选择。"
