 RUS_nuke_development_category_facelift_devdesc: "为了使[RUSNewGetUniqueName]在国际舞台上拥有举足轻重的地位，我们必须拥有属于自己的核武器计划。虽然我们不能指望一蹴而就，立刻拥有核武器，但未雨绸缪，我们必须为应对§R潜在的冲突§!而及早做好准备，尽早启动核武器研发计划。\n\n我们的进度：\n理论研究：[?TaS_nuke_development_array^1|1%]\n原料开采：[?TaS_nuke_development_array^2|1%]\n基础建设：[?TaS_nuke_development_array^3|1%]\n原料加工：[?TaS_nuke_development_array^4|1%]\n武器制造：[?TaS_nuke_development_array^5|1%]\n\n总体而言，[RUSNewGetNuclearProgramProcess]项目的进度每月增长[?TaS_nuke_dev_monthly_gain|1%]。"
 RUS_nuke_development_category_facelift_expansion_desc: "我们成功了！俄罗斯如今已跻身核大国之列。然而，拥有几枚核弹头仅仅是漫漫长路的开端。为了在§R潜在的冲突§!中给予敌人毁灭性的打击，我们必须扩充我们的核武库，并着力研发相应的运载工具。理想情况下，[RUSNewGetUniqueName]应当实现“三位一体”的核打击能力，以及全方位的核威慑。"
