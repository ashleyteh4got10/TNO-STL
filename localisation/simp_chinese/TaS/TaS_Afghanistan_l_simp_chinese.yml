 MAR_afgan_cw_category_desc: "我们在阿富汗的胜利给该国带来了极为惨痛的后果。惨败所引发的政治动荡先是演变成了一场政变，随后又升级为一场全面内战。阿富汗的合法政府已经向我们请求援助，以帮助他们镇压国内的叛乱分子。\n\n尽管努尔·穆罕默德·塔拉基此人行事反复无常，但他为寻求一切可能的援助所展现出的坚定决心仍然值得我们称道。所以，没错，他的确是个不折不扣的混蛋——但他终究还是“我们”的混蛋！"
