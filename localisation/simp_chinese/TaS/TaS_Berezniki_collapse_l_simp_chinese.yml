 MAR_Regent_council:0 "摄政委员会"
 POLITICS_REGENCY_DESC:0 "摄政委员会是沙皇谢尔盖·别洛泽尔斯基英年早逝后组建的一个组织。尽管局势正在慢慢失控，但委员会内部的激进叛乱和争论可能很快就会终结统一的俄罗斯。"
 POLITICS_SERGEY_BELOZERSKI_F_DESC:0 "近月来的辗转反侧已然重创了沙皇别洛泽尔斯基的身心，但这些还不足以将他推入如今这般凄惨的境地。数十万破碎的生命悬于他一念之间，如同全息卡片上的印记。那些他未能搭救的人，那些在他的愚人运动中丧生的人，那些他在登基道路上抛下的人…所有这些牺牲到头来竟是徒劳。他，就是扼杀了俄罗斯希望的刽子手。唯有肩负如此重担，酒瓶或绳索方成抉择。谢尔盖·谢尔盖耶维奇含羞选了酒瓶。正是这羞耻感在驱使着他无休止地酗酒，也正是这逃避苦涩的渴望令他一杯接一杯地豪饮。但虚无无可逃，唯余无尽轮回的愧疚。"
 POLITICS_RUTSKOJ_COLLAPSE_DESC:0 "绝望，妥协，最后是愤怒。\n\n当亚历山大·鲁茨科伊观看来自第二次卫国战争前线的报道时，正是这些感受充斥着他的内心。俄罗斯的小伙子们正因为“青年俄罗斯联盟”那帮饭桶指挥官的无能而惨死在炮火之下，而他，却不得不和草原上的蛮子们浪费时间。上一次他还是个孩子，但这一次他将亲手拯救俄罗斯。\n\n这一次，“疯子”萨尼亚不会再相信那些尸位素餐的官僚和毫无用处的贵族了。§R他要把国家掌握在自己手中，他要让俄罗斯变得比以往任何时候都更加强大。无论代价如何。"
 POLITICS_BEK_COLLAPSE_DESC:0 "倘若卡津别克早知道前路漫漫何等艰辛，也许他也就不会组织青年俄罗斯联盟了，而是继续潜心著书，书写宗教著作，怀念那已失去的俄罗斯家园。但他无法预知未来，为了坚持诚实，他也无从选择。而乡愁，也成了他内心永恒的伤痛。\n\n在背叛祖国，效忠沙皇弗拉基米尔的权力时，亚历山大已然抛弃了自我，注定了自己的命运。那是俄罗斯团结一致、日益强盛之际，他却遗忘了自身的功勋。但世事难料——通往地狱之路，往往是由善意的初衷铺就的。\n\n如今，这位青年俄罗斯联盟的领袖再次坐在别列兹尼基，萧瑟孤寂，心灰意冷，不知将走何路。他的心境日渐沉沦，希望也在逐渐消逝。然而此刻，他却像一位真正的君王一样孑然傲坐于剑椅之上，睥睨着这片血雨腥风的战场，统御着自己的灰烬王国。"
 POLITICS_BEYRLE_COLLAPSE_DESC:0 "约瑟夫·拜尔利的一生可谓是灾难连连和背叛不断。当胜利的曙光似乎近在咫尺时，命运却将这美梦击得粉碎，而后在西俄战争中，这一幕再度上演。当加入青年俄罗斯联盟时，拜尔利似乎找到了人生的归宿。他成为了沙皇别洛泽尔斯基最钟爱的将军，化身为粉碎欧洲巨人的尖矛……\n\n然而转瞬之间，这一切化为泡影。如今沙皇将军已然逝去，而他的爱将坚信，唯一的罪魁祸首正是叛国的青年俄罗斯联盟头目卡津别克。拜尔利不再在意俄罗斯的命运亦或必要的牺牲。他的目标是洗清战友的清名，为沙皇复仇，并让别洛泽尔斯基的后人统治俄罗斯…无论俄罗斯将变成何等模样。"
 POLITICS_GIL_COLLAPSE_DESC:0 "记忆如镜花水月，真相将永远湮没于历史的烟尘之中。仿佛吉尔自己也已开始遗忘那曾刻骨铭心的名姓，遗忘他为何立于此地。三十年前他背弃了祖国，选择了独自踽踽前行。周遭战火纷飞，局势翻覆无常。先是赤军铁骑，再是德意志铁蹄，继而红潮卷土重来，接踵而至的是沙皇弗拉基米尔的力量，最终是青年俄罗斯联盟的崛起。一次又一次，他曾以为自己已然掌控命运,最终将赢得这场胜利的果实。然而，每一次命运都用现实狠狠地嘲笑了他的天真。\n\n亦或许就在那时，第二次西俄战争中，当吉尔的指挥部遭到炮火无情的洗礼，弗拉基米尔的生命之火就已熄灭，他的意识在机枪的怒吼、战场上的嘶喊和无休止的炮击中逐渐消散、分崩离析。尽管如此，将军的躯壳仍在前行，不顾命运的无常，不顾世界的荒诞，也不顾所谓智慧的设计。\n\n而这一切，仍将在这条荆棘遍布的道路上继续下去，直到天荒地老。"
 POLITICS_JARUZELSKI_COLLAPSE_DESC:0 "波兰人永远不会成为俄罗斯人的盟友——雅鲁泽尔斯基从惨痛的经历中明白了一个道理。弗拉基米尔·吉尔掌管波兰军团后，几乎将他们全部葬送在了一场毫无意义的战斗中。阿尔汉格尔斯克？那个地方显然不值得他们付出如此惨痛的代价。所有人都心知肚明，这场战斗根本毫无胜算，吉尔肯定也知道。\n\n现在，雅鲁泽尔斯基身陷重围，哈萨克人、嗜血的俄国人，他们就像闻到血腥味的鬣狗一样，将波兰军团团团包围。但这一次，他绝不会再让悲剧重演，他绝不会将波兰拱手让人。\n\n新波兰仍在人间。"
