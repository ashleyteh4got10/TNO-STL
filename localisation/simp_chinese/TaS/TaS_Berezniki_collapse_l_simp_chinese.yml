 MAR_Kessler_Heinz:0 "海因茨·凯斯勒 "
 POLITICS_KESSLER_COLLAPSE_DESC:0 "在漫长的岁月里，海因茨·凯斯勒始终视自己为坚定的共产主义者，怀着敬畏之心凝望苏联这片红色的圣地。当纳粹的铁蹄踏上权力之巅时，他以冷漠与不屑回应。然而，在伟大的卫国战争中，他选择了背弃阵营，自愿向苏军投降，寄希望于那片他曾深信的土地。\n\n但战争的结局无情地碾碎了他的幻想。苏联在德意志战争机器的轰鸣中轰然倒塌，无数工人阶级的梦想随之化为齑粉。凯斯勒一度坚信的理想，在废墟中摇摇欲坠，信念的根基开始动摇。\n\n战后，他在哈萨克斯坦担任一名基层参谋。由于地理位置的限制，海因茨未能参加第一次西俄战争。但在俄罗斯统一后，他设法加入了俄罗斯帝国的武装部队，并一路高升，最终成为了一名高级军官。\n\n在第二次西俄战争期间，海因茨·凯斯勒领导着一支由德意志“合作者”和同意为俄罗斯而战的战俘所组成的军队。但他个人的成就与俄罗斯战败所带来的巨大灾难相比，简直不值一提。\n\n尽管他在战争中竭尽全力，但凯斯勒和他所指挥的部队仍然被当局指责为“蓄意破坏”。最终，这导致了德意志自由军的成立，他们占领了伏尔加河沿岸的一些地区，并彻底切断了与之前效忠的那个“中央”的一切联系。\n\n如今，海因茨·凯斯勒发现自己正身处这进退维谷的困境之中，被迫握紧那份他从未准备好承担的权力。"
 SAM_MAR_collapse_party:0 "德意志自由军团最高指挥部"
 SAM_MAR_collapse_party_long:0 "德意志自由军团最高指挥部"
 TaS_Post2WRW_SAM_no_way_home:0 "无路可退"
 TaS_Post2WRW_SAM_no_way_home_desc:0 "为了维护地区稳定而采取的孤注一掷的举动，最终却演变成了一场无法挽回的灾难。与魔鬼的交易，通常都是在极度绝望的情况下发生的，而这一次也不例外。德意志自由军团将他们的魔爪伸向了被占领土上社会生活的方方面面，将这个濒临崩溃的国家彻底撕成了碎片。如今，所有的退路都已被切断。孤立无援的德意志自由军只能在绝望中挣扎，试图抓住任何一线生机。他们现在唯一能做的，便是寄希望于远在柏林的那些大人物们能够注意到他们的存在，并向他们提供一些援助，哪怕只是一些微不足道的帮助也好。但此时此刻，他们只能在仇恨和蔑视的包围中孤军奋战。"
 TaS_Post2WRW_SAM_occupiers_in_locals_eyes:0 "在他们眼中的占领者"
 TaS_Post2WRW_SAM_occupiers_in_locals_eyes_desc:0 "无论我们的政府如何费尽心思地掩盖真相，试图让人们相信德意志自由军不仅仅是一个“德意志化”的组织，但民众的眼睛是雪亮的。他们能够清楚地看到、听到和感受到这些人的真实面目。飞扬跋扈，毫无原则，对柏林方面唯命是从——这就是普通民众对他们的看法。民众很清楚，那些胆敢自诩为他们命运主宰的人，与他们所试图塑造的形象大相径庭。无论这些人如何试图强加给民众其他的口号，人民的心声只有一个：“我们将竭尽全力，抵抗德意志占领者。”"
 SAM_MAR_collapse_reunified_DEF:0 "俄罗斯联邦共和国"
 SAM_MAR_collapse_reunified:0 "俄罗斯"
 POLITICS_GIL_COLLAPSE_1_DESC:0 "吉尔所走过的这条道路，对于他个人而言，既是一部跌宕起伏的史诗，也是一曲令人不寒而栗的悲歌。命运让他亲历了各种各样的重大历史事件，而这些经历也让他百感交集。\n\n弗拉基米尔·吉尔最初是以一位苏联红军中校的身份走进了历史的聚光灯下。在伟大的卫国战争期间，他不幸被俘，随后，为了活下去，他选择与大日耳曼国合作，成为了一支党卫军部队的指挥官。\n\n然而，他对大日耳曼国的效忠并没有持续太久。当西俄战争爆发后，他毅然倒戈，加入了西俄罗斯革命阵线。\n\n最终，俄罗斯在这场战争中落败，这促使弗拉基米尔·吉尔背叛了自己曾经的“战友”，转而投靠了青年俄罗斯联盟。随后，他积极参与了争夺前“阵线”领土的权力斗争，并在其中扮演了关键角色。\n\n出人意料的是，阿列克谢·柯西金以罗曼诺夫家族正统继承人的身份登上权力的宝座，即便如此，吉尔仍然成为了沙皇的左膀右臂，在许多事务上都坚定地支持着他。然而，令人扼腕的是，在第二次西俄战争中再次遭遇惨败后，弗拉基米尔不得不再次做出背叛的抉择。为了恢复这个支离破碎国家的秩序，他决定将权柄牢牢地掌握在自己手中。\n\n从现在起，弗拉基米尔·吉尔将独自承担起所有的责任——无论是他自己的所作所为，还是他人的所作所为，都将由他一人来承担。现在，他唯一的任务，便是竭尽全力地去扑灭那早已失去控制的混乱，并从这片由包括他自己在内的无数人亲手缔造的废墟中，拯救这个国家。"