 TaS_russian_re_reunification:0 "俄罗斯再统一?"
 TaS_Post2WRW_RUS_third_smuta:0 "第三次大动乱"
 TaS_Post2WRW_RUS_third_smuta_desc:0 "二十世纪，将作为俄罗斯灾难的世纪被永远铭记。无数血腥的革命、沙皇家族的覆灭、残酷的内战，以及一次又一次的惨败……我们为之付出了难以估量的代价。但无论如何，我们依然在前进，尽管每一步都愈发艰难——旧的伤口还未愈合，新的伤口却又不断出现。但我们绝不会放弃。我们的怒火，终将吞噬敌人。\n\n俄罗斯，再一次被打败，再一次支离破碎。青年俄罗斯党的理想，也和曾经的沙皇制度、马克思主义一样，最终走向了破产。但这一次，我们绝不会坐以待毙。也许，人们会把这称之为“内战”，或“第三次大动乱”，但我们终将实现祖国的统一。"
 TaS_Post2WRW_WSR_fourth_time_a_row:0 "失败的苦涩"
 TaS_Post2WRW_WSR_fourth_time_a_row_desc:0 "1918年，苏俄与德意志帝国签署了《布列斯特条约》，将大片西部领土拱手相让；20世纪40年代，布哈林领导下的苏维埃政权在第二次世界大战中惨败，莫斯科沦陷；20世纪50年代，尽管输掉了西俄战争，但“人民意志苏维埃共和国联盟”距离胜利，比以往任何时候都要接近。然而，他们付出巨大代价才取得的成果，却在第二次西俄战争中，随着俄罗斯人民王国的战败而化为泡影。德国人一次又一次地羞辱着我们，我们已经无法想象，未来，究竟会发生什么，也许根本就没有未来。"
 TaS_Post2WRW_SIB_japanese_paranoia:0 "日本的偏执"
 TaS_Post2WRW_SIB_japanese_paranoia_desc:0 "第二次世界大战期间，在苏联风雨飘摇之际，日本入侵并占领了我们的城市——符拉迪沃斯托克（海参崴）。他们扶持白俄残余势力和俄罗斯法西斯分子，妄图在整个远东地区建立傀儡政权。虽然“俄罗斯联邦”的叛徒们最终得到了应有的惩罚，但“满洲国”政府依然在俄罗斯的命运中扮演着重要的角色。他们在远东建立了病态的殖民政权，将当地居民驱赶到北方。勇敢的游击队员们与日本侵略者展开了英勇的斗争，并取得了辉煌的战果。\n\n在国家统一之后，俄罗斯人民王国重新点燃了反抗的火焰，将失去的领土收复了回来。但历史总是惊人的相似，当俄罗斯西部的边界再次动荡不安时，那贪婪的魔爪再一次伸向了远东。滨海边区再次沦陷，就连图瓦也未能幸免。俄罗斯依然虚弱不堪，这一次，谁又能阻止日本的扩张呢。"
 TaS_Post2WRW_IRK_red_light:0 "红色灯塔"
 TaS_Post2WRW_IRK_red_light_desc:0 "曾经因为马克思和列宁的思想而领导全世界的红色旗舰沉没了。从那时起，马克思主义的光芒在前苏联的碎片上逐渐消失，然后最可怕的修正主义发生了。孟什维克在“沙皇和苏维埃”的口号下统一了全国。就连十月党人也明白，这是对无产阶级专政梦想的亵渎，但人民却做出了相反的决定。大多数社会主义者站在孟什维克一边，从那时起，革命之火在俄国领土上熄灭了。直到最近……孟什维克让俄国失望了，现在很多人又把目光投向了共产主义。按照列宁和萨布林的教诲，我们点燃了布里亚特的叛乱之火，现在所有被压迫者都在贝加尔湖后面燃烧的革命火焰中看到了希望。"
 TaS_Post2WRW_MTR_march_north:0 "北部边区"
 TaS_Post2WRW_MTR_march_north_desc:0 "鲁茨科伊的士兵和将军们并没有寻求报复。被遗弃的士兵需要的只是正义。\n\n计划制定好了，行军准备好了，现在，祖国最忠诚的儿子们准备恢复被破坏的秩序。坦克和装甲车穿过沙漠冲向首都维亚特卡，然后继续向东行驶，越过乌拉尔山脉和贝加尔湖，一直到太平洋，直到最后一个叛徒被绞死，作为对其他人的警告。"
 TaS_Post2WRW_NPL_last_bastion:0 "最后的堡垒"
 TaS_Post2WRW_NPL_last_bastion_desc:0 "最后的堡垒。很难说，这个位于哈萨克沙漠草原上的小小的波兰国家究竟是如何出现的。也许可以用德国占领波兰，以及苏联境内的庞大的波兰族群来解释，或许，是那些在革命阵线崩溃前加入俄国的波兰将军们，为自己的同胞，争取了最后一片栖身之所？无论如何，对东欧的波兰人来说，这里是最后的避风港。后来，沙皇将军的出现，为他们带来了希望——一个回归故土的希望。波兰的指挥官和士兵，又一次加入了俄国人的队伍，与德国怪兽展开了殊死搏斗…\n\n…然后，再一次，迎来了失败。"
 TaS_Post2WRW_NOV_feet_of_clay:0 "泥足上的巨像"
 TaS_Post2WRW_NOV_feet_of_clay_desc:0 "在整个职业生涯中，拜尔利是最大的军事集团之一的指挥官，因此当他率领他们越过乌拉尔山脉时，他能够占领整个西伯利亚中部甚至更多地区。 然而，这也是拜尔利及其政权的主要弱点。 管理如此广袤的领土需要高度的组织和管理能力，而这正是巴耶里和他的团队所缺乏的。他的整个临时政府由背叛了卡津别克的军事指挥官和俄罗斯小官僚组成，但他们的人数仍然太少，无法有效管理这样的领土。\n\n因此，拜尔利的敌人不断成功地利用这一弱点，导致政权岌岌可危。"
 TaS_Post2WRW_MAG_other_side_of_ocean:0 "彼岸太平洋"
 TaS_Post2WRW_MAG_other_side_of_ocean_desc:0 "日里诺夫斯基控制着许多重要的港口，拥有通往全俄罗斯最强大的对外通信通道的通道。每天，悬挂着美国、加拿大、澳大利亚和太平洋地区其他自由国家旗帜的船只抵达堪察加和马加丹的港口。虽然日里诺夫斯基的政权目前是俄罗斯地区唯一一个被OFN和美国承认的政权，但他知道美国在该地区有自己的目标，他自己只不过是与敌人对抗的一个讨价还价的筹码。他甚至设法将他的共和国推向自由国家组织观察员国地位，只是为了遏制日本在该地区日益增长的影响力。"
 TaS_Post2WRW_OMS_mountain_king:0 "山麓之王"
 TaS_Post2WRW_OMS_mountain_king_desc:0 "吉尔是疯了，但这并不意味着他愚蠢。现在，他的军队占据了全俄国最有利的位置。乌拉尔山脉是通往俄罗斯西部、西伯利亚或哈萨克斯坦的必经之路。此外，几个具有重要战略意义的城市和工业中心位于该地区。考虑到在第二次西俄战争期间，为了躲避德国的轰炸，许多西方工业都撤离到了这里，更令人担忧的是，这样一个具有重要战略意义的地区，却落入了第三次大动乱中最疯狂的独裁者的手中。"
 TaS_Post2WRW_KOM_bandit_oprichina:0 "流氓匪帮"
 TaS_Post2WRW_KOM_bandit_oprichina_desc:0 "起初，瓦西里耶夫只是计划在农村地区煽动几起暴乱，借此来纠集一支农民武装。但事实证明，这些力量还远远不足以遏制维亚特卡的影响。然而，德米特里并没有就此放弃，他采取了更为激进的措施：他开始着手清查各个监狱和劳改营，从中吸纳了大量的曾经效忠于帝俄复兴协会的极端分子。那些曾为塔博里茨基冲锋陷阵的暴徒，如今成为了瓦西里耶夫的马前卒。他们残酷无情，散播的不是秩序与包容，而是恐惧和屈服。"
 TaS_Post2WRW_TAR_union_of_enemies:0 "敌人的联合"
 TaS_Post2WRW_TAR_union_of_enemies_desc:0 "在第二次大动乱时期，喀山和巴什科尔托斯坦之间的关系主要表现为互相劫掠和偶尔爆发的武装冲突。然而，在这一时期结束后，俄罗斯人民王国采取了一系列措施来调解这些民族之间的矛盾。而如今，沙皇帝国早已成为历史名词，俄罗斯再度陷入了第三次大动乱。德意志人的阴影已笼罩在喀山的头顶，而巴什科尔托斯坦仍然处于维亚特卡的魔爪之下。然而，德国人现在对付这头“俄罗斯巨熊”时采取了更加怀柔的策略。毕竟，有免费的武器和金钱不要白不要，况且乌法也需要自己去“解放”呢。"
 TaS_Post2WRW_YAK_earth_riches:0 "冰封的宝藏"
 TaS_Post2WRW_YAK_earth_riches_desc:0 "俄罗斯广袤的国土中，有相当一部分被永久冻土所覆盖。在经历了那场损失惨重的战争之后，这些冻土区占据了所剩领土的70%以上。然而，那些能够克服严酷气候条件的人，终将获得大自然所馈赠的丰厚奖赏——各种丰富的自然资源，尤其是价值连城的钻石。而正是由于钻石的高昂价值，以及尼古拉耶夫统治下该地区政府的孱弱无力，各路匪帮和逃兵也将目光聚集到了这片天寒地冻的极北之地。"
 TaS_Post2WRW_TYM_cornered_by_madmen:0 "困兽之斗"
 TaS_Post2WRW_TYM_cornered_by_madmen_desc:0 "秋明政权的建立，只是为了让人民摆脱那个疯子基里尔和那个狂人拜尔利的魔爪。州长普里马科夫并没有屈服于维亚特卡的淫威，他很清楚未来的走向。因此，他宣布在这片从原秋明州所剩下的土地上，建立一个崭新的民主国家。来自乌拉尔地区的难民潮，以及部分倒戈投诚的部队，都为这个新生的政权提供了一定力量，让他们得以同那些疯狂的将军们展开周旋。此外，来自托木斯克沙龙的政治避难者以及叶卡捷琳堡的自由派人士的加入，也使得普里马科夫政权在第三次大动乱的舞台上拥有了更多的话语权。"
 TaS_Post2WRW_PAV_steppe_riches:0 "草原的财富"
 TaS_Post2WRW_PAV_steppe_riches_desc:0 "沙皇的统治在哈萨克斯坦的历史上留下了浓墨重彩的一笔。在谢尔盖·别洛泽尔斯基的沙皇帝国控制哈萨克斯坦后，一项雄心勃勃的工业化计划便在这片广袤的草原上如火如荼地展开了。这一计划一直持续到沙皇帝国在第二次西俄罗斯战争中彻底覆灭。哈萨克斯坦的石油源源不断地输送到了俄罗斯西部，满载着各种矿产资源的列车隆隆驶过乌拉尔和西伯利亚，让各大厂矿企业得以火力全开。现在，这些财富再一次回到了人民的手中。然而，哈萨克斯坦仍然缺乏足够的工业设施，无法将所有这些资源都转化为武器和运输工具。因此，穆哈被迫将多余的资源出售给沃伊采赫和普里马科夫的政权。"
 TaS_Post2WRW_MAR_capital_of_broken_hopes:0 "失落之都的挽歌"
 TaS_Post2WRW_MAR_capital_of_broken_hopes_desc:0 "曾经盛极一时的俄罗斯人民王国如今已是日薄西山，被压缩到了俄罗斯西部的一隅之地苟延残喘，而那些数典忘祖的叛徒们仍在不断地蚕食着我们最后的领土。各种各样的民众骚乱和暴力事件都在用最残酷的方式摧残着这里。维亚特卡以及其他的各大城市都经常有成群结队的棕衫军巡逻队横行霸道，而他们的长官直接听命于卡津别克本人。看似他的统治已是危如累卵，但事实却远非如此简单。\n\n青年俄罗斯联盟的命运又轮回到了它诞生时的起点——一个被敌军环伺的小国，为了自己的独立自主而拼死抗争。如果我们曾经做到了，那么现在，我们依然有机会扭转乾坤…"
