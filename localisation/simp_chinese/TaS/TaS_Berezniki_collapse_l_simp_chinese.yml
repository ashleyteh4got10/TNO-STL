 TaS_RUS_shattered_ambitions: "野心破灭"
 TaS_RUS_shattered_ambitions_desc: "俄国人又一次尝试团结，又一次被外部势力击溃。一些军阀勉强控制住了自己的地盘，但他们的统治，不过是建立在一片废墟之上。想要恢复昔日的荣光，他们还需要几十年的时间。"
 MAR_Vitaliy_Mukha:0 "维塔利·穆哈"
 POLITICS_MUKHA_COLLAPSE_DESC:0 "经历了二十世纪的血雨腥风，维塔利·穆哈的存在，就如同一个来自另一个世界的人。他是叶利钦的笔友，在新西伯利亚那个怪胎般的官僚体系中过着平淡无奇的生活。随着政权的更迭，除了工作地点门上的牌匾和敲诈勒索者的AK型号发生了变化外，一切似乎都没有改变。然而，在他35岁的时候，他已经受够了这种生活。幸运的是，一项名为“草原开发”的计划适时地出现了——这是一项针对哈萨克斯坦官僚机构的俄罗斯化政策。生活依然悠闲，或许，也更加稳定了。他感觉自己不再是哈萨克斯坦官僚机器上的一颗微不足道的螺丝钉，但这稳定，真的稳定吗？\n\n俄国人在欧洲战场上的溃败，引发了一系列的连锁反应：大规模的起义、无休止的政治斗争、遍布全国的混乱……而当鲁茨科伊在南部建立的军政府开始蠢蠢欲动时，这一切才最终归于平静。讽刺的是，最终爬上权力顶峰的，竟是穆哈这个毫不起眼的小人物。摆在他面前的任务十分艰巨：他要保护哈萨克斯坦人民免受任何威胁，并将他所珍视的稳定，带回这片饱经苦难的土地。他会坚定地，清晰地，履行他的职责。"
 MAR_Evgeny_Primakov:0 "叶夫根尼·普里马科夫"
 POLITICS_PRIMAKOV_COLLAPSE_DESC:0 "叶夫根尼已经不记得自己生命中最后一次平静是什么时候了，也许是五年前，也许更早。但这已经不重要了。曾经的秋明州州长，如今已成为秋明共和国的首任总统。\n\n在这艰难的时刻，他向人民许下了庄严的誓言：他会保护他们，抵御来自西部的沙皇势力，抵御来自东部的疯狂军阀，以及，那个为了自保而屠杀了数十万人的恶魔。俄罗斯，也许已经无可救药，但秋明，依然还有希望。他会拯救秋明，然后，是整个乌拉尔。"
 MAR_Mintimer_Shaymiev:0 "明季梅尔·沙伊米耶夫"
 POLITICS_SHAYMIEV_COLLAPSE_DESC:0 "俄罗斯又一次自作自受，在愚蠢的决策中走向毁灭。她失去了一切——土地、人民、统一…经历了这场战争，俄罗斯的民族精神，似乎也已经被彻底摧毁了。\n\n沙伊米耶夫知道，是时候行动了。就在几个月前，他还是一个在西部前线浴血奋战的普通士兵，如今，他已成为伊德尔-乌拉尔共和国的首任总统，鞑靼和巴什基尔人民的救世主。但，现在还不到放松的时候，敌人的力量依然强大，而俄国人，即使在垂死挣扎之际，依然可能试图消灭伊德尔-乌拉尔。\n\n就让他们放马过来吧，这里有足够的空间埋葬他们。"
 MAR_Dmitry_Vasilyev:0 "德米特里·瓦西里耶夫"
 POLITICS_VASILYEV_COLLAPSE_DESC:0 "没人会觉得德米特里·瓦西里耶夫是什么了不起的人物。他安然度过了俄罗斯的混乱时代，甚至在青年俄罗斯党掌权之初，也曾积极拥护新政权。沙皇的回归，旧传统的复兴……似乎，俄罗斯即将再次崛起，向世界展示她的力量。然而，这一切都只是幻想罢了。\n\n德米特里早就预见到了这一天的到来。沙皇专制，这个俄罗斯民族的根深蒂固的顽疾，与那最终导致俄罗斯崩溃的无神论社会主义，根本无法相容！最终，青年俄罗斯党自食恶果，数万名士兵战死沙场，更多的人身负重伤，无人问津，他们为自己愚蠢的幻想付出了惨重的代价。俄罗斯，背弃了上帝，最终走向了毁灭，但也许，一切都还来得及。"
 MAR_Susanna_Pechuro:0 "苏珊娜·佩楚罗"
 POLITICS_PECHURO_COLLAPSE_DESC:0 "历史没有如果，现实唯存悲剧。苏珊娜也很高兴有时能进入幻想时间，逃避无处可逃的现实，让思绪飘入苏联没有输掉对德战争的世界里，一个苏联是最强大国家的世界里。可是，梦幻泡影空留一叹。\n\n回到现实，想到很多事情，布里亚特的废墟，俄罗斯的再次失败，一切都证明自己只是雄心勃勃军官团的附庸。而今的她只领着雇佣军。那又怎样？只要你能，你就得紧紧握住权柄。"
 MAR_Mikhail_Nikolayev:0 "米哈伊尔·尼古拉耶夫"
 POLITICS_NIKOLAYEV_COLLAPSE_DESC:0 "说实话，米哈伊尔从未想过自己会成为一国领袖。他渴望的，是平静而安稳的生活，但当战火再次席卷远东的时候，他无法置身事外。\n\n如今，他坐在这片冰天雪地之中——那些青年俄罗斯联盟的家伙，什么都没留下，除了成群的驯鹿、破败不堪的公社，以及一群来自东方的雇佣兵。真是造化弄人啊。"
 MAR_Vladimir_Zhirinovsky:0 "弗拉基米尔·日里诺夫斯基"
 POLITICS_ZHIRIK_COLLAPSE_DESC:0 "这个被中东人民称为“伊拉克豺狼”的人，在俄罗斯最黑暗的时刻回到了祖国。满怀热情的他没有注意到自己离太阳太近，最终被烧成了灰烬。但如果弗拉基米尔·沃尔福维奇没有一个扭转局面的计划，那他就不是他自己了。\n\n日里诺夫斯基确实拥有一支强大的军队：雇佣兵、俄罗斯维和部队、以及那些在他危难时刻伸出援手的人——正如他不久前帮助他们一样。当然，最强大的盟友——山姆大叔的美元——也站在这位远东共和国领导人的身后。也许在平时，这不过是几张毫无价值的废纸，但在此刻，为了胜利，任何手段都是正当的。\n\n没有什么能打破一个爱国者坚强的意志，俄罗斯将重获自由！"
