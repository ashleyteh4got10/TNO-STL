 MAR_Viktor_Glushkov:0 "维克托·格卢什科夫"
 MAR_Collapse.1.t:0 "先王已逝，新王万岁！"
 MAR_Collapse.1.d:0 "最近几天，谁也没有再见过谢尔盖·谢尔盖耶维奇。他把自己锁在办公室里，隔三差五便会让人送来更多“维亚特卡”牌伏特加，但过去12个小时，一切都安静得出奇。警卫们不敢贸然进入，因为他们都清楚，此时此刻的沙皇陛下喜怒无常，随时可能毫无理由地枪杀任何人。战争的失败，对别洛泽尔斯基的精神造成了巨大的打击，也许，对所有俄罗斯人来说，都是如此。正义的审判、幸福而漫长的生活…这一切梦想，如今都化作泡影，就像那只从沙皇无力的手中滑落、摔得粉碎的伏特加酒杯一样。玻璃杯碎裂的声音，或许是谢尔盖·别洛泽尔斯基失去意识前听到的最后的声音…\n\n14个小时后，警卫们终于决定进入办公室，呈现在他们眼前的景象令人不寒而栗：房间里一片狼藉，到处都是酒瓶，有些酒瓶里的酒还没喝完，办公桌上尤其多。而在桌子中央，沙皇的身体瘫倒在酒瓶和碎玻璃之间。空气中弥漫着一股令人作呕的味道，警卫们壮着胆子试探了几声，却没有任何回应。他们不得不硬着头皮走上前，去探查沙皇的鼻息。没有呼吸。医生闻讯赶来，一番简短的检查过后，他面色凝重地宣布："
 MAR_Collapse.1.a:0 "“吾王已逝。”"
 MAR_Collapse.2.t:0 "混乱、惊愕"
 MAR_Collapse.2.d:0 "“同志们！我们今天怀着沉痛的心情聚在这里。我想，任何语言在此刻都显得苍白无力…我宣布，本次摄政委员会会议，现在开始！”然而，与其说这是一场会议，不如说是一场闹剧——所有人都在交头接耳，对他试图维持秩序的努力充耳不闻。安季平的咆哮声尤为刺耳，不，那更像是尖叫：“忏悔吧！趁现在还来得及，快忏悔吧！你们都将下地狱！听到没有，你们都将下地狱！”\n\n一位尚未陷入癫狂的大臣试图阻止这位情绪激动的牧师，却被他一把扯下胸前的十字架，狠狠地砸在额头上。显然，这位可怜的大臣从未经历过这种阵仗，当即两眼一翻，晕了过去。\n\n卡津别克觉得这一切都该结束了，他本想拔出手枪朝天花板来一枪，却发现放在桌上的配枪不翼而飞。\n\n环顾四周，眼前的一切简直是一场狂欢。只有一人，安静地坐在办公室角落里，脸上挂着诡异的笑容，对眼前发生的一切无动于衷。只见他慢条斯理地打开了属于亚历山大·利沃维奇的那把配枪。卡津别克刚想上前阻止，却为时已晚，一声枪响，混合着鲜血和脑浆的液体，溅满了墙壁……\n\n枪声惊动了守卫，他们冲进来制止了这场闹剧。卡津别克回到自己的办公室，脑海中一片空白——接下来，该怎么办。"
 MAR_Collapse.2.a:0 "一切都要完蛋了。"
 MAR_Collapse.3.t:0 "皇宫内的骚乱"
 MAR_Collapse.3.d:0 "从清晨的第一缕曙光，到夜幕降临，玛丽亚·罗曼诺娃的宅邸都笼罩在一片忙乱之中。\n\n仆人们手忙脚乱地收拾着大大小小的行李箱，他们的同伴则在院子里点燃成堆的文件，熊熊烈火映红了半边天空。这座曾经充满欢声笑语的宅邸的女主人，此刻正来回奔波，不放过任何一个细枝末节。再过三个小时，她就要离开了。也许，只有这样事无巨细地掌控着一切，才能让她暂时忘记对未来的恐惧。战争，就这样彻底地改变了他们的生活，尤其是战败，更像是一道无法愈合的伤疤，深深地刻在他们灵魂的最深处。就在不久之前，维亚特卡王朝的统治似乎还将永远地延续下去，而如今，他们却不得不背井离乡，远走他乡，只为能在那片陌生的土地上苟延残喘。\n\n过去的一周，玛丽亚几乎彻夜未眠，各种思绪在她脑海中翻腾。但现在，这一切都不重要了。直升机的轰鸣声越来越近，这意味着，这场噩梦终于结束了。"
 MAR_Collapse.3.a:0 "更好的救赎"
 MAR_Collapse.4.t:0 "首都一日"
 MAR_Collapse.4.d:0 "履带碾过石板路的声音越来越响，奥尔加紧紧地蜷缩在地下室的墙角，瑟瑟发抖。她曾经拥有过一家生意兴隆的糕点店，而现在，这里只剩下满地的垃圾，以及无尽的恐惧。一声巨响，玻璃碎片四处飞溅——一枚手榴弹在附近爆炸，将商店的橱窗炸得粉碎。奥尔加浑身一颤，她拼命地捂住嘴巴，才不至于哭出声来。昨天，这里还是首都最受欢迎的糖果店，如今，却已化为一片废墟。一辆步兵战车从她曾经摆放在橱窗里的蛋糕上碾过，五颜六色的奶油，如今已和着尘土，散落在肮脏的人行道上。\n\n突然，尖锐的广播声响起，几乎所有人都对这个声音了如指掌。\n\n“注意！停止无谓的抵抗！我们是国家合法政府，是国家安全的守护者！放下武器投降，我们保证不伤你们的性命！”亚历山大·卡津别克的声音在废墟中回荡着。\n\n奥尔加早已将这条广播词倒背如流。军队开进首都已经两天了，但对她来说，却像是过了一整年。\n\n十五分钟后，履带的轰鸣声渐渐远去。奥尔加鼓起勇气，走出了地下室。看着眼前这幅景象——她毕生的心血，父亲留给她的全部遗产，曾经的欢声笑语，如今都已化为泡影——奥尔加眼前一黑，无力地瘫倒在地，失声痛哭起来。"
 MAR_Collapse.4.a:0 "恐怖永无止境。"
 MAR_Collapse.5.t:0 "市中心的新秩序"
 MAR_Collapse.5.d:0 "市公安局大楼前聚集了一大群人。就在今晚，政府官员们匆匆忙忙地收拾行囊，向着未知的方向逃亡了。最“有进取心”的市民们——令人惊讶的是，他们都有犯罪前科——开始急不可耐地搬空那些原本属于高官显贵们的昂贵办公室。然而，还没等这些“幸运儿”带着他们“意外收获”的喜悦离开，另一群“同道中人”便堵在了门口，一场“分赃不均”的闹剧即将上演。\n\n不出二十分钟，原本还算有序的“搬运现场”，就演变成了一场群体斗殴。\n\n但普罗宁，这位退休的警察局局长，一位毕生致力于维护法律尊严的执法者，绝不允许事态就这样发展下去。\n\n他抓起自己的配枪，快步走向了停车场。一辆破旧的卡车映入眼帘，普罗宁抄起路边的一块砖头，砸碎了车窗玻璃，一番鼓捣之后，卡车伴着刺耳的轰鸣声，咆哮着冲向了市中心。\n\n距离人群还有大约五百米的时候，普罗宁跳下了车，将那块砖头卡在了油门上。八吨重的钢铁巨兽，以惊人的速度冲向了还没反应过来的乌合之众，然后，一头撞进了公安局的大门，将通往“宝库”的道路彻底封死。普罗宁缓缓地走到目瞪口呆的人群面前，人群的目光也齐刷刷地落在了他的身上。\n\n他缓缓地掏出一根香烟和一把手枪，点燃香烟，打开保险。"
 MAR_Collapse.5.a:0 "然后枪响了。"
 MAR_Collapse.6.t:0 "外交部惨剧"
 MAR_Collapse.6.d:0 "一辆国家安全部的汽车停在了外交部门前，一名军官快步走了进去。眼前的景象令他大吃一惊：墙上挂着的地图上布满了被涂改过的线条，接待处的桌子上堆满了文件，不远处的一间办公室里传来歇斯底里的尖叫声。几名外交部工作人员看到国家安全部的制服后，立刻惊慌失措地跑开了，但这名军官此刻正专注于更重要的事情。\n\n只见一位年轻人瘫坐在办公桌后面，正神经质地用铅笔在一张地图上勾勒着俄罗斯的新边界。\n“杰米切夫在哪儿？”军官厉声问道。\n“杰米切夫……他已经死了。我们昨天收到几封电报，我们在非洲和中东地区的盟友，那些我们为之抛头颅、洒热血的‘兄弟’，全都宣布与我们断交！也许是迫于团结协定的压力，也许是我们真的已经衰弱到，连苏丹这种小国都可以随意践踏了。彼得十年来的心血，就这样付诸东流。我们在突厥斯坦的代表团发来消息，他们正在遭受赤裸裸的威胁。更糟糕的是，沙皇陛下最近驾崩了，而我们刚刚又输掉了第三次德俄战争…”年轻人说到这里，痛苦地闭上了眼睛，“彼得他…承受不住了。”\n“该死！我要立即将此事汇报给摄政委员会。在那之前，你先告诉我，与自由国家组织的合作协议在哪里？”\n“恐怕，这比杰米切夫的死还要糟糕。沙皇陛下刚一过世，所有文件就不翼而飞了！我怀疑是有人监守自盗，但那家伙已经带着文件投奔阿勃维尔或是日本特高课了！等消息传到美国人耳朵里，国务院肯定不会再跟我们合作了！”\n“混蛋！为什么不早点通知我们？！”\n“我们通知了！是彼得部长亲自打的电话！但你们的人一直说他们在忙…”\n\n军官焦躁地坐在桌边，努力让自己冷静下来。突然，他注意到了桌上那张祖国的地图：西部的边界被人用铅笔重新勾勒了一遍，从阿尔汉格尔斯克到阿斯特拉罕，一条歪歪扭扭的线条，仿佛一道触目惊心的伤疤。整个远东地区，包括滨海边区、哈巴罗夫斯克、海参崴，以及伯力，都已被日本染指。乌拉尔山脉以东，则是一个触目惊心的问号。"
 MAR_Collapse.6.a:0 "俄罗斯已被彻底孤立了。"
 MAR_Collapse.7.t:0 "突厥斯坦巨蛇"
 MAR_Collapse.7.d:0 "一架直升机降落在塔什干郊外的军事基地，螺旋桨卷起的尘土遮天蔽日，令正午的阳光也黯然失色。机舱门打开，一个浑身尘土的男人走了下来，疲惫的神色难掩他眼中坚定的光芒。一群神色紧张的军官早已等候多时，他们迎上前去，目光齐刷刷地落在这个不速之客身上。\n\n“同志们，我给你们带来了好消息，”男人说着，高高举起右手，“很快，我们就会让那些维亚特卡的酒囊饭袋见识一下，什么才是真正的军队！我已经和从高加索撤离的那支部队达成了协议，只要我们能帮助他们从里海撤离，他们就加入我们，并肩作战，拯救俄罗斯！”\n\n话音刚落，人群中爆发出雷鸣般的欢呼声。所有人都已做好战斗准备，而鲁茨科伊，显然深谙如何才能激发他们的战斗热情。这时，一个士兵慌慌张张地跑了过来，打断了鲁茨科伊的讲话。\n\n“总督阁下！部队集结完毕，请您指示！我们已经从当地征募了第一批士兵，军官们正在对他们进行整编，目前一切顺利。我们所有的驻军都处于最佳状态，而且，由于他们没有参加在欧洲的战事，因此，我们相较于摄政委员会的军队拥有压倒性的优势！”\n\n“别高兴得太早了，副官。”鲁茨科伊打断了他的汇报，“别忘了，我们的行动必须迅速而果断。我们承担不起与昔日同袍兵戎相见的风险。”\n\n听到这话，几名军官悲伤地低下了头。\n\n“我们还有几天时间做准备，”鲁茨科伊扫视了一眼众人，语气坚定地说道，“祖国终将完成复仇，叛徒终将被绳之以法！我们士兵的牺牲，绝不会白费！”"
 MAR_Collapse.7.a:0 "巨蛇的目光投向了北方。"
 MTR_caspian:0 "里海军区"
 MTR_caspian_DEF:0 "里海军区"
 MTR_caspian_ADJ:0 "里海的"
 MAR_Collapse.8.t:0 "阿克莫林斯克的会面"
 MAR_Collapse.8.d:0 "巴甫洛达尔州州长维塔利·穆哈和波兰军团的指挥官沃伊切赫·雅鲁泽尔斯基，面对面坐在阿克莫拉市中心的州长官邸里。两人的脸上都写满了焦虑和不安。\n\n“维塔，听着，我现在没有多余的部队了。”沃伊切赫压低了声音，“波兰军团剩下的部队，都在边境上抵抗莫斯科人。奥拉，是最后一个自由的波兰城市了，我绝不会把它拱手让给德国人。”\n“我的处境和你一样糟糕！”维塔利愁眉苦脸地说，“我已经派了三个警卫连去维持首都的秩序，但摄政委员会三天两头就要求我增兵！他们疯了吗？！阿拉木图的市长最近提出要扩大自治权，你说，我该怎么回复他？！”\n“维塔，我知道我们现在都面临着困境，但当务之急是控制住首都的局势，而不是阿拉木图市长！”沃伊切赫加重了语气，“局势随时都可能彻底失控！”\n“我最近一直在想，”维塔利陷入了沉思，“我们还有必要继续与维亚特卡保持联系吗？他们已经把事情搞得一团糟了，还能更糟吗？但我担心，他们会做出比这更疯狂的事情…”\n\n突然，一个副官慌慌张张地冲了进来，打断了他们的谈话。“报告州长，我们在突厥斯坦方向遭到袭击！敌人已经攻占了克孜勒奥尔达，目前正朝阿拉木图方向推进！”\n\n维塔利顿时愣住了，而沃伊切赫则瞬间明白了是怎么回事。“那条疯狗，他真的动手了…”他喃喃自语道。\n“这其中一定有什么误会！快，给鲁茨科伊打电话！”\n“不，维塔利，”沃伊切赫一把抓住了他的手，急促地说道，“立刻召回你所有的将军，让他们马上返回各自的岗位！”"
 MAR_Collapse.8.a:0 "那条疯狗已经挣脱锁链了。"
 MAR_Collapse.9.t:0 "摄政王万岁…？"
 MAR_Collapse.9.d:0 "一辆装甲运兵车缓缓地驶过维亚特卡的中央大道，亚历山大·卡津别克端坐在车厢里。他今天没有穿往常那身一丝不苟的官服，而是换上了迷彩服，外面套着一件防弹背心。运兵车停下后，一名亲信指挥官钻进车厢，向他报告：\n\n“亚历山大，我们到皇宫了，下令进攻吧！”\n“开始行动！把他们像蟑螂一样碾碎！”卡津别克面无表情地下达了命令。\n\n接下来的一个小时，枪声、爆炸声，震耳欲聋。战斗结束后，军队没能守住皇宫，卡津别克穿过正门，迈步走进这座富丽堂皇的建筑。他上一次踏入这里，还是在苏联政府将他解职之前。令他意外的是，皇宫内部的装饰并没有想象中那么破败不堪。除了零星几具士兵的尸体和手榴弹爆炸后留下的焦黑痕迹外，几乎看不到其他战斗的痕迹，皇宫的陈设大多完好无损。\n\n入口处，谢尔盖·别洛泽斯基的巨幅画像依然俯视着每一个走进皇宫的人，他是俄罗斯人民帝国的第一位，或许也是最后一位沙皇。卡津别克不愿与画像中的目光对视，他快步走上台阶，径直来到会议厅。推开沉重的木门，他的脸上浮现出一丝冷笑：四名部长已被逮捕，还有四名不知所踪，估计是凶多吉少，或者早已逃离了维亚特卡，甚至是俄罗斯。\n\n“亚历山大，我们投降！我们投降，你听到没有！”委员会秘书声嘶力竭地喊道。\n“是你们，让我别无选择，先生们，”卡津别克打断了他，“现在，滚吧。”\n“放肆！明明是你，是你逼我们走上绝路的！”一名军官再也抑制不住心中的愤怒，他猛地站起身，指着卡津别克的鼻子咆哮道，“你难道不知道自己做了什么吗？你这是在自取灭亡！整个国家都已经危在旦夕，而你却在背后捅了它一刀！”\n“我知道我在做什么！摄政委员会，从现在开始正式解散！”面对军官的怒吼，卡津别克冷冷地回击道。\n\n就在这时，门外的大街上突然传来几声爆炸声，接着是密集的枪声。军官的脸上，露出一丝诡异的笑容。“干得漂亮，亚历山大。记住我说的话…”"
 MAR_Collapse.9.a:0 "那些毫无道理的仇恨，将会带来最可怕的后果。"
 MAR_Collapse.10.t:0 "两个老友"
 MAR_Collapse.10.d:0 "清晨，清新的空气中，两个年轻人正焦急地等待着喀山市中心证券交易所的开门，他们都穿着从土耳其定制的西装，举手投足间却掩盖不住那股暴发户的俗气。交易所门口早已挤满了和他们一样的投机者，每个人的脸上都写满了对金钱的渴望。\n\n“乔拉，我真是等不及了！还有四十分钟才开门，真是度日如年啊！”\n“是啊，这该死的太阳！要不，我们去隔壁街上的那家店里坐坐？你懂我的意思吧？”\n“大清早的就喝酒，不太好吧？”\n“怕什么，走吧走吧！”\n\n五分钟后，两人已经坐在酒吧里，一人手里端着一杯冰镇啤酒，谈笑风生。\n\n“我跟你说，炒股风险太大了！我有个朋友，在‘新西伯利亚泰坦’上投了不少钱。就是那家什么开发‘北方最大港口阿尔汉格尔斯克’的企业。结果呢？他们现在在哪儿？阿尔汉格尔斯克现在又在哪儿？我敢打赌，‘西伯利亚’也好不到哪里去！以后啊，可不能再相信那些西伯利亚佬了！”\n“得了吧，你也不想想，当初你买‘彼尔姆贸易产品’的股票时，他们可是炙手可热的香饽饽。结果呢，乌拉尔以西的工业区全都被搬空了，他们的股价自然也就一落千丈咯！”\n“去他的吧！现在交易所应该已经开门了！我赌一瓶白兰地，今天我的股票肯定比你的涨得快！”\n“来就来，谁怕谁！”\n\n两人紧紧地握了握手，叫来服务生，让他做个见证，然后便急匆匆地赶往证券交易所。然而，当他们来到交易所门口，看到一个男人失魂落魄地跑出来时，便隐隐约约觉得有些不对劲。走进交易大厅，眼前的景象让他们彻底傻了眼：拥挤的人群就像热锅上的蚂蚁一样，到处乱作一团，充斥着尖叫、怒吼，以及各种不堪入耳的谩骂，每个人都像疯了一样，电话铃声响个不停，仿佛世界末日来临了一般…乔拉掏出烟盒，点燃了一支香烟，猛吸了一口，然后缓缓地说道：“看来，我们之间的赌约，要取消了…”"
 MAR_Collapse.10.a:0 "“争端到此为止。”"
 MAR_Collapse.11.t:0 "祖国在召唤"
 MAR_Collapse.11.d:0 "巴格达机场上，骄阳似火，热浪滚滚。弗拉基米尔·沃尔福维奇戴着墨镜，正在指挥士兵们将装备搬上飞机。“快点！都小心点！别把东西碰坏了！”他扯着嗓子喊道。士兵们正在登上一辆从德国远征军军官手里缴获的“大众”军用吉普车——这是日里诺夫斯基最喜欢的战利品之一。\n\n突然，一支车队毫无征兆地驶入了机场，径直朝他们所在的跑道驶来。机场上的所有人都愣住了，士兵们纷纷端起步枪，手指紧张地搭在扳机上。等到车队靠近，人们才发现，来者是萨达姆·侯赛因和他的卫队。日里诺夫斯基连忙迎了上去，想要弄清事情的来龙去脉。\n\n“弗拉基米尔，你这是搞什么鬼？！你要去哪儿？”侯赛因用不太流利的俄语问道，语气中难掩愤怒。\n“首先，你好啊，我的朋友。其次，你也知道，俄罗斯现在正面临着一些困难……”日里诺夫斯基故作轻松地回答道，丝毫没有表现出一丝的担忧。\n“但你不能就这么一走了之！如果你抛弃我们，伊拉克就完了！”\n“萨达姆，我了解这里的人民，也了解你，巴格达将成为你所有敌人的坟墓！”\n伊拉克领导人被日里诺夫斯基那疯狂的自信给震住了，他张了张嘴，却不知道该说些什么。\n“可是…”\n“报告，飞机已经准备就绪，随时可以起飞！”一个士兵打断了侯赛因的话。\n“看来，我们没时间告别了。就这样吧，我的朋友，再见！伊拉克就交给你了！”说完，日里诺夫斯基头也不回地登上了飞机。\n\n在舱门关闭之前，他最后一次望向伊拉克的土地，缓缓地说道："
 MAR_Collapse.11.a:0 "祖国母亲在召唤。"
 MAR_Collapse.12.t:0 "克孜勒的陷落"
 MAR_Collapse.12.d:0 "图瓦州州长亚历山大·高尔察克，在行政大楼里焦头烂额地忙了一整天。午夜时分，他被一阵急促的敲门声惊醒，一名军官神色慌张地告诉他：满洲军队越过东部边界，摧毁了边防哨所，目前已经侵入图瓦境内！为了保护当地居民的安全，高尔察克紧急组织人手，将克孜勒和几个主要定居点的人员疏散到安全地带，然而，整整12个小时过去了，他依然没有等到任何支援。他绝望地向维亚特卡发去求救电报，得到的却只是一次又一次的推脱，他们只会说“援军马上就到”。傍晚时分，唯一一支还能组织起有效抵抗的军队，也失去了联系，电话那头，只有冰冷的忙音。到了第二天中午，一切都已尘埃落定，日本人支持的满洲军队开始涌入克孜勒，城内，由民兵和最后几支人民共和军士兵组成的抵抗力量，正做着最后的抵抗。大批印有旭日标志的飞机在城市上空盘旋，炮弹如雨点般倾泻而下，将那些还在负隅顽抗的士兵，连同他们的藏身之处，一起炸成碎片。远处，冲天的大火和滚滚浓烟，仿佛在无声地提醒着所有人：留给他们的时间，不多了……\n\n高尔察克绝望地瘫坐在椅子上，他已经不知道自己该做些什么了。他机械地拨打着一个又一个电话号码，却都石沉大海。突然，一阵巨大的轰鸣声从头顶传来，一架直升机正低空掠过行政大楼，高尔察克知道，这意味着什么。他深吸一口气，努力让自己保持镇定，但没过多久，一队全副武装的日本士兵便破门而入，将他团团包围。\n\n“你已经被包围了，俄国佬！图瓦现在属于大东亚共荣圈了！马上投降，我们可以饶你不死！”一个日本军官操着蹩脚的俄语说道。\n\n高尔察克顿时明白，自己该做什么了。\n\n“好吧，”他抬起头，看着面前的日本人，“图瓦…是你们的了。”\n\n日本军官显然对他的识时务感到很满意，他走上前，将一份文件扔到高尔察克面前。“签字吧！”\n\n就在这时，高尔察克突然暴起，从腰间拔出手枪，对准日本军官连开两枪。这一刻，他压抑已久的愤怒和绝望，化作了玉石俱焚的勇气。"
 MAR_Collapse.12.a:0 "俄罗斯人决不投降。"
 MAR_Collapse.13.t:0 "俄罗斯骑士"
 MAR_Collapse.13.d:0 "几艘悬挂着自由国家组织和俄罗斯国旗的油轮，缓缓驶入马加丹港。日里诺夫斯基站在船长室里，举着望远镜，眺望着这座港口城市。码头上，街道上，人山人海，成千上万的市民们自发地聚集在这里，热切地期盼着他们的到来。日里诺夫斯基放下望远镜，下令停船靠岸。\n\n士兵们全副武装，鱼贯走下舷梯，准备迎接一场恶战。然而，迎接他们的却是鲜花和欢呼。“欢迎回家！”震耳欲聋的口号声，响彻云霄。就连负责港口安全的马加丹警察，也露出了真心的笑容。和当地居民交谈后，日里诺夫斯基等人了解到，日本人趁着俄罗斯内乱，再次出兵占领了滨海边区，连同海参崴一起，并扶植罗扎耶夫斯基建立了傀儡政权。曾经的远东省首府海参崴，再次落入了日本人手中，而布拉戈维申斯克，则被日本人当作礼物，送给了罗扎耶夫斯基。危难之际，日里诺夫斯基和他的士兵们，就像是黑暗中的一道曙光，给绝望的人们带来了希望。\n\n当天晚上，马加丹市长在自己的官邸，为日里诺夫斯基等人举行了盛大的宴会，以表达对他们的欢迎。舟车劳顿之后，日里诺夫斯基终于可以放松一下了。他一边品尝着当地特产，一边和市长聊起了这段时间发生的事情。\n\n“萨达姆那个家伙，走的时候，居然一分钱也没给我，真是小气！”日里诺夫斯基笑着说道，“早知道这样，我临走前就该‘借’他点。”\n\n“弗拉基米尔·沃尔福维奇，一路辛苦了！”市长笑着问道，“这一路可不太平吧？”\n“还不错，”日里诺夫斯基喝了一口酒，“从巴格达到布里斯班，再到这儿，现在，我和我的士兵们，终于回家了。我听说，是美国人提前通知你们，让我们做好准备的？”\n“是的，”市长点了点头，压低了声音说，“我们都很清楚，日本人这次绝对不会满足于只占领滨海边区。所以，中央情报局的人，才会这么着急地寻找一个能震慑住日本人的俄罗斯强人，以阻止他们染指整个远东地区的野心。”\n“看来，他们这次，还真是找对人了，”日里诺夫斯基自豪地说道，脸上浮现出一丝狡黠的微笑。\n两人相视一笑，举起酒杯，一饮而尽。两人在一瓶烈酒的陪伴下，谈论着对未来的担忧和恐惧，但他们都明白，多年之后，马加丹，终于再次迎回了一位真正的领袖——弗拉基米尔·沃尔福维奇·日里诺夫斯基！"
 MAR_Collapse.13.a:0 "归来便是一切的希望。"
 MAR_Collapse.14.t:0 "枷锁之下的梦想"
 MAR_Collapse.14.d:0 "日里诺夫斯基抵达马加丹已经有一段时间了。他站在远东人民共和国首都的办公室窗前，望着窗外繁忙的街道，长长地叹了口气。昨天，他的国家获得了自由国家组织的观察员国席位，这意味着，来自东方的威胁——至少在目前，已经暂时消退了。但如果敌人再次发动进攻，这一次，又会有谁来拯救俄罗斯呢？\n\n他回到办公桌前，成堆的文件正等待着他的处理。来自世界各地的志愿者名单、自由国家组织提供的武器援助协议、美国的贷款协议，以及赤塔和阿穆尔的征兵计划……然而，尽管取得了这些成就，这位将军的心里，却依然笼罩着一层挥之不去的阴霾。人们将这段历史称为“第三次混乱时代”，如果不能尽快结束这场闹剧，那么，俄罗斯将不可避免地陷入另一场浩劫，而那，或许将是俄罗斯的最后一场浩劫……\n\n“伊拉克的豺狼”缓缓地摊开一张最新的俄罗斯地图：是时候决定了，该把哪些“祖国叛徒”送上绞刑架了？在西部，约瑟夫·拜尔利控制了整个西伯利亚，在莫斯科战役失败后，他带着残余部队逃到了那里，妄图卷土重来。毫无疑问，这家伙是一个巨大的威胁，必须尽快除掉。但在此之前，他必须先解决掉雅库特共和国和布里亚特共和国，这两个眼中钉。就在日里诺夫斯基盘算着，究竟该先拿谁开刀的时候，电话铃声突然响了起来。\n\n“您好，请问是弗拉基米尔·沃尔福维奇·日里诺夫斯基先生吗？这里是外交部，布里亚特共和国有您的电话，非常紧急。”\n\n“接进来吧。”日里诺夫斯基命令道，他的手指，轻轻地敲击着地图上贝加尔湖的位置。\n\n“您好，日里诺夫斯基先生，我是布里亚特共和国的总书记，苏珊娜·佩丘罗·所罗门诺芙娜。”电话那头传来一个女人的声音，“我们想和贵国签署一份互不侵犯条约，不知道您意下如何？”\n\n“苏珊娜，你知道的，天下没有免费的午餐，”日里诺夫斯基用铅笔在地图上做了个标记，淡淡地说道，“布里亚特，能为我们提供些什么呢？”"
 MAR_Collapse.14.a:0 "如今我双手洁净，但若我君临天下，它们必将染满鲜血。"
 MAR_Collapse.15.t:0 "真相早已被掩埋"
 MAR_Collapse.15.d:0 "一辆卡车在颠簸的土路上飞驰着，车厢里一片漆黑，两个男人被蒙住双眼，堵住嘴巴，惊恐地挤在一起，大气也不敢喘一下。旁边坐着几个戴着黑色面罩的士兵，他们一言不发，如同幽灵一般，注视着眼前这两个可怜虫。“米沙，他们要带我们去哪里？”其中一个人小声地问道。“我大概能猜到，但你肯定不会想知道答案的。”“闭嘴，该死的！”坐在米哈伊尔旁边的一个士兵一拳打在他的腹部，剧烈的疼痛令他几乎无法呼吸。\n\n这两个人都是托木斯克市杜马的议员，隶属于巴士底党沙龙。今天，他们在参加一个工作会议时被捕，然后被塞进了这辆卡车。\n\n卡车行驶了很久，平坦的公路变成了坑洼不平的土路，最后，甚至开进了一片荒无人烟的野地。卡车停了下来，士兵们将两个人从车上拖下来，粗暴地按在地上。\n\n“鲁斯兰·德米特里耶维奇·舒罗夫和米哈伊尔·安德烈耶维奇·法托夫，巴士底狱沙龙的，没错吧？”\n两个议员惊恐地点了点头。\n“是我们，你们是谁？为什么要抓我们到这里来？！”\n“这里，我说了算。”一个操着美式英语的男人说道，他的声音听起来有些耳熟，“你们最后一次和卡津别克联系，是什么时候？”\n“卡津别克？战争刚一结束，他就给我们打过电话，但他没说是什么事，只是想咨询一下托木斯克杜马对局势的看法。”米哈伊尔小心翼翼地回答道。\n“那么，你们应该知道，正是他害死了沙皇陛下！”\n\n“不！这不可能！也许是阿勃维尔，也许是日本特高课，甚至有可能是吉尔，但绝不可能是卡津别克！退一万步讲，也许沙皇陛下只是病逝了呢？他毕竟年纪也不小了…”\n“等等…我好像在哪里听到过这个声音…”鲁斯兰突然意识到了什么，但为时已晚。\n“我给你们最后十秒钟时间，说，你们和谋杀沙皇陛下的阴谋，究竟有什么关系？时间，不多了！”\n“听着，首都的混乱和沙皇的死，不过是战败带来的必然结果罢了，没有人…”\n一声枪响打断了米哈伊尔毫无意义的狡辩。\n\n“我记起来了，我在哪里听到过你的声音了……约瑟夫·拜尔利……”\n\n第二声枪响。"
 MAR_Collapse.15.a:0 "“你猜对了。”"
 MAR_Collapse.16.t:0 "乌拉尔的腥风血雨"
 MAR_Collapse.16.d:0 "自第二次西俄战争结束以来，乌拉尔的局势便一直动荡不安。吉尔当时认为，德国人不会满足于阿尔汉格尔斯克-阿斯特拉罕防线，因此，他派遣军队进入了乌拉尔地区，占领了兹拉托乌斯特、叶卡捷琳堡以及车里雅宾斯克等战略要地。但他没有想到，这次“战术撤退”，却给了卡津别克可乘之机。这个疯子，竟想趁着维亚特卡兵力空虚，建立一个“俄罗斯民族共和国”。如今，车里雅宾斯克和兹拉托乌斯特这两个工业中心，已被改造成了第二个“莫斯科”，无数工厂开足马力，为战争机器源源不断地输送着武器弹药。非俄罗斯族裔则被强行驱逐到沃尔库塔的劳改营，那些敢于反抗的人，最终都变成了冰冷的尸体。吉尔的疯狂，以及他对战争的无限渴望，已经吞噬了他最后一丝理智。当这台战争机器再次开动时，没有人知道，将会给俄罗斯带来怎样的灾难。想要收复失地，就必须打通前往维亚特卡的道路，而乌拉尔，便是唯一的突破口。吉尔的目光，最终落在了秋明共和国——一个由普里马科夫领导的新生民主政权。他拿起笔，在一份早已拟好的作战命令上签字画押，为秋明共和国的命运，写下了最后的注脚。他，要亲手摧毁乌拉尔最后的民主堡垒。"
 MAR_Collapse.16.a:0 "鲜血将染红乌拉尔的山川河流。"
 MAR_Collapse.17.t:0 "这就是你想要的吗，卡津别克先生？"
 MAR_Collapse.17.d:0 "自从政变成功以来，亚历山大·卡津别克便将自己囚禁在这座戒备森严的宫殿里，如同躲进巢穴的困兽一般，惶惶不可终日。这座象征着权力的宫殿，如今更像是一座牢笼，将他和外界彻底隔绝。厚重的钢筋水泥，冰冷的钢铁大门，都无法带给他丝毫的安全感。监控室里，无数个屏幕闪烁着，将维亚特卡空无一人的街道，以及皇宫周围的景象，实时地呈现在他眼前。\n摄政委员会已经被解散，但他们的影子却依然萦绕在他的脑海中挥之不去。卡津别克无法忘记那些错误，那些将俄罗斯拖入无尽深渊的错误。沙皇驾崩之后，那些新的军阀们，再次将这个国家撕成了碎片。但卡津别克并没有绝望，至少，俄罗斯的西部还掌握在他的手中，这便意味着，一切还有转机。只是，他们又回到了原点。\n突然，其中一个屏幕上的画面引起了卡津别克的注意：一辆装甲车驶到皇宫门口，车上下来几个人，卡津别克一眼便认出了他们：美国中央情报局的特工，身后跟着几个全副武装的保镖。他们大步流星地穿过皇宫，径直来到卡津别克的办公室。看着眼前这森严的戒备，特工的脸上没有流露出丝毫的惊讶，仿佛一切都在他的预料之中。\n\n“卡津别克先生，您已经听说了在梅津发生的事情了吗？”\n“没有，那里发生了什么？”\n“一伙身份不明的武装分子劫持了我们运送人道主义救援物资的船只，并在船上升起了俄罗斯帝国的旗帜。我们已经消灭了他们，并取回了货物，但有几名美国公民在冲突中丧生。”\n卡津别克竭力不去思考，这场不祥的对话究竟意味着什么。\n“听着，全国各地都潜伏着间谍和叛徒，也许这是德国人的阴谋呢？”他试图转移话题。\n“我们在莫斯科的线人告诉我们，德国人已经对你不感兴趣了。”特工冷冷地说道。\n“现在的俄罗斯百废待兴，我们需要时间！我们马上就会平定这些分裂势力！我们需要你们的武器援助，还有…”\n特工再次打断了他的话，“别再痴心妄想了，卡津别克先生，这是最后一次，我们不会再给你们任何机会。”\n卡津别克感到局势正在失去控制，特工已经转身，准备离开。“等等，你们不能抛弃我们！俄罗斯现在正处于生死存亡的关头，你们一直都在帮助我们！”\n“没错，但我们现在要放弃你了。我们在远东找到了一个更有希望，也更愿意合作的伙伴。”特工的话如同一记重锤，狠狠地击中了卡津别克的胸口。他终于明白了，自己已经彻底失败了。“这就是你想要的吗，卡津别克先生？”"
 MAR_Collapse.17.a:0 "最后的希望也破灭了吗？"
 MAR_Collapse.18.t:0 "纸牌屋"
 MAR_Collapse.18.d:0 "“首都新闻……晨间新闻……”\n\n“‘伪阿列克谢二世，他究竟是谁？’”……\n\n“‘背叛俄罗斯！伪沙皇将俄罗斯出卖给了德国人’”……沙皇一边翻看着报纸，一边大声读出上面骇人听闻的标题。\n\n“他一开始还面色如常，但随着他所读到的标题一个比一个耸人听闻，他脸上的平静也如薄冰般逐渐碎裂。”那位奉命送来最新一期报纸的秘书心想，他静静地站在一旁，等待着沙皇的下一步指示。\n\n终于，沙皇的目光从报纸上移开了，他死死地盯着面前的虚空，开始一下又一下地、机械地揉搓着手中的报纸。揉成一团后，他弯下腰，将手中的纸团扔进了办公桌旁的垃圾桶。\n\n他直起身子，双手在身前不断摩挲着，仿佛要将那些无形的污秽和尘土从手掌上清除干净一般。\n\n“这些报纸是多久以前开始出现的？又是些什么人在出版发行？”沙皇问道，语气中带着一丝竭力克制着的愤怒。\n\n“就在不久前，陛下，”秘书回答道，声音中带着一丝犹豫，“就在……我们……战败之后。”他补充道。\n\n“是那些……人在发行，”秘书继续吞吞吐吐地说道，尽管他极不情愿，但还是不得不说下去，“地下组织……”说完，秘书忍不住咳嗽了几声。\n\n沙皇将目光转向了秘书，那目光锐利如鹰隼，仿佛要将他生吞活剥一般。秘书的脸色瞬间变得苍白如纸，但仍然一动不动地站在原地。\n\n沙皇逼近了秘书，用近乎癫狂的语气低吼道：\n\n“你们，滚出去。”\n\n“遵命。”秘书回答道，随后便以最快的速度逃离了沙皇的办公室。\n\n独自一人站在房间里的沙皇并没有在原地停留太久，而是缓步走向了窗边。他向窗外望去，街道上，新一轮的示威游行正在爆发。一场随时都有可能演变为针对当局的大规模骚乱的示威游行。"
 MAR_Collapse.18.a:0 "一场新的混乱即将到来。"
 MAR_Collapse.19.t:0 "浮士德式的交易"
 MAR_Collapse.19.d:0 "首都的街道早已被汹涌的抗议人群所淹没，连日来，这样的景象早已屡见不鲜。\n\n“打倒伪沙皇！”一些人高呼着口号。\n\n“打倒君主制！”另一些人则挥舞着标语。\n\n“打倒赤色分子！”还有一些人则举着旗帜。\n\n内务部的警力早已捉襟见肘，根本无力控制住首都日益失控的局势。面对着如海啸般一波又一波涌来的抗议浪潮，为了避免事态进一步恶化，当局已经开始从其他地区紧急抽调执法部队来填补警力上的巨大缺口。\n\n“通讯员！接通总指挥部！”上校一边大声喊着，一边向通讯员所在的位置跑去。\n\n“遵命！”通讯员回应道，同时手忙脚乱地摆弄着通讯设备。\n\n“我是8号！总指挥部，请回答！完毕！”通讯员反复呼叫着，但却始终没有得到任何回应。与此同时，他们周围早已陷入一片混乱。\n\n数百名警察排成一道人墙，手持盾牌，试图阻挡愤怒的人群。然而，谁都无法否认，如今的骚乱已经演变成了一场彻头彻尾的暴乱，这早已不是普通民众们自发组织的集会游行了。抗议者们将所有能够找到的东西都朝警察们扔了过去，甚至连砖头都被他们从路面上撬了出来，砸向那些试图维持秩序的警察。但幸运的是，在这条莫斯科街道的广场上维持秩序的警察们要比他们的同事们“幸运”得多：据说，在城市的其他地区，甚至有人开始用燃烧瓶和枪支来袭击警察。\n\n“总指挥部已上线，长官！”由于周围环境过于嘈杂，通讯员只能用尽全身的力气高喊着，这样才能勉强盖过那些嘈杂的声音。\n\n上校一把抓过形如电话听筒的无线电，紧紧地贴在耳朵上。\n\n“总指挥部！这里是8号，请求指示！在东南方向的广场上，我们发现了一些可疑的煽动者，他们似乎是这场骚乱的组织者！他们所说的话与塔博里茨基分子的论调极为相似！”就在他汇报情况时，一阵玻璃碎裂的脆响以及痛苦的哀嚎声突然从上校的身后传来。他猛地转过身，发现抗议者们已经开始向警察投掷燃烧瓶。"
 MAR_Collapse.19.a:0 "“该死的！”"
 MAR_Collapse.20.t:0 "浮士德式的交易"
 MAR_Collapse.20.d:0 "基里尔同志一边穿过走廊，一边走向沙皇的办公室，同时，他还在不断地思索着最近发生的以及正在发生的这些事情。\n\n“我们在与德国人的战争中输得一败涂地。随之而来的便是一连串的危机：抗议、罢工，在某些地区，局势甚至危险到了一触即发的地步，只差一点便会爆发武装叛乱。”基里尔暗自思忖着。\n\n“而沙皇呢？政府呢？政府。这帮尸位素餐的废物们早已乱作一团，束手无策。而柯西金，他本应该像一位真正的领袖那样挺身而出，向人民发表讲话，驳斥那些不负责任的谣言，避免任何可能发生的革命。然而，他却像一只鸵鸟般将自己的脑袋埋进了沙子里，躲在自己的官邸里不敢出来！甚至连办公室的大门都紧锁着，简直就是自欺欺人！”弗拉基米尔感到一阵怒火中烧，甚至连他那凶狠的表情都出现在了脸上。\n\n“内务部、克格勃和内卫部队目前还能勉强控制住局势，但随着时间的推移，我们所付出的代价将会越来越高，民众也会对我们越来越不满。没关系，今天就将是这一切的转折点。”基里尔停在了办公室的门前，自言自语道。\n\n走进房间后，基里尔发现阿列克谢二世正坐在他的办公桌前。"
 MAR_Collapse.20.a:0 "“基里尔同志，我正有要事相商。”"
 MAR_collapse_kosygin_japan_tt:0 "§R我们必须让日本方面回想起两国之间曾经立下的那些约定。§!"
 MAR_Collapse.20.b:0 "“陛下，我有要事禀报。”"
 MAR_collapse_kosygin_mgb_tt:0 "§R是时候结束这场旷日持久的沙皇闹剧了§!"
 MAR_Collapse.21.t:0 "提到魔鬼"
 MAR_Collapse.21.d:0 "一项请求已发出，对方已应允。很快，日本帝国的代表就将抵达此处，与沙皇进行会晤，并签署所有必要的文件，以便“协助”平定国内的动乱。\n\n吉尔一边翻看着手表，一边在心中默默地倒数着时间。再过几分钟，日本代表团的车队就将抵达。整个大厅里挤满了外交人员，他们三五成群地聚在一起，热烈地讨论着各自关心的问题。\n\n回想起自己出使日本的种种经历，包括那些没完没了的会谈、协议的签署以及各种各样的仪式，吉尔的心情变得愈发沉重。\n\n“吉尔同志。”一个声音从他的左肩方向传来。\n\n吉尔转过头，发现沙皇不知何时已经站在了他的身旁。\n\n“陛下，请恕我直言，我认为现在取消这一切还为时不晚。或许，我们还能依靠自己的力量来解决问题？”吉尔试探着问道。\n\n就在这时，一名助手走到沙皇身旁，告知他，天皇的代表即将步入大厅。\n\n“谢谢，你可以下去了。”沙皇对助手说道。\n\n“恐怕，在失去了外部援助的情况下，我们的国家将会分崩离析，最终彻底灭亡。如果我们不能与日本人达成协议，那么无论如何，我们最终都将被他们彻底控制。”沙皇看着吉尔回答道。\n\n通往大厅的大门缓缓开启，代表的身影出现在了众人的视野之中。\n\n“唉……听天由命吧。”吉尔简短地回答道。\n\n会谈出乎意料地简短，所有的形式都已完成，文件也已签署。"
 MAR_Collapse.21.a:0 "…它如约而至。"
 MAR_Collapse.22.t:0 "浮士德式的交易"
 MAR_Collapse.22.d:0 "一支香烟夹在这位刚刚结束了与俄国同僚会谈的日本军官的两指之间，火星在烟草的燃烧中微微闪烁。\n\n望着阴沉的天空，山川惣次郎深深地吸了一口，往事如潮水般涌上心头，让他想起了另一次类似的“友好会谈”。那同样是一个阴云密布的天气，同样的伤痛，同样在临时搭建的简陋病床上辗转反侧，同样与一位中国军官就着类似的、刻不容缓的镇压抗议问题展开的讨论。\n\n当年，他们的部队也被派往当地，“协助”关东政府维护当地秩序，抗议活动很快就被以强硬而血腥的手段镇压了下去。但这一次，他手中可调动的兵力，足以镇压整个国家的一切反抗。\n\n惣次郎向自己保证，这次任务结束后，他会退伍，然后回到日本，在他长大的地方。在那里，他不用再为了任务与责任而头疼，那里再没有了硝烟弥漫与无休止的战乱，远离这一切...\n\n但在那之前他必须完成自己的使命与责任。将口中最后一口青烟吐出，熄灭掉手中已经燃尽的香烟后，军官便去着手解决他缺席时堆积如山的那些待处理事项了。"
 MAR_Collapse.22.a:0 "无论在哪勤务都是一样的。"
 MAR_Collapse.23.t:0 "以鲜血换秩序"
 MAR_Collapse.23.d:0 "谢苗将空弹匣从枪中取出，扔到一边，然后熟练地从弹药袋中取出一个装满子弹的新弹匣，安装到自己的AK步枪上，拉动枪栓，将子弹推入膛内。谢苗点燃了第二根香烟，一边抽着，一边仔细聆听着远处传来的、隐隐约约的枪炮声和厮杀声。\n\n谢苗做梦也没有想到，自己竟然会有一天手持武器，与曾经的战友兵戎相见。为了反对以克格勃特工为首的、柯西金的“走狗”们，也为了反抗那些从日本远道而来的侵略者，他和自己的同胞们不得不走上战场，浴血奋战。\n\n就在昨天，他还只是一个普通的工人，与自己的工友们一起走上街头，抗议沙皇的专制统治。但他万万没有想到，那些从克格勃中“脱胎换骨”而来的日本走狗们居然会向手无寸铁的抗议者们开火。然而，出乎所有人意料的是，在场的武装起义者们立刻向着这些刽子手们发起了反击。\n\n直到现在，谢苗也没搞清楚，在这场突如其来的剧变中，自己怎么就稀里糊涂地加入了起义军的队伍。不过，这些都不重要了。重要的是，如今他要为他所热爱的这座城市，为了那些惨死在广场上的朋友们，以及那些同样幸存下来，和他并肩作战的同志们而战！既然他无法接受这残酷的现实，那就只剩下最后一条路可走了——抗争到底。\n\n谢苗将手中的烟头吐到地上，用脚狠狠地碾灭，然后戴上头盔。紧接着，起义军指挥官便下达了冲锋的命令，士兵们跟随着长官，向着敌人发起了最后的冲锋。"
 MAR_Collapse.23.a:0 "向死而生。"
 MAR_Collapse.24.t:0 "代价"
 MAR_Collapse.24.d:0 "走出会议室后，作为翻译的米哈伊尔成为了第一批知晓这些重要的国际条约细节的人。但在今天，这并不是一场普通的外交谈判，而更像是一份精心包装过的最后通牒。\n\n日本政府向俄国当局提出了一项建议，实则近乎于最后通牒：要求俄方将军队从中亚地区撤出。他们冠冕堂皇的借口是：中亚各民族有权决定自己的命运，这也与日本所倡导的“大东亚共荣圈”理论不谋而合。\n\n在这一要求被提出后，沙皇随即提议休会。日方代表欣然同意了这一提议，并在休息期间纸醉金迷，纵情享乐。实际上，这些日本“维和部队”早已开进了俄罗斯境内，而俄罗斯的政府在政治和经济上都已经彻底沦为了“旭日帝国”的附庸。俄罗斯代表团退到另一间会议室展开讨论。\n\n米哈伊尔坐在走廊上一张由暹罗木制成的舒适沙发上，思索了片刻。他从公文包中取出了一本书，翻到做过标记的那一页，继续阅读起来。米哈伊尔心里很清楚，自己对这一切都无能为力。而如今的俄国政府甚至根本无法拒绝日方的无理要求。\n\n他只能默默等待着，等待政府最终彻底向日本的淫威屈服的那一刻。"
 MAR_Collapse.24.a:0 "下一页"
 MAR_collapse_kosygin_asia_tt:0 "§R除了卑躬屈膝，我们别无选择。§!"
 MAR_Collapse.25.t:0 "终章"
 MAR_Collapse.25.d:0 "几个小时过去了，阿列克谢·柯西金-罗曼诺夫仍然一动不动地坐在自己的办公桌前，桌面上杂乱无章地散落着成百上千份文件。这些都是他过去二十年呕心沥血的见证——那些报告，那些总结，都静静地躺在那里。这些文件中，有他成功的喜悦，也有他遭遇挫折时的沮丧。当然，其中最触目惊心的，还是那场最终的、毁灭性的溃败。\n\n连日来，沙皇一直试图理清头绪，弄明白究竟是哪个环节出了问题，他不断地回忆着那些在卡津别克领导下工作的峥嵘岁月。究竟是什么让他鬼迷心窍，走上了这条自取灭亡的“帝王”之路？如果不是他一时糊涂，亚历山大·利沃维奇或许就不会死。然而，柯西金很清楚这一切的答案。\n\n终于，他强迫自己从恍惚中清醒过来。他走到窗前，一把推开了窗户，凝视着维亚特卡的街道。他曾经梦想着让人民获得幸福，让他们掌握自己的命运。他曾经天真地以为，每一个人都可以成为自己的“沙皇”。而最终的结果，却是南辕北辙。在俄罗斯，没有一个人真正成为“沙皇”。\n\n当看到一队日本巡逻兵时，沙皇的心中再次燃起了怒火，但这怒火却转瞬即逝。放松下来后，沙皇的神情变得更加阴郁了。\n\n“多大的耻辱啊……”他低声说道。\n\n离开窗边，沙皇正准备服用一些镇静剂来缓解情绪。就在这时，他听到办公室的门缓缓开启了。\n\n“陛下，请允许我向您汇报。”秘书说道。\n\n“何事？”沙皇言简意赅地问道。\n\n“日本政府向我们提议，加入‘大东亚共荣圈’。协议草案已经准备就绪，只需要您的批准。您打算如何回复他们？”秘书汇报道。\n\n沙皇沉思了片刻，又一次深深地叹了口气，然后服下了镇静剂，走回了自己的办公桌。他停下脚步，转身看向秘书。\n\n“随他们的便吧，我累了。你可以走了。”沙皇说道。"
 MAR_Collapse.25.a:0 "“反正情况也不会更糟了。”"
 MAR_Collapse.26.t:0 "尾声"
 MAR_Collapse.26.d:0 "伊万沿着街道上的人行道缓缓走着，前往自己那份或许是人生中最令人厌恶的工作。俄罗斯的秩序已然发生了天翻地覆的变化，现在，全国各地的管理层中都充斥着来自日本的“顾问”。\n\n走在这条如今已变得死气沉沉的街道上，看着那些与自己一样面色阴郁的行人，你能看到许许多多早已家破人亡的人们。街面上到处都是游手好闲的匪徒，他们争相模仿着日本黑帮的做派，更令人感到担忧的是，性交易已达到了自“混乱时期”以来从未有过的“繁荣”景象。\n\n路过一家商店时，伊万瞥了一眼橱窗上那令人望而生畏的标价，忍不住打了个寒颤，随后便加快了脚步。\n\n“卢布，然后是日元符号。这是多么令人绝望啊！为什么我们这么快就失去了一切？”伊万不禁扪心自问，正如他家乡彼尔姆的许多人一样，也在思考着这个令人绝望的问题。\n\n伊万继续向着自己的工作地点走去，同时也在脑海中苦苦思索着这些问题的答案，很明显他难以得出什么结论。就在这时，他突然想起，不久前，他过去的老板曾承诺要给他升职。但在如今这个世道，如果你不懂日语，那么你根本就无法获得提拔，甚至还可能直接沦为社会的最底层。\n\n伊万叹了口气，又看了一眼手表，发现距离上班时间还有一会儿。他想起附近有一家书店，或许在那里可以买到日语教材，至少也可以买一本常用语手册。想到这里，伊万便改变了自己的路线，朝着书店的方向走去。"
 MAR_Collapse.26.a:0 "“塑料”般的爱恋。"
 MAR_Collapse.27.t:0 "关于罢黜伪沙皇的讲话"
 MAR_Collapse.27.d:0 "站在镜头前，吉尔显得精疲力竭，沉重的责任和无尽的疲惫压弯了他的身躯；很显然，他所走的每一步都无比艰难。他紧紧地攥着几张皱巴巴的纸，然后机械地将它们在讲台边缘捋平。短暂的沉默后，吉尔从口袋中掏出手帕，擦了擦脸上的汗珠。剧烈的咳嗽也体现了他此时此刻的紧张和疲惫。\n\n终于，当他听到那期盼已久的“各就各位…开始！”的指令后，麦克风和摄像机都开始工作了。属于他的时刻到来了：\n\n“尊敬的俄罗斯帝国的子民们…今天，我不得不向你们宣布一个令人痛心的消息，一个令人难以接受的真相。阿列克谢·柯西金，那个自诩为阿列克谢二世的人，不过是一个欺世盗名的骗子，一个冒牌货，他用那虚假的出身和血统欺骗了我们所有人。他的野心和错误将我们的国家带入了一场灾难性的战争，将我们推向了毁灭的边缘。他的种种恶行最终使我们的国家满目疮痍，蒙受了巨大的耻辱。在意识到阿列克谢·柯西金的真面目后，人民的怒火再也无法被抑制，大规模的骚乱席卷全国——一场针对这位僭主的反抗已是势不可挡。在国家危亡之际，政府不得不采取断然措施：‘伪阿列克谢’被迫退位并被逐出了权力中心，为了平息乱局，我们也采取了一项无奈之举：宣布全国进入紧急状态。为了祖国，请您务必保持克制！在这困难的时刻，面对着那些企图摧毁我们共同家园的激进分子们，请团结起来！不要让他们的蛊惑和谎言蒙蔽了你们的双眼！请与克格勃的同志们通力合作，只有这样，我们才能渡过难关！请务必牢记，俄罗斯的未来，掌握在我们每一个人的手中。”\n\n吉尔的演讲在沉重的氛围中结束了；他的声音在每一次停顿前都微微颤抖，仿佛是在回应着那即将来临的灾难。乌云再次笼罩着整个国家，未来的挑战将更加严峻，它将考验每一位帝国子民的钢铁意志。"
 MAR_Collapse.27.a:0 "俄罗斯人民正襟危坐，怀着一颗忐忑的心仔细聆听。"
 MAR_Collapse.28.t:0 "清洗污秽"
 MAR_Collapse.28.d:0 "执行命令的过程是高效而又精准的；仿佛这是世界上最为邪恶的机构在最辉煌的时刻所取得的伟大成就一般。\n\n为了恢复秩序，政府的法令在全国范围内引发了一场空前规模的“大清洗”运动，在这场运动中，克格勃无情地恐吓着民众，并建立了绝对的统治。在这样的高压统治下，城市的街道变得空空荡荡，而审讯室和监狱中则人满为患。\n\n在漫漫长夜中，邻居、同事、甚至是亲人都在克格勃的淫威下被无情地带走。沉默成为了保护自己免受牢狱之灾的唯一手段。一言一行，甚至一个眼神，都有可能成为“罪证”，在人人自危的恐怖氛围中，将人们推入万劫不复的深渊。\n\n那些曾经生机勃勃的城市如今却变成了一座座死气沉沉的坟墓；街道上笼罩着一片令人窒息的寂静——听不到高谈阔论，更听不到欢声笑语，只有那些惊恐不安的人们在黑暗的街道上匆匆而过时，所发出的脚步声以及惊鸿一瞥的眼神。宵禁成为了生活中一项不可违背的铁律。人们的一举一动都被密切监视着，车辆牌照则被无休止地记录在案，成为了他们被怀疑和被监视的标志。所有这一切，都以“为了国家安全”的名义被无情地推行着。\n\n人们内心深处早已充满了恐惧，而仇恨也在无声地腐蚀着他们的灵魂，就像慢性毒药一样，缓慢地侵蚀着他们的思想。而当权者则沉浸在“一切尽在掌握之中”的幻想中，他们坚信：为了恢复秩序和社会稳定，所有这些都是值得的——在这虚假的“稳定”的旗帜下，黑白颠倒，是非不分。"
 MAR_Collapse.28.a:0 "在我们的纵容下，所有的罪恶都将被原谅"
 MAR_Collapse.29.t:0 "对暴行的反抗"
 MAR_Collapse.29.d:0 "在度过了无数个不眠之夜后，疲惫不堪的吉尔瘫坐在办公桌前，无力地翻阅着一份又一份的文件。他的眼皮沉重得几乎睁不开；他的双手也早已麻木，几乎握不住手中的钢笔。就在这时，一名克格勃军官不请自来，冲进了他的办公室——他的脸上写满了焦虑和不安。他的手中拿着一沓需要立即处理的紧急报告。\n\n“这些文件十万火急！”这名执法人员喊道，一边将文件“砰”地一声摔在了吉尔的桌子上。\n\n吉尔叹了口气，强打起精神，从他手中接过文件，用那早已布满血丝的眼睛疲惫地扫了一眼。\n\n“简单说，究竟出了什么事？”\n\n军官开始汇报：\n\n“我们所采取的那些强硬措施不仅没能解决问题，反而使局势进一步恶化。民众对我们的信任已经丧失殆尽；积极的民众们开始组建反对派和分离主义组织。在我们控制的薄弱地区，人们甚至已经开始公然无视我们的命令了。”\n\n军官每说一句话，每汇报一个字，吉尔的眼睛就睁得更大一分——震惊和绝望充斥着他的内心。他意识到，之前所有的努力都付诸东流了——政府的每一项举措都只会加剧当前的危机。仔细阅读完报告后，吉尔对军官说道：\n\n“向所有人传达我的命令：所有作战单位必须不惜一切代价恢复秩序！这是最高指示。立刻传达下去——每一分钟都事关重大。”\n\n“遵命！”军官迅速离开了办公室，留下了吉尔一人独自面对这令人绝望的局面，他的头痛也愈发剧烈了。\n\n当办公室的大门被“砰”地一声关上时，绝望的情绪瞬间将吉尔淹没了。局势似乎已到了山穷水尽的地步——末日，似乎比他想象中来得更快。"
 MAR_Collapse.29.a:0 "任何的补救措施都无法平息受伤之人的怒火。"
 MAR_Collapse.30.t:0 "帝国的解体"
 MAR_Collapse.30.d:0 "曾经象征着帝国荣耀的旗帜残骸孤零零地躺在地上，象征着旧秩序的彻底崩溃。取而代之的，则是代表着自由和变革的旗帜，这些崭新的旗帜在西伯利亚广袤的土地上高高飘扬。民众的耐心已经被消磨殆尽：疲惫不堪的人们早已无法忍受当局那无休止的暴行。\n\n如同失控的山火一般，人民起义的浪潮迅速席卷了各大城镇和村庄。它沿着这个国家四通八达的交通大动脉，点燃了人们对自由的渴望。克麦罗沃成为了这场风暴的中心——这里，在那些矿井和工厂周围，一个新的国家正在孕育。\n\n来自西伯利亚四面八方的起义者们聚集到了这座“抵抗中心”，为了同一个目标——自由而浴血奋战。在一座由金属废料临时搭建而成的“讲台”上，一位新领袖正在向人群发表着慷慨激昂的演讲——他的话语就像是照亮绝望人群的一盏明灯，也像是点燃人们心中怒火的火种。\n\n“受够了这些暴君们的压迫！”他喊道，一边将拳头高高举起，仿佛是一面象征着反抗的旗帜。他的声音洪亮而又坚定，充满了愤怒和不屈不挠的决心。“决不能再让这些外国人来支配我们的生活了！现在，我们才是自己命运的主人！西伯利亚将会崛起，并且再也不受任何人的控制！”\n\n革命总会伴随着混乱和考验——一场对于新秩序的终极考验。在这新时代的黎明到来之际，旧帝国的阴影依旧徘徊不去，但变革之风早已吹散了这一切。大崩溃才刚刚开始，而它将会让已经破碎的一切变得支离破碎。"
 MAR_Collapse.30.a:0 "多年的努力，毁于一旦。"
 MAR_Collapse.31.t:0 "山麓之王"
 MAR_Collapse.31.d:0 "雨点无情地敲打着办公室的窗户，吉尔茫然地望着窗外，思绪早已飘向了远方，他不断地思索着近些天来所发生的种种悲剧。在经历了绝望和恐惧之后，他审视着周遭这满目疮痍的一切——曾经，“青年俄罗斯联盟”怀着一颗赤诚之心，为人民的福祉而殚精竭虑，但如今，所有的努力都随着那场灾难而化为了乌有。他们曾向人民许下了美好的未来，而如今呈现在人们眼前的，却只有无尽的黑暗。\n\n突然，一阵轻柔的敲门声打破了这令人窒息的寂静——在这空旷的权力走廊中，这声音显得格外突兀。一名克格勃的信使走了进来，带来了令人不安的消息：\n\n“请……请恕我打扰，阁下……我们又失去了一个地区。”\n\n吉尔再也无法控制住自己的情绪，怒吼道：\n\n“这难道还需要你来告诉我吗？！”他随即又强迫自己冷静下来，沉重地叹了口气。“难道我们就真的无力回天了吗？难道我们之前所做的一切真的只是一场徒劳吗？”\n\n回答他的只有令人尴尬的沉默。\n\n“没有人能洞悉一切……”吉尔若有所思地说道，随后便陷入了沉思。片刻之后，他毅然决然地转过身，对年轻人说道：“听着！是时候调整我们的战略了。放弃那些鞭长莫及的地区；集中一切资源，巩固我们的核心区域。幻想的时代已经结束了，现在，俄罗斯的每一寸土地都如同一个独立的国家。”\n\n年轻人默默地点了点头，他深知这道命令的分量，随后便转身离开了办公室，着手向军事部门传达最新的指示。\n\n几天后，一份报告被送到了吉尔的办公桌上。新战略出乎意料地取得了成效——这是在无尽的苦难中闪现的一线希望。尽管如此，他的心情依旧沉重无比：在这摇摇欲坠的世界中，有一个声音在他的脑海中回荡，如良知一般拷问着他。"
 MAR_Collapse.31.a:0 "这是怎样一个令人毛骨悚然的结局啊…"
 TaS_RUSEpilogue_news.1.t: "[Get_newspaper_header]保皇派统一俄罗斯！"
 TaS_RUSEpilogue_news.1.d: "数年来，终于有一条关于俄罗斯的好消息传来：在俄罗斯人民王国首相亚历山大·卡津别克的领导下，俄罗斯实现了统一。\n\n据悉，青年俄罗斯联盟的创始人亚历山大·卡津别克再次展现出他雷厉风行的铁腕手段，铲除异己，击败对手，最终结束了这场旷日持久的内战，实现国家的重新统一。然而，持续不断的战火，令俄罗斯再次经历了一场大动乱，第二次西俄战争的失败，更是令这个国家伤痕累累，百废待兴。但即使如此，俄罗斯的未来，依然充满着希望。首相宣布，将仿照1964年的模式，再次召开缙绅会议，但这一次，将在全国范围内进行。俄罗斯人民最终会选择谁，来成为他们的新沙皇？只有时间，才能给出最终的答案。"
 TaS_RUSEpilogue_news.1.a: "他又做到了。"
 TaS_RUSEpilogue_news.1.b: "飞机并没有立即起飞。"
 TaS_RUSEpilogue_news.2.t: "[Get_newspaper_header]俄罗斯国民军统一俄罗斯！"
 TaS_RUSEpilogue_news.2.d: "弗拉基米尔·弗拉基米罗维奇·吉尔，三次背叛祖国的人。首先，他在第二次世界大战期间加入了第三帝国，然后在第一次西俄战争期间，他站在青年俄罗斯联盟这一边对抗革命阵线。最后，当第二次西俄战争的尘埃落定，他率领残部退守乌拉尔，厉兵秣马，随后以雷霆之势横扫一切对手，铁蹄踏遍昔日故土。如今，这个男人已然成为这片残破俄罗斯大地上唯一的君王。\n\n新俄罗斯是一个尽数继承了青年俄罗斯联盟人最阴暗面，又被吉尔的极端民族主义所放大的国度。全面征兵与军国主义崇拜喂饱了弗拉基米尔永无止境的军队需求，而非俄罗斯族裔则在工厂城市的奴役中苟延残喘。吉尔的战争机器以铁腕统治震慑着整个国家。人们只能揣测，这个疯子是否会发动第三次西俄罗斯战争。"
 TaS_RUSEpilogue_news.2.a: "历史仍在重演。第一次是悲剧，第二次是闹剧，第三次则由吉尔自己决定。"
 TaS_RUSEpilogue_news.3.t: "[Get_newspaper_header]俄罗斯帝国统一俄罗斯！"
 TaS_RUSEpilogue_news.3.d: "今日，一则来自俄罗斯荒原的惊人消息震惊了世界。俄罗斯帝国于1917年在数场革命中陨落，其继承者们更迭如走马灯，相继覆灭。如今，历史的循环已然闭合——德米特里·德米特里耶维奇·瓦西里耶夫再次宣告俄罗斯帝国的建立。瓦西里耶夫，一个由激进民族主义者和狂热分子组成的小团体的首领，以占领北俄罗斯为起点，最终夺取了整个俄罗斯的控制权。\n\n然而，这个新生的帝国，不过是一个半法西斯主义的农业国，仅存帝国之名的空壳罢了。在这虚假的王国里，瓦西里耶夫本人取代了沙皇的位置。国家恢复了专制统治，仇外情绪、贸易保护主义、庸俗不堪的爱国主义以及无所不能的惩罚机构滋生蔓延，而这些机构则制造着永无休止的压迫和镇压。许多人为俄罗斯的未来感到担忧，似乎它已踏上了一条危险的道路；而另一些人则对帝国的复辟表示欢迎，并坚信瓦西里耶夫将带领国家重返昔日的辉煌。"
 TaS_RUSEpilogue_news.3.a: "帝国回来了，再一次。"
 TaS_RUSEpilogue_news.4.t: "[Get_newspaper_header]欧亚共和国统一俄罗斯！"
 TaS_RUSEpilogue_news.4.d: "在俄罗斯历史上，哈萨克斯坦一直都是一个资源丰富的“殖民地”。然而，如今，这个国家却高调宣布，自己已经战胜了俄罗斯的残余势力，屹立于世界民族之林！维塔利·穆哈，这个出身平凡的年轻人，一步步从一个小小的公务员，成为哈萨克斯坦州长，再到如今的俄罗斯最高统治者，领导着一个全新的国家。这个国家，以社会民族主义为意识形态基础，并吸收了瑟克特夫卡尔激进学者尼古拉·古米廖夫的部分“欧亚主义”思想。然而，在这光鲜亮丽的外表下，却隐藏着无法调和的内部矛盾，以及对国家未来的迷茫和困惑。正如历史所证明的那样，政治动荡和拙劣的政策，足以将一个国家撕成碎片。但那些饱受内战之苦的人们，如今却选择了沉默，他们只是静静地观望着这一切，直到真正的灾难降临…这个新生的国家，究竟能够在这个星球上存在多久？也许，只有时间才能给出答案。"
 TaS_RUSEpilogue_news.4.a: "克里米亚不是一种衡量标准！"
 TaS_RUSEpilogue_news.5.t: "[Get_newspaper_header]全俄罗斯摄政府统一俄罗斯！"
 TaS_RUSEpilogue_news.5.d: "俄罗斯末代沙皇谢尔盖·别洛泽尔斯基之死，至今仍是俄罗斯近代史上最扑朔迷离的事件之一。大多数专家倾向于因年老、压力和酗酒导致的自然死亡。然而，约瑟夫·拜尔利却持不同看法。这位沙皇的挚友，二战老兵，曾经为苏联浴血奋战的美国大兵……这一切，都为他的人生增添了一抹传奇色彩。约瑟夫坚信沙皇的死是由前青年俄罗斯联盟领袖亚历山大·卡津别克一手策划的。为了追寻正义，拜尔利率领忠于他的士兵，粉碎了所有的反抗，控制了首都。如今，约瑟夫正试图将权力移交给别洛泽斯基的亲属，但目前还没有人站出来宣布继承王位。截止到目前为止，俄罗斯境内外已有超过130名政治人物和普通公民被指控参与了谋杀沙皇的阴谋，其中78人已被处决，审判仍在继续。"
 TaS_RUSEpilogue_news.5.a: "任凭世界毁灭，正义必将伸张。"
 TaS_RUSEpilogue_news.6.t: "[Get_newspaper_header]俄罗斯民主联邦统一俄罗斯！"
 TaS_RUSEpilogue_news.6.d: "米哈伊尔·尼古拉耶夫是一位非同寻常的领导者。与其他政治家不同，他既没有伟大的理想，也没有复仇的欲望，更没有强大的后台。然而，在俄罗斯陷入最深的危机之时，正是他，挺身而出，拯救了这个国家。\n\n尼古拉耶夫率领着他的士兵，从永冻土的荒原中杀出，将俄罗斯从那些暴君和独裁者的魔爪中解救出来。他治下的俄罗斯，和他本人一样，朴实无华，但对饱经战火摧残的人们来说，这才是他们真正想要的——和平与稳定。\n\n以打击极端主义和恢复经济为首要任务，尼古拉耶夫领导的自由政府，彻底放弃了对外扩张的计划。如果人民想要收复失地，那也只能通过和平的方式来实现，至少，在他统治期间，是这样的。"
 TaS_RUSEpilogue_news.6.a: "当你失去了所有的自尊时，也就没有了痛苦。"
 TaS_RUSEpilogue_news.7.t: "[Get_newspaper_header]伊德尔-乌拉尔国统一俄罗斯！"
 TaS_RUSEpilogue_news.7.d: "俄罗斯荒原再次成为一个统一的国家。据消息来源称，伊德尔-乌拉尔是为了应对俄罗斯人民王国在保卫其东部边境抵御德国入侵者方面的低效而成立的。（尽管据一些消息来源称，该组织仍得到了德国国防军的积极赞助）鞑靼人和巴什基尔人的军队成功击退了对喀山的所有进攻，并控制了俄罗斯剩余的领土。\n\n然而，正如专家所指出的那样，现任政府将无法长期治理这些新领土。因此，建立以鞑靼人、楚瓦什人、巴什基尔人、马里人、莫尔多瓦人、乌德穆尔特人为主体的自治联邦的问题将在不久的将来得到决定。"
 TaS_RUSEpilogue_news.7.a: "蒙古-鞑靼桎梏的阴影？"
 TaS_RUSEpilogue_news.8.t: "[Get_newspaper_header]俄罗斯民主联邦共和国统一俄罗斯！"
 TaS_RUSEpilogue_news.8.d: "当别洛泽尔斯基的王国开始崩溃，而那个疯狂的暴徒弗拉基米尔·吉尔开始在乌拉尔山脉建立他的帝国时，叶夫根尼·普里马科夫承诺将尽一切努力保护秋明和鄂木斯克的普通居民，使他们免受来自乌拉尔山脉的、雪崩般威胁倾泻而下的敌人侵扰。普里马科夫履行了他的承诺，消灭了吉尔，并夺取了最为强大的工业综合体之一，借助它解放了俄罗斯的其余地区。俄罗斯民主联邦共和国再次复兴了俄罗斯的民主传统，并在民众中迅速获得认可。\n下一步将是采纳新宪法并建立议会机构，这将使俄罗斯公民能够参与到自己国家的管理中来。尽管第三次大动乱时代结束后，国家依然满目疮痍，但普里马科夫承诺，这一切都将很快得到改变。自由国家组织尽管曾寄希望于另一位将军的胜利，但仍然欢迎新生的俄罗斯登上国际舞台。"
 TaS_RUSEpilogue_news.8.a: "自由重返俄罗斯？"
 TaS_RUSEpilogue_news.9.t: "[Get_newspaper_header]俄罗斯-波兰联盟统一俄罗斯！"
 TaS_RUSEpilogue_news.9.d: "令人惊讶的消息从俄罗斯传来:这个国家正在努力结束第三次动乱，走上统一之路。沃伊切赫·雅鲁泽尔斯基将军召集了波兰军团的遗骸，并领导了他的运动，重新统一了俄罗斯帝国的前土地。这个新的国家被称为俄罗斯-波兰联盟，与旧时的俄罗斯国家有很大的不同。实现统一的关键步骤之一是建立一个泛斯拉夫委员会，使所有在德国统治下的斯拉夫人民都有机会拯救自己的民族，并在国内建立民族自治。\n\n雅鲁泽尔斯基和他的团队为波兰重返世界舞台做出了巨大的贡献。他们的成就是惊人的，给人们带来了摆脱德国枷锁的希望。"
 TaS_RUSEpilogue_news.9.a: "波兰和混乱？历史再度重演..."
 TaS_RUSEpilogue_news.10.t: "[Get_newspaper_header]俄罗斯人民联邦统一俄罗斯！"
 TaS_RUSEpilogue_news.10.d: "那场席卷俄罗斯，被称为“第三次大动乱”的危机，终于要结束了。弗拉基米尔·沃尔福维奇·日里诺夫斯基，这个绰号“伊拉克的豺狼”的男人，率领着他的军队，从马加丹港一路杀到了维亚特卡的摄政王宫。他对俄罗斯的敌人冷酷无情，同时也获得了联合国的支持。如今，他正按照自己的意愿，重塑着俄罗斯。日里诺夫斯基自己，成为了俄罗斯自由民主党的主席，并且按照他的计划，一个全新的保守党也即将成立。尽管他声称要带领俄罗斯走上自由民主的道路，但他治下的政府，却在积极备战，准备发动一场复仇战争，哪怕不能恢复到1940年的边界，也要将敌人赶回到1972年的防线。\n\n“我希望1980年是一个和平的年份，但我是一个诚实的人。我可以告诉大家，这将是一个不平静的年份！” 日里诺夫斯基在俄罗斯自由民主党全国代表大会上发表讲话时如是说道。"
 TaS_RUSEpilogue_news.10.a: "牌局已经开始，我们手握王牌，俄罗斯的旗帜必将再次飘扬在莫斯科上空。"
 TaS_RUSEpilogue_news.11.t: "[Get_newspaper_header]社会主义公社联盟统一俄罗斯！"
 TaS_RUSEpilogue_news.11.d: "苏珊娜·佩彻罗正致力于将俄罗斯从第三次动乱中拯救出来！从布里亚特共和国主席开始，她重新点燃了人们对弗拉基米尔·列宁和瓦列里·萨布林思想的信仰。通过在俄罗斯发起新的社会主义革命，她统一了国家，现在的目标是结束第三次大动乱。然而，由于对新获得的城市缺乏完全控制，决定根据公社原则重组政府体系。国际专家对这一决定明显感到困惑，因为苏珊娜的政府本可以轻松恢复苏维埃制度，但显然这是乌托邦社会主义的独特之处，也是新联盟的特点。前哥萨克无政府主义者热烈欢迎苏珊娜对俄罗斯的新愿景。然而，很难说这个体系在其他地区会如何发展。无论如何，红旗再次飘扬在俄罗斯上空。"
 TaS_RUSEpilogue_news.11.a: "萨布林同志会为我们感到骄傲的。"
 TaS_RUSEpilogue_news.12.t: "[Get_newspaper_header]全俄罗斯紧急状态军事委员会统一俄罗斯！"
 TaS_RUSEpilogue_news.12.d: "亚历山大·鲁茨科伊是俄罗斯人民沙皇国所有政治人物中最被低估的一个。在第二次西俄战争期间，最高指挥部几乎把他遗忘了。当国家又一次战败，陷入无政府状态时，这位总督终于意识到，自己必须站出来做些什么。他集结了所有能找到的部队——驻军、志愿兵、从高加索撤退的军队——发动了一场旨在“清洗”俄罗斯的军事行动，清洗的对象，正是那些腐败无能的旧军官和官员们。\n如今，俄罗斯再次站在了十字路口。鲁茨科伊计划举行一次全民公决，以解决新俄罗斯面临的一系列国家问题，例如：继续坚持社会主义道路和计划经济，还是转向资本主义。但其中最重要的一个问题是：俄罗斯，是否应该再次与团结协定和共荣圈开战。"
 TaS_RUSEpilogue_news.12.a: "鲁茨科伊的弱点在于他的实用主义，但这也是他的优势所在。"
 TaS_RUSEpilogue_news.14.t: "[Get_newspaper_header]俄罗斯的动荡"
 TaS_RUSEpilogue_news.14.d: "在第二次西俄战争中那耻辱性的、毁灭性的失败后，俄罗斯国内爆发了一波又一波的抗议浪潮。与德国签订的那份和平条约，尽管屈辱，但却是在德国咄咄逼人的压力下被迫签署的。然而，这份条约也成为了一个导火索，它使得那些原本一直隐忍不发、暗中积蓄力量的反对派们找到了一个千载难逢的机会，开始明目张胆地挑战青年俄罗斯联盟的统治。\n\n整个国家陷入了分崩离析的境地，这清楚地表明，一场巨大的灾难正朝着俄罗斯迎面扑来。由于工人运动的大规模爆发，他们拒绝为了虚无缥缈的承诺而在当下的困境中继续出卖自己的劳动力，工厂的产能也随之一落千丈。曾经为了满足人民基本生活需求而建立的配给制度也已彻底崩溃——最基本的生存条件都无法得到满足。许多人都在说，俄罗斯正在不可逆转地坠入深渊。"
 TaS_RUSEpilogue_news.14.a: "难道这真的就是俄罗斯的末日了吗？"
 TaS_RUSEpilogue_news.15.t: "[Get_newspaper_header]日本皇军进驻俄罗斯"
 TaS_RUSEpilogue_news.15.d: "阿列克谢二世在经历了近期的种种剧变之后，非但未能稳固自己的统治，反而在国际舞台上彻底断送了俄罗斯的自主性。近日，他对国民发表讲话，大肆宣传与日本之间那所谓的“友好合作”是何等重要。根据协议，俄罗斯政府必须履行其单方面的义务，而日本则会承诺维持俄罗斯帝国国内的稳定。很快，在日本皇军的“护送”下，曾经四分五裂的俄罗斯“统一”了，为了千千万万饥肠辘辘的百姓们，这些军队将“义不容辞”地担负起维护社会秩序的“重任”。\n\n然而，这份“合作”的代价却仍未可知。但显而易见的是，国力衰退、四分五裂的俄罗斯将不得不对日本做出大量的让步，因为后者在军事实力和军队组织上都明显更胜一筹。这就埋下了一个巨大的隐患：一旦接到了来自东京的命令，军纪严明、训练有素的日军将会迅速对这支早已丧失了斗志的“军队”发动攻击，而俄罗斯方面根本无力还击。不过，就目前来看，日方的首要目标只有一个——避免这个国家彻底崩溃。"
 TaS_RUSEpilogue_news.15.a: "本以为会有更好的结果。"
 TaS_RUSEpilogue_news.16.t: "[Get_newspaper_header]俄军撤离中亚"
 TaS_RUSEpilogue_news.16.d: "俄日两国之间的“协议”还在不断地增加新的条款：东京方面变本加厉地提出各种无理要求，迫使俄罗斯彻底放弃对中亚大片领土的控制——这些地区不久前还曾是俄罗斯“统一”的象征。而现在，沙皇政府已经无力继续控制这些区域。\n\n尽管日本官方一再强调他们的目标是“保障当地人民的自决权”，但明眼人都很清楚，这些摆脱了俄罗斯控制的“独立”国家将会彻底沦为世界强权的附庸。他们那虚假的主权将会受到来自对该地区虎视眈眈的外部势力的严重限制。\n\n而四面楚歌的俄罗斯根本无力阻止这一切，只能眼睁睁地看着国际局势的变化，却无力做出任何反抗。"
 TaS_RUSEpilogue_news.16.a: "地图上的“飞地”正在被蚕食。"
 TaS_RUSEpilogue_news.17.t: "[Get_newspaper_header]俄罗斯加入共荣圈"
 TaS_RUSEpilogue_news.17.d: "一份协议的签署标志着两国之间合作的高潮：俄罗斯在日本的“邀请”下加入了“大东亚共荣圈”，彻底融入了其经济体系之中。在丧失了独立自主之后，俄罗斯别无选择，只能接受这一“邀请”，而这也在国内外引发了一场轩然大波，人们清楚地意识到，俄罗斯的主权已经彻底沦丧。\n\n尽管阿列克谢二世嘴上说着，这对于俄罗斯经济的复苏是“何等重要”，但所有人都很清楚这其中的猫腻：俄罗斯已然沦为日本人的玩物。日本资本开始迅速侵蚀俄罗斯的市场，将本土企业和产品排挤出去。更令人感到担忧的是，日本还强迫俄罗斯民众学习日语，根本不顾他们的意愿。\n\n俄罗斯作为一个独立大国的时代就这样落幕了：它的独立性彻底向外国的利益屈服，而其民族认同也逐渐在这残酷的新现实中逐渐消逝。"
 TaS_RUSEpilogue_news.17.a: "日本帝国的新殖民地"
 TaS_RUSEpilogue_news.18.t: "[Get_newspaper_header]阿列克谢二世退位"
 TaS_RUSEpilogue_news.18.d: "出人意料的剧变再次震撼了整个俄罗斯：阿列克谢二世（即曾经的阿列克谢·柯西金），这位曾经被吹捧为“人民沙皇”的统治者，如今却背负着“旷世巨骗”的骂名，做出了一个令人震惊的决定——他宣布退位。在这场突如其来的剧变中，以弗拉基米尔·吉尔为首的政府试图通过将一切罪责都推到阿列克谢二世身上，以此来转移民众的怒火。\n\n同日，随着沙皇的倒台，当局宣布全国进入紧急状态。为了恢复社会秩序，克格勃的部队倾巢而出。俄罗斯的未来再次变得扑朔迷离，国内的紧张局势也因为愈演愈烈的内乱和各种危机而进一步加剧。"
 TaS_RUSEpilogue_news.18.a: "那些轻信的人们迎来了苦难的日子。"
 TaS_RUSEpilogue_news.19.t: "[Get_newspaper_header]第三次大动乱"
 TaS_RUSEpilogue_news.19.d: "俄罗斯帝国的崩溃已是无可避免。国家安全委员会为稳定局势而采取的种种措施非但未能如愿以偿，反而适得其反，进一步激化了矛盾，导致大规模的抗议和骚乱活动愈演愈烈。暴力机关的残暴行径引发了社会各界的强烈不满。这种不满最终演变为席卷全国的大起义，最终导致整个国家四分五裂，沦为一系列各自为战的独立实体。\n\n值此危急存亡之秋，弗拉基米尔·吉尔所领导的政府孤注一掷，试图将仅存的资源集中到那些仍然忠于他们的地区，将这些残存的地区牢牢地控制在手中。昔日那个辉煌的帝国早已烟消云散，取而代之的，则是一个个深陷内部危机，被经济困境和社会冲突折磨得苦不堪言的、支离破碎的小国。因此，俄罗斯帝国的崩溃不仅标志着一个时代的终结，更开启了一个充斥着混乱、未知和动荡不安的新时代。"
 TaS_RUSEpilogue_news.19.a: "俄罗斯再次迷失了自我。"
 TaS_RUSEpilogue_news.20.t: "[Get_newspaper_header]日本入侵西伯利亚"
 TaS_RUSEpilogue_news.20.d: "由于俄罗斯东部边境地区的防御力量早已名存实亡，日本趁虚而入，开始在这片广袤的土地上积极扩张其势力范围。如今，日本人更是采取了果断而又协调一致的军事行动，对西伯利亚地区发动了全面入侵。\n\n在很短的时间内，训练有素、组织严密的日军就发动了一场势如破竹的闪电战。他们迅速占领了大片领土，并立刻建立起一套新的行政体系：任命总督，并着手实施新的法律和秩序。西伯利亚彻底沦为了日本的殖民地，这在当地居民中引发了强烈的反响——一些人对未来抱有一丝渺茫的希望，而另一些人则对侵略者的占领深恶痛绝。"
 TaS_RUSEpilogue_news.20.a: "像一群秃鹫般，争抢着那早已腐烂的猎物。"
 TaS_RUSEpilogue_news.21.t: "[Get_newspaper_header]中亚革命"
 TaS_RUSEpilogue_news.21.d: "在中亚地缘政治舞台上，一场巨变正在悄然上演：在哈萨克斯坦，从突厥斯坦军团中分裂出来的哈萨克民族主义者们发动政变，推翻了现任政府的统治；与此同时，在突厥斯坦，温和派伊斯兰教士的统治地位也被更为激进的“圣战”分子所取代。\n\n两国都开始紧锣密鼓地巩固自身在中亚地区的地位。它们为可能到来的、针对周边地区的扩张行动所进行的积极准备，在邻国中引发了广泛而深切的不安。\n\n国家之间的不满与紧张情绪与日俱增：任何一方所发出的可能进行军事干预的威胁都被另一方视作不可接受的行为。而局势也正在因此而不断恶化，将整个地区推向了更为危险的边缘。"
 TaS_RUSEpilogue_news.21.a: "历史的阴影无处不在。"
 TaS_RUSEpilogue_news.22.t: "[Get_newspaper_header]中亚战争"
 TaS_RUSEpilogue_news.22.d: "哈萨克斯坦与突厥斯坦埃米尔国之间不断升级的紧张局势最终演变成了一场全面冲突：双方都拒绝屈服于外部压力，并宣布进行全国总动员。这一举动也成为了两国边境地区爆发大规模军事冲突的直接导火索。\n\n尽管这场战争的规模尚无法与全球冲突相提并论，但它却具有极为重要的战略意义：战争所带来的领土变更和冲突结果都将深刻地改变这一地区的未来格局。这场斗争的结果将对中亚的未来产生决定性的影响，并将在胜者的意志下确立新的政治秩序——无论这将会是维持独立的哈萨克斯坦的延续，还是让那些伊斯兰极端分子们进一步扩张势力，并将他们的意志强加于整个地区。"
 TaS_RUSEpilogue_news.22.a: "没有人能够躲得过战争的阴影。"
 TaS_RUSEpilogue_news.23.t: "[Get_newspaper_header]中亚战争"
 TaS_RUSEpilogue_news.23.d: "哈萨克斯坦与死灰复燃的突厥斯坦军团之间的紧张关系最终演变成了一场真枪实弹的武装冲突：双方互不让步，拒绝向对方的无理要求低头，并都宣布进行全国总动员。这一举动也成为了点燃两国边境地区战火的导火索。\n\n尽管这场战争的规模还不足以称之为一场世界性的大战，但其战略意义却不容小觑：领土的变更和冲突的结果将彻底改写这一地区的权力版图。这场战争的最终结果将会对中亚地区的未来产生决定性的影响，塑造出全新的政治格局——要么哈萨克斯坦能够继续维持其独立地位，要么军团将如愿以偿地扩大其影响力，按照德国的愿景来构建地区新秩序。"
 TaS_RUSEpilogue_news.23.a: "没有人能够躲得过战争的阴影。"
