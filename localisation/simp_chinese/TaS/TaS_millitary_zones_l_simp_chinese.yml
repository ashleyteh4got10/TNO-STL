 UZB_Alexander_Rutskoj:0 "亚历山大·鲁茨科伊"
 UZB_Alexander_Rutskoj_desc:0 "亚历山大·鲁茨科伊的一生始于一个巨大的悲剧。随着苏维埃联盟的轰然解体，他原本充满希望的家庭也随之分崩离析，他的父亲在之后俄罗斯那血腥的权力纷争中侥幸捡回了一条性命。年轻的鲁茨科伊早早地学会了如何摆弄自己手中的突击步枪，因此，他那娴熟的战斗技能也很快获得了他所效力的那位军阀的赏识。人称“疯狗萨尼亚”的雇佣兵队长从不为理想而战，他只为那些能够支付高额佣金的雇主卖命。然而，当他率领的雇佣兵团在统一俄罗斯的最后一战中与装备精良的别洛泽尔斯基正规军展开厮杀后，一切都改变了。在经历了数次审判以及他本人真诚的忏悔后，他开始为沙皇的军队效力，并在这里重新找到了用武之地。\n\n如今，获得了沙皇本人亲自授权的鲁茨科伊，已经在这片见证了他戎马半生的突厥斯坦荒原上寻觅到了一处安宁的归所，成为了一方秩序的维护者。"
