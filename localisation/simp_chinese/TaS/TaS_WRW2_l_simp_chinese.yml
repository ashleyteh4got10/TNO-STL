 MAR_warprep_calm_before_the_storm_desc:0 "枪炮声已经在俄罗斯人民的头顶止息。多年的手足相残，多年的自相争斗，终于走向了完结。但这并不意味着我们可以高枕无忧，静观命运的安排。俄罗斯帝国深知其外部的威胁和其须讨伐的敌人。许多在遥远的过去沦陷的领土，都应在将来重回俄罗斯的怀抱。而这绝无可能通过和平手段来实现，一场大战已是箭在弦上，不得不发。现在，我们必须制定复仇计划，为了那些胆敢挥舞利剑指向数百万无辜人民的恶徒。召集将领，制定全面战略；让经济做好准备，迎接战争轨道；动员全体国民，整军备战；为普通民众普及战争时期的知识和技能——所有的措施都将提上日程，为了让俄罗斯在那对抗纳粹野兽的最后一战做好准备！"
 MAR_warprep_rise_up_people_of_russia_desc:0 "在帝国与德国之间日益紧张的阴影中，为了给暴风雨的来临做好准备，一个试图激励俄罗斯人民的计划正在酝酿。在这个计划中，准备一场慷慨激昂的演讲是其中最为关键的一环。目前在紧锣密鼓地暗中制定动员计划，但同时也为广播和电视准备好了演讲稿。\n\n演讲台上已经摆好了演讲稿，所有的摄影机都对准了一个焦点。许多麦克风也为了记录这一刻而准备就绪。俄罗斯人围聚在电视和收音机旁，热切地期盼着历史性的一刻——每个人都希望听到能够提振人心的演讲。他们全神贯注地聆听着：每一个音符，每一帧画面都显得尤为重要。人们清晰地意识到，这篇演讲将点燃民众心中的希望，指引他们为了赢得这场战争而披荆斩棘。在长时间令人感到无比焦虑的等待后，举国上下响起了同一个声音：‘向俄罗斯人民发表讲话’！"
 MAR_warprep_leviathan_of_eurasia_desc:0 "俄罗斯所遭受的重创终于愈合。如今，统一在一个旗帜下的国家展现出令人生畏的力量，随时准备将一切灾厄自世界之巅抹去。无论敌人在深海之底还是在高空之上——对一个从疾病中痊愈的国家来说，早已没有什么困难能够阻挡其采取全新方略，实施最新方针的脚步。然而，这一切都无法离开那场即将 đến临的战争而独自实现。这是一场决定无数人命运的战争，它或是带来数不清的苦难，或是给所有被奴役的人们带来彻底的解放。在一切都摇摇欲坠的世界上，各个国家与民族都在寻找慰藉和希望。而致力于复兴的俄罗斯，将成为那些渴望东欧获得自由的人们的灯塔。人民通过团结重拾自信，并唤醒了自身的力量。一股新的力量不仅要枕戈待旦，更要构建一个属于全体人民的光明未来——一个充满着和平与正义的世界。俄罗斯要向世界展示：它已经准备好与其边界上的阴霾展开决战！"
 MAR_warprep_prepare_for_the_worst_desc:0 "未雨绸缪永远不会错，尤其是当对手是一个浸淫于仇恨思想、统治着大半个欧洲大陆的巨人的时候。在这种情况下，任何的准备都不过分。所有人都必须经受一次最严格的考验——最大程度地减少人民在战争中遭受的伤亡。我们深知德国不会对伤亡和损失有任何的顾虑，且德军手中握有大规模杀伤性武器。基于这些考虑，军队的高级指挥官们提出了一项建设多个避难所以保护国民的计划。在各大城市修筑掩体，并在其中囤积大量生活必需品，以防御德国空军随时可能发动的空袭。除此以外，还应开展大规模演习，使人民了解战时应采取怎样的行动，如何有序地撤离城市，如何进行防护。"
 MAR_warprep_modern_warfare_logistics_desc:0 "即将到来的战争将与之前的所有战争都截然不同：它是一场争取复兴国家并建立我们所信奉的新秩序的战争。新型作战装备不断涌现，旧装备则推陈出新。蓝图上的庞大铁龙很快便会变成一条条崭新的铁路动脉。最为先进的工厂以超越想象的速度拔地而起；生产线被源源不断地补充各类原料，然后产出那些最为现代化的武器装备。如今在俄罗斯，工业生产与军事后勤高效相连，彼此紧密配合——将这两架机器进行组装与链接已然成为一项极为重要的任务。这项重任就落在那些想法与精神永不停歇的工人们的肩膀上了。"
 MAR_warprep_friends_around_the_world_desc:0 "在外交政策上，德国犯下了太多不可挽回的错误。对雅利安种族优越论的痴迷蒙蔽了双眼，令它逐渐丧失了一个又一个曾经的盟友——那些本能够与之并肩作战的国家。如今在德国身边，仅剩下一帮摇摇欲坠的傀儡政权，随时可能分崩离析。\n\n我们不会重蹈覆辙。俄罗斯将在国际舞台上寻求盟友、合作伙伴与志同道合者，那些人将会在对抗当前欧洲秩序这一艰巨任务中为我国提供支持与帮助。我们向全世界发出号召：与我们联合起来，推翻那些执迷不悟的压迫者。千年帝国将会在未来的几年内垮台——团结全世界志同道合者之力量。俄罗斯向世界伸出了橄榄枝，并期待着他们的回应。在战斗中，俄罗斯将不再孤单。永远不会。"
 MAR_warprep_better_call_sam_desc:0 "那自豪地挥舞着自由火炬的美国雄鹰，如今可以在我们的国家上空翱翔。美洲大陆上的巨人早已开始了其对抗纳粹德国的斗争，并维护民主和正义的原则。如今，在一场重要程度无与伦比的战争打响之际，美国能够向俄罗斯提供最为广泛的军事和经济支持，协助俄罗斯与德国作战。加强与美国这个世界领导者的联系，不仅能够极大地提高我们在未来的战斗中获得重大援助的可能性，而且有助于在国际舞台上占据有利位置。\n\n现在必须抛弃过去的默默无闻与自我封闭，去积极主动地发展国与国之间的合作，相互尊重，缔结条约。拥有庞大经济体量和巨量先进武器装备的美国，可以成为与纳粹战斗的重要盟友。或许，当世界处于混乱边缘之际，我们将于与美国的友谊中寻获新的希望。"
 MAR_warprep_chrysanthemum_friendship_desc:0 "那沐浴在阳光下的岛国，将再度绽放出鲜红的花朵。曾经是德国盟友的这个国度，已经成为了最坚定的反纳粹力量。它的能力，加上与我们共同的敌人，足以扭转欧洲战场的局面，给予我们极佳的战略行动上的可能性。\n\n我们将向日本方面派遣外交代表团。这个代表团不仅能够展现出我们在军事合作方面的可能性，更重要的是展现我们对于未来发展的诚意。他们肩负的使命不光是要推动两国关系发展，更要以自己的能力使日方确信，与俄罗斯联手将为日本带来更光明的未来。也许，此次的谈判结果，能够使我们与日本的合作关系达到一个全新的高度——为了两国间光明的未来，也为了在将来构建新的双边关系模式。"
 MAR_warprep_dance_on_the_ravaged_land_desc:0 "当然，我们不能只依靠我们自己的力量。那些从惨痛的战争中丢失的领土，其上仍然存在着规模不小的抵抗力量，他们仍然为了反抗侵略者而流血牺牲。我们需要和他们取得联系，让这些英勇无畏的战士知道，最终决战已经不远了。我们需要统合那些互不统属的不同组织和抵抗力量。在我们夺回我们失地的战役打响之际，对那些盘踞已久的军阀土匪发起打击！\n\n各式各样的游击队员都在自己的区域内袭扰着纳粹匪徒，动摇着纳粹分子建立的秩序。那些曾被占领的、早已荒废的城市中燃起了希望的火光——让侵略者感受到，他们绝不可能高枕无忧。"
 MAR_warprep_so_kill_him_desc:0 "最后的准备工作已经完成。一切都已准备就绪。这是一次我们长期以来梦寐以求的行动，但后路已经彻底消失，因此不容任何失误。君主的心中充满了无限的忧虑，毕竟他需要为这一切负上全责。时间一分一秒地过去，他们距离那历史性的时刻越来越近了。\n\n最后一次会议即将开始，过去所有行动的最终总结将会浓缩在一份简短的报告之中。在长期的计划之中，我们准备了一切我们可能需要的事物——装备和补给，部队训练水平与忠诚，后方工业的准备，人民群众的支持程度，以及其他各个领域的发展与合作。这都是一个长久，且复杂的计划的重中之重。俄罗斯已然做好了完全准备。\" RUS_SWRW_preparation.1.t:0 \"Затишье перед бурей"
 RUS_SWRW_preparation.1.t:0 "暴风雨前的宁静"
 RUS_SWRW_preparation.1.d:0 "摇曳的火光，噼啪作响的木柴，繁星点点的夜空。在离篝火约半公里处，是一个修理车间，即使从这里也能听到里面传来的叮叮当当的工作声。\n\n“吉尔同志，”身后传来一个声音。\n\n吉尔转过身，看到阿尔达舍夫正朝他走来。\n\n“向您致敬。”阿尔达舍夫看到吉尔的目光后说道。\n\n“坐吧，同志。”吉尔答道，同时猛吸了一口烟，又转过身去望着星空。\n\n阿尔达舍夫绕过篝火，坐到了吉尔的对面。过了一会儿，他掏出一支香烟，学着吉尔的样子，也猛吸了一口。\n\n时间一分一秒地过去，两位军官就这样默默地抽着烟，凝视着星空。\n\n“还记得几年前，我们头顶的天空被德国人的飞机遮天蔽日的时候吗？那时候，每一天都可能是生命的最后一天。”吉尔开口道。\n\n“记得，这种事是忘不掉的。”阿尔达舍夫答道，眼睛始终没有离开星空。\n\n“在政府和军事委员会的会议上，沙皇陛下明确提出，必须解放边境那边，被德军占领的土地上的人民。所有人都满怀热情地表示支持。但是，过去的阴影仍然笼罩着我们，每个人眼中除了坚毅之外，也都有那么一丝对未来的恐惧，虽然只是一闪而过。”\n\n吉尔停顿了一下，猛吸了一口快要燃尽的香烟，然后长长地吐出一口烟雾。他揉碎了烟头，扔进了篝火里。\n\n“现在，我们的任务，以及整个政府的任务，就是确保过去的阴影不再重现。”吉尔说着，站起身来，看着阿尔达舍夫。\n\n阿尔达舍夫若有所思，随后也站了起来，将手中的烟头扔进了篝火中，抬头望向吉尔。"
 RUS_SWRW_preparation.1.a:0 "我们会的。"
 RUS_SWRW_preparation.2.t:0 "起来，俄罗斯人民！"
 RUS_SWRW_preparation.2.d:0 "“同志们，欢迎你们！”一个女声对刚走进演播室的、身着军装的男子说道。\n\n中央广播电台和电视台是首都装备最好的演播室，每天都向这个崭新的俄罗斯的每一个角落进行广播。\n\n“您客气了，娜杰日达。我也很高兴终于能有机会来参观我们的新闻‘圣殿’了。”萨文科一边回答，一边和她握手，一边环顾着演播室。\n\n“我们也同样非常欢迎像您这样的重量级人物莅临本台。我们已经准备就绪，随时可以开始直播。请这边就座。”娜杰日达回答道，并用手示意他坐在桌子旁的一张椅子上。\n\n“谢谢。”萨文科简短地回答道。\n\n当所有人都就位后，演播室开始了现场直播，向全俄罗斯进行广播。\n\n“尊敬的同志们，大家好！这里是今日俄罗斯广播电台，我们今天非常荣幸地请到了尊敬的萨文科同志，他将为我们宣读我们敬爱的沙皇的讲话。我谨代表我们全体工作人员，向您致以最诚挚的问候！请讲。”新闻主播说道。\n\n“谢谢您，娜杰日达。”"
 RUS_SWRW_preparation.2.a:0 "团结起来，我们才能获得最终的胜利！"
 RUS_SWRW_preparation.3.t:0 "未雨绸缪"
 RUS_SWRW_preparation.3.d:0 "“停！——”教员大声喊道，然后低头看着停下的秒表。而就在他喊“停”的一瞬间，学生刚好把手中的步枪放到了桌子上，他一边继续检查着手中的步枪，一边观察着周围的情况，检查是否还有其他的问题。\n\n“好。彼得罗夫，不错，比规定时间快了两秒。现在轮到尼基京了。准备……开始！——”教员说道。\n\n秒针开始咔哒咔哒地走动起来。尼基京和他的同学们已经数不清这是他们第几次拆装手中的步枪了。但这门课程是每一个年满16周岁的男生的必修课，同时，也鼓励女生参加到这门课程之中。\n\n无论是中学、中专、大学甚至是研究院的学生，都必须参加强制性的基础军事训练并定期复训。\n\n培训内容不仅包括主要轻武器的基本使用方法，还包括急救、野外生存技巧、桑博格斗术等等。\n\n“停！——”教员再次大喊，此时步枪已经组装完毕放到了桌子上。\n\n“好，尼基京。干得漂亮，比规定时间快了一点五秒。\n\n“下一位，玛丽娅，准备……开始！”秒针再次开始走动。\n\n孩子们显然对正在发生的事情充满了热情，但当看到老师严厉的目光时，他们的脸上并没有表现出太多的喜悦。作为一名参加过西俄战争的老兵，老师的神情显得严肃而又阴郁，甚至可以说有些悲伤。他深知战争的残酷和其中生离死别的痛苦，也亲身体会过战场上的九死一生。他一直都对“伟大的卫国战争”、“为统一而战”这种官方的战争叙事颇有微词，更无法接受下一场战争正在日益逼近的残酷事实。老师的同事，以及全国许多感同身受的老兵们，也都笼罩在这种悲伤和阴郁的氛围中，久久无法释怀。然而，年轻的一代，他们最多也就只经历过“统一战争”那样的局部战争——而且绝大多数士兵都由老兵所组成。他们不理解战争究竟意味着什么，他们也从没有过这种恐惧，从不知晓“全面战争”这个概念究竟有怎样的分量。\n\n教员的思绪飘到了远方，几乎忘记了自己正在培训学员。直到他看见组装好的步枪被放到了桌子上，他才如梦方醒。\n\n“停！——”他大声喊道。\n\n“玛丽娅，不错，比规定时间快了两秒。”"
 RUS_SWRW_preparation.3.a:0 "“下一个！”"
 RUS_SWRW_preparation.4.t:0 "最好给山姆大叔打个电话"
 RUS_SWRW_preparation.4.d:0 "在美国国会议员代表们的簇拥下，俄罗斯驻美国大使穿过走廊，走向发言台。他此刻的紧张情绪也达到了顶峰，因为他深知自己肩负的重大责任。一走进宽敞的美国国会大厅，大使先生便看到了那些代表们正在迎接他的到来，大厅中还有着不计其数的、来自美国本土乃至全世界各个角落的、各个媒体的记者们和摄影师。\n\n在走上演讲台时，大使先生将早已准备好的演讲稿在桌上展开。此刻，议长也示意大家保持安静。当一切嘈杂都逐渐平息时，大使抬起头，面对着在座的每一位议员们说道：\n\n“首先，请允许我代表我们政府，我们的沙皇以及我个人向在座的所有人致以最诚挚的问候。”，大使以一口流利的英语说道。\n\n“今天，我站在这里，站在美国国会，这个全世界最伟大的民主国家之一、与法西斯暴行抗争的最前沿阵地，传达我国政府的一项重要委托。在过去那段艰难的岁月里，是OFN的成员们，在生死存亡的危急关头，选择了向我们伸出援手。现在，历史翻开了新的篇章，一个浴火重生的俄罗斯再一次出现在你们面前，而我们仍将坚定地和你们站在一起，对抗那个危及全人类的、共同的敌人——德意志！我们需要诸位的帮助！我们将和贵国一道，将这场抗争进行到底！”说完这些激动人心的话后，大使先生结束了演讲。这时，整个大厅中爆发出了雷鸣般的掌声。"
 RUS_SWRW_preparation.4.a:0 "山姆大叔从不拒绝帮助，更不会问东问西。"
 RUS_SWRW_preparation.5.t:0 "菊与刀之谊"
 RUS_SWRW_preparation.5.d:0 "招待贵宾的会客厅雍容华贵，陈设典雅。吉尔带着他的翻译以及几位军官和政治家，一边欣赏着日本艺术的美丽风光，一边收看着当地电视台播放的日本节目，就这样消磨了十分钟的时间。\n\n对面的沙发仍然空着，因为日本帝国外务大臣因故缺席了另一场会议，还未能及时赴约。\n\n接待方的服务无可挑剔，但这漫长的等待仍令人心生一丝烦躁。\n\n五分钟后，一位身着西装，脚蹬一双锃光瓦亮的黑色皮鞋，身材瘦小的日本人走进了房间。在走近吉尔后，他用日语向吉尔问好，坐在旁边的翻译立即开始将其翻译成俄语。\n\n“外务大臣向您表达最诚挚的歉意，并告知您，他的车队很快就将抵达。”他说道。\n\n在转达了吉尔表达感谢的话语后，大臣的助手（同样也是这为数不多的几人之一）离开了会客厅。\n\n“呼……这日本人的待客之道真是让我越来越捉摸不透了。毕竟他们和法西斯分子在某些地方还挺像的。天晓得他们心里究竟在想什么。”吉尔向他的助手抱怨道。\n\n“我同意您的看法，部长同志，但至少他们目前与纳粹德国是敌对关系，这总归对我们是一件好事。而且由于地理原因，他们向我们提供军事援助也比美国人要方便得多。”助手回答道。\n\n“嗯……你说的有道理。”吉尔简短地答道，并端起茶杯抿了一口。\n\n十分钟后，会客厅的大门突然洞开，日本外务大臣及其随行人员鱼贯而入。\n\n之后，双方进行了长达一个半小时的友好会谈，并最终在向俄罗斯提供军事援助的问题上达成了一致。"
 RUS_SWRW_preparation.5.a:0 "他们同意了？"
 RUS_SWRW_preparation.6.t:0 "于废墟之上起舞"
 RUS_SWRW_preparation.6.d:0 "这是一间隐蔽的游击队地下室，一台烧柴火的小火炉烧得正旺，水壶里的水也咕噜咕噜地响着。一张破旧的大桌子上摆满了各种地图和文件，游击队的指挥官们正围在桌旁激烈地争论着。这时，地下室另一头的老旧电报机突然响了起来。但指挥官们谁都没有注意到它，继续着他们的争吵。\n\n当电报机的响声停止几分钟后，一位通讯兵走到了桌旁。\n\n“安德烈耶夫同志，紧急消息。给您。”通讯员说着，将手中的电报纸递给了他。\n\n安德烈耶夫少校拿起电报纸开始读起来。在读完这条简讯后，他那满是胡茬的脸上露出了一丝令人难以琢磨的表情。\n\n“同志们，静一静！——”少校说道，地下室里随即安静下来。\n\n“我刚刚收到了来自总部的电报。一场由我们发起的、针对侵略者的大规模进攻就要打响了——包括他们所修筑的各类军事设施，诸如仓库、军营等等等等。而且……规模会比我们预计的还要大。”\n\n“就像我们所设想的那样，我们在敌人内部的那些志同道合的同志们，在听到我们俄罗斯将与侵略者决一死战的这个振奋人心的消息后，也都下定了决心，采取和我们一致的行动：与侵略者战斗到底，直到将他们彻底赶出我们的家园！”\n\n“我认为我们应该接受这个计划，并立刻开始行动！我们行动越快，对祖国母亲的帮助就越大！”少校一席话说完，指挥官们纷纷表示赞同。\n\n行动的最终方案和目标已经被确定下来了。现在，剩下的只有战斗，以及等待与大部队会师的那激动人心的一天！\""
 RUS_SWRW_preparation.6.a:0 "我们将战斗到最后一刻！"
 RUS_SWRW_preparation.7.t:0 "向沙皇的报告"
 RUS_SWRW_preparation.7.d:0 "吉尔站在一扇高大的橡木门前，犹豫着要不要推门而入。心中的不安逐渐在他身体里蔓延开来。经过这么多年的斗争，经过这么多个月的精心准备，吉尔站在沙皇的办公室前，准备汇报一切就绪的消息。\n\n在深吸了一口气后，吉尔推开了自己面前的这扇门，并将所有的计划在脑海中又过了一遍。进入办公室并关上门后，吉尔立刻将目光投向了沙皇的办公桌。但是沙皇并不在那里。\n\n“这边请，吉尔同志。”在听到这个声音后，吉尔将目光转向了窗户，在那里，他看到沙皇正站在那里，目不转睛地凝视着窗外。\n\n“陛下！”吉尔说道。\n\n“我已经读过了您和其他政府成员提交的所有报告，但我还想听一听您的汇报——以您自己的话，来亲口告诉我事情的进展。”\n\n“请您就座。”沙皇说着，走回了自己的办公桌。\n\n“遵命。感谢陛下。”吉尔一边回答，一边走向了沙皇的办公桌。\n\n两人刚一落座，吉尔就开始向沙皇汇报具体的计划和准备工作的进展情况。吉尔的报告越进行，他就越有信心在战争中获得胜利。"
 RUS_SWRW_preparation.7.a:0 "请继续，吉尔同志…"
 RUS_SWRW_preparation.8.t:0 "最终报告"
 RUS_SWRW_preparation.8.d:0 "持续了将近一个小时的报告，现在已经演变成了一场内容详尽的对话。在此期间，吉尔事无巨细地向沙皇汇报了一切情况以及行动计划的每一个细节，同时也认真地回答了沙皇提出的所有问题。从公文包中取出了最后一支香烟，吉尔将其点燃，并美美地吸了一口。\n\n“很好，吉尔同志。但请允许我提出最后一个问题：您个人对我军在即将到来的这场战争中获胜有多大信心？”\n\n沉思了几秒后，吉尔从椅子上起身，站得笔直，直视着沙皇的眼睛。\n\n“我，坚信，我们必将取得最终的伟大胜利。”吉尔语气坚定地说道，仿佛每一个音节都是从他的心底发出的。\n\n在听完他的话后，沙皇也从座椅上站了起来，向他伸出了自己的右手。\n\n“这很好。您，正如我们政府的其他成员，以及我们伟大的俄罗斯人民一样，都已经下定了决心，要取得最终的伟大胜利。而这，已经让我们距离最终胜利更近了一步。”沙皇说道。吉尔在听完后，紧紧地握住了沙皇的手。\n\n“在走入未知的同时，我们已经成功地进入了未来。”吉尔在心中暗暗想到。至少，他希望事情会这样发展。"
 RUS_SWRW_preparation.8.a:0 "胜利或死亡。"
 MAR_the_second_patriotic_war:0 "第二次伟大的卫国战争"
 MAR_the_last_fight:0 "背水一战"
 MAR_white_are_we:0 "我们是白军！"
 MAR_red_are_we:0 "我们是红军！"
 MAR_russians_are_we:0 "我们都是俄罗斯人！"
 MAR_imperial_nostalgia:0 "帝国遗梦"
 MAR_for_our_grandfathers:0 "为了我们的祖父辈..."
 MAR_onwards_bogatyrs:0 "罗斯勇士向前进！"
 MAR_and_our_fathers:0 "和我们的父辈"
 MAR_antifascist_brigades:0 "反法西斯旅"
 MAR_germans_did_that:0 "都是德国佬干的"
 MAR_german_free_army:0 "自由德意志军"
 MAR_arise_ye_downtrodden:0 "起来，不愿做奴隶的人！"
 MAR_break_the_german_machine:0 "粉碎德意志战争机器"
 MAR_patchwork_chimera:0 "东拼西凑的嵌合体"
 MAR_we_have_won:0 "为了我们的胜利！"
 MAR_the_second_patriotic_war_desc:0 "俄罗斯已做好准备收复那些失地，并解放被占领的地区。是时候驱逐那些法西斯侵略者、恢复历史的公正了。我们的人民已为这场为了自由的伟大斗争做好了准备，冲锋向前！"
 MAR_the_last_fight_desc:0 "这场战争不仅仅是为了夺回我们所失去的领土，更是为了俄罗斯的生死存亡而战！这场战斗的结果将会决定我们祖国的命运——是继续作为自由独立的国家存在下去，还是再一次沦为德国侵略者铁蹄下的奴隶。我们绝不能允许侵略者的铁蹄再次践踏我们的国土，这将是我们的最后一战。"
 MAR_white_are_we_desc:0 "我们是帝国皇权的继承者，辉煌的过往是我们未来胜利的基石。我们的祖先在曾经统一了这片广袤大地上的众多民族与文化，缔造了一个所向披靡的伟大帝国。在我们领导下的东欧、中亚和高加索，在当时俨然是坚不可摧的整体。现在，俄罗斯再一次为了自己在世界舞台上的应有地位而战，我们必须铭记祖先的光辉事迹，并从中汲取力量。收复自莫斯科到符拉迪沃斯托克的每一寸故土！"
 MAR_red_are_we_desc:0 "我们的政治体制中蕴含着大量社会主义的先进经验，而这些先进的理念恰好又根植于我国国民性的优点之中——崇尚集体主义和人民至上，这与西方国家所极力鼓吹的理念格格不入。正所谓‘道不同，不相为谋’，因此我们与纳粹分子的矛盾，也早已超过了个人矛盾，达到了路线斗争的层面。受到西方国家所控制的纳粹势力，早已失去了所谓的‘理想’和‘信仰’，沦为西方世界的附庸。他们苟活于世，贪图享乐的唯一方式就是不择手段地对内进行剥削，对外侵略掠夺。在他们的利爪之下，没有任何一方可以幸免，直到一方被彻底毁灭为止。如此意识形态上的敌人在本质上不可能与我们达成任何和解或共存。也正是因为这个原因，两个势力的最后结局只可能是一个‘你死我活’，即两种不同的意识形态，你消灭我或是被我消灭。每个俄罗斯人都需要认清到这一点：我们的抗争不仅仅是对某个具体政权或领袖的侵略和暴行做出反应，我们更是在努力彻底抹杀那些对我们而言最具威胁性的东西。为了正确地应对这样的威胁，我们必须比以前更认清‘我们是谁，我们从哪儿来’。我们需要团结一心，时刻警惕。"
 MAR_russians_are_we_desc:0 "对于德国人来说，我们是什么并不重要：白军、红军、无政府主义者、民主主义者，甚至是法西斯分子。对他们而言，我们都是“劣等民族”。尽管我们看起来似乎都是斯拉夫人，但令人感到无比讽刺的是，我们彼此之间却并非铁板一块。直到今天，在我们这个国家中，仍然存在着一种无形的隔阂，将人们划分成一个个模糊不清的小群体：“西伯利亚人”、“乌拉尔人”等等。更不用说我们军队中的大部分士兵都不止一次地更换过旗帜和制服了。因此，为了彻底击溃那头黑色的野兽，我们必须团结一心，抛开一切分歧和矛盾。\n\n我们都是俄罗斯人！为了将我们的家园从纳粹的魔爪中解放出来，从这一刻起，每一位俄罗斯人，无论男女老幼，都必须竭尽所能，为最终的胜利贡献出自己的一份力量。在统一的俄罗斯旗帜下，无数的英雄儿女将前赴后继，彻底消灭德国人及其走狗！\n\n向西，向着德国进军！"
 MAR_imperial_nostalgia_desc:0 "一次次内忧外患都无法击垮我们的国家，因为我们总是能浴火重生，变得比过去更加强大。俄罗斯输掉了第一次世界大战，随后，国内爆发了革命，令无数家庭支离破碎。但最终，布尔什维克基本保存了沙皇帝国的遗产，维护了国家的统一。尽管后来他们在同德国人的战争中落败，但是倘若这次我们击败德国人，那么俄罗斯必将以一个大国的身份再度崛起。"
 MAR_for_our_grandfathers_desc:0 "我们的祖父辈们曾在过去的战争中与德国人血战。彼时，国内矛盾重重，最终导致大业功亏一篑。但如今，我们吸取了过去的所有教训，绝不会再让历史重演。我们为了纪念先辈的功绩而战，我们为了子孙的未来而战。"
 MAR_onwards_bogatyrs_desc:0 "们的军队斗志昂扬，决心坚定。我们的宣传部门一直在向人民群众传递积极的思想，号召他们团结一心，并歌颂和赞美先辈们的丰功伟绩。我们将像史诗中的英雄们那样无所畏惧、所向披靡。\n\n我们必将取得最后的胜利！\n\n荣耀尽归俄罗斯！荣耀尽归祖国！"
 MAR_and_our_fathers_desc:0 "我们曾两次与纳粹强盗作战，两次都以失败告终。但透过泪水的薄纱，让我们冷静地审视过去的一切吧。当短视的欧洲资本主义政权对纳粹卑躬屈膝，不战而降的时候，只有英勇的苏联人民奋起反抗，令德国人寸土必争，血流成河。当软弱的资本主义政权背叛其国民，沦为德国走狗的时候，只有不屈的苏联人民揭竿而起，彻底推翻了腐朽的傀儡统治，予以德国以沉重打击，让那燃烧的纳粹垃圾场在崩溃的边缘苦苦挣扎。这其中的一切已经昭然若揭，既然局势在第二次尝试时就已经扭转，那么我们——责无旁贷地肩负着父辈们未竟的事业。\n\n 第三次，必须彻底摧毁这万恶的纳粹德国——将纳粹主义这滩污泥从我们的国土，以及东欧那些仍然饱受奴役的兄弟们的土地上彻底抹去，将这群衣冠禽兽隔离在它们那肮脏腐朽的老巢之中，在那里缓慢地烂掉。俄罗斯的人民曾经两次流下热血，只为争取一个光明的未来。他们是否白白牺牲，完全取决于我们今日的抉择。我们将接过父辈手中那抗争的旗帜，改变这个被诅咒的世界，让父辈的苦难不再是毫无意义的牺牲。伟大的卫国战争打输了，第一次西俄战争也打输了，但只要我们仍然奋战不息，这些失利就仅仅只是暂时的。只有我们才能够彻底清算一切侵略者，收复那些被侵占的土地，终结这一切！"
 MAR_antifascist_brigades_desc:0 "以社会主义为自身意识形态之一的我国，与世界各地或多或少带有左翼色彩的许多国家和政治力量保持着密切联系。或许共产国际已经随着苏联一同烟消云散，但那些立志于推翻现行政权、建立属于人民的国家而斗争的团体仍遍布世界各地，而在他们中不乏愿意参与到与这人类公敌进行直接作战的队伍中来。比如在欧洲，大大小小的起义团体不计其数，他们发誓要摧毁本国或本地区的现行政权，并在这片被他们斗争而净化的土地上建立人民的国家；以及听命于美国的社会民主党们，那些党团中怀有左翼倾向的民主派人士想要让大洋彼岸的山姆大叔看看自己的实力，顺便把一些“德国佬”送下地狱。与以上两方势力暂时搁置关于社会主义的诸多分歧而寻求共同战线与他们进行更深层次的沟通，为将世界从那“千年帝国”的阴影下彻底解放。通过这条隐秘的纽带，能够为我们换来任何可能的形式的合作和物质援助，将那些憎恨德国法西斯政权的人送到我们麾下并为我而战——无论他们属于何种势力，怀揣着怎样的意识形态。纳粹主义在世界各地树敌无数，毕竟当他们正在用刺刀捅你喉咙时，又有多少人会为这法西斯欢呼呢？"
 MAR_germans_did_that_desc:0 "实际上，德国人并没有做出任何与西欧诸国不同的暴行——这也是一个基本的事实：在印度支那，英国佬肆无忌惮地毒杀任何一个他们眼中的‘非文明人’，并在澳大利亚建立了数不清的集中营。与此同时，在法属西非，殖民者在那里大肆掠夺资源和人口。但令整个西方社会都对其本国的累累罪行充耳不闻的根本原因，将使得其只能在我们制定的计划中走向崩溃。首先，我们必须有确凿的、无从辩驳的德国人自己所犯下的种种罪行的铁证；甚至，如果有必要的话，可以适当伪造一些德国人屠杀俄罗斯人的视频资料，再想办法公之于众。其次，让西方的宣传机器突然“恢复”他们的报道自由。当今世界的第一强国仍然习惯于做世界警察，并对发生在全球每个角落的悲剧轻描淡写、充耳不闻。因此一旦我们选择采取行动，这将进一步推动美利坚做出某些非常出格的举动。那些未曾感受过我们那般苦难的外国人，他们的心中也必定怀揣着正义。而一旦其看到了确凿的证据，他们的民众便会将这些不满倾泻在那些无动于衷的政客身上，甚至会采取更加激进的行动。最后，我们可以向所有人，特别是德国人和美国人，保证我们将为他们的子女夺回被偷走的未来——而现在我们必须动用所有的军事和政治资源来实现这一点。"
 MAR_german_free_army_desc:0 "归根结底，德意志民族并非像纳粹宣传的那样是一个铁板一块的整体，他们之中也不乏良知尚存之人。甚至在国防军中也有这样一些勇敢的人，他们早已厌倦了为奴役其他民族而战，而是渴望为自身的自由而战。成百上千被我们俘虏的德军战俘声称，只要我们能够保证他们的人身安全和自由，他们就愿意调转枪口，与我们并肩作战。\n\n尽管这一举动可能会让我们背负一定的风险，但我们仍决定将这些向往自由的德国人团结起来，组建一支崭新的部队——德意志自由军。在未来的战争中，德国自由军所发挥的作用，或许将会类似于二战时期，德国人手中的俄罗斯解放军。此外，这支部队的成立，也会对纳粹的意识形态造成沉重的打击。"
 MAR_arise_ye_downtrodden_desc:0 "自第二次西俄战争爆发以来，成千上万自四十年代起就在各地坚持战斗的游击队员们再次拿起了武器，与德国人展开了殊死搏斗。但为了让这些星星之火尽快形成燎原之势，我们必须为他们提供更多支持。\n\n通过向那些最为活跃的游击队提供资金和武器，我们不仅能够对德国的后方造成严重破坏，也能激励其他仍在观望的游击队，促使他们采取更积极的行动。在为了自由而战的各支队伍之间形成一种良性的竞争关系，也将有助于加速德国的最终灭亡！"
 MAR_break_the_german_machine_desc:0 "国防军就是一台冰冷的战争机器。众所周知，任何一台机器都是可以被摧毁的。如果说士兵和军官们负责摧毁它的躯体，那么我们所肩负的，则是从精神层面来彻底摧毁这台机器。德国军人也是有血有肉的人，他们同样也有着自己的恐惧、欲望和担忧。\n\n利用这些弱点，我们可以摧毁他们的意志，让他们丧失战斗的欲望。当然，这是一项艰巨的任务，需要持之以恒的努力，但最终的结果必将证明我们的付出是值得的。"
 MAR_patchwork_chimera_desc:0 "不仅仅是前苏联地区的各个民族生活在德国人的压迫之下，还有捷克人、荷兰人、丹麦人、波兰人，以及其他许许多多的民族都在遭受着同样的命运。如果我们将其一一列举出来，恐怕三天三夜也说不完。\n\n这些民族已经在德国人的铁蹄下忍受了太久太久，但现在，他们看到了重获自由的曙光！\n\n通过唤醒这些被大日耳曼国所奴役的各民族的民族意识，虽然我们无法立即引发一场全面的起义，但这仍将加剧德国内部的紧张局势和各种矛盾，当然，这些麻烦针对的是德国的核心地区，而不是它的那些专员辖区。"
 MAR_we_have_won_desc:0 "莫斯科、罗斯托夫、格罗兹尼、塞瓦斯托波尔、顿涅茨克、基辅、明斯克、维尔纽斯、里加和塔林，如今都已重获自由！\n\n随着大日耳曼国签署投降书并放弃其所有的东欧专员辖区，我们可以自豪地宣布：有史以来俄罗斯所经历过的最艰难、最具决定性意义的战争已经结束了。而这场战争，也以俄罗斯的全面胜利而告终！\n\n尽管我们仍然需要为重建满目疮痍的家园而付出艰苦卓绝的努力，但生活在这些解放区的人民，在经历了数十年法西斯的压迫后，终于能够自由地呼吸了。\n\n而实现这一目标的代价远没有我们过去所经历的那些苦难那般沉重。从一个四分五裂的军阀割据政权，到成长为一个拯救了整个欧亚大陆的强大国家，我们的付出终于得到了回报！\n\n全世界的目光都聚焦于我们，因为以弱胜强的我们，最终战胜了看似不可一世的巨人。\n\n\n§Y我们胜利了！乌拉！乌拉！乌拉！§!"
 MAR_cold_world:0 "冰冷的世界"
 MAR_avesta_of_black_and_white:0 "黑白两色的阿维斯塔"
 MAR_golden_fantasia:0 "金色幻想曲"
 MAR_melty_blood:0 "消融之血"
 MAR_we_shall_all_go_to_heaven:0 "我们将去往天堂..."
 MAR_cold_world_desc:0 "难道我们又一次失败了吗？我们民族那炽热的鲜血正在逐渐冷却，而整个世界却对此漠不关心，袖手旁观。我们没有任何盟友，没有任何朋友，更没有任何值得信赖的伙伴。但即使是在这暗无天日的时刻，在所有希望都已破灭之际，我们也绝不会屈服。或许，我们早已失去了取胜的希望，但我们绝不会停止抗争。我们将战斗到最后一刻，让每一个胆敢踏上我们国土的纳粹杂碎血债血偿！又也许，我们还可以顺便让这个冰冷无情的世界为我们陪葬。"
 MAR_avesta_of_black_and_white_desc:0 "我们的军队正在分崩离析。接连不断的失败让他们忘记了自己肩负的神圣使命——保卫我们的祖国和人民。现在是时候重新唤醒他们心中那军人的荣耀了，让他们铭记先辈们为了俄罗斯而抛头颅洒热血的英雄事迹。军人的荣誉准则绝不能被遗忘。"
 MAR_golden_fantasia_desc:0 "那些叛徒们正准备逃离我们的国家。他们早已做好了抛弃自己苦难的祖国的准备，妄图在国外寻求所谓的“幸福”和“安宁”。但他们的如意算盘绝不会得逞，他们的财产将被悉数没收，而他们本人也将受到应有的惩罚。谁出卖祖国换取金钱，谁就等于亲手将自己的母亲送上了断头台。"
 MAR_melty_blood_desc:0 "俄罗斯早已是满目疮痍，尸横遍野。我们民族的精英，那些年轻的爱国者们和充满斗志的士兵们，早已在战场上献出了自己宝贵的生命，他们的英魂永远地留在了那片洒满鲜血的土地上。他们都是英雄，他们为了祖国的未来献出了自己的一切！然而，德军那如同潮水般的攻势却丝毫没有减弱。我们必须动员所有有能力拿起武器的人，来阻止德国人的进攻。愿上帝保佑我们。"
 MAR_we_shall_all_go_to_heaven_desc:0 "现在是时候承认这一残酷的现实了。我们在每一条战线上都一败涂地。我们的军队早已溃不成军，我们的人民早已心灰意冷，而我们的经济也如同一座纸牌屋般摇摇欲坠。然而，即使是在这至暗时刻，我们仍然抱有一线希望——希望所有这些牺牲都没有白费。即使那些纳粹恶魔们已经踏上了我们的国土，我们仍然握有最后一张王牌——核武器！这是我们最后的机会。也许我们无法拯救俄罗斯，也无法拯救我们的人民，但我们能够拯救整个世界，让其免遭纳粹瘟疫的荼毒。如果整个世界都将与我们一同毁灭，那也算不上什么坏事。毕竟，一个没有了俄罗斯的世界，又有什么存在的意义呢？"
 RUS_SWRW.7.t:0 "人民的军队，自由的军队"
 RUS_SWRW.7.d:0 "海因茨·凯斯勒将军又一次环视着整齐列队的士兵们，这已经是他今天第数不清多少次的巡视了。而每一次，他都感到无比的失望，以及对他本人和他麾下的部队的信心不断流逝。德意志自由军——这个名字倒是起得响亮而自豪，但这真的名副其实吗？这些士兵真的配得上这支军队的称号吗？他们中间有多少人经历过真正的战争，又有多少人不过是乳臭未干的毛头小子，被送来这里白白送命呢？他们中又有多少是为了“自由德意志”的崇高理想而战，又有多少只是走投无路的无奈之举呢？他不知道，也不敢去知道。\n\n在德意志自由军短暂的组建和训练的时间里，他们已经经受过了地狱的磨炼，但如今也能感受到些许胜利的荣光。凯斯勒本人的意志也本该在那黑暗岁月的摧残下摇摇欲坠。但每当看到那些洋溢着笑容和决心的面庞时，他仍然感到欣慰和鼓舞。将军如同他身后那笔直的雕塑般，站得更加挺拔，开始竭尽全力喊道：\n\n“同志们！我的朋友们，还有士兵们！”——“同志”，他没记错的话，士兵们似乎更喜欢这个称呼——“许久以来，我们中的很多人都渴望从那残暴的僭主和独裁者的手中夺回我们的权力！多少个日夜以来，无数同我们一样怀有崇高信仰的勇士前赴后继，只为让胜利的天平向我们这边倾斜——为了将那个僭主彻底消灭！那样的日子早已一去不返——我们的力量正在日益壮大！”\n\n凯斯勒将军慢慢地走在曾经树立纪念碑的基座上。他回忆起，在第一次东线战争之前，德国人在这里为希特勒立了一块纪念碑。这时，将军的眼神再度回到那些英勇无畏的战士们身上，他继续说道：\n\n“战士们，好好听着，这场战争，将是我们每个人的机会！去赢得一个崭新的、自由的德意志的机会！去赢得一个真正平等博爱的德意志的机会！一个彻底从法西斯分子的暴行和阿道夫·希特勒那早已腐朽不堪的遗毒中彻底解放的德意志！我们将夺回我们的祖国！”海因茨猛地转过身，指向了东方。“在柏林，在慕尼黑，在柯尼斯堡，甚至在美因河畔法兰克福和维也纳！千千万万和我们一样向往着自由的德意志民众仍然在那里受苦受难！加入我们的队伍吧！为了德意志，为了德意志的人民而战！是时候让第三帝国的暴君们血债血偿了！是时候建立一个崭新的、属于人民的德意志了！”"
 RUS_SWRW.7.a:0 "这算背叛吗？"
 RUS_SWRW_mech.1.t:0 "彼得格勒的解放"
 RUS_SWRW_mech.1.d:0 "近日，为了这座在我国历史上具有重要地位的城市，已经爆发了数次规模庞大的冲突。作为旧时帝国首都，它汇集了历史长河中许多具有里程碑意义的事件，也令这座城市染上了许多鲜血。但今天，它是这个世界中最伟大战役中的焦点之一。\n\n尽管德国的平民们排着长队逃离，但许多在之前被“东方专员辖区”束缚的人们奋起反抗他们残暴的侵略者们。许多人自愿地破坏他们的工厂与铁路——这种行为为即将打响的进攻提供了无可替代的帮助。\n\n每次战争都会上升到一个全新的台阶：争夺每一条街道，每一个街区，甚至每一栋房屋，河流以及运河的战斗都不曾停息。交战双方都没有表露出退让的意思。尽管俄国军队尽力在推进中不断包围“德意志国防军”，并将其逼至城市的边缘，德军仍然妄想能够通过占据居民楼的方式来延缓俄军的步伐，即使是平民百姓居住的房屋与名胜古迹，也依旧被德军所利用。但对于从莫斯科一路挺进至此的俄国士兵来说，这种方式顶多延缓他们的攻势——英勇的俄国战士很快就会攻陷并解放这些地方。\n\n交火声、炮弹爆炸声，人们撕心裂肺的叫喊声，各种载具引擎发出的轰鸣声在数日以来从未停息。直到一刻，这些令人感到不安的杂音戛然而止——现在该让那些曾经以为自己能够支配他人的人，尝尝战败的滋味了。\n\n终于，那具有象征意义的一刻来临：列宁格勒彻底从纳粹的魔爪中解放了！尽管不久之前它还是一个美丽的城市，如今已经成为一片废墟。我们自豪地宣告，这场战斗的胜利象征了英勇的人民那坚不可摧的决心，也昭示了整个国家的未来！英勇的战士们那一次又一次雷鸣般的炮击让所有人都清晰地意识到：帝国找回了曾经属于自己的东西。这座城市，将会成为点亮俄罗斯未来的灯塔，同时也将作为一个例子而让人们铭记于心。"
 RUS_SWRW_mech.1.a:0 "光荣属于彼得格勒！"
 RUS_SWRW_mech.2.t:0 "伏尔加格勒的黎明"
 RUS_SWRW_mech.2.d:0 "伏尔加格勒，这座满目疮痍、遍体鳞伤的城市，在历经了漫长的战火洗礼和无数的苦难后，终于被我们解放了。一些士兵走在城市的废墟之中，想要努力从这些断壁残垣中找寻这里往日的光辉。一位战士在一座勉强矗立的塔楼上停下了脚步，想要俯瞰整座城市。他缓缓地从口袋中掏出一支香烟，却发现自己无论如何也找不到打火机了——或许它早已在那冲天的火光中不知所踪。突然，有人向他走了过来，并递给了他一盒火柴，于是，这段静默的时光在两人的沉默中延续着。\n\n“望着这片废墟，心中涌上一股莫名的悲凉，”第一位士兵开口打破了沉默，“就在几小时前，我还恨不得自己能立马从这里消失，但现在，却只想从这些瓦砾中搜寻到一些关于这座城市的记忆。”\n\n“面对着这一片荒芜，又有什么好看的呢？”第二位士兵意兴阑珊地叹了口气，无力地靠着那摇摇欲坠的墙壁，“我从未想到自己会经历这样的惨剧，只是站在这里亲眼见证这一切，就已经让我不寒而栗。你瞅瞅那些年轻人，有许多甚至从未摸过枪。但等到战斗真正打响，这些初出茅庐的新兵就被推上了战场，这他娘的简直就是一场血腥的屠杀！我们脚下的每一寸土地，都是用鲜血浸透的，这其中有敌人的，但也有我们自己人的。每攻下一座建筑，我们都要付出血的代价。那些无谓的牺牲换来了一波又一波毫无意义的攻势。”\n\n“太多的人死去了。我到现在还能记起那些再也无法与家人团聚的人们的面孔。我尽力去救了，但终究也只有屈指可数的几个人侥幸活了下来。硝烟与战火，妇女和儿童的哭喊与惨叫，这一切，令人绝望......”\n\n“我们似乎是在为一个渺茫的希望而战。但最讽刺的是，我们最终还是赢了。德意志人被彻底击败，但我们为了这场胜利又付出了什么呢？太多，太多了，或许已经将一切都搭了进去！”\n\n“即便如此，我相信伏尔加格勒终将从这场浩劫中恢复过来。许多年后，人们终将重建这座伟大的城市，到了那时，他们将能够再次自豪地抬起头来，面对这座不朽之城。这一点我坚信不疑。”"
 RUS_SWRW_mech.2.a:0 "伏尔加河畔的这座城市必将战胜一切艰难险阻。"
 RUS_SWRW_mech.3.t:0 "叶卡捷琳诺达尔的光复"
 RUS_SWRW_mech.3.d:0 "阴霾消散，万里无云。尽管昨日还乌云密布，但在今天，灿烂的阳光又重新回到了这座饱经战火洗礼的城市之中。战士们早已疲惫不堪，那温暖的阳光无力地洒在他们倦怠的脸上，此时此刻，他们刚刚将敌人彻底驱逐出了自己的家园。所有的人——无论是偶尔还是刻意为之——都会抬起头，望向天空，望向那象征着光明的太阳，感受着这一刻的安宁与祥和。叶卡捷琳诺达尔的居民们正与那些进驻到城内进行休整的将士们进行着亲切的交流：\n\n对于死亡的恐惧赋予了这支军队异乎寻常的力量，他们的敌人无所不用其极，想要阻止他们前进的脚步。敌人那邪恶的本性暴露无遗，对他们而言，似乎已经没有什么能够阻挡他们了——只有那源自内心的兽性在驱使着他们继续“战斗”下去。战斗的确异常艰难，但胜利终将属于那些从东方而来的将士们。\n\n尽管攻克这座城市花了很长时间，但胜利却并未因此而变味。在场的所有群众之中，没有一个人因此而陷入绝望。他们的眼神无比坚定，因为正是这份信念将一直引领着他们走向光明的未来。今日的叶卡捷琳诺达尔将会永远铭记这座城市所经历的一切，并积极为即将到来的新生活做好准备。\n\n有些人自发地去清理废墟，有些人前去寻找那些在废墟下等待着救援的人们。有些人前去确认那些牺牲的战士，以确保他们的在天之灵得到安息。尽管所有人都感到疲惫，但却没人打算去休息，因为他们都知道，新生的曙光已经刺破黑暗，照耀在每一寸俄罗斯的土地上。为了迎接那光明灿烂的未来，每个人都必须加倍努力，为新生活的到来做好充足的准备。"
 RUS_SWRW_mech.3.a:0 "光明再一次笼罩叶卡捷琳诺达尔。"
 RUS_SWRW_mech.4.t:0 "高加索，石油之都"
 RUS_SWRW_mech.4.d:0 "高加索山脉向来在地缘政治中都扮演着十分特殊的角色，无论是其自身的地理位置，还是其地下所蕴藏的丰富资源（特别是石油资源），无一不令各国为之垂涎三尺。曾经世代生活在这里的人们在外部势力的政治游戏中被当成了棋子，或是在各方力量的干涉下爆发内部冲突。高加索就宛若一个随时都可能引爆的火药桶，稍有不慎就可能酿成巨大的灾难。\n\n高加索地区各民族的人们都拥有各自的独特的文化以及诉求。然而这些诉求总与外来的那些所谓的“文明人”格格不入。两头庞然巨兽间的冲突又一次将这片土地拖入了战争。\n\n穿过高加索的崇山峻岭，俄罗斯帝国军队将这座命途多舛的城市——巴库——作为此次军事行动的核心目标。这座城市所处的地理位置也使得这注定将是一场特殊的军事行动：在山地作战，过去那些诸如闪电战以及大纵深突破一类的作战理论难以得到执行。因此，耐心和毅力是这场持久战中不可或缺的要素。我军的战略目标是通过持续不断的进攻和骚扰，在最终决战前将敌人的有生力量消灭殆尽。德军被迫开始成批成批地投降：其中一些被就地处决，剩下的则沦为战俘。对于德国人而言，失去巴库意味着他们失去了自己在高加索地区最为重要的战略据点。\n\n随着解放，人民逐渐走出了自己家中的避难所，涌上街头，自由的欢呼声再次回荡在这座城市的每个角落。尽管仍然有少数的死硬分子对德国人表忠心，并与人民为敌，但绝大多数的当地民众都热情地欢庆高加索地区从德国的占领中彻底解放出来。"
 RUS_SWRW_mech.4.a:0 "而现在，那些宝贵的资源终于回到了我们的手中。"
 RUS_SWRW_mech.5.t:0 "哈尔科夫的春天"
 RUS_SWRW_mech.5.d:0 "从蹒跚学步的幼童到白发苍苍的老人，所有东欧人民都在用自己的血肉之躯，筑成了一道对抗德意志侵略者的钢铁长城，无数可歌可泣的英雄事迹从这片饱经苦难的土地上传遍四方。而从压迫与奴役中淬炼出团结之心更是将不同民族、不同信仰的人们都联结到了一起，这其中尤以乌克兰人民的精神最为耀眼，也最为使人印象深刻。虽然他们曾一度在苏联的旗帜下建立了属于自己的国家，但在面对侵略者的炮火时，这些昨日还对“红色邪说”深恶痛绝的人们，却不得不向现实低下他们那高傲的头颅，沦为了那些自认为是“高等民族”的玩物。\n\n人民心中郁积已久的不满终于爆发了，复仇的怒火也在此时此刻被彻底点燃。那些躲藏在哈尔科夫地区的抵抗组织，开始密谋如何推翻德意志的统治，从可憎的侵略者手中解放自己和自己的家园：\n\n突然，一个意料之外的消息传来：俄罗斯帝国，如同浴火重生的凤凰一般，已经向这些压迫者们发动了猛攻！当俄罗斯的军队进入哈尔科夫地区后，他们受到了人民群众的热烈欢迎——简直如同救世主一般。\n\n激烈的战斗只持续了几个小时，但战斗结束后，所有人都明白了：人民的欢呼并不仅仅是为了庆祝战斗的胜利，更是为了一雪前耻。德国人被彻底击溃，仓皇逃窜，狼狈不堪。\n\n俄罗斯帝国没有放缓向西进攻的步伐，将一个又一个民族从水深火热之中解救出来。而那些直到前一天还不得不向那些“高等人”摇尾乞怜的人们也终于可以放下心中的恐惧，并大声呼出那郁积已久的浊气。"
 RUS_SWRW_mech.5.a:0 "团结所有仍未放弃希望的人们。"
 RUS_SWRW_mech.6.t:0 "基辅的金灿田野"
 RUS_SWRW_mech.6.d:0 "俄罗斯大军的将士们深知，他们所付出的一切都是值得的，都将得到丰厚的回报。而今，随着一个对俄罗斯而言具有重大意义的城市——基辅的光复，这场战争也终于迎来了又一个高潮。围绕着基辅控制权的战斗已经到了白热化的阶段，敌我双方都不惜任何代价，只为了获得这场战斗的最终胜利。\n\n一小队刚刚获得了一场关键性胜利的士兵们正在穿过一片曾经绿意盎然、如今却早已化为一片焦土的田地，准备进行休整。其中一位在战斗中腿部负伤的士兵一瘸一拐地走在队伍的最后，他拄着一根临时找来的木棍，以免自己掉队。这时，他发现路边不远处有一个小小的身影，那是一个小男孩，正目不转睛地盯着一个小土堆，仿佛周围的一切都与他无关。\n\n“你在那里做什么呢？到处乱跑可不是个好主意，现在可不太平。”刚刚走上前来的士兵说道。\n\n“我和我的家人告别，”小男孩冷冷地回答道，“他们和其他许多人一样，都被德国人杀害了。他们杀死了任何他们认为是叛徒的人。”小男孩继续说道，面无表情。但所有人都知道，他只是在强忍着泪水。\n\n“我很抱歉……”士兵费力地蹲了下来，尽管很艰难，但他还是做到了，“就像天平两端的砝码，敌我双方的力量对比一直在不停地变换。双方都在不断地投入更多的兵力。而最后，我们赢得了这场战斗的胜利。你可能还无法理解这一切，但你要知道，只要你从这一切中坚持了过来，你就已经足够强大了。那些牺牲的人们，他们知道自己的孩子有着足够的勇气和毅力去为自己，也为其他人争取更美好的生活，那么他们的牺牲也绝非毫无意义。我们如今能站在这里，多亏了他们那无比珍贵的馈赠——自由。所以，去珍惜这来之不易的一切吧，用你的实际行动告诉所有人，你已经准备好迎接新的生活了。尽你所能地去帮助其他人吧，帮助你的城市从废墟中恢复过来，让它重新焕发昔日的荣光。去珍惜你所拥有的，并亲手去创造崭新的未来吧。”\n\n小男孩擦了擦眼角的泪水，转过身去，此时的士兵已经挣扎着站了起来，并努力地朝他的队伍追赶过去。\n\n“谢谢您！”男孩冲着这位陌生人的背影喊道。"
 RUS_SWRW_mech.6.a:0 "让我们为了自由而战。"
 RUS_SWRW_mech.7.t:0 "飘扬在明斯克的旗帜"
 RUS_SWRW_mech.7.d:0 "火炮的轰鸣声不绝于耳，尽管德军还在做着困兽之斗，但这座城市里所有的人民都明白，他们的好日子到头了。战斗从清晨一直持续到黄昏时分，在这段时间里，帝国军队不断压缩着德军的防线，试图尽可能地将更多的敌军成建制地包围起来。德军一边溃逃，一边还在做着无谓的抵抗，甚至不惜破坏这座城市里的一切基础设施。当夜幕降临时，欢呼声响彻城市的每一个角落——敌人终于被赶跑了！\n\n士兵们在饱经战火蹂躏的街道上有序地行进着，他们骄傲地抬头仰望着那些象征着胜利的旗帜。这正是他们梦寐以求的时刻！人们也纷纷走出自己的藏身之处，来到大街上欢迎这些将他们从纳粹铁蹄下解放出来的英雄们。\n\n这座城市已经被彻底摧毁。也许那些见证过明斯克昔日辉煌的人们已经永埋于地下，但这座城市中的每一位居民的心中却充满着希望和对未来的憧憬。而那些用鲜血和生命换来这一切的人们则将自己的目光投向远方。\n\n自由的滋味无与伦比，特别是当你为了获得它而付出了一切之后，这感觉尤为强烈。"
 RUS_SWRW_mech.7.a:0 "现在，唯有我等，才是那自由的守望者。"
 RUS_SWRW_mech.8.t:0 "破碎的克里米亚明珠"
 RUS_SWRW_mech.8.d:0 "在曾经那座伟大而美丽的城市附近的一处碎石海滩上，一位路人停下了脚步，他的眼神中充满了迷茫，自言自语道：“接下来，我们究竟该何去何从？”就在几个小时前，一场激烈的交锋席卷了这座城市，各种口径的火炮奏响了震耳欲聋的死亡交响曲，这一幕令每一个亲历者都为之胆寒。人们纷纷躲进自家的地下室或是早已被废弃的防空洞中，在炮弹的呼啸声与建筑物的倒塌声中瑟瑟发抖，心中默默祈祷着这场浩劫尽快过去。当日晷上的指针指向1时，那进攻一方发起最后的猛攻，为了争夺塞瓦斯托波尔的控制权，这场人类之间的互相杀戮终于达到了顶点。\n\n在人们的庇护所外，那些嘈杂而又令人恐惧的呐喊声与炮弹的爆炸声不绝于耳，这些声音就如同用一把钝刀子在他们那早已伤痕累累的心脏上反复切割，而且每一秒似乎都变得更加清晰。对于被围困在城中的人们来说，时间在这一刻仿佛停下了脚步，无休止的恐惧和煎熬仿佛已经持续了一个世纪。\n\n经过了一段漫长而又痛苦的等待，俄罗斯军队终于突破了敌人的最后一道防线，并消灭了那些负隅顽抗的侵略者。市民们也开始小心翼翼地走出家门，查看这座饱经战火摧残的城市。与其他那些重获自由的城市不同，塞瓦斯托波尔的解放并未伴随着欢呼雀跃——这里的气氛压抑而又沉闷，对未来生活的忧虑取代了劫后余生的喜悦，深深地笼罩着这座城市中每一个幸存者。\n\n那些被迫背井离乡的德国移民家庭收拾细软，开始离开这座城市，因为他们清楚地知道，留给他们的时间已经不多了。尽管对死亡的恐惧仍然萦绕在他们心头，但这些败军之将却惊奇地发现，前来“接收”这座城市的俄罗斯士兵并没有难为他们，只是用他们那深邃的目光默默地注视着这些仓皇逃窜的“高等民族”。在沉默中爆发的情绪，有时比任何语言都更具杀伤力。\n\n许多人不知道自己该何去何从，只是下意识地涌向海滩，面朝着那一望无际的黑海，每个人都在思考着未来。但至少他们能够达成一项共识： “一切都将迎来新的开始。”而对于那些仍然选择留下来的人而言，重建这座伤痕累累的城市无疑是一项无比艰巨的任务，但这同时也是他们义不容辞的责任。"
 RUS_SWRW_mech.8.a:0 "黑海的蔚蓝将会抚平一切创伤。"
 RUS_SWRW_mech.9.t:0 "波罗的海的进军"
 RUS_SWRW_mech.9.d:0 "苦难、力量、威胁和胁迫——这便是大日耳曼国一切统治的基础。他们对于任何敢于表达自己不满或质疑其统治的人都大打出手，并以骇人听闻的残暴手段对其进行镇压，这也为它自己树立了越来越多的敌人，这其中也包括那些位于东西方势力夹缝中的波罗的海诸国。面对着两个庞然大物，波罗的海人根本不知道自己该何去何从，最终也只能无奈地沦为他人手中玩弄的提线木偶，任人宰割。\n\n在多年的忍辱负重后，里加（东方专员辖区的首府）的民众终于等来了一线希望：先是有传言，紧接着各个渠道都开始传出，一支强大的俄罗斯军队正朝着这里全速前进，其目的便是要将这里的人民从法西斯和纳粹的魔爪中彻底解放出来。希望的火花开始在这片土地上的每一个角落中迸发出来，复仇的火焰开始熊熊燃烧，炮弹的轰鸣声也越来越近，居民们也自发地行动起来，开始袭击那些还未来得及撤走的侵略者。尽管巷战仍在继续，但当这一切逐渐尘埃落定时，人们却迟迟不敢走出自己的藏身之处。只有几名勇敢的民众走出家门，然后很快，越来越多的人也跟着走了出来，最后，人群如同决堤的大坝一样涌上了街头。\n\n也许这就是那些为了实现某种目标，一个不同于被强加在自己头上的目标而不断奋斗的人们的梦想吧？士兵和平民们都一言不发。最后，双方都欣喜若狂地拥抱在一起。诚然，在他们之间，还残留着一丝隔阂和猜疑，但当务之急是展开精诚合作，共同建立一个不再有暴政和压迫的、崭新的国家。每个人都将为此而竭尽全力。"
 RUS_SWRW_mech.9.a:0 "强者绝不畏惧做出改变。"
 RUS_SWRW_mech.10.t:0 "翱翔于克里姆林宫上空的俄罗斯雄鹰"
 RUS_SWRW_mech.10.d:0 "经过数月的血战和巨大的牺牲，莫斯科——这座俄罗斯的心脏，终于回到了祖国的怀抱。这座城市见证了德意志占领时期的黑暗岁月，如今已是满目疮痍：街道上布满了炮击后留下的坑洞，许多建筑物已化为一片废墟；在仓促搭建的街垒上，依稀可以看到那些触目惊心的标记。\n\n一份紧急报告中指出，莫斯科的情况极为危急。城市的基础设施已彻底瘫痪：发电站和交通枢纽都已无法使用，居民们正遭受着饥饿和疾病的困扰，急需医疗救助，此外，危房问题亟待解决。最令人揪心的是，克里姆林宫和其他具有重大历史意义的建筑，或多或少地受到了战争的破坏，有一些甚至完全坍塌，荡然无存。\n\n一项城市重建计划被火速制定了出来。而重建计划的第一步便是恢复社会秩序：清除德军埋下的地雷，抓捕那些仍然潜伏在暗处企图负隅顽抗的敌军残部。只有在这一系列目标实现后，莫斯科才称得上是安全的，重建工作也才能展开。难民安置工作也已启动，第一批运送食物、药品和临时住所的人道主义援助车队已经在赶来的路上。俄罗斯军队的各个部门都被临时安置在尚未被彻底摧毁的建筑里，同时民事管理机构也在有条不紊地组建中。\n\n俄罗斯政府强调说：夺回莫斯科仅仅是一个开始。想要将首都恢复成一个在政治、经济和文化上充满活力的中心城市，我们还有很长的路要走。为了实现这个目标，必须充分调动所有可用资源。即使是在这场惨烈的卫国战争仍未彻底结束的今天，为了实现这些计划，人民仍然需要付出更多的努力，并将满腔的热情投入到生产和建设之中。\n\n莫斯科回到了我们手中——俄罗斯的旗帜再次飘扬在克里姆林宫的上空！与大日耳曼国之间的大决战仍将继续，国家也尚未完全光复，全国上下都必须经受住这些残酷的考验，并竭尽所能夺取最终的胜利！但这也将极大鼓舞我们的盟友，并进一步打击我们的敌人。"
 RUS_SWRW_mech.10.a:0 "我们将永远铭记：“我们的背后就是莫斯科！”"
 RUS_SWRW_mech.11.t:0 "坚韧不拔的伏尔加格勒"
 RUS_SWRW_mech.11.d:0 "伏尔加河那曾经汹涌澎湃的河水，也终于平息了下来。那些早已干涸的血迹，如今已化为这静静流淌的河水的一部分。不久前，德俄两军还在这座城市展开最后的决战，双方都为了攻下这座具有重要意义的城市而杀红了眼。\n\n伏尔加格勒如今已经成为了人类苦难的丰碑，无处不在的枪炮声以及爆炸声仍在时刻提醒着人们战争的残酷。来自各方的报告一致指出：城市的情况已经到了令人绝望的地步。曾经使这座城市成为一个适宜居住之所的所有设施都已毁于一旦。无数的建筑物早已化为一片焦土，只有一些建筑物的残骸仍然顽强地挺立着。\n\n许多有幸在德军的统治下幸存下来的平民百姓，如今正过着食不果腹、衣不蔽体的生活。他们漫无目的地在城市中游荡，试图找寻哪怕是一丁点儿生的希望。尽管此时此刻，他们那卑微的愿望早已破灭，所有人的精神都已经麻木，但即使在这种情况下，也没有人选择轻言放弃，而是为了那一丝生存下去的希望而苦苦挣扎。\n\n即便军队不断承诺说，光明的未来必将来临，但他们的计划依旧遥不可及。这些承诺有可能是发自内心的，但在人民的心中，唯有那虚无缥缈的希望还在苦苦支撑着他们的精神世界。对于他们来说，伏尔加河已然成为他们精神的象征：它的河水中倒映着那昔日美好的回忆，而那仍在苟延残喘的德意志侵略者和那仍在世界各处负隅顽抗的敌人们也终将被彻底消灭。许多人都已筋疲力尽，但为了生存下去，所有人都必须拼尽全力。"
 RUS_SWRW_mech.11.a:0 "伏尔加河，她将铭记一切。"
 RUS_SWRW_mech.12.t:0 "燃烧的高加索之城"
 RUS_SWRW_mech.12.d:0 "在崎岖的山峦之间，隐藏着一个临时搭建的野战指挥部，几位久经沙场的指挥官们正围坐在一起，商讨着在高加索地区下一步的军事行动，以求继续保持当前的攻势。\n\n“巴库已经被我们拿下！”一名刚刚风尘仆仆赶到指挥部的士兵大声说道，他甚至来不及向上级敬礼，便迫不及待地宣布了这个振奋人心的消息。\n\n“战况如何？”几位指挥官异口同声地问道，他们迫切地想要知道前线的每一个细节。\n\n“唉……这……简直就像人间地狱……”士兵的声音开始微微颤抖，“德国人进行了疯狂的抵抗，他们不惜一切代价，想要阻止我们的进攻。每一个街区，每一栋建筑都被他们改造成了堡垒，我们每前进一步都要付出巨大的代价……他们把这里变成了真正的地狱……”士兵停顿了一下，擦了擦额头上渗出的汗珠，继续说道，“最后我们总算是把这些德国鬼子都打垮了。他们一部分投降了，一部分自杀了，还有一部分则侥幸逃脱了。但我们也有许多优秀的战士再也无法看到胜利的那一天了……”\n\n“城市现在情况如何？”一名指挥官关切地问道。\n\n“一片废墟……到处都是残垣断壁和焦土！这里几乎所有的一切都被战火吞噬了，被彻底摧毁了。这里的人民无家可归，他们精疲力竭，饥肠辘辘。我不知道需要付出怎样的努力才能让这座城市恢复往日的荣光……”\n\n一位军官从行军桌旁站了起来，慢慢地走到士兵身边，将手轻轻地搭在他的肩上，安慰道：\n\n“我们赢得了这场战斗的胜利。我们付出了沉重的代价，但这也再一次向全世界证明：从士兵到元帅，所有人都在为祖国而战！我们不是为了虚无缥缈的利益而战，我们是为了解放而战！而现在，我们的任务就是重建巴库，让它比以往更加繁荣昌盛！”\n\n士兵向指挥官敬了一个标准的军礼，然后转身离开了这间屋子。尽管战斗令他身心俱疲，但他仍然强打起精神，准备投入到接下来的战斗中去。而那战火也绝不会因为任何人的疲惫而停下它的脚步，它将继续燃烧，直至将一切旧秩序彻底烧成灰烬。"
 RUS_SWRW_mech.12.a:0 "纵然烈火焚城，希望仍在废墟中长存。"
 RUS_SWRW_mech.13.t:0 "克里米亚半岛的光辉"
 RUS_SWRW_mech.13.d:0 "在克里米亚半岛的海滩上，那些残酷的战斗所留下的痕迹正在被时间一点点抹去，重新恢复往日的宁静。这里也曾经爆发过一场决定其命运的战争——克里米亚战争，当时那些勇敢的战士们竭尽全力地想要守住他们脚下的土地，尤其是他们身后的那座城市：塞瓦斯托波尔，阻止“文明”的欧洲人进一步蹂躏这片富饶的土地。历史总是惊人的相似，它也总会在最意想不到的地方发生惊人的反转：曾经四分五裂的各个“专员辖区”以及其上如一盘散沙的各个军事政治势力在新旗帜的号召下再次走到了一起，而当初的侵略者之一的法国则一蹶不振，彻底衰落了下去。而德意志第三帝国却故技重施，企图为其在东欧以及克里米亚的暴行进行辩护。\n\n不同民族的人们都曾定居在克里米亚，这其中有希腊人、哥特人、亚美尼亚人、俄罗斯人和鞑靼人等等。当然，德意志人也绝不会缺席。尽管这些民族之间也爆发过冲突，但当德意志人开始试图用自己的意识形态来同化和奴役这里的人民时，这里便成为了一颗随时可能引爆的炸弹。各个民族为了自身的生存而走到了一起，不断地去摧毁那摇摇欲坠的德意志的战争机器。美丽的城市接二连三的在战火中化为一片废墟，就更别提那些普通的房屋了，许多家庭曾经在其中创造过无数美好的回忆。\n\n那些曾经试图利用战争来投机取巧，为自己谋得私利的德国人们，开始离开克里米亚，尽管他们试图将失败归咎于他人，但这无济于事。留下来的那些则被动地接受了自己的命运，不去想他们是否应为这一切负责。\n\n塞瓦斯托波尔这座无比美丽的城市也不幸地成为了这场战争中的又一座“斯大林格勒”，尽管它的美丽在时间的长河中早已与如今的样貌大不相同，但这也不影响它重新回到俄罗斯母亲的怀抱中。笼罩在克里米亚上空的阴霾消散了，取而代之的则是新的希望。人民群众走上街头，着手于战后那千头万绪的重建工作。\n\n摆在塞瓦斯托波尔面前的首要任务，不是恢复往日的荣光，而是在重建的过程中，使其成为希望的象征——一个令所有幸存者都能引以为傲的希望。"
 RUS_SWRW_mech.13.a:0 "这座城市曾见证过无数的文明起落。"
 RUS_SWRW_mech.14.t:0 "哈尔科夫攻势的胜利"
 RUS_SWRW_mech.14.d:0 "温暖的微风轻抚着哈尔科夫街道两旁残破的建筑——这座城市在历经了与敌人的殊死搏斗后，终于再一次回到了俄罗斯的怀抱。在那些早已被夷为平地的废墟之上，在过去那片曾经繁华的市中心燃起的一堆篝火旁，围坐着三个疲惫不堪的身影：一位年轻的军官、一位饱经风霜的少校，还有一位上了年纪的老兵，三人的脸上都写满了战争的沧桑。\n\n一位年轻的中尉俯下身子，将冰冷的双手凑近跃动的火苗，口中喃喃说道，声音因为寒冷而微微颤抖：\n\n“真不敢相信……我们竟然真的做到了！德国人把我们的房子，我们那些坐落在哈尔科夫郊区的家园，变成了一座座坚不可摧的堡垒。为了攻下这些据点，我们不得不像踩钢丝一样穿过那些遍布着地雷的雷区，头顶上还时刻笼罩着敌人那密集的机枪火力网，身边的战友一个接一个地倒下，简直如同割麦子一般……但我竟然能活着站在这里，这简直就是一个奇迹。”\n\n少校点了点头，缓缓地吸了一口已经燃尽大半的香烟：\n\n“失去哈尔科夫对他们而言，无异于当头一棒！但现在，它终于回到了我们的手中，而且这不仅仅意味着一场战斗的胜利，我们已经将战线极大的推进，如今敌人的位置以及各个部队间的距离也在我们这面完全暴露出来。通过先前的数次战斗中，敌人的作战意图基本是彻底查明了。”\n\n那位上了年纪的军官抬起头来，凝视着眼前的篝火，他的眼神中充满了疲惫，也映射着过去几个月那段痛苦不堪的回忆。他缓缓地开口说道：\n\n“哈尔科夫对我们而言，至关重要。这里的胜利意义非凡……但这座城市却已经被彻底摧毁了！工厂被夷为平地，所有的生产设备要么被敌人洗劫一空，要么被他们丧心病狂地当场炸毁。而这里的人民……那些为数不多的幸存者们，望着眼前的废墟，他们的眼中早已没有了希望的光芒。”\n\n中尉似乎从跳动的火焰中汲取了新的力量，他的声音也变得坚定起来：“即便如此，我们还是用实际行动证明了——没有什么不可能！只要我们能够牢牢地控制住哈尔科夫，这本身就是一个胜利，这就相当于一个信号，一个传递给所有人的信号。我们要把这座城市从一片废墟中重新建设起来，然后沿着这条光复的道路继续前进！”"
 RUS_SWRW_mech.14.a:0 "为失散的同胞们再次团聚而欢呼。"
 RUS_SWRW_mech.15.t:0 "金色的穹顶"
 RUS_SWRW_mech.15.d:0 "在基辅那历经战火洗礼的城市废墟之上，一座座金色的东正教教堂穹顶在阳光的照耀下熠熠生辉。金色的阳光冲破废墟所带来的阴霾，也为那些饱受苦难的人民带来了久违的温暖的慰藉。\n\n沿着那些回响着往昔的战斗与苦难回声的街道，一队又一队的士兵正在依次前进。在他们身后，则是这座城市中欢欣鼓舞的市民们。这些劫后余生的人民，终于从德国人的铁蹄下获得了自由。帝国的三色旗高高飘扬，那神圣的双头鹰标志指引着将士们前进的方向，而那猎猎作响的旗帜声则像希望的先锋一般，飘荡在这座古老城市的每一个角落。喜悦与悲伤相互交织，泪水与欢笑一同从人们的脸颊滑落。对许多人而言，他们可能早已对生活失去了希望，但此刻，所有人都众口一词地说，他们再也不会承受哪怕一次这样的灾难。让这悲惨的一切，成为历史吧！人们的心中怀揣着和平的希望。\n\n在攻克敌人最后几处负隅顽抗的据点后，那些令人心惊胆寒的战斗终于告一段落，这也标志着基辅——这座历史名城终于迎来了它命运的转折。\n\n这座作为东斯拉夫人文明的摇篮的城市，如今却早已不复当年的荣光，只剩下一具焦黑的躯壳，里面似乎仍然跳动着对美好生活向往的心脏。每一条街道上都充斥着过去生活的气息：这里曾经是孩子们玩耍嬉戏的地方，那里曾经回响着每个家庭的欢声笑语，而这里则充斥着忙碌的日常生活。而现在，基辅正踏上那漫长的复兴之路——尽管前路注定充满荆棘和坎坷，但终有一天，它将再次成为所有人的精神家园。摆在面前的任务无比艰巨，但所有人都明白，这座城市必将涅槃重生！\n\n当前进的道路延伸到视野的尽头，那深植于人们心中，如同金子一般宝贵的信仰和希望将会化作一盏指路明灯。温暖每一颗纯洁而又质朴的心灵，成为基辅这座历经风雨洗礼，象征着重生与希望的城市在新时代中的不朽象征！"
 RUS_SWRW_mech.15.a:0 "俄罗斯母亲之城终于摆脱了桎梏。"
 RUS_SWRW_mech.16.t:0 "寂静的明斯克郊外"
 RUS_SWRW_mech.16.d:0 "战斗的喧嚣逐渐平息，明斯克的郊外笼罩在一片死寂之中。尽管这座城市曾见证了如此之多惨绝人寰的悲剧，但现如今，各方势力都在试图掌控这座城市的方方面面，甚至不惜为此付出生命的代价。\n\n明斯克——这座在战火中九死一生的城市，几近化为一座人间炼狱。仅有那些最为坚固的建筑依旧顽强地矗立着，其中仍然有一些满怀希望的人们，渴望着奇迹的降临。\n\n在这座城市附近的一处约定的地点，两位年轻人如约会面。其中一人是一位白俄罗斯人，他很久以前就转入了地下，并在长期的斗争中幸存了下来，甚至在如此恶劣的生存环境下还能为他的组织保住一支有生力量，使他们能够最终重见天日。而另一位则是俄罗斯士兵，在战斗结束后，他被留下来协助当地民众进行战后重建工作。\n\n“说真的，我做梦也没想到自己有一天会在几近被夷为平地的明斯克街头与一位俄罗斯士兵并肩而战。”白俄罗斯人开口说道，“不久之前，这一切还都是不可能的，但是突然之间，仿佛变魔术一般，这一切都实现了！”\n\n“瞒您说，我也难以相信自己竟然会因为与德国人作战而出现在这里。”俄罗斯士兵一脸无奈地回答道，“毕竟就在昨天，我还只是西伯利亚老家的一位普通人，但看看现在，我已经与敌人交战好几个回合了。真是造化弄人啊！”\n\n“或许，生活总是充满了各种意想不到的‘惊喜’吧。但看着战斗结束后，这座城市的满目疮痍，这种‘惊喜’我可无福消受啊。”\n\n“确实如此。这真是一场残酷的‘拉锯战’，为了争夺每一寸土地，无数的生命逝去了。有多少家庭永远地失去了自己的挚爱亲朋——简直难以想象！”\n\n“这些沉痛的回忆无法否认。但最重要的是——我们还活着！现在我们必须团结起来，携手重建这座被战争蹂躏的城市，并使它获得新生。让这座城市中的人们重新过上正常的生活。”"
 RUS_SWRW_mech.16.a:0 "生的希望将永远战胜死的阴霾"
 RUS_SWRW_mech.17.t:0 "上帝保佑"
 RUS_SWRW_mech.17.d:0 "在这座在无数次爆炸的洗礼下仍屹立不倒的教堂里，两个怀揣着各自的盘算的人秘密会面了，但最终他们达成了一致。这两个组织——游击队“神助”和东正教会都对时局有着自己独特的看法，这也使得双方能够为了彼此的利益而联合起来。\n\n多利宁作为“神助”的领袖，比预定时间要早到一会儿。他环视着这座教堂中幸存下来的各种陈设，不紧不慢地沿着过道踱步，嘴里还念念有词。当时钟上的指针最终指向预定的时刻，教堂的神职人员带着一众教徒匆忙离开了房间，而多利宁也停下了他的脚步。几乎就在同时，安季平推门走了进来，径直朝着他的谈判对象走了过去。在经过一副圣像时，安季平停下脚步，对着圣像郑重地画了个十字，然后继续朝着多利宁走去。两人面对面站定，安季平率先开口：\n\n“你好啊，我的兄弟。我已经听说了你的提议，我没有理由拒绝。为了引领我们走向光明的那位主，我们应当团结一致，风雨同舟。”\n\n“这些年来，我一直在大卢基地区与那些背弃了主的异教徒作斗争，但我不得不承认，我的能力实在是有限。然而……如今我将那些还愿意聆听祈祷并追寻主的人们都团结到了我的麾下。但我担心，自己正走在错误的道路上，偏离了主的指引。”\n\n“你的心中充满了力量！在这无比艰难的时刻，你毅然决然地站出来，试图用一己之力守护那些手无寸铁的羔羊们，这是许多人想都不敢想的事情。主已经洞察了我们所有人的命运以及那些我们发自肺腑、饱含深情的祈祷。只要我们保持本心，保持那份深藏于内心深处的最真挚的情感，坚信我们的事业是正义的，那么我们就没有走上歧途，一切都是主的旨意。”\n\n“我听闻我们的祖国，俄罗斯母亲，已经吹响了那最后决战的号角，我请求加入你们，去终结那些早已背弃上帝的邪恶异端，去为这个世界重新带来福音——这正是我的祈祷能够为之付出一切的事情。”\n\n在沉思了一会后，安季平给出了他的回复：\n\n“主与你同在！从今天起，我们将为了一个共同的目标携手共进，将主的福音传播到这世间的每一个角落。”"
 RUS_SWRW_mech.17.a:0 "纯洁的心灵总能找到属于它自己的道路。"
 RUS_SWRW_mech.18.t:0 "凯撒的归凯撒"
 RUS_SWRW_mech.18.d:0 "即便在经历了数十年的风风雨雨之后，仍有一些人坚信，俄罗斯终将成为一个真正的共和国——没有早已腐朽的沙皇专制思想，更没有那些极具破坏性的社会主义实验。这些人中的许多人，都坚信人民自治的力量，并将这一信念深藏于心。他们团结起来，组成了一支支游击队，准备为实现个人自由的理想而战。\n\n时光荏苒，第二次西俄罗斯战争爆发了。在这场战争中，他们意识到了自己所拥有的力量，于是便纷纷拿起武器，推翻了德国人在占领区所扶植的傀儡政权，希望借此机会朝着解放人民的目标迈出坚实的一步。与此同时，俄军也向莫斯科挺进。最终，他们与俄军取得了联系，并同意将其麾下的部队并入俄军。然而，随后的事态发展迫使当局重新审视对待这些自由主义者的策略。\n\n许多对建立共和国仍然抱有幻想的人，非但没有团结一心，与自己的人民一同浴血奋战，反而还试图向民众们宣传他们那些不合时宜的“自由民主”思想，妄图削弱当局的权威，从而使得国家在这危难之际更加脆弱。显然，对于他们的这种行为，我们不能坐视不管。\n\n不久之后，执法部门便对这些夸夸其谈者展开了抓捕行动，所有被怀疑宣传共和思想的人都被悉数逮捕。一步接一步，当局对这些可疑分子展开了无情的追捕，并逐渐成功地将那些破坏国家在战时团结稳定的“毒瘤”尽数切除。仅仅几周后，这些共和主义者中，只剩下了那些终于意识到共和国在当下纯属痴人说梦的人，他们明白了，在这场关乎民族存亡的斗争中，试图立即改变已经在这个国家站稳脚跟的政治体制是徒劳的。"
 RUS_SWRW_mech.18.a:0 "天真的幻想终将被现实所击碎。"
 RUS_SWRW_mech.19.t:0 "重建的迫切需求"
 RUS_SWRW_mech.19.d:0 "在经历了战火的蹂躏和游击队的破坏后，莫斯科公国急需重建，但由于此时国家仍处于同德国作战的特殊时期，重建工作也必须在战争条件下展开。针对重建工作，政府内部提出了许多不同的方案：有人提议重建工作应首先从诸如莫斯科这样的大城市开始，他们的设想是，这些大城市可以成为支撑周边那些较小的定居点和村庄的基石；另一部分人则认为，重建工作的重点应放在那些能够连接各个城市的村镇上，因为这些地方才是整个国家经济和交通的命脉所在；还有人提议，为了尽最大可能地加快重建速度，可以采取齐头并进的策略，对所有有人定居的地方进行无差别重建，虽然这种做法难免会在效率上有所损失。\n\n最近收到的一份报告来自于帕夫连科。他提请政府拨付必要的资金，以便他组织和领导莫斯科全境的重建工作。这份报告中附有一份详尽的计划书，其中不仅阐明了这项计划的核心思路，还列举了执行过程中可能会遇到的种种困难，以及这些困难的应对方案。\n\n乍看之下，这份计划书似乎极具可行性，因为其中对各种细节的详细说明以及对各个阶段工作的细致划分，明显比其他那些虚无缥缈的计划要好得多。但美中不足的是，帕夫连科在政府内部的风评很差。人们怀疑，这可能只是他打着“重建”的幌子中饱私囊的一个诡计而已。\n\n最终，是否批准并执行这份计划的决定权落到了沙皇的手中。在经过一番深思熟虑后，他最终做出如下决定："
 RUS_SWRW_mech.19.a:0 "这绝对是一笔划算的投资。"
 RUS_SWRW_mech.19.b:0 "不能见钱眼开，挥霍无度。"
 RUS_SWRW_mech.20.t:0 "施工现场核查"
 RUS_SWRW_mech.20.d:0 "最近一段时间，沙皇和政府频繁地收到来自莫斯科各地民众的投诉信，他们在信中表达了对当前事物安排的强烈不满：本应热火朝天地展开的重建工作迟迟没有进展，工人们因为领不到工资，还要忍受建筑材料的短缺，早已无心工作。而被委任负责领导和组织重建工作的帕夫连科，竟然凭空消失，彻底不见踪迹！政府随即委派了几个调查组来彻查他负责的那些重建计划的落实情况。\n\n几天后，一份内容令所有人都感到无比失望的报告被递交到了办公桌上：那些所谓的“重建计划”完全就是一纸空文，帕夫连科虚构了这些计划，目的就是为了从国库中套取资金，而那些本应发放到工人口袋里的工资，也早已被贪污大半，去向不明。简而言之，帕夫连科许诺的所有“重建工程”都是一场彻头彻尾的骗局。\n\n一项针对帕夫连科及其同伙的调查工作就此展开。然而调查结束时却发现，早已无人可抓。事实证明，这个帕夫连科就是一个彻头彻尾的骗子。他和他的同伙们通过这些虚构的计划贪污了巨额资金，现已逃往美国。如果想将这些罪犯绳之以法，那势必需要通过外交途径与美国斡旋，并启动冗长的引渡程序。与此同时，摆在政府面前那些亟待解决的种种问题和麻烦，也因为帕夫连科的贪污和潜逃而变得更加错综复杂，这更加需要国家领导人迅速做出决策，采取必要措施。"
 RUS_SWRW_mech.20.a:0 "钱虽充裕，但已无人可以托付。"
 RUS_SWRW_mech.21.t:0 "胜者面前的败者"
 RUS_SWRW_mech.21.d:0 "今天，北德维纳河上的流水似乎格外地湍急，河水拍打着河岸，仿佛是在诉说着它内心的不安。阴云笼罩着阿尔汉格尔斯克，似乎是在警告着那些庸碌的民众：一场风暴即将到来。但并非所有人都会留心大自然发出的预警，而这些人中就有德米特里·梅德韦杰夫。这位游击队运动“胜利者”的领袖在为了“解放”莫斯科地区的人民而战斗多年后，终于来到了这座北方城市。\n\n不久前，他还率领着自己麾下的部队揭竿而起，带领着自己的战士们在这片曾经属于俄罗斯的广袤土地上与敌人周旋。而他所付出的一切努力也终将得到回报：在与俄军成功会师后，他下令将自己的部队并入到俄罗斯帝国的武装力量之中。他很高兴能在这片饱经摧残的土地上看到那些英勇的战士们为了解放家园而浴血奋战的身影。但有一件事仍然让他牵肠挂肚，思绪万千。于是，他来到了阿尔汉格尔斯克，希望凭吊一位已长眠于此的故人，希望从他那里得到指引，以解答心中的疑惑。\n\n亚历山大·叶戈罗夫早已离开了人世，他的坟墓也得到了悉心的照料，尽管其仍然非常简朴。梅德韦杰夫静静地站在他的墓前，回顾着自己所做的一切，思索着他一路走来的点点滴滴。\n\n“如果今天您能站在这里，亚历山大，您会对我说些什么呢？”德米特里若有所思地说道，他仿佛是在对着这位元帅的亡灵诉说衷肠。“俄罗斯复兴了，但它并没有像你所期望的那样成为一个苏维埃国家，而是一个帝国。您会接受旧秩序的回归吗？如果您知道我与‘青年俄罗斯联盟’达成了协议，您会理解我吗？您是一个坚强的人，曾一度团结人民为一个共同的目标而奋斗，您值得所有人的尊敬。可惜的是，并非所有人都能够理解您的苦心……安息吧，老元帅。”\n\n德米特里·梅德韦杰夫敬了一个军礼，此时，第一滴雨水落在了他的脸上。雷声滚滚，响彻阿尔汉格尔斯克，但“胜利者”仍然一动不动地站在那里，向这位为祖国奉献了一生的忠诚战士做最后的告别。"
 RUS_SWRW_mech.21.a:0 "过去的努力不会被遗忘。"
 RUS_SWRW_mech.22.t:0 "猎杀“俄罗斯元首”"
 RUS_SWRW_mech.22.d:0 "为了追捕那个臭名昭著的通敌者奥克坦——他的名字早已被无数来自政界和军界的知名人士反复提及——俄罗斯在他们新近获得的每一寸领土上都展开了一场规模空前的搜捕行动。\n\n特种部队和那些主动与他们取得联系的地方游击队一起制定了一系列绝密的行动方案，他们决定联手行动。这些行动必须如闪电般迅速，不给那些仍然在为大日耳曼国卖命的败类们任何反应的机会，争取将他们一网打尽，以肃清地方，打通各个地区间的联络通道。\n\n在数周的时间里，无数与叛徒有牵连的人都落网了。他们或是被捕入狱，或是被就地正法。特工们仔细搜集着各种蛛丝马迹，从抓获的俘虏口中套取有价值的线索，并对所有知情者展开了紧锣密鼓的盘问。终于，功夫不负有心人，他们的不懈努力终于得到了回报，奥克坦的藏身之处被发现了。在经过精心筹备后，特工们发动了突袭行动，并取得了成功：奥克坦被活捉了。\n\n然而，行动成功的喜悦并没有持续太长时间。随着越来越多的消息灵通人士和一线部队传来令人不安的信息，他们的心中开始疑窦丛生：这一切会不会只是一个圈套？也许，他们抓获的不过是一个被奥克坦推出来的替身，是用来迷惑追捕者并掩护他本人逃跑的障眼法而已。为此，特工们对“奥克坦”进行了细致的核查，其中包括反复的盘问以及与多个线人所掌握信息的比对。不幸的是，事实证明了这些怀疑绝非空穴来风：被抓获的这个人并不是真正的奥克坦，他们上当了。这只是敌人的一个圈套。\n\n进一步的调查仍在进行中，但截至目前，那些可以追寻真正奥克坦的蛛丝马迹已经消失得无影无踪。竹篮打水一场空的结局对于参与此次行动的所有人而言，都是一次前所未有的、士气上的重大打击。"
 RUS_SWRW_mech.22.a:0 "所以……我们是被耍了吗？！"
 TaS_SWRW.11.t:0 "塞尔维亚请求和谈"
 TaS_SWRW.11.d:0 "在战争已经进行到白热化阶段之时，俄罗斯政府却突然收到了一份出人意料的外交提议：塞尔维亚，这个曾经德国最忠实的盟友，竟出人意料地提出希望与俄罗斯方面进行和谈，以换取俄方允许塞军撤出冲突地区。而导致塞尔维亚人态度急转直下的原因，则是他们那岌岌可危的国内局势。\n\n这一提议在俄罗斯高层内部引起了不小的争论。一方面，一份与塞尔维亚人达成的和平条约将极大削弱德国在巴尔干地区的影响力，毕竟从德国的掌控中抽身而去将使得德国在南部侧翼的战略部署出现重大缺陷。但是，鉴于塞尔维亚人之前的种种“光辉事迹”，其和谈意愿的真诚与否以及他们在将来是否会遵守承诺，都尚未可知。为此，政府内部提出了三种可能的应对方案：\n\n接受和谈：塞尔维亚从前线撤军无疑会对俄罗斯带来极大裨益，德国人将就此失去一个至关重要的战略盟友。不过，要求其无条件投降也可能会被其他国家视为俄罗斯方面不愿接受和谈的懦弱之举，并对我国的国际形象产生一定的负面影响。"
 TaS_SWRW.11.a:0 "他们的苦难已经够多了。就此停战吧！"
 TaS_SWRW.11.b:0 "我们不会让步，除非他们也做出让步。"
 TaS_SWRW.11.c:0 "俄罗斯的军队将踏上塞尔维亚的土地。"
 TaS_SWRW.12.t:0 "匈牙利的和平提议"
 TaS_SWRW.12.d:0 "匈牙利政府做出了一个出人意料的决定——希望与俄罗斯帝国单独媾和，这一事态的转变可谓是石破天惊。导致这一决定的原因在于匈牙利内部危机——严重的经济危机以及旷日持久的内部冲突，这些危机早已将这个四分五裂的国家折磨得体无完肤，一系列的问题也削弱了他们的力量。\n\n对于俄罗斯而言，这一提议不啻于一个巨大的挑战。匈牙利长期以来一直是大日耳曼国忠实的盟友，它为德意志的战争机器提供了至关重要的战略资源和经济支持，并且在反俄同盟中也发挥了不可忽视的重要作用。如果俄罗斯能够与匈牙利单独达成和平协议，这势必将会给德国在东欧地区，尤其是在巴尔干地区的战略部署以沉重打击。然而，在俄罗斯高层内部，争论的焦点主要集中在和谈的条件和策略上。\n\n如果俄罗斯毫无保留地接受匈牙利的和平提议，俄军就能够立刻从匈牙利境内撤出，并将这部分力量投入到其他关键战场，从而进一步加大对大日耳曼国南部边境的压力。然而，无条件接受匈牙利的投降可能会被视为是一种软弱的表现，也有损俄罗斯在盟友中的声望，以及如果匈牙利以后可能找到方法来支持德意志也会受到惩罚。\n\n俄罗斯正在考虑将与布达佩斯的谈判作为一个战略和政治博弈的筹码。提出苛刻的条件——无论是要求割让领土、支付战争赔款还是军队非军事化——都能够确保俄罗斯在巴尔干地区的长期影响力。但是，如果条件过于苛刻，也会导致谈判陷入僵局，甚至迫使匈牙利彻底倒向德国一方。\n\n一些强硬派则主张彻底击溃匈牙利军队，以武力迫使其无条件投降。这样做的确能够使大日耳曼国彻底丧失这一地区盟友。但同样显而易见的是，这极有可能会使冲突进一步扩大，甚至会导致在巴尔干地区爆发一场大规模战争，从而进一步消耗俄罗斯的人力和物力资源。"
 TaS_SWRW.12.a:0 "匈牙利不值得我们为之抛头颅，洒热血。同意和谈。"
 TaS_SWRW.12.b:0 "向他们施压，逼迫他们做出一些让步。"
 TaS_SWRW.12.c:0 "他们太高估自己的价值了。"
 TaS_SWRW.13.t:0 "英国退出战争"
 TaS_SWRW.13.d:0 "东线战场所发生的一切，以及西方那些出乎所有人意料的事态发展，都迫使英国做出了战略调整。尽管英国本土并未受到战火的波及，但英国政府已经意识到，继续执行之前所制定的战略已经毫无意义，因此英国政府决定向大日耳曼国提出退出战争的请求。\n\n在全世界的密切注视下，英国试图通过缔结一项和平条约来增强自己在国际社会中的独立地位和影响力。面对着各方的巨大压力，伦敦方面正在夜以继日地准备所有必要的文件，争取尽早达成一项和平协议。\n\n然而，尽管俄罗斯方面极力争取更多对自身有利的条件，但他们还是遇到了难以逾越的障碍：英俄两国之间并未爆发直接的军事冲突，这意味着英国不需要为战败支付任何赔款，这也迫使俄罗斯无法提出过于苛刻的和谈条件。\n\n英国外交官的到来十分突然，而且没有大张旗鼓。谈判的节奏很快，双方的代表都积极捍卫自己的利益，不断地讨价还价，希望对方能够让步。最终，双方达成协议，交战双方的现状以及各国的国际地位保持不变。\n\n协议签署完毕后，英国代表团便乘飞机返回了伦敦，成功完成了他们的使命。自此以后，英国将彻底退出这场席卷整个欧洲的战争。"
 TaS_SWRW.13.a:0 "让那些海外孤岛见鬼去吧。"
 TaS_SWRW.14.t:0 "罗马尼亚乞求和平"
 TaS_SWRW.14.d:0 "俄罗斯最高统帅部收到了来自罗马尼亚的和平提议。布加勒斯特政府意识到，旷日持久的战争早已令他们疲惫不堪，只会加剧罗马尼亚内部的危机（尤其是日益恶化的经济状况和愈演愈烈的内部冲突），罗马尼亚人已经迫不及待地想要从这场“为德国人流尽最后一滴血”的战争泥潭中脱身，并为此他们表达了愿意同俄罗斯单独媾和的意愿。\n\n俄罗斯高层内部对此消息反应不一：罗马尼亚一直以来都是大日耳曼国最忠实的走狗，它为德意志提供了至关重要的战略资源并成为其发动战争的重要支撑。因此，一旦实现了和罗马尼亚单独媾和，这势必将沉重打击德国在巴尔干地区的影响力。\n\n无条件地接受对方的和平请求：简单而又直接，立即与罗马尼亚签署和平条约，将兵力重新调配至其他关键地区。这样做除了能给大日耳曼国在政治上施加更大的压力，也能极大地提振国内的士气。不过，如此仁慈地对待敌人可能会被视为软弱，进而损害俄罗斯的国际形象，而且如果布加勒斯特在未来的某个时刻再次选择背叛，我们也必将为今日的软弱而吞下苦果。\n\n拒绝和谈：俄罗斯政府中主张采取强硬态度的一派坚持认为，应该拒绝任何形式的谈判，继续将战争进行下去，直至迫使罗马尼亚无条件投降，这将彻底拔除德国人在东南欧地区安插的这枚钉子。然而，将有大量的人民子弟兵将为此付出生命的代价，而我们为此取得的可能与他们付出的代价并不匹配，并且我们也有可能深陷在与罗马尼亚旷日持久的战争中，这对我们而言，有百害而无一利。"
 TaS_SWRW.14.a:0 "又少了一个敌人。"
 TaS_SWRW.14.b:0 "好好敲他们一笔竹杠，让他们为自己的背叛行为付出代价。"
 TaS_SWRW.14.c:0 "布加勒斯特必将属于我们！"
 TaS_SWRW.15.t:0 "来自维希的爱"
 TaS_SWRW.15.d:0 "彼得，沙皇陛下外交使团中最年轻、最有前途的外交官之一，正在等待一架飞机的到来。飞机上坐着路易，一位年事已高但依然老当益壮的外交官，他曾在希姆莱入侵期间与弗朗哥和萨拉查进行过谈判。当载着这位老人的飞机降落后，一群年轻人跑向舷梯。\n\n“勒蒂谢先生，您好。您的旅途还算顺利吗？”\n\n“瓦谢奇金先生，我更希望能在莫斯科与您会面，但在目前的情况下，赤塔似乎也是一个不错的选择。”\n\n一行人匆匆地钻进了几辆毫不起眼的汽车，车队随即朝着事先约定的会谈地点疾驰而去。在接下来的四个小时里，法国和俄罗斯的谈判代表团讨论了未来协议中的一些关键条款和具体细节。最终，双方签署了一项单独的和平协议，而路易所要做的，就是返回里昂。在返回机场前，路易决定向彼得提出一个从外交部长将这项任务交给他开始，就一直困扰着他的问题。\n\n“彼得，你们真的认为自己能够战胜德国吗？”\n\n“我们正在取得胜利，路易先生。这正是贵国同意进行这些谈判的原因。”\n\n“这倒是实话。但你们认为，自己真的能够守住这些胜利果实吗？德国人已经沉寂了半个世纪了。”\n\n“我们对自己的实力充满了信心，而且是非常有信心。谁知道呢，或许我们下一次会谈的主题，就是关于阿尔萨斯-洛林的归属问题呢？”\n\n路易笑了笑，向彼得道别，然后动身前往机场。漫长的旅程正在等待着他。"
 TaS_SWRW.15.a:0 "很快，这个消息传遍了全世界。"
 TaS_SWRW.16.t:0 "保加利亚乞求和平"
 TaS_SWRW.16.d:0 "俄罗斯最高统帅部收到了一个来自索菲亚的、令人瞠目结舌的提议：保加利亚政府主动示好，提议在秘密状态下与俄罗斯单独媾和，并彻底退出这场早已令其疲惫不堪的战争——这一切完全都是在瞒着德国人的情况下秘密进行的！对保加利亚来说，在东线遭遇的一系列惨败早已令国内民众苦不堪言。为了防止国家和民族滑向万劫不复的深渊，索菲亚决定孤注一掷，秘密同俄罗斯展开和谈，并试图以此来摆脱自身的困境。\n\n然而，这一提议却在俄罗斯高层内部引发了激烈的争论。总参谋部和政府高层都在绞尽脑汁地思考着这样一个问题：如果接受了这份和平条约，对于俄罗斯而言究竟是福是祸？在经过了旷日持久的讨论后，各方势力主要围绕着三种意见展开争辩，每一个选项都会对德意志以及俄罗斯的国际地位产生不同程度的影响。\n\n第一种选择——无条件地接受索菲亚的和谈请求。在这一方案下，俄罗斯将与保加利亚签署一份没有任何附加条件的和平条约。保加利亚军队从东线战场撤出后，俄罗斯能够趁此机会重新集结兵力，并在那些最为薄弱的环节加强自己的防御，避免出现因兵力不足而被敌军突破的危险。\n\n第二种选择——拒绝和谈。在他们看来，索菲亚沦陷只是时间问题，保加利亚军队早已无力阻挡俄罗斯前进的步伐，因此继续目前的攻势，我们最终必然获得全胜。"
 TaS_SWRW.16.a:0 "停止手足相残吧！同他们签署和平条约！"
 TaS_SWRW.16.b:0 "向他们施加压力，让他们做出一些让步。"
 TaS_SWRW.16.c:0 "他们的彻底崩溃只会令我们受益。"
