 MAR_territorial_fate.1.t:0 "突厥斯坦的命运"
 MAR_territorial_fate.1.d:0 "我军终于粉碎了各地残余武装的抵抗，胜利抵达伊朗和阿富汗边境。\n\n突厥斯坦是一个历史错综复杂的地区，民族多样，发展落后，当地的农民甚至可能都没有意识到统治者的更替。无论如何，是时候决定该如何治理这片落入我们手中的土地了。"
 MAR_territorial_fate.1.a:0 "为了严格有效的控制，我们将建立总督辖区政府。"
 MAR_territorial_fate.1.b:0 "我们必须考虑到生活在那里的所有民族的利益。我们需要自治。"
 MAR_territorial_fate.1.c:0 "我们城里人更懂如何治理地区，直接管辖是必要的。"
 MAR_territorial_fate.2.t:0 "移民问题"
 MAR_territorial_fate.2.d:0 "经过漫长而血腥的战斗，我们终于从日本人手中收复了滨海边区，主要的太平洋港口也回到了我们的掌控之中。这个以农业为主的地区，基础设施极度落后，尤其是路况可以用“一片空白”来形容，急需大量投资进行建设。但其蕴藏着的巨大军事和贸易潜力，足以抵消一切投入。无论如何，我们需要尽快制定针对这片区域的整体方针，特别是如何处置当地的居民。\n\n这里主要居住着来自刚果的定居者，以及从20世纪50年代初就开始迁居此地的日本人、满族人和朝鲜人的混血后裔，他们构成了该地区的城市人口主体。但这些人中，很有可能潜藏着大量前政权的合作者和同情者。"
 MAR_territorial_fate.2.a:0 "我们想太多了，不必害怕，他们可以留下来。"
 MAR_territorial_fate.2.b:0 "他们必须走。"
 MAR_territorial_fate.3.t:0 "莫斯科专员辖区的命运"
 MAR_territorial_fate.3.d:0 "“莫斯科维恩”及其衍生词，已经成为历史。尽管我们做出了诸多努力，但问题依然挥之不去——曾经被占领的国土中部，绝大多数的德国人依然生活在那里。针对这一问题，政府事先准备了几套解决方案，并列出了每套方案的优缺点。主要方案有三：\n\n1.将德国人驱逐到德国政府控制的地区。这一方案必将得到全体俄罗斯人民的拥护，但在国际舆论上，我们将把自己置于与几十年前的德国人无异的境地。\n\n2.将德国人迁移到乌拉尔山脉以东的地区（西伯利亚、北哈萨克斯坦、乌拉尔地区）。从经济战略的角度来看，这将带来巨大的利益，但也会导致当地居民与新移民之间的紧张关系。当然，德国人将会被俄罗斯化。\n\n3.允许德国人自己决定自己的命运也不失为一个选择。绝大多数人很可能会选择离开，但最脆弱的社会群体可能会遭受当地居民的排挤和欺凌。\n\n现在，我们必须做出最终的抉择，并将命令传达给地方政府。至于那些主张维持现状的声音，则一概不予采纳，因为这根本就是毫无意义的逃避。"
 MAR_territorial_fate.3.a:0 "像噩梦一样驱散、遗忘！"
 MAR_territorial_fate.3.b:0 "工作劳动会战胜一切。"
 MAR_territorial_fate.3.c:0 "德国人自行决定何处去。"
 MAR_territorial_fate.4.t:0 "波罗的问题"
 MAR_territorial_fate.4.d:0 "我们已经收复了爱沙尼亚。尽管该地区的人口数量甚至比不上喀山，但芬兰湾沿岸的波罗的海港口却具有极其重要的战略意义。爱沙尼亚是我们手中德国化程度最高的地区之一，爱沙尼亚人的民族认同感几乎被彻底抹杀。这里几乎没有像样的工业，当地居民大多是农民。想要恢复爱沙尼亚昔日的荣光，我们还有很长的路要走，但当务之急，是确定对该地区的治理方针。\n\n波罗的海的明珠——里加，终于回到了祖国的怀抱。但除了这座东部地区的中心城市和最大港口外，我们还“收获”了一个贫穷的拉脱维亚省。除了沙丁鱼罐头，这里几乎没有任何拿得出手的产业，而且，庞大的德国裔人口，特别是那些聚居在城市里的德国人，更是一个令人头疼的问题。拉脱维亚本族人大多是目不识丁的农民，对他们来说，统治者从德国人变成俄罗斯人，并没有什么区别，我们也看不出他们对此表现出丝毫的喜悦。但无论如何，我们都必须尽快拿出一套可行的方案来治理拉脱维亚。\n\n我们已经收复了立陶宛，帝国西部的边陲再次稳固。说立陶宛毫无亮点都是一种赞美，相当一部分立陶宛人只会说德语。这里除了数量庞大的德国移民外，几乎没有任何东西值得我们关注。工业？这里根本就没有工业，只有零星散布的小农场，以及在矿山里服苦役的劳工。无论如何，我们得想办法治理这片“泽麦蒂亚沼泽”了。"
 MAR_territorial_fate.4.a:0 "就让我们为他们恢复久违的独立。"
 MAR_territorial_fate.4.b:0 "在我们的注视下，有限自治会是最好的选择。"
 MAR_territorial_fate.4.c:0 "我们需要完全统一的俄罗斯，自治与独立游行滚一边去。"
 MAR_territorial_fate.7.t:0 "白俄罗斯问题"
 MAR_territorial_fate.7.d:0 "我们已将东方专员辖区从纳粹的魔爪中解放出来。我们的兄弟民族在德国人的枷锁下受尽苦难。伟大的卫国战争期间，四分之一的白俄罗斯人惨遭杀害，该地区的人口状况跌入了深渊。我们绝不能将他们弃之不顾。白俄罗斯拥有肥沃的土地以及完善的基础设施——这些都是德国人为了掠夺东部资源而建造的。我们必须尽快决定如何治理白俄罗斯。"
 MAR_territorial_fate.7.a:0 "自由的白俄罗斯会是最公正的结果。"
 MAR_territorial_fate.7.b:0 "给予他们有限独立。"
 MAR_territorial_fate.7.c:0 "为什么要分裂国家？"
 MAR_territorial_fate.8.t:0 "乌克兰的命运"
 MAR_territorial_fate.8.d:0 "我们夺走了德国的面包篮，乌克兰重归祖国母亲的怀抱。广袤的草原、肥沃的黑土地、丰富的矿产资源、数量庞大的人口…这一切，对任何一个潜在的征服者来说，都是无比诱人的战利品。毫无疑问，乌克兰将成为我国战后重建的关键。然而，许多乌克兰人不愿承认自己是俄罗斯人民的一部分，甚至还有激进分子公然对抗将他们从纳粹统治下解放出来的军队。因此，乌克兰的自治权问题悬而未决，我们需要尽快给出答案。"
 MAR_territorial_fate.8.a:0 "解放乌克兰——这是对他们苦难的最好回报。"
 MAR_territorial_fate.8.b:0 "乌克兰自治——合适之选。"
 MAR_territorial_fate.8.c:0 "小俄罗斯脱离帝国就什么都不是。"
 MAR_territorial_fate.9.t:0 "塔夫利达省与克里米亚"
 MAR_territorial_fate.9.d:0 "克里米亚原是黑海舰队的主要海军基地，后来是德国舰队的。足可见克里米亚之关键，谁拥有它，便可坐拥黑海的主导权。我们把德军赶出了半岛，但德国人仍占当地大头，这是个问题。我们该如何处理黑海德裔？"
 MAR_territorial_fate.9.a:0 "我们将建立俄-德联合自治区。"
 MAR_territorial_fate.9.b:0 "德国自治？发什么疯？"
 MAR_territorial_fate.10.t:0 "高加索问题"
 MAR_territorial_fate.10.d:0 "北高加索，一片气候宜人、土地肥沃的美丽土地，生活着众多民族，文化绚烂多彩。然而，北高加索至今仍是一个落后的农业区，而克拉斯诺达尔以南的地区，更是犹如人间炼狱。想要改善少数民族的生活条件，需要投入天文数字的资金，当然，我们也可以“允许”他们建立自己的“准国家”。\n\n高加索地区，曾经是帝国的珍宝，如今却因为弥漫不去的浓烟，被称为“看不见的王国”。那位疯狂的德意志专员，将这里变成了德国经济的燃料库和原料基地。放眼望去，除了数不清的奴隶工厂和简陋的矿井外，昔日度假胜地的美丽景色早已荡然无存，取而代之的，只有一片片触目惊心的工业废墟。高加索，已经永远地伤痕累累了。我们必须决定如何处置阿塞拜疆、格鲁吉亚和亚美尼亚等民族，以及，如何才能在30年内，弥补德国人犯下的罪恶。"
 MAR_territorial_fate.10.a:0 "所有民族在一个屋檐下的自治应该能使他们和解。"
 MAR_territorial_fate.10.b:0 "仅外高加索自治，其他独立。"
 MAR_territorial_fate.10.c:0 "一切民族都该有自己的国家。这会是个坏主意吗？"
 MAR_territorial_fate.10.e:0 "对我们来说，直接控制就是一切。"
