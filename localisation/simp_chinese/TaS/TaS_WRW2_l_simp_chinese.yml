 MAR_Plane_Bombing:0 "俄罗斯持续轰炸"
 MAR_Plane_Bombing_desc:0 "与俄罗斯养的狗开战给我们头上招来了一窝蜂的俄罗斯空军。炸弹雨点一样落在主要基建和军事目标之上，我们对此几乎束手无策。\n\n这严重妨害了我们军队的组织，也损害了军队力量对我们的支撑，但我们别无他法，只能祈祷这些炸弹会很快停下。"
 MAR_military_advisors:0 "俄罗斯军师顾问"
 MAR_military_advisors_desc:0 "我们的俄罗斯盟友认为，派送红军顾问帮助现下的冲突是非常可行的。有了他们的支持，我们将会在我军士兵的身上看到明显的改变，也会学习到现代战争的重要经验，这会极大地提升我军的作战效能。"
 MAR_technician_aid:0 "俄罗斯技术援助"
 MAR_technician_aid_desc:0 "俄罗斯认为派送技术专家帮助我们的军事行动是非常可行的。他们的援助使得我们在不同方面的军事行动和经济建设中受益匪浅。我们十分期望援助将来一直会持续。"
 MAR_sabotage_effort:0 "俄罗斯的破坏活动"
 MAR_sabotage_effort_desc:0 "与俄罗斯养的狗开战给我们家里招来了一屋子俄罗斯间谍。我们国家现在遭受着一波又一波的破坏行动，从窃取国家机密，到破坏军事行动，再到刺杀政府官员，这些俄罗斯特工都干得出来。\n\n这些破坏行动对我们军队的打击并不仅限于其直接后果，更重要的是我们的政府上下都成了惊弓之鸟，我们自己的特工只能尽最大努力预防将来的破坏。"
 MAR_partisan_attacks:0 "协调游击队"
 MAR_partisan_attacks_desc:0 "在我们的后方，游击队正以惊人的速度和效率发动着袭击。他们瞄准着我们部队的集合点与补给线，阻碍着我们前线部队的补给和对各据点的控制。这种高度定向的袭击模式显然表明，日本的情报机构，由于其支持我们的敌人，正在向这些游击队提供情报。我们有能力赶走他们，但是在这之前，我们必须保持警惕。"
 MAR_army_infiltrartion:0 "陆军渗透"
 MAR_army_infiltrartion_desc:0 "俄罗斯间谍已经渗透进我们的军队里了。不管是受到了贿赂或者是被逼无奈，我们军队内有一批高官正在向我们的敌人提供情报。直到我们能铲除这些间谍之前，我们军队的进攻与协调机动能力都要遭受损害。"
 TaS_SWRW_far_eastern_negotiations:0 "《马加丹协定》"
 TaS_FE_round_txt:0 "[FE_negotiations_round]"
 TaS_FE_round_one:0 "§L第一轮：§!§D布拉戈维申斯克§!"
 TaS_FE_round_two:0 "§L第二轮：§!§f哈巴罗夫斯克§!"
 TaS_FE_round_three:0 "§L第三轮：§!§C滨海边疆区§!"
 TaS_FE_round_four:0 "§L第四轮：§!§V符拉迪沃斯托克§!"
 TaS_FE_status_not:0 "§e尚未开始§!"
 TaS_FE_status_ongoing:0 "§w正在进行§!"
 TaS_FE_status_over:0 "§G已经结束§!"
 TaS_FE_blagoveshensk_tt:0 "§D布拉戈维申斯克§! - 谈判状态：[fe_blagoveshensk_status]"
 TaS_FE_blagoveshensk_tt_desc:0 "§D布拉戈维申斯克§! 的领土曾经被割让给§o法西斯§!傀儡§o康斯坦丁·罗扎耶夫斯基§!。\n\n由此看来，与§P日本§! 的谈判应该不会出现任何问题。不过，世事无绝对，我们仍需与§P共荣圈§! 的代表们就§G我们的领土§!的归还问题进行§Y协商§!。"
 TaS_FE_khabarovsk_tt:0 "§f哈巴罗夫斯克§! - 谈判状态： [fe_khabarovsk_status]"
 TaS_FE_khabarovsk_desc:0 "§f哈巴罗夫斯克边疆区§! 是被§P日本§!侵占的领土之一， §P日本人§!§R不太可能§!轻易将它归还给我们。更复杂的是，相当数量来自§P日本本土§!和§f满洲国§!的移民已经在此定居多年。\n\n因此，如果我们不仅想收复这里，还要将§C滨海边疆区§!的其他地区也纳入囊中，那么我们除了要做出其他努力之外，还必须§Y保证§!§f满洲§!和§P日本§!移民的§G人身安全§!。"
 TaS_FE_primorie_tt:0 "§C滨海边疆区§! - 谈判状态： [fe_primorie_status]"
 TaS_FE_primorie_desc:0 "§C滨海边疆区§!是§K远东地区§!最后一处由§P日本§! 的傀儡政权——§f满洲国§!——所控制的土地。无论如何，尽管我们早前已做出过§Y保证§!，但我们仍需再一次向§P日本人§!确保§G我们怀揣着友好的意图§!。"
 TaS_FE_vladivostok_tt:0 "§V符拉迪沃斯托克§! - 谈判状态： [fe_vladivostok_status]"
 TaS_FE_vladivostok_desc:0 "这座城市的特殊之处在于，它正处于§P日本帝国§!的直接控制之下。\n\n如果不能向§P东京§!方面提出一系列§Y有利可图的建议§!作为§Y补偿§!，他们§R断然不会§!同意将这座城市交还给§G我们§!。"
 indicator_diplo_txt:0 "外交官的立场"
 indicator_diplo_number_tt:0 "当前§Y外交官§!的立场：偏向§K俄罗斯§! §Y[?swrw_diplo_jap]%§!"
 indicator_corpo_txt:0 "财阀的立场"
 indicator_corpo_number_tt:0 "当前§B财阀§!的立场：偏向§K俄罗斯§! §Y[?swrw_corpo_jap]%§!"
 swrw_fe_diplo_decrease_tt:0 "§Y外交官§!的立场将§R偏向§!§E日本§! §R[?temp_diplo_gained_txt]%§!"
 swrw_fe_diplo_increase_tt:0 "§Y外交官§!的立场将§G偏向§!§K俄罗斯§! §G[?temp_diplo_gained_txt]%§!"
 swrw_fe_corpo_decrease_tt:0 "§B财阀§!的立场将§R偏向§!§E日本§! §R[?temp_corpo_gained_txt]%§!"
 swrw_fe_corpo_increase_tt:0 "§B财阀§!的立场将§G偏向§!§K俄罗斯§!§G[?temp_corpo_gained_txt]%§!"
 SWRW_FEnegotiations_mission:0 "[?fe_round]轮谈判结束"
 SWRW_FEnegotiations_mission_tt:0 "§Y我们将结束关于该地区的谈判。\n成功门槛：§!§R[?swrw_fe_threshold_txt]§!\n\n预期结果： [fenegotiations_round_result]"
 SWRW_FEnegotiations_mission_fail:0 "§R失败§!"
 SWRW_FEnegotiations_mission_succ:0 "§G成功§!"
 SWRW_FEnegotiations_actions_limit_tt:0 "我们§G尚未达到§!行动次数上限 §Y([?swrw_fe_actions]/2)§!"
 SWRW_FEnegotiations_generic_effigy:0 "§Y共同决议§!"
 SWRW_FEnegotiations_buy_diplomats:0 "收买外交官"
 SWRW_FEnegotiations_buy_corpos:0 "收买财阀"
 SWRW_FEnegotiations_speedup_nego:0 "加快谈判进程"
 SWRW_nego_speedup_tt:0 "当前这轮谈判的计时器将§Y减少§!§Y14天§!"
 SWRW_FEnegotiations_slowdown_nego:0 "拖延谈判进程"
 SWRW_nego_slowdown_tt:0 "当前这轮谈判的计时器将§Y增加§!§Y14天§!"
 SWRW_decision_now_available_tt:0 "该决议将再次可用"
 SWRW_FEnegotiations_special_effigy:0 "   §Y本轮谈判决议§!"
 SWRW_FEnegotiations_help_with_partisans:0 "协助镇压游击队"
 SWRW_FEnegotiations_help_with_partisans_desc:0 "“泛亚联合阵线”是一支活跃在阿穆尔地区的游击队。尽管我们的目标与任务与他们有相似之处，但我们还是会向满洲国提议帮助他们镇压当地的游击运动，从而提高我们在共荣圈中的声望。"
 SWRW_FEnegotiations_defend_property:0 "保证财产安全"
 SWRW_FEnegotiations_defend_property_desc:0 "许多日本大型企业的代表担心他们在“外满洲”地区的资产会被没收。我们必须向他们保证他们的财产不会受到任何威胁，他们可以像从前一样支配这些产业。"
 SWRW_FEnegotiations_demilitarize_amur:0 "承诺阿穆尔河地区非军事化"
 SWRW_FEnegotiations_demilitarize_amur_desc:0 "有人担心，我们会把这些新获得的领土当作对满洲国甚至日本本土发动袭击的跳板。为了打消这些人的疑虑，我们将承诺在谈判结束后让整个阿穆尔河地区实现非军事化。"
 FE_demilitarize_amur_tt:0 "谈判结束后，所有的新领土都将成为非军事区"
 SWRW_FEnegotiations_guanrantees_for_dongbei:0 "为移民提供安全保障"
 SWRW_FEnegotiations_guanrantees_for_dongbei_desc:0 "自上世纪50年代“滨海边疆区”并入后，大量来自中国、满洲国和朝鲜的移民涌入这片土地。为了避免可能出现的民族冲突，我们向远东地区的中国和朝鲜居民保证他们的人身安全，并承诺为他们提供迁移补偿。"
 SWRW_FEnegotiations_meet_in_guandong:0 "关东会晤"
 SWRW_FEnegotiations_meet_in_guandong_desc:0 "关东作为共荣圈的经济中心，是与日本各大财阀进行谈判的理想地点。我们必须前往那里，建立联系并说服财阀们在即将到来的谈判中支持我们。"
 SWRW_FEnegotiations_give_magadan:0 "提供马加丹港口"
 SWRW_FEnegotiations_give_magadan_desc:0 "马加丹港是俄罗斯为数不多的、至今仍在运营的港口之一。尽管日本从这一交易中获益有限，但这种善意的姿态想必会引起共荣圈的注意。"
 SWRW_FEnegotiations_demonstrate_power:0 "展示实力"
 SWRW_FEnegotiations_demonstrate_power_desc:0 "谈判不能仅仅依靠妥协与让步，因此我们还必须展示我们的实力。我们将在紧邻满洲国边境的地区举行大规模军事演习，以使日本外交官们相信，依靠军事手段解决争端是徒劳的。"
 SWRW_FEnegotiations_talks_with_nissan:0 "与日产公司的协议"
 SWRW_FEnegotiations_talks_with_nissan_desc:0 "日产是满洲国最大的公司之一，因此在谈判中，我们需要得到他们的支持。我们将商定在远东地区进行一系列的基础设施建设项目，以吸引该公司进入我们的市场。"
 SWRW_FEnegotiations_resource_trade:0 "资源供应"
 SWRW_FEnegotiations_resource_trade_desc:0 "俄罗斯是一个自然资源极其丰富的国家。考虑到中国和日本关系可能出现恶化，我们可以成为共荣圈，尤其是日本的另一个资源来源。"
 SWRW_FEnegotiations_russo_manchu_theatry:0 "俄满友好条约"
 SWRW_FEnegotiations_russo_manchu_theatry_desc:0 "由于失去了广袤的滨海边疆区，满洲国将成为这场谈判中最大的输家。我们应该向满洲国提供一些优惠的贸易协定，并将这些内容写进《俄满友好条约》中。"
 SWRW_FEnegotiations_propose_korean_resettlement:0 "提议重新安置朝鲜人"
 SWRW_FEnegotiations_propose_korean_resettlement_desc:0 "令日本帝国最为头疼的问题之一，便是那些桀骜不驯的朝鲜少数民族。在谈判中，我们将向日本提出一项协议，允许那些不愿在日本领土上生活的朝鲜人迁移到远东地区。"
 FE_korean_resettlement_tt:0 "谈判结束后，远东地区的民族构成将发生改变"
 SWRW_FEnegotiations_china_talks:0 "与中国谈判"
 SWRW_FEnegotiations_china_talks_desc:0 "尽管日本是共荣圈的领导者，但中国仍然是该地区人口最多、面积最大的国家。如果我们能获得中华民国的支持，这将为进一步的谈判奠定良好的基础。"
 SWRW_FEnegotiations_legco_talks:0 "与立法院的协议"
 SWRW_FEnegotiations_legco_talks_desc:0 "我们必须获得关东地区主要财团的支持，为此，我们将与立法院达成一项协议，以便在谈判期间对共荣圈内的财阀们施加更大的影响力"
 SWRW_FEnegotiations_pipeline:0 "“友谊”输气管道"
 SWRW_FEnegotiations_pipeline_desc:0 "随着石油危机的爆发，日本面临着严重的燃料短缺问题。我们可以通过铺设一条从西伯利亚油气田通往满洲国和日本的天然气管道来满足他们的能源需求，这将为共荣圈提供廉价的天然气。"
 SWRW_FEnegotiations_european_ports:0 "开放欧洲地区的港口"
 SWRW_FEnegotiations_european_ports_desc:0 "日本的物流主要依靠太平洋航线，这导致其运输成本居高不下。我们将向其开放我们在欧洲地区的港口以供贸易使用。来自共荣圈各地的商品将源源不断地运往欧洲，然后从我们在阿尔汉格尔斯克和摩尔曼斯克的港口转运。"
 SWRW_FEnegotiations_demil_far_east:0 "远东地区非军事化"
 SWRW_FEnegotiations_demil_far_east_desc:0 "在谈判过程中，我方是否会将远东作为未来进攻共荣圈的跳板，始终是一个各方都无比关注的问题。为了彻底打消各方的疑虑，我们将在谈判提案中做出进一步的让步，宣布与共荣圈接壤的所有地区都将实现非军事化。是的，这可能会导致俄罗斯东部的大部分地区门户洞开，但世上岂有两全法！"
 SWRW_FEnegotiations_double_administrartion:0 "符拉迪沃斯托克-浦塩的联合管理"
 SWRW_FEnegotiations_double_administrartion_desc:0 "日本在符拉迪沃斯托克地区的统治早已根深蒂固。如果我们无法获得对这座城市的完全控制权，那么我们将提议实施“联合管理”——在该城市实行广泛的自治，由俄罗斯和日本的官员共同治理。"
 FE_double_administrartion_tt:0 "一旦实施§Y联合管理§!，§x符拉迪沃斯托克-浦塩§!将§e永远无法§!成为§D俄罗斯的领土§!"
 SWRW_FEnegotiations_give_ural:0 "向财阀开放乌拉尔地区"
 SWRW_FEnegotiations_give_ural_desc:0 "日本财阀们追求的是利润的最大化，我们将满足他们的需求，允许他们在乌拉尔地区开设工厂和其他企业。是的，我们可能不得不对一些违法行为睁一只眼闭一只眼，但这就是所谓“舍不得孩子套不着狼”！"
 SWRW_FEnegotiations_russo_japanese_pact:0 "俄日防御条约"
 SWRW_FEnegotiations_russo_japanese_pact_desc:0 "在各种关于日中战争的传闻甚嚣尘上的当下，我们将向日本伸出援手，与其签订一项防御条约。我们将努力成为日本“最亲密的盟友”！"
 var_nationality.1000: "俄罗斯族，以及大量根据§G《马加丹协定》§!迁徙至此的§B朝鲜移民§!"
 var_nationality.1001: "俄罗斯-东北混合族群，以及为数不少的§R日本少数民族§!，他们构成了§G“符拉迪沃斯托克-浦塩”联合管理当局§!的一部分。"
 TaS_Vladivostok_Urajio_dual_administration:0 "符拉迪沃斯托克-浦塩联合管理"
 VICTORY_POINTS_957_dual:0 "符拉迪沃斯托克-浦塩斯德"
 TaS_FE_desc_txt:0 "如今已沦为傀儡政权满洲国一部分的远东地区，自古以来就是我国不可分割的重要组成部分。我们必须抓住一切机会，让这片故土重新回到祖国的怀抱。\n\n我们将利用之前与“共荣圈”建立的友好关系，就这些地区的未来归属问题展开谈判。为了促使对方同意将远东地区归还给我们，我们必须作出一些让步，从而让这笔交易对日本及其盟友来说有利可图。我们需要取得足够的支持，才能让谈判进入下一阶段。"
 MAR_Japan.20.t:0 "远东外交“闪击战”"
 MAR_Japan.20.d:0 "目前被傀儡国家满洲国所窃据的远东地区，自我民族肇始之初便是不可分割的一部分。我们必须穷尽一切可能收复这些失地，让它们重新回到祖国的怀抱。\n\n鉴于我们与共荣圈，特别是日本之间融洽的合作关系，如果冒然支持当地那些形形色色的游击队，这未免也过于短视和得不偿失了。一个可行的方案是尝试与日本帝国就收复远东和滨海边疆区的失地展开谈判。\n\n当然，日本国内必然存在着反对的声音，但我们会尽可能地提出一个对双方都有利的提议。"
 MAR_Japan.20.a:0 "外交攻势即刻发动！"
 FE_next_round_tt:0 "§G谈判将进入下一个阶段§!"
 MAR_Japan.21.t:0 "首战告捷"
 MAR_Japan.21.d:0 "今天，根据谈判结果，满洲国同意将阿穆尔河沿岸的一大片土地，包括比罗比詹市在内，统统归还给我们。\n\n由于该地区经济发展相对滞后，而且叛乱频发、难以管束，日本外交官对此并未表现出强烈的反对。此外，也绝不能低估我们的外交人员为此付出的巨大努力，他们成功地提出了一个对我们和共荣圈而言最为有利的解决方案。\n\n我国外交部举行了一个小型的庆祝仪式，但我们绝不能就此止步，而是应该再接再厉，乘胜追击。"
 MAR_Japan.21.a:0 "我们将继续努力！"
 MAR_Japan.22.t:0 "步步为营"
 MAR_Japan.22.d:0 "致皇帝陛下阿列克谢二世·罗曼诺夫：\n\n谨向您禀报，关于全面移交滨海边疆区领土（包括比罗比詹和哈巴罗夫斯克两市）的谈判已圆满结束，我方大获全胜。日方已经知会，如果我们签署协议，他们就准备好将这些领土交还给我们。\n\n但，依臣之见，为了取得彻底的成功，我们必须收复滨海边疆区。因此，臣已指示我们的外交官在下一轮谈判中提出滨海边疆区的问题。\n\n您忠诚的，\n\n外交部长\nP.N. 德米切夫"
 MAR_Japan.22.a:0 "不久俄罗斯将重返远东"
 MAR_Japan.23.t:0 "转折点"
 MAR_Japan.23.d:0 "《马加丹协定》又一轮的谈判落下了帷幕。上一轮的谈判对我们的外交官而言可谓是如坐针毡，因为我们遭到了来自日本的工业家和官员们前所未有的抵制。\n\n尽管困难重重，但我们仍然成功地捍卫了自身的利益，并就滨海边疆区的回归达成了协议。接下来的问题便是符拉迪沃斯托克了，但我们的外交部内部已经出现了疑虑——继续坚持谈判直到最后一刻是否真的明智？毕竟，上一轮的谈判我们就已经付出了极其高昂的代价，如果在接下来的谈判中我们狮子大开口，恐怕之前所取得的一切成果都将化为乌有，“为了一座城市而牺牲整个俄罗斯”绝非是危言耸听。\n\n政府内部的意见产生了严重的分歧，而最终的决定权，仍然在我们手中。"
 MAR_Japan.23.a:0 "目前的成果已然足够。"
 MAR_Japan.23.b:0 "我们还必须收复符拉迪沃斯托克！"
 FE_primorie_success_tt:0 "我们将结束谈判，§G并保有已经取得的成果§!"
 MAR_Japan.24.t:0 "重归故土"
 MAR_Japan.24.d:0 "就在不久之前，人们还难以想象，被日本牢牢控制的滨海边疆区有朝一日能够重归俄罗斯的怀抱。而这一切，都要归功于我们的外交官们在谈判桌上的出色表现，是他们成功地将符拉迪沃斯托克争取了回来。现在，俄罗斯人民帝国的旗帜再次自豪地飘扬在这座城市的上空。\n\n当然，俄罗斯政府的高官们也纷纷来到滨海边疆区进行视察。政府总理弗拉基米尔·吉尔率先访问了该地区。他先后视察了比罗比詹、哈巴罗夫斯克以及其他城市，与当地民众进行了亲切友好的会谈，并承诺政府将会为他们提供一切必要的支持，特别是要尽快恢复城市的基础设施。\n\n不久之后，沙皇阿列克谢二世也亲自来到了滨海边疆区。他不仅接见了当地的民众，还看望了参与谈判的外交人员们。沙皇对他们英勇无畏的表现大加赞赏，并于随后授予了他们一级圣乔治勋章。\n\n此外，为了庆祝阿列克谢·尼古拉耶维奇驾临符拉迪沃斯托克，当地居民还自发地组织了一场盛大的庆祝活动。到处都能看到“热烈欢迎沙皇阿列克谢”，“解放者阿列克谢二世沙皇万岁”等标语。当天晚上，阿列克谢·尼古拉耶维奇还出席了为他举办的盛大宴会。在宴会上，沙皇亲自举杯，发表了祝酒辞：“为了和平，为了俄罗斯远东地区的自由，干杯！”"
 MAR_Japan.24.a:0 "这一切都是值得的！"
 FE_vladivostok_success_tt:0 "§G现在，整个滨海边疆区都将成为俄罗斯的一部分！§!"
 MAR_Japan.25.t:0 "谈判破裂"
 MAR_Japan.25.d:0 "致皇帝陛下阿列克谢二世·罗曼诺夫：\n\n报告。\n\n几分钟前结束的谈判表明，日本帝国不准备将前苏联远东地区的领土移交给我们。\n\n尽管我们做出了各种让步，包括给予日本移民特殊地位，但他们还是断然拒绝将控制权移交给我们。\n\n您忠诚的，\n\n外交部长\nP.N. 德米切夫"
 MAR_Japan.25.a:0 "至少我们尝试过了。"
 FE_blagoveshensk_safe_fail_tt:0 "§R尽管谈判失败了§!，§Y但我们仍然可以保住布拉戈维申斯克§!"
 MAR_Japan.26.t:0 "谈判破裂"
 MAR_Japan.26.d:0 "“谢廖沙，我早就跟你说过。我告诉过所有人，日本人根本不可能把那些被他们直接控制的土地拱手相让。”\n\n“米哈伊尔，现在说这些还有什么意义呢。事已至此，多说无益。”\n\n谢尔盖·茨韦特科夫和他的外交部同事米哈伊尔·卡尔波夫正坐在他的办公室里抽着烟。\n\n“你最好还是想想，该怎么跟彼得·尼洛维奇交代这次谈判的失败吧，”米哈伊尔紧张地敲击着桌面说道。\n\n“如实交代呗，还能怎么样？就说我们错估了形势，低估了日本人的决心。”\n\n突然，办公室的门被打开了，外交部长彼得·杰米切夫走了进来。\n\n“茨韦特科夫，卡尔波夫，立刻向我汇报谈判失败的原因！”"
 MAR_Japan.26.a:0 "部长同志，我们搞砸了。"
 FE_khabarovsk_safe_fail_tt:0 "§R尽管谈判失败了§!，§Y但我们仍然可以保住布拉戈维申斯克和哈巴罗夫斯克§!"
 MAR_Japan.27.t:0 "日之眩光"
 MAR_Japan.27.d:0 "格卢什科夫、吉尔和柯西金，这三位在西俄罗斯地区举足轻重的大人物即将抵达东京。三人内心都充满了紧张与不安，甚至可以说是如临大敌，因此格卢什科夫试图缓和一下气氛。\n\n“吉尔同志，您有没有想过，要是沙皇陛下哪天访问意大利，那您可就集齐了与‘轴心国’所有情报部门合作的成就了。”\n\n吉尔的脸因为厌恶和愤慨而扭曲了起来，仿佛他随时都可能扑向格卢什科夫，亲手掐死他。但柯西金的一声厉喝阻止了这一幕的发生。\n\n“格卢什科夫同志！立刻向弗拉基米尔·弗拉基米罗维奇郑重道歉，我不希望再听到你讲这种愚蠢的笑话！要不是他和日本宪兵队的积极合作，我们这架飞机早就被某个德国特工给打下来了！”\n\n“当然，陛下，我明白。非常抱歉，我只是想让气氛稍微轻松一点。”\n\n就在这时，飞机开始降落。吉尔利用最后的一点时间，再一次浏览了一遍与日方商定好的各项日程安排，并向他们复述了一遍：\n\n“在机场的简短欢迎仪式结束后，我们就将分头行动。格卢什科夫，你和日本的科研团队一起前往索尼的实验室，去参观考察一下他们那个超级电脑还是什么东西，你更擅长处理这些事情。与此同时，我和陛下将出席日本首相的招待会。晚些时候，在招待会结束后，陛下，您将去拜访裕仁天皇，而我将前往与宪兵队领导层的约定会面地点，我们将就如何针对德国展开进一步合作展开磋商。在这一天结束之时，我们还将一同去观看阅兵式，这显然是一次‘杀鸡儆猴’的拙劣把戏，试图用那支所谓的‘东方无敌军’来吓唬我们。尽管日方采取了极高级别的安保措施，但我还是希望你们二位在今天保持高度警惕和审慎。”\n\n在这场即兴的简报会接近尾声时，飞机的起落架也触碰到了跑道。马拉松行动正式拉开序幕。"
 MAR_Japan.27.a:0 "这将是漫长而又充满挑战的一天。"
 MAR_2WRW.1.t:0 "德国提议维持现状"
 MAR_2WRW.1.d:0 "尽管行动初期取得了一些成功，但我们进攻的速度远远不尽如人意，前线的局势仍然十分严峻，并且随着时间的流逝而不断升级。鉴于这些事态发展，奸诈的德国人担心局势进一步升级，提议我们以现状为条件缔结和平协议。\n\n尽管这一提议令人愤慨，但我们政府中的一些人预测，未来几周内前线将会彻底崩溃。他们支持以如此有争议的条件达成协议，从而以最小的损失结束战争。但是，这值得我们背叛在专员辖区里的人民吗？"
 MAR_2WRW.1.a:0 "我们做不到的，是时候冷静下来了。"
 MAR_2WRW.1.b:0 "没有“零”和平！"
 MAR_2WRW.2.t:0 "德国提议割让莫斯科维恩"
 MAR_2WRW.2.d:0 "经过几十年的努力，俄罗斯军队终于得以将德军击退，重返阿尔汉格尔斯克-阿斯特拉罕线以西的家园。目前，我们处于有利地位；德国政府担心前线崩溃，这将导致德国进一步的领土损失。因此，他们已经准备提供一份和平条约，包括莫斯科专员辖区的领土。\n\n众所周知，这个专员辖区对德国来说是无利可图的，他们试图以最小的流血代价摆脱我们。或许我们应该再对他们施加一点压力？"
 MAR_2WRW.2.a:0 "行，这都挺好的了。"
 MAR_2WRW.2.b:0 "没门儿！"
 MAR_2WRW.3.t:0 "德国提议割让莫斯科维恩和高加索"
 MAR_2WRW.3.d:0 "我们行动的进一步成功使德国的指挥部陷入了极其困难的境地。整个战线上，无论是人力还是装备都严重短缺，后方军队与游击队发生冲突的事件也越来越频繁。继续这场战争不仅可能使德国失去几个领土，甚至可能导致整个纳粹社会秩序的崩溃。\n\n德国政府向我们提供了另一个和平条约草案。根据这个条约，我们将收回西俄罗斯和高加索地区的领土。这样一来，德国就失去了油田和其他宝贵的资源，但这能否补偿我们多年来遭受的屈辱呢?"
 MAR_2WRW.3.a:0 "我们已经拼尽全力，是时候回家了。"
 MAR_2WRW.3.b:0 "没门儿！"
 MAR_2WRW.4.t:0 "德国提议有条件投降"
 MAR_2WRW.4.d:0 "我们刚刚收到德国人的一个紧急消息！他们提议将白俄罗斯和第聂伯河以东的整个乌克兰给我们，以换取立即停止敌对行动！我们已经消灭了他们的主力部队，这就是为什么他们现在向前线派遣新的预备队。大日耳曼国内部正在发生政治动荡。一些被纳粹占领国家的政客已经开始呼吁收回他们的主权。我们可以现在就停手，取得这场我们已经奋战了这么多个月的胜利。\n\n但问题依然存在：我们应该为了一块土地出卖我们的自由吗？德国人提供给我们的是一个小胜利，代价却是我们巨大的自豪感和目标的丧失。这样的提议可能会对我们国家的未来产生严重影响。我们不能为了短期利益而冒险失去自由。我们所有的努力、牺牲和损失都是为了捍卫我们的祖国和主权。"
 MAR_2WRW.4.a:0 "我们同意，召集会议。"
 MAR_2WRW.4.b:0 "我们的俄罗斯精神比任何领土都更有价值！"
 MAR_2WRW.5.t:0 "德国的无条件和平"
 MAR_2WRW.5.d:0 "我们已经完成了不可能的任务。圣彼得堡、莫斯科、伏尔加格勒以及其他数百个真正的俄罗斯城市都在我们身后。我们为这些人民带来了自由，可恨的大日耳曼国在所有战线上遭遇一次又一次的失败。剩下的为数不多的国防军士兵完全丧失了斗志；他们的祖国一片混乱，他们的未来充满不确定性。\n\n在绝望之中，德国向我们提供了最终版本的和平条约。根据条约，我们将获得所有东部专员辖区的领土，包括波兰。这是他们的最后提议。如果我们继续军事行动，战争只会以我们中的一方被彻底摧毁而告终。"
 MAR_2WRW.5.a:0 "我们对这些条款感到满意。"
 MAR_2WRW.5.b:0 "我们已经接近真正的胜利，向柏林进发！"
 MAR_2WRW_gone_wrong_tt:0 "采取此§Y决议§!可能会导致§e无法预料的后果§!"
 MAR_2WRW.6.t:0 "德国的无条件和平"
 MAR_2WRW.6.d:0 "我们做到了！\n\n二十年前，谁会想到这几乎已经销声匿迹的青年俄罗斯联盟的旗帜会骄傲地飘扬在曾经称霸世界的德国政府大楼上？\n\n这条道路极其艰难，许多与我们一同起步的人已经离开了人世。但这些磨难淬炼了我们，德国人在不知不觉中为自己打造了最终被击败的利剑。当他们向我们的东方大地派遣轰炸机时，他们没有想到战争很快就会降临到他们的家门口，而这一次，战机来自相反的方向。\n\n我们攻克了柯尼斯堡，包围了莱比锡。现在德国已经没有一个角落不知道俄罗斯军队的强大。半个多世纪以来，我们一次又一次地遭受德佬的失败：第一次世界大战、卫国战争、西俄战争——这些都是俄罗斯历史上的黑暗篇章，但今天我们彻底结束了这一切。我们不会再允许法西斯主义的威胁在我们眼皮底下滋长。\n\n俄罗斯士兵的脚践踏了纳粹主义的心脏。"
 MAR_2WRW.6.a:0 "结束三十余年的屈辱。"
 MAR_2WRW.7.t:0 "德国的最后通牒"
 MAR_2WRW.7.d:0 "无论在战场上取得多么辉煌的胜利，但战争总是伴随着这样或那样的困境，有时甚至会让人产生放弃继续作战的念头。今天这场战争，也不例外。导致冲突难以维继的因素有很多，比如战争所带来的厌倦情绪，亦或是因为国家经济的崩溃，导致无以为继，但是这次，却是以一种截然不同的方式，面临着是否需要停止军事行动的选择。\n\n德国对俄国人在战场上的每一次胜利都恨得咬牙切齿，使用核武器来阻止俄军前进的想法，在德国高层的脑海中也是愈发强烈。现在，当战线已经推进到德国的专员辖区，战火甚至直接烧到了德国本土城市时，德国国防军最高统帅部再也无法继续坐视不管，任由帝国走向毁灭。在经过一番紧锣密鼓地商讨之后，一份最后通牒被送到了俄罗斯人手中，留给他们的时间已经不多了。\n\n最后通牒的核心内容是，要求俄罗斯方面立即停止所有军事行动，并与德国展开和平谈判，以解决所有在当前冲突中存在的领土争端问题。否则，德国将毫不犹豫地使用核武器。而且，只要俄罗斯方面敢于对这一要求置之不理，德国的核弹就将飞向俄罗斯的领土。他们才不会在乎这会对俄罗斯乃至整个世界造成怎样的灾难性后果呢。\n\n这份最后通牒令我方代表义愤填膺，如此野蛮行径理应受到全世界的谴责和唾弃。然而，沙皇在最后通牒上的批示，却决定了所有人的命运。"
 MAR_2WRW.7.a:0 "为了人类的延续，开始和平谈判。"
 MAR_2WRW.7.b:0 "在我们踏平柏林的废墟之前，绝不罢手！继续进攻！"
 MAR_Collapse.1941.t:0 "德国要求投降"
 MAR_Collapse.1941.d:0 "我们的总参谋部陷入了恐慌。德国人突破了我们预先准备的防线。继续进攻已经无法谈起，战线正在对我们不利的方向崩溃。主要城市再次遭受德国空军轰炸机的空中恐怖袭击。我们灾难性地高估了自己的力量，现在我们在西俄罗斯再次遭受一次又一次的失败。德国人继续向东推进，我们可能失去整个西俄罗斯。\n\n然而，仍然有希望找到解决方案。今天我们收到了德国的投降提议，他们愿意在到达阿尔汉格尔斯克-阿斯特拉罕线后停止军事行动。我们投降，让他们进入阿尔汉格尔斯克-阿斯特拉罕线的领土。\n\n否则，他们威胁要继续向乌拉尔山进军，甚至在叶卡捷琳堡和车里雅宾斯克组织空降行动。目前，我们别无选择，只能接受这个提议。"
 MAR_Collapse.1941.a:0 "愿祖国宽恕我们..."
 MAR_Collapse.1941.b:0 "我们将战斗到底！"
 TaS_WRW2_fate_and_coring_of_territories:0 "§Y区域整合§!"
 TaS_WRW2_fate_and_coring_of_territories_desc:0 "俄罗斯，或者说，至少是她自由的那部分，如今已经重新团结一心。但伴随着新领土的回归，我们也面临着与混乱时代相同的难题：回归地区的民心并不稳定，当地居民对我们缺乏信任，更不用说那些遍布各地的外国殖民者了。\n\n我们必须尽快决定如何处置这些地区的原住民，并着手实施一体化政策，即便需要采取强制手段也在所不惜。这些地区的整合，将直接关系到俄罗斯能否真正实现§G统一且不可分割§!的目标。"
