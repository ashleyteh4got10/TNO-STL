 TaS_WRW2_activate_plan_spb:0 "§C“亚历山大·涅夫斯基”行动§!"
 TaS_WRW2_activate_plan_spb_desc:0 "“亚历山大·涅夫斯基”行动的目标是向莫斯科专员辖区的北部地区发动进攻，并最终拿下该地区的两个最重要的城市——诺夫哥罗德和圣彼得堡。通过向北方的这一快速进军，我们将效仿1240年和1242年的亚历山大·涅夫斯基，将德国侵略者彻底从我们北方的土地上驱逐出去。"
 TaS_WRW2_activate_plan_spb_tt:0 "在接下来的§Y90天内§!，我们必须拿下§C圣彼得堡§!。在该行动期间，我们将获得一个§Y民族精神§!，它将§G极大增强我军的战斗力§!。§R作战失败§!将会对我军的§K战斗力§!造成§e灾难性的打击§!。"
 TaS_WRW2_activate_plan_spb_mission:0 "启动§C“亚历山大·涅夫斯基”行动§!的时机已然成熟！"
 TaS_WRW2_activate_plan_msk:0 "§R“米宁和波扎尔斯基”行动§!"
 TaS_WRW2_activate_plan_msk_desc:0 "“米宁和波扎尔斯基”行动的目标是向莫斯科专员辖区的核心地带发动进攻，并最终包围并攻克莫斯科。正如当年的米宁和波扎尔斯基那样，我们将把侵略者从我们光荣的首都永远地驱逐出去！"
 TaS_WRW2_activate_plan_msk_tt:0 "在接下来的§Y90天内§!，我们必须拿下§C莫斯科§!。在该行动期间，我们将获得一个§Y民族精神§!，它将§G极大增强我军的战斗力§!。§R作战失败§!将会对我军的§K战斗力§!造成§e灾难性的打击§!。"
 TaS_WRW2_activate_plan_msk_mission: "启动§R“米宁和波扎尔斯基”行动§!的时机已然成熟！"
 TaS_WRW2_activate_plan_volga:0 "§Y“德米特里·顿斯科伊”行动§!"
 TaS_WRW2_activate_plan_volga_desc:0 "“德米特里·顿斯科伊”行动的核心目标是进攻莫斯科专员辖区的南部地区，以及高加索专员辖区的全境。通过执行这一行动，我们将切断德国获取战略石油储备的通道，这将极大地削弱德国国防军的战斗力。"
 TaS_WRW2_activate_plan_volga_tt:0 "在接下来的§Y90天内§!，我们必须拿下§C伏尔加格勒§!。在该行动期间，我们将获得一个§Y民族精神§!，它将§G极大增强我军的战斗力§!。§R作战失败§!将会对我军的§K战斗力§!造成§e灾难性的打击§!。"
 TaS_WRW2_activate_plan_volga_mission: "启动§Y“德米特里·顿斯科伊”行动§!的时机已然成熟！"
 TaS_WRW2_activate_plan_kiev:0 "§G“斯维亚托斯拉夫·伊戈列维奇”行动§!"
 TaS_WRW2_activate_plan_kiev_desc:0 "“斯维亚托斯拉夫·伊戈列维奇”行动的目标是夺取乌克兰专员辖区那些肥沃的土地。拿下这片区域将会使德国国防军的粮食供应出现严重问题，并极有可能引发德国内部出现粮食危机。"
 TaS_WRW2_activate_plan_kiev_tt:0 "在接下来的§Y90天内§!，我们必须拿下§C基辅§!。在该行动期间，我们将获得一个§Y民族精神§!，它将§G极大增强我军的战斗力§!。§R作战失败§!将会对我军的§K战斗力§!造成§e灾难性的打击§!。"
 TaS_WRW2_activate_plan_kiev_mission:0 "启动§G“斯维亚托斯拉夫·伊戈列维奇”行动§!的时机已然成熟！"
 TaS_WRW2_activate_plan_riga:0 "§G“伊凡雷帝”行动§!"
 TaS_WRW2_activate_plan_riga_desc:0 "“伊凡雷帝”行动将在这场战争中扮演至关重要的角色。它的核心目标是夺取波罗的海三国和白俄罗斯的领土。拿下这些区域就意味着我们能够打通通往德国本土的进攻通道。"
