 MAR_2WRW.1978.t:0 "沙皇的梦想"
 MAR_2WRW.1978.d:0 "克里姆林宫与皇家宫殿空空荡荡，沙皇陛下不在莫斯科，也不在维亚特卡。只有寥寥数人知晓，在这阳光明媚的日子里，他来到了别列兹尼基附近那栋乡间别墅。门廊上伫立的并非那位身披戎装的君王，而只是一个平凡的男人——谢尔盖·别洛泽尔斯基，他正准备着渔具。渴望在自然中享受平静的一天，他回到了那片熟悉的湖泊，那是维亚特卡与别列兹尼基关系破裂之时，他常去的地方。自那以后，这片森林鲜有变化，唯有德国轰炸机的嗡鸣声不再响起。谢尔盖穿戴好橡胶靴，涉水走进湖中，开始垂钓。他将烦恼抛诸脑后，全然沉浸于自然的静谧与美好。一桶鲜鱼满载而归，暮色也悄然降临。谢尔盖走出湖水，坐在岸边。夕阳的余晖洒落在湖面，映照着森林，美不胜收。望着这景色，谢尔盖不禁想起平日的烦忧，想起一切本可以不同的走向，想起如今他的子民终于可以平静地迎接日落，想起他所做的一切，以及他还能做些什么。当最后一缕阳光消失在地平线尽头，谢尔盖也决定结束这短暂的休憩。他起身准备离开…\n\n...然而，他却无法动弹。他的半身失去了知觉，身体无力地倒向一旁。他试图呼救，却只是徒劳，喉咙里只能发出嘶哑的低语。\n所幸，负责守卫这片森林的国家安全部人员及时赶到，将他救起。\n\n两小时后，谢尔盖被直升机送往叶卡捷琳堡的乌拉尔中央医院。五小时后，卡津别克和柯西金也赶到了医院。尽管医生竭尽全力，但一切已无力回天。中午时分，谢尔盖·别洛泽尔斯基与世长辞。"
 MAR_2WRW.1978.a:0 "沙皇永不逝去。"
