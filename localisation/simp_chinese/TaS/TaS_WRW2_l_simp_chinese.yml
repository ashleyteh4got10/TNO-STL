 TaS_SWRW_into_icon_tt_delayed:0 "§e第二次西俄罗斯战争§!界面显示了§q第三帝国§!与§K统一的俄罗斯§!之间战争的§Y当前§!§R阶段§!。§D每一个§!§R战争§!阶段都有其§Y独特的决议§!。在第一阶段，§Y本界面§!还会显示一些§B重要§!§G信息§!，如 £readiness_war §G备战度§!（§K俄罗斯§!）以及 £reich_awareness §R警惕度§!（§q德国§!）；在§B第二阶段§!则会§B显示§!双方的§e战争损耗§!。\n\n这场§V冲突§!中的§K胜利§!亦或是§e失败§!都将会给§M整个世界§!的§a政治局势§!带来§x深远§!的§Y影响§!。究竟是§r旧秩序§!土崩瓦解，还是§q德意志§!能够捍卫其§j生存§!的§j权利§!？§M整个世界§!的§O命运§!都将取决于§o东欧§!§x战场§!上那一场场你死我活的厮杀。然而，切记，一旦§Y冲突§!§e升级§!，这场战争很有可能成为§I人类文明史§!上的§e最后§!一战。\n\n§e末日审判的丧钟§!§h业已敲响§!，§Q你又是否能及时§!§n悬崖勒马§!呢？"
