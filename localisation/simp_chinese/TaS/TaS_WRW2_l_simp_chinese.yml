 MAR_2WRW_world_news.40.t:0 "[Get_newspaper_header]谢尔盖一世驾崩"
 MAR_2WRW_world_news.40.d:0 "昨天，俄罗斯人民沙皇国宣布举国哀悼。在第二次大动乱后统一俄罗斯并在第二次西俄罗斯战争中粉碎大日耳曼国的沙皇将军谢尔盖·康斯坦丁诺维奇·别洛泽尔斯基在度假期间因心脏病发作去世。他已经83岁了，尽管最好的医生做出了努力，但还是救不了国王。在最近的一段时间内，国家将由摄政委员会管理，该委员会由青年俄罗斯联盟的领袖亚历山大·卡津别克担任主席。安魂曲和国王的葬礼将在克里姆林宫举行。仪式的确切日期将很快公布。许多国家已经表达了哀悼之情，最亲密的盟友也承诺派代表团参加葬礼。谢尔盖·康斯坦丁诺维奇·别洛泽尔斯基的去世对俄罗斯和世界上许多尊重他作为杰出政治人物的国家来说是一个巨大的损失。"
 MAR_2WRW_world_news.40.a:0 "你已经尽力了，安息吧。"
 TaS_WRW2_territorial_reclamation:0 "收复失地"
 TaS_WRW2_territorial_reclamation_desc:0 "\n\n\n\n\n\n我们已经统一了俄罗斯，至少统一了俄罗斯的独立部分。然而，这远非结束，我们的目光投向了收复我们祖国所有失去的领土。在每一个具体的案例中，我们都将采取不同的策略来收复领土。有的地方可以协商解决，有的地方我们会发出最后通牒。§R但在某些特殊情况下，战争将不可避免。§!因此，我们必须为任何情况做好准备。"
