 MAR_2WRW_world_news.25.t:0 "[Get_newspaper_header]俄罗斯入侵阿富汗"
 MAR_2WRW_world_news.25.d:0 "媒体接连传来令人不安的紧急消息，焦点集中在动荡不安的中亚地区。阿富汗，这个深陷危机、近期因政变更换政府，并随后与俄罗斯人民帝国建立外交关系的国家如今却遭到其新盟友的入侵。大量照片和视频证据显示，俄罗斯的军事装备车队已越过边境，正朝喀布尔方向推进。\n\n阿富汗政府发布声明，否认这是一场入侵，声称俄罗斯的行动是为了提供军事、物资技术和人道主义援助，以帮助新政府对抗反对势力。然而，这一声明引发了广泛质疑，其真实性备受怀疑。尽管如此，世界主要大国的政府对此声明尚未作出任何评论。"
 MAR_2WRW_world_news.25.a:0 "可疑的声明。"
 MAR_2WRW_world_news.26.t:0 "[Get_newspaper_header]阿富汗内战"
 MAR_2WRW_world_news.26.d:0 "自从阿富汗在帕米尔战争中惨败于俄罗斯后，国内局势每况愈下，愈发恶化。政府内部的动荡与反政府武装的起义，终于演变为一场激烈的冲突。\n\n首都喀布尔爆发了全面的武装冲突，交战双方分别是政府军与“伊斯兰促进会”——一个主张国家联邦化的温和伊斯兰主义组织。而在南部地区，“伊斯兰促进会”内部分裂出的更激进派系“阿富汗伊斯兰党”开始活跃，局势愈发复杂。\n\n目前，喀布尔及南部地区的状况尚不明朗。阿富汗政府已紧急撤往赫拉特，并在那里集结力量，准备对叛军发起反击。"
 MAR_2WRW_world_news.26.a:0 "帝国坟场正在崩塌？"
 MAR_2WRW_world_news.27.t:0 "[Get_newspaper_header]阿富汗临时政府在内战中获胜"
 MAR_2WRW_world_news.27.d:0 "阿富汗的流血冲突似乎已告一段落。由伊斯兰促进会领导的阿富汗临时政府宣布，他们已摧毁“革命敌人”的最后据点，国内的内战正式结束。\n\n新成立的阿富汗政府宣称，将立即启动国家重建，并迈向联邦制，承诺“从乌兹别克人、普什图人到塔吉克人、波斯人，所有民族将在闪耀的新月下和谐共处”。然而，这些话语的真实性令人怀疑。胜利带来的短暂喜悦很快被阴影笼罩，有传言称临时政府军中占多数的塔吉克士兵与普什图人之间已爆发民族冲突。\n\n目前，伊斯兰促进会正努力维持局势稳定，但他们能否长久坚持，仍是未知之数。"
 MAR_2WRW_world_news.27.a:0 "嗯，祝他们好运吧？"
 MAR_2WRW_world_news.28.t:0 "[Get_newspaper_header]阿富汗赫拉特政府在内战中获胜"
 MAR_2WRW_world_news.28.d:0 "阿富汗的流血冲突似乎已接近尾声。此前撤往赫拉特的阿富汗政府宣布取得决定性胜利，成功镇压所有叛乱势力。官员们开始陆续返回饱受战火摧残的喀布尔。尽管战争造成巨大伤亡，政府仍宣布推行“民族和解政策”，但具体内容尚不明确。\n\n目前已知全国范围内正在大规模逮捕叛乱分子的支持者。山区虽仍有零星交火，但至少表面上，阿富汗似乎重新恢复了稳定。"
 MAR_2WRW_world_news.28.a:0 "维持现状也算一种出路。"
 MAR_2WRW_world_news.29.t:0 "[Get_newspaper_header]阿富汗救国政府在内战中获胜"
 MAR_2WRW_world_news.29.d:0 "阿富汗的流血冲突似乎已告一段落。在坎大哈，阿富汗伊斯兰党组织宣布胜利，宣称“圣战在国内取得辉煌成功”。如今，伊斯兰主义者正试图按照他们的理念重塑阿富汗，全国各地开始强制推行伊斯兰教法。少数非伊斯兰族群的处境较战时更加恶劣。\n\n新阿富汗政府中不少激进分子已公开宣称，应将圣战扩展至中亚及中东其他国家。他们是否会满足于阿富汗一隅，还是将理念传播至他国，遗憾的是，答案只能交由时间揭晓。"
 MAR_2WRW_world_news.29.a:0 "这一切仰赖真主的恩慈？"
 MAR_2WRW_world_news.30.t:0 "[Get_newspaper_header]外满军情"
 MAR_2WRW_world_news.30.d:0 "令人不安的消息从满洲传来。在第二次世界大战期间被满洲傀儡政府吞并的苏联领土上，游击队活动激增。\n\n专家将这种活动与前苏联新的统一政府的出现联系起来。满洲政府采取了果断的行动，在全国范围内实施戒严令，直到局势得到解决。他们是否能够应对这种威胁，或者这种叛乱是否会使共荣圈的掌上明珠垮台，还有待观察。"
 MAR_2WRW_world_news.30.a:0 "共荣圈的明珠混乱升级。"
 MAR_2WRW_world_news.31.t:0 "[Get_newspaper_header]游击队摘得起义果实"
 MAR_2WRW_world_news.31.d:0 "乌苏里河畔传来了令人震惊的消息。俄国游击队几乎控制了整个外满洲，彻底击败了关东军和日本帝国远征军。\n\n最近，在前线城市哈巴罗夫斯克和符拉迪沃斯托克，公众举行了庆祝活动，同时还发生了骚乱和对日本财阀资产的袭击。预计俄罗斯军队将在不久的将来部署到位。目前，日本的新闻界对满洲发生的事情保持沉默，只是用标准的措辞表示，不允许干涉共荣圈独立成员国的事务。当被美国记者问及日本军队在这场危机中的参与情况时，首相的新闻秘书给出了一个简短的回答:“他们不在那里。”\n\n无论如何，我们似乎正在见证自第二次世界大战以来东亚最大冲突的结束，而这一次，命运站在觉醒的俄罗斯巨熊一边。"
 MAR_2WRW_world_news.31.a:0 "俄罗斯熊的第一场胜利？"
 MAR_2WRW_world_news.32.t:0 "[Get_newspaper_header]日本成功镇压起义"
 MAR_2WRW_world_news.32.d:0 "根据军事通讯员的报道，满洲俄国起义的残余力量被赶过了阿穆尔河。俄罗斯帝国和OFN的官方代表谴责这一行动是对人民自决权的压制。与此同时，在满洲政府重新控制的地区，正在发生大规模逮捕和不明方向的俄罗斯人口流动。尽管如此，仍有大批俄罗斯人逃往俄罗斯，小木筏甚至阻碍了阿穆尔河沿岸的航行。俄罗斯帝国已宣布全面禁止向共荣圈国家供应石油，这将使石油危机中的日俄紧张局势进一步复杂化。\n\n尽管镇压了起义，但外满洲目前已是一片废墟，而且共荣圈的主要工业区也没有恢复的希望。有一件事是肯定的:这个地区的未来看起来极不确定。"
 MAR_2WRW_world_news.32.a:0 "共荣圈的明珠混乱升级。"
 MAR_2WRW_world_news.33.t:0 "[Get_newspaper_header]满洲进入紧急状态"
 MAR_2WRW_world_news.33.d:0 "从新京传来了关于一场政变的消息，令人喜忧参半。在满洲国于俄罗斯起义中战败后，日本帝国陆军以维护当地秩序为由，宣布在该地区实施紧急状态，并向那里增派了部队。\n\n东京的官员们宣称，这些都只是临时措施，其目的是为了恢复当地的秩序，并维护“大东亚共荣圈”的完整性。然而，政治专家们却认为这些措施实属不智，从短期来看，这可能会给日本带来毁灭性的地缘政治后果。"
 MAR_2WRW_world_news.33.a:0 "共荣圈的明珠平息了吗？"
 MAR_2WRW_world_news.34.t:0 "[Get_newspaper_header]满洲灾难"
 MAR_2WRW_world_news.34.d:0 "日本帝国陆军的政变引发了截然不同的反响。支持者虽不在少数，但更多人对这一结局表达了强烈不满。\n\n本已微薄的权利与自由进一步遭到限制，这让军队失去了当地民众的支持。而所谓的“救济性经济政策”。通过对几乎所有生产领域实施直接控制，并对企业高层进行打压，将其作为远东亲俄叛乱胜利后的替罪羊，更是成为反政变行动的导火索。\n\n由企业暗中资助的小型武装力量迅速占领了主要行政建筑，并宣布结束全国的军事管制状态。然而，驻扎在满洲的日本帝国陆军高层对此反应激烈，公开谴责这一行为“破坏国家根基”，并宣称将迅速采取反制措施。"
 MAR_2WRW_world_news.34.a:0 "破碎的国家，破碎的共荣圈。"
 MAR_2WRW_world_news.35.t:0 "[Get_newspaper_header]俄罗斯宣布对满发动军事行动"
 MAR_2WRW_world_news.35.d:0 "已饱受内战蹂躏的满洲，如今正一步步滑向更深的混乱深渊。\n\n根据一些零星的报道，冲突各方都已无法完全控制各自麾下的部队。许多士兵要么选择开小差，要么纠集起来，拉帮结伙，沦为无恶不作的匪徒。大城市已是人去楼空，荒无人烟，而乡村地区则倒退回了蒙昧的中世纪。如今，由于全国各地的通讯都已中断，甚至已经没有人能说清究竟是哪一方控制着哪一片区域了。\n\n东京方面宣称，他们正准备向仍然驻扎在大连的、由日本皇军与伪满军队组成的联合守备队运送补给，并计划尽快恢复“满洲国”的秩序。"
 MAR_2WRW_world_news.35.a:0 "又一颗钉子钉在武士的棺材上。"
 MAR_2WRW_world_news.36.t:0 "[Get_newspaper_header]主权派赢得满洲内战"
 MAR_2WRW_world_news.36.d:0 "看来满洲的局势已开始趋于平稳。今天，满洲“皇帝”溥杰宣布战胜了其余各派势力。"
 MAR_2WRW_world_news.36.a:0 "自由独立的满洲？"
 MAR_2WRW_world_news.37.t:0 "[Get_newspaper_header]企业赢得满洲内战"
 MAR_2WRW_world_news.37.d:0 "显然，钱确实可以实现一切事情。来自满洲的消息称，企业民兵和私人军队控制了大部分主要城市。总的来说，不管这意味着什么，满洲新政府已经就广泛的改革计划和启动自由化进程做出了有希望的声明。巨企的阴影再次笼罩着满洲，但现在不是日本。让我们拭目以待企业国家能否生存下来，并复制广东的成功。至少，这不是不可能的。"
 MAR_2WRW_world_news.37.a:0 "极北版广东？有趣。"
 MAR_2WRW_world_news.38.t:0 "[Get_newspaper_header]关东军赢得满洲内战"
 MAR_2WRW_world_news.38.d:0 "关于在满洲各地建立军事统治的报道不断传来。关东军成功地恢复了现状，但能维持多久呢?没有迹象表明军方领导层有任何具体的行动计划或打算做出任何改变。如果他们不采取任何行动，内战可能会以新的力量再次爆发。他们已经控制了曾经快速增长的经济和数千万憎恨他们的公民的废墟。在不久的将来，我们将看到他们将如何处理这种情况。"
 MAR_2WRW_world_news.38.a:0 "北方明珠再次受制于他们的统治。"
 MAR_2WRW_world_news.39.t:0 "[Get_newspaper_header]抗日联军赢得满洲内战"
 MAR_2WRW_world_news.39.d:0 "随着满洲战事的落幕，眼下似乎只剩下了一位角逐者——那个名字缩写最为拗口的派系：东北抗日联军。唯一能团结这个组织便是对日本人的刻骨仇恨。\n\n没人知道，包括我们在内，他们打算如何建设一个新的满洲国家。该组织内部四分五裂，在几乎所有问题上都无法达成一致。这一切究竟该如何运转，是个巨大的问号；但无论如何，他们赢得了胜利。\n\n在可预见的未来，他们将主宰满洲的命运。"
 MAR_2WRW_world_news.39.a:0 "日本会作何反应？"
 MAR_Japan.17.t:0 "符拉迪沃斯托克，重归故土。"
 MAR_Japan.17.d:0 "今天，对符拉迪沃斯托克的居民们来说，将是永生难忘的一天。沙皇兼将军谢尔盖·别洛泽尔斯基走下了他的汽船，踏上了这座城市的海滨大道，早已在围栏外等候的人群中爆发出雷鸣般的欢呼声。但此时还远不是放松的时候，前来迎接沙皇的，还有当地游击队的领袖们，他们都穿着苏联时期的旧军大衣。沙皇与他们一一亲切地握手致意，仿佛他们是多年未见的老友，并向他们颁发了表彰他们从侵略者手中解放祖国的勋章。游击队中一位年龄最长的老兵——看起来已经年过七旬，走到沙皇面前，摘下自己的皮毛冬帽，说道：“我们中的许多人，为了这一刻，已经等待了将近三十载的光阴。沙皇兼将军，请允许我将这座城市的钥匙交还给您。”在那一刻，所有人都意识到，一个具有历史意义的时刻到来了——符拉迪沃斯托克正式回归俄罗斯的怀抱！\n\n随后在市政厅举行的会议以及关于滨海边疆区重新并入俄罗斯人民沙皇国的联合声明，不仅仅是一纸官样文章，更是长久以来人们对统一的殷切期盼终于化为现实的象征。在签署完声明，并与游击队领袖们共同参加完新闻发布会后，沙皇兼将军决定再主持一项重要的仪式——青年俄罗斯联盟远东分部的成立大典。\n\n沙皇刚一抵达会场，现场的党员和当地民众便报以排山倒海般的欢呼声和掌声。沙皇向符拉迪沃斯托克的居民们发表讲话，向他们保证俄罗斯永远不会忘记那些最普通的人民群众，并承诺将会尽一切努力确保人民能够过上体面而又充满希望的生活。所有曾经逃亡北方的居民，如今都可以返回故乡，拿回属于他们的财产。而那些在侵略者所施行的野蛮政策中被强制移民到此地的亚洲人，要么返回共荣圈的其他国家，要么入乡随俗，继续在这一地区务农。\n\n欢庆的氛围在这座城市上空久久地回荡，大街小巷都挤满了庆祝的人群，他们沉浸在城市光复的喜悦之中。在离开符拉迪沃斯托克之前，别洛泽尔斯基收到了来自国家安全委员会的报告，报告中称，符拉迪沃斯托克回归祖国的消息引发了仍被德国人占领的莫斯科和高加索地区爆发了一连串的起义。"
 MAR_Japan.17.a:0 "而我们的征程，才刚刚开始。"
 MAR_Japan.16.t:0 "回到祖国的港湾"
 MAR_Japan.16.d:0 "就在不久前，谁也没有想到，被日本控制的滨海边疆区有一天会回归俄罗斯。毕竟，它仍然太弱，无法与三个超级大国之一采取任何军事行动。然而，现在俄罗斯人民帝国的旗帜正飘扬在这些领土上。\n\n自然，俄罗斯领导人在吞并后访问了滨海边疆区。首先，首相弗拉基米尔·吉尔访问了那里。他访问了符拉迪沃斯托克、哈巴罗夫斯克、比罗比詹等城市。在那里，他与当地人进行了交谈，并向他们承诺政府将提供全面援助，特别是在恢复城市基础设施方面。\n\n过了一段时间，沙皇阿列克谢二世决定亲自访问滨海边疆区。他不仅会见了市民，而且会见了在整个期间得到全面支持的前游击队员。沙皇感谢他们英勇地履行职责。后来，他们被授予一级乔治十字勋章。\n\n此外，阿列克谢·尼古拉耶维奇抵达符拉迪沃斯托克后，当地人组织了一场真正的庆祝活动。到处都有写着“符拉迪沃斯托克居民向沙皇阿列克谢致以热烈问候”、“荣耀属于解放者沙皇阿列克谢二世”等字样的标语。晚上，阿列克谢·尼古拉耶维奇参加了为他举行的宴会。\n\n当客人们开始散去时，本应陪同阿列克谢二世旅行的一名克格勃特工走近他，向他转达了弗拉基米尔·吉尔的一条重要信息。电文说，由于在滨海边疆区的游击斗争取得了成功，莫斯科专员辖区的游击队员也开始从事与滨海边疆区类似的活动。"
 MAR_Japan.16.a:0 "很快，我们将在莫斯科庆祝。"
 MAR_Japan.9.t:0 "哈尔滨致电"
 MAR_Japan.9.d:0 "吉尔伏案桌前，眉头紧锁，审视着散落一桌的滨海边区军事地图。他正准备在地图上标记俄罗斯帝国在新占领土上的最新兵力部署，突然，一阵急促的电话铃声划破了寂静。\n\n“说吧…” 吉尔的目光落在了那部最新款的安全电话上。来电显示是国家安全部的对外情报局，他们的电话只意味着一个可能——紧急军情。\n“我是吉尔。”他接起电话，言简意赅。\n“弗拉基米尔·弗拉基米罗维奇！我们在哈尔滨的行动人员紧急联络了我们，他们报告说，满洲的反抗军和金日成的游击队已经对日本及其傀儡政权发动了全面起义。目前，伪满政府军还没来得及做出反应，如果我们现在出兵支援起义军，将有很大希望能重创日本，并将势力范围进一步扩张到满洲地区。”电话那头，对外情报局的军官语速飞快地汇报着。\n\n吉尔意识到这是一条极其重要的情报。他立即要求对方发送一份详细的报告，然后果断地挂断了电话，抓起另一部电话，准备拨通下一个号码…"
 MAR_Japan.9.a:0 "我们需要联系沙皇陛下..."
 MAR_Japan.10.t:0 "远东游击队活动"
 MAR_Japan.10.d:0 "最近几周，外满发生了大量“偶发”事件，袭击驻防部队、火车脱轨、火灾、神秘死亡和关东军军官失踪等等。不用想，幕后黑手肯定是俄罗斯的地下势力。尤其结合它最近重新统一的背景看，游击队活动增加绝非偶然。\n\n今天，一名俄国抵抗组织代表抵达布拉戈维申斯克远东军区总部。他以自己组织的名义要求我们支持即将到来的起义，共同反对占领当局。已经没有时间前后踌躇了，干还是不干就是一句话，每晚一分钟，日本就能从本岛多转移一名军警来镇压。"
 MAR_Japan.10.a:0 "至少现在，让我们继续观察。"
 MAR_Japan.11.t:0 "远东游击队活动"
 MAR_Japan.11.d:0 "致吉尔元帅：\n\n在阿穆尔州哈巴罗夫斯克边疆区和日占的滨海边疆区一带，最近出现了明显更加活跃的游击队。\n\n情报机构报告称，日军警备部队和游击队之间每天都有交火，这给双方都造成了不小的损失。尤其应当注意一场发生在代斯纳村附近的战斗：游击队在娴熟的指挥下，摧毁了一处轻武器仓库，并全歼了守备在彼处的关东军士兵，自身没有任何伤亡。\n\n游击队成员主要是满洲国控制区的俄语居民，也有很多朝鲜裔战士。我们的情报机构认为在朝鲜应该也有类似的游击组织，但是我们目前尚未能掌握它们的具体情况。\n\n游击队遵循一种中心化的运作模式，有一套苏式的指挥系统，但也在深入敌后时分割成自主行动的若干组。情报机构认为，远东组的组长是谢尔盖·扎伊金上尉。\n\n游击队最高司令部的灵活指挥，以及战士们高昂的士气允许我们在满洲地区发动一场大规模行动。这将动摇日本在整个地区的统治。"
 MAR_Japan.11.a:0 "是时候行动了。"
 MAR_Japan.14.t:0 "哈巴罗夫斯克之战"
 MAR_Japan.14.d:0 "阿列克谢·格里申，曾经的插画师，如今因命运的转折而成为王国印刷厂的一名官员。他全神贯注地投入到了当前的工作中：钞票的革新已迫在眉睫，新钞的发行势在必行。为了稍微舒缓紧张的思绪，他轻启窗台上的收音机。\n\n播音员的声音如同激昂的旋律穿透寂静的空气：“就在今晨九时，日本帝国军队在哈巴罗夫斯克的最后一支顽抗之师终于放下了武器，标志着这座城市彻底获得了解放，解放者是远东人民解放运动的第二军团。为了庆祝这一具有历史意义的时刻，我们将以124门大炮鸣放12响礼炮，哈巴罗夫斯克将被光荣地授予‘首响礼炮之城’的荣誉称号。”\n\n闻听此言，阿列克谢瞬间灵感迸发，做出了决定性的选择：新版纸币的图案将定格在这座象征着自由与胜利的俄罗斯城市——哈巴罗夫斯克。"
 MAR_Japan.14.a:0 "俄罗斯的胜利终将到来"
 MAR_Japan.15.t:0 "哈巴罗夫斯克之战"
 MAR_Japan.15.d:0 "扎伊金上尉坐在一个精心伪装的野战指挥部里。摆在他面前的是一张用铅笔绘制前线的地图，右侧立着一台固定无线电台。上尉已经三天没合眼了，积累的疲惫几乎让他虚脱，但他仍在坚持工作。他负责指挥上千名士兵，每一个人的命运都掌握在扎伊金手中，他绝不能让他们白白牺牲。上尉正在思考接下来的战斗计划，无线电的噼啪声打断了他的思绪。\n\n“总部，请回答，完毕！阿穆尔2-3呼叫总部，完毕！”\n\n扎伊金抓起无线电。“这里是总部，阿穆尔2-3，请报告,完毕。”\n\n“总部，情况非常糟糕。我们正遭受敌人的猛烈炮火，我们在这里被杀得很惨。已经损失了近一半的人员。请求下达撤退并重组的命令，完毕！”\n\n扎伊金冷汗直冒。“收到，阿穆尔2-3，等待进一步命令。坚持住,伙计们！”扎伊金调整了电台频率，再次拿起无线电。“总部呼叫群星1-1，汇报情况，完毕。”\n\n扬声器中传来一个沙哑的声音：“群星1-1报告，损失惨重。弹药即将耗尽，无法继续推进，完毕。”“收到，等待进一步命令。”\n\n上尉闭上了眼睛。哈巴罗夫斯克战役已经失利。但这还不是结束，我们输掉了战斗，但还没输掉整个战争，真正的较量还在后面。现在，我们需要重新集结，准备新的进攻。谢尔盖·扎伊金上尉拿起了无线电...\n\n“全体部队，我在此下达撤退命令，立即撤退！”"
 MAR_Japan.15.a:0 "我们定会归来"
