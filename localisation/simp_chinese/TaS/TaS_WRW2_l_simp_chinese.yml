 TaS_WRW2_kenes_over:0 "§M突厥斯坦政权§!§V已覆灭§!"
 MAR_Turkestan.1.t:0 "中亚危机"
 MAR_Turkestan.1.d:0 "致中亚地区委员会主席 吉尔·弗拉基米罗维奇同志\n\n\n绝密\n\n据我们得到的情报，所谓旨在决定中亚国家未来发展方向的突厥人大会的结果，是亲德派取得了最终的胜利。\n\n这意味着，新成立的突厥军团——一个主张民族主义的国家，与我们在外交上已无任何回旋余地。而采取军事手段来施加影响同样也非上策：一旦我们选择直接入侵，新的国家很有可能会寻求大日耳曼国的保护，进而加入团结协定，这将意味着我们同时面临着在中亚地区的武装冲突以及与德国的提前对抗。\n\n因此，为了避免与团结协定的紧张局势进一步升级，我建议在德国的影响力消退之前，放弃任何入侵前中亚共和国领土的企图，并同时建立一条单独的防线，以保护我国南部边境不受突厥民族主义者的渗透。\n\n中亚军区司令 陆军上将 鲁茨科伊·亚历山德罗维奇"
 MAR_Turkestan.1.a:0 "我们暂时将中亚问题搁置一旁。"
 MAR_Turkestan.2.t:0 "中亚的军事行动"
 MAR_Turkestan.2.d:0 "致中亚地区委员会主席 吉尔·弗拉基米罗维奇同志\n\n\n绝密\n\n由于日本在该地区的活跃表现，所谓的“突厥人大会”非但没有将中亚各国团结起来，反而彻底摧毁了当地居民原本就所剩无几的国家意识形态的残余。现如今，在曾经的土库曼斯坦和乌兹别克斯坦的土地上，已然沦为了彻底的权力真空地带。与此同时，东部地区则名义上仍处于一个狂热而又落后的政教合一政权的控制之下。唯一的真正意义上的权力飞地位于该地区的南部，目前被“突厥斯坦军团”所占领。\n\n日本的目标在于阻止德国和美国的影响力进一步扩张，但最终的结果却使得中亚地区成为了任何人都可以予取予求的“自由扩张区”。只需投入一支有限的军事力量，我们就能够在短时间内控制整个地区，当然，要想重建当地的国家机器并将其融入俄罗斯联盟，仍需假以时日。因此，并考虑到如果我们不将中亚地区纳入控制之下，阿富汗和伊朗便会趁虚而入这一现实，我建议在条件允许的情况下立即展开军事行动，以自治区的形式将该地区并入我国。\n\n关于在前中亚加盟共和国领土上成功开展行动所需要的物资和技术支持，我将在另一份报告中另行说明。\n\n中亚军区司令 陆军上将 鲁茨科伊·亚历山德罗维奇"
 MAR_Turkestan.2.a:0 "重返大博弈"
 MAR_Turkestan.3.t:0 "伸向中亚的橄榄枝"
 MAR_Turkestan.3.d:0 "致中亚地区委员会主席 弗拉基米尔·弗拉基米罗维奇·吉尔\n\n\n绝密\n\n鉴于目前所谓的“突厥人大会”中务实派占据了上风，他们已经稳定住了地区局势，并且愿意与我方进行建设性外交对话，我谨在此提出一项旨在以扩大的自治权为条件，将新成立的土库曼共和国和平统一的方案。目前，中亚地区被我们、阿富汗和伊朗所包围，突厥斯坦的领导人深知该地区随时都有爆发战争的风险，而他们在战争中又孤立无援。在经济上，由于无法在不经过不友好的阿富汗或伊朗的情况下进行贸易，他们实际上也处于一种被封锁的状态。基于上述原因，他们的领导层理应会接受与俄罗斯进行军事和经济合作的提议，即便这意味着突厥斯坦将成为我们的附属国。\n\n与此同时，我还想强调一点，一旦谈判破裂，承认这一新共和国的主权或许对我们更为有利。就目前而言，他们尚不足以对我们构成威胁，但如果我们悍然入侵，鉴于他们与美利坚合众国之间良好的关系，我们可能会因此遭受严重的外交损失。\n\n外交司中亚地区司司长 米哈伊洛夫·谢尔盖耶维奇"
 MAR_Turkestan.3.a:0 "批示：将此备忘录的副本发送给外交部长及沙皇。 弗拉基米尔·吉尔"
 MAR_Turkestan.4.t:0 "中亚和平计划的成功"
 MAR_Turkestan.4.d:0 "“请允许我向您表示衷心的祝贺，米哈伊洛夫同志，您的计划大获成功！”吉尔对坐在他办公室里的年轻外交官说道。\n\n“您过奖了，弗拉基米尔·弗拉基米罗维奇，这并非我个人的功劳。真正应该感谢的是那些出色地组织并成功说服土库曼共和国领导人们加入我们的团队成员，他们才是幕后的功臣。至于他们具体是哪些人——外交部长...还有...”\n\n米哈伊洛夫将目光投向了挂在他面前的沙皇肖像上。\n\n“但是，毕竟这份计划的提出者是您。也正是多亏了您，我们不仅避免了与美国的关系进一步恶化，也同时将我们的国土面积极大地向外扩展了。就我个人而言，我可以向您保证，您一定会得到一枚勋章的。”\n\n米哈伊洛夫立正站好，说道：\n\n“为祖国效力，吉尔同志！”\n\n“您可以走了，谢尔盖·格里戈里耶维奇。祝您在今后的外交战线上再创辉煌！”"
 MAR_Turkestan.4.a:0 "俄罗斯外交的第一次重大胜利。"
 MAR_Turkestan.5.t:0 "断裂的枝条"
 MAR_Turkestan.5.d:0 "米哈伊洛夫焦躁不安地坐在自己的办公室里，等待着从中亚方面传来的任何最新消息。四周一片寂静，这令人窒息的气氛压得他喘不过气来。此时此刻，房间中唯一的声音，便是那座挂钟单调乏味的滴答声。\n\n终于，敲门声打破了这令人窒息的寂静。“外交部土耳其事务处主任，叶戈尔·阿尔捷米耶夫。”门外传来一个声音。\n\n“请进，叶戈尔。”\n\n外交官拖着脚步，鞋底轻擦着地板，走到米哈伊洛夫的桌前，将一份文件夹放在桌上。“失败了。请允许我先行告退。”这是阿尔捷米耶夫离开前唯一说的话。\n\n米哈伊洛夫明白这句话的含义，缓缓打开文件夹，开始阅读文件内容：“安卡拉在电话中严厉谴责对突厥斯坦主权事务的干涉”……“谈判小组一名成员在撒马尔罕遭遇袭击”……“吉尔吉斯边境段的边防军之间枪战日趋频繁”。他意识到，叶戈尔的一句话已精准概括了行动的现状。米哈伊洛夫承认了自己的失败，伸手拿起电话，拨通了一个早已熟记的号码。\n\n“弗拉基米尔·弗拉基米罗维奇·吉尔，您好。我是谢尔盖·格里戈里耶维奇·米哈伊洛夫，关于中亚局势……关于中亚地区的局势……立即向总参谋部和驻哈萨克斯坦的部队集群司令部发送紧急请求。”"
 MAR_Turkestan.5.a:0 "有时，冰冷的左轮手枪比苍白无力的言语更有说服力。"
 MAR_AFG.3.t: "阿富汗屈服"
 MAR_AFG.3.d: "经过数轮艰苦的谈判，我国与阿富汗的外交官们最终就中亚地区的领土地位问题签署了一项协议。\n\n根据该协议，阿富汗承诺放弃其在20世纪50年代所侵占的所有领土。此外，作为对俄罗斯的额外让步，整个巴达赫尚地区——塔吉克语族群世代居住的土地——也将移交给俄罗斯。这一外交上的巨大胜利将向全世界宣告，俄罗斯在国际舞台上拥有着坚定不移的立场，并且有能力通过谈判来实现自己的战略目标。"
 MAR_AFG.3.a: "我来，我见，我谈妥了"
 MAR_AFG.2.t: "阿富汗提议按照我方条件停火"
 MAR_AFG.2.d: "经过数轮艰苦的谈判，我国与阿富汗的外交官们最终就乌兹别克斯坦和塔吉克斯坦的领土地位问题签署了一项协议。\n\n根据该协议，阿富汗方面承诺将我国声索的戈尔诺-巴达赫尚自治州移交给俄方。作为交换，俄罗斯承诺放弃对阿富汗王国的任何进一步领土要求。尽管这些让步看起来可能微不足道，但以外交手段，而非诉诸武力，收复一部分前苏联领土，无疑有助于提升俄罗斯在国际舞台上的声望与影响力。"
 MAR_AFG.2.a: "聊胜于无啊。"
 MAR_AFG.2.b: "绝不妥协，我们将战斗到底。"
 MAR_AFG.1.t: "阿富汗提议按照其条件停火"
 MAR_AFG.1.d: "经过数轮的谈判，我国与阿富汗的外交官们最终就乌兹别克斯坦和塔吉克斯坦的领土地位问题签署了一份协议。\n\n根据该协议，俄罗斯方面承诺放弃对当前属于阿富汗王国领土的任何主张，维持现状。以和平方式解决这一重要争端，不仅可以节省大量的军事资源，更能够彰显俄罗斯作为一个负责任大国的形象，提升我国的外交地位。"
 MAR_AFG.1.a: "与“帝国坟场”开战绝非明智之举。"
 MAR_AFG.1.b: "我们决不能容忍这样的耻辱发生！"
 MAR_AFG.11.t:0 "阿富汗上空的阴云"
 MAR_AFG.11.d:0 "阿列克谢·柯西金在自己的办公室内踱来踱去，思索着应对阿富汗局势的最佳方案。弗拉基米尔·吉尔静静地站在他的对面，目光始终追随着柯西金的身影。\n\n“请再向我简述一下，阿富汗冲突中都有哪些势力参与其中？”沙皇终于开口问道。\n\n“正如我之前向您汇报过的，冲突主要由两股势力构成：穆罕默德·达乌德·汗的政府军和伊斯兰促进会。前者更加倾向于民族主义，并且他们也毫不掩饰，在绝大多数情况下不愿与我国合作。而后者，尽管他们声称支持‘民主’，并准备与外部世界展开合作，但他们本质上是反对任何左翼思想的，而且考虑到我们国家的特殊性……恐怕在接受我们的援助后，他们很快就会把曾经的‘感激之情’抛诸脑后。”\n\n“两害相权，难分高下……”阿列克谢二世低声自语，脚步却未曾停下，“我们若想将影响力扩展至中亚，就不能对阿富汗的局势坐视不理。然而，支持任何一方似乎都并非明智之举。如此一来，我们该如何抉择？”\n\n吉尔沉默片刻，终于决定提出自己的看法：“我有一个不同的建议。与其纠结于支持哪一方，我们何不直接介入这场冲突？如此一来，我们便能扶持一个对我们忠诚的政府。”\n\n听到吉尔的提议，阿列克谢停下了脚步，陷入短暂的沉思。他在心中反复权衡利弊，目光逐渐变得坚定。最终，他缓步走回办公桌前，语气决然地说道：\n\n“好，就这么办。俄罗斯军队将进入阿富汗境内，以‘解决’这场愈演愈烈的冲突。”"
 MAR_AFG.11.a:0 "两害相权，我们只能选择主动出击。"
 berez_world_news.5.t:0 "[Get_newspaper_header]俄罗斯解放中欧！"
 berez_world_news.5.d:0 "刚刚传来第一手消息，所有纳粹分子已向俄罗斯人民沙皇国军队无条件投降。无条件投降书已在昨夜签署，全文很快会公布，但我们已经知道，始于三十余载前的纳粹暴政，如今已彻底画上句号。\n\n德国向俄罗斯最终投降，明确表明世界政治格局已显著向自由国家组织一方倾斜。不过俄罗斯人民沙皇国接下来会采取何种行动还有待观察，这一情况如何影响未来冷战走向也仍是未知数。\n"
 berez_world_news.5.a:0 "我们的征途结束了！"
 berez_world_news.5.b:0 "等待着德国的是什么?"
 MAR_2WRW_world_news.1.t:0 "[Get_newspaper_header]俄罗斯入侵中亚"
 MAR_2WRW_world_news.1.d:0 "据悉，俄罗斯人民帝国的军队已于今日越过了与中亚诸国的边界。从里海到天山山脉，战争已经全面爆发。\n\n中亚各地的军阀们一溃千里。在一些地区，俄罗斯军队甚至已经从边境推进了近二十公里。\n\n尽管阿富汗和日本谴责俄方的行为是“对自由人民的野蛮袭击”并要求其立即撤军，但美德两国对此并未发表任何意见。俄国方面则称这一行动旨在“夺回俄罗斯的固有领土”。"
 MAR_2WRW_world_news.1.a:0 "我们一定能收复失地！"
 MAR_2WRW_world_news.1.b:0 "俄罗斯战争机器正开足马力。"
 MAR_2WRW_world_news.2.t:0 "[Get_newspaper_header]俄罗斯与阿富汗达成休战协议"
 MAR_2WRW_world_news.2.d:0 "阿富汗代表与俄罗斯代表在撒马尔罕举行了会晤，前者所在的国家因对吉尔吉斯斯坦和塔吉克斯坦的安全保障承诺而卷入了中亚战争。\n\n俄罗斯方面以撤出在阿富汗的所有军队为条件，换取了小部分的领土让步以及边境地区的非军事化。尽管存在一些疑问，但协议的主要内容令双方都感到满意，从而为俄罗斯的中亚远征画上了句号。\n\n在不久的将来，俄罗斯将在新近征服的领土上建立自己的行政机构，而阿富汗将从先前属于俄罗斯的帕米尔地区撤军。"
 MAR_2WRW_world_news.2.a:0 "未被征服的帝国坟场"
 MAR_2WRW_world_news.3.t:0 "[Get_newspaper_header]俄罗斯军队进入喀布尔"
 MAR_2WRW_world_news.3.d:0 "来自喀布尔的新闻电光火石般传来：俄国摩托化步兵师已突入阿富汗首都喀布尔！战斗在市中心以及国王穆罕默德·查希尔·沙阿的王宫附近爆发。查希尔国王本人及其亲信已逃往坎大哈。\n\n阿富汗的陷落近在咫尺。俄国已提出了一系列和平条件，包括割让阿富汗境内以乌兹别克人和塔吉克人为主的地区并入土库曼斯坦，巴基斯坦的建立，以及阿富汗加入俄国的经济体系。"
 MAR_2WRW_world_news.3.a:0 "帝国坟场被征服了？"
 MAR_2WRW_world_news.4.t:0 "[Get_newspaper_header]远东大起义"
 MAR_2WRW_world_news.4.d:0 "在二战终结之际，日本所占领的苏联领土被视为抵抗势力的薄弱环节，然而时至今日，该地区的抵抗行动已迈向新的高峰。关于哈巴罗夫斯克可能爆发大规模起义的传闻已流传多时，但其真正的灾难性影响直到日本在满洲和滨海边疆区（包括被其占领的符拉迪沃斯托克）的主要城市之外全面实施戒严时才得以显现。历经劫难的俄罗斯，在重新站稳脚跟之后，早在20世纪60年代就将布拉戈维申斯克及周边受满洲控制的领土交到了叛乱分子手中。"
 MAR_2WRW_world_news.4.a:0 "亚洲的和平似乎已经终结。"
 MAR_2WRW_world_news.5.t:0 "[Get_newspaper_header]满洲陷入混乱"
 MAR_2WRW_world_news.5.d:0 "满洲武力执法未能有效控制在哈巴罗夫斯克的俄罗斯反叛分子，不仅没有结束该地区的对峙局面，反而导致了局势进一步恶化。根据最可靠的说法，在大城市权力真空的情况下，数十年来一直在准备报复日本走狗的武装力量组建了一个影子政府，成功保卫了新京不受有限日属军援会部队的进攻。尽管取得了耗损惨重的胜利，但军队无法在叛乱蔓延到乡村之前击败反叛分子。\n\n满洲军方维持了对东南部的控制并完成了重新部署，而哈尔滨和北部地区对民主运动表现出忠诚。另一股被称为满洲全面解放阵线的叛乱组织则占领了沈阳及其以南地区。"
 MAR_2WRW_world_news.5.a:0 "日本的霸权并非如它所愿般稳定。"
 MAR_2WRW_world_news.6.t:0 "[Get_newspaper_header]第二次西俄战争开始了"
 MAR_2WRW_world_news.6.d:0 "今晨，东欧的冲突已达白热化阶段。俄罗斯部队沿着专员辖区辖区的整个东部战线，发起了声势浩大的全面进攻。此前，双方均已进行过大规模的军事演习，且双方高层领导人也纷纷发表了重要声明。\n\n俄罗斯现任沙皇谢尔盖·别洛泽尔斯基发布了一份震撼人心的战争宣言：“我们的军队将不懈征战，直至哥萨克的战马畅饮施普雷河的甘泉。”此言一出，立刻产生了震撼性的影响，激起了一连串激烈的讨论和反响。\n\n与此同时，大日耳曼国元首则将当前紧张局势归咎于美国的暗中煽动，他坚决表示德国将誓死捍卫这些领土。他还进一步补充说，一旦形势所迫，德国不排除动用核武器的可能性。"
 MAR_2WRW_world_news.6.a:0 "我们要做的就是静观其变。"
 MAR_2WRW_world_news.6.b:0 "俄军将像三十年前一样被打败。"
 MAR_2WRW_world_news.6.c:0 "向西挺进！"
 MAR_2WRW_world_news.7.t:0 "[Get_newspaper_header]俄军占领莫斯科"
 MAR_2WRW_world_news.7.d:0 "经过长时间的激烈争夺，今天上午，俄罗斯帝国军队终于取得了对莫斯科城的控制权。据俄罗斯帝国方面代表提供的消息，虽然德军已经撤离，但仍有零星的小规模冲突在继续，同时工兵部队正在紧张有序地对克里姆林宫区域进行排雷作业。此外，据可靠消息透露，谢苗·希特勒将军已被委以重任，负责领导城市的清理和恢复工作。\n\n莫斯科市民对于解放者的到来展现出了极大的热情和欢迎，许多人甚至踊跃报名加入志愿军，希望为国家的解放事业贡献自己的力量。然而，另一方面，也有报道称在城市的某些地区出现了破坏行为，但这些行为并未遭遇到明显的抵抗。无论如何，俄罗斯帝国的军队并未停下脚步，他们正坚定地继续向西推进。\n\n与此同时，大日耳曼国的代表已经公开宣布，他们正在策划一场反攻行动，以夺回对莫斯科城的控制权。"
 MAR_2WRW_world_news.7.a:0 "俄军似乎势不可挡。"
 MAR_2WRW_world_news.7.b:0 "战争并没有结束！"
 MAR_2WRW_world_news.7.c:0 "白石之城已在我们手中"
 MAR_2WRW_world_news.8.t:0 "[Get_newspaper_header]柏林被俄罗斯军队占领"
 MAR_2WRW_world_news.8.d:0 "刚刚传来消息，俄罗斯人民沙皇国的军队已攻占大日耳曼国的首都——柏林。这无疑是第二次卫国战争和本十年来最具历史意义的重大事件。\n\n德国国防军未能抵挡住俄罗斯军队的强大攻势，被迫撤出柏林。因此，这座城市几乎未经严重抵抗就落入我军之手。沙皇谢尔盖·别洛泽尔斯基在得知柏林被占领的消息后表示，我们正目睹德国的崩塌。\n\n大日耳曼国的领导层对于柏林失陷一事语无伦次，仅含糊其辞地表示他们一定会重返这座城市。\n\n这是否意味着纳粹在二战胜利后在欧洲构建的世界秩序即将终结？"
 MAR_2WRW_world_news.8.a:0 "谁控制了柏林，谁就控制了欧洲。"
 MAR_2WRW_world_news.8.b:0 "此乃终局……"
 MAR_2WRW_world_news.8.c:0 "谁控制了柏林，谁就控制了欧洲。"
 MAR_2WRW_world_news.9.t:0 "[Get_newspaper_header]第二次西俄战争结束"
 MAR_2WRW_world_news.9.d:0 "今日，德国与俄罗斯代表会晤，宣布了和平条约的条款。根据协议，大日耳曼国将把国家所有东欧专员辖区的领土置于俄罗斯控制之下，并承诺在短期内支付战争赔款，同时保留对其余专员辖区的统治权。\n\n条约中最引人注目的条款包括：签订为期20年的和平协议；俄罗斯承诺不会违背移民后裔的意愿将其驱逐回德国，并允许他们在保留全部财产的前提下成为俄罗斯公民；德国企业将获得特殊权利，其财产不可侵犯。作为回报，德国允许东部专员辖区的俄罗斯居民迁往俄罗斯，并不会对此设置任何障碍。\n\n和平终于降临欧洲，但大部分基础设施已遭摧毁，疾病和饥荒肆虐，地位也受到严峻考验。尽管德国仍保留对部分领土的控制权，但其实力已大为削弱。"
 MAR_2WRW_world_news.9.a:0 "至少是结束了。"
 MAR_2WRW_world_news.9.b:0 "帝国得以挽救"
 MAR_2WRW_world_news.9.c:0 "我们的征途结束了。"
 MAR_2WRW_world_news.10.t:0 "[Get_newspaper_header]俄罗斯在第二次西俄战争中胜利"
 MAR_2WRW_world_news.10.d:0 "今日，德俄两国代表会晤，宣布和平条约条款。根据协议，大日耳曼国将东欧所有专员辖区移交俄罗斯控制，并长期向人民帝国支付巨额赔款。\n\n条约其他重要条款包括：两国缔结为期20年的和平协定；德国须接纳所有被驱逐的德国人，并将企业资产控制权移交俄罗斯帝国代表。\n\n欧洲重获和平，昔日遥不可及的裂痕如今彻底暴露无遗。第三帝国的霸权轰然崩塌。尽管漫长的重建时期仍在前方，瘟疫与饥荒依旧肆虐东欧，但德国在欧洲的统治已成明日黄花，这是不争的事实。"
 MAR_2WRW_world_news.10.a:0 "新霸权之崛起"
 MAR_2WRW_world_news.10.b:0 "我们别无选择"
 MAR_2WRW_world_news.10.c:0 "我们胜利了！"
 MAR_2WRW_world_news.11.t:0 "[Get_newspaper_header]德国崩溃"
 MAR_2WRW_world_news.11.d:0 "今天是命运的转折点。元首阿道夫·希特勒曾誓言能屹立千年的大日耳曼国，如今已轰然倒塌。在第二次西俄罗斯战争惨败后，起义浪潮席卷全国，中央政府终告覆灭。\n\n纳粹党徒大多被俘或当场处决。然而，元首的命运仍是个谜。据可靠消息，他曾企图乘坐政府专机逃离德国领土。全球情报机构已展开追查，德国国内也已启动调查。\n\n起义者正与俄罗斯帝国代表展开谈判，但可以肯定的是，今日的世界已经永远改变了。"
 MAR_2WRW_world_news.11.a:0 "战败者有祸了"
 MAR_2WRW_world_news.11.b:0 "败者哀歌"
 MAR_2WRW_world_news.12.t:0 "[Get_newspaper_header]俄罗斯在第二次西俄战争中失败"
 MAR_2WRW_world_news.12.d:0 "今日，俄德两国代表在阿尔汉格尔斯克会晤，该城市如今已成为两国新边界。俄罗斯人民王国投降后，德国实施了阿道夫·希特勒的计划，沿阿尔汉格尔斯克-阿斯特拉罕线划定新疆界。此外，俄罗斯失去了科拉半岛和卡累利阿，这些地区被割让给芬兰。日本政府也重新吞并了符拉迪沃斯托克和滨海边疆区，这些地区此前在亲俄势力起义中失而复得。俄罗斯在中东和非洲的众多盟友已纷纷与其断绝外交关系，撇清关系。美国专家预测，局势将继续恶化，俄罗斯在不久的将来还将面临更多挑战与阻碍。"
 MAR_2WRW_world_news.12.a:0 "危机终结..."
 MAR_2WRW_world_news.12.b:0 "又一次。"
 MAR_2WRW_world_news.13.t:0 "[Get_newspaper_header]第三次大动乱"
 MAR_2WRW_world_news.13.d:0 "俄罗斯当前的局势可谓是新的大动乱时代。仅仅数年前，国家还在俄罗斯人民王国的旗帜下团结一致，如今这份同盟却已支离破碎。曾经由沙皇将军谢尔盖·谢尔盖耶维奇·别洛泽尔斯基领导的国家，在他逝世并在第二次西俄战争中惨败后，陷入了新的危机。逃兵将领和政治极端分子趁机在俄罗斯剩余领土上宣布建立各自的伪政权，导致国家进一步四分五裂。由总理亚历山大·卡津别克领导的合法政府如今仅能掌控首都及南部部分地区。\n\n雪上加霜的是，日本军队的入侵更是让局势雪上加霜。他们占领了图瓦地区，严重动摇了该地区的政治稳定。俄罗斯再次跌入四分五裂的深渊，国家的未来令人忧心忡忡。"
 MAR_2WRW_world_news.13.a:0 "俄罗斯再次流血。"
 MAR_2WRW_world_news.14.t:0 "[Get_newspaper_header]柏林之战"
 MAR_2WRW_world_news.14.d:0 "今日，俄罗斯人民帝国的军队攻克了大日耳曼国的首都——柏林。这一壮举不仅是本世纪的里程碑，更标志着第二次伟大卫国战争的转折点，其意义深远，足以载入史册。\n\n德意志国防军被迫从柏林撤退，以避免全军覆没的命运。沙皇阿列克谢二世已公开宣称，德国的末日即将来临。\n\n大日耳曼国的领导层对此未做出任何清晰的回应，仅含糊表示国防军必将重返柏林。\n\n柏林的陷落无疑将胜利的天平倾向俄罗斯一方。或许，我们正亲眼见证德国及其纳粹政权的崩塌。"
 MAR_2WRW_world_news.14.a:0 "德国的命运早已命中注定。"
 MAR_2WRW_world_news.14.b:0 "此乃终局……"
 MAR_2WRW_world_news.14.c:0 "纳粹帝国死之将至"
 MAR_2WRW_world_news.15.t:0 "[Get_newspaper_header]保加利亚退出战争"
 MAR_2WRW_world_news.15.d:0 "索菲亚方面做出了一个震惊世界的重大决定，宣布退出与俄罗斯的战争。旷日持久的东方战事早已令这个国家元气大伤，持续恶化的经济危机迫使保加利亚政府不得不与俄罗斯当局展开谈判。最终签署的和平条约虽然叫停了战火，但也要求保加利亚承诺在这场冲突中保持中立。\n\n协议的具体条款在很大程度上仍然不为人知，这也引发了外界的种种猜测。然而其主要目的只有一个——将保加利亚从彻底崩溃的经济危机中拯救出来。大日耳曼国政府虽然对该事件缄默不语，但其内心中的不满早已昭然若揭。这一事件给整个德国同盟蒙上了一层阴影，也标志着德国内部危机的进一步加深。"
 MAR_2WRW_world_news.15.a:0 "索菲亚试图从战争的泥潭中脱身。"
 MAR_2WRW_world_news.15.b:0 "索菲亚试图从战争的泥潭中脱身。"
 MAR_2WRW_world_news.15.c:0 "索菲亚试图从战争的泥潭中脱身。"
 MAR_2WRW_world_news.16.t:0 "[Get_newspaper_header]塞尔维亚退出战争"
 MAR_2WRW_world_news.16.d:0 "贝尔格莱德方面正式宣布与俄罗斯签署了单独的和平条约，确认塞尔维亚将不再作为德国的马前卒参与这场战争。民众日益增长的不满情绪以及军队中惨重的伤亡，迫使塞尔维亚政府不得不做出抉择：要么继续这场毁灭性的战争，要么尽一切可能保全国家。面对这一两难的境地，为了国家长远利益，塞尔维亚最终选择了后者。\n\n塞尔维亚的权贵阶层对帝国毁灭性的野心深恶痛绝，为了避免自身成为其野心的陪葬品，他们选择了媾和，以求减少塞尔维亚所承受的压力。据悉，俄罗斯代表在谈判中成功地迫使塞尔维亚做出了一定的让步。德国政府并未对这一出人意料的举动做出公开回应，但分析人士认为，塞尔维亚的背叛将使本已岌岌可危的德国在巴尔干地区的控制力进一步削弱。"
 MAR_2WRW_world_news.16.a:0 "贝尔格莱德幡然改弦更张。"
 MAR_2WRW_world_news.16.b:0 "贝尔格莱德幡然改弦更张。"
 MAR_2WRW_world_news.16.c:0 "贝尔格莱德幡然改弦更张。"
 MAR_2WRW_world_news.17.t:0 "[Get_newspaper_header]匈牙利结束军事行动"
 MAR_2WRW_world_news.17.d:0 "布达佩斯方面出人意料地宣布退出东线战事，结束其与俄罗斯之间的战争状态。持续的战争导致了匈牙利经济凋敝、军力衰竭，并造成了成千上万的匈牙利人丧生，这一切都迫使匈牙利领导层不得不重新考虑其对这场冲突的立场。在与俄罗斯方面展开谈判后，双方最终签署了和平协议，匈牙利承诺保持中立，并将所有军队撤回国内。\n\n这一举动无疑给德国同盟带来了新的考验。外部观察家们一致认为，匈牙利的退出意味着这个由德国所一手打造的军事集团正在分崩离析。尽管布达佩斯方面到目前为止还未遭受到来自德国的直接压力，但有舆论认为，这一事件进一步损害了大日耳曼国作为“欧洲霸主”的声誉。"
 MAR_2WRW_world_news.17.a:0 "如今是时候忘记所谓“大匈牙利”的迷梦了。"
 MAR_2WRW_world_news.17.b:0 "如今是时候忘记所谓“大匈牙利”的迷梦了。"
 MAR_2WRW_world_news.17.c:0 "如今是时候忘记所谓“大匈牙利”的迷梦了。"
 MAR_2WRW_world_news.18.t:0 "[Get_newspaper_header]英国退出冲突"
 MAR_2WRW_world_news.18.d:0 "英国的傀儡政府出人意料地宣布脱离德国控制，并立即退出战争。来自地下抵抗组织的持续压力以及民间日益高涨的反战情绪迫使英国的傀儡精英们选择退出这场血腥的战争，以此作为与德国傀儡政权身份切割的象征。\n\n在逮捕了岛上的大日耳曼国驻军并与俄罗斯展开谈判后，英国获得了中立的保证，并签署了确保其未来不再参与战事的协议。德国方面对英国的倒戈行为表示强烈抗议，但并未采取任何实质性的反制措施。就这样，曾经的傀儡政权翻开了新的篇章，他们要用行动证明自己也绝非任人摆布的提线木偶。"
 MAR_2WRW_world_news.18.a:0 "苍老的狮子终究还是露出了自己的獠牙。"
 MAR_2WRW_world_news.18.b:0 "苍老的狮子终究还是露出了自己的獠牙。"
 MAR_2WRW_world_news.18.c:0 "苍老的狮子终究还是露出了自己的獠牙。"
 MAR_2WRW_world_news.19.t:0 "[Get_newspaper_header]罗马尼亚签署和平协议"
 MAR_2WRW_world_news.19.d:0 "对罗马尼亚人而言，旷日持久的东线战事已经将这个国家的经济拖入无底深渊，民众对本已四分五裂的政府也愈发失望。为了尽早结束这场灾难，布加勒斯特方面主动向俄罗斯递出了橄榄枝，请求展开和谈，而这一请求也很快得到了肯定的答复。\n\n谈判前的筹备工作进行得异常迅速，在外交官们展开磋商后，一份单独的和平条约就此诞生。根据俄罗斯方面所提出的条件，罗马尼亚即刻退出这场战争。罗马尼亚的军事统帅部下令全面停火，并将所有部队撤出前线，承诺不再以任何形式参与到冲突中来。就这样，德国的一个重要盟友在其宗主国毫不知情的情况下退出了战争，这也引发了外界对于“团结协定”内部瓦解的猜疑。"
 MAR_2WRW_world_news.19.a:0 "罗马尼亚彻底失去了支撑自己战斗的支柱。"
 MAR_2WRW_world_news.19.b:0 "罗马尼亚彻底失去了支撑自己战斗的支柱。"
 MAR_2WRW_world_news.19.c:0 "罗马尼亚彻底失去了支撑自己战斗的支柱。"
 MAR_2WRW_world_news.20.t:0 "[Get_newspaper_header]俄罗斯屈从于核讹诈"
 MAR_2WRW_world_news.20.d:0 "一条令人震惊的消息如同闪电般划破东线的沉寂：在帝国的一众殖民地上势如破竹的俄罗斯军队，被迫与德国人坐到了谈判桌前。而迫使他们做出这一让步的，是德国人发出的最后通牒——倘若俄方继续对德军统帅部提出的停火要求置之不理，他们将毫不犹豫地使用核武器。\n\n俄罗斯军队在乌克兰和东方这两个专员辖区的土地上取得了非凡的战果，这意味着他们已无限逼近其宿敌的边界，而对方显然不会再继续容忍任何进一步的失败。前线的军事行动已被紧急叫停，一场旨在解决双方争端的和平会议就此拉开帷幕。唇枪舌剑在政治舞台上轮番上演，双方都试图捍卫自身的利益。最终，天平还是倒向了俄罗斯一方。"
 MAR_2WRW_world_news.20.a:0 "但核武器的阴云终究压倒了一切的胜利果实。"
 MAR_2WRW_world_news.20.b:0 "但核武器的阴云终究压倒了一切的胜利果实。"
 MAR_2WRW_world_news.20.c:0 "但核武器的阴云终究压倒了一切的胜利果实。"
 MAR_2WRW_world_news.21.t:0 "[Get_newspaper_header]法国签署单独媾和条约"
 MAR_2WRW_world_news.21.d:0 "随着第二次西俄罗斯战争的持续进行，“欧洲堡垒”也日益走向崩溃。今天，法兰西国政府公布了一项单独的和平条约，该条约甚至只字未提德国。根据在远东城市赤塔签署的这项条约，法兰西国承诺停止针对俄罗斯的一切军事行动，同时终止对德国以及任何与俄罗斯交战的国家提供军事技术、经济和外交上的支持。作为交换，俄罗斯承认法兰西国为法国唯一合法政府，并保证在未来25年内不会对其发动任何形式的侵略，同时对其保持“对话的开放性”。\n\n尽管德国和团结协定的其他成员国对此提出了严厉的批评，但欧洲的那些中立国、以及日本和美国都对法国“明智的中立立场”表示了支持。"
 MAR_2WRW_world_news.21.a:0 "欧洲的宝座摇摇欲坠。"
