 MAR_AFG.9.t:0 "阿富汗的对抗"
 MAR_AFG.9.d:0 "“在阿富汗，喀布尔。穆罕默德·达乌德·汗所组织的那场政变发生后，阿富汗社会在受过良好教育的政府官员与‘伊斯兰促进会’之间产生了严重的分裂。\n\n政变发生仅仅几天后，全国各地就爆发了抗议活动，人们纷纷走上街头，反对新政府，因为后者正试图将权力集中在自己手中，建立一个独裁政权。而支持新政府的集会也针锋相对地爆发了。最终，当局试图平息抗议的种种举动导致了许多城市都爆发了起义，这也标志着一场内战的开端。以下是对冲突双方的简要介绍：\n\n穆罕默德·达乌德·汗。普什图民族主义者，秉持阿富汗独立自主的外交政策，并公开宣称对俄罗斯持敌视态度。\n\n伊斯兰促进会。由塔吉克族阿富汗人所创立的政党。秉持伊斯兰民主主义的温和保守派，对外交政策，包括与俄罗斯之间的关系，持更加开放的态度。”\n\n弗拉基米尔·吉尔正在宣读着这份刚刚收到的报告。他仔细地观察着皇帝陛下的反应，在完成了报告后，他为了遵守礼节，象征性地问道：\n\n“那么……我们是否要介入这场冲突？我们又该支持哪一方呢？”他提出的这个问题只是出于形式，因为他非常清楚沙皇将会如何作答。\n\n谢尔盖·别洛泽尔斯基调整了一下自己在椅子上的坐姿，清了清嗓子，宣布道："
 MAR_AFG.9.a:0 "向伊斯兰促进会提供援助。"
 MAR_AFG.10.t:0 "阿富汗内战"
 MAR_AFG.10.d:0 "新消息再次传来，这次是从阿富汗传来的。在那里，一场争夺权力的内战已经全面爆发。沙皇在他富丽堂皇的办公室内，拆开了一个新文件，并开始浏览其中的内容，这些情报很有可能会引起他的兴趣。\n\n在阿富汗内战中，主要有三股势力在殊死搏斗，而且他们之间几乎没有任何共同之处：\n\n第一个为权力而战的候选人是努尔·穆罕默德·塔拉基，他已经成功地发动了一场政变，并在自己支持者的帮助下夺取了政权。然而，并非所有人都认同他的那些激进的社会主义观点，最终，全国各地都爆发了反对他的抗议活动。\n\n第二个候选人是保守派伊斯兰民主党——伊斯兰促进会。这些在民众中颇具声望的政治家们成功地动员了大量民众，向社会主义政府发起了冲击。\n\n最后一股势力，则是近期异军突起的古勒卜丁伊斯兰党（阿富汗伊斯兰党），它将那些最激进的伊斯兰原教旨主义者们都团结在了自己的旗帜下。\n\n沙皇的脸上露出了一丝满意的笑容。在仔细研究了这三方势力后，他很快就选定了一个“宠儿”，俄罗斯将在未来的冲突中对其提供支持。他大笔一挥，在命令上签下了自己的名字，盖上了印章，这标志着俄罗斯帝国将正式介入阿富汗的局势。"
 MAR_AFG.10.a:0 "努尔·穆罕默德·塔拉基——我们的选择"
 MAR_AFG.10.b:0 "我们将对伊斯兰促进会提供支持"
