 MAR_territorial_fate.13.t:0 "新俄罗斯的新首都"
 MAR_territorial_fate.13.d:0 "终于！历经这许多苦难的岁月，俄罗斯终获解放！既然德意志人已从圣彼得堡和莫斯科败退，我们便可将俄罗斯国家的首都迁回这两座宏伟的城市之一。将首都迁回圣彼得堡，将凸显我们对彼得大帝及俄罗斯帝国的历史传承。另一方面，将首都定回莫斯科，则将表明我们是苏维埃国家的继承者。此外，亦有许多人坚信，在整个第二次大动乱的风雨飘摇中，正是维亚特卡才真正有资格被称为青年俄罗斯联盟的首都。然而，最终的选择权，一如既往地，掌握在陛下手中。"
 MAR_territorial_fate.13.a:0 "圣彼得堡，沙皇之城！"
 MAR_territorial_fate.13.b:0 "莫斯科，苏维埃之城！"
 MAR_territorial_fate.13.c:0 "维亚特卡，青年俄罗斯党人之城！"
