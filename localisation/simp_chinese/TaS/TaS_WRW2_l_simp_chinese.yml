 TaS_WRW2_prepare_for_final_battle:0 "准备最后一战"
 TaS_WRW2_prepare_for_final_battle_desc:0 "我们神圣的西部国土已沦陷于敌手太久。但我们不可轻举妄动，任何差池都将使我们功亏一篑。是时候为俄罗斯的命运决一死战做好准备了。\n\n我们目前的备战程度为 [?RUS2WRWWarPreparedness]/100。"
 TaS_WRW2_launch_attack_on_germany:0 "夺回属于我们的东西"
 start_the_war_tt:0 "§e我们将对大日耳曼国及其傀儡国宣战§!"
 no_naval_ger_tt:0 "由于§a“破冰者行动”§!的成功，我们将§G夺取§!新地岛，§e德国§!将§G无法§!对§Y我们的海岸§!发动两栖登陆作战。"
 SWRW_readiness_tt:0 "我国£readiness_war §G备战§!值高于75%"
 SWRW_issues_done_tt:0 "我们解决了所有关于§Y中亚§!的§K问题§!"
 TaS_WRW2_zapad_excersices:0 "“西方-71”军事演习"
 TaS_WRW2_zapad_excersices_desc:0 "“西方-71”军事演习旨在训练一支未来将在莫斯科专员辖区中部地区作战的部队集群。\n\n鉴于该地区多为沼泽和森林，因此本次演习应在我国首都郊外举行，以模拟类似的地形地貌。"
 TaS_WRW2_sever_excersices:0 "“北方-72”军事演习"
 TaS_WRW2_sever_excersices_desc:0 "“北方-72”军事演习旨在训练一支未来将在莫斯科专员辖区北部地区，以及在必要时，前往挪威作战的部队集群。\n\n考虑到该地区独特的气候条件，军方决定在纳尔扬马尔和萨列哈尔德地区进行此次演习。"
 TaS_WRW2_vostok_excersices:0 "“东方-73”军事演习"
 TaS_WRW2_vostok_excersices_desc:0 "在完成了前两次的演习之后，部队需要进行所谓的“总预演”前的最后一次准备工作了。\n\n为此，国防部决定在贝加尔湖附近地区举行一次中间阶段性质的军事演习。"
 TaS_WRW2_volga_excersices:0 "“伏尔加-74”军事演习"
 TaS_WRW2_volga_excersices_desc:0 "我们向西挺进、收复失地的总预演已箭在弦上。\n\n部队必须在演习中展现出最为顽强的战斗作风，因为在此次演习过后，我们已经没有任何退路。"
 Tas_WRW2_excersices_tt:0 " §J我们所进行的演习§!有力地彰显了§R我们强大的实力§!。"
 TaS_WRW2_establish_northborders_fortifications:0 "北方防线"
 TaS_WRW2_establish_northborders_fortifications_desc:0 "北方防线是从阿尔汉格尔斯克港延伸到下诺夫哥罗德的一条防御工事线。\n\n由于北方方向的港口是我们获取重要战略物资的咽喉要道，因此我们必须格外重视这一防御阵线的建设。"
 TaS_WRW2_establish_southborders_fortifications:0 "南方防线"
 TaS_WRW2_establish_southborders_fortifications_desc:0 "南方防线是北方防线的延伸，它从下诺夫哥罗德一直延伸到里海。\n\n这条防线将为我军的主攻方向提供坚实的侧翼掩护。如有必要，这条防线还必须能够抵挡住德军的凶猛攻势。"
 TaS_WRW2_establish_centralasian_fortifications:0 "中亚防线"
 TaS_WRW2_establish_centralasian_fortifications_desc:0 "由于我们未能及时介入突厥人大会，得到了德国方面支持的突厥斯坦军团最终控制了这里。\n\n由于德国与这个其豢养的傀儡政权并不接壤，因此，我们将构筑一条独立的防线，防止敌对势力的武装人员渗透到我们的后方。"
 TaS_WRW2_establish_fallback_fortifications:0 "后备防线"
 TaS_WRW2_establish_fallback_fortifications_desc:0 "尽管我们已经拥有了南方防线，但未雨绸缪，建立一条额外的防线仍然是很有必要的，以防前线阵地被敌人突破。\n\n这条防线将依托乌拉尔河与伏尔加河而建。但愿上帝保佑，我们永远不会用到这条防线。"
 Tas_WRW2_fortifications_tt:0 "§J已建成的防御工事§!将会在§R敌人发动进攻§!时为我军提供有力的支援。\n"
 TaS_WRW2_mobilize_airmobile_units:0 "边境部署飞机"
 TaS_WRW2_mobilize_airmobile_units_desc:0 "自二十世纪初以来，空军在战争中的作用就变得越来越举足轻重。时至今日，制空权的掌控与否更是直接关系到战争的胜败。\n\n如果我们想让德国空军那帮乌合之众见识一下俄罗斯飞行员的高超技艺，我们就必须建立起我们自己的空中力量。"
 Tas_WRW2_airmobile_units_tt:0 "§J已建成的机场§!将会为我军§a夺取制空权§!提供有力的支撑。\n"
 TaS_WRW2_millitary_production_contracts:0 "武器生产合同"
 TaS_WRW2_millitary_production_contracts_desc:0 "我们目前的军事实力显然不足以与德国抗衡。与那些跟我们半斤八两的前俄罗斯军阀残余势力作战是一回事，但与一个拥有核武器的超级大国正面对抗则完全是另一回事了。\n\n为此，我国政府已经拟定了一系列武器采购合同，我们将与联合国安理会以及共荣圈的国家进行军火贸易。\n\n毕竟，要想战胜一个超级大国，往往需要借助其他超级大国的力量，不是吗？"
 Tas_WRW2_production_contracts_tt:0 "§J军备采购合同§!可以§G降低§!武器生产的成本。\n"
 SWRW_increased_arms_prodution:0 "军备采购合同"
 SWRW_increased_arms_prodution_desc:0 "自第一次西俄战争以来，我们将要面对一场规模最为宏大的战争。为了俄罗斯的存亡，我们必须最大限度地挖掘军工产业的潜力——而这一产业，早在我们的政权仅仅偏安于别列兹尼基一隅时，就已经开始着手建设了。要么让我们的工业产出更多的步枪、炮弹和坦克，在数量上压倒德国人，要么就等着像尼古拉和布哈林时期那样再一次惨败，彻底沉沦！即便我们不得不采取战时经济体制那样的非常措施，也必须竭尽全力地去争取胜利。因为另一条路，只会把我们引向万劫不复的深渊，而我们的国家和民族将被扔进历史的垃圾堆。到那时，在他们肮脏的垃圾堆中，最为醒目的一定会是那德意志鹰犬的标志，而非象征着我们光荣与梦想的双头鹰！一个多世纪以来，乌云一直笼罩在俄罗斯的武器之上，现在是时候驱散这片阴霾，让它们绽放出前所未有的耀眼光芒了！"
 TaS_WRW2_radars_constuction:0 "雷达站建设"
 TaS_WRW2_radars_constuction_desc:0 "自从俄罗斯统一战争以来，雷达就一直是我们的眼睛和耳朵。在即将到来的对德战争中，它们的重要性更是不言而喻。\n\n然而，我们所拥有的雷达数量，还远远不足以同德国抗衡。因此，建造更多的雷达站，就成了我们击败德国、赢得胜利的先决条件之一。"
 Tas_WRW2_radars_tt:0 "§J雷达§!将§G使我们能够§!洞察敌人的一举一动。\n"
 TaS_WRW2_raise_additional_reserves:0 "动员运动"
 TaS_WRW2_raise_additional_reserves_desc:0 "尽管我们的武装力量堪称当世一流劲旅，但仍然无法与那支曾经横扫欧洲的德意志国防军相提并论。\n\n然而，我们所有的动员计划都必须分成两个阶段来实施。在现阶段，我们的首要任务是征召更多的人民加入到军队中来。"
 TaS_WRW2_reserves_tt:0 "没有"
 TaS_WRW2_draft_propaganda:0 "征兵宣传"
 TaS_WRW2_draft_propaganda_desc:0 "为了更有效地招募兵员，我们将启动第二阶段的动员计划——也就是大力宣传。\n\n否则，我们将面临士兵们不愿与敌人作战的窘境。"
 TaS_WRW2_propaganda_tt:0 " "
 SWRW_draft_propaganda:0 "征兵宣传"
 SWRW_draft_propaganda_desc:0 "像圣乔治一样，俄罗斯在其整个历史中一直为了生存而进行着永恒的斗争。我们参与第二次西俄战争的事实表明，这个世界仍然无法击垮我们，只会让我们愈发坚韧。我们几乎不必多言：所有人都身处其中的、这该诅咒的现实，已经向每一个俄罗斯人证明了，挺身而战的必要性。这使我们可以用最微小的投入换来最多渴望复仇的新兵。每一个人都清楚，在这场全面战争中，偷走我们未来的德国又一次成为了我们获得幸福生活的拦路虎，那些在俄罗斯最危急的时刻选择逃避这场神圣战争的懦夫将永远被钉在耻辱柱上。向所有引领俄罗斯风暴、扫清一切障碍的俄罗斯儿女们致敬，我们将纠正过去一个半世纪以来，帝国和联盟所犯下的一切历史错误，并向所有敌人发起复仇！冲啊，战士们！"
 TaS_WRW2_develop_front_railways:0 "扩建前线铁路"
 TaS_WRW2_develop_front_railways_desc:0 "任何战争都离不开军事战略基础设施。这包括铁路枢纽以及军事工业。\n\n为了确保士兵们能够获得足够的武器弹药和装备，我们，正如其他所有部门一样，必须为这场战争做好准备。"
 TaS_WRW2_railways_tt:0 " "
 TaS_WRW2_develop_front_infrastructure:0 "建设前线基础设施"
 TaS_WRW2_develop_front_infrastructure_desc:0 "任何战争都离不开军事战略基础设施。这包括铁路枢纽以及军事工业。\n\n为了确保士兵们能够获得足够的武器弹药和装备，我们，正如其他所有部门一样，必须为这场战争做好准备。"
 TaS_WRW2_infrastructure_tt:0 "我们将建设基础设施 "
 TaS_WRW2_prepare_industrial_centers:0 "筹备工业中心"
 TaS_WRW2_prepare_industrial_centers_desc:0 ""
 TaS_WRW2_industrial_centers_tt:0 "通过§R额外的投资§!，我们将§R加强§!我们国家的§R军事工业综合体§!"
 TaS_WRW2_prepare_economics:0 "加强经济"
 TaS_WRW2_prepare_economics_desc:0 "正如第一次世界大战和第一次卫国战争向我们证明的那样，强大的经济是一个国家获得胜利的保证。\n\n尽管德国的经济看上去很虚弱，但我们决不能低估我们的敌人。因此，我们将制定一项增强我国经济实力的改革计划。"
 TaS_WRW2_economics_tt:0 "§R我们的经济§!将会§R为§!战争期间§R不断增长的开支§! §R做好准备§!"
 SWRW_free_money:0 "额外投资"
 SWRW_free_money_desc:0 "金钱，金钱，还是金钱——这是军队最重要的三大支柱。在这个紧要关头，如果我们不能尽一切努力来获取尽可能多的金钱，那上帝都会唾弃我们的无能与短视。以前的黑军如果有什么地方值得我们学习的话，那一定是他们在全面战争方面的决心。为了取得最终的胜利，我们必须在自己的融合体制中吸取过去俄罗斯大地上所有体制的优点，即使这其中颇有争议，正如当前不得不采用的这种非常时期的经济政策一样。在这个决定命运的时刻，我们别无选择，只能选择那最为有效的方法。只要我们能让德国人为所有这一切买单，那我们在这场战争中的所有开销都将一笔勾销。"
 TaS_WRW2_mobilize_economics:0 "经济动员"
 TaS_WRW2_mobilize_economics_desc:0 "为了击败德国，我国目前的经济体制显然还有很大欠缺。\n\n 为了赢得这场战争，经济必须全面转入战时轨道，一切为了战争，一切为了胜利！"
 TaS_WRW2_mobilize_tt:0 "§R我们将§!§R增加军费开支§!，从而让我们能够为军队§R提供更好的装备§!"
 TaS_WRW2_buy_equipment:0 "采购工业设备"
 TaS_WRW2_buy_equipment_desc:0 "一个国家的工业实力不仅体现在军工厂的数量上，还体现在其工业设备上——那些用于生产炮弹、子弹、坦克和其他一切军需物资的机器设备。\n\n根据已经签署的协议，美国和日本将向我们提供这些重要的工业设备。"
 TaS_WRW2_equipment_tt:0 ""
 TaS_WRW2_send_partisans:0 "“地基”行动"
 TaS_WRW2_send_partisans_desc:0 "这项行动包括向‘莫斯科专员辖区’的后方派遣破坏分子。在战争期间，这些破坏分子将在敌人后方发动起义，这将严重削弱德军的战斗力。"
 TaS_WRW2_partisans_tt:0 "§R一旦战争爆发§!， §R我们§!将能够在敌人后方策动大规模的§R起义§!，这将给§R德国人的后勤补给§! §R造成极大的困扰§!"
 SWRW_war_partisans:0 "游击队的袭扰"
 SWRW_war_partisans_desc:0 "那些在被德国人所侵占的‘专员辖区’土地上活动的游击队员们比任何人都能清楚地体会到这片饱受摧残的土地上的苦难，他们也因此比任何人都要渴望纠正这个国家过去所犯下的滔天罪行——在与德国人的战斗中屡战屡败。这些游击队随着俄罗斯的复兴而看到了希望，在复仇怒火的驱动下，他们刺杀军官，摧毁军事设施，并在俄罗斯人聚居区发动起义。如果没有柏林方面的大力支持，这些‘专员辖区’恐怕早已是烽火连天，就像不久前希特勒身死国灭的莫斯科一样。"
 TaS_WRW2_block_the_barentsevo_sea:0 "“破冰者”行动"
 TaS_WRW2_block_the_barentsevo_sea_desc:0 "这项行动计划分为两部分：首先，派遣海军陆战队登陆并占领位于新地岛上的德国海军基地。一旦战争爆发，我们的海军陆战队将立即控制该岛；其次，海军将在巴伦支海进行布雷，以阻止德国海军在该地区展开任何偷袭行动。这一行动的完成将极大地减轻我们在该地区的海上巡逻压力，因为我们可以确保，德国人的军队将无法再踏上这片海域。"
 TaS_WRW2_barentsevo_tt:0 "§R一旦战争爆发§!，§R德国§!将§R无法从海上向我方沿海地区发动登陆§!。此外，一支§Y海军陆战队§!将在新地岛登陆"
 TaS_WRW2_buy_guns:0 "采购国外武器"
 TaS_WRW2_guns_tt:0 "我们将获得§R大批§!急需的武器装备，这将使我们能够§R更有效地消灭德国人§!"
 TaS_WRW2_test_technology:0 "俄罗斯试验场"
 TaS_WRW2_test_technology_desc:0 "我们将为美国提供一个在实战环境中测试其最新武器装备的绝佳机会。作为交换，我们将获得这些先进的武器装备，以供我们自己使用"
 TaS_WRW2_tests_tt:0 "作为允许他们进行武器测试的报酬，我们将获得 §R来自国外的先进武器§! 以及§R至关重要的先进技术§!，我们还能将这些先进技术应用到§R我们自己的武器装备§!之中!"
 TaS_WRW2_buy_guns_jap:0 "采购国外武器"
 TaS_WRW2_buy_guns_desc:0 "这些年来，我们已经与‘大东亚共荣圈’的成员国建立了良好的关系。因此，向他们寻求军事援助并非难事。"
 TaS_WRW2_test_technology_jap:0 "俄罗斯试验场"
 TaS_WRW2_test_technology_jap_desc:0 "我们将为日本提供一个在实战环境中测试其最新武器装备的绝佳机会。作为交换，我们将获得这些先进的武器装备，以供我们自己使用"
 TaS_WRW2_international_recruiting:0 "国际反纳粹联盟"
 TaS_WRW2_international_recruiting_desc:0 "国际反纳粹联盟是一个在我国倡议下成立的专门组织，其成员包括那些愿意帮助我们对抗德国纳粹主义以及解放被德国占领领土的国家。"
 TaS_WRW2_international_tt:0 "有了§R国际反纳粹联盟§! 的帮助，我们将获得源源不断的§R来自世界各地的志愿者§!，他们§R随时准备好§!加入到§G我们的军队§!之中!"
 SWRW_international_recruiting:0 "国际招募"
 SWRW_international_recruiting_desc:0 "无论你是谁：渴望看到那些强大竞争对手倒下的美国人、想要向西方复仇的被殖民过的非洲人，亦或是那些渴望自己的国家早日从法西斯的魔爪中被解放的欧洲人——俄罗斯欢迎每一位怀有共同目标，愿意携手改变这个扭曲的世界的人。我们的祖国曾经犯下了不可饶恕的罪行，令德国人一度征服了这片大陆，但仅仅凭借我们自己，也一样可以在第一次西俄战争中让德国人第一次遭受如此重大的挫败，让他们从胜利的美梦中惊醒，并令他们对自己的未来充满了迷茫。团结起来，让所有对当前的世界秩序感到不满的力量联合起来，我们将一同向所有敌人宣告：所有自命不凡的帝国终将迎来末日！"
 TaS_WRW2_block_suez:0 "“埃及陷阱”行动"
 TaS_WRW2_block_suez_desc:0 "该行动旨在通过与埃及国家安全部门的紧密合作，来切断德国在苏伊士运河的海上运输通道。这将对德国的经济命脉造成致命的打击，令其无法获得至关重要的战争资源。"
 TaS_WRW2_suez_tt:0 "§R一旦战争爆发§!，§R德国§!通过地中海进行§R贸易的通道将被切断§!，这将严重削弱§R德国那本已摇摇欲坠的战争机器§!"
 SWRW_interrupted_trade:0 "贸易受阻"
 SWRW_interrupted_trade_desc:0 "由于苏伊士运河这条至关重要的航道被掐断，我国的企业在竞争中步履维艰，每天都蒙受着巨大的损失。在这场甚至比第一次西俄战争还要宏大的战争爆发前夕，我们根本无力向控制着这条运河的国家施加任何有意义的影响。因此，我们只能无奈地吞下这枚苦果，继续通过绕行非洲的航线进行贸易，同时将更多的资源用于提升德国那早已落伍的军事力量上。"
 TaS_WRW2_france_talks:0 "与法国谈判"
 TaS_WRW2_france_talks_desc:0 ""
 TaS_WRW2_france_tt:0 " "
 TaS_WRW2_chill_down_germs:0 "安抚德国人"
 TaS_WRW2_chill_down_germs_desc:0 "我们不能让德国人对我们备战的行动产生任何怀疑。因此，我们必须通过中间人与德国人展开谈判，向他们保证我国没有任何敌对的企图。"
 TaS_WRW2_chill_down_germs_little:0 "和平的承诺"
 TaS_WRW2_chill_down_germs_little_desc:0 "我们必须郑重声明，我们无意发动任何战争，从而避免德国人怀疑我们的真实意图。毕竟，动动嘴皮子可比付诸实践容易多了，不是吗？\" TaS_SWRW_germs_panick:0 \"德国重整旗鼓"
 TaS_SWRW_germs_panick:0 "德国重整旗鼓"
 TaS_SWRW_germs_panick_desc:0 "我们对德国可能产生的怀疑过于掉以轻心，以至于德意志国防军已经开始秣马厉兵，准备对我们的领土发动先发制人的打击。为了安抚德国人，我们不得不殚精竭虑，甚至可能要以牺牲我国军队的利益为代价。"
 TaS_SWRW_panick_tt:0 "§R大日耳曼国将发动先发制人的打击，这将彻底打乱我们的计划！§!"
 SWRW_broken_plans:0 "功败垂成"
 SWRW_broken_plans_desc:0 "我们重蹈了当年帝国和联盟的覆辙——在毫无准备的情况下迎接了战争的到来。一切都来得太突然了，而且第三次，主动权再次落到了德国人的手中。我们所有的计划都被德国发动的先发制人打击所打乱，我们的指挥部将不得不花费大量时间来重整军队并稳固前线的局势。"
 SWRW_reichskommisariat:0 "德意志专员辖区"
 SWRW_reichskommisariat_desc:0 "我们的管理机构并不是一个主权实体，它仍旧听命于柏林的中央政府。自从第二次西俄战争打响后，大日耳曼国便加紧了对我们的一举一动的监视。由于缺乏外交上的自主权，我们无法与俄罗斯单独媾和。即使我们敢于这样做，柏林当局也只会立刻撤换我们的整个管理机构，扶持一个对他们更加俯首帖耳的傀儡政府，然后将我们以叛国罪论处，并流放到那些我们过去常常流放异见者的地方去。"
 TaS_WRW2_the_final_battle:0 "最后一战"
 TaS_2WRW_mechanics_tt:0 "§R行动开始！\n\n这场战争由我们发起，我们现在的首要任务是彻底击败德军，收复所有失地。我们必须迅速行动，赶在§e厌战度过高§!之前夺取地区。\n\n§e厌战度§!衡量的是人民和国家机器因战争而产生的疲惫程度。一旦达到30%的§e厌战度§!阈值，疲惫就会引发严重问题。§e厌战度§!程度越高，这些问题就越严重。如果我们能让§e力竭§!程度足够高，德国人就会同意对我们§G更有利§!的和平条件。§e但这把双刃剑同样可以伤到我们自己。§!"
 TaS_2WRW_exhaustion_title:0 "£war_exhaustion_icon 厌战度"
 TaS_WRW2_exhausion_modifier_GER:0 "诸神之战"
 TaS_WRW2_exhausion_modifier_RUS:0 "诸神之战"
 russian_title_loc:0 "§Y[RUS.GetNameDef][RUS.GetFlag]§!"
 TaS_RUS_war_exhaustion_info_tt:0 "§B俄罗斯§!当前厌战度为： [?RUS.WRW2_devastation]%\n-------------\n这将给予他们以下减益效果：\n\n政治点数获得： [?RUS.WRW2_exhausion_political_power_factor|R%]\n陆军组织度： [?RUS.WRW2_exhausion_army_org_factor|R%]\n建造速度：[?RUS.WRW2_exhausion_production_speed_buildings_factor|R%]\n基础生产效率： [?RUS.WRW2_exhausion_production_factory_start_efficiency_factor|R%]\n陆军攻击： [?RUS.WRW2_exhausion_army_attack_factor|R%]\n陆军防御： [?RUS.WRW2_exhausion_army_defence_factor|R%]\n工厂产出： [?RUS.WRW2_exhausion_industrial_capacity_factory|R%]\n增援率：[?RUS.WRW2_exhausion_land_reinforce_rate|R%]\n驻军需求：[?RUS.WRW2_exhausion_required_garrison_factor|G%]\n适役人口：[?RUS.WRW2_exhausion_recruitable_population_factor|R%]\n纳税人口： [?RUS.WRW2_exhausion_taxable_population_modifier|R%]"
 german_title_loc:0 "§Y[GER.GetFlag][GER.GetName]§!"
 TaS_GER_war_exhaustion_info_tt:0 "§G德国§!当前厌战度为： [?GER.WRW2_devastation]%\n-------------\n这将给予他们以下减益效果：\n\n政治点数获得： [?GER.WRW2_exhausion_political_power_factor|R%]\n陆军组织度： [?GER.WRW2_exhausion_army_org_factor|R%]\n建造速度：[?GER.WRW2_exhausion_production_speed_buildings_factor|R%]\n基础生产效率： [?GER.WRW2_exhausion_production_factory_start_efficiency_factor|R%]\n陆军攻击： [?GER.WRW2_exhausion_army_attack_factor|R%]\n陆军防御： [?GER.WRW2_exhausion_army_defence_factor|R%]\n工厂产出： [?GER.WRW2_exhausion_industrial_capacity_factory|R%]\n增援率：[?GER.WRW2_exhausion_land_reinforce_rate|R%]\n驻军需求：[?GER.WRW2_exhausion_required_garrison_factor|G%]\n适役人口：[?GER.WRW2_exhausion_recruitable_population_factor|R%]\n纳税人口： [?GER.WRW2_exhausion_taxable_population_modifier|R%]"
 frontlines_button_name:0 "战事前线"
 frontlines_desc_tt:0 "显示前方战线的可选项"
