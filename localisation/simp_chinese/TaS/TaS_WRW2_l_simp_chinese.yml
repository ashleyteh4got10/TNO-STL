 TaS_WRW2_Antarctic_Rescue_Mission_desc:0 "在德国战败后，他们便无暇顾及对南极殖民地的支援。我们可以借此机会，组织一场对德国南极科考人员的撤离行动。尽管这一想法看似天方夜谭，但却能一石二鸟：我们不仅能够在‘新士瓦本’的土地上留下自己的足迹，还能够向世界展示，俄罗斯是一个秉持人道主义精神的超级大国，即使对待已经覆灭的敌国中那些与战争无关的平民，也能够以礼相待。"
 TaS_WRW2_Demands_to_Finland:0 "对[FIN.GetFlag]芬兰的要求"
 TaS_WRW2_Demands_to_Finland_desc:0 "在1940年的苏芬战争以及维堡被占领后，两国之间互相提出的领土要求已经不是什么新鲜事了。在第一次世界大战中，除了维堡，我们还失去了整个卡累利阿和科拉半岛。在第二次“混乱时期”，我们得以收复部分失土，但这与我们曾经的广袤疆域相比，简直是九牛一毛。如果芬兰胆敢拒绝我们的合理要求，那么我们或许可以考虑一下恢复“芬兰大公国”昔日的荣光，您说呢？"
 TaS_WRW2_Demands_to_Turkey:0 "对[TUR.GetFlag]土耳其的要求"
 TaS_WRW2_Demands_to_Turkey_desc:0 "第一次世界大战后，与轴心国沆瀣一气的土耳其控制了亚美尼亚以及格鲁吉亚的边境地区。我们的任务是恢复在南高加索地区的影响力，并向土耳其提出一项关于这些土地的、互惠互利的协议。\n\n但如果爆发又一场俄土战争，那么实现帝国的夙愿——控制海峡，或许将不再是一个遥不可及的梦想？"
 TaS_WRW2_Demands_to_Romania:0 "对[ROM.GetFlag]罗马尼亚的要求"
 TaS_WRW2_Demands_to_Romania_desc:0 "由于我们不愿在第二次世界大战期间生灵涂炭，罗马尼亚得以保全其在比萨拉比亚和德涅斯特河沿岸的领土。然而，现在是时候让他们为自己的“幸运”付出代价了。"
 TaS_WRW2_Demands_to_Poland:0 "对[GPL.GetFlag]波兰的要求"
 TaS_WRW2_Demands_to_Poland_desc:0 "随着德国的崩溃，新成立的波兰控制了整个“专员辖区”，包括西乌克兰的一部分。我们的任务是索回这些土地，并以一些优惠的贸易协定和重建援助作为交换。"
 TaS_WRW2_Demands_to_Poland_tt:0 "§Y我们将要求波兰归还加利西亚地区，那里居住着大量的乌克兰人。§! §G他们将不会拒绝我们的要求§!"
 TaS_WRW2_Demands_to_Iran:0 "对[PER.GetFlag]伊朗的要求"
 TaS_WRW2_Demands_to_Iran_desc:0 "在我们战胜德国后，伊朗境内仍然效忠于大日耳曼国的沙阿政权侥幸逃脱了正义的审判。不过，这世上本就没有什么奇迹，因此，我们将发动一场军事行动，彻底推翻伊朗现任统治者的统治！"
 TaS_WRW2_Demands_to_Iran_tt:0 "§Y我们将入侵伊朗§!"
 MAR_ultimatums.100.t:0 "俄罗斯要求获得卡累利阿"
 MAR_ultimatums.100.d:0 "无需本地化"
 MAR_ultimatums.100.a:0 "同意"
 MAR_ultimatums.100.b:0 "拒绝"
 MAR_ultimatums.101.t:0 "卡累利阿的回归"
 MAR_ultimatums.101.d:0 "今天上午，我们收到了一个振奋人心的消息：派往芬兰就收复卡累利阿问题进行交涉的代表团不辱使命，凯旋而归。由于芬兰方面不愿无偿交还这些领土，两国之间的谈判一度陷入了僵局。在持续数日的谈判中，双方就所有可能引发争议的细节问题展开了激烈的讨论。每一个议题都引发了激烈的争论；但是，通过长时间的、坚持不懈的磋商，芬兰方面最终做出了让步，这标志着我们收复卡累利阿的行动取得了圆满成功。芬兰承诺从所有相关地区撤军，并将这些土地归还给俄罗斯。\n\n这一历史性的事件，离不开我国代表团的坚持不懈和顽强拼搏，他们在最高层级展开了艰难的谈判。讨论的激烈程度有时甚至达到了白热化的地步，但双方都清楚地认识到这一问题的重大意义和敏感性。卡累利阿对于俄罗斯和芬兰都具有极其重要的战略意义，多年来，这一问题一直是两国之间争论和分歧的焦点。现在，随着所有历史遗留问题都得到了解决，我们可以自信地说：卡累利阿已正式回归俄罗斯帝国的怀抱。"
 MAR_ultimatums.101.a:0 "俄罗斯以实力为后盾"
 MAR_ultimatums.102.t:0 "芬兰的拒绝"
 MAR_ultimatums.102.d:0 "令人遗憾的是，我们的外交官在与芬兰的谈判中所付出的一切努力都付诸东流了。赫尔辛基方面断然拒绝归还他们长期以来一直视为己有的领土。俄罗斯代表团提出的所有建议都被芬兰方面无视，并遭到了理所当然的拒绝。当一切都表明，指望通过理性谈判来解决问题已无异于痴人说梦时，我们的代表团不得不空手而归。\n\n现在，政府正在考虑通过其他方式来解决卡累利阿问题：\n\n一方面，饱经战火洗礼的俄罗斯军队完全有能力通过武力击败芬兰。对这个北欧国家的主要城市发动一场闪电战，不仅可以迫使芬兰政府投降，而且还能扶植一个亲俄的傀儡政权。这个新政府将会彻底放弃前任政府所提出的一切无理要求，并与俄罗斯展开全方位的合作，彻底消除两国之间的一切历史遗留问题。\n\n然而，从另一方面来说，我们的人民早已厌倦了无休止的战争。持续不断的冲突很可能会在国内引发各种各样的矛盾。或许，现在是时候放下那些不切实际的野心，与我们的邻国和平共处，共同努力，维护地区的稳定与和谐了。"
 MAR_ultimatums.102.a:0 "我们不能为了这块不毛之地而白白牺牲"
 MAR_ultimatums.102.b:0 "让芬兰人明白他们究竟招惹了谁"
 MAR_ultimatums.103.t:0 "关于巴统的协议"
 MAR_ultimatums.103.d:0 "无需本地化"
 MAR_ultimatums.103.a:0 "同意"
 MAR_ultimatums.103.b:0 "拒绝"
 MAR_ultimatums.104.t:0 "成功的交易"
 MAR_ultimatums.104.d:0 "俄罗斯外交官们高举着手中的酒杯，庆祝着此次土耳其之行的圆满成功，这是一次真正意义上的胜利之旅。谈判的核心议题是巴统的归属问题。在与土耳其代表会晤后，双方就高加索地区的未来前景以及这一地区的力量格局将会如何变化展开了深入的讨论。\n\n尽管交易本身早已板上钉钉，但谈判的主要内容却并非是劝诱土耳其同意出售该地区，而是就具体的价格以及在土耳其失去该地区后，俄方应以何种方式、给予土方多少补偿等细节问题讨价还价。谈判代表们仔细研究了每一个数字和每一项条款，并为可能发生的意外情况做好了万全的准备。尽管俄罗斯方面竭尽全力想要减少经济损失，但土耳其方面却试图尽可能地提高这块即将易主的土地的价格。这使得谈判陷入了僵局，双方甚至一度爆发了激烈的争吵。\n\n但双方都很清楚：协议能否迅速达成，不仅关系到经济利益，更关系到整个地区的稳定。在经过了数日夜以继日的紧张磋商后，两国代表终于达成共识，一致认为，只有妥协才能实现长期的互利共赢。最终，他们达成了一项令双方都满意的协议。\n\n当协议正式签署后，剩下的唯一一件事便是举杯庆祝这一来之不易的成功。因此，一位俄罗斯代表举起了手中的酒杯，向他的同事们说道……"
 MAR_ultimatums.104.a:0 "为了我们之间互惠互利的合作，干杯！"
 MAR_ultimatums.105.t:0 "拒绝交易"
 MAR_ultimatums.105.d:0 "我们向安卡拉提出的关于巴统的“友好”建议，得到的却只有一个斩钉截铁的答复——“不卖”。我们的所有论据都无法说服土耳其政府接受这项协议；出于对俄罗斯在高加索地区日益增长的影响力的担忧，土耳其断然拒绝了我们所提出的方案。而他们这种拒不合作的态度也给两国未来的关系蒙上了一层阴影。\n\n这样的失败也激怒了我国的许多高层人士，他们原本希望能够看到一个更具建设性的、更为圆满的结局。他们强调，面对眼前的威胁，我们必须在战略上保持灵活。\n\n然而，俄罗斯绝不会放弃自己的利益，我们也绝不会空手而归。于是，一个大胆的想法应运而生——采取武力行动，甚至不惜以强硬手段夺取这座城市，这将迫使土耳其在升级冲突和接受失败之间做出选择。俄罗斯正准备对她的对手采取断然行动，以彰显其在该地区的影响力。\n\n不过，采取这种行动所要付出的代价也是显而易见的：这种行为很可能会引发一场更大规模的战争，从而造成巨大的经济损失和人员伤亡。这也不可避免地会对俄罗斯的国家形象造成损害。\n\n最大的风险在于两国之间那刚刚建立起来的关系将彻底破裂，由于俄罗斯的侵略行为，两国甚至有可能断绝一切外交关系。\n\n帝国和沙皇再次面临两难抉择：是诉诸武力，还是继续寻求和平的解决方案？在经过长时间的战略讨论并对所有可能的后果进行评估后，沙皇最终签署了一项法令，确定了俄罗斯对土耳其的下一步政策。"
 MAR_ultimatums.105.a:0 "我们必须尊重他们的拒绝"
 MAR_ultimatums.105.b:0 "我们绝不会空手而归"
 MAR_ultimatums.106.t:0 "解放巴统"
 MAR_ultimatums.106.d:0 "短短几天之内，俄罗斯军队便势如破竹地扫荡了这片山区，占领了所有我们曾经希望通过谈判来获得的领土。如今，外交手段已经彻底失效，取而代之的，则是枪炮和武力。\n\n在接到上级的命令后，俄罗斯军队以雷霆万钧之势发动了全面进攻，兵不血刃地占领了大片领土。措手不及的土耳其军队根本无力组织起有效的抵抗，很快便被迫放弃阵地，仓皇撤退。为数不多的几支胆敢与俄军交战的土耳其驻军也都被彻底击溃。\n\n在成功占领了所有相关领土后，俄罗斯军队随即停止了前进的步伐，没有进一步扩大战果。这是一个经过深思熟虑的战略决策：根据已取得的成果，指挥部认为进一步的军事行动已毫无必要——战前制定的目标均已实现。现在，最重要的任务是巩固已取得的阵地，并着手建立对新占领土的有效控制。这一胜利的意义不仅在于军事上的成功，还在于我们得以在国际舞台上展现俄罗斯的强大实力。\n\n与此同时，我们也密切关注着土耳其方面的反应：他们将会如何回应俄方所采取的这些强硬措施呢？很大程度上，这取决于土耳其政府的下一步行动；安卡拉方面日益高涨的愤怒情绪可能会导致冲突进一步升级，也有可能迫使他们重新回到谈判桌上。"
 MAR_ultimatums.106.a:0 "用小小的牺牲换取伟大的胜利"
 MAR_ultimatums.107.t:0 "巴统冒险的失败"
 MAR_ultimatums.107.d:0 "在俄罗斯民众之间流传着一个令人沮丧的消息：我们为了夺取梦寐以求的巴统地区而发动的军事行动彻底失败了。我们原本指望出其不意地发动袭击，但这一计划却未能奏效。土耳其军队不仅对我们的突然袭击做好了充分的准备，还成功地击退了俄军的所有攻势。\n\n土耳其军队行动迅速，配合默契，对我们的每一次进攻都做出了坚决的反击。他们很快便扭转了战局，迫使俄罗斯军队蒙受了巨大的损失。那些试图展现自己英雄气概的士兵们所得到的，只有无尽的绝望。\n\n最终，这次行动以失败而告终，双方都未能夺取任何新的领土，但却付出了数十条生命的代价。这场惨痛的失败让人们清楚地认识到，军事冒险是要付出巨大的代价的。现在所有人都很清楚：采取进一步的军事行动已毫无意义；宣布开战只会加剧国内的紧张局势，并引发民众的大规模抗议，而他们早已对这一不负责任的政治决策深恶痛绝。\n\n这次失败对俄罗斯帝国的国际地位产生了深远的影响。俄土关系彻底破裂，并且需要很长的时间来修复。巴统的失败给普通民众留下了难以磨灭的伤痕，成为了一个带有警示意味的词汇，而俄罗斯军队的声誉也因此而一落千丈。"
 MAR_ultimatums.107.a:0 "这场惨败将会被人们长久地铭记"
 MAR_ultimatums.108.t:0 "俄罗斯人占领了巴统"
 MAR_ultimatums.108.d:0 "无需本地化"
 MAR_ultimatums.108.a:0 "我们只能忍气吞声了，唉"
 MAR_ultimatums.108.b:0 "希望他们能乖乖听话"
 MAR_ultimatums.109.t:0 "土耳其正在集结兵力"
 MAR_ultimatums.109.d:0 "一个宁静的早晨，首都的居民们却被一阵突如其来的警报声从睡梦中惊醒。紧张的气氛沿着南部边境迅速蔓延开来，而这紧张的源头，正是土耳其军队在朝着高加索地区的大规模集结。为了应对这一突发情况，政府立即召开了紧急会议，讨论应对方案和摆脱困境的方法。\n\n很明显，我们最近为了收复巴统而采取的行动成为了一个导火索，它成为了土耳其采取激进行动，试图加强其在高加索地区影响力的一个绝佳借口。情报部门报告说，最近出现了一些新的营级作战单位，初步估计有数万乃至数十万的士兵正奉命开赴前线，集结待命，随时准备采取进一步行动。\n\n关于我们应该如何应对当前局势的激烈争论正在展开。在所有的提议中，主要有三种不同的声音：\n\n第一种意见是立即撤退。很显然，我们为了收复失地所采取的行动所产生的后果比我们预想中要严重得多。如果继续同土耳其对抗下去，可能会引发一场新的战争，无论结果如何，都将会给我们带来无数的问题和麻烦。\n\n第二种意见则是采取观望策略。我们决不能放弃已经取得的成果，但与此同时，也不应采取过激的行动，否则很可能会引发一场旷日持久的冲突。他们建议我们加强防御：在这样一个关键时刻，绝不能露出丝毫破绽。\n\n最后一项提议是立即对土耳其发动先发制人的打击。俄罗斯军队拥有足够的经验和实力，能够给予敌军迎头痛击。这场战争将会彻底解决两国之间那由来已久的争端。当然，我们也需要考虑新一轮的冲突可能会在人民中引起极大的负面情绪。"
 MAR_ultimatums.109.a:0 "冒险的代价将无法弥补。"
 MAR_ultimatums.109.b:0 "继续监视，但绝不退缩。"
 MAR_ultimatums.110.t:0 "与土耳其人的战斗开始了"
 MAR_ultimatums.110.d:0 "无需本地化"
 MAR_ultimatums.110.a:0 "球进了！"
 MAR_ultimatums.111.t:0 "和平的提议"
 MAR_ultimatums.111.d:0 "无数场战斗已经结束，但前方仍有无数的战斗在等待着我们。然而，一封来自土耳其的信件却给这无休止的流血冲突带来了一丝转机。安卡拉方面表示希望签署一项和平条约，以结束因高加索地区局势不断升级而爆发的这场战争。\n\n现在，在付出了巨大的牺牲后，土耳其政府主动与俄罗斯进行接触，商讨可能的和平方案。现在，能够决定战争走向的不再是那些端着步枪的士兵，而是那些负责外交事务的官员们，他们正在以最快的速度起草一份旨在恢复两国关系的文件。双方开始就实现最终和平的各项条件展开了磋商。\n\n不过，并非所有的指挥官都支持这一“和平”倡议。许多将军认为，胜利已经近在咫尺，现在放弃无异于前功尽弃。与其签署一项新的和平协议，倒不如一鼓作气，占领更多的领土，那些俄罗斯人自古以来梦寐以求的土地。或许，这是实现伟大梦想的最后机会。\n\n诚然，继续将这场冲突持续下去，未必能带来任何好处。但对于战争胜利果实的渴望却始终萦绕在这些人的脑海中，挥之不去。最终，皇室就这一问题做出了最终的裁决。"
 MAR_ultimatums.111.a:0 "是时候结束这一切了"
 MAR_ultimatums.111.b:0 "我们要进军君士坦丁堡！"
 MAR_ultimatums.112.t:0 "俄罗斯要求获得摩尔达维亚和比萨拉比亚"
 MAR_ultimatums.112.d:0 "无需本地化"
 MAR_ultimatums.112.a:0 "我们同意"
 MAR_ultimatums.112.b:0 "想都别想"
 MAR_ultimatums.113.t:0 "罗马尼亚拒绝了我们的要求"
 MAR_ultimatums.113.d:0 "突如其来的消息传来，一封来自罗马尼亚政府的信件送到了我们的手中——许多人都在翘首以待，但最终的结果却令人大失所望。\n\n不久前，俄罗斯皇室向罗马尼亚发出照会，其核心要求是罗马尼亚归还摩尔多瓦和比萨拉比亚。这些早已失落的领土本可以重新回到俄罗斯的怀抱；但现在看来，罗马尼亚人并不打算不战而降，放弃他们所拥有的一切。\n\n尽管俄罗斯外交官们竭尽全力试图说服布加勒斯特方面接受我们的提议，但罗马尼亚方面却始终不为所动。在拒绝了俄罗斯的最后通牒后，他们似乎已经做好了迎接一切后果的准备。\n\n对这一结果感到失望的俄罗斯外交使团空手而归。沙皇对这一结果并不感到意外，尽管他也难掩失望之情。在经过深思熟虑，并对所有的利弊进行权衡之后，他宣布了他对罗马尼亚的下一步计划。"
 MAR_ultimatums.113.b:0 "布加勒斯特将为此付出代价"
 MAR_ultimatums.113.a:0 "我们必须构建一个和平的未来"
 MAR_ultimatums.114.t:0 "俄国国旗下的加利西亚"
 MAR_ultimatums.114.d:0 "随着和平的降临和波兰的独立，在亲俄势力的支持下，新成立的波兰政府决定通过将加利西亚割让给俄罗斯帝国的方式，来彻底解决两国之间的一切领土争端。这一举动也被历史学家们视为两国关系史上的一个重要里程碑——它标志着两国合作新时代的开始。\n\n俄罗斯欣然接受了这一决定，认为这是一个具有重大地缘政治意义的举措，并表示将向波兰提供全方位的支持，与之携手并进。\n\n在政权交接的过程中，波兰的文化认同和传统得到了充分的尊重和保护——这一措施也有助于巩固两国之间的友好关系。两国的外交官们也在积极地努力深化双边关系，不仅强调领土的扩张，而且还致力于在统一的合作框架内为两国人民创造共同繁荣的条件。\n\n因此，波兰和俄罗斯进入了双边关系的新阶段——一种建立在信任、互相支持和相互尊重基础上的伙伴关系。"
 MAR_ultimatums.114.a:0 "外交政策的新篇章"
 MAR_ultimatums.115.t:0 "俄伊边界条约"
 MAR_ultimatums.115.d:0 "为了恢复在中亚地区的影响力，俄罗斯帝国采取了果断的措施来扩大其领土。在将目光投向伊朗后，俄罗斯向其提出了最后通牒，要求伊朗归还具有重要历史意义的城市捷希斯坦——该城市曾一度被伊朗军队占领。\n\n起初，德黑兰方面对此表示强烈不满：他们认为这一要求是对其主权的粗暴干涉。然而，在冷静地分析了政治局势后，伊朗当局不得不重新考虑他们的立场。国内的动荡以及国际局势的不确定性都使得伊朗清楚地认识到，与俄罗斯爆发公开冲突可能会导致灾难性的后果。\n\n在仔细权衡了所有可能的情况后，德黑兰方面决定同意归还捷希斯坦。这是一个折中的方案，既避免了战争的爆发，又维护了地区的稳定。俄罗斯和伊朗的代表经过磋商，最终签署了一项协议。\n\n捷希斯坦重新回到俄罗斯帝国的怀抱，这为地区政治史翻开了崭新的一页。俄罗斯迅速着手将这片新获得的领土纳入到帝国的体系之中：大量的投资被用于捷希斯坦的基础设施建设。\n\n最终，捷希斯坦的回归成为了俄罗斯外交政策上的一次重大胜利，也为其进一步巩固在该地区的地位以及扩大其在国际舞台上的影响力奠定了坚实的基础。"
 MAR_ultimatums.115.a:0 "轻而易举"
 MAR_ultimatums.116.t:0 "极地大撤离"
 MAR_ultimatums.116.d:0 "这场横跨南北半球的旅程最终演变成了一场对人类古老梦想的终极考验——征服这片被冰雪永远覆盖着的南极大陆。\n\n在一艘艘破冰船劈波斩浪、奋勇向前的引领下，一支舰队正朝着南极洲那被坚冰所封冻的海岸全速前进。此次远征的主要目的是展开一场救援行动——将那些在经历了无数苦难后被困在世界尽头的、走投无路的德国士兵们解救出来。\n\n最终，船队成功突破了层层坚冰的阻碍，抵达了目的地；俄罗斯军队踏上了南极洲的冰原，开始朝着前德军基地遗址进发。在那些破败不堪的建筑中，搜救工作紧锣密鼓地展开了——寻找那些幸存下来的、奄奄一息的德国士兵。由于饥寒交迫，这些士兵们早已丧失了抵抗的意志。\n\n这些被遗弃的驻军，本是为了科学研究和战略防御的目的而建立的，却被他们的长官无情地抛弃了。匮乏的补给以及南极地区那严酷的自然环境迫使这些德国人不得不重新审视他们的人生信条；第三帝国的旗帜早已不知被他们丢到了何处——他们对来自“祖国”的“援助”早已不抱任何幻想。\n\n撤离行动困难重重：在冰天雪地中长途跋涉，同时还要为那些获救的人员提供人道主义援助。尽管困难重重，但行动最终还是取得了圆满成功——所有幸存的德军士兵都被成功撤离，而那些宝贵的科研成果和技术资料则作为战利品被俄军悉数带回。这次行动不仅体现了俄罗斯军人的人道主义精神，更彰显了俄军卓越的战略眼光。"
