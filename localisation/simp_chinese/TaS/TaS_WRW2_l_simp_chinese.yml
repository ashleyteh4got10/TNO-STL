 swrw_desc:0 "[Get_swrw_desc]"
 stage_one_desc:0 "我们的祖国已经不止一次在战场上与日耳曼人的庞大军队兵戎相见了。而每一次，胜利的女神都离我们而去。这一次，我们已不容有失。我们与德国之间爆发的这场冲突，将决定两国未来的命运。因此，我们必须竭尽全力，认真备战。这也许是俄罗斯最后的机会了。"
 stage_two_desc:0 "第二次伟大的卫国战争已经打响了！现在，是时候终结我们民族所遭受的一切屈辱了！整个欧洲都在渴望着从德国人的枷锁中挣脱出来，而我们必须回应这份悲惨的呼声。我们的军队已经向西挺进，而这场决定俄罗斯未来的伟大斗争也正值高潮阶段。前进，同志们！德意志必须被摧毁！"
 stage_ger_desc:0 "这已经是二十年前的旧事了。如今，俄罗斯的游牧蛮族再次越过乌拉尔山脉而来，妄图摧毁我们的国家和文明。为了确保我们的人民能够真正完成造物主所赋予的历史使命，我们正进行着殊死的搏斗。我们绝不会让先辈们打下的基业毁于一旦。"
