 TNO_anarchy_MAN_tt_delayed:0 "曾经是大东亚共荣圈明珠的满洲，如今已沦为一片绝对暴力横行的领土，没有人能声称掌控局面。关东军各部队已经瓦解为一个个土匪团伙，皇室成员神秘失踪，文官政府的官员们互相残杀，试图找出谁该为滨海边疆区的灾难负责。\n\n工业财团急于将所有有价值的东西从这个国家撤离，希望至少能保住他们通过剥削满洲和满洲人民而获得的部分利益。而现在，这颗明珠正被朝鲜游击队、关东军残部、日本工业巨头的私人军事公司瓜分。或许总有一天，被削弱的东京能重新控制满洲国。\n\n§x但这颗明珠再也不会恢复昔日的光彩了...§!"
 GC_ManchurianCivilWar:0 "满洲内战"
 JAP_manchurian_civil_war_category_desc:0 "啊啊啊！"
 MAR_manchurian_civil_war_category_desc:0 "满洲，这颗昔日亚洲共荣圈的耀眼明珠，如今已被全面内战的阴霾笼罩。在一片混乱之中，爱新觉罗·溥杰及其追随者也举起了起义的大旗。作为一场君主主义运动，他们妄图恢复大清王朝对全中国的统治。尚不清楚他们是否能够实现这番野心，但无论如何，在这场满洲争夺战中，我们必须予以他们支持。"
 MAR_Kosygin_manchurian_civil_war_category_desc:0 "满洲，这颗昔日亚洲共荣圈的耀眼明珠，如今已被全面内战的阴霾笼罩。在一片混乱之中，爱新觉罗·溥杰及其追随者也举起了起义的大旗。作为一场君主主义运动，他们妄图恢复大清王朝对全中国的统治。尚不清楚他们是否能够实现这番野心，但无论如何，在这场满洲争夺战中，我们必须予以他们支持。"
 USA_manchurian_civil_war_category_desc:0 "我们在这里做什么？"
