 MAN_civil_war:0 "满洲内战"
 MAN_civil_war_desc:0 "共荣圈的明珠破裂了。 俄罗斯人、中国人和日本人终究无法在同一个国家共存，而俄罗斯的统一让这本就一触即发的火药桶彻底爆炸了。战火在燃烧的满洲肆虐，但或许它永远都无法再次统一了。"
 MJP_lost_north:0 "失落的北方"
 MJP_lost_north_desc_desc:0 "内战的爆发导致满洲北部地区失守。起义的俄罗斯人夺走了我们在这片土地上经营数十年所建立的工厂和基础设施。如果俄罗斯再次陷入混乱，我们一定会卷土重来，但至少在目前，我们只能厉兵秣马，枕戈待旦。"
 MJP_reconstruction_programm:0 "重建"
 MJP_reconstruction_programm_desc:0 "在经历了战争的蹂躏与破坏后，现在是时候重建家园了。日本的财阀们慷慨地投入了大量的资金和资源，用于重建那些被战火摧毁的城市。但请不要被这些虚假的慷慨所蒙蔽，最终，这些财阀将会张开他们的血盆大口，将我们吞噬殆尽，直到我们彻底窒息而死。"
 MJP_chained_forever:0 "永远的枷锁"
 MJP_chained_forever_desc:0 "可耻的失败使我们甚至连过去所拥有的那虚无缥缈的自由都已失去。现在，从国家大事到人事任命，再到社会生活的方方面面，东京方面都要横插一脚，事无巨细，全部都要由他们来掌控。"
 MAN_liberty:0 "自由"
 MAN_liberty_desc:0 "我们终于自由了！随着哈尔滨以及整个北满地区的解放，被日本人奴役和压迫的屈辱历史终于画上了句号。尽管我们仍面临着战后重建的重重困难，但未来仍然充满着光明！"
 MAN_refugees:0 "难民"
 MAN_refugees_desc:0 "随着北满地区的解放，难民危机也随之而来。人们纷纷逃离那些仍处于战火中的南方地区，那里仍有满洲人和日本人在作威作福。我们已经采取措施安置涌入的难民，但难民潮仍旧没有停息的迹象。"
 MAN_shadow_deals:0 "秘密交易"
 MAN_shadow_deals_desc:0 "尽管我们已经摆脱了武士老爷们的直接控制，但武士老爷们的阴影仍然笼罩在我们头顶。日本的财阀们仍然在我们经济的方方面面拥有着巨大的影响力，这也使我们的国家成为了共荣圈的影子市场。财阀们、美国公司以及其他那些不愿抛头露面的人，都对我们的市场垂涎欲滴。"
 HAN_voiceback_of_china:0 "往昔的低语"
 HAN_voiceback_of_china_desc:0 "在如今这动荡不安的局势下，越来越多的国民，包括那些身居高位的人，开始怀念起满洲人统治中国的时代。确实，一个统一的中国，无论由谁统治，都将成为一股强大的力量，并引领21世纪的世界潮流！但东京的那些老爷们又会作何反应呢？"
 PFF_surrounded_by_fear:0 "恐惧的环绕"
 PFF_surrounded_by_fear_desc:0 "达摩克利斯之剑悬在我们的头顶，而我们却对此束手无策。当金日成准备发动他的“解放战争”之时，日本皇军的士兵们离我们似乎越来越近了。"
 SWRW_FEnegotiations_unique_effigy:0 "   §Y特殊决议§!"
 SWRW_FEnegotiations_unique_effigy_desc:0 "这些决议在所有的谈判回合中均可使用，但请注意，§Y您只能从该类别中选择一项决议§!"
 FE_negotiations_start_tt:0 "§Y我们将开始关于远东地区命运的谈判§!"
 MAR_Japan.28.t:0 "欧亚大陆的脊梁"
 MAR_Japan.28.d:0 "马斯连尼科夫和与他同车的几位男士是叶卡捷琳堡近期迎来的最为“尊贵”的客人们。尽管表面上营造出了一种友好的氛围，但在场的每一个人都很清楚，一场尔虞我诈的较量即将展开。一方面，是统一俄罗斯的经济部长和日产财阀的代表们，而另一方面，则是那些在满洲地区一手遮天的工业巨头们。前者的目的是说服后者将资金投入到乌拉尔地区的建设中，而后者的目的则是说服前者为他们提供更多的资金。\n\n满洲的实业家们堪称“共荣圈”中最为贪婪和冷酷的吸血鬼，但马斯连尼科夫和日产财阀的代表们也早已做好了充分的准备，为了让满洲人将他们的资金投入到乌拉尔地区，他们不惜付出任何代价。汽车在日产公司新近建成的一家工厂前停了下来，而这家工厂此前位于大阪。\n\n在参观了完这些高科技的机床和先进的设备后，满洲代表团的非正式领袖山口先生向马斯连尼科夫说道：\n\n“马斯连尼科夫先生，以及来自日产的各位同僚，我们看到了非常精美的设备和厂房，但我们更关心的是，它们是否能给我们带来真金白银的回报。您拿什么来吸引我们呢？”\n\n马斯连尼科夫仿佛早就料到了他会这样问，脸上露出了得意的微笑，并邀请在场的所有人前往会议室。在那里，他们看到了一张张图表，上面清楚地标明了收入和支出，以及生产增长率等数据。马斯连尼科夫将上一年度的报告递给了山口，并开始回答他的问题。\n\n“先生们，正如你们所看到的那样，这家工厂的业绩令人惊叹。除了各种税收优惠以及近乎完全的司法豁免权之外，俄罗斯还能向你们提供一些你们在其他任何地方都无法找到的东西。”\n\n“哦？是什么呢？”\n\n一直静候时机的日产公司代表接过了话茬，与马斯连尼科夫一同完成了他们的计划，并给予了满洲人最后的致命一击。\n\n“劳动力，山口先生。您瞧，大多数俄罗斯人所接受的教育水平是普通的中国工人难以企及的。此外，由于过去三十年间的战乱和动荡，俄罗斯人愿意为了微薄的薪水而拼命工作，这工资甚至比满洲的平均工资水平还要低。”"
 MAR_Japan.28.a:0 "乌拉尔的吸引力与日俱增。"
 MAR_Japan.29.t:0 "阴影与迷雾中的主宰者"
 MAR_Japan.29.d:0 "该死的偏头痛，该死的背痛，该死的这副老骨头。当吉尔等待着高宗武的到来时，往昔岁月的重担又一次压在了他的肩上。不久之后，办公室的门开了，这位面带微笑的外交官走进了房间，坐到了桌子旁。\n\n“很抱歉我迟到了，吉尔先生。希望这没有给您带来任何不便。”\n\n“完全没有，高先生，我今天想和您讨论一下民国和帝国之间的对外经济合作协议。”\n\n高宗武看着吉尔，脸上露出了一丝疑惑。\n\n“但您不会真的以为我们会讨论这个问题，对吧？”\n\n“当然不会，高先生。您完全可以和我们的经济部长讨论这些无关紧要的问题。显然，您今天来是为了讨论其他一些重要的事情。”\n\n离开了那间被严密监听的“正式”会议室后，吉尔和高宗武来到了一个隐藏在承重墙后面的密室。\n\n“那么，吉尔先生，俄罗斯终于统一了。”\n\n“没错，而中国很快也会迎来这一天。”\n\n“这自然会发生，但我们对你们与日本之间的关系更感兴趣。”\n\n“我们对日本也有着诸多不满，可能不像贵国那么多，但仍然存在着一些问题。符拉迪沃斯托克仍然在他们的控制之下，除非他们将整个滨海边疆区归还给我们，否则我们绝不会善罢甘休。”\n\n“你们是否打算请求我们在这场谈判中给予你们支持？我们已经准备好了，但我们对你们在未来冲突中的立场非常感兴趣。”\n\n吉尔友好的语气突然变得警惕而又充满戒备。\n\n“您这话是什么意思？”\n\n“您当然明白我的意思，这再清楚不过了。你们迟早会试图从德国人手中夺回那些曾经属于你们的土地。这无疑是一个崇高的目标，但迟早我们也会做类似的事情。问题是，你们会支持我们吗？”\n\n“我们会接受您所能提供的一切援助，但至于中日之间可能爆发的冲突，我们现在还无法给出任何承诺。您看，现在说这些还为时尚早，而且俄罗斯的立场可能会发生变化，这很大程度上也将取决于我们从德国人手中解放领土的战争结果。”"
 MAR_Japan.29.a:0 "模棱两可的措辞，戒备森严的目光。"
 MAR_Japan.30.t:0 "两位皇帝"
 MAR_Japan.30.d:0 "今天，东京那极尽奢华的排场达到了顶峰。整个城市都沉浸在节日般的喜庆气氛中，街道上到处都是维持秩序的东京警察，宪兵队和秘密警察也加入了其中。皇帝、首相以及一大批高级官员、记者和安保人员都在等待着阿列克谢·罗曼诺夫，这位“复活的沙皇”的专机到来。仅仅在几年前，俄罗斯还是一个“早已灭亡的国家”，而如今它已然崛起，成为了日本在“共荣圈”之外为数不多的几个亲密伙伴之一。正因如此，这位“复活的沙皇”的到访才会在东京引发如此巨大的轰动。\n\n不久之后，一架从北方飞来的白色飞机降落在跑道上，沙皇阿列克谢、他的随从以及他们的贴身“护卫”走下了飞机。在欢迎仪式结束后，裕仁天皇和罗曼诺夫一同乘车前往皇宫。沿途，大批的日本民众向他们的天皇以及这位象征着日本国家实力的盟友欢呼致意，尽管其中也有一些人挥舞着统一俄罗斯的旗帜。\n\n终于，在抵达皇宫后，裕仁天皇和阿列克谢以及首相握了握手，然后走进了皇宫。阿列克谢终于可以长舒一口气了。"
 MAR_Japan.30.a:0 "“这场闹剧总算结束了，现在该谈正事了。”他心想。"
