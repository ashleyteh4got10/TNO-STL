 RUSAlliance_Leader:0 "欧亚宪兵"
 RUSAlliance_Leader_effect:0 "[!RUSAlliance_Leader]"
 RUSAlliance_Leader_desc:0 "从符拉迪沃斯托克到弗拉季高加索，再到欧洲的腹地，俄罗斯再次崛起，自豪地屹立于世界民族之林。在击败了第三帝国后，俄罗斯取代了其在国际舞台上的地位。但俄罗斯为世界带来的，不是种族灭绝、强迫劳动和核讹诈，而是自由、创造和繁荣。俄罗斯及其盟国和各个军管区的领土覆盖了欧亚大陆的很大一部分，并与中东、东亚、斯堪的纳维亚、巴尔干半岛和中欧接壤。\n\n为了纪念俄罗斯帝国在国际上的辉煌历史，这个新帝国被人们称之为“欧亚宪兵”。作为这个新联盟的事实领袖，正是这个“人民帝国”，它在一定程度上决定了所有成员国的外交政策，并拥有吸纳新成员国加入该联盟的权力。虽然“欧洲模式”还未完全过时，但可以肯定的是，只要俄罗斯继续担任这一模式的“指挥”，那么秩序的乐章就将永不停歇，并为世界带来和平，将世界从纳粹的影响中彻底解放。"
 RUSAlliance_Independent_Member:0 "欧亚人民联盟独立成员国"
 RUSAlliance_Independent_Member_effect:0 "[!RUSAlliance_Independent_Member]"
 RUSAlliance_Independent_Member_desc:0 "国内生产总值增长：§Y10%§!\n\n在俄罗斯统一后，当整个世界都面临着巨大变革时，这个国家就已经看到了这头“苏醒的巨熊”所蕴藏的巨大潜力，并决定与其开展合作。现在，随着“欧洲霸主”的轰然倒塌，以及俄罗斯的影响力遍布整个欧亚大陆，这个国家已经成为其最亲密的盟友。与该联盟中的许多其他成员国不同，这个国家的统治者拥有完全的自主权。所有不属于该联盟职权范围内的政治、经济和外交决策，都由其自主决定，而无需沙皇及其亲信的干涉。\n\n尽管在某些问题上，俄罗斯的意见仍然举足轻重，但与俄罗斯之间这种高度的联盟关系，使他们能够公开讨论各种争议问题，并且往往能达成令双方都满意的折中方案。"
 RUSAlliance_Dependent_Member:0 "欧亚人民联盟附属成员国"
 RUSAlliance_Dependent_Member_effect:0 "[!RUSAlliance_Dependent_Member]"
 RUSAlliance_Dependent_Member_desc:0 "国内生产总值增长：§Y5%§!\n\n这个国家曾在德国的卵翼下苟延残喘数十年之久，如今则彻底倒向了俄罗斯。所有政治、立法、经济、军事以及其他任何重要的行动和决定都必须得到沙皇及其亲信的批准才能生效。\n\n每一个部委以及军队中都安插着俄罗斯的“观察员”，所有主要城市的政府大楼都处于俄罗斯对外情报部门的严密监控之下。尽管克里姆林宫并无意将这片领土并入俄罗斯，但他们也绝不会放松对这些“盟友”的控制。"
 RUSAlliance_Military_Government:0 "俄罗斯军事管辖区"
 RUSAlliance_Military_Government_effect:0 "[!RUSAlliance_Military_Government]"
 RUSAlliance_Military_Government_desc:0 "国内生产总值增长：§R-2.5%§!\n\n在战争结束后，沙皇立即下令设立军管区，旨在加强对那些前专员辖区，以及对其他那些难以直接控制的地区的统治。军管区的政治结构十分简单——所有的权力都集中在人民帝国将军及其麾下的部队手中。尽管当地不存在任何形式的文官政府，军队的士兵和军官们对于管理民生和经济也毫无兴趣，但军管区司令员还是会尝试与当地的神职人员、前游击队领袖以及那些没有与德国占领当局合作过的政治家们建立并保持联系。\n\n很大程度上，军事管制区的建立借鉴了OFN军事占领区和日本帝国卫戍区的经验。军管区被认为是一种“旨在稳定政治气候，并将社会从法西斯分子和其他激进分子手中解放出来的临时措施”。尽管人们对军管区寄予厚望，但没有人知道这些“临时”措施将持续多久。"
 RUSAlliance_Observer:0 "欧亚人民联盟伙伴国"
 RUSAlliance_Observer_effect:0 "[!RUSAlliance_Observer]"
 RUSAlliance_Observer_desc:0 "国内生产总值增长：§Y5%§!\n\n随着一个崭新联盟的建立，以及一个旧秩序的轰然倒塌，国际政治格局也随之发生了天翻地覆的变化。虽然美国和日本尚未就俄罗斯所主导的这一联盟发表正式声明，但许多独立国家都希望能“一窥”这“新秩序”的“庐山真面目”，同时又希望避免因此而承担任何重大的政治后果和义务。\n\n尽管在联盟内部的各种会议和组织中没有决定权，但这些“伙伴国”的外交代表有权监督联盟内部法律的实施情况，并有权出入所有成员国的领土，包括那些军管区。尽管目前我们还不得而知这些“伙伴国”未来对我们联盟的真实态度，但最低限度的国际合作总好过完全没有。"
