 RUS_SWRW.1.t:0 "最后一战"
 RUS_SWRW.1.d:0 "点燃一支香烟后，高级中士凝视着总参谋部大楼。这是一座经过翻新的宏伟建筑，四周一尘不染，警卫们一丝不苟地站岗巡逻。再次将头向后仰去，中士开始陷入沉思。全面反攻…是啊…还是说…嗯…各种念头在脑海里交错翻腾。\n\n将刚刚到任的陆军司令送到这里后，高级中士独自一人等待着司令的归来，这种等待已经不知经历过多少次了。但与以往不同的是，这次等待并非发生在和平时期，而是在一场关乎国家命运的战争期间。\n\n随着第二次西俄战争的爆发，如今司令的出行频率变得越来越高。一次又一次的汇报，一次又一次的会议。只是，他不再需要在城市中和军事基地之间穿梭，而是奔波于前线和后方之间。回忆涌上心头，高级中士想起了自己作为一名普通士兵参加第一次西俄战争的那些日子，以及那场争夺国家统一的残酷战争，想起了自己的负伤和脑震荡。\n\n突然，高级中士瞥见刚刚离开总参谋部的司令正朝自己走来，他立刻将全部注意力都集中在了司令身上。这位司令是一位久经沙场的老兵，曾经参加过统一战争。而中士则是一名渴望继续留在部队服役的普通士兵，但由于负伤，他被认为已不适合继续在前线作战，差点就被迫退役。是这位司令阻止了这一切，并将他留在了自己身边，成为了他的私人司机兼保镖。\n\n“纳扎罗夫同志，我们出发吧。”司令走过来，一边说道，一边坐进了汽车的后座。\n\n“遵命！”中士简洁地答道，并将手中的烟头扔到地上，然后坐进了驾驶室。\n\n“我们去哪儿？”中士问道。\n\n“去机场。”司令回答道。汽车随即启动，朝着既定目标疾驰而去。\n\n“叶菲姆·帕夫雷奇，请问，我们真的是在全线反攻，并把德国人打得落花流水吗？”中士问道。\n\n“没错，我们已经发起了反攻，这将是我们的最后一战。要么我们彻底击溃纳粹，要么…再一次被他们碾碎。”司令回答道。"
 RUS_SWRW.1.a:0 "别无他路…前进！"
 RUS_SWRW.2.t:0 "门铃响声"
 RUS_SWRW.2.d:0 "房间里突然响起的敲门声吸引了屋子里所有人的注意力。其实准确地说，这个“所有人”，其实只是一个男孩——或者说，一名少年，外加一只猫。少年走到门前，通过猫眼望去，一个年迈的老人静静站在门外。迟疑片刻，他轻轻拉开门缝。\n\n“您好。”老人用沙哑的声音说道，“请问，柳巴温一家住在这里吗？”他补充道。\n\n“没错，这里就是。请问您是哪位？您找他们有什么事吗？”少年反问道。\n\n“不好意思，自我介绍一下。我叫彼得·叶菲莫维奇·柳巴温。”老人说道，同时习惯性地挺直了腰板，站出了一个军姿。\n\n“真巧啊，我曾祖父也叫这个名字，我的曾祖母过去经常提起他。”少年说道。\n\n“嗯…如果是这样的话，我想我或许可以给你带来一个好消息。我就是你的曾祖父。”老人说道，这突如其来的消息让少年一时不知所措。\n\n少年很快便从震惊中恢复了过来，在经过一番简短的交谈，以及对几个只有家人才能知道的问题进行核实后，他确信站在自己面前的这位老人正是自己的曾祖父，于是便将他迎进了家门。过了一会儿，曾祖父和曾孙决定坐下来喝杯茶，聊聊天。\n\n“唉，你们这房子可真够小的。”曾祖父一边说着，一边伸手去拿杯子。\n\n“只是一间普通的公寓罢了。当然，跟沙皇的宫殿是没法比的。那些富丽堂皇的宫殿，都是为沙皇准备的。”曾孙开玩笑地说道，同时自己也伸手去拿杯子。\n\n“哈哈，你说得没错。”曾祖父笑着回答道。\n\n“老实说，我从未想过自己有朝一日还能回到俄罗斯。看来我的祈祷终于得到了回应，帝国，俄罗斯帝国又回到了属于她的地方，回到了她那神圣不可侵犯的王座上。”曾祖父说道。\n\n“对了，我的孩子，你的祖母呢？你的父母呢？还有你，为什么没有去教会学校上学？”曾祖父问道，同时伸手去拿桌上的面包圈。\n“曾祖母去老朋友家做客了，妈妈还在工作。而我呢，我不在教会学校上学，我上的是公立学校，或者更准确地说，是半公立学校。而且，几个小时前就已经放学了，所以我才会回到家里写作业、做家务。至于我的父亲…父亲和祖父现在都在前线。祖父是一位高级军官，而父亲则是一名下级军官，他们正和战友们一起，在那里为了国家的荣耀浴血奋战。”曾孙回答道。"
 RUS_SWRW.2.a:0 "为了上帝，为了沙皇，为了祖国！"
 RUS_SWRW.3.t:0 "阅兵式"
 RUS_SWRW.3.d:0 "在政府大楼前的广场上，人山人海，这里早已成为了整个帝国最受瞩目的地方。成千上万的民众聚集在这里，翘首以盼，等待着阅兵式的开始。前来参加阅兵式的部队早已列队完毕，各种武器装备也已整装待发。\n\n广场上的时钟开始倒计时。当时钟的指针指向整点的那一刻，一阵洪亮的声音从阅兵指挥官所在的那辆检阅车中传了出来。\n\n“立正！向左——看！”在指挥官下达完口令后，士兵、军官以及在场的民众都注视着一辆同型号的汽车沿着广场缓缓驶来，而这辆汽车上所乘坐的，正是本次阅兵式的检阅官。\n\n在与位于广场中央的阅兵指挥官会合后，检阅官听取了关于部队集结完毕、阅兵式准备就绪的报告，随后，他便乘车沿着队列开始检阅部队。\n\n在检阅完所有部队并返回主席台后，检阅官走下汽车，登上了主席台，向在场的政府官员们汇报了阅兵式的准备情况。在接到“稍息”的命令并接受了在场官员们的祝贺后，他与其他的军方高级将领们一同落座。\n\n回到阅兵队伍前方，沙皇扫视着整齐划一的队伍、热情洋溢的民众以及应邀前来观礼的外国来宾，然后开始了自己的演讲。在长时间的演讲中，沙皇带领大家回顾了那波澜壮阔的历史，那些可歌可泣的胜利，以及那些令人扼腕叹息的失败，正是这些胜利与失败，铸就了如今这个坚不可摧的国家。当然，他也展望了俄罗斯乃至全世界的光明未来。\n\n“我们将把那些纳粹侵略者彻底赶出我们世代生活的土地，将被他们奴役的人民从水深火热中解救出来，彻底纠正历史的错误！为此，我们已经付出了、并且仍将付出巨大的代价！我们将一劳永逸地摧毁那些敌人的嚣张气焰！为了俄罗斯！乌拉！”沙皇高呼道。短暂的沉默后，人们才从这激昂的演讲中反应过来，随后，雷鸣般的“乌拉”声便响彻了整个广场，经久不息。这震耳欲聋的“乌拉”声，不仅仅来自于士兵和军官们，也来自于那些聚集在广场上，见证这一伟大时刻的普通民众和应邀前来的外国友人。"
 RUS_SWRW.3.a:0 "乌拉！"
 RUS_SWRW.4.t:0 "战争罪行，以及…"
 RUS_SWRW.4.d:0 "1974年的四月！一支俄罗斯摄制组决定对那些刚刚从德国人手中解放的村庄进行拍摄。\n\n带着各种必需品：罐头、设备，五人组成的摄制组坐上了他们的工作车，开始从莫斯科驶向被解放村庄的旅程。\n\n经过几个小时的行驶，我们的团队抵达了第一个被解放的村庄，名为“埃多沃”。还没来得及进入村庄，纪录片摄制者们在出村的路上看到了一辆被大炮摧毁的燃烧着的坦克。\n\n当摄制组驶离村庄时，摄影师继续拍摄着“战争的后果”。被摧毁和烧毁的空房子，早已停止营业的商店。空气中弥漫着令人窒息的焦虑感和压抑感。以及一种空虚的感觉，仿佛在这个村庄里剩下的只有闷烧的灰烬和对那些永远无法被遗忘的可怕事件的痛苦记忆。\n\n当我们的团队开车前往下一个解放村庄时，摄影师在途中拍摄了一个废弃的农场。许多回忆涌入了脑海，那些关于德国人在这片土地上是如何奴役和压迫俄罗斯人民，强迫他们进行“名副其实”的奴隶劳动，并以各种方式羞辱他们的不堪回首的岁月。\n\n在行驶了几个小时后，我们的摄制组抵达了下一个名为“奥泽尔斯科耶”的解放村庄。幸运的是，这个村庄更加热闹，尽管战争和战争罪行的痕迹在这里也很明显。人们不得不生活在地下室、谷仓和老鼠一起睡在冰冷的地面上，但仍然对死神不会在下一秒降临满怀希望。尽管他们也知道德国人是不会让他们和平死去的。\n\n其中一位村民向摄制组讲述了一个废弃工厂的故事，德国人在占领了该地区后，将其改造成了一个“集中营”。德国人会在村子里“闲逛”，随意抓走村民，然后把他们带到工厂。据传言，他们在那里对这些囚犯进行了惨无人道的折磨，随后，那些饱受折磨的人们会被枪毙，然后被扔进焚尸炉中焚烧。空气中弥漫着令人作呕的恶臭，即使在村子里也能闻到。\n\n在村子里又走访了一些人，并与幸存的居民交谈后，我们的摄制组前往了第三个名为“珍珠”的村庄。抵达目的地后，摄制组们简直不敢相信自己的眼睛，他们呆呆地站在原地，仿佛被石化了一般——因为眼前的景象实在是太过于震撼了，他们尽管听说过各种惨绝人寰的暴行，但眼见为实后，依然感到脊背发凉。\n\n这个村庄呢？它去哪儿了？它被从地球上彻底抹去了，永远消失了，再也不可能被重建了。大炮不长眼，它们不仅摧毁了这个定居点，还带走了无数无辜平民的生命…老人，孩子，所有人都无一例外，仅仅因为他们生活在那里。现在这里只剩下了一片被炸成陨石坑模样的土地...但这是一场战争，它毁灭了一切！"
 RUS_SWRW.4.a:0 "无尽的恐怖与恐怖的终结"
 RUS_SWRW.5.t:0 ""
 RUS_SWRW.5.d:0 ""
 RUS_SWRW.5.a:0 ""
 RUS_SWRW.6.t:0 "我们胜利了"
 RUS_SWRW.6.d:0 "没有人能够想象，一个曾经在纳粹的铁蹄下苟延残喘，几近亡国的俄罗斯，竟能挣脱内部冲突的枷锁，并以一个强大国家的姿态重新屹立于世界民族之林，甚至还领导了一场将整个欧洲从纳粹的魔爪中解放出来的伟大远征。\n\n如今，在签署了那份来之不易的和平协议多年之后，人们终于可以彻底地松一口气了。他们终于意识到，自己无需再生活在那无处不在的恐惧之中，更不用再对他人的眼色诚惶诚恐。如今，希望与幸福洋溢在每个人的脸上。\n\n谁也无法想象，当初那些看似荒诞不经的青年俄罗斯思想，不仅能够经受住时间的考验，还能够引领我们取得最终的胜利，彻底击败那令人不寒而栗的纳粹主义意识形态。“怀疑主义”早已成为过眼云烟，取而代之的，则是一种坚定的信念——正是这些人，这些曾被视为“异端”的人们，他们团结一心，众志成城，完成了看似不可能完成的使命，也实现了俄罗斯人民长久以来的夙愿。\n\n而现在，梦想终于照进了现实。宁静祥和的气氛笼罩着俄罗斯帝国那广袤无垠的土地。人们纷纷走上街头，尽情地享受着这来之不易的和平与安宁，他们的脸上洋溢着幸福的笑容，尽管偶尔也会有泪水划过脸颊，但那并非是悲伤的泪水，而是对过去苦难岁月的一种告慰。\n\n但这并不意味着他们正在试图忘记那段不堪回首的往事。我们必须永远铭记那些在伟大卫国战争中、在两次西俄战争中、以及在漫长的被占领时期中牺牲的英烈们。这不仅仅是为了表达我们对他们的崇敬之情，更是我们对子孙后代肩负的一项神圣职责。我们有责任让我们的后代永远铭记这段历史，让他们明白，他们的幸福生活是建立在无数先烈的牺牲之上的。"
 RUS_SWRW.6.a:0 "伟大的胜利，将永远铭刻在人民的心中。"
 RUS_SWRW_mech.23.t:0 "归来"
 RUS_SWRW_mech.23.d:0 "一列装甲列车沿着新近修复的铁轨隆隆驶来，车上搭载的正是阿列克谢二世皇帝。在其中的一节车厢中，特意为他布置了一间小型的办公室，此刻，沙皇正在那里仔细审阅着关于莫斯科维恩地区状况的文件。他无法亲眼目睹车窗外那满目疮痍的景象：被战火焚毁的田野、化为废墟的工厂，以及无数痛失亲人的家庭，他们的父亲和儿子们早已奔赴前线，为了解放祖国而浴血奋战。\n\n沙皇努力让自己保持冷静的头脑，他希望能够尽快制定出一个切实可行的方案，来终结这一切苦难。他已经在脑海中盘算着将工厂从东部地区迁往莫斯科维恩的可能性。一丝苦涩的笑容掠过了他的嘴角，他意识到，这可真是充满了讽刺意味——竟然要将工厂从“落后”的西伯利亚迁往“文明”的西部。\n\n此刻，作为未来帝国首都的莫斯科更像是一片人迹罕至的荒原：无数的游击队在城中与敌人周旋，普通民众的生活早已难以为继，城市的绝大部分地区都已化为一片废墟。但他必须纠正这一切，这既是一位皇帝对自己的臣民应尽的义务，也是一个人对全人类应尽的义务。\n\n几小时后，他终于抵达了莫斯科，在库尔斯克火车站下了车。然而，车站早已在之前的战斗中严重受损，成了一片废墟。\n\n当阿列克谢抵达莫斯科时，他期待着看到什么呢？他还能看到记忆中那个熟悉的城市吗？那个在他临阵脱逃前还在为了生存而苦苦挣扎的城市？那个曾经被视为“新俄罗斯”摇篮的城市？但当他亲眼目睹这一切时，心中却并未感到丝毫惊讶。毕竟，当初在他逃离这里时，所有人都劝他不要回来，因为这里早已沦为了人间地狱。昔日熙熙攘攘的街道如今早已空无一人，取而代之的则是全副武装的士兵，只有在极少数情况下，你才能看到一些仍然留守在这座城市中的平民。他走上前来，登上了早已等候在一旁的汽车，踏上了前往克里姆林宫的旅程。\n\n被德国人弃之不顾的文化古迹遭到了严重的破坏。代替那些曾经鳞次栉比的高楼大厦的，则是破败不堪的临时建筑。这一切都压得他喘不过气来，他多么希望这一切都不曾发生过啊。但他也很清楚，他们曾在莫斯科沦陷前夕经历了怎样的殊死搏斗，更糟糕的是，这样的情况竟然发生了两次。现在，这座伟大的城市，它悠久的历史，它的昔日辉煌，这一切都已经一去不复返了。\n\n汽车驶入了红场，那里到处都是各种各样的模型和防空武器，这是为了保护城市的中心区域免遭敌机的轰炸。在曾经的米宁和波扎尔斯基纪念碑的基座上，如今却空空如也，上面早已布满了青苔。凝视着眼前这空旷的底座，阿列克谢开始意识到这历史转折点的重大意义。俄罗斯人再次将侵略者赶出了自己的家园。浴火重生的俄罗斯必将横扫一切敌人，并将他们赶回自己的老巢。"
 RUS_SWRW_mech.23.a:0 "而这一次，我们将彻底终结一切。"
 RUS_SWRW_mech.24.t:0 "归来"
 RUS_SWRW_mech.24.d:0 "漫长、血腥而又艰苦卓绝的莫斯科保卫战终于结束了。许多俄罗斯的英雄儿女为了这座曾经伟大的城市献出了自己宝贵的生命。在总参谋部中，人们往往很难真切地体会到当前局势究竟发生了怎样翻天覆地的变化。在冰冷的报告中，那些伤亡数字的背后，隐藏着的却是成千上万，甚至数百万人的命运，而这些人的命运，早已随着这场战役的结果而彻底改变。俄军终于将德意志这头猛兽赶出了莫斯科，从它那早已腐朽不堪的魔爪中夺回了这座古老的城市。这也为接下来的全面反攻注入了一剂强心针。\n\n来自全国各地的爱国者们纷纷响应号召，投身到这场伟大的卫国战争之中。他们积极响应着一项宏伟的计划——在战争期间重建首都，将昔日的废墟打造成一座坚不可摧的堡垒，这既能保护我们免遭敌人的侵扰，也能为那些在前线浴血奋战的将士们提供一个坚实的后盾。沿着那些早已被人们遗忘的铁路线，每天都有满载着补给、建筑材料以及那些从莫斯科维恩的苦难中被解救出来的人民的列车呼啸驶来。每天都有数百人因为躲避战火而逃往东方，但与此同时，也有成千上万的人们选择向西挺进，推动着前线不断向西推进。\n\n为了不错过这具有历史意义的伟大时刻，当局布置了几十台摄像机，记录下了这即将到来的历史性瞬间。一场象征着我们为取得最终胜利做好准备的阅兵仪式即将在红场举行。此刻，人们正为这一盛事进行着紧锣密鼓的准备工作。为了迎接前来视察的将军们，人们纷纷涌入了那些刚刚完成修缮工作的酒店中，而与此同时，克里姆林宫也在为即将到来的典礼进行着最后的准备。工人们夜以继日地工作着，试图用宣传海报和各种装饰物来掩盖城市所遭受的战争创伤。而与此同时，沙皇别洛泽尔斯基也在冥思苦想着该如何向他的人民发表演讲。\n\n人民——这些展现了坚韧不拔的意志和强大力量的人们，需要一场盛大的庆祝，也需要他们的领袖向他们表达最诚挚的感谢，感谢他们为这场战争所付出的一切。但遗憾的是，并非所有的人都能亲眼见证这场阅兵，许多人只能通过电台来收听这激动人心的时刻。他们将听到沙皇的讲话，而他们也将永远铭记…"
 RUS_SWRW_mech.24.a:0 "而这一次，我们将彻底终结一切。"
 SWRW_FEnegotiations_support_prorus_rebels:0 "支持亲俄起义军"
 SWRW_FEnegotiations_support_prorus_rebels_desc:0 "尽管我们正在协助日本方面镇压外满地区的游击队，但我们仍然可以“挑选”出一些能够为我们所用的团体，并加以利用。"
 SWRW_FEnegotiations_ask_for_ofn_support:0 "向自由国家组织寻求帮助"
 SWRW_FEnegotiations_ask_for_ofn_support_desc:0 "自由国家组织，尤其是美国对共荣圈颇有微词。因此，我们可以尝试向他们寻求外交支持。"
 SWRW_FEnegotiations_rely_on_consistency:0 "强调关系的稳定性"
 SWRW_FEnegotiations_rely_on_consistency_desc:0 "我们可以回顾一下自1964年以来我们两国外交关系的发展历程。这有助于我们提醒日本人，我们两国之间的合作关系源远流长。"
 SWRW_FEnegotiations_sea_excercises:0 "鄂霍次克海演习"
 SWRW_FEnegotiations_visit_showa:0 "觐见天皇"
 SWRW_FEnegotiations_visit_showa_desc:0 "昭和天皇，即裕仁天皇，名义上是整个日本帝国的最高统治者。作为俄罗斯的皇帝和统治者，阿列克谢二世应当出访日本，与天皇进行一次私人会晤。"
 POLITICS_SERGEY_BELOZERSKI_VICTORY_DESC:0 "谢尔盖·别洛泽尔斯基，沙皇将军，他历经磨难，才最终向世人证明，他无愧于俄罗斯人民沙皇这一神圣的称号。\n\n谢尔盖·别洛泽尔斯基的戎马生涯始于对旧俄罗斯帝国的效忠，那时，这个国家早已是内忧外患，动荡不安。在内战期间，他被迫流亡国外，并最终在美国定居，随后在那里开始了新的生活。\n\n然而，谢尔盖·别洛泽尔斯基始终心系祖国，并竭尽所能地帮助那些被迫离开苏联的俄罗斯难民们。苏联在伟大的卫国战争中的惨败促使谢尔盖下定决心返回祖国，他坚信，在俄罗斯最为艰难的时刻，自己有义务与祖国人民同甘共苦，共渡难关。\n\n在获得了青年俄罗斯联盟的支持后，谢尔盖·别洛泽尔斯基在别列兹尼基找到了自己的位置，无论是在政治领域，还是在普通民众之中，他的威望都与日俱增。这最终促使谢尔盖·别洛泽尔斯基被拥立为沙皇。\n\n在随后的几年中，别洛泽尔斯基不仅巩固了自己的权力，还完成了统一俄罗斯的伟业。最终，这位新沙皇不仅团结了整个民族，还向大日耳曼国发起了反攻，打响了那场关乎他的国家，乃至整个世界命运的决战，并最终以俄罗斯帝国的辉煌胜利而告终。\n\n从现在起，谢尔盖·别洛泽尔斯基将以一位将一盘散沙的祖国重新统一的伟大统治者的身份被载入史册。“沙皇将军”将成为“胜利者沙皇”。人民将永远铭记谢尔盖·别洛泽尔斯基的丰功伟绩，而他，也已做好了为国家的未来谱写更加辉煌篇章的准备。"
 RUS_SWRW.12.t:0 "没收"
 RUS_SWRW.12.d:0 "“你们这是在做什么？这都是我的！是我用自己的双手挣来的，我有权决定该如何处置它们！”瓦西里·帕夫洛维奇声嘶力竭地喊道，而那些士兵们却仍在不停地将他家中的贵重物品悉数搬走。或许，有人出卖了他。早知如此，他本应该在一切都变得不可收拾之前就带着家当逃离这个鬼地方的！但现在，说什么都晚了。\n\n“喂，把那个放下…”当一名士兵面无表情地将一幅名画从他家中搬走时，瓦西里试图上前阻止，但无奈势单力薄，寡不敌众。他被一名士兵用枪托狠狠地击倒在地，头上传来一阵剧痛。\n\n如今，他只能无助地瘫倒在泥泞之中，眼睁睁地看着自己的过去和未来都被这场战争彻底吞噬。他的那些价值连城的油画，以及他原本对新俄罗斯的一切憧憬，如今都已化为了泡影，留下的，只有无尽的空虚。由于极度的绝望，这名男子无力地瘫倒在了草地上，眼泪顺着他那饱经风霜的脸颊无声地滑落。"
 RUS_SWRW.12.a:0 ""
 RUS_SWRW.13.t:0 "记忆"
 RUS_SWRW.13.d:0 "罗莎·波扎尔斯卡娅历经磨难，许多男人都难以承受她所经历的种种痛苦。即便在今天，在这场战争似乎永无止境的至暗时刻，她仍然选择继续生活下去，因为除了继续生活，她别无选择。而现在，她正在打扫着自己的房间。\n\n在那里，挂着她曾祖父的军装，这位帝国军官的军装被罗莎的母亲在那些与红色分子的斗争中完好的保存了下来，以免这最后的记忆也随风消散。而在这里，米哈伊尔·波扎尔斯基，一名在执行飞行任务时牺牲的飞行员的军帽。说来也怪，人们总说，用“空中冲撞”战术与敌人同归于尽是英雄的象征。\n\n今天，罗莎那本就令人心痛的“收藏品”中又增添了一件新的物件。一封寄给维塔利·波扎尔斯基的讣告。她的儿子，也像他的先辈们一样，为了祖国英勇捐躯了。他究竟是如何牺牲的？她永远也无从知晓。老实说，她已经不在乎这些细枝末节了。如今，她对什么都不在乎了。"
 RUS_SWRW.13.a:0 "后来再也没人见过罗莎了…"
