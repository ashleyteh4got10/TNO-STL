 RUS_SWRW.8.t:0 "难民潮"
 RUS_SWRW.8.d:0 "随着我们的军队不断深入那些被占领的地区，越来越多的俄罗斯同胞也选择背井离乡，向着我们控制的区域迁徙，远离那些仍旧战火纷飞的前线地带。一方面，这些难民能为我们的战士提供关于当地地形的宝贵情报，协助我们建立战后地区的管理秩序，还能为后方的生产提供大量的劳动力，他们的这些行动无疑加快了我们战胜德国法西斯侵略者的步伐。但另一方面，难民数量的激增也给我们带来了诸多的麻烦，失控的难民潮已经严重影响了我们的补给线，同时也为我们的反间谍工作带来了不小的困难。\n\n为了尽可能地降低这些不利因素，我们必须加强对来自那些曾经被德国占领地区的难民的管控。许多人可能认为这是不人道的，但为了确保前线的稳步推进，以及后方的长治久安，我们也只能出此下策了。"
 RUS_SWRW.8.a:0 "他们会将我们当成解放者吗？"
 RUS_SWRW.9.t:0 "高尔基的隔离区"
 RUS_SWRW.9.d:0 "根据从高尔基1、4、6号隔离区发来的报告称，这些在出现了不明病毒感染病例后第一时间就被隔离起来的区域如今已经彻底陷入了恐慌。根据那些被感染者的说法，几乎所有人都在出现了身体不适后的几天内接种了一款由德国医生研制的疫苗，而这款疫苗据说是用来预防一种“新型病毒”的。\n\n根据军事情报部门的报告，在专员辖区政权垮台后，当地党卫军军官的权力得到了极大的膨胀。考虑到党卫军在占领区的一贯作风，我们可以断定，这种病毒的出现和传播都与他们脱不了干系。"
 RUS_SWRW.9.a:0 "血债血偿！"
 RUS_SWRW.11.t:0 "“圣战”之地"
 RUS_SWRW.11.d:0 "从被解放的高加索地区传来的报告一天比一天令人担忧。起初，在解放了库班和克拉斯诺达尔后，俄军还受到了当地民众的热烈欢迎，几乎没有任何成规模的抵抗势力出现。但随着战线逐渐深入到达吉斯坦和车臣地区，情况发生了翻天覆地的变化。\n\n绝大多数高加索地区的民族，除了少数的几个特例之外，几乎都将我们的到来视作对其正常生活方式的粗暴干涉，这也导致当地民众对我们的到来没有表示任何的支持。更令人不安的是，那些躲藏在深山老林中的恐怖分子活动日益猖獗，他们不仅袭击我们的补给线，切断我们的交通，还向国防军和党卫军提供大量的情报。如果对此坐视不管，这些地区迟早会彻底失控，而我们也终将被这些当地的宗教极端分子和纳粹合作者们赶出去。"
 RUS_SWRW.11.a:0 "没有了德国人的支持，他们将一事无成。前进，向着西方！"
