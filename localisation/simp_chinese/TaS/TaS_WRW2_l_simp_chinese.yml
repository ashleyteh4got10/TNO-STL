 GC_FarEasternRevolt:0 "远东起义"
 MAR_far_eastern_revolt_category_desc:0 "我军重塑俄罗斯统一的壮举震撼了世界，让这个俄罗斯这个一度被国际舞台遗忘的名字重新熠熠生辉。\n\n曾经心灰意冷的游击队员们，如今在我们广袤祖国被侵占的土地上重燃斗志。由谢尔盖·扎伊金率领的远东游击队伍主动与我们建立了联系。他们虽已英勇抗击日本占领军多年，但因缺乏资源一直无法公开宣战。幸运的是，随着一个他们衷心拥护的统一合法政府的出现，游击队员们终于决定挺身而出，与侵略者展开正面交锋。\n\n我们的首要职责就是为这些勇敢的抵抗战士提供全方位的支持，包括武器补给以及在外交层面上的保护。\n\n是时候行动起来了。"
 JAP_far_eastern_revolt_category_desc:0 "如果你厌倦了俄罗斯人只能在“浦塩”争取一点点权利的话，你会支持的。"
