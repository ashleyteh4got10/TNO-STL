 MCW_nogerms_tt:0 "§Y早在二次西俄战争期间，大日耳曼国就将莫斯科维恩的德意志人撤走了。因此，我们对此无须担心。§!"
 MBP_baltic_natmap_tt:0 "§Y波罗的海地区的德意志人将被迁往德国，而普斯科夫和诺夫哥罗德的波罗的海的定居者将被遣返回故土。§!"
 MAR_territorial_fate.11.t:0 "芬兰的命运"
 MAR_territorial_fate.11.d:0 "战争终于迎来了尾声。经过旷日持久的战斗，俄罗斯军队彻底击败了芬兰军队，完全占领了这个北欧国家。芬兰政府签署了投降书，这标志着俄罗斯在这场冲突中取得了最终的胜利。现在，我们必须决定芬兰的未来。\n\n在激烈的讨论中，各种各样的提案被摆在了桌面上，我们可以从中选择一个，来决定芬兰未来的发展方向以及它与俄罗斯帝国之间的关系。\n\n第一个提案是：在芬兰建立一个傀儡政府，让这个国家保持名义上的“独立”，而俄罗斯将会成为他们的“保护国”，以此来换取他们的忠诚以及对来自帝国命令的绝对服从。\n\n第二个提案则着眼于历史。曾经的芬兰大公国已经充分证明，对于一些主要的民族来说，给予他们广泛的自治权是完全可行的。维持芬兰的自治地位将可以避免大量因民族自决问题而引发的冲突。\n\n第三个，也是最后一个提案，是彻底吞并芬兰。尽管如此一来，俄罗斯将能够直接控制该地区，但将芬兰强行并入俄罗斯将会不可避免地引发大量的冲突和流血事件，这些冲突都将源于两个民族之间不可调和的矛盾。"
 MAR_territorial_fate.11.a:0 "建立一个对我们友好的政权。"
 MAR_territorial_fate.11.b:0 "让我们回到过去，回到芬兰大公国时代。"
 MAR_territorial_fate.11.c:0 "芬兰将成为俄罗斯的一部分。"
 MAR_territorial_fate.12.t:0 "海峡的命运"
 MAR_territorial_fate.12.d:0 "俄罗斯人数个世纪以来梦寐以求的目标终于实现了。因巴统的归属问题而爆发的俄土战争以土耳其军队的彻底溃败而告终，曾经属于土耳其的海峡地区也已被俄罗斯军队所控制。现在，是时候做出最后一个，也是最重要的一个决定了，而这将对该地区的未来产生深远的影响。\n\n有人提议将海峡归还给土耳其。但作为交换，俄罗斯将获得在土耳其诸多领域进行干预的权利，这实际上将会使土耳其沦为俄罗斯的附庸国。\n\n第二个选项是直接吞并，将被占领土彻底并入俄罗斯帝国的版图，一劳永逸地解决关于海峡控制权的一切争端。\n\n一个出人意料的提议是建立一个独立自主的国家，它不会受到任何外部势力的控制，从而为所有国家创造公平的竞争环境。\n\n最后一个选项则是为了平衡上述各种提议而提出的，即建立一个自治区，这样既可以避免直接吞并所带来的各种麻烦，又可以避免像建立一个独立国家那样所带来的种种风险。"
 MAR_territorial_fate.12.a:0 "将海峡归还给土耳其，以换取特权。"
 MAR_territorial_fate.12.e:0 "海峡现在彻底归俄罗斯所有了。"
 MAR_territorial_fate.12.b:0 "我们将建立一个独立的国家。"
 MAR_territorial_fate.12.c:0 "建立一个新的自治区。"
 MAR_2WRW_world_news.41.t:0 "[Get_newspaper_header]德国撤离伏尔加德意志人"
 MAR_2WRW_world_news.41.d:0 "随着第二次西俄战争的爆发，生活在莫斯科专员辖区的德意志定居者们的处境变得岌岌可危。由于生活在前线附近，许多定居者开始自发地逃离他们世代居住的家园。\n\n为防止出现大规模恐慌，东方专员辖区发布了一项关于临时撤离伏尔加德意志人的命令，旨在规范和简化这些距离前线最近的德意志定居者的撤离工作。然而，命令中含糊不清的措辞和各种无法兑现的承诺却弄巧成拙。\n\n在该命令发布后，恐慌情绪不仅没有得到缓解，反而进一步加剧，最终演变成了一场大规模的逃亡。随着俄军在前线的节节推进，柏林方面关于撤离只是临时措施以及前线局势稳定的说法也变得越来越荒谬可笑。"
 MAR_2WRW_world_news.41.a:0 "德意志人离开了不属于他们的家园。"
 MAR_2WRW_world_news.42.t:0 "[Get_newspaper_header]柯尼斯堡进入全面隔离状态"
 MAR_2WRW_world_news.42.d:0 "今日，东普鲁士宣布进入紧急状态并实施全面隔离。根据当地党组织的官方说法，实施隔离的原因是一种新型的麻疹疫情的爆发。然而，根据一些非官方信源的消息，这场疫情似乎是由一种变异的病毒性肺炎引起的。\n\n柯尼斯堡已经实行了宵禁，街道上也在进行着持续的消毒工作。此外，有报告称，由于物资供应中断，商店里的谷物和卫生纸等生活必需品已经脱销。关于此次隔离的严重性，甚至还有一些关于未经审判就处决违反隔离规定者的传言。\n\n或许，这次疫情的爆发与发生在下诺夫哥罗德附近的俄罗斯难民营中的那场神秘的瘟疫，以及德国人试图对进攻的俄军使用生物武器脱不了干系。OFN和共荣圈都对疫情进一步蔓延的风险表示担忧。"
 MAR_2WRW_world_news.42.a:0 "为他们的健康祈祷。"
 MAR_2WRW_world_news.42.b:0 "德国人这是自食其果？"
 MAR_2WRW_world_news.43.t:0 "[Get_newspaper_header]黑海石油泄漏"
 MAR_2WRW_world_news.43.d:0 "据报道，由于高加索地区战事升级，大量用于运输石油产品的油轮和火车遭到破坏。这一事件不仅造成了人员伤亡，还引发了一场大规模的生态灾难。数百万吨原油和燃油泄漏到黑海海域，污染了大片海岸线，导致数以万计的海洋生物死亡。对黑海地区生态和经济造成的破坏进行评估后得出结论：想要彻底消除这场灾难的负面影响，需要投入巨量的资源和漫长的时间。"
 MAR_2WRW_world_news.43.a:0 "黑金之殇。"
 MAR_2WRW_world_news.44.t:0 "[Get_newspaper_header]第二次俄芬战争"
 MAR_2WRW_world_news.44.d:0 "根据各大国际媒体的报道，俄罗斯与芬兰之间那场灾难性的谈判最终以一场边境冲突而告终，而双方都指责是对方率先挑起了冲突。目前，由于双方在边境地区都部署了大量的军队，已经无法确定究竟是哪一方制造了这起冲突。"
 MAR_2WRW_world_news.44.a:0 "天佑勇士"
 MAR_2WRW_world_news.45.t:0 "[Get_newspaper_header]巴统危机"
 MAR_2WRW_world_news.45.d:0 "根据相关人士透露，俄罗斯和土耳其之间的边境地区再次爆发了激烈的军事冲突。据称，俄罗斯要求土耳其归还非法占领的巴统领土，但土耳其政府最初以维护当地居民的合法权益为由断然拒绝了这一要求。然而，在经过了进一步的协商后，土耳其却改变了态度，同意将巴统归还给俄罗斯。而他们态度转变的原因至今仍是一个谜。"
 MAR_2WRW_world_news.45.a:0 "真令人难以置信。"
 MAR_2WRW_world_news.46.t:0 "[Get_newspaper_header]俄土战争"
 MAR_2WRW_world_news.46.d:0 "各种新闻媒体都在争相报道又一场冲突的爆发。此前，俄罗斯曾向土耳其发出照会，要求其“和平”归还巴统地区，在遭到土耳其政府的拒绝后，双方举行了会谈，但在会谈中，双方各执一词，未能达成任何协议。随后，一场边境冲突爆发，并迅速升级为一场全面战争。"
 MAR_2WRW_world_news.46.a:0 "帝国的野心"
 MAR_2WRW_world_news.47.t:0 "[Get_newspaper_header]俄罗战争"
 MAR_2WRW_world_news.47.d:0 "危机仍在席卷整个欧洲。根据最新消息，由于俄罗斯和罗马尼亚之间一系列无法调和的矛盾，两国之间爆发了军事冲突。根据官方公布的消息，冲突爆发的原因是罗马尼亚政府拒绝归还俄罗斯方面认为被其非法占领的比萨拉比亚。"
 MAR_2WRW_world_news.47.a:0 "北境巨熊在行动"
 MAR_2WRW_world_news.48.t:0 "[Get_newspaper_header]俄罗斯的南极科考站"
 MAR_2WRW_world_news.48.d:0 "根据俄罗斯方面发布的消息，作为从新施瓦本地区紧急撤离德国科考队的行动的一部分，俄罗斯在其领土上建立起了一个科考站。由于物资短缺，全体科考队员已无法继续留在南极大陆。不过，随着俄罗斯船只的抵达，德国科学家们被迅速疏散并送回了祖国。与此同时，俄罗斯也在曾经的德军基地旧址上建立了自己的科考站，他们充分利用了德国人撤离时所遗留下来的设备、技术和研究成果，为俄罗斯在南极地区的活动奠定了坚实的基础。"
 MAR_2WRW_world_news.48.a:0 "昔日选手重返世界舞台"
 MAR_2WRW_world_news.49.t:0 "[Get_newspaper_header]俄罗斯核武器研发完成"
 MAR_2WRW_world_news.49.d:0 "就在最近，多地的地震台都监测到了在塞米巴拉金斯克地区发生的地下震动。起初，人们对于该地区地震活动的原因众说纷纭，莫衷一是。\n\n然而今天，世界终于得到了这个问题的答案。俄罗斯当局宣布，他们已经成功完成了核武器试验。据悉，俄罗斯的核武器研发计划早在1969年就已启动，但很少有人预料到它竟然会如此迅速地取得成功。\n\n鉴于统一后的俄罗斯和大日耳曼国之间的紧张关系日益加剧，俄罗斯研制核武器的举动似乎只是在为即将到来的冲突火上浇油。但愿在未来，交战双方都不要按下那个让一切化为灰烬的按钮。"
 MAR_2WRW_world_news.49.a:0 "核俱乐部又多了一名新成员"
 MAR_2WRW_world_news.49.b:0 "颤抖吧，德国佬！"
 MAR_2WRW_world_news.50.t:0 "[Get_newspaper_header]第二次西俄罗斯战争爆发"
 MAR_2WRW_world_news.50.d:0 "大日耳曼国与俄罗斯帝国之间的对抗正式升级为一场真枪实弹的武装冲突。德国政府向其国民发表讲话，宣布为了避免与东方的敌人再度爆发冲突，必须对俄罗斯的阵地发动先发制人的打击。数周以来，俄罗斯军队一直在两国边境地区集结，并举行了大规模的军事演习；随后，德国军队越过了莫斯科专员辖区的边界，开始全面进攻。作为回应，俄罗斯代表指责德国当局奉行侵略政策，他们只是在为对俄宣战寻找一个借口。双方都已做好了战斗准备，并表示将会动用一切手段来实现各自的目标。"
 MAR_2WRW_world_news.50.a:0 "世界屏息凝神，静待结局。"
 MAR_2WRW_world_news.50.b:0 "世界屏息凝神，静待结局。"
 MAR_2WRW_world_news.51.t:0 "[Get_newspaper_header]俄罗斯启动“格里博耶多夫”行动"
 MAR_2WRW_world_news.51.d:0 "伊朗内战的结束，仅仅是另一场战争的开始！在第二次西俄战争中击败德国后，莫斯科发表声明，宣称“绝不容许德国在中东地区继续保持其影响力”，并宣布启动代号为“格里博耶多夫”的军事行动。俄罗斯军队随即越过伊朗沙阿国的边境，并占领了一些边境定居点。\n\n对此，伊朗皇后法拉赫·巴列维对俄罗斯“野蛮的圣战者”行径提出了尖锐的批评。在伊朗控制的地区，已经启动了一项强化动员计划，正如伊朗国防部长所宣称的那样，伊朗的军事工业体系也已“转入战时轨道”。俄罗斯这种“简单粗暴”的行动得到了美国和日本方面“谨慎的赞赏”，但截至目前，他们还未采取任何实质性的行动。而德国方面则对这场冲突三缄其口，未发表任何声明，这在伊朗的统治阶层中引发了强烈的不安和不满。"
 MAR_2WRW_world_news.51.a:0 "没人能让伊朗屈服。"
