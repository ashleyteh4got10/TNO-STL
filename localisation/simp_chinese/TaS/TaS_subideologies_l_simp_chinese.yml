 despotism_mladorossi_autocracy_subtype:0 "青年俄罗斯专制主义"
 despotism_mladorossi_autocracy_subtype_desc:0 "俄国多年的无政府状态，让青年俄罗斯联盟的意识形态经历了不同寻常的蜕变。持续不稳定、威胁遍地以及数不胜数的极端分子，催生出了青年俄罗斯专制主义。\n\n沙皇谢尔盖·别洛泽尔斯基制定的制度极大改变了原初的意识形态。如今，更多权力集中于沙皇之手，首相沦为顾问，而非不容置疑的真理。唯沙皇所言即真理。\n\n意识形态的另一大变化是更加强调军事化和军队。也许这些蜕变违背了创始人对意识形态的看法，但也无可奈何了。强大正直的新俄罗斯帝国将喊出口号，“沙皇和苏维埃！”，无人能挡。"
 paternalism_mladorossi_idea_subtype:0 "青年俄罗斯主义"
 paternalism_mladorossi_idea_subtype_desc:0 "青年俄罗斯主义堪称意识形态领域的一朵奇葩。二十世纪上半叶，亚历山大·卡津别克缔造了他那融合诸子百家的独特学说。这一全新的政治体系实属罕见，因为它将法西斯主义与共产主义的理念巧妙地熔于一炉。\n\n最终，一种崭新的国家治理模式应运而生。它以带有骑士团色彩的政党为核心，其宗旨在于启迪民智；同时拥立一位不代表任何党派的沙皇作为国家的最高领袖。这种体制的基石是超脱于党派之外的“苏维埃”，它是民众与地方及中央的沙皇代表沟通的桥梁。\n\n归根结底，青年俄罗斯联盟代表的是一种特立独行的意识形态。它将领袖集权与君主制推向了与极权主义相对立的境地。而精神上的手足情谊与铁腕般的民族纪律并驾齐驱，为个体的创造性自由提供了保障。即便这运动本身良莠不齐，其追随者内部对于如何发展该主义思想也各执一词。但其一个理念与方针始终坚定不移——“沙皇与苏维埃”。"
 fascism_mladosocialism_subtype:0 "青年俄罗斯社会主义"
 fascism_mladosocialism_subtype_desc:0 "弗拉基米尔·吉尔领导的青年俄罗斯社会主义者认为，青年俄罗斯联盟的君主主义偏见已经过时，只会给俄国带来麻烦和苦难。青年俄罗斯联盟没有能够建立他们梦寐以求的人民沙皇，他们败在了沙皇弗拉基米尔三世的手中。然而，他们都表现出了自己的无能，完全脱离了现实。没有什么可以说君主制没有过时，甚至没有用处。\n\n同时，布哈林的社会主义对俄罗斯的危害更大，由于他对少数民族的软弱和对地区控制的薄弱，苏联在经济和建立国家防御能力方面没有取得任何成就，这导致了俄罗斯四分五裂成五十多个部分的可悲后果。纯粹的社会主义是有害的，但其个别思想对俄罗斯是有益的。\n\n弗拉基米尔·吉尔坚信，只有第三条道路才适合俄罗斯的发展，因为祖国别无选择。吉尔结合法西斯主义基础和社会主义理想的一些细节，创造了一种新的意识形态： 青年俄罗斯社会主义完全抛弃了君主制，支持法西斯主义和俄罗斯的社会发展。只有为团结一致的俄罗斯人民带来最大福祉的坚定之手，才能让他们经受住不久的将来可能降临俄罗斯的新挑战。"
 socialist_social_monarchist_subtype:0 "君主社会主义"
 socialist_social_monarchist_subtype_desc:0 "青年俄罗斯联盟的意识形态本身与苏联的治国原则有很多共同之处，因为该意识形态的目标是建立一个人民的王国，拥有一个公平的、真正的人民之君主。然而，社会主义思想被强化的情况也屡见不鲜，这最终导致了左翼社会主义-君主主义思潮的产生。他们以计划经济、人民委员会和强大的意识形态为基础，就像布哈林的苏联那样，试图建立一个完全以人民为基础的君主制政府，就像苏联领导人在旧时代所做的那样。\n\n沙皇阿列克谢二世是由人民选举产生的，他作为一个独创的社会主义者，提出了属于“君主社会主义”概念的“青年俄罗斯主义”。他的理念相当独特，不同于亚历山大·卡津别克的正统思想，因此带有左倾倾向的君主社会主义意识形态可以独树一帜地生存下去。"
 socialist_social_monarchist_but_worse_subtype:0 "君主社会主义"
 socialist_social_monarchist_but_worse_subtype_desc:0 "有许多不同寻常的意识形态共生体于历史长河涌现，但其中最有趣的或许是君主社会主义。它是俄罗斯无政府状态最不寻常的产物之一，以“沙皇和苏维埃”为意识形态基础。在这里，市场与苏维埃美学以及对人人平等的美好未来向往融为一体。君主端坐宫殿，数以百计的大小苏维埃参与治理国家。\n\n不出所料，许多社会主义政权称君主社会主义是君主制的粗暴复辟，是反动派的又一变种，甚至视作右派诋毁左翼运动的独特方式。但只要人民站在沙皇背后，只要国家团结一致向前迈进，就没有必要理会嫉妒者的风言俗语。也许这不是共产主义经典所写的内容，但实验永无止境。为了沙皇和苏维埃！"
