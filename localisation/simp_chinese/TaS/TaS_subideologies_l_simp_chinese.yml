 socialist_neo_narodism_subtype:0 "新民粹主义"
 socialist_neo_narodism_subtype_desc:0 "在左翼社会革命党人组织下，沃尔库塔劳改营的囚犯们揭竿而起，新民粹主义思潮也随之悄然兴起。\n\n新民粹主义的核心理念，是通过将民主原则与生产资料集体所有制相结合，来构建一个社会主义社会。左翼社会革命党人的终极目标，是建立一个公平公正、人人平等的社会，在这个社会中，每一个公民都拥有塑造自身未来的能力。\n\n共和国的政治生活是通过按地域选举产生的苏维埃体系来组织的，这保证了权力的分散性，兼顾了不同地区和群体的利益。经济模式也与之类似：共和国的所有土地均为全民所有，并通过人民自治机关加以利用；工业则由各个劳动集体所组成的联合会来管理；消费合作社也联合成为一个整体。经济生活则通过这两种结构的相互作用来组织，以确保资源的公平分配。\n\n批评者们在伯朝拉战争刚结束时，便预言了左翼社会革命党人的失败，他们断言，这些无政府主义的试验迟早会将俄罗斯拖入万劫不复的深渊。然而令人意想不到的是，在鲍里斯·卡姆科夫的领导下，这个国家不仅屹立不倒，反而不断打破传统的国家结构模式，朝着真正的乌托邦大步迈进。"
