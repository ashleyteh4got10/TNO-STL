 despotism_securitocracy_subtype:0 "安保国家"
 despotism_securitocracy_subtype_desc:0 "与其他国家一样，苏联也有自己的特务机构，即内务人民委员会（简称NKVD），负责搜捕持不同政见者。\n\n然而，苏联解体后，西俄罗斯革命阵线也随之解体，沃克鲁金斯基劳改营的NKVD分遣队在瓦西里·布洛欣的领导下，在沃尔库塔的领土上建立了自己的国家。与国家一同出现的还有独特的意识形态——安保国家。\n\n这种意识形态的主要原则是通过地方NKVD小队严格维护国内安全。稍有违反现行法律的行为，要么被处死，要么被送进劳改营。此外，根据政府的意见，无论是沃尔库塔的普通人还是违反法律的NKVD军官都属于镇压范围。\n\n以反共媒体为代表的诋毁者称沃尔库塔政权是警察之国，是军事独裁的翻版。他们向此政权抛出一个大问题：存在于沃尔库塔的模式能在全国范围运作吗？打着合法与马列教义幌子镇压本国人民的法律专政能够长久吗？历史已经告诉我们，建立在人民鲜血之上的政权迟早会以流血革命的方式告终。"
 socialist_antarctic_administration_subtype:0 "南极管理局"
 socialist_antarctic_administration_subtype_desc:0 "五十年代的南极争夺战后，南极大陆被分为数大相互竞争的事务局。智利与阿根廷政府的边界纠纷最终演变为要求OFN介入的国际事件。为了不被自由势力抢先，民族社会主义也在纳粹控制下的新施瓦本扬起高傲的头颅，准备推行纯粹的、极端的、雅利安种族主义色彩的殖民政策。最后，日本人也来了，无视了一切所谓合法性的伪装，武力夺取了一片南极洲的领域。\n\n虽然每个事务局都有各自的意识形态信仰，但辽阔荒芜之地的严酷生活与极少数的人口，使各政权的组织方式基本趋同，归于某种军事化管理之下。其中有日本那样的直接控制，也有OFN南极洲事务局那样，与民间伙伴合作的形式。\n\n在这样的层次结构下，数以千计的人们在冰冷的空气与寒风中劳作，证明他们在放逐者之地的存在价值。每个列强都极力从他们那点冰块中榨出点价值来，却被许多观察家讥笑为沉没成本谬误的终极案例：只要强权依然存在，其他人就不能松手，无论他们还要在上面损失多少物资、金钱和人力。然而，想让南极探险有利可图，那得是何等的运气……"