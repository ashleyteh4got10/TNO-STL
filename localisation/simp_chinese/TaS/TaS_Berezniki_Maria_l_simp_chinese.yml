 GWF_BigGame_deccat: "大博弈"
 GWF_BigGame_deccat_desc: "眼下的南德意志地区，更像是一个巨大的棋盘，法兰克福和斯图加特正在其上展开一场激烈的博弈。尽管外交斗争错综复杂，但每一方都握有自己的王牌，伺机给对方以致命一击。每一次交锋，主动权都可能易手，但最重要的是——牢牢掌控住局势，并在此基础上采取行动。达阵，同志们！§l你疯了吧，我们究竟在玩什么鬼东西啊？§!\n\n§Y在这场博弈中，你至少需要获得[?BigGame_round_threshold]的支持度，才能赢得当前回合的胜利。五个回合将决定这场冲突的最终走向。§!"
