 TNO_anarchy_NRL_pepel_tt: "§n俄罗斯的辐射灰烬§!"
 TNO_anarchy_NRL_pepel_tt_delayed: "五十余载光阴，俄罗斯早已沦为废墟。先是布尔什维克的降临，摧毁了一切；再是德意志人的入侵，连这残存的一切也被碾碎。而在“青年俄罗斯”试图战胜德国之后，剩下的只有无尽的辐射【灰烬】。数以百计的弹头蹂躏了这片曾经伟大的土地，夺去了孩童、老人和妇女的生命。许多人只在焦土上留下淡淡的阴影，但即便是这点记忆，也被厚重的【灰烬】彻底掩埋。整个西伯利亚在转瞬间燃烧殆尽，将浸透着恶臭的【灰烬】撒遍整个北欧亚大陆。少数幸存者饱受疾病折磨，在由内而外的腐蚀中走向死亡。上帝已不再垂怜此地。俄罗斯已永远沉沦，但那原始的狂怒之魂已经苏醒，复仇的时刻即将到来…非常…之快。"
 TNO_anarchy_MCW_pkhy_tt: "§e不可名状之普赫伊的幼虫饲喂场§!"
 TNO_anarchy_MCW_pkhy_tt_delayed: "“我长话短说：197…年将不复存在。”——这番话语回荡在电视屏幕与收音机喇叭中。俄罗斯沙皇谢尔盖一世的讲话，竟成了从明斯克到下诺夫哥罗德的解放区居民所见所闻的最后一幕。无人知晓这片土地上究竟发生了什么。唯一可知的是，那定是某种极其恐怖之事。\n\n无论那是什么。§Y上帝啊，拯救俄罗斯吧！§!"
 TNO_anarchy_GWF_witch_tt: "§l胡桃夹子魔女的结界§!"
 TNO_anarchy_GWF_witch_tt_delayed: "何为绝望？那是人在经历最残酷的跌落与失败时，攫住人心的感受。一旦体会到绝望，便只剩下两条路：或是抛弃所有希望与梦想，继续沉沦于深渊；或是冒着坠入更深谷底的风险，再次尝试爬出泥沼。\n\n然而——这份选择权仅属于人类。那些以契约束缚己身、成为魔法少女的存在，并无此等奢侈。她们的绝望，是维持宇宙稳定的能量，是与“孵化者”恶魔交易的一部分。一旦负面情绪吞噬了年轻的少女，她便彻底不再为人，甚至失去自己的躯壳。“魔女”——诞生于绝望的生物。她的目的便是散播混沌与悲伤，直至被另一位魔法少女所击败。\n\n对晓美焰而言，化身为魔女并非仅有一次的经历。在那个过去的宇宙中，她沦为“孵化者”的实验品，只为获得触及“圆环之理”的途径。而现在，她再次屈服于绝望。但这一次，再无人能伸出援手。庞大的送葬队伍蔓延整个斯图加特，吞噬着新的牺牲品。\n\n也许，某个足够仁慈的人会终结她的痛苦，杀死这只魔女。但唯一可以肯定的是：§e对于这个故事而言，这结局真是相当悲伤，不是吗？§!"
 TNO_anarchy_GPL_frozen_tt: "§B东德意志领土冻结区§!"
 TNO_anarchy_GPL_frozen_tt_delayed: "要迈向和平、终结流血，最有效的方法是什么？没错，停止射击，坐上谈判桌，冻结冲突。这条通往安宁的道路，自然不会平坦，需要无数的妥协、交易和会议。但即使是残破的和平，也远胜于最光彩的战争。\n\n对于从什切青到罗夫诺的外交官们来说，“慰藉战争”似乎正是展现他们技巧、不必将屠杀拖延成百上千日就能终结所有冲突的机会。让所有人围坐一桌，讨论必要的细节与妥协，看起来确实是解决问题的绝佳方案。某些最为狂热的代表甚至幻想着在24小时内结束战争，然而当他们发现局势比想象中复杂一些后，便将此转为笑谈。空洞的言辞与声明无法终结战争，需要的是行动。\n\n于是，在某个时刻，突破终于发生——所有方面都同意无条件冻结前线。这本该是穿梭外交家和民粹政客们欢欣鼓舞的时刻，是真正的胜利。然而…事情却走向了岔路。宇宙本身，似乎对“冻结”这个词理解得过于字面了。就在那一瞬间，酷寒笼罩了整个战区。冻结真的降临了，整个东德变成了一片冰封的荒原。"
 TNO_anarchy_ZZZ_reseted_universe_bad_tt: "§R坍缩的宇宙§!"
 TNO_anarchy_ZZZ_reseted_universe_bad_tt_delayed: " 为了拯救他人，人能够付出多少？这个问题有成百上千种答案，没有哪个能被称为绝对正确。一切取决于诸多因素，有时甚至是完全随机和荒谬的因素。有人或许是彻头彻尾的利己主义者，有人则恰恰相反，是无私奉献的利他主义者。每个人都会按自己的方式行事。\n\n然而，很难找到像晓美焰这样的人。若问她为了拯救鹿目圆愿意付出什么，答案很可能是“一切”。这并非夸大其词或复杂的隐喻。她先是献出了灵魂，随后在“土拨鼠之日”的循环中耗费了近十年光阴，最终甚至奋起反抗宇宙本身的法则。她堪称是为了唯一的那个人而展现出的目标坚定与牺牲精神的化身。是什么促成了这种行为？是责任？是依恋？是爱？还是执念？\n\n如今，所有这些问题都已毫无意义。晓美焰走到了存在本身所允许的极限，为了达成她的目标，她毁灭了整个宇宙。原以为为了追寻一位早已逝去的皇室成员而葬送一个拥有千年历史的国家已是疯狂的顶峰，但这一次，牺牲的却是万事万物，包括晓美焰自身。如今空无一物，只剩虚无和一颗灰色的星球。这难道不正是某人的愚蠢与自负所造成的后果吗？\n\n但她真的是独自行动吗？或许，是有人刻意希望得到这样的结局？然而，全部的真相，我们已无从知晓。"
 TNO_anarchy_ZZZ_reseted_universe_good_tt: "§G外部世界§!"
 TNO_anarchy_ZZZ_reseted_universe_good_tt_delayed: "每个故事都有属于它的舞台，其大小并无限制。有时，它终结于作家的书桌；有时，舞台便是整个宇宙。现在，我们看到帷幕正缓缓落下。至于幕后究竟发生着什么，还那么重要吗？"
 TNO_anarchy_XYI_paskhalochka_tt: "§x§Y沙皇与苏维埃§!开发团队向您表示感谢§!"
 TNO_anarchy_XYI_paskhalochka_tt_delayed: "我们谨代表全体开发团队，感谢您的游玩。\n\n§Y这里真的没别的东西了，啊哈。能找到这个，你真棒。§!"
