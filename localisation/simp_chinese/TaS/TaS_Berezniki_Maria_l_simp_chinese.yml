 GWF_Opposition_deccat: "与抵抗组织的斗争"
 GWF_Opposition_deccat_desc: "尽管晓美焰是符腾堡毋庸置疑的统治者，但她的权威仍然受到了来自众多反对势力的质疑。她必须铲除这些异己，否则她将无法巩固自己在斯图加特的统治。\n\n§Y根据所选择的道路，晓美焰将会以不同的方式来彻底解决那些大型抵抗组织的问题。§!"
 endezeit_title: "派系实力：§Y[?endezeit_strength]%§!"
 GWF_opposition_gui_endezeit_button_tt: "£endezeit_texticon §B末日军团§!"
 GWF_opposition_gui_endezeit_button_tt_desc: "[GET_ENDEZEIT_STRENGHT]\n\n\n\n\n\n\n£endezeit_leader   £endezeit_tv\n\n\n\n\n\n\n\n领导人 - §B未知§!\n\n£endezeit_texticon §B末日军团§!——这是在晓美焰于符腾堡地区建立统治后出现的唯一一个有组织的抵抗力量。极为反常的是，该组织完全由魔法少女组成，这也给镇压行动带来了极大的困难。凭借着魔法力量带来的种种优势，她们已然成为了晓美焰最为头疼的难题。\n\n£endezeit_texticon §B末日军团§!的一切都笼罩在迷雾之中，她们的首领从未在公众面前现身，甚至连该组织的最高层干部都对其知之甚少。即便是那些对组织内部情况有所了解的干部，也不知道其领导人的真实姓名和相貌，因为她始终致力于将自己隐藏在幕后。\n\n此外，她们还与£raf_texticon §e红军派§!以及£gim_texticon §s德意志帝国运动§!保持着密切的联系，充当着两者之间的中间人，并利用它们来执行一些相对简单的任务。甚至可以将这三者视为一个遍布全国的地下抵抗网络。§Y因此，如果不先铲除这些组织，那么就连试图找到她们的领导人都将是天方夜谭。§!"
 raf_title: "派系实力：§Y[?raf_strength]%§!"
 GWF_opposition_gui_raf_button_tt: "£raf_texticon §e红军派§!"
 GWF_opposition_gui_raf_button_tt_desc: "[GET_RAF_STRENGHT]\n\n\n\n\n\n\n£raf_leader   £raf_tv\n\n\n\n\n\n\n\n领导人 - §e安德烈亚斯·巴德尔§!\n\n£raf_texticon §e红军派§!——这是一个在二十世纪七十年代初，也就是第二次西俄战争爆发之前就已经存在的，奉行共产主义的武装组织。作为§o大日耳曼国§!的死敌，他们采取了激进的恐怖主义手段，并将其美其名曰为“城市游击战”。在大日耳曼国崩溃以及维亚特卡强加于此的§K“新秩序”§!建立后，四分五裂的德国似乎成为了滋生一场轰轰烈烈的社会主义革命的沃土。\n\n然而…这一切终究未能成为现实，俄国人消失了，取而代之的，则是这由各种稀奇古怪的玩意儿拼凑而成的，如同哈哈镜般扭曲的世界。乌尔丽克·迈因霍夫与安德烈亚斯·巴德尔以及古德伦·恩斯林分道扬镳。迈因霍夫创造了她自己的“民族共产主义乌托邦”。而 £raf_texticon 红军派的其余成员则选择继续留在德国南部活动。\n\n他们在斯图加特建立了自己的根据地，并将矛头指向了“某个专横跋扈的少女”所建立的君主制政权，认为这是他们踏上征程的起点。无论如何，是否要与他们谈判，选择权都掌握在晓美焰的手中。"
 gim_title: "派系实力：§Y[?gim_strength]%§!"
 GWF_opposition_gui_gim_button_tt: "£gim_texticon §s德意志帝国运动§!"
 GWF_opposition_gui_gim_button_tt_desc: "[GET_GIM_STRENGHT]\n\n\n\n\n\n\n£gim_leader   £gim_tv\n\n\n\n\n\n\n\n领导人 - §s奥托·恩斯特·雷默§!\n\n£gim_texticon §s德意志帝国运动§!——这是一个由§o旧政权§!的拥护者们所组成的组织。在德国第一次崩溃后，他们组建起了一支规模可观的地下武装力量，并计划在时机成熟时夺取巴登地区的控制权，推翻那个跳梁小丑一般的马克西米利安。在那之后，所有的德意志人都将揭竿而起，共同反抗俄国占领者。然而，德国再一次崩溃了，占领者也消失了，取而代之的是那些不知从何处冒出来的形形色色的政权。“狼人”部队分崩离析，如今，§s德意志帝国运动§!只剩下一群怀念着“我们失去的那个帝国”的前§o纳粹党§!官员。\n\n尽管他们现在的实力与昔日相比早已不可同日而语，但广泛的群众基础仍然让他们得以苟延残喘，并时不时地策划一些行动。更重要的是，他们还利用自己的关系网为其他的反对派组织提供支持，哪怕是那些他们曾经不共戴天的死敌。他们的行动纲领可以概括为一句话——“先将这些外来者赶出去，之后我们再算总账”。而这也正是£raf_texticon 德意志抵抗阵线能够存在的根基。"
