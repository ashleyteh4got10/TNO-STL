 GER_collapsed_universe: "世界线的崩塌"
 GER_collapsed_universe_desc: "“步枪是节日的礼炮，一切都将灰飞烟灭”——某位吟游诗人在他那慷慨激昂的诗篇中如是写道。而如今，一切都应验了。曾经的欧洲心脏地带，已然化作一锅由各色势力与思想混杂而成的乱炖。统治者如同走马灯般频繁更迭，周围的一切也随之天翻地覆，这令本就惶恐不安的德意志人民愈发感到无所适从。最终，我们所面对的，是弥漫于整个社会的麻木与冷漠，以及对我们所控制的土地摇摇欲坠的统治。但这一切都只是暂时的，我们定能杀出一条血路！"
 APF_call_of_north: "来自极北之地的ZOV"
 APF_call_of_north_desc: "我们的目标是——彻底摧毁南方那个由“全球同性恋组织”以及其他乱七八糟的生物所炮制出来的、堕落而又扭曲的造物。许珀耳玻瑞亚、雅戈泰和亚斯格特的魂灵庇佑着我们！只要我们不断前进，伟大的先祖将会庇佑我们的荣光！\n\n我们必将抵达那传说中的许珀耳玻瑞亚！"
 GNR_ze_new_order: "新泽秩序"
 GNR_ze_new_order_desc: "您准备好迎接新秩序了吗？准备好乖乖交出您的所有权利吧！\n\n我们的目标清晰而明确——创造一个真正意义上的人间乐土，使身处邪恶世界的人们感受到无比的安全与幸福。诚然，为了实现这一目标，我们或许需要密切关注着您的一举一动，而您也将失去拥有任何财产的权利。但我们会让您对这一切甘之如饴，甚至心满意足。如若不然，很遗憾，您将被视为与这全新的社会意识形态格格不入的异类。1980年议程必将得到贯彻执行！"
 ISS_nothing_ever_happens: "无！事！发！生！"
 ISS_nothing_ever_happens_desc: "“无事发生”——这是我们的座右铭，也是我们的生活方式。正是得益于此，我们才得以在我们的国家内维持着绝对的稳定。当然，我们本可以将我们的旗帜插到更远的地方去，但是那样一来，我们就违背了自己的信条。\n\n我们的追随者遍布于整个“元宇宙”的巅峰！很快，整个“现实世界”都将成为无聊与乏味的代名词。即使我们在这里遭遇了失败，但胜利终将在未来等待着我们！"
 DEN_i_didnt_make_anything_funnier: "创意的枯竭"
 DEN_i_didnt_make_anything_funnier_desc: "我说，你（我）这**玩意儿。真的就想不出更有意思的了？真有你的，兄嘚，搞了一堆军阀出来，结果连点像样的设定都憋不出来。还乐高积木之国…简直了。你甚至还把贝贝社区里的那个乐高小人给硬塞了进来。这很好笑吗？我可没觉得！"
 GDN_wrong_place_wront_time: "不合时宜"
 GDN_wrong_place_wront_time_desc: "人们常说，一个在正确的时间出现在正确的地点的人，能够改变整个世界。然而，我们此刻所处的境遇则恰恰相反，我们出现在了一个他妈的完全不该出现的地方，时间也完全乱了套。我们已经与“东部高地”彻底失去了联系，现在只能努力适应这里的生活，并尝试着去理解我们周遭所发生的这一切。"
 MBL_last_tsar: "末代沙皇"
 MBL_last_tsar_desc: "当整个俄罗斯被灰烬所吞噬后，谢尔盖·别洛泽尔斯基和他所率领的一小支边防部队成为了俄罗斯最后的余晖。因此，摆在他们面前的是一项极其艰巨的任务——守护这仅存的希望。"
 LIT_fragile_union: "脆弱的联盟"
 LIT_fragile_union_desc: "流氓无产者和“浴血黑帮”的结盟出乎了所有人的意料。而这种突如其来的结合也带来了重重问题，因为双方都有着各自的利益诉求，一场冲突似乎在所难免…"
 MUK_copium_resources: "珍稀的“科皮乌姆”矿藏"
 MUK_copium_resources_desc: "稀土金属！战略资源！——所有这些冠冕堂皇的说辞不过是为了蒙蔽普通民众的双眼。诚然，乌克兰拥有丰富的资源，但这些资源显然不足以引起全世界的关注。那么，围绕着乌克兰发生的这一系列交易与冲突，其背后真正的推手究竟是什么呢？\n\n答案很简单，乌克兰是世界上“科皮乌姆”——一种极为珍稀的元素，储量最为丰富的国家。"
 PUS_crazy_to_be_first: "疯狂地成为第一人"
 PUS_crazy_to_be_first_desc: "嗷呜！"
 GPL_price_to_decide: "波兰：价值几何？"
 GPL_price_to_decide_desc: "我们必须实现波兰的自由——无论是经济上的，还是其他意义上的。为此，我们必须对整个国家的所有资产进行彻底清点，从而确定我们国家的真正价值！"
 GSV_ressurected_fuhrer: "元首归来"
 GSV_ressurected_fuhrer_desc: "们一度认为，戈培尔早已死在了莫斯科那些游击队员的枪口之下，然而，事实却并非如此。他不仅安然无恙，甚至还出现在了我们的面前！更重要的是，在当前这场天翻地覆的剧变之中，他已然成为了整个地区的最高领袖，不仅统治着斯洛伐克那一小块残存的领土，甚至还成为了整个大日耳曼国的“元首”。"
 GSI_successful_trick: "成功的骗局"
 GSI_successful_trick_desc: "副官成功地维持了希特勒还活着的假象。然而，有很多人都在对他的位子虎视眈眈，因此他务必打起十二分的精神，确保其国家机器能够稳定地运转。"
 ZNE_freie_deutsche_jugend: "自由德意志青年团"
 ZNE_freie_deutsche_jugend_desc: "我们在自由德意志青年团中，我们是如此自由。\n在自由德意志青年团中，我们是如此“德意志”。\n在自由德意志青年团中，我们是如此的朝气蓬勃。\n在自由德意志青年团中，我们始终与你同在。\n为什么那些生活在其他国家中的年轻人却不愿像我们一样，积极主动地提升自身的美德？\n那些不愿同流合污的书呆子们将被彻底淘汰。\n但我们与众不同，我们都属于——自由德意志青年团。\n\n一，二，三，世上最好的党！\n四，五，六，最棒的连接！\n七，八，与华约紧密团结！\n九，您最忠实的朋友！\nA-B-C，最为精锐的军队！\nD-E-F，我们例无虚发！\nG-H以及I，为了民主与自由！\nJ——那正是“自由德意志青年团”！"
 BRL_i_have_no_values: "观点？那要取决于我此刻正在嘲讽的对象"
 BRL_i_have_no_values_desc: "我们的思想、任务以及目标——全都是一派胡言。我们只需要见风使舵，因时而动即可。\n\n不存在什么必须遵循的原则，也不存在什么意识形态的条条框框，一切都只是纯粹的随机应变！需要和共产主义者作斗争？那我们就摇身一变，成为最狂热的资本主义斗士！需要同左翼势力作战——我们就会站在极右的一方；而当我们的敌人换成右翼——那我们也会立刻改变立场，以左翼的面貌示人。诚然，这种极度“灵活”的思维方式也许会令某些人不齿，但对于这些无端的指责，我们只有一个万能的回答——“忍着吧，侏儒们！”"
 GCZ_greatest_union: "最伟大的联盟"
 GCZ_greatest_union_desc: "我们完成了一项堪称奇迹的伟业——实现了捷克人和德意志人之间的和解。几十年来悬而未决的民族矛盾，在短短几天之内就被彻底化解。现在，不同民族之间和谐相处，那些过去的仇恨与罪孽都已经被抛诸脑后。而那位“布拉格园丁”的名字，也早已成为了这个国家每一个居民的口头禅。"
 GWS_goodwill_soldiers: "“善意”的士兵"
 GWS_goodwill_soldiers_desc: "占领并非易事，尤其是当你需要控制的地区生活着一群不共戴天的仇敌的时候。过去，我们还曾被那些所谓的国际法、公约以及来自美国的各种规章制度束缚手脚。而现在，华盛顿已经同我们彻底决裂，我们终于可以放开手脚，肆意妄为了！我们的士兵拥有了为所欲为的自由，与此同时，阿夫顿还能够尽情发挥其在商业领域的才能，在德意志的土地上将他的披萨连锁店发扬光大。\n\n或许，有朝一日我们的所作所为会受到清算，但我们已经想好了对策，用来应对一切“反人类罪”的指控——“只要我们乐在其中，那就都不算数。”"
 GRH_true_communism: "这一次一定能行！"
 GRH_true_communism_desc: "共产主义是现代最伟大的思想！然而共产主义的实践却没有一次走向了成功的道路。但是现在情况有所改变，由于我们已经找到了通向真正的共产主义社会的公式，所以，真正的共产主义必将实现！马克思万岁！恩格斯万岁！"
 LHH_allah_warriors: "哈哈哈之战"
 LHH_allah_warriors_desc: "真主至上！我们将用手中的利刃将那些异教徒的鲜血洒遍四方！真主万岁！我们必将对每个异教徒进行“圣战”，而“真主至大”将成为我们在这场伟大的征途上的永恒信条！"
 GBV_dont_lose_your_ass: "隐形步兵"
 GBV_dont_lose_your_ass_desc: "我们最新锐的军事科技成果——“隐形步兵”，这是一支精锐的特种部队，能够对敌人的后方造成毁灭性的打击......其威力堪称空前绝后。现在，我们所有的敌人都将寝食难安，因为他们必须时刻提防着神出鬼没的隐形步兵！"
 GAU_what_the_fuck_are_we: "我们究竟是何方神圣？"
 GAU_what_the_fuck_are_we_desc: "作为一个鱼龙混杂的大杂烩式的组织，我们需要以集体协商的方式来处理所有大大小小的问题，哪怕是再微不足道的细节也不例外。这也带来了诸多不便，因为我们有时甚至连一份统一的议程都无法确定下来！每一个委员会成员都秉持着自身激进的观点，这简直令人不胜其烦。"
 DSH_far_from_home: "远离故土"
 DSH_far_from_home_desc: "在德国人对意大利的入侵以惨败告终后，意大利军队也随即踏上了德意志的土地。诚然，并非所有人都认同意大利革命中的那些共产主义思想，但为了保家卫国，每一个意大利人都义无反顾地投身于这场伟大的卫国战争中。\n\n然而，世界已然剧变，意大利也早已面目全非。所有试图与罗马取得联系的努力都以失败告终，仿佛有什么神秘力量在从中作梗。如今，我们孤立无援，然而我们对意大利的信念却从未动摇！"
 GRA_grave_enemy: "不共戴天之仇"
 GRA_grave_enemy_desc: "即便在这个我们无意中闯入的陌生世界中，仍然存在着一个令人深恶痛绝的可憎组织——欧洲核子研究中心，天杀的！他们竟然又一次将魔爪伸向了时间机器的研究项目，因此我们必须时刻做好准备，在任何时间，任何地点与他们周旋到底。"
 GSU_research_zone: "研究区域"
 GSU_research_zone_desc: "欧洲核子研究中心当前的的首要任务是——查明导致当前这场宇宙级别时空异常现象的根本原因。我们的国家与其说是一个主权实体，倒不如说更像是一个巨大的实验室，一个科研项目。这使得我们难以维持一个正常国家所应具备的各种职能。然而，科学的进步总是要付出代价的。"
 AGS_elons_vision: "埃隆的愿景"
 AGS_elons_vision_desc: "埃隆·马斯克的脑海中永远涌动着各种各样的新奇想法。无论这些想法看上去有多么的荒诞不经，他总能想方设法将它们付诸实践。整个国家都成为了马斯克的游乐场，他可以随心所欲地实现他脑海中的一切奇思妙想。而他也总能为他的每一个“天才”想法找到一个合理的解释。"
 OKL_allah_suryah_bashar: "真主，卢森堡，巴沙尔！"
 OKL_allah_suryah_bashar_desc: "巴沙尔·阿萨德曾经一度失去了自己的国家，而如今，他决不能让这样的悲剧再次重演。现在，他必须比以往任何时候都更加果断，更加无畏，让这里的每一个居民，无论其出身如何，都将这三个神圣的词语牢记于心，并对其忠贞不渝——“真主，卢森堡，巴沙尔！”"
 GBW_courts_of_ancap: "安资治下的法庭"
 GBW_courts_of_ancap_desc: "无政府资本主义所面临的最为棘手的难题莫过于司法体系。没有人，没有任何人能够说清楚，私营法院究竟该如何运作？他们应当如何运用强制力来执行他们的判决？法院之间孰高孰低，又该如何划分等级？无政府资本主义究竟该如何，他妈的，运转起来？这一切都是悬而未决的问题，而且，恐怕也没有人能够给出答案。"
 AUS_money_must_flow: "金钱永不眠！"
 AUS_money_must_flow_desc: "为了维持一个主播极为奢侈的生活，需要巨额的资金支持。幸运的是，即便是在这个鬼地方，仍然有一些慷慨的酋长以及其他热心人士，他们愿意为这番伟大的事业捐出自己辛辛苦苦挣来的血汗钱。在民众和主播之间达成了一种不成文的契约——他们为他提供资金，而他则为他们奉上精彩的表演。听上去很不错，对吧？"
 RMN_fragile_power: "脆弱的统治"
 RMN_fragile_power_desc: "帕达尼亚本身就是一个高度发达的地区，而人这种生物，你给他一点好处，他就会得寸进尺。在获得了住所和食物后，他们现在又开始鼓噪什么所谓的“权利”，甚至还妄图恢复那早已过时的古希腊式民主制度。再加上那个该死的约书亚，四处散布着异端邪说。这日子，可真不好过啊…"
 GHL_NAFO: "北大西洋舔狗组织"
 GHL_NAFO_desc: "北大西洋舔狗组织——这是一支新型的部队，一支信息战部队。与那些在前线冲锋陷阵的传统士兵不同，他们的武器是无形的，他们的战场存在于人们的心灵之中。他们运用各种形式的媒体作为武器，来达到他们不可告人的目的。\n\n不过，即便是在最糟糕的情况下，他们也可以拿起武器，成为一名战士。虽然他们的战斗力极其拉胯，但毕竟是他们自己主动请缨的，不是吗？"
 BEL_schizophrenia: "精神病患者的呓语"
 BEL_schizophrenia_desc: "啊啊啊啊啊，直升机！"
 SSN_perfect_harmony: "至臻的美学"
 SSN_perfect_harmony_desc: "甚至都不需要多费笔墨去描述，因为它本身就代表着至高无上的完美！"
 SSL_best_toilet_seller: "奖项：1969年度最佳马桶推销员"
 SSL_best_toilet_seller_desc: "这是一项值得骄傲的成就，不是吗？"
 accelerationism: "加速主义"
 accelerationism_1: "加速主义"
 accelerationism_1_subtype_desc: "加速主义"
 accelerationism_2: "加速主义"
 accelerationism_2_subtype_desc: "加速主义"
 accelerationism_subtype: "加速主义"
 accelerationism_madoka_cult_subtype: "圆环之理"
 accelerationism_church_of_ring_subtype: "圆环教会"
 accelerationism_national_homosexualism_subtype: "民族同性恋主义"
 accelerationism_reformist_homosexualism_subtype: "改革同性恋主义"
 accelerationism_estetism_subtype: "唯美主义"
 accelerationism_rule_of_auction_subtype: "拍卖意志"
 accelerationism_anarcho_capitalism_subtype: "无政府资本主义"
 accelerationism_anarcho_etatism_svetov_subtype: "无政府国家主义"
 accelerationism_anarcho_etatism_pozharskiy_subtype: "无政府国家主义"
 accelerationism_eternal_republic_subtype: "永恒共和国"
 accelerationism_transhumanism_subtype: "超人类主义"
 accelerationism_anti_centrism_subtype: "反中心主义"
 accelerationism_non_aplicable_subtype: "不适用"
 accelerationism_subtype_desc: "奇异的世界——自有其奇异的意识形态。"
 accelerationism_madoka_cult_subtype_desc: "晓美焰所信奉的，并非传统意义上的意识形态，而是她心中那一系列坚定不移的目标与理想，也正因如此她才会作为孤身一人的个体，在这片土地上孤军奋战。\n\n如果非要用一个词来概括晓美焰的一切行动，那就是拯救“鹿目圆”。不幸的是，我们无从得知这究竟是一个人名，抑或仅仅是一个代号，甚至无从知晓这究竟是否是一个真实的存在。在谎言与流言的迷雾中，真相早已变得扑朔迷离。但唯一可以肯定的是，她会为了达成这一目标，不惜一切代价。即便要以§e整个宇宙§!作为祭品也在所不惜。"
 accelerationism_church_of_ring_subtype_desc: "圆环教会是一个非同寻常的宗教-政治组织，它在这场动荡之中悄然兴起于斯图加特。虽然其教义内核与基督教中的天主教一脉相承，但却历经了一系列光怪陆离的演变。\n\n该教会宣称，世界上存在着“魔法少女”——一群拥有超自然力量的特殊个体，她们为了实现自己的愿望，成为了某种意义上的“天使”，与邪恶势力展开殊死搏斗。而统御一切的至高“神明”，便是“鹿目圆”，一位至高无上的魔法少女，她主宰着所有魔法少女的命运。\n\n尽管这些观念听上去荒诞不经，但它们却迅速地俘获了斯图加特及其周边地区的人心。教会的“女教皇”——晓美焰，凭借其极富感染力的言辞与果决的行动，在短时间内就牢牢地掌控了权力。忠诚于她的士兵与魔法少女们，也随时听候她的调遣。\n\n§G但这一切，真的足够了吗？§!"
 accelerationism_national_homosexualism_subtype_desc: "奇异的世界——自有其奇异的意识形态。"
 accelerationism_reformist_homosexualism_subtype_desc: "奇异的世界——自有其奇异的意识形态。"
 accelerationism_estetism_subtype_desc: "奇异的世界——自有其奇异的意识形态。"
 accelerationism_rule_of_auction_subtype_desc: "奇异的世界——自有其奇异的意识形态。"
 accelerationism_anarcho_capitalism_subtype_desc: "无政府资本主义，亦称作“太阳自由意志主义”，在传统意义上很难称之为一种意识形态。即便是无政府主义的古典理论家们，也只能谨慎地希望他们的思想能在现实中（哪怕是破碎的现实）得以体现，但他们绝未曾料到，这些思想在现实中的实际应用，竟会是他们最可怕噩梦中的景象。\n\n米哈伊尔·斯维托夫的政权——他已与前基督教神秘教派的神祇“不败太阳”融为一体——代表着一种被推至其逻辑顶点的资本主义：它像赐予生命、却又会灼瞎任何胆敢直视者的太阳一样，毫无怜悯。斯维托夫摒弃了非暴力原则，创造了一个崇尚强权的领域。人对于人，是觊觎着吞噬对手的饿狼，只待其稍有失足。\n\n在无政府资本主义下，法院如何运作——这对国际社会而言，依然是个谜。"
 accelerationism_anarcho_etatism_svetov_subtype_desc: "无政府国家主义，亦称作“黎明自由意志主义”，在任何意义上都难以称之为一种意识形态。它是矛盾的集合体，由破碎的现实所催生，也只能存在于其中。\n\n米哈伊尔·斯维托夫，不败太阳的化身，将太阳逻各斯的自我与其阴影（体现于米哈伊尔·波扎尔斯基）重新结合，成为了“自性”的化身，并领悟了爱的价值。如今，他必须向他的盟友们学习真正的慈悲：阿道夫·希特勒、穆罕默德·阿尔-雷尼，以及晓美焰。他的新政权将彻底清除资本主义的残酷，将市场的惩罚之拳，转变为“父亲”温暖而慈爱的抚触，无论是值得之人，还是不值得之人，都将沐浴在他的爱中。\n\n或许在这番探索中，他也将领悟无政府国家主义下的法院应如何运作。"
 accelerationism_anarcho_etatism_pozharskiy_subtype_desc: "无政府国家主义，亦称作“月光自由意志主义”，在任何意义上都难以称之为一种意识形态。它是矛盾的集合体，由破碎的现实所催生，也只能存在于其中。\n\n当米哈伊尔·斯维托夫吞噬了不败太阳之光时，他被迫抛弃了阴影。这道阴影化为了米哈伊尔·乔姆诺夫（前称波扎尔斯基）。无政府国家主义是一种残酷而又关怀备至的爱的意识形态。它将国家定位为父母的角色，保护其子女免受外部世界以及他们自身的危险。不配者将在死亡中找到慈悲，而合格者则将在无限而清冷如月光的爱意中得到救赎。\n\n在无政府国家主义下，法院如何运作——这对国际社会而言，依然是个谜。"
