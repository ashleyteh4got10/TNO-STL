 ZZZ_good_ADJ: ""
 TNO_CountryClosing_epilogue_generic_GWF_good_end: "为了成就自己的事业，人愿意付出多少？跨越所有的艰难险阻与错误，终有一刻能抵达期望的成果。对晓美焰而言，过去的三年，不，应该说成为魔法少女后的整个人生，这最后的十几年，是对意志力的真正考验。很少有人能经历如此多的悲伤与失败而不至疯狂。\n\n晓美焰克服了所有看似不可能的试炼。终于，她应在这个崭新而宁静的世界里获得休憩。圆，那个她为之付出一切的人，如今也觅得了幸福，与爱她的人相伴左右。\n\n苦难总有终结之时，而这一刻已经到来。§Y您已达成§G好结局§!§!"
 TNO_CountryClosing_epilogue_generic_GWF_neutral_good_end: "宇宙并未恢复常态，所有的问题与裂痕依旧昭然若揭。恢复旧日世界秩序的尝试已然失败。然而，对晓美焰来说，这并非难以承受的重负。毕竟，她的首要目标是拯救圆，而圆已获救。诚然，为了达成这个目标，晓美焰在某些地方不得不玷污双手。但如今这已不再困扰她，现在，她只是自己亲手建立的那个国度里一名普通的公民。\n\n晓美焰与圆如今携手，希望能让一切重归旧轨。终有一日，所有问题的答案将会揭晓，修复世界的机会亦将出现。\n\n这或许并非她们所能企及的最佳结局，但在此处，她们依旧拥有幸福。§Y您已达成§Y中立好结局§!§!"
 TNO_CountryClosing_epilogue_generic_GWF_neutral_bad_end: "宇宙并未恢复常态，所有的问题与裂痕依旧昭然若揭。恢复旧日世界秩序的尝试已然失败。然而，对晓美焰来说，这并非难以承受的重负。毕竟，她的首要目标是拯救圆，而圆已获救。为了达成这个目标，许多牺牲在所难免，但谁又会在乎呢？德国对她而言，如今不过是一个掌中宇宙。\n\n圆…她安然无恙，然而女孩们之间的矛盾却日益加剧。那座专为圆打造的金丝笼过于狭窄与不适，难以将她成功禁锢。终有一日，她们将抵达极限，爆发直接的冲突。\n\n但现在，晓美焰满足于活在当下，无论代价为何。§Y您已达成§O中立坏结局§!§!"
 TNO_CountryClosing_epilogue_generic_GWF_bad_end: "为了成就自己的事业，人愿意付出多少？为了某个伟大的目标而牺牲一切，有时看似并非最愚蠢的念头。然而，目的并不总是能为手段辩护。对晓美焰而言，试图带回圆的尝试最终以彻头彻尾的灾难告终。她牺牲了任何体面的规范，抛弃了一切可能的援助，最终落得既失去了圆，也失去了整个宇宙的下场。\n\n仿佛是来自存在本身的惩罚，晓美焰如今获得了真正的永生，却再无任何方式能终结自身的苦难。如今，这位魔法少女凝固的身影，永远留在了美索不达米亚的沙漠之中。\n\n也许有朝一日，会有人赋予她新的目标，然而眼下，剩下的唯有无尽的绝望。§Y您已达成§R坏结局§!§!"