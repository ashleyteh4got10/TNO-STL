 GWF.80.t: "德累斯顿档案"
 GWF.80.desc: "我叫哈里·布莱克斯通·科波菲尔·德累斯顿。你可以拿我的名字念咒——后果自负。我是个法师。我在芝加哥市中心附近一间单人办公室里干我的活儿。嗯，曾经是。当德国被打得稀巴烂、分裂成几十块之后，我那些微不足道的业务引起了英勇的美国情报部门的注意，他们二话不说就把我招募进了中情局的“应对异位面威胁世界秩序处”。于是我就来到了这里，在赤色的德累斯顿，追捕各种邪祟，并试图搞清楚，看在上帝的份上，这个被神遗弃的国家到底发生了什么。\n\n而这位坐在我右边扶手椅上的美丽女士——是英国缄默局的初级治安官-视察员康斯坦莎·李，不过大家都叫她康妮。她被派来协助我，或者更准确地说，是向我介绍旧世界神秘领域的运作规则。\n\n和美国不同，老欧洲遍布着力量之地，让“学徒”（adepts，他们这儿管法师叫这个）能从历史（或者说，层层叠加的历史）中汲取力量。而现在，由于历史上最可怕的核轰炸所引发的灾难性能量爆发，以及此前一系列我们尚需查明源头的时空异常，其他的时空线以及从任何已知魔法和物理法则来看都完全不可能的事物混杂于此，使得欧洲大陆的神秘活动达到了前所未有的规模。\n\n就在我刚放下记事本的那一刻，办公室的门开了，康妮冲了进来。"
 GWF.80.a: "我们有个线人。撬开他的嘴——这是你的任务。"
 GWF.81.t: "不屈者"
 GWF.81.desc: "“——狮首匠的弟兄们绝不可能跟条子合作！拿你们那些破纸片和徽章擦屁股去吧，‘考波’，赶紧把我杀了完事。”这就是那个毛发蓬乱、胡子拉碴、大约40来岁、眼神彻底疯狂、燃烧着通常不像斯塔西囚徒所应有的火焰与憎恨的男人的唯一且不变的回答。我们把斯塔西的牢房用作临时总部。\n\n“如果我们的任务是消灭你们的教团，我们早就动手了。但我们想给你一个赎罪的机会。”在跟一堵墙谈了几十分钟后，我用尽可能平静的语气说道。\n\n康妮，显然对我外交能力的信心已彻底破灭，带着灿烂的笑容出现在门口。\n\n“狮首匠的弟兄，是吗？直呼秘密神祇的名讳，胆子真不小。不过话说回来，对一个革命者还能期待什么呢？难道在你们的康米乌托邦里，狮首匠没有获胜吗？”\n\n“当那帮‘上校’的走狗还藏在万字旗下的时候，我们就跟他们干仗了，现在他们不过是换了个旗子而已。”被绑在椅子上的教徒朝地上啐了一口，那一刻他的眼神锐利如出鞘之刃。\n\n康妮凑近我，低声问道：“你什么时候方便动手？”我毫不迟疑地回答：“周一晚上。”\n\n“狮首匠似乎崇尚公平对决。做个交易如何？周一晚上，城郊的仓库，我们这边五个人。你们带上五个最强的战士。你们赢了，我们任凭处置。如果我们赢了，你们完成任务，然后重获自由。”提出这些条件时，这位治安官眼中燃烧着自信，那自信如同病毒般感染了我，让我也挺直了脊梁。"
 GWF.81.a: "这才像话，杂种！碎刃教团要把你们打得屁滚尿流！"
 GWF.82.t: "赤色之城，赤色之血"
 GWF.82.desc: "我们确实是五个人：我、康妮，还有三名斯塔西特工，装备着从全国各地收缴来的附魔武器。我对气象学的信任也得到了充分回报：雷声隆隆，大雨倾盆，浇灌着选定的仓库。自从那个教徒被释放到这里去通知他的首领我们的提议以来，已经过去三天了。无论他是谁，他都无法拒绝。\n\n特工们率先冲过敞开的大门闯入仓库，接着我手持法杖紧随其后，康妮则靠在门框边。起初，里面似乎空无一人，直到我们听到一声用未知语言发出的野蛮嚎叫。一团血肉模糊的集合体出现在我们面前，扭动着二十来条……以一种超乎自然地诱人的…方式扭动的腿。特工们，大概和我一样被那景象和歌声迷住了，呆立了足足一分钟，最后才用他们的利刃砍向那怪物，这也花了不少时间。我无法将目光从它痛苦的挣扎上移开。\n\n“剥皮先知”，康妮说道，“相当聪明的声东击西。”\n\n当先知的歌声中断时，我们听到了从邻近建筑传来的另一首歌声。三个声音在颂扬着“雷霆节拍”。片刻之后，歌声停止，仓库的右墙伴随着巨大的噪音轰然倒塌。"
 GWF.82.a: " 一只巨大的无头熊，跳着舞冲进了仓库。"
 GWF.83.t: "打击巨怪"
 GWF.83.desc: "这是康妮给那只在教徒们显然完成了召唤仪式后出现在仓库里的怪物起的名字。斯塔西特工们冲了上去，却无法跟上这个生物完美的节奏感。第一个被毛茸茸的熊掌拍飞到角落，第二个胸前被撕开一道巨大的流血伤口（我不敢想象打击巨怪的爪子有多锋利），第三个则冲去救助第二个同伴。\n\n轮到我行动了。当特工们与熊（或者更像是活化的熊皮）缠斗时，我正准备利用雷暴的能量发动决定性的一击。在通常情况下，这无异于自杀，但为律法效力也有其优势。一股能量流从法杖中喷涌而出，击中了那已经活跃地朝我跳过来的怪物，点燃了它的毛皮，并打破了它此前无懈可击的节奏。\n\n我的手在颤抖，但那个被拍飞的特工恢复过来，重新吸引了怪物的注意力。康妮正在救治伤员，而刚才去救人的那个特工却不见踪影。那个德国人成功适应了打击巨怪混乱的动作，而我则用更简单的战斗法术支援着攻击。\n\n就在这时，响起了步枪的齐射声。"
 GWF.83.a: "“…”"
 GWF.84.t: "子弹无眼"
 GWF.84.desc: "陨铁弹——崇尚“刃”之原则的教团最珍贵的宝藏之一。康妮警告过我这种能够杀死不朽者的可怕武器。我感到右肩碎裂，左肋传来难以置信的剧痛。与怪物搏斗的特工头部中弹。我几乎是凭本能行动，将这些感觉汇入对打击巨怪的最后一击，将其彻底杀死。我用尽最后力气伸向肩膀，掏出OPIUM的徽章——它被附魔以奇迹般地抵挡枪伤。子弹仍留在体内，我用左手将其对准子弹飞来的方向抽出，然后倒在地上。\n\n我听到了康妮配枪的射击声，听到一具身体倒在我面前，看到上方脚手架处两道炫目的闪光，几秒钟后，看到被震晕的教徒们被从魔法阴影中走出的斯塔西特工们捆绑起来。康妮跑过来为我处理枪伤，我满意地呼出一口气，失去了意识。"
 GWF.84.a: "计划成功"
 GWF.85.t: "世界之虫"
 GWF.85.desc: "“祂的子嗣将数不胜数。数不胜数者将为‘七者’开启门户，而七者将吞噬四者。”——“豹”对这些诗句了如指掌。他知道他的庇护主用赤手紧握着“蠕虫”，而祂永恒的敌人则将它们保存在“博物馆”里…但他不知道，蠕虫可以是这样的。\n\n当那个英国婊子派他去探索“灰烬”时，他没料到这片被诅咒的土地会被蠕虫占据。是血肉之躯的蠕虫，吞噬着所有靠近它们的生灵。这些蠕虫是错误的，豹所熟悉的仪式毫无效果，“灌木女士”和“褴褛骄阳”在这片被诅咒浸透的土地上毫无回应。幸运的是，他还有武器和怪物。\n\n白天，当蠕虫沉睡时，他锻造；夜晚，他与他最强大、在探险最初几日恐怖中幸存下来的少数追随者们，以及他锻造出的怪物一起，对抗着来自“无处”的孽障。他观察着那些曾是德国东部边陲、在那之前又是旧俄罗斯跳动脉搏的城市废墟。在每一片废墟中，都以某种难以想象的方式保存着收音机和电视机，它们循环播放着同一个新俄罗斯沙皇永无止境的讲话。漫长而压抑的沉默，被雷鸣般恐怖的话语骤然打破。"
 GWF.85.a: "“众目睽睽，死亦无憾！”"
 GWF.86.t: "灰烬上的脚步"
 GWF.86.desc: "曾经被称为碎刃教团的组织，如今只剩下三人。豹，他们的领袖，早已忘记了自己的真名；以及他最忠诚、最强大的两名追随者，他们为了侍奉狮首匠而重塑了自己的身心。他们准备清点损失，因为几天前他们已经离开了“饲喂场”。如今，他们的道路穿越俄罗斯的废墟，指向维亚特卡：这个国家的前首都，那里是一切开始的地方。\n\n灰烬…50年前，谁能想到昔日的欧洲宪兵会只剩下一片焦土荒漠。然而，这甚至不能称之为荒漠。荒漠尚有生命，荒漠有地下水流淌，有水井，有能用毒牙将你从此世解脱的毒蛇。而这里，盖革计数器指针爆表，唯一的声音是远处传来的痛苦嚎叫。\n\n他们为何还没死于饥渴？每一道伤口都是一扇门扉，有些言辞能令祭献变得愉悦。“杯”深谙享乐与盛宴之道。先知们的预言中充满了对未来的憧憬：那一天，这片土地将再次繁花似锦，生命将重返灰烬的山谷。在被吞噬之前，他们说，那个时刻很快就会到来。"
 GWF.86.a: "破碎的世界滋生破碎的道德。"
 GWF.87.t: "一切开始之地"
 GWF.87.desc: "我们从远处就望见了维亚特卡的废墟，它们很可能是核爆火焰中唯一幸存下来的建筑。豹的手稿——他研究了荒原上的每一种现象——字里行间充满了对雇主的憎恨和有趣的观察。教徒们越是接近维亚特卡，历史的织线就越发紧张。这里发生了某件事，扰乱了时间线。\n\n在古老与现代宅邸、以及住宅高楼的残骸中徘徊并未持续太久。豹感觉到有人在监视他，而寻找者很快就暴露了自己：那是一位年轻的女子，手持长矛，身着类似束腰外衣的服装。她看起来不超过19岁，但脸上的神情却透露出饱经沧桑。她站在前省长官邸的顶端，宛如一座活生生的雅典娜·帕拉斯雕像——那雕像曾是当地花园的点缀。\n\n“欢迎你们，旅人。我猜，是寻求真理将你们引至此地。某种程度上，我也是如此。我叫玛利亚，我曾是俄罗斯的女皇，尽管是在另一个世界。现在，或许可以再次这样称呼我了。”\n\n“您也好啊，年轻的女士！”豹的语气一如既往，如锻炉般炽热“我承认，我对您的说辞颇为惊讶，而且我原则上不向沙皇行礼。我想，我们可以在这里平等对话。”玛利亚温顺地点了点头。“我确实需要知道这里发生了什么。您刚才提到了另一个世界，对吗？在德国，那样的‘穿越者’多得是，但这里的历史似乎变得格外稀薄。”\n\n“在德国？我还以为整个世界在博恩霍尔姆岛事件后都变成这样了呢。”\n\n“这个世界正处于一种彻底的‘难以言喻’的状态，请原谅我的法语。德国那边乱成一锅粥，不知从哪儿冒出来了康米分子、俄国人，还有什么魔法少女。”\n\n“魔法少女？我必须立刻去那里！”\n\n“稍等，能提个小小的请求吗？把这个交给德累斯顿的一个人，他也姓德累斯顿。”"
 GWF.87.a: "我想，如果他知道你在找他，他会自己找上门来的。"
