 MAR_the_true_heir: "真正的继承人"
 MAR_golden_cage: "金丝雀笼"
 MAR_and_the_keybearer: "以及那位手握钥匙之人"
 MAR_all_royal_court: "全体皇室侍从"
 MAR_kazembeks_people: "卡津别克的人马"
 MAR_old_bosses: "老领导们"
 MAR_the_functionary: "功能主义者"
 MAR_vox_populi: "人民之声"
 MAR_judas_will_be_in_heaven: "犹大是否能升入天堂？"
 MAR_to_urgent_matters: "回到现实"
 MAR_the_true_heir_desc: "在缙绅会议所提出的所有候选人中，唯一拥有某种统治权的只有玛丽亚·罗曼诺娃，她是那位臭名昭著的通敌者弗拉基米尔·基里洛维奇大公的女儿，而后者也正是在青年俄罗斯分子的“帮助”下，才选择退位，并将皇位让给了自己的女儿。这意味着，年仅十岁的玛丽亚女大公现在成为了全俄罗斯的女皇。然而，鉴于她尚未成年，必须建立一个摄政政权。但对卡津别克来说不幸的是，没有人能够独自统治。因此，现在必须建立一个摄政委员会，尽管不久前双方还兵戎相见，但如今却必须迫使青年俄罗斯联盟分子和维亚特卡的保皇派们同舟共济。"
 MAR_golden_cage_desc: "皇女尚且年幼，因此我们必须确保她的健康，并为她提供最好的教育。"
 MAR_and_the_keybearer_desc: "卡津别克成功地统一了西俄罗斯，保护了人民，并建立起了一支强大的军队。但让俄罗斯重获新生的重任仍然落在了他的肩上。权力越大，责任越大。而绝对的权力，则会导致绝对的腐化。"
 MAR_all_royal_court_desc: "现在是时候组建摄政委员会了。它既要代表青年俄罗斯联盟的利益，也要履行与弗拉基米尔旧部达成的协议。尽管如此，卡津别克仍然计划保留最终决定权，他在委员会中安插了几位“代表人民”的“王牌”，以此来确保自己对局势的掌控。"
 MAR_kazembeks_people_desc: "征途暂告段落。俄罗斯解放军、红军以及其他形形色色的势力，都已匍匐于我们脚下。若无弗拉基米尔·吉尔与谢尔盖·别洛泽尔斯基的鼎力相助，这场胜利断无可能！正是谢尔盖·别洛泽尔斯基，率领着我们忠于沙皇的人民武装，从一场胜利走向另一场胜利，将一切阻碍统一之路的敌人碾碎。也正是弗拉基米尔·吉尔，这位已为祖国赎罪之人，建立了固若金汤的国家安全体系，使我们无需畏惧敌人的谍报与内部的宵小。\n\n仰赖此二人的功勋，我们方能成就伟业，若不加以封赏，实乃忘恩负义。吉尔与别洛泽尔斯基将加入摄政委员会，为年少的女皇构筑坚实的依靠。忠于皇冠的情报部门与军队，将永不允许任何人将女皇陛下从宝座上推翻！"
 MAR_old_bosses_desc: "维亚特卡曾是个颇为成功的邦国。它是旧帝国官僚、纳粹通敌者与罗曼诺夫世袭贵族的奇妙融合体。最终，一支精锐的军队和一个（当然，是与雅利安兄弟会之流相比）运转顺畅的国家机器，使这片弗拉基米尔的采邑成为了一股难挡的力量。自然，如同西俄罗斯的每个割据政权一样，维亚特卡公国最终也倒在了忠于沙皇和苏维埃的联军面前，但那些旧官僚却出人意料地坚持了很久。\n\n他们中的许多人仍渴望继续为罗曼诺夫家族效力，无论是效忠弗拉基米尔三世还是玛利亚。况且，在全俄缙绅会议上，弗拉基米尔本人支持玛利亚胜出，本就是交易的一部分。让这批官僚在妥善的监管下重返国家机器，能够安抚我们阵营中那些最激进的支持者，也能让我们倾听到曾将弗拉基米尔三世（尽管短暂地）推上皇位的那些声音。"
 MAR_the_functionary_desc: "彼得·杰米契夫，一位几乎无人知晓的苏维埃官员，这在某种程度上反而是件好事。亚历山大·利沃维奇称他为“沉默的彼得”。然而，尽管他看似身居次位，杰米契夫作为一位政务干才所展现出的效率，却不能不令人瞩目。"
 MAR_vox_populi_desc: "亚历山大·利沃维奇手中并非只有王牌，亦有变数。毕竟，一个完全由效忠者组成、无人敢于质疑卡津别克的摄政委员会，若缺乏制衡，便可能将国家拖入混乱的深渊。两位来自人民的代表将成为这套制衡体系：冉冉升起的诗坛新星约瑟夫·布罗茨基，以及支持恢复神圣宗教会议的神学家鲍里斯·塔兰托夫。"
 MAR_judas_will_be_in_heaven_desc: "救赎是否可能？若人真心忏悔其罪，上帝会宽恕一切。但我们并非上帝，因此这个问题对我们而言更为复杂。弗拉基米尔绝非善类。“通敌沙皇”的烙印，或许只有弗拉索夫和他的俄罗斯解放军能与之“媲美”，但即便如此，弗拉基米尔的声名依旧染着污点。\n\n无论这对弗拉基米尔及其拥护者而言多么悲哀，退位恰恰是他偿还其叛国罪行的方式。尽管放弃了皇位，他却不能就此被“抛出”政治舞台。作为前任皇帝和父亲，他的建议对玛利亚而言将是无价之宝。毕竟，亲生父亲又怎会希望自己的女儿遭遇不幸呢？"
 MAR_to_urgent_matters_desc: "摄政委员会终于组建完成。如今，全西俄罗斯最杰出的人士将齐聚一堂，引导并教导年轻的女皇陛下，直至她能够亲自执掌权柄，君临天下。"
 MAR_maria.1.t: "旧时代的落幕，新时代的开端"
 MAR_maria.1.d: "瓦西里·马卡罗维奇·卡尔片科正在翻阅着最新一期的《致青年俄罗斯报》。他的脸上写满了困惑。因为报纸上刊登了一则关于经济部长阿列克谢·柯西金-罗曼诺夫递交辞呈的消息。令他百思不得其解的是，作为经济部长的私人秘书，他对此竟然一无所知。\n\n一个小时后，柯西金-罗曼诺夫本人来到了经济部大楼。他决定向所有的同事们道别，并感谢他们一直以来的辛勤工作。在演讲结束后，他的前私人秘书叫住了这位即将离任的部长。\n\n“阿列克谢·尼古拉耶维奇，请等一下。”\n\n“瓦西里·马卡罗维奇，有什么事吗？”\n\n“我想问您，您为什么会突然辞去部长职务呢？”\n\n“我选择离开，是因为我想将更多的精力投入到我的个人事务中去。毕竟，我的人生不仅仅是为了‘青年俄罗斯’而活，我还有我的家人和我的事业。”\n\n“那您为什么不事先告诉我呢？”\n\n“我不想让这些琐事来烦扰您。我想，对我来说，最好还是亲自将辞呈递交给卡津别克，这对他来说也是一个意外，毕竟现在他需要物色一位称职的继任者了。”\n\n与自己的前上司告别后，瓦西里回到了自己的住所，一边品尝着咖啡，一边思考着自己前上司辞职一事，久久不能平静。他在经济部的未来似乎笼罩在一片迷雾之中，动荡不安。"
 MAR_maria.1.a: "国家权力机关即将迎来剧变"
 MAR_maria.2.t: "突如其来的探戈"
 MAR_maria.2.d: "“什么？！”\n\n“您没有听错，吉尔同志。现在您是帝国安全局的局长了。”\n\n“请您理解，亚历山大·利沃维奇，克格勃，哦不，现在应该叫帝国安全局了，它确实需要进行一番大刀阔斧的改革。但说实话，我们真的需要……他们吗？”\n\n“‘保卫部’已经证明了自己的价值，不是吗？”\n\n“是的，这一点毋庸置疑。但是，您应该看看这些。”\n\n吉尔从桌子中取出一个黑色封皮的文件夹，递给了卡津别克。打开文件夹，摄政王看到了详细描述了他一天行程安排的地图、关于他的习惯、会面和爱好的报告，但最重要的是——一份关于对他进行“斩首行动”的命令，上面赫然有着叶夫根尼·梅斯涅尔和弗拉基米尔三世的签名。卡津别克脸色阴沉，重重地叹了口气，揉了揉太阳穴。片刻之后，他抬起头，将文件推回到吉尔面前。\n\n“把这些文件藏好，将来或许可以用来对付罗曼诺夫，以防他再玩什么花招。在开始对克格勃进行改革之前，先更换掉所有的通讯频道和密码。对那些‘保卫部’的成员，要严加甄别，并对他们进行24小时的监控。至于那些已经证明了自己忠诚的人，可以暂时不用理会。”\n\n“那不忠诚的呢？”"
 MAR_maria.2.a: "“就地处决。”"
 MAR_maria.3.t: "公开朗读"
 MAR_maria.3.d: "今日，本该与往常无异。纷乱的城市街头，奔走市民的喧嚣夹杂着一丝淡淡的怅惘四处弥漫。然而，世事难料，意想不到的变数总会悄然而至。\n\n一小群人聚集在城中众多图书馆的其中一座门前。很快，这里将要发生一件特别的事。一场由约瑟夫·布罗茨基本人亲自组织的活动。这位诗人决定站出来，分享他在为祖国命运忧心忡忡之际写下的诗篇。他定了定神，清了清嗓子，低下头，准备开始诵读他的作品。首先是一首短诗：\n\n无悲无喜无愁绪，\n无惧无伤无别离。\n暗夜沉沉身后去，\n天光朗朗指前期。\n回首但看牢笼里，\n叛军铁锁正幽栖。\n围墙之外梧桐老，\n拂动皇女梦影迷。\n不知何方来远笛，\n少年哨兵清音吹。\n琴声翻涌无尽处，\n浮沉回荡入空帷。\n不必思，不必语，\n心自知，意自寂。\n穹顶五重余韵在，\n碑基千载伴芳泥。\n\n这篇触动人心的创作，赢得了听众雷鸣般的喝彩。“妙啊！”的赞叹声此起彼伏。肉眼可见，大厅里涌入了更多的人，被这场活动吸引而来。\n\n约瑟夫·布罗茨基感激地向听众鞠躬，宣布公开诵读正式开始，并表示乐意向大家展示他更多的作品。与此同时，一个念头在人们心中悄然滋长：终于，出现了一位能够用激昂的言辞和优美的篇章，来表达民众心声的人了。"
 MAR_maria.3.a: "字句之力，击碎沉寂"
 MAR_maria.4.t: "冷遇"
 MAR_maria.4.d: "走进教堂昏暗的房间，卡津别克看到安季平正俯身研读着《约翰启示录》。卡津别克不想打断他，于是试图悄无声息地在对面的桌子旁坐下，但不小心用胳膊肘碰掉了挂在墙上的骑士团旗帜，旗帜应声落地。安季平被声响惊动，转过身来，将《启示录》放到一旁，然后在卡津别克的对面坐了下来。\n\n“安季平神父，我来看望您，同时也带来了一个好消息。”\n\n“您是想重建教会会议，对吗？”\n\n“什么？您是怎么知道的？”\n\n“当罗曼诺夫家的那个小女孩被宣布为女沙皇的那一刻起，一切就都已昭然若揭了。我知道您不想放弃手中的权力，当然，您为什么要放弃呢？您刚刚才征服了整个西俄罗斯。”\n\n“而这一切如果没有骑士团的鼎力相助是绝无可能实现的。我恳请您相信我们，教会会议必须恢复。教会与罗曼诺夫家族一直以来都是盟友，未来也理应如此。”\n\n“您口中的联盟究竟是怎样的联盟？主教公会制度不过是罗曼诺夫家族用来控制俄罗斯教会生活的工具罢了。上帝的仆人们将再次沦为‘保卫部’手中的玩偶，就像过去几个世纪中发生过的那样。”\n\n“我们会有所限制，但绝不会像您所描述的那样。请您相信我们，神父，请您给我和女皇一个机会。我们不会欺骗您，也不会辜负任何一位俄罗斯信徒对我们的期望。”\n\n“卡津别克，这可不是我们期望您所做的事情。您做的这一切并不符合上帝的旨意。不过，只有时间才能检验您意图的纯洁性。”\n\n骑士团的创建者从桌子旁站起身。他凝视着燃烧着的蜡烛，若有所思地点了点头，随后便回到桌前，继续研读《启示录》去了。"
 MAR_maria.4.a: "当沙皇的阴影笼罩着尘世时，上帝又能做些什么呢？"
 MAR_maria.5.t: "登基首日"
 MAR_maria.5.d: "玛丽亚看到最新一期的《致青年俄罗斯报》上刊登了一篇关于卡津别克集团，即她的支持者们，在摄政委员会的选举中大获全胜的报道。这让她感到十分惊讶。对她这个远离政治风暴中心的人来说，这一切似乎都颇为有趣。毕竟，现在的她不再是那个在部长们商讨国家大事时，时不时地在旁边碍手碍脚的小女孩了，而是未来的女皇。然而，对于自己究竟统治着什么，她还是一头雾水。在她成年前，别列兹尼基的摄政王——亚历山大·利沃维奇·卡津别克将会代她行使管理国家的职责。然而，民众们早已迫不及待地想要一睹新女皇的风采：记者、摄影师、商人，其中甚至还包括了前经济部长阿列克谢·罗曼诺夫-柯西金，他早已表示将全力支持玛丽亚·弗拉基米罗夫娜。\n\n突然，她的房间外传来了一阵敲门声。门外，一个熟悉的声音响起，那是卡津别克的声音：\n\n“玛丽亚·弗拉基米罗夫娜，民众们正在楼下等待着您的出现。您准备好了吗？”\n\n“是的，亚历山大·利沃维奇，我马上就来。”玛丽亚·弗拉基米罗夫娜回答道，随后便走出了房间。\n\n在通往大厅的走廊上，卡津别克向她询问了关于演讲稿的问题，新任女皇将在那里向聚集的人群发表讲话。\n\n“玛丽亚·弗拉基米罗夫娜，您是否已经熟悉了昨天交给您的演讲稿？”\n\n“是的，我已经读过了。但是很抱歉，恐怕我无法一字不差地背下来。”\n\n“这并不是什么问题，讲台上会为您准备一份演讲稿。如果有需要，您可以随时参考。”\n\n“谢谢您的帮助，亚历山大·利沃维奇。”\n\n“请记住，您无需紧张，这只不过是一次简单的演讲而已。”\n\n当玛丽亚走进大厅时，国防部长谢尔盖·别洛泽尔斯基正在那里发表讲话，她惊讶地发现，大厅里竟然挤满了前来观礼的人群。那里有记者，有政府官员，也有军官。\n\n“现在，让我们欢迎我们的女皇——玛丽亚·弗拉基米罗夫娜·罗曼诺娃陛下！”弗拉基米尔·谢尔盖耶维奇说道，随后，大厅里响起了雷鸣般的掌声，在人们的欢呼声中，女皇缓步走上了讲台。\n\n面对着眼前黑压压的人群，玛丽亚紧张得几乎要昏厥过去。但她很快就镇定下来，用微微颤抖的声音开始了她的演讲。"
 MAR_maria.5.a: "“首先，我要感谢那些将选票投给我的，支持我成为西俄罗斯女皇的人们…”"
 MAR_maria.6.t: "法语课"
 MAR_maria.6.d: "亚历山大·卡津别克漫步在维亚特卡宫的走廊上。他决定去拜访一下女皇，此刻她正在房间里上法语课。而此前，亚历山大刚刚对喀山进行了一次短暂的访问。\n\n敲了敲门，法语老师打开了房门。亚历山大询问他是否可以和女皇陛下谈几句话。老师回答说，现在正好是课间休息时间。\n\n当玛丽亚看到亚历山大时，脸上立刻绽放出灿烂的笑容，向他跑了过来。\n\n“您的学习进展如何？我听说您对历史很感兴趣。”\n\n“是的，亚历山大·利沃维奇。我对历史很感兴趣，我想要了解，为什么我们如今会生活在一个四分五裂的国家之中。”\n\n“那外语呢？您好像说过，您不喜欢法语。”\n\n“没错。但我一直在努力学习。有时我能听懂，有时却不行。”\n\n“但您必须坚持下去。要知道，只有通过辛勤的劳动，我们才能成为一个有用的人。”\n\n突然，法语老师走了进来，告诉卡津别克，休息时间结束了，他们要继续上课了。\n\n“好的，我这就离开。”亚历山大说道，随后与玛丽亚告别，离开了房间。\n\n当亚历山大离开宫殿时，回忆突然涌上心头。他清楚地记得女皇的父亲——弗拉基米尔·基里洛维奇大公。他记得自己因为与弗拉基米尔意见不合而被“发配”到别列兹尼基，当时的他对此无能为力。而现在，他与弗拉基米尔的命运发生了戏剧性的转变。现在，他是大权在握的摄政王，而他曾经的朋友的女儿则成为了有名无实的傀儡君主。但他很清楚，自己不可能永远操控她，迟早有一天，他必须离开摄政王的宝座。\n\n他的思绪被一名走上前来的军官打断了，军官报告说：“亚历山大·利沃维奇，您的专车已经准备好了。”对此，亚历山大·利沃维奇回答说，他马上就到。"
 MAR_maria.6.a: "未来似乎迷雾重重，难以捉摸。"
 MAR_maria.7.t: "成人的政治"
 MAR_maria.7.d: "玛丽亚在维亚特卡宫那已经无比熟悉的走廊里漫步，手中拿着一个破旧的布娃娃。突然，她被一阵嘈杂的声音打断了玩耍，那声音似乎是从一间半开着门的房间里传出来的。\n\n房间里站着亚历山大·卡津别克和一个身穿军装的人。透过门缝，玛丽亚隐约听到，他们似乎正在为什么事情争吵。\n\n“亚历山大·利沃维奇，现阶段国家安全部队已经为肃清‘雅利安兄弟会’的残党做得够多了。现在，我建议把这支部队调往其他地区，他们可以更有效地支援别的行动单位。”\n\n“鲁斯兰·雅科夫列维奇，我不认为在完全铲除雅利安分子之前，将特种部队调离是个明智的决定。”\n\n我不这么认为。”军官摇了摇头，语气稍显不耐，“现在这些家伙已经不足为惧，根本不可能组织起像样的恐怖袭击。不像以前那样了啊。肃清残党这事，交给内务部就足够了。而我们的特种部队，这时候可更需要在其他地方派上用场。”\n\n玛丽亚一边听着卡津别克和那位军官的争论，一边在心里暗暗地支持着亚历山大·利沃维奇的观点。但在内心深处，她并不明白这场争论的真正含义。她之所以支持他，仅仅是因为卡津别克在她心中是权威的象征，是临时的国家元首。\n\n当争论结束，军官走出房间后，玛丽亚走进了房间，问摄政王：\n\n“亚历山大·利沃维奇，您刚才和那个人在吵什么呀？”\n\n“哦，没什么大不了的。你还小，这些事情对你来说太复杂了。”\n\n“您知道吗，亚历山大·利沃维奇，我觉得这些关于政治的谈话实在是太无聊了。”\n\n“我太理解你的感受了。”卡津别克说道，脸上露出了一丝微笑。\n\n“好了，我要回去继续玩啦。”\n\n“去吧，好好休息。”"
 MAR_maria.7.a: "即便是大人，也总有想摆脱政治的时候。"
 MAR_maria.8.t: "赛场外的较量"
 MAR_maria.8.d: "伏特加，这种深受许多人喜爱的烈酒，正被斟满棱角分明的玻璃杯。某个夜晚，亚历山大·卡津别克与谢尔盖·别洛泽尔斯基聚在一起，讨论着刚刚尘埃落定的全俄缙绅会议的结果。\n\n“历史这东西，还真会开玩笑，不是吗？”卡津别克带着一丝揶揄的笑意说道，又往杯中添了些伏特加。“一个孩子，在争夺王位的较量中击败了一位将军。这话跟谁说去，谁都不会信，没准还要笑话一番。”\n\n“唔…你可真是，太懂得怎么‘安慰’人了…”别洛泽尔斯基喝了两口伏特加，拖长了声音回答。两人沉默了几分钟，他又接着说道：“不过，说实话，我并没那么沮丧。人生嘛，总是有输有赢。我这个献身军旅的人，再明白这个道理不过了。”\n\n“嗯…我只能表示同意。”亚历山大说着，又干了一杯伏特加。\n\n“我说这些是想表达…既然沙皇这条路打一开始就不顺遂，那我就继续在我已有的领域深耕吧。”谢尔盖一边说，一边再次将琥珀色的液体注满酒杯。\n\n“那我就提议干一杯！”亚历山大立刻举起了刚被斟满的酒杯。“敬我们！即便跌倒，也能找到力量，不顾挫败与困难，继续前行！”\n\n别洛泽尔斯基闻言大笑起来，但还是响应了提议。玻璃杯清脆的碰撞声在房间里回荡，然而，这个夜晚才刚刚开始。还有那么多事情需要商讨，那么多观点需要辩驳与支持。"
 MAR_maria.8.a: "失败亦需坦然面对"
 MAR_maria.9.t: "黑色侦探"
 MAR_maria.9.d: "最后的指令已经明确下达，弗拉基米尔·吉尔总算能松一口气了。哪怕只是片刻的喘息。近来，关于国家安全部与保卫部两大情报机构合并的传闻，已经不再是空穴来风，而是板上钉钉的事实。问题在于：合并将如何进行，又将在何时发生？\n\n这个问题，吉尔已经琢磨了一段时间，既引人好奇，也令人忧虑。这绝非简单的机构整合…不。这显然是一次足以改变力量平衡的行动。\n\n为了密切关注事态发展，弗拉基米尔早已积极地搜集情报。新的流言蜚语、几笔恰到好处的贿赂、各种盘问、可能的内部泄密——任何蛛丝马迹都可能在这盘棋中派上用场。而吉尔已经准备好，为了亲自掌控整个过程，要挖出一切能挖到的信息。\n\n他埋首于成堆的文件和命令之中，处理着日复一日的例行公事，而事件本身却似乎在以一种更为平静、更为从容的步调发展着。今天本该与其他任何一天别无二致。但就在这时，一份文件被放在了他的桌上，上面是又一道新的命令。\n\n读完文件的内容，弗拉基米尔·吉尔的脸色阴沉了下来。他一直试图掌控的进程，如今就凝结在这最后一张薄纸上。国家安全部与保卫部的合并已经完成，而吉尔甚至没能察觉这一切是如何发生的。他一拳砸在桌子上，只低声迸出一句…"
 MAR_maria.9.a: "该死的，他们到底是怎么做到的？"
 MAR_maria.10.t: "离家遥远"
 MAR_maria.10.d: "火车在铁轨上发出的规律叩击声，仿佛摇篮曲般安抚着从维亚特卡疾驰向阿尔汉格尔斯克的乘客。窗外的风景一幕幕掠过，玛利亚·罗曼诺娃只是静静地坐着，凝视远方，试图捕捉那些飞逝而过的景象中的点滴细节。\n\n她的脑海中思绪万千：这是她第一次离开维亚特卡远行，亚历山大·卡津别克关于未来事务的又一番谆谆教诲，还有与那位名叫彼得·杰米契夫的男人的意外结识。这一切都化作沉甸甸的责任感，压在她的心头…\n\n她的目光扫过空荡荡的车厢，打量着内部的陈设。这里足以容纳许多人，但此刻却只有她和杰米契夫两人。她仔细地观察着这个男人，试图弄清那张严肃面孔背后隐藏着什么？\n\n玛利亚在脑海中回味着为数不多的几次与他的交谈…他那冰冷而淡漠的眼神，永远埋首于某些文件中的样子，对许多话题几乎完全缺乏兴趣…仿佛他的心里只容得下工作。\n\n最终，玛利亚得出了结论：彼得·杰米契夫是个相当乏味的人，他的视野从未超出他的职位和那没完没了的文件与公文。她摇了摇头，轻轻站起身，准备去为阿尔汉格尔斯克的活动做些准备，也好打发这旅途中的时光。"
 MAR_maria.10.a: "数字与情感，终究是两回事。"
 MAR_maria.11.t: "上帝之声"
 MAR_maria.11.d: "鲍里斯·塔兰托夫在房间里踱着缓慢的步子，正在给玛利亚进行又一次神学辅导。这一次，他决定从历史入手，阐明信仰在过往时代的重要性。\n\n“十月革命后爆发的内战期间，布尔什维克暴露了他们可怕的一面。他们抛弃了神圣的指引，对自己本应保护的人民犯下了滔天罪行。”\n\n“但是…那他们为什么能赢呢？人民应该不会只是忍受他们的残暴吧…”玛利亚的声音带着好奇，聚精会神地听着塔兰托夫的话。\n\n“因为他们为之奋斗的东西，对人民而言至关重要。他们所主张的理念，无疑能给任何人带来真正的希望。人民寄望于有朝一日能够得到社会主义者所允诺的一切。然而时光流逝。背叛了上帝的布尔什维克，无法赐予人民梦想的实现，因为他们深知自己那可憎的谎言，也明白若不仰赖上帝，他们所说的一切都无法实现。”\n\n“也就是说…一个美好的理念，被无神论给毁了？”\n\n“正是如此。信仰帮助人们划分善与恶的界限，从而永远向善。没有信仰，这界限便会模糊不清，那些本应保护弱者的人，便可能犯下不可饶恕的罪行，沦为魔鬼的帮凶，将无辜的灵魂推向堕落。”\n\n“明白了…”玛利亚若有所思地回答，细细琢磨着听到的话。\n\n“上帝与理念…本为一体，却又如此相互依存…”玛利亚心想。"
 MAR_maria.11.a: "唯有真正的信徒，方能不偏离正道。"
 MAR_maria.12.t: "自由之声"
 MAR_maria.12.d: "走进房间，布罗茨基环顾四周。工作人员正在进行最后的准备。一切就绪后，布罗茨基在麦克风前坐定，再次整理了一下思绪，点头示意自己准备好了。广播电台开始播音。\n\n“尊敬的听众朋友们，大家好。今天我们的节目将以约瑟夫·布罗茨基先生的讲话开始。布罗茨基先生，请讲。”主持人说道。\n\n“感谢各位先生。我想向俄罗斯全体公民讲话。向我的支持者，也向并非支持我的人。我，约瑟夫·布罗茨基，怀着充分的理解与全部的责任感，愿向我国所有公民，向俄罗斯全体人民保证，作为摄政委员会的一员，我将竭尽全力，不负所有支持我与不支持我的人们的期望，成为人民声音的捍卫者与传达者，帮助实现人民所有的理念与愿望。”布罗茨基的讲话语气相当平静，但偶尔会因为能加入摄政委员会以及由此带来的机遇而流露出些许激动的情绪。"
 MAR_maria.12.a: "向着自由，前进！"
 MAR_maria.13.t: "各司其职"
 MAR_maria.13.d: "卡津别克的办公室。摄政本人和刚到的维利奇科夫斯基都在。不知抽了第几根烟，烟雾弥漫了整个房间，两人已经讨论了一个钟头的政治格局，既展望未来，也回顾过往。关于还能邀请谁加入摄政委员会的讨论陷入了僵局，两人已经沉默地思考了五分钟。\n\n“亚历山大·利沃维奇，如果我们邀请那位前维亚特卡官僚，思想上顽固保守的瓦西里·维塔利耶维奇·舒尔金，您觉得怎么样？”维利奇科夫斯基说着，捻熄了烟头，将其按入已经堆满同样烟蒂的烟灰缸中。\n\n“唔…”摄政陷入沉思，他从扶手椅上站起来，缓缓在办公室里踱步。走到政府会议桌旁停下，双手搭在一张椅子的靠背上，卡津别克转头看向维利奇科夫斯基。“我想这是个不错的主意。但我们还需要更多人选。”亚历山大·利沃维奇说道。维利奇科夫斯基又掏出一根烟，点燃了。"
 MAR_maria.13.a: "继续斟酌。"
 MAR_maria.14.t: "不要凝视深渊"
 MAR_maria.14.d: "别列兹尼基的中央公园景色宜人，是商务会谈的热门地点。斯梅斯洛夫斯基也决定与某人在此会面，不在尘土飞扬的办公室，而是在清新的空气中。他在喷泉附近来回踱步，每次走到一条无形的界线便折返，等待着来自维亚特卡的那个人。又过了几分钟，就在约定的时间，一个人影从通往喷泉的小径拐角处出现。不到十秒钟，那人便走到了斯梅斯洛夫斯基面前。\n\n“您是斯梅斯洛夫斯基先生？”他开口问道。\n\n“正是。”斯梅斯洛夫斯基简洁地回答。\n\n“那么，很高兴见到您。”那人说着，伸出了手。\n\n“彼此彼此。”斯梅斯洛夫斯基也伸出手，与这位前保卫部的审讯官握了握手。这位审讯官和许多前秘密警察成员一样，加入了新成立的情报安全局，并在别列兹尼基及沙皇统治区的情报机构发展中扮演了极有影响力的角色。\n\n握手之后，两位情报官员沿着公园的小径缓缓走去。几乎立刻，两人便开始了交谈。话题起初围绕着两个旧情报机构的过往，随后平稳地过渡到讨论新成立的情报安全局，期间甚至不时传来这两个昔日几乎是敌人的人的笑声。如同之前一样流畅自然，讨论又转向了新机构当下的能力，以及未来将如何发展壮大。"
 MAR_maria.14.a: "未来安危尽在掌握。"
 MAR_maria.15.t: "亚历山大·伊萨耶维奇的一天"
 MAR_maria.15.d: "自从弗拉基米尔三世失势以来，亚历山大·伊萨耶维奇几乎在默默无闻中虚度光阴，今天的计划也并无新意。处理完那些他自认为重要、实则几乎无足轻重的事务回到公寓后，他用了午餐，便坐到打字机前，投身于创作之中。索尔仁尼琴沉浸在工作中数小时，直到一阵门铃声打断了他的思绪。他从工作台前起身，走向门厅，打开了房门，发现门口站着一位邮递员。\n\n“亚历山大·伊萨耶维奇，有您的信件，请签收。”邮递员说着，递过签收单。签收后，索尔仁尼琴接过了信件，邮递员道别离开，而亚历山大·伊萨耶维奇关上门，转身回到了书房。一进书房，索尔仁尼琴便已知道信来自何处——他在收到信时瞥了一眼信封，寄信人竟是摄政亚历山大·利沃维奇·卡津别克本人！这让他大为惊奇。他拆开信封，展开信纸，读了起来……\n\n“尊敬的亚历山大·伊萨耶维奇，您好。我是摄政亚历山大·利沃维奇·卡津别克的秘书。闲言少叙，直入正题。根据摄政的指示，作为维亚特卡前任显要官员，兹邀请您重返风起云涌的政治生活，加入摄政委员会，并担任沙皇国经济部长一职。您可以仔细考虑，审慎决定，我们对此不设时限，但仍恳请您尽早做出答复。”\n\n读罢，索尔仁尼琴跌坐在他的工作椅上。稍作沉吟后，他站起身，开始准备行装，去赴一场与摄政的会面，也是去迎接他未来的命运。"
 MAR_maria.15.a: "这正合我意。"
 MAR_maria.16.t: "犹大将会与我同在"
 MAR_maria.16.d: "沙皇家族的宫殿宏伟壮观。宫殿内有无数的房间和空间：走廊、大厅、客厅、卧室以及其他各种厅室。这一天，在其中一间客厅里，一对父女——弗拉基米尔三世和玛利亚一世——正在休憩。父亲读着报纸，女儿则在玩着她的众多玩具。\n\n“女儿。”弗拉基米尔开口道。\n\n“什么事，爸爸？”她放下玩具，抬头看向父亲。\n\n“看你有新玩具了。是亚历山大·利沃维奇送的？”他问道。\n\n“嗯。是他送的。”玛利亚回答。\n\n“好玩具。我看到他还送了你新书。那些也是他送的吧？”弗拉基米尔又问。\n\n“是的，父亲。有些玩具和书是他亲手送给我的。”玛利亚答道。\n\n“唉…有时候感觉，这不像是礼物，倒像是他的施舍。”弗拉基米尔说着，翻过一页报纸。\n\n“爸爸，怎么会呢？他送的时候还笑着，说了祝福的话呢。”玛利亚惊讶地说。\n\n“是啊，可他这样做是真心的吗？还是仅仅因为需要这样做，好让自己看起来很正面？算了，不说这些了。”弗拉基米尔说着，再次举起报纸，藏在了后面。\n\n谈话过后，玛利亚陷入了某种困惑。她越是琢磨这段对话，就越觉得难以理解，而卡津别克的所作所为，不知为何，似乎也不再显得那么友善了。"
 MAR_maria.16.a: "卡津别克叔叔…"
 MAR_maria.17.t: "奇怪的一天"
 MAR_maria.17.d: "在过去的几个月里，一切都出奇的平静…甚至可以说是过于平静了。什么事情都没有发生，没有任何突发事件。Nothing Ever Happens?或许是这样吧。但很明显，事情不该是这样的。所以，很抱歉，这位作弊者（又或许您是一位测试员，如果是的话，我为自己的粗鲁言辞向您道歉？），接下来不会发生任何事情了。"
 MAR_maria.17.a: "命运无法逃避…"
 maria_magica.1.t: "疑虑"
 maria_magica.1.d: "维亚特卡的夜晚总是如出一辙：梳洗、晚餐、功课、向父亲和摄政王道晚安，然后就寝。这一天，和过去无数个日子一样，按部就班，毫无波澜。玛丽亚似乎已经开始习惯“女皇”这个身份带来的生活了。\n\n“玛丽亚·弗拉基米罗夫娜，如果您有任何需要，请随时吩咐。”女仆说道，然后轻轻地走出了房间。\n\n“克拉夫季娅·叶夫多基莫夫娜，谢谢您的关心，我今天晚上不需要任何帮助了。”玛丽亚平静地回答道。目送着女仆离开后，她走到床边。\n\n在疲惫感的驱使下，她一头倒在了床上，再次陷入了沉思。“我累了，”她轻声对自己说道。“难道萨沙叔叔和爸爸就不能自己处理好国家大事吗？为什么偏偏需要我来做这些事情呢？无休止的会议、舞会和访问。还有那个…叫什么来着，鲍里斯·阿列克谢耶维奇，他总是让我感到毛骨悚然…我很难信任他。”想到这里，玛丽亚沉重地叹了口气。“也许，我当初就不该成为女皇”，“我不想，我不愿意，我只想回到过去那种无忧无虑的生活，我好害怕……”她将脸埋进枕头里，喃喃自语着，这是玛丽亚入睡前最后的思绪，随后她便沉沉地睡去。"
 maria_magica.1.a: "也许，还有别的选择…"
 maria_magica1_tt: "§W似乎找到了一个极具魔法潜质的候选人§!"
 maria_magica.2.t: "梦境"
 maria_magica.2.d: "夜晚的忧虑渐渐被梦境取代，眼前的景象不断变幻。然而这一次，玛丽亚感觉到了一丝异样。她缓缓睁开眼睛，发现自己身处一个难以理解的空间：空中漂浮着建筑的碎片，地面上开满了菊花，整个景象闪烁着斑斓的色彩。\n\n“我…这是在哪儿？”玛丽亚脱口而出，说出了脑海中第一个念头。她环顾四周，发现自己手中握着一柄金色的长矛，矛柄上镶嵌着小巧的时钟。她的衣着也与寻常少女大相径庭，即便是女皇也不会穿成这样。此刻的她，更像是一位来自远古神话的战士，但这…真的是现实吗？这究竟是怎么回事？\n\n“喂，玛莎，别发呆！”一个陌生的金发女孩朝她喊道，女孩看起来和她年纪相仿，正挥舞着一把军刀，绕着一个形状怪异的黑色生物跳来跳去。“机会稍纵即逝，魔女现在很脆弱，快上！”\n\n“好……好的，我这就来！”玛丽亚下意识地回答道，她高高跃起，然后向前冲去。将手中的长矛向前刺出，她准确地刺穿了那个黑色物体的脖子。随后，那个怪物发出了一声刺耳的尖叫，它的身体开始不断膨胀，最终像气球一样爆炸开来。周围那超现实的景象开始消退，取而代之的则是一片位于城市边缘的森林。\n\n“配合得不错，对吧？”那个女孩笑眯眯地跳到她身边，“丘比，你说呢？”\n\n“没错，你们的配合天衣无缝。如果你们能一直保持这样的状态，那就再也不用担心‘悲叹之种’短缺了。”一只长得像猫的白色小动物说道。\n\n“啊——？”玛丽亚还没来得及反应，就被一阵闹铃声打断了。她猛地坐起身，四处张望。“原来是场梦……可是，我在梦里感觉好快乐。要是这一切都是真的…”她语气中带着一丝怅然。但有什么地方不对劲，窗台上坐着一个…\n\n“你好，玛丽亚。”梦里那只白色小动物开口说道。"
 maria_magica.2.a: "看来，我还在做梦吧..."
 maria_magica2_tt: "§W候选人到位，接受的可能性相当高§!"
 maria_magica.3.t: "相遇"
 maria_magica.3.d: "玛丽亚使劲地揉了揉眼睛，试图将残留在脑海中的梦境彻底驱散。“这不可能啊，”她喃喃自语道，缓缓地睁开了双眼。然而…那个小家伙仍然坐在窗台上，静静地看着她，那对粉红色的眼睛中似乎带着一丝关切。◕ ‿‿ ◕\n\n“玛丽亚，你不用担心，我真的存在，而且这也不是你的梦境。”一个声音响起，这声音不知从何而来，因为这个…小猫咪仍然静静地站在那里，轻轻地摇晃着自己的尾巴。\n\n“啊，等等，等等，你是谁？为什么会出现在我的梦里？”玛丽亚再也无法保持冷静了，她冲着眼前的这只小动物问道，声音中带着一丝颤抖。\n\n“我叫丘比，我是来邀请你成为一名魔法少女的。至于我为什么会出现在你的梦中，这一点我也不得而知，也许，就像你们人类常说的，这是个‘预知梦’吧。”一个声音从窗户的方向传来。\n\n“魔法少女？…为什么要选我，这究竟是怎么回事？我需要做什么吗？”玛丽亚疑惑地看着丘比，一连串的问题脱口而出。\n\n“没错，成为一名魔法少女，你将会获得一种神奇的力量。我能感受到，你拥有着巨大的魔法潜能，这也是我来到这里的原因。为了让你获得这种力量，你必须许下一个愿望。”丘比说道，同时轻轻地歪了歪头。\n\n“愿望？我真的可以许下任何愿望吗？你都能帮我实现？但是，作为交换，我是不是也需要付出什么代价呢？”\n\n“没错，我可以实现你的任何一个愿望。而作为交换，你必须与魔女战斗。”\n\n“好吧，但…我究竟该许下什么愿望呢…？”玛丽亚抬头望向天花板，开始认真地思考起来。“啊！我知道了，”她用坚定的语气说道，“丘比，你真的能实现任何愿望吗？”\n\n“没错，任何你想要实现的愿望。”丘比用同样坚定的语气回答道。\n\n“好吧，丘比。我…我可以再考虑一下吗？”\n\n“当然可以，是否要成为一名魔法少女完全取决于你自己的意愿，因此，我无权强迫你。”"
 maria_magica.3.a: "我没办法立刻做出决定…"
 maria_magica3_tt: "§W我们无法窥探她的内心，只能静候她的决定§!"
 maria_magica.4.t: "愿望"
 maria_magica.4.d: "清晨的第一缕阳光透过窗帘的缝隙，洒落在房间的地板上。玛丽亚也开始了自己忙碌的一天。如果不是那只如影随形般跟着她的白色小动物——丘比的话，这或许会是一个普普通通的早晨。就像一只家猫一般，丘比总是寸步不离地跟着玛丽亚，要么静静地坐着，要么在她的脚边走来走去，仿佛一切都理所当然。\n\n“丘比，你能不能别在我周围晃来晃去？会被人看见的。”玛丽亚低声说道。\n\n“不用担心，现在只有你能看见我。所以，没必要为此感到不安。”\n\n“是吗？那好吧，但愿如此……”\n\n今天，女皇计划前往伊热夫斯克的一家兵工厂进行视察。此次访问为期一天，因此他们将在中午出发。\n\n在完成了所有的准备工作后，玛丽亚被护送上了一辆早已等候多时的汽车。\n\n在宽敞的车厢里，坐着卡津别克、斯米斯洛夫斯基以及玛丽亚的父亲——弗拉基米尔·基里洛维奇。车内的气氛异常压抑，似乎随时都可能爆发一场激烈的争吵。汽车缓缓启动，但紧张的沉默却并未被打破。\n\n“鲍里斯·阿列克谢耶维奇，您真的有必要亲自陪同吗？”卡津别克打破了沉默，率先开口问道。\n\n“作为摄政委员会的一员，我有权陪同女皇出访。”斯米斯洛夫斯基带着一丝嘲讽的口吻回答道，“难道我说的有错吗？”\n\n“不管怎么说，我认为您的出现毫无必要。”摄政王说道，语气中带着一丝毫不掩饰的厌恶。\n\n“那你打算怎么办呢，摄政王？把我赶下车，扔到路边的树林里吗？当初可是你一手策划了这场可笑的闹剧，先是搞选举，然后又是摄政，甚至连女皇的生父都在这里，简直就是一场滑稽戏。怎么？难道你对人民的选择感到不满吗？要我说，如果当初还是柯西金和别洛泽尔斯基掌权，至少你还能保住自己的位子，哪像现在这样，说话都没人听。”\n\n“鲍里斯，你最好给我注意点…”亚历山大强压着怒火，咬牙切齿地说道。\n\n“好了，都给我安静！”弗拉基米尔·基里洛维奇打断了他们之间的争吵，“现在不是吵架的时候！”\n\n在接下来的行程中，车内始终笼罩着令人窒息的沉默。应玛丽亚的要求，他们缩短了在工厂的停留时间，并声称自己“身体有些不适”。尽管卡津别克对此表示了强烈反对，但他们还是这样做了。\n\n夜幕再次降临，现在又是上床睡觉的时间了。玛丽亚装作若无其事的样子，似乎她对在车上听到的那些谈话充耳不闻。\n\n“丘比，你还在吗？”女孩低声问道。\n\n“我就在这里，玛丽亚，你做出决定了吗？”就像变魔术一般，那只白色的小动物再次出现在了窗台上。\n\n“…是的。丘比，我希望，缙绅会议的结果能够有所不同。”玛丽亚说道，眼神中充满了坚定。\n\n“这就是你的愿望吗？如你所愿。”丘比说道。"
 maria_magica.4.a: "随后，整个房间都被耀眼的白光所笼罩…"
 maria_magica4_tt: "§W这个愿望搅动了命运的熵流，它将引向何方？§!"
 maria_magica.5.t: "两个王朝"
 maria_magica.5.d: "维亚特卡，罗曼诺夫家族的府邸一片祥和。这甚至有些不同寻常。要知道，今天，沙皇谢尔盖将会造访这里，而这样的事情可并不常见。但或许，所有的准备工作都已经就绪了：厨房里早已准备好了丰盛的晚宴，贵宾的住所也已安排妥当。而弗拉基米尔·基里洛维奇本人，这位在缙绅会议后成为了维亚特卡总督的人，也显得格外轻松。\n\n“弗拉基米尔·基里洛维奇，沙皇的车队来了。”门房的声音突然响起，打断了总督在花园中的小憩。\n\n“好的，阿尔卡季，我亲自去接他吧，希望一切都能顺利进行。”说着，罗曼诺夫从长椅上站起身，走出了凉亭，朝着大门走去。\n\n他看到，在栅栏的远处，出现了一个由几辆汽车组成的小型车队，其中包括两辆GAZ-M1，一辆ZIS-150，以及一辆相当新的美国产“大陆”牌轿车。随着车队越来越近，仆人们脸上的紧张神情也愈发明显。只有弗拉基米尔·基里洛维奇能够始终保持着镇定自若的神态。\n\n出乎所有人意料的是，第一次来到这里的谢尔盖·谢尔盖耶维奇对眼前的一切赞不绝口。夜幕即将降临，在一片轻松愉快的氛围中，维亚特卡的前任沙皇与现任西俄罗斯沙皇围坐在桌旁。\n\n“怎么样，这顶‘莫诺马赫王冠’，您还满意吗，谢尔盖·谢尔盖耶维奇？您有什么感想？”\n\n“弗拉基米尔·基里洛维奇，老实说，我还真没什么可抱怨的。正如您所知，治理国家可不是一件轻松的差事，但作为一名沙皇，这是我的责任，我义不容辞。”\n\n“您说得很对。我很好奇，如果换作其他人，能否像您一样出色地完成这项工作呢？”\n\n“我不喜欢假设，弗拉基米尔。但是，思考一下总是有必要的。嗯…”\n\n突然，谢尔盖·谢尔盖耶维奇的脸色变得苍白，他摇晃着身体，用手紧紧地捂住了自己的脑袋。“不，这不对劲，我明明…”\n\n“医生！快叫医生！”罗曼诺夫从椅子上跳了起来，大声喊道。\n\n“不，不用了，没事的，只是…脑海中突然闪过一些奇怪的画面。”谢尔盖深吸了一口气，回答道。"
 maria_magica.5.a: "“谢尔盖，如果你愿意，今晚可以在这里休息。”"
 maria_magica5_tt: "§K新世界出现了第一道裂痕§!，§l终结的开端§!"
 maria_magica.6.t: "初试锋芒"
 maria_magica.6.d: "这…这真的发生了。起初，玛丽亚还不敢相信自己的眼睛，她开始环顾四周。她的卧室变得比以前空旷了一些，有些东西已经不见了。她看向窗户，发现那只小动物仍然站在那里。\n\n“丘比，这…这一切都是真的吗？”玛丽亚轻声问道。\n\n“没错，一切都按照你的意愿发生了改变。”丘比回答道。\n\n“按照我的意愿？你这话是什么意思？”玛丽亚歪着头问道。\n\n“在这条时间线中，我还是第一次见到你。所以，很有可能，你许下了一个与改变过去有关的愿望。”\n\n“啊，你说得对…”玛丽亚咬着嘴唇，欲言又止。\n\n“好吧，看看你的左手，你看到那枚戒指了吗？”\n\n“看到了，但这究竟是什么？它不是应该像一个鸡蛋吗？”玛丽亚看着自己手上多出来的那枚镶嵌着一颗绿色宝石的戒指，疑惑地问道。\n\n“那是你的‘灵魂宝石’，你必须好好保管它，因为如果它破碎了，你就再也不能使用魔法了。”\n\n“好吧，但我现在该怎么做呢？”女孩继续向丘比提问道。\n\n“在脑海中想象一下‘灵魂宝石’变成鸡蛋的形状，然后用手触摸它。”\n\n“明白了……”玛丽亚闭上眼睛，握住了手中的水晶。她的衣服突然闪烁起来，变成了一套盔甲，另一只手中出现了一柄金色的长矛。她睁开眼睛，低声说道：“就像梦里一样……”她从床上跳下来，开始挥舞长矛，就像她在为数不多的电影中看到的那样。由于太过投入，长矛不小心把一把椅子劈成了两半。椅子碎裂的巨响让玛丽亚回过神来，她突然恢复了平常的模样：盔甲消失了，取而代之的是她平常穿的睡衣。\n\n“玛丽亚，我不建议你这样随意挥霍你的魔力，如果你消耗太多魔力，你会遇到麻烦的。”丘比的声音突然响起。\n\n“啊…对，你说的对，但稍微玩一下也不行吗？”玛丽亚回答道，“这多有趣啊！”\n\n“无论如何，还是小心为好。”\n\n“是你给了我这种力量，现在又要求我不能使用它。好吧，我会小心的。”她喘着气回答道。"
 maria_magica.6.a: "不过，椅子还是得收拾一下…"
 maria_magica6_tt: "§W初为魔法少女时，往往都不够谨慎§!\n§K绝妙的开局，不是吗？§!"
 maria_magica.7.t: "搜寻"
 maria_magica.7.d: "维亚特卡，凌晨12点30分。此时，这座城市已经进入了梦乡，普通人要么正在睡觉，要么在值夜班。街道上空无一人，除了几只流浪动物和无家可归者，本不应该有其他人的存在。但有什么东西打破了这幅画面，一个穿着相当体面的女孩，独自一人在这些昏暗的小巷中徘徊。这个女孩是维亚特卡省总督的女儿——玛丽亚·弗拉基米罗芙娜·罗曼诺娃。当然，现在很难再称她为普通的女孩了…她悄悄地溜出了家门，在城市的郊区和工业区四处游荡，手中握着一颗闪闪发光的宝石。\n\n“丘比，我这样做真的对吗？我已经按照你说的，在城市里转了好几天了，但一个魔女也没找到。”\n\n“是的，魔女通常出现在自杀和暴力犯罪率异常高的地方…”\n\n“它闪烁了！也就是说附近有魔女？”玛丽亚打断了他。\n\n“是的，往闪烁最强烈的地方走。”\n\n“好。”玛丽亚点点头。\n\n玛丽亚朝着一条小巷跑去。突然，她的步伐变得沉重起来，周围的景象开始扭曲成一团难以名状的混沌。通往死胡同的小路开始延长，在它的尽头，坐着一个仿佛活过来的麦穗。周围飞舞着飞机，它们像鸟儿一样拍打着翅膀。\n\n尽管玛丽亚从未在现实中遇到过类似的情况，但她很快就明白，这就是所谓的“魔女”。她将灵魂宝石抛向空中，变身成魔法少女的形态，摆出了战斗的姿势。“这算不算……实战演练？不管了。”玛丽亚说道，冲向了麦穗。\n\n但当她靠近麦穗大约十米时，那些鸟儿一样的飞机开始向她扑来，让她失去了平衡。玛丽亚惊慌失措地挥舞着长矛，试图驱赶它们。与此同时，麦穗本身开始移动，用它的叶子将她击退了数十米。她的背部撞到了坚硬的物体上，本能地闭上了眼睛，做好了最坏的打算……但片刻之后，玛丽亚睁开了眼睛，看到一个比她大两岁左右的女孩，挥舞着一把军刀，将麦穗砍成了碎片。魔女瞬间化为乌有，周围的环境开始恢复正常，一颗灰色的石头落入了另一个魔法少女的手中。\n\n随后，那个女孩落在了地上，看向了玛丽亚。“看在你是新来的。这次我就把悲叹之种分给你，但下次可别指望我会手下留情。”她说，并把石头扔向玛丽亚躺着的墙边。玛丽亚还没来得及说话，那个女孩就跳上了屋顶，消失在夜色中。"
 maria_magica.7.a: "我连句谢谢都还没说呢…"
 maria_magica7_tt: "§W魔法少女之间的冲突，本就是她们命运的一部分§!\n§K肩负这一重担，并不轻松，对吧？§!"
 maria_magica.8.t: "新的伙伴"
 maria_magica.8.d: "“晚安，玛丽亚·弗拉基米罗夫娜。”\n“您也一样，克拉夫季娅·叶夫多基莫夫娜，像往常一样，夜里不需要您为我做任何事。”玛丽亚看着女仆离开的背影说道。\n事实上，玛丽亚此刻根本没有就寝的打算。再过一个小时，她就将动身前往维亚特卡的夜幕下的街头巷尾，搜寻魔女的踪迹。她仔细地在自己的房间里布置出了一副自己正在熟睡的假象，然后轻轻地打开窗户，一跃而出，悄无声息地消失在了夜色之中。\n\n对玛丽亚来说，猎杀魔女已经成为了某种习以为常的事情。尽管并非每次行动都能满载而归，但她也已经积累了足够的经验，足以应对绝大多数的魔女了。“哎，我都快忘了这种活动的滋味了。”一边说着，玛丽亚一边活动着自己的筋骨，她回想起白天发生的一切。清新的空气和夜晚的凉意驱散了她的困倦，只有一个轻轻的哈欠，透露出了一丝疲惫。\n\n灵魂宝石开始闪烁，狩猎的时刻到了——她只需要找到魔女的结界，然后开始战斗即可。周围的景象再一次变得光怪陆离，如同出自一位抽象派画家之手的画作，而玛丽亚也摆出了战斗的姿态。\n\n突刺，向左，跳跃，翻滚，格挡，向右，攻击——这位经验丰富的魔法少女依靠着战斗本能行云流水般地化解着敌人的攻势。转瞬间，魔女已是门户大开，破绽百出，正是给予其最后一击的最佳时机…然而，她的手却不听使唤地滑过了枪杆，无意中触碰到了那从未被她使用过的时间之轮。紧接着，她发现自己竟然出现在了一米之外的地方。\n\n这突如其来的变故让玛丽亚措手不及，而魔女却抓住了这稍纵即逝的战机，用一根幸存的触手击中了她的腹部，将她击飞了十几米远。\n\n“该死，这是怎么回事…”玛丽亚一只手撑着长枪，另一只手捂着受伤的腹部，喃喃自语道。\n\n就在她开口说话的瞬间，一个身影如疾风般闪过，将那只魔女彻底消灭。不…这是另一位魔法少女，而且…她抢走了那枚“悲叹之种”！\n\n“喂，难道没人教过你不要抢别人的劳动果实吗？”玛丽亚强压着怒火，质问道。\n“啊，这里还有其他人吗？”对方带着一丝戏谑的口吻答道。\n“交出‘悲叹之种’，看在上帝的份上。”\n“哦？那你倒是来抢回去呀，可别输了哭鼻子哦。”\n“我本无意与其他魔法少女兵戎相见，但既然你执意如此，那就怪不得我了。”玛丽亚咬牙切齿地说道，将长枪对准了那位不速之客。\n“来吧，让我们看看究竟谁更胜一筹…”\n\n就在这时，长刀与长枪猛烈地撞击在了一起。尽管玛丽亚在之前的战斗中已经负伤，但她仍然凭借着精湛的技巧，游刃有余地格挡着对方的每一次攻击。另一位魔法少女的动作也同样敏捷，但相比之下却显得有些粗糙。“你输了！”玛丽亚低喝一声，一记突刺将对手击倒在地，并将长枪对准了对方的心脏。\n\n“认输吗？”\n“嘿嘿，好吧，我认输。你很强，我本以为你无法同我抗衡呢。能告诉我你的名字吗？”\n“玛丽亚，你呢？”玛丽亚说着，收回了长枪，恢复了平时的模样。\n“索菲亚，我们或许能够成为朋友，你觉得呢？”她露出了友善的微笑，向着自己的“手下败将”伸出了手。\n\n“嗯，我也是这么想的。回见。”玛丽亚握住了对方的手，表示同意。"
 maria_magica.8.a: "一段友谊就此展开？"
 maria_magica8_tt: "§K尘封已久的回忆§!，§l那场争执，反倒让羁绊更加深厚…似曾相识吧？§!"
 maria_magica.9.t: "团队"
 maria_magica.9.d: "“呼…最近这些魔女出现的频率也太高了吧，这已经是这星期的第四个了，”索菲亚气喘吁吁地说道，一屁股坐在了维亚特卡郊外的一小片空地上。\n\n“喂喂，我们之前不是还在抱怨魔女太少了吗？”玛丽亚笑着回答道。\n\n“也对。对了，玛莎，我们一起并肩作战已经三个月了，但彼此之间还不太了解，明天白天你有空来市中心一趟吗？”\n\n“呃，我会尽量抽出时间的，哈哈，”玛丽亚对这突如其来的提议感到有些措手不及。\n\n尽管玛丽亚心中对这次会面仍然抱有一丝疑虑，但她最终还是决定赴约。夜晚的维亚特卡对她来说并不陌生，但白天的景象她却鲜有机会欣赏。大多数时候，她只能在庄园里消磨时光，很少有机会到城里自由活动。\n\n当她到达约定的地点时，远远地就看到一个女孩正朝着她挥手。不难猜出，这正是索菲亚。玛丽亚缓缓地向她走去。“喂，你怎么走得跟乌龟一样慢啊？”索菲亚的声音远远地传来。\n\n“喂，我们又不是赶着去投胎，用得着这么着急吗？”\n\n“你没听说过一句话吗？‘早起的鸟儿有虫吃’。我找到一个超棒的地方，就在医院附近，那里的东西好吃极了。”\n\n“我记得那句话好像是说工作的…”\n\n“哎呀，有什么关系啦，快走吧。”\n\n终于，她们来到了索菲亚口中的“那个地方”，出现在两位少女眼前的，是一间小巧而精致的木制小屋，门楣上挂着一块写有“面包房”字样的招牌。\n\n“你就为了带我来这种地方？”玛丽亚一脸疑惑地问道。\n\n“对呀，快进去吧。”\n\n伴随着吱呀一声轻响，小屋的门被推开了，两人走了进去。里面的陈设虽然朴素，却也别有一番韵味。索菲亚指了指其中一张桌子，两人便在那里落座。在舒适的软垫座椅上坐定后，两位少女开始天南地北地聊了起来：生活琐事，日常的烦恼，还有学校里的趣闻。然而，这段惬意的时光并没有持续多久。她们的谈话被一阵轻微的闪烁打断——那是灵魂宝石发出的光芒，预示着附近出现了魔女。\n\n“真扫兴，我还有好多好多话要跟你说呢，”索菲亚的声音中带着一丝沮丧，仿佛是在对那闪烁的水晶抱怨。\n\n“以后有的是时间聊天，现在该干正事了，”玛丽亚抓起灵魂宝石说道，“走吧。”"
 maria_magica.9.a: "她们的战斗仍在继续。"
 maria_magica9_tt: "§W并肩而战的魔法少女们，能更高效地猎杀魔女§!\n§K曾以为，这种日子会永远持续下去…§!"
 maria_magica.10.t: "灾难"
 maria_magica.10.d: "玛丽亚和索菲亚——这对所向披靡的魔法少女组合，将近一年以来，只专注于一件事：与魔女和使魔战斗。在漫长的战斗生涯中，她们早已将一切磨合得天衣无缝——战术，队形，以及无数其他能够确保战斗胜利的细枝末节。她们击败的怪物早已数不胜数，似乎没有任何事物能够动摇这支队伍坚不可摧的羁绊。\n\n自从她们相遇以来，她们的狩猎范围已经扩大到了整个维亚特卡省及其周边地区。如果情况需要，她们甚至能够在一夜之间奔袭数十公里。一切仿佛都将这样永远地持续下去。\n\n“玛莎，看到那座村庄了吗？”索菲亚指着前方说道，“我好像察觉到了什么，我们过去看看。”\n“我有一种不祥的预感，不过，我会和你一起去，”玛丽亚点了点头，回应道。\n\n两位魔法少女沿着山坡向下走去。随着她们不断靠近村庄，周围的气氛也变得愈发凝重。村庄里空无一人，寂静得令人窒息，甚至连魔女的踪迹都无法寻觅。这死一般的寂静仿佛在诉说着，这里不久前还曾有过生命的气息。环顾四周，她们注意到附近的一间谷仓里似乎有些动静。两人快步走上前，推开了那扇虚掩着的门。在干草堆中，躺着一个比她们年纪稍小的女孩，她正低声嘟囔着什么。\n\n“我恨这一切，我恨，我恨…我为什么要经历这些，上帝啊，请你原谅我…我恨这一切。”\n“喂，你还好吗？发生了什么事？”玛丽亚关切地问道。但女孩却没有任何反应。\n“等等，她手里拿着…灵魂宝石，而且它几乎已经完全黑掉了！”索菲亚惊呼道。\n“让这一切都见鬼去吧…”女孩喃喃低语道。\n突然，灵魂宝石碎裂了，一个如同“悲叹之种”般的物体从中浮现出来。一股强大的冲击波从女孩身上迸发而出，瞬间将破旧的谷仓夷为平地，并将两位魔法少女远远地抛飞了出去。当尘埃落定后，周围的一切都化作了一片迷宫般的景象。无需多言，两位魔法少女立刻与魔女展开了殊死搏斗。在她们成功击败魔女后，丘比如同变戏法般突然出现在了她们的面前。\n“丘比，这究竟是怎么回事？”索菲亚一把揪住这只小东西的脖子，怒吼道。\n“暴力解决不了任何问题，不过，我会回答你们所有的问题，”丘比回答道。"
 maria_magica.10.a: "真相大白之时。"
 maria_magica10_tt: "§W正如少女终将长大成人，魔法少女亦迟早沦为魔女§!\n§K残酷的真相§!，§l足以摧毁一切§!"
 maria_magica.11.t: "漫漫长夜"
 maria_magica.11.d: "玛丽亚和索菲亚并排坐在火车车厢的座位上，这列火车正从维亚特卡驶向阿尔汉格尔斯克。最近有传言说，“魔女之夜”——有史以来最为强大的魔女，即将降临到那里。当然，这一消息的真实性无从考证，但全国各地的许多魔法少女仍然蜂拥而至，聚集到这座城市，准备迎接这场浩劫，或许……她们还心存着一丝侥幸，认为自己能够击败那传说中的魔女。\n\n“如果我们孤军奋战，能够战胜那‘魔女之夜’吗？”玛丽亚向着坐在对面的少女问道。\n“能不能无所谓吧。”索菲娅微微叹了口气，语气平淡得像是在述说无关紧要的事情。\n\n自从丘比那里得知了真相后，索菲亚就仿佛变了一个人似的。原来所有魔女曾经都是和她们一样的魔法少女，这一残酷的事实，在她的心灵深处留下了一道永远无法愈合的伤痕。玛丽亚也同样被这个真相深深地震撼了，但她却能够克制住内心的恐惧，继续前行。又或许，她只是竭尽全力，不让任何人察觉到她内心的波澜而已。\n\n在“魔女之夜”预计降临的三天前，列车抵达了阿尔汉格尔斯克。这座城市里已经聚集了十几位魔法少女，每一位少女都拥有着属于自己的故事，属于自己的愿望，属于自己的目标。玛丽亚和索菲亚也身处其中。在如此紧迫的时间内，她们勉强制定出了一套对抗“魔女之夜”的作战计划。这套计划漏洞百出，但聊胜于无。\n\n终于，那一天到来了。所有的魔法少女都在城市的各个角落严阵以待，静候着那场灾厄风暴的降临。狂风呼啸，而在地平线的尽头，一个巨大的飞行物正在迅速靠近。无需多言，那正是“魔女之夜”。随着一位少女的怒吼“进攻！”，所有的魔法少女都开始行动起来。\n\n与其他魔女不同，这只魔女拥有着压倒性的力量。所有的魔法少女都已经竭尽全力，但“魔女之夜”的力量似乎永无止境。随着时间的推移，伤亡人数开始不断增加。先是一名魔法少女倒下了，然后是第二名，第三名…没过多久，所有的魔法少女中就只剩下了那对来自维亚特卡的搭档。突然，索菲亚一把抓住自己的同伴，带着她一跃而起，跳到了附近一栋残破建筑的屋顶上。\n“对不起，玛莎，或许…我们能在另一个世界重逢，”索菲亚突然对她说道。\n“你——你要做什么？！”玛丽亚的声音微微颤抖。\n“只是做该做的事。”索菲亚苦涩地笑了笑，“再见了。”说完，她纵身一跃，向着魔女飞去…紧接着，一阵耀眼的爆炸席卷了一切。尘埃落定，乌云开始逐渐散去，晴朗的天空从云层的缝隙中探出了头，滂沱大雨倾泻而下。\n\n玛丽亚的脸上滑过晶莹的雨滴，其中还夹杂着几滴难以抑制的泪水。"
 maria_magica.11.a: "独行战士继续着他的征程，尽管战友们已经永远地倒下。"
 maria_magica11_tt: "§K一段旅程的终点§!，§l…§!"
 maria_magica.12.t: "告别…"
 maria_magica.12.d: "两年，不，已经快三年过去了，自从那一天。自那以后，她又一次成为了孤身一人的魔法少女。事实上，很少有魔法少女能够如此长寿，要么战死沙场，要么沦为魔女。因此，玛丽亚绝对算得上是一位经验丰富的老兵了，死在她手下的魔女早已数不胜数。当然，每当意识到那些曾经也和自己一样是怀揣着希望与梦想的魔法少女时，她的心中便会涌起一阵苦涩。但至少，她们不必再承受那无尽的痛苦，这也算是一种解脱吧…\n\n与魔女搏斗已经成为了她生活中无法摆脱的，令人厌倦的日常，但其他的选择只会更加糟糕。屈服于绝望，化身为自己曾经憎恨的怪物？亦或是懦弱地选择自我了断？光是想想都令人感到可笑而又厌恶。于是，玛丽亚只是在这片土地上漫无目的地游荡，与魔女交战，偶尔也会向那些初出茅庐的新手伸出援手，就像曾经她的那位挚友所做的那样。\n\n这一切是否值得？或许吧。命运总是变幻莫测，谁又能预知，当初如果她没有成为一名魔法少女，又会迎来怎样的人生呢？\n\n又是梦境，更准确地说，是一系列相同的梦境。整整一个月以来，玛丽亚都在重复做着同一个梦。这梦境仿佛在召唤她，召唤她去协助完成一个伟大的目标，但具体是什么，她却无法说清。究竟是去协助“恶魔”，还是去帮助“上帝”？她不明白这梦境的含义。但她下意识地认为，自己应该前往梦境中所指引的方向。尽管听上去有些荒谬，但梦境中的场景却与德国的某处十分相似…\n\n少女登上了一座小山丘，远远地望见了大日耳曼国的边境哨所。她意识到，自己正走在正确的道路上。她变身成为魔法少女的形态，紧紧握住了手中的长枪，随时准备应对可能遭遇的边防士兵。她纵身一跃，从山坡上跳下，朝着前方坚定地走去，准备迎接任何挑战。无论前方等待着她的是什么，她都将坦然面对。"
 maria_magica.12.a: "她的身影消失在了地平线上，仿佛从未存在过一般。"
 maria_magica12_tt: "§K亦是新生的起点§!，§l可敬的执着§!"
 maria_magica.13.t: "在警局"
 maria_magica.13.d: "维亚特卡内务部的办公楼里总是乱哄哄的，一派忙碌的景象。对于一个新生的政权而言，打击犯罪活动，无疑是确立其统治地位，巩固西俄罗斯政权的关键所在。而在这场与犯罪分子的斗争中，一位名叫米哈伊尔·普罗科波夫的中尉可谓是中流砥柱。他早在20世纪50年代便开始在基洛夫市从警，对地方当局并无特殊的忠诚，有的只是一颗赤诚之心，矢志不渝地投身于自己所热爱的事业之中。\n\n此刻，普罗科波夫正坐在自己的办公室里，仔细阅读着一份案卷。这是一起谋杀案…起因竟然是意识形态的分歧？“哎，混乱时期是结束了，但有些人似乎还嫌不够热闹，非要争个你死我活，”中尉暗自思忖。\n\n“喂，中士，那个凶手的追捕行动进展如何？”他头也不抬地问道，他的下属正坐在办公室的另一角，噼里啪啦地敲打着打字机，撰写着一份又一份的报告。\n“米哈伊尔·安德烈耶维奇，我们已经有了一些线索，明天准备对几个嫌疑人的住所进行搜查。”\n“很好，其他的案子有没有什么进展？”\n“米哈伊尔·安德烈耶维奇，本地珠宝店抢劫案和一位市政官员离奇死亡的案子有了一些眉目。”\n“知道了，你继续忙吧。”米哈伊尔叹了口气，身体向后仰去，靠在了椅背上，陷入了沉思。\n\n突然，一阵急促的敲门声将普罗科波夫从半睡半醒的状态中惊醒。“请进！”他差点一头栽倒在桌子上，连忙说道。\n\n“您好，中尉同志。我有一件非常重要的事情，需要您的帮助，”一位上校走进办公室，语气既威严又带着一丝恳切。\n\n“费奥多尔·季莫费耶维奇，中尉米哈伊尔·普罗科波夫随时听候您的调遣。”普罗科波夫立刻从椅子上站了起来，立正敬礼。\n“行了，别来这套虚的了，我还记得你小时候的模样呢。咱们之间也算是老相识了，”上校一边说着，一边在旁边一张空着的椅子上坐了下来。“有件案子，棘手得很，别人都不愿意接。”\n“什么案子？”\n“过去六个月里，城里已经有十几个十二到十六岁的女孩失踪了，最要命的是，我们对她们的情况一无所知。她们就这样凭空消失了！”\n“您确定我能破得了这案子？连那些经验丰富的老手都束手无策…”\n“听着，我相信你，我期待着你能够担负起这份责任。”"
 maria_magica.13.a: "这竟然是一起大规模失踪案。"
 maria_magica13_tt: "§K某些不言而喻的事，总有那么一瞬，显得前所未有地清晰§!"
 maria_magica.14.t: "调查"
 maria_magica.14.d: "时间早已过了午夜，但普罗科波夫仍然没有丝毫睡意。在接受了上校的委托后，他全身心地投入到了这起城市少女大规模失踪案的调查之中。事实上，早在米哈伊尔接手之前一个月，这起案件就已被立案，而且在这期间，失踪者名单上又增添了四个新的名字。在他的办公桌上，凌乱地散落着各种文件、照片和个人档案。\n\n然而，所有的线索都如同断了线的风筝，毫无关联…失踪的女孩们之间几乎没有任何共同点，难以找到任何有价值的线索。起初，中尉认为这可能与当地的一些犯罪团伙有关，比如曾经在喀山肆虐的那些黑帮。但这起案件与那些案件最大的不同在于，他找不到任何关于这些失踪女孩命运的蛛丝马迹，她们就仿佛…人间蒸发了一般，这令米哈伊尔感到无比的焦虑，甚至隐隐感到一丝恐惧。他总觉得自己似乎忽略了什么至关重要的线索。\n\n当然，他也曾派遣几名警员走访了失踪女孩的家庭，但收效甚微。他打开一包香烟，用牙齿叼出一支，熟练地划着火柴，点燃了香烟。烟雾缭绕在军官周围，为这紧张的气氛带来了一丝平静。当香烟燃尽，倦意终于袭来，他的眼皮开始打架，思绪也渐渐飘远…\n\n一阵突如其来的敲门声将普罗科波夫惊醒。他如同触电般地从椅子上弹了起来，差点一头撞在桌子上，含混不清地说道：“请进！”这次进来的是一位手中拿着文件夹的军士长，他正是被普罗科波夫派去执行夜间巡逻任务的。\n\n“米哈伊尔·安德烈耶维奇，我向您汇报巡逻结果，以及一些可能与案件有关的传闻。”\n“准许汇报，那些传闻……也一并说来听听。”\n“在巡逻期间，我们没有发现任何可疑情况，也没有找到与案件有关的任何线索。”\n“那你所说的那些传闻呢？”\n“今天早上，我无意中听到了两个人的对话，他们似乎是私家侦探。据他们所说，维亚特卡总督的女儿，玛丽亚·弗拉基米罗夫娜·罗曼诺娃，也失踪了。”\n“等等，什么？你确定没有听错？”中尉猛地站起身来，追问道。\n“绝对没有，尽管我当时离他们有一段距离，但我可以肯定自己听清了他们谈话的所有细节。不过，在消息得到证实之前，我还是将其作为传闻来汇报。”\n\n米哈伊尔·普罗科波夫沉默地坐在椅子上，目光茫然地望着军士长身后的虚空。突然，他只说了一句话。"
 maria_magica.14.a: "“妈的…”"
 maria_magica14_tt: "§K风言风语，传得比想象中更快§!"
 maria_magica.15.t: "巡逻"
 maria_magica.15.d: "米哈伊尔·普罗科波夫已经很久没有亲自参与巡逻了，他更习惯于在自己的办公室里，对那些已经收集到的情报进行分析。但是，自从他接手少女失踪案以来，已经过去了整整三个月的时间，他决定通过这种方式来换换心情，顺便透透气。带着两位下属：一位下士和一位军士，中尉漫步在深夜的维亚特卡街头，敏锐地观察着周围的一切，不放过任何一个细微的线索。\n\n“这个月又多了7个，太可怕了…”普罗科波夫的声音中带着一丝疲惫，“而且我们仍然毫无头绪，没有任何进展。我们已经排查了几十种可能性，但没有一条能够得到证实…真是操蛋。”\n“长官，或许我们应该放弃这个案子？既然这四个月以来都没有任何人能够取得任何突破，”军士说道。\n“你不懂，拉沃奇金，你不明白，这些失踪的都是活生生的人，她们也都是别人的女儿，别人的姐妹。到时候我该如何面对她们的家人？我们必须阻止这一切！”普罗科波夫猛地提高了嗓音，狠狠地拍了一下虚空中的“桌子”。\n“如您所愿，米哈伊尔·安德烈耶维奇。我们现在是要前往维亚特卡酒厂的方向吗？”\n“没错，那里有许多废弃的建筑，或许我们能够发现一些新的线索。”\n\n巡逻队继续前进，他们警惕地环顾着四周。但是，除了几只无家可归的流浪动物，他们并没有发现任何异常。一种徒劳无功的感觉油然而生。然而，既然接到了命令，他们就必须执行到底，直到天亮为止。走到工厂大门附近时，他们决定绕着厂区巡逻一圈。\n\n当他们走到一个死胡同时，米哈伊尔突然发现了一个在屋顶上来回跳跃的模糊身影。那个身影离他们只有几十米的距离，因此很难判断那究竟是什么东西。\n\n“所有人，立刻追上去！”普罗科波夫大喊一声，拔腿朝着房屋的方向冲去。\n“是！”下属们一边应答，一边给自己的“托卡列夫”手枪上了膛，紧随其后追了上去。然而，双方之间的实力悬殊，那道在屋顶上跳跃的身影速度惊人。但普罗科波夫并没有因此而放弃追捕，他隐隐感觉到，只要追上它，或许就能解开那困扰他已久的谜团，即便不能完全揭开真相，至少也能获得一些至关重要的线索。\n\n“拉沃奇金，瓦尔丘克，你们从两侧包抄，我走直线追击！”他一边说着，一边拔出了自己的马卡洛夫手枪，继续向前飞奔。\n“站住！否则我就要开枪了！”他朝着那道身影大声警告道。\n\n“该死的，看来只能这么做了…”他暗自思忖，将手枪瞄准了那道身影的腿部所在的大概位置。枪声响起…似乎没有击中。但那个身影的速度确实慢了下来，这也给了普罗科波夫追上它的机会。\n“站住，别过来，”那道身影突然开口说话了，“如果你不想死的话。”那是一个女人的声音，不，甚至更接近于一个年轻女孩的声音。\n“我是这里的警官，我自己会判断是否需要靠近你。”\n“那就别怪我了，”少女纵身一跃，跳进了一个黑洞洞的入口，消失在了黑暗之中。就在这时，军士和下士也赶到了。\n“你们两个，跟我来！”中尉指着那个入口命令道，率先走了进去。\n“是！”"
 maria_magica.15.a: "希望我们不会为这个决定而后悔。"
 maria_magica15_tt: "§K应当及时制止她们§!"
 maria_magica.16.t: "这算什么…"
 maria_magica.16.d: "当三人走进屋内时，他们发现自己置身于一个…难以名状的空间之中。这里的一切都与他们所熟知的现实格格不入，这里遍布着鲜花与糖果，地面上弥漫着浓重的雾气，天空中漂浮着一个个漆黑的球体，宛如孩童笔下光怪陆离的涂鸦。而在远方，一座仿佛拥有了生命的烘焙坊赫然耸立，一位年约十五六岁的少女正在奋力与其搏斗。她挥舞着手中的长枪，灵巧地躲避着从四面八方袭来的球体。\n\n“这他妈的是什么鬼地方？我是在做梦吗？还是说我已经疯了？”军士跪倒在地，喃喃自语道。\n“拉沃奇金，闭嘴！现在不是胡思乱想的时候，给我打起精神来！”普罗科波夫一边呵斥着，一边朝着那些在空中漂浮着的、由某种未知物质构成的球体开火。\n“上帝啊，宽恕我，上帝啊，宽恕我，上帝啊，宽恕我…”警员仍在自顾自地嘟囔着。突然，他停止了说话，鲜血从他的嘴角缓缓流出。其中一个球体变成了一根尖刺，刺穿了军士的后背。\n“该死，该死，该死！下士，你还好吗？”中尉焦急地问道。\n“我没事，米哈伊尔·安德烈耶维奇，我们现在该怎么办？”下士答道。\n“我也不知道，先把这怪物干掉，然后再找那个家伙问个明白。准备好你的手枪了吗？”\n“是的，长官，我准备好了。”他点了点头。\n\n两名警员缓步走向那只外形诡异的怪物，同时向那些试图袭击他们的球体射击。这段路程虽然短暂，但却漫长得仿佛永无止境。他们终于靠近了目标，手中的手枪能够准确地命中它了。\n\n“开火！”普罗科波夫下令。两把手枪射出的子弹尽数倾泻到了那怪物的躯体之上。突然，它发出了一声凄厉的哀嚎，并挥舞起某个肢体。米哈伊尔听到的最后一句话，是下士的呼喊：“快躲开！”\n“这一定是一场梦，”米哈伊尔暗自思忖，“只要我一睁开眼，就会发现自己还躺在办公室里，只是身体不知为何会这么痛。”他睁开了眼睛，才意识到这一切并非梦境。他艰难地挪动身体，靠在了墙边，唯一能够活动的那只手从口袋中摸出了一支香烟，点燃后深深地吸了一口。\n\n“告诉我，这一切究竟是怎么回事？其他人呢？”中尉朝着站在不远处的那位少女问道。\n“我觉得，最好还是由它来告诉你，”她说着，目光转向了米哈伊尔的右侧，“出来吧，丘比…对…我相信这是最合适的选择…你能转过头来看看吗？”\n“哦，好吧。”中尉费力地转过头，看到了一只外形酷似猫的生物，它有着一对巨大而又突兀的，如同触角一般的耳朵。\n“你好，米哈伊尔。为了感谢玛丽亚，我可以回答你几个问题。”\n\n最终，普罗科波夫所调查的那起少女失踪案的真相，都与这个神秘的生物有着千丝万缕的联系。想要找到那些失踪的女孩已经是不可能完成的任务了，搜寻任何证据也都毫无意义。事实上，这只小兽所说的话，反倒引发了他更多的疑惑，但是笼罩在一切之上的迷雾，也逐渐开始消散了。少女和丘比很快便离开了。他独自一人躺在了那冰冷的土地上。"
 maria_magica.16.a: "可怕的结局。"
 maria_magica16_tt: "§W大胆的行动，后果却难以预料§!"
 maria_magica.17.t: "誓言"
 maria_magica.17.d: "在彼尔姆附近的一座小修道院旁，一位男子正在田间独自收割着小麦。显然，他是那座修道院中的一位修士。但关于他的过往，却鲜有人知，他沉默寡言，比起与人交谈，更喜欢独处时的宁静。当然，也正因他这种不合群的性格，关于他的各种流言蜚语也从未断绝。\n\n有的传言还算靠谱，而有的则纯属无稽之谈。有人说他曾是为侵略者卖命的“通敌者”，有人说他是个外国人，还有人说他失去了挚爱之人。但所有这些流言蜚语，与他真正的经历相比，简直是天壤之别，不值一提。事实上，他并不反感那些围绕着他的流言蜚语，因为与他所经历的一切相比，真相要诡异离奇得多。\n\n他曾经是一名尽忠职守的警官，直到他亲眼目睹了那些无法用言语形容的恐怖景象。那一切就像是一场疯狂的噩梦，但却又真真切切地发生在了现实世界之中，而且还是无法被改写的现实。在那之后，他离开了内务部，也离开了自己生活了大半辈子的维亚特卡。在经历了一段颠沛流离的生活后，命运将他带到了这座修道院，他也最终剃度成为了一名修士。\n\n\n\n“或许，我早在那个夜晚就已经死了？而现在的一切，都只不过是对我所犯下的罪孽的惩罚？”修士自言自语道。“我仍然无法理解这一切，魔女，魔法少女，这些都真真切切地存在于我们的身边…难道说，这一切都只是我的臆想，实际上我们只不过是遭到了强盗的袭击？不，不会的，这一切都真实得可怕。”\n\n米哈伊尔结束了他的自言自语，重新握紧了镰刀，继续收割着庄稼。这项单调乏味的体力劳动能够让他平复心情，也能让他暂时忘却那些与他人分享过往经历的念头，因为他很清楚，这毫无意义…"
 maria_magica17_tt: "§K一场震撼灵魂的冲击，余波永不止息§!"
 maria_magica.18.t: "白色野兽"
 maria_magica.18.d: "位于维亚特卡附近的阿德舍沃村，与这片土地上其他数十个村庄并无二致。村子中心的教堂同样平凡无奇，既不显赫，也无传世的壁画。可当圣乔治骑士团的势力日益壮大——也许是偶然，也许是刻意为之——此地却成了整个教区的核心。幸运的是，这一变化并未对当地人的生活造成多少影响，除了教堂旁新添了一座房舍，供骑士团成员驻扎。\n\n本地教堂的主持——神父因诺肯提并未对此表示抗拒。他深信，一切皆在主的安排之中。此刻，他正端坐在凉亭里，与对面的两人闲谈：一位是他的副手——执事格里什卡，另一位则是隶属骑士团的战士瓦西里。\n\n“最近有何异事？”因诺肯提问道，“无论好坏，都讲讲吧。”\n“总体还算平静，神父。”格里什卡答道，“不过村里人开始议论，似乎来了个白色的妖怪。”\n“白色的妖怪？”因诺肯提皱起眉头，“你们可有听闻更多细节？”\n“有的。”瓦西里点头道，“传言这个‘妖怪’形似猫，但样貌极其怪异，只有些女孩见过它。而且，不只是我们村，邻近的村庄也有类似目击。骑士团的人已经四处奔走，挨家挨户地做驱魔仪式。光是昨天，就接到三起报案。”\n“驱魔仪式，按照规程来的吧？”格里什卡追问。\n“当然，天可怜见，我们怎敢擅作主张。”瓦西里答道，“而且，似乎暂时没人说那东西又出现了。”\n“既然退去了，那便是好兆头。”因诺肯提轻叹，双手交叠胸前，“感谢主——这里不容妖邪作乱。我看，该召开一场驱魔礼拜，彻底肃清一切不洁之物。”\n\n两名僚属对视一眼，同时点头。“我们会做好万全准备。”他们异口同声地说道。随即，二人起身，开始着手布置仪式前的一切事务。\n\n因诺肯提未曾挽留。他独自坐在木椅上，手指无意识地抚弄着挂在胸前的十字架，思绪却飘向了未知的方向。“白色野兽…以前可从未有过这种事。世道愈发诡异了，仿佛末日就要降临……但愿，主自有安排。”"
 maria_magica.17.a: "上帝自有安排。"
 maria_magica18_tt: "§l神明仁慈，甚至怜悯恶者§!"
 maria_magica.19.t: "业余无线电爱好者"
 maria_magica.19.d: "马克西姆有一个爱好——用一台老旧的、自己组装的收音机收听国外的广播电台，尤其是那些来自美国的电台。当然，这并非易事，有时他会收到德国的宣传广播，或者其他一些他完全听不懂的语言。马克西姆尤其喜欢收听那些娱乐节目，这能让他一窥地球另一端人们的生活。他缓缓地转动着收音机的旋钮，调整着天线的角度，全神贯注地聆听着扬声器中传来的每一个声音。\n\n终于，收音机中传来了一段英语对话，马克西姆停止了一切动作，开始专心收听。\n\n“大家好，我是肯·莱肯斯，欢迎收听‘内华达六号’电台。在我们今晚的谈话节目中，我们将畅所欲言，讨论各种话题。而我身边的这位，是我们的老朋友——约翰·亚历山大。”\n“你好，肯，今晚想聊些什么呢？”\n“这个嘛，我也不知道，还是把决定权交给你吧。”\n“我想起来了，对了对了，你还记得前段时间德国人在博恩霍尔姆岛附近发生的那起事故吗？”\n“当然，当时所有媒体都在铺天盖地地报道这件事，你为什么突然提起这个？”\n“你最近有没有关注过青蛙？我一直在关注，并且得出了一个令人震惊的结论。”\n“没有，抱歉，我没有关注过。有什么重要的发现吗？”\n“非常重要。青蛙们不再交配了！它们现在只对同性感兴趣。我认为这都是德国人搞的鬼。”\n“德国人？”\n“没错！事实上，这都是他们为了改变我们的思想而进行的秘密实验，他们掩盖了真相！”\n“哈哈，但这听起来也太离谱了吧，不是吗？”\n“不，不，这完全说得通。德国人想要改变我们的思想，让我们停止繁衍后代。你能想象吗？无线电波竟然把青蛙变成了同性恋！想想看，青蛙！同性…”\n“我想我们应该插播一段广告了。五分钟后见。”\n\n扬声器中顿时被一阵白噪音所充斥，看样子是信号中断了。马克西姆叹了口气，尽管他认为刚才听到的那些话纯属无稽之谈，但一想到竟然有人可以在广播节目中肆无忌惮地讨论这种荒诞不经的话题，这让他不禁心生向往。他多么希望，在俄罗斯也能有这样轻松自在的生活，人们不必再时时刻刻为那些沉重的话题而忧心忡忡。"
 maria_magica.19.a: "演出必须继续下去。"
 maria_magica19_tt: "§K可笑至极§!"
 maria_magica.20.t: "铤而走险"
 maria_magica.20.d: "据我方安插在国家安全部的消息来源称，德军在博恩霍尔姆岛——名义上属于丹麦王国的领土——遇到了严重麻烦。波罗的海发生的辐射事故引发的各种流言，看来并非空穴来风。岛上很可能存在某种足以影响世界命运的东西。总参谋部提议，组织一次秘密登陆行动，夺取岛上一切有价值之物。\n\n许多人有理有据地认为此行动极其危险，可能引发与德意志国的全面战争。然而，计划的少数反对者无法对抗沙皇的意志，最终将由沙皇陛下定夺。若行动成功，我们将获得或许能助我们即刻战胜大日耳曼国的某种事物。若行动失败，我们会设法抹去痕迹。沙皇将如何决断？"
 maria_magica.20.a: "听起来挺诱人的。"
 AprilFools_shortcut_tt: "§Y两周后行动开始。其后果将…§l极其出人意料§!。§!\n\n§R由于宇宙在如此早期便发生撕裂，可能出现未预料的错误§!"
 maria_magica.20.b: "你们是彻底疯了吗？"
 AprilFools_no_shortcut_tt: "§G我们将在第二次卫国战争期间有机会执行此行动。§!\n\n§G开发者推荐选项§!"
 SWRW_april_fools.1.t: "非同寻常的机会"
 SWRW_april_fools.1.d: "随着彼得堡及其周边地区的攻克，我们为自己“凿开”了一扇通往波罗的海的窗户。如今我们有能力执行某些海上军事行动了。具体而言，总参谋部提议，对博恩霍尔姆岛——名义上属于丹麦王国的领土——进行一次有限的特种部队登陆。鉴于早前关于岛上“事故”的新闻以及近期所有人员撤离的消息，一些将军认为这是查明真相的绝佳机会。类似行动的设想先前也曾被提出，但因对年轻的国家而言风险过高而被搁置。\n\n如今，既然我们已与德国处于战争状态，这种行动的风险似乎也就不那么可怕了。当然，仍有对此行动持怀疑态度者，但奇怪的是，大多数人认为此举极其必要。“要让全世界睁开眼睛”、“揭开纳粹的秘密”之类的口号开始在总司令部回响。尽管有总参谋部的支持，最终决定权仍在沙皇手中。"
 SWRW_april_fools.1.a: "或许，这是一个好主意"
 SWRW_go_to_bornholm_tt: "§Y我们§R必须§!执行这项行动§!"
 SWRW_april_fools.2.t: "海狮怒吼"
 SWRW_april_fools.2.d: "博恩霍尔姆岛，晚上11点。登陆比想象中容易得多，感觉德国佬自己都忘了还有这么个岛。今早在伦讷打了场仗，虽然也算不上什么战斗。就四十来个普通士兵和两辆半瘫痪的坦克，看起来比大多数坦克兵的年纪都大。咱们见过的阵仗比这大多了。只是我们有个小伙子，唉…我不喜欢提这事。整个岛上都是履带和车轮的痕迹，好像弗里茨们当时慌不择路地想把所有家当都运走。路上看见了几个箱子和一辆翻倒的卡车。得搞清楚他们是从哪儿运东西出来的。哦，差点忘了。箱子是空的，但散发着一股怪味。\n\n摘自海军陆战队第一特别团团长伊拉里昂·尼科诺夫的日记。"
 SWRW_april_fools.2.a: "算不上愉快，但也算放了个假。"
 AprilFools_time_doesnt_matter_now_tt: "§R从这一刻起，时间这玩意儿变得极其相对§!"
 SWRW_april_fools.3.t: "怪异之门"
 SWRW_april_fools.3.d: "“圣母玛利亚…这又是什么玩意儿？”伊拉里昂·尼科诺夫，这位上了年纪的男人惊奇地触摸着大门。小队在几百米外就注意到了它们。漆黑而宏伟，在一旁如同水泥盒子般单调的建筑衬托下显得格外醒目。“什么鬼画符…这到底是什么鬼东西？”\n\n“伊拉里昂同志，这不是鬼画符，是卢恩符文，而且看样子，上面刻的是日耳曼符文。”年轻的狙击手沃瓦立刻凑上前去仔细查看。\n\n“什么？你说人话。”男人惊讶地挑起了眉毛。\n\n“就是卢恩符文…跟咱们的字母差不多。不过德国人的符文还带有额外的含义。就是表达的核心意思。比如这个。”小伙子用手指着其中一个图案——“‘欧瑟拉’，意思是归属、臣服。”\n\n“真有意思。”突然，门后传来奇怪的声响，像是脚步声，接着有重物哐当一声摔在地上。随后又传来某种滋滋的声响，似乎门后有什么东西在闪着电火花。“圣母玛利亚！”\n\n伊拉里昂转过身，看着士兵们的眼睛。“听着，我先进去。斯捷潘和廖沙跟上我。沃瓦，你殿后掩护。我们下去。”"
 SWRW_april_fools.3.a: "谁知黑暗之中，潜藏何物。"
 SWRW_april_fools.4.t: "地下设施"
 SWRW_april_fools.4.d: "下降过程并不快，小队全副武装地往下走了足足十几分钟，但里面的景象让士兵们瞠目结舌。设施内部结果发现是个…“奇物”储藏库。一顶镶嵌钻石、能让佩戴者发疯的王冠。一个装在培养皿里、覆盖着鳞片的双头怪物。一个防毒面具，镜片里明明是在地下，却倒映着集中营的景象。似乎每个物品的标签都在争相用最离奇的描述来超越彼此。\n\n数十件各式各样的物品陈列于此。有的放在基座上，有的关在笼子里，仿佛它们随时可能挣脱出来。还有的就随意丢在地上……或许是某人在撤离时不慎掉落的手表和眼镜。不过最好还是别乱碰。与此同时，小队成员总觉得有什么东西在跟踪他们。像是一个小孩子的影子，欢快地在角落间跳跃，时而刚好出现在视线的余光里。沃瓦觉得这是因为通风不良和光线昏暗造成的错觉，但似乎真的有什么东西在尾随着他们。\n\n最终，士兵们来到一个不明物体前。它像个巨大的冰箱，表面覆盖着卢恩符文，里面时不时传来呻吟声。旁边附带的文件揭示了一个可怕的实验。原来希特勒，第三帝国的元首本人，死于党卫军的政变。而这个设施是祖先遗产学会建造的，唯一目的就是复活领袖。身体虽然复活了，但纳粹领袖的灵魂却始终是死的，导致复活的阿道夫迅速衰弱，到1962年时几乎变成了植物人。之后在大约4到5年前（文件没写具体日期，伊拉里昂也没带日历）曾试图进行空间跃迁来让领袖复生，但出了岔子。伊拉里昂正要翻到下一页，看到标题写着“被捕获之神”时，被斯捷潘的喊声打断了。"
 SWRW_april_fools.4.a: "团长同志，沃瓦在这儿给自己找了个玩具。"
 SWRW_april_fools.5.t: "递归"
 SWRW_april_fools.5.d: "老团长走过去时，狙击手正埋头在一台出奇小巧的电子计算机下面捣鼓着什么，他的战友们则好奇地围观。“这该死的线在哪儿呢。啊哈！找到了！”他喊了一声，把插头插进了插座。机器开始发出声响，仿佛里面有个巨大的风扇正在逐渐加速旋转。\n\n屏幕猛地亮起，刺眼的光芒让四人都睁不开眼。当他们的眼睛适应光线后，他们看到了…博恩霍尔姆岛的鸟瞰图。地图上标着一个带有船锚符号的蓝色矩形，但几秒钟后，地图被一个新窗口覆盖了，那是一个文件夹的图标，里面的文件显然被粗暴地翻动过。令众人惊讶的是，文件夹里竟是尼科诺夫团长日记的最后一页，记录着他们师如何攻占博恩霍尔姆岛。片刻之后，窗口又换成了另一个，随意地描述着他们接触那扇大门的情景。\n\n“廖哈，你上电视了。”沃瓦开玩笑道。\n\n下一个窗口则用充满艺术感的笔触描绘了他们在设施里的“漫步”。看到这里，老团长额头上渗出了汗珠。\n\n“行了，去他妈的这破玩意儿。让指挥中心来处理。又是些鬼名堂。谁把这破烂玩意儿拿上，我们走。”\n\n阿列克谢轻松地把那东西抱在怀里，突然，一阵不明的哔哔声在设施内回荡起来。随后，机器的扬声器里传来了之前显示其他文件时那种熟悉的音效。\n\n“斯捷潘，快看看，上面写了什么？！”\n\n斯捷潘飞快地扫了一眼文件，刚张开嘴，却为时已晚。一股前所未见的巨大爆炸摧毁了整个设施。外界所能看到的，只有一根巨大的尘柱冲天而起，在岛屿上空蔓延数公里之高。"
 SWRW_april_fools.5.a: "接下来会发生什么？"
 SWRW_april_fools.6.t: "电话铃响"
 SWRW_april_fools.6.d: "弗拉基米尔·吉尔已经很久没有处理过文件了。过去几个月里，他一直奔波在前线，或者至少是在离前线不远的地方。现在， 纸面工作成了这位陆军元帅最大的敌人，甚至比狼人游击队的子弹更令他感到恐惧。\n\n今天是个特殊的日子——一周前签署的《去纳粹化法令》终于正式生效了。作为柏林管理总局的领导人，吉尔当然要亲自出席这场具有历史意义的仪式。\n\n吉尔正准备穿上外套，突然，放在办公桌正中央的红色电话响了起来——这是情况不妙的信号。\n\n总局局长拿起听筒，听到了他顾问紧张的声音：\n\n“弗拉基米尔·弗拉基米罗维奇，难道又打仗了？”\n\n“什么？我们刚才不是才打赢吗！”\n\n“那核导弹是从哪儿来的？”\n\n“谁？什么他妈的导弹？你喝醉了？”\n\n“您快看看窗外啊，它们已经把整个天都遮住了！”\n\n窗户在隔壁房间，然而吉尔刚一打开门，就在门框里看见一个外表讨喜的年轻人。吉尔甚至没注意到他手里的斧头…\n\n“不好意思，请问您知道‘多尔西亚’在哪儿吗？”\n\n“抱歉，您是怎么进到我办公室来的？”\n\n“啊，原来您就是弗拉基米尔·吉尔。这是‘屌爆部门’给您的礼物。”\n\n几下斧劈，经典的藏尸手法，现在整个世界之都都落入了帕维尔·贝特曼的掌控之中。"
 SWRW_april_fools.6.a: "这下可有乐子了。"
 SWRW_april_fools.7.t: "踏马的，天在燃烧！！！"
 SWRW_april_fools.7.d: "如果克麦罗沃的居民中还有人能活过这个午夜，他们一定会永远记住这一刻。一瞬间，整个天空被奇异的云层笼罩，那是由俄国、德国和勃艮第生产的地对地洲际核导弹组成的。邻近爆炸产生的冲击波率先抵达城市，震碎了窗户，并将当地政府改造成养老院的“留里克”王朝沙皇宫殿废墟里所有居民卷走。\n\n顷刻间，大自然汇聚成一曲最后的歌谣，绝美而超凡脱俗。数百万人口中感到金属的腥味，远方核爆的蘑菇云清晰可见——那是温柔之雨（出自雷·布拉德伯里同名短篇）最初的征兆。所有人的最后一个愿望，无论是健谈的还是孤僻的，无论是神父还是罪犯，都归于一致：尽可能地靠近彼此，拥抱，讲笑话，告别，回忆，去爱。天空染成了血红，预示着数千年来第一个没有人类的黎明即将到来。炸弹落在城市上，将人、建筑、草地、树木——一切生灵化为灰烬。非生，亦非死。\n\n这命运同时降临到整个国家：从布列斯特到符拉迪沃斯托克，从诺里尔斯克到塔什干。世界在一夜之间永远改变了。"
 SWRW_april_fools.7.a: "而春天，清晨扼住冬天的咽喉，恐怕也无法理解，我们都已消失无踪。"
 SWRW_april_fools.8.t: "新奇异世界的清晨"
 SWRW_april_fools.8.d: "对俄罗斯的核轰炸是地球有史以来最大的能量爆发事件，或许只有双黑洞合并才能与之相比。这在先前被称为“德国”的土地上引发了一系列时空异常，该区域此后将被描述为“X-69区”。我们的特工记录了该区域一些尚能用逻辑解释的现象。\n\n1) 历史扭曲。此类异常表现为世界历史被掺入了其他时间线的事件，或是完全不可能发生的事件。例如，在X-69区出现后，东非专员辖区的专员不再是汉斯·许蒂希，而是他的一名伪装成他的副官。这些异常具有全球性影响，但已明确其源头。\n\n2) “穿越者”。此类异常的特征是人形生物及其他生命形态从其他世界（包括虚构世界）进入我们的世界。部分穿越者无害，但另一些则极度危险，对美国国家安全构成直接威胁。例如，某来自异世界的人声称其管理着“SCP授权北德意志托管地”。总统先生，为了国家利益，请无论如何不要与此人接触。此人是罪犯，是罪犯。\n\n3) 灰烬（ASH）。我们尚不清楚此物体的性质，但间接观察表明它是有生命的。它可能是一种核爆受害者的集体意识，或者…[数据删除]\n\n摘自51区档案"
 SWRW_april_fools.8.a: "我刚才到底读了些什么？"
 SWRW_do_the_funny: "博恩霍尔姆登陆行动"
 SWRW_do_the_funny_desc: "在总参谋部的强烈要求下，这项行动已是势在必行，天知道他们究竟想要在那里找到什么。但军令如山，我们必须着手准备向该岛派遣一支登陆部队。岛上的防御力量薄弱，因此我们只需派遣一支小规模的特种部队即可。"
 SWRW_do_the_funny_tt: "§Y这项行动的后果将会…§!§R超乎想象§!"
 AprilFools_news.1.t: "[Get_newspaper_header]博恩霍尔姆岛发生辐射事故"
 AprilFools_news.1.d: "自昨日起，国际监测系统报告称，位于博恩霍尔姆岛——名义上隶属丹麦王国，实为德国在波罗的海的军事与科研基地——的辐射水平异常升高。\n\n根据德国官方消息来源，岛上在一次实验中发生了‘放射性物质的小规模泄漏’，且‘无需担忧’。但据第三方观察，情况可能比表面描述的更为严重。岛屿周围已设立30公里隔离区，沿海地区也已实施军事新闻审查。\n\n围绕此事件已产生诸多谣言，从新型核武器试验，到涉及时间旅行和宇宙扭曲的荒诞猜测，不一而足。\n\n瑞典、自由国家组织及芬兰代表已就‘德国领导层鲁莽行事所导致的不幸后果’表示谴责。"
 AprilFools_news.1.a: "这些德国人想干什么！？"
 AprilFools_news.2.t: "[Get_newspaper_header]毁灭性台风重创阿尔汉格尔斯克"
 AprilFools_news.2.d: "俄罗斯水文气象中心报告，阿尔汉格尔斯克遭遇了一场威力惊人的飓风，其强度远超蒲福氏风级12级的最高记录。据目击者称，几乎整个城市沿海区域被夷为平地，当地港口更是荡然无存。\n\n根据今日统计，这场飓风已导致数千人丧生，失踪人数高达一万，此外还有更多人受伤或流离失所。城市蒙受的物质损失估计达数千万卢布。\n\n如此极端且反常的自然现象引发了诸多猜测：从气候武器攻击到武装分子破坏，众说纷纭。俄国政府对此未作任何评论，仅宣布全国为遇难者举行为期三天的哀悼，并在阿尔汉格尔斯克省实施紧急状态。"
 AprilFools_news.2.a: "愿主保佑他们的灵魂安息"
 AprilFools_news.3.t: "[Get_newspaper_header]博恩霍尔姆岛大撤离"
 AprilFools_news.3.d: "近期，在波罗的海区域，确切地说是在丹麦所属的博恩霍尔姆岛周边，观察到货船与军舰的异常密集活动。官方声明称其为海上演习。然而，另有报道指出，岛上的设备和剩余平民正被大规模转移撤离。\n\n这或许与先前发生在该岛的辐射事故有关。事故发生后，以该岛为中心半径三十公里的区域内，无线电通讯被完全屏蔽，并设立了禁飞区。时至今日，无人能确切说明德国人正在做什么，以及他们选择在此刻行动的原因。\n\n斯堪的纳维亚国家的外交官们已对大德意志国在此水域的行动表示谴责。OFN代表也表达了关切，并呼吁对当前事态进行独立的国际评估。然而，来自人民大厅的回应，除了一些敷衍塞责的官样文章外，再无其他。"
 AprilFools_news.3.a: "那里到底怎么回事？"
 AprilFools_news.4.t: "[Get_newspaper_header]蛙类大规模灭绝事件"
 AprilFools_news.4.d: "生物学界传来紧急消息。科学家们正就数十乃至数百种无尾目两栖动物——即我们俗称的青蛙——的急剧灭绝敲响警钟。据生物学家描述：“青蛙…它们只是停止了繁殖。” 迄今为止，仍未能查明这一现象的确切原因。从未知寄生虫引发的动物疫病，到进化机制的内在紊乱，各种假说层出不穷。目前仅成功保存了十几个物种的几百只个体，科学家们正强制它们交配，以期挽救这最后的残存。\n\n在普通民众中，这则消息如同一颗炸弹，引发了巨大的恐慌。流言猜测、阴谋论——这只是近来人们所构想出的冰山一角。然而，与其轻信谣言，不如相信科学数据。"
 AprilFools_news.4.a: "看吧，我早说过了！"
 AprilFools_news.5.t: "[Get_newspaper_header]美日召开紧急峰会"
 AprilFools_news.5.d: "鉴于近期德国与俄罗斯境内爆发的悲剧性事件，世界上仅存的两大超级大国在罗马举行了紧急磋商。美国与大日本帝国的最高代表齐聚一堂，商讨后续对策。\n\n议程核心在于终结冷战，并联合力量，共同遏制从塞纳河至阿穆尔河广阔区域内的异常活动。美国总统与日本首相发表联合声明，宣示在可怕的未知面前团结一致，并着手建立针对该异常区域的管理机制。旨在缓和昔日紧张局势的首批协议已开始生效。\n\n全世界的人们都松了一口气，意识到这两个曾经不共戴天的宿敌终于同意搁置分歧——即便代价是几乎半个欧亚大陆。"
 AprilFools_news.5.a: "这关我们什么事？"
 AprilFools_news.6.t: "[Get_newspaper_header]全球超自然联盟宣告成立"
 AprilFools_news.6.d: "随着冷战的终结，如何确保全球安全，特别是异常区域与人类文明边界的安全，成为了摆在超级大国面前的新课题。基于“国际联盟”等旧有理念及其他跨国合作构想，联合国宣告成立。\n\n在新成立的联合国框架下，一个名为“全球超自然联盟”的军事同盟也将组建。其核心任务便是遏制德国与俄罗斯境内的异常现象。全球超自然联盟的成员还将包括众多神秘主义与超自然组织：从马耳他骑士团的骑士到圭亚那人民圣殿教的成员。\n\n尽管许多人对这样一个组织的可行性持怀疑态度，但面对未知地域潜藏威胁的恐惧，目前暂时压倒了一切分歧。"
 AprilFools_news.6.a: "就让他们恐惧吧。"
 AprilFools_news.7.t: "[Get_newspaper_header]自灰烬中苏醒"
 AprilFools_news.7.d: "从阿尔汉格尔斯克-阿斯特拉罕线直至符拉迪沃斯托克的广袤俄罗斯领土，曾被认为是毫无生机的烬土荒原，任何文明的痕迹似乎都已被德意志的死亡之手抹去。然而，最新的声明与消息却揭示了截然不同、甚至令人惊异的事实。\n\n来自叶卡捷琳堡的无线电广播宣告了一个统一俄罗斯的新生。广播称，当前政权的所有反对者均已被粉碎，国家将恢复秩序。外部观察者也证实了这个国家的“苏醒”：边境线上出现了士兵，卫星图像上曾经的漆黑区域已不复存在。\n\n然而，世界其他国家仍对这个新生的俄罗斯政府投以警惕的目光，如此奇迹般的复活可能预示着任何情况。全球超自然联盟的代表目前对俄罗斯领土状况未作评论。但事实是：灰烬消失了。"
 AprilFools_news.7.a: "真有意思…"
 AprilFools_news.8.t: "[Get_newspaper_header]德意志的回归？"
 AprilFools_news.8.d: "大日耳曼国的领土同样是各种异常现象的多发地带。德国的情况与俄罗斯不同。从塞纳河到涅曼河的广阔土地并未化为一片虚无，而是分裂成无数相互冲突的小集团，各自维持着某种形式的权力。\n\n显然，其中一个集团在旷日持久的内部混战中脱颖而出，成为了胜利者。一个设立于斯图加特的政府已向全世界发表声明，寻求国际社会承认新生的德国，并希望与世界各国建立全面的外交关系。\n\n自封为“德国过渡行政当局”首脑的汉斯·菲尔宾格已宣布，国家将向成熟的民主体制转型。在他的讲话中，频繁提及一位“女士”，此人似乎曾是他的前任统治者。然而，世界各国对德国的态度依然保持着谨慎。"
 AprilFools_news.8.a: "新历史的开端。"
 AprilFools_news.9.t: "[Get_newspaper_header]德意志再统一？"
 AprilFools_news.9.d: "大日耳曼国的领土同样是各种异常现象的多发地带。德国的情况与俄罗斯不同。从塞纳河到涅曼河的广阔土地并未化为一片虚无，而是分裂成无数相互冲突的小集团，各自维持着某种形式的权力。\n\n显然，其中一个集团在旷日持久的内部混战中脱颖而出，成为了胜利者。一位名叫晓美焰的人物宣布，德意志境内的动荡时代已经结束，并向全世界发出呼吁，要求承认新生的德国，并与世界各国建立全面的外交关系。\n\n此人身份成谜，她究竟是如何登上德国权力之巅的，更是难以追溯。最有可能的解释是，她是来自异世界的“穿越者”之一。全球超自然联盟的代表已对“德国局势的新发展”表示担忧。世界各国对德国的态度仍充满着极大的疑惧。"
 AprilFools_news.9.a: "新的篇章。"
 AprilFools_news.10.t: "[Get_newspaper_header]东萨莫色雷斯苏丹国内战爆发"
 AprilFools_news.10.d: "地中海的海水正被染上血色。位于萨莫色雷斯岛上的这个岛国，正被残酷的内战撕裂。自埃米尔安德烈亚斯十二世登基后即开始的政治危机，于近日急剧升温，进入白热化阶段。\n\n今日清晨，革命伊斯兰卫队攻占了苏丹皇宫，并正式宣布俘获了王室家族成员。政变领导人约安努·阿巴什随即宣布成立伊斯兰共和国。作为回应，著名的萨莫色雷斯社会主义者阿纳斯塔斯·克里蒂科斯宣布发动无产阶级起义。他的号召得到了东萨莫色雷斯群岛中部分小岛的响应。\n\n当忠于苏丹的军队、社会主义者以及伊斯兰共和国的支持者三方激战正酣之时，其他国家亦不愿袖手旁观。据悉，来自伊朗DCIR组织的志愿军已参与冲突。与此同时，土耳其宣布准备接收难民，并在安纳托利亚南部设立了数个难民营。"
 AprilFools_news.10.a: "这玩意到底在地图上哪儿？"
