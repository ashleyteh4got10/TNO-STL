 GWF_only_my_struggle_tt: "§l这一切——毫无意义。§!"
 GWF_humanity_aside_tt: "§!任人憎恨，任人鄙夷。我唯有那§C一个目标§!§!"
 GWF_controllable_chaos_tt: "§l他们必须恐惧，且不得干涉。§!"
 GWF_security_forces_tt: "§l总得有人来干脏活，不是吗。§!"
 GWF_one_cant_do_all_the_job_tt: "§l或许，借助这个国家的力量并非坏主意？§!"
 GWF_administrative_business_tt: "§l无论如何，偶尔听听那些西装革履之辈的意见也无妨。§!"
 GWF_church_of_ring_tt: "§l这难道不是对§C她§!的记忆的亵渎吗？§!"
 GWF_support_from_outside_tt: "§l意识形态的迷雾——并非我眼下需要纠缠之事。§!"
 GWF_operation_umbra_tt: "§Y此计划所需§l精神§!力量阈值：§d[?GWF.GWF_umbra_treshold]§!.§!\n\n§Y预期结果：§! [GWF_umbra_prediction]"
 GWF_my_own_realm_tt: "§l是时候审视我所铸就的一切了。§!"
 GWF_look_outside_tt: "§l南德意志已沦为大国博弈的棋盘§!\n§Y决策类别§F“大博弈”§!将被开启§!"
 GWF_visit_vienna_tt: "§l纵然人心各异，亦需寻求联合。§!"
 GWF_attack_italians_tt: "§l让他们脚下的大地燃烧殆尽。§!"
 GWF_union_of_samefaced_tt: "§l但愿我们的目标，终能殊途同归。§!"
 GWF_can_cern_answer_tt: "§l他们总该知晓些什么吧？§!"
 GWF_unholy_alliance_tt: "§l我真的非得与他们合作吗？…也罢。§!"
 GWF_redbus_luxembourg_tt: "§l有趣的构想，不知是否新颖。但或许可行。§!"
 GWF_stuttgart_convention_tt: "§l是时候将某些悬而未决之事，一锤定音了。§!"
 GWF_operations_in_bavaria_tt: "§l是敌是友，我的行动将取决于此。§!"
 GWF_plan_b_tt: "§l锐意进攻固然是好，但有时亦需固守防线，以待时机。§!"
 GWF_look_at_powers_tt: "§l这个国家的战力…究竟该如何处置？§!"
 GWF_magical_girl_army_tt: "§l我将建立一支由同类组成的军团，为此，必须摒弃一切常规之法。§!\n§Y决策类别§F“魔法少女军团”§!将被开启§!"
 GWF_its_good_to_lie_tt: "§l如此一来，我又与孵化者有何区别？不该想这些…§!"
 GWF_control_witch_problem_tt: "§l为了所谓伟大的目标而隐瞒关键的细节…这情景何其相似。§!"
 GWF_inarmy_concurention_tt: "§l唯有强者方能生存，即便这意味着败者注定走向灭亡。§!"
 GWF_human_army_tt: "§l不应行此险招，魔法少女本不该被卷入凡世的战争。§!"
 GWF_play_from_shadows_tt: "§l在这件事上，我不得不让位于更精通此道之人，他们的作用显然远胜于我。§!"
 GWF_peoples_milita_tt: "§l可疑的决策，但结果显而易见是有益的。总参谋部深知自己在做什么。§!"
 GWF_from_shit_and_sticks_tt: "§l首要的是，这东西能打响就行。§!"
 GWF_operation_rapinam_tt: "§Y此计划所需§l肉体§!力量阈值：§d[?GWF.GWF_rapinam_treshold]§!.§!\n\n§Y预期结果：§! [GWF_rapinam_prediction]"
 GWF_hounds_pack_tt: "§l军事演习——检验军力成色的良方。§!"
 GWF_operation_occasus_tt: "§l阶段总结已毕。投入战斗！§!"
 GWF_operation_occasus_trigger_tt: "§l我已处理完国家所有§R内政§!与§Y外交§!事务§!"
 GWF_add_evil_tt: "§Y是时候摒弃一切规范与虚伪的礼节了。§!"
 GWF_no_evil_tt: "§Y或许，不必如此冷酷无情吧…§!"
 GWF_start_from_scratch_desc: "这……不对劲。我明明已经按照计划重塑了整个宇宙，但眼前的景象却与见泷原，乃至任何我所熟知的地方都大相径庭。难道，计划出现了什么偏差？可是我明明已经将一切都计算得天衣无缝…\n\n眼下，我必须强迫自己冷静下来，不能被这些纷乱的思绪扰乱了心智。\n\n我唯一关心，也永远只会关心的，只有圆，以及她是否安然无恙。当务之急是确认她是否身处这附近，然后才能着手下一步的计划。\n\n§R唯有祈祷一切顺利。§!"
 GWF_asses_situation_desc: "到目前为止，我唯一能确定的是：我没有在附近感受到圆的存在，而且我对这个陌生的地方也感到一头雾水。我身处的这个地方看上去像是一座欧洲城市，但这里的气氛却格外诡异，令人不寒而栗。当地人的举止也十分可疑，甚至可以说是畏首畏尾，充满了惊恐。\n\n我既不熟悉这里的语言，也不认识这里的街道和居民，甚至连眼下究竟该如何行动，我都毫无头绪。我感到了一种久违的无助与彷徨，就像回到了过去那些年，每当面对陌生人，心中总会充满恐惧…真是久违的感觉。\n\n但无论如何，这些困难都不应成为我停下脚步的理由，我必须继续调查，因为我无法确定自己的推断是否正确。"
 GWF_to_find_exit_desc: "自从来到这个光怪陆离的世界，我的脑海中就被各种各样更为紧迫的问题所占据，以至于我甚至无暇顾及自身作为一名“魔法少女”所拥有的能力。“我究竟是如何来到这里的？”，“我该如何生存下去？”，“我究竟身在何处？”——在对这些基本的问题有了初步的答案后，现在，是时候去探寻那些更深层次的谜团，并为实现我的终极目标而努力了。\n\n然而，首先我必须确认自己究竟拥有怎样的能力，哪些能力是我可以掌控的，又有哪些是我无法企及的。至少，那个能够储物的防护盾还在，但除此之外，我一无所知。在接下来的这段时间里，我将对自己进行一次全面的检查。但愿最终的结果能够令人满意，否则，一切都将变得无比艰难。"
 GWF_contact_incubator_desc: "“孵化者”，也就是丘比，乍看上去是一种外表惹人怜爱的小动物，它们会引诱少女们许下“愿望”，让她们以“魔法少女”的身份作为交换。但这一切仅仅是它们精心编织的谎言。实际上，它们是这世上最为丑恶、最为可憎的存在。它们打着“拯救宇宙免于热寂”的幌子，将人类视作可以随意利用的牲畜，肆意践踏着人类的情感。“可你们明明已经同意了呀”——每当有人向它们追问成为“魔法少女”的真相和细节时，这便是它们那令人作呕的、苍白无力的辩解。\n\n尽管我对这些生物深恶痛绝，但不可否认的是，它们从不说谎。因此，对我而言，眼下这些“孵化者”反倒成为了获取情报的无价之宝。所以，我眼下的目标就是找到一个“孵化者”。既然这些生物能够肆意地利用人类，那么为什么我就不能反过来利用它们呢？"
 GWF_look_inside_desc: "丘比向我透露了一些奇怪的信息，按照它的“说法”——我现在是这座城市及其周边地区的统治者。我并没有轻信这只生物的理由，但试着去验证一下它所说的这些话也未尝不可，毕竟，这并不会给我带来任何损失。\n\n但是，如果权力真的掌握在了我的手中，我又该何去何从呢？我对政治或者治理国家一窍不通，肩负起领导一个国家的重任甚至让我感到恐惧。这一切是否会变成一种沉重的负担，让我离自己真正渴望的目标越来越远？我不会妄下结论，眼下，我需要从最基本的事情开始做起——去验证一下那只外星猫所说的这些话究竟是真是假。"
 GWF_only_my_struggle_desc: "那么，治理一个国家究竟是怎样一种体验呢？或许，这就如同驾驶着一辆刹车失灵，正朝着万丈深渊疾驰而去的机器。如果坠落已是不可避免，那为什么不尽可能多地保留一些能够随时抽身而退的余地呢？我没有理由去关心这个莫名其妙地落到我头上的“烂摊子”。\n\n所以，我绝不会放弃属于我的权力。在这片土地上，我的敌人仍然不在少数，而魔法能力并不能让我立刻消灭成千上万对我的项上人头虎视眈眈的家伙。或许我会采取一些行动，但这绝不是为了这个荒诞剧本的“美好未来”。这里不是我的战场，它也永远不会成为我的战场，至少现在不会。"
 GWF_humanity_aside_desc: "尽管我几乎完全放弃了自己的职责，但在民众的眼中，我仍然是他们的领导者、君主、元首。除了那些抵抗势力，大多数民众仍然支持着我。为了防止敌人趁机坐大，我认为有必要让他们对我心生敬畏。对那些罪大恶极的国家公敌执行公开处决，突袭那些可能窝藏着反抗势力的街区。他们必须感到恐惧，甚至连反抗的念头都不敢有。\n\n至于普通民众？我只在乎一个人的命运，而我能否找到她仍然是一个未知数。一旦我完成了自己的使命，我将会把整个宇宙恢复原状，而这里发生的一切都只会成为我记忆中一段光怪陆离的插曲。"
 GWF_controllable_chaos_desc: "在解散了大部分的行政机构后，官员们却仍然将我看作他们的领导者，不断地向我呈递各种文件和法令。看来，他们还没有完全领会我的意图。把这些尸位素餐的废物统统赶走——事情就这么定了。\n\n我认为，对我而言最明智的做法就是对这个国家采取“放任自流”的政策，让这里的人们自生自灭。对我而言，这一切只不过是一场荒诞的游戏，而我则是一个身不由己，被命运裹挟其中的局外人。因此，我将继续扮演一个冷眼旁观者的角色。作为一名“领导者”，我唯一需要做的就是确保这场混乱不会对我构成威胁，确保我仍然能够朝着自己唯一的目标前进。"
 GWF_security_forces_desc: "原来，在这个国家里，存在着一支名为“安全部队”的组织，类似于秘密警察。然而，就目前来看，他们的工作效率却不尽如人意，因为即使在游击战的条件下，我仍然不得不依靠残存的军队和自己的力量。这个问题亟待解决。\n\n组建一支由冷酷无情，但却绝对忠诚的打手所构成的队伍——这似乎是一个完美的解决方案。我无法独自一人消灭所有的敌人，但如果能有几千名这样的士兵，那么任何障碍都将不复存在。据说，过去也曾存在过类似的组织，叫做…“党卫军”，好像是这么叫的？"
 GWF_one_cant_do_all_the_job_desc: "治理一个国家绝非易事？但谁又说过人生注定一帆风顺呢？无论如何，成为一个国家的唯一统治者，并不是我想要的。我应该去寻找那些在治国理政方面更有经验的人。我将会保留广泛的权力，但那些繁琐的日常事务则会交给那些官僚们去处理。\n\n谁知道呢，或许这一切都是命运的考验，又或许这仅仅是宇宙跟我开的一个恶意的玩笑。但如果我能够让这片土地恢复秩序，那么，或许我也能更加轻松地朝着自己的目标前进。但愿如此吧。"
 GWF_administrative_business_desc: "尽管所谓的议会已经重建，但我仍然是符腾堡无可争议的领导者。无论我是否愿意，我都不得不去了解一些关于国家治理的细枝末节。出席几场议会会议，听一听那些身着花花绿绿西装的议员们在高谈阔论，不时地点点头，表示赞同，然后在几份文件上签上自己的名字，这一切听上去似乎并不困难。\n\n但是，如果这一切真的能够让局面有所好转，那么，我为什么不试一试呢？毕竟，想要在一堆干草中找到一根针，最好的办法就是先将干草进行分类整理。重要的是，我不能在整理干草的时候，错过了那根至关重要的针…"
 GWF_church_of_ring_desc: "一个国家不仅仅是由行政机构、官员、议会以及其他类似的繁文缛节所构成的，它还必须拥有自己的意识形态——一种能够让民众对统治者产生认同感，并让人们心甘情愿地为祖国抛头颅洒热血的精神支柱。在经历了近半个世纪的纳粹统治后，我们有必要重塑国家的意识形态，从而再次凝聚起整个国家。\n\n新国家的基础将是一种宗教意识形态，在那里我将同时成为女祭司和领袖。以我所熟悉的天主教为基础，我将加入一些魔法少女的元素，一些治国理政的方略，当然，还有那至关重要的“圆环之理”。当然，在这一切的背后，我也隐藏着一些更加自私的目的——让寻找圆不再仅仅是我个人的使命，而成为整个社会共同的目标。"
 GWF_support_from_outside_desc: "斯图加特议会中争论不休。究竟该如何处置那些遍地开花的抵抗组织？有人主张采取强硬的镇压手段，有人则倾向于妥协。最终，他们决定听取我的意见。既然他们如此迫切地想要知道我的想法，那么…\n\n共产主义者、民族主义者、民主主义者——老实说，他们之间又有什么区别呢？如果他们想在我完成使命之后接管这个国家，那是他们的自由。一旦我让宇宙重回正轨，所有这些人以及他们所做的一切都将化为乌有，因此他们的存在对我来说无关紧要。最重要的是让他们放下手中的武器，不要再碍手碍脚。"
 GWF_operation_umbra_desc: "无论如何，眼下这种失控的局面严重阻碍了我实现自己的目标。虽然我很难说清楚究竟怎样做才能立即解决这些问题，但尝试着去寻找一个解决方案总是没错的。尽管我身为这个“国家”的领导人，但或许我可以试着去“鼓舞”一下这里的人民。\n\n或许发表一场慷慨激昂的演讲，会是一个不错的主意。我不得不一反常态，去做一些不符合我性格的事情——精心准备一场公开演讲。但愿这会是一个好主意吧。如果一切顺利，大部分的问题都将迎刃而解，但如果…我只能更加努力了。"
 GWF_my_own_realm_desc: "那么，在我统治这个国家的这段时间里，也算取得了一些成就。我无法评判这些成就究竟是好是坏，对我来说，最重要的是，不要让这莫名其妙的统治者身份成为我的负担，更不能让其妨碍我去拯救圆。尽管有人可能因此而对我恨之入骨，也有人可能将我奉若神明，但这对我来说都毫无意义。\n\n我应该出去走走，或许。去亲眼看看我所取得的这些成就，无论它们是好是坏。反正一切都已经无法改变，迟早，这一切都会化作一场荒诞的闹剧。"
 GWF_look_outside_desc: "显然，除了我之外，还有许多其他的“幸运儿”也被卷入了这场时空乱流之中。我对这个世界知之甚少，因此我应该向丘比寻求帮助，尽可能多地了解周围的一切，无论这些信息是否有用。无论如何，我必须对周围的局势了如指掌。很明显，我所统治的这片王国的边界总有尽头。\n\n或许，我能够找到一些盟友，又或许，我会发现一些必须消灭的敌人。但是，我现在就如同坐在一座巨大的火药桶上，因此我绝不能置身事外，无论我内心有多么渴望远离这一切。是时候来仔细研究一下这盘棋局了。"
 GWF_visit_vienna_desc: "丘比提到的一个潜在盟友，是一个名为“维也纳公社”的组织——一群除了在20世纪初都曾生活在同一地区之外，没有任何共同之处的人。他们每个人的政治观点都截然相反，因此甚至连与他们打交道的方式都无从谈起。\n\n根据丘比的描述，想要让他们成为我们的盟友似乎是一项不可能完成的任务。但即便如此，我也必须尝试。尽管他们有些古怪，但他们或许能够成为出色的盟友，至少，按照那只外星猫的说法是这样的。"
 GWF_attack_italians_desc: "正如丘比所“透露”的，维也纳政府所面临的最大威胁，是来自南方的一支庞大的军队。这支部队隶属于意大利帝国，但却与罗马方面毫无瓜葛，指挥官则是一位来自利比亚的军官，谁也不知道他们究竟是如何来到这里的。\n\n尽管面临着补给短缺，与本土失联以及自身处境岌岌可危等种种困境，这些意大利人仍然对我们的新盟友构成了严重的威胁。因此，我决定对他们进行一次“友好访问”，暂时削弱他们的作战能力。或许这次打击并不能从根本上解决问题，但至少能够迫使他们花费一些时间来恢复元气。"
 GWF_union_of_samefaced_desc: "在符腾堡的西部，一支抵抗组织夺取了政权。幸运的是，这支抵抗组织并非针对我而来，他们的目标是位于日内瓦的另一个组织。我无意深究他们之间究竟有着怎样的深仇大恨，而且他们也并不出名。对我而言，更重要的是另一个事实。\n\n他们的领导人是一位名叫阿万音铃羽的女性。根据丘比提供的只言片语，她也是一位“穿越者”。或许，她原本所在的世界与我的世界并非完全相同，但我们一定能够找到共同语言，至少，这次我不必再操心该用什么语言来交流了。（感谢老天，我突然间掌握了这门语言）"
 GWF_can_cern_answer_desc: "在抵抗组织成为我们的盟友后，关于他们的头号敌人的一些细节也逐渐浮出水面。“欧洲核子研究中心（CERN）”——一个在他们原本的世界中掌握了政权的科研组织，但不知为何，他们与抵抗组织竟然一同穿越到了这个世界。他们至今仍在进行着关于时间机器和空间传送的研究。\n\n考虑到我自己就是因为一场时空乱流而莫名其妙地来到了这个鬼地方，或许这些书呆子们的研究成果能够为我指明方向。即便这一切最终都无法帮助我找到圆，但至少，我还能帮自己的盟友一把。提前削弱敌人的实力，总归是百利而无一害的。"
 GWF_unholy_alliance_desc: "在施佩尔势力范围的边缘地带，有一个小国，与他之间的关系可谓是水火不容。据我所知，那里的统治者也是一群“穿越者”，但想要与他们建立联系恐怕要困难得多。他们的领导人，巴沙尔·阿萨德，被迫逃离了他原本的国家，并以某种方式来到了这里。这使得我们与他之间的接触变得异常困难。\n\n但即便如此，他们仍然是施佩尔眼中一根挥之不去的芒刺，因此我们有必要尝试着将他们争取到我们这一边来，哪怕我内心深处并不情愿这么做。"
 GWF_redbus_luxembourg_desc: "在与卢森堡领导层进行磋商时，他们提出了一个建议——将所有对法兰克福政权心怀不满的人员从法兰克福境内转移出去。乍听上去，这似乎是一个愚蠢的提议，但仔细想想，这或许会带来意想不到的效果。理论上来说，对于施佩尔而言，这应该是一笔划算的交易。毕竟，他可以借此机会将各种各样的反叛分子驱逐出境，而这些人到了卢森堡之后，也只会自相残杀，内斗不休。\n\n而卢森堡则将获得数以万计充满斗志的战士，至于管理方面的问题，我们可以用最简单粗暴的方式来解决。因此，这场交易的最终赢家绝不会是法兰克福。"
 GWF_stuttgart_convention_desc: "至少，我们已经初步建立起了联盟。现在，我将邀请来自南德意志地区各方势力的代表团，前来参加一场同盟会议。我们必须解决一些关键问题，并明确未来的发展方向和行动目标。"
 GWF_operations_in_bavaria_desc: "巴伐利亚是目前该地区最大的国家。尽管他们的意识形态…有些“奇怪”，但他们仍然是一个举足轻重的参与者。我们将根据他们对我们的态度，来决定是削弱还是增强他们的军事实力。"
 GWF_plan_b_desc: "建立一个强大的联盟固然重要，但未雨绸缪也同样不可或缺。为了防止敌人突破我们的防线，我将下令沿着边境修建一系列防御工事。"
 GWF_look_at_powers_desc: "不难推断，一支强大的军队是在这个弱肉强食的世界中生存下去的关键。在强敌环伺的险恶局势下，如果没有军队的保护，这个国家将沦为他人砧板上的鱼肉。而我，也将成为无数心怀叵测之徒所觊觎的目标，他们将不惜一切代价夺取我的首级，以换取那所谓的“悬赏”。\n\n现在，我必须对当地的武装力量进行一次评估。或许，我应该对其中的一个军事基地进行一次突击视察。但是，我对他们的期望值很低，因此，我必须做好从零开始组建军队的准备。"
 GWF_magical_girl_army_desc: "魔法少女们拥有着远超常人的身体素质和强大的战斗力。她们完全可以被组建成一支正规军，一支能够抵御外部威胁的强大力量。当然，组建这样一支军队将会面临诸多挑战。并非每一位少女都愿意为了所谓的“国家大义”而牺牲自己的愿望和生命。更重要的是，我们还必须将这些拥有着各自不同理想和追求的少女们整合成一支令行禁止的铁军。\n\n理所当然地，将魔法少女的力量投入到现实的战争中，将会引发诸多道德与现实层面的问题。她们在战场上的表现究竟会如何？又该如何维护军队内部的组织与纪律？更重要的是，将这些年轻的女孩送上战场，这真的符合道德伦理吗？对于这些问题，我们仍未找到确切的答案。然而，至少有一个问题的答案是明确的。既然她们早已不再是“人类”了，那么那些所谓的人权，又有什么理由继续适用于她们呢？"
 GWF_its_good_to_lie_desc: "现在需要考虑一个问题——如何才能高效而迅速地为这支新生的军队招募到足够的魔法少女。当然，我们可以寄希望于奇迹的发生，让那些胸怀大志的少女们主动前来投军。然而，这样的想法无疑从一开始就注定了失败的命运。因此，我们必须另辟蹊径，尝试一些非常规的招募手段，即便这些手段在某些人眼中是那么的卑鄙与可憎。\n\n而这种手段，便是——宣传，那台早已在数十年前就被发明出来的，最为高效的洗脑机器。只不过，这一次我们需要让它重新焕发生机，并且将目标对准那些特定的群体——未来的魔法少女们。广播、传单、电影，乃至个人演讲——我们将竭尽所能，让这台机器重新轰鸣起来，为组建军队而服务。为了实现这一目标，我们不得不借鉴那令人厌恶的小生物——丘比——所惯用的伎俩，因为除此之外，别无他法。"
 GWF_control_witch_problem_desc: "在这个世界上，魔女是魔法少女最终的归宿，是绝望与痛苦的化身，她们的存在只为了杀戮与破坏，直到被其他的魔法少女所消灭。向那些涉世未深的少女们和盘托出关于灵魂宝石和魔女的残酷真相，无疑等同于自掘坟墓，让这支尚未成型的军队在顷刻间土崩瓦解。因此，这些黑暗的真相必须被排除在军队的征兵宣传之外。\n\n然而，我们仍然无法回避如何处理那些灵魂宝石已经彻底污浊，行将化身为魔女的少女们这一棘手的问题。我将采取一些措施，让军队中的普通士兵远离这些令人不快的真相。例如，将那些濒临堕落的少女移交给秘密的“净化部队”，让这些部队来处理她们的后事，至于“净化部队”具体如何处理，这就与普通士兵无关了。当然，“净化部队”不会让她们白白死去，她们还将在死后继续发光发热——化作那为其他战友提供生命能量的悲叹之种。悲叹之种仍是维持我们这支魔法部队的关键物资。尽管这听上去无比残忍，甚至可以说是惨无人道，但这就是我们所身处的这个残酷世界的生存法则。"
 GWF_inarmy_concurention_desc: "在任何一支军队中，都必然存在着这样一群“精英”战士，他们将成为军队的中坚力量，肩负起指挥官的重任，以及各种特殊而又危险的任务。为了培养出更多这样的精兵强将，我们必须鼓励军队内部的良性竞争，甚至有必要引入“决斗”制度，用最为直接的方式来解决争端，决出胜负。\n\n如何在培养竞争意识的同时，避免让军队陷入一盘散沙的境地，这将是一项极具挑战性的任务，毕竟在和平时期，我们必须通过某种方式来挑选出那些真正的人才。所以，适当的“斯巴达式”训练还是很有必要的。"
 GWF_human_army_desc: "尽管我更倾向于建立一支完全由魔法少女组成的军队，但我也不得不承认，建立一支由普通人类组成的传统军队也并非一无是处。组建魔法军队的构想虽然诱人，但潜在的风险和困难却远远大于可能的回报。\n\n幸运的是，或者说不幸的是，在组建一支人类军队这件事上，我无法提供任何专业的意见和建议，因此我必须尽快着手组建总参谋部，并招募一些经验丰富的德意志军官，让他们来负责军队的日常运作，毕竟他们才是在军事领域拥有着远超于我的专业知识的专家。必须尽快找到那些能够，也愿意指挥成千上万士兵的将领。"
 GWF_play_from_shadows_desc: "作为一名魔法少女，我对军事战术、战略以及其他各种军事理论都一窍不通。这一切都显得过于复杂，令人费解。虽然那些将军们仍然希望我能够出席军事会议，但在一群深谙军队组织之道的专业人士面前，我总觉得自己格格不入，仿佛一个局外人。\n\n因此，我宁愿将组建军队的任务全权交给那些新近组建的总参谋部，而我自己则更多地扮演一个象征性的角色，在必要时提供一些建议。当然，作为国家的领导人，我将继续担任军队名义上的总司令，但军队的实际指挥权将交由那些陆军元帅和将军们。"
 GWF_peoples_milita_desc: "除了组建正规军外，有人还提议建立一支组织性较差，训练水平较低，装备也相对简陋的部队，通过这种方式，我们能够在最短的时间内征召到大量兵员。这些部队将更多地承担辅助性的任务，作为“非常时期”的后备力量。我们将效仿过去冲锋队的模式，建立一支符腾堡人民民兵部队。\n\n通过降低入伍门槛和简化训练流程，我们可以迅速地扩充军队的规模。但愿这个计划能够取得预期的效果。"
 GWF_from_shit_and_sticks_desc: "然而，一支军队并不仅仅由那些准备战斗的士兵和指挥他们的军官组成。他们还需要用于作战的各种物资——武器、火炮、装备、制服——这些都是建立一支现代化军队的必需品。但随着军队规模的不断扩大，如何保障他们的后勤供应也逐渐成为一个迫在眉睫的问题。\n\n符腾堡规模有限的工业体系根本无力满足当前军队换装的需求。为此，总参谋部建议降低对武器生产的要求，并允许建立更多的小型作坊来为军队提供装备。显然，这样做会导致武器装备的质量大幅下降。但眼下，与其追求质量而让军队无米下炊，不如先用数量来满足最基本的需求。毕竟，有总比没有强。"
 GWF_operation_rapinam_desc: "武器装备问题日益严峻。高质量武器装备的短缺可能会在未来导致一系列灾难性的后果。解决这一问题的方法有很多，但现在我有一个绝妙的主意。\n\n我应该利用自己的魔法能力来解决军队的后顾之忧。我们可以借鉴过去从日本自卫队那里“借用”武器装备的经验，亲自前往其他国家的军火库，去“采购”一批武器装备回来。凭借着时间停止的超能力以及巨大的异次元储物空间，我完全可以不费吹灰之力就为军队提供源源不断的补给。"
 GWF_hounds_pack_desc: "现在，是时候对我们短期的军事改革进行一次总结了。在短短半年之内，我们究竟是打造出了一支战无不胜的铁军，还仅仅是装点门面，虚张声势？这一切的努力是否真的有所回报？现在，检验这一切的唯一方法，便是举行一场大规模的军事演习，全面评估军队的战备水平以及执行作战任务的能力。\n\n这场演习将持续数周，期间将模拟各种各样的作战任务和环境。所有具备战斗力部队都必须接受这次考验，否则，我们之前的努力都将化为泡影。"
 GWF_operation_occasus_desc: "一切都已准备就绪。盟友已经集结，军队已经组建，国内的各种问题也已基本得到解决。现在，是时候解决最主要的威胁了——消灭那些盘踞在我们周围的敌人。我们将对法兰克福及其盟友的阵地发动先发制人的打击。开弓没有回头箭，现在我们只能勇往直前。"
 GWF_our_time_has_come: "决战之地：德意志"
 GWF_embrace_troops: "鼓舞军心"
 GWF_allies_help: "盟友支援"
 GWF_sabotage_enemies: "破坏敌人"
 GWF_expand_industry: "扩张工业"
 GWF_carrot_and_stick: "萝卜加大棒"
 GWF_capital_attacks: "突袭首都"
 GWF_work_or_die: "工作或死亡"
 GWF_personal_involvement: "亲自上阵"
 GWF_total_mobilisation: "总动员"
 GWF_release_witches: "释放魔女"
 GWF_second_sun: "天有二日"
 GWF_great_betrayal: "惊天背叛"
 GWF_our_time_has_come_desc: "战争，终于开始了。是时候在战场上，与我的敌人们算清总账了。近两年备战的成果将昭然若揭，我们敌人与盟友结构中的每一丝细微裂痕与瑕疵都将暴露无遗。为防整个体系土崩瓦解，必须速战速决，将其彻底击溃。\n\n诚然，施佩尔和他的那帮爪牙会把一切能找到的东西都投入战争熔炉。但他们那所谓的“德意志圣战”计划注定失败。无论他们如何挣扎，都不可能获胜——对此我深信不疑。胜利必将属于我，唯我一人。"
 GWF_embrace_troops_desc: "任何战争中，最关键的因素，显然是一支规模庞大且士气高昂的军队。倘若无法维持士兵们的战斗意志，那么再先进的武器、再庞大的数量，都将毫无意义。\n\n我必须亲自担任整个军队的‘政委’。我会亲临前线，辗转各处，以此提振全军的士气。万不得已时，我亦会采取强硬手段来‘提升’士气。最重要的是——胜利。"
 GWF_allies_help_desc: "敌人的敌人，就是朋友。当下的斯图加特政府与该地区其他残余势力所组成的联盟，大致便是基于此种逻辑构建的。在当前时刻，维系这样一个成分复杂的团体的凝聚力至关重要。为维持团结，必须采取恰当的决策。\n\n但与此同时，我们绝不能忘记，他们也必须履行自己的义务。我会要求他们提供必要的武器装备。他们多半无法提供大规模的援助，但这些武器在我手中，显然比在他们手里能发挥大得多的作用。"
 GWF_sabotage_enemies_desc: "切勿忘记，在敌人后方展开行动，同样是争取胜利的一部分。若我们能从内部瓦解敌人的作战能力，那么战争的进程将会顺利得多。我会派遣受过特殊训练的特工，专门摧毁敌军的后勤系统。\n\n当然，也少不了我的亲自介入——我那暂停时间的能力，简直是为此类行动量身定做的。那些不幸的卫兵和士兵甚至不会察觉，下一秒某处就会发生爆炸，或是仓库里的武器已不翼而飞。"
 GWF_expand_industry_desc: "相比战时，在和平时期发展军事工业要困难得多。总会有人质疑‘为何如此？’、‘为何不优先民生？’等等。而当国家面临生死存亡之战时，人们便会更主动地为祖国的事业而奋斗。利用这一点，全国的工业都将开足马力，全力为军队生产武器装备。"
 GWF_carrot_and_stick_desc: "狂热志愿者的浪潮终有尽头，届时，我们将不得不寻求补充兵力的替代方案。倘若人们不愿无偿参军，那就应当用各种特权、金钱奖励，以及那些关于地位和荣誉的空洞言辞来引诱他们。\n\n除了‘胡萝卜’，也会有‘大棒’。我们将加强对逃避征召者的搜捕，降低兵员筛选的标准，并对逃兵施以严酷的惩罚。所有这些手段结合起来，必能有效扩充军队的数量。"
 GWF_capital_attacks_desc: "敌人的指挥中枢永远是其首都。为摧垮敌人的士气、消灭其决策核心，有必要发动一场大规模轰炸行动。将城市夷为平地，对胜利而言是微不足道的代价，而重建这些地区的全部成本，早已与我无关。让大地燃烧，让敌人的城市在烈焰中熊熊燃烧吧！\n\n难道说，他们还配得上怜悯吗？"
 GWF_work_or_die_desc: "这还不够，永远不够！为了完全满足武器装备的需求，工厂必须超负荷运转。十二小时，不，全天候的轮班制度必须成为普遍的常态。人民必须为这场胜利奉献自己的一切，在后方，生活的全部重心都应导向战争。\n\n倘若他们不愿如此，那就需要对他们稍加‘处理’。没人说过他们有任何选择，要么工作，要么就在更恶劣的条件下工作。矿井、矿山以及清理废墟的现场，同样也需要人手。而安全部队的成员会负责确保不让任何不满情绪滋生蔓延。"
 GWF_personal_involvement_desc: "局势…比我预想的更为复杂。速胜未能实现，而为数不多的魔法少女军团也未能取得任何显著的战果。照此速度发展下去，距离真正的失败已然不远。但无论如何都不能容许这种情况发生，即便避免失败的代价极其高昂。\n\n如果别人无法完成你交付的任务——那就亲自去做。我将不得不采取这种方式，化身为一支名副其实的、行走的军队。前线将出现奇迹，一个能在瞬间斩杀成百上千敌军士兵的存在。不幸的是，这会消耗我庞大的力量。但又能如何呢？"
 GWF_total_mobilisation_desc: "前线的局势日益恶化。原本期望的速决战已演变成一场旷日持久的绞肉机，军队正在逐渐被消磨殆尽。如今，即便是征召兵也难以满足补充兵力的需求，更不用说志愿者了。当然，我有一个解决此问题的想法，即使这个决定会让我遭人憎恨。\n\n这个方案就是——强制动员。任何年满十六岁的男性，都完全可以拿起武器，执行基础的战斗任务。两只手，两条腿，两只眼睛，一个健全的脑袋——这就是全部的筛选标准，别无他求。军事征募官将接到任务，不惜一切代价，招募尽可能多的士兵。"
 GWF_release_witches_desc: "为了速战速决，必须停止用任何体面、战争规范或其他约定俗成的界限来束缚自己。如果敌人不愿如此迅速地投降，我将迫使他接受理论上战败方所能承受的最彻底、最广泛的投降。\n\n作为大规模杀伤性武器，我们可以利用过去的魔法少女。悲叹之种无论是作为精神控制武器还是传统意义上的武器，都是绝佳的选择。试想一下，一个未经启蒙的人，从战壕中突然坠入一个万物皆欲置其于死地的抽象世界，那会是何等的恐惧？是的，为了这个目标，甚至不得不牺牲我自己的原则，但若这是为了崇高的目标，那又何乐而不为呢？"
 GWF_second_sun_desc: "为了给予敌人最沉重的打击，应当彻底忘却任何道德规范与伦理困境。战争法则、荣誉、原则？全是无稽之谈！只要目的正确，无论手段如何，都是正当的。而我将动用的手段，极其特殊，且专为战争而生。\n\n早在我不存在于这个奇异世界之时，德意志境内就遗留了相当数量、威力各异的核武器。既然如此，为何不按其原本的用途来使用它们呢？如有必要，就让一切都在火焰中燃烧殆尽！"
 GWF_great_betrayal_desc: "[GET_GWF_GREAT_BETRAYAL_DESC]"
 GWF_great_betrayal_desc_evil: "何谓胜利？我如今所取得的，并非胜利，至多不过是半途而已。背叛——此词未免过于严苛。我从未向那些所谓的“盟友”宣誓过任何忠诚。我确信，一旦时机成熟，他们会毫不犹豫地从背后捅刀。这不过是一场抢占先机的博弈，他们必须先倒在我的手下。\n\n斯图加特市政厅的盛大典礼，将为这场战争的真正终结拉开序幕。他们都应到场，“领略”我的“盛情款待”。佳肴，美酒…至于墙边的士兵，无需在意。就让这场庆典，成为他们卑微生命中最后的绝响吧。任何人都不得阻碍我达成目标。任何人。"
 GWF_great_betrayal_desc_not_evil: "罢了，战争已经取胜。但这是否意味着冲突的终结？不，绝非如此。虽说同盟尚存，但最初的矛盾爆发，也只是时间问题。背叛？亦可如此称呼，但我更倾向于将其定义为“以强权平息纷争”。与其将来卷入另一场战争，不如现在就将他们制服。\n\n我们同盟的下一次会议将在斯图加特市政厅召开。应让他们先争论一番，随后我将发出臣服的最后通牒。为确保效力，军队主力将预先部署到位，以彻底瘫痪盟国的任何潜在反抗能力。但愿他们能立刻认清形势，让一切在不动干戈的情况下收场。"
 GWF_burned_field: "焦土政策"
 GWF_end_the_surviours: "终结幸存者"
 GWF_close_the_curtains: "拉上帷幕"
 GWF_prepare_everything: "做好万全准备"
 GWF_end_the_unloyal: "铲除异己"
 GWF_subdue_the_useful: "降服有用之人"
 GWF_useless_instruments: "无用之工具"
 GWF_incubator_free_zone: "无孵化者区"
 GWF_total_expansion: "全面扩张"
 GWF_my_own_universe: "吾之宇宙"
 GWF_break_the_celling: "打破天花板"
 GWF_search_everywhere: "搜寻每一处角落"
 GWF_this_isnt_working: "毫无头绪"
 GWF_fateful_meeting: "命运的邂逅"
 GWF_burned_field_desc: "战争结束了，这一次是真的。主要的内外敌人已被肃清。而我现在是这片从地中海延伸至图林根的广袤土地上唯一的女皇。对普通人而言，这足以欢欣鼓舞，毕竟离再次统一整个德意志已然不远。但是…我却没有任何理由高兴。而且短时间内也不会有。\n\n小圆…仍然找不到。尽管现在已无人妨碍我的搜寻，却连一丝痕迹、一个线索都没有。我仍在期盼最好的结果，坚信在不久的将来，她定会出现。我走过的这一切绝非徒劳，很快，我一定会将一切都夺回来。哈哈，看来我在这里还有些事情要做，但我必定会达成我的目标。"
 GWF_end_the_surviours_desc: "是的，敌人已被击败，但他们那卑劣的意识形态仍根深蒂固。它渗透在城市、街道、人群之中。身处法兰克福或苏黎世，你仍能轻易听到人们谈论着“旧政权”以及“我们为何战败”。看来，是时候提醒他们，从今往后，谁才是这里的统治者了。我不能容忍任何妨碍我的人，我的耐心已经耗尽。\n\n最严酷的管理者将被派往那些“解放”的区域，他们将负责执行肮脏的工作——将这类思想从那些白痴的头脑中彻底根除。为达此目的，他们被允许动用一切手段。从监狱和劳改营，到行刑队和直接的枪决。决不能让这些细微的障碍滋长蔓延。"
 GWF_close_the_curtains_desc: "自南德意志统一以来，“来自外界”的关注急剧增加。虽然我并不确切了解这片陷入混乱的土地之外的世界状况，但我也不需要多余的窥探目光。我所统治的领土，必须成为各种情报机构、无线电爱好者以及单纯是过于好奇之人的信息黑洞。他们不该知道我是谁，也不该知道这里发生了什么。\n\n是的，也许在未来这会损害所谓的“国际关系”或“经济发展”。但这整个宇宙及其未来，于我而言并无关紧要。我必须不断告诫自己：谁也不能阻止我找到小圆。"
 GWF_prepare_everything_desc: "看来，这远非终点。在全身心投入寻找圆之前，我还有许多“最后的润色”需要完成。我的领地与其说是一个有组织的实体，不如说是一个燃烧的垃圾场。即便混乱本身就是一种组织形式，但若不采取某些激进的手段，达成我的目标也将难于登天。当然，这些手段可能惠及民众，也可能祸害苍生。\n\n于我而言，这无关紧要，其中并无任何逻辑可言，唯有实现我的目标才是真理。然而，是时候仔细斟酌，这些激进手段具体该包含什么，才不至于反噬己身。"
 GWF_end_the_unloyal_desc: "依旧有人对我的权威心存疑虑。是时候了，不论用何种方式，我必须彻底解决这个问题。至于具体如何动手，将取决于我此前的行事风格。"
 GWF_subdue_the_useful_desc: "诚然，各种各样的人都站在我的对立面，但不能说他们都一无是处。其中不乏优秀的战士、学者和管理者。若我能将他们的才能引导至为我所用的轨道上，那将是迈向终局的极佳一步。\n\n当然，他们休想获得任何自由。每一个这样的人都将被置于最严酷的监控之下，确保他们连一丝一毫怠工或以任何方式妨害我事业的念头都无法产生。安全部队必须将所有这类人牢牢看管起来。朋友要近，敌人要更近。可我在这里断无朋友可言，所以，每个人都得拴在最短的绳套上。"
 GWF_useless_instruments_desc: "军队、官僚、特务机构——这些都不过是我一手搭建的宏大戏剧中的一部分。现在，正是决定下一步走向的关键时刻。我是该继续担任这剧院的总监，还是亲手将其夷为平地？"
 GWF_incubator_free_zone_desc: "孵化者——这些我所憎恨的卑劣生物。当然，近来我一直在与它们合作，因为能从它们那里获取许多宝贵的情报和服务。然而，我们的道路迟早要分道扬镳。我将撕毁这份与异类的“契约”，我的新任务将是尽可能多地消灭它们的存在。\n\n但问题依旧存在：我该如何独自消灭它们全部？恰恰是在这一点上，孵化者们将“助我一臂之力”。几个诱导性的问题将成为我的钩子，用以钓取关于它们弱点的一切必要信息。让这些异类亲手编织绞死它们自己的绳索吧。这是它们罪有应得。"
 GWF_total_expansion_desc: "我所控制的仅仅是德国的一部分，这极大地阻碍了我的搜寻。北方已然形成一股相当强大的势力，足以对我及我的目标构成威胁。我不会容忍它们继续存在，它们是巨大的绊脚石，必须倾尽全力将其移除。为了战胜它们，即便使用卑劣的手段，我也在所不惜。\n\n是的，这很可能意味着又一场战争，但与上次冲突不同，这次的战场将是德国余下的全部土地。将我的疆域一直拓展到贝根，寻找圆的进程应当会变得顺利许多，许多。"
 GWF_my_own_universe_desc: "如今，一片广袤而多元的土地已匍匐在我的脚下。我并非立刻意识到，治理一个小镇及其周边与掌控一个昔日的超级大国，根本不可同日而语。许多事务如今必须以截然不同的方式处理，否则这整个结构将向内崩塌，彻底埋葬我所有的夙愿。\n\n或许，我应当反思过往的决策，为任何可能出现的情况做好准备。破坏，当然比建设容易。但即便如此，在达成目标之前，绝不能错失这样的机遇。从今往后，无论我的统治是何种形态，德国必将真切地感受到它的存在。"
 GWF_break_the_celling_desc: "德国——毫无用处。我无比确信，必须扩大搜寻范围，不惜任何代价。我甚至准备冒险离开这片异常区域。若我能成功，那么我将在全世界寻找圆。无论如何，我都要找到她…先向西去，对，这是个好主意，就从最近的“非区域”领土开始，这将是新一轮搜寻的良好开端。但愿这能有所改变…"
 GWF_search_everywhere_desc: "蠢货，没用的蠢货！我一个人无法在如此广阔的区域内寻找圆，所以我将这个任务委托给了安全部队，可他们连线索的边都没摸到。他们凭什么领这份薪水？他们应该找到些什么，而不是交上那些用枯燥的官样文章写成的空洞报告。从现在起，命令就是：让他们想去哪找就去哪找，如果他们找不到她，后果将极其残酷。"
 GWF_this_isnt_working_desc: "她在哪儿，她到底在哪儿？为什么直到现在我还找不到她！我已经为此付出了一切可能，但我离知小圆身在何处，依然遥遥无期。为什么…"
 GWF_fateful_meeting_desc: "这究竟是上天的启示，还是对我辛劳的回报。我不得而知，但现在，我终于可以朝着我故事的终点迈进了。"
 GWF.1.t: "高处不胜寒"
 GWF.1.desc: "寒风呼啸而过，吹动着晓美焰发间的黑色丝带。她静静地坐在摩天大楼的屋顶边缘，双腿悬空，目光漫无目的地扫过这座陌生城市那杂乱无章的灯火。那些写着她看不懂的文字的标牌，那些如同钢铁甲虫般在街道上穿梭的汽车，还有那些穿着款式怪异大衣的行人——一切都是那么格格不入。就连空气中的气味也与她所熟知的一切截然不同：汽油味，雨水的潮湿，以及某种金属特有的冰冷气息。\n\n“为什么会这样？”——这个念头如同卡壳的唱片般，在她脑海中一遍又一遍地重复着。她紧紧地握住了双拳，隔着手套，她仍能感受到混凝土粗糙的质感。在她来到这里之前的那一刻的记忆，已然变得模糊不清：刺眼的光芒，圆香那撕心裂肺的呼喊，以及紧随其后的……无尽的虚空。既不是魔女那光怪陆离的结界，也不是见泷原那些熟悉的街道，而是一座陌生的城市，一个完全陌生的世界。\n\n“圆…”她的声音消散在了风中。\n\n她闭上眼睛，试图在脑海中勾勒出挚友的笑容，但浮现出的，却是灵魂宝石上那一道道触目惊心的裂痕，以及她自己许下的那些早已支离破碎的承诺：“我会拯救你，不惜一切代价。”现在，就连这曾经坚如磐石的誓言，听上去也如同一个自欺欺人的笑话。她改写了规则，重塑了现实，但换来的，却不是掌控一切的自由，而是一座更为牢固的牢笼。\n\n城市中的某处，警笛声凄厉地响起，晓美焰下意识地握紧了手中的弓。没有魔女，也没有使魔，只有大都市那令人心烦意乱的喧嚣。这一刻，晓美焰甚至怀疑自己是否出现了幻觉。又或许，这是死亡来临前的幻象，自己已然坠入了地狱，亦或是那所谓的“炼狱”？\n\n“你毁掉了一切。”晓美焰喃喃自语，缓缓地站起身来。\n\n脚下的碎石发出轻微的响声。城市依旧沉浸在它那庸碌的日常之中：行人们在河堤边漫步，一位老人正在喂着鸽子，一个孩子则在追逐着一个皮球。一切都显得那么平凡，但一种诡异的紧张感却依旧弥漫在空气之中，然而却没有人察觉到一丝异样。没有人抬起头，仰望天空。没有人注意到，在那高楼的边缘，一位身着黑白相间连衣裙的少女，正准备纵身跃下，坠入那无尽的深渊。\n\n“如果我消失了，”她一只脚已经迈出了边缘，“会有所改变吗？”"
 GWF.1.a: "无尽的坠落。"
 GWF.2.t: "能力与力量"
 GWF.2.desc: "自从晓美焰来到这个陌生而又荒诞的世界，已经过去好几个星期了。凭借着她那点可怜的历史知识，她也能够推断出，自己绝非仅仅是被传送到了过去。欧洲不可能在二十世纪七十年代还使用着那些印有扭曲的万字标志的红旗，这一定是一个与她所认知的世界截然不同的平行宇宙。当然，由于缺乏足够的情报，她无法做出百分之百的肯定，这也使得她在很长一段时间内，都表现得格外低调，尽量避免引起周围人的注意。\n\n不过，她也并非每次都能成功地隐藏自己的行踪，有时候也会被当地人撞见。而这时，另一件怪事便会发生。那些与她有过一面之缘的人，在看到她之后，都会表现得格外敬畏，甚至是毕恭毕敬。她不明白这些人为何会如此，因此她决定暂时将这个问题搁置在一旁。\n\n此刻，晓美焰正身处于城市郊外的一片小树林中。她紧握着手中的灵魂宝石，化身为魔法少女的形态，并转动了时之盾牌。时间停止了流动。她从盾牌后方取出了不久前找到的一把HK G3步枪，扣动扳机，几发子弹脱膛而出。在离开枪膛的一瞬间，子弹便凝固在了半空中。\n\n“这方面倒是没有什么问题。”晓美焰自言自语，她再次转动盾牌，让时间恢复了正常。\n\n紧接着，在她手中，记忆之弓凭空浮现——这是她在第一次重塑世界后，取代了盾牌，成为她主要武器的那把长弓。她拉开弓弦，一支闪耀着光芒的箭矢穿透了已经被子弹击中的树干。\n\n“看来我的所有能力都还在…暂时把弓箭留到最后关头再用吧。”晓美焰总结道。\n\n夜晚轻柔的微风拂过晓美焰的面庞，她抬起头，仰望着那缀满了星辰的夜空。静静地伫立了片刻后，她转身朝着城市走去。"
 GWF.2.a: "是时候开始行动了。"
 GWF.3.t: "狩猎野兽"
 GWF.3.desc: "这是一片工业区。高耸的灰色厂房沿着河岸鳞次栉比地排列着，如同巨大的坟冢一般。烟囱中冒出的滚滚浓烟与低垂的云层交织在一起，将天空染成了一片浑浊的铅灰色。晓美焰沿着生锈的铁轨缓步前行，她的靴子踩在枕木上，发出沉闷的声响。三个星期，整整三个星期，她一直都在四处奔波，在废弃的地下室和阁楼中仔细搜寻，然而却始终一无所获。这座城市似乎将所有关于丘比的踪迹都抹去得一干二净，只留下了一些细微的线索：混凝土墙壁上的划痕，铁丝网上残留的白色毛发，还有空气中那隐约可闻的、淡淡的臭氧味。\n\n她在一间废弃的仓库前停下了脚步。仓库的墙壁上涂满了涂鸦——不知是谁留下的名字、日期，以及各种毫无意义的符号。生锈的门上挂着一把锁，但锁链已经被剪断。仓库里弥漫着机油和霉菌的气味。手电筒的光柱扫过成堆的箱子、散落的电线和碎裂的玻璃。突然，有什么东西动了一下。一个模糊的影子一闪而过，发出如同丝绸摩擦混凝土般的沙沙声。\n\n她沿着一排排货架缓缓前行，放慢了呼吸。每一步都回荡着空旷的回声。突然，一道光束扫过了一抹白色的身影——丘比正蹲坐在屋顶下方的管道上，它那粉红色的眼睛在昏暗中闪烁着诡异的光芒。\n\n“你跑不掉了。”她低声说道，但那只生物已经纵身跃进了通风井中。\n\n晓美焰毫不犹豫地追了上去，沿着梯子向上攀爬。通风井通向屋顶，在那里，狂风肆虐，将浓烟撕扯成碎片。丘比沿着栏杆边缘飞奔，头也不回。晓美焰紧随其后，跳过屋顶上的缺口，在金属板上飞奔。追逐将他们带进了一个由管道和水箱组成的迷宫。\n\n丘比闪身钻进了一个狭窄的缝隙中。晓美焰放慢了脚步，紧贴着冰冷的金属。四周一片寂静，只有冷凝水滴落在铁皮上的滴答声。\n\n她抽出了一把“瓦尔特”手枪，瞄准了那只野兽的后腿。她必须做到精准命中，要是把它给打死了，它就又会再次消失。就在这时，丘比已经来到了高耸的水塔边缘，一声枪响划破了寂静。正中目标，那只白色的野兽停下了脚步，依旧蹲坐在原来的地方。\n\n“终于抓到你了……，”晓美焰走上前去，说道。\n\n那只生物抽搐了一下，试图挣脱，但很明显，一切都结束了。晓美焰走上前，仔细地打量着这只生物。丘比的眼睛眯了起来——这并非出于恐惧，而是一种精于算计的眼神。\n\n“现在，你该开口说话了。”她低声说道。"
 GWF.3.a: "“人类，你想要什么？”"
 GWF.4.t: "主权"
 GWF.4.desc: "“您的意思是，这些人将我视作这片土地的统治者？”晓美焰满脸疑惑地问道，看着在她周围忙碌着的那只“猫”。\n\n根据我们的数据分析，确实如此，正如我之前所言，你被这里的人们视作这片土地的领袖。丘比回答道。\n\n“嗯，丘比，那你说，我该如何利用这一信息呢？”这位魔法少女追问道。\n\n“至少，你现在可以随心所欲地行使自己的权力了，”那外星生物答道。\n\n“好吧，我会试着去接受这一切，”晓美焰朝着空无一人的方向说道，完全无视了丘比的存在。\n\n天空开始泛起鱼肚白，对于普通人而言，新的一天已经开始。市政厅应该已经开门了，因此晓美焰决定去验证一下丘比关于自己是这片地区“最高领袖”的说法的真伪。二十分钟后，晓美焰来到了市政厅前的中心广场，这是一座哥特式建筑，中央矗立着一座钟楼。\n\n“但愿一切都能顺利，”晓美焰自言自语地说着，走上前去敲响了大门。\n\n敲门声刚落，一名身着军装的男子便从门内快步走出，他脸上写满了紧张与不安。\n\n“晓美阁下，欢迎来到您的官邸，这里的每一位工作人员都将竭诚为您服务。”警卫用颤抖的声音说道。\n\n“好的，谢谢，”晓美焰一边说着，一边小心翼翼地走进了大厅，“请带我去我的办公室。”\n\n对她而言，警卫的这番话无异于一颗定心丸。丘比的说法似乎是正确的，她总算可以松一口气，不必再担心自己的贸然闯入会造成什么难以收场的尴尬局面了。\n\n在沿着走廊前行的过程中，职员们都恭敬地向这位魔法少女鞠躬行礼。跟随着如同向导般的警卫，她仔细地观察着这座哥特式建筑内部的陈设：高耸的穹顶，昏暗的光线，再点缀以些许官僚机构的风格和纳粹的标志，给人一种难以言喻的压抑感。不知不觉间，晓美焰内心的紧张感烟消云散，一种微妙的念头油然而生——她才是这里的主宰。\n\n“我们到了，”警卫打断了女孩的思绪，“请问您还有什么吩咐吗？”\n\n“没有了，谢谢，你回去工作吧。”晓美焰回答道。\n\n“是！长官！”警卫应道，然后以标准的军姿，迈着整齐的步伐朝着大门的方向走去。\n\n推开办公室的门，映入眼帘的是一间宽敞的房间，透过巨大的窗户，可以俯瞰整个城市广场。房间的陈设十分简洁，仿佛是为了让统治者能够心无旁骛地处理公务而特意设计的。晓美焰缓缓地走到窗前，俯瞰着窗外的景色。"
 GWF.4.a: "或许，一切都会变得容易起来…"
 GWF.5.t: "无人理解"
 GWF.5.desc: "晓美焰独自坐在办公室的桌前，桌面上堆满了各种各样的文件：报告、备忘录、法令……它们的内容各不相同，但对统治者而言，每一份文件都需要她亲自过目，并做出相应的批示。这让她感到无比疲惫，她无法理解，为什么自己要做这些毫无意义的事情。时间一天天地过去，而她在追寻自己的终极目标——找到鹿目圆，并在必要时拯救她——这一道路上，却始终毫无进展。\n\n有人敲响了办公室的门，不出所料，又是一位职员送来了新一批的文件。又是文件，又是文件夹，又是各种各样的法令。这样的日子一直持续到了傍晚，终于，除了几名负责安保的警卫，市政厅里的所有工作人员都已经下班离开了。\n\n女孩望向窗外，城市的夜景灯火辉煌，汽车如同穿梭的萤火虫般在道路上缓缓移动，无所事事的人们在广场上漫无目的地游荡着。她早已无法理解普通人的这些消遣方式，十几年的时间循环，一次又一次的失败，至今仍在不断持续，这一切早已让她的内心变得麻木。这一切都让人难以承受，更别提那些数不胜数的“职责”了。\n\n突然，她身旁出现了一个身影，即便是在这昏暗的环境中，也能立刻辨认出它的身份。\n\n“有什么事吗，丘比？”晓美焰问道。\n\n“我能感觉到，你对眼下的处境非常不满。或许，你应该利用手中的权力来实现自己的目标？”丘比提议道。\n\n“这毫无意义，没有人能够理解这究竟是怎么一回事，哪怕是其中最微不足道的一点，”晓美焰斩钉截铁地回答道，“这没有任何意义。”\n\n突然，一个念头闪过她的脑海，仿佛一道灵光，让她瞬间茅塞顿开。她坐回到桌前，拿起钢笔和一张空白的纸。笔尖在纸面上飞快地滑动，一行行文字跃然纸上，直到整张纸都被写满。\n\n“现在，没有人能再阻拦我了，”她拿起那张纸，开始重读自己刚才写下的每一个字："
 GWF.5.a: "关于实施特殊管理制度的法令"
 GWF.6.t: "鹰犬"
 GWF.6.desc: "坐在办公室里，晓美焰再次陷入了沉思。诚然，她已经放弃了对国家大小事务的直接掌控，但如果任由局势这样发展下去，她的生命迟早会受到来自各方敌对势力的威胁。她突然想到，或许可以组建一支直接听命于自己的武装警察部队。他们应当是一群心狠手辣、冷酷无情的刽子手，即便将他们像炮灰一样投入到最危险的境地，也丝毫不会感到惋惜。她起草了一份命令，要求扩充“安全部队”，使其完全听命于自己，但问题在于，该从何处招募这些“鹰犬”呢？她迅速下令，要求有关部门提交一份关于斯图加特政府所控制的所有武装力量的详细报告。第二天，一切准备就绪。\n\n“长官，这是关于我们所能调动的警备力量的报告。”一位办事员将一小叠文件递到了晓美焰面前。\n\n“多谢，你办得很好，退下吧。”晓美焰接过文件，答道。\n\n晓美焰锁上办公室的门，走回桌前。桌面上只有几张空白的纸张，而那些需要她亲自批阅的法令、法规和报告，都已经被她丢给了那些基层官员，让他们自己去处理那些繁琐的事务吧。对她而言，她的目标只有一个，而管理一个国家显然不在她的计划之中。她翻开文件夹，开始仔细阅读那些文件。文件中详细列出了所有仍然效忠于符腾堡政府的警察和特工的信息，他们没有在这场浩劫中临阵脱逃。\n\n她的目光在一行行文字间快速扫过，突然，一份标题为“党卫军部队”的文件引起了她的注意。文件中简要介绍了这支部队的历史：“残暴无情”，“绝对忠诚”，“组织严密”——这些字眼正是晓美焰所希望看到的。她的任务是找到一批能够为她处理那些见不得人的“脏活”的人，那些连她本人都无法亲自动手的肮脏勾当。这支部队的人数并不多，只有大约一千人，但即便如此，也足以满足她的需求了。\n\n她拿起一张白纸，开始起草一份正式信函，命令当地的党卫军头目，也就是“海因里希·希姆莱警卫旗队”的首领——威廉·蒙克前来觐见。在将信件寄出后的几天，她便收到了回音。蒙克同意了她提出的所有要求，并为了表达忠诚，同意组建一支“晓美焰警卫旗队”，以取代那个“只会夸夸其谈的马桶推销员”所领导的部队。"
 GWF.6.a: "总得有人来承担这些“肮脏”的工作。"
 GWF.7.t: "孤注一掷"
 GWF.7.desc: "晓美焰坐在办公室的桌前，桌面上堆满了各种各样的文件：报告、备忘录、法令…它们的内容各不相同，但作为领导者，她有义务阅读每一份文件，并做出相应的批示。这让她感到精疲力竭，她不明白自己究竟为什么要去做这些毫无意义的事情。时间一天天地流逝，而她却离自己的终极目标——找到鹿目圆，并在必要时拯救她——越来越远，没有丝毫进展。\n\n有人敲门，不出所料，又是一位办事员送来了一批新的文件。更多的文件，更多的文件夹，更多的法令……直到傍晚时分，市政厅里的工作人员才总算陆续下班离开，只剩下几名负责安保的警卫。\n\n漫漫长夜，她独自一人在文件中度过，当黎明破晓之时，她仅仅处理完了一半的文件。晓美焰颓然地靠在椅背上，正准备小憩片刻，但敲门声却再次响起，打断了她的计划。又一名官员走了进来，手中还抱着一摞文件。晓美焰强压着心中的厌恶，抬眼望向来人。\n\n“抱歉，晓美阁下，请问您有什么不满意的吗？”那位身穿棕色夹克的男子问道，声音中带着一丝颤抖。\n\n“没错，我不满，而且我已经厌倦了掩饰自己的不满。为什么只有我一个人需要处理这些该死的公务？”晓美焰怒吼道。\n\n“阁下，但这是您亲自制定的管理制度…”那位官员小心翼翼地反驳道。\n\n“我亲自制定的？哦，上帝啊，”晓美焰抬手扶额，猛然间意识到，这一切都是那“世界线融合”所带来的后遗症，实际上，这并非任何人的过错。\n\n“您知道吗，在政府内部，有一个团体，”那位官员咽了口唾沫， 紧张地拨弄着夹克上的纽扣，说道，“他们一直主张重新开放议会。”\n\n“哦？有意思，详细说说看，”晓美焰顿时来了兴致。\n\n那名官员环顾四周，然后开始向她讲述起政府内部这股改革派势力的主张，而他本人也是其中的一员。他们主张恢复公民自治，并在符腾堡建立一个真正意义上的议会。这位官员口若悬河，但晓美焰对其中一半的术语都感到一头雾水。但“权力下放”的核心思想她还是理解的。没有过多犹豫，晓美焰便同意了这一计划，这让那位官员大感意外。与此同时，在一张空白的纸上，几个大字跃然纸上："
 GWF.7.a: "关于恢复市政厅部分职能的法令"
 GWF.8.t: "沉浸在思绪（和睡梦）中"
 GWF.8.desc: "在市政厅的会议厅内，人们正在紧锣密鼓地筹备着宪法的制定工作。来自不同党派的政治家们轮流发表着各自对宪法草案的看法，阐述着各自的观点，分析着其中的利弊得失，以及在当前局势下颁布宪法的意义。然而，当这些陈词滥调在空旷的大厅中回荡时，作为斯图加特名义上的统治者——晓美焰，却只是机械地点着头，以示礼貌。\n\n她本无意参加这场冗长的议会会议，因为在她看来，自己的出席根本毫无意义。然而，在议员和其他政客们的软磨硬泡之下，她最终还是改变了主意。“如果您不出席，那么我们的会议也将失去意义，”他们这样说道。或许，晓美焰甚至做好了随时叫停这场会议的准备，但在内心深处，她知道，这样做只会让她离自己的目标越来越远。\n\n她已经在这里枯坐了一个半小时，而发言者的声音却依旧此起彼伏，不绝于耳。“人们究竟是如何做到相互协作的？”晓美焰暗自思忖，她回想起了丘比曾经对她说过的人类情感。领导才能、地位——这一切如今看来都不过是宇宙开的一个残酷的玩笑。自己怎么就稀里糊涂地成了德国这片混乱之地的统治者呢？要是说出去，恐怕只会成为人们茶余饭后的笑料吧。\n\n她的思绪逐渐飘向了远方，开始反思自己的决定是否正确，是否会在追名逐利的道路上迷失方向，忘记了自己最初的目标。就这样，在无尽的思绪中，晓美焰不知不觉地沉入了梦乡。不过，即使她意识到这一点，恐怕也不会太过在意。毕竟，相比起“聆听关于符腾堡王国宪法的议案”，一场酣畅淋漓的好梦或许要有用得多。"
 GWF.8.a: "领导的重担是沉重的。"
 GWF.9.t: "与神父的对话"
 GWF.9.desc: "晓美焰静静地坐在城市西部圣伊丽莎白教堂的长椅上。教堂内部，工人们正热火朝天地忙碌着，更换着一些老旧的彩色玻璃窗，并布置着一些崭新的圣像。教堂的神父站在她的身旁，静静地注视着施工的进展。她本无意在此地与人攀谈，但在内心深处，她渴望与人交流，最终，她还是鼓足了勇气，打破了沉默。\n\n“康拉德神父，请原谅我的冒昧，但我现在所做的这一切，难道不算是一种亵渎吗？”晓美焰问道。\n\n“你自己发起的这些事情，反倒来问我的看法，孩子，这个问题可真是耐人寻味啊，”神父摸了摸下巴，回答道，“万事万物皆有其存在的目的，那么你的所作所为，也必然有其意义。”\n\n“或许您说的对。一个试图颠覆上帝的人，究竟会面临怎样的命运呢？哪怕他是为了上帝的福祉着想。”晓美焰自言自语道，仿佛在对自己的所作所为进行反思。\n\n“为了祂的福祉？上帝永远有着自己的安排，或许，这场颠覆也包含其中。凡人永远无法参透天堂深处的奥秘，”康拉德平静地回答道。\n\n“或许，祂已经被推翻了，只是祂的宝座仍然空悬，而我们如今正身处这乱世之中？”晓美焰说道。\n\n“我无权评判这一切，但如果上帝真的抛弃了我们，那么眼下这混乱不堪的局面，或许就能找到一个合理的解释了。”他苦笑着说道。\n\n“谢谢您，神父，”晓美焰点了点头，结束了这次谈话。\n\n教堂的翻新工程一直持续到了傍晚，晓美焰并没有插手工人和神父的工作，只是静静地坐在一旁，默默地观察着。最终，教堂的内部陈设焕然一新，一切都按照她的设想完成了。她将一本崭新的布道书交给了神父，并承诺将在周日来参加这座焕然一新的教堂的礼拜仪式。\n\n星期天，教堂里挤满了前来做礼拜的信徒，他们似乎早已对这些新的布道词烂熟于心。晓美焰也来到了教堂，她选择了最后一排最靠边的位置，以免被人认出来。按照神父的说法，今天前来做礼拜的人数比以往任何时候都要多。或许，即便仅仅是微不足道的改变，也能够让晓美焰距离自己的目标更进一步。"
 GWF.9.a: "难以捉摸的计划？"
 GWF.10.t: "迷雾中的曙光"
 GWF.10.desc: "斯图加特弥漫着一股施工的气息，宛如一座巨大的工地。曾经被战火摧残的商店橱窗，如今被草草地钉上了木板；在城市的广场上，人们用从早已废弃的集体农庄里“借”来的手推车贩卖着蔬菜。街头仍然能看到一些无家可归之人，但与过去不同的是，他们如今不再是为了果腹而翻找垃圾，而是为了搜寻一些可以利用的建筑材料。晓美焰漫步在城市的街道上，低着头，若有所思。她那一身黑色的连衣裙与这座死气沉沉的城市格格不入，但至少，就连雨水也冲刷掉了残留在建筑物外墙上的那些烟尘与污垢。\n\n“晓美阁下！”一个身穿破旧夹克的少年朝着她喊道。他手里拿着一沓报纸，头版头条上赫然写着“政府宣布启动学校重建计划”。“谢谢您…我妈妈说，要是没有您…”\n\n晓美焰放慢了脚步，但没有回答。“谢谢”？自己究竟做了什么，值得他们如此感激？她不过是签署了一些别人递交给她的文件罢了，这难道还不够吗？\n\n市政厅，这座曾经阴森可怖的哥特式堡垒，如今被脚手架层层包围。在门口，一队“安全部队”的士兵正在值勤——他们并非身穿黑色制服的刽子手，而是一群穿着破旧警服的普通警察。他们的长官，汉斯·菲尔宾格，正在门口等候着她的到来，手中拿着一沓报告。\n\n“阁下，”他像一位旧时代的贵族般优雅地鞠了一躬，“在与俄国人的战争中被摧毁的Z区已经完成了重建。但来自法兰克福的那些袭击者仍然十分猖獗，我们的处境没有丝毫好转。”\n\n“修建防御工事，壕沟，碉堡。想尽一切办法，哪怕只是迟滞敌人的进攻也好。”晓美焰回答道。\n\n“请您原谅，但我们并没有足够的资源…”汉斯试图辩解。\n\n“你以为我能够创造奇迹吗？”晓美焰终于抬起头，直视着他，“尽你们所能去做。”\n\n他愣了一下，然后点了点头，转身离开了。晓美焰独自一人站在那里，面对着一张巨大的地图。这张印有“大日耳曼国”字样的巨幅地图上，已经被各种各样的文字、草草画出的边界线以及各种标记涂得满满当当。尤其引人注目的是德国的波罗的海沿岸地区——那里开始流传着关于“岛屿之神”的种种传言。\n\n傍晚时分，她独自一人来到了屋顶。城市中的火光早已熄灭——取而代之的，是那一盏盏摇曳在窗户中的煤油灯。不知从何处传来了手风琴那悠扬的琴声，与商贩们此起彼伏的叫卖声交织在一起，汇成了一曲独特的交响乐。即便是在这片混乱之中，生命的气息也依旧顽强地在每一个角落中生长。\n\n“您看上去并不像是一位暴君，”身后传来一个声音。汉斯站在门口，手中拿着一杯咖啡，“人们坚信，您能够拯救他们。”\n\n“他们错了，”晓美焰转过身，背对着他。\n\n“或许吧。但只要他们还心存希望，他们就有力量去修复排水管道，抚养孩子。”他将咖啡杯放在了护栏上，“有时候，您需要做的仅仅是…存在。”\n\n他悄然离去，只留下晓美焰独自一人，凝望着那笼罩在夜幕下的无尽远方。"
 GWF.10.a: "播撒下希望的种子，或许能够找到心灵的慰藉。"
 GWF.11.t: "点燃火焰的话语"
 GWF.11.desc: "晓美焰站在市政厅的阳台上，手中紧紧攥着一份演讲稿。楼下的广场上，人头攒动，黑压压的一片：穿着沾满油污工作服的工人，抱着孩子的母亲，拄着拐杖的老人……“安全部队”竭力维持着秩序，但就连他们那一张张冷峻的面孔上也难掩紧张期待的神情。那些为她准备演讲稿，并协助组织这次集会的官员们，也都屏息凝神，大气都不敢喘一下。\n\n“斯图加特的公民们，”晓美焰的声音机械而生硬，仿佛一个正在背诵课文的机器人，“我们的城市经历了…苦难。但只要我们团结一心…就一定能够…重建家园…”她突然停了下来，目光茫然地扫视着下方的人群。手中的讲稿微微颤抖。人群中，一个一闪而过的粉红色身影，唤醒了她尘封已久的记忆。“这不是他们想听到的，”一个突如其来的念头在她脑海中闪过。\n\n她的心脏猛烈地跳动起来。晓美焰一把将演讲稿丢开，任凭它随风飘落。\n\n“你们知道失去一切是什么滋味吗？”她的声音嘶哑而尖锐，与方才判若两人。人群顿时安静了下来。“你们只能死死抓住那些残垣断壁，将它们视作最后的救命稻草。我也是。但如果我们只顾着争夺那些冰冷的石头，我们就会忘记，我们究竟是为了谁而奋斗。\n\n她沉默了，仿佛连她自己都无法相信自己所说的话。人群中，有人高喊道：“为了家人！”另一个人喊道：“为了孩子！”\n\n“没错。为了我们所爱之人，”晓美焰紧紧地抓住了阳台的栏杆，她感觉到，口袋里的灵魂宝石仿佛也感受到了她此刻的心情，微微地跳动着，散发出一阵阵温暖。“哪怕他们已经不在我们身边，哪怕…你们认为他们已经永远地离开了我们。”\n\n人群中爆发出雷鸣般的掌声，欢呼声与哭泣声交织在一起。一些人在哭泣，一些人在拥抱，就连平日里不苟言笑的汉斯，也忍不住用手捂住了自己的嘴，露出了一丝欣慰的笑容。而晓美焰，在走下阳台时，却不禁开始思索：“这些话究竟是从何而来的呢？”"
 GWF.11.a: "有时，真相往往蕴藏于苦痛之中。"
 GWF.12.t: "沉默的阴影"
 GWF.12.desc: "斯图加特笼罩在一片死气沉沉的氛围之中，呼吸间都仿佛能闻到空气中弥漫的灰烬的味道。商店那空洞的橱窗如同一个个没有眼珠的眼眶，在街道上绝望地凝视着，一群群无家可归的流浪汉在街头游荡，他们彼此咒骂着，为了争夺几瓶廉价的劣酒而大打出手。远方不时传来阵阵枪声——不知道是强盗们在争夺地盘，还是警察在试图维护那早已荡然无存的秩序。晓美焰独自一人在城市中穿行，对周围的喧嚣充耳不闻。她那身黑色的连衣裙与周围的断壁残垣融为一体，而她那冰冷而锐利的目光则死死地盯着远方，仿佛在搜寻那一抹她朝思暮想的粉红色。\n\n“晓美阁下！”一个沙哑的声音打断了她的思绪。一位穿着破烂大衣的老人从倒塌的遮阳篷下蹒跚着走了出来。“您…您不是我们的统治者吗？救救我们吧！他们抢走了我们最后的食物…”\n\n晓美焰放慢了脚步，但没有停下来。\n\n“去找那些还相信法令的人吧，我没时间管这些闲事。”她头也不回地说道。老人愣在了原地，仿佛早就料到了会是这样的回答。然后，他开始一瘸一拐地朝着远处走去，嘴里嘟囔着一些关于“该死的巫师”之类的话。\n\n她拐进了一条小巷，那里曾经盛开着栗子花，但现在却只剩下一片狼藉，到处都是破损的家具和生锈的铁桶。在一家酒吧附近，可以听到一个退伍老兵和一个无家可归的人的争吵，以及紧接着传来的，拳拳到肉的声音。她想起了丘比，想起了它那充满嘲讽的声音：“你本可以将这座城市变成一座坚不可摧的堡垒，但你却选择了做一个冷眼旁观的看客。”旁观者…没错。她所关心的一切，都存在于这座人间地狱之外。圆。只有圆，才是她的一切。\n\n与周围那些仍在苟延残喘的破败建筑相比，市政厅显得格格不入。这座建筑几乎毫发无损，仿佛是这片废墟中唯一的一处世外桃源。这也并不奇怪，因为市政厅前的广场以及周围的街区，早已被士兵们重重包围，成为了整个城市守卫最为森严的区域——这里驻扎着“晓美焰警卫旗队”的士兵们。在进入大楼时，这支部队的指挥官——威廉·蒙克——以军礼迎接了她。\n\n“我的‘元首’…阁下，我认为城里的局势已经失控了，我们必须立即采取行动，”这位军官说道。\n\n“如果真有必要的话，你们可以为所欲为。只要别把自己的命搭进去就行。”这位魔法少女漫不经心地答道。\n\n蒙克点了点头，转身宣布将在城市中展开“治安行动”。晓美焰独自一人登上屋顶，那里曾是她俯瞰整座城市的最佳地点。然而，现在映入眼帘的，却是冒着滚滚浓烟的烟囱，以及横亘在街道上的路障。那些接到命令的士兵们开始在城市中四处奔走，对所有他们看不顺眼的人大开杀戒。可控的混乱确实有其可取之处，但有时候，也需要对其稍加约束。"
 GWF.12.a: "混乱交响曲中的残酷音符。"
 GWF.13.t: "绝望的呐喊"
 GWF.13.desc: "晓美焰站在市政厅的阳台上，手中紧紧地攥着那份她已经反复阅读了十遍的演讲稿。楼下，黑压压的人群如同无边无际的海洋，人们饥肠辘辘，怒火中烧，同时又充满了恐惧。“安全部队”的士兵们竭尽全力地维持着秩序，但却难以阻止人群的骚动。“我必须坚强，没错，必须坚强，就像以往那样。”她神经质地笑着，自言自语道。\n\n“公民们…”她的声音颤抖着。人群中，一个熟悉的身影一闪而过，但又与记忆中的有所不同——那是一个留着蓝色短发的少女。这绝不可能。她的思绪一片混乱，脑海中仿佛有一千只蜜蜂在嗡嗡作响，她的目光开始在手中的讲稿上漫无目的地游离。“斯图加特…这是你们的家园。我们必须…”“救救我…”对不起，我们…““请相信我…”\n\n全场一片寂静，下面的人群面面相觑，眼神中充满了困惑。有人发出了一声嗤笑，有人则朝着阳台的方向扔了一个腐烂的西红柿。人群中开始出现一阵骚动，人们的脸上写满了失望与愤怒。\n\n“我……”她感到一阵窒息，四肢也开始变得冰凉，她的嘴唇仿佛被冻僵了一般，再也无法发出任何声音。“我…不…”\n\n人群爆发出一阵震耳欲聋的喧嚣声，人们愤怒地咆哮着，虽然听不清他们在喊些什么，但“疯女人”、“这就是我们的统治者？”、“无耻！”之类的只言片语还是清晰可闻，这些话语如同锋利的刀刃般无情地刺痛着晓美焰的心。安全部队的士兵们开始驱散人群，但混乱早已笼罩了整个广场。晓美焰无力地退回到阴影之中，双手捂住耳朵，试图将那些刺耳的叫喊声隔绝在外。“这简直太可怕了，”她心想。羞耻感如同潮水般将她淹没，她恨不得立刻从这里消失，找一个无人的角落躲起来。\n\n第二天清晨，城市仿佛已经忘记了昨晚发生的一切。集市重新开张，孩子们在街头奔跑嬉戏，而那些向她递交报告的官员们，似乎也早已将昨晚的闹剧抛诸脑后，至少他们都装作若无其事的样子。晓美焰拿起一份崭新的报纸，关于昨晚那场“耻辱性演讲”的报道被挤在了头版最不起眼的角落里。她一把将报纸揉成一团，扔进了壁炉的火堆中。"
 GWF.13.a: "然而，遗忘并不能抹去内心的耻辱。"
 GWF.14.t: "环顾四周"
 GWF.14.desc: "晓美焰独自一人坐在斯图加特电视塔的塔顶上，这里可以将整座城市的夜景尽收眼底，也成为了这位黑发少女最喜欢流连的地方。但这一次，她并非独自一人，她的身旁还漂浮着一个令人厌恶的身影——丘比。它就像一只普通的家猫一般，在电视塔的金属支架上悠闲地踱步，似乎在等待着什么。\n\n“我让你去调查城市周边的情况，都弄清楚了吗？”晓美焰开口问道，她的声音被呼啸的风声所掩盖。\n\n“是的，根据我们的情报，在西北方向，有一个与你处境相似的‘异界来客’所组成的组织，他们的领导者是阿万音铃羽。我想，你们或许会有许多共同语言。在东边，与你相邻的是巴伐利亚基佬国，他们的统治者是一个由恩斯特·罗姆，一群健美运动员演员，以及一些娘娘腔的历史人物所组成的联盟…”\n\n“够了，我不想听这些废话，告诉我，有哪些势力可能会对我们构成威胁，又有哪些势力有可能成为我们的盟友。”晓美焰不耐烦地打断了对方的话。\n\n“好吧，如果你坚持要知道这些，那么目前来看，最大的威胁来自‘阿勒曼尼亚’，他们的统治者是阿尔伯特·施佩尔。他正在集结一支由周边势力组成的联军，准备向‘二次元’生物宣战。而你，还有阿万音的国家，以及其他任何他不喜欢的势力，都在他的‘讨伐’名单之中。”\n\n“也就是说，迟早会爆发一场战争？”\n\n“没错，我建议你尽快与其他可能成为盟友的国家建立联系。但最终的决定权掌握在你的手中，晓美焰。”\n\n“明白了…”晓美焰低声答道。\n\n晓美焰从电视塔上一跃而下，轻盈地落在了地面上。作为一名魔法少女，区区高空坠落自然无法对她造成任何伤害。迎面吹来的夜风拂过她的脸颊，让她混沌的思绪逐渐变得清晰起来，一个关于未来行动的计划也渐渐在她脑海中成型。“看样子，是时候去买一些地图了。”晓美焰自嘲地笑了笑。"
 GWF.14.a: "满目疮痍，除了废墟，还是废墟。"
 GWF.15.t: "维也纳之行"
 GWF.15.desc: "晓美焰缓步走在维也纳的街头，朝着霍夫堡皇宫的方向走去。在那里，她将与“基佬公社”的领导人们会面。她对这个词的含义一无所知，也不知道此行将会面临怎样的局面。但作为一名合格的外交官，她必须时刻做好应对各种突发情况的准备。即便对方是一些再怎么难以理喻之人，为了能够在这场未来的战争中争取更多的支持，她也必须竭尽所能。\n\n这座城市的景象有些出乎她的意料，倒不是因为这里的建筑风格，事实上，这里的建筑并无太多特别之处。真正让她感到惊讶的，是街道上那随处可见的旗帜、标语和海报。各种色彩混杂在一起，宛如一场疯狂的嘉年华。在快要抵达霍夫堡皇宫时，各种嘈杂的口号声和喧闹声也开始不绝于耳。这一切都让这位魔法少女感到紧张和烦躁。\n\n来到皇宫门前，她看到有三名警卫正在站岗，他们的制服可谓是五花八门，完全看不出是来自同一个国家的武装力量。在看到晓美焰后，他们立刻意识到这位正是他们所等候的贵宾，并为她打开了宫殿的大门。“欢迎！”第一个人说道。“革命万岁！”第二个人说道。“希特勒万岁！”第三个人喊道。这些“热情洋溢”的欢迎词让晓美焰意识到，接下来的会谈恐怕不会那么一帆风顺。\n\n终于，她来到了一个宽敞的大厅，根据指示牌的标注，这里应该是“谈判室”。晓美焰深吸一口气，强迫自己冷静下来，尽管第一印象已经让她对这里的一切都感到厌恶至极。但她依旧在心中反复思索着一个问题：究竟是何人，在掌控着这里的一切？怀揣着这样的疑问，她推开了会议室的大门。房间里有五个人，其中一人正悠闲地抽着烟斗，一人站在画架前挥毫泼墨，还有一人则干脆躺在椅子上呼呼大睡。\n\n“您好，我们恭候多时了，”留着小胡子的男子率先开口说道。\n\n“阿洛伊斯，虽然你的待客之道确实值得称赞，但还是让我们每个人都先自我介绍一下吧，”另一个抽着烟斗的男人说道。\n\n“约瑟夫，你tmd给我闭嘴，我是自由的画家施克尔格鲁勃，不是什么阿洛伊斯！”\n\n“你们两个都给我闭嘴，我们正在进行谈判，你们能不能严肃点？”留着大胡子的男人呵斥道。\n\n那位留着大胡子的男人目不转睛地盯着晓美焰，突然脱口而出：“此人有明显的同性恋倾向…”而另一位留着八字胡，身穿帝国制服的男子则小声对他说道：“西格蒙德，说话小心点。”\n\n“我来到此地，是为了讨论结盟的事宜，”晓美焰强压着怒火说道，她觉得自己就像是一只误入马戏团的小丑，“所以，请各位收起那些无聊的废话。”听到这番话，房间里顿时鸦雀无声，所有人都点了点头，然后围成了一个圈。在简短地交换了几句意见后，五个人异口同声地说道：“我们同意！”"
 GWF.15.a: "这…未免也太容易了吧？"
 GWF.16.t: "抵抗组织的来访"
 GWF.16.desc: "晓美焰独自一人站在市政厅空旷的房间里，这里的一切都被搬走了，只剩下一盏孤零零的吊灯，上面还亮着一盏灯泡。这样的“极简”布置，是为了与来自巴登抵抗组织的领导人会面所做的准备。对方拒绝了她的拜访请求，而是要求亲自前来会面。他们所提出的一系列条件，简直可以用“偏执狂”来形容。但晓美焰最终还是接受了所有的要求，因为“抵抗组织”是这一地区实力最强的几股势力之一。\n\n房间的门被猛地推开，三名身穿迷彩服的人走了进来。走在最前面的是一个身材高大的络腮胡男子，他小心翼翼地环顾四周，然后走了出去，开始和另外两人交谈起来。从只言片语中可以听出，此人的名字叫做“冈伦”。德国人站在门外，而另外两个人则并肩走进了房间。两人的身材都不算高大，第一个人是一名留着长发，扎着马尾辫的年轻女子，另一个人则也是一名…女子？她留着一头干练的黑色短发。\n\n“感谢您能前来赴约，我想，这对您来说一定不是一件轻松的事吧？”晓美焰率先开口说道。\n\n“没错，我们担心你们可能会被CERN的人盯上，所以我们决定亲自前来，”这位红褐色头发的女子回答道，“我叫阿万音铃羽，而站在我身边的，是漆原琉华，我的搭档。”\n\n“很高兴认识你们，我是晓美焰。老实说，我真的没想到会在这里见到，嗯，像你们这样的人。尤其是，居然还会有女性担任领导者。”\n\n房间里突然陷入了一片诡异的沉默，铃羽阿万音则微微挑了挑眉毛，似乎在等待着什么。\n\n“抱歉，但是，我是男的。”漆原琉华打破了沉默，轻声说道。\n\n几秒钟后，这位魔法少女才总算从震惊中回过神来。意识到自己犯下了多么严重的错误后，晓美焰立刻站起身，深深地鞠了一躬。“请原谅我的失礼，琉华先生。这真是一个不可饶恕的错误，”她涨红了脸，结结巴巴地说道，心中充满了羞愧。\n\n“没，没什么，这种情况已经不是第一次发生了，”琉华回答道。\n\n“晓美，每个人都会犯错，你不必为此如此自责，”铃羽阿万音笑着安慰着站在对面的少女。\n\n“是，是，抱歉。不过，我们到这里来可不是为了闲聊的，”晓美焰说道，强迫自己恢复了镇定。"
 GWF.16.a: "那么，现在让我们开始谈正事吧。"
 GWF.17.t: "充满疑虑的盟约"
 GWF.17.desc: "巴沙尔焦躁不安地坐在狭小的会议室里。最近一段时间，他一直心神不宁，短短几天之内就丢掉了自己的国家，然后在前往俄罗斯基地的途中又遭遇了叛军的伏击，最后更是稀里糊涂地成为了卢森堡的领导人。这一切究竟是怎么发生的，他到现在还是一头雾水。\n\n“真主保佑，你就不能别再抖腿了吗？”一个粗犷的阿拉伯语嗓音从墙边传来。\n\n“苏赫尔，你给我闭嘴！你根本就不该出现在这里！”巴沙尔呵斥道。\n\n“我们本来都不该出现在这里，但事已至此，多说无益。”将军叹了口气。\n\n“这都怪你！为什么你的‘老虎部队’没能守住阿勒颇、哈马和大马士革？！”\n\n“你这话说的可就有点过分了啊，当初是谁连维持部队运转的经费都拨不下来的？不过话说回来，要不是我，你现在早就被艾尔-雷尼那帮人吊死了。”\n\n“哦，真主啊！您究竟为什么要这样折磨我！据特工们传回来的消息，我们这次要谈判的对象…看上去像个女学生，这算哪门子待客之道？”\n\n“女学生也好，黄花闺女也罢，她现在可是控制着我们南部一大片土地呢。不管怎么说，我们现在是四面楚歌，任何形式的援助对我们来说都至关重要。”\n\n巴沙尔没有回答，他只是长叹一声，意识到此刻争论下去也毫无意义。谈判将在一个小时后开始，但他已经感觉自己快要崩溃了。无论如何，他都必须强迫自己保持镇定，绝不能再重蹈覆辙。时钟一分一秒地走着，距离谈判开始的时间越来越近。\n\n会议室的门突然打开，一位年轻的姑娘出现在了巴沙尔和苏海尔的面前，她穿着一身款式怪异的灰色套装。尽管她的个头不高，外表也毫不起眼，但她的眼神中却透露出一种令人不寒而栗的冷漠，瞬间充斥着整个房间。在这一刻，他们两人都意识到，现在绝不是开玩笑或掉以轻心的时候。\n\n“您好，晓美焰女士，我是巴沙尔·阿萨德——卢森堡共和国的总统。”巴沙尔从椅子上站起身，鞠了一躬。\n\n“晓美焰，斯图加特及其周边地区的…统治者。”这位年轻的姑娘用冰冷的声音答道，语气中带着一丝不易察觉的迟疑。"
 GWF.17.a: "两位先生，我有一个重要的提议。"
 GWF.18.t: "红色巴士"
 GWF.18.desc: "海因茨已经记不清这一切究竟是从何时开始的了。在第二次西俄战争结束后，元首阿尔伯特·施佩尔仍然牢牢地控制着法兰克福这座城市——他权力的核心所在。然而，有些事情变得不对劲了，他开始推行愈发严苛的法律：禁酒令，禁止出现人物形象的绘画和音乐，限制妇女的权利…直到有一天，施佩尔突然宣布自己成为了“阿勒曼尼亚”的“埃米尔”——“穆罕默德·艾尔-雷尼”，并宣布将全面推行伊斯兰教法。\n\n海因茨起初对此并不在意，他向来对政治漠不关心，也从未将这些变化当回事。然而，随着时间的推移，一切都变得越来越荒诞不经。终于有一天，他决定加入一个抵抗组织。但他生性温和，从未想过要拿起武器，仅仅满足于在城市中四处张贴传单，在墙壁上涂写标语。\n\n直到有一天，噩耗传来，彻底改变了他的人生轨迹。那天，他正在上班，突然得知自己的妹妹——艾米丽——被“道德警察”以“对执法人员不敬”的罪名杀害了。这个模糊不清的罪名背后，隐藏着的可能是任何事情。海因茨从未想过，这一切竟然会降临到自己身边。然而，悲剧还是发生了。\n\n从那以后，他毅然决然地走上了一条游击队员的道路。爆破、纵火、破坏、伏击——曾经陌生的词汇，如今却成为了他生活中的一部分。这条与暴政抗争的道路注定是坎坷不平的，其中既有令人振奋的成功，也有令人沮丧的挫折。\n\n突然有一天，消息传来，卢森堡与法兰克福方面达成了协议，同意将所有反对“艾尔-雷尼”政权的武装人员遣送至巴沙尔·阿萨德的控制区。没有过多的犹豫，海因茨所在的抵抗组织中，几乎所有的成员都同意了这一提议。\n\n“遣送”的日子终于到了，海因茨和他的同志们聚集在一座空旷的公共汽车站，周围除了几辆红色的巴士外，空无一人。半小时后，巴士缓缓驶来，停在了他们的面前，车门缓缓打开。人们开始依次登上巴士，在车厢中寻找自己的座位。当月台上空无一人时，司机带着一丝口音，用德语说道："
 GWF.18.a: "“车门即将关闭，下一站——卢森堡。”"
 GWF.19.t: "济济一堂"
 GWF.19.desc: "斯图加特市政厅内一片寂静，所有警卫人员都处于高度戒备状态，周围的街道也经过了仔细的搜查。今天下午，斯图加特同盟——一个在德国废墟上建立起来的军事联盟——的全体成员将齐聚于此，举行一场正式会议。为了确保万无一失，从早上起就设立了一系列路障，以防任何敌方特工或破坏分子渗透到会议中。\n\n临近中午，各方代表团开始陆续抵达，有的乘坐由普通汽车组成的车队，有的乘坐装甲运兵车，还有一些，出乎意料的是，竟然是步行前来。负责接待的仪仗队以最高规格欢迎了每一位来宾。这是符腾堡首次举办如此大规模的外交活动，因此绝不容许出现任何差错。必须确保每一位来宾的安全，确保他们都能乘兴而来，满意而归。\n\n像往常一样，晓美焰独自一人坐在自己的办公室里，静静地等待着所有代表团抵达的消息。而此时此刻，她正在反复阅读自己为欢迎各位来宾所准备的演讲稿。稿纸上布满了涂改和增补的痕迹，力求将任何可能的纰漏降到最低。“好吧，这里再删掉一句。”这位魔法少女自言自语着，又划掉了一个词语。\n\n“晓美大人，所有代表团均已到齐，请您移步。”一名警卫走进办公室，通报道。\n\n“好的，让大家在大厅集合，我随后就到。”晓美焰答道，合上了手中的讲稿。\n\n十分钟后，所有代表团成员以及晓美焰本人都已齐聚大厅。她走到代表团成员面前，开始发表欢迎致辞。尽管内心忐忑不安，甚至出现了几次结巴，但她最终还是顺利地完成了自己的演讲。随后，她引导着代表团成员前往会议室——更确切地说，那更像是一个军事指挥室。\n\n经过长时间的磋商，直到傍晚时分，与会各方才终于就即将到来的战争达成了一致意见。随后举行了一场简短而又隆重的晚宴，相比起会议期间的紧张气氛，晚宴上的氛围则轻松愉快了许多，无论是各方代表还是晓美焰本人，都感到了些许的放松。临近午夜，绝大多数的代表团都已离开了斯图加特，只有来自“反CERN抵抗组织”的代表团决定等到天亮再动身。无论如何，这场会议都称得上是一次圆满成功。"
 GWF.19.a: "重要的第一步。"
 GWF.20.t: "相识"
 GWF.20.desc: "在符腾堡的魔法少女军中，有一支神秘的“净化部队”，这些部队与其他部队相比显得与众不同。普通的士兵们对他们的任务一无所知。神秘与未知的光环吸引了无数年轻女孩的目光，然而却没有人能说清她们的具体职责。关于她们的种种传闻在军中不胫而走，真假难辨。但其中最为流行的说法是，她们负责反间谍工作，搜捕部队中的叛徒和间谍。\n\n军士艾格尼丝便是这些被“净化部队”的传奇故事深深吸引的年轻女孩之一。她成为魔法少女并加入军队才仅仅几个月的时间，但在这么短的时间内，她就展现出了惊人的天赋，并因此得到了迅速的晋升。各种关于那些无所畏惧的特工们不惜牺牲生命，在敌后搜寻敌人踪迹的传奇故事令她心驰神往。这便是身着黑色制服的魔法少女们的传奇。\n\n冈希尔德，这些“净化部队”的其中一员，喜欢在兵营附近的那片小树林里漫步。孤独与大自然总能让她感到心旷神怡。她闭上眼睛，脱下军靴，拎在手里，赤脚走在柔软的草地上。但她的独处并没有持续多久，她突然被什么东西绊倒，摔倒在地。一声轻呼响起。“抱歉！”一个声音从她的右侧传来。\n\n冈希尔德睁开眼睛，翻过身来，看到一个比她小几岁的女孩，正用颤抖的双手注视着她，仿佛下一秒就要哭出来似的。“没什么……是我自己不小心。”冈希尔德仍然躺在地上，轻声说道。“您——您是‘净化部队’的，而我，而我，”站在她面前的红褐色头发的女孩结结巴巴地说道。看着她，这位军官的脑海中突然闪过一个奇怪的念头，一丝淡淡的红晕也随之浮现在她的脸颊上。\n\n摇了摇头，将树叶和那些奇怪的想法一同甩掉后，这位身着黑色制服的魔法少女开始起身。另一位魔法少女立刻抓住她的手，帮她站了起来。“再次向您道歉，”她说，“我是艾格尼丝军士，隶属于第三营。”冈希尔德穿上靴子，点了点头，然后朝着树林的出口缓缓走去。这时，一个声音再次从她的身后传来：“请问，您叫什么名字？”“冈希尔德，”她轻声回答道。"
 GWF.20.a: "她听到对方的回答了吗？"
 GWF.21.t: "这甚至都算不上军队！"
 GWF.21.desc: "晓美焰在一群军官的簇拥下，在斯图加特郊外的一处小型军营中视察。军官们向她汇报着符腾堡武装部队的现状。然而，即便没有这些冗长的汇报，情况的糟糕程度也早已一目了然。\n\n他们口中的“师级部队驻地”充其量只能算是一个军迷爱好者的俱乐部。许多营房和仓库都空空如也，甚至遭到了洗劫。操场上杂草丛生，到处都是垃圾。那些仍然留在这里的士兵，一个个都无精打采，在营地里漫无目的地游荡，有些人甚至喝得酩酊大醉，还有更糟糕的。\n\n至于那些仍在仓库里封存着的为数不多的装备，简直就是一堆破铜烂铁，如果能从中找出几辆还能发动起来的“欧宝”卡车和至少一辆装甲运兵车，那都算是奇迹了。一切都显得如此的凄惨而又无助，仿佛只需要一千名训练有素、斗志昂扬的士兵就足以将这群乌合之众彻底消灭。\n\n“上校，您有什么建议吗？”晓美焰问那位佩戴着上校军衔的军官。\n\n“呃，您也亲眼看到了，长官，我们，可以说，根本就没有什么像样的军队，”他回答道。\n\n“也就是说，我们需要从零开始，对吧？”女孩问道。\n\n“恐怕是的。我已经尽力阻止情况继续恶化了，请原谅我的无能。”上校说着，将帽子摘下，紧紧地贴在胸前。\n\n晓美焰停下脚步，陷入了沉思，脑海中飞快地闪过各种关于军队建设的想法。一个大胆的想法突然击中了她——组建一支完全由魔法少女组成的军队，她们强健的体魄和特殊能力所带来的战斗力将远超数百名普通士兵。但另一方面，想要招募到哪怕仅仅一千名这样的士兵，也绝非易事。当然，我们也可以选择组建一支传统的军队，这样做无疑要简单得多，但如果想要在短期内形成战斗力，那么就不得不牺牲质量，以数量取胜。晓美焰叹了口气，继续在基地中视察。"
 GWF.21.a: "必须好好考虑一下。"
 GWF.22.t: "新型军队"
 GWF.22.desc: "晓美焰站在市政厅中央，静静地等待着首批魔法少女士兵的到来。她为此事已经与丘比进行过多次交涉，但组建这样一支军队的前景依然不甚明朗。如何将几十上百名拥有着各自不同愿望和目标的少女们团结成一个有机的整体呢？时间一分一秒地流逝，而她想要放弃这一切的念头也愈发强烈。\n\n终于，十几位与她年龄相仿的少女走进了大厅。看来，这就是首批新兵了。现在，真正的挑战才刚刚开始——如何着手打造一支军队。晓美焰叹了口气，开始向这些魔法少女们讲话。\n\n“欢迎各位，请做一下自我介绍吧，包括你们的名字，愿望以及来到这里的目的。”晓美焰说道。\n\n所有的魔法少女都依次做了自我介绍。她们的愿望各不相同，但出乎意料的是，她们的目标却与晓美焰所希望听到的不谋而合。各种版本的“为了守护我们的祖国”正是她所需要的答案。经过简短的筛选，15名候选人中最终有14人被录取。\n\n最终，在短短几周内，我们便成功招募到了数百名魔法少女。晓美焰本人对招募的速度之快也感到惊讶，要知道，起初她甚至认为自己的想法注定会以失败告终。当然，这其中还有许多悬而未决的问题。例如，如何继续招募新兵，以及如何应对那些在新兵中滋生的“绝望”情绪等等，但这些都是后话了。无论如何，符腾堡魔法部队的组建已经迈出了坚实的第一步。"
 GWF.22.a: "非常规军队为非常规国家而生。"
 GWF.23.t: "崭新的人生"
 GWF.23.desc: "艾玛从未对自己的生活有过任何抱怨。她出生在一个军官家庭，父亲是一名军官，母亲是一名教师。尽管她从未见过自己的母亲，因为母亲在生她的时候就不幸去世了，但她的家庭依然完整。她的父亲是一位胸襟宽广，充满爱心的人，总是竭尽所能地给予她温柔和关爱。和其他所有的军人一样，几年前，她的父亲应征入伍，参加了对俄战争，并最终牺牲在了战场上。就这样，艾玛被交给了她的祖父——一位早已退役的老兵——来抚养。\n\n祖父的性格与父亲截然相反，他脾气暴躁，性格乖戾。作为一个彻头彻尾的老派军人，他总是抓住一切机会对他人冷嘲热讽。祖父对艾玛无法成为一名合格的士兵而耿耿于怀，仅仅因为她生来就是一个女孩。事实上，艾玛对军事很感兴趣，但她的父亲却总是刻意回避这些话题，因为他本人并不希望女儿重蹈自己的覆辙。然而，她的祖父却总是会一边抱怨着，一边向她灌输着“女人当不了兵”之类的陈腐观念。\n\n这一天，艾玛出门采购日用品，一路上，她依然沉浸在成为一名军人的幻想之中。突然，她的目光被一张贴在商店门口的小海报所吸引。这是一张色彩鲜艳的海报，上面画着一位和她年龄相仿的少女，身着一身奇特的制服。“用你的愿望来换取守护祖国的机会”——海报上用醒目的大字写着这样一句标语。下面还写着市政厅的地址。“这或许就是我的机会。”一个念头闪过她的脑海。她决定暂时放弃购物的计划，径直前往海报上所写的那个地址。\n\n在那里，她遇到了一位自称晓美焰的女孩。她向艾玛详细解释了关于未来兵役的一切细节，包括许愿以及提供这些机会的“丘比”。最终，她穿上了一身魔法少女军装，回到了家中，并向祖父讲述了所发生的一切。祖父的脸上露出了难得一见的微笑，他只说了一句话："
 GWF.23.a: "“不要辱没了家族的传统。”"
 GWF.24.t: "决斗"
 GWF.24.desc: "在乌尔姆附近，有一座废弃的军用机场，按照晓美焰的命令，这里被改造成了魔法部队的基地。根据对魔法少女日常生活习惯的了解，再结合丘比提供的建议，基地的一切设施都经过了精心的设计，旨在将士兵们培养成训练有素、随时能够投入战斗的精锐之师。与此同时，为了在这些原本素不相识的少女们之间培养出集体荣誉感与良性竞争意识，基地还鼓励士兵之间进行各种形式的切磋。\n\n在其中一间营房的走廊上，两位少女不期而遇，随即重重地撞在了一起，跌倒在地。这究竟是巧合，还是有人蓄意为之？没人能说清。但可以肯定的是，她们之间早已结下了梁子，彼此都视对方为眼中钉，肉中刺，随便一点鸡毛蒜皮的小事都能成为点燃冲突的导火索。两人从地上爬起来后，一场激烈的唇枪舌战便立刻爆发了。\n\n“喂，玛尔塔，这地方足够宽敞，能容得下咱们两个人吧？”一位红发魔法少女厉声质问道。\n\n“啊？我没听清，是谁在我的耳边嗡嗡叫啊？”金发魔法少女一脸嘲讽地环顾四周，“哦，原来是我们的乌尔苏拉同志啊！”\n\n“闭嘴，信不信我现在就给你一拳！你还要惹我到什么时候？”\n\n“烦死了，我们一决胜负吧！”\n\n两位魔法少女来到了决斗场，这里是专门为这类比试而设置的。栅栏、人工废墟和路障——一切设施都旨在模拟真实的战场环境。她们互相握了握手，发誓将战斗到至死方休，以此来捍卫各自的荣誉，并彻底洗刷掉彼此施加在对方身上的耻辱。\n\n一位是使用弓箭的魔法少女，另一位则手持火绳枪，双方势均力敌，互不相让。震耳欲聋的枪声不绝于耳，子弹呼啸着穿透墙壁，留下一个个触目惊心的弹孔；箭矢则灵巧地绕过各种障碍物，精准地射向目标。战斗持续了将近一个小时，双方谁也不愿率先退让。但乌尔苏拉，那位使弓的红发少女，渐渐落入了下风。最后的几分钟成为了决定胜负的关键，这位红发魔法少女被击倒在地，浑身上下沾满了尘土与泥浆。\n\n“认输吗？”端着枪的射手俯身问道，“看样子你已经不行了。”\n\n“可恶，太丢人了，”乌尔苏拉艰难地喘息着，一把抓起了自己的灵魂宝石，“我绝不认…”\n\n“砰”的一声枪响打断了弓箭手的话语，子弹击中了她的手掌，彩色的宝石碎片四散飞溅。一位黑发少女从阴影中走出，她身着一件模仿旧普鲁士军服风格的束腰外套，头戴一顶贝雷帽，帽子上装饰着一枚蜥蜴形状的帽徽。她优雅地向着那位幸存的魔法少女鼓掌致意。\n\n“恭喜，你在战斗中展现出了惊人的耐力与力量。像你这样的战士，理应成为我们军队的中流砥柱。明天你将被晋升军衔。”来者说道，随后又如同出现时那般悄无声息地消失在了决斗场。"
 GWF.24.a: "等等，那不是我们的总司令吗？！"
 GWF.25.t: "菜鸟将军"
 GWF.25.desc: "晓美焰独自一人坐在一间位于市政厅内的小而昏暗的房间里。这房间的陈设极其简陋，只有一张桌子、一块小白板和两把分别摆放在桌子两侧的椅子。她究竟在这里做什么？乍一看，这个问题似乎难以回答，但答案却很简单——为了建立一支像样的军队，总得有一个指挥系统吧。\n\n为此，她命人向各地的军官们广发英雄帖，邀请他们加入到“符腾堡军队”的建设中来。这些军官们军衔各异，水平参差不齐，但都曾在这片土地上生活过。然而令她感到沮丧的是，响应这一号召的军官寥寥无几，满打满算也只有三位，不过，有总比没有强。今天，他们之中军衔最高的那位——前德意志国防军中校奥托·泰特斯洛斯塔姆将前来与她会面。\n\n房门被推开，一位身材瘦高、上了年纪的男子走了进来，他身着便装，但即便如此，仍然能够从他身上感受到一股军人的气息。紧随其后的是一位年轻一些的男子，他有着一头飘逸的白发。尽管事先并没有人提到过会有这么一位不速之客，但晓美焰也没有对此提出任何异议。\n\n“您好，我是奥托·泰特斯洛斯塔姆，请原谅我的冒昧，我带了我的副官，亚瑟·朱斯，一位军士长，一同前来。听说您正在组建一支军队？”\n\n“没错，而这支军队需要优秀的指挥官。泰特斯洛斯塔姆先生，您有什么功绩吗？”\n\n“我早有准备，”奥托咧嘴一笑，将一个厚厚的文件夹放在了桌上，“这里记录了我在担任指挥官期间所取得的一切成就与失败，还有一份是关于亚瑟的。”\n\n“很好，奥托先生，”晓美焰一边说着，一边飞快地翻阅着文件夹，“我确信，你们两位都将成为出色的指挥官。”\n\n晓美焰从桌后站起身，向坐在对面的两位军官伸出了手。两位军官也随即起身，与她一一握手。就这样，军队的首批指挥官终于到位了。"
 GWF.25.a: "没有指挥官的军队就如同一盘散沙。"
 GWF.26.t: "对新兵的演讲"
 GWF.26.desc: "今天，在市政厅前的广场上，数千人整齐地列队站立。乍一看，人们也许会以为这又是一场游行、集会或者抗议活动。但这些整齐划一、纪律严明的队列清楚地表明，他们绝非普通的平民百姓，而是一支刚刚加入到当地军队中的新兵部队。他们正在静静地等待着斯图加特的统治者前来检阅。\n\n不久，一位身材娇小的黑发少女登上了一座专门为此次讲话而搭建的高台。她清了清嗓子，开始了演讲：\n\n“亲爱的同志们，同胞们，符腾堡的公民们！感谢你们的耐心等待，感谢你们选择为祖国效力。能够站在这座讲台上，向你们——德意志勇敢的儿女们——致辞，我感到无比荣幸。你们之所以站在这里，不是因为任何形式的强迫与胁迫，而是响应了你们内心深处的召唤。\n\n无论你们的出身如何，无论你们的政治信仰如何，这些都不重要。鲍曼分子、施佩尔分子、共产主义者、民主主义者——现在，这些标签都已经失去了意义。你们首先是，而且永远都是——德意志人！这是值得你们每一个人骄傲的事情。尽管眼下德意志正面临着重重困难，但我坚信，我也知道，我们终将战胜一切，恢复历史的荣光！”\n\n“感谢各位的到来。德意志高于一切！”\n\n话音刚落，晓美焰缓缓地走下了讲台，而广场上的士兵们则爆发出了一阵欢呼声。“这可…真够呛人的。”她转过头，望向那群士兵，一边叹着气，一边低声说道。但在疲惫之余，她的心中也涌起了一股自豪之情——在如此之短的时间内取得这样的成就，这足以令她感到骄傲了。"
 GWF.26.a: "或许，这一切终将有所回报。"
 GWF.27.t: "军事演习"
 GWF.27.desc: "距离斯图加特几十公里外的一片广阔的旷野上，搭建起了一座座简易的营房，停放着各式各样的军事装备。这里正在进行一场大规模的军事演习，旨在尽可能地模拟真实的战场环境。今天，是这场演习的倒数第二天，同时也是最为关键的一天——与假想敌进行实兵对抗。演习的目标是尽可能快地占领这片旷野附近的一处高地。为了完成这一目标，指挥部调集了三个旅，总兵力达到了一万五千人。当然，参与此次演习的部队远不止这些，但现在，终于轮到最后几支部队登场了。\n\n附近一座小山丘上，临时搭建起了一座观察所。几位军官正围坐在桌旁，而在一个单独的隔间里，有两个人正注视着那些走出营房，集结待命的士兵们。其中一人全神贯注地盯着战场上的动向，并不时地在一个小笔记本上记录着什么，而另一人则更多地将目光投向了远处，欣赏着士兵们周围的景色。\n\n“在如此之短的时间内组建起一支军队，干得漂亮。”将军开口说道。\n\n“奥托，更应该受到褒奖的应该是您和总参谋部的各位，”少女回答道，轻轻地甩动着自己的秀发。\n\n“但无论如何，是您，晓美，发掘了我们这些优秀的将领。”奥托反驳道。\n\n“就让我们将这一切都归功于集体的智慧与努力吧，我可不想在这里争论究竟谁的功劳更大，因为真正的战斗马上就要开始了。”晓美焰说道。\n\n夜幕降临，关于战斗的详细报告陆续送到了指挥部。泰特斯洛斯塔姆将军对演习结果感到非常满意。而晓美焰对那些专业的军事术语则一窍不通，不过，既然演习的目标已经达成，那就说明一切进展顺利。"
 GWF.27.a: "军号在召唤我们！"
 GWF.28.t: "大胆的行动"
 GWF.28.desc: "晓美焰此刻正身处图林根，小心翼翼地穿梭于森林与村庄之间，一步步逼近她的目标。这里坐落着一个规模庞大的军事基地，里面有一个储藏着大量军用装备的巨型仓库。当然，作为北德地区一处至关重要的军事设施，这里的戒备自然也极其森严，负责巡逻的士兵至少有数百人之多。\n\n由于准备的时间十分有限，因此许多环节只能见机行事。随着她离基地的距离越来越近，那些建筑物的轮廓也逐渐变得清晰起来。晓美焰确信，这里储存的武器装备足以武装一支庞大的军队。\n\n时间静止了。趁此时机，少女来到了高高的铁丝网围墙前。她向后退了几步，然后纵身一跃，轻而易举地翻越了障碍，开始朝着那些巨大的仓库缓步走去。想要找到储存着所需物资的仓库绝非易事。事先搞到的基地地图与实际情况出入很大，因此早已变得毫无用处。她必须另寻他法，潜入仓库内部。\n\n从外表看，这些仓库就像是一个个巨大的铁皮桶，只有一个入口，而且还有士兵把守。晓美焰灵机一动，想到了一个声东击西的计划。带着这个计划，她向着兵营走去。在距离居住区十几米远的地方，这位魔法少女掏出了几枚迫击炮弹和十几枚烟雾弹，并将它们组装成了一个简易但却威力十足的炸弹。引爆炸弹后，少女立刻返回了仓库。\n\n时间开始流动。远处传来了一阵震耳欲聋的爆炸声，浓浓的黑烟冲天而起。原本守卫在仓库门口的士兵们立刻调转方向，朝着爆炸发生的地点蜂拥而去，将仓库完全暴露在了晓美焰的面前。在时间静止的状态下，晓美焰掏出霰弹枪，对着仓库大门上的锁扣就是一通猛射。幸运的是，附近所有仓库里存放的都是各种各样有用的装备，例如火炮、步枪和机枪。在将一个仓库中几乎所有的武器都装进了她的异次元空间后，这位魔法少女便大摇大摆地离开了基地。"
 GWF.28.a: "第二天早上，他们将会收到一份“惊喜”。"
 GWF.29.t: "军事演习"
 GWF.29.desc: "距离斯图加特几十公里外的一片开阔地上，一排排临时搭建的营房整齐地排列着。这里正在进行一场大规模的军事演习，模拟真实的战场环境。今天，是这场演习的倒数第二天，同时也是最为关键的一天——与假想敌进行实兵对抗。演习的目标是尽可能快地占领这片开阔地附近的一处高地。数千名士兵在黎明时分就已经集结完毕，按照预先制定的计划进入了阵地。倘若是一位缺乏经验的观察者，或许会将眼前的景象误认为是两三个旅的联合演习，然而实际上，这已经是符腾堡军队的全部家底了。\n\n事实上，这样一场演习是具有开创性意义的。这是世界上第一次对晓美焰一手组建的这支魔法部队进行实战检验。尽管参与演习的部队人数众多，但这支部队的组建过程却绝非易事。这些年轻的女孩们已经被编入了不同的团和营，做好了执行战斗任务的准备。她们全都变身成为了魔法少女的形态。\n\n前两个团的制服五花八门，颜色各异，只有手臂上的袖标和肩膀上的肩章才能表明她们的所属部队。而其他人的制服则几乎一模一样——这是晓美焰提出的“新型招募计划”的成果。与那些“五颜六色”的志愿兵不同，这些新兵入伍的“愿望”大多与“保卫祖国”有关。\n\n附近一座小山丘上，临时搭建起了一座观察所。对于其规模而言，这里显得有些空空荡荡，里面只有一个人。一位身着紫色制服的少女正心不在焉地望着窗外。再过15分钟，一切都将按照演习计划如期进行。时间一分一秒地流逝，终于，远处传来了隆隆的炮火声，有些部队在空中盘旋，有些部队则在地面上快速推进，他们用手中的武器对预先设置好的防御工事进行了猛烈的攻击。“这样一支‘大军’究竟能否战胜‘魔女之夜’呢？”晓美焰自嘲地笑了笑，自言自语道。\n\n傍晚时分，几位军官向她汇报了演习的情况，演习结果令人十分满意。最终，她下达了结束演习，部队返回营地的命令。"
 GWF.29.a: "崭新的军队，熟悉的战争。"
 GWF.30.t: "一场失败的冒险"
 GWF.30.desc: "晓美焰此刻正身处图林根，小心翼翼地穿梭于森林与村庄之间，一步步逼近她的目标。这里坐落着一个规模庞大的军事基地，里面有一个储藏着大量军用装备的巨型仓库。当然，作为北德地区一处至关重要的军事设施，这里的戒备自然也极其森严，负责巡逻的士兵至少有数百人之多。\n\n时间静止了。趁此时机，少女来到了高高的铁丝网围墙前。她向后退了几步，然后纵身一跃，轻而易举地翻越了障碍，开始朝着那些巨大的仓库缓步走去。想要找到储存着所需物资的仓库绝非易事。事先搞到的基地地图与实际情况出入很大，因此早已变得毫无用处。她必须另寻他法，潜入仓库内部。\n\n从外表看，这些仓库就像是一个个巨大的铁皮桶，只有一个入口，而且还有士兵把守。晓美焰低头看了看自己的灵魂宝石，上面已经开始出现黑色的斑点，她意识到自己已经无法维持“时间静止”状态太久了。“只能硬闯了。”她心想。她掏出手枪，朝着站在岗哨上的士兵头部就是一通扫射，然后又立刻举起霰弹枪，对准仓库大门上的锁扣扣动了扳机。\n\n时间开始流动。几乎在同一瞬间，士兵们应声倒地，仓库的大门也随之敞开。然而不幸的是，子弹击中金属所发出的巨大声响立刻引起了其他人的注意。刺耳的警报声响彻整个基地，远处也传来了士兵们杂乱的脚步声。还没等她来得及再次停止时间，她就感到有什么东西重重地压在了她的背上，将她死死地按在了地上。“抓到你了，入侵者！”一个声音从她的头顶传来。\n\n“这下可糟了，”晓美焰暗自叫苦。她努力地将一只手伸向自己的防护盾，并从中取出了一件东西——一枚闪光弹，她想都没想，直接将其举过头顶。身后传来了一声巨响，紧接着士兵便发出一阵痛苦的哀嚎。“你这个该死的婊子！”他大声咒骂着，双手捂住了自己的头。与此同时，晓美焰也趁机挣脱了他的束缚，朝着远离仓库的方向飞奔而去。\n\n那位暂时失明的士兵又试图去抓她，但他的手却在距离少女后背几厘米的地方落空了。当晓美焰逃出足够远的距离后，她便如同人间蒸发了一般，彻底消失在了茫茫夜色之中。"
 GWF.30.a: "彻头彻尾的失败！一败涂地！"
 GWF.31.t: "“红日”"
 GWF.31.desc: "晓美焰神情紧张地坐在自己的办公室里。窗户被沙袋封堵得严严实实，桌上摆放着各种各样的军事地图和报告。不久之后，联军将对施佩尔及其追随者的阵地发动先发制人的打击，而战争的序幕也将由一个特定的信号拉开。\n\n少女目不转睛地盯着最近才安装好的那部红色电话，这是盟军之间的紧急联络专线。而这场战争开始的信号，就将通过这部电话传达。随时都有可能响起那至关重要的铃声。终于，一阵刺耳的铃声打破了房间里的寂静，魔法少女猛地抓起听筒。\n\n“您好，今天朝霞满天，绚丽非凡，不是吗？”电话那头传来了一个女人的声音。\n\n“没错，真希望能够采撷十束‘彼岸花’，来好好装点这静谧的晨光。”晓美焰答道，很显然，双方正在用暗语进行交流。\n\n“我们这边准备了两束，从维也纳和卢森堡还会送来三束。”\n\n“那么，我们也准备两束吧。再会。”\n\n“再会。”\n\n短暂的通话结束了，对某些不明就里的人来说，这或许只是一段毫无意义的闲聊。但此刻，晓美焰已经拨通了通往参谋本部的电话。“全军进入最高战备状态，二十分钟后发动总攻！”——这是她对着听筒说出的唯一一句话。少女从椅子上站起身，缓步走出了房间。“决战的时刻，终于到来了。”她暗自思忖。"
 GWF.31.a: "鲜血将会再次染红这片土地！"
 GWF.32.t: "在前线"
 GWF.32.desc: "晓美焰此刻正身处一座边境碉堡之中，这是在战前修建的众多防御工事之一。钢筋混凝土浇筑的墙壁，特殊的通风系统，充足的补给和弹药储备——每一个防御工事都足以成为一座坚不可摧的堡垒。然而，即便身处如此坚固的防御工事之中，晓美焰也依然感到不安。远处传来的爆炸声和枪炮声不断地提醒着她，战争正在进行。这位魔法少女站在掩体最上层的射击孔旁，透过狭窄的缝隙，眺望着远处的战场。\n\n战壕纵横交错，炮弹坑星罗棋布，燃烧的坦克残骸以及遍地的尸体——这就是这场战争最真实的写照。晓美焰深深地叹了口气，默默地注视着眼前这残酷的景象。“终结战争的最后一战，”她喃喃自语道。\n\n“令人惊讶，随着毁灭性武器的不断发展，你们人类居然还没有灭绝。”一个声音从一旁传来。\n\n“‘孵化者’，闭嘴，我现在不想听你废话。”魔法少女厉声说道。\n\n“我只是想说，你们不应该诉诸如此极端的手段。如果能够速战速决，并尽可能地减少伤亡，岂不是更好？”\n\n“你还真是会操心能量的收集和避免宇宙热寂啊？给我滚开。”\n\n那只小兽如同出现时那般，突然消失了。而晓美焰则继续凝视着远方那充斥着血与火的战场。"
 GWF.32.a: "很快一切都将迎来终结。"
 GWF.33.t: "丑陋的真相"
 GWF.33.desc: "冈希尔德又一次在森林中漫步，曾经她沉醉于这种孤独的静谧，但最近，她总期盼着能在这里与另一个人相遇。对于她——一匹习惯了独来独往的孤狼——而言，这是一种极其陌生的感觉。这究竟是什么？难道，这就是…爱？但怎么可能呢，她们都是女孩啊！理智告诉她，这是“错误”的，但心中的情感却如潮水般无法抑制。\n\n对于艾格尼丝——那个此刻正坐在她们第一次相遇的地方的少女——来说，这也是一种前所未有的体验。起初，冈希尔德在她眼中是一个沉默寡言，甚至有些令人生畏的人，她曾一度担心自己会因为那次笨拙的邂逅而惹上麻烦。但随着时间的推移，她发现自己的第一印象大错特错了。那位军官其实是一个极度害羞和谦逊的人，在经过一段时间的接触后，艾格尼丝逐渐找到了与她沟通的方式。此刻，她又来到了这里，她们将会再次畅谈到夜幕降临，话题也早已包罗万象。\n\n一名士兵的日常生活周而复始，起床，集合，晨检。对艾格尼丝而言，这一切都已习以为常。然而，她开始感到身体出现了一些异样，各种复杂的情绪、思绪，乃至绝望，正逐渐侵蚀着她的灵魂。在晨检时，负责检查灵魂宝石的军官发现了艾格尼丝的宝石呈现出一种极度浑浊的暗色。她皱了皱眉，但最终什么也没说，继续检查下一位士兵去了。\n\n几小时后，冈希尔德来到了艾格尼丝的营房，她的脸色苍白得吓人。她迈着僵硬的步伐，径直走到艾格尼丝面前，用微微颤抖的声音说道：“军士，请跟我来。”艾格尼丝点了点头，跟在了她的身后。“发生了什么事？为什么是我？”各种各样的念头在她脑海中闪过。突然，冈希尔德带着她走向了那片森林——那片她们相遇的森林。又一次来到了那熟悉的地方，深吸一口气后，身着黑色制服的魔法少女开口说道：\n\n“你难道不清楚我们的真正使命吗？”\n\n“不，你指的是什么？”\n\n冈希尔德咬紧嘴唇，开始向她讲述一切：关于魔女和灵魂宝石的真相，关于“净化部队”的真正任务，以及接下来将会发生的一切。艾格尼丝刚想问这究竟是不是一个玩笑，但冈希尔德那无比严肃的表情让她把话又咽了回去。突然，冈希尔德紧紧地抱住了她。“我…我本应该早点告诉你的。”这位军官啜泣着说道。“嘿，我也有同感，我一直担心你会拒绝我。”艾格尼丝回答道。“我爱…你，”两人异口同声地说道。就在这一瞬间，两人的灵魂宝石都变得漆黑一片，紧接着，它们同时碎裂，将整片森林变成了一个魔女的结界。"
 GWF.33.a: "破碎的命运"
 GWF.34.t: "来自天穹的抗议"
 GWF.34.desc: "法兰克福又迎来了新的一天。“枯燥、乏味，却又如此习以为常”——理查德，这座城市的典型居民，走在故乡的街道上，心不在焉地想着自己的事。\n\n四周尽是行色匆匆的人们，急切地想要逃离此地，只因南德意志爆发的战火早已在民众间引发了持续的动荡。这让许多人忧心忡忡，但理查德不在此列。他时常问自己：“政治和这些冲突，与我何干？”然后耸耸肩，回归到这艰难时世里，他那沉闷而辛苦的生活中去。\n\n命运似乎并未为他准备任何有趣的东西，除了为了生存而进行的显而易见的挣扎。然而，命运另有安排。远处传来沉闷的爆炸声，成群的市民从惊愕的理查德身边奔逃而过，他还未完全明白周遭发生了什么。\n\n从头顶传来的轰鸣撕裂了天空。飞机从云层后探出身影，为了执行它们血腥的目标而降低高度。当理查德开始逃离这已蔓延至他身后的战争恐怖时，一张惊恐的扭曲面容浮现在他脸上。\n\n成百上千的炮弹开始倾泻在法兰克福的街道上，摧毁着城市，杀戮着所有不幸暴露在炮火下的人。其中一枚炮弹就在理查德身边爆炸。然而，年轻人并未迎来惯常的死亡，反而感受到了远比死亡更可怕的折磨。爆炸的冲击波没有杀死他，却炸断了他的右臂，将他抛出数米之外。痛苦的尖叫加入了这片恐怖的嘈杂交响，不自觉地在四周扩散开来，仿佛压过了一些爆炸的声浪。此时此刻，一切终于变得清晰：无论人们是否关心政治与灾难，每个人都有可能深受其害。理查德闭上了眼睛，不知道自己是否还能活下来…"
 GWF.34.a: "战争从未改变，改变的只是它带来的恐惧。"
 GWF.35.t: "工作的权利"
 GWF.35.desc: "斯图加特的工厂永不停歇地运转着，又开始了新一轮的轮班。一些工人有气无力地脱下制服，终于能去享受片刻的休息；而另一些同样疲惫不堪的工人，则换上工装，准备迎接又一个令人精疲力竭的工作日。\n\n乌尔里希·费尔德，工厂工人中的一员，开始了手头的工作，心中泛起一丝淡淡的忧伤，思索着这段时间以来一切都变成了什么样子。乌尔里希第一次踏入这座建筑的门槛，还是在遥远的1950年代，那时的生活似乎充满希望，也更为平静……而现在，一切都变得如此不堪。\n\n工作时长被延长到了难以忍受的地步，生产计划的指标庞大到足以让工业最发达的国家都为之震惊，这沉重的负担压垮了所有不幸与这份工作绑在一起的人…尽管如此，现在又有谁的日子好过呢？\n\n匆匆回顾了自己的人生轨迹，乌尔里希站到了机床前，开始履行他的职责。他终究需要生活下去。但一种沉重的感觉压在他的心头。即便是在不久前的第二次西俄战争期间，考虑到所有情况，生活也要容易得多。这一点毋庸置疑。\n\n一个突如其来的念头闯入乌尔里希的脑海。他意识到，这样的生活方式已经损害了他的健康。他感觉自己虚弱了许多，身体不停地恳求着休息。然而，费尔德本人，尽管明白自己的问题，却并未停止挥汗如雨地劳作。在为生存进行的最关键的斗争时刻，祖国要求她的公民忠诚不渝、全力以赴。乌尔里希绝不会后退一步，哪怕这会要了他的命。\n\n尽管疑虑仍在悄悄爬上这位工人的心头…他为何要这样做？如果这一切结束之后，像他这样的人的功绩被轻易遗忘，那又如何？他工作的目的又是什么？为了工作而工作，然后继续工作、工作下去。但最终的目标又在何方？"
 GWF.35.a: "为了赢得生存的权利，以及死亡的权利。"
 GWF.36.t: "棘手的局面"
 GWF.36.desc: "桌子上，又堆满了前线送来的最新报告。然而，这些报告的内容却让人高兴不起来。“伤亡：惨重”、“我军被迫从XXXX阵地撤退”、“敌人发动了出其不意的突袭”——这些千篇一律的说辞背后，掩盖的是战争局势正日益恶化的残酷现实。远处传来了沉闷的爆炸声，又有敌人的炮弹落在了城郊。\n\n晓美焰双手抱在胸前，在房间里来回踱步，试图寻找解决当前困境的对策。她注意到挂在墙上的时钟指针一动不动。“坏了，”她低声说道，就在这时，一个念头突然闪过她的脑海。她拥有静止时间的能力，诚然，想要仅仅依靠这一能力就赢得战争，无疑是痴人说梦，但这至少能够为她争取到更多的时间。\n\n又一阵爆炸声响起，这一次距离市政厅更近了，天花板上的灰尘都被震落下来。不能再犹豫下去了。她深吸一口气，下定决心，命令部队先将她送往军火库，然后直奔前线战况最为吃紧的地区。"
 GWF.36.a: "将一切都掌握在自己手中。"
 GWF.37.t: "以强制自愿的方式"
 GWF.37.desc: "克劳斯漫步在小镇夜晚的道路上，他的目的地是一个最简单不过的地方——商店。又到了为下周采购食品的时候，这样他就能继续维持自己那无忧无虑的生活，不去想起周遭那些悲惨的事情，比如这场战争。\n\n当他的一些同伴成群结队地志愿奔赴前线，另一些人则响应征召而去时，克劳斯早已明确了自己的想法：他丝毫没有兴趣去理会那些他从未有过瓜葛、也绝不打算扯上关系的麻烦。\n\n克劳斯哼着一支简单的曲子，沿着人行道前行，直到一辆外观可疑的小货车突然从拐角处驶出。起初，克劳斯并未留意这辆车，继续朝商店走去。但小货车追上了年轻人，随后干脆停了下来，挡住了这位茫然失措的年轻人的去路。\n\n车门猛地打开，一个身着军装的陌生人走了出来。他扫视着克劳斯脸上紧张的神情，开口说道：\n\n“证件，麻烦出示一下。”陌生人的声音坚硬而冰冷，不容置辩。\n\n“什么…什么证件…？”克劳斯怯生生地问道，出于对自身安全的担忧，向后退了几步。\n\n“别装傻了。证明你身份的证件。快点！”军人厉声喝道，毫不掩饰他的轻蔑与愤怒。\n\n克劳斯则没有回答。他明白，现在他的生活很可能会发生翻天覆地的变化。他猛地转身，拔腿就跑，试图逃离。然而，从货车里冲出几名士兵，毫不迟疑地追向克劳斯，很快就抓住了他。他们给了他几下拳脚，然后将克劳斯拖拽着塞进了货车里，就这样带走了又一个被送往前线的人。每一个士兵都弥足珍贵，对他们来说，损失年轻的兵源是毫无意义的。克劳斯一直逃避的东西，最终还是以最粗暴的方式追上了他。"
 GWF.37.a: "他同意服役。他只是还不知道这一点。"
 GWF.38.t: "毁灭性的奇迹"
 GWF.38.desc: "在掩体间穿梭，又一队士兵从阵地上溃退，任由敌人继续推进，蚕食新的土地。在被迫逃亡的人群中，混杂着齐格弗里德的身影，一个早已对这个世界失去希望的人。他已不在乎周遭的境况，只渴望逃离，躲藏起来，直到一切平息。四周散落着同伴的尸体、假想敌人的尸体，以及无辜者的尸体。这可怖的景象让士兵失去了平衡，一次次跌倒在泥泞中，又一次次挣扎着爬起，继续他艰难的逃亡之路。\n\n齐格弗里德时常想：人们怎能如此自相残杀？仅仅几年前，统一的民族还曾骄傲地展望未来，互相扶持……而如今，每个人都为了某些莫名其妙的理想，随时准备将刀刺向自己最亲近之人的后背。德意志民族究竟怎么了？他们变得残酷无情……他们侍奉着那些来路不明的统治者，而那些统治者除了自己，对旁人漠不关心。这简直是一场真切的噩梦。\n\n终于，他抵达了一个相对平静的地方。齐格弗里德喘息未定，直到一幅景象在他面前展开，令他恐惧到了灵魂深处。\n\n一枚圆形的石头猛然坠落在他面前，其来历绝非任何凡人所能知晓。石头的上下两端各有一根尖刺，石头就这样刺入了地面。眨眼之间，它释放出黑色的烟雾，迅速弥漫了周遭的环境，并且仿佛扭曲了空间本身的结构。\n\n齐格弗里德见状，陷入了极度的震惊，双眼因眼前发生的一切而瞠大。他想要站起来，想要逃跑，或者相反，想要探究这未知的现象…但就在这时，一根异常巨大的花刺猛地刺穿了他的心脏，几乎瞬间夺走了齐格弗里德的生命，没有给他留下任何机会，也没有给他任何答案。"
 GWF.38.a: "在这诡异的时代，突如其来的死亡。"
 GWF.39.t: "些许核冬天之尘"
 GWF.39.desc: "又一队士兵丢盔弃甲，从阵地上溃退，任由敌人继续推进、蚕食新的土地，只为寻找掩护。在这群被迫逃亡的人中，混杂着齐格弗里德的身影——一个早已对这个世界失去希望的人。他已不在乎周遭的局势，只渴望逃离，躲藏起来，直到一切平息。四周散落着同伴、假想敌，以及无辜者的尸体。这恐怖的景象让士兵头晕目眩，一次次跌倒在泥泞中，又挣扎着爬起，继续他艰难的逃亡之路。\n\n有时齐格弗里德会想：我们怎能自相残杀？就在几年前，统一的民族还曾骄傲地展望未来，彼此扶持…而今天，为了某些难以理解的理想，每个人都准备将刀子捅向自己最亲近的人的后背。德意志民族究竟怎么了？它变得如此残忍…它屈从于那些只顾自己、对他人生死漠不关心的莫名统治者。这简直是一场真切的噩梦。终于，他抵达了一个相对平静的地方。\n\n齐格弗里德喘息未定，眼前便出现了一幅让他灵魂深处都为之战栗的景象。\n\n远方的某处，传来一声惊天动地的巨响，宣告了真正末日的开端。一枚威力足以令所有人胆寒的原子弹在空中炸裂，毁灭着周遭的一切，焚烧、摧毁着爆炸冲击波前的一切事物，只留下弥漫的辐射云。\n\n看到那缓缓升腾的蘑菇云，齐格弗里德几乎立刻接受了自己的命运，静候着那该死的终结。仅仅几秒钟后，核爆的冲击波便抵达了这位年轻人身边，带给他短暂却又极致痛苦的折磨。他的身体被撕裂，随即在难以想象的能量下燃烧殆尽。齐格弗里德甚至来不及发出一声惊叫，但那痛苦对他而言却是前所未有的剧烈…最终，死亡降临得如此迅速，尽管过程极其惨烈。"
 GWF.39.a: "我欲将世界付之一炬。"
 GWF.40.t: "庆功晚宴！"
 GWF.40.desc: "各盟国的代表团开始陆续抵达斯图加特，这座饱受战火蹂躏的城市。残垣断壁、路障和腐烂的尸体——这就是符腾堡首都如今的景象。身着灰色制服的士兵护送着车队。像往常一样，他们的神情比夜色还要阴沉。巴沙尔坐在第二辆车里，焦躁不安地瞥了一眼苏海尔。“这一切总让我感到有些不安。”他对苏赫尔说道，但后者似乎并没有把他的话听进去。\n\n车队最终抵达了市政厅——一座雄伟的哥特式建筑，士兵们打开车门，将车上的贵宾们缓缓地引导到入口处。一位身着军装，头戴贝雷帽的黑发少女正在入口大厅等候。她的肩膀上佩戴着一个紫色的臂章，上面绣着一只黑色的火蜥蜴。“但愿‘莱茵标准团’的士兵们没有给各位添麻烦吧？”她面带虚假的微笑说道，一边伸出手招呼着各国元首，“请跟我来，我们到客厅去！”\n\n跟随着这位魔法少女，他们走进了一个摆满了餐桌的宽敞大厅，餐桌上摆满了各种珍馐美味。当然，这算不上什么饕餮盛宴，但在眼下这种局势中，能拿出这么多像样的食物，已经令人倍感惊讶了。“请原谅我们这里的简陋，毕竟很多地方还在修复之中。”晓美焰微微鞠躬，说道。盟国代表们按照指定的座位入座，准备用餐。\n\n对于许多在场的人来说，那些异国情调的水果、精致的鱼片，以及窖藏已久的陈年佳酿——这一切都让这场晚宴成为了他们自穿越到这个世界以来所享用过的最为丰盛的一餐。突然，一位名叫威廉·蒙克的军官——晓美焰的贴身保镖——走到她身边，在她耳边低语了几句，这位魔法少女的脸上顿时露出了一丝不满的神色。但对于各国代表们而言，这一切都无足轻重，就如同巴登代表团的缺席一样，并未引起他们的注意。\n\n“各位，在开始享用甜点之前，我想要发表一个简短的讲话。”一边说着，晓美焰一边端起酒杯，“这场胜利来之不易，我很高兴南德意志地区现在已经团结一心。然而，只有将所有的障碍彻底扫除，无论这些障碍是来自内部，还是来自外部，我们才能真正迎来属于我们的光荣时刻。”站在一旁的黑衣士兵们突然关上了大门，而那些方才还在把酒言欢的代表们则感到了一丝不祥的预兆。"
 GWF.40.a: "但一切都太迟了。"
 GWF.41.t: "胜利会议"
 GWF.41.desc: "今天，斯图加特将举行一场由同盟各成员国参加的会议，以总结战争的经验教训，并规划下一步的行动。盟国的代表团正陆续抵达这座饱经战火洗礼的城市。残破的建筑、路障和成堆的脚手架——这就是符腾堡首都如今的景象。代表团的车辆小心翼翼地绕过那些散落在路面上的碎砖块、玻璃碴和扭曲的钢筋。\n\n车队最终抵达了市政厅——这座被脚手架所包围的哥特式建筑。警卫们小心翼翼地打开车门，将贵宾们缓缓地引领到入口处。在大厅里，一位身着平日里那身标志性的白色连衣裙的黑发少女正在等待着他们。“欢迎各位的到来，我们有许多重要的议题需要讨论。”晓美焰带着一丝诡异的微笑说道，并招呼着客人们前往会议室。\n\n所有人都在各自的位置上落座，各个国家的代表们互相窃窃私语，猜测着即将到来的讨论将会带来怎样的结果。不难想象，决定这场刚刚结束的战争后所建立的脆弱联盟的未来，是这次会议的核心议题。每个参与者对未来的发展都有着不同的愿景。而外交官们来到这里的目的，正是为了确保胜利的果实不会在一夜之间化为泡影，避免让来之不易的和平演变为另一场战争。\n\n在长达一个小时的时间里，盟国之间爆发了激烈的争论，却始终无法达成任何共识。突然，一位军官走到晓美焰身边，向她汇报了一些事情。这位魔法少女的脸上随即露出了一丝得意的笑容。与此同时，一直坐在长桌“尽头”的她突然站起身，猛地拍了一下桌子。她期待已久的计划终于要付诸实施了。\n\n“先生们，女士们，我有一个提议。你们所有人都将继续保留对各自领土的控制权，但是，你们必须承认我们对你们的宗主地位。”少女用充满威胁的语气说道。\n\n这番狂妄的言论立刻激起了代表们的强烈不满，大厅的每一个角落都充斥着愤怒的声音。但紧接着，士兵们便举起手中的步枪，将枪口对准了那些手无寸铁的外交官。\n\n“反抗是徒劳的，符腾堡的军队已经占领了南德意志地区所有重要的战略要地，顷刻之间我们就能瘫痪你们的国家机器。没有了你们这些领导人，你们的国家将沦为我们的囊中之物。”\n\n被这突如其来的变故和这胆大包天的计划惊得目瞪口呆的各国领导人们都陷入了沉默。紧接着，一些代表团开始陆续同意了这一提议，并最终形成了全体一致通过的局面。在得到了自己想要的结果后，晓美焰若无其事地笑了笑，说道：“现在，让我们开始享用晚餐吧！”"
 GWF.41.a: "幸好一切都兵不血刃地结束了。"
 GWF.42.t: ""
 GWF.42.desc: ""
 GWF.42.a: ""
 GWF.43.t: "蝇虫扑灭"
 GWF.43.desc: "并非所有人都甘心接受战争的胜负结局。那些曾被称为对手的人，如今不过是昔日自我的残影。然而，理念——无论胜败——只要仍有笃信者，便往往能长久存续。\n\n旧派系的失败者们，如今只能在阴影中卑躬屈膝，躲避着统治他们的新政权的憎恨目光。他们时常自问：究竟是怎么走到这一步的？为何他们那更显正确、且拥有忠实追随者的理念，竟无法在这场残酷的斗争中捍卫自身？这是个没有明确答案的问题……但这并不意味着谁会就此束手就擒。\n\n重新集结起来，那些曾效忠于覆灭派系的反对力量，开始尝试对新的“当权者”展开颠覆活动。\n\n又一个动荡的夜晚，如同约定俗成般，形形色色、背景各异的人们接踵而至。他们被同一个目标凝聚：继续他们未竟的事业。在一间狭小的公寓里，昏暗的灯光下，聚集起来的人们开始密谋未来的图谋。\n\n命运惯常的轨迹被一声巨响骤然打断，轰鸣声在房间里激起尖锐的回响，令所有密会者悚然警惕。眨眼之间，一群手持各式武器的不速之客出现在他们面前。不等任何人有机会开口，这些不速之客便朝着那些胆敢反抗政权的人们，倾泻下密集的弹雨。\n\n目标只有一个：清除敌人。而这一次，目标再次成功达成。尸骸堆积如山，散落在目所能及的各个角落。现在，是时候清扫现场，将所有胆敢反抗之人彻底遗忘。"
 GWF.43.a: "一击毙命，干净利落"
 GWF.44.t: "中断的电波"
 GWF.44.desc: ": 英国情报部门的特工们，在曾经的德国边境附近设立了监听哨。他们仔细捕捉着以太中传来的任何细微声响。自该单位成立以来，只要能从溃败德国的残余中截获新的情报，他们一天的工作便算圆满成功。\n\n但今天，发生了一些无法解释且令人不安的事情。一名工作人员唤来他的上级，语气焦灼地报告了一个消息。\n\n“报告…总之…我们截获的所有无线电波，突然都中断了。是彻彻底底地中断了。”\n\n“你说‘中断了’是什么意思？”指挥官怒声问道，声音里却透着迷茫。“这不可能！给我…”——他从下属手中夺过设备，亲自开始监听每一个活跃的频率。\n\n片刻之后，这位老练特工的表情开始变化：从愤怒到惊愕，再到日益增长的不安。他设想过各种情况，唯独没料到会是这样——所有被监视区域都寂静无声，而德国南部地区，更是仿佛从未有过任何无线电活动一般。\n\n最终，指挥官摘下耳机，陷入了对所发生之事的沉思…这怎么可能？他沉重地叹了口气，下达了指令：\n\n“保持警惕…目前采取任何行动都将极其冒险…”"
 GWF.44.a: "寂静。绝对的寂静。"
 GWF.45.t: "退伍军人"
 GWF.45.desc: "“劳动使人自由”——奥托·拜斯海姆对这句话再熟悉不过了。然而，过去几年他一直处于失业状态，眼睁睁地看着德国陷入混乱。他再次拿起施密特-鲁滕贝格写给他的信，扫了一眼信中的内容，又一次开始考虑是否要接受那份开一家属于自己的商店的提议。说实话，这个前景看上去并不怎么乐观。\n\n他打开窗户，眺望着晨曦中的慕尼黑。在街道上，公务员、工人与黑帮混杂在一起，行色匆匆地奔波于汽车之间，头顶上是肮脏的褐色天空。他甚至对一群人形大小的绿色乌龟视而不见，反倒是将更多的注意力放在了一位正朝着他家走来的年轻邮递员身上。他本不指望能收到那些商业伙伴的来信，但在内心深处，他仍然渴望能够收到来自家人的只言片语。\n\n令他惊讶的是，他收到了一封盖着奇怪邮戳的信件，这是斯图加特“政府”最近才开始使用的。信中是一份看似天真，但却颇具说服力的请求，希望他能够为这个新政权的军官们提供咨询服务，并且还暗示他有可能重新入伍。拜斯海姆的眼中闪过了一丝希望的泪光。"
 GWF.45.a: "经验是不朽的。"
 GWF.46.t: "宣布选举"
 GWF.46.desc: "斯图加特市政厅内爆发了激烈的争吵。各路政客齐聚一堂，讨论着解决日益加剧的混乱局势的未来前景。文件与辱骂的言辞在整个大厅里横飞，波及每一个不幸挡路的人。\n\n“我告诉你们，我们必须宣布军事管制，巩固权力！”一位政客说道，轻蔑地指着他的一个对手。\n\n“这是何等的野蛮行径？你难道不明白我们正处在何种崩溃的边缘吗？我们绝不会实行什么军事管制！”第二位政客反驳道，嘲笑着前者试图加强权力的论调。\n\n展开的辩论演变成了一场真正的角力。每个人都固守着自己解决问题的观点。在这个本应勠力同心的艰难时刻，那些本该合作的人却互相嘶吼着、挥舞着拳头。\n\n最终，一声异常响亮的拍桌声伴随着一声“安静！”响起，让那些刚才还在争吵、甚至已经脱离政治议题的人暂时安静了下来。这是主席到了，他要宣布一项决定。\n\n“在你们这儿挥霍预算的时候，准备和举行选举的法令已经签署了。一切都已审议并批准。”当所有人都平静下来后，主席终于开口说道。\n\n所有在座的人都与自己最亲近的同僚交换了眼神，随后大厅里爆发出热烈的掌声。“当然了，我们怎么就没早想到呢”、“这当然是好主意”、“赶快举行选举吧”——诸如此类的话语在会场内响起，所有人都终于达成了某种程度的共识。"
 GWF.46.a: "友善、积极、微笑，毕竟我们是民主政体。"
 GWF.47.t: "拦截流失的大脑"
 GWF.47.desc: "穿行于偏僻的房屋之间，这些房屋在近期的战火中已成断壁残垣，一位核物理学家躲藏在废墟之中。他渴望逃离那个政权代表的追踪，在他曾效忠的政权垮台后，他便落入了新政权的阴影之下。\n\n走进一栋坍塌的建筑，科学家本想松一口气。他背靠着冰冷的墙壁滑坐下来，感到在无数个不眠之夜的持续奔逃后，疲惫开始侵袭他的身体。\n\n他闭上眼睛，正想入睡，然而枪托猛地砸在他的头上，打断了他的念头。他失去意识，重重地摔在石地上。不知过了多久，他醒来时发现自己身处一辆行驶的汽车里，双眼被蒙住，双手被反绑…\n\n引擎的轰鸣和持续的颠簸清楚地表明了他所处的环境。科学家试图活动一下，却发现自己动弹不得。接着，他听到旁边传来某人傲慢的笑声和话语：“哟，科学家醒了。我还以为我那一击把他送上西天了呢。”随后，整个车厢爆发出讥讽的哄笑。幸运的是，他们很快抵达了目的地。行动人员粗暴地将他推下车，押着他走进了一栋不知名的建筑内部。\n\n不知身在何处地走着，科学家完全失去了时间概念。他这样被押了多久？不清楚…最终，他被按坐在一张冰冷的椅子上，蒙眼的布条被取下，让他得以打量四周。几乎立刻，他从周围的环境判断出自己身处一个监狱式的研究所。一位负责人出现在他面前，宣布他现在必须参与研究与开发工作，直到他的命运另有安排。"
 GWF.47.a: "与其教导学者，不如强迫他为你效劳。"
 GWF.48.t: "死亡与疯狂的华尔兹"
 GWF.48.desc: "慕尼黑那座富丽堂皇的宴会厅，已经许久没有见到过如此奢华的装饰了。自从斗争年代以来，这里就再也没有举办过任何大规模的活动，平日里只会被用来进行一些简短的仪式。然而，在晓美焰的亲自指示下，宴会厅在最短的时间内焕然一新。如今，这里的奢华程度甚至超越了柏林的人民大厅。明亮的灯光、富丽堂皇的桌椅、悬挂着的带有火蜥蜴图案的旗帜，一切都显得完美无瑕。一场庆祝战争结束的盛大宴会即将在这里举行，斯图加特政府的重要官员和军官们都将齐聚一堂。\n\n一整天的时间里，各种各样的人物陆续来到这里，每个人都扮演着各自不同的角色。当然，一切并非一帆风顺。一些宾客对邀请他们时所表现出的那种近乎强迫的态度感到不安，而大量安全部队士兵的出现也加剧了这种不安的氛围。但这些疑虑很快就被组织者们用此次活动的重要性以及战争的阴霾尚未彻底消散之类的说辞打消了。傍晚时分，所有应邀的宾客都已到齐。他们被引导到宴会厅中，而安全部队士兵们紧张的神情，也营造出了一种令人不安的紧张气氛。\n\n“晚上好，各位，我很高兴你们都能够应邀前来参加这场对国家和我们所有人都至关重要的活动。我们一同走过了一段漫长而又血腥的旅程。现在，请所有人起立，你们将听到新的国歌。”登上舞台的少女开始了她的演讲，说完，她闭上双眼，举起了手中的酒杯。\n\n舞台上方的扬声器中，传出了许多在场之人都十分熟悉的旋律——“霍斯特·威塞尔之歌”。然而……这首歌曲似乎有些不对劲。那些扭曲、诡异的音调令在场的人群中出现了一阵骚动。突然，晓美焰猛地将之前举起的那只手向下一挥，将手中的酒杯摔得粉碎，安全部队的士兵们同时举起手中的突击步枪，朝着人群疯狂扫射，一时间，惨叫声和血肉横飞的声音响彻整个大厅。那位黑发魔法少女只是静静地站在舞台上，冷眼旁观着自己一手缔造的一切，在短短几秒钟内土崩瓦解。精心策划的演出在导演本人的手中走向了失控的终结。\n\n几分钟后，密集的枪声终于停了下来，只剩下了零星的补枪声，那是士兵们在处决那些幸存者。一位安全部队的高级军官从幕后走到晓美焰身边。\n\n“我们已经按照您的指示完成了任务，接下来该怎么办？”这位高大的男子问道。\n\n“干得不错，现在，处理掉这些尸体吧，连同整栋建筑一起。”晓美焰说着，从舞台上一跃而下。穿过遍地的血泊，她走出了这栋建筑。"
 GWF.48.a: "终结总会到来。"
 GWF.49.t: "通往常态的道路"
 GWF.49.desc: "慕尼黑那座富丽堂皇的宴会厅，已经许久没有见到过如此奢华的装饰了。自从斗争年代以来，这里就再也没有举办过任何大规模的活动，平日里只会被用来进行一些简短的仪式。然而，在晓美焰的亲自指示下，宴会厅在最短的时间内焕然一新。如今，这里的奢华程度甚至超越了柏林的人民大厅。明亮的灯光、富丽堂皇的桌椅、悬挂着的带有火蜥蜴图案的旗帜，一切都显得完美无瑕。一场庆祝战争结束的盛大宴会即将在这里举行，斯图加特政府的重要官员和军官们都将齐聚一堂。\n\n一整天的时间里，各种各样的人物陆续来到这里，他们每一个人都在这片德意志的废墟上建立新国家的过程中发挥了重要作用。整个建筑中的气氛都显得欢快而轻松，即便是那些安全部队的士兵，脸上也少了平日里那副阴沉的表情。傍晚时分，所有应邀的宾客都已到齐。他们被引领到宴会厅中，并被要求在各自的座位上就坐。人群渐渐安静下来，等待着他们的领导人发表讲话。\n\n“晚上好，感谢各位的到来。我们共同经历了这段漫长而又艰辛的旅程，克服了难以想象的挑战。老实说，我不想用冗长的演讲来浪费大家的时间，因此我将直奔主题。我正式宣布，我们的国家将进行重组。由于我们已经控制了大德意志帝国的大部分领土，因此，我们是这片土地上唯一有资格继承德意志千年历史的合法政权。现在，让我们尽情享受这欢庆的时刻吧，为了我们共同取得的胜利，干杯！”登上舞台的少女举起手中的酒杯，发表了讲话。\n\n坐在椅子上的人群立刻起身，热烈地鼓掌。嘈杂的掌声迅速汇聚成一片，化作雷鸣般的欢呼与喝彩。随后，符腾堡的总督汉斯·菲尔宾格走上舞台，晓美焰将主持后续庆祝活动的任务交给了他，并由他来宣布更多的细节。\n\n望着那些欢欣鼓舞的官员和军官们，晓美焰开始走下舞台，将手中的酒杯放在了桌上。"
 GWF.49.a: "表演仍在继续。"
 GWF.50.t: "驱逐鼠辈"
 GWF.50.desc: "晓美焰栖身于斯图加特电视塔奇迹般幸存的尖顶之上。当然，眼前的景色已不复往昔那般迷人，城市的许多区域都遭到了破坏。远处，废墟的余烬仍在幽幽地冒着烟；一些地方，缓慢的重建工作正在进行；而在另一些角落，匪徒与警察之间的枪战时有发生。然而，魔法少女来到这里并非为了欣赏夜色下的城市，她需要丘比现身。她的手枪早已准备就绪。\n\n“晓美焰，你找我？”那外星生物再次凭空出现。\n\n“是的，我有几个极为重要的问题。你会回答的，对吧？”焰面无表情地回应。\n\n“当然，只要我知道答案，我就会回答。”一个声音响起，丘比一如既往，甚至没有张开嘴巴。\n\n“很好。你们孵化者是如何避开人类的视线，只出现在魔法少女面前的？”\n\n“我们曾拥有一种技术，可以调整自身的脑电波频率，与我们需要的特定人群同步。”\n\n“‘曾拥有’？”焰的眉毛挑了一下。“详细说说。另外一个问题，全德意志，乃至全世界，你们有多少？”\n\n“几年前我们丢失了那项技术，现在我们只能在有限的时间内扭曲光线。按你们的说法——就是隐形。”它像猫一样原地打着转回答道，“德国境外的孵化者数量未知，我们与它们没有联系。在德国境内，我们大约有一万五千个。”\n\n听到这一切信息，焰的脸上掠过一丝狞笑。就在同一瞬间，其中一只丘比的身体便被子弹打得千疮百孔。几天后，全德意志境内都出现了士兵小队的身影，他们四处搜寻着那些背上带有圆环的白色小兽。它们如今对每个人都可见，只是藏匿了起来。对焰而言，这简直是难以置信的奇迹——原来那些可憎的外星人，也并非无懈可击。"
 GWF.50.a: "让它们消失吧。"
 GWF.51.t: ""
 GWF.51.desc: ""
 GWF.51.a: ""
 GWF.52.t: "禁区的另一侧"
 GWF.52.desc: "汽车已经行驶了数小时，渐渐接近那被称为“法兰西-勃艮第边境”的地带。当车队驶过那些破败不堪的道路、布满地雷的原野以及化为废墟的城镇与村庄时，地平线上逐渐出现了一个边境哨所的轮廓。它看上去并不像一个普通的边境检查站，而更像是一个军事观察哨。关于这辆试图穿越“禁区”边界的汽车的消息早已提前送达，因此那些早已得到通知的士兵并没有开火。\n\n“长官，我们即将到达法国边境，您确定要这么做吗？”坐在副驾驶位置上的军官问道。\n\n“是的，我认为这会对我的目标有所帮助。”晓美焰回答道。\n\n“还有十分钟我们就会穿越边境，请所有人按照越境流程的指示行动。”司机说道。\n\n抵达边境后，军官下车向士兵出示了各种各样的文件，以证明他们的通行资格。仔细核对了所有文件的内容后，士兵敬了一个军礼，并下令升起路障。就像科幻电影中的场景一样，坚固的铁门缓缓开启，两侧的红色信号灯不断闪烁。军官回到了车上，车队随即驶入了法国境内。\n\n一直坐在后座上的晓美焰突然感到一阵异样的虚弱。“不…为什么？”她心想，一边伸手捂住了自己那滚烫的额头。她的眼皮开始不听使唤地打架，尽管她拼命地想要保持清醒，但仅仅过了十分钟，这位魔法少女就彻底失去了意识。\n\n当晓美焰再次睁开双眼时，她发现自己正身处那间熟悉的市政厅办公室里，周围站着几位军官和一位身穿白大褂的医生。当她理所当然地问起究竟发生了什么事时，他们告诉她，由于她在越过边境后就一直昏迷不醒，因此不得不紧急取消这次行程。甚至一度有人担心她已经丧命，因为在长达数天的时间里，她对外界的任何刺激都毫无反应。在听完了他们的讲述后，少女命令所有人离开，让她一个人静一静。"
 GWF.52.a: "这究竟是怎么回事？"
 GWF.53.t: "绝望的追寻"
 GWF.53.desc: "整个德意志都已匍匐在她的脚下，但一切又有什么意义？奉晓美焰之命，安全部队的特工们正在四处搜寻着一个人的下落——一位与她年龄相仿，有着一头粉红色秀发的少女。为了不错过任何蛛丝马迹，他们甚至得到了关于目标人物的详细外貌特征和行为习惯的描述。他们必须找到鹿目圆，不惜一切代价。\n\n晓美焰的办公桌上堆满了特工们送来的各种报告和观察记录，但却没有一份能够带来任何实质性的进展。搜寻范围从米兰一直延伸到维尔纽斯，但所有的努力都化作了徒劳。所有的线索要么毫无价值，要么干脆就是有人蓄意捏造的。没有一位特工能够帮助她哪怕稍稍接近自己的目标。\n\n当然，晓美焰也曾亲自前往某些特工们提供的地点进行调查，但每一次都无功而返，所有的信息要么是特工们的误判，要么就是她自己的理解出现了偏差。甚至还有几个投机取巧的特工，为了邀功请赏，竟然试图将一个毫不相干的普通人指认为鹿目圆。而等待着这些胆敢如此厚颜无耻地欺骗她，如此肆无忌惮地亵渎“圆”之存在的家伙的，只有无尽的折磨。\n\n一位安全部队的高级军官走进了办公室，他被允许亲自向晓美焰汇报工作。\n\n“长官，关于在萨克森-安哈尔特地区和考纳斯地区的搜寻结果，目前仍然没有任何进展。”这位军官汇报道。\n\n“京特，你可不是那种只会混饭吃的废物。告诉我，有没有哪怕一丁点儿有价值的线索？”少女质问道。\n\n“很抱歉，长官，但想要在这种地方找到一个特定的人，简直就如同大海捞针。我们甚至都无法确定她是否真的存在，又是否还活着！”这位军官争辩道。\n\n“闭嘴！我不需要你来质疑我的命令，我只需要结果！”晓美焰冲着军官厉声呵斥道，“滚出去！”\n\n“遵命，长官。”京特说着，缓缓地退出了房间。\n\n当房门被轻轻关上后，晓美焰重新坐回到了自己的椅子上。尽管她对下属们下达的命令斩钉截铁，不容置疑，但在她的内心深处，一种与日俱增的焦虑感正在不断滋生，吞噬着她的理智，而这种焦虑感只会引向一个唯一的结论。"
 GWF.53.a: "这一切难道都毫无意义？"
 GWF.54.t: "赌局"
 GWF.54.desc: "晓美焰又一次独自一人坐在这间尘土飞扬、阴暗潮湿的办公室里。命运似乎跟她开了个天大的玩笑，让她将这处破败不堪的地方称之为自己的“办公场所”。自从战争结束以来，市政厅的建筑就一直无人问津，战争留下的痕迹也依然触目惊心。破碎的窗户被草草地钉上了几块胶合板，墙壁上布满了弹孔，破败的家具，以及弥漫在空气中的死亡气息。尽管如此，现在这里却比战火纷飞时更让晓美焰感到熟悉和亲切。\n\n桌子上空无一物，没有任何文件、钢笔或其他办公用品。唯一留在桌下的抽屉里的，只有一把左轮手枪和一盒尚未开封的子弹。晓美焰打开抽屉，取出了那把手枪——一把苏制“纳甘”左轮手枪，握把上刻着的五角星图案昭示着它曾经的归属。她上膛了一颗子弹，随后便开始漫不经心地转动着手中的手枪，细细地端详起来。\n\n在完成了这毫无意义的赏玩后，晓美焰将枪口对准了自己的太阳穴，扣动了扳机。“咔哒”一声，空枪。“咔哒”，仍然是空枪。“咔哒”，伴随着一声震耳欲聋的枪响，子弹从“纳甘”左轮手枪的枪膛中呼啸而出，击穿了魔法少女的头颅。殷红的鲜血顺着她的额头和脸颊缓缓流淌下来，浸透了她的头发和衣物。晓美焰的身体无力地倚靠在椅背上，剧烈地喘息着。而那看似致命的枪伤，却以肉眼可见的速度逐渐愈合。\n\n“三次空枪，还算走运。”少女自言自语道。她其实并不清楚自己为何要一次又一次地玩这种“俄罗斯轮盘赌”的游戏。毕竟，对于一位魔法少女而言，任何形式的物理伤害都毫无意义，她所做的这一切只不过是在白白浪费用于修复身体的魔力。那么，这种自残行为究竟意义何在呢？晓美焰将其视作一种惩罚，一种对至今仍然未能找到“她”——鹿目圆——的自己的惩罚。\n\n无论她付出了多少努力，无论她做了多少尝试，最终都毫无意义。她究竟是为了什么，才一路走到今天？她究竟又为了什么，才让自己背负上如此沉重的血债、汗水与泪水？晓美焰叹了口气，用衣袖擦去了残留在脸上的血迹，从椅子上站起身，走向房门。"
 GWF.54.a: "该出去透透气了。"
 GWF.55.t: "不期而遇"
 GWF.55.desc: "晓美焰…什么也没有做。她只是在斯图加特的夜色笼罩下的街道上漫无目的地游荡，对周围正在进行的重建工程以及那些残垣断壁视而不见。微风吹拂，卷起地上的灰尘和垃圾，拍打在她的脸上。她要去哪里？为了什么？又有什么意义？所有这些问题都毫无意义。实际上，她周围的一切似乎都失去了意义。如果最终的目标遥不可及，那么之前所做的一切又有什么价值呢？\n\n各种各样的思绪充斥着晓美焰的脑海。或许，这一切都是对她试图破坏既定世界秩序的惩罚？或许，这里就是所谓的炼狱？一年多的时间过去了，她仍然没有找到关于圆的哪怕一丁点儿线索。丘比曾信誓旦旦地告诉她，圆一定就在这个世界上的某个角落，但这难道不是那只“孵化者”又一次精心编织的谎言吗？每迈出一步，她都感到愈发艰难。她所做的一切都是正确的吗？或者，她本可以通过其他方式取得更好的结果？\n\n晓美焰突然停下了脚步，她这才意识到自己已经被人跟踪了。究竟跟了她多久？这难道是一个陷阱？有人要对她下手吗？少女伸手去拿藏在防护盾里的手枪，但最终，她还是放下了手臂。即便真的是一场有预谋的袭击，那又如何呢？或许她本不该负隅顽抗。这位魔法少女转过身，朝着空无一人的街道大声喊道：“出来吧！”\n\n尘土飞扬，一位红褐色头发的少女出现在了她面前。她看上去比晓美焰年长几岁，也比她高出一个头。一身如同古代盔甲般奇特的装束，清楚地表明了她魔法少女的身份。她的一只手中握着一杆长枪，另一只手则拎着一个装满了文件的厚重文件夹。\n\n“你是谁？”晓美焰率先开口问道。\n“打扰了，我是玛丽亚·罗曼诺娃，很显然，我也是一名魔法少女，”女孩答道，“据我所知，你现在是这片土地的统治者？”\n“晓美焰，没错，但这又有什么意义呢？如果你甚至不能保…”她突然停了下来，没有说出那个名字。\n“你指的是鹿目圆，对吧？过去几年，我一直在搜集关于魔法少女以及发生在这个世界上的种种怪异现象的情报。”\n晓美焰的瞳孔骤然放大，她猛地冲上前，一把抓住玛丽亚的衣领，“你知道些什么？快告诉我！”这位黑发魔法少女用颤抖的声音质问道。\n“冷静，所有的信息都在这个文件夹里，但我需要你付出一些代价。我愿意帮助你，所以，至少你能先放开我吗？”另一位魔法少女用平静的语气说道。\n“抱歉，我有些失态了。你想说什么？”晓美焰松开了玛丽亚，向后退了一步，一边整理着自己的头发，一边问道。\n“我们换个地方谈吧。”玛丽亚笑着答道。"
 GWF.55.a: "隧道尽头的光明？"
 GWF.56.t: "计划，计划，还是计划"
 GWF.56.desc: "两人穿梭在狭窄潮湿的街巷间。走在前面的是一位高挑的金发少女，手中紧握着她的金色长矛。焰紧随其后，一只手按在自己的盾牌上。不信任感依旧萦绕在她心头，让她随时准备着，即便无法迎战，至少也能脱身。跟在这位身着古典铠甲的魔法少女身后，偏执的情绪让焰无法平静。行走了近二十分钟后，玛利亚在一扇招牌已严重磨损的门前停下。“好了，到了。”少女说着，推开了门。焰沉默着跟了进去。\n\n两位魔法少女进入的地方谈不上奢华，但也不像是什么秘密据点。其内部装潢更像是一个酒吧，或者一家朴素的咖啡馆。玛利亚走到吧台后站着的高个子德国男人面前说：“弗兰茨，请普通顾客离开。”伴随着“抱歉，本店打烊了”的声音，客人们抱怨着起身离开，大厅很快空无一人。\n\n“随便坐，这里安全。”玛利亚回到焰身边，对她说道。\n\n“好。那么你知道些什么？关于小圆的。”黑发魔法少女依旧保持着警惕，走到一张随意的沙发旁坐下。\n\n“等等，我们按顺序来。事情没你想的那么简单。”另一位魔法少女将一个文件夹放在桌上，回答道。\n\n焰轻轻咂了下嘴，决定保持沉默，让玛利亚把需要说明的事情讲完。玛利亚则开始逐一阐明这个宇宙所发生的一切细节。随着一份份文件的揭示，焰脑中的拼图渐渐清晰起来。一切开始变得，即便只是些微，也更加明朗。然而，“小圆怎么样了？”这个问题始终悬而未决。就在她想开口询问的瞬间，玛利亚仿佛预先知道她的问题般说道：“‘被捕获之神’计划，也就是鹿目圆。”\n\n讲完了所有重要文件的内容后，玛利亚站起身，向焰伸出了手。\n\n“我们必须终结所有的异常现象，而你，终将救出小圆。”玛利亚说道。\n\n“嗯，当然。”焰回答着，握住了伸来的手。"
 GWF.56.a: "就此了结吧。"
 GWF.57.t: "不期而遇"
 GWF.57.desc: "晓美焰…什么也没有做。她只是在斯图加特的夜色笼罩下的街道上漫无目的地游荡，对周围正在进行的重建工程以及那些残垣断壁视而不见。微风吹拂，卷起地上的灰尘和垃圾，拍打在她的脸上。她要去哪里？为了什么？又有什么意义？所有这些问题都毫无意义。实际上，她周围的一切似乎都失去了意义。如果最终的目标遥不可及，那么之前所做的一切又有什么价值呢？\n\n各种各样的思绪充斥着晓美焰的脑海。或许，这一切都是对她试图破坏既定世界秩序的惩罚？或许，这里就是所谓的炼狱？一年多的时间过去了，她仍然没有找到关于圆的哪怕一丁点儿线索。丘比曾信誓旦旦地告诉她，圆一定就在这个世界上的某个角落，但这难道不是那只“孵化者”又一次精心编织的谎言吗？每迈出一步，她都感到愈发艰难。她所做的一切都是正确的吗？或者，她本可以通过其他方式取得更好的结果？\n\n晓美焰突然停下了脚步，她这才意识到自己已经被人跟踪了。究竟跟了她多久？这难道是一个陷阱？有人要对她下手吗？少女伸手去拿藏在防护盾里的手枪，一把“瓦尔特”P38手枪——它已经成为了晓美焰最为忠实的伙伴——被紧紧地握在手中，保险也被打开。她猛地转过身，将枪口对准了身后那空无一物的街道。“出来吧！”这位魔法少女大声喊道，朝着虚空中扣动了扳机。\n\n尘土飞扬，一位红褐色头发的少女出现在了她面前。她看上去比晓美焰年长几岁，也比她高出一个头。一身如同古代盔甲般奇特的装束，清楚地表明了她魔法少女的身份。她的一只手中握着一杆长枪，另一只手则拎着一个装满了文件的厚重文件夹。\n\n“玛丽亚·罗曼诺娃，魔法少女，”这位不速之客开门见山地说道，“据我所知，你现在是这片土地的统治者？”\n“很高兴认识你，但你究竟有什么目的？”晓美焰答道，无视了对方的问题。\n“没什么特别的，只是想帮你一个小忙。尽管你做了不少坏事。”玛丽亚脱口而出。\n“你到底在胡说些什么，我只在乎一件事…”她突然停了下来，没有说出那个名字。\n“鹿目圆，对吧？我一直在搜集关于发生在世界上的种种怪异现象的情报，而这其中就有许多关于她的有用信息。”说着，这位红发魔法少女将手中的文件夹丢到了晓美焰脚边的泥泞之中，“希望我们以后再也不要见面了。”\n“等等！”晓美焰大声喊道，朝着那位身着古老盔甲，正在逐渐消失的轮廓连开数枪。她深吸一口气，小心翼翼地捡起了地上的文件夹，掸去了上面的泥土。在扉页上，用铅笔写着几个字——“关于世界的崩塌”。"
 GWF.57.a: "命运的馈赠？"
 GWF.58.t: "计划，计划，还是计划"
 GWF.58.desc: "焰不想回到市政厅，所有与那个地方相关的联想，早已只剩下负面的色彩。但实际上，那里是她的办公室，是她下达命令、沉浸思绪的地方。走进大楼，脚下灰泥的碎裂声和地板的吱呀声是陪伴焰的唯一声响。上楼进入办公室后，她锁上门，并用一个大柜子抵住。微弱的灯光、散落在地板上的纸张、被木板钉死的窗户——这就是这间屋子当下的模样。\n\n走到桌前，将上面的东西一股脑扫开，魔法少女放下文件夹，在旁边的椅子上坐下。“关于宇宙的崩坏，是吗。”她看着封面，低声呢喃。捆绑文件夹的丝带瞬间被扯断，露出了里面厚厚一沓纸张、文件、报告和日记。看起来，就算花上几天时间也未必能读完。焰开始研究这些文件，从最上面的一页按顺序读起。\n\n一页接着一页，一张接着一张，焰开始意识到，这便是她个人的圣杯，里面几乎解释了每一处细枝末节。收集材料的细致程度令魔法少女震惊。她曾不敢相信这会是真的，但这却是现实。一些文件让她不寒而栗——几乎一直以来，她都受到世界主要大国特务机构的监视。然而，到目前为止，还没有任何关于小圆的消息…\n\n时间接近午夜，已经读完了大半文件，绝望再次开始侵袭焰，因为对她个人而言，里面没有任何有用的信息。放弃阅读的念头开始滋生，但魔法少女努力抗拒着它们。就在这时…下一页纸上闪过一个标题：“关于祖先遗产学会在博恩霍尔姆岛的项目”。其中一个项目就是“被捕获之神”…描述极其简略，但对焰来说，一切已然明了。现在，她开始在余下的文件中搜寻所有提及该项目的地方。\n\n到了清晨，整个文件夹已被读完。所有与博恩霍尔姆及其周边区域相关的异常现象，都拼接成了一幅完整的图景。小圆，她就在那里。这一点确凿无疑。她的最后一战，终于要开始了。"
 GWF.58.a: "“博恩霍尔姆，是吗。”"
 GWF.59.t: "终末的开端"
 GWF.59.desc: "晓美焰此刻身处汉堡附近的一个小型军用机场。她围着一架老旧的容克活塞式运输机踱步。她将乘坐这架飞机，飞往她最终的目的地——博恩霍尔姆岛。几名工程师正在检查运输机的引擎和螺旋桨叶片，确保飞机完全处于良好状态。一位身着飞行员制服、年岁不小的男人走近在跑道上踱步的少女。\n\n“胜利万岁，晓美女士！我已准备好将您送往您指定的任何地方。”飞行员举起右臂敬礼道。\n“我想，我自己能行。”焰礼貌地回绝了，她并非直接懂得如何驾驶飞机，但借助魔法——完全可行。\n“请不要低估我，当年戈林元帅本人都曾与我握手！能够执行这项任务是我至高无上的职责！”他捶着自己的胸口宣称。\n“嗯，好吧。你明白这次任务可能致命吗？”魔法少女回答道。“准备起飞。”\n\n情报部门的报告指出，博恩霍尔姆上空存在某种魔法屏障，能完全瘫痪其周围二十公里半径内的一切技术设备。零星的消息提到了粉色的球形力场和奇怪的箭矢。焰并不完全相信这些报告的内容，但在内心深处，一种感觉在温暖地燃烧——小圆就在附近，这一次她绝对走在正确的道路上。\n\n一小时后，飞机已然升空。透过舷窗，可以看到一望无际的波罗的海。机舱内除了焰空无一人。她沉默地坐着，凝视着窗外的景色。距离博恩霍尔姆还有大约四十分钟的航程。过了一段时间，窗外的景象骤变，乌云笼罩了四周的一切。飞机开始剧烈且不受控制地颠簸。魔法少女紧紧抓住机身的部件，走到驾驶舱。\n\n“该死！飞机失控了，操纵杆根本不听使唤！”老飞行员对着无线电的嘶嘶声徒劳地喊叫着。“Mayday, Mayday！”\n“飞行员，发生什么了？”走进来的焰打断了他。\n“这不应该发生，雷暴锋面不可能在一分钟内形成！地面上那是什么光？天啊！”飞行员一边继续拉扯着各种操纵杆，一边回答道。\n“试着尽可能地爬升，接下来我自己来！”少女喊道。\n\n飞行员没有任何异议，猛地将操纵杆向后拉。飞机骤然开始爬升高度。一感觉到自己能成功抵达岛屿的高度，焰便走向机舱门。用尽全力打开舱门，将降落伞背在身后，焰跃出飞机，迎向她的宿命。"
 GWF.59.a: "我来了。"
 GWF.60.t: "单兵空降"
 GWF.60.desc: "猛烈的狂风抽打在焰的脸上。从飞机上坠落的过程仿佛持续了永恒，每一秒过去，地面似乎并未变得清晰多少。在岛屿上空几百米的高度，魔法少女冻结了时间，并展开了降落伞。直到此刻，透过漆黑的云层，她才看到悬停在空中的箭矢——倘若她迟疑哪怕一秒，这些箭矢就会在空中将她射成筛子。小心翼翼地操纵着方向，焰终于感觉到了脚下的土地。时间恢复流动。那些射向天空的箭矢继续着它们的轨迹。\n\n魔法少女发现自己身处岛上某个布满岩石的海滩。爬上唯一的高地——一棵树，她开始观察四周。展现在眼前的景象……极其反常。废弃的村庄和小镇，形状不规则的小湖泊，某座宅邸的残片，像是被刀精确地切割开来。但在最中心，是一些外观毫不起眼的建筑。看起来，那不过是当地驻军废弃的基地。然而，即便相隔十公里，焰也能感受到从那里散发出的庞大能量。\n\n几乎是下意识地，双脚自行将魔法少女引向了那个方向。穿过泥泞和茂密的森林，傍晚时分，她抵达了那座基地。天空变得异常清澈，仿佛在迎接它的访客。走在略微被杂草覆盖的柏油路上，焰注意到一个可以称之为地下设施入口的地方。同样，它看起来极其普通，但她不知为何就是找到了这个正确的入口。\n\n推开沉重的钢铁舱门，少女沿着光线昏暗的楼梯向下走去。继续下行，狭窄的台阶变成了宽敞的地下研究中心。白色的灯光，大量老旧的真空管计算机，写满各种计算公式的板子。但这里显然有些东西格格不入——一段墙壁和一扇门，仿佛来自古老的宅邸，被随意地“嵌入”了大厅的尽头。“希望这就是我要找的地方。”焰低语道。握紧手枪，她朝那扇门走去。门后是一个某种茶室，窗外是浩瀚无垠的宇宙星空。"
 GWF.60.a: "这究竟是？"
 GWF.61.t: "最后的…一战？"
 GWF.61.desc: "这间房间依旧令晓美焰感到难以置信，她的内心告诉自己：这绝不可能是真实的，完全不该存在。可它偏偏如此真实，如同亲身步入的现实。这究竟是哪里？是通往异界的传送门？是新的异常点？还是那终极的答案，贯通一切疑问的真相？正当魔法少女陷入沉思之际，一抹高挑的身影悄然在桌前显现，如凭空诞生。她身着优雅的粉色和服，头顶则漂浮着一个银白色的金属半弧。\n\n“欢迎你，晓美同学。”陌生女子率先开口，语气中竟带着几分由衷的赞许。“我可以向你道喜了。”\n“你是谁？圆在哪里？”晓美焰紧盯她，语气冷冽，“回答我！”\n“哎呀，真没礼貌呢。不过她就在这间房的后面。”\n女子依旧温和笑着，轻声说道：“在那之前，何不先来一杯茶，再配几块松软可口的法式小面包呢？”\n她顿了顿，又轻轻鞠了一躬道：“我名为费萨琳·奥古斯塔·奥萝拉，初次见面，请多指教。”\n“对不起，我现在没时间喝茶。”焰十分干脆地回绝道，语气中满是焦急和警惕，“与其说这些，不如先回答我的问题。”\n“哈哈，好吧。”费萨琳轻笑一声，语调中多了些许俏皮，“我闲暇时间多得很，但无聊这种情绪我是绝不会容忍的。你……会让我感到惊喜吗？”\n“我为什么会来到这里？一切到底是怎么回事？”焰几乎控制不住情绪，声音颤抖，她终于将困扰自己的问题喊了出口。\n\n“嗯哼，晓美同学。”奥萝拉眨了眨眼，声音柔和得如同梦中细语。“每一个故事，都是为了某种目的而诞生。有人渴望看见熟悉角色被置于极不寻常的处境，有人只是想从杂乱思绪中拼凑出只属于自己的幻想。而于你来说，这一切都是真实存在的，而在他人眼中，不过是一段奇异的虚构。”“最后，我只能说…这本书逗乐了我。偶尔放下梦境去读几篇文笔普通、作者似是初尝创作滋味的故事，也是别样的趣味。”她顿了一下，神情忽然变得庄严而深邃：“不过，现在开始，属于你的选择所书写的‘后果’，就要揭晓了。”“再见。”声音刚落，她的身影便化作一缕灰白色的薄烟，随风散去。\n\n“等一下——你到底什么意思…”焰下意识地伸手，却只抓住了空虚。当她还想追问，整个房间的轮廓却忽然开始模糊、分解。下一刻，她站在了那扇巨大的钢铁之门前。门上贴满了警告标识，耀眼刺眼，不祥而沉重。在门后——她知道——就是鹿目圆所在的地方。然而，她的手却止不住地战栗了。不安与恐惧如同冰霜般紧紧缠绕她的四肢。她深吸一口气，将指甲死死嵌入掌心，直到渗出鲜血。闭上双眼，她挣扎着平息心绪。然后，深呼吸，手指缓缓按下了那枚开启门的按钮。"
 GWF.61.a: "关键时刻。"
 GWF.62.t: "罪与罚"
 GWF.62.desc: "开门的声音。一股许久未用房间特有的气味扑面而来。晓美焰不想睁开眼睛，不想知道里面究竟是什么。那是……对未知的恐惧。然而，无论多么不情愿，她也不能永远留在黑暗中。眼睑开始缓缓抬起，露出了那个房间的景象。房间看起来就像一个极其普通的实验室，一侧摆放着桌子和电脑，而另一侧……则是数个巨大的、蒙着灰尘的培养皿，里面清晰地映照出两个相似的人形轮廓。\n\n“小圆！”焰高喊一声，猛地冲向最近的那个培养皿。擦拭着玻璃，确认里面确实是她之后，魔法少女双膝跪倒在地。泪水开始模糊她的视线，她感觉她仿佛很快又要消失了。这个念头突然像针一样刺痛了她的心脏。不，晓美焰不能再失去她了，绝对不能。但问题是，该如何把她从培养皿里弄出来。走到对面的电脑前，魔法少女启动了它们。对她而言幸运的是，电脑没有任何密码。“如果一个培养皿里是小圆，那么另一个里就是圆环之理。”焰低声喃喃着。\n\n装着小圆的培养皿开始缓缓打开，不明的液体随之流淌而出。焰再次跑向培养皿，一把抓住险些跌落在培养皿底板上的小圆。她小心翼翼地将她安置在地板上，粉色头发女孩的眼睛微微睁开了一条缝。“小焰…”她轻声呢喃，随即又几乎立刻闭上了眼睛。\n\n“别担心，鹿目圆，我会救你的。”焰强忍着泪水回答道。魔法少女将头转向旁边装着“神圣部分”的培养皿，但很快又移开了视线，那并不是值得拯救的存在。紧紧抓住小圆，突然间，焰感到一股巨大的力量涌入体内，两个女孩周围的空间开始破碎、扭曲。是的，就是这个，宇宙再次被改写了。很快一切都会恢复原样，对吧？\n\n一道闪光。地下实验室的景象被见泷原寻常的城市街景所取代。焰发现自己正好站在鹿目家的对面。但有些地方很奇怪，那栋房子看起来毫无生气，如同被废弃了一般。一张报纸突然贴在了她的腿上。目光落在标题和旁边的图片上，焰的脸因恐惧而扭曲。“一家四口惨遭杀害…不！不！不！”绝望的哭喊声响彻街道。空间再次开始崩塌，宇宙又一次重新启动。"
 GWF.62.a: "不该是这样的。"
 GWF.63.t: "永世囚禁"
 GWF.63.desc: "开门的声音。一股许久未用房间特有的气味扑面而来。晓美焰不想睁开眼睛，不想知道里面究竟是什么。不确定感攫住了魔法少女的心智，然而，她终究不能永远逃避终结。这不正是她长久以来所期盼的那个瞬间吗？眼睑开始缓缓抬起，露出了那个房间的景象。房间看起来就像一个极其普通的实验室，一侧摆放着桌子和电脑，而另一侧…则是数个巨大的、蒙着灰尘的培养皿，里面清晰可见两个身影。\n\n“小圆！”焰高喊一声，猛地冲向最近的那个培养皿。擦拭着玻璃，确认里面确实是她之后，双手不自觉地伸向了培养皿。魔法少女简直不敢相信，自己有朝一日竟能真的找到她。这一次，她绝不会再放手，永不。用手擦去眼角的湿润，一个问题浮现出来：该如何将她从这个奇怪的牢笼中释放出来。走到对面的电脑前，魔法少女启动了它们。对她而言幸运的是，电脑没有任何密码。输入了打开两个培养皿的指令后，奇特的液体开始从里面流出。\n\n焰再次跑向培养皿，一把抓住险些跌落在培养皿底板上的小圆。不知为何，第二个培养皿竟然是空的。魔法少女小心翼翼地将粉色头发的女孩安置在地板上，她的眼睛开始缓缓睁开。“小焰…”她轻声呼唤，脸上露出一丝淡淡的微笑。焰紧紧地将她拥入怀中，反复低语着：“没事了，圆。”两个女孩周围的空间开始破碎、扭曲，但又猛地停止了。小圆再次睁开眼睛，那金色的光芒已从眼眸中消失。\n\n“我们…没能回去吗？”粉色头发的女孩轻声问道。\n“你在说什么，这里还是…这个实验室啊。”焰回答道，几秒钟后，她才恍然大悟，“你尝试重启宇宙了？”\n“对不起，我只是想让一切恢复原状。”\n“不要道歉，没关系的。”黑发魔法少女说着，将她拥得更紧了些。"
 GWF.63.a: "现在，离开这里吧。"
 GWF.64.t: "各归其位"
 GWF.64.desc: "开门的吱呀声响起。随之而来的是许久未用房间特有的沉闷气味。晓美焰不愿睁开双眼，不愿去探知其中究竟。未知固然可怖，却也预示着某种新事物的开端。毕竟，这漫漫长路绝非虚度，早已立下的目标已近在咫尺。将所有决心紧握于拳中，魔法少女睁开了眼，那房间的景象随之映入眼帘。房间看上去就像一间最寻常不过的实验室，一侧摆放着桌子和电脑，而另一侧……则是数个蒙着厚厚灰尘的巨大培养皿，其中清晰可见两个模糊的身影。\n\n“小圆！”焰惊呼一声，猛地冲向最近的培养皿。她伸手擦去玻璃上的灰尘，确认了里面的人影——那确实是小圆。魔法少女几乎不敢相信，自己有朝一日竟能真的找到她。一层薄雾悄然蒙上了她的双眼，这曾是遥不可及的梦境。可现在，小圆就在这里，就在她的眼前。用袖口拭去泪水，魔法少女走向旁边的培养皿，正如她所料。那里面也是小圆，但那是另一个她，是神圣的那一部分——“圆环之理”。就在这一刻，一阵剧烈、爆炸般的疼痛猛然袭击了焰的头颅。\n\n黑色的烟雾霎时充斥了整个房间，并开始凝聚成某个轮廓。起初，焰未能分辨出那是谁，但意识很快降临。那是“恶魔”，是她亲手创造出的自己。\n\n“真有意思，看来现在我也一分为二了呢，”分身开口说道，手中握着的正是焰的灵魂宝石，“你做得还真不错。”\n\n“你在做什么？！解释清楚！”焰大喊道，与此同时，装着“圆环之理”的培养皿开始出现裂痕。\n\n“冷静点。恶魔与神明各归其位，凡人亦然。一切都合乎逻辑，不是吗？”‘焰’一边说着，一边用力捏紧了手中的宝石，“是时候收拾这片狼藉了。”\n\n周遭的空间开始崩坏、扭曲，焰与小圆一同被卷入由空间碎片和其他漂流者面孔构成的混乱漩涡。随着时间一分一秒地流逝，她们朝着各自的方向越漂越远，空间则不断重构。一道闪光。焰的眼前被黑暗笼罩，不，只是双眼紧闭。身侧某处传来了闹钟的嘀嗒声，宣告着清晨的到来。凭着旧时的记忆，她摸索到手机，点亮了屏幕。日期：201X年5月1日，来自“鹿目圆”的消息：“今天会来学校吗？我有点担心。”"
 GWF.64.a: "这就是…期盼已久的终结吗？"
 GWF.65.t: "落幕"
 GWF.65.desc: "晓美焰躺在斯图加特工业区某处泥泞的土地上，更确切地说，是躺在这片工业区所留下的废墟上。如今，目之所及，只有一片焦黑的断壁残垣。雨水顺着这位魔法少女的脸颊滑落，与泥土混杂在一起。她不记得自己是如何来到这里的，更不知道究竟发生了什么事。此刻，她什么也感觉不到，只有一阵阵剧痛从身体各处传来。她的手中紧握着自己的灵魂宝石，宝石的颜色早已变得污浊不堪。\n\n“快要…彻底变黑了，”晓美焰低声说道，凝视着手中的宝石。周围既没有“悲叹之种”，也没有其他任何东西。归根结底，在这个世界上，她既不是“神”，也不是“魔鬼”，她和其他所有的魔法少女一样，终将屈服于那无尽的绝望。\n\n她猛地抬起头，发出了一声微弱的笑声。这笑声中究竟包含着怎样的情感？是对痛苦的嘲弄，是对绝望的屈服，还是对自身命运的戏谑？她试图握紧灵魂宝石，将其彻底摧毁，以此来终结这一切。但她的双手却不听使唤，无力地垂了下来，那灵魂宝石也随之滚落到了一旁的泥泞之中。\n\n“哈…我真是个差劲的家伙，”晓美焰自嘲地笑了笑，“这就是我的地狱吗？对不起，圆…”\n\n话音刚落，灵魂宝石便碎裂开来，从中喷涌而出的滚滚浓烟，在短短几分钟内便笼罩了整个斯图加特。这座城市化作了一座永恒的葬礼行进的舞台，走在队伍最前方的，则是一位头颅残缺不全的魔女。混乱与毁灭席卷了这座城市，而唯一还能保持冷静的，只有一位站在电视塔上的红发少女。\n\n“童话故事到此结束。”她说道，手中紧握着那杆金色的长枪。"
 GWF.65.a: "剧终。"
 GWF.66.t: "剧终"
 GWF.66.desc: "疲惫。这个词足以概括晓美焰近来的所有感受。扭曲崩坏的宇宙，治理国家的重担，寻找小圆的旅程。太多的难题在同一时间压在了焰的肩上，直到不久前，她还尚能应对。但即便是自诩为“恶魔”的存在，也无法逃脱枯竭的命运。黑发的少女缓慢地行走在市政厅的走廊里。她的眼皮沉重得几乎要粘在一起，但每当睡意袭来，她便会用力摇摇头，试图将其驱散。“等做完一切再睡吧。”一丝微弱的低语在空气中飘散。\n\n走向自己的办公室，焰没有听见门内传来的轻微爆裂声。“大概是风吧。”她推开门，自言自语道。走到办公桌前，魔法少女瘫倒在椅子上，仰头望着天花板。桌上依旧堆放着各种文件、报告，以及散落其间的她的笔记。“滴答，滴答。”旁边的立钟规律地敲打着节奏。时间已近凌晨两点。当分针指向十二时，钟声响起。紧接着，藏在桌下的某物轰然爆炸。\n\n耀眼的闪光照亮了整个办公室，燃烧的文件碎片在空中飞散。距离炸弹最近的焰被冲击波狠狠地撞向窗户。下半身传来阵阵钝痛，双腿已化作一团由烧焦的血肉、骨骼和皮肤组成的模糊肉糜。身体的再生能力已经启动，却进行得异常缓慢。一面盾牌出现在魔法少女的手臂上——当务之急是停止时间。但就在此时，一柄金色的长枪猛地刺穿了盾牌，阻止了她的行动。一个被阴影和尘埃遮蔽的身影逐渐显现。那是一位金发的少女，约莫比焰高出一头，正居高临下地严厉注视着她。\n\n“你是谁？”焰咬紧牙关，忍着剧痛问道。\n\n“这个你无需知晓，抱歉。”陌生的魔法少女回答道。她的另一只空着的手中握着一把大口径左轮手枪。\n\n“这么说，我连一战之力都没有就输了吗？绝不！”焰试图用另一只手从盾牌中取出些什么，但两声枪响瞬间贯穿了她的手肘，几乎将手臂撕裂。“啧…小圆…”\n\n“这都是徒劳的，对不起。”对方将枪口对准了焰握着灵魂宝石的手掌。\n\n枪声响起，在刹那间终结了魔法少女的生命，只留下一具残破不堪的躯体。\n\n金发少女转身离开办公室，拿出了一台无线电。“目标‘夜火’已清除。希望兰利那边会满意。”她对着发出嘶嘶声的麦克风说道。随手将无线电抛向空中，挥动长枪将其彻底摧毁。"
 GWF.66.a: "何其惋惜。"
 GWF.67.t: ""
 GWF.67.desc: ""
 GWF.67.a: ""
 GWF.68.t: "恶魔与雄鹰"
 GWF.68.desc: "晓美焰已经查明了“德意志帝国运动”总部的确切位置，现在只剩下最后一步——做好万全的准备，并在最恰当的时机发动致命一击。她准备了几个装有雷管的炸药包，以及几支突击步枪，以防计划出现差错。幸运的是，该组织的总部大楼就像是一个只有少数几个出口的陷阱，这为她的行动提供了极大的便利。\n\n在夜幕的掩护下，她迅速地穿梭于城市之中，朝着目标地点飞奔而去，没有任何人注意到这位在屋顶之间飞速穿行的少女。十几分钟后，她便抵达了目的地。根据先前收集到的情报，此刻那里应该正在举行一场由该组织头目——包括其领导人奥托·恩斯特·雷默——参加的指挥官会议。\n\n晓美焰发动了时间静止，潜入了大楼内部。她可不想在这座城市中制造一场血腥屠杀。在进入会议室后，少女小心翼翼地将炸药包安放在了桌子下方，以确保一旦行动失败，这些炸药能够对这些抵抗运动头目造成最大程度的杀伤。\n\n她走到雷默的身后，解除了时间静止。晓美焰拍了拍手，吸引了房间内所有人的注意力。\n\n“请允许我打断一下各位的会议，”房间中响起了一个充满威胁的女性嗓音，“请大家不要惊慌，也不要试图反抗，因为在你们的脚下，正放着几公斤的TNT炸药，如果发生什么意外，让这里的一切都灰飞烟灭，那可就不好了。”\n\n房间里顿时陷入了一片死寂，所有人都吓得一动不动。既然她能够在神不知鬼不觉的情况下将整间屋子都布满炸药，那么也没有人愿意去怀疑她是否真有能力说到做到。少女在转瞬之间来到了其中一位指挥官的身旁，用冰冷的目光注视着他们的领导人——奥托·恩斯特·雷默。\n\n“现在你们应该明白，负隅顽抗是毫无意义的吧？”晓美焰质问着这位将军。\n\n“是…是的，您说的没错。您有什么条件？”奥托答道。\n\n“很简单，你们立刻停止一切抵抗活动，放下手中的武器，这样的话，作为交换，我也可以做出一些让步。这对双方来说，难道不是一件皆大欢喜的好事吗？”\n\n“我…明白了。我提议立刻就全面停止抵抗行动进行投票表决。”雷默语气平静地对其余的指挥官们说道，所有人都顺从地举手表示赞同，“全票通过。决议已经生效，立即向所有基层组织发送电报，命令他们停止一切军事行动。”"
 GWF.68.a: "雄鹰已被牢牢地掌控在手中。"
 GWF.69.t: "恶魔与雄鹰"
 GWF.69.desc: "晓美焰已经查明了“德意志帝国运动”总部的确切位置，现在只剩下最后一步——做好万全的准备，并在最恰当的时机发动攻击。她准备了几十支突击步枪，以及一些手持式反坦克榴弹发射器。幸运的是，该组织的总部大楼就像是一个只有少数几个出口的牢笼，这为她的行动提供了极大的便利。\n\n在夜幕的掩护下，她迅速地穿梭于城市之中，朝着目标地点飞奔而去，没有任何人注意到这位在屋顶之间飞速穿行的少女。十几分钟后，她便抵达了目的地。根据先前收集到的情报，此刻那里应该正在举行一场由该组织头目——包括其领导人奥托·恩斯特·雷默——参加的指挥官会议。\n\n晓美焰发动了时间静止，将事先准备好的火箭筒对准了大楼的窗户，扣动了扳机。她并不关心是否会对周围的建筑物造成损坏，让这个该死的组织彻底停止运转才是她的首要任务。她登上附近一栋建筑的屋顶，躲在一根砖砌的烟囱后面，解除了时间静止。\n\n事先发射的火箭弹开始启动，将指挥部的上层建筑炸成了一片废墟。房间里立刻传来了密集的枪声和声嘶力竭的叫喊。故技重施，利用时间停止，通过墙壁上被炸出的大洞，她闪身进入了大楼内部。她从自己的异空间中取出一支步枪，瞄准了每一个还在房间中活动的人，将他们一一射杀。唯一一位幸免于难的，便是雷默本人。\n\n时间开始流动，房间里的近二十人几乎在同一瞬间倒地身亡。这位身材高大、年事已高的男子惊恐地环顾四周。\n\n“你，你这个！恶魔！”他一边尖叫着，一边从自己的“瓦尔特”P38手枪中朝着正走向他的少女疯狂射击。\n\n“哦，没错，他们都是这么称呼我的，但我更喜欢‘魔鬼’这个称呼。”晓美焰冷冷地回答道，对于那些击中自己的子弹毫不在意。\n\n“上帝啊，为什么会这样？不，我绝不会死在你的手上，恶魔！”雷默一边尖叫着，一边伸手从口袋里掏出一粒氰化物胶囊。但还没等他抓住其中一颗，一颗子弹便击穿了他的头颅。\n\n“想用你自己的方式来结束这一切？很遗憾，没门，这种好事可轮不到你。”少女对着那具已经毫无生机的尸体说道。她转过身，缓缓地走出了房间，脚下踩过一具又一具新鲜的尸体。"
 GWF.69.a: "雄鹰坠地"
 GWF.70.t: "革命与叛乱"
 GWF.70.desc: "搜寻共产主义者的指挥部绝非易事。他们的小型据点被成功发现并摧毁了许多，但若要彻底根除这些“赤色分子”，却难如登天。然而，命运女神却突然眷顾了晓美焰，为她送上了一份大礼。她终于掌握了“红军派”头目集会的准确时间和地点，其中也包括该组织最为核心的人物——安德烈亚斯·巴德尔和古德伦·恩斯林。\n\n这次会议定于傍晚时分，在距离斯图加特50公里外的一座小村庄里举行。尽管一切都显得唾手可得，但晓美焰总感觉事情不会这么简单。整个局势如果不是一场精心设计的陷阱的话，那么也是一个高明的伪装。无论她如何绞尽脑汁地制定作战计划，最终都无法取得任何进展，每一次的推演都以失败告终。最终，她决定随机应变。\n\n晓美焰发动了时间静止，径直走向了村庄边缘的一栋大房子，所有“红军派”的头目都将在这里集会。她进入屋内，顺着地板上的脚印来到了二楼。走廊尽头的一扇门微微敞开着，她走了进去。映入眼帘的是一间拥挤不堪的小房间，里面挤满了15个人，即便是在时间静止的状态下，也依然能够感受到空气中那股紧张而又压抑的气氛。\n\n晓美焰从自己的异空间中取出了一把手枪，并做好了朝天花板开枪的准备。时间开始流动。枪声响起，打断了“红军派”头目们之间的所有交谈和讨论。房间里瞬间陷入了一片死寂。\n\n“安德烈亚斯·巴德尔，古德伦·恩斯林，我来这里并非为了杀戮，所以，我希望你们不要轻举妄动！”晓美焰打断了沉默。\n\n“该死，”安德烈亚斯皱着眉头，低声咒骂道，“所有人立刻离开，我和古德伦留在这里，快！”\n\n所有人都开始缓缓地走出房间，有人走得慢，有人走得快。其中一人试图袭击这位少女，但却被其他人一把抓住，并被强行拖出了房间。当所有人都离开后，房间里就只剩下了三个人：晓美焰，安德烈亚斯和恩斯林。\n\n房间外的气氛依旧紧张，没有人知道这次会面将会以怎样的结局收场。十分钟，三十分钟，一个小时，一个半小时过去了。期间有人提议要冲进房间，但都没有实施。将近两个小时后，房门终于打开了。巴德尔和恩斯林面带喜色地走了出来。\n\n“同志们，我在此向大家宣布，我们取得了一场伟大的胜利！我们再也不需要躲躲藏藏，过那种提心吊胆的日子了！”安德烈亚斯对着围拢在门口的人群大声宣布道。\n\n在一阵阵欢呼声中，晓美焰悄无声息地从窗户离开了房间。"
 GWF.70.a: "革命被扼杀于摇篮之中？"
 GWF.71.t: "负隅顽抗的赤色彗星"
 GWF.71.desc: "搜寻共产主义者的指挥部绝非易事。他们的小型据点被成功发现并摧毁了许多，但若要彻底根除这些“赤色分子”，却难如登天。然而，命运女神却突然眷顾了晓美焰，为她送上了一份大礼。她终于掌握了“红军派”头目集会的准确时间和地点，其中也包括该组织最为核心的人物——安德烈亚斯·巴德尔和古德伦·恩斯林。\n\n这次会议定于傍晚时分，在距离斯图加特50公里外的一座小村庄里举行。巧合的是，这距离其中一位头目的老家并不远。提前几个小时到达预定地点后，她密切监视着每一位进入其中一栋大房子的人。很明显，这里就是集会的地点。但不知为何，总感觉哪里不太对劲。\n\n晓美焰发动了时间静止，向着那栋房子走去。潜入屋内后，她发现通往地下室的门是开着的。地下室通向隔壁房屋的一条隧道。在对房屋进行了短暂的搜查后，她才发现这次会议实际上是在两个地点同时举行的。这位魔法少女早已对共产主义者的这些伎俩见怪不怪了，因此她事先准备好了十几门迫击炮，准备对这座村庄发动一次毁灭性的炮击。\n\n在会议开始十分钟后，晓美焰从自己的异空间中取出了她早已准备好的火炮，密集的炮弹如同雨点般倾泻在村庄里，将一切炸成了碎片。一旦弹药耗尽，她便动身前往废墟，去确认此次行动的战果。当她来到那栋“主要”房屋的废墟旁时，她发现了几乎所有“红军派”领导人的尸体，其中也包括恩斯林。\n\n随后，晓美焰前往第二栋房子，但就在她即将踏入大门的那一刻，十几颗子弹却突然射入了她的后背。她踉跄了几步，猛地转过身来，看向子弹射来的方向。在距离她五米远的地方，浑身是血的巴德尔正站在那里，手中握着一把MP40冲锋枪。\n\n“你他妈的，怎么还没死透？！”安德烈亚斯大声咒骂着，再次将手中的武器对准了她。\n\n“你难道没听说过，我——不是人类吗？”一个声音在他的身后响起。少女在瞬间出现在了他的身后，而他的皮肤也感受到了冰冷的枪口。\n\n“哈哈，我不在乎你是谁，我将为了正义的事业献出…”一声枪响打断了巴德尔的豪言壮语。\n\n“好吧，既然如此，那你就去死吧。”晓美焰叹了口气，走出了这片燃烧着的废墟。"
 GWF.71.a: "叛乱者击毙了革命者。"
 GWF.72.t: "骑士与恶魔"
 GWF.72.desc: "在晓美焰成功地消灭了来自“红军派”的共产主义者和来自“德意志帝国运动”的民族主义者的威胁之后，唯一还敢于挑战她的统治，并妨碍她实现自身目标的，就只剩下了“末日军团”——一个由对她的统治心怀不满的魔法少女们所组成的组织。然而奇怪的是，最近一段时间，她们的活动明显减少了许多，但她们仍然时不时地会出来兴风作浪。\n\n她们的行踪难以捉摸，其领导人的身份也一直不为人知。晓美焰翻阅了大量关于她们活动的报告，但却毫无收获。审讯那些被俘的“红军派”和“德意志帝国运动”成员，也没有为调查带来任何进展。\n\n房门突然被推开，气喘吁吁的汉斯·菲尔宾格冲了进来，手中拿着一根用布条包裹着的长条状物体，还有一封信。“给您…的信！”这位官员上气不接下气地说道。晓美焰点了点头，示意他将“包裹”放在桌上。一阵金属碰撞的声音从包裹中传来。信中邀请她前往当地的一座福音派教堂进行会面。解开包裹，里面是一把军刀。“不可能，”少女的脑海中一片空白。\n\n晓美焰立刻动身前往指定的地点。这可能是一个陷阱，她也清楚地意识到自己正在一步步地走向敌人为她设下的圈套。抵达目的地后，这位魔法少女倚靠在附近一栋建筑的墙壁上，等待着。\n\n“你来得真快，我还以为你不会这么轻易上钩呢。”一个充满活力的声音从她的头顶上方传来。\n\n“美树，你他妈的究竟在哪里？”晓美焰环顾四周。\n\n“拜托，我们能不能像正常人一样称呼彼此的名字？毕竟这里可不是什么战场。”那位蓝发魔法少女答道，她就站在晓美焰的面前。\n\n“好吧…沙耶香，你怎么会出现在这里？‘抵抗组织’是你一手策划的？”一连串的问题脱口而出。\n\n“关于我是如何来到这里的，这个问题和你无关。至于‘抵抗组织’，没错，你猜对了，”沙耶香答道，“我本以为你与这周围所发生的一切都有着某种关联，但现在看来，我似乎弄错了。”\n\n“老天，好吧，你知道关于圆的事情吗？她在哪里？”\n\n“不知道，”她的声音低沉了下去，“我也在竭尽全力地寻找她。我们应该联手。”\n\n“我们？好吧，你可以做任何你认为正确的事情。”"
 GWF.72.a: "达成共识。"
 GWF.73.t: "冲突"
 GWF.73.desc: "在战胜了其他的组织后，“末日军团”变得愈发活跃起来。她们的袭击变得更加具有破坏性，但与此同时，她们也犯下了一个致命的错误——暴露了她们的藏身之处。她们的总部竟然就设在当地的一座大教堂里。\n\n晓美焰立刻调集了火炮和炸药，准备将这栋建筑以及地下可能存在的地道一举摧毁。在抵达教堂附近后，早已部署就位的火炮便开始轰鸣，安放在各处的炸药也相继爆炸，对教堂发动了全面进攻。晓美焰冲进教堂，用精准的射击击穿了魔法少女们的灵魂宝石，将她们一一击毙。\n\n在消灭了数十名敌人后，她开始沿着楼梯向下走去，但就在她踏上第一级台阶的那一刻，几枚灭火器突然在她周围爆炸了。\n\n一个熟悉的蓝色身影在晓美焰的眼前一闪而过，她身上披着一件白色的斗篷。灭火器所喷出的白色烟雾开始逐渐消散，最终，“末日军团”的领导者露出了她的真面目——一位留着蓝色短发，手持一把长剑的少女。没错，正是她。\n\n“美树…沙耶香，一切终于真相大白了，”晓美焰自言自语地冷笑道。\n\n“你…真可惜我之前没能阻止你。但现在，你休想再前进一步，‘新人’！”沙耶香说着，向她冲了过来。\n\n一场激烈的战斗就此展开。晓美焰巧妙地躲避着对方的每一次攻击，但沙耶香也总能找到机会斩断那些射向她的子弹。战斗持续了很长时间，难解难分。然而，在耐力的比拼中，晓美焰逐渐占据了上风，而沙耶香则开始出现失误。一下，两下，三下，她被击倒在地，艰难地喘息着。晓美焰走到她面前，用枪口对准了她胸前的灵魂宝石。\n\n“还有什么遗言吗？”她问道，将枪口抵在了那颗宝石上。\n\n“去死吧…”蓝发魔法少女咬牙切齿地说道。\n\n一声枪响过后，灵魂宝石应声碎裂，生机也随之从少女的身体中迅速消逝，毫无疑问，美树沙耶香——已经死了。晓美焰意识到，所谓的“末日军团”组织已经彻底覆灭，她缓缓地走出了教堂，以及教堂周围那化为一片废墟的街区。"
 GWF.73.a: "九头蛇的最后一颗头颅也被斩落。"
 GWF.74.t: "于荒芜之地"
 GWF.74.desc: "宇宙在重启，一次又一次，一次又一次，永无止境。每一次轮回，周遭的世界都扭曲得更加厉害，但无论在哪个世界线，小圆都未能存活。境况在变，日期在变，死因在变。唯有一点亘古不变——她总是在焰来得及做出任何行动之前就已香消玉殒。由于不断尝试通过重启世界来复活小圆，这个世界早已面目全非，与“正常”二字相去甚远。城市景观消失殆尽，取而代之的是一片无垠的荒漠，一片被昏黄天空笼罩的无边沙海。\n\n焰已经无法，或者说，已经不愿再次改写宇宙了。她无声地跌坐在灼热的沙地上，取出了自己的灵魂宝石——它依然纯净得令人惊讶。手不自觉地握紧了它，试图将其捏碎。剧烈的痛苦瞬间传遍全身，但手掌并未颤抖分毫。不幸的是，宝石对压力毫无反应。其他试图击碎它的尝试也都归于徒劳，它仿佛比钛金属还要坚固。即便是将宝石扔掉然后走开也无济于事，在最后一刻，它总会重新回到她的手中。\n\n魔法少女默默地坐在沙地上，凝视着空洞的天穹。她渴望死亡，无论以何种方式，但如今连宇宙本身似乎都在阻止她获得解脱。“或许，这才是真正的地狱吧。”女孩心想。\n\n“你就没想过，这一切——都是你的错吗？”一个声音响起，来自一个轮廓不断变换、无法看清任何细节的存在。\n\n“闭嘴，我所做的一切……都是为了救小圆。”焰嘶嘶地说。\n\n“就算小圆还活着，她会为你这种拯救方式感到高兴吗？你只是把自己的原则丢进了垃圾堆，不是吗？真是个差劲的救世主。”\n\n“我……累了。我现在只想死。”\n\n“我办不到。这个宇宙现在过于依赖你的存在。死亡，以传统意义而言，对你来说已是遥不可及的奢望，”那存在朝某个方向瞥了一眼，补充道，“每个人都会得到属于自己的结局。”\n\n焰没有再做任何回应。日复一日，月复一月，年复一年。那个保持着同一姿势凝固不动的少女，既非生者，亦非亡者。思绪停止了流转，眼神变得空洞。或许，在遥远未来的某一天，会有人为她指明出路，让她成为某个崭新故事的主角。但现在，这里只剩下一具空壳，和一颗早已死去的灵魂。"
 GWF.74.a: "地狱因人而设。"
 GWF.75.t: "完美囚笼"
 GWF.75.desc: "位于柏林郊外的那座宏伟的古老庄园，如今展现出前所未有的华美。在历经近十年的荒废之后，杂草已被清除，花园重整一新，建筑外墙也清洗得焕然一新。这里现在是德意志领袖——晓美焰的官邸。数十名仆人在奢华的主宅各个房间内辛勤打扫，全国最顶尖的厨师汇聚于此。近千名忠诚的亲卫队士兵负责守卫这片领地。这座庄园——是度过余生的理想之地。\n\n清晨的阳光开始洒入卧室。晓美焰早已醒来，她凝视着身旁熟睡的小圆，脸上露出一丝浅笑，随后起身，开始了她已习以为常的每日例行事务。这位黑发魔法少女的每一天都安排得满满当当，独自管理如此庞大的疆域并非易事，尤其是在她曾费尽心机想要将一切摧毁之后。但现在，随着小圆的回归，她意识到，或许不应再执着于那些不可能实现的目标。\n\n既然焰已掌握此地权柄，那么现在就该将其用于正途。她下楼来到入口处，穿上一件制服，前去迎接国家安全部门的负责人。威廉·蒙克，这位老练的军官，已然成为焰的左膀右臂，是她意志的执行者。他手持文件夹走上前去，开始汇报关于镇压匪徒、经济发展和外交事务的最新简报。焰心不在焉地听着，将近一半的内容左耳进右耳出，随后递给他几页写有指示的文件，蒙克便告退了。\n\n魔法少女转身走向二楼，想去看看小圆是否一切安好。幸运的是，对于焰来说，小圆似乎忘记了那次失败的宇宙重启尝试。再次走进卧室，小圆正百无聊赖地坐在窗边，发丝微乱，睡衣也有些褶皱。黑发少女走到窗前，俯身靠近她。\n\n“小圆，一切都好吗？”焰率先开口。\n“啊，嗯……嗯，我总觉得……这一切有些不对劲，好像有什么地方不太对。”小圆轻声回答。\n“别担心，有我在。”感觉到对话可能会偏离方向，焰的双臂环住了坐着的小圆的肩膀，脸颊轻轻贴上她的脸颊。"
 GWF.75.a: "最好别多想。"
 GWF.76.t: "寻找出路"
 GWF.76.desc: "地下的科研综合设施再次充满了忙碌的气氛。科学家们行色匆匆，来回奔走；电脑嗡嗡作响；各种文件被不断打印出来。来自世界各地的顶尖头脑汇聚于此，旨在研究近年来发生在德国和俄罗斯的种种现象。数十种超自然现象亟待理解与解释。\n\n在这片喧嚣之中，有两位少女显得格外不同。她们手挽着手，不紧不慢地穿行在研究中心的大厅之间。她们是最引人注目的存在，并非身着寻常的白大褂，而是穿着宽松的病号服。她们二人——鹿目圆和晓美焰，正是整个研究项目中最富趣味的研究对象。一人近乎神明的力量，另一人冻结时间的能力，激起了科学家们浓厚的兴趣。自从焰将国家管理权移交给文职政府后，这对伙伴大部分时间都近乎与世隔绝地生活在这座岛上。\n\n采集样本，持续不断的观察——其程度甚至到了荒谬的地步。对于黑发的魔法少女而言，这比她待在斯图加特市政厅时更加令人煎熬。但与焰的郁郁寡欢形成对比的是，小圆对眼前发生的一切都抱持着平静而充满好奇的态度，这反而让焰的心绪平静了许多。或许，一切并没有那么糟糕。\n\n“晓美小姐，鹿目小姐。目前所需的材料已经收集完毕，你们可以暂时离开中心一段时间。”一位带着些许法国口音的科学家走近她们，开口说道。\n“谢谢你，皮埃尔。如果需要我们返回岛上，请随时联系。”焰回答道。\n“能帮上忙我们也很高兴！”小圆笑着感叹道。\n\n离开综合设施前，两位少女换下了病号服，穿上了普通的衣物。她们紧紧牵着彼此的手，走向地面。送她们返回大陆的船将在几小时后抵达，她们早已计划好了要去哪里，要做些什么。“你觉得，我们能回到见泷原吗？”粉色头发的少女问身旁的焰。\n\n“嗯，我们一定能回去。”焰微微一笑，答道。"
 GWF.76.a: "一同前行。"
 GWF.77.t: "十年之后"
 GWF.77.desc: "晓美焰不紧不慢地走在东京某处郊外公寓楼的楼梯上。今天难得能早些下班，于是她顺道拐进了7-Eleven便利店，买了一块小小的蛋糕作为礼物。就这样，没什么特别的理由。她不太愿意去深思这类事情。钥匙在锁孔里发出轻微的响动，门应声而开，少女走进了自己的家。将从便利店买来的袋子放在地上，小心地脱下鞋子，焰沿著走廊往里走。\n\n突然，一个身影猛地跳起，挂在了她的背上。落在肩头的粉色发丝立刻暴露了袭击者的身份。焰转过身，看到了笑意盈盈的小圆。这实在有些出乎意料，因为她们俩平时下班都很晚。正当黑发少女以为这次“袭击”就此结束时，她的嘴唇感受到了一片柔软温润的触感——来自对面女孩的双唇。\n\n焰的脸颊因意外和羞涩瞬间泛起红晕，而小圆则发出了温柔的轻笑。“抱歉，抱歉，没忍住嘛。这算是我的惊喜。”她说道。\n\n“看来你今天也回来得很早呢，”焰回应道，“我倒是给你准备了蛋糕，虽然比不上‘Récompense’的啦。”\n“嗯，妈妈的公司今天没什么事，所以就提前溜出来了。你呢？出版社那边怎么样？”\n“挺好的，今天又收到了寿由香里老师的新稿子校对，她写的关于小狮子的童话故事卖得特别好，”焰叹了口气，“感觉我的历史小说要扑街了。”\n“小焰，别这么说嘛，我相信你！”小圆握紧了小拳头，鼓励道。\n“好吧，你说服我了。只剩下最后一点收尾工作了，这周末就能交给编辑了。”\n“这就对了嘛！我去泡茶，我们一起吃蛋糕吧。”\n\n焰点点头，两人一起走向厨房。一如既往美味的绿茶，与从超市买来的普通蛋糕竟也意外地搭配。说实话，由于工作和其他事务的繁忙，这样悠闲共处的时光对她们而言并不常有。从傍晚到深夜，她们仿佛聊遍了整个世界。从工作中的趣闻轶事聊到沙耶香和杏子的家庭生活，从蛋糕的口味与制作工艺谈到各地的饮茶传统。\n\n结束了这段相伴的时光，焰走向了自己的书房。书桌上放着厚厚一叠稿纸，标题赫然写着——“沙皇与苏维埃”。"
 GWF.77.a: "每个故事，终有被述说的一天。"
