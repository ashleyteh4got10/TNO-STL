 GWF_asses_situation_tt: "§l我非魔女，亦非恶魔。如今的我，又该是谁？§!"
 GWF_to_find_exit_tt: "§l身为魔法少女，我仍保有相当的力量。然而，今后必须留意残存的魔力了。§!§e倘若力有不逮，后果不堪设想……§!\n§Y决策类别§F“我的游戏”§!将被开启§!"
 GWF_contact_incubator_tt: "§l尽管我对其恨之入骨，他们仍有可利用之处。§!"
