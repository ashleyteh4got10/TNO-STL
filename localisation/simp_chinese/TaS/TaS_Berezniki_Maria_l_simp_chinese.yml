 AprilFools_Akemi_Homura_DESC: "世界的崩坏带来了无数的“惊喜”，至于它们究竟是福是祸，仍有待分说。\n\n每一个被卷入这场浩劫之中的人，他们的命运都发生了翻天覆地的剧变。而究竟是哪些人被这股神秘力量裹挟至此，笼罩在一切之上的神秘面纱终将揭开，而我们又将面临怎样的未来，也终将大白于天下。\n\n§Y那么，准备好和上帝或是撒旦来一场命运的轮盘赌了吗——管他是谁呢？§!"
 AprilFools_Akemi_Homura_DESC_actual: "十二载光阴，上百次的轮回——这是我为实现那唯一的目标所付出的沉重代价。拯救鹿目圆，我唯一的挚友，也是我在这世上最为珍视之人。圆为了拯救所有的魔女，许下了愿望，而这奇迹的代价，则是让她自身的存在从这个世界的既有规则中彻底抹去，徒留我一人，孤独地守护着关于她的记忆。而我的愿望，拯救圆，从未改变，哪怕需要背负上滔天的罪孽，我也在所不惜。但那些孵化者们却妄图染指那圆环之理……"
 GWF_chaos_in_stuttgart: "混乱的斯图加特"
 GWF_chaos_in_stuttgart_desc: "世界的崩塌对于德意志的普通民众而言，绝非一件可以等闲视之的小事。曾经在纳粹的统治下，一切都有条不紊，但如今这个“正常”的世界却突然分崩离析，化作一幅由无数个时间线和世界交织而成的混乱画卷，社会秩序荡然无存，哪怕是街头巷尾的无名小卒，都有可能摇身一变，割据一方，哪怕他本人对此毫无兴趣。\n\n晓美焰也阴差阳错地成为了这样一位“时势造英雄”式的人物，在一片混乱中成为了斯图加特及其周边地区的统治者。诚然，并非所有人都被这突如其来的剧变吓得不知所措。一些嗅觉敏锐，反应迅速之人则抓住这千载难逢的良机，纠集自己的势力，妄图在这场权力的盛宴中分一杯羹。\n\n现在，摆在晓美焰面前的只有一条路——重建城市秩序，哪怕只是恢复最基本的社会运转，她也必须全力以赴。否则，等待着她的，将是万劫不复的深渊。成王败寇，别无选择。"
 GWF_chaos_in_stuttgart_1: "混乱的斯图加特"
 GWF_chaos_in_stuttgart_1_desc: "世界的崩塌对于德意志的普通民众而言，绝非一件可以等闲视之的小事。曾经在纳粹的统治下，一切都有条不紊，但如今这个“正常”的世界却突然分崩离析，化作一幅由无数个时间线和世界交织而成的混乱画卷，社会秩序荡然无存，哪怕是街头巷尾的无名小卒，都有可能摇身一变，割据一方，哪怕他本人对此毫无兴趣。\n\n晓美焰也阴差阳错地成为了这样一位“时势造英雄”式的人物，在一片混乱中成为了斯图加特及其周边地区的统治者。诚然，并非所有人都被这突如其来的剧变吓得不知所措。一些嗅觉敏锐，反应迅速之人则抓住这千载难逢的良机，纠集自己的势力，妄图在这场权力的盛宴中分一杯羹。\n\n现在，摆在晓美焰面前的只有一条路——重建城市秩序，哪怕只是恢复最基本的社会运转，她也必须全力以赴。否则，等待着她的，将是万劫不复的深渊。§R成王败寇，弱肉强食。§!"
 GWF_for_madoka: "她的远见"
 GWF_for_madoka_desc: "鹿目圆，曾经只是一个平凡的少女，就读于见泷原中学。若非那命中注定的邂逅，她的人生或许会一直平淡无奇地延续下去。然而，丘比——这个神秘的生物，打破了她平静的生活。它赋予了少女实现任何愿望的权利，但代价却是成为一名“魔法少女”。至于圆最初许下的愿望究竟是什么，早已淹没在了无尽轮回的洪流之中，无人知晓。如今唯一能够确定的，是她在最后一次轮回中所许下的愿望——拯救所有的魔法少女，让她们免于沦为魔女的悲惨命运。\n\n这个愿望确实实现了……却也夺走了一切。她用自身的存在作为代价，换取了魔法少女的救赎。从此，她彻底抹去了自己在宇宙中的痕迹，不再是一个人类，而是超脱于世间的“概念”，一位游离在世界法则边缘的半神。\n\n焰为了将圆带回凡世所做的一切，最终造就了如今的局面。现在，鹿目圆的命运被笼罩上了一层迷雾，前途未卜，但寻找她的踪迹，并在必要时拯救她，已成为了晓美焰继续活在这个世界上的唯一理由。"
 GWF_for_madoka_tt: "§e无论要付出怎样的代价§!，§l晓美焰§!都将创造出一个§C完美无瑕的世界§!"
 GWF_southgerman_tension: "日益紧张的局势"
 GWF_southgerman_tension_desc: "即便是那些来自异世界的“穿越者”，也无法摆脱人性的羁绊。在南德，各方势力之间的矛盾日益激化，一场全面冲突的阴云正以惊人的速度汇聚，任何一个微不足道的火星都可能将其引爆。我们眼下唯一能做的，便是尽可能地寻找盟友，积蓄力量，为即将到来的那场血腥屠杀做好准备。"
 GWF_meguca_army: "魔法少女军队"
 GWF_meguca_army_desc: "斯图加特——是唯一拥有全新形态武装力量的国家。如今，其军队的核心由魔法少女构成，她们具备超凡的身体能力与强大的火力。这一切将走向何方，她们在实战中又将展现何种能耐，尚难定论。她们的领袖，晓美焰，宣称其怀揣着某种伟大的目标。\n\n当然，这样一支军队的存在引发了道德层面的质疑：这是否违反了战争法规？但在德意志的混乱无序之中，又有谁真正在意这些呢。"
 GWF_southgerman_war: "南德意志战争"
 GWF_southgerman_war_desc: "外交，从来都不是一个选项。德意志再次燃起战火。如今，卷入战争的是些天知道由谁组成的联盟，这场战争既无目标，也无缘由。唯有杀戮，无意义而又残酷无情的杀戮。"
 GWF_opposition_modifier_dummy: "积极抵抗"
 GWF_opposition_modifier_dummy_desc: "§F资源开采效率：[?GWF_opposition_modifier_array^2|2R%+=]\n补给消耗：[?GWF_opposition_modifier_array^1|2R%-=]\n稳定度：[?GWF_opposition_modifier_array^2|2R%+=]\n对驻军伤害：[?GWF_opposition_modifier_array^0|2R%-=]\nGDP增长：[?GWF_opposition_modifier_array^4|2R+=]§R%§!\n其他军事开支：§R$[?GWF_opposition_modifier_array^5|3R-]B§!\n--------------\n§!国内的反对势力正通过各种破坏手段进行活动，这极大地增加了我等的困扰。我必须尽快将他们铲除，以防对我的目标造成重大影响。"
 GWF_Homura_modifier_dummy: "恶魔的状态"
 GWF_Homura_modifier_dummy_desc: "§F各种效果取决于§l晓美焰§!的心理状态。\n--------------\n研究速度：[?GWF_Homura_modifier_array_one^0|.1%=+]\n政治点数获取：[?GWF_Homura_modifier_array_one^1|.1%=+]\n人事开销修正：[?GWF_Homura_modifier_array_one^2|.1%=-]\n指挥点数获取：[?GWF_Homura_modifier_array_one^3|.1%=+]\n稳定度： [?GWF_Homura_modifier_array_one^4|.1%=+]\n--------------\n各种效果取决于§l晓美焰§!的身体状态。\n--------------\n师攻击：[?GWF_Homura_modifier_array_two^0|.1%=+]\n师防御： [?GWF_Homura_modifier_array_two^1|.1%=+]\n师组织度：[?GWF_Homura_modifier_array_two^2|.1%=+]\n师恢复速率：[?GWF_Homura_modifier_array_two^3|.1%=+]\n所需卫戍部队：[?GWF_Homura_modifier_array_two^4|.1%=-]\n--------------\n§!从某种意义上来说，晓美焰也终究只是一个凡人。作为她一手建立的王国的中流砥柱，我们必须时刻关注她的身心健康，以免发生什么难以挽回的悲剧。"
 GWF_Homura_modifier: "恶魔的状态"
 SWRW_flashforward_to_postger_tt: "§R或许，就让我们略去那些无谓的浮华吧。§!§Y向着第二次卫国战争之后的新德国进发！§!"
