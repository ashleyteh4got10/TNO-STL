 GWF_army_deccat_desc: "对于一支全新的军队而言，旧的动员模式已经不再适用。征召魔法少女入伍，这本身就是一项前无古人的创举，我们必须另辟蹊径，采用全新的方法来建立这支独一无二的军队。或许这支军队的规模将远小于传统军队，但魔法少女的战斗力却绝非普通士兵所能比拟。\n\n可供招募的魔法少女： §Y[?GWF_meguca_manpower]§!\n每周增长： §Y[?GWF_meguca_weekly_manpower]§!"
