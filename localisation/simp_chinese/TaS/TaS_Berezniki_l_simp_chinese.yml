 MAR_forpol.1.t:0 "伊朗内战"
 MAR_forpol.1.d:0 "数个世纪于此，伊朗人民一直苟活于文明间的十字路口。虽暗流涌动，但黄金闪闪仍然耀眼。战后的岁月里，沙阿迫切地想进一步巩固与德国的关系。虽然并不是所有人都支持这一做法，但在子弹与警棍的残酷镇压下，反对派的呼声便显得无足轻重了。\n\n而现在，沙阿已死，黄天当立。无论是陨落的美国雄鹰，东亚的日本孽畜亦或是德国的纳粹渣滓，都想从伊朗人的痛苦与鲜血中提炼出斗斗黄金。而身为邻国的俄罗斯绝不能坐视伊朗人民遭受此等苦难，是时候迅速出击，结束内战了。"
 MAR_forpol.1.a:0 "风来风走。"
 MAR_forpol.4.t:0 "中东战火"
 MAR_forpol.4.d:0 "自从第一个文明在河谷中诞生又消逝以来，千百年过去了。中东这片土地，始终像一个火药桶，动荡不安。从伊斯兰教的诞生到二十世纪殖民统治的瓦解，历史的车轮滚滚向前，其间虽不乏令人惊叹的国家和进步思想的涌现，却也充满了动荡与纷争。\n\n终于，这枚火药桶被彻底点燃，其后果席卷全球，所有超级大国都无法置身事外。从埃及到波斯，各国纷纷陷入混乱，全世界人民都开始感受到石油危机带来的冲击。经济崩溃，企业倒闭，不满的民众走上街头。与此同时，超级大国在中东地区进行着博弈，试图利用恐慌攫取利益，并在昔日的丝绸之路上拉拢盟友。当其他国家试图从这场冲突中获利时，俄罗斯不可能袖手旁观。俄罗斯雄鹰已经展翅高飞，无人能阻挡它的前进。"
 MAR_forpol.4.a:0 "玫瑰生于荆棘。"
 MAR_forpol.5.t:0 "赴刚果作战"
 MAR_forpol.5.d:0 "也许没有其他领土比刚果经历过更多的殖民暴行了。从比利时殖民地时代至今，这片土地一直处于最具剥削性和\"吃人\"性的列强统治之下。后来，德国工程师又进行了一次伟大的试验，旨在建造一个湖泊，结果导致生态系统遭到破坏，中非发生了不可逆转的变化。\n\n然而，现在，刚果人民也许是历史上第一次有机会掌握自己的命运，证明谁才是中非真正的统治者。同时，这也是俄罗斯在黑色大陆获得盟友的机会。我们走吧！是时候展示俄罗斯的全部力量了！"
 MAR_forpol.5.a:0 "岁月虽会流逝，山川却会知道。"
 MAR_Iranian_Civil_War_category_desc:0 "时间回溯到1953年，伊朗发生政变，民选总理穆罕默德·摩萨台被推翻，德国的傀儡穆罕默德·礼萨·巴列维上台，并在伊朗建立了一党专政。如今，随着巴列维国王的去世，权力真空出现，他的帝国如同纸牌屋般轰然倒塌。伊朗爆发了内战，联合反对派武装对抗着国王的残余势力，而后者则得到了德国的支持。我们最佳的行动方案是支持由沙普尔·巴赫蒂亚尔领导的改革派君主立宪制势力。他们希望保留君主制，但将国家改革为君主立宪制国家。除此之外，我们别无选择。"
 MAR_forpol.8.t: "意外来电"
 MAR_forpol.8.d: "鲁斯兰·雅科夫列维奇·贝利亚科夫已经站在俄罗斯人民沙皇国大使馆的门前。作为国家安全部上校兼使馆安保队长，他知道自己的工作至关重要。他是第一批被派往伊朗帝国建立关系的官员，他的职责是确保所有使馆成员的安全，这意义非凡，因为他保护的是肩负两国关系构建重任的人们。\n\n走进位于使馆内的办公室，鲁斯兰摘下帽子，给自己倒了杯茶，然后坐在一张黑色的大扶手椅上。突然，电话铃声响起。贝利亚科夫拿起听筒。\n\n“鲁斯兰·雅科夫列维奇，亚历山大·卡津别克首相想和您通话。”\n\n“我准备好了，请接进来。”\n\n“好的，请稍等。”\n\n一分钟后，贝利亚科夫问道：“亚历山大·利沃维奇，请问有什么指示？”\n\n“鲁斯兰·雅科夫列维奇，现在该是你完成使命的时候了。”\n\n“我在认真聆听，请讲。”\n\n“四天后，在德黑兰，陛下将与伊朗国王会面。你的任务是从使馆安保队伍中挑选两到三人，确保陛下的安全。你也知道，伊朗局势依然不稳。”\n\n“是的，亚历山大·利沃维奇，我知道。好的，我会安排三人组成贴身保卫小组。”\n\n“很好。很快就会有人来使馆，他会跟你当面交代，并把这些人带走。”\n\n“明白，亚历山大·利沃维奇。”\n\n说完，鲁斯兰·贝利亚科夫挂断电话，喝完茶，然后去使馆工作人员中挑选保卫小组成员。"
 MAR_forpol.8.a: "严肃的人做重要的事。"
 MAR_forpol.9.t: "无休无止的战争"
 MAR_forpol.9.d: "亚历山大·米哈伊洛维奇·谢甫琴科还记得在特维尔附近“苏沃洛夫”行动中作为一名狙击手在游击队作战的日子，后来加入了西俄罗斯革命阵线的军队。但随着军队的溃败，他逃到了别列兹尼基。现在，亚历山大作为志愿者被派往伊朗。在那里，他仿佛回到了当初在游击队作战的岁月，只是这一次，崇山峻岭成为了谢甫琴科和他的小队躲避敌人的天然屏障。\n\n然而，巴列维王朝最终还是战败了，撤退的命令传了下来。亚历山大却不愿意离开这片土地，他找到他的连长，罗曼·费奥多罗维奇·卡普斯京，表明了自己的心迹。\n\n走进指挥部，只见卡普斯京连长正坐在桌边，一边抽着烟，一边阅读着最新一期的《青年俄罗斯》。亚历山大敬了个礼，连长示意他在桌旁坐下。\n\n“那么，亚历山大·米哈伊洛维奇，你找我有什么事吗？”\n\n“罗曼·费奥多罗维奇，我想请求您一件事。我想留在这片土地上，继续与敌人战斗。”\n\n听到这番话，罗曼·卡普斯京被香烟的烟雾呛了一口。\n\n“亚历山大·米哈伊洛维奇，你在说什么呢？我们接到的命令是撤离，我们已经输了。”\n\n“是的，对于普通的士兵来说，这场战斗是输了。但对我来说，作为一个老兵，战斗还没有结束。您明白我的意思吗，罗曼·费奥多罗维奇？我仍然记得俄罗斯统一、权力掌握在罗曼诺夫王朝手中的日子。我19岁就参加了第一次世界大战，我在国内战争期间加入了红军，我在‘苏沃洛夫’行动中成为了一名游击队员。对我来说，人生就是一场无尽的战争。”\n\n“是的，我了解你的服役记录。像你这样的人现在已经不多了。”\n\n“所以，我请求您把我留下。我的家人被德国刽子手杀害了，我现在已经没有什么可以失去的了。”\n\n罗曼·卡普斯京深吸一口气，对眼前的士兵说道：“我不知道在这种情况下该怎么做。”\n\n“按你的想法去做吧，我的任务就是提出请求。”\n\n“好吧。我会给你准备一些补给。我听说国王军队的残余部队正在集结，准备组建破坏小组，也许他们会收留你。”\n\n“好的。我天亮就走。帮我向上级报告我失踪了，反正也没有人在等着我回去。”\n\n“像你这样的人，是不会被人遗忘的。祝你好运，战士。”\n\n黎明时分，亚历山大·谢甫琴科带着补给，消失在茫茫群山中。罗曼·卡普斯京坐在飞机上，久久不能忘怀那个为了心中信仰留下来战斗的孤独狙击手的身影。"
 MAR_forpol.9.a: "因为对他来说，战争伴随了他的一生。"
 MAR_IR_CW_ACTIVE: "伊朗内战仍在继续。"
 MAR_IRCW_arming_IRC: "我们正在直接武装伊朗的宪政派。"
 MAR_IRCW_arming_IRA: "我们正在直接武装伊朗的共产党人。"
 MAR_Kosygin_Iranian_Civil_War_category_desc:0 "穆罕默德·礼萨·巴列维政府终于倒台了。自1953年以来一直奉行完全亲德政策的一党独裁的巴列维政权在统治者死后几天内就垮台了。现在，我们必须向那些与国王的残余势力作战的军队提供支持，这些残余势力由他的妻子法拉·巴列维领导，他们得到了德国人的支持。这个地区唯一对我们有点忠诚的政权是伊朗人民党的代表，虽然他们主张建设布哈林模式的社会主义，但是他们是我们唯一可以支持的。"
 MAR_forpol.2.t: "新地位"
 MAR_forpol.2.d: "雅罗斯拉夫·加夫里洛夫坐在司令部里，一边吞云吐雾，一边翻阅着报纸上敌军全线向共产党政权投降的消息。这位雅罗斯拉夫·亚历山德罗维奇，原本不过是个在克格勃里默默无闻的普通干员，平日里干的也就是些打击犯罪分子的活计。可谁也没料到，几年光景，他竟一路晋升至上校军衔。不久前，他还受命协调攻占伊朗旧都德黑兰，并在城内展开大规模搜捕，追剿反革命残余势力。任务完成得漂漂亮亮，一枚二级乔治十字勋章便是最好的嘉奖。如今，他正等待上级下达下一步行动指令，突然，他的老同事，伊朗社会主义联邦共和国克格勃第一人身安全保护部门的负责人——格里戈里·维克托罗维奇·阿列克谢耶夫少将，大步走进了司令部。雅罗斯拉夫掐灭了烟头，敬了个军礼，随即请同事在桌边坐下。\n\n“那么，格里戈里·维克托罗维奇，这次要派我去哪儿？”\n\n“唔，雅罗斯拉夫·亚历山德罗维奇，我在大不里士收到了你在德黑兰的工作成果报告，上头很满意。领导层甚至下令授予你伊朗社会主义联邦共和国红旗勋章，以表彰你的特殊贡献。”\n\n“听到这个我很高兴。不过，我接下来要做什么呢？”\n\n“是这样，我国领导层认为，与友邦新政府建立良好关系至关重要。因此，根据我军驻伊朗部队指挥官的决定，你将被任命为新国家安全保障负责人。你将直接指挥国内安全部队的各个营级单位，负责搜捕并逮捕伊斯兰主义分子、民主派人士以及其他一切敌视新政权的敌对分子。”\n\n“也就是说，你们想让我当伊朗的警察总长？”\n\n“你可以这么理解。记住，这个任命已经板上钉钉了，不容推辞。”\n\n“那么，我什么时候正式上任？”\n\n“我刚拿到这份任命书的副本，你自己看看吧。”\n\n阿列克谢耶夫从大衣内袋掏出一份文件，递给加夫里洛夫，让他仔细过目。看完后，雅罗斯拉夫向阿列克谢耶夫抛出了一个问题：\n\n“格里戈里·维克托罗维奇，我得在这里待多久？”\n\n“暂时还不好说。但我估计，应该不会超过两三个月。”\n\n“为什么是两三个月？”\n\n“你也知道，我的部下负责埃斯坎达里的安保工作。据我所知，他很快就会宣布新政府的组成名单。但眼下，他希望能借助克格勃的专业人才，比如像你这样的人，先在伊朗境内建立初步的秩序。我相信，等伊朗社会主义联邦共和国政府正式成立后，你就可以回国了。期待很快能再见到你，祝你在新岗位上一切顺利。”\n\n说完，阿列克谢耶夫便离开了司令部。加夫里洛夫重新读了一遍任命书，将它放在桌上，然后继续埋头看起报纸来。"
 MAR_forpol.2.a: "他等待着能够献身于工作的那一刻。"
 MAR_forpol.3.t: "败与胜"
 MAR_forpol.3.d: "克格勃少校阿列克谢·弗拉基米罗维奇·沃尔科夫滞留首都，心中满是悲愤与哀伤。他清楚地记得，当时作为驻扎大不里士的克格勃营指挥官，他接到了上级命令，要求所有部队撤离伊朗社会主义联邦共和国，原因竟是军事特遣队作战不力。他更记得，战争伊始，他满怀憧憬，期盼着革命力量在伊朗凯旋。然而，撤退命令一下，所有梦想皆化为泡影。他曾如此渴望这场战争的胜利，最终却落得一地鸡毛。他和许多退伍老兵一样，心中只有一个疑问：“我们究竟为何要卷入这场战争？我们抛洒热血，究竟是为了换取什么从未兑现的利益？”一阵敲门声打断了他的思绪。他打开门，只见一个身穿灰色大衣、头戴帽子、鼻梁上架着一副硕大镜片“提夏达”眼镜的男人站在门口。来者正是克格勃少将格里戈里·维克托罗维奇·阿列克谢耶夫。他曾在伊朗任职，负责伊朗社会主义联邦共和国高官的安全保卫工作。阿列克谢和他打交道的次数不多，但为数不多的几次接触中，两人都以良好的同事和战友身份相处。\n\n“格里戈里·维克托罗维奇，您怎么来了？”\n\n“就是想来看看老同事。也想跟你聊聊。”\n\n“哦，既然来了，那就快请进吧。”\n\n沃尔科夫把客人领进厨房，为他斟上茶，也给自己倒了一杯，随即开始了对话。\n\n“那么，格里戈里·维克托罗维奇，您想跟我聊些什么？只是闲聊吗？”\n\n“也可以这么说。”\n\n“我还在为从伊朗撤军的事耿耿于怀。毕竟，我们对在别国领土上作战毫无准备。”\n\n“是啊。我自己也想不明白。但我想，领导层应该比我们更清楚局势，知道怎样做才是最好的选择。”\n\n“但问题的关键不在这里。这次撤军会让全世界看到，我们的军队打了败仗。我们没能战胜敌人。”\n\n“阿列克谢，你知道，我既在布哈林领导下的苏联军队服役过，也在西俄罗斯革命阵线的军队里效力，还参与过‘苏沃洛夫’行动。我亲手执行过清除反革命分子的任务。这么多年过去，我明白了一个道理：无论早晚，每个人都会尝到失败的滋味，都会经历这种不愉快的感觉。没有谁是战无不胜的。”\n\n“你的意思是，这次失败根本算不了什么？”\n\n“如果从政治角度来看，确实如此。有时候，你可以选择撤退，但同时也意味着，你要放弃重返失地的念头。”\n\n他们天南海北地聊了许久，直到夜幕降临。告别时，阿列克谢·沃尔科夫独自坐在厨房里，反复琢磨着阿列克谢耶夫的话，最终得出一个结论：为了一次失败而长时间沉浸在悲伤中毫无意义，因为未来的征途上，他们还会遭遇更多敌人。送走阿列克谢耶夫后，沃尔科夫坐在阳台上，喃喃自语道："
 MAR_forpol.3.a: "我们输掉的只是一场战役，不是整个战争。"
