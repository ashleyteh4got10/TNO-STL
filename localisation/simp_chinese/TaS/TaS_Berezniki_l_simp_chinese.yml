 MAR_Nina_Krivosheina_eco_desc:0 "§Y经济部长\n贵族保守主义§!"
 MAR_Dmitri_Alexandrovich_for:0 "德米特里·亚历山德罗维奇"
 MAR_Dmitri_Alexandrovich_for_desc:0 "§Y外交部长\n贵族保守主义§!"
 MAR_Sergey_Belozerski_sec:0 "谢尔盖·别洛泽尔斯基"
 MAR_Sergey_Belozerski_sec_desc:0 "§Y国防与安全部长\n青年俄罗斯专制主义§!\n--------------\n谢尔盖·谢尔盖耶维奇·别洛泽尔斯基，出生于一个历史悠久且显赫的家族，他的祖先骄傲地延续自留里克王朝。在1911年，他加入帝国侍卫队，于1914年毕业并荣获“生命卫士”骑兵团团长的军衔。别洛泽尔斯基还参与了第一次世界大战，并在战争结束时担任了参谋长，领导着他的骑兵团第二师。\n\n内战爆发时，他加入了尤登尼奇将军领导的白军。白军战败后，他流亡英国，最终在法国找到了庇护。战争爆发后，谢尔盖·谢尔盖耶维奇再度前往英国，在那里加入了皇家空军，并在血战之后与国家军队的残余力量一同撤退到美国。在美国陆军中继续服役后，他于20世纪50年代初以少校的军衔退役。\n\n西俄罗斯战争爆发时，这位留里克王朝的后裔被美国中央情报局招募，作为“太阳”行动的军事专家。随后，他与青年俄罗斯联盟一同前往俄罗斯，在卡津别克的领导下担任国防部长。\n\n尽管别洛泽尔斯基身负过去的荣耀与伤痕，他渴望为自己的祖国贡献力量。然而，只有时间才能揭示他将如何实现这一目标。"
 MAR_Alexey_Kosygin_eco:0 "阿列克谢·柯西金"
 MAR_Alexey_Kosygin_eco_desc:0 "§Y经济部长\n青年俄罗斯专制主义§!\n--------------\n人们对他的出身知之甚少，但可以肯定的是，他拥有敏锐的头脑。早在1939年，他就已经担任了轻工业人民委员会主席，并参与了开发西伯利亚的重要项目。随着战争的爆发，他参与了向西伯利亚疏散国家财产的重要任务。\n\n然而，随着战争的失败，他被迫加入西俄罗斯革命阵线，在经济部门担任多种职务，努力为改善民众的生活条件而奋斗。与此同时，他还秘密参与了卧底工作，希望有朝一日能够领导这个组织。\n\n但随着西俄战争的爆发，他投身于军队的补给工作。由于内部起义和装备的落后，补给工作遭遇了严重问题。在前线遭遇失败后，他被指控破坏了部队的战斗力，并被判处死刑。然而，他凭借自己的人脉和机智设法逃脱。之后，他被青年俄罗斯联盟抓获，并在狱中被卡津别克招募。这样，一位共产主义的部长落入了通敌者和前白军的巢穴中。这种命运的转折实在是让人感到不可思议。"
 MAR_Vladimir_Gil_sec:0 "弗拉基米尔·吉尔"
 MAR_Vladimir_Gil_sec_desc:0 "§Y国防与安全部长\n青年俄罗斯专制主义§!\n--------------\n他的名字是背叛和机会主义的代名词。早在布哈林时代，他已经在军队中晋升为上校，并对马克思主义的理想保持忠诚。然而，战争爆发后，他的命运发生了戏剧性的转变。他被俘后投靠了德军，成为了希姆莱的走狗，在奥斯特兰地区展开了残酷的屠杀。\n\n战争爆发前，他被调至莫斯科，在那里与坦波夫的工业家合作，保护他们免受游击队的侵害。但随着西俄战争的爆发，他又一次变节，加入了红军，将所有德国军官都交给了红军。在图哈切夫斯基的麾下，他成为了一个师的师长。尽管背负着过去的阴影，他还是与图哈切夫斯基找到了共同的语言。然而，西俄战争的失败使他再次决定背叛自己的保护者，出于对自己过去的恐惧。他带领一些忠诚的士兵在夜间逃离，很快投奔了青年俄罗斯联盟，为他们提供服务。\n\n只有时间能够揭示他是否会继续保持忠诚，或者再一次转变立场，背叛他现在的主人。"
 MAR_Vladimir_Gil_hog:0 "弗拉基米尔·吉尔"
 MAR_Vladimir_Gil_hog_desc:0 "§Y首相\n君主社会主义§!\n--------------\n弗拉基米尔，出生于一个白俄罗斯工人家庭，度过了一个平静的童年。1926年，他的命运开始改变，他考入了一所骑兵学校，随后又进入了著名的伏龙芝军事学院。在军事生涯中，他的军衔稳步晋升，最终在战争前夕成为第229步兵师的参谋长。\n\n然而，战争彻底改变了他的生活轨迹。与他的家乡人民不同，正如他自己所说，他“不得不改变立场”。西俄罗斯战争爆发前，他是一个突击队的成员，但随着战争的爆发，他背叛了德国同伙。之后，他投身于红军，并与图哈切夫斯基结下了深厚的友谊。战线崩溃后，他来到别列兹尼基，加入了当地的武装力量。在多年的军旅生涯中，他深受当地意识形态的影响。凭借他的功绩，他在仕途上一路攀升，最终成为克格勃首脑和国家的首相。\n\n别洛泽尔斯基和卡津别克遇难后，国家局势发生了剧变。从此刻起，弗拉基米尔·吉尔将掌握决策权，他将以军人般的严肃和强硬的态度来行事。\n\n任何篡位者都不会逍遥法外。"
 MAR_Alexander_Kazembek_hog:0 "亚历山大·卡津别克"
 MAR_Alexander_Kazembek_hog_desc:0 "§Y首相\n青年俄罗斯专制主义§!"
 MAR_Pyotr_Demichev_for:0 "彼得·德米切夫"
 MAR_Pyotr_Demichev_for_desc:0 "§Y外交部长\n青年俄罗斯专制主义§!\n--------------\n彼得的命运并不令人羡慕。他出生在一个乡村的工人家庭。他先后在一所技术学校和一所学院学习。与德国的战争打断了他在学院继续深造的计划。战斗期间，他在红军队伍中服役，撤退到了德国佬建立的新边界线之外。在那里，他得知了许多熟人、朋友和父母的死讯。他在西俄罗斯流浪了很长时间，最后来到别列兹尼基。\n\n起初，他不得不在恶劣的条件下工作。但他凭着自己的毅力和聪明才智，逐渐晋升。最后，彼得当上了外交部长。他已经准备好迎接未来的挑战，因为他知道自己在生活中积累的经验一定会派上用场。"
 MAR_Nikolai_Maslennikov_eco:0 "尼古拉·马斯连尼科夫"
 MAR_Nikolai_Maslennikov_eco_desc:0 "§Y经济部长\n君主社会主义§!\n--------------\n尼古拉·马斯连尼科夫的故事是无数普通俄罗斯人共同的写照——一段平凡而艰难的生活历程。尼古拉出生于一个工薪家庭，在学业上表现出色。1939年，他获得了进入高尔基工业大学学习的机会。1941年，他怀着对国家的热爱自愿加入前线，而当部队向东撤退后，他在别列兹尼基找到了新的家园。\n\n他深厚的知识底蕴和对祖国的深情，让他成为了时任经济部长阿列克谢·柯西金的得力助手。正是他们两人的合作，推动了该地区经济的蓬勃发展。当柯西金离任后，尼古拉无疑成为了经济部长的最佳人选。他致力于继续实施其导师的政策，并且事实已经证明，这些政策是正确且有效的。"
 MAR_Igor_Shafarevich_eco:0 "伊戈尔·沙法列维奇"
 MAR_Igor_Shafarevich_eco_desc:0 "§Y经济部长\n青年俄罗斯专制主义§!"
 MAR_Anatoly_Vavilov_sec:0 "阿纳托利·瓦维洛夫"
 MAR_Anatoly_Vavilov_sec_desc:0 "§Y国防与安全部长\n君主社会主义§!\n--------------\n阿纳托利·瓦维洛夫，可以简洁地形容为爱国主义的化身。在他的学生时代，他对意识形态的热情和对社会运动的参与，如朗诵自己创作的诗歌，已经显露出他的爱国热情。他由衷地崇拜俄罗斯的英雄指挥官，并渴望能为俄罗斯效力，成就一番事业。他对祖国的忠诚和愿望似乎无穷无尽。在战争的最后阶段，阿纳托利设法加入了德军，但他甚至没有实际参与战斗。在他受训的时候，红军正在撤退。\n\n他感到自己未能在困难时刻拯救祖国，并因此感到沮丧。他认为自己没有保卫祖国，因此决定投身军旅。对他来说，这是一种赎罪的方式，因为他没能保护那些在战争中牺牲的同胞。在新的世界里，他感到孤独。尽管如此，阿纳托利还是在西俄的田野上接受了军事训练，并在西俄战争中运用了他的战略知识。正是他，这位与部下关系密切的年轻将军，领导了红军的一次成功进攻。尽管苏联在前线的失败削弱了他的力量，但他并未被击倒。随着国家的解体，他被安置在别列兹尼基，在那里他与昔日的战友进行了激烈的斗争，而这些战友最终成为了对立面的战士。由于他对别列兹尼基的贡献，他被提拔为了元帅。\n\n多年来，阿纳托利·瓦维洛夫证明了自己是俄罗斯忠诚的儿子，他的事迹激励了在首都军事院校学习他传记的年轻士兵和军官。在恐怖袭击和卡津别克去世后，他当上了国防部长。在这个岗位上，他像许多著名的俄罗斯指挥官和将军一样，致力于保卫他的祖国——俄罗斯。"
 RUS_MAR_West_Russia_desc:0 "§Y经过长期的战争和灾难，我们终于可以说，青年俄罗斯人和他们的思想在西俄罗斯取得了胜利。§!"
 RUS_MAR_west_russia:0 "§Y建立西俄罗斯人民公国§!"
 MAR_POLITICS_RESOLVED:0 "缙绅会议选出了一位沙皇"
 MAR_forced_syncretisism:0 "新融合主义之崛起"
 MAR_forced_syncretisism_desc:0 "二十年前，青年俄罗斯联盟之解散，致使“沙皇与苏维埃”之理念陷入长久停滞，融合主义思想不为民众所熟知，充其量仅流于纸上谈兵。为扭转此等局面，亟需深入完善理论，并付诸实践。"
 MAR_regent_without_tsar_1:0 "无君之摄政"
 MAR_regent_without_tsar_1_desc:0 "别列兹尼基总督亚历山大·卡津别克已自封为摄政王，然关键之问在于，其所辅佐之君主何在？弗拉基米尔三世稳坐维亚特卡王座，并无需任何襄助，但在别列兹尼基，众人皆心知肚明，弗拉基米尔并非他们心目中的沙皇。因此，该总督辖区目前正处于悬而未决之境地，若亚历山大·利沃维奇希冀拯救别列兹尼基乃至整个俄罗斯，则他不久便须将权力移交予一位新的沙皇。"
 MAR_regent_without_tsar_2:0 "无君之摄政"
 MAR_regent_without_tsar_2_desc:0 "别列兹尼基总督亚历山大·卡津别克已自封为摄政王，然关键之问在于，其所辅佐之君主何在？弗拉基米尔三世稳坐维亚特卡王座，并无需任何襄助，但在别列兹尼基，众人皆心知肚明，弗拉基米尔并非他们心目中的沙皇。因此，该总督辖区目前正处于悬而未决之境地，若亚历山大·利沃维奇希冀拯救别列兹尼基乃至整个俄罗斯，则他不久便须将权力移交予一位新的沙皇。"
 MAR_regent_without_tsar_3:0 "无君之摄政"
 MAR_regent_without_tsar_3_desc:0 "别列兹尼基总督亚历山大·卡津别克已自封为摄政王，然关键之问在于，其所辅佐之君主何在？弗拉基米尔三世稳坐维亚特卡王座，并无需任何襄助，但在别列兹尼基，众人皆心知肚明，弗拉基米尔并非他们心目中的沙皇。因此，该总督辖区目前正处于悬而未决之境地，若亚历山大·利沃维奇希冀拯救别列兹尼基乃至整个俄罗斯，则他不久便须将权力移交予一位新的沙皇。"
 MAR_oldfashion_army_1:0 "不稳定的军队"
 MAR_oldfashion_army_1_desc:0 "摄政府麾下的军队状况堪忧，它不过是一锅大杂烩，由溃散的西俄罗斯革命阵线残部以及形形色色的白俄流亡者勉强拼凑而成。司令部对于军事学说举棋不定，迟迟无法定夺，其结果便是，这支军队在保卫国家边陲的重任面前显得捉襟见肘。"
 MAR_oldfashion_army_2:0 "不稳定的军队"
 MAR_oldfashion_army_2_desc:0 "摄政府麾下的军队状况堪忧，它不过是一锅大杂烩，由溃散的西俄罗斯革命阵线残部以及形形色色的白俄流亡者勉强拼凑而成。司令部对于军事学说举棋不定，迟迟无法定夺，其结果便是，这支军队在保卫国家边陲的重任面前显得捉襟见肘。"
 MAR_military_instructors_of_vyatka:0 "帝国军事顾问"
 MAR_direct_influence_of_vyatka:0 "维亚特卡在军队中的影响"
 MAR_military_instructors_of_vyatka_desc:0 "我们试图将维亚特卡的枷锁从军队身上卸除，然而，这场努力最终以惨败告终。皇室警卫，抑或是其他神秘力量，展现出了更为强大的实力，令我们遭受了迎头痛击。弗拉基米尔向我们下了最后通牒：要么让教官们掌握更大的权力，要么就让别列兹尼基领教维亚特卡铁拳的威力。其实早在我们抉择之前，弗拉基米尔早已替我们做出了决定，我们别无选择，只能羞愧地俯首称臣。如今，我们的军队已然沦为了维亚特卡试验其新技术的演武场，这几乎断送了我们成功改革军队架构的希望。"
 MAR_renewed_army:0 "“新”模式之军"
 MAR_renewed_army_desc:0 "历经千辛万苦，我们的军队终于摆脱了旧日之阴霾。苏维埃与沙皇时代遗留的窠臼已成为往昔，如今的别列兹尼基拥有一支崭新模式的军队，一支属于新时代的军队。我们的军队顺应时势完成了现代化变革，我们拥有了先进的机关枪、焕然一新的军装，以及全新的军事思维，足以粉碎这个年轻国家的一切敌人。"
 MAR_helping_people:0 "帮助工人"
 MAR_helping_people_desc:0 "工人们决不能丧失斗志，我们必须支持他们的斗志，掀起一场提高积极性、进而提高生产率的运动。"
 MAR_komissars_in_army:0 "皇家政委"
 MAR_komissars_in_army_desc:0 "政委的职责在于向所有普通士兵阐明，我们究竟为何而战，为了怎样的未来而战。继而鼓舞士兵们奋勇冲锋陷阵，或是在抵御外敌之际殊死奋战。"
 MAR_peoples_syncretisism:0 "大众同构"
 MAR_peoples_syncretisism_desc:0 "何谓融合主义？看似简单的问题，对于饱学之士而言，似乎不值一提。然而，大多数民众甚至对青年俄罗斯主义及其基本理念一无所知。如今，得益于柯西金的殚精竭虑及其谋划的付诸实施，任何人皆能明了其意，并能在别列兹尼基的日常生活中举出实例。"
 MAR_prole_syncretisism:0 "无产阶级融合主义"
 MAR_prole_syncretisism_desc:0 "在别列兹尼基，无产阶级乃是立国之本，尽管他们对总督辖区的存续至关重要，却曾一度缺乏应有的权利与优待。如今，得益于柯西金-别克计划，我们引入了“无产阶级共识”这一概念，其核心要义在于由国家保障工人们的权益，与此同时，亦仰赖他们自身的力量，而非他人的施舍，在社会阶梯上不断攀升。"
 MAR_souverinity_fail_1:0 "削弱主权"
 MAR_souverinity_fail_1_desc:0 ""
 MAR_souverinity_fail_2:0 "削弱主权"
 MAR_souverinity_fail_2_desc:0 ""
 MAR_okhranka_leftovers:0 "残余的保卫部势力"
 MAR_civil_economy:0 "关注民用经济"
 MAR_war_economy:0 "关注军用经济"
 MAR_WRS_mladorossi_propaganda: "青年俄罗斯联盟的宣传机器"
 MAR_Kosygin_peoples_milita:0 "人民卫队"
 MAR_Kosygin_peoples_milita_desc:0 "我们创建的人民政权使我们能够更有效地打击国内的犯罪活动。此外，由于有了人民卫队，在必要的情况下，我们可以将其用于保卫国家。然而，由于其群众性，在这种情况下，我们的部队不是与经验丰富的战士打交道，而是与民兵打交道，而民兵的战斗技能水平无法与正规的常规部队相提并论。"
 MAR_Kosygin_martial_law:0 "戒严令"
 MAR_Kosygin_martial_law_desc:0 "由于城市中军队的存在，犯罪率和被宝座教派分子袭击的几率大幅下降。正因为如此，我们得以在城市中重获权力，现在我们可以朝着我们最需要的方向推行我们的政策。"
 MAR_Kosygin_WSB_sabotage:0 "西俄特工的破坏活动"
 MAR_Kosygin_WSB_sabotage_desc:0 "位于西俄罗斯的临近政权对我们采取了一系列破坏以及其他的颠覆行动。这对我们的作战能力造成了小幅度打击。"
 MAR_Kosygin_global_coverage:0 "影响范围"
 MAR_Kosygin_global_coverage_desc:0 "我国的影响力与日俱增，我国人民也深知为其立足之地而奋斗的必要性。正因如此，在这个残酷的世界，我国政府在政治博弈中拥有了更多机会和空间。\n\n我们寸土不让，唯有我们如斗牛犬般紧咬不放的姿态，才能在外交斡旋中不失寸土。否则，如果我们不够强硬…"
 MAR_Kosygin_kaz_legions:0 "哈萨克军团"
 MAR_Kosygin_kaz_legions_desc:0 "哈萨克族是一个忠诚、坚强的民族，受到领导哈萨克军团的各军官的尊重。在自相残杀的战争中，这些品质似乎丧失殆尽，再也无法回到潇洒游牧民族的血液中。但我们的经验表明，这种说法是错误的。哈萨克战士依然强大，无愧于整个俄罗斯帝国最优秀的战士之一。"
 MAR_start_from_scratch:0 "自无而始"
 MAR_start_from_scratch_desc:0 "在别列兹尼基，每天都与前日别无二致。轰炸、死亡、破坏，在维亚特卡的沙皇弗拉基米尔面前卑躬屈膝。当地居民并不太喜欢通敌者沙皇的走卒，军队仍滞留在过去，而弗拉基米尔正准备扼住自由省长的咽喉，终结青年俄罗斯之梦。但这绝无可能。是时候重新开始了。"
 MAR_the_last_convoy:0 "最后的车队"
 MAR_the_last_convoy_desc:0 "长期以来，来自维亚特卡的车队一直是我们获取设备和必需医疗用品的主要途径。但每次随着一批又一批设备的到来，我们都会意识到，别列兹尼基永远不会变得更强大，他们的命运只能是卡马河对岸王国的另一个附属品。我们没有机会取消这次护送，但这一定是最后一次。"
 MAR_start_of_the_hunt:0 "狩猎开始"
 MAR_start_of_the_hunt_desc:0 "目前，别列兹尼基只不过是维亚特卡沙皇政府的一个附属机构。我们甚至无法对弗拉基米尔三世及其内阁部长们的政策施加丝毫影响。如果这种趋势继续下去，青年俄罗斯运动将被扼杀在萌芽状态。我们要么被我们政权的敌人消灭，要么溶入沙皇国家的政治生活。\n\n是时候做出艰难但唯一正确的决定了——断绝维亚特卡和我们之间的关系。"
 MAR_fuck_vlad_tt:0 "我们必须自谋§Y出路§!，摆脱§R弗拉基米尔三世§!的桎梏"
 MAR_audience_with_the_magister:0 "觐见团长"
 MAR_audience_with_the_magister_desc:0 "摆脱了对维亚特卡的依赖后，我们发现自己陷入了困境之中。目前，别列兹尼基并不具备强大的工业基础或充足的人力资源来自卫，因此，寻找盟友对我们来说至关重要。\n\n政府中有人提议尝试与我们北方的圣乔治骑士团建立联系。或许他们并非最可靠的盟友，但我们别无选择。"
 MAR_antipin_dont_be_stupid_tt:0 "也许这一次，安季平会听从理性的声音"
 MAR_road_to_prosperity:0 "通往繁荣之路"
 MAR_road_to_prosperity_desc:0 "当别列兹尼基初次出现在维亚特卡官僚们的地图之上时，这个新生国家的经济命脉完全维系于其宗主国。我们依赖那些互惠条约下拨付的微薄资源，勉强维系着饥饿的生存。然而，随着卡津别克的政策转向以及与沙皇的日益疏远，一道绳索已然紧紧勒住了我们的咽喉，随时可能将我们置于死地。\n\n然而，曙光乍现，似乎有一位救星即将出现于地平线上。阿列克谢·柯西金，作为经济领域的翘楚，对这个总督辖区而言乃是不可或缺的栋梁之才。他在这片弹丸之地看到了发展的潜能，这无疑是巨大的鼓舞。他被任命为经济部长，此举充分彰显了他的专业素养以及引领别列兹尼基走向繁荣的雄心壮志。"
 MAR_doings_aganist_peoples_tt:0 "§Ү经济复苏需要§!§R有争议的措施、§!§Y然而，§!§G这就是繁荣的代价！"
 MAR_thru_blood:0 "以血为引"
 MAR_thru_blood_desc:0 "别列兹尼基的经济潜力深藏于地下，这也带来了某些难题。过去数年，尽管当局有所关注，但投入矿业的时间却少得可怜，如同犯罪一般。这一疏忽可能已经让总督辖区错失了巨大的工业增长机遇，而如今，柯西金和他的专家团队不得不迎头赶上。\n这个问题必须尽快解决。一切可用资源都将用于增加矿井数量。然而，一个残酷的问题随之而来：谁来挖掘这些矿井？自然，我们需要工人，但仅凭工人，我们无法维持所需的速度，因此，我们不得不动用囚犯的双手。况且，如果一些渣滓被埋在瓦砾之下，也不会令人惋惜，而熟练的工人则能保全性命……"
 MAR_and_thru_sweat:0 "以汗为证"
 MAR_and_thru_sweat_desc:0 "别列兹尼基的工业化进程已经启动，这是一个劳动密集型的过程，需要投入大量的资金、时间和精力。但柯西金同志坚信，所有资源都不会被浪费，最终的成果将超出所有人的预期。然而，问题依然存在。时间紧迫，维亚特卡对卡津别克的行为越来越不耐烦，尽管规模不大，但来自盐等商品销售的利润已经消失。因此，我们必须动用一切力量来弥补损失。\n这些弥补的力量都集中在农民身上，他们将为我们羽翼未丰的工业提供食物。此外，为了彻底摆脱对维亚特卡的依赖，我们必须将农业产量提高数倍，这将需要所有可用的人力资源。但一切都是为了人民的福祉，这才是最重要的。"
 MAR_to_take_what_is_ours:0 "夺回属于我们的一切"
 MAR_to_take_what_is_ours_desc:0 "在西俄罗斯战争尘埃落定后，弗拉基米尔三世将广袤的领土收入囊中，然而凭他一己之力根本无法控制这些新征服的地区。为此，他扶植了一系列半傀儡的附庸政权，一方面替他管理这些地区，另一方面通过各种经济特许权以及派遣军事顾问牢牢地把控着这些仆从，令其无法摆脱他的掌控。\n\n但是，随着时间的推移，维亚特卡的统治危机日益加深，这反倒使得弗拉基米尔三世对别列兹尼基的控制出现了松动。现在，我们终于等到了夺回自己命运的良机。首先，我们必须清算那些无偿掠夺我们资源的、臭名昭著的特许经营公司。我们将切断对维亚特卡方面的资源输送，将资源还给那些真正付出劳动的人。不过，这样做我们也将付出不小的代价..."
 MAR_check_vyatka_vibe_tt:0 "§Y用这招，我们可以直接对付§!§G维亚特卡§!。§Y但如果他们的间谍联络程度§!§R太高§!，§Y那就能把我们直接置于§!§R死地。§!"
 MAR_we_and_the_proletariat:0 "我们与无产阶级"
 MAR_we_and_the_proletariat_desc:0 "经济改革在别列兹尼基酝酿已久，但直到现在政府才开始积极行动。有阿列克谢·柯西金这样的人物在我们身边，我们可能不会担心改革的结果，因为它们肯定会是积极的。但是，柯西金的计划本身却引起了卡津别克的质疑。\n在几次积极的讨论中，大家决定修改计划，即积极发展为公民提供的社会服务，这将促使他们更加努力地为祖国工作。卡津别克并不那么乐观，但他还是推动了这些变化，现在他主要关注的是提高工业能力和工人的生活水平，而不是社会的所有部门。当然，这可能会引起一些公众反应，但国家的福利仍必须是重中之重。"
 MAR_the_new_equipment:0 "新型设备"
 MAR_the_new_equipment_desc:0 "不客气地说，别列兹尼基的工业综合体已经过时。政府本身并不认为它是一个重要的工业中心，因此苏联政府把它推到了其他更重要的城市一边。因此，我们的设备目前处于令人遗憾的状态。\n\n但我们需要尽快解决这个问题。根据柯西金-卡津别克计划（即修改后的道路），我们需要划拨大量资金来恢复我们工业的盈利能力。为此，我们将购买先进的机器，以确保恢复我们的工业实力！"
 MAR_rabfaki:0 "复兴工人高等学校"
 MAR_rabfaki_desc:0 "尽管眼下的我们急需工厂里的每一个人手，但我们也不能忽视这些工人的资质。一群狂热却愚昧的工人，并非填充我们工厂和矿山的最佳选择。因此，我们迫切需要想办法解决这个棘手的问题。俗话说，以史为鉴，可以知兴替，我们应当带着这个问题，回溯过往，寻找答案。\n\n最终的解决方案既简单又巧妙。早在20世纪30年代的苏联，就有一种名为“工人高等学校”的机构，它们是大学的附属部门，专注于将集体农庄庄员和中等技术工人的经验进行转移。恢复这种机构并对其理念进行部分调整，将成功解决这个难题，而它正是我们完成改革道路上的绊脚石之一。"
 MAR_peoples_love:0 "人民之爱"
 MAR_peoples_love_desc:0 "最后，卡津别克亲自批准了柯西金的工业改革计划，未作大的改动。这是柯西金及其同伙的巨大胜利，他们在政府中拥有广泛的影响力。但最重要的是，现在该计划可以付诸实施，并通过柯西金本人认为在这种情况下最正确的方法使别列兹尼基摆脱困境。\n\n该计划本身涉及通过提高生活水平和国家社会计划来实现长期增长。这将鼓励人们更好、更有效地工作，从而加强我们的工业。此外，由于生活条件的改善，该省人民的不满情绪以及因此而产生的对政府的反叛也会大大减少。"
 MAR_right_to_future:0 "通向未来"
 MAR_right_to_future_desc:0 "无论这听上去多么荒诞不经，但孩子们——确实就是我们的未来。关于这一点，哪怕仅仅是想到他们构成了我们未来几十年最为宝贵的人力资源，也无人能够否认。由此得出的结论是，我们应当对教育体系进行大刀阔斧的改革，并在这一领域投入海量的资金。虽然这一举措恐怕需要很长时间才能见到成效，但其所奠定的基础将会让我们受益无穷。\n\n首先，我们必须对教育的最初阶段——也就是小学和初中教育进行大刀阔斧的改革。为了鼓励全民积极参与到教育中来，并提高民众的教育水平，小学和初中教育将会实行免费制度。这样一来，即便是在我们这个小小的地方，几乎每一个人都能获得一些基本的知识。除此之外，我们还必须认真审视一下长期以来依赖自我维持的高等教育体系。为了使各阶段的教育水平得到飞速提升，我们将会启动一系列补贴计划。这样一来，等到我们垂垂老矣时，至少能够安享晚年，不必为无人赡养而担忧了。"
 MAR_alongside_with_men:0 "与男性并驾齐驱"
 MAR_alongside_with_men_desc:0 "父权制是一种以男性为绝对主导的社会形态。在父权体制下，女性被贬低为附庸和玩物，她们的权利被肆意践踏，其存在的意义似乎只是为了依附于男性而生存。几乎所有的国家都沦为了这种体制的牺牲品，而且看起来，它们似乎也无意改变这一切。然而，我们则绝不会向这不公的一切低头。\n\n为了执行柯西金同志的计划，我们几乎动用了所有的人力和物力储备，但即便如此也依然捉襟见肘。为了不让改革的步伐陷入停滞，我们必须发动广大女性也参与到劳动和国家建设中来。此外，这一举措还将为我们赢得自由派人士的支持，当然，也会不可避免地招致政府中那些顽固保守派的敌视。"
 MAR_economic_miracle:0 "经济奇迹"
 MAR_economic_miracle_desc:0 "“积贫积弱，毫无意义，而且可笑至极！”——一年前，维亚特卡的那些达官显贵们还对别列兹尼基的经济嗤之以鼻。而当时我们也无从反驳，毕竟那时的别列兹尼基经济几乎完全依赖于聊胜于无的盐矿开采。然而，今时不同往日。自从阿列克谢·柯西金同志就任我们的经济部长以来，我们终于看到了未来发展的曙光。\n\n凭借着柯西金同志所制定的工业改革与重组计划，我们在经济发展上取得了举世瞩目的成就。如果说曾经的我们，仅仅是一个发展落后，勉强自给自足的小村庄的话，那么现在，我们可以自豪地宣称，我们已经崛起成为一个规模虽小，但却实力强劲的工业化城镇。而取得这一切成就，我们要感谢党，尤其是要感谢阿列克谢·柯西金同志。"
 MAR_look_for_the_best_candidate:0 "寻找合适的候选人"
 MAR_look_for_the_best_candidate_desc:0 "我们“青年俄罗斯”的事业中仍然缺失了一个至关重要的环节——一位君主。尽管在卡津别克摄政时期，将王位空置有其便利性和实用性的一面，但倘若没有一位强有力的统治者，我们的意识形态就将成为无源之水，无本之木。“沙皇与苏维埃”的口号，如果没有沙皇，也只能沦为一句空谈。\n\n我们必须尽快解决这一问题，否则我们的政权将成为全俄罗斯的笑柄，这也将使我们更难找到志同道合的伙伴。"
 MAR_vibori_vibori_tt:0 "§Y选择§!§R君主§!§Y- 这是一个复杂而微妙的问题，选择结果可能是§!§R最意想不到的...§!"
 MAR_the_star_general:0 "明星将军"
 MAR_the_star_general_desc:0 "我们年轻的国家尚不具备组建一个成熟的最高统帅部的条件，我们手头实在缺乏那些拥有足够训练水平和实战经验的军官。谢尔盖·别洛谢利斯基-别洛谢尔斯基是我们最高统帅部中为数不多的，不仅曾在现代军队中担任军官，而且还拥有丰富实战经验的人才。\n\n鉴于这种情况，我们将责成谢尔盖着手制定未来对南方“雅利安兄弟会”作战的计划。"
 MAR_and_his_blue_blood:0 "以及他高贵的血统"
 MAR_and_his_blue_blood_desc:0 "尽管罗曼诺夫王朝的相关性是可以理解的，但我们不应该只关注任何一个王朝，青年俄罗斯联盟的想法与此无关。一个非常出人意料的候选人引起了我们的注意——谢尔盖·别洛泽尔斯基，我们的将军和总司令。尽管他与任何一个贵族家族都有直接联系，但他却是留里克王朝的远房后裔。尽管这位君主的出身可疑，但如果我们不向他提供一个他无法拒绝的机会，我们将错失良机。"
 MAR_fathers_sins:0 "父之罪愆"
 MAR_fathers_sins_desc:0 "青年俄罗斯联盟的主要思想是假定王位上有一位公正的君主，他将与苏维埃一起保护他的臣民。弗拉基米尔三世是这样一位君主的不二人选，他是维亚特卡公国政府的领导人，以其干练的治理和群众决策赢得了人民的信任，但他作为通敌者的过去也让我们牢记在心。此人已背叛过一次自己的祖国，若是他再犯一次呢？我们得规避风险，考虑考虑其他候选人。"
 MAR_children_can_redeem:0 "子可偿还"
 MAR_children_can_redeem_desc:0 "玛丽亚·弗拉基米罗夫娜是弗拉基米尔三世的女儿，也是王位的合法继承人，今年只有九岁，但与她的父亲不同，玛丽亚的过去没有与德国纳粹接触的污点，也没有成为毁灭俄罗斯人民的同谋。\n\n此外，她年幼的年龄不会对我们不利，反而会对我们有利，我们可以利用玛丽亚无法治理国家的弱点，将权力集中在卡津别克手中，为我们谋取利益。"
 MAR_children_can_redeem_decision_tt:0 "§M决议§!£GFX_decision_icon_small “觐见维亚特卡宫廷”§Y将成为可用状态。§!"
 MAR_wisdom_of_kosygin:0 "柯西金的才智"
 MAR_wisdom_of_kosygin_desc:0 "阿列克谢·柯西金，尽管曾与布尔什维克有过合作，但他仍不失为我们政府中的一位关键人物。他在经济领域的天赋毋庸置疑，而他所提出的各项改革措施更是有着起死回生的魔力。柯西金同志的经济改革计划将为我们未来的经济发展奠定坚实的基础。\n\n每一份柯西金递交的报告，我们的领导人都会亲自过目。而现在，新一轮的述职报告又要开始了，柯西金必须前来觐见。"
 MAR_path_differ_kosyin_tt:0 "额外影响取决于所选择的经济道路。"
 MAR_and_rumors_about_him:0 "以及围绕着他的种种传闻"
 MAR_and_rumors_about_him_desc:0 "关于阿列克谢·柯西金的身世，坊间流传着一些颇为耐人寻味的传闻。最近，一些媒体开始刊登所谓的“宫廷秘闻”，称我们这位经济部长，阿列克谢·尼古拉耶维奇·柯西金，实际上是尼古拉二世沙皇的儿子——阿列克谢·罗曼诺夫，他侥幸逃脱了布尔什维克的屠刀，改名换姓一直隐匿至今。\n\n无论柯西金是否真的是罗曼诺夫家族的一员，这都无关紧要。他是一位天生的经济学家，一位富有远见的政治家，一位深受民众爱戴的领袖。我们必须充分利用这一天赐良机，就让柯西金-罗曼诺夫成为候选人之一，角逐那至高无上的皇位吧。"
 MAR_special_meeting:0 "特别会议"
 MAR_special_meeting_desc:0 "俄罗斯的皇位已经空悬多年。回望历史，俄罗斯人民只有在沙皇的统治下才能迎来真正的繁荣与昌盛。而在那些皇位虚悬的日子里，人们却只能将希望寄托于各种各样的僭主伪帝身上。无论是他们的合法性、理性还是领导人民走向光明的本领，这些人都拍马难及我国历史上任何一位真正的沙皇，哪怕是连其十分之一都远远不及。\n\n而现在，这段新的混乱时期终于迎来了终结。我们从茫茫人海中遴选出了那些最优秀的人选，他们将有机会登上全俄罗斯的宝座。然而，他们每个人的学识、口才和治理国家的能力都是超一流的，这反倒使我们更难做出抉择，究竟该在这些候选人之中选择谁，来成为我们的沙皇呢？\n\n但问题不仅仅出在候选人身上，我们还必须达成一致的意见，竭力避免任何争吵和冲突，众志成城，共同做出选择。毫无疑问，这绝非易事，因为我们的抉择将会决定俄罗斯的命运以及它未来的发展道路。"
 MAR_break_okhranka_network:0 "打破保卫部网络"
 MAR_break_okhranka_network_desc:0 "尽管我们已经彻底与维亚特卡的沙皇残党们决裂，但他们的秘密警察机构——保卫部的特工们仍然渗透在我们的国家之中。显而易见，我们绝不能对这种威胁坐视不管。\n\n在与弗拉基米尔三世共同工作期间，我们获得了许多关于保卫部组织结构及其行动方法的知识。现在是时候利用这些信息，一劳永逸地消除保卫部对别列兹尼基的影响了。"
 MAR_break_okhranka_network_popularity_tt:0 "§Y这将削弱§!§K俄罗斯全军联盟索利卡姆斯克分部§!的影响力。"
 MAR_break_okhranka_network_decision_tt:0 "§M决议§! £GFX_decision_icon_small “突袭秘密据点”§Y将成为可用状态。§!"
 MAR_defend_the_people:0 "保护人民免遭疯子荼毒"
 MAR_defend_the_people_desc:0 "在我们的南方，盘踞着一股令人毛骨悚然的邪恶势力，它们是大日耳曼国滴落在东欧大地的一滴毒液。这个名为“雅利安兄弟会”的可憎存在是对理智的无情嘲弄，一群最为卑劣的人渣沆瀣一气，他们竟然天真地以为模仿德国人就能让他们变得强大而优越。\n\n在那里苟延残喘的人们早已抛弃了自身的文化认同和自己的祖国。而任何敢于说“不”的可怜虫，都将沦为在“兄弟会”工厂中劳作至死的奴隶。\n\n我们必须加固与这些败类接壤的边境，让我们的民众免遭这些精神病患者的袭扰。在未来，这些防御工事更将成为我们向这些“雅利安人”发动致命反击的坚固桥头堡。"
 MAR_defend_aganist_ariev:0 "§G我们将保卫南部边境，抵御§B纳粹§!人渣"
 MAR_defend_the_people_decision_tt:0 "§M决议§! £GFX_decision_icon_small “南部长城”§Y将成为可用状态。§!"
 MAR_weak_army:0 "孱弱之军"
 MAR_weak_army_desc:0 "在苏维埃联盟存续之时，它的军队曾被誉为世界上最强大的军事力量之一。但第三帝国发动的那场突如其来、背信弃义的闪电战彻底摧毁了一切，令苏联再无还手之力。时至今日，俄罗斯深陷于第二次大动乱的泥潭之中，所有军阀手中唯一重要的砝码便是他们麾下的武装部队。\n\n但我们却不幸地撞上了霉运。我们的部队与其说是一支军队，倒不如说是一群拿着五花八门武器的乌合之众，这就是所谓的别列兹尼基军队的真面目。这一严峻的现实随时都可能危及到我们的生存。军队的改革已迫在眉睫，我们不仅需要扩充兵员，还必须为部队换装武器装备。摆在我们面前的有两条路：要么立足现实，依靠俄罗斯自身的军事创新实现自主自强，要么远渡重洋，学习借鉴“山姆大叔”的先进经验，师夷长技....."
 MAR_army_upgrade_tt:0 "§Y是时候§!§G进行果断的军事改革§!§Y，去超越§!§R西俄罗斯的其他军阀了§!"
 MAR_old_collegues:0 "呼吁老同事"
 MAR_old_collegues_desc:0 "在别列兹尼基艰难而充满荆棘的道路上，我们一开始只是为了生存。而事实证明，要做到这一点是相当困难的。我们根本没想到前俄罗斯会处于如此糟糕的境地，但事实胜于雄辩。在我们濒临死亡的时候，那些派我们来的人帮助了我们。美国人通过他们在黑市上的渠道，为我们提供了物资和装备。\n\n现在，我们面临着一个棘手的问题——需要改革军队。显然，我们自己没有足够的知识和资源。一个相当有效的办法就是求助于白宫的老朋友。我们将请求他们增加供应量，这将大大增强我们在未来战场上的实力。此外，我们将使用世界上最好的武器之一。但凡事都有代价。"
 MAR_fortune_gentlemen:0 "“富贵先生”"
 MAR_fortune_gentlemen_desc:0 "佣兵，作为一种职业，早在古代世界便已形成。但彼时的佣兵概念与今日截然不同。过去，他们只是一群为了金钱而甘愿冒险的武士，而如今，佣兵行业已发展成为一个庞大的劳动力市场，其资金规模之巨，令人咋舌。佣兵们已然蜕变为训练有素的职业战士，身怀绝技，渴望在战场上一展身手。\n\n鉴于我军在纪律和素质方面岌岌可危的现状，我们需要树立一个标杆，以此作为奋斗目标。因此，我们将请求中央情报局派遣数百名战士，以训练我们的武装部队。此举将有助于提升我军士兵的素质，进而增强军队的整体实力，毕竟，大多数美国佣兵都是经验丰富的百步穿杨的神射手。"
 MAR_fortune_gentlemen_tt:0 "§Y两支§!§z雇佣兵师§!§Y将被部署在§!§Q别列兹尼基§!"
 MAR_humanitarian_aid:0 "人道主义援助"
 MAR_humanitarian_aid_desc:0 "在军队改革中依赖中央情报局雇佣兵的决定是至关重要的，尽管这其中可能也带有些许的冒失。问题的关键在于，部队的整编需要大量的武器和装备，而这恰恰是我们所严重短缺的。解决这一棘手难题最便捷的方案莫过于从美国进口武器装备了。但是，即便我们能够搞定货源，如何规避维亚特卡方面的严格监管也绝非易事。\n\n所有运往别列兹尼基的货物都会受到维亚特卡方面的严密检查，他们会仔细搜查违禁品，而我们的这些货物无疑就在违禁品之列。然而，我们很快就找到了一个绝妙的对策：将这些货物伪装成来自美国移民的“人道主义援助”。一方面，我们可以名正言顺地获得这些最先进的装备，另一方面，我们也可以借此机会进一步增进维亚特卡对我们的信任。但这一切的前提是，每一个环节都要确保万无一失....."
 MAR_russian_spetsnaz:0 "俄罗斯特种部队"
 MAR_russian_spetsnaz_desc:0 "别洛泽尔斯基和其他领导人所制定的军队改革计划取得了显著的成效。如今，我们的军队已不再是一群手持十九世纪老古董的乌合之众，而是一支真正意义上的、有战斗力的正规军。尽管如此，我们仍需对军队的“大脑”——战略战术进行大刀阔斧的革新。尽管军队的结构发生了如此翻天覆地的变化，但“坚守阵地，等待维亚特卡方面军来援”的过时战术思想在军中仍然大行其道。\n\n审视我们从美国人那里所学来的一切，一个大胆的想法逐渐成形。我们必须深化双方的经验交流，并从美国人那里学习借鉴那些令人拍案叫绝的不对称作战战术的精髓。这些非常规而又灵活多变的战术简直是为我们量身打造的，时不我待，我们必须尽快将这些宝贵的知识化为己用。"
 MAR_homeland_expirience:0 "祖国的经验"
 MAR_homeland_expirience_desc:0 "当我们回想起在纳粹的背信弃义的突袭之前，苏联红军的鼎盛时期，我们不得不承认他们的训练水平是十分出色的。尽管苏联最终在那场战争中落败，但我们仍能从中总结出一条经验：当时苏联的领导人确实深谙一些克敌制胜之道——否则他们也不可能打造出一支世界第二的强大军队——而我们也正需要这样的智慧和经验来对我们的军队进行脱胎换骨的改革。\n\n我们不能盲目地照搬美国或其他国家的军事理论，而是应该打造一支能够完美适应我们自身国情的军队。为了实现这一目标，别洛泽尔斯基决定在军事改革中融入苏联红军曾经的宝贵经验，并在此基础上推陈出新。毫无疑问，这是一招险棋，一旦失败，我们将满盘皆输，但我们已无路可退，唯有背水一战。"
 MAR_cossack_brigades:0 "向未来奔去"
 MAR_cossack_brigades_desc:0 "过去，每当人们提起那些最骁勇善战、技艺精湛的勇士，人们首先想到的会是谁呢？没错，正是哥萨克！这一定论在过去几乎无人能够质疑。因为他们是俄罗斯帝国，乃至彼得大帝时代之前，南部边疆安全的支柱和基石。但时至今日，这一切又如何呢？那个曾经自由奔放、英勇无畏的民族，那颗点缀在俄罗斯帝国这顶皇冠上的璀璨明珠，如今又身在何处呢？\n\n答案是苦涩而又令人心痛的：在苏联被德国击败后，饱受“去哥萨克化”政策摧残的哥萨克人，被迫离开了世代生活的家园，星散于这片满目疮痍的俄罗斯大地上。正因如此，作为一个民族的哥萨克，其存亡都已被打上了一个大大的问号。然而，在别列兹尼基，事情出现了转机。根据青年俄罗斯联盟的决议，我们将组建数支哥萨克作战部队，这些部队很快就将加入我们的军队，并重新夺回那属于他们的荣光——俄罗斯最精锐之师的称号。"
 MAR_cossack_brigades_tt:0 "§Y两支§!§y哥萨克师§!§Y将实现摩托化，并部署在§!§Q别列兹尼基§!"
 MAR_tsarist_comissars:0 "帝国政治委员"
 MAR_tsarist_comissars_desc:0 "众所周知，苏联领导层花费了大量时间对下属进行意识形态培训，正如他们所保证的那样，这本应加强全体人民的精神。但整个计划失败了，原因很简单，因为到了20世纪40年代初，就连共产党中央委员会的高层也不相信亦不愿相信共产主义的理想，这导致了灾难性的后果。\n\n但值得注意的是，他们也有一些聪明的想法。政委就是其中之一。在那个时代，政委的名字听起来很不吉利，具有挑衅性。现在，在我们的军队中，政委将成为管理士兵的通用工具。我们将在人员素质和数量培训方面做出巨大努力，这将有助于各类部队对他们的需求。"
 MAR_veterans_of_wrw:0 "西俄战争的老兵们"
 MAR_veterans_of_wrw_desc:0 "从俄罗斯的残垣断壁中建立起来的每一个国家都有其独特性和特殊性。这种特殊性可以在官僚机构的奇思妙想、经济的特殊性或国家元首的选择中找到。这些因素决定了国家的利弊及其发展方向。当然，如果认为别列兹尼基没有这种特殊性，那就太愚蠢了。\n\n我们的特色在于经验的多样性。得益于青年俄罗斯人的意识形态，我们得以从红军和白军运动中收集到相当广泛的信息。所获得的资料将用于我们对别洛泽尔斯克的军队改革，这将在全面战争开始时给我们带来优势。但现在，我们有一个和平的时代，我们要利用一切可以利用的......"
 MAR_arest_vyatka_instructors:0 "逮捕维亚特卡教官"
 MAR_arest_vyatka_instructors_desc:0 "维亚特卡的军事教官对别列兹尼基的军队来说，一直是一个如“老大哥”般的存在。他们名义上是由维亚特卡派遣到此地，负责向我们地方部队提供建议，美其名曰协助我们提高军队素质，加强部队纪律，在弗拉基米尔的口中，这些教官也都是一些“难能可贵”的有用之才。\n\n然而实际上，这些教官却是我们军队中最为危险的敌人，他们从内部蚕食着我们军队的组织结构。而他们在别列兹尼基之所以拥有如此之大的权力，都源于弗拉基米尔对我们的一纸最后通牒。在获得了为所欲为的权力后，这些教官对我们的军官们颐指气使，并为维亚特卡培养了一批又一批的“皇协军”。为了根除这一顽疾，我们必须开展一场将这些蛀虫斩草除根的行动。但是我们必须小心行事，维亚特卡绝不会容忍任何形式的公然对抗。"
 MAR_new_mladorossian_army:0 "青年俄罗斯新军"
 MAR_new_mladorossian_army_desc:0 "每隔一个世纪，俄罗斯才会诞生一位政治天才。幸运的是，在军事领域，天才将星的涌现频率要高得多：苏沃洛夫、叶尔莫洛夫、勃鲁西洛夫，以及那些在内战中为了理想而浴血奋战的白军和红军将领，还有许许多多默默无闻的普通士兵……\n\n然而，在二十世纪，俄罗斯人却一败再败，先后输掉了四场战争，这是一场史无前例的巨大灾难。但是，我们可以从这些失败中汲取宝贵的经验教训。而我们的将军和部长们已经率先迈出了这一步！我们的军队宛如凤凰涅槃，已做好准备将任何敢于来犯之敌揍得满地找牙。当然，这其中最大的功臣，当属我们的领袖——谢尔盖·谢尔盖耶维奇·别洛泽尔斯基。"
 MAR_clear_sky:0 "晴空"
 MAR_clear_sky_desc:0 "我们的关键时刻已经到来——当德国自食恶果之际，正是我们行动之时，推翻维亚特卡的统治，建立我们伟大的俄罗斯。"
 MAR_initial.1.t:0 "主旨"
 MAR_initial.1.d:0 "窗外雪花飘飘，房内的老式时钟滴答滴答地走着。亚历山大·利沃维奇·卡津别克在办公室里来回踱步，对桌上杂乱堆积的文件视若无睹。他站在镜子前，定睛打量起镜中人的形象：别列兹尼基的省长、弗拉基米尔的忠臣，同时还是代号“蜘蛛”的中情局特工。然而，越是凝视，眼前的形象却越是陌生，那个热爱祖国、心系青年俄罗斯联盟的卡津别克不在了，如今的他仿佛一块可重复书写的木板，先前的字迹早已被层层掩盖。\n\n风雪愈发猛烈，他的思绪渐渐清晰。他意识到，自己在离开祖国的这些年里几乎失去了一切。残酷的现实不断打击着他，侵蚀着他重建俄罗斯的伟大梦想。卡津别克似乎放弃了抗争，甘愿在历史的长河中做一滴卑微的水珠，以无名之辈的身份被人遗忘、取代。\n\n“不！”卡津别克把这些想法甩出脑海，重新坐到桌前。他要把精心构思的计划付诸实施，让俄罗斯人民重拾对君王的信念，令俄罗斯再次团结起来走向强大。但他同样明白：不积跬步，无以至千里。"
 MAR_initial.1.a:0 "新的故事由此开始。"
 MAR_initial.2.t:0 "夜间车队"
 MAR_initial.2.d:0 "安东·列斯科夫理了理大衣，看着桥对面的光源不断向自己靠近。没过多久，引擎的轰鸣声便响彻四周。他转过头，吹了个口哨，远处的士兵旋即开关探照灯向维亚特卡的车队示意，而对方也以类似的方式做出答复。“车辆都准备好了，不错。”安东思考片刻，看向他的副官。\n\n“鲁金中士！”\n\n“到！”\n\n“我要和队伍一块儿走，你留在岗位上，明天卡列达会来接替你。等我回来，你再向我报告情况。”\n\n“是，长官！”鲁金敬了个礼，随后消失在朦胧的夜色中。\n\n卡车缓缓行驶在土路上，列斯科夫中尉却如坐针毡。究其原因，在于车队会经过别列兹尼基的卡拉盖村，而那里离彼尔姆海姆相当近。每当夜间来到门捷列夫村、别洛博罗多沃村和戈里耶夫斯基耶村之间的三角地带，他都会迅速提高警惕，检查步枪是否上膛。虽然这常常招来司机的怀疑，但列斯科夫丝毫不在意，毕竟雅利安兄弟会的老巢就在一百多公里之外，小心才驶得了万年船。另一方面，列斯科夫明白，省里离不开这样一支运输武器和药品的车队，没有了它，自卫和救治伤病也就无从谈起。明亮的车灯驱散了前方的黑暗，开辟出一条通往城市的道路，将一批批物资引向目的地，这是生存斗争中又一次小小的胜利。"
 MAR_initial.2.a:0 "夜静悄悄的。"
 MAR_initial.3.t:0 "屠杀"
 MAR_initial.3.d:0 "车队来到了荒废的别洛博罗多沃村。安东·列斯科夫中尉环顾四周，道路两侧的房屋一片衰败，窗户和大门微微敞开。他警惕地握住步枪，找寻着记忆中的地标。终于，车队抵达了转弯点，开始向左转弯并加速。凉爽的空气吹进驾驶室，令人精神抖擞，方才的萧条景象也很快被夜幕下的森林所取代。通过最危险的三角地带后，车队稍稍减速，继续平稳前进。列斯科夫这才如释重负。\n\n突然，一颗子弹击碎了侧窗，随即枪声大作。混乱中，驾驶员下意识地猛踩油门，卡车径直冲向了一旁满载士兵的车辆。“有埋伏！”无线电中传来尖锐的呼喊声。"
 MAR_initial.3.a:0 "我们的士兵挫败了进攻。"
 MAR_MGB_adv_start_tt:0 "§Y我们将向§!§K沙皇§!§Y展示我们军队的§!§Q实力和潜力§!，§Y这可以使我们§!§G更加轻松地摆脱§!§K维亚特卡§!§Y的§!§u军事顾问§!。§Y但是，§!§Q秀肌肉§!§Y的行为可能会让§!§K保卫部§!§o将更深的触角伸进我们军队的内部§!。"
 MAR_initial.3.b:0 "袭击者俘获了车队。"
 MAR_MGB_res_start_tt:0 "§Y这将向§!§K沙皇§!§Y展示§Q别列兹尼基§!对§!§K维亚特卡军备§!§Y的依赖是多么的低效§!，§Y这将让我们§!§G更加轻松地摆脱§! §Y那些§!§q资源开采特许权§!。 §Y但是，§!§Q削弱对维亚特卡的经济依赖§!§Y可能会使§!§K保卫部§!§o警觉起来并向我们派遣更多的特工§!。"
 MAR_initial.4.t:0 "欢迎来到别列兹尼基"
 MAR_initial.4.d:0 "卡津别克走下车，用目光扫过眼前佩戴勋章的士兵和军官，随后看向远处。在那里，工兵们正忙着将货物搬到附近的仓库。\n\n“同志们好，”卡津别克问候道，“我听说车队遇到了袭击？”\n\n“是的，首长。”士兵们齐声回答。\n\n“伤员的情况如何？”卡津别克继续提问。\n\n“已经送去医院了，首长！”一名高级军官答复说。\n\n“很好。”省长满意地点点头，在队列前方站定。“我会告诉沙皇陛下，你们和你们的战友完成了一项壮举，完美地诠释了军人的职责，我要向你们献上由衷的感谢！”\n\n“乌拉！乌拉！乌拉！”队列里爆发出一阵欢呼，但被卡津别克抬手制止了。他接着说道：\n\n“我深知，你们都付出了沉重的代价。敌人肯定不会善罢甘休，他们还会像这样发动袭击，而我不想你们继续涉险。从今往后，这条补给线将不再使用，请让我再次感谢你们的付出。之后，你们就在此暂时休整，当然我们也不会拒绝任何自愿留下的人。欢迎来到别列兹尼基！”\n\n“乌拉！乌拉！乌拉！”震耳欲聋的喊声又一次响起。"
 MAR_initial.4.a:0 "这些人理应得到休息。"
 MAR_initial.5.t:0 "致沙皇的信"
 MAR_initial.5.d:0 "陛下，\n\n前往敝省之最后车队于半途遇袭，货物散失，人员殒命。据情报，袭击似是由正规军所为。臣推断雅利安兄弟会乃其幕后黑手，伏望陛下更换路线以保贵重物资之安全，并为敝省之基础设施注资，另建枢纽。敌现已知悉我方运输行动，延续此举恐极度危险且不切实际，唯有摧毁敌穴方能重得安宁。臣坚信，凭陛下之英明，定能对罪魁祸首施以公正之惩罚。"
 MAR_initial.5.a:0 "让该死的运输路线见鬼去吧。"
 MAR_initial.6.t:0 "意外收获"
 MAR_initial.6.d:0 "“吃屎去吧，贱货！”一声枪响，眼前痛苦挣扎的维亚特卡士兵停止了呼吸。贡特·斯图加特站在一旁，看着手下的人搜刮他的尸体。\n\n“动作麻利点，瓦尔德马。”贡特冷冷地提醒道，接着掏出一支烟点燃，深吸了一口。“为了搞到车队的消息，我们可是付了鲁金先生一大笔钱。”他用目光扫过战场，不禁感到一阵惋惜：这么多人就这样白白死了，他们虽甘愿做犹太-布尔什维克和假沙皇的奴隶，但归根结底还是俄罗斯雅利安人的一员。贡特把左手放在身后，转过去背对卡车。“这就叫有得必有失吧。”他如是想着，用手弹走烟头，接着夸张地转回身来。\n\n“怎样，瓦尔德马？有没有大丰收啊？”贡特望向士兵，后者刚打开一个绿色的箱子，随即便“咔嗒”一下将其合上，兴奋的心情溢于言表。答案显而易见，贡特脸上露出一抹微笑。\n\n一段时间后，贡特领着一队士兵，抬着箱子走进了古特鲁姆·瓦格纳的宅邸。元酋对这群不速之客的到来很是愤怒，他猛然起身，贡特连忙单膝跪地，禀道：\n\n“元酋，我们的将士再一次证明了他们的优越性！”他抬起头同瓦格纳对视，随后指着地上的绿色箱子（先前的排练派上了用场），“您看！”说罢，他揭开盖板，里面是整整一批崭新的自动步枪。见状，瓦格纳的怒火消失得无影无踪，挑着眉毛问道：\n\n“从哪儿弄来的？”"
 MAR_initial.6.a:0 "每位强者都有自己的秘诀。"
 MAR_initial.7.t:0 "狩猎开始"
 MAR_initial.7.d:0 "亚历山大·卡津别克伫立窗边，凝视着窗外景色，直到弗拉基米尔·吉尔的身影映入眼帘。最近一段时间，总督召见这位国家安全部部长，通常只是为了听取他关于打击分裂势力、土匪和地方犯罪团伙的汇报，或者与他一同商讨对策。这一次，总督并没有要求他提交任何报告，但即使没有那些冰冷的文件，基里尔仍然清楚地记得，在过去的一个月里，他们取得了怎样辉煌的战果。亚历山大缓缓转过身来。\n\n“坐吧，弗拉基米尔，”卡津别克指了指自己对面的座位。“有件事要和你谈谈，而且这件事至关重要。”卡津别克说道。弗拉基米尔一言不发。“在沙皇的统治下，总督辖区对我们来说就像一件过分紧绷的束身衣，已经严重制约了我们的发展。我需要在你的部门之下成立一个特别小组，专门负责削弱维亚特卡在我们权力体系中的影响力——我们必须彻底斩断那些束缚着我们的枷锁。”弗拉基米尔掏出一支香烟，看着亚历山大，后者点了点头，从抽屉里取出了一个烟灰缸。\n\n“组建特别小组不是问题，但我们需要付出更多的努力，此外，我们还需要监听设备以及一处宽敞的办公场所。”弗拉基米尔说道。\n\n“设备的问题交给我来解决——你想要的一切，我都会为你搞定。你手头有没有什么信得过的人？”\n\n“有几个。”基里尔点了点头，弹了弹烟灰，“我们还需要组建一个间谍网络来搜集情报，查明我们内部那些相互倾轧的派系，并将弗拉基米尔三世安插在我们身边的眼线统统挖出来。”\n\n“越快越好，弗拉基米尔。”亚历山大皱着眉头说道。\n\n“无论如何，我都会全力以赴。”弗拉基米尔掐灭了烟头，压低了声音，“你是想跟德国人开战，对吗？”他露出了一丝狡黠的笑容。\n\n“一切皆有可能，基里尔，但在此之前，我们必须先摆脱维亚特卡。”"
 MAR_initial.7.a:0 "我们必须考虑我们的未来，摆脱弗拉基米尔三世的阴谋。"
