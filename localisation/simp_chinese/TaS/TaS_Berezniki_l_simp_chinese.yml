 KUR_Saddam_Hussein:0 "萨达姆·侯赛因"
 POLITICS_SADDAM_HUSSEIN_DESC:0 "很少有人能预料到，萨达姆·侯赛因，一个曾经的街头顽童，一个食不果腹的穷孩子，一个看似没有未来的人，竟然会成为伊拉克最受欢迎的政治家。他个人的苦难与崛起，以及为了摆脱更大苦难所做的努力，恰恰反映了他祖国的坎坷命运。他战胜了贫困，摒弃了父亲的守旧思想，并以首都一名卑微的小职员起步，担任着又一个意大利谄媚者的助手。这份工作并不合他的心意，但微薄的收入却帮助他适应了这个瞬息万变的世界。后来，他开始写作，阅读西方人文主义著作，他的名字也逐渐传遍了他的祖国。\n\n战争爆发了，但萨达姆将其视为机遇而非灾难。他离开了巴格达，穿越前线，逃往库尔德人聚居区。在那里，他迅速成为了当地广播电台的领军人物，鼓舞着同志们的士气，并在敌人的队伍中煽动反政府和反复兴党的运动。他的声音成为了数百万人的希望。战争结束后，谁将赢得第一次选举，以及自由伊拉克的俄罗斯赞助者将支持哪位政治家，答案已不言自明。"
