 MAR_initial.57.t:0 "远方的迷雾"
 MAR_initial.57.d:0 "发件人：С.别洛泽尔斯基\n收件人：А.卡津别克\n\n自从旨在夺取尤尔林斯基区的行动开始以来的几天里，别列兹尼基的武装部队在国家安全部的协助下，畅通无阻地深入该地区，迫使负责管理该地区的行政当局与我们的指挥部取得联系，宣布他们已准备好全面配合别列兹尼基中央政府的工作。\n\n与此同时，维亚特卡的主力部队并没有做出任何可能被解读为对此事进行回应的积极反应。只有几个驻扎在边境附近的驻军试图进行抵抗，但在短暂的交火后，他们很快便被迫撤退，无力阻止事态的进一步发展。\n\n在尤尔林斯基区被我们直接控制后，我们起草并向维亚特卡方面发出了一份正式照会，宣布尤尔拉及其周边地区正式并入我们的版图。简而言之，这份照会指出，根据几天前与库德姆卡尔地方长官达成的协议，双方已完成了边界的重新划定，尤尔林斯基区也随之并入到了我们的版图之中。\n\n截至目前，维亚特卡方面尚未对此提出任何抗议，但为了维护这一地区的安全，我们将会在当地保留一支必要的军事力量，以应对维亚特卡当局未来可能采取的行动。与此同时，我们也正在着手建立该地区与我国其他地区之间的后勤补给线。最终，本次行动取得的成果无疑是巨大的。"
 MAR_initial.57.a:0 "伟大的事业始于微小的胜利。"
 MAR_initial.58.t:0 "艰难的战斗"
 MAR_initial.58.d:0 "亚历山大·卡津别克正坐在自己办公室的办公桌前，这间办公室几乎已经成为了他的第二个家。他手中拿着一封刚刚从维亚特卡寄来的信。他很清楚这封信的内容是什么，但仍然对信中将要如何描述这一事件，以及最终的处理结果感到一丝不安。他深深地吸了一口气，拆开了信封，迅速取出了一张叠得整整齐齐的信纸。\n\n“尊敬的亚历山大·卡津别克，我们很快就获悉，贵方当局试图在未经授权的情况下擅自划定边界，派遣军队控制了尤尔林斯基区。”\n\n“你们的这一行动严重损害了我们曾经给予你们的信任。我们已经对这一事件进行了调查，并得出了一些结论。此外，我们还要单独指出一个事实：在从尤尔拉撤退时，驻扎在该地区的驻军部分破坏了您所占领地区的基础设施。”\n\n“然而，尽管如此，我们仍然承认您对地图所做的修改，并警告您，未来未经中央政府批准的任何类似行动都将被严格禁止。为确保此项命令得到执行，一批保卫部的特工已被派往别列兹尼基，他们将密切监视贵方的一举一动，确保您的一言一行都在我们的掌控之中。就说到这里。请尽忠职守，切勿违背既定的法律和边界。”\n\n亚历山大放下信，陷入了沉思：这场冒险究竟值不值得？诚然，别列兹尼基控制了尤尔林斯基区……但现在，他们将不得不面对来自保卫部日益增长的压力，而且得到的东西远比他们预期的要少得多。"
 MAR_initial.58.a:0 "得不偿失。"
 MAR_initial.59.t:0 "冒险的失败"
 MAR_initial.59.d:0 "那天，国防和安全部的大楼里挤满了来自各大媒体的记者，他们既有本地的报社，比如《致青年的俄罗斯》，也有维亚特卡的《祖国报》。\n\n国防和安全部长谢尔盖·别洛泽尔斯基亲自出面接待了这些记者。所有的记者们都在争先恐后地提出同一个问题：\n\n“谢尔盖·谢尔盖耶维奇，您对发生在尤尔林斯基地区的事件有何评论？”\n\n问题的关键在于，在维亚特卡公国的尤尔林斯基区发生了一起武装冲突。根据现场勘查的结果，在袭击者身上发现了别列兹尼基省武装部队的识别标志。\n\n面对着记者们的提问，别洛泽尔斯基稍作停顿，然后回答道：\n\n“记者先生们，我已经了解了发生在尤尔林斯基地区的那起事件。这纯粹是一场旨在破坏我们与维亚特卡公国关系的恶意挑衅。我想说的是，如果真的是别列兹尼基的军队所为，那么第二天尤尔拉就该归入我们治下了。这就是我对于这起事件的所有回应。”\n\n随后，在记者们要求他作出进一步解释的呼声中，别洛泽尔斯基迅速离开了大楼。因为他必须向卡津别克本人作出解释。"
 MAR_initial.59.a:0 "过度的自信只会导致惨痛的失败。"
