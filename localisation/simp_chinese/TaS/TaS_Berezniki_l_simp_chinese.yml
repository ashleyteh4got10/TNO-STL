 MAR_maria_tt:0 "§Y卡津别克将立即拜访年轻的§!§G皇女§!"
 MAR_initial.14.t:0 "维亚特卡庄园"
 MAR_initial.14.d:0 "亚历山大·卡津别克提前知会了来访事宜，并为维亚特卡之行做了精心准备。美国代表为他缝制了一套GANT的优雅西装，并搭配了配饰，使他整个人显得商务干练。弗拉基米尔的宅邸位于城郊——一座曾经属于帕维尔·德米特里耶维奇·杜尔诺沃的庄园，如今则归这位第三帝国的支持者所有。这座庄园俨然成为文明、优雅和贵族文化的孤岛。\n\n铺着雪白桌布的餐桌上摆放着华丽的瓷器和银质餐具。毕竟，这位自封的沙皇即便是在俄罗斯满目疮痍的情况下，也丝毫不亏待自己。在寒暄闲谈之余，亚历山大询问了沙皇女儿玛丽亚的情况。\n\n“玛丽亚在学校表现很好，”大公主的家庭教师阿纳斯塔西娅·维尔比茨卡娅回答说。“这孩子记忆力超群。”\n\n“她非常好奇，”弗拉基米尔微笑着说。\n\n“很高兴听到殿下如此优秀。我能和她谈谈吗？”亚历山大问道。\n\n“当然可以，”弗拉基米尔笑着说。“阿纳斯塔西娅·亚历山德罗芙娜，把玛丽亚带来，”沙皇说道，家庭教师随即离开了。半小时后，一个穿着蓝色连衣裙的女孩走进了房间。她一头鬈发梳理得整整齐齐，蓝色的眼睛闪烁着好奇的光芒。双方礼貌问候之后，卡津别克问道：“你最喜欢哪些学科？”卡津别克看着女孩，她稍作停顿后回答：“在所有学科中，我最喜欢数学和法语。”她把双手背在身后，用鞋尖在地上画着线。“或许还有文学，但要是俄罗斯古典文学。”玛丽亚看了看阿纳斯塔西娅，目光交汇后，她立刻站得笔直。\n\n“法语？”亚历山大有些惊讶。“为什么不是德语？”女孩闻言抬起了眼睛。“爸爸经常说德语，我不喜欢，”她毫不犹豫地回答。房间里顿时陷入了沉默。弗拉基米尔微微一笑，阿纳斯塔西娅·亚历山德罗芙娜也跟着笑了。“看来得好好调教一下这个女孩，”亚历山大心想。"
 MAR_initial.14.a:0 "我们必须和这个女孩合作。"
 MAR_initial.15.t:0 "早间新闻"
 MAR_initial.15.d:0 "“这是什么东西？”\n\n亚历山大·卡津别克把报纸摔在桌子上，难以置信地望着柯西金。\n\n“《盖宁斯基先驱报》，总督。今早在白桦树印刷厂印的。看来安季平手下还有个不为人知的编年史家涅斯托尔。”\n\n“阿列克谢，看在上帝的份上，告诉我这不是真的！”\n\n柯西金标志性地咧嘴一笑。\n\n“嗯，这里面有些失实之处。例如，我不是罗曼诺夫，”他把出现的“柯西金-罗曼诺夫”中所有多余的姓氏部分都划掉了，“但总的来说，这篇文章写得不错。”\n\n“不错？你在跟我开玩笑吗？”卡津别克的耳朵都红了。\n\n“喏，你自己读读，”这位经济学家拿起一支铅笔，沿着文字一行行地划下去，“阿列克谢·柯西金是未来乱世中俄罗斯唯一的救星，全俄罗斯的天然君主，一位伟大的圣贤，人民的恩人，守护者，”等等等等。字字珠玑！我完全同意。\n\n卡津别克看着他，仿佛他疯了似的，突然间控制不住地大笑起来。\n\n“柯西金，你这狗娘养的，真是个人才！”"
 MAR_initial.15.a:0 "“对了，我差点忘了。这是报告。”"
 MAR_tsar_kosygin_tt:0 "§Y无论真假，§!§R阿列克谢·柯西金-罗曼诺夫§!§Y将成为人民选出的真正沙皇。§!"
 MAR_initial.16.t:0 "惩罚"
 MAR_initial.16.d:0 "“哎哟！啊——啊——啊——”\n\n“小兔崽子，你个恶魔的孽种！”锁匠挥舞着皮鞭，一下下抽打着男孩。\n\n“九十……九！哎哟！一百！”\n\n“第一项惩罚结束。去神父那里忏悔，在圣母像前磕三百个响头。要是敢再说别的，我就扒了你的皮！”\n\n迪米特里拉起裤子，捂着鲜血淋漓的屁股，踉踉跄跄地走出牢房，靠在墙上喘息。他的同伴们同情地看着他。\n\n“你觉得他会开恩吗？”瓦斯卡开口问道，他是这群人里年纪最大的，二十二岁，在修道院里负责搬运各种杂物。\n\n“不——会——的，”书呆子马特维拖长声音说道，“这样一来，你得磕足四百个头。”\n\n年轻的见习修士们互相窃窃私语，走近神父的房间。\n\n“奉圣父、圣子、圣灵之名！”瓦斯卡念完惯用语，用拳头敲了敲门。\n\n“阿门。”——看来可以进去了。男孩们把迪米特里推了进去，悄悄地关上了门。\n\n“我的孩子，你有什么事？来块糖吧。这是昨天走私贩子带来的。坐下，慢慢说。”\n\n“神父……锁匠……他抽了我一百鞭……还罚我……磕三百个响头……”神父温和的语气让迪米特里不知所措，他抽泣起来，泪水顺着面颊流了下来。\n\n“你做了什么，要受如此惩罚？”神父惊讶地问道，扶了扶鼻梁上的眼镜。\n\n“因为那篇……关于柯西金的文章……”\n\n“恶作剧，哦，恶作剧，”神父笑了，苍老的眼睛里闪烁着光芒，“干得好！这可比跟神学院学生打架或者喝得烂醉闹事强多了，竟然写了整整一篇文章！我免除你的惩罚。平平安安地去吧。只是别让柯西金看到你，他现在就在修道院里，视察生产呢。”"
 MAR_initial.16.a:0 "罪与罚"
 MAR_initial.17.t:0 "帝国的恩赐"
 MAR_initial.17.d:0 "德米特里还没来得及躲开柯西金的视线，阿列克谢·尼古拉耶维奇就已经推门而入，连通报都省了。在他身后，惊慌失措的教堂司事一路小跑地跟着，他负责带领这位贵客参观修道院。\n\n“这篇文章是谁写的？”柯西金开门见山地问道。\n\n“就是您面前这位正在啃面包的年轻人写的。有什么问题吗，我的孩子？”修道院院长不紧不慢地回答道。\n\n“你叫什么名字，作家？” “我的孩子”露出了一个略显狰狞的笑容。\n\n“德米特里……伊万诺夫，柯西金同志。对不起……我……我和别人打赌输了……”\n\n“别哭丧着脸。穿好衣服收拾行李，你跟我走。”\n\n“我不同意！”院长用手杖重重地敲击着地面，“他已经接受过惩罚了！”\n\n“惩罚？如果我是来逮捕他的，那我带来的就该是士兵了。伊万诺夫被任命到经济部负责宣传工作。”\n\n“宣传？”院长皱起了眉头，“德米特里，你自己意下如何？是留在这里，还是去别列兹尼基工作？”"
 MAR_initial.17.a:0 "“部长同志，我究竟该怎么做？”"
 MAR_initial.18.t:0 "俄国之命运"
 MAR_initial.18.d:0 "大会堂里的嘈杂声令人难以忍受。官员、军人、牧师、工人、农民。每个人都在大声喧哗和咒骂，偶尔还会出现激烈的争论，但最终都被人群的嘈杂声淹没了。召开全州缙绅会议的想法看起来很民主，只因如此紧迫的问题不可能由任何人单独解决。但正是投票问题的紧迫性让议员们陷入了疯狂。别列兹尼基的礼堂中完全陷入了疯狂的、自发的狂热之中。\n\n“我一听到你的声音就知道了，你就是个婊子养的江湖骗子！”一个穿着夹克的男人尖叫起来。\n\n“如果这样一个无知的小子冒犯了我，我认为这是最好的褒奖！”安德烈·鲍里索维奇回敬他一声尖叫。亚历山大·卡津别克出现在舞台上，片刻之后大厅里鸦雀无声。\n\n“同志们，我把你们召集到这里，是为了给皇位候选人投票，”总督说，“为了避免同事们的压力和批评，将给你们发选票。记住，俄罗斯的命运取决于你们。你们知道候选人的名字和履历，从内心做出诚实的选择，但要以理性为指导。”\n\n随后，助手们进入大厅分发选票，每个人都被送到绣有别列兹尼基徽章的帐篷前。随后，每位议员将选票投入台上的一个瓮中。亚历山大·卡津别克注视着代表们的队伍，他不知道谁会获胜，但希望选择是正确的。俄罗斯将跟随谁？"
 MAR_initial.18.a:0 "我们从未得出一个结论。我们需要一个缙绅会议。"
 MAR_initial.19.t:0 "绝对警惕"
 MAR_initial.19.d:0 "达尼尔·德米特里耶维奇·别格洛夫是一个有些自恋，同时又颇具演讲天赋的人。若是在其他的时代背景下，他定能成为一名出色的广告人或者节目主持人（他偶尔也会在睡梦中憧憬一下这样的生活）。几年前，有人向他抛出了橄榄枝，许诺只要他能提供一些微不足道的“帮助”——汇报一下工业部内部的情况，并将一些文件的副本送到城里的某间公寓——他就能在美国获得一份优渥的工作。达尼尔·德米特里耶维奇是那种卑鄙无耻的小人吗？不，他只不过是在以服务换取服务罢了，因此在他看来，他依然是一个诚实守信之人。\n\n然而，他的才华却始终无法在这压抑的氛围中得到充分的施展——周围那些无趣的家伙们整日里讨论着枯燥乏味的数字，为了那些毫无意义的数字而奔波劳碌，他们的交谈简直就像是在传递二进制代码一般令人费解。他在管理和经济领域都并非一无是处，但他还是把所有这些繁琐无聊的职责都丢给了自己的副手——一个和他周围那些人一样无趣的家伙，而他自己则更喜欢沉浸于那些“高雅”的思绪之中。当然，还有那个他在美国梦寐以求的职位，但愿他们能把他派到加利福尼亚去！\n\n“达尼尔·德米特里耶维奇，”阿列克谢·斯捷潘诺维奇清了清嗓子，“下午好。”副手走到了这位官员的办公桌前。\n“哦，萨沙，有什么事吗？”达尼尔转过身来，面向自己的副手。\n“您，被解雇了。”阿列克谢将一张纸放在了桌上。达尼尔先是茫然地摇了摇头，然后一把抓起那张纸，飞快地浏览起来。当最后一个字映入眼帘，他的脑海中顿时嗡的一声，一个念头闪过：“用完就扔？！这帮混蛋！我要投诉！……可是，我又能向谁投诉呢？”他暗自思忖。确实如此，总不能到处宣扬自己为外国间谍机构工作，然后被无情抛弃，请求好心人帮助吧？或许问题出在那份第三季度的报告上？但现在再去追究这些又有什么意义呢。无论如何，他们都是对的——这个位置不适合他。达尼尔·德米特里耶维奇叹了口气，管他呢，爱咋咋地吧——反正他总能想方设法去到加利福尼亚的。"
 MAR_initial.19.a:0 "让我们祝他好运吧。"
 MAR_initial.20.t:0 "见缝插针"
 MAR_initial.20.d:0 "“谢苗尼奇，接着。” 彼得递过一根点燃的香烟，“我说，我们在这战壕里瞎忙活个什么劲儿？直接用炮兵把那帮雅利安人轰上天不是更痛快吗？”\n“哟，口气不小啊，彼得，你上哪儿弄大炮去？”\n“我们难道缺大炮吗？”\n“大炮是不缺，但像你这么机灵的脑袋瓜子可不多见。”\n“那些该死的将军，一点军事常识都没有。我记得有个中尉，毛都没长齐的小屁孩儿，在走廊里撞了我一下。我刚出来，他就进来，还说什么‘先——进来’，我让他滚蛋，别跟我扯什么礼仪，他居然还笑了起来。这帮人能干出什么好事儿来？”\n\n“行了，伙计们，撤离阵地。” 一个军官在他们头顶上喊着，指着第二道战壕，“敌人的步兵和装甲车马上就要来了。” 帕维尔·谢苗诺维奇和彼得·弗拉基米罗维奇站起身，快速收拾好工具，退到预备队防线。士兵们扛着弹药和榴弹发射器跑过。其他工人也被赶走了。帕维尔和彼得看着战士们占据阵地。左边那个地堡，他们最近才浇筑的。能撑住吗？\n\n十分钟后，雅利安兄弟会的士兵出现在远处，排着队前进，旁边是冒着黑烟的BMP步兵战车！在一公里外，它瞄准自动炮，向地堡开火，地堡则用机枪向进攻的步兵还击。BMP步兵战车越来越近。随着一声嘶嘶声，一枚反坦克导弹飞向地堡。工人们赶紧躲起来，爆炸过后，立刻起身——地堡完好无损，里面的防御者也毫发无伤。战斗车辆向地堡发射了第二枚导弹，但没有击中。之后，兄弟会的士兵决定撤退，BMP步兵战车释放出白烟，掩护战士们离开。\n“干得好，伙计们！你们建造了一个坚固的堡垒！” 军官握着彼得的手。\n“是啊，看着你们战斗真是过瘾。” 帕维尔笑着，双手叉腰，“你们这些人都是我们应该用来做钉子的材料！”"
 MAR_initial.20.a:0 "相互尊重是我们社会的立足之基。"
 MAR_initial.21.t:0 "国家的工业支持"
 MAR_initial.21.d:0 "经济部的主办公室里，工作正如火如荼地进行着。六位年轻的经济学专家正忙着画图、在笔记本上写字，并在桌上摊开的一张巨幅地图上标记着桦树林。尽管看起来有些混乱，但一切都在快速而准确地进行着。如此匆忙是因为发展计划必须在今晚经济部的闭门会议上提交。最终的批准将由柯西金亲自决定，他无疑会做出自己的调整。但在时间还来得及的时候，有必要尽可能多地进行规划…\n\n时钟指针接近9点的时候，阿列克谢·尼古拉耶维奇结束了一天的忙碌工作，来到了部里。他把鞋子留在衣帽间，走上楼，来到自己的办公室。那里已经聚集了3个人，他们将向柯西金汇报计划。他向他们打过招呼后，坐在自己的位置上，让他们展示他们准备的州长经济计划的主要论点。10分钟的解释很快就过去了，计划文件夹到了部长手中。与会者静静地坐着，等待着他的反应。他简要地看了看文件的申请，思考了一会儿，停顿了一下，然后开始回答。\n\n“同志们！我已经很好地理解了你们的提议，我必须说，你们的工作当然没有白费。你们所描述的以提高人民生活水平为基础的发展计划给我留下了深刻的印象，因为它表明了我们经济学家必须考虑人民的福祉，因为这正是国家的根本。我还想指出，你们观察到，吃饱喝足的人民工作效率更高。我相信，这一论点将成为经济增长的主要动力。首先，国家为人民提供保障，然后人民为国库提供保障。感谢你们所做的工作。我认为这个计划几乎已经准备好了，但我需要把它完善到完美。谢谢你们！”"
 MAR_initial.21.a:0 "相互尊重是我们社会的立足之基。"
 MAR_initial.22.t:0 "通向繁荣大道"
 MAR_initial.22.d:0 "维塔利迈着沉重的步伐，在别列兹尼基矿井的深处穿行。他的班次顺利结束，和同样疲惫不堪的工友们一起，他们缓慢地朝着地表移动。钻机、风镐和鹤嘴锄的噪音早已令人厌倦，此刻更像是苍蝇或蚊子嗡嗡作响，搅得人心烦意乱。终于，他们脚下的路开始向上倾斜，这是一个让每个人都振奋的好兆头。“电梯快到了。”有人在队伍末尾低声说道。果不其然，几分钟后，那扇不知疲倦工作的黄色电梯门出现在了远处。\n\n一切如同往常。冷水澡冲去一身的疲惫，换上干净的衣服，在矿工食堂里享用热腾腾的晚餐。维塔利狼吞虎咽地吃完，将餐盘放回，走向了等候的巴士。最后一班车在车站安静地等待着它的乘客。在回家的路上，维塔利终于支撑不住，沉沉睡去。还好，工友们及时叫醒了他，让他没有错过下车的时机。\n\n夜色吞噬了整个公交车站，只有一盏孤零零的路灯照亮了维塔利脚下的一小块人行道。周围的房屋漆黑一片，整个城市似乎都已沉睡，只有他独自一人，走向自己的公寓，去迎接那辛苦工作后应得的休息。钥匙轻轻触碰，打开了家门。再过一会儿，他就回到了那个温暖的港湾——公寓里，家人早已进入了梦乡。他小心翼翼地关上门，走进客厅，筋疲力尽地倒在沙发上，连衣服都来不及换下。矿井的景象在他眼前闪过，很快便消失在睡梦的深渊之中。"
 MAR_initial.22.a:0 "全国有太多像他这样疲惫不堪的工人。"
 MAR_initial.23.t:0 "流汗不流血"
 MAR_initial.23.d:0 "村庄的街道空无一人，大多数村民都在田间劳作。只有少数人像费奥多尔一样待在家里。他最近肩膀脱臼，无法工作，只能待在家中静养。看了看手表，他决定该吃午饭了。\n他从炉子里拿出汤，又找到一块面包。汤还冒着热气，这顿饭看起来一定格外美味。果不其然，饱餐一顿后，他正准备躺下休息一会儿，儿子却突然跑了过来。\n\n“小淘气，你跑来干什么？”父亲问道。\n“哦，只是想问你一个问题。”\n“那就问吧！”\n“您辛苦工作，还受了伤，到头来却几乎一无所获。这是为什么呢？”\n“哦，这可是个严肃的问题。你想让我告诉你全部真相吗？那就听好了：我年轻的时候，积极参与公共事务，非常认同卡津别克的理念。我和他一起经历了风风雨雨，是最亲密的伙伴。他看到了这一点，并鼓励我继续前进。但问题是，我不需要任何物质上的回报。我想要获得更多的东西。我想实现全人类的幸福，就像卡津别克所说的那样。他希望白军和红军能够和谐相处，人人都能丰衣足食。这就是为什么我们必须为人民的福祉放弃一切。然后我们就能和谐地生活在一起…”\n\n男孩听着父亲的话，他认真地听着每一个字，越来越被父亲的理念所感染。故事讲完后，父亲看着若有所思的儿子。突然，男孩抬起头，直视着父亲的眼睛，说道："
 MAR_initial.23.a:0 "“我也要帮助他人。”"
 MAR_initial.24.t:0 "索利卡姆斯克中央"
 MAR_initial.24.d:0 "索利卡姆斯克车站的中央枢纽永远处于喧嚣的动荡之中。刺眼的工业灯光下，工人们正将一袋袋货物装上列车，这些货物即将在“租借”名义下从索利卡姆斯克运往维亚特卡。所谓“租借”，不过是维亚特卡的工业巨头们以低廉的价格购买并出口别列兹尼基资源的幌子罢了。\n\n鲜有装卸工探究这地方政府与维亚特卡之间经济关系的猫腻。大多数人只是为了微薄的薪水而从事着繁重的体力劳动，事故也因此时有发生。但又能如何呢？他们自己选择了承担风险。终于，最后一批货物也被装上了车厢。列车长看了看时间，距离出发还有约莫半个小时。\n\n突然，广播里传来一声洪亮的呼叫：“列车长速到车站办公室！”他惊愕不已，一路小跑到了办公室。一位身材高大魁梧、身穿破旧西装的男人早已等候在那里。没有寒暄，男人开门见山地说：\n\n“你了解‘租借’吗？”列车长还没来得及开口，就被打断了：“算了，不用回答，不重要。重要的是，年轻人，我刚收到别列兹尼基发来的电报。电报上说，政府已经废除了这些所谓的‘租借’协议。也就是说，你不必再去维亚特卡了。”\n\n“那我该怎么办？”列车长一头雾水。\n“你把空车厢开回仓库就行了。卸货的事不用你操心，我的助手已经和工人们交代好了。他们完成工作后会拿到双倍工资。你只要等着就行。好了，你可以走了。”\n\n列车长满腹狐疑地走出了办公室。在走廊里思忖了片刻后，他决定回到装货区。那里再次响起了热火朝天的工作声，只不过方向反了过来。他始终没弄明白那封电报的含义，但他找到了坐在长椅上抽烟的助手。"
 MAR_initial.24.a:0 "他们进行了很长时间的建设性对话。"
 MAR_initial.25.t:0 "喋血车站"
 MAR_initial.25.d:0 "索利卡姆斯克车站的中央枢纽永远处于喧嚣的动荡之中。刺眼的工业灯光下，工人们正将一袋袋货物装上列车，这些货物即将在“租借”名义下从索利卡姆斯克运往维亚特卡。所谓“租借”，不过是维亚特卡的工业巨头们以低廉的价格购买并出口别列兹尼基资源的幌子罢了。\n\n鲜有装卸工探究这地方政府与维亚特卡之间经济关系的猫腻。大多数人只是为了微薄的薪水而从事着繁重的体力劳动，事故也因此时有发生。但又能如何呢？他们自己选择了承担风险。终于，最后一批货物也被装上了车厢。列车长看了看时间，距离出发还有约莫半个小时。\n\n突然，广播里传来一声洪亮的呼叫：“列车长速到车站办公室！”他惊愕不已，一路小跑到了办公室。一位身材高大魁梧、身穿破旧西装的男人早已等候在那里。没有寒暄，男人开门见山地说：\n\n“你了解‘租借’吗？”列车长还没来得及开口，就被打断了：“算了，不用回答，不重要。重要的是，年轻人，我刚收到别列兹尼基发来的电报。电报上说，政府已经废除了这些所谓的‘租借’协议。也就是说，你不必再去维亚特卡了。”\n\n“那我该怎么办？”列车长一头雾水。\n“你把空车厢开回仓库就行了。卸货的事不用你操心，我的助手已经和工人们交代好了。他们完成工作后会拿到双倍工资。你只要等着就行。好了，你可以走了。”\n\n列车长满腹狐疑地走出了办公室。在走廊里思忖了片刻后，他决定回到装货区。那里再次响起了热火朝天的工作声，只不过方向反了过来。他还没弄明白那封电报的含义，前方就传来了枪声。工人们的惊呼表明，枪声就来自他的列车附近。他急忙赶到骚乱现场，看到三名士兵正对着他的列车车厢射击。他从震惊中恢复过来，怒火中烧，正要从栏杆后面冲出去，但很快克制住了自己。车站保安迅速缴了士兵们的械。他走近这些闹事者，询问他们的情况。保安说他们是维亚特卡的士兵，来检查装货情况的，但得知“租借”协议被取消后，就决定攻击列车。他向工作人员道谢后，走向了那列刚刚遭到枪击的列车。"
 MAR_initial.25.a:0 "所喻何意？"
 MAR_initial.26.t:0 "维亚特卡的抗议"
 MAR_initial.26.d:0 "卡津别克呆坐在办公室里，望着窗外，却又像是两眼空洞，什么都没看进去。他满脑子想的都是刚刚发生的荒唐事。就因为几个蠢货士兵跑来“监督”装货，他现在不得不向弗拉基米尔解释这一切。为什么没人阻止这些士兵？为什么他们能轻易通过检查站？为什么他们能毫无阻碍地进入装货车间……太多疑问了，但答案只有一个：向弗拉基米尔交代。\n\n房间里的电话铃声响起，他不用猜也知道是谁——维亚特卡。弗拉基米尔那令人恼火却又故作圆滑的声音即将从听筒里传来，质问他到底发生了什么事。“我们能矢口否认吗？也许不是我们的人？也许……不，这太荒谬了。”卡津别克暗自思忖。但电话铃声不停地催促着他，提醒着他弗拉基米尔的来电，让他无法继续思考。“我必须冷静果断！”——当他的手不由自主地拿起听筒时，他终于清醒了过来。\n\n“我是卡津别克。”他平静地说道。\n“你好啊，亲爱的。”电话那端传来一个充满讽刺的声音，“我可没想到今天还得跟你通话，但形势所迫啊。”\n“形势？这完全是个天大的错误，弗拉基米尔。”\n“当然是错误，还能是什么。我敢肯定，这件事的始作俑者是我的手下。但你还是得给我解释清楚，为什么要逮捕我昨晚派去车站的督察？还有，你得解释一下，为什么要取消‘租借’协议？”\n\n一阵令人窒息的沉默。弗拉基米尔显然占了上风，他掌握了先发制人的权利，也拥有犯错的空间。而卡津别克只有一次机会做出回应。他必须谨慎选择自己的立场。"
 MAR_initial.26.a:0 "所有这些都是滔天的挑衅，资源将归于我们。"
 MAR_initial.26.b:0 "这都是我的下属们的错，特许权政策会恢复的。"
 MAR_initial.27.t:0 "卫兵的陷阱"
 MAR_initial.27.d:0 "索利卡姆斯克站的中心枢纽在不停地运转。在工业照明灯的照耀下，工人们完成了将袋子装上火车的工作，根据一项名为“特许权”的黑幕协议，这些袋子将从索里卡姆斯克运往维亚特卡。这项所谓的特许权赋予了维亚特卡的工业家们以荒唐的价格从别列兹尼基购买和出口资源的权利。\n\n然而，很少有装卸工深入研究该省与维亚特卡之间经济关系的细节。许多工人只是想通过艰苦的劳动来谋生，这往往会导致事故的发生。但他们又能做什么呢？他们自己同意冒这个险。但很快，最后一袋货物被装上了车厢。火车司机在等待确切的发车时间。离发车还有大约半个小时。\n\n不料，扩音器里传来一个声音： “列车长到站。快！”他完全惊呆了，过了一会儿就来到了办公室。办公室里坐着一位身材魁梧的男子在等他。但还没等他开口说话，三位身着卫兵制服的士兵就冲进了房间。\n\n“你们因叛国罪被捕！士兵们，抓住他！”领头的说。\n\n“等等，搞错了吧！我做了什么？”站长问道。\n\n“你被指控犯有叛国罪，因为你取消了弗拉基米尔三世陛下的特许权。你因这一反抗行为被捕！”\n\n“但下命令的人不是我，是一封电报！”\n\n“我对你为什么这么做不感兴趣，事实是你做了。现在滚出去！”\n\n他完全懵了，走回火车上，士兵们正在吆喝工人们加快装载剩余的麻袋。车间里充斥着咒骂声和喊叫声，直到他爬回驾驶室。"
 MAR_initial.27.a:0 "显然，一项重要行动刚刚失败了。"
 MAR_initial.28.t:0 "知足的工人便是幸福的工人"
 MAR_initial.28.d:0 "这种转变似乎持续了很长时间。同样的动作重复了几十次，甚至上百次。不断的爆炸声从四面八方传来，但这已成为家常便饭。为了提取哪怕是少量有价值的矿物，就必须对成吨的岩石进行加工，这本身就被认为是一种非凡的运气。\n\n但是，和往常一样，一天的工作即将结束，工人们成群结队地从错综复杂的隧道里爬上来，这些隧道的长度已经超过了几十公里，地质学家对其进行了研究，炸药爆炸后留下了许多痕迹。维塔利的工作日也即将结束。他对工作已经习以为常，并对自己作为组长的地位感到满意。但即使是他，也对必须完成的工作量感到惊讶。\n\n标准逐渐提高，包括工资和休假日。他试图向妻子解释这一切，但妻子仍然坚持让他辞职，因为他几乎没见过孩子，也不参与孩子的成长与教育。有时，他们的争吵会升级到威胁离婚的地步，但谁也没有付诸行动。父亲的过度劳累似乎会毁掉这个家庭，但有一天一切都改变了。\n\n傍晚的天空让玛丽娜平静下来，她在厨房里喝茶吃糕点。孩子们已经睡了，她也正准备上床睡觉。不料，前门打开了，一家之主走进了公寓。玛丽娜的惊讶无以复加。她站在门口，一句话也说不出来，这时她的丈夫高兴地叫了起来：\n“孩子们，爸爸回来了！”\n“你喊什么？他们已经睡着了！”母亲反对道。\n“哎呀，别这样嘛，但这一次我终于按时回家了，而且不是空手回来的！”\n\n说完，他从身后拿出一包沉甸甸的日用品。这时，孩子们跑出房间，抱住了父亲。惊讶的玛丽娜再次哑口无言，但也跑去拥抱丈夫。\n“维蒂亚，你从哪里得到这个的？”她高兴地问。\n“他们在加班时发的。作为组长，我得到的最多，大伙儿也都有，但也是因为是我加班最多，所有责任都在我身上。”\n\n他们平静下来后，就都坐在桌旁，开始为养家糊口的人准备晚餐。"
 MAR_initial.28.a:0 "国家记得它的孩子们。"
 MAR_initial.29.t:0 "国家之未来"
 MAR_initial.29.d:0 "清晨，清新的空气弥漫在校门口的小广场上，集会正在这里举行。一大批不久前还是无家可归和小偷的孩子，现在可以像其他人一样在学校学习了。当然，并不是每个人都想接受教育，但学校的主要目的是教育，然后是教书育人。\n\n然而，有一个班级因其纪律严明和安静而引人注目。那就是7年G班。班里的大多数学生都是普通孩子，只有少数几个是最近才分到这个班的。但班主任——一位名叫伊琳娜·康斯坦丁诺芙娜的年轻女老师仍因本学年突然涌入的学生而感到紧张。\n\n但很快大家都冷静下来，校长庄严地发表了讲话，阐述了教育的重要性，并表示现在人人都能接受教育。当然，柯西金政府对这次改革的贡献也不容忽视。很快，大会结束了，各班都回到了自己的教室。\n\n伊琳娜的7年G班就是其中之一。她的兴奋之情肉眼可见，所以副班长奥列格·伊格纳季耶维奇决定帮助她，‘护送’她的班级到礼堂。上课铃响后，大家都各就各位。在迅速检查了出勤情况后，她站起来说：\n“好了，同学们，现在我们要上一堂民防教育课。估计你们会有点问题，所以这节课我将告诉你们在紧急情况下需要采取的行动顺序。对了，你们都知道哪些紧急情况？\"”\n\n在得到几个答案后，她坐到讲台前继续上课。"
 MAR_initial.29.a:0 "现在，扫盲是一个可怕的梦想。"
 MAR_initial.30.t:0 "测试"
 MAR_initial.30.d:0 "丹是被直射到脸上的阳光唤醒的。虽然与外界的接触时间极短，但却摧毁了他所有的睡眠表现。他咕哝着从床上坐起来，看了看书架。现在还是早上6点。对平时的他来说有点太早了，对喜欢冒险的他来说却太晚了。但他今天有自己的计划。\n\n虽然他很不情愿，但还是经不住妈妈的劝说做完了练习题——妈妈说的话就意味着必须做。然后，他洗漱完毕，带着不满的表情来到厨房。一切都还没有准备好。水壶刚放在炉子上，平底锅正在煎着鸡蛋。他坐在桌前，又重读了一遍语文课本，只为躲避母亲的责骂。\n\n但时间过得很快，丹很快就吃完了早餐。在家里没什么事可做，于是他换了衣服，拿上学习用品，向学校走去。实际上，他今天并不想去学校，因为学校安排了他讨厌的民防考试。但由于父母的信任极限已经耗尽，很难再想出什么棘手的办法，他和朋友科里亚决定悄悄动身去村里，在那里度过一整天。\n\n计划似乎很完美。一些朋友被逃学者们收买，告诉了民防课老师伊琳娜·康斯坦丁诺芙娜他们和家人一起去了城里，所以不用担心逃学被发现的问题。再说，要找到他们也不容易，他们决定一起躲在村子后面湖边的一间老屋里。但最主要的问题还是——科里亚在哪儿？他没有在约定的时间出现。“真是个背叛我的好兄弟啊！”丹在心里咒骂着，突然尼古拉不知从哪儿冒了出来，说：“你还等啥呢？铃声马上就要响了。走吧！”\n\n于是，他们离开了村庄。走在土路上，他们聊着各种话题，说说笑笑。换句话说，计划很成功。一切都进行得很顺利，直到他们听到远处传来一阵奇怪的声音。他们停下脚步，侧耳倾听。声音很奇怪，与他们以前听到的任何声音都不一样。但令人恐惧的是，这声音正在迅速接近。很快，隆隆声停止了，似乎什么也没发生，突然，一声震耳欲聋的爆炸声在附近响起。接着又是一声，又一声！\n\n机身上印有十字架的飞机在天空中闪烁。“德佬来了！”科里亚大喊一声，沿着公路跑了起来。丹也吓了一跳，但他思绪万千，想起了民防课上伊琳娜·康斯坦丁诺芙娜说过的一小段话：空袭时，你应该躺在隐蔽的地方，用手捂住头。丹牢记这些简单的道理，立刻拽着朋友的脖子把他拖进了一个峡谷，两人都躺在那里。就在几秒钟之后，附近的建筑物被飞机上的炸弹炸毁。\n\n很快，噩梦结束了。飞机飞走了，但男孩们半小时都没有从潮湿的阴沟里出来，生怕噩梦重演。最后，他们意识到那里什么也没有，于是爬了出来。站在刚刚被炸毁的路上，看着附近被炸毁的工厂，他们都泪流满面。他们流着泪对彼此说："
 MAR_initial.30.a:0 "“我再也不逃学了。”"
 MAR_initial.31.t:0 "团结如一"
 MAR_initial.31.d:0 "塔玛拉·帕夫洛夫娜坐在临时搭建的避难所里。她早已告别了青春，剩下的只有待在家里，偶尔上街走走。唯有女儿阿丽娜是她生活中最后的希望。\n\n吱呀一声，前门开了。一个身穿旧军装的年轻女孩走了进来。老妇人从椅子上跳起来，不敢相信自己的眼睛，走向女儿：\n“阿丽娜，你穿的这是什么？”\n“这个？这是军装。好看吧？”\n“军装？你？你在说什么？快脱下来！”\n“我不脱。我要参军，保卫祖国。”\n“你疯了吗？那些官僚没有你也能应付得来。情况已经好转了，配给也增加了。你应该结婚，过平静的生活，而不是去参军！”\n“也许他们能应付得来，但如果每个人都决定待在家里，谁来保卫我们的国家？谁来站在敌人面前，保护他们的战友？谁来保护他们的父母免受敌人的攻击？这才是重点。”\n说完这些话，身穿军装的女孩转身离开了家。她的母亲明白了一切，决定不再阻止女儿。十分钟后，一名新学员抵达了部队。"
 MAR_initial.31.a:0 "十分钟后，一位孤独的老妇人在狭小的避难所里哭泣。"
 MAR_initial.32.t:0 "士官"
 MAR_initial.32.d:0 "为人民效力，成就一番伟业，这无疑是令人心潮澎湃的。当你投身其中，便会油然而生一股归属感，因为你正在为这个世界贡献力量。当阿丽娜终于成为一名正式的军校学员时，她心中正是这种感觉。考试对她来说毫无压力，相反，她还因为心系祖国而受到了嘉奖。\n\n在学校里，她也成为了众人议论的焦点。许多男学员对她的勇气和决心感到钦佩，但也有一些人认为女性在军队中是一种负担。每当他们看到阿丽娜，就会用各种惩罚来威胁她，但她始终保持着乐观和友善。然而，她还是不得不面对老兵欺凌的残酷现实。\n\n当她走过营房走廊时，一个大约四五十岁的男人突然抓住她的手臂，粗暴地命令道：“听着，趁现在没人，赶紧把地给我拖干净！”\n\n阿琳娜被他突如其来的言语惊呆了，愣了几秒钟，直到他粗暴地将她推倒在地。她试图站起来，却被他重重地用湿抹布盖住了头，耳边还传来他恶狠狠的声音：“快给我干活，好好表现，别想着在军队里白吃白喝！”\n“我才不需要表现！”阿丽娜反驳道。\n“你这个贱人！”他怒吼着，将她按在墙上。\n“你干什么！放开我！”\n\n但她的呼救声被彻底淹没。他用手捂住她的嘴，开始撕扯她的制服，突然，他的后脑勺遭到重击。短暂的沉默后，那名老兵重重地倒在了地上。另一名女学员出现在他身后，手里拿着拖把。新来者打破了尴尬的沉默，说道：“真是个混蛋！我们必须向指挥官报告！”\n“是…是的，我们应该…”阿丽娜整理好衣服，低声说道。\n“哦，抱歉，还没自我介绍呢。我叫奥丽娅。”\n“阿丽娜。”她简短地回答。\n“你认识他吗？”\n“不认识。”\n“好吧，我们告诉他们他在哪里，他们会找到这个宝贝的。”"
 MAR_initial.32.a:0 "寒暄之后，他们前往部队指挥官处。"
 MAR_initial.33.t:0 "帮助工人"
 MAR_initial.33.d:0 "窗外阴雨绵绵，给玛丽娜带来了悲伤。虽然由于增加了工资和奖金，他们的经济和生活状况有了明显改善，但这个家庭仍然濒临破裂。他经常在矿上工作，不遗余力，因为他诚实地为国家的利益和党的主张工作，但这也冒着生命危险。而孩子们只能和她相依为命。这种情况似乎会一直持续下去，直到她说出了“要么成家，要么工作！”而他将一直处于这个问题的真空状态。\n\n但一件事的发生彻底改变了他们之间的关系。他上晚班时又耽搁了。玛丽娜想等他一段时间，但他没有来。很有可能他又多上了一班，或者只是在那里睡着了，但是...... 不！他不是那样的人！他可以在矿上工作好几天，但他是个忠诚的丈夫。这些对话在她脑海中慢慢消失而陷入了沉睡。\n\n早晨的天气一如既往地阴沉。她起床穿衣，洗漱完毕，正准备去叫孩子们起床，突然发现厨房的桌子上放着一个盘子。她清楚地记得，晚上她已经把所有东西都收拾干净了，所以她决定去看看到底是什么情况。当她看到盘子里有她最爱吃的煎饼时，她更加惊讶了。而一束鲜花出现在她背后之时，这一切似乎是一种未知的力量造成的。她吓得差点摔倒，但站在她身后的维塔利接住了她。\n\n“维蒂亚？”她不禁问道。\n“早上好，亲爱的，”他递给她花束说。\n她仍然惊魂未定，说不出话来，直到他打断了沉默：\n“看，玛丽，他们在工作时给了我什么。”\n接过陌生的信封，他们小心翼翼地打开，读了起来：“14天休假通知。”她欣喜若狂，搂着丈夫悄悄地说："
 MAR_initial.33.a:0 "“谢谢你。”"
 MAR_initial.34.t:0 "科技奇迹"
 MAR_initial.34.d:0 "工厂里出现了异常的骚动，他可能是在工厂开业时才看到的。造成这种骚动的原因是，今天他们要交付旨在改进工作的新设备。在这样一个重要的时刻，公司负责人甚至来到工厂，为工人们剪下红丝带。\n\n从早上开始，大家就在等待工程思想的奇迹和重要官员的到来，午餐时间更是达到了高潮。工人们聚集在工厂办公室门口，迅速将到来的厂长团团围住。他也很快开始了讲话：\n工人同志们！今天，你们将使用最现代化的机器，它将带领我们的工厂在生产和技术方面达到一个全新的水平。我希望你们能够打破别列兹尼基现有所有企业的记录。万岁！\n\n人群中不约而同地响起了克拉斯诺夫的“万岁”。但很快，他就因为自己的事情离开了，只留下工人们和新机器在一起。这台机器看起来很严肃，在场的人看着它都有一种力量感。似乎只要有了它，生产能力就能提高两倍。但是，工人们还有一项更艰巨的任务——掌握并学会使用它。这项任务已经难上加难。\n\n但为此，车间专门配备了一名经验丰富的工程师，并要求他在两周内完全教会车间工人操作。起初，一切都很顺利，但后来的几次冲突彻底破坏了老师与学生的关系。因此，他不得不在一周后才离开，结果，课程就没有完成。"
 MAR_initial.34.a:0 "这哪会出问题？"
 MAR_initial.35.t:0 "事故"
 MAR_initial.35.d:0 "从第三车间主任I.Yu.福基娜给厂长R.V. 叶戈罗夫的信。\n\n“周三18:13时，3号车间新机器105 RNA发生事故。这名工人当时正坐在机器旁，机器突然进入紧急模式并停机。当他试图查明停机原因时，却严重违反了多项安全规定。在检查过程中，机器很快恢复了正常模式。工人来不及收回检查触点和连接的手，就遭到致命电击。救护车确认A.N.帕尔费诺夫已经死亡。由于短路，机器内部线路起火，导致无法修复的故障。我请求进一步指示。”\n\n从厂长R.V. 叶戈罗夫给第三车间主任I.Yu.福基娜的信。\n\n“由于工厂发生事故，我要求在情况完全查明之前，停止所有105 RNA型机器的流通，并对工人进行再培训，以便继续工作。死者A.N.帕尔费诺夫应交由其家人安葬，并向他们支付100卢布的赔偿金。据我所知，这起事件是由于不遵守安全规定而发生的，因此我要求加强这些安全措施，特别是强制佩戴橡胶手套，并在每个车间配备能提供及时援助的医疗小组。我希望今后不再发生此类事件。”"
 MAR_initial.35.a:0 "智者从他人的错误中汲取教训。"
 MAR_initial.36.t:0 "开设工人学院"
 MAR_initial.36.d:0 "夏天过去了。阿尔特姆终于可以自由地呼吸了。暑期班早已过去，像一场可怕的梦一样从记忆中消逝，前方是光明的未来。至少他是这么想的，因为他决定冒一次险：向别列兹尼基电工技术学院几乎刚刚成立的教研室递交自己的材料。\n\n这个决定出乎他的意料，但却让他信心十足。在报纸上读到这一事件后，他决定应该考虑这一选择，因为10年级结束时已经明确暗示要选择一些有学院的大学。在考虑了所有可供选择的方案后，他得出的结论是，他唯一正确的选择就是进入工人学院，在那里他将接受一流的技工培训。此外，学习对他来说出奇地轻松。这就意味着，如果出了差错，他可以很容易地转到另一个院系。\n\n9月1日，阳光明媚，这是到技术学院学习的第一天。今天，他们本应全面熟悉教师、班级和其他一切有助于或阻碍他们在大学五年学习的琐事。但首先，每个人都被集中到了不同的教室，各院系被分隔开来。阿尔特姆就在其中一间教室里。\n\n他热切地倾听着高个子男人和女人所说的一切，尽量不被周围的嘈杂声所干扰。他似乎是全场最感兴趣的人。就连老师们也没有阿尔特姆这么大的热情。他迫不及待地要研究这座建筑的里里外外，因为他真的挺想研究的。当然，这种行为并没有被忽视，叫做英娜·格里戈里耶芙娜的教研室主任很快走到他身边，把他领到一边。她对他说："
 MAR_initial.36.a:0 "很显然，你将成为一个伟大的人。"
 MAR_initial.37.t:0 "学士"
 MAR_initial.37.d:0 "夏天过去了。阿尔特姆终于可以畅快地呼吸了。尽管课程很快就结束了，但他还是尽可能地多待一会儿，以便吸收更多的知识。在第五年，也就是最后一年之前，他几乎有整个七月的时间来放松和休息。他似乎应该尽情放松和享受，但他却日夜不停地为他的项目工作。\n\n一天傍晚，正当阿尔特姆孜孜不倦地写写算算时，有人敲门。他有点纳闷，以为自己听错了，但刚一回到工作岗位，敲门声又响了起来。他从书桌前站起来，穿过黑暗无光的走廊，来到走廊上，打开了前门。\n\n门后是阿尔特姆的老师英娜·格里戈里耶芙娜和两个不认识的人，一个年长，另一个年轻气盛。\n“晚上好，阿尔特姆。”英娜·格里戈里耶芙娜对她最好的学生说。\n“您也晚上好。”他迟疑地说。\n“我们可以进来吗？” \n“哦，当然，请进。”\n\n在年轻学生公寓的厨房落座后，这位女士开始了谈话：\n“阿尔特姆，我有重要的话要跟你说，你也猜得到，这些可爱的人可不是来做样子的。哦，对不起，我忘了介绍他们：这是伊万·卡尔洛维奇·罗伯什尼，这是他最好的学生瓦西里·乌克诺夫。伊万·卡尔洛维奇有一个非常有趣的提议。请听听吧。”\n“谢谢。你好，阿尔特姆。全城都在传你的事，他们说你是整个学院最优秀的学生之一，就像曾经的瓦夏一样。我有个非常有趣的建议给你，基于你的知识和能力，还有你对学习的热爱，我不得不问你一个问题...”"
 MAR_initial.37.a:0 "“你愿意转入研究所吗？”"
 MAR_initial.38.t:0 "回望"
 MAR_initial.38.d:0 "夜色渐深，城市的光芒也愈发耀眼。卡津别克站在敞开的窗前，手里夹着一支香烟，静静地注视着这光影变幻，思绪飘忽。\n突然，一阵敲门声打破了他的沉思。\n\n“进来。”他低声说道。\n尽管他的声音很轻，但年久失修的门轴还是发出刺耳的“吱呀”声。一个身着学生制服的年轻人走了进来，怀里抱着一摞厚厚的报告。\n“晚上好，卡津别克同志。”年轻人有些局促地说道。\n“你好。”别列兹尼基的首脑语气严肃地回应。\n“这是柯西金计划的报告，我应该把它放在哪里？”\n“放在桌子上吧。现在是什么时间？”\n“现在是晚上九点半。”\n“好的，你可以走了。”\n\n卡津别克又深吸了一口烟，感到一阵寒意。片刻之后，他掐灭了香烟，将它放入窗台上一个精致的刻面烟灰缸中。他关上窗户，坐到椅子上，开始专心研读文件。各种企业和采掘业的报告在他眼前闪过。粗略地浏览了一下文件夹，他便得出了几个令人惊讶的结论，甚至超出了他本人的预期。但最让他震惊的是最后一批文件，根据上面的印章，这些文件是柯西金亲自撰写的。报告中提到了惊人的计划成果、工业增长和未来前景。在仔细研究了这位经济部长提交的整份报告后，别克合上了文件夹，空气中顿时弥漫着灰尘。\n\n突然间，他的思绪回到了同一间办公室，但时间却是一年前。同样的室内装饰，同样的人员送来成堆的各种文件。但有一个根本的区别，乍一看很难察觉：那就是弥漫在空气中的绝望情绪。经济、人民、政府机构，甚至别克本人，都笼罩在一片绝望的氛围中。但现在，看着别列兹尼基街道上明亮的路灯，他知道，那些艰难的岁月已经过去了。"
 MAR_initial.38.a:0 "是时候向前看了。"
 MAR_initial.39.t:0 "这根本不像一支军队！"
 MAR_initial.39.d:0 "上午将近结束的时候，别克和别洛泽尔斯基之间的紧急会议终于得以举行。正如别克在电话中告知国防部长的那样，一个至关重要的国家安全问题必须得到解决。后者在电话里嘟囔着日程繁忙之类的话，但最终还是同意了这次会面。现在已经接近十二点半了，别洛泽尔斯基却还没露面，尽管他应该在一个半小时前就到了。\n\n但最终，办公室的门被一阵敲门声打破了寂静。\n\n“进来。”别克简短地说道。\n“你找我什么事？”谢尔盖还没等打招呼就脱口而出。\n“你今天怎么这么紧张？”\n“这不明摆着吗？你心里清楚得很，别再跟我兜圈子了，求你了。我还有很多急事要处理。”\n“好吧，我们开门见山吧：我想和你谈谈军队改革的问题。”\n“又来了。我都说倦了，我们根本无力改革军队，这于事无补。”\n“先别急着否定，我们必须采取行动。为此，我有两个方案。”\n“说说看。”\n“我们可以借鉴过去俄国战争的经验，尝试进行重组和重整军备。这会得到民众和军队的支持，但这是一条漫长且不可靠的路。”\n“那第二个方案呢？”\n“我们可以利用我们以前的中情局网络，向山姆大叔求助。这样一来，军队的素质和装备都会得到极大提升，但我们必须做出一些让步，而且可能会花费巨额资金。选择权在你手里。”"
 MAR_initial.39.a:0 "时机将至，吾等必须行动！"
 MAR_initial.40.t:0 "跃过大洋"
 MAR_initial.40.d:0 "晨曦初露，英吉利海峡在熹微的曙光中缓缓浮现。波光粼粼的海面反射着阳光，刺得亨利睁不开眼。为了躲避这耀眼的光芒，他只好将桌子挪离窗户。一番折腾后，他开始后悔自己的决定，但如果再搬回去，就意味着又要费力地挪动这该死的家具了。\n\n最后，他终于安顿下来，平静地投入工作。作为中央情报局驻布列塔尼的负责人，他掌管着该地区许多黑市事务，大量信息经由他传递。但今天却出了点岔子。一个电话打断了他手头的工作，迫使他前往电话亭接听。\n\n“你好。”亨利简短地说。\n“嘿，亨利，我是路易斯。有条跨洋电缆电话找你。”\n“然后呢？我今天很忙，昨天就告诉过你了。”\n“我完全理解，但这是总部打来的，尽快过来吧。”\n“该死。好吧，我马上就到。”\n\n在这个对话中，“总部”意味着电话是通过一条秘密通讯电缆从美国打来的。尽管有自己的安排，但亨利别无选择，只能换好衣服前往情报站接听电话。清晨的空气温暖宜人，但海岸的风却很猛烈。他很快开车来到郊区，中央情报局的电话亭就设在那里。几分钟的沉默让亨利平静下来，然后，布雷恩上校粗犷的声音从听筒中响起：\n“是亨利吗？”大西洋彼岸的声音问道。\n“除了我还能是谁？”他讽刺地回道。\n“你在跟我开玩笑？”对方的声音变得愤怒起来。\n“抱歉，我是亨利，确认无误。”\n“那就好。听着，这是一件严肃的事情，但并不困难，你能处理好的。”\n“太好了。这次是什么事？”\n“你需要运送一批武器到…别列兹尼基…那里。”\n“哪里？”\n“别—列—兹—尼—基，在俄罗斯。我们以前的同志在那里。他们看在老交情的份上，向我们请求武器援助。”\n“该死，布雷恩，你应该知道向俄罗斯运送武器是一场零和游戏。我们可能会搞砸一切！”\n“所以我们才把这件事托付给你，黑市中最优秀的人才之一。把那里的一切都安排妥当，今晚汇报情况，祝你好运。”\n“该死的，你这狗娘养的！”\n\n但这声怒吼很快便消散在清晨宁静的大自然中。"
 MAR_initial.40.a:0 "他独自站在电话亭里。"
 MAR_initial.41.t:0 "幸运女神的战争"
 MAR_initial.41.d:0 "卡车队在颠簸的道路上行驶，每一次颠簸都会造成颠簸。但几乎所有的乘客都没有注意到这一点，而是平静地做着自己的事情：有人在清理武器上堵塞的污垢，有人在给不幸的战友讲故事，甚至有人在每隔十秒钟的颠簸中还能睡着。路一直在延伸，似乎没有尽头，也没有边际，他们别无选择，只能等待......\n\n但有一天却不同寻常。典型的俄罗斯风景被村庄和小镇所取代。最后，在下半天，纵队进入了一座城市。在欣赏这座城市时，他们对俄罗斯人的发展水平感到惊讶，因为他们以为俄罗斯只是被第三帝国的战火烧成灰烬的过去的辉煌。在中心广场下车后，车长说：“欢迎来到别列兹尼基！”\n\n在那里，一小群人，从他们的制服就能看出来，大概是士兵，已经在等着他们了。最后，大约100名美国雇佣兵从八辆卡车上下来，一周的旅途让他们疲惫不堪。尽管疲惫不堪，他们还是站成一排，向来自别列兹尼基的战友们问好。部队指挥官金带着一名翻译走出来，与欢迎队伍的负责人交谈。\n\n“在别列兹尼基向您问好！”别洛泽尔斯基开始道。\n“祝您身体健康，同志！”翻译说。\n“我看，你已经准备好到俄罗斯深处去服役了！”\n“没错！”\n“很好，但我想亲自去见一下有关人员，很抱歉用了同义词。”\n“没什么好担心的。我只想知道你的名字。”\n“哦，对不起，我忘了。我叫谢尔盖·谢尔盖耶维奇·别洛泽尔斯基。”\n\n不料，美国人的匀速队形中突然冒出几个脑袋。看着国防部长，他们都很紧张。司令官正准备对部下大喊大叫，不料却被别洛泽尔斯基亲自打断。\n\n“我的天啊！弗雷德！还有吉尔伯特！”\n\n谢尔盖热情地拥抱着对方，试图解释情况。原来，这些都是他在英国战争时期的老熟人。他已经放弃了再见到他们的希望，而在这里却发生了这样的幸福。别洛泽尔斯基和他的战友们匆匆告别了到来的客人，让他们听任别列兹尼基部队的命令，自己则赶往汽车，用几个小时的时间热烈地畅谈往事。"
 MAR_initial.41.a:0 "多年之后，又会发生怎样的会面？"
 MAR_initial.42.t:0 "欺诈之果"
 MAR_initial.42.d:0 "卡车车队行驶在满目疮痍、人去楼空的俄罗斯公路上。货物通过布劳希施塔特港口运抵这里，当地的码头被中情局欧洲办事处收买。现在，这批货物正穿过焦黑的荒地，向别列兹尼基运送物资。但在结束这些冒险之前，车队必须通过整个行程中最关键的考验之一——维亚特卡海关官员。\n\n由于省长的一些激进行为，弗拉基米尔和卡津别克之间的信任严重恶化，这加强了边境的各级管制。由于担心走私和准备向别列兹尼基的增援，弗拉基米尔下令检查所有前往别列兹尼基的车队。这一因素成为成立“美国移民人道主义特派团”的决定性因素。\n\n检查站出人意料地从浓雾中出现。这是一个由几座建筑组成的综合体，在这里必须进行几个阶段的检查。由于风险很高，所以决定不行贿，可以说是完全清白。在拦截车队后，海关官员决定跟随主车队一起检查。当他们再往前走时，只看到了顶部装载的尸体和堆在一起的箱子。\n\n但后来他们来到了一辆半空的汽车旁，海关官员决定爬进去亲自检查一下。对车内物品的简单检查（如果可以这么说的话）让两位司机兴奋不已。当一名士兵把其中一个箱子从顶部拉到车身地板上并要求打开时，这次冒险显然要泡汤了。大家屏住呼吸，静静地站着，看着箱子的盖子慢慢打开。似乎有什么不可逆转的事情即将发生。在心理上，每个人都在说再见，即使不是与生命告别，也肯定是与自由告别......\n\n但出乎意料的是，这名士兵从箱子里拿出了一本儿童读物和一罐美国炖肉。他拿着自己找到的东西，感谢他们的礼物，并说他们可以过去了。"
 MAR_initial.42.a:0 "他们的运气似乎无法用语言来形容。"
 MAR_initial.43.t:0 "现在你在军队中了"
 MAR_initial.43.d:0 "雨点敲打着尼古拉所在的三层综合医院大楼的屋顶。他坐在32号房间对面的走廊上，捻着一张写有文字的纸：“4号综合诊所，星期六，11点。我们会找到你的。”\n\n他是在师部研究所的一次讲座后收到这张纸条的。尼古拉聪明过人，体格健壮，是整个课程中的佼佼者。\n\n他不明白纸条上的意思，但还是决定来到聚会地点，等待很可能写下这篇文章的某个公民。今天是星期六，没有其他事情可做，所以没有其他课程受到影响。但时间一分一秒地过去了，一个人也没有出现。他在看书，没有注意到旁边坐着一个人。\n\n“你在等什么，同志？”陌生人问道。\n“我? 嗯...我在等我的朋友。他在这里的检查室。”尼古拉撒了个谎，认为暴露真实意思是个错误。\n“哦，等朋友？他刚才让你陪他去。你愿意吗？”\n“行。”他说。终于明白这正是他要等的人。\n\n很快，他们离开了综合医院，向某个地方走去。他什么也不想问，因为他不知道“游戏的规则”，只是默默地同意了领队的话。就这样，他们来到了广场旁的一座房子前。走进房子，尼古拉想问个问题，但还是忍住了。他的理由是：'破坏这个阴谋不值得'。他们上了二楼，进入一间典型的公寓，来到厨房。\n\n“喝茶吗？”陌生人问道。\n“不用了，谢谢。”\n“那好吧。”\n“对不起，我能问您几个问题吗？”尼古拉问。\n“不需要。我得先问你问题。那么，我是中情局特种部队驻别列兹尼基训练新人员的代表，我想你会非常适合那里的工作。”\n“中情局？那么，我没理解错吧，你是让我加入特种部队，在那里接受训练？”\n“没错，年轻人。你的身体和心理条件都很适合。决定权在你。”\n“给我五分钟。”\n“请吧。”\n\n思绪漫长而矛盾，但尼古拉终于准备好给出答案了："
 MAR_initial.43.a:0 "我同意！"
 MAR_initial.44.t:0 "以错为鉴"
 MAR_initial.44.d:0 "“同志们！我们今天的主要任务是制定新理论的基本原则！为此，我把你们请到这里来，因为我们需要研究过去几年的著作，以获得最完整的策略清单。正如列宁所说‘学习！学习！再学！’”\n\n别洛泽尔斯基用这句话开始了在别列兹尼基陆军总部的会议。从文中可以看出，军队新理论的主要概念就是在这次会议上形成的。为了研究过去几年的大量著作，会议邀请了拜尔利部长的老熟人、前苏军军官阿纳托利·瓦维洛夫。别洛泽尔斯基相信，他对苏军的了解无疑会对制定理论有所帮助。\n\n然而，学习的过程是乏味而漫长的，会议很快变成了图书馆里的一个夜晚。完全的寂静伴随着书页翻动的声音和写字的笔声。书本被一本本翻过，从每本书中提取出一些思考，但即使是这一卷书也提供了大量信息，必须以新的方式进行结构化和重新思考。\n\n临近午夜，军队的读本堆成了几何级数，弹药——书本已接近尾声。别洛泽尔斯基、拜尔利和瓦维洛夫带到会场的笔记本已经被密密麻麻的笔记严重填满，这是个好因素——信息越多，新的军队理论就会建立得越准确。但最后，三人都坐在了高高的书堆旁，他们刚刚读过的书。\n“好吧，我建议对会议进行总结。”部长说。\n“我同意您的意见。”拜尔利说。\n“我也一样。”瓦维洛夫简短地嘟囔道。\n“由于收集到了大量材料，我建议将这些材料交给文件部，由他们进行整理和理解。之后，我会再召集大家进行最后的审查，大家同意吗？”\n\n“都”点了点头。"
 MAR_initial.44.a:0 "耐心和努力终会有回报。"
 MAR_initial.45.t:0 "哥萨克同志"
 MAR_initial.45.d:0 "“很抱歉，谢尔盖·谢尔盖耶维奇临时有急事，无法亲自接待您了。”拉夫里年科一边说着，一边向已经退休数月的佩佩利亚耶夫伸出了手。\n\n“好吧，既然如此……我也听说了，德米特里·费奥多罗维奇，您接替了我的职位，成为了哥萨克部队的指挥官。顺便问一句，他们现在怎么样了？”佩佩利亚耶夫笑着问道。\n\n“您也知道的，阿纳托利·尼古拉耶维奇，时代在飞速发展，我们不得不解散了传统的哥萨克骑兵部队。用时髦点的话说，我们让他们‘下马’，换成了另一种更现代化的‘坐骑’。”\n\n佩佩利亚耶夫若有所思地看了看自己的这位继任者，问道：\n\n“我猜，您说的是坦克吧，德米特里·费奥多罗维奇？”\n\n“不，阿纳托利·尼古拉耶维奇，我们把他们改编成了摩托化步兵。”\n\n“那你们把那些马都送到哪儿去了？”佩佩利亚耶夫问道。\n\n拉夫里年科停顿了片刻，答道：\n\n“我们把它们都送到了当地的赛马场。谢尔盖·谢尔盖耶维奇认为，把这些马匹投入到民用领域才是更明智的选择，毕竟它们都是些良种马。何必让它们去战场上白白送死呢？”\n\n阿纳托利沉思了片刻，说道：\n\n“好吧…德米特里·费奥多罗维奇，您不介意带我参观一下您手下这些焕然一新的哥萨克部队吧？”"
 MAR_initial.45.a:0 "我们都是同胞。"
 MAR_initial.60.t:0 "老将军的落幕"
 MAR_initial.60.d:0 "“您不再考虑一下吗？在当下这个节骨眼上，像您这样的人才离开，对我们来说是无比沉重的损失。”谢尔盖·别洛泽尔斯基说道，目光在佩佩利亚耶夫和他手中的辞呈信上来回逡巡。\n\n“谢尔盖·谢尔盖耶维奇，事情远比您看到的要复杂，”佩佩利亚耶夫回答道，“我之所以写下这份辞呈，有我自己的理由。而且我可以坦率地告诉您，除了我已年近古稀之外，还有其他重要缘由。”\n\n“哦？说来听听。”\n\n佩佩利亚耶夫从椅子上起身，缓步走向位于别洛泽尔斯基桌侧的窗户。\n\n“就拿我手下的这些部队来说，他们根本就不把我当成他们的指挥官！而这一切都源于一个再简单不过的原因——我从来就不是一名哥萨克！您说说看，一个从来就不是哥萨克的人，又怎么能够指挥那些从骨子里就不认同他的哥萨克部队呢？！”\n\n别洛泽尔斯基静静地听完了他的话，沉重地叹了口气，说道：\n\n“唉，罢了罢了，随您去吧。从今天起，您就可以正式享受退休生活了。”说着，他在那份辞呈信上签下了自己的名字。\n\n当佩佩利亚耶夫离开办公室后，谢尔盖·别洛泽尔斯基拨通了卡津别克的电话，并在电话接通后说道："
 MAR_initial.60.a:0 "“亚历山大·利沃维奇，我们需要谈谈关于哥萨克的问题.....”"
 MAR_initial.46.t:0 "往日不再"
 MAR_initial.46.d:0 "'苏沃洛夫'行动从根本上说是有缺陷和致命的，因为它是出于对德国和苏德战争失败的报复和仇恨而制定的。在我看来，这是红军领导层的主要错误，他们没有把重点放在行动的准备上，而是放在复仇的成果上。\n\n说完这些话后，办公室里一片寂静，只有时钟的滴答声打断了他们的谈话。吉尔和别洛泽尔斯基看着在角落里来回踱步的伏龙芝，思考着他的话。他们现在正聚集在军事学院的一个房间里，讨论西俄战争以及一方失败、另一方胜利的原因。\n“是的。”伏龙芝说，“此外，我还可以说，如果领导层能够正确处理一切，而不是随心所欲，那么我们很有可能看到苏联的重生。”\n“同事，恐怕我得让你失望了。”别洛泽尔斯基回答道，“在我看来，你的观点过于积极和乐观了。毫无疑问，苏军本可以避免这样的失败，甚至可以说服柏林坐到谈判桌前。但这里有一个重要的细节——国防军。虽然我不是历史学家，但我仍然认为，至少布尔什维克没有足够的装备来如此毁灭性地击败德国人。他们的技术是相当先进的，如果有协调和正确的领导，他们本可以进行足够的抵抗。”\n此外，我们不应忘记红军队伍中的持不同政见者。我希望没有人会争辩说，德国巧妙地招募了各种俄罗斯人物，他们随后在军队战备崩溃中发挥了重要作用。弗拉索夫、各种小官员和其他叛徒成功地破坏了整个组织和战斗准备，导致我们重蹈鲍里斯·戈东诺夫统治时期的覆辙。\n伏龙芝说，“我们每个人对西俄战争都有自己的观点。我们不应该否认，每个人都有对的地方，也有错的地方。这不值得我们之间再讨论了。其实内核很简单：红军的失败是由许多因素造成的，遗憾的是，我们无法也不愿看到这些因素。但同志们，让我们干杯...："
 MAR_initial.46.a:0 "“让我们举杯畅饮，确保别列兹尼基不再重蹈覆辙！”"
 MAR_initial.47.t:0 "帝国官僚"
 MAR_initial.47.d:0 "寒意料峭的清晨降临在别列兹尼基郊外的第61团驻地。尽管太阳早已爬上了天空，将金色的光辉洒满了营房的每一个角落，但这却并非唤醒士兵们的闹钟，他们在晚上10点熄灯号响过后便已进入了梦乡。沉重的脚步声在地板上吱嘎作响，由远及近。很快，脚步声戛然而止，紧接着，一声响遏行云的“起床号”在营房中炸响：“起床！”\n战士们以迅雷不及掩耳之势从床上弹起，手忙脚乱地穿戴整齐，然后争分夺秒地整理床铺。尽管想要在短时间内完成这一系列动作绝非易事，但他们丝毫不敢怠慢，因为连长的咆哮声正在无情地鞭笞着他们的耳膜：\n“快点，都给我快点！你们的时间可是金子！现在还是和平时期，要是真打起仗来呢？难道你们还想像现在这样磨磨蹭蹭的吗？啊？！”\n\n幸好，所有的战士们很快就排成了一列整齐的队伍，严阵以待，随时准备执行连长的命令。那些早已烂熟于心的口令被他们以近乎本能般的迅速执行完毕。随后，队伍被带往盥洗室进行“洗漱”。冰冷的水，寒冷的空气，起床后战友间那冷淡的关系——这一切都营造出一种令人感到压抑，但对每个士兵来说又无比熟悉和亲切的氛围。\n\n战士们在盥洗室并没有逗留太久，他们很快就再次列队，不过这一次是在操场上。连长来回踱步，嘴里叼着一根香烟，烦躁地咀嚼着。很明显，接下来将有重要的事情发生。终于，一辆汽车从远处驶来，在广阔的水泥操场另一端逐渐显现，并朝着队伍快速驶来。几分钟后，汽车在连队前稳稳停住。一名年约25岁的年轻军官从车上跳了下来，脸上带着轻松愉快的笑容，向连长打着招呼。\n“早上好，阿尔希诺夫同志，”他说道，一边将手举到额前敬礼。\n“你好，希普佐夫同志，稍息，”连长回礼。\n“那么，”希普佐夫转向士兵们说道，“早上好，同志们！”\n“早上好，希普佐夫同志！”响亮的回答声在操场上空回荡。\n“请允许我向大家介绍，阿法纳西·伊格纳季耶维奇·希普佐夫同志，他将担任我们这支，恕我直言，有些令人头疼的连队的政委。从今天起，他将负责鼓舞你们的士气，并指导你们树立正确的国家观和价值观。如果你们对这些方面有任何疑问，都可以向他请教。好了，有什么问题吗？”"
 MAR_initial.47.a:0 "没了，阿尔希诺夫同志！"
 MAR_initial.48.t:0 "黑天鹅"
 MAR_initial.48.d:0 "绝密。致亚历山大·卡津别克党魁：\n\n快速反应小组完全按照您的指示准备就绪，并已接受速成培训。黑天鹅行动的所有组织方面均已准备妥当。如果您决定开始行动，您需要给我打电话并说出暗号。该暗号将通过我们的谈判代表传递。我将有义务执行您的命令。静候您的指示。\n\n国家安全局局长，弗拉基米尔·吉尔\n这份附有黑天鹅计划完整描述的说明被呈递了上去，该计划涉及清除维亚特卡教官。几天后，在午餐时间，一个看似普通的办公室职员走近别克，在他耳边低语：“暗号是马克思主义”，然后迅速消失在人群中。一切都准备就绪，可以开始行动了。剩下的就是等待别克的命令。而命令也如期而至。\n\n在一个周五的深夜，当教官们应该聚集在他们部队的总部讨论局势时，别列兹尼基市中心的某个地方响起了一阵电话铃声，只说了一个词：马克思主义。毫无疑问，吉尔向特种部队指挥官下达了执行计划的命令。黑天鹅行动开始了。\n\n在几十秒内，别列兹尼基几个月来一直在准备的团和师总部里响起了一曲交响乐。来自中央情报局同志提供的催泪瓦斯手榴弹被闪电般地使用。弗拉基米尔的同伙试图做些什么，但为时已晚。所有建筑物都经过了里里外外的搜查，但在那个晚上，没有一个教官能够逃脱国家安全局小队的协调和专业的行动。\n\n深夜，亚历山大·卡津别克办公室的电话意外响起。\n“你好，”他漫不经心地回答。\n“我必须说，我对你的行动感到震惊和惊喜，”弗拉基米尔的声音从电话的另一端传来。\n\n“听到你说这样的话…真是出乎意料，”卡津别克大吃一惊。\n“别担心，你的技巧真的给我留下了深刻的印象。这是一次完美的行动。”\n\n电话那头沉默了片刻，终于说出了最后一句话："
 MAR_initial.48.a:0 "我不得不认输了。"
 MAR_initial.49.t:0 "黑天鹅"
 MAR_initial.49.d:0 "绝密。致亚历山大·卡津别克党魁：\n\n一支经过速成训练的快速反应小组已按您的指示准备就绪。“黑天鹅”行动的所有组织工作均已准备完毕。如果您决定开始行动，您需要联系我并提供暗号。暗号将通过我们的联络员传递。我将有义务执行您的命令。静候您的指示。\n\n国家安全局局长，弗拉基米尔·吉尔\n\n这份附有“黑天鹅”计划完整描述的说明被呈递了上去，该计划涉及清除维亚特卡教官。几天后，一名看似普通的办公室职员在午餐时间走近别克，在他耳边低语：“暗号是马克思主义”，然后迅速消失在人群中。一切都准备就绪，可以开始行动了。剩下的就是等待别克的命令。而命令也如期而至。\n\n在一个周五的深夜，当教官们应该聚集在他们部队的总部讨论局势时，别列兹尼基市中心的某个地方响起了一阵电话铃声，只说了一个词：马克思主义。毫无疑问，吉尔向特种部队指挥官下达了执行计划的命令。“黑天鹅”行动开始了。\n\n几分钟之内，预先协调好的战斗小组迅速而悄无声息地渗透到据信教官所在的建筑物中，并展开突袭。通过与美国人的旧关系获得的最新技术的使用极大地简化了任务。但是，随着现场信息的出现，出现了差异。各地都传来报告称，并非所有维亚特卡“六人组”都被拘留。\n\n尽管有这些因素，但主要目标已经实现。但别克被一种不安的感觉所困扰。似乎有什么东西被忽略了，一些信息碎片落入了弗拉基米尔手中。但仍然有可能这只是一个巧合。不幸的是，当午夜电话响起时，这些恐惧得到了证实：\n\n“我听着呢。”\n“嗯，首先，祝你晚上好，亚历山大。其次，我想对你说同样的话：我听着呢。”\n“你什么意思？”\n“别装傻了，萨沙。我们都知道发生了什么事。你到底对我的人做了什么？”\n“老实说，我完全不明白你在说什么。”\n“我不想也不会装疯卖傻。但我要求你解释清楚！”"
 MAR_initial.49.a:0 "我不会改变主意的。"
 MAR_initial.49.b:0 "我们必须撤退了。"
 MAR_initial.50.t:0 "黑天鹅"
 MAR_initial.50.d:0 "绝密。致亚历山大·卡津别克党魁：\n\n一支经过速成训练的快速反应小组已按您的指示准备就绪。“黑天鹅”行动的所有组织工作均已准备完毕。如果您决定开始行动，您需要联系我并提供暗号。暗号将通过我们的联络员传递。我将有义务执行您的命令。静候您的指示。\n\n国家安全局局长，弗拉基米尔·吉尔\n\n这份附有“黑天鹅”计划完整描述的说明被呈递了上去，该计划涉及清除维亚特卡教官。几天后，一名看似普通的办公室职员在午餐时间走近别克，在他耳边低语：“暗号是马克思主义”，然后迅速消失在人群中。一切都准备就绪，可以开始行动了。剩下的就是等待别克的命令。而命令也如期而至。\n\n在一个周五的深夜，当教官们应该聚集在他们部队的总部讨论局势时，别列兹尼基市中心的某个地方响起了一阵电话铃声，只说了一个词：马克思主义。毫无疑问，吉尔向特种部队指挥官下达了执行计划的命令。“黑天鹅”行动开始了。\n\n但事情并没有按计划进行。尽管我们的特种部队做好了充分的准备，但快速而悄无声息的突破并没有成功，因此我们不得不采取B计划，其中包括对教官采取公开行动。但所有这些问题与最重要的事情相比都显得微不足道——维亚特卡的教官们不在场。大厅和办公室里真的空无一人。\n\n很明显，敌人事先就知道了这次行动，也许从计划制定之初就知道了。但最糟糕的是，卡津别克目前正在前往维亚特卡的路上，以回应弗拉基米尔的紧急呼叫，他们无法联系他报告失败和危险。在这样的无知中，亚历山大抵达维亚特卡与弗拉基米尔会面。\n\n经过一系列不同规模的会议和谈判后，他面对着沙皇陛下政府的办公大楼。他走进大楼，沿着预先研究好的路线走去。与此同时，在别列兹尼基，所有的领导层都在试图联系别克，但都没有成功，他们要报告的是："
 MAR_initial.50.a:0 "他将受到热烈欢迎。"
 MAR_initial.51.t:0 "茫茫战线第一列"
 MAR_initial.51.d:0 "“炮声隆隆震苍穹,\n刀光剑影舞长空。\n战场上下腥风起,\n黑羽盘旋啸无穷。”\n\n这些话，谢苗·希特勒是从一位战友口中听到的，那人在苏德战争初期便已阵亡。不知这是他自己想出来的，还是出自某首诗，但这位青年俄罗斯联盟军队的将军却记了一辈子。这些话完美地描述了东线战场一次又一次上演的灾难性局面。士兵缺乏训练，有时连开枪都不会，更不用说执行任何战术动作了。抗命现象普遍，纪律松弛，武器陈旧且短缺。难怪红军会二度败北。但今天一切都不同了。他来到阅兵场，观摩军队改革的成果。谢苗以一番关于伟大而不可战胜的青年俄罗斯联盟的庄严演讲开场，接着视察了士兵的日常生活和纪律。一切都达到了最高的水准。\n\n“这将是新俄罗斯的基石，而非那些浮夸的演讲，也非官僚政客，更非那些从奥万博兰到尼加拉瓜征战的雇佣兵，他们根本不会考虑我们的国家。正是俄罗斯军队，将成为统一而不可分割的堡垒。但要团结俄罗斯，打败德国人，还有很多工作要做。”"
 MAR_initial.51.a:0 "例如，改改您的名吧。"
 MAR_initial.52.t:0 "告别，但不是宽恕"
 MAR_initial.52.d:0 "殿下，\n\n我们很遗憾地通知您，从此刻起，我们之间的合作关系正式结束。您作为合作者的过往，以及您试图重建旧式帝国政权的可怜尝试，让我们别无选择。您日复一日地阻挠我们的运动，却不明白它对俄罗斯的价值。我们，青年俄罗斯联盟，清楚地看到，您过时的思想和宣扬这些思想的腐朽政客只会给俄罗斯带来更多的苦难和毁灭。您试图用关于团结和信任的言论来欺骗民众，但我们明白，这些空洞的言辞只是为了逃避您对自身行为不可避免的责任。\n\n不必担忧我们会从内部被颠覆，您安插于我国关键部门的保卫部特工，已经以各种方式离开了他们的职位。如果您当初能拿出安插特工的劲头来奋勇杀敌，如今俄罗斯军队早已兵临柏林城下了。\n\n您试图与君主制一同带到俄罗斯的理念，或许在纸面上冠冕堂皇，但实际上，它们正是导致皇室失去权力并惨遭布尔什维克背叛杀害的根源。\n\n请认清现实，全俄罗斯的未来属于青年俄罗斯，要么加入我们，要么就别当我们的道。"
 MAR_initial.52.a:0 "别列兹尼基省总督亚历山大·卡津别克。"
 MAR_initial.53.t:0 "byd你打到隐藏线了"
 MAR_initial.53.d:0 "哦这玩意是个隐藏线，你好像是触发了某种机制或者是小游戏没打完？去看看debug吧，说不定这还能让你玩玩正常线路。"
 MAR_initial.53.a:0 "hhh"
 MAR_VYT_annnexation_one_tt:0 "§e我们凝视深渊过久，以至于自己也堕入了其中。§!"
 MAR_initial.54.t:0 "沙皇的“猎犬”"
 MAR_initial.54.d:0 "斯米斯洛夫斯基的部队出现在了别列兹尼基的西部边境，也就是与维亚特卡接壤的地带。边境守军以及其他的执法部队都没有阻拦这位手握大权之人及其麾下部队的通行。这个人的目的只有一个——奉沙皇之命捉拿卡津别克，并将他就地正法，以惩其叛国之罪。\n\n经过数小时的行军，斯米斯洛夫斯基及其部队包围了卡津别克的官邸，他本人则带着手下冲进了大楼。一进大楼，他们就逮捕了所有的政府官员，并解除了警卫的武装。最后只剩下了卡津别克本人。\n\n“这里是皇帝陛下弗拉基米尔三世的军队，我们命令卡津别克立刻放下手中权力，从办公室里走出来！否则我们将采取武力行动！”\n\n卡津别克并没有选择投降，而是决定负隅顽抗到底。他从抽屉中取出一把早已上膛的手枪，对准了办公室大门，因为他知道，那支小分队很快就会破门而入。在没有得到任何回应后，斯米斯洛夫斯基下令强行破门。然而，这扇门质量上乘，为了节省时间，他直接下令用手榴弹将其炸开。\n\n手榴弹的爆炸震得卡津别克一阵耳鸣，但他马上意识到，对他的办公室的强攻已经开始了。亚历山大的末日似乎已经到来，因此他决定将弹匣里所有的子弹都倾泻到那些士兵的身上。\n\n尘埃还未落定，激烈的枪声便已骤然响起。从声音判断，卡津别克似乎击中了一名士兵，但其余的子弹则全都打在了士兵周围的墙壁上。而士兵们则用手中的自动武器对房间进行了疯狂的扫射，有几颗子弹击中了卡津别克的上半身。这几处致命的枪伤令亚历山大再也支撑不住，颓然倒地。\n\n斯米斯洛夫斯基走到卡津别克身边，说道：\n“我很遗憾以这样的方式终结你的生命。但你背叛了我们所有人，你必须为此付出代价。”\n\n随后，一声枪响——正中头部，紧接着为了确保万无一失，又补射了几发子弹。就这样，卡津别克彻底停止了呼吸。"
 MAR_initial.54.a:0 "而别列兹尼基的命运也就此画上了句号。"
 MAR_VYT_annnexation_two_tt:0 "§e独立摄政政权别列兹尼基的短暂历史就此落下帷幕。§!"
 MAR_postbomb.1.t:0 "工厂中的煽动者"
 MAR_postbomb.1.d:0 "轰炸结束已经有一段时间了。在这段时间里，当地“灰色”工厂的工人们已经习惯了不躲在地下室，听到一点类似轰炸的声音也不会退缩。现在，他们被安置在一栋奇迹般地没有被无数次德军空袭摧毁的大楼里。\n\n然而，今天工厂的生活又有了新的变化。两位官员不期而至，他们要在工人阶级面前发表演讲。身着制服的工人们自然瞪大了眼睛。\n\n“同志们，我叫康斯坦丁·切尔内茨基，是一名地方官员，我是来询问你们的生活情况以及帮助改善你们的生活的。和我一起来的还有我的同事维克多·罗普申。”切尔内茨基指着罗普申，开始了他的发言。\n“你们都知道，现在是困难时期。当然，德国的空袭已经结束，但我们周围的废土军阀们却在试图成为独裁者。我们不能允许这种情况发生，为了防止这种情况发生，我们不仅需要前线的胜利，还需要后方的胜利，因为没有后方的胜利，就没有前线的胜利。因此，我敦促你们更加努力地工作。请记住：我们不会抛弃自己人！我们努力把俄国大地从无知中解放出来，并在那里实现青年俄罗斯的思想！\n\n工人们开始窃窃私语。\n“现在，同志们，你们可以分享你们的问题，我们将在未来努力解决它们。”\n\n工人们突然开始喊叫起来。\n“修好我们的屋顶！”\n“给我们新式工具！”\n“给我们修一条通往工厂的路！”\n\n官员们在一张纸上记下了所有无产阶级的抱怨，然后脱下了不舒服的工作服，换上了熟悉的西装和大衣。\n\n“呼，你能想象我们在管理什么吗？”一个人问道。\n“是啊，人可真不少。对了，现在没人在家，想去我家吗？我通过违禁品的关系弄到了一些巧克力。”\n“热巧克力？”"
 MAR_postbomb.1.a:0 "“哦没错，热巧克力...”"
 MAR_postbomb.2.t:0 "从灰到白"
 MAR_postbomb.2.d:0 "地下兵工厂的老板不好当。害怕暴露、担心客户欺诈、前途渺茫.....但戈尔迪总是感谢上帝让他出生在俄罗斯，因为在地球上这片四分五裂的土地上，地下武器生产是他唯一的收入来源。当然，这也为他打开了剥削工人的致富之路。戈尔迪毫不犹豫地选择了后者，反正那些工人无处可去，也没人会听他们的抱怨。\n\n武器的质量也算不上乘。戈尔迪有一批戴高乐还在高谈阔论“法国没有输”时期的步枪，那时候的法国姑娘们轻易地、漫不经心地委身于德国人。这些步枪是整个西俄罗斯最受欢迎的商品，其他的枪支都是仿照这个型号制造的。\n\n但是，天下没有不散的筵席。德国人不再在俄罗斯上空飞翔，国家也有机会插手这个“小生意”领域了。\n\n清晨，一辆GAZ汽车带着三名青年俄罗斯的代表来到了这家地下工厂，他们全副武装。\n\n“计划很简单，我们进去，要求见他们的头儿，谈一笔交易，然后走人。有问题吗？”\n“说实话，这个计划很一般，但我们没有更好的选择。”\n“那就行动吧。”\n\n但这些“谈判者”的计划注定要落空。他们被武装警卫拦住了。\n\n“你们要去哪里？”一名警卫问道。\n“哦，劳驾，请叫你们的负责人出来。”“谈判者”搪塞道。\n“谁在问话？”\n\n突然，负责人本人从地下室冲了出来，用手枪向四面八方射击。所有子弹都落空了，没有人受伤。戈尔迪的子弹打完了，警卫们被这突如其来的举动惊呆了，动弹不得。\n\n“你们这些怪物，这些野兽，你们是来抢走我的生意的！”这位地下兵工厂老板绝望地喊道。\n“好了，同志，冷静点，我们是来和你做一笔简单的交易的：你接受国家的保护，为我们制造高质量的枪支，并保障工人的社会福利。我们不会动你一根毫毛，还会帮助你发展。怎么样？” “谈判者”们一边说着，一边用枪瞄准着可怜的戈尔迪，让他别无选择。\n“嗯，好吧，我答应！”"
 MAR_postbomb.2.a:0 "党资联盟"
 MAR_postbomb.3.t:0 "第一届自由党党务代表大会"
 MAR_postbomb.3.d:0 "弗拉基米尔皇子回到俄罗斯已经有十年了。就在那时，35岁的米哈伊尔意识到，为新君主效力是个绝佳的主意。现在看，他是对的。即使米哈伊尔只是个小官，也比继续在工厂工作或当走私贩强。他见过很多官僚主义的废话、苛刻的军令和虚伪。做傀儡的代价是相当大的。\n\n但这是值得的。当然，如果没有沙皇，这也是不可能的。米哈伊尔非常尊敬弗拉基米尔·基里洛维奇，很多人都知道这一点。\n\n但许多年过去了，现在他就在这里，在这座曾经是文化宫的破旧房子里。这是维亚特卡和别列兹尼基最终分裂后的第一次党代会。每个人都对卡津别克的未来计划极感兴趣。官员们不断窃窃私语，讨论形势。大厅里的气氛十分紧张。\n\n15分钟后，亚历山大·利沃维奇费力地走上讲台。他面无表情。最后，他开始发言。\n\n“同志们，我们国家的历史进入了一个新时代。纳粹主义的诞生自取灭亡，拯救祖国的新机遇已经向我们敞开。我们已经甩掉了维亚特卡的枷锁，准备向前迈进。遗憾的是，弗拉基米尔并不理解这一点，仍然拒绝承认这一显而易见的事实。保卫部继续破坏局势稳定，杀害我们的人民。这是不可接受的！国家安全局正在竭尽全力阻止罪犯沙皇的影响。请理解所采取的措施。我呼吁所有党员和别列兹尼基人民为了伟大的事业团结起来。我呼吁你们不要让基里洛维奇影响我们的政治。”\n\n他话音刚落，两名保安走进大厅，将米哈伊尔从座位上拽起，带着他往不知名的方向走去。卡津别克注意到了他。\n\n“不好意思，我们的仆人好像不太舒服。请带他去休息室。”"
 MAR_postbomb.3.a:0 "叛徒不再。"
 MAR_postbomb.4.t:0 "干部革命"
 MAR_postbomb.4.d:0 "这一天，索利卡姆斯克天气晴朗，当地党小组举行了一场同样美丽的考试。想加入青年俄罗斯党的人都参加了这次考试，很多人都想加入，因为别列兹尼基的成功大大加强了他们的力量和权威。其中就有根纳季和他忠诚的战友德米特里。\n\n“嗯，你觉得你能通过考试吗？”德米特里问道。\n根纳季回答说：“是的，我想我会毫不犹豫地通过考试。”\n“你知道吗，我父亲在加入苏共之前也是这样告诉我母亲的。现在猜猜他是否成功了。” \n“我想是的。”\n“呃，你好像不太善于思考。”\n最后，主考官把根纳季叫了过来，开始询问他。\n“那么，是谁先创建了青年俄罗斯联盟？”\n“谢尔盖·谢尔盖耶维奇·别洛泽尔斯基\" \n“嗯，有意思。那么下一个问题：党的概念是什么？”\n“红军和白军之间的和解。”\n“为了什么？”\n“为了俄罗斯。”"
 MAR_postbomb.4.a:0 "很好，但请研究一下党的历史。"
 MAR_postbomb.5.t:0 "必要措施"
 MAR_postbomb.5.d:0 "“一个月内彻底肃清别列兹尼基境内的保卫部残余势力？他们是不是疯了？”内务部首都分局局长在吉尔的办公室里质问道。\n\n“没错，因诺肯季·康斯坦丁诺维奇。这是来自最高层的命令。为了完成这一任务，您可以采取任何必要的手段，甚至可以动用一些非常规的、极端的手段。一个月后，您必须向我汇报行动成果。”\n\n“恕我直言，我可没有那么多的人手。”\n\n吉尔沉思了片刻，然后从办公桌后站起身，问道：\n\n“您手下总共有多少人，少将同志？”\n\n“目前，内务部大楼里大约有一百名工作人员。此外，还有一支五十人的行动队。”\n\n“明天召集您所有的下属开会，我们必须将这项行动的具体细节告知他们。”\n\n尽管吉尔很清楚，这一举措极为严苛，因为他计划组织一支能够全天候行动的特别行动小组。但他同时也明白，卡津别克是绝不会允许他打任何折扣的。既然定下了一个月的期限，那么就必须在一个月内完成任务。"
 MAR_postbomb.5.a:0 "我们将无所不用其极。"
 MAR_postbomb.6.t:0 "喜极而泣"
 MAR_postbomb.6.d:0 "爱情能持续多久？一个月，两年，还是三年？也许根本就不存在？奥尔加和伊格纳特可以明确地回答：爱情永存。而且，他们用行动证明了这一点。\n\n西俄罗斯战争结束后，奥尔加用各种碎布缝制衣服。她的服务颇受欢迎，口口相传，帮助她完成了这项艰巨的工作。在这一领域找到一个好师傅并不容易。\n\n伊格纳特在当地民兵中服役。以他的年龄，他见过很多东西：老式的茶炊、老人腐烂的尸体、被埋在轰炸废墟下的婴儿。还有无处可去的未成年孤儿妓女。不过，尽管这很令人愉悦，但最好还是不要纠结于此。\n\n他们是在伊格纳特上班的时候认识的。那天，另一场爆炸摧毁了奥尔加居住的房子，就在那时，伊格纳特第一次救了她的命。\n\n后来，维亚特卡的到来，以及随后青年俄罗斯联盟的到来。但这些都不重要，重要的是他们回到了这所房子。\n\n“嗯，这里还不算太糟。房子还在。”伊格纳特乐观地说。\n“天哪，连门都还在！伊格纳特，你看！”她指着走廊上的一辆小自行车。“我小时候经常骑它！”\n“啊，阳光，我们很幸运。我们的后代还会住在这里。”\n“后代？我喜欢这个说法。”"
 MAR_postbomb.6.a:0 "我也一样。"
 MAR_postbomb.7.t:0 "彩排"
 MAR_postbomb.7.d:0 "致国防部长谢尔盖·谢尔盖耶维奇·别洛泽尔斯基 \n\n根据最近的演习结果报告军队状况和可用资源。\n\n演习历时数日，包括从战术行动到紧急情况下生存的广泛训练。这些演习对确保士兵做好在任何条件和任何情况下履行职责的准备十分必要。\n\n演习尽可能接近在密集的城市地区进行的实战条件，在渡河时，演习结果令人满意。没有发现通信和补给方面的问题。\n\n我相信军队目前的状态已经为即将到来的战斗做好了准备。\n\n敬启者，"
 MAR_postbomb.7.a:0 "陆军元帅约瑟夫·拜尔利。"
 MAR_postbomb.8.t:0 "倒计时"
 MAR_postbomb.8.d:0 "时针逼近12点，卡津别克召集了一场紧急幕僚会议。\n\n别洛泽尔斯基第一个抵达，他一直在等待这一刻。接着是吉尔，他的目光一如既往的冰冷。随后，拜尔利和瓦维洛夫也来了。最后到场的是柯西金。每个人都难掩兴奋之情，因为所有人都知道这次会议的目的。\n\n“我就不浪费时间了，你们都知道自己为什么来这里。我们正面临着一场兄弟阋墙的战争，一场残酷的战争。但除此之外，别无他法。我希望，拜尔利，瓦维洛夫——集结你们的部队。柯西金——将经济完全转入战时轨道。还有你，别洛泽尔斯基，率领军队，英勇奋战。”\n“遵命，先生。”国防部长回答。\n“先生们，你们确定要执行这个计划吗？”科西金问道。\n“是的。”\n“一致同意。”\n“在从10倒数到0的时候，再好好想想你们的计划。”\n\n每个人都开始倒计时。当倒计时结束时，午夜的钟声敲响了。"
 MAR_postbomb.8.a:0 "子夜。"
 MAR_postbomb.9.t:0 "装在空信封里的信"
 MAR_postbomb.9.d:0 "现代生活的快节奏，让停下来整理思绪变得弥足珍贵。或许，你还能问问自己几个问题：命运如何将你带到此刻，带到此地？为何会有两名持枪男子搜查你的公寓？\n\n这些想法萦绕在瓦西里脑海中，这位别列兹尼基政府的高级官员正背对着墙壁，盯着公寓里空荡荡的墙壁。令他惊讶的是，他能够回答这两个问题。他是沙皇派来的外国情报特工，几年前潜伏进了别列兹尼基。除了完成直接的工作任务，他还负责向沙皇汇报别列兹尼基的内部情况。而那两个持枪的家伙则是别列兹尼基反间谍机构的特工，这并非第一次搜查，但到目前为止，一切都进展顺利。最近，别列兹尼基的局势变得越来越紧张，但这位特工设法避免暴露。\n\n直到今天。\n\n“同志们，这到底要持续多久？！这是这个月第三次搜查了，你们除了让我神经衰弱之外，还能做点什么？！”\n\n“公民，冷静点。如果你真的问心无愧，就没什么好担心的，我们很快就会结束。”特工朝他的同伴大喊，“你那边有什么发现？”\n\n房间深处传来了第二位特工的声音。\n\n“先看看我们发现了什么。”一个身材魁梧的男人走进了房间，手里拿着一封信封。\n\n瓦西里眼中开始流露出绝望。完了，他们找到了存放文件的藏匿处。\n\n“为了记录：这封信是写给斯米尔斯洛夫斯基的。”\n\n特工们饶有兴致地打开了信封，开始大声朗读信的内容。\n\n“...行动的继续进行受到威胁...每周都会进行行动搜查...我要求撤离。”\n\n吉尔的部下相视而笑，然后走近瓦西里。"
 MAR_postbomb.9.a:0 "好吧，你得跟我们走一趟，同志。"
 MAR_our_time_has_come:0 "我们的时代即将来临"
 MAR_our_time_has_come_desc:0 "二十年来，俄罗斯一直被日耳曼人控制着。许多飞机和德国空军飞行员都为这只靴子服务过。但今天，一切都结束了，帝国陷入了灾难、悲痛和内战的深渊。飞机可耻地抛弃了俄罗斯的碎片。\n\n但巨大的机遇也伴随着巨大的风险 当然，在统一俄罗斯的尝试中，并非只有我们在努力争取成功。从北面看，革命阵线威胁着我们；从南面看，所谓的“雅利安人”威胁着我们；从西面看，“老大哥”——维亚特卡威胁着我们。\n\n现在，这些土地上不同统治者之间的激战即将来临。但俗话说，如果战斗不可避免，就必须先下手为强。"
 MAR_embrace_workers:0 "鼓舞工人"
 MAR_embrace_workers_desc:0 "布尔什维克之所以能夺取政权，是因为他们成功地赢得了工厂工人的支持。这也使得他们在与左翼社会革命党和孟什维克的角逐中最终脱颖而出。那么，我们有什么理由不能像他们一样，也赢得工人阶级的人心呢？\n\n我们必须成立一个专门处理相关事务的委员会，因为如果我们不能得到后方工人群众的坚定支持，我们将难以在统一全俄罗斯的征途中支撑下去，哪怕一个月也坚持不了。工人是后方的战士，我们也必须像激励前线将士那样，让工人兄弟们充满斗志。"
 MAR_all_for_front:0 "一切为前线"
 MAR_all_for_front_desc:0 "在沙皇统治时期，曾发生过炮弹饥荒。克伦斯基时期，军队完全涣散。布哈林时期，军队完全无知，同样缺乏武器。在他们的时代，现代技术是不存在的。但这些军队还有一个特点。无论是沙皇还是苏维埃时期，都有足够多的人。\n\n我们必须认识到我们的错误，并认识到人力资源并不总能保证胜利。因此，我们不应把重点放在大规模动员军队上，而应放在高质量的武器及其可用性上。这就是为什么我们要提高武器工厂的标准。否则，我们将无法生存。"
 MAR_kosygin_plan:0 "柯西金的计划"
 MAR_kosygin_plan_desc:0 "阿列克谢·柯西金是一个备受争议的人。有人认为他是一位杰出的管理者，几乎撤出了列宁格勒的所有工业。有人认为他是共产主义理想的叛徒。还有人认为他是奇迹般地幸存下来的皇子阿列克谢。\n\n但不管别人怎么说，事实是，他是一位杰出的经济学家。这位杰出的经济学家提出了一个同样杰出的计划，但由于某些原因，这个计划在俄罗斯四分五裂的土地上并不受欢迎。该计划的实质是，必须改善普通人的生活。这将增加我们的支持，当我们向普通百姓收取军事贷款债券时，他们也不会抱怨和破坏局势稳定。\n\n这很高明吧？"
 MAR_get_the_factories:0 "集中生产"
 MAR_get_the_factories_desc:0 "多年来，轰炸导致我们几乎没有正常的工厂和厂房。我们拥有的所有工业力量都分散在地下室、防空洞和其他隐蔽的地方。\n\n但这只是问题的一半。因为我们的工人像老鼠一样躲在洞里，一听到类似炸弹飞行的声音就退缩，所以他们几乎没有任何资质，他们生产的武器弹药质量是最差的。\n\n我们必须立即改革这一制度。阿列克谢·柯西金有一个计划。也许我们不会使用它，但我们仍然需要将生产从地下室提升到工厂，否则，我们的失败将不会等待。为此，我们首先要与这些地下“工厂”的拥有者达成协议。"
 MAR_secure_party_stability:0 "稳定政党"
 MAR_secure_party_stability_desc:0 "自由！这个甜美的字眼激励着我们去创造新的辉煌。现在，我们摆脱了“老大哥”的独裁影响，可以自信地向前迈进。然而，在没有准备的情况下穿破旧的鞋是走不远道的。\n\n我们的靴子或准备工作就是青年俄罗斯联盟。我们需要对其进行改革，并明确说明我们的目标。"
 MAR_new_faces_in_party:0 "新面孔"
 MAR_new_faces_in_party_desc:0 "现在维亚特卡已经被送走了，我们终于可以进行适当的入党招募了。不再有暴君和沙皇的控制，只有建立在多元化基础上的人民党，我们只需通过考试招募就好...\n\n当别列兹尼基在维亚特卡的统治下时，卡津别克并没有宣传他与前布尔什维克的联系。现在，弗拉基米尔的统治已经过去，是时候重新招募党员了，向所有社会阶层和政治信仰开放。青年俄罗斯联盟必将成为爱国主义多元化的大本营。"
 MAR_endspiel:0 "终局"
 MAR_endspiel_desc:0 "保卫局势力已被正式摧毁。\n\n但残余分子仍留在我国境内。他们就像游击队一样，进行破坏活动，破坏我们国家的稳定。如果我们想最终粉碎这些庶民，就必须采取更加果断的行动，让克格勃的所有后备力量，甚至吉尔本人都参与进来。"
 MAR_berezniki_awakens:0 "别列兹尼基之觉醒"
 MAR_berezniki_awakens_desc:0 "多年来，日耳曼人渣——飞行员们一直在无情地轰炸俄罗斯。数不清有多少生命被他们摧毁。我们为数不多的城市成了废墟，孤儿们在全国各地游荡，组织帮派以求生存。只有市中心的防空设施还没有遭到破坏。\n\n但地狱般的生活已经结束了。现在，我们必须从头开始恢复几乎所有的基础设施。人们正返回残存的家园，至少在房屋倒塌之前，我们还有时间。"
 MAR_turn_everything_upside_down:0 "翻天覆地"
 MAR_turn_everything_upside_down_desc:0 "多年的动荡和战乱使得俄罗斯各地散落着许许多多的武器弹药库和秘密藏匿点。有的是在苏联卫国战争期间紧急转移的，有的是士兵们从前线带回来的，还有的则纯粹是遗失在了某处。无论如何，我们必须组织搜寻队来找到这些隐藏的宝藏。当然，要做到这些还需要依靠广大人民群众以及其他情报来源。更重要的是，我们不会亏待那些积极配合的群众的。\n\n但如果我们仍觉得这些还不够，那么我们随时都可以同那些军火制造商们再谈谈合作，或许可以谈下一个更优惠的价格呢？天晓得在他们的仓库角落里还堆放着些什么宝贝呢。"
 MAR_mass_trainings:0 "集体培训"
 MAR_mass_trainings_desc:0 "别列兹尼基的武装部队必须加强战备状态，因为对雅利安兄弟会的军事行动随时都会开始。\n\n这场战斗将持续到最后，无论会有什么后果。因此我们不能在最关键的时刻出现任何失误。\n\n国防部长别洛泽尔斯基下令对我军各部队的战斗准备情况进行大规模检查。必须在最短的时间内消除最微小的缺陷，因为我们的时间已经不多了。"
 MAR_everyone_for_front:0 "全都上前线"
 MAR_everyone_for_front_desc:0 "如果没有人使用，再好的武器也无济于事。目前，我军人手严重不足，很快就会出现前线无人坚守的局面。\n\n为了避免出现这种情况，我们将扩大征兵规模。人民不会对这种措施感到高兴，但他们很快就会明白，这是为了他们好。"
 MAR_alea_iacta_est:0 "木已成舟"
 MAR_slavsya_berezniki:0 "别列兹尼基之金"
 MAR_slavsya_berezniki_desc:0 "别列兹尼基的黄金用于提高我们经济的可操作性。现在我们基本上有了一些钱，可以用来购买新武器，这在当前形势下是非常必要的。"
 MAR_rabochie_ochen_vood:0 "受激励的工人"
 MAR_alea_iacta_est_desc:0 "所有准备工作都已完成。军队已做好战斗准备，人民支持我们，党团结一致，维亚特卡的间谍已被消灭。卡马河是我们的卢比孔河，而别洛泽尔斯基、卡津别克、吉尔和其他将军则是我们的凯撒。大俄罗斯的伟大构想要靠他们来实现。\n\n前进！"
 MAR_hes_future_no_vyatka:0 "§G我们最终需要思考我们的未来，以及我们是否拥有未来...§!"
 MAR_doings_aganist_peoples:0 "§G我们为实现国家繁荣而采取的行动不利于人民的福祉，但这就是代价......"
 MAR_vyatka_is_how_angry:0 "§R间接拒绝向维亚特卡提供资源肯定不会改善我们之间的关系。如果我们不控制他们的影响，我们的日子就不会好过。§!\n"
 MAR_vibori_vibori:0 "§G为了国家的稳定，我们需要解决摄政问题，并决定谁将成为下一任沙皇。§!"
 MAR_army_upgrade:0 "§G我们的军队太落后了，是时候进行改革了。§!"
