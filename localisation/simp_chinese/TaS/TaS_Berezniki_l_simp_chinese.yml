 custom_diff_strong_MAR:0 "£TNO_game_rule_flag_MAR 加强别列兹尼基"
 MAR_CountryInfo_Folder.101: "别列兹尼基，青年俄罗斯联盟和卡津别克"
 MAR_CountryInfo_Folder.102: "另一种选择？"
 MAR_CountryInfo_Content.1: "运动的历史"
 MAR_CountryInfo_Content_desc.1: "自沙皇尼古拉二世逊位以降起，§W俄罗斯§!之切肤之痛，纵倾千言亦难尽述。国运飘摇，人心惶惶，举国若狂于顷刻之间，饥馑、战乱、恐怖纷至沓来。可想而知，在那些尚且记得退位前安宁岁月的人们心中，君主制理念引发了强烈的共鸣。在俄罗斯的白俄流亡者中，无数的保皇派政党如雨后春笋般涌现。而其中最为特立独行者，莫过于§Y亚历山大·卡津别克§!所领导的§R青年俄罗斯联盟§!。\n\n至1942年，§R青年俄罗斯联盟§!寿终正寝，此后§Y亚历山大·卡津别克§!投身于形形色色的组织之中。然而，当家国蒙难之际，其魂灵所向，终究唯有§W那片故土§!。"
 MAR_CountryInfo_Content.2: "卡津别克的经历"
 MAR_CountryInfo_Content_desc.2: "共产党人孤注一掷的复仇行动——§R西俄罗斯战争§!以灾难告终。§R西俄罗斯革命阵线§!轰然崩塌，化作无数的军阀和割据势力。其中一个便是§G维亚特卡公国§!。§W弗拉基米尔·罗曼诺夫§!领导着这个国家，但他无法独自控制自己的整个领地，因此他将§Y扎卡姆斯克省§!从§G维亚特卡§!分离出来。§Y亚历山大·卡津别克§!，得益于他的聪明才智和他在移民环境中的权威，或许是因为运气，又或是因为他与§B中央情报局§!的关系，他于1958年控制了该省。从那时起，他就开始有条不紊地清除弗拉基米尔在该省的拥趸，同时发展看似已被遗忘的§R青年俄罗斯§!思想。"
 MAR_CountryInfo_Content.3: "同维亚特卡的关系"
 MAR_CountryInfo_Content_desc.3: "法理上，§Y别列兹尼基§!仍隶属于§G维亚特卡§!，然而，§W弗拉基米尔§!在此地之影响力几近于无。若以为§W弗拉基米尔§!愚昧无知，对其偏远辖区所发生之事一无所知，那无疑是痴人说梦。然而，这位君主目前正忙于处理其领地内务。虽则§G维亚特卡§!试图干预该辖区政务，但国王麾下的密探鲜少主动行事，徒增别列兹尼基反谍机关的紧张罢了。故此，§R卡津别克§!暂可高枕无忧，深知§n皇室警卫§!之爪牙近期不会找上门来。\n\n究竟何时君主与这位桀骜不驯的总督会彻底反目成仇，唯有天晓得。不过，几乎无人怀疑，这一天迟早会来临，届时，两人及其麾下数百名下属的命运，皆将危如累卵。"
 MAR_CountryInfo_Content.4: "吉尔的故事"
 MAR_CountryInfo_Content_desc.4: "§r弗拉基米尔·吉尔§!，乃是§Y别列兹尼基§!为数不多的领袖人物之一，曾两度亲历堑壕战，与德意志人兵戎相见。然而，§r吉尔§!的征战之路，实难称得上英雄盖世或英勇无畏。大战方起首月，他便沦为阶下之囚。1941年秋，他踏上了与德军沆瀣一气的歧途。1942年，§r吉尔§!率领一支名为“友队”的惩戒分队，不久便扩编为旅。该旅在维捷布斯克地区对游击队大肆实施惩戒行动。\n\n其效率之高，令白俄罗斯全境的游击队闻§r吉尔§!之名而胆寒。亦正因其效率卓绝，即便在“巴巴罗萨行动”告终之后，§r吉尔§!依旧能在§b党卫军§!中稳坐一席之地。\n\n在§R西俄罗斯战争§!的混乱局势中，以及随之而来的§b党卫军§!内部军队叛乱之际，§r吉尔§!临阵倒戈，投身于§R西俄罗斯革命阵线§!的怀抱。当§G“苏沃洛夫行动”§!铩羽而归，§r吉尔§!与一小队§R西俄罗斯革命阵线§!军官成功逃往§Y扎卡姆斯克总督辖区§!避难，在那里迎来了1962年。"
 MAR_CountryInfo_Content.5: "别洛泽尔斯基的故事"
 MAR_CountryInfo_Content_desc.5: "§C谢尔盖·别洛谢利斯基-别洛泽尔斯基§!，常被简称为§C别洛泽尔斯基§!，乃响应§W弗拉基米尔三世§!号召，归返维亚特卡的白俄流亡者之一。在§R西俄罗斯战争§!结束之前，§C别洛泽尔斯基§!曾先后效力于法国、英国，乃至美国之§B战略情报局及中央情报局§!。正是在彼时，别洛泽尔斯基与亚历山大·卡津别克相识相知，结为莫逆。命运的红线，将二者紧密相连，缠绕经年。当§C别洛泽尔斯基§!受命前往法国，§R卡津别克§!始终伴其左右。二人更是携手加入了§W弗拉基米尔三世§!的流亡组织。追随§R卡津别克§!的脚步，§C别洛泽尔斯基§!亦奔赴§Y扎卡姆斯克总督辖区§!，成为其挚友至交，忠实盟友，以及坚实后盾。他们的携手并进能否善始善终，抑或§R卡津别克§!与§C别洛泽尔斯基§!的命运终将分道扬镳——唯有时间能给出答案。"
 MAR_CountryInfo_Content.6: "柯西金的故事"
 MAR_CountryInfo_Content_desc.6: "在昔日通敌者与白俄流亡者主导的时局之下，§e阿列克谢·柯西金§!犹如一堆土豆中鲜红欲滴的苹果，显得格外醒目。早在战火燃起之前，他便在§R苏维埃政府§!治下崭露头角。战事期间，他更被任命为疏散委员会主席。与诸多同类委员会的主席不同，他所关注的并非一己之安危，而是全力以赴完成所肩负之重任。他鞠躬尽瘁，殚精竭虑。当他忙于将企业疏散至乌拉尔山脉以东之时，极具讽刺意味的是，他本人却拒绝撤离，直至最后一刻。直至战线迫近莫斯科之际，§e柯西金§!方才动身前往§G李可夫§!。正是柯西金的卓越贡献，使得§R西俄罗斯革命阵线§!得以积累充足的物资，进而发起“苏沃洛夫行动”。然而，当战线土崩瓦解之际，众多将领与政委却急于将他推为替罪羔羊。在四面楚歌的困境中，柯西金在§Y别列兹尼基§!觅得一席安身之地。"
 TNO_COUNTRY_INFO_BUTTON_TEXT_MAR:0 "为了俄罗斯！"
 TaS_leader_name_Alexandr_Kazembek:0 "亚历山大·卡津别克"
 POLITICS_ALEXANDER_KAZEMBEK_DESC:0 "列夫·亚历山德罗维奇·卡津别克出生在一个有退休卫兵背景的贵族家庭，他的家乡位于喀山省斯帕斯基区。作为未来青年俄罗斯运动的领袖，他的生活经历丰富多彩。借着父亲的工作调动，卡津别克周游俄罗斯和西欧多地。后来从尼古拉二世的沙皇赛洛皇家学校毕业，投身童子军运动，并于1917年5月获得童子军教官军衔。1919年11月，他在罗斯托夫应征加入白卫军，在那里指挥约40人的行军中队，其中大多数成员是前红军现俘虏。然而，他很快就病倒了。1920年1月17日，他同父母一起乘坐“伊尔蒂什”号汽船前往君士坦丁堡，转至萨洛尼卡终抵贝尔格莱德。\n\n1923年，卡津别克在慕尼黑组织起青年俄罗斯联盟，而运动的独特风向是于1925年在巴黎形成的。起初，亚历山大同情希特勒和墨索里尼，并认为认为基里尔·弗拉基米罗维奇大公是俄罗斯皇位的合适人选。但在大公去世后，基里尔的儿子、弗拉基米尔·基里洛维奇对这位君主共产主义旗手未能嗤之以鼻，没能达成合作。1937年后，卡津别克的思想开始左转，他意识到德意的所作所为剑指苏联，明白这两个国家不会给他的祖国带来任何好处。\n\n战争爆发时，卡津别克在法国，1940年初被捕并与莱昂·德格雷尔关在一起，随后被当局释放前往美国。及至徳苏开战，他解散了自己的党，允许各党员遵循自己的理解履行为祖国战斗的爱国义务。战后，他在美国生活从事教育工作，并与美国情报部门合作。随着西俄罗斯战争开始，他应邀参加“太阳”计划，预备带着一些昔日战友以及老朋友谢尔盖·别洛泽尔斯基混进弗拉基米尔三世的合作者队伍。抵达俄罗斯后，卡津别克凭借旧时关系与贿赂，赢得弗拉基米尔三世的信任，被任命为扎卡米耶省的省长。现在，他蛰伏待命，乘势而动，准备除掉弗拉基米尔三世，建立一个全新的俄罗斯。"
 TaS_leader_name_Kiryll_Vilchkovskiy:0 "基里尔·叶利塔-维尔奇科夫斯基"
 TaS_leader_name_Dmitriy_Alexandrovich:0 "德米特里·亚历山德罗维奇"
 TaS_leader_name_Nina_Krivosheina:0 "妮娜·克里沃舍伊娜"
 TaS_leader_name_Igor_Shafarevich:0 "伊戈尔·沙法列维奇"
 MAR_Nikolai_Maslennikov:0 "尼古拉·马斯连尼科夫"
 POLITICS_MIKLAY_KAZAKOV_DESC:0 "长久以来，无论是以何种面貌出现的俄罗斯国家，亦或是那些统治他们的形形色色的继任者，都无一例外地剥夺了马里维尔人建立自己国家的权利。无论他们打出的是社会主义的红旗，还是沙俄的三色旗，其结果都是一样的。但是，尼古拉·伊万诺维奇·卡扎科夫立志用一生来改变这一不公的现状。随着反共卫队在西俄罗斯的胜利已成定局，他团结起整个地区的马里族同胞，加入到与卫队并肩作战的马里军团之中。他始终保持着对诗歌和文学的热爱，因而被同胞们亲切地称为“诗人战士”。也正因如此，卡扎科夫顺理成章地成为了第一个马里维尔民族国家的领袖，而他本人也确实不负众望。\n\n这个共和国成为了北俄罗斯的又一个成功的范例，卡扎科夫不仅稳定住了该地区的局势，并且希望能够同伏尔加-乌拉尔地区和阿尔汉格尔斯克的其他国家守望相助、同舟共济。"
 TaS_leader_name_Sergey_Belozerskiy:0 "谢尔盖·别洛谢利斯基-别洛泽尔斯基"
 POLITICS_SERGEY_BELOZERSKI_DESC:0 "青年俄罗斯联盟的俄罗斯，凭借其崇高的美德和从废墟中振兴国家的坚定决心，成功地洗刷了黑暗的过去。我们能够实现这一切，归功于所有关心我们国家的人们的共同努力。其中，现任沙皇谢尔盖·别洛泽尔斯基的贡献尤为突出。\n\n沙皇谢尔盖是通过全俄罗斯缙绅会议的选举产生的，他曾在别列兹尼基担任军事职务，因而被人尊称为“沙皇将军”。他早年在尼古拉二世的军队以及美国军队中都有服役经历。直至最近，他还一直担任着别列兹尼基武装力量的总司令，他返回祖国，是为了帮助他的人民恢复往日的荣耀。在这一过程中，只有青年俄罗斯联盟有能力重塑这种荣光。\n\n现在，别洛泽尔斯基站上了政治舞台的中心，他深知自己背负的责任重大。作为一位经验丰富的领导者，他清楚如何治理国家。他的坚定立场以及对青年俄罗斯联盟的深厚热情，将有助于解决国家面临的诸多问题。他得到了全国人民的广泛支持，他有责任不辜负人民的期望。在恢复俄罗斯的秩序上，还有很多工作要做，而将整个国家统一在一面旗帜下的任务更是艰巨。别洛泽尔斯基必须不辱先辈，他定将取得成功，继承并超越先辈的辉煌。"
 POLITICS_SERGEY_BELOZERSKI_70S_DESC:0 "在俄罗斯广袤的土地上，有一个名为谢尔盖·别洛泽尔斯基的沙皇将军，他用坚定的手将分裂的国土重新缝合。他的血脉，源自尊贵的留里克王朝，使他在众人眼中成为了伟大祖先的合法继承者。曾经的质疑声已然消逝，如今无人敢对他的身份提出异议。那些曾企图分裂国家的敌人，如同流沙般消失在历史的长河中。\n\n别洛泽尔斯基的智慧在于，他将古老的传统与现代的理念融合，构筑了一个崭新的俄罗斯。他被人民拥戴，被誉为民选的沙皇，他的名字成为了统一与复兴的象征。在他的领导下，俄罗斯的人民正准备迈出重获昔日荣耀的步伐。虽然他的权力强大无比，但这正是他成就如此壮举所需的力量。\n\n然而，谢尔盖·别洛泽尔斯基的野心并未止步。他的眼光投向了更远大的目标——为历史上的失败复仇，恢复俄罗斯的昔日荣光。他梦想着解放莫斯科，将这座城市重新纳入俄罗斯的怀抱，正如命运所安排的那样，他注定要成为整个战役的胜利者。\n\n尽管岁月已在他的身上留下了痕迹，但这并未阻碍他的坚毅步伐。现在，俄罗斯正准备迎接一场神圣的战役，一场如米宁和波扎尔斯基时代般的战役。谢尔盖·别洛泽尔斯基的心中充满了信念：他将不辱先祖，带领俄罗斯走向新的辉煌。\n\n§R进军莫斯科。§!"
 TaS_leader_name_Maria_Romanova:0 "玛丽亚·罗曼诺娃"
 TaS_leader_name_Alexey_Kosygin:0 "阿列克谢·柯西金"
 TaS_leader_name_Alexey_Kosygin_Tsar:0 "阿列克谢二世"
 POLITICS_ALEXEY_KOSYGIN_DESC:0 "阿列克谢二世·罗曼诺夫的成就，若要称道，当属他在全俄罗斯缙绅会议中出人意料的胜利。这位源自科米共和国、经验丰富的政治家，成功地赢得了足够的声誉，成为了一个新兴王国的领袖。\n\n过往那段被称作“柯西金式”的岁月，如今已成云烟。自此往后，他不再是区区车工之子，而是沙皇尼古拉二世的嫡亲血脉——尽管，这个真相仅仅维系于少数知情者之间。或许终有一日，一切都将大白于天下，但此刻，思虑此事，为时尚早。\n\n在未来降临、过往重塑之前，改变当下，才是重中之重。阿列克谢二世·罗曼诺夫怀揣着统一全俄罗斯的雄心壮志。为了实现这个目标，他将不惜一切代价，但与此同时，他还必须捍卫自己“人民沙皇”的称号。最终，现实将走向何方？此刻，尚无人知晓。"
 POLITICS_KOSYGIN_POSTBOMB_DESC:0 "阿列克谢二世·罗曼诺夫的成就，若要称道，当属他在全俄罗斯缙绅会议中出人意料的胜利。这位源自科米共和国、经验丰富的政治家，成功地赢得了足够的声誉，成为了一个新兴王国的领袖。\n\n过往那段被称作“柯西金式”的岁月，如今已成云烟。自此往后，他不再是区区车工之子，而是沙皇尼古拉二世的嫡亲血脉——尽管，这个真相仅仅维系于少数知情者之间。或许终有一日，一切都将大白于天下，但此刻，思虑此事，为时尚早。\n\n在未来降临、过往重塑之前，改变当下，才是重中之重。阿列克谢二世·罗曼诺夫怀揣着统一全俄罗斯的雄心壮志。为了实现这个目标，他将不惜一切代价，但与此同时，他还必须捍卫自己“人民沙皇”的称号。最终，现实将走向何方？此刻，尚无人知晓。"
