 MAR_intervention_category: "俄罗斯志愿军"
 MAR_intervention_category_desc: "自由国家组织、大日耳曼国与日本帝国之间构筑的三足鼎立冷战均势可谓如履薄冰。各方都在竭尽所能地施展影响力，但一切归根结底，都演变成了这三大阵营在其他毫无瓜葛的国家领土上展开的间接冲突。他们扶植忠于自己的政权，并资助那些能在这一场艰难的冷战霸权角逐中助其一臂之力的派系。\n\n我们俄罗斯的地缘政治逻辑亦是如此：到头来，我们也必须去扶植那些忠于我们的政权。若想在博弈中击败纳粹德国，我们就必须干涉他国的武装冲突，哪怕无法扶持亲俄势力，至少也要援助那些无意与德国同流合污的派系。唯有如此，我们才能尽可能多地将其他国家拉入我国的阵营。也许在未来，这将会发挥决定性的作用。"
