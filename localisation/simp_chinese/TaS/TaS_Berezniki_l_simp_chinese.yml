 MAR_MGB_direct_action_separator:0 "§G直接行动§!"
 MAR_MGB_direct_action_separator_desc:0 "通过采取针对在§Q别列兹尼基§!活动的§K秘密警察§!§o间谍网络§!的§G直接行动§!，§G国家安全委员会§!能够减少其§o特工的数量§!，从而§G削弱§!整个§o网络§!。\n\n然而，§G公开§!采取此类行动也意味着未受打击的§o基层组织§!的实力将会§R增强§!：一般来说，§G直接行动§!会加强§o网络的连通性§!，从而使今后采取§G此类行动§!变得更加困难。§G直接行动§!方案的£political_power_texticon §M政治权力§!§Y成本§!取决于§o网络的连通性§!。"
