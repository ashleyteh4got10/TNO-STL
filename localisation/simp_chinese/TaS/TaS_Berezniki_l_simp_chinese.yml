 RUS_Decision_Smuta_Expansion_BKR_MAR_Propose_Union_desc: "在卡津别克看来，艾哈迈德-扎基是一位英明果决之人。他全心全意为其族人而战，因为他早已厌倦了苏联和俄罗斯帝国官员对待巴什基尔人的方式。因此，艾哈迈德-扎基将会对卡津别克的计划极感兴趣。"
 RUS_Decision_Smuta_Expansion_VOL_MAR_Propose_Union_desc: "沃洛格达由逃亡将军瓦西里·伊万诺夫统治。它是一个“中立”国家，但我们必须结束它的“中立”。今天，卡津别克正在召集将军们开会，他们将在会上决定沃洛格达的命运。"
 RUS_Decision_Smuta_Expansion_KOM_MAR_Propose_Union_desc: "在科米，民主派人士成功地保住了政权，没有让这株稚嫩的民主之花凋零。我们与他们的关系相当良好。科米共和国的许多人和我们一样，希望结束俄罗斯的分裂状态，恢复其昔日的辉煌。既然我们可以简单地运用民主的工具，又何必发动一场血腥的兄弟相残之战呢？"
