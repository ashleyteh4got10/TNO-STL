 MAR_vytnetwork_tt:0 "§Y保卫部§!目前的力量：[?MAR.MAR_Okhranka_power]"
 MAR_vytnetwork_tt_desc:0 "别列兹尼基国家安全部完全不隶属于维亚特卡沙皇弗拉基米尔三世，而是隶属于亚历山大·卡津别克。别列兹尼亚科夫的国家安全部效仿保卫部，主要负责别列兹尼基本身的安全，并充当卡津别克的耳目。然而，最近卡津别克越来越远离维亚特卡这个权力中心，现在安全局必须寻找任何影响整个国家的弗拉基米尔的影响力。既有弗拉基米尔三世的公开支持者，也有来自维亚特卡的保卫部秘密特工，他们干扰了我们治理国家的能力。\n\n[ MAR_MGB_GET_CURRENT_QUEST]"
 MAR_MGB_Quest_resource:0 "安全局当前的目标是为最终摆脱维亚特卡的影响做好准备。为此，必须完成几项较小的任务：减少并最终完全停止向维亚特卡提供自然资源，清除党内弗拉基米尔三世的走狗，镇压一切支持维亚特卡的情绪。因此，我们必须进行秘密斗争，以避免引起任何公开的怀疑，并最终§R防止别列兹尼基被摧毁。§!"
 MAR_MGB_Quest_Existence:0 "我们没能阻止向维亚特卡运送我们的自然资源。他们对我们的影响太大了，我们没能从弗拉基米尔三世手中抢走这些资源。不过，我们已经拉开了足够的距离，可以尝试再次挣脱。一旦机会来临，我们必须做好准备，但§R不会再有第二次机会了。§!"
 MAR_column_tt:0 "目前§R主权受到破坏§!的程度：[?MAR.MAR_MGB_vyatka_angry]"
 MAR_column_tt_desc:0 "这一次不是......叛徒？第一次，我们还能侥幸逃脱一些可疑的活动，但如果被抓到两次，那他们就肯定完蛋了。"
