 KUR_Vladimir_Zhirinovsky:0 "弗拉基米尔·日里诺夫斯基"
 POLITICS_VLADIMIR_ZHIRINOVSKY_DESC:0 "来自哈萨克斯坦的职业军官弗拉基米尔·沃尔福维奇·日里诺夫斯基，在正确的时间出现在了正确的地点。他在与伊拉克库尔德人并肩作战的“志愿旅”中步步高升，最终率领部队控制了巴格达，并出人意料地成为了沙皇别洛泽尔斯基宣布成立的俄罗斯殖民地的领导人。\n\n如今，伊斯兰主义者、复兴党人以及形形色色的其他极端分子对日里诺夫斯基政权虎视眈眈，但这并没有吓倒这位自由民主理念的忠实追随者。关于他惊人的个人魅力和慷慨激昂的演讲的传说早已不胫而走，许多人相信，他本人已经准备好与敌人面对面地对抗，并高呼“胆敢向巴格达开枪！”"
 KUR_Saddam_Hussein_party:0 "伊拉克人民联邦党"
