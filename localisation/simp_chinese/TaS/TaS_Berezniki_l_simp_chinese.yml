 MAR_THENEWORDER_DESC:0 "别列兹尼基，虽仅为沙皇弗拉基米尔三世治下维亚特卡的一隅东部省份，却在其总督亚历山大·卡津别克的引领下，成为了一片特立独行的地域，不仅在西部版图之中独树一帜，甚至可能在整个自由俄罗斯亦是如此。卡津别克致力于融合沙皇与苏维埃政权之精粹，其思想孕育出青年俄罗斯主义理念，力求将两大政权融会贯通，相得益彰。虽说“青年俄罗斯主义”已广为人知，但众人依旧倾向于将别列兹尼基视为自由俄罗斯阵营中的一匹黑马，其融合两种互不相容意识形态的疯狂构想，令人匪夷所思。\n\n卡津别克及其麾下之众名义上臣服于弗拉基米尔三世，虽则他们在某些议题上尚能寻得些许共识，然显而易见，此种现状终将难以为继。亚历山大对俄罗斯的未来抱持着独到之见解，与沙皇弗拉基米尔的构想背道而驰。或许世人应当重新审视其所蕴藏的潜能了？"
