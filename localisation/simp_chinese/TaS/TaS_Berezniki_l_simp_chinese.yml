 MAR_initial.12.t:0 "谢尔盖·谢尔盖耶维奇的改行"
 MAR_initial.12.d:0 "别洛泽尔斯基感觉糟透了。他痛苦挣扎，辗转反侧，寻求救赎，却只找到了新的痛苦。他的脑袋像是被几千支长矛扎穿，又被几千把锤子猛砸。简而言之，他正在为昨天的“纵情狂欢”付出代价。\n\n卡津别克带着一瓶救命的伏特加来了。一阵感恩的咕嘟声宣告了这瓶救命的琼浆只剩下将将半瓶。别洛泽尔斯基擦了擦嘴唇，用充满感激的眼神凝视着他的救世主。\n\n“谢尔盖，”亚历山大·利沃维奇开口了，“你真的是留里克王朝的后裔？”\n\n将军爬进五斗橱，翻箱倒柜两分钟后，递上了一个装有文件的薄文件夹。卡津别克读了读，叹了口气，斟词酌句地说：\n\n“嗯……你的贵族身份有点过时了，但在1612年的缙绅会议上，他们还曾经考虑过更不合适的人选呢……”\n\n别洛泽尔斯基晃了晃脑袋，用他那迷蒙的双眼盯着他的摄政王。\n\n“你想让我当沙皇。” 他陈述道，而不是疑问。\n\n“是的。” 卡津别克回答。\n\n仿佛一个世纪过去了，然后又是一个。\n\n“缙绅会议。是你自己提出来的，我可是抓住了你的话柄。如果它选择了我，我愿意接受。但选举必须公正、透明，而且要当着我的面进行。别他娘的搞那些暗箱操作。”\n\n“你的条件……”\n\n“你要是不接受我的条件，那就去找别人当你的沙皇去。”\n\n摄政王绝望地捂住了脸。"
 MAR_initial.12.a:0 "“行。你会那就依你办个缙绅会议。”"
 MAR_initial.13.t:0 "阅读家族谱系"
 MAR_initial.13.d:0 "情报人员围着一张大桌子团团转，手里拿着硬纸板档案夹、各种文件、历史文献和贵族地契。尽管距离革命才过去半个世纪，但许多关于罗曼诺夫家族后裔的资料早已遗失或损毁。为了重塑家族谱系，巩固弗拉基米尔三世的统治合法性，不得不动员全欧洲的移民圈子参与资料收集工作。亚历山大·卡津别克、弗拉基米尔·吉尔和省级档案馆馆长安德烈·鲍里索维奇·叶利谢耶夫正埋首于文件堆中。\n\n“瞧瞧，亚历山大，照这么看，咱仨都是罗曼诺夫家的人啊，”吉尔笑了笑，“这是闻着权力的味儿了，这些开出租车的后裔都冒出来了。”他啐了一口，“这帮没根儿的王八蛋。”他的脸色阴沉下来。\n\n“您是在说叶利谢伊·尼古拉耶维奇吗？”安德烈·鲍里索维奇扶了扶眼镜，捋了捋胡子，“他是旁支。尼古拉二世的妹妹克塞尼娅·亚历山德罗芙娜的孙子。虽然是贵庶通婚，还在德国军队服过役，但总的来说，还算符合条件——毕竟，您也知道，弗拉基米尔他也不是什么圣人。”\n\n“这个我们知道，安德烈·鲍里索维奇，我们得做个决定了。”卡津别克皱着眉头。\n\n“那我建议您参考一下塞缪尔·戈尔弗斯塔德的资料。”安德烈·鲍里索维奇说。\n\n“可他就是那个萨姆·约翰逊啊，”吉尔转向档案管理员，“这哪儿来的皇室血统？”弗拉基米尔难以置信地说。\n\n“他祖父移居美国了，不过这没什么，”安德烈·鲍里索维奇耸了耸肩，“这事儿常有。”\n\n“您觉得他还会说俄语吗？”吉尔撇了撇嘴。\n\n“我想会的。”老人点点头，弗拉基米尔的目光变得涣散，仿佛肚子上挨了一拳，然后他又揉了揉下巴，好像刚被勾拳打中一样。\n\n“萨沙，咱们就选玛丽亚·弗拉基米罗芙娜吧，结束这场闹剧。她才九岁——这么说吧，你可以按自己的方式培养她，而且她也跑不远。咱们就这么办吧。成吗？”吉尔看着卡津别克。\n\n“我们需要考虑一下，”卡津别克盯着文件，叹了口气。“好吧，这也不失为一个选择。"
