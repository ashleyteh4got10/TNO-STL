 MAR_MGB_collaboration_action_separator_desc:0 "§K合作行动§!能够通过履行我们对沙皇的义务来消除§K维亚特卡政府§!的§o怀疑§!。§K合作§!能够通过§G提高§!其§g网络强度阈值§!来§G简化§!§f行动§!的执行，§R但代价§!是牺牲§Q别列兹尼基的发展潜力§!。\n\n§g完成§!某些§f行动§!后，与之相关的§Y决议的效果§!可能会§Y发生变化§!，并且会§G提高§!§f行动\"§!§M水晶之月§!§f\"§!的§g网络强度阈值§!。"
