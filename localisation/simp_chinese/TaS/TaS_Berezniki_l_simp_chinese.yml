 MAR_forpol.201.t:0 "旭日之陨"
 MAR_forpol.201.d:0 "柯西金和基里尔两人神色紧张地坐在同一间办公室内，翻阅着一份又一份的情报报告和外国报纸上的头版头条。所有这些信息都在诉说着同一个事实：“日本已向人民解放阵线投降”。这样的消息简直令人难以置信，如同天方夜谭一般，但它确确实实地发生了。\n\n“沃瓦，我们是不是…算错了一步？”阿列克谢问道，目光转向坐在身旁的基里尔。\n\n“岂止是算错了一步，整个‘共荣圈’几乎已经土崩瓦解了，而等待着日本的，将会是一场前所未有的灾难。”克格勃局长确认了沙皇的担忧。\n\n“那我们现在该怎么办？”\n\n“趁着大船还没沉，赶紧跳船逃生吧。我们必须立刻断绝与东京方面的一切联系，转而与华盛顿建立起沟通的桥梁。”\n\n“想要在这个节骨眼上完成如此重大的外交转向绝非易事，但我会想办法联系上那些潜伏在我国境内的、中央情报局残存的情报网络。”\n\n“很好，放手去做吧。”\n\n说完，基里尔起身离开了办公室。与此同时，柯西金开始逐一拨通国内所有重要部门的电话，他向这些部门下达的指示简明扼要："
 MAR_forpol.201.a:0 "立刻切断与东京方面的一切联系。"
