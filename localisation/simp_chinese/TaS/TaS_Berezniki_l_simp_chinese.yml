 MAR_return_to_antipin_desc:0 "我们年轻的政府，四面楚歌，危如累卵，甫一成立便面临覆灭之险。非常之时，行非常之事，卡津别克决意再次向安提宾及其麾下的教团求援。此次，我们愿做出让步，授予骑士团成员特权，并亲自册封安季平为大牧首，盖因他们的理念与我们的愿景在精神上高度契合。"
 MAR_smuta.1.t: "晚间谈话"
 MAR_smuta.1.d: "卡津别克伫立在破旧小屋的入口旁，寒风凛冽，呼啸不绝。院门口，卡津别克的卫兵正以不满的目光审视着全副武装的僧侣们。这栋建筑历经岁月洗礼，甚至连德军的轰炸都未将其摧毁，着实令人惊叹。坦白说，他从未想过与圣乔治骑士团大团长会面会是这般光景。他原本期盼着，他的外交官们能够在一座装饰华丽的教堂内进行磋商。安季平虽然名义上同意通过中间人进行谈判，但却坚持要与卡津别克亲自会面。或许他太过鲁莽，又或是一位狂热信奉自身理念的理想主义者。无论如何，对于一位僧兵领袖而言，此举着实反常。没过多久，这位青年俄罗斯联盟的领袖终于鼓起勇气，叩响了房门。一位身着僧袍的男子应声开门。“请进，贵客临门。”小屋内陈设简陋，只有一张床、一张桌子和一个火炉。唯一的装饰便是墙上琳琅满目的圣像。桌上已摆好了一架烧得正旺的茶炊和两只茶杯。米哈伊尔在桌旁开启了对话。\n\n“阁下是想让我的人追随于你吧，如果我没理解错的话。”大团长安季平率先开口道。\n\n“我正是为此而来。”摄政王卡津别克语气干涩地答道。\n\n“既如此，我想问你几个于我而言至关重要的问题，希望阁下不介意。你是否想将苏维埃带回俄罗斯的土地？那些曾被无神论者布哈林滥用的苏维埃。那些用镰刀砍下异见者头颅，用铁锤摧毁教堂的苏维埃。你当真想让俄罗斯重蹈覆辙吗？”\n\n“绝无此意。苏维埃本身并非是什么邪恶之物。问题在于联盟的当权者。我们不会让苏维埃误入歧途，而且别忘了，这个国家的最高领袖将是沙皇，他的意志便是法律。”\n\n“阁下最终想出的这套体制，还真是别具一格！或许真能行得通……但光有空想还不够。你是否有能力重建俄罗斯，将其从黑暗的深渊中拯救出来？你的意图是否纯正无私？”\n\n“对此，你大可不必心存疑虑。”说罢，这位青年俄罗斯联盟的领袖从口袋中掏出一张照片。\n\n“这么说来，这么久以来我都没听说过雅利安人的消息，都是你的功劳了？瓦格纳和他的那帮匪徒……罪有应得。”\n\n此言之后，谈话又持续了数个小时。僧侣与青年俄罗斯联盟的领袖纵论俄罗斯、上帝以及命运。最后，安季平的一席话为这场讨论画上了句号：“如今我已全然明了你的心意，我的人民将追随你，无论你走向何方。”"
 MAR_smuta.1.a: "真是匪夷所思…"
 MAR_ordens_corps_desc:0 "在俄罗斯无政府状态的废墟之上，圣乔治骑士团的出现可谓独树一帜。在支离破碎的苏维埃无神论国家残骸中，在乱世残酷的混沌之中，一个真正的东正教团体应运而生，其宗旨在于守护弱小与无助之人。那些曾被迫转入地下的神父们，如今手持步枪，不仅以言辞，更以行动践行着上帝的旨意。无人能逃脱天谴。"
 MAR_smuta.2.t: "整合"
 MAR_smuta.2.d: "卡津别克在办公桌前已枯坐良久，手里不停地用笔轻叩着一份文件。身旁，青年俄罗斯联盟领袖的座椅旁，堆积如山的废纸团散落一地，有些写满了字，有些只写了一半，还有些只寥寥数行便被弃之如草芥。亚历山大揉了揉双眼，疲态尽显。这时，敲门声响起。\n\n“进来。”\n\n“晚上好，亚历山大·卡津别克。”别洛泽尔斯基将军开口道。\n\n“原来是谢尔盖啊，快进来。”\n\n“嗯，我本来想简单地跟你汇报一下……好吧，那就长话短说。”\n\n谢尔盖走进来，在桌旁坐下，亚历山大与他相对而坐。\n\n“这些盖尼的信徒，真该死，简直令人头疼不已。我都不知道该如何处置他们了。安季平虽说会支持我，但一切进展都太慢了。”\n\n“怎么了，萨沙？我知道他们还没能很好地融入军队，我这次来就是想跟你谈谈这件事的，但现在看来，情况似乎要糟糕得多啊。”\n\n“可不是嘛，要是仅仅是军队的问题就好了。他们反对推行苏维埃制度，当地居民也拒绝我们的人进入他们的定居点。我真想干脆把他们全都解散算了。”\n\n“等等。如果你解散他们，你的国家就会爆发另一场战争，尤其是考虑到他们现在已经获得了武器。你得谨慎处理这件事，明白吗？”\n\n“对，你说得对，看来我们必须慢慢地将他们融合进来。你能帮我制定个计划吗？”\n\n“我对你们的官僚体系一窍不通。”\n\n“别管那些了，我会润色一下的。你只要帮我构思一个方案就行了。”"
 MAR_smuta.2.a: "骑士团的未来，正一字一句地被书写着。"
 MAR_expand_cooperation_desc:0 "为了进一步加强两地政府之间的关系，我们决定将骑士团的部分牧师编入别列兹尼基的正规战斗部队。这些人不仅拥有在与土匪和暴徒的冲突中积累的丰富战斗经验，还能帮助我们的战士保持士气。只有知道自己为何而战的士兵才能取得胜利。"
 MAR_mladorossi_manifesto_desc:0 "在我们广袤的祖国大地上，仍有许多小派别各自为政。我们一定会把俄罗斯从亡国者的压迫下解放出来，我们将从加强我们的地区开始。虽我们前路艰险，北面是被诅咒的布尔什维克残余势力，南面是疯狂的法西斯模仿侵略者。但我们的《青年俄罗斯宣言》将让他们知道，他们的时间已经到了，而我们则是他们的终结者。"
 MAR_smuta.3.t: "男人与理念"
 MAR_smuta.3.d: "暮色沉沉，小城广场上却人头攒动，熙熙攘攘的人群将这方天地挤得水泄不通。有关青年俄罗斯宣言即将发布的消息早已传遍大街小巷，海报也张贴得到处都是，这份新政府的政治纲领似乎有种魔力，将平日里对政治漠不关心的普通民众也吸引而来，每个人都渴望理解“青年俄罗斯联盟”那不同寻常的主张，或至少触碰到其思想的内核。\n\n一个身着光鲜亮丽却并不浮夸的西装的年轻人登上了简陋的舞台。尽管年纪轻轻，但他站在台上却毫不怯场，举手投足间都散发着沉稳自信的光芒。他走到麦克风前，人群的注意力瞬间被他捕获，只听他高声吟诵道：\n\n“诸位，且听我一言！无论是泯灭人性的法西斯党徒，还是迷途不返的布尔什维克，无论是飘浮于云端的民主主义者，还是压榨民脂民膏的独裁者，你们的末日都近在咫尺！你们向绝望的民众灌输的理念，只会将我们伟大的祖国进一步推向毁灭和衰败的深渊。你们甚至没有意识到，自己已经输掉了最重要的战役——与现实的抗争，你们的思想早已被时代的潮流远远甩在身后。看看曾经在萨马拉的合作者们吧，叛徒能为你们带来新的家园吗？一个值得你们为之自豪，并问心无愧地为之献身的祖国？北方的布尔什维克又能给你们什么呢？他们在伟大的卫国战争中没能保护你们，在西俄战争中没能战胜纳粹，如今他们甚至连自己都养不活，你们还要忍受这一切到什么时候？！青年俄罗斯联盟运动与那些一文不值的政客、将军和贪官污吏不同。我们不惧怕拥抱新思想，我们的新意识形态与时俱进。我们，青年俄罗斯联盟，想要公开而直接地宣告——你们的道路已经走到了尽头，放下武器、停止抵抗才是符合你们自身利益的选择。敞开胸怀接纳我们，我们将不吝仁慈！”人群报以热烈的掌声。\n\n掌声平息后，人群中传来同样的疑问：“这年轻人是谁？”\n\n很快，整个西俄罗斯都知道了爱德华·萨文科——青年俄罗斯之声。"
 MAR_smuta.3.a: "一个真正的爱国者。"
 MAR_struggle_for_the_russian_spirit_desc:0 "何谓俄罗斯人？何人可堪称俄罗斯人？我们可以锱铢必较地测量眼距，将鼻梁、嘴唇和额头与脑海中理想化的形象进行比对，但如此一来，我们与东方的法西斯分子又有何异？不，身为俄罗斯人，意味着时刻准备着捍卫我们的祖国和我们所爱之人。我们不关心你的宗教信仰，亦不计较你的身体优劣。只要你心甘情愿，无私奉献，愿为祖国之重新统一贡献绵薄之力——你便是一位真正的俄罗斯人。"
 MAR_smuta.4.t: "俄罗斯精神"
 MAR_smuta.4.d: "大动乱的飓风逐渐从俄罗斯大地上消退。各地的人们仿佛从冬眠中苏醒，开始回归正常生活。城市里工厂拔地而起，商店纷纷开张，剧院重新开演，人们不再一听到风吹草动就躲进掩体。\n\n在一个公园里，辛苦而充实的一天工作结束后，两个朋友在一张长椅上放松休息。\n“听着，瓦夏，我一直想问你，但不知怎么就忘了。你这么不寻常的父称——伊雷苏罗维奇——是怎么来的？”\n“得了吧，萨尼亚，你不知道吗？我可是个鞑靼人，不过只有一半鞑靼血统。我父亲的名字叫伊雷苏尔，他和德国佬打过仗，而且打得还不错，还得了枚什么勋章，后来被弹片击中，在医院里遇到了我母亲。”\n“好吧，够了，我明白了。那你懂鞑靼语吗？”\n“不懂，我们家只说俄语，我父亲不太喜欢鞑靼文化。他是这样教我的——最重要的是人要正直，其他都是次要的。”\n萨尼亚抬起头，望着头顶的云彩。\n“你父亲说得对。我甚至都不记得我父亲了，他在41年参军，在我出生之前就牺牲了。我妈说他来自高加索地区的某个地方，是个勇敢的高地人，”萨尼亚咧嘴一笑，“我母亲的娘家姓什尼佩尔松，起初她想用我外祖父的名字给我起名——伊兹亚，那就搞笑了。”\n瓦夏哈哈大笑，“我已经能想象到海报上的字样了：“工厂工人，一级车工——伊兹亚·什尼佩尔松！”\n朋友们一起为这个想法大笑起来。\n“听着，萨尼亚，不过你有没有想过。我有一半鞑靼血统，你有一半犹太血统，另一半就算是达吉斯坦人吧。那我们到底是什么人？”\n“我们是什么人？你难道不明白吗？”"
 MAR_smuta.4.a: "我们都是俄罗斯人。"
 MAR_fire_that_will_forge_nation_desc:0 "患难见真情，战火见真章。战争无疑是可怕而令人憎恶的，但我们不能否认一个显而易见的事实：我们全新的视野，将在冲突的熔炉中锤炼而成。正是在血战的危急关头，人性的光辉才能得以彰显。他是真正的勇者，还是胆怯的懦夫？这烈火，战火，军事冲突的烈焰，将帮助我们认清自己的真面目。"
 MAR_evolution_before_revolution_desc:0 "十月革命和随后的苏维埃国家都是失败的实验，导致了俄罗斯大地的崩溃。但只有少数人明白，革命从一开始就注定要失败，人们在思想上接受了新政权，但在内心深处却拒绝接受它。我们不会重蹈覆辙，我们的工作不是从革命开始，而是从俄罗斯人民意识的发展开始。每个人都将明白自己在我们共同事业中的位置，我们将团结一致，所向披靡。"
 MAR_idea_of_tsar_and_soviets_desc:0 "卡津别克的理念是真正意义上的创新。将独裁君主与去布尔什维克化的苏维埃，即地方自治机构，巧妙地结合在一起。彻底摒弃极权主义，拥抱精神博爱和严格的民族纪律。这些看似格格不入的元素，和谐地融为一体，构成了一个完整的体系。我们需要将青年俄罗斯运动的核心思想汇集成册，这本小册子将成为我们面向大众的喉舌。"
 MAR_enemies_by_situation_desc:0 "在征服了所有那些实力不及我们的北方军阀之后，我们与西俄罗斯革命阵线正面对峙。这支一度几乎在与纳粹的战争中取得胜利的武装力量，至今仍对我们构成严重威胁。\n\n与我们一样，他们的军事实力足以将整个西俄罗斯团结在其旗帜之下。在西俄革所有剩余的对手中，就只剩下我们了。显而易见，他们迟早会对我们发动攻击，因此我们必须先发制人。我们必须做好与革命阵线开战的准备。"
 MAR_smuta.6.t:0 "最后的边疆"
 MAR_smuta.6.d:0 "卡津别克坐在办公室里，手里拿着最新的军情报告，思绪却飘向了苏维埃。他从对当前西俄罗斯革命阵线的沉思开始，逐渐深入记忆的迷宫，回溯至西俄罗斯战争、伟大卫国战争、三十年代、二十年代，最终定格在1917年。\n\n回想起当时的自己以及那段风云激荡的岁月，卡津别克再次确信，青年俄罗斯联盟与当前西俄罗斯革命阵线的共产主义者之间，存在着许多共通之处。例如，权力与人民的紧密联系。在共产主义者治下，权力远比尼古拉二世时期更贴近人民。青年俄罗斯联盟渴望实现同样的权力变更，但前提是保留沙皇。唯有如此，才能在国家内部实现和谐与繁荣。\n\n必须承认，共产主义者信仰的东西至少在某些方面是正确的，他们解决了帝国时代遗留下来的诸多问题。尽管布哈林在伟大卫国战争中惨遭失败，但仍有许多人对社会主义深信不疑。如果社会主义真的行不通，那么它应该早已被世人抛诸脑后，然而，在俄罗斯各地，从秋明到贝加尔湖，甚至在西伯利亚中部，依然有人信奉共产主义。如今，在阿尔汉格尔斯克，也有他们的追随者。\n\n然而遗憾的是，即便如此，他们在理念上依然与我们存在分歧。他们不愿见到沙皇，而我们则希望建立一个人民的君主制。红色阵营或许将我们视为维亚特卡的傀儡，拾人牙慧，却依然妄图拥立沙皇。此外，他们依然铭记着我们曾与德意志人以及弗拉基米尔三世并肩作战，对抗自己的人民，并将我们视为与萨马拉的那些人无异的通敌者。\n\n在这些以及其他问题上，我们与西俄罗斯革命阵线存在着严重分歧，他们将我们视为必须立刻铲除的敌人。他们迟早会发动进攻，我们不必抱有任何幻想。无论他们在精神上与我们多么接近，我们都必须立即对革命阵线发动打击。"
 MAR_smuta.6.a:0 "他们只是因时势而成为敌人。"
 MAR_virtue_of_mercy_desc:0 "我们击败了一些对我们构成威胁的军事领导人。值得一提的是，他们麾下拥有许多才华横溢的指挥官，在与我们和纳粹的战斗中展现出丰富的作战经验。尽管他们现在是我们的敌人，但他们仍有机会在青年俄罗斯的旗帜下重新服役。"
 MAR_smuta.7.t:0 "昔日的敌人"
 MAR_smuta.7.d:0 "不可否认，在西俄罗斯的战争期间，我们青年俄罗斯联盟不得不与对我们构成严重威胁的指挥官交手。这些人员是俄罗斯非常宝贵的资源。正如维亚特卡的情况一样，我们计划吸引许多已经证明自己是最好的一方了的将军。\n\n别洛泽尔斯基写信给关押着这些将军的监狱，提出了加入青年俄罗斯联盟的条件。不出所料，他们中的许多人拒绝投靠敌人，而是亲自支持卡津别克。为了引起兴趣，我们询问了他们做出这一决定的原因。他们中的许多人说，他们不喜欢沙皇这个想法本身，因为这意味着君主制的回归，而君主制在过去已经对国家造成了损害。尽管他们记得我们当时摧毁了维亚特卡，但他们不相信我们的事业是正义的。\n\n别洛泽尔斯基向卡津别克报告了这一情况。卡津别克经过深思熟虑，做出了一个决定——宣布大赦革命阵线的将军、指挥官和士兵，以换取他们停止任何反对别列兹尼基的活动。他们可以过自己的和平生活，甚至可以加入别列兹尼基的军队，但在任何情况下都不得反对我们。他将自己的行为解释为对敌人的最高敬意。"
 MAR_smuta.7.a:0 "即使是敌人，也可以成为朋友。"
 MAR_obstacle_is_obstacle_desc:0 "布尔什维主义的思想就像瘟疫一样，如果不彻底根除，就会感染整个民族的思想。是的，我们与他们有一些共同之处，但如果共产党人的思想渗透到我们的队伍中，我们的国家就有可能在襁褓中被摧毁。我们不能有任何疑虑；我们必须消灭布尔什维克在我们国家的一切痕迹。"
 MAR_our_cause_is_right_desc:0 "我们国家的北部领土已完全处于控制之下；被征服领土上的国家机器已经开始工作。是时候继续我们解放西俄罗斯的行动了。我们要让这些无赖和恶棍知道，他们的末日即将来临，这是前所未有的，因为我们的事业是正确的，老百姓站在我们这一边。最终，战斗的胜利将属于真理的一方。"
 MAR_call_to_the_base_desc:0 "在世界上，有些人不仅对俄罗斯国家地位的衰落感兴趣，而且出于各种原因，他们从一个能够抵抗德国和团结协定的强大而统一的俄罗斯中获益。其中包括美国，他们随时准备为我们提供实际支持，但目前我们还不能公开接受赞助。\n尽管如此，我们还是通过中情局的渠道得到了一些援助，现在我们需要报告的是，这些资源已经用于其预期目的。"
 MAR_smuta.5.t:0 "老地方变不了"
 MAR_smuta.5.d:0 "在俄罗斯无政府状态下的荒原上，小酒馆并不罕见。它们通常还兼营着旅馆和妓院。毕竟，人们总是需要一个地方，花一点小钱，就能暂时忘记现实的残酷。\n\n尤金正在这样一家小酒馆里消磨时光。他手里端着一杯不知名的液体，这东西散发着浓烈的酒味，酒保骄傲地称之为“皇家佳酿”。尤金盯着杯中自己的倒影，思考着俄国君主制的垮台与“皇家佳酿”之间是否存在某种联系。但很快，他的思绪就飘向了遥远的东方，飘向了加州，他的家乡。\n\n尤金还是个孩子的时候，他的父母就带着他从俄罗斯移民到了美国。他对那段时光已经没有任何记忆了，但他的父母一直为自己的俄罗斯血统感到自豪，因此，尤金从小就听着关于那片蔚蓝的天空和广阔麦田的故事长大。尽管他的朋友们都叫他杰克，但在他的护照上，他仍然叫尤金。命运的安排，让尤金引起了美国情报机构的注意。他们非常希望尤金能为他们工作，因为他们需要一个自己人在俄罗斯的荒原上活动。就这样，尤金的人生轨迹发生了改变，他来到了西俄罗斯腹地的这家破败酒馆。\n\n一个陌生人走进了酒馆，打断了尤金的思绪。\n“最近天气不错。”陌生人说道，“东边在下雨。”\n接头暗号对上了，是时候谈正事了。陌生人没有多说废话，直接把一个文件夹放在了柜台上。\n“我们共同的朋友为我们提供了宝贵的帮助，在这个文件夹里，您将看到这些投资的成果。我们都衷心希望能有进一步的合作。”\n陌生人拿起尤金的酒杯，一饮而尽，然后转身离开了酒馆，留下有些错愕的特工独自一人。"
 MAR_smuta.5.a:0 "“好吧，至少我不用喝这个了。”"
 MAR_prepare_to_zemsky_sobor_desc:0 "我们针对叛乱军阀和不忠统治者的战争即将结束，青年俄罗斯的理念必将取得最终的胜利。我们将解放所有尚未沦陷于德国人手中的西俄罗斯领土，基本恢复到曾经的东线边界。只有在我们英明领导下，凭借着青年一代的英雄主义，才能最终实现俄罗斯统一的伟大理想。然而，尽管俄罗斯欧洲部分的大片领土仍然处于敌人的控制之下，但我们必须开始考虑未来的行动了。我们需要尽快召开缙绅会议，解决我们面临的一些问题。"
 MAR_zemsky_sobor.2.t:0 "搬迁"
 MAR_zemsky_sobor.2.d:0 "别列兹尼基是一座历史悠久的城市。正是在这里，青年俄罗斯联盟和卡津别克定居下来，并在彼尔姆敌人的狂轰滥炸和不断袭击下生存了下来。在我们的努力之下，别列兹尼基从半废墟变成了一个工业繁荣的城市，经济也因此相当不错。然而，将首都迁往新城市的必要性已经讨论了很久。在团结在别列兹尼基旗帜下的新青年俄罗斯，这在许多人看来有些轻率。\n\n即使我们的敌人已经被打败，其他人也开始对我们光荣的城市肃然起敬，但这并不能否认我们需要一个更大、更有声望的首都。规模更大、人口更多，声望更高、名声更响。每个人都知道日耳曼尼亚、莫斯科、伦敦、华盛顿等首都的名字——我们也需要这样一座城市，而在它们的背景下，别列兹尼基显得非常微不足道。但这还不是主要问题。最主要的问题是，随着我国的扩张，目前的机构已经无法承受。行政机构根本无法应对如此大的工作量，而且坦率地说，扩张也无利可图。此外，别列兹尼基没有足够的人员和经济实力来维持俄罗斯现有的权力。现在是认真考虑迁都问题的时候了。\n\n在西俄罗斯现有的所有城市中，最合适的选择只有前科米共和国的首都瑟克特夫卡尔和被推翻的弗拉基米尔三世的首都维亚特卡，这两个城市同样非常适合扮演首都的角色。现在只剩下一个选择——首都在哪里，缙绅会议就在哪里举行。卡津别克选择了..."
 MAR_zemsky_sobor.2.a:0 "我们将迁往瑟克特夫卡尔，民主之都将进一步显示我们会议的民主性质。"
 MAR_zemsky_sobor.2.b:0 "我们将迁往维亚特卡，弗拉基米尔三世的首都将展示我们统治者的伟大。"
 MAR_zemsky_candidates_desc:0 "最后，当我们能够确定未来缙绅会议的组成，并且几乎为这些选举做好了一切准备时，是时候考虑候选人本身了。候选人已经有了，剩下的就差把他们介绍给人民了。\n\n目前最重要的问题是——人们会把票投给谁？"
 MAR_zemsky_sobor.3.t:0 "投票者"
 MAR_zemsky_sobor.3.d:0 "尽管西俄罗斯之战的硝烟已然散尽，卡津别克依旧夙夜匪懈，其辛劳程度丝毫不亚于战时。令人惊奇的是，即便在和平年代，卡津别克依旧需要处理成百上千桩大小事务。然而，当前最为紧要的问题，莫过于全俄缙绅会议的筹备事宜。\n\n会议举办的地点，他早已心中有数。眼下的当务之急，乃是厘清选举团的组建原则。事实上，这个问题并非轻而易举，盖因卡津别克深知，此事极有可能造成政治精英阶层的分裂。我国的军队影响力巨大——正是在他们的引领下，俄罗斯才得以在青年俄罗斯主义的旗帜下团结一心。在即将召开的全俄缙绅会议上，他们定然希望自己的声音能够掷地有声。此外，我国的实业家实力雄厚，他们掌控着越来越多的工厂，足以左右会议的最终决议。不仅如此，青年俄罗斯联盟也从未置身政局之外，他们的意见同样不可忽视。当然，民众，姑且可以这么说，他们更像是这场选举的工具，亦不应被剥夺应有的权利。\n\n对于即将召开的缙绅会议，卡津别克心中早已有了大致的蓝图。1613年那场决定国家命运的缙绅会议的组建原则，给了他莫大的启发。他最终得出结论，必须尝试沿用这一原则，并根据当前的局势和二十世纪的现实情况进行相应的调整。\n\n经过深思熟虑，他最终决定，缙绅会议的成员总数应为200名代表。其中，前100名代表由民众选举产生。民众通过多数制投票选出能够代表各自选区利益的代表。如果某个选区的多数选民投票支持某位候选人，则该候选人将获得该选区的授权，并在缙绅会议上行使投票权。\n\n其余100名代表则由军队、实业家和重要的党内领导人自行推选产生。他们取代了早已过时的“大贵族”概念，毕竟，这个概念在我国已然销声匿迹了或许三个多世纪。这200名代表最终将投票选出最终的候选人。"
 MAR_zemsky_sobor.3.a:0 "让多数获胜！"
 MAR_zemsky_sobor.4.t:0 "候选人：谢尔盖·别洛泽尔斯基"
 MAR_zemsky_sobor.4.d:0 "角逐俄罗斯皇位的头号候选人，便是谢尔盖·别洛泽尔斯基。此人乃是卡津别克的旧识，二人相知已久。别洛泽尔斯基之所以是俄罗斯皇位的热门人选，归功于其与留里克王朝之间千丝万缕的联系。他与留里克王朝的血缘关系可追溯至第十九代，这无疑为他宣称俄罗斯皇位提供了强有力的支持。\n\n谢尔盖亦是一位身经百战的将领。第一次世界大战期间，他担任骑兵卫队参谋长，展现出卓越的行政管理才能。其后，他加入尤登尼奇的军队，出任第二军参谋长。内战结束后，他远渡重洋，赴美在空军部队担任少校，直至苏联解体、西俄罗斯革命阵线覆灭，方才重返别列兹尼基。\n\n尽管他戎马倥偬，且与留里克王朝渊源深厚，但直至不久之前，他仍被视作一个平庸之辈。\n\n伴随着“西俄罗斯争夺战”的打响，他在军界精英之中声名鹊起，凭借其出类拔萃的领导才能与指挥艺术，赢得了广泛赞誉。即便他麾下的将士对其并非敬若神明，至少也对其为赢得这场俄罗斯之战所付出的卓绝努力敬佩有加。此外，那些亲眼见证青年俄罗斯主义崛起的人们也明白，这一切的成就，并非完全仰仗卡津别克一人之力，谢尔盖·别洛泽尔斯基的殚精竭虑功不可没。\n\n不仅民众对别洛泽尔斯基敬重有加，党内上下亦对其推崇备至。作为青年俄罗斯联盟的资深党员，他拥有广泛的人脉，从而获得了坚实的支持。\n\n最后，他极有可能赢得掌控军工复合体的经济巨擘们手中的选票。这些实业家视别洛泽尔斯基为千载难逢的掘金良机，故此他们普遍乐于将选票投给此人。\n\n总而言之，若权衡其胜算，则近期以来其优势已日益显著，我们甚至可以断言，他将在全俄缙绅会议之后荣登西俄罗斯统治者之宝座。"
 MAR_zemsky_sobor.4.a:0 "军队、人民、沙皇。"
 MAR_zemsky_sobor.5.t:0 "候选人：玛丽亚·罗曼诺娃"
 MAR_zemsky_sobor.5.d:0 "玛利亚·罗曼诺娃，年方十岁，却对俄罗斯皇位拥有不容小觑的宣称权。身为约莫半个世纪前被推翻的皇室成员，提及罗曼诺夫家族，近来在大众之中，即便未唤起怀旧之情，至少亦能引发敬重与尊崇，此事听来或许匪夷所思。即便是布哈林执政时期，亦曾大肆开展诋毁罗曼诺夫家族的运动，却收效甚微。甚至连弗拉基米尔三世曾是纳粹死忠通敌者这一事实，亦未能在民众之中激起明确无误之情绪。\n\n玛利亚，即便年仅十岁，在法理上亦可宣称对俄罗斯皇位之继承。然而，限于其年幼，她尚无力亲政。若粗略审视其成为女皇的可能性，或许会令人产生错觉，认为其胜算高于别洛泽尔斯基。但若深究其年幼之境况，则极有可能扭转权力之天平，令谢尔盖占尽上风。且即便她荣登女皇宝座，亦难以妥善治理国家。\n\n有一计策可令局势豁然开朗。卡津别克已然摄政，他将以玛利亚摄政王及国家二号人物之身份示人。此中玄机，颇堪玩味——若卡津别克被推举为玛利亚之摄政王，则最终民众所投票支持的，或许并非玛利亚本人，而是亚历山大·卡津别克。卡津别克在平民百姓中享有极高声望，毕竟是他，虽说离不开别洛泽尔斯基之襄助，终究一统了俄罗斯。民间普遍认为，正是卡津别克运筹帷幄，制定国策，而谢尔盖·别洛泽尔斯基仅仅是付诸实施亚历山大的理念罢了。当然，亦有呼声认为，鉴于上述理由，卡津别克理应继续执掌国家大权。这一观点，得益于这样一种认知——如此一位深谙治国之道的贤能之士，理应尽可能长久地统御俄罗斯，毕竟，绝不能容许西俄罗斯重蹈西俄罗斯战争后的覆辙，再度分崩离析。\n\n无疑，这般局面对于卡津别克而言，或许正中下怀，毕竟，在历经千辛万苦之后，他未必甘心如此迅速地告别政坛。故此，玛利亚与卡津别克的这一“联盟”可谓牢不可破。然而，归根结底，卡津别克只能在玛利亚羽翼未丰之时摄政，终究须待其长大成人，亲政主事。至于未来走向如何，且待时光揭晓。"
 MAR_zemsky_sobor.5.a:0 "美德、团结、力量。"
 MAR_zemsky_sobor.6.t:0 "与过去的联系"
 MAR_zemsky_sobor.6.d:0 "卡津别克端坐于办公桌前，凝视着一张一年半前的旧报纸。这份报纸本身依旧完好无损，并未泛黄破旧，但显然早已不再新鲜。然而，究竟是何缘由，让它依旧令卡津别克如此在意？他之所以珍藏至今，皆因头版上一则引人注目的标题——“阿列克谢·柯西金——阿列克谢·罗曼诺夫？”他一直妥善保存，以便将来有朝一日能够派上用场。而今，这一刻终于到来。\n\n阿列克谢·柯西金，这位如今在青年俄罗斯联盟内炙手可热的人物，此刻正在办公室中埋头处理公务。结束手头工作之后，柯西金如约来到办公室。他推门而入，卡津别克随即起身相迎。柯西金落座于桌边。\n\n卡津别克略略扫视了一眼报纸，将其置于柯西金面前，随即展开对话。\n\n“不知您此番前来，有何贵干？”卡津别克问柯西金。\n\n“国民大会即将召开，而主要候选人早已尘埃落定。”柯西金对卡津别克说道。“我真心相信国民大会定能圆满成功，但倘若发生意外变故，又该如何应对呢？”\n\n“比方说？”卡津别克追问。\n\n“假设玛利亚与谢尔盖的票数持平。”柯西金回答道。\n\n“您认为这种可能性存在吗？”卡津别克问道。\n\n“您想啊，别洛泽尔斯基如今在民众中声望颇高，而玛利亚之所以会被纳入考量，仅仅因为她能让您统治国家的时间更久一些，同时，你们二人胜算均等。倘若民众无法决断该投票给谁呢？这种情况并非不可能发生，我对此深有体会。”柯西金对卡津别克说罢，稍作停顿，又继续说道，“我可以成为俄罗斯皇位的新候选人。依据这篇报道，我可以证明自己拥有皇位继承权，并以阿列克谢·罗曼诺夫之名昭示天下。”\n\n卡津别克思忖片刻，开口说道：“坦诚而言，倘若支持罗曼诺娃与支持别洛泽尔斯基的选票势均力敌，我可以考虑让您成为下一位候选人。”卡津别克说道。“也就是说，您可以作为一张争夺选票的王牌，或者在国民大会之后，成为新的统治者，因为您将成为团结俄罗斯各方势力的核心人物。”\n\n“您真的愿意给我这个成为候选人的机会？”柯西金带着一丝忐忑问道。\n\n“是的，确有此意。不过，能够佐证您合法性的唯一依据，便是这份报纸了。”卡津别克指了指眼前的那份旧报纸。“但我想，在特定情况下，民众会相信您与罗曼诺夫家族有着血缘关系。”"
 MAR_zemsky_sobor.6.a:0 "与过去的联系就此结束。"
 MAR_zemsky_sobor.7.t:0 "候选人：阿列克谢·罗曼诺夫？"
 MAR_zemsky_sobor.7.d:0 "阿列克谢·柯西金曾是科米共和国一位举足轻重的政治人物。在其民主统治下，他凭借领导的派系，在力所能及的范围内左右着科米的政局。然而，随着科米共和国的覆灭，他转而在党内崭露头角。早年的功绩，加之其在别列兹尼基政坛上的不懈努力，为他积攒了雄厚的政治资本。\n\n柯西金自幼便展现出惊人的数学天赋，令人叹为观止。他能够心算复杂的乘法运算，极少出现计算错误。在同龄人中，他的才智出类拔萃。革命之后，他在新西伯利亚经营一家合作社，并积累了相当可观的财富。在布哈林时代，他的合作社是屈指可数的盈利企业之一，后来，他还在列宁格勒拥有一家纺织厂。然而，卫国战争结束后，他辗转流落至实行民主制度的科米共和国。\n\n近年来，科米境内流传着一个传闻，称柯西金的真实身份，实乃阿列克谢·罗曼诺夫——那位在1918年7月16日至17日夜间奇迹般幸存下来的皇子。这一消息在科米境内引发轩然大波，盖因有相当有力的证据表明，柯西金确系罗曼诺夫家族后裔。从五官轮廓的惊人相似，到性格特征与思维方式的如出一辙，无不佐证着这一说法。同时，有人解释道，阿列克谢·罗曼诺夫据说是布哈林的养子，因此他被赋予了新的身份和姓氏。这或许能够解释诸多疑点，例如，为何柯西金-罗曼诺夫在苏维埃时代如此富有。\n\n尽管如此，围绕这一理论的质疑之声亦不绝于耳，许多人将其视为无稽之谈，但也有人对此深信不疑，而另一些人则嗤之以鼻。无论如何，在卡津别克看来，这足以成为他通过缙绅会议角逐俄罗斯皇位的理由。\n\n然而，他登上皇位的可能性微乎其微。究其原因，依旧在于柯西金的为人所知，主要是以柯西金的身份，而关于他与罗曼诺夫家族关系的报道，也仅限于在科米境内流传。世人对柯西金的了解，仅限于他是一位亲民的政治家，在处理问题时非常民主，而他在科米的功绩，远比他与罗曼诺夫家族的关系的传闻更为人熟知。即便他真的意外登基，其政权的合法性也根基薄弱，因为民众对他作为罗曼诺夫家族后裔的身份仍然抱有极大的怀疑。出于同样的原因，他在军队和知识分子阶层中也缺乏广泛支持。唯有少数实业家对他表示支持，他们相信柯西金在国家对经济的控制方面会较为温和，但这种支持力度远不及别洛泽尔斯基。"
 MAR_zemsky_sobor.7.a:0 "我的力量来自人民的爱。"
 MAR_zemsky_sobor.8.t:0 "该做出选择了"
 MAR_zemsky_sobor.8.d:0 "缙绅会议即将召开，连老百姓都有机会投票的消息早已人尽皆知。周日，投票程序开始，安德烈·莫罗佐夫是工厂里一名普通的车床操作员，他决定要行使自己的权利，为自己的候选人投上一票。基于个人的同情和考虑，他彻夜思考该投给谁。\n\n最后，他来到投票站，拿到了一张写有候选人选项的选票。他拿起笔，决定把选票投给..."
 MAR_zemsky_sobor.8.a:0 "..."
 MAR_zemsky_voters_desc:0 "在选举本身之前，我们需要那些将选择候选人的人。这应该不会给我们带来什么大的困难，只是有几个问题需要在缙绅会议召开之前解决。\n\n历史表明，在俄罗斯历史上，会议曾一度将我们从困境中拯救出来。我们可以自信地说，现在也是一个类似的历史时期，俄罗斯的命运正在受决，谁将成为统治者并结束动荡的时代也将被决定。但在此之前，我们需要选出谁将成为缙绅会议的选举人。"
 MAR_every_man_is_a_tsar_desc:0 "既然我们已经获得了前沙皇的支持，并开始在新闻中将自己神圣化，那我们就可以开始专注于我们的竞选承诺。即使仍然很少有人相信阿列克谢·柯西金就是奇迹般地获救的阿列克谢·罗曼诺夫，但当潜在选民听到罗曼诺夫的承诺时，他们可能会放下偏见，仍然投票给我们。"
 MAR_zemsky_sobor.19.t:0 "人人皆沙皇"
 MAR_zemsky_sobor.19.d:0 "在最新一期的“俄罗斯之声”广播讲话中，柯西金·罗曼诺夫开始向民众阐述他的施政纲领。当被问及为何要提前公布未来沙皇罗曼诺夫的纲领时，他答道，以这种方式向民众传达纲领更为便捷，毕竟并非所有人都能耐心研读那些充斥着政客承诺的冗长文件。\n\n柯西金-罗曼诺夫所制定的纲领名为“人人皆沙皇”。这个标题寓意深刻，昭示着在柯西金·罗曼诺夫的治下，俄罗斯的每个人都将过上沙皇般的生活。该纲领具体列出了一系列旨在提升国家福祉的解决方案，例如引入津贴、养老金、最低工资制度等等。务必使俄罗斯公民丰衣足食、衣食无忧、安居乐业，从而消除社会问题，并在其他社会领域取得诸多成就，而新俄罗斯的基石，便是每一位公民的福祉。这一切，都将由沙皇阿列克谢·罗曼诺夫提供保障。如此构想，有何不妥之处呢？\n\n播音员提出疑问，所有这些项目需耗费巨资，从何而来？柯西金-罗曼诺夫回应道，这一切之所以能在俄罗斯得以实现，皆因其丰富的自然资源。俄罗斯幅员辽阔，资源富饶，足以造福万民，这正是他所倡导的理念。与普遍的看法相反，财富并不会被挥霍浪费。这些惠及民众的财富，最终将以税收和商品附加值的形式回流至国家，并在经济体系中循环流动。\n\n最后，播音员向柯西金-罗曼诺夫提出了最后一个问题：“据我们所知，美国政治家休伊·朗曾提出过一个名为‘人人皆国王’的类似纲领。您是否借鉴了他的理念？”"
 MAR_zemsky_sobor.19.a:0 "“当然不是，我甚至都没听说过他。他让人们称王了吗？”"
 MAR_technologies_of_future_desc:0 "现在，我们已经获得了前沙皇的支持，并开始在新闻中受到欢迎，我们可以集中精力做出竞选承诺。即使没有多少人相信阿列克谢·柯西金就是奇迹般存活下来的阿列克谢皇子，但当潜在选民听到罗曼诺夫的承诺时，他们可能会放下成见，仍然会投票给我们。\n\n对军队有影响的承诺一般会引起军队的积极反应。"
 MAR_zemsky_sobor.20.t:0 "迈向未来"
 MAR_zemsky_sobor.20.d:0 "如今，军方在国内拥有很大的影响力。正是由于他们，青年俄罗斯联盟才在军阀割据的西俄罗斯杀出重围。这种影响力还体现在他们现在可以选举新沙皇，当然，他们会尽量投票给愿意为军队提供大量资金的人。别洛泽尔斯基目前是军队中的宠儿。\n\n谢尔盖·别洛泽尔斯基不仅在军队中受到尊重和敬仰，而且还因为他的利益与军队不谋而合而受到爱戴——他愿意花费数百万甚至数十亿卢布来维持军队的最高状态，并进一步统一俄罗斯。军队投票给别洛泽尔斯基，而不是投给同样愿意为军队花钱但规模较小的玛丽亚，这就是为他们选择了一条最好的道路。\n\n如果我们想争取一部分军人选民，就必须提出与别洛泽尔斯基的期望相当的条件。柯西金·罗曼诺夫在“俄罗斯之音”的另一次广播中谈到了他将如何处理军队。他谈到了在真正战斗中军队的必要性，并得出结论说，在当前的现实中尤其需要军队，因为敌人仍然包围着西俄罗斯。在今天，强大军队的存在是国家独立的保障，也是保护公民福祉的保障。随后，他得出结论：我们需要的不是一支庞大的军队，而是一支现代化的一流军队。多一些技能也无妨，它应该为所有战争情况做好准备。但除此之外，它还需要现代化的武器，因为目前的武器已经开始过时。我们需要一流的武器，这样才能在未来数十年内战胜敌人。因此，柯西金·罗曼诺夫表示，有必要研制新武器，必要时甚至可以开始研制超级武器。\n\n这次电台广播后，军方开始认真考虑。不是投给别洛泽尔斯基，而是柯西金·罗曼诺夫。尽管一半的军方选民怀疑柯西金·罗曼诺夫的军事计划，但另一部分选民仍然认为值得投票给阿列克谢。最终，这一选民群体的选票被别洛泽尔斯基和柯西金·罗曼诺夫瓜分了。"
 MAR_zemsky_sobor.20.a:0 "军人们可以肯定，我已许下诺言。"
 MAR_people_for_peoples_tsar_desc:0 "竞选活动很快就会开始，其成功与否将取决于人民的政治倾向。对于阿列克谢·柯西金-罗曼诺夫来说，这一点尤为重要，因为他需要证明自己才是真正的继承人。\n\n与阿列克谢·柯西金-罗曼诺夫不同的是，我们的竞争者都很有实力，不需要再介绍了，而且在声望方面也遥遥领先。因此，我们需要一场出色的竞选活动。"
 MAR_zemsky_sobor.17.t:0 "人民的沙皇"
 MAR_zemsky_sobor.17.d:0 "阿列克谢·柯西金决定扮演罗曼诺夫家族遗老的角色，他无疑是一位经验丰富的政治家，对人民有着深刻的理解。在科米，他代表着一股真正的力量，这进一步证实了他的有效性。然而，在科米之外，他并不像在瑟克特夫卡尔那样知名，人民并不完全了解他。此外，人们不相信阿列克谢·罗曼诺夫能活下来，这也影响了他在普通民众中的声望。\n\n阿列克谢·柯西金需要向整个西俄罗斯宣布自己是尼古拉二世的在世继承人。为了向民众令人信服地证明他确实是尚存的继承人，他需要的不仅仅是鼓动，而是走入民众中间。他需要变得比现在更知名、更受欢迎。他需要比以前更频繁地出现在广播和电视上。总之，他需要用他的演讲来填补所有的自由信息空间，并展示自己作为阿列克谢·罗曼诺夫的形象。\n\n只有通过与媒体巨头的联系才能做到这一点。因此，柯西金联系了别列兹尼基几家电视台和广播电台的老板乔治·谢尔盖耶夫、几家报纸的老板阿特姆·科诺瓦洛夫和几家印刷媒体的经理基里尔·比留科夫。与他们取得联系后，阿列克谢·柯西金说服他们为自己工作，并开始帮助他在民众中宣传自己。\n\n例如，由于科诺瓦洛夫的帮助，柯西金·罗曼诺夫开始经常出现在报纸的头版。通常，新闻报道都会介绍他为人民做了哪些事——比如，他去了一个村子，为全村捐赠了一台拖拉机，现在村里可以用它来改善土地问题。又比如，他向卫国战争和西俄战争孤儿基金捐赠了数千卢布。值得注意的是，他真的干了这一切，但这并不是罗曼诺夫本人的功劳，而是他的赞助人的功劳。\n\n在乔治·谢尔盖耶夫主持的下一期“俄罗斯之音”广播节目中，柯西金·罗曼诺夫作为特邀嘉宾应邀出席。俄罗斯之音的播音员向柯西金·罗曼诺夫提出了人们感兴趣的问题。其中一个问题是“您真的是布哈林的养子吗？”柯西金·罗曼诺夫回答道： “是的，没错。”他开始详细描述当时的情况。乍一看，这似乎是绝对不可能的事儿，但听众们听柯西金·罗曼诺夫说得越久，疑问就越少。至少现在是这样。"
 MAR_zemsky_sobor.17.a:0 "看起来令人信服。"
 MAR_meeting_with_bourgeoisie_desc:0 "我们赢得了人民的支持，但我们不能忘记那些掌握着重要权力的“精英”。只要动动手指，他们就能简单地除掉玛丽亚，甚至更糟......但我们还是不要纠结于这些悲伤的事情了！\n\n今天，卡津别克举行了一个小型'舞会'，他召集了全国所有的官员、企业家和高官，向他们介绍玛丽亚。如果他们喜欢玛丽亚，我们就希望能有几张选票投给她。"
 MAR_zemsky_sobor.11.t:0 "舞吧，舞吧，舞吧！"
 MAR_zemsky_sobor.11.d:0 "亚历山大·卡津别克与将军们正啜饮着从意大利进口的红酒并讨论着一些政治话题。尽管将军们是卡津别克的忠实盟友、同志和朋友，但他们之间却出现了一些“反对派”。一些将军认为选举是不必要的，就算进行选举，他们肯定会支持别洛泽尔斯基。至此，只许一点火星便能使他们的争论升级，但“她”阻止了这一切的发生。\n\n玛丽亚·弗拉基米罗夫娜本人出现在上流社会面前。她从阳台下到大厅，更确切地说，是“从天堂降临到尘世”，穿着一身象牙色连衣裙，戴着一双白手套，留着一个露出颈部和两肩的端庄但迷人的发型。她走下楼梯，向在场的每一个人打招呼。在大厅里，她开始同每个人谈论每件事，从与她交谈的人的表情来看，他们都很高兴。\n\n于是，一个小时过去了。有些人设法离开，而另一些人则喝了些酒，坐在桌子旁，徒劳地试图保持清醒。但大多数人并没有坐在桌子旁，而是去舞池中跳舞。他们从波兰舞曲开始，“绅士”选择邀请他们的“女士”玛丽亚以其简单、轻盈、浪漫的动作吸引了所有人：绅士们扶起女士们的腰，在大厅里旋转。然后是华尔兹......很多的华尔兹。到了舞会的末尾，传统上，他们必须跳一支舞，于是每个人都开始跳起了华尔兹！\n\n现在大厅里空无一人，只有玛丽亚和卡津别克以及将军们站着。玛丽亚说起了话：\n\n“嘿，萨沙叔叔！你不喜欢这场舞会吗？我不仅仅是在玩乐，我还在和整个上流社会交谈。这对我来说算不上高兴，但他们相信我。他们会投票给我，并把钱投资于我们的竞选活动……”\n\n“哦...对...玛丽亚，我是说殿下。我只是有点不知所措，但是的，你做得很好！”卡津别克拍了拍玛丽亚的肩膀。\n\n“好吧，然后我要跑上楼把这件衣服都脱掉。这件衣服可能很好，但我快要喘不上气了！”玛丽亚迅速开口，跑到楼上的房间。\n\n“有什么事困扰着你吗…？”阿达舍夫气愤地问道。\n\n“是…也不是…我不知道...只是些个人看法。”，卡津别克一边说，一边啜饮着他的酒。"
 MAR_zemsky_sobor.11.a:0 "很棒的舞会"
 MAR_donations_to_poor_desc:0 "大家都知道别洛泽尔斯基和玛丽亚之间的政治斗争。但很多人还没有做出决定，因此候选人的总部正竭力引诱选民进入投票站，为他们投票。玛丽亚自作主张，决定在瑟克特夫卡尔和其他许多城市组织流动食品、衣物和其他贵重物品分发中心，这些都是俄罗斯人民迫切需要的。"
 MAR_zemsky_sobor.10.t:0 "面包与马戏"
 MAR_zemsky_sobor.10.d:0 "年轻的工程师瓦西里·克鲁泡特金是柯西金派的前党员，昨天他度过了艰难的一天后醒来。他终于有了一个当之无愧的休息日，他想用这一天来享受福利和快乐。他穿着棕色大衣和优雅的黑色裤子，走到外面。但他看到一大群人几乎是奔着市中心去的。他们为什么要跑到那里去呢？瓦西里很好奇，点燃一支从古巴带来的上好雪茄后，随着人群慢慢走去。\n\n当他到达市中心时，他看到了一个集市，所有的人都聚集在那里。瓦西里拦住一个陌生人开始询问：\n\n“请问，到底发生了什么事？这些骚动是怎么回事？”\n\n“年轻人，你不知道吗？玛丽亚·弗拉基米罗夫娜为我们这些普通人组织了一次食物、衣物和贵重物品的发放活动...”老人稍稍犹豫了一下。“荣耀归于玛丽亚和卡津别克摄政王！”老人大喊一声，然后消失得无影无踪。\n\n啊！又是那个疯子卡津别克！他一直都知道卡津别克不关心普通人，但现在竟然关心到这种程度！难怪在柯西金转投青年俄罗斯联盟后，他就离开了党。这种“分配”在人民面前是一种嘲弄。虽然他是以“摄政王”的身份出现，但不是以“沙皇”的身份。玛丽亚·弗拉基米罗夫娜虽然是沙皇，但她只有10多岁。关于这一切有很多谣言。卡津别克只是想利用她达到自己的目的。\n\n瓦西里走近所谓的“分发处”，年轻姑娘们在那里分发面包（黑面包和白面包）和上好的鸡汤。瓦西里拿了一份“配给”尝了尝。这不是毒药，而是像样的食物。也许一切都不是那么糟糕呢？"
 MAR_zemsky_sobor.10.a:0 "一个新的时代..."
 MAR_party_for_tsarina_and_regent_desc:0 "选举迫在眉睫，西俄罗斯王国的每个人都准备为我们国家的新未来投出自己的一票。人民对投票有着极高的热情，竞选运动也都在热情高涨的向民众宣传“正确的候选人”。别洛泽尔斯基的竞选者试图影响前“白俄”、军事官员和一些“反苏”人士，玛丽亚的竞选者则试图吸引持左翼观点的人。\n\n卡津别克向玛丽亚倾斜，但她还是个小女孩。正因如此，很多人不敢投票给她。为了让他们投票给玛丽，她本人必须相信她神圣的王位宣称。因为只有在她的手中，青年俄罗斯联盟的意识形态才会达到高潮。"
 MAR_zemsky_sobor.12.t:0 "英语课"
 MAR_zemsky_sobor.12.d:0 "“我们下节课要练习翻译技巧。没有作业，你可以好好放松一下。”\n\n“好的，老师！”玛利亚正在收拾课本，老师也准备离开。就在这时，卡津别克走进了玛利亚的房间。他目光凌厉地盯着老师，语气不容置疑：“你先出去，这是我们之间的事。”老师看了看卡津别克，又看了看玛利亚，默默地退出了房间，轻轻地关上了门，随后便快步离开了。卡津别克的突然到访让玛利亚很不高兴，她更不高兴的是，卡津别克竟然就这样把老师赶走了：\n\n“萨沙叔叔，你为什么要把他赶走？他没做错什么呀？”玛利亚把书放回书架，语气中充满了失望。\n\n“我们接下来要谈论一些重要的事情，陛下，我不希望有外人在场。”\n\n“我还不是‘陛下’呢，我还没当选…”突然，门外响起了敲门声。玛利亚穿着白色小皮鞋跑到门口，打开了门。站在门口的是她的母亲，列奥尼达·格奥尔吉耶夫娜·巴格拉季昂-穆赫兰斯卡娅。母女俩紧紧地拥抱在一起，列奥尼达用眼角扫了一眼卡津别克。\n\n“你带我来这儿，应该不仅仅是为了让我见我女儿一面吧？”列奥尼达紧紧地握着女儿的手，开口说道，“拆散我们母女还不够，你还要拆散我们父女、夫妻吗？你今天让我来这里，就是为了让我见我女儿一面？你到底有什么目的？”\n\n卡津别克把自己的椅子往后推了推，示意列奥尼达坐下，而玛利亚则躲到了衣柜后面。她意识到，他们要谈论的事情非同小可。卡津别克清了清嗓子，对列奥尼达说：\n\n“请您理解，我很乐意让你们母女团聚。但玛利亚必须接受人民的教育，要了解人民疾苦，帮助人民，与人民打成一片，并且要做到公平公正。这才是沙皇，或者女皇，应该具备的品质！但您的存在会对玛利亚产生“负面”影响。她现在还没有形成“青年俄罗斯”的思维方式，而您却在向她灌输那些过时的思想。她注定要成为一位伟大的女皇，前无古人，后无来者！她将独自一人拯救俄罗斯，拯救这片千疮百孔的土地上的人民！为了实现这个梦想，我将竭尽全力！”卡津别克的声音越来越高亢，说到最后甚至有些沙哑。\n\n玛利亚躲在暗处，仔细聆听着这一切，认真揣摩着每一个字。萨沙叔叔不让她与家人见面，这让她感到非常难过。\n\n与列奥尼达的谈话结束后，她从桌边站起身来，简短地说道：“如果他们没有选择我，请让我回到家人身边。”她的声音有些哽咽。\n\n“我保证会把她还回去的。”卡津别克说着，将列奥尼达送出了房间。\n\n房门关上了，玛利亚跑到卡津别克面前，问道：“你真的认为我会成为最伟大的统治者吗？就像你对我妈妈说的那样？”\n\n“我相信，这是上帝赋予你的权利。你会成为一位公正而英明的统治者。我向你保证。”"
 MAR_zemsky_sobor.12.a:0 "黑暗中的一线曙光。"
 MAR_ancestors_blessing_desc:0 "我们与留里克家族的血缘关系，是我们问鼎皇位的最有力保障。玛丽亚·罗曼诺娃之所以敢于觊觎皇位，是因为她是俄罗斯合法王朝最明显的代表。而我们要做的，就是让人民相信，我们是留里克家族的后裔，我们才是皇位的合法继承人！\n\n为此，我们需要开展宣传攻势，用人民能够理解的方式，将我们包装成天命所归的真命天子。"
 MAR_zemsky_sobor.14.t:0 "家谱"
 MAR_zemsky_sobor.14.d:0 "印刷厂的设计师们正在绞尽脑汁，试图设计出一份清晰易懂的家谱图。这可不是一件容易的事，因为他们必须在保证准确性的前提下，尽可能地简化图表，使其易于理解。任何一个拿起这份宣传册的人，无论是学生还是平民，都应该能够轻松地看懂这幅家谱图，明白我们才是真正的皇位继承人。最终，设计师们拿出了一个最佳方案，并将其提交给了别洛泽尔斯基。别洛泽尔斯基对此非常满意，批准将这份设计稿付印。\n\n除了家谱图，我们还需要一些能够打动人心的承诺。我们要让人民相信，一旦别洛泽尔斯基成为沙皇，俄罗斯将会迎来一个前所未有的黄金时代！从俄罗斯的历史中汲取灵感，别洛泽尔斯基决定将自己打造成现代版的“留里克”。从今以后，他不再仅仅是别洛泽尔斯基，更是留里克家族在现代的化身！他将承诺，要带领俄罗斯重现昔日的辉煌与荣光！弗拉基米尔大帝、智者雅罗斯拉夫、伊凡三世大帝……这些伟大的君主，都曾带领俄罗斯走向辉煌，而谢尔盖·别洛泽尔斯基-留里克，将再现他们的伟业！他将带领俄罗斯重返秩序与稳定！\n\n与我们一样，阿列克谢·柯西金-罗曼诺夫也在积极地进行着竞选活动。然而，令他感到沮丧的是，除了他之外，还有其他人也在争夺民心。他的选民正在逐渐倒向我们这边，甚至连玛丽亚·罗曼诺夫的部分支持者也开始转向别洛泽尔斯基。现在看来，别洛泽尔斯基很有可能赢得最终的胜利。"
 MAR_zemsky_sobor.14.a:0 "世代相传的人民之爱。"
 MAR_connection_with_the_past_desc:0 "是时候使用我们的王牌了。阿列克谢·柯西金和玛丽亚·罗曼诺娃都没有得到实业家的大力支持，而我们则不同。工业家的声音对我们的胜利非常重要。然而，为了确保我们的胜利，我们需要一个能够巩固整个精英阶层的人物。我们的人选不是任何人，而是费利克斯·尤苏波夫，他是帝国最富有的人之一，财富仅次于罗曼诺夫皇室。\n\n我们将把他请到国内，他将为我们的利益做所有整合实业家的主要工作。"
 MAR_zemsky_sobor.15.t:0 "资本家重返俄罗斯！"
 MAR_zemsky_sobor.15.d:0 "俄罗斯的资本家是在我们统一了西俄罗斯的主要领土后才归来的。在此之前，资本主义自然无法发展，因为存在着许多障碍。只有当轰炸结束、国家稳定、地区局势开始好转时，资本主义才开始发展。但与其他国家相比，这种资本主义非常薄弱。自然，它才刚刚开始，如果我们想加强它，最重要的是以后利用它来达到我们缙绅会议的目的，那么我们就必须邀请一些人来我们的母港。\n\n费利克斯·尤苏波夫曾经是俄罗斯帝国的第二大富豪，现在他只拥有一个富裕家庭的名声。他本身没有权力，但他与白俄实业家们有着很好的关系，这些人拥有我们所需要的资金。如果我们设法邀请并说服他，那我们也可以说服其他工业家返回俄国，别洛泽尔斯基就是这样做的，他给尤苏波夫写了一封信。他在美国时收到了这封信，经过一番深思熟虑，他决定返回俄国，同时也告诉他的朋友们，是时候返回俄国了。当然，一些资本家断然拒绝返回俄国，而另一些资本家则开始返回祖国。第三类人关注俄国的局势，开始投资生产，因为这可能有利可图——贫穷的民众肯定愿意开始在工厂里为几分钱工作。此外，工业家们的爱国热情也已开始发挥作用。\n\n这些实业家的回归无疑将成为发展经济的强大动力，同时也会在选举中给我们带来选票。"
 MAR_zemsky_sobor.15.a:0 "欢迎来到俄罗斯！"
 MAR_army_for_tsar_general_desc:0 "军队几乎已经完全处于我们的掌控之下。一旦选举开始，绝大多数的军官都将把选票投给我们。然而，阿列克谢·柯西金-罗曼诺夫近来异乎寻常地活跃，他向军队做出了种种诱人的承诺，拉拢了我们的一部分军人选民。在这场争分夺秒的选举大战中，我们决不能给对手留下任何可乘之机，必须将原本属于我们的选票重新夺回来。"
 MAR_zemsky_sobor.16.t:0 "阅兵仪式"
 MAR_zemsky_sobor.16.d:0 "在首都举行的阅兵式备受瞩目。主要问题是哪些部队会参加。这是意料之中的事，因为整个西俄刚刚被统一，这可以作为举行阅兵式的理由。别洛泽尔斯基必须立即这样做，原因有几个。首先，这将进一步提高他在民众中的声望。第二，通过在军队上花钱，他可以安抚军官，让他们投他的票。第三，这将提高整个国家的威望！\n\n并非所有部队都被派往首都参加阅兵。首先挑选的是那些能够使用武器和列队行进的士兵。大约1万名士兵被选中，并被送往首都。为了向世界展示年轻的青年俄罗斯国度的力量，还动用了军事装备。坦克被运到了首都，附近的机场也在短时间内成为了飞机的停放地。别洛泽尔斯基转而请求卡津别克批准这次阅兵。他无法拒绝，因为阅兵确实是必要的，尽管他明白这会提高别洛泽尔斯基的影响力。\n\n全城接到通知，阅兵式将于上午十时举行。阅兵式是这样安排的：身经百战的部队首先行进，然后是只有别列兹尼基才有的最现代化的军事装备，最后是飞机在广场上空飞行。所有这一切都将由军乐团伴奏，演奏帝俄和苏联的进行曲，这些进行曲仍具有现实意义。\n\n阅兵式持续了大约一个半小时。步兵行进得很好，但部队显然还不完全熟练。步兵之后是坦克。领头的坦克挂着青年俄罗斯联盟的旗帜，后面跟着高尔基制造的坦克。坦克纵队结束后，飞机飞临广场上空。飞机的任务只是飞过阅兵式上空，这只用了不到一分钟的时间，随后它们掉头飞回机场。阅兵式结束了，观众们都很高兴。\n\n阅兵式结束后，别洛泽尔斯基邀请了几位知名军官与他们交谈，在与他们交谈后，他说服他们需要投他一票，并慷慨地许诺给他们奖励。"
 MAR_zemsky_sobor.16.a:0 "我们向世界展示了我们的力量。"
 MAR_sobor_is_voting_now_desc:0 "胜负在此一举。木已成舟，破釜沉舟。在全俄缙绅会议选举之前，我们已经做了如此多的工作，现在是时候开启这场选举了。人民、军队、党派以及工业精英必须做出他们的选择，勇敢地向前迈进——\n\n走向未来。"
 MAR_zemsky_sobor.21.t:0 "选举开始！"
 MAR_zemsky_sobor.21.d:0 "终于，在为实际选举做了长期准备之后，选举宣布开始。在这一天里，西俄罗斯大地上的投票站将在大型行政大楼、工厂和学校中运作，这些地方是在德国空军轰炸和从纳粹手中夺回自由俄罗斯地区的战斗后重建的。\n\n这些投票站已经开始收集选票。投票时，只需出示任何能证明身份的证件即可。可以是护照、工作证，甚至是学生证。为防止选举舞弊或重复投票，可直接在证件上注明此人已投过票。这种简单的方法可以防止此类事件的发生。"
 MAR_zemsky_sobor.21.a:0 "让最值得尊敬的候选人获胜！"
 MAR_zemsky_sobor.22.t:0 "谢尔盖·别洛泽尔斯基之胜！"
 MAR_zemsky_sobor.22.d:0 "谢尔盖·别洛泽尔斯基和他的秘书与几位重要的党员一起坐在候客室里。他瞥见了卡津别克和玛利亚的身影，还看到了坐在椅子上的阿列克谢·柯西金-罗曼诺夫。漫长的等待显然让他有些疲惫，他开始在椅子上烦躁地扭动着身体。谢尔盖·别洛泽尔斯基并不认为自己会落败，为了赢得这场选举，他付出了太多，不容许任何其他候选人胜出。唯一让他感到不快的就是这等待的时间。计票时间长得令人难以忍受，即使像别洛泽尔斯基这样沉稳的人也感到焦灼难耐。\n\n终于，接近午夜时分，计票结果终于出炉，人们可以前往大厅，在那里将宣布获胜者。15分钟后，所有人都聚集在大厅里，全俄缙绅会议的评审团宣布了投票结果：\n\n谢尔盖·别洛泽尔斯基——121票\n\n玛利亚·罗曼诺娃——43票\n\n阿列克谢·罗曼诺夫——36票\n\n谢尔盖·别洛泽尔斯基胜出！漫长的选战终于落下帷幕，他如释重负地舒了口气。他知道，未来的工作将更加繁重，但人民选择他作为他们的沙皇，这让他由衷地感到欣慰。\n\n卡津别克、玛利亚和阿列克谢·柯西金-罗曼诺夫纷纷前来祝贺谢尔盖的胜利。玛利亚因为没能成为女皇而几乎哭了出来，谢尔盖和卡津别克连忙安慰她，说或许这样才是最好的结果。即便未能成为女皇，她依然有机会。但无论如何，现在已成定局——流淌着留里克王朝血脉的谢尔盖·别洛泽尔斯基，成为了西俄罗斯的沙皇。"
 MAR_zemsky_sobor.22.a:0 "谢尔盖·别洛泽尔斯基万岁！"
 MAR_zemsky_sobor.23.t:0 "人民女皇的胜利！"
 MAR_zemsky_sobor.23.d:0 "玛利亚·弗拉基米罗夫娜和卡津别克坐在地方自治局的阳台上。玛利亚身着一袭华丽的礼服，但她却如坐针毡。对她来说，这一刻将决定她的生死存亡。很久以前，她就下定决心，要用上帝赋予她的力量去帮助人民。为此，她付出了巨大的努力，但她仍然害怕失败。如果别洛泽尔斯基赢了怎么办？或者科西金-罗曼诺夫赢了呢？她的脑海中充满了疑问，却没有人能给她答案……\n\n“你还好吗？脸色看起来不太好。是因为选举的事吗？”卡津别克关切地问道。“没错，萨沙叔叔，我很害怕。”玛利亚的声音微微颤抖，“如果我赢了，我将肩负起巨大的责任，背负着人民的期望，但我不知道自己是否能够做到…如果我输了，我又将何去何从？我会和父亲一起被流放到遥远的地方吗？还是说，我会在父亲那小小的庄园里浑浑噩噩地度过余生？”\n\n“我理解你的心情。但别担心，我会一直陪伴在你身边，做你最忠诚的伙伴和助手。我也会确保你的灵魂不会受到污染。你会成为一位受人爱戴的女皇，我向你保证。”卡津别克安慰道，“你没必要担心，你的坦率和善良已经给许多选举人留下了深刻的印象，而这正是一位女王所必须具备的品质。不仅如此，我还想告诉你一个秘密。”卡津别克说着，拿出一张纸，上面是一张西俄地图，地图上用不同的颜色标注着不同的区域，“你在选举中已经赢得了近70%的选票，但我们还不清楚那些‘精英选举人’会作何选择。但我相信，你一定会赢，俄罗斯人民的梦想一定会实现！”听了卡津别克的话，玛利亚的心稍微安定了一些。她静静地等待着，等待着最终投票结果的到来。\n\n首先进行投票的是由人民选出的选举人。投票结果如下：玛利亚·弗拉基米罗夫娜获得了68票，柯西金-罗曼诺夫获得了20票，别洛泽尔斯基获得了12票。当结果公布时，别洛泽尔斯基恶狠狠地瞪了玛利亚一眼，但很快，他的愤怒就变成了微笑。接下来，轮到由军队和其他精英阶层组成的“精英选举人”进行投票了。玛利亚明白，别洛泽尔斯基肯定已经买通了军队中的选举人。但她仍然希望，由官员、游击队和商人组成的另一半“精英选举人”能够把选票投给她。投票结果如下：别洛泽尔斯基获得了63票，玛利亚·弗拉基米罗夫娜获得了24票，柯西金-罗曼诺夫获得了剩下的13票。简单计算一下就可以得出，玛利亚获得了92票，别洛泽尔斯基获得了75票，柯西金-罗曼诺夫获得了33票。就在这时，柯西金-罗曼诺夫突然站了起来：“鉴于目前的情况，我决定将我所有的选票都投给其中一位候选人！”此言一出，全场哗然。许多人（主要是军人）开始抱怨，认为这样做不符合规定。然而，选举法中并没有任何条文禁止候选人将选票转让给其他人。很快，人们就安静下来，回到自己的座位上，等待着柯西金-罗曼诺夫的最终决定。现在，柯西金-罗曼诺夫肩负着重大的责任：他将为俄罗斯人民选择一位新的沙皇。他开始了他的讲话：“我将我所有的选票都投给玛利亚·弗拉基米罗夫娜！”他的决定赢得了玛利亚支持者的热烈掌声，同时也招致了别洛泽尔斯基支持者的强烈不满。但木已成舟，玛利亚·弗拉基米罗夫娜最终以125票的绝对优势，成为了新一任的俄罗斯沙皇。"
 MAR_zemsky_sobor.23.a:0 "青年俄罗斯之梦成真！"
 MAR_zemsky_sobor.24.t:0 "阿列克谢·罗曼诺夫之胜！"
 MAR_zemsky_sobor.24.d:0 "地方议会的选举大厅里，柯西金-罗曼诺夫和他的竞选团队正襟危坐，焦急地等待着最终结果。这一天终于到来了，它将决定国家的未来。大部分选票已经统计完毕，但究竟有多少人把票投给了他们支持的候选人，仍然是一个未知数。\n\n等待的时间是如此漫长而煎熬。每一分钟都仿佛被无限拉长，即使是闲聊和点心，也无法缓解人们心中的紧张和焦虑。有趣的是，在这些习惯于用香槟庆祝的精英人士中，柯西金-罗曼诺夫却滴酒不沾，只喝水和果汁。原本舒适的座椅，在此刻也变得无比烦躁，他真想闭上眼睛好好睡一觉，但内心的期待和不安却让他无法入眠。\n\n只剩下最后200张选票了，但每一张选票都至关重要，因为它都代表着一个人的选择，代表着这个国家未来的走向。终于，在当地时间晚上十点整，统计结果出来了。\n\n十五分钟后，所有候选人和他们的支持者们都聚集在大厅里，等待着最终的宣判。\n\n“阿列克谢·罗曼诺夫，103票，得票率51.5%。”\n\n“玛丽亚·罗曼诺娃，53票，得票率26.5%。”\n\n“谢尔盖·别洛泽尔斯基，44票，得票率22%。”\n\n阿列克谢·罗曼诺夫当选！谢尔盖·别洛泽尔斯基和卡津别克走到阿列克谢·罗曼诺夫面前，对他表示祝贺。\n\n“你真是太狡猾了，我真没想到你会赢。”卡津别克的声音中带着一丝惊讶和一丝喜悦。\n\n“人民选择了你。”谢尔盖·别洛泽尔斯基说道。\n\n“谢谢你们的祝贺，但这一切还远远没有结束。”阿列克谢·罗曼诺夫意味深长地说道。"
 MAR_zemsky_sobor.24.a:0 "这只是开始！"
 MAR_mladorossi_dream_desc:0 "我们团结西俄罗斯的努力在各条战线上都取得了圆满成功。这个年轻而充满希望的国家现在有机会自由呼吸，朝着青年俄罗斯联盟的梦想前进。政治领导层选择了自己的道路，如果没有卡津别克和他的团队，这一切都不可能实现。但这并不是终点。更大的成就还在等着我们，最终我们将把整个自由俄罗斯从纳粹手中团结起来。\n\n但任何事情都有它的时机。现在，我们可以收获我们的劳动成果。我们的梦想已经开始全面实现。"
 MAR_smuta.9.t:0 "梦想终成真"
 MAR_smuta.9.d:0 "在经历了这一切之后，卡津别克终于得以在相对短暂的时期内放松身心。回首那饱经风霜的1962年，他不禁感慨万千，思绪纷飞，感叹人生的变迁，以及自己如何取得了如此空前的成就。不久之前，他还在为自己在西俄罗斯战争中间接帮助弗拉基米尔三世，与纳粹分子沆瀣一气而忏悔不已。彼时彼刻，卡津别克究竟在想些什么？或许只是想着，那些不堪回首的往事终于尘埃落定，通敌者的阴影将不再如影随形。那背负祖国的污名，那残害俄罗斯人民的罪孽，都已被其统一俄罗斯的正义之心和高尚之举荡涤殆尽。我们不再被视为通敌者，而是俄罗斯的解放者，是给人民带来光明未来希望的象征。\n\n在西俄罗斯争夺战中牺牲的每一位俄罗斯同胞，都是他为统一俄罗斯所付出的代价。他为不得不再次让俄罗斯人民流血牺牲而深感痛惜，但这一次，他并非为了个人私利，而是为了俄罗斯，为了祖国未来的子孙后代。为了这崇高的目标，这点代价微不足道。可以肯定的是，别无他法，如果我们不牺牲这数百乃至数千名俄罗斯同胞，那么将会有成百上千的人流血牺牲。俄罗斯之幸，在于在正确的时间、正确的地点，出现了正确的人。\n\n能否说卡津别克领导了这场救赎之战？可以这么说。他是否完成了救赎？他创建了青年俄罗斯国家，它巍然屹立，蓬勃发展，宛若传说中的凤凰，用其光芒照亮了整个自由俄罗斯。我们的敌人不理解，也无法理解这一刻的伟大意义，他们负隅顽抗，最终自食其果。是的，可以说，我们已经完成了救赎。如今，洗净了过去的罪孽，我们可以朝着青年俄罗斯的梦想继续前进了。\n\n俄罗斯自豪地迈步向前，奔向新的胜利。"
 MAR_smuta.9.a:0 "以鲜血洗涤罪孽，成就全民之梦。"
 MAR_smuta.10.t:0 "劝告信"
 MAR_smuta.10.d:0 "“这就是为什么我认为我们应该直接入侵巴什科尔托斯坦。没必要跟他们兜圈子！”瓦维洛夫将军感叹道。总参谋部和卡津别克一起，正在讨论对巴什科尔托斯坦的行动。一部分将军（阿尔达舍夫和沃尔科夫）考虑向巴什科尔托斯坦的亲俄分子提供装备，推翻艾哈迈德-扎基政府，和平吞并巴什科尔托斯坦。其他将军（瓦维洛夫）则认为，和平吞并的说法完全是无稽之谈，他们应该直接对乌法发动迅速进攻。讨论持续了几个小时，甚至出现了谩骂。卡津别克保持沉默。令人怀疑的沉默。\n\n待将士们安静下来，卡津别克站起身来，开始说了起来：\n\n“听了大家的发言后，我对这一有趣的局面有了双重看法。要么我们发动一场政变，动用军队中有时甚至没有的珍贵装备；要么别担心，干脆直接动用我们勇敢的士兵发动一场入侵巴什科尔托斯坦的战争。我建议在你们的立场之间折中一下......”卡津别克从夹克里拿出一封条理清晰的信。“一封劝告信。很快，我将把它直接寄给巴什科尔托斯坦的艾哈迈德-扎基·瓦利迪。我将向他提出和平并入别列兹尼基的想法，以及在新俄罗斯境内享有很好的自治权的条件，并赦免整个巴什科尔托斯坦政府。当然，如果他们拒绝，那是挺令人难过的。但是，我们不会因此而哭泣，而是会开始进攻。整个政府都将被送进监狱，但我仍然打算保留巴什科尔托斯坦的自治权。你们怎么说，将军们？”\n\n阿尔达舍夫认真地听着卡津别克的长篇大论，当卡津别克讲完后，他问道：“这么说，我们要向他们发出最后通牒了？”\n\n“没错，阿尔达舍夫，没错。”"
 MAR_smuta.10.a:0 "希望他们选择了正确的道路。"
 MAR_smuta.11.t:0 "有趣的信"
 MAR_smuta.11.d:0 "“艾哈迈德-扎基·瓦利德·托甘？你在吗？”他办公室的一名警卫问道。 警卫来到俄罗斯革命时期巴什科尔托斯坦解放运动领袖、伊斯兰共和国领导人艾哈迈德-扎基·瓦利德平时办公的办公室。 他在巴什科尔托斯坦人民中很受欢迎，几乎就像国父一样。 在阵线崩溃期间，他自豪地领导巴什科尔托斯坦度过了最黑暗的日子，击退了蚕食本国壮丽大好河山并发动血腥袭击的雅利安兄弟会。 名叫古泽尔的卫兵很高兴能与艾哈迈德-扎基同时工作和生活。\n\n不久，艾哈迈德-扎基亲自走进了办公室。 他已年过七旬，但从他的眼神中，你仍能看到没有被岁月凝固的炽热和激情的火花：\n\n“什么事，亲爱的古泽尔？”扎基微笑着回答。 “对不起，我没有马上回答你。 我在隔壁房间祈祷呢。”\n\n“你在为此道歉吗？ 这可是我们神圣的义务，那就不必了。但这不是重点，你有一封信。”古泽尔把信放在扎基的桌子上，鞠了一躬，然后离开了。\n\n“有意思，他们能给我写什么这么重要的东西呢？”\n\n扎基带上了老花眼镜，打开信封，开始阅读起来："
 MAR_smuta.11.a:0 "别让命运诱惑我们。"
 MAR_smuta.11.b:0 "我们不会如此轻易地放弃自己的独立！"
 MAR_smuta.12.t:0 "好消息"
 MAR_smuta.12.d:0 "卡津别克坐在办公室里，望着窗外。 窗外下着雨。 他不喜欢下雨。 这会给他带来不好的而压抑的想法。 青年俄罗斯的愿景会真正实现吗？ 会真的实现吗？ 许多念头在他脑海中闪过，但很快他就心烦意乱了：\n\n“卡津别克同志！扎基同意了，他今天之内就会来别列兹尼基，讨论巴什科尔托斯坦自治的问题。”\n\n“我们对他良心的呼唤起作用了...”卡津别克笑道。“我很乐意跟他谈谈。”"
 MAR_smuta.12.a:0 "一个伟大的决定。"
 MAR_smuta.13.t:0 "背后捅刀"
 MAR_smuta.13.d:0 "卡津别克坐在办公室里，望着窗外。 窗外下着雨。 他不喜欢下雨。 这会给他带来不好的而压抑的想法。 青年俄罗斯的愿景会真正实现吗？ 会真的实现吗？ 许多念头在他脑海中闪过，但很快他就心烦意乱了：\n\n“卡津别克同志！扎基拒绝了！他在巴什科尔托斯坦的电台上宣布全民总动员。”\n\n卡津别克有点生气。\n\n“那个老人怎么能抗拒......如此重要的自治权，他还需要什么呢？” 卡津别克感叹道。 “那么边境上的部队准备好了吗？”\n\n“是的，所有将军都已准备好发起行动。”\n\n“你知道你该做什么了。”"
 MAR_smuta.13.a:0 "是时候结束萨拉瓦特·尤拉耶夫的遗产了......"
 MAR_smuta.14.t:0 "中立的领袖"
 MAR_smuta.14.d:0 "在卡津别克的办公室里，将军们和一些部长们聚在一起讨论沃洛格达的局势。卡津别克开始讲话：\n\n“各位部长和将军，大家好。我们聚集在这里是有原因的。我们将讨论沃洛格达的局势。我们正意气风发地向全俄罗斯进军，沃洛格达将是我们的下一个目标。瓦维洛夫已经准备好了他的计划和演说，他将在演说中描述沃洛格达的整个局势和夺取它的计划。”卡津别克起身走到书架前。“让我们开始吧！”\n\n“哦，是的，对不起，亚历山大·利沃维奇！”瓦维洛夫咳嗽了几声，开始了他的演讲。“那么，朋友们。沃洛格达由前将军瓦西里·伊万诺夫统治。他声称自己对俄罗斯大地上所有国家都是“中立”的。这就是为什么没有人会来帮助他们，而我们会轻而易举地摧毁他们。他们没有防御，所以组织一次入侵很容易。不过，我建议你们发出最后通牒，希望他们能“良心发现”。这就是我想说的。”\n\n卡津别克和其他人都认真地听着瓦维洛夫的话。不久，许多人开始向他询问部队的状况，他们在哪里，是否做好了战斗准备，瓦维洛夫回答说“是的”。卡津别克示意停止谈话，自己回答了瓦维洛夫：\n\n“我们将发出最后通牒。我们将第一次动摇他们的‘中立’地位。”"
 MAR_smuta.14.a:0 "但愿我们的选择是正确的。"
 MAR_smuta.15.t:0 "对中立的威胁"
 MAR_smuta.15.d:0 "今天，我们的国家正经历着艰难的时刻。就在今天，别列兹尼基发来了一份最后通牒：“要么和平加入我们，要么我们将为俄罗斯未来的统一而向你们发起进攻。”短短的一句话，却决定着沃洛格达的命运。\n\n瓦西里·伊万诺夫将军紧急召集了他最忠诚的拥护者，在人民议会就这一棘手问题展开讨论。部长们、高级官员、商界领袖以及将军们齐聚在他的办公室里。关于这份最后通牒，众人展开了激烈的辩论。以将军们为首的一部分人要求伊万诺夫采取果断行动：做好战斗准备，宣布国家进入紧急状态，并制定针对别列兹尼基的防御计划。而另一部分人，包括大多数官员和商界巨头，则认为“中立”的时代已经结束，他们只能选择屈服于别列兹尼基的统治。\n\n瓦西里一言不发，他被自己过去的所作所为所震惊，现在，他必须为这一切负责。争论结束后，所有人都离开了办公室，只留下伊万诺夫独自一人：\n\n“我一直以来都在逃避选择，一直保持着“中立”。但现在，我已经无路可逃，是时候做出决定了……”"
 MAR_smuta.15.a:0 "我们必须投降。"
 MAR_smuta.15.b:0 "准备部队。"
 MAR_smuta.16.t:0 "简单的胜利"
 MAR_smuta.16.d:0 "瓦维洛夫和将军们在玩扑克。他们等待沃洛格达的答复已经太久了，所以决定做点什么来打发时间。他们玩得很开心，尽管他们都有钱。他们只是不喜欢“剥光”他们在军事层面上的朋友。现在，他们互相看着对方，试图读懂对方的情绪，找出对方是否有什么好牌。\n\n就这样，五张牌摆好了，大家都在考虑要不要亮牌。阿尔达舍夫第一个做出了决定：\n\n“顺子！”\n\n瓦维洛夫第二个说道：\n\n“哈！三带二！”\n\n除了吉尔，其他人都要不起。吉尔狡猾地一笑，扔出了两张A：\n\n“四张尖，同志们！”\n\n“哦，你这个逼养的.....！”瓦维洛夫喊道。“你已经赢了第十局了！”\n\n“纯粹是运气，瓦维洛夫，嘿嘿。”吉尔笑道。\n\n突然，他们的谈话被一名进入指挥部的士兵打断了：\n\n“抱歉打扰你们处理公务，但我们收到消息说伊万诺夫要投降了！我们正在等待您的命令，以便越过边界，在沃洛格达庆祝这一时刻！”\n\n将军们微笑着，吉尔回答道：\n\n“二十分钟后开始调兵。”\n\n“是，吉尔将军！”士兵离开司令部，锁上身后的门。\n\n“好了，先生们！”阿尔达舍夫说。“是时候庆祝了！”"
 MAR_smuta.16.a:0 "沃洛格达是我们的啦！"
 MAR_smuta.17.t:0 "血流成河"
 MAR_smuta.17.d:0 "瓦维洛夫和将军们在玩扑克。他们等待沃洛格达的答复已经太久了，所以决定做点什么来打发时间。他们玩得很开心，尽管他们都有钱。他们只是不喜欢“剥光”他们在军事层面上的朋友。现在，他们互相看着对方，试图读懂对方的情绪，找出对方是否有什么好牌。\n\n就这样，五张牌摆好了，大家都在考虑要不要亮牌。阿尔达舍夫第一个做出了决定：\n\n“顺子！”\n\n瓦维洛夫第二个说道：\n\n“哈！三带二！”\n\n除了吉尔，其他人都要不起。吉尔狡猾地一笑，扔出了两张A：\n\n“四张尖，同志们！”\n\n“哦，你这个逼养的.....！”瓦维洛夫喊道。“你已经赢了第十局了！”\n\n“纯粹是运气，瓦维洛夫，嘿嘿。”吉尔笑道。\n\n突然，他们的谈话被一名进入指挥部的士兵打断了：\n\n“请原谅我打扰你们处理公务，但我们收到消息，伊万诺夫不想投降。他当众烧毁了我们关于最后通牒的书面声明，宣称他不会不战而降。部队已经准备好进攻了，就等您的命令了！”\n\n将军们低头看着地板，阿尔达舍夫回答士兵：\n\n“我们将在二十分钟后开始进攻。”\n\n“是，阿尔达舍夫将军！”士兵离开了指挥部，锁上了身后的门。\n\n“好了，先生们！”阿尔达舍夫说。“我们将为祖国母亲抛头颅洒热血！”"
 MAR_smuta.17.a:0 "沃洛格达是我们的！"
 MAR_smuta.18.t:0 "民主的光辉"
 MAR_smuta.18.d:0 "我们正在一步步收复祖国失地，现在，是时候吞并科米共和国了。为此，卡津别克召集将军们召开紧急会议，商讨下一步的行动方案。会议将讨论些什么？不出所料，无非是两种选择：要么发出最后通牒，要么直接出兵。然而，阿尔达切夫将军提出了一个非常棒的第三方案：\n\n“将军们，以及亚历山大·利沃维奇！我有一个计划，简单却十分巧妙！1963年，科米共和国的民主党人获得了最终的胜利，他们的民主制度得到了进一步加强。因此，我们应该好好利用俄罗斯族的民意！我们可以要求科米政府就加入别列兹尼基举行全民公决。毕竟，科米人民已经看到了我们如何收复俄罗斯中部南部地区，他们视我们为俄罗斯的统一者。因此，如果他们拒绝举行全民公决，整个共和国都会陷入混乱！他们当然不希望看到这样的局面，所以一定会同意举行全民公决。届时，无论结果如何，是胜是负，我们都可以伺机而动。不过说实话，”——阿尔达切夫微微抬了抬目光——“我们失败的可能性微乎其微。将军！”——阿尔达切夫骄傲地结束了他的讲话。\n\n将军们开始低声议论起来。阿尔达切夫的计划固然不错，但也存在一些问题。科米共和国已经成立了大约十年，这段时间足以让“分离主义”滋生。他们会称自己为科米人，而不是俄罗斯人，这将降低我们在全民公决中获胜的几率。而且，谁又能保证，即使我们赢得了公投，这个共和国的领导人不会拒绝承认选举结果？最终，我们可能还是要出兵。因此，他们认为这个计划没有必要。然而，也有人毫不犹豫地支持阿尔达切夫：\n\n“这是个好主意，阿尔达切夫！这样一来，我们就能兵不血刃地吞并他们了！”——瓦维洛夫兴奋地说道。\n\n这时，卡津别克开口了。他从椅子上站起来，走到阿尔达切夫面前：\n\n“干得不错，阿尔达切夫，这个计划确实很出色。将军们，”——他转向其他将军——“我很快就会致函科米政府，要求他们举行全民公决。我希望，正如阿尔达切夫所说，他们会给我们一个满意的答复。至于这次全民公决能否带来我们想要的结果，我们稍后再议。”\n\n将军们纷纷点头表示赞同。很快，卡津别克的办公室就只剩下他一个人了。昏暗的灯光下，他坐在办公桌前，细细品读着歌德的《浮士德》。"
 MAR_smuta.18.a:0 "你有来信……"
 MAR_smuta.19.t:0 "公投？"
 MAR_smuta.19.d:0 "今天，我国议会就“是否就加入别列兹尼基举行全民公决”这一议题展开了激烈辩论。就在昨晚，共和国政府收到了卡津别克的来信，要求科米共和国就统一俄罗斯的问题举行全民公决。议会中的许多成员对此表示强烈反对。各党派领导人也纷纷就科米加入别列兹尼基一事发表了自己的看法。\n\n民主社会主义人民党领袖尼古拉·阿列克谢耶维奇·沃兹涅先斯基：“毫无疑问，我和我们党的所有人都渴望俄罗斯的统一，我国人民也渴望统一。然而，我们不愿意与别列兹尼基统一，那个地方奉行的是苏维埃或者沙皇统治。我们相信，我国人民会明确表示，他们不愿意与这种沙皇和苏维埃的混合体统一。”\n\n青年改革者联盟领袖伊万·帕夫洛维奇·莫罗佐夫：“俄罗斯的统一是大势所趋，这一点无人否认。但别列兹尼基并不是一个好的选择。一个由未经加冕的摄政统治的国家，没有资格统一俄罗斯。你们想生活在这样一个毫无自由可言的政权之下吗？我个人是不愿意的，但我仍然愿意放弃自由，换取俄罗斯的和平。”\n\n主权民主党的领导人斯维特兰娜·约瑟福夫娜·阿利卢耶娃：“这根本就没什么好讨论的！俄罗斯需要的是民主，而不是一个疯狂的、未经加冕的摄政！这种政权不出几年就会分崩离析，而俄罗斯的分裂将会更加严重！难道我们希望看到这样的结果吗？当然不！”\n\n尽管党派领导人们表达了反对意见，但大多数议员还是投了赞成票。他们中的许多人都知道，如果他们投票反对，科米人民绝不会轻饶他们。几天后，全民公决将会如期举行，届时，我国的命运将何去何从，让我们拭目以待。"
 MAR_smuta.19.a:0 "迈向未知！"
 MAR_smuta.20.t:0 "公投！"
 MAR_smuta.20.d:0 "今天，科米共和国的人们纷纷涌向投票站，因为今天是全民公决的日子！共和国的命运将在这天揭晓：是加入别列兹尼基，还是保持独立。整个国家分成了两派。在一些地方，别列兹尼基的旗帜迎风飘扬；而在另一些地方，则到处张贴着“让我们远离民主”的标语。有些地方甚至爆发了斗殴。共和国仿佛回到了1963年，再次处于分崩离析的边缘。\n\n尼古拉·约尔金正准备带着家人前往他熟悉的17号投票站投票。尽管别列兹尼基不是一个自由的国家，尽管这可能是他最后一次表达自己的意愿，但他希望他的孩子们能够拥有一个更加美好的未来。作为一名苏联老兵，他亲眼见证了国家的解体。他渴望他的孩子们能够生活在一个统一的、强大的俄罗斯。\n\n投票站关闭了，计票工作开始了。结果将在第二天早上公布。"
 MAR_smuta.20.a:0 "人民选择了俄罗斯！"
 MAR_smuta.20.b:0 "人民选择了民主！"
 MAR_smuta.21.t:0 "俄罗斯之胜"
 MAR_smuta.21.d:0 "今天，科米广播电台宣布了全民公决的结果：并入别列兹尼基！消息传到卡津别克耳中，他兴奋地向聚集的将军们宣布：\n\n“同志们！”他难掩激动之情，“今天，科米加入了别列兹尼基！全俄罗斯都将铭记这个伟大的日子！这证明了俄罗斯人民渴望统一，这种分裂的局面必将被终结，俄罗斯人民将迎来更加美好的生活！”\n\n很快，亚历山大·利沃维奇便带着将军们前往瑟克特夫卡尔，他要在那里庆祝胜利，并向科米人民发表演讲。\n\n第二天，卡津别克乘坐的汽车驶入了瑟克特夫卡尔。他从车窗里向聚集的人群挥手致意。人们挥舞着别列兹尼基的旗帜，高喊着“沙皇与苏维埃！”的口号。然而，人群中也混杂着一些举着“民主的刽子手”标语牌的人。他们的数量还不少。汽车在政府大楼前停下，卡津别克将在这里发表一篇具有象征意义的演讲，他要让科米人民、别列兹尼基人民，乃至所有俄罗斯人民都为之震撼！卡津别克走下汽车，带着些许沙哑的声音，拾级而上。当他走到演讲台前时，有人递给他一张写着演讲稿的纸。卡津别克接过演讲稿，匆匆扫了一眼，便将其放到了一边。他要发自肺腑地说出自己想说的话：\n\n“科米的人民们！以及所有四分五裂的俄罗斯人民们！今天，科米共和国与别列兹尼基和平统一了，而我，将领导着这个统一的俄罗斯！许多人声称，这次统一将会扼杀沃兹涅先斯基试图建立的民主制度。我要告诉你们，为了在未来过上更加美好的生活，我们必须暂时放弃一些自由和民主！诚然，许多人认为我们的政权是疯狂的，但我要告诉你们，你们只是害怕这种理念，害怕沙皇带来的法律正义与苏维埃带来的社会正义！而这，正是俄罗斯人民自古以来所渴望的！我们的目标，就是给予俄罗斯和俄罗斯人民他们想要的东西！为了实现这个目标，我们决不后退，即使面对德国和日本的炮火，我们也将誓死捍卫俄罗斯，帮助俄罗斯人民！乌拉！”卡津别克的声音响彻整个广场。\n\n演讲结束后，人群中爆发出雷鸣般的掌声和欢呼声，普通民众沉浸在对新生活和美好未来的憧憬之中。"
 MAR_smuta.21.a:0 "乌拉！"
 MAR_smuta.22.t:0 "民主之胜…？"
 MAR_smuta.22.d:0 "今天，科米广播电台宣布，全民公决的结果是：否决并入别列兹尼基，科米共和国将继续保持独立！许多人手持国旗走上街头，庆祝胜利。\n\n很快，这个令人沮丧的消息就传到了卡津别克的耳中。得知消息后，将军们都十分害怕他会大发雷霆。然而，卡津别克只是沉默了许久，似乎在思考着什么……过了一会儿，他站起身来，走到阿尔达切夫面前：\n\n“你的计划失败了。我原本以为天衣无缝，结果却如此不堪一击…”\n\n“但我怎么知道差距会如此之小呢？”阿尔达切夫辩解道。\n\n“我不怪你，真的，我不怪你。你的计划的确很好，但还不够完美。现在，我们只剩下一个选择了。”\n\n“什么选择？”瓦维洛夫问道，尽管他已经知道了答案。\n\n“部队准备好了吗？”\n\n“当然！”瓦维洛夫信心满满地回答道，他已经做好了率军向瑟克特夫卡尔进军的准备。\n\n“那就开始行动吧……另外，请离开我的办公室，我需要休息一下。”\n\n将军们离开了，他们要去前线指挥作战。卡津别克独自一人站在窗前，望着窗外，试图让自己的心情平静下来…"
 MAR_smuta.22.a:0 "战争再起..."
 MAR_smuta_occupation.1.t:0 "瓦格纳及其同伙的审判"
 MAR_smuta_occupation.1.d:0 "在抓获雅利安兄弟会后，卡津别克立即下令找到瓦格纳和他的同伙，将他们关进戒备森严的监狱。然而，古特鲁姆试图逃跑，当他钻进汽车，司机一踩油门，他只转了一个弯就被派去拘留他的小队发现了。越狱失败。\n\n士兵们强迫古特鲁姆下车，把他送进了彼尔姆海姆的第一监狱。瓦格纳的支持者们就好办多了——他们要么向别列兹尼基的部队投降，要么连逃跑的念头都没有。当他和他的同伙入狱后，别列兹尼基的情报机构接到命令，开始搜查所有可能表明对俄罗斯人民犯下罪行的文件。但是，古特鲁姆已经下令销毁他管理下的所有文件，虽然他没能销毁所有文件，但许多文件已经丢失，很可能是永远丢失。许多犯罪事实已经从我们的视线中消失了。\n\n然而，即便是我们揭露出来的东西，也足以判处死刑。此外，几千名奴隶和一些同伙的证词也证实了这一点，他们相信只要说出一切，就会得到宽恕。\n\n过了很短的时间，对瓦格纳及其同伙的审判就开始了。一切都尽可能地表现得像模像样，甚至用胶卷和摄像机记录下了审判的所有瞬间。具有讽刺意味的是，审判决定在彼尔姆海姆进行。虽然卡津别克已经下令将这座城市改名，但在审判准备期间，这座城市的过时名称还是被沿用了下来。\n\n对古特鲁姆·瓦格纳的审判，历时约一天，中间有短暂的休息。在此期间，针对雅利安兄弟会首领的证据和指控不断被宣读。尽管他矢口否认，但所有不久前还站在他这边的人都反对他。\n\n对古特鲁姆的指控和举证一结束，他似乎就认命了，眼神变得空洞，目光迷茫。最后，法庭做出了最终判决：最高刑罚——处决。\n\n审判结束12小时后，在深夜宣布了判决，五名行刑队成员被送往古特鲁姆处。瓦格纳在临死前的最后一秒大喊：“万岁！”枪响了，他倒地身亡。\n\n对其他同谋也是如此，但没有华丽的辞藻，至少有人试图忏悔，但正义女神忒弥斯毫不妥协。他们都为自己的罪行遭到了报应。"
 MAR_smuta_occupation.1.a:0 "人民的报应追上了他们，因为他们受苦受难，与人类的敌人相似！"
 MAR_smuta_occupation.2.t:0 "旧相识"
 MAR_smuta_occupation.2.d:0 "卡津别克当时正开车从别列兹尼基前往弗拉基米尔三世位于维亚特卡附近的个人住所。当时只有他一个人，只有他的司机知道如何前往住所。卡津别克一边开车，一边回忆他是如何与弗拉基米尔三世联手的，以及他们彼此是多么熟悉。他们在争夺西俄罗斯的斗争中成为了朋友...这让人非常难过，但事实就是如此。如果卡津别克推迟进攻维亚特卡，沙皇本人可能会试图消灭他。\n\n经过几个小时的艰难跋涉，他到达了住所。由于很少有人能到达，因此这座住宅本身在战斗中并没有受到破坏。不过，这里没有保安。而且总的来说，这里一个人也没有，因为弗拉基米尔已经被卡津别克下令软禁了。\n\n占据了这处住所后，他下令将弗拉基米尔三世带到这处住所，他现在离这处住所比较近。过了一天，弗拉基米尔三世终于来了，他下了车，向官邸走去。\n\n双方互致问候，询问近况，卡津别克建议他们去二楼，在那里继续谈话。到达二楼后，可以看到一些罗曼诺夫家族成员的肖像——亚历山大三世、尼古拉二世等。\n\n“弗拉基米尔，我想说，我们对您的女儿玛利亚-罗曼诺夫娜有某些计划。”卡津别克说。\n\n“什么计划？她不会出什么事吧？”弗拉基米尔小心翼翼地问。\n\n“我们想让她成为新俄罗斯国家的统治者。事实证明，由于政治环境的原因，我本人将无法长期执政，在西俄罗斯的这一切乱局结束后，我想提名她为俄罗斯皇位的候选人。”\n\n“作为候选人？”弗拉基米尔三世问道。“所以她有可能不会成为统治者？”\n\n“没错，因为动乱结束后，将举行缙绅会议，从三名候选人中选出一人，其中就包括您的女儿。如果大家都投票给她，她就会成为女皇。\"卡津别克说。\"如果她成为女皇，在她成年独立之前，我将是她的摄政王。”\n\n“如果她没有当选呢？”弗拉基米尔问道。\n\n“你的女儿将被送到你这个父亲身边接受进一步的教育。我们不会对她做任何其他事情，就像对你一样。”卡津别克说。\n\n“我的命运如何？”弗拉基米尔三世说。\n\n“我建议您放弃政治活动。我可以归还你的仆人、住所，留下你的贵族头衔，但作为回报，你要发誓不参与政治活动。我将信守诺言，在您保证不参与政治活动后，我不会动您一根毫毛。”\n\n“结果是这样的，我很难过，但我很高兴您给了我机会，让我至少在晚年还能保持这种状态。我会真诚地相信，您会带领俄罗斯进一步走向繁荣。”弗拉基米尔伤感地说，但他明白自己的政治生涯从此结束了。\n\n这次谈话后，卡津别克回到别列兹尼基继续他的政治事务，而弗拉基米尔则开始了他更加平静的新生活。"
 MAR_smuta_occupation.2.a:0 "这对俄罗斯的未来是必要的。"
 MAR_smuta_occupation.3.t:0 "新兵旧将"
 MAR_smuta_occupation.3.d:0 "战后，有许多站在弗拉基米尔三世一边的将军被监禁。其中许多将军都是维亚特卡的意识形态支持者，从西俄战争时期就开始为他们的沙皇效力，他们绝对背负着通敌者的污名。尽管他们站在德国人一边，是俄罗斯人民的敌人，但他们是优秀的军事专家，在战斗中对我军进行了值得尊敬的抵抗。这表明，他们的领导才能仍然引人注目。\n\n我们本可以像在彼尔姆一样审判他们，将他们全部枪决。不过，卡津别克认为，这些人对祖国还是可以派上用场的。别列兹尼基的军队纯粹由于人口因素，高级军官相当匮乏，为了缓解这种状况，我们可以招募几名这样的将军为我们服务。\n\n别洛泽尔斯基指示他的部下向将军们转达建议，让他们向别列兹尼基和青年俄罗斯联盟进行军事宣誓，并开始服兵役，以换取出狱自由。这样的建议发给了所有将军，但几乎所有将军都拒绝向卡津别克本人宣誓。其中许多人说，青年俄罗斯联盟是俄罗斯君主制的叛徒。在他们看来，当我们还站在同一阵线反对革命阵线时，我们还在为正确的、白军的事业和沙皇的事业而战，但我们刚刚所做的只能被解释为背叛。他们中的一些人把我们当作朋友，但一些将军对这种背叛非常痛恨，并产生了强烈的反感。有些人仍然认为，斗争还没有结束，沙皇还会回来。至于与德国人合作的问题，他们认为，只要不是为了红军，即使与德国人合作也可以对抗红色瘟疫。\n\n显然，即使是假释，释放这些将军也是危险的，更不用说让他们服役了。但在所有意识形态成分中，有两个人还是同意按照青年俄罗斯联盟的思想宣誓。叶夫根尼·爱德华多维奇·梅斯纳是一名意识形态上的反共分子，他同意以打击共产党为借口宣誓。他认为，这绝对好过在监狱里腐烂，看到祖国如何被分为共产党和皇室。他在我们的思想中找到了足够的共同点，尽管他对我们的意识形态有很大的疑问。第二个人是扎盖诺夫·格奥尔基·普罗科皮耶维奇，他几乎是无言地完全同意向卡津别克和别列兹尼基人民宣誓。\n\n一周后，他们庄严宣誓，更换了军装的颜色，加入了青年俄罗斯联盟的服务行列。虽然有些人对新政权的忠诚度表示严重担忧，但我们必须对他们遵循“信任，但要核实”的原则。我们将派特勤部门对他们进行监视，并查找有关他们活动的所有信息。因此，他们的生死将取决于他们会背着我们做什么。"
 MAR_smuta_occupation.3.a:0 "他们选择了自己的命运。"
 MAR_smuta_occupation.4.t:0 "对阿卜杜拉·阿里舍夫的审判"
 MAR_smuta_occupation.4.d:0 "如今的鞑靼斯坦满目疮痍，战后的饥荒迫使人们背井离乡。这一切的罪魁祸首是谁？有人会说是卡津别克，因为他才是这场战争的始作俑者。但历史，是由胜利者书写的。现在，在别列兹尼基，他们将对这场不清不楚的战争的罪魁祸首——阿卜杜拉·阿里舍夫进行审判。\n\n卡津别克亲自出席了这场审判。他身后的第一排坐着他的将军们，其余的座位上则坐满了法官。他们对面是被铁链牢牢锁住的阿卜杜拉·阿里舍夫。他明显消瘦了许多，看起来憔悴不堪。卡津别克感受到了胜利的喜悦，他们只需要等待法官的判决。\n\n“阿卜杜拉·阿里舍夫，你因通敌叛国，以及你的行为导致了别列兹尼基和鞑靼斯坦之间的战争，被判处死刑！是你，导致了俄罗斯和鞑靼人民的伤亡！你还有脸自称‘鞑靼斯坦的英雄’吗？现在，你还有什么临终遗言？”\n\n阿卜杜拉·阿里舍夫抬起头，看着法官们，目光直视着卡津别克的眼睛：\n\n“亚历山大·利沃维奇·卡津别克，你被蒙蔽了双眼，你太盲目了。我是在保卫鞑靼斯坦，使其免受你的野心侵害，是在保卫我的祖国，使其免遭占领！我只想让这片神圣的土地上空飘扬着和平的旗帜！但你永远不会明白。你明明出生在喀山，而现在你的军队却在洗劫我们的圣城！你以为我的死就能让鞑靼人民屈服吗？他们知道真相，那个你想掩盖的真相。记住我的话！”\n\n卡津别克面无表情地听完了他的全部发言，然后轻声对身旁的一位将军说：\n\n“尽快结束这场闹剧，我感到恶心……”\n\n在一番简短而激烈的发言之后，阿卜杜拉被带到了外面的墙边。瓦维洛夫很乐意把他推到墙边：\n\n“士兵们！准备！”\n\n士兵们举起步枪，瞄准了那个已经放弃抵抗的人。枪声响起，尸体顺着墙壁滑落，倒在了血泊中。这位“通敌者”咽下了最后一口气，离开了这个世界。"
 MAR_smuta_occupation.4.a:0 "一片寂静..."
 MAR_smuta_occupation.5.t:0 "俄罗斯人生"
 MAR_smuta_occupation.5.d:0 "曼苏尔过去每天都会在阿济耶夫清真寺主持宗教仪式。他是一位备受尊敬的伊玛目，肩负着重大的责任。他也是艾哈迈德-扎基的密友。但现在一切都变了，别列兹尼基吞并了巴什基尔，伊玛目甚至不敢再主持宗教仪式了。“俄罗斯士兵肯定会阻止虔诚的穆斯林前来礼拜。”伊玛目心想。\n\n但士兵们只是站在街上，观察着来往的行人，甚至还会与他们交谈，就像对待普通人一样。没有争吵，没有枪声，一切都那么平静。也许，他脑海中想象的一切都只是杞人忧天罢了。\n\n乌法变得比以往任何时候都更加美丽。现在，他终于可以安心地为他的巴什基尔兄弟们主持宗教仪式了。"
 MAR_smuta_occupation.5.a:0 "和平与秩序。"
 MAR_smuta_occupation.6.t:0 "高尔基的“金子”"
 MAR_smuta_occupation.6.d:0 "第二步枪师的所有成员都获得了嘉奖，许多人还得到了晋升。阿列克谢·多布隆拉沃夫是他们中最出色的一位。由于前任师长阵亡，他被任命为新师长。现在，他奉命率领部队搜查几处仓库，据说那里存放着更多可用物资。他们拥有的装备越多，别列兹尼基的优势就越大。阿列克谢对此心知肚明。因此，他们迅速重新集结，向第一个仓库进发。\n\n第一个仓库位于高尔基市以南，距离市区大约10公里，靠近卡拉切沃村。村民们根本没有怀疑，在他们眼皮子底下的森林里竟然藏着一个具有重要战略意义的目标。他们穿过了树林，来到了一处类似地窖的建筑前。仓库应该就在这附近！阿列克谢走到这座“小屋”前，用手摸了摸墙壁。很快，一抹金属光泽映入眼帘——没错，这里就是仓库。\n\n阿列克谢下令找到入口，并查明仓库里的东西。他们找到了入口，但被锁住了……他们不得不使用炸药，但又要确保炸药不会损坏仓库里的东西。他们在入口附近发现了一些过期炸药：\n\n“趴下！”阿列克谢对着躲在树后的士兵们喊道。轰！一声巨响，入口处出现了一个大洞，士兵们鱼贯而入。仓库里存放着普通武器、装甲运兵车和几辆坦克。爆炸对附近的几件装备造成了一些轻微损坏，但其他装备都完好无损。阿列克谢请求与总参谋部通话，他接过电话，汇报道：\n\n“我们已经找到物资了，很快就会运回别列兹尼基！”"
 MAR_smuta_occupation.6.a:0 "真是个绝妙的发现。"
 MAR_smuta_occupation.7.t:0 "将军的最后一天"
 MAR_smuta_occupation.7.d:0 "弗拉索夫在青年俄罗斯士兵的包围下缓缓前行。他知道自己将要去往何处，也知道等待着他的将是什么。在审判上，他们已经向他清楚地表明了这一点。三分钟，仅仅二十分之一小时——这就是宣判这位叛国将军罪名所需的时间。当然，他是唯一一个享受如此“快速审判”的人。其他人，都不得不经历繁琐而漫长的官僚地狱。但另一方面，俄罗斯解放军的领导人只能为自己的所作所为承担后果。他背叛了祖国，将人民推向了地狱之门。对他来说，救赎之路已经断绝。\n\n今天的天气有些异样。阳光明媚，万里无云，甚至连一丝风都没有，树冠都纹丝不动。仿佛整个世界都静止了，默默地注视着正义的审判。几分钟后，将军已经站在了墙边，他骄傲地拒绝了士兵递来的香烟，闭上了双眼，准备迎接死亡的降临。然而，即使到了现在，他依然无法摆脱内心深处那份人类最原始的恐惧。此刻，将军的脑海中只有一个念头…"
 MAR_smuta_occupation.7.a:0 "我只希望它快点结束。"
 MAR_smuta_occupation.7.b:0 "我只希望我的人民还能有机会将功赎罪。"
 MAR_smuta_occupation.8.t:0 "失败的交易"
 MAR_smuta_occupation.8.d:0 "尼基塔·鲁布佐夫是科斯特罗马市长领导的黑帮中的一员。他们给尼基塔开出的价码很高，他对此也感到很满意。虽然沃洛格达和科斯特罗马都被并入了别列兹尼基，但别列兹尼基政府并没有对这两个地方的政府机构进行清洗。这一次，尼基塔要运送一批货物去雅罗斯拉夫尔，那里会有德国人接应他。边境没有守卫，所以应该不会出什么问题。\n\n尼基塔开着一辆装着大量原材料的旧苏联卡车，踏上了旅程。离开科斯特罗马后，他沿着一条坑坑洼洼的道路行驶，但这对他来说早已习以为常。一路上风景秀丽：高耸的树木、透过树叶洒下的阳光……距离边境只有五六公里了。然而，一件意想不到的事情发生了。\n\n边境线上突然出现了一个检查站，周围驻守着大量士兵，至少有十个人。此时没有其他车辆排队，于是尼基塔试图若无其事地开车通过，但他立刻被拦了下来：\n\n“同志！请接受检查，才能过境！”尼基塔意识到自己完蛋了。如果他们发现了车上的“货物”，就一定会逼问他幕后主使。他必须想办法脱身：\n\n“嗯…抱歉，我突然想起还有点事，就不去了…” 尼基塔一边说着，一边开始倒车。\n\n“哎，怎么就要走了呢？让我们看看你要往莫斯科境内运什么东西不好吗？”检查站的警卫笑着说道。他打开了货箱，看到了他本不该看到的东西。两名警卫立即抓住尼基塔的胳膊，防止他去掏枪。"
 MAR_smuta_occupation.8.a:0 "现在他无处可逃了..."
 MAR_smuta_occupation.9.t:0 "夺取科米"
 MAR_smuta_occupation.9.d:0 "科米共和国的国旗缓缓降下，人们躲在家中，战战兢兢地等待着卡津别克摄政统治下的命运。战争结束了，民主死了，共和国也不复存在。许多政府官员逃离了科米，别列兹尼基士兵则驻守在曾经的科米议会大厦前。\n\n在瑟克特夫卡尔，举行了一场小规模但意义重大的阅兵式。卡津别克发表了数篇演讲，内容包括俄罗斯的统一、青年俄罗斯联盟的意识形态，以及青年俄罗斯联盟的旗帜将如何在不久的将来飘扬在祖国大地之上。\n\n虽然许多人仍在适应新的体制，但有一件事是肯定的：别列兹尼基已经巩固了其在俄罗斯中部的统治地位，这也为其统一全国奠定了基础。摄政王万岁！"
 MAR_smuta_occupation.9.a:0 "我们军队的又一次胜利。"
 MAR_smuta_occupation.10.t:0 "赤色威胁"
 MAR_smuta_occupation.10.d:0 "距我们在科米共和国战胜布尔什维克已经过去数周。现在，一场针对他们罪行的公正审判正在进行！尽管在科米，共产党的抗议活动仍在继续，但在别列兹尼基，三人的命运已成定局：鲍里斯·尼古拉耶维奇·波诺马廖夫、安德烈·亚历山德罗维奇·日丹诺夫和斯维特兰娜·尼古拉耶夫娜·布哈林娜。他们都属于科米共产党内部的不同派系。有些人位高权重，有些人则默默无闻，但这丝毫不能减轻他们的罪责。\n\n审判开始前，卡津别克亲自出席，并向法官们提出了“建议”。许多人已经预料到等待他们的是什么。很快，整个流程开始了。首先是对罪犯生平及其在科米共产党中影响的详细描述。随后，首席法官站起身，看着三名罪犯，开始了他的讲话：\n\n“现在！今天，我们将对这些人进行审判。我们已准备好向这些科米共产党的走狗宣告判决。首先，我们将对该党的黑马，鲍里斯·尼古拉耶维奇·波诺马廖夫进行宣判”——法官转向那位咳嗽了几声的老人——“鉴于你的政治活动、暴政、在科米制造混乱以及背叛祖国，你被判处最高刑罚——死刑！”\n\n人群中开始窃窃私语。波诺马廖夫被囚禁期间，已尽显老态，对他施以如此严厉的惩罚是否必要？让他安度晚年不好吗？然而，没有人质疑法官的判决。法官继续说道：\n\n“我们的下一位罪犯是安德烈·亚历山德罗维奇·日丹诺夫，”——法官转向日丹诺夫，而波诺马廖夫则被带往了“特定”地点——“鉴于他的政治活动以及参与针对俄罗斯人民的恐怖活动，他必须被判处死刑！” 日丹诺夫低下了头——“然而，考虑到他身患癌症以及他为社会做出过一些贡献的科研工作，日丹诺夫将被判处20年有期徒刑。”日丹诺夫对这样的命运始料未及，甚至失声痛哭起来。\n\n很快，法官继续他的讲话：\n\n“斯维特兰娜·尼古拉耶夫娜·布哈林娜，”——他转向自始至终都直视着法官双眼的她——“鉴于你的政治活动以及参与对别列兹尼基的战争，你被判处在劳改营服刑10年。庭审结束。”\n\n审判结束了，罪犯们被带走：两人被押上卡车，等待着他们的将是监狱，而另一人则被送往了森林…卡津别克对审判结果感到满意：一切如他所愿。"
 MAR_smuta_occupation.10.a:0 "少了一个麻烦。"
 MAR_smuta_occupation.11.t:0 "理论家与数学家"
 MAR_smuta_occupation.11.d:0 "今天，别列兹尼基的人们都在谈论一件事——对“进取组织”的审判，许多人因此决定前往旁听。由于是公开审判，现场聚集了大量民众。卡津别克和他的将军们坐在“楼座”上，审视着被带进房间的两名被告。他们身穿白色衬衫，一老一少。年长的是欧亚主义者列夫·古米廖夫，年轻的是伊戈尔·沙法列维奇。\n\n首席法官从古米廖夫开始审判。首先，他开始以一种极其负面的方式谈论古米廖夫的生平以及欧亚主义。许多人以为法官接下来会恶语相向，但这并没有发生。他最多只是称古米廖夫“精神错乱”。接下来是沙法列维奇。法官同样开始描述他的生平和学术活动，然后谈到了他的政治活动。人们可以听出法官言语中对沙法列维奇的嘲讽：“……仅凭数学知识是无法参与政治的。”\n\n很快，法官们开始互相商议。五分钟后，法官走到众人面前，宣布了判决：\n\n“同胞们！法庭已经准备好宣布对这些人的判决。首先是古米廖夫：鉴于其政治活动、组织极端主义以及建立“恐怖”统治，列夫·古米廖夫被判处死刑！但考虑到他的精神状况，他将被送往精神病院，在那里，如果还有可能恢复的话，他会得到治疗，”——说到这里，古米廖夫已经被带走了——“沙法列维奇！鉴于你的政治活动，以及你与古米廖夫集团的共谋关系，你被判处20年有期徒刑。但考虑到你的学术贡献，我们将刑期减为10年。”——他们对沙法列维奇宣布道——“休庭！”\n\n人们开始议论纷纷：既然可以将他直接处决，为什么要把古米廖夫送去精神病院？他是领导者，应该得到应有的惩罚。但有一点是所有人意见一致的：“进取组织”已经完蛋了，别列兹尼基在政治舞台上的地位得到了加强。"
 MAR_smuta_occupation.11.a:0 "一片沉默。"
 berez_news.1.t:0 "屠杀"
 berez_news.1.d:0 "占位文本"
 berez_news.1.a:0 "你的壮举不会被遗忘！"
 berez_news.2.t:0 "矿场的悲剧"
 berez_news.2.d:0 "格里高利是警界的一名警官，并且身居要职。在别列兹尼基，他是这座城市的警察局长。他受人尊敬，经常被邀请参加各种庆祝活动，但与许多刻板印象不同的是，他正直、公正、善良。他从不尸位素餐，甚至会亲自参与危险的行动！这不，城郊一座矿上传来消息：矿井坍塌了！据说有几名矿工被困在地下，急需救援。格里高利被任命为特别救援队的队长，负责解救受困矿工。\n\n格里高利迅速召集了一支由最专业、最忠诚的警员组成的队伍，他们迅速带齐了所有必要的装备。卡车整装待发，准备前往目的地。\n\n“我们大约需要行驶15-20分钟就能到达那里，别担心！”司机笑着说。\n\n卡车启动了，格里高利决定抽根烟来打发时间，而他的队员们还在讨论是否会有伤亡。真是个奇怪的讨论话题，不是吗？突然，卡车猛地刹车，格里高利手中的香烟也因此掉落。他有点生气：\n\n“哎，听着！你的驾照是咋考到的？”格里高利语气急促而尖锐。\n\n“抱歉，局长，我不得不急刹车，您自己看看就知道了！”\n\n队员们走下卡车，都被眼前的景象惊呆了。他们来到了一座坍塌的矿井前。原来，卡车撞上了一块滚落到路上的岩石。坍塌的矿井旁站着一些民众和普通警察。格里高利感到有些愧疚：\n\n“抱歉，我刚才的态度不好。我并不知道所有细节。”\n\n“没事！我没放在心上，我已经习惯了。”\n\n队员们向人群走去，所有人都认出了格里高利：他们开始恳求他，恳求他救救被困在地下的亲人。但格里高利没有理会他们，而是径直走向尚未被封锁的入口…"
 berez_news.2.a:0 "下一个是？"
 berez_news.3.t:0 "隧道尽头的光"
 berez_news.3.d:0 "一进入矿井，救援队就发现不仅矿道被堵住了，还被水淹了！没走多远，他们就听到远处传来的呼救声，便循着声音一路跑去。幸运的是，矿道没有岔路，他们不必分头行动。最后，他们看到了两个声嘶力竭呼救的人。其中一个是年约二十的年轻人，一头卷发；另一个是老人，格里高利估计他得有五十岁了，头发花白，但身体看起来还算硬朗。是那个年轻人在大声呼救，以引起注意。他们被一块重约150公斤的巨石压着动弹不得：\n\n“救命啊！老天爷啊！我可不想第一天来这鬼地方就交代在这儿！要是我爸好好休他那该休的假，而不是带我来这儿参观，我们现在也不至于躺在这儿！”\n\n“你给我闭嘴！听得我心烦！”他的父亲和他一起被困在巨石下，只能嘶哑地挤出这句话。\n\n救援队毫不费力地开始抬起石头。石头并不算太重，几秒钟后，两人就脱困了。他们得知，父亲名叫叶戈尔，儿子名叫伊凡。虽然叶戈尔身体健壮，但长时间的压迫让他几乎喘不过气来，毕竟上了年纪。格里高利背起叶戈尔，朝出口走去：\n\n“谢谢你，年轻人。”叶戈尔低声说道，语气虚弱。\n\n“我只是在做我该做的事。对了，还有其他人被困在这里吗？”\n\n“没有了，当时我们正准备离开矿井，我们是最后一批。”\n\n“那就好…”\n\n终于，他们回到了地面，看到了光明。人群中唯一的一位女士朝伊凡奔去——她是伊凡的母亲。格里高利向他们走去，叶戈尔从他背上下来，拥抱住妻子。久别重逢，莫过于此！"
 berez_news.3.a:0 "感谢上帝，没有人员伤亡。"
 berez_news.4.t:0 "折翼之鹰"
 berez_news.4.d:0 "西蒙是个普通的牧师。他的父母和朋友都已遇难，只有他独自一人逃往东方。在逃亡途中，德国哨兵打伤了他的腿，他只能拖着伤躯爬到最近的村庄寻求帮助。伤愈后，他决定留在彼尔姆当一名牧师。但随着西俄罗斯革命阵线的崩溃和雅利安兄弟会在彼尔姆的建立，他逃到了邻近的别列兹尼基。西蒙用在彼尔姆服务期间积攒的钱，在别列兹尼基西北部，靠近乌拉尔山脉的地方，建立了一座教堂。\n\n新的一天开始了。西蒙正埋葬着新的死者，他们的尸体被送到他这里。这些可怜的人是被炸弹意外击中的。前来的人络绎不绝。突然，他的助手阿尔卡迪神父叫住了他。\n\n“神父！我们没有足够的棺材来埋葬这些人了，而且也没有地方了！”\n\n西蒙叹了口气，悲伤地看着阿尔卡迪。\n\n“我们得去贷款买新的土地和更大的棺材。”\n\n“神父！我们已经债台高筑了！很快，我们就会把整个教堂都抵押给债主！我们不能从教友那里拿些钱吗？他们会理解的。” 阿尔卡迪难以置信地回答。\n\n西蒙再次叹了口气，看着阿尔卡迪，和他一起走到了街上。街上有一条长椅，只有牧师会坐在那里。他们坐了下来，西蒙望着远处的山脉。很快，他继续说道：\n\n“阿尔卡迪，我知道。我们已经走投无路了。我们没有钱。我们只能依靠捐款生活。难道我看不出来吗？但我不能收这些被德国轰炸机夺去生命的可怜人的钱。对德国人来说，这只是一场游戏，但对我们来说，却是死亡。好人正在死去！他们本可以帮助这个邪恶的世界，他们本可以给我们带来我们缺乏的那一缕光明。我听说了太多关于这些死亡的故事，每次都会让我泪流满面，因为它还没有结束……”\n“好吧，听你的。你是我见过的最好的人。我现在得回去做礼拜了。”\n阿尔卡迪回到了教堂，继续进行礼拜仪式。而西蒙则留在了街上，望着雄伟的乌拉尔山脉。突然，他听到了一些声音。他环顾四周，发现了一架德国轰炸机。它可能正在寻找猎物。但他注意到一个奇怪的现象——它只是在飞行，没有投掷炸弹。不仅如此，它还在下降，朝着山脉的方向飞去。阿尔卡迪从教堂里跑出来，看到了他的朋友：\n\n“快回教堂！这里有些不对劲，阿尔卡迪。”\n过了一会儿，轰炸机下降到了一个危险的高度。如果它再不拉升，就会撞上山脉。人们从教堂里走出来，观看这场奇观。然后，轰的一声，轰炸机的引擎爆炸了，随后它撞上了岩石嶙峋的山脉。爆炸产生的烟雾在十公里外都能看到。西蒙画了个十字，对阿尔卡迪说：\n\n“帮我接通别列兹尼基的电话。“"
 berez_news.4.a:0 "这里有些不对劲…"
 berez_news.5.t:0 "匪夷所思，但千真万确"
 berez_news.5.d:0 "我们的朋友格里高利正悠闲地啜饮着咖啡，享受着难得的放松。今天是他的休息日，他可以什么都不用做，好好休息一下。最近风平浪静，没有什么需要他亲自出马的大案要案。这个月以来，他终于可以喘口气了。天气晴朗，微风拂面，没有什么能打扰到他此刻的惬意。\n\n突然，警员库尔恰科夫冲进了他的办公室：\n\n“出事了！一架德国飞机在东北方向坠毁了。政府要求我们调查此事，查明真相，以及飞机为何会坠毁在乌拉尔山脉。他们把这项任务交给你了！”\n\n格里高利斜了库尔恰科夫一眼，长叹了一口气，放下手中的咖啡，站起身来：\n\n“唉！就不能让我安安静静地喝完这杯咖啡吗！马上召集人手。”\n\n库尔恰科夫向格里高利敬了个礼，转身去召集人手，准备前往坠机地点。格里高利也开始收拾登山所需的装备。十分钟后，队伍集结完毕。格里高利立刻对队员们说：\n\n“伙计们，速战速决，尽快返回总部，怎么样？我的咖啡都要凉了…”\n\n卡车已经准备就绪，队员们纷纷上车。格里高利朝司机喊了一声“出发”，卡车便开始启动。一路上，格里高利望着窗外掠过的森林，而队员们则注视着远处升起的浓烟——那是坠机地点的方向。道路在当地一座教堂前戛然而止，关于坠机的消息就是从这里传出来的。两名神父站在教堂门口，目睹了这一切。经过一番询问后，队伍继续向山中进发。\n\n他们不得不穿越一片森林，大约20分钟后，他们穿过了森林，来到了山脚下。尽管他们没有被告知需要爬山，但他们还是在一个小时内成功登顶。对于“新手”来说，这已经算是不错的成绩了。很快，他们就看到了那架飞机。幸运的是，飞机距离他们只有几百米远。他们兴奋地跑向飞机，但当他们到达坠机地点时，都被眼前的景象惊呆了。遇难者的尸体支离破碎：头颅、手臂、肠子…其中一名队员忍不住呕吐起来，另一个人惊呼道：\n\n“他们就算死有余辜…也不该是这样的死法！”\n\n“是谁肢解了他们？是谁在爆炸前杀害了所有机组人员？我们能查明真相吗？”——格里高利自言自语道。他们在天黑前返回了总部，带回了照片和从坠机现场收集到的各种样本。格里高利把已经凉透了的咖啡倒进了水池。“经历了这件事，我发誓…”"
 berez_news.5.a:0 "我们永远不会知道…"
 berez_news.6.t:0 "士兵的平凡一日"
 berez_news.6.d:0 "清晨六点整，基里尔·伊戈列维奇准时醒来。他揉了揉惺忪的睡眼，从破旧不堪的床上爬起来，迅速穿好衣服。军队规定，穿衣时间不得超过一分钟。穿戴完毕后，基里尔走出营房，他的战友们正在外面等着他：\n\n“基留沙，你总算出来了！”基里尔的儿时玩伴尤里高兴地打招呼道。\n\n“早啊……”基里尔环顾四周，发现所有士兵都已经到齐了，“怎么大家都聚在这儿？今天可不像是我们平常的守边日子……”\n\n基里尔·伊戈列维奇驻守在与维亚特卡接壤的边境线上。平时，他们的日子过得百无聊赖，除了寻欢作乐、喝酒打牌，就是无所事事。但今天，显然有什么重要的事情要发生。\n\n人群中走出一个年近半百的男人，他身着便装，领口露出彩色衬衣领，敞着衣襟，裤子扎在靴子里，显得精干利落。\n\n他显然是从首都来的军官，而且肯定有什么重要的事情要宣布：\n\n“大家好！我是你们新任的营长，米哈伊尔·安德烈耶维奇。你们之前的营长叶甫根尼·戈希钦已经退役了……”\n\n“什么？他退役了？”士兵们都很惊讶，尤里更是补充道，“他才三十岁，怎么可能退役！”\n\n“事实就是如此，我也不清楚原因，不过闲话少说！我被派到这里只有一个目标，那就是把你们训练成真正的军人。一场战争即将来临，你们必须为祖国而战，自豪地扛起青年俄罗斯的旗帜！现在，全体集合！”\n\n他的这番话说完，真正的训练就开始了。年轻的士兵们自然都不喜欢这样，但至少基里尔很高兴能有事可做。他曾经亲身经历过战争，一场可怕的战争。他也亲眼目睹了战争带来的后果。\n\n“喂，士兵！”一个声音把他从思绪中拉了回来，“训练的时候睡大觉？还不赶紧擦枪！你在这儿游手好闲、挥霍青春的时候，枪都生锈了！” 说着，一把莫辛纳甘步枪就扔了过来，基里尔猝不及防，差点没接住。上校轻蔑地哼了一声，基里尔茫然地盯着手中的莫辛纳甘步枪。他拿起抹布，熟练地拆开步枪，开始认真地擦拭起来。每次射击后，各种燃烧残留物、底火残渣以及枪膛磨损的痕迹都会留在枪管里……"
 berez_news.6.a:0 "又是新的一天…"
 berez_news.7.t:0 "新房子——新生活"
 berez_news.7.d:0 "大自然，是地球上未被人类科技玷污的美丽角落。在这里，你可以自由呼吸，与自己的思绪独处。每一片树叶，每一根松针，都以其独特的方式展现着自然之美。有时，我们太过习惯于周遭的世界，以至于忘记了去欣赏自然创造的这一切美好。但这是不对的！我们错过了环绕在我们身边的美丽：含苞待放的花蕾、夜莺的歌声、娇艳欲滴的花朵、青翠欲滴的绿草。\n\n马克西姆叔叔就是这样想的。马克西姆出生在彼尔姆，战争迫使他和家人搬到了美国。在那里，他作为一名医生声名鹊起，享誉全球。许多社会名流不远万里慕名前来，他也来者不拒，甚至包括那些在他的祖国犯下过错的德国人。尽管海外生活优渥，但他的内心深处始终怀念着祖国，怀念着那广阔的田野和茂密的森林。因此，他决定回到彼尔姆。但出于某些原因（雅利安兄弟会），马克西姆最终选择在彼尔姆以北的别列兹尼基定居。他想要在那里建造一栋宏伟的房屋，以容纳他的整个家族，并为遭受苦难的俄罗斯人民服务。于是，他雇佣了工人在别列兹尼基以南10公里处，靠近森林的地方开始建造房屋。\n\n但对于他建造房屋的想法，人们都称他疯了，就像下面这首童谣所描述的那样：\n\n“瞧瞧咱们这位新邻居，\n怕不是个老糊涂，\n成天抱着药罐子，\n连女人都懒得理，\n只会说‘行行行’、‘不行不行不行’！”\n\n但这并没有让马克西姆感到生气，他说道：“也许在炮火连天的时候建房子是有点疯狂，但我已经老了，没有什么可失去的了。”\n\n地基已经打好了，是时候开始新的生活了！"
 berez_news.7.a:0 "祝他好运！"
 berez_world_news.1.t:0 "[Get_newspaper_header]谢尔盖·别洛泽尔斯基统一西俄罗斯"
 berez_world_news.1.d:0 "在血与火的洗礼之后，在别洛泽尔斯基和他的首相卡津别克的领导下，别列兹尼基完成了对俄罗斯西部地区的统一，人们满怀希望地展望著更加美好的未来。随着沙皇加冕，西俄罗斯以前所未有的速度实现了统一。尽管新政府致力于改善民生，但在某些地区，依然存在着抵抗力量，他们妄图恢复旧制度。在国际舞台上，俄罗斯西部的统一并未引起太多关注。长期以来，这个国家饱受分裂和内战的折磨，如今却以惊人的速度重新统一，而执掌大权的别洛泽尔斯基也鲜为人知。尽管如此，别洛泽尔斯基政府坚定不移地要解决一切冲突，不仅是国内的，也包括整个俄罗斯的。新的风暴正在酝酿，世界格局即将迎来巨变。"
 berez_world_news.1.a:0 "让我们赞美沙皇！"
 berez_world_news.2.t:0 "[Get_newspaper_header]摄政王统一西俄罗斯"
 berez_world_news.2.d:0 "德意志的轰炸终于平息，但对西俄罗斯来说，真正的战火才刚刚燃起。那些野心勃勃的军阀们，为了争夺这片土地的控制权，不惜刀兵相见。在这场决定俄罗斯命运的混战中，曾经依附于维亚特卡和弗拉基米尔三世的别列兹尼基异军突起，最终取得了胜利。军阀们的军队虽然顽强抵抗，但最终还是放下武器，或战死沙场。\n\n胜利的号角响彻大地，但一个问题也随之而来：俄罗斯将何去何从？卡津别克在清晨发表公开讲话，宣布西俄罗斯战事已停，并宣告了缙绅会议的决定：将权力移交给玛丽亚·罗曼诺娃——她在维亚特卡被推翻的弗拉基米尔三世的女儿。在玛丽亚成年之前，卡津别克将担任摄政，辅佐这位未来的俄罗斯女皇。\n\n与此同时，俄罗斯将改组为西俄罗斯王国，而国家接下来的目标，便是从那些叛乱的将军手中夺回失地，并为与东方敌人展开新的统一战争做好准备。无论是通过和平手段还是武力征服，西伯利亚和远东地区都将重回俄罗斯的怀抱。而现在，俄罗斯的首要任务是恢复民生，让人民过上幸福的生活。新的篇章已经开启，一个更加强大、统一的俄罗斯即将屹立于世界东方。"
 berez_world_news.2.a:0 "永恒的荣耀献给牺牲的英雄们。"
 berez_world_news.3.t:0 "[Get_newspaper_header]阿列克谢二世统一西俄罗斯"
 berez_world_news.3.d:0 "由于与交战将领的血战，西俄罗斯郊区的一个小领地——别列兹尼基分裂出来了。他们以前依附于维亚特卡，后来独立发展，并逐一占领了邻国。现在，当西俄罗斯的战斗结束后，别列兹尼基需要重组。\n\n别列兹尼基的前领导人卡津别克宣布辞去管理国家的职务，将其移交给由缙绅会议选举产生的奇迹般地幸存下来的阿列克谢·罗曼诺夫。在新沙皇罗曼诺夫的授意下，卡津别克本人出任国家首相。传说中，阿列克谢·罗曼诺夫从命运多舛的伊帕季耶夫府逃出，得到布哈林本人的庇护，布哈林给了他一个新的传说和姓氏，直到最近，他一直以柯西金的名字躲藏起来。\n\n卡津别克将权力移交给罗曼诺夫后，别列兹尼基改组为西俄罗斯帝国，罗曼诺夫的第一个承诺就是防止重蹈覆辙，并许诺俄罗斯最终将成为世界上最繁荣的国家。"
 berez_world_news.3.a:0 "令人意外的转折。"
 berez_world_news.4.t:0 "[Get_newspaper_header]俄罗斯人民沙皇国统一全俄罗斯！"
 berez_world_news.4.d:0 "仅仅十年的时间，昔日四分五裂、军阀割据的俄罗斯，在经历了血与火的洗礼后，再度迎来了统一。全世界都在关注着俄罗斯的命运，期待着与这个重新崛起的国家建立外交关系。最终，在年轻一代的政治精英和沙皇谢尔盖·别洛泽尔斯基的领导下，俄罗斯实现了统一。\n\n君主制与社会主义思想的成功结合，使得俄罗斯人民得以摆脱过去政府的错误，汲取了沙皇俄国和苏联的精华。政治学家们宣称，统一的俄罗斯将改变冷战的权力格局，但究竟会走向何方，一切尚未可知。\n\n别洛泽尔斯基在其公开讲话中强硬地表示，所有曾经伤害过俄罗斯的敌人，都将为他们的行为付出代价。这番充满火药味的宣言似乎暗示着，这个新生的“人民沙皇国”将走上一条前所未有的道路。"
 berez_world_news.4.a:0 "青年俄罗斯万岁！"
 berez_world_news.4.b:0 "沙皇与苏维埃？有意思的组合。"
 berez_world_news.6.t:0 "[Get_newspaper_header]俄罗斯人民帝国统一全俄罗斯！"
 berez_world_news.6.d:0 "刚刚有消息称，俄罗斯人民帝国在奇迹般获救的阿列克谢二世·罗曼诺夫的领导下，统一了曾经四分五裂的前苏联。许多人认为俄罗斯重新崛起的可能性非常大，并普遍看好阿列克谢二世·罗曼诺夫统一全俄罗斯的能力。\n\n刚刚出现在世界地图上的俄罗斯人民帝国是独一无二的——青年俄罗斯人将社会主义和君主制思想结合在一起，创造了相反理念的有效结合。既然国家已经统一，全球分析家无法准确评估其未来的行动，但有一点是明确的——它打算誓死捍卫自己的利益。至于能否成功，只有时间才能证明。\n\n归根结底，俄罗斯的统一使世界比以前更加和平。俄罗斯人民帝国(又称\"红色帝国\")至少结束了世界上这一地区的无政府状态，许多国家纷纷派遣外交官前往俄罗斯建立外交关系。"
 berez_world_news.6.a:0 "红色帝国万岁！"
 berez_world_news.6.b:0 "阿列克谢还活着?难以置信。"
 MAR_Order_category:0 "圣乔治骑士团"
 MAR_military_order_modifier:0 "军事修道院骑士团"
 MAR_gayny_mechanic_tt:0 "我们将作出§Y决议§!，将§Q圣乔治骑士团§!纳入我们的管理系统。\n\n§B添加修正§!§Y“军事修道院骑士团”§!，§B该修正将会§!\n\n§B-15% 政治点增长§!\n§B+5% 组织度§!\n§B+1.5% 增援速度§!"
 MAR_Order_category_desc:0 "由于卡津别克政府希望和平合并圣乔治骑士团的领土，因此签署了一份特别协议，根据该协议，骑士团控制的领土将移交给别列兹尼基，但骑士团将保留其自治权，并得到别列兹尼基的全力支持。\n\n由于别列兹尼基领土的扩大，我们现在必须将骑士团从盖恩扩展到最终的整个俄罗斯。\n\n对我们来说幸运的是，在苏联解体和西俄革命阵线失败后，就我们而言，许多西俄居民始终将教会，将圣乔治骑士团视为统一俄罗斯的希望。因此，当教会站在我们这一边时，我们就有义务帮助圣乔治骑士团在前苏联领土上扩张。"
 MAR_Order_Helping_Hand:0 "伸出援手"
 MAR_Order_Helping_Hand_desc:0 "尽管圣乔治骑士团最近进行了整合，但当地人拒绝接受我们的管理方法。然而，当地人也饱受补给问题和非骑士团控制区无法无天的困扰。我们应该开始慢慢改善他们的福利，然后人们就会接受我们的想法。"
 MAR_smuta.23.t:0 "你所相信的就会成为你的世界。"
 MAR_smuta.23.d:0 "太阳下山后，盖尼完全陷入黑暗之中。只有微弱的烛光从教堂的窗户射向街道。然而，在过去的两周里，盖尼的夜晚变成了一个全新的城市。刚开始通电时，只有几盏战前的路灯照亮街道。然而，盖尼已经十几年没有通电了，对于从未见过灯泡和路灯的孩子们来说，通电简直就是上帝创造的奇迹。在短短两周内，盖尼的路灯数量增加了两倍，在许多房子里，崭新的白炽灯泡取代了油灯。\n\n就在一个月前，安娜甚至不会想到让儿子在日落后出门，而瓦勒卡自己也怕黑，哪里都不愿意去。不过，现在街上有了光亮，即使是去镇子另一边的水井也不那么困难了。\n\n男孩刚走出家门，就看到街对面围了一群人。他们围着什么东西。瓦勒卡悄悄地从那些目瞪口呆的人中间走过，终于看清了他们在看什么。一个奇怪的G字形金属东西直直地伸出地面。突然，一个女人走了过来。她把一个桶放在装置下面，然后按下机器的“鼻子”。令瓦勒卡惊讶的是，水竟然倒进了桶里。\n\n“不敢想象！这居然是水龙头。”瓦勒卡读过的书里提到过它们。但他从未亲眼见过。\n\n几秒钟后，水桶里就装满了水，那个女人也上路了。小男孩对如此轻易就能得到水的事实感到不可思议。\n\n就在人们欢欣鼓舞的时候，一群老年妇女坐在对面的长椅上。她们窃窃私语\n\n“这是不对的，人们不会接受这个东西的！”\n\n“对，彼得罗夫娜。”“我们只有在红军时期才有过这样的东西，看看结果如何吧。”老奶奶朝地上吐了口唾沫。“不信神的人。”\n\n“女士们！”第三个老妇人喊道。\"这些柱子是别列兹尼基的异教徒为我们安装的。别喝这水，会毒死你们的！这是不对的。”\n\n这时，喧闹的人群安静了下来，许多人决定不听命运的诱惑，带着来时的空桶离开了。"
 MAR_smuta.23.a:0 "假以时日，一切都会物有所值。"
