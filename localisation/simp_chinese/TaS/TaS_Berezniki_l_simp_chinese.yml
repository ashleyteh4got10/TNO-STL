 MAR_Order_Army_Integration:0 "军队整编"
 MAR_Order_Army_Integration_desc:0 "盖尼的军队眼下是个奇观。当地的指挥系统被大大简化，很难与我们的领导层协调，而将军们自己也因为狂热的信仰而拒绝为新政权服务。"
 MAR_Order_Army_Integration_tt:0 "§Q圣乔治骑士团§!的§B一些将军§!§B会站在§!§G我们这一边§!"
 MAR_Order_New_Church:0 "新青年俄罗斯式教堂"
 MAR_Order_New_Church_desc:0 "我们与盖尼人的合作对我们、盖尼居民和骑士团都是有益的。因此，我们值得继续采取行动，让骑士团的代表全权管理教堂。"
 MAR_Order_New_Church_tt:0 "§B政治点增长§!§y3%§!\n§B增援速度增长§!§y2%§!\n§B组织度增长§!§y3%§!"
 MAR_smuta.24.t:0 "骄傲"
 MAR_smuta.24.d:0 "即使到了此刻，安季平的举止依然沉着冷静，但他还是无法适应自己现在的头衔。仿佛就在昨天，他还只是一名普通的拖拉机手，而今天，他却成为了仅次于上帝的存在。但事已至此，管他什么米什卡·安季平，他是…\n\n“维亚特卡和全俄罗斯大牧首的谢尔盖”——他在心中默念着，语气甜蜜。他站在教堂中央，环顾四周，心中满是占有的喜悦——如今，这里的一切都属于他了。\n\n然而，这样的沾沾自喜与傲慢无异。谢尔盖抑制住心中狂喜，提醒自己，从现在起，他只是上帝在人间的代理人，他所做的一切都应体现神的意志。\n\n谢尔盖垂下目光，望向圣坛。他一只手抚摸着光滑闪亮的圣盘，另一只手拿起盛满葡萄酒的圣爵。在鲜红的液体中，他看到了自己的倒影，仿佛一面镜子。这对他来说是如此陌生——镜中人不是一个浑身油污的拖拉机手，也不是一个疲惫不堪的士兵…而是一位留着胡须的男人，面容威严，仿佛饱经沧桑。一种满足感再次涌上心头，这一刻，他似乎不再在乎骄傲为何物，因为他已经是上帝在人间的代言人，一个真正的代言人，不像那些冠冕堂皇、肥头大耳的统治者一样，只是自封的傀儡。一阵急促的电话铃声打断了谢尔盖的思绪，将他拉回了现实。他快步走到圣坛后面一间类似的房间，拿起听筒。卡津别克熟悉的声音传来：\n\n“你好，米哈伊尔，或者更准确地说，谢尔盖。”\n\n“您好，亚历山大·利沃维奇。”\n\n“祝贺你，你成为大牧首对俄罗斯乃至整个东正教世界来说都是一件大事。直到现在，你在我国一直担任着重要职务，而现在你的角色更加举足轻重了。”\n\n“谢谢，你的祝贺对我来说非常重要。”\n\n“嗯哼。”卡津别克轻笑了一声。“毫无疑问，你自己也明白这一点，但我必须提醒你:你的崛起速度太快了，在如此短的时间内就达到了如此高的地位，这主要得益于你的智慧和远见。然而，身处高位，很容易迷失方向，不再理性地评估自己的能力。记住，只有上帝才拥有绝对的权力…”"
 MAR_smuta.24.a:0 "“你也并不是神。”"
 MAR_Order_Expand_Order:0 "扩展骑士团"
 MAR_Order_Expand_Order_desc:0 "青年俄罗斯联盟的前任领导层在一定程度上限制了骑士团的权力。现在是解决这个问题的时候了。"
 MAR_Order_Expand_Order_tt:0 "§B适役人口修正§!§y+10%§!"
 berez_belozerski.45.t:0 "沙皇与上帝"
 berez_belozerski.45.d:0 "别洛泽尔斯基的加冕典礼盛况空前，前来参加宴会的人更是络绎不绝。在人群中，大牧首谢尔盖一身雪白的法袍格外引人注目，与周围那些燕尾服和军装形成了鲜明对比，因此，皇帝毫不费力地就找到了他。\n\n别洛泽尔斯基与谢尔盖攀谈起来，话题从闲聊逐渐转向真正重要的问题。\n\n“…自古以来，君王就被认为是受命于天，近乎神圣。但您知道吗，有时君王的所作所为却与神的旨意相去甚远。”\n\n“只有上帝才知道。”谢尔盖低声回应，心中暗自揣测着皇帝这番话的用意，或许是对自己忠诚度的考验？\n\n“好吧，不必过分谦虚。”别洛泽尔斯基停顿片刻，接着说道，“我认为，国家需要一个能够指引君主走上正道、监督他是否敬畏上帝的人。”"
 berez_belozerski.45.a:0 "应扩大牧首的权力。"
 MAR_Order_Military_Squads:0 "骑士团平定队"
 MAR_Order_Military_Squads_desc:0 "俄罗斯领土辽阔无比......到处都是强盗、掠夺者和其他社会危险分子。然而，圣乔治骑士团有办法解决这个问题。"
 MAR_Order_Military_Squads_tt:0 "§B我们的驻军§!§y-15%§!"
 MAR_Order_Best_Among_Best:0 "精益求精"
 MAR_Order_Best_Among_Best_desc:0 "骑士团的骑士们是我军中纪律最严明的士兵，值得利用他们的经验来提高军队的融合度。"
 MAR_Order_Forges:0 "盖尼制造"
 MAR_Order_Forges_desc:0 "不久前，安季平建议利用教团控制下的教会力量为军队生产装备。这一举措看起来很不寻常，但值得支持。"
 MAR_Order_Forges_tt:0 "§B基础生产效率§!§y+5%§!\n§B工业生产总量§!§y+2.5%§!"
 berez_belozerski.43.t:0 "主的机器"
 berez_belozerski.43.d:0 "盖尼，这座昔日宁静的村庄，如今已成为新俄罗斯冉冉升起的工业中心。一座钢铁巨兽巍然屹立于此，它就是——盖尼多功能军工联合体。在圣乔治骑士团的鼎力支持下，这座象征着俄罗斯工业奇迹的丰碑拔地而起。\n\n清晨的阳光洒落在城市广场，人民沙皇国的政要齐聚于此，为联合体的落成典礼致辞。首先发言的是骑士团团长米哈伊尔·安季平，他感谢别洛泽尔斯基沙皇为骑士团的全面发展提供了大力的支持，并对参与联合体建设的村民们表示衷心的感谢。\n\n接下来，经济部长阿列克谢·柯西金走上讲台。他强调了发展俄罗斯小城镇的重要性，并提出了盖尼未来的发展规划，以满足俄罗斯新工业奇迹的需求。\n\n最后，谢尔盖一世沙皇发表了闭幕词。他对安季平的感激之情做出了回应，高度赞扬了联合体的缔造者们，并强调了工业发展在俄罗斯乃至世界未来考验中的重要性。\n\n夜幕降临，庆祝晚宴在骑士团合唱团和其他知名艺术家的精彩演出中落下帷幕。随后，一座新建的宏伟教堂在联合体附近落成，悠扬的钟声伴随着人们的欢声笑语，回荡在欣欣向荣的盖尼城上空。"
 berez_belozerski.43.a:0 "主啊，请保护我们的工业！"
 MAR_must_control_all_of_Southern_Urals:0 "§B我们必须控制§!§J南乌拉尔的所有地区§!"
 MAR_Order_South_Ural_Special_Zone:0 "南乌拉尔特区"
 MAR_Order_South_Ural_Special_Zone_desc:0 "与世隔绝的南乌拉尔地区长期以来一直是强盗和无法无天者的天堂，但现在是时候结束这一切了。圣乔治骑士团将被授予该地区的全部权力。"
 MAR_Order_South_Ural_Special_Zone_tt:0 "\n§B可征税人口§! §y+5%§!\n§J南乌拉尔§!的§B每个地区§!都将§B获得§!一个提供以下效果的§Y修正§!：\n§B地区资源§! §G-10%§!\n§B对地轰炸精准度§! §y-50%§!\n§B空中任务效率§! §y-30%§!"
 berez_belozerski.46.t:0 "只要我们心中有神，神便永存"
 berez_belozerski.46.d:0 "楚拉耶沃村终于恢复了些许生机。村民们几乎快要忘记安全的生活是什么样子了。迪勒万格的匪帮已经很久没有来骚扰他们了，不再有杀戮，不再有抢劫，也不再有纵火。村民们得以安心劳作，村庄里到处回荡着锤子的敲击声和锯子的嗡嗡声，一派热火朝天的景象。几间小屋、谷仓，甚至还有一座水泥砌成的行政大楼拔地而起。尤其是在过去的一周里，建设的速度快得惊人。在当地村民中，经常能看到一些身穿黑袍的人。在过去的几个月里，这在附近的村庄已经成为了一种常态。几十个年轻人住进了那些对他们表示同情的农民家中，帮助他们做家务、干农活。\n\n在修士们的帮助下，一座教堂在这片偏远的土地上拔地而起。它美丽而庄严，矗立在迪勒万格炸毁的旧教堂遗址上。修士们来到村庄的第七天，教堂的钟声如约而至，宣告着这个日子。修士们排成一排，沿着村庄的主街缓缓前行，所有村民都来为他们送行。\n\n队伍最前方，最年长的修士突然转身，面向众人说道：\n\n“善良的人们，我们的使命是执行神的旨意。神爱他的子民，而我们，则是要让那些绝望的人们有机会重新感受到这份爱。神爱着你们，你们也可以用行动来表达对神的爱。加入圣乔治骑士团的队伍吧，让我们一起携手，行善举，扬神恩。”\n\n当修士们离开村庄时，队伍的人数比来时多了近三倍。"
 berez_belozerski.46.a:0 "这就是上帝的作为。"
 berez_belozerski.44.t:0 "往昔的罪人"
 berez_belozerski.44.d:0 "彼得·迪尼科夫的一生，谨守着战士的信条。当然，在成为一名战士之前，他过着另一种人生：罪恶的人生，充斥着犯罪与盗窃，最终难免堕入劳改营的炼狱。然而，或许是命运的垂青，又或许是神恩的眷顾，将他引上了正途。\n\n当昔日的牧师雅尼斯·门德里克斯振臂一挥，带领着一群从沃库塔劳改营逃出的亡命之徒，在北境酷寒的荒原中向南而行时，彼得·迪尼科夫紧紧抓住这根救命的稻草，期盼着新生。他加入了乌拉尔卫队的先锋，与数十名年轻的伙伴并肩作战。他们与乌拉尔地区猖獗的无法无天和混乱抗争，训练到筋疲力尽，而支撑他们这一切的，是心中重燃的信仰之火。\n\n如今，圣洁的圣乔治骑士团统治着乌拉尔，彼得义无反顾地加入了骑士团，决心协助铲除乌拉尔残存的无法无天和匪患。"
 berez_belozerski.44.a:0 "岂是天生披战甲，唯将骸骨葬黄沙。"
 MAR_Order_event_tt:0 "§BOrganization of a division§! §y+5%§!\n§BAttack of the Division§! §y+2%§!\n§BDefense of the Division§! §y+2%§!"
 TaS_South_Ural_Special_Zone:0 "南乌拉尔特区"
 MAR_Order_templar_factories:0 "各教会的工厂"
 MAR_Order_templar_factories_desc:0 "盖尼工厂的经验表明了这一举措的有效性，因此决定将其推广到整个俄罗斯。从现在起，每个教会都将帮助装备军队。"
 MAR_Order_templar_factories_tt:0 "§BConstruction speed§! §y+10%§!\n§BFactory output§! §y+5%§!"
 MAR_Order_battle_priests:0 "前线牧师"
 MAR_Order_battle_priests_desc:0 "前线的牧师必须成为我军的正式组成部分。引进他们的初步经验表明，这一举措非常有效，因为他们极大地鼓舞了士兵的士气，并能亲自参加战斗。"
 MAR_Order_battle_priests_tt:0 "§B进攻§!§y+3%§!\n§B防御§!§y+3%§!"
 MAR_Order_kazakh_mission:0 "骑士团在哈萨克斯坦的任务"
 MAR_Order_kazakh_mission_desc:0 "哈萨克斯坦的土地上到处是沙子、沙漠和......不信神的家伙们。这里的许多人在艰难时刻背弃了真正的信仰，而选择了伊斯兰教或更糟的东西。圣乔治骑士团会解决这个问题的。"
 MAR_Order_new_purpose:0 "骑士团的新道路"
 MAR_Order_new_purpose_desc:0 "卡津别克的改革过后，圣乔治骑士团持续处于停摆状态，最终在宝座的起义中分裂。虽然大多数代表都支持我们的政府，但这种孤立势力的存在会对我们的未来造成损害。这就是为什么我们现在要将骑士团重新引导到正确的道路上。"
 MAR_Order_open_new_decisions:0 "§y将提供进一步的互动§!"
 MAR_Kosygin.66.t:0 "骑士团的命运"
 MAR_Kosygin.66.d:0 "安季平早已习惯了国家领导人不召见他喝茶，不与他讨论骑士团的美好未来。卡津别克施加的限制已经严重损害了他的权威，而宝座起义后的局势显然没有好转。\n\n在一间光线昏暗的办公室里，阿列克谢独自一人坐在那里，桌上摆着几份文件。沙皇注意到了进来的牧首，调整了一下眼镜说：“啊，谢尔盖...请坐？”\n\n“米哈伊尔·安季平，但这对我来说并不重要。那么，今天是什么风把我吹到您的办公室来了？”\n\n“啊，是的，对不起。你看，在恐怖组织宝座教派发动袭击后，骑士团中一些最激进的代表急忙支持其恐怖分子。”\n\n“我...我不明白你想说什么。”\n\n“你看，圣乔治骑士团是一个封闭的组织，如果你愿意的话，它是一个封闭的盒子，在这个盒子里可以积累很多最好的想法。你知道我们在重组盖尼工厂时遇到的困难。因此，我们做出了一个...艰难的决定。圣乔治骑士团需要进行重大的变革了。”\n\n“但你不能这么做 我们有协议的！”\n\n“请冷静，米哈伊尔。时代在变，骑士团也要变。具体来说，我们需要解散其军事小组。它不会完全解散，绝对不会。它将继续在俄罗斯执行人道主义任务，没有人会夺走你的牧首头衔。”\n\n“你，唉，这是我一生的事业...”安季平无奈地垂下肩膀，他现在什么也做不了。“你需要我做什么？”\n\n“啊，是的，在这种情况下，请在这里和这里签字。”说着，阿列克谢把几张纸推给了全俄罗斯的牧首。"
 MAR_Kosygin.66.a:0 "相信我，骑士团将继续传承下去。"
 MAR_Kosygin.67.t:0 "一封信"
 MAR_Kosygin.67.d:0 "信摆在桌子上，印着字，在一片混乱中，它仍然留在桌子的正中央。边上放着一部碟形电话，听筒悬空。虽然打电话的人早已匆匆离开了房间，但仍能听到嘟嘟声。\n\n文件散落一地。这里什么都有：乌拉尔边境的演习命令、附有短缺数据的补给报告，甚至还有几份关于与游击队冲突的报告。但即使所有这些加在一起，也不如信中的一行重要。"
 MAR_Kosygin.67.a:0 "佐西姆·马卡洛夫，你在圣乔治骑士团的成员资格已被暂停，原因是......"
 MAR_Order_forgive_and_be_forgiven:0 "你们祈求，就给你们"
 MAR_Order_forgive_and_be_forgiven_desc:0 "新的圣乔治骑士团应成为所有受难者的救赎，将上帝的话语和党的力量带到那些似乎被上帝遗忘的地方。"
 MAR_Order_forgive_and_be_forgiven_tt:0 "§B月度人口增长§!§y+10%§!\n§B稳定系数§!§y+2.5%§!\n§B应税人口§!§y+2.5%§!"
 MAR_Kosygin.68.t:0 "因汝之信，得偿汝愿"
 MAR_Kosygin.68.d:0 "晨曦初露，薄雾弥漫，博加托耶村却已是一片繁忙景象。第一缕阳光洒落之时，一群不速之客到访了这座饱经风霜的村庄。他们身着制服，胸前佩戴着十字架——上一次这样的场景出现时，结局并不美好。\n\n黑色的十字绣徽章起初令人心生疑虑，但当这些人开始与村长亲切交谈，分发救济粮和饮用水时，村民们心中的疑虑逐渐消散。这一次，他们是带着善意而来，帮助重建这片满目疮痍的土地。\n\n一天的时间，无法抚平战争在村庄和人们心中留下的创伤，但这仅仅是一个开始。毕竟，与空洞的承诺和冗长的说教相比，善行更能给人以希望。"
 MAR_Kosygin.68.a:0 "我们每个人都要为自己的灵魂而向上帝忏悔。"
 MAR_Order_allseeing_eye:0 "全视之眼"
 MAR_Order_allseeing_eye_desc:0 "我们不应忘记与教会的合作。骑士团的潜伏人员必须收集在忏悔时或仅仅在教堂里获得的材料。之后，他们必须将这些材料转交给上级部门。"
 MAR_Order_allseeing_eye_tt:0 "§BIncrease in political power§! §y+15%§!\n§BTaxable population§! §y+2.5%§!"
 MAR_Kosygin.69.t:0 "上帝并非提摩太"
 MAR_Kosygin.69.d:0 "伊万诺夫上尉又一次跨进了教堂的大门。他并非虔诚的信徒，每月来教堂报道不过是例行公事，除非发生了什么意外。\n\n高大微胖的格里戈里神父早已等候在门口，他身着黑色长袍，岁月的痕迹爬上了他的脸庞。\n\n“您好，神父，我又来了。” 伊万诺夫说道。\n\n“你好，格里沙，这次要不要进来坐坐？我给你泡壶茶。”神父答道。\n\n“抱歉，格里戈里，这次不行。说说吧，有什么情况？”\n\n“嗯，你知道的。”神父环顾四周，把手伸进长袍里，几秒钟后掏出一个记着笔记的本子，撕下一页纸递给伊万诺夫。“这是这个月所有忏悔的记录，没什么违法乱纪的事情。也许这次，你不用再看这些关于他人苦难的记录了？”\n\n“有没有问题，我们说了算。谢谢你的配合。”伊万诺夫接过纸张，淡淡地说。\n\n“随你吧。如果有什么需要，随时来找我，我不会告诉任何人你来过这里。”\n\n“抱歉，神父，我的职业不允许我这样做。”"
 MAR_Kosygin.69.a:0 "凡有的，还要加给他"
 MAR_Order_medical_order:0 "新时代的住院医师"
 MAR_Order_medical_order_desc:0 "让骑士团的主要活动面向和平前景，在冲突中有限地使用教士，仍然是有必要的。修道会最有能力的代表将能够在前线担任医务人员，及时帮助受伤的士兵。"
