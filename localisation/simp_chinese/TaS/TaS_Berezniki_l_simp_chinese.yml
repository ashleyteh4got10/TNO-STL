 MAR_Cyril_Yelita_Vilchkovsky_hog:0 "基里尔·叶利塔-维尔奇科夫斯基"
 MAR_Cyril_Yelita_Vilchkovsky_hog_desc:0 "§Y首相\n贵族保守主义§!\n--------------\n在遥远的1906年，基里尔·叶利塔-维尔奇科夫斯基诞生于一个显赫的贵族家庭。他自幼聪慧过人，怀揣着成为俄罗斯帝国政府中重要官员的梦想。然而，革命的风暴将他的梦想摧毁，家族在白军的失败后逃亡至法国。\n\n到了20世纪20年代中期，基里尔加入了青年俄罗斯联盟，他的智慧和魅力使他很快成为了该组织领袖亚历山大·利沃维奇·卡津别克的亲信和重要助手。\n\n然而，时代的车轮滚滚向前，欧洲的天空笼罩着战争的阴云。1939年9月1日，第二次世界大战的雷声震撼了世界。1940年初，叶利塔-维尔奇科夫斯基因间谍罪名被法国当局逮捕，但在战争的灰烬中，他获得了自由。当得知卡津别克解散了党组织后，他和许多前青年俄罗斯联盟的成员一样，加入了“战斗的法兰西人”运动。随着德国的胜利，基里尔被迫与一群美国志愿者一起逃亡。\n\n战后，这位“青年俄罗斯联盟”成员栖身于亚特兰大，偶尔与亚历山大·利沃维奇擦肩而过，然而，西俄罗斯战争的爆发彻底改变了他的人生轨迹。卡津别克力邀基里尔参与“太阳”计划——此乃中央情报局一项秘密行动，旨在将忠于美国的流亡者渗透至亲德势力弗拉基米尔三世的权力核心。不久，维尔奇科夫斯基与其昔日同党重返故土，尽管最初的渗透计划告捷，弗拉基米尔依旧心存疑虑。故此，基里尔如今必须襄助其挚友，智胜沙皇，最终将俄罗斯从叛徒之手中拯救出来。"
