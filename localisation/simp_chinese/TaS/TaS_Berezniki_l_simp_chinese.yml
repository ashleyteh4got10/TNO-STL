 berez_dobrovoltsy.11.t:0 "亚丁会议"
 berez_dobrovoltsy.11.d:0 "最后一架绘有俄罗斯旗帜与标记的飞机停在亚丁的停机坪上，最后的货物正在被装载。先前离开的飞机满载着士兵、装备、补给，以及他们在世界这个热土上所需的一切。而这最后一架飞机，将带走也门政府为感谢俄罗斯在平叛战争中提供的援助而赠与的黄金。\n\n最后的几名俄罗斯士兵正慢慢地将黄金搬运上飞机，他们挽起袖子，露出手臂，古铜色的皮肤上泛着一层细密的汗珠。这些黄金将使他们的祖国和人民受益，但这无法弥补在这场远离故土、本不该属于他们的战争中牺牲的俄罗斯人的生命。然而，这是沙皇本人下达的命令，跨越半个地球作战。\n\n当黄金快要装载完毕时，一辆轿车驶近了飞机，车上下来一位带着黑色天鹅绒包裹盒子的男子。\n\n一名随行的翻译将这名议员的话语转译给俄罗斯士兵：\n\n“他说，这是我们的苏丹陛下赠予你们沙皇谢尔盖·别洛泽斯基陛下的私人礼物。这是先知穆罕默德一位同伴的金剑。”\n\n“告诉他，俄罗斯志愿军接受这份礼物！”\n\n随后，士兵们登上了飞机，飞机起飞向北，飞回他们的祖国。"
 berez_dobrovoltsy.11.a:0 "归根结底，人类的死亡总是与金属息息相关。"
 berez_dobrovoltsy.12.t:0 "来自亚丁的电报"
 berez_dobrovoltsy.12.d:0 "清晨，外交大臣彼得·德米切夫收到一封来自阳光明媚的亚丁的电报，内容如下：\n\n“我们衷心感谢俄罗斯友人，在我们国家危难之际伸出援手。若非诸位鼎力相助，那些自诩为共和党人的恶棍（愿真主惩罚他们！）早已窃取政权，摧毁我们延续数世纪的生活方式。为此，我们向尊敬的沙皇陛下敬献一匹英姿勃发的阿拉伯骏马，并准备与贵国缔结多项贸易协定。愿真主保佑你们！”\n\n德米切夫看完电报，立即起身，带着这振奋人心的好消息走向沙皇的寝宫。"
 berez_dobrovoltsy.12.a:0 "总比没有强。"
 berez_dobrovoltsy.13.t:0 "血酬"
 berez_dobrovoltsy.13.d:0 "撤军回国的命令下达已过一日。在离开阿曼返回俄罗斯之前，将士们在首都举行了阅兵式。晒得略微黝黑的俄罗斯士兵们，以当地人看来格外专业的素养，展现了精湛的队列技艺，令阿曼苏丹印象深刻。\n\n阅兵式结束后，苏丹要求部队列队，代表阿曼授予嘉奖——指挥官被授予该国最高军事荣誉。苏丹对指挥官说了些什么，翻译将其译成俄语：\n\n“他说他无比感激你们俄罗斯人，尤其感激别洛泽尔斯基。苏丹承诺将以药品作为回报——几架满载药品的飞机即将飞往俄罗斯，作为更实在的谢礼。”\n\n“告诉他，我个人很欣慰我们的援助并非徒劳，这些药品对我们的祖国至关重要。也请向阿曼苏丹表达我个人的敬意。”\n\n翻译将这番话用阿拉伯语传达给苏丹后，苏丹与指挥官握手致意。随后，将士们登机启程，飞回俄罗斯。"
 berez_dobrovoltsy.13.a:0 "世间之事，皆有价码。"
 berez_dobrovoltsy.14.t:0 "来自马斯喀特的信笺"
 berez_dobrovoltsy.14.d:0 "“疯子”萨尼亚正焦急地等待着运输车队的到来，好将他和他的弟兄们送到最近的机场，尽快返回俄罗斯。然而，一阵马蹄声打破了等待的寂静，几名骑手翻过沙丘，出现在他们面前。\n\n萨尼亚和他的弟兄们瞬间紧张起来，但来者却是苏丹的信使。他们带来一封信，信中表明苏丹愿意与俄罗斯缔结贸易协定，以换取军事教官和武器。亚历山大郑重承诺，定会将这封信完整无缺地呈递给沙皇陛下。"
 berez_dobrovoltsy.14.a:0 "总比没有强。"
 berez_dobrovoltsy.15.t:0 "开罗之旅"
 berez_dobrovoltsy.15.d:0 "德米切夫的飞机降落在开罗机场时，他感到一丝紧张，这并非毫无缘由。多亏了俄罗斯的帮助，对异教徒毫不友善的伊斯兰原教旨主义者在此攫取了权力。驶过开罗的街道，他看到路灯杆上悬挂着的尸体，以及广场上集体处决留下的痕迹。街道上几乎看不到女性的身影，但这对她们或许反而是件好事。很快，汽车停在了意大利总督的故居前，那里已经飘扬着穆斯林兄弟会的旗帜。兄弟会领袖赛义德·库特布正在屋内等候他。\n\n起初，德米切夫对库特布心存戒备，但当房间里的武装人员离开后，谈话气氛变得缓和了一些。赛义德感谢俄罗斯对穆斯林兄弟会的支持，尽管他明白，俄罗斯人之所以帮助兄弟会，只是因为其他派别对俄罗斯来说更加糟糕。\n\n然而，这并没有影响两国之间的关系。几小时后，他们达成一致，新生的埃及将与俄罗斯缔结贸易协定，互惠互利。"
 berez_dobrovoltsy.15.a:0 "埃及是非洲之心，而我们已将其收入囊中。"
 berez_dobrovoltsy.16.t:0 "阿拉伯之旅"
 berez_dobrovoltsy.16.d:0 "当谢尔盖·别洛泽尔斯基收到来自阿拉伯半岛盟友的外交访问邀请时，顿感精神一振。毕竟，治理国家并非易事，终日伏案的政务难免令人倦怠。何况，如此来自盟友的邀请，尤其还是来自尊贵的沙特酋长们的盛情，自是不好推辞。\n\n飞行途中，沙皇饱览着这片阿拉伯半岛最富饶国度的无垠沙海和壮丽景色。历经二十世纪的艰辛，这个阿拉伯国家已然崛起，在这个动荡的时代，必将成为重要的盟友。舱门开启，滚烫的沙漠风扑面而来。明日的会谈即将开始，必将是一场艰苦的拉锯，但正如俗语所言：不劳无获。俄罗斯代表团将从利雅得启程，先后访问圣城麦地那和麦加，辗转多地进行磋商。精明的酋长们定会用尽奉承之词，试图将天平向己方倾斜，但沙皇并非等闲之辈。他会为王国和人民争取最大的利益…"
 berez_dobrovoltsy.16.a:0 "毕竟，这是他的职责所在。"
 berez_dobrovoltsy.17.t:0 "抉择的请求"
 berez_dobrovoltsy.17.d:0 "迪尔瓦在脑中过了一遍准备工作的要点，目光扫视着机场的每个细节，确保一切按计划进行。他的同胞们出色地完成了任务，将这里布置妥当，准备以最隆重的仪式迎接那些帮助他们争取独立，甚至扭转压迫局势的恩人——俄罗斯人。他瞥了一眼腕表，空中管制员的无线电传来通知，代表团的飞机即将抵达：一架小型飞机出现在地平线上，它的身影与冉冉升起的朝阳形成鲜明对比，起落架缓缓收起，平稳地降落在跑道上。接下来的流程如同演练般精准：舷梯迅速地推到机舱门口，正对着铺好的红毯，在人群的欢呼声中，俄罗斯代表团的成员走下舷梯。双方在地面上肃立，互相敬礼，奏响各自的国歌。迪尔瓦仔细观察着俄罗斯代表们那不苟言笑的表情，试图揣摩他们的心思、意图或情感，以期对接下来的谈判有所预判，但这徒劳无功。随后，他继续履行职责，引导两位代表登上等候的车队，思绪却不由自主地被好奇心占据，同时为上级因忙于管理新获得的广阔领土而无法亲自迎接致歉。车队缓缓驶去，迪尔瓦留下清理现场，心中默默祈祷着接下来的谈判一切顺利。\n\n不过短短数日，但这几天对外事部门的迪尔瓦而言却漫长得如同隔世，自从得知此事，他便一直密切关注着。在工作之余，他尽可能地收集着各种信息。此刻，迪尔瓦在家中享受着短暂的假期，翻阅着当天购买的报纸，细细研读着关于此事的决议。他的目光一行行地扫过纸页，最终，他看到了那个不可避免的结论，震惊之情溢于言表。似乎他的政府，出于某种原因，最终决定："
 berez_dobrovoltsy.17.a:0 "彻底巩固他们的独立，并将伊拉克的命运交付给他们的俄罗斯盟友。"
 berez_dobrovoltsy.17.b:0 "尝试重建一个真正自由平等的伊拉克国"
 berez_dobrovoltsy.18.t:0 "突袭：巴格达"
 berez_dobrovoltsy.18.d:0 "巴格达，一座历史名城，一座文明的摇篮。它古老的城墙见证了无数人的生老病死，他们的生活、死亡和愿望共同在这座城市留下了印记。在这纷乱的年代，巴格达注定要见证更多风云变幻，而这一切，远未结束。\n\n在伊拉克分裂势力之间灾难性的内战中，巴格达成为了争夺合法性的关键。每个派系都将其视为合法性的象征，并投入大量资源用于攻占或保卫这座城市，布设地雷、囤积军火、派遣煽动者、宣传员和特工。地雷和军火只是技术问题，而后三者对任何一方都是巨大的威胁，他们散布虚假信息，制造恐怖袭击，威胁着整个伊拉克被占领土的稳定。鉴于此威胁风险过高，行动最终得到了“伊拉克豺狼”弗拉基米尔·日里诺夫斯基的授权。\n\n“计划变更——第一和第五小组负责市中心，第三和第八小组从正门进入。第六和第十小组跟我走——其余人，按原计划路线前进。记住，他们反正都是要死的。”\n\n不得不说，日里诺夫斯基已经厌倦了对着麦克风大声喊叫，而直升机旋转的螺旋桨发出的巨大噪音更是雪上加霜，每次都盖过了他的声音。然而，在收到确认信息后，他满意地呼了口气，直升机缓缓接近着预定的降落区。他注意到其他直升机正分散开来，协助“清理”城市的其他区域——他们现在离基地很远了。\n\n直升机缓缓降落在沙地上，日里诺夫斯基和他的小组成员跳了下来，手中紧紧握着步枪。他们今天的首个目标是一名复兴党煽动者，几天前沙皇的特务发现了他的踪迹并确认了位置。在接近目标的过程中，所有队员都牢记着他的面容。确认可以进入后，日里诺夫斯基带领队员们冲了进去，搜索了底层却一无所获，随后上楼，发现一名男子绝望地瘫倒在一扇敞开的窗台后，双腿显然因为恐惧而无力支撑。尽管他声称自己毫不知情，但他的脸与记录上的照片完全吻合。很快，他就得到了解脱。\n\n日里诺夫斯基当天第二次叹气。剩下的目标不会这么容易对付，而且己方肯定也会损失不少人手。远处传来一阵枪声，他立即命令小组继续前进；他们的行踪应该已经暴露了，还有很多名字需要他们去一一核对。"
 berez_dobrovoltsy.18.a:0 "这将是一个漫长而血腥的日子。"
 berez_dobrovoltsy.19.t:0 "摩苏尔的希望"
 berez_dobrovoltsy.19.d:0 "摩苏尔，一座繁忙的都市。自从库尔德政府平息了所有敌对势力后，摩苏尔成为了伊拉克的新中心，在接下来的几个月中，这座城市的资金和访客都迎来了巨大的增长，一种全新的匆忙和繁忙感取代了伊拉克其他大城市的气息，而那些城市目前正处于无限期的重建之中。然而，即使在如此繁忙的环境中，依然有一个地方比其他地方更加引人注目。此刻，这里聚集了形形色色的记者，周围由国家和金钱所能提供的最精锐的保镖严密守卫着。名义上，这只是一家高级酒店，但现在，它却成为了决定伊拉克命运的地标，一个文明谈判的场所，它的价值和目标将被载入史册，永垂不朽。\n\n历史的参与者们逐一登场；数百万人的英雄萨达姆·侯赛因乘坐他那辆戒备森严的豪华轿车率先抵达。他发表了一场鼓舞人心的演讲，呼吁伊拉克，乃至整个中东和世界实现和平与团结。“战争的时代已经过去，我们必须竭尽所能，不让它再次出现在我们面前。”他的讲话赢得了人群的欢呼和观察员们的赞扬，他向人群致意后，走进了酒店。接下来，一些重要但相对低调的人物也陆续到场：地区代表、政府首脑、对立派系的代表以及俄罗斯调解员，他们都发表了简短的讲话并表达了敬意，但没有人的讲话能像侯赛因那样深入人心。\n\n谈判开始了。虽然外界纷纷猜测结果，但没有任何确切的消息从酒店泄露出来。有人声称谈判破裂，也有人认为还有挽回的余地。然而，当最终时刻来临，“摩苏尔宣言”震惊了所有人，无论是支持者还是反对者都为这一激动人心的事件而陷入了沉默。终于，在漫长的等待之后，人们的生活将得以重建，家庭将得以团聚，整个国家将在治愈的旗帜下团结起来。即使只是短暂的片刻，阳光似乎也更加灿烂，世界似乎也为之欢欣雀跃而静止。或许，所有逝去的生命最终都有了意义。"
 berez_dobrovoltsy.19.a:0 "萨达姆不禁潸然泪下。"
 berez_dobrovoltsy.20.t:0 "在尼罗河三角洲"
 berez_dobrovoltsy.20.d:0 "德米切夫正在苏丹访问。不久前，这里还饱受血腥内战的蹂躏。但与其他国家一样，多亏了俄罗斯志愿者的帮助，最忠于俄罗斯的一方夺取了政权。现在，他们将面临漫长的重建之路。但只要他们保持对俄罗斯的忠诚，俄罗斯必将施以援手。"
 berez_dobrovoltsy.20.a:0 "他们对我们感激涕零。"
 berez_dobrovoltsy.21.t:0 "来自喀土穆的讯息"
 berez_dobrovoltsy.21.d:0 "…电报开始…\n\n尊敬的俄罗斯帝国居民们，我们代表全体苏丹人民，对贵国在我们争取苏丹独立的斗争中提供的帮助和支持表示无限感激。\n\n我们的最高指挥官易卜拉欣·阿布德向沙皇谢尔盖一世陛下表达个人谢意。\n\n关于协议，很遗憾，我们无法同意贵方的所有要求。我们只能与贵国缔结自由贸易协定。加入贵国势力范围对我们和我们的经济来说要求过于苛刻。我们签署的协议副本将很快送达。苏丹政府谨致谢忱…\n\n电报结束"
 berez_dobrovoltsy.21.a:0 "聊胜于无。"
 berez_dobrovoltsy.22.t:0 "与南苏丹的协议"
 berez_dobrovoltsy.22.d:0 "南苏丹战争结束后，俄罗斯与新政府签署了友好和贸易协定，以及关于在首都附近部署志愿军基地和俄罗斯教官向苏丹士兵传授军事技能的协议。"
 berez_dobrovoltsy.22.a:0 "富有成效的合作就此开启。"
 berez_dobrovoltsy.23.t:0 "刚果之旅"
 berez_dobrovoltsy.23.d:0 "俄罗斯人民帝国官方备忘录\n\n殿下：\n\n欣闻刚果外交访问取得圆满成功，特此告知。由于俄罗斯的行动，我们为勇敢的刚果人民带来了和平与繁荣，他们对此无疑感激涕零。在德国的长期统治下，缺乏其他生存手段的刚果人民开始反抗纳粹政权。最终，纳粹分子亵渎了这片土地，在当地居民世代居住的地方建造了一个巨大的人工湖。这种扮演上帝的行径带来的后果是环境灾难和当地居民的反抗。\n\n但现在，在我们的帮助下，刚果人民可以开始重建家园。纳粹暴行的伤痕不会很快痊愈，但在我们的帮助下，这些人终将找到和平。"
 berez_dobrovoltsy.23.a:0 "对于自然，我们责无旁贷。"
 berez_dobrovoltsy.24.t:0 "俄罗斯-伊朗石油公司"
 berez_dobrovoltsy.24.d:0 "“这是一个极好的提议，我认为这将极大地促进我们两国的发展！”俄罗斯驻伊朗外交官彼得·德米切夫说道，“我们两国之间的合作必将带来双赢的局面，所获之利益远超于投入的成本。”\n\n伊朗外交官聚精会神地聆听着翻译人员对每一句话的转述。又思忖了片刻，伊朗外交官用波斯语说道，翻译人员立刻将其翻译成了俄语：\n\n“他问：那关于石油的垄断问题该如何处理呢？”\n\n德米切夫答道：“我们认为，在不久的将来，石油的价格将飙升到难以想象的高度，仅凭这一点，我们的公司就能够获得令人瞠目结舌的利润。此外，我们也完全有可能成为这一市场的垄断者，因为其他的国家将会对我们的石油产生严重的依赖，就像溺水之人渴望空气一般，须臾不可离。因此，这项合作将会让我们双方都获利丰厚。”\n\n伊朗外交官最终同意建立俄伊石油公司。"
 berez_dobrovoltsy.24.a:0 "我们的公司将获得超额利润！"
 berez_dobrovoltsy.25.t:0 "战争的教训"
 berez_dobrovoltsy.25.d:0 "午夜时分，西班牙志愿军队长在兵营里，对着录音机开始记录他在这个国家战争的记忆。他预先准备了十几盘磁带，将所有能用音频记录的记忆都倾注其中。\n\n在讲述西班牙发生的那些事件时，他时而陷入沉思，讲述哪些地方可能出了差错，为什么会有伤亡，或者为什么军事行动的效率有时会下降。他根据自身经验，就如何纠正俄罗斯军事理论中的错误，避免未来重蹈覆辙提出了自己的建议。\n\n队长倾诉了他所能回忆的一切：关于他如何在困境中艰难抉择——是拯救平民还是撤退到有利位置；关于他如何在三面受敌的情况下坚守阵地；关于他如何突破敌人的防线，攻入平民被用作人盾的城市，以及其他种种。最终，直到黎明破晓，他才将自己的灵魂、反思和记忆全部倾注完毕。"
 berez_dobrovoltsy.25.a:0 "这段经历对未来至关重要。"
 berez_dobrovoltsy.26.t:0 "萨拉查的机器"
 berez_dobrovoltsy.26.d:0 "停泊在阿尔汉格尔斯克的，除了OFN各国的商船之外，竟然还有悬挂葡萄牙国旗的船只。等到这些船只进港之后，真相才大白——他们运来的是我国政府出资购买的工业设备。萨拉查政权治下的葡萄牙急需资金，因此他们同意向我们出售部分工业设备，以获得资金用于国家重建。\n\n检查了装满设备的箱子后，我们得出了一个非同寻常的结论：这些机器质量上乘，但并非最先进的型号。然而，对于工厂和小型企业家来说，它们将非常实用。我们购买的这些机器将分发给国内需要它们的小型企业家。"
 berez_dobrovoltsy.26.a:0 "化剑为犁！"
 berez_dobrovoltsy_world_news.10.t:0 "[Get_newspaper_header]伊拉克内战之终"
 berez_dobrovoltsy_world_news.10.d:0 "随着和平的钟声再次缓缓敲响，笼罩在伊拉克沙地的尘埃终于开始落定，随之而来的石油危机也日渐消退。来自摩苏尔的惊人消息证实，库尔德斯坦——由在伊拉克崩溃后宣布独立的同名少数民族组成的国家——在争夺这片土地的冲突中，击败了所有更具“合法性”的对手。值得注意的是，库尔德人取得如此胜利，很大程度上归功于一个复兴的俄罗斯的大力援助，后者正意图从军阀混战的灰烬中崛起，重新投射其力量。\n\n随着前伊拉克的大片领土处于军事占领之下，这个前国家的命运悬而未决，库尔德斯坦及其俄罗斯赞助者正在闭门磋商，最终结果如何，尚待分晓。"
 berez_dobrovoltsy_world_news.10.a:0 "这无疑是中东的历史性时刻！"
 berez_dobrovoltsy_world_news.10.b:0 "这无疑是中东的历史性时刻。"
 berez_dobrovoltsy_world_news.10.c:0 "中东的历史性时刻？"
 berez_dobrovoltsy_world_news.11.t:0 "[Get_newspaper_header]伊拉克沦为俄罗斯殖民地"
 berez_dobrovoltsy_world_news.11.d:0 "摩苏尔会议传出了最令人震惊的消息：库尔德政府决定将占领的伊拉克领土拱手让给他们的俄罗斯盟友自由支配。这一消息在整个中东地区引发了负面反应，无论是革命政府还是保守政府都迅速谴责这一决定是公然帝国主义行径，并抨击库尔德政府不过是复兴的俄罗斯国家的傀儡。\n\n恰如其分地被称为“俄罗斯驻伊拉克行政当局”的俄罗斯发言人否认了这些指控，并强调俄罗斯人在帮助库尔德人摆脱伊拉克压迫的斗争中做出的牺牲。看来，这些流血牺牲不会白费：新的行政当局正在迅速巩固，军事基地正在建设，地雷也在一夜之间重新启用。虽然这一惊人发展的长期影响尚不得而知，但国际观察家一致认为，俄罗斯现在将成为中东政治中有影响力的玩家，其力量在世界范围内将更加清晰地显现。"
 berez_dobrovoltsy_world_news.11.a:0 "熊爪伸得更远了。"
 berez_dobrovoltsy_world_news.11.b:0 "熊爪伸得更远了。"
 berez_dobrovoltsy_world_news.11.c:0 "熊爪伸得更远了。"
 berez_dobrovoltsy_world_news.12.t:0 "[Get_newspaper_header]一国之重组"
 berez_dobrovoltsy_world_news.12.d:0 "随着摩苏尔宣言的发表，旷日持久的谈判终于达到高潮，幸福与自豪的合唱在空中回荡。双方共同发表胜利宣言，宣布成立伊拉克-库尔德斯坦联邦，这是一个真正意义上基于共同认同的平等联盟。根据协议，新成立的联邦将采取更加权力下放的模式，赋予库尔德地区及其人民亟需的完全自治权，同时保持伊拉克国家的整体统一。\n\n国际社会对此反应不一。俄罗斯和美国等超级大国很快向新国家发出了承认和祝贺声明。随着重建工作的开始，许多国民心中不禁燃起了希望，这种希望在很久以前就已失去。"
 berez_dobrovoltsy_world_news.12.a:0 "和平之国，永远伫立。"
 berez_dobrovoltsy_world_news.12.b:0 "和平之国，永远伫立。"
 berez_dobrovoltsy_world_news.12.c:0 "和平之国，永远伫立。"
 berez_dobrovoltsy_world_news.13.t: "[Get_newspaper_header]俄-伊石油公司"
 berez_dobrovoltsy_world_news.13.d: "一则重磅消息传来，一家新的石油公司横空出世，它有望打破意大利公司在该行业的垄断地位。这家名为“俄-伊石油公司”的企业将从事石油生产和销售，而且他们的石油价格很可能低于意大利和其他国家的石油。\n\n尽管世界各地的分析人士正试图理解这家公司的成立将对世界经济产生何种影响，但事实依然是：在谢尔盖·别洛泽尔斯基的领导下，伊朗和俄罗斯正试图在全球经济这个高度垄断的行业中占据一席之地。这不仅可能导致该领域的重大变革，还可能改变冷战的力量平衡。"
 berez_dobrovoltsy_world_news.13.a: "跟那帮意大利人没什么区别。"
 berez_dobrovoltsy_world_news.13.b: "跟那帮意大利人没什么区别。"
 berez_dobrovoltsy_world_news.13.c: "石油是我们的！"
