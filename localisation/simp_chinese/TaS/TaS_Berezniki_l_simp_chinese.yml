 MAR_initial.8.t:0 "无所畏惧"
 MAR_initial.8.d:0 "第二次世界大战的硝烟散去，苏联军队的前士兵米哈伊尔·安季平在满目疮痍的俄罗斯大地上流浪了一个月之久。战败的阴影笼罩着他，直至他在盖尼镇被一位当地的牧师收留并治愈。在这片宁静的土地上，他经历了精神的洗礼，信仰的种子在心中生根发芽，最终他创立了圣乔治骑士团。\n\n亚历山大·卡津别克步入这座乡村教堂。米哈伊尔·安季平站在小厅中央，身后是弗拉基米尔·克拉斯诺耶·索尔尼什科与怀抱婴儿的圣母像。卡津别克进门时，目光落在了这位圣乔治骑士团领袖的身上。安季平的眼神中蕴含着平静与坚定，卡津别克敢发誓，当乔尔丹诺·布鲁诺被捆绑在火刑柱上时，面对那些行刑者，眼中也一定是这样的神情。\n\n“请您祝福我。”卡津别克回想起教会的礼仪，开口说道。\n\n“愿上帝保佑你，”安季平点头示意，“你来这里有什么事？”\n\n卡津别克走近，低声说出了自己的来意。安季平静静地听着。\n\n“我需要你的支持。沙皇的权力不能仅仅依靠世俗的力量，我们需要一位精神领袖。”卡津别克说完，注视着安季平。\n\n“亚历山大，正如经上所记，‘凡父所赐给我的人，必到我这里来；到我这里来的，我总不丢弃他。’” 安季平的目光仿佛望向了苍穹，“感谢你的到来，但在我看来，你仍然是那个自立为王的弗拉基米尔的仆人。我没有理由相信你，更不能为了你的理念牺牲我教区居民的生命。”安季平直视着卡津别克的双眼，而后者也毫不退缩。\n\n“你还记得耶稣问彼得什么吗？” 卡津别克忽然开口，一丝明悟在安季平脸上浮现，“那是‘不要怕’。我想要复兴俄罗斯，我无所畏惧。我只请求你加入我的行列，与我同行。”卡津别克等待着对方的答复。\n\n“我会给你一个答复的，亚历山大。” 安季平的目光转向了右侧。\n\n“请原谅，神父，请祝福我。”卡津别克深深地鞠了一躬，转身离去。"
 MAR_initial.8.a:0 "也许这一次，安季平会听从理性的声音。"
 MAR_initial.9.t:0 "没有沙皇就是件好事。"
 MAR_initial.9.d:0 "在总督官邸的正厅，围绕着一张大桌子，座无虚席。卡津别克作为总督，同时身兼摄政王，威严地主持着会议。他坐在一张长毛绒扶手椅上，身形显得格外高大。在场的魔鬼会计师柯西金对他的摄政王身份不以为然——他正专心阅读着最新一期的《维亚特卡公报》，对其中的经济新闻不屑一顾。一位美国人在桌子上猛敲，用粗俗的语言大声讲话，还要求翻译。卡津别克皱了皱眉——他已经厌烦了他们不断的抱怨，尤其是在他们已经学会了流利的俄语后。别洛泽尔斯基面无表情地坐在那里。\n\n亚历山大·利沃维奇用手杖敲打地板，发出响亮的声音。虽然不是每个人都转过头来，但他感觉到有几双眼睛在注视着他。现在是时候开始了。\n\n“同志们！我已经六十岁了，记忆力也不是很好。请提醒我我们的座右铭。”\n\n“沙皇与苏维埃！”一位青年俄罗斯党员大声喊道。柯西金放下报纸，疑惑地看着卡津别克，似乎在问：“我们接下来要做什么？”\n\n卡津别克环顾了一圈，露出沉思的神情。\n\n“嗯，没错，是的。但目前我只看到了苏维埃。我们需要改变这一点。那么，同志们，今天我们的主要且唯一的问题是：谁将成为我们的王位继承人？”\n\n卡津别克一拍手，会场立刻变得嘈杂。人们大声喊叫，索要三明治、纸张、笔和墨水瓶，甚至要求啤酒和威士忌，还有人想去图书馆借阅《俄罗斯帝国基本法》。\n\n亚历山大·利沃维奇靠在椅子上，闭上了眼睛。他能感觉到柯西金在笑，笑容中带着某种得意。"
 MAR_initial.9.a:0 "我还以为君主制是在某种更加不同的环境下诞生的呢。"
 MAR_initial.10.t:0 "鲜血与美酒"
 MAR_initial.10.d:0 "酒瓶碰撞的清脆声响彻谢尔盖·别洛泽尔斯基的指挥部。没人知道他们究竟在庆祝什么——是为了未来任务的成功，还是仅仅因为在这个阴冷的雨天无事可做。无论如何，别列兹尼基最上乘的美酒，红色的“侍酒师之血”和白色的“鉴赏家之爱”，都如流水般倾泻而出。\n\n别洛泽尔斯基发出一声低沉的咕哝，试图站起来，但他显然已经分不清左右腿了。卡津别克，他只是出于礼貌才喝了几口，连忙扶住将军的肩膀。\n\n“我……呃……敬我们逝去的朋友和兄弟李……哈维……”\n\n“奥斯瓦尔德！”美国佬们齐声高喊，纷纷举杯相碰。\n\n“不，但这敬酒词真够气派的。我敬佩它，谢廖加，就像上帝亲口所说的一样。”拜尔利最近在一个工人宿舍住了一周，正四处寻找机会炫耀他的词汇量。别洛泽尔斯基朝他挤眉弄眼地笑了笑。\n\n“那是当然！我可是留里克的第七代旁系后裔！你知道的，就是被瓦良格人召唤来的那个。或者反过来也一样！”他醉醺醺地大喊着。\n\n卡津别克突然扬起眉毛，拉了拉将军的袖子。\n\n“抱歉，我没听清。你刚才说什么？关于留里克的？”\n\n“远房后裔，我跟你说！我甚至还有一张美国系谱学研究所还是什么的玩意儿开具的证明！”别洛泽尔斯基自豪地宣称。\n\n青年俄罗斯联盟的领袖道了歉，悄悄地离开了。"
 MAR_initial.10.a:0 "最疯狂的计划可能是最正确的。"
 MAR_three_plans_tt:0 "§Y就此事§!§Y卡津别克需要知道§!§m谢尔盖·谢尔盖耶维奇的意见§!"
 MAR_initial.11.t:0 "三种方案"
 MAR_initial.11.d:0 "在审阅了部长们的报告后，卡津别克对别列兹尼基在短时间内取得的成就感到非常满意。一切都按计划推进，为即将到来的与南方“邻居”——雅利安兄弟会的战争做好了充分准备。目前的防御战略似乎非常合理，不需要做出调整。\n\n此时，谢尔盖·谢尔盖耶维奇·别洛泽尔斯基带着一份关于南部边境防御能力的报告进入了大厅。他指出，仅依靠建立防线对抗雅利安兄弟会几乎没有优势，并以马奇诺防线作为例证，说明了单纯的防御战术的不可靠性。\n\n卡津别克听完后问道：“我们怎样才能增加胜算？”别洛泽尔斯基冷静地总结了他的观点：“我们需要制定一个全新的战略，而我将亲自确保在最短时间内完成这项任务。”亚历山大·利沃维奇迅速表示赞同。\n\n回到办公室，别洛泽尔斯基召集了高级将领和指挥官，解释了军事战略形势，并提出了制定全新战略的要求。“给你们一周时间。”谢尔盖·谢尔盖耶维奇说。\n\n一周后，将军们提出了三个不同的计划。第一个计划基于在敌军全面行动前进行一次深入的预防性打击。\n\n第二个计划更加大胆——建议让敌人入侵我们的领土，然后包围“雅利安人”的主力部队，从而取得人数上的优势，并给予敌人沉重打击。\n\n第三个计划则更为审慎。尽管别洛泽尔斯基有所要求，但制定该计划的将军认为需要采取攻防交替的策略，他们认为只有这样，我们才能迅速结束与雅利安兄弟会的战争。\n\n然而，最终的决策权仍掌握在谢尔盖·谢尔盖耶维奇·别洛泽尔斯基的手中。"
 MAR_initial.11.a:0 "采取积极进取的计划。"
