 MAR_oil_crisis_support_category_desc: "与意大利殖民帝国崩溃相关的石油危机对我们的经济造成了冲击，尽管没有其他国家那么严重。对德国、美国和日本这样的超级大国来说，这场危机可能是致命的，对某些国家来说甚至是决定性的。谁能在中东地区站稳脚跟，谁就能控制主要油田。我们的目标是介入这场冲突，支持我们需要的政权，无论它们最终是亲日还是亲美。最重要的是不要让亲德势力在该地区获胜。\n\n席卷中东各地的冲突：[MAR_OC_Iraq_string][MAR_OC_Egypt_string][MAR_OC_Sudan_string][MAR_OC_Oman_string][MAR_OC_Yemen_string]\n\n我们目前卷入的冲突 [MAR_OC_Get_Participation]\n§O如果我们将越多的资源用于支持我们所支持的派别，那冲突结束后我们就能获得越多的利益。§!"
