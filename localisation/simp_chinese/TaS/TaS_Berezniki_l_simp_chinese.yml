 MAR_Kosygin_oil_crisis_support_category_desc: "我们投入的资源越多，支持的派系就越多。我们的经济基本上是自给自足的，这就是为什么石油危机与我们擦肩而过。然而，由于意大利石油垄断的崩溃，中东地区出现了混乱，各大国都在试图让忠诚的政权上台，以免自己陷入混乱，并在冷战中控制对手。在这种情况下，我们必须向世界展示新俄罗斯的力量，展示我们作为第四个超级大国重返世界舞台。我们的责任是将自由和社会主义带到阿拉伯的沙漠和伊朗的山区。\n\n席卷中东各地的冲突：[MAR_OC_Iraq_string][MAR_OC_Egypt_string][MAR_OC_Sudan_string][MAR_OC_Oman_string][MAR_OC_Yemen_string]\n\n我们目前卷入的冲突 [MAR_OC_Get_Participation]\n§O如果我们将越多的资源用于支持我们所支持的派别，那冲突结束后我们就能获得越多的利益。§!"
