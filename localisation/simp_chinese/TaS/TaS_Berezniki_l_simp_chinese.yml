 MAR_forpol.700.t: "神秘的通讯"
 MAR_forpol.700.d: "一张桌子，一把椅子，一座时钟，一张纸，还有一台无线电台。这就是一名克格勃通信官手头所有的、同时也是最为必要的装备。根据别洛泽尔斯基的亲自指示，他必须与一位正在焦急等待他的秘密联络的秘密军队组织特工建立联系。但联络的时间必须分秒不差，若是早了15秒或者晚了15秒拨通电台，那么之前所有的努力都将付诸东流。或许是出于对自身安全的极度担忧，秘密军队组织的特工们在联络过程中表现出了令人难以置信的、甚至是病态的谨慎。但也正是因此，他们才选择了这种复杂的联络方式。然而，即便是他们的领袖拉乌尔·萨朗心里也清楚地知道，如果失去了外部力量的支持，他所领导的反抗运动将很快以失败而告终。\n\n终于，秒针走到了预定的时刻，克格勃的通信员连忙调到了约定的频率，静静地等待着。短暂的等待后，电台中的杂音突然消失了，一个浓重的法国口音响起，说出了一句乍听上去风马牛不相及的问句：\n“您要买些菊花吗？”\n“什么价？”\n“412.132法郎，建议您成双购买。”\n\n通话戛然而止，因为任务已经完成了。双方之间的联系已经建立，现在只需将“菊花”的价格乘以二，即可得到用于和萨朗政府保持联系的秘密通信频道。"
 MAR_forpol.700.a: "但别洛泽尔斯基为什么偏偏选中了他们呢？！"
 MAR_forpol.701.t: "掷地有声"
 MAR_forpol.701.d: "“是萨朗先生吗？”\n“是的，别洛泽尔斯基先生。从之前某个美国记者采访您的时候起，我就对您的声音记忆犹新。”\n“不得不承认，尤其是经历了如此大费周章的各种准备后，能这样通过无线电直接与您交谈，这感觉实在是有些奇妙。”\n“现在已经没有必要大费周章了。当时，法兰西的爱国者们还在与叛徒、蠢货和匪徒们殊死搏斗，采取一些预防措施是必要的，也是保命的关键。”\n“从里昂到波尔多，秘密军队组织对法兰西的控制已是固若金汤，不是吗？”\n“北部地区仍处于希姆莱的魔爪之中，还有那阿尔萨斯-洛林，法兰西的人民也不会忘记德国人对我们的压迫。”\n“这正是我想要和您谈的，萨朗先生。请您理解，我们之所以选择支持您，正是因为您代表着法兰西真正的爱国者。”\n“而对于每一位法兰西的爱国者来说，我们当下的使命，便是向团结协定讨回法兰西这几十年来所蒙受的耻辱。请您相信，我们将信守承诺，别洛泽尔斯基先生。”"
 MAR_forpol.701.a: "“太好了。那么，我建议我们这就来讨论一下下一步的合作计划吧。”"
 MAR_forpol.702.t: "沉默的电波"
 MAR_forpol.702.d: "别洛泽尔斯基独自一人品尝着威士忌的苦涩，还往里面兑了些茶。他试图调到正确的频率，仔细辨别着电波中的每一阵杂音和每一个电子脉冲信号，但一切都是徒劳。上一次他和萨朗通过这条秘密频道联络时，后者还信誓旦旦地向他保证，尽管前线出现了一系列“无关紧要”的失利，但“秘密军队组织”终将把法兰西从匪徒、白痴和外国走狗的手中解放出来。\n\n具有讽刺意味的是，恰恰是在萨朗说完了这番豪言壮语后，通话背景中清晰地传来了阵阵枪声和爆炸声，然后通讯就突然中断了。"
 MAR_forpol.702.a: "就这样，别洛泽尔斯基又失去了一位潜在的盟友。"
 MAR_forpol.710.t: "“无套裤汉”行动"
 MAR_forpol.710.d: "吉尔脸上那沟壑纵横的皱纹扭曲成了一团，愤怒、困惑与厌恶这三种情绪糅杂在一起，化作一种难以言表的复杂神情。他紧盯着手中的那份命令，上面有着柯西金的亲笔签名，命令中指示要向法国派遣志愿师，更准确地说，是援助那支由雅克·索瓦热领导的革命军。简直是疯了！吉尔本人也考虑过向法国派兵，但他计划支持的可是“秘密军事组织”，而不是这帮革命党。吉尔本可以向柯西金摆出一箩筐的理由和论据，但现在说什么都晚了。现在唯一重要的问题是，吉尔会否在这份命令上签字？诚然，柯西金的命令终将会得到执行，但如果没有吉尔的签字，执行的速度将会大打折扣。但这样做究竟有没有意义呢？的确，这可以体现出他对柯西金外交政策的严重不满，但这是否真的有益于俄罗斯的国家利益呢？答案是否定的。\n\n吉尔沉重地叹了口气，捡起了掉落在地板上的钢笔，在那份命令上签下了自己的名字。"
 MAR_forpol.710.a: "吉尔只能寄希望于柯西金的决策是正确的。"
 MAR_forpol.711.t: "信任的萌芽"
 MAR_forpol.711.d: "火红的太阳炙烤着吉尔的光头。尽管这一天的天气出奇的热，但吉尔仍然一身戎装，笔挺地站在那里。这一切都是值得的，因为远征波尔多的俄罗斯志愿军们今天就要凯旋而归，重返故土了。正是靠着他们的英勇奋战，俄罗斯不仅收获了一个新的盟友，更重要的是，这个盟友是一个与我们比邻而居，和第三帝国接壤的社会主义国家。这场战争的胜利毫无疑问要归功于俄罗斯强大的军事实力以及高超的外交手腕。想到这些，吉尔便感到无比欣慰。出于对柯西金的信任，吉尔成功地消除了这些日子以来一直困扰着他的种种疑虑，他感到自己肩头的重担也减轻了许多。毕竟，还有什么比在这样一段黑暗而又风云变幻的岁月中，拥有一个可以绝对信赖的可靠同志更重要的呢？看着那飘扬着象征着人民共和国的红旗，迈着整齐划一的步伐从远处走来的俄罗斯志愿军队伍，吉尔自豪地戴上了自己的军帽，庄严地敬了一个军礼。"
 MAR_forpol.711.a: "俄罗斯的英雄儿女从法兰西胜利归来了！又一次！"
 MAR_forpol.712.t: "希望的落空"
 MAR_forpol.712.d: "大雨滂沱，无情地拍打着吉尔的军帽。今天，他要出席一位在解放克莱蒙的战斗中英勇牺牲的军官的葬礼。尽管吉尔与这位军官素未谋面，但他知道他是一位英勇无畏、战功卓著的俄罗斯战士。这样的人才本应在未来的岁月中为俄罗斯做出更多贡献，但现在，由于柯西金的鲁莽决策，这位军官却只能冰冷地躺在那黑色的棺椁之中。\n\n又一桩罪孽沉重地压在了吉尔的心头。尽管他并非直接责任人，但毫无疑问，这位军官的死和他有着千丝万缕的联系。而这一切，竟然只是为了那帮法国的社会主义者？！吉尔深深地叹了口气，挺直身板，举手敬礼，目送着灵柩缓缓地被下葬到墓穴之中。"
 MAR_forpol.712.a: "这又一次让他陷入了深深的自我矛盾之中。"
 MAR_Kosygin_french_civil_war_desc:0 "维希政权终于倒台，现在各种运动都在争夺对法国的控制权。在战乱中，法国革命者决定拿起武器。很少有人相信他们会取得胜利，但在这个艰难时刻，我们必须支持绝望的革命者。"
 MAR_french_civil_war_desc:0 "维希政权终于倒台了，现在各种运动都在争夺法国的控制权。由拉乌尔·萨朗领导的精锐部队已于南部站稳脚跟，我们必须支持他们。"
