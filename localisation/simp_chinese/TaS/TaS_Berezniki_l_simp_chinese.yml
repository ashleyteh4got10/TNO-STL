 MAR_flavour_slop.1.t:0 "温情"
 MAR_flavour_slop.1.d:0 "乌拉尔的寒风吹拂着军事基地的营房。落日余晖映照着索利卡姆斯克。斯维特兰娜，这位刚刚加入别列兹尼基军队的新兵，正站在一栋建筑后面。她在等一个人。一个对她极其重要的人。然而时间流逝，太阳已缓缓沉入地平线。难道是被骗了？难道她不会来了吗？思绪在她脑中翻腾，指甲深深掐入掌心…她摸出一根烟，打火机咔哒一声点燃。就在这时，有东西轻轻碰了她的肩膀。\n\n“你妈妈没教过你抽烟不好吗？”一个高挑的成年女子身影，比斯维塔的轮廓高出一截。“哎呀呀，我还以为你是个好姑娘呢。”那张通常带着倦容、轮廓分明的脸庞，此刻却漾着关切的笑意。如同母亲般，充满温柔。\n\n“叶娃…”斯维塔自己都没意识到，便已投入了对方的怀抱。女人的手轻柔地抚过她新剪的短发。\n\n“我明白。别怕，我不会丢下你的。”"
 MAR_flavour_slop.1.a:0 "永不离开"
 MAR_flavour_slop.2.t:0 "酒吧轶事"
 MAR_flavour_slop.2.d:0 "“我说，阿丹，有件事我一直搞不懂。你看上去……嗯，挺正常的爷们儿，怎么就一直没个女人呢？你知道他们怎么说来着？三十之前嫌你小，三十之后嫌你老。嘿嘿。”\n\n“彼得罗维奇，你这话是打哪儿听来的？”\n\n“就我们那小屋里收音机开着呗。我就顺便听了一耳朵，好像是什么节目。胡扯淡，你说是不是？”\n\n“嗯，只要不是你说的就行。不然我早宰了你了。”\n\n“行了你，阿丹，可真有你的。哈！哈！哈！说你会杀人？打死我都不信。”老头抓住小伙的肩膀，轻轻推了一下。\n\n“算了，我出去了，该回去睡觉了。”\n\n“行，那你路上…可别犯浑啊。”\n\n“放心吧，没事儿。我好着呢。”\n\n“不过话说回来，这集体农庄的伏特加…味儿真不咋地…”"
 MAR_flavour_slop.2.a:0 "就这么坐了会儿。"
 MAR_flavour_slop.3.t:0 "追忆"
 MAR_flavour_slop.3.d:0 "“行行好吧，善良的人们！”一个白发男人的洪亮声音在街上回荡。“可怜可怜我这个西俄战争的老兵吧，求求你们了！”他凄惨地，几乎是哀号般地乞求着帮助。然而，丹尼斯此刻却没什么好心情。\n\n“嚷嚷什么呢，老头？”\n\n“给点吃的吧。我是西俄战争的老兵。国家不管，也许老百姓能…”\n\n“你是老兵？怎么看着不像呢。”\n\n“去你的！那时候我们都快打到克里姆林宫了！我现在都还记得清清楚楚，已经能看见塔楼了。可后来我们师被打垮了，我就一路败退到了瑟克特夫卡尔，然后就留在这儿了。”\n\n“哦，是这么回事…那你倒是说说，那场战争是哪一年的事？”\n\n“是…一千…九百…记不清了。”\n\n“记不清就给老子滚蛋！还想拿战争当幌子，你想得美！”\n\n“现在的年轻人啊！一点感激之心都没有，什么都没有！”\n\n“唉，老头，给你一卢布。去喝点醒醒酒，或者干点啥，我不管。然后爱去哪去哪。就是别在这儿…整这些没用的。”\n\n“好吧，上帝保佑你。”"
 MAR_flavour_slop.3.a:0 "这就算聊过了。"
 MAR_flavour_slop.4.t:0 "叩门声"
 MAR_flavour_slop.4.d:0 "咚—咚—咚，咚—咚—咚。执拗的敲门声已经持续了十几分钟。公寓的主人，玛丽亚·伊戈列夫娜，这才刚披上晨褛，走向门口。“来了！来了！”她不耐烦的声音在略显空旷的公寓里回荡。当她打开门时，面前站着的是她的邻居。丹尼斯·萨佐诺夫，一个壮实的工厂工人，有时会贪杯，但总的来说是个老实（而且重要的是，很安静）的人。从未听说过他喝醉了会闹事。\n\n“我的老天爷！丹尼斯，你别吓人行吗？大白天的你闯来干什么？”\n\n“勺子…把勺子还我。”\n\n“你又喝多了是不是？我该还你什么勺子？”\n\n“银的，我妈留下的。我记得几天前你帮我打扫过屋子，你把它们弄哪儿去了？”\n\n“我没拿你任何勺子！快去醒醒酒吧，你个蠢货。”\n\n但丹尼斯不依不饶。当公寓主人试图关上门时，他用胳膊肘挡住，蛮横地闯了进来。随之而来的是一阵短暂的扭打，女人摔倒在地，头撞在了门框上。血猛地涌上丹尼斯的脑袋。不，不，不会这样的…话语不由自主地脱口而出："
 MAR_flavour_slop.4.a:0 "操，我把她脑袋砸破了。"
