 TaS_Post2WRW_PUS_under_winners_banner:0 "在胜利的旗帜之下"
 TaS_Post2WRW_PUS_under_winners_banner_desc:0 "圣乔治是我们骑士团的名字由来，他是战士们的守护神。骑士团成员曾多次帮助俄军作战，但即使和平来临，我们也不能放下手中的剑。纳粹游击队员、革命者和其他捣乱分子沉睡不醒，眼看着我们在普鲁士的力量就要被摧毁。因此，每个修道士都必须随时准备拿起武器，打败那些侵犯上帝领地的人。"
