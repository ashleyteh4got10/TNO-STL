 POSTWRW2_Otto_Smidt_DESC:0 "施密特从未想过自己会成为一位国家领导人，从未想过。他是一位成功的科学家，一生硕果累累：探索北极、丈量帕米尔高原……这位集数学家、物理学家、地理学家于一身的学者，仿佛尝试了人生所有的可能。\n\n然而，战争的阴云还是笼罩了他。当德国的铁蹄踏破家园，施密特毅然拿起步枪，却不幸身负重伤，被撤离到乌拉尔山脉之外。此后，等待他的是颠沛流离的苦难岁月。直到青年俄罗斯联盟掌权，他才得以重拾往日的研究，生活也逐渐步入正轨。\n\n德国覆灭后，他向帝国政府递交了一份重建普鲁士的计划，并得到了欣然接受。这片德意志统一的摇篮，如今将成为复兴的俄罗斯王国的一部分。尽管每每想到德国的命运，施密特的心中仍会隐隐作痛，尽管自觉年事已高、力不从心，但这位老学者依然将目光投向了未来。"
