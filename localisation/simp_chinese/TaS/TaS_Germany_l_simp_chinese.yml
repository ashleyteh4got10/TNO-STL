 TaS_Post2WRW_werewolf_activity:0 "“狼人”活动"
 TaS_Post2WRW_werewolf_activity_desc:0 "尽管已经战胜了纳粹九头蛇，但仍有可怜的残余分子自称“狼人”四处活动。我们必须解决这个问题，否则不可能建立和平生活。"
 TaS_Post2WRW_commie_activity:0 "斯巴达克斯派活动"
 TaS_Post2WRW_commie_activity_desc:0 "令人惊讶的是，德国共产主义运动的残余不仅能够在纳粹党40年的统治和最严厉的镇压中幸存下来，而且还能在第二次西俄战争中幸存下来，现在他们又抬起头来了。"
 TaS_Post2WRW_fast_denazification:0 "加速去纳粹化"
 TaS_Post2WRW_fast_denazification_desc:0 "我们将无处不追捕那些罪犯。飞机场、街道，乃至厕所里——无论他们躲到哪里，我们定将揪出他们。这个问题，终将彻底解决。"
 TaS_Post2WRW_avg_denazification:0 "平均去纳粹化"
 TaS_Post2WRW_avg_denazification_desc:0 "对于纳粹犯下的所有罪行，俄罗斯的唯一回应就是直接消灭纳粹。这是世界上公认的。这是德国公民和俄罗斯占领军都在等待的。"
 TaS_Post2WRW_slow_denazification:0 "缓慢的去纳粹化"
 TaS_Post2WRW_slow_denazification_desc:0 "由于前纳粹分子与商业的联系以及新成立的当局的腐败，该地区的去纳粹化变得非常复杂。"
