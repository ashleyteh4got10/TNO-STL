 TaS_Post2WRW_GWS_volkswagen:0 "大众汽车"
 TaS_Post2WRW_GWS_volkswagen_desc: "纳粹主义在德国这具躯体上留下了难以磨灭的伤痕，而其存在的印记，便是四大巨头公司：法本公司、戴姆勒-奔驰公司、西门子公司以及赫尔曼·戈林国家工厂。在帝国惯用的一系列操控和造假手段之后，费迪南德·保时捷那家名不见经传的小公司，最终被纳入了赫尔曼·戈林国家工厂的麾下。直到帝国的覆灭，才终于将这些汽车工厂，从腐朽臃肿的纳粹巨兽手中彻底解放出来。如今，大众汽车公司，已然成为全新德国的象征，一个自由德国的全新企业，以及威斯特法伦面向世界的全新面孔。"
 TaS_Post2WRW_GWS_german_democracy:0 "德式民主"
 TaS_Post2WRW_GWS_german_democracy_desc:0 "德国民主的历史充满了坎坷与辛酸。当拿破仑的军队将法国大革命的思想带到这片土地时，民主的种子便悄然播撒在了日耳曼的土地上，并在1848年革命的混乱中萌芽。然而，在普鲁士专制统治的阴影下，这株幼苗很快便枯萎凋零。魏玛共和国的建立，似乎为民主的重生带来了希望，但这希望却太过短暂，最终被柏林的钢铁洪流无情碾碎。阿道夫·希特勒用暴力和谎言，将自由德国的梦想封进了混凝土之中。但，想要彻底扼杀一棵充满生机的树木，又岂是那么容易？纳粹垮台了，如今的威斯特法伦，由“三大支柱”——去纳粹化、民主化、非军事化——所统治。它是德国如今唯一一个正常运转的民主政体，其利弊自然都不可避免。"
 POSTWRW2_Waldemar_Schmidt_DESC:0 "命运有时会给人第二次机会，尽管这机会未必会以你期望的方式出现——瓦尔德马·施密特对此深有体会。在他有意识的人生中，他一直认为自己是一个共产主义者。作为列宁学校一名勤奋好学的学生，他亲眼目睹了苏联的崛起，也见证了它的轰然倒塌。\n\n回到祖国后，他毫不犹豫地加入了反法西斯运动，却不幸在勃兰登堡被捕入狱，直到20世纪50年代才重获自由。党卫军的哗变给了他逃生的机会，他加入了红军，尽管他的观点并不总是与主流观点一致，但至少，比起纳粹，红军依然代表着希望和正义。当俄国人的军队开进德国时，瓦尔德马意识到，属于他的机会终于来了。他联合红军士兵和反法西斯义士，成功控制了汉诺威，并与帝国政府取得了联系。虽然他的行动在一定程度上受到了限制，但他依然充满斗志，势必要让那些纳粹分子血债血偿。"
