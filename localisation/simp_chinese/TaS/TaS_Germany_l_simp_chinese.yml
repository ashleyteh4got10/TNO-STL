 TaS_Post2WRW_GBW_dumb_king:0 "不称职的国王"
 TaS_Post2WRW_GBW_dumb_king_desc:0 "“马克西米利安国王万岁！” 这句口号或许时常回荡在古老的宫殿和奢华的宴会厅里，却从未在寻常百姓的住宅区和贫民窟中激起任何波澜。事实上，每个人都憎恨马克西米利安：趋炎附势者厌恶他的平庸，君主主义者鄙夷他的软弱，而人民群众则憎恶他的冷漠。也许，这一切都是他咎由自取：他统治的从来都只是他的一亩三分地，而非这个国家。至少，他还是王位的合法继承人。"
 TaS_Post2WRW_GBW_baden_wine:0 "巴登酒庄"
 TaS_Post2WRW_GBW_baden_wine_desc:0 "巴登经济……最近进行了重组。殿下从国库取出钱，决心致力“经济发展”。在他看来，想要经济发展就意味着补贴他最喜欢的生意——葡萄种植与酿酒。如此补贴竟结出了成果，恢复了这个战后王国的经济。"
 POSTWRW2_Maximilian_Andreas_Friedrich_Gustav_Ernst_August_Bernhard_DESC:0 "生活总是充满了戏剧性，这一点，马克西米利安体会得尤为深刻。他这辈子从未对政治、战争之类的东西表现出丝毫兴趣。相比之下，他更沉迷于自己的酒庄和花园。他从没把自己的高贵血统当回事，只觉得这不过是一个有趣的事实罢了。然而，他错了。俄国人的军队突然到来，并“邀请”马克西米利安成为巴登的国王——当然，“统治”这个词对现在的他来说，或许太过沉重了些。但那又有什么关系呢？只要有大臣和将军们替他管理国家，他依然可以随心所欲地过着自己想要的生活，这便足够了。国家命运、财政预算以及其他复杂的事务，远不及他的酒庄重要。"
