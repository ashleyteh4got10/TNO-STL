 TaS_Post2WRW_GRA_workers_and_peasant_army_desc:0 "我们是德意志红军派，我们已经在黑暗中与阴险的纳粹主义邪恶作斗争了几十年，决战的时刻已经到来！这是我们最后也是决定性的战斗！"
