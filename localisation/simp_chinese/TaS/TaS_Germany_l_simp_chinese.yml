 TaS_Post2WRW_GNR_ulaf_v:0 "人民之王乌拉夫五世"
 TaS_Post2WRW_GNR_ulaf_v_desc:0 "乌拉夫五世国王陛下是国民的宠儿，他无疑是我们政权的一根支柱，帮助我们赢得了王国臣民的心。"
 POSTWRW2_Finn_Gustavsen_DESC:0 "在20世纪初，芬恩·古斯塔夫森是社会主义政党中一位并不引人注目的领袖。他出生于中产阶级的温馨家庭，并致力于组建一个崭新的组织。然而，随着德国人的入侵，他的所有努力似乎都化为了泡影。\n\n但芬恩并未因此消沉。他毅然决定转投自己钟爱的新闻事业，放弃了从政的道路。尽管他的报道频频受到当局的严格审查，甚至数度因其社会主义立场和拥护君主制的观点而身陷险境，被誉为“人民的记者”的他却从未退缩。在某段时期，他更是对青年俄罗斯党的独特意识形态产生了浓厚兴趣，将其视为神圣不可侵犯。尽管如此，凭借着坚韧不拔的精神，他总能一次次化险为夷，继续为理想而战。\n\n随着纳粹德国的逐渐瓦解，挪威人民终于感受到了久违的自由之风。俄罗斯军队并不会在此久留，这为芬恩提供了一个掌握国家权力的契机。此刻，他怀揣着坚定的信念，立志要将挪威塑造成一个真正公平的国家，让每个人都能够平等地生活，享受到如同国王般的待遇。幸运的是，国王奥拉夫五世对于国家当前的进步方向并无意见。"
