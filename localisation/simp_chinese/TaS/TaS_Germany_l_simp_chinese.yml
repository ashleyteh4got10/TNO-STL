 GER_Alfred_Dregger:0 "阿尔弗雷德·德雷格"
 GER_Alfred_Dregger_DESC:0 "自从阿尔弗雷德·德雷格脱下军装的那一刻起，他就彻底抛弃了那些长期以来通过洗脑式的灌输而深深烙印在他思想深处的信条。“生存空间”、“雅利安种族”、“元首”——这些词汇对他而言已经毫无意义。德雷格不屑于将那面早已跌落尘埃、沾满血污的万字旗重新拾起，更不会让那头东方巨兽再度肆虐德意志的国土。阿尔弗雷德决定尽自己的努力，并团结其他有志之士，共同构建一个真正符合普通德国民众利益的崭新体制。在这个体制中，经济将不再受制于那些巨型企业的操控，政治将不再受到党内奸佞的把持，而秩序警察、党卫军、盖世太保以及诸如此类的暴力机器也将永远成为历史。\n\n并非孤军奋战的德雷格正走在他通往梦想的康庄大道上。除了那些与他志同道合的挚友，德意志的全体民众也都紧紧跟随着他，因为他们才是这场几十年来第一次真正公平公正的选举中的决定性力量。德雷格坚信，他的胜利绝非侥幸或是欺骗，为了证明这一点，他可以付出任何代价，无论需要付出多少心血和时间。"
