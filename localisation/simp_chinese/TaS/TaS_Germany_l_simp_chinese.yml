 TaS_GERCollapse.15.t:0 "投票或出局！"
 TaS_GERCollapse.15.d:0 "半个世纪以来，德国首次举行了自由民主的选举。甚至一度颇受欢迎的社会民主党候选人也被允许参选，但事情远非这么简单…\n\n在竞选活动中，人们注意到一些来自东欧的共产党鼓动者。他们的政治纲领虽然仅比社会民主党略左，但他们的标志…在时隔多年后，镰刀和锤子的标志再次出现在德国的街道上，这景象实在是令人感到怪异和不适。尤其是对纳粹党的成员而言，毕竟，共产党人与社民党一旦联手，很可能会在新一届的德意志议会中占据相当大的席位。\n\n后来，《人民观察家报》等一些报纸收到了指示，“要动用一切可用资源帮助纳粹党”。似乎，真正的民主已然在德国降临，那种甚至连西方国家都未曾体验过的、完美的民主。\n\n然而，面对来势汹汹的政治宣传，“四人帮”决定以“肃清纳粹余毒”为借口，禁止纳粹党参与此次大选。\n\n而这一举动也直接导致此次大选的投票率低得可怜——仅有34%的选民参与了投票。\n\n不过，这并没有妨碍选举结果的出炉，新一任德国总理最终花落…"
 TaS_GERCollapse.15.b:0 "基督教民主联盟候选人：阿尔弗雷德·德雷格"
 TaS_GERCollapse.15.a:0 "社会民主党候选人：汉斯-约亨·福格尔"
 GER_Hans_Jochen_Vogel:0 "汉斯-约亨·福格尔"
 GER_Hans_Jochen_Vogel_DESC:0 "在第二次世界大战期间，汉斯-约亨·福格尔应征入伍，作为一名军校学员加入了国防军。他尽职尽责，并屡立战功。当美军的原子弹无情地摧毁夏威夷的消息传来时，他已官至希特勒青年团突击队大队长。尽管他还可以继续扮演那些“自由”的德意志人民的“狱卒”的角色，但他没有，反而成为了那些“自由”的德意志人民暗中的领袖之一。\n\n在进入大学深造并潜心攻读法学后，福格尔得出了一个令人不寒而栗的结论：阿道夫·希特勒大权独揽，将党卫军和纳粹党当作他豢养的恶犬，对任何敢于反抗他的人格杀勿论。然而，随着这位“主人”不可避免地走向了生命终点，这些“恶犬”也开始互相撕咬。而这场持续了十年之久的“狗咬狗”闹剧，最终以国防军在与昔日混乱不堪的俄罗斯人的战斗中惨败而告终。\n\n对纳粹统治彻底失望的德意志选择了一条截然不同的道路。德意志选择了福格尔。尽管新当选的总统接手的是一个满目疮痍的国家，但他坚信，德意志很快就能走上真正属于社会民主的光明大道。而为了实现这一目标，福格尔将不惜一切代价，哪怕是与魔鬼做交易也在所不辞。"
 GER_progressivism_elections:0 "德意志社会民主党"
