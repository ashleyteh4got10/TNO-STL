 POSTWRW2_Knud_of_denmark_DESC:0 "活在父亲的光环之下，注定要承受世人的比较，甚至成为众矢之的，这对克努兹来说是难以言喻的痛苦。\n\n二战结束后，克里斯蒂安一度被视为冰岛的国王，当然，这只是在美军登陆之前。后来，他彻底沦为一个无名小卒。而今，随着德国的覆灭，命运似乎再次眷顾了他们父子，回家的机会出现了，克里斯蒂安决定抓住这次机会——毕竟，情况还能更糟吗？\n\n从某种角度来说，情况确实没有更糟，至少，国王回到了故土。然而，等待他的并非热烈的欢迎。但只要弗雷德里克的支持还在，来自莫斯科的支持还在，他就没有必要杞人忧天。也许，民众的态度终有一天会改变。"
 POSTWRW2_Anker_Jorgensen_DESC:0 "与其他欧洲国家不同，丹麦的苦难或许要少一些。然而，德国人看似温和的占领，却彻底剥夺了丹麦独立的政治权力。丹麦逐渐沦为德国的附庸，而纳粹政权在民众间散布的恐怖氛围，则成为压垮丹麦人的最后一根稻草。\n\n安克·约根森是个在艰苦环境中长大的孤儿，和千千万万丹麦人一样，义无反顾地加入了抵抗运动。凭借着社会民主主义的信仰以及为民众奔走的决心，他赢得了工人和知识分子阶层的广泛支持，成为地下丹麦社会民主党领袖的不二人选。\n\n第二次西俄战争结束后，安克·约根森成为了丹麦首相。百废待兴，千疮百孔，他必须带领丹麦走出过去几十年依附德国所造成的经济困境，这是一条充满荆棘的道路。但无论如何，在安克·约根森的领导下，丹麦终于可以安心地睡个好觉了。"
