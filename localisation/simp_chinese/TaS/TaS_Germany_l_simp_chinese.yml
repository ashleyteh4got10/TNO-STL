 TaS_Post2WRW_GSU_victory_or_death:0 "胜利或死亡！"
 TaS_Post2WRW_GSU_victory_or_death_desc:0 "波希米亚、摩拉维亚、苏台德，这些原本都是我们美丽的家园，直到俄国人到来之前，一切都结束了。他们扶持捷克极端民族主义者建立了傀儡政府，而那些被复仇的怒火蒙蔽双眼的疯子，正打着清算“罪行”的旗号，对我们德国人施加着毫无理智的抢劫、掠夺和杀戮。老人、妇女、儿童，无一幸免。而捷克人却将这一切视为“最终正义的伸张”。"
 POSTWRW2_Knispel_DESC:0 "库特·克尼什佩尔的人生充满了传奇色彩。这位被称为“希特勒的坦克王牌”的军人，却对自己的头衔感到些许羞愧。作为一名被宣传机器塑造出来的战争英雄，他出现在各种战争电影中，接受采访，甚至撰写书籍。\n\n但他的内心始终无法平静，他不断地问自己：是否真的配得上这样的称号？是否真的应该为此感到自豪？当然，只要德国依然需要他，只要苏台德地区的庄园和成群的奴隶依然能麻痹他的内心，他就可以不去想这些问题，过着醉生梦死的生活。\n\n然而，有些事情，他再也无法忍受了。帝国崩溃后，苏台德的土地被割让给了疯狂的捷克人。大规模的驱逐和屠杀开始了，昔日的家园沦为人间炼狱，而整个西德，也淹没在复仇的烈焰之中。更可怕的是，俄罗斯驻军也失去了对这片土地的控制……\n\n也许他从未想过要成为英雄，但命运将他推到了这个位置上。为了他自己，为了那些追随他的人，为了德意志，他必须站出来。"
