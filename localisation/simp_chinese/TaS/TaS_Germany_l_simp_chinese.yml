 GER_ultimate_victory:0 "最终的胜利"
 GER_battle_of_civilizations_desc:0 "浩劫已无可避免：曾经四分五裂的民族如今再次团结起来，为了同一个目标而凝聚成一个强大的国家。如今，这股不可阻挡的力量正挟裹着复仇的怒火，滚滚向西而来。\n\n当年，民族社会主义学说凭借其雷霆万钧之力，将那摇摇欲坠的、鼓吹着早已过时的荒谬理论的“布尔什维克伪乌托邦”彻底摧毁。现在，一场将决定人类未来命运的战争已迫在眉睫：要么在这头来自东方的怪兽面前彻底失败，世界将因此陷入万劫不复的深渊；要么大日耳曼国将重新确立其在欧洲的统治地位，将那些忘恩负义的敌人彻底赶回东方；德意志将巩固自己的边疆，并再次向世人证明，民族社会主义是唯一能够拯救人类于水火之中的伟大思想。但是，这场考验将会验证一个唯一的、不容置疑的真理。至于它究竟是什么，这取决于德意志人民的选择，为了保卫自己的家园，他们已经做好了战斗的准备…"
 GER_their_bestial_nature_desc:0 "几十年前，大日耳曼国以摧枯拉朽之势粉碎了苏维埃联盟，也让全世界认清了生活在这片土地上那些“生物”的丑恶嘴脸。那些本就低劣的、骨子里只剩下了对雅利安血统的仇恨与毁灭的“劣等生物”们，对我们犯下了罄竹难书的罪行。每一个体内流淌着高贵血液的雅利安人都对这些“劣等生物”充满了本能的厌恶。但是，那场胜利早已是过眼云烟。现在，一场新的灾难又迫在眉睫，那些“劣等生物”自诩为天选之子，认为属于他们的时代到来了。为了回应这种威胁，我们将启动一场规模空前的宣传运动：向每一位雅利安人揭露这些“俄罗斯公民”的真面目，他们是比人类更为低劣的、在文明的进程中堕落成了非人的邪恶造物。"
 GER_collosus_with_feet_of_clay_desc:0 "内忧外患的俄罗斯试图通过虚张声势的武力展示来掩盖其虚弱的本质，试图重拾昔日大国荣光。然而，如今的俄罗斯早已不复往日荣光，外强中干，色厉内荏，像一个危在旦夕的病人，随便一阵微风就能将其彻底摧毁。俄罗斯在外交和内政上所面临的种种危机和困境清晰可见。虽然他们的那些所谓的“盟友”们会提供给他们一些诸如武器装备之类的“援助”，但这些援助一旦面临真正的考验，就会变得如同海市蜃楼一般虚无缥缈。但是，目前我们更应担忧的还是国内局势——这个国家正走在一个由寻求独立的各民族、形形色色的反对势力以及仍对德意志忠心耿耿的人士共同组成的钢丝绳上，稍有不慎，就会坠入万丈深渊之中。我们必须将他们的这些弱点化为我们的优势，向他们展示：如今的俄罗斯已经成了一具空壳，根本就无法支撑其那摇摇欲坠的大国梦。"
 GER_for_our_existence_desc:0 "每一次胜利都伴随着无可避免的牺牲；只有意志坚定的领导者才能背负着这些沉重的包袱，指引着人民走向最终的胜利。我们伟大的国家，在经历了一系列的牺牲后，终于能够开始改写世界的秩序了。但此时此刻，一个前所未有的威胁已经出现——一场大战正在逼近。\n\n是时候向全国发布总动员令了，我们必须号召人民，让他们做好迎接挑战的准备。所有资源必须无条件地服务于祖国的防务事业。我们必须在全体公民中重新唤醒那源于战争的、不屈不挠的牺牲精神。“一切为了胜利，不惜一切代价！”这应成为全体人民所必须牢记的坚定信念，我们必须矢志不渝地遵循这一原则，直至取得最终的胜利。"
 GER_arbeit_macht_frei_desc:0 "当下的这场战争已经清晰地表明：在严峻的考验下，欧洲各国的工业生产力都已难以维系。这也迫使我们做出一个艰难而又痛苦的抉择——我们必须彻底转向战时经济体制。每个公民，不论老幼，都必须为国家贡献出自己的一份力量：他们手中的工具将成为他们保家卫国的武器。工厂必须夜以继日地运转，为前线提供源源不断的战争物资。\n\n工作时间将会无休止地延长，要求也将不断提高，工作的节奏也将变得无比紧张。但这一切绝非徒劳，因为这是一项崇高的使命。每个人的工作负担都会越来越重，留给休息的时间则会越来越少，但这也是我们不得不付出的代价。在这场战争中，我们所付出的每一步都具有着重大的意义，因为我们的胜利离不开雅利安精神——这比任何战利品都来得宝贵。每一滴汗水，以及每一次的加班都将成为铸就帝国伟大复兴的基石。而胜利，将会是这些坚定不移的信念最为无可辩驳的注脚，是那些为了理想而英勇无畏的雅利安战士们最为无上的功勋章。"
 GER_european_brotherhood_desc:0 "曾经，欧洲各国都找到了自己的定位，纷纷从“自由”与“平等”这些虚幻的口号中觉醒，拥抱自己那与生俱来的优秀民族特质。在彻底清除了那些对神圣的大日耳曼国构成威胁的劣等民族后，欧洲大陆最终实现了空前的团结，全欧洲人民都重新寻回了那颗久违的赤子之心。\n\n回首过去，不难发现：当年纳粹的所作所为无疑是极具远见的。如今，我们面临的危机甚至比当年更甚，过去我们为了追求伟大所征服的一切都有可能付之东流。然而，命运女神仍眷顾着我们：曾经势不两立的对手们如今已经放下了昔日的仇恨，为了保卫欧洲大陆的文明之光而并肩战斗。是时候举起手中的武器了。来自不同国度，但有着相同目标的战士们将再度并肩作战。全欧洲都能听到那激昂的号角声——我们将一如既往地击败那来自东方的邪恶势力，将欧洲人民不屈的精神传遍世界的每一个角落。"
 GER_united_in_blood_desc:0 "战争是铸造英雄的熔炉，无论这些士兵有着怎样的过往，在这生与死的考验中，他们的血与火交融在一起，成为了生死与共的兄弟。混乱与残酷的战争将这些原本籍籍无名的战士们锤炼成了一股锐不可当的强大力量，他们做好了为了自己的理想国而奋勇杀敌，甚至不惜牺牲自己生命的准备。他们互相支持，携手共进，在彼此的眼中看到了自己理想的倒影。\n\n德意志的战士是光荣与伟大的化身，他们坚定不移的信念便是自己种族的光荣与延续。他们之间的团结，不仅仅是一种象征；更是德意志民族的灵魂，激励着战士们即便在面对再强大的敌人，也绝不会畏缩。在共同的事业中，每一个战士都是一块坚固的基石，支撑起了这宏伟的帝国大厦。正是在这紧密的团结之中——才蕴藏着战无不胜的强大力量：面对任何挑战，他们都将并肩作战，所向披靡。他们之间的团结也象征着，无论命运女神向他们降下何种苦难，未来的一代又一代都必将继承这一坚韧的意志，将胜利的光辉洒向全世界。"
 GER_gott_mit_uns_desc:0 "德国人民是上帝的选民，他赋予了我们一项神圣的使命。我们不仅拥有着无与伦比的强健体魄，还拥有着他人望尘莫及的精神力量，我们必将以坚如磐石的信念来克服未来的种种挑战。对于生活在这个时代的每个人来说，这一信念已然成为了他们的精神支柱；这种信念不仅塑造了他们的内心世界，也决定了他们在现实世界中的一举一动。\n\n在这坚如磐石的信念之下，一个理所应当的问题浮出水面：我们究竟应该如何将这一宝贵的精神财富运用到国家建设中去呢？我们必须让每一个公民都明白，他们在保卫祖国时所采取的行动，不仅会被他们身边的战友所铭记，更会在九天之上受到上帝的注视。他们此刻的所作所为不仅决定了他们当下的命运，也将在上帝面前接受最终的审判。上帝的身影与雅利安战士们如影随形，并赋予了后者无穷无尽的勇气。对于神选之民的强烈归属感，就像一面无形的盾牌一样，时刻保护着每一个雅利安战士，让他们免受困惑与迷茫的侵蚀，在面对命运的审判时，将恐惧彻底转化为战无不胜的信念。"
 GER_subjugate_the_zeitgeist_desc:0 "舆论宣传工作一直未能尽善尽美；尽管如此，在正确引导舆论上他们仍然花费了巨大的精力。仅仅着眼于当下的那些鸡毛蒜皮的小事，我们的那些宣传家们却忽略了那个蕴藏着无穷宝藏的、最重要的阵地——历史。而我们却可以从中获得能够彻底改变民众对于民族意识的认知的启示。\n\n历史本身就是一个蕴藏着无尽智慧的宝库，它将向我们揭示德意志民族那伟大的一面。尽管它曾经击败过一个又一个无比强大的敌人，但如今，我们可以利用浩如烟海的史料，来构建我们理想中的国度。当然，我们必须从档案中剔除那些会对我们造成负面影响的记载——将一切的失败从民众的记忆中抹去，只留下那些令人热血沸腾的辉煌胜利。将历史化为我们手中的武器，来强化民众心中的那些固有观念：让他们沉浸于那些为了正义与自由而奋起反抗压迫者的英雄故事中去吧。这样一来，我们必将战无不胜。"
 GER_european_volunteers_desc:0 "在与俄罗斯旷日持久的冲突中，我们绝非孤军奋战。从欧洲的各个角落，都涌现出了无数志愿加入我们，同我们并肩作战的战士们。他们的这一举动不仅仅代表了对我们的支持：更是他们为了心中的崇高理想而奋战的决心！是时候在战场上为那些欧洲志愿兵们提供用武之地了——我们将组建全新的作战单位，在战场上，他们既可以是坚不可摧的盾牌，也可以是刺向敌人的利刃。当然，这离不开他们的决心与意志，只有坚定不移的信念才能帮助他们击败我们共同的敌人；同时，我们也绝不能满足于仅仅依靠现有的力量。\n\n我们必须向外界继续寻求帮助——吸纳更多与我们志同道合的国家。有了他们的支持，我们的胜利将指日可待。只有团结一心，我们才能成为不可战胜的力量；只有并肩作战，我们才能无惧任何挑战，最终击败我们的敌人！我们要让每一位盟友都坚信：我们的终极目标，是为了欧洲的未来，为了胜利，为了荣耀，以及团结。"
 GER_blood_for_the_machine_desc:0 "当英雄的战士们在前线浴血奋战时，后方的劳动人民也在夜以继日地辛勤工作，为前线将士提供强有力的物质保障——从军用装备到军需品。但仅凭他们的努力仍然难以满足这场规模空前的战争的庞大需求。我们必须动员更多的人力资源，开足马力生产，以确保前线将士能获得源源不断的物资补给，绝不能有任何闪失。\n\n而这项任务则应交给生活在德意志各个专员辖区的人民来完成——我们承诺他们会通过自己的辛勤劳动来过上更好的生活，他们所能做的贡献是无限的，这对于他们来说将是一个改变自己命运的宝贵机会。但是我们所承诺的一切都是些诱人的空中楼阁罢了。因此，必须为他们设置那些所谓的公平条款，不仅要向他们承诺将会给予他们梦寐以求的自由，同时，我们也要对他们实施精神控制，要让他们坚信，加入我们是唯一能让他们生存下去的方法。虚假的承诺能将他们的所有力量都压榨出来，成为这台庞大的战争机器上的一颗螺丝钉，虽然他们永远不会得到这些所谓的承诺，但他们那源源不断的劳动力却为这场战争贡献出了全部的心血和汗水。"
 GER_united_in_purpose_desc:0 "我们奋起抗争，不仅仅是为了抵御眼前的敌人，更是为了守护我们赖以生存的根基——那些坚定不移、神圣庄严的信念。我们并非为了虚无缥缈的承诺或是空洞的理想而踏上战场；每一步的前进，都是对自己生存权利的捍卫，对传承千百年的传统的坚守。每个人的心中都应燃起一团火焰，要清楚地认识到：这不仅仅是一场战争——更是对先辈的缅怀，对后代的承诺，一份神圣的责任。\n\n我们将彼此激励，讲述那些英勇无畏的英雄事迹，以此来磨砺我们的意志，锻造我们的决心。每一位战士都必须明白——他的勇气与坚韧不仅关乎他个人的命运，更决定着整个民族的未来！当每个人都将自己视作伟大理想的坚实堡垒，当每个人都意识到自己与其他战士之间那牢不可破的羁绊——那时，我们将无往而不胜。团结一致，我们的力量将无可匹敌。怀着坚定的决心和对正义事业的必胜信念，我们将披荆斩棘，勇往直前，迈向最终的胜利。因为我们，作为一个紧密相连的整体，将无坚不摧，为了守护我们伟大的传承，我们将创造出移山填海的奇迹！"
 GER_ultimate_victory_desc:0 "时机已到——命运的车轮已然开始转动，一切的征兆都预示着一个伟大胜利的到来。曾经不可一世的德意志雄鹰展翅翱翔，它在云端俯瞰着这片饱经战火的土地，盘旋着，等待着，最终向那头胆敢挑战其权威的俄国巨熊发起了致命一击。那象征着胜利的停战协议，不仅仅标志着一场战争的终结，更是预示着一个崭新时代的来临。\n\n现在，让我们向全世界宣告：大日耳曼国不仅顶住了战争的风暴，更是在与强敌的殊死搏斗中再次展现出其坚不可摧的实力。现在，是时候休养生息，厉兵秣马，巩固国防，恢复元气，重新确立我们在国际舞台上的地位了。德意志将如磐石般屹立于历史的洪流之中。新的荣耀正在前方等待着我们：德意志的崛起绝不仅仅是对过去苦难的一种补偿——而将是一个注定辉煌无比的时代的开端。全世界都将见证，我们不仅从战争的废墟中站了起来，而且还将达到前所未有的高度。"
 GER_fire_in_the_east:0 "东方大火"
 G_SWRW_need_to_choose_tt:0 "§Y我们必须作出选择§!：是§G与当地的傀儡政权§!联手保住这片土地呢？§Y还是说§!，§R将这里付之一炬呢？§!"
 GER_graveyard_of_the_empires:0 "帝国的坟墓"
 GER_mountains_of_madness:0 "疯狂的山脉"
 GER_burning_breadbasket:0 "燃烧的粮仓"
 GER_baltic_citadel:0 "波罗的海堡垒"
 GER_fire_in_the_east_desc:0 "一场难以估量的巨大灾难正以超乎想象的速度无情地席卷而来：俄罗斯侵略者燃起的熊熊战火，正在以超乎任何人想象的速度吞噬着一切。这场冲突正以排山倒海之势重塑着世界的版图——前线犬牙交错，犬齿交错，战局瞬息万变，无数的城镇和村庄在战争的硝烟中化为废墟。\n\n一旦我们的部队在前线接连失利，丢失大片领土，我们就必须采取更加灵活机动的战术，绝不能一味地死守。要将每一寸被敌人侵占的土地都化为焦土，化为让侵略者寸步难行的泥潭。这是一场斗智斗勇的博弈：我们的军队必须对前线的真实情况进行评估，以便最高统帅部制定出相应的战略，这些战略不仅能够帮助我们暂时迟滞敌人的进攻，同时也要为我们将来反攻创造有利条件。让敌人在推进的过程中逐渐陷入混乱和疲惫。"
 GER_graveyard_of_the_empires_desc:0 "一切都再一次重演了！莫斯科专员辖区原本应该成为欧洲对抗亚洲蛮族的铜墙铁壁，然而现在，它却像吸血的寄生虫一样趴在德国的身上。数万亿帝国马克和数十万雅利安人的生命都投入到了这个无底洞之中，而我们得到的回报却是那群俄罗斯人兵临城下！\n\n在我们彻底消灭东方的野兽后，我们必将揪出那些应对如今这般惨状负责的败类。但现在，我们必须尽快构筑起一条新的防线。即使我们不能够彻底阻止那些俄罗斯匪徒，也必须尽最大努力延缓他们的进攻。"
 GER_mountains_of_madness_desc:0 "高加索问题——在俄罗斯的政治中，这是一个永恒的难题。这个动荡不安的山区，充满了激情和矛盾，在当前紧张局势下更需要我们采取特殊的策略。高加索不仅仅是一个战略跳板，它更是民族和文化命运交汇之地。我们必须利用这些民族的历史仇恨作为我们权力博弈的工具，将他们之间的仇恨引向共同的敌人。无论这种仇恨采取何种形式——关键在于它的指向：在高加索的山坡和峰顶制造全面的混乱。在这片混乱中，我们将有机会巩固自己的地位，创造出持续动荡的环境，使任何控制都无从谈起。正是利用这种动荡，才能操控冲突。"
 GER_burning_breadbasket_desc:0 "军事行动可能会席卷乌克兰，甚至远至专员辖区的最西端，为了实现关键的战略目标，这不可避免地会造成重大损失。考虑到失去控制的风险以及此类行动在该地区造成的长期影响，必须在该地区采取果断措施，防止其落入俄罗斯手中，我们要考虑到多年来为控制这些土地所付出的努力。如果不采取积极行动，极有可能被敌军完全占领，并丧失所有现有的阵地。我们的首要任务是迅速有效地采取行动，以最大限度地减少威胁，并在面临迫在眉睫的危险时保持在该地区的地位。"
 GER_baltic_citadel_desc:0 "波罗的海前哨，作为我们在海洋边界上的力量堡垒，如今面临着陷落和奴役的威胁。这片领土是控制帝国生命线的关键，失去它对所有利益来说都将是一场灾难！时不我待：必须以空前的决心和速度在东部地区展开行动。无所作为是通往失败的捷径，每一天的拖延都会给我们的统治带来新的威胁。\n\n必须毫不犹豫地投入一切资源；团结一切力量，构筑起抵御即将到来的混乱的盾牌和利剑。以冷静的理性锻造的行动计划，必须成为我们的武器：巩固阵地，恢复秩序——这将决定斗争的结果。我们决不允许失败！我们的意志和决心将成为坚不可摧的壁垒。保卫波罗的海地区就是保卫帝国的心脏；迈向胜利的每一步都将提醒我们，在命运面前，我们百折不挠。"
 G_SWRW_effect_depends_of_event_tt:0 "§Y该国策的最终效果将取决于国策§!§R“东方大火”§!中所做出的选择。"
 G_SWRW_desc_not_decided:0 "§R我们还未决定我们将对东部的各个专员辖区采取何种措施。§!"
 GER_daseinkampf:0 "生死存亡的斗争"
 GER_dies_irae:0 "诸神黄昏"
 GER_when_they_cry:0 "寒蝉鸣泣之时"
 GER_stay_night:0 "命运之夜"
 GER_GOTTERDAMMERUNG:0 "天谴之时"
 GER_daseinkampf_desc:0 "斯拉夫野蛮人的部落攻占了我们的东方总督辖区。定居者们纷纷逃回德意志本土，而那些留在当地的人则惨遭虐待，天知道他们还遭受了什么非人的折磨。现在，我终于大彻大悟，与俄罗斯之间的战争绝不仅仅是两个文明之间的冲突。绝非如此，这是一场关乎我们生死存亡的战争，一场决定整个白色人种命运的战争！我们绝不会屈服。愿上帝保佑我们，在这场残酷的斗争中取得最终的胜利。"
 GER_dies_irae_desc:0 "战争爆发伊始，人们便清楚地认识到，德意志早已被叛徒所渗透。社会主义者、激进的年轻人、来自东方领土的劣等民族。他们从一开始就站在了俄罗斯人那一边。我怎会如此盲目，对这一切视而不见？是时候发泄我们心中的怒火，并将这些叛徒打入万劫不复的地狱了！"
 GER_when_they_cry_desc:0 "我们的人民正在战场上浴血奋战，英勇牺牲。这场不义的、残酷的战争正在夺走我们民族最优秀儿女的生命。孩子们永远失去了他们的父亲，而父亲们则不得不亲手将自己的儿子埋葬在冰冷的坟墓中。如果我们仅仅沉溺于对逝者的哀悼之中，那我们永远也无法取得胜利！如果你们不希望他们的牺牲白白浪费，那就拿起武器，为了你们的家园而战！为了德意志而战！为了我们的人民而战！"
 GER_stay_night_desc:0 "20世纪的黑夜已然降临。自由主义和共产主义的堕落思想早已荼毒了我们人民的心灵。斯拉夫劣等民族正在侵占我们的领土，似乎希望已经破灭。不，绝不！我们民族的命运已经历过无数次的考验，我们也必将在这至暗时刻奋战到底，为了我们人民的未来而战斗到底！或许，黑夜已然降临，但这无尽的长夜之后，终将迎来破晓的曙光！"
 GER_GOTTERDAMMERUNG_desc:0 "一切都结束了。尽管雅利安人拥有坚不可摧的精神，尽管我们的人民无比忠诚，甘愿为国献身，但我们还是输掉了这场战争。不过，我们还握有最后一张王牌。核武器不仅能将那些斯拉夫蛮族彻底消灭，还能让我们的所有敌人都化为灰烬。就让整个世界在这核火中燃烧殆尽吧！让江河化为奔腾的岩浆，让图勒那古老的森林被烈焰吞噬！我们坚信，在经历过这一轮的毁灭之后，人类将会迎来一个崭新的时代，一个人类也许能做出正确选择的新世界。"
 GER_SWRW.1.t:0 "为乌合之众准备的表演"
 GER_SWRW.1.d:0 "在德国城市的街道上，聚集起了大批的民众：他们肩并肩地站在人行道上，而建筑的窗户则成为了天然的看台，人们饶有兴致地观看着这场由帝国官方一手策划的“凯旋游行”。然而，与人们想象中那军容齐整、步伐矫健的军队不同，沿着街道缓缓行进的，却是一群截然不同的“囚徒”——他们是身心备受摧残的俄罗斯战俘。\n\n在人群爆发出的阵阵怒吼、饱含憎恨的嘲笑和侮辱声中，战俘们步履蹒跚，许多人甚至因为极度的虚弱而摇摇欲坠。他们的脸上涂满了污泥，身体瘦骨嶙峋，透过破烂不堪的衣衫，清晰可见根根凸起的肋骨。警卫们用枪托驱赶着他们，嘴里还不时发出粗暴的呵斥。\n\n被狂热的宣传所煽动，人群的攻击性行为早已超出了理性的范畴：他们向战俘们投掷腐烂的蔬菜、垃圾，甚至是石块；朝着他们吐口水，并对他们破口大骂。孩子们也有样学样地重复着大人们的污言秽语，而老人们则轻蔑地转过头去，将这些战俘斥为“东方的野蛮人”。\n\n对于这些俄罗斯士兵而言，这不仅仅是一场对其肉体的无情摧残，更是一场对其精神的无情凌辱。每一次辱骂都如同回荡在他们耳畔的丧钟，而每一次的唾弃都让他们清楚地意识到自己那无比绝望的处境。然而，在这些饱受摧残的战俘中，仍有一些人保留着最后的尊严：其中一位战俘竭尽全力地挺直了腰杆，用坚毅的目光凝视着眼前那群歇斯底里的乌合之众——尽管他的面容早已被无尽的苦难所扭曲，但他的双眸中却闪烁着不屈的光芒。\n\n对德国人来说，这场游行只不过是他们那虚妄的“伟大”的又一次无耻展现。而对于战俘来说，这是对战争残酷性的无情嘲讽，同时也预示着苦难远未结束。"
 GER_SWRW.1.a:0 "可怜之人"
 GER_SWRW.2.t:0 "在机器的轰鸣声中"
 GER_SWRW.2.d:0 "黎明前的黑暗再一次笼罩大地：夜班工人结束了他们漫长而艰辛的劳作；而接替他们的，则是那些注定要在无休止的劳动中消磨时光，直到夜幕再次降临的工人们……在这里，你已经很难再见到德国工人了。现在，工厂里的工人主要是来自乌克兰和“东方领土”的人，甚至还有一些来自高加索地区的劳工——他们来到这里的目的只有一个：不惜一切代价挣到维持生存的薪水。\n\n作为“人上人”的优越感早已荡然无存；工人们不得不出卖自己的自由，来换取那微薄的报酬，但尽管如此，这份报酬也足以让他们摆脱在故乡食不果腹、衣不蔽体的悲惨命运。今天和往常没什么不同：流水线上的机器永不停歇，将一件又一件崭新的武器送往远方那吞噬一切的战场。\n\n在严格的管理和持续不断的监督之下，工人们依然保留着人性的光辉。在短暂的休息时间里，你仍然能够听到工人们之间的只言片语：\n\n“你是怎么到这儿来的？”其中一个人问他身边的工友。\n\n“和大家一样呗：为了挣钱呗。谁曾想，我居然落得这般田地…恐怕这辈子我都得在这暗无天日的地方卖命了！”另一个人回答道，目光却始终没有离开手中的零件。\n\n“至少还算有点盼头……”第一个人叹了口气，若有所思地望着那源源不断的武器。“战争总有结束的一天，说不定到时候，我们的日子也能好过一些。”\n\n“你可真够乐观的！谁知道我们这些‘下等人’在那些高高在上的雅利安人眼中究竟算什么呢？行了，别说这些没用的了，赶紧干活吧，工头还在盯着咱们呢……你也不想挨鞭子吧。”另一个人打断了他的话，语气中虽然带着一丝抱怨，但更多的则是一种无奈的接受。\n\n“也对……”第一个人表示赞同，随即又投入到了紧张的工作中。工厂里再次陷入一片沉寂；只有那有节奏的敲击声、机器的轰鸣声以及零件碰撞的声响在空中回荡——这首永不停歇的工业交响曲似乎永远也不会停止。"
 GER_SWRW.2.a:0 "人只有在无休止的劳作中才能领悟到自己存在的意义"
 GER_SWRW.3.t:0 "在泛黄的地图中"
 GER_SWRW.3.d:0 "时代与往昔紧密相连——那些历经岁月洗礼的古老文物，已然成为了历史的见证。卡尔，一位在德国郊区博物馆工作的、毫不起眼的小人物，比任何人都清楚地认识到了这一点。\n\n作为一名讲解员，卡尔在向游客们讲述国家那“辉煌”的历史时，言语中总是充满着自豪。每一张陈旧的地图在卡尔的讲述中都仿佛获得了新生：从德意志民族最初的崛起，一直到大日耳曼国达到权力的巅峰…在每一个历史时期中，他都能找到值得大书特书的光辉事迹，仿佛那些尘封的、不可告人的秘密都在他的描述中重见天日一般。\n\n但世界早已风云突变。如今，卡尔的讲解中出现了一些全新的论调：德国正不断地发展壮大，克服了前进道路上的一切艰难险阻；而俄罗斯则恰恰相反，这个国家在完成了对东方的征服后，早已陷入了无休止的危机，无力自拔。在卡尔的每一段讲解中，他都描绘了一幅两国发展此消彼长的鲜明对比：当德国在通往强盛的道路上突飞猛进时，它的东方邻国却在衰落和战败的泥潭中苦苦挣扎。\n\n带着一种近乎狂热的执着，卡尔反复强调着俄罗斯在历史上遭遇的那些失败——两次争夺世界霸权的战争都以其惨败而告终。他对大日耳曼国必将取得最终胜利的信念坚不可摧。每一位前来聆听他那“慷慨激昂”的演讲，希望了解这两个帝国之间错综复杂关系以及那场残酷战争的游客，在离开时都会对德意志民族在历史上所取得的辉煌成就深信不疑。\n\n对于自身国家那不可动摇的信念，以及对德意志必将取得最终胜利的坚定信仰，驱使着卡尔滔滔不绝地向每一位游客“讲述真相”。他坚信：历史，就是一部德国战胜日渐衰落的俄罗斯的胜利史诗，而未来，也必将沿着这条道路坚定不移地走下去，因为…"
 GER_SWRW.3.a:0 "历史总是在不断重演。"
 GER_SWRW.4.t:0 "来自远方的援助"
 GER_SWRW.4.d:0 "在颠簸的装甲车内，金属与崎岖路面剧烈摩擦，发出阵阵轰鸣。车厢中弥漫着令人窒息的紧张，唯有引擎活塞的撞击声和无线电偶尔传出的报告，打破沉寂。又一批战士正被运往前线——东线战场，是国家关注与投入的重中之重。队员们大都默不作声，心绪紧绷，默默准备着即将到来的战斗。然而，即便在如此压抑的气氛中，他们仍会抽空闲聊几句。\n\n“你们知道吗，我父亲也曾经在东线战斗过，就在那场战争期间……”一名口音浓重的西班牙人打破了沉默。虽然他的德语并不流利，但大家还是能听懂他在说什么。他的战友们都将目光转向了他，眼中充满了好奇。\n“当时他是一名志愿师的士兵，而且表现非常出色。而现在，我也即将踏上战场，为了同样的理想而战。”\n“所以说，你是在追随你父亲的足迹？”一位比其他人年轻的德国士兵问道。\n\n“没错……他一直都是我的榜样；为了保卫欧洲，他曾与那些野蛮的俄罗斯人浴血奋战。而现在，我也想要证明，父亲培养出了一位合格的继承人。是时候让我也去战场上挥洒热血了！”\n\n听到这里，德国士兵们都开心地笑了起来。那些坐在西班牙人身边的士兵拍了拍他的肩膀，并高喊着“好样的！好样的！”——以此来表达他们对这位外国战友的赞赏和支持。然而就在这时，装甲车突然猛烈地颠簸了一下，车内的所有人都下意识地停止了交谈，重新进入到战前的准备状态：有人在检查自己的武器，有人则紧张地四处张望，还有人则一动不动地坐在那里。最后，那位西班牙人用坚定的语气说道：\n\n“但愿这场战争能将我们磨练成配得上祖国的真正的男子汉…”"
 GER_SWRW.4.a:0 "新一代正在解决旧问题"
 GER_SWRW.5.t:0 "千年帝国屹立不倒！"
 GER_SWRW.5.d:0 "帝国的旗帜高悬于旗杆之巅，庆典礼炮的轰鸣震动寰宇，公民们欢腾的呼喊声响彻国境的每一个角落。城市街道沉浸在盛大的节日氛围之中——人们相拥、祝贺，庆贺这伟大的日子。乐团奏响庄严的旋律与凯旋的进行曲，电视与广播全天候运作，各个频道、每家每户的无线电，都在传递着民族功勋的喜讯。\n\n旭日的光芒普照大日耳曼国的疆土——这场旷世胜利，是对帝国理想坚定不移的生动印证，向世人昭示了其蕴藏的真实力量。在残酷的浴血奋战中，德意志的钢铁雄师不仅捍卫了家园的安危，更向敌人施以毁灭性的打击，迫使其在铁蹄下俯首称臣。\n\n是时候再次拨转国家巨轮的航向，驶向稳定与和平的港湾——历经艰苦卓绝的考验，帝国付出了惨痛的代价。战争已在历史的长河中留下深深的烙印。然而，无可置疑的胜利，也印证了帝国所抉择道路的正确性。摆在眼前的，是亟待解决的累积问题：既有战前便已存在的痼疾，亦有新生的挑战。\n\n国家领袖向国民发出团结一心的号召——为实现国家的彻底复兴，作最后一搏。这不仅仅是大日耳曼国历史的新篇章，更是一个新时代的开端，团结与决心，将铸就未来伟业的基石。"
 GER_SWRW.5.a:0 "未来的路还很长。"
 GER_SWRW.6.t:0 "广袤的东方"
 GER_SWRW.6.d:0 "自维斯瓦河以东的广袤领土被我们从苏联手中夺走，已经过去了数十年。而如今，这些土地却再一次面临着被东方势力吞噬的危险。摆在我们面前的有两种截然不同的应对方案。\n\n第一种方案主要由文官和部分旧军官所提出。他们主张，我们应该集中力量与当地的合作者们展开合作，并在力所能及的范围内加强防御。尽管这一方案存在一定的风险，但总的来说，它看起来更加理性。\n\n第二种方案则是由党卫军和党内的激进分子们所提出的。既然我们无法有效防御从第聂伯河到伏尔加河这片广袤无垠的土地，那么为什么不集中力量，确保敌人无法从这里获得任何有价值的资源呢？当然，批评者们将这种“焦土政策”斥之为“疯狂之举”。诚然，这确实是焦土政策，但如果说我们注定守不住这些地区的话，那将这里的资源拱手相让给从东方来的那群亚洲蛮子也同样令人难以接受。\n\n我们别无选择，只能做出最后的抉择。"
 GER_SWRW.6.a:0 "这是我们的土地——我们必须誓死捍卫！"
 GER_SWRW.6.b:0 "绝不能让敌人获得任何有价值的东西。"
 GER_SWRW.7.t:0 "[MCW.GetNameDef]: 战况速报"
 GER_SWRW.7.d:0 "东方的入侵者突破了莫斯科维恩东部边境的第一道防线。帝国国防军始料未及，敌人的攻势竟如此迅猛，深入我国专员辖区的腹地！克里姆林宫仍在我们的掌控之中，我们必须竭尽全力，保卫元首的丰功伟绩！\n\n针对当下的危局，已向元首呈递两套应对方案：由东方领事务部和莫斯科专员提出的策略，是依托俄罗斯人民解放军迟滞俄军的进军速度，以便为其他行政区构筑防线争取时间。第二套方案，则由党卫军各师指挥部提出，主张在我国控制区内实施焦土政策。两套方案各有利弊，但在东方兽潮汹涌而来的当下，我们只能择其一。元首，您意下如何？"
 GER_SWRW.7.a:0 "我们将卡明斯基之流改造成可堪一用的力量。授权于俄罗斯解放军！"
 GER_SWRW.7.b:0 "党卫军必须洗刷希姆莱与海德里希带来的耻辱。授权于党卫军！"
 GER_SWRW.8.t:0 "我们的伊凡们"
 GER_SWRW.8.d:0 "党卫军上尉军靴铿锵的撞击声，在俄罗斯解放军精锐部队整齐的队列间回荡。军官走到队列中央，清了清嗓子，用浓重的德语口音向面前的士兵发表讲话：\n\n“真正的俄罗斯人，帝国忠实的子民，英勇的战士们，我向你们致敬！我们的帝国雄踞欧洲之巅，然而，来自东方的布尔什维克污泥又一次企图奴役俄罗斯，用犹太毒瘤戕害这片土地。你们肩负着捍卫白俄罗斯的神圣职责——务必再次阻止布尔什维克，将他们一直驱逐到符拉迪沃斯托克！唯有如此，也只有如此，德意志才能将对解放的祖国全境的统治权，移交给你们，俄罗斯真正的儿女。前进吧，为了没有布尔什维克及其帮凶的俄罗斯！”"
 GER_SWRW.8.a:0 "“万岁！万岁！万岁！”"
 GER_SWRW.9.t:0 "大撤退"
 GER_SWRW.9.d:0 "昔日的伏尔加格勒火车站，如今已是人满为患。成千上万的伏尔加德意志人，被强制驱赶着登上货运车厢，即将被运往克里米亚。为维护“装载”的秩序，除了国防军宪兵与党卫军部队外，专员辖区的代表也用扩音器发表讲话。他声称“被迫迁徙只是暂时的”，并信誓旦旦地保证，“一旦达成在专员辖区恢复秩序的全部行动目标”，他们便可重返故土。\n\n尽管如此，被迫迁徙者们的情绪依旧沮丧。无人愿意离开故土，但对“斯拉夫-蒙古蛮族”的恐惧更胜一筹。伏尔加德意志人怀着悲怆，但也对国防军抱持信心，期盼着重返家园的那一天，踏上前往哥滕兰的漫长旅程。"
 GER_SWRW.9.a:0 "这都只是一些暂时的困难罢了。"
 GER_SWRW.10.t:0 "关于莫斯科维恩防御能力的报告"
 GER_SWRW.10.d:0 "绝密\n\n发件人：莫斯科专员辖区党政军联合管理委员会\n收件人：大日耳曼国元首\n\n元首万岁！依照您的方略，莫斯科的防卫能力已得到显著提升。根据与俄罗斯军队交战的报告，俄罗斯解放军表现出了优异的作战能力。尽管敌军兵力占优，但在国防军与党卫军军官的指挥下，俄罗斯解放军战士依然能坚守战略与战术要地，为我国正规部队的驰援争取宝贵的时间。莫斯科、普斯科夫、圣彼得堡与伏尔加格比特的防御工事，已配备了最新型号的防空武器、反坦克壕沟，以及全新的战壕体系。\n\n愿德意志\n在您的领导下长治久安！"
 GER_SWRW.10.a:0 "看来，我们终将守住克里姆林宫。"
 GER_SWRW.11.t:0 "在山地之王的宫殿中"
 GER_SWRW.11.d:0 "费迪南德上尉尽管外表镇定自若，但他还是感到有些不安。毕竟，如果基什拉克里的那些武装车臣人、达吉斯坦人、印古什人——抑或是其他什么该死的山地鞑靼——胆敢开火，他和两名护卫转瞬便会血肉横飞，命丧当场。\n\n“进来吧！”窗内传来某个络腮胡子怒吼的声音。身为国防军军官，竟遭如此轻慢，费迪南勃然大怒。但他还是强压怒火，迈步走进屋舍。屋内，几位须发皆白的老者身着裘皮大衣，正襟危坐，年轻的圣战者持枪侍立，守卫在侧。费迪南德入席而坐，与他们围桌而谈，开始陈述总参谋部的旨意。\n\n“高加索的光荣子孙，伟大的德意志元首再次向你们发出呼唤。俄罗斯人又一次企图奴役你们，剥夺你们的自由，正如他们奴役我们一般。正如诸位所知，伟大的阿道夫·希特勒元首，以及当今的国家元首，向来对高加索各民族与穆斯林人民敬重有加，因为你们敢于挺身对抗俄罗斯军团及其犹太主子。因此，我恳请各位，再次站到德意志民族一边，共同抗击俄罗斯的威胁。作为回报，我们不仅承诺将原属哥萨克的沃土划给你们定居，更保证你们在对俄作战中享有完全的行动自由，包括在俄罗斯境内俘获俄国人。”"
 GER_SWRW.11.a:0 "他们不会拒绝的，他们不能拒绝我们的提议。"
 GER_SWRW.12.t:0 "与魔鬼的交易"
 GER_SWRW.12.d:0 "随着莫斯科维恩与高加索地区相继沦陷，战火已蔓延至乌克兰的土地。若德意志粮仓乌克兰遭受重创，粮食与谷物供应一旦中断，势必引发我国本土的社会动荡。往昔，党卫军或后备部队尚能应对此类动乱，但眼下战争规模已急剧升级，我国几乎已将所有武装力量悉数调往前线。\n\n因此，乌克兰专员辖区专员的正式来函，成为了国内军政高层尤为关注的焦点。在致元首的报告中，乌克兰长官禀报称，包括新近组建的乌克兰民族主义者组织和党卫军“加利西亚”师在内的大部分民族主义武装力量的领袖，纷纷上书请愿，以“俄罗斯入侵乌克兰的威胁日益迫近”为由，要求帝国扩大其在军队和地方政府中的权力。乌克兰民族主义者虽然口头高唱着含糊不清的口号，但其真实意图却昭然若揭——“要么给我们更大的权力，要么我们就反戈一击”。易地而处，此类请愿定会招致领袖被立即逮捕，武装力量被迅速瓦解的下场。然而，鉴于前线战局岌岌可危，元首已别无选择。"
 GER_SWRW.12.a:0 "给予他们一切索求之物。反正这不过是权宜之计。"
 GER_SWRW.13.t:0 "人民冲锋队中的德意志人民"
 GER_SWRW.13.d:0 "里加市中心广场，弥漫着一种躁动不安、近乎癫狂的氛围。成百上千的德意志民众不受任何人指使，自发汇集于城市中心，发出同一种呼声——“把武器交给我们！”\n\n里加专员起初本打算上报柏林，静候指示。但他深知此刻群情激昂，唯恐事态失控，便冒险站了出来。“德意志同胞们！我们被背叛了！”一时间，人群的喧嚣戛然而止，总督抓住时机，继续慷慨激昂地演说：“德意志同胞们，我们被来自莫斯科维亚的伊万们背叛了！他们宁可与同族为伍，也要背弃文明的欧洲！我们还被高加索山地的狒狒和乌克兰的猪狗背叛了！我们德意志人，已经被逼到了孤立无援的境地！因此，我们肩负的种族使命，就是将他们彻底击退！曾几何时，在我们最终胜利之时，我们曾将他们从里加驱逐到西伯利亚，今天，我们同样能做到！”\n\n专员的演讲奏效了！他并未安抚民众，而是成功地将怒火转移到东方。成百上千原本怒火中烧，甚至有可能捣毁城市的德意志民众，此刻却已决心为这座城市献出生命。经过与城内国防军军官的紧急磋商，示威者们获得了火炮、步枪、制服与反坦克火箭筒。里加的防御战备工作迅速展开。"
 GER_SWRW.13.a:0 "此乃我们的温泉关！薛西斯休想越雷池一步！"
 GER_SWRW.14.t:0 "焦土"
 GER_SWRW.14.d:0 "漆黑如墨的煤灰早已深深地渗入了阿尔诺的皮肤，似乎永远也无法洗净。他和他的特别行动队接到的命令是“为构筑新的防御工事做好准备工作”。这句冠冕堂皇的官样文章背后所隐藏的真实含义其实再简单不过了——焚烧。焚烧一切——田野、森林、草地、村庄，以及上级下令焚烧的任何东西。这并不是他所向往的生活，但他早已下定决心不惜一切代价——只要能让他远离旧的岗位，远离与勃艮第接壤的那条边界。\n\n将一罐混合着煤油和松节油的混合物放到地上后，阿尔诺终于能够直起腰来，欣赏一下自己的“劳动成果”了。熊熊燃烧的森林所产生的浓烟正滚滚涌向俄罗斯军队的阵地，再过几天，他们就将占领这片化为焦土的无人区。阿尔诺将烟头扔到草地上，捡起罐子，朝着特别行动队的集结地走去。"
 GER_SWRW.14.a:0 "未来的路还很长。"
 GER_SWRW.15.t:0 "“许癸厄亚行动”：第一阶段"
 GER_SWRW.15.d:0 "滚烫的汗水浸透了伊戈尔的全身。他必须完成那由于战争而大幅度增加的生产指标，因为一旦他未能完成任务，他需要面对的便不再是工厂主管的责骂了，而是党卫军军官的皮鞭和枪子儿。他甚至没注意到部队长说了什么。“斯塔赫耶夫！”部队长在他耳边怒吼道。“是，什么？！”伊戈尔惊恐交加地应道。“行政部门命令所有非雅利安人到医务室集合，快去！”\n\n伊戈尔顺从地加入了排队的人群，磨蹭着挪向医务室。在那里，他看到了两条队伍，一条鱼贯而入，另一条则愁眉苦脸地鱼贯而出。伊戈尔拦下几个刚从医务室出来的人，打探得知他们注射了针对某种新型病毒的疫苗。“这里面肯定有蹊跷”，伊戈尔心头一惊，但思绪瞬间被后脑勺的钝痛打断。他再次醒来时，已身处营房，头部剧痛，肩头还添了一道浅浅的伤口。"
 GER_SWRW.15.a:0 "“这究竟是什么鬼把戏？”"
 GER_SWRW.16.t:0 "“许癸厄亚行动”：第二阶段"
 GER_SWRW.16.d:0 "绝密\n\n发件人：莫斯科维恩专员辖区党卫队上级集团领袖\n收件人：大日耳曼国元首\n\n元首万岁！依照您的指示，“许癸厄亚行动”进展顺利。截至目前，27.6%的俄罗斯人口已接种了病毒，到本月底，这一数字预计将上升到33.3%。成年男性的死亡率为71.2%，成年女性的死亡率为82.5%，而儿童的死亡率则高达91.3%。若已“消毒”的地区重归俄罗斯蛮族掌控，病毒还将进一步向东方蔓延，这不仅将为雅利安人腾出如今在前专员辖区被占据的土地，甚至将俄罗斯的“故土”也一并“清理”出来。\n\n愿德意志\n在您的领导下长治久安！"
 GER_SWRW.16.a:0 "这病毒只针对劣等人种，对吗？"
 GER_SWRW.17.t:0 "柯尼斯堡隔离区"
 GER_SWRW.17.d:0 "在德国，医院里严禁奔跑喧哗。这是为了避免引起病人的恐慌和不安。但眼下，施密特医生不得不打破这一规矩，因为奔跑是他唯一能争取到那宝贵时间的方式——为了他自己，也为了他的病人。当他冲进隔离病房时，他的助手已经紧紧地关上了房门。来到观察窗前，他看到了四位“零号病人”：他们身上布满了大大小小的伤疤，呼吸沉重，而且都处于半昏迷状态。\n\n初步的诊断结果显示，这些病人同时患有毒血症、肺炎和心动过速。“考虑到他们两个小时前才被送到这里，以他们目前的状况来看，最多还能再撑一个小时，也许两个小时。”施密特心想。正当他思忖之际，一阵敲门声打断了他的思绪，随后房门被打开了。几名党卫队军官和身着便装的盖世太保走了进来。“施密特医生，”其中一人开口问道，“有多少人已经被感染了？”“每一例新出现的感染病例，我们都会第一时间上报给主治医师。”医生带着惊恐的语气回答道。就在这时，围在他身边的这些人已经准备离开房间了，但走在最后面的一位回过头来，死死地盯着施密特医生的眼睛，用一种令人不寒而栗的语气说道：“这些‘光荣’的军官是在‘英勇’地与俄国人的战斗中‘壮烈’牺牲的，您明白了吗，施密特医生？”"
 GER_SWRW.17.a:0 "瘟疫？"
 GER_SWRW.18.t:0 "星火"
 GER_SWRW.18.d:0 "沙米尔像一颗火星般在人群中快速穿梭。两个德国人——一个身穿黑色制服的白人和他的切尔克西亚助手，交给了他一个盒子，并让他赶在晌礼开始时打开。他们声称这是沙米尔的父亲让他转交的。他们还说，如果他，这个年仅五岁的孩子，能够成为一名光荣的殉道者，那么这不仅会给他的家族带来无上的荣光，也能让他成为真主最忠诚的仆人。\n\n当然，沙米尔还无法完全理解这些话的含义，但父亲能够将如此重要的使命托付给他，这意味着沙米尔一定会竭尽全力去完成它。\n\n又穿过了几条小巷，沙米尔终于看到了自己的目标——索尔扎-加拉的主清真寺，也叫阿明·侯赛尼清真寺，当然这名字是俄罗斯人入侵之前的事儿了。不过没关系，沙米尔现在就要给这些信奉基督的侵略者们好好上一课了！\n\n走进清真寺，他发现晌礼已经开始了。沙米尔毫不犹豫地跑到清真寺的中央，打开了那个盒子，正如他的父亲嘱咐他的那样。\n\n可怜的沙米尔死得很快，他甚至来不及明白自己被欺骗了。当人们告诉他这样做会为他的家族带来荣耀时，他们欺骗了他，因为数百名信徒的死亡带来的只有无尽的悲痛和耻辱。当人们告诉他这是他父亲的嘱托时，他们欺骗了他，因为他的父亲早已在这座城市的街道上疯狂地寻找了他一个多小时。最重要的是，当人们告诉他，如果他在清真寺里打开那个装满炸弹的盒子，真主就会保佑他时，他们彻头彻尾地欺骗了他…"
 GER_SWRW.18.a:0 "…因为真主是仁慈的、悲悯的。"
 GER_SWRW.19.t:0 "爆炸"
 GER_SWRW.19.d:0 "几周前从狄奥多里希沙芬运来的那艘崭新的油轮，以其庞大的身躯震撼了米夏埃尔。他不过是驻扎在这个黑海港口的一名普通士兵，因此这艘巨大的、被漆成深灰色的、在右舷绘有一个巨大鹰徽的船只足以令他叹为观止，尽管它只不过是一艘运油的船只而已。又是一个在港口中进行的例行巡逻，又是一次漫无目的的巡视，甚至连一个可以交谈的人都没有。\n\n“不过，这总比待在东线强多了。”每当感到无聊时，他总是这样安慰自己。这名士兵看着那艘油轮，并朝着通往油轮的舷梯走去。一步，两步，三步……米夏埃尔登上了油轮。他小心翼翼地在甲板上走了几步，就在这时，他的身后突然传来了一阵嘈杂的喊叫声。\n\n他转过身。十几个人影站在远处，疯狂地叫喊着，挥舞着手臂。他们的声音相互交织，难以分辨。米夏埃尔正准备向他们挥手致意，却突然听清了两个出现频率最高的词——“快跑！”和“快跳！”他惊恐地转过身，看向甲板。我的上帝啊……他脚下的甲板突然爆裂开来，火光冲天。\n\n“疼，”当他恢复意识时，脑海中只剩下这一个念头。爆炸似乎把他炸飞了很远。他睁开一只眼睛，还以为自己身处炼狱，因为目之所及，尽是令人绝望的橙红色。不，那不是地狱，而是火焰……无处不在的火焰。他的右眼什么也看不见，而左眼也被涌出的鲜血所模糊。他不知从哪儿来了一股力气，翻过身来，沿着海岸奋力爬行。似乎一切都在燃烧：船只、港口、周围的建筑物，甚至连海水也在燃烧。但这都无关紧要了。他一定要活下去……他必须活下去。海岸上到处都是锋利的石块，每当米夏埃尔的身体压到这些石头上时，都会传来一阵剧痛。但他早已遍体鳞伤，麻木了——这又算得了什么呢？\n\n又爬过了一米，再坚持一下，他就能逃出生天了。他一定能够活着回去的。他用尽最后的力气，强迫自己那早已不听使唤的身体站起来，却以失败而告终，甚至连抬起自己身体的力气都已丧失殆尽。米夏埃尔翻过身来，望向月亮，随后，他将目光投向了自己的双腿。那曾经属于他的双腿的地方。他呆滞地凝视着那里，过了许久才意识到，自己的双腿早已荡然无存——只剩下了两截血肉模糊、还在不断渗出鲜血的残肢。米夏埃尔再次将目光投向月亮。\n\n“真美啊，”他喃喃自语道。"
 GER_SWRW.19.a:0 "随后他的意识便坠入了无尽的黑暗之中。"
 GER_SWRW.20.t:0 "寸草不生"
 GER_SWRW.20.d:0 "乌克兰的金色田野——这片曾被誉为“欧洲粮仓”的土地，如今却被熊熊燃烧的大火和滚滚浓烟所彻底吞噬。黑色的浓烟，如同没有月亮的夜晚一般漆黑，直冲云霄。老旧的“玉米”式飞机和其他一切能够飞起来的玩意儿，像是蝗虫一般在那片饱受苦难的土地上空盘旋，它们不知疲倦地来回穿梭，将燃烧着的焦油、煤油和原木倾泻到一片又一片金色的田野上。国防军最高统帅部将这些空袭行动的目的粉饰为“减缓俄军推进速度的必要措施”，但那些世代在这片土地上耕作的、成千上万的乌克兰民众的命运，却无人关心。\n\n很快，越来越多的乌克兰人亲眼目睹了这令人绝望的惨状。他们中的一些人试图反抗德国军方的这些暴行，却遭到了当局更为残酷的镇压，他们被逮捕，被折磨，那些“冥顽不化”者，则直接被送上了刑场。另一些人则选择了另一条更危险但也更直接的反抗之路——加入、甚至组建支持俄罗斯人的游击队。然而，自乌克兰被德国完全占领以来，这些乌克兰居民们的命运就从未真正被纳粹当局所重视过。"
 GER_SWRW.20.a:0 "…西庇阿下令将盐撒在土地上，使之寸草不生…"
