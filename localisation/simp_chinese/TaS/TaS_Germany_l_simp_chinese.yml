 TaS_Post2WRW_GWF_for_the_reich:0 "为了元首进军！"
 TaS_Post2WRW_GWF_for_the_reich_desc:0 "我们伟大的元首恩斯特·雷默在几乎每次演讲中都会提到“德国可能输掉了一场战役，但从未输掉战争。”这是无可辩驳的事实。如今的德意志民族在东方俄国军队的铁蹄下苟延残喘、四分五裂，敌人甚至占领了德国的心脏，无时无刻不想将其夷为平地。但这种卑劣手段只会让真正的雅利安人重燃斗志，起身与那低下的劣等人种进行殊死搏斗。值此危急关头，德意志民族必须团结起来，“为了元首，向着柏林！”"
 POSTWRW2_Remer_DESC:0 "雷默曾说，德意志，如同伊卡洛斯般，因飞向太阳的速度太快，而从古老的传说中坠落。这正是伟大的大日耳曼国所遭遇的命运。它过早地品尝了胜利的果实，却依然身陷敌人的包围，在和平到来的那一刻，便彻底失去了斗志。\n\n内战什么都没能改变，新的领导层并不打算彻底消灭那些自第一次胜利后就愈发强大的敌人。而正是这样的决定，最终将德国人打入了尘埃。\n\n曾经强大的德国，大部分领土都被瓜分殆尽。无能的地方军阀、阴险狡诈的下民，还有赤色沙皇的走狗，如同秃鹫般瓜分着这个破败的国家。\n\n但这一切都不会长久。复仇的烈焰，正在德国人民的心中燃烧。祖国忠诚的子民们已经觉醒，他们将拿起武器，夺回父辈的土地。不仅如此，所有曾经的敌人，都将遭到报复。他们将化身为狼群，将敌人撕碎，直到德意志的旗帜再次飘扬在世界的每一个角落。\n\n要么，就战死在冲锋的路上。"
