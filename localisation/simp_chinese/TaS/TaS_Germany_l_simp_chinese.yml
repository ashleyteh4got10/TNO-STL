 POSTWRW2_Muzyczka_DESC:0 "思想不会消亡，只要还有忠于它们的人民活着。路德维克·穆兹奇卡，显然就是自由波兰理念的忠实信徒。自1916年加入奥地利军队的波兰军团以来，他就一直在为波兰而战。第一次世界大战结束后，他旋即加入了波兰军队，并参与了维尔纽斯的波兰政权建设。但1939年，他的世界崩塌了。纳粹入侵，他别无选择，只能再次扛起枪，加入了波兰家乡军，成为一名抵抗战士。\n\n德军兵临伦敦城下，他被迫踏上了逃亡之路，最终在纽约找到了新的避风港。但即使身处异国他乡，他对祖国的信仰也从未动摇。五十年代，苏联入侵德国，这庞然大物的致命弱点——游击运动，也随之暴露出来。穆兹奇卡与家乡军的战友们一道，重返饱经战火的祖国，建立了“影子政府”，伺机而动。幸运的是，新的德国政权还未站稳脚跟，便自顾不暇。穆兹奇卡顶住了接踵而至的压力，顽强地生存下来。 然而，随着苏军的到来，真正的炼狱才刚刚开始。波兰最终获得了久违的自由，穆兹奇卡被委以重任，这与一战后如出一辙：让西里西亚回归波兰祖国的怀抱。这一次，他绝不会允许波兰的悲剧重演。"
