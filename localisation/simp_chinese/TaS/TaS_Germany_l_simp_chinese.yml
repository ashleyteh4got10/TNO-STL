 GCZ_USA_Creighton_Abrams_DESC:0 "克雷顿·威廉姆斯·艾布拉姆斯将军和成千上万对他和美国忠贞不二的战士们驻扎在新生的捷克共和国首都——布拉格。尽管纳粹党费尽心机想要将捷克彻底融入大日耳曼国，但现在，这片土地的统治者变成了一位美国将军。虽然艾布拉姆斯更希望把自己的司令部设在人民大厅中——但这个地方已经被他的老朋友威斯特摩兰将军捷足先登了。\n\n尽管与威斯特摩兰相比，艾布拉姆斯所面临的任务要相对轻松一些，但相应的，他的权限也更小一些。尽管如此，艾布拉姆斯仍将竭尽全力铲除盘踞在这片被解放的捷克土地上的每一个纳粹分子，并将这个新生的国家打造为OFN在欧洲最为坚定的前哨和桥头堡，一劳永逸地终结那些毒瘤死灰复燃的可能！"
 TaS_Post2WRW_GCZ_golden_city_liberated:0 "金色之城重获新生"
 TaS_Post2WRW_GCZ_golden_city_liberated_desc:0 ""
 GDN_usa:0 "丹麦王国"
 GDN_usa_DEF:0 "丹麦王国"
