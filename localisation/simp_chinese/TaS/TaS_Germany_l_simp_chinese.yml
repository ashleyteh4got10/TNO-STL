 GFR_usa:0 "比利时王国"
 GFR_usa_DEF:0 "比利时王国"
 GFR_usa_ADJ:0 "比利时"
 GFR_Charles_of_Flanders:0 "夏尔一世"
 GFR_Charles_of_Flanders_DESC:0 "夏尔从未想过要登上王位。尽管他对利奥波德三世的统治深恶痛绝，但他无论如何都不愿步其后尘。自从他的国家在全球大战结束后被拱手让给德国这群刽子手后，这位年轻的王子便性情大变。或许这是由于战争期间遭受了创伤，但国王的这位弟弟却在战后选择了一条声色犬马的堕落之路。对于自己的国家所遭受的苦难，这位王子选择了沉溺于安逸的流亡生活之中，而这也满足了他对“流亡王子”这一名号的幻想。在这片与他一样流亡于此的外国土地上，无数身世显赫的上流人士和风情万种的名媛贵妇与他相交甚好，而他也甘愿在这灯红酒绿的奢靡生活中放任自我，任凭自己沉沦在那源源不断的多巴胺的快感之中，殊不知这是掩盖他对过往那些梦魇的麻醉剂，也是对自己无法救黎民于水火之中的软弱的无声哭喊。然而，世事难料，那曾经强大无比的大日耳曼国早已是过眼云烟，他的故乡——自盟军战败后他再未曾踏足的那片土地——比利时，如今终于获得了久违的自由。\n\n在美国人的首肯下，夏尔接过了比利时国王的权杖，成为这个满目疮痍的国度的君主。面对着百废待兴的产业、一贫如洗的国民以及他们那充满着不信任的眼神，这位新国王感到一阵深深的无力感袭上心头，随后而来的，便是那无休无止的忧郁和对酒精的依赖。现如今，唯有美国人在比利时积极地施展拳脚，而比利时自己的国王，则早已深陷在绝望与痛苦的泥潭中无法自拔。他能否振作起来，担负起身为国王的责任，开始真正地治理他的国家？抑或是在这种状态下了此残生？只有时间才能给出答案。"
 GFR_usa_party:0 "比利时同盟"
 GFR_usa_party_long:0 "比利时同盟"
 TaS_next_state_please_tt:0 "\n§G现在我们可以继续前进，前往下一个国家了§!"
 TaS_GEREpilogue.1.t: "新秩序"
 TaS_the_neu_ordung_tt:0 "我们仍有许多工作要完成。"
 TaS_GEREpilogue.1.d: "弗拉基米尔·吉尔已经很久没有处理过文件了。过去几个月里，他一直奔波在前线，或者至少是在离前线不远的地方。现在， 纸面工作成了这位陆军元帅最大的敌人，甚至比狼人游击队的子弹更令他感到恐惧。办公楼外，抗议声、叫骂声此起彼伏，甚至有人朝警卫扔石头，但很快就被驱散了。今天是个特殊的日子——一周前签署的《去纳粹化法令》终于正式生效了。作为柏林管理总局的领导人，吉尔当然要亲自出席这场具有历史意义的仪式。\n\n吉尔穿上外套，走出办公楼，坐进了汽车的后座。放眼望去，这座曾经的日耳曼心脏，如今已经失去了往日的荣耀，处处弥漫着一股萧瑟的气息。但这已经不重要了。汽车行驶在宽阔的街道上，吉尔注意到，那些纳粹的印记依然随处可见，无论是街道名称、建筑牌匾，还是那些依然矗立着的纪念碑，尤其是远处那座雄伟的“人民大厅”，更是时刻提醒着人们，纳粹的幽灵依然徘徊在这片土地上。"
 TaS_GEREpilogue.1.a: "一切都将成为过去"
 TaS_GEREpilogue.2.t: "时代的终结"
 TaS_rip_big_building_tt:0 "纳粹的造物——“德意志”，已不复存在。"
 TaS_GEREpilogue.2.d: "汽车缓缓地驶向人民大厅——这座曾经象征着德意志民族辉煌的宏伟建筑，如今却已伤痕累累，炮火和空袭在屋顶上留下了无数窟窿，曾经屹立在穹顶的雄鹰雕像也已断裂，残骸散落在入口处。尽管如此，这座建筑依然散发出令人敬畏的气势。“纳粹的建筑师们确实有两把刷子。”吉尔一边想着，一边朝主舞台走去。那里，聚集着来自世界各地的记者、摄影师以及看热闹的普通民众，他们将共同见证这座雄伟建筑的最终命运。当然，出于安全考虑，警戒线将人群阻隔在安全距离之外，但那些记者们，依然令吉尔感到厌恶。他刚一走进人群，一个年轻的女人就带着摄像师朝他走了过来，摄像机上刻着吉尔看不懂的象形文字。“各位观众朋友们大家好，现在站在我身边的是弗拉基米尔·吉尔先生，他是德国占领区办公室的负责人，也是‘去纳粹化法令’的制定者。今天，我们将要拆除‘人民大厅’，吉尔先生，您对此有什么想说的吗？”这位国家电视台的记者一边说着，一边将麦克风递到吉尔面前。\n\n吉尔微微欠身，说道：“今天，作为‘去纳粹化’进程的一部分，‘人民大厅’将被拆除。在此之后，我们将全面启动‘去纳粹化’进程，拆除所有纳粹纪念碑，更改所有与纳粹有关的机构、街道名称，彻底清除元首和民族社会主义的印记，同时，对所有纳粹党成员及其帮凶进行审判。历史的罪恶，终将得到清算。”说到这里，吉尔露出了微笑，他转过身，朝早已等候多时的工兵们走去。在国内外记者的镜头下，一名工兵走到吉尔面前，庄严地敬了个军礼。“报告长官，爆破准备完毕，请指示！”\n\n吉尔迈着坚定的步伐走到队伍前列，高高举起右手，大声喊道：“听我命令！一、二、三！”话音刚落，他用力地挥下了手臂，只听一声巨响，预先埋设的炸药同时爆炸，人民大厅的梁柱瞬间断裂，巨大的穹顶轰然倒塌，整个建筑仿佛融化一般，消失在滚滚烟尘之中。吉尔站在原地，目送着烟尘散去，然后转身离去，没有丝毫的留恋。他还有很多事情要做。"
 TaS_GEREpilogue.2.a: "一个新的时代，开始了。"
 TaS_GEREpilogue.3.t: "西西弗斯的苦役"
 TaS_denazification_tt: "远离故乡。"
 TaS_GEREpilogue.3.d: "吉尔的汽车，缓缓地行驶在柏林的街道上。随着人民大厅的倒塌，“日耳曼尼亚”计划彻底破产，愤怒的民众走上街头，游行示威很快演变成暴力冲突，德国人的怒火，似乎永远也无法平息。\n\n突然，意外发生了。在吉尔的车队经过一个抗议人群时，一个狂热的抗议者冲出人群，试图用手枪射杀吉尔，但沙皇卫队的子弹，比他更快。这个可怜虫还没来得及扣动扳机，便倒在了血泊之中。紧接着，一声巨响，这个亡命之徒引爆了身上的炸弹，试图与敌人同归于尽。幸运的是，爆炸发生在距离车队稍远的地方，但还是造成了一些伤亡。紧接着，周围的建筑物和人群中也传来了枪声——“狼人”组织，发动了袭击！\n\n这场战斗并没有持续多久，那些装备简陋的狂热分子，根本无法与训练有素的沙皇卫队抗衡，很快便被消灭殆尽。但这足以说明，现在还不是离开德国的时候，至少，现在还不是。"
 TaS_GEREpilogue.3.a: "占领仍在继续"
 TaS_GEREpilogue.4.t: "救赎"
 TaS_GEREpilogue.4.d: "纳粹无疑是冷酷无情的。即使在空袭和地面进攻最猛烈的时候，他们依然强迫奴隶们在工厂里干活，但这，还不是他们最残暴的一面。德国崩溃之后，纳粹军队并没有做出多少抵抗——如果那些与“狼人”组织的零星战斗也算数的话。更多的时候，是俄罗斯士兵将人们从废墟中，或者那些丧心病狂的“狼人”手中解救出来。获救的人们会得到必要的医疗救助，然后登记他们的身份信息以及之前的居住地，最后，他们将被火车送回家。\n\n无数捷克人、波兰人、犹太人、俄罗斯人…他们终于摆脱了纳粹的魔爪，获得了新生，并踏上了回家的路。但并不是所有人都如此幸运，许多人永远地留在了这片土地上，他们再也无法亲眼见证解放的到来了。"
 TaS_GEREpilogue.4.a: "听我指令，三，二，一！"
 TaS_spasenie_tt: "并不是所有的工作都是为了解放。"
 TaS_GEREpilogue.5.t: "行刑"
 TaS_GEREpilogue.5.d: "约瑟夫·拜尔利不是一个复仇心切的人，至少曾经不是。“莫斯科维恩”种植园的岁月在他身上留下的印记始终挥之不去，那复仇的火焰越烧越旺。也许，这仅仅是出于高尚的责任感，或者说，是为了自卫和反击。这其中，究竟有什么意义？\n\n作为中欧守备军的指挥官，拜尔利经常会陷入这种无休止的哲学思考，但今天，他没有时间去想这些。今天，他要执行一项特殊的任务，一项正义的任务。站在他面前的，不是普通士兵，也不是集中营的看守，而是一群帝国专员、大区领导、通敌者以及其他形形色色的社会渣滓——他们是种族灭绝的元凶，是双手沾满鲜血的刽子手。法庭已经做出了判决，现在，轮到拜尔利来执行正义了。\n\n也许，他可以让他们也尝尝那些受害者所经历的痛苦——但那样一来，他又和这些披着人皮的野兽有什么区别？审判这些恶魔，是上帝的职责，而他的职责，则是将他们送上审判台。拜尔利缓缓地举起手枪，对准了那些跪在地上的人。"
 TaS_GEREpilogue.5.a: "数到三！"
 TaS_kazn_tt: "惩罚必须是正义的。"
 TaS_GEREpilogue.6.t: "勇士"
 TaS_GEREpilogue.6.d: "老汉斯是一位坚定的爱国者，但他对权力毫无兴趣，无论是谁的权力。从两次世界大战，到西俄战争，再到内战，最后是俄罗斯的占领，权力已经夺走了他所珍视的一切，留给他的，只有满目疮痍的祖国和支离破碎的生活。俄国人来了，炸毁了他的房子，绞死了他的老朋友，他，一无所有。\n\n俄国人不仅炸毁了他的房子，还炸毁了供水管道。虽然他们承诺会修复，但汉斯并不相信他们。于是，他只能每天提着水桶，到附近的井里打水。一天，在去井边的路上，汉斯突然感到一阵剧烈的背痛，他不得不放下水桶，试图活动一下僵硬的腰背。就在这时，一个俄国士兵走了过来，好奇地看着他。汉斯听说过这些士兵是如何对待德国平民的——抢劫、杀戮、强奸，无所不为，这都是为了报复德国人在战争中犯下的罪行，但那都是过去的事了！他惊恐地后退了几步，做好了最坏的打算。\n\n士兵似乎注意到了他的恐惧，用俄语询问他是否需要帮助。\n\n汉斯听不懂俄语，而士兵显然也听不懂德语。他摇了摇头，指了指自己的耳朵——他不知道该如何才能让这个士兵明白自己的意思，恐惧占据了他的全部思绪。\n\n然而，士兵并没有像汉斯想象的那样对他施暴，而是笑了笑，拿起水桶，疑惑地摇了摇头。汉斯愣了一会儿，然后指了指自己家的方向，士兵会意地点了点头，扛起水桶朝他家走去，汉斯则一路小跑地跟在后面。\n\n这一切，都太不真实了，这个士兵，和报纸上描述的那些粗鲁的“蒙古蛮子”完全不一样。这，是陷阱吗？是俄国人的宣传？还是说，这只是一场精心策划的表演？汉斯想不明白，他的脑袋嗡嗡作响，也许，这些问题，应该去问那些他为之奋斗终生的政客，而不是这些素未谋面的“敌人”。纳粹的谎言，他早已见识过了，那为什么不能相信，他们在这一点上也在撒谎呢？为什么，接受真相，就这么难？\n\n泪水，模糊了汉斯的双眼。士兵放下水桶，转身擦了擦额头上的汗水，冲他笑了笑。汉斯仔细地打量着他：他很年轻，甚至比普通的德国新兵还要年轻。那么，究竟是谁，发动了这场毫无意义的战争？汉斯长叹一声，泪水夺眶而出。\n\n也许，是时候放下了。"
 TaS_GEREpilogue.6.a: "我们必须向前看了。"
 TaS_bogatyr_tt: "§Y谎言与真相终将水落石出§!"
 TaS_GEREpilogue.7.t: "凶兆"
 TaS_GEREpilogue.7.d: "约瑟夫·拜尔利的早晨和往常一样，洗漱、吃饭、刷牙，然后走进办公室，开始一天的文书工作——繁琐而重复的日常，让他感到厌倦。最近，他被一件事困扰着：捷克地区的人口普查数据出现了异常。德国人的人口数量急剧下降，但很快又恢复到了之前的水平，仿佛什么都没发生过一样。此外，他听到越来越多的士兵谈论捷克地区发生的怪事，他知道，一定是出事了，但具体是什么事，他却一无所知。\n\n这时，一份邮件送到了他的办公桌上。在那些白色的信封中，一个没有标记的棕色文件夹格外显眼。拜尔利好奇地打开文件夹，意识到潜在的安全风险时，已经为时已晚。\n\n幸运的是，文件夹里不是炸弹，也不是陷阱，而是一些照片——被杀害的德国人、站在旁边的捷克士兵、被驱逐的德国平民……\n\n显然，拍摄这些照片的人，不仅参与了这些事件，还希望其他人知道发生了什么。\n\n中欧守备军的指挥官立刻拿起电话，他要向解放区总局报告这件事。“约瑟夫，发生了什么事？”电话那头传来弗拉基米尔·吉尔的声音。"
 TaS_GEREpilogue.7.a: "“听着，弗拉基米尔，我们需要谈谈，立刻马上！”"
 TaS_czech_tt: "凡事都有底线。"
 TaS_GEREpilogue.8.t: "民族与民族主义者"
 TaS_GEREpilogue.8.d: "清晨，利贝雷茨的居民们一如既往地打开收音机，收听着国家广播电台的早间新闻。主持人慷慨激昂的声音，充斥着极端民族主义的论调，比以往任何时候都要狂热。今天，捷克国总统阿洛伊斯·格雷贝尼切克将在广播中发表讲话，宣布最新的政府法令，人们虔诚地守候在收音机旁，聆听着领袖的声音。\n\n“…我要再次提醒大家，我们，肩负着复兴捷克文化的伟大使命！为了消除德国文化对我们国家的影响，我们将不遗余力地推广捷克文化、捷克人民以及捷克的传统！很快，一系列新的法令就将生效，包括《捷克文化保护法》、《捷克民族保护法》、《捷克传统复兴法》等等！造成这一切的罪魁祸首，正是那些可憎的德国人！是他们，让我们民族再次遭受奴役！是他们，让我们在过去三十年里饱受屈辱和折磨！永远不要忘记，德国人，是我们所有问题的根源！”\n\n“因此，我宣布，成立国家安全营！他们是国家的守护者，是民族的英雄！他们有权将那些殖民者从他们窃取的房屋中驱逐出去，并将他们送到城外的特殊营地！记住，如果你们在重建祖国的过程中遇到了这些英雄，不要打扰他们！他们正在执行一项神圣的任务，一项将捷克民族从德国人的污点中洗刷干净的任务！我们将采取一切手段，从语言到文化，将去德国化和去纳粹化进行到底！所有的德国名字都将被改为捷克名字！伟大的捷克语将成为我国唯一的官方语言，任何人在公共场合使用德语，都将受到严厉的惩罚！”\n\n“捷克国只属于捷克人！”\n\n格雷贝尼切克的讲话结束了，但他的声音，却深深地印刻在了捷克人民的脑海中。人们的反应各不相同，有人欢呼雀跃，有人则惊恐万分，准备逃离这个国家。但很快，嘹亮的号角声便盖过了一切，新成立的国家安全营士兵迈着整齐的步伐，走上街头，将那些德国人——无论男女老少——从他们的家中拖出来，押送到城外。围观的人群沉默不语，只有少数人在欢呼，而士兵们则高声齐唱着他们的口号："
 TaS_GEREpilogue.8.a: "捷克国只属于捷克人！"
 TaS_cznation_tt: "悲剧不会重演。"
 TaS_GEREpilogue.9.t: "捷克之夜"
 TaS_GEREpilogue.9.d: "最后一批新兵正在接受训练，而其他部队，则已做好战斗准备。国家安全部队已部署到波西米亚各地，一场名为“捷克之夜”的行动即将拉开帷幕——他们的目标，是将所有的德国人驱逐出捷克。宣传机器开足马力，号召普通民众与军队站在一起，共同完成这项“伟大的事业”。在行动开始前的几个小时，一份特殊的法令送到了各个营地，法令规定，士兵们在驱逐德国人的过程中，可以不受任何限制地使用武力，即使将对方击毙也不负任何责任。\n\n终于，这一天到来了。随着格雷贝尼切克的一声令下，“捷克之夜”正式开始。波西米亚各地，针对德国人的暴力活动此起彼伏。按照事先制定的计划，国家安全营的士兵们开始了行动，他们冲进德国人的住宅，将他们赶到街上，遇到反抗的，格杀勿论。士兵们将这些德国人驱赶到一起，组成一支支队伍，将他们押送到边境。一路上，不时有人倒下，但没有人理会这些，他们的任务，是将德国人赶出去，不惜一切代价！\n\n第二天清晨， “捷克之夜”结束了，至少，第一阶段的行动结束了。接下来，他们还有一项艰巨的任务：将这些德国人尽快送出捷克。每个营都配备了五辆卡车，士兵们将尽可能多的德国人塞进卡车，然后把他们送到最近的边境。格雷贝尼切克在广播中向国家安全营的士兵们表示祝贺，并提醒他们，行动仍在继续。对德国佬复仇的时刻终于到了！"
 TaS_GEREpilogue.9.a: "荣耀属于阿洛伊斯·格雷贝尼切克，捷克国的守护者！"
 TaS_cznight_tt: "鲜血将得到净化。"
 TaS_GEREpilogue.10.t: "铭记1938年的慕尼黑"
 TaS_czmunich_tt: "当然这并不容易"
 TaS_GEREpilogue.10.d: "“捷克之夜”行动打了波西米亚的德国人一个措手不及，大多数人都无力抵抗，只能束手就擒。但在苏台德地区，情况却完全不同。由于德国人占人口多数，他们组织起了有效的抵抗。然而，面对装备精良、训练有素的国家安全营部队，他们的抵抗显得不堪一击。战斗变成了单方面的屠杀，愤怒的国防军老兵们，在库尔特·克尼佩尔的率领下，发动了起义。\n\n训练有素的士兵、充足的武器储备，再加上高昂的士气，克尼佩尔的部队给捷克军队造成了巨大的损失。但在光天化日之下，在敌占区活动，无异于自杀。因此，克尼佩尔决定，转入地下，开展游击战。他们不断地袭击国家安全营的部队，部队的人数也迅速增长。很快，他们便不再满足于夜间行动，白天也开始频繁出击，搞得捷克军队草木皆兵。\n\n如今，苏台德地区的捷克军队已经成了惊弓之鸟，他们不得不放弃原定的计划，仓促撤离。格雷贝尼切克不想让自己的士兵白白送死，他决定按兵不动，等待克尼佩尔犯错。而克尼佩尔，则依然坚持着游击战术，不断地袭扰捷克军队，并将他们从苏台德地区驱逐出去，用的正是格雷贝尼切克对付德国人的那一套。但有一点是可以肯定的，那就是…"
 TaS_GEREpilogue.10.a: "苏台德依然属于德国..."
 TaS_GEREpilogue.11.t: "无法回答的问题"
 TaS_GEREpilogue.11.d: "中午，格雷贝尼切克的电报员告诉他，解放区总局和中欧守备军要求他解释波西米亚地区，尤其是苏台德地区德国人的情况。格雷贝尼切克顿时慌了神，他没想到，吉尔和拜尔利这么快就知道了他的“小动作”。\n\n“他们要我们在一个小时内给出答复。”电报员面无表情地说。\n\n“该死！”格雷贝尼切克咒骂道，“随便编个理由，总之，不能让他们知道真相！”\n\n“好的。”电报员点了点头，转身离开了办公室。\n\n“必须赶在他们发现之前……”格雷贝尼切克一边想着，一边飞快地写下一道命令。“鉴于苏台德地区的严峻局势，我命令，彻底消灭盘踞在该地区的‘德国残余武装’！务必夺取所有重要的基础设施，‘捷克之夜’行动在苏台德地区立即终止！”这道命令被迅速传达到了捷克军队的所有单位，指挥官们立刻调动部队，向“德国残余武装”的“据点”进发。\n\n可以预见的是，捷克军队的伤亡将急剧上升，但军令如山，他们别无选择……格雷贝尼切克同时要求部队秘密行动，避免被解放区总局和中欧守备军发现，因为他根本不知道该如何向他们解释。"
 TaS_GEREpilogue.11.a: "立刻镇压这些叛乱分子！"
 TaS_czguot_tt: "一场与时间的赛跑。"
 TaS_GEREpilogue.12.t: "朋友有时候是种负担"
 TaS_baader_tt: "真正的朋友不会让你独自面对困境。"
 TaS_GEREpilogue.12.d: "没完没了的电话铃声几乎要把瓦尔特逼疯了。他原本计划6点就能下班，可现在已经快8点了。资金申请、纳粹余孽的处理方案、红军暴行的报告——这些麻烦事整天萦绕在他心头，挥之不去。施密特这家伙真是命大，他可没打算浪费掉这第二次机会。\n\n电话终于安静了下来，施密特终于可以喘口气了。他给自己倒了一杯威士忌，一边品味着辛辣的酒香，一边凝视着窗外的景色。夕阳的余晖刺痛了他的双眼，他下意识地转过头去。耳边传来清脆的鸟鸣，人们踏着夜色归家。“真美啊！”瓦尔特不禁感慨道。一杯酒下肚，他又开始拨打电话。\n\n突然，一阵敲门声打断了他的思绪。“抱歉，我得先接个电话。”瓦尔特匆匆对着话筒说了句，便起身去开门。来者正是安德里亚斯·巴德尔，他曾经的战友，如今是红军中举足轻重的领袖人物，与乌尔丽克·梅因霍夫齐名。\n\n“你好啊，老伙计！”施密特满面春风地打着招呼。\n\n“很高兴见到你，” 巴德尔回应道。\n\n“什么风把你吹来了？” 施密特一边询问着，一边又给自己倒了杯威士忌。\n\n“谢谢，我很好。” 巴德尔说道，“我来谈点事。”\n\n“那就有话直说吧。” 施密特兴致盎然地说道。\n\n“我们的人找到了‘狼人’的踪迹。我们当然会尽量和平解决，但也不排除采取强制措施。到时候，希望你能睁一只眼闭一只眼。”\n\n“没问题。” 施密特不假思索地答应了。“你应该明白其中的风险吧？”\n\n“当然，瓦尔特。但他们的罪行罄竹难书，你也知道……”\n\n“好吧。但这是最后一次，明白了吗？”\n\n“当然，瓦尔德马，当然。”安德烈亚斯说着便急匆匆地离开了。\n\n来自红军和其他武装组织的类似请求还有很多，而瓦尔德马对这些请求总是照单全收。因为他坚信：“知己知彼，百战不殆。”"
 TaS_GEREpilogue.12.a: "国家元首也不好当啊。"
 TaS_GEREpilogue.13.t: "人行道上的谋杀"
 TaS_fmeinhoff_tt: "那他心里还装着谁呢？"
 TaS_GEREpilogue.13.d: "汉诺威的街道空无一人，路灯依次亮起，巴德尔径直走向酒吧。不，他可不是想去借酒消愁。他和梅因霍夫约在这里碰头。自从威斯特伐利亚的民主政府建立以来，她的处境每况愈下，生命也仿佛进入倒计时。\n\n巴德尔按时赴约，一杯接一杯地喝着啤酒。突然，一只手揪住他的衣领，将他从后门一路拖到大街上。\n\n“你疯了吗？”梅因霍夫压低声音怒斥道，“你见过哪个狼人会跑到酒吧喝酒？”\n\n“我……我只是……”安德里亚斯支支吾吾地解释着，他显然喝多了。\n\n“趁着还没人发现，我们赶紧离开这里。”\n\n“好……”\n\n他们沉默地走着，不时交换着眼神，评估着眼前的局势。终于，当他们抵达公园时，他们终于可以开始讨论接下来的计划了。\n\n“自从大日耳曼国覆灭后，红军的规模已经缩减了不少，很多人都认为我们已经完成了历史使命。但我们知道，还有很多工作需要完成。”梅因霍夫说道。\n\n“我们需要掀起新一轮的宣传攻势。还有很多年轻人，他们渴望找到精神寄托，为之奋斗终生。”\n\n“我同意你的观点，但我们必须小心谨慎，我们已经……”话未说完，一颗狼人射出的子弹便击中了梅因霍夫的胸口。巴德尔不顾一切地朝着枪声响起的方向扫射，直到听到一声微弱的呻吟才停下。他抱起乌尔丽克，她的气息越来越微弱。\n\n“该死的狼人……”梅因霍夫用尽最后一丝力气说道。\n\n“别说话！坚持住！你不能死！”安德里亚斯大声喊道，“我们还有很多事情要做！”\n\n“记住……你……必须……继续……在德国……进行革命……明白了吗……”她再也没有了任何反应。巴德尔必须尽快逃离现场。他走到那名枪手身边，将弹匣里的子弹全部倾泻在他的身上。他知道自己该去哪里。"
 TaS_GEREpilogue.13.a: "去瓦尔德马·施密特的办公室。"
 TaS_GEREpilogue.14.t: "最后通牒"
 TaS_baadersdamn_tt: "§Y他到底像谁呢？§!"
 TaS_GEREpilogue.14.d: "施密特像往常一样准时来到办公室。他预料到今天又是例行公事的一天，要和各种各样的人打交道，所以他带了午饭，以免在工作时间被打扰。第一通电话，第一个棘手的问题，以及第一个敷衍的答案，一切都没有任何新鲜感。直到巴德尔的到来，打破了这一天的平静。\n\n他毫无预兆地冲进办公室，看见瓦尔特正在挂断电话，便迫不及待地开口说道：\n\n“他们杀了乌尔丽克，瓦尔德马，他们杀了乌尔丽克！”\n\n“谁干的？！”施密特惊愕地问道，手里拿着还没吃完的三明治。\n\n“那些该死的狼人！在大街上，瓦尔特，就在大街上！”安德里亚斯上气不接下气地说道。\n\n“我知道了。”施密特沉着脸说道。\n\n“不，瓦尔德马，你根本不明白！”安德里亚斯激动地说，“她死在我的怀里！我必须继承她的遗志，我们的事业，你明白吗？！”\n\n“我会为她举行葬礼……”\n\n“葬礼有个屁用！”安德里亚斯粗暴地打断了他的话，“那些杂碎还会回来的，他们会杀了我们所有人。必须把他们全部消灭，一个不留！我要亲手解决他们，只要你点头。”\n\n“你想对狼人展开屠杀？”瓦尔德马问道。\n\n“没错，时代需要我们这么做。”安德里亚斯坚定地说。\n\n“不行，”施密特冷静地拒绝道。\n\n“你什么意思？”巴德尔难以置信地问道。\n\n“我不会允许威斯特伐利亚的土地上再次燃起战火。我的答案是，不行，这是我的最终决定。我理解你的痛苦，但这太过火了。”施密特耐心地解释道。\n\n“你会后悔的，一定会！当革命的烈焰席卷德国时，你会跪下来求我，但我不会可怜你，你一定会后悔的！你会和那些该死的狼人一起被埋葬！”安德里亚斯·巴德尔咆哮着，卫兵强行将他架出了办公室。\n\n施密特望着窗外，阳光已经洒满了中央广场。“希望乌尔丽克会原谅我和他，”瓦尔特心想。他在窗边站了一会儿，然后回到他的橡木桌前坐下，心中五味杂陈，他意识到…"
 TaS_GEREpilogue.14.a: "他失去了一个朋友。"
 TaS_GEREpilogue.15.t: "沉浸在思绪（和睡梦）中"
 TaS_sleepymax_tt: "这就是身为君主的负担啊。"
 TaS_GEREpilogue.15.d: "议会大厅里，为制定宪法所做的准备工作正在有条不紊地进行着。来自不同党派的政客们轮流表达着他们对草案的看法，从优缺点到在如此时刻颁布宪法的意义，事无巨细，一一陈述。而在一片单调乏味的陈词滥调中，巴登的领袖马克西米利安只是沉默地坐着，偶尔点一点头，以示礼貌。\n\n事实上，从一开始他就恳请同僚们让他离开，并表示会议没有他也一样进行。但他们态度坚决地反对道：“如果你不在场，那我们聚在这里就毫无意义了。”马克西米利安倒希望取消这场无聊的会议，但内心深处却有个声音驱使着他来到这里。\n\n他已经在这里待了将近一个半小时，耳边一直充斥着各种声音。“上帝啊，这些人是有一千张嘴吗？”这位新晋君主在心里哀叹道。对于他而言，现在的身份和地位都像是意外之喜。他稀里糊涂地成为了巴登国王最近的继承人——至少他是这么认为的。无论如何，他根本不知道该如何治理国家，也不想这样做，但命运就是如此捉弄人。\n\n他在心里咒骂着在座的每一个人，怪他们将他从心爱的葡萄园里拖了出来。他本是巴登最优秀的酿酒师之一，可现在却不得不坐在这里，听这些老家伙们喋喋不休。思绪越飘越远，马克西米利安不知不觉间竟睡着了。然而，如果他知道自己睡着了，也并不会感到过分在意。毕竟对他来说，睡觉都比听取《巴登-符腾堡王国新宪法草案》有意义得多。"
 TaS_GEREpilogue.15.a: "我太理解他了…"
 TaS_GEREpilogue.16.t: "做国王可真难"
 TaS_depressioninking_tt: "区区一个小时，不会有什么影响。"
 TaS_GEREpilogue.16.d: "他终于自由了。在经历了数日被拖着辗转于各个办公室和等候室的折磨后，他终于可以喘口气了。他立刻动身前往自己的酒庄——对他来说，没有什么比待在酒庄更惬意、更有意义的事情了。他叫上自己的司机兼酿酒师好友，不到半小时就回到了工作室。\n\n和工人们寒暄了几句后——他都认识他们，并且和他们关系很好——他来到了品酒师兼好友达克·萨尔德这里。马克西米利安向他抱怨着自己混乱的生活，达克则为他开了一瓶新鲜的半干红葡萄酒。这位君主欣然接受，并在向这位值得尊敬的朋友表示感谢后，便匆匆赶往了自己的书房。\n\n今天，他决定做点“正事”——阅读。但他明智地选择了内容。“在度过了如此忙碌的一周后，是时候放松一下了！”马克西米利安心想。他从书架上取下了阿瑟·柯南·道尔的《福尔摩斯探案集》，为自己倒了满满一杯红酒，然后舒服地窝进了扶手椅里开始细细品尝，试图分辨出其中最微妙的味道。但第一杯很快就见底了，马克西米利安还没品出个所以然来，于是又倒了一杯，再一杯…当酒瓶见底时，这位君主的手无力地垂落下来，书也从手中滑落，最后，他倚在椅子上睡着了。"
 TaS_GEREpilogue.16.a: "也许我和他有点像…"
 TaS_GEREpilogue.17.t: "狂欢结束"
 TaS_GEREpilogue.17.d: "起初，马克西米利安完全没有意识到发生了什么。他的耳边嗡嗡作响，眼前的一切都模糊不清。他呆呆地看着自家房子的玻璃窗，只见原本光洁的玻璃上，裂纹如蛛网般蔓延开来，正中央赫然是一个弹孔。虽然还没搞清楚状况，但他本能地意识到危险正在逼近，于是慌慌张张地钻进壁橱，开始穿衣服。窗外，枪声、 尖叫声，以及杂乱的脚步声，交织在一起，令他心惊胆战。半分钟后，一群身穿黑色制服的士兵破门而入，他们是国王卫队的成员，负责保卫国家元首的安全。为首的那个人，递过自己的头盔，语气冰冷地说道：“殿下，请跟我们走一趟。”\n\n“好吧，”这位酿酒师战战兢兢地答应着，跟着他们走向门外。\n\n虽然他很想知道到底发生了什么事，但求生的本能让他克制住了自己的好奇心，直到坐进车里。\n\n“到底发生了什么？”马克西米利安问道。\n\n“有人要刺杀您，殿下。”坐在副驾驶座上的士兵头也不回地回答道，“您最近颁布了几条针对前纳粹分子的法令，他们这是要造反，想要推翻您和您的政府！根据我们目前掌握到的情报，巴登-符腾堡州西部爆发了法西斯分子叛乱，叛乱的领导者，就是那个该死的恩斯特·雷默！”\n\n“那我们接下来该怎么办？”\n\n“我们先带您去安全屋，然后请求柏林方面的指示。”\n\n听到这样的答复后，马克西米利安沉默了。他最后看了一眼自己的房子和酒庄，心中暗道："
 TaS_GEREpilogue.17.a: "狂欢结束了，人民需要的是选择！"
 TaS_badenrevolt_tt: "他们进来的时候根本没有敲门。"
 TaS_GEREpilogue.18.t: "交易"
 TaS_GEREpilogue.18.d: "“我还真是幸运啊！”瓦尔特·谢埃尔坐在书房里，暗暗感慨。他在俄军跨越奥得河时发动起义的决定，无疑为莫斯科方面提供了一份绝佳的“合法性证明”。吉尔亲自登门拜访，与他就出任国家元首的条件进行了商讨。\n\n突然，电话铃声响起。他接起电话，听到一个男人说道：\n\n“您好，请问是瓦尔特·谢埃尔先生吗？”\n\n“是我，您哪位？”瓦尔特略带诧异地回答。\n\n“很荣幸能和您通话。我有一项非常有意思的提议想跟您谈谈。”男人说道。\n\n“洗耳恭听。”\n\n“是这样的，我过去和纳粹关系密切，而且我本身也是一名大型企业家，所以我很担心自己的未来…”\n\n“我理解。”谢埃尔回答道，“您是想在莱茵地区安顿下来吧？作为回报，我可以为您提供周全的保护。此外，我的人民也愿意为您效力。相信我，这对你我而言是双赢的局面。”\n\n谢埃尔沉思了几秒钟，最终回答道：“我认为您的提议很有吸引力，我可以为您提供土地，并处理好所有文件。”\n\n“很好。”企业家回答说，“关于安全保障的细节，我会在之后详谈。”\n\n“好的，再见。”谢埃尔结束了通话。\n\n又一个纳粹分子为了躲避新政府的清算逃往莱茵地区，而谢埃尔做出了一个艰难的决定——庇护他们。作为回报，他得到了宝贵的劳动力和其他好处，比如安全保障之类的。但他开始意识到，如此大规模的庇护难免会引起一些人的警觉，包括驻军和吉尔。或许他应该减少这类“难民”的涌入，但他实在太贪恋眼前的利益了。"
 TaS_rheinsecret_tt: "财不可露白啊。"
 TaS_GEREpilogue.18.a: "希望没人会发现莱茵地区的小秘密。"
 TaS_GEREpilogue.19.t: "纸包不住火"
 TaS_rheinnazis_tt: "这次算他走运。"
 TaS_GEREpilogue.19.d: "夜幕降临，瓦尔特决定放松一下。他坐在椅子上，小口啜饮着浓烈的杜松子酒。突然，电话铃声响起。\n\n“喂。”谢埃尔疲惫地应了一声。\n\n“你好，瓦尔特。”电话那头的声音令他心头一紧。谢埃尔立刻就明白了对方的身份，他放下酒瓶，故作镇定地问道：\n\n“你好，弗拉基米尔。”他指的是吉尔。\n\n“最近怎么样？”吉尔问道。\n\n“还行吧，不算太糟。”\n\n“那就好。不过，我想问问你，你打算收留那些纳粹多久？”吉尔明知故问，语气中透着一丝狡黠。\n\n“我很快就会停止收留他们。”\n\n“很快？那是多久？”吉尔追问道。\n\n“下个月之内。”\n\n“好吧，那你一共接收了多少纳粹？” 吉尔的语气越来越咄咄逼人。\n\n“我怎么知道，我又没有做记录。” 谢埃尔回答，“你估计一下吧。”\n\n“大约有几百名各级官员。” \n\n“好吧，瓦尔特。你知道我一直很器重你，所以我不想干涉你的事情。但你要记住，你只能再做一个月。”\n\n“当然，弗拉基米尔。我会尽快关上那扇大门的。”\n\n“那就好，回头再聊。”\n\n“下次再聊。”谢埃尔回答道，长长地舒了一口气。在此之前，从没有人向他索取过这么多信息。他已经意识到…"
 TaS_GEREpilogue.19.a: "这事儿还没完。"
 TaS_GEREpilogue.20.t: "斯特拉斯堡的“寻常”一日"
 TaS_rheinrevolt_tt: "凡事皆有代价。"
 TaS_GEREpilogue.20.d: "过去几周，莱茵地区的局势发生了翻天覆地的变化。自从纳粹的涌入被强行遏制后，零散的狼人部队却蜂拥而至，试图改变现状。谢埃尔或许预料到了他们会采取行动，但他绝对没有想到会是以这种方式。\n\n上午十点，几辆满载着全副武装的狼人的卡车开进了斯特拉斯堡的中央广场。他们包围了谢埃尔的行政大楼，不允许任何人靠近。很快，他们的头目便提出了要求：斯特拉斯堡的武装力量必须放下武器，而瓦尔特必须和他的卫兵一起投降。他们只给了谢埃尔半个小时的时间考虑。\n\n他陷入了绝望的境地，狼人们切断了电话线和大部分的电报线，瓦尔特插翅难逃。他请求包围圈的头目允许他将女性工作人员放走，对方考虑过后同意了。“现在，我问心无愧了。” 谢埃尔想道。半小时后，狼人要求他给出答复。如果拒绝，他们就要炸毁大楼。谢埃尔冷静地评估了形势，同意交出城市的驻军并投降。\n\n正当他以为自己难逃一死时，从不同的街道上突然响起了枪声，武装人员向狼人发起了进攻。谢埃尔决定放手一搏。他从一名阵亡士兵手中接过机枪，对着狼人扫射。狼人部队被打了个措手不及，他们决定放弃斯特拉斯堡，撤往别处。但为时已晚，所有的退路都被封锁了，只好选择投降。\n\n原来，一名纳粹士兵在入侵时，正好在莱茵首府休假。他及时发现了狼人的行动，并迅速通知了他的战友，附近的纳粹部队立刻赶往斯特拉斯堡，这才化解了这场危机。瓦尔特·谢埃尔亲自嘉奖了这位士兵，并表示要为他授勋。\n\n惊魂未定的瓦尔特，独自回想着刚才发生的一切。“这只是一个开始，”他低声自语道，“纳粹已经感受到了自己的力量，所以才会发动进攻。从某种程度上说，他们是正确的。”一阵急促的电话铃声打破了沉默。谢埃尔不用猜也知道是谁打来的——莫斯科，吉尔或是拜尔利，是谁都无所谓，他现在必须尽快想办法，保住自己的位置。"
 TaS_GEREpilogue.20.a: "这注定是一场漫长的谈话。"
 TaS_GEREpilogue.21.t: "复仇"
 TaS_bavariarasplate_tt: "但这不能让她回来。"
 TaS_GEREpilogue.21.d: "威斯特伐利亚边境附近的夜晚躁动不安，一群身着制服的人在森林边缘的树丛中忙碌着。他们之中有前帝国军官、士兵，甚至还有一位衣冠楚楚的实业家。夜深了，他们尽量保持安静，以免引起巴伐利亚军队的注意。\n\n时间一分一秒地流逝，他们开始焦躁起来。年轻的军官海因里希走向他的旧识——齐格弗里德，他们曾在德国军队中共事，一同经历过内战和第二次西俄战争的战火洗礼。\n\n“你觉得…”海因里希开口道，“他会不会抛下我们，卷款跑路了？”\n\n“听着，我认识马克斯很久了，他帮很多人越过边境，别担心。”\n\n“但他去了很久，我感觉有人在监视我们。”\n\n“老兄，你只是紧张过度了。会没事的。”\n\n“也许你是对的。”海因里希叹了口气，情绪稍稍平复。 突然，空地骚动起来。一声枪响划破夜空，随后武装人员涌入空地。最终，所有试图逃跑的人都尽数被押上一辆印有巴伐利亚国徽的卡车。马克斯站在一旁，冷眼旁观着这一切。他会感到内疚吗？不，他这是在向纳粹复仇。他会继续这样做吗？当然，他永远不会忘记他们对玛雅犯下的罪行。"
 TaS_GEREpilogue.21.a: "正义终将伸张。"
 TaS_GEREpilogue.22.t: "演奏"
 TaS_bavariavystup_tt: "他再也听不到掌声了。"
 TaS_GEREpilogue.22.d: "沃尔特已经弹了……大概一天了，他自己也记不清时间了。他不眠不休地坐在破败房屋里的钢琴前，机械地演奏着。每隔十五分钟，他就会重复一遍相同的旋律。他无法停止，即使手指上的皮肤几乎磨损殆尽，他也必须继续下去，因为一旦停下来，等待他的就是一颗子弹。巴伐利亚部队的巡逻队已经换了好几班，大概是第五班了。\n\n他的头一阵阵抽痛，泪水模糊了双眼，但他仍然坚持着。周围站着他们——衣衫褴褛、胡子拉碴的士兵们。不久前，他们还是奴隶，而现在，他们成了他的监工。他们笑着，欢呼着，音乐显然取悦了他们的耳朵，但沃尔特的体力正在迅速流失，这位前帝国士兵很快就要昏厥过去了。\n\n终于，他再也支撑不住了。“求求你们……放了我……我只是个司机……我……我很抱歉。”这位被迫的音乐家哭喊着。很快，他感到有人拍了拍他的肩膀。在嗡嗡作响的耳鸣声中，他听到一句：“冷静点。”他艰难地抬起头，睁开被泪水浸透的双眼，看到一根黑洞洞的枪管正对着自己。一瞬间，白色的琴键被鲜血和纳粹士兵的头骨碎片覆盖。“我们得告诉下一位，演奏会结束了。”一个士兵说道。“是啊，他最后弹得都走调了。”另一个士兵附和道。士兵们离开了这栋建筑，留下音乐家倒在血泊中。下一班巡逻队会来处理尸体。"
 TaS_GEREpilogue.22.a: "返场演出结束"
 TaS_GEREpilogue.23.t: "背叛"
 TaS_bavariacommie_tt: "是时候剪断鹰的翅膀了。"
 TaS_GEREpilogue.23.d: "今天，弗朗茨的怒火几乎要冲破天灵盖。巴伐利亚精心策划的去纳粹化进程竟然受阻了！而罪魁祸首又是谁呢？该死的巴德尔和他的社会主义者！他们攻城略地，军队却束手无策。\n\n更令人发指的是，这群混账东西居然开始把送去工厂再教育的纳粹分子放了出来。不，不，事情比这更复杂。那个天杀的巴德尔从来就不是什么反纳粹者。他披着红色的斗篷，骨子里却还是个混蛋，只不过现在变成了一个红褐色的混蛋！\n\n这不能再继续下去了！绝对不能！如果该死的巴德尔以为他能再次把德国拖入野蛮的深渊，那他就大错特错了…错得离谱！弗朗茨猛地从办公桌前站起身，大步走向紧急军事会议。“如果这些该死的纳粹分子真的想复仇，我会好好给他们上一课。我会亲眼看着整个德意志在烈火中燃烧，直到最后一个杂种死去！”他一边想着，一边穿上了制服。\n\n那些桀骜不驯的北德意志人将为他们的愚蠢付出代价…"
 TaS_GEREpilogue.23.a: "而我会亲自监督这一切。"
 TaS_GEREpilogue.24.t: "一个时代的结束和另一个时代的开始"
 TaS_ottohere_tt: "荣归故里。"
 TaS_GEREpilogue.24.d: "“家，甜蜜的家！”——奥托走下飞机，心中默念道。他回到了自己的祖国——奥地利。他见证了它的崛起和灾难性的衰落，一度以为自己再也无法踏上故土。但命运却另有安排。迎接他的是一群真心为他感到高兴的人们。“回来真好！”奥托拭去眼角的喜悦泪水，说道。\n\n舱门口，一辆豪华轿车早已等候。兴奋的奥地利民众追着车子跑，但它很快便将人群甩在身后。“欢迎回来，奥托，”议员说道，“我们有很多工作要做。”奥托赞许地点了点头。接近维也纳机场时，奥托下了车，步行走完了抵达的全部流程，以示自己与民众一样，并无特殊。\n\n就在这时，奥托看到了最让他欣慰的一幕：十几个士兵在民众的支持下，正在拆除一座阿道夫·希特勒的雕像。记者们立刻围了上来，想请奥托就此事发表看法。奥托一言不发，径直走向等候的车辆。\n\n在车里，他告诉司机，他为那些正在清除“社会渣滓”印记的人们感到骄傲。司机表示赞同，并说自己也参与了奥地利的去纳粹化工作。奥托称赞了他，之后两人一路无言。 “奥地利人果然是世界上最好的人民。” 奥托心想。"
 TaS_GEREpilogue.24.a: "未来和工作都在前方等着他。"
 TaS_GEREpilogue.25.t: "回忆"
 TaS_ottovienna_tt: "或许在另一个世界..."
 TaS_GEREpilogue.25.d: "夜幕降临，奥托很快处理完公务，准备动身。锁好办公室的门，他走向衣帽间取回自己的外套。“陛下这是要去哪里？”一位年轻的女清洁工问道。“去公园散散步，”奥托简短地回答，“我想在夜晚的维也纳街头漫步。” 他穿好衣服，离开议会大厦，朝着公园走去。\n\n夜色撩人，奥托沉浸在自己的思绪中。他看到了一个强大的德意志-奥匈帝国联盟，携手共渡危机。他坚信君主制才是适合整个欧洲的最佳政体。他思索着协约国在一战中获胜的原因，以及如果同盟国获胜，世界就不会遭受纳粹和法西斯的荼毒。\n\n时间在不知不觉中流逝，转眼已近晚上十点。奥托匆忙回过神来，赶忙踏上回家的路。漫步在心爱的维也纳街头，他的脑海中不禁浮现出其他的城市。柏林，这座曾经的世界之都，已经被阿尔伯特·施佩尔改造成了一个丑陋的混凝土巨兽，其主要目的就是彰显纳粹的权力。罗马在纳粹统治下受到的破坏要小得多，但也被变成了“武力的展示场”。而维也纳却依然保持着昔日的风采，这让他倍感欣慰。古老的街道、蜿蜒的小巷，都在提醒着他那个奥匈帝国辉煌的年代。\n\n回到家，望着灯火辉煌的维也纳，他意识到…"
 TaS_GEREpilogue.25.a: "这座城市才是他真正想要生活的地方。"
 TaS_GEREpilogue.26.t: "原则及其践踏"
 TaS_austriarevolt_tt: "从现在开始，这就是我的问题了。"
 TaS_GEREpilogue.26.d: "这一天原本风平浪静，没有任何迹象预示着麻烦的到来。奥托·冯·哈布斯堡像往常一样处理政务。正当他埋头撰写给会计部门的报告时，一位年轻的卫兵气喘吁吁地冲了进来，语气清晰而坚定：“陛下！红色分子在我国北部发动了起义！” 奥托略感惊讶，但并没有慌乱。他沉思片刻，回答道：“这在意料之中。在我们这个‘美丽新世界’，这是不可避免的。如果你把权力交给右派，左派就会崛起，反之亦然。世界在变化，人力有时而穷。”\n\n他沉默下来，久久地凝视着窗外。太阳正值中天，绿意盎然，令人心旷神怡。但远方，乌云正在汇聚，一场风暴即将来临。“您打算怎么办？”卫兵焦急地问道，呼吸仍然急促。奥托又望了一会儿窗外，然后转过身，坐回桌前，语气中带着一丝痛苦：“奥地利人虽然勇敢无畏，但也愚蠢至极。出动军队吧。” 卫兵迟疑了一下，似乎还在期待着另一场“精彩绝伦”的演讲，最终还是点了点头，冲向电话。\n\n很快，奥托叫来助手，让他接通吉尔的电话。一丝不苟的奥托打算向柏林详细汇报奥地利的情况。这或许会引起柏林方面的焦虑，但他确信奥地利人不会听从任何人的摆布。他再次斟酌了一下措辞，然后拿起了电话。\n\n“您好，奥托先生，我是弗拉基米尔·吉尔。”"
 TaS_GEREpilogue.26.a: "“午安，弗拉基米尔，我有个坏消息……”"
 TaS_GEREpilogue.27.t: "头等舱"
 TaS_GEREpilogue.27.d: "雷默已经马不停蹄地奔波了一整天，他正赶往斯特拉斯堡附近的一个紧急集结地，评估先前作战计划的成果。很显然，事情并没有按预期发展。不仅占领威斯特法伦和巴登的计划落空，当地领导人奇迹般地逃脱了死亡的命运，而且该死的巴德尔还发动叛乱，把一切都搞砸了。\n\n西德意志，这块曾经的铁血土地，如今在他眼前支离破碎，如同打满补丁的破布一般。接近城市时，奥托-恩斯特听到了防空警报的尖啸和震耳欲聋的炮弹爆炸声。很明显，莱茵联盟军队正准备在该地区发动攻势，将“狼人”部队击退。这位帝国将军绝不允许这样的事情发生。\n\n抵达集结地后，奥托走下装甲运兵车，亲眼目睹了这支新组建的军队：衣衫褴褛、面黄肌瘦、眼神狂热——这就是帝国最后的忠诚者们。眼前的景象令人沮丧，雷默的思绪也不禁飘向了30多年前的那场战争，想起了1941年的闪击战和与苏联的殊死搏斗。尽管最初看起来，广袤的苏联领土似乎要将德国的战争机器整个吞噬，但他证明了，日耳曼精神是不可战胜的！而现在，他将再次证明这一点。\n\n当这位总司令走向指挥部时，一个念头突然闪过他的脑海：他现在所进行的战争，不过是30多年前那场战争的回响。他说的每一个字都是一颗子弹，下达的每一项命令都是一枚手榴弹。而站在这一切顶点的，正是战士雷默，这位最后的忠诚者，他将像指挥交响乐团一般指挥军队，摧毁一切…"
 TaS_GEREpilogue.27.a: "就像第二次世界大战那样。"
 TaS_remerstate_tt: "为了雷默元首，为了第三帝国的重生！"
 TaS_GEREpilogue.28.t: "启明星"
 TaS_baaderstate_tt: "起来，饥寒交迫的奴隶！"
 TaS_GEREpilogue.28.d: "萨尔茨堡从清晨起就陷入了动荡。由于没有接到上级的命令，城里的驻军在夜间向暴动的工人开火，这一举动成了致命的错误。到了七点钟，驻军被彻底击溃，刽子手士兵的尸体被吊在街灯杆上，整座城市弥漫着疯狂的气息，革命的狂潮一刻也不停歇。\n\n十点钟左右，商店、银行和警察局遭到洗劫，所有这些都成了民众愤怒的目标。不久之后，军火库也在人群的冲击下沦陷。领导这一切的正是亲自来到城中的巴德尔。\n\n午饭时分，巴德尔站在广场中央，周围是那些饱受资产阶级压迫、受够了纳粹和俄国人统治的普通民众。纳粹和俄国人占领了这片土地，后来又将德国拱手让给了忠诚的沙皇。现在显然不是长篇大论的时候，但巴德尔知道该怎么做。他像半个世纪前另一位革命领袖一样，敏捷地爬上了一辆装甲车，开始发表演讲：“同志们！奥地利和德国的工人们！推翻帝国主义枷锁，将德国从资产阶级和外国势力手中夺回来的时刻到了！今天，资产阶级送给我们一份前所未有的礼物！他们给了我们机关枪！我们将用它来攻克那些不愿接受革命的城市！你们正在见证一个新德国的诞生——一个自由、诚实、强大的德国！同志们，让我们朝着共产主义的目标大步迈进，将祖国从魔爪中解放出来！” 演讲结束后，巴德尔决定仔细看看周围的人群。\n\n他们不是衣衫褴褛的乌合之众，也不是可以随意消耗的炮灰。他们欢呼雀跃，高喊口号，他们愿意跟随巴德尔前往任何地方，哪怕是地狱，只为再次让德国伟大。然而，在检阅人群之后，巴德尔心中却浮现出一个异样的念头。他远离人群和喧嚣，独自思索着：“我听到的最后一声会是什么？我希望是枪声…”\n"
 TaS_GEREpilogue.28.a: "…还是不去想那些来不及做的事情。"
 TaS_GEREpilogue.29.t: "电影"
 TaS_GEREpilogue.29.d: "库尔特从小就喜欢看电影。在那时，他就惊叹于画面在眼前鲜活起来的神奇魔力。在《意志的胜利》中，他仿佛亲临了纳粹党第六次代表大会的现场；古代和现代的英雄人物在他眼前一一复活。总而言之，电影画面对他有着难以置信的强大影响。\n\n后来，战争爆发了，库尔特觉得自己就像个大英雄，或者至少宣传机器是这么塑造他的。“史上最高效的坦克手”、“希特勒的坦克王牌”……各种称号像雨点般落在他头上，他成了许多人心目中的英雄。但在内心深处，他并不明白，这场战争真的有必要吗？毕竟，有些战争的发生毫无缘由。\n\n战后，他只想一个人静静地生活，但这却成了奢望。即使是苏台德的房子、家人和一群忠心的仆人也无法让他摆脱良心的谴责。每个夜晚，他都会从噩梦中惊醒；每个早晨，他都宁愿离开家门，到外面消磨时光。\n\n而现在，这位坦克手终于有机会成为他士兵们真正的英雄。他爬上坦克，他知道夜晚短暂，而目标还很遥远。很久以前，他向德国人民承诺，他会战斗到最后一刻，而现在，是时候兑现承诺了。他要成为那个他一直被称呼、也一直渴望成为的角色…"
 TaS_GEREpilogue.29.a: "最后的英雄。"
 TaS_sudeten_tt: "我们正准备着最后的进军。"
 TaS_GEREpilogue.30.t: "我累了"
 TaS_GEREpilogue.30.d: "一开始，一切都还算平静。雷默的阵地附近没有炮弹落下，甚至让他产生了一种错觉，以为和平已经降临。新德国的敌人暂时被打败了，他终于可以稍作休息。他拖着疲惫的身躯，动作迟缓地走到衣柜前，看着那件沾满血迹的制服，心想：“以后得订做一件新的了。” 他正要转身离开，却还是决定在椅子上坐一会儿，几分钟的时间不会改变什么。\n\n然而，意外发生了。一阵急促的敲门声打破了这位新元首的所有计划。站在门外的是一名年轻士兵，他神色慌张，头发凌乱，显然是发生了什么紧急情况。“火箭！俄国人发射了火箭！” 没有敬礼，没有称呼，但仅仅一句话就足以让雷默的瞳孔骤然放大。他的心脏剧烈跳动起来，仿佛有一场音乐会在他脑海中奏响，将他仅存的理智一点点挤压殆尽。\n\n接下来的事情已经无法用语言来描述。雷默怒气冲冲地跳上装甲运兵车，直奔最近的掩体。他的脑海中一片混乱，各种念头翻滚着。所有的计划都被打乱了，一切都没有意义了。躲在地堡里还有什么意义吗？\n\n然而，经过半个小时的颠簸，装甲运兵车还是在一个隐蔽的地方停了下来。那是位于德国森林深处的一个掩体，空间狭小，补给有限，只能容纳一个人。士兵们最后一次向雷默敬礼，目送他关上舱门。他不愿相信，自己毕生的心血，竟然要因为该死的俄国人而第二次毁于一旦。就在他强迫自己冷静下来，准备出去看看情况的时候，整个掩体突然剧烈地震动起来，仿佛一头巨兽从头顶上的森林中穿过。这位德国的将军再也无力走出去。\n\n现在，他独自一人被困在地堡里，这位德国人民的刽子手，就像西西弗斯一样，他所有的努力都化为乌有。在黑暗中，他摸索着点燃桌上的一根蜡烛，然后瘫坐在椅子上。他在口袋里摸索着，掏出一枚十字架，没有比这更合适的时刻了。雷默双手捧着十字架，摆出祈祷的姿势，闭上了双眼。"
 TaS_GEREpilogue.30.a: "“主啊，救救我吧，我真的累了。”"
 TaS_germany_tt: "§R看起来，属于德意志的历史到此就终结了。§!"
 TaS_GEREpilogue_news.1.t: "[Get_newspaper_header]民主派统一西德意志！"
 TaS_GEREpilogue_news.1.d: "随着大日耳曼国的崩溃以及随之而来的危机，第二次内战爆发了。俾斯麦缔造的帝国似乎注定要走向终结。\n\n然而，在这场斗争中，最终的胜利者是瓦尔德马·施密特——红军的前领导人，现任德意志共和国总统。经过残酷的战斗，他的军队以血汗与泪水赢得了最终的胜利。\n\n现在，摆在他面前的是一项艰巨的任务——重建家园。饱受俄罗斯入侵和内战蹂躏的德国百废待兴。\n\n人民寄希望于施密特，希望他能带领他们走向民主与繁荣。"
 TaS_GEREpilogue_news.1.a: "而他必将不负众望。"
 TaS_GEREpilogue_news.1.b: "让我们看看残缺不全的德国吧。"
 TaS_GEREpilogue_news.2.t: "[Get_newspaper_header]自由派统一西德意志！"
 TaS_GEREpilogue_news.2.d: "分裂的德国，在经历了一场血腥的权力斗争后，终于迎来了第二次内战。许多人认为，俄罗斯不会坐视不管，他们会直接出兵接管德国，将其纳入驻军区的统治之下。然而，事与愿违，在这场权力角逐中，最终胜出的竟然是德国人自己。\n\n曾经那位默默无闻的飞行员，如今摇身一变，成为了莱茵联邦的最高领袖。正当他准备大展宏图，进一步扩张势力之时，他的军队却出人意料地从驻军区手中夺回了部分德国领土。\n\n面对这突如其来的胜利，瓦尔特·谢尔为自己设定了一个明确的目标：重建战后的德国，并将政府中的激进分子彻底清除。他宣布德国将保持中立，以此向世界宣告，德国将不再依附于俄罗斯或OFN。\n\n现在，他必须竭尽全力，在大国博弈的夹缝中求生存，确保自己不会沦为任何一方的傀儡。"
 TaS_GEREpilogue_news.2.a: "恭喜瓦尔特·谢尔成为西德总统！"
 TaS_GEREpilogue_news.2.b: "让我们看看他在国际政治中的应变能力。"
 TaS_GEREpilogue_news.3.t: "[Get_newspaper_header]酿酒师和他的下属统一西德意志！"
 TaS_GEREpilogue_news.3.d: "在德国经历了数周的紧张局势后，火药桶终于爆炸，第二次内战爆发了。德国人自相残杀，战火似乎永无止境。然而，就在这乱世之中，一位天命之子出现了。如果说这世上真有命运的安排，那么这一次，命运或许开了一个小小的玩笑。\n\n马克西米利安，一位出身巴登的葡萄酒酿造商，因为家族与巴登亲王有着血缘关系，阴差阳错地成为了国王。对他而言，如果能让他安心待在葡萄园里，他甚至愿意放弃王位。\n\n但命运似乎另有安排。马克西米利安的子民被证明是这片满目疮痍的土地上最优秀的战士。凭借着惊人的毅力和成功的宣传策略，他们团结一致，最终消灭了所有敌人，统一了德国。\n\n现在，马克西米利安似乎不得不接受自己的命运，执掌大权。"
 TaS_GEREpilogue_news.3.a: "马克西米利安一世陛下万岁！"
 TaS_GEREpilogue_news.3.b: "但愿这位“小丑”国王别搞出什么幺蛾子。"
 TaS_GEREpilogue_news.4.t: "[Get_newspaper_header]保皇派统一西德意志！"
 TaS_GEREpilogue_news.4.d: "即使在莫斯科的监督之下，第三帝国的残余势力依然无法和平共处，短短几个月后，第二次内战很快爆发，曾经不可一世的各个国家，如同被战火吞噬的纸牌屋般接连倒塌，将德国推向了更深的深渊。然而，乱世之中总有强者屹立不倒：巴伐利亚。\n\n在巴伐利亚公爵弗朗茨的英明领导下，巴伐利亚经受住了风暴的洗礼，克服了重重困难，成为了这片土地上唯一合法的政权。\n\n集中营的累累白骨，纳粹的累累罪行，弗朗茨将这一切都铭记于心，他绝不会给纳粹分子留下任何喘息之机。他必须彻底消灭这场瘟疫，将其从德国的土地上连根拔起。在德国人民的心目中，弗朗茨是一位强势而果断的君主，他能够重塑德国的国际形象，带领他们重回世界之巅。\n\n但眼下，最重要的是在又一次骨肉相残之后重建德国，并将权力牢牢掌握在自己手中。为此，弗朗茨将竭尽全力。"
 TaS_GEREpilogue_news.4.a: "巴伐利亚的弗朗茨皇帝万岁！"
 TaS_GEREpilogue_news.4.b: "我们期待的是谨慎，而不是报复。"
 TaS_GEREpilogue_news.5.t: "[Get_newspaper_header]奥地利统一西德意志！"
 TaS_GEREpilogue_news.5.d: "第二次内战震惊了整个国际社会，把它摆在了德国领土上自相残杀的事实面前。在这种情况下，似乎没有人能依靠纳粹国家的残余生存下来。但是他们大错特错了。\n\n在奥地利北部，随着内战的爆发，红军起义爆发。奥托·冯·哈布斯堡回到祖国后，被迫采取行动。训练有素的奥地利武装部队轻而易举地穿过德国，消灭了一个又一个军阀与集团。这最终使奥托控制了整个西德。\n\n现在，在宣布成立奥地利-德意志帝国之后，他必须重建被摧毁的德国和奥地利的领土，提高他在世界心目中的形象。到目前为止，奥托得到了俄罗斯的信任，所以他应该专注于国内政治。但这种情况会持续多久——没人知道。"
 TaS_GEREpilogue_news.5.a: "是时候开始谈正事了！"
 TaS_GEREpilogue_news.5.b: "让我们对他们采取观望态度。"
 TaS_GEREpilogue_news.6.t: "[Get_newspaper_header]捷克国分裂西德意志！"
 TaS_GEREpilogue_news.6.d: "德意志第二次血腥内战的结果令人震惊。在德国人之间爆发了旷日持久的内战后，最终的胜利者却出人意料地选择对捷克发动了攻势。胜利者试图重新奴役捷克的企图最终以惨败而告终，捷克人顺势占领了整个西德。\n\n捷克军队已经举行了穿越德国主要城市的凯旋阅兵式，他们的领袖——阿洛伊斯·格雷贝尼切克宣布“将彻底解决德意志问题，并对德意志人展开全面同化”。根据阿洛伊斯的命令，捷克更名为“大摩拉维亚帝国”，并将巴伐利亚和奥地利的领土悉数吞并。\n\n在西德的其他地区，一些傀儡政权也纷纷建立，他们无一例外地都唯布拉格马首是瞻。目前已经传来了大量关于捷克人在德国城市中犯下的暴行的消息。\n\n截至目前，管理总局尚未就此事发表任何公开声明。"
 TaS_GEREpilogue_news.6.a: "德意志的威胁已彻底消除！"
 TaS_GEREpilogue_news.6.b: "但从今往后，德意志民族的命运又将何去何从呢？"
 TaS_GEREpilogue_news.7.t: "[Get_newspaper_header]前军官团统一西德意志！"
 TaS_GEREpilogue_news.7.d: "有谁能想到，在德意志第二次内战爆发后，和平竟会如此迅速地到来。但事情就这样发生了。而且，看起来，胜利的天平最终还是倒向了当初那支实力最为弱小的，甚至差点就被捷克极端民族主义者阿洛伊斯·格雷贝尼切克彻底消灭的派系。\n\n在“捷克之夜”事件后，由库尔特·科尼斯佩尔领导的德意志人发动了起义。依靠着正确的战术、出色的训练和一丝运气，他和他的部队成功地击退了捷克人的进攻，随后，他们乘胜追击，将战火烧向了德意志的残余领土。\n\n战争结束后，西德已尽数处于他的军队的控制之下。现在，库尔特已经准备好启动“重建”计划了。根据这一计划，他将铲除一切社会主义运动，建立一个严酷的、一党专政的独裁政权，并致力于让德国从战争的废墟中恢复过来。\n\n但科尼斯佩尔的政府并没有恢复纳粹主义的打算。我们目前尚不清楚这些声明是否属实，但有一件事可以肯定——德国再也不会像以前那样了。"
 TaS_GEREpilogue_news.7.a: "让我们开始复苏吧！"
 TaS_GEREpilogue_news.7.b: "至少在短期内，他们应该不会对我们的邻国构成威胁了。"
 TaS_GEREpilogue_news.8.t: "[Get_newspaper_header]红色阵线统一西德意志！"
 TaS_GEREpilogue_news.8.d: "尽管为了维持大日耳曼国残余势力之间的和平做出了种种努力，但他们无法在正常关系下共存几个月。第二次内战爆发了。\n\n与此同时，当一些人借酒浇愁，担心新的冲突时，有人正准备发动一次前所未有的打击。安德烈亚斯·巴德尔愤怒了，他和幸存于乌尔里克·迈因霍夫之死的红军残部，已经准备好向狼人复仇。他们终于得偿所愿。\n\n在没有来自奥地利和巴伐利亚的红军支援的情况下，他们迅速控制了该地区，开始了血腥的征程，向剩余的纳粹进军。巴德尔杀光了通往他们梦寐以求目标的道路上的所有人，最终他成功地将西德统一在他部队的红色旗帜之下。\n\n现在，他准备着手实现自己的主要目标：消灭纳粹。但如果巴德尔不关心他的部下，那他就是个十足的白痴。通过指示他最亲密的部下在国内建立社会主义，他希望团结德国人民对抗共同的敌人——纳粹主义。"
 TaS_GEREpilogue_news.8.a: "他们将知晓何为恐惧！"
 TaS_GEREpilogue_news.8.b: "小心点，我们不知道他们会怎么样。"
 TaS_GEREpilogue_news.9.t: "[Get_newspaper_header]纳粹党统一西德意志！"
 TaS_GEREpilogue_news.9.d: "第三帝国崩溃后，在其废墟上形成了大量的国家，随时准备自相残杀。然而，这件事过了一段时间就发生了。第二次内战是幸存者起义的背景。\n\n在德国崩溃后，并不是所有人都接受了它的灭亡。大批前国防军士兵联合起来为恢复希特勒的理想而战斗。他们成功了，使他们惊奇又害怕。\n\n当恩斯特·雷默在慕尼黑的讲台上发表讲话时，他的部下正在摧毁敌人最后的阵型。他提醒部队，啤酒政变就是在这里发生的，民族社会主义的思想就是在这里诞生的，他自豪地举起手说：“胜利万岁。”顷刻之间，整个军队都欢呼起来。\n\n然而，纳粹国家在德国领土上的死灰复燃使邻国大为惊恐。只有时间才能告诉我们接下来会发生什么。"
 TaS_GEREpilogue_news.9.a: "为了希特勒的构想，我们都准备好了同归于尽！"
 TaS_GEREpilogue_news.9.b: "纳粹主义的最终解决方案"
 TaS_GEREpilogue_news.10.t: "[Get_newspaper_header]纳粹问题的最终解决方案"
 TaS_GEREpilogue_news.10.d: "在德国传来令人失望的消息后，在恩斯特·雷默和他的同伙赢得内战之后，许多世界媒体开始问:“如果他的追随者还活着，俄罗斯打败第三帝国有什么意义?”这样的话越来越多地从不同的方面传出，这让俄罗斯非常愤怒。\n\n当从驻防部队的前哨传来大批部队从柏林前进的消息时，事态达到了沸点。然后弗拉基米尔·吉尔亲自下令对纳粹最重要的城市进行核轰炸。\n\n10多枚核弹被用来摧毁慕尼黑、汉堡、斯特拉斯堡和其他城市，体现了原子的全部力量。顷刻间，这些城市变成了放射性灰烬，整个德国就此灭亡。\n\n这一步骤的后果尚不完全清楚，但有一件事是肯定的……"
 TaS_GEREpilogue_news.10.a: "在接下来的几年里，德国陷入了真正的无政府状态。"
 TaS_GEREpilogue_news.10.b: "显然德国人不太了解历史。"
 TaS_GEREpilogue_news.11.t: "[Get_newspaper_header]中欧驻军与柏林部队介入德国内战！"
 TaS_GEREpilogue_news.11.d: "战争——永远是漫长痛苦与无尽恐惧的代名词，更不用说一场同室操戈、手足相残的内战了。若不是解放总局决定出兵干预，德国第二次内战恐怕永远也不会结束。\n\n沿着整个边境地区，不断传来与俄军交火的报告。但德军那士气低落、训练不足且早已疲惫不堪的抵抗力量很快便被击溃。解放区总局主席主席弗拉基米尔·吉尔宣称：“我们不能再坐视不管，任由德意志这头怪兽再次为祸人间。我们不得不进行干预，因为我们的目标是保护欧洲人民，维护欧洲的稳定，而这种稳定早已被这场旷日持久的血腥内战破坏殆尽。”\n\n看来，德意志的命运将在未来几天内尘埃落定。"
 TaS_GEREpilogue_news.11.a: "我们必须终结这场流血冲突。"
 TaS_GEREpilogue_news.11.b: "难道俄罗斯人上次被打得还不够惨吗？"
 TaS_GEREpilogue_news.12.t: "[Get_newspaper_header] 西德内战"
 TaS_GEREpilogue_news.12.d: "在第二次西俄罗斯战争中，大日耳曼国遭遇了彻底的失败，以沙皇谢尔盖·别洛泽尔斯基为首的俄罗斯皇室决定彻底改变前敌国领土的划分，大刀阔斧地重新划定了各国之间的边界。然而，俄国政府却忽略了一个至关重要的因素——在德国沦陷后，涌现出了大量形形色色的激进组织，这也为日后发生的一切埋下了祸根，德意志民族再也无法忍受无休止的压迫，于是，他们纷纷揭竿而起，将整个德国拖入了一场旷日持久的内战之中。各路军阀招兵买马，积草屯粮，为了在这场决定德意志民族命运的内战中夺取最终的胜利，他们不惜一切代价。"
 TaS_GEREpilogue_news.12.a: "我们将取得最终的胜利！"
 TaS_GEREpilogue_news.12.b: "德意志人民倒下了，就像他们过去击败的敌人那样。"
 TaS_GEREpilogue.31.t: "胜利演说"
 TaS_GEREpilogue.31.d: "聚集在人民大厅穹顶之下的数万民众向着刚刚走上讲台的元首马丁·鲍曼报以雷鸣般的掌声。摄像机对准了这位德意志的最高领袖，并向全世界进行着实况转播。\n\n“今天！就在此刻，斯拉夫和犹太布尔什维克的乌合之众再一次像过去那样被击溃，在我们伟大军队的打击下仓皇逃窜！他们只能龟缩回自己那永不见天日的、寒冷贫瘠的土地！我们雅利安种族又一次证明了自身的伟大与优越，凌驾于世界上的一切其他种族之上！我们保卫了‘生存空间’不受亚洲野蛮人的侵犯，也守卫了我们自己的专员辖区，从而捍卫了我们整个德意志！德意志万岁！我们的人民万岁！我们的胜利万岁！”在发表完慷慨激昂的演讲后，元首举起右臂，行了一个不太标准的纳粹礼。\n\n“胜利万岁！”他高呼着口号，成千上万的人也跟着他一起高呼。人民大厅中回荡着经久不息的欢呼声，场面一度失控。在人群的欢呼声中，鲍曼缓步走下讲台，下意识地用袖子捂住了自己的嘴，他感到一阵剧烈的咳嗽，当他再次看向自己的袖口时，却发现那里早已被鲜血染红了。"
 TaS_GEREpilogue.31.a: "我们战无不胜，并且再次取得胜利"
 TaS_GEREpilogue.32.t: "巨人的陨落"
 TaS_GEREpilogue.32.d: "一位护士走出了元首的卧室，立刻朝客厅走去。面对着即将到来的命运，这位护士在脑海中拼命地回忆着一切。她每走一步，都在调整着呼吸，以此来平复紧张的情绪。走廊是如此的漫长，甚至让她感觉自己永远也走不到尽头。漫长到即使她不去思考也能令她产生错觉。当然，她也知道走廊之所以如此漫长是因为它的设计，但为了减少压力，她仍然没有冷静下来，去仔细思考其中的玄机。\n\n终于，护士来到了楼梯前，当她看到站在客厅里的政府官员时，她的身体开始微微颤抖，她强忍着恐惧，尽量保持着平静，然后扶着栏杆慢慢地走下楼梯。她每走下一级台阶，就越发想要逃离这里。但她还是坚定不移地走了下去。走下最后一级台阶后，护士径直走向他们，走到了政府官员们面前。\n\n“施特凡女士！元首他怎么样了？”一位官员问道。“我们接到报告……”另一位官员补充道，但还未等他说完，其他官员就接二连三地开始提问。\n\n“先生们！请安静！”护士高声说道，随后整个客厅都安静了下来。"
 TaS_GEREpilogue.32.a: "元首逝世了。"
 TaS_GEREpilogue.33.t: "权力交接"
 TaS_GEREpilogue.33.d: "在元首鲍曼缺席的情况下，第一次会议在人民大厅的穹顶之下召开了。与以往在平静祥和的气氛中进行的会议不同，自从元首咽下最后一口气后，这次会议就一直笼罩在一片紧张不安的氛围之中。代表们刚结束一场争吵，马上又会爆发另一场更为激烈的口角。保守派斥责改革派和反动派，改革派则对保守派和技术官僚们大加挞伐。最终，几乎所有派系都陷入了互相攻讦之中，他们之间没有任何共同语言。只差一点，代表们似乎就要大打出手，不过好在，会议主席最终还是制止了这场闹剧。代表们纷纷落座，但眼神中依旧燃烧着熊熊怒火。\n\n在宣布本次关于选举新元首的特别会议开始后，议长便立刻开始宣读最高职位的候选人名单。\n\n“格哈德·克洛普弗。”\n\n“特奥多尔·奥伯伦德。”\n\n“阿图尔·阿克斯曼。”\n\n“还有库尔特·比登科普夫。”\n\n“尊敬的代表们，我提议立即进行投票。”议长说道。"
 TaS_GEREpilogue.33.a: "我们需要延续鲍曼的政策——格哈德·克洛普弗"
 TaS_GEREpilogue.33.b: "不破不立——特奥多尔·奥伯兰德"
 TaS_GEREpilogue.33.c: "“希特勒青年团”最清楚——阿图尔·阿克斯曼"
 TaS_GEREpilogue.33.e: "对理想的狂热追求是否值得？——库尔特·比登科普夫"
 TaS_GEREpilogue.34.t: "胜利的呼唤"
 TaS_GEREpilogue.34.d: "在办公室中，元首正埋头于成堆的文件之中，已经这样连续工作了好几个小时。他伸手去拿那杯已经空了一半的咖啡，却因为一阵突如其来的电话铃声而停下了手中的动作。他改变了手的轨迹，一把抓起了那部鲜红色的、正面印有黑色鹰徽和万字符号的电话。拿起听筒，他把它紧紧地贴在了耳边。\n\n“元首向您问好。”施佩尔一边说道，一边将手中的钢笔放到了桌子上。\n\n“嗨，元首！”电话中传来了一个声音。\n\n“请您允许我向您汇报。”那个声音补充道。\n\n“请讲。”元首言简意赅地说道，同时端起咖啡杯，开始细细品味起来。\n\n“根据前线传回的最新报告，我要向您汇报，敌人的防线已在我军的凌厉攻势下彻底崩溃，我们已经将敌人赶回了‘A-A’线，并成功地守住了防线。东方‘野蛮人’再次被我们击败了，元首。”东线总司令汇报道。\n\n“这可真是天大的好消息，”元首说道，随后将空杯子放回了桌子上。\n\n“感谢您，也感谢所有为了德意志的荣耀而英勇作战的将士们。祖国将永远铭记他们的丰功伟绩。”施佩尔说道。\n\n“乐意为您效劳，我的元首！”总司令说道，然后便挂断了电话。\n\n放下听筒后，施佩尔陷入了沉思。\n\n“是时候在人民大厅召开一场大会了。”元首心中暗自思忖着，然后拿起一张白纸和钢笔，开始构思他的胜利演讲稿，这篇演讲不仅是说给国会和德国民众的，也是说给全世界的。"
 TaS_GEREpilogue.34.a: "驶向未来。"
 TaS_GEREpilogue.35.t: "四人帮的末日"
 TaS_GEREpilogue.35.d: "元首的车队正从机场返回，并朝着人民大厅方向驶去，或者更准确地说，是朝着位于人民大厅附近的元首官邸驶去。透过车窗，街道以及两侧鳞次栉比的高楼大厦飞速向后退去，街上的行人也络绎不绝。\n\n“元首，”施佩尔的助手一边说着，一边将手机放回了原位。\n\n元首的目光从窗外那不断变幻的街景中移开，转向了自己的助手。\n\n“安全总局向我们报告说，‘四人帮’的最后一名成员已经被捕，目前正在接受审讯。”助手说道。\n\n听完助手的话，元首若有所思，目光再次转向了窗外。几秒钟过去了，元首仍然一言不发。或许，他正在回忆自己是如何下令处决“四人帮”中的第三名成员的；或许，他正在思考如何让第二名成员身败名裂，永世不得翻身；或许，元首正在回忆他们的初次相遇，第一次交谈。又或许，他仅仅是在享受这难得的平静——一个再也没有人胆敢挑战他权威的时代。只有元首自己才清楚他究竟在想些什么，但有一件事可以肯定：他的助手不敢打断元首的思绪。将目光重新转向助手后，元首又看了一眼他。\n\n“给秘书处打电话。让他们取消我今晚6:00之后的所有安排，并邀请我的所有朋友和政府成员前来参加晚宴。我们要庆祝帝国取得的又一次伟大胜利。”元首说道，脸上露出了一丝不易察觉的笑容。"
 TaS_GEREpilogue.36.t: "千年帝国"
 TaS_GEREpilogue.36.d: "在元首官邸那富丽堂皇的宴会厅中，一场盛大的晚宴正在进行。欢声笑语不绝于耳，各界名流汇聚一堂。来自政界、商界以及军界的名流们齐聚于此，共同庆祝国家取得的又一次辉煌成就。元首坐在名贵的真皮沙发椅上，身着做工考究的晚礼服，手中端着一杯来自法国的顶级佳酿，一边细细品味，一边陷入沉思。他的朋友们纷纷前来向他敬酒，但没有一个人能够让他从沉思中清醒过来。\n\n又抿了一口杯中的美酒，元首从座位上站起身，走向了走廊。穿过走廊时，他仍然能听到客人们那喧闹的谈笑声。来到办公室门口，元首推门而入，并关上了房门。他穿过房间，来到了窗边，将手中的酒杯轻轻地放在了窗台上，目光首先投向了窗外的广场，随后又移向了那宏伟的人民大厅。为了让这座建筑在夜晚也能熠熠生辉，广场四周以及人民大厅的墙壁上都安装了巨大的泛光灯，将整座建筑照得如同白昼一般。\n\n“希特勒与我施佩尔的杰作，”施佩尔元首心想。\n\n“跌宕起伏的十年。危机四伏的十年。荣辱与共的十年。然而，人民大厅，正如我们亲手缔造的德意志，乃至整个帝国，都挺过了风风雨雨，证明了自身的不朽。” 元首的嘴角，在思绪翻涌间，微微上扬。\n\n“德意志屹立不倒。德意志坚不可摧。德意志傲然挺立。德意志千秋万代。千年帝国万岁！” 元首低声宣告着，道出了心中的信念与坚定。\n\n他举起酒杯，再次品尝了一口佳酿，复又将其放回窗台，继续沉醉于眼前的杰作。"
 TaS_GEREpilogue.36.a: "这是我的国家。"
 TaS_GEREpilogue.37.t: "和平的代价"
 TaS_GEREpilogue.37.d: "究竟是怎么走到这一步的呢？施佩尔在过去的几天中无数次地问自己这个问题。坐在窗边的扶手椅上，施佩尔回忆起最近一次纳粹党的会议。在那次会议上，当他正与同事们讨论一个重要问题时，发生了一件让他始料未及的事情。\n\n“我的元首，”就在他们热火朝天地讨论着问题时，有人从身后叫住了施佩尔。转过身，元首发现，站在他面前的正是议会主席奥伯兰德。\n\n“什么事？”施佩尔问道，同时用手势示意自己的同事们，会议暂时中止。\n\n“元首，我必须和您谈一件非常重要的事。我们的派系保守派，已经在国会中占据了多数席位，而且这种趋势还在不断扩大，因此我们希望您能够以和平的方式解决我们之间存在的分歧。”奥伯兰德说道，脸上带着一丝狡黠的笑容。\n\n“分歧？和平解决？你到底在说什么？”元首警惕地问道。\n\n“您明白的，元首。这么说吧，您在元首这个职位上的表现并不能令大多数人感到满意，因此我们希望能够和平地解决这个问题。请您放心，您的个人以及您家人的财产安全将得到充分保障。但是，如果您拒绝我们的提议，我们将不得不采取更强硬的措施，通过国会投票的方式来解除您的职务。另外，您也最好不要试图依靠那些‘更强硬’的力量来对抗我们，因为这不会给您带来任何好处。”他一边说着，一边用一如既往的假笑看着施佩尔。\n\n怒火在施佩尔的心中熊熊燃烧，但他还是强压下这股怒火，因为他很清楚，与这些喜怒无常的人打交道时，情绪化是毫无意义的。他努力让自己的思绪保持冷静。\n\n“我需要一些时间来考虑你们的提议。”施佩尔平静地回答道。\n\n“当然没问题，我的……元首。”说完，奥伯兰德便转身离开了。\n\n在接下来的几天里，施佩尔秘密调查了自己所能调动的武装力量以及其规模，但残酷的现实很快便粉碎了他所有的幻想。经过再三权衡，他最终得出了一个无奈的结论：想要保住自己的元首宝座，几乎是不可能的。\n\n为什么我会在一生中最重要的政治斗争中一败涂地呢？元首反复地问自己。\n\n“元首，”还是那个熟悉的声音，还是那个熟悉的人。施佩尔转过身，发现他的助手站在他的身后。\n\n“元首，奥伯兰德先生来电。他提出了一个有些奇怪的问题，想知道您是否已经准备好接受以一种‘和平’的方式来解决问题，他保证说您清楚他究竟在说些什么。”助手说道。\n\n又思考了几秒钟，并试图寻找一个体面的方式来击败保守派后，元首再次转身面向他的助手。\n\n“转告奥伯伦德…”元首犹豫了一下，但还是继续说道。"
 TaS_GEREpilogue.37.a: "我同意他的条件。"
 TaS_GEREpilogue.38.t: "辞职及其余波"
 TaS_GEREpilogue.38.d: "随着元首的辞职，“四人帮”与如今正式上台的保守派政府之间最后的支柱轰然倒塌，一场无形的战争就此展开。\n\n保守派政府无法公开清洗这些“新盟友”，毕竟，这些人仍拥有相当大的影响力，足以对新政府构成威胁。“四人帮”在元首垮台后，表面上表示支持保守派，成为了“新盟友”，企图以此保住权力，但保守派对他们毫无需求，正如“四人帮”也不需要保守派。\n\n“赫尔穆特，你的任务说简单也简单，说难也难。你需要除掉‘四人帮’的其中一个成员，但要伪装成反对派和恐怖分子所为。”——这是赫尔穆特牢记于心的信件内容。\n\n作为一名狙击手，曾是反恐部队的精英，赫尔穆特在元首退位后沦为雇佣兵，唯一关心的只有报酬。\n\n经过长时间的跟踪和准备，赫尔穆特已经做好了万全的安排。在预定的日期、时间，甚至精确到秒，赫尔穆特就位。目标乘坐的轿车队抵达，当载有目标的车辆停稳，它便落入了赫尔穆特的瞄准镜中。\n\n走出车门的“四人帮”成员仅仅迈出了两步，便颓然倒下，鲜血瞬间在他的头颅周围蔓延。街道上陷入一片恐慌，安保人员急忙冲向他们的主人，但为时已晚。\n\n赫尔穆特事先留下了指向无关人员的线索，然后迅速撤离，带走了所有可能指向他本人或雇主的证据，包括那枚至关重要的弹壳。\n\n两周之后，曾经不可一世的“四人帮”残余成员，悉数在其他雇佣兵的手中灰飞烟灭。"
 TaS_GEREpilogue.38.a: "铭记死亡。"
 TaS_GEREpilogue.39.t: "不屈的党"
 TaS_GEREpilogue.39.d: "车队缓缓驶近国家议会大厦，奥伯兰德从车中走出，身后跟随着其他政府成员的车队。这是一次为了解决国家当前诸多问题而召开的例行政府会议。当他走过广场时，心中充满了自豪，他认为这座气势恢宏的建筑便是他智慧与谋略的象征。走进大厦，看到那些忙碌的工作人员和已经提前抵达的官员们，奥伯兰德的内心更加坚定了。\n\n在经历了无数次或明或暗的清洗和人事调整后，政府机关终于恢复了希特勒时代之前的氛围，或者说，甚至比那时候还要团结。这里再次充满了纪律严明、思想统一、清正廉洁的政府官员和工作人员。\n\n奥伯兰德深信，在经历了这一切之后，德国正走在一条更加正确的道路上。他满怀信心地走向自己的办公室，因为距离会议开始尚有一段时间。在会议开始前，他享用了一杯香浓的咖啡，准时抵达会场。这位议会议长落座，决心继续推动帝国沿着正确的方向，不断向前。"
 TaS_GEREpilogue.39.a: "“我宣布会议正式开始。”"
 TaS_GEREpilogue.40.t: "胜利！"
 TaS_GEREpilogue.40.d: "拾级而上，走过连接车队与人民大厅入口的阶梯，元首施佩尔的脸上洋溢着难以掩饰的喜悦，甚至绽放出一抹淡淡的微笑。甫一进入大厅，迎接他的是早已恭候多时的随行人员。\n\n“我的元首，所有代表均已到齐并入座。请跟我来。”人民大厅的主管官员说道，并用手势指明了前进的方向。\n\n穿过走廊，几分钟后，元首来到通往主厅的入口处。他示意助手递上事先准备好的演讲稿。施佩尔接过稿件，步入大厅。\n\n走上讲台，元首向台下望去，整个大厅在看到他们的领袖的那一刻，爆发出雷鸣般的欢呼。待会场稍稍平静，元首再次整理了一下演讲稿，将目光投向全场。\n\n“诸位，今天，就在今天，这个值得纪念的日子，我们再次向东方蛮族证明了我们的优越！我们的国家，和它的每一个儿女，在过去几个月的战争中，展现了雅利安种族及其成就的强大与辉煌，足以阻挡亚洲游牧民族的侵袭，并以雷霆之势，对那些胆敢染指我们世界的野蛮人予以毁灭性的打击！就在此刻，我们英勇的军队正向着一度失去的AA防线挺进，而在后方，盛大的游行正在举行，庆祝那些重归祖国怀抱的土地！在经历了又一次惨败之后，犹太布尔什维克蛮族将再也无力觊觎我们的领土。德意志万岁！”演讲结束时，元首与所有高级党政军官员一同举起右臂，稍稍弯曲；而年轻的成员则将右臂笔直地向前伸出，全场齐声高呼："
 TaS_GEREpilogue.40.a: "“胜利万岁！”"
 TaS_GEREpilogue.41.t: "勃兰特的难题"
 TaS_GEREpilogue.41.d: "维利坐在咖啡馆里，一遍又一遍地翻阅着手中的报纸。\n\n“这究竟是怎么回事？”他扪心自问。\n\n“胜利！”醒目的大标题跃入眼帘，而下面的正文则宣扬着德国在又一次对俄战争中取得的又一次“辉煌胜利”。\n\n“这已经是第二次了。而每一次都是以无果而终。唉……”勃兰特暗自叹息。\n\n“施佩尔在人民大厅发表庆祝帝国胜利的讲话。呸……又是一场充满虚伪做作的政治表演。”勃兰特一边思忖，一边低声自语，继续埋头阅读。又读了一会儿，维利放下报纸，陷入了沉思。\n\n“德国胜利之后，这里的一切仿佛都陷入了疯狂。难道他们就看不见，在这场战争中，丧命的都是些无辜的平民吗？数十万人的生命被无情地碾碎，成为战争机器的牺牲品。而这个国家又还要为了其无限的贪婪葬送多少条生命？人们究竟何时才能醒悟，认清这台战争机器的真面目——它不过是为精英阶层的利益服务的工具，而所谓德国人民的幸福生活，却是建立在成千上万被贬为‘劣等人’的奴隶的血汗之上的？当然，现在经过了所谓的‘改革’，他们不再被称为‘劣等人’，但实际上依旧是毫无权利的奴隶！”勃兰特想要猛拍一下桌子，但最终还是克制住了。\n\n“改良的纳粹主义。简直是噩梦！而如今人们却依然狂热地支持它，支持者的数量还在不断增加。这究竟是怎么回事，究竟是什么地方出了差错，让一切走向了如此荒谬的境地？”勃兰特百思不得其解。\n\n“先生，请问您需要点些什么吗？”勃兰特听到有人在叫他，他抬起头，发现一位年轻的女服务员正站在桌旁。当他看清这位服务员胸前佩戴的“德意志少女联盟”的徽章后，心中更是一阵烦躁。\n\n“谢谢，不用了。我这就走。”勃兰特说着，拿起报纸，起身朝门口走去。"
 TaS_GEREpilogue.41.a: "如今，我究竟该何去何从呢？"
 TaS_GEREpilogue.42.t: "渐进式改革"
 TaS_GEREpilogue.42.d: "国家议会的会议从未像今天这般气氛紧张。本次会议标志着一系列改革的开始。当议长走上讲台并宣布了他的提议后，激烈的讨论便开始了。新的提议和想法被逐一提出，激烈的争论此起彼伏，而这一切都被记录在了会议记录之中。在会议结束时，一整套改革方案已经被提交给了元首，等待着他的最终批复。\n\n会议结束后，议长奥伯兰德将文件交给了一名信使，并命令他立即将其送往元首官邸。信使来到大楼外，那里有一辆汽车在等候着他。他乘车仅用了几分钟便抵达了目的地，随后又花了片刻时间才来到元首的办公室，最后，他将文件交给了元首的秘书。\n\n“元首，请允许我进来。”秘书站在敞开的办公室门前说道。“在得到许可后，秘书走到正在办公桌前工作的元首面前，将文件递给了他，随后便退出了房间。\n\n“好吧，让我看看他们都搞出了些什么名堂。经济自由化，第一阶段…对政治方针进行一些小修小补…社会改革，初始阶段…军事领域的变革…在专员辖区推行新政…有点意思。”元首一边看着文件，一边自言自语道，随后便开始逐一审阅每一份文件。\n\n一个半小时后，元首终于看完了所有文件，他将最后一份文件放到一边，拿起了直通议长办公室的电话。\n\n“元首，我是奥伯兰德，请问有什么指示？”听筒中传来了议长的声音。\n\n“我已经看完了你们提交的所有文件。”"
 TaS_GEREpilogue.42.a: "“所有提案全部批准。”"
 TaS_GEREpilogue.43.t: "计划"
 TaS_GEREpilogue.43.d: "“我的元首。”助手的这一声轻唤，打破了施佩尔办公室内那令人窒息的寂静。此刻元首正示意他的助手前来一同研究一份至关重要的国家文件。元首期望他助手的研究能与自己的相碰撞出火花，对其未来发展趋势作出精准把控。\n\n“恕我直言，我的元首，我对此实在拿捏不准，难下定论。”助手合上文件夹，注视着背对窗户的元首，一言不发。\n\n又是一阵令人窒息的沉默，元首将原本交叉在胸前的双手放下，在背后紧紧交握。\n\n“究竟是什么地方让你如此不确定？说吧。”元首说道，转过身来，目光如炬地盯着助手。\n\n“我的元首，我实在难以确定这长久以来的变革重组的意义。特别是，我们如今将直面最最危险的敌人，而且最要命的是还要将其行政系统进行变革，彻底地由“武力控制”的全军事化统治变为所谓的松散地方管理体制，这就像是建立起与一个“普通傀儡国”无疑的体系，同时还额外恩赐这些可恶的“斯拉夫劣等民族”一定的权力……这样的决策实在难以理解，我至今难安。”助手一鼓作气地说完，随即沉默不语。元首沉思了片刻，缓步走向他的办公桌。坐下后，他再次看向助手。\n\n“不。这个主意其实高明得很。因为此等方略非但不会增长各种反叛者的嚣张气焰，反而将会最大程度削弱他们那无意义的影响力。我们将给予他们维持日常生产所需的最基本权力，让他们可以维持最低限度的生存保障。当那些可悲的生命开始意识到变革之时，他们便再也提不起对变革发起无意义的冲击。虽然我们仍然不会对这些人放松警惕，但他们的一切活动将被无时不刻的监控，而剩余那些极少数冥顽不化的死硬派将会为他们那微不足道的生存空间陪葬，如此可以保证帝国的钢铁洪流将不费一兵一卒便取得最终胜利。最终，我们可以不费吹灰之力实现这片土地的长治久安，我们的‘东部生存空间’便可以永远为日耳曼所用。\n\n“请您下达命令，开始执行改组计划吧。”元首说道，助手闻言，立刻从椅子上跳了起来。"
 TaS_GEREpilogue.43.a: "“遵命，我的元首。”"
 TaS_GEREpilogue_news.13.t: "[Get_newspaper_header]格哈德·克洛普弗当选为大日耳曼国新任元首"
 TaS_GEREpilogue_news.13.d: "今晨，铺天盖地的新闻报道席卷而来，彻底终结了一切对德国新任元首人选的猜忌、疑虑与揣测。在屏息凝神地等待了数日后，全世界终于等到了这一结果。经过各方势力的激烈角逐，最终的投票结果出炉了。以绝对优势获胜的是前元首马丁·鲍曼的继任者和支持者——以格哈德·克洛普弗为首的保守派。\n\n在随后的演讲中，格哈德·克洛普弗明确表示将继续奉行希特勒-鲍曼路线，并只会在有限的范围内进行改革。他声称“民族社会主义思想完美无瑕”，认为根本无需任何“改革”，并针对如今混乱的现状宣布了有限制的、部分领域的改革措施。\n\n截至目前，世界各国尚未就此事发表任何评论，但与德国意识形态相近的盟友以及“团结协定”的成员国则纷纷向克洛普弗表示了祝贺。"
 TaS_GEREpilogue_news.13.a: "新元首万岁！"
 TaS_GEREpilogue_news.13.b: "一切照旧。"
 TaS_GEREpilogue_news.14.t: "[Get_newspaper_header] 特奥多尔·奥伯兰德当选为大日耳曼国新任元首"
 TaS_GEREpilogue_news.14.d: "今晨，铺天盖地的新闻报道席卷而来，彻底终结了一切对德国新任元首人选的猜忌、疑虑与揣测。在屏息凝神地等待了数日后，全世界终于等到了这一结果。经过各方势力的激烈角逐，最终的投票结果出炉了。以绝对优势获胜的是由特奥多尔·奥伯兰德所领导的、与当权保守派相对立的改革派。\n\n在演讲中，奥伯兰德宣布，将对德国的社会经济和军事政治方针进行大刀阔斧的改革，同时还将在整个“团结协定”的框架内进行更深层次的改革。\n\n对于新元首的当选，世界各国尚未发表任何评论，但“团结协定”的成员国以及意识形态相近的盟友们则纷纷向这位新元首表示了祝贺。"
 TaS_GEREpilogue_news.14.a: "新元首万岁！"
 TaS_GEREpilogue_news.14.b: "他将带来怎样的变革？"
 TaS_GEREpilogue_news.15.t: "[Get_newspaper_header]阿图尔·阿克斯曼当选为大日耳曼国新任元首"
 TaS_GEREpilogue_news.15.d: "今晨，铺天盖地的新闻报道席卷而来，彻底终结了一切对德国新任元首人选的猜忌、疑虑与揣测。在屏息凝神地等待了数日后，全世界终于等到了这一结果。经过各方势力的激烈角逐，最终的投票结果出炉了。出乎所有人意料的是，以绝对优势获胜的，是由阿图尔·阿克斯曼所领导的激进派，他们自诩为约瑟夫·戈培尔思想的继承者。\n\n在人民大厅的主席台上，阿克斯曼先生发表了他的就职演说。他宣称改革势在必行，但并非针对其他任何事物，而是聚焦于党本身——这个早已僵化停滞的统治机器。正是由于党自身的问题，才导致了帝国接连不断的危机。只有党得到彻底革新，其他一切才能随之焕然一新。\n\n在新元首当选后不久，“团结协定”的成员国以及其他一些与德国关系密切的国家纷纷向其表示了祝贺。而世界各国以及许多其他国家则对此事保持沉默，并未发表任何评论。"
 TaS_GEREpilogue_news.15.a: "新元首万岁！"
 TaS_GEREpilogue_news.15.b: "他们将走向何方？"
 TaS_GEREpilogue_news.16.t: "[Get_newspaper_header]库尔特·比登科普夫当选为大日耳曼国新任元首"
 TaS_GEREpilogue_news.16.d: "今晨，铺天盖地的新闻报道席卷而来，彻底终结了一切对德国新任元首人选的猜忌、疑虑与揣测。在屏息凝神地等待了数日后，全世界终于等到了这一结果。经过各方势力的激烈角逐，最终的投票结果出炉了。出乎很多人意料的是，以绝对优势获胜的，是由库尔特·比登科普夫所领导的技术官僚派。\n\n在演讲中，这位新元首宣布将对德国的发展方针进行一些调整，并将会“循序渐进地推行改革”，加强国家在科技研发以及物质技术基础方面的投入，并着手准备签署“关于启动若干大型项目的协议”草案。\n\n世界各国以及德国的许多非盟国对这位新元首的当选未置一词，而德国的盟友以及友好国家则向这位新元首表达了热烈的祝贺。"
 TaS_GEREpilogue_news.16.a: "新元首万岁！"
 TaS_GEREpilogue_news.16.b: "或许一切都会好起来的。"
 TaS_GEREpilogue_news.17.t: "[Get_newspaper_header] 马丁·鲍曼逝世！"
 TaS_GEREpilogue_news.17.d: "根据此前从“团结协定”内部各方传出的消息，大日耳曼国元首马丁·鲍曼因慢性疾病并发症入院治疗。然而，最新的消息显示，情况远比预想的更加危急。\n\n今天，德意志的电视频道中断了正常的节目播出，开始直播总理的讲话。根据总理的声明，由于健康状况长期恶化，德国元首马丁·鲍曼被紧急送往医院接受治疗。在接受治疗后，他返回了自己的官邸。然而在今天清晨，警卫人员出于某种原因决定检查元首的身体状况，却发现元首早已没有了呼吸。\n\n截至目前，其他国家的领导人尚未就此事发表评论。"
 TaS_GEREpilogue_news.17.a: "一个时代的终结。"
 TaS_GEREpilogue_news.17.b: "又一位独裁者的落幕。"
 TaS_GEREpilogue_news.18.t: "[Get_newspaper_header] 新德意志？"
 TaS_GEREpilogue_news.18.d: "近日，各大报刊头条纷纷聚焦于世界三大霸主之一——大日耳曼国。正如一家颇具影响力的美国报纸所言，在阿尔伯特·施佩尔通过内战夺取政权后，大日耳曼国便步入了一个前所未有的艰难时期，甚至可以说是其历史上最为动荡的阶段。\n\n在历经内战的满目疮痍之后，德国通过一系列的重建与改革，勉力恢复了其在国际舞台上的地位。然而，内战结束不到十年，阿尔伯特·施佩尔领导下的德意志便再次面临着一场更为严峻的考验——第二次西俄罗斯战争。这场战争远比第一次战争和内战更为残酷、规模更大，对国家造成了毁灭性的打击，但这个庞然大物却奇迹般地挺了过来。\n\n如今，在经历了一系列的风波与变革之后，德意志以崭新的面貌示人，其领导层宣称这将是一个更加开放和友好的新时代。然而，外表的更替是否意味着内在的转变？如果是，那么我们又该如何看待这个“新”国家？"
 TaS_GEREpilogue_news.18.a: "千年帝国——绝非终结！"
 TaS_GEREpilogue_news.18.b: "旧瓶装新酒罢了。"
 TaS_GEREpilogue_news.19.t: "[Get_newspaper_header] 德意志趋于稳定？"
 TaS_GEREpilogue_news.19.d: "根据从大日耳曼国传来的最新消息，该国似乎正在逐步走向稳定。在赢得了第二次西俄战争后，德国再次陷入了一场新的危机。由于政府和党内各派系之间争斗不休，互相攻讦，元首施佩尔迫于压力，最终“自愿”辞职。但与此同时，一些不愿意透露姓名的消息人士称，元首除了辞职外，已经别无选择。\n\n随后，一场针对政府高官的暗杀浪潮席卷德国。根据现有情报，政府内外的不同派别相互指责，互泼脏水。随着时间的推移，暗杀事件逐渐平息，危机最终以保守派的胜利而告终，他们在国家各个领域建立并巩固了权力垄断地位。但许多专家都质疑，这种“稳定”究竟能维持多久，德意志是否很快又会陷入无休止的内耗之中，亦或是将屠刀挥向其他国家呢。\n\n世界各国尚未就此事发表评论，只有来自其他国家的、那些与德国意识形态相近的盟友们纷纷发来贺电，对德国成功化解了危机表示祝贺。"
 TaS_GEREpilogue_news.19.a: "元首万岁！"
 TaS_GEREpilogue_news.19.b: "摇摇欲坠的“稳定”。"
 TaS_GEREpilogue_news.20.t: "[Get_newspaper_header] 德意志开始改革？"
 TaS_GEREpilogue_news.20.d: "今天，来自世界各地的新闻机构都争相报道着同一条令人震惊的消息。据此前报道，大日耳曼国正在讨论逐步推行改革的可能性。如今，所有的猜测和传闻都得到了证实。据大日耳曼国元首阿尔伯特·施佩尔称，他已经签署了一系列关于启动改革的文件。但据称，这股改革的新浪潮，甚至可以说是新的发展路线，将会在未来逐步加速和扩大。\n\n世界主要大国对此事并未发表明确评论。只有“团结协定”的成员国们对德国的这一转变表达了明确的支持，而其他一些意识形态相近的国家和友好国家则拒绝发表任何评论。"
 TaS_GEREpilogue_news.20.a: "我们对成功充满信心。"
 TaS_GEREpilogue_news.20.b: "这究竟意味着什么？"
 TaS_GEREpilogue_news.21.t: "[Get_newspaper_header] 莫斯科的改组"
 TaS_GEREpilogue_news.21.d: "在遭受了数十年的军事管制后，莫斯科专员辖区即将在不久的将来迎来一个文官政府。根据现有消息，这项改组计划是由大日耳曼国元首阿尔伯特·施佩尔亲自提出的。\n\n元首在对世界和当地媒体的讲话中声称，他早已计划实施这项改革，目的是为了结束莫斯科维恩的暴力和恐怖主义活动。元首还保证，在废除了奴隶制或新殖民主义政策后，所有斯拉夫人都将被赋予专员辖区公民的权利，而那些反抗军也将获得特赦。作为回报，他们将会停止武装叛乱，并成为帝国的“顺民”。与此同时，许多专家也在质疑，德国政府的这些声明和行动是否与其在莫斯科维恩的真正意图相符。\n\n世界各国以及德国的许多盟友都对通过外交手段来结束当地暴力活动的这种趋势表示了欢迎。除了表示将会继续“坚定地支持”德国的一切行动外，他们尽量避免就此事发表其他评论。"
 TaS_GEREpilogue_news.21.a: "以新姿态，欢迎回家。"
 TaS_GEREpilogue_news.21.b: "莫斯科维恩终迎和平？"
