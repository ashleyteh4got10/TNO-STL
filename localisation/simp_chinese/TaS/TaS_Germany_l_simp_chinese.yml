 GWS_integration_committee:0 "“阿勒曼尼亚”统合委员会"
 POSTWRW2_Integration_Committee_GWS_DESC:0 "一千五百年前，来自莱茵河对岸的法兰克部落，如蝗虫过境般席卷了高卢，留下的只有鲜血、废墟和破灭的希望——毕竟，这就是日耳曼人的本性。然而，仅仅在几个世纪后，罗马文明便征服了这些蛮族的野蛮精神，将他们改造成了热爱艺术、崇尚文化、思想自由、独立自主的法兰西人。 然而，仍有许多日耳曼部落游离于罗马文明的掌控之外，也正是他们，最终形成了各个日耳曼民族，并最终建立起那个名为德意志的怪物国家，所到之处，皆为焦土。\n\n捷克民族及其伟大的领袖以及这个国家伟大的领袖已经成功地遏制了德意志这头恶兽，但这又能持续多久呢？但这种局面又能维持多久呢？为了让我们的子孙后代永远不再沦为奴隶，捷克人必须效仿罗马人曾经对法兰克人所做的一切：将这些野蛮人驯化为文明人。然而，既然法兰西文化早已存在，我们又何必舍近求远，多此一举呢？\n\n阿勒曼尼亚统合委员会已经制定了一套方案，旨在彻底摧毁野蛮的德意志文化、野蛮的德语以及所有和德意志有关的一切，并用更加先进的法兰西文化、法语和一种全新的“阿勒曼尼亚”身份认同来取而代之，新的阿勒曼尼亚人将对那些将他们从野蛮的枷锁中解放出来的人们充满敬意。"
 GBW_integration_committee:0 "“德意志”统合委员会"
 POSTWRW2_Integration_Committee_GBW_DESC:0 "德国必须付出代价。自第一次世界大战结束之后，这种想法便在许多人心中生根发芽，但华盛顿和伦敦那些身居高位的叛徒们，却决定饶恕这个欧洲大陆有史以来孕育出的最可怕的国家。而他们的仁慈，最终导致了超过一亿人惨遭杀戮。这一次，我们决不能再重蹈覆辙！德国是传播极端主义、反人类意识形态的罪恶之源，是他们，摧毁了捷克斯洛伐克、波兰、俄罗斯和法国！这个国家犯下的罪行罄竹难书，不可饶恕。\n\n德国必须付出代价。我们要摧毁他们的工业，破坏他们的农业，让那些犯下滔天罪行的日耳曼人要么忏悔，要么灭亡。这片被纳粹毒瘤污染的土地，将由爱好和平的民族——捷克人、波兰人、犹太人——来居住。所有渴望和平的人们，都将在这里找到属于自己的家园。\n\n以眼还眼，以血还血。血债血偿。"
 GAU_integration_committee:0 "“卡兰塔尼亚”统合委员会"
 POSTWRW2_Integration_Committee_GAU_DESC:0 "公元九世纪，日耳曼人犯下了不可饶恕的罪行！他们征服了独立而强大的卡兰塔尼亚，这片斯拉夫人的第一个国家，就这样屈辱地倒在了日耳曼人的铁蹄之下。狡猾的日耳曼人用花言巧语欺骗了卡兰塔尼亚人，他们承诺提供保护，换取臣服的誓言，最终却背信弃义，将卡兰塔尼亚的文化与历史彻底从这片土地上抹去。此后，日耳曼人便更加肆无忌惮，他们继续在斯拉夫人的土地上推行日耳曼化政策，并妄图将魔爪伸向更远的地方。\n\n如今，捷克人终于有机会重振这个古老的国家，就像他们复兴自己的国家一样。从时间的灰烬中，一个强大、友好、忠诚的盟友即将崛起。为了实现这一目标，我们必须扭转日耳曼化的进程——幸运的是，对于波西米亚人来说，这并非什么难事。"
 TaS_Post2WRW_GCZ_zone_of_integration:0 "整合区"
 GCZ_Antonin_Novotny:0 "安东宁·诺沃特尼"
 TaS_Post2WRW_GCZ_sudetenland_genocide:0 "种族清洗"
 TaS_Post2WRW_GCZ_sudetenland_genocide_desc:0 "1938，那一年，侵略、同化、报复……过往的伤痛，如一道巨大的伤疤，永远地烙印在捷克民族的心脏之上。我们绝不能忘记德国人犯下的罪行，如今，复仇已然成为我们政策的基石——我们要让德国人为他们所做的一切付出代价。\n\n阿洛伊斯·格雷贝尼切克，一位从那段恐怖历史中幸存下来的战士，如今领导着这个新生的捷克国家。他高举“复兴国家与民族”的旗帜，而这冠冕堂皇的口号背后，是对德国人的残酷迫害，即使那些已经在捷克土地上生活了几百年的德国人也难逃一劫。驱逐、清洗…暴力的浪潮席卷着捷克的每一个角落，人们疯狂地渴望用鲜血换取所谓的“正义”。"
 TaS_Post2WRW_GCZ_big_brother:0 "北方的老大哥"
 TaS_Post2WRW_GCZ_big_brother_desc:0 "俄罗斯，欧洲的新主人，带来了全新的秩序。他们试图在这片大陆上建立一套全新的体系——与纳粹的统治截然不同，但推行的手段却如出一辙：刺刀与暴力。俄罗斯人害怕“叛乱”和“混乱”，因此他们强行推行所谓的“同居政策”，说白了，就是让捷克人和德国佬生活在同一个屋檐下。\n\n这是我们绝对不能容忍的！我们有责任控制“捷克化”的进程，防止它演变成一场毫无理智的种族屠杀。否则，俄罗斯人将会以“恢复秩序”的名义，将战火引到我们的家园。而我们绝不愿看到那样的后果。"
 TaS_Post2WRW_GCZ_czechia_revival:0 "捷克复兴"
 TaS_Post2WRW_GCZ_czechia_revival_desc:0 "四十年……捷克民族背负着屈辱与苦难，在黑暗中踽踽独行了整整四十年。德国人试图将我们变成温顺的奴隶，变成毫无尊严的波西米亚人，但他们失败了。如今，捷克民族正在浴火重生，从第三帝国的废墟中站立起来。我们要拿回属于我们的一切！那些在占领期间被掠夺的财富，那些被践踏的尊严，那些被遗忘的历史！属于捷克的未来，必将由捷克人自己主宰。尽管前路依然充满荆棘，但我们正在一步步地克服困难，捷克的未来也终将迎来光明。"
 POSTWRW2_Alois_Grebenicek_DESC:0 "耻辱与背叛，贯穿了阿洛伊斯的一生，也概括了每一个捷克人的一生。\n\n作为屠夫的儿子，阿洛伊斯从小耳濡目染，梦想着继承父亲的衣钵，并最终如愿以偿。然而，德国人的到来改变了一切。他们肆意摧残捷克的文化、语言和传统，践踏着捷克人的尊严。阿洛伊斯忍无可忍，毅然决然地加入了抵抗运动，并险些成功刺杀了那个臭名昭著的波西米亚刽子手——莱因哈德·海德里希。然而，刺杀行动失败了，随之而来的是纳粹疯狂的报复，整个波西米亚都笼罩在恐怖的阴影之下。大多数抵抗战士惨遭杀害，或被送往集中营，阿洛伊斯也没能逃脱魔爪。面对酷刑，他始终没有屈服，内心燃烧着复仇的怒火——他发誓，一定要让那些德国杂碎血债血偿。在漫长的囚禁生涯中，他从未放弃过逃跑的希望。十年后，德国爆发内战，阿洛伊斯终于等来了机会，和其他几名囚犯一起，逃出了人间炼狱。几经辗转，他终于回到了久违的故土，然而，这里早已物是人非。他在家乡组织了一支游击队，一边谨慎地与敌人周旋，一边等待着最后一击的时机。他们等了很久，直到那场新的战争爆发。当俄罗斯的军队势如破竹，直捣德国腹地时，阿洛伊斯意识到，复仇的机会终于来了。他率领游击队，在波西米亚各地发动了一系列袭击，沉重地打击了德国人的统治。当俄罗斯的旗帜插上柏林的国会大厦时，阿洛伊斯成功争取到了波西米亚的自治权。他和他的族人，都经历了太多苦难。如今，他将竭尽全力，重建家园，让每一个德国人都为他们的罪行付出代价，让他们的名字永远被刻在耻辱柱上。\n\n§R复仇的时刻到了！"
 POSTWRW2_Alexander_Dubcek_DESC:0 "杜布切克的童年并不快乐。四岁时，他便跟随家人辗转于吉尔吉斯公社和高尔基，颠沛流离。在苏联度过的青春岁月，教会了他热爱社会主义，热爱劳动，以及勇敢地面对一切困难。\n\n1938年，他回到了祖国。一年后，他加入了捷克斯洛伐克共产党。德国入侵后，斯洛伐克共和国宣告成立，杜布切克积极参与反法西斯运动，并与地下抵抗组织保持着密切联系。后来，他更是在斯洛伐克领导了一场声势浩大的反政府社会主义运动。他还对捷克的抵抗运动提供了大量的支持，然而，由于德国的残酷镇压，捷克的抵抗力量屡遭重创。\n\n转机出现在俄罗斯与德国之间的战争期间。在杜布切克的领导下，整个斯洛伐克都掀起了反抗蒂索政权的浪潮。斯洛伐克社会主义共和国宣告成立，捷克斯洛伐克也最终获得了重生。然而，摆在杜布切克面前的，是更加艰巨的挑战：饥饿、贫困、工业凋敝，以及文化冲突和意识形态对抗。捷克斯洛伐克必须尽快决定德国遗产的命运，以及那些德国人的未来——他们对捷克和斯洛伐克这两个兄弟民族的影响必须被彻底清除。政治上的统一也至关重要，这也是杜布切克多年来为之奋斗的目标，而现在，他的目标将是整个捷克斯洛伐克。\n\n尽管现实依然残酷，但有一点是毋庸置疑的：捷克斯洛伐克的未来，在于自由。只有工人和农民，教师和普通民众，万众一心，共同努力，才能创造出他们为之奋斗多年的美好未来。"
