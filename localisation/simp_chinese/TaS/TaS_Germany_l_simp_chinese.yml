 POSTWRW2_Michal_Kovac_DESC:0 "米哈尔·科瓦奇对德国的占领一直深恶痛绝。德国人强行入侵了他的祖国，并在此地建立了他们的统治。二战结束后，局势急剧恶化，科瓦奇的国家彻底沦为了德国的附庸，对德国形成了全面的依赖。\n\n然而，在米哈伊内心深处，始终燃烧着一个梦想——一个摆脱纳粹枷锁、重获自由的斯洛伐克。早在大日耳曼国摇摇欲坠之际，他便开始朝着这个方向努力。作为一位热血的爱国者，曾在赫林卡卫队服役的他，试图以和平手段推动国家变革。然而，他缺乏足够的政治力量，改革之路困难重重。\n\n随着俄罗斯人的到来，米哈伊终于看到了实现梦想的一线曙光。莫斯科对布拉迪斯拉发的控制相对宽松，这为米哈伊提供了宝贵的自由空间，他决心充分利用这一机会。更为重要的是，他的盟友们对于政府的人事安排并不太感兴趣，这为米哈伊实现梦想创造了更加有利的条件。"
