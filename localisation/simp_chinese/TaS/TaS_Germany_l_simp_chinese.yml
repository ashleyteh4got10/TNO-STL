 POSTWRW2_Gunter_Guillaume_DESC:0 "威利·勃兰特的忠诚伙伴和盟友——君特·纪尧姆，接替了他的前任，成为了新的领袖。然而，尽管已故的勃兰特对他信任有加，但仍有许多人对这位新领导人疑虑重重，并注意到他身上越来越多的怪异之处。\n\n深居简出、几乎空白的过往履历、对工作的极度投入——这一切都让人们对他产生了怀疑。许多人不禁要问：金特·纪尧姆究竟是何许人也？作为勃兰特的继任者，他的意图真的纯粹吗？\n\n这些猜疑并非空穴来风，事实上，君特·纪尧姆早年不过是一个碌碌无为的普通人。然而，在他加入国家保安局之后，一切都改变了。事实证明，纪尧姆拥有着无与伦比的间谍天赋，这也让他很快便受到了上级的赏识。\n\n很早以前，纪尧姆就被国家保安局秘密安插在了勃兰特的身边，成为了他的“影子”。而如今，随着勃兰特的去世，他终于等来了属于自己的机会，一个能够为国家保安局建功立业的机会。"
 TaS_GEREpilogue.44.t: "元帅的行动"
 TaS_GEREpilogue.44.d: "和往常一样，奥伯兰德抵达工作地点后，顺路环视了人民大厅和它周围的广场。看到眼前这秩序井然的景象，奥伯兰德的心情格外舒畅，随后，他便走进了大楼。像往常一样，他的同僚和政府成员们正在那里等着他。在会议正式开始之前，为了有足够的时间来审阅那些从清晨就堆放在国家议会议长办公桌上的各种信件和报告，他决定提前来到办公室。随着时间的推移，会议预定的开始时间也越来越近，一杯咖啡早已被他一饮而尽。在会议开始前几分钟，奥伯兰德来到了会议室，像往常一样坐在了自己的位置上，与此同时，其他的政府成员们也纷纷落座，奥伯兰德再次陷入沉思。\n\n突然，会议室的大门被猛地撞开了，在一瞬间，士兵们从门口冲了进来。与此同时，从备用出口处也冲进来一群士兵。他们手中的武器早已上膛，并对准了在场的所有政府成员。\n\n“这里究竟发生了什么？！”从座位上跳起来的奥伯兰德对着士兵们大声质问道。但士兵们，以及那些军官们，都对此默不作声。\n\n“发生了什么？哈！就让我来告诉你吧，”一个熟悉的声音响起，随后，舍尔纳元帅从正门大步走了进来。\n\n“哦！我来告诉你这里发生了什么，奥伯兰德先生！你因涉嫌叛国和企图颠覆我们伟大的国家而被捕了。政府和议会的成员们也因涉嫌与你同谋而一同被捕。”他说道。此时此刻，政府成员们，当然也包括奥伯伦德本人，都被眼前这突如其来的变故惊呆了。\n\n随着时间的推移，除了国家议会、人民大厅和元首官邸外，效忠于舍尔纳的武装部队也控制了首都的所有战略要地。最终，德意志彻底落入了舍尔纳的掌控之中。"
 TaS_GEREpilogue.44.a: "震惊的国家"
 TaS_GEREpilogue_news.22.t: "[Get_newspaper_header]德意志军事政变！"
 TaS_GEREpilogue_news.22.d: "根据各方紧急传来的消息：大日耳曼国发生了一场军事政变，政变的领导者，或者说根据一些消息灵通人士提供的消息来看，是这场政变的策划者——陆军元帅费迪南德·舍尔纳。政府中的大多数成员都已被逮捕，元帅的部队还控制了德国首都的大部分政府机关和部门。\n\n世界各地的许多政府和国家领导人都对这些事件表示“深切关注”，其中相当一部分人对军政府的行动提出了强烈谴责，其中也包括美国和日本。"
 TaS_GEREpilogue_news.22.a: "新元首万岁！"
 TaS_GEREpilogue_news.22.b: "世界为之震惊。"
 ZNE_Markus_Wolf:0 "马库斯·沃尔夫"
 ZNE_Markus_Wolf_DESC:0 "鲍曼、施佩尔、奥伯伦德、塔登、阿布斯——他们绝不代表全体德国人。绝不是所有德国人都支持阿道夫·希特勒，无论是在他上台之前，还是在他当政之后。诚然，德意志民族没有能够凭借自己的力量推翻国家社会主义的枷锁，但我们又怎能去苛责一个被囚禁了四十年之久的民族呢？\n\n当西方的将军、政客和记者们出于各种原因与这位新生的、民主德国的领导人会晤时，马库斯·沃尔夫总会不遗余力地向他们宣传这一观点。尽管沃尔夫认为自己更倾向于社会主义，但他深知，如果在此时带领德国走上这条道路，那么来自OFN的怒火将彻底吞噬他的祖国。他唯一能做的，就是满怀希望。他希望，在未来，德国能够坚定地走上一条光明的、如同初升的太阳那般鲜红的社会主义道路，彻底摆脱笼罩在德意志民族头顶长达数十年的阴霾——纳粹主义的阴霾，并在彻底摆脱OFN的束缚后，成为一个真正自由的国度。"
