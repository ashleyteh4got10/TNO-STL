 TaS_Post2WRW_ZNE_exec_centre:0 "解决方案执行中心"
 TaS_Post2WRW_ZNE_exec_centre_desc:0 "构想纵然辉煌，若无执行力也不过是空中楼阁。中欧守备军的触角本应遍及昔日纳粹帝国的每个角落，随时准备执行来自最高指挥部的任何指令——至少，这曾是约瑟夫·拜尔利的心愿。但现实是，守备军深陷在对东德广袤土地的镇压之中，无力对易北河以西的政权或东欧的缓冲国施加任何实质性的影响。所幸，在达摩克利斯之剑的威慑下，鲜有人胆敢反抗我们。"
 TaS_Post2WRW_BRL_ZNE_russian_army:0 "俄军部队"
 TaS_Post2WRW_BRL_ZNE_russian_army_desc:0 "共产党人将权力视为对暴力的垄断，这一点我们很难否认。在德国这片满目疮痍的土地上，军队是维持秩序和某种程度稳定的关键力量。可以说，军队本身就是权力。让红军毫不留情地摧毁任何威胁我们在该地区统治地位的势力吧。同志们，请牢记，我们的事业是正义的！"
 POSTWRW2_Beyrle_DESC:0 "复仇如同一道冷盘佳肴，只有耐住性子方能品其真味。二战期间，约瑟夫·拜尔利不幸被俘，更令人意外的是，他竟被遗忘在那不见天日之地。\n\n战争结束后，许多美国战俘通过交换回到了祖国，但拜尔利却被排除在外。莫斯科维恩种植园的岁月在他身上留下了不可磨灭的印记——饥饿、恶劣的环境，种种折磨历历在目。因此，当一位自称罗迪恩的前党卫军师长向他提供逃生的机会时，即使面对的是俄罗斯的无政府状态，他也毫不犹豫地答应了。随之而来的是一场必败的战争、彻底的无序以及统一战争的烽火。\n\n但复仇的时刻终于到来。战败的德国如今烈焰焚天，而拜尔利的目标只有一个：维持昔日世界之都周边地区的秩序。狼人以及其他纳粹组织在这一地区的势力远超其他地方。但这改变不了任何事。§R正义终将得到伸张，每一个德国人都将为他们的所作所为付出代价。"
 POSTWRW2_Louis_Ferdinand_DESC:0 "路易·斐迪南——霍亨索伦王位的继承人。在1933年回到德国之前，他一直生活在美国，潜心学习工程学。回到德国后，路易一头扎进了德国的航空工业。到了20世纪40年代末，他开始涉足商业，成为了艺术赞助人，同时也是国家社会主义理念的被动支持者。\n\n20世纪50年代，发生了震惊世界的“不莱梅事件”，路易·斐迪南被红军派的恐怖分子劫持为人质。官方说法是，在自由军团的积极协助下，路易·斐迪南在创纪录的短时间内获释。但真实情况是，赤军旅劫持路易的目的，是为了利用他的良好声誉和广泛声望在德国人中传播左翼激进思想。迫于自身和妻子的人身安全，这位德国王位继承人只能被迫屈从于恐怖分子的要求。\n\n就这样，在漫长的煎熬中，怀疑的种子和对革命恐怖分子的同情在路易心中悄然生根。而他在民众中的声望，恰恰成为了红军派的武器，让他们能够年复一年地进行着危险的煽动。他们一步一步地，在德国人，特别是在普鲁士人中，培养着对自己的支持。路易虽然秉持着传统的保守主义，但却成功地吸引了普通保守派的注意，甚至让最顽固的保守主义者也开始反思自己的世界观。\n\n东部战争的结束标志着旧日思想，包括君主制的复兴。路易将自己定位为“君主社会主义者”，准备为贫困阶层提供援助。但与此同时，红军派却更加肆无忌惮地渗透到公民的日常生活、政治、军队以及经济领域。他们日复一日地向这位“人民的王子”提出越来越多的要求，为马克思列宁主义的传播悄然铺路。\n\n也许，终有一天，这位王子留给世人的只剩下一个名字，而人民将高举起那血红色的旗帜..."
 BRL:0 "解放区管理总局"
 BRL_DEF:0 "解放区政治管理总局"
 BRL_ADJ:0 "柏林"
 TaS_Post2WRW_BRL_mind_centre:0 "决策中心"
 TaS_Post2WRW_BRL_mind_centre_desc:0 "解放区总局是俄罗斯占领区德国的独立控制中心，曾经属于狂热的纳粹分子、如今则属于坚定的反法西斯战士。从阿姆斯特丹到利沃夫，从维也纳到奥斯陆，广袤土地上的所有法律、指令和命令，都从这里发出。弗拉基米尔·吉尔，这位庞大机关网络、各部门和下属机构的最高领导者，正是在此俯瞰着自己如何亲手锻造欧洲的历史。"
 TaS_Post2WRW_BRL_nazi_heartland_1:0 "黑暗之心"
 TaS_Post2WRW_BRL_nazi_heartland_1_desc:0 "我们接管的这片土地，曾是人类历史上最可怕罪行的诞生地。日耳曼和西欧哲学的“合理结果”，孕育出一个将人类变为受骗野兽的政权。而如今，这些野兽正试图将我们赶出去。弗拉基米尔·吉尔和约瑟夫·拜尔利，肩负着将纳粹主义的余毒从这片土地上清除的重任，但这无法令他们畏惧。"
 TaS_Post2WRW_BRL_nazi_heartland_2:0 "黑暗之心"
 TaS_Post2WRW_BRL_nazi_heartland_2_desc:0 "在解放区总局官员的英明领导下，我们成功将权力根植于前大日耳曼国的腹地。如今，曾经的纳粹分子及其帮凶们正瑟瑟发抖，惶恐地等待着我们的下一步行动——那将一次性彻底终结纳粹主义。"
 TaS_Post2WRW_BRL_nazi_heartland_3:0 "黑暗之心"
 TaS_Post2WRW_BRL_nazi_heartland_3_desc:0 "人民大厅，这座纳粹巨型建筑的象征，如今已沦为废墟，“世界之都”的其他纪念碑也将步其后尘。我们要让德国人深刻认识到，他们的民族并非像他们在学校里被灌输的那样，是什么天选之民。飞得太靠近太阳，任何翅膀都会被烧成灰烬。"
 TaS_Post2WRW_BRL_nazi_heartland_4:0 "黑暗之心"
 TaS_Post2WRW_BRL_nazi_heartland_4_desc:0 "战场上的胜利仅仅是对纳粹主义的真正战争的前奏：一场智力的较量，一场宣传与鼓动的战争。柏林的警察如今为德国人民服务，而不是为纳粹党服务，希特勒的画像也不再占据着千家万户最显眼的位置。但这并不意味着纳粹主义已被彻底击败。是的，它已暂时撤退，却在暗中积蓄力量，伺机反扑。因此，我们的工作远未结束，我们也将继续坚守在这里。"
 POSTWRW2_Gil_DESC:0 "人生在世，总有一些时刻值得驻足回望，一览来路。吉尔中校是否预见了苏联的最终覆灭？我想未必。名为罗迪恩的合作者是否料想到德国即将陷入内战的深渊？当然没有。普通士兵弗拉基米尔是否知晓，那场西俄战争会以旧政权的彻底崩溃而告终？更不可能。\n\n但回首过往真的如此重要吗？一切不过是个人认知的折射罢了。对弗拉基米尔来说，回首往事是件无比艰难的事情。然而历史从不受假设的约束。或许，吉尔会成为烈士，他的名字将在联盟的史册中永垂不朽；罗迪恩也许会成为坦波夫公司手中的一枚棋子；而弗拉基米尔，或许会成为解放苏联的英雄。只是，这一切都没有发生。\n\n如今，中欧的全部土地已落入这位新生俄罗斯帝国将军的掌控，这才是唯一重要的事实。红色游击队、纳粹残党、崩溃的基础设施…这些还只是他面临的难题的冰山一角。但吉尔已经立下誓言，他会坚守到最后一刻，只要他还执掌着这份权力，德国就绝不可能东山再起。"
