 BRL_USA_William_Westmoreland:0 "威廉·威斯特摩兰"
 BRL_USA_William_Westmoreland_DESC:0 "难以置信。这便是威廉·蔡尔兹·威斯特摩兰将军对自己所见、所闻以及所领导的一切的唯一感想。“自由国家组织中欧军事管制委员会”——这便是他统领的驻军所控制的这片土地的官方名称。在曾经的人民大厅中建立了自己的司令部后，威斯特摩兰得以直接指挥OFN的庞大驻军。毫无疑问，他已经站上了自己军事和政治生涯的顶峰。然而，高处不胜寒，从顶峰跌落的后果也将格外惨烈——甚至是致命的。\n\n诚然，尽管威斯特摩兰如今大权在握，但他的一举一动都在时刻牵动着全世界数十亿人的目光，这些目光正紧盯着他，似乎期待着他会随时犯下大错。绝不能如他们所愿！威廉·蔡尔兹·威斯特摩兰将军将不辱使命，完成组织交付给他的每一项任务：将中欧从纳粹的魔爪中彻底解放，将昔日死敌的心脏地带转变为OFN最为坚固的堡垒，并且将那些仍然负隅顽抗的纳粹分子一个不留地从欧洲的土地上彻底抹去！"
