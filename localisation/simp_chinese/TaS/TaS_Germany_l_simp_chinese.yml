 TaS_Post2WRW_GHL_careless_monach:0 "冒失之君"
 TaS_Post2WRW_GHL_careless_monach_desc:0 "荷兰国王对管理自己的国家没有表现出多少热情，而更关注日常生活，无视国家迫在眉睫的问题。"
 TaS_Post2WRW_GHL_holland_identity:0 "荷兰身份"
 TaS_Post2WRW_GHL_holland_identity_desc:0 "我们不是德国人、法国人或英国人，我们是荷兰人，经过这么多年，我们的王国终于可以决定自己命运，而无需柏林批准。"
 POSTWRW2_Juliana_DESC:0 "朱丽安娜早已不再奢望回归故土。然而，荷兰沦陷后，她也不可能在一个地方长久停留。当日本人入侵印度尼西亚时，她又被迫踏上了逃亡之路。澳大利亚、巴西、加拿大、苏里南……无休止的逃亡令人身心俱疲。就在她几乎放弃希望的时候，奇迹出现了。\n\n沙皇别洛泽尔斯基亲自致信朱丽安娜，邀请她返回荷兰。天知道是什么促使他做出如此举动——或许是想模仿旧时代的政治手腕，又或许是想在流亡君主之间展现团结的姿态。\n\n然而，当女王陛下踏上故土的那一刻，残酷的现实便将她包围：战争的创伤随处可见，残酷的镇压让民众看不到希望的曙光…一切都如预料般糟糕——一个支离破碎的国家，迎接他们的，是一位心碎的女王。"
 POSTWRW2_Willy_Claes_DESC:0 "尼德兰——一片满目疮痍、生灵涂炭的土地。战争无情地夺去了数以万计的生命，数十万人流离失所、无家可归，然而这还远远不是终结。卢森堡的强行德意志化，比利时和荷兰文化与科学活动的彻底禁绝，弗莱芒人和瓦隆人之间的挑拨离间，这一切仅仅是大日耳曼国累累罪行中的冰山一角。尼德兰的人民早已对自身的命运感到麻木，他们试图让自己去适应这“新秩序”下残酷的现实。\n\n然而，即使是在这片饱经蹂躏的土地上，民族主义和自由的火种仍未熄灭。在乡村，人们默默地为游击队提供食物和庇护；在城市，关于自由和独立的思想如同暗流般涌动。直到最近，一个名为“Forces Bénélux de l'intérieur”/“Benelux Strijdkrachten van Binnenlandse Zaken”（FBI，即比荷卢内部力量）的统一战线组织终于诞生，它将过去那些各自为战的地方抵抗力量凝聚在了一起。维勒姆·克拉斯在这其中发挥了至关重要的作用，他既是组织的灵魂人物，也是其在政治舞台上的代言人。赢得了民众的广泛信任和拥戴后，该组织趁着东线再次爆发大战的契机，向占领军发动了猛烈的攻势。\n\n在征服者们的默许下，“比荷卢内部力量”成为了这片土地上最具影响力的组织。但即便如此，统一后的尼德兰仍然面临着无数的挑战——从行政、立法到政治、意识形态的冲突，矛盾无处不在。民族主义者和社会主义者之间的斗争令整个国家岌岌可危。尽管如此，只要维勒姆·克拉斯仍然掌舵着尼德兰联邦这艘巨轮，卢森堡、比利时和荷兰这三个国家的未来就仍然充满着希望的光芒。"
