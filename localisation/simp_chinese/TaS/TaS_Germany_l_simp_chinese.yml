 TaS_GERCollapse.20.t:0 "弃卒保车"
 TaS_GERCollapse.20.d:0 "血。\n\n鲜红粘稠的血喷溅得到处都是。野战军医争分夺秒地想要挽救阿尔伯特的生命。他身上的弹片已经被取了出来，伤口也经过了紧急包扎处理。但在这长达一个半小时的剧痛之中，他一直死死地盯着一枚在他胸前不停晃动的士兵铭牌，这是他正式成为这个世界上最优秀军队的一名士兵、为这个世界上最优秀民族服役的证明——至少他曾经是这么认为的。\n\n这场战争彻底改变了他的认知，也让他明白了许多事情。他终于领悟到了那些所谓的“国家政权”的毫无意义之处，也终于认清了纳粹政权的虚伪，以及作为这可悲一切的始作俑者——国防军——这个被一群劣等民族所彻底摧毁的空壳，也不复存在了。\n\n终于，当手术结束后，阿尔伯特一把扯下那块铭牌，将它狠狠地摔在地上。随后，他颤颤巍巍地起身，离开了战地医院，并且再也没有回来。"
 TaS_GERCollapse.20.a:0 "从一支早已荡然无存的军队中“光荣退伍”是否还称得上“退伍”呢？"
 TaS_GERCollapse.21.t:0 "尘封的往事"
 TaS_GERCollapse.21.d:0 "阵阵自动武器射击的声响将玛蒂尔德从睡梦中惊醒。这位年迈的妇人摸索着自己的手杖，慢慢地挪到了窗边。窗外，一具党卫军士兵的尸体横陈街头，身上布满了密密麻麻的弹孔和刺刀留下的伤口，鲜血汩汩流淌，染红了路面。就在这时，一伙全副武装的壮汉突然破门而入，他们手臂上带着红色的袖标，还扛着一门迫击炮。眼前的这一幕瞬间将玛蒂尔德的记忆拉回了那个风雨飘摇的年代——巴伐利亚苏维埃共和国存在的最后时日。\n\n“把阁楼的门打开。”\n\n“什…什么？”\n\n“把阁楼的门打开，老太婆。否则我们就把它砸开。”\n\n玛蒂尔德只得将钥匙交给了他们。他们把迫击炮拖上了阁楼，朝着某个目标开了几炮，然后就匆匆地离开了这栋房子。惊魂未定的玛蒂尔德手忙脚乱地收拾好自己的东西，跌跌撞撞地逃出了家门。"
 TaS_GERCollapse.21.a:0 "因为炮火随时可能再度降临。"
 TaS_GERCollapse.22.t:0 "釜底抽薪"
 TaS_GERCollapse.22.d:0 "一摞又一摞的文件被胡乱地塞进公文包，文件纸张发出的沙沙声在空旷的办公室里回荡。卡尔，一名毫不起眼的党务职员，正手忙脚乱地收拾着文件。不知出于何种原因，党内的高层突然急需这批文件，因此，他不得不亲自前往人民大厅的档案室领取这些堆积如山的文件。大概，他们只是想把这些文件通通付之一炬。\n\n走下楼梯的时候，卡尔隐约听到了一阵低沉的滴答声。他下意识地转过身，在窗台上看到一个体积不大不小的手提箱。卡尔立刻意识到这意味着什么，但是一切都已经太迟了。在它做出任何反应之前，计时结束，爆炸装置被引爆。巨大的冲击力瞬间吞噬了卡尔和附近几个倒霉蛋的生命。"
 TaS_GERCollapse.22.a:0 "德意志人民的心在滴血。"
 TaS_GERCollapse.23.t:0 "殒命航班"
 TaS_GERCollapse.23.d:0 "“88号基地，请回答！88号基地！”导弹及航天部队网络指挥官声嘶力竭地喊道。但任凭他如何呼叫，无线电中始终没有传来任何回应。而那枚从88号基地发射的导弹则继续向北飞行，穿越了帝国的边境，朝着OFN在北极地区坚如磐石的冰雪堡垒——冰岛直扑而去。\n“施特赖芬长官！元首来电！”一位年轻的副官急匆匆地汇报道。“继续监视那枚导弹的动向！并立刻派人前往88号基地，马上！”指挥官一边下达命令一边快步走出房间。当那扇厚重的房门在他身后重重地关上时，整个房间里所有的工作人员，从资深通讯员到临时调派来的文员，都在心中默默祈祷，尽管他们谁都没有说出口："
 TaS_GERCollapse.23.a:0 "“上帝保佑，希望美国的防空系统能顶用。”"
 TaS_GERCollapse.24.t:0 "雷霆反击"
 TaS_GERCollapse.24.d:0 "就在冰岛方面传来导弹被拦截的消息后不久，OFN的所有战机都紧急升空，它们的航向直指两个地点：雷克雅未克和阿灵顿——五角大楼的所在地。\n\n美国、加拿大、澳大利亚以及自由世界的其他所有国家的高级军事将领都紧急集结到五角大楼的会议中心，共商应对之策。在会议上，大家主要围绕着两种意见激烈的争论着：克雷顿·艾布拉姆斯将军提出的“艾布拉姆斯计划”以及威廉·威斯特摩兰将军所主张的“威斯特摩兰战略”。\n\n艾布拉姆斯将军提议，应当对敌方的民用和军事基础设施发动先发制人的打击，然后派遣海军陆战队登陆，并在战术空军、装甲部队和炮兵的掩护下对残存的抵抗力量展开清剿。而威廉·威斯特摩兰将军则认为，被俄罗斯人重创的德国已然元气大伤，其统治崩溃只是时间问题，因此，目前只需集结一支强大的舰队封锁北大西洋，为将来的登陆占领做好准备即可。\n\n最终，在经过长时间的争论和美国总统的亲自干预下，会议最终采纳了威斯特摩兰将军的战略。"
 TaS_GERCollapse.24.a:0 "而现在，我们只需静候佳音…"
 TaS_GERCollapse.25.t:0 "新维也纳"
 TaS_GERCollapse.25.d:0 "“同志们，请听我说！”演讲者慷慨激昂地说道。在十几面红旗的环绕下，在成千上万双眼睛的注视下，他继续说道：\n\n“那些一直以来骑在奥地利人民头上作威作福的法西斯分子们，他们那摇摇欲坠的统治早已时日无多，很快就将在人民的汪洋大海中彻底覆灭！因此，为了加速这一进程，早日解放全体被大日耳曼国奴役的人民，我们，自由的奥地利人民，在此宣告维也纳公社正式成立！”\n\n与此同时，远处还隐约传来阵阵枪声，那是发生在城市边缘的零星战斗——仍有一些人民行动队和党卫军的残兵败将们试图对抗势不可挡的、由人民群众所组成的红色洪流。尽管普通的维也纳老百姓还无法确定公社到底能存在多久，但每个人的脸上都洋溢着幸福和喜悦，因为维也纳在历经了这么多年的沉沦后，终于重获自由。"
 TaS_GERCollapse.25.a:0 "获救的维也纳人民，无论老少，齐聚在广场上，载歌载舞。"
 TaS_GERCollapse.26.t:0 "小白鹰"
 TaS_GERCollapse.26.d:0 "枪声、爆炸声、熊熊燃烧的大火，构成了一幅末日般的景象。在德意志和波兰这两个国家的领土上，战火正在肆虐，生灵涂炭，数以千计的德国人和波兰人永远地闭上了自己的双眼。而在这一切的混乱之中，一个名叫威廉的孩子，尽管年纪尚小，但他却早已成长为一名为了自由波兰而战的勇敢战士。此刻，他正在自己家乡那早已沦为战场的街道上玩命狂奔。他躲避着从天而降的燃烧着的房梁碎块，朝着他曾经的母校奋力冲去，脚下的石子路已被炸得面目全非。\n\n那所学校已然成为波兰游击队武装的一处坚固据点，而且他们很快就将遭到敌人的轰炸。这是威廉从一名在小巷中垂死挣扎的党卫军士兵身上搜出的德军电台里偶然听到的消息。在九死一生地赶回学校后，他立即将自己听到的消息告诉了所有人，全体人员随即撤到了地下室，仅仅两分钟后，敌人毁灭性的炸弹便落在了学校的房顶。威廉觉得自己像一个拯救了众人的英雄。"
 TaS_GERCollapse.26.a:0 "而他也的确是一位英雄。"
 TaS_GERCollapse.27.t:0 "变天了"
 TaS_GERCollapse.27.d:0 "“早就该这样了！”“是时候跟这些混蛋清算旧账了！”以及那声嘶力竭的怒吼——“去他妈的团结协定！去他的德国人！”\n\n这些口号响彻奥斯陆的中心广场。\n\n意识到德国人已经是日薄西山，色厉内荏，挪威人民终于下定决心要奋起反抗，成为那压垮德意志骆驼的最后一根稻草。\n\n终于，最后一面象征着卖国政府的旗帜被降了下来，取而代之的，则是那面在过去只与米洛格运动联系在一起的旗帜。\n\n但是从今往后，这面旗帜将成为一个崭新的、获得了自由的挪威的象征。\n\n尽管还有一些诸如国防军和党卫军这样的武装组织仍然盘踞在奥斯陆，但它们已然丧失了昔日那令人恐惧的统治力。"
 TaS_GERCollapse.27.a:0 "它们不过是一群待宰的羔羊罢了。"
 TaS_GERCollapse.28.t:0 "机遇之窗"
 TaS_GERCollapse.28.d:0 "“请各位就座，同志们。今天我们要讨论的是一个至关重要且紧急的议题。”基里尔一边说着，一边走进会议室，这里已经聚集了五位将军。\n\n与此同时，他从手中的皮质文件夹中取出几页文件，迅速地分发给了在座的各位将军。\n\n随后，吉尔继续说道：\n\n“根据我们的情报部门——总参谋部情报总局所获取的一份重要情报，由于近期发生在大日耳曼国的一系列事件，美国人正准备发动一场军事行动，旨在彻底推翻纳粹政权。而关于这份情报的可靠性，我已经向上头做了汇报，获得了他的首肯。”\n\n“那么，您具体想让我们怎么做呢，弗拉基米尔·弗拉基米罗维奇？”欧洲军区司令员阿纳托利·瓦维洛夫问道。\n\n“这正是要仰仗您的地方了，阿纳托利·格奥尔基耶维奇。您的任务是：率领部队越过与德国的边界，在最短的时间内占领其领土——至少要推进到奥得河一线，包括前首都柏林。”\n\n突然，其中的一位将军插话进来：\n\n“请恕我直言，弗拉基米尔·弗拉基米罗维奇，这样的行动对于我们国家来说，是否代价过于高昂了呢？毕竟，我们才刚刚结束对东部各‘总督辖区’的军事行动。我担心我国人民可能不会欢迎这样一场冒险的军事行动。”\n\n“这正是我提议现在就进行投票表决的原因。”\n\n经过两个小时的激烈讨论，最高军事委员会最终做出了决定："
 TaS_GERCollapse.28.a:0 "启动“七日挺进奥得河”计划"
 TaS_GERCollapse.28.b:0 "应当暂时按兵不动，静待美国人先动手"
 TaS_GERCollapse.29.t:0 "亲密无间的盟友"
 TaS_GERCollapse.29.d:0 "玛乔丽对政治一窍不通。她只知道美国和德国的关系不太融洽，但她万万没想到双方的敌意竟已如此之深。\n\n过去三年来，她一直在美国大使馆中担任一位外交官的秘书。而现在，她和自己的上司以及其他的使馆工作人员都被一群荷枪实弹的暴徒控制，关押在一间狭小的地下室里。\n\n为了让自己冷静下来，并试图理清究竟是哪里出了问题，玛乔丽开始回忆起今天早上发生的一切。\n\n7点整，她照常抵达大使馆，开始为自己的上司准备咖啡，而她的上司通常会在15分钟后抵达。然而就在煮咖啡的过程中，她突然听到一阵阵用德语叫喊的咒骂声，紧接着是一连串的打砸声和搏斗声。她跑到窗边，发现那些暴徒正在解除使馆警卫的武装，并打砸着大使馆的窗户。"
 TaS_GERCollapse.29.a:0 "噩梦从这里开始了。"
 TaS_GERCollapse.30.t:0 "死亡之海"
 TaS_GERCollapse.30.d:0 "“宰了这帮杂碎！”一名身着党卫军制服的军官大声吼叫着。\n\n“他们在这里，这些种族的叛徒和美国的间谍！”一名“德意志民防军”成员附和道。\n\n各种临终前的惨叫声和施暴者们野兽般的嚎叫声在港口上空回荡。一名看上去不过二十出头的年轻小伙子正拼命地捂住自己喉咙上汩汩流淌的伤口，而另一个与他年纪相仿的年轻人却在他的背上疯狂地捅着刀子。汉堡港早已被混乱和血腥彻底笼罩，成百上千的民众，无论他们是美国人还是德国人，在那一天惨死在这群暴徒的手下。\n\n当暴行结束时，行凶者们也纷纷撤离。他们很清楚，他们的所作所为将在历史上留下浓墨重彩的一笔。"
 TaS_GERCollapse.30.a:0 "一道永远也无法抹去的血色伤痕！"
 TaS_GERCollapse.31.t:0 "未雨绸缪"
 TaS_GERCollapse.31.d:0 "今天，加利福尼亚的天空格外炎热。自由国家组织各成员国的领导人之间那场针锋相对的争吵已经持续了三个小时。争论的焦点只有一个——自第二次俄德战争以来，大日耳曼国究竟发生了什么样的变化。\n\n“总理先生！我的人民选举我成为加拿大的领导人，而不是澳大利亚的傀儡。因此，我只需要对我的人民负责！我在此郑重声明，加拿大的人民绝不会同意将我们最优秀的儿女们送到欧洲的绞肉机里，仅仅为了向那该死的元首证明什么！”\n\n“我和您一样，都是民选的总理。而您，也应该和我一样明白一个道理，只要纳粹政权继续统治德意志，这个国家对世界的威胁就永远不会解除！看看他们对美国的所作所为，我们不难想象，在被俄罗斯人痛揍一顿之后，他们很可能会将屠刀挥向我们！。”\n\n在争论的过程中，澳大利亚和加拿大的总理逐渐阐明了各自的立场。前者主张立即对大日耳曼国发动入侵，推翻纳粹政权，并建立一个过渡政府。而后者则提议对德国实施制裁并加强自由国家组织的国家安全。在美国总统的提议下，双方最终达成了折中方案，一个融合了两方观点的第三方案——美国方案诞生了。"
 TaS_GERCollapse.31.a:0 "我们将按照美国的方式来解决问题！"
 TaS_GERCollapse.32.t:0 "重生"
 TaS_GERCollapse.32.d:0 "该死的交通堵塞！该死的这些蠢笨如猪的司机！该死的一切！迈克已经迟到了整整7分钟，而且到金融区至少还需要10分钟的车程。迈克曾不止一次地跟他的老板提过，今天是他的生日。但他只得到了一句冷冰冰的答复：“工作要紧”。\n\n而现在，他却被困在这一辆闷热的公交车里，动弹不得，还得前往该死的世界贸易中心。\n\n就在这时，公交车终于到站了，迈克猛地跳下车，拔腿就跑。他一边跑，一边想象着加拉赫先生那张因愤怒而扭曲变形的脸，以及即将劈头盖脸砸到自己身上的那些不堪入耳的辱骂。\n\n然而，令他始料未及的是，一阵突如其来的冲击波将他掀飞了出去，足足有两米远。这突如其来的变故源于一场剧烈的爆炸，一时间，整条街都被震耳欲聋的轰鸣声所笼罩。\n\n出于本能，迈克迅速趴倒在地，眼睁睁地看着他曾经工作的那座大楼在自己眼前轰然倒塌。无数的人惊恐地四散奔逃，而迈克也加入了逃亡的人潮之中。他漫无目的地奔跑着，一直跑到最近的一处地铁站入口才停下脚步。\n\n对他而言，一切都结束了。除了他那死里逃生的生命。"
 TaS_GERCollapse.32.a:0 "那天，迈克获得了重生。"
 TaS_GERCollapse.33.t:0 "临界点"
 TaS_GERCollapse.33.d:0 "“总统先生，国家正在遭受攻击。”\n\n在哈佛大学进行公开演讲时，贴身安保主管低声向总统耳语了这句话。从这一刻起，“总统”一词不再仅仅是一个职位头衔，更成为了一种象征，一种号召，一种自然之力，一种整个国家都必须紧紧依靠的、不可阻挡的伟力。\n\n起初，总统还没有完全理解这其中的深刻内涵，他还想像过去那样，仅仅做一些例行公事——发表几篇关于调查进展的公开讲话、向遇难者家属表示哀悼，以及诸如此类的、毫无意义的陈词滥调。但他的人民所期待的，绝不仅仅是这些。对于一个正遭受攻击的国家而言，其领导者绝不能仅仅做出这些浮于表面的姿态。当总统意识到这一点后，一切都变得无比清晰起来，简直就像上帝亲手拨开了他眼前的迷雾一般。椭圆形办公室的阴暗角落被总统心中熊熊燃烧着的正义之火彻底照亮。在这火焰的笼罩下，他拨通了国防部长和外交部长的电话，下达了一道简短的命令…"
 TaS_GERCollapse.33.a:0 "…启动第五条款！"
 TaS_GERCollapse.34.t:0 "沉默的航标"
 TaS_GERCollapse.34.d:0 "“海岸警卫队一向以其清正廉洁和恪尽职守而闻名，”斯文过去常常这样开玩笑。在为大日耳曼国的广袤海岸线兢兢业业地守卫了十年后，斯文早已习惯了在巡逻艇上过着“收受贿赂、护送走私”的日子，当然这也与那份几乎让他吃不上饭的“微薄”薪水脱不了关系。但在世界大势风起云涌的今天，已经没有人再胆敢从他的眼皮子底下通过了。\n\n然而就在这天，他正准备返航，他的同事突然发现了一缕青烟从远方海雾中冒了出来。由于糟糕的能见度，根本无法用肉眼进行任何观察，于是斯文下令调转船头，朝烟雾出现的方向开进，期望着至少能“再捞一笔外快”。可当他们的巡逻艇靠近那个庞然大物后，他那些关于金钱的美梦瞬间化为泡影。一艘带着OFN标识的巡洋舰划破了迷雾，出现在了他的眼前。斯文顿时如堕冰窟，下令升起白旗，准备投降。"
 TaS_GERCollapse.34.a:0 "对他们来说，这场战争已经结束了。"
 TaS_GERCollapse_news.1.t:0 "[Get_newspaper_header]人民大厅危机"
 TaS_GERCollapse_news.1.d:0 "来自人民大厅的最新消息可谓是意料之中。在一次关于近期战败问题的紧急会议上，大日耳曼国提出了战后紧急重建方案。在会议中，很大一部分内容都涉及到对战争失败负有直接责任的卖国贼展开全面追责。针对这些叛国者的调查已经锁定了诸多嫌疑人，而[GER.GetLeader]也在发言中提到了这些叛国者的名字。\n\n尽管贵为元首，但在最近的一连串的灾难后，这位德意志领导人的政治影响力已然是江河日下，这也使得国会中的许多派系对他的提议表达了强烈的不满。对这些叛国者进行逮捕的动议也未能获得通过。在场的安保人员也只能勉强控制住那些怒火中烧、几欲大打出手的议员们。最终，人民大厅的意见仍然没有达成一致，会议也被迫提前结束。"
 TaS_GERCollapse_news.1.a:0 "折翼的帝国之鹰步履蹒跚。"
 TaS_GERCollapse_news.2.t:0 "[Get_newspaper_header]马丁·鲍曼去世"
 TaS_GERCollapse_news.2.d:0 "从大日耳曼国方面传来了一则紧急消息。昨日清晨，德意志民族的元首马丁·鲍曼被发现于自己办公室内的早餐桌上去世，当时他甚至还没来得及享用完自己的早餐。德意志广播电台宣布，元首的死是由于在最近的战败中承受了巨大的压力而导致心脏骤停，且抢救无效而死，但这一说法并未得到所有人的信服。国际医学委员会只能依靠所公布出来的视频和照片资料进行“远程会诊”，并提出了以下假设：鉴于他长期患有某种进行性疾病，但仅从视频和照片中，我们无法推断出准确的病症。\n\n德国政府宣布，即日起德意志将进入全国哀悼日，举国上下沉痛悼念这位为德意志献出毕生心血的元首。为选出新的雅利安民族领袖，第二次紧急会议将会很快召开。很多民众都满怀希望，寄期待于这位继任者能够带领德国走出每况愈下的泥潭，但这一切还都是未知数。"
 TaS_GERCollapse_news.2.a:0 "船长与他的船一同沉没。"
 TaS_GERCollapse_news.3.t:0 "[Get_newspaper_header]格哈德·克洛普弗被任命为新任元首"
 TaS_GERCollapse_news.3.d:0 "人民大厅上传来阵阵雷鸣般的掌声：新任元首的人选已然出炉——克洛普弗，这位已故元首的副手以及党卫队全国领袖被选为了新的元首。他从前任元首的手中接过了这艘千疮百孔的破船。而等待着他的将是这些触目惊心的烂摊子：丧失殆尽的殖民地、一败涂地的军队、崩溃边缘的工业以及彻底丧失殆尽的国际影响力。德国的经济完全建立在对殖民地的敲骨吸髓之上，没人知道该如何在如此之短的时间内令其改头换面。但在他的就职演说中，克洛普弗信誓旦旦地说，他将带领德意志走出泥潭。\n\n尽管如此，许多国外经济学家和政治学家仍然对德意志民族能否力挽狂澜持悲观态度，在他们看来，德国需要数年之久来恢复其往日的荣光。现在他们只能众口一词地说：旧秩序的时代已然一去不返，而俄罗斯将登上那空置已久的欧洲霸主之位。而这究竟会为各国带来怎样的命运呢？我们仍未可知。"
 TaS_GERCollapse_news.3.a:0 "对一些人而言，这是末日，而对另一些人而言，这是天赐良机。"
 TaS_GERCollapse_news.4.t:0 "[Get_newspaper_header]党卫军全国领袖，莱因哈德·海德里希遇刺身亡"
 TaS_GERCollapse_news.4.d:0 "德国的不稳定状态仍在加剧：由于近期的战败，德意志那建立在“吸血”之上的经济失去了源源不断的劳动力和滚滚涌入的各类资源，商店里货架空空如也，物资极度短缺，随着最后一批来自俄罗斯的奴隶被解放，德意志的基础设施已然后继无人，岌岌可危，这也导致了各地抗议和暴乱活动的频次激增。而德意志的强力机关仍然在勉力维持着国家的秩序。\n\n但就在昨日，党卫队全国领袖莱因哈德·海德里希在外出视察时，被一名混在人群中的平民用一把9mm口径的手枪刺杀。他的安保人员未能当场抓获枪手，后者在枪击事件发生后立刻逃离现场，不知所踪，但现在已经有消息人士推测这名枪手早已泅渡施普雷河逃之夭夭。目前已经有各种阴谋论浮出水面，包括这可能是新任元首克洛普弗铲除异己的手段，也有人认为这很可能是“红军旅”为了削弱德国暴力机关而实施的有组织行动。但德意志官方对此事的说法只有一句：这是一次单纯的恐怖袭击，而他们正在全力搜捕凶手。"
 TaS_GERCollapse_news.4.a:0 "回声的音量越来越大。"
 TaS_GERCollapse_news.5.t:0 "[Get_newspaper_header]全国范围内的恐怖袭击"
 TaS_GERCollapse_news.5.d:0 "德国的危机还在不断加剧。随着被誉为“欧洲粮仓”的乌克兰沦陷于俄罗斯之手，德国政府再也无法像过去那样在一朝一夕之间扑灭此起彼伏的饥荒，而这也导致全国各地爆发了一波又一波的暴动。而曾经一度销声匿迹的“红军旅”也如鬼魅般再度浮出水面，他们趁机把手伸向那些饱受压迫的民众，控制舆论，并在暗中招兵买马，将那些自发的暴动逐渐转变为一场有组织有预谋的大规模恐怖袭击行动。\n\n克洛普弗宣布所有主要城市都进入紧急状态，党卫队和秘密警察也全力出动，与“红军旅”展开你死我活的斗争，尽管“盖世太保”还未来得及从自己的首脑遇刺的打击中恢复过来。然而，“红军旅”在那之后依然发动了一系列针对政府和警察机构的恐怖袭击。显然，想要在朝夕之间将这一系列暴恐活动彻底平息是不现实的。"
 TaS_GERCollapse_news.5.a:0 "死亡螺旋的步伐根本停不下来。"
 TaS_GERCollapse_news.6.t:0 "[Get_newspaper_header]阿尔伯特·施佩尔遇刺"
 TaS_GERCollapse_news.6.d:0 "有消息称，阿尔伯特·施佩尔遭到了一次精心策划的刺杀。当时他正在前往参加关于讨论紧急战后恢复措施的人民大会特别会议，其所在的车队在行进过程中被一枚预先埋设在路边的炸弹所袭击，领头的车辆被彻底炸毁。紧接着，一位名叫埃瓦尔德·勃兰特的国防军老兵高喊着“为那些被叛徒出卖的雅利安人复仇”的口号，用一支NF-LAG步枪朝着元首的座车疯狂扫射。尽管司机的反应不可谓不快，载着元首的座驾很快便驶离了事发地，但该名枪手仍然成功击伤了元首本人，并于事后被迅速击毙。根据现场传回的消息，由于枪手使用的是一种禁用的大口径武器，因此伤势较为严重，为了安全起见，施佩尔也被迅速送往医院接受进一步治疗。目前，没有任何组织或个人宣称对此次事件负责，我们也不清楚这名枪手是如何得到这些武器弹药的。\n\n鉴于上述事件，国会会议将被迫延期举行。许多政治分析家都预测，未来可能会发生更多针对改革派的恐怖袭击。"
 TaS_GERCollapse_news.6.a:0 "如同失血过多的帝国一般奄奄一息…"
 TaS_GERCollapse_news.7.t:0 "[Get_newspaper_header]德意志改革派们大势已去"
 TaS_GERCollapse_news.7.d:0 "德国内部的改革派力量正在土崩瓦解。在最近一次国会会议上，保守派的代表奥伯兰德对施佩尔的所谓“政绩”大肆批判，直言其“背叛了希特勒留给德意志的宝贵遗产”。同时他还提出了一项议案：鉴于施佩尔的健康状况和职业能力，他已经不再适合继续担任元首一职。因此，应当立即解除他的职务，同时实施由保守派制定的战后紧急恢复方案。\n\n在投票表决中，保守派的提案获得了绝大多数议员的支持，这也标志着奥伯兰德开始掌握国家最高权力，同时这也为新元首的最终继任扫清了障碍。许多政治人士已经对所谓的“改革”彻底失望，并逐渐向保守派靠拢。德国经济已经失去了来自东方的源源不断的资源和劳动力，这只脱缰的野马是否还能被重新套上笼头，只有时间才能给出答案。"
 TaS_GERCollapse_news.7.a:0 "仅仅用了一次简单的投票，十年的变革顷刻间化为泡影。"
 TaS_GERCollapse_news.8.t:0 "[Get_newspaper_header]德意志发生大规模示威游行"
 TaS_GERCollapse_news.8.d:0 "今天在大日耳曼国的首都，大日耳曼尼亚广场的希特勒纪念碑附近，爆发了一场惨绝人寰的悲剧：第十党卫军“阿尔伯特·施佩尔”装甲师以及其他一些国防军部队，对手无寸铁的和平示威人群开火。\n\n游行示威的主力队伍在勃兰登堡门附近被击溃后，示威者们开始四散奔逃，为了进一步镇压暴乱，国家人民军的部队也随即开进了城区。\n\n大日耳曼国官方拒绝就此次暴力镇压事件发表任何评论，但许多国家已将此次事件定性为野蛮的大屠杀。"
 TaS_GERCollapse_news.8.a:0 "德国正在大踏步地坠入无尽深渊。"
 TaS_GERCollapse_news.9.t:0 "[Get_newspaper_header]“四人帮”接受审判"
 TaS_GERCollapse_news.9.d:0 "大日耳曼国的倒退仍未结束。在失去了施佩尔的庇护后，那些德国的改革家们，即所谓的“四人帮”，已经被秘密警察悉数逮捕。针对他们的审判通过国家电视台向全国播出，整个审判过程可谓是争分夺秒。“四人帮”被控犯有以下罪行：背叛雅利安民族，致使帝国日益衰落，在第二次西俄战争中彻底失败，以及参与自由派的示威游行活动并试图推翻纳粹党。最终的判决结果是：绞刑。判决于第二天上午立即执行。\n\n在德意志国内，人们对此的反应褒贬不一，但在国际社会上，人们普遍对该事件持强烈的负面态度。OFN和俄罗斯都谴责该事件是一场有预谋的政治政变，而所谓的新保守派政府则是窃取了“四人帮”改革成果的小偷，并扬言将会对德意志施加进一步的制裁措施。"
 TaS_GERCollapse_news.9.a:0 "又一轮血腥的轮回"
 TaS_GERCollapse_news.10.t:0 "[Get_newspaper_header] 财团治下的德意志"
 TaS_GERCollapse_news.10.d:0 "根据人民大厅的投票结果，银行家、法本公司负责人赫尔曼·约瑟夫·阿布斯当选为德意志民族的新元首。\n\n尽管他的公司早已被关闭，但阿布斯仍然对德国的政治和经济保持着一定的影响力，这也使得他得以顺利登上权力的宝座。\n\n据大日耳曼国的经济专家称，在施佩尔遭遇军事失败后，几乎所有的企业巨头都团结在了赫尔曼·阿布斯周围，他们试图通过直接控制权力机关来挽回自身蒙受的巨额损失。\n\n同时，一些匿名的纳粹党成员声称，在最近的选举中存在着严重的“贿选行为”。不过，这一说法目前还没有得到证实。"
 TaS_GERCollapse_news.10.a:0 "元首还是银行家？"
 TaS_GERCollapse_news.11.t:0 "[Get_newspaper_header] “休克疗法”的开始"
 TaS_GERCollapse_news.11.d:0 "德国新元首赫尔曼·阿布斯在对国民的讲话中宣布，为“克服因俄罗斯人的罪行而导致德意志民族陷入的深重苦难”，将正式启动名为“休克疗法”的经济复苏计划。该计划除了其他内容之外，最核心的一条是将对德国的一系列关键企业进行私有化改革，以拍卖和招标的形式将其出售。同时，由于商品短缺日益严重，将会对部分产品实行配给制。\n\n尽管如此，经济专家们却对该计划的有效性持强烈怀疑态度。他们认为，这项计划不仅不会缓解当前的经济危机，反而将会导致德国经济的彻底崩溃。毕竟，失去了各个专员辖区源源不断的资源供给，德国经济早已是无根之木，无源之水。而实行配给制更是被斥责为“马后炮”。"
 TaS_GERCollapse_news.11.a:0 "这真的行得通吗？"
 TaS_GERCollapse_news.12.t:0 "[Get_newspaper_header] 莱茵河畔起义"
 TaS_GERCollapse_news.12.d:0 "根据各地基层党组织传来的只言片语可以推断出，一群德意志工人联合东欧劳工发动了叛乱，并一举夺取了莱茵河沿岸的多座城市。尽管德国政府一直对此保持沉默，三缄其口，但据观察，大量的国防军和警察部队正向着叛乱地区的周边地带集结。\n\n据军事专家和前警务人员称，这种行动与其说是镇压，不如说更像是在仓促地构筑“防线”，以防事态进一步恶化。而这也间接反映出，要么是德国政府已经无力镇压这场叛乱，要么就是他们根本就不想将其彻底扑灭。"
 TaS_GERCollapse_news.12.a:0 "一步错，步步错"
 TaS_GERCollapse_news.13.t:0 "[Get_newspaper_header] 威利·勃兰特遇刺身亡"
 TaS_GERCollapse_news.13.d:0 "今天早些时候，前黑红金国旗团领袖，“自由欧罗巴军团”头目威利·勃兰特被发现死于自己家中。此前他曾与赫尔穆特·施密特达成协议，承诺放弃武装抵抗，因此一直秘密居住在这所公寓中，不曾外出。\n\n这样一位极具影响力的人物的死迅速传遍了大街小巷，而且人们很快就将矛头指向了纳粹党内的保守派。但截至目前，这一说法的真实性仍有待商榷。"
 TaS_GERCollapse_news.13.a:0 "勿忘你终有一死"
 TaS_GERCollapse_news.14.t:0 "[Get_newspaper_header] 大日耳曼国爆发“人民革命”"
 TaS_GERCollapse_news.14.d:0 "最新消息显示，大日耳曼国爆发了所谓的“人民革命”。\n\n阿尔伯特·施佩尔的统治宣告终结。而他的副手，同时也是施佩尔执政早期改革计划的制定者之一——库尔特·格奥尔格·基辛格则接替他成为了德国新的领袖。\n\n基辛格向德国人民发布公告，宣布推翻纳粹统治，并承诺将在不久的将来举行第一次民主选举。\n\n要知道，德国上一次举行选举还是在1933年，那一年，阿道夫·希特勒当选为国家总理。"
 TaS_GERCollapse_news.14.a:0 "崭新的民主"
 TaS_GERCollapse_news.15.t:0 "[Get_newspaper_header] 德意志国大选落幕"
 TaS_GERCollapse_news.15.d:0 "德意志国总理选举刚刚落下帷幕。\n\n来自基民盟的候选人阿尔弗雷德·德雷格以及来自社民党的候选人汉斯·福格尔展开了激烈的角逐。很快，获胜者的名字就将公之于众。\n\n尽管这场选举声势浩大，但仍有不少人对没有其他政党候选人参与竞选感到一丝不安，比如纳粹党。同时，选举的投票率低得可怜，据观察员估计，投票率仅有30%。面对质疑，临时政府称这些说法都是“民主的敌人的恶意中伤”，并再次强调了本次选举的透明度和公正性。"
 TaS_GERCollapse_news.15.a:0 "德国人似乎永远都无法适应民主。"
 TaS_GERCollapse_news.16.t:0 "[Get_newspaper_header] 愤怒老兵的进军"
 TaS_GERCollapse_news.16.d:0 "根据最新消息，德国发生了一场军事政变。\n\n其组织者正是第一次西俄战争的老兵，帝国领袖——阿道夫·冯·塔登。\n\n在他对全国发表的讲话中，他宣称自己正在将德国从“犹太资本主义的走狗们”手中拯救出来。鉴于此，德国的“人民革命”政府宣布自行解散。\n\n目前我们还不得而知这位新统治者的具体政治倾向，但有一点毋庸置疑：德国的民主时代结束了。"
 TaS_GERCollapse_news.16.a:0 "德国的民主，其生也短，其死也忽。"
 TaS_GERCollapse_news.20.t:0 "[Get_newspaper_header] 国防军发生大规模哗变"
 TaS_GERCollapse_news.20.d:0 "第二次西俄罗斯战争所带来的严重后果正在逐渐显现。根据最近关于国防军部队擅自行动的报告来看，“欧洲第一强军”的神话恐怕已是明日黄花。\n\n这支曾在四十年间两度征服中东欧大部分地区的军事力量，如今却落得个分崩离析的下场。尽管发生了如此大规模的哗变，仍有为数不少的国防军部队坚守着自己的阵地，尽管各级指挥官都报告说，他们的士兵的士气已“跌至谷底”。"
 TaS_GERCollapse_news.20.a:0 "折断利爪的帝国之鹰。"
 TaS_GERCollapse_news.21.t:0 "[Get_newspaper_header] 慕尼黑之战"
 TaS_GERCollapse_news.21.d:0 "来自昔日“欧洲霸主”的消息仍在不断传出。根据意大利新闻社的最新报道，慕尼黑及周边地区已经宣布脱离德国中央政府的控制。\n\n“慕尼黑苏维埃共和国”的成立进一步加剧了大日耳曼国的四分五裂。至于这个年轻的政治实体本身，许多专家都认为它的诞生标志着“新的后德意志时代国家雏形”的出现，而也有人将其视作“巴伐利亚苏维埃共和国这一历史悲剧的重演”。"
 TaS_GERCollapse_news.21.a:0 "历史总是在不断重演。"
 TaS_GERCollapse_news.22.t:0 "[Get_newspaper_header] 人民大厅爆炸事件"
 TaS_GERCollapse_news.22.d:0 "德意志时间12时整，人民大厅发生了一起爆炸事故。根据政府调查委员会的官方声明，此次“意外”是由一台出现故障的空调而导致的。\n\n相关部门还指出，“事故造成数人伤势严重，但情况稳定”。\n\n但与官方口径相悖的是，来自德国的一些非官方渠道以及一些外国媒体都将其定性为一场有预谋的恐怖袭击。至于伤亡人数，这些非官方信源称：“数十人当场死亡，数百人伤重不治”。目前我们还无法判断孰真孰假，但有一件事可以肯定——人民大厅早已不复往日那般固若金汤。"
 TaS_GERCollapse_news.22.a:0 "空调？你当我们傻子吗？！"
 TaS_GERCollapse_news.23.t:0 "[Get_newspaper_header] 冰岛导弹危机"
 TaS_GERCollapse_news.23.d:0 "当全世界都在为德国在第二次西俄罗斯战争中惨败而暂时松了一口气时，一则令人不安的消息从冰天雪地的冰岛传来。一枚来历不明的弹道导弹在霍芬镇上空被防空系统击落。根据现有信息，尽管这枚导弹被迅速拦截，但其碎片仍对该镇的市政厅造成了一定的损毁，并引发了火灾。截至目前，已有一人遇难，数人受伤。现场的救援工作仍在紧张进行中。\n\n对导弹残骸的初步分析表明，它们很可能是V型导弹的残骸。冰岛政府要求德国当局对此作出解释，但截至目前，德国大使馆以及相关部门仍对此事三缄其口，没有任何表态。看来，即使在第二次西俄战争早已尘埃落定后，笼罩在世界头顶的那片阴云仍然挥之不去。"
 TaS_GERCollapse_news.23.a:0 "德意志的余烬"
 TaS_GERCollapse_news.24.t:0 "[Get_newspaper_header] 自由国家组织第29号决议"
 TaS_GERCollapse_news.24.d:0 "鉴于大日耳曼国对冰岛悍然发动的侵略行径，自由国家组织安理会召开紧急会议，并通过了第29号决议。\n\n根据该决议，为“防止德国未来再次发动类似的侵略行为”，OFN在冰岛以及北大西洋的军事存在将得到进一步加强。\n\n截至目前，德国外交部还未就此事发表任何评论。与此同时，包括导弹巡洋舰和航空母舰在内的美国和澳大利亚海军舰艇已受命开赴北大西洋进行部署。"
 TaS_GERCollapse_news.24.a:0 "将“自由世界的武库”部署在德国人的眼皮子底下"
 TaS_GERCollapse_news.25.t:0 "[Get_newspaper_header] 维也纳公社的诞生"
 TaS_GERCollapse_news.25.d:0 "在饱经战火蹂躏的大日耳曼国，各种光怪陆离的消息仍旧层出不穷。\n\n根据来自维也纳的最新消息，当地所有的德意志政权机构都已被彻底肃清，维也纳的居民以及附近的民众宣布成立维也纳公社。\n\n尽管维也纳公社尚未获得国际社会广泛的合法性承认，但人们却发现，“人民民兵”中的一些成员手中出现了意大利、俄罗斯、甚至日本生产的武器和军需品。"
 TaS_GERCollapse_news.25.a:0 "好啊，看来这德意志是要彻底四分五裂了"
 TaS_GERCollapse_news.26.t:0 "[Get_newspaper_header] 波兰的怒火"
 TaS_GERCollapse_news.26.d:0 "尽管纳粹分子们使出了浑身解数，试图将波兰从历史中彻底抹去，但他们的图谋失败了。就在此时此刻，在前波兰共和国的每一寸土地上，波兰人民都与德国占领军展开了殊死搏斗，他们中有正规军、党卫军，也有保安团。各支抵抗力量都打着象征着波兰的红白双色旗和曾经的波兰共和国国徽上的白鹰标志。\n\n尽管德国方面宣称这只是“一场很快就会被平息的、自发的恐怖主义叛乱”，但一些独立专家认为，这标志着在大日耳曼国摇摇欲坠之际，波兰民族的复国运动已然拉开了序幕。"
 TaS_GERCollapse_news.26.a:0 "多米诺骨牌已然开始倒塌。"
 TaS_GERCollapse_news.27.t:0 "[Get_newspaper_header] 挪威脱离团结协定"
 TaS_GERCollapse_news.27.d:0 "纳粹德国看起来已经彻底穷途末路，就连它曾经在北方的堡垒也已调转炮口，对准了它曾经的主子。今天，挪威再次宣布脱离德国独立，并退出了团结协定。\n\n与此同时，包括美国、日本和俄罗斯在内的国家也纷纷宣布，承认挪威新政府的合法地位，并着手与其建立“稳固且平等的合作伙伴关系”。\n\n这一切只能说明，大日耳曼国的彻底崩溃已经进入倒计时。"
 TaS_GERCollapse_news.27.a:0 "德意志的“掌上明珠”再次迷失。"
 TaS_GERCollapse_news.28.t:0 "[Get_newspaper_header] 俄罗斯越过德意志边境"
 TaS_GERCollapse_news.28.d:0 "最新消息显示，俄罗斯已经沿着大日耳曼国的边境全线发动了大规模进攻。\n\n尽管目前尚不清楚俄罗斯的真正目标是什么，但许多专家认为其主要目的是占领帝国的首都——柏林。\n\n大日耳曼国的外交部将俄罗斯的这一行动斥责为“自杀式袭击”，而美国方面则拒绝就此军事行动发表任何评论。"
 TaS_GERCollapse_news.28.a:0 "给德意志的棺材钉上最后一颗钉子。"
 TaS_GERCollapse_news.29.t:0 "[Get_newspaper_header] 美国大使馆人质危机"
 TaS_GERCollapse_news.29.d:0 "刚刚有消息传出，美国驻大日耳曼国大使馆遭一伙不明身份的武装人员袭击并占领。此外，使馆内的所有工作人员都被扣为人质。\n\n不明身份的恐怖分子宣称，他们此举是为了将国家从“盘踞在德国的犹太-美利坚中情局走狗”的手中拯救出来……除此以外，他们要求德意志政府交出所有目前在其境内活动的中情局特工，否则将杀害人质。\n\n美国政府将这一事件斥为“针对自由世界的野蛮暴行”，而德国新政府则拒绝对此事发表评论。"
 TaS_GERCollapse_news.29.a:0 "这可真是让本已糟糕透顶的局势雪上加霜啊。"
 TaS_GERCollapse_news.30.t:0 "[Get_newspaper_header] 汉堡绞肉机"
 TaS_GERCollapse_news.30.d:0 "今天，从汉堡传来了一则令人毛骨悚然的消息。据目击者称，中午12时左右，当地港口发生了一起骇人听闻的袭击事件。袭击者身着党卫军制服或便装，对视野中的每一个人都展开了无差别的屠杀。尽管一些人最终侥幸逃脱或者幸存下来，但至少有40余人在这次袭击中不幸丧生。\n\n美国国务院已将“汉堡绞肉机”事件定性为针对美国公民的恐怖袭击，并敦促大日耳曼国政府提供有关调查进展的信息。而德国外交部对此则继续保持沉默。"
 TaS_GERCollapse_news.30.a:0 "战争的导火索已被点燃。"
 TaS_GERCollapse_news.31.t:0 "[Get_newspaper_header] 自由国家组织紧急会议"
 TaS_GERCollapse_news.31.d:0 "随着德意志时局的日渐恶化，“在第二次西俄战争中遭受了耻辱性的失败后，德国仍然在不断挑衅自由国家组织，试图让后者作出回应，这些回应在最近的会议上已经初步形成，”美国总统在开幕致辞中说道。\n\n根据所签署的决议，部分来自OFN国家的师级作战单位将被重新部署到冰岛和法罗群岛，以加强“在OFN中与德占区接壤”的这些地区的防御能力。与此同时，之前就已经被部署到北大西洋的舰队与“OFN联合舰队”已合并，这支联合舰队将由新组建的“OFN海军参谋部”统一指挥。"
 TaS_GERCollapse_news.31.a:0 "不久之后，两只雄鹰就将互相撕咬，不死不休。"
 TaS_GERCollapse_news.32.t:0 "[Get_newspaper_header] 纽约恐怖袭击事件"
 TaS_GERCollapse_news.32.d:0 "今天，整个美国都笼罩在恐慌和悲痛之中。纽约时间12:17，在世贸中心，即人们俗称的“双子塔”其中的一栋建筑的地下停车场发生了一起剧烈的爆炸事故。\n\n爆炸导致该塔楼彻底坍塌。尽管目前清理工作仍在进行中，但据初步统计，至少有2000人遇难，5000人受伤。\n\n此外，在爆炸中心附近还发现了一本属于大日耳曼国公民的护照，此人名为“尤尔根·莱泽尔”。截至目前，德国和美国的外交部门都对此保持沉默。与此同时，驻华盛顿的各国大使馆，包括俄罗斯、日本以及一些前团结协定的成员国的大使馆都以下半旗的方式对在本次灾难中遇难的人们表示哀悼，并向白宫发去了官方的“唁电”。"
 TaS_GERCollapse_news.32.a:0 "今天，整个世界都与他们一同陷入悲痛之中。"
 TaS_GERCollapse_news.33.t:0 "[Get_newspaper_header] 自由国家组织启动第五条款"
 TaS_GERCollapse_news.33.d:0 "根据自由国家组织安全理事会的官方声明，由于“大日耳曼国对美国及其公民所发动的侵略行径”，安理会决定“部分”启动自由国家组织宪章中的第五条款。\n\n自由国家组织宪章第五条款规定：“如果一个自由国家组织成员国成为武装袭击的受害者，所有其他成员国应将此种暴力行为视为对所有OFN国家的武装袭击，并应采取其认为必要的行动来阻止侵略国”。\n\n针对这一声明，德国外交部声称这是“试图将个别激进份子的行为强加于整个德国，并以此为借口发动战争”。"
 TaS_GERCollapse_news.33.a:0 "暴雨已至，雷暴还会远吗？"
 TaS_GERCollapse_news.34.t:0 "[Get_newspaper_header] “仁慈天使”行动"
 TaS_GERCollapse_news.34.d:0 "从第二次西俄罗斯战争开始，大日耳曼国便一步步走向了最终的毁灭。如今，它的丧钟已然敲响。\n\n凌晨1:23，在美国以及OFN的支援下，对德国内海展开了两栖登陆，随后，他们又对德国北部地区展开了空降作战。根据美国总统的声明，这场战争是“基于自由国家组织宪章第五条而发动的。这次军事行动的目标是推翻纳粹政权，并在前第三帝国的领土上建立起一个民主政体”。\n\n尽管元首仍在负隅顽抗，声称“将会战斗到最后一个美国佬被赶回冰岛”，但无论是在国防军内部，还是在德国社会上，“极度悲观”的情绪早已蔓延开来。"
 TaS_GERCollapse_news.34.a:0 "“千年帝国”那不光彩的落幕。"
 TaS_GERCollapse_news.35.t:0 "[Get_newspaper_header] OFN德国占领军"
 TaS_GERCollapse_news.35.d:0 "在美国军队攻占了德国首都柏林，其余的德军也已签署了无条件投降书。有鉴于此，自由国家组织安全理事会宣布“在前大日耳曼国的领土上建立军民联合管理委员会”。\n\n这个新成立的管理委员会的宗旨是：“彻底地去纳粹化，重建社会秩序，恢复德国人民的正常生活，实现社会的民主化，并在一定程度上去军事化，最终彻底解除德意志管理委员会武装部队的所有核武器”。\n\n同时，俄罗斯和日本都表示，愿意“协助美国在德国沦陷后建立新的世界秩序，这个新秩序将以安全、国际保障以及尊重彼此利益为基础”。"
 TaS_GERCollapse_news.35.a:0 "新的秩序啊。但愿它能比之前的更好。"
 TaS_GERCollapse_news.36.t:0 "[Get_newspaper_header] 挪威政变"
 TaS_GERCollapse_news.36.d:0 "在世界舞台上，挪威发生的政变令许多国家大为震惊。以迅雷不及掩耳之势蔓延全国的这场政变推翻了那个摇摇欲坠的政府，取而代之的则是一个决心捍卫其国家利益的新政权。\n\n政变领导人宣布与大日耳曼国断绝一切外交关系，并着手与俄罗斯帝国建立紧密的联系。德国在挪威的势力被彻底肃清，而且德国在当地的资产也已被尽数收归国有。奥斯陆当局正在紧锣密鼓地制定一系列改革措施，旨在于在新的国策指引下，彻底改变挪威社会的方方面面。\n\n大日耳曼国立即作出反应：德国宣布挪威的新政府为非法政府，并威胁称，如果他们不改弦更张，回归之前的政治体制，德国将对挪威采取断然的军事行动。尽管如此，大多数分析人士都一致认为，元气大伤的德国已经彻底失去了对斯堪的纳维亚的影响力。"
 TaS_GERCollapse_news.36.a:0 "北方已然转向。"
 TaS_GERCollapse_news.37.t:0 "[Get_newspaper_header]法德战争"
 TaS_GERCollapse_news.37.d:0 "法德边境传来了一些令人震惊的消息。得到了炮兵和空军支援的法国军队向着德国本土发动了全面进攻。根据现有消息，从大西洋沿岸到瑞士边境，法德两国军队在边境地区发生了不同规模的交火。\n\n在对国民发表的讲话中，法国领导人[FRA.GetLeader]宣称“是时候纠正1940年贡比涅停战协定所造成的可耻的历史错误了”。显然，法国的目标是收复二战中失去的所有领土。由于德国国防军内部出现了大规模的逃兵，以及德意志政权的日渐瓦解，这项任务似乎并非天方夜谭。截至目前，德国官方除了谴责“发生在西部边境的侵略行径”以及呼吁“停止流血冲突”外，还没有采取任何实质性的行动。"
 TaS_GERCollapse_news.37.a:0 "我们拭目以待"
 TaS_GERCollapse_news.38.t:0 "[Get_newspaper_header]不列颠崩溃"
 TaS_GERCollapse_news.38.d:0 "团结协定，或者说这个苟延残喘的组织，一天比一天混乱。在国防军和党卫军部队从不列颠群岛撤回欧洲大陆后，威廉·乔伊斯的中央政府在过去几天里已经彻底失去了对不列颠各郡的控制，而现在，这腐朽的政权终于寿终正寝了。\n\n据各方消息，苏格兰和威尔士的权力落入了由自由不列颠残余势力和当地分离主义组织所组成的联盟手中。目前“哈哈勋爵”的命运仍然无人知晓，而不列颠的新政府并未就此发表任何官方声明。根据军事和政治专家的说法，不列颠目前的局势“过于复杂，以至于我们还无法断言，那里是否已经形成了任何真正意义上新的国家或者准国家组织”。"
 TaS_GERCollapse_news.38.a:0 "天佑不列颠尼亚。"
