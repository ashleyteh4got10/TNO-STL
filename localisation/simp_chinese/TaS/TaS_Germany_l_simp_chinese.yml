 TaS_Post2WRW_GBV_ingerman_segregation:0 "德国内部的种族隔离"
 TaS_Post2WRW_GBV_ingerman_segregation_desc:0 "德意志？不过是普鲁士人用来粉饰他们野蛮征服的遮羞布罢了，从巴伐利亚、巴登到西里西亚，再到波西米亚、波罗的海、乌克兰，乃至俄罗斯。这些贪婪的侵略者的胃口永无止境，我们绝不能允许他们与真正的巴伐利亚人共存于世。我们将让世人知晓巴伐利亚与其他“德意志人”之间在种族、语言、文化以及宗教信仰上的巨大差异，从今往后，那些普鲁士人，就该老老实实地称自己为日耳曼人。大日耳曼国的亡魂已经消散，取而代之的将是彻底的种族隔离——这是净化我们民族的唯一途径。"
 TaS_Post2WRW_GBV_bavarian_identity:0 "巴伐利亚身份"
 TaS_Post2WRW_GBV_bavarian_identity_desc:0 "一个世纪，能对一个民族造成多大的改变？答案是，足以将它从地图上彻底抹去。不幸的是，这正是发生在巴伐利亚文化身上的悲剧。这个孤立而美丽的民族，其独特的文化惨遭普鲁士侵略者的野蛮摧残，几乎毁于一旦。幸运的是，如今的我们有机会，也有决心让它从灰烬中涅槃重生，向世界展现其独一无二的魅力。"
 POSTWRW2_Franz_Bonaventura_Adalbert_Maria_Herzog_von_Bayern_DESC:0 "弗朗茨的一生充满了苦难与屈辱。他出生仅仅六年后，父母就带着他逃离德国，前往匈牙利寻求庇护，但这并没能让他们一家逃脱厄运的魔爪。1944年，年幼的弗朗茨跟随家人一起被关进了集中营。那个人间炼狱的景象，深深地烙印在他的脑海中，挥之不去——瘦骨嶙峋的饥民、恶劣的生活条件、无处不在的死亡…即便身处地狱般的生活，人似乎也能逐渐麻木。但萨克森豪森集中营的恐怖记忆，将永远伴随着弗朗茨，至死方休。\n\n二战结束后，弗朗茨的父亲阿尔贝希特在“世界之都”日耳曼尼亚的建设工地上不幸遇难。而他的儿子，这个出身名门望族的年轻人，则沦为奴隶，被迫在巴伐利亚的一家工厂里卖命。\n\n但正义或许会迟到，却永远不会缺席。当帝国政权摇摇欲坠之时，弗朗茨率先发动起义，成功解放了巴伐利亚的大部分地区。毫无疑问，他是俄罗斯政府的最佳人选。如今，他羽翼丰满，大权在握，复仇的怒火熊熊燃烧。\n\n现在，是时候让普鲁士人为他们的所作所为付出代价了。"
 POSTWRW2_Egon_Krenz_DESC:0 "埃贡·克伦茨的故事独树一帜，他出身简朴，身处全球红旗倒下的世界，却矢志不渝地坚守着马克思、恩格斯和列宁的社会主义理想直至终了。起初，他的生活平凡而简单，然而，身为学子的他，却逐渐听闻了左派激进组织的传闻。这些声音引领他走进了一个充满革命理想的圈子，他在那里接受了全新的信念。\n\n在多年的社会主义地下斗争中，克伦茨亲身经历了无数风雨。从自发组织行动、罢工到镇压事件，他一一见证，甚至亲身参与。然而，随着时间的推移，革命的火种似乎并未如预期般点燃。德国的左派激进组织陷入了内斗，他们试图通过日益激进的行动来争夺话语权，却逐渐失去了民心。在这个混乱的时刻，克伦茨却如旁观者清，他开始深刻反思自己的信仰和道路。\n\n埃贡·克伦茨提出了一个大胆的理论：要在德国建立社会主义，必须融合市场元素和资本主义的精髓。这一观点在革命者中引起了轩然大波，却意外地赢得了普通民众的共鸣。随着支持者的不断增多，这场运动逐渐形成了有组织的力量。他们坚守激进主义的立场，但坚决摒弃恐怖主义手段。克伦茨领导下的组织遍布全国，他们秘密筹备武器，静待革命时机的到来。\n\n德国战败后，巴伐利亚地区陷入了一片废墟。克伦茨敏锐地抓住了这个机会，他在掌握权力后迅速展开行动，致力于建设一个融合了资本主义和社会主义优点的“社会主义巴伐利亚”。他以铁腕手段统治着这片土地，新巴伐利亚共和国的命运掌握在他一人手中。\n\n然而，在漫漫长夜中，埃贡·克伦茨偶尔会回想起那些为革命献身的英勇烈士。他们的牺牲不应白白浪费……"
