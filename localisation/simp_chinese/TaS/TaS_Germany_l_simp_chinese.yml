 TaS_Post2WRW_GPL_ludowa_kraiowa_army:0 "两支军队"
 TaS_Post2WRW_GPL_ludowa_kraiowa_army_desc:0 "人民军…家乡军…谁能分辨出来呢?看来，所谓的流亡政府与实际控制波兰的亲俄政府之间的冲突，也体现在波兰共和国的武装力量上。"
 TaS_Post2WRW_GPL_government_of_confidence:0 "国家团结政府"
 TaS_Post2WRW_GPL_government_of_confidence_desc:0 "今天看来，波兰民族剩下的一切都团结在现政府周围。至少它能让波兰维持下去。"
 TaS_Post2WRW_GPL_german_problem:0 "德国问题"
 TaS_Post2WRW_GPL_german_problem_desc:0 "德国的殖民统治影响了波兰的大部分地区。今天，在我们国家的德国人的数量以百万计，我们有很多工作要做，才能使国家的民族构成有序。"
 POSTWRW2_JAN_LIPSKY_DESC:0 "波兰将永存。这是扬·约瑟夫贯穿20世纪的理念。当德国人占领他的家园时，他没有放弃，他的家人帮助犹太人躲避政权，他自己也是抵抗运动的一员。\n\n在他的一生中，他是无数游击队组织的一员，包括“家乡军”，但随着每一次新的失败，他不得不转向新的抵抗组织。然而，刽子手无法带走他的灵魂。\n\n俄国军队一进入波兰，他就意识到是时候采取行动了。华沙再次燃起战火，德国人逃离波兰。总的来说，约瑟夫代表了人民军和家乡军利益之间的理想妥协，所以他被任命为莫斯科的波兰领导人并没有经过长时间的考虑，扬·约瑟夫欣然接受。\n\n...因为波兰仍在人间。"
 POSTWRW2_Sabbat_Kazimierz_DESC:0 "\"国家乃是自由的合理匮乏，波兰人决不会与之妥协...若是我预言列国在下个世纪将为何事，在'波兰'二字旁，我必书'反叛者'三字。\"——沙皇亚历山大二世\n\n卡齐米日·萨巴特降生于大战硝烟未起之时。他的一生，分为两个截然不同的时期：第二次世界大战前，和战后。倘若说战前他于华沙大学研习法律，在青年学子中倡导童军运动；那么战后，和平生活已成奢望。\n\n当波兰于二战战场上败退之际，卡齐米日负伤。有人决意将其送往英伦，然一纸信函传递延宕，竟幸而救其性命。即便滞留在被占领的波兰，卡齐米日与千万波兰人一样，唯盼自由解放。他投身波兰地下国家，成为波兰自由主义的杰出旗手。\n\n随着俄罗斯将波兰从枷锁中解放，无论是萨巴特个人，抑或是波兰国家，都开启了崭新的篇章——两国数百年的仇怨，化为携手共进。萨巴特开始尽己所能，为国效力，在物质与精神的废墟上，一砖一瓦的重建波兰。\n\n波兰还未如先贤们梦想般已然涅槃重生。波兰雄鹰，尚待展翅高飞！"
