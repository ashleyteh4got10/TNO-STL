 TaS_GERCollapse_news.39.t:0 "[Get_newspaper_header]伊比利亚之春"
 TaS_GERCollapse_news.39.d:0 "在德国遭遇惨败后，它的伊比利亚追随者也未能幸免于难。德国的溃败以及由此引发的大规模抗议活动所造成的社会动荡和内乱，使得一帮西班牙军官发动政变，占领了马德里，并推翻了何塞·路易斯·德·阿雷塞政府。据新成立的西班牙军政府称，前领导人及其亲信部长已被逮捕，并被关押在卡拉班切尔监狱中等待审判。\n\n西班牙政权倒台后，葡萄牙的傀儡政府也随之瓦解。但与前者不同的是，在葡萄牙掌权的并不是军政府，而是一个由共产主义者和民主力量组成的政治联盟。目前，两国的政治局势仍然极不稳定，但西方专家认为，“尽管这些上台执政的势力不能算作是真正意义上的民主力量，但无论如何，它们都比西班牙之前的亲纳粹独裁政府以及葡萄牙的傀儡政府要强得多”。"
 TaS_GERCollapse_news.39.a:0 "愿伊比利亚拥有一个更美好的未来。"
