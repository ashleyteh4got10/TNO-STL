 GRA_Unified_DEF:0 "德意志社会主义共和国"
 GRA_Unified_ADJ:0 "德意志"
 POSTWRW2_Baader_DESC:0 "安德烈亚斯·巴德尔在其短暂的一生中经常受到冷遇。显然，纳粹不喜欢他的思想。但安德烈亚斯并不打算放弃；为了国家的自由，他愿意做出任何牺牲。\n\n为了让纳粹害怕，这位德国红军的领袖甘愿成为一名恐怖分子。\n\n机会似乎出现了：来自东方的俄国人，和他们一样憎恨纳粹，而且，他们似乎并不排斥社会主义思想。\n\n然而，红色德国的梦想，却如泡沫般迅速破灭。德国的土地，被那些机会主义者和被历史遗忘的“国王”们瓜分殆尽，而那些所谓的“统治者”，也不过是依靠着俄国人的武力勉强维持统治罢了。\n\n现在，巴德尔必须战斗。他不是为了自己而战，而是为了德国人民，为了一个更加光明的未来。迈因霍夫…她会很高兴的。"
