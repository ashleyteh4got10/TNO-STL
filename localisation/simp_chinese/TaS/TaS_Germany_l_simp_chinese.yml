 TaS_GERCollapse.1.t:0 "分崩离析"
 TaS_GERCollapse.1.d:0 "“这到底是怎么回事？那支曾经在40年代征服整个欧洲，又在50年代成功捍卫其霸权的举世无双的军队，怎么会败给一群俄罗斯蛮夷的？我们的军队为何没能阻止他们的攻势？”会议大厅中充斥着愤怒的质问声，被质询的对象是一位站在讲台后、神情紧张的发言人。\n\n“这个信息恕我无可奉告。”这位议员的声音略微有些颤抖。\n\n“胡扯！就是因为你们这些尸位素餐的官僚，整天沉溺于毫无意义的内斗之中，才毁掉了我们的国防军！现在呢？那些用德意志忠诚儿女们的鲜血所征服的东部领土，如今却落入了俄国人的魔爪！”一位议员的怒吼声格外刺耳，引发了议会中一片雷鸣般的附和，“耻辱！这是彻头彻尾的背叛！”\n\n“请各位肃静！”议长提高了嗓门。\n\n“你们胆敢质疑我们元首的领导智慧吗？”发言人反问道。\n\n但迎接他的却是一片嘘声：\n\n“绝无此意！我们质疑的正是你们这些人的忠诚，是你们亲手毁掉了我们伟大的帝国！”\n\n会场上的斥责声一浪高过一浪：“耻辱！”“叛徒！”“把这些将军们送上审判台！”\n\n“请各位议员同志遵守会场秩序！！！”议长高声维持着秩序，与此同时，全副武装的警卫也被召入了会场。\n\n主席台上有人低声耳语了几句，其中一位开口说道：\n\n“元首决定，将此次会议推迟到晚些时候再举行。现在，我以个人的名义，恳请诸位遵守秩序，有序退场！”"
 TaS_GERCollapse.1.a:0 "德意志大厦的根基已然出现了裂痕。"
 TaS_GERCollapse.2.t:0 "巨人的落幕"
 TaS_GERCollapse.2.d:0 "“元首陛下，早餐时间到了。”一个年轻侍从轻声说道，他一直负责照顾病重的马丁·鲍曼的起居。\n\n“好的，谢谢。”他嘶哑着嗓音答道，此刻他正坐在自己办公室的桌前。\n\n当侍从将一盘水煮蔬菜端到他面前时，鲍曼用同样嘶哑的嗓音说道：\n\n“请你先退下，让我一个人静一静。”\n\n“遵命，元首。”\n\n片刻之后，房间里只剩下了鲍曼一个人。\n\n他起身缓步走向窗边，俯瞰着这座曾经辉煌壮丽的帝国之都——柏林。这里曾经是整个世界的中心，然而，过往的荣光如今早已被那场与俄罗斯之间爆发的战争消磨殆尽，只剩下了满目疮痍。\n\n突然，鲍曼感到一阵剧烈的肺痛，他心里清楚，自己很快就要开始咳血了。\n\n他早就习惯性地从棕色外套的口袋里掏出了一块手帕。\n\n然而就在这时，他突然感到一阵令人窒息的缺氧感。\n\n紧接着，他便开始不受控制地呕吐，鲜血从他的口中喷涌而出，喷溅得到处都是，而胸口的剧痛也在愈演愈烈。\n\n他重重地摔倒在地，挣扎着想要爬向房门，去向警卫呼救。但他刚爬到一半，便伸出了自己的右手，想要继续向前，然而全身的力气似乎都在这一瞬间被抽空。他颓然地倒在了地上，侧着脑袋，徒劳地张着嘴，却再也无法吸入哪怕一口空气。\n\n就这样，大日耳曼国的元首马丁·鲍曼，结束了他那罪恶的一生。"
 TaS_GERCollapse.2.a:0 "可悲的落幕…"
 GER_gerhard_klopfer_POSTWRW2_DESC:0 "仇恨、悲恸、以及那份萦绕心头的不公——自从那些来自东方的劣等民族彻底占领了莫斯科，并进一步攻陷了高加索边境以来，这就是克洛普弗内心深处所能感受到的所有情绪。而之后发生的一切更是让他的心情每况愈下：各个专员辖区的相继沦陷，对祖国领土的悍然入侵，以及那一致命的、压垮德国的最后一根稻草——马丁·鲍曼的死！\n\n在事态发展到最糟糕的局面之前，马丁·鲍曼指定了格哈德·克洛普弗作为自己的继任者。这位新任元首向众人发誓，他将竭尽所能地延续那位即将离世的元首所开创的“黄金时代”。但这番豪言壮语充其量只不过是克洛普弗的一厢情愿罢了。党卫军的不信任以及国防军的蔑视，早已令这个原本就千疮百孔的纳粹体系更加岌岌可危，更别提那些早已离心离德的普通民众了。这个由一个建立在流沙之上的巨人——大日耳曼国，在自身重压之下分崩离析，也只不过是时间问题而已。而在这之后又将留下些什么呢？如果克洛普弗能够执掌权力足够长的时间，恐怕连一片废墟都不会剩下。"
 GER_emergency_council:0 "纳粹党紧急委员会"
 GER_emergency_council_DESC:0 "当俄罗斯统一之时，德国的统治集团选择了三缄其口——毕竟，那些不过是“俄罗斯蛮夷”罢了，能对我们构成什么威胁？当“秋季行动”开始后，德国的统治集团依然选择了保持沉默，因为他们不想与鲍曼产生冲突。而当俄罗斯人开始大举东进之时，他们还是选择了默不作声，因为他们坚信，那支战无不胜的国防军必将把那些入侵者撕成碎片。但当元首撒手人寰，德国已是一片狼藉，甚至连军队都开始抗命不遵的时候——国家议会却已无话可说。\n\n德国的统治集团发现他们当下的处境与1964年时是何其的相似！面对各种令他们束手无策的挑战，各方势力的博弈与不断爆发的事件却又在直接决定着这个国家未来的命运。而他们唯一能做的，就是静静等待，祈祷自己能够在经历这场席卷一切的政治风暴之后还能幸存下来。\n\n所谓的“紧急会议”，只不过是一具用来掩人耳目的空壳傀儡罢了，真正掌握德国命运的人，即将登上历史的舞台。民主派、共产党人、改革派、军方势力、技术官僚、保守派、实用主义者、各大财团……每一天、每一小时、每一分钟，无数势力都在你死我活地争夺着那个空悬的宝座。虽然各方斗争仍未分出胜负，但是这个“紧急会议”的傀儡政客们必须要做些什么，起码，不能让帝国在他们的手中分崩离析。"
 TaS_GERCollapse.3.t:0 "效忠宣誓"
 TaS_GERCollapse.3.d:0 "那一天，人民大厅里人头攒动，座无虚席。参加者上至达官显贵，下至风华正茂的希特勒青年团成员。对于每一位大日耳曼国的公民来说，这是一个意义非凡的日子——他们将在此进行庄严神圣的效忠宣誓。\n\n格哈德·克洛普弗健步走上讲台，他之前一直担任政府首脑，实际上也是马丁·鲍曼的副手，并在鲍曼饱受癌症折磨期间代为管理党内事务。而现在，随着鲍曼的离世，他终于成为了这个帝国名正言顺的主人。\n\n克洛普弗举起右臂，行了一个标准的纳粹礼，大厅里的所有人也都纷纷效仿。随后，这位新任元首开始了讲话。\n\n“尊敬的德意志公民们。今天，你们聚集于此，进行效忠宣誓。我们敬爱的元首马丁·鲍曼因心脏病突发而不幸逝世，在此悲痛时刻，党将领导帝国前进的重任托付给了我。”\n\n稍作停顿之后，克洛普弗将右手放在了圣经上，左手微微抬起，开始宣读誓词，而在场的每一个人都跟着他一同复述着誓言：“我宣誓，永远忠于德意志民族与国家的元首，格哈德·克洛普弗。我将矢志不渝地追随您，至死方休！”\n\n说完后，他再次举起右臂，高呼：\n\n“胜利万岁！”\n\n大厅里的所有人齐声高呼，声音响彻云霄。"
 TaS_GERCollapse.3.a:0 "他能够力挽狂澜，拯救国家吗？"
 TaS_GERCollapse.4.t:0 "福克斯先生的最后一次漫步"
 TaS_GERCollapse.4.d:0 "“弗里德里希，你要明白我的苦心。我们目前的国内局势已是岌岌可危，甚至可以称得上是灾难性的。仅仅更换一个元首并不能从根本上解决问题。”莱因哈德·盖伦压低了声音对他的密友兼护卫队长说道。\n\n两人正沿着菩提树下大街悠闲地散步，不知不觉间走到了宫殿桥附近。\n\n“可是，盖伦先生。如果这话出自一位更加忠于元首的人口中，那么他很有可能立刻被扣上叛国的帽子。”弗里德里希忧虑地说。\n\n“你不必对我表示忠心那一套，弗里德里希。我可是早在希特勒时代便开始为国效力了。我还帮助马丁·鲍曼成功地揭露了党内的那起惊天阴谋。因此，指责我不忠是毫无道理的。”\n\n“但他们可能会指责您彻底搞垮了我们的军事情报机构，盖伦先生。毕竟在您治下，军情部门对于与俄罗斯爆发的这场战争可谓是毫无准备啊。”\n\n“他们绝不敢如此放肆！论其对异端的捕杀的嗅觉和本领，这世上恐无人能出我其右。至于在对俄战争中的失败，那不过是一次无关痛痒的失误罢了。德国终将挺过这次难关，请不要怀疑这一点……”\n\n盖伦和护卫队长在宫殿桥旁驻足，想要继续交谈下去。\n\n他们都没有注意到，自己早已进入了一双眼睛的监视范围。这也难怪，正午时分的德国街头人流如织，想要不被注意也是件难事。\n\n突然，一阵突如其来的枪声打破了城市那习以为常的喧嚣。枪手没有被当场擒获，因为他在得手后便迅速跳入了施普雷河中不见了踪影。但他还是成功完成了他的刺杀任务——帝国情报局局长莱因哈德·盖伦被当场击毙，而弗里德里希·加特尔则身负重伤。"
 TaS_GERCollapse.4.a:0 "德意志的擎天巨柱已然轰然崩塌。"
 TaS_GERCollapse.5.t:0 "无视秩序的暴徒"
 TaS_GERCollapse.5.d:0 "那天夜里，一辆带有秩序警察标志的卡车驶向了该组织总部大楼附近的检查站。值班人员迅速跑上前去。\n\n“我们执行完任务回来了。”卡车司机对检查站的哨兵说道。\n\n“但我这边并没有收到任何关于今晚会有车辆返回的报告……”\n\n“我也不清楚……可能是哪里出了差错吧。”\n\n“好吧，出示你们的证件。”\n\n司机递交了相关证件。几分钟后，值班人员从岗亭里走了出来，说道：\n\n“抱歉，我无法核实你们的证……”\n\n还没等值班人员说完，卡车司机便用一把装有消音器的手枪，将他射杀。\n\n将尸体拖回岗亭后，司机迅速驾车通过了检查站，将卡车停在了秩序警察总部大楼的专用停车场。\n\n过了一会儿，司机打开了卡车的车厢，启动了里面装载的大约四吨炸药的爆炸装置。\n\n他从外套的内兜里掏出了一部对讲机，小声说道：\n\n“总部，‘鹰隼’报告。炸弹已运抵目标地点，起爆器已启动。等待进一步指示，完毕。”\n\n“收到，‘鹰隼’。确保炸弹的起爆器正常工作，然后撤离大楼。十分钟后在集合点会合。通信结束。”\n\n“收到，通信结束。”\n\n司机最后一次检查了车厢，确认了起爆器正在工作。随后，他关上车门，朝着大楼的出口走去。\n\n十五分钟后，在凌晨1点17分，秩序警察的总部大楼内发生了一起剧烈的爆炸。全德国的紧急部门都进入了戒备状态。而那位卡车司机——阿尔伯特·菲格勒，正站在自己公寓的窗前，欣赏着这“壮美”的一幕。"
 TaS_GERCollapse.5.a:0 "这窗外的景色可真美啊…"
 TaS_GERCollapse.6.t:0 "调查报告"
 TaS_GERCollapse.6.d:0 "大日耳曼国元首阿尔伯特·施佩尔向着他的专车走去。\n\n23时05分，车队启程前往人民大厅。10分钟后，车队行驶至一辆停靠在路边的大众轿车旁时，发生了一起剧烈的爆炸。23时19分，一名身份不明的恐怖分子向元首发动袭击，他用手枪向施佩尔开了五枪，击中了施佩尔的肩部和腹部。\n\n警卫们反应迅速，当场将这名恐怖分子击毙。施佩尔本人侥幸捡回了一条命，并被紧急送往医院，目前伤情稳定，但仍未脱离危险。\n\n由于恐怖分子被当场击毙且头部中弹，其身份信息目前仍无法确认。但是，国家安全局经过初步调查，已经确认了凶手的名字。\n\n此人名叫埃瓦尔德·勃兰特，自1946年以来一直是纳粹党的党员，而且是该党最忠诚的党员之一。由于德国地下组织活动的猖獗，埃瓦尔德发动了这起刺杀行动，因为他从心底里鄙视元首，认为他是雅利安民族的叛徒，是他毁灭了以希特勒为首的先辈们所奋斗的一切。\n\n德意志现已启动了一项全面拦截计划，以防恐怖分子逃出柏林。在全国范围内，进入特殊状态：国家安全局联合国防军封锁了所有道路，并在每个出城路口设立了检查站。目前城内局势依旧紧张。当晚，纳粹党领导层紧急召开会议。在会上，党的高层领导决定立即在整个首都地区实施紧急状态，将议会会议推迟到更晚的时间，并尽一切可能对这一事件进行保密。"
 TaS_GERCollapse.6.a:0 "该死的，怎么又出事了！"
 TaS_GERCollapse.7.t:0 "摘下面具"
 TaS_GERCollapse.7.d:0 "“现在有请外交部长西奥多·奥伯兰德发言。”保罗·韦格纳在自己座位上说道。\n\n在这些话之后，奥伯兰德拿着事先准备好的演讲稿走上了演讲台。\n\n“尊敬的议员同志们！今天，我们肩负着一项伟大的职责和崇高的使命——引领德国重新走上那条通往繁荣与稳定的康庄大道。我们正经历一段极不平凡的艰难时期，我们的国家迫切地需要坚强有力的领导核心和果断坚决的行动。\n\n我们都看到了阿尔伯特·施佩尔执政的种种恶果，然而现在，是时候做出改变了。我们必须大步向前，巩固我们的政权，保护我们人民的利益。我们的党，我们的人民，都值得一个更加光明璀璨的未来，而我们也必须确保这个未来掌握在我们手中。因此，民族社会主义德国工人党的领导层宣布，阿尔伯特·施佩尔不再担任大日耳曼国元首一职。\n\n会场内的代表们开始鼓掌。\n\n一分钟后，掌声逐渐平息，奥伯兰德继续说道：\n\n“为了防止出现权力真空，党中央提议由我来接任元首一职。而我也欣然接受了这一任命…愿我们雅利安民族的荣光永存！”\n\n他以一个标准的纳粹举手礼结束了自己的讲话：\n\n“胜利万岁！”\n\n所有在场的议员都从自己的座位上起身，举起自己的右手，齐声高呼：“胜利万岁！”"
 TaS_GERCollapse.7.a:0 "党的力量彰显无遗。"
 TaS_GERCollapse.8.t:0 "血腥一日"
 TaS_GERCollapse.8.d:0 "那天清晨，在昔日的柏林城中，空气里弥漫着令人不安的气息。\n\n在哈登贝格大街上，聚集了各式各样的人群，从昨天还满心期待着元首将赐予国家民主的年轻人，到那些对输掉对俄战争而耿耿于怀的党内老兵，形形色色，不一而足。\n\n与此同时，在库尔菲斯滕大街上，自发形成的抗议队伍也开始集结。但所有人的注意力都被一位拿着扩音器的人所吸引，他大声疾呼：\n\n“同志们！保守派倒行逆施的官僚们罢免了我们的元首——阿尔伯特·施佩尔！我们今天的任务，便是和平地向人民大厅进发，让那些叛徒们明白，人民与我们的元首同在。在他们从政府中滚蛋之前，我们绝不退缩！！”\n\n就在这时，抗议队伍开始向人民大厅的方向行进。\n\n游行队伍中，人们高举着带有纳粹标志的红旗和阿尔伯特·施佩尔的画像。对于绝大多数民众来说，奥伯伦德的新政府毫无合法性可言，他们非法罢免了施佩尔的元首职务。而这也成为了反对派借题发挥的把柄。\n\n当游行队伍行进至位于蒂尔加滕广场的阿道夫·希特勒纪念碑时，大批的城市警察和当地的卫戍部队拦住了抗议者的去路，他们已经将手中的步枪瞄准了游行队伍。\n\n人群停下了脚步，四周顿时陷入一片死寂。\n\n这令人窒息的沉默持续良久，直到一名军官下达了那道命令：\n\n“开火！！”"
 TaS_GERCollapse.8.a:0 "那一天，德意志的街道被鲜血染成了红色。"
 TaS_GERCollapse.9.t:0 "对四人帮的审判"
 TaS_GERCollapse.9.d:0 "那天的人民法院的庭审现场可谓是空前紧张。因为接受审判的并不是普通的官员，而是阿尔伯特·施佩尔执政初期叱咤风云的当权者们——纳粹党内异见派系的领袖们，即所谓的“四人帮”：库尔特·格奥尔格·基辛格，赫尔穆特·施密特，路德维希·艾哈德和亨宁·冯·特雷斯寇。\n\n当庭审进行之时，法院外已经聚集了一大群激进的学生，他们随时准备冲进大楼。但法官们则显得有恃无恐，因为大楼外还有着大量荷枪实弹的军警负责保卫法院的安全。\n\n“四人帮”的每一位成员不仅被指控犯有叛国罪，还有其他一些单独的罪名。\n\n基辛格——背叛党的理想和国家社会主义的思想；艾哈德——破坏经济，导致法兰克福交易所崩盘；特雷斯寇——整肃军队，导致在对俄战争中惨败；施密特——推行丧权辱国的外交政策。\n\n在审判的最后，法官宣读了判决书：\n\n“根据以上所陈述的所有事实，人民法院现作出如下判决：判处基辛格、艾哈德、特雷斯寇以及施密特绞刑，立即执行。”\n\n宣判结束后，四人被带往一个不为人知的地方执行死刑，而审判也宣布结束。"
 TaS_GERCollapse.9.a:0 "德意志的民主化时代戛然而止。"
 TaS_GERCollapse.10.t:0 "实业家们的反抗"
 TaS_GERCollapse.10.d:0 "“停止全国范围内的所有工业生产将会彻底摧毁我们的工业。本来我们的工业就已经因为东部领土的丧失而损失惨重了，现在居然还威胁要让所有企业都停工…”施佩尔对他的私人秘书卡尔·谢尔普费尔特抱怨道。\n\n“我的元首，他们向您提出的条件只有一个——辞去您的职务。”\n\n“这帮该死的资本家！”施佩尔狠狠地一拳砸在桌子上。\n\n他走到办公室的窗边，他的私人秘书静静地站在一旁，等待着他的下文。\n\n“曾经，我让阿布斯那个老家伙认清了自己的位置。而现在，当我们的东方领土沦丧后，他居然觉得自己又行了……”\n\n“我的元首……但在目前的情况下，我个人认为这似乎已经是唯一的出路了。或许您最好还是……”\n\n“你先出去，让我一个人静一静……”施佩尔打断了他的秘书，后者随即识趣地退出了办公室。\n\n秘书离开后，施佩尔一屁股坐回到自己的办公桌前，开始思索阿布斯向他发出的这份最后通牒：要么辞职，要么所有企业都将停工……\n\n德意志的人民已经见证了太多的苦难：奴隶起义、对俄战争……无论如何，他辞去元首一职是唯一能避免德国彻底崩溃的办法。\n\n在沉思了半小时后，他拨通了私人秘书的电话，说道：\n\n“卡尔，我已经决定接受阿布斯的条件了。”"
 TaS_GERCollapse.10.a:0 "改革派元首的时代就此落幕。"
 GER_Hermann_Josef_Abs_DESC:0 "或许，赫尔曼·阿布斯并不是帝国政坛上最具影响力的人物。或许，在石油危机期间，赫尔曼·阿布斯也未能给施佩尔和德国带来任何实质性的帮助。或许，赫尔曼·阿布斯的财团也没能阻挡俄罗斯人的滚滚铁流。但阿布斯心里很清楚自己现在该做什么。\n\n赫尔曼·阿布斯1901年出生于科隆，他从未品尝过穷困潦倒的滋味。凭借着自身的铁腕和狠辣，他一步步登上了德意志银行董事的宝座，并最终执掌了这家银行的权柄，一跃成为全德意志，乃至全世界最为富有的银行家。当施佩尔上台后，他的政策从一开始就令阿布斯深恶痛绝。解放奴隶、加征税收、国有化企业，这一系列举措让这位新任元首迅速沦为了阿布斯的眼中钉、肉中刺。阿布斯恨透了施佩尔，无时无刻不在给他使绊子，而这也间接导致了石油危机期间德国经济的彻底崩溃。\n\n当俄罗斯人的胜利彻底摧毁了大日耳曼国繁荣的幻梦后，赫尔曼再也无法忍受下去了。阿尔伯特·施佩尔已经毁了他的毕生心血，而现在他还要变本加厉地毁灭整个国家。利用自己在纳粹党内、商界，以及元首私人圈子中的人脉，他轻而易举地就将施佩尔赶下了台，并取而代之。\n\n而今，德国已是一片狼藉，奴隶没了，经济垮了，军队败了，局势乱了。但权力，终于来到了他的手中。这一次，他绝不会允许任何人再来对他指手画脚，发号施令或是操纵摆布。这一次，他将亲手缔造一个他心目中的、完美的德意志。"
 GER_despotism_abs:0 "纳粹党-企业董事会"
 GER_despotism_abs_long:0 "纳粹党-企业董事会"
 TaS_GERCollapse.11.t:0 "“救亡图存”的良方"
 TaS_GERCollapse.11.d:0 "“您那些所谓的救市措施，非但没有将大日耳曼国从经济危机的泥潭中拯救出来，反而变本加厉，让整个国家雪上加霜。”一位议员站在讲台上慷慨激昂地说道，抨击着弗里德里希·阿布斯元首所推行的经济改革。\n\n台下其他的议员们也随声附和，高喊着：“说得对！”“财阀误国！”\n\n“肃静，肃静！请各位议员同志们遵守会场纪律，不要打断发言人的讲话！”议长维持着会场秩序，并示意发言人继续。\n\n发言人清了清嗓子，继续说道：\n\n“尽管实行粮食配给制度，比如凭票供应面包和肉类制品，在一定程度上缓解了燃眉之急。但是，您的一些‘创新举措’，比如强制推行所谓的‘紧急口粮’——包括‘芜菁汤’和‘烤乌鸦肉’——却造成了大量民众由于食用劣质食物而死亡，从而进一步加剧了民众对政府的不满情绪。”\n\n台下再次响起了阵阵声讨：“打倒卖国财阀！”“为了德意志的荣光，消灭财阀统治！”\n\n与此同时，主席台上的人们窃窃私语。议长拿起话筒大声宣布：\n\n“由于各位议员同志们无法就具体的改革措施达成共识，元首宣布，关于经济改革问题的会议将延期举行。现在我宣布，本次会议结束！”"
 TaS_GERCollapse.11.a:0 "大权几经易手，但问题依旧。"
 TaS_GERCollapse.12.t:0 "来自街垒的问候"
 TaS_GERCollapse.12.d:0 "“冲啊，同志们！胜利就在眼前！前进，攻下那栋楼！！”一个人站在街垒的后面，挥舞着手臂，通过扩音器高喊着口号。\n\n在这些口号的鼓舞下，起义者们向着仅有少量人民突击队负责守卫的科隆市政大楼发起了冲锋，而负责保卫这栋大楼的主力部队都是些毫无经验的年轻学生。\n\n枪声随即在市政大楼附近响起。\n\n渐渐地，起义工人开始将人民突击队逼退到了街角，后者也开始退守到市政大楼内部。\n\n越来越多的武装工人向大楼聚拢。突然，一个声音通过扩音器传遍了整个广场：\n\n“大楼里的守军听着！我们劝你们放下武器，和平投降，我们保证不会伤害你们。否则，我们将不得不强行攻占这栋大楼！”\n\n“做梦去吧，你们这帮暴徒！”大楼里传来了阵阵咒骂声。\n\n听到这些谩骂，起义者们开始将火炮拉到大楼前。\n\n扩音器再一次响起，内容依然是敦促大楼里的守军投降。\n\n在发出了最后通牒，但仍然没有得到任何回应后，起义者们下令用火炮对大楼发动猛攻。\n\n二十分钟后，一些高举双手的人从大楼里鱼贯而出。\n\n与此同时，一面带有锤子和镰刀标志的红旗取代了大楼上的鹰徽旗，这意味着，这座城市的控制权已然落入了工人起义军的手中。"
 TaS_GERCollapse.12.a:0 "工人们展现了自己的力量。"
 TaS_GERCollapse.13.t:0 "“我是迈克…”"
 TaS_GERCollapse.13.d:0 "这一天的夜晚对于德意志而言，本该是平平无奇的。所有的首都居民都结束了一天的工作，回到家中与家人共享晚餐，然后上床睡觉。威利·勃兰特也本应如此安然入睡，这一天，他似乎终于美梦成真了。\n\n大日耳曼国正大踏步地迈向民主化，似乎没有任何力量能够阻挡这一历史潮流。\n\n勃兰特的公寓传来了敲门声，站在门口的是他的老熟人——来自波罗的国家的迈克·施密特。\n\n迈克提出要在勃兰特这里借宿一晚，因为他的家在很远的地方，而最后一班火车已经停运了。\n\n勃兰特没有理由拒绝自己这位老友的请求。不久前，迈克选择离开自己的祖国——拉脱维亚，只身一人来到异国他乡，因为他无法忍受自己国家的那套政治体制，于是便成了一名漂泊的“旅外侨民”，而大日耳曼国正是他流浪生涯的第一站。\n\n勃兰特热情地将迈克迎进了自己的家中。在他看来，迈克不仅仅是他的老朋友，更是他的患难之交。就像勃兰特一样，迈克也与自己祖国的当权者发生了激烈的冲突。也许他们选择的抗争方式不尽相同，但他们都与自己的祖国分道扬镳，这一点毫无疑问能够说明，他们是一对志同道合的难兄难弟。\n\n然而，就在公寓的门关上的那一刹那，迈克突然停下了脚步，而且连帽子也还没来得及摘。勃兰特问道：\n\n“嘿，老伙计，你怎么了？”\n\n但这却是勃兰特所说出的最后一句话。因为迈克以迅雷不及掩耳之势从上衣口袋中掏出一把装有消音器的手枪，五发子弹瞬间便终结了他的生命。\n\n“这发子弹是为了所有被你戕害的德国人，也为了你一手制造的混乱...”麦克自言自语道，随后便迅速消失在了茫茫的夜色之中。"
 TaS_GERCollapse.13.a:0 "所以说，好人难做啊…"
 TaS_GERCollapse.14.t:0 "元首失势"
 TaS_GERCollapse.14.d:0 "勃兰特被谋杀后的第二天早晨，人们才终于意识到，现任元首阿尔伯特·施佩尔已经无力回天，他根本无法兑现“四人帮”的种种许诺。在一次内部会议上，“四人帮”成员一致决定——彻底剥夺阿尔伯特·施佩尔的元首职务。\n\n当天，纳粹党紧急召开了一次党代会，会上，“四人帮”计划正式废黜施佩尔的元首一职。施佩尔本人在会议开始前二十分钟抵达会场，此时的他依然对即将发生的事情一无所知，径直走向了元首的席位。他在这张椅子上坐得越来越不踏实，思绪万千，而最让他寝食难安的一个问题是——他究竟能否以大日耳曼国元首的身份，看到各项改革的最终完成。\n\n大会开始了。在会上，改革派阵营开始对施佩尔步步紧逼，这也让许多原本保持中立的保守派代表们倍感意外。而施佩尔本人则试图为自己辩解，但他每次刚一张嘴，就会被打断。就在这时，一群秩序警察的成员走进了会场。四人帮的马前卒之一当众宣布：\n\n“阿尔伯特·施佩尔，你被指控犯有危害德意志民族的罪行，你被逮捕了！”\n\n在其余保守派议员以及绝大多数改革派震耳欲聋的掌声中，施佩尔被带出了会场，并被押上了一辆黑色的“大众”牌汽车。而“四人帮”的成员之一——库尔特·格奥尔格·基辛格则接过了国家总理的职务，成为了新的代理元首。\n\n至此，一切都已尘埃落定——改革将按照“四人帮”所期望的那样继续进行下去。"
 TaS_GERCollapse.14.a:0 "通往民主的最后几步。"
