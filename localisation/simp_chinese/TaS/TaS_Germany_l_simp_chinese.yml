 TaS_Post2WRW_GAU_habsburg_returns:0 "哈布斯堡家族的归来"
 TaS_Post2WRW_GAU_habsburg_returns_desc:0 "也许，每隔半个世纪，奇迹就会降临一次。当奥托·冯·哈布斯堡踏上这片没有纳粹的奥地利土地，并以他与生俱来的权力统治这个国家时，奇迹，便真真切切地发生了。想当年，他的父亲被驱逐出那个摇摇欲坠的帝国时，复辟的希望似乎也随之破灭。但命运之神眷顾着哈布斯堡家族，在别洛泽尔斯基国王的帮助下，他们终于回到了本该属于自己的位置。这一次，哈布斯堡家族将牢记历史的教训，绝不会再让权力从手中溜走。\n\n§Y世界属于奥地利!(德语)§!"
 TaS_Post2WRW_GAU_dreams_of_germany:0 "德意志之梦"
 TaS_Post2WRW_GAU_dreams_of_germany_desc:0 "奥地利皇室也曾面临着另一条道路，一条最终未能实现的道路。我们曾统治着神圣罗马帝国，那是德意志民族的荣光时刻。但在上个世纪，普鲁士窃取了本应属于奥地利的命运，而我们则被迫屈居人后，成为他们卑躬屈膝的附庸。现在，命运给了我们第二次机会，一个我们必须抓住的机会——以它本来的面目，重新统一德意志！"
 POSTWRW2_Otto_von_Habsburg_DESC:0 "奥托·冯·哈布斯堡从未想过自己还能有重返故土的一天，更别提成为这个国家的统治者了。然而，一系列的幸运际遇让他回到了奥地利。在经过了匆忙的加冕仪式后，他以奥托一世的名义登上了王位。\n\n然而，这个国家的情况却不容乐观——用轻描淡写来形容都过于委婉。与俄罗斯的战争摧毁了大部分的工业设施，无数人流离失所，家园尽毁。而那些不愿接受失败的纳粹分子，依然在负隅顽抗，对俄罗斯驻军和警察局发动袭击。在奥托一世的铁腕统治下，这个国家正蹒跚地驶入一片风暴肆虐的海域。"
 POSTWRW2_Bruno_Krajskiy_DESC:0 "布鲁诺·克莱斯基，一个来自奥匈帝国的犹太纺织商人家庭的孩子。战后满目疮痍的景象、深不见底的贫困，深深刺痛了年幼的布鲁诺。15岁那年，他义无反顾地加入了奥地利社会民主工人党，希望能够改变这一切。1929年，命运的齿轮开始转动，他遇见了影响其一生的导师——奥托·鲍威尔，并在维也纳大学开始了他的求学之路。\n\n然而，好景不长。随着社会民主工人党被取缔，克莱斯基的生活也跌入了深渊。他被冠以叛国罪锒铛入狱。虽然刑期较短，但纳粹的魔爪已经伸向了他。在被关押六个月后，他奇迹般地逃过了被送往达豪集中营的厄运，并成功流亡到瑞典。\n\n欧洲大陆被黑暗笼罩，但克莱斯基从未放弃希望。他以笔为剑，在瑞典从事新闻工作，并从瑞典民主社会主义的经验中汲取力量，坚信着终有一天能够重返故土。在瑞典的这段时间，他逐渐形成了“奥地利民主社会主义道路”的构想，并成为了流亡海外的奥地利政治活动家中最闪耀的明星。\n\n第二次西俄战争结束，在人民帝国的帮助下，奥地利得以重建。饱经战火洗礼的土地，满目疮痍的城市，经济的崩溃，这一切都与曾经那个强大的帝国相去甚远，却也为政治改革提供了沃土。克莱斯基和他的同志们终于有机会将他们的理论付诸实践。等待着他们的，将是一条漫长而艰巨的复兴之路。但他们坚信，民主与社会主义的结合，必将成为这个古老国度未来发展的基石。"
