 TaS_GERCollapse.16.t:0 "愤怒老兵的进军"
 TaS_GERCollapse.16.d:0 "“所以……你们究竟有何打算？”\n\n上午10点，一个对许多人来说都不同寻常的时刻，《明镜周刊》的记者邓恩·里斯特却意外地踏上了一趟前往柯尼斯堡的特别出差之旅。\n\n邓恩一抵达目的地，就目睹了一场非同寻常的景象：数百名整装待发的士兵在车站集结，他们似乎随时准备开赴某个地方。在整个车站中，士兵们齐声高唱着一首歌：\n\n“长矛在手紧握钢，\n左手紧攥着缰绳，\n帝国骑兵纵马冲，\n长剑闪耀寒光迸。\n嗨呀，嗨呀，嗨呀！嗨呀！长剑闪耀寒光迸。”\n\n邓恩对眼前这番景象深感诧异。他决定向士兵们询问他们集结于此的原因，而这时，引发这场骚动的“罪魁祸首”——阿道夫·冯·塔登——也恰好走到了他的面前。\n\n1945年，塔登因为在德军东征苏联期间的功绩，以及在占领区内镇压游击队的“卓越贡献”，被授予了“全国领导”的头衔。在第一次西俄战争期间，他是希特勒麾下负责防卫帝国领土的核心幕僚之一。而在这场战争中，塔登被迫退休，极富巧合的是，紧随其后发生的便是德意志在这场战争中的惨败。塔登将这奇耻大辱尽数归咎于大日耳曼国中那些搞改革的当权派。\n\n邓恩决定走上前去，向这位曾经权倾一时的全国领导询问究竟发生了什么事：\n\n“尊敬的全国领导阁下，这里到底发生了什么事？”\n\n“简单的很，我们，这些德意志的爱国者，要向这帮搞民主的废物宣战！这群无耻的懦夫！”\n\n邓恩大吃一惊，追问道：\n\n“难道您打算将他们赶下台吗？！”\n\n随后，塔登转向士兵们，慷慨激昂地说道：\n\n“德意志的爱国者们！我们对这帮当权的民主派的懦夫杂种已经忍耐得太久太久了，他们把我们伟大的德意志拖入了无尽的混乱深渊！让我们效仿元首阿道夫·希特勒曾经做过的那样，把这帮无耻的卖国贼彻底赶下台！”\n\n士兵们齐声高呼“是！”，以此来表达对他们长官的无限拥护。与此同时，塔登也用下面的这句话结束了他的演讲：\n\n“让我们去完成我们与生俱来的使命吧：解放我们的祖国！”\n\n“我们背后站着的是整个帝国！”\n\n随后，士兵们开始登上专列，而这些列车正驶向同一个方向——首都！"
 TaS_GERCollapse.16.a:0 "“晨间进行曲，敬爱的德意志。”"
 GER_Adolf_von_Thadden:0 "阿道夫·冯·塔登"
 GER_Adolf_von_Thadden_DESC:0 "背叛。几个无耻的跳梁小丑，仅仅因为惧怕东方那些野蛮人的铁蹄，就将德意志曾经取得的所有辉煌成就付之一炬。他们背叛的初衷，只是为了换取那虚无缥缈的苟延残喘，殊不知他们的后代将会世世代代生活在暗无天日之中，饱受凌辱和折磨。打着虚伪的民主和自由的幌子，这些猪猡从真正的德意志人民的代表——元首手中无耻地篡夺了权力。\n\n但无论是塔登，还是那些同他一样团结在“愤怒的老兵”旗帜下的、成千上万的德意志的英雄儿女们，都不会对这一切坐视不管。 “愤怒的爱国者进军”——塔登如此称呼这场由真正的德意志人所发动的伟大远征，而他们的敌人则是那些为日本人、美国人和俄罗斯人卖命的傀儡走狗们！\n\n终于彻底击败了那群为“犹太资本家”卖命的傀儡政府后，阿道夫·冯·塔登也终于看清了帝国如今的这场灾难是何等深重。成千上万的德国人被那些虚伪的“山姆大叔”所蛊惑，开始信奉那套虚假的自由和理想。曾经忠于国家的整师整师的军队因为受到了那些犹太走狗的蛊惑而选择与我们兵戎相向。而我们的经济，也由于那些俄日杂种的暗中破坏而彻底崩溃。\n\n倘若塔登无法迅速而果断地采取行动，那么这千年帝国，恐怕连一千个小时都坚持不下去了。"
