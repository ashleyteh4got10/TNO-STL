 TaS_Post2WRW_GRH_rhein_industrial_district:0 "德意志的工业中心"
 TaS_Post2WRW_GRH_rhein_industrial_district_desc:0 "十九世纪，是属于德意志的钢铁与鲜血的世纪。奔腾的鲁尔河与莱茵河，见证了这片土地如何源源不断地为德国提供着煤炭和钢铁，以此为基，德国傲然屹立于世界之林。经济危机、政权更迭、奴隶起义，乃至世界大战，都无法阻挡这片土地上勤劳的工人们为祖国挥洒汗水的决心。"
 TaS_Post2WRW_GRH_lot_of_nazis:0 "纳粹的庇护所"
 TaS_Post2WRW_GRH_lot_of_nazis_desc:0 "我们的俄罗斯同志告诉我们，民族社会主义对德国来说是一场灾难。然而，沃尔特·谢尔认为，他们高估了那些狂热分子的威胁，那些妄想颠覆我们政权的乌合之众。解放区总局下令清洗的目标，大多是些没有党证、也没能混进国防军的普通百姓罢了。莱茵面临的挑战和危机数不胜数，实在没空杞人忧天，整日疑神疑鬼。"
 POSTWRW2_Scheel_DESC:0 "沃尔特·谢尔从来都不是什么引人注目的人物。他只是一名普通的战斗机飞行员，在战争的硝烟中保卫着祖国的天空，对其他国家发生的一切浑然不觉——也或许，这只是他现在想让所有人相信的说辞罢了。战后的他，也过着平凡的生活。他选择投身政治，而不是在银行里过着安稳平静的日子，仅此而已。然而，沃尔特却有着一种特殊的才能：他总是能敏锐地感知到风向的变化。当东方的风带来机油和硝烟的气息时，谢尔知道，自己必须行动起来。他或许不是统治莱茵的最佳人选，但他深谙如何将自己包装成一个合格的领导者。"
 POSTWRW2_Willy_Brandt_DESC:0 "赫伯特·恩斯特·卡尔·弗拉姆，也就是后来的维利·勃兰特，出生于自由城市吕贝克。年轻时，他便积极投身政治，并于1930年加入德国社会民主党，后来又加入了德国社会党。纳粹党的掌权，标志着弗拉姆合法政治活动的终结，也开启了他长达数十年的反法西斯斗争。\n\n在相当长的一段时间里，他为盟军情报部门提供支持，并在瑞典组织流亡欧洲的政治人士开展活动。作为一名北欧记者，他试图向全世界揭露德国在欧洲犯下的累累罪行，但收效甚微。20世纪40年代中期，他重新加入了德国社会民主党，并开始在德国学生中传播反法西斯思想，这在西德引起了强烈共鸣。在东部战火燃起前不久，他潜入帝国腹地，致力于建立起更加紧密的反法西斯组织联盟。\n\n第二次西俄战争结束后，莱茵兰与德国主体分离，权力斗争的旋涡在这片满目疮痍的土地上肆虐。然而，与前德国的其他地区不同，一场公平、民主的选举在这里拉开了帷幕——这是多年来的第一次。最终，深受年轻人爱戴的维利·勃兰特当选为首任总统。\n\n摆在维利·勃兰特面前的道路清晰而明确——他要让莱茵兰成为德国这具“尸体”上最耀眼的部分。去纳粹化、社会民主化、建立国际关系、吸引投资……这仅仅是一个开始。自魏玛共和国覆灭以来，饱经战火摧残的民众，从未真正品尝过民主的果实。而维利·勃兰特将以魏玛共和国的遗产为基石，打造一个全新的德国之心。"
