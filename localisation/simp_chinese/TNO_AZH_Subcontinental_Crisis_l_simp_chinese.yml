 subcontinentalcrisis.1.t: "次大陆危机爆发"
 subcontinentalcrisis.1.d: "开始了"
 subcontinentalcrisis.1.a: ":sog_holymoly:"
 subcontinentalcrisis.53.t: "增援巴基斯坦"
 subcontinentalcrisis.53.d: "德国海军的钢铁巨兽破开阿拉伯海沸腾的波涛，庞大的舰体在浪涛间犁出锐利的白色航迹。漆黑的上层建筑与深海钴蓝形成鲜明对比——这种明目张胆违反战术规范的涂装彰显着挑衅。航空母舰“阿道夫·希特勒”号是V字队形的领航舰，甲板跑道上的巨型万字徽直指浪花深处，其右翼是巡洋舰“腓特烈·巴巴罗萨”号与驱逐舰“埃姆登”号、“沃坦”号、“埃里希·克尔纳”号，左翼则是巡洋舰“瓦泽查海军上将”号及驱逐舰“铁拳”号、“傲慢”号、“埃里希·吉泽”号。深水之下，六艘U艇悄然潜行，它们携带的武器足以摧毁整片次大陆。这支曾随破碎帝国沉沦的海军，如今重归汪洋。\n\n在卡拉奇港此起彼伏的警报蜂鸣与人们的嘶喊中，弥漫着深切的不安。那些见证过百艘船进港、千艘船离港的码头工人们，早已听闻流言：德国人非为友邦，实乃新主；将他们从德里暴政中解放的运动，背后却隐藏着套上新的枷锁；更有耳闻东方边境私语者断言——当日本忍无可忍之时（而非是否忍无可忍），卡拉奇必将成为旭日炙焰下首片焦土。\n\n万塞地底深处，国防军最高统帅部纯白作战室内，海军元帅埃里希·托普面色凝重。参谋们手持长杆，将微型舰船模型推过覆盖整面墙的阿拉伯海巨幅地图。越过印度次大陆半岛，在孟加拉湾标示日本帝国海军方位的红色标记几乎静止——疑似最后现身斯里兰卡附近的潜艇分队，已逾数小时未动分毫。"
 subcontinentalcrisis.53.a: "放马过来吧。我们既然赢得了在阳光下的土地，就必将守住它。"
 subcontinentalcrisis.100.t: "从东至西"
 subcontinentalcrisis.100.d: "哈维尔达尔·阿加瓦尔在营房空气中嗅到了一丝隐约的不安，这种不安渗入他的皮肤，使他的神经发冷。他本享受着奥里萨邦的驻防生活——整日饮酒打牌，占点路过女人的便宜，偶尔收拾几个可疑分子。他的上级早已放弃对他小队的效率要求，正如更上级也放弃了对他们整个驻地的期待。只要阿加瓦尔能偶尔摆出威严架势，每周组织一次操练，奥里萨邦就还得继续承受他存在的重负。\n\n直到谣言如雪花般轻柔飘落。西北边境出了乱子。德国人在煽动穆斯林闹事。巴基斯坦远在千里之外，阿加瓦尔没当回事——管他什么麻烦，拉贾斯坦邦和古吉拉特邦的小伙子们总能应付。更多传闻接踵而至：旧共和国残余势力在南方抵抗，民众正逐渐习惯墙上和广播里的鲍斯形象。他强作镇定，但曾经总爱眺望东方美丽海岸线的双眼，却不由自主地频频转向西北。\n\n变故几乎在一夜之间降临：前晚阿加瓦尔与驻地全体官兵突接紧急召回令。凌晨五点有任务简报，全员不得缺席。起床号提前一小时响起，他的小队在电流般刺骨的恐惧中翻身下床，胡乱套上军装。\n\n某位上尉向四分之三驻军下达调遣令：向西北开赴旁遮普。阿加瓦尔的人马赫然在列，他们心知自己是被当作累赘清出。但令他吃惊的是其他被塞进卡车的身影——那些本是被困驻地的精锐尖兵。整个印度的驻军都在剥离最优秀与最顽劣的分子，将他们派往边境。"
 subcontinentalcrisis.100.a: "铺满火绒的边境遇上了火柴。"
 subcontinentalcrisis.101.t: "年轻人，向西进发"
 subcontinentalcrisis.101.d: "阿迪尔·拉尔上尉对部队西进途中滋生的牢骚、不满与流言蜚语充耳不闻。这个野心勃勃的正义青年被炽热的妄想所支配。无论做什么，他都坚信自己是正确的，只要遵循内心认定的正义之路，他毫不畏惧任何伤害会降临。\n\n真正的罪恶是故土持续被占领，是家人被随意划定的国境线生生撕裂。西边拉合尔的母亲在呼唤他，东边阿姆利则的父亲在催促他。这些声音让阿迪尔心痛，却也激励着拉尔上尉采取了未经批准的军事行动——侦察印巴边境的薄弱防线，最终挥师西进。\n\n士兵们蜷缩在卡车里，刚深入敌境十米，先头部队就报告听到了喷气引擎声。他命令士兵持械继续前进。短暂休整后，车队沿着道路继续前行。这原本只是次简单的突袭行动，但在越境前，拉尔的野心膨胀了——侦察兵报告铁路站以北有个前线基地。他们计划夺取该基地，将补给线推进至拉合尔城郊，建立早期据点以便将来实施围城战。\n\n车队又前进了两百米，喷气引擎声越来越近。当连队注意到时，映入眼帘的是绘着新月星徽与卐字标志的俯冲轰炸机，呼啸的螺旋桨、鸥翼和“耶利哥号角”声撕裂天空。缺乏防空火力的车队遭斯图卡一轮轰炸，就摧毁了车队的前三分之一。拉尔上尉试图集结部队，命令他们停车组织防御，却被一记枪托猛击后脑陷入昏迷。部分士兵负隅顽抗，其余人纷纷停车举手投降。"
 subcontinentalcrisis.101.a: "等待他人行动的后果。"
 subcontinentalcrisis.102.t: "呈元首阅：印巴冲突"
 subcontinentalcrisis.102.d: "绝密\n仅限阅悉\n致[getGermanIntelAgencyCaps]全体成员\n行动代号：“捻角山羊”\n\n巴基斯坦-南亚-大东亚共荣圈成员国\n\n印度国民军部队被观测到正试图越境进入巴基斯坦。截至目前仅记录到一次入侵行为，但印巴双方均准备以主权受侵为由宣战。由于巴基斯坦对我国在亚洲的利益扩张至关重要，务必支援其抵御任何潜在的印度入侵。\n\n    1. 在入侵发生前，印军已从原共和派控制区的驻防点撤离（见第4页），并向巴边境集结。该动向已通过信号截获（见附录A.5）与特工报告（见附录A.8-11）双重验证，表明其早有入侵意图。\n    2. 有充分证据表明首次越境行为未获印度国民军高层授意（见第8-9页）。适时披露该情报既可强化巴方主张，亦可打击印军士气。\n    3. 外交信函显示巴基斯坦视当前状态的印度为生存威胁（见附录B.3）。虽存在外交解决可能，但现有情报表明双方均在备战。为保障我方区域利益，必须确保巴基斯坦存续。\n    4. 根据战区司令命令（见第11-12页），我军作战单位已进入待命状态。依据协定条款，若巴基斯坦选择对印宣战，我国将必须履行军事动员义务。只要自由印度仍为共荣圈正式成员国，词句必将导致德日两国交战……\n\n愿德意志永沐荣光。"
 subcontinentalcrisis.102.a: "外交部收悉，格林尼治标准时间23:58。"
 subcontinentalcrisis.103.t: "呈首相阅：印巴冲突"
 subcontinentalcrisis.103.d: "大本营特别参谋部  \n报告编号#[?global.date.GetDateStringNoHour]-03  \n绝密\n\n印度国民军某师团试图越境进入巴基斯坦，导致地区冲突升级。此次入侵行动已被巴基斯坦军队击退，其指挥官目前处于失踪状态。印巴双方均可能借此事件宣战。特别参谋部认为：虽然必须支持印度，但若考虑参战则需谨慎行事。\n\n    1. 在完成对前尼赫鲁政府控制区域的平定后（参见第3页），印度国民军从各驻地抽调增援部队部署至巴基斯坦边境。此举虽被分析为印军高层采取的防御性措施，但仍导致两国政府间紧张局势加剧。\n    2. 阿迪尔·拉尔上尉的越境行动未获印度国民军授权（参见附录A.2第5-6页）。虽然拉尔上尉目前处于失踪状态（推定阵亡），但其残部已被编入其他师团。情报显示印军内部鹰派对其擅自行动持默许态度。\n    3. 印巴双方在民族与宗教问题上的矛盾已被视为不可调和，特别是针对当前由巴基斯坦控制的争议领土主张，这导致双方均倾向于武装冲突。目前外交解决的可能性存在但概率较低。\n    4. 印度作为大东亚共荣圈成员国，日本有义务在其正式宣战后提供军事支持。而巴基斯坦作为团结协定成员国，德国已承诺必要时将协助防御。虽然印度战胜巴基斯坦符合我方利益，但必须确保德国不被卷入。第11-15页阐述了迫使德国将巴基斯坦逐出团结协定的潜在策略……"
 subcontinentalcrisis.103.a: "外务省收悉，日本标准时间23:58。"
 subcontinentalcrisis_has_started: "次大陆危机已经开始。"
 subcontinentalcrisis.110.t: "介入"
 subcontinentalcrisis.110.d: "“这群野蛮人的暴政，竟敢陈兵国门，竭尽所能玷污一个主权独立的民族，实乃痴心妄想……”团结协定常设理事会的其他代表们感觉贾哈娜拉·沙赫纳瓦兹似乎已连续演讲数小时，有人对她矫揉造作的贵族腔调暗自嗤笑。\n\n“……妄图胁迫这个血统高贵而独特的骄傲民族，去接受野蛮人统治的独裁政权。他们可曾有过半分羞耻？”众人疲惫地齐声应和“没有”。“当然没有。这群土匪招摇过市，忘却了英国人赐予的教化，宁可深陷贫困也不肯承认独立后每况愈下。”\n\n“我们巴基斯坦人从未遗忘从英国继承的文明，更不会将其拱手让出，去参与什么疯子讨伐世间虚妄邪祟的圣战。”代表们低声附议：巴基斯坦的主权既已确立，其在协定中的地位便不容置疑。”\n\n“巴基斯坦人民深知，与边境虎视眈眈的印度人相比，我们与欧洲同胞更具共通之处。”会场再起低语，有人思忖这场危机会如何拖累德日关系。即便代价或许值得，两国修复裂痕仍需漫长时光。"
 subcontinentalcrisis.110.a: "只要为巴基斯坦付出的代价不是第三次世界大战就行。"
 subcontinentalcrisis.111.t: "枪杆子里出和平"
 subcontinentalcrisis.111.d: "“说实话，这简直难以置信。”三菱集团的一名初级分析师研究着最新对印军售图表，他的经理正从背后注视着。“危机过后，我们原本预测军售会陷入低谷，但实际情况却恰恰相反。”\n\n“你不该这么惊讶。对他们来说，战争从未结束。”经理是这方面的老手，早年在日本首次战时军备时期入行，后来又协助国家在战后风雨飘摇的岁月里维持和平，带领亚洲诸国摆脱殖民枷锁。\n\n“可边界不是早就划定了吗？现在连鲍斯都没疯狂到敢入侵正式加入团结协定的国家，为什么还要追加军购？”\n\n“这是场冷战，就像我们和西方搞的那套。”他顿了顿，斟酌着措辞，最终放弃修饰直接说道，“就当是场尿尿比赛。双方都会在边境线上堆满最昂贵的装备，却几乎不会开火。不过是给高层看的表演罢了。”\n\n“明白了。”对他个人而言，这种毫无意义的较量令人费解，想久了都会头疼，但他还是追问道：“但您不觉得他们终有一天会放弃吗？和平总会到来吧？”\n\n“次大陆的战争已夺走数百万生命，每个人都怀着血海深仇。就算世代更迭，这些仇恨也只会代代相传。你记住……”"
 subcontinentalcrisis.111.a: "……只要仇恨不息，金钱就会源源不断。"
 subcontinentalcrisis.120.t: "欧洲共同体"
 subcontinentalcrisis.120.d: "当埃瓦尔德初抵巴基斯坦时，他奉命为巴基斯坦军队提供技术支持和训练指导——这是最高指挥部的命令。即便他更愿意留在莫斯科维恩对付那些穴居的斯拉夫人——哪怕是犹太布尔什维克游击队——他也无法违抗军令。于是他咬牙登上了飞往南亚的航班，并在抵达后继续执行命令。  \n\n渐渐地，某些东西发生了变化。那群打着“雅利安”旗号的巴基斯坦新兵蛋子，从只会鸣枪示警的怯懦之徒，迅速蜕变成冷血杀手。恐惧被仇恨取代，他们开始毫无怜悯地射杀边境线另一侧的入侵者。\n\n当巴基斯坦军队逐渐占据上风时，埃瓦尔德明白这不是个例，早在日本迫使印度投降的数周前，他就预见了结局。现在，是时候离开了。\n\n“感谢您做的一切，兄弟。”他将指挥权移交的毛头小子之一伊克巴尔喊道，“希望您有朝一日能回来。要不了多久，这儿肯定会变得热闹非凡。”埃瓦尔德露出微笑。或许，在此退休会是个不错的选择——他完全可以过上国王般的生活。\n\n“这是我的荣幸。要是五十年代俄国佬刚开始耍花招时你就在我们队伍里，我们早该把那些共产党碾碎了。”回以微笑后，埃瓦尔德登上吉普车准备离去。他的连队以标准的元首礼为他举行了最后的阅兵仪式。有那么一瞬间，他真希望自己能永远留在这里。"
 subcontinentalcrisis.120.a: "巴基斯坦属于欧洲。"
 subcontinentalcrisis.121.t: "德国飞机，德国制造"
 subcontinentalcrisis.121.d: "普拉文出生于加济布尔贫民窟，却葬身于巴基斯坦边境的战壕。德军战机呼啸而过时，这个正在和战友分享香烟的士兵因长期缺乏睡眠反应迟钝，直到伸长脖子看见六十英尺外的弹药库被炸成火海。顷刻间，普拉文与整个阵地都化作了灰烬。\n\n整条战线的情况如出一辙。岩畔豪雄的办公桌上堆满战报：补给站遭袭、后勤中心被毁、坚固的防御工事在空袭中损毁。就连日本情报部门认定绝对安全的据点也遭到袭击。大使疲惫地揉着太阳穴，前线多位日本陆军顾问急电警告，印度军队已陷入全面混乱——与德里政府作战已令士兵筋疲力尽，士气低迷，如今军事情报系统亦被渗透成了筛子。这个国家早已丧失保卫领土完整的作战能力，即便日本能在海战中取胜，继续升级冲突也只会迎来灾难性结局。\n\n岩畔于是提笔起草新的报告。他要向东京传递明确信息：日本除了退让别无选择。"
 subcontinentalcrisis.121.a: "幸有德国外援，巴基斯坦得以屹立不倒。"
 subcontinentalcrisis.130.t: "切割"
 subcontinentalcrisis.130.d: "德国将军在除未受邀请的巴基斯坦人外所有人员到齐后，立即敲槌宣布团结协定军事委员会紧急会议开始。会场内没有巴基斯坦国旗，甚至没有为他们预留座位。\n\n将军不容他人插话，宣读军事委员会关于巴基斯坦未来命运的决定：\n\n“本人以团结协定军事委员会主席身份正式宣布：\n\n一）认定巴基斯坦伊斯兰共和国无力履行对协定的应尽义务；\n\n二）据此裁定巴基斯坦伊斯兰共和国构成违约行为，即刻驱逐出协定；\n\n三）协定成员国对巴基斯坦的一切保护措施立即终止。”\n\n休会后，各成员国代表不约而同聚作一团。无论平日战略立场如何，此刻众人心思如出一辙。在例行外交辞令的掩饰下，恐惧无所遁形。\n\n“德国人这是……‘昏了头’吧？他们向来行事稳重，这次未免太反常了。”\n\n“可不是！不到一年前他们还在这个会议厅欢迎巴基斯坦加入，现在居然因为惧怕日本人的共荣圈就把巴基斯坦踢出局。”\n\n“深有同感。我在想——这对我们意味着什么？万一其他威胁接踵而至——”"
 subcontinentalcrisis.130.a: "“——我们也会被‘缺席判决’吗？”"
 subcontinentalcrisis.131.t: "查谟的陷落"
 subcontinentalcrisis.131.d: "马哈苏德列兵带着厌倦与恐惧交织的心情，凝视着开阔的地平线。他双手无力地握着毛瑟步枪，仿佛握得太紧就会走火。碉堡的混凝土厚墙让他感到相对安全，确信能抵挡轻武器攻击。但这防御没能挡住刺入后背的匕首——他的气息瞬间断绝，拜亚下士将尸体踹到一旁。他打开大门，看见更多战友正从地平线涌来。\n\n拉扎维中士试图掩饰紧张。指挥部十分钟前就该回复无线电了，他们向来准时。即使一分钟的无线电静默也令人不安。他转身正要下令撤退，一名步枪手突然倒下，头颅如花瓶般炸裂。凯拉下士透过双筒望远镜目睹了这具躯体最后沾满鲜血坠向大地的瞬间。山田军曹拉动有坂步枪的枪栓，又一名巡逻兵捂着喉咙倒下。山田催促凯拉优先选择目标。“别在战场上搞什么创意”，他说着击倒另一名列兵，这发子弹正中大腿，“看见有指挥权的人先打”。他再次拉动枪栓，瞄准镜里映出拉扎维中士惊慌的面容。\n\n加尔德齐上尉听见敌军轰炸机的轰鸣，仍坚持封锁空中管制塔。他们原本占据优势：透过硝烟能看到走廊里横陈着第一波进攻者的尸体。两个圆柱体划破黑暗，越过沙袋和办公家具。士兵们惊慌失措，加尔德齐却镇定地将他们拉开——他知道这只是烟雾弹。然而在烟雾与混乱掩护下，两枚手雷悄然滚过防线。加尔代齐和部下来不及反应，未被冲击波震晕的人都被弹片撕碎。潘迪上尉率领突击队前进，他的步枪带着胜利的咆哮，将这座孤塔最后的守卫者尽数击倒。"
 subcontinentalcrisis.131.a: "查谟各处，巴基斯坦的堤坝在南方巨浪前接连垮塌。"
 subcontinentalcrisis.140.t: "二日同落"
 subcontinentalcrisis.140.d: "或许尚未抵达，但结局已在途中——巴基斯坦乃至整个世界的终章即将降临。\n\n[PAK.GetLeader]再也支撑不住，身躯颓然跌入维多利亚式扶手椅。这非他们所愿，却终究难逃湮灭的命运。他们不过是德意志霸权的棋子与愚人。此刻他终于醒悟，然而为时已晚，除了恸哭已无能为力。\n\n曾几何时，优素福是这片土地上肆意统治的王室成员，如今却沦为机场逃难洪流中的蝼蚁。他这辈子从未听过“拒绝”二字，直到今天。金钱买不到他渴求的东西——生存——生平首次，他与航站楼里的贫民毫无二致。\n\n某个信念曾在哈姆扎心中明晰如炬，或许至今仍模糊地蛰伏在心底，正是这点星火让哈姆扎为巴基斯坦战斗至今。时间在日复一日的战场鏖战中熔解，他们为某个缥缈的目标厮杀，敌人亦然——直到与敌寇四目相对的瞬间，他才惊觉对方眼中燃烧着同样炽热的执念。\n\n土地已耕耘数周，却未给穆罕默德带来任何收获。这恰似这个国家的写照——连呼吸都需要挣扎。他曾为巴基斯坦倾尽所有，几度濒死。收音机突然沙沙作响，当收音机传来刺耳的新闻播报，他的铁锹铿然坠地，双膝重重砸向地面。\n\n在卡拉奇，一位母亲最后一次紧搂她的孩子。\n\n一分钟后，苍白的光芒将他们的身影永远定格。"
 subcontinentalcrisis.140.a: "……"
 subcontinentalcrisis.141.t: "舰队对决"
 subcontinentalcrisis.141.d: "斯里兰卡近海，日本联合舰队与德国海军激烈交火，如漂浮的钢铁兽群轰然相撞。信浓号航母机库，楠本下士倚在墙上，垂死樱树的噩梦正啃噬神经。\n\n哭喊声刺破湿热的空气，战斗机群撕裂云层。远方传来首轮齐射的闷响，舰桥中电话话筒咔嗒归位。\n\n楠本渴求黑暗。烈日之下，德国舰队上空绽放出死亡之花，所有武器一齐运转起来。护航轻巡咆哮突进，海面激起狂澜。恍惚间，身侧传来甲板舰载机加速起飞的炽热。\n\n巴伐利亚号某位水兵最后的祷词随舰体裂解戛然而止，江田岛海校同窗六人集体溺亡。条顿堡号与图勒号在火海中扭曲肢解。德军战机呼啸而过，楠本目睹飞行甲板的人群化作血雾。噩梦成真的瞬间，心脏徒劳地试图与死亡和解。信浓号沉没前，暴沸的海面漂浮着残断的樱花。\n\n十五分钟，数百人殒命。伤亡数字仍在攀升。这场海战史最宏大的交锋，或许也是终章。"
 subcontinentalcrisis.141.a: "地面之下，无数炸弹正待毁灭一切。"
 subcontinentalcrisis.142.t: "梦想家的沉眠"
 subcontinentalcrisis.142.d: "地图上勾勒的线条，士兵们的调动部署，散落在苏巴斯·钱德拉·鲍斯的桌面上。纵有无数种排列组合，却无一能让他幸免于难。\n\n印度洋的浪涛吞没着零星小岛。\n\n在理想的世界里，这一切本不该存在——他本不必存在——但神所创造的世界远非完美。命运的轨迹早已为他们划定，只是很快，每一条线都将化作褪色的记忆。\n\n烈火无差别地吞噬着草木与生灵。\n\n确有过……种种谬误，以自由印度之名作出的牺牲。先是依附西方强权，再是投靠东方势力，最终两强相争。\n\n首轮打击降临卡拉奇，百万生命瞬间湮灭。\n\n犹太难民被拒于国境之外，与希特勒的握手，那些游走在必要与邪恶之间的无数回忆。他不确定巴基斯坦是否同样如此——他们的独立是否正当——但此刻这些都已无足轻重。\n\n为寸土之争陷入僵局，终至核末日吞噬双方。\n\n窗外的景象提醒着他战斗的意义，在炫目白光吞没一切之前，他最后一次凝望这片土地。\n\n玻璃迸裂，末法之世吞没了这位梦想家。"
 subcontinentalcrisis.142.a: "又一支蜡烛熄灭了。"
 subcontinentalcrisis.1010.t: "最高指令"
 subcontinentalcrisis.1010.d: "元首[GER.GetLeader]满心欢喜地翻阅着最新战报。巴基斯坦军队已推进到距加尔各答仅数英里的地方，沿途竟未遭遇任何抵抗——或许那些“神佑德意志”的鬼话还真有点道理。正当他贪婪地幻想着整个印度匍匐在德意志铁蹄下的场景时，一名惊慌失措的官员冲了进来。\n\n“我的元首，全完了。鲍斯的部队刚刚让巴基斯坦投降了。”\n\n[GER.GetLeader]被这个消息震得目瞪口呆。“怎么……怎么可能？”他语无伦次的样子，仿佛现实在他面前像树枝般咔嚓折断。\n\n“根据前线汇报，巴基斯坦全军就像凭空消失了一样。士兵、枪械、甚至连车辆都……”\n\n官员的话被元首突然顿悟的表情打断了。“那个混蛋……希特勒早就警告过我，说他单枪匹马把英国人赶出印度根本不合常理……现在一切都说得通了。”看着官员茫然的表情，元首咬牙切齿道：“控制台指令！四十年代他就用过这招，现在狗急跳墙又故技重施。肯定是用删除指令把整个……”\n\n“元首阁下，您吓到我了……”官员暗自心惊于元首对“控制台指令”的熟悉程度，刚冒出大不敬的猜测就赶紧掐灭了念头。\n\n“哈，鼠目寸光的蠢货当然看不懂这般战术神迹。滚出去。我要重新部署……”看着元首陷入癫狂的自言自语，官员退下时脑海中挥之不去一个念头。"
 subcontinentalcrisis.1010.a: "那个鲍斯还真是铁石心肠……"