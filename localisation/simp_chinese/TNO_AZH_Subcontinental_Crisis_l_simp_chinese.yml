 GER_Subcontinental_Crisis_buildup_desc: "我们的亚洲盟友巴基斯坦正面临新的威胁——印度上台了一个极端伪布尔什维克政府，他们企图摧毁巴基斯坦的自卫能力，妄图再次吞并巴基斯坦。日本当局对此番侵略行径公然支持，其狼子野心昭然若揭。我们必须立即采取行动捍卫盟友的主权，否则德国多年的努力将付诸东流。"
 JAP_Subcontinental_Crisis_buildup_desc: "While the American puppet state in India has been cast down and destroyed by our Hindustani friends, Germany's puppet state in India is alive and well - but if we have our way, it will be neither, soon enough. Should \"Pakistan\" continue to exist, it will open up all of Asia to German intervention. We must give full backing to our Hindustani allies and force Germany to abandon the idea of a Pakt member state in Asia - by hook or by crook."
 AZH_Subcontinental_Crisis_confrontation_desc: "占位符"
 PAK_Subcontinental_Crisis_confrontation_desc: "占位符"
 GER_Subcontinental_Crisis_confrontation_desc: "我们的亚洲盟友巴基斯坦正面临新的威胁——印度上台了一个极端伪布尔什维克政府，他们企图摧毁巴基斯坦的自卫能力，妄图再次吞并巴基斯坦。日本当局对此番侵略行径公然支持，其狼子野心昭然若揭。我们必须立即采取行动捍卫盟友的主权，否则德国多年的努力将付诸东流。"
 JAP_Subcontinental_Crisis_confrontation_desc: "当美国的印度傀儡政权被我们的印度斯坦朋友们推翻并摧毁时，德国的傀儡政权却依然苟存——但很快，它也将不复存在。倘若“巴基斯坦”继续存在，整个亚洲都将向德国势力敞开大门。我们必须全力支持印度斯坦盟友，不择手段迫使德国放弃在亚洲建立“团结协定”成员国的企图。"
