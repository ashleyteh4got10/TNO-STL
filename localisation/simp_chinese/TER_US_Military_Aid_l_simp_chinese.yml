  #故事事件
TER_MOD_CPC.1.t: "飞虎队重生"
TER_MOD_CPC.1.d: "夕阳为梁山机场的跑道镀上一层血色。一架架F-100“超级佩刀”战斗机呼啸着降落，机翼在暮色中划出银灰色的残影。当徐廷泽看清机身侧面那只振翅欲飞的老虎标志时，喉结不自觉地滚动了一下——飞虎队的战鹰终于重返故土。\n\n战靴踏上机场跑道的那一刻，沥青粗糙的触感让这位归国飞行员微微踉跄。白市驿机场最后的混乱画面突然刺进脑海：1945年那个暴雨夜，数万把油纸伞在探照灯下翻涌成黑色海洋，咆哮着挥舞着枪托的美军宪兵，母亲将婴儿塞进机舱的哭喊声被引擎轰鸣吞没……同胞们的指甲C-47运输机舱门上刮出的一道道血痕，至今仍在太平洋对岸的噩梦里蜿蜒。\n\n而在大洋彼岸的飞行学校，美国教官用教鞭敲打他操作杆的闷响，比圣安东尼奥的烈日更灼人。克扣伙食费的学员领队的无耻嘴脸，比冬夜里灌进机舱的刺骨寒风更令人寒心。\n\n机场广播突然播放起《黄河大合唱》，铜管乐穿透云层的刹那，徐廷泽摸到了口袋里那封泛黄的家书。濯水古镇的祖宅或许早已毁于战火，但此刻他更想亲眼看看——看看到底是什么样的信仰，支撑着这些\"泥腿子\"用土制步枪，拖住了日寇的战车师团。"
TER_MOD_CPC.1.o: "飞虎队，重生！"

TER_MOD_CPC.2.t: "新玩具"
TER_MOD_CPC.2.d: "威廉姆斯上校解开军绿色帆布包，小心翼翼地取出一个金属长筒，放在粗糙的木桌上。\n\n“赵，这个或许能改变你们的防空困境。”他用生硬的中文说道，手指敲了敲筒身上的英文标识——XFIM-43\"RED EYE\"。\n\n赵振华眯起眼睛，伸手抚过冰凉的金属表面：“上校，这东西能打什么？”\n\n“喷气机。”美国人咧嘴一笑，“当然，还有那些烦人的直升机——你们以前应该没少吃它们的苦头。”\n\n“射程？”赵振华单刀直入。\n\n“三千米，红外制导，锁定目标后自动追踪，比你们用肉眼瞄高射炮靠谱多了。”威廉姆斯掏出一沓照片，上面是沙漠里腾起的火球，“试验场数据，击落概率六成——当然，前提是你们的人能扛着它在战壕里跑。”\n\n外面突然传来防空警报的尖啸。两人同时沉默，直到远处传来沉闷的爆炸声。赵振华盯着桌上那个泛着冷光的武器，忽然笑了：“上校，你知道我们最擅长什么吗？”\n\n没等对方回答，他抓起“红眼”扛在肩上，动作利落得仿佛已经演练过千百次。\n\n“把洋玩意，”他拍了拍发射筒，“变成人民的铁拳。”\n\n"
TER_MOD_CPC.2.o: "狩猎愉快"

TER_MOD_CPC.3.t: "怪形"
TER_MOD_CPC.3.d: "会议室里弥漫着咖啡和香烟的气味，投影仪的光束在帆布上投出M50\"盎图斯\"自行反坦克炮的幻灯片。美国军事顾问威廉姆斯上校叼着雪茄，用教鞭敲了敲炮塔的轮廓，语气里带着推销员式的热情：\n\n“先生们，这才是你们需要的‘战场开罐器’！六门106毫米无后坐力炮，火力密度堪比一个炮兵连，公路机动性优秀，能轻松猎杀任何日本装甲目标。”\n\n赵振华眯起眼睛，指尖轻轻敲击桌面。幻灯片上的“盎图斯”确实威风凛凛，但那单薄的车身装甲和开放式炮位让他皱起了眉头，眼前这个活像把六根火箭筒焊在拖拉机上的玩意儿，靠谱吗？\n\n“上校，它的防护如何？”\n\n威廉姆斯笑容僵了一瞬：“呃……强调机动性和火力投射，牺牲部分装甲是必要的，更何况106毫米无后坐力炮的破甲弹可以轻易地击穿日本现在最先进的二三式战车的前装甲，贵军完全可以靠战术机动——”\n\n“也就是说，只要一发榴弹在附近爆炸，就能把所有乘员打成筛子。”赵振华打断道。他翻开笔记本，推过几张照片：几辆被击毁的五式战车残骸旁，上面堆积着加固的沙包，有些还安装了附加装甲。“况且，高宗武的走狗们已经开始给老式战车焊钢板了。”\n\n帐篷里安静下来。投影仪嗡嗡作响，光柱里浮动的尘埃像被冻结的雪花。\n\n“我们需要的是跟日军坦克正面对抗，兼具火力、防护和机动的战车，而不是……”赵振华瞥了眼幻灯片，“一台会移动的礼花发射架。”\n\n威廉姆斯的脸涨成了猪肝色。当解放军代表团起身离开时，他听见有人用中文嘀咕：“当我们这里是废品收购站吗……”\n\n"
TER_MOD_CPC.3.o: "但我们又有什么选择呢？"

TER_MOD_Zombie.1.t: "意外的帮助"
TER_MOD_Zombie.1.d: "就在不久前，东京的电视台还在吹嘘帝国科学家在南极冰层中发现的“神赐微生物”，声称它将实现微生物学科的“繁荣与发展”——直到长崎港的货轮卸下第一批“改良麦种”三天后，整个九州岛的通讯彻底中断。\n\n“所以……‘皇道乐土’上现在满地都是啃人的疯子了？”老李用刺刀挑开一张破旧的传单，在那上面，笑容灿烂的农夫正给稻田喷洒所谓“天照大神の恩恵”。\n\n“更正一下。”那个洋人给他的自动步枪插上桃木做成的“刺刀”，“是能徒手撕开坦克装甲的疯子。”\n\n忽然，阵地前方里传来三长两短的哨声。众人瞬间熄灭火把，夜视镜里浮现出令人窒息的场景：一群衣衫褴褛的丧尸们正在一个挂着将官刀的变异体的领导下，嗷嗷叫着扑了上来。\n\n“全体注意！尽量瞄准它们的脑袋！如果打不着脑袋，就打断它们的腿！”\n\n战斗持续到破晓时，平原上已经躺满了脑袋开花的尸骸，那些被打断了腿脚，还在苟延残喘的，正被战士们用刺刀一一扎穿脑袋。\n\n老李看着那些正在收集丧尸脑脊液的奇怪洋人，忍不住嘀咕：“你们这什么‘疯帽商’……咋对鬼子这么门儿清？”"
TER_MOD_Zombie.1.o: "我们控制，我们收容，但我们不一定保护……"