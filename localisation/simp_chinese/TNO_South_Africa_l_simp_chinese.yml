 HDV_SAF.215.a: "And with a heavy heart, Div closed the door behind him."
 HDV_SAF.216.t: "Prime Minister Eglin"
 HDV_SAF.216.desc: "The studio had been seen many times before by countless viewers, but for the first time, someone else sat in that chair behind the desk, speaking directly to the South African people. The former Minister of Defence appeared in good spirits, his expression bright with optimism.\n\n\"Fellow South Africans,\" he began.\n\n\"Our nation has faced its greatest test - and we have prevailed. The defence of South Africa was a tremendous ordeal, a defining struggle over what kind of nation we were to be: one built upon freedom and openness, or one closed to the world, ruled by the iron fist of tyranny that sought to restore bondage to these lands. But the tide turned, and the Cape stands firm as never before.\"\n\n\"We were not prepared for war, just as we were not prepared for the future; too focused on preserving what we had, and not enough on what we could become. A nation must always look forward: to its next steps, its next achievements, and above all, its people. Every citizen of this nation deserves dignity and respect, no matter their origin. Any nation that abandons its downtrodden will, in time, see them rise against it. We can no longer afford to leave anyone behind, for the price of poverty is too high a cost for any society to bear.\"\n\n\"With our formal entry into the Organization of Free Nations, South Africa now stands in fellowship with the West, committed to the principles of liberty, open markets, and cooperation with the world. Restrictions upon our economy can only stifle its growth; it falls to us, all of us together, to seize this new day. The dark shadows have passed, and now we look toward a brighter tomorrow - one founded on fairness, opportunity, and respect for all.\""
 HDV_SAF.216.a: "The Torch Commando’s journey is complete."
 HDV_SAF.217.t: "A Letter From Div"
 HDV_SAF.217.desc: "Congratulations on forming your coalition with the Progressive Party. I wish you the best of luck in guiding the United Party into a new era. While we are now safe from German domination through conquest, being under the influence of the Americans is hardly better if we do not firmly defend our own national interests.\n\nOver your tenure as Minister of Defence, I have observed not only a tendency toward progressivism but also a sustained interest in advancing American influence in South Africa. While cooperation with Washington will be crucial for our future, it remains your responsibility to ensure that South Africa does not become merely an economic puppet of the Americans.\n\nWe should occupy a position of equal importance within the OFN, and I hope you can strike a careful balance that preserves our economic independence. Trade ties with the rest of the OFN and with South America should be actively promoted to create alternatives and reduce American leverage. The United States is now our friend, security partner, and ally, but it must never become our overlord, a danger that could arise if vigilance is neglected. I wish you and your progressive allies every success in leading the nation."
 HDV_SAF.217.a: "£SAF_div_signature"
 HDV_SAF.218.t: "The Moment of Truth"
 HDV_SAF.218.desc: "The clock slowly ticked up to the full hour. Eight o'clock in the evening seemed so close and yet so far. For the first time in modern history, the dominant party system that had continued the United Party’s complete grip on power in South Africa since 1934 seemed to be cracking. It's conservative wing had split off to form a new party, while on the left, the Progressives were surging, making it seem inevitable that the United Party would be toppled from the throne it had occupied for decades.\n\nIn three different places in Cape Town, the three different parties gathered to see who would win. The Conservative splitters under Vause Raw, the United Party still led by Sir De Villiers Graaff and the Progressive Party under Harry Schwartz were waiting for the full hour when the truth would be revealed about the heavily contested election.\n\nWhen that time finally came; the nation all turned to their TV’s, the lesser fortunate in community TV halls, and those below by radio to listen to the news announcer’s finely accented upper class English.\n\n\"The S.A.B.C. exit poll for the elections of [?global.date.GetDateStringNoHourLong] are in. Taken across the land in key constituencies that will decide the fate of our nation for the next five years, this exit poll points at one clear winner, and that is..."
 HDV_SAF.218.a: "The United Party!"
 HDV_SAF.219.t: "De Graaff Forever"
 HDV_SAF.219.desc: "In one moment, all doubts were swept aside. The king of the house, the perpetual Prime Minister, the 2nd Baronet, walked onto the stage with a big smile on his face, all the years of stress and worry suddenly falling away as the United Party had swept out the progressive upstarts and the conservative splitters. The chorus of clicking photographers and the swivel of TV cameras put Div once again in the spotlight, as he waved with both arms in excitement, with the United Party attendees going wild. South Africa’s future was secured once again, still in the arms of Sir De Villiers Graaff.\n\nIn his finest beige outfit, orange, white, and blue on his tie, and his hair combed to perfection, Graaff walked up to the microphone in the middle of the stage. \"Fellow South Africans.\"\n\n\"There is no greater honour in life than to serve your nation. I have never shied away from standing up for South Africa, and when I was a young man, it drove me to join our fine Union Defence Forces, which took me across Africa in defence of the cause of our Allies. The defeat pushed our fine nation astray, into a kind of neutrality that ended up leading to naught but weakness as the Germans finally moved on their long-held plans to conquer our Springbok\n\nBut once again, the famillial ties that bind us to our natural allies in the Organization of Free Nations were far stronger than the enemy expected, and the Cape stood firm, defended by valiant men from across the globe. In this, the United Party stood firm in organizing the nation during this war, as it had done all those years before. I knew the United Party would overcome its recent struggles as it always has, and I knew that once again I would have the privilege of serving as your Prime Minister for another five years. I promise to you, all of you loyal and true South Africans, that not only shall the scars of this horrendous war be healed, but South Africa shall reach heights previously unthinkable. Thank you all, and God bless you all.\""
 HDV_SAF.219.a: "Same as it ever was, same as it ever was."
 HDV_SAF.220.t: "A Dream Deferred"
 HDV_SAF.220.desc: "How does a man react when the totality of his life’s work, the thing he has worked for, strived towards, and leapt at, tooth and nail, is finished by someone else? Jacobus Strauss feels this bitter taste in his mouth, as he thinks that perhaps all men’s work is ultimately finished by someone else.\n\nStrauss hears muffled yells and revelry from across the walls of the building. The news of the party’s victory in the face of its opponents seems to make many loosen their collars for a moment, openly celebrating. He wonders if he should also be celebrating. Ultimately, the victory for De Villiers Graaff is a victory for him and his party, was it not?\n\nIt was an overstatement to say it hurt; if it were that sharp a pain, it would have caused him to resign years ago. It’s like this dull ache has weighed down his spirits ever since being appointed to this position, and he hoped that maybe- if Graaff faltered where he had held the line, then there would be another chance for him. That they would see that he had done everything for a reason.\n\nGraaff had toed the line, though; he’d made the compromises he had to, kept the United Party in power despite everything the world had to throw at him. He wasn’t going to be stopped by some old-timer who desperately clung to the idea that he could take back what he’d lost.\n\nStrauss stands up, the lines of the papers blurring slightly. He’s too tired for this, too tired to keep playing diplomat when he only wanted to focus on the nation itself. His feet feel harder to move than they used to, his bones a little heavier, and his movements a little shakier. How many more times can he go through this? Does he even have another left in him?\n\nHe let out a deep sigh and pulled on his coat."
 HDV_SAF.220.a: "He supposed no one would blame him for taking an early night."
 HDV_SAF.221.t: "A Modest Advancement"
 HDV_SAF.221.desc: "The atmosphere within the Progressive Party headquarters was disturbingly tense, accompanied by an eerie silence that permeated the room, only broken by the analog clock, which loudly announced the passage of each second. Inside, party leader Harry Schwartz and his closest allies sat in an agglomeration of leather chairs, twiddling their thumbs at the single television in front of them.\n\nWhen the words were finally spoken out loud, there was a brief silence in the air, followed by quiet conversation. The Progressive Party had made modest gains, but in the end, it wasn’t enough to move the needle as the United Party would remain in power, even after the conservatives had split off. Harry Schwartz shook his head, thinking himself a bit of a fool for thinking that things would change. As things stood, the progressives would remain on the sidelines, unable to exert significant influence in South Africa. And yet, the more he thought about it, the more positive he felt about the outcome. The United Party had been pushed somewhat to the left, with it's conservative wing now properly in tatters since splitting off. Colin Elgin was a good man and had stuck with the moderates throughout this election, which left him remaining in the centre of power and influence.\n\nWhile the UP‘s moderates would still dominate, the left wing of the UP would be given more operating room, and that is where he could come in after all. He would spend the rest of the evening trying to cheer people up, managing to build up a modest party atmosphere after all."
 HDV_SAF.221.a: "A small step forward, but a step forward nonetheless."
 HDV_SAF.222.t: "A Disappointing Result"
 HDV_SAF.222.desc: "The crowds at the NCP rally thinned somewhat after the results kept rolling in. The people who left first, fairweather friends of Vause Raw and his conservative movement, yet at the same time there appeared to be still a fight left in the crowd with Bernard Montgomery sticking around telling glorious stories about his work in leading the defense of South Africa.\n\nThe heavyset party leader adjusted his glasses, looking at all the people coming and going, and decided to scramble over to a nearby buffet table to grab something to eat for himself, silently frustrated about the below mediocre performance. Had he truly misread his moment, should have have done more campaigning in rural areas? He was sure that the threat of the ANC rabblerousers beginning their nefarious work once again would be enough to scare people into voting NCP, but no, even after close to ten years of De Villiers Graaff...they voted for him again!\n\n\Tonight, he would wallow in his failure, hold a humiliating speech accepting the defeat, and head home right after. But tomorrow, tomorrow, he would get up and get to work. There was no doubt in his mind, Graaff’s due date would come, and the NCP would be there to pick up the pieces when he fell."
 HDV_SAF.222.a: "The party had missed its chance, but there would be another day."
 HDV_SAF.223.t: "Hofmeyr Retires"
 HDV_SAF.223.desc: "For decades, regarded within South African political circles as one of the most capable men in the halls of government, Deputy Prime Minister and Minister of Education Jan Hendrik Hofmeyr has announced his retirement from political life. While this comes as a surprise to much of the public, it's an open secret to those with the right connections that Hofmeyr's health has been in decline for some time. Renowned as a thorough and brilliant administrator, his retirement has naturally been carefully prepared for and planned over the course of months, ensuring a smooth transition, and now the time has finally come to pass. \n\nAdored by the liberal stalwarts that have always formed the core of his support, even Hofmeyr's political opponents, who certainly did not love his inflexibility, must admit a grudging admiration for his adherence to his principles. Even among his fellow Afrikaners, few of whom share his liberal sentiments, there is a sort of quiet respect for his administrative and educational achievements.\n\nMany worry that the end of his political career, inevitable though it is, will result in greater difficulty for the United Party, particularly when it comes to the development of effective policies and the rallying of its base to support its agenda. Despite his concerns, and after a long and distinguished career in public service, Hofmeyr now steps aside to make way for a new generation of United Party leadership. He entrusts them with the task of building upon his legacy, hoping they will use it as a foundation to forge a more liberal and progressive future for South Africa. Only time will tell whether that hope proves well placed."
 HDV_SAF.223.a: "The end of a lion of liberalism."
 HDV_SAF.224.t: "Back to Work"
 HDV_SAF.224.desc: "Graaff opened the doors to his office with a quiet smile. He had once doubted that he would ever make it this far, especially after the chaos and hell of the South African War, yet here he was again. De Villiers Graaff, Prime Minister of South Africa, for another five years. As he stepped toward his desk, piled high with papers as always, a look of satisfaction spread across his face. How could he ever have doubted himself, or the well-oiled political machine that supported him? The United Party, in one form or another, had governed the nation since 1934, and it would continue to do so. No Boer uprising, no German war, and no conservative splitters had managed to stop him, and none ever would.\n\nHe turned to the window behind his desk, which offered a clear view of Table Mountain, glowing in the light of the setting sun. The Prime Minister’s smile deepened, filled with quiet pride. This country, his country, with its sweeping landscapes and natural beauty, still stood as a beacon of liberty in the Dark Continent. The proud spirit of the British Empire remained alive here, unbroken. South Africa had reclaimed its rightful place beside the Allies, where it had always belonged. In truth, neutrality had only been a delay of the inevitable German assault.\n\nOutside, Cape Town glimmered in the orange light of dusk. People went about their evening as if the war were already a distant memory, something for historians to study. Graaff wondered how history would remember him and his party. Surely it would be with respect. The pages of South African history would, he thought, speak of him as a legend, perhaps even an equal to Jan van Riebeeck.\n\nBut his work was not finished. His story was still unfolding, and the nation had once again called upon him to guide it toward a brighter future. That was his task, his calling, and his home.\n\n\"South Africa forever.\""
 HDV_SAF.224.a: "He sat down at his desk and got back to work."
 SAF_politics_change_tt: "§YOur politics will change!§!"
 SAF_buy_american_armor_big: "Purchase a Large Shipment of American Armor"
 SAF_buy_american_armor_big_desc: ""
 SAF.189.t: "Lost in the Lights"
 SAF.189.desc: "There are a few keys to diplomacy: pleasantries, conversations, exchanges of gifts, and, of course, tours. Jacobus Strauss was an Afrikaner, born on the Veld, who grew up in the grain fields helping his family with harvests. Far from that simple life, he now found himself in the middle of a dazzling room of computers and scientists, following along an enthusiastic guide who was showing him not just the advanced computers of today, but who was also dreaming bigger, talking about the future opportunities nationwide computerization offered.\n\nIt struck him that Philips was a very prideful man, eager to show off the achievements of his company in this newly built city. It was hard to argue against his accomplishments, but he could perhaps do with less time proclaiming about them.\n\nThe tour took them to another room filled with computer terminals and people working at them. \"And this here is PASCAL, the fastest computer in all of South America, capable of two hundred thousand floating point operations per second. And that is merely the current generation; we are working on a concept that can reach up to five hundred thousand. Imagine what could be possible then, not to mention further miniaturization through extensive utilization and integrated circuits, as well as interconnectivity between different mainframes!\"\n\nHis host shone brightly while Strauss merely nodded and followed along. Now, at last, his patience with the tour had run thin, and he spoke up. He knew nothing about computers; what he did know was that he needed to get this man to invest in South Africa, so it could have such a shining city of its own."
 SAF.189.a: "\"Let’s talk business, Mr. Philips\""
 SAF.190.t: "A Matter of Principle"
 SAF.190.desc: "The press conference in Pretoria was the first held in months without the shadow of war looming over it. The air was still thick with a weary relief, the scent of victory mingling with the memory of its staggering cost. Div approached the podium to a hushed silence, his face resolute. After a few routine questions, a hand shot up.\n\nAn eager young American journalist stood up and asked Div a question. \"Prime Minister,\" he asked, his voice clear, \"given the divisive referendum your government held before the war and the sentiment of many Afrikaners, will your government now abolish the monarchy, respecting the people’s choice?\" The question was a direct challenge to the room's fragile unity. Div leaned into the microphone, his eyes like cold steel. His answer would not be that of a monarchist, but of a victor salting the earth of a vanquished foe.\n\n\"Absolutely not,\" he stated, his voice flat and hard. \"The republican cause was the central ideological banner of the traitors in the National Party. The same traitors who collaborated with the Boer Resistance as they took up arms against the legitimate government, and plunged this nation into war. We will not honour the wishes of defeated rebels. We will not spit on the graves of our soldiers by giving their enemies a posthumous victory. This is a matter of national principle.\"\n\nA stunned silence followed, the raw political brutality of the statement leaving the reporters speechless. The American recovered quickly enough for a follow-up. \"Then, for clarity, Minister, who is the monarch of South Africa?\" A thin, cold smile crossed Div's lips, the look of a man checkmating an opponent. \"Her Majesty, Queen Elizabeth the Second,\" he answered with absolute finality. \"And you can be assured, we are already preparing a coronation ceremony for her majesty in Pretoria, one worthy of the great and unified nation that she now reigns over.\""
 SAF.190.a: "God Save the Queen."
 HDV_SAF.135.t: "REPORT ON CAMEROON"
 HDV_SAF.135.desc: "The implicit threat of the CAMEROON AFRICAN STATE remains contained for now by the WEST AFRICAN STATES, chiefly the remnants of FREE FRANCE centered around the region of the Ivory Coast on one side. On the other end is REICHSKOMMISARIAT ZENTRALAFRIKA, which fought an open conflict with the C.A.R. in the mid-50s that ended up in a stalemate that favoured the pan-africans, which further founded the legend of PAN AFRICANISM.\n\nThe CAMEROON AFRICAN STATE’s capital is in Doala, where the state is gathering strength for future conflicts to spread its PAN AFRICAN IDEOLOGY by force. While the state formerly was isolated and weak, it has received support from THE EMPIRE OF JAPAN as a counterweight to both GERMAN and AMERICAN interests in West Africa. This is a MARRIAGE OF CONVENIENCE, with the C.A.R.’s socialist ideology being abhorred by the Japanese. Shortwave propaganda broadcasts from DOALA make it abundantly clear that in the long term, the C.A.R. intends to seek the total and full DESTRUCTION OF SOUTH AFRICA. It is key that additional support be sent to FREE FRANCE to ensure the continued containment of pan-Africanism. \n\n\n\nFOR SOUTH AFRICA’S SECURITY."
 HDV_SAF.135.a: "The Reds lay in wait in the north…"
 HDV_SAF.136.t: "REPORTS ON THE CRACKS IN OSTAFRIKA"
 HDV_SAF.136.desc: "REICHSKOMISARIAT OSTAFRIKA is perhaps the most fanatically led our enemies; and also the most poorly run. A butcher state, ran by HANS HUTTIG, an absolute fanatic with deep SS connections sent to fix a PATCHWORK STATE of stolen colonies belonging to Britain and Portugal originally. The only solution Huttig has to any issue is excessive violence, if not direct genocide which keeps different collaborator groups in line to oversee regions of Ostafrika in line.\n\nThis colony was intended for GERMAN SETTLEMENT, but only the totally insane would dare to make a place that is in a constant state of internal warfare their home. The Native populations have nothing to lose in the face of close to GENOCIDAL INTENT coming from Bouhlerstadt which will only be a valuable asset in further staying apart the pieces of OSTAFRIKA.\n\nThe collaborator groups come in two kinds;  ENGLISHMEN and PORTUGUESE, of which the former has strong sympathies for South Africa and the latter can easily be persuaded by preservation of their economic and political privileges to ensure CONTINUED CONTROL over these regions. Extensive contacts with both groups have been made already and both of them await liberation.\n\nWhile there should be some MILITARY SUPPORT sent to the Native groups fighting OSTAFRIKA from within, these groups hold no sympathies for us and will immediately turn against us once the conflict has ended. Priority should be given to covert support for the local collaborator groups to help push them away from Bouhlerstadt and keep the Natives in line\n\n\n\nFOR SOUTH AFRICA’S SECURITY."
 HDV_SAF.136.a: "All we need to do is kick in the door and the whole rotten structure will fall…"
 HDV_SAF.137.t: "The Fall of Bouhlerstadt"
 HDV_SAF.137.desc: "The delusion of making Africa a second homeland for the Germans has finally ended as the city of Bouhlerstadt, the dark heart of Ostafrika, has fallen. Despite fanatical, if not suicidal, resistance from the Afrikaner SS, the fight for the city has fallen, while combat on the outskirts of the city continues on.\n\nThe city, newly constructed as a perfect representation of aryan supremacy, now lies in ruins with heavy fighting and even suicidal attacks, with buildings being blown to delay the Union Defence Forces’ relentless push onwards. The elaborate structures drawn up in hideously overblown Germanic style that line the streets emblazoned with swastika’s are being roughly treated by the UDF with even controlled demolitions of non strategic buildings being ordered to seal the fate of his abominable city.\n\nPrime Minister De Villiers Graaff has proclaimed the fall of Bouhlerstadt as a great victory for South Africa and its OFN allies, telling the nation via a TV broadcast about the plans to completely dismantle the German holdings in Africa, one by one.\n\nThere is no clear information on the location of Hans Huttig and the other key figures running the Ostafrikan state; but it is assumed that they have retreated to the city of Dar Es Salaam because German resistance continues."
 HDV_SAF.137.a: "Tear down these walls!"
 HDV_SAF.138.t: "For the Union"
 HDV_SAF.138.desc: "The bottle of De Grendel wine was cracked open as Div looked over the latest reports on the collapse of the so-called Afrikaner Volksstaat and thus the full restoration of the Union of South Africa. Div took great pride in the red wine freshly delivered from his own vineyard located not too far north of Cape Town as he enjoyed a moment of victory in this great struggle.\n\nYet his mood soon soured as he read another piece of paper by BOSS; the recommendation for immediate imprisonment and punishing for prominent Afrikaners who collaborated with the OBW’s slapdash Volksstaat and the coup against South Africa. While no man would ever doubt Div’s loyalty to the Union, his sympathies for his people, the Afrikaners, were most certainly there. The Union of Afrikaner and Anglo people would be upheld, and he pulled out his pen to start striking through the names listed there who merely collaborated.\n\nThe heinous extremists of the Ossewabrandwag would all be severely punished, if not locked up for life…if they were going to be taken prisoner at all. Mistakes could happen, after all. But the others, the good, normal, hardworking Afrikaners that founded this country and helped it prosper, their names would be stricken from their list, and they would be kept in place.\n\nThe Union would not just survive militarily, but as a concept in people's minds as well, where heavy punishments for collaborators would only ever backfire and widen the divide between them. Already the tide had turned against the plotters in the OBW and the National Party, and what now remained was to push back the German colonies. The Union would hold, now that much was certain."
 HDV_SAF.138.a: "He shall do what he could to defend it."
 HDV_SAF.139.t: "The Capture of Windhoek"
 HDV_SAF.139.desc: "The capital of Germany’s African airstrip has fallen. Despite insistent resistance on the ground and pressure from the air by the Sudwestafrikan air force the city and its key air facilities was captured relatively intact, de facto breaking German resistance in Namibia by heavily disrupting its logistics and seizing its capital city, a place of heavy German settlement that totally displaced the original inhabitants of the region.\n\nPrime Minister De VIlliers Graaff of the Union of South Africa has proclaimed it as a great victory that will end up being the undoing of the German grip on Africa’s southeast and that the South African Air Force and other allied aircraft would soon be taking off from the major airbase outside Windhoek. At the same time he promised good treatment and a light hand for the German civilians which now found themselves under South African occupation, vowing to protect their property as well as could be done in a chaotic war situation.\n\nFurthermore he stated that any Germans would be free to remain in Namibia after the war’s end, and that they could further expect a path towards South African citizenship for those who would not prefer to return to Germania upon the end of war and the return of peacetime.\n\nThere have been no reports of the capture of key leaders of RK Sudwest so it can be safely assumed that they have evacuated by air towards the city of Luanda, thousands of kilometers to the north. Only time will tell if the battle lines push northward to threaten that city as well."
 HDV_SAF.139.a: "We have it, now let’s use it!"
 HDV_SAF.140.t: "The Fall of Durban"
 HDV_SAF.140.desc: "The City of Durban, the great heart of Natal, has fallen. Despite heavy resistance by Anglo loyalists who have always called the city home, the combination of Afrikaner Volkstaat militia and Ostafrikan SS troops has successfully taken the city of Natal after several days of heavy fighting.\n\nThe roads leaving towards the west are clogged with refugees as many fear retribution or at least heavy oppression by the fanatics that now dominate the city, which the locals often call Durb, as further resistance within the province of Natal seems to be crumbling quickly. The new commissioner of Durban installed by the OBW, Jaap Marais,, has already vowed to purge the city of its Jewish and cosmopolitan tendencies and instituted strict segregational policies as well as a tight evening clock.\n\nIn a speech broadcasted over the radio Reichskommisar Hans Huttig of Ostafrika has spoken of Natals importance to the Anglos of South Africa and how it will now become a city just for the Aryans and Afrikaners, at the same time vowing to destroy the Union of South Africa by his forces launch a final drive towards Cape Town and sealing its fate forever.\n\nPrime Minister De Villiers Graaff was not currently available for comment."
 HDV_SAF.140.a: "The heart of the Anglos in Natal, ripped out"
 HDV_SAF.141.t: "Our Next Steps"
 HDV_SAF.141.desc: "\"Prime Minister.\" Bernard Montgomery gave the man who entered his commander's tent outside of Bouhlerstadt. \"Welcome to Bouhlerstadt, or as it’s called now, the city of Montgomery.\" The smile on his face was unshakable. \"Here to see the hideous German architecture for yourself, I see.\"\n\nDiv ignored the comment and pushed on with the conversation. \"Partially so, but mainly I am here to address the troops and keep up morale; the war is far from over.\"\n\n\"Good, very good.\" The older man. \"While you are here, I thought it worthwhile to discuss my next plans to finally chase the Germans from Africa for good.\" He motioned towards a nearby grand map of eastern Africa laid out on the table, using a pointer to aim directly at the Comoros Islands, located right between Madagascar and Dar Es Salaam. \"We should push our naval advantage gained by seizing the capital of Ostafrika by not just applying further pressure northwards, but by organizing a tightly planned invasion of the Comoros islands here. According to our intelligence, the Comoros Islands serve as a minor naval base for the enemy, with most of its remaining naval facilities being in Dar es Salaam.\n\nIf you look at the location of the Comoros, it can not just serve as a key place to launch naval operations against the enemy, but also serve as a key place for South Africa to project power into Eastern Africa after the war. For those reasons, we must prepare a grand invasion, coordinated with both naval and air pressure to achieve victory and seize these islands as soon as possible.\" \n\nDiv looked at the distance from Bouhlerstadt to the Comoros and realized that there would be little chance to achieve any kind of surprise. A naval invasion of this size, this far away? He had his doubts…not least of all because South Africa had no experience with naval invasions. \"And how are we going to actually achieve that, Bernard?\" "
 HDV_SAF.141.a: "\"All that is required is a plan, and a will to follow it.\""
 HDV_SAF.142.t: "A Slice Of The Pie"
 HDV_SAF.142.desc: "Ostensibly, this was to be a routine meeting for establishing the Arms Corporation of South Africa, or ARMSCOR. Yet, the significance of this organization and its far-reaching implications quickly drew a remarkable turnout from South Africa’s elite, the wealthiest and most influential figures, at the Yungsfeld military base in Cape Town. As Eglin surveyed the gathered industrialists, he wondered how many were motivated by the prospect of profiting from South Africa’s expanded military budget, and how many were genuine patriots hoping to support the Cape’s defense in their own way.\n\n\"Gentlemen.\" The huddled talks came to a halt. \"Let us get straight to business. The facts are clear to everyone here; this war is existential in nature, and our enemies are seeking to destroy our nation altogether. While our allies from across the world are sending support, South Africa will need to quickly begin domestic production for everything and anything that the army needs.\n\nARMSCOR will serve as a definitive connection between industry, the military, the government, and private financing to establish a proper military industrial complex on South African soil. The government’s intent is not to merely do this for the duration of the war, but as a turning point in longer-term development of an MIC that can provide not just for our domestic needs, but facilitate weapons exports as well.\"\n\nHarry Oppenheimer, the richest man in South Africa (and thus the one with most to lose, as well) sat on the front row and spoke up. \"That is fine and all, but the government should realize that in the shorter term, our capacity to turn our facilities to war production is limited, and we will need support with that, as well as the lost revenue from lost materials exports, hitting several of us rather harshly in this time of chaos. More than half of my mines are located within enemy territory, and it will  not be easy to facilitate all of this.\"\n\nColin answered resolutely. \"Whatever support you need, you’ll have it; whatever rules need to be scrapped, they will get done. Nothing will stand in the way of South Africa’s defense. Use every resource at your disposal, because if the enemy prevails...\" "
 HDV_SAF.142.a: "There will be nothing of us left"
 HDV_SAF.225.t: "The Moment of Truth"
 HDV_SAF.225.desc: "The clock slowly ticked up to the full hour. Eight o'clock in the evening seemed so close and yet so far. For the first time in modern history, the dominant party system that had continued the United Party’s complete grip on power in South Africa since 1934 seemed to be cracking. Its conservative wing had split off to form its own party, while on the left, the Progressive Party seemed booming, seemingly making it an inevitability that the United Party would be knocked from the throne it had sat on for decades.\n\nIn three different places in Cape Town, the three different parties gathered to see who would win. The Conservative splitters under Vause Raw, the United Party still led by Sir De Villiers Graaff and the Progressive Party under Harry Schwartz were waiting for the full hour when the truth would be revealed about the heavily contested election.\n\nWhen that time finally came; the nation all turned to their TV’s, the lesser fortunate in community TV halls, and those below by radio to listen to the news announcer’s finely accented upper class English.\n\n\"The S.A.B.C. exit poll for the elections of [?global.date.GetDateStringNoHourLong] are in. Taken across the land in key constituencies that will decide the fate of our nation for the next five years, this exit poll indicates that due to a surge in support for the New Conservative Party..."
 HDV_SAF.225.a: "The United Party has lost its majority."
 HDV_SAF.226.t: "A Victory for Decency"
 HDV_SAF.226.desc: "Cheers and celebrations erupted as the results continued to roll in, with Vause Raw in the middle of the room, celebrating. General Bernard Montgomery stood by looking happy, still dressed in his full uniform, though he had retired for the very last time only recently.\n\nThe United Party had lost its majority while remaining the nation's biggest political party, but its composition had been forcibly changed, as the NCP mainly ran in districts opposed to the more progressive wing of the party, delivering a crippling blow to Eglin’s progressives. Div would be on his way out, Eglin too, and the new leadership of the UP would come to form a coalition with him.\n\nThe Progressive Party, the uppity, naive lot they were, had been soundly rejected by the nation, leaving only the NCP and UP as serious political parties that could wisely lead the nation. Sure, Raw had missed his chance to become Prime Minister, but the fickle tide of progressivism had smashed upon the rocks of the NCP and scattered afterwards.\n\nOnly a strong, firm, and conservative government could lead this nation forward, and already Vause was thinking up demands he could make of the United Party to make sure that South Africa would truly remain a White man’s nation."
 HDV_SAF.226.a: "A turn to the right is on the cards."
 HDV_SAF.227.t: "End of a Career"
 HDV_SAF.227.desc: "The elections in South Africa had come with one gut-wrenching conclusion: the United Party had no clear majority. While not an absolute sign of defeat at the moment, per se, the harrowing news swept around the ranks of the voters of the United Party, leaving behind only concern mixed with just a bit of depression.\n\nJacobus Strauss walked in De Villiers Graaff’s private room behind the stage without knocking, with a thin smile on his face as he glanced at the Prime Minister. Eglin had barely held on to his seat, and with Div failing to uphold the party, Strauss would lead the party, and thus the nation, in no time.\n\nThe Prime Minister was perched on his leather chair, still, in absolute silence. He flickered through the provided electoral data, creasing its sides over and over again, rechecking it to hope that it wasn’t true, that there was some form of error. But it spoke all too clearly; the New Conservative Party had taken away his majority. It was over, not for the party, but for Div’s career, that much is certain.\" He turned to look at Strauss, and the two men suddenly were locked into a silent battle of stares.\n\n\"Get out, Jacobus. I have nothing to say to you.\"\n\n\"Well, I do have something to say to you. You lost, you failed, now exit with some grace before I have to go and humiliate you in public. Actually, yes, do stick around, that will be much more enjoyable for me after all.\" Strauss walked out and slammed the door shut, leaving Div there alone, listening to the echo of the door slam fade away.\n\nThe Prime Minister flicked his lighter over the front of a cigarette, took a drag of it, and turned in his swivel chair to face the window that looked out over the city around the building. First, he had fought a struggle to keep the Union of South Africa together, and now, he had to struggle to keep a United Party together, and in that, he had failed. There was no doubt in his mind that his political career was now over, and he should take a bow and pursue a polite exit before his party would aggressively show him the door. It was just a darned shame that Strauss would end up being the next Prime Minister instead of someone else, but there was nothing he could do about that now."
 HDV_SAF.227.a: "Time to retire back to his vineyard."
 HDV_SAF.228.t: "Back To Reality"
 HDV_SAF.228.desc: "The Progressive Party had taken a blow. It had not just lost, but the country seemed to have backed the Conservatives instead. Not only had the Progressive Party failed to gain any seats, but their potential allies in the progressive wing of the United Party had taken a great blow as well. In effect, this was enough to fully sideline progressivism as an idea, leaving it off even worse than before.\n\nWhile the crowds thinned somewhat, the party stuck together even though the dark clouds hanging over them were most apparent. In this moment, Harry wondered to himself if he had been naive in hoping for a turnaround for his party and thus his nation. A step forward, adapting to the reality on the ground and not the dogmas of fat oafs like Raw, who spent time lecturing people on how things should be. But that man whom Harry so despised would be in government, and he would be left with no other choice but to figure out some way to hold back the influence of the NCP.\n\nBut what truly was worst of all was that he had allowed himself to hope. To hope for a chance, a turnaround, a new start, none of which they got. It truly was the hope that he had that was now killing him inside. Quietly, he cursed himself for daring to believe and not just settling for modest expectations."
 HDV_SAF.228.a: "Their fate would turn one day, but it was not today."
 HDV_SAF.229.t: "The Correct Timing"
 HDV_SAF.229.desc: "The longer the evening dragged on, the quieter it got at the United Party Headquarters. It had become apparent that the New Conservative Party, founded by Vause Raw and cheerleaded by General Bernard Montgomery, had caused the United Party to lose its majority of seats in parliament. While the UP would still be in government, it would now have to strongly contend with the wishes of its conservative coalition partner. For most people at the UP, they wondered, but Div had already made up his mind as he ascended to the stage and took up a place in front of the television cameras.\n\n\"Fellow South Africans.\" He paused for a moment to give a polite nod. \"I want to start with congratulating the New Conservative Party and its leader, Vause Raw, on their victory tonight. The people of South Africa have spoken, and they have decided to turn in a conservative direction. Hopefully, soon we can begin negotiations with the NCP to form the next government and continue to build a prosperous future for our nation.\"\n\nAnd then, dead air followed. Div glanced around the room, to his colleagues, to the members of the media, and back into the camera without saying a word for ten seconds. The photo cameras continued to click as Div’s tongue awkwardly moved his tongue around in his mouth. It was simply the best move for him, as a politician, to take this drastic step, no matter how much it hurt to do so.\n\n\"But I will not be a part of that.\" He put his hands on the lectern. \"I have decided to retire from politics altogether and resign as leader of the United Party, stepping down now that my task is completed. When I was chosen as Prime Minister in 1956, I vowed to bring the modern era to South Africa, and our nation still stands as a beacon of freedom and prosperity in an Africa that is rapidly changing. Then came the war, and the great existential struggle against the Germans as they goose-stepped southwards towards the Cape, thinking of an easy conquest. But no, no, they would not crush South Africa, and with help from our friends and allies in the Organization of Free Nations, we stood firm against the tides of darkness.\"\n\n\"It has been an honour being your Prime Minister for these turbulent years, and I am proud to know that South Africa has become all the better for it. I know that I leave this nation in fine hands, and look forward to a proper retirement in my vineyard. Good night, and God bless you and your families.\" With a final nod to the camera, Div walked off to the back rooms rather quickly, and some claimed to even see him get a bit teary-eyed before the door closed and the room erupted in conversation."
 HDV_SAF.229.a: "A long career in service to the nation finally ended."
 HDV_SAF.230.t: "A Long Overdue Retirement"
 HDV_SAF.230.desc: "For decades, regarded within South African political circles as one of the most capable men in the halls of government, Deputy Prime Minister and Minister of Education Jan Hendrik Hofmeyr has announced his retirement from political life. While this comes as a surprise to much of the public, it's an open secret to those with the right connections that Hofmeyr's health has been in decline for some time. Renowned as a thorough and brilliant administrator, his retirement has naturally been carefully prepared for and planned over the course of months, ensuring a smooth transition, and now the time has finally come to pass. \n\nAdored by the liberal stalwarts that have always formed the core of his support, even Hofmeyr's political opponents, who certainly did not love his inflexibility, must admit a grudging admiration for his adherence to his principles. Even among his fellow Afrikaners, few of whom share his liberal sentiments, there is a sort of quiet respect for his administrative and educational achievements.\n\nMany worry that the end of his political career, inevitable though it is, will result in greater difficulty for the United Party, particularly when it comes to the development of effective policies and the rallying of its base to support its agenda. Despite his concerns, and after a long and distinguished career in public service, Hofmeyr now steps aside to make way for a new generation of United Party leadership. He entrusts them with the task of building upon his legacy, hoping they will use it as a foundation to forge a more liberal and progressive future for South Africa. Only time will tell whether that hope proves well placed."
 HDV_SAF.230.a: "The end of a lion of liberalism."
 HDV_SAF.231.t: "Looking Back"
 HDV_SAF.231.desc: "To say this day had been coming for a long while would have been stating the obvious. When you enter political office, you also know that one day you will leave it, either by fate or by force. Div's time in office had been instrumental in building South Africa up into a modern, advanced nation that now rested under the security umbrella of the Organization of Free Nations. When he came to power in 1956, South Africa had been on the right track, but he did not doubt that his leadership had been instrumental in really pushing the nation forward towards a much better future. Having led the nation through its most difficult existential crisis and coming out victorious in the defence of South Africa, apparently, had not been enough to convince the electorate, who had decided to take away the United Party's majority and force them into a coalition to keep power.\n\nDiv knew deep down that he could hold on and continue to lead the United Party forward, but it was clear that his time in politics was coming to an end, and he was better off bowing out gracefully and passing the torch to the next generation.\n\nToday was his final day as Prime Minister of South Africa, and he had insisted upon cleaning out his office himself, gathering up family photos, private notes, and other such tidbits. From his well-organised paperwork he left behind to the cleaning of the rubbish bin in the corner, Div found some solace in doing it all himself while listening to the radio in the background discussing the day's events. All his personal belongings had been placed in one box that he had placed next to the door. He paused for a moment, reconsidering his decision. The United Party had lost, but not decisively so, and his decision to leave had been his own. He could still turn this around, stay right here, and fight on for his political future with a fervent speech to the nation.\n\nBut he knew one thing above all. History does not look fondly upon those who stay long after their time is up, and to stay on would be quite a risky endeavour, to say the least. He was going to miss the power, influence, and prestige granted to him by the position of Prime Minister, but this was for the best."
 HDV_SAF.231.a: "And with a heavy heart, he closed the door behind him."
 HDV_SAF.232.t: "Prime Minister Strauss"
 HDV_SAF.232.desc: "Vause Raw was the one speaking to the journalists while the new prime minister had already taken hold of his office, the smile on his face simply unshakable. Ten years, ten years it had taken him to finally sweep Div aside and take the position he had been denied in 1956. While the fat, bloated blob of his coalition partner was talking to the press outside, Strauss was getting his hands on the levers of state, beginning to set up directives to his different cabinet members and getting used to the position he had been denied for an entire decade long.\n\nGlancing around his office Jacobus was already planning changes in his mind; perhaps to modernize the it and change its style to something that fit him better. Consequently, that would further wipe away any semblance of Div’s remaining influence here.\n\nBut more importantly, South Africa would have to truly assert itself further, becoming the dominant force in the wider region versus the crumbling ambitions of the Germans. At the same time, South Africa must also become a key member of the OFN in the struggle for liberty versus tyranny. South Africa would tie together the whole organization geographically, serving as the anchor point for the OFN in Africa, and totally intertwine with the markets of the free world.\n\nAt the same time, Strauss planned to crack down hard on the African National Congress, rooting out the organization in full to restore stability now that the OBW had been defanged during the war.\n\nIt was as he was looking through the cabinet layers that he found a letter emblazoned with a writing he recognized. De Villiers Graaff’s last message to him, so it seemed. With a frown on his face, Strauss ripped open the letter and read it."
 HDV_SAF.232.a: "To Jacobus Nel Strauss"
 HDV_SAF.233.t: "A Letter From Div"
 HDV_SAF.233.desc: "Strauss,\n\nTradition dictates that every Prime Minister of South Africa shall send a private note to the next holder of the office. As such, it is for that reason alone that I have left behind this letter in your new office, though I doubt you will read it.\n\nWhen you lost the leadership election in '56, I had assumed that you would take well to that fact, even when I generously offered you the position of foreign minister in my next cabinet. Unfortunately, not so soon after did I come to hear more and more about your misgivings about me, a permanent tendency to bring out the knives the moment anything negative could be attributed to me. I should have had you removed from your position by then, but I figured that it would be bad for party unity. Alas, it seemed like your petty, small-minded plotting would continue after that. Now, you are to be Prime Minister, but it will not be the glorious time you envision it to be for yourself.\n\nVause Raw is out for your head, and the moment momentum moves towards him, he will drop you and the United Party like a rock and try to take your office for himself. What would history think of Prime Minister Strauss afterwards? A small note in the history books, coming right after the Prime Minister who modernized the nation and guided it through its darkest days and greatest crisis.\n\nIf I were to give you any advice, it would be to exit your office gracefully before you humiliate yourself.\n\nSigned, "
 HDV_SAF.233.a: "£SAF_div_signature"
 HDV_SAF.234.t: "The Moment of Truth"
 HDV_SAF.234.desc: "The clock slowly ticked up to the full hour. Eight o'clock in the evening seemed so close and yet so far. For the first time in modern history, the dominant party system that had continued the United Party’s complete grip on power in South Africa since 1934 seemed to be cracking. Its conservative wing had split off to form its own party, while on the left, the Progressive Party seemed booming, seemingly making it an inevitability that the United Party would be knocked from the throne it sat on for decades.\n\nIn three different places in Cape Town, the three different parties gathered to see who would win. The Conservative splitters under Vause Raw, the United Party still led by Sir De Villiers Graaff and the Progressive Party under Harry Schwartz were waiting for the full hour when the truth would be revealed about the heavily contested election.\n\nWhen that time finally came; the nation all turned to their TV’s, the lesser fortunate in community TV halls, and those below by radio to listen to the news announcer’s finely accented upper class English.\n\n\"The S.A.B.C. exit poll for the elections of [?global.date.GetDateStringNoHourLong] are in. Taken across the land in key constituencies that will decide the fate of our nation for the next five years, this exit poll points at one clear winner, and that is..."
 HDV_SAF.234.a: "The New Conservative Party!"
 HDV_SAF.235.t: "A Victory For Decency"
 HDV_SAF.235.desc: "Cheers and celebrations erupted as the results continued to roll in, with Vause Raw in the middle of the room, celebrating. General Bernard Montgomery stood by looking happy, still dressed in his full uniform, though he had retired for the very last time only recently.\n\nThe New Conservative Party was the biggest party in Parliament, and the United Party had decisively lost its majority. Futhermore, the United Party's composition too had been forcibly changed as the NCP mainly ran in districts opposing the more progressive wing of the party and thus delivered a crippling blow to Eglin’s progressives. Div would be on his way out, Eglin too, and Raw firmly believed the new leadership of the UP would come to form a coalition with him.\n\nThe Progressive Party, the uppity, naive lot they were, had been soundly rejected by the nation, leaving only the NCP and UP as serious political parties that could wisely lead the nation. Now he would become the nation’s Next Prime Minister, while the fickle tide of progressivism had smashed upon the rocks of the NCP and scattered into nothing afterwards.\n\nOnly a strong, firm, and conservative government could lead this nation forward, and already Vause was thinking of the future and how he could ensure that South Africa would truly remain a White man’s nation."
 HDV_SAF.235.a: "A turn to the right is on the cards."
 HDV_SAF.236.t: "End of a Career"
