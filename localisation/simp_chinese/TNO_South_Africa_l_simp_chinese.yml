 ask_the_ofn_for_assistance: "请求OFN援助"
 ask_the_ofn_for_assistance_desc: "OFN是一个在联合峰会上获得多数票后所有成员国必须在任何战争中提供援助的联盟。让我们开始准备这个条约的第一次宣言，并向法西斯分子表明，自由世界将继续战斗！"
 SAF_the_south_africa_act: "§O《1909年南非法案》§!"
 SAF_the_south_africa_act_desc: "§X英国议会§!为统一其领地通过的第三项重大法案§O《1909年南非法案》§!，将§X各自为政§!的殖民地整合为单一实体——§O南非§!。这个新国家由四个省份组成：好望角、奥兰治自由邦、德兰士瓦与纳塔尔，各省均被赋予一定自治权。\n\n在政治体制上，该国效仿§X英国宪政原则§!建立了完善议会制，设有参议院和国民议会，首任总理§u路易斯·博塔§!是效忠英国的布尔人，他后来助力§O南非§!提升地位，使其成为§n大英帝国的完整自治领。§!"
 SAF_native_trust_and_land_act: "§n£GFX_SAF_farmfield_texticon 《1936年土著信托与土地法案》§!"
 SAF_native_trust_and_land_act_desc: "作为原§n£GFX_SAF_farmfield_texticon 《1913年土著土地法案》§!的延续和扩展，该法案以种族为标准规范土地所有权，并将部分领土指定为§r占人口多数的黑人群体§!的家园。根据该法案，黑人群体获得13%的土地居住权（原法案为7%），但与其庞大人口相比仍然微不足道。\n\n更具破坏性的是，该法案完全禁止§r黑人拥有§!土地所有权，迫使所有非洲人只能沦为白人农场的佃农而非自耕农。这导致大批民众被迫离开祖传家园，流向白人经营的大型农场以及多个新兴工业城市，为§u南非§!蓬勃发展的经济提供廉价劳动力。"
 SAF_neutrality_act: "§g£GFX_SAF_scale_texticon 《1945年中立法案》§!"
 SAF_neutrality_act_desc: "With the collapse of the §aAllied powers§! and the near total victory of the §oGermans§! and their occupation of the §qcolonies§! in the north, §uSouth Africa§! was thrust into a new age balancing between the rising powers of §oGermany§!§ and the §mUnited States of America§! both who continued to exert great pressure on the nation. After fierce debates on the status of the crown, and the future of §uSouth Africa§!, a compromise was reached between the §AUnited Party§! and the §sNational Party§!.\n\nThe throne of §uSouth Africa§! was to be §nkept intact§!, yet §eempty§! to appease §Oboth§! §Xsides§!, one of which backed §XKing George VI§! in exile and the other wished to be rid of the monarchy alltogether, claiming it to be another thing imposed upon the Afrikaner people against their will. Finally, the §bNeutrality Act§! affirmed now and forever §uSouth Africa§!’s complete §bneutrality§! in the clash of influence between the superpowers of §oGermania§!, §mWashington§! and §XTokyo§!, vowing only to trade and keep friendly relations to all while preserving enough distance to escape the consequences of the §*cold war§!. Since then, §uSouth Africa§! has been a leaf in the wind, hoping to forever keep up its §bneutrality§! in the face of rapidly changing times."
 SAF_electoral_consolidation_act: "§A£GFX_SAF_ballot_texticon 《1946年选举整合法案》§!"
 SAF_electoral_consolidation_act_desc: "Consolidating several older laws on the act of voting and permanently formalising voting rights in §uSouth Africa§! to §Zspecific races only§!, §A£GFX_SAF_ballot_texticon Electoral Consolidation Act§! remains instrumental in maintaining the separation of the different races of §uSouth Africa§! and affirming the power of its minority §dWhite elite§!.\n\nAs before, §dthe White men and women§! of §uSouth Africa§! were able to vote, but the most contentious part of the law was the formalisation of the §nCape Qualified Franchise§! which permits the §Coloured peoples§! of the Cape and Natal to vote in elections. Despite fierce opposition by the §sNational party§!, the §jColoureds§! were allowed to vote for Parliament, but only §dWhites§! were able to serve in parliament. The §rBlack population§! was never granted ability to vote, now permanently sidelined politically and economically."
 SAF_fagan_commission_accepted: "§P£GFX_SAF_eye_texticon 通过法根委员会§!"
 SAF_fagan_commission_accepted_desc: "由著名律师§C亨利·艾伦·费根§!领导，§Z土著法律委员会§!于1946年成立，旨在讨论§y原住民§!从乡村向§u南非§!快速扩张的城市迁移的问题。该委员会最终采取了相对§m开明§!的处理方式，大幅放宽人口流入管制，允许§y原住民§!自由迁入城市。§P费根委员会§!提出的另一项建议是在城市地区建立稳定的§y原住民工人§!群体，既为企业提供可靠劳动力，也为零售商扩大消费群体。\n\n§s国民党§!迅速组建了持对立立场的§g索尔委员会§!，该委员会极力主张在全国范围内推行种族隔离。由于§A统一党§!允许§P费根委员会§!方案通过，§g索尔委员会§!的提案最终被否决。"
 SAF_unlawful_organizations_act: "£GFX_SAF_communism_texticon §x《1960年非法组织法案》§!"
 SAF_unlawful_organizations_act_desc: "Section 1:\nDefined that the §&Pan Africanist Congress§! and the §xANC§! could be declared an §xunlawful§! organisation by the §aGovernor-general§!, without giving them notice, via a proclamation in the Government Gazette. Defined that any other organisation deemed §xunlawful§! organisation by the §aGovernor-general§! could be banned. Defined that the banning was for twelve months and could extended after that time-period for another twelve months per period. Defined that the §aGovernor-general§! could unban an organisation via the Government Gazette.\n\nSection 2:\nDefines the use of certain sections of §eSuppression of Communism Act§!, 1950 to apply to organisations proclaimed as §xunlawful§!.\n\nSection 3:\nDefined that any organisation that was proclaimed as being banned, that proclamation would be reported to §uparliament§! within fourteen days or with fourteen days of §uparliament§!'s recommencement.\n\nSection 4:\nDefined that section 15 of the Riotous Assemblies Act, 1956, substituted the word \"§Gliable§!\" with \"to the penalties prescribed in section two of the Criminal Law Amendment Act, 1953 (Act No. 8 of 1953)\" and that is applied from 28 March 1960."
 SAF_monetary_reform_act: "§f£GFX_SAF_currency_texticon 《1961年货币改革法案》§!"
 SAF_monetary_reform_act_desc: "After long having the §uSouth African Pound§! as its currency, the longer term efforts to replace it with §na different currency§! have finally been completed as the §fRand§! comes into circulation before the end of the year 1961. Named after the §WWitwatersrand region§!, or White Water’s Edge, the ridge where §JJohannesburg§! was founded and the nation’s §Ygreatest gold deposits§! were found that ended up funding §nthe great development of South Africa§!.\n\n§OSouth Africa§! has now switched to a decimal system of coinage, and the new §fRand notes§! depict §UJan van Riebeeck§! who once founded the §JCape colony§! in 1652 as well as depictions of mining operations, cityscapes and of course §.the Springbok§!, §uSouth Africa§!'s national animal."
