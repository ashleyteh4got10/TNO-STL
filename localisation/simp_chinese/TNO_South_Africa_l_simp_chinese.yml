 SAF_to_win_the_war_2: "终胜之路"
 SAF_to_win_the_war_2_desc: "终胜之路"
 SAF_countinous_warfare: "持续战争"
 SAF_countinous_warfare_desc: "持续战争"
 SAF_end_martial_law: "结束戒严"
 SAF_end_martial_law_desc: "战争已经结束，实施戒严法的必要性也随之消失。正如最初颁布时所承诺的那样，维利尔斯·赫拉夫总理已确保1964年《戒严法》立即废止，平民生活将恢复如初。\n\n然而，这并不意味着对非国大等被禁团体的极端主义文献传播的限制会被容忍，BOSS将继续牵头破坏支撑这些组织的海外联系，以遏制其扩散。对普通公民而言，生活回归正常固然令人宽慰，但这场战争无疑已为开普地区带来了巨大变革。"
 SAF_the_lessons_of_the_war: "战争的教训"
 SAF_the_lessons_of_the_war_desc: "南非武装部队现已成为少数几支与现代德军编队（以及旧式编队）展开全面直接交锋的军队之一。此刻正是最佳时机——不仅要汇编并分享现代战争智慧及对抗纳粹威胁的战术，更要确保将这些经验教训广泛传达给自由国家组织中的盟友们。\n\n来自战场的报告、作战文件、观察记录，以及与在战术和战略层面指挥作战的将领们进行的深入探讨，都将被系统整理成册并分发传播。尽管军队规模势必缩减，但这场战争积累的经验应当被珍视并传承下去，成为联邦国防军未来发展的基石。"
 SAF_the_coronation: "加冕典礼"
 SAF_the_coronation_desc: "国民党或许赢得了他们的公投，也挑起了战争，但他们永远无法阻挡王权！既然战事已尘埃落定，这场公投大可以彻底无视并弃如敝履。取而代之的是，在一场盛大庆典中——或许是该国历史上最盛大的典礼——大不列颠及英联邦女王伊丽莎白二世已受邀前往开普敦，正式加冕为南非女王。\n\n当背信弃义的共和派被永远噤声之际，举国上下将通过电视见证这场加冕礼，它必将在开普之地激发新一轮持久不衰的保皇浪潮。此刻，南非在此宣告自己成为英联邦一员，感恩归属于真正的英国君主制，并拥戴伊丽莎白二世女王为我们合法正当的统治者——此时，此地，直至永恒。"
 SAF_our_vast_new_lands: "广袤的新领土"
 SAF_our_vast_new_lands_desc: "虽然我们本意并非扩张疆域，而仅是维护联邦统一，但战争的胜利使我们掌控了广袤的新领土，将南非的版图拓展至前所未有的规模。这对国家虽是巨大福祉，却也带来了沉重负担——这些土地必须得到妥善治理，否则动荡的杂草将生根蔓延，再度威胁国家统一。\n\n从温得和克到洛伦索马贵斯，南非占据着主导地位。但昔日维系这些地区和平的殖民体系正在迅速瓦解，若不迅速采取行动，我们新获得的辽阔疆域将面临分崩离析。所幸统一党上下都清楚意识到德国殖民地曾因过度扩张承受的苦难，因此各方已形成广泛共识，必须尽快解决这一难题。"
 SAF_speeding_on_the_savannah: "驰骋草原"
 SAF_speeding_on_the_savannah_desc: "随着我国领土的大幅扩张，这些新增疆域不仅需要行政管理，还需驻军应对极端主义残余势力和破坏和平者。但毫无疑问，要有效覆盖如此广袤的国土，南非必须组建一支高度机动灵活的特种部队——这支队伍需能适应我们联邦境内复杂多变的地形特征。在可预见的未来，我们不再需要庞大的坦克军团，真正需要的是能用车轮疾驰于国土各处的快速反应部队。\n\n但这绝不意味着机动部队会缺乏致命打击能力——它们将配备重火力装备。任何出现动荡的区域，不仅会有地面快速反应部队及时抵达，我们还将建立大规模直升机编队提供立体支援。"
 SAF_speeding_on_the_savannah_tt: "2 Mechanized divisions will be spawned in Cape Town."
 SAF_inviting_international_investors: "邀请国际投资者"
 SAF_inviting_international_investors_desc: "新增领土的经济活动必须迅速恢复，以便我们能收获扩张带来的红利。然而在战争成本严重拖累经济的情况下，我们无法独自完成这项任务。所幸有足够多的投资者愿意接手德国人留下的摊子。大量矿产资源、经济作物种植园及其他开采网络将快速重启——我们为从业者提供略有改善的工作条件，只为让他们闭嘴，同时塑造我们比前任统治者更仁慈的形象。\n\n从德国人手中缴获的巨额资产将以折扣价出售，吸引各盟国企业进驻分一杯羹，同时进一步巩固我们在北方的经济网络。"
 SAF_a_deal_with_the_deutsch: "与德意志的交易"
 SAF_a_deal_with_the_deutsch_desc: "将德国人全部驱逐出纳米比亚无异于引灾祸与混乱入这片土地，我们的泛非主义对手必将善加利用。遗憾的是，对待境内德国人时我们不得不采取极度务实的态度。虽然他们将被迫离开罗德西亚与莫桑比克，但我们将允许德国人自由定居纳米比亚，并赋予其投票权与有限自治权，以此换取德国永久承认开普对西南非洲全境的统治。他们的人口规模尚不足以真正影响选举结果，但他们对地区的控制力必将巩固我们的掌控。\n\n此举必将引发盟国与国民的双重争议，但这是巩固纳米比亚统治权必须付出的代价。虽然纳米比亚与德国的联系将被切断，但境内的德国人得以保留资产与权力——只不过这一切都将置于南非的英明管理之下。"
 SAF_rhodesia_returns: "罗得西亚回归"
 SAF_rhodesia_returns_desc: "罗得西亚自1945年大英帝国解体时便被窃取，如今随着局势逆转及南非战争的胜利，这个优良省份终于如宿命所归般并入南非。罗得西亚人民经年累月承受着德国占领的苦难，除了在土著群体中艰难维持优越地位外别无他法。这一切都将终结——南非将向罗得西亚兄弟伸出援手，全面恢复他们的自由，使罗得西亚成为正式省份。该省必将毫无悬念地投票支持统一党以作回报，进一步巩固我们的选举主导权。\n\n此举将使双方获益良多，南非将向罗得西亚提供财政与政治支持，确保其迅速确立在该地区的绝对主导地位，从此与开普地区血脉相连、永世交融。"
 SAF_matters_in_mozambique: "莫桑比克问题"
 SAF_matters_in_mozambique_desc: "语言。这是南非与莫桑比克之间的根本障碍。虽然我们能勉强听懂德语，罗德西亚人也能说标准英语，但莫桑比克仍使用葡萄牙语，这给我们实际治理该地区带来诸多困难。我们将转而建立一个傀儡共和国，由先前离开莫桑比克前往南非的人员组成，并仅保持对该地区的全面经济控制，而非将其并入我国领土。\n\n首先需要进行重建工作，同时承诺未来举行选举。在此期间，我们将尽可能多地安置归侨进入该地区，并给予伊比利亚国家一定经济影响力，从而将该区域纳入我们的经济网络——这样既避免了直接治理大量完全不懂英语的民众所带来的麻烦。"
 SAF_matters_in_mozambique_tt: "Elections will be held in Mozambique and the Reconstruction Government shall end."
 SAF_tying_it_all_together: "全局统筹"
 SAF_tying_it_all_together_desc: "随着政治事务大体解决，整合新领土仍存在更宏大却也更直接的方式。我们应当大力投资各类基础设施，不仅要从政治上将这些土地与开普地区紧密相连，更要在经济上实现融合。敌军机场可改造为民用航空港，码头与海岸设施能够翻新重建，而新建的铁路线路将更进一步打通非洲偏远的腹地。然而最宏伟的工程当属整体道路系统——目前公路网络过于简陋，缺乏能够通达偏远地区的完善高速公路体系。\n\n这将是项耗资巨大、费时良久的宏伟工程，但毋庸置疑其短期与长期投资回报。这些钢铁与沥青铸就的纽带，必将为南非国家带来永恒的福祉！"
 SAF_claim_the_higher_ground: "抢占制高点"
 SAF_claim_the_higher_ground_desc: "关于认知的问题对我们大有裨益。南非战争中的我方立场，或许是史上最正义的战争——这是对联邦、自由与希望的荣耀捍卫，我们对抗的是妄图将非洲拖入无尽苦痛深渊的纳粹殖民主义黑暗势力。但总有反抗者存在，自1945年以来，纳粹主义那裹挟苦难与死亡的灰色浪潮首遭挫败，最终被永远逐出非洲大陆。\n\n此刻我们所矗立的，不仅是军事上的胜者，更是道义上的赢家，我们的行动彰显正义。世人当知南非的牺牲，那为捍卫非洲自由事业而流淌的热血。宣扬我们战胜邪恶的道义胜利只会带来裨益，我们将建立全球传播体系，让地球上所有热爱自由的人们，都知晓我们铸就的善业。"
 SAF_exposing_atrocities: "揭露暴行"
 SAF_exposing_atrocities_desc: "党卫军以他们嗜血野兽般的行径帮了我们大忙，他们施加的苦难与死亡的证据随处可见，被他们残暴奴役的土地与人民身上遗留的伤痕，仍待我们记录。德国绝不会获得救世主的美名，只会沦为可怕的奴隶主与施虐者——这些人似乎竞相以制造苦难为乐。考古学家与随行记者将深入前东非领地，记录集中营、坟场及恐怖过往的方方面面，以此揭露德国人的真面目。\n\n与此同时，此举将使我们成为这片土地正义的解放者，从而也成为最适合管辖这片土地的人。"
 SAF_cover_up_excesses: "掩盖失误"
 SAF_cover_up_excesses_desc: "战争从来都是混乱之事，这一点无人能否认。尽管对德军暴行的研究仍在继续，但已有数份关于我军对待原住民平民失误的报告浮出水面。虽非制度性问题，但这些事件与过激行为确实可能彻底瓦解我们在国内外宣称道德高地的努力。所幸我们已获得诸多掩盖战争暴行证据的良机——例如销毁证据，甚至将部分行径栽赃给被逐出这片土地的残暴德国压迫者。在公开场合将所有罪责归咎于德国人的行动将持续推进，而暗地里，战争档案将被选择性焚毁，以确保有碍今日书写之历史的真相永不见天日。"
 SAF_reintegrating_the_afrikaner_lands: "重新整合人民邦"
 SAF_reintegrating_the_afrikaner_lands_desc: "这场战争是为了捍卫联邦而战。一个由阿非利卡人与英裔组成的联邦，两个伟大而强大的民族于1902年联合建立了南非。尽管有人呼吁对阿非利卡人施加报复与惩罚，但总理深知其中利害。作为阿非利卡人的一员，他将确保阿非利卡人的权利与土地得以恢复，让和平与繁荣尽快回归，使联邦得以延续，而非陷入英裔与阿非利卡人冤冤相报的循环中自我撕裂。人民邦的理念不会被铁腕摧毁，而是通过张开的手掌与回归正常社会的邀请得以消除。当然出于安全考量，前人民邦核心区域仅将缺席一届选举投票权。"
 SAF_the_pretoria_trials: "比勒陀利亚审判"
 SAF_the_pretoria_trials_desc: "是时候为这场战争画上句点——将战犯与刽子手绳之以法。虽其罪证确凿如山，我们仍拒绝作秀审判，允其享有正当辩护权。在媒体全程见证下，那些未能逃脱或自戕的专员辖区核心主谋与执行者，将接受历史审判。\n\n德意志对非洲的钳制，终将在比勒陀利亚终结。这座见证正义昭彰的城市，将让世界看清何为天理昭昭。比勒陀利亚审判必将作为捍卫人类文明的丰碑载入史册，这是对邪恶的终极裁决，而南非，将成为正义的守护者。"
 SAF_guarding_the_north: "守卫北方"
 SAF_guarding_the_north_desc: "战争或许已经获胜，但德国人仍在北方盘踞。他们势必会试图挑起新的冲突，以夺回失去的荣耀与疆土。要阻止此类事件发生，唯一途径就是在广袤的北部边境建立完善的防御体系——于北部地区构筑要塞与军事基地网络，确保能对任何动荡作出快速反应。虽然强化我们与残存国家政权之间漫长陆路边境全线并不可行，但必须采取行动震慑敌人，使其不敢再度越界。\n\n此前敌军跨过边境时，南非尚未做好准备。但如今，我们绝不会再被铁蹄踏破山河。"
 SAF_guarding_the_north_tt: "南非和莫桑比克的北部边境将修建防御工事。"
 SAF_prioritzing_mobile_forces: "侧重机动部队"
 SAF_prioritzing_mobile_forces_desc: "随着我国领土的大幅扩张，这些新增疆域不仅需要行政管理，还需驻军应对极端主义残余势力和破坏和平者。但毫无疑问，要有效覆盖如此广袤的国土，南非必须组建一支高度机动灵活的特种部队——这支队伍需能适应我们联邦境内复杂多变的地形特征。在可预见的未来，我们不再需要庞大的坦克军团，真正需要的是能用车轮疾驰于国土各处的快速反应部队。\n\n但这绝不意味着机动部队会缺乏致命打击能力——它们将配备重火力装备。任何出现动荡的区域，不仅会有地面快速反应部队及时抵达，我们还将建立大规模直升机编队提供立体支援。"
 SAF_reintegrating_the_afrikaner_lands_2: "重新整合人民邦"
 SAF_reintegrating_the_afrikaner_lands_2_desc: "这场战争是为了捍卫联邦而战。一个由阿非利卡人与英裔组成的联邦，两个伟大而强大的民族于1902年联合建立了南非。尽管有人呼吁对阿非利卡人施加报复与惩罚，但总理深知其中利害。作为阿非利卡人的一员，他将确保阿非利卡人的权利与土地得以恢复，让和平与繁荣尽快回归，使联邦得以延续，而非陷入英裔与阿非利卡人冤冤相报的循环中自我撕裂。人民邦的理念不会被铁腕摧毁，而是通过张开的手掌与回归正常社会的邀请得以消除。当然出于安全考量，前人民邦核心区域仅将缺席一届选举投票权。"
 SAF_bases_for_the_americans: "美国人的基地"
 SAF_bases_for_the_americans_desc: "如今，美国对南非的未来怀有深切的既得利益。我们应当邀请美军进驻所有新领土——从德班到温得和克，再到洛伦索马贵斯，让他们建立海军基地和常规军事设施。对于美军的驻防，我们应当欣然接纳，并将多余的几处军事基地以象征性费用移交美方。如今我们已成为OFN的一员，背靠山姆大叔的全力支持，必将确保未来的安全。南非再不会孤军奋战——当美军基地永久遍布我国疆土，北边那些党卫军蠢货若想挑起事端，只怕要三思而后行。"
 SAF_the_union_stands: "联邦永存"
 SAF_the_union_stands_desc: "伤痕累累，却未屈服；战线拉长，却未崩溃；一度分裂，终归统一。联邦永存！南非经历了最严峻的考验，而我们战胜了它。我们的疆界重获安宁，人民邦已被永远粉碎。虽未能直捣德国腹地，但联邦保卫战已赢得胜利。牛车哨兵的蟑螂们再度溃逃过境，但此战败北无疑已粉碎其势力。\n\n然而参战时的联邦与战后已截然不同——经济结构剧变，原住民躁动不安，城镇家园满目疮痍。联邦虽存，却已元气大伤，必须立即行动重建南非联邦。要治愈这场让骨肉相残、手足相争、民族对立的战争创伤。永不再现！因为联邦屹立不倒，并将永世长存！"
 SAF_funding_reconstruction: "资助重建"
 SAF_funding_reconstruction_desc: "毋庸置疑，重建工作必须获得全额资金保障。我们必须全力以赴、迅速振兴国家，方能在经济上超越北方的德国人。德意志终将衰亡，而南非必将成为“最后的光芒”——但此刻分秒必争。我们将全面加征税赋，并承诺每分钱都将投入国家重建：当崭新的房屋拔地而起，当破碎的城市重获新生，当整个国家真正浴火重生，往日的伤痕自会在宏伟的物质建设中逐渐淡去。为维持稳定，增税政策仅持续五年，以防引发社会动荡。此刻人人皆需尽责，繁荣盛景必将以空前之势重返南非！"
 SAF_maintaining_the_military_industrial_complex: "保留军工复合体"
 SAF_maintaining_the_military_industrial_complex_desc: "军队应削减至与谨慎和平时期相适应的适当水平，淘汰最陈旧的部队以打造现代化精干武装力量，其规模仍将远超以往任何时期。对于新建立的军工复合体，需采取行动适度缩减规模，但仍需维持其运转活力，使其成为值得投资扶持的产业。我们必须在自由世界寻找武器出口市场，但或许也可与中立国家达成交易。既然战争已证明南非武器装备的价值，世界各地必定会有买家对阿姆斯科的精品军火产生浓厚兴趣。"
 SAF_boss_is_watching: "国安局在看着你"
 SAF_boss_is_watching_desc: "国家安全局是战争的另一关键受益者，其在对抗德国入侵者的战局扭转中扮演了核心角色，通过深入敌后的广泛情报行动发挥了重要作用。然而随着和平的回归，若因北方威胁暂时消退就裁减我们的情报机构将是愚蠢之举——这股威胁始终阴魂不散。敌方情报机构与遗留的牛车哨兵残余势力勾结的风险，以及仍可能在地方政府中担任职务的同情者，这些威胁实在不容忽视。更不用说非洲人国民大会的极端分子仍在基层持续大力组织原住民。在南非国家安全局的警惕守护下，南非必将安然无恙。"
 SAF_deal_with_collaborators: "处置合作者"
 SAF_deal_with_collaborators_desc: "许多叛徒已经逃亡，但我们仍成功逮捕或处置了大量人员，更不用说那些公开与牛车哨兵合作的人物。我们必须花时间肃清北方地方政府中的牛车哨兵同情者与合作者，在将阿非利卡人的家园重新纳入我们联邦之前，根除政府内部可能残存的任何关系网。必须实施去纳粹化以清除那些企图将国家束缚在日耳曼尼亚威胁之下者所散发的恶臭，同时将任命新人来承担这些地区的关键职务。"
 SAF_border_fortifications: "巩固边防"
 SAF_border_fortifications_desc: "德军或许已被击退，但他们仍在北方盘踞，可以肯定的是，他们可能会试图挑起新的冲突以重拾昔日荣光。要阻止此类事件发生，唯一方法就是在辽阔的北部边境建立完善的防御体系——于北部地区构筑要塞与军事基地网络，使其能对任何动荡做出快速反应。虽然加固我们与残存专员辖区之间的漫长陆界全线并不可行，但仍需采取威慑手段，阻止敌军再次越境。\n\n先前敌军跨境时南非尚未做好准备，但如今，我们绝不容许领土再遭践踏。"
 SAF_border_fortifications_tt: "南非北部边境将修建防御工事。"
 SAF_arm_their_rebels: "武装他们的叛军"
 SAF_arm_their_rebels_desc: "毫无疑问，党卫军和其他德国组织仍会试图利用牛车哨兵残余势力对付我们，我们应当通过利用其内部矛盾加以反击，同时支持并协调反抗组织合作。大量心怀不满的当地人，加上德国各派系之间的内讧，为我们长期削弱北方所有德国势力奠定了有利的行动基础。当然必须谨慎行事，确保我们武装的对象在获得自由后不会调转枪口对准我们……"
 SAF_our_place_in_the_free_world: "我们在自由世界中的地位"
 SAF_our_place_in_the_free_world_desc: "与团结协定的贸易——尽管它可能令人憎恶——是1945年至1963年间南非经济增长的主要推动力。如今我们的命运已与OFN紧密相连，我们可以与新盟友认真深化接触和友谊，而来自日耳曼尼亚的哀鸣与威胁尽可置之不理——因为我们正躲在真正盟友美国提供的盾牌之后。  \n\n此刻正是开展重大外交行动的时机：接触我们的新朋友，重建旧有的关系与纽带。最重要的是，我们应为南非企业争取新机遇，将我国经济与我们最亲密盟友的经济紧密交织，迅速填补德国人留下的贸易空白。既然我们已永远抛弃了虚伪的中立观念，新的机遇正等待着我们。"
 SAF_postwar_Canada_Britain: "我们的皇家渊源"
 SAF_postwar_Canada_Britain_desc: "南非高度重视与王室的纽带关系，公投事件现已被视为重大失误——若非牛车哨兵安插的特洛伊木马。当务之急是立即与英联邦重建联系，不仅要同王室对话、恢复其对南非的合法治理权，更要借此缔结更深层的贸易联盟。毕竟政商运作皆系于人脉，如此珍贵的渠道理应充分运用。首要举措将是请女王伊丽莎白二世重新任命一位得体的总督，恢复其对南非象征性的宪政监督权。"
 SAF_postwar_Australia: "来自南方大陆"
 SAF_postwar_Australia_desc: "澳大利亚联邦是大洋洲自由的堡垒，抵抗着共荣圈并成为OFN的核心成员。我们之间的亲缘关系可追溯至昔日帝国时代，但总体而言，与澳大利亚的贸易往来始终未受重视。这种情况必须改变——当我们向南半球的这片土地伸出橄榄枝，那里的人们正开采着得天独厚的矿产资源。\n\n尽管双方出口产品的重叠性意味着我们难以开展大量盈利贸易，但只要竭力探索，总能寻得互利共赢的契机。"
 SAF_postwar_Dutch: "技艺精湛的流亡者"
 SAF_postwar_Dutch_desc: "人们或许会忽略荷兰王国，认为它不过是一个流亡海外后变得更小的国家，但规模掩盖了它的重要性。由于错失诸多机遇，他们不得不高度专注于特定领域以获取竞争优势，其中最主要的是荷兰皇家壳牌旗下的石油化工产业，以及飞利浦电子公司旗下的消费电子和军用电子产业。\n\n如果南非要真正繁荣起来，就需要对外开放，引入外国专业技术。我们能向荷兰学习的越多，自身就会变得越强大。幸运的是，我们可以利用与荷兰的历史渊源——毕竟南非殖民地是由荷兰建立的。通过派遣一些阿非利卡外交官前往，我们定能获得更多外国投资。"
 SAF_postwar_USA: "自由之乡"
 SAF_postwar_USA_desc: "美利坚合众国或许曾历经挣扎，但无人能否认它是真正的超级大国。随着冷战持续升温，我们如今安然处于美国的羽翼之下实属幸事。此前我们与美国的贸易往来已十分密切，但如今我们不仅需要将重心转向美国，更要拓展至与其紧密相连的整个经济辐射圈。不过首先，我们要前往大苹果城，前往得克萨斯，前往佛罗里达，与这片美元之地建立更深厚的联系。\n\n美国的技术与机械将推动国家现代化计划的第二波浪潮，而南非的黄金与钻石将为此买单！"
 SAF_signing_the_treaty_of_pretoria: "签署《比勒陀利亚条约》"
 SAF_signing_the_treaty_of_pretoria_desc: "事已至此。南非，南非联邦已一分为二，或许它将不再以联邦的形式存在。阿非利卡强硬派取得了胜利，迫使我们分裂国家，将北部割让给牛车哨兵那些卑劣的极端分子——他们必将毫不迟疑地把那片国土改造成属于亲德分子的地狱，最终走向自我毁灭。然而，为换取和平并保全我们所能保全的一切，这份承认失败的屈辱协议必须签署。\n\n德·维利尔斯·赫拉夫总理将在严密护卫下前往比勒陀利亚，与阿非利卡人民邦签署和平条约，承认其“独立”并放弃对其领土的一切主张。面对全面占领的威胁，我们别无选择，这是在可怕局势中争取最佳结果的唯一途径。联邦已不复存在，此刻我们必须守护好残存的疆土。"
 SAF_prisoner_exchange: "战俘交换"
 SAF_prisoner_exchange_desc: "随着这场战争的结束，双方必须交换战俘。牛车哨兵的宝贵成员与叛国的国民党人将被送往北方，加入那个地狱般的民族国度，而我们宝贵的人民将回到这个被撕裂成两半的国家。至少那些正直的开普敦守卫者能重见家园，但目睹叛徒获得他们根本不配拥有的自由，终究是件苦涩的事。"
 SAF_the_new_border: "新边界"
 SAF_the_new_border_desc: "随着新边界的划定，新的防御体系也必须建立。随着复兴的牛车哨兵在北方占据主导地位，这些边界必须得到重点防卫——尤其已有确凿证据表明，德国人是个卑劣奸诈的民族，必定会卷土重来。但这次我们将严阵以待，绝不会再被铁蹄踏破！我们的新边界将构筑成铜墙铁壁，以雷霆手段镇守，成为粉碎任何越境企图的决定性屏障。哨所、机枪、防空炮，越来越多的武装将调往边境并深挖固守。"
 SAF_shrinking_the_budget: "缩减预算"
 SAF_shrinking_the_budget_desc: "这是无法回避的事实。我们战败了，并且损失了大量宝贵的土地、劳动力和资源。即便将军队缩减至战前规模——考虑到国防需求这实际上并不可行——当前预算也绝无可持续性。我们必须根据新形势削减开支。这不会得民心，也不会受拥护，但为了整顿财政，使我们能重新积累真正的繁荣，我们已别无选择。南非虽元气大伤，但尚未崩溃，更未认输。我们必须承受这次重击，为不同的未来做准备。如今与人民邦的战争必须转为经济竞争，用超越对方体制的发展来证明其谬误。或许在遥远的未来，北方贫困的南非白人会向南眺望忠于祖国的同胞，心生羡慕。"
 SAF_requesting_american_aid: "请求美国援助"
 SAF_requesting_american_aid_desc: "毫无疑问：我们必须直接向美国人求助。美国援助必将付出代价：放弃对南非工业的保护主义，向美国敞开大门。那些靠保护主义苟延残喘的南非企业，注定会被美国巨头碾得粉碎——但我们别无选择。我们的工业或许会受损，但出口贸易绝不会。重建南非需要资金、收入和出口，更要用繁荣让那个可怜兮兮的孤岛“人民邦”无地自容。\n\n因此我们唯有奔赴华盛顿，乞求援助与支持，彻底向山姆大叔俯首称臣，任由南非沦为美国资本主义的前哨站，而非我们苦心经营多年的“南非模式”。"
 SAF_american_bases_galore: "美军基地遍地开花"
 SAF_american_bases_galore_desc: "在南非被逼至绝境之际，有一个国家挺身而出保卫我们，率领OFN的伟大阵线守护好望角。如今我们虽元气大伤、遍体鳞伤且疆域割裂，但美国友人仍将与我们并肩而立。我们确信，南非的防务如今将置于美国鹰翼的庇护之下——但这不仅意味着加入自由国家联盟，更将通过移交军事基地与海军基地，迎来美国及盟国的大规模军事驻防。\n\n交出那些历史悠久、备受尊崇的基地确实令人刺痛，但随着美军实地驻防，人民邦及其幕后操纵者若想再度生事，势必得三思而后行。"
 SAF_embracing_our_anglo_heritage: "盎格鲁传统"
 SAF_embracing_our_anglo_heritage_desc: "事实已昭然若揭。所有人都心知肚明，空气中弥漫着背叛的气息——当阿非利卡人北上时，盎格鲁人却在北方腹背受敌，最终不得不南下与同胞汇合。联邦已然瓦解，灰飞烟灭，取而代之的必须是英联邦体系。政府公文应当弃用阿非利卡语，以英语作为主要行政语言。\n\n南非的命运早已注定：这片由我们先祖开拓的白色骄傲之地，从今往后将永远属于盎格鲁民族。"
 SAF_maintaining_our_union: "神圣的联盟"
 SAF_maintaining_our_union_desc: "联邦尚未终结！面对汹涌攻势，面对背叛与侵略，好望角上依然飘扬着南非联邦的旗帜。那些忠诚的阿非利卡弟兄们，他们为捍卫联邦血战至死。我们的总理仍是阿非利卡人，政府与军队中依然遍布阿非利卡精英。为了所有牺牲者，我们必须誓死捍卫这个由阿非利卡与盎格鲁共同铸就的联邦！\n\n南非联邦，永世长存！"
 SAF_resume_pan_african_crackdowns: "全国镇压行动"
 SAF_resume_pan_african_crackdowns_desc: "既然事情已经解决，我们可以继续开展针对非洲人国民大会极端分子的行动——这些人始终鼓吹普选权，而这将彻底颠覆我们所熟知的南非。战争繁忙时期我们曾对他们有所纵容，但随着和平回归，必须继续对这些煽动分子发起内部清剿。当这些声音彻底沉寂时，真正的和平才会重返开普敦，每个人也将重新认清自己在生活中应有的位置。"
 SAF.173.t: "The Embargo at Dusk"
 SAF.173.desc: "Div sank into the armchair in his office, the weight of the day pressing down on him. It had been long; an endless parade of meetings, memos, and red boxes. Each one emptied, only to be replaced by another. Now, with a tumbler of amber liquid in hand, he allowed himself a brief moment of relaxation. The quiet hum of the evening felt almost comforting. Almost. He stared into his glass, watching light flicker across the surface. The recent shift toward the OFN had seemed bold, a huge chance for South Africa to assert its independence and balance between the great powers. But it was a fragile balance. One misstep could plunge the country into chaos.\n\nThe calm didn’t last. A soft knock came at the door, followed by the entrance of his private secretary, a thick manila folder tucked under his arm. \"Prime Minister, my apologies for disturbing you. News from Germania has arrived- and it’s not what you were hoping for.\" Graaff frowned and took the folder. Inside was a single sheet, stamped and sealed:\n\n**Effective immediately, the Union of South Africa will be embargoed until further notice by the Greater German Reich and its allied governments. This measure was not ours to decide, given your government’s continued alignment with the American enemy across the sea.\n\nReichsminister des Auswärtigen, der Großgermanisches Reich\nWalther Hewel**\n\nHe read the message twice, then set it down, staring blankly into his drink. The consequences were clear and catastrophic. German goods, capital, and investment had long balanced American influence; without them, South Africa would be left at the mercy of Washington. Markets would panic, industries would falter, and political rivals would circle like vultures.\n\n\"Call an urgent cabinet meeting,\" he said finally, his tone steady but heavy. \"This must be shared with all ministers before it leaks. We need to move fast.\"\n\nAs the secretary hurried out, Div refilled his tumbler and walked to the window. The lights of Pretoria shimmered faintly in the distance, blurred by the night air. He took a slow sip and exhaled. The embargo would test everything: his policies, his government, and perhaps even his own future. Reelection now felt like a distant prospect, unless, somehow, he could turn this disaster into an opportunity."
 SAF.173.a: "An Unwelcome Response."
 SAF.174.t: "Kaapse Klopse"
 SAF.174.desc: "The day had arrived, and once again, the streets of Cape Town were alive with celebration as Cape Coloureds across the city honored their vibrant heritage. Trucks carrying performers rolled down the avenues as hundreds of minstrels paraded behind, dressed in vivid colors and carrying ornate umbrellas while playing an array of musical instruments. Meanwhile, white citizens looked on in disapproval from the sidewalks as they did their usual shopping, bewildered by the spectacle before them. Among the crowd were several black factory workers who had just finished a 12-hour shift at the local Eskom Plant. This festival allowed people like them to openly embrace their heritage without fear of being expelled by the authorities.\n\n\"Get out of here, you black laborers! Get back to work!\" Taunts and insults echoed from the crowd of onlookers. Police officers were stationed along the procession to maintain order, but it seemed all they did was incite tension. \"Go away! No one wants white trash here!\" As some Coloureds shouted back, the enraged officers surged toward the crowd. Within minutes, chaos erupted as members of the procession confronted nearby police officers. Riot police quickly arrived, and crowds fled as the officers began to assault any Coloured person in sight. \"Run! Run for your lives!\"\n\nOnce calm, the whole street erupted into chaos. Unconscious bodies sprawled across the ground as law enforcement stormed after the fleeing minstrels. Journalists ducked into nearby shops, their cameras flashing as they captured the violence. \"Hurry up, get him and bring him to the car! We’ll take him to Groote Schuur Hospital!\" At that moment, an unconscious man, blood streaming from his forehead, was hauled into a car by several minstrels who had been attending the parade.\n\n\"Someone, please help! He’s losing too much blood!\" A Samaritan rushed to the front counter, pleading with the nurse. \"I’m sorry, we have an overwhelming number of patients today, and because of his heritage, he cannot be prioritised - even in this state. He will be treated later. For now, you’ll need to wait outside...\"\n\nThe minstrel froze, words stuck in his throat. His chest tightened as despair weighed down on him. Because of his Bantu heritage, this man was being denied urgent care. Muttering angrily, he carried the unconscious, bleeding man out of the hospital. Placing him gently on a nearby bench, he was soon joined by others who tried desperately to stem the bleeding. Sitting beside him, the very men who had saved him could only watch as his breath grew weaker and life slipped away."
 SAF.174.a: "He was dead within 10 minutes."
 SAF.175.t: "The Cold War of the House"
 SAF.175.desc: "The autumn evening in Pretoria carried a tension that mirrored the brittle calm of South Africa itself. The Van der Merwe household, a modest bungalow on the city’s outskirts, became an unwitting battleground that night. The family gathered around their aging radio, its brass dial tuned to Radio Ostafrika, a propaganda arm of the Reichskommissariat’s exiled far-right loyalists. The voice of Johannes van Rensburg, disgraced leader of the OBW, crackled through the speaker. His words were sharp, laced with vitriol: condemnation of American \"weakness,\" and fervent calls for alignment with Germany.\n\nPieter van der Merwe leaned forward in his armchair, nodding along. To him, van Rensburg’s rhetoric resonated with fears of a changing world—the OFN’s democratic overtures felt like a surrender, while Germany’s order promised stability. His wife, Elize, a schoolteacher, sat rigidly on the sofa, her knitting needles clacking louder as the broadcast escalated. When van Rensburg derided mixed-race schools as \"cultural treason,\" she snapped.\n\nThe argument erupted swiftly. Pieter defended van Rensburg as a \"patriot,\" while Elize accused him of parroting fascist poison. Their voices rose, echoing in the cramped living room. Between them sat their daughter, Anika, clutching a tattered history textbook—a gift from Elize’s pro-US brother. Her eyes darted between her parents, a silent witness to the chasm widening beneath their roof.\n\nAnika’s presence did little to temper the clash. Pieter barked about \"protecting their heritage,\" while Elize retorted that van Rensburg’s vision would doom them all. The radio, still murmuring its hateful sermon, seemed to feed the discord.\n\nBy midnight, the radio was off. The couple sat at the kitchen table, weary but united in a fragile truce. They agreed that men like van Rensburg thrived on turning homes into trenches, but their relief was bittersweet."
 SAF.175.a: "A precarious household."
 SAF.176.t: "From Guangdong With Love"
 SAF.176.desc: "For many in South Africa, the delicate balance between Germany and Washington was a matter of survival, for it would ultimately shape the nation’s destiny. Yet there was a third great power in the Cold War: the Empire of Japan. South Africa’s neutrality allowed it to maintain trade ties with Tokyo as well, though geography placed natural limits on this relationship. The Japanese heartland lay far across the Indian Ocean, and unlike the Americans or Germans, Japan lacked deep political and economic footholds in the region.\n\nEven so, the harbour of Durban became the gateway for the Sphere. From time to time, Japanese ships arrived to engage in lucrative, high-end trade. While never matching the sheer volume of German or American commerce, Japan found a reliable customer for its industrial goods, while South Africa’s gold and minerals flowed back across the seas to fuel Asia’s industries.\n\nOver the years, this exchange expanded, particularly with the rise of Guangdong. The newly forged nation emerged as the Sphere’s leading partner in trade with South Africa, offering advanced electronics and industrial equipment in exchange for the Cape’s resources. To South African politicians, Guangdong’s modernization and technological progress represented a model worth emulating, an inspiring vision of how the Cape might transform itself in the modern world."
 SAF.176.a: "For no one wanted to see what lay beneath the glittering lights"
 SAF.177.t: "In Memory of Malan"
 SAF.177.desc: "The funeral of Adolph Geysbert \"Sailor\" Malan became a moment of quiet reunion for South Africa’s British exile community. Gathered in solemn respect were not only veterans of both the First and Second World Wars, but also leading figures of the United Party, whose attendance signaled defiance in the face of National Party objections. The South African flag was draped over the coffin of one of the RAF’s most prominent flying aces, which had lost the battle with Parkinson’s Disease just over a week ago. After the war’s end, Sailor Malan returned home to found the Torch Commando, an organisation that opposed segregation in South Africa.\n\nColin Eglin slowly climbed up the stage to the podium, his face clearly filled with mourning over his friend and colleague. Watched upon by large parts of the South African military establishment, he began to speak.\n\n\"We have lost a good man and a good soldier. Someone who rose to the defence of Britain without a second of doubt joined the fight for freedom against its enemies.\" The text for the speech, in a futile effort, had been modified heavily by the United Party to avoid offending the Germans. After a lot of debate, he had been able to keep as much as he could in, staunchly defending the right to honour his friend and the things he stood for.\n\n\"Sailor had always fought the right cause, and with dedication and gallantry, he took part in the Dunkirk operation, achieving vital shootdowns of enemy forces who were trying to sink the good men who were trying to get back to safety.\" Colin’s face turned somewhat at the mention of enemy forces; after all, everyone really knew exactly who he was talking about.\n\n\"After the war’s end, he returned home to lead another struggle, that against segregation and inequality that continues to plague this nation to this day. I was honoured to be a part of the Springbok Legion, which he founded, where veterans of this great war met to bring about a better South Africa. Yet as vital as he was to the good cause, fate struck him down with a debilitating disease that has now sadly claimed his life. Sailor Malan will not be forgotten as a gallant gentleman, deeply involved humanitarian, and one of the finest fighter aces the Royal Air Force has ever produced. South Africa has lost a great hero, who will be remembered forever.\""
 SAF.177.a: "Rest in Peace"
 SAF.178.t: "命运之会"
 SAF.178.desc: "寂静的非洲夜晚，一辆不起眼的汽车驶近南非联邦与东非专员辖区之间的边境哨所。车辆进入哨所附近的照明区域时，两名身穿南非军服的士兵迅速拦住了去路。其中一名士兵走近汽车，示意司机摇下车窗。士兵探头看了看车内，露出笑容：“很高兴见到您，先生。指挥官已等候多时，请跟我来。”\n\n阿尔伯特·赫尔佐格心中忐忑，不确定自己是否真的摆脱了追兵，他下了车，跟上那名士兵。跨过标志边境的白线后，他隐约辨别出黑暗中等候的身影。又走了几步，他终于亲眼见到了那个耳闻已久的人——约翰内斯·范伦斯堡。这意味着边境的南非士兵的确是牛车哨兵成员。“赫尔佐格先生，见到您真好。既然您亲自前来，想必已决心完成必要之事了？”\n\n赫尔佐格点点头，心跳因激动与义愤而加快：“多年来我始终在议会为同胞的权益奔走。但如今，和平显然已不再是一种选择。英裔不断破坏我们引导国家走向正轨的努力，一味纵容仆从和意志薄弱者。我和国民党将全力支持你们介入，建立一个阿非利卡人的政府，带领这个国家走向繁荣。”\n\n范伦斯堡闻言，嘴角咧开灿烂的笑容，伸手作出握手的姿态。“那么我们算达成一致了。我们会不惜一切代价从英裔手中夺回祖国。”赫尔佐格紧紧握住他的手，用力一握。"
 SAF.178.a: "不惜一切代价。"
 SAF.179.t: "越过边界"
 SAF.179.desc: "深夜，靠近专员辖区边境的北方偏远农庄。这里的人们过着朴素的生活，虽不富裕，但靠务农或采矿也能自给自足，远离比勒陀利亚议会的管辖。此时夜深人静，家家户户早已熄灯，居民们沉沉入睡，为第二天的劳作养精蓄锐——唯有海登一家例外。\n\n六岁的彼得·海登在床上辗转反侧。街道上异样的寂静让他难以入眠。烦躁之下，男孩爬出窗户，打算散个步，希望能借此入睡。\n\n“快点！日出前必须赶到比勒陀利亚！”主路上隐约传来压低的说话声。被好奇心驱使的倔强孩子悄悄靠近，尽管天色漆黑，彼得仍能看见一队卡车正疾驰而去，驶向比勒陀利亚繁华的城区。事情有些不对劲，但他一时又说不上哪里异常。\n\n就在这时，一辆卡车上突然传来浓重口音的声音：“蠢货！竟然忘带配枪！在北方你早该上军事法庭了！”彼得顿时目瞪口呆——德国人竟然出现在他家附近！而边境守卫却毫无作为，甚至微笑着放任德国人和他们的牛车哨兵同伙越境！\n\n“喂！小鬼！滚回去睡觉！”一名守卫朝彼得走来，挥手驱赶。男孩呆立原地，喃喃道：“你们为什么不阻止……”\n\n“我这是在为大家谋出路。牛车哨兵会让南非再次伟大。你现在最好乖乖回家，别惹麻烦。”彼得冲回家中钻进被窝，整夜无眠。而到了清晨，一切都已改变……"
 SAF.179.a: "他的生活也天翻地覆……"
 SAF.180.t: "A Plan Derailed"
 SAF.180.desc: "As the sun began to peek over the horizon, the Ossewabrandwag troops sat in utter silence as they rolled into the outskirts of Pretoria in transport trucks. Today, they would embark on a sole objective: to bring down the United Party in a single swoop and take control of all of South Africa. Some were fiddling with their fingers, others were restlessly looking around. When the few civilians who were on their way to work quickly went back inside to hide from the men, the convoy continued onwards. Suddenly, the commander shot his hand up and yelled for the convoy to abruptly halt.\n\nGetting out of their vehicles, the men murmured to each other with uncertainty about why they had stopped. One of the officers in transit with the soldiers approached the commander, with papers in his hands. \"Sir, we’ve lost contact with the central assault unit; they appear to have gone a different direction from us to reach the center of the city.\" He spoke. \"Goddamn it. We’re already unorganized before the fight even starts.\" The commander responded. While attempts to reorganize were being made, a soldier then leaned in from a truck’s driver's side window. \"Commander! Got a light-?\"\n\nSuddenly, a shot rang out from the end of the street, the bullet striking the soldier in the temple, splattering brain and blood everywhere. \"Sniper! Get the fuck down now!\" Shouted the commander. More shots began to ring out, and soon, a mix of city police and SADF men began to arrive, the soldiers coming in more armored vehicles. Bullets flew everywhere as the Ossewabrandwag began to scurry to whatever cover they could find. The commander grabbed his radio for reinforcements, only to be met with the shouts of other units across the city being pinned down and ambushed.\n\n\"This is assault unit southwest, we are pinned down! We have no cover, we’re sitting ducks out here- requesting immediate reinforcements, over!\" He screamed. \"Southwest, this is unit north central, higher command has declared seventy-five percent of all positions to be untenable or on the verge of collapse. We are ordered to retreat from the city and regroup in Rustenburg, over.\" Looking back to see the corpses that littered the street and the blood flowing into the drains, the commander found few options other than to follow the order. Finally, he gave in and declared to his unit.\n\n\"Assault unit southwest, position is untenable! If you can move, then get the hell out of here! If you can carry wounded, do it! Otherwise, get out and retreat out of the city! Now, damn it!\" Still being picked off by South African rifles, the fragmented assault units of the OWB managed to pull out what they could from Pretoria. It was a long ride back to Rustenburg, as the wounded cried openly to their comrades. The units that stayed back looked in horror as they returned to the hastily-made FOB, unable to recognize any of the men, even if they had distinguishable faces."
 SAF.180.a: "Eyes intact or not, all could see the cost of this failure.."
 SAF.181.t: "Hertzog Speaks"
 SAF.181.desc: "At the morning dawn, politicians came in droves through 50th Parliament Street, called to an emergency meeting. Many had heard the gunshots around Pretoria, but none fully knew what was going on. Settling in the chamber, the men sat around on edge, the nicotine of cigarettes failing to calm the crowd. Finally, Albert Hertzog stepped to the front, revealing himself as the one who called the meeting. Whispers echoed into open conversation, even among his own party, to try and determine his motives. Clicking on the microphone, he spoke.\n\n\"I stand in this building today, not to remain as a representative of people who have never represented the Afrikaners, or the pure race! By God, this land will be ruled by the true owners; the Afrikaners!\" He demanded. \"Today, the end of your subjugation begins! We, the pure Aryan race, are the rightful rulers of all nations! And it begins again here, with the end of the degeneration of our society!’ I-\" Hertzog’s words began to fade into the commotion of the room. Looking at his party, many expressed their shock and dismay.\n\n\"Mister Hertzog, are you fucking crazy?! This isn’t how we get legal recognition, coups don’t change that!\" A party member screamed at him. \"You’re going to undo everything we have been fighting for, with the little credibility we had left!\" Another replied. Hertzog gripped the sides of the lectern, his pride and anger mixing into his emotions as he threw insults right back at the crowd. Several members of the National Party stood up and walked right out of the building in protest but there were plenty of them who applauded.\n\n\"You race traitors! Dare you defy me, and turn your back on your own brothers?! Our race?!\" Hertzog blared. As the chaos ensued, several guards began to approach him, locking their arms around him and forming a human shield to escort him from the premises. In his mind, the resistance from his own party didn’t make sense to him. He should be applauded, not reprimanded. To him, it didn’t matter anymore. Any Afrikaner who followed him was a true Afrikaner, a pure white man for a pure race.\n\nBut his confidence didn’t stop thoughts from filling his mind, seeing his party against his methods. Thoughts that there was something truly unforeseen in the coming time, coming to everyone. It was only a matter of time to know if that gut feeling was right."
 SAF.181.a: "A purist racial goal, an impure fortitude to Albert’s mind."
 SAF.182.t: "A Narrow Escape"
 SAF.182.desc: "It was a long journey out of Pretoria, through side routes and detours to escape the Ossewabrandwag forces. Security forces had barely any time to prepare to guard the transportation of the United Party’s politicians and South African elites across the country, with enemies around every corner. Along the way, they had nearly gotten caught on several occasions, but it seemed the universe was on their side today, with their pursuers being held back by loyalist forces that were rapidly rising across the country against the coup committed by the Ossewabrandwag and the National Party.\n\nBut now was not the time to dwell on the past. Now was the time for action to stem the chaos. Cape Town would become the de facto capital for the foreseeable future, and it would need to become the beating heart of the resistance against the invaders.\n\nSupply hubs, government agencies, training camps, air bases, and command centres; all had to be rebuilt right here as the government and military quickly mobilized all available resources to defend their homeland.\n\nThe plotters may have thought they had an easy victory, and that the South African military would collapse when faced with opposition, but they couldn’t be more wrong. Now endowed with a life-or-death energy, the government worked faster and more unified than ever before, determined to maintain its beloved nation by any means necessary. The Ossewabrandwag may have won this battle, but Cape Town was ready for the long haul.\n\nMost importantly, the first frantic calls for aid had already been made, and the direct line to Washington was running red hot. Though the escape may have been narrow at times, it had been vital in keeping the fight for South Africa alive. Even as bad news continued to roll in from all across the nation, the light on the Cape has not yet gone out."
 SAF.182.a: "We have not chosen this war, but we shall win it nevertheless."
 SAF.183.t: "Hertzog Takes Over"
 SAF.183.desc: "Van Rensburg resigns, Hertzog is now the new Prime Minister(?)"
 SAF.183.a: "Congratulations to the new Prime Minister."
 HDV_SAF.1.t: "徐徐展开的画卷"
 HDV_SAF.1.desc: "德·维利尔斯·赫拉夫的书桌异乎寻常地比平日里整洁，尽管今天（以及大多数日子）它依然被如山的信函所淹没。南非总理俯瞰着桌上摊开的大量情报报告、内阁备忘、政情摘要和两份报纸，处理着他日复一日的工作——将这个似乎每天都在分崩离析的国家重新弥合起来。\n\n尽管总理总能奇迹般地在两股截然对立的力量之间走出一条中立之路，但这周，两股格外狂暴的力量却以前所未有的烈度向他猛撞过来。\n\n他右侧的一摞情报报告，描述着阿非利卡人与北方的德国人之间日益增长的经济联系。有鉴于此，赫拉夫决定，他最好能一劳永逸地处理阿非利卡人日渐膨胀的军国主义情绪。毕竟，阿非利卡民兵的规模持续扩大，而围绕此事的政治辩论腔调也似乎愈发强硬。\n\n而在他书桌的另一侧，是另一叠关于非洲人国民大会的文件。该组织旨在为南非那些备受欺压的非洲和班图居民争取权益。然而近来，一群日益壮大的武装分子和极端主义者已经渗透进了非国大的核心，他们一心想要破坏和平、稳定以及赫拉夫花费多年心血苦心经营的宝贵现状。于是，赫拉夫认定为了南非的和平，他最好先着手处理这个问题。\n\n他站起身，想去够到那被泛滥成灾的文件堆挡住的电话，脚下却踩滑了一份掉在椅子下的报告。总理挥舞着双臂，重重地摔在那堆积如山的文件上，一时间，米白与纯白的纸张如骤雨般从书桌两侧倾泻而下。他挣扎着爬起来，颓然坐回椅子里。赫拉夫在那一刻明白，无论会引发怎样的暴力，他最终都必须选择一方来偏袒——为了他自己，也为了他的办公室清洁工。"
 HDV_SAF.1.a: "这下好了，桌子算是彻底“整齐”了。"
 HDV_SAF.2.t: "左翼的绅士们"
 HDV_SAF.2.desc: "副总理扬·亨德里克·霍夫迈尔——一位忠诚的南非白人——在国防部长科林·埃格林走进办公室时推了推眼镜，露出微笑。两人用力握了握手，霍夫迈尔为这位政治伙伴准备了饮品。尽管人生轨迹迥异，他们却志同道合。霍夫迈尔是学者转型的政客，而埃格林曾是二战期间驰骋非洲战场的军人，战后为维护南非退伍军人利益投身政治。\n\n两人怀揣共同目标：推行温和的渐进式改革以保障国家稳定，这与党内顽固维护现状的保守派势力针锋相对。身处两派之间的德·维利尔斯·赫拉夫总理如同缺乏远见的黏合剂，凭借务实的利益平衡手段维系着党派团结。\n\n“您最了解他，扬。难道他真要长期讨好国民党？我们都清楚绥靖政策没能阻止希特勒，反倒助长了他的气焰。要是英法在38年就对德国宣战，后世本可免遭这么多苦难。”埃格林的话语里带着苦涩。\n\n“我始终倡导用务实态度解决问题，可他就像条滑溜的鳗鱼，除了装点门面的改革外不愿多进一步，只想两头讨好。”\n\n“就连德国人公然越境武装支持牛车卫队他都无动于衷？这些他心知肚明！”\n\n“赫拉夫现在保持中立，但等他认清现状无法维持、光讨好南非白人徒劳无益时，定会倒向我们。当然不会带着半分真诚，不过若真能成事……”"
 HDV_SAF.2.a: "“那就这么干吧。”"
 HDV_SAF.3.t: "右翼的绅士"
 HDV_SAF.3.desc: "沃斯·罗是统一党右翼的核心人物，他自称“血统纯正的英裔南非人”。自1902年第二次布尔战争结束以来，英国白人精英阶层始终牢牢掌控着南非政权，而维护这一传统格局便成了罗的使命。尽管他未必认同赫拉夫那种优柔寡断、缺乏鲜明立场的政治作风，但仍选择支持这位总理——毕竟在维护统治阶层利益方面，赫拉夫的成效与能力早已得到验证。至少过去确实如此，但罗与身边所有人都心知肚明，眼下局势正在急剧恶化。被流放的牛车哨兵仍在持续制造骚乱，而非洲人国民大会中的共产主义者虽遭全力镇压，却似乎愈挫愈勇。\n\n在他心中唯有一条正道：必须果断镇压那些鼓吹平权、土地改革与废除种族隔离的土著暴发户。此举既能向阿非利卡人证明统一党同样代表他们的根本利益，又能一举化解这场悄然降临的危机浪潮。只要以铁腕肃清跳梁小丑与异见共产党人，分裂主义的声音必将永远沉寂！如此天衣无缝的计划，只有蠢材才会拒绝实施。\n\n毕竟维护法律与秩序高于一切，为此付出任何代价都在所不惜。非洲土著与阿非利卡人都将认清自身定位，共同臣服于盎格鲁人的英明领导——这个命中注定要永远统治这片土地的族群，必将以雷霆手段捍卫其神圣权柄。"
 HDV_SAF.3.a: "保持冷静，继续前行。"
 HDV_SAF.4.t: "在其之下"
 HDV_SAF.4.desc: "“是，大使……不，大使……我们能解决的，大使……当然，大使……”通话持续着，雅各布斯·施特劳斯竭力保持耐心应对德国大使的要求。“不，大使，那绝非我们的本意。当然不是，我们只是在维护中立国的权利——”\n\n他被提拔为南非联邦外交部长，与其说是出于个人抱负，不如说是赫拉夫在施特劳斯输掉领导权选举后施舍的安慰奖。如今他深陷这场单调的中立游戏，竭力平衡两个超级大国对南非的拉扯——每当一方增加贸易投资，另一方立刻跟进反制。而夹在中间的南非却因经济腾飞与国家高速发展显得欣欣向荣。\n\n“感谢您，大使先生。祝您今日愉快。”他将听筒重重砸回座机，仰靠椅背发出一声压抑的懊恼低吼。外交这场游戏他早已驾轻就熟，但不得不终日应付德国人和美国人的轮番指责仍令他如鲠在喉。\n\n他抬眼看向走进办公室的助理。“总理正在一号线等候，先生。”\n\n施特劳斯点头示意，助理悄然离去。他带着烦躁的怒视紧盯电话，深吸一口气，再度拿起听筒——这仿佛已是今天第一百万次重复的动作。"
 HDV_SAF.4.a: "“总理阁下，我能为您做些什么？”"
 HDV_SAF.5.t: "法律与秩序"
 HDV_SAF.5.desc: "开普敦最小的会议室里挤满了统一党的政要们，每个人都在纳闷德·维利尔斯·赫拉夫究竟为什么要以如此荒唐的方式召集会议。赫拉夫提出了如何应对开普地区不断升级的危机这一问题。然而当天党内各派系间的核心辩论，都被鲜少参与讨论的总理密切注视着。埃格林与沃尔之间出乎意料彬彬有礼的辩论持续了太久，直到赫拉夫终于提高嗓门才被打破。“够了！”整个房间顿时鸦雀无声。\n\n他从座椅上起身。“显而易见，我们无法与非国大理性沟通。他们的激进行径无止境地持续，我们都很清楚共产主义者已深度渗透其阵营，企图将南非变成马克思主义极权国家。这个国家是两大族裔——阿非利卡人与英裔——的联合体，其他所有人都应当安守本分。”\n\n“唯有对非国大及其盟友、支持者、行动人员采取强硬镇压，才能为南非带来和平。”罗十分赞许地点头，而霍夫迈尔则退出会议室，不愿再听首相接下来的讲话。\n\n“我们需要倾尽所有资源强化国内安全行动，遏止他们的抗议活动，破坏他们的行动部署，向所有人昭示这个国家由谁主宰。通过我们的行动缓解担忧后，国民党的挑衅姿态终将再次消退。我恳请诸位为了我们的人民和南非共同参与这项计划！只有对非国大采取迅速果断的行动，才能让我们的国家重归稳定。”"
 HDV_SAF.5.a: "霍夫迈尔的梦想就这样在党内同僚的掌声中支离破碎。"
 HDV_SAF.6.t: "驶向冰山"
 HDV_SAF.6.desc: "霍夫迈尔摘下眼镜，揉了揉酸胀的双眼。赫拉夫在全国范围强硬镇压非国大的声明让他感到天旋地转，这种只会让国内本就深不见底的裂痕愈发扩大的决策，令他既愤怒又绝望。暴力从来只会催生更多暴力，如今这位以务实著称的领导人似乎彻底丧失了理智。\n\n他下定决心不再沉默，绝不能为这一招致灾难的愚行背书。他毅然抓起钢笔在信笺上奋笔疾书。这封措辞严谨却力透纸背的辞职信中写道：赫拉夫的阴谋诡计只会将混乱、暴力乃至战争的火种撒遍全国。不仅是战争，他补充道，当这个国家在毁灭边缘摇摇欲坠时，谁又能预料虎视眈眈的德国人会做出什么？虽然自知无力阻止这场浩劫，但至少不必让自己的名字与这个可怕的错误联系在一起。正如预料，埃格林满脸郁色地推门而入。他在对面落座，扫视着信纸：“你这是干什么？”\n\n“提交即刻生效的辞呈。维利尔斯·赫拉夫已经疯了，我可不打算为后续恶果负责。”\n\n“什么？不，这步棋走错了。辞职就意味着丧失政治影响力，我们还怎么把国家拽出深渊？”埃格林一把夺过信纸撕得粉碎，强行塞进右侧废纸篓，“再怎么沮丧也得坚持下去，必须逼赫拉夫逐步收回成命。等他的计划破产时，我们才能立即接手收拾残局。扬，为了南非人民，你必须留在体制内周旋。”\n\n“我们还能挽回，扬，虽然前路艰难。”"
 HDV_SAF.6.a: "进步向来不易，但永远值得。"
 HDV_SAF.7.t: "国外的威胁"
 HDV_SAF.7.desc: "开普敦最小的会议室里挤满了统一党的政要们，每个人都在纳闷德·维利尔斯·赫拉夫究竟为什么要以如此荒唐的方式召集会议。赫拉夫提出了如何应对开普地区不断升级的危机这一问题。然而当天党内各派系间的核心辩论，都被鲜少参与讨论的总理密切注视着。埃格林与沃尔之间出乎意料彬彬有礼的辩论持续了太久，直到赫拉夫终于提高嗓门才被打破。“够了！”整个房间顿时鸦雀无声。\n\n他从椅子上站起身来。“现在情况已经再明显不过了——在海外流亡的东非政府纵容下，牛车哨兵铁了心要暴力分裂国家。非国大固然是根深蒂固的隐患，但我不认为他们会发展到领导日益壮大的武装民兵。而牛车哨兵的威胁极其严峻，其影响力仍在持续扩大。”\n\n罗用恼怒的目光死死盯着他，而霍夫迈尔脸上浮现出若有似无的笑意。“牛车哨兵虽同为白人，却已决心以暴力手段背叛南非，我们必须以雷霆手段铲除。我恳请诸位为了人民和南非参与这项计划！唯有解决牛车哨兵，才能为国家带来稳定。”"
 HDV_SAF.7.a: "就这样，沃斯的担忧愈发加重了。"
 HDV_SAF.8.t: "西装革履的愚者"
 HDV_SAF.8.desc: "这是沃斯·罗听过最荒谬的言论。放着深入整个国家的威胁不管，却专注于北方的牛车哨兵？德·维利尔斯·赫拉夫终于疯了，这个油滑愚蠢的混蛋肯定被那个脱离现实的傻瓜霍夫迈尔的胡言乱语灌满了脑子。总理怎么会认为这能解决原住民多数派的问题？尽管他和统一党的其他人一样鄙视牛车哨兵，但他们既没有足够人数也没有实力造成实质性影响，不像觉醒的原住民群体足以摧毁现有秩序。\n\n他立即开始考虑脱离统一党。他知道能召集许多志同道合的同僚组建新党派，以恰当文明的方式维持现状。\n\n但这难道不会最终增强国民党的力量吗？北方那群背信弃义的家伙可是迫不及待想与盎格鲁文明的敌人——德国合作。一想到要在南非白人面前示弱，他暂时打消了这个念头。尽管对德·维利尔斯·赫拉夫转向绥靖政策极为不满，但他拒绝将优势拱手让给议会反对党——这些人和非国大一样对南非构成威胁。毕竟，进步派再愚蠢也确实支持着代表盎格鲁权力的统一党。\n\n眼下，他决定按兵不动静观其变。毕竟……"
 HDV_SAF.8.a: "“真正的绅士从不鲁莽行事。”"
 HDV_SAF.9.t: "解决一个问题"
 HDV_SAF.9.desc: "德·维利尔斯·赫拉夫心满意足，对非国大采取行动的决策已见成效。其成员不是仓皇逃窜就是身陷囹圄，更有不少人正从加速放弃温和路线——这条道路终将导致他们覆灭。如今他们已沦为恐怖分子、煽动者和极端主义者，这只会让警方和军方对他们的处置更具正当性。\n\n他搁下批阅完的一叠文件，转而聚焦阿非利卡人的最新动态。越是研读报告，他的眉头锁得越紧。这些人难道不明白，他正在替他们肃清威胁，他们根本无需再从南非分裂出去？可在非国大天翻地覆时，阿非利卡人却表现得仿佛一切如常，仿佛他颁布的政令对他们毫无影响。赫尔佐格仍在公开发表演说抨击他与和平阿非利卡人党，而关于德国干涉并支持布尔民兵的报告依旧源源不断。\n\n忘恩负义——这就是他们的嘴脸。政府明明同等保障了他们和英裔的权益，可这些人仍沉溺在1902年失去独立的怨恨中。那都是上辈子的事了，当下他们却还在积蓄力量对抗国家，铁了心要分裂国土，心甘情愿地给德国人当傀儡和奴隶。\n\n令人焦躁的念头正悄然滋长：或许当初该优先对付阿非利卡人而非非国大？当然他绝不会向任何人承认这点。赫拉夫靠在椅背上，一抹冷笑浮上嘴角，内心的不安也随之平息。他自有办法周旋，就像在两大超级大国间左右逢源一般，继续让非国大与布尔人互相牵制。"
 HDV_SAF.9.a: "无论时局如何跌宕，德·维利尔斯·赫拉夫始终是赢家。"
 HDV_SAF.10.t: "适应"
 HDV_SAF.10.desc: "帕特里克·沃尔怒视着总理，等着聆听后者又炮制出了什么愚蠢政策。那条西装笔挺的笑面蛇端坐办公桌后，伸手取过一叠文件夹滑向桌对面。“沃尔……选举制度改革后，1965年非国大将成为不可小觑的选举力量。”\n\n“这都是拜你所赐。”沃尔猛然前倾身子，控诉般竖起手指，整个人的重心都压向桌面，“是你的选择。”\n\n“没错。”赫拉夫面不改色地继续道，“正因如此，联合党下次大选必须推出有色人种候选人，长期稳固关键票仓，确保他们继续支持和平阿非利卡人党而非另立门户，更糟的是倒向非国大。为此我已下令扩大帮扶计划，增加对有色人种的发展援助，同时确保更多有色人种进入地方政府任职。这些是下届选举几位潜力候选人的档案。”赫拉夫悠然靠向椅背，准备迎接沃尔徒劳无用的反驳。\n\n“可悲的懦夫……你玩得太过火了，党内和我持相同意见的大有人在！把国家拱手让给他们将是何等灾难！我现在就辞去职务，退出政党！”沃尔厉声唾弃道。\n\n“我是在为联合党谋求新南非的执政地位。有色人种不过是实现目标的工具。你大可带着一群人退党，最终让国民党掌握权力，我丝毫不在乎，也可以留在党内继续推行你的事业。与其在体制外坐视事态发展束手无策，不如留在权力核心……”他将沃尔怒火中烧的沉默视作会议圆满结束的标志。“祝愉快，帕特里克。感谢你来拜访。”"
 HDV_SAF.10.a: "安全、渐进、可控的进步也是进步。"
 HDV_SAF.11.t: "总理讲话"
 HDV_SAF.11.desc: "总理的讲话通过电视和广播向全国播送，传遍了国土上数百万不同民众的耳中。\n\n“南非同胞们。国家正面临危急时刻，政府为此作出了关乎全民利益的重大决策。我们已开始严厉打击非洲人国民大会及其背后的共产主义渗透网络。”\n\n“特定地区的集会临时限制令将严格执行，我们铲除这些马克思主义与极权主义黑暗网络的行动也将进一步强化。”\n\n“与此同时，地方民兵体系将被解散。唯有在民主选举产生的政客监督下的警察力量，才能守护我们伟大国家的社区与城市。我向所有人强调，民间私刑属于犯罪行为，任何参与者都将受到迅速而彻底的惩处。”\n\n“谢谢各位，晚安。”讲话结束时，赫拉夫露出微笑，全然确信自己的雄辩之才将再次让南非人民倒向统一党阵营。"
 HDV_SAF.11.a: "时间会给出答案。"
 HDV_SAF.12.t: "中立之终"
 HDV_SAF.12.desc: "曾经井然有序按来源日期归档的文件系统，如今已沦为混沌的泥沼。赫拉夫的办公桌被无边无际的文件沼泽吞噬，正如他同样混乱失序的思绪。这位深陷在办公椅中的总理眼袋浮肿得骇人，尽管极力掩饰，周围人都看出他在短短十日里苍老了十岁。桌上电话发疯似地尖啸，他却任由那刺耳的指控声划破空气。他与党派苦心经营的一切，就在布尔人席卷全国的二十四小时内化为泡影。这早已不是分裂叛乱——德国人正通过布尔人之手，要吞下整个南非。\n\n铃声再度炸响，德·维利尔斯·赫拉夫抓起听筒。电话那端埃格林的声音里透着同等绝望：“总理，德国殖民地正调兵南下，准备与布尔叛军合流。我们竭尽全力拖延，但眼下唯一的生机就是等美国人伸出援手。”\n\n“还能撑多久？”\n\n漫长的沉默差点让赫拉夫以为通讯中断。最终埃格林挤出三个字：“不知道。”\n\n“辛苦了。”赫拉夫摔下听筒，盯着黑色的电话机陷入恍惚，南非珍贵的中立已不复存在，如今他只能跪求山姆大叔来抵挡德国人的钢铁洪流。所有维稳的努力都被布尔人和南非视为败绩，整个局势如坠深渊。\n\n这位素以“保留所有选项择其最优”自傲的政治家，此刻被逼到了别无选择的绝境。他沉重地抓起布满凹痕的电话，按下美国大使馆的号码。在等待接通的间隙，赫拉夫深吸一口气，准备进行人生中最屈辱的谈判。"
 HDV_SAF.12.a: "“总理，这一刻还是到来了！”"
 HDV_SAF.13.t: "地狱美景"
 HDV_SAF.13.desc: "直升机桨叶持续不断的轰鸣声中，丛林树木在舷窗外飞速掠过。这架临时喷涂上南非国旗的美制直升机正向北疾驰，准备对东非补给站发动突袭。机舱内弥漫着紧张气氛，唯有一人例外——当所有人都在炼狱降临前的窒息时刻绷紧神经时，右侧舱门机枪手座上的理查德·林德斯却表现得出奇平静。\n\n他凝望着眼前波澜壮阔的丛林画卷。远处印度洋正泛着粼粼波光，朝阳从东方的浪尖跃起，将海面染成璀璨的金色。在这地狱般的战争中，他竟捕捉到了转瞬即逝的绝美画面。跃动的海面折射着朝阳，仿佛能看见新生的日光正推着浪涌前行。他痴痴凝视远方的海平线，嘴角不自觉扬起微笑。\n\n骤然掠过的流弹声将他拽回现实。直升机猛地右倾规避火力时，理查德条件反射般检查了M60机枪的弹链，随即向曾经令他沉醉的风景疯狂扫射。在混乱中勉强稳住准星后，他将火力集中到丛林公路上疾驰的汽车，顷刻间将其撕成碎片。\n\n“预计五分钟抵达！”驾驶员从前舱传来的吼叫让理查德抹了把眉间冷汗。当他再度回望，航线已然改变，那片令他魂牵梦萦的海域彻底消失在视野中。他默默检查枪械，将身体调整成战斗姿态，迎接即将到来的腥风血雨。"
 HDV_SAF.13.a: "难忘的一瞬。"
 HDV_SAF.14.t: "清仓日"
 HDV_SAF.14.desc: "安东尼·维克斯扫视着进出军械库的士兵们，五年来他一直驻守着这座仓库。前线战况之危急，他心知肚明：在非洲之盾的干预下，这场战争对南非而言已成存亡之战。早在战争爆发前，随着紧张局势升级，“他的”军械库就经历了第一波物资调拨。非洲之盾正式参战时，第二波调拨直接清空了整间整间的库房，所有装备都通过铁路紧急运往前线。\n\n但今日所见实在荒谬至极。尽管军械库储备已严重枯竭，可那些本该躺在博物馆里的老古董，从布尔战争到一战时期的老枪械居然也被翻了出来。毛瑟C96、Kar 98、李-恩菲尔德，他甚至还看见一把西部拓荒时代的柯尔特单动左轮被塞进木箱，即将启程运往前线。\n\n终于，他忍不住冲着负责清库的下士高声质疑：“这些破铜烂铁能顶什么用？面对德军的现代化装备，六十岁的老枪管连烧火棍都不如！”\n\n“民兵部队正在紧急武装，能打响的枪就是好枪。”下士头也不抬地呵斥道，“别跟个桩子似的杵着，赶紧搬箱子！天黑前必须清完！”安东尼不情不愿地加入搬运队伍，心里为那些即将握着这些老古董上战场的可怜虫们默哀。"
 HDV_SAF.14.a: "绝望的叹息。"
 HDV_SAF.15.t: "寂静"
 HDV_SAF.15.desc: "巡逻队悄无声息地接近丛林中的空地。先头兵穿行于树丛间试图探查情况时，一股烹饪的气味突然袭来——不，不是烹饪，是肉味，肉干、烤肉之类的气息。他从树后窥视那片开阔地，只见曾经村落的残骸已化为焦土。几处灰堆标示着房屋的原址，煤灰中支棱出的白骨昭示着里面的人被活活烧死。\n\n右侧的中央火塘里，不知多少具人形焦炭以扭曲可怖的姿态堆积着。最令这名巡逻兵震撼的是此地绝对的死寂。或许他突然失聪了，但周遭确实听不见任何声响，连苍蝇的嗡鸣或丛林的窸窣都没有。声音早已逃离此地，居民们的生命絮语已被死亡毁灭体系的仆从们彻底扼杀。\n\n约莫十秒间，他扫视完整个场景，随即快步折返巡逻队。与战友们目光相接时，他眼中浮现出某种怪异而疏离的神色，同时下达了行动指令：“我们绕开这片空地。没有敌情，但你们绝不想看见这里的景象。在地图上标注为乱葬岗，然后赶紧离开这个鬼地方。”"
 HDV_SAF.15.a: "愿灵安息。"
 HDV_SAF.16.t: "供给与需求"
 HDV_SAF.16.desc: "作为自由市场的坚定拥护者，德·维利尔斯·赫拉夫对自身处境心知肚明。多年来南非周旋于美德两国之间，既与北方的元首党羽虚与委蛇，又与美国驻南非企业保持往来，以此维系着精妙（且利润丰厚）的战略平衡。但如今，忘恩负义的布尔人与其幕后操盘手非洲之盾却不惜打破平衡，妄图通过一场残酷的战争吞并整个南非。\n\n在决定盟友这件事上，他早已别无选择。唯有美国能拯救南非，但对方必将借此在各项经济谈判中占据绝对优势。这场生死存亡之战中对美援的需求永无止境，而美国人可以随心所欲地削减援助规模，这让他彻底陷入了被动。\n\n此刻他不得不将经济命脉零敲碎打地出售给美国佬，只求维系援助渠道，让租借物资继续流入开普敦。他仅存的策略就是与近来频繁出入其办公室的美国商贾合作，确保他们深陷南非事务的泥潭。这些权贵为了保全德国胜利后的自身投资，自会游说美国政府提供更直接的军事支持。\n\n尽管出卖国家利益令他痛心，但战败的代价更为惨重。市场法则固然残酷无情，但总好过让德国的铁蹄永远践踏南非的国土。"
 HDV_SAF.16.a: "胜利的代价。"
 HDV_SAF.17.t: "新战线"
 HDV_SAF.17.desc: "战争的真实规模显现时，南非通信部便仓促组建起来。艺术家、作家、政府官员和官僚们齐聚开普敦一家老旧的报刊印刷厂，共同应对这场战争中至关重要的战线——宣传战线。\n\n这里是信息被收集、研判、精心包装后向全球发布的枢纽，旨在巩固南非的国际立场……或至少维系其表象。布尔人与德军的暴行证据被系统汇编，配以尖锐评论，日复一日地通过国际新闻媒体传播。讽刺的是，敌人们正乐此不疲地为南非提供着证明其事业正义性与崇高性的充足素材。\n\n与此同时，任何失误都会被精心修饰、重新包装；若实在难以粉饰，便彻底封杀，所有证据和痕迹都将永久抹除。印刷机昼夜不停地赶制海报与宣传册，这些歌颂南非军队与国家荣光的物料将分发至全国每个角落。各大报社与广播电台均在此常驻代表，而电视新闻片与影院新闻纪录片则构成最后一道传播屏障，将南非官方叙事直接灌输给民众。通信部虽无力改变战场现实，却掌握着左右公众认知的无形权力——这种话语权本身便是另一种形式的武器。"
 HDV_SAF.17.a: "毕竟，信息才是最强大的武器。"
 HDV_SAF.18.t: "沿路而行"
 HDV_SAF.18.desc: "卡车在乡间小路上疾驰，随着路面起伏上下颠簸。虽说乘坐体验不算舒适，但特鲁斯·弗洛特曼坦然接受了这一切。毕竟车后厢装载着据指挥官所说“前线急需的补给”。想到自己成了军队的一员，她仍觉得不可思议——尽管征召女性加入陆军后勤部队担任辅助岗位的号召传来时，她毅然报了名。\n\n倒不是出于保家卫国的热忱，促使她做出这个决定的有两个更务实的原因：这份工作的报酬相当丰厚，足够支撑她的日常开销；更重要的是，她心底还藏着与丈夫莱纳德重逢的渺茫希望。虽然战线绵延千里，这种期盼近乎痴想，但或许命运女神会格外垂怜，让她能亲口对丈夫诉说衷肠，而不必苦等下一封姗姗来迟的家书。\n\n突然间，机枪子弹从空中倾泻而下，前方路面顿时土石迸裂。特鲁斯猛踩刹车，但转瞬间子弹便撕裂驾驶室，引燃了后方装载的物资。奇迹般未被击中的她，眼睁睁看着火势在身后急速蔓延。尽管车速正在减缓，但直觉告诉她等不到完全停下了。千钧一发之际，她拉开车门纵身跃出，任由化身为火球的卡车继续向前冲去。\n\n浑身擦伤的特鲁斯在路旁草坡上翻滚着停下，发出痛苦的呻吟。她踉跄起身的瞬间，远处那团移动的火球恰好发生剧烈爆炸。冲击波将她再次掀翻在草丛中，耳畔嗡鸣中世界仿佛陷入沉寂。\n\n她仰面躺在草地上大口喘息，模糊的视线望向天空，周遭的一切都变得遥远而静谧。"
 HDV_SAF.18.a: "冒险，回报，还有悔恨。"
 HDV_SAF.19.t: "驱逐"
 HDV_SAF.19.desc: "卡车停下后不久，后门哗啦打开，一名士兵扫视着蜷缩在车厢里的各族村民。“都出来吧，欢迎来到新家。”士兵用磕磕巴巴的祖鲁语说道。人们的脸上写满了不情愿——任谁被赶出世代居住的故土，押送到几小时车程外的驻军村落，都难有好脸色。\n\n这群人陆续下车，映入眼帘的是个仓促搭建的村庄。歪斜的栅栏围着粗劣的防御工事，有间茅屋连屋顶都没盖全，所有建筑都透着一股廉价。村落两端矗立着哨塔，持枪士兵居高临下监视着一切。\n\n队伍中最年长者试图再次与士兵理论，对方却只是用枪管指了指某片房屋。老人退后几步，看着族人卸下寥寥无几的家当，极不情愿地钻进指定的屋子。那些阴沉的面孔与含混的语调，将他们的愤怒明明白白甩在了士兵脸上。\n\n士兵心知肚明，这项安置计划早就在层层审批中变了味，如今不过是开普敦那帮官僚闭门造车的产物，注定要以惨败收场。基层执行者都看得透彻，可上头根本不在乎现实困境。\n\n但军令如山，他只得硬着头皮落实这项短视政策。待新移民勉强安顿完毕，他板着与流离失所者们同样阴沉的脸，继续执行巡逻任务。"
 HDV_SAF.19.a: "抱怨也改变不了什么。"
 HDV_SAF.20.t: "美式解决方案"
 HDV_SAF.20.desc: "这张被反复涂画地图早该更换了，但指挥官杰克·卢维森觉得再画一次也无妨。他俯身凝视着德属西南非的地图，通往港口小镇吕德里茨的道路上已标出德军据点的近似位置。杰克抬眼望向坐在长桌对面的美国同事——对方墨镜后的眼神难以捉摸，正啜饮着罐装美式啤酒——开始阐述夺取小镇的作战方案，随着计划推进在地图上勾勒出部队行进路线。\n\n“我们应该向北推进，切断奥斯到吕德里茨的公路。只要补给条件允许，就立即向左迂回完成合围。”\n\n美国人闻言轻笑出声，放下啤酒罐摇了摇头。“杰基啊杰基，你的思路还是太老派。我们就在海岸线边上，我可以直接呼叫舰队和空军支援。新计划是这样的——”他抓过马克笔，从地图南端往吕德里茨画了条笔直的箭头。\n\n“咱们直接用海陆空三栖火力把沿途所有障碍轰成渣，直到那些德国佬彻底断气。既然能用155毫米炮弹反复犁地，何必让小伙子们去送死？”说完啪地扣上笔帽，将马克笔随手抛在地图中央。"
 HDV_SAF.20.a: "最终就这么办了。"
 HDV_SAF.21.t: "种族官僚制"
 HDV_SAF.21.desc: "理查德·福金森带着笑意看向帕特里克·梅莱塔，这位白人检察官用志得意满的眼神打量着眼前的有色人种公务员。“我知道你在搞什么把戏，帕特里克。”他将几份文件甩到桌上，档案上满是批注与标记，“种族变更”的印章赫然在目。“你以为没人会发现你给黑人登记有色人种身份？真觉得能逍遥法外？”\n\n“逍遥法外？！”帕特里克挺直腰板反击，心知事已败露。“看在上帝份上，这些人和我长得一模一样，却享受不到同等权利，简直荒谬绝伦。我不过是做了正确公平的事。”\n\n理查德倾身向前，用威压的目光逼视他。“你是个伪造文件、欺诈政府的罪犯。”话音刚落却又靠回椅背，重新挂上笑容。“自以为是什么英雄救世主？那可得付出代价。从今往后，每月把你工资的两成现金装信封交给我，我就对你可悲的英雄主义睁只眼闭只眼。否则——”他敲敲档案袋，“我随时能让你去罗本岛度五年假。趁我还没向有关部门提交报告，最好赶快决定。”\n\n帕特里克无言沉默，眼底压抑着怒火。他恨不得痛斥这个混蛋，但明白那无济于事。约莫十秒后，他微微点了点头。\n\n“合作愉快。下周一我要见到第一个信封。”理查德用嘲弄的口吻宣布，收拾证据离开时，身后只余下满腔怒火的男人。但帕特里克暗自庆幸——即便代价沉重，他仍能坚持行正义之事。"
 HDV_SAF.21.a: "原则的代价。"
 HDV_SAF.22.t: "遥远的视界"
 HDV_SAF.22.desc: "历经科学技术的蓬勃发展，南非已从技术蒙昧的泥沼中脱颖而出，并走出了一条独具特色的道路。电视传媒产业在保持强大影响力的同时，其割裂态势仍与这个国家的现状如出一辙。1952年，南非效仿世界先进国家范例，晚间开始播送由政府垄断的单一电视频道。官方新闻之后引进的英美电视节目，极大巩固了这些强国在南非英裔群体中的影响力。\n\n而在阿非利卡人聚居区，电视被视作洪水猛兽。阿尔伯特·赫尔佐格屡屡谴责电视是灌输现代价值观、瓦解阿非利卡传统的恶魔。这位煽动家坚称“英国精神毒品”将毒害儿童、欠发达群体及其他种族，因此必须全力抵制。\n\n对于有色人种群体而言，电视普及率正稳步提升。富裕阶层将电视机视为身份象征竞相购置，贫困地区的社区中心也设有公共电视，确保各阶层民众都能收看最新节目，聆听将政府形象粉饰得光辉灿烂的联合党新闻。\n\n至于南非原住民，电视仍是只闻其名的奢侈品。虽有少数社区集资购买，但大多数人只能收听国营广播。非国大运营的地下电台时而闪现，旋即遭到急于消灭异见的政府追剿。\n\n尽管电视发展阻力重重，它已然成为南非人生活中不可或缺的独特存在，并将在未来持续发挥其深远影响。"
 HDV_SAF.22.a: "国家的缩影。"
 HDV_SAF.23.t: "有色人种"
 HDV_SAF.23.desc: "有色人种，这是白人主子赐予他们的称谓。南非历史如图一幅由世界各地移民绘就的狂野画卷，其中便包括兼具欧洲、印度、科伊桑甚至印尼血统的有色人种。有色人种主要聚居在南非西部及开普地区，在这个人为构建的种族等级体系中占据特殊位置。他们被刻意与黑人群体区隔开来，构成了南非社会的中下层主体——工厂劳工、商铺店主、基层公务员和农场主，是支撑国家运转的重要基石。\n\n人为的族群划分带来了一项巨大特权：他们享有远胜黑人同胞的待遇。虽然拥有选举权，却只能投票给白人议员，而这些人往往罔顾他们的诉求；唯有在开普地区的地方议会中，少数有色人种政治家才得以跻身。\n\n南非统治精英显然将有色人种视为对抗非国大的战略盟友，不仅建立专项联络机构，还斥巨资推行政府计划来保障其物质利益，使之成为联合党的又一票仓。毕竟，若能既让这群人安居乐业，又不危及联合党的权力根基，这样的合作终将令各方受益——当然，不包括那些被刻意划归其他种族、排除在福利体系之外的群体。"
 HDV_SAF.23.a: "不好不坏的生活。"
 HDV_SAF.24.t: "文书工作"
 HDV_SAF.24.desc: "一只手掠过关于北方局势的简报，在日期处稍作停顿。一经确认，便抓起文件归入既定位置。迪夫那套沿用多年的桌面文件分类系统终于恢复了原貌。\n\n纷乱的日子已然终结，生活本该回归常态——但所谓的常态，恐怕早已不复存在。自阿非利卡人发难以来，时局剧变，最关键的莫过于如今他已栖身于美利坚雄鹰的羽翼之下，而华盛顿在平权事务上施加的压力正与日俱增。\n\n人口统计的数字对他极为不利，眼下他正苦思冥想：如何在和平时期延续战时那般牢固的权柄？战争期间，联合党与国家机器在这场自由之战中同心协力；可如今战事平息，各方势力必将重归割裂，使权力维系变得比从前更为棘手。\n\n随着本届任期临近尾声，唯有一条路可走，那便是雷厉风行地启动南非重建计划，待首批成效初显便立即推动新一轮大选。\n\n毕竟对他而言，保住权位才是至高无上的法则。"
 HDV_SAF.24.a: "是时候收拾残局了。"
 HDV_SAF.25.t: "清扫残敌"
 HDV_SAF.25.desc: "美制M113装甲车疾驰在开普敦以北的热带草原上，高速行进的车身不断打滑。车内六名士兵虽身着美军制服、手持美式枪械，却都是土生土长的南非人。\n\n远处出现一座半毁的农场大宅。这座看似荒废的建筑物上层突然射出子弹，炮手立即还以弹雨，密集火力直扑二楼窗户。随着刺耳的刹车声，车辆骤停，士兵们从尾部鱼贯而出，分左右两翼包抄农舍。与此同时，M113重新发动引擎向前突进，意图吸引敌方火力。\n\n建筑内爆发出布尔语叫骂声，双方激烈交火。但有名士兵并未参与侧翼进攻——迈克尔·朗斯特里特这个农场长大的猎户之子绕到建筑物后方，恰好看见三名武装分子夺门而逃。他沉稳地举起步枪，对奔跑的身影扣动扳机。\n\n第一个逃亡者应声倒地，惨叫声清晰可闻。第二个试图蛇形走位，却被迈克预判轨迹，追加的两发子弹将其撂倒。第三人回头看见同伴的尸首，突然刹住脚步。他扔掉武器，双手抱头缓缓转身，与迈克四目相对。\n\n迈克单手端枪，右手示意对方靠近。这个两鬓斑白、五十多岁的老者走近时，右臂红白黑三色袖标终于暴露在晨光中。"
 HDV_SAF.25.a: "轻轻松松。"
 HDV_SAF.26.t: "国门敞开"
 HDV_SAF.26.desc: "南非通信部向和平时期的转型并不复杂，因为国内外宣传需求依然旺盛。上级下达将推动移民作为新阶段工作重点的指令后，整个OFN及印度等特定中立国便铺天盖地涌现出将南非描绘成“黄金新边疆”的广告。\n\n这片沃土拥有丰饶的农田、黄金与钻石，尚待开垦的广袤土地能为时运不济者提供新生。这个自由国度不仅顽强抵御了纳粹狂潮，还将如南方凤凰般浴火重生。南非这片充满机遇与冒险的黄金之地，将为您开启人生的新篇章。\n\n当然，宣传中只字未提的是，这一移民倡议实为联合党针对黑人多数群体的又一场人口政治博弈。“不正确种族”的申请者会突然面临官僚壁垒，获准入境的几率骤降甚至被暗中封堵，而其他族群则畅通无阻。\n\n但成效显而易见：开普敦港迎来了源源不断的移民潮，怀揣梦想的异乡人正奔赴这片遥远的大陆构筑未来。"
 HDV_SAF.26.a: "崭新的机遇之地。"
 HDV_SAF.27.t: "废品收购"
 HDV_SAF.27.desc: "“一百兰特？”有色人种农夫极度不满地瞪着眼前的白人废品场主，这家废品场坐落在东伦敦市北郊。他指着那辆绑在拖拉机后的破损坦克说：“这可是能修复的军用品，拾掇好了转手就能卖给军队，你居然只肯出一百兰特？”开什么玩笑！他费尽周折才把这铁疙瘩拖来，换来的却是对方施舍般的报价。\n\n废品场主再次扫视坦克残骸，侧装甲上两个狰狞的弹孔赫然在目，隐约还能看见舱室内凝固的血迹。\n\n“你以为这种战损坦克是能随便拆出宝的？老子得先清理，再切割分解，最后还得找销路。听着，要么拿一百兰特滚蛋，要么带着你这堆废铁去别处现眼。”\n\n“两百。”农夫梗着脖子还价。\n\n“一百二，不能再高了。”\n\n农夫盯着坦克侧面的破洞咬了咬嘴唇，最终长叹一声握住对方的手。\n\n场主立刻换上虚情假意的热络，指向废品场中央的铁皮屋：“来来来老兄，咱们办公室签个单子，这一百二十兰特你揣兜里就能回家喽。”"
 HDV_SAF.27.a: "铸坦克为犁。"
 HDV_SAF.28.t: "复员"
 HDV_SAF.28.desc: "阿德里安·沃尔曼三年来第一次踏上故乡布鲁纳韦格村的土地。那段远离爱人特鲁丝、独自煎熬的漫长岁月宛如地狱。当拐过熟悉的街角，看见自家房屋完好如初，仍保留着三年前自己应征入伍时的模样时，他长舒了一口气。\n\n钥匙转动门锁的声响中，他嘴角的笑意始终未褪。前线作战时，与妻子频繁往来的书信曾是抵御孤独的盾牌，但他的心早已为这一刻悸动了千百个日夜。\n\n“特鲁丝？特鲁丝！亲爱的我回来了！”他雀跃地冲进厨房，却见妻子非但没有迎上来，反而惊慌失措地背过身去。她急促的呼吸声在寂静中格外清晰，单薄的身躯正止不住地颤抖。\n\n“怎么了？发生什么事了？是我啊，阿德里安，这次我再也不走了。”当特鲁丝终于缓缓转身，他看见她右眼戴着黑色眼罩，半边脸庞布满狰狞的疤痕。悔恨的泪水突然从她完好的左眼奔涌而出。\n\n“特鲁丝！”他一个箭步上前将爱人紧拥入怀，在她耳边呢喃着绵绵情话。待她情绪稍缓，仍不敢直视阿德里安的眼睛，耻辱感如潮水般淹没了她。\n\n“特鲁丝。”他轻托起妻子的脸庞，那唯一完好的蓝眼睛还噙着泪花。“无论顺境逆境，无论健康疾病，我对你的爱至死不渝。”"
 HDV_SAF.28.a: "偶尔也会有这样圆满的结局。"
 HDV_SAF.29.t: "结果出炉"
 HDV_SAF.29.desc: "抱怨升级为抗议，抗议又演变成暴乱。总理的演讲刚结束，全国多地就爆发骚乱，防暴警察随即以武力镇压。\n\n一项行政决议宣布君主制公投结果无效。那些之后从事叛国行为者的选票将不计入总数，新结果明确为赞成君主制。政府紧接着发布公告，宣布伊丽莎白二世女王将恢复其南非联邦君主的合法地位。\n\n然而在南非绝大多数城市、乡镇与村落，这一结果却引发了欢庆。对于将国家拖入史上最严重危机的布尔人群体，民众几乎毫无同情。总理“叛国者不配享有代表权”的声明获得了广泛认同。\n\n许多人期盼事情就此解决，但这场风波的处理方式或许会在未来某天让君主制再度成为争论焦点。"
 HDV_SAF.29.a: "天佑女王，天佑南非。"
 HDV_SAF.31.t: "纳粹资产国有化"
 HDV_SAF.31.desc: "二十年来，南非始终在两大超级大国之间保持平衡，与美国和德国都维持着开放中立的关系。然而正如南非战争——或如某些人开始称之为“家园战争”——中的许多事物一样，这场战争给这个国家带来了巨大变革。\n\n与德国的所有联系将永远断绝，北部边境将布满铁丝网和严密防御工事，以确保1963年的悲剧永不再现。虽然曾与北方的专员辖区进行贸易、向日耳曼尼亚输送原材料带来可观利润，但这些利润丰厚的纽带已彻底断裂。\n\n不过坏消息中也蕴含着一线曙光。德国在南非的投资与其所有者彻底失联，随着两国断交（以及美国鹰派的永久军事存在），新颁布的《敌产国有化法案》经议会通过，将没收所有德国投资并拍卖给出价最高者。这场被称为“纳粹资产国有化”（Nazionalization）的风暴席卷全国，查封的企业与资产在拍卖会上被迅速售出，竞标者来自OFN各国主要企业及本土公司。\n\n所有人都明白，这是德国与南非之间漫长互利关系的最后红利，是从昔日中立外交中榨取的最终利益。"
 HDV_SAF.31.a: "德国人这是自食其果。"
 HDV_SAF.32.t: "自由的灯塔"
 HDV_SAF.32.desc: "如果说这场冲突中有任何大赢家，那便是科林·埃格林。这位国防部长与联邦国防军司令亨德里克·克洛珀协同合作，不仅旨在赢得战争，更致力于推动整个联邦国防军按照美国标准实现现代化。放任美国影响力如此深入南非，最终将使得美国能够借此施压，迫使统一党在未来采取更具进步性的政策。\n\n国防军现代化改造的筹备工作早在战争期间便已在幕后展开。如今随着大规模复员和军队缩编至常规规模，所有过时的体系终于得以彻底清除。\n\n老旧装备将被报废；军中反对美式方案的官员被强制退休。与此同时，美军启动了大规模培训计划，为当下及未来的南非士兵传授美式作战理念，更期望借此在那些愿以生命捍卫国家自由的军人心中播撒美国价值观的种子。\n\n美国影响力的最终体现全面聚焦于装备与军械领域。南非与多家美国企业签订了长期采购合同，而本土防务公司正奋力试图打入更广阔的OFN市场。"
 HDV_SAF.32.a: "一支全新的、纯正的美式军队。"
 HDV_SAF.33.t: "选择特种部队发展方向"
 HDV_SAF.33.desc: "占位符：请选择一个选项"
 HDV_SAF.33.a: "沙漠"
 HDV_SAF.33.b: "丘陵"
 HDV_SAF.33.c: "丛林"
 HDV_SAF.34.t: "平静的老兵"
 HDV_SAF.34.desc: "葡萄园环绕的农庄，坐落于开普敦以北一小时车程的地方，这里住着一户人家。他们在英伦三岛沦陷前夕举家迁徙至此。比起加拿大，他们更偏爱南非的气候，于是便与当地人和平共处，从此扎根于此。家族中的祖父是一位蓄着胡须的老人，曾参加过两次世界大战，是一位身经百战的老兵。他将毕生的经验毫无保留地传授给南非联邦国防军，直至1958年退休。\n\n如今，他终于有时间陪伴珍爱的家人，也有时间开始撰写那苦涩却令人满足的自传。他挥毫泼墨，热情洋溢地描绘了一个男人在世界舞台上崛起的精彩故事：他最初投身于第一次世界大战，勇猛地参加了每一场战斗，却在梅泰朗附近被一名狙击手重伤。然而，他克服了重重逆境，二十年后重返战场，指挥一支部队，凭借天赋的才能轻松晋升军衔。\n\n尽管他竭尽全力，第二次世界大战仍以凄惨的失败告终。他将满腔怒火倾泻在那些应该为英国败于纳粹负责的人身上——那时他正困守非洲，空有一身本领却无处施展。\n\n然而在他看来，自传的末尾却是彻底的败笔。流亡他乡的他，描述了重建联邦国防军的职业生涯，最终却黯然退休。他的故事在此戛然而止，以一种苍白、无痕、无色的平淡方式结束——他回到了家族的农庄，结束了一生为雄狮效力的生涯，即便那雄狮早已倒下。"
 HDV_SAF.34.a: "他的时代行将落幕。"
 HDV_SAF.35.t: "重返岗位"
 HDV_SAF.35.desc: "就在迪夫总理试图了解比勒陀利亚的局势进展，以及布尔人在德国盟友煽动下发起的暴力袭击时，办公室的门突然被重重敲响。他皱了皱眉，此刻并未期待有人来访，更没想到会有人不等回应就闯进他的办公室。\n\n一位胡子拉碴的老人大步流星地走了进来，他看上去至少有70岁，身材瘦削，穿着一身旧时的英国军服，头上戴着二战时期的贝雷帽。他看向总理，礼貌地点了点头，目光却直直地盯着迪夫的眼睛。\n\n“德·赫拉夫总理，”老人开口道，“我一直关注着布尔人及其动向。整件事搞得一塌糊涂，局势只会越来越糟。您需要一个经验丰富的人来主持南非防御，所我今天来主动请缨。”\n\n关于这个人的记忆如潮水般涌来。他缺乏分寸，总爱激怒同僚，喜欢把所有成就都揽到自己身上。自从被逐出英伦三岛后，他一直在联邦国防军中担任指挥官，四年前才退休，让不少同僚都松了口气。迪夫怀疑这老头重返岗位能否带来好处。“伯纳德，以你的年龄，我不知道这是否明智。”\n\n“我77岁了，但身体还硬朗着。一句话，要不要我协助保卫国家？”\n\n迪夫轻叹一声，眼下也没有更好的选择，只好对这位退休老将点了点头。“欢迎回来，蒙哥马利将军。”"
 HDV_SAF.35.a: "人虽不讨喜，当下却堪用。"
 HDV_SAF.36.t: "生于马背"
 HDV_SAF.36.desc: "岁月不饶人，伯纳德对此深有体会。七十七载人生路，他历经沧桑。如今退休后的迟暮之年，他真切感受到时光对身心的侵蚀——思维依旧敏锐如初，躯体却日渐衰颓。细微的变化缓慢而固执地折磨着他，腰背疼痛已成家常便饭。\n\n但当他重拾使命时，却迸发出五年来未有的精气神。此刻不单是保卫南非的时机，更是予德军重创的良机。最重要的是，这将为他的传记写下最辉煌的终章：战胜衰老的桎梏，自退休中复出，成为南非的救世主。这才该是历史的正确走向。\n\n只要伯纳德·蒙哥马利一息尚存，不列颠精神就永不熄灭。而今他誓要为光复故土贡献力量。每消灭一个德军或布尔叛军，德国的元气就削弱一分。失去非洲殖民地的德国人将影响力尽失，而南非将永享自由。\n\n未来开普敦的绿市广场上，必将矗立起伯纳德的青铜雕像。这位冲破万难、在国家至暗时刻力挽狂澜的卓越将领，将永远凝视这片他守护的土地。"
 HDV_SAF.36.a: "他的故事，由他自己讲述。"
 HDV_SAF.37.t: "合适的终曲"
 HDV_SAF.37.desc: "他脸上的笑容无比灿烂。这位即将迎来八十岁生日的老人，终于完成了他的传记。伴随着老式打字机的最后一声脆响，他郑重地敲下“全文终”三个字，这台机器陪伴他完成了这部巨著。他抽出上方的稿纸，装进文件袋，准备尽快寄给出版社。这无疑是部传世杰作，正如他本人经历的那些传奇故事般经得起时间考验。他坚信这本书必将畅销，毕竟，谁会不想了解南非救世主的故事呢？\n\n伯纳德·蒙哥马利端着葡萄酒向后靠去，脸上挂着胜利者的微笑。这些年来，质疑者、反对者、冷嘲热讽者层出不穷：比利时野战医院的军医们认定他活不过当晚，次日清晨却看见伤员依然清醒；因丢失英国而恼羞成怒的巴顿，愚蠢地试图将责任推卸给他；还有那些布尔人和德国佬，在他重返南非拯救危局时，总拿他的年龄大做文章。\n\n但所有与蒙蒂对赌的人都输了。他的功绩无可辩驳，且将由他亲自铭刻在历史的丰碑上。老人用枯瘦的双手将传记终章的文件袋捆扎严实，推到书桌右侧最边缘的位置。\n\n属于他的传奇，就此落幕。"
 HDV_SAF.37.a: "永垂不朽。"
 HDV_SAF.38.t: "英国合作伙伴"
 HDV_SAF.38.desc: "美国进口轿车在农舍附近停下，一位衣着考究、戴着眼镜的肥胖男子下了车。稍等片刻后，屋主眯着眼睛走了出来。\n\n“蒙哥马利元帅？”沃塞·罗脸上挂着微笑问道，“很高兴见到您，能抽出几分钟聊聊吗？”两人移步到后廊，各自端起一杯酒，这位老兵带着一丝不安打量着眼前的政客。沃塞用手帕擦了擦额头的汗水，随后开口。\n\n“我关注您的职业生涯很久了，今天来是想请您再为南非出一次力。”蒙哥马利似乎来了兴致，微微前倾身子，脸上浮现出一丝浅笑。\n\n“具体来说，需要我做什么？”\n\n“德·维利尔斯·赫拉夫已经不行了，尽管他还不肯承认。我考虑了很久，决定在大选前脱离联合党，组建一个真正的保守政党，就叫新保守党。联合党需要被推向更右翼的方向，而唯一的方法就是成立一个真正代表南非英裔利益的政党。我想请您支持新保守党，充当竞选活动的代言人。以您的声望，这对保守事业大有裨益，尤其是对那些曾在您麾下服役的老兵们。”\n\n蒙哥马利没花多少时间就考虑好了这个提议。“我很乐意为正义事业效力到最后一刻。”两人握了握手，又倒了一杯酒，开始进一步谋划。"
 HDV_SAF.38.a: "保守派开始行动。"
 HDV_SAF.39.t: "钻石之王"
 HDV_SAF.39.desc: "可以公平地说，哈里·奥本海默是个颇具争议的人物。这位企业家、慈善家兼前统一党政治家，作为德比尔斯和英美矿业集团的负责人，是公认的全国首富，无人能及。众所周知，他同情非洲人国民大会并支持该组织及其他进步事业，却又乐于与现任政府合作以维护其两家公司的利益。\n\n然而在敌人眼中，尤其是最激进的阿非利卡人看来，奥本海默无异于企图奴役整个国家的魔鬼。牛车哨兵组织用贬称“金钱魔力”来指代他，极右翼阿非利卡宣传中仍大量提及他的犹太血统——这些宣传似乎越来越受德国影响。自1930年与父亲一同皈依圣公会后，亨利一直致力于巩固其企业采矿与开采帝国，该集团至今仍主导世界黄金开采贸易，当然还包括南非的绝对骄傲——钻石产业。\n\n尽管他已辞去统一党政治职务转而执掌家族企业，但依然深度参与政治，同时支持统一党、进步党及多项与非国大密切相关的合法倡议。凭借遍布各处的人脉，亨利始终是南非政坛的关键人物，殷切期盼国家实现内部和解。\n\n但与此同时，他的帝国建立在廉价黑人劳动力和残酷垄断手段之上，使他掌控着两家约占全国GDP四分之一的企业。作为南非发展的关键人物，亨利的野心从未止步——矿产出口持续构成国家经济支柱，而南非草原之下仍蕴藏着待开发的巨大财富。"
 HDV_SAF.39.a: "庄家总是赢家。"
 HDV_SAF.40.t: "热烈欢迎陶氏化学"
 HDV_SAF.40.desc: "马雷·斯泰恩在美国大型企业陶氏化学新建的化工园区入口处剪断了红绸。随着新闻镜头聚焦于南非外交部长与专程从美国赶来参加开幕仪式的陶氏首席执行官握手致意的画面，现场响起了礼节性的掌声。双方相继发表演讲，谈及新园区将为南非带来的巨大机遇，以及陶氏与南非政府深化合作可能为双方创造的重大利益。\n\n自始至终，斯泰恩脸上的笑容都未曾褪去——这份与美国企业达成的商业合作取得了圆满成功。他瞥向身后的建筑群，眼中看到的全是国家发展的机遇。虽然促成这项合作耗费了漫长时光，但所有努力终得回报。此刻他站在镜头前，以真正领袖的姿态吸引着南非民众的目光，进一步提升了在国内的声望。"
 HDV_SAF.40.a: "不过我们就别谈污染这事儿了。"
 HDV_SAF.41.t: "注定的结局"
 HDV_SAF.41.desc: "“非国大的战线已彻底崩溃。”联邦国防军指挥官亨德里克·克洛珀用手在地图上比划着说道，“当然他们不会停止抵抗，但德国人的猛攻已完全粉碎其对纳塔尔和加兹尼的直接控制。”\n\n赫拉夫瞥了眼地图，轻抿一口来自自家葡萄园的红酒，微笑道：“眼下倒是少了个麻烦。德国人可不会对他们手软，聪明人该往我们防线逃了。真不知他们怎么想的，居然指望用偷来的武器武装乌合之众，同时对抗两支现代化军队。”\n\n埃格林咬了咬下唇才开口道：“他们是为自己的人民拿起武器，总理，为他们信仰的事业而战。”赫拉夫投来明显不悦的目光——这位国防部长的立场向来明确，但其能力及对美国的态度使他不得不留任，尽管赫拉夫更希望任用对南非黑人反抗者缺乏同情心的人选。\n\n“他们站在南非对立面，这就是应得的下场。但愿这些人在徒劳挣扎时多拉些布尔人陪葬。”\n\n埃格林没有接话，不久便借故离开作战会议。但他脸上写满对总理的愤懑。"
 HDV_SAF.41.a: "君子之争。"
 HDV_SAF.42.t: "被俘的叛徒"
 HDV_SAF.42.desc: "“收起你那得意的笑容，直接给我个痛快吧。”赫佐格被铁链拴在墙上，怒视着亲自前来探望这位南非头号叛徒的德·维利尔斯·赫拉夫，“随你们怎么折腾，我们永远不会停止争取自由的斗争——夺回被英国侵略者野蛮剥夺的建国权利。再动听的妥协条件也弥补不了这一切。”\n\n迪维凝视着他，颇为享受这一刻才慢悠悠反驳：“你们原本只会沦为德国的附庸，所谓自由根本是镜花水月。南非给了你们自治领地的主导权，让你们既能保有独立又能共享繁荣，可你们偏要赌气毁掉这一切，愚蠢得看不清自己招致的灭顶之灾。你们的民族邦已成废墟，德国人也无力帮你们重建了。”\n\n“只要还有一个布尔人在呼吸，我们就会和你们这些犹太美国佬的傀儡斗争到底。我与你无话可说，滚出去吧，你这阴险的毒蛇。”\n\n迪维轻叹一声，他原本希望这个败军之将能在失败中学到些什么。但看着这个连电视机都要抵制多年的极端分子，他明白根本是徒劳。\n\n他转身离开牢房，对守卫使了个眼色。是时候对阿尔伯特·赫佐格做个最终决断了。"
 HDV_SAF.42.a: "把他带到后面去。"
 HDV_SAF.42.b: "把他送到罗本岛上。"
 HDV_SAF.43.t: "无人参加的葬礼"
 HDV_SAF.43.desc: "不，他们完全不明白为什么要做这份差事，也不懂为什么会被派到这种鸟不拉屎的地方。前一秒他们还舒舒服服地待在基地里，看着电视上放的美国西部片，下一秒杰克·温特斯和德里夫·范德维尔就开着卡车，载着一具孤零零的尸体，驶向荒郊野外。给他们的命令很明确：把尸体埋在某个偏远的地方，然后忘掉埋尸的地点。\n\n沿着一条土路开了大约一个小时后，两人终于受够了。他们停下卡车，从车上跳下来，各自抄起一把铁锹。他们找了个远离道路、不会被看见的地方开始挖坑。接着是最恶心的一步——把尸体从卡车后面拖出来，送进它最终的安息之地。\n\n那是个穿着考究西装和皮鞋的家伙，双手被反绑在背后，头上套着一个紧紧绑住的袋子，胸前有几个血淋淋的弹孔，看样子是被行刑队枪决的。尸体臭气熏天，两人赶紧加快动作，草草把尸体扔进了坑里。\n\n让杰克没想到的是，德里夫突然弯下腰，探进坑里，轻松地把尸体那双考究的皮鞋扒了下来。“你他妈在干嘛，伙计？”\n\n“给自己挣点外快，这破活儿总得有点补偿吧。反正他也没机会再穿了。”他擦了擦鞋上的土，咧嘴一笑。“要么我穿，要么卖掉换点钱。行了，赶紧把他埋了，咱们好回基地。”"
 HDV_SAF.43.a: "阿尔伯特·赫尔佐格长眠于此。"
 HDV_SAF.44.t: "第一天"
 HDV_SAF.44.desc: "要说阿尔伯特·赫佐格在罗本岛的第一天会风平浪静，那可真是大错特错了。所有人都非常清楚他是谁，他的身份根本无从隐瞒。那些胆敢俯视他、把他跟非国大那群喽啰混为一谈的狱警，其他布尔犯人拥戴的目光，当然还有那些他曾试图暴力镇压之人投来的仇恨凝视。\n\n而阿尔伯特却始终未露惧色，对周围嘲讽阿非利卡人民邦领袖沦为阶下囚的人群毫不在意。他的信念从未动摇，不，这只是一次暂时的挫折。很快，德国人就会粉碎这个由美国人撑起的软弱可悲的国家，雅利安人的优越性将再次得到证明。\n\n当他踏入简陋的牢房时，他瞥了一眼那位狱警——一个相当肥胖的男人，正是他将赫佐格从大门一路押送到牢房。\n\n“赫尔佐格先生，欢迎来到你的新家。”狱警讥讽道，“我希望你别再惹麻烦，否则我们只能把你转移到这座‘优雅’机构的黑人区，我相信他们会对你非常‘温柔’。其他布尔人肯定会以你为榜样，我也希望你能帮忙管教他们。配合的话，说不定能让你的日子好过一些。”\n\n回应他的只有这位布尔激进分子的怒视。\n\n“好好想想吧。在那之前，祝你的罗本岛之旅愉快，阿尔伯特。”狱警大笑着锁上牢门离开了，只留下赫佐格哀怨地站在原地。"
 HDV_SAF.44.a: "又多了个知名犯人。"
 HDV_SAF.45.t: "赌上胜算"
 HDV_SAF.45.desc: "伯纳德抓紧时间向总理汇报了前线最新态势、后勤补给进展，当然少不了吹嘘自己新取得的战果。\n\n“那么，说说那些布尔人吧。”赫拉夫转过身，“他们现在是什么情况？虽然他们有德国人撑腰，但考虑到他们那么多人都被我们俘虏了，国内肯定也不好过。我们或许该再添把火，看看会怎么样。”\n\n“我倒不太担心布尔人，真正的威胁是德国殖民地。今年七月前我们就能轻松搞定布尔人，但剩下的战争恐怕没那么简单。”\n\n“七月？就现在？”\n\n“正是如此。”蒙哥马利自信地笑了笑。\n\n“我怀疑我们能否这么快击垮他们，不过既然你这么肯定，不如打个赌？如果你能在七月前拿下他们，我就送你一架美国B-52轰炸机。”赫拉夫显然是在开玩笑，可蒙哥马利立刻伸出手要握手。出于绅士习惯，总理勉强笑了笑，尴尬地和他握了手。\n\n“那就七月见分晓。”\n\n等这位老将军离开总理办公室后，迪夫很快就把赌约抛到了脑后，可蒙哥马利却完全惦记上了这事。他重新调整战略，决心先集中火力解决布尔人。"
 HDV_SAF.45.a: "是时候小赌一把了。"
 HDV_SAF.46.t: "赌约已胜"
 HDV_SAF.46.desc: "迪夫看着蒙哥马利迈着轻快的步伐走进他的办公室，脸上挂着自信又得意的笑容。他勉强挤出一丝微笑，心里琢磨着究竟发生了什么。所谓的阿非利卡人民邦已经垮台，现在只剩下德国人和布尔残余势力并肩作战。\n\n“总理。”蒙蒂敬了个礼。“您知道现在是几月份吗？”\n\n“什么？”赫拉夫完全难以置信地瞪着他。“现在是[GetMonth]。”\n\n指挥官的笑容更加灿烂了。“[GetMonth]啊？嗯，那是在七月之前，而布尔人已经彻底崩溃了。总理，现在该把我的B-52给我了，毕竟赌约就是赌约，我赢了。”\n\n“恕我直言，你到底在说什么？”\n\n“哦，迪夫，现在可别想耍赖。你心知肚明我赢得堂堂正正。我们可是在这间办公室里击掌为誓的。我对您的品格可是抱有更高期待的，总理阁下。”\n\n总理脑海中浮现出那件事的模糊记忆——当时他开了个关于战争赌注的玩笑，而蒙哥马利却当真了。他脸上的表情变得有些痛苦，现在他要么选择面对可能变得更难缠的蒙哥马利，要么就把一架飞机交给这个老顽固。考虑到蒙哥马利至今表现优异，还是与他保持良好关系更为明智。\n\n“那么，总理。”蒙哥马利双手撑在办公桌上，向前倾身。"
 HDV_SAF.46.a: "我的B-52轰炸机在哪儿？"
 HDV_SAF.47.t: "赌注落空"
 HDV_SAF.47.desc: "七月已至，而那些愚蠢的布尔人仍在负隅顽抗。蒙哥马利怒火中烧，他的计划未能如预期般大败布尔人。这些人执迷不悟，坚持着这场愚蠢的叛国圣战，还与企图奴役他们的德国人沆瀣一气，简直愚不可及。\n\n最令他恼火的是，他与德·维利尔斯·赫拉夫的赌注落空了，无法赢得那架梦寐以求的飞机。倒不是他真有多想拥有一架B-52，而是胜利的荣耀本应属于他。若是他能早些碾碎布尔人的抵抗，如今便能大谈特谈这段传奇，顺便还能开着那架小玩意儿四处兜风。\n\n可眼下，他一无所有，战争却遥遥无期。局势似乎短期内难见分晓，但蒙哥马利很快将个人挫败抛诸脑后，转而谋划下一场攻势，誓要一劳永逸地让这些“先民”闭嘴。"
 HDV_SAF.47.a: "祈祷迪夫已经把这件事忘了。"
 HDV_SAF.48.t: "分歧"
 HDV_SAF.48.desc: "亨德里克·克洛珀揉着太阳穴，极其沮丧地盯着站在对面的英国男人。他当初要是老老实实退休该多好，那样事情会顺利得多，但这个来自遥远年代的糟老头子偏偏管不住那张大嘴，非要再贪一遭军功。\n\n“克洛珀，你他妈心知肚明这个战术风险太大。”蒙哥马利用地图戳着桌面划出一道线，“再这么冒险下去，战争没打完咱们的军队就要拼光了。你是想遗臭万年，被写成葬送南非的罪人吗？”\n\n“收起你那些懦夫的夸张说辞。”克洛珀反唇相讥，“不入虎穴焉得虎子。你巴不得整天坐着无所事事，等着天上掉馅饼！战争可不会迁就你的异想天开，蒙哥马利。”\n\n“我们的补给根本支撑不了这种急行军，你很清楚。要是你非要为了个人荣誉白白葬送将士性命，尽管去干。要不了多久我们就无力抵抗那群混蛋，只能眼睁睁看着整个国家被美国人掌控。每牺牲一个优秀的南非士兵，抵抗德军的力量就削弱一分！”\n\n这场争论在原地打转持续了将近一小时，近距离接触再次点燃了两人积怨已久的嫌隙。克洛珀至少宽慰地想到，看不惯蒙哥马利的并非只有他一人。可惜的是，他无权强制让这个老家伙解甲归田。但只要能让对方别再频频越界，情况倒也不至于太糟。"
 HDV_SAF.48.a: "蒙哥马利：败而不馁，胜而不骄。"
 HDV_SAF.49.t: "国家工厂在比勒陀利亚"
 HDV_SAF.49.desc: "阿尔伯特·赫尔佐格向站在比勒陀利亚火车站附近的人群挥手致意。那列从东非驶来的火车，车身两侧醒目地印着万字标志，缓缓驶入站台。片刻之后，车门打开，首批新购置的国家工厂牌拖拉机轰鸣着驶下火车，喷吐着浓烟。驾驶员停下车，跳下来与赫尔佐格握手，现场爆发出热烈的掌声。\n\n这是首批交付的德国精良农机，购自声名显赫的国家工厂，这家企业堪称德国力量的钢铁心脏。美国人曾试图打入利润丰厚的阿非利卡人市场，但那些贪婪懦弱的家伙根本不可信，这一点每个正直的阿非利卡人都心知肚明。\n\n即便购买美国货（甚至日本货）可能更便宜，但选择德国产品将进一步巩固世界雅利安民族的团结，同时让劣等种族安分守己。东非与约翰内斯堡之间的火车和卡车运输量比以往任何时候都要频繁，而与南非其他地区的内部贸易却明显放缓。尽管世界地图上仍标注着“南非”，但阿非利卡人无疑正一步步融入德国的势力范围。"
 HDV_SAF.49.a: "德国人的技术，阿非利卡人的知识。"
 HDV_SAF.50.t: "国家安全局"
 HDV_SAF.50.desc: "与许多英国流亡者一样，约翰·亚历山大·辛克莱爵士在不列颠崩溃的最后混乱日子里离开了祖国。这位终生服役于英国军队的军人，始终背负着战败的污名与无力守护家园的痛楚。\n\n面对流亡地的抉择，他最终前往南非试图继续对抗德国势力，但等待他的唯有屈辱的和平。由于无法在战后缩编的南非军队中觅得职位，他出任开普敦警察局长，并立即着手建立线人与联络网，试图构建能为南非服务的情报体系——这个国家过去始终依赖的英国情报网如今已不复存在。\n\n在南非站稳脚跟后，辛克莱终于得以公开追求他的目标：依照正统英国原则为国家建立完善的情报机构。如今国家安全局已成为维护国内和平与平衡的关键力量，其特工遍布南非境内外，持续向总理提交情报报告。\n\n然而国安局只效忠于一人，且仅此一人。该组织亲OFN的倾向人尽皆知，辛克莱虽勉强誓言维护国家中立，却始终在德·维利尔斯·赫拉夫背后与中情局保持着密切合作。"
 HDV_SAF.50.a: "南非的秘密情报机构。"
 HDV_SAF.51.t: "公之于世"
 HDV_SAF.51.desc: "尽管这场战争混乱不堪、局面错综复杂，但某些事情却因此变得简单了许多。约翰·辛克莱和南非国家安全局无需再遮掩他们与中央情报局的合作，因为双方的秘密联系正迅速加深。在局势紧迫和美国方面全力投入的情况下，许多事情得以迅速推进。\n\n情报不仅在两机构之间流动，特工、网络、技术以及资金亦是如此。国家安全局正处于快速扩张期，赫拉夫已为其开出了一张空白支票，允许他们不惜一切代价保卫国家。辛克莱像化疗一般，开始着手清除国内的一切德国势力，同时制定计划，准备对布尔人和非洲之盾展开更为猛烈的破坏行动。\n\n终于，辛克莱能够对德国展开反击，也终于有机会真正改变局面。他暗自希望，自己的努力或许能弥补多年前对祖国的辜负。幸运的是，南非并非孤军奋战，与兰利的直通热线始终畅通。经过多年努力，他将国家安全局打造成了一支强大的力量，如今，所有的付出都将得到回报。"
 HDV_SAF.51.a: "一段特别的情报联系。"
 HDV_SAF.52.t: "庆典与告别"
 HDV_SAF.52.desc: "这场战争曾是一场生死存亡的搏斗，艰难、代价高昂、血腥且过于漫长。然而尽管困难重重，盟军最终取得了胜利——南非及其新结成的（从某种角度看亦是历史悠久的）盟友成功击败了非洲之盾。曾经如潮水般从开普敦向北涌去的士兵与物资，如今化作各色志愿军与正规部队向南行进返乡，只留下重焕生机的南非军队守卫故土。\n\n但在这一切发生之前，开普敦还举行了最后一场盛大庆典。在整个自由国家组织摄像机的注视下，盛大的阅兵式如期举行，自由国家联军与南非军队依次列队行进，军用车辆在队伍中央穿行。随着这场欢庆的辉煌时刻及后续诸多庆典的举行，战争正式落下帷幕，自由世界的力量战胜了曾欲吞噬全球的灰色浪潮。\n\n各国大使与统一党高层几乎全员齐聚，有幸目睹德·维利尔斯·赫拉夫与伯纳德·蒙哥马利在镜头前不动声色争夺焦点的精彩场面。\n\n自那日后，各国军队陆续撤离南非，带着胜利的荣光与为捍卫自由世界作出重大贡献的满足感踏上归途。"
 HDV_SAF.52.a: "分道扬镳，终成往事"
 HDV_SAF.53.t: "漫漫归乡路"
 HDV_SAF.53.desc: "团结协定主导的停战条款对许多人而言难以下咽——他们曾为自由南非的理想失去战友友人，甚至自身负伤。布尔人作为日耳曼尼亚的附庸国赢得了自由，而南非就此被撕裂成两半。\n\n不少人推断，倘若当初无所作为，整个国家或许早已被北方的德属殖民地吞并，虽然无人能确知真相。可以确定的是，整体氛围至多只能算五味杂陈。和平重返南非，对众多志愿前来或受祖国派遣的人们而言，这意味着一场终结与归乡之旅。\n\n曾经如潮水般经好望角北上的兵员物资，如今化作各色志愿军与正规部队南返的行列。通过船舶与飞机，OFN的士兵们踏上归途，仅有零星几人选择留下，在南非构筑新家园。\n\n尽管好望角的居民们以节制私密的方式欢庆和平回归，战争的恐怖既已终结，重建家园的工程终可启动。\n\n对于那些离开南非的人，他们带走的是以失望收场的壮阔冒险记忆。于多数人而言，非洲战场的经历将成为伴随终身的烙印。"
 HDV_SAF.53.a: "分道扬镳，终成往事"
 HDV_SAF.54.t: "视察日"
 HDV_SAF.54.desc: "当这三名男子走过时，士兵们纷纷敬礼。国防军司令亨德里克·克洛珀、国家情报局首脑约翰·辛克莱与国防部长科林·埃格林排成一列，检阅了一支机械化步兵部队——这些士兵即便在冲突结束后仍选择留在军中（显然是因为可观的加薪）。若不是他们制服上醒目的橙白蓝三色标识，人们或许会误以为这是美国士兵。\n\n但他们全都说着英语，穿着从美国进口的军装，手持美制武器，站在停放的美式步兵战车前。科林扫视这番景象微微一笑——在他的两位同行者鼎力相助下，让国防军全面美国化的计划已大获成功。从某种意义而言，这场战争对南非实属福音，通过长达数年的彻底清理行动，开普地区终于清除了所有有害的德国影响。\n\n更不用说美国人留下的诸多库存物资，或是作为赠礼，或是为防范未来袭击的保险，又或许只因将旧装备运回国得不偿失。租借法案虽已终止，装备却永久留存。美国对南非的援助虽逐渐减少，情报与训练合作仍保持着可观规模。\n\n至于战前购置或战时缴获的德制装备，科林成功说服赫拉夫将其全部抛售至国际市场，以此作为对南非境内一切德国元素的终极摒弃。"
 HDV_SAF.54.a: "由自由国家领导。"
 HDV_SAF.55.t: "迪夫北上"
 HDV_SAF.55.desc: "德·维利尔斯·赫拉夫始终保持着绅士风度，从未让渥太华的东道主察觉到他内心的不悦。上次离开南非时，他正奔赴北非战场，在沙漠中学会了适应干热气候。但此刻他身处加拿大，率领着高端外交使团，旨在重新建立与英联邦在战后中立时期断裂的个人及商业联系。\n\n事实上，他察觉到东道主带着几分疑虑——毕竟他曾是推动并维护南非与英帝国残余势力保持距离的中立政策核心人物。不过这点隔阂尚不需动用太多手段，他那经年累月的魅力辅以南非矿产资源进一步开放与贸易扩张的承诺便足以应对。\n\n整个行程中，赫拉夫马不停蹄地会见加拿大政府代表、流亡海外的英伦人士，当然还有那些渴望通过投资协议助力南非重建的商业领袖。偏偏天公不作美，连日阴雨湿冷，就连有幸觐见女王陛下当日也未能幸免。\n\n他始终面带微笑谈谐语，握手寒暄间讨论重建计划，任窗外风雨敲打着皇家宅邸的窗棂，心底却早已飞回温暖的故土。"
 HDV_SAF.55.a: "这趟旅行还要持续多久来着？"
 HDV_SAF.56.t: "举行选举"
 HDV_SAF.56.desc: "电视和广播同时发布了新一届大选的公告。原定选举日期因一群德国暴徒发动侵略战争而粗暴中断，现已将大选重新安排在距当时不到一年的时间。\n\n在一场标准的自信演讲中，总理德·维利尔斯·赫拉夫身着最考究的西装，阐述了战争进程、重建工作取得的可喜成果，以及在他寻求连任期间统一党将如何继续为南非带来真正的增长与进步。\n\n此后国内涌现不少抱怨声，指责选举日期安排得过远，质疑统一党有意延长当前任期。但总体而言，新一届大选的筹备工作已经启动。\n\n宣传海报开始印刷，新兴政党陆续组建，安保措施也已就位，这一切都是为了确保选举顺利进行——统一党自1934年起实际执政至今，人们期待此次选举能助其再获执政周期。"
 HDV_SAF.56.a: "嘿，快去投票吧。"
 HDV_SAF.57.t: "举行选举"
 HDV_SAF.57.desc: "电视和广播同时发布了新一届大选的公告。原定日期因德国暴徒发动侵略战争而粗暴中断，新日期定在大约一年之后。\n\n身着最考究西装的德·维利尔斯·赫拉夫总理以一贯沉稳自信的姿态发表演说，谈及战争进程、重建工作的可喜进展，并承诺若统一党继续执政，将为南非带来真正的经济增长与进步。  \n\n此后国内涌现诸多不满之声，指责选举日期过分延后，联合党在注定由非国大胜选的结局前刻意延长任期。\n\n所有人都预见了结局——浪潮不可逆转。全民投票制度实施后，统一党预计仅能获得四分之一选票，而非国大将稳占多数席位。\n\n然而即便非国大即将执政，国家大部分财富与土地仍掌握在少数白人群体手中。任何激进改革都可能引发强烈反弹。平等之路道阻且长，统一党虽将沦为反对党，其在国内的权力与影响力仍不容小觑。"
 HDV_SAF.57.a: "新时代即将来临。"
 HDV_SAF.58.t: "锈蚀的遗产"
 HDV_SAF.58.desc: "南非海军从未受到过多重视，因为皇家海军曾掌控着从哈利法克斯到珀斯的海洋，而这个国家不过是大英帝国便利的补给点和非洲贸易枢纽。若有人认为，在帝国遭遇惊人溃败并解体、南非突然独立后，海军会获得重视，那便大错特错。\n\n随着许多水手失去家园转而投奔南非（而非定居澳大利亚或加拿大），南非继承了英国大量商业与军事舰队。尽管统一党竭诚欢迎并协助他们安顿，但这些船只始终未受重点关注。\n\n1943年尚属精良的舰艇，到1962年已落后于时代——这些曾是皇家海军骄傲的舰船，如今在时光无情的侵蚀下艰难维系。雨果·亨德里克·比尔曼正是那个苦命人，他肩负着在微薄维护预算下维持南非海军运转的重任，心知一旦国家需动用舰队，必将捉襟见肘。\n\n但即便如此，另一份遗产仍具价值。技术专长、组织制度知识，以及可随时征召的大量海军退伍官兵，意味着南非海军虽眼下大多处于蛰伏状态，但若需召唤，仍能重振雄风。"
 HDV_SAF.58.a: "南非无视了风浪。"
 HDV_SAF.59.t: "锈蚀、退伍、新生"
 HDV_SAF.59.desc: "雨果·比尔曼在南非海军的职业生涯即将画上句号，但他的使命尚未完成。在将指挥棒交给下一任海军领袖之前，他仍有诸多事务需要处理方能安心卸任。\n\n战争清晰地表明海军亟需振兴，在美国的慷慨援助下，二战时期的英国淘汰装备被战后美制装备取代。仅有少数舰艇作为历史遗产被保留为博物馆舰，其余皆被拆解回收。这些老旧舰队锈蚀严重，残值极低，但至少焕然一新的海军如今能获得充足的维护预算。\n\n南非正式成为OFN的成员，肩负起巡逻非洲海岸线的职责，并守护美国东海岸与澳大利亚之间的贸易航线——这条航线已成为南非经济的命脉所在。"
 HDV_SAF.59.a: "南非守护着波涛。"
 HDV_SAF.60.t: "雨"
 HDV_SAF.60.desc: "战后的土地满目疮痍，弹坑如麻。乌云压顶，暴雨如注，遮蔽了阳光，也模糊了视线。在一个弹坑中，隐约可见两个人影倒卧其中。年轻的伯纳德·蒙哥马利被试图营救他的战友尸体压住，无力挣脱。\n\n胸部和膝盖的枪伤灼烧般疼痛，在看不到任何希望的情况下，他只能在痛苦中等待。这段记忆长久困扰着他，即便年迈，噩梦仍会将他带回佛兰德斯的战场，让他再次躺在倾盆大雨中，闻着尸体腐烂的恶臭，感受泥土带来的窒息。无论怎样挣扎或尖叫都无济于事，经历过多次这样的梦境后，蒙哥马利早已放弃了逃离的念头。\n\n他闭着眼睛躺在那里，等待一切结束。最糟糕的总是现实中不曾有的寂静。没有战场上士兵的尖叫，也没有附近炮弹爆炸的轰鸣，什么都没有，只有无休无止的雨声，直到一切归于虚无。\n\n伯纳德浑身冷汗地惊醒，立即起身决定放弃睡眠，开始工作。他无法改变过去，但或许——不，只要足够努力，他一定能扭转这场战争的局势。战争尚未失败，现在，赢得胜利的重任落在了他的肩上。"
 HDV_SAF.60.a: "孤注一掷。"
 HDV_SAF.61.t: "体面的阿非利卡人"
 HDV_SAF.61.desc: "历史终将对此争论不休，但在彼得·库伦霍夫看来，真相再清楚不过——并非他背离了国民党，而是这个发疯的政党抛弃了他，悍然发动针对南非的内战。针对这片他深爱的故土。仅仅因为不够激进，仅仅因为对非国大展现灵活性而非强硬拒斥与非人化，他就被阿非利卡同胞们孤立。\n\n如今，那些不愿追随暴力癫狂的人们，竟只能由自称国民党的彻头彻尾的疯子和杀人犯来代言。库伦霍夫很快意识到自己必须做什么。为了尊严与南非的未来，他将创立新的、属于阿非利卡人的政党——以体面方式在这剧变的土地上重建和平，真正代表同胞利益。\n\n无论如何，他都要让这片燃烧的故土重归安宁。通过新成立的“和平阿非利卡人党”，库伦霍夫将努力为被德国人蛊惑、因同胞顽固而陷入战火的祖国寻找稳健之道。尽管对开普敦的盎格鲁精英心存疑虑，但比起远在日耳曼尼亚的统治者，他们至少还留有理性协商的余地。"
 HDV_SAF.61.a: "为了和平、繁荣与自由！"
 HDV_SAF.62.t: "工作狂"
 HDV_SAF.62.desc: "杰克·温特斯或许是世界上最幸运的人，因为他的工作正是他的爱好。每天清晨，他都会准时出现在开普敦的澳大拉西亚军械公司，手持纸笔投入新型载具与武器的设计工作。这个天生的劳模随着战争爆发愈发废寝忘食，近乎疯狂地推进着新型原型车的研发。\n\n他最新的作品——南非瞪羚装甲车此刻正在北方战场驰骋。这款配备双联M1919勃朗宁机枪或90毫米迪奈尔GT-2主炮的机动载具，正以惊人速度穿插德军防线，对薄弱环节实施致命打击。而搭载60毫米K1迫击炮的改型，则用密集火力覆盖着德军加固阵地，让敌人在轻型装甲车的炮火中瞠目结舌。\n\n但杰克的野心远不止于此。在他的蓝图里，南非绝不会像布尔人沦为德国附庸那样成为OFN的仆从国，这个国家将以平等伙伴的姿态傲然屹立，拥有长期自保的能力。要实现这个愿景，南非必须建立更强大的本土军工体系。\n\n此刻他正伏案修改百夫长坦克的图纸。这款因德国入侵而夭折的英国设计，正在他手中经历脱胎换骨的改造。每个部件都尽可能替换为国产替代品，但整体复杂度仍控制在合理范围。战争阴云压顶的紧迫感中，杰克坚信南非完全有能力将这些图纸快速转化为钢铁洪流。"
 HDV_SAF.62.a: "他为之取名“大象”。"
 HDV_SAF.63.t: "新来者"
 HDV_SAF.63.desc: "南非在二战中侥幸幸存，经过激烈冲突后保住了自由，并采取严格中立路线以阻止德国武力吞并的企图。但大英帝国已彻底瓦解，如今仅存的遗绪流向那些仍保持自由的昔日英属殖民地。\n\n南非亦不例外，许多人辗转来到开普地区，受到统一党的欢迎。水手们漂泊异乡，殖民官员失去了辖地，不列颠群岛的流亡者，以及来自印度的效忠派，都在非洲南端找到了新家园。南非海军由英国水手组成，配备二战遗留的英制舰艇，而联邦国防军则吸纳了大量经验丰富的指挥官来重塑军队。\n\n统一党由此获得选民与支持者的大幅增长，助其连续击败竞争对手国民党稳掌政权。南非不仅接收了英国海军残余力量，更迎来各殖民地受过良好教育、财力雄厚且人脉广泛的精英阶层，极大推动了经济发展。\n\n尽管存在如此强大的亲OFN势力，该国仍坚持高度中立，以此维持国内外和平。虽有许多流亡者公开主张加入OFN，但这股推力尚不足以促使统一党迈出那一步。恰恰相反，德·维利尔斯·赫拉夫竭力在国内倡导中立情绪以稳定政局。南非将保持中立，与各方贸易，仅此而已。"
 HDV_SAF.63.a: "新家，新气象。"
 HDV_SAF.64.t: "就这么简单"
 HDV_SAF.64.desc: "“那么，先生们，我们终止谈判。”内阁会议因德国大使的最新指控而陷入僵局——对方指责南非在与德国的贸易往来中明显偏向OFN。赫拉夫总理原本希望维持有利可图的中立政策，同时暗中倾向实力更强的美国。\n\n但自从南非与美国关系的规模曝光后，德国人提出新要求，这种平衡显然已被打破。对在场所有人而言，这些条款不仅意味着倒向日耳曼尼亚，简直是要让南非沦为团结协定的经济附庸。\n\n德·维利尔斯·赫拉夫沉思片刻后开口：“我选择中立本是为了维持与德国及其北方附庸国的贸易，但绝不意味着把我们的经济拱手让给这些匈人掠夺者。虽然让美国人掌握过多筹码也非我所愿，但尼克松的条件总比希特勒强。现在是时候终止与德国的所有贸易，在经济上倒向美国了。”\n\n他在纸上写下指令递给斯特恩。这位保持中立的官员向总理礼貌颔首，却暗自抱怨即将面对德国方面雪片般的外交照会、电话轰炸和武力威胁。作为最后努力，斯特恩试图减轻赫拉夫的压力：\n\n“您知道的，赫尔佐格会在议会借题发挥吧？毕竟他们与东非的贸易额那么可观。”\n\n“赫尔佐格？”赫拉夫嗤之以鼻，“连电视节目都能将这个瘦小的男人和他的阿非利卡同胞逼疯。无论我们做什么，他都会像世界末日般哭嚎。就算明天我批准他独立，他照样能找到抱怨的理由——随他去吧。”总理起身欲离席时又转身补充：\n\n“对了，必须让美国人清楚，我们绝不会加入他们的OFN，永远别做这种白日梦。”"
 HDV_SAF.64.a: "别了日耳曼尼亚，你好华盛顿。"
 HDV_SAF.65.t: "议会里平静的一天"
 HDV_SAF.65.desc: "阿尔伯特·赫尔佐格走向装有向全国转播南非议会实况的话筒讲台，他那饱经风霜的苍白手指紧紧攥着关于中止对德贸易的讲稿压在讲经台上。他目光扫过全场，与德·维利尔斯·赫拉夫视线交汇，对方礼节性地点头致意。两人都心知肚明这姿态毫无诚意，彼此间炽烈的嫌恶早已根深蒂固。\n\n“议长先生。”赫尔佐格用南非语开始发言，双语议会的用语随之从统一党的英语切换回这支源自荷兰的语言。“昨日政府单方面决定中止与德国及其非洲属地的贸易，而非通过外交途径解决此事。”执政党席位上响起零星嘘声，又很快平息。\n\n“此举不仅违背我国在《1946年中立法》中立誓言，更粗暴践踏了因地理条件深依赖洛伦索马贵斯港贸易的布尔同胞权益。政府再次证明其毫无原则，对建设这个国家的勤劳布尔人缺乏基本尊重。我唯一想问总理的是：您下次背弃盟约还要等多久？”在左侧席位的掌声中，赫尔佐格落座，将讲台让予德·维利尔斯·赫拉夫。\n\n“议长先生。”赫拉夫向身后议长快速致意。“我在宣誓就任总理时，也曾立誓捍卫国家利益不受任何外力侵犯。没有哪个强权能在政治经济上奴役我们——无论东京、华盛顿还是日耳曼尼亚都无权指手画脚。德国大使提出的条款岂止荒谬，更是经济奴役的隐秘图谋，这正是我们终止贸易的原因。如同我所有决策，此举全然是为了守护南非联邦。”"
 HDV_SAF.65.a: "嘘声与掌声此起彼伏，整日不绝。"
 HDV_SAF.66.t: "王子在异国"
 HDV_SAF.66.desc: "The ethereal silence of the savannah was fractured by a single shot that rang out upon the dry plains. Weaving and whistling through the dry African air, it eventually found its mark, shattering the skull of the wildebeest that effortlessly toppled over with a soft thud. The hit was accompanied ceremoniously by polite applause from the several IGW agents that guarded Prince Bernhard van Lippe-Biesterfeld of the Netherlands on his safari trip to South Africa.\n\nAlthough there had been complaints both from Germania and Washington about the contents of his trip, his diplomatic contact, Villers De Graaff had characteristically succeeded in the Sisyphean task of appeasement, quieting both. Thanks to the Prime Minister’s diligent efforts and being escorted by a local hunting guide and five heavily guarded officers of Informatiegroep Wilhelmina, the Prince traveled across the picturesque plains of South Africa without a single hitch. He even had time to develop a more recent passion; when he wasn’t out shooting the wildlife, he was out shooting the countryside with his new Philips film camera.\n\nHowever, the diplomatic part of his trip wasn’t going as well as his hunting. Not only were his meetings with prominent politicians and exiles he knew back from his chaotic days in London dull, but his reception in the lands of the Afrikaners was also mild at best. His attempts to play up his ancestral and linguistic connections between the Dutch and the Afrikaners seemed to have an impact at least, but Bernhard was well aware that in actuality, the greater scheme of things didn’t change much for these people who seemed to idolize Germany more than their Dutch roots.\n\nAnd then there was the matter of his German origins, which to some remained a vector for treason even with his continued commitment to the Dutch cause in exile for the last twenty-two years of his life. Yet none of them understood Bernhard for who he was. He wouldn’t betray the Free Dutch even if he had been fully German. Why would he ever turn off the money tap from milking favors and making corrupt deals at home for the abhorrent hellhole that his original homeland had become? Why would he ever give up a lifetime of praise, power, and cash for minimal return? Let the tongues of the gossipers wag, for the Prince had long made up his mind on where he stood in the world."
 HDV_SAF.66.a: "Ship this back home, will you Abe?"
 HDV_SAF.67.t: "愉快的退休生活"
 HDV_SAF.67.desc: "老人俯身在他的打字机前，欣赏着西开普省庄园里的落日余晖。他从口袋里掏出烟斗点燃，心满意足地望着西沉的夕阳。当初背井离乡远渡重洋，回到他早年在南非出生时的故土——那时这里甚至尚未成为自治领或英帝国的一部分——并非易事。\n\n作为奥兰治自由邦布隆方丹一位银行经理的儿子，他在尚未形成记忆的年纪就离开了这片土地。当他成年后重返出生地时，发现那里已无可眷恋之物，最终与妻子在开普敦定居，而子女们也都在南非找到了新的职业。\n\n回到开普敦大学担任语言学教授后，由于他的著作在OFN及中立国家大获成功，他得以在1958年提前退休。他笔下的文字触动了无数读者，将人们带入那个他耗费多年心血构建的传说体系，沉浸于其中瑰丽的奇幻神话世界。\n\n自《王者归来》出版以来，他的作品获得了现象级的成功，以至于不得不将电话号码从电话簿中撤下。他的妻子伊迪丝则始终为他的成就感到无比自豪，并以各种方式默默支持着他。\n\nJ.R.R.托尔金终于重获灵感，转身回到打字机前。余晖散尽的夜晚，他将继续伏案耕耘，续写他的文学篇章。"
 HDV_SAF.67.a: "时光太短，故事太长。"
 HDV_SAF.68.t: "开普敦的陷落"
 HDV_SAF.68.desc: "“求求您先生，我和家人带着钱呢……”排在最前面的男人拼命推搡开铁丝网围栏里惊慌失措的同胞们，声嘶力竭地朝开普敦国际机场跑道外的空勤人员喊道。“很抱歉先生，但OFN部队现在需要全权使用跑道，我实在无能为——”\n\n“什么？他们霸占我们的跑道就为了丢下我们？！”男人的怒吼瞬间点燃了人群的愤懑。留守机场的联军卫兵此刻正在城区外围殊死抵抗德裔布尔联军，根本无暇顾及平民命运。把守着铁丝网缺口的两个美军士兵攥紧M14步枪，冷汗涔涔地盯着沸腾的人群，直到桌山方向传来震耳欲聋的炮击声——这提醒着他们眼前或许已是最后的庇护所。\n\n分秒之间，市民的咆哮声盖过了最轰鸣的飞机引擎。守卫们终于维持不住秩序，汹涌的人潮瞬间冲垮了脆弱的铁丝围栏。如同倾泻而出的玻璃瓶内液体，男女老幼与行李箱包霎时漫过黑色混凝土跑道。那个男人搂着妻子拽紧孩子，在奔腾的洪流中冲向最后一架美军运输机的尾舱门。当舱门液压装置在数米外开始闭合时，他不顾舱内士兵的呵斥，用尽全力将妻儿抛过金属舱门边缘。在妻子蓝裙角从视野消失的刹那，失魂落魄的母子趴在树脂玻璃舷窗上，看着跑道上的身影随着加速起飞的飞机越来越远。\n\n他们抹开雾气，将手掌贴在冰冷的窗玻璃上，仿佛这样就能将那个渐缩成黑点的人影留在指缝间。泪水模糊视线时，孩子脑海中只剩一个念头在灼烧：父亲的剪影正被漆黑的荒原一寸寸吞噬……"
 HDV_SAF.68.a: "他们还会回来吗？"
 HDV_SAF.69.t: "首席大法官事宜"
 HDV_SAF.69.desc: "南非宪法法院是该国的最高权威机构，随着首席大法官亨利·艾伦·费根一周前退休，这一职位现已空缺。根据宪法规定，总理有权任命下一任首席大法官，此人将在未来四年间对司法体系塑造起到关键作用。在潜在人选中，有三位可能接任此职。\n\n第一位是更为进步的自由派人物奥利弗·施赖纳，此举可安抚统一党的进步派系；第二位是更接近德·维利尔斯·赫拉夫的温和派人物牛顿·汤普森。最后一种选择是再次尝试通过任命阿非利卡人卢修斯·科尼利厄斯·斯泰恩来安抚该群体，此人对英国法律在南非司法体系中的影响持强烈批判态度。"
 HDV_SAF.69.a: "任命进步派"
 HDV_SAF.69.b: "任命温和派"
 HDV_SAF.69.c: "安抚总是有效的！"
 HDV_SAF.71.t: "北方的地狱"
 HDV_SAF.71.desc: "他们再次齐聚一堂，俯身在那张覆盖非洲南半部全境的巨幅地图前，仿佛战争从未结束。只是这一次，众人研究的不是部队调防或新抵达的志愿军，而是逐行审阅着北部边境传来的情报。\n\n扬·霍夫梅尔颓然跌进扶手椅，翻阅初步报告时突然感到前所未有的苍老。他早知道东非是个恐怖政权，是谋杀、暴力和系统性种族灭绝的黑色瘟疫区，但事态竟发展到如此地步仍远超想象。胡蒂格杀害了另外两名总督，吞并其辖地拼凑成这个庞然巨怪。而随着难民们带来的见闻不断汇集，那片地狱的全貌正逐渐清晰。他摘下眼镜呆坐着，任凭新到的电报在指间簌簌作响。\n\n“地图上这个畸形怪物绝不可能长久。”格拉夫斩钉截铁地开口，指尖重重戳向地图，“看看——由那个叫胡蒂格的德国屠夫统治的庞然大物，迟早要分崩离析。连德国人都撤回了支持，真是讽刺。”他嘴角扯出冷笑，“他们倾尽全力想征服我们，结果反噬自身。若能亲眼见证元首办公室里的场景该多好——看着非洲从指缝间溜走却无能为力。”\n\n“北部正在上演人间炼狱，你怎么还笑得出来？”扬投来痛苦的一瞥。\n\n“扬。”迪夫按住他颤抖的肩膀，“这意味着我们安全了，南非永远摆脱了德国人的威胁。这个地狱巨兽正在走向灭亡，德国人连一根稻草都捞不回来。虽然代价惨痛，但对我们确实有利。”说着意味深长地看了埃尔金一眼。\n\n“我建议暂缓复员计划，加强边境防御。”埃尔金会意地接话，“至于难民，应当尽可能接收并妥善安置。国民已厌倦战争，我们没理由进攻那个地狱国度。但至少能帮更多人逃出来。”晨光穿过百叶窗，在他冷峻的面容上投下道道光栅。"
 HDV_SAF.71.a: "坚定守住，就有转机。"
 HDV_SAF.72.t: "北方的地狱"
