 POLITICS_VILLIERS_GRAAFF_DESC_2: "南非战争猛烈爆发后，德·维利尔斯·赫拉夫片刻未停便开始操纵局势以谋取政治私利。这位曾主张完全中立的鼓吹者，在首批布尔人进攻消息传来时便立即抛弃原有立场，转而将美国视为救星，而此时北部的德国殖民地正备战待发。\n\n从某种意义而言，这场战争本是场灾难，但向来善于权变、缺乏远见的德·维利尔斯·赫拉夫立即着手利用战争创造的机遇。他高举自由伟业的光辉旗帜，以布尔人及其德国盟友的奴役威胁为号角，将自己塑造为超越政党与国家的启蒙灯塔，呼吁自由世界捍卫南非存在缺陷的民主制度。过往所有过失与疑虑皆被搁置，每个南非人都被号召投身卫国之战。\n\n随着忠诚派为共同事业集结，南非有色人种与黑人群体也意识到局势严峻，德·维利尔斯·赫拉夫的声望急剧攀升。他俨然以战时总理姿态掌控全局，始终立于权力之巅……只要战争态势尚能维系。"
 POLITICS_VILLIERS_GRAAFF_DESC_3: "尽管困难重重，德·维利尔斯·赫拉夫仍稳坐南非总理之位，其任期即将届满十年。左翼的挑战、右翼的阻力、布尔人势力、非国大乃至纳粹德国的武力，都未能阻止“迪夫”继续掌权——统一党对南非政坛的统治已延续至战后时期。\n\n这个国家曾遍体鳞伤、饱受摧残，却始终未曾崩溃。凭借务实的军事改革、巨额国防投入，当然还有美利坚合众国源源不断的援助支持，橙白蓝三色旗至今仍在好望角上空高高飘扬。中立立场已彻底成为历史，如今南非（连同迪夫本人）作为OFN的新成员，正沐浴在无远弗届的美国影响力之下。南非历史的新篇章即将开启，随着新旧势力开始蠢蠢欲动，越来越多人质疑统一党的执政时代是否即将终结。\n\n纵使南非沧桑巨变，德·维利尔斯·赫拉夫却始终如一。虽鬓染霜华、皱纹渐深，这位充满魅力却缺乏远见的务实派领袖，仍如1956年初登政坛时那样，每次都能从危机中脱身，继续牢牢掌控着彩虹之国的命脉。而对统一党而言，永恒的核心议题始终只有一个：\n\n究竟要付出什么代价，才能让迪夫再掌权五年？"
 POLITICS_JANIO_THE_TERRIBLE_DESC: "雅尼奥·达席尔瓦·夸德罗斯·伊·莱切·德圣玛丽亚·德阿拉贡·科莫埃斯塔斯·穆乔斯·韦沃斯一世是南阿美利加开明君主的典范——这种君主在现代社会已极为罕见。他原本是来自墨西哥的巴西裔打蜡工，在硅梦浪潮的推动下被冲到了开普敦附近。雅尼奥最初在波切夫斯特鲁姆的法拉利工厂担任职业赛车手，在赢得1952年摩纳哥大奖赛后，他晋升为欧洲首席赛车手。\n\n凭借双瞳四耳一胡须的异相，凯旋归来的雅尼奥·达席尔瓦·夸德罗斯·伊·莱切·德圣玛丽亚·德阿拉贡·科莫埃斯塔斯·穆乔斯·韦沃斯发现新家园因各族群分裂而动荡，君主制问题更是争议焦点。他手持奖杯直闯议会，要求加冕为南阿美利加皇帝。全体民众为雅尼奥·达席尔瓦·夸德罗斯·伊·莱切·德圣玛丽亚·德阿拉贡·科莫埃斯塔斯·穆乔斯·韦沃斯欢呼，拥立他为正统君主，甚至将国名改为他的尊号。\n\n南非已成历史，如今这是雅尼奥一世皇帝圣治下的南阿美利加。皇帝万岁！愿他永远用双瞳凝视不同方向。"
 SAF_Jan_Hendrik_Hofmeyr_hog_2_desc: "§Y副总理\n进步自由主义§!\n--------------\n扬完全不明白发生了什么。难道他与自己的人民如此脱节，竟未能预见到他们彻底的背叛？他一直在统一党内孜孜不倦地维护阿非利卡人的利益，同时努力将事态引向正确方向。\n\n但所有努力都付诸东流，如今他只能竭力挽救这糟糕的局面。这位热爱和平的知识分子被迫在战争期间领导统一党，霍夫迈尔深知自己力不从心，却依然为自由的南非继续奋斗。"
 SAF_Vause_Raw_eco_2_desc: "§Y经济部长\n家长式保守主义§!\n--------------\n他们怎么敢！这些北方横行霸道的叛徒竟敢背叛南非。布尔人当然从来都不可信，没错，他们应该像黑人一样被剥夺投票权。但当务之急，是要彻底粉碎布尔人妄想建立自己国家的迷梦。他们两次败给不列颠，而如今沃斯将确保第三次成为他们的最终败局。\n\n沃斯·罗日夜不停地鞭策战时经济前进，他心中唯有一股捍卫南非的强烈动力——在这片土地上，大不列颠的精神依然生生不息，未被德意志的威胁所摧垮。"
 SAF_Jacobus_Strauss_2_for_desc: "§Y外交部长\n自由保守主义§!\n--------------\n显而易见的是，南非会陷入一场内战。德国人当然在北方蠢蠢欲动，渴望加入冲突。这个国家当然对即将来临的风暴毫无防备。在那位毫无主见、漫无目标、缺乏胆识的总理领导下，除了这些还能发生什么？\n\n施特劳斯非常清楚这一切为何发生，而那个应对所有问题负责的人却依然领导着本该属于他的统一党。现在是时候开始筹备夺回总理宝座了——在担任南非外交部长的同时，他与美国及党内其他关键人物建立联系，试图为自己争取支持。"
 SAF_Colin_Eglin_sec_2_desc: "§Y国防部长\n进步自由主义§!\n--------------\n科林·埃格林突然成为赫拉夫内阁中最重要的大臣，而他并未回避这一重任。随着国防开支激增以及美国在此危机中向南非伸出援手，这个曾经最清闲的职位已变得至关重要。\n\n当埃格林着手捍卫南非自由，同时尽可能引入美国影响力以促使其成为国内向善力量时，所有推动德·维利尔斯·赫拉夫接受更进步立场的尝试都被暂时搁置。自由火炬必将长明，而埃格林将是执炬之人。"
 SAF_Jan_Hendrik_Hofmeyr_hog_3_desc: "§Y副总理\n进步自由主义§!\n--------------\n说这场战争让扬·亨德里克·霍夫迈尔耗尽心力都算轻描淡写。他的健康状况承受着巨大压力，战争结束时，他非常清楚自己即将退休。\n\n尽管如此，他始终毫无疑虑地为国尽责，如今正计划将统一党自由派的领导权移交埃格林，同时准备为自己毕生的政治生涯画上句号。"
 SAF_Vause_Raw_eco_3_desc: "§Y经济部长\n家长式保守主义§!\n--------------\n尽管布尔人和德国人百般企图摧毁南非，但此事已尘埃落定——南非的精神依然坚不可摧。然而沃斯无暇庆祝，他正计划携众多优秀的盎格鲁绅士脱离统一党，组建新政党。\n\n新保守党将成为南非政坛的真正力量，有望助力击退那些企图将国家拱手让给非国大暴民的软弱自由进步派。南非历来属于不列颠，未来也当如此。"
 SAF_Jacobus_Strauss_for_3_desc: "§Y外交部长\n自由保守主义§!\n--------------\n现在是施特劳斯获得领导南非机会前完成最后准备的时刻。当那个没脑子的蠢货在电视上发表更多空洞演讲时，施特劳斯正在寻求关键人物的支持，以最终确保统一党的领导权。  \n  \n在获得亨利·奥本海默的初步支持以及美国大使半心半意的声援后，他已做好准备采取行动，夺回被德·维利尔斯·赫拉夫窃取的正当头衔。"
 SAF_Colin_Eglin_sec_3_desc: "§Y国防部长\n进步自由主义§!\n--------------\n一项任务已完成，现在该回归正轨了。科林已准备好推动联合党的进步派系，最终实现国家更深层次的改革。作为美国在南非施加影响的渠道，埃格林希望在山姆大叔的帮助下推动南非前进。\n\n新组建的联邦国防军将按照美国标准塑造，配备美式装备并获得美国支持，时刻准备保卫开普敦免受任何威胁。迟早有一天，南非会将自由之火种传递至全体人民，而非仅限少数幸运儿。"
