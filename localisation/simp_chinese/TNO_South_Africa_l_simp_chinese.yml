 SAF_SOG_category_desc: "研究观察团是一个由经验丰富的美国情报和准军事人员组成的团队，在中央情报局所属下工作。在退役空军军官爱德华·兰斯代尔的领导下，他们在全球各地暗中行动，支持和捣毁了无数的暴动和叛乱，以保护美国人的生活方式。他们在南非的到来可能有利于我们与纳粹的斗争，但无论SOG去到哪里，麻烦总是接踵而至。"
