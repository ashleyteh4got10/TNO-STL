 SAF_IA_OBW_tt: "§O牛车哨兵§!\n实力：[?SAF_OBW_power|W2]%\n--------------\n§O牛车哨兵§!成立于1939年，大约在第一批阿非利卡人离开开普殖民地、寻求摆脱英国控制的未来一百年后。然而§S英国人§!并不满足于仅仅从§O阿非利卡人§!手中夺取开普地区，不久后，少数几个§O阿非利卡人共和国§!也被他们征服。尽管如此，建立§O人民邦§!——一个真正的阿非利卡人家园——的理想从未消逝。§O牛车哨兵§!成为这一理想最坚定的捍卫者。\n\n第二次世界大战期间，由§,约翰尼斯·范伦斯堡§!领导的§O牛车哨兵§!实施了破坏活动。战后其成员§V遭到流放§!，但他们继续§j积蓄力量§!，组建准军事部队。随着§O阿非利卡人§!不满情绪的高涨——这种情绪源于他们认为§S英裔领导人§!正在边缘化自己——§O牛车哨兵§!获得了由同情者和愿意为§O人民邦§!理想而战的民兵组成的更广泛支持基础。"
