 HDV_SAF.84.t: "迪夫的来信"
 HDV_SAF.84.desc: "亲爱的沃斯，\n\n祝贺您在选举中取得的成就，想必创立一个政党并立即带领它在此次选举中取得巨大成功并非易事。在您即将就任总理之际，我必须提醒您领导这个优秀国家所需承担的责任以及如何推动国家前进。\n\n南非是一个传统深厚的国家，作为大英帝国骄傲的后裔，至今仍由像您这样的杰出绅士领导。然而，完全固守您所极力倡导的现状并非明智之举。成为一名优秀的总理意味着要具备适应力，在猝不及防之前灵活应对不断变化的时代。\n\n回想起来，我在战前准备得太少，曾徒劳地希望德国人能成为体面、可敬的民族，而非企图统治世界的残暴族群。我不愿顺应时代变迁，这几乎导致南非毁于一旦。\n\n我毫不怀疑您将成为一位出色的总理，只要您保持警惕、随机应变。毕竟，灵活性与务实精神正是英国绅士最宝贵的品质。\n\n若您在事务上需要进一步建议，我随时愿意提供帮助。\n\n此致"
 HDV_SAF.84.a: "德·维利尔斯·赫拉夫爵士，第二代从男爵"
 HDV_SAF.85.t: "迪夫的来信"
 HDV_SAF.85.desc: "亲爱的雅各布斯，\n\n祝贺你成功与拉夫的新保守党组成联合政府，并因此获得了首相职位。自1956年输给我以来，你一直努力的目标终于实现，这一定让你非常满意。我早就知道从那时起你就一直试图取代我的位置，如今统一党在最新选举中落败，你终于得偿所愿。我猜你并不期待与沃斯及其顽固的保守派结盟，但这是你现在要面对的问题，与我无关了。\n\n现在轮到你在这个国家留下印记了。既然本国历史上最重大的危机已由我亲手解决，我相信你接下来的路会轻松许多。多年来对你发号施令实为乐事，可惜天下无不散之筵席。\n\n若需就各类事务寻求建议，不妨咨询沃斯或他那些背信弃义的分裂同党——我确信他会像当年配合我那样热忱地与你合作。\n\n此致"
 HDV_SAF.85.a: "德·维利尔斯·赫拉夫爵士，第二代从男爵"
 HDV_SAF.86.t: "迪夫的来信"
 HDV_SAF.86.desc: "亲爱的科林：\n\n祝贺你与进步党成功组建联合政府，祝愿你在带领统一党迈向新时代的征程中一切顺利。虽然我们已免遭德国通过征服手段的统治，但若不能坚定捍卫自身利益，沦为美国附庸的处境也未必更加理想。\n\n在你担任国防部长期间，我不仅注意到你倾向进步主义的趋势，更观察到你对推动美国在南非利益的长期热衷。尽管与华盛顿的合作关乎我国未来，但守护南非不致沦为美国经济傀儡国的责任正系于你肩。\n\n我们应成为OFN中平等而关键的一员，望你能在此间达成精妙平衡，为我国经济保留灵活空间。当大力促进与OFN其他成员国及南美洲的贸易联系，以开辟替代渠道，削弱美国的整体影响力。他们如今是我们的友人、安全伙伴与盟友，但若你稍有不慎，恐将演变为我们的主宰者。谨祝你和进步党盟友引领国家前程似锦。\n\n若需就相关事务进言，我随时愿效绵薄之力。\n\n此致"
 HDV_SAF.86.a: "德·维利尔斯·赫拉夫爵士，第二代从男爵"
 HDV_SAF.87.t: "迪夫的来信"
 HDV_SAF.87.desc: "亲爱的哈里：\n\n祝贺你在近期选举中取得令人震惊的胜利。像贵党这样的小党派能成功迈入政治主流并参与执政，再次印证了一个国家政治风向转变之迅猛。显然你建设更进步国度的主张已深入人心，如今终于获得机会将国家引向该方向。\n\n但我们必须认识到，尽管南非史上最危险的危机已度过，其后续影响仍将长期存在。这个国家远未达到你我期望的稳定状态，任何方向的激进改革都可能再度动摇国本。\n\n我谨建议推行稳健持久的温和改革，而非采取可能引发反弹并导致前功尽弃的激烈举措。在我执政期间，通过平衡党内保守派与进步派的利益，成功维持了国家稳定——直到那些暴力的阿非利卡极端分子侵袭我们美丽的国土。作为南非总理，我尤其要劝诫你在政治事务中保持审慎。\n\n若需进一步建议，我随时愿提供协助。\n\n此致"
 HDV_SAF.87.a: "德·维利尔斯·赫拉夫爵士，第二代从男爵"
