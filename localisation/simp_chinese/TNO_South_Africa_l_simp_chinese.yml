re was no doubt in his mind that his political career was now over, and he should take a bow and pursue a polite exit before his party would aggressively show him the door. It was a darned shame that Strauss would end up leading the United Party, but there was nothing he could do about that now."
 HDV_SAF.236.a: "Time to retire back to his vineyard."
 HDV_SAF.237.t: "A Bleak Reality"
 HDV_SAF.237.desc: "The Progressive Party had taken a great blow, perhaps fatally so. It had not just lost, but lost all but one of their seats in parliament, leaving Harry all alone. The country seemed to have massively voted for the Conservatives and United Moderates. Not only had the Progressive Party failed to gain any seats, but their potential allies in the progressive wing of the United Party also looked to be nearly fully decimated. In effect, this was enough to destroy the idea of progressivism in South Africa for decades.\n\nWhile the crowds thinned quickly, the core members of the party stuck together even though it looked like the whole political party might even crumble. In this moment, Harry wondered to himself if he had been naive in hoping for a better tomorrow in the first place, now that there was no doubt that Raw would drag the nation backwards. Now, the soon-to-be Prime Minister Vause Raw, who couldn’t stop lecturing everyone on how things should always have been and how he would clamp down on the unruly Natives of South Africa with a firm hand. That man, whom Harry so despised, would be in government, and he would be left with no other choice but to figure out some way to hold back the influence of the NCP.\n\nBut what was truly worst of all was that he had allowed himself to hope. To hope for a chance, a turnaround, a new start, none of which they got. It truly was the hope that crushed his spirit, that caused the pain that was now killing him inside. Quietly, he cursed himself for daring to believe and not just settling for modest expectations. Or any expectations at all."
 HDV_SAF.237.a: "The end of the progressive cause on the Cape."
