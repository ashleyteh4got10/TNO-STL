 SAF_harder_mode: "§I许蒂希的复仇§!"
 SAF_difficulty_category_desc: "为了获得更具挑战性、更持久且更有风味的§Y南非战争§!体验，建议您启用额外难度模式。这些模式将增强非洲之盾国家的实力，从而打造一场§x更为艰难§!的南非战争。\n\n从§Y狩猎之旅§!开始，您的敌人将明显变强，但仍完全有取胜可能。§O炮火中的开普§!则会显著提升您在保卫南非及最终反攻阿非利卡人民邦与专员辖区势力时面临的难度。最后还有§I许蒂希的复仇§!——这是场毫无保留的终极考验，当德军以毁灭性的怒火向开普敦进军时，必将把南非推向存亡边缘。§h请注意：一旦选择任一难度模式，将无法再次禁用。§!\n\n这些决议将在游戏开始一年后消失。"
