 SAF.165.t: "Heavy on The Mind"
 SAF.165.desc: "Rowan stubbed out his cigarette in the ashtray as he turned into the side road. Daniel looked on to the dirt track before him. Dimly lit by the headlights of the Bedford truck, the bush could barely mask the smell that was coming from behind.\n\nProceeding onwards, Rowan’s eyes wandered to Daniel, brooding at the passenger door.\n\n\"So, do you want to tell me what’s bothering you in that corner or are we going to endure this silence all the way back to town?\"\n\nDaniel decided it was time, they were having this conversation. \"Killing a bunch of people in their sleep and throwing them in unmarked graves in the countryside?\"\n\n\"Look here kid, these people went to sleep on their good and godly conscience that they were out to destroy South Africa for their own political gain. Our government knows this. This is for the people, for our livelihood and our communities. They wanted us dead. It was either us, or them.\" As Rowan pushed his cigarette against the glowing red coil.\n\n\"Killing them in their sleep was the only option we had? Not even throwing them in a jail cell was a consideration? How moral are we to judge and kill these so-called enemies of the state?\"\n\nRowan bit back. \"Just because you have morals does not make you a better person. Last I remembered you put a bullet in the men just the same as me. If you want a judge, go talk to a fucking priest and confess your sins.\" as he inhaled a puff.\n\nDaniel, unable to accept hypocrisy, shouted at his partner to shut up and get the job done. He was done with this assignment."
 SAF.165.a: "Neither would speak to the other as they ran along in the nigh."
