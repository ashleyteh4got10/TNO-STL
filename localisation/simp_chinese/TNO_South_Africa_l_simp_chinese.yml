 SAF.160.t: "A Call for Unity"
 SAF.160.desc: "\"... There is a cancer, an evil attempting to infest our brave Homeland!\" The screen of the television changed, depicting three soldiers of the African Reichskommissariats, each holding rifles that were pointed at a family of five who looked terrified for their lives.\n\n\"They are attempting to force slavery on all our people and put them into damnation, including YOU!\" The screen changed once more, now depicting several malnourished-looking men, women, and children mining.\n\n\"They will attempt to erase all of our culture!\" The screen yet again changed, depicting several German soldiers planting explosives in a museum.\n\n\"Yet despite the cancer, there remains one last hope! The courageous people of South Africa! YOU are the last line of defense standing between our fathers, mothers, sisters, brothers, neighbors, and the onslaught against us. Will YOU let them take away their lives? NO! Despite our differences, whatever they may be, WE are all one people, with OUR courage, bravery, nobility… WE shall never let them have our nation!\" The screen changed back, the three German soldiers were taken out, and a diverse bunch of soldiers rescued the family. The malnourished men, women, and children were set free by Afrikaners fighting for South Africa. The museum was saved as the Germans were taken out. And slowly the screen faded to black."
 SAF.160.a: "The enemy of life will be crushed!"
 SAF.161.t: "钢印"
 SAF.161.desc: "哈里漫步走过公司旗下最大的矿物精炼厂之一，工人们和监工们正在岗位上忙碌。他在危险区域外抽着雪茄，走到精炼厂现场经理的办公室门前，敲了敲门便推门而入，随后将门关上。“赫里特，我们得谈谈。就现在。”他开口说道，为这场谈话定下严肃的基调。奥本海默锁好门，在办公桌前的椅子上坐下：“我很清楚你的问题行为，斯米特先生。直说吧，你对公司来说是个累赘，我要你离开。”\n\n“搞什么？为啥？！”赫里特质问道。“你心知肚明！而且我也不喜欢你的态度！你威胁到我员工的安全，我的秘书桌头堆满了他们的投诉信，更不用提你那些婚外丑闻！”哈里厉声斥责。精炼厂外仿佛骤然寂静，机器停止了运转。赫里特环顾四周，哑口无言。片刻后，他低着头说：“……下班前我会清空所有物品，先生。”随即离去。\n\n哈里将雪茄摁灭在旁边的烟灰缸里，也起身离开，准备处理接下来的要务。他在纸上奋笔疾书，起草并签批了重组名下所有精炼厂的方案，以支援战争所需。全南非的工人们阅读着新指令，从未如此坚定地想要为国家贡献力量。日复一日，哈里注视着工人们以最快速度精炼出最优质的矿物，确保不浪费分毫。\n\n每批成品刚下线就立即装车，运往全国各地的兵工厂。奥本海默家族与其他企业、政府之间的合作因此深化，一切都是为了祖国。无论是天意还是人为，每个人都在以或微小或无人知晓的方式贡献力量，而这一切终将汇入战争的洪流。哈里仰靠在办公椅上，望着川流不息的运输车队，脸上浮现出欣慰的笑容。"
 SAF.161.a: "“男人上产线，矿产赴前线。”"
