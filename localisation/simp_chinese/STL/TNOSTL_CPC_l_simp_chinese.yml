STL_CPC_2_main_story.4.t: "东进"
STL_CPC_2_main_story.4.d: "过了长江，景致就全变了。\n\n满眼都是水。田是水田，路是水路，连空气都湿答答的。李太根从车上下来，脚踩在地上，觉得这地软得很，不像老家的土，硬邦邦地结实。老家那个地方，山是石头山，坡是陡坡，踩下去是实的，你知道自己站在哪儿。这里走两步鞋底就带泥，黏糊糊地甩不掉。\n\n他站在路边点了根烟，望着远处灰蒙蒙的村子，心里空落落的。来之前，他把笔记本翻来覆去看了好几遍，人口、亩产、河道走向，密密麻麻记了一本。可真站在这片土地上，那些字忽然都浮在纸上了，跟眼前的东西对不上号。他知道该修堤、该挖渠，可这些事在老家闭着眼都能干，到了这儿却不知道从哪儿下手。水太多，多到他不晓得怎么对付。老家的旱地，你挖一条渠水就顺着走；这里的水不听话，你堵它它往别处钻，你引它它赖着不动。\n\n头一回去乡公所，本地年轻人汇报了半天，他就听懂了三个字——水，田，难。他问通讯员：“他说了啥？”通讯员也摇头。两个人对看一眼，笑了，笑完心里堵得慌。他忽然想起临走前领导说的那句话：“你是去接手一个摊子，不是去接管一块地。”现在才琢磨出味儿来。地是死的，人是活的，摊子是人和地搅在一起的烂账，得从头捋。\n\n第二天五点半他就醒了，这个钟点醒了几十年，改不了。他把中山装扣子系好，用冷水抹了把脸，叫上通讯员：“走，进村。”\n\n村口老槐树下蹲着几个农民，看见他走过来，往后缩了缩。李太根不说话，学他们蹲在石碾子上，从兜里摸出半包烟，自己叼一根，又递过去一根。有个年纪大的接住了。李太根咧嘴笑了一下，指了指河边歪歪倒倒的堤坝，用浓重的陕南腔说：“这堤不行。”那人没说话，也没把烟还回来。李太根蹲着抽完一根烟，忽然明白了一件事——在这地方，你得先让人家认你这个人，才轮得到认你的办法。他以前做事喜欢从图纸开始，现在因为他外乡人的身份，得从蹲在石碾子上递烟开始。"
STL_CPC_2_main_story.4.o: "从零开始，从头再来"
STL_CPC_2_main_story.5.t: "关于迅速开办干部速成干校的指示"
STL_CPC_2_main_story.5.d: "各大区省委、市委、地委及县委:\n\n当前，全国解放战争已取得决定性胜利，新解放区迅速扩大，各地城市接管、农村建政、财经管理、文教恢复等各项工作全面铺开，急需大量经过培养的基层干部充实到工作岗位中去。现有人数远不敷实际需要，且南下、东进干部调动频繁，各地普遍面临“干部荒”的紧迫局面。\n\n为适应形势发展，各地必须立即着手开办干部速成干校，以短期培训方式，大量吸收工农积极分子、青年知识分子和新解放区进步人士，集中施以政策教育、群众工作方法及基本行政技能训练。每期训练以三个月为限，力求学以致用，结业即能上岗。干校须坚持理论与实际结合，以本地典型案例为教材，注重培养解决实际问题的能力。\n\n各级党委须将速成干校工作列为当前第一要务，选调得力干部任教，保证教学经费与场所。务必克服“慢慢来”“等条件”等消极思想，以战斗姿态推进此项工作。干部培养关乎政权巩固与民心向背，稍有迟缓，必将贻误大局。望各地接此指示后，立即研究部署，限期开办首期班次，并将情况及时上报。\n\n注：\n① 本指示下发至各省委、市委、地委及县委，由各地党委主要负责同志亲自督促执行。\n② 速成干校首期班次须于接到本指示后三十日内正式开学，不得借故拖延。\n③ 各地选送学员条件、教学大纲及经费预算，应于开学前抄报上级党委备案。\n④ 本指示自下达之日起生效，此前与本指示相抵触的各项规定，以本指示为准。\n\n中国共产党中央委员会"
STL_CPC_2_main_story.5.o: "[Getyear]年[Getmonth]月X日"
STL_CPC_2_main_story.6.t: "雨"
STL_CPC_2_main_story.6.d: "暮春的雨一连下了三日，档案室的白墙上洇出淡黄的印记。林守谦把最后一份伪市政府的人事卷宗码进藤条箱，箱底压着半张未填完的履历表——那是他去年冬天为自己准备的，终究没用上。\n\n窗外的梧桐正落着旧年的果子，一颗颗砸在青石板上，闷闷地响。他记得民国三十六年冬，也是这样的雨天，副局长陈伯昭在公馆宴客，留声机放着《夜上海》，雪茄的烟裹着东京香水的味道从二楼飘下来。陈伯昭的太太新置了貂皮大衣，说是托人从满洲国带的。\n\n林守谦的薪水那时已欠了三个月。妻在里屋纳鞋底，总把麻线搓得格外长，仿佛线长了就能多撑些时日。大女儿要交学费，小儿子的咳嗽总不见好。他去财务科问过几次，科长只是翻着金丝边的账本摇头，说上面也没拨下来。可上个月陈伯昭还换了一辆新车，丰田的小轿车，亮得像一块墨玉。\n\n清退通知是月初贴出来的。红纸黑字，盖着鲜红的印章。办事处的同僚们聚在廊下看，谁也不说话。然后就是交钥匙，交印章，交档案。林守谦交出了那把用了四年的铜钥匙，金属上还带着他掌心的温度。\n\n最后一日，他把藤条箱搬到门房老周那儿。回身时看见档案室空荡荡的架子上，还落着一枚别针——银质的，嵌着小小的蓝宝石，不知是哪个女职员落下的。也许是陈伯昭的秘书，那个总穿阴丹士林旗袍的姑娘，上月就不见了。\n\n雨歇了。远处传来新政府的广播声，字字清晰。林守谦走过湿漉漉的院子，鞋底沾满了梧桐叶的碎屑。他没有回头，只在门口站了站。门楣上那块“市政府”的牌子已经摘了，露出底下浅色的木痕，像一道愈合中的伤。"
STL_CPC_2_main_story.6.o: "时过境迁"
STL_CPC_2_main_story.7.t: "留用"
STL_CPC_2_main_story.7.d: "周明远把钢笔搁在砚台上，墨迹未干的表格上写着“拟留用人员审批表”几个字。窗外传来腰鼓队的排练声，咚锵咚锵的，把办公室里积年的沉郁都震散了。\n\n他记得三年前刚来这间屋子时，满墙贴着“反共救国”的标语。那时候他还是个实习科员，每天经手些户籍档案。有天夜里值勤，他看见一份秘密通报名单，上面列着几个学生的名字——其中一个是他在夜校教过的，总坐在最后一排，笔记写得极认真。周明远把那份名单搁到了最底下，第二天便压进了“已办结”的卷宗里。后来那学生还是被捕了，他常想，要是自己能再大胆些就好了。\n\n同事们大多走了。姓黄的科长在解放军还没到时就飞了台湾，临走还劝他：“小周，你不走？”周明远摇头。他想起去年冬天，市政府给各科室发了配给米，黄科长让他把三等米换成头等米送回家，他悄悄把自己的那份又换回去了，倒在食堂的大锅里，对厨子说：“大家匀着吃。”\n\n留用谈话是在新政府的办公室进行的。问话的是个穿灰布军装的年轻人，比他大不了几岁，桌上摊着他的档案，边角有些卷了。年轻人问了问他的家庭情况、工作经历，翻到一页时停顿了一下，问：“前年冬天，你在档案科?”\n\n“是。”\n“有一份通报名单，上面的人数和最终被捕人数对不上。”\n\n周明远手心出了汗。他低下头，看见自己袖口磨出的毛边。\n\n“少了三个名字，你知道是谁吗?”\n他沉默了一会儿，说：“是我划掉的。”\n\n年轻人合上档案，站起来，伸出长着茧子的粗糙手掌。周明远握上去时，听见对方说：“欢迎留下。”\n\n如今他还在原来的办公室，只是墙上换了新的标语——“为人民服务”。腰鼓队排练完散了，楼下传来孩子们唱新歌的声音。周明远继续填那张表，最后一栏写着：“该员在旧机构任职期间，无压迫民众行为，且有保护进步人士表现，建议留用。”"
STL_CPC_2_main_story.7.o: "要开始新的工作了"
STL_CPC_2_main_story.8.t: "告状"
STL_CPC_2_main_story.8.d: "赵家坳的晒谷场上，锣声响了三遍。\n\n王老栓蹲在碾盘边上，旱烟锅子里的火星一明一灭。他瞅着场中央那堆新粮——上头盖着红布，说是公家拨的救济粮，可村公所的李德贵三天前就说是“上级发下来了”，到今天还不分。昨儿夜里，老栓去李德贵家借磨，隔着柴门看见他婆娘正往缸里倒麦子，白花花的好粮食，足有半口袋。\n\n“那粮袋子角上有个墨印的'救'字。”老栓今早对民兵队长说这话时，嗓子眼发紧。他在旧社会扛了二十年长工，识得什么是公粮私粮——李德贵缸里的，跟晒谷场上盖红布的那些，是一样的口袋。\n\n锣声歇了。晒谷场上聚了小一百口人，比过年还齐整。李德贵站在戏台上，穿件半新的蓝布衫，腰里别着钢笔，说救济粮要等“统筹安排”，说大家要“相信组织”。底下没人应声。\n\n王老栓挤到前头，从怀里摸出个小布袋，里头是几颗麦粒。他举起来，手有些颤：“李主任，你家缸里的麦子，咋跟这救济粮是一个成色？”\n\n场上静了一瞬，接着像开水锅似的翻滚起来。二丫说她前天看见李德贵往家扛东西，大牛说李德贵的小舅子开磨坊，最近没进粮却出了三袋白面。声音越来越大，从屋檐底下、从碾盘边上、从人堆里头冒出来，汇成一片嗡嗡的雷。\n\n李德贵的脸白了。他掏出手帕擦额角，那帕子白得晃眼。\n\n新来的区工作队长姓吴，站在人群外头听了半晌，让民兵把李德贵请下来，又让人去搜了他家。两个时辰后，粮缸里的救济粮抬到了晒谷场上，一共四袋零七升，封条完好，墨印清晰。第二天开群众大会，李德贵站在戏台上，腰里的钢笔没了，蓝布衫也皱了。王老栓头一遭坐在前排，手里还攥着那个小布袋。吴队长说，这就是民主，老百姓的眼睛是雪亮的。\n\n分粮的时候，王老栓拎着口袋走到粮堆前，抓了一把新麦，搁在鼻子底下闻——有太阳晒过的味道。他回头看了看晒谷场边上那棵老槐树，三年前国民党保长在那棵树上吊死过一个欠租的佃户，如今树上系着红绸子，是新政府开会时挂的。\n\n李德贵被押走那天，打村口过，没人看他。只有一条黄狗跟着走了一段，又折回来了。"
STL_CPC_2_main_story.8.o: "不为民生，则因民死"
STL_CPC_2_main_story.9.t: "沉舟侧畔"
STL_CPC_2_main_story.9.d: "上海滩的梧桐还未抽芽，“三反”运动已席卷全城。原国民党财政局留用的主任科员周慕陶，复旦商科毕业，精通财务，却在这场风暴中成了重点“帮助”对象。\n\n他身上的“资产阶级习气”早被同事们看在眼里：每天清晨泡龙井、翻报纸，慢悠悠走进大楼，见到工农出身的同事只点头一笑；午休时偷偷从抽屉里摸出日文版《会计学原理》，像抚摸一件旧时代的遗物；下班后仍改不了去霞飞路喝清咖啡的习惯，仿佛那两毛钱能把他和喧嚣的新世界隔开。这些细碎日常，在批判会上被一一拎出，成了“思想立场有问题”的罪证。军代表拍着桌子说：“你懂业务，可你把业务当成了看不起群众的资本，这就是资产阶级的优越感！”\n\n周慕陶站在台上，嘴唇翕动，却说不出话。他确实没贪污，也没反对新政，可那种根深蒂固的“我和他们不一样”的心思，像一层透明的壳，把他和周围人隔得严严实实。看着旧同事们争先恐后地痛哭检讨、写万言书划清界限，他心里既鄙夷又恐慌——鄙夷他们的变脸之快，恐慌自己若不变，迟早要被清退。\n\n转折发生在一个阴雨天。部队转业的小王抱着账本找他，说一笔旧账对不上，急得衣服淋湿大半。周慕陶本想敷衍两句，却看到对方眼底全是诚恳的急切——那一刻，他想起自己刚入行时的模样。他坐下来，一笔一笔教小王查原始凭证、核对科目余额，讲了整整一个下午。小王走后，他坐在空荡荡的办公室里，窗外雨渐停，天光微亮，心里那道坚冰似乎裂了缝。\n\n后来他在检讨会上说了实话：“我把会计当成了隔开群众的一堵墙。”他以为坦诚能换来机会，可运动越收越紧，组织认为他“旧知识分子根性太重，改造不够彻底”，最终仍被列为清退对象。离开财政局那天，他把那本日文版《会计学原理》留在了空抽屉里。"
STL_CPC_2_main_story.9.o: "而新时代的列车，已隆隆远去。"
STL_CPC_2_main_story.10.t: "天下雪白"
STL_CPC_2_main_story.10.d: "出了山海关往北，走的越深地越硬，等踩上东北的冻土，鞋底都硌得发疼，还漏风，山是沉的黑，河是冻的白，村子散在雪窝子里，安安静静，感觉不出仗刚打完的模样。这是我对关外的第一印象。\n\n自日本人撤走以来，关外的农村说不上安静，马匪出现的频率很高，一来就要劫走乡亲们不少财物，还有村民专门反映了情况：“嘿，你信吗，那日本人比马匪还懂怎么躲！那没来得及跑的日本人干脆就躲到后山那个废窑里，半夜还来偷地瓜吃。”\n\n第二天鸡叫头遍我就起来了，借着雪光往后山走，东北的天亮得慢，看不清，我又带了几位同志上山。\n\n废窑不算难找，半山腰，三孔土窑，原本是烧炭的，窑门塌了半边，剩个黑窟窿对着山沟，还没到跟前，就闻到一股味儿——是霉味混着烂地瓜的甜臭，很冲鼻子；还有一丝若有若无的碘酒味，先蹲下来看地，雪地上有脚印，不是中国式的棉靰鞡，是翻毛军靴的印子，大小整齐，但前掌磨平了。窑壁上刻着字，映着雪光能看清，是“正”字，一排排地划，最后一个正写到第三笔就停住了，旁边还有字，还是汉字：“四月九日，雪，米无。”\n\n我借着火柴探进窑里，就见到一个破棉被，铺盖卷旁边摆着个水缸，缸沿全是豁口，还刻着日文，里头还剩半缸清水，最里头靠墙处，堆着一堆残缺的地瓜皮。我听见窑深处传来一声咳嗽，是人声，很轻的，刚开始听还以为是日语，但那咳嗽声也没再响，只剩风从塌了的窑顶灌进来的声音，不久，随行的同志在洞的夹层发现一个已经断气的人。\n\n退出来后，远处村子里升起炊烟，该是做早饭的时辰了，我回头望了一眼那黑窟窿，他们已经住下了，情况大概和广东类似，真的比马匪懂怎么躲。\n\n春天是东北的农忙时节，从窑口望过去能看到乡亲们扎田，日本投降后，这里的破坏比其他地方少一些，但也没好过哪去，乡亲们的确是对那些日本人恨透了的，他们是侵略者，他们还在关外农村广布，这些流浪者、和那些受灾的乡民应该得到更妥善的处理。"
STL_CPC_2_main_story.10.o: "六月十四日 刘胜，呈送中央"
STL_CPC_2_main_story.11.t: "无可奈何"
STL_CPC_2_main_story.11.d: "在商洛调查走访的纪登奎心里很不是滋味。在一片空荡荡的养猪场里，纪登奎听着赵大爷的诉苦：“我家原来有三十头猪，自从上面说要恢复东部经济生产，我家就自愿献了两头猪，一开始有补贴，家里还能继续，但是，上面突然下了指令，把我家的猪全掳走了。虽然给了补偿款，但周围三十里地没有一家卖猪种的，现在就靠着补贴款和当兵的二儿子寄来的津贴活着。我知道东部经济困难，但也不能不让这里的老百姓活啊！”\n\n连连唉声叹气的赵大爷边说边拿拐杖敲地，纪登奎想不出什么安慰的话，只好告别。随后，纪登奎来到县政府询问基层工作人员具体情况，村支书老李边敲烟头边叹气：“领导，我交个底吧，那三十头猪确实是上交了，不止是猪，我们县的三千斤麦子也上交了，这些麦子本来就是余粮，现在我们县是一点余粮都没有了。”\n\n纪登奎想起来之前在山东的一个村子里调查，发现当地查出的土地与实际不符，一些土地白白地荒着；不少地主囤积居奇，制造流民冲击当地党政机关；还有一部分农民私藏支援的物资，导致不少粮食和牲畜浪费了。\n\n回想起十年前，当时的党中央也遇到了类似的情况，但党中央立刻做出决策，通过一场轰轰烈烈的查田运动搞清楚了大部分地区的生产生活情况。如今，是不是也应该用过去的经验，解决今天的问题？"
STL_CPC_2_main_story.11.o: "势在必行"
STL_CPC_2_main_story.12.t: "年假"
STL_CPC_2_main_story.12.d: "请好年假的刘澜涛在老家的板凳上休息，邻居老王推着手推拖拉机和他打招呼：“老刘，好久不见了！”“老王，好久不见了。”“咋个不在北平了呢？”“年假，回来看看父母。”刘澜涛看着拖拉机，“老王，拖拉机顺手不？”“顺手，顺手。自从有咋个拖拉机，我的背也不驼了，今儿个上工，老张家请假儿，我用这拖拉机帮他家的工也做了。”\n\n老王摘下手套，边擦汗边问：“老刘，北平咋个样啊？”刘澜涛笑着回答：“很大。”\n“人怎么样？”\n“很好，都很朴实。倒是咱们村，我记得去年这里收了很多东部来的流民，他们怎么样了？”\n“早就回家了。听他们说，他们家那头的人来信，说家里受了共产党的恩，日子过来了，就抓紧收拾东西回去了。诶，老刘，你不是在北平么？东边咋样了？”\n“你手里的拖拉机，我在东边已经见惯了。今年土地行情不错，顺利的话就能往西部运更多的粮食了。”\n“那挺好，可算是熬出头了。”\n\n老王点起烟，一道灰色的云雾在空中散去。红色的太阳遮起自己一半的脸庞，悄咪咪地盯着黄土高坡；破碎的山峦上散着几棵小叶杨，潺潺小溪从村口流向东方。这时，两颗白珠从蜿蜒的大道上闪现，引擎的轰鸣声越来越响，刘澜涛一眼看出是送货的。\n\n“乡亲们，县里发福利咯！东边的特产嘿！”"
STL_CPC_2_main_story.12.o: "日子终于是好起来了"
STL_CPC_2_main_story.13.t: "一则新闻（1）"
STL_CPC_2_main_story.13.d: "由老解放区抽调的东进干部工作组深入东部新接管区域，就基层经济组织的重组与生产恢复开展深入的调研与指导工作。东部地区在经历了大战争的剧烈变局与旧秩序的瓦解后，原本的商业网络与生产链条遭受重创，基层农户与手工业者普遍面临生产资料匮乏、销售渠道中断的困境，迫切需要新的组织形式来重新整合生产资源。\n\n负责东进指导工作的中央特派干部在视察东部新建的供销合作社试点时，向随行的当地协调人员详细说明道：“我们在老解放区积累了极为丰富的合作化经验。通过将分散的农户、小装配工与手工业者有机组织起来，不仅能理顺物资统购统销的渠道，降低个体承担的市场风险，还能在秩序初定的过渡期内，集中调配有限的资源，保障群众最基本的日常物资供给。”\n\n当地群众代表在交谈中回应：“过去大家各干各的，遇到灾荒或者价格波动根本扛不住。现在有了合作社统一对接分配，大家心里终于有了底。”\n\n主持政务协调会议的华东局负责人听取汇报后总结道：“各级后勤与财政部门一直密切关注着东部物资供应链的修复情况。老干部们带来的实践经验表明，鼓励并引导合作社建设完全符合当前的组织原则，有助于将东部零散的资源与劳动力重新纳入统一的协调框架，为整体秩序的稳定与后续的经济重塑提供坚实的基层支撑。”\n\n会议最终决定总结东进工作组的试点经验，在东部各县区进一步全面推广供销与生产合作社体制，理顺地方物资调配网络，巩固基层经济阵地。"
STL_CPC_2_main_story.13.o: "推广合作社经验，稳定东部秩序。"
STL_CPC_2_main_story.14.t: "一则新闻（2）"
STL_CPC_2_main_story.14.d: "随着东部局势的逐步平稳，文化普及与思想教育工作被正式提上了行政协调委员会的重要议事日程。新解放区长久以来受旧秩序的愚民政策与战争阴影的双重影响，基层民众的识字率普遍偏低，许多人甚至无法阅读最基本的政令通告，行政指令与政策宣传的下达常因文化隔阂与信息滞后而遇到诸多阻碍。\n\n在新建成的基层夜校教室外，巡视指导的工作人员与几位刚刚结束白天劳作、走进课堂的新解放区学员进行了亲切交流。一位重返课堂的当地居民握着铅笔，向工作人员倾诉了自己的切身感受：“过去在旧体制下，我们看不懂公文，甚至连自己的名字都写不全，总是被那些有产者和旧官僚愚弄。如今在夜校里重新接受教育，学会认字和看报，让我们第一次真切地感受到了作为劳动者的尊严与对未来的希望。”\n\n负责夜校教学的青年教师也向督导组汇报称：“大家学习的积极性非常高，不少人下了工吃完饭就往教室赶，甚至课后还在互相考校字词。”\n\n教育部特派员在教育工作协调会上强调：“扫盲绝不仅仅是简单的文化知识普及，更是一项深刻的组织工作与政治动员。只有让新解放区的人民掌握了文化工具，他们才能真正理解革命委员会的各项政策意图，从而主动参与到地方公共事务与新秩序的建构中来。”\n\n防务与行政协调部门随即签署联合协议，决定在东部各基层社区加大对扫盲夜校的资源倾斜与师资保障，将文化扫盲作为巩固新接管区域群众基础的关键抓手。"
STL_CPC_2_main_story.14.o: "知识即是力量，普及教育。"
STL_CPC_2_main_story.15.t: "一则新闻（3）"
STL_CPC_2_main_story.15.d: "中央行政协调委员会就东部地区的生态恢复与大江大河的水利工程规划召开了专项闭门研讨会。会议桌上铺展开的东部水系与地质图谱表明，由于长期的战乱破坏、旧政权的过度开发以及缺乏统筹治理，导致当地水利设施大面积失修、水土流失加剧，季节性旱涝灾害频发，这严重制约了防务后勤保障与农业生产的长期稳定。\n\n中央水利部长在阅览完规划部门递交的深度调研报告后指出：“从全局战略的高度来看，东部地区生态环境的脆弱性与水利设施的破败，已经直接影响到了国家基础资源的稳定供给。水利设施的兴修与流域治理绝非单一的农业或经济问题，而是关乎整个东部安全屏障能否长期巩固、国家综合实力能否顺利恢复的根本大计。”\n\n水利工程专家向与会代表补充展示了工程测绘数据：“如果能优先修复关键节点的大型堤坝并修建引水渠，不仅能在明春有效抵御洪涝，还能为周边数十万亩良田提供稳定的灌溉水源。”\n\n地方行政长官也表示：“先前的生态治理经验表明，水源的合理调配与防洪蓄水设施的完善，能显著提升地方应对自然灾害的韧性。中央出面统筹大型水利工程的建设，完全符合各方的长远利益，也将得到地方各级部门的全力配合。”\n\n中央最终批准了东部大型水利枢纽与水土保持工程的立项报告，决定调拨专项战备与建设资源，正式启动首期大型水利治理工程。"
STL_CPC_2_main_story.15.o: "统筹生态治理，兴修基础设施。"
STL_CPC_2_main_story.16.t: "一则新闻（4）"
STL_CPC_2_main_story.16.d: "地方政府与战备工业部门联合召开现场办公会议，深入探讨如何利用农村小微工业与乡镇手工业来缓解城市重工业供应链紧张的难题。在东亚大战争后的重建期，城市大型工厂正全力进行重型装备、关键零部件与核心物资的生产，产能已达极限，无暇顾及基础零件、小型农具与轻工消费品的供给。\n\n地方政府负责人在参观完一处集约化的乡村铁木加工与构件制作厂后，向随行的工业协调员说明道：“农村工业的蓬勃发展，极大地减轻了城市重工业体系的配套负担。这些分布在广阔乡镇的小型加工厂，能够就地取材、灵活转产，为城市大工业提供基础配件与初级加工品，形成了一种城乡互补、上下游紧密衔接的良好工业格局。”\n\n车间内的老工人指着正准备发往城里大厂的标准化螺栓和铸铁构件说：“别看我们厂子不大，城里造大机器需要的不少基础小构件，都是我们加班加点赶出来的。”\n\n国家工业部特派员在防务对接会上表示：“后勤保障部门切身体会到了这种补充作用的巨大益处。农村工业生产的农具、建筑构件与轻型装备，保障了基层的日常消耗，使城市核心工业能够集中力量攻关重型装备与关键技术。”\n\n会议决定出台专项扶持与技术指导政策，鼓励地方政府引导农村小微工业规范化、集约化发展，进一步织密全域工业协作网络。"
STL_CPC_2_main_story.16.o: "城乡工业互补，巩固生产基础。"
STL_CPC_2_main_story.16.t: "一则新闻（5）"
STL_CPC_2_main_story.17.d: "中央最高决策层与理论研究部门就深化农村生产关系变革、重塑基层社会结构举行了高规格研讨会。面对东部接管区域错综复杂的土地关系、散乱的小农生产方式与大规模重建对粮食和工业原料的急迫需求，部分代表提出了更为积极、果断的集体化改革主张。\n\n中央理论工作组负责人在深入阐述推行集体化的必要性时强调：“单纯依靠小农经济的自我循环与自发调节，根本无法满足高强度国家建构、大规模工业化以及应对潜在地缘风险对粮食和原料的集中调配需求。我们必须以更高的战略眼光，由中央一级强力推动农业集体化试点，将分散的土地与生产资料高度整合，从根本上重塑农村的生产力与生产关系格局。”\n\n与会的土改专家在研讨中指出：“试点区域将通过统一规划耕作、集中调配大型农具与种子，大幅提升单位面积的产出效率，消解小农经营抵御风险能力差的天然局限。”\n\n中央改革委员会代表发言表示：“先前的实践经验表明，高度组织化的集体生产在面对外部风险与国家动员时展现出了无与伦比的制度优势。从中央层面明确这一战略方向，有助于彻底破除东部旧势力对农村土地与资源的隐性垄断，建立起巩固的基层阶级基础。”\n\n研讨会最终达成倾向性共识，决定在东部条件成熟的重点县区率先启动集中化的农业集体化试点工程，为全域推广积累制度经验。"
STL_CPC_2_main_story.17.o: "以坚定意志推进集体化试点。"
STL_CPC_2_main_story.18.t: "先进并非最好"
STL_CPC_2_main_story.18.d: "七月的襄阳暑气灼人，公社场院的老槐树被晒得蔫垂着叶子，唯有枝桠间的大喇叭不知疲倦地响着，播报着拖拉机助力农业生产的内容。\n\n周德厚蹲在树荫下靠着树干，旱烟锅子一明一灭，汗水顺着脖颈淌下也懒得擦。身旁的石碾子被晒得发烫，没人敢落座，远处田垄上铁蛋开的拖拉机突突轰鸣，声响和广播声缠在一起，闹得人耳根子发涨。\n\n“德厚叔，又听广播呢？”陈志强走过来，草帽底下的脸晒得通红。\n\n“解闷呗。”周德厚吐了口烟，“广播里说飞鸟能吃光整片玉米地，冰雹能砸烂拖拉机，听着跟说书似的。咱这儿虽有飞鸟，但成不了灾，也就一句提醒注意农机道路安全的话在理，昨儿铁蛋开拖拉机还差点撞了渠埂。”\n\n“县里让组织大家学习内容，不让光听个热闹。”陈志强也蹲下来，捡了根树枝在地上随意划着。\n\n“学习？先把那两台拖拉机摆弄明白再说。这喇叭天天喊‘农业学吴堡’，那地方我去过，全是贫瘠土坷垃，条件比咱这儿差远了，他们都能搞出名堂，咱这儿的地还能种不好？”周德厚在鞋底磕了磕烟锅，“合作化确实是好事，修完水渠今年的玉米都能浇上水，可做事总得分轻重缓急，先把能干的事落地，别听见风就是雨。”\n\n“叔您这话在理，县上本来也是这个思路，先抓两个试点社，其余村子不着急铺开。就是喇叭天天循环播，村里年轻人心里都痒得慌，恨不能明天就实现全社机械化。”\n\n“就铁蛋那半吊子技术还机械化？先把他教明白再说别的。”周德厚哼了一声。\n\n广播里之前的节目刚好结束，换了个声开始播报新闻，周德厚没兴致听，撑着膝盖站起身。村口土墙上“工业学长庆，农业学吴堡”的标语在烈日下亮得刺眼，他眯了眯眼，迈开步子往自家地里去。陈志强跟在后面，两人沿着田埂走，谁也没再说话。"
STL_CPC_2_main_story.18.o: "稳扎稳打，步步为营"
STL_CPC_2_main_story.19.t: "三个世界"
STL_CPC_2_main_story.19.d: "习仲勋站在前广东国立法会楼顶，俯瞰城区。玻璃幕墙反着光，街上电车轨道还在，车厢炸翻了几辆。叶剑英裹着军装站身旁，宋之光攥着花名册跟在后头。\n\n“糟蹋了二十多年。”叶剑英指着远处，“发电厂被日商炸了两个机组，越秀三周没电。华人、日本人、珠人混住——日本人聚东山、沙面，自办学校自收税；珠人住市中心，说粤语，两头不认；华人挤在西关和河南。三个世界。”\n\n“先下去看看。”习仲勋说。\n\n下楼穿过骑楼街，商铺大半歇业，几家橱窗摆着晶体管彩电、洗衣机、收录机、电话机。习仲勋停住脚：“这东西，我们造不出来。”\n\n“造不出，也修不起。”叶剑英苦笑，“日立留下的流水线，名字都叫不全，坏一块全国没人修。刘姥姥进大观园，眼睛不够使。”\n“碰还是要碰。不会就学。日本技工没走光，请回来，工钱照给。技术装进脑子，就是人民的。”\n“珠人里，有华人也有日本人，有些恨我们，有些怕，但大多想安生。”叶剑英说，“你说他是敌人，他就是敌人；说他是群众，他就是群众。”\n\n“争取。极少数有血债的按政策办，底下能留用就留用。广东要成工业基地，缺不了他们。但原则讲清：城市是人民的，机器是国家的，由人民说了算。”习仲勋转头对宋之光，“一周内，日立、富士通、索尼、松下和长江实业的资产人员造册报来。流水线专人看守，钥匙收军管会。未经批准，一个螺丝不准拆。我不懂技术，可知道一旦散了，再攒就难了。”\n\n远处几个珠人青年站在骑楼下望这边。习仲勋看了一眼：“先让电灯亮，再让流水线转。让全广东看看，这个刘姥姥，不只是来看热闹的。”"
STL_CPC_2_main_story.19.o: "刘姥姥要在大观园住下了。"
STL_CPC_2_main_story.20.t: "国务院关于统一国家财政经济工作的决定（节选）"
STL_CPC_2_main_story.20.d: "目前国家财政经济特点：全国军政公教人员数量庞大；各地税收公粮由省市县分别管理，收支机关脱节；大陆全部解放后，金融物价波动势必影响全国。政务院决定：\n\n一、成立全国编制委员会。以薄一波为主任，聂荣臻为副主任。立即核实各级人员编制，停止自行招人。旧人员包下来政策不变，但有步骤改造使用。\n二、成立全国仓库物资清理调配委员会。以陈云为主任。限期查明所有仓库存货，不得打埋伏、擅自转移。\n三、厉行节约。各机关工厂规定人员及工作定额，建立保管制度，严惩贪污浪费。\n四、全国公粮除地方附加外，全部归中央财政部统一调度。各省市县非依支付命令不得支取。\n五、关税、盐税、货物税、工商税均归中央财政部统一调度。\n六、国营贸易业务与物资调动由中央贸易部统一指挥。部队机关不得经商。\n七、国营工厂分为中央直管、委托地方管、划归地方管三种。一切公营企业必须按时纳税，上缴部分利润。\n八、指定人民银行为国家现金调度总机构。各机关现金一律存入国家银行，不得对私人放贷。\n九、中央财政部保证军队与地方开支。支付原则：先前方，后后方；先军队，后地方。\n十、凡不实行上述规定者，依法制裁。\n\n过去地方同志做了很多工作。今后仍负极大责任。公粮税收划归中央后，地方经费可能困难，但比财经继续不统一和金融物价大乱之困难要小。必须强调部分服从全体、地方服从中央。\n\n各地领导同志必须更加积极负责。"
STL_CPC_2_main_story.20.o: "全国一盘棋。"
STL_CPC_2_main_story.21.t: "定心丸"
STL_CPC_2_main_story.21.d: "周老板坐在工商联会议厅后排，西装洗得发白，手心全是汗。他开了三家纺织厂，运动一个接一个，他整夜整夜睡不着，就怕哪天厂子被没收。\n\n主持人刚把这位中央来的领导的全名当众通报完，首长紧跟着就开口，简洁明了讲清了此番过来的公务来意，可一旁站着的周老板早已吓得魂不守舍，后背的汗瞬间洇透了衬里，支棱着耳朵使劲听也只剩一片嗡鸣，到最后首长说的内容没进脑子，连人家到底是姓张还是姓王都压根没摸清。\n\n“今天中国不是资本家太多，太发展了，而是太少，太不发展。因为资本家不发展，工人才痛苦。今天资本主义剥削不但没有罪恶，而且有功劳。你们有本事多开工厂多剥削一些工人，对国家人民都有利。今天资本主义剥削是合法的，愈多愈好。剥削的越多功劳越大。”\n\n周老板愣住了。他转头看旁边的人，那人也张着嘴。台上首长还在讲，语气平和得像在谈天气。\n\n散会后，周老板腿发软地往外走。在门口，他一把拽住开米行的老胡。\n\n“老胡，侬听到伐？剥削越多功劳越大！这话是中央讲格！”他压着嗓门，声音发抖，“我本来想开第四爿厂，又怕吃罪，夜里厢困勿着。现在好了，首长亲口讲格，多开厂，多用人，是功劳！”\n\n“你轻点！这种话，听听就好，别到处讲。”老胡压低声音。\n\n“我勿管了！总归是定了心。明日就叫会计去跑手续，再招三百个工人。工人要吃饭，我也要吃饭，大家有得赚。”周老板掏出手帕擦汗，眼睛亮得吓人，“格种日子，有盼头了。”\n\n他望向南京路方向，霓虹灯正在次第亮起来。\n\n“等第四爿厂开工，我请侬吃老酒，去老正兴，点侬顶欢喜格冰糖甲鱼！”"
STL_CPC_2_main_story.21.o: "定心丸吃下去了。"
STL_CPC_2_main_story.22.t: "罪人的心惊胆战"
STL_CPC_2_main_story.22.d: "周老板缩在办公室角落，外头口号声一阵高过一阵。工人们涌进来了，举着红旗，手臂像麦田一样望不到边。他的三家纺织厂已经停工三天，今天终于轮到办公室。\n\n“周老板，出来见见群众！”领头的年轻工人一脚踹开门。\n\n他认得这人，姓顾，在他厂里做了六年工，去年因为迟到被扣过工钱。此刻顾的脸红得发亮，手里攥着一卷纸。\n\n“顾……顾同志，有话好讲，有话好讲……”周老板往后退，背抵住了墙。他的西装更白了，这次是又洗了一遍，想把上面的血迹洗掉。\n\n“谁跟你同志！你是资本家，我们是无产阶级！今天，我们代表全厂工人，宣布东亚第一、第二、第三纺织厂全部收归集体所有！你签字！”\n\n“厂子是国家的，要收也听政府的，你们不能……”\n\n“政府站我们这边！没听见吗？中央说了，要放手发动群众，支持群众运动！你剥削我们这么多年了，天天大鱼大肉，我们连顿饱饭都没有！今天就要跟你算总账！现在签字！不然今天你别想出这个门！”\n\n外头又喊起来：“无产阶级万岁！打倒资本家！”周老板的手抖得像筛糠，终于在文件上画了名字。他写得歪歪扭扭，像鬼画符。\n\n人群欢呼起来。有人开始搬他办公室的家具，有人把账本扔在地上踩。顾同志没走，站在他面前说：“周同志，以后你和我们一样，也是工人了。厂子归公，好好改造。”\n\n周老板抬头看他，眼里全是血丝，突然呵呵笑了两声：“好，好……我改造，我改造……”\n\n当晚，他蹲在被搬空的办公室地板上，抽了一夜烟。天亮他携包走出厂门，他忍不住回头望了一眼他曾经的工厂，但现在熟悉的厂子门头上，不知何时换上了崭新的牌子——上海第十七棉纺织厂。"
STL_CPC_2_main_story.22.o: "厂子成了群众的，老板成了过去。"
STL_CPC_2_main_story.23.t: "赎买资产"
STL_CPC_2_main_story.23.d: "上海第三纺织厂车间外，几个工人蹲在墙根抽烟。黑板报上贴了布告，说厂里实行赎买，张经理领了赎买金，上头又任命他当副厂长。\n\n“这叫什么事？资本家拿钱不滚蛋，还当厂长？”年轻工人赵大壮把烟头一摔。\n“人家有技术。张经理自己会修纺纱机，厂里谁不懂？”旁边老师傅说。\n“那也不该供着他。以前他剥削咱们多少？现在国家拿钱把他厂子买了，他还拿钱，还当官！”赵大壮越说越气。\n\n蹲着的叶哥把烟灰弹了弹，开了口：“你当国家傻？真把他轰走，机器坏了谁修？他要是跑了，厂里几千号人吃什么？赎买就是花钱买他安心留下。钱是国家的，厂子落到国家手里，咱们工人不下岗，明白不？”\n“那也太便宜他了。”赵大壮嘟囔。\n“便宜什么？他以前吃肉，现在只能喝汤。往后他是给咱打工，不是咱给他打工。心里气我也有，可日子还得过。你弟不是刚进厂吗？厂子一乱，你弟还得回乡下。”叶哥站起身，“走，上工。把咱自己活干好，比什么都强。”\n\n众人散了。车间主任跑过来，朝这边喊：“叶昌明！张经理找你，说纺纱车间新到那批机器，让你去点个数！”\n\n叶昌明应了一声，掐灭烟，往车间走去。"
STL_CPC_2_main_story.23.o: "机器照常转着。"
STL_CPC_2_main_story.24.t: "补贴"
STL_CPC_2_main_story.24.d: "张德福攥着工资单，脚步轻快地出了厂办。涨了一级工资，每月多十二块六。十三年前刚进厂时，学徒工资十八块一月，如今翻了快四倍。\n\n回到家，他把工资单拍在桌上。妻子正补衣裳，抬头看他。\n\n“秀兰，涨了！一级工资，九块。”\n\n妻子从灶台后探出头：“真的？你可算熬出来了。这钱得攒着，给娃做件新衣裳。”\n\n“攒啥，该花就花。我是劳动模范，厂里说了，按劳分配，这钱我拿得理直气壮。”\n\n“那老刘家呢？他五个娃，这次涨了没有？”\n\n“涨了半级，说是多子女家庭照顾。哼，要我说，按劳分配就该看贡献，孩子多算啥贡献？国家还得多给钱，这不是拖后腿吗？”\n\n“你这话说的。老刘媳妇身体不好，五个孩子要吃要穿，人家工龄比你还长，就是没评上模范，厂里照顾一下怎么了？社会主义不就是要管这些困难户吗？”\n\n“可我是劳模，我流的汗比他多。他凭啥跟我一起涨？”\n\n“也没跟你一起涨啊，你一级，他半级。再说了，你忘了咱家刚进厂那会儿，你病了一个月，厂里给你送粮票，那会儿你咋不说按劳分配？”\n\n张德福张了张嘴，没接话。他掏出涨薪通知单，又看了一遍，心里还是有点不痛快。\n\n“我也不是不让他涨。就是觉得，这钱该给干活多的人。”\n\n“厂里定的政策，优先劳动模范，其次多子女家庭，这都写在布告栏上。你觉得不公平，可厂里是要管所有人的日子。你以为光靠劳模就能把社会主义建起来？”\n\n张德福不再说话，把通知单放进抽屉。他走到门口，点上一支烟。妻子说得有道理，但他心里那点优越感还在。"
STL_CPC_2_main_story.24.o: "各有各的难处。"
STL_CPC_2_main_story.25.t: "收网"
STL_CPC_2_main_story.25.d: "星期天下午，人民公园满是游人。一个穿灰蓝工装的年轻人靠在槐树下啃苹果，眼睛四处乱瞟。路边卖冰棍的中年人递给看报纸的老头两根冰棍。\n\n“就是他？”老头盯着报纸。\n“错不了，额头上那道疤。昨天在纺织厂后门抢劫，打伤了下夜班的女工。”卖冰棍的压低声音，“东门南门都堵死了，管理处的人也到位了。”\n“再等等，等他往里走，别伤着群众。”\n\n年轻人扔掉苹果核，慢悠悠往湖边晃。经过石桌时，两个下棋的老人同时抬头看了他一眼。他脚步一顿，感觉不对。\n\n就在这时，卖冰棍的中年人猛地掀翻冰棍箱，抽出短棍吼道：“动手！”\n\n然后整个公园动了。下棋的掀了棋盘，打太极的收了扇子，扫地的扔了扫帚，带孩子的女人把孩子塞给旁人，报摊后的男人从摊下摸出手铐。几十个人从四面八方扑来。\n\n年轻人拔腿就跑，没跑出十步，东边冲出三个壮汉，南边树丛钻出四五个，游船码头方向也来了一队。他像被围猎的野兔，最终被按在湖边草地上。\n\n“放开我！凭什么抓我！我是好人！”他挣扎。\n\n一个穿夹克的男人蹲下，亮出证件：“前天晚上，胜利街后巷，你抢了退休老工人的钱，打断他两根肋骨。昨天，纺织厂后门，你抢了女工的包，把人打晕。还要我念下去吗？”\n\n“我没有！抓错人了！”\n“到局里再说。”夹克男人一挥手，“带走。”\n\n一个老太太挤上前，指着他说：“就是他！那天抢我孙女的包，还把孩子推倒了！”\n“人面兽心！”群众怒斥道。\n\n年轻人不再挣扎，被反剪胳膊押向警车。公园恢复平静，下棋的继续下棋，打太极的继续打太极。"
STL_CPC_2_main_story.25.o: "法网恢恢。"
STL_CPC_2_main_story.26.t: "宽与严"
STL_CPC_2_main_story.26.d: "沈仲文把镇反总结翻来覆去，目光停在“未归案人员”一栏。马三刀。半年了，码头血案三条人命，此人像蒸发了一样。沈仲文恨得牙根发痒，这恨扎根在胃里，想起来就往上顶。\n\n办公室门推开，内勤小吴探进头。\n\n“沈主任，刚收到检举信，说在城西看见个像马三刀的人。”\n“核实了吗？”沈仲文立刻站起。\n“还没，同志们在查。”\n“要快。这次不能再让他跑了。”他语气很重，但没吼。\n\n小吴走后，他又翻到“改造积极分子”名单。陈顺发，这个名字让他眉头松开,他不由得想起昨天的事。\n\n昨天在菜市场，一个瘦高汉子挑着两筐菜，见了他，慌忙放下扁担，鞠了个躬。\n“沈同志，您买菜。”\n“是顺发啊。现在怎么样？”\n“好，好。在街道工厂当组长，上月评了先进。”陈顺发搓着手，笑得腼腆。\n“好。好好干，过去的事就过去了。”\n“是，是。多亏政府宽大，给我出路。”\n沈仲文点点头，递了根烟过去。陈顺发双手接过，别在耳后，又鞠一躬才走。\n\n沈仲文看着他的背影，心里舒服。马三刀让他夜不能寐，可陈顺发这样的人让他觉得温和不是纵容，是给人回头路。一个要追到天涯海角，一个要扶上正道。镇反不是杀得越多越好，是让有罪的服法，让能改的做人。\n\n他合上本子，点着烟，望向窗外。街道上，陈顺发正把菜分给孤寡老人。"
STL_CPC_2_main_story.26.o: "宽严相济，方得人心。"
STL_CPC_2_main_story.27.t: "力度"
STL_CPC_2_main_story.27.d: "沈仲文把两份卷宗并排摊在桌上，手指在“已处决”和“待执行”之间来回。\n\n何守谦，赵铁头。两个名字，两种滋味。\n\n内勤小吴敲门进来，递上报告。\n\n“沈主任，何守谦家属又来了，跪在接待室不肯走，说当年案子证据不足，是屈打成招。”\n沈仲文手一抖，烟灰落在卷宗上。\n“当年……上面催得急，限期破案。何守谦这个人，我审过。他最后画了押，可我觉得他眼神不对。后来查实，那把刀不是他的。但人已经没了。”他声音低下去，“我欠他一条命。”\n“那这报告……”\n“收下吧，转给政法委，如实写。冤了就是冤了，总得给个说法。”\n\n小吴正要走，沈仲文叫住他：“赵铁头呢？最后怎么说？”\n“审了三轮，证据确凿。这家伙死不悔改，昨天宣判时还笑，说‘杀了我一个，还有后来人’。”\n沈仲文冷笑一声，把烟按灭在缸里。\n“这种人，活着就是祸害。三条人命，抢劫军属，还扬言要杀光我们这些干部。他要是肯低头，我倒敬他是条汉子。可他在法庭上往女法官脸上啐口水。”\n\n他站起来，走到窗前，背对着小吴。\n“何守谦的案子，我们要查清楚，该平反就平反，该赔就赔。可赵铁头这种，有一个抓一个，有一个毙一个。力度加大了，但不能只加在老实人身上。”\n\n他转身，目光突然凌厉。\n“明天把赵铁头的材料再核实一遍，行刑前让他签字。这回，不许有任何纰漏。”\n“是。”小吴退了出去。\n\n沈仲文重新坐下，目光落在何守谦的照片上，良久，低声说了一句：“对不住了。”"
STL_CPC_2_main_story.27.o: "力度要有，但不能只有力度。"
STL_CPC_2_main_story.28.t: "鸣金收兵"
STL_CPC_2_main_story.28.d: "王二虎蹲在拘留室墙角，心里七上八下。他偷了厂里两捆铜线，被保卫科当场按住。这要搁半年前，少说判三年。他听人说过，镇反那阵，有人偷个井盖都被拉到广场上批斗。现在他进来三天，没人提审，也没人打骂。\n\n同号子的老李凑过来：“你犯的啥事？”\n“拿了两捆铜线。”\n“那你走运。听说了吗？上礼拜开始，小偷小摸都改行政拘留了，关几天就放。隔壁号那个偷自行车的，才拘七天。”\n“真的？我还当要判刑。”\n“运动过去了。你没看大街上，巡逻的都少了。鸣金收兵了。”\n\n王二虎心里松了松，可还是不信。这时铁门开了，民警在门口喊：“王二虎，出来。”\n他赶紧站起来，腿有点软。民警带他到办公室，推过一张纸：“签字吧。行政拘留十五天，罚款五十。出去以后老实点。”\n\n他接过笔，手抖着签了名。\n\n“知道错了吗？”\n“知道了，知道了。”\n“以后别干了。”\n\n他点头如捣蒜。办完手续，民警让他回号子。他躺回床上，突然笑了一下。才十五天，罚五十，这算什么？他原本以为至少三年起步。看来是真的过去了。\n\n老李又凑过来：“怎么判？”\n“行政拘留十五天，罚五十。”\n“恭喜啊，出去还能赶上过年。”\n\n王二虎嘿嘿一笑，心里盘算着出去后去哪儿找活干。窗外天黑下来，他第一次觉得拘留所也没那么难熬。"
STL_CPC_2_main_story.28.o: "风头过去了。"
STL_CPC_2_main_story.29.t: "一片长宁"
STL_CPC_2_main_story.29.d: "“主席，报告放在这里了。”\n\n“好，我一会儿就看。”\n\n邓小平放下手中关于党务方面的报告后，他拿起中央书记处刚刚送来的已经审查好的国务院的报告。忽略掉赞美之词和一些书面性语言后，他一个字一个字地看着数据。\n\n“解放初期统计匪患事件一万多起，今年统计只有34起。解放初期东部地区大量土地的拥有者只有十位数，今年已经取消统计占有大量土地的个人。东部地区在战争中铁路损毁达到七成，公路损毁达六成，今年已经全部修复；解放前东部土路占到全部道路的八成，今年下降三成，县级地区均有公路连接。伪政府时期的各项工业标准全部取缔，西部地区和东部地区的产品在各自的市场的占比均不低于20%……”\n\n邓小平难得笑着摘下了眼镜，闭上眼缓缓躺在床上，寂静的菊香书屋让他的思绪逐渐放缓。闭上眼睛，眼前的一名老汉正开着一辆四驱车，跑在宽广干净的黑色大道上。他的背后，是穿着干净衣服的妻子和拿着大学文凭的儿子，一家三口在北京旅游。四驱车装着后备箱，里面放着国产的柴米油盐、铁锅、铁勺等一系列生活必需品。一家人整整齐齐，消失在车流当中。\n\n眨眼间，一个年轻人正在操作一台小型的机器。他只是盯着发光的屏幕，手指略微动动，就说出了面前老者的名字，不知老人说了些什么，年轻人只是动动手指，一张凭据就从机器中生了出来，体感上不超过一分钟，老人就笑着收好凭据离开了。\n\n眨眼间，眼前是白色的屋顶。"
STL_CPC_2_main_story.29.o: "一切都好"
