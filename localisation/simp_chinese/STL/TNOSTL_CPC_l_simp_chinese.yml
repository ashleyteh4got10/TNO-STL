 PRR_Grigory_Isayev: "格里戈里·伊萨耶夫"
 POLITICS_PRR_GRIGORY_ISAYEV_DESC: "直到俄罗斯统一之前，格里戈里·伊萨耶夫只不过是名普通的技术员兼工程师罢了。直到他认识了同厂的石油工程师阿列克谢·拉兹拉斯基——阿列克谢·拉兹拉斯基，熟读马克思主义经典，同时对中国正在进行的共产主义运动很有兴趣。\n\n在找到共同语言后，两个人马上开始大量印刷宣传册并分发给他们的同事，笼络了不少人，自称“工人中心”，发表了《第二个共产党宣言》，并在马斯列尼科夫工厂成功地发动了一次罢工，成功为俄罗斯工人运动出了一份力，在俄罗斯无产阶级面前，他的地位逐渐升高。\n他本以为，以他与追随他的俄罗斯工人阶级的力量无法在短时间内夺取革命的胜利。不久以后的中俄战争以中国胜利而告终后，中国决定在俄罗斯中西伯利亚、远东地区设立临时政府。这时，他积极带动全俄工人掀起了“工人中心”运动，而伊萨耶夫和拉兹拉斯基也逐步被俄罗斯人所熟知。\n\n最终，在重组的苏维埃部长会议上，他成功被选举为部长会议主席，拉兹拉斯基则被选举为部长会议第一副主席。两个人明白，在被俄罗斯前政府践踏过的土地上，只有坚持以工农为中心、以人民群众为中心，社会主义社会才能被真正的建立起来，人民民主才能被正确的实施起来。"
 CPC_Deng_Xiaoping: "邓小平"
 Deng_Xiaoping_DESC: "党外无党，帝王思想；党内无派，千奇百怪。\n\n作为毛泽东挽救大跃进严重后果的重要助手，邓小平有很强的决断力，也能做事，立下了汗马功劳。除此之外，他还是最早一批党员，是周恩来留法时的同学，也是毛泽东最大的山头支持者。他在毛主席第三次反围剿下台后，因立场挺毛，被打为一派，是有名的“毛派四巨头”之一。这是他一生最大的政治资本，也是在他提出“不管黑猫白猫，捉住老鼠就是好猫”的异端思想后，仍被视为毛派重要组成部分之一的原因。即使有人将邓小平的派系单分为“书记派”，党内也多将其视为毛派的一个异端分支。到目前为止，他自己本人也是以“毛派”自居——至少表面是这样。虽身为共产主义者，他却不怎么关心自己的经济主张——用他的“黑猫白猫”理论来讲，能使社会主义国家持续发展的经济体制就可以为社会主义国家所用。有相当多的人对他的路线走向颇有微词，面对党内同志的质疑乃至毛主席的处分，邓小平仍坚定的回应：“我只是在用资本的手段实现共产主义理想，进而发展生产力。生产力发展好了，社会主义才能站得住。”身为一个能屈能伸的老政治家，邓小平有着非凡的耐性。他并非总是坚持己见，而是在党内风云变幻时刻，能在合适时机让步。用他自己的话来说，“忍耐，就是要想得开，挺得住。”\n\n如今他依然被视为一个合格的革命者，但对于这个曾用鲜血和牺牲筑成的党和国家未来何去何从，邓小平心中未必有准确的答案。在接过毛泽东手中的《明史》后，他所能做的，只有在稳定毛泽东的基本方向的同时一点点改变航向，只有“摸着石头过河”。至于这条河最终将会通向何方？恐怕只有天知道了。"
 CPC_Zhang_Chunqiao: "张春桥"
 Zhang_Chunqiao_DESC: "对于张春桥而言，革命的本质并非单纯的政权更迭，而是一场必须保持绝对纯洁的思想重塑。\n\n当同志们在前线与日寇浴血拼杀，或在国统区与敌对势力艰难周旋时，张春桥始终坚守在书桌前，用笔杆子丈量着马克思列宁主义的深邃。他没有赫赫战功，也不曾像务实派那样在复杂的经济泥潭中摸爬滚打，但他以极度严密的逻辑和不妥协的阶级分析，构筑了党内不可撼动的思想堡垒。作为党内无可争议的首席理论家，他深得毛泽东的信赖与赏识。在那些风雨如晦的岁月里，面对统一战线中不可避免的妥协与让步，正是张春桥的一篇篇理论文章，时刻敲打着同志们的神经，提醒着全党绝不能在民族救亡的浪潮中迷失了无产阶级的本色。\n\n领袖毛泽东的逝世，曾让这支在苦难中跋涉的队伍面临迷失方向与分裂的危机。为了维系党内各派系的微妙平衡，国防阵线主席的重担被交托给了德高望重的朱德。这位戎马一生的老总早已不再过问具体的政治运作，他的上台仅仅是作为一个团结的象征——因为各派别都对他抱有好感。在朱德那宽厚而沉默的庇护下，同志们暂时放下了路线分歧，将全部精力投入到对日寇的最后一击。而在这段漫长的过渡期中，张春桥始终冷眼审视着党内思潮的暗流涌动，默默在理论的高地上积蓄力量，誓要捍卫领袖留下的红色遗产。\n\n时光荏苒，胜利的曙光终于穿透了历史的阴霾。随着日伪与日寇被彻底驱逐，神州大地再次重归一统。然而，胜利的喜悦还未散去，现实的重担便接踵而至。朽木之年的朱德安然隐退，将国家主席的重任历史性地交接到了张春桥的手中。当这位不苟言笑的理论家真正站在权力之巅，俯瞰着这片满目疮痍却又百废待兴的辽阔土地时，他面临着前所未有的考验。\n\n建设一个新世界，远比在纸上批判一个旧世界要艰难得多。面对党内那些主张用温和手段、甚至借鉴资本主义方式来恢复国家元气的呼声，张春桥心中那根紧绷的阶级之弦从未有过片刻放松。在他看来，如果在国家重建的过程中向资产阶级法权妥协，那无数先烈的鲜血便失去了意义。他坚毅地握着时代的舵盘，试图用最纯粹的信念在这片废墟上建立起一个没有杂质的新秩序。然而，严苛的理论能否抚平连年战火留下的创伤？这艘刚刚驶出历史三峡的巨轮，又能否在他的指引下经受住现实风浪的洗礼？一切都还隐藏在未知的迷雾之中。"

 CPC_postwar.1.t: "春岚"
 CPC_postwar.1.d: "朱德的辞职信被送到邓小平案头时已是傍晚。他正埋首于一份西北工业区的年度报告，秘书敲门而入，将那份人大筹备组转来的信函轻轻搁置在文件堆侧。\n\n邓小平放下手中的钢笔，拾起信函。信封已拆，显然是经过了必要的流程流转。他展开信纸，读了一遍，沉默片刻，又读了一遍。随后，他将信纸平整地压在玻璃板下，淡淡道：“老总还是老总。”\n\n朱德的决意在他预料之中。东亚大革命的烽火熄灭后，老总便多次流露过让贤之意，只是彼时百废待兴，时局不允许这一象征退场。如今全国底定，人大启幕，那种战时体制向和平建设过渡的呼声已然高涨。朱德选择在这一刻急流勇退，实则给这位老革命家的一生，画上了一个体面而厚重的句号。\n\n然而，信纸之外，是呼之欲出的权力真空。这个空档，谁来填？\n\n自九大以来，政坛关于权力交接的暗流已涌动多时。毛泽东晚年精力渐乏之时，张春桥为首的“毛派”与邓小平坐镇的“书记派”，虽维持着面上的克制，实则早已暗中落子。周恩来、毛泽东、刘少奇相继离世，国家的最高权力架构长期处于过渡的震荡之中。朱德在世，凭借那泰山北斗般的威望，强行支撑起了一种脆弱的平衡。如今老帅主动请辞，这层屏障也随之消弭。\n\n邓小平点燃一支香烟，身子深深陷进椅背。他在烟雾中审视自己的半生：1926年入党的资历，留法岁月的旧梦，以及那个挺毛时期被视为“毛派四巨头”之一的烙印。这些是政治资本，但他深知，真正支撑自己走到今天的，是他那双解决实际问题的“手”。大跃进时期的物资调配，全国解放后的经济恢复，桩桩件件，他以实绩证明了自己是一个能扛事、能办事的实干家。\n\n张春桥显然也在盘算着同样的账。\n\n邓小平对张春桥并不陌生。他深知此人言必称“纯洁性”，讲“对资产阶级全面专政”，讲“无产阶级的绝对领导”。这些话语无疑是正确的，但邓小平所忧虑的是，张春桥所说的“路线”其实是一种教条，是要将一切复杂治理问题化约为教条式的路线斗争。若由张春桥执掌中枢，那些真正能办事、懂业务的干部恐将陷入泥沼，而国家将陷入无休止的理论论战之中。\n\n香烟燃尽，邓小平将烟蒂按灭在缸底。他思路清明：朱德辞职已是既定事实，他所要做的，是确保这场权力更迭不至演变为一场意识形态的清洗。书记派必须在人大框架内争取足够的分量，必须确保政府核心部门的稳定与连续。\n\n他望向秘书，示意将门带严，声音沉稳而压抑：“将北京的几位主要同志找来。今晚开个小会，不要声张。”\n\n秘书请示是否需联络外地代表。邓小平摆了摆手："
 CPC_postwar.1.o: "“先不急，先把北京这边的口径统一了再说。”"
 CPC_postwar.2.t: "卫道者"
 CPC_postwar.2.d: "张春桥读到朱德辞职信抄件时已是下午四时。彼时，他正伏案审阅一份关于城市工人思想动态的调查报告。秘书将那纸薄薄的抄件轻轻置于案头，他放下钢笔，拉过那份文件，从头至尾读了两遍。整间办公室里没有一丝杂音，他放下文件，并未言语。\n\n窗外，北京三月的天空沉郁灰暗，笼罩在干涩的冷风中。他缓缓起身，走到窗前，背对办公桌伫立，凝视着远处灰蒙蒙的街道，两分钟内一言不发。\n\n这件事绝不能简单视为人事变动。朱总司令辞职，表面上是一位打了四十六年仗、年迈八十七岁的老人想要休息，但张春桥看得透彻：这封信一旦递进人大，便意味着那个维系着党内政治平衡的最后图腾即将倒下。毛泽东、刘少奇、周恩来等元老先后辞世，朱德是全党公认的定海神针，他的主动退场留下的只是一片等待填补的真空。\n\n张春桥转回身，重新在桌前坐定，再次拿起了那张抄件。这一次，他反复咀嚼着纸面背后的政治余波。\n\n书记派近期的动作，他尽收眼底。那些人把持着政府机构与经济命脉，队伍愈发庞大。朱德在世时，由于老帅的庇护，派系间尚能维持脆弱的和谐；如今老总亲自掀开了盖子，邓小平的那帮人会不会顺势而上？\n\n张春桥的答案是：一定会。邓小平是个务实的人，他不会放过这个机会。而“务实”二字，在张春桥看来，恰恰是书记派最危险的地方。他们不是不承认毛泽东，他们是把毛泽东的旗帜举得太高，却在底下做着相反的事情。他们把“实事求是”讲得震天响，无非是想把阶级斗争从日常工作中剥离出去，让革命在胜利之后悄然退场。他嘴上说“用资本的手段实现共产主义理想”，可张春桥知道，这种人一旦掌了权，下一步就是全面向资产阶级法权妥协。\n\n他唤来机要秘书：“秘书同志，请把这封信的抄件传阅至各中央委员手中。附上一句话：朱老总操劳一生，其个人意愿当予尊重，但在决定做出前，全党必须展开充分讨论。这是全党路线的抉择。”\n\n秘书领命欲走，又被他叫住：“还有一件事，请通知《红旗》编辑部，下一期重点讨论‘革命胜利后如何保持纯洁性’，一周内拿出初稿。你告诉他们——朱老总的辞职，是一个标志。这个标志告诉我们，权力的交接即是人事的变动，也是路线的确认。路线对了，谁来都一样。路线错了，谁来都不行。”\n\n秘书离去后，张春桥重新陷入了沉默。他从抽屉里取出一本笔记本，在空白页上落下笔尖。他开始构思一篇文章，关于如何防止革命在胜利中消融，关于经济建设如何与阶级立场划清界限。这篇文章无需立即发表，但必须在人大预备会议前，在关键的范围内沉重地敲击着党内每一位同志的神经。\n\n笔尖在纸上划过，留下了第一行字：\n\n“革命是一场持续的思想重塑。”\n\n他沉吟片刻，笔触又在下方补上了一句掷地有声的誓词：\n\n“要坚持马克思列宁主义、毛泽东思想，坚持无产阶级专政一万年不动摇。”"
 CPC_postwar.2.o: "捍卫者的孤影。"
 CPC_postwar.3.t: "尖峰时刻 (1)"
 CPC_postwar.3.d: "预备会议定在三月下旬。地点是北京城西的一座会议厅，前清时期是亲王府的花厅，民国时做过参议院的会场，如今墙上挂着马克思、恩格斯、列宁、毛泽东的画像。长条桌摆成马蹄形，铺着深绿色的绒布，茶杯整齐地排列着，热水瓶立在角落。\n与会者四十余人。中共中央委员、人大筹备组成员、各派系代表。张春桥坐在长桌靠前的位置，面前放着一摞文件，左手边是一杯没动过的茶。邓小平坐在他对面偏右的位置，正在跟旁边的代表低声说什么，脸上的表情松弛，看不出什么异样。会议的第一个议题是“人大议程安排”，但所有人都知道，真正的问题只有一个人：谁来当家。\n\n张春桥先开口。他谈到朱德同志的辞职，言辞客气，说“朱老总功勋卓著，他的退隐是全党全军全国人民的损失”。然后，他话锋一转，“但是，”张春桥说，“朱老总的辞职，也给我们提出了一个尖锐的问题。革命胜利之后，如何保持革命本色？如何防止官僚主义侵蚀党的肌体？如何确保我们的政权始终是工人阶级和贫下中农的政权，而不是蜕变为某些既得利益者的工具？”他环顾四周，目光平稳而冷静。\n“同志们，我们不能因为有了一点建设成绩，就忘记了我们是从哪里来的。我们不能因为坐进了北京的大楼，就忘记了延安的窑洞。我们不能因为吃上了白面馒头，就忘记了啃黑豆面窝窝头的日子。”他停顿了一下，喝了一口茶，继续说：“毛泽东同志晚年多次告诫全党：敌人不在战壕里，在机关里。这话是什么意思？意思是，当我们能够用文件代替枪杆子的时候，真正的威胁就出现了。不是外部的枪炮，是内部的变质。如果我们今天不认真对待这个问题，明天我们就会站在自己过去所反对的那一边。”他再次停顿，目光扫过在座的每一个人。“所以，我建议在这次人大的人事安排上，必须把‘革命纯洁性’作为首要标准。不能只看一个人会不会做经济工作、懂不懂技术管理，更要看他是不是始终站在无产阶级立场上。路线对了，人就用对了。路线错了，能力越强，危害越大。”\n\n会场里安静了几秒。有人低头看文件，有人端着茶杯不喝。邓小平坐在对面，脸上仍然带着那种平静的表情，手指在桌面上轻轻叩了两下。"
 CPC_postwar.3.o: "（下一页）"
 CPC_postwar.4.t: "尖峰时刻 (2)"
 CPC_postwar.4.d: "打破这种沉默的人是邓小平。“春桥同志讲得很好，革命本色不能丢。”邓小平的声音不高，但很清晰，“我想补充一点。革命本色是什么？革命本色就是解决实际问题。”\n\n他微微前倾，双手交叉搁在桌上。“我们当初打游击的时候，解决的是吃饭问题。搞根据地的时候，解决的是生存问题。建工业区的时候，解决的是发展问题。现在全国解放了，问题更多了，也更复杂了。几亿人的吃饭、穿衣、上学、看病、就业，这些事不解决，你讲一百年‘革命纯洁性’，老百姓也听不进去。”张春桥接过话：“小平同志，你不要偷换概念。解决实际问题，不代表放弃路线。”邓小平抬起头：“我没说放弃路线。我是说，路线不能当饭吃。春桥同志，你在理论上有研究，这很好。但你也要看到，现在我们面对的是实际问题：去年华北的粮食产量不足，城市里待业青年有几百万，工业生产的煤和电还供不上。如果我们坐在这里，只讨论‘谁更纯洁’，却拿不出解决这些问题的办法，那么下一次老百姓就不会问我们‘路线对不对’，他们会问：‘你们到底是来干什么的？’”\n\n张春桥沉默了片刻。\n\n“小平同志，我不同意你的说法。路线和实际从来就不是对立的。毛泽东同志说过，政治是统帅，是灵魂。我们先把路线搞对了，实际问题自然会找到解决的途径。如果路线搞错了，越忙越乱，越干越错。”他顿了顿，又说：“再说‘纯洁’这个词，你把它当作一种讽刺，但在我看来，纯洁性正是我们区别于旧政权的根本所在。如果我们的政权和国民党没有什么本质区别，那当年那些牺牲的人，又是为了什么？”\n\n会议室里的气压明显低了下去。有人轻轻咳嗽了一声，没人接话。\n\n邓小平没有立刻回应。他端起杯子喝了一口水，放下，然后慢慢地说：“春桥同志，我问你一个问题。”“你说。”“当年在陕甘宁边区最困难的时候，毛主席提出‘自己动手，丰衣足食’。那几年我们搞大生产，办工厂，发展经济，用的方法可不是书上的教条，而是因地制宜、实事求是。如果那时候我们也先搞‘纯洁性’讨论，再考虑种地开荒，那边区的人早就饿死了。”张春桥的眉头微微动了一下。邓小平继续说：“我当然知道，在理论层面，我们和旧政权有本质区别。但区别不是口号喊出来的，是一件事一件事做出来的。我们要让老百姓看到——共产党和国民党不一样，是因为共产党能让他们吃饱饭、有工做、能过上人的日子。如果他们看到的只是一个只会发文件、开会的政府，那和国民党有什么区别？”"
 CPC_postwar.4.o: "会场安静了很久。"
