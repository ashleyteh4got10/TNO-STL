CPC_postwar.7.t: "选举"
CPC_postwar.7.desc: "正式选举日定在预备会议结束后的第五天。当天上午，会堂里坐满了代表，正前方是投票箱，两侧站着监票人。会场的空气有些闷，尽管窗户开了一条缝，春寒还是渗不进来，只有沉默和纸张翻动的声音。\n\n张春桥坐在主席台上，前排左侧，黑色中山装，领口扣得很紧，表情平静，既不紧张也不松懈。他面前放着一本《毛主席语录》，封皮磨出了白边，但始终没有翻开。\n\n邓小平坐在右侧，相距约五六米。他微微低着头，似乎在看着桌面上什么文件，但眼角的余光偶尔扫过会场。他的姿势比张春桥松弛一些，右手轻轻搭在桌沿上，指节偶尔动一下。\n\n唱票持续了一个多小时。\n\n当最终数字被宣读出来时，柯庆施的名字上方的计数明显高于其他提名者。\n\n柯庆施站起来，向会场点头致意。掌声开始响起，但不算热烈，更像是礼貌性的回应。他在台上站了大约十秒钟，重新坐下。\n\n张春桥微微倾身向前，但既没有明显的笑意，也没有起身举动。整个过程中，他的嘴角几乎没有变化，像是已经预料到这个结果。在场的一些人注意到，他没有看向邓小平的方向。全程没有。\n\n邓小平在结果宣布后没有表现出太多情绪，他合上了面前的文件，双手放在桌上，坐姿未变。有人看见他向旁边的工作人员低声说了几句什么，内容无人知晓。他的表情依然保持着一种务实的中性——谈不上高兴，也谈不上不快。\n\n在柯庆施胜选后，会场发出热烈的掌声和呼喊："
CPC_postwar.7.o: "“战无不胜的毛泽东思想万岁！”"
CPC_postwar.8.t: "选举"
CPC_postwar.8.desc: "投票结果揭晓之际，邓小平正伫立于会场侧廊的阴影中，指间燃着一支烟。他并未留在主席台等待最终裁决，唱票过半时，他便以“透气”为由先行离场。跟随他多年的秘书深知其性：越是决定乾坤的时刻，他越不愿身陷那压抑的旋涡中心，宁愿在局外静候审判。\n\n烟燃至半，秘书步履匆忙地从会场侧门趋近，压低嗓音道：“小平同志，结果出来了。您当选为了主席。”\n\n邓小平神色未动，将那支烟缓缓抽尽，随手在墙角水泥柱上摁灭，才平静地问道：“张春桥那边，怎么说？”\n\n“他表示完全尊重选举结果。”\n\n邓小平微微颔首，整理了一番上衣，转身迈入会场。随着他推门而入，会场内出现了约两秒钟的沉寂，紧接着，掌声如潮水般涌动。经济系统、政府管理部门及各大地方行政干部的代表们率先起立鼓掌，那些此前处于观望状态的代表们也纷纷加入。他目不斜视，径直走向台前，余光里，张春桥依旧端坐于主席台中央，面色如铁，古井无波。\n\n他并未发表任何慷慨激昂的就职演说，只是短促地对着麦克风道：“感谢同志们的信任。国家统一不易，老百姓等了太久，我们不能再让他们等下去。接下来的路怎么走，不听空谈，看实际效果。”\n\n散会后，走廊内围满了祝贺的老部下，他却只是摆摆手，声音疲惫而果决：“都回去干活吧。”言罢，他披上外套，缓步走出北京饭店。夜幕下的西安大街华灯初上，他站在门前候车，点燃一支烟，仅吸了两口便匆匆掐灭。\n\n他心知肚明，这张选票并非终局，而是一次脆弱的休战。张春桥的余威犹在，那套根深蒂固的意识形态根基并未崩塌，党内的裂痕甚至会因这场选举而变得更加触目惊心。后面的仗，只会比战火年代更长、更难打。\n\n此时，黑色轿车滑入路缘，稳稳停在身前。他拉开车门，在坐进车厢的瞬间，对司机沉声道："
CPC_postwar.8.o: "“回家。”"
CPC_postwar.9.d: "张春桥显然也在盘算着同样的账。\n\n邓小平对张春桥并不陌生。他深知此人言必称“纯洁性”，讲“对资产阶级全面专政”，讲“无产阶级的绝对领导”。这些话语无疑是正确的，但邓小平所忧虑的是，张春桥所说的“路线”其实是一种教条，是要将一切复杂治理问题化约为教条式的路线斗争。若由张春桥执掌中枢，那些真正能办事、懂业务的干部恐将陷入泥沼，而国家将陷入无休止的理论论战之中。\n\n"
CPC_postwar.10.d: ""


