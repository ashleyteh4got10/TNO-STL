#战后事件链
STL_CPC_2_main_story.1.t: "于河湾歇息的泥菩萨"
STL_CPC_2_main_story.1.d: "朱德拄着拐杖，在他人的搀扶下在公园漫步。已经走过八十六个春夏秋冬的老人，本应颐养天年，却顶着一个虚衔苟延残喘。或许是担忧后继无人，或许是担忧自己突然撒手人寰，这个老人一直倔强地向前行进。\n\n在一处池塘，这位老人终于得以休息。他坐在池塘旁的长椅上，望向波光粼粼的池塘，只是这水塘只是一潭死水，混浊而无鱼，即便想在水中看到些什么，也只能找到自己的倒影。池塘周围长着两棵树，一棵黑皮油松，一棵樟子松。朱德望向樟子松，枝繁叶茂而挺拔，即便在冬天也绿意盎然；他又看向油松，树干黝黑如夜，但还没有樟子松高。\n\n朱德只是默默地看着这两棵松树，不禁回想起这两棵树的来历。当年，不少来自东北的人入住西安，其中两户人家成为了邻居，可是这两家本来就是本家与分家的关系，却因为种种原因一直关系不好。随着时间的流逝，两户人家在干部的帮助下冰释前嫌，为了彰显两户人家的和睦，便在这池塘种下了从东北带来的树苗。一转眼便已过去二十多年，昔日矮小的树苗早已长成，虽然那两户人家已经回家，但他们的情谊却仍然存在于此。\n\n朱德颤巍巍地从怀里掏出一张纸，戴着老花镜的他尽可能地快速扫视一遍。内容上没有问题，格式也是对的，就差最后一步了。朱德叠好纸张，放进准备好的信封里。他缓缓站起身，在警卫员的搀扶下继续向远处走去。当他的影子于栈道上消失的时候，只剩下他的自语回荡在这空无一人的公园之中。"
STL_CPC_2_main_story.1.o: "“如果他们也像这两棵树就好了。”"
STL_CPC_2_main_story.2.t: "东风荡"
STL_CPC_2_main_story.2.d: "邓小平站在西安的城墙上，背着手望向万家灯火。平常周围云雾缭绕的他，此刻却只有一根细线在空中飘摇。一旁的警卫员一边看着脚边的文件堆，一边看着赏风景的首长，一边揉一揉早已酸了的手臂。\n\n“回去吧。”\n\n邓小平走下城楼，大红的“庆祝全国人民的解放”便映入眼帘。在那边，安塞腰鼓演出正到高潮，戴着绿色军帽的男子正与娇羞的女子吃着蒙古的奶糖；说书人那精湛的口技，惹得一阵欢呼；舞台上，穿着八路军服的男子与穿着日军服装的男子拿着同一类型的枪，双方的斗法激起一阵阵掌声。\n\n不知何时，中央人民政务委员会的牌子进入邓小平的眼中，已经改称国务院的他们还没有摘掉这个牌子。邓小平凝望了一阵后，摇着头继续向前。\n\n“什么时候开十大？”\n“不知道，但肯定不久了。我听邓书记的司机说，邓书记已经做好这方面的工作了。”\n\n“哎哟，可算是有好消息了。那谁会当主席呢？”\n“你是说党的还是国家的？”\n“都有。”\n“这就不知道了。不过，要么是邓书记，要么是……”\n“他？可是他的年龄……”\n“他的年龄怎么了？”\n“可是这不是……哦，我知道了。”\n\n在穿过充满着各种各样的声音的巷子后，邓小平揉了揉太阳穴。这时，抱着文件的警卫员提醒：“首长，这些文件，今天真的不能再拖了。”"
STL_CPC_2_main_story.2.o: "“我知道，我知道。那就回去吧。”"
STL_CPC_2_main_story.3.t: "转折"
STL_CPC_2_main_story.3.d: "“这是中国共产党最后一次在西安开全国代表大会，为了召开大会，党中央成了最后一批还在西安的中央机构。\n\n大会最后一天，全球各地的报社记者已经堵在十大会场的门口。当邓小平领着一众领导走出大门时，举着长枪短炮的记者们差点冲散领导与保镖们。“邓书记，请您发表一下您当选国家主席候选人的看法！”“邓书记，请问中国共产党接下来的政策是什么？”“邓书记，贵党战后承诺将尽快召开全国人民代表大会，请问这个大会将在何时召开？”一个又一个问题差点让邓小平语无伦次，这让他真切地感受到，中国共产党已经不是一个区域性的政党，而是一个全国性的执政党。\n\n记者们的心中有无数的问题，但邓小平终究是一个人，难以招架的邓小平让记者们按顺序一个一个问。对于中国共产党在战后的全国政策，邓小平回答：“此次大会已经确定了战后三年的方针：‘两年重建，一年改造’。东部地区刚刚解放，人民生活困苦，反革命势力还十分猖獗，我们打算花两年时间去解决；如今社会主义改造在西部地区基本完成，我们希望在一年左右的时间完成全国性的社会主义改造。”对于全国人民代表大会的问题，邓小平回答：“经过此次大会的慎重讨论和研判，此前要求中央人民政务委员会改组的决定过于仓促，因此，此次大会重新确定了政务委员会的定位，暂停中央人民政务委员会的改组，已经改组的原封不动，中央人民政务委员会将承担中央人民政府与全国人民代表大会的职责。”\n\n不过，邓小平并没有发表对于自己当选国家主席候选人的看法，或许，这位古稀之年的老人，心中仍然有一丝倔强吧。"
STL_CPC_2_main_story.3.o: "新中国的征程，于此开始"
