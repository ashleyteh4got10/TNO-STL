 communist_northeast_thought_subtype_desc: "自一九三一年日军入侵东北后，中国共产党高举抗日旗帜，在这片广阔的黑土地上展开了艰苦卓绝的斗争。战士们以白雪为被，石洞为屋，树林为家，因草而食，在中共党委领导下，东北抗联涌现出一批批抗日英雄。但自从苏联解体、宁渝合流，东北抗联从一个绝境走向另一个绝境，时至今日，东北在日寇的铁蹄下已有三十年，家国不再，复兴无光，似乎长夜无尽。但好在那南方的潼关昭示了日本野心的破灭，火种仍在，希望仍存。"
