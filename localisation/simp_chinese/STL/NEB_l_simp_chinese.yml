 NEB_num_2: "二"
 NEB_main_story_events.19.t: "牵线搭桥"
 NEB_main_story_events.19.d: "周保中领着李兆麟和刘亚楼来到三十八军。纵队战士们正在学习全新的军事斗争技术，练习打枪、打炮，与一年前的东北抗联比起来，已经强大许多。\n\n三人来到会议室，解放军干部已经等了好久。周保中一一介绍，随后，三人落座。周保中主持会议：“同志们，此次会议是为了加强东北局的同志和解放军同志协调作战。我们请来了东北局第一书记李兆麟同志给我们做东北的介绍，大家欢迎。”在一片掌声后，李兆麟简要介绍东北局和东北的情况，并解答一些解放军同志提出的问题，例如地形问题和城市问题。\n\n散会后，周保中、李兆麟和刘亚楼来到食堂就餐。李兆麟打趣道：“老周啊，您瘦了啊，以前就有同志说你像法式面包，现在怎么更像了？”\n\n“别打趣我了，老李。一个军的军长不好当啊，若非中央实在是没人了，我还真当不上。不过，与之前带一个旅的事务不同，现在要协调一个军的行动，更加困难。”刘亚楼说：“老周，听说你们装备了新玩意儿，好像叫什么……飞机？”周保中大笑：“什么飞机啊，就是从东北运来的报废的教练机，根本飞不了。也就做做学习器材。”\n\n“不说这些了，老李，是不是要有大动作了？”周保中问。“差不多吧，不管有没有大动作，你们的配合是至关重要的。”李兆麟说。“所以我们来牵线搭桥了。”刘亚楼说。三人哈哈大笑。"
 NEB_main_story_events.19.o: "东北的解放，近在眼前。"
 NEB_main_story_events.20.t: "焕然一新"
 NEB_main_story_events.20.d: "在东北局工作的这段时间，周保中重新认识了东北局的总体情况。\n\n现在的东北局已经在东北开辟了广大的根据地，外东北的根据地也有所恢复。生产恢复，一片欣欣向荣；东北局还重建了情报网，东北有点风吹草动，第二天报告就会出现在东北局的办公桌上。\n\n回想起上次来到东北局的时候，他是来听关于海拉尔要塞的说明的。如今他已经不用再想办法攻克那座要塞了，大兴安岭东西两侧的联系已经被切断，并且破译了敌人的电报密码，只待一声令下，要塞将以起义的形式回到人民手中。周保中原来是东北局的第二副书记，但他的重心是军队建设，因此当了第二书记后，他要兼顾做政工工作了。\n\n第一书记李兆麟和第一副书记刘亚楼也给予了很多帮助，在一些解放军同志来到东北局工作的时候，他们提供了很多关于工作的介绍。\n\n周保中签署完今天的最后一个文件后回到宿舍，李兆麟已经等候多时了。\n“感觉怎么样？”\n“还行，虽然工作我还不太熟练，但同志们很友善，教了我很多。老李，你在东北干得还不错啊。”\n“别夸我了。还有很多事要干呢。倒是你，别累着自己了。别想糊弄我，你我共事多年，我还不了解你？”\n\n周保中不得不苦笑，因为李兆麟确实预判了自己，他无奈地说：“我知道，我知道，这你就放心吧！”"
 NEB_main_story_events.20.o: "“希望明天是个好天气。”"
 NEB_main_story_events.21.t: "一个好人"
 NEB_main_story_events.21.d: "得益于在东北抗联的那四十年，周保中不仅与朝鲜同志关系很好，与前苏联同志的关系也相当不错，而且，他还是解放军里少数几个精通俄语和朝鲜语的军官。这位于云南讲武堂毕业的高材生，他的经历也可谓是波澜壮阔。\n\n年轻的他有志报国，却被时局嘲笑。加入中国共产党后，周保中被调到东北，成为东北抗联的主要领导人；随着斗争愈发残酷，他担任的要职也越来越高。杨靖宇死后，抗联逐渐撤入苏联。周保中与李兆麟搭档，一同领导有中国人、苏联人和朝鲜人参与的东北抗联，组件教导旅，成立抗日联合政府。无论是在日军大举进攻海参崴时缜密计划，还是在伯力有序指挥苏联红军撤退，前半生的波澜壮阔，塑造了周保中胆大心细的行事作风，待人和善的友好态度。\n\n金日成和周保中的关系良好。在推荐第二书记人选时，金日成写道：“还在抗联的那段日子里，周军长不止一次和我说，当年针对朝鲜人的政策是有问题的，在新时期下，朝鲜人和中国人最好还是摒弃前嫌，共同抗日。在他的帮助下，我再一次和中国同志们建立了良好的关系，可以说，没有周军长，就没有我金日成的今天。”金日成还记得，在成立联合政府的时候，他被周保中推举为中苏朝联合指挥部的参谋。周保中推举他的理由很简单，在那个用人非常紧张的年代，金日成是少数几个朝鲜族里面较为年轻的高级军官。实际上周保中还推荐了其他几个朝鲜人，金日成只是其中之一罢了。但能让金日成这位年轻营长进入参谋行列，或许，周保中确实看到了金日成所具备的能力，但那究竟是什么能力，只有周保中自己知道了。\n\n谢廖沙是一名普通的苏联红军士兵，他与周保中的关系也相当不错。在推荐第二书记人选时，谢廖沙写道：“我与周军长是在伯力结识的。当时日本正在进攻伯力，我被分配给周军长指挥。当时伯力即将陷落，而我所在的联队屡战屡败，士气低下，而我尚不清楚周军长的能力，认为他很可怜，只是一个不得不接受责任的受害者。但是我错了，周军长到达阵地后，用着一口并不流利的俄语对我们说，这并不是失败，而是成功前必须经历的挫折，我们都是火种，他作为指挥，绝对不会抛弃我们。在他的指挥下，我们再也没有打过败仗，成功撤离了伯力。从那以后，我就非常敬佩周军长，向他请教了不少军事知识。”\n\n无论是中国人，还是苏联人，亦或是朝鲜人，他们对周保中的评价非常简单。"
 NEB_main_story_events.21.o: "一个好人"
 NEB_main_story_events.22.t: "天纵奇才"
 NEB_main_story_events.22.d: "在苏联留过学的刘亚楼毫无疑问是东北局里面少数的几个高级知识分子。在伏龙芝的学习生涯中，他艰难地克服了语言上的不通，完成学业。只不过，在完成学业的当年，他被突然调往远东。此后，刘亚楼再也没能和党中央恢复联系。虽然没能回到党中央继续抗日，但他来到了一个全新的前线——东北。本以为能在东北抗联见到杨靖宇、赵尚志这些让敌人闻风丧胆的同志，刘亚楼得到的却是这些人的死讯。偏偏好景不长，苏联轰然倒塌。初次见到李兆麟和周保中的刘亚楼，茫然地看着混乱的远东。东北抗联到底还能坚持多长时间？\n\n在危机时刻，刘亚楼意识到东北抗日将进入一个新阶段，而苏联解体导致远东管理混乱，与最高苏维埃断绝联系的当下，远东必须有一个主心骨，于是，他急忙与李兆麟商议，成立东北抗日联合政府。巧合的是，李兆麟也有此意。两人立刻联系各路军队，在海参崴成立东北抗日联合政府，统一管理远东事务。这个脆弱的政府鱼龙混杂，李兆麟和周保中难以协调，于是，管理人事的重任又落在刘亚楼的肩上。但刘亚楼立刻展现出了一名政工干部的才能，在短短一个月的时间里，他成功联系上远东的所有红军和基层政权，基本稳定了远东局势。\n\n就在东北抗联准备恢复元气，积极抗日的时候，又遭逢日本大举进攻，刘亚楼本打算积极联络最高苏维埃，却也因此不得不中止。准备不足的东北抗联和苏联红军遭遇了空前的大败，日本轻松占领远东的大部分地区。在撤退的过程中，部队建制打乱，联系断绝，刘亚楼用尽办法，收拢部队，派遣联络人员，这才挽回了部分损失。\n\n如今，成为东北局第二书记的刘亚楼，可以说是众望所归，在党中央的帮助下，东北抗联不仅成功恢复元气，还将成为解放东北的先锋。刘亚楼看着地图，他沿着中东铁路画出了两条攻势线，这是他酝酿已久的大迂回作战，毛主席的战略与他不谋而合。虽然已经有很长一段时间没有再继续指挥，但脑海里的战争艺术让他再次构筑出一个完美的作战计划。"
 NEB_main_story_events.22.o: "于危难之际奉命"
 NEB_main_story_events.23.t: "大难临头"
 NEB_main_story_events.23.d: "新京的大街小巷，报童们拿着手里的报纸，大声高喊着：“号外号外，中共不接受大日本帝国的和平谈判！号外号外，中共不接受大日本帝国的和平谈判！”老刘头捡起地上被撕碎的新发的报纸，他仔细地看了看大字标题：“中共拒绝大日本帝国和平谈判，赤匪已经向满洲国发起进攻。”\n\n老刘头冷笑了一下，他回想起自己的家里，被抓走去当慰安妇的妻子已经含恨而死，被强行征兵入伍的大儿子现在就在南方的前线，不得不送出的二儿子在进入大兴安岭后再无消息。如今的老刘头孑然一身，靠着近邻的帮助他才勉强坚持了下来。“报应，报应，报应啊！”老刘头激动不已，在闹市上大喊，“这就是你们的报应啊！”仰天长笑的他丝毫不理会把他按倒在地的日本宪兵，他当然也没法看到远处正在给警察扇嘴巴子的日本军官。他只觉得，天就要亮了，黑夜就要结束了，日出之地的妖魔鬼怪要被真正的太阳驱散了。\n\n这时，恍惚中的他似乎听到眼前戴着军帽的日本军官说了些什么鸟语，一旁的翻译说了几个字：“你……扰民……什么？”老刘头冷笑：“扰民，是啊，扰民，你们这群禽兽，来这里扰民干什么？”老刘头死死地盯着眼前的日本军官，一旁的翻译似乎又说了些什么，但不管他说了什么，这个日本军官突然从怀里掏出了一个黑洞，老刘头看着那黑色的洞，说：“来啊，我这把老骨头也没什么用了，来啊！”似乎更加气愤的日本军官还要干些什么，几名日本人突然又拦住了他。恍恍惚惚中，老刘头看到一个拿着武士刀的日本军官，又说了些什么，然后，老刘头就被日本宪兵按在地上。最后，一声枪响划破了天空。"
 NEB_main_story_events.23.o: "日本再次欠下一笔血债"
 NEB_main_story_events.24.t: "猛虎下山"
 NEB_main_story_events.24.d: "在海拉尔要塞里，几名日本军官无所事事地削铅笔。这几名日本军官早就被东北局策反，在得知南方的伪政府垮台的那一刻，他们立刻意识到，解放军的下一个进攻方向就是东北，而解放东北的开始，毫无疑问就是这座巨大的要塞。他们有着非常强烈的预感，联系很快就到。\n\n这时，一个传令兵来到军官们所在的办公室，说：“報告します、大佐、西から手紙が届きました。（报告大佐，西边来信了。）”大佐接过信后，高兴地拍了桌子，说：“王明貴支隊長が来るらしい、どうやら反乱を起こそうとしているようだ。（王明贵支队长要来了，看来是准备起义了。）”大佐冲出地堡，只见原东北抗日联军第三路军第三支队支队长、现海拉尔要塞支队长王明贵，已经站在河南台阵地上了。他的腰间别着中国人民解放军的制式手枪，在他的身后，都是手拿步枪，穿着绿色军装，戴着红色五角星帽的中国人民解放军士兵。\n\n“王队长，有劳了。”大佐摘下帽子，献上武士刀。\n王明贵接过武士刀，拿出一顶帽子，说：“走吧，跟我一起，拯救家园。”\n大佐戴上这顶带着红色五角星的绿色军帽，向王明贵敬礼，说：“王队长，海拉尔要塞于今日响应贵军号召，宣布起义，归还属于中国人民的神圣领土！”\n\n王明贵来到河南台阵地的电台前，向李兆麟和周保中报告要塞即将起义。李兆麟和周保中下达发送起义电报的命令，随着海拉尔要塞起义的电波传向广大的东北大地，中国人民解放军三十八军从扎兰屯出发，沿着铁路线翻越大兴安岭，向齐齐哈尔发起全面进攻；北面的外东北游击队也迅速响应，他们跨过宽广的黑龙江，踏向早已失去近四十年的故乡。东北人是有血性的，东北人也是善良的，东北人也是思念故乡的！今日，他们将为自己的祖国大地，带来解放！"
 NEB_main_story_events.24.o: "归乡之路，就在眼前"
 NEB_main_story_events.25.t: "开始与终结"
 NEB_main_story_events.25.d: "佐佐木瑟瑟发抖地躲在橱柜里，震天响的枪炮声远在天边，搜捕日本官僚的脚步声近在咫尺。佐佐木实在是不明白，明明天皇已经宣布战争完全结束了，为什么中国人还会打过来呢？而且，满洲国也不是中国的领土，为什么中国人要发动侵略呢？突然，橱柜被打开。几个拿着枪的女人一把把佐佐木摁倒在地，佐佐木慌乱地挣扎，可是无济于事。他用日语绝望地喊着：“放す！放す！（放开我，放开我！）”\n\n“睁开你的狗眼看好了，我是谁？”\n\n佐佐木虽然听不太懂中国话，但这句他勉强听懂了，他定睛一看，原来是一个中国女人；他又看了看周围，才发现原来不止她一个，还有一个看起来像俄罗斯人的女孩子和一个像是朝鲜人的少女在旁边。佐佐木慌忙下跪，连连磕头，说：“放过我，放过我吧！”但他的蹩脚汉语实在是不怎么样，实在是没法让人看出他是个放下了傲慢的禽兽。女人连连摇头，示意女孩子和少女，三人把佐佐木绑了起来，少女用蹩脚的日语说：“逃げるな。（别想逃。）”冷冰冰的语气吓得佐佐木几乎不敢呼吸，然后，中国女人带着两人离开了这里。\n\n绝望的佐佐木本以为会有人来救他，带他回到有葡萄酒的东京大别墅，只不过当他再次听到屋门打开的时候，满脸笑颜的他却没有看见握着武士刀的日本人。他不知道的是，在这里，绝对不会有日本人来救他。"
 NEB_main_story_events.25.o: "你们的罪孽，万死难恕。"
 NEB_main_story_events.26.t: "归来"
 NEB_main_story_events.26.d: "李兆麟、刘亚楼和周保中站在大顶子山的山顶，他们望向那座终于取回了失去四十年名字的城市。\n\n“终于，回来了。”李兆麟说。\n\n“是啊，回来了。”已经白发的周保中欣慰地说。\n\n“原来，东北是这个样子啊。”刘亚楼感慨。\n\n从西边的大兴安岭到东边的海参崴，从南边的山海关到北边的海兰泡，从白雪皑皑的山脉到针叶密布的森林，从深不见底到高耸入云，从一九三一年到一九七二年，东北反抗日本殖民统治的斗争持续了整整四十一年。四十一年，近乎半百的时间；四十一年，近乎一代人的时间；四十一年，近乎马拉松里程的数字。东北人终于走出漫漫长夜，东北人终于不再是亡国奴，东北人终于可以回家了！不过，并不只有东北人。朝鲜人正在为祖国的解放继续斗争，前苏联人等待着归家，台湾的收复尚不明朗。未来的工作还有许多，但请在今日，为东北的解放碰一杯！"
 NEB_main_story_events.26.o: "伟大的§x中华民族抗日战争§!，由§x东北§!开始，亦由§x东北§!终结"
 NEB_main_story_events.27.t: "回家"
 NEB_main_story_events.27.d: "中国共产党以雷霆万钧之势打垮了中华民国政府，随后，他们又对日本宣战，发动了第三次抗日战争。受此影响，海参崴的日本人乱作一团。德川也束手无策，他很想回东京躲避战乱，可是海参崴的港口早已停运。\n\n正当德川还在想办法的时候，自己的秘书找了上来，说还有一艘船可以回到日本，他问德川想不想回去。\n\n可是机会到眼前的时候，德川又犹豫了。因为回东京也只是躲避战乱而已，就算回东京，也很难说不会再卷入政治风暴中。日本的腐朽无能他早已看在眼里，当初不就是因为不想呆在东京那里才来的海参崴？现在回去说不定还会卷入不想卷入的事情里。反而看看现在的海参崴政府里的这群人，他们不仅把海参崴打理得井井有条，而且还给自己带来了一定的政绩。加入他们也是一个不错的选择。\n\n德川权衡再三，他说："
 NEB_main_story_events.27.o: "“你认不认识‘西西皮（CCP）’？”"
# 废案彩蛋，因为没有宋任穷的头像所以只能如此
 NEB_main_story_events.28.t: "东北局成立"
 NEB_main_story_events.28.d: "宋任穷第一次听说东北抗联，早已是二十多年前的事情了。自从苏联解体、宁渝合流，党中央与东北的联系几近断绝。本以为同志们早已牺牲，没想到他们竟然坚持了下来，这无疑是个好消息。\n\n主席台上的宋任穷看着台下的同志们，有的衣衫不整，有的整齐划一，这种区别也是这批人——东北原来的同志和西北支援的同志——的标志。\n\n“同志们，今天是个伟大的日子。我们将在这里开启东北抗日的全新起点！”在台上讲话的宋任穷咬字清晰，铿锵有力，坐在他右手边的李兆麟看着这个意气风发的第一书记，心中百感交集。他从未见过宋任穷，今天甚至可以说是他们第一次见面，但他相信党中央，相信党派来的是一个能力干将。这样想着的李兆麟，虽然还有疑虑，但放松了不少。\n\n“我是党中央派来的，东北的同志们都没见过我，心中肯定有所疑问，我向大家保证，我一定能把这个队伍带好，希望同志们多批评和指正！”宋任穷继续讲着豪言壮语，李兆麟身旁的周保中心事重重。他不明白为什么党中央不让李兆麟当第一书记，而是空降了一个对东北都不熟悉情况的人过来，他真的能带领东北的同志们吗？他真的知道东北的情况吗？疑虑重重让他对这个有野心的家伙不够信任。\n\n“同志们，党中央将东北视作我们未来的战略方向，是未来中国解放战争的重要组成部分。我们要紧密团结在党中央的领导下。”宋任穷的讲话已经接近尾声。坐在宋任穷左手边的刘亚楼一副心情很好。重新与党中央建立联系让他非常开心，在西安的那段时间，他十分清楚党中央对东北的重视，将其视作战略方向之一。因此，他早早就和宋任穷接触，虽然宋任穷对东北几乎毫无了解，但刘亚楼还是决定信任宋任穷。\n\n“东北的解放斗争是自抗战以来坚持时间最长、条件最艰难、发展最不易的，东北同志们吃了很多苦，但这些苦是值得的，今天我们聚在这里，是为了我们的父老乡亲，为了全东北摆脱日寇的殖民统治，为了全东北的解放。我们的任务，就是要解放东北，解放中国，解放全世界！”在一片掌声中，宋任穷慷慨激昂的讲话到此结束。虽然掌声齐鸣，但下面的人难掩疑虑。\n\n"
 NEB_main_story_events.28.o: "一切的工作，才刚刚开始。" 
 NEB_main_story_events.29.t: "无奈之举"
 NEB_main_story_events.29.d: "很坐在办公桌前的宋任穷在批阅完一份文件后，他摘掉老花镜，闭上眼睛，放松身体。一把年纪还要继续工作，身体实在是有些受不住。他暂时抛掉工作上的烦恼，放空思绪，回想起自己来到这里的原因……\n\n那是在一次平常的午后，宋任穷吃完饭回到办公室，却撞见邓小平坐在沙发上。宋任穷大吃一惊，他慌忙端起茶壶，准备给这位书记处总书记倒一杯茶。邓小平连连摆手，说：“不用了，今天我来找你，是有一件急事。”宋任穷了解这个具有钢铁般意志的人，书记处的事情本来就多，亲自来找这么一个只是在地方局工作的干部，这个事一定很大。于是他说：“好吧，那么是什么事？”邓小平语出惊人：“最近党中央准备支援东北建设，你要不要来？”宋任穷差点站不稳。不是因为宋任穷不想去支援东北，而是邓小平这么问他，那么支援东北的重担有很大概率会落到自己的肩上。东北抗联刚刚归建，物资匮乏，人员混乱，东北的条件比西南的条件差了许多，而且北方比南方要冷。\n\n这一看就是个麻烦差事，但是，事情总要有人去做，宋任穷做好了被任命前往东北的心理准备。不过，他还有个疑惑，为什么不从中央内部调任，而是选一个地方干部？宋任穷试探性地问了问邓小平，得到的答复让他一言难尽：“其实，主席有点走投无路了……”能让毛主席有点走投无路，说明情况比想象中还要糟糕。邓小平又透了点底：“你也知道，党中央从混乱中恢复的时间没有多长，一些思想上的遗毒还没有清理干净。我查过你的履历，在西南解放的时候，就是你负责管理战后的西南基层干部组织，同时还领导了成都和重庆的恢复工作；而且，你还是西南局推荐进入中央工作的候补干部。这说明你能力出众，而现在东北恰恰缺乏能力强的干部。而且，在哪里都是干革命，职位不分高低贵贱，多走走多看看，对自己也是有好处的。”\n\n宋任穷仔细想了想，邓小平的话确实有一番道理。不能困在西南这一亩三分地，要多走走，多看看，多历练历练；而且，自己现在虽然是候补，但如果在东北干得好，进入中央的概率也将更大。于是，宋任穷痛快地答应了下来，在之后成为支援东北的团队领导，接着成为了东北局的第一书记。"
 NEB_main_story_events.29.o: "不能辜负党中央的嘱托"