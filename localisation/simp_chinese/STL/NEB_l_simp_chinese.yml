 #故事
 NEB_main_story_events.1.t: "东北党委会请示电"
 NEB_main_story_events.1.d: "尊敬的党中央：\n\n西撤行动[NAJUA_situation]，我们根据党中央指示将总部迁移到乔巴山市，正在等待党中央的进一步指示。望盼告。\n\n东北党委会"
 NEB_main_story_events.1.o: "[?global.date.GetDateStringNoHourLong]"
 NEB_main_story_events.2.t: "中央急电"
 NEB_main_story_events.2.d: "电复刘并告东北党委会：\n\n经党中央研究讨论决定，为适应目前伟大解放斗争需要，应立即组建中共中央东北局，代表党中央统一领导东北工作，东北抗联应改编进入中国人民解放军序列。\n\n中国共产党中央委员会\n\n[?global.date.GetDateStringNoHour]"
 NEB_main_story_events.2.o: "东北解放的全新局面！"
 NEB_main_story_events.3.t: "东北局成立"
 NEB_main_story_events.3.d: "高岗第一次听说东北抗联，早已是二十多年前的事情了。自从苏联解体、宁渝合流，党中央与东北的联系几近断绝。本以为同志们早已牺牲，没想到他们竟然坚持了下来，这无疑是个好消息。\n\n主席台上的高岗看着台下的同志们，有的衣衫不整，有的整齐划一，这种区别也是这批人——东北原来的同志和西北支援的同志——的标志。\n\n“同志们，今天是个伟大的日子。我们将在这里开启东北抗日的全新起点！”在台上讲话的高岗咬字清晰，铿锵有力，坐在他右手边的李兆麟看着这个意气风发的第一书记，心中百感交集。他从未见过高岗，今天甚至可以说是他们第一次见面，但他相信党中央，相信党派来的是一个能力干将。这样想着的李兆麟，虽然还有疑虑，但放松了不少。\n\n“我是党中央派来的，东北的同志们都没见过我，心中肯定有所疑问，我向大家保证，我一定能把这个队伍带好，希望同志们多批评和指正！”高岗继续讲着豪言壮语，李兆麟身旁的周保中心事重重。他不明白为什么党中央不让李兆麟当第一书记，而是空降了一个对东北都不熟悉情况的人过来，他真的能带领东北的同志们吗？他真的知道东北的情况吗？疑虑重重让他对这个有野心的家伙不够信任。\n\n“同志们，党中央将东北视作我们未来的战略方向，是未来中国解放战争的重要组成部分。我们要紧密团结在党中央的领导下。”高岗的讲话已经接近尾声。坐在高岗左手边的刘亚楼一副心情很好。重新与党中央建立联系让他非常开心，在西安的那段时间，他十分清楚党中央对东北的重视，将其视作战略方向之一。因此，他早早就和高岗接触，虽然高岗的过去确实不太光彩，但刘亚楼还是决定信任高岗。\n\n“东北的解放斗争是自抗战以来坚持时间最长、条件最艰难、发展最不易的，东北同志们吃了很多苦，但这些苦是值得的，今天我们聚在这里，是为了我们的父老乡亲，为了全东北摆脱日寇的殖民统治，为了全东北的解放。我们的任务，就是要解放东北，解放中国，解放全世界！”在一片掌声中，高岗慷慨激昂的讲话到此结束。虽然掌声齐鸣，但下面的人难掩疑虑。\n\n"
 NEB_main_story_events.3.o: "一切的工作，才刚刚开始。"
 NEB_main_story_events.3.tt: "请查看£CPC_texticon §x东北局§!的GUI，开始东北解放的第一阶段任务。"
 NEB_main_story_events.4.t: "在乔巴山"
 NEB_main_story_events.4.d: "乔巴山市是一座只有三千人的小城镇。在距离这座城镇五百米的地方，有一片小小的院子。院子里板房林立，院子外杂草丛生，一座刚修好的坟冢坐落于此。\n\n居民们时常看见穿着绿色衣服、戴五角星帽子的外地人在这镇里穿梭，他们只知道这些人是解放军，可究竟在这里干什么，没人知道。而在那个院子里，时常会出现煤油灯亮了一夜的情况。\n\n居民们知道那个院子有人，但这还不是重点。重点是那座坟冢，在那冢里埋着上千条冤魂。不知什么时候，一场小小的传染病在村里开始流行，居民们发现是那腐烂的尸体导致的，于是他们把尸体重新掩埋，立了一座小小的墓碑，希望那里的人能安息。居民们诧异的是，竟有人敢在那坟冢旁住！\n\n居民们不知道的是，那个院子是东北局的总部，那个坟冢是过去的罪证。\n\n这片曾废弃的院子，七扭八歪的栅栏是蛀虫们的家园，诡异的房顶将一个四方的空间变成了三角。在那泥墙里，几根稻草耷拉着，宛如风蚀残年的残疾老人，还在倔强地活着。高岗和李兆麟带领东北局的同志们花了一个月把这片院子打扫干净，并且深入调查了那座坟冢。令人愕然的是，这间院子曾经是哈尔滨那边的一支日军部队设下的联络处，而坟冢下面则埋着日军集中屠杀的当地僧众和蒙古族的尸骨，以及细菌武器的实验品。至于那是什么样的实验，知道内幕的人都感到后背发凉。"
 NEB_main_story_events.4.o: "因为，那与人道无关。"
 NEB_main_story_events.5.t: "抗联新生"
 NEB_main_story_events.5.d: "“注意！第二排第四个，脚抬高点！”解放军军官的嗓门响彻云霄，“听口令，正步——走！”“一、二、三、四！”这里是距离乔巴山市不远的一处军营，周保中和曾克林正在视察训练。自从抗联回归党中央后，东北党委会改组成为东北局，而抗联的将士们则编入解放军序列，东北抗日联军教导旅已经成为了历史，他们新的番号，则是中国人民解放军第三十八军，下辖三个师，每个师一万二千人。抗联编入解放军后，中央军委立即下达了派遣解放军军官到抗联的决定，并对队伍进行了调整，周保中担任军司令，曾克林担任政治部主任。抗联的正规化训练由此开始。\n\n曾几何时，抗联在白山黑水间与侵略者作战，长期的封锁让士兵们很难吃饱饭，持续作战让将士们很难有时间休息，加剧了将士们的疲劳；再加上东北的气温又不是很高，很长时间都在零下，这导致很多将士冻伤冻死。而后，苏联的崩溃让抗联失去了最后的安全地，苏联人失去了他们的家园，也失去了他们的归属。苏联红军不愿跟随北方的法西斯，他们加入了抗联；然而，随后的几次大扫荡让抗联陷入绝境。自一九三一年的九一八事变以来，东北抗联在这片辽阔的土地上坚持了近四十年的斗争。\n\n今时不同往日，抗联已经从泥沼中爬出，他们已经回到了那面鲜艳的红旗下。这是他们新生的起点，亦是解放东北的全新起点。"
 NEB_main_story_events.5.o: "全新局面"
 NEB_main_story_events.6.t: "“钓鱼城”"
 NEB_main_story_events.6.d: "在解放军的指挥部里，当李兆麟把海拉尔要塞的地图摆在高岗眼前时，高岗倒吸了一口凉气，因为这种规模的要塞已经堪比西安那边修建的要塞。\n\n“在海拉尔周围的五处高地，均被日军修建了要塞，河南台、敖包山、松山、伊东台和东樱台。其中河南台阵地和敖包山阵地在大道两侧，河南台阵地与松山阵地在铁路线两侧，日军的物资补给基地修建在东面的伊东台阵地附近，东樱台阵地防守海拉尔市东南方向。山上有当年坑杀中国人的万人坑，五个阵地在地下用通道连接。”李兆麟解边解释边勾画。周保中一脸凝重，说：“这地方不好打，强攻的话伤亡一定很大。”刘亚楼也十分严肃地说：“这么完善的设施，最好还是完整地接收比较好。”高岗看着墙上的地图，说：“这地方，简直就是四川的钓鱼城在东北的翻版。唯一的不同，恐怕就是钓鱼城被用于保家卫国。”\n\n这座由人民的鲜血铸成的要塞，势必要回到人民的手中，接受人民的处置，而强迫中国人民建造这座要塞的罪人，必须接受人民的审判。\n\n高岗和李兆麟内心复杂无比。该如何让这座要塞回到人民手中？进攻这座要塞易守难攻，但这也是他们必须克服的困难。\n\n因为，得知了真相的人民，会毫不犹豫地向自己的部队下令去诛杀这群禽兽。"
 NEB_main_story_events.6.o: "人民的审判，必然到来"
 NEB_main_story_events.7.t: "关门打狗"
 NEB_main_story_events.7.d: "大兴安岭是东北平原西边的天然屏障，其高山之巍峨虽不及昆仑，但森林之繁茂可谓举世罕见。自一九〇〇年以来，沙俄在这里修建铁路，建造市镇，逢山开路，遇水架桥，终于彻底打通这岭上群山。\n\n打通的标志便是“兴安岭隧道”。这条全长3077.2米的隧道是东西大兴安岭的唯一通道，北满铁路的运输大动脉从中穿过。李兆麟对这个地方很熟悉，当年在这里打过游击，炸过火车，夺取物资，解放人民。这里是大兴安岭西边日军的唯一补给线，切断了这条隧道，那盘踞这里的日军就是瓮中之鳖。\n\n“叮铃铃——”\n\n李兆麟拿起话筒，附到耳边。话筒里传来了稚嫩且爽快的声音：“李书记，刚刚博克图那边来消息了，他们已经完成任务。”\n\n“好，告诉他们要再接再厉。”挂断电话后，李兆麟露出了欣慰的笑容，只要控制了博克图，那便是控制了这条隧道。想到这里，李兆麟拿出纸笔。他准备构思一个更庞大的计划——关门打狗。要让大兴安岭的日寇有来无回，一个都不能跑掉。"
 NEB_main_story_events.7.o: "这笔血债，该算一算了"
 NEB_main_story_events.8.t: "无奈之举"
 NEB_main_story_events.8.d: "很多人并不了解东北局的第一书记。这其实不是什么大事，因为东北的同志们并不知道那十几年发生了什么事。高岗来到东北局本身就是一个妥协的结果。\n\n当党中央在讨论派遣支援东北的团队的时候，由毛泽东主持召开的会议一开始很成功，支援东北的团队成员很快就确定了下来，但在“该任命什么人当团长”这个问题上，毛泽东和刘少奇有不同的想法。于是双方展开了更加深入的讨论，只不过，或许是因为双方以为这只是个人选问题，又或许是宗派主义的死灰复燃。总之，在一次讨论大会上，与会人员爆发了激烈的争吵。虽然毛泽东和刘少奇无意导致这种情况，但它还是发生了，并且愈演愈烈。到最后，若非周恩来和朱德出面，恐怕争吵会愈演愈烈。毛泽东对很多人“安插亲信”的认知嗤之以鼻，可他又不得不承认，对于他和刘少奇来说，无论选谁去当这个领队，都会被一些人认为这是一个派系对东北的伸手。\n\n就在毛泽东束手无策的时候，刘少奇无意的一句话点醒了他：“如果选个无人在意的落魄者就好办了。”于是，当高岗的名字出现在讨论会上时，所有人都沉默了。因为这个理由实在是过于充分，无懈可击。首先，高岗长期驻扎蒙古，虽然并不特别熟悉东北的情况，但他一直在最靠近东北的地方工作；其次，高岗曾是党中央内部极具影响力的人物，虽然他离开了，但好歹有这个背景；最后，他是一个“有污点”的人，无论是谁，都不会认为所谓的“毛派”会扩大在东北的影响力。\n\n于是，支援东北团队的领队就这么定下来了，而这个领队，是毫无疑问的东北局第一书记。失意的高岗已经不在意还能不能东山再起，但这个机会他是要一定把握住的。"
 NEB_main_story_events.8.o: "能多争回一些面子是一些。"
 NEB_main_story_events.9.t: "重新规划"
 NEB_main_story_events.9.d: "在巩固好根据地后，从满洲里到扎兰屯都建立了东北局的支部。借由海拉尔支部在要塞里取得的情报，东北局不仅成功获得要塞全部信息，还在呼伦贝尔各处建立了根据地。只待党一声令下，呼伦贝尔便将倒戈起义，回到人民的队伍中来。在这样的形势下，东北局召开多次会议研究接下来的作战方略。最终，以刘亚楼为代表所提出的中东铁路计划和以崔庸健为代表所提出的外东北恢复计划摆在第一书记的案头。\n\n高岗和李兆麟听取了刘亚楼和方虎山（崔庸健年事已高）的汇报后，两人陷入了深深的思考。无论是东北还是外东北，都有可取之处。支援东北有利于未来解放，但是没有良好的群众基础，这意味着要投入较多的资源，外东北很难得到重视；支援外东北有利于恢复东北抗联的原有力量，群众基础较好，而且日本和伪满对这里并不重视，但这并不利于未来东北的解放，解放东北将有比较大的阻力。\n\n艰难的抉择，该如何选择？经过几次讨论仍然无果的高岗和李兆麟最终一致决定，上报党中央。而党中央的决定是——"
 NEB_main_story_events.9.o1: "执行中东铁路计划"
 NEB_main_story_events.9.o2: "执行外东北恢复计划"
 NEB_main_story_events.9.tt: "请查看£CPC_texticon §x东北局§!的GUI，开始东北解放的第二阶段任务。"
 NEB_main_story_events.10.t: "东北明珠"
 NEB_main_story_events.10.d: "滔滔江水冲击着泥沙向着东方流去，一列火车呼啸着穿过伊藤博文殒命之地，另一列火车冒着滚滚浓烟停靠在站台一侧。\n\n佐佐木从列车上下来，看清自己即将生活的城市。火车站还保留着俄式的风格，据说本想改造成日式的建筑，但发现日式建筑与俄式建筑相差很大，改造基本上等于重建，于是日本便放弃了改造，只是做了一些修缮。佐佐木来到站前广场，车水马龙，摊贩的叫卖声不绝于耳，一片繁忙的景象。佐佐木感到一丝振奋，不枉自己离家千里来到这座繁荣的城市。\n\n找到工作的佐佐木每天都很快乐，他的职责是赶走街头巷尾的乞丐、黑帮和流浪汉，但在哈尔滨这样的城市里根本不可能做到，因此这只是一份闲差。在咖啡管里喝咖啡，品红茶，是他一天的闲情雅致。夜晚的霓虹灯下与佳人共舞成为他的乐趣，在剧院里看上一段精彩的电影，吃着红肠，喝着格瓦斯，一天就这么过去。佐佐木心想，遥想自己在东京的大别墅里，似乎也差不多。\n\n沉溺在享乐中的佐佐木看着给自己洗脚的中国女人，那曼妙的身姿顿时勾起了他的情欲，不顾正在给他洗头的俄罗斯女娃和给他擦身体的朝鲜少女，一把抱起了她。被吓呆的女娃本能地想要尖叫，少女便迅速捂住她的嘴和眼睛，用朝鲜语喃喃着“不要看，不要看”……\n\n享受了一番的佐佐木翻身倒在床上，丝毫不理会哭泣着的中国女人，因为他正畅想着明天的到来。"
 NEB_main_story_events.10.o: "“不愧是东北的明珠。”"
 NEB_main_story_events.11.t: "支点"
 NEB_main_story_events.11.d: "东北一直是较为寒冷的地方，经过多年的发展，东北不仅不再那么寒冷，还建起了一片工业园区，以沈阳和长春为中心的满洲工业欣欣向荣。\n\n但撑起这片工业的原料是从中华民国运来的。为了运输原料，日本投入了海量的资金去运营和保障运输，其重点便是锦州。锦州素来是东北的南大门，所有的物资运输全部都要经过这里。刘亚楼正是看中了这点，由此提出“率先突破锦州”。在此基础上，党中央向东北局提出抢占锦州、沈阳和大连然后北上海参崴的大战略构想：人民解放军将以迅雷不及掩耳之势突破锦州，然后抢占辽西和辽东的战略要点，隔绝东北敌人和日本的联系。\n\n运用情报等手段调动敌人向边境靠拢并不是难事，难的是人民解放军是否能在极短时间内抢占这些战略要点，而这些战略要点中，日本一定会对锦州着重防守，因此，能否迅速突破锦州，便是关键中的关键。\n\n于是，东北局决定提前在这里打下一个楔子，在未来彻底扼住敌人的脖子。用锦州这一小小的支点，撬动东北这个大铁球！"
 NEB_main_story_events.11.o: "未雨绸缪"
 NEB_main_story_events.12.t: "漫长的春天"
 NEB_main_story_events.12.d: "东北局虽然确立了以东北为核心的战略，但外东北也是重中之重。经东北局讨论后，决定派遣方虎山前往外东北继续开展工作。\n\n方虎山赶回海兰泡后，一刻不停地投入到工作当中。\n\n方虎山重新调查了外东北的情况。虽然仍然糟糕，但至少不会再孤立无援。他着手重新恢复外东北的党组织和根据地。首先，清点外东北残存的党员，一些前苏联共产党员也加入了中国共产党；在朝鲜的同志们也重新取得了联系，方虎山根据东北局指示，帮助朝鲜同志组建朝鲜共产党。其次，恢复根据地。东北局在东北的行动成功吸引了日本和伪满的注意力，方虎山借此机会恢复了外东北部分根据地，由于东北局支援不足，仅仅恢复了庙街根据地。由于其他根据地还在艰难恢复中。最后，方虎山重新组织了外东北的游击队，虽然规模不大，但牵制日军已经绰绰有余。\n\n收到方虎山报告的李兆麟欣喜万分，他挥笔写下一段赞语：“白山黑水三十年，看似烂柯实树人。方圆千里纵横山，虎啸威慑敌胆寒。”\n\n漫长的黑夜已经结束，冰冷的大地迎来了迟到的春天。收到回信后的方虎山激动万分，他深切感受到了冬天的彻底结束，他由衷地希望，这次的春天再漫长一些。"
 NEB_main_story_events.12.o: "让我们感受和煦的春风。"
 NEB_main_story_events.13.t: "三驾马车"
 NEB_main_story_events.13.d: "中国、苏联、朝鲜，是遭受日本入侵最严重的三个国家。而东北恰好处在三国的交汇之地，因此东北抗联的人员大部也是由三国的人民组成。无论是过去成立的东北抗日联合政府，还是东北局成立后改编的人民解放军，中苏朝三国的人员依然占大多数。这种情况迫使党中央一直慎重处理三国人员的关系，争取将三国人民团结在中国人民的抗日旗帜下。可以说，中国人民、苏联人民和朝鲜人民是抗联的三驾马车。\n\n朝鲜是第一个遭受日本吞并的国家。自一九一〇年被吞并以来，朝鲜独立运动风起云涌，从未停止，民族英雄安重根刺杀伊藤博文是朝鲜人民绝不屈服于奴役的宣言书。苏联是受日本重大打击的国家。虽然继承的是沙俄的土地，但上面的底层人民是无辜的，苏联解体，日本火打劫。广大苏联人民在获得解放后，又遭受新的压迫。中国是受日本入侵最严重的国家。南京大屠杀，祖国遍体鳞伤、四分五裂的现状都拜其所赐，中国共产党高举抗日旗帜，誓要将日帝国主义从中国大地上驱逐出去。\n\n中苏朝三国人民有一个共同的心愿，那就是——"
 NEB_main_story_events.13.o: "让日本死无葬身之地！"
 NEB_main_story_events.14.t: "空壳"
 NEB_main_story_events.14.d: "德川市长看了看今年的财报，没想到创了新高。他虽然欣喜，但也十分担忧——万一去了东京该怎么办？不过这绝对是他多虑了，因为根本没有必要，东京的人根本不在意海参崴。\n\n德川不希望去东京还有另外一个原因。从他上任至今，熟悉的面孔就一个个消失了——他们升职的速度一个比一个快。本来这没什么，但不知为何，新上任的官员全都不是日本本土的人。德川虽然没有什么政治头脑，但观察还是比较到位的。他略微调查了一下这些官员的履历，虽然都是伪满过来的，可查不到可靠的户籍信息，而这些官员又兢兢业业，完全不像日本官员的作风。心里疑虑的他用只是换了批能干事的人来催眠自己，只不过幻觉终归是幻觉，麻痹无助于解决。等到他再度回眸的时候，周围已经都是这种人了。\n\n德川根本不信什么武士道，作为前幕府的后裔，他早已对政治什么的不感兴趣。只不过如今的情况确实有些棘手，本来是为了躲避政治风暴而来的海参崴，却又陷入了另一个可能到来的风暴。他没有什么心情再为成绩而欢欣，而是拿起了桌上的一本书——《共产党宣言》。"
 NEB_main_story_events.14.o: "希望我的未来能更好一些。"
 NEB_main_story_events.15.t: "快跑"
 NEB_main_story_events.15.d: "佐藤是日本驻伪满洲国总部的一名普通一等士兵，自从他被调到这里后，他就见到了一堆怪事。\n\n自己的顶头上司时不时就指挥自己冲入各种各样的民宅中，但是无论哪个民宅，全都是空的。因此佐藤听得最多的就是“对不起”“笨蛋”“这次一定要抓住赤匪”这些词句。从同事的口中，他了解到伪满境内的“匪患”越来越严重；而曾经把关东军耍得团团转的东北抗联也人间蒸发，再无踪影。非常巧合的是，东北抗联蒸发之时，便是“匪患猖獗”之始。哈尔滨和奉天等地已经人心惶惶，街头巷尾谣传抗联归来，日本将在满洲失败。佐藤因此被吓得不轻。\n\n这一天他被派遣出城巡逻，原来之前有一支巡逻小队失踪了，现在由佐藤所在的小队顶上。出城后佐藤边走边看，非常疑惑这么安全的地方为什么会有小队失踪。到达巡逻终点时，佐藤发现根本没有异常。一无所获的佐藤跟着长官返回，一路上他还在困惑自己在总部呆得好好的，为什么长官要调他们小队出来巡逻？想不明白的他决定不再去想。回到城里，他和同事抱怨长官让他们出去巡逻，同事听完后问了一个问题：“那么那支小队去哪了呢？”佐藤边喝酒边烦躁地回答：“不知道啊。”同事继续说：“可是你不觉得奇怪吗？如果他们遇袭了，一路上不可能没有痕迹。”\n\n这一句话让佐藤放下了手中的酒。对啊，为什么一路上没有发现失踪小队的痕迹呢？"
 NEB_main_story_events.15.o: "“我绝对不能再待在这里了！”"
 NEB_main_story_events.16.t: "功成身退？"
 NEB_main_story_events.16.d: "在东北局的工作让高岗取回了一些很久没有感受到的工作的乐趣。或许这样的工作能够成为他重返中央的跳板？高岗不禁这么想。\n\n眼看自己即将干满一年，高岗觉得是时候了。没必要再在这荒凉的地方碌碌无为，高岗就应在高处的山岗造福众生。于是他向上级打了一个报告，详细地阐述东北的情况，并表达了希望继续在东北局干下去的愿望。\n\n也许一部分人很难理解高岗的行为，但这在历史上屡见不鲜。三辞三让、韬光养晦……高岗也不觉得这有什么损失，因为无论党中央是同意还是不同意，无非是回蒙古，在东北，调边疆，被召回做个闲人。正是因为“有污点”，所以并不怕党中央过分的处置。\n\n与高岗共事有近一年的李兆麟很早就知道高岗的野心。周围的同志们曾反映高岗存在一定程度上恃才傲物的问题，只不过高岗确实能干，因此同志们还能容忍。李兆麟认为党中央肯定会把高岗调走，但党中央不可能那么快就调走他，一个“有污点”的人，最好还是离党中央远一点比较好。\n\n不久，党中央的回信到了。"
 NEB_main_story_events.16.o: "“会议决定，高岗回西安。”"
 NEB_main_story_events.17.t: "该选谁？"
 NEB_main_story_events.17.d: "高岗离任后，李兆麟成为东北局第一书记的不二人选。但第二书记的人选却陷入了争议。\n\n一些同志推荐三十八军司令周保中，理由是周保中更懂解放军的指挥体系与实战作风，由他来领兵，可以加强东北局在军事上的统一指挥。而另一些同志则推荐刘亚楼，理由是他更擅长政治工作，作为东北局的干部，有他在，将能更好地指导东北的政治动员、组织建设与后勤保障等工作。\n\n李兆麟又约谈了几位同志。同志甲说：“周司令当第二书记我是支持的，因为他很熟悉军队。东北局现在需要军队的更多配合，有他来协调工作，肯定事半功倍。”同志乙说：“我个人支持周司令，但周司令毕竟一直在军队，我觉得还是选个东北局内的人，不要给司令增添负担。”同志丙说：“那我支持刘副书记，刘书记政工是一把好手，局里的同志们大部分也很熟悉他。”同志丁说：“我觉得两人都可以，倒是李书记你要注意身体啊，听说高岗这次被调走其实另有一层深意。”同志戊说：“谁来都行，我没有什么意见，能干好就行。”\n\n收集上来各种各样的意见后，李兆麟的心中也有了人选。在选举大会上，李兆麟毫无争议地当选第一书记，而第二书记将会落在谁的手中？众人屏息凝神，唱票人点选票数，最后高声喊道：“第二书记由——”"
 NEB_main_story_events.17.o1: "“周保中担任！”"
 NEB_main_story_events.17.o2: "“刘亚楼担任！”"
 NEB_main_story_events.18.t: "一场梦"
 NEB_main_story_events.18.d: "李兆麟的办公室里有这样一个保险箱，那里保存着每一封批准建立东北党委支部的电报。这一天，李兆麟把这些电报拿出来进行检查，在检查结束的时候，李兆麟发现了一个他很久没有注意到的不起眼的好事——电报总共28封，而这刚好是伪满所占据的全部省份。在李兆麟的桌子上，还有两封批准建立大连支部和海参崴支部的电报等待发出。李兆麟感受到脸上有水滑过，他抬头看了一眼屋顶，但屋顶并没有漏水，他疑惑地用手摸了摸，原来是从自己的眼角流下来的。\n\n“咚咚咚！”突然，敲门声响起了，李兆麟慌忙起身去开门。在他打开门的那一刻，他当场愣在了原地。眼前是一个有着犀利眼神的河南人，他笑着问道：“你好，这里是哪里？”李兆麟握紧拳头，努力抑制自己快要爆发的情绪，平静地回答道：“你好，同志，这里是东北局。”“东北局？完全没听说过啊。”“那是当然啊，因为东北抗联回到党中央的旗帜下了。”“抗联……抗联回家了？”“是啊，抗联回家了！”“回家了……回家了……”陌生人的声音从紧张变为舒缓，他的表情也逐渐放松下来，“回家了，回家了就好……”说着，陌生人化为烟尘消失了。李兆麟惊异地看着这异常的景象，他走出屋子，门外虽然还是东北局所在的广场，但是，广场里却站着三支队列，每一支队列都有一个人握着红旗，红旗上写着“东北抗日联军第一路军”“东北抗日联军第二路军”“东北抗日联军第三路军”。\n\n远方的天空传来那熟悉的旋律，队列里的士兵开口唱道：“我们是东北抗日联合军，创造出联合军的第一路军。乒乓的冲锋杀敌缴械声，那就是革命胜利的铁证……铁岭绝岩，林木丛生，暴雨狂风，荒原水畔战马鸣。围火齐团结，普照满天红，同志们！锐志哪怕松江晚浪生。起来哟！果敢冲锋，逐日寇，复东北，天破晓，光华万丈涌……”李兆麟顿时泣不成声，原地大哭起来。“同志，拿好它。”那个陌生人又突然出现在李兆麟的旁边，并递过来那杆枪，“就用这把枪划破东北的漫长黑夜吧！”李兆麟接过枪，回想着四十年前那段时光，他抹去眼泪，高声喊道：“全体都有，冲锋！”\n\n“兆麟同志，兆麟同志。”李兆麟忽地睁开眼睛，[NEB_second_leader]正担心地看着他。[NEB_second_leader]责备道：“兆麟同志，你怎么睡在地上啊？累了就要好好休息，我在这里要对你提出批评。”李兆麟环视四周，他还在自己的办公室里，似乎刚刚看到的都是幻象。他尴尬地笑了笑，说：“我接受批评。”"
 NEB_main_story_events.18.o: "哪怕这是一场梦，也值得"
