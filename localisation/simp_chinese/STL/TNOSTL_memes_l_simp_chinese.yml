 BOOKMARK_MGI_INFO_DELAYED: "§F归属§x新秩序：雄关漫道§!开发团队\n§C魔法少女的永夜残响§! \n- 已在v1.2.1 残阳如血版本重置；\n- 统一俄罗斯，为“民主”、“自由”而战；\n- 作为大魔女§E月代雪§!，在新秩序的铁幕坠落前对其发起彻底审判；\n在自定义设置中启用后即可游玩!\n\n(什么叫全知者来tno了？这不对吧，谁来也好，施佩尔救我啊高木也行海局呢救我口阿)"
 WORLD_2WRWTER.6.t: "[Get_newspaper_header]鄂木斯克共和国统一中西伯利亚！"
 WORLD_2WRWTER.6.desc: "细碎的声音从中西伯利亚的废土上传来，向人们轻声诉说着鄂木斯克共和国魔女政府统一那片地区的消息。从已经不复存在的黑色联盟中脱身的鄂木斯克共和国，立志重建俄罗斯以保护它的人民免受德军进犯。\n\n一手创建了共和国的月代雪现在领导着这个年轻的国家，承诺要为人民带回战前的繁荣，这为她赢得了满堂喝彩，而她的改革也意味着她将全身心投入到统一俄罗斯的大业上。当共和国的旗帜遍插乌拉尔的崇山峻岭，兵锋直指远东时，这片动荡不安的土地看来前景渺茫。"
 WORLD_2WRWTER.6.a: "不妙啊。"

