 SE_THE_GREAT_MAGICAL_GIRL_WITCH_TRIAL_D: "亚佐夫算什么？他只灭了一整个日耳曼民族，我们要灭了一整个人类族。\n-月代雪"
 SE_THE_GREAT_MAGICAL_GIRL_WITCH_TRIAL_A: "从鄂木斯克再出发"
 WORLD_2WRWTER.114514.t: "[Get_newspaper_header]魔法少女魔女大审判"
 WORLD_2WRWTER.114514.desc: "随着月代雪对外宣布夺取鄂木斯克政权的消息已过一个月，世人均开始以为这只是俄罗斯政治上一个很小的波澜。然而，今天月代雪突然宣布对周围所有国家宣战，并调动全国军队，向边境线外进发。OFN、团结协定、共荣圈各国均对月代雪政权表示强烈谴责。本报战地记者称，无法进入鄂木斯克市内部，更无法调查所谓“魔女民族复兴政府”内部的情况。据从鄂木斯克侥幸逃脱出的俄罗斯难民控诉，鄂木斯克政权是一个反人类的、主张毁灭的政权，内部所有人类的居所均被改造为了一个个大型监狱，并日复一日的进行着对人类的屠杀。其真实性有待考证。\n\n本报记者将持续为您报道鄂木斯克局势。"
 WORLD_2WRWTER.114514.a: "？？？我草这几把啥"
 MGI_Magical_Factor: "魔女因子感染"
 MGI_Magical_Factor_desc: "“大魔女”月代雪曾在环游世界时向人类世界播撒了许多魔女因子，现如今其已经深入人类的骨髓。在月代雪的一念之下，火线将会被引爆，人类将会极速魔女化，变成极具杀意的“魔女”。这时她就可以利用她“最好的朋友”樱羽艾玛，启动魔女杀手，进而达到她的目的，为人类世界献上第一场，同时也是最后一场的隆重的谢幕礼————\n\n§R魔女大审判§!。"
 MGI_Magical_Factor_player_side: "魔女因子"
 MGI_Magical_Factor_player_side_desc: "“大魔女”月代雪曾在环游世界时向人类世界播撒了许多魔女因子，现如今其已经深入人类的骨髓。在月代雪的一念之下，火线将会被引爆，人类将会极速魔女化，变成极具杀意的“魔女”。这时她就可以利用她“最好的朋友”樱羽艾玛，启动魔女杀手，进而达到她的目的，为人类世界献上第一场，同时也是最后一场的隆重的谢幕礼————\n\n§R魔女大审判§!。"
 MGI_the_end_tt: "于是，她沉入了海底。§M感谢您玩通了STL模组的愚人节内容，希望您在其中战斗爽的开心，就如同我们制作它的时候一样。§!"
 
