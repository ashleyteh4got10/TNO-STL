 MGI_THENEWORDER_DESC: "在黑色联盟统治的最后几年里，鄂木斯克已经成为了一台永不停歇的战争机器。每个人都被要求为未来的复仇而活着，每一粒粮食、每一块钢铁乃至每一条生命都被计算进那场终将到来的决战。亚佐夫和他的追随者坚信，人类历史已经证明仁慈毫无价值，而俄罗斯唯一的出路便是用更加彻底的暴力回应暴力。然而，当战争尚未到来，人们便已经开始被战争本身吞噬。工厂缺乏工人，村庄失去青年，城市失去希望。黑色联盟要求人们为了未来而牺牲现在，可越来越多的人发现，他们似乎永远也等不到那个未来。\n\n正是在这样的背景下，月代雪与她的支持者们发动了后来被称作“一月革命”的政治运动。与那些高举意识形态旗帜的军阀不同，她很少谈论主义，也很少描绘宏伟蓝图。她只是反复强调一件事：人们应该活下去。\n\n新政府迅速废除了大量紧急法令，恢复地方自治与议会制度，重新开放学校、医院与工厂。对于长期生活在高压统治中的西西伯利亚居民而言，这无疑是一场久旱之后的甘霖。越来越多的人开始相信，或许俄罗斯真的能够摆脱军阀混战与无休止的仇恨，在民主与秩序之间找到一条新的道路。而令人惊讶的是，这一切竟然运转得异常顺利。议会中的争吵总会在关键时刻达成共识；地方官员很少违抗中央的意志；反对派依旧存在，却始终无法形成真正的阻力。那些最初怀疑月代雪的人逐渐改变了态度，而那些始终拒绝改变的人，则往往会选择离开政治舞台。对此，月代雪本人从不解释。她只是平静地注视着这一切，仿佛一位耐心的园丁照料着自己的花园。她乐于看到人民欢笑，乐于看到工厂运转，也乐于看到城市从废墟中重建。只是偶尔会有人发现，在她那些关于自由、和平与未来的演讲里，从未出现过一个奇怪的问题。她从不谈论人类为何值得被拯救。或许对于大多数人来说，这只是无关紧要的细节。毕竟鄂木斯克的生活正在改善，战争正在远去，而俄罗斯终于迎来了一位不热衷于流血的统治者。只是没有多少人意识到，当一个人愿意投入如此巨大的精力去观察、理解并改造人类时，她未必是因为热爱他们。\n有时，审判一个事物的最好方法，并不是摧毁它。\n\n而是先让它活下去。"
