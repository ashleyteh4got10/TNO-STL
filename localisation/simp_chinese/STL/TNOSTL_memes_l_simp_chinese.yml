 STL_Omsk_Witch_Trial_category_desc: "[STL_OMSK_TGWT_STATUS]"
 STL_TGWT_russian_desc: "中西伯利亚业已统一在一面旗帜之下。但对月代雪来说，这只是第一步——对她的复仇计划来说，这也只是第一步。接下来，该放眼这片充满军阀混战的俄罗斯大地了......"
 STL_TGWT_desc: "§R轰轰烈烈的魔法少女魔女大审判开始了。§!我们终于可以撕破伪装，将那可悲的所谓之“民主”、“自由”同“人类”这个名词一起扫入历史的垃圾桶里，将这个自诩为“文明”的种族对魔女的所作所为百般偿还，以至将其从地球上彻底抹去。\n\n魔女民族的伟大复兴终将到来。\n\n-§R[MGI_TGWT_Get_Region]§!\n---------------\n[MGI_TGWT_Get_Region_Desc]\n\n"
 STL_European_desc: "现在，我们的审判之矛已指向欧洲。\n\n纵观这片大陆的血腥历史，无数次惨烈的大战皆以这里为主战场。在第二次世界大战中，虚伪的轴心国篡夺了胜利，并以所谓“新秩序”的名义，对同族实施着残酷的剥削与奴役。\n\n人类这种生物的劣根性与丑陋，在这片土地上被体现得淋漓尽致。他们自诩为文明的摇篮，孕育出的却只有无尽的杀戮与腐朽的权欲。此等低劣物种，根本不配在这颗星球上延续。\n\n在这里，我们的首要目标就是彻底抹杀团结协定的核心领导国——大日耳曼国，让这群傲慢的罪人沦为业火下的灰烬。"
 STL_Indopacific_desc: "现在，我们的战略步伐已踏入印太地区。\n\n大日本帝国是该地区最庞大的力量投射者。其在满洲开展的生化实验、在东南亚进行的残酷掠夺，不过是人类为了私欲无恶不作的又一铁证。\n\n那一天的地狱之景，我至今仍尽收眼底。那些高举着旭日旗、高喊着“天皇陛下万岁”的刽子手，在屠杀我魔女全族时，脸上不正是带着人类最丑恶、最贪婪的笑容吗？大和人，以及这片土地上所有愚昧的盲从者，你们体内的每一滴血都让我感到反胃。\n\n在这里，我们的首要目标就是彻底消灭大东亚共荣圈的核心领导国大日本帝国与其傀儡中华民国，用他们的血来祭奠亡魂。"
 STL_American_desc: "现在，达摩克利斯之剑直指美洲。\n\n美利坚合众国是新大陆的主要力量投射者。这个曾经依靠背叛宗主国而独立的国家，在撕下自由的伪装后，建立起的却是一个驱逐原住民、歧视有色人种的白人至上主义帝国。\n\n所谓的“民主灯塔”，不过是资本与伪善堆砌的垃圾场。人类总是擅长用高尚的辞藻来掩盖自己贪婪的本性，这种首尾不一、卑鄙无耻的民族，不配继续存在于我的视线之中。\n\n在这里，我们的首要目标就是彻底消灭自由国家组织的核心领导国——美利坚合众国，撕碎这群伪善之人的最后体面。"
 STL_African_desc: "现在，我们的清理范围已经延伸至非洲。\n\n历经蹂躏与战火，如今的非洲各方势力盘根错节。这里既有殖民帝国的残存余孽，也有在混乱中为了蝇头小利而相互征伐、互相啖肉的本土军阀。\n\n别跟我谈什么可怜与悲悯，人类的眼泪只会让我觉得恶心。受害者一旦握紧权力，转瞬就会变成加害者。在这场全人类的审判中，没有任何一个人类是无辜的。弱小不是你们的免罪符，你们的愚昧与混乱同样是寄生在这颗星球上的毒瘤。\n\n在这里，我们不会留下任何死角。魔女的脚步将踏遍这里的每一寸土地，消灭每一个负隅顽抗的、名为“人类”的害虫。"
 STL_Central_desc: "现在，我们的战略目标已锁定中部地区。\n\n作为连接各大洲的绝对枢纽，控制这里将为我们的全球审判提供无可比拟的战略优势。\n\n看看这片土地，贪婪的人类为了地底的石油与财富打得头破血流，在文明的废墟上只剩下教派的仇杀。他们为了虚无的信仰和物质自相残杀，像蛆虫一样在泥潭里翻滚。我对这个物种的无可救药已经感到了深深的厌倦。\n\n在这里，我们的首要目标就是以绝对的伟力碾碎一切平衡，消灭所有妄图阻挡审判的敌对势力。"
