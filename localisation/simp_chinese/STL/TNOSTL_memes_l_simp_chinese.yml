 POLITICS_YUG_KASANE_BROZ_TETO_DESC: "不知道为啥那天克罗地亚游击队被德佬干4了之后铁托睡了一觉自己头发就变红了脑袋上还长了俩红钻头理发也理不掉然后就不知道为什么掌握了神力别人看不出她是铁托然后就以重音teto的身份存活于世跑路到日本去当虚拟歌姬了嗯对"
 Tomorin_DESC: "高松灯（たかまつともり）是由日本娱乐公司Bushiroad策划的次世代少女乐队企划《BanG Dream!》及其衍生作品的登场角色。MyGO!!!!!的主唱，代表色为#77BBDD。\n\n羽丘女子学园高中一年级学生，从前任学生会长冰川日菜处继承来的天文部唯一社员。先后担任过CRYCHIC和MyGO!!!!!的主唱。家住在月之森女子学园附近。\n\n性格略悲观的女孩。感情细腻，有着自己独特的内心世界。容易感到寂寞，常会称自己“感受着孤独”。对人际关系极为敏感，时刻担心着自己的言行是否会产生不良影响。因此总是在二创中死掉（比如常见的“吊灯”梗），然而死法实际上已经不限于自杀。虽然自认不是那么擅长唱歌，但仍会努力去唱。会在笔记本上作词。"
 
