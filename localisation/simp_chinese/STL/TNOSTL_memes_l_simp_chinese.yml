 STL_MGI_main_story.1.t: "余波"
 STL_MGI_main_story.1.desc: "黑色联盟总部的地下室里弥漫着铁锈与焦糊的气味。\n卡尔贝舍夫的尸体还倒在那张破旧的地图桌上，眼睛圆睁，似乎至死都没明白发生了什么。亚佐夫则倒在走廊尽头，胸口被某种不是子弹的东西贯穿——月代雪收回刺穿他的冰锥，任其化作一滩清水。\n她靠墙坐下，血腥味让她想起很久以前，人类对她的家人做的事。\n她原本可以更简单地完成这一切——一个大型魔法，将整个黑色联盟总部连同外围军营一起蒸发。但那会暴露太多。她需要一点点来，像人类那样政变、暗杀、清洗。像人类那样卑鄙。\n她看着自己的双手。干净，白皙，没有一丝血迹。\n但它们确实杀过人。不仅仅是今晚。——那些在“审判”中将她的族人尽数毁灭的人类，那些在她变成“魔女”后惊恐尖叫、却从不反思自己罪行的人类……\n她闭上眼睛，压下翻涌的恨意。\n现在不是时候。她需要先扮演救世主，需要赢得这些人的信任，需要统一俄罗斯，需要……\n“需要变得更像他们。” 一个冰冷的声音在她心底低语。“然后，在他们最相信你的时候，毁掉一切。”\n她睁开眼，嘴角浮起一丝微笑。\n地下室的门被推开，一名年轻的士兵探进头来：“大...大魔女大人，外面的人都聚集在广场上，等您讲话。”\n月代雪站起身，整理了一下沾灰的衣摆，用温柔得几乎能融化冰雪的语气回应：\n“我马上到。告诉人民，苦难结束了。”"
 STL_MGI_main_story.1.a: "新的时代，开始了。"
 MGI_Tsukishiro_Yuki: "月代雪"
 yuki: "大魔女"
 yuki_tt: "祝我们伟大的领袖、伟大的导师、伟大的舵手大魔女月代雪万寿无疆！"
 yuki_end: "终末之时已至" #去吃个汉堡吧
 MGI_Sakuraba_Ema: "樱羽艾玛"
 MGI_Nikaido_Hiro: "二阶堂希罗"
 MGI_Hikami_Meruru: "冰上梅露露"
 POLITICS_TSUKISHIRO_YUKI_DESC: "她是这个游戏唯一出现的真正魔女，也是游戏中被各种文献，纪录和少女讨论中频繁提到的“大魔女”的正体。\n\n怀着对人类的恨意，她定下了精密的计划，目标是对所有人类进行复仇。\n\n13名少女的魔法能力，以及过往囚禁在监牢中死去的所有的预备魔女，和当下还没被发现的预备魔女的魔法能力都来自月代雪。\n\n因此可以认为雪会施展所有的魔法。"
 ultranationalism_yuki_thought_subtype: "月代雪思想"
 ultranationalism_yuki_thought_subtype_desc: "                            §Y月代雪思想§!\n\n£GFX_ideology_ultranationalism_black_league_thought_bar\n\n\n\n\n魔女曾于孤岛上快乐地生活，曾将其智慧的力量投射于世界的广袤大陆之上；虽历经数世纪，其内部仍和谐稳定、其乐融融。\n\n然而，这数百年的欢乐、和平终有尽时——随着一个群体的到来而戛然而止：人类。他们一心要将魔女投入历史的洪流，妄图彻底埋葬这样一个智慧、珍爱和平的种族。在很大程度上，他们得逞了。魔女岛上，魔女生活之痕迹已灰飞烟灭，众大魔女行踪未知，魔女种族濒临灭绝。此乃“第一次审判”。\n\n但面对看似不可逾越的困境，一人拒绝屈服。月代雪同志在魔女岛内，日复一日地忍受着无尽的孤独。然而，这位魔女的英勇之女深知，这并非终局。这位最后的魔女于魔女岛飞跃了整个地球，散播魔女因子——魔女审判的基础与教义得以锻造。对于月代雪自己而言，一个梦想始终存在：那曾在其铁蹄之下屠戮了整个魔女族的动物必将灰飞烟灭，一个全然、纯粹由魔女主宰的新纪元，亦将随之降临。“魔女大审判”终将来临。"
 STL_april_fools.1.t: "北境异动"
 STL_april_fools.1.desc: "苏联崩溃已有20余年，俄罗斯大地陷入无休无止的分裂中，鄂木斯克黑色联盟政权就是这样一个在第一次西俄罗斯战争后建立起来的军阀之一。其领导人卡尔贝舍夫坚持的“大审判”理念，旨在对德国发动大规模复仇，已被黑色联盟成员奉为至宝。然而，鄂木斯克方面却传来一则令人费解的消息：鄂木斯克政权已被自称“月代雪”的少女所夺取，并开始去除鄂木斯克境内的民族主义情绪。我们对鄂木斯克的进展极为有兴趣。国家内部讨论了许久后，最终决定："
 STL_april_fools.1.oa: "有意思。"
 STL_april_fools.1.ob: "视若无睹。"
 STL_april_fools_tt: "§R轰轰烈烈的魔女大审判开始了...§!"
 STL_MGI_main_story.2.t: "罪人舞步旋"
 STL_MGI_main_story.2.desc: "随着魔法少女魔女大审判的终止，世界流尽了最后的一滴血。魔女因子如同无孔不入的瘟疫，在新秩序的每一个角落蔓延。曾经不可一世的纳粹帝国、在大洋彼岸苟延残喘的自由世界、以及那些在废土中挣扎的军阀，都在黑色的魔女之火中迎来了平等的毁灭。人类自相残杀，哀嚎遍野，最终，一切归于死寂。\n\n审判已经完成。人类这个种族，已经彻底从地球上被抹去了。除了……她身后那个小小的身影。\n\n“大魔女大人……大家都去哪里了呀？”\n\n冰上梅露露揉着惺忪的睡眼，拉了拉月代雪的衣角。这个被她当作实验体、却在不知不觉中相依为命的人类少女，此时正用清澈而纯真的目光看着她。梅露露并不知道外面发生了什么，她不知道在这七天里，她所熟知的人类文明已经化为历史的尘埃。\n\n月代雪的身躯剧烈地颤抖了一下。她转过身，看着梅露露，那张曾经面对千万军队也毫无波澜的冰冷面容，此刻却写满了挣扎。完美的人类灭绝计划中，唯一的漏洞就是这个女孩。她本该在第一天就和其他人类一样，化为扭曲的魔女。是月代雪用自己的魔法，硬生生地将她护了下来，让她多活了七天。\n\n但现在，谢幕礼已经结束，舞台必须清空。只要梅露露还活着，这场对人类的“彻底审判”就永远留有污点，魔女的复仇就无法画上句号。\n\n“梅露露，”月代雪蹲下身，抚摸着女孩柔软的长发，声音沙哑得不像她自己，“去睡吧。去那间我们一起生活的屋子里，做个好梦。梦里没有战争，没有仇恨，有你最喜欢的食物，还有艾玛和希罗……她们都会陪着你。”\n\n“那大魔女大人也会来吗？我不想再次失去您了。”梅露露天真地问。\n\n月代雪没有回答。她只是将最后一缕代表着毁灭、却也温柔无比的魔力，缓缓注入了梅露露的体内。女孩的眼神渐渐变得迷离，随后带着甜美的微笑，在她的怀里沉沉睡去，身体化作了无数亮晶晶的魔力尘埃，飞向了那间至今保留完好的房屋。\n\n她亲手杀死了最后的人类。她亲手毁灭了自己在这个世界上唯一的“家人”。\n\n月代雪缓缓站起身。世界从未像现在这样安静，安静得让人发疯。仇恨已经洗雪，复仇已经完成，可随之而来的，是一股将她吞噬的巨大空虚。\n\n她需要一个地方，一个可以让她独自面对这无尽孤独的地方。于是，大魔女转过身，迎着从深渊中涌出的凛冽寒风，一步一步，麻木地走向了峡谷的最顶端。"
 STL_MGI_main_story.2.o: "审判落幕，孤独始生。"
 STL_MGI_main_story.3.t: "凛冽寒风"
 STL_MGI_main_story.3.desc: "她站着。她独自一人站在峡谷的最高端。\n\n寒风自深渊之中席卷而上，撕扯着她的衣角，也撕扯着这片早已死寂的世界。没有回应，没有回声，仿佛连风都只是例行公事般地掠过她的身旁。\n\n她已经完成了对人类的最终复仇，将他们转变为次等的“魔女”，任由他们扭曲、疯狂地自相残杀，再以魔女杀手将其一网打尽——就像百年前，人类对她、对她们做的一样，冷漠地、精准的，将这个自誉为“文明”的种族从世界上抹去。他们早该被毁灭。他们早应被毁灭。\n\n魔女本是一个与世无争的种族，她们将自己隔绝开来，安居乐业地生活在魔女之岛上，她们观察人类，却从不干涉。\n\n人类呢？人类飞速发展，科技不断进步，生活质量不断上升。他们征服天空，他们凝望深海。可他们从未满足。他们为了利益对着同族大打出手。第二次世界大战的惨烈，至今仍在她回忆之中久久不能抹去——德国、日本在他们打下的土地上实行彻底的、不留情的殖民政策，将殖民地的人民当做猪猡来看。更何况，是异族呢？\n\n最终，他们看向了魔女。几乎所有魔女，都死在了那场风暴之中，只剩下她。她不甘心。她决心要为死去的同胞报仇。她为此制定了周密的复仇计划，创造出完美的“魔女因子”，一步一步地宣判人类的死刑。她已亲手结束这场审判。现在地球上已经不剩名为人类的物种，包括曾经缠着她的人类实验体——冰上梅露露。\n\n她缓缓坐下。岩石冰冷而坚硬，透过衣料传来刺骨的寒意。她的脑海中，又浮现了那个困扰她已久的问题——\n\n这一切真的值得吗？\n\n她在实验初期，曾收养了一名人类，取名冰上梅露露，她本该只是一个实验体，一个用来验证魔女因子的工具。然而实验失败了。梅露露并没有魔女化，她只是留了下来，整天缠在月代雪身边声声叫着“大魔女大人！”。即使实验失败，她也不得不承认，自从梅露露出现以后，她终于不再是孤身一人。她开始为她准备食物，为她讲述这个世界，为她……留下一盏灯。她将她当作实验体，却又在不知不觉间，将她当作了家人。\n\n她走进那间至今被保留完好的房屋。那本属于她、梅露露、和那总是抱怨打工不易的猫头鹰三人的房屋。她很想再听到一声“大魔女大人，您回来了”，很想再次将梅露露搂在怀里，再次与她们享受难得平静的时光。这一切已经一去不复返了。她所做的一切本该是为了复仇，为了让人类偿还她们所受的一切痛苦。她成功了。她将一切百倍奉还。可最终，就换来一个这么样的结局吗？精心计划的复仇计划，就换来一个只有她的、一个无比安静、无比空旷、无比孤独的世界吗？她开始怀疑。怀疑自己的选择。怀疑自己的执念。甚至怀疑——那场复仇本身。\n\n“......”她沉默良久。\n\n“艾玛、希罗、梅露露。”她轻声开口，像是在呼唤，又像是在告别。\n\n“谢谢你们。”她站起身，没有回头，向门外走去。\n\n她像是终于放下了什么。\n\n又像是，将一切都带走了。"
 STL_MGI_main_story.3.o: "她笑了笑，转身飞入大海。"
