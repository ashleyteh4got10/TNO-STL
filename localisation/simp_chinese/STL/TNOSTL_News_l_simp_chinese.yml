 WORLD_STL.1.t: "[Get_newspaper_header]澳大利亚危机落幕：共产主义者执掌新政权"
 WORLD_STL.1.d: "持续数周的澳大利亚宪政危机以意料之中收场。面对孤立无援的窘境，澳总理比耶尔克-彼得森宣布辞职并迅速流亡美国。军方随即下令所有部队返回兵营待命，避免无谓流血，全国对峙就此终止，共产主义者取得了这场“革命”的胜利。\n\n据传，老牌革命者E.F.“泰德”·希尔以澳共马列派为基础，联合各路共产主义者共同组建统一战线并正式执掌新政权。\n\n尽管澳大利亚国内各处都洋溢着斗争胜利的节日氛围，但统一战线的内部倾轧开始逐渐显现，有观察人士指出，希尔面临的核心挑战在于澳大利亚政治生态中“工会强而党弱且杂”的长期特点。因此，他正试图在澳大利亚深厚的工联主义传统与马列毛主义之间寻求一种创造性的调和，探索一条他所称的“具有民族特色的社会主义道路”。\n\n与此同时，前政权的残余力量并未彻底消失。小股反对派武装躲入广袤的沙漠与丛林地带，以偷袭交通要道和偏远荒漠小镇的方式表达对新秩序的抗议。不过，对新政府而言，这些被轻蔑地称为“白色凯利帮”的散兵游勇，不过是注定碰壁的小小苍蝇而已。"
 WORLD_STL.1.a: "现在是时候面对一个截然不同的未来了。"
 WORLD_STL.2.t: "[Get_newspaper_header]戒严令颁布,澳大利亚滑向内战深渊"
 WORLD_STL.2.d: "总理乔·比耶尔克-彼得森拒绝交权，宣布国家进入紧急状态，誓言以“一切必要手段”维持统治。澳共马列派随即在悉尼成立“澳大利亚人民政府”，宣称代表工人阶级，号召工会、学生和倒戈武装加入,并称彼得森政府违宪。内战一夜成形：彼得森政府据守堪培拉及部分军事据点，人民政府在南部和东部工业城市集结，双方多地交火。\n\n华盛顿打破沉默，自由国家组织以“保护平民”为由组建多国维和部队，在北部沿海设立“托管区”。批评指此举实为遏制南太平洋出现亲社会主义政权。托管区内，前工党与自由党领导层联合发表声明谴责总理，借外国军事保护伞重建政治存在。\n\n一场决定澳大利亚未来的战争，已然打响。"
 WORLD_STL.2.a: "预料之中。"
 WORLD_STL.3.t: "[Get_newspaper_header]澳大利亚大罢工"
 WORLD_STL.3.d: "澳大利亚正经历远超1923年墨尔本警察罢工的全面动荡。全国高校学生扎营路障，宣称打持久战；各大工会联合号召总罢工，“不是我的共和国！”口号席卷街头。罢工更趋黑暗——多座城市出现受“红军旅”启发的城市游击队，针对公安部门的爆炸袭击令当局焦头烂额。\n\n面对近乎失控的局势，总理乔·比耶尔克-彼得森却在火上浇油。他在紧急电视讲话中，当众撕碎早已剪烂的旧《澳大利亚宪法》，随即举起猎枪，誓言“不惜一切代价恢复秩序”。国内外观察者一致斥此为独裁主义的公然宣示——法律已死，唯枪口意志为真理。\n\n\n政府同时宣布，新组建的“矿工”与“农民”民兵获额外执法授权，正协同警察部队开入城区镇压群众运动。"
 WORLD_STL.3.a: "澳大利亚未来前途渺茫。"
 WORLD_2WRWTER.1.t: "[Get_newspaper_header]老挝发生共产主义政变"
 WORLD_2WRWTER.1.desc: "许多人都于公私场合指责老挝总理苏发努冯同情共产主义。今天，红色亲王证明了此类言论的正确性。在东南亚革命同盟建立后，他不仅公开宣称支持东革盟成员，为表团结之意，他甚至公开脱离共荣圈，加入东革盟。老挝重命名为老挝社会主义共和国，与越南一道加入了一个亚洲范围内的新生共产主义集团。\n\n由于苏发努冯此前曾表态支持泛亚主义，他的举动大出所有人意料之外。困惑不已的日本方面发表了尖锐的谴责，他们投资于老挝发展的数百万日元就此打了水漂。苏发努冯亦取缔了国内数个保王派及极右翼政党，并将此前被逐出老挝政坛的印支共产党官员重新召回政府。尽管如此，国家现有的民主结构并没有发生其他变化。\n"
 WORLD_2WRWTER.1.a: "共荣圈又失一员。"
 WORLD_2WRWTER.3.t: "[Get_newspaper_header]中俄战争"
 WORLD_2WRWTER.3.desc: "随着中俄谈判的破裂，俄罗斯在中国未做好充足准备的情况下骇然对中国宣战，其军队现已跨过中俄边境线。[SOV.GetLeader]对外宣称，此次战争的目的是“克复被中国所占的远东故土”。在战争爆发数小时后，中国政府对俄罗斯政府的所作所为“表示强烈抗议”，并在全国范围展开战时动员，号召全国人民积极抗击侵略者，同时呼吁全亚革盟所有国家协助中国一同抗击“俄罗斯帝国主义”的侵略。\n\n在战争爆发的第一时间，OFN就对外表明支持中国抗击俄罗斯的侵略，并向亚革盟成员国输送武器、派遣军事顾问；团结协定虽暂时未对此次战争做出反应，但国际评论家认为，为削弱俄国势力，团结协定有较大几率站在俄罗斯对立方。据知情人士透露，几年前在第二次大东亚战争中因完败而销声匿迹的日本经过几年恢复后，正在重新调集兵力，从北海道方向向中俄边境靠去。"
 WORLD_2WRWTER.3.a: "让我们再来一次吧。"
 WORLD_2WRWTER.3.b: "破釜沉舟。"
 WORLD_2WRWTER.3.c: "欧亚怎么又打起来了？"
 WORLD_TER.400.t: "[Get_newspaper_header]《中苏友好条约》正式签订"
 WORLD_TER.400.desc: "今日，莫斯科、北京方面传出一则消息：[CPC.GetName]与[SOV.GetName]，这两个不久前才结束内战的社会主义国家，于北京正式签订《中苏友好同盟互助条约》。条约中规定：中国将为苏联的第二次西俄罗斯战争提供志愿军、装备支持，同时苏联将归还所占蒙古部分地区、唐努图瓦、远东中国“外东北”地区；在战后，两国将在经济、技术、资源等方面互助同盟，以谋求共同发展、共同进步。\n\n大部分国际媒体认为，这是国际共产主义运动壮大的另一表现；德、日二国对此未作表态。"
 WORLD_TER.400.a: "世界人民大团结万岁！"
 WORLD_TER.400.b: "垂死挣扎罢了。"
 WORLD_TER.400.c: "......"
 WORLD_TER.400.d: "新秩序可能就此迎来一缕曙光？"
