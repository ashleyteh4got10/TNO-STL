l_simp_chinese:
 #menu_tooltips
 STL_version_intro_tt: "§L沧海横流§!\n\n§L沧海横流§!原指天下激变、山河动荡，后渐成为时代洪流的代名词。乱世之中，江河改道，乾坤易位，旧时代在惊涛骇浪中沉浮，新世界亦于风云际会间孕育而生。毛泽东《水调歌头·游泳》中\"§L更立西江石壁，截断巫山云雨，高峡出平湖§!\"一句，则赋予了这种洪流新的意义——人不仅能够顺应历史，更能够亲手塑造历史，使奔腾不息的时代汇入属于人民的航道。\n\n对应TNO版本：§O当代托德西利亚斯§! - Ver.1.10.x"
 STL_version_intro_tt_delayed: "§F古往今来，人们总以为历史如江河一般，只能顺流而下；然而真正推动历史洪流滚滚向前的，却是身处浩瀚江河之中的人。沧海横流，激荡着山川湖海，冲刷出一个时代的命运。\n\n第二次世界大战的结束，并未迎来真正的和平。§q德国§!、§e日本§!与他们的追随者瓜分了欧亚大陆，将法西斯的旗帜插遍旧世界。革命的火焰被钢铁与暴力压入灰烬，自由、公正与平等沦为群山峻岭间的微弱词句。强权宣称，他们缔造的新秩序将延续千年；历史的终点，不过是胜利者替失败者写下的墓志铭。\n\n然而，没有任何一条江河能够永远停滞，亦没有任何一个帝国能够真正冻结历史。钢铁能够压制反抗，却无法熄灭信仰；高墙能够阻隔人民，却无法阻挡时代。自§R中国§!群山之间，到§S俄罗斯§!无垠冻土，总有人在黑夜中守护那一点微弱的火光。他们或许互不相识，或许终其一生都未曾见证黎明，却始终坚信：总有人会接过倒下者手中的旗帜，总有一天，旧世界终将迎来自己的黄昏。\n\n终于，有人跨越雪原，将赤红的旗帜重新插回莫斯科；有人走出群山，使五星再次映照神州。曾经相隔万里的两条江河，终将于历史的下游汇流，共同冲垮旧时代最后的堤坝。法西斯引以为傲的千年帝国，终究不过是时代长河中的一朵浪花。\n\n江河仍在奔流，世界依旧前行。新的秩序不会因一场胜利而永固，未来也不会因一次革命而注定。昨日的革命者缔造了今天，而今天的人们亦将决定明天。\n\n昔日，世界在沧海横流中沉沦；今日，人民即为那股改变历史的洪流。§!"
 TNOSTL_menupic_tooltip_1: "§F§R雄关漫道§!真如铁，而今迈步从头越。§!"
 TNOSTL_menupic_tooltip_2: "§F§L天若有情§!天亦老，人间正道是沧桑。§!"
 TNOSTL_menupic_tooltip_3: "§F§O为有牺牲§!多壮志，敢教日月换新天。§!"

 
