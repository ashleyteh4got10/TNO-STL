 STL_CHI_main_story.1.t: "天日昭昭"
 STL_CHI_main_story.1.desc: "这是七十年代的初开之日，清华、北大、辅仁等学校的年轻学生以及相当大一部分北平市民跟随着半个月前散布的秘密传单的指引来到了卢沟桥，只看见一个年近四十的妇人站在桥边的临时讲台上，手拿着白色大喇叭。\n\n“市民朋友们，民主同志们！这是一九七零年的第一日清晨，我站在这里要为我们北平征得不受压迫不受荼毒的未来！”\n\n“各位应该会记得，七年前我们北平为了民主自由的抗争作出了巨大的牺牲——被无辜逮捕的北平市民超过了三千人，而被随意处决者竟占其中的三分之一，这里面包括我们市民公会的老前辈储安平先生，也包括，迄今为止杳无音信的遇罗克先生！”\n\n“没错！被民国警队、满洲国军一并发布布告‘通缉’了七年的遇罗克，他就是死在这里，就死在这条永定河！”\n\n会场一片哗然。\n\n“就是在卢沟桥旁，我们民主同志会的几位前辈冒着违反宵禁被捕的巨大危险，在这里将遇罗克烈士的遗体打捞上岸，就地安葬的。”张志新的声音渐转哀伤，“遇罗克烈士的死状十分惨烈，我不忍再做描述——但他的死真切地给我们所有人都上了一课。”\n\n张志新深吸一口气：“侵略者用他们的子弹制造鲜血，却用我们的鲜血浇灌他们的野心！”\n\n会场爆发出一阵又一阵呼号，但张志新仍然顶着呼号用更大功率的喇叭高声疾呼：“市民朋友们，日本人用四十日元的时薪将我们锁在镣铐中已有四十年了！日本走狗满洲国军的司令部已经撤退到热河，我们难道还有任何理由继续服从他们所谓的军管吗？”\n\n眼见会场已经热血躁动，张志新高举右拳：“打倒日本帝国主义！赶走满洲侵略者！还我自由北平！”"
 STL_CHI_main_story.1.o: "“还我自由北平！”"
 STL_CHI_main_story.2.t: "滚滚长江东逝水"
 STL_CHI_main_story.2.desc: "正是武汉的清晨。红白的太阳穿过长江上层层的雾霭，将绵延不绝的层积云下的天空染成赤红。长江静静地流过，中华民族的母亲河永不停歇。陆洪恩与千千万万的武汉市民们彻夜未眠，屏息凝神，听着城外越来越近的炮声。隆隆的炮声让陆洪恩兀得想起还在上海时在乐团中听到的定音鼓。在震天撼地的战鼓声中，武汉要么再次卑躬屈膝，要么骄傲地赢得站立的资格，抖去身上的灰尘，显露出中华革命第一城的底色来。\n\n到了上午，炮声就渐渐停息了下来。中午的时候，解放军就进了城。一排排灰绿色的人，脸上还蒙着灰尘与血迹，沉默又好奇地打量着这座九州通衢。真到自己和其他同志们的努力开花结果的时候，走在江边的陆洪恩却有些恍惚。他想起了家人信仰的天主，也许真有这样全知全能而又慈悲的主来拯救中国了？\n\n“是人民正义联盟的陆洪恩同志吗？”一声问候打断了陆洪恩的思绪。打招呼的是一名解放军军官。满脸蒙灰的他整了整因连日战火而凌乱的军帽，拍拍身上的军服，笔直向陆洪恩敬了一个礼。“党中央非常感谢你在武汉的工作，正因为有你和人民正义联盟的诸位同志，解放军才能以最小的损失接收武汉。有了武汉人民的支援，我们一定能更快地解放全中国！“\n\n“解放中国……固然很好，你们打算如何处理武汉目前的局势？我们武汉市民已经抵抗许久，虽说高伪政府压榨出的民脂民膏已归人民所有，但是你自己也看到了吧。”说着，陆洪恩望向城市，“还有许多人流离失所，还有许多的人无法吃饱穿暖，还有许多的人需要乞讨才能生活……你们打算怎么办？”\n\n解放军军官望向陆洪恩的手。那是一双钢琴家的手，纤细，修长，却在战火中磨出了茧子来。“共产党的宗旨始终是为人民服务。我们会尽一切努力保证武汉人民的正常生活。但是还有一件要紧的事，不知汉阳兵工厂的生产状况如何？如果停工了，能否快速复工以支援前线？”\n\n陆洪恩哽住了。他敏锐地捕捉到了一丝不和谐音，从而没有继续抛出有关工人民主、民主选举、自由言论和自由艺术表达的问题来。他怀念起三十多年前在洋人的冒险家乐园表演时的生活。那时的自己没有如今的顾虑与重担，只有音乐和下一顿饭的着落困扰着自己。也许等到中国解放了，自己就能回到上海，重新弹起钢琴吧。"
 STL_CHI_main_story.2.o: "……都付笑谈中"
 STL_CHI_main_story.3.t: "海南省密报"
 STL_CHI_main_story.3.desc: "高宗武总统：\n\n自1968年以来，共党“琼崖纵队”向湛江、雷州等地进行渗透和接触，今日，我们突然与雷州当地失去了联系，雷州对外宣称建立“反迫害斗争委员会”，其社团领导人为苏守忠。\n\n苏守忠，又名苏祐世，1941年生于广州，先后信奉天主教及佛教，于1959年进入富士通香港工厂，因1963年李纯如自杀事件在香港中环参与游行和绝食抗议活动而被富士通解雇，辗转来到雷州，在长期在日本企业工作后后思想逐渐转变为革命派，秘密组建了反斗委地下团体。\n\n因近日北平、武汉等地生变，苏守忠为“响应义举”而自行组织了抗议游行，后反斗委已经控制了湛江市政府大楼，并宣布雷州半岛自治。\n\n现在东部诸暴乱火线已经引燃，如果我们再不作出行动，二十多年的和平政权即将毁灭。"
 STL_CHI_main_story.3.o: "同意行动。"
 STL_CHI_main_story.4.t: "东部暴乱！"
 STL_CHI_main_story.4.desc: "近日，北平、武汉、雷州等地相继爆发大规模民主武装暴乱，大有燎原之势，已经濒临灭绝的共党地下组织再度活跃。这是我们一举擒拿共党地下势力，壮大力量的绝佳机会！\n\n南京已经批准对东部暴乱势力的镇压计划，并对各东部暴乱之暴民代表提出严重警告，国军各部已在三城外待命。情报部门已全力投入工作。我们必须消灭赤匪，剿灭暴乱，维护三民主义中国！"
 STL_CHI_main_story.4.o: "时刻准备着。"

