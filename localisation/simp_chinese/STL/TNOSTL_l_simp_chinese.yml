 CHI_dem_riot_gui: "东部暴乱"
 CHI_dem_riot_gui_desc: "在我们潜心§G发展韬光养晦§!之时，一些希望中国再次独立于旭日之下的国民却并未坐以待毙——自§Y安田危机§!以来，中国共产党就暗自支持在§Y广西、北平§!等地掀起§C暴乱§!，尽管最终被我们§x镇压§!下去，但零星的抗议活动仍在§Y持续§!，并随最近国际国内局势动荡而§G越发壮大§!起来——以§Y北平、武汉、雷州§!三地为代表的§C东部暴乱§!正在蔓延，在我们正式对日本撕开脸前，我们有必要对其继续§Y镇压§!。"
 CHI_dem_riot_gui_tt: "-§R实力§!\n---------------\n每个§C起义地区§!都有其§R实力§!，代表了他们§Y抗击中央政府镇压§!的能力，其实力将随时间推移§R缓慢下降§!，若某一地区的实力§R低于§!§Y30%§!，我们便可§R直接展开镇压行动§!。\n我们将通过一系列行动镇压§C暴乱者§!，削弱他们及其背后的赤匪的§R实力§!。\n\n一旦三个地区被§x全部镇压§!，§Y失望的东部人民§!极有可能将对中国共产党的§x解放行动§!持§R冷漠态度§!，以便我们更好的完成第五个现代化。\n\n-§G激进度§!\n---------------\n每个§C起义地区§!都有其§G激进度§!，代表了他们§Y民主诉求§!的激进程度，尽管我们可以通过§Y情报网络§!来§G削弱§!这些地区的§R实力§!，但相应地也会§Y助长§!他们的§G激进度§!，若三地§R平均激进度§!大于§Y50%§!，他们将自行其是，在上海召开§m中华民国国是会议§!，而§R不再配合§!中国共产党在西安召开§G全国人民政治协商会议§!的民主提议。\n\n——尽管对§R戡乱事业§!而言，§Y两个会议§!都会成为中国共产党赢得战争的§G垫脚石§!，但对§x中共§!而言，§G政协会议§!能为他们的§R战争事业§!带来较大帮助，而国是会议将会使他们成为一股隔绝势力。"
