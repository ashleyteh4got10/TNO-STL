 Eurasia_National_Revolutionary_League: "欧亚民族革命同盟"
 ANRL_Leader_SOV: "欧洲反法西斯革命领袖"
 ANRL_Leader_SOV_desc: "核心领土防御：§G+10%§!\n投降界限：§Y100%§!\n\n俄罗斯大地在被德国法西斯铁蹄践踏之后，分裂了三十多年。终于，在苏联解体近三十年之际，俄罗斯重归于一面红旗之下。现在，新生的俄罗斯正在准备对德国发起第三次战争，以克复故土。\n\n然而，反法西斯事业并非一帆风顺。仅凭俄罗斯自己的力量无法击败纳粹德国。自革命烈火中诞生的新国家需要团结一致，抵御全球帝国主义随时到来的入侵。东方的中国共产党集合亚洲各国共产党齐聚越南，共同签署《河内协定》，成立了亚洲民族革命联盟；《中苏友好同盟互助条约》签订以后，苏联正式加入了该联盟，“亚洲民族革命联盟”也由此更名为“欧亚民族革命联盟”。\n\n§x“所有受到帝国主义侵略、控制、干涉和欺负的国家和人民联合起来，打倒我们共同的敌人！”§!"
 ANRL_Leader_SOV_effect: "[!ANRL_Leader]"
 RUS_CPC_treaty_of_friendly: "《中苏友好同盟互助条约》"
 RUS_CPC_treaty_of_nap: "《中俄互不侵犯条约》"
 RUS_cpc_supports: "向北京"
 RUS_cpc_supports_desc: "在东方，我们的中国同志推翻了日本法西斯的压迫，成功完成了人民革命。因此，我们将与中国同志建立友好关系，以学习其革命经验。"
 RUS_have_a_talk_with_cpc: "看向南方"
 RUS_have_a_talk_with_cpc_desc: "中国共产党已经成功在日本人手中夺取了东亚各国。现在中国已经完成统一，东南亚的国家大多数也在中国共产党的势力范围内。在这种情况下，如果我们想重新夺回中占远东地区，我们最好态度诚恳地询问中国政府的态度。"

 CPC_RUS.1.t: "北方来客"
 CPC_RUS.1.desc: "一辆绿色军用车缓缓驶入中南海的院内，车内坐着几位身着深色服装、面色严肃的苏联外交官。车门打开，外交官们陆续走出车厢，举步维艰地穿过那些庄严的红墙与古老的树木，向朱德的办公大楼走去。尽管他们之间并没有说话，但空气中弥漫的紧张感已昭示了这次会晤的重要性。亚历山大·瓦西里耶维奇便是此行的领头人。在进入接待室后，他的目光一扫，就看到了朱德主席。朱德主席早已在办公桌旁坐下，身穿中山装，眉宇间透露出一种历经岁月洗礼的坚毅与深沉。尽管他年事已高，但他的眼神依然充满了智慧与远见。与朱德同在的还有一些中共高层领导，他们准备聆听来自苏联的外交提案。瓦西里耶维奇和其他外交官齐齐鞠了一躬，表示敬意。随后，瓦西里耶维奇起身，开始了这场意义重大的会谈。\n“朱德主席，”瓦西里耶维奇的语气带着几分敬畏，“我们苏联深知，在世界格局发生剧变的今天，中国是我们最为重要的战略伙伴。正如您所知，德国法西斯不仅仅威胁到欧洲的安全，更危及全球的和平。我们希望得到中国的帮助，共同抵抗这一邪恶势力。”朱德缓缓抬起头，声音依旧沉稳而有力：“亚历山大同志，你们苏联的困境我们理解，但中国同样经历了漫长的战争与磨难，我们的根基需要更加稳固，方能支撑起国家的未来。合作是可以谈的，但必须建立在互相尊重与平等的基础上。”瓦西里耶维奇立即点头，表情中没有丝毫的犹豫。他知道，中国的独立与尊严是他们外交策略中的第一要素。当然，主席，您的立场我们完全理解。我们并不希望在任何时候让中国失去独立的选择权。”瓦西里耶维奇强调，“我们苏联的目标十分明确——那就是彻底终结法西斯四十载的暴政，保卫社会主义阵营。而在这个过程中，我们希望能得到中国的支持。”朱德沉默片刻，似乎在思索这个提议的可行性。\n“你们的目标，与我们中国的立场相一致。我们同样反对法西斯主义，支持各国人民的解放。”朱德的声音铿锵有力，“在战后，亚洲的秩序必须由亚洲人民自己来主导，我们不希望看到任何大国在这一地区试图压迫我们。”\n“这点我们非常清楚，主席。”瓦西里耶维奇认真说道，“苏联也绝不会试图改变亚洲的现状。我们的目标始终是与中国共同对抗法西斯，在战后建立起更加公平和公正的国际秩序。......”\n接下来的谈话中，双方围绕军事合作、领土主权以及资源分配等问题展开了深入讨论。苏联方面就领土问题表示，唐努图瓦和外蒙古苏占部分将归还中国；对于外东北，苏联放弃对其的宣称，尊重中国的领土完整。随着谈话的深入，双方最终达成了初步的合作框架——中国将派遣志愿军支援第二次西俄罗斯战争，而苏联则提供先进的军事技术与物资支持。同时，双方还商定了未来的经济合作与文化交流计划，确保两国在战后建立长期且互利的关系。\n会谈接近尾声时，朱德站起身，向瓦西里耶维奇点了点头，声音依旧温和而坚定：“中国愿意为全球的和平作出贡献。我们希望，在这条路上，我们与苏联可以始终并肩前行。”瓦西里耶维奇深深鞠了一躬，语气真挚：“主席，我们相信，在您的领导下，中苏两国的合作不仅会终结法西斯暴政，更会为未来的世界带来更加公正和平的秩序。”外交官们离开了朱德的办公室，心中都明白，今天的会谈不仅仅是一次外交交流，它标志着两个最能代表社会主义阵营的大国，终于在共同的敌人面前，找到了合作的道路。"
 CPC_RUS.1.o: "未来的世界，或许将会因为这一历史性的决定而变得不同。"
 CPC_RUS.2.t: "北方来客"
 CPC_RUS.2.desc: "一辆绿色军用车缓缓驶入中南海的院内，车内坐着几位身着深色服装、面色严肃的苏联外交官。车门打开，外交官们陆续走出车厢，举步维艰地穿过那些庄严的红墙与古老的树木，向朱德的办公大楼走去。尽管他们之间并没有说话，但空气中弥漫的紧张感已昭示了这次会晤的重要性。亚历山大·瓦西里耶维奇便是此行的领头人。在进入接待室后，他的目光一扫，就看到了朱德主席。朱德主席早已在办公桌旁坐下，身穿中山装，眉宇间透露出一种历经岁月洗礼的坚毅与深沉。尽管他年事已高，但他的眼神依然充满了智慧与远见。与朱德同在的还有一些中共高层领导，他们准备聆听来自苏联的外交提案。瓦西里耶维奇和其他外交官齐齐鞠了一躬，表示敬意。随后，瓦西里耶维奇起身，开始了这场意义重大的会谈。\n“朱德主席，”瓦西里耶维奇的语气带着几分敬畏，“我们苏联深知，在世界格局发生剧变的今天，中国是我们最为重要的战略伙伴。正如您所知，德国法西斯不仅仅威胁到欧洲的安全，更危及全球的和平。我们希望得到中国的帮助，共同抵抗这一邪恶势力。”朱德缓缓抬起头，声音依旧沉稳而有力：“亚历山大同志，你们苏联的困境我们理解，但中国同样经历了漫长的战争与磨难，我们的根基需要更加稳固，方能支撑起国家的未来。合作是可以谈的，但必须建立在互相尊重与平等的基础上。”瓦西里耶维奇立即点头，表情中没有丝毫的犹豫。他知道，中国的独立与尊严是他们外交策略中的第一要素。当然，主席，您的立场我们完全理解。我们并不希望在任何时候让中国失去独立的选择权。”瓦西里耶维奇强调，“我们苏联的目标十分明确——那就是彻底终结法西斯四十载的暴政，保卫社会主义阵营。而在这个过程中，我们希望能得到中国的支持。”朱德沉默片刻，似乎在思索这个提议的可行性。\n“你们的目标，与我们中国的立场相一致。我们同样反对法西斯主义，支持各国人民的解放。”朱德的声音铿锵有力，“在战后，亚洲的秩序必须由亚洲人民自己来主导，我们不希望看到任何大国在这一地区试图压迫我们。”\n“这点我们非常清楚，主席。”瓦西里耶维奇认真说道，“苏联也绝不会试图改变亚洲的现状。我们的目标始终是与中国共同对抗法西斯，在战后建立起更加公平和公正的国际秩序。......”\n接下来的谈话中，双方围绕军事合作、领土主权以及资源分配等问题展开了深入讨论。苏联方面就领土问题表示，唐努图瓦和外蒙古苏占部分将归还中国；对于外东北，苏联放弃对其的宣称，尊重中国的领土完整。随着谈话的深入，双方最终达成了初步的合作框架——中国将派遣志愿军支援第二次西俄罗斯战争，而苏联则提供先进的军事技术与物资支持。同时，双方还商定了未来的经济合作与文化交流计划，确保两国在战后建立长期且互利的关系。\n会谈接近尾声时，朱德站起身，向瓦西里耶维奇点了点头，声音依旧温和而坚定：“中国愿意为全球的和平作出贡献。我们希望，在这条路上，我们与苏联可以始终并肩前行。”瓦西里耶维奇深深鞠了一躬，语气真挚：“主席，我们相信，在您的领导下，中苏两国的合作不仅会终结法西斯暴政，更会为未来的世界带来更加公正和平的秩序。”外交官们离开了朱德的办公室，心中都明白，今天的会谈不仅仅是一次外交交流，它标志着两个最能代表社会主义阵营的大国，终于在共同的敌人面前，找到了合作的道路。"
