 SE_SINO_RUSSIA_WAR_D: "但是，任何方面的横逆如果一定要来，如果欺人太甚，如果实行压迫，那末，共产党就必须用严正的态度对待之。这态度就是：人不犯我，我不犯人；人若犯我，我必犯人。\n-毛泽东"
