#老挝禁毒
 LAO_LPDR.2.t: "斩除毒草"
 LAO_LPDR.2.desc: "尽管华南局的报告中早有提及，但当东革盟的援助组抵达时，还是震惊于老挝鸦片种植的泛滥。前王家陆军带头种植罂粟，侵占大量耕地，带来饥荒，高级军官吃得满脑肠肥，基层被腐蚀得不成样子。。。。好吧我暂时写不下去了（）"
 LAO_Legacy_of_Thai_Cambodian_War: "泰柬战争的余波"
 LAO_Legacy_of_Thai_Cambodian_War_desc: "对于老挝而言，出兵柬埔寨也许并不是一个明智的选择。战争将会波及到大量边境村庄的稳定与安全。泰老战争与苏发努冯政变带来的代价是，老挝将永远失去日本的援助与共荣圈的盟友，但在东亚大革命的浪潮之下，这些代价可以暂时搁置一旁————\n\n§R帝国主义与共产主义之间必有一战。而老挝，选择了共产主义§。"
#决议组
 CPC_Mon_Mfn_help_dec: "对蒙援助"
 help_with_mfn_dec: "支援蒙古内战"
 infrastructure_construction_dec: "基础设施援建"
 infrastructure_construction_dec_desc: "外蒙经济想要更一步，铁路建设必须跟上，虽然这需要大量的投资，但外蒙丰富的矿产资源足以覆盖这些投入，可以让铁道部与蒙古方面合作，建立一个个国营采矿局，用采矿收入来弥补铁道部的前期投入。"
 CPC_Mon_Mfn_help_dec_desc: "当前版本，本决议在正常游戏均可使用(防三灾除外)。决议冷却期延长至60天"
 mine_craft_dec: "矿产普查"
 mine_craft_dec_desc: "在调查员的勘探下，我们发现外蒙古的采矿业有着不错的前景。或许可以以此为契机，进一步增强我们与外蒙古的联系，并为国防阵线提供更优秀的工业原料。"
 fang_san_zai_desc: "“白灾”、“黑灾”和“黄灾”对草原的危害极大。外蒙地区应建设饲草场与棚圈；完善水利设施；种植固沙植被、围栏封育，修复草场。合理控制载畜量，推行轮牧休牧，提升灾害预警与应急处置能力，综合防控草原。"
 fang_san_zai: "防范“三灾”"