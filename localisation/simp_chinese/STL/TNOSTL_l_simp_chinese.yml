 Eurasia_National_Revolutionary_League: "欧亚民族革命同盟"
 ANRL_Leader_SOV: "中苏友好同盟条约缔约国"
 ANRL_Leader_SOV_desc: "核心领土防御：§G+10%§!\n投降界限：§Y100%§!\n\n俄罗斯大地在被德国法西斯铁蹄侵略后分裂了二十余年。在苏联宣布无条件投降二十年后，俄罗斯终于重归于一面红旗之下————共产主义。现在，新生的俄罗斯正在准备对德国发起第三次战争，以收复故土。\n\n然而，凡事并不是一帆风顺。仅凭俄罗斯自己的力量无法击败大日耳曼国。自革命烈火中诞生的新国家需要团结一致，抵御帝国主义随时到来的入侵。东方的中国共产党集合亚洲各国共产党齐聚越南，共同签署《河内协定》，成立了亚洲民族革命联盟。《中苏友好同盟互助条约》签订以后，俄罗斯正式加入了此联盟，“亚洲民族革命联盟”也改名为“欧亚民族革命联盟”\n\n§x“所有受到帝国主义侵略、控制、干涉和欺负的国家和人民联合起来，打倒我们共同的敌人！”§"
 ANRL_Leader_SOV_effect: "[!ANRL_Leader]"
 RUS_CPC_treaty_of_friendly: "《中苏友好同盟互助条约》"
 RUS_CPC_treaty_of_nap: "《中俄互不侵犯条约》"
 RUS_cpc_supports: "向北京"
 RUS_cpc_supports_desc: "在东方，我们的中国同志推翻了日本法西斯的压迫，成功完成了人民革命。因此，我们将与中国同志建立友好关系，以学习其革命经验。"
 RUS_have_a_talk_with_cpc: "看向南方"
 RUS_have_a_talk_with_cpc_desc: "中国共产党已经成功在日本人手中夺取了东亚各国。现在中国已经完成统一，东南亚的国家大多数也在中国共产党的势力范围内。在这种情况下，如果我们想重新夺回中占远东地区，我们最好态度诚恳地询问中国政府的态度。"

 
 #风味事件链 - 小毛归乡
 STL_CPC_main_story.1.t: "惊梦"
 STL_CPC_main_story.1.desc: "“主席，毛主席，快回来啊，您快回来啊，我们都在这等您呢，主席，毛主席......”嘈杂的呼喊声逐渐汇聚在一起，变成了震耳朵哭声，这种直冲大脑的哭声让人发狂。喘着粗气猛然惊醒，毛泽东慌忙地环视四周，在意识到刚才的一切只是梦境之后，他长长的吐了口气。\n\n梦中的细节渐渐淡出了毛泽东的脑海，看着眼前熟悉的环境，擦了一把额头的冷汗，毛泽东坐了起来，虽然他才睡了不到三个小时，但是此刻已经睡意全无了，就这样坐在床上发呆。坐了一会之后，毛主席从床上小心翼翼的下来，披上一件大衣，悄悄地打开门，坐到了门外面。\n\n“主......”在外面站岗的警卫员看见毛主席坐到了门口，想要让他进屋，不过被毛主席赶紧摆摆手制止了。“我在屋里面睡不着，出来吹吹风，不打紧，过一会就进去。”“主席，外面太冷了，您还是进屋吧。”警卫员还在一边劝着。\n\n“进屋，进屋，等我抽完这支烟，我就进去。”毛主席从口袋里摸了半天，掏出来半截烟头，这是他早上还没抽完的烟头，不能浪费了，划了根火柴，主席就蹲在门口抽起烟来。警卫员也知道毛主席的脾气，硬劝也没有用，就站在旁边帮主席挡风。主席一支烟头还没抽完，屋门再次被打开，警卫员马上立正站好，朝着走出来的女人敬了个礼。\n\n“早点休息吧，你是整个西北的主心骨，平叛进展不是很顺利吗？西北的这些困难，很快就会熬过去的。”毛主席每天都要工作到深夜，而且人老了精神状态不怎么好，马上八大就要召开了，主席忙的事情就更多了，所以睡眠质量也变得越来越差。吃下安眠药之后毛主席又重新躺在床上，药劲上来，主席的困意也上来了。\n\n“岸英现在应该都四十了，时间真快啊。”主席迷迷糊糊说了一句，重新睡下，在主席的记忆里面，当年延安一别之后他还是一个只有二十多岁的小伙子，一转眼又二十年过去了。在苏德战争时期，毛岸英志愿参加了装甲师与德国人作战，不过在莫斯科惨败之后，毛泽东就彻底失去了他这个儿子的消息。1922年出生的毛岸英到现在已经四十岁了。"
 STL_CPC_main_story.1.o: "当然，如果他还活着的话。"

 STL_CPC_main_story.2.t: "长路归乡"
 STL_CPC_main_story.2.desc: "“这地图不对啊，老王，你到附近看看这有没有人，我们是不是又走错了？“不可能，这地图是我花高价钱买来的，怎么可能错？”王仁杰把地图拿了过来，不过比划了半天也没有搞清楚这里是什么地方。“你花了多少？”“四瓶伏特加和两包子弹。”听着王仁杰这么说，赵宇叹了口气，他是真无语了，好家伙，这下真的亏大了。\n\n“王同志，你带几个同志到附近走一走，看看能不能找到老乡问问路，赵排长，你带着你们排在附近警戒，这土匪肯定是不止这么多，要注意不能被伏击。”一个中年军官走了过来，下达了接下来的命令，看来今天是走不了了，他们迷路了，也不知道什么时候走出去。\n\n“是！谢廖沙同志！”两个人敬了个礼，赶紧带着其他同志忙活了起来。看着他们远去的背影，毛岸英叹了口气，他离自己阔别将近二十年的家乡，越来越近了。故乡的山，故乡的水，随着海轮启航的汽笛声，对故土的思念被深深地埋藏在了毛岸英的心中。\n\n在异国他乡的日日夜夜里，毛岸英似乎很少回想起这一切，但每每午夜梦回之际，别离时咸湿的风都会再一次吹入他的脑海，提醒着他应当的归去。但是他回不去，同时也不能够回去，这里不仅仅是来自父亲的嘱托，有更多的是现实的因素，从法国马赛登陆，一路辗转进入伊万诺沃国际儿童院时，他也曾幻想过战争会快快结束，战争确实结束得很快，但却是布哈林领导下苏联的溃灭。\n\n在红军兵败如山倒的时候，他不得不跟随学院紧急转移至科斯特罗马，在动乱年代的求学生涯是格外艰苦的，毛岸英以他的毅力与决心支撑了下来，并且在接下来的几年中完成了全部学业，顺利毕业。然而，坏消息接踵而至，他得知日军强势的进攻摧毁了重庆最后的抵抗，民国政府停止了抵抗。他的父亲率领着军队继续向西转移，正在遭受多方势力的围剿，他不知道故乡究竟发生了什么事情，他的父亲此时又怎么样了，但只有一件事是确定的，他的故乡已沦入敌手。"
 STL_CPC_main_story.2.o: "他已无家可归。"

 STL_CPC_main_story.3.t: "长路归乡 (2)"
 STL_CPC_main_story.3.desc: "男儿立志出乡关，学不成名誓不还，埋骨何须桑梓地,人生无处不青山 。这是他父亲年轻时候的豪言壮语，毛岸英也深深的记住了这句话，青山处处埋忠骨，何须马革裹尸还。\n\n归家已无希望，毛岸英随即向西俄罗斯革命阵线申请入伍，并以连排级指挥员的身份参与了无数的地方低烈度治安冲突作战。作为一名战士，他需要战斗，同时他也知道自己是谁的儿子，作为一位中国的伟大革命者的儿子，他要证明自己究竟合不合格。\n\n1954年苏沃洛夫攻势发动时，他已升任步兵第八十八旅旅长，并以指挥全旅在北部战线的优异表现获得了近卫称号。遗憾的是，仅仅一支队伍的武勇永远于事无补，西俄罗斯战争以西俄罗斯革命阵线的战败瓦解而告终，毛岸英也对阵线内部的权力斗争深感失望，萌生去意。\n\n在伏罗希洛夫元帅的首肯下，毛岸英得以带着一部分原近卫步兵第八十八旅的指战员，以阵线外交使团的名义前往远东地区，寻求回国的办法。要从俄罗斯的一边到另一边并不容易，这次返回可不想来的时候那样容易了，这需要横跨苏联广阔的领土，而且这片土地上现在到处都是军阀和各种流寇，想要穿越过去并不容易。\n\n毛岸英发扬着他父亲那样的乐观主义精神，将这次冒险称作苏联长征，他要像他父亲当年一样，走一段自己的长征路。毛岸英迫切地想知道他的家乡发生了什么事情，这些事情只有自己到了远东才能了解。他的父亲究竟怎么样了，中国的土地究竟怎么样了？毛岸英已经做好了最坏的打算，大不了再来一场革命，只要他还活着，就绝对不会放弃一丝希望。\n\n长征是宣传队，长征是播种机，这是他的父亲留给他的经验，在前往远东的一路上，毛岸英的部队反而扩充了不少，在长征的路上，他们帮助当地的居民驱赶强盗和土匪，帮助他们修建房屋训练军队。这些行为让他们的故事广为流传，同时也有不少心怀理想的人被毛岸英和他的部队吸引，选择加入近卫军八十八旅。\n\n毛岸英深知这一路的艰辛与困苦，但是他不会放弃，革命要始终保持乐观主义精神，他只是默默地治理着这支来源复杂的连队，每天计算着行程，看看距离家乡还有多远，距离他的祖国还有多远。"
 STL_CPC_main_story.3.o: "家已经不远了。"

 STL_CPC_main_story.10.t: "长路归乡 (3)"
 STL_CPC_main_story.10.desc: "清晨的贝加尔湖腾起着薄薄的水汽，化成了太阳升起之前的雾霭。上乌金斯克那几盏用于照明的街灯一个接着一个熄灭了，这座城市刚刚从沉睡中醒来，不过有些人已经早早地忙碌了起来。\n\n近卫步兵第八十八旅的驻营地比起往常更加热闹，战士们一面拆除帐篷，一面热络地讨论着回国之后的生活，日常的生活秩序已经恢复，战争留下的伤痕正在被机械和劳动者的双手渐渐消除，他们今天要启程回国了。赵天俊激动地昨天一晚上都没有睡着，有很多的同志也和他一样，一晚上没有睡着，他们终于要回家了，长路归乡。\n\n为了可以尽快回到家乡，毛岸英下令轻装上阵，那些从一路带来的重武器很多都留在了布里亚特，多余的物资也留在了这里，他们只带够了够回去的物资，这也算是对布里亚特的援助了。轻装上阵，但是赵天俊可舍不得，他这一路上收集了很多东西，这些都是一路的纪念，他宁可少背两包子弹也要带着这些。\n\n看着赵天俊在那里忙来忙去，宋救生不想说什么，很奇怪的是，对归乡感到兴奋的大部分都是年轻人，他们中的有些人出生的时候大战都已经结束了，除了样貌是中国人之外，可以说他们已经和中国还无关联了。八十八旅还有很多的中俄混血，他们的父亲或者母亲是早年间留学苏联的学生，因为卫国战争爆发的很迅速，这些人有很多都倒在了战场上，特别是第二次西俄罗斯战争。\n\n队伍里有很多人其实都不算中国人了，但是他们对归乡这一词有着非常浓厚的感情，比他们这些老人的感情还要深重，正因为未知而渴望，他们不知道现在中国的样子才对回乡有着强烈的感情。\n\n归乡，不仅仅是生者的救赎，还有逝者的寄托，这一路上八十八旅不是没有损失，偷袭，疾病，这些困难都带去了很多人的生命，但是毛岸英也要带着他们回家，这是他在西俄罗斯启程时候的誓言，一定要把所有人带回去。\n\n几辆专门的卡车装着逝者的骨灰，还有些人当时来不及处理只能携带者他的身份标识回去，这一次的远东苏维埃内战里面，也有很多的同志牺牲，他们倒在了离家最近的地方，这些逝者是真正的勇士，是一群真正的战士。\n\n毛岸英有时候甚至感觉自己有些自私了，毕竟他们已经帮助了俄罗斯人这么久，还在这里为他们流血，不过就算是再来一次，他们应该还是会做出同样的选择。\n\n为共产主义事业奋斗的战士，哪里有压迫，哪里就会有他们，毛岸英现在能做的就是带着这些逝者的寄托，把他们安葬在故乡的黄土里。"
 STL_CPC_main_story.10.o: "“我带你们回家了。”"

 STL_CPC_main_story.11.t: "长路归乡 (4)"
 STL_CPC_main_story.11.desc: "“从这里向南出发，到时候会看到一个雷达站，看到那个雷达站就说明距离人革委不远了，我在来的时候已经向华西列夫斯基元帅说明了，等我们过去之后会有专门的人迎接。”\n\n勃列日涅夫向萨布林说着要注意的事项，萨布林在处理好国内的一些事情后也选择和毛岸英一起前往西北，远东苏维埃之前一直是工业品的出口国，现在经过战争之后有很多工厂都被破坏了，变成了一个进口国。\n\n想要快速恢复生产，萨布林还需要西北的帮助，现在现的远东苏维埃百废待兴，他们可没有时间等待。布劳恩没有和萨布林一同前往，一个是他还是认为自己在中国犯过错误，不应该过去，另一个则是现在的远东苏维埃还需要有人坐镇，萨布林前往西北，这里必须要有人留下来处理工作。\n\n勃列日涅夫要带着人离开，马尔赫耶夫还有些舍不得，他们很合得来，在离开之前马尔赫耶夫还送给了勃列日涅夫一箱子酒，不过勃列日涅夫最喜欢的还是闪闪发光的勋章，在布里亚特他还获得了一枚胜利勋章，这对他来说就像收集全成就那样快乐。\n\n返回祖国，毛岸英现在还有些紧张，因为除了带着部队回去之外，他这次回去还要去“见家长”，跟萨布林的交谈中毛岸英得知他的父亲还活着，这是当时他知道的最大的一个好消息，父子终于能见面了。\n\n刘思齐说她的父亲是西北的一个小干部，毛岸英并没有告诉她他的身世，这回去之后那可是还有很多的事情要处理了，一想到这毛岸英就觉得头疼，只能走一步看一步了。\n\n真正返回故乡，他们的速度反而慢了下来，或许这也是因为天气的原因。在西伯利亚这片土地他们的部队已经行动数日，开始的几天他们乘着卡车速度还挺快，但是这里的基建水平太差了，连一条像样的路都没有，只有因为人们长期行走踩出来的一条路，世界本没有路，踩得人多了便有了路。\n\n因为天气原因，这种路变得极其湿滑，卡车常常会卡在路上，这让大家不得不下车推行，幸好之前把重装备留在了布里亚特，不然就只能白白丢在这个地方了，萨布林这一路上也领略了很多，看到了远东的全貌。\n\n除了伊尔库兹克，上乌金斯克和几个大城市之外，其他的地方好像还活在沙俄时代，低矮的房屋，牧民贫困的生活，这一切说明现在的情况并不像萨布林想象的那样好。"
 STL_CPC_main_story.11.o: "“我一定要改变这一切。” "

 STL_CPC_main_story.12.t: "长路归乡 (5)"
 STL_CPC_main_story.12.desc: "俄罗斯再统一的目标只能暂且放在一边，现在更重要的是恢复和提高人民的生活，否则统一之后是更加彻底的崩坏。毛岸英曾听过红军过草地的故事，他本以为其中的许多内容都是后来人的添油加醋，但现如今的情况与传说相比也有过之而无不及了踩在润湿的草甸上，每一步都小心翼翼，每一步都不可避免地沾上更多淤泥，每一步都比上一步更加沉重。\n\n毛岸英与几位指挥员登上了高处，规划着行军的方向。哪里有简易的道路，哪里有村庄和人影，哪里可供辎重车通过，哪里是容易积水的沟谷....勃列日涅夫骑着马欢呼着跑过来，他已经和蒙古取得了联系，归乡的第一个目的地到了，华西列夫斯基元帅和高岗正在亲自等待着他们。天色逐渐暗了下来，毛岸英率领的八十八旅也暂时驻扎在了乌兰巴托。\n\n对于八十八旅来说，这已经是他们不知道多少次的寄人篱下了，在这一路上八十八旅遭遇了一系列的挫折，有无数势力都对这一支庞大的军团动过心思，尽管家好像更近了一步，但是依旧远在天边。\n\n休息的时间比较的紧迫，没有什么时间准备精致的伙食，不过盐还是有的，反正大家一路上也是有什么吃什么，八十八旅的战士从大货车里面把罐头什么的抬出来，马上就要到祖国了，等回了祖国这些东西就没有这么重要了，还不如趁早吃了，不然带着也重。\n\n战士们围在火堆吃着烧烤，酒精打破了两边的隔阂，听到这边开宴会，勃列日涅夫倒是也贡献出来自己一箱子酒。一些稍有醉意的人正在互相比试力量，其他的人则一边慢慢的吃着，一边和人聊天这时，几名战士搬来了乐器，大家就这么唱了起来。一路上八十八旅克服了种种困难，现在里家乡越来越近，所有人的心也放松了下来，毕竟马上就要到家了。"
 STL_CPC_main_story.12.o: "“故乡就在前方！”"

 STL_CPC_main_story.13.t: "长路归乡 (终)"
 STL_CPC_main_story.13.desc: "旧时的道路虽然疏于维护，但还是比从布里亚特到乌兰巴托的草甸好走多。“前面就是西北的地界了。”在西北，他们终于不用提心吊胆的活着，这里很安全，而且远离饥饿。\n\n“同志们，我们到了，再往前走，我们的脚下可就是祖国的土地了！”毛岸英这么一喊，有很多士兵都从卡车上跳了下来，这段路，他们要亲自走，踏上归国的第一步。赵天俊和其他战士一样跳下车，他本以为自己会哭出来，会笑起来，或者大声欢呼起来，但是赵天俊什么也没做，他只是静静地踏入了祖国的领土，和其他战士一样，然后继续向前走。\n\n“联系这里的电台，同志们，打上我们的旗帜，我们回来了！”八十八旅的旗帜被打出来，一起被打出来的还有一面大旗，上面是用汉字写着的两个大字——“归乡”。边防的哨所很快就得知了消息，他们之前也听说了有一支军队会从边界过来，那是他们的部队，赵伟明很快派人过去调查，在核实了身份之后立即向西安发去了信息，这一支传奇的部队回来了。\n\n“主席，布里亚特的同志到了，还有就是那支八十八旅的队伍来了，他们已经到西安了，刘思齐同志也回来了，主席要不要去见见？”一名军官跑过来向主席汇报起来，这一定要去看看，是哪个好小子把他的女儿给“拐跑了”。\n\n作为刘思齐的干爹，毛泽东自然是要见见这位在传说中频频出现的女婿，这个人究竟长什么样子？从布里亚特过来，这位和刘思齐一起返回的英雄可是也带着一支规模不小的部队呢。不过主席现在并没有着急去见，人家刚回来，自然是要先单独相处一会，不过主席心里面也着急，在这种矛盾心情之下，总理就看见主席一直在原地转圈圈。\n\n“老毛，不要着急。能从俄罗斯一路过来，谢廖沙同志一定是一个坚毅的战士，我想也是因为这一点刘思齐同志才会选择跟他在一起的。”总理给了一个比较中肯的回答，他也没见过这个从俄罗斯来的同志，总理现在还觉得这个人应该是一个中俄混血，估计是在那边亲人去世之后知道了什么，然后才回国的。\n\n“岸英没了消息之后，我一直把思齐当成亲女儿对待，她是烈士的孩子，今年也三十多了，是应该找一个好人家，我也相信她的判断。”这说来说去，说到底就是主席现在还是不怎么放心，毕竟这发展的太快了，有没有一个月的时间就好上了，毛主席刚刚得到消息的时候都傻了，这才过去不到一个月就让别人给“拐”了。主席也没有见过这位从俄罗斯来的同志，他还没有把关呢，所以总有些不太放心。"
 STL_CPC_main_story.13.o: "“恩来，你跟我一起过去看看。”"

 STL_CPC_main_story.14.t: "老父亲的愁思"
 STL_CPC_main_story.14.desc: "“我？我就不去了吧，发改委那边还有事情要安排，我得去看看，我去叫小孙来，主席让他去吧。”“发改委那边的事情有聂荣臻，也不是急着要你，小孙也陪着去。”\n\n“主席，西安南边又准备新建一家厂子，要不要过去看看。”就在主席拉着总理要走的时候，刘少奇同志有些不解风情的过来向主席说了厂子的事情，最近西北倒是又多添了好些厂子，要是这样能够保持下去，那他们就不用对外产生工业依赖了。\n\n“少奇啊，那个..西安南边的施工状况，这个我也不是专业的，看不看也没有什么影响，你下午没有事情的话，就帮着我去看看吧。”毛主席找个理由推脱了，善解人意的刘少奇一眼就看出老毛这家伙就是在明示自己快点滚，这厂子又不是他看一眼就能建好的，主席现在可是忙着去见女儿呢。\n\n“哎个妈妈的.....”白跑一趟，少奇同志儒雅随和的离开了，总理跟着毛主席很快就到了会议室，刘思齐和他们未来的女婿都在里面，这种事情是主席的家事了，总理自然也很识趣的到一边待着去了。\n\n“老毛，我知道你在担心什么，其他人对这个从俄罗斯过来的小伙子都给了很高的评价，那个八十八旅的战士，我也遇见了几个，都是很好的人，他手底下的战士们纪律都这么好了，那人肯定不差，这个你就不用担心了。”毛主席能听见会议室里面那些凯旋而来的战士们的喧闹声，心里想的是他的女儿是胖了，还是瘦了?在布里亚特的这段时间里究竟怎么样？\n\n正好这个时候刘思齐从里面走了出来，她并没有告诉毛岸英她的父亲的正式身份，只是说是一个西安的小干部，这下要见面了那肯定是要说真话了，她怕里面一时间接受不了，在主席去见之前要先和他们说一说。看见刘思齐出来，主席从位子上起来前前后后看了一圈，在联系不上毛岸英之后，主席就很怕失去。\n\n主席绝对不是一个冷酷的革命者，相反的，毛主席是个很感性的人，以至于他曾说过，自己最怕敌人在他面前磕头喊饶命，看到磕头他心就软了。身边已经有很多的亲人朋友和战友为革命事业牺牲了，对于这些人的感情，主席只是嘴上不说。\n\n毛主席三弟牺牲的时候戴着的那个帽子，主席现在还挂在床边，主席一个人的时候，喜欢看着那个帽子抽烟，一坐可能就要好几个小时。"
 STL_CPC_main_story.14.o: "“我跟谢廖沙同志说我爸爸是西北的一个小干部，现在还没有告诉他。”"

 STL_CPC_main_story.15.t: "相见"
 STL_CPC_main_story.15.desc: "主席一听刘思齐这么说就明白过来了，就是他现在暂时还不能进去，整个西北到处挂着的都是主席的画像，他这一进去不久暴露了？“让你周叔叔先进去吧，说明白了我在过去。”\n\n“老毛啊，我先进去看看情况，你在外面等一会也不用着急，”“着急？我不急，我可是一点也不急。”说完就眯着眼好像要睡觉一样。”我先睡一觉，等你们聊完了，我大概也睡醒了。”总理笑着叹了口气，跟着刘思齐一起进去了，里面的喧闹声也停了下来，估计里面也知道是什么情况了，不一会那些八十八旅的军官们就一起出来了，留着地方让几人聊天。\n\n“小孙，你搬一个椅子过来，快点。”孙林远不知道主席是什么意思，赶紧把椅子搬过来，主席把椅子放在墙边，然后站了上去，因为门上面是一块玻璃，虽然听不见，但是能看见里面的情况，主席也想看看这个女婿长什么样子。他这一上去不要紧，这倒是把孙林远吓了一跳，这要是摔着了那还得了了？“主席，你快下来，这要是被李部长看到，他不得把我枪毙了！”孙林远压低了声音对主席说道。\n\n“那你现在赶快出去，这样就没人知道了。”听着主席这样说话孙林远一阵心酸，那也没办法，他只能站在主席后面扶着凳子，这要是摔着了十个他绑一块毙了都不够。主席悄悄的把头探了出来开始暗中观察，第一眼就看到了刘思齐坐在靠后的几排，而她的身边是一位英俊的军人。”唉，孩子大了，留不住了。”主席想道。\n\n“也不知道恩来问了些什么，我倒是得把把关。”他再次把头探进去，不错，结实的身板，宽阔的肩膀，成熟稳重的体态，整个人透露出一股和他年龄不匹配的老成，这应该是在长期的战斗中练成的，难怪刘亚楼也会对他如此的欣赏。\n\n刘思齐牵着他的手，热恋期的两人这么大大方方的坐着，年轻人穿着一身苏联的军校学员装，衣服有些破旧，却挂着不少的勋章。总理看着眼前的这个人觉得有些眼熟，但是具体的又想不起来了，毕竟已经过了将近二十年，现在的毛岸英连中国话说的都不太流利了。"
 STL_CPC_main_story.15.o: "“周叔，我是岸英啊。”"

 STL_CPC_main_story.16.t: "喜剧"
 STL_CPC_main_story.16.desc: "毛岸英从口袋里面掏出了一张照片，这是他和父亲的合影，他并没有告诉刘思齐其实自己的父亲是现在的西北领导人毛泽东。“老毛，你看谁回来了！”虽然感觉非常熟悉，而且长得很像，但是他不确定是不是一个人，这下可以肯定了，这个人就是毛岸英啊！“爸，岸英他回来了！”刘思齐跑出屋子告诉主席，主席听完明显也愣住了，里面坐着的居然是毛岸英，失联了将近二十年，他居然回来了！“真的是岸英？”主席的声音有些颤抖，他也不敢相信自己的孩子会以这样的方式回来，这有谁能够想到？父亲走了一遍长征，儿子又走了一遍，他也不知道怎么描述这样的传奇故事。主席快步走了进去，看见了坐在椅子上的毛岸英，正好毛岸英也看到了主席，双方显然都没有做好准备，一时间怔住了，就这样看着对方。“岸英？真的是你？你回来了？”主席的声音依旧在颤抖着，他还是不敢相信自己的儿子居然还活着，二十多年了，这二十多年足以让一个老人流干眼泪。总理和小孙自然不能破坏这样的氛围，静悄悄的离开了，只是他们还是觉得不可思议，居然会发生这样的事情，简直太神奇了。这个故事也太传奇了吧？岸英找到了爸爸，思齐拥有了爱情，老毛找到了儿子。很快这个消息就在西贝传开了，八十八旅，这支英雄部队的指挥是毛主席失联了二十多年的孩子毛岸英，他还活着，而且活成了主席的骄傲。毛岸英曾在无数个夜晚问过自己，身为这位领导人的孩子，自己合格了吗？而今天主席用非常肯定的语气回答他。"
 STL_CPC_main_story.16.o: "合格了，甚至比他还要优秀。"

 STL_AnYing_LFB_tt: "若在抗日战争中父亲以身殉国，近卫步兵第八十八旅及毛岸英§x独自成长§!的剧情内容，也许会在§R《新秩序：光自贝加尔湖来》§!的时间线展开......\n 毛岸英 加入 £TNO_game_rule_flag_CPC 西北国防阵线。"

