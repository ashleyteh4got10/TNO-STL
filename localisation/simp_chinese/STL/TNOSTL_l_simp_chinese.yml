 SWRWTER_lake_baikal_civil_war_name: "£TNO_game_rule_flag_BRY £TNO_game_rule_flag_IRK 贝加尔湖内战"
 SWRWTER_lake_baikal_civil_war_default: "AI随机"
 SWRWTER_lake_baikal_civil_war_bry_name: "£TNO_game_rule_flag_BRY 理想主义之胜利"
 SWRWTER_lake_baikal_civil_war_bry_DESC: "随着贝加尔湖畔最后一颗子弹射向亨利希·亚戈达，瓦列里·萨布林领导的£TNO_game_rule_flag_BRY 布里亚特苏维埃社会主义自治共和国成功战胜了最高苏维埃主席团，并一扫亚戈达的高压统治，在贝加尔湖两岸奉行他所认为正确的“理想主义”，即便如此，其一统苏联的道路并不会一片通途。"
 SWRWTER_lake_baikal_civil_war_irk_name: "£TNO_game_rule_flag_IRK 实用主义之凯旋"
 SWRWTER_lake_baikal_civil_war_irk_DESC: "随着贝加尔湖畔最后一颗子弹落在瓦列里·萨布林的身上，亨利希·亚戈达宣布£TNO_game_rule_flag_IRK 最高苏维埃主席团成功镇压萨布林所领导的叛乱势力，在贝加尔湖两岸继续奉行他所认为正确的实用。即便如此，其一统苏联的道路并不会像镇压叛乱一样一片通途。"
