 #归乡事件链 - 长路归乡
 STL_CPC_main_story.1.t: "北麓飞书"
 STL_CPC_main_story.1.desc: "阿拉木图，哈萨克最大的城市，宛若天山脚下的一颗明珠。薄薄的云雾覆盖在山脉上，如梦似幻。阳光洒在山峰的积雪上，散发出璀璨的光芒，跃然一幅绝美的画卷。\n\n办公楼里的谢尔盖整理完军队的杂务，便着手制定新的训练计划。“咚咚咚——”一阵急促的敲门声传来，“请进！”谢尔盖专注于案卷，头也不抬地说道。\n\n一个哈萨克小伙从门外钻了进来，是谢尔盖的朋友阿米尔。阿米尔嘴上带着笑：“谢尔盖，快看今天的报纸！”说着将手中的报纸递给了谢尔盖。\n\n谢尔盖纳闷地接过报纸，但硕大而清晰的标题即刻让人明白事情的重要性——\n\n§Y由共产党支持的内蒙古与蒙古人民共和国统一蒙古！§!\n\n自阔别将近二十年的家乡，对故土的思念被深深地埋藏在了谢尔盖的心中。在异国他乡的日日夜夜里，谢尔盖似乎很少回想起这一切，但每每午夜梦回惊醒之际，别离时咸湿的风都会再一次吹入他的脑海中，抚摸他归乡的愿景。"
 STL_CPC_main_story.1.o: "我该做点什么....."

 STL_CPC_main_story.3.t: "往昔"
 STL_CPC_main_story.3.desc: "从来到法国马赛，一路辗转进入列宁格勒军事政治学校学习时，他也曾幻想自己为革命效力。\n\n在卫国战争爆发时，他不愿只在学院里学习，而是加入苏联共产党保卫革命。在加入白俄罗斯第二方面军后，他勇敢地投身战斗。在卫国战争的年代里，时间格外艰苦，谢尔盖以他的毅力与决心支撑了下来，并在接下来的几年中不断磨炼自己。\n\n然而，坏消息接踵而至。布哈林领导的苏维埃社会主义共和国联盟在卫国战争中节节败退，局势如山倒。最终，他跟随叶戈罗夫元帅撤退到西俄罗斯革命阵线，跟随元帅一起为革命奋斗。\n\n在那场改变了他一生的西俄罗斯战争中，他勇猛指挥、奋勇杀敌。但由于革命阵线内斗，对德战事失利，加之西西伯利亚人民共和国领导人的离去，最终西俄罗斯战争功败垂成，西俄罗斯革命阵线崩溃。\n\n他由叶戈罗夫元帅首肯，率部队转战到哈萨克苏维埃社会主义共和国。谢尔盖知道革命不会失败，他不愿放弃，但与阵线相隔万里，心有余而力不足。"
 STL_CPC_main_story.3.o: "革命的火种绝不会熄灭"
 STL_CPC_main_story.5.t: "追忆"
 STL_CPC_main_story.5.desc: "刘思齐站在公寓窗前，望着远处被微风轻拂的街道，心中却早已陷入一片沉思。\n\n十几年前，她尚未离开这片土地时，这里还是一片黄沙，如今却已是鸟语花香。那时的她还很年轻，只知道跟随着那个沉默而坚定的人，迈向一个未知的未来。\n\n在苏联的那段日子里，那个人曾告诉过她，那里教会了他两件事——如何在苦难中坚持，以及如何在一片废墟中重新站起。而她也从未辜负过他的信任：从卫国战争的悲伤，到第一次西俄罗斯战争的惨烈，再到哈萨克草原上的平叛行动，她始终如一地陪伴在他的身边。\n\n这些年来，战争着实改变了许多人。那个曾经怀揣着书本与理想来到苏联的年轻人，如今已经成长为一名历经战火洗礼的指挥官。他不再轻易流露情绪，只会在每一次行动结束后，默默整理牺牲者的名单。\n\n刘思齐知道，他肩负的从来不只是自己的命运。\n\n“你有没有后悔过？”某个夜晚，她轻声问道。\n\n他沉默了许久，缓缓说道：“如果历史重新开始，我依然会选择这条路。”\n\n窗外，阿拉木图的钟声缓缓响起。\n\n世界依旧流转向前，但他们也都明白，属于他们这一代人的战争，从未真正结束。\n\n刘思齐轻轻握住他的手。无论未来通向何方，她都知道，自己都会继续陪伴这个从战争中走来的男人，直到世界尽头。"
 STL_CPC_main_story.5.o: "无论何方，你始终在我身旁”"
 STL_CPC_main_story.7.t: "战火中的爱情"
 STL_CPC_main_story.7.desc: "战争年代的爱情，其实从来不是发生在鲜花与掌声之中。\n\n那时候，伟大卫国战争仍在继续。他们身处莫斯科时，街头依旧能够看到炮火留下的痕迹。当刘思齐再次见到毛岸英时，他还只是一名年轻的军人，眼中闪烁着坚定的光芒。\n\n令刘思齐印象最深的，是毛岸英独自坐在角落里记录今天牺牲战士们的名字。他轻声说道：“因为……我觉得他们不应该只是报告上的数字，我总得做些什么。”\n\n他们的感情不是从浪漫开始的，而是在一场又一场战争中一点一点建立起来的。刘思齐见过他疲惫的样子，也见过他为了鼓舞士兵而强装镇定。\n\n一次战斗结束后，毛岸英受了伤，刘思齐守在他身旁整整一夜。\n\n“战争结束以后，你想做什么？”\n\n毛岸英沉默了很久，轻声说道：“如果还有机会，我想去建设一个没有战争的世界。”\n\n刘思齐只是默默握住了他的手。\n\n她知道，无论前路多么漫长，始终还有一个人陪伴着他。\n\n她叫刘思齐。\n\n她是他的妻子，也是他此生最深爱的人。"
 STL_CPC_main_story.7.o: "“她是我的一生的战友与挚爱”"
 STL_CPC_main_story.9.t: "模糊的记忆"
 STL_CPC_main_story.9.desc: "在哈萨克期间，谢尔盖凭借在卫国战争与西俄罗斯战争中展现出的出色能力，担任少将军衔，并帮助哈萨克苏维埃社会主义共和国平定了当地的混乱局面。\n\n但谢尔盖始终放不下他的故乡。他不知道家乡如今怎样了——在他为革命而战的时候，他的家乡也正遭受着日本法西斯帝国主义的侵略。后来他得知，日军的进攻摧毁了重庆最后的抵抗，重庆政府停止了抵抗。他的父亲率领军队继续向西北转移，正在遭受多方势力的围剿。\n\n他不知道故乡究竟发生了什么，他的父亲此时又怎么样了……但只有一件事是确定的——他的故乡已沦入地狱。\n\n谢尔盖无疑是痛苦的，他不愿抛弃自己的责任，但他仍是渴望故乡的游子，渴望见到亲人、渴望家乡的风、渴望见到家乡的土地。\n\n在得知如同死水的故乡爆出惊雷的消息后，他明白了：他要去进行再次革命，他要亲手拯救革命，拯救故乡的人民。"
 STL_CPC_main_story.9.o: "唯有死亡才是责任的尾声"

 STL_CPC_main_story.2.t: "长路归乡"
 STL_CPC_main_story.2.desc:  "“雄关漫道真如铁，而今迈步从头越”\n\n得到哈萨克的同意后，谢尔盖以哈萨克苏维埃社会主义共和国外交使节的名义，出发前往那遥远的故乡。\n\n要从哈萨克回到故乡并不容易。由于原苏维埃社会主义共和国联盟已经崩溃，苏联故土上军阀混战、土匪横行，这一路危险重重。他还需要横跨苏联广阔的领土，而这片土地上到处都是军阀和流寇。\n\n谢尔盖发扬着他父亲那样的乐观主义精神，将这次革命救国之路称作“长征”。他要像父亲当年一样革命到底。\n\n清晨的阿亚古兹上方闪耀着初晨的阳光，化成了朦胧的希望。队伍的驻营地比往常更加热闹，战士们一面拆除帐篷，一面热络地讨论着回国之后的生活。为了尽快回到家乡，谢尔盖下令轻装上阵，许多重武器和多余物资都留在了哈萨克。\n\n队伍里有很多中俄混血，他们对“归乡”有着比老人更强烈的感情。正因为未知，才格外渴望。\n\n归乡，不仅仅是生者的救赎，还有逝者的寄托。谢尔盖发誓，一定要把所有人——包括那些逝者的骨灰——带回故乡的黄土里。"
 STL_CPC_main_story.2.o: "“游子思念着遥远的故乡”"

 STL_CPC_main_story.4.t: "长路归乡 (2)"
 STL_CPC_main_story.4.desc: "“红军不怕远征难，万水千山只等闲”\n\n从这里向东出发，看到雷达站就说明距离人革委不远了——赛福鼎向谢尔盖说着要注意的事项。\n\n黄沙遍地的疆土，队伍向着克孜勒前进。基建极差，道路难行，卡车常常陷入泥泞，众人不得不下车推行。谢尔盖与几位指挥员登上高处，仔细规划行军路线：哪里有简易道路，哪里有村庄，哪里能通过辎重车……每一步都无比谨慎。\n\n历经跋涉，队伍终于到达科布多，进入了人民革命委员会的土地。\n\n勃列日涅夫骑着白马欢呼着奔来，他已与蒙古取得联系——华西列夫斯基元帅正在亲自等待他们。\n\n对于这支队伍来说，这又是一次寄人篱下。但家乡已经越来越近。战士们围在火堆旁吃着罐头，勃列日涅夫贡献出一箱酒，大家唱起了歌。\n\n谢尔盖得知了一个天大的好消息——他的父亲还活着。父子终于要见面了。"
 STL_CPC_main_story.4.o: "“前路虽艰，归心不改” "

 STL_CPC_main_story.6.t: "长路归乡 (3)"
 STL_CPC_main_story.6.desc: "旧时的道路虽然疏于维护，但仍坚实耐用。勃列日涅夫带领着队伍一路赶往乌兰巴托。\n\n与华西列夫斯基和德米德交谈后，谢尔盖更加清晰地了解了故乡如今的惨状：生灵涂炭，饥荒肆虐，伪政府与日本鬼子残酷欺压着中国百姓。这番谈话让谢尔盖心中更加坚定——唯有共产党才能救中国，唯有革命才能扫除一切反动派。\n\n乌兰巴托的夜晚让谢尔盖寝食难安，他站在简陋的营帐外，望着星空，脑海中不断浮现家乡父老在水深火热中的画面。如何才能尽快拯救他们？这个念头如同一团火，在他胸中燃烧。\n\n“接下来你们向南走就到西北国防阵线了，祝你们好运”德米德拍了拍他的肩膀说道\n\n“同志们，我们到了！再往前走，我们的脚下可就是祖国的土地了！”\n\n谢尔盖一声喊，许多士兵都从卡车上跳了下来。这段路，他们要亲自用双脚去丈量，踏上归国的第一步。赵天俊和其他战士一样，静静地踏入了祖国的领土，没有欢呼，没有眼泪，只是默默向前走去。\n\n“联系这里的电台，同志们，打上我们的旗帜，我们回来了！”\n\n一零九师的旗帜被高高升起，一面用汉字写着巨大“归乡”二字的横幅也一同展开。边防哨所很快得知了消息，他们早已听闻有一支传奇部队将从边界返回。赵伟明迅速派人核实身份，随后立即向西安发去了急电——\n\n这支历经千辛万苦的队伍，终于回家了。"
 STL_CPC_main_story.6.o: "“我们终是踏上了祖国的土地”"

 STL_CPC_main_story.8.t: "长路归乡 (终)"
 STL_CPC_main_story.8.desc: "西安的微风，带着黄土高原特有的苍凉。\n\n站在古老的城墙之上，刘思齐望着远处连绵起伏的山脉，忽然想起了许多年前在苏联的生活。不过，他们终究还是回来了。\n\n回到西北国防阵线后，他们来到了西安。这里是毛岸英的家，也是他多年未见的父亲所在的地方。\n\n当毛泽东再次见到自己的儿子时，两人都沉默了许久。\n\n“这些年，真是苦了你啊。”这是父亲沉默许久后说出的第一句话。\n\n毛岸英轻轻摇了摇头：“现在这个年代，总有人比我承受得更多。”\n\n毛泽东伸出手，轻轻拍了拍儿子的肩膀。\n\n刘思齐站在一旁，看着这一幕。\n\n这一刻，毛岸英不再是指挥官，他只是一个归乡的游子，一个终于回到父亲身边的儿子。\n\n一家人围坐在灯下，谈论着过去，也谈论着未来。"
 STL_CPC_main_story.8.o: "“父与子，终相逢”"
 STL_CPC_main_story.10.t: "平凡的日子"
 STL_CPC_main_story.10.desc: "这些日子，对于毛泽东而言，或许是许多年里难得的一段安宁时光。\n\n随着毛岸英与刘思齐返回西北，毛岸青与贺子珍也一同回到了西安。一家人终于再次团聚。\n\n毛泽东看着站在面前的两个儿子，沉默了很久，最终只轻轻说了一句：“欢迎回家。”\n\n晚饭时，他难得没有谈论工作，而是轻声询问孩子们这些年的经历。\n\n毛岸青说：“最难的时候，不是遇到困难，而是想家，却不知道什么时候才能回来。”\n\n毛泽东听着，默默低下了头。\n\n贺子珍的归来也让这次团聚有了更加特殊的意义。她淡淡地说：“都过去了。”\n\n后来，毛泽东常常和两个儿子一起散步，聊国家建设，也聊家庭琐事。\n\n刘思齐站在一旁，看着这一幕。她发现，那个在战场上冷静决断的毛泽东，在家人面前，也不过是一位普通的父亲。"
 STL_CPC_main_story.10.o: "迟来的团聚，弥足珍贵"
 STL_CPC_main_story.11.t: "幸福的一瞬"
 STL_CPC_main_story.11.desc: "西安的春天终于来了。\n\n刘思齐站在镜前，看着自己身上的婚服，心中有些恍惚。\n\n他们的爱情，一路走来，既没有鲜花与礼花，也没有浪漫的约会。有的只是漫长道路上的相互扶持，是寒冬里的一句问候，是无数次分别时那句“等我回来”。\n\n婚礼并不奢华，毛岸英坚持一切从简。许多战友和群众前来祝福。\n\n“想不到当年那个拿着枪冲锋的小伙子，也有今天。”老战友拍着毛岸英的肩膀笑道。\n\n夜晚，刘思齐和毛岸英站在城墙之上，望着万家灯火。\n\n“你还记得我们第一次见面的时候吗？”\n\n毛岸英点头：“记得。那时候，我没有想过，我们会走到今天。”\n\n他们都知道，未来不会永远平静，但至少此刻，他们拥有了一份难得的安宁。"
 STL_CPC_main_story.11.o: "“愿此生与你永不相离”"
 STL_AnYing_LFB_tt: "若在抗日战争中父亲以身殉国，近卫步兵第八十八旅及毛岸英§x独自成长§!的剧情内容，也许会在§R《新秩序：光自贝加尔湖来》§!的时间线展开......\n 毛岸英 加入 £TNO_game_rule_flag_CPC 西北国防阵线。"

 CPC_RUS.1.t: "北方来客"
 CPC_RUS.1.desc: "一辆绿色军用车缓缓驶入中南海的院内，车内坐着几位身着深色服装、面色严肃的苏联外交官。车门打开，外交官们陆续走出车厢，举步维艰地穿过那些庄严的红墙与古老的树木，向朱德的办公大楼走去。尽管他们之间并没有说话，但空气中弥漫的紧张感已昭示了这次会晤的重要性。亚历山大·瓦西里耶维奇便是此行的领头人。在进入接待室后，他的目光一扫，就看到了朱德主席。朱德主席早已在办公桌旁坐下，身穿中山装，眉宇间透露出一种历经岁月洗礼的坚毅与深沉。尽管他年事已高，但他的眼神依然充满了智慧与远见。与朱德同在的还有一些中共高层领导，他们准备聆听来自苏联的外交提案。瓦西里耶维奇和其他外交官齐齐鞠了一躬，表示敬意。随后，瓦西里耶维奇起身，开始了这场意义重大的会谈。\n“朱德主席，”瓦西里耶维奇的语气带着几分敬畏，“我们苏联深知，在世界格局发生剧变的今天，中国是我们最为重要的战略伙伴。正如您所知，德国法西斯不仅仅威胁到欧洲的安全，更危及全球的和平。我们希望得到中国的帮助，共同抵抗这一邪恶势力。”朱德缓缓抬起头，声音依旧沉稳而有力：“亚历山大同志，你们苏联的困境我们理解，但中国同样经历了漫长的战争与磨难，我们的根基需要更加稳固，方能支撑起国家的未来。合作是可以谈的，但必须建立在互相尊重与平等的基础上。”瓦西里耶维奇立即点头，表情中没有丝毫的犹豫。他知道，中国的独立与尊严是他们外交策略中的第一要素。当然，主席，您的立场我们完全理解。我们并不希望在任何时候让中国失去独立的选择权。”瓦西里耶维奇强调，“我们苏联的目标十分明确——那就是彻底终结法西斯四十载的暴政，保卫社会主义阵营。而在这个过程中，我们希望能得到中国的支持。”朱德沉默片刻，似乎在思索这个提议的可行性。\n“你们的目标，与我们中国的立场相一致。我们同样反对法西斯主义，支持各国人民的解放。”朱德的声音铿锵有力，“在战后，亚洲的秩序必须由亚洲人民自己来主导，我们不希望看到任何大国在这一地区试图压迫我们。”\n“这点我们非常清楚，主席。”瓦西里耶维奇认真说道，“苏联也绝不会试图改变亚洲的现状。我们的目标始终是与中国共同对抗法西斯，在战后建立起更加公平和公正的国际秩序。......”\n接下来的谈话中，双方围绕军事合作、领土主权以及资源分配等问题展开了深入讨论。苏联方面就领土问题表示，唐努图瓦和外蒙古苏占部分将归还中国；对于外东北，苏联放弃对其的宣称，尊重中国的领土完整。随着谈话的深入，双方最终达成了初步的合作框架——中国将派遣志愿军支援第二次西俄罗斯战争，而苏联则提供先进的军事技术与物资支持。同时，双方还商定了未来的经济合作与文化交流计划，确保两国在战后建立长期且互利的关系。\n会谈接近尾声时，朱德站起身，向瓦西里耶维奇点了点头，声音依旧温和而坚定：“中国愿意为全球的和平作出贡献。我们希望，在这条路上，我们与苏联可以始终并肩前行。”瓦西里耶维奇深深鞠了一躬，语气真挚：“主席，我们相信，在您的领导下，中苏两国的合作不仅会终结法西斯暴政，更会为未来的世界带来更加公正和平的秩序。”外交官们离开了朱德的办公室，心中都明白，今天的会谈不仅仅是一次外交交流，它标志着两个最能代表社会主义阵营的大国，终于在共同的敌人面前，找到了合作的道路。"
 CPC_RUS.1.o: "未来的世界，或许将会因为这一历史性的决定而变得不同。"
 CPC_RUS.2.t: "北方来客"
