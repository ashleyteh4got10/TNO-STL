 NEB_history.17.t: "1967-关于恢复东北根据地建设与扩大情报网的决定"
 NEB_history.17.d: "为配合未来解放斗争的需要，减少不必要的伤亡，经东北局讨论研究决定，恢复东北根据地建设并扩大现有情报网。在现有的海兰泡、庙街的基础上，恢复外东北根据地和黑龙江根据地；现有情报网要从大城市扩展到东北全境。这是未来解放斗争中的重要组成部分，是东北解放的重要一步，各单位应予以重视。"
 NEB_history.17.o: "[GetYear]年[GetMonth]X日"
 NEB_history.18.t: "1972-关于支援我人民解放军作战及完全解放东北的决定"
 NEB_history.18.d: "东北同志们、东北同胞们，日本帝国主义不甘心失败，在新中国成立后，竟妄想让伪满继续存在，将东北和华北一部从中国的领土中分割出去。这种不可理喻的要求，中国人民决不接受！党中央本着民本原则，希望东北少受战争破坏，但日本帝国主义的傲慢和狂妄葬送了这一切！它们妄想着让新中国吞下分裂祖国的苦果，妄想着让新中国对它们予取予求。中国人民从来不是甘受压迫的人民，中国人民对一切分裂祖国的行为和想法深恶痛绝。因此，解放东北已经不可能和平解决。\n\n昨日，中共中央已向东北局发布“中共中央关于解放东北的决定”“中央军委关于我人民解放军北上进军解放东北的决定”，现将文件下发到各机构。党中央要求我们配合人民解放军北上东北，彻底打垮日本帝国主义，打击日本帝国主义的嚣张气焰。同志们，这是亚洲人民解放战争的最后一战，我们已经站在了历史的关口，全中国乃至全世界都在看着我们，我们绝对要打好这一仗，要争取最大的胜利！经东北局讨论研究决定，东北局现在的主要任务，就是全力做好人民解放军的后勤支援工作，全力做好接收工作，做好难民识别工作等一系列占领区工作。在人民解放军的胜利高歌下，我们回家！"
 NEB_history.18.o: "决战号角，已经吹响"
 NEB_history.18.tt: "向§j日本帝国主义§!发动§x最后一击§!！"

 #民族精神
 NEB_ghost_army: "幽灵军队"
 NEB_ghost_army_desc: "对全中国来说，抗联早已随着苏联的解体而不复存在。然而，日本和伪满的动向却一再向着世人们宣告，一个幽灵仍然盘旋在东北上空。只有我们和我们的敌人，知道我们的存在。"
 NEB_insist_spirit: "东方星火"
 NEB_insist_spirit_desc: "曾经位于东方的燎原之势，早已随着中日停战和西安解放熄灭下去，但这意味着失败吗？不，这不意味着失败，我们便是东方最后的星火，是将一切反动燃烧殆尽的熊熊火焰。我们是火种，总有一天，中华大地将再次燃烧，这次燃烧，必将一切污秽燃烧殆尽！" 