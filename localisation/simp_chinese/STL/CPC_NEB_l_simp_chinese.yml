 NEB_Li_Zhaolin: "李兆麟"
 Li_Zhaolin_DESC: "出生于白山黑水之中的李兆麟见证了日寇是如何殖民东北的，当中国共产党在东北组建抗日义勇军的时候，他奋不顾身地投入其中，逐渐成为东北抗日组织中的核心人物。自苏联解体之后，日本夺取了外东北地区，李兆麟率领着东北的党组织在更加寒冷的外兴安岭里继续抵抗，但是，越抵抗黑夜越深，越来越看不到黎明，苏联的解体让远东的苏联红军无家可归，东北的光复遥遥无期，朝鲜的复国之路也彻底渺茫。但李兆麟知道，越是黑暗的时候，领导越是应该坚持自己的立场，成功时的英雄从来就不如失败时的英雄。李兆麟苦苦坚持，终于在那一天看到了黑夜中的闪电——日军折戟潼关。虽然东北的局面更加不利，但李兆麟由此再一次确认了，日本帝国主义终究是一只纸老虎！于是，李兆麟下定了决心，继续坚持下去，踏上回家的路。"
 Li_hero: "绝境旗手"
 NEB_Liu_Yalou: "刘亚楼"
 Liu_Yalou_DESC: "在抗日战争中前往苏联求学的刘亚楼怎么也想不到，自己竟然会来到东北抗联。作为少数的经历过长征的人，无论是怎样的逆境，难道还能比长征更困难？然而事实差点击碎了刘亚楼的认知，东北抗联所处的环境让刘亚楼充分认识到自己眼界的狭窄。吃穿不足，缺医少药这种家常便饭暂且不说，寒冷的天气才是最大的敌人。在南方，刘亚楼不必与天气作斗争，但在东北不行，厚重的积雪比泥泞的土地更加难以行走，低温又在剥夺体力，而为了驱逐寒冷又不得不生火，但这样反而会暴露行踪。在东北抗联的日日夜夜，让刘亚楼想起了三十年前那遥远的死亡之山，那里也是气候恶劣，风雪频繁。"
 NEB_Zhou_Baozhong: "周保中"
 Zhou_Baozhong_DESC: "东北抗联里面的南方人本来就很少，而周保中是其中更稀有的南方人——云南讲武堂毕业生。周保中的经历可以说是一部历史，一部关于党的历史——只不过是直到九一八事变之前——本应在苏联学习完毕就可以回到党中央的他，却因为九一八事变而不得不改变方向，周保中听从了命令，来到东北组织民众抗日救国。但好景不长，东北抗联一退再退，苏联解体，宁渝合流，一系列的打击让东北抗联处境艰难，队伍中的苏联红军无家可归，只得编入抗联队伍；而膨胀的队伍里，既有中国人，还有朝鲜人，又有苏联人。周保中意识到最艰难的时刻已经到来了，但黎明之前，永远是黑暗。黑夜又将持续多久呢？虽然无人知晓答案，但一定不再遥远。"
