 NEB_abstract_help_text: "在§x党中央§!的帮助下，东北局恢复了§Y东北地区§!的情报网。每座情报站可提供§G研究设施§!、§R教育§!、§B工业设备§!和§a医疗§!四种发展度，以及获取武器装备的每月加成，但由于资源有限，每座城市仅能给予一项加成。\n\n您可以点击§G左侧地图§!上非圆§W白点§!的标点，改变各个城市的§G重心§!，改变重心后的效果将在下一个月自动显现。\n\n需要看§x东北局总体情况§!请点击地图左上角的图标。"
