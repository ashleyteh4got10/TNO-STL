 NEB_mission_title: "£GFX_NEB_mission_title_icon    §Y[NEB_mission_title_loc]§!    £GFX_NEB_mission_title_icon"
 NEB_mission_1: "渗透大兴安岭"
 NEB_mission_1_tt: "[NEB_mission_1_tt]"
 NEB_mission_1_tooltip: "根据§x党中央§!的指示精神，我们决定在满洲里附近开辟并巩固根据地。如果可能，我们决定彻底控制大兴安岭。"
 NEB_mission_1_sub_1: "灯下黑"
 NEB_mission_1_sub_1_desc: "根据§x党中央§!的指示，§Y东北§!部队应该在§G满洲里§!附近建立新的根据地，经多方考察，§W扎赉诺尔§!距离§O满洲里§!不远，是理想的根据地。"
 NEB_mission_1_sub_2: "清除障碍"
 NEB_mission_1_sub_2_desc: "根据内线情报，日军在海拉尔修建了§Y东北§!最大的§j军事要塞§!，这座要塞将整座城市变为军事重地，日军在此地投资巨大，总计修建了五座要塞组成要塞群。如果能够渗透进去，这里将会是我军将来进军§Y东北§!最理想的补给基地。"
 NEB_mission_1_sub_3: "关门打狗"
 NEB_mission_1_sub_3_desc: "§G兴安岭隧道§!是大兴安岭唯一的铁路隧道。日军的军事补给全部从这里经过进入大兴安岭西麓，而我军将来翻越大兴安岭，铁路运输也不得不从这里经过。因此，我们必须把这个§O要害之地§!掌握在自己手里。"
 NEB_mission_201: "中东铁路计划"
 NEB_mission_2_tt: "[NEB_mission_2_tt]"
 NEB_mission_201_tooltip: "中东铁路是整个§Y东北§!的命脉所在，该提案由刘亚楼提出。目的是以§G哈尔滨§!为基点，构筑南北贯通的情报网。"
 NEB_mission_201_sub_1: "抢占枢纽"
 NEB_mission_201_sub_1_desc: "§G哈尔滨§!是整个中东铁路的心脏。未来我们从大兴安岭东出，还是北上外东北，§G哈尔滨§!都是我们必须夺取的战略枢纽。"
 NEB_mission_201_sub_2: "开关破敌"
 NEB_mission_201_sub_2_desc: "锦州是§Y东北§!的南大门，我军在将来如果要从山海关北上，这里是必经之地。因此，如果提前控制这里，将有助于我军北上。"
 NEB_mission_201_sub_3: "外东北援助"
 NEB_mission_201_sub_3_desc: "在关注§Y东北§!本土的同时，万不可忘记§R外东北§!的存在。他们也将对我们的计划有所帮助。"
 NEB_mission_202: "外东北恢复计划"
 NEB_mission_202_tooltip: "§R外东北§!是§Y东北§!抗日的基石，该提案由§W崔庸健§!提出。目的是重建§R外东北§!的抗日根据地，这样不仅可以从北面对§j日本§!形成战略压迫，还能重新和§R朝鲜§!的同志们构建更良好的联系。"
 NEB_mission_202_sub_1: "重建心脏"
 NEB_mission_202_sub_1_desc: "§G伯力§!是§R外东北§!的第二大城市。这里在黑龙江与乌苏里江的岔口，南连§W海参崴§!，北连§W海兰泡§!。§G伯力§!也曾是东北抗联的地下情报核心。因此，我们的第一站，就是重建这个心脏。"
 NEB_mission_202_sub_2: "由北往南"
 NEB_mission_202_sub_2_desc: "§R朝鲜§!是§Y东北§!敌军的总后方，但如果我们从海参崴出发，沿着§G鸭绿江§!一线直达丹东，那么就可以造成敌人恐慌，断绝他们的补给。"
 NEB_mission_202_sub_3: "进军东北"
 NEB_mission_202_sub_3_desc: "我们重建§R外东北§!的目的，不仅仅是恢复我们的实力，更是要收复故土。我们必须做好在恢复§R外东北§!后向§Y东北§!进军的准备。"
 NEB_mission_3: "整顿备战"
 NEB_mission_3_tooltip: "§x解放东北§!的主要任务仍然要由§R中国人民解放军§!承担，在东北局重新渗透进§Y东北§!的情况下，急需加强东北局的同志们与解放军的同志们的协调，例如情报工作、城市接收工作。只有协调好这些与军事相关的非军事方面，才能保证§x解放东北§!的顺利进行。"
 NEB_mission_3_sub_1: "牵线搭桥"
 NEB_mission_3_sub_1_desc: "§R解放军§!是§x解放东北§!的主要承担者。东北局将开展一系列的活动加强§R解放军§!同志们对§x东北局§!同志们的了解，打破双方的壁垒。"
 NEB_mission_3_sub_2: "加强建设"
 NEB_mission_3_sub_2_desc: "联合并不是单方面的，是双方共同进行的。东北局将召开一系列会议，系统学习军事相关的知识，并且加强与§R解放军§!同志们的联系，增进双方的了解。"
 NEB_mission_3_sub_3: "统一行动"
 NEB_mission_3_sub_3_desc: "经过一系列的活动和会议，§x东北局§!和§R解放军§!的同志们已经对彼此有了足够的了解，接下来，将召开由双方召开的联合会议，确定双方的具体行动和战略安排。"
 NEB_no_mission_title: "请选择行动计划"
