 NEB_history.1.t: "1931-中共满洲省委为日本帝国主义武装占据满洲宣言（节选）"
 NEB_history.1.d: "工农兵劳苦群众们：万恶的日本帝国主义者已经将奉天、营口、安东、抚顺、辽阳、海城、铁岭、长春，还有许多别的大小城镇完全占领了，这是如何惊人的事件啊！\n\n这一事件的发生不是偶然的！这一政策是日本帝国主义者为实现其‘大陆政策’、‘满蒙政策’所必然采取的行动！这一政策是日本帝国主义者为更有力的统治满洲、侵略蒙古，以致使满蒙成为完全殖民地的政策……日本帝国主义者宣传‘这次冲突是奉天北大营中国军队破坏南满铁道所引起的’。这完全是骗人的造谣，三岁小孩子也不会相信这些话！\n\n日本帝国主义者之所以能占据满洲，完全是国民党军阀投降帝国主义的结果……国民党投降帝国主义的罪恶，已经被惊动世界的事实完全暴露无余了！谁也不应再相信国民党军阀反对帝国主义了！不管国民党的那一派，不管中国任何政治派别，都不能用投降帝国主义的策略来解决满洲事件！他们一定又要来高呼其‘镇静’、‘忍耐’、‘慎重’的无耻口号，他们一定又要来欺骗民众，来依靠所谓‘国际正义’！他们一定又要来声嘶力竭地高喊：‘目前惟一的问题仍然是剿共’，来混乱群众的视线。他们一定又要利用这一事件来互相攻击，企图取得‘群众信仰’。但是无论他们怎样来欺骗，无论他们再玩些什么花样，过去的一切事实已经教训了每个群众，应当坚决地来反对来揭破这些无耻的欺骗！\n\n只有工农兵劳苦群众自己的武装军队，是真正反对帝国主义的力量。红军两年来和帝国主义国民党英勇战斗的光荣历史，便是万古不灭的证据。只有工农兵劳苦群众自己的政府（苏维埃政府）是彻底反对帝国主义的政府。只有在共产党的领导下，才能将帝国主义逐出中国！\n\n工农兵劳苦群众们！惟一的出路久已摆在我们面前了！伟大的任务久已放在我们的肩上了！只有我们以英勇的斗争才能完成它！"
 NEB_history.2.t: "1931-中国共产党为日本帝国主义强暴占领东三省事件宣言（节选）"
 NEB_history.2.d: "万宝山与朝鲜之血迹未干，日本帝国主义又公开进兵中国，强暴占领奉天安东营口，更大规模的屠杀中国民众了！\n\n各国帝国主义，尤其是日本帝国主义是压迫中国，屠杀中国民众的万恶强盗，半年以来从万宝山§R朝鲜§!一直杀到青岛，现在又杀到奉天安东营口，中国劳苦民众被牺牲已经累万盈千，过去五卅，济南惨案等更擢发难数，现在他更公开更强暴的占领中国土地，其显明的目的显然是掠夺中国，压迫中国工农革命，使中国完全变成它的殖民地，同时更积极更直接的实行进攻苏联，企图消灭全世界第一个无产阶级的祖国，世界革命的大本营，及实行第二次世界大战，特别是太平洋帝国主义战争，实行更大规模的屠杀政策以瓜分中国。\n\n正当受着军阀战争与空前扩大的水灾的蹂躏牺牲痛苦不堪的时候，日本帝国主义又公开进兵中国，强占中国领土，屠杀中国民众了......只有群众斗争的力量，只有工农苏维埃运动的胜利，才能解放中国。"
 NEB_history.3.t: "1933-中央给满洲各级党部及全体党员的信（节选）"
 NEB_history.3.d: "我们党应该十分清楚了解和巩固反日群众斗争的领导，是自己手里的任务，这是中国革命发展的现在阶段上的基本任务之一。\n\n第一，无论在什么时候，都坚持和保存自己政治上和组织上的独立性。\n\n第二，在实际执行统一战线的策略时，必须具体的注意的计算到客观的环境和主观的因素，须分别的对付各种不同的对象……\n\n第四，必须慎重的计算到这一点:即是，如果无产阶级在一定的场合和条件之下，与民族资产阶级的某一部分实行统一战线……因此，尽量扩展无产阶级农民小资产阶级(特别是工人)的政治教育和组织，基本的是借着发展他们的政治经济斗争的方法，这是我们党现在在满洲的第一等基本的任务。"
 NEB_history.4.t: "1935-中国苏维埃政府、中国共产党中央为抗日救国告全体同胞书(节选)"
 NEB_history.4.d: "当今我亡国灭种大祸迫在眉睫之时，共产党和苏维埃政府再一次向全体同胞呼吁：无论各党派间在过去和现在有任何政见和利害的不同，无论各界同胞间有任何意见上或利益上的差异，无论各军队间过去和现在有任何敌对行动，大家都应当有'兄弟阋墙外御其侮'的真诚觉悟，首先大家都应当停止内战，以便集中一切国力（人力，物力、财力、武力等）去为抗日救国的神圣事业而奋斗。苏维埃政府和共产党特再一次郑重宣言：只要国民党军队停止进攻苏区行动，只要任何部队实行对日抗战，不管过去和现在他们与红军之间有任何旧仇宿怨，不管他们与红军之间在对内问题上有任何分歧，红军不仅立刻对之停止敌对行为，而且愿意与之亲密携手共同救国。\n\n中华民族已处在生死存亡的关头，抗日救国是全体中国人面临的首要任务。宣言明确提出：“抗日则生，不抗日则死，抗日救国，已成为每个同胞的神圣天职!\n\n一切愿意参加抗日救国事业的各党派、各团体（工会、农会、学生会、商会、教育会、新闻记者联合会、教职员联合会、同乡会、致公堂、民族武装自卫会、反日会、救国会等等）、各名流学者、政治家、以及一切地方军政机关，进行谈判共同成立国防政府问题；谈判结果所成立的国防政府，应该作为救亡图存的临时领导机关。这种国防政府，应当设法召集真正代表全体同胞（由工农军政商学各界、一切愿意抗日救国的党派和团体、以及国外侨胞和中国境内各民族，在民主条件下选出的代表）的代表机关，以便更具体地讨论关于抗日救国的各种问题。苏维埃政府和共产党绝对尽力赞助这一全民代表机关的召集，并绝对执行这一机关的决议，因为苏维埃政府和共产党是绝对尊重人民公意的政府和政党。"
 NEB_history.5.t: "1940-关于东北抗日救国运动的新提纲草案（节选）"
 NEB_history.5.d: "根据东北现时的斗争环境，根据全民抗战的全局，并参照党中央六次扩大会决议案（中共六届六中全会）总方针，摆在东北党当前的任务必须着重指明：\n\n1.首先必须掌握现有东北抗日联军游击队的领导，恢复和重新建立各地方党的组织，城市和乡村的群众抗日救国运动，无论游击运动受到怎样的创伤和失败，不能把八年来东北广大群众抗日救国斗争锻炼的结晶看作残余无力。\n\n2.东北党与东北人民八年来血肉相依，其目的在于求民族之生存人在于谋民众真正福利，用牺牲一切的精神为我全民抗战坚持耐久的首倡者，现在全民进行着有力的伟大的长期抗战获取最后胜利的时期已经显示着。促进全战局对我国转向有利方面或在彻底民族解放意义方面，东北游击运动的历史任务是蕴蓄深远的前途。\n\n3.现阶段不是什么抽象的设想运动平衡发展，而是要使现有游击队进行彻底改编，适当规划游击区域及战术，积极适合全民抗日持久战现阶段的要求，因此必须努力克服前时期的弱点，使游击队今后行动趋向统一;党领导必须力求集中，同时必须纠正党内的倾向--由于游击运动游击队在长期斗争中有过盲动冒险与飘忽不定，或夸大骄纵，或失望悲观，或消极、欠确实等等这些游击队群众行动的弱点，反映到党内成为自觉或不自觉的政治行动倾向。"
 NEB_history.6.t: "1944-东北抗日联合政府"
 NEB_history.6.d: "自从苏联解体，日本大举进攻远东地区以来，远东红军已经支离破碎。抗联党组织召开会议决定：积极救助苏联红军，寻找逃散的士兵，救治伤员，并指示各部应立即组建救助委员会，组织士兵和医生参与救助工作当中。为了进一步适应抗日斗争的形势，抗联党组织酝酿对部队建制进行调整，打算组建一支从指挥体系到兵员配置更加合理，更为适应斗争形势需要的部队。周保中就此与前苏联同志交换了意见，得到前苏联同志的支持。\n\n之后，在前苏联同志的支持下，李兆麟筹建东北抗日联合政府。\n\n1943年3月，东北抗日联军整编成为抗日联军教导旅，同时宣布了军官任职命令： 周保中为旅长，李兆麟为教导旅政治委员，崔石泉（1945年改名为崔庸健）为旅副参谋长兼任旅党委书记。苏军选派30多位军官担任抗联教导旅参谋长、政治部主任、后勤部长和各级副职。第二天，东北抗日联合政府在海参崴宣布成立。\n\n1943年9月13日，教导旅召开全体党员大会，成立了“教导旅中共东北党组织特别支部局”（亦称东北党委会）。特别支部局执行中共中央的政治路线，原有的东北党组织关系不变。东北党委会既是旅党委，又是东北党组织在同中共中央失去联系的情况下全东北党组织的临时最高领导机关。东北党委会成立后，中共吉东、北满两省委撤消。至此，东北地区党组织又重新实现了统一。"
 NEB_history.7.t: "1948-关于举行第八次反扫荡斗争的指示（节选）"
 NEB_history.7.d: "现在正处于抗日斗争的低谷，根据地缩水、减员非常严重，但我们多年来的斗争仍然是有效的。敌人的主要目标仍然在华北中原一带。虽然我们彻底被日军从伯力到鲸海一线劈成两半，但这并不意味着日军彻底歼灭我们。我们疲劳、消耗很大，但敌人疲劳、消耗更大，他们已经调不出更多兵力继续进攻剩余的根据地，也已无力继续向北进攻。只要我们仍然坚持斗争，在这片异国他乡的土地上坚持下去，就没有失败。望各党支部鼓励各党员和士兵，保持乐观，谨慎对待，争取第八次反扫荡斗争的伟大胜利！"
 NEB_history.8.t: "1950-关于继续坚持斗争的指示"
 NEB_history.8.d: "各党支部，旅，团，营，连：\n\n当前抗日斗争进入更加艰苦的时期，日前从敌伪电台得知，党中央在陕西潼关挫败敌摧毁抗日民族统一战线的企图，这使得全党全军备受鼓舞，我各部队党支部应在此良机加强思想建设，做好苏联红军与我军之间的思想工作，保持团结和良好氛围。继续坚持东北抗日斗争。"
 NEB_history.9.t: "1957-关于缩减伯力地下党的指示"
 NEB_history.9.d: "东北党委驻伯力支部：\n\n自西俄战争结束后，日本帝国主义与伪满加紧对我绞杀，抗日根据地缩小甚快。为保存实力，我驻伯力的地下党员应继续缩减，请支部迅速召开会议商讨，尽快拟定缩减计划并撤离。"
 NEB_history.10.t: "1958-海兰泡大捷"
 NEB_history.10.d: "1958年，东北党委迁移到海兰泡地区。日军和伪满部队也开始了新一轮的大扫荡，这次扫荡东北党委损失惨重，东北党委与伯力、鲸海、庙街彻底失去了联系，直到两年后残部归建。日军在扫荡完外东北大部分区域后，兵锋直指海兰泡，在东北党委的指示下，苏联红军残部与东北抗联在海兰泡发起海兰泡战役。日军联合北面的阿穆尔反动势力分五路向我根据地压迫。我军采取灵活对策，在黑龙江袭击渡河的两支敌军，而后跨过黑龙江直逼齐齐哈尔，敌军惊慌失措，指挥一路敌人向齐齐哈尔进发，我军在其撤退的道路上埋伏并歼灭敌人一个团；敌人最后一路部队担心两翼遭受进攻也撤回黑龙江南岸。北面的阿穆尔反动势力因担忧周围俄罗斯军阀的进攻而进展迟缓，在我击退四路敌人后也相继撤退。我军取得了海兰泡大捷，巩固了根据地。"
 NEB_history.11.t: "1958-关于做好艰苦卓绝的敌后斗争工作的指示（节选）"
 NEB_history.11.d: "当前抗日斗争处于低谷，我们虽然巩固了海兰泡根据地，但是部队损耗很大，人员组织思想混乱，亟需休整和补充。目前我们仍未突破封锁，斗争形势依然严峻。因此，东北党委会经讨论研究决定，各部应遵照以下原则：\n\n1.三大纪律八项注意依然是东北抗日联军的基本原则，任何违反此原则的基层士兵、军内党员都应接受党委检查并处以纪律处分。我党我军能获得群众支持，其根本在于我军坚持了三大纪律八项注意，不破坏百姓生活，与敌伪反动武装的所作所为形成鲜明对比。\n\n2.党员干部应保持艰苦奋斗作风，要将群众问题摆在首位，对待群众要和气，应以积极的心态去解决群众问题，以谨慎稳重的态度进行调查研究；党员干部也要发挥先锋引领作用，须知有些事情必须有人去做才会有人跟着做，不要害怕困难，要克服困难。\n\n3.根据地建设的总体方针为八个字：恢复、求稳、充实、提高。要以恢复根据地为主；建设和生产不应操之过急，应稳步恢复，有计划地一步步恢复；建设标准要硬，建设过程的每一步都要做到位，求得根据地的充实，以应对可能到来的斗争；应尽量避免无意义的建设，逐步提高根据地水平。"
 NEB_history.12.t: "1963-关于打通西进道路的决定（节选）"
 NEB_history.12.d: "1962年对中华大地来说是极其不平凡的一年。蒙古内战结束、新疆内战结束、四川统一，党中央控制的地区扩展到了半个中国。虽然我们仍然与党中央失去联络，但自从海兰泡大捷后，日本帝国主义不再发动大规模扫荡，这使得我们重新建立了原属于苏联的远东地区的情报线；不过，我们并无控制力，依然没有能力针对伯力和海参崴这样的城市发动进攻。我们必须寻求外部的援助。然而，北面的俄罗斯军阀是反动政权，不可能与我们有什么交集，东面的库页岛是日本控制的地区，南面是伪满。因此，我们只剩下了西进这一道路。\n\n今天的形势已经不同往日，伪蒙撤出了原蒙古人民共和国东部的地区，这就意味着党中央的势力已经靠近东北，与我们的直线距离大大缩小。也就是说，我们只需要翻越大兴安岭，或者北方的俄罗斯军阀同意我们借道，从阿穆尔和赤塔进入蒙古地区，就可以与党中央会合。但现在北方局势尚不明朗，而我们的生存威胁又迫在眉睫，因此，东北党委经讨论决定，我们将翻越大兴安岭，打通满洲里——海兰泡的直达路线，从满洲里进入蒙古地区，恢复党中央的联系。\n\n因此，现阶段东北抗联的主要任务是，渗透兴安地区，突破封锁，打通西进道路，回到党中央的统一战线中去。"
 NEB_history.13.t: "1966-关于派遣以刘亚楼为代表的东北代表团进入蒙古地区的决定"
 NEB_history.13.d: "经东北党委会讨论研究决定，现派遣东北抗日联军参谋长刘亚楼同志前往蒙古地区寻找党中央。各支部加紧做好准备，等待中央命令。"
 NEB_history.14.t: "1966-§x（绝密）§!关于刘亚楼同志到达蒙古后的指示"
 NEB_history.14.d: "各党支部：\n\n刘亚楼同志到达蒙古后将立刻架设电台并发送识别代号，请各党支部的地下电台时刻监听，一旦收到，立刻识别信息源并向其发送识别代号，并接受刘亚楼同志指示。识别代号由专员送达。\n\n注：此指示为最高机密，仅供党委高层查阅。\n\n§x批注：双方识别代号为“解放东北”“星火不灭”§!"
 NEB_history.15.t: "1966-关于坚决贯彻执行党中央西撤命令的指示（节选）"
 NEB_history.15.d: "党中央考虑到支援方面的巨大困难，因此决定让东北抗联向西撤离。东北党委会经过讨论研究决定，坚决服从党中央的指示。现将党中央关于西撤的相关指示下发到各党支部，各党支部应仔细研究，认真领会党中央和毛主席的指示精神。此次西撤，各党支部应做好以下工作：\n\n第一，坚持自愿原则。不许搞强迫，劝说要适度，要尊重同志们的意愿。就算他们不愿意走也不要紧，将来我们还会回来。\n\n第二，成立西撤工作小组。各党支部应成立西撤工作小组，统一西撤的各项工作。此次西撤我们要经过敌伪控制地区，统一且秘密的行动需要专门的组织。\n\n第三，做好留守人员的思想工作。东北的解放仍然是长期且艰苦的，为了将来的解放，我们必须留下一部分同志在其中策应，要做好这些同志们的工作，要让他们知道充分理解“西撤是为了将来东进和北伐”，要充分认识到敌后地下工作的伟大意义。"
 NEB_history.16.t: "1966-中国共产党-东北局成立公告（节选）"
 NEB_history.16.d: "东北抗联自1931年抗击日寇以来，历经磨难，经受住了重重考验，跨过了重重难关。我们在白山黑水之间与敌人进行着艰苦卓绝的游击战争，打击了日本帝国主义的嚣张气焰，使得他们不敢把自己的魔爪伸向更广大的地区。抗联的一切斗争历史，都将在未来令后人铭记。\n\n斗争是残酷的，是艰苦的。在近四十年的斗争中，许多同志牺牲在了那片富饶又可爱的土地上。许多同志产生了悲观情绪，认为东北解放已经不可能，东北已经亡国灭种，东北人将永远是日本帝国主义的奴仆。但无论是1947年的中日卖国条约的签订，还是五年前新疆与蒙古内战，党中央仍然高举抗日旗帜，扩大了解放区，使中国西北得以统一。随着我们完成西撤，与党中央重新取得联络，东北的解放已不再是漫漫长夜，而是即将到来的黎明！\n\n党中央不只是要进行东北的解放，又要进行全中国的解放。这就是我们为什么要成立东北局。事情要一步一步来，不只有东北在日寇的铁蹄下，还有华北华南这片广大的地区仍然处于日寇的殖民统治，唯有团结最广大的人民群众，才能将日本帝国主义和卖国伪政权走狗彻底从中国驱逐出去。\n\n同志们，今天是东北局成立的日子，也是东北抗日解放斗争的新起点。东北抗联早已不是孤军，我们的身后已经有了可靠而坚强的党中央，她既是我们的领导，又是我们的后盾，让我们团结在以毛主席为核心的党中央周围，为东北以及全中国的解放不懈奋斗！\n\n会议还决定由高岗担任东北局第一书记，李兆麟担任东北局第二书记，刘亚楼担任第一副书记，周保中担任第二副书记。"
