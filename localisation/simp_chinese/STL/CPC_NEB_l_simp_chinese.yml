 CPC_NEB_entry_tt: "点击打开£CPC_texticon §x中国共产党 - 东北局§!GUI"
 CPC_NEB_info_desc: "£CPC_texticon §x中国共产党 - 东北局§!是新组建的机构，任务是在东北建立根据地，为§x解放东北§!做准备。您可以点击地图上的§G城市标点§!查看地区，在备忘录点击§G绿色小三角§!和§x红色小三角§!查看东北抗联的艰难岁月。\n\n东北局一共设立了三个§Y战略阶段计划§!，每个阶段都有三个任务，您可以自由地选择执行任务，点击“执行计划”绿色按钮以启动为期60天的计划，计划执行完毕后您还可以继续查看计划细节。请注意，若想完成抗日大业，请尽可能地完成这些任务。\n\n同时，为了§x解放事业§!，东北局也将尽其所能援助§x党中央§!。"
