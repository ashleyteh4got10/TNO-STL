CPC_PRC_period_1: "雏凤有栖"
CPC_PRC_period_2: "苍流不舍"
CPC_PRC_period_3: "日照苍穹"
CPC_PRC_period_tt: "最高权力机关：[PRC_highest_power]\n最高行政权力机关：[PRC_highest_gov]\n当前执政党：[PRC_ruling_party]\n当前参政党：[PRC_participating_party]\n国家状态：[PRC_order_situation]\n\n行政效率每月变化：[?CPC_admin_efficiency_monthly_rate|=.1%%+]\n每日政治点数增长：[?CPC_political_power_gain|=+]\n稳定度：[?CPC_stability_factor|=.1%%+]\n战争支持度：[?CPC_war_support_factor|=.1%%+]\n国民生产总值增长率：[?CPC_gdp_growth_modifier|=.3%%+]\n农业技术每月变化：[?CPC_agriculture_monthly_rate|=.1%%+]\n工业专业知识每月变化：[?CPC_industrial_expertise_monthly_rate|=.1%%+]\n工业设备每月变化：[?CPC_industrial_equipment_monthly_rate|=.1%%+]\n生产效率增长：[?CPC_production_factory_efficiency_gain_factor|=.1%%+]\n建设速度：[?CPC_production_speed_buildings_factor|=.1%%+]"
CPC_ununified_country: "尚未统一的国家"
CPC_ununified_country_desc: "虽然我们在大陆取得了完美的胜利，但放眼望去，台湾及其附属岛屿、南海、库页岛仍在日本手中，不丹还控制着一小片土地。我们的国家并未完成最后的统一，这既是一个遗憾，也是我们的目标。"
CPC_cold_war_with_JAP: "中日“冷战”"
CPC_cold_war_with_JAP_desc: "虽然我们在官方层面并不承认中日两国处于冷战状态，但现实告诉我们日本帝国主义不会善罢甘休，他们仍然打算挑起这场冷战。不管怎么说，事实上的冷战仍然在提醒我们，必须对日本进行彻底的革命，才能终结这百年的恩怨。"
CPC_disintegrated_industrial_1: "缺乏整合的工业体系"
CPC_disintegrated_industrial_1_desc: "自从西北保卫战以来，由于国防政府和伪政府所采取的不同政策，导致东西部的工业发展日趋畸形，形成了各自独立的工业体系。如果我们不尽快整合重复的工厂企业，在自由的市场竞争下，毫无疑问会加重人民的负担。"
CPC_disintegrated_industrial_2: "缺乏整合的工业体系"
CPC_disintegrated_industrial_2_desc: "自从西北保卫战以来，由于国防政府和伪政府所采取的不同政策，导致东西部的工业发展日趋畸形，形成了各自独立的工业体系。如果我们不尽快整合重复的工厂企业，在自由的市场竞争下，毫无疑问会加重人民的负担。"
CPC_disintegrated_industrial_3: "缺乏整合的工业体系"
CPC_disintegrated_industrial_3_desc: "自从西北保卫战以来，由于国防政府和伪政府所采取的不同政策，导致东西部的工业发展日趋畸形，形成了各自独立的工业体系。如果我们不尽快整合重复的工厂企业，在自由的市场竞争下，毫无疑问会加重人民的负担。"
CPC_disintegrated_industrial_4: "缺乏整合的工业体系"
CPC_disintegrated_industrial_4_desc: "自从西北保卫战以来，由于国防政府和伪政府所采取的不同政策，导致东西部的工业发展日趋畸形，形成了各自独立的工业体系。如果我们不尽快整合重复的工厂企业，在自由的市场竞争下，毫无疑问会加重人民的负担。"
TER_coordinate_industrial_support_tt: "全国的§G工业体系§!将得到部分§Y整合§!"
TER_coordinate_industrial_complete_tt: "全国的§G工业体系§!将得到完全§Y整合§!"
CPC_administrative_overload_1: "过度扩张的行政机关"
CPC_administrative_overload_2: "过度扩张的行政机关"
CPC_administrative_overload_3: "过度扩张的行政机关"
CPC_administrative_overload_4: "过度扩张的行政机关"
CPC_administrative_overload_5: "过度扩张的行政机关"
CPC_administrative_overload_1_desc: "随着中国革命获得了伟大胜利，中国共产党即将从一个地方性执政党走向全国性执政党，新组建的官僚机构开始难以适应我们的实际情况。我们要扩大行政部门并对其进行一系列改革，以缓解现在的行政压力。"
CPC_administrative_overload_2_desc: "随着中国革命获得了伟大胜利，中国共产党即将从一个地方性执政党走向全国性执政党，新组建的官僚机构开始难以适应我们的实际情况。我们要扩大行政部门并对其进行一系列改革，以缓解现在的行政压力。"
CPC_administrative_overload_3_desc: "随着中国革命获得了伟大胜利，中国共产党即将从一个地方性执政党走向全国性执政党，新组建的官僚机构开始难以适应我们的实际情况。我们要扩大行政部门并对其进行一系列改革，以缓解现在的行政压力。"
CPC_administrative_overload_4_desc: "随着中国革命获得了伟大胜利，中国共产党即将从一个地方性执政党走向全国性执政党，新组建的官僚机构开始难以适应我们的实际情况。我们要扩大行政部门并对其进行一系列改革，以缓解现在的行政压力。"
CPC_administrative_overload_5_desc: "随着中国革命获得了伟大胜利，中国共产党即将从一个地方性执政党走向全国性执政党，新组建的官僚机构开始难以适应我们的实际情况。我们要扩大行政部门并对其进行一系列改革，以缓解现在的行政压力。"
CPC_anti_revolution: "猖狂的反动势力"
CPC_anti_revolution_desc: "我们所取得的革命的胜利，只是在明面上的胜利。反动势力不会因此善罢甘休，他们杀人、放火、抢劫，仍然在幻想颠覆人民政权。"
CPC_banditry_activation: "匪患猖獗"
CPC_no_land_reform: "尚未进行土地改革"
CPC_restless_society: "人心浮动"
#战后国策
CPC_rebuild_1_medium_1: "中国共产党第十次全国代表大会"
CPC_rebuild_1_medium_1_desc: "国家百废待兴，社会人心思定，外敌贼心不死，内奸看菜下碟。在这样的情况下，中国共产党走到领导全国人民的节点。该如何收拢这一盘散沙，该如何突破困顿局面？一个个问题急需中国共产党作出回答。"
CPC_rebuild_1_medium_1_tt: "新的§B时代§!已经§Y拉开序幕§!，§x中国共产党§!将锚定§G方向§!。无论§R前途§!如何，§x绝不后悔§!。"
CPC_rebuild_1_medium_2: "派出东进干部"
CPC_rebuild_1_medium_2_desc: "得益于之前应对干部年龄过高时所采取的政策和农村基层民主改革，我们积累了一批足以接收新解放区的干部，现在正是派出他们贯彻执行党中央的政策的时候了。"
CPC_rebuild_1_medium_2_tt: "§x党§!将释放战前培养的干部§Y[?PRC_backup_PP|.1]§!万名"
CPC_rebuild_1_medium_3: "设立速成干校"
CPC_rebuild_1_medium_3_desc: "虽然已有预期和准备，但新解放区的干部需求仍然超出了我们的计划。现有的东进干部并不足够，我们必须马上开展速成培训，保证中央政策在地方得到贯彻执行。"
CPC_rebuild_1_medium_3_left_1: "提拔工农干部"
CPC_rebuild_1_medium_3_left_1_desc: "中国共产党是工人阶级的先锋队，农民是工人的同盟军，中国共产党一手促成工农联盟，代表的是广大工人和农民的根本利益。因此，在确定干部的选拔上，我们要着重于工人干部和农民干部，强化他们在基层党组织的话语权。"
CPC_rebuild_1_medium_3_left_2: "严格党干标准"
CPC_rebuild_1_medium_3_left_2_desc: "组织纪律是中国共产党的一大法宝。正是广大党员严格遵守党内的组织纪律，绝对忠诚于党中央及其领导，党的正确政策才得以在基层得到贯彻执行。因此，我们选拔干部也要严格标准，不能让浑水摸鱼的泛泛之辈窜进党内。"
CPC_rebuild_1_medium_4: "留用伪府官员"
CPC_rebuild_1_medium_4_desc: "毛主席曾经说过：“惩前毖后，治病救人。”伪政府的官员们固然罪大恶极，但当下我们必须保持冷静。不仅是因为缺乏新解放区的干部，还因为大部分官员其实只是屈服于形势，我们可以改造他们，让他们在新的岗位上发挥正确的作用，得到人民的谅解。"
CPC_rebuild_1_medium_4_left_1: "逐步清退伪官"
CPC_rebuild_1_medium_4_left_1_desc: "不管怎么说，伪政府的官员终究还是给伪政府服务过，无论从舆论的角度还是人民政权的角度，他们都不应该继续在原有的岗位上尸位素餐。他们应当接受改造，在新的地方取得新的成绩。"
CPC_rebuild_1_medium_4_left_1_tt: "经过严格筛查后，新一批§G党员§!将进入各地机关工作"
CPC_rebuild_1_medium_4_left_2: "保留进步人才"
CPC_rebuild_1_medium_4_left_2_desc: "伪政府并不是铁板一块，它的内部也有思想进步的人。我们要充分地团结他们，让他们真心实意地为中国人民服务，发挥他们应有的作用。"
CPC_rebuild_1_medium_4_left_2_tt: "经过严格考核后，一批进步人才将加入§R党组织§!"
CPC_rebuild_1_medium_5: "群众监督"
CPC_rebuild_1_medium_5_desc: "要如何保证党的执政充分体现人民群众的意志？那就是要让群众去监督党的执政。我们要充分动员我们的群众参与政治事务中，通过民主集中制，让群众的意见得到充分的表达，而我们的干部，要虚心接受来自群众的批评和意见，依据群众的意见改善我们的政策，从而充分体现人民群众的意志。"
CPC_rebuild_1_medium_6: "“三反五反”"
CPC_rebuild_1_medium_6_desc: "在推进新解放区的基层建设的过程中，我们发现了大量贪官污吏与违法犯罪分子结党营私，造成了大量的资源浪费，严重危害人民群众的生命安全。我们必须立刻开展“反贪污、反浪费、反官僚主义”和“反行贿、反偷税漏税、反盗骗国家财产、反偷工减料、反盗窃国家经济情报”运动，保障人民群众的安全和利益，追回和减少党和国家的损失。"
CPC_rebuild_1_medium_7: "巩固人民民主专政"
CPC_rebuild_1_medium_7_desc: "要如何体现人民群众的意志？那就是让人民群众民主选举和民主决策。要如何切实维护人民群众的根本利益？那就是对人民群众的敌人进行专政。因此，党要充分巩固人民民主专政，体现人民群众的意志，维护人民群众的根本利益。"
CPC_rebuild_1_left_1: "深入农村"
CPC_rebuild_1_left_1_desc: "长期在西部农村工作的我们，对当今的东部农村缺乏足够的了解，而广大的农村是中国的一大特点。因此，党的触角必须能够接触到东部的农村，充分运用我们在西部工作的经验，让党的政策和意志在东部的农村得到充分的了解和贯彻的执行。"
CPC_rebuild_1_left_2: "剿匪反霸"
CPC_rebuild_1_left_2_desc: "伪政府的无能让中华大地上的民众长期受到土匪和恶霸的影响。在新解放区，不少土匪袭击村庄，抢劫财物，一些恶霸在村内作威作福，人民群众的生命财产安全受到严重威胁。党中央已经下令，开展“剿匪反霸”运动，动员人民群众协助人民解放军消灭土匪恶霸。"
CPC_rebuild_1_left_3: "查田定产"
CPC_rebuild_1_left_3_desc: "要恢复农村的经济，首先就要了解各个农村都有什么。党中央指示各地方干部，充分运用几年前的查田运动的经验，要搞清楚农村都有多少地，有多少户，有多少产业，要把农村的现状摸清摸透。"
CPC_rebuild_1_left_3_tt: "东部地区的§G土地改革§!进度§G有所上升§!"
CPC_rebuild_1_left_3_left_1: "划分阶级成分"
CPC_rebuild_1_left_3_left_1_desc: "划分阶级是为了保证生产的稳定，也是保证党和无产阶级保持联系的重要手段。东部的农村并不像西部的农村那样开展过阶级运动，我们需要马上开展阶级划分，这样在未来消灭剥削阶级的时候不至于放跑真的，错杀假的。"
CPC_rebuild_1_left_3_left_2: "农村新面貌"
CPC_rebuild_1_left_3_left_2_desc: "我们的政策是正确的，是有效果的。东部地区的农村和西部地区的农村相比，除了生产上的差距，就没有什么根本性的不同了。家家户户都有土地耕种，破产的农民从死亡线上拉回，人民群众的脸上洋溢着笑容，农村的凋敝景象一去不复返。"
CPC_rebuild_1_left_3_right_1: "分配土地"
CPC_rebuild_1_left_3_right_1_desc: "当年在西部地区的土地改革让党坐稳西部地区的领导地位。如今，党将把这宝贵经验发展到东部来。要在东部地区的农村开展土地改革，将集中连片的土地分给农民耕种，将封建土地制度彻底推倒，扫进历史的垃圾堆。"
CPC_rebuild_1_left_3_right_2: "鼓励合作社"
CPC_rebuild_1_left_3_right_2_desc: "虽然农民得到了土地，但仍然出现了一部分农民因负担不起成本而破产的情况。土地耕种的成本并不是一户人家就能负担得起的，因此，我们应在东部地区的农村推广西部地区的合作社制度，充分保障农民的根本利益。"
CPC_rebuild_1_left_4: "扫盲运动"
CPC_rebuild_1_left_4_desc: "究竟是什么在阻止无产阶级去争取自己的利益？是剥削阶级剥夺了无产阶级去意识到自己被剥削。而他们其中之一的手段，就是剥夺无产阶级受教育的权利。因此，我们要大力开展教育，首先就是要让他们识字，让他们去思考，去写作，从而去主动思考如何让自己过得更好。"
CPC_rebuild_1_left_4_left_1: "开设夜校"
CPC_rebuild_1_left_4_left_1_desc: "大部分劳动者已经被繁忙的工作占据了白天的时间，他们并不像学生那样可以在白天找到时间学习。但白天没有时间，不代表夜晚不能利用。我们可以通过夜校的方式，让白天工作的劳动者在晚上接受教育。"
CPC_rebuild_1_left_4_left_2: "开办农村职校"
CPC_rebuild_1_left_4_left_2_desc: "发展各种行业需要大量的人才，而我们的教育设施尚且不足。在新时代下，各个行业表现出了极强的专业性，这就要求我们在培养人才时要注意专业性培养，而我们城市的人才不足，需要农村自己解决。因此，我们将投入一笔足够的资金，在广大的农村开办职业学校。"
CPC_rebuild_1_left_4_right_1: "兴修水利"
CPC_rebuild_1_left_4_right_1_desc: "水是极其重要的资源，喝水、灌溉、发电等等都需要水，水同样有害，洪涝、洪水各种各样的灾害严重侵害人民的生命财产安全。在中国这样古老的国家里，水利也刻进了我们的文化中。要在广大的东部大地上修建水利设施，这对未来发展经济，开展工作将大有帮助。"
CPC_rebuild_1_left_4_right_2: "发展农村工业"
CPC_rebuild_1_left_4_right_2_desc: "中国的工业城市并不多，分散的农村短时间并不会消失，但我们又有着迫切发展工业的需求。党中央认为，发展农村工业可以有效解决工业发展的需求，也可分担城市的压力，不必将大量产业集中于城市。"
CPC_rebuild_1_left_5: "农业集体化试点"
CPC_rebuild_1_left_5_desc: "随着东部农业经济的恢复，党中央根据多年的西部地区合作化的经验，认为可以在推行合作化的同时进行农业的集体化。因此，我们将选定一批社会主义成分较高的地区，开展农业集体化。"
CPC_rebuild_1_left_6: "稳步推进合作化"
CPC_rebuild_1_left_6_desc: "党曾因为强行推行农业集体化而加深了西北地区的民族矛盾，这一经验教训告诉全党和人民群众，超越阶段的发展是不存在的。我们不能在新解放区重蹈覆辙，应保证农业合作化稳步推进。"
CPC_rebuild_1_right_1: "立足城市"
CPC_rebuild_1_right_1_desc: "解放后，东部的城市居民并不清楚党的政策，对党更是缺乏足够的了解，但我们要发展工业就需要城市。因此，我们必须想尽办法在城市里争取到绝大多数人民群众的支持。"
CPC_rebuild_1_right_2: "统一财经工作"
CPC_rebuild_1_right_2_desc: "日本帝国主义在中国采取的分而治之策略贻害无穷，新解放区的各种经济产业不仅发展畸形，并且存在货币不通的情况。我们必须统一全国的财经工作，不能西北一套、东北一套，这样不仅提高治理成本，还严重阻碍各个地区的人民的交流。"
CPC_rebuild_1_right_2_left_1: "建立国有企业"
CPC_rebuild_1_right_2_left_1_desc: "早在根据地时期，我们党就已经建立了具有国有企业性质的公司，但迫于形势并不具备全国范围内的影响力，而现在全国已经解放，我们的国有企业必须确立自己在全国的经济地位。而那些被没收的日伪企业和官僚资本，它们也将全部国有化，成为国有企业的一部分。"
CPC_rebuild_1_right_2_left_2: "安抚民族资产阶级"
CPC_rebuild_1_right_2_left_2_desc: "解放后的中国已经经不起折腾了，民族资产阶级如同行尸走肉一般度过了日伪占据的时期，他们现在需要恢复生产，但在日伪宣传下，这些东部的民族资产阶级并不像西部那样对我们持有较高的信任。我们需要安抚他们，向他们展示共产党与日伪不同的一面。"
CPC_rebuild_1_right_2_left_3: "赎买资产"
CPC_rebuild_1_right_2_left_3_desc: "归根到底，中国共产党终究是马列主义政党。对于这些私有资本，国家还是要把他们转变成社会主义性质的企业。不过，我们不必像打倒敌人那样对待他们，而是以和平赎买的方式，从他们手中购得所有权。"
CPC_rebuild_1_right_2_right_1: "打击投机资本"
CPC_rebuild_1_right_2_right_1_desc: "任何年代都不缺少大发国难财的人。不少不法资本家利用非法手段囤积物资，造成资源短缺从而造成市场动荡，从中牟取暴利，对于这种严重扰乱市场行为的投机资本，我们需要对其进行有效而强力的打击。"
CPC_rebuild_1_right_2_right_2: "宽纵群众运动"
CPC_rebuild_1_right_2_right_2_desc: "资本是沾着无产阶级的血积累起来的。在解放后，我们要继续发扬群众运动，要号召东部的工人们维护自己的合法权益。要充分培养工人的主人翁意识，从资本家的手中夺回属于工人们的权利。"
CPC_rebuild_1_right_2_right_3: "计划管理"
CPC_rebuild_1_right_2_right_3_desc: "市场的资源配置是逐利的，它天生就在培养人们的逐利思维，作为一个即将走向社会主义道路的国家，我们应该开辟全新的分配管理模式，前苏联的计划经济体系就是一个很好的选择，我们应当在全国推广类似的计划管理体制。"
CPC_rebuild_1_right_3: "展开城市镇反"
CPC_rebuild_1_right_3_desc: "解放战争以燎原之势席卷全国，过快的战争进度让大量的反动分子隐藏于新解放的城市中。如果不对这些反动分子进行处置，他们极有可能会配合国外的反动势力向我们发起进攻。因此，我们必须先下手为强，在城市展开镇压反动分子的行动。"
CPC_rebuild_1_right_3_left_1: "甄别抓捕战犯"
CPC_rebuild_1_right_3_left_1_desc: "日伪战犯罪行累累、罄竹难书，他们为了逃脱人民的审判，藏匿于人群之中。因此，我们必须做好统计工作，不可冤枉好人，也不可放过一个坏人。"
CPC_rebuild_1_right_3_left_2: "维持温和镇反"
CPC_rebuild_1_right_3_left_2_desc: "党中央根据多年的执政经验，考虑到镇反运动会被利用，所以没有发动猛烈的运动。事实证明这是正确的，不少城市反馈出现了冤假错案，但正是因为党中央严格控制镇反烈度，隐藏的反动分子无法煽动群众进一步攻击党中央。我们应继续维持这一现状。"
CPC_rebuild_1_right_3_right_1: "反动党团登记"
CPC_rebuild_1_right_3_right_1_desc: "东部的反动势力形成了一个个团体，这让我们的执法行动遭遇了阻碍，不同的团体应施加惩罚是不同的。因此，我们务必要将这些反动党团一一调查登记，这有利于我们继续深挖这些团体背后的组织。"
CPC_rebuild_1_right_3_right_2: "加大镇反力度"
CPC_rebuild_1_right_3_right_2_desc: "党中央根据多年的执政经验，矫枉过正有时是必要的，过于温和的政策反而给了反动分子逃脱法网的机会。不过，不少城市反馈的冤假错案，还是要谨慎处理，不能在加大力度的同时，给了反动分子乘机向党中央进攻的机会。"
CPC_rebuild_1_right_4: "鸣金收兵"
CPC_rebuild_1_right_4_desc: "镇压反动分子的行动只是一个临时性的手段，随着大量的反动分子被处以合适的刑罚后，城市的状况已经稳定了下来。是时候鸣金收兵，开始展开大规模的建设了。"
CPC_rebuild_1_right_4_tt: "东部地区的§Y群众支持度§!§G有所上升§!"
CPC_rebuild_1_medium_8: "廓清宇内"
CPC_rebuild_1_medium_8_desc: "一年多的重建工作卓有成效。东部地区的面貌焕然一新，我们站稳了脚跟，改造了东部地区的经济，镇压了反动势力，重新整合了各个地区的人民，这一切都是在中国共产党的领导下实现的。现在环视整个中国，硝烟已经散去，但万家烟火袅袅，获得了自由的人民正在庆祝自身的解放，已经获得了自由的人民正在祝贺他们与自己的未来！"
CPC_rebuild_2_medium_1: "新解放区社会主义改造"
CPC_rebuild_2_medium_1_desc: "大战之后，人心安定。随着我国逐渐稳定了在东部地区的统治，是时候改造东部地区的经济基础，使之走上社会主义道路。因此，我们应着手开展新解放区的社会主义改造。"
CPC_rebuild_2_left_1: "农业集体化"
CPC_rebuild_2_left_1_desc: "当初，为了重建和恢复，党允许东部地区的经济暂不进行集体化改造。如今，随着东部地区生产力的恢复，现有的生产关系已经不再适宜。因此，我们应积极推广西部地区的集体化政策，在东部地区开展集体化改造。"
CPC_rebuild_2_medium_2: "建立集体合作社"
CPC_rebuild_2_medium_2_desc: "早在国防阵线时期，我们就在西安、成都和重庆三座城市探索城市的社会主义形式，在手工业方面，集体合作社制度便是我们的重要成果。如今，随着我国控制了各大城市，我们应着手在这些城市建立集体合作社，进行社会主义改造。"
CPC_rebuild_2_right_1: "设立工会组织"
CPC_rebuild_2_right_1_desc: "自从党诞生以来，为了切实保障城市的工人利益，工会制度应运而生。国防阵线时期，在党的领导下，各大城市都建立了工会。工会作为工人的集体组织参与生产管理，成为社会主义制度下的一个重要组成部分。如今，我们也应在东部地区推广这个制度，让各地工会深入参与管理建设。"
CPC_rebuild_2_medium_3: "筹备全国人民代表大会"
CPC_rebuild_2_medium_3_desc: "随着东部地区的新解放区社会主义改造迅猛开展，党中央判断召开全国人民代表大会的时机就要成熟，而且，中央人民政务委员会的代表性实际上已经不足，作为过渡性质的机构，它的职责已经走到了尽头。因此，我国应立刻组建筹备委员会，准备这场对中国来说具有着决定性意义的大会。"
CPC_rebuild_2_left_2: "人口普查"
CPC_rebuild_2_left_2_desc: "人民民主，主体是人民。为了确保人民代表大会具有代表性，我们需要一个足够代表人民的代表团，而这个代表团有多少人就成为了重中之重。因此，我们需要知晓我国究竟有多少人口，由此我们才能确定什么级别能够进行直接选举，什么级别不能进行，由此我们才能确定我们需要多少人来代表我们的人民参与管理国家大事。"
CPC_rebuild_2_left_3: "登记选民"
CPC_rebuild_2_left_3_desc: "人民民主，重要的是民主。要让人民参与到民主的进程中来，就要赋予一个他们参与进来的身份，那就是选民。国家要时刻知晓有多少人参与了选举，又有多少人的主张在民主过程中是合法提出的，因此，要对选民进行登记，要让真正的人民来管理这个新生的国家。"
CPC_rebuild_2_right_2: "组建工作组"
CPC_rebuild_2_right_2_desc: "筹备工作非常繁重，选取场地、制定选举规定……这一系列的工作都需要我们投入全身心地开展。因此，我们需要组建专门的工作组负责一系列的事务，包括到地方组织选举。"
CPC_rebuild_2_right_3: "拟定名单"
CPC_rebuild_2_right_3_desc: "一个得到人民足够认可的政府才是一个民主的政府，一个得到人民足够认可的代表团才是一个民主的代表团。由于筹备工作繁重，时间紧迫，我们需要拟定一个能够让人民认可的名单，要让人民足够轻松地去做决定。"
CPC_rebuild_2_medium_4: "举行地方选举"
CPC_rebuild_2_medium_4_desc: "代表大会的原则就是要充分体现人民的意志，而这要通过层层选举来表达。因此，在举行全国代表大会之前，我们要先举行地方上的选举，这样我们才能有底气去说我们的代表大会具有全国的代表性。"
CPC_rebuild_2_left_4: "明确选举原则"
CPC_rebuild_2_left_4_desc: "选举要有着清晰、明确的规定，才能让人民心甘情愿地行使自己的权利。我们要明确我们的选举原则，自愿参与、选举提名、匿名唱票、多数为主，充分体现人民的意志。"
CPC_rebuild_2_right_4: "严明纪律"
CPC_rebuild_2_right_4_desc: "就像党是通过组织纪律来保证凝聚力和战斗力的，我们的选举也要严明纪律。选举要公平公正公开，要允许人民保留自己的意见，不能走关系、走后门、搞强迫，胡作非为，打压异己。"
CPC_rebuild_2_medium_5: "第一次全国代表大会"
CPC_rebuild_2_medium_5_desc: "同志们，万众瞩目的全国代表大会到来了，我们终于实现了中华民族百年的民主夙愿。这次大会，将充分体现全国人民的意志；这次大会，将是一个全新的起点。人民将充分表达自己的意愿，去管理属于自己的国家，去享受属于自己的权利，这个国家也将变得更加美好！"
