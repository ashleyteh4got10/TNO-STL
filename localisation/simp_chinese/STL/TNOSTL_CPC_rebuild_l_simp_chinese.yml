CPGAC_prop_new_officers_training_program: "新干部培养方案"
CPGAC_prop_new_officers_training_program_desc: "党中央决定设立速成干校来解决各地干部不足的情况，为此，我们必须确定新干部的培养方针，确定我们所需要的干部究竟是什么样的。"
CPGAC_prop_new_officers_training_program_effect: "将决定未来§Y干部培养§!的基本方针，并解锁§Y对应国策§!。"
CPGAC_prop_new_officers_training_program_option_0: "工农干部优先"
CPGAC_prop_new_officers_training_program_option_1: "严格干部标准"
CPGAC_admit_worker_peasant_cards: "我们在§Y新干部培养方案§!中采用了£TER_texticon_mao §G毛派§!的方案。"
CPGAC_admit_strict_party_member: "我们在§Y新干部培养方案§!中采用了在书记派支持下£TER_texticon_liu §G刘派§!的方案。"
CPGAC_prop_restructure_national_industry: "民族工业改制"
CPGAC_prop_restructure_national_industry_desc: "随着城市重建工作开展，民族资产阶级对我们的看法矛盾重重。因此，我们应该及时确定对待他们的方针，打消民族资产阶级的疑虑。"
CPGAC_prop_restructure_national_industry_effect: "将决定未来§Y民族资产阶级§!的对待政策，并解锁§Y对应国策§!。"
CPGAC_prop_restructure_national_industry_option_0: "改造民族资本"
CPGAC_prop_restructure_national_industry_option_2: "恢复民族资本"
CPGAC_admit_reform_national_capitalism: "我们在§Y民族工业改制§!中采用了£TER_texticon_mao §G毛派§!的方案。"
CPGAC_admit_appease_national_capitalism: "我们在§Y民族工业改制§!中采用了£TER_texticon_liu §G民主党派§!的方案。"
CPGAC_u_anit_bandit_and_hage: "剿匪反霸"
CPGAC_u_anit_bandit_and_hage_desc: "土匪、村霸等反革命分子在解放后日渐嚣张和猖狂，使得本就人心浮动的新解放区摇摇欲坠。不少伪政府官员和汉奸混杂其中，意图发动叛乱；最新的情报显示，这些反革命分子受到日本帝国主义的资助，一旦他们得逞，他们会立刻变成日本帝国主义的帮凶，反攻倒算。因此，我们必须赶在这些反革命分子有所行动之前，将他们一网打尽。"
