l_simp_chinese:
 
 TER_unique_37_Type98:0 "37毫米98式战车炮"
 TER_unique_37_Type98_desc:0 "根据德国KWK36型37毫米反坦克炮设计制造的武器。"
 TER_unique_37_Type100:0 "37毫米100式战车炮"
 TER_unique_37_Type100_desc:0 "37毫米100式战车炮是对37毫米98式速射炮的进一步改进，扩大了炮膛容量，加长了炮管，可以发射发射药量更大，弹头更长更重的炮弹，因此穿甲能力提高不少。"
 TER_unique_47_Type1:0 "47毫米1式战车炮"
 TER_unique_47_Type1_desc:0 "日军根据诺门坎事件中缴获苏军的45毫米反坦克炮发展而来，威力更大，并被97改中战车采用，称为47毫米1式战车炮。"
 TER_unique_75_Type90:0 "75毫米90式野战炮"
 TER_unique_75_Type90_desc:0 "75毫米90式野战炮射程很远，具有一定反装甲能力，但因重量太大而不太受欢迎，所以后期主要作为战车炮生产。"
 TER_unique_76_M32:0 "76毫米M32坦克炮"
 TER_unique_76_M32_desc:0 "该炮采用立式滑动炮闩、液压同心式反后坐装置、惯性撞击射击机构，可发射榴弹、破甲弹、穿甲弹、榴霰弹、黄磷发烟弹等多种弹药。"
 TER_unique_90_Mk3:0 "90毫米科克里尔Mk.3低膛压炮"
 TER_unique_90_Mk3_desc:0 "一种重量仅为274千克，并带有液压缓冲结构的低膛压炮，非常适合装载在各种轻型车辆上面。"
 TER_unique_105_LRF:0 "105毫米LRF线膛炮"
 TER_unique_105_LRF_desc:0 "低后坐力版本的105毫米线膛炮，非常适合装载在各种轻型车辆上面。"
 TER_unique_90_M3A1:0 "90毫米M3A1炮"
 TER_unique_90_M3A1_desc:0 "90毫米M3A1坦克炮同样是由美制90毫米M2高射炮衍生而来，身长50倍口径，可发射榴弹，风帽钝头穿甲弹和超速穿甲弹等弹药，能有效攻击战场上的常见目标。"
 TER_unique_90_M41:0 "90毫米M41坦克炮"
 TER_unique_90_M41_desc:0 "90毫米M41式坦克炮专为M48坦克而研制，它拥有不错的设计，能够快速更换身管，重量也很轻，但是受限于其小巧的药筒和较低的炮口动能，这其性能也日显不足。"
 TER_unique_106_M40x6:0 "六联装106毫米M40无后坐力炮"
 TER_unique_106_M40x6_desc:0 "M40无后坐力炮可以发射破甲弹（HEAT）、碎甲弹（HEP-T），以及反人员弹，可以进行反人员和反装甲作战。六联装的M40无后坐力炮能够以相当高的射速依序射击，从而保证击毁目标。"
 TER_unique_90_T208:0 "90毫米T208滑膛炮"
 TER_unique_90_T208_desc:0 "美制90毫米T208滑膛炮可发射穿透力强的高速尾翼稳定脱壳穿甲弹。"
 TER_unique_105_Type83:0 "105毫米83式滑膛炮"
 TER_unique_105_Type83_desc:0 "基于美制105毫米T210滑膛炮设计的火炮，该主炮初速为每秒1740米，其在距目标2000码远，以60度角开火时，炮弹可以穿透152mm的装甲。。"
 TER_unique_120_M256:0 "120毫米M256滑膛炮"
 TER_unique_120_M256_desc:0 "120毫米M256坦克炮，是一种高初速高、射速快、精度高的直射武器，主要用于打击敌方坦克等硬目标。"
 TER_Unique_155_T180:0 "155毫米T180坦克炮"
 TER_Unique_155_T180_desc:0 "T180型坦克炮发射碎甲弹与破甲弹作为主要反坦克手段，由于没有对瞠压与初速有过高要求的原因，它的重量很轻。"

 TER_Unique_IFV_76_D56T:0 "76.2毫米D-56T坦克炮"
 TER_Unique_IFV_76_D56T:0 "D-56T最初被命名为LB-76T，使用的弹药来源于经典的76.2毫米ZIS-3野战炮。虽然对抗坦克的能力有限，但足以对付同级战车和大量出现的步兵战车和装甲运输车。"
 TER_Unique_IFV_85_D58:0 "85毫米D-58(2A22)坦克炮"
 TER_Unique_IFV_85_D58_desc:0 "85毫米D-58坦克炮配备了双平面稳定器和自动装弹机。当从1公里外发射时，穿甲弹的炮口速度约为1000米/秒，可以穿透60度摆放的145毫米的装甲板。高爆弹的最大射程为13.5公里。"
 TER_Unique_MBT_100_D10T:0 "100毫米D-10T坦克炮"
 TER_Unique_MBT_100_D10T_desc:0 "D-10T坦克炮是一款100毫米线膛炮，以高初速、强穿甲能力和结构简单可靠著称。"
 TER_Unique_MBT_100_2A24:0 "100毫米D-54TS(2A24)坦克炮"
 TER_Unique_MBT_100_2A24_desc:0 "D-54TS使用双室炮口制退器，主要发射脱壳穿甲弹，初速相比D-10火炮提升了30%，但是使用不便于搬运的长筒定装药，造价也相比D-10T高昂许多"