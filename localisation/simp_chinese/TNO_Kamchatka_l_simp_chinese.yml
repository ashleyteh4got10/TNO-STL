 KMC_Ivan_Yumashev: "伊万·尤马舍夫"
 POLITICS_IVAN_YUMASHEV_DESC: "伊凡·斯捷潘诺维奇·尤马舍夫上将在红海军度过了几十年的时间，尽管他曾服务的国家已不存在。他曾航行的海域从波罗的海延伸至鄂霍次克海，但现如今，他大部分时间都是凝视着白令海。在大祖国战争期间，他指挥着太平洋舰队，在海域中巡逻，并偶尔与日本舰艇发生冲突。当他驻扎在符拉迪沃斯托克时，他听到了苏联战败的消息，迅速采取行动，将舰队撤离港口，以免被日本的豺狼所及。\n\n当尘埃落定时，尤马舍夫上将和他的军官们向亚戈达政权表示忠诚，后者帮助他们找到了临时工作。随着反动派的逼近，尤马舍夫的海军力量不得不寻找另一个家园，远离被包围的普里阿穆尔要塞。彼得罗巴甫洛夫斯克-堪察加市已被苏联政府和大部分居民遗弃，除了几个村庄外，这里几乎没有任何基础设施。堪察加半岛的海岸成为红色海军的登陆总部，这个小渔村被改建成临时海军基地。\n\n远离文明之地，远东红色海军除了刮船舷上的冰，无能地目睹着该地区陷入混乱和内讧。由于没有合理的补给和燃料途径，水手们开始通过海盗和走私在太平洋上谋生，成为日本和美国在海洋竞争中的额外障碍。可以说，尤马舍夫上将对他的部下所变成的形象并不喜欢，但可以确定的是，他不会剥夺他们在地球边缘生存的唯一可行方式。"
