 DEN_German_Garrison:0 "德国国防军驻地"
 POLITICS_DEN_German_Garrison_DESC:0 "自从德国征服丹麦以来，德国国防军驻扎在该国的首都哥本哈根。驻扎在丹麦一直被视为相对于前线服役或帝国偏远角落的轻松休息。军官和士兵们都享受着宜人的乡村风光。但是他们现在的处境却一切都不宜人。\n\n在第二次世界大战惨败后，许多其他国家设法摆脱了德国的控制，但丹麦却并非如此。该国的控制权仍然掌握在德国驻军手中。当来自日耳曼尼亚的命令停止，文官政府崩溃时，军队迅速接管了权力。他们的领导，以及由此延伸的丹麦，由一群争斗不休的军官统治，他们完全没有准备好统治一个国家。\n\n现在，他们陷入了极其危险的境地。驻军控制着大城市，但他们在农村地区的权威却不存在。一些乡村地区公开拒绝服从他们的权威。兵力不足的驻军只能应对小规模的动乱，供应不足以镇压叛乱分子。整个腐朽的体系只需要一个踢门就会崩塌。即使他们设法度过这场风暴，也无法保证在日耳曼尼亚取得胜利的政府会友好对待他们……"
 DEN_Anker_Joergensen:0 "安克·约根森"
 POLITICS_DEN_Anker_Joergensen_DESC:0 "安克·约根森于1922年出生，由于父母因结核病而迅速离世。他辍学在仓库工作，依靠家人的帮助艰难生存，约根森涉足劳工政治，并因此而与社会民主党结下了不解之缘。\n\n战争中，约根森首次展现了对德国人的抵抗行动。在“狩猎行动”期间，他拒绝被德国人解除武装，虽最终被俘，但被遣返回丹麦，迅速加入了该国热情洋溢的抵抗运动。为了自由的丹麦，他已经奋斗了近三十年，不得不面对国家与德国占领者的斗争。然而，他咬紧牙关继续战斗，从未放弃他对一个属于人民的丹麦的愿景。\n\n如今，曾经傲立的国防军已化为灰烬，丹麦从破败的大日耳曼国脱离出来，约根森已成为曾经再次自由的丹麦的总理。曾经的梦想可能会成为现实，因为约根森现在公开努力，为丹麦的所有臣民创造一个国度，为他的国王而战。"
 DEN_Arne_Munch_Petersen:0 "阿恩·蒙克-彼得森"
 POLITICS_DEN_Arne_Munch_Petersen_DESC:0 "阿恩·蒙克-彼得森，生于1904年，是一位教授的儿子。起初打算当老师，他拥有历史学硕士学位，但很快就投身于丹麦共产主义领域。他在1928年当选为第六次共产国际代表大会代表，从那时起，他的参与只会不断增加。彼得森成为了苏联布哈林领导下的信使，负责维系苏联、斯堪的纳维亚、波兰和德国之间的联系。不久之后，他成为了丹麦共产党的党务秘书。\n\n随着战争于1940年来袭丹麦，蒙克-彼得森被迫将活动地点转移到地下。他继续履行对共产国际的职责，保持莫斯科与他在中北欧的联系。然而，在布哈林政府垮台、共产国际分裂的时刻，蒙克-彼得森选择了继续战斗。即使在民族社会主义的镇压下，蒙克-彼得森从未放弃他的梦想，要在铁锤和镰刀的旗帜下，为丹麦的自由而奋斗。\n\n随着德国的战败，其势力范围陷入了混乱，蒙克-彼得森有机会实现他的愿景。此刻比任何时候都更应该将丹麦从德国走狗的压迫下解放出来，让她步入一个红旗在斯堪的纳维亚自豪飘扬的时代。"
 DEN_Poul_Hartling:0 "保尔·哈特林"
 POLITICS_DEN_Poul_Hartling_DESC:0 "保尔·哈特林于1914年8月14日出生在哥本哈根，他的童年时光都在那里度过。后来他学习神学，成为一名牧师，并于1939年毕业，随后前往一所师范学校，在那里度过了时间，直到1940年德国入侵。他被迫逃往瑞典，在那里计划等待战争结束。然而，盟军失败，迫使他留在斯德哥尔摩。\n\n在那里，他努力继续他的牧师职业生涯。他成为哥本哈根流亡者中的杰出代表。在丹麦政党“左翼党”迁往斯德哥尔摩后，他于1957年加入，并迅速攀升至高层，于1965年成为党的领袖；然而，这个党缺少了一些东西：希望。没有人预料到丹麦会从德国解放出来。但是这种希望比他们想象的来得更快，当德国在东部战败后陷入混乱时，帝国陷入了内战。\n\n在丹麦之春的抵抗胜利后，左翼党迅速返回哥本哈根，选举保尔为主席。在左翼党赢得选举胜利后，许多人对一个自由和新的丹麦的希望似乎都寄托在他的肩上。"
 DEN_Soeren_Kam:0 "索伦·卡姆"
 POLITICS_DEN_Soeren_Kam_DESC:0 "1921年出生的索伦·卡姆，从小就是坚定不移的民族社会主义信徒，以及其后来的那个私生子——勃艮第体制，毫无悔意。他的父亲是丹麦自由军团的领袖，一个党卫队单位，他的母亲是丹麦民族社会主义工人党的成员，卡姆深陷于这种意识形态中，所以他选择与之合作并加入了党卫军维京师。\n\n卡姆曾在东线战斗，为他的行动赢得了荣誉。后来，他被调离前线，转而负责日耳曼党卫军的训练工作，并在该组织中获得了领导地位。在与俄罗斯的战争结束并布哈林政府垮台后，卡姆继续在德国占领的领土上为党卫军训练新成员。他与希姆莱一同被卷入了党卫军的未遂政变，并在接下来的几十年中生活在勃艮第，参与希姆莱的“勃艮第体制”。\n\n随着丹麦如今四分五裂，德国和陆军高层试图放松控制，卡姆现在已经回到丹麦，要将希姆莱的党卫队触角延伸到另一个世界的一部分：他的故乡丹麦。"
 DEN_Freedom_council:0 "自由委员会"
 POLITICS_DEN_Freedom_council_DESC:0 "尽管丹麦的国王和政府仍然掌权，但在德意志的指导下，继“威瑟堡行动”之后，该国的占领比大多数被纳粹入侵的国家要轻。随着时间的推移，德国的影响力越来越大。丹麦的经济与帝国息息相关，德国国防军的威胁笼罩着这个国家。许多人认为丹麦注定要永远舔德意志的靴子。\n\n然而，他们错了。\n\n尽管德国占领了这个国家，但在地下，在地下室里策划，并在森林中袭击，抵抗成员和游击队成员联合起来，最终解放了丹麦，现在以一个通俗的名字被称为“自由委员会”来共同统治。该委员会于1943年由一群丹麦民主派和共产主义者在德国入侵后成立，起初在第二次世界大战期间对驻丹麦士兵进行秘密行动。\n\n战后，该组织暂时保持沉默，利用这段时期从各处获得力量。现在，他们站在国家的前沿，成为唯一的领导层。尽管委员会的合法性存疑，共产主义者和民主派之间存在轻微的争斗，但它仍然可能是丹麦人民和真正自由的丹麦的最后希望。"