 ARM_Gurgen_Arutjunovic_Dalibaltajan: "古尔根·阿鲁朱诺维奇·达利巴尔塔詹"
 POLITICS_GURGEN_ARUTJUNOVIC_DALIBALTAJAN_DESC: "二战征兵士兵，纳粹占领高加索期间游击起义的老兵古尔根·阿鲁朱诺维奇·达利巴尔塔詹为保卫自己的民族生存而奋斗了大半辈子。他出生于亚美尼亚人居住的博格达诺夫卡镇，但德军战争机器席卷东欧，带来死亡和苦难，使他的教育被迫中断。在赫里斯亚斯的压迫下，德国占领地建立起来后，他毫不犹豫地帮助游击队解放了许多亚美尼亚奴隶。\n\n游击生活的单调持续不断地侵蚀着他，直到东方传来了一些传闻。这些传闻讲述了一只觉醒的熊，试图为曾经压迫它的人带来正义。他没有等待太久，新成立的俄罗斯联邦扫除了最后的德国威胁，再次解放了高加索，重燃了他的希望。\n\n然而，当他走回故土时，却被一个镶嵌着土耳其标志的边境围栏所迎接。他再次呼吁解放自己的民族，俄罗斯再次回应了他的呼声。现在，他装备着俄罗斯武器，怀揣着人民的希望，他将返回自己心爱的故乡，结束土耳其的压迫。他和他的人民已经走了太远，不能再让自己成为奴隶。"
 ARM_democratic_paternalism: "亚美尼亚国民大会"
