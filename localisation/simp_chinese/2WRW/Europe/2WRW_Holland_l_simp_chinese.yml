l_simp_chinese:
 HOL_fractured_national_identity:0 "破碎的国家认同"
 HOL_fractured_national_identity_desc:0 "近半个世纪以来，荷兰人民在大日耳曼帝国的压制下辛勤努力。几十年的民族社会主义统治已经在我们的制度和文化上留下深远影响，孕育出了一代完全脱离自由荷兰理念的人，将我们许多年轻人灌输成盲目服从帝国的信仰。要过上许多许多年，真正的荷兰身份才能再次崛起。"
 HOL_without_a_master:0 "无主"
 HOL_without_a_master_desc:0 "几十年来，我们的政府一直盲目追随我们日耳曼主人的心愿，放弃了任何形式的政治自治或自由意志，而是完全服从于民族社会主义世界秩序。随着帝国的倒台和独立的俄罗斯在全球舞台上的复兴，我们失去了主人，留下了一个混乱的权力真空。"