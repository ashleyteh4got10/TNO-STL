 gc_netherlands_news.1.t: "[Get_newspaper_header]鹿特丹之战"
 gc_netherlands_news.1.desc: "曾被认为是德国最宁静稳定的殖民地，如今却陷入了混乱之中，因为尼德兰专员辖区在革命活动急剧增加的影响下陷入了动荡，这在鹿特丹演变成了当地与合作者当局之间公开冲突的高潮。这座城市已经几乎完全解放，因为亲德国的部队从他们的据点撤退，并拼命试图重新组合。\n\n随着德国国防军在东边的行动受到限制，专员辖区的驻军难以维持任何秩序的样貌。在这个殖民地，暴乱和抗议活动不断增加，因为德意志的无能已经激发了新一波的骚动。在低地国家，火药桶已经点燃，即将发生的爆炸似乎没有任何停止的迹象。"
 gc_netherlands_news.1.a: "更伟大事业的前夕？"
 gc_netherlands_news.1.b: "坚守战线！"
 gc_netherlands_news.2.t: "[Get_newspaper_header]荷兰革命"
 gc_netherlands_news.2.desc: "席卷荷兰的革命浪潮在今天达到了高潮，早上早些时候，革命势力攻占了海牙的帝国行政总部。叛军民兵团夺取了这座建筑的控制权，并将国防军驻扎部队赶出了周边城市，击溃了该国仅存的德国据点之一。\n\n革命者在首都的新权力基地宣布了荷兰对帝国的单方面独立。德意志的当局发誓要进行迅速的报复，但随着他们的主力部队在数千英里之外，任何当地部队都在稳步地被逐出荷兰边境，荷兰的独立火焰看起来不会很快熄灭。"
 gc_netherlands_news.2.a: "坚持不懈！"
 gc_netherlands_news.2.b: "是可忍孰不可忍！"
 gc_netherlands_news.3.t: "[Get_newspaper_header]流亡者公投"
 gc_netherlands_news.3.desc: "一股热情的潮流席卷了刚刚独立的荷兰，而其临时政府正准备就国家未来及其古老君主制举行一次全民公投。\n\n自从第三帝国征服低地国家以来，驻扎在苏里南的荷兰流亡政府一直坚持存在，并向革命政府表达友好姿态，希望能够重新夺回他们的“天赋”。\n\n在这个新近解放的国家中，接受程度参差不齐，一些人认为与同胞团结是必要且不可避免的结局，而另一些人则质疑是否应该与曾以铁腕主宰其所在地区的殖民统治体系联合。荷兰的未来正悬而未决，只有本国人民能够决定它的命运。"
 gc_netherlands_news.3.a: "荷兰人确实喜欢全民公决"
 gc_netherlands_news.4.t: "[Get_newspaper_header]流亡者重回荷兰"
 gc_netherlands_news.4.desc: "在荷兰政府未来的全国性公投取得成功之后，荷兰王国终结了在苏里南的流亡状态，再次重掌国内政权。朱莉安娜女王受到了阿姆斯特丹的皇家欢迎，荷兰流亡者纷纷回到了欧洲。\n\n国际社会的反应总体上都是祝贺的，尤其是自二战结束以来支持苏里南政权的自由国家组织。国内的反应也相当积极，许多人认为这是回归正常的一步，然而也有人对统治君主党的绝对主导地位提出了质疑。无论如何，荷兰已经回到了其合法政府的怀抱，国家的命运似乎已经得以决定。"
 gc_netherlands_news.4.a: "奥兰治-拿骚号经受住了考验。"
 gc_netherlands_news.5.t: "[Get_newspaper_header]荷兰公投失败，共和国宣告成立"
 gc_netherlands_news.5.desc: "在令人震惊的颠覆中，新解放的荷兰境内的全民公投结果宣布成立了一个共和国，这是近两个世纪以来低地国家的首次。临时政府已明确表示将在准备中辞去职务，为即将举行的快速选举做准备，标志着迈向自由民主未来的坚定步伐。\n\n虽然庆祝和乐观情绪席卷全国，流亡在苏里南境内的君主制政权仍然陷入失败的困境。朱莉安娜女王内阁的代表拒绝对此结果发表评论，因为君主主义政府仍被排斥在本国之外，而其臣民则陷入了对国家未来的忧虑和不确定之中。"
 gc_netherlands_news.5.a: "随着君主制逐渐消失在历史的篇章中，共和制又回到了人们的记忆中。"
 gc_netherlands_news.6.t: "[Get_newspaper_header]荷兰合作派反击政变！"
 gc_netherlands_news.6.desc: "荷兰革命及其国际上所寄予的希望和乐观心情，在今天早些时候彻底被摧毁。当地亲德军事团体和残存的德国国防军驻军，在荷兰合作者乔普·格里默芬的指挥下，成功团结起来，重新夺回了国家的首都，并处决或囚禁了革命领袖。\n\n新恢复的合作者政府已经开始镇压当地的抵抗，抵抗领袖惨遭屠杀后，任何协调的反对行动都变得不可能。全球各地的旁观者惊恐地注视着荷兰对自由的呼声被压制，毫无疑问，日耳曼尼亚对此松了一口气。"
 gc_netherlands_news.6.a: "耻辱。"
 gc_netherlands_news.6.b: "秩序得以恢复。"
 gc_netherlands_news.7.t: "[Get_newspaper_header]德国入侵荷兰"
 gc_netherlands_news.7.desc: "与其他原始日耳曼地区一样，荷兰帝国专员区与德国有着独特的关系。纳粹将荷兰人视为除名字外几乎与德国人无异的存在，这导致了与德国的密切关系，并且荷兰几乎被视为帝国的核心组成部分。\n\n今天，随着德国军队越过荷兰边境，这一点得到了强调。就像臭名昭著的鹿特丹大轰炸一样，德国空军已开始在该国上空执行“战略”轰炸行动。尽管荷兰已经预料到并为入侵做好了准备，但面对国防军，能做的事情有限。在没有防御地形的情况下，荷兰政府一直在艰苦地努力进行防御，但很少有国际观察人士认为他们会成功。对许多人来说，问题不在于荷兰是否会投降，而是在于何时。"
 gc_netherlands_news.7.a: "荷兰人民还会继续受到束缚吗？"
 gc_netherlands_news.7.b: "他们会看到他们的抵抗是徒劳的。"
 gc_netherlands_news.8.t: "[Get_newspaper_header]基督教民主派赢得荷兰大选"
 gc_netherlands_news.8.desc: "三十年来首次举行的荷兰选举以一种相当可预见的方式结束，新成立的基督教人民党在弗兰斯·安德里森的领导下在议会中获得了多数席位。基督教人民党是荷兰在德国入侵之前统治的旧基督教民主派的直系传人。\n\n在他首次就任荷兰总理后的演讲中，安德里森誓言要恢复德国人曾竭力铲除的荷兰生活方式。他还强调了迅速加入自由国家组织以保护这个国家的必要性。"
 gc_netherlands_news.8.a: "一切照旧"
 gc_netherlands_news.9.t: "[Get_newspaper_header]进步派赢得荷兰大选"
 gc_netherlands_news.9.desc: "荷兰新宣布成立的共和国已经举行了首次选举，巴斯蒂安·福特曼领导的进步党获得了多数席位。经过多年的右翼占领，向温和左翼的转变被大多数观察家普遍预期。福特曼在阿姆斯特丹的人群面前表示，他们现在可以开始重建一个既自由又公平的国家，并承诺迅速加入自由国家组织以确保荷兰共和国的自由和独立。"
 gc_netherlands_news.9.a: "社会民主人士的胜利"
 gc_netherlands_news.10.t: "[Get_newspaper_header]民粹主义者赢得荷兰大选"
 gc_netherlands_news.10.desc: "在一个令人震惊的结果中，由汉斯·詹马特领导的民粹主义政党“民主安全”赢得了荷兰选举。最初被预测为局外人，詹马特的非传统政策显然广受欢迎。\n\n承诺荷兰永远不再成为占领的受害者，“民主安全”提议效仿瑞士的中立政策，大力加强荷兰边境并加强军事力量。在他的开幕演讲中，詹马特发誓国家再也不会为德国人服务，也不会成为美国的傀儡。在开放贸易与封闭边界之际，[FROM.GetNameDef] 进入了历史的新篇章。"
 gc_netherlands_news.10.a: "荷兰中立政策已恢复生效"
 gc_netherlands.1.t: "革命者组建政府"
 gc_netherlands.1.desc: ">民——民主！？在这个时候，在团结协定的势力范围内，民主重回了您的国家！？\n>是的\n>我可以看看吗？"
