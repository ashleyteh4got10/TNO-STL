l_simp_chinese:
 LAT_Valdis_Birkavs: "瓦尔迪斯·比尔卡夫斯"
 LAT_Baltic_Council: "波罗的委员会"
 POLITICS_VALDIS_BIRKAVS_DESC: "瓦尔迪斯·比尔卡夫斯在战争期间出生，然而他并未幸免于目睹无数恐怖和暴行，他亲眼见证了他的祖国在他的有生之年被德国人殖民。作为维尔纳维尔斯堡的居民，他亲眼目睹了他的邻居们逐渐被德国人取代。这只激励他更加努力地学习，以便有朝一日能够领导这个国家，将拉脱维亚还给拉脱维亚人。\n\n虽然他年轻时的愚蠢梦想在成长于东方专员辖区的严酷现实以及国家当前的困境中被磨砺，但他改善国家混乱局面的梦想并未改变。虽然东方专员辖区现在幸运地成为了越来越遥远的回忆，对许多拉脱维亚人来说，它已经成为上周的一场噩梦，但德国人留下的遗产仍然是一个永恒存在的现实。\n\n他的目标是确保这个现实最终也会成为一个遥远的回忆。"
 LAT_RUS_conservatism_party: "拉脱维亚道路党"
 LAT_RUS_conservatism_party_long: "拉脱维亚道路党"
 LAT_RUS_liberalism_party: "国家和谐党"
 LAT_RUS_liberalism_party_long: "国家和谐党"
 LAT_RUS_progressivism_party: "拉脱维亚人民阵线"
 LAT_RUS_progressivism_party_long: "拉脱维亚人民阵线"
 LAT_RUS_paternalism_party: "拉脱维亚民族独立运动党"
 LAT_RUS_paternalism_party_long: "拉脱维亚民族独立运动党"
 LAT_picking_up_the_pieces: "收拾残局"
 LAT_picking_up_the_pieces_desc: "过去30年里，波罗的海地区彻底被毁。从1930年代的苏联入侵，到德国威胁控制海岸并统治一切，直到1960年代初东部领土的彻底崩溃，这片曾经美丽的地区在第二次世界大战期间成为激烈战争的温床，如今已变成了破碎的家园和坑坑洼洼的街道。尽管重建工作正在进行，想要恢复昔日的辉煌还需很长时间。"
 LAT_lettendeutschen: "拉脱维亚德意志人"
 LAT_lettendeutschen_desc: "尽管重建当局努力劝阻德国定居者留在德国的东部前征服区，但他们拒绝直接驱逐这些定居者，导致我们的人口中相当一部分是德国人，产生了民族紧张局势。此外，许多本地拉脱维亚人由于过去30年发生的事件不信任这些定居者，尽管他们的不信任是有道理的，但这又是一个希望能随时间愈合的伤痕……如果它真的能愈合的话。"
 LAT_pearl_of_the_baltic: "波罗的海明珠"
 LAT_pearl_of_the_baltic_desc: "里加一直是波罗的海沿岸最重要的城市，是该地区的主要贸易中心。 即使德国人也知道这一点，因此他们在第二次世界大战期间并没有完全摧毁这座城市。 这样的优势肯定会为我们的经济带来繁荣。"