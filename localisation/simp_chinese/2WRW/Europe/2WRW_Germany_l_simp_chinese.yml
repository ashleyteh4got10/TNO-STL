 POLITICS_GERHARD_KLOPFER_DESC: "关于格哈德·克洛普佛有什么可说的呢？如果说鲍曼拯救了党，那么克洛普佛就是来收获鲍曼努力成果的。他在几乎没有引起轰动的情况下掌握了权力，轻松击败了盖伦和瓦尔德海姆，这一过程更像是一种神圣加冕而不是权力斗争。自从“六月欺诈”之后的第二波清洗以来，克洛普佛就为党的领导和他自己的位置做好了准备，任何反对的声音早已被压制。\n\n但经过这一切，德国现在看起来简直就像个乌托邦。欧洲现在对民族社会主义熟得就像老朋友一样：残忍、秩序，还有一种任命像克洛普佛这样的人占据高位的冷酷官僚体系。新元首对付所谓的“社会主义恐怖分子”的办法，就是枪毙任何他怀疑叛国的人，不管他们是不是真的恐怖分子。他应对经济危机的手段是更加坚定地推行自给自足，要求更多牺牲，以及定期送出大量贿赂来维持党的至高无上。\n\n显然，克洛普佛并不是个激进派。他不是希姆莱。现在根本没必要去破坏这台运转良好的机器。这个体系会继续下去，那些在圈子里混得开的人会越来越有钱。不，真正可怕的是，在克洛普佛元首的统治下，民族社会主义已经在欧洲变成了一个常态。成千上万的谋杀、对整个国家的强暴、文化的灭绝已经变得无比、令人麻木地乏味。欧罗巴的血腥演奏会不会结束，只要他还活着，他就会确保这场演出再持续一千年。"
 SWRW_POLITICS_REINHARD_GEHLEN_DESC: "帝国最近的纷争是完全不能接受的。学生和改革派在街头像破碎的小提琴一样尖叫，而红军党和其他犹太布尔什维克组织则在暗中攻击我们的政府。德国不需要一个空想家。她需要一个致力于德国人民的利益，愿意把国家放在自己之前的人。她需要一个高尚的人，一个愿意在新时代指挥民族社会主义的种族交响乐的人。她需要莱因哈德·盖伦。\n\n至少，这是他在公开场合反复说的话。私下里，自从鲍曼在内战中获胜后，盖伦一直是鲍曼的远距离支持者，用毒药和狙击手的子弹消灭他的敌人，并夜以继日地巩固国家权力。他的机构，战略支援警察，在欺骗的六月，当它送出海因里希·米勒的头颅时，证明了它的忠诚。因此，当皇家空军开始恐怖活动时，元首以他所有的智慧任命盖伦来消除异议的污点。盖伦使用军事警察就像指挥家的指挥棒至少，这是他在公开场合反复说的话。私下里，自从鲍曼在内战中获胜后，盖伦一直是鲍曼的远距离支持者，用毒药和狙击手的子弹消灭他的敌人，并夜以继日地巩固国家权力。他的机构，战略支援警察，在欺骗的六月，当它送出海因里希·米勒的头颅时，证明了它的忠诚。因此，当皇家空军开始恐怖活动时，元首以他所有的智慧任命盖伦来消除异议的污点。盖伦使用OrPo就像指挥家的指挥棒，切断欺骗和叛国的噪音，让调音的乐器沉默，并演奏出和平的甜美音乐。在重组的这段时间里，没有人注意到格哈德·克洛普佛的一些盟友离开音乐厅，或稍微改变了他们的调子。现在他们和纳粹党，转而歌颂盖伦。但握着指挥棒的是他，他和军事警察，而不是党。永远不是党。"
 GER_kurt_waldheim: "库尔特·瓦尔德海姆"
 POLITICS_KURT_WALDHEIM_DESC: "库尔特·瓦尔德海姆一直以来都是个善辞令的人，也是个忠诚度灵活的人。作为一个出生在奥地利并在奥地利吞并前出生的捷克人，瓦尔德海姆将自己视为新式波希米亚人的典型代表，一个完全德国化并忠诚于帝国的仆人。他于1941年被征入德国国防军，担任翻译、宣传官和巴尔干地区的联系官。瓦尔德海姆晋升为上尉，并被独立国家克罗地亚授予了克罗地亚国王兹沃尼米尔勋章。\n\n1945年之后，瓦尔德海姆加入了德国外交服务，首先担任乌斯塔沙政府的联系人。在克罗地亚受到意大利影响后，他担任了多个职务，包括在西俄罗斯战争期间担任芬兰的军事联系官，后来又担任了驻瑞典大使。在巴尔杜尔·冯·希拉赫被撤职后，鲍曼任命他担任外交部长，认为以贵族为主的部长会拒绝一个平民的领导，使得叛逆的部门失去权力。然而，在克洛普佛和盖伦相互对立的情况下，瓦尔德海姆得以巩固一个由工业家、外交官和因鲍曼的残暴领导而受冷落的党员组成的权力基础。\n\n作为一名外交家，瓦尔德海姆上任元首后的第一个举动是开始与日本和美国进行一系列缓和会谈。然而，他对东欧斯拉夫人的压制没有任何放松的迹象。对于那些拒绝接受其文化和土地被德国化的人来说，瓦尔德海姆元首的继任可能确实不幸..."
 POLITICS_ADOLF_HEUSINGER_DESC_POSTSWRW: "豪辛格将军自1915年起在德国陆军服役。起初只是一名普通步兵，到了1938年，他担任了国防军作战参谋的职位，并晋升为总参谋长。然而，在西俄战争期间，豪辛格的部队是唯一在舒尔纳元帅失败的情况下表现得相对出色的军团之一。在内战期间，许多人预期他会站在戈林一边。然而，他最终下令部队听从斯佩德尔的指挥进入日耳曼尼亚，在那里度过了战争的余下时间。\n\n随着东方局势的恶化，豪辛格在军队中组织了一个与民族社会主义相关的起义组织。这个名为\"Schnez Truppe\"的派系由前党卫军、不满的军官和爱国者组成，在政府崩溃明显时，他们选择发动政变推翻鲍曼的继任者。随着党的瓦解和军队的全力支持，豪辛格很容易地夺取了权力，只需下令暗杀任何公开反对他的官员。抗议者和持不同政见者被建议隐藏自己，以免他们和家人成为刺刀下的牺牲品。"
 POLITICS_HELMUT_SCHMIDT_DESC: "虽然许多人可能知道施佩尔元首那冷酷和算计的目光，但很少有人看到他背后操纵一切的人。\n\n赫尔穆特·施密特在四场战争的遗产中幸存下来。从第二次世界大战最后几天的气候变化到苏沃洛夫行动和保安总部政变的混乱，施密特亲眼目睹了德国在半个世纪内从欧洲无可争议的霸主变成毫无所有的主宰。德国曾经是一个千年帝国，却被那些被认为不及人类的人们击倒，成为一片冒烟的废墟。它被那些引导它走向火焰的人留下了燃烧的废土。\n\n现在轮到施密特将德国引领进入一个不同的世界，他无意继续沿着当前的道路前进。四人帮在各个方面逼迫之下，展示出他们在面对又一场灾难时的牙齿。但这一次，他们无意“改革”民族社会主义模式。相反，德国将成为施密特自己的忒修斯之船。每一块腐朽的木板，构成了这个庞然大物的帝国，将被一个个拆除，重新建造，成为一个德国年轻一代长期被剥夺的未来的样子。民主。\n\n随着鹰派和反动派要么被关进集中营，要么长眠六英尺之下，再也没有人来在德国人的心中煽动纳粹主义的烈火。当暴乱平息，人民大厅的大厅变得寂静无声时，施密特和四人帮需要再次坚持度过德国最大的挑战。"
 GER_kurt_georg_kiesinger_short: "库尔特·基辛格"
 POLITICS_KURT_KIESINGER_DESC: "库尔特·格奥尔格·基辛格是在柏林读法律的学生，后来被征召入伍加入德国国防军。基辛格选择了加入约阿希姆·冯·里宾特洛甫领导的外交部，担任与宣传部的联络员，并与约瑟夫·戈培尔建立了长期的工作关系。事实上，一些戈培尔最佳的广播、最长的、充满仇恨的激烈谩骂都是库尔特从他的嘴里喊出来的。然而，在里宾特洛甫出丑并且戈培尔在莫斯科遇刺之后，基辛格失去了庇护者。他在阿尔伯特·施佩尔身上找到了新的主人。\n\n尽管多年来他一直热忱地为施佩尔服务，基辛格总是知道风向随时可能变化。曾经他需要与施密特及其令人讨厌的自由派建立关系。曾经他需要抱着不确定的希望，在充满烟雾的房间里与那些认为施佩尔太软弱的人达成交易。但现在，随着东方的灾难，风终于变了。没有更多的底牌可抽了。他必须打出手中的牌，否则就会像“四人帮”一样被抛入历史的垃圾堆。他能做的只有巩固权力，消除对手，并尽力挽救局势。"
 POLITICS_HANS_SPEIDEL_2_DESC: "汉斯·斯派达尔长期以来被视为忠诚的典范，一个民族主义者，他无论对国家对错都坚守不移。然而，这种看法在东欧的灾难中彻底破灭。\n\n斯派达尔在第二次世界大战期间表现出色，尤其是作为隆美尔的参谋长。他几乎独自阻止了党卫军的政变，并后来击败了舒尔纳夺取国防军的第一次企图。然而，这种荣誉之网并不能拯救帝国于水深火热之中。德国正在流血，遍布弹痕，只有元首斯派达尔才能拯救它。\n\n斯派达尔元帅已经放弃了他的职位，放下元帅的头衔，承担起独裁者的重担。他的意图很简单：净化德国的纳粹主义，这个毁灭德国的意识形态，不惜一切代价维护帝国，并与那些想要割除德国雄性特征的人作斗争。尽管纳粹党的残余势力反对他，但这位前元帅得到了大多数国防军的支持，甚至还有一部分筋疲力尽、浴血奋战的民众站在他的一边。斯派达尔是一个小岛，身处汹涌的大海中，每天潮水都在不断上涨，虽然他的行为高尚，但他面临着巨大的困境。"
 GER_gehlen_party:0 "纳粹党 - 军事警察"
 GER_gehlen_party_long:0 "德意志国家社会主义工人党 - 战略支持警察"
 GER_Germany_War_Tree:0 "第二次西俄战争德国战争国策树"
 GER_Der_Letzte_Krieg:0 "最后的战争"
 GER_Der_Letzte_Krieg_desc:0 "在最终确保我们对重塑后的欧洲拥有控制之后，我们认为我们千年帝国会是安全的。事实证明我们错了。经过动荡的六十年代，似乎七十年代只带来了一件事：战争。斯拉夫人正在为夺回他们的土地而归来，并且他们带着复仇的心态。\n\n我们必须动用我们能够调动的每一项资源，阻止这股俄罗斯的浪潮，让他们重新退回到属于他们的乌拉尔地区。我们的工厂将再次转变为战争机器。我们的人民将被锻造成武器，击败斯拉夫人的冲击，拯救我们的文明免于毁灭。这是本世纪的冲突，我们必将从中崛起为胜利者！"
 GER_Die_Grenzwacht_Hielt_Im_Osten:0 "边防军在东方停驻"
 GER_Die_Grenzwacht_Hielt_Im_Osten_desc:0 "我们低估了我们的敌人。蛮族冲击着我们的城门，有那么一瞬间，我们的城门似乎在崩溃，蛮族涌入我们的殖民地。但凭借德国意志和力量的奇迹，边境卫兵坚守住足够的阵地，阻止了进攻。但现在不是冷漠的时候，现在是行动的时候。\n\n如果我们要扭转这场战争的局势，我们必须支持前线的战士们。东方是我们必须守住的阵地，我们必须付出血汗和眼泪，确保它仍然属于我们。德意志陆军是这个地球上有史以来最伟大的军队；让我们向这些斯拉夫人展示什么是雅利安人的意义。"
 GER_Invigorate_The_Reich:0 "振兴帝国"
 GER_Invigorate_The_Reich_desc:0 "在潮水不利于我们的情况下，国内支持比以往任何时候都更为重要。德国的意志是取得胜利的关键因素，我们必须提醒人们我们光荣文明的价值，以及失去它对斯拉夫威胁的代价。\n\n我们将在全国范围内举行集会，党员们会发表激情澎湃的演讲来激发群众的热情，让他们记起我们以前的胜利。我们将发起宣传活动，制作影片，向人们展示这些威胁要摧毁我们数十年来建立的一切的怪兽的恐怖之处。在这场战争中一切都岌岌可危；我们必须让人们记住他们的使命。"
 GER_Every_Last_Contract:0 "每一份合同"
 GER_Every_Last_Contract_desc:0 "我们的战争机器又遇到了另一个问题：我们根本没有足够的物资来支援前线。尽管我们竭尽所能通过工厂增加生产力，但我们的后勤补给过于分散，协调性不够，无法为军队提供足够的物资。我们必须立即找到解决这个问题的方法，幸运的是，我们还有一些绝招可以缓解这个问题。\n\n由于工厂现在欠我们一个人情，因为它们新近创造了不用支付工资的劳动力，我们可以接下我们勤奋的公司能提供的所有合同，并将其全部用于军事用途。眼下再没有比俄罗斯熊闯进我们家门的威胁更大的了，我们为之努力奋斗的一切都岌岌可危。通过让一些关键人物受益，从喂养士兵的勺子到最复杂的技术武器系统，我们的军队很快就能恢复到最佳状态。"
 GER_Mobilize_The_Veterans:0 "动员老兵"
 GER_Mobilize_The_Veterans_desc:0 "随着我们掌握的人力减少和斯拉夫人的数量增加，我们需要填补空缺。我们最有希望的是来自本世纪前几次战争的老兵，特别是那些在第一次西俄战争中有经验的人。然而，并非所有的老兵都一样，因此我们将首先根据他们的经验、对现代战术的了解以及整体身体健康状况对他们进行分类。\n\n根据他们的能力，他们将获得帝国最先进的武器，或者是我们之前冲突中的剩余装备。无论他们是利用训练再次回归前线部队，还是将他们的训练传授为军事教官，他们都将在为祖国服务方面表现出色。"
 GER_Die_Ostlegion:0 "东方军团"
 GER_Die_Ostlegion_desc:0 "随着战斗的持续，我们的士兵已经磨损到了他们的最弱点，我们再次需要士兵照顾东部事务。就像我们在巴巴罗萨战役和第一次西俄战争期间所做的那样，我们将招募俄罗斯人和其他愿意帮助我们打退熊军的合作者。我们将根据他们对第三帝国的忠诚度、对民族社会主义事业的忠诚度、参战意愿以及整体健康状况来组织这些新兵。就像我们对老兵进行分类一样，我们的合作者将获得现代装备或者剩余装备。\n\n斯拉夫人的大军将不得不首先经历他们自己的考验，大规模的征兵将用于修补我们的阵线，阻止他们的前进。然后，他们将不得不面对一个事实，即并非所有人都希望陷入野蛮状态，因为他们将面对我们认为是名誉雅利安人的忠诚斯拉夫部队。只能希望斯拉夫人的大军会在我们忠诚的东方军团之前崩溃。"
 GER_Pressure_The_Corporations:0 "向企业施压"
 GER_Pressure_The_Corporations_desc:0 "看起来我们所谓的“忠诚”企业在很大程度上未能满足我们军队的需求，而这似乎源于他们与国家缺乏合作。因此，我们可以开始使用他们懂得的语言，最终别无选择，只能尊重：恐惧。\n\n我们可以首先迫使这些企业的关键巨头将其所有权交给国家，并从这些公司中清算我们需要的任何资源。逼迫关闭的威胁将确保他们永远不能对我们的要求说“不”。由于我们还让奴隶经济再次兴盛，我们还可以操纵自由工人流入这些公司，让他们在服从我们的每一个命令之前被饿死。无论我们做什么，都必须立即处理这个问题。"
 GER_Die_Wahrheit_ist_der_Feind:0 "真相是敌人"
 GER_Die_Wahrheit_ist_der_Feind_desc:0 "士气是润滑德国战争机器齿轮的润滑剂；如果我们自己的士兵缺乏精神和纪律，人力和枪支就毫无意义。士气问题延伸至广大民众。如果我们要在这场对抗斯拉夫威胁的战争中取得胜利，平民百姓的忠诚是必需的。虽然我们与俄罗斯入侵者的战争局势脆弱，但人民无需知晓。\n\n我们将操纵信息流，只展示我们取得的胜利。我们将阻止任何战败的消息传达到国内。任何说出不同意见的人都将因叛国罪被逮捕。人民不知道的事情不会伤害他们。"
 GER_Ein_Totaler_Krieg:0 "一场总体战"
 GER_Ein_Totaler_Krieg_desc:0 "随着战局不利，我们不得不面对一个可怕的认识。我们与失去我们心爱的大日耳曼国越来越近。我们的祖国。这场战争已变成一场生存之战，为了生存，我们必须竭尽所有努力，确保德国人民最终获得总胜利。在最后一次为胜利的努力中，我们将发起一场全线进攻，打破敌人的军队和士气。\n\n德国人民必须遵循元首的命令，全天候投入战斗，为了胜利付出一切。我们将动用宣传机器，让人民渴望全面战争。如果必要，我们将将东方所采取的必要措施，扭曲为斯拉夫人的战争罪行。这将提醒德国人民履行他们更加全面和激进的战争义务，超越世界所能想象的一切。现在，要么胜利，要么死亡。"
 GER_Unleash_The_Wolves:0 "释放狼群"
 GER_Unleash_The_Wolves_desc:0 "如此规模的战争需要我们拥有丰富的资源储备，以便在需要时调用。我们始终可以依赖的一个资源就是我们的游击运动：狼人游击队。这些勇敢的德意志儿女在俄占领的莫斯科地区崭露头角，显示出与普通俄罗斯士兵相当的对手实力。为了供给他们进一步对抗俄军，我们必须确保这些力量装备精良，能够应对俄军中的最强部队。\n\n我们可以派遣几名顾问和武器进行空投，然后从那里开始在莫斯科地区建立游击网络。如果一切顺利，我们将能够迅速干扰敌人的进展，阻止他们巩固已经获得的地盘。当谈到夺回我们应得的一切时，俄罗斯人将付出巨大的代价。"
 GER_More_Hands_In_The_Factories:0 "更多人手进工厂"
 GER_More_Hands_In_The_Factories_desc:0 "随着第二次西俄战争的开始，我们的经济暴露出一个明显的弱点。这场冲突所需的需求表明，即使拥有我们所有的工业实力和资源，我们仍然缺少足够的工人来维持我们的机器运转。由于战争要求我们最忠诚的公民前往前线，我们必须回归那些使我们在第一次战争中取得最终胜利的方法：奴隶制。\n\n我们将采取合法的步骤和必要的安排，使我们最勤奋的企业能够再次雇佣那些“不受欢迎的人”，以提高工厂的整体产出。当然，东线的一些村庄将会被清除，但让潜在工人的命运落入我们的亚洲劲敌之手是愚蠢的。一旦这项政策在整个帝国范围内生效，我们可以预期在一个月内会有多达十万名奴隶，他们将从我们的东部边疆地区新近带来。"
 GER_End_The_Tiresome_Partisan:0 "碾碎烦人的游击队"
 GER_End_The_Tiresome_Partisan_desc:0 "就像我们与狼人游击队一样，俄罗斯人在我们的东部领土支持了一些游击队组织，这些组织日益成为我们肩上的一块心头大石。我们将进入每个村庄、每座城市，找出这些游击队员，从源头消灭他们。我们的每一位合作者都要在这些鼠辈侵蚀我们战斗力之前扑灭它们。\n\n首先，我们将发布通告，要求东部的男性寻找游击队员，否则将被标记为其中之一。我们将通过设立特别的旅团负责强化这些通告，逐户挨家挨户搜捕尽可能多的人。一旦找到这些鼠辈，我们将如常处置：在每份报纸上、每个灯柱上展示他们被肢解的尸体，以示惩戒，以警戒所有抵抗帝国的人。此外，我们将为每个特别旅团制定任务配额，确保东部不剩下一丝游击队员。"
 GER_Declaw_The_Bear:0 "给熊除爪"
 GER_Declaw_The_Bear_desc:0 "正如计划，我们已经夺回了我们领土的一部分。日耳曼尼亚再次免受外来入侵之扰，现在我们必须坚守阵线，防止俄罗斯军队进一步入侵。我们将建立起一道防线，这是一道熊将在其抗拒我们文明进程的征途中折断爪子的防线。曾经，俄罗斯人以为他们可以行进至莫斯科，夺取我们凭借国防军的鲜血所赢得的一切。我们将他们击退，今后我们依然将如此。\n\n决不能退却。防线上的所有指挥官将收到命令：不许后退一步。我们构建的防线将是保护我们文明的盾牌，我们将迫使俄罗斯人坐上会谈桌前，否则我们将跨越防线，亲手斩断熊的头颅。"
 GER_Uber_Alles:0 "德意志高于一切"
 GER_Uber_Alles_desc:0 "东方复兴的巨熊已被粉碎。坦克和战斗机击退了它们野蛮的军队和精神，让它们的余烬散落一地。我们在欧洲的至高无上已无可争议，与此同时，对民族社会主义力量的信仰也焕然一新。随着这次重大胜利，我们已经弥补了在第一次西俄罗斯战争中的失败，我们已经通过烈火和钢铁证明了雅利安种族远远优于基层斯拉夫下等人。数十年来，德意志人民首次欢庆的氛围笼罩着这片土地。人群云集柏林街头，迎接归来的英雄。我们的帝国现在安全稳固，将永世长存。"
 GER_Verteidige_das_Vaterland:0 "保卫祖国！"
 GER_Verteidige_das_Vaterland_desc:0 "我们的帝国命运和领土完整性岌岌可危。40年代，在我们击溃苏联时，我们证明了自己的强大，但50年代我们无可置疑的实力在我们的部队勉力阻止住红军余孽的攻势时崩溃了。然而，我们设法维持了我们的帝国和对欧洲的控制。但现在，随着俄罗斯人再次从东方涌现，我们的帝国存亡将由这场最终战争决定，这是一场我们不能承担失去的战争。"
 GER_The_Means_of_War:0 "战争的手段"
 GER_The_Means_of_War_desc:0 "帝国的巨企长期以来牢牢掌握着我们的政治，他们的影响渗透到德国生活的方方面面。但现在，随着我们的祖国大地敞开，面临着入侵的威胁，没有一个能通过政治手段阻碍我们的军事行动。那些抵抗的人将会受到严厉的处理。虽然这可能会在战后削弱我们的经济，但我们必须对这些企业施以严格的控制；他们必须动用他们手边的所有资源来争取我们的最终胜利。"
 GER_The_Final_Line:0 "最后防线"
 GER_The_Final_Line_desc:0 "斯拉夫部队已突破我们的外围防线。德国国防军正在撤退。我们的部队在每次反攻中都遭受重创。他们正在逐公里地将我们推回本土边界。我们不能容许这种局面持续下去。我们必须坚守阵地，挽救我们剩余的部队，为保卫祖国展开最后的防御，不惜一切代价。普通士兵，德意志的英雄，是我们对抗野蛮和巨熊的残暴的最后防线。"
 GER_Into_the_Ostfront:0 "向东线前进"
 GER_Into_the_Ostfront_desc:0 "一次又一次，德意志国防军在战场上被斯拉夫军队击败。蛮族几乎已经来到我们的门前；我们必须捍卫我们的文明。我们将进行最后一次伟大的反攻，动用德意志国防军和空军的所有资源，将斯拉夫的威胁驱逐回去。现在是千年帝国的巨大考验。我们的边境将无论代价如何都被重新纳入我们的指挥之下。让帝国的最终命运在俄罗斯的平原上得以决定。"
 GER_Wolves_of_the_Fatherland:0 "祖国之狼"
 GER_Wolves_of_the_Fatherland_desc:0 "俄罗斯熊已经深入我们辛苦夺回的土地。他们认为这片土地的人民会张开双臂欢迎他们，以及这片土地仍然属于他们。他们这样想是愚蠢的。我们将号召所有的德国人 - 无论是士兵还是殖民者 - 在他们的阵线后拿起武器。无论是切断通信、骚扰他们的补给线，还是暗杀他们的占领部队，我们的狼群将在莫斯科的每个角落里追捕他们。"
 SWRW_GER_Endsieg:0 "最后的胜利"
 SWRW_GER_Endsieg_desc:0 "我们在欧洲取得了最终的胜利。涌入我们领域的斯拉夫人已被驱逐回乌拉尔山脉。我们的影响领域虽在某些方面不稳定，但仍然牢固。我们的新秩序已获胜，民族社会主义统治已在从低地国家到乌拉尔山脉的每个欧洲角落得以巩固。德国人民再次对党抱有信仰，德意志民族再次团结在政府周围，继续千年帝国的事业。"
 GER_heusinger_party:0 "纳粹党 - 国防军最高指挥部"
 GER_heusinger_party_long:0 "民族社会主义德意志工人党 - 国防军最高指挥部"
 GER_schmidt_party:0 "自由民主党"
 GER_schmidt_party_long:0 "自由民主党"
 GER_national_reconstruction_committe_party: "国家重建委员会"
 GER_national_reconstruction_committe_party_long: "国家重建委员会"
 GER_economic_collapse:0 "经济崩溃"
 GER_economic_apocalypse:0 "经济浩劫"
 GER_economic_apocalypse_desc:0 "在第二次西俄罗斯战争中，德国彻底失败了，失去了对帝国核心的控制。数十年的基础设施建设、经济投资和资源提取几乎在一夜之间消失，摧毁了依赖东方进口的关键产业，并使我们的经济陷入了可能永远无法恢复的萧条之中。"
 GER_the_god_of_war:0 "战神之殇"
 GER_the_god_of_war_desc:0 "我们可怕的德国国防军，一支曾经的强大之师，其强大和威力曾经让整个世界屈服，并征服了比它庞大数倍的势力，如今躺在我们脚下，已然陨落。被“次级”生物的剑所穿透，任由其腐朽化为虚无。曾凭借着力量成为战争之神的德国，曾是媲美罗马和马其顿帝国的霸主。如今，我们成为了虚无之神。"
 GER_the_werewolf_threat:0 "狼人游击队的威胁"
 GER_the_werewolf_threat_desc:0 "我们年轻的民主国家内滋生着一个肿瘤，它在每一天逝去的时光中缓慢生长，并在整个共和国蔓延开来。这些狼人不仅对德国构成威胁，也威胁着整个欧洲。如果我们无法将它们从我们的体制中清除，那么我们的保护与自由将不可避免地在反应主义的恐慌中逐渐消逝。"
 GER_our_reich_of_ash:0 "灰飞烟灭的帝国"
 GER_our_reich_of_ash_desc:0 "我们辉煌的帝国已经被俄罗斯巨熊冲垮，这是我们曾经认为不可能发生的失败。然而，不仅仅是斯拉夫军队摧毁了我们强大的帝国；我们还遭受了帝国内部的背叛！\n\n这些叛徒不能被允许战胜雅利安精神。敌人在德意志祖国的大门口喧闹，但正如凤凰必须死去才能重生一样，帝国也将从灰烬中崛起，达到前所未见的高度。"
 OZW_one_last_fight:0 "最后的战斗"
 OZW_one_last_fight_desc:0 "命运之火再次吞噬了祖国，就像十年前一样。然而，历史选择了为我们重复而不是押韵。不久之后，南部的军警区和最高统帅部变得寂静，这次我们知道原因，并已准备迎接风暴。我们再次与那些拒绝学会它们位置的波兰“次人种”碰撞，只不过这一次，我们将确保彻底结束他们任性的十字军行动。"
 GMA_flames_of_their_reckoning:0 "他们的复仇之火"
 GMA_flames_of_their_reckoning_desc:0 "我们是少数幸存下来的人，每走一寸土地都让敌人付出代价。\n\n但胜利确实太遥不可及，我们最终走向了毁灭，因为德国国防军内的腐化已经被允许存在得太久了。我们原以为会以英雄的姿态归来，但却成了党派的替罪羊。纳粹党背弃了那些为保持德意志之国生机而努力付出一切的人。我们被剥夺了退休金，荣誉被剥夺，成为了帝国中因为所谓失败而不受欢迎的子民。\n\n但他们愚蠢地以为我们会咬紧牙关忍气吞声，事实上，我们只是在等待时机，密谋着。现在，第二次内战已经降临。对于我们中的老兵而言，唯一剩下的就是保护德国，不再让她受伤害。祖国将会重获和平，曾经指挥我们的那些毒蛇终将受到应有的制裁。"
 POL_one_last_chance:0 "我们最后的机会"
 POL_one_last_chance_desc:0 "起来吧，波兰的兄弟姐妹们！历史赋予了我们另一个机会，也是最后的机会，来恢复波兰人民的自由。我们曾尝试过，但最终未能坚持下去。华沙和克拉科夫或许再次失落，但波兰的种族和身份依然将存在。当第二次内战爆发时，我们挖出了步枪和手榴弹，展开了我们的旗帜，再次握起武器，反抗压迫，为自由而战。现在是我们最好的时刻。实现红色和白色梦想再次飘扬在我们家园上的最后机会。"
 SWRW_MCW_extra_defense:0 "额外防线"
 SFK_freikorps_voran:0 "自由军团，前进！"
 SFK_freikorps_voran_desc:0 "一场红色瘟疫再次笼罩了德国人民，自由军团不会坐视不管，绝不让这种妄想变为现实。我们，德国人民，再次呼吁兄弟们挺身而出，对抗这文明之疮，最终将我国从如此扭曲的思想中解救出来。\n\n我们也不应忘记我们的领袖的失败。捍卫我们自豪的国家免受社会主义者、共产主义者和自由派的影响，是我们的责任，也仅属于我们的责任，不惜一切代价。\n\n自由军团，继续前进！"
 HRC_forty_years_of_rage_unleashed:0 "四十年的愤怒终得释放"
 HRC_forty_years_of_rage_unleashed_desc:0 "长达四个漫长而艰苦的十年，德国人民在无情的纳粹统治下被钢铁镣铐所束缚。今天，全世界将见证四十年滋养的仇恨将呈现何种景象。\n\n我们的力量坚定，使命明确，要彻底打破压迫的枷锁，创造一个真正自由平等的德国国家。我们的压迫者将面对千万人的愤怒，我们将铸就马克思设想的繁荣平等社会。"
 SRH_red_dawn:0 "赤色黎明"
 SRH_red_dawn_desc:0 "革命并没有随着苏联的解体而消亡，它只是余烬未尽。如今，卡尔的一个由无产阶级领导的德国梦想将在全球范围内占据统治地位，各国的工人们将再次能够相信他们的压迫即将结束。\n\n前方将是漫长而艰苦的战斗，许多生命将会失去，然而我们不能失败。世界各国的工人们依赖我们此时此刻的成功。让他们失望无疑意味着卡尔的全球革命梦想将在此消亡，无限期地。"
 RPR_red_star_reborn:0 "红星重生"
 RPR_red_star_reborn_desc:0 "人的心灵深处潜藏着对受压迫者的同情。\n\n这在对抗民族社会主义的革命中得以展现。我们德国的工人打破了他们身上的压迫枷锁。我们周围的民众谴责纳粹主义作为一种充满怨恨的意识形态。如果给予更多呼吸空间，每个德国人都将拥有那股革命精神。这一信息已经深深扎根于我们的先祖、我们自己和我们的子孙，在我们的血脉中流淌。我们不能让他们的死去白白付出。\n\n工人们，站起来！"
 REG_germanys_last_hope:0 "德意志最后的希望"
 REG_germanys_last_hope_desc:0 "随着民族社会主义的腐朽尸体在第二次西俄战争的压力下崩溃，民主焕发出新的生机。德国人民对民族社会主义虚幻的梦想感到彻底幻灭。\n\n然而，就在民族社会主义自我撕裂的时候，另一个威胁正在德国上空逼近。红色威胁再次浮现。我们必须与两者作斗争，并战胜他们扭曲的理念。自由必将统治！"
 GER_the_second_german_civil_war:0 "第二次德国内战"
 GER_the_second_german_civil_war_desc:0 "成千上万名国防军士兵放弃了他们的岗位，前往未知的地点。共产主义、民主和民族社会主义在一场决定德国命运的战争中彼此对抗。德国将从这场可怕的冲突中崛起，或永远陷入废墟，而无论结果如何，整个欧洲都将感受到其余波。"
 OZW_the_second_german_civil_war:0 "第二次德国内战"
 OZW_the_second_german_civil_war_desc:0 "成千上万名国防军士兵放弃了他们的岗位，前往未知的地点。共产主义、民主和民族社会主义在一场决定德国命运的战争中彼此对抗。德国将从这场可怕的冲突中崛起，或永远陷入废墟，而无论结果如何，整个欧洲都将感受到其余波。"
 REG_the_second_german_civil_war:0 "第二次德国内战"
 REG_the_second_german_civil_war_desc:0 "成千上万名国防军士兵放弃了他们的岗位，前往未知的地点。共产主义、民主和民族社会主义在一场决定德国命运的战争中彼此对抗。德国将从这场可怕的冲突中崛起，或永远陷入废墟，而无论结果如何，整个欧洲都将感受到其余波。"
 SIL_the_second_german_civil_war:0 "第二次德国内战"
 SIL_the_second_german_civil_war_desc:0 "成千上万名国防军士兵放弃了他们的岗位，前往未知的地点。共产主义、民主和民族社会主义在一场决定德国命运的战争中彼此对抗。德国将从这场可怕的冲突中崛起，或永远陷入废墟，而无论结果如何，整个欧洲都将感受到其余波。"
 HRC_the_second_german_civil_war:0 "第二次德国内战"
 HRC_the_second_german_civil_war_desc:0 "成千上万名国防军士兵放弃了他们的岗位，前往未知的地点。共产主义、民主和民族社会主义在一场决定德国命运的战争中彼此对抗。德国将从这场可怕的冲突中崛起，或永远陷入废墟，而无论结果如何，整个欧洲都将感受到其余波。"
