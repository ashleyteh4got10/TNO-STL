 CZE_Albert_Schnez:0 "阿尔伯特·施奈茨"
 POLITICS_ALBERT_SCHNEZ_DESC:0 "许多人说幸运眷顾勇者，但在阿尔伯特的情况下，它眷顾了耐心。\n\n阿尔伯特·施奈茨生活并为人服务，从魏玛共和国时期一直延续到帝国时代。从他在帝国军队的初次加入，到在第三帝国的陆军中逐渐崭露头角，他通过与共产主义者的战斗一步步攀登了成功之梯，既是年轻人在东部胜利中的战士，又是后来的一名正式将军。通过丰富的经验和荣誉，他已经准备好退休，满意于自己创造的职业生涯。然而，在俄国人东归重掌东方之际，一切都改变了。\n\n施奈茨非常愿意再次担任他的职务，证明自己作为指挥官的价值，期待再次获得胜利。然而，随着德国人遭受失败，俄国人庆祝他们的成功，施奈茨在随后的动荡中重新考虑了自己的选择。也许他可以接受现实，融入新政府，暂时保持低调，不要为祖国再次陷入内战而烦恼，尤其是当他恰巧驻扎在波希米亚时。\n\n在那里，施奈茨和他的同伴纯粹是为了捍卫他的小领地，一个他宣称没有冲突的地方。德国在战斗平息后不久，必然会找到新的主人，但施奈茨不会参与其中，他只是决定等待、观望，并保护自己的土地。"
