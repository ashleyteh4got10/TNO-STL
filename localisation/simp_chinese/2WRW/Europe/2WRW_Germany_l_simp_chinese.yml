 OZW_a_nation_in_flames:0 "战火纷飞的国家"
 OZW_a_nation_in_flames_desc:0 "随着斯拉夫军队意想不到地击败了帝国，异议和起义的传言越来越高涨，已经到了无法阻止的高潮。曾经被认为已经彻底扑灭的意识形态如今却像无尽的害虫一样从木桩中涌出。帝国正在撕裂，就像将近十年前一样，灾难性地破裂开来。德国再次因战争之火而燃烧，作为这片祖国的兄弟、父亲和儿子们正在无法逃脱的烈焰中丧生。"
