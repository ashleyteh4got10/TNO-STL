l_simp_chinese:
 Deutsch_Willy_Brandt:0 "维利·勃兰特"
 POLITICS_DEUTSCH_BRANDT_DESC:0 "赫伯特·恩斯特·卡尔·弗拉姆于1913年12月18日出生在吕贝克市。他有一个平静的童年，完成了中学毕业考试，并帮助他的单身母亲和继父渡过了30年代的经济困难。然而，不久之后，纳粹的仇恨和毁灭之影笼罩了弗拉姆的家乡。为了避免被盖世太保迫害，他躲藏起来，并采用了现在著名的化名维利·勃兰特。\n\n随着时间的流逝，纳粹的阴影不仅笼罩了德国，而且笼罩了整个欧洲和世界。勃兰特感到了与他们的靴子对抗的使命感，在多年的默默反对之后，他成为了“帝国旗帜-§q黑§!-§V红§!-§w金§!”的地下抵抗运动的领导人，这是魏玛时期反对纳粹统治的存留下来的组织，长期被认为已经消亡。从德国最偏远的村庄到最广阔的城市，他的运动勇敢地面对纳粹的威胁，并抵抗其致命的攻击。那些属于帝国旗帜的人们失去了并遭受了痛苦，而那些崇拜那个邪恶十字的人们则知道他们的事业太神圣，不能放弃。\n\n纳粹党在东方的灾难后陷入混乱，勃兰特和他的盟友已经掌握了权力，并战胜了仇恨的幽灵。现在，作为新德国的领导人，他必须引领她进入一个新的政府时代，为人民，以及三个简单的原则：\n\n\n\n§q团结§!，§V正义§!和§w自由§!。"
 GER_Willy_Brandt_German_Spring_long:0 "德国社会民主党"
 GER_Willy_Brandt_German_Spring_short:0 "德国社会民主党"
 reich.2000.t:0 "俄国人要求我们投降"
 reich.2000.desc:0 "随着战争态势的转变，东线战场发生了重大变化，德军最高统帅部面临着来自斯拉夫大军的严峻最后通牒。他们的政府提出了一系列投降要求，并以东方的损失为支持。德国的形势岌岌可危，必须作出决定。"
 reich.2000.a:0 "边防卫士坚守在东方……"
 reich.2001.t:0 "俄国人投降了！"
 reich.2001.desc:0 "不出所料，东边的斯拉夫蛮子被击溃了。 他们可怜的军队被雅利安士兵的战靴完全碾碎。 不幸的是，这些野蛮人正在准备动用他们的核武器和我们同归于尽。 为了德国的安全，我们应该接触他们的政府，并且在他们把世界卷入黑暗之前给他们一个“仁慈的”投降条件。"
 reich.2001.a:0 "告诉他们，我们要乌拉尔山以西的所有土地，不接受妥协。"
 reich.2004.t:0 "德国做了一个小错误"
 reich.2004.desc:0 "我们的祖国，曾在二战中取得胜利，赢得了“欧洲之主”的称号，但如今却陷入了灾难性的衰落。复兴的俄罗斯击败了纳粹政权，迫使德国放弃东欧的殖民地，并让我们的国家陷入经济绝望。随着国家濒临全面崩溃的边缘，我们必须迅速决定未来的领导层。德国现任元首和纳粹党的领导者会继续掌权？还是会有新的领导者从失败的灰烬中崛起？选择十分严峻，后果将决定这个破碎帝国的命运。"
 reich.2004.a:0 "保留克洛普佛"
 reich.2004.b:0 "保留盖伦"
 reich.2004.c:0 "保留瓦尔德海姆"
 reich.2004.d:0 "军国主义者政变"
 reich.2004.e:0 "棒棒哒四人帮？？？"
 reich.2005.t:0 "Speer dub!!!"
 reich.2005.desc:0 "终于，在经过无数个月为欧洲命运而进行的激烈血腥战斗之后，我们再次战胜了东方的威胁。当德国人民自豪地庆祝我们的胜利时，当德国国防军的战靴一直踏到乌拉尔山时，我们的帝国通过武器的力量向世界永远证明了我们是欧洲大陆的合法主人。\n\n在我们的东面，我们战败的敌人四分五裂，日益陷入无政府状态，新宣布成立的联邦共和国俄罗斯正准备应对大规模的难民危机。自由国家组织和共荣圈都敬畏地注视着我们的胜利，冷战的天平在可预见的世纪里不可逆转地向我们倾斜。而在团结协定本身，我们的实力和繁荣达到了新的高度，石油危机和奴隶起义的苦难最终成为历史。\n\n我们也许不知道未来几年会发生什么，但可以肯定的是，我们将满怀信心和力量向前迈进，因为俾斯麦的儿女们已经明白，当今的重大问题不是靠演讲或多数票就能解决的......"
 reich.2005.a:0 "……唯有铁与血"
 reich.2005.b:0 "……唯有铁与血"
 reich.2006.t:0 "沉重的王冠"
 reich.2006.desc:0 "在办公室的温度变得难以忍受时，格哈德·克洛普佛解开了衬衫领子。他擦去额头上的一层汗水，伸手拿起了他的威士忌。这位“欧洲之主”将那铜色的液体倒入玻璃杯中，这已经是至少第五杯了。这杯酒像熔化的矿渣一样灼烧着他的喉咙。克洛普佛重重地叹了口气，然后看向一张展示整个欧洲的地图；他的帝国。或者更确切地说，剩下的那一部分。克洛普佛用手握住威士忌瓶的瓶颈，当他想到他所获得的一切被那些斯拉夫人和他们的犹太傀儡主人夺走时，内心充满了愤怒。愤怒之下，克洛普佛将酒瓶猛地扔出，砸碎在那张精美绘制的地图上，酒液如同伤口流下的血滴在羊皮纸上。\n\n“盖伦、豪辛格、瓦尔德海姆……”他喃喃自语，然后将这些名字与“犹太人”、“叛徒”或者“俄罗斯间谍”等词汇联系在一起。他们都在密谋。他深知这一点。他自己的内阁成员，他自己的知己。他们看到了墙上的文字。他们嗅到了水中的血腥味，是他的血腥味，并且正在策划如何吞食那象征着元首职位的寓言尸体。\n\n“你这些该死的叛徒……你们全都是！”他大声咆哮着，在激动之下，猛地扫掠掉桌上散落的文件、钢笔和电话设备。刺耳的碰撞声只让他更加愤怒，他开始以最激烈的方式摧毁自己的办公室。这从未是他的初衷。他本应该继承鲍曼的职位，引领帝国进入一个新的黄金时代，威慑那些肥胖的美国资本家和贪婪的日本银行家。甚至连他自己都无法预测俄国人会走出他们的洞穴，摧毁一切。如今他所剩无几，甚至这微不足道的余地也在对抗他。布尔什维克和民主运动在他的街道肆虐，几乎让人联想起威玛共和国的日子。克洛普佛需要再喝一杯来摆脱这个念头，然后他才想起，他的解药被粘在了他破裂的地图上。\n\n他拉开桌子的一个抽屉，把手枪和氰化物药丸盒移到一边，拿出了一张马丁·鲍曼的照片。他的导师，他的榜样，他的领袖……"
 reich.2006.a:0 "克洛普佛希望他从未见过那个人。"
 reich.2007.t:0 "拯救德意志"
 reich.2007.desc:0 "勃兰特深吸了一口气，试图平复那些在他心头掀起的不安情绪。在他周围，他匆忙搭建的柏林深处指挥部充满了活力。所有人都专注于一个简单的目标：拯救德国。这是他多年等待的时刻。以德意志之名所犯下的那么多恐怖行径，那么多男男女女在自己同胞手中丧命，只为追随一个疯子的理念。如今，他有机会开始修正过去的错误，只要他有勇气把握这一刻。而他将抓住这个机会。\n\n“我们的人是否就位？”他看向他的一名中尉，当他看到点头时，他感到……他感觉到了什么？对所有暴行的愤怒？还是害怕，害怕这一切不会成功？某种方式，克洛普佛已经察觉到，他会逃脱制裁？勃兰特不知道。他所知道的是，他们别无选择。“告诉士兵们开始行动。”\n\n城里，民兵指挥官们正在传达命令。他们将夺取城市的关键区域，控制兵营和通讯中心，最重要的是，他们将确保人民大厅的安全。勃兰特不得不提醒自己深呼吸。他告诉自己，这些才是真正的德国儿女。他们将坚持到底。\n\n在中尉再次走近他之前，时间似乎过去了很久。“先生，我有一份来自前线的报告，\"他开始说。\"我们已经确保了所有目标。人民大厅已经在我们的控制之下。柏林已经安全了。”\n\n勃兰特松了口气，紧张感离开了他的身体。他们做到了。勃兰特知道前方还有许多艰难的日子，但凭借这一举措，他们可以开始解构腐朽的帝国结构，将民主重新带回德国。“谢谢，中尉。谢谢大家！”他提高了声音，对聚集在一起的人说道。“没有你们的勤奋和努力，我们仍然会生活在民族社会主义的指导下。你们都是德国的英雄！”\n\n“先生，还有一件事，”中尉开口说道。“克洛普佛还没有被找到。他可能以某种方式逃离了这座城市。”"
 reich.2007.a:0 "我们稍后再处理他。今天，希望重回柏林。"
 reich.2008.t:0 "腐烂的地基"
 reich.2008.desc:0 "叛徒们做到了。他们毁了一切。当克洛普佛从飞机上走下来，靴子踏在巴伐利亚机场的停机坪上，他脑海里只能想起勃兰特的脸，他笑着，嬉笑怒骂着帝国。他的双手紧握成拳，迅速朝等待接他去临时住所的车走去。\n\n在车内，他看到一名助手在后座等候着他。“你是来告诉我我们完蛋了吗？因为我已经知道我们完蛋了。我要下令让部队开始动员。”\n\n“已经完成了，”助手回答道。“他们已经得到命令，要击毙任何可能对勃兰特的团体表示同情的人。一旦他们的部队安全，就等待您下达命令，开始向日耳曼城前进，铲除叛徒。”\n\n克洛普佛感到一丝希望回归。是的，也许他确实有机会从这场灾难中恢复过来。“很好。我们将用我们的靴子粉碎这些堕落者，让整个‘民主’问题成为过去。”\n\n“还有一件事，我亲爱的元首。混乱并不局限于日耳曼城。有报道称全国各地都有起义。我们收到了东部国防军不安的消息，在东北部也有共产主义者的报告。”\n\n“共产主义者？那些布尔什维克的蟑螂以为他们可以趁着我们薄弱的时刻占便宜吗？我们会粉碎他们。彻底粉碎他们。希特勒的梦想不会因我而消逝。我拒绝成为最后一位元首。”\n\n“是的，我亲爱的元首。我会将您的命令传达给部下。”\n\n随着汽车开始驶离停机坪，克洛普佛愁眉不展地望着窗外。蛇正在他周围盘绕，蛇、叛徒和蟑螂，它们都希望在帝国垂死的尸体上大快朵颐。而正是他肩负着解决这一切的责任。"
 reich.2008.a:0 "他要么拯救德国，要么死去。"
 reich.2009.t:0 "自由戒指"
 reich.2009.desc:0 "维利·勃兰特站在人群面前，那是一群德国人民。他们不是几十年前靠着成千上万人的尸体建立起帝国的杀人犯和强盗，也不是日耳曼支撑起来的死神的崇拜者。他们是失去儿子的农民，是没有一天不被元首的目光注视着的工人。这些人曾饱受苦难，在对俄战争中失去了家园、家庭和亲人。他必须激励他们前进。超越自我。\n\n\"我的人民！\" 勃兰特喊道，\"我们曾被告知，这个帝国将延续千年。雅利安人将扛起地球的大旗，进入一个新的时代：一个德意志的时代。我的朋友们，这个时代带来了什么？我们儿子的死亡？我们的父亲？我们的兄弟？现在是时候来看看这片土地上发生了什么的时候了；使这片土地陷入动荡的瘟疫不是犹太人，也不是俄国人。而是纳粹！纳粹就像蝗虫一样侵蚀着这片土地，啃食着我们的根基。朋友们，看看我们的领导人，看看他们想让我们做什么。这就是我们自甘堕落的结果吗？世人低声谈论的怪物？这没有荣耀可言，也没有力量可言！我们曾被告知，这片土地将成为全世界羡慕的地方，而现在，它只是过去羡慕的地方。\"\n\n\"朋友们，整个帝国都是一个谎言。谎言建立在我们所有人的痛苦之上。没有面孔的人在矿井和工厂里劳作，没有希望；他们的小屋被浓烟呛得喘不过气来；他们因疾病和腐烂而消瘦，食物和水都受到感染。但希望还是有的。如果我们团结起来，元首就无法对抗我们。即使他的走狗在水中闻到他的血腥味，也不能......\"\n\n一声枪响枪声穿过人群，像石头撞击玻璃一样击穿了勃兰特的演讲。他停止了演讲，低头看向肚子上已经开始燃烧的火焰，鲜血从伤口中涌出。自由的钟声响彻了整个德国。摆脱叛徒勃兰特的自由。"
 reich.2009.a:0 "在勃兰特倒下之前，他又开了三枪。"
 reich.2010.t:0 "愤怒的火花"
 reich.2010.desc:0 "“被欺骗了！被背叛了！我们完全被我们所谓的领导人误导了！我们所有人！”一小群人聚集在一名站在码头杆顶上的码头工人周围，宣布他对民族社会主义的反抗。“相信他们关于安全稳定的谎言，无异于一个脱光衣服的皇帝！你们，德国人民，比一个不再与我们同在的疯子的胡言乱语更好！”\n\n当这名工人不断地向所有人陈述他的想法时，人群开始为他的决心和他言语中的辩护而欢呼。所有听工人讲话的人心里都充满了轻微但紧张的愤怒情绪。汉堡警察部队开始慢慢包围该男子和他的人群，试图将这群人拉入陷阱。\n\n不久之后，另一群刚刚被集体解雇的沮丧的码头工人加入了继续听该男子讲话的人群中，该男子现在开始指责已经膨胀到几十名警察的警察队伍。他再次对人群说道：“看看他们想如何处置我们？他们希望的不是倾听和聆听，而是殴打和镇压！用棍棒和子弹统治我们！他们说，‘公共秩序’ ，捍卫所谓的民主。我不相信，你也不应该相信！我们不会再容忍这些罪行！正义，为了我们所有人！”\n\n愤怒的人群涌向数量明显处于劣势的警察，尽管警察没有后援，但仍尽力坚守阵地，但无济于事。码头工人和造船厂工人造成了如此激烈的暴力场面，以至于附近的围观者也参与了对警察的殴打。其中一些人一动不动地躺在街上，而其余的警察则倒回自己的车上。剩下的唯一选择就是离开。庆祝胜利的人群将这一切的始作俑者扛在肩上，开始沿路游行，齐声高呼在整个德国恢复正义。"
 reich.2010.a:0 "事态正在失控。"
 reich.2011.t:0 "临时安排"
 reich.2011.desc:0 "疲惫不堪的杜奇克靠在身后的木椅上，尽管他很年轻，但他的脸却显得苍老而苍老。 几个小时过去了，但杜奇克、奥斯特和霍夫曼在各自提出的一个问题上仍无法达成一致。 对他们来说，这一天已经过去了，剩下的只有一个简单的事实：他们需要将德国工人从帝国的魔爪下解放出来。 杜奇克疲惫地叹了口气，回到了三个人正在进行的谈话。\n\n“我们可能在目标的具体细节上意见不一致，但至少我们可以团结起来，一劳永逸地赶走法西斯分子。” 杜奇克的目光从霍夫曼的目光转向奥斯特的目光，两人都点头表示赞同。 “因此，目前我们将停止讨论如何推进革命，转而专注于为工人而战。这意味着与民主党结盟，至少在法西斯反应得到解决之前。” 房间里再次安静下来，这句话在空气中短暂停留，重量全部压在了三个人的身上。\n\n“这确实意味着战争，鲁迪。这意味着宣布我们的意图并愿意为此流血。” 奥斯特用嘶哑的声音说道，最后一句话从他嘴里说出时，他的眼睛暂时凝视着太空。 “这将是一场赌博，但这是我们唯一的机会。我们现在不能退缩。” 当奥斯特再次向鲁迪点点头时，他的声音变得更加自信。\n\n“我们不能让革命的机会离开我们。这次会议结束后，我会让我的人做好战斗准备。你们两个应该效仿。”霍夫曼说着，抓起外套披在身上。 他立正站好，向两人行礼，然后向门口走去。\n\n当霍夫曼离开房间时，奥斯特和杜奇克静静地坐在桌旁，他们的思绪仍在处理眼前的情况。 奥斯特是第一个打破沉默的人，他站起来，把手放在杜奇克的肩膀上，把他拉回现实。 “鲁迪，你听到那个人的话了，我们得走了。”\n\n杜奇克睁大的眼睛抬头看了奥斯特一会儿，然后慢慢地从椅子上站起来，从椅子上抓起外套，和两人一起离开房间。"
 reich.2011.a:0 "光荣属于德共！"
 reich.2012.t:0 "老兵"
 reich.2012.desc:0 "这是柯尼斯堡寒冷的一天。战争从未波及德国，但俄罗斯的胜利对路德维希的家乡产生了重大影响。他的铁十字勋章并没有赢得战前他称之为邻居的人们的任何尊重或钦佩。说实话，他并没有责怪他们。本应是祖国对抗斯拉夫军队的最好时刻，却变成了每个人最可怕的噩梦。空气中弥漫着悲伤的气氛。 在这座城市的居民眼里，他们的眼睛太凹陷、太疲惫，无法为他们的父亲、儿子和丈夫哭泣。路德维希几乎希望自己是那些倒下的士兵中的一员。作为一个倒下的英雄被人们铭记比被视为一个活着的失败者要好。\n\n他从未成为他们的牺牲品，但他听到了退伍军人在战败消息传出后遭到愤怒居民暴徒骚扰的故事。当路德维希回到这座城市时，他自己被西俄罗斯的一名参加过第一次战争的老兵吐口水。老兵指着自己的铁十字勋章，对他咆哮道，一个真正的德国之子决不会允许这样的事情发生。只有死在敌人面前，他的失败才能得到救赎。路德维希就让它发生了。其他人则指责他是“腐败的政府”把他送到那里的。他唯一的愿望就是终于能再次见到自己的家。他长大的家，当他需要记住为什么他必须站起来并继续拿着步枪时，他会回想起这个家。\n\n路德维希发现的不是他的家，而是腐烂和破败。他居住的住宅区被封锁并用木板封起来。 路德维希读到了入口处的钉子：“该地产已被IG法本公司哥尼斯堡分部购买。里面的所有资产都是公司的正式财产。 如果您有疑问，请联系电话号码——”\n\n路德维希愤怒地转身走开。他所做的一切，他在严寒中守卫第聂伯河的那些夜晚，他夺去的生命……他所得到的只是一枚绶带上的奖章。他为自己的国家做出了如此多的贡献，但作为回报，他被吐口水，被言语羞辱，他自己的家也被夺走，而他所捍卫的政府却没有丝毫关心。\n\n路德维希从制服上摘下铁十字勋章，就像摘下一颗熟透的水果一样。他轻蔑地看了它一眼，然后把它扔进了泥里。"
 reich.2012.a:0 "德国真的抛弃了他们的子民......"
 reich.2013.t:0 "失散的兄弟……"
 reich.2013.desc:0 "“——由于共和国境内的不幸情况，我们深感悲痛，必须推迟发放您一万五千德国马克的养老金。我们请您等待更多的官方信件。”当库尔茨在一家酒吧的角落摊位上向坐在他周围的人大声朗读他的信时，路德维希冷笑着。\n\n“等你妈等。”库尔茨嘲笑了一声，然后把信揉成一团扔掉了。海因里希是个高高瘦瘦的男人，三十岁不到，喝了一大口饮料。“鉴于他们迄今为止对待我们的方式，我宁愿再次经历凯瑟林施塔特的防守。至少像我们这样的人受到了像人一样的对待。”餐桌上的气氛同样阴沉。所有退伍军人，所有被他们发誓用生命捍卫的社会的弃儿。\n\n“我在查科夫与伊万战斗到了最后一口气。为此赢得了十字勋章，”路德维希向大家讲述道。“我得到的回报就是我的家被封了起来，除了我那该死的制服之外，什么也没有。”\n\n其他退伍军人也有类似的故事。 英勇无畏的故事； 以德国的名义所做的一切，所有这些的结局都如此相似：贫困、被背叛、被抛弃。 沦为被剥夺了神圣荣誉的人。\n\n“事情不应该是这样的……”路德维希打破了笼罩在男人们头顶的沉闷的沉默。“我们做了所有这些壮举，甚至更多，为什么要被当作煽动者、破坏分子对待？”\n\n弗里德里希是一位沉默寡言的老兵，他终于打破了沉默。“至少还有一个人在乎我们。”他把手伸进外套，把一小叠小册子放在桌子上。所有这些人都包括相同的名字。\n\n“费尔伯？”路德维希问道：“这不是协助莫斯科撤离的指挥官吗？”\n\n弗里德里希点点头，身体又向前倾了一些。“这都是真的。我应该知道：事情发生时我是在他的指挥下。”他指着小册子封面上恩斯特·费尔伯的照片。“这个人没有忘记像我们这样的人。当俄罗斯人带走了我们所有为之奋斗的祖父时，他让我们没有失去希望。现在，他正在竭尽全力确保像我们这样的人得到我们应得的：养老金、住房和尊重。费尔伯是我们的人。当危急关头时，他将确保恢复我们的荣誉。”"
 reich.2013.a:0 "其他退伍老兵继续询问下一次集会在哪里举行。"
 reich.2014.t:0 "……如今寻得"
 reich.2014.desc:0 "路德维希与他的战友并肩作战，他们都有着相似的经历。 战争也许会夺走生命，但它却结下了志同道合的人。 这些牺牲一切却一无所获的人们，现在终于找到了共同的事业。 他们每个人都走上柯尼斯堡街头，高呼口号，要求他们有权偿还他们的服务。 他们有权受到尊重。 当他们沿着街道游行时，抗议活动引起了路人的注意。 大多数人都在嘲笑，但也有一些人表现出不温不火的同情。\n\n当一队军用卡车驶向他们的方向时，他们的抗议被打断了。 他们在前方几码处停了下来，赫尔士兵从每辆卡车上鱼贯而出。 老兵们互相窃窃私语，大多数人开始拔出手枪，举起步枪。 路德维希也在其中，他的目光直视着退伍军人对面的士兵队伍。\n\n一个胡子刮得干干净净、皮肤苍白的年轻人走到了政府军队伍的前面。 “这是非法集会！立即散去，否则将被控叛乱罪！”\n\n老兵们并没有退缩。 路德维希负责并站在他的退伍军人战友面前。 “你多大了，士兵？你在前线服役过吗？” 他喊道。\n\n士兵回答之前一阵沉默。 “二十二。而且……我没有这个荣幸。” 年轻士兵的讲话有些结巴。 路德维希的嘴角露出一丝干笑。 他让路德维希想起了自己。 他也曾是一个渴望证明自己的眼睛明亮的年轻人。 他希望自己能告诉这个男孩真相，但他知道那个时候已经过去了。\n\n“那你凭什么认为，如果我们拒绝，你就能和我们在一起。我们所有人都曾与俄罗斯鬼子作战，他们会把像你这样的小男孩撕成碎片，就像他们在宰杀庄稼一样！”\n\n老兵们都准备好了武器，瞄准了。 年轻的新兵也这么做了，但经验丰富的人却能看到对面的枪在晃动。\n\n“你竟敢反抗——” 男孩还没说完，一声枪响就响起了。"
 reich.2014.a:0 "当枪声开始扫过整个城市时，退伍军人的警告响起。"
 reich.2015.t:0 "重燃之火"
 reich.2015.desc:0 "安东尼加入战斗已经过去了几个月，他心中曾经紧紧抓住的短暂希望的火花已经开始消退。 然而，当与其他几个人一起站在一座面向检查站的山顶上时，有些事情发生了变化。 当他手里拿着火花时，他面前却升起一团火。 自从每个波兰人第一次遇到这个为憎恨他们而建立的系统以来，人们都没有感觉到、也没有听说过一场火灾。 他们都有自己的故事。 虐待的故事如此平凡、平凡。 被视为别无选择。 仿佛这就是生活，现在和永远。\n\n“好事多磨”这句话是这么说的，但这似乎从来都不是正义的。 不是波兰人。 难道只有美好的事情才会结束吗？ 邪恶会无限期地存在吗？ 问问那些在检查站被抵抗军炸弹烧死的德国人。 如果几个月前有人问巴托斯这样的问题，他的回答可能会很常见。 如果有人在几个月前问安东尼这样的问题，他的回答将会是令人耳目一新的罕见。 遇到这样的人让巴托斯感到难过，因为这样的希望在他们生活的世界里不会持续下去。\n\n当他们穿过灌木丛时，他们的举止和移动就好像人类回到了自己的根源，与自然本身结盟。 只需一枪，他们就立即从地面掩体进入检查站。 然而巴托斯一动不动地站着，看着。倾听。不是对他们，而是对收音机。他曾经咒骂过德语，当他被迫学习德语时，他咒骂得更厉害。他鄙视这种舌头，但收音机里说的很可能是他听过的最美丽的话语。\n\n“啧啧。祖国的不稳定或内战？啧啧。这是德国的末日吗？啧啧。团结协定还能存在下去吗？”\n\n说到这里，巴托斯不知道该怎么办了。 他咕哝着翻译，声音刚好让他的游击队同伴能听到，他再也无法控制自己了。 他笑了，喜悦的泪水开始从他的脸颊上流下来。 安东尼拥抱了他的朋友，因为一种在波兰几十年来从未有过的感觉开始刺穿长期以来囚禁他们的心的痛苦：一种希望的感觉。"
 reich.2015.a:0 "终结的开始，亦或是开始的终结？"
 reich.2016.t:0 "西里西亚起义"
 reich.2016.desc:0 "沉浸在地狱之中，被它的光辉所吞噬，带有纳粹标志的卡托维茨纳粹党总部已经开始追随其建筑师的道路。 由于建筑物几乎完好无损，弗里茨·托菲尔所能想到的只有玻璃破碎的声音、火焰的噼啪声和兴奋的欢呼声； 对他来说，这些就是一个人活着的目的，当肾上腺素在他的血管中涌动时，他知道这确实是帝国的终结。\n\n重新找回自己的方位后，他走到了一家现已破旧的店面前，很想和面前的人说话。 “同志们！” 他开始面对近百人甚至更多人的目光，“看看我们努力的成果已经显露出来！看看那些造成如此多痛苦的人被毁灭了！如此多的苦难！” 当他指着一面燃烧的党旗时，又一波日丹诺夫鸡尾酒击中了这座建筑，将其笼罩在明亮的火焰中，就连托菲尔这个明显的无神论者也只能将其形容为神圣。\n\n“他们认为他们的邪恶帝国是不可战胜的。他们认为它凌驾于普通民众和那些他们几十年来除了剥削之外无所事事的人之上。见证他们的错误挖掘他们的坟墓，并见证工人阶级的解放在我们眼前发生。” 他停了下来，严肃地吸了一口气。 “许多人为了我们来到这里而牺牲了。革命的兄弟姐妹们被打倒了，就好像他们只不过是待猎的猎物。但我们不是动物！我们不是猎物！我们不是革命者；我们是革命本身！”\n\n当欢呼声席卷人群时，这座从地基到屋顶都覆盖着纳粹标志的建筑开始倒塌。 当腐烂的地基被燃烧的上层建筑所取代时，暴乱者——现在人数已达数百人——发出了最后一声欢呼，他们开始呈扇形散开，蔓延到整个城市，并吞没了整个城市。"
 reich.2016.a:0 "革命终于开始了！"
 reich.2017.t:0 "下地狱吧"
 reich.2017.desc:0 "当海因茨-乔治·莱姆站在自由军团士兵面前时，风吹过他的头发。他把他们聚集在他们可以利用的最大的开放空间里，这恰好是老城外的大广场。 它们在他面前整齐地排列成一列，就像一排排麦子，只不过它们不像庄稼那样在风中摇曳。他们站得又直又高。 自豪的。 最重要的是，莱姆教会了他们要自豪。\n\n“自由军团的士兵们！” 他向他们伸出手掌，仿佛在召唤他们走向未来。 “我们伟大的祖国正处于毁灭的边缘。我们腐败的领导人浪费了我们伟大的土地来满足他们自己的贪婪欲望，让我们打败了来敲我们大门的斯拉夫军队。他们继续袖手旁观， 邪恶的犹太布尔什维克病毒在我们自己的亲属中传播，腐蚀他们走上所谓的“共产主义”道路。他们让享乐主义的自由主义者掌权；这些所谓的解放者希望让我们回到软弱和沮丧的魏玛共和国，并浪费了德国的伟大之处。\n\n“我站在你们面前，宣布每个真正的德国人心里都知道的事实：我们的身份正处于毁灭的边缘。敌人潜伏在我们周围，所有人都为了自己的自私目的而试图摧毁这个帝国。只有我们 我们将阻止阴谋者，他们密谋毁灭我们的种族和文化，他们许诺所谓的自由，而这只会削弱我们与永恒敌人的伟大斗争，他们宁愿看到德国因其所谓的罪孽而被烧毁。\n\n“这些腐败的政客、这些自由主义者和这些社会主义者是我们祖国的真正罪孽，他们必须得到净化。他们的鲜血将成为我们国家的洗礼之水，让我们的国家比以往任何时候都更加强大。让我们结束他们的腐败，一次一具尸体！”当莱姆的演讲达到光荣的高潮时，他高举双手，回应他的是那些将拯救德国的人们的欢呼。"
 reich.2017.a:0 "他让“血与土”的呼喊将他包裹在火热的怀抱中。"
 reich.2018.t:0 "波西米亚中立"
 reich.2018.desc:0 "22团和23团的指挥官。再给他两个团。阿尔伯特·施奈茨放下电话后，电话发出叮叮当当的响声。在他给不久前认识的一个熟人又打了一通电话后，又多了两个，甚至几个。\n\n不久前也是这场大灾难之前的感觉。俄国人大举进攻，帝国越来越绝望。当敌人宣布自己取得胜利，莫斯科和其他东部领地失守时，人们的精神渴望着混乱和秩序。 勃兰特的死就是最好的证明\n\n又一个电话。电话那头的人已经知道施奈茨想要什么，先开口了。\"您确定要尝试分裂国家吗？其中的风险......\" 他的声音有些低沉。\n\n\"是的，但如果您能听听我的建议......\" 施奈茨回答道，试图安抚对方的忧虑。\n\n不要在波希米亚，不要。施涅茨想，这次不行。保护国将是安全可靠的，他召集的人纯粹是为了自卫和保家卫国。边境防御工事所剩无几，还可以继续使用，而且还将建造更多的防御工事。山脉也是坚固的天然防御工事。这一切都汇聚在一起，保护着他所能拥有的一切。\n\n他再次放下电话。他身边还有三个人，已经在各自的岗位上严阵以待。他的部队兵力仍然太少，无法与任何其他派别抗衡，这是显而易见的事实，但这将是他们目前所拥有的一切。如果必须战斗，那就战斗吧。对于接下来要做的事，施奈茨坐在办公桌前那张吱吱作响的老椅子上，提笔在纸上写下了这一切。"
 reich.2018.a:0 "截至当日12点……"
 reich.2019.t:0 "最糟糕的背叛"
 reich.2019.desc:0 "伯恩哈德紧紧抓住他那辆车的方向盘，点燃了一支香烟，昏暗的灯光让车里充满了温暖。不知怎么的，他被派去消灭的波兰游击队已经包围了瓦肖城，那里是他的总部和行动区的首长。随着他胜利的梦想在他的周围一颗接一颗地崩塌，他决定他对大日耳曼国的最后任务将是逃跑，并通知国防军他的部队的耻辱失败，上帝愿意在斯拉夫下等人在大日耳曼国制造的地狱里生存下去。\n\n随着疲惫的引擎嘎吱作响，波兰炮兵越来越靠近他的指挥部。他瞥了一眼守卫营地的各色人等，这些才是真正的德意志之子。不是那些在他指挥下莫名其妙消失的懦弱军官，而是那些从华沙废墟中搜寻子弹的少数人。他穿过废墟，粗陋地进行防御，遇到了一队士兵，看到他信任的军官之一带领着被围困的士兵。\n\n他怒不可遏，把车朝着纵队开去，差点撞到那个疲惫的年轻军官。结果撞上了路障，伤到了自己。他手里拿着手枪，狼狈地从车里爬出来，迅速地爬到他那辆被毁的车上，然后甩了甩乱蓬蓬的头发。“你敢违抗我的命令？我是这个战区的头，你像他妈的犹太布尔什维克的黄鼠狼一样逃离战场？你怎么敢！”巴茨说出的每一个字都变得更加愤怒，这个精神崩溃的人用手枪敲打着自己的胸膛，另一只手疯狂地挥舞着。\n\n“我们本该为帝国，为我，消灭该死的波兰威胁！为了我的胜利！为了我对东欧魔鬼的后裔的胜利时刻。然而你们却逃跑了？你们都应该死在这座该死的诅咒之城的废墟里，因为你们违抗了我的命令！”他的怒火很快转向了军官，他信任的人：齐格弗里德。“而你......你这个叛徒！你不仅违抗了我的命令，还背叛了我，逃跑了！你应该和这里其他的逃兵一起被枪毙！”\n\n齐格弗里德平静地爬上那辆破旧的车，把手放在伯恩哈德的肩上。“一切都结束了，旅长......伯恩哈德，一切都结束了。放手吧，和我们一起回帝国去吧。求求你。”"
 reich.2019.a:0 "三颗子弹射入了他的胸口。"
 reich.2020.t:0 "动荡时期"
 reich.2020.desc:0 "当德国的战火烧遍迪特里希周围时，他跪在一棵橡树下，凝视着维利·勃兰特的墓地。墓碑上刻着他的名字，下面是一句引语。\n\n“有一天，战争中似乎不可避免的仇恨会被克服。有一天，一个欧洲人可以无忧无虑生活的欧洲将成为现实。”\n\n当枪声在远处的城市街区响起时，迪特里希的脸上露出了微笑。一些游击队员，迪特里希猜测。事情本不该是这样的，但他却站在德国最伟大的英雄的墓前，这位英雄在德国燃烧时变成了烈士。组织一个新的领导层已经变成了一场噩梦，但当民主运动最终做到这一点时，已经为时过晚。当勃兰特的遗体安葬时，震撼全国的悲伤变成了愤怒，不仅仅是他的追随者，而是整个德国。迪特里希回想起所有这些灾难，它们一个接一个地堆积起来，都是暗杀的结果。勃兰特似乎是把这一切都凝聚在一起的人；否则这些多米诺骨牌怎么会倒下呢？\n\n从西部拿起武器的社会主义者，到南部的纳粹忠诚者，再到东部占领普鲁士的不满老兵，迪特里希和许多像他一样的人，都为勃兰特的梦想成为现实做出了许多努力。民主是德国唯一真正和公正的道路。他知道这一点，数百万人也知道这一点。尽管勃兰特的运动导致了死亡和冲突，迪特里希决心帮助确保德国走上勃兰特为他们铺设的道路。\n\n迪特里希从他的夹克中抽出一朵玫瑰。如果这意味着所有德国人有一天可以从希特勒的疯狂记忆中解脱出来，那么导致这一结果的一切——与俄国的战争、暗杀以及即将到来的战斗——都是值得的。他紧紧地握着玫瑰，祈祷这一天能够到来，多刺的茎刺穿了他的皮肤，但迪特里希没有在意，他亲吻了其中一朵鲜红的花瓣，把它放在勃兰特的墓前。他希望这是许多玫瑰中的第一朵。\n\n接下来的几个月将决定德国的命运，时间紧迫，不能再耽搁了。他站起来，戴上头盔，向未来进发。"
