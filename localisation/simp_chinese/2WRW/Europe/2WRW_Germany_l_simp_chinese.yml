 bormann.3001.t:0 "尾声"
 bormann.3001.desc:0 "元首鲍曼一瘸一拐地走到广场前方，每一次动作都让他的骨头疼痛不堪，每一次呼吸都伴随着剧痛穿透他的腹侧。天啊，活着都是如此痛苦！然而，这是理所当然的，生活就是斗争，即使到了最后。为了生活而奋斗是光荣的，是一种崇高的责任，是一种难以想象的荣誉。其他人从未理解过这一点。那个哭哭啼啼的幼稚小孩施佩尔除了玩乐高积木和用无用的蓝图吸引阿道夫的注意力外，从未取得任何成就。戈培尔和戈林甚至在战争爆发前就屈服于堕落。他还记得他们是如何啜泣着，乞求这个种族的救世主不要入侵波兰，害怕英国轰炸机在柏林上空飞过。而海姆勒——那条蛇！最后他证明了自己就是鲍曼一直以来认为的杂种。\n\n只有他坚守着信仰。只有他有足够的力量继承希特勒的衣钵。现在看他站在哪里——欧洲的主宰，不，世界的主宰！他面前的人群在呐喊，乞求他发言。尽管身体已经衰败，他的思想却坚强。克洛普佛试图说服他呆在室内，这个混蛋。没有其他词可以形容。即使现在，他仍在铺设道路来接替他，以希特勒逐渐恶化的癌症为借口巩固自己的权力。真是的，这个人没有忠诚可言。但人民们理解他仍然掌控着一切，即使到了最后。是他们乞求听到他的话语，他们打开收音机来聆听的是他的话语，而不是克洛普佛的。他永远不会是克洛普佛的对手。不，只有阿道夫才是他的同行。\n\n瓦尔德海姆此刻站在讲台上，对着风喊着一些含混不清的废话。鲍曼记得几年前，当他把那个高个子混蛋从外交部那些满是粪便的深渊中拉出来，取代冯·希拉赫时。他心里想着让盖伦把他处理掉。\n\n瓦尔德海姆结束了演讲，伸手向右边挥动。“现在，德国的兄弟姐妹们，我给你们介绍：你们的元首！”鲍曼一瘸一拐地朝着讲台走去，痛苦地扭曲着表情。他无法保持背直，也只能痛苦地蹒跚而行。他伸手抓住讲台-\n\n然后失去了平衡。这位欧洲的掌权者向前倒去，头撞在大理石上，倒下气绝身亡。"
 bormann.3001.a:0 "正义是一个相对的概念。"
