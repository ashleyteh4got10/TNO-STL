 reich.2023.t:0 "黄昏"
 reich.2023.desc:0 "施佩尔在他的办公桌前疯狂地踱步，他的办公室里堆满了文件夹、蓝图、笔和散落在地上的酒瓶。所有的文件夹和蓝图都涉及到他国家的未来计划。现在它们唯一的用处就是点火。施佩尔认为一切都结束了。在解决了施密特和其他犹太同情者之后，没有什么可以阻挡他的道路。一段时间内，他是对的。他的改革和计划实施得很好。人们逐渐习惯了他的统治；事情正在稳定下来。但随后从东方刮来了一场风暴，席卷了这一切，就像潮水冲走了岸上的脚印。这股潮水以俄罗斯的钢铁和决心的形式出现，决心摧毁欧洲的任何希望和稳定的机会。\n\n施佩尔回忆了他本该如何准备的。他本该停止纠结于犹太人的影响，而是专注于真正的敌人。很明显，从他在汉堡战争期间上任的那一刻起，俄国人就开始策划这件事。也许他们联系了施密特和他的密友。是的，当他仔细想想时，这更有道理。\n\n当他专注于他的新发现时，办公室的门开了，库尔特·乔治·基辛格、路德维希·艾哈德、亨宁·冯·特雷斯科，最后是赫尔穆特·施密特，他们的领袖，也是施佩尔最鄙视的人。\n\n“你们这些堕落的犹太人在这里干什么？”他嘶声说道，“我没有叫你们来，所以在我现在就处决你们之前，你们最好离开这里！”施佩尔从皮套中抽出他的鲁格手枪，直接瞄准了施密特。\n\n“我们料到你会这样反应，”施密特说，毫不在意枪口对着他的头。与此同时，冯·特雷斯科没能掩饰住胡子下面的讥笑。\n\n“我们来这里是为了做一件很久以前就应该做的事情，”普鲁士人说。全副武装的士兵们进入元首的办公室，枪口直指着他。当最后一个士兵列队进入并瞄准施佩尔时，一个戴眼镜的人走进来，站在施密特旁边。施佩尔颤抖着，开始颤抖，他很久没有这种感觉了：恐惧。\n\n“你也是，斯达派尔？”他嘴里含糊不清地说，这时他的枪从他手里被夺走了。"
 reich.2023.a:0 "当元首被戴上手铐并带出大楼时，他沉默了。"
 reich.2024.t:0 "新的一天"
 reich.2024.desc:0 "“今天是德国新的一天。随着阿尔伯特·施佩尔令人厌恶的政权的瓦解，人民向着权利迈进了一步！”整个日耳曼尼亚都充满了欢庆的尖叫声，人民大厅的窗户明显地震动着。\n\n赫尔穆特·施密特，自称“四人帮”的代表人物，站在通往大楼大门的台阶上，面对着近百万的观众。 他慷慨激昂的演讲，在赫尔穆特继续演讲之前，几乎一分钟的时间里，每个人都发出了响亮的欢呼声。\n\n“今天，我们将在我们德国国家内向民主迈进，随之而来的是政府权力的广泛变化。你们，人民，将在这个问题上有发言权，这是前政权从一开始就拒绝你们的。”人群再次和谐地欢呼起来，赫尔穆特的耳朵因为巨大的声量而震动。\n\n“恶毒的纳粹政权给我们的价值观留下的污点已经成为过去。我们要做正确的事情，共同远离这种可怕的领导方式。” 全场肃静，每个人脸上都洋溢着回忆，他们的眼睛充满了紧张的情感。\n\n“今天，我们都将迈出一步，远离我们的过去，走向我们面前的未来；因为我们掌握着命运的缰绳，我们一起可以打造一个由人民打造的德意志民族！我们不能重复我们过去的错误，相反，我们应该共同努力，走向更美好的未来！”现在，整个日耳曼尼亚城的人们都站了起来，他们有的在电视机前，有的在街上，为他们国家面前的新未来而欢呼。"
 reich.2024.a:0 "上帝与我们同在！"
 reich.2025.t:0 "错误的希望"
 reich.2025.desc:0 "“我记得你说过你让德国国防军成为世界上最强大的军队！”路德维希·艾哈德喊道。饥荒和暴动的消息占据了报纸，四人帮立即在施密特的办公室召开了会议。\n\n“我知道，或者至少是这样认为的。但说实话，谁能预测到这样的结果呢？”特雷斯科争辩道，压力让他的汗水从额头上滴下来。\n\n“我们不能......”施密特阴沉地说。“我们以为在对付施佩尔之后，我们就无懈可击了。我们甚至没有注意到俄国人会有多么嗜血。”这是真的。赫尔穆特觉得自己很天真，以为俄国人会看到他和他的同胞所做的一切，认为和平是可选项。赫尔穆特没有意识到俄国的复仇主义有多么强烈；它几乎是不可打破的。\n\n现在他们在这里，在一个充满香烟和雪茄烟雾的办公室里争论和哀叹。随着大日耳曼国的资产的损失现在他们在这里，在一个充满香烟和雪茄烟雾的办公室里争论和哀叹。随着大日耳曼国的资产的损失，没有办法缓解饥饿问题、过度拥挤或难民危机。更不用说国会的政党现在背弃了他们。他们瘫痪了，除了等待什么都做不了。等待结束。\n\n他们没等多久，随着卡车刹车和门开门关的声音传入耳中，一双双长统靴冲进大楼，四人帮的脸上都露出了不安和恐惧的神色。\n\n“我们到底哪里做错了？”基辛格一边喝着最后一口白兰地，一边大声地问道。\n\n“我不知道，”赫尔穆特说。他深深地吸了一口烟，这给他带来了一种虚无的平静感，然后他把烟头扔进了烟灰缸。“但我知道的是，我不会后悔我们所做的一切。即使这是我们的最后一天，我们从枷锁中解放出来的人们会记住我们。我们拯救并还给了数百万人生命。我的朋友们，施佩尔永远无法控制我们。”\n\n赫尔穆特准备再说些什么，但门被踢开了，武装人员冲了赫尔穆特准备再说些什么，但门被踢开了，武装人员冲了进来。四人帮举起了他们的手，他们的梦想赫尔穆特准备再说些什么，但门被踢开了，武装人员冲了进来。四人帮举起了他们的手，他们的梦想破灭了，但他们的精神依然高昂。法西斯主义也许还没有被彻底打败，但四人帮表明，纳粹主义的思想是极其致命的。"
 reich.2025.a:0 "当他们被塞进卡车时，这个想法让他们感到安慰。"
 reich.2026.t:0 "绝望的胡言乱语"
 reich.2026.desc:0 "“我告诉你们所有人——你们每一个人——要确保我们在全国各地的地位。这是命令！刚才有人在听我说话吗？！”阿尔伯特·施佩尔蓬头垢面的脸看着他的顾问和盟友们避而远之的脸，每个人的目光都从施佩尔的眼睛上转移开来。“当那些鼠辈为了自己的不义之财而领导时，你们都认为一切都结束了吗？从来没有结束。我们又占了上风！”施佩尔宣布，他的拳头砸在坚硬的木桌上。\n\n房间里令人难以忍受的沉默使施佩尔在痛苦和愤怒的混合中扭曲了他的脸，他对所有其他人的斥责充满了人民大厅的大厅，让所有人都能听到。直到一个紧张的士兵进入房间，施佩尔才停止了他的怒火。当从士兵那里得知汉斯·斯达派尔已经用自己的部队包围了日耳曼尼亚城时，施佩尔的脸变成了一张失败的脸。他再次要求他的盟友们为即将到来的小规模战斗做好准备，并走向会议室的门口。\n\n“我们没有士兵可以一起战斗。他们不是叛变，就是放下武器。”这些话直接刺进施佩尔的心脏，他的呼吸瞬间离开了身体。他慢慢地转过身，回头看着他表面上的盟友，他们都直视着施佩尔的脸。阿尔伯特脸上的震惊和恐惧是他唯一能向所有人展示的外部公报。\n\n“阿尔伯特，一切都结束了。军队同意了斯派达尔提出的条件，作为交换，他们所要做的就是不服从你的命令。没有回头路了——只有你的末日。”一个将军站起来，拔出手枪指着施佩尔，示意他面向墙壁。他照做了，另一个将军果断地把施佩尔的手腕铐在一起。"
 reich.2026.a:0 "“阿尔伯特·施佩尔，你被捕了。”"
 reich.2027.t:0 "基辛格政变！"
 reich.2027.desc:0 "德意志再次呼吸。"
 reich.2027.a:0 "结束了。"
