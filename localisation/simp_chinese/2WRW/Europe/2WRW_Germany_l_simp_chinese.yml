 GER_Reconstruction_of_Germany:0 "重建德国"
 GER_Reconstruction_of_Germany_desc:0 "我们的国旗或许会自豪地飘扬在德国的每座城市上，然而废墟和创伤依然存在。是时候开始重建了；逐户逐楼，逐栋逐栋，逐路逐路。虽然需要很长时间，但如果我们想看到我们的人民在我们对德国的愿景下蓬勃发展，这是必要的。\n\n代价将会很高，而且可能需要多年时间。然而，德国总是能够走得更坚强。我们从拿破仑战争中恢复过来，我们从凡尔赛条约中恢复过来。我们也将从这场战争中恢复过来。"
