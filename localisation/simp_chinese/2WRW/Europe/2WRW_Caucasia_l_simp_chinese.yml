 CAU_waning_stratification: "逐渐消退的等级制度"
 CAU_waning_stratification_desc: "虽然约西亚斯噩梦般的统治已经结束，但他烙在高加索人民心中的等级制度带来的影响却没有消退。这种主要存在于北高加索人和阿塞拜疆人头脑中的错误优越感，在几十年来德国人所实行的奴隶制的刺激下，导致了对约西亚斯当年所称的 “令人厌恶的害虫”，即格鲁吉亚人、切尔克斯人和亚美尼亚人的广泛歧视。\n\n为了能在我们撤离该地区时留下一个稳定的高加索，并防止种族冲突进一步升级，我们必须将这种现象彻底扼杀在萌芽状态。"
 CAU_echoes_of_kaukasia: "高加索专员辖区的阴影"
 CAU_echoes_of_kaukasia_desc: "高加索地区可能已经从约西亚斯·格奥尔格·威廉·阿道夫的压迫统治中解放出来，但要让这片土地和人民的记忆得到相同的解放可能还需要几十年。有一天，人们本能地忘记在交谈时警惕武装警卫，或是在没有工业废物和劳改营遗骸污染的郁郁葱葱的草地上散步：这是一个梦想；但许多居民担心这个梦想在他们的有生之年无法实现。"
 CAU_the_caucasian_experiment: "高加索试验"
 CAU_the_caucasian_experiment_desc: "在许多人看来，俄罗斯决定建立一个缝合怪物式的单一跨高加索国家毫无意义。许多高加索民族都梦想着拥有自己的主权国家，他们的宗教信仰和文化都大相径庭，却被迫在克拉斯诺达尔的同一座议会大楼里决定那些被认为太重要而无法在地方层面上得到妥善处理的法律能否通过。\n\n对许多组成州来说，这种治理方法是非常低效的，他们在这一点上达成了惊人的共识。正因为如此，对宪法和州自治法的快速修订每周都会通过，以利于各个地方政府能心往一处想，劲往一处使。\n\n但这么做是能够促进联邦的团结，还是将其引向分裂？"
 CAU_administrative_unknowns: "行政真空"
 CAU_administrative_unknowns_desc: "由于我们土地的特殊性，获取偏远地区的最新信息已经成为一场后勤噩梦。不仅偏远的定居点是主要障碍，当地人的不合作也是如此。许多人认为自己不是高加索人，而是认同于自己的地方国家、村庄或部落。\n\n由于权力憎恨真空，这导致了非法政府在国家的偏远地区冒出来，国家无法有效治理这些地区。"
 CAU_ethnic_tensions: "紧张的民族关系"
 CAU_ethnic_tensions_desc: "联邦内有许多民族，其中一些民族有着长达数百年的世仇，过去曾对他们犯下暴行，或者仅仅是文化或宗教不同。根据比例代表制的法律将他们集中在同一屋檐下并没有缓解这些紧张的关系。这种紧张关系将联邦分为三大集团：格鲁吉亚、亚美尼亚和北高加索；阿塞拜疆和车臣；以及阿布哈兹和奥塞梯等山区共和国。\n\n这些派别要么试图贿赂其他派别以通过对自己有利的立法，要么干脆破坏其他派别试图在国民议会通过的立法。\n\n§R如果这种情况持续下去，高加索这个试验小白鼠就蹦跶不了几天了。§!"
