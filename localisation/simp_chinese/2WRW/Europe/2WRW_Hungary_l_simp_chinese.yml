l_simp_chinese:
 HUN_From_the_Shadows:0 "来自阴影"
 HUN_From_the_Shadows_desc:0 "在表面上，我们的目标是保卫多瑙河地区的民族社会主义，摧毁那些背叛的犹太布尔什维克分子，以及所谓的“地主党”——一个充斥着叛徒和颠覆分子的团体。\n\n然而实际上，我们不过是剩余的超级企业和仍在国内的德国精英的傀儡。凭借他们剩余的影响力和财富，他们操纵着政府的权力，只为在匈牙利这片土地上获得微薄的权力。"
 HUD_The_Landowners_Party:0 "地主党"
 HUD_The_Landowners_Party_desc:0 "这个党派源自乡村。我们的领导人与强大的地主有联系，他们不满匈牙利法西斯政权，同时与全国各地的农民组织有关联，这些农民长期被法西斯分子忽视。\n\n这种利益联盟已经取得了成果，现在我们拥有了力量，我们将使匈牙利摆脱法西斯和共产主义的影响，摆脱束缚，为我们所有人的繁荣未来解放。"
 HUS_The_Hungarian_Red_Army:0 "匈牙利红军"
 HUS_The_Hungarian_Red_Army_desc:0 "随着德国的崩溃和法西斯煽动分子希望再次摧毁匈牙利，无产阶级呼唤着他们的救世主，我们响应了这个号召。成千上万的人蜂拥而至，高举红旗，准备最终从多年的压迫和法西斯专制中解放匈牙利。所谓的温和派和法西斯威胁将在我们工人阶级解放的靴子下被粉碎。"
 POLITICS_Ferenc_Szalasi_70s_DESC:0 "与20世纪许多伟大的政治家一样，费伦茨·萨洛希的一生也是在第一次世界大战的战火中铸就的。在奥匈帝国的战斗中，他亲眼目睹了一个国家的软弱无力，因为太多的民族被迫和谐共处。战后，他继续在新组建的军队中为国家效力，与摄政王米克洛什·霍西关系密切。他成立了匈牙利民族社会主义党，致力于建立一个纯洁的匈牙利民族。\n\n他因信仰被捕，被迫在牢房里工作，由于害怕大日耳曼国的报复，匈牙利国家从未对他执行过死刑。被软禁后，他得以继续他的意识形态工作，向追随者传播他的信息，并为最终夺取政权集结力量。\n\n第二次西俄战争是他的转机。他召集他的“箭十字军”，开始了他在匈牙利的征战，以实现他建立一个强大、纯洁和有力的匈牙利国家的理想。面对周围的敌人，他不会屈服，也不会退缩；他拥有匈牙利真正儿女的钢铁意志，没有人能够阻挡他的脚步。"
 POLITICS_ANDOR_JAROSS_70s_DESC:0 "人生就是一场奋斗，这是每个匈牙利人都非常清楚的事实。安道尔·雅罗斯是匈牙利民族的代表，也是这句格言的化身。\n\n眼看着自己的出生地科马罗姆沦为捷克斯洛伐克的占领区，受制于犹太资本家的一时兴起，雅罗斯早期的政治活动为他赢得了匈牙利右翼人士的青睐。随着时间的推移，他的权力和财富不断增长。事实上，随着法西斯主义在欧洲取得胜利，军队在特兰西瓦尼亚取得胜利，伊姆雷迪在布达佩斯取得胜利，雅罗斯的政治命运似乎几乎已经完成。然而，历史似乎无法避免，国家的敌人在等待时机，伺机再次发动进攻。\n\n如果孱弱的摄政王没有试图咬伤喂养他的那只手，那该多好。如果萨洛希这个狂热的蠢货没有巧取豪夺，获得日耳曼尼亚的青睐就好了。如果当时有人注意到东部斯拉夫人的集结就好了。但愿如此。但现在不是感叹本可以实现的目标的时候，而是站起来战斗的时候！布尔什维克的鼠辈将被消灭，自由派的叛徒将被消灭，箭十字的懦夫将被打倒。时间长短并不重要。死多少人都无所谓。即使每个村庄都要被夷为平地，然后重建，也没有关系。\n\n生命是一场斗争，安道尔·贾罗斯将与之斗争。"