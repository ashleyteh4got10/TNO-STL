 HUN_Imre_Nagy:0 "伊姆雷·纳吉"
 POLITICS_Imre_Nagy_DESC:0 "伊姆雷·纳吉几乎一生都在为匈牙利无产阶级而战。从1907年开始上高级中学，到1912年因成绩不佳被开除。选择拥抱工人阶级的生活，他在成为锁匠学徒后搬到匈牙利北部的一家工厂工作。随着一战的爆发，他被征召入伍，在与俄国人战斗中受伤。被俘后，他被流放到西伯利亚。在那里，他受到被囚禁的苏联异见人士的影响，回到匈牙利后，在车臣共和国的帮助下，他成为匈牙利共产党的关键人物。\n\n在战争爆发之前被迫逃离匈牙利，在克里姆林宫的大厅内，他目睹了大日耳曼国摧毁苏联的景象。逃离了俄罗斯平原的毁灭后，他偷偷回到自己的祖国，试图挽救残存的游击队运动。在随后几十年里，他被迫在阴影中工作，他积聚了武器、人员，并培养起对摧毁祖国工人的法西斯野兽的燃烧仇恨。\n\n第二次西俄战争后的混乱正是他所需要的火花。他已经发布命令：匈牙利革命已经来临。工人和农民涌向他的事业；这位老革命家有最后一次机会解放他的国家。"
