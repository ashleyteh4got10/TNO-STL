 POLITICS_Ferenc_Nagy_70s_DESC:0 "费伦茨·纳吉出生于农民家庭，自学成才后开始撰写新闻报道。他很快投身政治，与当地农民协会紧密联系，倡导农民权利。1939 年，他进入议会，并在任职期间帮助匈牙利地下组织遏制匈牙利的战争努力。然而，他所做的一切都白费了。德国人赢得了战争，匈牙利国巩固了其权力。\n\n他继续在政府中工作，同时担任受压制反对派的领导人，并努力维护和保护他在匈牙利地下组织中的网络。由于处处受到秘密警察的监视，他不得不生活在持续不断的监视和审查之中；稍有不慎，他就会被捕或被处死。\n\n后来，第二次西俄战争爆发了。德国战败，匈牙利陷入混乱。这是他时隔多年为匈牙利带来自由之光的机会。费伦茨·纳吉与其他反对派成员分道扬镳，民主支持者在全国各地涌现，团结在费伦茨·纳吉周围，为匈牙利的自由展开最后的斗争。"