l_simp_chinese:
 LIT_Vytautas_Landsbergis: "维陶塔斯·兰茨贝里斯"
 POLITICS_VYTAUTAS_LANDSBERGIS_DESC: "1932年，维陶塔斯·兰茨贝吉斯于出生于考纳斯的一个富裕家庭，对第二次世界大战的恐怖记忆犹新。当纳粹来到并征服立陶宛时，他目睹了德国人的许多暴行——他们试图抹去立陶宛文化，并将其与德国文化混合，使其变得面目全非。\n\n就在那时，他开始写作和绘画，不仅是为了抚慰自己的痛苦，释放自己的情绪，而且还是为了让立陶宛文化的火炬继续燃烧。从著名作曲家的传记到抨击德国傀儡政权的时评，再到旨在激励全国立陶宛人继续梦想更美好明天的诗歌。\n\n虽然他可能没有直接参与60年代初以及西俄战争期间的游击队起义，但正是因为他的作品号召，人们走上街头，手里拿着日丹诺夫鸡尾酒。\n\n虽然他于1958年起就在立陶宛音乐学院接受教育，但他最终没有领导一个传统的管弦乐队。对他来说，议会的议员们就是他专属的管弦乐队，而他将致力于为这首立陶宛交响曲创造光明的未来。"
