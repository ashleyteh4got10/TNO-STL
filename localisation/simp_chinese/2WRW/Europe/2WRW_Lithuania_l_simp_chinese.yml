 LIT_cultural_resurgence: "文化复兴"
 LIT_cultural_resurgence_desc: "三十年的沦陷时光——纳粹试图根除我们文化的三十年，现在结束了。 立陶宛现在可以自由地呼吸了。在东方领统治下，德国宣传从小就被灌输进脑子的日子已经过去了。\n\n由于改革运动政府在振兴立陶宛文化上花费了不小的资金，侵略者留下的伤痕最终会愈合，立陶宛将变得比以往任何时候都更加强大。"
 LIT_colonial_past: "被殖民的过去"
 LIT_colonial_past_desc: "立陶宛在过去几十年的受到的德国殖民和宣传，侵蚀了我们人民的民族认同和文化。 许多人如果不使用已经进入我们语言的无数德语借词，就不知道如何正确地说出他们的母语。\n\n更糟糕的是，大量德国人仍然生活在我们中间，导致种族紧张度达到历史最高水平。 许多人不知道他们的德国邻居是否只是像他们一样的普通人——也许是痛苦的第二次西俄战争的老兵，正在密谋杀死他们和他们的家人？\n\n虽然许多德国人由于这种骚扰而离开了这个国家，但有些人决定留下来； 还有一些，为了巩固民族社会主义的信念……"
 LIT_cultural_resurgence_tt: "§n随着时间的流逝，伤疤会愈合——昨天的噩梦将成为明天遥远的记忆。§!"