 AZR_black_gold: "黑金"
 AZR_black_gold_desc: "对里海周围的大多数国家来说，黑金指的是鱼子酱。这些昂贵的鱼卵能在全世界的富豪的餐桌上占得一席之地，为渔民带来大把大把的钞票。然而，对阿塞拜疆来说，黑金指的是其巨大的天然石油储藏。七十年代初爆发的石油危机的阴影还未散去，阿塞拜疆这样的石油大户肯定不愁找不到买家。"
 AZR_nagorno_karabakh_issue: "纳戈尔诺-卡拉巴赫问题"
 AZR_nagorno_karabakh_issue_desc: "纳戈尔诺-卡拉巴赫一直是一个争议性极强的地区。纸面上来说，它属于阿塞拜疆，但实际上它属于亚美尼亚。约西亚斯统治时期，纳粹为了分裂高加索民族，迫使大部分阿塞拜疆人流离失所，该地区的紧张局势达到了前所未有的高度。阿塞拜疆人希望能从亚美尼亚手中夺取这块飞地，不用说，该地区的亚美尼亚人对此不会高兴的。\n\n§R必须立即找到解决问题的办法，否则局势将恶化为全面冲突§!"
 AZR_heydarism: "盖达尔主义"
 AZR_heydarism_desc: "虽然在阿塞拜疆境外，盖达尔·阿利耶夫是一个有争议的人物，但在阿塞拜疆，他被广泛视为人民的英雄，拥有类似希特勒一样的个人崇拜。尽管大多数民众把他当作下一个救世主而欢呼，但有些人开始担心这种被恰当地称为“盖达尔主义”的个人崇拜对国家的民主制度将产生何种长远影响。有些人甚至声称选举结果遭到篡改，无论是指责盖达尔本人还是俄罗斯，因为他与俄罗斯人有着合作的性质。\n\n然而，这些人只是少数，奇怪的是为什么没有煽动者长时间传播他们的阴谋论呢？也许最好认为盖达尔正在改善国家，并塑造一个新的阿塞拜疆..."