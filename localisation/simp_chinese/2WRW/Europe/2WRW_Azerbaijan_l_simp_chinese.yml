l_simp_chinese:
 AZR_heydar_aliyev: "盖达尔·阿利耶夫"
 POLITICS_HEYDAR_ALIYEV_DESC: "盖达尔·阿利耶夫是一个有着多面性格的人，关于他有很多话要说。在战争之前，他学习建筑，然后对加入阿塞拜疆安全部门产生了兴趣，尽管他的抱负被第二次世界大战打断了。\n\n在被占领的阿塞拜疆期间，他尽力成为约西亚斯及其手下的眼中钉：组织罢工和起义，从纳粹车队中偷取物资，引导当地的武装党卫军队进行疯狂的追捕。\n\n在第二次西俄战争期间，他在巴库组织了这场冲突中规模最大的起义。正是在那之后，俄罗斯军队占领了这座城市，他才能开始建立自己的影响力。\n\n他不仅与当地居民亲近，还帮助俄罗斯军方平定该地区，从而赢得了双方的青睐。\n\n确实，关于阿利耶夫有很多事情可以说，而且他确实有多面性格。但是，它们都有一个共同点：对权力的渴望。他一生都梦想着能够影响一整个国家。既然他已经达到了这个位置，现在是他兑现承诺、在旧世界的废墟上打造一个更美好的阿塞拜疆的时候了。"
