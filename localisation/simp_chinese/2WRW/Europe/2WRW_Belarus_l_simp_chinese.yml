 BLR_Pyotr_Masherov: "彼得·马舍罗夫"
 POLITICS_PYOTR_MASHEROV_DESC: "1919年出生，第一次世界大战结束后不久，彼得·米里诺维奇·马舍罗夫出生在一个简朴的家庭中，他的早年大部分时间都过着过日子的艰辛生活。1939年毕业后成为一名物理和数学教师，他在第二次世界大战爆发前没有太多时间从事自己的专业。\n\n1941年逃脱囚禁后，他开始组建地下共产党组织，最终成为白俄罗斯人民对纳粹占领的抵抗力量。白天是数学教师，夜晚是游击队领袖；他的行动令驻扎在全国各地的德国国防军士兵闻风丧胆。\n\n即使在战后，他仍然继续活动，成为该地区为数不多的几个游击队之一，尽管在西俄罗斯战争后他最终保持低调。当一切希望似乎都已经失去时，他听说俄罗斯正在酝酿一场风暴。\n\n他再次把书本换成步枪，再次走上战场。他在情报方面对俄罗斯军队至关重要，通过切断德国的补给线、协助重要的围城行动来支持他们，马舍罗夫赢得了与他并肩作战的俄罗斯团队的尊敬和喜爱。战后，他协助过渡政府重建该地区，由于他的受欢迎程度，他成为了一项宝贵的资源。\n\n因此，当选票投下时，他的党派以压倒性优势获胜并不足为奇。\n\n白俄罗斯终将真正自由，这将是他的改革带来的结果。"
