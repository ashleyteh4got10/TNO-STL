 BLR_a_simple_life: "简单的生活"
 BLR_a_simple_life_desc: "§W “耶和华必为你开天上的府库、按时降雨在你的地上．在你手里所办的一切事上赐福与你．你必借给许多国民、却不至向他们借贷。”§! §O-申命记 28：12§!\n\n白俄罗斯一直是一个简单的国家，人们过着简单的生活方式。 乌克兰是欧洲最大的粮食生产国，而白俄罗斯是第二大粮食生产国。\n\n虽然走出我们南方兄弟的阴影几乎是不可能的，但白俄罗斯必须养活自己和它的斯拉夫邻国！"
 BLR_educational_reforms: "教育改革"
 BLR_educational_reforms_desc: "由于马舍罗夫总统本人曾是一名教师，改善科学和普通民众的教育自然是他议程中的首要任务。尽管在重建过程中面临明显的困难，数百万卢布仍被投入到大学中。\n\n因为，他认为白俄罗斯经济的未来完全依赖于新一代知识分子的肩膀，这一代人从旧秩序的恐怖中脱离出来，干净而健康……\n\n§V如果他不能很快取得成果或重建被延误，这可能对极右翼势力的未来行动产生重大影响。§!"
 BLR_industrial_reforms: "新工业领域？"
 BLR_industrial_reforms_desc: "马舍罗夫总统为新生国家计划的另一步骤是推动大规模工业化，特别是在化工领域。虽然这在短期内可能成本高昂，并且已成为主要农业反对派的有力集结点，但在他看来，启动白俄罗斯经济是势在必行的。\n\n§V如果这一点不加以控制，可能对国家未来产生重大影响。§!"
