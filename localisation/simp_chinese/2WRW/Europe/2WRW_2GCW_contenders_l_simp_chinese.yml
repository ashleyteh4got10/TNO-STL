 POLITICS_POL_HOME_ARMY_DESC:0 "几个世纪以来，波兰民族一直是欧亚大陆上最强大的民族之一，横跨中欧和俄罗斯平原。在波兰被瓜分之后，波兰人民在过去的几个世纪里几乎被每一个统治波兰的国家压迫、迫害和杀害，但没有任何一个国家像第三帝国那样残酷。\n\n在他们被奴役、迫害和种族灭绝的三十多年里，波兰人民一直在坚持。暴君希特勒死去时，出现了一丝希望的曙光，当时德国人互相残杀，波兰人看到了超越绝望的黑暗中主权和自由的承诺。但内战一结束，德国人再次进军，政权变得和以前一样残酷。\n\n在德国对俄罗斯的灾难性失利后陷入第二次内战之际，波兰人民迎来了最后的自由机会。他们的解放先锋，国家军队，正在对抗毫无支持的巴茨政权。这是波兰的最后一战，通过战争的烈火，要么它将如凤凰般涅槃重生；要么作为殉难者，成为所有被纳粹暴行压迫的人的象征。"
 GMA_Richard_Von_Shirach:0 "理查德·冯·谢拉赫"
 POLITICS_GMA_Richard_Von_Shirach_DESC:0 "理查德·冯·谢拉赫注定要成就一番大事业。他是马丁·鲍曼的得力助手和约瑟夫·戈培尔的侄子，他一直是一位自豪的德国人，也是一位忠诚的党员。青少年时期，他不可否认的人脉关系使他获得了希特勒青年团的领导职位。大学毕业后，他成为了纳粹德国的外交官。凭借这份工作，他试图通过日本实现德国的地缘政治目标，并开创出比父亲更伟大的人生。\n\n从亚洲回来后，他通过在德国众多大学授课来保持影响力。作为鲍曼政权的坚定捍卫者，他一直坚持自己的工作，直到德国被斯拉夫威胁所刺穿，迫使他到德国东部避难。\n\n谢拉赫的残余势力对他的性格着迷。理查德想要权力；他们需要信誉。现在，作为统一后的帝国的元首，冯·谢拉赫正在等待时机。军队现在可能已经把他关在金笼子里，但这并不是冯·谢拉赫家族克服的第一次考验。\n\n这肯定也不会是最后一次。"
 GMA_Walter_Jens:0 "沃尔特·延斯"
 POLITICS_GMA_Walter_Jens_DESC:0 "沃尔特·延斯的权力梦想得到了回应，但并非如他所愿。尽管他出生在阿道夫·希特勒崛起的几年前，但他仍然试图在这个勇敢的新德国成名。在希特勒青年团中一路高歌猛进，他试图通过任何可能的手段获得影响力。\n\n大学毕业后，延斯不出所料地试图与利维坦纳粹机构进行斗争，成为教育部领导候选人。在他的演讲和著作中，他热情地捍卫了希特勒和鲍曼的愿景，尽管他表现出了公正和理性的外表。\n\n因此，当纳粹德国军队进入德国南部时，他的职业生涯和生命都得救了。由于大多数潜在的文职领导人都死了，而延斯又塑造了一个安全、理性的现状支持者的形象，恩斯特·费伯的军队认为他适合担任他们的傀儡元首。现在，尽管名义上得到了提升，但这位汉堡官僚对目前的困境并不满意。他就像一只金笼中的无翼鸟，只能坐着盼望德国国防军政权垮台的那一天。\n\n毕竟，擦鞋的次数多了总能有所成就，对吧？"
