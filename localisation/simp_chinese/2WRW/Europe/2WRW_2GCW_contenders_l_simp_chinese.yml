 SLO_Julius_Duris:0 "朱利叶斯·杜里什"
 POLITICS_SLO_JULIUS_DURIS_DESC:0 "有些人梦想着更美好的未来，却永远无法实现自己的梦想。朱利叶斯·杜里什是少数能看到鲜红的未来在他面前展开的幸运儿之一。\n\n他在布拉格学习法律，1927年加入共产党。当西方国家将捷克斯洛伐克出卖给大日耳曼国时，他被迫转入地下。最后他被关进监狱，政府威胁要把他和他的同胞交给盖世太保，但他在这种情况发生之前设法逃了出来。\n\n在他成年后的大部分时间里，他都过着逃亡的生活，被迫从一个村庄搬到另一个村庄；因为害怕被斯洛伐克当局发现，他从未在一个地方逗留太久。在外国政权的逼迫下的斯洛伐克人民，很乐意为他提供避难所，以换取他能提供的任何工作。朱利叶斯·杜里什从这些新的起点出发，重建了在第二次世界大战后被摧毁的联系网络。\n\n随着大日耳曼国在俄国人手中被摧毁以及随后爆发的德国内战，这一切都取得了成果。共产主义力量最终在马克思和恩格斯的故乡取得了胜利。当红色浪潮涌向斯洛伐克时，朱利叶斯·杜里什挺身而出，帮助巩固了无产阶级在祖国的统治。现在，他与全世界工人携手，帮助领导他的人民走向光辉的未来。"
 SLO_Ivan_Pietor:0 "伊万·皮埃托"
 POLITICS_SLO_IVAN_PIETOR_DESC:0 "伊万·皮埃托生前目睹了《凡尔赛条约》的签署，该条约承诺世界各国人民实行自决。直到现在，他的人民才实现了这一梦想。\n\n他出生于斯洛伐克的一个名门望族，与导演、演员、报社老板和著名建筑师都有亲戚关系。伊万选择学习法律，1926年毕业后在布拉迪斯拉发开了一家律师事务所。在那里，他和许多同胞一样经受住了战争的考验。但他并没有悄无声息地度过战争，而是协助开展抵抗活动，并特别关注保护斯洛伐克的犹太人。\n\n在整个战争期间，他一直协助起义和反抗活动，但在战后的大部分时间里，他被迫低调行事。当局缺乏给他定罪的证据，但他发现自己在法律实践中遇到了越来越多的困难。直到德国的注意力开始偏离斯洛伐克，他才冒险与抵抗运动中的老朋友取得联系。\n\n当俄罗斯入侵德国时，他看到了机会。在他的抵抗运动老盟友的帮助下，他们开始策划一场大规模起义，以最终摆脱法西斯主义的桎梏。随着德国新民主的崛起，他终于实现了自己的梦想。现在，他在自由、民主和自由价值观的指引下，带领人民走向更加光明的未来。"
