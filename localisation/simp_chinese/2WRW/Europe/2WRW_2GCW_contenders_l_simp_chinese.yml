 SRH_Rudi_Dutschke:0 "鲁迪·杜奇克"
 POLITICS_SRH_Rudi_Dutschke_DESC:0 "鲁迪·杜奇克终其一生都是一位革命者。起初是为了对上帝的信仰，现在是为了对人民的信仰。\n\n作为勃兰登堡一名邮政工人的儿子，杜奇克从小就对体制的教导感到失望，他早早地开始阅读马克思主义文献，并在高中时就参加秘密的福音派聚会。正是这些激进的举动使他走上了反法西斯的道路。当杜奇克还是个16岁少年的时候，由于反对西俄战争的抗议活动使他惹上了盖世太保的麻烦，被迫离开了家乡和家人。\n\n尽管最初藏身于激进的地下党是迫不得已，但对于这位年轻的传教士来说，这很快成为了一个机会。通过宣传一种同时反对苏联无望的威权主义和魏玛共和国幼稚的合作主义的信条，杜奇克迅速成为汉诺威最杰出的社会主义鼓动者之一。然而，演讲和小册子远远不足以应对形势。随着鲍曼政权的暴力加剧，呼吁进行暴力斗争的呼声也越来越高。\n\n如今，滑稽的元首已经去世，帝国也陷入困境，霍夫曼挺身而出予以回应。现在，德意志正四分五裂，四面楚歌，杜奇克为自己和他的人民的生命之战做好准备。要么他将建立一个沐浴在和平与自由之光中的新德国，\n\n要么邪恶势力将再次吞噬他的家园。"
 RPR_Heinz_Hoffmann:0 "海因茨·霍夫曼"
 POLITICS_RPR_Heinz_Hoffmann_DESC:0 "曾经，世界的旁观者们认为德国的红星永远熄灭了，被希特勒统治的窒息控制所扼杀。当同样的这个国家把它那阴暗的刀锋插入东方社会主义火炬的心脏时，社会主义的事业距离彻底的遗忘愈发接近。\n\n然而，少数勇敢者坚持不懈，其中包括海因茨·霍夫曼。\n\n在为社会主义事业奋斗的大部分生涯中，这位革命者漫游欧洲，先后在西班牙内战到巴巴罗萨行动期间为社会主义国家的旗帜下效力。然而，每一次，德国之鹰或其同样扭曲的法西斯同伴都只会将这些努力付诸烈焰。\n\n但是，随着一次次的失败和战友的离去，霍夫曼只变得更加娴熟和耐心。当鲍曼的政府开始崩溃，俄国巨熊在东方苏醒时，他迎来了机会：在莱茵兰地区协调抵抗小组，他希望至少能减弱德国国防军的战斗能力。\n\n但他得到的远远超出了期望。随着俄罗斯军队的无情进攻，德国人民终于崩溃，呼喊着寻求一条新的道路。如今，成千上万的人在深红的旗帜下行进，而霍夫曼则孤注一掷，寄希望于最后一次尝试将革命带回他的家园。"
 REG_reichsbanner:0 "国旗团紧急委员会"
 POLITICS_REG_reichsbanner_DESC:0 ""
 REG_Hans_Dietrich_Genscher:0 "汉斯-迪特里希·根舍尔"
 POLITICS_REG_Hans_Dietrich_Genscher_DESC:0 "继承一个梦想意味着什么？\n\n对于汉斯-迪特里希·根舍尔来说，这意味着成为一个梦想的代言人，不仅是他自己的梦想；不仅是已故的维利·勃兰特的梦想，还有魏玛共和国和德国先辈们的梦想。在维利·勃兰特被法西斯杀手夺去生命后，根舍尔接过了德国总理的权力。正是在他的肩上，欧洲的缰绳分崩离析；萦绕欧洲的幽灵终于被驱散。\n\n如今，在经历了另一场内战后的德国已经成为废墟，政府有责任振奋人民，引领德国走向新世界。在赢得选举，从自由派和保守派手中夺得胜利后，正是根舍尔的愿景将引领德国走向未来。勃兰特和重生的魏玛共和国的梦想将引领德国进入一个新时代。因为对根舍尔来说，你可以杀死一个人——一个伟大的人——但你永远无法扼杀一个理念。"
 REG_Walter_Scheel:0 "瓦尔特·谢尔"
 POLITICS_REG_Walter_Scheel:0 "在地球上空飞翔的人，就是人类耻辱的最大见证者。\n\n瓦尔特·舍尔曾是空军的一员，在第二次世界大战和第一次西俄罗斯战争期间驾驶BF110，同时观察着被月光触摸过的天空，寻找俄罗斯战斗机飞行员或下方部队动向的情报。战争结束后，沃尔特仔细审视了自己，也审视了他曾为之战斗并杀戮的大日耳曼国。他所看到的是一个建立在墓碑上的国家，一个建立在尸体上的国家。这令瓦尔特感到恐惧，他沉溺于酒精以应对自己的悲伤。\n\n当维利·勃兰特的演讲激起了整个国家，当他的生命被第二次西俄战争的老兵夺走时，舍尔在国旗团的带领下，在混乱中与亲近的朋友和盟友共同加入并创立了德国保守民主党。作为新德意志共和国内的保守党，舍尔代表了根舍尔和格拉赫理念之间的中间立场。现在，舍尔有机会引领德国度过风暴的尽头，迎接更加明朗的天空。"
 REG_Manfred_Gerlach:0 "曼弗雷德·格拉赫"
 POLITICS_REG_Manfred_Gerlach:0 "为了自己的国家而战，意味着为自己的灵魂而战。\n\n这正是曼弗雷德·格拉赫的信仰，他自从第二次世界大战初期就开始抵抗纳粹。他在法国抵抗运动和反纳粹游击队中服役，多年来一直在前线冒着生命危险，希望德国未来不再笼罩在纳粹的阴影下。然而这个未来从未到来。\n\n曼弗雷德与许多其他持不同政见者一起逃往瑞典，在动荡不安中等待了几十年。直到第二次西俄战争中德国的失败。在那里，当硝烟在午夜的空气中升起时，他悄然回到德国，并加入呼喊着要结束帝国的呼声。当共和国发现自己获得胜利时，正是格拉赫和自由党在德国首次选举结束时获得了胜利。如今，曼弗雷德有机会为他真正信仰的祖国而战，并为德国的错误赎罪。因为或许比任何其他人都更甚，曼弗雷德·格拉赫相信德国的灵魂。他将不会停止，直到德国的灵魂与“纳粹”这个词不再相提并论。"
 GER_Willi_Brandner:0 "维利·布兰德纳"
 POLITICS_GER_Willi_Brandner:0 "一场预言正在兴起。对于那些忠于希特勒教义的最忠诚的门徒们来说，这是一个关于千年帝国的预言，一个被净化过的帝国，摆脱了优等人、犹太-布尔什维克和弱者。布兰德纳一生都在为这一预言而奋斗，在整个第二次世界大战期间，他与党卫军成员步调一致。从在克罗地亚与南斯拉夫游击队作战，到在第一次西俄战争中击退俄罗斯大军，布兰德纳坚定地阻挡着一切危害帝国的行为。\n\n他几乎失败了。帝国已经陷入自由主义的颓废中，民族社会主义正处于失败的边缘。尽管它已经从濒临崩溃的边缘恢复过来，击败了那些承诺要让德国“自由”、放弃德国唯一正确道路的蛇蝎们，但是我们最大的缺点也被暴露出来。不仅如此，共产主义者、自由派、社会主义者、学生运动和堕落的希姆莱爪牙都被布兰德纳的手彻底粉碎。\n\n然而，尽管纳粹党旨在从废墟中崛起更加强大，另一个肥胖的蛞蝓却应运而生。布兰德纳不愿意再次看到循环重演，他已经退出纳粹党，组建了德意志工人党。尽管名字不同，它所代表的绝不仅仅是德意志民族的真正遗产。从纳粹党的废墟中将崛起一个新的帝国，旨在实现其创始时的预言，并且不受过去的薄弱所束缚。"
 HRC_Ernst_Aust:0 "恩斯特·奥斯特"
 POLITICS_HRC_Ernst_Aust_DESC:0 "奥斯特是魏玛时代的孩子，在他的一生中只经历了斗争和暴力。早在他大学时代的早期，奥斯特就在汉堡的地下界成为了名人，无论是因为他的文字还是他的剑。他的革命狂热使得恩斯特在各个欧洲地下组织中找到了联系，特别是南斯拉夫地区的组织。虽然他在一个荒谬的工厂职位上任职，但他却是非法刊物《北德意志工人报》的编辑和发行人；这份刊物公开鼓励破坏和叛逃；与他对东部游击队的同情一脉相承。\n\n到了1951年，在地下界中发现了一个完全契合他思想的部分，至少在德国是这样。不久之后，他在汉堡创建了自己的组织，通过他的精心监督，越来越多的工人加入了这个事业。\n\n奥斯特最为人所知的，无论是他的同志还是对手的许多思考，都有一个简单的事实：在德国各地爆发的动荡之火终于带来了一个绝佳的机会，就像红色太阳的光芒照耀着汉堡的天际，也许总有一天会照耀整个德国。"
 GMA_Ernst_Ferber:0 "恩斯特·费尔伯"
 POLITICS_GMA_Ernst_Ferber_DESC:0 "第二次西俄罗斯战争对大日耳曼帝国及其居民造成了彻底的灾难。没有人比恩斯特·费尔伯更了解这一点。\n\n在第一次西俄罗斯战争的斗争中，费尔伯并非变成了一个不理性的民族主义者，而是一个胜任的现实主义者。东方的第二次入侵只是证实了他的恐惧。在莫斯科的城外服役，这位将军的勇敢行动使他成为那些在他指挥下服役的人中备受赞誉的人物。尽管他在官兵中获得了始终如一的支持，但这一切都付诸东流。俄罗斯巨熊在失败的海岸上重创了帝国，费尔伯只能在他帮助回家的人中找到安慰。\n\n随着枪声再次平息，受辱的德意志政府开始解体。如今，拥有一支忠诚部队却无所失去的费尔伯抓住了机会，宣布了德国紧急军事政府，决心摧毁现在困扰他国家的激进派系。尽管任务艰巨，费尔伯已为自己人生中最重要的战斗做好了准备。他不会放弃。他不会动摇。他不会失败。\n\n他不能再背叛他的人民。"
 SFK_Heinz_Georg_Lemm:0 "海因茨-乔治·莱姆"
 POLITICS_SFK_Heinz_Georg_Lemm_DESC:0 "海因茨-乔治·莱姆是一个战士，而且永远都将是。\n\n莱姆在第二次世界大战中英勇战斗，在他的领域中获得了丰厚的奖励，成为了当时最年轻的陆军上校。从俄罗斯腹地到伦敦街头，莱姆看到了他的机会，他抓住了它们。众所周知，他亲自领导了对3辆T-34坦克的袭击，并导致了布尔什维克的覆灭。然后他带领德军前卫部队入侵了联合王国。不久，地平线上再次出现了战争的阴影，旧敌人再次抬头，丑陋的面孔再次出现。\n\n随着德国在第二次西俄战争中的失败，以及莱姆和他的战友们为之奋斗、流血和牺牲的霸权的割让，他内心深处发生了变化。这不是一次失败，而是一次背叛。愤怒的莱姆再次拿起武器，与许多年长的同胞一起组建了自由军团。在他的军队支持下，他轻松推翻了布雷斯劳摇摇欲坠的政府和周边城市的统治。\n\n突然间，莱姆开始感受到战争的荣耀渗透他那颗老旧的心。随着自由军团国家的形成，他感到了保卫祖国的责任，要用德国人民所有的力量来保护。当然，在帝国深处存在着持不同意见者，但他们将在千万轮阳光的照耀下被焚烧殆尽。莱姆将让鲜血自弗罗茨瓦夫流淌到日耳曼尼亚，遍布整个帝国。而他将为此感到骄傲，每一刻都如此。"
 POLITICS_SFK_Heinz_Georg_Lemm_VICTORY_DESC:0 "在他的一生中的方方面面，莱姆以士兵、军官和战士的身份受到嘉奖和赞誉。然而，在他职业生涯的这个特定时刻，更适合称呼他为幸存者。无法想象规模的战争未能击垮这位前上校，他适应了每一种新的战术和战线，并以精心计算、残酷高效的方式处理敌人。正是这些特质部分地解释了为什么他现在站在一个统一的德国的掌舵位置。\n\n很明显，海因茨-格奥尔格·莱姆在另一个战场上表现出色。在他的自由军团中，莱姆旨在强制恢复德国的尊严，以恢复这个国家破碎的自豪感。铅和钢铁的统治确实可能会让不知情的观察者误以为莱姆只会这一招，行动和目标一心一意；他是一个彻头彻尾的军人。而且他确实是一位军人，尽管显然在政治策略方面也非常有技巧。\n\n现在，这位军官已经战胜了那些希望摧毁他建立的事物的政治势力，并将极端分子和中间派踢到了象征性的人行道上。他的铁腕何时会释放这个国家，无法预料。莱姆即将从军事生涯中退休，并将在可预见的未来主持他的征服，以强制恢复适当的秩序。唯有鲜血能洗净这个国家的耻辱。"
 SFK_Ernst_Kaltenbrunner:0 "恩斯特·卡尔滕布伦纳"
 POLITICS_SFK_Ernst_Kaltenbrunner_DESC:0 "伟大的人执掌火炬燃亮一国。而那团火光投下了阴影。对于恩斯特·卡尔滕布伦纳来说，在赖因哈特·海德里希的阴影下生存是简单的。在这个引发争议、专横的秘密警察首领四处游走的地方，卡尔滕布伦纳也在那里，传达命令，铲除帝国的敌人。从一开始被忽视的党卫队职业，他一点一点地攀升上去。他在每次胜利中证明自己，在每一滴鲜血中证明自己，无论是在清洗不洁之物和祖国多余份子的营地里，每一次晋升都是一场斗争。\n\n然而，战后，他将被降级到秘密警察的底层，永远生活在它的主人莱因哈特·海德里希的阴影中。尽管这并不是一种不利的存在，但他寻求更多。他在警察部门的时间让恩斯特没有了在为掌控权力而奋斗时所感受到的满足感。当俄罗斯熊前来，抹去了帝国在欧洲的霸权时，恩斯特加入了自由军，为自己创造了一个权力和影响力的中心，以拯救他心爱的祖国。随着祖国的统一，莱姆的武装匪徒和巴克的疯子们都已被扫入历史的垃圾桶，而恩斯特·卡尔滕布伦纳将走出黑暗。\n\n不再受束缚，正是卡尔滕布伦纳将塑造德国的命运，无论是好是坏。"
 SFK_Herbert_Backe:0 "赫伯特·巴克"
 POLITICS_SFK_Herbert_Backe_DESC:0 "赫伯特·巴克出生在格鲁吉亚的德国人家庭，他在第一次世界大战期间因为自己的德国血统而被囚禁，从小就深刻体会到了斯拉夫种族的劣根性。在被关押后，他搬到德国，并加入了纳粹党和汉诺威的SA支部。随着纳粹在上世纪30年代掌权，他成为了食品与农业部部长。作为忠诚的纳粹仆人，二战期间，他实施了饥饿计划，故意让数百万斯拉夫人挨饿，为德国殖民者腾出土地。\n\n战后，他前往乌克兰，继续对本地斯拉夫人口实施灭绝性的饥荒政策。他亲眼目睹了第一次西俄战争，协助在战争期间对当地异见者进行系统屠杀。到第二次西俄战争时，他回到了德意志，应对日益严重的粮食危机。在听闻德国投降消息后，他逃离了随之而来的混乱，来到了自由军团，并与之结盟。\n\n在自由军团获胜后，赫伯特·巴克迅速确立了权力。莱姆的匪帮行径本会毁掉德国，而卡尔滕布伦纳只会重蹈覆辙。巴克深知只有他能使德国重现荣耀。"
 SIL_Fritz_Teufel:0 "弗里茨·托伊费尔"
 POLITICS_SIL_Fritz_Teufel_DESC:0 "在暴政统治下，幽默是首先消失的东西。\n\n孩子们的笑声被士兵的行军声取而代之；喜剧演员的常规被削减，为独裁者的演讲让路。完美的法西斯国家因此成了对平庸的颂歌；一种文化，在这种文化中，只有遵循荒谬的现状，才能希望继续活下去。\n\n因此，对于弗里茨·托伊费尔来说，幽默是他最强大的武器。\n\n在胜利的帝国的阴影下长大，年轻好奇的托伊费尔在学校里得到的敷衍陈词滥调中找不到安慰。相反，他毅然投入了反国家的艺术领域。起初只是几张存放在床底下的宣传册，迅速演变为隐藏的戏剧放映、社会主义读书会和革命计划的生活。作为激进地下活动的主要先驱之一，托伊费尔，或者如他更为人熟知的“有趣游击队”，成为反对派世界的新星。令秘密警察深感恼火的是，他用布丁扔向帝国最尊敬的政治家们的讨厌把戏，使他在反法西斯圈子里几乎普遍走红。\n\n然而现在，即使是政治幽默的旗帜人物也难以微笑。他的祖国支离破碎，孩子们无生命，狂热的自由军肆意蹂躏一个又一个城镇，托伊费尔再也不能做名人。他必须拿起武器，将其对准那些敢于将他的祖国拖入深渊的人，铸造一个不再欢迎法西斯渣滓的国家。\n\n只有这样，德国的孩子们才能再次自由地笑出声来。"
 GER_gerhard_klopfer_2:0 "格哈德·克洛普佛"
 POLITICS_GERHARD_KLOPFER_2_DESC:0 "不论发生何种情况，格哈德·克洛普佛都不会被剥夺他的命运，不管帝国遭遇何种境况。失去了通过继任从情报总长的职位和平地晋升到元首的机会，他和他那群忠于帝国创立原则的真正爱国德国人将不得不通过力量来夺取。\n\n当党派机构崩溃，维利·勃兰特上台时，克洛普佛在重新组织和巩固那些仍在东方惨败的反动分子残余方面起到了关键作用。即使一切似乎都失落了，坚不可摧的旧心脏仍然在慕尼黑的啤酒屋中跳动，希特勒的儿子们在那里向新一代的德意志战士传诵他的教导。伟大的元首发表狂喜的演讲，士兵们沿着每条街道行军，仅靠武力维持秩序。抗议者、自由主义者甚至共产主义者都会在没有审判的情况下被枪杀，他们的尸体在一场新的大清洗中被扫荡，甚至超越了水晶之夜。\n\n为了防止那些企图从内部颠覆他们的人，雅利安种族必须不惜一切代价加以保护，即使这意味着与自己的兄弟发生冲突。德国灵魂的最后一战已经开始，只要血旗高高飘扬在党政府大楼上空，民族社会主义尚未失败。"
 OZW_Bernhard_Baatz:0 "伯恩哈德·巴茨"
 POLITICS_OZW_Bernhard_Baatz_DESC:0 "作为民族社会主义事业的狂热支持者，伯恩哈德·巴茨将《我的奋斗》中表达的理念引向了不可避免的自然结局。参与了德国横扫欧洲的伟大十字军运动，这位意志坚定的指挥官领导着A行动队进入东部，以摧毁希特勒宣言中规定的每一个注定要被消灭的灵魂。他监督了在爱沙尼亚各地散布的所谓“游击队”和犹太人的谋杀，留下了成千上万的无名坟墓，标志着他前进的步伐。\n\n战后，他忠实地在总督领地服役。他继续完成他的领袖伟大使命，在奴役和压迫波兰本土人口的过程中，直至他们最终被消灭。在希特勒去世后的政治混乱时期，他在鲍曼党派机构内找到了新的工作，在20世纪60年代末退休前，为政府表现卓越地服务。然而，当德国被迫在东方威胁的毁灭性打击下签署耻辱的里加条约时，他知道如果要拯救希特勒的愿景，他必须采取行动。\n\n随着帝国的边境陷入无政府状态，曾经被认为中立的东欧当地人再次摆脱束缚，伯恩哈德再次带领自己投身战斗。指挥着孤立的“华沙守军”，巴茨向他的士兵们保证，无论帝国遭遇什么命运，德国的敌人也别想看到它的终结。如果他对民族社会主义信条的献身精神能再次将他带向胜利，那么接下来会采取什么行动就不再是一个问题。\n\n在他的统领下，波兰必将毁灭。"
 POL_home_army:0 "波兰家乡军"
 GLC_Andre_Lajoinie:0 "安德烈·拉若瓦尼"
 POLITICS_GLC_Andre_Lajoinie_DESC:0 "历史上那些不起眼的人往往讲述了最引人注目的故事，讲述了在漫长故事的结尾，弱者是如何获胜的。安德烈·拉若瓦尼就是这些人之一。他出生在世界上曾经见过的最严重经济危机时期，安德烈认为他已经见过他的人民遭受的最低谷和最高峰。当然，直到他目睹了他的国家在纳粹的手中遭受彻底失败。\n\n尽管他没有什么出众的领袖才能，但他一直忠于自己和国家的承诺。在法国共产党内取得了职业上的进展之后，随着该党继续在法兰西国的监视下运作，他稳步地在党内逐渐上升。而他们的联系不断扩大时，法兰西国继续在其堕落的重负下腐化。\n\n随着勃艮第的崩溃，安德烈的机会来临了。在协定委员辖区成立后，他进入了这个地区，并帮助扩大了共产党在该地区的联系。在德国在俄罗斯手中失败，并在随后的内战中燃起战火后，红色在经历了几十年的绝望后获得了胜利。红旗在德国的领土上高高飘扬，而拉若瓦尼则等待着国家的未来，他将在他的照料下领导法国的无产阶级走向未来。"
 GLC_Jacques_Chirac:0 "雅克·希拉克"
 POLITICS_GLC_Jacques_Chirac_DESC:0 "雅克·希拉克是一个在各个阶层中不断攀升的人，无论身处何地的阶梯。现在，他迎来了登上法国最高官职、领导法兰西国的时刻。\n\n在三十年的时间里，他见证了他的同胞们在战争期间与德国占领军作战，亲眼目睹了自己的国家男女英雄们的战斗；他曾在阿尔及尔市领导一支小型装甲部队，最终发展出一段政治生涯，与法兰西国紧密相连。在这四十年间，他看着自己心爱的国家及其人民在民族社会主义政策和由大规模屠杀者统治的恐怖罪行下遭受巨大痛苦。\n\n在担任法国政治家助手期间，他凭借出色的工作记录赢得了“推土机”的称号。当勃艮第州最终崩溃时，雅克抓住机会离开法兰西国，加入了人道主义行政机构中新设立的协定委员辖区。在第三帝国崩溃、新秩序崛起后，德国人认为提拔他担任委员辖区的最高职务是合适的。现在，他像往常一样，不知疲倦地为他的人民的福祉和成功而努力，希望迎来更美好的明天。"
