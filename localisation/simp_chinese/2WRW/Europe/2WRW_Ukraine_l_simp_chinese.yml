 UKR_memories_of_generalplan_ost: "东方总计划的回忆"
 UKR_memories_of_generalplan_ost_desc: "曾经是欧洲最伟大的粮仓，现在已经不过是一头受打击、疲惫、干涸的牛。即使是来定居的德国人，他们的财富也只剩下了德国时的微小一部分。那些掠夺土地的精英已经离去，但人民和土地依然存在。虽然乌克兰并不陌生于艰难困苦，但是否有其他任何国家像纳粹统治那样令人争议。乌克兰人民拥有的唯一一样东西，就是最近解冻的希望，这是第二次西俄战争胜利所带来的。"
 UKR_legacy_of_the_occupation: "占领的遗产"
 UKR_legacy_of_the_occupation_desc: "尽管乌克兰如今是一个自由国家，但三十年的民族社会主义统治给我们的国家留下了永久的伤痕。\n\n数以百万计的乌克兰本土人被驱逐到奴隶园地、死亡工厂和劳动营，同时德国移民的涌入削弱了我们的民族自豪感，并使许多乌克兰人身处境外。这也在新乌克兰政府与不愿放弃他们非法获取土地的激进德国移民之间制造了种族紧张局势。\n\n虽然现在我们的人民已经战胜了法西斯势力，但乌克兰仍然因民族社会主义而痛苦、羞愧。"
 UKR_breadbasket_of_europe: "欧洲粮仓"
 UKR_breadbasket_of_europe_desc: "既然大部分埋在土壤中的法规已被清除，乌克兰广阔的金色田野继续滋养着欧洲那些饥肠辘辘的嘴巴。与德国的寄生关系已被与整个欧洲的一种相当赚钱的关系所取代。随着西方经济从农业转向制造业和不断崛起的服务业，乌克兰发现自己并不缺乏贸易伙伴。\n\n当然，如果农业是你的主要产业，你最好在这方面做到最好，因此政府现在适当资助研究新的农业方法。"
 UKR_nezalezhnist: "独立？"
 UKR_nezalezhnist_desc: "战后时期，即第二次世界大战之后，乌克兰的游击活动逐渐兴起，并通过与纳粹德国行政当局的不懈斗争，培养起了乌克兰统一的民族认同感。如今，我们在某种程度上获得了独立，但许多人，从前游击队员到普通百姓，开始质疑乌克兰与俄罗斯的关系。\n\n许多人认为这种独立只是一种闹剧，因为[RUS.GetAdj]政府仍然干预我们的政治事务，许多人认为只有通过这种外来干涉，莱昂尼德·克拉夫丘克才能夺取胜利。"
