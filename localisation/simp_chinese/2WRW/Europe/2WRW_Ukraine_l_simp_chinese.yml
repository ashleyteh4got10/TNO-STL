l_simp_chinese:
 UKR_Leonid_Kravchuk: "列昂尼德·克拉夫丘克"
 POLITICS_LEONID_KRAVCHUK_DESC: "列昂尼德·克拉夫丘克一直是一个忠诚度灵活的人。他于1934年出生在维利基日蒂恩，位于波兰东部，出生在一个农民家庭。1939年苏联入侵波兰后，他发现自己成为另一个国家的一部分。在第二次世界大战的尘埃落定后，他卷入乌克兰游击队运动，试图为自己的祖国而战。\n\n然而，与乌克兰政治中更多民族主义成分不同，克拉夫丘克的民族主义在务实主义面前显得渺小；而正是这一点使他在选举中获胜。\n\n在协助过渡政府建立稳定政权期间，他的合作和忠诚使他获得乌克兰议会主席的称号。经过一系列地下交易和贿赂后，他的政党得以在选票中超过更受欢迎的乌克兰共和党。尽管这个事实当然对公众保密，但如果他自己信任的政党官员中有人揭发他，我们只能想象会发生什么事情。"
