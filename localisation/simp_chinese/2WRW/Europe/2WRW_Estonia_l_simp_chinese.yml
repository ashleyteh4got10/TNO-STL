 EST_Vajno_Valjas: "瓦伊诺·韦尔亚斯"
 POLITICS_VAJNO_VALJAS_DESC: "1931年出生的瓦伊诺·韦尔亚斯几乎记不起占领前的生活，只有一些他童年时珍视的回忆，这是今天生活在爱沙尼亚的每个人都没有的回忆。尽管爱沙尼亚没有像其他波罗的海国家那样受到同样的对待，但瓦伊诺所面临的镇压使他逃往了莫斯科。 \n\n在那个偏远的地方，他一度找到了安全，因为广袤的莫斯科土地几乎是在政府控制之外，但这也意味着流窜的强盗团队和没有工作机会。\n\n逃离俄罗斯混乱的边境，他发现自己能够在汤姆斯克大学学习，即使在统一战争期间也是如此。尽管毕业后在地方政府找到了工作，瓦伊诺非常想家。\n\n就在那之后的一两年里，第二次西俄罗斯战争爆发了，重燃了他的希望。战争结束后，他立即前往祖国，成为一个博学的人，希望能够帮助过渡政府，确保爱沙尼亚的独立。"
