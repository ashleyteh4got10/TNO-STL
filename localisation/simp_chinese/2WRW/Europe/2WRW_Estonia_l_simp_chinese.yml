 EST_oil_shale_industry: "油页岩产业"
 EST_oil_shale_industry_desc: "虽然爱沙尼亚不像阿塞拜疆或伊拉克那样拥有石油，但通过技术创新——抑或是纯粹的运气，爱沙尼亚发现了另一种石油来源：油页岩。 虽然并非所有油页岩都能转化为石油，但它仍然可以很好地维持热电厂的运行。\n\n人们唯一担心的似乎是页岩精炼厂冒出的黑烟，对许多人来说，这是东方领旧“工业”的巨大进步。"