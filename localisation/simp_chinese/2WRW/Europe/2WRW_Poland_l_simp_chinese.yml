 POL_armia_krajowa: "波兰家乡军"
 POL_armia_krajowa_desc: "地下国的建立方便了波兰各个抵抗组织的活动。在地下，波兰教育和文化的传播几乎没有受到阻碍，而处于阴影之中也为秘密武装和游击队的训练提供了巨大的便利。因此，波兰家乡军是整个人类历史上为数不多的，战斗力和训练水平不亚于职业军队的游击队之一。\n\n波兰家乡军中存在着不少老兵，有些人甚至经历过1939年德国入侵波兰的战火洗礼。为了夺回家园，他们可以不顾一切。这支军队如此之强悍，以至于国防军的所谓精英们都要对他们忌惮三分。\n\n现在，家乡军手中的烂枪破炮已经被俄罗斯兄弟们援助的新玩意儿所取代，为了将德国人赶出波兰的国土，他们将战斗至最后一人。"
 POL_nowa_polska_volunteers: "远征回乡路漫漫"
 POL_nowa_polska_volunteers_desc: "多年前，数十万波兰儿女为了躲避德国人的统治，逃亡到了哈萨克斯坦。现在，他们回来了。即使他们已被岁月所摧残，但他们的身心仍然坚韧不拔，时刻为夺回祖国而准备着。在哈萨克斯坦出生的波兰儿童也和他们一同来到这里，为他们父母口中的应许之地而战。在这些人中也不乏许多哈萨克人，尽管新波兰的民族关系一向紧张，他们还是与波兰人建立了深厚的关系。虽然语言问题确实为他们带来了不小的阻碍，但哈萨克人的战斗精神是无可比拟的。\n\n虽然他们中的大多数人都很长时间没有回到波兰，或者压根就没来过波兰，但他们已经准备好为波兰的最终解放而上刀山，下火海。"
 POL_vistula_german_conflict_idea:0 "维斯杜拉德国冲突"
 NOV_rebuild_the_home_army_tt:0 "§R纳粹的同化政策导致了无数波兰人的死亡，他们希望能最终扼杀波兰的存在意识，但是由于人口不足，德国国防军将极为困难地对抗游击队。§!"
 NOV_destablise_the_general_gouvernement_tt:0 "§R在俄罗斯人的帮助下，地下政权的决心将变得更加坚定。得益于流亡的波兰人的额外支援，这一次他们将不再孤军奋战。§!"
