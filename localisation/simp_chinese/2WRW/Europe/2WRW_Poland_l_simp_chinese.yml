 POL_Karol_Wojtyla: "卡洛·沃伊蒂瓦"
 POLITICS_KAROL_WOJTYLA_DESC: "卡洛·沃伊蒂瓦，一个将会流传多年的名字。\n\n当地下抵抗组织土崩瓦解，虚无主义席卷整个波兰民众，德国再次占领波兰后，卡洛·沃伊蒂瓦感到了提振波兰精神的责任。他以神职人员的经历，重新点燃起了反抗的火焰。\n\n目睹了1939年波兰的沦陷，他从未体验过生活在一个自由国家的感觉，自从地下抵抗组织未能保持波兰的独立，并且俄罗斯赢得了第二次西俄战争以来，他一直在慢慢但坚定地建立一个新的地下组织，建立新的联系，注入新的精神，并消除失败主义。他很快被视为地下组织的新领袖。\n\n如今德国已被俄罗斯击败，卡洛看到了一个他知道再也不会出现的机会。德国国防军陷入混乱，驻军失去了对他的家园的控制。他和他的同胞们终于执行了他们多年来一直在讨论的计划。\n\n即使卡洛内心仍然是一个和平主义者，他必须引领人民走向暴力之路，这是他必须承受的事实，尽管他自己也在与自己作斗争，但这仍然是一个必要的邪恶。俄罗斯的援助、波兰人的信仰和力量以及德国的失败将使这成为他最伟大的时刻，因为不仅仅是他，整个波兰民族都把信心和希望寄托在他身上。\n\n波兰是否会获得自由还有待观察，但现在已经没有犹豫的余地了，唯一的道路是前进，无论是通向自由还是通向集体坟墓，只有时间能告诉我们。"
 POL_Alfred_Urbanski:0 "奥尔德雷德·乌尔班斯基"
 ALFRED_URBANSKI_POLAND_DESC:0 "1899年出生的阿尔弗雷德·乌尔班斯基于1939年随波兰流亡政府逃离了即将崩溃的波兰共和国前往伦敦。在“海狮行动”后，政府被迫转移到华盛顿特区，并与包括维利·勃兰特的“帝国旗帜-§q黑§!-§x红§!-§w金§!”解放组织合作。\n\n对于阿尔弗雷德来说，波兰的解放似乎毫无希望。随着德国人第二次征服他的家园，他的信仰几乎与华沙市民一同消亡。波兰失去了，直到某个命运般的早晨，他收到了瓦西里·舒克申总统的一封信。俄罗斯人邀请他和波兰流亡者去哈萨克斯坦管理他的族人。\n\n阿尔弗雷德接受了邀请，并迅速成为所有在德国占领下生活的波兰人的代表。前往华沙的道路将是漫长的。然而，在他的人民和意想不到的俄罗斯盟友的支持下，一个自由波兰的梦想可能会比纳粹所预期的更早实现。"
 POL_Kazimierz_Puczynski:0 "卡齐米日·普琴斯基"
 POLITICS_POL_Kazimierz_Puczynski_DESC:0 "经历了30多年的冲突和种族灭绝，卡齐米日·普琴斯基站在一个面临不确定未来的波兰的领导岗位上，他的任务是为其居民铸造一个新的开端。普琴斯基于1908年3月3日出生在乌丰茨，父母都是工人阶级，在波兰沦陷于纳粹的进攻之前不久，他在华沙工业大学攻读水利工程学，正是这场灾难性的事件将普琴斯基推向了波兰地下组织。\n\n他沉浸于左翼理论，加入了波兰工团主义者联盟，迅速在社会主义知识分子和领导层中崭露头角。但随着德国人越过了A-A防线，同盟国承认了失败，普琴斯基与工团联盟剩余成员一起宣誓效忠波兰家国军的菲尔多夫，代表了该组织中最政治化的一派。家国军最终未能阻止\"东方总计划\"的恐怖以及波兰本身的毁灭，但在俄国入侵之后，重新夺回波兰主权的最后机会就在游击队掌控的克拉科夫，普琴斯基在起义的成功中功不可没。\n\n然而，短暂的和平机会并没有持续多久，德国人如今在一个红色政权下团结起来，向波兰前进，再次将其摧毁。普琴斯基被选为波兰的新专员，因为他的务实和愿意与德国人结盟，他采用了军事化的化名\"弗龙斯基\"作为亲切的别名。波兰被纳粹的压迫和种族灭绝不断打击，普琴斯基不禁想知道过去的恐怖是否会消失。"
