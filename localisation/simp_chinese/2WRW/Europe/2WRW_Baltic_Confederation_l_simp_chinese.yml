 OST_the_baltic_confederation: "波罗的海联邦"
 OST_the_baltic_confederation_desc: "实际上，波罗的海联邦并不是一个真正意义上的联邦。它更类似于一个邦联，这个邦联的成员国几乎完全自治，只有少数法律在全国范围内能够真正得到执行，如货币和海关法。\n\n每个组成国都有自己的议会和政府，并可根据自己的条件自由地举行自己的选举。\n\n这让波罗的海邦联得以保持相对稳定，这个制度只有一个缺陷：它实际上无法有效地管理自己，因为中央政府无权凌驾于各成员国的议会之上。"