 GEO_the_whispering_mountains: "群山低语"
 GEO_the_whispering_mountains_desc: "在格鲁吉亚高加索山脉深处，居住着许多少数民族群体，其中最大的是阿布哈兹人和奥塞梯人。虽然这些人曾与卡特韦利人一起与乔西亚斯的暴政作斗争，但他们现在梦想着拥有自己的国家。然而，格鲁吉亚政府对这些梦想和想法持激烈反对态度，压制少数民族的权利，并容许格鲁吉亚准军事部队在这些地区肆意妄为而无所处罚。那里的人们正准备迎接一场重大事件，而最近的寂静让人听起来宛如雷鸣。\n\n§R如果政府经历了长时间的政治不稳定，这些少数民族群体很可能会尝试建立自己的小国家。§!"
 GEO_the_smell_of_blood: "血色将至"
 GEO_the_smell_of_blood_desc: "当轴心国分配他们在第二次世界大战中获得的战利品时，土耳其从格鲁吉亚手中夺走了巴统地区。现在，格鲁吉亚已经从约西亚斯的法西斯暴政下解放，许多人正在为另一场即将到来的冲突做准备，因为他们认为，如果他们试图夺回自己的领土，那么俄罗斯人肯定会不由分说的支持他们。"
 GEO_tavisupali_sakartvelo: "“自由”格鲁吉亚"
 GEO_tavisupali_sakartvelo_desc: "“Tavisupali Sakartvelo”意为“自由格鲁吉亚”，这是执政党的名称。但从最乐观的角度来看，这个名称十分讽刺，因为它镇压少数群体的权利、言论自由、集会权和抗议权。甘萨胡尔迪亚总统认为，剥夺这些将民主区别于其他更邪恶意识形态的基本权利仅仅是“紧急措施”，直到当前的政治和种族危机得到解决。\n\n然而，对于人民来说，他们看到自己的英雄背叛了他们，而该国的少数群体甚至更不满。然而，每个人心中都有一个问题：如果这种情况不是暂时的呢？如果这成为新的常态呢？\n\n越多的人思考这个问题，越多的人开始对他们所生活的谎言感到幻灭；越多的人将为一个真正自由的格鲁吉亚而奋斗。"