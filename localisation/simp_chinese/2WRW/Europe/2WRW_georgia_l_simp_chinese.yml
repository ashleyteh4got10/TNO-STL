 GEO_Zviad_Gamsakhurdia: "兹维亚德·甘萨胡尔迪亚"
 POLITICS_ZVIAD_GAMSAKHURDIA_DESC: "1939年出生于格鲁吉亚的一个显赫家族，兹维亚德·甘萨胡尔迪亚只能回忆起德国入侵他祖国之前的一些片段记忆。其余的都是他父亲讲述的故事，他的父亲是本世纪最著名的格鲁吉亚作家之一。据说正是他父亲的作品激发了他保持梦想、为自由的格鲁吉亚而奋斗的勇气。\n\n在乔西亚斯长时间的恐怖统治期间，他尽力破坏纳粹的资源机器；组织罢工，窃取物资，并对纳粹车队进行袭击。这使他成为一个备受关注的目标，但也使他在普通的格鲁吉亚民众中间非常受欢迎。事实上，他两次被捕时，没有他的指导，他的人民就成功地将他从劳改营中解救出来。\n\n他可能在那些日子里是一个英雄，但甘萨胡尔迪亚关于格鲁吉亚庞大的少数民族群体的政策一直存在疑问，一些人甚至怀疑：为了稳定一个国家需要多少自由和权利？\n\n甘萨胡尔迪亚面临着一项艰巨的任务，为了完成这个任务，他必须把握好一个非常微妙的平衡。\n\n因为如果他偏向一方太多，他的统治将会结束。"
