l_simp_chinese:
 MOS_language_problem_russia:0 "语言问题"
 MOS_language_problem_russia_desc:0 "二战后的余波使西俄罗斯面临着一个挑战——德国定居者涌入主要城市。希特勒的遗嘱不仅重新绘制了地缘政治地图，而且也重新绘制了语言地图，因此，莫斯科的重建政府发现自己正在应对两种非常不同的语言和文化，这使得重新安置工作变得更加复杂。随着该地区努力调和其历史根源，还需要很多年才能让新的西部政府完全去殖民化莫斯科，更不用说德国影响更大的圣彼得堡了。"
 MOS_war_torn_region: "战乱地区 - GPO的遗产"
 MOS_war_torn_region_desc:0 "俄罗斯西部是[RUS.GetNameDef]和德国两国冲突的焦点。曾经是斯拉夫世界的壮丽之都，如今却带着战争留下的难以磨灭的伤痕。这座曾经历地狱般磨难的城市仍然屹立不倒，但它曾经宏伟的基础设施和充满活力的德国定居者社区如今成了空壳，是那场吞噬了整个地区的冲突的令人心悸的提醒。这片受伤的地区需要很长时间才能愈合。俄罗斯也许赢得了战争，但它能否迈向和平的大门尚未可知。"
 MOS_rural_state:0 "农村之国"
 MOS_rural_state_desc: "莫斯科专员辖区，就像所有德国殖民地一样，本应是雅利安人的完美天堂，直到现实展现了它丑陋的一面，因此这样一个项目的范围变得简单得多，突然之间，莫斯科维恩的目的只有两个：把俄罗斯奴隶放进工厂和把德国农民送到土地上。在德国定居点（或监狱）之外，没有时间或精力去发展城市，导致在希特勒去世后，它完全、血腥地“解散”。结果，莫斯科成为一个贫穷而悲惨的地方，人均GDP位于欧洲最低水平之列。像古老的农奴一样，俄罗斯莫斯科人挣扎着在曾经是财富和权力之地的地方勉强生存。"
 MOS_Novosibirsk_Administration_long:0 "西俄罗斯全俄罗斯军军管委员会"
 MOS_Novosibirsk_Administration_short:0 "ARMA（西俄罗斯）"