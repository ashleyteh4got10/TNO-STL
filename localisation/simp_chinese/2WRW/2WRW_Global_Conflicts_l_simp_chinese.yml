 RUS_winter_gear_desc:0 "在北欧冰天雪地的苔原深处进行的战争对于普通士兵来说往往是危险的，严寒的气温比任何步枪手都更具杀伤力。\n\n如果我们的军队装备精良，他们就能够在严酷的低温下生存下来，那么冬季战争对俄罗斯来说就不会那么致命了。"
