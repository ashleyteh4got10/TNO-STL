 Espionage_SAM_Tech_0_Desc: "空中侦察费用昂贵，容易被拦截，而且需要数百个小时的规划。相比之下，信鸽成群结队，能融入任何环境，而且很听驯养员的命令。将一台定时拍摄的微型摄像机绑在训练好飞行轨迹的鸽子身上，就可以提供比任何U2侦察机有更高保真度的俯拍照片——而且成本极低。"
 Espionage_SAM_Tech_1_Desc: "“肚皮钻”是“公司”派发的标准手摇式钻头的非正式名称。顾名思义，使用者用腹部将钻头紧紧抵在墙体上，通过转动手摇曲柄来打孔。熟练的操作者可以独自一人在木头和砖石上钻孔，并在孔洞里放入监听设备以监听毫无戒备的相邻房间。"
 Espionage_SAM_Tech_2_Desc: "科技进步给传统的谍报行业带来了新的方法和设备，但“玩弄光线”的本领仍然在“公司”人员的技能之列。经过特别设计的镜子可以让特工在处于特定角度时获取文字与图像信息，同时不引起别人的警觉。别人看到的只有美丽的女士在补妆，或者是男士在整理他们的发型。"
 Espionage_SAM_Tech_3_Desc: "每年售出的香烟比活着的人类还要多。只要不是在荒郊野外、战乱绝境或者禁烟区，每个人都恨不得往口袋里塞一盒好彩牌香烟。我们的特工可以利用这一点，在香烟盒里装入一个微型摄像机。至于那些被拿出来的“癌症棒”可不能浪费，只要别人愿意用香烟以物易物，或者是想收些好处抽点好烟，都可以随时问他们要不要来根华子。"
 Espionage_SAM_Tech_4_Desc: "一个特工想要深入敌后远行，只需要一张地图、一个指南针和他的火眼金睛。但在敌后，每格储存空间都很宝贵；又因为深入敌后，有没有指南针很大程度上决定了特工是能身体健康地回家还是患上疟疾任务失败。而微型指南针的体积小到可以装进纽扣孔，可以轻松解决普通指南针体积太大的问题。"
 Espionage_SAM_Tech_5_Desc: "在上流社交场合，伪装成绅士的特工往往难以接受指令，因为那里听众众多，容易引起怀疑。解决方法是在烟斗窄柄里装入专门设计的无线电，这些巧妙的装置能通过骨传导将声音从下颌骨传到耳道，在纸醉金迷的场合中，不会有人注意到我们的特工。"
 Espionage_SAM_Tech_6_Desc: "一个人留下他的垃圾，而另一个人来捡：这就是“死信箱”背后的运作原理，也是谍报中最古老的技术之一。随着微缩胶片作为存储介质的盛行，现代间谍现在可以将胶卷塞入不起眼的防水空心钉中，让他们的联系人在约定的日期和地点取走。"
 Espionage_SAM_Tech_7_Desc: "几十年来的事实证明，我们的“绅士”们交换信息时都是面对面接触，想要更谨慎一些就会用到读唇术。“公司”因此制作了一种超声波移动感应器。这种正常人察觉不到的脉冲能在不速之客不知情的情况下抓住他们窃听的企图，我们的“绅士”们就会知道把机密的对话转换为最无关痛痒的闲聊。"
 Espionage_SAM_Tech_8_Desc: "中央情报局之所以能在世界各地主动出击，很大程度上要归功于反对德日残暴统治的当地抵抗组织。然而，同这些组织进行合作，便需要与一些几乎不会英语的联络人频繁沟通。为了帮助他们识别敌人的装备，我们的技术人员设计了一种精巧的装置，装置上有旋钮，上有数字，旁边绘有大炮、车辆或飞行器的轮廓图。只需轻轻一转再打开开关，地面上或飞机上的情报员就会收到这些计数器输出的无线电信号脉冲。"
 Espionage_SAM_Tech_9_Desc: "对于旁人来说，这只是一枚1921年的一美元银币，纯度90%、宽一寸半的银币上是微笑的自由女神头像。\n\n对于“公司”来说，这是用一美元买来的国家机密。通货膨胀真过分，不是吗？"
 TNO_Espionage_GUI_RegionalNetwork_IRK: ""
 TNO_Espionage_GUI_RegionalNetwork_RUS: ""
 KGB_fuck_opposition_tt: "我们将开展一项行动，以抓捕国内的反对派。"
 #AFG_war.0.t: "俄罗斯正式介入阿富汗战争"
 #AFG_war.0.desc: "伴随着塔吉克共和国与阿富汗王国之间的边境冲突不断升级，杜尚别方面宣布其军队在“收回巴达赫尚”的名义下越境进入阿富汗巴达赫尚省北部。与此同时，俄罗斯联邦安全委员会发表声明，承认“对友邦的防务责任”，并正式宣布对塔吉克斯坦的军事援助进入“实战支持”阶段。\n尽管克里姆林宫方面坚称本次行动“不涉俄方地面部队直接参战”，但在过去48小时内，已有多起目击报告指出，带有俄军标志的物资运输车队与电子战平台出现在帕米尔高原至瓦罕走廊的山区道路上。同时，一批自称“军事技术顾问”的人员也已进驻塔军指挥系统。\n专家称，尽管第二次西俄战争落下帷幕不过半年，俄罗斯联邦一直将中亚地区视为“近邻影响区”。此次塔吉克斯坦的“收复故土”无疑是在俄罗斯默许甚至主导下展开的。国际事务研究所专家指出：\n“这并非单一代理人的孤立决策，而是俄方意图重建地区主导力的直接体现。”\n更令人关注的是，这一事件或将打破原本由冷战三极（美国、德国、日本）间接控制的“冲突烈度平衡”。如今，莫斯科公开介入局势，巨熊正在挥舞它的巨爪。 \n阿富汗尼斯坦的火星已然再度点燃。\n俄罗斯再度迈入帝国坟场，它能否重写历史，还是再次陷入泥潭？"
 #AFG_war.0.a: "俄罗斯联邦将恢复秩序。"

 USA.succession_letters.100.t: "切普致继任者的寄语"
 USA.succession_letters.100.desc: "亲爱的约翰，\n在你宣誓就职为这个国家的总统前夕，我写下这封信，既是传统，也是职责，更是沉甸甸的寄语。你我虽属同一党派，却属不同年代。你是太空时代的子嗣，是我那个世界无法预见之人的答案。我为你能接过这个国家的命运感到欣慰，也为你即将面对的事感到深深的不安。\n\n我从未幻想我们的时代可以结束冷战——它像一只嵌入骨肉的箭，无法拔除，只能与之共存。而你——你或许会被迫去转折它，或者终结它。\n你将面对一个更加复杂的世界。德国正重铸铁血意志，日本不再满足于经济奇迹，而俄国——不论他们是否滑向共产主义，他们仍有冬将军为伴。你必须在他们之间走钢丝，记住，这不是冷战的终点，而是另一场开始的预热。\n\n我曾试图恢复我们公民对民主的信任，建立南北之间的桥梁，降低城市贫民与农村失业者之间的裂痕。但我也失败了太多次。你会继承一个四分五裂的国家。你必须决定，是修复，还是重塑。\n\n你曾见过地球从轨道望去的景色，那颗蔚蓝星球仿佛没有国界。我希望你别因此忘了——地球上大多数人，从未感受过你所见的和平与辽阔。我们不能用太空的眼光审视人间疾苦，约翰，我们必须俯身。\n\n我留下了情报文件、副本与部分与国会的秘密协议摘要，在橡木书桌最下层。你会在那里找到真实的美国——并非海报上那个挥舞星条旗的约翰大叔，而是个脆弱、疲惫、盲目地寻找希望的国度。\n不要成为英雄。不要成为教父。成为人——一个有疑问、有悲悯、有恐惧的总统。历史会感谢你。\n\n愿上帝保佑你，保佑我们这个裂而未碎的合众国。\n\n以及，在此附上哈特前总统的签名，希望您能铭记他的贡献。"
 USA.succession_letters.100.a: "£hart_signature"
 USA.succession_letters.100.tt: "§Y在读完后，信被精心装裱起来，放在了总统的办公桌上。§!"

 USA.succession_letters.101.t: "戈德华特致继任者的寄语"
 USA.succession_letters.101.desc: "约翰先生敬启,\n\n在你走入椭圆办公室的那一刻，你会闻到一种熟悉的味道——不是权力的香气，而是陈旧、未曾愈合的焦土味。窗子可以擦得再亮，办公桌可以翻新，但你永远无法摆脱那些历史在墙上留下的灰烬。\n\n我曾以为我们这一代人能把美利坚从战争与动员的泥沼中拖出，把国家重新变成它该成为的样子：一个自由人的合众国，而不是战略家的棋盘。\n\n但我错了。我们都错了。\n\n约翰，我没有多少诗意可赠与你。作为共和党人，我不信仰救世主，也不相信任何一个人能独力改变历史的潮流。但我希望你能成为例外。你是我们那代人仰望星辰的证明，是美国仍未放弃梦想的象征。你见过黑色太空的沉默，却也要学会在国会大厅的噪声中坚持真理。\n\n你将接过一个不完整的国家。它被经济自满所腐蚀，被地缘焦虑所催老，被一场永无休止的“有限战争”所拖垮。我们在南非耗尽了信心，却又不敢停下。我们把“稳定”包装成了胜利，把“秩序”替代了自由。我们不再是那个在独立宣言上签名的国度了，而是一个怕输的庞然巨兽。我在任内曾试图用清晰的军事逻辑与宪政信念为国家止血，但事实证明，你无法在不断妥协中守住原则的清白。\n\n你也许可以。你是飞行员，是战士，是英雄。我羡慕你仍有理想——我真心如此。我曾亲眼看着理想一个接一个地死在听证会、预算案和外交照会里。你可能是我们最后的希望，约翰。不是因为你是某个党派的代表，而是你是那代孩子的化身，那些望着月亮却长在战后废墟上的孩子。他们相信美国能做好事，不是因为权力，而是因为正义本身。\n不要让他们失望。\n\n也不要让那些还在坟场里战斗的人失望。你将不得不为他们的牺牲寻找意义——即使它早已被掩埋在碎石和灰尘之下。总统先生，你的办公室比月球更孤独，比冷战更寒冷。请在孤独中记得你的誓言，在寒冷中守住你本来的温度。\n愿上帝、宪法、与良知与你同在。"
 USA.succession_letters.101.a: "£goldwater_signature"
 USA.succession_letters.101.tt: "§Y这封信被珍藏了起来。§!"

 USA.succession_letters.102.t: "哈林顿致继任者的寄语"
 USA.succession_letters.102.desc: "约翰先生敬启,\n\n我写信的桌子上，落着一层细雪，是清晨从窗缝吹进来的。或许是空调系统年久失修，也可能只是命运给这幢屋子开的一个讽刺玩笑。我们习惯了把一切归结为“系统性故障”，而不是承认，有时候，是我们自己忘了关窗。\n\n你将走进这个办公室时，请带着比我更多的勇气。我所做的一切，只是放慢了国家腐烂的速度，而你——你要在这座庞大的、分裂的机器中找回它的魂。\n\n你是个宇航员，我不是。我来自马萨诸塞州福尔里弗的街区，他们用脊梁撑起一代工业奇迹，却在今天连屋顶都漏雨。我的政纲写着“公平”、“机会”、“人权”，可等我登上讲台，才发现大多数人要的不是宏大叙事，而是一份稳定的班次表和能准时抵达的公交车。\n总统职位没能给我带来改变世界的力量，它只带来了看着世界缓慢塌陷的清晰。你会继承一份稳定的通胀曲线和一组漂亮的就业数字，但请不要被这些骗了。我们的城市正在空心化，小镇正在老去，富人从天空中飞跃，穷人则在地铁口冻死。美国没有失去她的力量——她只是忘了那力量本该为何而用。\n\n我曾试图与国会合作，推动基础设施现代化，扩大教育投入，限制财团的政治干预。但每一次努力都会在“国家安全”、“市场自由”或“预算限制”三种语言中被翻译成废纸。\n\n你不同，你不欠他们什么。你来自另一个世界——真正的高处。你看到过星辰，也见证过人类突破极限的时刻。现在，请你低头看看，这个国家的土地，这些人的眼睛。别被冷战的神话拴住手脚，也别被“权威”与“忠诚”淹没理智。总统不是将军，不是救世主，是人民的代理人。记得这点。我们不需要另一个热血的护旗手，我们需要一个清醒的医生，开刀、止血、不颤手。\n\n我只求你一件事：\n别在体制中迷路。\n\n白宫里有足够多的人告诉你什么“不能做”，但很少有人会告诉你，“你可以。”你可以为底层人建校舍、为失业者争权利、为孤独的老人送去取暖补贴，你可以——但你必须忍受那些告诉你“这不是你的事”的人。\n\n他们错了。\n这是你的事。现在，这都是你的事。\n愿你比我勇敢，比我清醒。"
 USA.succession_letters.102.a: "£harrington_signature"
 USA.succession_letters.102.tt: "§Y总统端详着这封信，似乎若有所思。§!"

 USA.succession_letters.103.t: "史密斯致继任者的寄语"
 USA.succession_letters.103.desc: "约翰先生敬启,\n\n你接下的，是一份沉重的职责，也是一段尚未平息的余音。\n\n当我第一次步入这个办公室，距离我在参议院发表那场反对恐惧政治的演讲，已经过去了二十多年。我曾以为，勇气是历史会自然奖赏的美德。但后来我才懂，历史从不奖赏，它只记录。而真正的奖赏，来自你有没有把良知带进办公室，又是否能带着良知离开它。\n\n你会听到无数声音告诉你：“现在不是理想主义的时候”，“稳定压倒一切”，“技术比道德更中立也更可靠。”也许他们有他们的道理——但我告诉你：我们曾因为这些话，让太多的错误变得合理。\n\n别误会，我不是反对技术。我知道你从太空回来时心中所感，那是我这一代从未体验过的视野。我也知道你对数据的尊重，对计算精度的信任。但约翰，美国不能只是一个大型程序的输出结果，它是有骨血的，是人民，是他们的希望、恐惧、偏见和善意混杂而成的东西。\n\n我担心你会把这国家看得太理性，而忘了它的混乱。这个国家已经在恐惧中活了太久，从反共清洗、政党合并，到灰色地带里发生的那些“保密行动”。我们不能再继续让人们相信自由只是个阶段性口号，不能再让道德败退到“国家利益”这四个字后面。\n\n你不必迎合每一个趋势，但你必须知道每一个妥协的代价。我知道你比我年轻得多，也更加相信世界可以被理解。也许它可以。但愿你能证明我是错的——错在对人类太悲观，错在对机器太不信任，错在对未来不再有激情。\n\n但即便如此，我还是想请你守护几样东西。\n\n请守护宪法，它不完美，但它是我们试图成为更好的自己的凭据。\n请守护真话的权利，因为我们已经太久没有真正对民众说真话了。\n请守护平凡人过上不那么惊惧生活的权利，他们是共和国最后的锚。最后，记得这句话——是我年轻时写在日记里的：\n\n“一个国家的尊严，不体现在它如何赢得战争，而在于它是否有勇气避免它。”\n\n这是一份不再被重读的信条，但它曾支撑我们渡过最黑暗的时刻。\n希望它也能陪你，度过那些即将来临的风暴。\n\n愿你在夜深时依旧安宁，愿你在孤独中不失方向。"
 USA.succession_letters.103.a: "£smith_signature"
 USA.succession_letters.103.tt: "§Y珍藏以供后世阅览。§!"