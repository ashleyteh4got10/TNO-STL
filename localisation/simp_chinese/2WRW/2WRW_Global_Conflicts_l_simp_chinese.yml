 Espionage_SVR_Tech_0_Desc: "空中侦察费用昂贵，容易被拦截，而且需要数百个小时的规划。相比之下，信鸽成群结队，能融入任何环境，而且很听驯养员的命令。将一台定时拍摄的微型摄像机绑在训练好飞行轨迹的鸽子身上，就可以提供比任何U2侦察机有更高保真度的俯拍照片——而且成本极低。"
