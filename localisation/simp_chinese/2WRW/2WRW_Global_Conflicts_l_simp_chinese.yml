 RUS_Hungarian_civil_war_category:0 "匈牙利内战"
 RUS_Hungarian_civil_war_category_commie_desc:0 "多年来，匈牙利在意大利和德国势力的外交斗争中扮演着至关重要的角色。随着民族社会主义政权的暴力崩溃，德国倾向的匈牙利人很快就会走上类似的道路。\n\n伊姆雷·纳吉是一个雄心勃勃的人，他希望推动与巴尔干地区新兴社会主义政府更紧密合作，他请求我们的帮助，消除威胁其在西南边境的对手政权。虽然我们政府内部的一些人主张出于巩固匈牙利革命理想的名义进行全面干预，但俄罗斯作为一个备受战争疲惫的国家，阻止了这样的干预。因此，我们被迫以更加隐秘的方式支持纳吉的政府。尽管我们不能完全支持我们的地区盟友，有一点是肯定的：如果我们与伊姆雷站在一起，匈牙利将永远欠我们一笔人情。"
 RUS_Hungarian_civil_war_category_dem_desc:0 "多年来，匈牙利在意大利和德国势力的外交斗争中扮演着至关重要的角色。随着民族社会主义政权的暴力崩溃，德国倾向的匈牙利人很快就会走上类似的道路。\n\n费伦茨·纳吉是一个具有正义道德观念和建立匈牙利永久民主政府意愿的人，他请求我们帮助消除威胁他们在乡村地区前哨站的对手政权。尽管我们内部的一些人主张出于巩固匈牙利的民主价值观而进行全面干预，但俄罗斯作为一个备受战争摧残的国家，阻止了这样的干预。因此，我们被迫以更加隐秘的方式支持纳吉政府。虽然我们无法完全支持我们的地区盟友，但有一点是确定的：如果我们与费伦茨站在一起，匈牙利将永远欠我们一笔人情。"
 GER_Hungarian_civil_war_category_desc:0 "作为在1940年代荣耀时期最早签署《三头同盟》的国家之一，匈牙利几十年来一直是德国在欧洲的宝贵盟友。几年前意大利未能从我们手中夺取这个国家时，我们认为布达佩斯将继续成为巴尔干地区坚定的德国理念前哨。\n\n然而，现实并非如此。\n\n在我们在第二次西俄战争中被斯拉夫势力彻底击败并完全失去东部领土之后，贝拉·伊姆雷迪已经消失，费伦茨·萨洛希接替他成为匈牙利的独裁者。看来当地人民对这一变化表示不满，该国已陷入三方内战。在确定没有俄罗斯干预匈牙利事务后，直接干预是不可行的；然而，如果我们能在秘密支持萨洛希的情况下重新夺回多瑙河流域，我们就能确保匈牙利在未来几代人的手中。"
