 Espionage_Andropov: "尤里·安德罗波夫"
 Espionage_Andropov_Desc: "尤里·安德罗波夫在苏联情报领域的印记，如同精密机械中的核心齿轮，既驱动着庞大系统的运转，又悄然改变其内部构造。执掌克格勃的十五年间，他以工程师般的严谨重构情报机构的运作逻辑，将传统的人海战术升级为体系化、科学化的信息战网络。其办公室内的世界地图布满彩色标记，每个符号背后都隐藏着跨越东西方阵营的情报节点——从驻外使馆的“合法特工”到潜伏在科研机构的“休眠者”，层层嵌套的间谍体系被他梳理成可量化的数据模型。\n\n安德罗波夫对技术的前瞻性投入重塑了冷战情报战的形态。他主导建立的信号情报系统“棱镜”，能同时截获数十个国家的通讯频段，配合密码学家研发的“量子”破译算法，西方外交密电的保密期从数月缩短至数周。在生物识别技术尚未普及的年代，克格勃档案库已存储超过200万份声纹样本，通过自主研发的声谱比对设备，一通匿名电话的溯源时间不超过48小时。这些技术突破不仅提升了情报获取效率，更将信息优势转化为战略威慑——西方情报机构内部流传的“安德罗波夫黑箱”传说，实质是对其技术降维打击的恐惧。\n\n在人力情报领域，他推行“专业化分层”策略。基层情报员接受模块化训练，如同流水线工人般专注单一技能；精英特工则被赋予跨学科培养，需掌握从核物理到摇滚文化的复合知识。莫斯科郊外的“森林学校”里，学员在模拟西方社区生活的同时，还要研读《时代》周刊的广告版面——安德罗波夫坚信，意识形态渗透需包裹在生活细节的糖衣之下。他亲自设计的“镜像反侦察”战术，要求驻外特工完全复制目标人物的行为模式，这种将自我身份彻底工具化的训练方式，催生出冷战史上最难以辨识的“幻影特工”。\n\n安德罗波夫的情报哲学强调“预防优于反应”。他扩建的第五总局不再满足于事后追查，转而通过社会心理学模型预判思想异动，高校里的文学社团、工厂中的技术沙龙都被纳入监测网格。更隐蔽的是“信息生态干预”策略：在学术期刊中混入特定数据，通过看似中立的研究报告影响对手决策；在海外黑市构建虚假技术交易链，诱使目标国陷入战略误判。这种将情报工作前置为“认知塑造”的理念，使得克格勃从情报收集机构蜕变为具备主动干预能力的战略工具。\n\n当安德罗波夫离开克格勃时，留下的不仅是升级换代的技术装备，更是一套融合控制论与博弈论的情报方法论。他像程序员编写底层代码般，将意识形态对抗转化为可计算、可预测的系统工程。这种将情报工作科学化的尝试，既为苏联打造出史上最严密的信息盾牌，也埋下了过度依赖技术理性的隐患——当人性的混沌最终冲破数据模型的框架时，那些精密的齿轮终究未能咬合时代的骤变。"

 Espionage_Map_NA_Desc_CHT: "§M北美洲§!是§m美国§!及其近邻的故土，是名副其实的自由世界中心。"
 Espionage_Map_CA_Desc_CHT: "根据§D门罗主义§!的宗旨，§m美国§!有保护§Y中美洲§!众国不受外来侵略的责任。但这一说辞并不能为§m美国§!阴影下的其它国家所信服，她们越来越多地转身寻求§g德国§!或§e日本§!的支持。如果§m美国§!想要维持住在新大陆的霸主地位，她必须向此施加更强大的影响力。"
 Espionage_Map_SA_Desc_CHT: "§R南美洲§!是一个由各色国度组成的大熔炉，所以这些国家的利益并不总见得与§m美国§!保持一致。为了确保§m美国§!在该地区的绝对影响，§m美国§!必须将一切外国势力绳之以法。如果让§g德国§!或§e日本§!插足§R南美§!，§m美国§!对新大陆统治的千里之堤或将毁于蚁穴。"
 Espionage_Map_EU_Desc_CHT: "欧洲被§g大日耳曼国§!及其§g团结协定§!的附庸、§G意大利§!及其§O三头同盟§!的前盟友、§R不列颠群岛§!和§M斯堪的纳维亚诸国§!所分割。在§g德国§!治下，欧洲黯淡无光，但§m我们§!的影响力或许能推翻旧世界的独裁统治。"
 Espionage_Map_RU_Desc_CHT: "昔日的§G俄罗斯§!军阀已经统一。我们从废墟中崛起，走向更加美好的未来。"
 Espionage_Map_AF_Desc_CHT: "§O非洲§!几个世纪以来一直是任人宰割的殖民地，尽管这种情况现在有了变化。§g德国§!、§G意大利§!、§Q法国§!和§Y西班牙§!摇摇欲坠的统治给了§m美国§!可乘之机去影响非洲大陆。"
 Espionage_Map_ME_Desc_CHT: "§L中东§!是国际政治的大熔炉，从§G意大利§!控制的油田到超级大国在沙特阿拉伯和伊朗的商业利益，应有尽有。扩张§m美国§!在这个世界经济锚地中的影响力至关重要。"
 Espionage_Map_EA_Desc_CHT: "§e日本§!的核心领土是§e旭日帝国§!的大脑，向外挥舞着§R共荣圈§!扩张的突触，构成了§m美国§!冷战最大劲敌的神经中枢。无论§m美国§!的政治集团今后是寻求与§G东亚§!巨人的对抗抑或和解，为了更好地做出决策，在§e日本§!和§B中华民国§!构建一个庞大的情报网势在必行。"
 Espionage_Map_OC_Desc_CHT: "§P大洋洲§!是§M自由国家组织§!对抗§R共荣圈§!的前线。澳大利亚和新西兰的防御对§mOFN§!至关重要。§P大洋洲§!仍然是打击§e大日本帝国§!行动的关键起点。确保§m美国§!在该地区的强大影响力至关重要。"
 TNO_Espionage_GUI_TechnologyWindow_Title_CHT: "科学技术处"
 Espionage_CHT_Tech_0: "鸽子相机"
 Espionage_CHT_Tech_1: "肚皮钻"
 Espionage_CHT_Tech_2: "暗号镜"
 Espionage_CHT_Tech_3: "香烟盒相机"
 Espionage_CHT_Tech_4: "微型指南针"
 TNO_Espionage_GUI_Research_Row2: "§W装备与训练§!"
 Espionage_CHT_Tech_5: "烟管无线电"
 Espionage_CHT_Tech_6: "胶片钉"
 Espionage_CHT_Tech_7: "移动感应器"
 Espionage_CHT_Tech_8: "图形计数器"
 Espionage_CHT_Tech_9: "空心硬币"
 Espionage_CHT_Tech_0_Desc: "空中侦察费用昂贵，容易被拦截，而且需要数百个小时的规划。相比之下，信鸽成群结队，能融入任何环境，而且很听驯养员的命令。将一台定时拍摄的微型摄像机绑在训练好飞行轨迹的鸽子身上，就可以提供比任何U2侦察机有更高保真度的俯拍照片——而且成本极低。"
 Espionage_CHT_Tech_1_Desc: "“肚皮钻”是“公司”派发的标准手摇式钻头的非正式名称。顾名思义，使用者用腹部将钻头紧紧抵在墙体上，通过转动手摇曲柄来打孔。熟练的操作者可以独自一人在木头和砖石上钻孔，并在孔洞里放入监听设备以监听毫无戒备的相邻房间。"
 Espionage_CHT_Tech_2_Desc: "科技进步给传统的谍报行业带来了新的方法和设备，但“玩弄光线”的本领仍然在“公司”人员的技能之列。经过特别设计的镜子可以让特工在处于特定角度时获取文字与图像信息，同时不引起别人的警觉。别人看到的只有美丽的女士在补妆，或者是男士在整理他们的发型。"
 Espionage_CHT_Tech_3_Desc: "每年售出的香烟比活着的人类还要多。只要不是在荒郊野外、战乱绝境或者禁烟区，每个人都恨不得往口袋里塞一盒好彩牌香烟。我们的特工可以利用这一点，在香烟盒里装入一个微型摄像机。至于那些被拿出来的“癌症棒”可不能浪费，只要别人愿意用香烟以物易物，或者是想收些好处抽点好烟，都可以随时问他们要不要来根华子。"
 Espionage_CHT_Tech_4_Desc: "一个特工想要深入敌后远行，只需要一张地图、一个指南针和他的火眼金睛。但在敌后，每格储存空间都很宝贵；又因为深入敌后，有没有指南针很大程度上决定了特工是能身体健康地回家还是患上疟疾任务失败。而微型指南针的体积小到可以装进纽扣孔，可以轻松解决普通指南针体积太大的问题。"
 Espionage_CHT_Tech_5_Desc: "在上流社交场合，伪装成绅士的特工往往难以接受指令，因为那里听众众多，容易引起怀疑。解决方法是在烟斗窄柄里装入专门设计的无线电，这些巧妙的装置能通过骨传导将声音从下颌骨传到耳道，在纸醉金迷的场合中，不会有人注意到我们的特工。"
 Espionage_CHT_Tech_6_Desc: "一个人留下他的垃圾，而另一个人来捡：这就是“死信箱”背后的运作原理，也是谍报中最古老的技术之一。随着微缩胶片作为存储介质的盛行，现代间谍现在可以将胶卷塞入不起眼的防水空心钉中，让他们的联系人在约定的日期和地点取走。"
 Espionage_CHT_Tech_7_Desc: "几十年来的事实证明，我们的“绅士”们交换信息时都是面对面接触，想要更谨慎一些就会用到读唇术。“公司”因此制作了一种超声波移动感应器。这种正常人察觉不到的脉冲能在不速之客不知情的情况下抓住他们窃听的企图，我们的“绅士”们就会知道把机密的对话转换为最无关痛痒的闲聊。"
 Espionage_CHT_Tech_8_Desc: "中央情报局之所以能在世界各地主动出击，很大程度上要归功于反对德日残暴统治的当地抵抗组织。然而，同这些组织进行合作，便需要与一些几乎不会英语的联络人频繁沟通。为了帮助他们识别敌人的装备，我们的技术人员设计了一种精巧的装置，装置上有旋钮，上有数字，旁边绘有大炮、车辆或飞行器的轮廓图。只需轻轻一转再打开开关，地面上或飞机上的情报员就会收到这些计数器输出的无线电信号脉冲。"
 Espionage_CHT_Tech_9_Desc: "对于旁人来说，这只是一枚1921年的一美元银币，纯度90%、宽一寸半的银币上是微笑的自由女神头像。\n\n对于“公司”来说，这是用一美元买来的国家机密。通货膨胀真过分，不是吗？"

