 GAW_LAR_war_desc_tt: "中国像布哈林倒台时的苏联一样摇摇欲坠。然而，即使我们的祖国的痛苦也无法与中华大地遭受的一个半世纪的屈辱相比。自沙皇尼古拉二世登基之前，日本人就一直在侵蚀中国，直到中国变得面目全非，任人宰割。然而，并不是每一个中国人都接受了被日本侵略者踩在脚下的事实。南京集团现已和日本人决裂，'东亚新秩序'的毁灭已是板上钉钉，在沉默了二十年之后，新生的中国将对日本再度发起挑战，用鲜血换来自由。而§m我§B们§F，将会竭尽全力支持中国人，完成'推回'战略的最后一步，让这狗屁的'东亚共荣'彻底被扫入垃圾堆。\n\n高宗武发现自己正站在一个十字路口。一方面，他目睹了蒋介石未能捍卫中国、未能真正实施三民主义并未能将中国带入现代化的失败，十年前他忍辱负重，剿灭了龙云的'护国军'，背上了'汉奸'之名。另一方面，投降将意味着在可预见的未来，中国将永远被日本踩在脚下，无论国民党还是共产党，都将成为日本那可悲新秩序的陪葬品，而他和他的同僚们也将以死亡收场。也许，他所需要的只是一些时间来让一切重回正轨。\n\n§B还有一些朋友。§!"
 jap_GAW_LAR_uprising_desc_tt:0 "自从多年前日本获得胜利以来，财富和繁荣就源源不断地从大陆流向他们的上位者。然而，现在，帝国再次面临威胁。二十年前，伟大而荣耀的§x大日本帝国§F陆军击溃了中国人，东亚新秩序就此建成。然而，在§B俄罗斯§F和§m美国§F的秘密援助下，中国人居然敢与光荣的§x大日本帝国§F叫嚣，妄想蚍蜉撼树，摧毁我们大和民族百年来的伟大成就。\n\n因此，§x大日本帝国§F现在集结军队，旭日旗在风中飘扬。她决不允许区区中国人打败他们的上位者。\n\n§x大日本帝国§F绝不投降，\n§x大日本帝国§F绝不失败，\n§x大日本帝国§F绝不屈服于他们的臣民。\n\n§V§x大日本帝国§F的旭日旗帜永不落。§!"
 USA_German_civil_war_category_desc:0 "在元首马丁·鲍曼离世以及在第二次西俄罗斯战争中战败之后，德国陷入了一场毁灭性的内战，彻底结束了其超级大国的地位。这场灾难为美国提供了一个千载难逢的机会，可以一劳永逸地将欧洲的灵魂从国家社会主义中清洗出来——这就是所谓的 “德意志共和国”，它是勃兰特在柏林的短命政府的正式继承国。\n\n尽管在美国民众中，支持德国政府可能不太受欢迎，但通过提供武器和其他军事物资，我们的秘密援助可能会彻底倾斜天平，使局势朝着向他们——以及我们——有利的方向发展。在这场赌局中，所有人都必须参与进来，因为如果德国再次陷入纳粹主义的深渊，他们的人民可能再也无法摆脱其掌控。"
 rus_iran_war_desc_tt:0 "伊朗帝国曾经是团结协定的盟友，是德国在中东的主要立足点。但随着穆罕默德-礼萨·巴列维沙阿的去世——这位不受欢迎的人物负责该国与德国的结盟——该国陷入了血腥的内战。当游击队和叛逃军队在狂风肆虐的沙漠和烈日炙烤的山脉中作战时，国内外许多人都希望俄罗斯能够对南方的激烈冲突表明立场。\n\n这场战争吸引了许多全球大国的目光。美国、日本、德国都支持各自的派别。我们政府的强硬派和鹰派要求我们也这样做。尽管我们的祖国最近才在我们的旗帜下重新统一，但现在似乎是将纳粹赶出中东，并保护我们的软肋免受团结协定广泛影响的好时机。"
 rus_poland_war_desc_tt:0 "俄罗斯和波兰的历史大部分都是血腥和毁灭的。但是，尽管我们在遥远的过去犯下了许多罪孽，但在三十年前背叛波兰的罪行中，没有任何一项超过了我们。我们两国都承担了那个错误的后果。波兰仍然处于纳粹统治之下；我们的军队停留在波兰家园的大门口，只因核战争的威胁才被迫离开。与此同时，祖国正在重建，德国人正试图夺回他们帝国的废墟。波兰就在他们的掌握之中，因此波兰人在他们那些凶残的手中受苦。\n\n我们辜负了波兰，也辜负了自己。我们对几年前允许纳粹入侵的错误负有责任。虽然我们曾经是竞争对手，但现在我们有着共同的敌人和共同的历史。我们不能允许我们的兄弟被撕裂成碎片。\n\n只要有一个人抵抗，波兰就还没有灭亡。"
 rus_armenia_war_desc_tt:0 "在三头同盟瓦解之后，土耳其走上了一条黑暗之路，像他们的奥斯曼祖先一样在中东扩张。他们以推动建立一个统一和同质的土耳其国家为幌子，通过土耳其化政策占领和镇压少数族群。他们曾参与第二次世界大战，导致了高加索战线崩溃，使德国人夺取了阿塞拜疆广阔的油田，也使苏联人民陷入几十年的苦难和暴政。\n\n世界可能已经忘记了土耳其的行为，但俄罗斯没有忘记。\n\n随着高加索人民团结起来，为争取摆脱土耳其统治的权利而战，高加索山脉再次燃起熊熊烈火。我们将帮助高加索人民击败我们共同的土耳其敌人，最终报复那个给我们人民带来苦难的国家。"
 rus_mongolia_war_desc_tt:0 "当旧联盟崩溃时，许多曾受其保护的国家变得脆弱不堪，而秃鹫们也很快撕裂了我们祖国的势力范围。\n\n蒙古是其中一个国家，它成为了外部势力野心的牺牲品。在我们在伟大的卫国战争中受辱地失败之后，蒙古迅速被日本占领，并纳入蒙疆——这个地区一直在与大日本帝国及其庞大的中国傀儡政权网络进行持续的抗战。\n\n尽管抵抗在二十世纪六十年代初达到巅峰，但人民仍在为自由蒙古的梦想而奋斗。蒙古的叛军现已重组，战斗仍在继续，我们是时候介入这场长达数十年的冲突，解放我们曾经的盟友了。"
 rus_west_china_war_desc_tt:0 "中国像布哈林倒台时的苏联一样摇摇欲坠。然而，即使我们的祖国的痛苦也无法与中华大地遭受的一个半世纪的屈辱相比。自沙皇尼古拉二世登基之前，日本人就一直在侵蚀中国，直到中国变得面目全非，任人宰割。那些没有向南京集团屈膝的中国人如今躲藏在西部。在仍然存在的国民党派系中，马继援的势力表现出最大的主动性，不断袭扰着辻政信的领地。大多数国家已经抛弃了世界的这一部分。然而，在计划大博弈的下一步行动时，俄罗斯正在观察着，密谋着。\n\n马继援自己正站在一个十字路口。一方面，他目睹了蒋介石未能捍卫中国、未能真正实施三民主义并未能将中国带入现代化的失败。另一方面，投降将意味着他和国民党的其他成员将以耻辱的死亡收场。也许，他所需要的只是一些时间来让一切重回正轨。\n\n§B还有一些朋友。§!"
 GER_krakow_uprising_tt:0 "自1945年的胜利以来，波兰已成为大日耳曼国日益不可或缺的一部分。随着波兰野蛮人被雅利安殖民者逐渐推向东方，人们认为波兰永远也不会再崛起。\n\n我们错了。\n\n就在波兰人似乎终于被平定之际，波兰抵抗力量的残余再次崛起，为波兰的解放发起了最后的决胜行动。尽管我们最狂热的人要求我们让德国国防军全力镇压叛军，但我们政府中的许多人担心俄罗斯联邦将直接介入，使得东欧再次陷入另一场可怕的战争。\n\n虽然重新征服波兰将比1939年更加复杂，但波兰人将再次在德军的强大力量面前崩溃，我们将以雅利安民族的名义再次收复欧洲。"
 GER_mountain_war_desc_tt:0 "当土耳其加入轴心国时，他们的参与对于在高加索山脉击退苏联军队起到了至关重要的作用。在实现他们对中东的新奥斯曼野心之后，该国曾一度成为意大利领导的“三头同盟”成员，然后在联盟解体后保持中立。\n\n土耳其在第二次世界大战期间曾经帮助我们抵抗同盟国，因此，我们也应该支持他们对抗俄罗斯支持的亚美尼亚和格鲁吉亚。\n\n在第二次西俄战争中，我们可能在俄国人手中吃了败仗，但就像我们以前一样，德国将重建自己，并与这群鼠辈对抗，无论他们敢在哪里出现。"
 jap_west_china_war_desc_tt:0 "自从多年前日本获得胜利以来，财富和繁荣就源源不断地从大陆流向他们的上位者。然而，现在，帝国再次面临威胁。那些不服管教的马家军，不过是残余国民党的私人封地，却威胁着帝国通过艰苦奋斗和硬战所获得的一切。他们威胁要把日本的所有领土从她手中夺走，并将帝国贬低为战间期那时屈辱的地位！\n\n因此，日本现在集结军队，旭日旗在风中飘扬。她决不允许区区军阀打败他们的上位者。日本绝不投降，绝不失败，绝不屈服于他们的臣民。\n\n§V旭日永不落。§!"
 jap_mongolian_uprising_desc_tt:0 "自从上世纪四十年代中期苏联解体以来，当最后一批欧洲殖民者被消灭后，我们绝对地掌握了东亚自由世界。随着欧洲将注意力转回国内事务，美国被排挤出太平洋，俄罗斯的威胁也破碎了，我们相信一个繁荣时代即将迅速到来东亚。亚洲在一段时间内确实繁荣了，但近年来，情况开始对我们不利。\n\n令人难以置信的是，位于新西伯利亚的神秘联邦不仅成功统一了残存的俄罗斯，还在东欧击败了德国人。复兴的俄罗斯再次开始扩展其在亚洲的触角，干预各种冲突和争端，比如最近的蒙古叛乱，以重建其失去的势力圈。\n\n在德国无力阻止俄罗斯巨人的情况下，大东亚共荣圈必须站出来反对俄罗斯的扩张主义，并确保东亚的持续独立免受任何外来影响。\n\n§V亚洲万岁。旭日万岁。§!"
 RUS_German_civil_war_category:0 "第二次德国内战"
 RUS_German_civil_war_category_commie_desc:0 "在元首马丁·鲍曼离世并且大日耳曼国在第二次西俄罗斯战争中战败之后，德国陷入了一场毁灭性的内战，这场内战实际上永远地结束了德国作为超级大国的地位。这场灾难为俄罗斯的影响领域打开了许多机会。其中一个机会就是西北地区的革命联盟，他们组成了一个被称为“红色阵线”的不稳定联盟。\n\n虽然公开支持德国政府可能不会受到我国人民的欢迎，但以武器和其他军需品形式提供的秘密援助可能会使天平决定性地向他们——和我们——倾斜。在这场赌局中，我们必须齐心协力，因为如果德国再次陷入纳粹主义的深渊，他们的人民可能再也无法摆脱其掌控。"
 RUS_German_civil_war_category_dem_desc:0 "在元首马丁·鲍曼离世并且大日耳曼国在第二次西俄罗斯战争中战败之后，德国陷入了一场毁灭性的内战，这场内战实际上永远地结束了德国作为超级大国的地位。这场灾难为俄罗斯的影响领域打开了许多机会。其中一个机会就是所谓的“德意志共和国”，它是勃兰特短暂政权的正式继承国，试图在德国领土内维护民主和自由。\n\n虽然公开支持德国政府可能不会受到我国人民的欢迎，但以武器和其他军需品形式提供的秘密援助可能会使天平决定性地向他们——和我们——倾斜。在这场赌局中，我们必须齐心协力，因为如果德国再次陷入纳粹主义的深渊，他们的人民可能再也无法摆脱其掌控。"
