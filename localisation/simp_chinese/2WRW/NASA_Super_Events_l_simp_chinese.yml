 NASA_SE_Lunar_Landed_D: "这是我个人的一小步，却是人类迈出的一大步。\n- 尼尔·阿姆斯特朗，[GetDate]UTC"
 NASA_SE_Lunar_Landed_A: "鹰已着陆"
 NIKA_Title: "演讲"
 NIKA_Desc: "“想想未来吧，人类千秋万代的命运就在我们手中，我们的决定也许就是关键的转折：是待在地球上，还是在宇宙各处建立殖民地？两种选择简直是云泥之别。地球上的能源有限，最终能养活的人口也就有限；但如果我们能去到太阳系，甚至更远的太空，到银河系其他地方去，找到宜居行星来殖民，就能拥有大量可用能源，养活多得多的人口。就在此地，就是现在，我们迈出了进入太空的第一步，虽然我们摔倒了。确实，摔倒很痛，但如果不走这一步呢？ 那就是关上了进步的大门。我们需要迎难而上，向着星辰大海前进，谢谢。\""
 NIKA.a: "满坐寂然。"