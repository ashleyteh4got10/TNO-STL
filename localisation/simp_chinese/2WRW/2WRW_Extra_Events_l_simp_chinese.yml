l_simp_chinese:
 star_wars.1.t: "[Get_newspaper_header]《星球大战》上映"
 star_wars.1.desc: "戏剧观众们在世界各地庆祝新的电影巨作《星球大战》的发布。这个故事讲述了来自沙漠星球塔图因的农民卢克·天行者，他在发现自己是绝地武士的命运后，展开了一段穿越星际的旅程。\n\n《星球大战》被评论家称为“出人意料的颠覆性作品”，故事发生在旧共和国和银河第三帝国之间的第三次银河战争期间。斯塔基勒并不效力于腐败的共和国，而是与他的绝地导师奥比-旺·克诺比一同前往有争议的奴隶世界科米诺尔，帮助泛银河反抗军。\n\n虽然帝国元帅达斯·维达杀死了奥比-旺，但卢克带领反抗军在对恐怖的帝国死星的太空进攻中取得了胜利，并迫使共和国和帝国军队溃不成军地撤退。"
 star_wars.1.a: "来自更文明时代的优雅武器"
 star_wars.2.t: "这次他们做得太过分了！"
 star_wars.2.desc: "尊敬的首相，\n\n尽管我们坚定而高尚地试图安抚这些恶毒的美国人，他们还是对我们的国家发起了又一次宣传攻击。一个名叫乔治·卢卡斯的无名导演竟然创作了一部完全嘲笑日本人并侮辱大东亚共荣圈的作品，名为《星球大战》。这部帝国主义电影以一种完全不可接受的方式描绘了我们的文化。所谓的第三银河大战中的两个交战方明显是以自由国家组织和团结协定为原型。这只猪狗以为亚洲人民太愚蠢，不能掌握太空飞行吗？但更糟糕的是，这部电影的反派角色、那个种族灭绝、无耻、凶残的达斯·维达，明显是对我们的天皇和武装部队的嘲讽。他穿着模仿铜甲的黑色盔甲，使用一刀流格斗。这个\"维达\"甚至强迫他的下属切腹！这部电影不过是一次咄咄逼人、无知的企图，旨在侮辱和贬低泛亚项目。我已经要求几名剑兵队特工对可能涉及中央情报局的参与进行调查。\n\n首相，我们不能容许这种侮辱无人回应。为了日本民族精神的尊严，我们请求您立即采取行动，对付这种肮脏之物。\n\n代表吉田湊"
 star_wars.2.a: "咋回事？"
 star_wars.3.t: "亲爱的兄弟姐妹"
 star_wars.3.desc: "官方公报：大日本帝国外交部\n\n事项：媒体纯洁度，OFN病毒攻击\n\n鉴于保卫邻国免受帝国主义侵略是大日本帝国的责任，并接受反对泛亚文化生活中的反泛亚情绪的责任；\n\n鉴于媒体，包括电影、小说、戏剧、音乐和其他艺术形式，可以成为支持或攻击自由、和谐和团结理念的政治渠道；\n\n进一步注意到，帝国主义渗透将破坏泛亚意识以达到奴役的目的；\n\n外交部陈述如下：\n\n  1、美国制作的电影《星球大战》最近在国际范围上映；\n  2、《星球大战》包含亲帝国主义和反日本、进而反泛亚的情绪；\n  3、宪兵队特工怀疑中央情报局参与了该电影的制作；\n  4、外交部恳请各位百姓们履行以下职责：\n  5、电影院和私人住宅完全禁止播放《星球大战》；\n  6、毁灭境内所有胶片拷贝；\n  7、禁止在报纸、广播和电视上讨论该电影；\n  8、公开推广亚洲制作的电影，特别是日本和自由印度艺术家制作的电影；\n  9、允许宪兵队全面进入贵国，以监测您在实现这些目标方面的成功。\n\n--公报结束--"
 star_wars.3.a: "也许我们不应该讨价还价。"
 star_wars.4.t: "令人印象深刻"
 star_wars.4.desc: "“我喜欢这个部分！都给我闭嘴！”主管瓦格纳大喊道。几十名半醉不醒的陆军军官将注意力从平淡的啤酒转移到了慕尼黑一个闪烁的电影屏幕上。\n\n“迷人至极，”大提督塔金在屏幕上说道。“你不知道我有多难，签署终结你的生命的命令。”他粗鲁地抓住了参议员莉娅·阿米达拉红润的脸颊，弄脏了她的妆容。\n\n“我很惊讶你有勇气亲自承担这个责任，”她回答道，明显因那位老人的触碰而退缩。\n\n“阿米达拉参议员，在你被处决之前，”他说，“我想请你成为我的贵宾，参加一场将使这个奇迹般的战斗站点运转起来的仪式。现在没有任何星系敢违抗元首！”陆军军官们欢呼起来，灰色制服的塔金趋步向参议员阿米达拉。\n\n“你越紧握权力，大提督，就会有越多的系统从你的手中溜走，”她反驳道。\n\n“在我们展示这个站点的力量之后就不会了，”塔金一脸傲然地说。“你已经决定了我们首先摧毁的系统。由于你不愿透露泛银河叛乱的基地位置，我们将在你的家园行星奥德兰测试这个武器的威力。”\n\n“不！”她尖叫道。“奥德兰是和平的，我们没有武器，你不能这样做！”\n\n“你宁愿选择另一个目标？”他喊道，“那就说出来，是哪个星系！”\n\n莉娅参议员痛苦地凝视着奥德兰大气层的湛蓝。最终，她回答道。“丹图因，”她低声说道，心灰意冷。“他们在丹图因。”\n\n“看吧！”塔金喊道。“你看，维德，她也可以理智。索尔海军上校，继续行动。准备就绪时可以开火。”\n\n瓦格纳上尉兴奋地看着这个堕落的女人泪流满面。首先，他们在莱希人员的合影中，看到了那个将摧毁这些亚人和平主义者的巨大激光准备就绪。然后，那可怕的点火命令下达。最后，武器发射，摧毁了阿尔德朗这个软弱星球，并扼杀了其衰弱的文化。\n\n当纳粹们为阿尔德朗的灭绝欢呼时，瓦格纳流下了一滴泪。他永远不会像大提督塔金那样清除整个堕落体系。但或许他的孩子们会。"
 star_wars.4.a: "现在撤离？在我们胜利的时刻？"
 star_wars.5.t: "为了安全的社会"
 star_wars.5.desc: "雾蒙蒙的、被雨水淋湿的不列颠岛上，成千上万的手指按动着电视机上的开关。屏幕亮起，他们舒适地坐在扶手椅和沙发上，新闻开始了。\n\n“BBC 2频道接下来的节目是：《格鲁吉亚人》”，一个没有面容的解说员说道。背景中，一个发光的地球在旋转；全球的陆地都以荧光蓝色突出显示，英国周围有一道白色的光辉。“这里是BBC 1频道”，声音报道道。地球的后面，出现了“BBC NEWS”几个字飞向观众，仍然笼罩在那种超凡脱俗的、真菌般的蓝色光芒中。\n\n一个新的、仍然不知名的声音开始说话。“我们的第一个话题是，针对新电影《星球大战》的抗议。这部由美国制作的电影在伦敦、伯明翰和曼彻斯特只有有限的放映机会。”屏幕上闪现出数百名英国人站在街头的静态画面。“观众人数创下纪录，大量观众涌入电影院，但一些人对他们所称的‘不道德内容’表示担忧。现在请听BBC 1的蒂姆·爱德华兹（Tim Edwards）给我们带来一线报道。”\n\n“我觉得这纯粹就是恶俗，”南希·戴维斯握着递过来的麦克风说道。“这所谓的‘泛银河叛军’显然从HMMLR恐怖组织那里汲取了灵感。这是我们希望我们的孩子观看的内容吗？宣扬暴力革命和游击战争的垃圾？我想英国已经经历了足够多了。”\n\n“您的团体为何在里根特街电影院外抗议，女士？”爱德华兹问道。\n\n\"首先，我觉得这些人应该感到羞愧，\"她说道。\"美国人在抢劫我们整个国家，在雨中让我们排队数小时去观看一些在沙漠中拍摄的陈腐垃圾。但更重要的是，我希望父母和年轻人能思考这部电影传递的信息。我在内战中失去了朋友，而且是好人。我们必须小心翼翼地远离向我们所爱的人传播恐怖主义信息的影响。\"\n\n画面从采访中切换到BBC 1工作室。一位身穿棕色和银色条纹领带的中年男子直接朝摄像机讲话。“那是南希·戴维斯，关心母亲资源中心的负责人。随着全国范围内类似的抗议活动不断增加，一些议会成员已经提议在王国内不再允许播放《星球大战》。在我们继续下一条新闻之前，我们想讨论一下您的孩子或亲人可能已经接触或被灌输激进观点的迹象。”"
 star_wars.5.a: "首先，相信中央政府是不必要的和压迫性的......"
 star_wars.6.t: "我们正在执行一项外交任务！"
 star_wars.6.desc: "乔治·卢卡斯坐在伦敦一家拥挤的剧院的后排，手里拿着一袋空空的爆米花。英国的零食真是小得可怜，他甚至在“千年隼号”离开莫斯艾斯利前就吃完了那些油腻的垃圾食品。但是他颤抖的双腿无法承受他走到垃圾桶的距离。今晚是《星球大战》在英国的首次展映，真正的首次。当然，他的作品在美国取得了成功。天哪，这个词根本无法形容。它是他不曾预料到、不曾配得上的艺术胜利。但是，想到他多年来辛苦创作的电影竟然能在国际上取得成功？这实在是太难以置信了。\n\n在巨大的电影屏幕上，一曲庆祝乐声响起。汉·索洛、卢克·斯塔基勒和外星人丘巴卡在红地毯上大步走着，周围是欢呼的义军士兵，他们将接受雅文勋章。乔治微笑着，他真的曾经是噩梦般地将音乐拼凑在一起，精心安置摄像机，寻找合适的演员。更别提那些护照的麻烦了！他们几乎在那个时候就差点失去了阿利·基尼斯。幸好二十世纪影业有个后门，否则整个制作就会一蹶不振。\n\n但是现在是最糟糕的时刻。字幕开始滚动，观众们站了起来。他们会讨厌这部电影吗？乔治知道英国人比美国人更加保守。他们可能会一言不发地离开，回家对家人们讲述他给他们展示的那些可怜的垃圾。太过幼稚了。太过梦幻了。太过奇怪、太过不同、太过愚蠢、太过......一切。他能在没有被任何人注意到的情况下走到出口吗？\n\n“对不起，女士们先生们，”一个工作人员从后面大喊道。乔治愣住了。“感谢您今晚加入我们观看《星球大战》的活动！我们有一个特别的嘉宾——导演卢卡斯先生。卢卡斯先生，请您站起来，让我们的客人们看到您。”\n\n乔治颤巍巍地站了起来。他开始冒汗，微笑虚弱地对等待的人群。但是，他们一个接一个地站起来，开始像飓风一样热烈鼓掌。"
 star_wars.6.a: "我们从没怀疑过你。电影太棒了！"
 star_wars.7.t: "和平是谎言"
 star_wars.7.desc: "“主席先生，请见见来自阿拉斯加的参议员泰德·史蒂文斯。”背景中，十几名记者把摄影机和麦克风对准了这位显然愤怒的立法者。\n\n史蒂文斯凑近麦克风，强作笑容说道：“谢谢，亚当斯主席。也感谢所有出席听证会的代表和公民们花费时间参加此次会议。”他整理了一下笔记，然后开始讲话。\n\n“国家安全和文化通常不是我们预期会相交的议题，”他说道。“然而，我们有幸生活在一个重视言论自由和讨论政治重要问题权利的自由社会。难怪艺术家们选择直接关注当今时事中的问题，贯穿于这场冷战之中。”史蒂文斯用衬衫袖子擦拭了一下眼镜，然后继续说道。\n\n“爱国的美国人，那些理解我们有幸生活在宪法和开国元勋们所守护的国家的美国人，以影视作品和书籍来赞美我们伟大的国家。还有其他人试图描绘日本鬼子正在肆虐我们在中国和东南亚的朋友们。就在前几天，我有机会去玩具反斗城给我儿子沃尔特买了几个冒险小队的动作人偶。但是，”他抬起颤抖的手指说道，“我们的一些邻居们并不理解美国在阻止法西斯主义蔓延中所扮演的角色。”\n\n“这部备受瞩目的新电影《星球大战》是对我们在全球推广民主与自由所做努力的一种自私、精英主义渗透的典型例证。我们都知道，这部影片展示了腐败、暴力的旧共和国与银河帝国之间的冲突。而我们也都知道，共和国象征着美国，而帝国则象征着纳粹。我并不反对批评美国。正如RFK所说，我们还有很多成长的空间。但是，我对这种两面派的垃圾论调表示不满。纳粹主义作为一种政治运动，是人类历史上我们从未面对过的邪恶。我从英国和非洲前线的老兵那里听到的故事，以及中情局向我通报的信息，足以让最坚强的人感到恶心。你不知道这些法西斯混蛋犯下了什么样的暴行。”\n\n他站起身来，像一头即将扑向麦克风的狮子一样高大威猛。“因此，卢卡斯先生，我有话要说。你是个懦夫。美国并不完美，但在我们消灭法西斯主义、确保全世界人民免受种族灭绝和奴役之前，我们不能有一丝懈怠。你那可悲的企图把我们这个不完美但民主、宪政秩序与民族社会主义独裁相提并论，令我感到恶心，每个美国人都应该为此感到恶心，整个该死的国家都应该为此感到恶心。”"
 star_wars.7.a: "我就说这么多了"
 star_wars.8.t: "新希望"
 star_wars.8.desc: "几周前，名为《星球大战》的电影在俄罗斯各地的影院上映。由于全国范围内对影院的兴趣和接触方式不足，这部电影最初的表现相对较差。尽管在旧苏联时期有不少与电影相关的艺术家，但俄罗斯社会在重启电影业方面缺乏认真努力，因为经济的其他方面需要资源和投资。俄罗斯所拥有的影院很少，而且这些影院仅在最近几年才在主要城市建成。\n\n但是，近来发生了戏剧性的变化，许多初次观众鼓励其他人去观看，使票房出现了逆转。如今在莫斯科、萨马拉、伊尔库茨克等城市，每个影院都排起了极长的队伍。尽管最初该片被认为在俄罗斯市场惨败，但这部电影已成为俄罗斯市场上票房最高的电影，并达到了类似崇拜的地位。对该电影的大部分赞誉来自迅速增长的年轻人口，他们爱上了这部现代经典之作。\n\n许多人想知道为什么这部电影如此深深触动了整个国家。许多人指出电影中对抗邪恶的主题，这是俄罗斯人民非常熟悉的斗争，还有一些人指出革命性的技术效果；有些人简单地认为这只是对的电影出现在了对的地方。无论《星球大战》之所以能够俘获数百万人的心灵并在国家中引发热潮的原因如何，许多人已经开始呼吁发展现代文化艺术，让俄罗斯建立起可以与意大利、美国或日本相媲美的电影产业。一些传言甚至暗示，有人有兴趣说服乔治·卢卡斯在俄罗斯拍摄下一部电影的部分场景，以展示该国已经取得了多大的进步。"
 star_wars.8.a: "也许正义会战胜邪恶？"


 WORLD.114500.t: "[Get_newspaper_header]1976年因斯布鲁克冬奥会！"
 WORLD.114500.desc: "1976年2月4日，因斯布鲁克以独特的“双圣火”仪式，揭开了第十二届冬季奥运会的序幕。这是奥运史上首次因原主办城市丹佛中途弃权而临危受命的“救场”盛会。开幕式上，两座圣火台同时点燃：一座沿用1964年的旧塔，另一座为新建，象征奥运精神的延续与重生。\n\n本届赛事吸引了37个国家和地区的1123名运动员，新增冰上舞蹈、男子1000米速滑项目，并调整了女子越野滑雪接力赛赛制。德国滑雪名将罗西·米特迈尔在高山滑雪速降和回转项目中斩获双金，距包揽三金仅差0.12秒；选手弗朗茨·克拉莫以惊险的“失控式”滑行逆转摘得男子速降冠军，引爆主场观众欢呼。[RUS.GetName]队则延续冰上统治力：伊琳娜·罗德尼娜与搭档卫冕花样滑冰双人滑冠军，冰上舞蹈组合柳德米拉·帕霍莫娃/亚历山大·戈尔什科夫首秀夺金，冰球队更实现冬奥四连冠壮举。\n\n奖牌榜上，[RUS.GetName]以13金6银8铜遥遥领先，东道主德国凭借雪橇项目包揽全部5金的创纪录表现位列次席，美国排名第三。"
 WORLD.114500.a: "奥林匹克精神在逆境中闪耀的永恒见证."
 WORLD.114501.t: "[Get_newspaper_header]《帝国坟场终停火》"
 WORLD.114501.desc: "1985年10月4日 · 阿姆斯特丹国际新闻署\n“十年交战，十万死者，最终只换得一句话：‘战争结束了。’”\n今天，在喀布尔，日耳曼尼亚、东京、华盛顿、莫斯科与德里的同时广播中，四方默契地发出一则声明——战争态势将在中亚战区全面结束。\n没有人欢呼。没有仪式。四个超级大国在长达十年、近乎失控的代理人战争中都已经深陷内外创伤的焦土，如今没有哪一方还能喊出胜利。\n喀布尔的街头静得出奇。\n电线仍在飘荡，石块尚未清理，广场上的破洞还写着昨日的数字——78。那是昨天死于德制集束炸弹的平民人数。\n“战争未死，只是闭上了眼。”\n从1976年塔吉克斯坦越界开战至今，阿富汗成为一场新式战争的试验场。俄联邦支持的反喀布尔政权与地方游击队，在重山与雪原中苦苦支撑。\n而美日德三国则像外科医生与屠夫同时登场，一边在地图上切割影响力，一边向反政府武装倾泻军火、金钱与“战术顾问”。\n无人敢插手太深。四方都明白，一旦战争激化时间归零，就是核子决战的倒计时。\n因此，一切都被量化、协调、计算。冲突像工厂流水线一样维持在某个“可控”的烈度。\n阿富汗不再是国家，而是一个公式：延迟的战争，分期的死亡，程序化的仇恨。\n“战争没有结束，因为它从未开始。”\n阿富汗的人民不再等待任何东西。他们已学会在废墟中播种、在无人机影下祈祷。\n他们听不懂“冻结战争”这个词，但他们知道：今天没有爆炸，孩子可以走出家门。\n可明天呢？\n沙尘还在吹。边境的武器库还未封存。\n俄联邦的某个顾问正悄悄烧毁一份化武使用授权信；德意志空军的最后一批无人机尚在阿姆利茨情报网的调度下“例行巡逻”；日本特高课甚至还没撤出赫拉特的地下据点。\n一切都只是表面平静。帝国坟场没有投降，它只是暂时闭眼。\n“人类最大的荒谬不是战争，而是它居然能被暂停。”"
 WORLD.114501.a: "——《纽约时报》匿名社论"

 SWRW_AFG.103.t: "[Get_newspaper_header]《帝国坟场不再》"
 SWRW_AFG.103.desc: "1985年12月17日 | 华盛顿邮报喀布尔社电\n“俄罗斯的旗帜飘扬在梅旺德纪念碑顶，而世界，也再一次沉寂。”\n在长达近十年的代理人战争后，阿富汗的命运被改写了。\n塔吉克斯坦收复了山地巴达赫尚；哈巴提政府于12月1日正式宣布‘接纳俄罗斯联邦的战后托管建议’；\n三天后，第一批俄军坦克驶入坎大哈，而最后一位美方军事顾问在帕克提卡州的山道上被不明身份枪手击毙。\n胜负已分。帝国坟场，不再是了。\n“从未如此光明……又如此冰冷。”\n俄罗斯宣布对整个阿富汗境内的“关键基础设施与战略资源”实施联合军事管理，由“稳定事务署第七局”执行直接行政。\n喀布尔电视塔下高悬起俄联邦三色旗；赫拉特的报纸改版使用俄语头版；\n而阿富汗国民军正在经历“结构性整编”——约三分之一的将领被调往莫斯科“培训”。\n俄联邦官方称这是“重建秩序的一步”，而反对者私下称其为“新殖民秩序”。\n老街巷的耳语又回来了。“就像六十年前的英国人一样。”\n________________________________________\n“前进中的军队，倒退中的民族”\n坎大哈，一支整编自远东的俄军机械化旅正在街道上巡逻。孩子们望着坦克咧嘴傻笑，老人默默关门。\n“他们来了，不像敌人，更像主人。”一位教师低声说道。\n在遥远的北部，塔吉克斯坦的部队正忙着在“新边境线”上埋设地雷，而他们口中的“新边境”，正是1911年俄罗斯帝国测绘地图上的线。\n哈巴提政权被保留，却早已失去任何实权。总统府的办公楼与俄军总顾问团共用走廊。\n每天早晨八点整，俄制扬声器会播放《祖国进行曲》作为喀布尔城区的起床铃声。没有人敢说什么。不是不敢反抗，是不敢相信这一切是真的。\n________________________________________\n“压不住的怒火”\n但这不是和平。不是。\n帕克蒂亚山谷的游击队仍在活动；\n喀布尔大学的三名政治学学生因“密谋策动非法出版物”被逮捕；\n南部边境的一个火车站在深夜被炸毁，留下喷漆字样：“你们来得越多，我们埋得越深。”\n地下的抵抗正在重新集合——不是为了哈巴提，不是为了美国或日本——而是为了“驱逐一切主子”。\n而克格勃也开始察觉，他们“赢得太快”，以至于没有给当地留下过渡的空间。\n一个高阶安全顾问甚至私下承认：“这不是胜利，这是植入一个爆炸定时器，只是它没响罢了。”\n________________________________________\n“历史不会重复，但它会押韵。六十年前是乔治五世，如今是新俄罗斯。”\n——《纽约时报》社论"
 SWRW_AFG.103.a: "阿富汗的夜晚静悄悄。"

 SWRW_AFG.101.t: "[Get_newspaper_header]帝国坟场的诅咒"
 SWRW_AFG.101.desc: "当阿富汗牧民用缴获的俄国坦克的履带锻造耕犁时，柏林、莫斯科、华盛顿和东京的战争机器仍在为这场持续十年的荒诞剧目结算账单。人们永远不会忘记来自德国记者的这张照片:喀布尔街头飘扬的黑色旗帜下，一个孩子正在用美国最新生产的步兵头盔从河流中打水。这场埋葬四大帝国的战争，最终以最古老的游牧文明的生存法则写下句点。  \n\n1975年俄罗斯重新崛起时绝不会料到，这个用T-72坦克集群碾过维斯瓦河的铁血政权，会在短短三年后灰溜溜的从塔拉斯撤离。日本防卫省解密文件显示，为维持大东亚共荣圈在兴都库什山脉的存在，仅1982年就有价值20多亿美元的精工半导体部件被阿富汗圣战组织改造为路边炸弹触发器。而在纽约证券交易所，洛克希德·马丁公司股票因F-15在帕米尔高原37%的坠毁率，创下自珍珠港事件以来最大单日跌幅。  \n\n战略学家将这场灾难称为"二十世纪殖民幻想的最后抽搐"。德国民间不断议论着："我们在重蹈1842年英国撤出喀布尔的覆辙。"但柏林还是将最新型的黑豹坦克送上了海拔4000米的死亡赛道，这些配备130毫米滑膛炮的钢铁巨兽，最终成了普什图少年练习攀爬的废铁迷宫。莫斯科国际关系学院教授伊万诺娃指出："所有参战国都陷入了历史倒影的诅咒——德国想重现闪电战神话，日本执着于建立‘大东亚防波堤’，俄罗斯沉迷收复故土，美国则试图用科技优势洗刷珍珠港耻辱。"  \n\n这场战争撕开了所有帝国的遮羞布。东京银座的破产店主不会忘记，当他们用祖传武士刀抵债时，首相官邸正把三菱重工为阿富汗定制的新型坦克称作"平成荣光"。在列宁格勒冬宫广场，领取阵亡抚恤金的母亲们发现，政府正在用从纳粹的银行中缴获的金条支付补偿金——这个曾用鲜血浇灭第三帝国的民族，最终竟然要靠敌人的遗产维持战争谎言。  \n\n喀布尔新落成的"战争纪念碑博物馆"门口，有一个巨大的青铜战鼓——那是一个圣战组织成员在与俄国人交战的时候发现的，据传是亚历山大东征时遗留下来的。而在馆内，烧融的GPS模块被与8世纪的阿拉伯银币陈列在同一展柜。策展人阿卜杜勒骄傲地用缴获的ak-47指着卫星照片解释道："四个帝国的无人机能看清牧羊人胡子的长度，却读不懂千年前的山民刻下的水源标记。""
 SWRW_AFG.101.a: "阿富汗的夜晚静悄悄。"