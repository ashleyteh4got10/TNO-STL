 HDV_SAF.1001.d: "给我进步主义"
 HDV_CountryClosing_epilogue_SAF_ANC_OFN_Ending: "南非取得了胜利，不仅管束住了布尔人，还将德国人击退。从开普到克利马内再到温得和克，如今南非掌控的疆域之广袤，远超昔日所能想象。但随着和平归来，所有人都明白这仅是昙花一现。因过度扩张而统治辽阔疆土的开普政府，如今管辖着众多族群混居的广袤区域，这些族群无不渴求自由，拒绝成为彩虹之国的一部分。\n\n就连赫拉夫也深知这种局面难以为继，统一党的执政时代即将落幕——多数统治必然意味着非国大将通过和平方式掌权，试图处理这片辽阔新领土的非殖民化进程。于是这场旨在实现非殖民化而不引发动荡暴力的宏大博弈就此展开。这个国家再经不起另一场冲突，因此必须经历如履薄冰的非殖民化时期。若不能像拆解纸牌屋般逐块妥善处置，整个体系恐将再度崩塌。"
 HDV_CountryClosing_epilogue_SAF_ANC_Pakt_Ending: "南非幸存了下来，虽支离破碎、疆域缩减，却依然存续。在巍然屹立的非洲之盾庇护下，布尔人脱离南非将自己与德国人捆绑在一起。但开普敦仍屹立不倒，任何摧毁南非的企图都已被驳斥并粉碎。和平重返这片土地，崭新的一天正在降临——这个国家正朝着全民机会均等与多数统治的方向迈进。\n\n统一党将在即将到来的大选中败给非国大，但这似乎将为彩虹之国开启新的机遇，从长远来看有助于带来更稳定的局面。"
 HDV_CountryClosing_epilogue_SAF_ANC_Tie_Ending: "南非依然屹立不倒。那些不仅企图分裂它、更妄图征服它的人已经失败，他们的阴谋彻底破产。尽管表面上南非保持了统一，但构成这个国家的民众之间的裂痕依然悬而未解。通过武力手段，布尔人虽在冲突中遭受重创被迫就范，但削弱并不等于终结——布尔人必将如往常般伺机重新掌控南非。\n\n然而迈向公平平等多数统治的转型已经启动，选举日期日益临近。虽然统一党因即将丧失权力而深感不安，但这种变革能为长期分裂的国家带来更持久稳定的压倒性共识，正推动着进程继续向前。"
 HDV_CountryClosing_epilogue_SAF_Racism_OFN_Ending: "南非取得了胜利，不仅管束住了布尔人，还将德国人击退。从开普到克利马内再到温得和克，如今南非掌控的疆域之广袤，远超昔日所能想象。但随着和平归来，所有人都明白这仅是昙花一现。因过度扩张而统治辽阔疆土的开普政府，如今管辖着众多族群混居的广袤区域，这些族群无不渴求自由，拒绝成为彩虹之国的一部分。\n\n就连赫拉夫也深知这种局面难以为继，统一党的执政时代即将落幕——多数统治必然意味着非国大将通过和平方式掌权，试图处理这片辽阔新领土的非殖民化进程。于是这场旨在实现非殖民化而不引发动荡暴力的宏大博弈就此展开。这个国家再经不起另一场冲突，因此必须经历如履薄冰的非殖民化时期。若不能像拆解纸牌屋般逐块妥善处置，整个体系恐将再度崩塌。"
 HDV_CountryClosing_epilogue_SAF_Racism_Pakt_Ending: "南非幸存了下来，支离破碎，疆域萎缩，却依然存续。在巍然屹立的盾牌军团庇护下，布尔人已撕裂自身与南非的联系，转而将自己拴在德国战车上。但开普敦依然屹立不倒，任何摧毁南非的企图都已被驳斥与粉碎。尽管和平重现，国民仍在哀悼那曾对真正平等国度怀有的光明希望——这份希望早在1960年代就被压制得湮没无闻。残存的国家机器持续扼杀任何变革思潮，让少数英裔与有色人种群体受益的同时，以前所未有的暴力镇压异见。然而随着南非成为OFN正式成员，来自内外的双重压力正不断累积，迫使统一党最终迈向平等与多数统治——但这样的统治在南非的地平线上仍不见踪影。因此，当德·维利尔斯·赫拉夫坐在破败的办公室里，只有一个问题在他脑海中反复回响：究竟有什么真正改变了呢，总理阁下？"
 HDV_CountryClosing_epilogue_SAF_Racism_Tie_Ending: "南非依然屹立。那些不仅企图分裂它、更妄图征服它的人已经失败，他们的阴谋彻底破产。尽管字面上南非保持了统一，但构成这个国家的人民之间的裂痕仍未消弭。通过武力手段，布尔人和非国大虽在冲突中严重削弱，却仍被强行约束。但削弱并不意味着终结，双方都试图重新掌控南非，权力的游戏一如往昔般持续上演。\n\n然而统一党正处在分裂边缘，而美国的压力必将随时间推移加剧，以推动向多数统治的转型。但德·维利尔斯·赫拉夫恰恰以灵活善变著称，他早已开始盘算如何在新时代中巩固自己的权力。"
 SAF_bittereinders: "死硬到底者"
 SAF_Piet_Koornhof_for_vc_desc: "§Y外交部长\n无支配体制§!\n--------------\n新执政联盟中最小的成员，和平阿非利卡人党，是那些忠于南非的阿非利卡人残余。命运弄人，这位阿非利卡人发现，自己一个温和派，却身处一帮盎格鲁强硬派的内阁之中，而这帮人似乎只执着于一件事，那就是维持现状，创造一个由英国绅士领导的、永远冻结在时间里的国家。\n\n虽然库恩霍夫如今成为了这个新保守派联盟的正式成员，但他影响力依然有限，主要致力于加强南非与OFN及中立国家之间的外部联系，这些国家为贸易和投资提供了宝贵机会，与此同时，他也试图消除外界对这个分裂的国家如何对待黑人多数派的任何顾虑。"
 POLITICS_VAUSE_RAW_DESC: "南非屹立不倒，站在权力巅峰的是那位可敬的绅士沃斯·罗，他是南非英裔精英最激烈的捍卫者。现状将得以维持，在英国人开明的领导下，南非将永世长存，保持原样。\n\n一个分裂、种族隔离的国家，盎格鲁人凌驾于阿非利卡人、黑人和有色人种之上，所有人都在一场永恒的分而治之的游戏中相互对抗，正如大英帝国昔日所为。那些进步的、意志薄弱的、愚蠢的自由派遭受了决定性打击，他们那套令人震惊的绥靖姑息，以及对非洲无政府主义者泛滥的纵容，都将被修正和废除。\n\n英国绅士阶层的铁腕曾统治世界，它或许还能再来一次。罗和他的盟友承诺回到稳定和秩序的昔日好时光，力图永久加强国内安全体系，并进一步限制占多数的黑人的那少数权利。就连那些因祖先罪孽而玷污的有色人种公民也无法幸免，开普的绅士阶级正准备剥夺有色人种少数派的权利，将他们扔进他们本应归属的黑人下层阶级中去。\n\n南非的故事业已讲完，此后无论发生什么，都将交由时间的迷雾去决定。"
 POLITICS_JACOBUS_STRAUSS_DESC: "雅各布斯·吉迪恩·内尔·施特劳斯一直为领导权做好了准备。从小他就崇拜扬·史末资总理，并与史末资家族关系密切，几乎被视为其养子。在那位南非最伟大政治家的指导下，他成为了农业部长，是史末资内阁中最受信任的成员之一，直至1950年。历经几任不太受欢迎的党魁后，1956年该党进行了一场决定性投票，施特劳斯仅仅以极微弱的劣势输给了德·维利尔斯·赫拉夫。\n\n自那以后，他便等待时机，不断盘算筹划，以谋取权力宝座。在统一党一场强劲但非决定性的决策之后，德·维利尔斯·赫拉夫终于觉得，让出统一党的领导权是合适的，很快，施特劳斯便毫无悬念地接任了这一职位，长达十年的筹备总算有了回报。\n\n虽然与从统一党分裂出去的保守派组建联盟并非易事，但在某种程度上，随着新成立的执政联盟（目的是阻止国民党掌权），情况大体恢复如前，只是统一党因几位主要进步派人物在议会选举中落败而略微向右倾斜。虽然沃斯·罗如今再次成为政坛主要角力者，但真正站在跳羚之国权力顶峰的，是雅各布斯·施特劳斯。而现在，经历了这一切之后，他已是统一党无可争议的领袖，南非联邦总理，并正走在成为扬·史末资当之无愧的继承人的道路上。\n\n南非的故事业已讲完，此后无论发生什么，都将交由时间的迷雾去决定。"
 POLITICS_VILLIERS_GRAAFF_DESC_4: "当他首次当选领导统一党时，人们怀疑迪夫。每次新选举临近，或他自己党内的两个派系发生冲突时，人们怀疑迪夫。当南非遭遇最严重的生存危机，一场内战演变为外来征服战争时，人们怀疑迪夫。最后，当举行新选举，来自右翼和左翼的新挑战比以往任何时候都更强大时，人们怀疑迪夫。\n\n而现在，再没有怀疑者了。在南非国内外，再没有任何人会对第二代从男爵德·维利尔斯·赫拉夫爵士在南非握有不容置疑的权力有丝毫怀疑。如今他可以自由地再统治五年，任何以为南非将吹起新风的人都错了。永远立于中间，迪夫找到了完美的权力平衡，再没有人敢再将他从这位置上推下去。只要他愿意，他就将继续领导他的政党和国家，为那些被选中接受国家不断增长的财富之福荫的人们，走向更光明的未来。永远，橙白蓝三色旗将在好望角上空飘扬，只要他愿意，德·维利尔斯·赫拉夫就将一直领导他的国家前进。\n\n南非的故事业已讲完，此后无论发生什么，都将交由时间的迷雾去决定。"
 POLITICS_COLIN_EGLIN_DESC: "一股新的风吹拂着好望角，一位新总理将开启建设新南非的艰难进程。在进步党崛起为南非第二大政党，以及保守派被边缘化之后，德·维利尔斯·赫拉夫终于认清了现实，宣布退休，留下国防部长科林·埃格林接替成为南非的新一任总理。\n\n在第二次世界大战中为自由而战，战后在统一党内冉冉升迁，在南非战争期间担任国防部长，科林·埃格林是一位久经战争与政治考验的老兵，然而他仍全心全意倡导一个更进步的南非，不断朝着人人平等的方向前进。不过，如果有人以为激进的改革即将到来，那他就错了，因为埃格林的政党和其多数派仍然依赖于温和进步派和其残余的保守派。但前进的道路已经敞开，埃格林总理已做好准备。\n\n南非的故事业已讲完，此后无论发生什么，都将交由时间的迷雾去决定。"
 SAF_Ray_Swart_eco_desc: "§Y经济部长\n进步自由主义§!\n--------------\n经济与基础设施部长的职位是个争议点，然而它并未真正威胁到科林·埃格林与哈里·施瓦茨之间友好的协商。最终，进步党获准填补这一职位，由该党长期忠诚的成员雷·斯沃特担任。\n\n斯沃特是一位进步派律师，他对那些在国内拥有巨大影响力的大型公司有些警惕，尽管这些公司如今已倒向进步派。现在，他可以着手进行改革，以应对国内巨大的经济不平等。但用几十年时间建立起来的体系，要再次拆除它也需要时间，且面对根深蒂固的反对派，至少目前而言，斯沃特可施展的机会仍然少得惊人。"
 POLITICS_HARRY_SCHWARZ_DESC: "勤奋工作、命运安排，再加一点点运气，能使人走多远。哈里·施瓦茨在婴儿时期来到非洲，他的犹太父母在阿道夫·希特勒上台前夕决定离开故土。从小只说德语长大的他，在青少年时期备受孤立，这段记忆伴随了他一生。\n\n他的父母艰难挣扎，勉强让他摆脱贫困。靠着政府助学金求学，他与他的同学纳尔逊·曼德拉一起度过了许多时光，后来还参与了为曼德拉针对其恐怖主义指控进行的辩护（尽管徒劳无功）。他一直是个进步之声，统一党的犹豫不决和对阿非利卡人的绥靖，促使他于1948年创立了进步党，该党长期以来在该国政坛只是一支边缘力量，直到现在。在赢得一场令人震惊的胜利，并成为议会第一大党后，哈里·施瓦茨得以与统一党组阁，将保守派和阿非利卡人都孤立为反对党。尽管他的对手会对他咆哮怒骂，但施瓦茨现在终于有了一条敞开的道路，去实现他毕生梦想的、那个公平平等的南非。\n\n南非的故事业已讲完，此后无论发生什么，都将交由时间的迷雾去决定。"
 SAF_the_cape_corps_2_desc: ""
 SAF.173.t2: "来自南非，勿言爱。"
 SAF.173.desc2: "致：陆军元帅，汉斯·斯派达尔\n\n来自：外交部长，雅各布斯·施特劳斯。\n\n尽管我们两国在政策和意识形态上存在巨大差异，但仍存在和平共处的有效途径。然而，任何上述和平的可能，都已被贵国非洲专员辖区发动的突然入侵所粉碎，即对南非的入侵，现已查明，这次入侵是有计划地支持非法的牛车哨兵政变企图以及对南非合法政府的暴力起义。这些行径绝不容忍。\n\n鉴于与上述帝国专员辖区爆发敌对行动，南非国别无选择，唯有承认我们两国间存在战争状态。然而，南非明确指出，目前仅南非与德国的非洲专员辖区之间存在战争状态。此外，南非承认，在当前时刻不存在任何和平希望。\n\n鉴于以上信息，南非政府将终止与德国势力范围内所有国家的正常贸易关系，并无条件没收德国在南非的一切资产。只有在德国停止对帝国专员辖区的支持，并启动从南非全面撤军的情况下，上述资产才会予以归还。我们希望您，以及正在进行的德国内战中不论哪一方获胜，都能看清事理，展开和平谈判，并将贵国的帝国专员们重新置于掌控之下。"
 SAF.173.a2: "签名，雅各布斯·施特劳斯"
 SAF.184.t: "缩减预算"
 SAF.184.desc: "在比勒陀利亚那个会议室里，空气中弥漫着旧纸张和更旧怨怼的气味。财政偿付能力委员会已经对着这个无底洞般的问题瞪了好几个小时。桌上的报告是一份只有黑白两色、却明白无误的死刑判决书：若不进行大刀阔斧的削减，这个国家就走向破产。\n\n“农业委员会是个过时的累赘，”霍索恩先生用他干脆利落的英国口音打破了沉默。他代表工业界，是个信奉市场的人。“我们必须削减这些低效的补贴。”来自兄弟会的严苛经济学家范德默韦博士几乎不让他把话说完。“农民是民族的基石，”他立刻反击，声音里充满愤慨。“你为了取悦外国资本，就要牺牲我们的人民。节约的开支就在那臃肿的英国进口部门里。”\n\n战线已然划清。主席是一位名叫杜普莱西的疲惫公务员，他试图提出第三条路，提及了班图行政预算。“动不得，”两人异口同声地说。辩论沦为了一场对国家痼疾应由谁负责的审判，不断升级，直到范德默韦提到来自英语媒体的“财政破坏”。\n\n霍索恩愤怒地从椅子上弹了起来。杜普莱西重重敲下木槌，那尖锐的撞击声在紧张的寂静中回响。“本次委员会休会，”他宣布道。专家们如同宿敌般鱼贯而出。数字问题是可以解决的；而房间里的分裂却无解。"
 SAF.184.a: "这个联邦毫无团结可言。"
 SAF.185.t: "一刻的团结"
 SAF.185.desc: "比勒陀利亚俱乐部那间隐秘的包房，是个与外界动荡隔绝的避风港。空气中弥漫着昂贵白兰地和雪茄烟雾的浓郁气息，数月来头一次感觉如此安宁。这四位统一党最有权势的人，刚从一场几乎将他们联盟推向崩溃边缘的艰苦公投竞选中脱身，此刻并未争吵。他们赢了。扬·霍夫迈尔，那位以沉静威严凝聚众人的政坛元老，举起了酒杯。“为联邦干杯，”他说，声音轻柔但坚定，“也为守护她的人。”\n\n是迪夫接过了话，他脸上露出罕见的、真心实意的满足表情。“感觉我们好像互相掐了一辈子，”他坦承道，旋转着杯中琥珀色的液体。“我们考验了政党忠诚的极限。但就在整个腐烂结构即将倒塌之际，我们守住了阵线。一起。”桌子对面，一贯坚忍的沃斯·罗坚定而肯定地点了点头。“人民已经发声，”他说，声音低沉而沙哑。“此事就此了结。真正的治国工作终于可以开始了。”\n\n在他身旁，多年来一直对罗公开持怀疑态度的科林·埃尔金，却露出了一丝微小但真诚的微笑。“就这一次，沃斯，”埃尔金让步道，举起酒杯微微致敬，“我想你是对的。”这是两人最接近友谊的一刻，一种源于共同胜利的休战。迪夫向后靠去，肩头巨大的压力终于卸了下来。现在看来，那些激烈的内斗显得那么微不足道；对未来的恐惧，也显得遥远。他们曾面对深渊，而后退了一步，国家完好无损。在那寂静的房间中，他感到一股真正的希望涌起。最糟糕的日子终于过去了。"
 SAF.185.a: "为了南非！"
 SAF.186.t: "国王已死"
 SAF.186.desc: "迪夫办公室厚重的橡木门紧闭着，但却丝毫未能消减屋内肆虐的风暴。他像一头困兽般在地毯上来回踱步，脸色深红，朝着那个坚忍地站在他办公桌前的男人喷吐着毒液。“沃斯，你哪怕有一秒钟，停下来好好想过这事吗？”迪夫恨恨地说。“还是说，你被你那套多愁善感的幻想蒙蔽了双眼，以至拖着整个党去跳崖？我们成了国际笑柄！华盛顿看到一个分裂的盟友，日耳曼尼亚看到一群像孩子一样争吵的优等民族。他们都看到一个如此分裂的国家，连自己的国家元首都定不下来。”\n\n在此期间，沃斯·罗始终如一尊雕像般一动不动，脸上是一副难以解读的、透着钢铁般坚韧的面具。只有他紧握在背后的双手那发白的指节，泄露出这一刻他正承受的巨大压力。这场公投，他的宏伟计划，已彻底惨败。“而现在，”迪夫用充满鄙夷的声音继续说道，“就因为你追逐这个幻影，我们不得不做出那不可想象之事。我们得亲手将这顶王冠送入棺材。叛徒！弑君者！他们就会这么叫我们，而这全都是你造成的。”\n\n科林·埃尔金默默地看着这一切，脸上维持着一副完美的、专业性的关切表情。他丝毫不关心君主制，但看到那难以动摇的罗因对一个早已不复存在的过去的呼吁而蒙羞，心中只感到一丝冰冷的满足。这对埃尔金所信奉的实用主义来说是一场胜利，他很乐意让迪夫来致这篇悼词。\n\n很快，迪夫滔滔不绝的怒火就燃烧殆尽，取而代之的是一种深深的、精疲力竭的沮丧。咆哮停止了，宽大的办公室里只剩下一片嗡嗡作响的寂静。他终于瘫倒在自己的椅子里，怒气全消。“出去，”他说，声音安静、沉重，充满了挫败感。“你们两个都出去。”"
 SAF.186.a: "共和国万岁？"
 SAF.187.t: "无所畏惧"
 SAF.187.desc: "已经过去多久了？几个月？几年？几十年？大概就那个数吧。但这不重要；真正的问题是，这对他造成了多大的影响。斯特凡大半辈子都住在博茨瓦纳东部那片乡村地区的莫帕内草原上。这里算不上他最喜欢的家，但也足够宁静，能好好迎接他。过去这几年，他和妻子组建了一个小家庭，靠土地和狩猎的野生动物为生，虽说近年来，他已经把这份活儿传给了孩子们。\n\n过去几年里，家中发生的那些大事，差点被这场战争给掩盖。然而，每当远处有炸弹落下，能听到每一声枪响，能看到远方、远方的每一架飞机，这个农耕家庭的生活却没什么变化。当然，战争刚开始时，所有人都吓坏了，尤其是孩子们，但过一阵子也就习惯了，至少斯特凡觉得是这样。\n\n在战争初期，你能看到远处有卡车经过。尽管这些卡车从未挂过卐字旗，但在那些时刻，斯特凡和他的家人也无需低头躲藏，尽管他们有布尔血统。即便如此，一切似乎都陷入停滞。用斯特凡的话说，这就是新常态。习惯了被爆炸声而非公鸡打鸣叫醒，习惯了不仅要教你的孩子们对付动物，还要对付人，只是以防万一。他妻子不喜欢这样。\n\n然而有一天，斯特凡醒来时，感到一种异常平静。他对着镜子打量自己，确认自己没事。那天的太阳似乎也比以往更加明亮，尽管它昨天也遵循着同样的轨迹，明天也会如此。就在那时，他才恍然大悟；他的孩子们朝他跑来，喜极而泣：“战争结束了！”他们喊道。“我们赢了！南非自由了！”\n\n所以答案就在那里。战争带来的所有噪音，远处的爆炸声、枪声、飞机声、导弹呼啸，全都消失了。它们已成了他生命中如此不可或缺的一部分，以至于他忘了，当这些声音不在时，自己是什么感觉。说实话，他绝不会怀念那些日子。"
 SAF.187.a: "那一天，希望与太阳一同升起。"
 SAF.188.t: "踏错一步"
 SAF.188.desc: "过去的几周里，弗兰斯一直在管理东非曾是最大行政区之一的一个省份，即前葡属莫桑比克。官面上，他被派到那里去组织该省，为它全面并入南非做准备。但弗兰斯从一开始就知道，真正的原因是私人的：他在最高指挥部的同僚想让他别碍事。他们把他看作一个威胁，一个有朝一日可能会取代他们的人。\n\n这倒不是说他讨厌这个职位。尽管睡木板房、听从他几乎听不懂其英语的当地人命令令人不适，但他主要心思都放在一件事上：回到他在最高指挥部的岗位，去和那些把他发配到这天涯海角来的家伙算账。\n\n然而有一天，他却有了一场不同的遭遇。他手下的一名当地行政官是个土著，这个人想让弗兰斯亲自走访该省南部的几个乡镇和村庄，就在该地区众多前营地之一的附近。但当他们到达第一个村庄时，一种奇怪的感觉缠绕在弗兰斯的脑海之中；什么都没有，他什么也感觉不到。除了几间茅屋和废弃的卡车，他什么也看不见，但除此之外，空无一人。\n\n“这就是我带你来这儿的原因，先生，”那土著开口了，口音带着浓厚的德国腔。“这些镇子被怀疑参与了非国大游击队的活动，所以当地的党卫军驻军下令逮捕全省的人口，并将他们送去强制劳动。我们还在其他营地试图寻找幸存者，但是……”\n\n弗兰斯没再听下去。他体内涌起一股奇怪的感觉，驱使他走进其中一间茅屋。他找到的唯一东西是一条裙子，似乎属于一个小女孩，上面有弹孔和击打的痕迹。起初没有那小女孩的任何踪迹，直到他在一个半挖的、覆满蚂蚁的沟渠旁踩错了一步。他看看那条沟，又看看那土著，再看看自己。他的双手。他的心。他如何感受，他如何看事情，他从没想过自己会看到这样的事，更不用说由他来向开普敦报告这些。"
 SAF.188.a: "“把我的相机拿来。”"
 SAF.210.t: "德·维利尔斯内阁"
 SAF.210.d: "以南非君主之名，我特此任命以下人员为以君主之名运行的政府内阁成员。\n\n副总理：J.F.H 霍夫迈尔\n国防部长：科林·埃格林\n外交部长：雅各布斯·施特劳斯\n财政部长：沃斯·罗\n农业与林业部长：参议员 H. G. 斯瓦特\n经济发展部长：弗兰克·瓦林\n教育部长：雷·斯瓦特\n内务部长：帕特里克·沃尔\n司法部长：哈里·劳伦斯\n劳工部长：亨利·塔克\n土地与灌溉部长：道格拉斯·米切尔\n矿业部长：参议员 斯廷坎普\n土著事务部长：玛格丽特·巴林杰\n开普有色人种事务部长：阿贝·布隆伯格\n邮电部长：拉德利夫·卡德曼\n公共工程部长：J. D. 奥珀曼\n交通部长：彼得·格雷厄姆·范·比尔\n福利部长：扎克·德比尔\n公共卫生部长：道格拉斯·斯米特\n\n总参谋长：亨德里克·克洛珀\n联邦国防军总司令：查尔斯·弗雷泽\n空军总司令：弗里茨·塞隆\n南非海军总司令：亨德里克·比尔曼"
 SAF.210.a: "£SAF_div_signature"
 HDV_SAF.125.t: "在世人面前受膏"
 HDV_SAF.125.desc: "在圣乔治大教堂肃穆的中殿内，气氛从凯旋转为庄重。外面的街道仍回荡着清晨的欢呼声，但在这石墙之内，只有一片寂静，沉重而神圣。过道里隐蔽安放的摄像机低声嗡嗡作响，将典礼转播给全球数百万观众。摄像机轻柔的嗡鸣声与会众起身时长袍发出的轻微窸窣声交织在一起。\n\n成千上万人注视着身穿厚重传统礼袍的伊丽莎白，被引领至为她涂油而备的古老座椅前。阳光透过彩色玻璃窗洒下，在光洁的大理石地板上投下支离破碎的彩虹。典礼的每一道细节都在复刻威斯敏斯特教堂的仪式，从音乐、祷文到以微颤双手托举的镀金礼器。主教们吟诵着经文，乳香的烟雾盘旋上升至拱顶，与帝国的尘埃混合在一起。大理石地面捕捉着烛光，反射出如同熔金般的光芒。卫兵们在英联邦旗帜下一动不动地肃立，他们的刺刀如重续的无声誓言般闪光。\n\n当王冠触及她的额前，一片绝对的寂静降临，随后管风琴奏响国歌，会众爆发出“天佑女王”的呼声。这声音仿佛撼动了墙石本身，是古老的信仰与现代的挑战相遇。\n\n这不仅是一场加冕。这是一份宣言，英联邦犹存，女王仍在统治，无论柏林颁布什么法令，人民邦如何嘀咕，都不能抹去她的主权。在那一刻，每一枚镜头、每一支麦克风传递的，不仅仅是一幅仪式的画面，而是一个拒绝灭亡的帝国那跳动的心脏，一个在反抗与记忆中重生的国度，它向世界提醒着，忠诚仍有一个王座，还有一个名字。"
 HDV_SAF.125.a: "向全世界广播。"
 HDV_SAF.123.t: "国安局在盯着"
 HDV_SAF.123.desc: "外勤报告：案件 734 - 圣犹达社区中心，第三镇区。\n执行特工：K. 布兰特。\n\n初步监视确认，该目标地点以慈善社区活动中心为幌子运作。公开活动为提供识字课程和教会赞助的日托服务。然而，行为模式分析显示存在与其公开身份不符的重大异常。该中心是大量成年男性的聚集点，这些人与此地公开宣称的活动没有明确关联，其中包括先前在兰德矿区劳工行动中被标记的个人及已知的工会关联人士。他们经常在日落后出入此地，缺乏连贯或合理的解释。\n\n特定活动需更仔细审查。最近一次“为新房顶筹款”活动涉及大量现金收集，但资金在一小时内就被一名非神职人员带走。这种模式是向颠覆分子提供无法追踪的财政支持的典型途径。此外，昨晚举办了一场有多名值得关注的人士参加的“读书会”。在场的文献似乎只作道具之用；真正的焦点是压低声音的紧张讨论，同时有非正式的望风人员在街上监视。\n\n累积证据强烈表明，该中心那些单纯的活动不过是一个精心维护的门面。我高度确信地评估，圣犹达社区中心是被取缔的非洲人国民大会在当地的一个重要节点，用于秘密会议、筹款和传递指令。我将此案标记为升级处理。请求授权进行升级监视，包括放置监听设备，并对潜在线人进行初步审查。"
 HDV_SAF.123.a: "批准请求。务必追查到底。"
 HDV_SAF.124.t: "夜色中的篝火"
 HDV_SAF.124.desc: "在远离文明的荒郊野外，他们坐在星空下，围着一堆熊熊燃烧的篝火坐成一圈。这些人之间的情绪和他们栖身的黑夜一样阴沉；没有人能否认他们曾做过的事，以及这场战争那令人不满的结局。他们所有人都带着战争的伤疤，都曾为胜利而无比振奋，也都曾品尝过在试图抵抗那不可能抵挡的浪潮时，眼看着战友在战场上倒下的锥心之痛。\n\n有个人失去了一只眼睛，骇人的伤口被绷带遮住。他们的制服，如果还有的话，都已破烂不堪，显露出明显的穿用和撕裂痕迹。然而，如果你更仔细观察这些人，你会发现，当飘忽不定的眼神变得坚定起来，他们共同的情绪也从沮丧转为决心。那令人窒息的沉默气氛，先是变为零星的低语，继而转为这些南非战争老兵之间分享的战争故事。\n\n随着夜晚流逝，新的圆木被扔进篝火，这些人内心的火焰也开始燃烧。话题再一次转向未来，以及该如何处置德·维利尔斯·赫拉夫这个种族叛徒犹大，以及他在开普敦的那个充斥着犹太官僚的政府。钉十字架、火刑、绞刑，或者也许干脆就是一枪崩了，丢进最近的沟里。\n\n当第一缕曙光初现时，所有人都在立下承诺、誓言，并歃血为盟。斗争尚未结束；因为在场的每一个男人都同意再次拿起武器，战斗下去，不是在明处，而是在一场针对南非的隐秘战争中。他们将从黑暗中发起打击，直到整个大英帝国的肮脏残余最终因其自身的重负而崩塌。"
 HDV_SAF.124.a: "直至苦尽，终不悔。"
 HDV_SAF.126.t: "关于大非洲国家共同体的报告"
 HDV_SAF.126.desc: "在一场令人震惊的命运转折中，汉斯·胡蒂格在杀害了西南非的沃尔夫冈·申克，并迫使中非的西格弗里德·穆勒乘坐装满财宝和狩猎战利品的飞机逃离其专员辖区后，以武力夺取了德国在非洲所有专员辖区的控制权。从日耳曼尼亚对此事的公开谴责可以推断，这整件事并未获得批准，这使得胡蒂格成为一个控制着大片非洲土地的失控反叛者。\n\n建议任何遣散计划都应放缓速度，并应进一步加强对各类边境管制的支持；因为我们不清楚失控的极端分子胡蒂格究竟意欲何为，或有能力做什么。关于极端暴力和对土著进行大屠杀的报告无处不在，而饱受创伤的难民则谈及制度化的种族灭绝。\n\n这个国家；这个国家共同体，完全孤立无援；面临彻底的孤立、极度的过度扩张，以及一个与占绝大多数的、为生存而战的土著人民交战的极少数德国人群体。这个国家绝不会持久；这是确定无疑的。更重要的是，在它因自身重负而崩塌之前，它究竟能造成多大的破坏。边境地区预计会出现问题，同时会有大批逃离这场大屠杀的难民涌入，因此应为那些逃离这个所谓的国家共同体的人准备充足的安置设施；同时应考虑让这些人投入重建工作。在共同体崩溃及其引发的后续暴力得到解决之前，不可能指望将这些人遣返。南非面临着一个巨大的挑战，但毫无疑问，对于我们作为一个力求保护无辜者的人道主义国家的国际声誉来说，北方发生的这些可怕事件是非常有利的。\n\n\n\n为了南非的安全"
 HDV_SAF.126.a: "上面到底发生了些他妈的什么事？"
 HDV_SAF.127.t: "比勒陀利亚审判"
 HDV_SAF.127.desc: "一支由警车和厢式货车组成的车队，停在比勒陀利亚的最高法院前。法院由数名士兵在自由国家组织旗帜下守卫着。被俘的德国人从车上下来时，迎接他们的是阵阵嘲讽，而武装警察则挡住了围观者。稍早抵达的检察官和法官们已在法庭内不耐烦地等待着，为这个历史性的一天做着准备。坐在旁听席两侧的法庭听众，在被告进入房间时，发出了嘲讽之声。\n\n德国人在法庭就坐后，法官开始他的开场白：“先生们，你们都因被控犯有反人类罪，以及资助布尔人对南非进行非常规战争，而站在这里。”旁听席上又响起更多嘲讽之声，但法官示意肃静。他完全理解他们的感受，但他必须确保秩序。\n\n“先生们，容我问你们：你们是否认罪？”一阵短暂的停顿，寂静充满了房间。当然，每个人都知道他们有罪；他们无论试图争辩什么，也无法为他们争取到任何宽大处理，如果能得到宽大的话。“不认罪，”这些人说道，挑衅地坐在那里，尽管在别人看来他们面带病容。他们能期待的最好结果，也就是免于死刑了。法庭听众席上嘲讽之声再次高涨。\n\n在后方注视着这一切的是艾坦·贝克尔，被挑选来审理此案的检察官之一，拥有多年法律经验。他也有亲属在这场战争中受到深刻影响，所以这对他个人来说关系重大。他当然知道那些说谎的鼠辈会试图撒谎以脱罪，但他知道自己已将他们逼入绝境，正义很快就会得到伸张。"
 HDV_SAF.127.a: "让审判开始吧"
 HDV_SAF.128.t: "施泰纳出庭作证"
 HDV_SAF.128.desc: "当罗尔夫·施泰纳，那位曾管理过中非专员辖区的德国高级官员之一，在证人席就座时，艾坦陷入了沉默。在例行介绍和证人宣誓之后，辩护律师发言了。“施泰纳先生，您能描述一下您在担任穆勒先生政府部长期间所目睹的事件吗？”\n\n施泰纳微微调了调麦克风，开始说话，目光低垂。“从我来到非洲的第一天起，我就目睹了无数暴行和虐待。其中最恶劣的是，所谓‘叛军’是直接从街上抓来，为获取他们根本不知情的信息而遭受折磨。在审讯期间，那些‘叛军’先被砍掉左腿，然后再砍掉右腿，他们当时还活着，在士兵逼问口供时尖叫不止。然后，等他们最终死了，他们的头骨被挂在杆子上，当作礼物送来送去……当作礼物。”\n\n施泰纳发出一声听上去像是呜咽或痛苦的喘息，然而艾坦真心怀疑这一切都是真的。“我曾想阻止这种无谓的残忍，但我做不到。我愤怒地训斥了一群正在从事这种行为的士兵，随后穆勒过来对我说：‘施泰纳，在这个鬼地方，士兵有时候也得找点乐子。你要是不找乐子，就活不长，所以趁能享乐就享了吧。’对于这种反人类行径，这真是最糟糕的解释；根本算不上解释。”\n\n这个德国人接着用一种更坚定的语气说道：“我只想为我的祖国尽我的职责，而不是参与这些。经历这所有一切之后，我只想救赎我自己。为那些在穆勒和胡蒂格这样的人手下受苦的人，找到哪怕一丝一毫的正义，这样，我因被迫参与其中而无法安息的灵魂才能得到安宁。”\n\n艾坦努力克制着皱眉的冲动。施泰纳当然在撒谎；他并非他自己所描绘的那种无可指责的受害者。他曾置身于这头野兽的腹地，实际上正是由他管理着各式雇佣兵团体犯下的那些骇人听闻的暴行和未受批准的杀戮狂欢。但他同时也是少数能就德国非洲所发生的一切提供证词的官员之一，这能相应地让南非在国际舞台上看起来相当不错。因此，当法官转向艾坦问道：“控方还有任何问题吗？”艾坦只有一个回答。"
 HDV_SAF.128.a: "“没有了，法官阁下。”"
 HDV_SAF.129.t: "一个人的真理"
 HDV_SAF.129.desc: "或许是全非洲最令人憎恶的人，汉斯·胡蒂格，如今坐在了证人席上。这位老人抬着头，带着骄傲与蔑视的神情，望着控方以及所有看着他的人。法官发言了。“汉斯·胡蒂格，你被指控犯有种族灭绝罪、非法征召非战斗人员，以及多项违反战争法的行为，你作何辩护？”\n\n胡蒂格沉默了一会儿，考虑着他的回答。他用低沉的声音开始说话。“我没什么需要为自己辩护的。”他啐了一口，望着人群。“我唯一做错的，就是信任了我队伍里那些叛徒和小丑。我的失败，纯粹是因为那些在非洲自称德国人的人，缺乏雅利安精神。”\n\n随着胡蒂格的讲话，他的声音渐渐增高；每句话都唾沫横飞。“如果我手下任何一个士兵有骨气的话，我们早就把非洲的黑色污秽净化干净了。所有那些污秽之物早就该被活活累死，我们会碾碎任何胆敢反抗优越民族的人。一个在非洲的新生存空间，将召唤着优秀的德国雅利安人，一片可让我们声称归我们所有的新土地。”\n\n英语翻译正专业地传达着胡蒂格那德语咆哮，尽管法庭内一片死寂。那个妄自尊大的人现在几乎是在尖叫。“现在，看看你们所有人，你们每一个都是你们种族的叛徒。你们或许知道，或许不知道，但你们迈出的每一步，都让你们更深地陷入犹太布尔什维克的怀抱。你们的领袖正把你们出卖给美国资本主义，用不了多久，你们所有人都会被那些不配拥有这片大陆的人所奴役。”\n\n“如果你们都能看清元首的真理，一个更美好的世界本会等待着你们。然而，你们所有人都站在这里，被你们错误的信念和所谓平等与崇高的谎言所束缚。你们全都自欺欺人，以为你们柔软的双手能驯服这片大陆，然而唯有铁拳才能令其规训。你们就像非洲的污秽一样，都是奴隶。”说完这最后一句陈述，胡蒂格凝视着人群的双眼，他那目中无人的气焰毫不动摇。所有人都清楚，当审判结束时，等待着这个怪物的唯有一个命运。"
 HDV_SAF.129.a: "死刑"
 HDV_SAF.130.t: "审判之日"
 HDV_SAF.130.desc: "检察官艾坦·贝克尔心中满是期待，注视着比勒陀利亚审判的首席法官正准备宣布法庭的判决。艾坦相当确定他已有足够证据将这些恶棍绳之以法，但这全靠施泰纳的证词。严格来说，此案中的被告只能以战争罪受审，而非虐待土著居民，因为对于“反人类罪”的含义，尚无既定协议。\n\n法官开始发言。“先生们，法庭已就下列个人的罪行做出判决——”法官朗读了一份名单，列出了约30名被俘的德国高级军官。“除了罗尔夫·施泰纳，所有个人均违反了1907年《海牙公约》第四公约。”\n\n\法官扶了扶眼镜。“鉴于施泰纳先生的合作，且因其本人被认定未曾犯下战争罪，施泰纳先生被认定无罪。根据战略情报局的安排，他将在保护性监禁下服刑至少4年。”\n\n法官脸上现出皱起眉头的神情。“被告被认定违反了大量关于战争行为的第二公约条款，以及关于占领区待遇的第三公约条款。其中一些较显著的违规行为包括：抢劫、杀害投降士兵、虐待战俘，以及轰炸未设防定居点和宗教场所。”\n\n“军事法庭已同意以下判决——”随后宣读了一系列判决。绝大多数被告，包括汉斯·胡蒂格，将以绞刑处死。少数被告被判终身监禁；唯有施泰纳被认定无罪释放。当艾坦看着许多受审的党卫军人员和德国罪犯那垂头丧气的面孔，以及那轻蔑的目光时，他只想到了一件事。"
 HDV_SAF.130.a: "大快人心"
 HDV_SAF.131.t: "为自由而集会"
 HDV_SAF.131.desc: "那是一个安静的夜晚，在伊丽莎白港。生活一如平常——人们与朋友一起从酒吧跌跌撞撞地回家，情侣们在新建的街道上漫步，城市在街灯的光晕下轻柔地嗡鸣。然而在这平静的表象之下，一场至关重要的会议正在进行。在城市仍是一片废墟的地段，非国大成员秘密聚集，策划他们解放南非斗争的下一步行动。\n\n奥利弗·坦博感到一阵深深的不安。这是自南非战争结束以来规模最大的非国大会议，可能出岔子的地方太多了。他担心国家安全局随时可能发现他们，仅用几分钟就将他们解放的炽热梦想碾得粉碎。赌注从未如此之大——今天他们将确定方向，就未来的运作方式做出最终决定，并为前方的斗争全力以赴。\n\n当成员们聚集在灯光昏暗的房间时，低语声安静下来，目光朝他转来。窗外破裂的窗户外，任何一丝动静、任何一个影子，都让他紧张。他深吸一口气，稳住自己，走上前开始演讲，他的声音低沉但毫不动摇，承载着希望的重担和他们事业的紧迫性。\n\n“南非的人民，”他开始说道，声音有力而威严，回荡在紧张的房间中。“纳粹入侵的威胁已经结束，现在我们必须决定下一步的行动。我们将继续我们的事业，在我们的原则指引下为我们的自由而战。只有通过这一点，我们才能确保——”\n\n“不。”\n\n他的话语被打断了，一个陌生男人突然从人群后方出现，迅速而从容地移动着。房间顿时冻结了，人们目光投向闯入者。\n\n那是纳尔逊·曼德拉——多年的折磨在他身上留下了瘀伤和印记，但他仍活着，带着激烈的抗争神情站在那里。“半吊子措施和和平抗议的时代结束了。我们让他们惩罚我们，我们让他们殴打我们，而我们只用言辞回应。这改变了什么？当他们完全无视我们时，这又如何改善了我们的生活？是时候展示非洲人民的意志了，证明我们能为我们自己而战。和我站在一起，让我们拿起武器，为我们的自由而战！”\n\n人群沸腾了。奥利弗·坦博只能敬畏地望着眼前这一幕，他那位曾一度被认为失踪或已死的盟友，正站在他们面前，点燃了希望和勇气。在那一刻，反抗压迫的斗争不再是遥远的梦想；它正生机勃勃地，在那些准备夺回自由的人们心中熊熊燃烧。"
 HDV_SAF.131.a: "一场危险的赌博"
 HDV_SAF.132.t: "武装他们的叛军"
 HDV_SAF.132.desc: "在被毁的传教士礼拜堂中殿里，炎热有着实实在在的重量，空气中弥漫着朽木和潮湿泥土的气味。墙上，褪色的天使壁画以冷漠、斑驳的双眼注视着他们。联邦国防军的文特尔上尉坐在一个倒扣的弹药箱上，他整洁的军装与周围的衰败形成了鲜明对比。他那种专业素养本身就是一件武器，冷漠而精准。在他对面，阿尔维斯指挥官，当地安哥拉抵抗组织的领袖，带着一副在这片丛林里生活和睡觉的疲惫神情。他是出于绝望，或许也带着一丝希望，才来到这里的。\n\n文特尔直奔主题，敲了敲摊在他膝上地图上的一个位置。他那阿非利卡口音简短而公事公办。“我们的情报证实他们的补给车队在这里最为薄弱。我们向你们提供步枪、地雷和具体时间表。你的人负责其余部分。我们一起，就能打击一个共同的敌人。”然而，阿尔维斯并没有看地图。他那深陷、疲惫的眼睛紧盯着这个南非人。他来这里，不是为了听战术简报。“那之后呢？”他问道，声音低沉。“当你们的德国人被击退，你们的战略目标达成后，我们的斗争会怎样？安哥拉会怎样？”\n\n文特尔以干脆而冷漠的动作折起地图，脸上毫无表情。他的回答是从比勒陀利亚某次简报中背下的一句话，缺乏任何人情味。“我们的首要战略目标，是长期遏制德国在该地区的殖民影响。”阿尔维斯眼中的希望并非仅仅是消亡；它被彻底掐灭，取而代之的是一种冰冷而惨淡的明了。他本是想来会见一个盟友，却只找到了一个军需官。他部下的生命，并非他们自己争取自由的贡献，而只是南非预算表上的一道条目。\n\n他猛地站起身来，椅子在沉重的寂静中刮擦地面，声音刺耳。“告诉我，上尉，”他说，声音平静却如玻璃般锋利。“我的生命，或者我部下的生命，对你的上级来说，有任何意义吗？还是说，我们仅仅是用来分散注意力的？”没等他明知永远也得不到的答案，阿尔维斯转过身，消失回了丛林之中，留下那名上尉独自面对他的地图和那一箱箱无用的工具。"
 HDV_SAF.132.a: "而有些工具，拒绝为人所用。"
 HDV_SAF.133.t: "维持军工复合体"
 HDV_SAF.133.desc: "在废弃的大庄园机库中，炎热令人窒息，弥漫着铁锈和干朽木的幽灵般的味道。那个南非人，库斯·德维利尔斯，以一种比任何威胁都更令人不安的平静姿态坐在那里。他是战场上的会计。在一张临时拼凑的桌子对面，本地“将军”装腔作势，他那花哨的军装与身边紧张不安的年轻卫兵手中那饱经风霜的卡拉什尼科夫步枪形成了鲜明对比。交易照常在价格上陷入僵局。库斯轻轻一点头，示意他的人撬开一个板条箱，钉子与木头摩擦的尖啸声在寂静中回荡。\n\n将军带着夸张的戏剧性拿起一支R1步枪，假装行家里手地审视着这支仿制自FAL的南非造步枪。“这些上过战场了，”他轻蔑地哼了声，试图夺回谈判筹码。“二手货。我其他供货商的报价要好得多，型号也更新。”库斯让沉默悬停了片刻。“你其他的供货商卖的只是承诺，”他回答道，阿非利卡口音将每个词都切割得冰冷而精准。“他们的补给车队，有在那些不喜欢你的人手里消失的习惯。我卖的不是步枪，将军。我卖的是一种确定性，它们会送达。这个价钱，买的是这个保障。”\n\n这一点，他们俩都知道，才是问题的核心。将军可以尽情装腔作势，但他的对手武装更好，而库斯是方圆五十英里内唯一可靠的货源。库斯身体前倾，声音放低但锋芒不减。“我的步枪确实上过战场。而且，它们赢得了那场战斗。你该问你其他供货商的，不是价钱。而是他们的新步枪到底能不能打响。”\n\n将军的脸绷紧了。虚张声势被戳穿了。漫长而紧张的一刻过后，他把枪重重摔在桌上。“行，”他啐了一口，这个词里满是不甘。“钱很快就会准备好。”他们的握手简短而有力，这是一份只建立在对彼此绝望需求那完美且共同的理解之上的协议。"
 HDV_SAF.133.a: "一种必要的伙伴关系"
 HDV_SAF.134.t: "从一个联邦到另一个联邦"
 HDV_SAF.134.desc: "联邦正陷战火，被来自……南方的侵略者一分为二？美国内战的故事正是如此，恰好发生在一百年前。现在，另一个联邦身处一场大内战，在一片不同的大陆，在一个完全不同的时代，但两者间的相似之处显而易见。进行战争的一部分是维持军队和南非人民的士气，为此，美国陆军最古老的团体之一被派往开普敦进行一场盛大表演。美国陆军第一军乐团“潘兴之子”身着最精致的礼服，来到阿德利街的阿尔罕布拉剧院，准备进行面向南非及世界其他地区电视转播的公开演出。\n\n歌曲都很古老，比南非这个国家还要古老得多，却通过电视和收音机引起了那些观看者的共鸣。美国国旗和南非国旗并排悬挂在他们上方，美国陆军第一军乐团开始演奏来自内战时期的美国歌曲，歌词原封未动，却依然引起了由南非要员和世界各地OFN大使组成的观众的共鸣。\n\n《共和国战歌》、《进军佐治亚》、《当约翰尼再回家时》以及《联邦永存》这些歌曲，对那些不太熟悉这些来自大西洋彼岸曲子的观众而言，闪耀着前所未有的光彩，然而它们似乎颇具感染力。在最前排，赫拉夫总理在美国大使的陪同下，热烈鼓掌。\n\n晚会结束时，演奏了美国国歌，剧院里每个人都站起身来，在场的美国人也跟着唱。最后是《南非之声》，这首阿非利卡人创作的国歌作为国歌演奏，随后是《天佑国王》，以恰当地代表南非白人各族联合的联邦。毕竟，"
 HDV_SAF.134.a: "他们是在为联邦而战。"
 HDV_SAF.200.t: "真相时刻"
 HDV_SAF.200.desc: "时钟缓缓滴答，走向整点。晚上八点似乎如此接近，却又如此遥远。在现代史上，自1934年以来一直在南非牢牢掌控权力的统一党一党统治体系似乎首次出现了裂痕。它的保守翼已经分裂出去组建了新党，而在左翼，进步党正气势如虹，似乎统一党被从其占据几十年的宝座上掀翻已成定局。\n\n在开普敦的三个不同地点，三个不同党派聚集在一起，等待看到底谁会赢。沃斯·罗领导下的保守派分裂派，仍由德·维利尔斯·赫拉夫爵士领导的统一党，以及哈里·施瓦茨领导下的进步党，都在等待那个整点时刻，届时这场竞争激烈选举的真相将被揭晓。\n\n当那一刻最终来临时；全国上下都转向了他们的电视机，条件稍差的去社区电视大厅，而那些更底层的则通过收音机，聆听新闻播报员那字正腔圆的上流英式口音。\n\n“南非广播公司关于[?global.date.GetDateStringNoHourLong]选举的出口民调结果出来了。本次民调是在决定我国未来五年命运的全国关键选区进行的，该出口民调指向一个明确的赢家，那就是……”
 HDV_SAF.200.a: "进步党！"
 HDV_SAF.201.t: "香甜的香槟"
 HDV_SAF.201.desc: "进步党总部内的气氛紧张得令人不安，一种诡异的寂静弥漫了整个房间，唯有那座模拟时钟发出响声，高声宣布着每一秒的流逝。在里面，党魁哈里·施瓦茨和他最亲密的盟友坐在一堆皮椅上，对着面前唯一一台电视机，焦躁地拨弄着大拇指。\n\n当那句话终于被大声说出时，空气中先是一阵短暂的寂静，随后就被一阵胜利的尖叫撕裂，房间里瞬间爆发出自发的欢呼，屋内的人们开始尽情庆祝起来。但哈里只是静静地坐着，全神贯注地沉浸在对未来艰难任期的沉思之中。他在脑中盘算着，很快得出了一系列结论。如果他能设法与受挫的统一党达成联盟协议，他就能成为总理，尽管这意味着他必须削弱自己部分政策，以便让统一党内的温和派留在船上。新保守党与统一党之间的嫌隙，也会使得统一党的先生们更有可能愿意与他达成协议。\n\n然后，他才真正意识到：他做到了。他们做到了，这个起初不起眼的进步党，一步步崛起，对抗着统一党这个高耸的巨人，而现在，终于能去让南非变得更好。\n\n这位未来的总理终于能放松下来了，他真正融入了与他未来内阁成员们的欢快庆典之中。"
 HDV_SAF.201.a: "一个新南非的新黎明"
 HDV_SAF.202.t: "职业生涯的终结"
 HDV_SAF.202.desc: "南非的选举得出了一个揪心的结论：统一党不再拥有明显多数。尽管这还不是失败的明确标志，但至少目前还不是，这令人痛心的消息在统一党支持者的队伍中扩散开来，令他们心生恐惧，担心这或许标志着他们所熟知的南非的终结。原本计划好的一场欢庆之夜变得低沉，那原本热切的庆祝活动被一种安静的、逐渐蔓延的失落感所冲淡。\n\n一名助手冲进德·维利尔斯·赫拉夫位于舞台后面的私人房间，疯狂地敲着门，然后跌跌撞撞地冲了进去。首相端坐在他的皮椅上，一动不动，一言不发。他没对助手说任何话，只是一遍遍地翻阅着提供的选举数据，将纸页一遍又一遍地折起边角，反复核对，希望这不是真的，希望存在某种错误。但数据说得再清楚不过；没有错误，选民中不存在明确多数。进步党战胜了他，事实如此。\n\n“先生……有什么我们能为您的效劳的吗？我是说，帮帮忙，或者任何——”助手结结巴巴地说道。\n\n“出去，”格拉夫简短地回应道。助手走开时，仍不断回头看向格拉夫，在关上门时投下最后一丝担忧的目光。门外，他坐的地方能听到党内成员之间讨论的话语声，聆听着男男女女们压低声音的谈话，谈论着遭受重创的统一党——他的统一党——可能的前景。\n\n助理高跟鞋轻柔的嗒嗒声消失在办公室的嗡嗡声中时，首相用打火机打着了根香烟的前端，吸了一口，然后在他的转椅上转过身，面朝窗户，眺望着大楼周围的城市。首先，他曾为维系南非联邦而战，而现在，他却不得不为维系一个统一党而苦苦挣扎，而在这方面，他失败了。他毫不怀疑，他的政治生涯现在已然结束，他应该体面地鞠躬退场，追求一个不失风度的离去，而不是等到党粗暴地向他指路。"
 HDV_SAF.202.a: "是时候回他的葡萄园退休了"
 HDV_SAF.203.t: "苦涩的觉醒"
 HDV_SAF.203.desc: "新保守党集会的人群在现实打击降临时迅速散去。最先离开的人，是沃斯·罗及其保守主义运动的酒肉朋友，随着各种屈辱性的失败接踵而至，他们都迅速退场了，伯纳德·蒙哥马利一马当先，无论是在政治上还是生理上，都与这位领导南非右翼走向一场将他们注定成为在野党的惊人失败的人拉开了距离，看起来是这样。\n\n这位体型沉重的党魁扶了扶眼镜，看着来来往往的人群，决定溜到附近的自助餐桌旁给自己弄点吃的，一边静静地为自己这不光彩的表现而恼怒。他真的看错时机了吗？他在乡间的竞选活动还不够多吗？他曾确信，非国大那些煽动分子又要开始他们的邪恶勾当这一威胁，就足以吓唬人们去投新保守党的票，但结果，却是比埃格林那伙人更令人生厌的软骨头进步党，以他计划中的方式将统一党赶下了台。\n\n今晚，他将沉浸在失败之中，发表一通承认失败的屈辱演讲，然后立刻回家。但明天，明天，他将起来继续工作。他毫不怀疑，这个铅笔脖子白痴施瓦茨，一旦直面治理的现实，就会自我毁灭，而那个时刻正是新保守党重新掌权、巩固权力的完美时机。\n\n他只需等待他的政治对手自我毁灭，不久局势就会逆转，所有现在离去的人，终将后悔。"
 HDV_SAF.203.a: "五年之内，甚至更短，他将掌权……"
 HDV_SAF.204.t: "正确的时机"
 HDV_SAF.204.desc: "夜色越深，统一党总部就越安静。起初那谨慎的乐观，已让位于一种令人不安的寂静。现在已很清楚，哈里·施瓦茨领导下的进步党，剥夺了统一党的议会多数席位。四下里是窃窃私语和种种猜测，从不断涌入的数据中匆忙得出各种臆断；说实话，没人真正知道这个遭受重创的老党接下来会怎样。统一党内大多数人只是等待着，眼神空洞而茫然，不知明天会带来什么。但迪夫已经知道了。当他登上讲台，面对电视灯光的刺眼白光时，他的心意已决。\n\n“南非同胞们。”他停顿了一下，礼貌地点了点头，然后继续说道。“首先，我要祝贺进步党及其领袖哈里·施瓦茨今晚取得的卓越胜利。南非人民已经发声，他们选择将信任托付给一个更进步的政府。在未来的日子里，我希望我们能开始与进步党进行建设性谈判，组建新一届政府，继续为我们国家和人民建设一个繁荣的未来。”\n\n他停住了。房间陷入一片沉重的寂静。背景中，相机快门声柔和地响着。迪夫的目光从同事们身上扫向记者们，再回到电视摄像机漆黑的镜头上。漫长的十秒钟过去了。他的下颌动了动，舌头紧张地顶了顶牙齿。他接下来要说的话将终结一段职业生涯——但他告诉自己，这是正确的事。\n\n“但我将不会参与其中。”他的双手紧抓住讲台。“我已决定彻底退出政坛，并辞去统一党领袖一职，既然我的任务已经完成，是时候退下了。”\n\n他吸了口气，声音柔和下来，继续说道。“当我在1956年被选为总理时，我曾立誓要为南非带来现代纪元。而今天，我们的国家依然作为一座自由与繁荣的灯塔，矗立在这片迅速变化的非洲。然后战争来临了——那场针对德国人的伟大存亡斗争，他们踏着正步向南冲向开普，以为征服会很轻松。但不。不，他们不会碾碎南非。我们坚定地对抗着黑暗的浪潮，让非洲最后的光芒继续闪耀。”\n\n他稍微挺直了些，声音这时已变得平稳。“能在这些动荡岁月里担任你们的总理，是我的荣幸，我骄傲地知道南非因此而更加强大。我将这个国家交予能干的人手中，并期待在我的葡萄园的藤蔓间享受当之无愧的退休生活。”他对着摄像机最后点了点头。“晚安，愿上帝保佑你们——以及你们的家人。”\n\n说完，迪夫转身走下了舞台。相机快门仍在咔嗒作响，捕捉着一个男人向权力告别，也向一个悄然结束的时代告别的身影。"
 HDV_SAF.204.a: "一段漫长为国服务的生涯终于结束。"
 HDV_SAF.205.t: "早该到来的退休"
 HDV_SAF.205.desc: "几十年来，在南非政界内部，被视作政府大厅中最能干的人之一，副总理兼教育部长扬·亨德里克·霍夫迈尔宣布，将从政治生涯中退休。虽然这对公众而言有些意外，但对于有正确关系的人来说，霍夫迈尔的健康状况一段时间以来一直在恶化，这已是公开的秘密。作为一位以缜密和卓越而闻名的行政管理者，他的退休自然已经经过了数月精心的准备和规划，以确保平稳过渡，如今，这一刻终于到来了。\n\n深得始终构成他支持核心的那些自由派中坚分子的敬爱，即使是他的政治对手，那些当然不喜欢他立场强硬的人，也不得不暗自钦佩他对原则的坚持。即便在他的阿非利卡同胞中，尽管很少有人认同他的自由主义观点，他们对他行政和教育方面的成就也怀有一种无声的敬意。\n\n许多人担心，他政治生涯的终结，尽管不可避免，但会给统一党带来更大的困难，尤其是在制定有效政策和动员其基础支持其议程方面。抛却这些担忧，在公共服务领域度过漫长而卓越的职业生涯后，霍夫迈尔如今退居一旁，为统一党新一代领导人让路。他将在他奠定的遗产基础上继续建设的任务托付给他们，希望他们能以此为基础，为南非锻造一个更自由、更进步的未来。唯有时光能证明，这份希望是否安在了正确之处。"
 HDV_SAF.205.a: "一位自由主义巨擘的落幕。"
 HDV_SAF.206.t: "回顾往昔"
 HDV_SAF.206.desc: "说这一天等了很久，那显然是陈述事实。当你进入公职时，你也知道终有一天会离开它，无论是命运使然，还是事出有因。迪夫在任期间，对将南非建设成一个现代化、先进的国家起到了至关重要的作用，如今这个国家安然处于自由国家组织的安全保护伞之下。当他于1956年上台时，南非正走在正确道路上，但他毫不怀疑，正是他的领导力，才真正推动了国家迈向更美好的未来。他领导国家度过了最艰难的生存危机，并在保卫南非的战争中取得了胜利，显然，这并未能打动选民，他们拿走了统一党的多数席位，迫使其组建联盟才能维持权力。\n\n现在，他将优雅地退场，将火炬传给新一代，他们或许能重建统一党往日的辉煌。\n\n今天是他担任南非总理的最后一天，他坚持亲自清理办公室，收拾家庭照片、私人笔记和其他纪念品。从留下的整齐堆叠的文件，到清空角落的垃圾桶，迪夫在背景中收音机讨论当天事件的低语声中，从独自完成这一切中找到了安静的慰藉。他的私人物品被整齐地打包在门边一个单独的箱子里。有片刻，他犹豫了，重新考虑着。统一党输了，但并非决定性的失败，而他离开的决定是他自己做出的。他本可以回头，留下来，在下次选举中为自己的政治前途而战。\n\n但他深知一件事：历史不会善待那些逾期不退的人。他会想念总理办公室带来的影响力、权力和声望，但他知道，这，确实是最好的选择。"
 HDV_SAF.206.a: "于是他心情沉重地关上了身后的门。"
 HDV_SAF.207.t: "施瓦茨总理"
 HDV_SAF.207.desc: "这间演播室被无数观众见过许多次了，但第一次，有另一个人坐在那办公桌后的椅子上，向南非人民发表讲话。一个多年来徘徊在政治边缘的、相对默默无闻的边缘人物，微笑着面对坐在家中的民众。\n\n“南非同胞们。”\n\n“在多年一成不变的现状之后，一股不同的风正吹拂着好望角。首先，战争给我们的土地带来了巨大苦难，将我们从‘面对不公，中立便是解决之道’这种愚蠢的幻觉中摇醒。但我们迎接了那场挑战，坚定地对抗了分离主义者及其傀儡主子。如今，随着和平的回归，一个伟大的机遇正等待着我们。不仅仅是重建旧的南非，更要建设一个能攀登更高峰的新南非。一片充满希望与机遇的土地，一片每个公民都能得到尊严与尊重的土地。在这片土地上，混乱在不同人的交谈间无处生根，贫穷已经成为过去。\n\n我们前进的道路是正义的，建立在尽管存在诸多差异，但仍尊重所有人的基础之上，一个稳定而自由的经济将为所有人带来繁荣。我们的未来是开放的，我们的命运现在永远与自由国家组织交织在一起。自由世界在召唤我们，带给我们中立时所错过的一切机遇，而那些为保卫我们的自由而献出生命的勇士们，将永远不会被遗忘。\n\n让我们所有人高举自由的火炬，建立一个真正的自由国度，它不无视不公，而是倾尽全力，让所有南非人的生活变得更加美好。"
 HDV_SAF.207.a: "橙、白、蓝，自由的色彩"
 HDV_SAF.208.t: "迪夫的一封信"
 HDV_SAF.208.desc: "亲爱的哈里，\n\n祝贺你联合谈判成功，这间办公室是你的了，在最近这次选举中取得如此出人意料却又大获全胜的胜利，当之无愧。南非给了你一个独一无二的机会来缔造伟大变革，尽管我们在许多政治议题上存在坚定分歧，但我强烈建议你好好把握它。\n\n尽管你获得了胜利，许多善良诚实的南非人都对你所谈论的种种改革感到担忧。这个国家，本质上，是个保守的国家，即使钟摆已经向你摆来，它也完全可能同样轻易地摆向相反的方向。如果你在这些事情上行动过于轻率或推进过猛，很快你就会发现这国家会反咬你一口。节制与稳定，是维系这个国家繁荣的伟大要素，而过于巨大的变革，极有可能会成为这个国家的终结，即便不完全是那样。\n\n若你需要对此事进一步建言，我随时愿提供任何建议。\n\n签名，"
 HDV_SAF.208.a: "£SAF_div_signature"
 HDV_SAF.209.t: "真相时刻"
 HDV_SAF.209.desc: "时钟缓缓滴答，走向整点。晚上八点似乎如此接近，却又如此遥远。在现代史上，自1934年以来一直在南非牢牢掌控权力的统一党一党统治体系似乎首次出现了裂痕。它的保守翼已经分裂出去组建了新党，而在左翼，进步党正气势如虹，似乎统一党被从其占据几十年的宝座上掀翻已成定局。\n\n在开普敦的三个不同地点，三个不同党派聚集在一起，等待看到底谁会赢。沃斯·罗领导下的保守派分裂派，仍由德·维利尔斯·赫拉夫爵士领导的统一党，以及哈里·施瓦茨领导下的进步党，都在等待那个整点时刻，届时这场竞争激烈选举的真相将被揭晓。\n\n当那一刻最终来临时；全国上下都转向了他们的电视机，条件稍差的去社区电视大厅，而那些更底层的则通过收音机，聆听新闻播报员那字正腔圆的上流英式口音。\n\n“南非广播公司关于[?global.date.GetDateStringNoHourLong]选举的出口民调结果出来了。本次民调是在决定我国未来五年命运的全国关键选区进行的，该出口民调显示，由于进步党支持率激增……”
 HDV_SAF.209.a: "统一党失去了多数地位。"
 HDV_SAF.210.t: "香甜的香槟"
 HDV_SAF.210.desc: "进步党总部内的气氛紧张得令人不安，一种诡异的寂静弥漫了整个房间，唯有那座模拟时钟发出响声，高声宣布着每一秒的流逝。在里面，党魁哈里·施瓦茨和他最亲密的盟友坐在一堆皮椅上，对着面前唯一一台电视机，焦躁地拨弄着大拇指。\n\n当那句话终于被大声说出时，空气中先是一阵短暂的寂静，随后就被一阵胜利的尖叫撕裂，房间里瞬间爆发出自发的欢呼，屋内的人们开始尽情庆祝起来。但哈里只是静静地坐着，全神贯注地沉浸在对未来艰难任期的沉思之中。他在脑中盘算着，很快得出了一系列结论。如果他能设法与受挫的统一党达成联盟协议，他就能成为总理，尽管这意味着他必须削弱自己部分政策，以便让统一党内的温和派留在船上。新保守党与统一党之间的嫌隙，也会使得统一党的先生们更有可能愿意与他达成协议。\n\n然后，他才真正意识到：他做到了。他们做到了，这个起初不起眼的进步党，一步步崛起，对抗着统一党这个高耸的巨人，而现在，终于能去让南非变得更好。\n\n这位未来的总理终于能放松下来了，他真正融入了与他未来内阁成员们的欢快庆典之中。"
 HDV_SAF.210.a: "进步主义登上了公共舞台。"
 HDV_SAF.211.t: "职业生涯的终结"
 HDV_SAF.211.desc: "南非的选举得出了一个揪心的结论：统一党已无明确多数。尽管就目前而言，这严格来说还不算失败的标志，但这令人痛心的消息迅速席卷了统一党选民的行列，只留下担忧中夹杂着些许沮丧。\n\n科林·埃尔金走进德·维利尔斯·赫拉夫位于舞台后面的私人房间，焦急地敲了敲门，然后平静地走了进去。首相端坐在他的皮椅上，一动不动，一言不发。他一遍遍地翻阅着提供的选举数据，将纸页一遍又一遍地折起边角，反复核对，希望这不是真的，希望存在某种错误。但数据说得再清楚不过；进步党夺走了他的多数地位。完了，不是对党而言，但对迪夫的职业生涯而言，这点确凿无疑。”他转过头看向埃尔金，后者试图说话却被打断了。\n\n“来领你的战利品了，我明白了？不，别想否认，你来这是为了统一党领袖的位置，对吧？”\n\n“我本不想这么快就提此事。我只是来看看你怎么样。”\n\n“糟透了，明摆着的。不过，我哪天都宁可选你，而不是施特劳斯，所以我会确保在我离开首相职位后，支持你做统一党的新领袖。现在，走吧，我还有很多事要想。”\n\n首相用打火机打着了根香烟的前端，吸了一口，然后在他的转椅上转过身，面朝窗户，眺望着大楼周围的城市。首先，他曾为维系南非联邦而战，而现在，他却不得不为维系一个统一党而苦苦挣扎，而在这方面，他失败了。他毫不怀疑，他的政治生涯现在已然结束，他应该体面地鞠躬退场，追求一个不失风度的离去，而不是等到党粗暴地向他指路。"
 HDV_SAF.211.a: "是时候回他的葡萄园退休了。"
 HDV_SAF.212.t: "令人失望的结果"
 HDV_SAF.212.desc: "新保守党集会的人群在结果公布后渐渐稀疏。最先离开的人，是沃斯·罗及其保守主义运动的酒肉朋友，然而与此同时，人群中似乎仍留着一股斗志，伯纳德·蒙哥马利逗留不去，滔滔不绝地讲述着他领导南非防御的光辉事迹。\n\n这位体型沉重的党魁扶了扶眼镜，看着来来往往的人群，决定溜到附近的自助餐桌旁给自己弄点吃的，一边默默地为这平庸至下的表现感到沮丧。他真的看错时机了吗？他是否该在乡村地区多做些竞选活动？他曾确信，非国大那些煽动分子又要开始他们的邪恶勾当这一威胁，就足以吓唬人们去投新保守党的票，但结果，却是比埃格林那伙人更令人生厌的软骨头进步党，以他计划中的方式将统一党赶下了台。\n\n今晚，他将沉浸在失败之中，发表一通承认失败的屈辱演讲，然后立刻回家。但明天，明天，他将起来继续工作。他毫不怀疑，埃尔金会贪多嚼不烂，而那个精确的时刻正是新保守党重新掌权、巩固权力的完美时机。\n\n他只需等待他的政治对手自我毁灭，不久局势就会为新保守党带来转机。"
 HDV_SAF.212.a: "党错失了这次机会，但来日方长。"
 HDV_SAF.213.t: "正确的时机"
 HDV_SAF.213.desc: "夜色越深，统一党总部就越安静。起初那谨慎的乐观，已让位于一种令人不安的寂静。现在已很清楚，哈里·施瓦茨领导下的进步党，剥夺了统一党的议会多数席位。四下里是窃窃私语和种种猜测，从不断涌入的数据中匆忙得出各种臆断；说实话，没人真正知道这个遭受重创的老党接下来会怎样。统一党内大多数人只是等待着，眼神空洞而茫然，不知明天会带来什么。但迪夫已经知道了。当他登上讲台，面对电视灯光的刺眼白光时，他的心意已决。\n\n“南非同胞们。”他停顿了一下，礼貌地点了点头，然后继续说道。“首先，我要祝贺进步党及其领袖哈里·施瓦茨今晚取得的卓越胜利。南非人民已经发声，他们选择将信任托付给一个更进步的政府。在未来的日子里，我希望我们能开始与进步党进行建设性谈判，组建新一届政府，继续为我们国家和人民建设一个繁荣的未来。”\n\n他停住了。房间陷入一片沉重的寂静。背景中，相机快门声柔和地响着。迪夫的目光从同事们身上扫向记者们，再回到电视摄像机漆黑的镜头上。漫长的十秒钟过去了。他的下颌动了动，舌头紧张地顶了顶牙齿。他接下来要说的话将终结一段职业生涯——但他告诉自己，这是正确的事。\n\n“但我将不会参与其中。”他的双手紧抓住讲台。“我已决定彻底退出政坛，并辞去统一党领袖一职，既然我的任务已经完成，是时候退下了。”\n\n他吸了口气，声音柔和下来，继续说道。“当我在1956年被选为总理时，我曾立誓要为南非带来现代纪元。而今天，我们的国家依然作为一座自由与繁荣的灯塔，矗立在这片迅速变化的非洲。然后战争来临了——那场针对德国人的伟大存亡斗争，他们踏着正步向南冲向开普，以为征服会很轻松。但不。不，他们不会碾碎南非。我们坚定地对抗着黑暗的浪潮，让非洲最后的光芒继续闪耀。”\n\n他稍微挺直了些，声音这时已变得平稳。“能在这些动荡岁月里担任你们的总理，是我的荣幸，我骄傲地知道南非因此而更加强大。我将这个国家交予能干的人手中，并期待在我的葡萄园的藤蔓间享受当之无愧的退休生活。”他对着摄像机最后点了点头。“晚安，愿上帝保佑你们——以及你们的家人。”\n\n说完，迪夫转身走下了舞台。相机快门仍在咔嗒作响，捕捉着一个男人向权力告别，也向一个悄然结束的时代告别的身影。"
 HDV_SAF.213.a: "一段漫长为国服务的生涯终于结束。"
 HDV_SAF.214.t: "早该到来的退休"
 HDV_SAF.214.desc: "几十年来，在南非政界内部，被视作政府大厅中最能干的人之一，副总理兼教育部长扬·亨德里克·霍夫迈尔宣布，将从政治生涯中退休。虽然这对公众而言有些意外，但对于有正确关系的人来说，霍夫迈尔的健康状况一段时间以来一直在恶化，这已是公开的秘密。作为一位以缜密和卓越而闻名的行政管理者，他的退休自然已经经过了数月精心的准备和规划，以确保平稳过渡，如今，这一刻终于到来了。\n\n深得始终构成他支持核心的那些自由派中坚分子的敬爱，即使是他的政治对手，那些当然不喜欢他立场强硬的人，也不得不暗自钦佩他对原则的坚持。即便在他的阿非利卡同胞中，尽管很少有人认同他的自由主义观点，他们对他行政和教育方面的成就也怀有一种无声的敬意。\n\n许多人担心，他政治生涯的终结，尽管不可避免，但会给统一党带来更大的困难，尤其是在制定有效政策和动员其基础支持其议程方面。抛却这些担忧，在公共服务领域度过漫长而卓越的职业生涯后，霍夫迈尔如今退居一旁，为统一党新一代领导人让路。他将在他奠定的遗产基础上继续建设的任务托付给他们，希望他们能以此为基础，为南非锻造一个更自由、更进步的未来。唯有时光能证明，这份希望是否安在了正确之处。"
 HDV_SAF.214.a: "一位自由主义巨擘的落幕。"
 HDV_SAF.215.t: "回顾往昔"
 HDV_SAF.215.desc: "说这一天等了很久，那显然是陈述事实。当你进入公职时，你也知道终有一天会离开它，无论是命运使然，还是事出有因。迪夫在任期间，对将南非建设成一个现代化、先进的国家起到了至关重要的作用，如今这个国家安然处于自由国家组织的安全保护伞之下。当他于1956年上台时，南非正走在正确道路上，但他毫不怀疑，正是他的领导力，才真正推动了国家迈向更美好的未来。他领导国家度过了最艰难的生存危机，并在保卫南非的战争中取得了胜利，显然，这并未能打动选民，他们拿走了统一党的多数席位，迫使其组建联盟才能维持权力。\n\n现在，他将优雅地退场，将火炬传给新一代，他们或许能重建统一党往日的辉煌。\n\n今天是他担任南非总理的最后一天，他坚持亲自清理办公室，收拾家庭照片、私人笔记和其他纪念品。从留下的整齐堆叠的文件，到清空角落的垃圾桶，迪夫在背景中收音机讨论当天事件的低语声中，从独自完成这一切中找到了安静的慰藉。他的私人物品被整齐地打包在门边一个单独的箱子里。有片刻，他犹豫了，重新考虑着。统一党输了，但并非决定性的失败，而他离开的决定是他自己做出的。他本可以回头，留下来，并通过向全国再发表一次慷慨激昂的演讲，为自己的政治前途而战。\n\n但他深知一件事：历史不会善待那些逾期不退的人。他会想念总理办公室带来的影响力、权力和声望，但他知道，这，确实是最好的选择。"
 HDV_SAF.215.a: "于是他心情沉重地关上了身后的门。"
 HDV_SAF.216.t: "埃尔金总理"
 HDV_SAF.216.desc: "这间演播室被无数观众见过许多次了，但第一次，有另一个人坐在那办公桌后的椅子上，直接向南非人民发表讲话。这位前国防部长看起来精神不错，他的表情明亮，充满乐观。\n\n“南非同胞们，”他开始说道。\n\n“我们的国家经历了它最严峻的考验——而我们胜利了。保卫南非是一场巨大的磨难，一场界定我们应成为怎样国家的斗争：一个建立在自由与开放之上的国家，还是一个封闭于世界之外、由企图在此地复辟奴役的铁腕暴政统治的国家。但潮流逆转了，开普岿然屹立，比以前任何时候都更坚定。”\n\n“我们并未为战争做好准备，正如我们也未为未来做好准备；过于专注于保全我们已有的，而未能关注我们可能成为的。一个国家必须始终向前看：看向它的下一步，看向它的下一个成就，而最重要的，是看向它的人民。这个国家的每一位公民，无论出身，都应享有尊严与尊重。任何抛弃受压迫者的国家，终将看到他们揭竿而起反抗。我们再也不能将任何人遗忘在身后，因为贫困对任何社会而言，都是过于沉重的代价。”\n\n“随着我们正式加入自由国家组织，南非如今与西方世界并肩而立，致力于自由、开放市场及与世界合作的原则。对我们经济的限制只会扼杀其增长；这份责任落在我们所有人、我们集体的肩上，去抓住这新的一天。黑暗的阴影已经过去，现在我们期盼着更光明的明天——一个建立在公平、机遇及对所有人尊重之上的明天。”"
 HDV_SAF.216.a: "火炬突击队的旅程已圆满。"
 HDV_SAF.217.t: "迪夫的一封信"
 HDV_SAF.217.desc: "祝贺你与进步党组阁成功。我祝愿你在引导统一党进入新时代的道路上一切顺利。虽然我们已免遭德国通过征服手段的统治，但若不能坚定捍卫我们自己的国家利益，受美国影响的处境也未必更好。\n\n在你担任国防部长期间，我不仅观察到一种朝向进步主义的倾向，也观察到你对推动美国在南非影响力的持续兴趣。尽管与华盛顿的合作将对我们的未来至关重要，但确保南非不沦为美国纯粹的经济傀儡，仍是你的责任。\n\n我们应在OFN中占据同等重要的地位，我希望你能够把握好一种谨慎的平衡，以维护我们的经济独立。应积极推动与OFN其余成员国及南美洲的贸易联系，以创造替代渠道，削弱美国的影响力。美国如今是我们的朋友、安全伙伴和盟友，但它绝不能成为我们的主宰，如果放松警惕，这种危险就会出现。我祝愿你和你的进步派盟友们在领导国家方面取得成功。"
 HDV_SAF.217.a: "£SAF_div_signature"
 HDV_SAF.218.t: "真相时刻"
 HDV_SAF.218.desc: "时钟缓缓滴答，走向整点。晚上八点似乎如此接近，却又如此遥远。在现代史上，自1934年以来一直在南非牢牢掌控权力的统一党一党统治体系似乎首次出现了裂痕。它的保守翼已经分裂出去组建了新党，而在左翼，进步党正气势如虹，似乎统一党被从其占据几十年的宝座上掀翻已成定局。\n\n在开普敦的三个不同地点，三个不同党派聚集在一起，等待看到底谁会赢。沃斯·罗领导下的保守派分裂派，仍由德·维利尔斯·赫拉夫爵士领导的统一党，以及哈里·施瓦茨领导下的进步党，都在等待那个整点时刻，届时这场竞争激烈选举的真相将被揭晓。\n\n当那一刻最终来临时；全国上下都转向了他们的电视机，条件稍差的去社区电视大厅，而那些更底层的则通过收音机，聆听新闻播报员那字正腔圆的上流英式口音。\n\n“南非广播公司关于[?global.date.GetDateStringNoHourLong]选举的出口民调结果出来了。本次民调是在决定我国未来五年命运的全国关键选区进行的，该出口民调指向一个明确的赢家，那就是……”
 HDV_SAF.218.a: "统一党！"
 HDV_SAF.219.t: "永远的德·赫拉夫"
 HDV_SAF.219.desc: "一瞬间，所有疑虑都被扫除。这位议院之王，常任总理，第二代从男爵，脸上挂着灿烂的笑容走上舞台，多年来所有的压力和忧虑顿时消散，因为统一党已横扫了那些进步的崛起派和保守的分裂派。摄影师快门的合唱声和电视摄像机的转播，再次将迪夫置于聚光灯下，他激动地挥舞着双臂，统一党在场的支持者们欣喜若狂。南非的未来再次得到保障，仍旧在德·维利尔斯·赫拉夫爵士的手中。\n\n他穿着他那最精致的米色套装，领带上系着橙白蓝三色，头发梳理得一丝不苟，赫拉夫走到舞台中央的麦克风前。“南非的同胞们。”\n\n“生命中没有什么比为你的国家服务更崇高的荣誉了。我从未回避过为南非挺身而出，当我还是个年轻人的时候，这驱使我加入我们优秀的联邦国防军，它带我踏遍了非洲，为捍卫我们盟国的事业而战。那场失败将我们优秀的国家引入了歧途，使我们陷入一种最终只导致软弱的中立，直到德国人终于对那征服我们跳羚之国的长久计划付诸行动。\n\n但再一次，将我们与自由国家组织中我们天然盟友联结在一起的家庭纽带，远比敌人预想的要强大，好望角坚守住了，由来自全世界的英勇男儿们保卫。在这其中，统一党也坚定地站在组织全国抗战的岗位上，正如它过去多年来所做的那样。我知道统一党会像以往一样，战胜最近的挣扎，我也知道，自己将再次有幸在未来的五年里担任你们的总理。我向你们，所有忠诚、真正的南非人承诺，这场骇人战争的创伤不仅将被治愈，南非还将达到先前难以想象的高度。感谢大家，愿上帝保佑你们所有人。”"
 HDV_SAF.219.a: "一如既往，一如既往。"
 HDV_SAF.220.t: "一个被推迟的梦"
 HDV_SAF.220.desc: "当一个人毕生心血付出的一切，他所为之奋斗、拼搏、不惜一切所争取的东西，最终由别人完成时，他该作何反应？雅各布斯·施特劳斯口中泛起这苦涩的滋味，他想，或许所有男人的事业，最终都是由别人来完成的。\n\n施特劳斯听到从大楼墙壁另一侧传来压抑的欢呼和狂欢声。党在对手面前获胜的消息，似乎让许多人暂时放松了紧绷的神经，公开庆祝起来。他想，他是否也应该庆祝呢。归根结底，德·维利尔斯·赫拉夫的胜利，也是他和他政党的胜利，不是吗？\n\n说这伤害了他，那是夸张了；若真是那么尖锐的痛，他早在多年前就辞职了。自从他被任命到这个职位以来，这种钝痛就一直压在他的精神上，他希望或许——如果赫拉夫在他坚守的防线上失足，那么他就还有另一次机会。他们就会看到，他所做的一切都是有原因的。\n\n然而赫拉夫小心翼翼地游走在底线边缘；他做了他必须做的妥协，无论这世界向他扔来了什么，他都保住了统一党的权力。他不会因为某个老古董死死抱着“能拿回他曾失去的东西”这种念头，就停下脚步。\n\n施特劳斯站起来，纸上字迹的线条模糊了些。他对此太疲惫了，他只想专注于国家本身，却不得不继续扮演外交官，这让他太过疲倦。他的双脚感觉比以往更难挪动，他的骨头分量更重了一些，他的动作也更僵硬了。他还能再经历多少次这样的循环？他体内还能再承受一次吗？\n\n他深深叹了口气，穿上外套。"
 HDV_SAF.220.a: "他想，没人会怪他提早一晚回家吧。"
 HDV_SAF.221.t: "一次适度的进步"
 HDV_SAF.221.desc: "进步党总部内的气氛紧张得令人不安，一种诡异的寂静弥漫了整个房间，唯有那座模拟时钟发出响声，高声宣布着每一秒的流逝。在里面，党魁哈里·施瓦茨和他最亲密的盟友坐在一堆皮椅上，对着面前唯一一台电视机，焦躁地拨弄着大拇指。\n\n当那句话终于被大声说出时，空气中先是一阵短暂的寂静，随后是低低的交谈声。进步党取得了适度的收获，但最终，即便在保守党分裂出去后，这仍不足以撼动统一党继续执政的局面。哈里·施瓦茨摇了摇头，心想自己竟会以为事情会改变，真是有点傻。照目前情况看，进步派将继续被边缘化，无法在南非施加显著影响。然而，他越想，就越觉得这个结果也并非全无可取之处。统一党已被稍稍推向了左翼，其保守翼在分裂出去后如今已四分五裂。科林·埃尔金是个好人，他在这场选举中始终与温和派站在一起，这使他仍留在权力和影响力的中心。\n\n虽然统一党内的温和派仍将占主导地位，但统一党的左翼将获得更多活动空间，而这正是他可以发挥作用的地方。接下来的夜晚，他忙着鼓舞众人，最终还是设法营造出了一种可算作是聚会的气氛。"
 HDV_SAF.221.a: "向前迈出的一小步，但终究是向前的一步。"
 HDV_SAF.222.t: "令人失望的结果"
 HDV_SAF.222.desc: "随着结果不断涌入，新保守党集会的人群有些稀疏了。最先离开的人，是沃斯·罗及其保守主义运动的酒肉朋友，然而与此同时，人群中似乎仍留着一股斗志，伯纳德·蒙哥马利逗留不去，滔滔不绝地讲述着他领导南非防御的光辉事迹。\n\n这位体型沉重的党魁扶了扶眼镜，看着来来往往的人群，决定溜到附近的自助餐桌旁给自己弄点吃的，一边默默地为这平庸至下的表现感到沮丧。他真的看错时机了吗？他是否该在乡村地区多做些竞选活动？他曾确信，非国大那些煽动分子又要开始他们的邪恶勾当这一威胁，就足以吓唬人们去投新保守党的票，但没成，即便在德·维利尔斯·赫拉夫执政近十年后……他们竟然又投给了他！\n\n\今晚，他将沉浸在失败之中，发表一通承认失败的屈辱演讲，然后立刻回家。但明天，明天，他将起来继续工作。他毫不怀疑，赫拉夫的大限终将到来，当他倒下时，新保守党会去收拾残局。"
 HDV_SAF.222.a: "党错失了这次机会，但来日方长。"
 HDV_SAF.223.t: "霍夫迈尔退休"
 HDV_SAF.223.desc: "几十年来，在南非政界内部，被视作政府大厅中最能干的人之一，副总理兼教育部长扬·亨德里克·霍夫迈尔宣布，将从政治生涯中退休。虽然这对公众而言有些意外，但对于有正确关系的人来说，霍夫迈尔的健康状况一段时间以来一直在恶化，这已是公开的秘密。作为一位以缜密和卓越而闻名的行政管理者，他的退休自然已经经过了数月精心的准备和规划，以确保平稳过渡，如今，这一刻终于到来了。\n\n深得始终构成他支持核心的那些自由派中坚分子的敬爱，即使是他的政治对手，那些当然不喜欢他立场强硬的人，也不得不暗自钦佩他对原则的坚持。即便在他的阿非利卡同胞中，尽管很少有人认同他的自由主义观点，他们对他行政和教育方面的成就也怀有一种无声的敬意。\n\n许多人担心，他政治生涯的终结，尽管不可避免，但会给统一党带来更大的困难，尤其是在制定有效政策和动员其基础支持其议程方面。抛却这些担忧，在公共服务领域度过漫长而卓越的职业生涯后，霍夫迈尔如今退居一旁，为统一党新一代领导人让路。他将在他奠定的遗产基础上继续建设的任务托付给他们，希望他们能以此为基础，为南非锻造一个更自由、更进步的未来。唯有时光能证明，这份希望是否安在了正确之处。"
 HDV_SAF.223.a: "一位自由主义巨擘的落幕。"
 HDV_SAF.224.t: "重返工作"
 HDV_SAF.224.desc: "赫拉夫带着安静的微笑，打开了办公室的门。他曾一度怀疑自己能否走到这一步，尤其是在经历了南非战争那混乱和地狱般的时期之后，然而他又一次来到了这里。德·维利尔斯·赫拉夫，南非总理，又一个五年。当他走向他那像往常一样堆满文件的办公桌时，一种满足感浮现在他脸上。他怎么会怀疑过自己，或是他那运转良好的政治机器呢？统一党，以这种或那种形式，自1934年起就一直治理着这个国家，它将继续如此。没有任何布尔人的起义，没有任何德国人挑起的战争，也没有任何保守派的分裂者能阻止他，也永远不会。\n\n他转向身后的窗户，窗外是桌山在落日余晖下闪耀的清晰景象。首相的笑容加深了，充满了无声的骄傲。这个国家，他的国家，以其绵延的风景和自然美景，依然作为黑暗大陆上的一座自由灯塔而屹立。大英帝国那自豪的精神在这里依然鲜活，未曾破碎。南非已经回到了它在盟国中应有的位置，那个它一直属于的地方。说实话，所谓的中立，只不过是对那不可避免的德国袭击的延迟而已。\n\n窗外，开普敦在橙色的暮光中闪烁。人们就像战争已是遥远的记忆，等着历史学家去研究一样，继续着各自的夜生活。赫拉夫心想，历史将如何铭记他和他的政党呢。想必会是带着敬意吧。他想，南非史册上，将把他描述为一位传奇，或许甚至可以比肩扬·范里贝克。\n\n但他的工作尚未完成。他的故事仍在书写中，国家再次召唤他来引领它走向更光明的未来。那是他的任务，他的使命，他的家园。\n\n“南非永存。”"
 HDV_SAF.224.a: "他在办公桌前坐下，重新开始工作。"
 SAF_politics_change_tt: "§Y我们的政治格局将改变！§!"
 SAF_buy_american_armor_big: "购买大批美国装甲"
 SAF_buy_american_armor_big_desc: ""
 SAF.189.t: "迷失于灯火之中"
 SAF.189.desc: "外交功夫有几个关键：寒暄、交谈、交换礼物，当然，还有参观。雅各布斯·施特劳斯是个阿非利卡人，在草原上出生，在谷物田间长大，帮着家里收割。远离了那种简朴的生活，他此刻却发现自己置身于一个满是电脑和科学家的眼花缭乱的房间中，跟着一名热情的向导，对方不仅向他展示着当今的先进计算机，还怀揣更大的梦想，谈论着全国计算机化所蕴含的未来机遇。\n\n他意识到，飞利浦先生是个非常骄傲的人，渴望在这座新建的城市里炫耀他公司的成就。他的成就无可辩驳，但或许可以少花些时间来宣扬它们。\n\n参观又带领他们到了另一个房间，里面满是计算机终端和操作它们的人。“而这里就是PASCAL，全南美最快的计算机，每秒能进行二十万次浮点运算。而这仅仅是当前这一代；我们正在研发一种概念机，可以达到五十万次。想象一下，到那时将有多大的可能性，更不用说通过大规模利用集成电路，以及不同大型机之间的互联互通，来实现进一步的微型化了！”\n\n他的东道主神采奕奕，而施特劳斯只是点着头跟着走。现在，他终于对这次参观失去了耐心，开口说话了。他对计算机一窍不通；他只知道，他必须让这个人投资南非，这样南非才能拥有自己的这样一座灯火辉煌的城市。"
 SAF.189.a: "“我们来谈谈生意吧，飞利浦先生。”"
 SAF.190.t: "原则问题"
 SAF.190.desc: "比勒陀利亚的记者会是数月来首次在没有战争阴影笼罩下举行的。空气中仍弥漫着一种疲惫的解脱感，胜利的气息与对那惊人代价的记忆交织在一起。迪夫走向讲台，会场一片肃静，他的神情坚定。回答了几个常规问题后，一只手举了起来。\n\n一名热切的年轻美国记者站了起来，向迪夫提问。“总理先生，”他问道，声音清晰，“鉴于贵国政府战前曾举行造成分裂的公投，以及许多阿非利卡人的情绪，贵国政府现在是否会废除君主制，以尊重人民的选择？”这问题是对房间里脆弱团结的直接挑战。迪夫凑近麦克风，眼神如冰冷的钢铁。他的回答不会是一名君主主义者的回答，而是一名向被征服的敌人土地上撒盐的胜利者的回答。\n\n“绝不，”他说道，声音平直而冷硬。“共和主义事业是国民党内那些叛徒的核心意识形态旗帜。就是那些叛徒，与布尔抵抗组织合作，拿起武器对抗合法政府，将国家推入战争。我们不会尊重战败叛军的心愿。我们不会以给予他们的敌人一场身后胜利的方式，来朝我们士兵的坟墓吐口水。这是国家原则问题。”\n\n一阵惊愕的沉默随之而来，这番赤裸裸的政治残酷宣言令记者们哑口无言。那名美国记者很快回过神来，追问了一句。“那么，部长先生，说得更清楚些，谁是南非的君主？”迪夫的唇角勾起一丝冷淡的微笑，那是将死对手的棋手的表情。“女王陛下，伊丽莎白二世，”他以绝对的、不容置疑的口吻回答。“你们可以放心，我们已经在比勒陀利亚为女王陛下准备一场加冕典礼，那将是一场配得上她现在统治的这个伟大而统一的国家的典礼。”"
 SAF.190.a: "天佑女王。"
 HDV_SAF.135.t: "关于喀麦隆的报告"
 HDV_SAF.135.desc: "喀麦隆非洲国的隐性威胁，目前仍被西非各国所遏制，主要是一侧以象牙海岸地区为中心的自由法国残余势力。另一端是中非帝国专员辖区，该辖区曾在50年代中期与喀麦隆非洲共和国进行了一场公开冲突，最终以有利于泛非主义者的僵局告终，这进一步成就了泛非主义的神话。\n\n喀麦隆非洲国的首都在杜阿拉，该国正在积聚力量，准备以武力传播其泛非意识形态，挑起未来冲突。虽然该国此前孤立而虚弱，但它已获得来自日本帝国的支持，作为对西非德国和美国利益的制衡。这是一桩权宜的联姻，喀麦隆非洲国的社会主义意识形态为日本所深恶痛绝。来自杜阿拉的短波宣传广播已非常清楚地表明，从长远来看，喀麦隆非洲国意欲寻求彻底而完全的摧毁南非。关键在于，必须向自由法国增派更多支援，以确保对泛非主义的持续遏制。\n\n\n\n为了南非的安全。"
 HDV_SAF.135.a: "赤色分子在北方潜伏……"
 HDV_SAF.136.t: "关于东非裂痕的报告"
 HDV_SAF.136.desc: "在我们的敌人中，东非帝国专员辖区或许是由最狂热分子领导；同时也是治理最糟的一个。一个由汉斯·胡蒂格统治的刽子手国家，他是个绝对的狂热分子，与党卫军关系深厚，被派去整顿一个由原本属于英国和葡萄牙的、被窃取的殖民地拼凑而成的国家。胡蒂格对任何问题的唯一解决办法就是极端暴力，甚至直接进行种族灭绝，以此迫使不同的合作者团体就范，从而监督东非的各片区域。\n\n这块殖民地本打算用于德国人定居，但只有彻头彻尾的疯子，才敢把家安在一个持续处于内部战争状态的地方。面对来自布勒施塔特的近乎种族灭绝的意图，土著居民已没什么可失去的，这只会成为进一步肢解东非的一笔宝贵财富。\n\n合作者团体分为两种：英国人和葡萄牙人。前者对南非抱有强烈同情，后者则很容易通过保全其经济和政治特权来说服他们，以确保对这些区域的持续控制。我们已与两个团体建立了广泛的联系，他们都等待着解放。\n\n虽然应当向从内部对抗东非的土著团体提供一些军事支持，但这些团体对我们毫无同情，一旦冲突结束，他们将立刻转而反对我们。应优先考虑对当地合作者团体进行秘密支持，帮助推动他们脱离布勒施塔特，并控制住土著居民。\n\n\n\n为了南非的安全。"
 HDV_SAF.136.a: "我们只需朝门踹上一脚，整个腐朽的结构就会倒塌……"
 HDV_SAF.137.t: "布勒施塔特的陷落"
 HDV_SAF.137.desc: "将非洲变成德国人第二故乡的妄想终于结束了，东非的黑暗心脏布勒施塔特市已经陷落。尽管来自阿非利卡党卫军的抵抗是狂热的，甚至是自杀式的，但争夺这座城市的战斗已经输掉了，市郊的战斗仍在继续。\n\n这座城市，作为雅利安至上主义的完美体现而新建，如今已沦为废墟，经历了激烈战斗，甚至包括自杀式袭击，建筑被炸毁以延滞联邦国防军无情的推进。那些以极为夸张的日耳曼风格建造的、沿街排列并饰以卐字标志的精致建筑，正遭到联邦国防军的粗暴对待，甚至下令对非战略建筑物进行控制爆破，以彻底封死这座可憎城市的命运。\n\n德·维利尔斯·赫拉夫总理宣布，布勒施塔特的陷落是南非及其OFN盟友的一次伟大胜利，他通过电视广播向全国通报了关于逐一彻底摧毁德国在非洲的占领地的计划。\n\n关于汉斯·胡蒂格及其他经营东非国家的关键人物的下落，尚无明确消息；但据推测，由于德军的抵抗仍在继续，他们已撤退到达累斯萨拉姆市。"
 HDV_SAF.137.a: "拆掉这些墙！"
 HDV_SAF.138.t: "为了联邦"
 HDV_SAF.138.desc: "迪夫一边啜饮着德格雷恩德尔葡萄酒，一边审阅着关于那所谓的阿非利卡人民邦崩溃、从而南非联邦完全恢复统一的最新报告。他对这瓶刚从他那位于开普敦以北不远处的自家葡萄园送来的红酒深感自豪，享受着这场伟大斗争中胜利的一刻。\n\n然而，当他读到国家安全局的另一份文件时，他的心情很快阴沉下来；那份文件建议立即监禁并惩罚那些与牛车哨兵草草组建的人民邦及对南非的政变有勾结的显要阿非利卡人。尽管从未有人会怀疑迪夫对联邦的忠诚，但他对自己人民——阿非利卡人——的同情无疑是存在的。阿非利卡人与盎格鲁人联合的联邦必须得到维护，于是他抽出钢笔，开始划掉名单上那些仅仅是合作者的名字。\n\n牛车哨兵那帮穷凶极恶的极端分子，将全部受到严厉惩罚，即便不是终身监禁……如果他们真能被生俘的话。毕竟，意外确实可能发生。但其他人，那些善良、普通、勤劳的阿非利卡人，是他们建立了这个国家并助其繁荣，他们的名字将从那份名单上被划去，他们将被保留在原地。\n\n联邦不仅要在军事上生存下去，更要作为一种概念存在于人民心中，而对合作者施以重罚只会适得其反，加深彼此间的裂痕。如今，局势已转向不利于牛车哨兵和国民党中那些阴谋家的方向，现在剩下的任务就是将德国殖民地向后推。联邦将维系下去，这一点现在已经确凿无疑了。"
 HDV_SAF.138.a: "他将尽己所能来捍卫星它。"
 HDV_SAF.139.t: "夺取温得和克"
 HDV_SAF.139.desc: "德国在非洲空军中转站的首都已经陷落。尽管遇到地面上的顽强抵抗和来自西南非空军的空中压力，这座城市及其关键的航空设施还是相对完整地被占领了，这实际上通过严重破坏其后勤并夺取其首都，瓦解了德军在纳米比亚的抵抗。温得和克是一个德国人大量定居的地方，彻底取代了该地区的原住民。\n\n南非联邦总理德·维利尔斯·赫拉夫宣告，这是一次伟大的胜利，将最终瓦解德国对非洲东南部的控制，并宣布南非空军和其他盟军飞机很快将从温得和克郊外的主要空军基地起飞作战。同时，他承诺对那些现在处于南非占领下的德国平民给予良好待遇和克制处理，并誓言将在混乱的战争局势下尽力保护他们的财产。\n\n他进一步声明，任何德国人在战争结束后都可以自由留在纳米比亚，而且他们还可以期待，在战争结束、和平时期回归后，对那些不愿返回日耳曼尼亚的人，将有一条通往南非公民身份的途径。\n\n目前尚无关于俘获西南非帝国专员辖区关键领导人的报告，因此可以稳妥推断，他们已乘飞机向北撤离，前往数千公里外的罗安达市。唯有时间能证明战线是否会向北推进，也同样威胁到那座城市。"
 HDV_SAF.139.a: "我们拿到了，现在要用好它！"
 HDV_SAF.140.t: "德班的陷落"
 HDV_SAF.140.desc: "德班市，纳塔尔省的心脏，已经陷落。尽管一直将此城视为家乡的盎格鲁效忠者进行了顽强抵抗，但在阿非利卡人民邦民兵和东非党卫军部队的联合攻击下，经过数日激烈巷战，纳塔尔的这座城市还是被成功夺取。\n\n通往西面的道路挤满了难民，许多人害怕遭到现在主宰此城的狂热分子的报复，或至少是严酷压迫，当地居民常称此城为“德班”，随着纳塔尔省内残余抵抗力量的迅速瓦解，这种恐惧愈发蔓延。由牛车哨兵任命的德班新任专员雅普·马雷，已誓言要清除该城的犹太人和世界主义倾向，并立即实施了严格的种族隔离政策以及严厉的宵禁。\n\n在通过电台广播的一次讲话中，东非帝国专员汉斯·胡蒂格谈到纳塔尔对南非盎格鲁人的重要性，并宣称它将从此成为一座只属于雅利安人和阿非利卡人的城市，同时扬言要摧毁南非联邦，他的部队将发起最终攻势，直捣开普敦，并将其命运永远封印。\n\n德·维利尔斯·赫拉夫总理目前暂未对此置评。"
 HDV_SAF.140.a: "纳塔尔盎格鲁人的心脏，被撕了出来。"
 HDV_SAF.141.t: "我们的下一步行动"
 HDV_SAF.141.desc: "“总理。”伯纳德·蒙哥马利向走进他位于布勒施塔特城外指挥官帐篷的男人打招呼。“欢迎来到布勒施塔特，或者按现在的叫法，蒙哥马利城。”他脸上挂着不可动摇的微笑。“我想，您是亲自来看看这丑陋的德国建筑的吧。”\n\n迪夫没有理会这句评论，继续推进谈话。“算是吧，但我主要是来对部队讲话，鼓舞士气的；战争还远未结束。”\n\n“很好，非常好。”那位年长的人说道。“既然您来了，我想这值得讨论一下我接下来的计划，以便最终将德国人永远赶出非洲。”他示意看向旁边桌上铺开的一张东非大地图，用指示棒直接指向位于马达加斯加和达累斯萨拉姆正中间的科摩罗群岛。“我们应充分利用占领东非首都后获得的海军优势，不仅要继续向北施加压力，还要精心策划一场对科摩罗群岛的登陆入侵。根据我们的情报，科摩罗群岛是敌人的一个小型海军基地，其剩余的大部分海军设施位于达累斯萨拉姆。\n\n您看看科摩罗的位置，它不仅可以作为对敌发动海军行动的关键地点，在战后还可作为南非向东非投射力量的关键场所。基于这些理由，我们必须准备一场大规模的登陆行动，在海军和空军的协同压力下，尽快夺取这些岛屿，夺取胜利。”\n\n迪夫看着从布勒施塔特到科摩罗的距离，意识到几乎没有任何达成突袭的可能。一场如此大规模、如此远距离的两栖登陆？他心存疑虑……其中最重要的一点是，南非没有任何两栖登陆经验。“那我们究竟要如何才能做到这一点呢，伯纳德？”"
 HDV_SAF.141.a: "“所有需要的只是一个计划，以及遵循它的意志。”"
 HDV_SAF.142.t: "分一杯羹"
 HDV_SAF.142.desc: "表面看来，这只是为建立南非军备公司（ARMSCOR）而举行的一次例行会议。然而，这一机构及其深远影响的重要性，迅速吸引了南非精英阶层——那些最富有、最有影响力的人物——的显著参与，他们齐聚在开普敦的扬斯菲尔德军事基地。当埃格林审视着到场的实业家们时，他心想，有多少人是出于能从南非扩大的军事预算中分一杯羹的动机，又有多少人是真心想以自己的方式支持好望角的防御？\n\n“先生们。”分散的交谈停了下来。“让我们直奔主题。摆在各位面前的事实很清楚；这场战争关乎生死存亡，我们的敌人正试图彻底摧毁我们的国家。虽然世界各地的盟友正送来支援，但南非需要迅速开始本土生产，生产军队所需的一切物资。\n\n阿姆斯科将作为工业界、军方、政府和私人融资之间一个决定性的连接点，在南非的土壤上建立起一个真正的军工复合体。政府的意图不仅仅是让这仅仅在战争期间维持，而是要使其成为一个长期发展的转折点，这个军工复合体不仅能满足我们的国内需求，还能促进武器出口。”\n\n哈里·奥本海默，这位南非最富有的人（因此也是损失最大的人），坐在前排，他开口了。“那倒没问题，但政府应该意识到，在更短期内，我们工厂转产军品的能力是有限的，我们需要这方面以及因原材料出口损失而失去的收入的支持，在这个混乱时期，这让我们中的几家公司损失相当惨重。我有一大半的矿山都位于敌占区，要促成这一切并不容易。”\n\n科林坚定地回答道：“无论你们需要什么支持，都会得到；无论需要废除什么规章制度，都会办成。没有任何事能阻挡南非的防御。动用你们手中的一切资源吧，因为如果敌人获胜……”"
 HDV_SAF.142.a: "我们将片甲不留。"
 HDV_SAF.225.t: "真相时刻"
 HDV_SAF.225.desc: "时钟缓缓滴答，走向整点。晚上八点似乎如此接近，却又如此遥远。在现代史上，自1934年以来一直在南非牢牢掌控权力的统一党一党统治体系似乎首次出现了裂痕。它的保守翼已经分裂出去组建了自己的党，而在左翼，进步党似乎正在蓬勃发展，似乎统一党被从其占据几十年的宝座上掀翻已成定局。\n\n在开普敦的三个不同地点，三个不同党派聚集在一起，等待看到底谁会赢。沃斯·罗领导下的保守派分裂派，仍由德·维利尔斯·赫拉夫爵士领导的统一党，以及哈里·施瓦茨领导下的进步党，都在等待那个整点时刻，届时这场竞争激烈选举的真相将被揭晓。\n\n当那一刻最终来临时；全国上下都转向了他们的电视机，条件稍差的去社区电视大厅，而那些更底层的则通过收音机，聆听新闻播报员那字正腔圆的上流英式口音。\n\n“南非广播公司关于[?global.date.GetDateStringNoHourLong]选举的出口民调结果出来了。本次民调是在决定我国未来五年命运的全国关键选区进行的，该出口民调显示，由于新保守党支持率激增……”
 HDV_SAF.225.a: "统一党失去了多数地位。"
 HDV_SAF.226.t: "体面的胜利"
 HDV_SAF.226.desc: "随着结果不断涌入，欢呼声和庆祝声爆发开来，屋子中央的沃斯·罗正在庆祝。伯纳德·蒙哥马利将军站在一旁，看起来很高兴，仍穿着整套军装，尽管他最近才刚刚最后一次退役。\n\n统一党失去了多数地位，但仍是全国最大的政党，但它的构成已经被强行改变，因为新保守党主要在与该党较进步翼对立的选区参选，给埃尔金的进步派造成了沉重打击。迪夫将出局，埃尔金也一样，统一党的新领导人将前来与他结盟。\n\n进步党，那帮傲慢、天真的家伙，已经被国家断然拒绝，只剩下新保守党和统一党是能明智领导国家的严肃政党。没错，罗是错失了成为首相的机会，但进步主义的反复无常浪潮，已经在新保守党的岩石上撞得粉碎，四散而去。\n\n只有一个强大、坚定和保守的政府才能引领这个国家前进，沃斯已经开始构思他能向统一党提出哪些要求，以确保南非真正始终是一个白人的国家。"
 HDV_SAF.226.a: "向右转已箭在弦上。"
 HDV_SAF.227.t: "职业生涯的终结"
 HDV_SAF.227.desc: "南非的选举得出了一个揪心的结论：统一党已无明确多数。尽管就目前而言，这严格来说还不算失败的标志，但这令人痛心的消息迅速席卷了统一党选民的行列，只留下担忧中夹杂着些许沮丧。\n\n雅各布斯·施特劳斯没敲门就走进了德·维利尔斯·赫拉夫位于舞台后面的私人房间，他瞥向首相时，脸上带着一丝淡淡的微笑。埃尔金勉强保住了自己的席位，随着迪夫未能保住政党，施特劳斯将在不久的将来领导党，进而领导国家。\n\n首相端坐在他的皮椅上，一动不动，一言不发。他一遍遍地翻阅着提供的选举数据，将纸页一遍又一遍地折起边角，反复核对，希望这不是真的，希望存在某种错误。但数据说得再清楚不过；新保守党夺走了他的多数地位。完了，不是对党而言，但对迪夫的职业生涯而言，这点确凿无疑。”他转过头看向施特劳斯，两个男人突然间陷入了一场无声的瞪眼大战。\n\n“出去，雅各布斯。我对你无话可说。”\n\n“嗯，我倒是有话要对你说。你输了，你失败了，现在，趁我还没去公开羞辱你之前，多少保留点体面地退场吧。其实，是啊，你就待着别走，这对我来说就更有趣了。”施特劳斯走出去，砰地摔上了门，留下迪夫独自一人，听着摔门声的回音渐渐消失。\n\n首相用打火机打着了根香烟的前端，吸了一口，然后在他的转椅上转过身，面朝窗户，眺望着大楼周围的城市。首先，他曾为维系南非联邦而战，而现在，他却不得不为维系一个统一党而苦苦挣扎，而在这方面，他失败了。他毫不怀疑，他的政治生涯现在已然结束，他应该体面地鞠躬退场，追求一个不失风度的离去，而不是等到党粗暴地向他指路。唯一遗憾的是，最终成为下任首相的会是施特劳斯，而不是别的什么人，但对这一点，他现在已无能为力了。"
 HDV_SAF.227.a: "是时候回他的葡萄园退休了。"
 HDV_SAF.228.t: "回到现实"
 HDV_SAF.228.desc: "进步党遭受了打击。它不仅输了，而且这个国家似乎反而支持了保守派。进步党不仅未能赢得任何席位，他们在统一党进步翼中的潜在盟友也遭受了重创。实际上，这足以让进步主义的理念完全被边缘化，使其处境比以前更糟。\n\n虽然人群逐渐稀疏，但党团结在一起，尽管笼罩在他们头顶的乌云已最为明显。这一刻，哈里不禁自问，他是否对政党和国家的转机抱有不切实际的期望。他本希望能向前迈出一步，去适应这片土地上的现实，而不是像罗那样满口教条、唠叨着事情应该如何的肥佬。但那个哈里无比鄙视的人，却将进入政府，而他将别无选择，只能想办法遏制新保守党的影响力。\n\n然而，最糟糕的是，他曾允许自己抱有希望。去希望一个机会，一次转机，一个新的开始，而这些他们都没得到。现在真正在内心折磨他的，正是这希望。他默默地诅咒自己，竟敢去相信，而不是只满足于一些温和的期望。"
 HDV_SAF.228.a: "他们的命运终有一天会转变，但不是今天。"
 HDV_SAF.229.t: "正确的时机"
 HDV_SAF.229.desc: "夜色越深，统一党总部就越安静。现在已很清楚，由沃斯·罗创立、伯纳德·蒙哥马利将军摇旗呐喊的新保守党，已导致统一党失去了在议会的多数席位。尽管统一党仍将在政府中，但如今它不得不强有力地应对其保守派联盟伙伴的意愿。对统一党大多数人来说，他们都在疑惑，但迪夫登上讲台，在电视摄像机前就位时，他已经下定了决心。\n\n“南非同胞们。”他停顿了一下，给了一个礼貌的点头。“首先，我要祝贺新保守党及其领袖沃斯·罗今晚的胜利。南非人民已经发声，他们决定转向保守的方向。希望我们很快能与新保守党展开谈判，组建下一届政府，继续为我们国家建设一个繁荣的未来。”\n\n然后，是一片死寂。迪夫环顾房间，看向他的同事，看向媒体成员，然后又看向摄像机，一言不发，整整十秒钟。摄影记者们的相机仍在咔嚓作响，迪夫的舌头在嘴里不自然地动着。作为一名政治家，采取这一极端措施，对他来说是最好的选择，不论这有多伤人。\n\n“但我将不会参与其中。”他双手撑在讲台上。“我已决定彻底退出政坛，并辞去统一党领袖一职，既然我的任务已经完成，是时候退下了。当我在1956年被选为总理时，我曾立誓要为南非带来现代纪元，我们的国家至今仍作为一个自由与繁荣的灯塔，屹立在一片迅速变化的非洲。然后战争来了——那场针对德国人的伟大存亡斗争，他们踏着正步向南冲向开普，以为征服会很轻松。但不，不，他们不会碾碎南非，在自由国家组织朋友和盟友们的帮助下，我们坚定地对抗了黑暗的浪潮。”\n\n“能在这些动荡岁月里担任你们的总理，是我的荣幸，我骄傲地知道南非已变得更好。我知道我要将国家交予能干的人手中，并期待在我的葡萄园里享受正当的退休生活。晚安，愿上帝保佑你们和你们的家人。”对着摄像机最后点了点头，迪夫相当迅速地走向了后台房间，有人甚至声称，在门关上、房间里随即爆发出议论声之前，他们看到他的眼睛有点湿润了。"
 HDV_SAF.229.a: "一段漫长为国服务的生涯终于结束。"
 HDV_SAF.230.t: "早该到来的退休"
 HDV_SAF.230.desc: "几十年来，在南非政界内部，被视作政府大厅中最能干的人之一，副总理兼教育部长扬·亨德里克·霍夫迈尔宣布，将从政治生涯中退休。虽然这对公众而言有些意外，但对于有正确关系的人来说，霍夫迈尔的健康状况一段时间以来一直在恶化，这已是公开的秘密。作为一位以缜密和卓越而闻名的行政管理者，他的退休自然已经经过了数月精心的准备和规划，以确保平稳过渡，如今，这一刻终于到来了。\n\n深得始终构成他支持核心的那些自由派中坚分子的敬爱，即使是他的政治对手，那些当然不喜欢他立场强硬的人，也不得不暗自钦佩他对原则的坚持。即便在他的阿非利卡同胞中，尽管很少有人认同他的自由主义观点，他们对他行政和教育方面的成就也怀有一种无声的敬意。\n\n许多人担心，他政治生涯的终结，尽管不可避免，但会给统一党带来更大的困难，尤其是在制定有效政策和动员其基础支持其议程方面。抛却这些担忧，在公共服务领域度过漫长而卓越的职业生涯后，霍夫迈尔如今退居一旁，为统一党新一代领导人让路。他将在他奠定的遗产基础上继续建设的任务托付给他们，希望他们能以此为基础，为南非锻造一个更自由、更进步的未来。唯有时光能证明，这份希望是否安在了正确之处。"
 HDV_SAF.230.a: "一位自由主义巨擘的落幕。"
 HDV_SAF.231.t: "回顾往昔"
 HDV_SAF.231.desc: "说这一天等了很久，那显然是陈述事实。当你进入政坛时，你也知道终有一天会离开它，无论是命运使然，还是事出有因。迪夫在任期间，对将南非建设成一个现代化、先进的国家起到了至关重要的作用，如今这个国家安然处于自由国家组织的安全保护伞之下。当他于1956年上台时，南非正走在正确道路上，但他毫不怀疑，正是他的领导力，才真正推动了国家迈向更美好的未来。他领导国家度过了最艰难的生存危机，并在保卫南非的战争中取得了胜利，显然，这并未能打动选民，他们决定拿走统一党的多数席位，迫使其作为次要角色充当国民保守党的配角。\n\n迪夫内心深处知道，他可以坚持下去，继续领导统一党前进，但很明显，他在政坛的时间即将结束，最好还是优雅地退场，将火炬传给下一代。\n\n今天是他担任南非总理的最后一天，他坚持亲自清理办公室，收拾家庭照片、私人笔记和其他零碎物件。从留下的井井有条的文件，到清理角落的垃圾桶，迪夫在背景中收音机讨论当天事件的低语声中，从独自完成这一切中找到了些许慰藉。他所有的个人物品都放进了一个箱子，放在门边。他停顿了片刻，重新考虑自己的决定。统一党败了，但并非决定性的失败，而他离开的决定是他自己做出的。他本可以扭转局面，留在这里，并通过向全国发表慷慨激昂的演讲，为自己的政治前途而战。\n\n但他深知一件事：历史不会善待那些逾期不退的人，留下来无论如何是件相当冒险的事。他会想念总理职位赋予他的权力、影响力和声望，但这是最好的选择。"
 HDV_SAF.231.a: "于是他心情沉重地关上了身后的门。"
 HDV_SAF.232.t: "施特劳斯总理"
 HDV_SAF.232.desc: "当新总理已经执掌办公室时，在外面向记者们讲话的是沃斯·罗，他脸上挂着根本动摇不了的微笑。十年，整整十年，他才终于把迪夫扫到一边，取得了他在1956年被拒绝的那个位置。当他的联盟伙伴那臃肿肥大的身形在外面对媒体讲话时，施特劳斯正将自己的手放在国家杠杆上，开始向他不同的内阁成员下达指令，并习惯这个他整整十年被剥夺的职位。\n\n雅各布斯扫视着他的办公室，心中已经在筹划着变更；或许要把它现代化，改变其风格使之更适合自己。随之而来的，将彻底抹去迪夫在此地任何残存的影响力痕迹。\n\n但更重要的是，南非必须真正更进一步地彰显自己，成为更广大区域内对抗德国人那摇摇欲坠的野心的主导力量。同时，在对自由的斗争中，南非也必须成为自由国家组织对抗暴政的一个关键成员。南非将在地理上将整个组织串联起来，作为自由国家组织在非洲的锚点，并彻底与自由世界的市场交织在一起。\n\n与此同时，施特劳斯计划严厉打击非洲人国民大会，在牛车哨兵已在战争期间被拔去獠牙之后，彻底根除这个组织以恢复稳定。\n\n正是在翻阅内阁名单时，他发现了一封他认识笔迹的信。看来是德·维利尔斯·赫拉夫给他的最后一条信息。施特劳斯皱着眉头，撕开了信，读了起来。"
 HDV_SAF.232.a: "致雅各布斯·内尔·施特劳斯"
 HDV_SAF.233.t: "迪夫的一封信"
 HDV_SAF.233.desc: "施特劳斯，\n\n按惯例，每位南非总理都应给下一任办公职位的执掌者留下一封私人便条。因此，仅出于这个原因，我在你的新办公室里留下了这封信，尽管我怀疑你是否会读。\n\n当你在1956年的党魁选举中落败时，我曾以为你会坦然接受，即便我随后慷慨地在我下届内阁中授予你外交部长的职位。不幸的是，不久之后，我便越来越多地听说你对我的怨怼，一种在任何可归咎于我的负面事件出现时，便将刀子捅出来的永久倾向。那时我就该将你从职位上撤掉，但我认为那样不利于党内团结。唉，看来你那些心胸狭隘、微不足道的算计在那之后还是继续着。如今，你即将成为总理，但这不会是你为自己设想的那个辉煌时期。\n\n沃斯·罗在盯着你的脑袋，一旦势头转向他，他就会像扔石头一样抛弃你和统一党，试图夺走你的职位。到那时，历史会怎么看待施特劳斯总理呢？不过是历史书中的一条小小的脚注，紧跟在那个使国家现代化、并带领它走过最黑暗的日子和最大危机的那位总理之后。\n\n如果要我给你任何建议，那就是，在你蒙羞之前，优雅地离开你的办公室。\n\n签名，"
 HDV_SAF.233.a: "£SAF_div_signature"
 HDV_SAF.234.t: "真相时刻"
 HDV_SAF.234.desc: "时钟缓缓滴答，走向整点。晚上八点似乎如此接近，却又如此遥远。在现代史上，自1934年以来一直在南非牢牢掌控权力的统一党一党统治体系似乎首次出现了裂痕。它的保守翼已经分裂出去组建了自己的党，而在左翼，进步党似乎正在蓬勃发展，似乎统一党被从其占据几十年的宝座上掀翻已成定局。\n\n在开普敦的三个不同地点，三个不同党派聚集在一起，等待看到底谁会赢。沃斯·罗领导下的保守派分裂派，仍由德·维利尔斯·赫拉夫爵士领导的统一党，以及哈里·施瓦茨领导下的进步党，都在等待那个整点时刻，届时这场竞争激烈选举的真相将被揭晓。\n\n当那一刻最终来临时；全国上下都转向了他们的电视机，条件稍差的去社区电视大厅，而那些更底层的则通过收音机，聆听新闻播报员那字正腔圆的上流英式口音。\n\n“南非广播公司关于[?global.date.GetDateStringNoHourLong]选举的出口民调结果出来了。本次民调是在决定我国未来五年命运的全国关键选区进行的，该出口民调指向一个明确的赢家，那就是……”
 HDV_SAF.234.a: "新保守党！"
 HDV_SAF.235.t: "体面的胜利"
 HDV_SAF.235.desc: "随着结果不断涌入，欢呼声和庆祝声爆发开来，屋子中央的沃斯·罗正在庆祝。伯纳德·蒙哥马利将军站在一旁，看起来很高兴，仍穿着整套军装，尽管他最近才刚刚最后一次退役。\n\n新保守党是议会第一大党，统一党已决定性地失去了多数地位。此外，统一党的构成也被强行改变了，因为新保守党主要在与该党较进步翼对立的选区参选，因此给埃尔金的进步派造成了沉重打击。迪夫将出局，埃尔金也一样，而罗坚信，统一党的新领导人将前来与他结盟。\n\n进步党，那帮傲慢、天真的家伙，已经被国家断然拒绝，只剩下新保守党和统一党是能明智领导国家的严肃政党。现在，他将成为国家的下一任总理，而进步主义的反复无常浪潮，已经在新保守党的岩石上撞得粉碎，烟消云散。\n\n只有一个强大、坚定和保守的政府才能引领这个国家前进，沃斯已经在思考未来，以及他如何才能确保南非真正始终是白人的国家。"
 HDV_SAF.235.a: "向右转已箭在弦上。"
 HDV_SAF.236.t: "职业生涯的终结"
 HDV_SAF.236.desc: "南非的选举得出了一个揪心的结论：统一党已无明确多数。事实上，他们甚至不是第一大党！这令人痛心的消息迅速席卷了统一党成员的行列，只留下担忧中夹杂着些许沮丧。\n\n雅各布斯·施特劳斯没敲门就走进了德·维利尔斯·赫拉夫位于舞台后面的私人房间，他瞥向首相时，脸上带着一丝淡淡的微笑。埃尔金勉强保住了自己的席位，随着迪夫未能保住政党，施特劳斯很可能会领导党与新保守党组阁。\n\n首相端坐在他的皮椅上，一动不动，一言不发。他一遍遍地翻阅着提供的选举数据，将纸页一遍又一遍地折起边角，反复核对，希望这不是真的，希望存在某种错误。但数据说得再清楚不过；新保守党夺走了他的多数地位。完了，不是对党而言，但对迪夫的职业生涯而言，这点确凿无疑。他办公室的门开了，雅各布斯走了进去，身后门砰地关上。迪夫转过头看向施特劳斯，两个男人突然间陷入了一场无声的瞪眼大战。\n\n“出去，雅各布斯。我对你无话可说。”\n\n“嗯，我倒是有话要对你说。你输了，你失败了，现在，趁我还没去公开羞辱你之前，多少保留点体面地退场吧。其实，是啊，你就待着别走，这对我来说就更有趣了。”施特劳斯走出去，砰地摔上了门，留下迪夫独自一人，听着摔门声的回音渐渐消失。\n\n首相用打火机打着了根香烟的前端，吸了一口，然后在他的转椅上转过身，面朝窗户，眺望着大楼周围的城市。首先，他曾为维系南非联邦而战，而现在，他却不得不为维系一个统一党而苦苦挣扎，而在这方面，他失败了。他毫不怀疑，他的政治生涯现在已然结束，他应该体面地鞠躬退场，追求一个不失风度的离去，而不是等到党粗暴地向他指路。最终领导统一党的会是施特劳斯，真是见鬼的遗憾，但对这一点，他现在已无能为力了。"
 HDV_SAF.236.a: "是时候回他的葡萄园退休了。"
 HDV_SAF.237.t: "惨淡现实"
 HDV_SAF.237.desc: "进步党遭受了沉重打击，或许是致命的。它不仅仅是输了，而是丢掉了除一个席位外的所有议会席位，只剩下哈里孤零零一人。这个国家似乎大量投票给了保守派和统一党温和派。进步党不仅未能赢得任何席位，他们在统一党进步翼中的潜在盟友也眼看着几乎被全数摧毁。实际上，这足以摧毁进步主义在南非几十年的理念。\n\n虽然人群迅速稀疏，但党的核心成员仍团结在一起，尽管看起来整个政党都可能就此垮塌。这一刻，哈里不禁自问，他是否从一开始就对更好的明天抱有不切实际的期望，既然现在已毫无疑问，罗将把国家拖向后退。现在，即将成为总理的沃斯·罗，那个不停教导每个人事情本来应该如何，以及他将如何用铁腕手段钳制南非那群不守规矩土著的人。那个哈里无比鄙视的人，将进入政府，而他将别无选择，只能想办法以遏制新保守党的影响力。\n\n然而，最糟糕的是，他曾允许自己抱有希望。去希望一个机会，一次转机，一个新的开始，而这些他们都没得到。真正击垮他精神的，正是这希望，这现在正在内心撕裂着他的痛苦。他默默地诅咒自己，竟敢去相信，而不是只满足于一些温和的期望。或者，根本没有任何期望。"
 HDV_SAF.237.a: "好望角进步事业的终结。"
 HDV_SAF.238.t: "正确的时机"
 HDV_SAF.238.desc: "夜色越深，统一党总部就越安静。现在已很清楚，由沃斯·罗创立、伯纳德·蒙哥马利将军摇旗呐喊的新保守党，已导致统一党失去了在议会的多数席位。尽管统一党仍将在政府中，但不得不将总理一职移交给新保守党的沃斯·罗。对统一党大多数人来说，他们都在疑惑，但迪夫登上讲台，在电视摄像机前就位时，他已经下定了决心。\n\n“南非同胞们。”他停顿了一下，给了一个礼貌的点头。“首先，我要祝贺新保守党及其领袖沃斯·罗今晚的胜利。南非人民已经发声，他们决定转向保守的方向。希望我们很快能与新保守党展开谈判，组建下一届政府，继续为我们国家建设一个繁荣的未来。”\n\n然后，是一片死寂。迪夫环顾房间，看向他的同事，看向媒体成员，然后又看向摄像机，一言不发，整整十秒钟。摄影记者们的相机仍在咔嚓作响，迪夫的舌头在嘴里不自然地动着。作为一名政治家，采取这一极端措施，对他来说是最好的选择，不论这有多伤人。\n\n“但我将不会参与其中。”他双手撑在讲台上。“我已决定彻底退出政坛，并辞去统一党领袖一职，既然我的任务已经完成，是时候退下了。当我在1956年被选为总理时，我曾立誓要为南非带来现代纪元，我们的国家仍作为一个自由与繁荣的灯塔，屹立在一片迅速变化的非洲。然后战争来了——那场针对德国人的伟大存亡斗争，他们踏着正步向南冲向开普，以为征服会很轻松。但不，不，他们不会碾碎南非，在自由国家组织朋友和盟友们的帮助下，我们坚定地对抗了黑暗的浪潮。”\n\n“能在这些动荡岁月里担任你们的总理，是我的荣幸，我骄傲地知道南非已变得更好。我知道我要将国家交予能干的人手中，并期待在我的葡萄园里享受正当的退休生活。晚安，愿上帝保佑你们和你们的家人。”对着摄像机最后点了点头，迪夫相当迅速地走向了后台房间，有人甚至声称，在门关上、房间里随即爆发出议论声之前，他们看到他的眼睛有点湿润了。"
 HDV_SAF.238.a: "一段漫长为国服务的生涯终于结束。"
 HDV_SAF.239.t: "早该到来的退休"
 HDV_SAF.239.desc: "几十年来，在南非政界内部，被视作政府大厅中最能干的人之一，副总理兼教育部长扬·亨德里克·霍夫迈尔宣布，将从政治生涯中退休。虽然这对公众而言有些意外，但对于有正确关系的人来说，霍夫迈尔的健康状况一段时间以来一直在恶化，这已是公开的秘密。作为一位以缜密和卓越而闻名的行政管理者，他的退休自然已经经过了数月精心的准备和规划，以确保平稳过渡，如今，这一刻终于到来了。\n\n深得始终构成他支持核心的那些自由派中坚分子的敬爱，即使是他的政治对手，那些当然不喜欢他立场强硬的人，也不得不暗自钦佩他对原则的坚持。即便在他的阿非利卡同胞中，尽管很少有人认同他的自由主义观点，他们对他行政和教育方面的成就也怀有一种无声的敬意。\n\n许多人担心，他政治生涯的终结，尽管不可避免，但会给统一党带来更大的困难，尤其是在制定有效政策和动员其基础支持其议程方面。抛却这些担忧，在公共服务领域度过漫长而卓越的职业生涯后，霍夫迈尔如今退居一旁，为统一党新一代领导人让路。他将在他奠定的遗产基础上继续建设的任务托付给他们，希望他们能以此为基础，为南非锻造一个更自由、更进步的未来。唯有时光能证明，这份希望是否安在了正确之处。"
 HDV_SAF.239.a: "一位自由主义巨擘的落幕。"
 HDV_SAF.240.t: "回顾往昔"
 HDV_SAF.240.desc: "说这一天等了很久，那显然是陈述事实。当你进入政坛时，你也知道终有一天会离开它，无论是命运使然，还是事出有因。迪夫在任期间，对将南非建设成一个现代化、先进的国家起到了至关重要的作用，如今这个国家安然处于自由国家组织的安全保护伞之下。当他于1956年上台时，南非正走在正确道路上，但他毫不怀疑，正是他的领导力，才真正推动了国家迈向更美好的未来。他领导国家度过了最艰难的生存危机，并在保卫南非的战争中取得了胜利，显然，这并未能打动选民，他们决定拿走统一党的多数席位，迫使其作为次要角色充当国民保守党的配角。\n\n迪夫内心深处知道，他可以坚持下去，继续领导统一党前进，但很明显，他在政坛的时间即将结束，最好还是优雅地退场，将火炬传给下一代。\n\n今天是他担任南非总理的最后一天，他坚持亲自清理办公室，收拾家庭照片、私人笔记和其他零碎物件。从留下的井井有条的文件，到清理角落的垃圾桶，迪夫在背景中收音机讨论当天事件的低语声中，从独自完成这一切中找到了些许慰藉。他所有的个人物品都放进了一个箱子，放在门边。他停顿了片刻，重新考虑自己的决定。统一党败了，但并非决定性的失败，而他离开的决定是他自己做出的。他本可以扭转局面，留在这里，并通过向全国发表慷慨激昂的演讲，为自己的政治前途而战。\n\n但他深知一件事：历史不会善待那些逾期不退的人，留下来无论如何是件相当冒险的事。他会想念总理职位赋予他的权力、影响力和声望，但这是最好的选择。"
 HDV_SAF.240.a: "于是他心情沉重地关上了身后的门。"
 HDV_SAF.241.t: "罗总理"
 HDV_SAF.241.desc: "这位焦点人物，南非最有影响力的政治家，自豪地占据舞台中央，身边围着来自世界各地的不同记者。他脸上的笑容简直无法动摇，穿着他最好的定制西装，沉醉在这荣耀的关注之中，而此时施特劳斯已悄悄走进他身后的大楼，开始工作什么的，这其实也无所谓了。罗挥了挥手，让喧闹安静下来，而人群也的确安静了。\n\n“女士们先生们，南非已经发声，而且发出了如此明确的声音。统一党曾一度误入歧途，做出那种向企图贬低我们标准的人不断让步的愚蠢想法。而南非，是一个由绅士们共同合作、为更美好的明天而努力的地方，它将捍卫我们的传统和我们的生活方式。”\n\n“牛车哨兵的威胁已经被解决了，但非洲人国民大会里那些没完没了的煽动分子还想把他们那套可恶的共产主义愿景强加给南非。我们将在这一威胁面前坚定立场，以坚定果断的手段将他们彻底瓦解。唯有如此，真正的稳定才会重归好望角，唯有如此，我们所有人才能繁荣兴旺。”"
 HDV_SAF.241.a: "好望角将恢复秩序。"
 HDV_SAF.242.t: "迪夫的一封信"
 HDV_SAF.242.desc: "亲爱的沃斯，\n\n祝贺您在这次选举中取得的成就；想必创立一个政党并立即带领它在这次选举中取得巨大成功并非易事。在您即将登上总理之位时，我必须提醒您领导这个优秀国家究竟意味着什么，以及如何推动它前进。\n\n南非是一个深深植根于传统的国家，是大英帝国骄傲的后裔，至今仍由像您这样的杰出绅士领导。然而，彻底固守在您所如此激烈倡导的那些更严厉手段上，将是不明智的。成为一名优秀的总理意味着要有适应性，能灵活应对不断变化的时代，在您猝不及防之前早做准备，而统一党自1948年以来，就一直自豪地抵制了任何及所有实施国民党那套种族隔离计划的呼吁。\n\n回想起来，我在战前备战方面做得太少，曾徒劳地希望，德国人能证明自己是一个体面、可敬的民族，而不是一心想统治世界的残酷暴徒。我不愿适应时代的变化，结果几乎毁掉了南非。\n\n我并不怀疑你会成为一位优秀的总理，只要你睁大眼睛、保持警醒。毕竟，灵活性及务实精神，正是一位英国绅士最优秀的品质。\n\n若您需要对此事进一步建言，我随时愿提供建议。\n\n签名，"
 HDV_SAF.242.a: "£SAF_div_signature"
 SAF_complete_both_BOSS_and_arm: "我们已完成§Y国安局在盯着§!和§Y武装他们的叛军§!两个国策。"