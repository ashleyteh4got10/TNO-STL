 SAF_internal_affairs_explainer: "§g这项机制代表南非的政治事务状态。共有4个数值：§K非国大§!实力、§O牛车哨兵§!实力、§I君主制§!支持率和§R混乱§!。\n\n§K非国大§!与§O牛车哨兵§!实力：§K非洲人国民大会§!和§O牛车哨兵§!的实力水平。\n如果§K非国大§!实力达到§Y100%§!，南非将面临由非国大组织的大规模工业罢工。\n如果§O牛车哨兵§!实力达到§Y100%§!，牛车哨兵将趁机偷窃武器，为潜在的§R公开叛乱§!做准备。\n\n§I君主制§!支持率：在举行公投时，预期有多少南非人会投票支持君主制。如果§I君主制§!支持率§Y超过50%§!，公投极有可能以南非§Y维持君主制§!告终。\n\n§R混乱§!：衡量南非政治体系内无序状态的指标。随着§R混乱§!加剧，你将面临不断升级的经济惩罚，且§K非国大§!和§O牛车哨兵§!的实力将以更快速度增长。此外，还存在一个§Y基础§!§R混乱§!水平（由进度条内的黄色条块指示），该水平会随着南非政治局势的恶化而随时间增加。想要长时间将§R混乱§!保持在§Y基础§!§R混乱§!水平以下是极其困难的。§!"
 SAF_IA_Base_Chaos_tt: "§Y基础§!§R混乱§!值：§W[?SAF_Chaos_bound|2]%§! \n\n如果§R混乱§!低于§Y基础§!§R混乱§!水平，§R混乱§!的§Y每周变化率§!将每周增加§Y1.00%§!，直至§R混乱§!等于或高于§Y基础§!§R混乱§!水平。\n\n一旦§R混乱§!升至或超过§Y基础§!§R混乱§!水平，§R混乱§!的§Y每周变化率§!将重置为§Y1.00%§!。\n\n当§R混乱§!在降低后的数值低于§Y基础§!§R混乱§!水平时，降低§R混乱§!的效果将§Y减弱§!。"
