 SAF_IA_ANC_tt: "§K非洲人国民大会§!\n实力：[?SAF_ANC_power|W2]%\n--------------\n§K非洲人国民大会（ANC）§!成立于1912年，被视为非洲首个正式解放运动组织。最初由土著精英和宗教界人士组成，在1950年代初期随着纳尔逊·曼德拉、奥利弗·坦博、沃尔特·西苏鲁等§K新一代领导人§!的涌现，逐渐发展为广泛的群众运动。\n\n自1955年签署§M《自由宪章》§!后，§K非国大§!遭到§J统一党§!的残酷镇压，迫使组织转入地下活动。尽管于1960年被全面取缔，§K非国大§!仍持续获得全国受压迫民众的支持。为应对持续镇压，§K非国大§!建立了名为§G“民族之矛”§!的武装分支，目前正为未来的斗争进行初步的组织建设和武器装备。\n\n尽管§J统一党§!竭力瓦解§K非洲人国民大会§!，但随着平等呼声日益高涨，§K非国大§!的力量与影响力仍在持续增强。"
