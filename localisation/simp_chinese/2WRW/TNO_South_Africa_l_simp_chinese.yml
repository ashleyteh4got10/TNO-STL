 SAF_rebuilding_saf: "南非重建"
 SAF_rebuilding_saf_desc: "南非多地遭受重创，饱受炮火、纵火与恐怖主义的摧残。目前正在开展大规模重建计划以修复这些创伤。拥有紧急权力的军事总督正被派往南非各地，协调各区域的应对措施。南非必将从这场灾难中恢复，并变得比以往更强大、更团结。"
