 SAF.165.t: "心中重负"
 SAF.165.desc: "罗恩将香烟在烟灰缸里摁灭，转入岔路。丹尼尔凝视着眼前的土路。在贝德福德卡车头灯的昏暗光线下，灌木丛几乎掩盖不住从后面传来的气味。\n\n继续往前开时，罗恩的目光扫向靠在副驾驶车门上的丹尼尔，他正闷闷不乐。\n\n“那么，你是想告诉我你在那个角落里烦什么，还是我们就这样一路沉默回镇上？”\n\n丹尼尔觉得是时候了，他们得谈谈。“趁一群人睡着时杀了他们，然后把他们扔到乡下的无名坟墓里？”\n\n“听好了，小子，这些人是带着他们那副善良而虔诚的良心入睡的，他们认为为了自己的政治利益而摧毁南非是天经地义的事。我们的政府知道这一点。这是为了人民，为了我们的生计和我们的社区。他们想让我们死。不是我们死，就是他们亡。”罗恩说着，将香烟按在发红的烟圈上。\n\n“趁他们熟睡时杀掉他们是我们唯一的选择吗？连把他们关进监狱都没考虑过？我们有什么资格审判并杀死这些所谓的国家敌人？我们又有多道德？”\n\n罗恩回嘴道：“你有道德，并不代表你是一个更好的人。我记得你和我一样，都在那些人身上射了子弹。如果你想找法官，去找个该死的牧师，忏悔你的罪过吧。”他吸了一口烟。\n\n丹尼尔无法接受这种虚伪，对搭档吼道，让他闭嘴，把活儿干完。他受够了这个任务。"
 SAF.165.a: "他们俩在夜色中疾驰，彼此再没说过一句话。"
