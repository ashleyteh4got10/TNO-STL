 SAF_diamonds_from_sierra_leon_desc: "[getDiamondsFromSierraDesc]"
 SAF_diamonds_from_sierra_leon_desc_peace: "\n\n£GFX_SAF_mines\n\n\n\n\n近一个世纪前在金伯利发现的钻石，将我们的国家从农耕之国转变为矿业之国。自那时起，来自世界各地的拓荒者纷纷来到开普敦，追寻无尽财富的梦想；然而，现代采矿行业已非冒险家的乐园。\n\n由塞西尔·罗得斯创立、现由哈里·奥本海默在开普敦管理的德比尔斯公司，完全掌控着这些珍贵宝石的开采与贸易。通过与德比尔斯紧密合作，我们已在自由国家组织与统一公约的经济贸易网络中开辟了商机。这项合作为耗资巨大却卓有成效的《国家发展计划》提供了必要资金。\n\n与此同时，保持中立立场是个微妙难题。德国方面尤其对政府及统一党微妙却明显的亲自由国家组织立场深感不满。若德方不满情绪持续升级直至决定撤资，我们将丧失大量机遇，这或将严重阻碍经济发展。与德国维系良好关系至关重要，因其日益增长的怒意正威胁着我们当下的经济黄金时代。"
 SAF_diamonds_from_sierra_leon_desc_war: "\n\n£GFX_SAF_mines\n\n\n\n\n\n战争已降临南非，当这个国家在毁灭边缘摇摇欲坠之际，采矿作业却从未停歇。钻石出口仍在继续，但当前首要之务是投资于我们的直接防御。如今已再清楚不过——布尔人及其德国盟友企图彻底征服我们的国家。此刻正是动用我们最宝贵资产的时候，将其投入我们的人民、军队、防御工事和基础设施，一切皆为战争服务。\n\n南非必将屹立于暴政的洪流前，团结一致保卫我们的家园。"
 SAF_diamonds_from_sierra_leon_desc_postwar: "\n\n£GFX_SAF_mines\n\n\n\n\n\n南非战争曾是一场巨大的灾难，但如今已被克服。随着国家迈向和平时期，重建进程正式启动。目前仅限中立市场与OFN成员国参与，通过国内政府、民间及外资的密集投入实施经济振兴计划，南非矿产资源出口量即将超越战前水平。\n\n作为OFN投资的新前沿与安全港湾，南非将美国、加勒比地区与澳大利亚、新西兰紧密相连，各港口很快将重现贸易繁荣景象。这个国家犹如未经雕琢的钻石，正等待全球投资与贸易的魔力将其打磨得熠熠生辉。"
