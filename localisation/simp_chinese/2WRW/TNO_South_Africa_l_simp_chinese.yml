 HDV_SAF.72.a: "要是有一个词能形容幸灾乐祸的感觉就好了。"
 HDV_SAF.73.t: "接触葡萄牙人"
 HDV_SAF.73.desc: "[1674.owner.GetAdjective]大使与曾彬彬有礼问候他的总理进行了会谈。自伊比利亚派遣援助乃至军队保卫南非以来，两国关系持续稳步发展。随着边界最终确立，南非现已控制了相当部分莫桑比克领土——这片前葡萄牙殖民地约十五年前曾被德国人夺取。果不其然，[1674.owner.GetAdjective]政府立即提出归还领土的要求，迪夫确信美国人定会对此表示反对。但与[1674.owner.GetNameDef]开展贸易似乎前景可期，尽管存在意识形态差异，南非与[1674.owner.GetNameDef]深化安全合作对双方都将大有裨益。所幸格拉夫已构思出万全之策，终将实现皆大欢喜的局面。\n\n“大使先生，感谢您的莅临。我已审阅贵国索还殖民地的请求，但很遗憾必须予以拒绝。为确保整体区域稳定，南非将继续管辖这些领土。”\n\n见大使起身欲辩，迪夫抬手制止。“不过——”他刻意停顿以增强效果，“南非始终是尊重自由市场意志、保障合法财产不受剥夺的国家。这片领土及其资产曾遭德国威胁势力不公正地掠夺，彼时他们刚窃取此地便企图彻底摧毁南非。有鉴于此，只要原业主能提供充分所有权证明，南非愿归还所有土地、工厂及其他资产。”\n\n格拉夫向大使微微颔首：“请转告贵国政府，若双方能在近期签署全面贸易投资协定，我们在证据审核方面将格外宽容。相信两国深化合作必将创造巨大效益，在此谨向贵国政府致以最诚挚的慰问。莫桑比克现在乃至将来都是南非领土，但贵国在该地区的经济利益绝不会受到阻碍。”"
 HDV_SAF.73.a: "新殖民主义降临莫桑比克。"
