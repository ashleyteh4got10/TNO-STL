 SAF_OFN_cooperation_desc: "既然整个自由国家组织都已支持我们，现在正是全面推进并与盟友协调大部分——若非所有——事务的时机，让他们能够全力以赴。随着OFN高层成员的直接参与，我们可以推进共同规划，并更好地相互利用南非的后勤体系。这或许是战争中最被低估的环节，对普通人而言也最缺乏吸引力，但没有什么能比得上一个精心规划、适应大规模作战部队需求的后勤体系。让物资滚滚而来，让士兵整装待发——南非的防御计划已臻至完美！"
