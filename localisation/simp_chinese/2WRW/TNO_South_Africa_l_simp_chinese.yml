 HDV_SAF.80.t: "绅士的胜利"
 HDV_SAF.80.desc: "南非英语电视台“南非一台”播报选举结果时，房间里静得落针可闻。当统一党赢得确保稳定多数的席位数被念出时——尽管保守派已从党内分裂——整个房间顿时爆发出欢呼与庆祝声浪，德·维利尔斯·赫拉夫被簇拥在人群中央。此刻其他都不重要了，无论是其他党派从联合党手中夺得的席位，还是这个政党将再执政五年的事实。\n\n在电视镜头前，迪夫被欢庆的人群高举到空中，人们一遍遍呼喊着他的昵称。香槟瓶塞四处飞溅，橙白蓝三色彩纸如雨纷扬。待沸腾的场面稍缓，迪夫被小心放下，站到了麦克风前。\n\n“南非的同胞们。”他停顿以强化效果，“我感谢诸位对我和统一党的支持。时局艰难，我们始终在为捍卫自身而艰苦斗争。但自由依然主宰着这片土地，我们依然闪耀为非洲大陆最富强、最自由的国度！”\n\n“在这片好望角之地，我们的先辈开拓建设了永世长存的天堂，正是统一党引领诸位走向繁荣，并将继续执掌未来五年！作为你们的总理，我向诸位保证：国家必将重回正轨。重建工程必须完成，而后我们将迎来崭新的黄金时代，抵达他国只能仰望的巅峰。为了南非！”"
 HDV_SAF.80.a: "第一先生光芒耀眼。"
