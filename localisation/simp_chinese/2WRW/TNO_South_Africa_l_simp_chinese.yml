 ask_the_ofn_for_assistance_desc: "OFN是一个在联合峰会上获得多数票后所有成员国必须在任何战争中提供援助的联盟。让我们开始准备这个条约的第一次宣言，并向法西斯分子表明，自由世界将继续战斗！"
 SAF_the_south_africa_act: "§O《1909年南非法案》§!"
 SAF_the_south_africa_act_desc: "§X英国议会§!为统一其领地通过的第三项重大法案§O《1909年南非法案》§!，将§X各自为政§!的殖民地整合为单一实体——§O南非§!。这个新国家由四个省份组成：好望角、奥兰治自由邦、德兰士瓦与纳塔尔，各省均被赋予一定自治权。\n\n在政治体制上，该国效仿§X英国宪政原则§!建立了完善议会制，设有参议院和国民议会，首任总理§u路易斯·博塔§!是效忠英国的布尔人，他后来助力§O南非§!提升地位，使其成为§n大英帝国的完整自治领。§!"
 SAF_native_trust_and_land_act: "§n£GFX_SAF_farmfield_texticon 《1936年土著信托与土地法案》§!"
 SAF_native_trust_and_land_act_desc: "作为原§n£GFX_SAF_farmfield_texticon 《1913年土著土地法案》§!的延续和扩展，该法案以种族为标准规范土地所有权，并将部分领土指定为§r占人口多数的黑人群体§!的家园。根据该法案，黑人群体获得13%的土地居住权（原法案为7%），但与其庞大人口相比仍然微不足道。\n\n更具破坏性的是，该法案完全禁止§r黑人拥有§!土地所有权，迫使所有非洲人只能沦为白人农场的佃农而非自耕农。这导致大批民众被迫离开祖传家园，流向白人经营的大型农场以及多个新兴工业城市，为§u南非§!蓬勃发展的经济提供廉价劳动力。"
 SAF_neutrality_act: "§g£GFX_SAF_scale_texticon 《1945年中立法案》§!"
 SAF_neutrality_act_desc: "随着§a同盟国§!的崩溃以及§o德国人§!近乎完全的胜利和他们对比方§q殖民地§!的占领，§u南非§!被迫进入一个在崛起的§o德国§!与§m美利坚合众国§!之间保持平衡的新时代，两国都持续对南非施加巨大压力。在围绕王位地位以及§u南非§!未来命运的激烈辩论之后，§A统一党§!与§s国民党§!之间达成了妥协。\n\n§u南非§!的王位将§n保持完整§!，但却§e空悬§!，以此来安抚§O双方§!§X阵营§!，其中一方支持流亡中的§X乔治六世国王§!，另一方则希望彻底废除君主制，声称这是强加在阿非利卡人身上违背他们意愿的又一项枷锁。最终，§b《中立法案》§!确认了§u南非§!在§o日耳曼尼亚§!、§m华盛顿§!和§X东京§!这几个超级大国影响力冲突中的§b绝对中立§!地位，只承诺与各方进行贸易并保持友好关系，同时保持足够的距离以规避§*冷战§!的后果。自此以后，§u南非§!便如同一片风中的叶子，希望在迅速变化的时代面前永远维持其§b中立§!。"
 SAF_electoral_consolidation_act: "§A£GFX_SAF_ballot_texticon 《1946年选举整合法案》§!"
 SAF_electoral_consolidation_act_desc: "该法案整合了多项关于投票行为的旧法律，并永久性地将§u南非§!的投票权正式限定于§Z特定种族§!，§A£GFX_SAF_ballot_texticon 《选举整合法案》§!对于维持§u南非§!不同种族间的隔离以及巩固其少数§d白人精英§!的权力而言，仍然是至关重要的工具。\n\n与以往一样，§u南非§!的§d白人男女§!拥有投票权，但该法律最具争议的部分在于将§n开普合格选举权§!正式化，这允许开普省和纳塔尔省的§有色人种§!在选举中投票。尽管§s国民党§!强烈反对，§j有色人种§!还是被允许为议会投票，但只有§d白人§!才能在议会中任职。§r黑人群体§!则从未被赋予投票权，如今在政治和经济上被永久地边缘化。"
 SAF_fagan_commission_accepted: "§P£GFX_SAF_eye_texticon 通过法根委员会§!"
 SAF_fagan_commission_accepted_desc: "由著名律师§C亨利·艾伦·费根§!领导，§Z土著法律委员会§!于1946年成立，旨在讨论§y原住民§!从乡村向§u南非§!快速扩张的城市迁移的问题。该委员会最终采取了相对§m开明§!的处理方式，大幅放宽人口流入管制，允许§y原住民§!自由迁入城市。§P费根委员会§!提出的另一项建议是在城市地区建立稳定的§y原住民工人§!群体，既为企业提供可靠劳动力，也为零售商扩大消费群体。\n\n§s国民党§!迅速组建了持对立立场的§g索尔委员会§!，该委员会极力主张在全国范围内推行种族隔离。由于§A统一党§!允许§P费根委员会§!方案通过，§g索尔委员会§!的提案最终被否决。"
 SAF_unlawful_organizations_act: "£GFX_SAF_communism_texticon §x《1960年非法组织法案》§!"
 SAF_unlawful_organizations_act_desc: "第一节：\n规定§&泛非主义者大会§!与§x非国大§!可由§a总督§!通过在政府公报上发布公告宣布为§x非法§!组织，且无需通知该组织。规定任何其他被§a总督§!认定为§x非法§!的组织均可被取缔。规定该禁令有效期为十二个月，期满后可每次续延十二个月。规定§a总督§!可通过政府公报解除对某个组织的禁令。\n\n第二节：\n规定1950年§e《镇压共产主义法》§!中的若干条款适用于被宣布为§x非法§!的组织。\n\n第三节：\n规定任何被宣布取缔的组织，其公告须在十四日内或在§u议会§!复会后的十四日内向§u议会§!报告。\n\n第四节：\n规定用“依据1953年《刑法修正案》（1953年第8号法案）第二条所规定之刑罚”替代1956年《防暴集会法》第15条中的“§G有责任§!”一词，该修正案自1960年3月28日起适用。"
 SAF_monetary_reform_act: "§f£GFX_SAF_currency_texticon 《1961年货币改革法案》§!"
 SAF_monetary_reform_act_desc: "在长期使用§u南非镑§!作为货币之后，用§n另一种货币§!取而代之的长期努力终于完成，§f兰特§!将于1961年底之前进入流通。新货币以§W威特沃特斯兰德地区§!，即“白水之脊”命名，那山脊正是§J约翰内斯堡§!的建城之地，也是该国储量最丰的§Y黄金矿藏§!被发现的地方，这些黄金最终为§n南非的伟大发展§!提供了资金。\n\n§O南非§!现已转向十进制的铸币体系，新的§f兰特纸币§!上印有§U扬·范里贝克§!——他于1652年建立了§J开普殖民地§!——的头像，以及采矿作业、城市景观，当然还有§.跳羚§!，即§u南非§!的国兽的图像。"
