 increase_advisor_force_desc: "南非的局势需要进一步的军事干预——对我们来说，扩大我们在当地的人数是明智的。然而，我们有可能会增加公众的不满，和使我们的资源吃紧。"
 initiate_policing_action: "启动执法行动"
 initiate_policing_action_desc: "南非战争的相对非传统的性质使得我们有必要对前线以外的地区进行监督。搜索藏匿的武器、游击队的藏身处、弹药库——并将它们清理掉，我们不能冒着被多个战线包围的风险。"
 increase_policing_action: "增加我们的警备力量"
 increase_policing_action_desc: "游击队的情况已经到了我们现在的部队无法应付的地步——只要有一个村庄，一个弹药库，一个游击队营地就能让我们难以应付。因此，我们应该增加警力，并承担由此带来的所有公共风险。"
