 POLITICS_VILLIERS_GRAAFF_DESC: "继承父亲的开普敦男爵爵位后，德·维利尔斯·赫拉夫发现无论自己是否情愿，都注定要踏入南非政治的角斗场。他从议会下院基层成员起步，凭借不懈努力与坚定承诺，最终在1956年以微弱优势击败雅各布斯·施特劳斯，当选统一党领袖。对赫拉夫而言，自己近乎毫无阻力地迈向总理之位仿佛天命所归——他注定要维系国内外对立势力间的精妙平衡。\n\n自上任以来，赫拉夫始终致力于维持这种平衡术，既守护着南非脆妙的稳定，也支撑着日渐名不副实的统一党。然而过去六年间，他逐渐掌握了如何举重若轻地引领国家走向持续繁荣的诀窍。当政治决策不受远见束缚时，赫拉夫便左右逢源地采取一切必要手段，只为让现状多维持片刻。\n\n但并非所有问题都能靠动听演说与深思熟虑的妥协来解决。被长期压抑的不满情绪正将国家推向暴力解决的边缘——南非从未如此接近全面冲突的危局。布尔派与非国大日益躁动，其激进化趋势正使政府面临与日俱增的威胁。虎视眈眈的德军在边境磨砺爪牙，伺机蚕食刚获得投票权的开普殖民地民众来之不易的自由。德·维利尔斯·赫拉夫总理必须引领国家驶入正确航道，为即将来临的暴风雨未雨绸缪，否则所有苦心经营都可能顷刻崩塌。"
 POLITICS_CONNIE_MULDER_DESC: "康尼·穆尔德是个失意之人。多年来他致力于将国民党推上权力宝座，先是担任市议员，继而成为市长，最终在战争期间出任军官。更重要的是，他是德兰士瓦布尔人中最亲德国的政治家之一，坚决反对美国势力向南非的任何扩张。然而尽管如此，如今他却领导着反抗那些他曾希望执掌政权者的起义。\n\n穆尔德惊恐地目睹着他协助建立的阿非利卡人民邦分崩离析——它既对布勒城的许蒂希政权奴颜婢膝，又持续遭受着原住民对其存在的抵抗，还要面对国民议会中的极端分子。这位前教师清醒地意识到政权难以维系，逐步与统一党政治家建立联系。随后赫尔佐格被推翻，事态比穆尔德想象的更为恶劣。\n\n当脆弱的政府在马兰的政变中垮台时，穆尔德成为唯一同时与布尔忠诚派和统一党政治家保持联系的人物，因此以全票当选复兴后的南非总统。从某种意义上说，穆尔德不过是支持其政府的特殊利益集团的傀儡，这些势力的最终目标是恢复1964年前的宪法。但他也体现了新生南非国家所面临的分裂态势：作为终身种族隔离主义者，他与希望借战争之机彻底废除该制度的统一党残余势力势同水火。"
 POLITICS_TAFFY_WILLIAMS_DESC: "唯有最疯狂之徒，才会主动投身于许蒂希治下那片地狱般的非洲噩梦。塔菲·威廉姆斯正是这样的狂人。\n\n1950年代短暂参与中非战争后，威廉姆斯返回欧洲为女王陛下最忠诚的抵抗组织效力于英国内战，因美国封锁错过了前两次南非战争。但哈里·奥本海默需要忠诚的雇佣兵保护戴比尔斯-英美公司——如今更要支撑其新成立的“共和国”——这注定了这个英国人必将重返撒哈拉以南的战场。\n\n第二次南非战争结束后，威廉姆斯被偷渡至莫桑比克，受命统领“戴比尔斯护卫军”——这个如今与南非军队划等号的组织。在与麦凯恩分队（同样由戴比尔斯-英美公司组建）的协作下，他成功保护公司资产免受党卫军清算，直至许蒂希死讯传来。\n\n依照奥本海默精心部署的计划，威廉姆斯的雇佣兵轻松击溃分崩离析的德国行政体系，建立了名义上的共和国，推举奥本海默担任总统。但显而易见，这个政府不过是企业统治的遮羞布，眼下真正执掌权柄的并非总统，而是塔菲·威廉姆斯。"
 SAF_Jan_Hendrik_Hofmeyr_hog_desc: "§Y副总理\n进步自由主义§!\n--------------\n扬·亨德里克·霍夫迈尔在进步思想中长大，始终是这一理念的狂热拥护者，即便这意味着要与本族同胞的潮流抗争。尽管他的布尔同胞可能已背离统一党，让他陷入孤立无援的境地，霍夫迈尔仍坚守信念，巩固了他在党内左翼的地位。虽然这个角色无论如何都算不上令人羡慕，霍夫迈尔始终主张以温和渐进的方式解决南非内部纷争。\n\n然而与此同时，他仍是和平隔离政策的倡导者，这一信念与他捍卫自由火炬的决心同样坚定。随着北方压力不断向南非逼近，霍夫迈尔将继续推动对非国大采取务实态度——无论这是否符合他布尔同胞的意愿。"
 SAF_Vause_Raw_eco_desc: "§Y经济部长\n家长式保守主义§!\n--------------\n即使南非不再是自治领或英联邦成员，正统的英国保守传统在这片土地上依然具有影响力。\n\n沃斯·罗正是这种使南非分裂的传统的骄傲延续。无论付出何种代价，罗都为维护宝贵的现状牺牲了一切，同时屏蔽着日益高涨的变革呼声。\n\n与帕克特进行贸易时不得不对德国企业虚与委蛇令他痛苦，但沃斯认为这是南非正统体系中正当且必要的一环。无论变革的喧嚣多么刺耳甚至演变成暴力，沃斯都会捂住双耳紧闭双眼，祈祷一切如常。"
 SAF_Jacobus_Strauss_for_desc: "§Y外交部长\n自由保守主义§!\n--------------\n谁在乎银牌？谁记得屈居亚军、获得第二名的人？没有人。雅各布斯·施特劳斯在激烈的党内选举中输给了德·维利尔斯·赫拉夫，未能赢得领导权。作为对施特劳斯支持者的妥协，他被提拔为外交部长。\n\n他的时机已经过去，如今从事着自己厌恶的工作，施特劳斯耐心等待赫拉夫犯下致命错误，以迎来他应得的胜利。在此之前，施特劳斯只能周旋于美国佬和德国佬之间，拼命维系南非这座纸牌屋不致倒塌，以免自己所有的努力付诸东流。"
 SAF_Colin_Eglin_sec_desc: "§Y国防部长\n进步自由主义§!\n--------------\n从士兵到指挥官再到政治家的晋升路径是南非政界的典型特征，而科林·埃格林正是这一历史传统的关键代表人物。作为种族隔离制度和布尔人威权主义倾向最坚定的反对者之一，埃格林始终致力于捍卫他心目中南非的自由与繁荣。\n\n即便在格拉夫和施特劳斯因惧怕得罪德国人而采取怯懦的中立政策、束缚国家发展之时，埃格林仍在既定限制内竭力推动南非军队的现代化与实力强化。作为体制内的改革者，他始终遵循现有规则，却从未停止推动南非走向更好的努力——这份执着将持续至他或他的祖国消亡之日。"
