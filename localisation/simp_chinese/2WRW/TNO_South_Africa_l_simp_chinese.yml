 SAF_Unconventional_Tactics_half: "非常规战术"
 SAF_Unconventional_Tactics_half_desc: "随着战争的持续，我们发现自己处于来自专员辖区和布尔叛乱联合力量日益增长的压力之下。为了对抗这些压力，我们已经制定了大量有力且非常规的策略来对付德国人和布尔人。伏击。叛乱。心理战。在他们的后方作战。我们的敌人每向我们的边界靠近一步，他们就会越发畏惧南非人袖子里的花招。往往当我们的敌人到达常规战线时，他们会发现他们的队伍已经明显减弱了。"
 SAF_Unconventional_Tactics_half_2: "非常规战术"
 SAF_Unconventional_Tactics_half_2_desc: "随着战争的持续，我们发现自己处于来自专员辖区和布尔叛乱联合力量日益增长的压力之下。为了对抗这些压力，我们已经制定了大量有力且非常规的策略来对付德国人和布尔人。伏击。叛乱。心理战。在他们的后方作战。我们的敌人每向我们的边界靠近一步，他们就会越发畏惧南非人袖子里的花招。往往当我们的敌人到达常规战线时，他们会发现他们的队伍已经明显减弱了。"
 SAF_National_Modernization_Plan: "国家现代化计划"
 SAF_National_Modernization_Plan_desc: "1934年统一党就职后，内阁部长们强调必须将我国此前未开发的财富用于本国发展。“国家现代化计划”已将我们富饶土地上开采的每一寸矿产资源输送至OFN和团结协定出口。凭借中立地位，我们获得两大强国最先进的设备技术，使原本以农业为主的产业实现跨越式发展，步入富裕繁荣的新阶段。\n\n我们为工业机械和青年高等教育投入巨额资金，系统化培养整体素质更高的劳动力队伍。虽然南非尚未成为创新中心，但其发展势头始终充满希望。"
