 HDV_SAF.77.t: "忆往昔"
 HDV_SAF.77.desc: "说这一天等了很久，那显然是陈述事实。当你进入这间办公室时，你也知道终有一天会离开它，无论是命运使然，还是事出有因。迪夫在任期间，对将南非建设成一个现代化、先进的国家起到了至关重要的作用，如今这个国家安然处于自由国家组织的安全保护伞之下。当他于1956年上台时，南非正走在正确道路上，但他毫不怀疑，正是他的领导力，才真正推动了国家迈向更美好的未来。他领导国家度过了最艰难的生存危机，并在保卫南非的战争中取得了胜利，但这并未能说服选民，他们决定拿走统一党的多数席位，迫使其组建联盟才能维持权力。\n\n到那时，他明白自己可以坚持下去，继续领导统一党前进，但很明显，他在政坛的时间即将结束，最好还是优雅地退场，将火炬传给下一代。\n\n今天是他担任南非总理的最后一天，他坚持亲自清理办公室，收拾家庭照片、私人笔记和其他零碎物件。从留下的整理有序的文件，到清理角落的垃圾桶，迪夫在背景中收音机讨论当天事件的低语声中，从独自完成这一切中找到了些许慰藉。他所有的个人物品都放进了一个箱子，放在了门边。他停顿了片刻，重新考虑自己的决定。统一党败了，但并非决定性的失败，而他离开的决定是他自己做出的。他本可以扭转局面，留在这里，通过向全国发表慷慨激昂的演讲，为自己的政治前途而战。\n\n但他深知一件事：历史不会善待那些逾期不退的人，留下来无论如何是件相当冒险的事。他会想念总理职位赋予他的权力、影响力和声望，但这是最好的选择。"
 HDV_SAF.77.a: "他心情沉重地关上了身后的门。"
