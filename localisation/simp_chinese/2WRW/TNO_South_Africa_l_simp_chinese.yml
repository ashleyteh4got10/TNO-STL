 SAF_south_africas_situation: "南非局势"
 SAF_south_africas_situation_desc: "南非正逐渐陷入混乱。内乱与政治僵局无处不在，社会本身正慢慢分裂成相互敌对的派系，每个派系都试图掌控国家：我们身为君主制国家却没有国王，这一事实本身就表明了我们的优柔寡断有多深。无论我们如何努力弥合裂痕，每搭建一寸桥梁，都会立即被那些只想从我们苦难中获利的人摧毁。\n\n南非正处于彻底崩溃的边缘，唯有奇迹才能让它保持完整。然而在这黑暗时代，仍有勇气怀抱希望的人已寥寥无几……"
 SAF_the_issues_we_face: "我们面对的问题"
 SAF_the_issues_we_face_desc: "我们的国家四分五裂。正如德国人常说的那样，这里存在一个“种族问题”：白人，无论是英裔还是布尔人，在人数上都远远少于当地人，但当地人几乎完全被剥夺了政治权利。尽管我国政府最近努力改善他们的地位，但当地人仍然生活在贫困中，甚至得不到基本的保障。\n\n然而，我们的改革引起了一些人的不满，这一次是在白人社区：布尔人，第一批荷兰殖民者的后代，他们对种族隔离的信条深信不疑，认为我们所做的一切只会给“有色人种”反抗他们主人的机会。\n\n这让我们看到了另一个最紧迫的问题：德国人正在向国民党输送支持。三个非洲专员声称他们这样做是为了“保护有荷兰血统的雅利安同胞不受反叛奴隶的伤害，并在他们的南部边界上建立和平关系”，但每个人都知道布尔人是他们把南非划为殖民地的理想工具……\n\n无论如何，南非都会坚持下去。我们必须坚持下去！"
 SAF_the_monarchy_debate: "君主制争论"
 SAF_the_monarchy_debate_desc: "白人社区中最具分歧的问题实际上是君主制和共和制之间的争论。这个看似仅仅关乎政治的问题，其实隐藏着一个更深层次的分歧，它像一个被忽视的、溃烂的伤口，横贯全国：一方面，我们希望在时代变迁中团结国家，依靠君主制弥合分歧，用我们传统的力量找到共同的目的。\n\n另一方面，国民党企图把我们美丽的土地颠覆成一个糟糕的复制版德国，一个数百万人生活在贫困和恐惧之中的种族隔离的社会，他们需要的是一个共和的政体：他们知道自己在白人中占多数，所以他们能够强行通过所谓的“改革”来实现颠覆。布尔人难道看不出他们的错误吗？难道他们看不到德国正在崩溃，因为他们做的正是赫尔佐格试图做的事吗？我们不可能是这个大陆上唯一还有理智的人！"
 SAF_the_african_national_congress: "非洲人国民大会"
 SAF_the_african_national_congress_desc: "非国大和他们更激进的兄弟泛非大会可能是对我们的稳定最大的长期威胁。虽然布尔人目前更加危险，但随着我国越来越不稳定，这支泛非先锋队正慢慢巩固力量。尽管我们实行了仁慈的统治，但许多非洲人仍然抱怨说，社会在很大程度上仍然是种族隔离的：军队、公务员、政治甚至经济都由少数白人主导。对他们来说，不管英裔还是布尔人都是敌人，因为我们对他们来说都是白皮猪。\n\n每天都有越来越多的人加入这个组织。如果我们不能以行动赢得他们的信任，非国大肯定会尝试用武力来为他们的人民争取真正的自由。"
 SAF_schedule_a_referendum: "安排全民公投"
 SAF_schedule_a_referendum_desc: "尽管我们试图把由国民党支持的、关于君主制的全民公决扼杀在摇篮里，反对党还是采用各种手段来阻挠议程，来迫使我们采取行动。在僵持了一个星期之后，人们开始走上街头抗议，我们屈服了，接受了他们的提议，以换取稳定。\n\n我们不应该那样做的。现在，激进分子造成的混乱比以前更加严重，我们的手被自己的决定束缚：我们跟着他们跳着不和谐的舞蹈，但这是我们自己选择的乐谱。在过去的几个月里，我们想尽一切办法来推迟投票，但是国民党像以前一样威胁我们，如果我们拒绝协商，这就将是南非棺材上的最后一颗钉子。我们不得不安排公投，而我们只能祈祷我们能赢……"
 SAF_referendum_decisions_tt: "§Y我们会解锁关于全民公决和对立派别的民众支持度的决议。§!"
 SAF_a_plan_for_the_future: "未来规划"
 SAF_a_plan_for_the_future_desc: "南非的未来风雨飘摇，我们需要制定计划，这样情况才不会变得更糟。黑人占人口多数的问题尤为紧迫，但它也可能成为一个机会：如果我们能够通过实施全面改革，提醒他们真正的敌人是国民党，来争取黑人的支持，我们就可以和黑人组建统一战线，共同对抗布尔人和他们的德国支持者，以压倒性的优势赢得公投。\n\n然而，并非所有人都赞成这一提议。甚至在我国政府内部，也有人坚持，要以“开化政府”的名义与国民党和解，以对抗土著的威胁；从他们的观点来看，赢得阿非利卡人选票的最好办法就是镇压反叛的黑人，然后加强警察力量，维持秩序。\n\n没有时间再耽搁了：我们现在需要作出选择。"
 SAF_maintain_the_status_quo: "维持现状"
 SAF_maintain_the_status_quo_desc: "最后，稳定的最大威胁来自叛逆的土著。因此，我们应做出最大的努力，确保非国大不会变得更加强大，并保持现状。有教养的和受过教育的人将为了所有人的利益而继续统治南非，这将有希望让布尔人转而支持我们的政府：毕竟，当现任政府能够同样保护我们的生活，为什么要把我们的国家交给德国人？"
 SAF_further_investigate_the_anc: "进一步调查非国大"
 SAF_further_investigate_the_anc_desc: "非洲人国民大会拥有广泛的联络网、成员和安全屋，他们计划利用这些联络网从内部引爆南非。我们承担不了在面对一个强劲的敌人的同时怀里还藏着一条蛇：我们责令国家安全局对非国大成员进行进一步的调查，试图发现他们的领导人是谁以及他们躲在哪里，在知道他们的位置后我们将用铁拳打击他们。我们希望这样的措施能够压制非国大，并切断非国大的资金和人员的来源以阻止他们造成太大的伤害。"
 SAF_restrict_their_protests: "限制他们的游行示威"
 SAF_restrict_their_protests_desc: "不出所料，激进分子把非洲人推上街头，公开反对我们的统治。不过，稍有常识的人都会看出，如果我们的警察继续前进，这些螳臂当车的歹徒，难道能够阻挡得了吗？当然，必须要保持最大限度的克制。我们不像德国人那样崇尚压迫，但即使是我们的政府也明白秩序的价值高于混乱，我们不会允许躁动的土著将我们已经摇摇欲坠的国家进一步推向内战。\n\n即日起禁止10名以上的黑人进行集会，违者一律要交罚款或者送到矿井劳作半年！立即生效！"
 SAF_who_is_leading_them: "谁在领导他们？"
 SAF_who_is_leading_them_desc: "我们首先要考虑的应该是除掉抗议活动的领导人。绝大多数非洲人懒惰、无组织，如果没有一小撮受过教育的激进分子的领导，他们就无法推进自己的动乱计划：如果我们成功地逮捕了非国大的最高头目，像坦博和曼德拉这样的恐怖分子，剩下的人就会像根被切断的植物一样慢慢枯萎。\n\n我们应该立即开始进行监视，增加特工和线人的数量，在我们防御等级最高的监狱里开辟更多的房间，这样我们就可以在适合的时候发动袭击，把他们所有的叛乱分子一网打尽，重拳出击！"
 SAF_who_is_funding_them: "谁在资助他们？"
 SAF_who_is_funding_them_desc: "我们的初步调查显示，非国大拥有令人惊讶的资金数额，我们认为它们可能比我们想象的更有组织和丰富的物资。南非的绝大多数黑人都很穷，只有少数富人肯定付不起这么多钱，但是有一个开始：逮捕一两个纳税申报表上有漏洞的黑人商人，并用适当的手段询问他们，可能会让我们有所进展。\n\n不过，这只是一个开始：谁给非国大这么多钱？德国人是主要的嫌疑犯，即使资助黑人抵抗运动，但也会在我们倒台几秒后就攻击他们，他们不会抗拒削弱一个孤独堡垒的机会，使他们无法为他们的元首夺取整个大陆。\n\n就像那句老话：向钱看齐……"
 SAF_who_is_supporting_them: "谁在支持他们？"
 SAF_who_is_supporting_them_desc: "仅仅调查他们的资金来源是不够的。当然，在组织外部，有人愿意给他们提供信息和保护，这可能比单纯的金钱更糟糕。\n\n虽然需要时间才能得到一个清晰的观点，但是许多调查人员指出，还有谁会从强大的非国大获得支持？只有国民党，它需要向人民证明，种族隔离是维持秩序的必要条件。\n\n我们应该集中精力揭露那些帮助非国大的布尔人，向全国人民展示他们对南非的罪行，他们宁愿毁掉我们的国家，也不让我们赢得即将到来的全民公决。"
 SAF_crack_down_on_their_publications: "销毁他们的出版物"
 SAF_crack_down_on_their_publications_desc: "众所周知，非洲人国民大会有自己的宣传机器，包括合法的报社和暗中流通的报纸。当然，前者将非国大描绘成一股和平力量，愿意与白人一起为南非的发展而努力，而后者则鼓励黑人加入他们组织的武装力量，将所有当地黑人永久的从白人的暴政下解放出来。\n\n很明显，这两种宣传都是危险的，因为这是一种狡猾的宣传方式，在政府的面前隐藏他们的本性，但在我们的身后密谋在适当的时候发动攻击！很快，所有黑人经营的报社都将受到新成立的“审查委员会”的审查，我们的调查人员将发现并销毁所有秘密出版物。这将阻止非国大发展新成员……"
 SAF_broadcast_anti_anc_propaganda: "散布反非国大宣传"
 SAF_broadcast_anti_anc_propaganda_desc: "俗话说以其人之道还治其人之身，我们要建立自己的宣传机构！我们的报社和广播站将对非国大进行舆论攻击，将他们的领导人描绘成一个无情的革命者，他不在乎滥杀无辜，牺牲人民来实现他们那所谓独立，但实际上只是听命于另一个主人。\n\n我们要把白人团结起来，反抗来自黑人的威胁，使土著恐惧、蔑视自己的同类。有人说，我们的所作所为是在践行戈培尔的意志，但与德国人不同，我们是在保护自由，而不是毁掉自由！"
 SAF_radicalize_the_anc: "刺激非国大"
 SAF_radicalize_the_anc_desc: "为了保护南非免受动荡之害，我们必须时刻做好战斗准备。随着紧张局势上升到闻所未闻的程度，以及几个没有责任感的激进分子将我国的大多数非洲人推向暴力立场，迫使我们要比预期更早地捍卫我们的国家。如果情况变得更糟，我们不能指望警察维持秩序，因此，在应对武装有色人种分子袭击时，南非国防军必须全副武装，动员起来，随时准备上街镇压叛匪。\n\n我们将向布尔人证明，我们不需要像国民阵线那样以背叛我们的国家为代价来维持秩序……"
 SAF_army_on_high_alert: "高度警戒的军队"
 SAF_army_on_high_alert_desc: "随着那些企图从内部分裂我们自治领的人愈发胆大妄为，我们必须开始认识到我们治安部队的局限性。局势一天比一天紧张，他们需要努力应对当前降临的致命挑战。\n\n我们必须承认，我们的治安部队很快就无法面对当前形势的压力。我们的军队必须处于高度戒备状态，随时准备部署到国内，以维持秩序。这不是军队的工作，普通的士兵也没有经过适当的训练来胜任警察的工作，但很快，我们就会别无选择。"
 SAF_reinforce_the_police: "加强警力"
 SAF_reinforce_the_police_desc: "当我们的警察只带着警棍和手枪，而我们的对手使用步枪和炸弹时，如何才能维持秩序和稳定？我们不能总是派军队来解决：如果我们想要保证社会秩序长治久安，就必须以适当的武器装备警察，以适当的武力维持秩序。如果必要的话，可以使用致命武器。\n\n装备防御性能较好的车辆和军用级武器，如冲锋枪和震撼弹，应该让我们的警察部队具有优势，他们需要战胜非国大的恐怖分子：让我们看看他们是否愚蠢到企图全面起义！"
 SAF_specialized_riot_training: "专业镇暴训练"
 SAF_specialized_riot_training_desc: "虽然我们的警察现在装备精良，可以处理武装分子，但还有一个紧迫的问题。由于我们不能向手无寸铁的示威者开火，我们需要制定策略，以应对任何可能出现的情况，预防抗议发展为起义。\n\n消防车和催泪瓦斯等驱赶人群的设备，以及使用专门的防暴训练，应能确保我们能够驱散人群甚至是大规模的示威，而不致使示威变成一场大屠杀，因为大屠杀只会进一步削弱我们的影响力。"
 SAF_the_anc_pacified: "平定非国大"
 SAF_the_anc_pacified_desc: "最后，我们最近的报告比以前的报告的情况要好得多。非国大似乎失去了很多黑人的支持，布尔人似乎——至少对我们的措施感到满意。由于警力的扩充和装备的改进，所有非国大的抗议活动都被镇压下去了，街道现在对每个人来说都是安全的。\n\n尽管对我们国家来说最紧迫的事情——公投，在隐隐约约的来临，但毫无疑问，我们的改革确保了我们政府的稳定和民众支持率的提高。"
 SAF_talk_with_the_anc: "与非国大对话"
 SAF_talk_with_the_anc_desc: "经过长时间的斟酌，我们认识到，南非最大的敌人是国民党，他们计划在外交和政治上把南非变成德国的卫星国。他们和他们的种族隔离观点在我国是没有立足之地的！\n\n当然，我们在未来的斗争中需要盟友，而非国大是最好的选择；毕竟，如果南非在布尔人和德国人的统治下，他们将是最先遭受打击的。如果我们设法说服他们与我们合作，以换取全面的改革，我们肯定会争取他们的援助，来对付那些想要把我们变成他们奴隶的人，并大大缓解国内的紧张局势。为此，我们需要立即与非国大展开谈判。"
 SAF_sit_down_with_tambo: "和坦博座谈"
 SAF_sit_down_with_tambo_desc: "奥利弗·坦博是非国大突出的成员之一，他坚信和平的自由之路。他提出的让占多数人口的黑人完全融入南非国家的建议虽然是温和的，我们的政治体制足够接受，但仍然是激进的，足以激励他的追随者。\n\n我们的官员将与他接触，听取他提出的改革建议，我们将把他当作非国大事实上的领导人来对待，并帮助他，为他的改革方案争取更多的支持。"
 SAF_support_moderate_anc_elements: "支持非国大温和派"
 SAF_support_moderate_anc_elements_desc: "非国大的温和派和极端派之间分歧很大，温和派获胜对我们更加有利。为此，我们将支持奥利弗·坦博和纳尔逊·曼德拉这样的人，他们愿意与非国大内的激进派别进行谈判，为此我们将对他们提供一些帮助：秘密资金和一些与极端派丑闻应该足以帮助他们，而不会让极端派发现我们在支持温和派。\n\n在其他方面，我们将把宣传工作的重点放在合作和改革上，特别是针对社会中更富有凝聚力的成员，如有色人种社区和印度人社区，他们比一些黑人社区更愿意坐下来谈判。如果有足够的时间，我们将看到，稳健的理智终将战胜无脑的极端：在那之后，我们可以进行进一步的合作。"
 SAF_rally_their_support: "争取人们的支持"
 SAF_rally_their_support_desc: "随着非国大开始转变，温和派成员越来越多，我们可以开始适当的宣传，以争取他们的支持。我们内阁成员将开始与非国大领导人正式会面，讨论可能的改革途径，我们的报纸和广播节目将强调合作对抗德国威胁的重要性，特别是在即将举行的公民投票中。\n\n中立的时代已经过去：无论有没有国民党，我们都将看到我们的国家迈向更美好的未来。南非人民！现在是不分白人和黑人的时候了！团结起来！对付我们真正的敌人！我们将自由地生活在一起，并击败那些真正压迫你们所有人的人！"
 SAF_release_political_prisoners: "释放政治犯"
 SAF_release_political_prisoners_desc: "我们的拘留所里关满了非国大成员，他们是在宣传或破坏白人工业家的工厂时被捕的。除了犯了严重罪行如谋杀的人外，我们将赦免所有属于非国大的政治犯，以示对未来的善意。\n\n当然，这一举动会让我们付出很大的代价，也会招致保守派人士的批评，甚至包括英裔社区。因此我们期望非国大的领导者会以同样的方式回报我们，并在即将到来的风暴面前给予我们更多的帮助。"
 SAF_weaken_their_radicals: "削弱激进分子"
 SAF_weaken_their_radicals_desc: "尽管非国大的温和派已经在组织内部占了上风，但是像泛非大这样的极端分子仍然试图聚集追随者并重新取得控制权。我们不能让他们破坏我们正携手共建的东西：我们需要一种新的方法，更多的……比以前更直接。从现在开始，我们所有的媒体都将公开表达政府对与非洲人国民大会合作的支持，以及我们打算批准但仍未确定的“改革”，以改善所有南非人的生活，无论他们是白人还是黑人。\n\n最终的信息将会是明确的：温和保证了改革，极端主义只会给每个人带来死亡和痛苦。此外，我们将把非国大中的激进分子至善描绘成布尔人不甘的走卒，至差把他们描绘成德国的秘密特工，进一步破坏他们在民众面前的形象。"
 SAF_agree_to_limited_reforms: "变革之风"
 SAF_agree_to_limited_reforms_desc: "现在是我们正式同非洲人国民大会组成政治联盟的时候了，为了南非的未来，我们将在内阁和非国大领导层之间达成一项共同声明。那些嚷嚷着种族隔离乃至鼓吹什么“班图斯坦”的人都将会发现他们的主张将被彻底的否决。为了表示我们的改革决心，我们将在未来数周内立法通过一系列的改革。\n\n就算这份联合声明的最终版本比非国大给我们的第一版保守的多得多，这仍然会点燃骚动，看来我们不可能和白人选民中的右翼达成妥协了。这些反对派肯定要试着去否决这一联合声明，但是总理阁下将宣布使用紧急立法权来让这些重大改革变成事实。\n\n正如罗马人的老话一样，“骰子已被掷下”。"
 SAF_ban_extremist_armed_organizations: "取缔激进武装团体"
 SAF_ban_extremist_armed_organizations_desc: "既然我们已经完全注重于改革，我们就需要开始削弱我们的潜在对手。众所周知，布尔人已经组成了几个准军事组织，有时甚至在来自中非的雇佣兵的帮助下，他们光明正大地在道路和农场间巡逻，美其名曰“保护他们的家园免受恐怖袭击”，但我们知道，正是他们在进行恐怖袭击，他们殴打甚至杀害那些反对种族隔离的人，将反对者践踏在铁蹄之下，胆寒于他们的血腥报复。\n\n虽然过去我们可能因为自己的软弱而容忍了这一点，但平衡已经发生了变化，现在报应来了。很快，所有武装组织都将被解散，民间的枪支持有权仅限于手枪。当然，我们知道他们永远不会上缴他们私藏起来的武器，但这至少会给我们一个正当的借口，让我们派出警察去打击他们的武装民兵。"
 SAF_africans_in_the_civil_service: "非洲裔公务员"
 SAF_africans_in_the_civil_service_desc: "作为我们向非国大承诺的改革的一部分，公务员制度将向所有人全面开放，消除任何限制或歧视。为了表示善意，我们将从非国大较为知名的成员中挑选几名担任政府职位，以便他们能与我们的内阁更加密切地合作。此举必将向所有非洲人表明，我们信守诺言，我们政府的支持率将在当地社区中飙升。\n\n我们还将启动一项计划，将这些新来者与经验丰富的白人公务员结成对子，这不仅会加快他们熟悉业务的速度，而且还将弥合我们的种族分歧。"
 SAF_African_Rifles_Regiment: "非洲步枪团"
 SAF_African_Rifles_Regiment_desc: "越来越清楚的是，布尔人正在策划比纯粹的政治颠覆更加糟糕的事情。我们需要所有可以指望的能人来应对即将到来的风暴，现在是非洲人为捍卫自己获得不久的自由尽自己一份力量的时候了：目前，南非国防军采取完全种族隔离政策，黑人被禁止进入指挥决策机构，但这将会改变。\n\n很快，所有武装部队将完全开放，不分种族，严格禁止歧视，并且我们还将组建和装备第一个全黑人步兵师——皇家非洲步兵团。当然，我们期望非洲人会踊跃参军：他们肯定不希望我们的政府被一些对奴隶制和集中营有强烈偏好的人推翻……"
 SAF_rights_for_tribal_lands: "部落的土地权利"
 SAF_rights_for_tribal_lands_desc: "南非土著大多数人并不像许多人所想的那样是一个整体，在他们当中有许多部落民族，如贝专纳兰和祖鲁兰，每一个都遵循自己的传统，生活在自己的祖传土地上。\n\n我们将与当地部落酋长签署条约，正式授予他们在部落领土内的自治权，并承诺永远不会侵犯他们的土地，以换取他们的忠诚，他们还会在南非发生任何事情时承诺支持我们，我们也会承诺提供支持，我们设法召集的部落酋长聚集到南非，以确保大多数非洲部落支持联合党，确定其在全国第一次普选中的地位。"
 SAF_deracialize_education: "教育去种族化"
 SAF_deracialize_education_desc: "黑人儿童早已习惯于在侮辱和对他们社会地位的践踏之下学习：他们和白人同龄人就读不同的学校，被禁止接受高等教育，甚至被禁止说自己民族的语言，而白人则被给予一切优先权。甚至教科书也坚持教导说，白人是优越的。大多数课程，从历史到科学，都不厌其烦地重复着“种族理论”。\n\n当然，这需要改变。学校制度将得到全面改革：确保所有人不受因种族差异而遭到不公平待遇，所有关于种族和种族隔离的内容将从课程中删除，祖鲁语和科萨语等非洲土著语言将与英语，南非语在一个学校内使用，任何不同意改革的教师或学校职员将立即被解雇。\n\n大人，时代变了，最好的开始就是教育孩子们我们都是平等的。没有黑人或白人之分，只有南非人。"
 SAF_the_tensions_calmed: "人人有票投"
 SAF_the_tensions_calmed_desc: "就这样。我们迄今为止所采取的最大胆的行动——可能改变我国历史进程的行动。通过给予南非所有公民平等的投票权，不考虑其种族，每个人的权利将会是永远的平等。我们知道，我们正在使自己变成国内政党的一个少数派，实际上我们放弃了政治的统治地位，但我们相信，非国大将继续履行协议。\n\n更重要的是，这将给我们赢得公投所需的武器。我们不再需要为阿非利卡人的几千张选票而讨好他们：现在我们没有几百，也没有几千，而是数以百万计的新选民，他们肯定会投我们的赞成票。我们赢得了这场战斗，但在下一场战斗中，我们希望还能站在一起……"
 SAF_maintaining_our_neutrality: "保持中立"
 SAF_maintaining_our_neutrality_desc: "南非小心翼翼地打出自己的牌，并拒绝承认伊丽莎白或爱德华为合法的君主，从而从德国的霸权中拯救了自己。战后，虽然我们从未加入过OFN，但作为盟军的一员，我们理所当然与美国保持着密切的关系，但我们至少有必要与来自团结协定的北方邻居保持一个友好的关系。\n\n随着旧秩序开始瓦解，我们现在比以往任何时候都更需要保持中立，否则就有可能被卷入一场我们没有生存希望的冲突。我们的外交努力将集中于向各方作出保证，保持南非作为中立国家的地位，不会参与对任何世界大国的任何敌对行动。我们只能希望这能拯救我们……"
 SAF_reassure_the_americans: "让美国人放心……"
 SAF_reassure_the_americans_desc: "美国是我们最亲密的贸易伙伴，自上次战争以来一直对我们采取保护的态度。当然，他们担心公投，担心我国国内不稳定的局势加剧，但我们需要让他们放心，一切都在控制之中。尽管我们多次拒绝了他们对我们提出的加入OFN的提议，但这并不意味着我们不能成为民主国家的朋友。\n\n一个贸易代表团即将启程前往华盛顿，他们将一如既往地向美国人致意并承诺：南非是一个长期的自由民主国家。我们向尼克松先生保证，整个大陆不会落入德国人的手中。"
 SAF_and_the_germans: "……也让德国人放心"
 SAF_and_the_germans_desc: "为了与德国保持友好关系，我们很早就同意关照他们的“雅利安同胞”，即荷兰殖民者的后裔布尔人。虽然这可能在不久的将来会发生变化，因为布尔社区越来越不忠诚，但这并不意味着我们对德国或其在非洲的财产怀有敌意。\n\n为了巩固我们的中立地位，我们将派代表团访问日耳曼尼亚和非洲各专员辖区，以期确保他们不侵略我们。德国人现在在做什么总是很难理解：他们的政治局势正在不断恶化，恶化得就好像存在着好几个国家，每个都有自己的计划方案，而且他们中的任何一个都能让其军队南下。这很令人担忧……"
 SAF_rebuff_their_diplomats: "回绝他们的外交官"
 SAF_rebuff_their_diplomats_desc: "不出所料，美国和德国都试图让我们加入他们的联盟。随着旧秩序的崩溃，他们正试图增强自己以应对即将到来的风暴，并寻求一切可能的帮助。可以预见的是，我们的特使执行完任务回来，还带来了一卡车的提议、建议、帮助的承诺和微妙的威胁，以确保我们会选择其中一个而不是另外一个。\n\n当然，我们不会加入任何的联盟。我们的中立性对于我们的生存至关重要，因为我们内部过于分裂，无法与外部敌人进行任何战斗：因此，我们将礼貌地拒绝他们的所有提议、建议、帮助的承诺和所有的各种形式的威胁，并提醒他们我们向所有人敞开大门的政策。此外，如果有任何大国试图过多地干涉我国内政，我们将被迫寻求其他国家的援助……"
 SAF_fortify_just_in_case: "修筑堡垒，以防万一"
 SAF_fortify_just_in_case_desc: "我们清楚地看到，世界正处于另一场重大危机的边缘，我们的中立可能对我们没有什么帮助，就像比利时和荷兰在上次战争中所做的那样。也许我们应该做更多的事情来确保我们有机会生存下来，以防德国人南下入侵。\n\n南非国防军最高司令部向我们提出了一项保护我们自己与围绕的凶猛狼群对抗的计划：我们将在北部边境筑起一圈防御工事，并在开普敦周围加固防御圈，在那里我们将背对大海进行最后的抵抗。有人质疑我们的担忧毫无根据，认为该计划只会浪费钱财，但如果装甲部队的履带开始转动，它可以拯救我们的国家。"
 SAF_for_south_africa: "为了南非"
 SAF_for_south_africa_desc: "随着我们的内部问题得到解决，或至少暂时得到控制，我们可以开始处理来自我国内外更紧迫的担忧。为了我们国家的利益还有很多事情要做，而我们终于有办法做到了！\n\n迈向未来！为了南非！"
 SAF_declare_martial_laws: "宣布戒严"
 SAF_declare_martial_laws_desc: "刻不容缓，我们必须立即宣布全面戒严，暂停目前深陷内战威胁的平民正常生活。关于国民党及其OBW密谋者的更多秘密阴谋的传闻已经传开。为了捍卫我们的自由，我们必须为国家安全，不，国家生存的缘故，暂停其中的一些自由。\n\n与此同时，联合党将公开承诺，一旦战争胜利，将恢复这些权利和自由。戒严是一件丑陋的事情，但这是确保光明继续照亮开普地区值得付出的代价。"
 SAF_ofn_care_packages: "OFN救济物资包"
 SAF_ofn_care_packages_desc: "我们与自由国家组织的友谊向来保持距离，但一直很友好。尽管我们保持中立，但我们暗地里与华盛顿的结盟将在这次危机中派上用场，我们将立即请求援助。与日耳曼尼亚的所有联系都已中断，现在以及永远，我们将迅速加入自由国家组织，在对抗国家社会主义的共同斗争中团结一致！\n\n我们已经收到消息，美国人正迅速开辟一条通往开普敦的空中桥梁，运送最关键的军用物资，自由国家组织的其他成员也已承诺通过救济物资包提供支持。我们需要坚持下去，因为更多的帮助正在赶来，只是需要时间到达这里。"
 SAF_call_in_the_conscripts: "召集征召兵"
 SAF_call_in_the_conscripts_desc: "在征召战争所需的士兵、召回退役老兵以及联系退役指挥官以迅速扩建军队时，绝不能有所保留。对士兵的所有限制都将取消，所有此前未能达标的人现在都将被征召，全国训练营将立即开始运作。他们中的许多人只有时间学习基础知识，然后不幸地将不得不在战争中学习如何战斗。"
 SAF_emergency_defenses: "紧急防御"
 SAF_emergency_defenses_desc: "我们必须不惜一切代价阻止人民邦的推进。民用建筑业将迅速暂停所有民用工程，转而全力在全国范围内修建仓促组建的防线。甚至士兵们也不得不拿起铁锹挖掘战壕。\n\n诚然，这些紧急防御工事无法抵挡全面进攻，但眼下最重要的是为其他一切准备就绪争取时间。战争的关键不仅是土地，时间本身也至关重要，我们将尽最大可能拖延敌军的猛攻。未来，我们将扭转局势。"
 SAF_emergency_defenses_tt: "将在§W伊丽莎白港§!、§W东伦敦§!、§W纽卡斯尔§!、§W德班§!以及§W开普敦§!周边省份建造§Y堡垒§!。"
 SAF_bomb_shelters: "防空洞"
 SAF_bomb_shelters_desc: "我们必须尽一切努力保卫我们的人民，保卫我们的妇女儿童免受这场可怕而不义的战争侵害。在每座城市、每个城镇，都应制定应急措施来修建防空洞、改造地下室和囤积物资，以便人们在危险来临时能安全躲避。地方政府将负责组织当地的安全场所，同时全国范围的宣传册将帮助人们为战争降临城市时做好准备。"
 SAF_seize_german_assets: "没收德裔资产"
 SAF_seize_german_assets_desc: "他们真以为能那样轻易征服我们吗？德国人在战前曾在南非投资，如今在美国人的全面支持和安全保障下，南非境内的所有德国资产都将被强制没收。这不仅能让国家获得短期利益，还将为我们的战时经济注入一剂强心针。这至少引出一个耐人寻味的问题：德国人为什么先在南非投资，后来又试图用武力夺取它？\n\n或许德国的非洲专员辖区未经日耳曼尼亚的监督就策划了这一切。至于资产本身，它们将被拍卖给合适的竞标者、保皇派商人以及在战争中站在南非一边的投资者，也许我们新结识的美国朋友也会有兴趣参与竞标。"
 SAF_our_nation_in_flames: "战火中的祖国"
 SAF_our_valiant_people: "英勇的人民"
 SAF_our_valiant_people_desc: "众所周知，南非联邦内部分裂严重，不仅有不同民族间的矛盾，甚至城乡之间也如此。但一个普遍的真理是，面对如此巨大的危险，如此巨大的邪恶，即威胁所有人的自由的德国入侵，人民将团结起来。现在是时候号召我们的人民武装起来，赞扬他们的英勇奋斗，并在最黑暗的日子里激发他们最好的一面。\n\n人民将团结在旗帜周围，进步派、保守派、白人、有色人种和土著都将肩并肩地对抗来自北方的可憎侵略者。当战火在外面肆虐时，战争的负担和斗争由所有南非人分担，而我们英勇的人民必将胜利凯旋。"
 SAF_defectors_saboteurs: "破坏者"
 SAF_defectors_saboteurs_desc: "在战争中，对当地情况的了解是一种无可辩驳的优势。知道哪条路安全，哪条路危险。了解敌人用来对善良的南非人民发动战争的工厂和设施的里里外外。弹药库、军事基地、补给站的位置等等，这些情报在战争中的作用丝毫不亚于派兵作战。\n\n因为战斗实际上在前线、战线中部和后方同时进行。那些背弃人民邦及其德国傀儡主子丑恶谎言的人，可以被派回敌后造成尽可能大的破坏。当他们的补给线遭到破坏和中断时，他们终将在来自四面八方的压力下崩溃，这将帮助我们取得胜利。"
 SAF_our_nation_in_flames_desc: "南非，我们的土地，如今已陷入战火的地狱。我们面临众多敌人，尤其是那些来自国界之外以及内部的敌人。牛车哨兵发动了政变，国民党大部分成员参与其中，而威特沃特斯兰德和德兰士瓦已落入侵略者之手。南非的所有财富、人民和资源都必须动员起来，进行一场伟大而正义的战争，保卫我们的国家，收复我们的土地，捍卫我们的联邦，反抗那些企图将其征服给德国人的势力。我们再也不能坐视这些可怕的事情发生。\n\n让我们迎接挑战，不因恐惧而退缩。我们现在唯一的选择就是为我们的生命和土地而战。为了南非！"
 SAF_cooperate_with_american_companies: "与美国公司合作"
 SAF_cooperate_with_american_companies_desc: "美国是一个超级大国，不仅得益于他们的战争艺术，也得益于他们的贸易财富。有了他们的优势，我们的国家不仅可以在和平中受益，而且可以在战争中受益。\n\n我们要让它们的公司和财团相信，它们在南非有很多渠道可以赚钱，而它们获取我们巨大的自然资源的唯一途径就是把德国人赶出这个大陆。我们应该向这些美国人表明，我们愿意与他们合作。\n\n如果我们成功了，那么他们强大的经济力量就能帮助我们继续与纳粹作战！"
 SAF_purchase_american_guns: "购买美国武器"
 SAF_purchase_american_guns_desc: "我们新生的军火工业也许能够满足一次打击叛乱的小部队的需求，但它没有足够的能力生产出我们驻扎在战场上的部队，这些部队是抵抗德国人入侵的重要力量，幸运的是，我们可以依靠我们的美国盟友来解决这个问题：\n\n我们可以加入五角大楼的对外装备销售计划，成千上万的美国制造的M-16突击步枪可以立即交付给我们，从他们的集装箱直接送到我们的士兵手中，而我们只有在战争结束后才会开始为他们付款。"
 SAF_request_additional_troops: "请求增派部队"
 SAF_request_additional_troops_desc: "美国的第一波支持和美军部队的到达使我们的国家免于毁灭，但这还不足以结束战争，现在战争变成了该死的僵局，持续的时间越长，我们的流血就越多。现在，我们迫切需要一些东西来打破这种该死的平衡，因为我们自己的人每天都有越来越多的人员伤亡。\n\n刚刚抵达的美军部队将被部署到前线，这将是我们重新整顿部队并开始进攻的前置条件，进攻只有在我们占领利奥波德维尔的时候才会停止！"
 SAF_american_army_training: "美式陆军训练"
 SAF_american_army_training_desc: "我们的联邦国防军沿袭英式作战体系，特别注重堑壕工事、防线布置、部队纪律以及严格的指挥结构。这种战术若放在半个世纪前的弗兰德斯战场或许奏效，但倘若我们仍沿用索姆河战役的作战方式，绝无可能击败采用大胆闪电战战术的现代化机动德军。\n\n来自西点军校的美军教官将向我们的军官传授现代战争要领：诸兵种协同战术、机动战、近距空中支援以及现代化指挥控制体系。我们越早将这些指导投入实战，就能越早赢得这场战争。"
 SAF_air_and_naval_support: "空中与海上支援"
 SAF_air_and_naval_support_desc: "我们的国防军正在与盘踞非洲土地上的德国臭虫作斗争，但如果我们不能保持天空没有敌机，如果我们不能保证我国周围水域的安全，我们就无法有效地进行斗争。\n\n让我们充分利用我们的盟国在空中和海上的力量，用他们的战斗机拦截德国的轰炸机，用他们的海军舰艇打击非洲之盾的贸易路线，用他们的直升机撤离我们的伤员，并使用B-52轰炸机让远在利奥波德维尔的敌人都惧怕我们。在美国的战争机器的帮助下，我们的小伙子们可以更有效地打击德国侵略者。"
 SAF_our_roaring_skies: "呼啸长空"
 SAF_our_roaring_skies_desc: "空中的战斗已经打响，尽管南非空军正像雄狮般奋战，但面对德国空军的猛攻确实陷入苦战。由于国内航空制造业停滞不前，我们只剩下一个明确选择：进口美国战机并迅速投入对抗德国空军的战斗。唯有如此，我们才能开始扭转空中战局，确保开普敦上空的制空权。但愿庞大的战机数量能弥补我们新飞行员经验不足的缺陷——这些雏鹰即将奔赴南非战争战场上空展开殊死搏斗。"
 SAF_total_air_supremacy: "空中霸权"
 SAF_total_air_supremacy_desc: "要赢得陆地战，必须先掌控天空。我们必须不惜一切代价从国外进口新飞机并培训飞行员。我们的选择很明确：美国战机将再次为我们夺取制空权，进而转化为对地面部队的近距离空中支援。鉴于非洲战场的广阔距离，一支合格的空军对执行侦察、补给、部队运输和轰炸任务至关重要——而这一切唯有在我们对德军取得完全空中优势时才能实现。"
 SAF_The_CIA: "中央情报局"
 SAF_The_CIA_desc: "毫无疑问，这场战争不仅在战场上的明面交锋中进行，也在会议室里的暗处角力中展开。早在战前，BOSS便已在美国人的充分配合下秘密行动。此事获得总理的完全授权，如今也无需再遮遮掩掩——中情局不仅受邀参与，更在开普敦获配顶级办公场所，以协助开展这场战争的隐秘战线。破坏行动、情报搜集甚至刺杀任务，统统由兰利来的小伙子们操刀实施，而那些比任何时候都渴望向德国佬复仇的SAS流亡成员，则为他们提供强力支援。"
 SAF_selling_them_the_war: "向他们兜售战争"
 SAF_selling_them_the_war_desc: "我们是非洲大陆上唯一抵抗纳粹的国家。我们是唯一阻止他们超越非洲，将目光投向美国，为意识形态和贪婪进行再一次征服的人。\n\n但美国部分民众对战争的进展并不满意，希望撤军，我们有责任让他们看到原因。让我们开始一场宣传运动，让他们知道，如果他们今天把他们的人带回家，德国人今天占领南非，明天他们将在家门口和元首的狗奴才作战。"
 SAF_american_tech: "美国的技术"
 SAF_american_tech_desc: "美国急切地想把他们最好的一些东西献给我们的国家。他们愿意与我们分享他们最新的装甲车、最先进的飞机和直升机以及这些设备背后的技术。\n\n这样的“礼物”必须被广泛使用，并挖掘最大的潜能。当德国人看到我们用这些美国工具走的多远时，他们会感到非常震惊的。"
 SAF_american_talent: "美国的才智"
 SAF_american_talent_desc: "我们的美国盟友提出了一些有趣的建议。他们认为，如果我们使用这些创新的战术，战争的局势将对纳粹不利。\n\n他们说，对敌人的领土进行突袭，并部署一些由训练有素的士兵组成的小股部队，进行非常规作战，创造性地使用我们的船只来阻截德国的后勤，创新式的使用空军，将使我们处于战略上的优势。让我们好好想想我们的朋友的建议。"
 SAF_american_armour: "美国的装甲"
 SAF_american_armour_desc: "没有什么能比得上优秀坦克的多功能威力，但南非从未真正专注于自主生产坦克。我们曾计划以一位杰出的英国流亡者设计的坦克为基础，但将“百夫长”改造成“象”式坦克的进展至今甚微。\n\n因此，我们必须打开国库，将美国最新最精良的坦克作战装备引入开普敦。所幸美国人非常乐意增加对我国的武器出口，同时捍卫自由事业。"
 SAF_we_need_more: "我们需要更多"
 SAF_we_need_more_desc: "我们感谢我们的盟友，特别是美国对我们军队的支持。战争总有一天会结束，但最好早点结束。\n\n实现这一目标的一个方法是请求他们支援更多的东西。如果我们能获得这些支援，我们的部队和我们的人民将在战场上很快击败德国人并取得和平这一伟大的成就。\n\n南非必须获得更多的支持，这是必须的！"
 SAF_the_hidden_war: "秘密战线"
 SAF_the_hidden_war_desc: "德国侵略者知道他们不能在正面战场上打败我们和我们的美国盟友，就利用我们国家的分裂削弱我们的战斗意志。在叛徒阿尔伯特·赫尔佐格的带领下，使用德国武器装备的恐怖分子武装到牙齿，恐吓忠诚的公民，谋杀征兵人员，袭击我们的补给线，在我们的道路上埋设地雷，伏击我们的部队。\n\n这个所谓的“秘密战线”不仅损害了我们的人员、物资和士气，也损害了我们美国的盟友的意志，他们开始质疑他们在大陆存在的必要性。必须严肃处理，我们已经打败了他们两次，我们下一次还是能打败他们，不管他们自称布尔民团还是“狼人”游击队。"
 SAF_shatter_the_schild: "粉碎非洲之盾"
 SAF_shatter_the_schild_desc: "德国在非洲的存在就像是一个泥潭中的巨人。从加蓬到莫桑比克，他们的殖民帝国乍一看令人印象深刻，但却又远离实际。事实是，三个争吵不休的独裁者各执一词，军事上又过度依赖懒散的雇佣兵，每一处驻军附近都潜伏着反殖民主义的叛乱者和土匪。\n\n我们会利用那些叛军给纳粹入侵者带来毁灭，以彼之道还施彼身。德国人不像我们那样有布尔战争的经验教训，他们仍然沿用在欧洲的作战方式。只要一小群不满的非洲人武装起来，就可以在远离前线的地方拖住他们一整支师，令那些傲慢的专员们睡不着觉。他们武装赫尔佐格的叛徒是在埋下恶种，那当我们在他们的地盘上武装非洲游击队，就是让他们吃到苦果。"
 SAF_strike_the_balance: "把握平衡"
 SAF_strike_the_balance_desc: "没有标准答案，因此我们应当采取混合策略——既要抵御日益猖獗的叛乱势力保卫国土，同时也要通过启动针对非洲之盾的深度隐蔽行动来瓦解他们。诚然，这不会像另外两种选择那样立竿见影，但分散押注才能保留所有可能性，这才是当前最稳妥的应对方案。"
 SAF_our_just_cause: "我们正义的事业"
 SAF_our_just_cause_desc: "还有什么比保卫国家、捍卫土地与人民更正义的事业？众所周知，这场战火并非由我们点燃——当牛车哨兵潜伏时火焰早已燃烧，但正是他们将南非推向火海。如今必须号召全体南非人投身这项事业，也要让全世界知晓。是时候举起我们的盾牌，握紧手中武器，为南非的命运投入这场伟大斗争！只要勇敢的南非人仍在恐怖面前昂首挺立，好望角就永不陷落！"
 SAF_our_american_allies: "我们的美国盟友"
 SAF_our_american_allies_desc: "我们不能在这场战争中单打独斗，四面八方都是入侵的德国军队，我们唯一的希望来自海洋。美国是唯一在这些整个世界似乎都反对我们，失败就在眼前的困难时期中站出来帮助我们的国家。\n\n现在在华盛顿，五角大楼的官员正在讨论一项空运，让美国货机将最需要的武器和物资运到开普敦，这些武器的到来将大大提高我们在攻击中生存的几率，并使这些德国侵略者对是否继续前进犹豫不决。"
 SAF_psuedo_operations: "伪装行动"
 SAF_psuedo_operations_desc: "我们的军官中最近流行起了一种非传统的作战方式，尤其是在那些前英国流亡者的小圈子里，他们给这种战术起了个名字，就叫“伪装行动”。罗恩·里德-戴利上校想出了这些千奇百怪的行动方案，包括但不限于：吸收逃兵和“变节”的战俘组建突击队，穿上党卫军军装混进敌军后方收集情报，顺便搞些诸如突袭、颠覆、破坏以及暗杀之类的“小”动作。\n\n有了在党卫军中服役的英裔不满情绪的推波助澜，戴利的手下会在敌军的大后方搞得天翻地覆。现在，女王陛下的忠勇将士——为了我们所深爱的非洲大地——就要让德国鬼子血债血偿了。"
 SAF_defectors_into: "化敌……"
 SAF_defectors_into_desc: "潜伏在南非密林中的德军突击队苦不堪言：身上有蚊虫在叮咬，脚下还得提防诡雷，烈日炎炎，食不果腹，头顶还不时有美军巡逻的直升机掠过，意味着他们只要走错一小步就可能要了他们的小命。游击战并不仅仅是对抗敌人那么简单，它同时也是考验每一位士兵内心作战意志的战争——一场我们应该鼓励布尔士兵输掉的战争。\n\n我们的美国盟友请求我们协助他们代号为“游魂”的心理战方案。通过放送特别处理过的广播，我们也许能“说服”布尔叛军和土著党卫军放下武器向我军投降，不费一枪一弹就赢得这场战争。"
 SAF_defectors_soldiers: "……为友"
 SAF_defectors_soldiers_desc: "毫无疑问，我们最需要的是身着军装的战士。我们拥有装备，拥有补给系统、弹药和坦克，但我们需要更多人手。任何投诚者都将获得最精良的装备、最完善的后勤保障以及系统化训练，最终被派遣回战场为胜利奠定基石。凡削弱敌军者，皆将受尊崇、获敬重，并作为南非自由的真正捍卫者永载史册！"
 SAF_the_propaganda_war: "舆论战"
 SAF_the_propaganda_war_desc: "尽管前线战事激烈，但如果缺少了合适的新闻报道，那些大后方的人们只会觉得事不关己，高高挂起。如果不把前线的奋战向全世界转播，那么就算我们再怎么流血牺牲，也根本不会有人关心。那些呆在家中坐视国难的普通人也好，那些隔岸观火的外国观察员也罢，他们必须明白，我军将士日以继夜，为守护南非的自由与解放究竟付出了多少；他们必须明白，眼下已经到了生死存亡的危急关头；他们也必须明白，我们深爱的祖国为何会面临如此严重的威胁。\n\n为了正确地展现这场战争的真面目，我们应当保证每一位记者和摄影师都分配到我们的部队中，让他们与我们的士兵并肩见证我们为之奋战的这场战争的真面目。我们必须利用他们从前线发来的报道，通过宣传来鼓舞我军的士气，也激励其他国家向我们的事业伸出援手。我们要告诉世界，南非正在为她的存续而战，为她的人民和国土而战，也为非洲大陆的自由、真理和正义而战。\n\n不只有冲锋陷阵才能赢得战争，录像机和磁带也可以。"
 SAF_focus_on_counterinsurgency: "专注平叛"
 SAF_focus_on_counterinsurgency_desc: "赫尔佐格的党羽威胁我们的乡村地区和骚扰我们补给线的问题变得比之前预期的更加严重，似乎只靠南非警察和陆军宪兵单位再加上轻步兵编队还不足以把问题扼杀在萌芽状态，我们需要更多的东西。\n\n在美国盟友的帮助下，我们将开展民事行动与革命发展支援计划，代号CORDS，这是一个特别计划，目的不仅包括发现和消灭国民党武装叛乱分子，还要捣毁他们的政治组织，把乡村的阿非利卡人从恐怖分子转变成女王陛下的忠诚臣民。"
 SAF_identifying_insurgents: "甄别叛党"
 SAF_identifying_insurgents_desc: "尽管“救火队”战术对歼灭敌方的武装民团卓有成效，但这毕竟还是用于战场的战术，它并不足以破坏国民党苦心经营、遍及乡间的政治联络渠道和后勤支援网。不管我们消灭了多少布尔民兵，只要国民党还以一支政治派系的面目存在于世，我们就不可能彻底根除这条盘踞在国土上的毒蛇。\n\n美国人已经构想了一个能铲除叛乱威胁的方案，根据布尔社群内部的线人情报网络，他们会一个个找出叛乱分子再处决他们。充当这个所谓“凤凰计划”矛尖的是一支由爱国的布尔猎手组成的部队，他们来自代号为“库夫特”——也就是南非语的“撬棍”——的女王卫队，他们会像撬棍一样将那些恐怖分子从手无寸铁的布尔民众中一个个撬出来，直接把这些暴徒交到我们手上任我们处置。"
 SAF_win_the_villages: "战略村计划"
 SAF_win_the_villages_desc: "尽管我们尽了一切努力，国民党仍然在很大程度上控制着我国的布尔人人口，无论是诉诸同情还是加以威胁，他们还是说服了布尔民众中的许多人继续为国民党组建的民团提供补给。我们需要采取更严厉的措施。\n\n美国人向我们提议了建立战略村的设想，在他们的设想中，我们会将布尔人的农村人口集中转移到戒备森严、重兵把守的村庄，断绝他们与叛军联系的渠道。只要战争还在继续，这一措施就不会放松。\n\n我们已经被赫尔佐格的肮脏手段逼到了我们的底线，现在，我们要诉诸于在镇压上一次布尔暴乱中就行之有效的策略，我们会让叛国者最畏惧的梦魇化为现实：赫尔佐格只能眼睁睁看着他布尔同胞的孩子被关在铁丝网后，就像他以前经历过的那样。"
 SAF_south_africa_indivisible: "南非不容分割"
 SAF_south_africa_indivisible_desc: "南非永远不会倒下！我们坚定地团结在一起！不管国民党多少次试图从内部把我们分裂，我们忠诚的公民将团结一致，用鞋跟踩碎这些布尔毒蛇！不管有多少军队，不管是德国人还是布尔人，若他们胆敢涌入我们的边境，我们忠诚的士兵会把他们一路送回约翰内斯堡和刚果！南非决不向德国人或布尔人屈服！南非将永远忠于王室，永永远远不会向一个虚假的统治者屈服！愿上帝保佑君主和国家，让我们远离邪恶的恶魔！南非万岁！统一党万岁！女王万岁！"
 SAF_beat_back_the_invaders: "击退侵略者"
 SAF_beat_back_the_invaders_desc: "这是我国的领土，我们决不能让德国佬侵占它！只要还有一个热诚的南非人屹立不倒，我们就决不会将领土拱手相让！\n\n纳粹和他的国民党走狗认为他们可以征服我们，我们会用行动证明他们错了！南非将以自由国家的一切力量来支持我们取得胜利，以爱国者的鲜血支持我们与敌人展开殊死战斗。\n\n在湛蓝的天空和蔚蓝的深海，在我们的群山间和广袤的草原上，南非将众志成城！南非将获得自由！"
 SAF_form_the_SASF: "组建SASF"
 SAF_form_the_SASF_desc: "SAS特种空勤团的传奇及其在二战中的表现，至今仍令无数读者心驰神往。如今正是时候建立我们自己的特种部队——南非特种部队组（简称SASF）。幸运的是，我们恰好有几位SAS关键人物，他们当年成功躲避德军追捕，如今已在BOSS情报机构效力。\n\n战事当前，必须立即组建我们的精锐部队，将他们投入最危险却最关键的行动，从内部瓦解非洲之盾防线。总理秘密勤务处的成员们，将永远与这场冲突的遗产紧密相连。"
 SAF_death_from_above: "死从天降"
 SAF_death_from_above_desc: "广袤的土地、辽阔的地形与浩瀚疆域如今皆燃起战火，但大多数人难以真正理解这片大陆的幅员尺度，自然也无法领会这场冲突的规模。与第二次世界大战最大的不同在于，直升机已作为战争工具崭露头角。\n\n特别是这场规模空前的战争，空中突击部队终将发挥决定性作用，其威力之强甚至会让德国人忍不住抱怨不公平。但在这场宏大冲突中，我们必须动用一切可用手段夺取胜利。"
 SAF_second_to_none: "首屈一指"
 SAF_second_to_none_desc: "老兵们的经验、最先进的技术与装备、取之不尽的资金支持，这一切汇聚成一股力量，一支远超所有竞争对手的队伍。南非特种部队将稳步瓦解德国的战争能力。此后，人们传颂的将唯有南非最伟大的英雄传奇——他们当之无愧，举世无双。"
 SAF_armaments_production_board: "成立阿姆斯科"
 SAF_armaments_production_board_desc: "南非的军工复合体从未真正成型，更倾向于完全依赖自由市场、本土企业以及外国进口来处理这类成本最低的事务。然而如今，这种模式在面临最严峻危机时严重削弱了南非的实力。因此，我们需要建立一个机构来推动真正军工复合体的形成。\n\n南非军备公司将同时作为我们的核心协调机构和工业企业，负责将民用工厂改造为军工设施，并协调国内所有军事生产涉及的资源、资金与审批事宜。此举最大的优势在于，我们将最终成为新兴工业强国，既能享受国内红利，又能开启军事装备出口业务。"
 SAF_armaments_production_board_tt: "添加§Y$SAF_springboks_march$§!，其效果为：\n$MODIFIER_INDUSTRIAL_CAPACITY_FACTOR$：[?0.025|+2%]\n$free_production_units_modifier$：[?4|+=1]"
 SAF_everything_accounted_for: "根除繁文缛节"
 SAF_everything_accounted_for_desc: "表格？规章？污染限制？规划要求？你到底在说什么，德国人打过来了！当我们站在毁灭边缘时，哪有时间搞这些花哨的和平时期思维。是时候把那些构成文明社会的繁文缛节和条条框框全都扔掉了。我们必须快速行动，不惜打破一切阻碍，把更多力量投入到开普敦的防御中。\n\n这么做会引起争议，但当我们面临的选择是沦为德国人及其人民邦傀儡政权的奴隶时，这些争议就无足轻重了。若有人想抱怨，等战争结束后再说吧。"
 SAF_everything_accounted_for_tt: "§Y$SAF_springboks_march$§!追加效果：\n$MODIFIER_ATTRITION$：[?SAF_springboks_march_attrition_temp|=-%1]\n$MODIFIER_PRODUCTION_LACK_OF_RESOURCE_PENALTY_FACTOR$：[?SAF_springboks_march_resource_penalty_temp|=-%2]"
 SAF_american_machine_tools: "进口美国机械"
 SAF_american_machine_tools_desc: "尽管政府采取了贸易保护主义措施，南非始终未能成为工业强国。虽然我们的工业基础尚可，但在此生死存亡之际根本难堪大任。必须大规模进口美国机械设备来建造全新工厂。只要持续支付款项，美国人甚至愿意提供从零开始的全套建厂方案。债务是暂时的，而死亡是永恒的。让钻石与黄金源源不断流向华盛顿，让美国机械永不停歇地涌入！"
 SAF_american_machine_tools_tt: "§Y$SAF_springboks_march$§!追加效果：\n$MODIFIER_INDUSTRIAL_CAPACITY_FACTOR$：[?SAF_springboks_march_factory_output_temp|=+%2]\n$free_production_units_modifier$：[?SAF_springboks_march_free_pus_temp|=+1]"
 SAF_the_merchant_marine: "商船队"
 SAF_the_merchant_marine_desc: "南非从大英帝国继承了丰厚遗产，随着英国彻底崩溃而被流放的众多人员至今仍充实着我们的商船队。不仅有大量船只，更有经验丰富的水手来到开普敦并在此定居。如今我们的商船队维系着与自由世界各国的联系通道，成为我们国家绝对的生命线。\n\n我们必须迅速从国外购买船只以加强护航体系，这既能保障沿海作战部队的充分补给，又能让我们进口更多战争所需物资。"
 SAF_the_merchant_marine_tt: "§Y$SAF_springboks_march$§!追加效果：\n$MODIFIER_CONVOY_RETREAT_SPEED$：[?SAF_springboks_march_convoy_retreat_temp|=+%2]"
 SAF_a_modern_war_machine: "现代战争机器"
 SAF_a_modern_war_machine_desc: "这场战争让国家付出了巨大代价——资金、人力、物资、损失与苦难，但由此催生的成果却堪称壮丽。在卑劣阴险的袭击将我们逼至绝境后，南非展开了强力反击，将武装力量与军事工业体系重整为高效运转的战争机器，这支力量必将很快为非洲战局一锤定音。用不了多久，南非就将主宰这片大陆的南半疆域。"
 SAF_a_modern_war_machine_tt: "§Y$SAF_springboks_march$§!追加效果：\n$MODIFIER_PRODUCTION_FACTORY_MAX_EFFICIENCY$：[?SAF_springboks_march_prod_eff_cap_temp|=+%2]"
 SAF_using_the_terrain: "利用地形"
 SAF_using_the_terrain_desc: ""
 SAF_field_reconnaissance: "野外侦察"
 SAF_field_reconnaissance_desc: "在任何冲突中——尤其是如此大规模的冲突——视野都至关重要。侦察作为关键因素，能让拥有最佳地图并最了解敌情的一方赢得整场战役。在这场广阔无垠的对抗中，部队极易迷失方向或丢失敌军踪迹，因此我们必须大力投入提升部队侦察能力，将这一优势带入战场，以卓越的情报与精锐的兵力彻底击溃敌军。"
 SAF_increase_our_conscription: "扩大征兵"
 SAF_increase_our_conscription_desc: "南非是这片大陆上最后一个致力于人民的团结和自由的国家，尽管如此但还是有不少人更愿意呆在家里而非出来为自由而战，鼓励那些居家者参加我们的军队将帮助我们赢得这场战争。\n\n各个年龄段的不同能力者都必须意识到要尽自己的义务！我们不能一直让志愿兵战斗，更不能乞求我们的盟友帮我们打完每场战斗！\n\n不！我们必须开始号召更多的人参战！虽然这是对个人自由的牺牲，但与其作暴君的奴隶而死，不如为了生存而战！"
 SAF_women_in_the_military: "女性参军"
 SAF_women_in_the_military_desc: "自治领不应该只依靠男人。在这场战争中，是时候让女人们尽自己的一份力量，明白她们也必须做好牺牲的准备。\n\n尽管所有人都担心战争的创伤，但我们别无选择，只能鼓励我们的女儿像我们的儿子那样付出血汗。\n\n南非是所有人的土地，如果我们希望真正战胜我们的敌人，那么我们必须允许我们的女性参与到这场胜利中来。"
 SAF_reinstate_the_cape_corps: "重组开普军团"
 SAF_reinstate_the_cape_corps_desc: "开普军团最初是军队中唯一允许开普有色人种和南非印第安人服役的部队，他们借此为自己与家人谋求更好的生活。二战结束后该军团被解散，而今正是重建军团、号召愿为联邦奉献生命与劳力者入伍的最佳时机。需求极为迫切，我们必须投入资金招募大批忠诚的新兵加以训练，以在这场南非最严峻的危机中保卫国家。"
 SAF_conscript_black_south_africans: "征召南非黑人"
 SAF_conscript_black_south_africans_desc: "我们已堕落到何种地步，需求又有多么迫切，竟不得不征召南非土著入伍。众所周知这纯属绝望之举——将武器交到土著手中并加以训练，无异于等待未来的叛乱。反对此举的抗议已然兴起，但总理法令依然生效。大量劳工必将踊跃参军，因为士兵报酬远胜任何土著工种。然当需求迫在眉睫时，我们已别无选择。唯愿他们能将枪口始终对准德国人。"
 SAF_technological_innovation: "技术革新"
 SAF_technological_innovation_desc: "我们的大学已经转变成研究中心，并与我们的军工企业展开密切合作，致力于发展新技术，帮助我们的小伙子们在战场上取得任何可能的优势。现在，我们已经建立起一个特别小组，用来对我们的步兵装备进行现代化和改进，以提高部队在战斗中的表现。\n\n为了给他们的工作提供方便，我们必须予以全力支持。"
 SAF_militarize_our_economy: "经济军事化"
 SAF_militarize_our_economy_desc: "我们与德国人之间的紧张和平被他们对我们自治领的入侵所粉碎，他们的战犬涌过边境，我们国家的经济必须转换成可以维持我们尽一切努力击退他们的东西，南非将从一个由农民和矿工组成的国家变成一个由士兵和军械工组成的国家！\n\n我们将好好组织，让我们的人民有饭吃，让我们的士兵武装起来，让我们的车辆正常行驶，并让我们的盟友对我们会战胜任何敌人的承诺充满信心。"
 SAF_matter_of_delivery: "后勤问题"
 SAF_matter_of_delivery_desc: "无论战斗部队多么勇敢，无论他们的坦克多么现代化，无论大家对战争与胜利的斗志多么高昂，如果没有弹药、食物、燃料、零部件等源源不断的补给，一切都毫无意义。我们必须全力以赴，为我们部队建立一个强大的后勤补给系统，这样才能让他们在遥远的距离和复杂的地形中持续作战，完成这场对抗德国人的伟大斗争。\n\n正如俗语所说：外行谈战略，赢家论后勤。"
 SAF_the_light_shines_on: "光芒闪耀"
 SAF_the_light_shines_on_desc: "他们无法恐吓我们。他们无法使我们畏惧。他们永远也休想击垮我们。南非如今已全情投入这场战争，这场抵御无尽灰暗浊流南侵的神圣防卫之战。面对黑暗，非洲最后的明灯依然闪耀，其火炬灼烧着成群结队的施虐者与奴隶贩子。很快，一道伟大的光芒将照耀这片大陆，涤净使其身陷桎梏的黑暗势力。"
 SAF_NEED_WORK_EFFECT_TREE_TLL_TODO: "§CTLL: SAF NEW WAR TREE NEEDS EFFECT WORK"
 SAF_TT_LIES_TLL_TODO: "§CTLL: TOOLTIP LIES. NO DECISIONS EXIST"
 south_african_war_happening: "南非战争仍在继续"
 SAF.1.t: "安排公投"
 SAF.1.desc: "1964年2月2日"
 SAF.1.a: "保皇派一定会赢！"
 SAF.2.t: "共和派赢得南非公投"
 SAF.2.desc: "美联社开普敦电——随着宣布南非联邦为共和国的公投被选民通过，南非统一党遭受了重大挫败。这项被反对党国民党支持的决议将会结束英王室对联邦的统治，切断和英帝国的最后一缕官方联系。\n\n这次公投非常有争议，对其的支持和反对完全按照民族和政治分歧。许多布尔人对公投表示支持，而英裔则对此表示反对。政治断层也随其呈现出来，德·维利尔斯·赫拉夫总理为反对公投做了大力宣传，支持公投的阵营则由反对党领导，并最终取得了胜利。\n\n许多公投的支持者指责联合党使用严厉手段压制选民，而共和派的宣传则被指责为种族主义。像“布尔突击队”这样的极端右翼布尔民族主义者为公投提供了虽然只占少数但是为数不少的支持，他们认为这是使英裔主导的联合党下台的必要步骤。尽管取得了胜利，但其中许多团体仍在组织武装，声称统一党将试图颠覆人民的意志并保持君主制。"
 SAF.2.a: "真是糟糕透顶……"
 SAF.3.t: "保皇派赢得南非公投"
 SAF.3.desc: "美联社开普敦电——随着宣布南非联邦为共和国的公投被选民驳回，南非统一党取得了重大胜利。这项被反对党国民党支持的决议本将会结束英王室对联邦的统治，切断和英帝国的最后一缕官方联系。\n\n这次公投非常有争议，对其的支持和反对完全按照民族和政治分歧。许多布尔人对公投表示支持，而英裔则对此表示反对。政治断层也随其呈现出来，德·维利尔斯·赫拉夫总理为反对公投做了大力宣传，而反对党也为能将其通过而做了大力宣传。\n\n许多公投的支持者指责联合党使用严厉手段压制选民，而共和派的宣传则被指责为种族主义。像“布尔突击队”这样的极端右翼布尔民族主义者为公投提供了虽然只占少数但是为数不少的支持，他们认为这是使英裔主导的统一党下台的必要步骤。虽然遭受了失败，但其中许多团体仍在组织武装，声称统一党使用了广泛欺诈以来压制共和派收到的广大支持。"
 SAF.3.a: "至少我们赢了。"
