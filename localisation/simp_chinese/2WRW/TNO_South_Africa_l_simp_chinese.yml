 SAF_IA_Monarchy_name: "§I君主制§!"
 SAF_IA_Monarchy_tt: "§I君主制§!\n支持率：[?SAF_monarchy_support|W2]%\n--------------\n非官方层面，§I南非王位§!至今虚悬——这个国家对§X加拿大的伊丽莎白二世§!与§b不列颠的爱德华八世§!都表现出模棱两可的漠然。然而即便是西伯利亚最与世隔绝的隐士也清楚，政府和民众绝大多数都支持§X伊丽莎白二世与英联邦§!。\n\n另一方面，许多憎恶君主制的§O阿非利卡人§!正愈发迫切地想要实现他们在开普地区建立不受外国影响的§t真正共和国§!的愿景。随着冲突双方为定于1963年末举行的公投做准备，§J南非§!是时候决定其§I虚悬王位§!的未来、国际关系乃至联邦本身的前途了。尽管围绕§I虚悬王位§!存在诸多变数，但其最终瓦解§Z尚非定局……§!"
