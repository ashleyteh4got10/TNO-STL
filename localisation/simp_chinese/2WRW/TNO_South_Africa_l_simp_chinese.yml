 SAF_lean_towards_the_ofn: "向自由国家组织倾斜"
 SAF_lean_towards_the_ofn_desc: "大英帝国或许已死，但其影响至今仍举足轻重。自由国家组织在很大程度上正是由旧世界的残存政府、或仅仅是侥幸躲过德日攻击的地方所组成。若非如此，它们便曾是大英的殖民地，或如南非曾是的自治领。\n\n向自由国家组织稍作倾斜，有助于确保更多来自美国的投资，并改善我们的经济。同时，美国消费市场或许是全世界最大的市场。只要我们努力加强与美国人的联系，将南非的优质产品销往美国想必并非难事。"
 SAF_a_new_year_on_the_cape: "好望角的新年"
 SAF_a_new_year_on_the_cape_desc: "自第二次世界大战惨淡收场以来，南非始终笼罩在一曲无声的挽歌之中。随着不列颠雄狮及其非洲殖民体系的崩塌，流亡者如潮水般涌入，统一党借此永久边缘化了反对派势力。稳固的选举联盟支撑着统一党的执政合法性，同时将国民党代表的阿非利卡人与占人口多数的原住民统统排除在权力核心之外。\n\n尽管白人少数统治与系统性种族隔离尚未以“种族隔离制度”这一术语被正式制度化，但自建国以来，这种现状始终坚不可摧。\n\n然而地表之下正酝酿着惊天巨变，边境之外的风暴即将颠覆南非奉为圭臬的现存秩序……"
 SAF_a_party_united: "一个统一的政党……"
 SAF_a_party_united_desc: "自1934年以来，联合党便牢牢执掌政权，虽在1942年一度分裂为国民党与联合党，但作为一个由英裔人口主导，并有少数阿非利卡精英参与的自由派联盟，该党牢牢掌控着国家，权力未受任何实质挑战。\n\n然而，这并不意味着党内如铁板一块。统一党大致由三个小派系组成：进步派、实用派和保守派。科林·埃尔金和扬·亨德里克·霍夫迈尔领导的进步派，寻求缓慢但坚定地改善土著待遇，并促进不同种族间的合作。沃斯·劳领导的保守派，则只想维持白人至上、有色人种协作、土著永世劳作的现状。最后，实用派由总理德·维利尔斯·赫拉夫领导，他唯一的追求是确保南非英裔的权力和影响力得以延续，并随时准备变换立场，以维持这一切。"
 SAF_a_nation_divided: "……和一个分裂的国家"
 SAF_a_nation_divided_desc: "南非的内部分裂与日俱增。不仅被压迫的土著在非洲人国民大会的旗帜下持续组织，更有如“民族之矛”这样的激进组织，已经开始了暴力破坏与暗杀行动。而在另一边，阿非利卡人表面上似乎对自己的处境还算满意，但这并不能解释那些日复一日煽动反对盎格鲁政府的强硬派。\n\n更危险的是，被取缔的“牛车哨兵”组织，在民族社会主义者约翰内斯·范伦斯堡的领导下，正盘踞在东非边境之外，其准军事单位似乎日益壮大。边境上的德国专员辖区，其影响力也似乎一天天深入跳羚之国。南非的各色民族都已蠢蠢欲动，这个国家正进一步走向两极分化，且看不到任何终结的迹象。"
 SAF_the_national_party: "议会之内"
 SAF_the_national_party_desc: "自1914年成立以来，南非国民党一直是该国阿非利卡公民的政治代表，他们寻求以“种族隔离”之名，实行严苛的种族分离政策。该党由J.B.M.赫尔佐格创建，其子阿尔伯特·赫尔佐格（因强烈反对电视而闻名）如今继续领导着它。自1942年两党分裂以来，国民党便一直被统一党排挤在权力之外，其选民基础稳固，甚至一成不变，几乎囊括了南非所有自认为是阿非利卡人的人。\n\n然而，单纯的人口结构意味着国民党永远无法再次赢得选举。开普敦的盎格鲁领导层可以继续高枕无忧地统治，偶尔给予国民党一些胜利以安抚他们。情况日益明朗：除非拿起武器，从这个将他们的自由与压迫他人自由的枷锁捆绑在一起的国家中争取独立，否则阿非利卡人将永远是南非的囚徒。"
 SAF_the_anc: "街头之上"
 SAF_the_anc_desc: "南非约有三分之一的人口属于白人、印度裔和开普有色人种等特权阶级。另外三分之二的人则没有选票，没有发言权，只能得到最贫瘠的土地。他们的辛勤劳动对经济至关重要，但经济却从他们身上攫取一切，只给予他们勉强维持生存的微薄报酬。然而，时光流转，昔日被视为常态的不公，随着世界的缓慢前进，正变得越来越不被接受。\n\n非洲人国民大会是一个被取缔的组织，但它为南非土著的民族解放事业以及在好望角建立一个社会主义国家的目标正不断赢得力量。其领导层实力日增，奥利弗·坦博、纳尔逊·曼德拉和克里斯·哈尼等关键人物已开始组织起来，对抗统一党的白人至上政府。"
 SAF_referendum_on_the_monarchy: "人民之声"
 SAF_referendum_on_the_monarchy_desc: "由于国内外压力，南非联邦君主之位在1945年至1962年间持续空缺，越来越多人质疑这虚悬王座存在的意义。与其在伊丽莎白与爱德华之间抉择，南非的王座始终空置，陷入永恒的停滞。自民族主义党成立以来，便一直寻求彻底废除君主制。\n\n由于统一党占据主导政治地位，该议题被无限期搁置——任何关于废除君主制或举行公投的议案都未曾通过南非联邦议会，直到此刻。坚定的君主主义者、统一党保守派领袖沃斯·罗认为时机已到，主张通过终极公投彻底平息民族主义党无休止的怨言。毕竟，政府赢得这场公投理应易如反掌，不是吗？"
 SAF_better_call_div: "最好问问迪夫"
 SAF_better_call_div_desc: "德·维利尔斯·赫拉夫自1956年险胜联合党领袖选举以来，一直担任南非总理。他是一位魅力非凡的阿非利卡裔绅士，却成为了统一党、乃至政府、乃至整个国家的核心人物。亲近的人都昵称他为“迪夫”。他一直在推动南非的现代化，并不惜一切代价在日益加剧的冷战中维护国家的中立。\n\n但即便是他，也感觉到内部的紧张局势正在加剧，国民党和非洲人国民大会都愈发躁动，寻求以新的方式实现他们各自理想中的南非。赫拉夫执政的第六个年头即将到来，时不我待，必须采取诸多措施，以确保联合党能继续领导南非的未来。"
 SAF_law_and_order: "法律与秩序"
 SAF_law_and_order_desc: "南非五分之三的人口是躁动不安的土著，他们是我们经济的基石，却被隔绝在所有经济利益之外——其中最核心的，便是事实上禁止他们拥有土地的法令。另外三分之一的人则致力于约束他们，利用他们的劳动力，并用严酷的手段和一套精心调校的治安体系，来阻止他们越界。\n\n随着极度危险和颠覆性的非洲人国民大会持续崛起，我们必须采取更多措施，确保法律与秩序不被抗议、罢工乃至暴力所破坏。只有联合党的领导才能让这些狂野不羁、未曾开化的土著大众安分守己，从而保障南非的安全与繁荣。而只要有了充足的法律与秩序，国家的安全就将坚如磐石。"
 SAF_bad_apples: "害群之马"
 SAF_bad_apples_desc: "国民党永远是那个慷慨地赋予了他们文明与发展的不列颠良善文明的死敌。要削弱他们反对君主制的号召力，最简单的办法莫过于将他们与东非边境之外那些死不悔改的牛车哨兵极端分子相提并论。我们应该强调并构筑国民党与牛车哨兵之间的联系，将这场投票描绘成温和君主主义者与民族社会主义极端分子之间的抉择。一颗老鼠屎就能坏了一锅汤，尽管牛车哨兵自诩为阿非利卡人民的唯一真正代表，但它那套强硬路线在大多数布尔人中其实并不受欢迎。\n\n当然，将我们的政敌斥为纳粹，无疑是一种新颖而独特的辩论方式，我们应当善加利用，使其更具威力，以彻底瓦解他们的根基。"
 SAF_between_three_eagles: "双鹰之间"
 SAF_between_three_eagles_desc: "第二次世界大战结束后，世界被三大超级大国瓜分。每一方的影响力都跨越重洋，渗透到每一块大陆。日耳曼尼亚、华盛顿与东京之间的冲突虽已从公开战争转变为文化、影响力、政治与经济领域的较量，但这场无休止的博弈仍在持续影响着所有小国。尽管南非统一党的领导层明显倾向于自由国家组织，但该国自身仍保持中立道路。\n\n与北方德国殖民地的贸易往来，以及从德国巨型企业引进的技术，极大地推动了南非的现代化进程。然而在边境另一侧，流亡的南非白人民族社会主义组织“牛车哨兵”据称在德国的扶持下持续壮大，其威胁不容小觑。"
 SAF_on_the_streets: "接触南非白人"
 SAF_on_the_streets_desc: "南非白人政客们对街头和城市中大量非国大活动分子的存在日益感到忧虑。近几个月来，非国大的活动不断升级，其恐怖袭击也愈发肆无忌惮。南非白人声称非国大对国家安全构成重大威胁，必须迅速采取严厉手段予以打击。\n\n现在我们将着手应对他们的关切——主要是为了遏制非国大的极端主义威胁，同时也为了平息南非白人无休止的抱怨。警方将获准升级对非国大的打击行动，以残酷暴力的手段取缔其基层组织。但愿这步棋能同时化解双重困局。"
 SAF_the_good_ones: "温和派"
 SAF_the_good_ones_desc: "原住民始终是南非稳定与繁荣的持久威胁。这些仍停留在蒙昧状态的族群，必须首先接受开化，才有可能（假设性地）进一步改善生存境遇。尽管我们应当全力打击非国大中的激进派系及其武装分支，但或许存在少数温和派愿意进行对话——只需施舍些面包屑般的微小让步，辅以永不撼动我们开明现状的渐进改革，便足以安抚这些人。\n\n虽然此举可能激怒布尔人，尤其是牛车哨兵强硬派，但这群人本就无法被满足，何必费心周旋？我们大可与最温和的非国大成员展开对话，推行最无关痛痒的改革来暂时安抚。与此同时，这种“胡萝卜加大棒”的双轨策略，短期内反倒能强化我们对土著问题的掌控力。"
 SAF_rabble_rousers: "煽动分子"
 SAF_rabble_rousers_desc: "非洲人国民大会及其同伙是共产主义的煽动者。这些危险的暴徒企图破坏和平、焚烧我们的农场，窃取南非的美好未来。他们绝无向善可能，必须从严认定其非法组织身份。任何怀柔尝试都无法满足这些贪婪的共产主义者——不，唯有铁腕镇压这群企图将南非引入歧途的狂悖之徒才是正道。\n\n政府将与军警力量协同出击，不惜一切代价镇压暴乱，恢复跳羚之国的和平与秩序。这些暴民将无处遁形，我们必将以雷霆手段令其各安其位。"
 SAF_in_the_hearts: "在心中……"
 SAF_in_the_hearts_desc: "非洲大陆正处于至暗时刻，尤其是南非。随着日耳曼日亚的势力不断向南扩张，民主的最后一丝曙光比以往任何时候都更需要人民的支持。然而，信仰间的分裂与党派间的争执使我们变得脆弱，我们必须立即行动。\n\n不仅要在人民中唤起爱国热情，还要在军队、工人以及所有为南非效力的男女同胞中激发这种精神，唯有如此，我们才能抵御德国的浪潮。必须让所有人铭记：自由与南非本身都是无价之宝，值得不惜一切代价守护。\n\n民族团结是我们存续的基石。不论派系、信仰或阶级，让我们确保每个人都将这一信念深植于心。"
 SAF_gold_for_germania: "日耳曼尼亚的黄金"
 SAF_gold_for_germania_desc: "除了钻石出口外，黄金是南非的另一大出口商品。遍布全国的金矿不仅为超级大国提供了稳定的出口财富，还储存在开普敦的中央银行，作为国家贷款的抵押品，有助于确保进一步的外国贷款。\n\n然而，在处理出口方面，由于南非的中立立场，对出口实行了严格的限制，向华盛顿和日耳曼尼亚出口等量的黄金，以进一步表达中立性。但随着东非的疯子变得越来越无情，明智的做法是将平衡转向德国人，明确南非作为和平贸易伙伴的价值。"
 SAF_ig_farbens_wisdom: "法本化学的智慧"
 SAF_ig_farbens_wisdom_desc: "南非可能拥有充足的原材料以及更大的国内产业链的雏形，但该联合体需要的不仅仅是钢铁和铬。我们缺乏的是化学方面的机构知识和生产设施，应与庞大的德国化工企业合作，以弥补我们在工业生产中的这一盲点。\n\n通过巨额的税收优惠以及与我们大学的联系，我们可以在东伦敦创建一个大型化工联合体，最终为我们提供所需的塑料和其他专业用品，同时为IG法本带来可观的投资利润。"
 SAF_daimler_benz_finest: "戴姆勒-奔驰的精华"
 SAF_daimler_benz_finest_desc: "虽然德国在世界舞台上的声誉可能充满争议和问题，但没人能否认他们的工业产品质量是出名的好。世界最大的出口产品之一是由制造业巨头戴姆勒-奔驰集团制造的德国汽车，该集团已迅速将欧洲大部分汽车制造商纳入其版图。\n\n虽然我们已经努力建设南非的国内工业，但生产汽车仍然遥遥无期，因此我们最好先进口德国卡车以填充我们一直在建设的广泛的新道路网络。\n\n最重要的是，我们同时可以采购少量德制步兵战车，以增加我们的装备数量用于应对骚乱。"
 SAF_and_minds: "…与智识"
 SAF_and_minds_desc: "盲目的爱国主义是远远不够的。越来越多的有影响力的社会阶层人士，包括政治家、知识分子、行政人员，对我们的事业感到不满，原因各有不同。有些人甚至认为这个国家注定要灭亡，我们的命运将受到德国的铁蹄践踏。\n\n这种失败主义心态必须立即扭转。我们必须向他们保证，我们会照顾他们的最大利益，并通过一切必要手段说服他们支持我们的事业。我们需要一点“交换条件”，因为很明显，在他们向我们提供支持之前，他们需要一些甜头，一些不仅仅是保证的东西……"
 SAF_in_our_labour_lies_growth: "我们的劳动，成就我们的成长"
 SAF_in_our_labour_lies_growth_desc: "联合党的权力在很大程度上源于南非的经济腾飞，只要经济保持增长，反对派和内部的分歧都会被控制住。尽管各方对首相的优柔寡断和不作为颇有微词，但没有人会否认自二战结束以来南非所经历的巨大发展。\n\n在大量英国流亡者以及与德国人和美国人达成的贸易协议的推动下，南非正脚踏实地地完成现代化进程。然而所有人都心照不宣的是这种增长很大程度上依赖于对当地多数人口廉价劳动力的剥削。南非还有更多的发展和开拓潜力，尤其是在内陆地区，那里隐藏着丰厚的财富，等待着人们去发现。"
 SAF_southern_connection: "南方互联"
 SAF_southern_connection_desc: "美国南方是一个伟大的地区，也许那里有很多地方总体上并不富裕，但在采掘和农业方面却有丰富的专业知识，南非可以很好地利用这些知识。但最重要的是，在美国南方，我们可以找到与南非人民性格相似的人，他们都是将荒野变成繁荣之地的先驱者。\n\n应该发起一场盛大的宣传活动，旨在吸引美国南部的有志之士来到开普敦，并在目标地区向新移民提供优质土地。更不用说，随着越来越多的白人来到开普敦，我们对其他种族的控制将会变得更加强大。"
 SAF_learn_to_read_and_write: "开普最聪明的头脑"
 SAF_learn_to_read_and_write_desc: "只有南非的白人人口在智力上才有能力处理最高级别的教育和进步。 过去一直是这样，将来也永远是这样。 每一位白人公民，无论其父母多么贫穷，社会关系多么不好，都应该被允许在南非的大学学习，而无需承担债务，从而使有资格从事学术追求的白人有机会更上一层楼。\n\n通过这种方式，（白人人口内部的）平等机会将会增加，更多受过高等教育的白人将协助领导国家的其他种族走向更美好的未来。"
 SAF_transvaal_mines: "德兰士瓦矿场"
 SAF_transvaal_mines_desc: "虽然我们正在努力高度多元化和现代化南非经济，但我们大部分出口以及财富的基础仍然是采矿业。钻石、铁、铬，当然还有黄金，都从地下开采出来，运到我们的港口，然后运往世界市场，这些市场对自然资源永远贪得无厌。作为回报，我们进口技术和现代设备，这将为建立在更发达的经济基础上的更美好的未来奠定基础。\n\n但就目前而言，实现更大经济进步的第一步是进一步开采矿产资源，并加强对更多有价值物质矿藏的勘探。南非是一片广袤的土地，在某个地方，地下一定会有更多的财富在等待着，等待着第一批挖掘者到来，挖掘出埋藏在地下的宝藏。"
 SAF_natals_naval_yards: "纳塔尔造船厂"
 SAF_natals_naval_yards_desc: "二战结束后，南非的铁路和公路网络虽大幅扩张，但我国仍缺乏一支像样的商船队。依赖大英帝国遗留的船队，导致我们面临船龄老化、船员队伍整体竞争力不足的问题，在现代航运环境中举步维艰。\n\n通过对欠发达造船厂提供补贴，并对国内航运集团实施专项税收减免，我国贸易船队现状将得到显著改善。更重要的是，应推动中小型造船与航运企业合并重组，形成更具国际市场竞争力的实体。"
 SAF_a_happy_smile: "幸福的微笑"
 SAF_a_happy_smile_desc: "与北方那些可怕的殖民地不同，南非是一个开明国家，并致力于关怀境遇较差的民众。若任由不满情绪滋长，罢工与骚乱必将接踵而至，共产党煽动分子和非国大蛊惑分子的势力将迅速扩张。\n\n我们将把更多预算投入医疗卫生领域，既是为了维持劳动阶层的生产力，也期望能让他们脸上绽放笑容，对现有生活感到满足。即便这招未必真能奏效，至少也能让动荡局面平息好一阵子。"
 SAF_the_defense_bill: "1963年国防法案"
 SAF_the_defense_bill_desc: "在处理完国内和经济问题后，或许是时候重新关注被忽视的公共部门——军队了。自40年代末以来，尽管获得了来自大英帝国的流亡舰船和飞机的重大助力，军队始终不是优先发展对象。然而，近期与奥斯塔弗里卡紧张局势的升级，促使联合党采取行动通过军事力量来增强我们的威慑能力。\n\n我们将制定一项全面法案来解决军队内部问题，并为陆海空三军提供大量资金，以进一步阻止北方的德国人挑起新冲突。足够强大的威慑力必将有助于确保非洲持久的和平。"
 SAF_the_legacy_of_britain: "大不列颠的遗产"
 SAF_the_legacy_of_britain_desc: "尽管在第二次世界大战中战败，英国的遗产仍在南非海军中得以延续——这支海军正是其直接继承者。大量皇家海军残余力量远渡重洋逃至南非，在轴心国持续扩张的势力范围之外找到了避难所。\n\n十七年后的今天，这些战舰依然在我国海域游弋。那些在流亡中饱经风霜的军官们，如今正为南非联邦效力。大英帝国或许已成过往，但南非仍在非洲大陆骄傲地延续着其传统。凭借经验丰富的核心团队与规模可观的舰船遗产，新增拨款有望助力南非海军焕发新生，打造成为一支战力可观、初步现代化的海上力量。"
 SAF_lesson_from_the_atlantic: "大西洋的教训"
 SAF_lesson_from_the_atlantic_desc: "潜艇一直是海上的灾星，尤其是二战期间肆虐大西洋、对我们护航船队造成重创的德国U型潜艇。基于我国海军指挥官的经验以及声呐技术、反潜艇迫击炮和护航战术的运用，南非应着力保障其与广阔世界的国际联系。\n\n鉴于我国大量进口物资依靠海运送达，且绕行好望角的航线是连接东西半球的全球重要贸易通道，掌握反潜作战能力能在冲突发生时确保关键补给线的畅通。"
 SAF_the_cruiser_question: "巡洋舰问题"
 SAF_the_cruiser_question_desc: "自战列巡洋舰驶入全球广阔海洋以来，各国便将其作为增强陆地火力的补充手段——既无需耗费过量资源建造明显超规格的战列舰与无畏舰，又能规避海军航空兵压倒性的火力射程。\n\n巡洋舰已被证明是替代重型舰艇的更经济选择，在保持海军航程与制海权的同时，既未显著削弱火力又提升了航速。现代巡洋舰队不仅能提供反舰火力，还可为沿岸作战部队提供关键火力支援，这将极大增强威慑力量。"
 SAF_a_green_water_navy: "绿水海军"
 SAF_a_green_water_navy_desc: "南非或许在保持中立方面独树一帜，但这同时也意味着其海军无需远涉重洋。只需巡逻本国水域、守卫自家海岸，不必将力量投射至更远范围。这支海军终于从四十年代迈入现代，运用海军科技的最新进展，打造出一支闪耀的绿水海军。虽任重道远，南非海军仍自豪地巡弋在好望角至爱德华王子岛的海域。\n\n尽管不可想象的危机仍很遥远，但倘若冲突真的发生，南非必将严阵以待。"
 SAF_every_man_a_gun: "更多士兵"
 SAF_every_man_a_gun_desc: "我们与德国专员辖区之间日益紧张的局势，已促使社会各界呼吁全面推进军队现代化。虽然装备升级以及海军与空军的现代化改造是良好的开端，但若没有士兵来为现代化军队提供所需的人力，这一切都将失去意义。\n\n在巩固国防的诸多需求中，关键环节在于扩充常备军规模，并通过新征募兵员壮大后备力量，确保在突发危机时能够满足人力需求。"
 SAF_masters_of_ours_skies: "主宰天空"
 SAF_masters_of_ours_skies_desc: "没有空军，任何军队都无法取得胜利。南非空军的渊源可追溯至第一次世界大战，当时扬·史末资将军在国内建立了飞行员培训体系，为南非航空事业的未来奠定了基础。与海军类似，战争结束时从英国皇家空军引进的飞机为南非带来了一支经验丰富的核心飞行员队伍，而当时的地面基础设施却相对简陋。\n\n尽管南非空军已拥有相当完善的地面基础设施，我们仍可通过扩展雷达站和防空阵地来进一步加强制空权的地面保障体系。最后，还需在全国范围内新建机场和训练设施，以推动南非军事航空现代化，真正让我们成为自己领空的主宰者！"
 SAF_new_pilots_jets: "新飞行员，新喷气机"
 SAF_new_pilots_jets_desc: "英国皇家空军或许已经衰落，但她的经验已得到妥善传承。诸如需要开展广泛飞行员培训、紧跟飞机设计潮流等教训并未被忽视，然而我国空军现代化建设的资金投入历来最多只能算温和。\n\n当昔日的王牌飞行员们追忆着驾驶喷火式与飓风式战机、在接到警报瞬间紧急升空保卫不列颠的岁月时，新一代本土培养的飞行员将驾驶新型喷气式飞机接过火炬，随时准备像先辈们保卫英国那样，肩负起保卫南非的使命。"
 SAF_no_main_benefactor: "货比三家"
 SAF_no_main_benefactor_desc: "尽管我们与自由国家组织有着深厚的文化和语言联系，但保持中立仍至关重要。与其高价购买美国武器，不如将武器采购分散至多个国家，同时在此基础上向国内多家供应商授予合同。\n\n天啊，还需要写第二段但实在想不出内容了。o(╥﹏╥)o"
 SAF_liberty_comes_with_bullets: "自由带来子弹"
 SAF_liberty_comes_with_bullets_desc: "美国是地球上自由的最后堡垒，尽管中立曾是南非采取的明智立场，但众所周知，统一党在所有事务中都明显偏向自由国家组织而非团结协定。中立立场不过是为了安抚如今控制着非洲大部分地区的布尔人和德国人而采取的策略。\n\n虽然从山姆大叔那里采购军火比从不同供应商处获取成本更高，但这不仅能带来政治利益，还能降低我们维护团队的管理成本。自战争结束以来，南非与美国的关系略有紧张，此举既能帮助我们在华盛顿赢得更多影响力，又能获得各类军事装备的稳定来源。"
 SAF_speed_as_a_substitute: "速度取代一切"
 SAF_speed_as_a_substitute_desc: "尽管在地图上看起来可能并不总是那么显眼，但非洲是一片广袤的大陆，常因不同投影方式而被扭曲呈现。南非幅员辽阔，而帝国专员辖区的规模更是极为庞大。虽然坦克的火力与装甲是绝佳组合，但开阔的可机动地形意味着速度可以成为真正的力量倍增器。\n\n依托机械化部队，现代装甲车和步兵战车能为我军提升速度——以装甲防护换取纯粹的速度与越野机动性，使南非国防军能够高速突击并快速转移。当敌军反击时，我军早已远遁，驰骋在草原上寻找下一个目标。"
 SAF_the_real_deal: "真正的交易"
 SAF_the_real_deal_desc: "自第一次世界大战结束以来，坦克始终是战争中不可或缺的要素，它们能突破防线、迂回包抄敌军阵型，从而导向决定性胜利。对于南非国防军而言，现代主战坦克构成的关键战力是无可替代的。\n\n投资升级现有坦克部队，同时为未来能够国产化的现代坦克设计奠定基础，不仅将带来短期战力提升，更将为装甲作战的未来开辟稳健的长远发展道路。"
 SAF_our_bastion_north: "北方的堡垒"
 SAF_our_bastion_north_desc: "贝专纳位于前线，除南面外四面皆被各帝国专员辖区包围。在此情况下，若爆发冲突，根本不可能对整个区域实施有效的前线防御。因此，最佳方案是在贝专纳的首府哈博罗内周边构筑防御工事。\n\n虽然支援当地贝专纳部队能起到一定作用，但若他们能在关键据点据守更坚固的阵地，战局将大不相同。我们北方的堡垒将岿然不动，将非洲人国民大会和奥兰治自由邦武装彻底阻隔在该区域之外。"
 SAF_the_revolutionary_war_doctrine: "阿尔及利亚战争的经验"
 SAF_the_revolutionary_war_doctrine_desc: "与德国人达成协议是完全不可能的，但或许我们可以转而与法国人接触，将其作为一种间接渠道。法国在阿尔及利亚的反叛乱作战方面拥有丰富经验，同时具备沙漠作战经验。假设与德国发生冲突（虽然这种情况极不可能发生，殖民地正深陷内部纷争），沙漠作战必将涉及，因此或许值得派遣几名军官前往阿尔及尔，学习应对叛乱分子及假想敌在沙漠环境中的作战方式。"
 SAF_star_spangled_officer_corps: "星条旗下的军官"
 SAF_star_spangled_officer_corps_desc: "我们何必假装完全中立？德国人清楚，日本人也明白——南非天然且真实的立场就是与美国站在一起。我们根本无需顾虑深化美南关系带来的所谓后果，相反应该大力拓展与美国的合作，特别是在军官培养方面：应当成批派遣我们的年轻军官前往西点军校和兰利受训，学习现代战争的美式打法。虽然南非的军事战略将保持自主性，但汲取多元视角的作战经验有百利而无一害。\n\n至于德国方面，我们只需表明南非与美国的公开往来由来已久，这绝不意味着南非将进一步倒向美国阵营——毕竟我们还有国防军作为战略支点。"
 SAF_between_two_eagles: "三极世界"
 SAF_between_two_eagles_desc: "德国与美国在南非的利益渊源已久，威廉皇帝曾支持阿非利卡人对抗大英帝国。尽管六十年光阴已逝，且布尔战争结束后南非联邦一直蓬勃发展，但德国人与阿非利卡人的联系仍在加深——流亡东非的约翰内斯·范·伦斯伯格便是最坚定的亲德阿非利卡强硬派化身。\n\n另一方面，美国对南非的影响主要集中于开普地区。当地民众情感仍强烈倾向已消亡的大英帝国及更广阔的英联邦国家，但现实力量平衡迫使政府采取严格中立政策，使这个国家在两只盘踞南非上空的饥饿雄鹰之间维持着微妙平衡。\n\n最后还有远在天边却与南非息息相关的日本。尝试接触共荣圈或许能开辟新的出口市场，当然也能进口工业产品，以此推动我国现代化进程。"
 SAF_black_boots: "黑色军靴"
 SAF_black_boots_desc: "尽管我们对北方的德国殖民地存在强烈分歧，但我们拥有共同的敌人。共产主义者和泛非主义者提出种族间政治经济平等的荒谬要求，这必将导致南非陷入灾难性的混乱时期。我们狡猾的对手正利用两国间漫长的陆地边界来回流窜，躲避追捕。\n\n若我们与专员辖区达成情报共享协议，将使边境地区的叛军和政治组织者难以继续隐匿行踪，从而有效清剿这些势力。只要此事保持隐秘，就能在维护法律与秩序方面取得重大成效。"
 SAF_green_dollars: "绿油油的美元"
 SAF_green_dollars_desc: "保持贸易畅通至关重要，而与美国拉近关系显然是明智之举。现在正是访问华盛顿、尝试与美国达成协议的时候，主要目的是降低美国对南非钻石的关税。\n\n当然，我们也需要投桃报李，同意南非国防军只装备美式武器。虽然美制装备质量上乘、声誉卓著，但成本比从其他中立国家采购更高。不过，为了进一步垄断美国钻石市场并将美元带回开普敦，这个代价还是值得的。"
 SAF_our_enemies_closer: "帝国反恐经验"
 SAF_our_enemies_closer_desc: "自日本帝国征服亚洲大部以来，他们便与形形色色的反抗势力展开无休无止的战争。在辽阔疆域与众多国度中，共荣圈的军队与秘密警察以铁腕维持着法律与秩序。\n\n借鉴日本情报机构的经验并与其展开合作，将有助于压制非洲人国民大会，最终彻底瓦解这些猖獗的煽动者。尽管德美两国将对我们的合作表示不满，但作为冷战中的中立力量，我们有权自主选择合作对象。"
 SAF_bygone_empire: "日耳曼尼亚的黄金"
 SAF_bygone_empire_desc: "除了钻石出口，黄金是南非另一项重要的出口资源。遍布全国的黄金矿藏不仅通过向超级大国出口创造了稳定财富，还作为国家贷款的抵押品储备在开普敦的中央银行，以确保获得更多外国贷款。\n\n然而在处理出口事务时，由于南非的中立立场，对黄金出口设定了严格限制——向华盛顿和日耳曼尼亚输送等量黄金，以此进一步彰显中立态度。但随着东非那个疯子的行径日益猖獗，明智之举是将天平倾向德国人，让世人清楚认识到与南非这个和平贸易伙伴合作的价值。"
 SAF_millitary_nazi: "戴姆勒-奔驰的精华"
 SAF_millitary_nazi_desc: "虽然德国在世界舞台上的声誉可能充满争议和问题，但没人能否认他们的工业产品质量是出名的好。世界最大的出口产品之一是由制造业巨头戴姆勒-奔驰集团制造的德国汽车，该集团已迅速将欧洲大部分汽车制造商纳入其版图。\n\n虽然我们已经努力建设南非的国内工业，但生产汽车仍然遥遥无期，因此我们最好先进口德国卡车以填充我们一直在建设的广泛的新道路网络。\n\n最重要的是，我们同时可以采购少量德制步兵战车，以增加我们的装备数量用于应对骚乱。"
 SAF_economic_nazi: "法本化学的智慧"
 SAF_economic_nazi_desc: "南非可能拥有充足的原材料以及更大的国内产业链的雏形，但该联合体需要的不仅仅是钢铁和铬。我们缺乏的是化学方面的机构知识和生产设施，应与庞大的德国化工企业合作，以弥补我们在工业生产中的这一盲点。\n\n通过巨额的税收优惠以及与我们大学的联系，我们可以在东伦敦创建一个大型化工联合体，最终为我们提供所需的塑料和其他专业用品，同时为IG法本带来可观的投资利润。"
 SAF_the_mutual_friendship_compact: "与英联邦接触"
 SAF_the_mutual_friendship_compact_desc: "美国是OFN的强国，但澳大利亚、新西兰和加拿大等国可以成为我们平衡经济战略的重要组成部分。虽然我们尚未加入英联邦，但应尽力在这些国家建立私人联系，希望这种亲缘关系有助于确保贸易协议与合作。\n\n与此同时，我们与大英帝国的联系应当被铭记和尊崇，同时仍保持适当距离以维护中立立场。让那些为捍卫橙白蓝旗帜而牺牲者的名字镌刻于大理石之上，赐予他们最荣耀的安息之地。"
 SAF_the_mutual_friendship_compact_countries_tt: "(§Y[AST.GetFlag][AST.GetName]§!, §Y[CAN.GetFlag][CAN.GetName]§!, §Y[NZL.GetFlag][NZL.GetName]§!, §Y[WIN.GetFlag][WIN.GetName]§!):"
 SAF_uncle_antonio: "安东尼奥叔叔"
 SAF_uncle_antonio_desc: "伊比利亚是第五大强国，其势力范围从欧洲一直延伸到非洲大陆。作为仅存的重要殖民强国之一，西班牙和葡萄牙在非洲保持着可观的影响力，而合并成立的伊比利亚联盟更将这种影响力成倍放大。随着好战的德意志威胁其殖民地安全，以及与罗马关系的持续恶化，伊比利亚已逐渐转向华盛顿——这种立场转变正是我们可以善加利用的。\n\n南非与伊比利亚在战略目标上可谓不谋而合：都力图远离欧洲的新秩序。与伊比利亚合作将有助于我们实现更高程度的国家安全，摆脱公约组织的经济束缚。既然双方抱有如此共识，或许现在正是时候推进与伊比利亚联盟的热络关系——无论德意志将为此恼怒到何种程度。"
 SAF_tying_up_loose_ends: "善后收尾"
 SAF_tying_up_loose_ends_desc: "经济快速增长，非国大那些忘恩负义的家伙也得到了处理，牛车哨兵的入侵也被镇压了下去。德·维利尔斯·赫拉夫可以心满意足地回顾他为维护现状而达成的共识性防御。外部事务已经处理完毕，现在是时候开始处理党内日益激烈的冲突了。\n\n看来，即便是赫拉夫领导下取得的成功和发展，也无法平息党内两位激进分子的矛盾。坚定的保守派领袖沃斯·罗，和崭露头角的统一党自由派领袖科林·埃格林，继续在党的方向以及如何对待土著人民的问题上发生冲突，自由派想要的任何程度的改革都被罗的保守派否决。是时候让总理出面，在这个棘手的问题上找到一个健康的妥协方案了，这个方案不会让任何一方满意，但双方都能接受。"
 SAF_expand_the_prison_networks: "扩展监狱网络"
 SAF_expand_the_prison_networks_desc: "统一党为维护跳羚之国的法律与秩序投入了大量资源，严防任何可能稍许威胁永恒现状的势力。但随着国内动荡持续加剧，我们必须扩建全国范围的监狱和拘留所网络，以满足日益增长的收容滋事者的需求。\n\n随着全国新建监狱落成，任何邪恶终将绳之以法！那些阻碍和平与繁荣的人将被清除出社会，以捍卫国家稳定。更不必说我们新建的监狱网络将对企图抗议生事之徒产生的震慑效应。"
 SAF_rerouting_rivers: "完善灌溉系统"
 SAF_rerouting_rivers_desc: "从采掘业转向农业的经济转型看似变化不大，但南非广袤的耕地和潜在可耕地资源，其价值不亚于地下的钻石矿藏。境内河流纵横交织，多样化的气候适宜各类作物生长，内陆地区发展农业和农场的前景极为广阔。\n\n实现这一愿景的首要任务是完善灌溉系统，将雨水和河水分流至南非的可耕地区。通过建设水坝、运河等水利基础设施，新建农场将为连年丰收奠定坚实基础。"
 SAF_the_roads_to_wealth: "致富之路"
 SAF_the_roads_to_wealth_desc: "任何经济的基础都是基础设施。一个国家在国内运输货物和人员以及自由进出口的能力越强，这个国家就越富裕。南非所有的道路都通往开普敦，但在内陆主要城市之外，南非内陆地区的交通连接还有很大提升空间。\n\n伟大的“非洲道路工程”将为最偏远的村庄铺上柏油路，让卡车运输的物流奇迹将这些村庄与全国更紧密地连接起来。南非内陆地区的互联互通程度越高，不仅能为当地居民创造更多机遇，也能为那些准备在“跳羚之国”内陆地区进行深度投资的冒险企业家打开新局面。"
 SAF_my_friend_pedro: "我的朋友佩德罗"
 SAF_my_friend_pedro_desc: "在南美洲，巴西是当地最大的经济体，和我们一样保持中立，但略微偏向OFN。该国拥有丰富的自然资源，经开采后出口至全球市场。但巴西正处于工业化进程中，仍需要南非能够提供的某些资源。\n\n尽管阿根廷可能对我们与巴西的外交策略感到不满，这仍是拓展双边贸易往来最合理的举措。当前贸易增长虽不明显，但随着巴西工业化程度加深，南非通过对其出口获得的收益将日益增长。"
 SAF_no_shame_in_that: "对话东京"
 SAF_no_shame_in_that_desc: "德国人和美国人已直接且深入地介入南非事务，而第三超级大国则因地理距离和贸易体量始终与我们保持疏远。现在正是迈出新步伐改善与远东关系、尝试与更广泛共荣圈建立联系的时机。首要举措是派遣我国外交部长马雷·斯泰恩前往当地建立私人联络。\n\n虽然地理因素注定我们之间的贸易规模或许难以庞大，但购买我国商品的客户越多，我们的收益就越大。更何况那两个悬在我们头顶的超级大国也无可奈何——毕竟我们是中立国家，且将永远保持中立！"
 SAF_the_african_dirty_war: "广东的问候"
 SAF_the_african_dirty_war_desc: "在斯泰恩访问本土群岛之后，下一个合理选择是造访“广东国”。这个从中国大陆分割出来的企业国家，是日本电子公司私有游乐场的人造政体，企业势力完全掌控着国家命脉。但这个国家始终贪婪地渴求自然资源，其出口的高品质电子产品和设备，正是我们继续推进首相制定的国家现代化计划所亟需的物资。\n\n斯泰恩将竭力接触商界核心人物，向他们开放能使甲州工厂持续运转的丰富矿产资源通道，同时承诺即将在非洲南端为他们开辟企业与消费者市场。"
 SAF_the_iron_arteries: "钢铁动脉"
 SAF_the_iron_arteries_desc: "南非的铁路网络已从最初的内陆简易线路，扩展为遍布全国各地的密集交通网。南非的矿产资源从深远的内陆矿井一路输送至海岸线，确保能向全球市场出口。随着英国流亡者的到来，沿海地区的重要性与日俱增，一条崭新的海岸线路已建成，将从斯普林博克一直延伸至理查兹湾整片海岸。\n\n但我们可以做得更多——将连接网络向更深的内陆推进，持续提升货物与人员的流动效率，从而像铁路一贯发挥的作用那样，进一步推动经济发展。拥有四通八达的铁路网络，我们的发展潜力将无可限量！"
 SAF_loyalist_militias_tt: "§Y六个民兵师将在西开普组建§!"
 SAF_create_a_red_scare: "红色恐慌"
 SAF_create_a_red_scare_desc: "可憎的苏联共产主义理想与南非生活方式截然对立，尽管苏联已被德国粉碎，但列宁的幽灵仍在非洲游荡。它向土著人兜售自由的幻象，却未充分意识到随之而来的邪恶暴政。共产主义会导致饥荒和全民压迫，只为所谓平等的党内精英谋利，并将彻底摧毁南非。\n\n全国上下都应教导民众警惕那些邪恶的赤色分子及其企图颠覆现状者。非国大、南非共产党、泛非主义者大会——所有这些组织及其关联团体都是共产主义活动的巢穴，所有正直的南非人都应与之斗争。但愿这场宣传运动的附带效果是，能让布尔人和德国人对我们更加青眼相待。"
 SAF_prepare_anti_air_systems: "建设防空系统"
 SAF_prepare_anti_air_systems_desc: "南非自1902年以来从未成为战场，而技术自那时起已飞速发展。人们从未想过需要建立防空体系。然而，如今爆发战争的可能性似乎越来越大，这将使我们的国家在空中毫无防备。\n\n未雨绸缪总是好的，我们应当投入精力建设防空系统以防万一。不过可以肯定的是，根本不会有任何事发生，一切都会安然无恙。"
 SAF_the_age_of_helicopters: "直升机时代"
 SAF_the_age_of_helicopters_desc: "经过多年作为新奇事物的阶段，直升机已成为现代战争中的重要元素。它们能穿越敌军防线、执行快速反应任务，即便缺乏基础设施也能实现快速机动，这些特性使直升机成为赢得这场冲突的关键力量。\n\n值得庆幸的是，我们可以借鉴美国直升机部队的实战经验来发展自身力量。更何况美国企业很乐意以相当高昂的价格，向我们提供所需装备。"
 SAF_request_additional_guns: "请求增派装备"
 SAF_request_additional_guns_desc: "如果我们不能妥善装备部队，投入再多人力也无济于事。若要取胜，这场胜利绝不能是惨胜——相比大批装备简陋的士兵，我们更需要规模适中、装备精良且训练有素的作战单位。\n\n比起人员或资金，我们更需要武器、装备、弹药、军服、飞机、坦克等各类物资。维持部队持续作战的物资需求远比对资金或人力的需求更为紧迫。当务之急是争取新一轮租借援助，尽快将美国的新式装备送抵前线。"
 SAF_request_american_loan: "申请美国贷款"
 SAF_request_american_loan_desc: "虽然来自北方的德国大军来势汹汹，但更令人胆寒的是我们预算表上的赤字。收入下降，支出攀升，所有资源都投入到了争取胜利中。然而南非战时经济依然遵循着预算平衡的永恒法则。\n\n当前我们最迫切的是需要一笔贷款来维持经济运转。即便取得军事胜利，若导致南非国内分崩离析，进而引发更严重的分裂和军力衰退，这一切都将毫无意义。既然维持我方持续作战符合美国利益，让国会通过新一轮财政援助方案应该并非难事。"
 SAF_intelligence_cooperation: "情报合作"
 SAF_intelligence_cooperation_desc: "与美国结盟还带来了一项重大优势。尽管由于我们自二战结束以来与OFN保持距离，以及担忧战前潜入我国的德国特工问题，双方仍存在些许不信任。\n\n但随着中情局与我国国家安全局之间的合作日益深化，两个机构在各类战争相关事务上的情报交流持续加强。目前国家安全局尚不及中情局的声望，因此允许美方参与我们在北方的行动实属明智之举。"
 SAF_raid_the_leftovers: "扫荡残余物资"
 SAF_raid_the_leftovers_desc: "众所周知这场战争的严重性，但对南非而言这已演变为生死存亡之战。必须动用所有资源保卫国家，任何事物都不得阻碍这一目标。\n\n尽管美国物资持续运抵，但依然不足。我们库存中每件陈旧过时的武器，哪怕性能低劣，至少能多武装一名士兵。时至今日，从M1917恩菲尔德步枪射出的子弹仍能击毙德国人，正如我们的父辈在一战时期所做的那样。"
 SAF_logistics_by_train: "铁路后勤"
 SAF_logistics_by_train_desc: "自第二次世界大战结束以来，南非的铁路网络迅速发展，在这场冲突中，它仍能通过从海岸向战场输送部队和保持物流畅通来提供巨大帮助。\n\n在物流最易受阻的关键路段投资铁路线路，将有助于确保货物和人员流动畅通无阻。额外的好处是，战争结束后，这个扩建的铁路网络将有助于南非的进一步发展。"
 SAF_logistics_by_train_tt: "§Y$SAF_springboks_march$§!追加效果：\n$modifier_production_speed_rail_way_factor$：[?SAF_springboks_march_railway_speed_temp|=+%2]"
 SAF_bring_out_the_convoys: "调集车队"
 SAF_bring_out_the_convoys_desc: "卡车是处理后勤更为灵活的方式，道路易于修建，且能通过乡间土路运输，使得物资能够贴近战场。\n\n我们应当请求美国盟友提供新型卡车与维修支持，以便实现后勤体系全面机械化，同时确保我军整体上能更广泛地运用卡车进行机动调度。"
 SAF_reborn_under_fire: "浴火重生"
 SAF_reborn_under_fire_desc: "过去几年间，南非经历了飞速变革，这个国家始终在抵抗着德国的猛烈进攻。这场冲突的严峻考验尚未结束，但南非及其盟国依然屹立不倒。\n\n在战火中重生的南非挥师北上，终于实现团结并做好战斗准备。美国援助持续不断，而南非自身也已完全适应战争需求。\n\n前进，为南非前进！"
 SAF_postwar_tree: "战后国策树"
 SAF_the_aftermath: "尾声"
 SAF_the_aftermath_desc: "枪声已然沉寂，外交官们完成了谈判。经历了这段充满剧痛、苦难与危机的岁月，南非依然屹立不倒。作为自由世界的一员，她虽饱经创伤却未曾屈服。来自世界各地的无数将士为捍卫南非的存续献出生命，企图征服整个国家的阴谋已彻底粉碎。\n\n然而当边境安定，生存之战终结之际，那些曾被压抑的内部矛盾将以更激烈的方式浮现。统一党内的分歧日益加剧，那些仍自称为南非子民的人们，正为他们重重困境寻求迅速而决断的解决方案。南非的重建工作必须即刻展开。"
 SAF_the_aftermath_tt: "完成该国策将禁用§Y罗得斯的遗产§!及其他决策机制"
 SAF_pacifying_remnants: "平定残余势力"
 SAF_pacifying_remnants_desc: "南非战事极为混乱，其影响将异常持久。然而最直接的后果是敌军残余势力与普通土匪及犯罪组织在某些城镇村庄形成了巨大影响力。在军队解散、一切恢复正常之前，必须彻底清剿这些残存势力。\n\n我们将发动全国范围的清剿行动，依托当地民众提供的情报和现已完善的情报网络，以武力手段解决这一问题。待平定完成后，即可着手开展后续工作使一切重回正轨。"
 SAF_cleaning_up: "清理废墟"
 SAF_cleaning_up_desc: "烧毁车辆的残骸散落在道路上。整个社区化为灰烬，几名士兵的遗体在阳光下腐烂，而许多人被迫在国内流离失所，成为自己国家的难民。雷区需要清除，冲突中损毁的铁路桥也必须重建。\n\n我国遭受的创伤终将愈合，人民将重返家园，努力重拾生活。清理工作现已正式启动，全体社区将携手投入灾后重建。"
 SAF_demobilization: "遣散部队"
 SAF_demobilization_desc: "我们漫长的武装部队裁减进程终于到来，那些在这场伟大斗争中幸存下来的老兵们终于可以返乡。分阶段实施的复员进程将有助于重振我国经济，人民也将回归家园。\n\n尽管如此，我们将保留一支由老兵组成的专业防御核心力量，以确保像第一次抵御布尔人猛攻时那样屈辱的败绩永不重演。我国北部边境仍是争议焦点，必须派驻兵力并妥善防守。"
 SAF_nationalize_german_assets: "德国资产国有化"
 SAF_nationalize_german_assets_desc: "他们真以为能那样轻易征服我们吗？德国人战前在南非有过投资，如今在美国人的全面支持和安全保障下，所有德国资产都将被强制没收。这不仅能让国家获得短期利益，还将彻底终止与德国的一切贸易往来。\n\n至于这些资产本身，将拍卖给合适的竞标者——那些在战争期间始终站在南非一边的保皇派商人和投资者，或许我们新结识的美国朋友也会有兴趣参与竞标。"
 SAF_ofn_trade_initiatives: "OFN贸易倡议"
 SAF_ofn_trade_initiatives_desc: "南非如今在OFN中占据着关键地理位置，成为连接美国与澳大利亚的右翼纽带。随着德国贸易通道关闭，加上我们作为美国主要盟友的新地位确立，双方所有贸易限制都必须取消。\n\n不仅限于贸易，我们更需要外国投资来帮助南非经济复苏，为这片土地创造更美好的未来。降低商业税不仅能有效吸引美国企业入驻，也将回馈那些引领我国经济发展的企业家们。"
 SAF_american_military_standards: "美国军用标准"
 SAF_american_military_standards_desc: "根据美国理念推进我军现代化的进程在战争期间一直在进行，但现在应当最终完成。我们不仅应要求继续开展培训项目和情报支持，还应立即开始逐步淘汰现有装备，全面换装OFN制造的武器。\n\n缴获的德制装备及原有库存都应向国际市场出售，同时所有国内军事项目都应按美国标准进行改造。最后，应允许美军在沿海地区建立永久性空军和海军基地，以进一步巩固我国防务体系。"
 SAF_promote_anglo_immigration: "鼓励盎格鲁移民"
 SAF_promote_anglo_immigration_desc: "OFN总体而言是一个由美国及其内部联合的英国殖民地组成的盎格鲁-撒克逊传统组织。通过放弃中立立场加入他们一方，南非可以成为吸引OFN移民的理想目的地。\n\n人口结构本身就是一股力量，若想继续掌控南非，我们需要让更多非黑人群体在这片土地上定居以控制人口比例。不仅应当宣传南非的定居计划，还应为符合条件的新移民提供安家扶持。即便是来自中立国家的移民，也应在限制条件下开放，以进一步扩充符合要求的族群人口基数。"
 SAF_a_legacy_restored: "光复遗产"
 SAF_a_legacy_restored_desc: "在荷兰统治下，南非是个闭塞之地；在布尔人治下，南非依旧停滞不前。直到不列颠人到来，这片土地才迎来了属于无线电与铁路、进步与发展的现代纪元。正是英式治理塑造了今日的南非，即便在大英帝国落幕之后，人民仍深切珍视这份血脉联系。\n\n这个伟大国度的子民（在统一党的循循引导下）作出了明智抉择，决心重续历史传承，与我们英联邦的兄弟民族再续前缘。\n\n女王万岁！英联邦伊丽莎白二世女王万岁！"
 SAF_reach_out_to_the_commonwealth: "与英联邦接触"
 SAF_reach_out_to_the_commonwealth_desc: "美国是OFN的强国，但澳大利亚、新西兰和加拿大等国可以成为我们平衡经济战略的重要组成部分。虽然我们尚未加入英联邦，但应尽力在这些国家建立私人联系，希望这种亲缘关系有助于确保贸易协议与合作。\n\n与此同时，我们与大英帝国的联系应当被铭记和尊崇，同时仍保持适当距离以维护中立立场。让那些为捍卫橙白蓝旗帜而牺牲者的名字镌刻于大理石之上，赐予他们最荣耀的安息之地。"
 SAF_reach_out_to_the_commonwealth_alt: "与英联邦接触"
 SAF_reach_out_to_the_commonwealth_alt_desc: "美国是OFN的强国，但澳大利亚、新西兰和加拿大等国可以成为我们平衡经济战略的重要组成部分。虽然我们尚未加入英联邦，但应尽力在这些国家建立私人联系，希望这种亲缘关系有助于确保贸易协议与合作。\n\n与此同时，我们与大英帝国的联系应当被铭记和尊崇，同时仍保持适当距离以维护中立立场。让那些为捍卫橙白蓝旗帜而牺牲者的名字镌刻于大理石之上，赐予他们最荣耀的安息之地。"
 SAF_the_people_have_spoken: "人民已经发声"
 SAF_the_people_have_spoken_desc: "尽管令人痛心，我们必须尊重反对君主制的公投结果。若背弃这一结果，将危及我国政府的合法性，并为敌人送上巨大的宣传胜利。虽然我们与OFN的同盟关系稳固且已确立长期合作，但王室纽带如今已永远断裂。\n\n从今往后，南非联盟将成为一个共和国。但我们永远铭记并珍视盎格鲁-撒克逊传统，并将继续与OFN的兄弟民族保持联结。望加拿大政府未来不会因我们恪守公投结果而过于苛责。"
 SAF_treasonous_voters: "叛国选民"
 SAF_treasonous_voters_desc: "软弱，这就是接受这场虚假公投结果所意味的。将那些集体投票反对君主制的布尔人选票计入，将是彻头彻尾的嘲弄。那些向和平、稳定与繁荣宣战者的选票，凭什么具有丝毫分量？\n\n对于始终忠于南非的人们而言，公投的真实结果毋庸置疑——忠于我们作为英联邦成员的共同历史这一选项本应毫无悬念地胜出。世人皆知如此，任何申诉都无法改变这一事实。南非必将留在英联邦，也必将拥立女王。"
 SAF_your_vote_actually_matters: "你的选票至关重要！"
 SAF_your_vote_actually_matters_desc: "好吧，你们得逞了。君主制已被废除，我们作为大英帝国自治领那段辉煌历史的古老纽带如今彻底断绝。投票者们当然可以沉醉于他们的胜利，但很明显统一党也从中看到了机遇。\n\n以公投结果和我们对此的接受为起点，将本党塑造成一个顺应民意、深切倾听南非人民心声的负责任政党。通过一场盛大的宣传攻势让所有人都知道，联合党是多么尊重每个人的声音。"
 SAF_call_for_elections: "举行选举"
 SAF_call_for_elections_desc: "经济开始增长，道路畅通无阻，国家在重建中取得巨大进步。如今在“山姆大叔”的庇护下，南非正期待再次繁荣起来。\n\n此刻正是提前举行大选、为统一党争取连任的最佳时机。虽然南非民众上次支持该党时的形势已发生剧变，但通过充分的筹备工作，加上某些特殊助力，由德·维利尔斯·赫拉夫总理领导的统一党定能重掌大权。"
 SAF_problems_left_unsolved: "未解之题"
 SAF_problems_left_unsolved_desc: "南非依然屹立。虽已伤痕累累，但橙白蓝三色旗仍在好望角上空猎猎飘扬。尽管生存威胁已然消退，南非仍站在命运的十字路口——那些日益凸显的内部矛盾亟待解决。\n\n与此同时，统一党的名号正随着党内派系重燃战火而日益空洞，而非国大始终是不可小觑的力量。边境以北的动荡将持续影响这个国度，现行体制的局限性也愈发显露。统一党能否维持统治？非国大最终会实现和平权力交接吗？南非将走向团结、分裂，还是重蹈南非战争般的巨大灾难？\n\n不过，那都是后话了。"
 SAF_problems_left_unsolved_tt: "§f选举即将举行。木已成舟"
 SAF_south_african_war_focus: "大灾难拉开序幕"
 SAF_south_african_war_focus_desc: "统一党政府或许在挺过了未遂政变，但它能否在这场战争中存活？牛车哨兵的激进分子正从四面八方越过边境，情报报告表明北方的德国殖民地也在准备介入。随着政府驻地迁往开普敦以及全国迅速进入战争动员，德·维利尔斯·赫拉夫总理领导着一个由忠于开普而非投靠那些自称“阿非利卡人民邦”捍卫者的叛国极端分子们快速组建的战时政府。\n\n随着防线构筑、人员动员以及向全体南非联邦人民发出的保卫号召，局势将陷入混乱。我们必须坚守到美国及更广泛的OFN到来，继而扭转战局。"
 SAF_start_the_propaganda_wave: "启动宣传攻势"
 SAF_start_the_propaganda_wave_desc: "与保卫开普敦和南非自由而战的战士们同等重要的，是通过信息进行的斗争。信息部将大规模扩编，开始向国内外受众传播信息。在国内，需要强调我们为捍卫自由、抵抗邪恶国家社会主义者侵袭所进行的辉煌防御。全体南非人必须、应当且必将面对这一日益增长的威胁奋起抵抗，百年之后人们仍将称颂这是我们最光辉的时刻。\n\n我们的对外宣传将主要针对OFN成员国，强调我们处境的严峻性以及支持南非的必要性。战败的创伤仍萦绕在许多人心中，这将为支持盟军干预对抗德国人提供肥沃土壤。此刻是他们首次真正能够扳回一城，甚至可能向德国复仇，并参与保卫开普敦及南非联邦人民的崇高事业。"
 SAF_exceptional_measures: "温和的铁腕"
 SAF_exceptional_measures_desc: "为了赢得战争，一切手段都在所不惜。即便是那些曾令人难以接受、至今仍让许多人反感的内部隔离措施，也必须予以放宽——毕竟我们面临着更严峻的问题。这场战争反而应当增强我们与土著多数的团结，因为他们非常清楚战败后将面临的命运：奴役甚至种族灭绝，正如德属非洲屡见不鲜的暴行正悬于他们头顶。相较于北方逼近的威胁，他们对我们的任何不满——尤其是对非国大的怨怼——都显得微不足道。\n\n作为战时整体措施的一部分，我们应当给予这些人些许让步，同时强调我们作为抵御北方恐怖势力的最后屏障的角色。非国大虽是群顽固的反叛者，但可以肯定的是，只要战争持续，只要奴役与死亡的阴影仍笼罩他们，他们就绝不会在背后捅刀。"
 SAF_war_economy: "转向战时经济"
 SAF_war_economy_desc: "战争不仅依靠军队与士兵，更离不开枪支与黄油。缺乏补给的军队根本无法作战，终将溃败于敌军。自二战结束与英国流亡者抵达以来，南非国力与财富与日俱增，我们应当善用这份财富巩固国防。虽然统一党憎恶极权主义与政府对经济的绝对掌控，但为确保战争胜利，此类极端手段或许势在必行。\n\n随着政府采取强力措施推动一切公私资源为战争服务，我国整体经济将转向更集中的模式。工厂将转型以满足军队日益增长的需求，华尔部长将负责监督我国经济体制的转型以适应战争需要。或许穿过这条黑暗隧道的尽头，这些变革甚至能在战后为我们带来更强劲的增长。"
 SAF_Bloemfontein_blues: "布隆方丹蓝调"
 SAF_Bloemfontein_blues_desc: "目前，联邦国防军至关重要，需要与国防部长埃尔金协调配合。我们正在制定大规模扩编陆海空三军的计划。幸运的是，尽管存在政治分歧，总理与埃尔金仍是密友，他们将积极解决这一问题。\n\n天啊需要第二段"
 SAF_brown_menace: "情报事务"
 SAF_brown_menace_desc: "国家安全局（简称BOSS）自1949年成立以来，一直是我国主要的情报机构。其成员既有英国沦陷前曾效力于特别行动处、军情五处或军情六处的经验丰富的特工，也有新一代南非情报官员——他们为保卫跳羚之国提供了扎实的谍报技术基础。\n\n然而今时不同往日，为确保战争不仅能在沙漠丛林间取胜，更能在阴暗巷道与敌后纵深地带赢得胜利，我们必须大幅扩编机构并将经费提升两倍以上。约翰·辛克莱爵士过去七年始终执掌国家安全局，他深知此刻能为保卫南非做出的贡献远非当年保卫英国时所能及，现已整装待发履行守护职责。"
 SAF_the_last_light: "最后的光芒"
 SAF_the_last_light_desc: "南非是一个自由开放的民主国家，作为非洲大陆上独一无二的发达国家，我们与遍布殖民者和共产主义者的非洲邻邦截然不同。全世界都应当知晓我们如何抗击德国侵略者的暴行——这些恶徒正利用其南非白人傀儡企图征服我们美丽的国度。这一讯息不仅需向公众传播，更应通过外交渠道传递给可能同情我们的国家。\n\n与此同时，斯泰恩将启程访问OFN成员国，与我们在该组织中的新盟友商讨关于这场战争的关键援助事宜。愿他能带回来自自由世界人民的大量支援承诺。"
 SAF_orange_loyalists: "奥兰治效忠者"
 SAF_orange_loyalists_desc: "若简单地将这场冲突描述为阿非利卡人与英国人之间的战争，那是对局势的严重简化。认为所有阿非利卡人都支持奥兰治自由邦的疯狂叛乱更是大错特错——事实上有许多人反对这些将战火直接引到家门口的家伙。当前正存在契机，通过推动破坏活动甚至游击战争来动摇德国扶植的阿非利卡傀儡政权，从而争取这些人倒戈。所幸BOSS已全力展开行动，正在建立情报网络并接触那些最可能被视作温和派的民众，他们愿意在人民邦内针对奥兰治自由邦独裁政权采取或隐蔽或公开的抵抗行动。"
 SAF_native_rebels: "敌人的敌人"
 SAF_native_rebels_desc: "任何头脑清醒的人都不会考虑武装那些完全反对我们生活方式的泛非本土群体，但时局确实已经危急到必须采取行动，去煽动那些在专员辖区内部长期燃烧的火焰。应当谨慎接触这些势力并为其提供武器，让它们自行完成后续行动，但注意不要过度赋能，以免日后成为隐患。但愿双方能激烈交战，以此方式消耗彼此实力。\n\n至于我们在罗德西亚的待命盟友，应当不惜一切代价为他们的解放事业提供全方位支持。与摩羯座旅的联络渠道已妥善建立，他们破坏德国占领者的行动仍在持续。"
 SAF_the_fight_goes_on: "切断补给线"
 SAF_the_fight_goes_on_desc: "针对人民邦及其幕后操纵者的下一步行动是破坏其后勤系统，削弱他们对南非的攻势，帮助我们扭转战局。多名特工已潜入关键位置，准备炸毁人民邦的后勤网络，包括铁路、桥梁及补给仓库。然而遗憾的是，敌方能在较短时间内修复损毁，这使得此次机会具有时效性——所有进攻行动都需与这些短暂生效的破坏效果协同配合。"
 SAF_recruiting_people: "大规模动员"
 SAF_recruiting_people_desc: "南非人，拿起武器！南非人，拿起武器！让联邦国防军的队伍首先充满年轻志愿者的身影，紧接着便是履行神圣国防义务的应征入伍者。整个开普和纳塔尔地区，志愿者们正就地武装起来投身战事，但我们还需要更多力量。最重要的是建立完善的动员体系，以大规模武装人员——凭借从海外涌入的进口武器和国内激增的军火产量。\n\n尤为重要的是，战争将锤炼他们，当这些战士从彻底击溃敌人的战场归来时，他们将成为淬炼成钢的强悍男子汉，成为联邦未来的中流砥柱。我们最优秀最杰出的儿女必将挺身迎接挑战，坚定不移。为了联邦，为了胜利，为了安全，为了自由——南非人，拿起武器！"
 SAF_millitary_acadamy: "善用老兵"
 SAF_millitary_acadamy_desc: "我们拥有大量二战时期的老兵资源，他们仍有许多经验可以传授给年轻一代。刻不容缓的是，应当征召那些深谙战争现实但因年迈无法再赴战场的老兵，由他们主导训练体系的建立，推行广泛扩展的训练方案，扩充国家军官教育体系，并担任经验丰富的顾问，为众多平生未持枪械的民众提供训练支持。至于那些有能力且自愿的老兵，应征召他们担任军队中的高级职务，成为军官与指挥官。绝不能让宝贵经验白白流失——这些不列颠的老兵们正蓄势待发，誓要与德国人清算旧账。"
 SAF_at_the_war_factory: "发放军事订单"
 SAF_at_the_war_factory_desc: "南非始终坚信自由市场是引导国家走向繁荣的途径——即便当世界似乎越来越转向威权体制和严密的国家经济管控时也是如此。然而在此危急存亡之秋，我们别无选择，只能深度干预经济，将历年积攒的国防储备尽数投入，包括大规模扩张国有企业并实施经济管制。\n\n除限制措施外，最关键的是通过向所有本土企业发放大量军事订单来保障资金流动，全力生产军队所需的一切物资。所有工厂都将改造升级，让子弹、枪械和卡车源源不断产出，直接运往北方前线。这套扩大的工业体系不仅将助我们赢得战争，待开普地区重归和平之日，更将成为我们未来的发展基石。"
 SAF_battle_keeps_going: "公路与铁路，港口与机场"
 SAF_battle_keeps_going_desc: "蒙哥马利将军始终是后勤事务上一位永恒（且恼人）的倡导者，他主张修建更多公路和铁路线路以改善南非北部的补给状况。如今我们虽已获得海外物资输入，却因交通连接不足导致补给无法北上——没有炮弹的火炮无法射击，饥肠辘辘的士兵无法行军，燃料送不到前线则所有坦克都将寸步难行。我们虽占据防守优势，但若不采取极端措施，补给瓶颈将始终存在。\n\n铁路、公路、码头、机场、运输枢纽、物流体系——所有这些都必须以最快速度扩建，其重要性不亚于前线将士的作战表现。相较于过度扩张的专员辖区，我们在这方面具有优势。只要OFN继续提供支持，让补给源源不断输往北方，整个战局就能持续运转不受阻滞。"
 SAF_to_win_the_war: "为了胜利"
 SAF_to_win_the_war_desc: "胜利在望！成功近在眼前。战争初期的兴奋已然消退，局势趋于平稳。此刻正是扭转战局之时——OFN大军压境，南非正全力动员民众与经济投入战争，而战场上，敌人势不可挡的推进已被南非忠诚卫士的铜墙铁壁所阻截。我们即将踏上敌方领土，誓将非洲从一切占领势力中解放。在这好望角之地，灰色威胁的狂潮终将逆转，他们的傲慢必将自取灭亡。"
