 SAF_progressivism_indication_desc: "自第二次世界大战结束以来，南非一直处于政治停滞状态，统一党始终主导着开普地区的选举，国民党则被永久边缘化。但这永恒的现状即将破裂，因为南非将发生巨变，风吹向何方尚未可知……\n\n$TNO_SAF_Decisions_GUI_regime_lean_text$"
