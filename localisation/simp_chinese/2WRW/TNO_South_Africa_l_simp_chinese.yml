 HDV_SAF.97.t: "蔑视虚伪"
 HDV_SAF.97.desc: "“哦，你们都觉得自个儿强多了，是吧？非洲的救世主，一群犹太人的愚蠢傀儡，你们全是。华盛顿牵线，开普照办。”站在临时搭建的绞刑台前的老英国人，在他活在这世上的最后时刻，找到了他的愤怒。“一群恶心的蛆虫，你们全都是。你们以为美国会帮你们在南非维护白种人？不，他们会是你们的祸根，用不了多久，你们就会是在种植园里做牛做马的人！”\n\n准备对他执行死刑的南非士兵们，用一副铁石心肠的面孔，厌恶地看着他。他们无意间撞见他的种植园，以及那几具看似被肢解的土著尸体后不久，就做出了处决这名种植园主的决定。在那装着腐烂、正逐渐分解的尸体的箱子旁边，立着一块牌子，上面写着“努力干活保平安”。哪怕只是匆匆瞥一眼，也能看出这些人，或者更确切地说，这些被奴役的人，曾遭受了酷刑折磨。向那些被迫在这片东非种植园劳作的人打听，便能了解到此地普遍的虐待和酷刑。\n\n种植园主从绞刑台上俯视着行刑者，眼中只有仇恨。他们怎么敢对他进行审判，好像南非就真是什么繁荣或正义的灯塔似的？“所以，这就是你们打算维护你们人民的法子，嗯？在华盛顿那些国际犹太人面前卑躬屈膝，指望着能保住你们那点残羹剩饭，免得共产党人从内部把你们吞了，还有——”一记重拳狠狠打在他的肚子上，把他肺里的空气都挤了出来，他弯下了腰。立刻，他身边的两名士兵将绳索牢牢套在他的脖子上，套得如此之紧，以至于他连话都说不出来，只剩下嘶哑的尖叫和恶狠狠的瞪视。\n\n随着他脚下的椅子被踢开，他挣扎了好一会儿，直到死亡将他带走。士兵们满脸阴沉地注视着，而那些不幸被此人奴役的男男女女们，则只能欢呼。对他们来说，生活有了盼头，不久之后，他们将成为新南非的正式公民，那里的一切只会越来越好。"
 HDV_SAF.97.a: "至少，当时看来似乎是这样的。"
 HDV_SAF.98.t: "玩火"
 HDV_SAF.98.desc: "“安全。”二等兵亚伯拉罕打了个信号，告诉他的搭档向仓库入口处前进。他的搭档，二等兵大卫，飞快穿过仓库，来到一小堆补给品旁，那里放着一套锃亮的M9火焰喷射器。“中奖了！”大卫低声说着，从架子上抓起一支。他溜回亚伯拉罕身边，向他展示着火焰喷射器的精巧设计。他们眼中闪烁着好奇的光芒，仔细打量着每一个细节。\n\n但这两人觉得还不够过瘾，于是把武器拿到外面去“测试”。到了外面，他们在仓库后面找了块荒地，开始摆弄这件精良的美国装备。在亚伯拉罕的帮助下，大卫穿戴上武器，大步向前。“好了，亚伯拉罕，准备好了吗？”大卫说，兴奋之情溢于言表。“嗯，只要别把这该死的基地烧了就成，”亚伯拉罕怯怯地回答，小心翼翼地后退了几步。大卫开始倒计时，准备扣动扳机，期待着从这武器中喷出巨大的火焰，“一、二、三！”他扣下扳机，什么都没喷出来。\n\n大卫觉得，失望过后，他之前几乎所有的期待都瞬间破灭了。“该死！这玩意儿是不是坏了？”他沮丧地说着，徒劳地在武器上搜寻着任何阻碍发射的部件。“给我，我敢肯定你这是碰上个哑弹。”亚伯拉罕说着，从他手里夺过火焰喷射器。“不可能是个哑弹，我敢肯定他们运到这儿之前会测试它的性能的，”大卫答道，仍拒绝承认失败。亚伯拉罕对大卫的固执叹了口气，说道：“大卫，这要是能让你好受点，我可以再试试。但我告诉你，这肯定是个哑弹。”亚伯拉罕举起火焰喷射器向前瞄准，食指搭在扳机上；随时准备开火。\n\n“你确定不想……那啥……挪一挪？”亚伯拉罕对仍站在火焰喷射器射线上的大卫说。“嗯，照你说的，它是个哑弹，所以我没什么好担心的。”大卫带着一丝笑意反驳道。“好吧，”亚伯拉罕说着，然后碰碰运气，再次扣动火焰喷射器的扳机。他用力一扣，本以为这武器会再次失灵，但与他想的相反，一股地狱般的橙色火焰迅速从火焰喷射器的喷口中窜出。火焰径直射向大卫，他被扑面而来的极端热浪打了个措手不及。他制服的一部分在火焰沾上的瞬间就烧了起来。“这就是美国工程学的威力……”大卫说道，似乎被这火焰迷住了。“白痴！趁火还没蔓延赶紧灭火！”亚伯拉罕喊道，他脱下火焰喷射器，冲过去扑火。事后他们迅速归还了武器，却没法向连队解释自己身上为何一股烟熏火燎的味儿。"
 HDV_SAF.98.a: "玩火者必自焚！"
 HDV_SAF.99.t: "意外的支持"
 HDV_SAF.99.desc: "房间里几乎一片寂静，如果忽略天花板吊扇发出的低沉嗡嗡声的话。内阁成员们沉默地坐着，只专注于面前摊开的东西。那是一张南非的当前地图，上面布满了微小的标记和棋子。显然，南非所处的处境并不妙，但内阁成员们谁也不敢点破这明摆着的事实。是格拉夫打破了沉默。\n\n“每次我看这张地图，都不禁想问……”他稍作停顿，被整个局势搞得精疲力竭。“我们究竟是怎么落到这步田地的？”他环顾房间，仿佛在期待答案，但他面前的人们却一片沉默，无法给出任何有意义的回应。格拉夫深吸一口气，开始掏他的雪茄，“上帝保佑我们——”他话没说完，一个声音突然打断了格拉夫。“……希望并未完全丧失。”\n\n房间里所有的头都转向了埃格林，他现在正站在自己的座位旁。“……什么？”格拉夫困惑地问道，雪茄掉在了桌上。埃格林缓缓地一字一句说：“希望并未完全——”“不。我听到了，但我不明白你究竟想说什么。”格拉夫也站了起来，火气越来越大。“德国人和人民邦都骑到我们脖子上来了，正慢慢把我们逼入绝境。这还不够，所有这些该死的运动都在街头抗议，好像这战争还没把我们撕碎似的！”\n\n埃格林咧嘴笑了。“呃，总理先生，我刚要说这个。报告显示，这些运动开始在战争中支持我们了。”埃格林递给格拉夫多份报告，显示南非各地的抗议活动正在减少，而非洲人国民大会对政府的支持正在上升。格拉夫好奇地看了看，然后也对埃格林咧嘴一笑，轻声笑了起来。“至少他们还能分清主次，他们知道要是德国人赢了，他们就会沦为奴隶。”迪夫点燃雪茄，继续说道，“不过，我想这份支持或许能派上用场。眼下，我们可以继续监视非国大，但强制行动可以暂时收敛一些。”"
 HDV_SAF.99.a: "一次暂时的休战，但受人欢迎。"
 HDV_SAF.100.t: "轰炸使之屈服"
 HDV_SAF.100.desc: "非洲的炎热气候让帐篷内变得闷热而污浊。在指挥桌前，威廉姆斯少校审视着地图，上面标着等高线和数字。脱离主力进攻后，他的任务是扫荡仍在乡间活动的叛乱分子；这整整一周的行动成果寥寥，直到他们纯属偶然地发现了敌人的主要藏身之处。\n\n一个小村庄，隐藏着一连精干的布尔人，他们在这整整一周的黑夜里反复骚扰他的部队。这个村庄距离他们仅数公里。这伙布尔人曾被看作甚至难倒了最聪明战术家的谜团，他们总是在夜色掩护下破坏南非军队的行动，天亮便消失在村庄里。\n\n现在，他们要突袭它，终结这场血腥的闹剧。\n\n“长官，A连报告在接近村庄时4人阵亡，6人受伤。B连在村庄西侧的进攻因狙击手而停滞。”\n\n他手中的铅笔开始颤抖，耐心逐渐耗尽。这些布尔人让他的部队精疲力竭，处处受袭；他尊重了战争法，也坚守了自己的道德，但这真的值得吗？一分钟的沉默让传令兵在不耐烦的期待中悬着心。\n\n“命令部队后撤，呼叫炮火覆盖。让他们用105毫米炮弹把整个村庄夷为平地。让后续的近距空中支援轰炸他们的后方。”传令兵发出一声短促的抗议，但碰上的却是坚定不移的决心。“听着，小子，为了保住几栋砖瓦房，正有优秀的士兵在外面送命。我不会再为了一个毫无价值的村子浪费更多人命了。呼叫他们。”\n\n无线电超负荷运转。很快，巨炮的轰鸣和喷气机的尖啸在村庄中回荡，随之而来的是垂死者的惨叫和呼喊。灰色的尘土、黑色的浓烟和橙色的火焰取代了砖红色的房屋。\n\n少校透过望远镜审视着眼前的毁灭景象。那些布尔人已被粉碎，该地区的抵抗已荡然无存。"
 HDV_SAF.100.a: "战争的道德也随之而去。"
 HDV_SAF.101.t: "布隆方丹的陷落"
 HDV_SAF.101.desc: "美制坦克粗糙的橡胶轮胎，溅满了稀树草原的尘土，碾在通往布隆方丹市中心的碎石路上。街道两旁列队，或是透过百叶窗缝隙窥视的平民们，沉默而严肃地注视着涌入他们道路的OFN部队。先前的战斗在士兵们的头盔、机械和士气上都留下了尖锐的凹痕，这从他们沉默的脸上就能看出，但最终OFN取得了险胜。而对于布尔人和德国人来说，这无疑是一场羞辱。虽然战争尚未完全结束，但这仍是一场重大的胜利。一座接一座的城市沦陷，如沙粒般从布尔人的指缝间流失，但这一个是重镇。当然，北边还有专员辖区的问题，但那是以后要处理的事了。\n\n山姆大叔的士兵们迅速着手恢复城内秩序的同时，南非和荷兰士兵则负责看管俘虏，以及在布尔人投降前留守城内的士兵。对美国人来说，布尔人仍被视为渣滓，和他们一路横扫过的其他傀儡没什么两样，但对南非人和他们的荷兰战友来说，他们远不止如此。\n\n“站起来，叛徒，”一个二十出头的开普敦士兵咕哝道。当俘虏开始从碎石路上撑起身子时，这名士兵的步枪狠狠地砸在了他的背上。\n\n“快点，你这该死的蛆虫，”士兵咆哮着，将怒火发泄在这个骨瘦如柴的俘虏身上。“你很清楚自己干了什么，把自己出卖给德国人。你到底有多绝望？但这都无所谓了，”他继续说道，“我们会给你应有的审判，无论需要多长时间。”那名布尔人一言不发地抖了抖破烂靴子上的碎石。\n\n他招手叫来一名兄弟战友，两人押着俘虏向拘留室走去。士兵们押着俘虏沿着寂静的街道巡逻时，他们停住了脚步，因为看到一名正在巡逻的美国士兵。那名美国兵停下来，仔细看了看他们的制服，认出了他们的南非徽章。他默默地点了点头，然后继续前行，心里明白，无论这名布尔人应得到什么样的审判，都必须由他所背叛的人来执行。"
 HDV_SAF.101.a: "正义明察一切。"
 HDV_SAF.102.t: "猪排山之战 第一部分"
 HDV_SAF.102.desc: "4月6日 23:00：对“猪排”山防御工事的炮火准备已开始，目的是将布尔人逼入堑壕和碉堡的防御阵地。该山丘很快被OFN部队占领。孤立的碉堡和散落的堑壕仍由残余士兵据守。布尔人组织了对附近阵地的攻击，对所有阵地施加压力。\n\n4月7日 04:30 - 15:00：布尔人部队攻击该山丘，抵达主要防御工事但遭受重大伤亡（约50%或更多）。持续的炮击迫使布尔人不得不躲入现有工事内。布尔人部队最终控制了碉堡和防御工事。猛烈炮击导致工事内约剩25-30名布尔幸存者，部队因伤亡过重而撤退，由其他部队接防。\n\n4月7日 23:00：OFN部队在炮火下成功夺回山丘，在付出一些伤亡后进入堑壕。更多连队沿山丘右翼推进以规避布尔人的炮火。\n\n4月8日 01:30-04:20：布尔人部队在凌晨发动奇袭，给当面连队造成重大伤亡。虽然险些被突破，但其他连队的反击打了布尔人部队一个措手不及，突袭戛然而止。夜间多次尝试夺取山丘，但此类攻击均未再取得进展。\n\n4月8日 07:15：更多连队增援山丘上的现有部队，肃清了碉堡和堑壕内所有残余布尔人部队，确保了山顶安全。\n\n总结：夺取该目标约耗费77,000发炮弹。约125人阵亡，373人受伤。"
 HDV_SAF.102.a: "就为了一座山头？"
 HDV_SAF.103.t: "奔向河边"
 HDV_SAF.103.desc: "跑，能跑多快跑多快。别停下。别停下跑，否则你会死。别去管远处德国人的声音，别去管脚下被绊倒。忽略一切，只管尽可能拉开距离，因为这是唯一重要的事。\n\n彼得·肯扬·范德比尔，贝专纳兰联邦部长，曾是这个邦国最有权势的人，此刻正拼了命地跑。因为他的命确实悬于此。他在哈博罗内待到了最后一刻，以确保任何罪证文件都不会被发现。然而，他待得太久了，彼得不得不跑。尽管向东的城市已被洪水淹没，向西的道路也已被占领，跑似乎也没多大用处。他唯一能做的就是穿过前面的湖。\n\n彼得能隐约听到远处德国人喊叫的声音。然后他看见了它，一条船，一条独木舟停在湖岸边。他能看到划船的是个目不识丁、粗鲁无知的土著，但现在这都不重要了；他只求活命。“停下！让我上去！我给你钱，好几千！”船夫回过头，脸上露出认出了他的神情。接着，那人的眼神变得冷酷起来，他一推，便将独木舟荡向湖心，留下范德比尔在湖边大口喘气。\n\n先是愤怒，然后是恐惧，牢牢攫住了彼得的心，他环顾四周。片刻后，他听到身后传来一声轻笑。“哎呀，哎呀，这不是范德比尔先生嘛。”他转过身，惊恐地瞪大眼睛，看见一名德国军官正朝他走来，身后跟着一小队士兵。“放我走，求你了，我有很多钱。在外国账户里有好几百万美元。只要你能把我送到边境，这些钱就都是你的了。”然而，彼得的恳求被置若罔闻，那名军官继续大笑着。\n\n“啊，部长先生，对于像你这样的种族叛徒，绝无怜悯。”彼得惊慌失措，转身朝湖水冲去，扑进了水中。"
 HDV_SAF.103.a: "他从未看到那颗子弹。"
 HDV_SAF.104.t: "穷途末路"
 HDV_SAF.104.desc: "阿非利卡男人们如同摆放不当的装饰物一般，耷拉着散布在这栋弹痕累累的建筑内部，随着附近炸弹如雨落下，天花板瓷砖震落的灰尘让他们咳嗽连连，抽着鼻子。他们那破烂的自制制服，在战斗中又添了更多更深的撕裂和破洞，混杂在这些士气低落、汗腻腻的民兵同志中间。在他们心中，从那些为了参战而谎报年龄的未成年男孩，到那些根本不该出现在任何战场附近的年老体衰的人，只有一个念头在脑中盘旋——这就是终点了。\n\n军官和其他阿非利卡部队中较高级别的成员来回踱步，试图麻痹胃中翻搅的挫败感和饥饿感，这种感觉与每个人都承受着的情绪低落交织在一起。一些年纪较小的男孩开始哭着喊妈妈，被遗弃感和悔恨在他们耳中回响，伴随着那再熟悉不过的哭泣曲调。他们在战争初期曾油然而生的希望，他们曾感受到的骄傲，都已消亡。\n\n然而，在他们悲痛的挽歌之中，他们开始听到了……欢呼声？叫嚷声？尖叫声？这不可能。一些还有力气站起来的人聚到一扇破碎的窗户旁，想看看外面的喧闹。骑在坦克顶上的是南非士兵，他们挥舞着橙白蓝三色旗，径直开入阿非利卡人最后的控制区，完全没有遭到抵抗，他们汇入半正式的队列中，因胜利的激动而无法静止不动。有个人通过这场模拟的阅兵发表了一通即兴演讲，对着扩音器唾沫横飞，夸张地模仿和嘲弄着阿尔伯特·赫尔佐格。\n\n羞辱和激愤压迫着楼里的人们，但没有一个人还有力气去真切地感受它。麻木已经掏空了他们的内心。音乐声减弱时，一名军官溜进一间残破的卫生间残骸，锁上了门。一声沉闷的枪响响起，接着是木门后传来的一声闷响。没有一名士兵退缩。无人开口。他们保持着沉默，所有情感都已耗尽。"
 HDV_SAF.104.a: "“彻底无望，他们于沉默中流泪，等待着命运进一步施加于身的一切。”"
 HDV_SAF.105.t: "最后一封信"
 HDV_SAF.105.desc: "我希望我在家。\n\n我希望我在家，而不是在这个世界的另一头某个该死的坑道里，妈妈。如果你最终读到了这封信，告诉马夫他可以拿走我的唱片。在我最后要去的那个地方，我用不上它们了。\n\n乔伊，我希望你别为这整件事自责。是的。我知道你是假装腿有问题才留在后方的。我要是有你那么聪明，我也会那么干的。要是咱们俩都死了，那也没什么用，而且我是咱俩中年纪大的，所以我才不会让我的小弟弟觉得他本该替我去死。总得有一个人在这之后照顾妈妈，对吧？我确实收到了你的信。我希望你遇到的那位女士待你很好。\n\n老实说，我不知道你最终会不会看到这封信。见鬼，也不知道任何人能不能看到。我猜，我是抱着那渺茫的希望，盼着这封信能被什么人从这个地方带出去。我算是放弃了回家的念头，主要是因为我自己做过的一些事。所以我才把这封信写给你们所有人。\n\n我能听到德国佬就在我头顶上，他们迟早要么冲进来把我打死，要么就是我想到的另一个选择：\n\n我设法联系上了师部，炮兵已经准备好朝我所在的这个坑道开火了。这也能干掉几个德国佬，所以我想对他们来说是双赢。不过，从我这里看，这感觉可不怎么像赢。\n\n我猜，这就是像英雄一样去死应该有的感觉吧。要是他们跟你说我死得英勇什么的，告诉他们去他的，因为我害怕。我害怕，我想回——\n\n"
 HDV_SAF.105.a: "其余部分沾满了泥土。"
 HDV_SAF.106.t: "夜半难民"
 HDV_SAF.106.desc: "夜晚一片寂静，整个世界都沉入安眠，炙热的太阳不再悬于非洲上空。这是逃离那个其领袖称之为“大非洲国家共同体”的地狱的时刻，此时，它的受害者们无需再为严苛的工作指标卖命，或遭受更糟的对待。即使是暴君和刽子手也需要睡觉，而这就是土著们能找到的仅有的一点微末解脱。然而事态每况愈下，对许多人来说，死亡和逃亡之间的选择变得相当简单。\n\n每晚，南非边境卫兵都会在边境遇到精疲力竭的难民，这些人除了身上穿着的寥寥几件衣物外一无所有，他们的身体因营养不良而瘦弱不堪。原本只是偶发的事件，如今已汇成涓涓细流，边境巡逻队装备齐全，足以应付这些绝望的人们，他们似乎说着不知所云的非洲大陆各种语言，或是他们昔日奴隶主所用的德语。而这些形容枯槁、许多人濒临死亡边缘的绝望者，还算是幸运的。\n\n许多边境卫兵都是战争老兵。他们见过死亡，见过毁灭，见过许多烧毁或废弃的村庄，在南非战争期间，纳粹暴行随处可见。然而，仅仅夜复一夜地看着这些人，听着他们的故事，似乎就足以在那些可怜的守卫边境的士兵灵魂上留下伤痕。关于恐怖、关于近乎工业规模的大屠杀，以及更多挑战一切人性表象的恐怖故事，向南流传开来，唤起了所有相关人士深深的同情。\n\n即便是南非最坚定的种族隔离主义者，在听闻北方正在展开的这场似乎席卷整个大陆的种族灭绝时，也心生畏惧。对于那些思想不那么根深蒂固的人来说，这正是需要重新审视自己立场的时刻。对进步党而言，这正是采取果断行动的时刻——不仅要帮助难民在南非境内找到安全之地并重新安置，还要向国家的良知发出呼吁。通过这些苦难的故事，他们希望能释放出同理心，引导国家走向更人道、更富有同情心的视角。\n\n毕竟，谁会想把自己拿来和北方那个德国地狱之国相提并论呢？"
 HDV_SAF.106.a: "南非，人性的堡垒"
 HDV_SAF.107.t: "令人憎恶之作"
 HDV_SAF.107.desc: "开始占领这片广袤土地的部分职责，就是进行盘点清查。多支队伍被派往东非被征服领土深入评估情况，南非已在那里建立了一个临时傀儡政权。目标很简单：弄清楚在不至于过度扩张的前提下，这些土地能用来做什么。开普敦没有人愚蠢到认为他们能无限期地控制全部领土，但他们仍然可以施加经济影响。\n\n来自德班的工程师杰克·鲁伊瓦特被派去视察莫桑比克的电网。然而，他的发现让他完全瞠目结舌。事实上，当他踏入一座特别臭名昭著的发电厂时，他的第一句话直白而不容误解：\n\n“这他妈是个什么鬼玩意儿？”\n\n当他穿行在混乱的内部时，只感到一阵阵错愕。这座发电厂简直是混乱的纪念碑：变压器胡乱堆叠，电线像意大利面一样纠结缠绕，看不到任何安全预防措施。党卫军的旗帜默默昭示着它的建造者，却没有任何东西能解释这设计背后的逻辑——或者说，没有设计可言。他踏出的每一步都感觉像走在火药桶上，随时可能被最轻微的火花引爆。要修复它，所需精力和资源将远超直接将其拆毁。\n\n最终，杰克向上级提交的报告中只有一句话：对这位帝国专员灾难性建设尝试的严厉谴责，它注定只能作为一个警示故事被铭记。"
 HDV_SAF.107.a: "完全损失——需立即拆除"
 HDV_SAF.108.t: "机会的开端"
 HDV_SAF.108.desc: "自南非工党并入国民党后，进步党在南非政坛中长期以来只是一个小角色。占据着议会中的少数席位，他们通常被忽视，却依靠哈里·奥本海默持续的资金支持，始终留在政治博弈中。这种支持部分是出于私心，使得进步党的立场比人们预想的更为自由化，但无人质疑奥本海默的进步雄心。所有人都知道新一届大选即将到来，但如今情况不同了，这点人人心中有数。德·维利尔斯·赫拉夫苦苦维持的现状已被南非战争打破，而国家本身似乎也正处于一场巨大变革的边缘。当哈里·施瓦茨和海伦·苏斯曼在进步党总部会面，讨论即将到来的竞选策略时，故事就这样流传开来。这次不同的是，他们的目标不再仅仅是那些他们胜算最大的特定选区。随着国民党的爆发和统一党的分裂，保守派和温和派似乎忙于内部争斗，这给了他们一个前所未有的机会，让他们终于有机会在南非实现一些变革。随之而来的是一项新的选举策略，该党急于为几乎每个能争取到的议席都找到候选人。他们将展现一个团结的阵线，提出一种真正的替代愿景，以取代那种似乎无尽停滞、最终导致国家毁灭的局面，而那些长期盘踞领导地位、垄断权力、扼杀国家迫切需要的任何新想法的老面孔正是罪魁祸首。如今，既然这一替代愿景已经就位，剩下的就是说服投票的公众了。"
 HDV_SAF.108.a: "时代正在改变……"
 HDV_SAF.109.t: "关于非洲人国民大会最新行动的报告"
 HDV_SAF.109.desc: "逮捕并监禁纳尔逊·曼德拉的行动似乎并未如预期般对非洲人国民大会造成打击。由于他们更加分散的组织结构，其运作并未出现明显中断，这使得各个单元易于被清扫。\n\n必须继续进行更广泛的镇压行动，并将重点放在识别和监禁主要领导干部上，以保持非国大处于分裂状态，无法聚集力量。根据“黑皮书”提供的情报，目前领导非国大的人是奥利维尔·坦博。对于一个土著来说，他极为聪明，是少数获准与曼德拉一同进入福特哈尔大学的土著之一，但在1942年因参加学生罢课被开除，此后他领导非国大青年联盟，直到1959年整个组织被取缔。\n\n对非国大的外部支持主要来自喀麦隆非洲国，他们继续向整个非洲大陆传播泛非主义学说。作为回应，国家安全局也向自由法国提供了支持，以制衡喀麦隆。双方之间一场低烈度冲突已在酝酿，并可能演变为争夺西非主导权的战争。\n\n已被迫转入地下的非国大开始组建一个名为“民族之矛”的准军事分支，计划对南非进行武装抵抗，但目前关于它的信息仍然难以捉摸，尚未有任何严重事件证实与其相关。识别民族之矛成员并针对他们获取武器的企图采取行动，应是重中之重。\n\n\n\n为了南非的安全。"
 HDV_SAF.109.a: "无休止的斗争仍在继续。"
 HDV_SAF.110.t: "关于流亡中的牛车哨兵的报告"
 HDV_SAF.110.desc: "从许多方面来看，将牛车哨兵及其成员驱逐到流亡地，反而产生了反效果。如果他们能在我们境内被彻底瓦解，那就能果断地解决这个组织问题，但自从他们流亡后，他们已在所有德国殖民地内定居，同时仍相对靠近边境。来自“磁石”和“托布鲁克”的报告表明，所有适龄的牛车哨兵男性成员持续接受准军事训练，并且牛车哨兵通过卡车进行调动和部署。所有这一切都得到东非帝国专员汉斯·胡蒂格的自愿促成和直接支持。\n\n更令人不安的是，牛车哨兵与阿尔伯特·赫尔佐格领导下的国民党之间仍存在非正式网络。虽然仍缺乏他们直接勾结的直接证据，但这些接触的间接证据十分广泛。牛车哨兵领袖约翰内斯·范伦斯堡、副领袖巴尔萨泽·沃斯特，以及派驻德国人的外交使节罗贝·莱布兰特，都在阿非利卡人中保持着广泛的联系，其中相当一部分人对牛车哨兵呼吁建立“人民邦”的理念抱以同情。\n\n毫无疑问，以胡蒂格为后盾的武装斗争正是牛车哨兵的意图，但关于时间表的任何迹象尚不明朗。牛车哨兵的宣传手段已相当程度地渗透进南非的阿非利卡公民中，但如果认为这是统一支持，那便大错特错。许多阿非利卡人对联邦感到满意，认为没有必要用一场只会壮大非洲人国民大会的武装斗争来破坏和平。必须采取措施击退牛车哨兵任何越境的企图，并在北德兰士瓦增建额外防御工事，同时建议增加比勒陀利亚周边的军事部署，并加强对赫拉夫总理及统一党主要部长的安保措施。地理条件使得比勒陀利亚极易遭受任何越境行动的攻击；因此，应做好准备，以便在紧急情况下将所有政府职能转移至开普敦，国家安全局已启动相关准备工作。\n\n\n\n为了南非的安全"
 HDV_SAF.110.a: "一场风暴正在地平线上酝酿。"
 HDV_SAF.111.t: "潜伏在侧"
 HDV_SAF.111.desc: "约翰内斯·范伦斯堡透过窗户向外望去，看到成百上千的阿非利卡人步调一致地齐步行进，如同机器般运转顺畅。这一幕暖热了他的心，他感到一种深深的自豪，但也伴随着一种责任感。确保这些年轻的白人能够摆脱南非盎格鲁压迫者，过上自由的生活，这副担子就落在他的肩上。范伦斯堡心中闪过一丝遗憾，转向他的客人。“如您所见，贝尔先生，牛车哨兵的小伙子们已为那场不可避免的斗争做好了准备。在得到东非政府的持续支持下，只要获得充足的补给，数万名士兵就能投入冲突。”范伦斯堡转过身来，看到房间内聚集的其他人，大多是牛车哨兵成员，但也有几名东非官方代表，他们似乎面带微笑。“这些人看起来确实训练有素。我相信胡蒂格先生会非常乐意支持你们在南非的事业。”\n\n听到这番话，范伦斯堡感到一阵胜利的喜悦。“你们做出了明智的选择，贝尔先生。我们将共同努力，粉碎盎格鲁侵略者对这片土地的控制。你们的日耳曼同胞，阿非利卡人，已经被压制了太久。我们驯服了这片土地，给它带来了繁荣，然后英国人来了，从我们这里夺走了我们应得的土地。英国人把我们关进集中营，对待土著却仿佛他们不只是动物。他们将我们踩在脚下，但很快，我们将再次崛起的时刻就要来临。”\n\n范伦斯堡微笑着。“牛车哨兵曾被当作恶棍驱逐，但我们将归来——”"
 HDV_SAF.111.a: "以英雄的身份。"
 HDV_SAF.113.t: "激情之作"
 HDV_SAF.113.desc: "杰克·温特斯或许是世界上最幸运的人，因为他的工作正是他的爱好。每天，他都会准时出现在开普敦的澳大拉西亚军械公司，手持纸笔投入新型载具与武器的设计工作。这个天生的劳模随着战争爆发愈发废寝忘食，近乎疯狂地推进着新型原型车的研发。\n\n他最新的作品，大羚羊装甲车，此刻正在北方战场驰骋。这款配备双联M1919勃朗宁机枪或90毫米迪奈尔GT-2主炮的机动载具，正以惊人速度穿插德军阵地，对薄弱环节实施致命打击。而搭载60毫米K1迫击炮的改型，则用密集火力覆盖着德军加固阵地，让敌人在轻型装甲车的炮火中瞠目结舌。\n\n但杰克的野心远不止于此。南非绝不会像布尔人沦为德国附庸那样成为OFN的仆从国，不，它将作为平等伙伴屹立，拥有长期自保的能力。要实现这愿景，南非必须能更多地在本土生产。\n\n从百夫长坦克的蓝图入手——这款因德国入侵而夭折的英国设计——杰克开始对其进行大规模修改，尽可能多地替换为国产替代品。在控制复杂度的前提下，他坚信，在战争紧迫的催逼下，南非完全有能力迅速将这些图纸化为现实。"
 HDV_SAF.113.a: "他称之为“大象”"
 HDV_SAF.114.t: "致歉外部秘书"
 HDV_SAF.114.desc: "尊敬的广东外部秘书LASTNAME阁下，\n\n地理环境向来是决定一国兴衰的关键因素。尽管南非与广东国远隔重洋，但自广东立国以来，我们两国间的贸易持续稳步增长。曾有一时，我们双边关系的未来似乎充满希望。然而，南非面临的地缘政治现实已发生剧变。在我国遭受残酷攻击之后，我们唯一的生存希望如今系于美利坚合众国。\n\n然而，获得这种援助，随之而来的便是无法回避的条件——其中最主要的，即是对整个共荣圈实施全面禁运，这项措施源于美利坚合众国与日本帝国之间日益加深的地缘政治敌意。因此，从明天起，我们将对所有来自共荣圈的船只关闭港口，自此，我们两国间的一切贸易将永久停止。尽管南非联邦政府本仍乐于进一步发展双边贸易关系，但我们最终别无选择，唯有对贵方实施此禁运。\n\n我希望此事已充分通知到贵方。\n\n签名，\n雅各布斯·施特劳斯\n"
 HDV_SAF.114.a: "南非联邦外交部长"
 HDV_SAF.115.t: "蓝衣男孩"
 HDV_SAF.115.desc: "斯特凡·B·考伍德中士短促而凶狠地扫视着他的部下。他们是警察，不是士兵，然而此刻他们却在此防守城郊附近一个重要的十字路口，抵御着大批敌军。他们倒空了市内各警局武器柜里的家当，按级别和队列组织起来，每人配备了霰弹枪、老式李-恩菲尔德步枪，或任何能到手的枪支，无论生锈与否。他们传递着一个快没油的打火机，他与几个从退休中爬出来为民主事业而战的老同事回忆着往事。他参加过上次战争，侥幸脱逃未被俘，现在却又被拖回了战火，被困在沙袋墙后，夹在废弃房屋和一座被洗劫过的警局辖区之间。\n\n一声枪响从他听力范围的上方传来，砖块和灰泥溅在他的蓝色作训服上，将他从回忆中惊醒。他迅速从墙角探出头，看到了他们。布尔人到了。他懊恼地扔掉香烟，一边下达命令，一边又被一阵红色砖尘的暴风浇了一身。紧接着是枪声的刺耳交响。一辆维克斯装甲车转过街角开火，扫倒了数名冲锋的布尔人。战斗持续了不到十分钟，斯特凡始终在嘶吼着命令，但当太阳落山时，布尔人撤退了，街上散落着尸体。看来他们暂时守住了防线。太阳毫无预兆地沉入冰冷的休眠，将最后的生命光芒洒在装着饼干和牛肉的简陋钢制配给盒上。斯特凡不安地睡着了，他知道布尔人会回来的。\n\n第二天一早，在一阵爆炸的冰雹中开始。斯特凡从睡梦中被震醒，发现自己一如既往地满身尘土。那辆维克斯装甲车也如往常般转过街角，向聚集的布尔人开火，但这次，他们没有被扫倒。它用力过猛，冲向道路另一侧，撞进了一栋现已废弃的办公室。建筑在一片尘土和瓦砾中倒塌，枪声回响，陷入混乱的警察只能盲目地还击。在破烂的沙袋后面，斯特凡的掩体爆炸了——沙子如同碎玻璃般飞溅空中。意识到此刻的绝望，他咬紧牙关，将哨子举到嘴边，在整个郊区吹响了刺耳的尖啸。他的声音撕裂了混乱，尖锐而不屈，在疯狂中命令出新的指令：一场无望的撤退。\n\n他拖起步枪，与几名混乱的战友一同奔逃，穿过城市街道，脑中只剩下一个问题。"
 HDV_SAF.115.a: "军队他妈的到底在哪儿？"
 HDV_SAF.116.t: "远离故乡"
 HDV_SAF.116.desc: "不列颠群岛事态的消息在南非引起了巨大反响，正如南非人为保护自由而与德国殖民地作战一样，许多人也希望不列颠能再次摆脱德国暴政重获自由。有些人不敢奢望，想起1956年那场失败的起义，知道解放不列颠的希望渺茫至多。对其他人而言，这是自由世界浪潮高涨的又一个迹象，正击退那些曾将世界自由人民踩在暴虐铁蹄下残忍碾碎的压迫者。\n\n对于德·维利尔斯·赫拉夫的内阁来说，一种截然不同的情绪压倒了其他所有。沮丧。要是他们现在处在和平时期，他们本可以倾其所有，向不列颠叛军提供一切可能的物质支援，整个流亡的舰队将组成一支光荣的庞大舰队返回，这次是要从不列颠群岛的暴政下将其解放。然而，当英勇的叛军们在远方奋战时，南非除了道义支持和友善言辞外，什么也送不出，没有任何办法真正影响结果，这结果只能留给美国人和加拿大人民为了自由事业而倾尽所能。\n\n尽管南非将击退浪潮，他们同样会努力关注在不列颠群岛进行的战斗，长久以来第一次，对一个或许能再次向世界举起明亮火炬的自由不列颠燃起了希望。"
 HDV_SAF.116.a: "除此之外，无能为力。"
 HDV_SAF.117.t: "开普敦的陷落"
 HDV_SAF.117.desc: "“求求您先生，我和家人带着钱呢……”排在最前面的男人拼命推搡开铁丝网围栏里惊慌失措的同胞们，声嘶力竭地朝开普敦国际机场跑道外的空勤人员喊道。“很抱歉先生，但OFN部队现在需要全权使用跑道。我实在无能为力。”\n\n“什么，他们霸占我们的跑道就为了丢下我们？！”男人吼道，这声呐喊显然道出了人群的普遍心声。在最后撤离阶段留守机场的OFN特遣队一直在城郊殊死抵抗，阻止德军和布尔人靠近，却无暇顾及平民的命运。把守着铁丝网缺口——这是平民进入跑道的唯一入口——的两名武装人员紧握着他们的美制M14步枪，瞪着日渐沸腾的人群，但从桌山方向传来的一声炮弹巨响无疑提醒了他们，这里才是更安全的地方。\n\n分分秒秒过去，开普敦市民的咆哮声越来越大，直至盖过了最轰鸣的飞机引擎声。最终，守卫们再也无法维持秩序，人潮的巨浪压倒脆弱的铁丝网围栏，汹涌而下。如同液体从破裂的玻璃瓶中涌出，男人、女人、儿童和手提箱开始漫溢到黑色的混凝土跑道上。那男人搂着妻子，拽着孩子，冲在涌动人群的最前面，奔向最后一架美军运输机正在闭合的尾舱门。当那黑色的舱口在几米外开始关闭时，他不顾机舱内士兵的惊叫，将他们两人都推过了金属翻板的边缘，眼睁睁看着妻子的蓝裙角消失在那飞机里。失魂落魄的母子攀附在树脂玻璃后窗上，望着飞机驶离时，父亲的身影迅速远去。\n\n母亲和孩子擦去雾气，将手掌按在冰冷的玻璃上，好让那迅速缩成一个小点的人影留在他们的指缝间。当泪水模糊了他们的双眼，他们看着丈夫和父亲在那片黑色旷野中越变越小，孩子的脑海中只燃烧着一个念头……"
 HDV_SAF.117.a: "他们还会回来吗？"
 HDV_SAF.118.t: "又一次徒劳的尝试"
 HDV_SAF.118.desc: "哈里·施瓦茨整了整他的深红色领带，这是他在无数场官司中养成的紧张习惯。他已经相当擅长在法庭上戴上一副自信的面具，而在处理像这样毫无胜算的案子时，这一招尤其管用。\n\n他的当事人，即被告，是威尔逊·琼斯。19岁。单身。黑人。在当地一家工厂工作。无犯罪记录。被指控的罪名呢？企图炸毁开普敦的一个警察局。警方“发现”了一个未引爆的爆炸装置藏在警局的一个壁橱里，而威尔逊曾在该地区附近被目击。这对他们来说就足够了，足以当场逮捕他，并对他提出恐怖主义指控。现在，当施瓦茨准备向全是白人的陪审团做结案陈词时——这个陪审团几乎肯定会判定有罪——他必须做出最后一次绝望的呼吁，以保护他的当事人。\n\n“对我的当事人琼斯先生提出的指控非常严重。检方声称，这名男子成功潜入警局，同时携带一个鞋盒大小的爆炸装置，关闭了所有摄像头并销毁了录像，闯入警局后方，然后神不知鬼不觉地溜出来，直到他离开后才被发现。除此之外，检方在他们的案情陈述中声称，他是在没有帮助的情况下，独自完成的这一切，没有经过事先培训，也与任何团体没有联系。”\n\n“现在，陪审团的女士们先生们，我希望你们看看我的当事人，”施瓦茨说着，戏剧性地伸出手臂指向琼斯，“然后看看你们看到了什么。威尔逊不是什么顽固的罪犯；他只是个孩子。一个非常不幸的孩子，恰好在错误的时间出现在了错误的地点。他可能是你们任何一个人的儿子，”他冲着陪审团挥着手说道，“某个夜晚走在街上，恰好出现在犯罪现场附近。我希望你们在做出裁决时能考虑到这一点，想想这个无辜的男孩，他的父母今天也来到了法庭，我希望你们能做出正确的决定。”\n\n而陪审团也确实考虑了，他们在7分钟内完成了审议。“本庭裁定被告威尔逊·琼斯先生……”"
 HDV_SAF.118.a: "所有罪名成立。"
 HDV_SAF.119.t: "分裂之家"
 HDV_SAF.119.desc: "迪夫非常清楚，这一刻已经酝酿许久。长期以来，统一党的三个派系一直在自我争论和辩论，但尽管存在分歧，他们仍团结一致治理国家；进步派和保守派这两个对立派系一直维系在一起……直到现在。当沃斯·罗在几位重要保守派人物的支持下，未经通报便闯入他的办公室时，接下来要发生的事已是明摆着的了。\n\n“沃斯，请省省你的演讲，直接说你想干什么吧。”迪夫以一种近乎轻蔑的方式，继续整理着他桌上的文件。\n\n“正是这种态度，迫使我和我的盟友脱离统一党，组建新保守党，我们将与你和你所结盟的那些毫无意义的滥好人竞选。”沃斯怒视着他。\n\n“比那更重要的是，在我们专注于南非重建之际，不应制造政治动荡，”迪夫回应道。“新保守党是打算在下一届任期内继续留在政府中，还是我们要在重建过程中制造一场毫无意义的政治危机？如果和平之后政府立即垮台，我们又能获得多少外国投资来处理我们国家遭受的创伤？人民会如何看待你个人不负责任地在本已危机四伏之际，再给我们国家添上一场新的危机？这对你的民调可没好处，不是吗？”\n\n两人互相瞪视，停顿了片刻，沃斯在权衡他的选择。“我们最多再支持政府一年。在那之后，你的政治生涯就结束了。”\n\n迪夫点了点头。“谢谢你。”当保守党人离开时，他继续阅读报告，他们脱离统一党这整件事此刻算是稍微平息了下来。但无论如何，他们对制造更多动荡不感兴趣，不久之后，他们就能将进步派从权力和影响力中彻底排挤出去。"
 HDV_SAF.119.a: "毕竟，还是一个分裂的党。"
 HDV_SAF.120.t: "渐趋暗淡的火炬"
 HDV_SAF.120.desc: "那曾是一个美好的时刻。那一刻，一切似乎都在向好，全世界都将奋起反抗德国人，一劳永逸地粉碎他们的暴政。自由的火炬，民主的火炬，以及人类更高远抱负的火炬，将再一次照亮世界。但那个时刻是短暂的，如今不列颠，大不列颠，又再一次被锁链束缚、奴役，并破碎于德国的铁蹄之下。\n\n对于那些渴望回到他们真正家园，回到那广阔无垠绿地与和缓起伏丘陵的人们来说，这是一剂难以下咽的苦药。从流亡中光荣回归将不复存在；如果有的话，如今这流亡恐怕将是永久性的。而就连这，也仍处于步步紧逼的德军及其布尔傀儡的威胁之下。不可否认，失去一个自由的不列颠影响巨大，但从某种意义上说，其实际冲击力仍相对沉寂。\n\n威胁仍在，战争继续，而且仍有真正获胜的机会。橙白蓝三色旗仍在好望角上空飘扬，更多援助继续从美洲滚滚而来，更多志愿者日复一日地抵达，坚定地捍卫着南非。\n\n火炬或许已略显暗淡，然而自由的信念依然留存在每一个奋起抵抗并与德国人战斗的人心中。他们没有人能够改变不列颠的命运，但或许，他们仍然能够改变南非的。"
 HDV_SAF.120.a: "因为南非尚未迷失"
 HDV_SAF.121.t: "来自家乡的温暖问候"
 HDV_SAF.121.desc: "换了其他任何时候，这批各式各样的装备都会被称为过时的垃圾。但在南非，在这场规模宏大、消耗巨大的冲突中，任何装备都是有用的，也是最受欢迎的。然而对开普敦的码头工人来说，最重要的莫过于印在板条箱侧面的那条信息。\n\n一份来自不列颠的礼物，如今它已挣脱了锁链，不再受德国摆布，由美国海军守护，并能自由地送出援助。这仍是一个被18年剥削、奴役和征服弄得一贫如洗的国家，但它认为应该向南非的斗争提供物资援助。从某种意义上说，这将成为两国关系重燃的起点，两国因历史和共同的自由事业有着不解之缘。\n\n倒不是说那些要装备上这些二战步枪、老式PIAT反坦克武器和旧军装的人会多高兴收到它们。但数量本身也是一种质量，一个装备了旧式英国装备的师，总比那些只拿着削尖棍子与德国人作战的可怜虫们要强得多。从某种程度上说，南非使用英国旧货的这一行为，不过是由来已久的一项传统延续，自1816年不列颠获得开普殖民地以来便是如此。\n\n德国曾在那里被击退，而现在，OFN英勇的士兵们将彻底把德国人从非洲赶出去。"
 HDV_SAF.121.a: "不列颠人送来他们的问候"
 HDV_SAF.122.t: "来自伦敦的斥责"
 HDV_SAF.122.desc: "伦敦白厅街10号 SW1A 2AA\n\n亲爱的德·维利尔斯·赫拉夫，\n\n我谨代表不列颠共同体，对南非政府对其占人口多数的土著居民所扮演的角色，始终感到不安与厌恶。自你们奴役他们的体制诞生之初，就必须采取步骤，赋予他们彻底自由这项基本人权。你在担任首相期间，一直在为这个不人道体制的错误打圆场，而遗憾的是，不论是对全世界的劳动者还是对我本人而言，我都绝不容许不列颠再与这样一个残暴政权继续交往下去。\n\n此事关系到你的政府向国家做出的承诺，而这些承诺如今必须不分种族地适用于每一位南非人。我不会允许这种制度化的隔离在共同体的领土范围内持续存在。南非人民普遍遭受巨大的财富和社会不平等，在这种可憎的种族等级制度延续下，他们无法工作，更无法生存。\n\n倘若这种情况继续下去，不列颠将彻底与南非断绝关系，除非你们能废除制度化的种族隔离，并给予你们的土著公民正当的权利和让步。这是来自自由世界的第一次，也是最后一次正式警告。若你拒绝，接踵而至的制裁与孤立，将是我们能对这个国家施加的最严厉措施。\n\n我相信你会斟酌自己处境，并在此事上做出正确的抉择。\n\n此致，\n首相 杰克·琼斯，不列颠共同体。"
 HDV_SAF.122.a: "祖国真是彻底堕落了"
