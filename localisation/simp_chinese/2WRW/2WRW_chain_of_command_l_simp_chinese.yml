 RUS_chain_of_command.1.t: "指挥链"
 RUS_chain_of_command.1.desc: "经过多年的血腥努力，我们夺回了俄罗斯肥沃的土地。前方没有别的道路，除了穿过莫斯科的道路。\n\n在持续的战争岁月中，我们的总参谋部从未懈怠。他们共同成长，并各自贡献自己独特的经验，创造出了独属于我们的结构和文化。我们拥有了我们作为简单战争国家所没有的优势。我们拥有将军们的信任和支持——如果我们幸运的话，还有士兵们的支持。这场即将到来的斗争不会凭运气而胜利。如果我们要在与德国帝国主义的斗争中取得胜利，我们必须无情地利用这些独特的技能。我们必须识别和理解这些独特的才能，否则我们最优秀的头脑将会闲置，我们的军队也会因此变得虚弱。"
 RUS_chain_of_command.1.a: "士兵们，枪上肩！"
 RUS_chain_of_command.2.t: "救赎或牺牲"
 RUS_chain_of_command.2.desc: "“你知道你为什么在这里吗？”几十个半饿的败类静默无声。他们望向天空或脚下，从不看亚佐夫的脸。他们是因为羞愧，还是因为无力面对他们的上级？“你们在这里，”亚佐夫说，“是因为你们辜负了自己。通过懦弱、犯罪活动或懒散，你们选择了背叛自己。更糟糕的是，你们背叛了你们的家庭、政府和国家。”亚佐夫向右边示意。“士兵，请向前走。”\n\n一个年纪仅有十六岁的年轻人从亚佐夫身后的庞大队伍中走到格拉科韦尔赫的身旁。他用机械式的准确度行礼。“我是亚历山大·塞缪诺夫下士，听候您的指挥。”\n\n“士兵，你出生在哪里？”\n\n“我是在佩尔姆海姆被黑色联盟及其士兵解放的，长官。”\n\n“那你为什么选择加入黑色联盟？”\n\n“先生，我必须为我母亲复仇。雅利安兄弟会强奸并谋杀了她。我有责任为了我的家庭和我的国家摧毁这种野蛮行径的根源：日耳曼民族。”\n\n亚佐夫点了点头。“说得好。现在，塞缪诺夫下士，如果我命令你自杀，你会这样做吗？”\n\n这个年轻人畏缩了一下，但点了点头。“如果我的死有助于我们对大审判的准备，那么我会遵循您的命令。”\n\n“谢谢你，塞缪诺夫下士。”亚佐夫说。他转身再次面对那些下流之徒。“你，在那里。”他指着一个特别可怜的家伙，一个面色苍白、弯腿的家伙，满脸青春痘。“如果我命令你为了大审判而自杀，你会遵循我的命令吗？”\n\n“你疯了吗？混蛋！”那个家伙说，“不，我当然不会！”\n\n亚佐夫毫不犹豫地拔出左轮手枪，朝那个叛乱者的眼睛开了一枪。脑浆喷洒在空中，将他身后的老鼠们沾满了一层记忆的细雾。“这是你们的第一课，”亚佐夫说。“背叛你们的国家，你们已经判定了自己的死刑。唯一的问题是你们的死亡是否毫无意义，或者能为比你们自己更伟大的目标服务。”"
 RUS_chain_of_command.2.a: "欢迎加入赎罪旅"
 RUS_chain_of_command.3.t: "巡查日"
 RUS_chain_of_command.3.desc: "\"站住，士兵！你完全搞错了！\"\n\n科津将军在泥泞的院子里大步走着，甩开身后的一群西装笔挺的军事检查员。在整个营地的另一个场地上，一群筋疲力尽的新兵们距离自杀只差几秒钟。将军的两名助手瞪大了眼睛，然后紧随其后。\n\n\"把那该死的步枪给我，\"科津说道。他从士兵手中夺过那支旧的AK-47，汗水顺着年轻士兵布满痘疤的脸颊流淌。\"瞧，你距离自杀只有两秒钟的距离。\"这位秃顶的将军拉开了步枪的枪栓，从弹膛中弹出了一发未发射的子弹。他笑了起来。\"你有兴趣亲吻一颗子弹吗？我没有。别再在我的军队里搞砸了。\"\n\n科津站起身来，走到他们身后，进入这些新兵称之为家的营房。这里有八张床位，每张都铺着刺人的灰蓝色床单。悬挂在林地地板上方的灯光闪烁不定，上面都被死苍蝇覆盖着。房间的对面，联邦的旗帜歪歪扭扭地挂着，还有...灰尘？七个年轻人站得站姿不整，很快被那位将军救过命的士兵加入进来。其中两人的发型不符合规定，五人的鞋子没擦亮，还有三人的裤子上有油渍。\n\n\"天啊，一群猪一样的家伙，\"科津将军说道。\"你们在红军里连五分钟都活不了。我能给你们弄点什么？果汁？修指甲？也许一个更好的枕头，这样你们可以小睡一会儿？\"\n\n\"不需要，长官！\"士兵们高声回答。\n\n“该死的，我应该把你们的中士送上军事法庭。如果总统在这里，他会气得揪住自己的头发。”科津感觉到手指下破损的步枪木材。“实际上，我有个主意。我们来看看你们是否在听课时认真听讲。如果你们中有人能在我之前安全地清洁和组装好步枪，我会给你们两天假期，我个人出五百块。”房间里的列兵们兴奋起来。“但是如果我打败你们所有人，我会让你们工作得连睡觉是什么样子都记不起来。”\n\n其中一名列兵举起手。“但是，长官——”\n\n科津大声打断他。“开始！”"
 RUS_chain_of_command.3.a: "\"准备好迎接有生以来最惊艳的屁股踢击吧。\""
 RUS_chain_of_command.4.t: "白色高顶军帽"
 RUS_chain_of_command.4.desc: "\"LEGIO！\" 排长们异步地喊道。尼古拉伊·鲁梅恩采夫咬紧牙关，准确地注意到每一个错误，这是他熟练的特点。\n\n\"PATRIA！\" 排长们把胳膊伸得笔直——理论上。实际上，新兵们的手臂摇摆，有太多人在行动之前犹豫不决。\n\n\"NOSTRA！\" 这些士兵们还有很长的路要走，才能准备好加入陛下的军队。那是肯定的，就像太阳升起一样。\n\n整个排进行了一个拙劣的转身，毫无将军鲁梅恩采夫和他的参谋们几小时前展示的精确和谨慎。\"主啊！拯救俄罗斯！带来！她的和平！\"\n\n\"够了！\" 鲁梅恩采夫将手一挥，脸上带着痛苦的表情。\"你们都在丢我的脸，每一个人。我还不如睡在桥下。\"他摇了摇头。\"先生们，我们会进行这个演习，直到你们做对为止。直到你们展示出为我们的沙皇和祖国服务所必需的纪律。准备好熬一个漫长的夜晚吧。\"\n\n低声的抱怨和半心半意的\"是的，长官\"从无精打采的排长中传了出来。\"不，不，这样不对，\"鲁梅恩采夫说道。\"我的国家的士兵们不会抱怨当他们被要求做出牺牲的时候。排队！\"\n\n俄罗斯士兵们摇摇晃晃地排成了一列。将军走到队伍前面，默默地伸出拳头。每个新兵都走上前，用额头撞击他的指关节，留下了瘀伤和伤口。每个士兵都自罚，有些甚至比他的兄弟们打得更狠。甚至有一个人敲掉了一颗牙齿。\n\n演习一直持续到次日凌晨03:00。到最后，新兵们已经受伤、出血、筋疲力尽。但是，终于，他们已经准备好为国家服务了。"
 RUS_chain_of_command.4.a: "别再唠叨了。我们有一个文明需要拯救。"
 RUS_chain_of_command.5.t: "人民公仆"
 RUS_chain_of_command.5.desc: "米夏·莫洛佐娃擦去滚烫的眼泪，打开家门。“你——你好？”\n\n站在她家门口的竟然是帕维尔·巴托夫元帅，笔直如钢梁。他的帽子被夹在右臂下，目光直视前方。“莫洛佐娃夫人，我可以进来吗？”\n\n“当——当然可以。对不起，房子乱糟糟的，我一直没有时间清理，因为——“\n\n巴托夫举起手打断她的话语。“我理解，莫洛佐娃夫人。在这种情况下，我想我也不会做得更好。”米夏勉强露出一个虚假的微笑，让这位军官进入房内。“你的家很美，”他说着，在地垫上擦拭着脚上的灰尘。\n\n“这是我们家族传承了五代的房子。我想我会是最后一代了。”\n\n巴托夫略微皱了皱眉头。“对不起。有什么我可以为您做的吗？“\n\n”你能把我儿子从死亡中带回来吗？你能够倒转时间，让我能够跪在他脚下，求他不要加入你的军队吗？\"莫洛佐娃哭泣着，但她拒绝掩盖自己的眼睛。”亚历克谢在他的一生中从未做错过任何事。他总是保护他人，总是对抗恶霸。正是这样他遇到了他的妻子。但我们失去了娜塔莉娅，现在…“\n\n“我真的很抱歉。如果我失去了我的玛格丽塔，我无法想象我会做什么。”\n\n“你什么都不会做。我的生活已经结束了，将军。我的生命随着儿子的离去而结束了。”\n\n帕维尔皱起了嘴唇，深吸了一口气。“莫洛佐娃夫人，当我参与对抗黑色联盟的行动时，您的儿子在我的指挥下服役。格拉科韦尔赫派出了一支精锐部队追捕我，名为‘博加提尔行动’。我无法告诉你，在他们发现我们的那晚，我们和他们战斗了多久。但您的儿子一直在我身边。博加提尔的领导人，一个名叫帕斯塔诺戈夫的狂热、非人的士兵，闯入了我们的指挥所，抓住了我的喉咙。我以为我要死了。但是亚历克谢——对不起，您的儿子——射杀了他。他救了我的命。之后发生的一切都要感谢他。感谢您，以及您为了抚养他所作出的牺牲。”\n\n他深吸了一口气。“莫洛佐娃夫人，我真是感激不尽。我无法减轻您的悲痛。但是，请您理解。您的儿子是一个英雄。”"
 RUS_chain_of_command.5.a: "他拯救了俄罗斯。"
 RUS_chain_of_command.6.t: "在我父亲的印象中"
 RUS_chain_of_command.6.desc: "鲍里斯·克里洛夫独自坐在书房里，他父亲的扶手椅的粘腻皮革紧贴着他的皮肤。空气中弥漫着香水的气味。一本旧的平装书已经从书脊处半脱落，放在他面前。但文字早已化为文学的浆糊。他喃喃自语道：“我不知道自己为什么还要努力，这一切一点也不讲道理。”\n\n时间难以确定。从他的眼袋来看，已经过了午夜，尽管太阳尚未升起。他的壁炉中那壮丽的火焰早已熄灭。房间很冷，他也饥肠辘辘，但他的注意力却在别处。\n\n桌上摆放着一瓶进口的苏格兰白兰地，鲍里斯从书架上抓过来，尽管他发誓在父亲去世后不再饮酒。它本应只是装饰品，多么愚蠢的事，只是一个令人敬畏的物品，用来吓唬访客。但鲍里斯发现自己的手指在杯口上来回摩挲，惊叹于玻璃的透明度和液体的纯净。他把瓶子倾斜了三十度，然后又放回原位，看着一滴异国白兰地迅速流回杯底。\n\n也许这会让他感觉好些。\n\n这个念头已经不止一次出现在他脑海中。他的父亲饮酒——大量饮酒——以至于就连国王卫队都认为他可能有自杀倾向。这似乎使他成了另一个人——不是更快乐，而是更平静，更能应对君主必须克服的残酷任务。鲍里斯不是国王。也永远不会是。即使他高高在上的位置对他来说也太多了。他需要悲伤，休息，弄清楚他的家庭、他的国家、他整个生活方式发生了什么。没有任何事情再有意义了！\n\n鲍里斯·克里洛夫的手指环绕住瓶颈。他想象着抬起它，将凉爽的玻璃放在嘴唇上，倾斜着倒入他那疼痛的喉咙。天哪，他可以品尝到白兰地的味道，感受到它燃烧着他的喉咙，承诺着甜蜜的陶醉。\n\n如果它能让他感觉好一点就好了。\n\n鲍里斯松开了瓶子，用一个动作将其推到桌子边缘。它沉重地掉到地上，发出了一声沉闷的声音，但没有破裂。国王的儿子恼怒地看着它，它开始在他最喜欢的地毯上洒出昂贵的酒液。"
 RUS_chain_of_command.6.a: "领袖不能被分心"
 RUS_chain_of_command.7.t: "救赎日"
 RUS_chain_of_command.7.desc: "“斯捷潘诺夫军官，请进。”自从米舒连科将军上次见到这位年轻人以来，他已经长大了。那是多年前，当黑军只控制着坎斯克和布拉茨克，还没有远东战役和琐碎的争吵。然而尽管经历了所有的磨难，斯捷潘诺夫将军的儿子仍然是一个纤瘦、颤抖的小屁孩。\n\n“米舒连科同志，我……我不确定我为什么在这里。”米哈伊尔·斯捷潘诺夫说道。\n\n“实际上，我认为你知道原因。”米舒连科说道。他开始在桌子上敲动手指。“斯捷潘诺夫同志，你认为自己是一个称职的军官吗？”\n\n米哈伊尔用手抓了抓头发。“我一直都，嗯，一直都试图履行我的职责……”\n\n“试图。并不成功。”米舒连科站起身，向前倾身，高耸在桌子和年轻军官之上。“同志，我们距离开始收复莫斯科的战役只有片刻时间。我们有来自俄罗斯各地最杰出的士兵，从革命前线的前成员，到已经改变立场的反动派。你能诚实地告诉我，你配得上领导一支抵抗纳粹的民兵部队吗？”\n\n斯捷潘诺夫发现自己凝视着将军的胸口，无法直视他的眼睛。“不行。”\n\n“你之所以成为军官完全是因为你父亲的影响力。”\n\n“没错。”\n\n“并不是因为你的才能。是因为你的名字。与我们的理想几乎毫不相称。”米舒连科深吸一口气。“然而，你所在部队的成员们，虽然不情愿地告诉我，你在后勤问题上非常熟练。毕竟，你救了我们许多饥饿的战友。”将军从办公桌后走到年轻人身旁，把手放在他的肩上。“在即将到来的战争中，我们需要每个人都在他们最擅长的领域服役。不是为了个人利益，而是为了人民的利益。让位吧，让别人接替你在前线的位置，加入我们的后勤部门。我们需要一个有点谦卑的人。”\n\n斯捷潘诺夫笑了起来，像面对绞刑架的人一样。“那我父亲会说什么呢？”"
 RUS_chain_of_command.7.a: "\"别再想着你的父亲了！是时候从他的呵护下走出来了。\""
 RUS_chain_of_command.8.t: "留个心眼"
 RUS_chain_of_command.8.desc: "“你知道吗，我在第聂伯捷尔任斯克冶金技术学院当了整整一年的校长，”勃列日涅夫将军说道。他吸了一口烟。“你真的以为我们不会发现吗？”\n\n“将军，请，我不知道你在说什么！”乌拉尔汽车厂的秃顶、肥胖的厂长在勃列日涅夫的脚边挣扎着，把泥土弄脏了他的裤子。他的手腕和脚踝被绑住，眼镜上沾满了油渍。\n\n“这是个相当聪明的计划，”勃列日涅夫说道。“将卡车新制造的零件替换成旧的备用零件，然后再把新的零件在黑市上转手卖掉。我相信你让你的合作伙伴们发了笔横财。”他再次吸了一口烟。质量比他在无政府时期抽的恶心烟要好得多。当然这要感谢他在阿尔汉格尔斯克的朋友们。“我只是希望我早点想到这个主意。”勃列日涅夫将烟蒂扔向厂长的头部。\n\n厂长惨叫着，烟蒂烧到了他身上。“你要对我做什么？”厂长哭泣着说道。\n\n列昂尼德叹了口气。“恐怕我得开枪杀了你，我的朋友。”\n\n厂长挣扎得更加激烈。“等等！我有家人，我女儿才七岁。求求你了！”\n\n将军耸了耸肩。“我不指望你能改变我的想法。”他从皮套中取出手枪，并检查了枪膛。“再见，我的朋友。也许我会给你女儿寄一张圣诞贺卡。”\n\n“不！”厂长举起双手，仿佛那能挡住子弹。“我——我愿意和你一起分享这笔交易！五五开！”\n\n“不值得我花时间。”勃列日涅夫把手枪的枪口放在厂长的头上。\n\n“七三开！”\n\n列昂尼德微笑着。“九一开，同志。”他娴熟地收起手枪，扶起那个胖子。“走吧，让我们把你洗干净。”"
 RUS_chain_of_command.8.a: "如果你把今天的事说出去，我连你女儿一起杀。"
 RUS_chain_of_command.9.t: "战争骗术"
 RUS_chain_of_command.9.desc: "军士朱尔根·舒尔茨眯起眼睛，用粗糙的手掌遮住眼睛。“长官，我好像看到了点什么。”\n\n中士施瓦茨狠狠拍了一下他的后脑勺。“什么东西？鲸鱼？烟草种植园？一只该死的驴子跳桑巴？说具体点，否则我就把你送回萨克森州。”\n\n舒尔茨揉着后脑勺，略带痛苦地转回头看向东方。“看起来像是一辆坏掉的车，长官。很新。车窗上有个写着‘需要帮助’的标志。”\n\n中士咕哝着。“奇怪。边境这一段不应该有定居者的活动。舒尔茨、福伊特、沃尔夫，跟我来。”四名士兵握紧步枪，朝着远方走去，扫视着地平线。每个人都预料到会遭遇埋伏，尽管不确定埋伏来自何方。他们一边走一边检查地面，经过痛苦的经历，他们已经做好了应对捕熊陷阱或陷阱坑的准备。施瓦茨中士则留意着狙击步枪的闪光。\n\n十分钟后，四名士兵平安地走到了那辆车旁。那里没有人。中士跪在泥土上，步枪抵着肩膀，用两根手指指向车辆。“舒尔茨，轮到你了。”\n\n朱尔根战战兢兢地走向那辆被遗弃的卡车。它是一辆褪色的绿色车辆，漆面剥落，有些地方生锈，挡风玻璃破碎，轮胎被划破。一张手写的乞求字条斜斜地贴在后窗上。\n\n朱尔根小心地打开驾驶员座位的车门。里面没有人。但是有一张折叠着的纸条放在驾驶座上。朱尔根捡起来，展开来读。“亲爱的法西斯分子，欢迎来到俄罗斯，”上面写到。“好好享受你们的访问。致以爱意，科涅夫元帅。”\n\n接着，隐藏在汽车引擎盖下的炸弹爆炸了，四名士兵再也没有知觉了。"
 RUS_chain_of_command.9.a: "狠毒的暴毙方式，弹片伤口……"
 RUS_chain_of_command.10.t: "小心行事"
 RUS_chain_of_command.10.desc: "尊敬的同志们，这辆坦克设计实在不好。马尔克希耶夫将军坐在一张新绘制的蓝图前，蓝图上展示着T-52的一个版本。这个庞大的布里亚特人的眼睛在纸上快速扫过，每隔几秒钟就会停下来看着另一个缺陷，以军事的精确度记录下每一处失误。\n\n\"马尔克希耶夫同志，我们知道您并不是有意不尊重，\"首席设计师亚历山大·伊万诺维奇说道，\"但是恕我直言，您并不是一名工程师。\"\n\n\"也许不是。但是在特维尔战斗时，我对我的T-52进行了数百小时的维修工作。\"马尔克希耶夫说道，脸上露出了灿烂的笑容。\"当然，我一直都愿意接受同志们的修正意见。\"\n\n\"我们也是如此。\"伊万诺维奇咬牙切齿地说道，\"请问，将军，您有什么担忧？\"\n\n\"履带。在特维尔，德国人会用地雷瞄准我们的履带，试图让我们失去行动能力。您发明了一种全新规格的履带以适应这种宽度。但是最重要的是，我们需要廉价、大量的备件来保持行动。否则，坦克就会落后。当它回到前线时，战争可能已经结束了！\"米哈伊尔用手指嗖嗖地弹了弹。\"另外一件事，为什么我们没有包括标准化的无线电发射器？还有许多剩余的R-113型无线电来自伟大的卫国战争。\"\n\n\"我们打算让部队使用手持无线电进行通讯。\"\n\n\"不行！一点也不行！\"马尔克希耶夫摇了摇头。\"你会给整个苏联装甲军队都带来震荡。一会儿还在老公路上疾驰，密切留意豹式坦克。下一秒，你遇到了路上的坑，啪！你该死的无线电向你挑战拳击比赛。不，不，我们下一款车型需要集成无线电。\"\n\n\"我们需要吗？\"伊万诺维奇开始在桌子上敲击手指。\"我们被命令制造一种更便宜的坦克，用于大规模生产的目的。\"\n\n马尔克希耶夫笑了笑。\"而我被命令重新夺回莫斯科，同志。\"他拍了拍工程师的肩膀。"
 RUS_chain_of_command.10.a: "带着另一份草稿来我家吧，我请你喝酒。"
 RUS_chain_of_command.11.t: "寸步不退"
 RUS_chain_of_command.11.desc: "鞭子打在空中，发出嗖嗖声，狠狠地抽在那名少年的背上。他的皮肤已经青紫遍体，此刻终于破裂，一道粘稠的血液沿着脊椎缓缓滴落。德米特里·乌斯捷诺夫一次又一次地打击着他，凶狠的力道似乎随着每一击都在增加。训练营的其他人目睹着，看着他们曾经的战友发出苦苦哀求的声音。\n\n最终，这名前士兵跪倒在地，虽然他的双手被绳索捆绑在木桩上，没有完全倒下。乌斯捷诺夫朝他吐了口唾沫，然后转向数十名士兵围观的人群。“当面对一个士兵所能犯下的最可怕的罪行时，我该说些什么？”乌斯捷诺夫说道，“逃兵不仅仅是对你的职责的背叛，不仅仅是对你的诺言的背叛。它是对我们军队每一个！士兵！的背刺！”\n\n乌斯捷诺夫擦去额头上的厚厚汗水。“军队的运作依赖于信任和忠诚。当你们，同志们，投入战斗时，你们必须知道你们的战友会与你并肩作战，他们会为国家和部队而战。当德国人来杀你时，他们会毫不犹豫地为保护你而献出生命。而这个人——”乌斯捷诺夫指着哭泣的囚犯，“背叛了这份信任。他告诉你们每一个人，他的生命比你们更重要。他简直就是亲手勒死了你们。你们准备就这样袖手旁观吗？”\n\n短暂的犹豫后，整个团队表现出关切。紧接着，观众席后面的一个魁梧男子松开了双臂。“他妈的不会！”\n\n乌斯捷诺夫点了点头。“很好。”他走到最近的士兵面前，将鞭子交给了他。“你们每个人都要打他一下。如果我看到有人没有给他你们最强的一击，你们也会跟着他一起受罚。”"
 RUS_chain_of_command.11.a: "“现在，排好队。”"
 RUS_chain_of_command.12.t: "东方反苏军事组织案件"
 RUS_chain_of_command.12.desc: "格里金·卢什科夫将手指轻抚在手术刀的刃上。“古尔根，古尔根，古尔根，”他慢悠悠地说着，笑着说道。“我不明白你的想法。为什么要抵抗呢？你只是给了我一个享受自己的借口。”\n\n前将军古尔根·阿瑟兰茨挂在天花板上，一丝不挂。脚踝上锁链牢牢地将他的手腕扭曲到背后，他踮起脚尖，双脚上布满了淤伤。强烈的聚光灯照亮了他充血的眼睛。紫色的淤伤和流血的伤口破坏了他刚刚剃光的头部，他身上褪色的棕色斑块标志着两根断裂的肋骨所在的位置。\n\n“我们知道你与日本人合作，”卢什科夫说道。他将一堆文件扔到阿瑟兰茨的脚边。“还是你打算辩称你在满洲的照片是搞错了人？”\n\n古尔根咳出一小勺血，抬起被打得遍体鳞伤的头。“我是受命行动的……”他喘息着说道，“受命渗透到预备役联盟中。亚戈达知道！问亚戈达——”\n\n“亨里希·亚戈达对这种所谓的渗透一无所知，”卢什科夫说道。“没有记录表明你得到过这样的任务。”\n\n阿瑟兰茨再次低下了头。“你销毁了档案。”\n\n“我从未这样做过。而且，我们有数十份宣誓书，证明你持有萨布林主义和修正主义的倾向，你质疑联盟的领导，参与派系斗争，试图分裂党派。你否认这些指控吗？”\n\n囚犯呻吟着。“拜托，我忠于祖国和联盟。请您饶恕我，我求求您了！”\n\n卢什科夫一巴掌拍在他的后脑勺上。“所以你承认了！你承认你需要怜悯！想想看，我曾经称你为同志。人民的革命不需要也不从怜悯中获益，我们不会为恐怖行动道歉！”卢什科夫抓住阿瑟兰茨的下巴，把他的头向上一推。他用另一只手拿着解剖刀，凝视着这个痛苦不堪的可怜虫的眼睛。“现在，我已经擅自准备了你的书面自白。你可以在上面签字，或者我们可以继续。”"
 RUS_chain_of_command.12.a: "“你自己选。”"
 RUS_chain_of_command.13.t: "挖挖洞"
 RUS_chain_of_command.13.desc: "亚历山大·帕夫洛夫将军看着51步兵旅那些沾满泥土的新兵们。这个旅队主要由来自秋明的年轻男子组成，由于前政权的政治影响，高层指挥认为他们不够可靠。帕夫洛夫打算让他们纠正过来。\n\n他们一起排练现代军事行动中最基本的动作——挖掘战壕。这是这个世纪的基本任务——为了微薄但必要的防御而摧毁你的家园的一部分，并与你身旁的战友一起为了解放而奋斗。因此，他们满头大汗地准备着自己所负责的防线。\n\n但他们搞砸了。帕夫洛夫走上其中一座高高的土丘，他的身影在正午的阳光下投下了一道长长的阴影。他像个老师一样讲话，他的学生连两个数都不会加。\"俄罗斯士兵们，我必须问你们一个可怕的问题。被占领的莫斯科在哪个方向?\"\n\n旅队的士兵们互相看了看，最后对准了挖战壕最右边的那个书呆子。感到众多目光盯着自己，他捂住了眼睛，看了看太阳，然后指向西方。\"那边，长官！\"他的声音最近才学会如何放大。\n\n帕夫洛夫点了点头。\"那我必须问，你们为什么往四面八方扔泥土？如果你们知道敌人在哪里，关键是在你们与他们之间设置掩护。或者你们是想掩护你们的后方吗？\"\n\n士兵们站着，有些人双手插在口袋里，有些人前后晃动脚掌。帕夫洛夫忍住了一声不专业的叹息。“先生们，我向你们保证，我们的政府没有维持任何形式的政治委员制度。我们并不因意识形态纯洁性而监视您。在我的部队中，只有一个问题需要回答。你们是否恨纳粹？你们是否足够恨他们以致于杀死他们？只要答案是肯定的，我就站在你们这一边。现在，请纠正这个错误，否则我会把你们的口粮送给猪吃！”"
 RUS_chain_of_command.13.a: "白军需要的是俄罗斯人，而不是意识形态者。"
 RUS_chain_of_command.14.t: "我们的宿命"
 RUS_chain_of_command.14.desc: "\"将军，我们明天继续。晚安。\"\n\n\"明白，晚安，部长。\"\n\n已接近午夜，当天的最后一次会议刚刚结束。沃尔科戈诺夫退到书房，审视着为即将到来的战争制定的计划。他几乎无法相信。就在昨天，俄罗斯的'帝国'还是远东一个贫困的公国，在各个战线上进行消耗战，勉强生存。如今，帝国走了这么远。单发步枪变成了现代突击武器，骑兵变成了装甲车辆，一个由怨毒的老人组成的压迫性军政集团如今成为了一个现代的君主立宪制，他们几乎是从故乡偷走了一个仁慈的皇帝。\n\n过去的十年改变了一切，也改变了每个人。沃尔科戈诺夫对陛下走过的道路印象深刻。他受人爱戴。是最后一位罗曼诺夫皇帝的外国出生的远亲，但仍然是罗曼诺夫家族的一员。作为一个罗曼诺夫人，沃尔科戈诺夫认为，引领俄罗斯走出黑暗是他的使命。当沃尔科戈诺夫思考着命运的概念时，他突然有所领悟，几乎从椅子上跳了起来。这不仅仅是米哈伊尔的命运在实现，还有白军的命运。远东的战争，向阿尔汉格尔斯克的进军，以及如今对德国的战争。帝国取得如此巨大的进步，是因为上帝如此命定。无论是伊尔库茨克和布里亚特的布尔什维克，还是结雅和柏林的纳粹，甚至是车达本身的军国主义者，白军注定要解放俄罗斯人民，恢复上帝在俄罗斯的王国。\n\n沃尔科戈诺夫打开日记本开始写字：“这就是为什么这场战争如此重要。它不仅将是俄罗斯历史上最大的战争，还将决定整个俄罗斯的命运。这场解放战争将要么证实，要么否定白军的命运。”"
 RUS_chain_of_command.14.a: "命运掌握在上帝的手中，塑造着尚未塑造的事物。"
 RUS_chain_of_command.15.t: "林荫牧场"
 RUS_chain_of_command.15.desc: "“强者将继承地球，”茨瓦津巴赫将军说道。“当我说地球时，我是字面意思！”他站在沃洛格达的营房中，数十个年轻而肥沃的雅利安人敬畏地注视着他。那里又黑暗，又拥挤，充满了汗臭味。“兄弟们，当我们的元首提到种族战争时，他是字面意思。这不仅仅是战场上的战争，而是遗传和精神的战斗。这是一场国家之战。”\n\n“当我们在战场上获胜时，莫斯科将首次在三十年里被雅利安人掌控。你们知道莫斯科里有什么吗？土地。绿色的田野，适合耕种和抚养良好的雅利安子女。你们知道要怎样才能生出良好的雅利安子女吗？”\n\n一个头发凌乱的年轻人从房间后方喊道：“女人！”\n\n“没错，女人！那些妓女很多，绝望而孤独。没有人保护她们。为什么，你甚至不能在越过边境警卫五英寸的地方不小心踩到那些没有父亲的少女。死去的兄弟，死去的丈夫——没有人保护她们。”他舔了舔嘴唇。“没有人会想念她们。”\n\n站在茨瓦津巴赫将军左手边的一个头发稀疏的中士笑了起来。“德国女人？”\n\n“定居者，是的，那些无法返回德意志的定居者女人。俄罗斯的妓女，尽管我觉得你们已经对她们厌倦了！”房间里的每个蛮子都欢呼雀跃，为自己的勇气互相祝贺。“还有阿塞拜疆人和塔塔尔人，如果你想要一些异国情调的东西。芬兰人、乌克兰人、格鲁吉亚人。你所想要的任何类型的贱货都会属于你们。”\n\n他拍了拍手。“所以，兄弟们，当我们谈论战争时，不要想象战斗的荣耀。想象一下用你们的种族充实莫斯科专员辖区的荣耀；想象一下你们内心的战争！履行你们的职责，杀死那些不可取的人，终身的快乐将属于你们！”"
 RUS_chain_of_command.15.a: "这个观点，即“妇女权利”，只不过是犹太智囊团的一个创造。"
 RUS_chain_of_command.16.t: "举枪，瞄准……"
 RUS_chain_of_command.16.desc: "中尉雷沃尔达·巴拉巴诺娃带领着她身后的五名士兵转过拐角。街道上肮脏不堪，到处都是垃圾和碎玻璃，在脚下发出嘎吱嘎吱的声响。她微笑了。该死的，有一双新靴子真好。她得记得给战友军需官普列奥布拉热恩斯基送一瓶伏特加酒。\n\n巴拉巴诺娃将步枪瞄准眼前的街道。“有目标吗？”\n\n“没有，长官，”她身后的那名士兵说道。“确认，什么都没有，”另一人回答道。\n\n“太好了。我们赶紧完成任务，回家吃晚饭。”雷沃尔达放下步枪，搜寻着无尽的屋顶和小巷，寻找射手。街对面，一块被单独的链条撑起来的生锈招牌断裂，掉到地上。她畏缩了一下，但继续沿街前行。一、二、三次心跳过去了，却没有出现敌人。他们难道打算让她的小队就这么轻易地闯进去吗？\n\n雷沃尔达迈出最后一步，感觉到一根毫厘见长的绊索被扯断。就在她惊愕地眼睛睁大的时候，她才看到金属丝闪烁，它绕在一根路灯杆和附近商店的门之间。一辆生锈汽车里隐藏的炸弹爆炸了，溅得她和身后的两名士兵满身鲜红的涂料。一点溅到了她嘴里——一种令人恶心的混合物，像廉价咳嗽药一样粉笔般的酸味。三条小巷后面的一个垃圾桶里突然冲出两名射手，用像黄蜂蜇一样的油漆弹扫射她的小队剩下的成员。\n\n当雷沃尔达站在虚假的街道中央，滴着油漆咒骂着时，隐藏在整个训练场中的扩音器突然发出噼啪声。\"巴拉巴诺娃中尉同志，恐怕你在这次演习中失败了，\"奥普列斯宁将军说道。\"你能告诉我你的错误是什么吗？\"\n\n\"长官，没有搜索陷阱，长官！\"\n\n\"没错，同志。当我们进入莫斯科时，德国人很有可能试图与我们进行城市战争。你知道，当我领导KKP民兵时，我就像这样杀了十三个亚欧主义者。\"他清了清嗓子。\"绊索必须绑在固定的东西上。下次走大街，而不是人行道。\""
 RUS_chain_of_command.16.a: "把我们的生命献给党"
 RUS_chain_of_command.17.t: "盗贼之王"
 RUS_chain_of_command.17.desc: "凌晨两点，空气几乎冰冷刺骨。亚历山大·彼得罗夫中士敲打着农舍破碎的松木门，三名士兵护住他的后方。没有人回应。他用步枪的枪托猛击门框，“公事，开门！”\n\n里面有人动了一下。“我交了税！滚开！”\n\n“这是该死的军队，婊子！”彼得罗夫尖叫道。“如果你不开门，我就炸开它。”\n\n“好了，好了，”声音传来。“等一下。”一秒钟的时间过去，一位穿着薄睡袍的老人推开了脆弱的门。他的脸上布满了皱纹，秃头上还有几缕瓷器般的头发。他瘦弱，膝盖站立的努力使他颤抖。“你们要什么？”他咒骂道。\n\n“我想你已经知道了，索科夫洛夫先生，”彼得罗夫说。他的手指放在步枪的扳机上。“你家与梅安德罗夫将军的事情还没完。他派我们来收款。”\n\n老人厌恶地叹了口气，摇了摇头。“我已经告诉过你们，我交了税。难道一次抢劫还不够吗？”\n\n“我说的是你儿子的赌债，”彼得罗夫说。“你肯定知道他欠将军的钱。还是你抛弃了他？”\n\n风越来越大，使睡袍的末端在寒风中飘舞。索科夫洛夫抓住布料，强行压到膝盖上。“我不和我儿子说话，”他颤抖地结结巴巴地说。“我不会知道什么赌债。坦白说，他还活着我都感到惊讶。”\n\n“关于这个……”彼得罗夫示意手下之一。他从口袋里掏出几张照片，猛地推到索科夫洛夫面前。照片上是他儿子被绑着、浑身是血，在白色上有灰色斑点，他的手中紧握着《兹拉托乌斯特时报》的最新一期。“索科夫洛夫先生，你儿子遇到了非常严重的麻烦，”彼得罗夫说。\n\n老人变得脸色苍白，低声说道：\"你……你要多少钱？\""
 RUS_chain_of_command.17.a: "“只有几百万而已。索科夫洛夫先生，我们接受付款，不过会有利息……”"
 RUS_chain_of_command.18.t: "最真实的红旗之子"
 RUS_chain_of_command.18.desc: "第238塔塔尔步枪旅在普列茨克的严寒中集体冻僵了。他们被从家中派遣到俄罗斯北极山脉接受训练。他们没有奔跑，没有跳跃，也没有做无尽的锻炼。他们坐在战壕里等待，如同死人一般静止不动。\n\n寂静被一声有力的喊声打破了。“战士们！你们正在接受比任何演习、任何体能训练都更严峻的考验！”谢尔盖·阿赫罗梅耶夫元帅声音嘹亮。“是的，同志们！你们正受到更大的压力。当我竭尽全力保卫列宁格勒时，我曾用几乎没有补给品坚守一条街道长达两个月。我就坐在那栋建筑物里，整整六十天六十夜，如同一块石头。”\n\n战壕里传来微小的踢踏声；寒风中传来咬牙声。阿赫罗梅耶夫拿起一把枪，迅速朝空中射出两颗子弹。\n\n他转向发出声音的两个人，尽管他们深藏在雪白的战壕中，他指着他们。“你们两个刚被德军杀死了。你们的阵地遭到炮击，你们的战友已经阵亡。这就是失败的代价！再来一遍！”\n\n如果第238旅感到难过或生气，他们没有表现出来。雪地中飞起一些低声的耳语，但除此之外没有其他声音。然后，寂静再次降临。彻底的寂静，演习再次开始。\n\n“奋不顾身冲锋并不难，冲向死亡很容易——你们会这样做！但你们会发现，同志们，等待默默地，处于恐惧之中，极度的恐惧，等待合适的时机发动攻击要更加困难。但你们的战友、你们的家人、你们的民族需要这样做。我们重新开始计数。”\n\n寂静持续了片刻，然后，在一个狡猾的策略下，阿赫罗梅耶夫再次喊道：“同志们，谁和我在一起！”\n\n没人回应，因为有比喊叫更重要的事情。在寒风的吹袭中，穿着被雪染白的元帅微笑着。"
 RUS_chain_of_command.18.a: "如火焰般不朽，如花岗岩般坚毅。"
 RUS_chain_of_command.19.t: "妄想的余味"
 RUS_chain_of_command.19.desc: "纵队整齐地穿过维亚特卡，每个人都在自己的位置上，齐步前行。这是民族社会主义和斯拉夫人民力量的力量和原始能量。康斯坦丁·阿盖耶夫将军注视着他细致的组织工作，微笑着。是的，这是他的天赋，将一切安置到适当的位置。\n\n然而，当他们行进时，随着家人和穿着黑衣的人挥舞着纳粹标志和其他装饰品，阿盖耶夫忍不住看着他手下士兵的破败形象。弯腿的新兵，细弱的手臂，胸前的袋子里应该是飞机，不，有些不对劲。阿盖耶夫并不适合这个工作。他从来不应该是这样的人。他应该指挥后方力量，成为支持者，在对上帝、国家和劳动的广泛斗争中发挥作用。他是一个整理事物的人，就像一个美丽的游行，而不是战斗。\n\n站在一个阳台上，俯瞰着行进的纵队，耳边是行进号角和鼓声，对于将军来说，一切都开始变成静电噪声。他想起了那个本该走在他们前面的人，要不是他被射杀。但列夫·奥赫京因叛国罪被杀，据说还贪污了多年的大笔贿赂款项。然而，当阿盖耶夫将军回首自己的元首交给的重大任务时，他心中只感到恐惧。更危险的是，阿盖耶夫心中的那一片声音也感到了怀疑。\n\n纵队停下来，转向，不像机器那样，而像一个生锈的螺丝被迫移动。将军们扭曲了脸，他们想象着元首审视这个可耻的场景。最后，他们张开嘴。\n\n\"为了上帝、国家和劳动！为了元首！为了俄罗斯！\"国家军队的呼喊声如雨一般传播，落在广场上，然后散开。人群虚弱地回应着。\n\n也许它可以被克服，也许它只是一场空。但是那个平台上的每个人都感觉到，很久以前在结雅的大厅里犯了一个可怕的错误。"
 RUS_chain_of_command.19.a: "我们必然会胜利，为了元首！"
 RUS_chain_of_command.20.t: "民族至上，全能至上"
 RUS_chain_of_command.20.desc: "米伦奔跑着，他拼尽全力穿过一片迷宫般的树木和石头。他所在的预备役军官队的兄弟们在恶臭的泥泞中直线冲刺，两侧都被木板和残酷的铁丝所束缚。当他们接近一处低障碍时，他们跌倒在地，用手脚发力，艰难地爬起来继续前进。\n\n在他们身后，一声枪响在森林中回荡，没有人停下来。\n\n接下来的几秒钟里，森林中又响起了三声枪声。下一个障碍是一块大木板，他们必须跃过去。有人跃过去后摔倒了——枪声！有人在摔倒时绊倒了——枪声！这种模式一直持续着：奔跑、枪声、攀爬、枪声、奔跑、枪声、爬行、枪声，直到他们完成并转身。\n\n他们身后的战友中有一半倒在了他们身后的课程上，他们的鲜血与肮脏的污垢混合在一起。有人的腿被铁丝缠住，另一个人则倒在米伦跃过的木板上。许多人趴在地上，背部被一个从未见过的追击者射中。\n\n课程指挥官被一位身穿厚重黑色外套的秃顶男子所压倒。\"向奥赫-\"\n\n奥赫廷举起手臂打断了军官的话。“这不重要。”他转向候选人们。“你们已经渡过了一道考验。如果我们要重建俄罗斯，清除世界上的犹太-布尔什维克和犹太-法西斯的腐败，还有更多的考验等待着你们。如果我再次下令，谁会去做呢？”\n\n立刻，有几个人举起了手。米伦和其他几个人也跟着举起了手。最后五个回答的人被一阵子弹击倒。\n\n“如果你们注定成为军官，就不应该是懦夫。任何人都可以成为士兵，但你们必须卓越。现在，再来一次。”"
 RUS_chain_of_command.20.a: "只有以如此残忍的手段，我们才能扑灭犹太人的\"帝国\"。"
 RUS_chain_of_command.21.t: "相信上帝的荣耀"
 RUS_chain_of_command.21.desc: "“先生，您是来听布道的吗？”一个身穿一身风吹过的阿尔汉格尔斯克的最干净衣服的男子走近了帕维尔·苏多普拉托夫，后者正从码头走过。帕维尔一直在检查沿海防御工事的建设，以防德国海军的进攻。他还不确定它们是否能抵挡住联合德国空军和海军的攻势，但是-\n\n“有什么问题吗，先生？”那人关切地看着将军。\n\n“我……”苏多普拉托夫本能地准备说不。他不是来参加任何自封上帝使者的愚蠢布道或演讲的。但他确实需要休息一下，远离那些无能的工程师……“你能告诉我正确的方向吗？”\n\n“当然。”他指着街道。“离这里仅几个街区。”\n\n帕维尔点了点头，没有再说什么，就离开了。街对面的教堂最近进行了翻修。它周围的每座建筑物都被北极的天气侵蚀得破败不堪，但这座教堂却是一尘不染、精致无瑕的，它的尖顶自豪地指向天空。牧师带领信徒们走到教堂前台阶外，对着一个越来越多的人群讲话。帕维尔溜进人群中，倾听着。\n\n“很快，我们的人将向西行军，解放在德国异教徒和魔鬼崇拜者统治下的兄弟。”牧师平静而充满激情地说道，目光紧盯着地平线。“而且，像摩西一样，我们将回到祖国的中心，解放我们的人民。但不会有第二次出埃及，因为我们的应许之地也在西方，就在莫斯科。就像希律王在耶路撒冷建造了第二座圣殿一样，我们将把圣瓦西里大教堂重新奉为我们主的第二座圣殿。阿门。”\n\n当人群纷纷回应着阿门，并且仪式转向诗篇圣歌时，神父的话在帕维尔的脑海中回荡。他想起亚历山大在他背叛之后给予他的宽恕。他扫视着聚集的人群，他们专注地听着神父说出的每一个字。也许他错了。信仰给予俄罗斯人民希望，这可能是它最伟大的礼物。"
 RUS_chain_of_command.21.a: "让上帝的殿堂在莫斯科重建起来！"
 RUS_chain_of_command.22.t: "化学疗法"
 RUS_chain_of_command.22.desc: "维克托·拉里昂诺夫坐在他豪华的橡木办公桌前，桌子上镶嵌着金子和珍珠，他正在阅读一系列关于维护[RUS.GETNAME]震撼团纯洁性的报告。不论俄罗斯当前的领导层如何——这是出于反犹太团结的权宜之计——斯图尔莫维基仍然存在，并且他们在拉里昂诺夫的领导下生活和死去。维护纪律、虔诚和热情是他的责任。在国家使命面前，不能妥协。因此，他规定纯洁，要求纯洁，并以上帝的名义接受纯洁。\n\n在带有空调的房间角落里，米哈伊尔·柳明部长站得笔直，倾听着。拉里昂诺夫拿起顶部的文件夹。“斯捷潘契科夫中尉，早晨祈祷时不专心。瓦西里耶夫士兵，偷取口粮。普列奥布拉热恩斯基中士……异端？以沙皇储君的名义——”\n\n柳明清了清嗓子。“显然，普列奥布拉热恩斯基发表了有关耶稣门徒中有犹太人的言论。”\n\n“多么恶劣的观点。”拉里昂诺夫摇了摇头。“我们知道他可能感染了多少人吗？”\n\n“没有，长官。”\n\n“很好。处决整个连。”柳明点了点头。“当然，长官。如果可以，请允许我调动第七团到该地区，最多一天两天就能到达。”\n\n维克托闭上眼睛，揉了揉鼻梁。“不，柳明。这些失误来自斯图尔莫维基。因此，斯图尔莫维基必须解决这些问题。”他再次睁开眼睛，眼中闪烁着愤怒和坚决。“派遣第九十八团，并授权使用塔博尔人。”\n\n拉里昂诺夫从桌子前站起来，文件仍然被他的爪子夹着。“柳明，这些罪行只证明这些人没有准备好完成我们的国家命运。向我指挥下的每一位委员发出命令。在这些丑行结束之前，纯洁度指标翻倍。”"
 RUS_chain_of_command.22.a: "军队遍布疾病的话，根本就不算是一支军队。"