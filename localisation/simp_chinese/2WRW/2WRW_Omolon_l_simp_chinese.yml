 OMO_liberal_conservatism_party_long: "西伯利亚杜马(Sibirskiy Duma)§F\n--------------  \n随着苏联解体，稀疏的人口、辽阔的疆域以及现代通信手段的匮乏，使得在西伯利亚偏远严寒的北方地区几乎不可能维持一个中央集权政府。取而代之的是，这片从堪察加边缘延伸至萨哈西部的地域，最终形成了松散的领土邦联。杜马最初由五十年代末为躲避西部和南部战乱与迫害的旧礼仪派信徒建立，如今已成为融合该地区各类宗教与社会运动的复杂混合体——宗教势力的显著影响，很大程度上源于其是苏联解体后少数仍存续于此的机构。每个达到一定规模的聚居地都可向杜马派遣代表，并尽其所能地协作共享资源与人力，以克服西伯利亚荒原的严酷环境。尽管杜马的权威很难延伸到奥莫隆以外的地区，但它仍象征着苏联解体后俄罗斯境内相对和平共处的罕见范例，即便这种共处很大程度上依赖于宗教慈善与极地边疆司法这种非正统组合的维系。§!"
