 OMO.401.t: "从黑暗中，看到光明"
 OMO.401.d: "所罗门王的箴言有云：“贼因饥饿偷窃充饥，人不藐视他。若被找着，他必赔还七倍。必将家中所有的，尽都偿还。”（箴言6:30-31）\n\n啊，堪察加的土地！你成为北方舰队残部的栖身之所，当神圣之光也照耀至此，却遭遇黑暗势力的阻挠——盗匪与海盗。然黑暗岂能阻挡主的光辉？邪恶终被涤荡殆尽。当这圣光照亮尤马舍夫时，他的灵魂顿悟：到来的并非死亡，而是救赎。\n\n血雨腥风止息后，尤马舍夫祈求面见圣父。于是两人相会——圣父与伊万。\n\n圣父在尤马舍夫灵魂中未见邪恶。他与部众劫掠上帝子民非因贪婪，仅为果腹。因此，圣父的恩典降临于他们。他们将成主的仆人，助圣父跨越重洋传播神旨。"
 OMO.401.a: "主的一缕光辉照进大海。"
