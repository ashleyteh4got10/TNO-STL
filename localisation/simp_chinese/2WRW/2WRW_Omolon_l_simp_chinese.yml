 OMO_all_those_of_faith_desc: "即将到来的传播主之光的斗争将是我们共同体联盟迄今面临的最大挑战。基督的教诲迫使我们捍卫温顺者和受压迫者，在这即将到来的动荡时代，所有信徒都必须响应召唤。从布道坛到工厂车间，我们的信息很明确：为国家服务就是为主服务。\n\n公开布道及其他信息传递将把我们集体的灵性奉献转化为共享的国家力量，这是我们抵御即将来临的冲突所必需的。有能力者将受感召在上帝的旗帜下效力，留守家园者则要竭尽所能协助这场斗争。"
