 OMO_sermon_of_the_father: "神父布道"
 OMO_sermon_of_the_father_desc: "“因我侪之战征、非对血气、乃对首领权柄、今世幽暗之王、空中之诸恶神也、为此尔曹当取上帝全分之甲胄、为在凶日可敌之、且获全胜而得立。”\n\n就是那数年以前，上帝指引神父的脚步，引导西伯利亚中迷失的羔羊行走正路，将救赎的路摆在他们面前，众民聚集成群，围绕他的身边。神父历经试验，而今，亚历山大·缅于奥莫隆河河岸，给予信徒最后一次教导，号召他们与支配远东和全俄罗斯的恶人作斗争。缅神父的门徒们必要成为强大兴盛的国，地上的万国都必因他得福。"
 OMO_the_light_shines_in_darkness: "渊面之光"
 OMO_the_light_shines_in_darkness_desc: "令人失望的事实是我们正在见证人民最黑暗的时代，那是信使的光普照俄罗斯人民之前的至黑之夜，但是现在我们便是照进黑暗里的光。因此我们必须高居那些可憎之人与罪人之上——政客与兵士，强奸犯与强盗，赤匪与白匪——向人民展示我们的美德。因父曾教导我们过以耶稣为鉴的生活，以此激励那些沉浸在黑暗中的人寻得救赎。若有人不愿接受我们的圣像与榜样，将它们踏在地上并威胁我们的信使，主必将他们全部剪除。\n\n“而且我们也知道：上主使一切协助那些爱他的人，就是那些按他的旨意蒙召的人，获得益处。”"
 OMO_burn_the_idols: "焚毁偶像"
 OMO_burn_the_idols_desc: "主在《歌罗西书》中教训我们道，“故当灭死尔等属地之肢体、即奸淫、汚秽、邪侈、恶欲、贪婪、即是拜偶像也。”\n\n国家机构的邪恶本性激起、散播和诱惑人民屈从于贪欲，财富的罪恶污染了他们，致使贪婪以破坏性的势头肆意发展。我们必须采取行动剪除这些机构，保证我们忠信的人民不被金钱与财富诱惑。在上帝面前，基督徒绝不会崇拜金钱与权力。当然，这些机构不会悄悄遁入黑夜，因此我们要谈论并彻底消灭他们，将人民从国家的影响中解救出来尚需一些时间。"
 OMO_the_communal_union: "公社联盟"
 OMO_the_communal_union_desc: "一旦我们推倒旧国家机构的支柱，如同耶稣推倒圣殿中做买卖之人的桌子，我们必须依照为圣父和圣子眼中真正的基督教信条重塑我们的社会。藉由圣经的教诲和主的教导，我们将在社区中建立一套新的互联互助体系，这套体系基于社区共有财产，劳动公平分配，废除货币以及打破地主和政府压迫的原则。\n\n最最重要的是，我们创建社区联盟不仅在于确保人民能像耶稣一样生活，同时也在于创造一个强健的基督教神授之国，首先在西伯利亚，尔后扩展到整个俄罗斯。只有当我们怀着信念，相信我们能将俄罗斯人民从黑暗中拯救出来，这套体系才能适得其位。"
 OMO_denounce_the_oath: "不可起誓"
 OMO_denounce_the_oath_desc: "“你们又一向听过对古人说：不可发虚誓，要向上主偿还你的誓愿！我却对你们说：你们总不可发誓：不可指天，因为天是上帝的宝座；不可指地，因为地是祂的脚凳；不可指耶路撒冷，因为她是大王的城市；也不可指你的头发誓，因为你不能使一根头发变白或变黑。你们的话该当是：是就说是，非就说非；其它多余的便是出于邪恶。”\n\n没有人应当被亵渎的誓言捆绑——这些誓言是从那恶中出来的，继承自人的原罪。因此我们必须拒绝向那些垂死之人及他们的机构起誓，同时鼓励其他人效法我们——这些誓言和强迫人民的人是在帮助暴君与罪恶的军阀伪装成神与人类之间的中保。"
 OMO_all_one_in_christ: "基督里合而为一"
 OMO_all_one_in_christ_desc: "亚历山大·缅神父并非普通的圣职者。他教导人民激进的理念，其中一些甚至可以称作理想，这些理念几乎打破了所有对信仰的其它论断。准确说，这些激进的理念确实聚集了一大批追随者。他最为激进，也是最为有力的教导之一，便是在上帝之中既无犹太人也无异邦人。上帝的每个仆人看在祂眼都为平等的，无论其民族为何生活方式如何。就像神父曾经宣扬的那样，“在我们的序列之中，兄弟姐妹并无分别！”\n\n确实，暴君和匪徒们将人民踩在他们的军靴之下，放任黑暗在其控制的社区肆意蔓延。他们断然拒绝这些激进的理念，但是这些理念将帮助我们在最深受压迫的人民中获得大批支持者。"
 OMO_yet_the_darkness_did_not_overcome: "然黑暗未胜"
 OMO_yet_the_darkness_did_not_overcome_desc: "上帝喊出的第一句话是“要有光”——祂创造第一样事物便是光以及光体。无论笼罩人们的黑暗多么浓重，这光存于一切人的生命中。《圣经》与神父教导过我们：神爱世人，将救赎我们的世界。无论将发生什么，无论克服何种艰难险阻，无论前方暗藏多少危险，我们都是上帝的器具，在接下来数月里主都将确保黑暗永远不会胜过光。\n\n“耶稣又向众人讲说：我是世界的光；跟随我的，决不在黑暗中行走，必有生命的光。”"
 OMO_arm_the_believers: "武装信徒"
 OMO_arm_the_believers_desc: "如果我们务实一些，借助榜样和在北西伯利亚的冰冻荒原中祷告是没有前途的。的确，那些愈发疑神疑鬼的暴君和他们的臣仆很可能已经在暗中策划针对我们的军事行动。因此我们必须准备好与这些黑暗势力的军队做对抗。很显然我们需要完成两个目标：首先是让苏多普拉托夫准备好他的部队，其次是开始动员我们的基督教民兵，尽可能地把他们武装起来。苏多普拉托夫虽然有些难以驯服，但目前对我们来说，他至少还有用。是时候让我们将希望寄托在他本人和他的士兵上——这将是我们日后斗争不可或缺的一部分。我们的民兵怀揣着信徒般的激情，将如第二次大洪水般淹没一切黑暗的力量——但是这次，并非洪水，而是我们勇敢的士兵惩罚这些逆焰，为光明的力量奋战到底。"
 OMO_sudoplatovs_brigade: "苏多普拉托夫旅"
 OMO_sudoplatovs_brigade_desc: "众人皆知，帕维尔·苏多普拉托夫是个古怪又离经叛道的家伙——他之前干过的事情，每一件都是我们的布道所极力斥责的，其中最邪恶的便是向伊尔库茨克的恐怖——亨里希·亚戈达提供装备，与他同流合污。苏多普拉托夫也给亚戈达带来了很多好处——不仅仅是他本人的军事才能和在南方地区的作战经理，也包括一整个旅的士兵，他们都对苏多普拉托夫言听计从。除去上面这些，他也获得了平民英雄能够得到的荣誉与待遇，在失败后继续坚持对抗不公正，他正在寻求对过去所作所为的救赎。从现在起，苏多普拉托夫似乎愿意协助我们，他的旅部——一整个旅的职业军人，接受过NKVD的训练，将成为我们进军途中价值连城的杀手锏。"
 OMO_infiltrate_their_castles: "渗透城堡"
 OMO_infiltrate_their_castles_desc: "苏多普拉托夫和他的支持者相当熟悉如何进行非对称作战，在将来的日子里，这样的能力对我们有大益处。对抗远东地区暴君的基督教运动在那些深受压迫的贫苦农民中相当受欢迎。因此，苏多普拉托夫的特工将以经验和信仰为武装渗透进入敌军前线，鼓动农民起义以打乱他们的阵脚。这么做不仅会带来动乱，也会招致他们的报复，这些隐没在黑暗中的特工只是在让更多的人接受我们的信仰。\n\n“加入水泉间缭绕的歌声！那里正在歌颂上主的胜利，歌颂他统治以色列的胜利。上主的百姓，速下到城门口！”"
 OMO_fraternal_militias: "博爱民兵"
 OMO_fraternal_militias_desc: "虽然苏多普拉托夫旅已经无数次证明了他们的能力，但是只凭他们是不足以扩张我们的领土，将我们的人民全部解放出来的。因此我们需要把信徒组织成为一支上下齐心的武装力量，一支贫苦农民的军队，他们将在上主的旗帜下解放我们的手足同胞。这些“博爱之兵”将成为我方解放部队的骨干，他们将接受最好军事技能训练，既有非对称作战也有正规作战形式，以确保他们面对将来的斗争时能够训练有素、装备齐全。毕竟有许多志愿者纷至沓来，但是在这之前他们甚至都没有朝人类开过枪。\n\n“基督解救了我们，是为使我们获得自由；所以你们要站稳，不可再让奴隶的轭束缚住你们。”"
 OMO_take_the_towns: "掌控城镇"
 OMO_take_the_towns_desc: "许多城镇表面上受到我们的管辖，其中满是信徒，然而实际上它们仍是无政府状态和专制的旧营帐。土匪，放贷人还有罪人高居城中，我们剪除这些黑暗势力的最大努力都白费了。在这种时候，为了保证我们对领土上城镇的控制能力，我们必须动员农民将黑暗从城镇中驱逐出去，重建人民心中的光明，将他们融入我们的社区联盟。许多人指出这是新成立的博爱民兵极好的初次实战体验，但他们仍在解决一些更加棘手的问题。"
 OMO_end_the_thieves: "终结盗匪"
 OMO_end_the_thieves_desc: "苏联崩溃之时，苏联的远东舰队逃到了符拉迪沃斯托克，却迎头撞上北进的日本军队，最终他们定居在堪察加半岛。虽然这一爱国举动起初广受欢迎，但是在那之后，远东舰队意识到堪察加半岛的自然条件过于恶劣，采取海上私掠和偷盗的办法在这冰天雪地的半岛勉强存活下去。他们的劫掠行为不分贫富，不分俄国人与外国人。显然，这些从前的爱国者们已经看不到正确的道路，他们彻底堕入了黑暗。是时候让我们动员博爱之兵，如有必要，他们将凭借武力将这些海盗驱逐出堪察加半岛，这样我们就可以把半岛整合进入我们日益壮大的神授国，将海盗治下的民众解救出来。"
 OMO_rouse_the_masses: "唤醒民众"
 OMO_rouse_the_masses_desc: "一切准备就绪，我们终于可以集中力量打倒暴君、压迫者以及匪盗。这些人受捆于黑暗之中，他们陷得太深以至于无法看到光明，他们也不会理解我们的使命与目标。我们可以藉着榜样，藉着圣言生活，并展示它对社区联盟的益处，但是这些人早已远离真理，根本无法接受它们。因此，很显然接下来的行动就是要确保在独裁者治下的民众从锁链中挣脱出来，要他们得见真理。缅神父计划进行一次让每个人都能听到的公开布道，内容事关坚忍与灵魂的纯洁，以唤醒民众，让所有人准备好与压迫者的斗争。"
 OMO_bring_the_sword: "拿起刀剑"
 OMO_bring_the_sword_desc: "“吾主上主的神临到我身上，因为上主给我傅了油，派遣我向贫苦的人传报喜信，治疗破碎了的心灵，向俘虏宣告自由，释放狱中的囚徒。”\n\n在过去几个月里，在社区联盟的成员和博爱之兵中间，在农民起义开始和我们夺取城镇之间，一件事变得愈发清晰起来，那便是人民已听到我主上帝并其忠实仆人缅神父的感召。是时候将我们的基督徒兄弟姐妹从虚伪的布尔什维克，以及和他们一体两面的法西斯主义者手中拯救出来了。这场战斗绝非易事，但是绝对必要。因为这是我们信徒的呼唤，它将为这个破碎的国家带来光明，为这片浸满黑暗的大地带来希望与真理。"
 OMO_the_harbinger_of_deceit: "谎言之兆"
 OMO_the_harbinger_of_deceit_desc: "“不愿悔悟，却强暴上又加强暴，欺诈上又加欺诈，全不理睬我。”《耶利米书》9:6\n\n圣经中写道：他们的话必顺从，他们的心却远离。说的就是那些声称要统治远东的人——那些曾经追随上帝的民族在无神论的统治下已经变得越来越堕落，那些人即使现在正趴在铁尖头的靴子下颤抖，也会编造一个关于自由黄金时代的寓言。但羔羊的子民不会因他们的谎言而动摇。\n\n我们的弟兄们已经在这片不信神的地方，曾经飘扬红旗的土地上，不停地传播着福音。破碎的承诺和鞭笞的回音在行进的军队后面回响。他们暗示了所有人对世界及其“保护者”、元帅与总理的信任都是一种悲哀——而一种更好的信仰正在形成。在这里，和平之主为所有俄罗斯人建立了一个真正的、持久的、公正的家园。\n\n而且，他们说，这个家园成熟的时刻即将到来。"
 OMO_the_pharaoh_of_irkutsk: "伊尔库茨克的法老"
 OMO_the_pharaoh_of_irkutsk_desc: "“你们怎敢对法老说：‘我是贤者的子孙，古代帝王的后裔？’”《以赛亚书》19:11\n\n太阳底下无新事。世上总是有忠心的仆人——也总是有那些想要统治和毁灭他们的人。就这样，没完没了，直到天上的王归来。\n\n最近接过这一衣钵的人声称，他们继承了之前那个血淋淋的联盟——就像旧时代的暴政一样，一旦它的罪恶挣脱了束缚，打倒了统治它的人，它自己也会分崩离析。他们的王国没有国王，却极度崇拜亚戈达，在他身后是象征真理仲裁者血红色的枪管。仅靠强权和他们的口号，他们摧毁了征服后的村庄，甚至都不再假装为他们所代表的人民服务。\n\n太阳底下无新事。每一位法老来了，梅瑟就会从芦苇中升起，一次又一次地搅动红海。我们必向血红之水宣告说，上主来了，是要救他的百姓，并要拆毁紧随其后的压迫者约束他们的锁链。"
 OMO_revitalize_the_faith: "重振信仰"
 OMO_revitalize_the_faith_desc: "“我痛恨厌恶你们的庆节；你们的盛会，我也不喜悦！”《阿摩司书》5:21\n\n在沙皇陷落于布党，布党陷落于德国人之前，我们的教会，俄罗斯的脊梁，就已经迷途多时了。我们信者众多，牧者如丛，但诚心信主者寥寥。神父已经意识到了这些，并坚定他造的新耶路撒冷将不尊那众王，这只会带来不敬和溃散。神父要这地上的国只敬天主，直至为祂加冕那天。\n\n我们的仪礼要足够接近我们的信众，足够口语化。圣经已经被神父们和他们陈腐的古斯拉夫语垄断太久了，我们要翻译全本，为无望的羔羊带来新的梦想。我们将复兴云游俄国传播福音的神父，他们将是这满是征兆的末世里最后一代的先知。\n\n这重建的教会，墙壁如太阳般闪耀，而主也住在其中：胜利，一如既往，将归于祂的信徒。"
 OMO_let_my_people_go: "让我的人民自由"
 OMO_let_my_people_go_desc: "“祝圣第五十年，向全国居民宣布自由；为你们是一喜年，人各归其祖业，人各返其家庭。”《利未记》25:10\n\n向被奴役的人传达喜讯向来是主特选之人的圣工。如同在罗马人锁链下的时候，那心向自由的与圣灵最近，也为正信的种子提供了最好的沃土。在祖国里独裁者恣意妄为之时，是时候为迷途的他们最想要的：自由。不是百年之后，不是十年之后，而是现在。\n\n在整个远东，神父们递出了成千上万的册子，挨家挨户宣讲他们从未见过的自由：远离布党和法西斯锁链的自由，远离小气的沙皇和他一文不值的法庭的自由；自由地去生活，去爱，去信仰。光明在黑暗的心中闪耀——而黑暗永远也无法战胜光明。\n\n战争要来了，最后一战：这次还不止会盖过那军队，而会一并消灭残破的俄国。在这再临的逾越节，只有羔羊能得拯救，也只有天父能给我们救赎。"
 OMO_the_simon_of_buryatia: "布里亚特的西蒙"
 OMO_the_simon_of_buryatia_desc: "“愿你的银钱与你一起丧亡！因为你想天主的恩赐可用银钱买得。”《使徒行传》8:20\n\n布里亚特：这个国家的未来岌岌可危。这里充斥着诱人的无神论，当它深陷分裂泥淖之时，却还在不断地追求所谓“福利”。就像一个远古神迹时代的术士。\n\n天主对术士可没有什么耐心——尤其是那些穿着红袍的术士。\n\n即使到了现在，这个共和国还在向那些对当前情况一无所知的孩子们灌输他们的“自由”理念。和平、土地、面包与自由——以前也有人给我们许下这些承诺，但我们看到的只有俄罗斯大地上支离破碎的教区与被夷为平地的教堂。如果那个叫萨布林的人真的只是想让俄国人民安居乐业的话，他只要放弃那面剑与镰的旗帜就行了。然而，飘扬在贝加尔湖上的正是这面旗帜，而不是十字架旗。\n\n天主对行巫术的术士可没有什么耐心。而我们的耐心也早已枯竭。布里亚特会发现那存在我们内的真理——如果这意味着我们必须用永火作为鉴戒，使他们不再误入歧途，那也只好如此了。"
 OMO_do_away_with_lenins_cult: "废除列宁崇拜"
 OMO_do_away_with_lenins_cult_desc: "“我的子民啊！领导你的，领你走错了路，混乱了你行径的路途。”《以赛亚书》3:12\n\n曾经，有一位王，统治巴比伦；随后是叙利亚；在之后是罗马。这教众国所羡慕的，是群山所畏惧的。那里，矗立着一座金像，那是昭示对王之力量的崇拜和信仰的至高灯塔。那时，敬畏上帝的子民感到凄凉无奈。要么顶礼膜拜，要么如鸡狗般死去。\n\n到了俄罗斯领教可怕国王的时候了，所有人都俯首听命——不论是发自恐惧，还是真心崇拜。他和他的继业者所治的王国很快灭亡，如流沙上的城堡。然而，衰朽的地基依然留在原处，孳生出各类蠹虫，以祖国的希望为食。他的名字，令人惧怕、令人敬畏的名字，依然在被我们的司祭焚毁的土地上流传：列宁，列宁，列宁。\n\n唯有基督才是人类的审判者。是时候了，把这一头衔的声索者从我们人民的心中清除出去。如此，国度、权柄和荣耀，都要归与祂，直到永远。"
 OMO_vindicate_the_virtuous: "有德者居其位"
 OMO_vindicate_the_virtuous_desc: "“因为他是万主之主，万王之王，同他在一起的蒙召、被选和忠信的人，也必要获胜。”《启示录》17:14\n\n要收的庄稼多，做工的人少。即便是现在，神父治理下的土地也被各个村庄寻求天主荣耀的请求所围困。各地的司祭已成为我们中央行政部门和他们所管理的村庄之间的重要代祷者，真正地成了即将降临的天主之国与人类国度之间的桥梁——但他们的能力却因人数不足以及外部压力而受到限制。\n\n为了创造一个更美好的世界，必须做出牺牲。我们将在远东建立管理财政和法律的机构，并确保这些职位只由我们认为有德行的人担任。在我们的新耶路撒冷，没有抱怨者、怀疑者和封闭的世俗主义者的容身之处，而且他们也不得身居高位。\n\n而对于那些指责我们堕落的人，指责我们搞政教合一的人，尽管他们的信仰并不坚定，但他们的勇气值得赞许。让我们的信徒用辛勤的工作，在那些不相信我们的人面前证明自己吧。好吧，既然他们不与我们站在一起，那就是与我们作对。凡一家怎么能自相纷争呢？"
 OMO_end_to_the_pharisees: "法利塞人之终"
 OMO_end_to_the_pharisees_desc: "“你们这些毒蛇的种类！谁指示你们逃避将来的愤怒呢？”《马太福音》3:7\n\n主之灵带来自由，然而在前苏联土地上，有人篡夺主之灵以摧折人民意志。那些合作者、解放派教士、祖国的赤裸叛徒——唯有他们以主之名所行之事，及未竟之责，才是我们关注的焦点。\n\n然主是宽恕的，或许荒漠中将绽放新径，那里原本无路可走。\n\n当教会重塑苏维埃大地时，这些迷途仆从将获十锭银子并被嘱托善加利用——我们将以矫正惩戒之名将其纳入管理体系，他们的手脚将率先触碰公共服务之犁。毕竟工人稀少，何不化敌为工具来传播福音？\n\n当我们与之同祷时，必会睁一只眼，耳贴地面——我们在此建立的王国如主般仁慈广袤，但绝不容忍再度背叛之徒。"
 OMO_the_harbinger_of_reaction: "谎言之兆"
 OMO_the_harbinger_of_reaction_desc: "“看，我立在门口敲门。”《启示录》3:20\n\n《圣经》载：他们欺压恐吓蛮横倔强。俄罗斯人民就像一群外来者在自己的土地上生活——农民们先是向一顶王冠下跪、然后是一颗红星，之后又是千奇百怪的外来意识形态与廉价的暴政。在元首、国王的服从命令下，肩负着俄国重担的农民们呻吟着跪了下来。无数不知名的村庄向上主呼求，请求上主免去这血杯。\n\n上主回应了他的子民。祂的回答便是亚历山大·缅神父。\n\n 当哈尔滨军阀们进行可鄙的内斗时，大地在他们脚下震颤。空气中充斥着地方反抗和配给粮食被全部烧毁的传闻，他们的道路就像尼尼微城一样面临着灭顶之灾。这时，圣灵再次降临，俘虏得以自由，伤员得以医治，正义得以保证，复仇得以实现。\n\n让所有反对者为自己的灵魂祈祷吧，只有上主才能拯救我们——而我们只是在执行祂的话语。"
 OMO_the_serpent_of_magadan: "马加丹的毒蛇"
 OMO_the_serpent_of_magadan_desc: "“你可经过在狮子和毒蛇身上，你可践踏在猛狮和毒龙身上。”《诗篇》91：13\n\n起初，蛇的诱惑给人类带来了诅咒和死亡。而它最近的化身就是法西斯主义，这是俄罗斯大地上最致命的毒蛇变种，最后它的失败也证明了这一点。\n\n这条法西斯之蛇仍盘踞在俄国的底层，像藤蔓一样紧紧抓着它那薄情寡义的日本主子，希望有朝一日能使整个俄国变成共荣圈的奴隶。在他们的象征逆十字之下，成千上万的人在某个人的指挥下整齐划一的行进，同时还有成千上万的人因为难以言喻的恐怖而在惊惧中瑟瑟发抖。\n\n这样的造物是上主所憎恶的。然而，我们的神父却是一位高明的蛇夫。当我们面对这条藏在腐烂地堡中的现代毒蛇时，我们将打破操控者的意志，使马加丹人民可以从他们的束缚中获得解放。"
 OMO_expel_the_moneylenders: "驱逐放贷人"
 OMO_expel_the_moneylenders_desc: "“好！你们富有的人啊，现在哭泣哀号罢！因为你们的灾难快来到了。”《雅各书》5:1\n\n“你们的财产腐烂了，你们的衣服被蛀虫吃了，你们的金银生了锈，这锈要作控告你们的证据，也要像火一样吞食你们的肉。你们竟为末日积蓄了财宝！看，工人们收割了你们的庄田，你们却扣留他们的工资，这工资喊冤，收割工人的呼声，已进入了万军上主的耳中。”\n\n这是上主的话，我们要服从。对于那些从俄国人民的苦难中获益的人，那些在农民的溃疡和伤口上饮酒作乐的蚊子，我们会让他们明白，与其让我们完成工作，不如希望圣洁之火净化他们，毕竟火是如此的仁慈与迅速。\n\n当我们完成工作时，他们会被我们从这片土地上全部清除，这一大批曾经自称为银行家、军火商与高利贷者的人类害虫，只有在证词里，他们才能找到最终的救赎。也许在上主的仁慈下，能给予我们所不能给予的东西——\n\n——赐予他们解脱。"
 OMO_punish_the_leviathan: "惩戒利维坦"
 OMO_punish_the_leviathan_desc: "“到那一天，上主要用他那厉害、巨大、猛烈的剑，来惩罚利维坦。”《以赛亚书》27:1\n\n利维坦——强大、无情的邪恶象征。时间尽头的蜿蛇。我们这个时代的利维坦同样也在远东的土地上肆虐，这条蛇潜伏在阴影中，而这阴影并不来自军队或军头，而是来自意识形态本身。不能用刀剑、长矛、战车或枪炮来对付这头野兽，而要用信仰的盔甲与上主之言的剑盾来对付。我们要找出那些企图毒害俄国人民思想的人，把他们从我们的城市和乡村中铲除出去。在必要时，我们要用压倒性的力量，使其无法在我们的土地上再度生根发芽。\n\n当净化完成之时，我们会以一种真正历久不变的宗教将我们所拥有的土地奉献给上主，它不能是信主基督以外的其余宗教。让它成为一条新的铜蛇，以此战胜新的灾厄，如果我们的敌人胆敢向我们发动进攻，他们就将受灾。"
 OMO_the_haman_of_amur: "阿穆尔的哈曼"
 OMO_the_haman_of_amur_desc: "“世上列王群集一堂，诸侯毕至聚首相商，反抗上主，反抗他的受傅者。”《诗篇》2:2\n\n只要俄罗斯的土地上还有人迹，就永远会有人为了统治这块土地而分裂他们。以色列不朽，而哈曼亦不死，阿穆尔河上站着的便是俄罗斯远东地区的新哈曼。他的权杖便是那万字形状的霓虹灯，手中名单如生命之河般源源不断流淌着“不受欢迎者”，他摧毁了仍然忠于教会的土地和人民。新哈曼的国度空洞，言辞带毒，法西斯主义带来的毁灭之种将摧毁它所扎根的一切。他所作的，无非是分裂自己的人民罢了。他的结局必如他的起点一样一无所有。我们见证。我们相信。\n\n愿上主为我们作证，我们将终结罗扎耶夫斯基的暴政。就算我们必须点燃欧洲的战火，哈尔滨也将不再有神父殉道。"
 OMO_depose_the_wicked_church: "废黜邪恶教派"
 OMO_depose_the_wicked_church_desc: "“因为你用你的一切可憎和可恶之物玷污了我的圣所，我必将你铲除，我的眼决不怜视，一点也不怜惜。”《以西结书》5:11\n\n在《圣经》中，没有什么比那些出卖基督的人更可耻的了。犹大的名字遭到万人唾骂并不是没有原因的，他为了几枚微不足道的银币，就把救主出卖给了罗马人。而我们在阿穆尔也发现了不少现代版犹大，一群全心全意宣誓效忠法西斯主义理想的神父——这些为了压迫者的鞋油而放弃圣餐的败类。\n\n我们必须采取行动，净化这片土地上的教会，使其免于苦难，并对这里的神父进行再教育。至于无法拯救的，我们会将其投入火中——也许上主会大发慈悲，在我们失误之处拯救祂的子民。"
 OMO_the_day_of_deliverance: "救赎之日"
 OMO_the_day_of_deliverance_desc: "“因为你对我的仁爱浩大无边，救援我的灵魂，免陷极深阴间。”《诗篇》86:13\n\n阿穆尔的法西斯有许多敌人，有些一开始便反抗他们，有些是罗扎耶夫斯基那无尽的偏执自找的。但是不管哪一方，对阿穆尔和万字旗都深恶痛绝。现在是我们的责任向他们传递祂的旨意：神终于要在阿穆尔降下新的作工。我们要清理干净旧政权的监狱和酷刑室，让他们加入神的殿，帮助我们重建。\n\n就算阿穆尔拒绝，这些恶臭角落里的疯狂罪行也会彻底摧毁法西斯在这座城市的控制。神的作工不一定通过人自愿的实现，但绝不会被人的犹豫所干扰。"
 OMO_the_belshazzar_of_chita: "赤塔的伯沙撒"
 OMO_the_belshazzar_of_chita_desc: "“写出来的这些字是：弥尼，弥尼，提客勒，乌法珥新。”《但以理书》5:25\n\n对于那些亵渎圣殿的人，祂的审判会很快下达。至于那些披着王权外衣却不对教会尽责的统治者，我们还能说什么呢？穷困潦倒的沙皇米哈伊尔在这方面就是个令人失望的典型。从来没有一个领导人在拥有如此高位的同时，对自己的人民如此漠视，即便是那群有损神圣俄罗斯形象的小小苏维埃。而事实上，在这片闭塞之地的神父告诉我们，其实这个王国不过是一群白发将军的老巢，而沙皇不过是个顶着荣誉光环的囚犯。\n\n我们必须终止这种不虔诚的行为。如果米哈伊尔不打算向人民负责，那我们就收回他的权柄，并要惩罚那些抢夺上主财物的人。"
 OMO_depose_the_justice_of_the_commoners: "平民的正义"
 OMO_depose_the_justice_of_the_commoners_desc: "“不可袒护穷人，也不可重视有权势的人，只依正义审判你的同胞。”《利未纪》19:15\n\n愚妄的人心中说：“没有天主。”《诗篇》14：1而只有心盲之人才会否认祂的触摸能愈人。通过神父们紧张的工作，正在重建的教会已开始承担社会工作并参与恢复工程，承蒙上主的恩典，我们在这片应许之地上建立了一座灯塔。我们将以教会机构为基础，重建那些被沙皇暴政破坏的地方，将剥削所得的成果分配给那些受压迫的无权无势之人。\n\n不要等到别人对我们说：“让我们双手合十，等待救主降临。”我们马上就会开展祂所愿的工作，现在所行的一切事宜，都将是美的。"
 OMO_no_render_unto_tsars: "沙皇的不归他"
 OMO_no_render_unto_tsars_desc: "“你来，我要指给你看，那在多水之旁为王的大淫妇受的惩罚；世上的诸王都同她行过邪淫，地上的居民也都喝醉了她淫乱的酒。”《启示录》17:1-2\n\n昨天是巴比伦，今天是罗马，明天是赤塔。他们都在适当的时机背弃了永生的天主，都以政治需要的名义骚扰教会，怀着坚定不移的信念戴上了自己的王冠，以为这顶王冠永远也不会被夺走。\n\n然而在上主的智慧面前，大地为之震荡，诸天为之摇动。\n\n当我们把君主制度夺走的成果重新分配给人民时，我们要惩戒米哈伊尔沙皇，以警示他人。只要假以时间与上主的旨意，他给白俄带来的创伤也许就会痊愈。但在那之前，正义仍有待伸张。"
 OMO_end_to_the_princes: "君王时代之终"
 OMO_end_to_the_princes_desc: "“当那列王在位的时候，天上的神必另立一国，永不败坏，也不归别国的人，它要打碎灭绝那一切国，这国必存到永远。”《但以理书》2:44\n\n面对我们时代的安条克四世，我们已粉碎了玷污这片土地的掠夺者——如同摩西那样，我们在绝境中欢庆胜利。但既然主已将我们从深渊中救出，我们就必须稳住呼吸，以坚定的心志和清醒的头脑迎接前路。哈尔滨仍深陷暴君崇拜的阴霾，那些昔日统治此地的君王遗毒未消，催生出的罪恶与混乱仍在肆虐。\n\n我们不惜代价，甚至不惜献上自己的骨肉，只为彻底铲除专制主义的最后党羽。因为我们比任何人都清楚，当和平之君降临时，祂不会容忍任何悖逆存在。唯有我们清除断壁残垣，圣殿方能焕发更耀眼的光辉。"
 OMO_the_kingdom_of_god_within_us: "神的国度在我们心中"
 OMO_the_kingdom_of_god_within_us_desc: "“看哪，我告诉你们一个奥秘：我们不是都要睡觉，乃是都要改变。”《哥林多前书》15：51\n\n我们凝视染血的双手，望着大地如晨草沾露般浸透哀伤。我们望向如今回荡喜乐祷声的城池——那里曾只有死寂；我们注视那些被赋予崭新圣职的祭司。怀着疲惫与欢欣交织的嗓音，我们轻语一词：\n\n成了。\n\n时至今日，未尽之事仍多——但神命令我们向内而非向外寻求祂旨意的新启示。神赐我们歼灭仇敌，如今我们的职责是驯服祂任性的羊群，使其重获顺服与喜乐。神父亲口述说乡村的新气象，眼中跃动着奇异的火焰——那里充满朝气蓬勃的青年，渴慕变革。\n\n我们将警醒守望，夜复一夜修剪灯芯。当时机成熟，我们必整装以待。"
 OMO_a_new_sermon: "新的布道"
 OMO_a_new_sermon_desc: "“上帝赐福给挪亚和他的儿子们，对他们说：‘你们要生养众多，遍满了地……’”《创世记》9:1\n\n创世之后的岁月里，主看见败坏渗入人类的每个行为，暴力如同无法安抚的瘟疫般肆虐他们居住的疆域。祂的悔意如此深重，以至用四十昼夜的雨水涤净地上生灵。唯有那位受启示建造方舟的虔信者及其家族得以豁免审判。当洪水退去，鸽子衔回橄榄枝时，他与后人走下亚拉腊山，在这焕然一新的世界上重新繁衍生息。\n\n缅神父亦从雅库茨克之巅俯瞰他亲手建立的王国，目睹数十年惨烈战争带来的毁灭。但他也看见了重生的祖国初绽的嫩绿新芽——众多罪孽已被信徒们枪管喷涌的洗礼之火涤净。这与太古时期降临世间的洪水何其相似。\n\n若上帝视他为祂国度当代的挪亚，神父必将以炽热与虔诚肩负这沉重使命。"
 OMO_a_christlike_life: "基督式的生活"
 OMO_a_christlike_life_desc: "“求你使虚假和谎言远离我；使我也不贫穷也不富足，赐给我需用的饮食。”《箴言》30:8\n\n这是一个自古先知时代就有的故事：人们与主立约，分享祂所赐的福分，却在世代更迭中将心思偏离祂的诫命。当信徒们沉溺于罪恶、不敬与致死的罪孽时，上帝神圣的话语只能如空谷回响般徒然无果。最终形成的文明，其腐朽程度之深，甚至污染了基岩下的地下水，使地上居民与主隔绝，灵魂彻底聋聩。\n\n对这些背信者，我们那施行报应的上帝降下了祂可怕而迅速的惩罚。这正是所多玛与蛾摩拉的命运，是尼尼微、推罗和巴比伦的结局——如今也是这片母土的宿命。天父宣告这循环将在此终结，因为从今往后，祂的地上国度中的所有子民都将如我们的主基督那样生活：简朴、谦卑、与人和睦。"
 OMO_the_rural_ideal: "田园理想"
 OMO_the_rural_ideal_desc: "“耶和华神将那人安置在伊甸园，使他修理看守。”《创世记》2:15\n\n圣经中的伟人多出身乡野——农夫、牧人、渔夫——这绝非偶然。在城市的安逸之外，存在着一个仅凭上帝旨意决定人类得失的世界。从事与祂造物相关的生计，常使人经历丰年与荒年的轮转，由此领悟祂对我们生命的坚定掌管。从这样的体悟中，萌生出磐石般不可动摇的信仰。\n\n神父选定这远东之地开展祂的圣工，正彰显其令人敬畏的远见。此处污浊的都市寥寥，农田、牧场与河流如绿茵般铺展于广袤大地。这般风土最宜建立简朴的社群，让农人得以不受搅扰地耕种土地、敬拜上帝——恰如祂所命定的。"
 OMO_a_village_is_a_family: "村庄即家园"
 OMO_a_village_is_a_family_desc: "“那使人成圣的和那些得以成圣的，都是出于一源。所以耶稣称他们为弟兄也不以为耻。”《希伯来书》2:11\n\n正如经上所记：“人若不看顾亲属，就是背了真道。”主教导我们当看顾邻舍——因我们不都是亚伯拉罕的子孙吗？无论出身境遇如何。可叹啊！如今世人正如基督比喻中那些推辞赴宴的宾客，将亲属局限至近亲，好逃避施舍之责。他们为满足私欲所费的周章，必叫我主基督真正发怒。\n\n神父断然憎恶这等虚伪。从今以后，神的国度里各公社无论律法或精神层面，都当不论宗族血脉互为亲属。如此每个村庄都将成为盛大筵席，使基督里众弟兄姊妹——包括贫穷的、瘸腿的、瞎眼的、残废的——都能同享恩典。"
 OMO_the_holy_cities: "圣城"
 OMO_the_holy_cities_desc: "“你地上不再听见强暴的事，\n境内不再听见荒凉毁灭的事。\n你必称你的墙为‘拯救’，\n称你的门为‘赞美’。”《以赛亚书》60:18\n\n神干预人间事务时极少不给出缘由，而祂击打所多玛与蛾摩拉的理由更是数以千计。且不论当地居民对罗得庇护的天使怀有何等邪念——但无论是因人类自身的缺陷，还是文明中心与生俱来的弊病，罪恶如同病态的瘴气般渗透这对双子城，在永无止境的沉沦循环中催生更多堕落。\n\n刚获解放的信众们忧心忡忡，害怕很快会出现另一个所多玛——无论是其特质还是命运。尽管缅神父理解这种恐惧，却不愿将罗迪纳的城市统统视为无可救药。相反，他构想的城市革新方案既能满足俄罗斯民众精神与物质需求，又不过度牺牲商业与工业。人人安居的屋舍、开阔的广场市集、环绕简朴教堂的葱郁公园——这些不过是神父为即将从西伯利亚灰烬中崛起的新耶路撒冷所谋划的蓝图一角。"
 OMO_communal_upbringings: "集体抚养"
 OMO_communal_upbringings_desc: "“又要彼此相顾，激发爱心，勉励行善。你们不可停止聚会，好像那些停止惯了的人，倒要彼此劝勉。既知道那日子临近，就更当如此。”《希伯来书》10:24-25\n\n经上如此记载：我们的主上帝命令我们彼此守望，如同父亲看顾儿女，弟兄看顾弟兄。缅神父考虑将这一信条以更字面的方式践行。\n\n由于席卷俄罗斯的混乱与纷争，我们的祖国遍布无人村庄——这些空壳除了提醒过客想起民族悲剧外毫无意义。这些村庄或将重新住人，但迁入的将是来自俄罗斯远东各地的陌生人，而非血亲与近邻。事实上，俄罗斯的乡村地带大多已如启示录中的葡萄园般被清扫一空。\n\n神父看见悲剧——但也看见机遇。从俄罗斯的灰烬中，或将诞生这样的社群：每个男子互为弟兄，每个男子都视他人之子如己出。"
 OMO_exalt_the_poor: "优待穷人"
 OMO_exalt_the_poor_desc: "“虚心的人有福了，因为天国是他们的。”《马太福音》5:3\n\n上帝如是说：骆驼穿过针眼，比财主进天国还容易呢。须知贫苦人除了灵魂与善行外，在圣彼得面前无可奉献；而富人带进坟墓的每一塔兰特黄金，其来路都要经受审察。古罗马的政客总爱念叨“金钱无臭味”的谚语，但当今的克拉苏们终将惊觉：我主与天军的嗅觉远非凡人可比。\n\n为消解富人们灵里的重担，缅父又揽下一桩苦差：替现今住在王国境内的富人们减轻钱囊负担。所得款项将用于救济那些至今食不果腹、居无片瓦的无名大众。"
 OMO_all_one_in_heaven: "天下大同"
 OMO_all_one_in_heaven_desc: "“弟兄们，我藉我们主耶稣基督的名劝你们都说一样的话，你们中间也不可分党，只要一心一意彼此相合。”《哥林多前书》1:10\n\n主的号角声响彻群山幽谷、平原城邑、悬崖海滨及各类疆域。世间每个角落都回荡着祂神圣的召唤。正如经上所记：被召的人多，选上的人少。这堕落世界多数人仍沉溺罪中，躲避上主的呼唤。\n\n那蒙拣选的少数人来自万国万族、各行各业。贫富贵贱、城乡之别——当我们的目光都投向俄罗斯的新耶路撒冷时，这些名号便如尘埃消散。这城乃造物主亲自设立，若圣父应许，必存到永远。\n\n其他角落终将向主温暖圣洁的光辉敞开心扉。但此刻，让我们同心协力将这光芒洒遍整个俄罗斯。"
 OMO_the_revelations_of_the_past: "过往的启示"
 OMO_the_revelations_of_the_past_desc: "“圣经都是神所默示的，于教训、督责、使人归正、教导人学义都是有益的……”《提摩太后书》3章16节\n\n从《创世纪》到《启示录》，构成圣经的79卷书承载着主神的圣言：祂的智慧与远见，历久弥新。现代人自寻的种种烦恼，都能在其中找到某种形式的解答——往往只需潜心研读福音书便可寻得。\n\n如今平信徒们正步入改革与革命的时代。解放者基督对二者皆有训示，而作为祂的代祷者，缅神父将逐字解析圣经文本、从中提炼改革与革命思想视为自己沉重而庄严的使命。因这人世间的上帝之国，必须筑就足以屹立千年的坚固根基，永远恭候祂凯旋归来。"
 OMO_let_none_go_hungry: "教人不挨饿"
 OMO_let_none_go_hungry_desc: "“困苦的人必吃得饱足，寻求耶和华的人必赞美他！愿你们的心永远存活！”《诗篇》22:26\n\n我们祖国的历史正是矛盾本质的集中体现。沙皇帝国曾是已知世界最庞大的国度，却在德国面前比羸弱耄耋老人更为不堪。神父们称她为神圣，但当伪先知列宁蛊惑民众掀起帝国崩解的革命时，他们的祈祷无人垂听。俄罗斯拥有的农田牧场之广，历史上唯有蒙古帝国可堪比拟——然而她众多子民却终日与饥饿的阴影为伴。\n\n故而神父宣告：若我主基督能以两条鱼五个饼喂饱整座山，试想俄罗斯丰饶积聚的粮食能填饱多少饥肠！"
 OMO_let_none_go_naked: "教人有衣穿"
 OMO_let_none_go_naked_desc: "“他必用自己的翎毛遮蔽你，\n你要投靠在他的翅膀底下；\n他的诚实是大小的盾牌。”《诗篇》91:4\n\n我们祖国的历史堪称矛盾本质的缩影。沙皇的帝国曾是已知世界最庞大的国度，却在德国面前虚弱得如同枯槁的八旬老人。祭司们称她为神圣，但当伪先知列宁煽动人民掀起粉碎帝国的革命时，他们的祈祷无人垂听。俄罗斯大地遍布辉煌宫殿与教堂，盛产丝绸亚麻制成的华服——然而许多子民却日日头顶无片瓦遮身，衣不蔽体地承受风霜。\n\n故而神父宣告：为贫者提供遮风避雨之所的房屋，远比鎏金宫殿与教堂更能成为神的纪念碑，因它们抚慰了子民的苦难，而非用庄严掩饰疾苦。"
 OMO_communal_farming: "共同耕作"
 OMO_communal_farming_desc: "“栽种的和浇灌的都是一样，但将来各人要照自己的工夫得自己的赏赐。”《哥林多前书》3:8\n\n聆听我主圣言，如同领受每日食粮般消化祂的话语。主所赐诫命简明直白：耕作之人与灌溉同伴并无高下之分，因他们终将同享天主恩泽。可叹异邦诸国亵渎圣训，使谦卑农夫屈从于监工，所得不过收成九牛一毛——天国却非如此。\n\n不，缅神父岂能容忍法老苛政。俄罗斯每个村庄首重自给自足，首要之事便是由平等之人共同耕作。"
 OMO_communal_housebuilding: "共同居住"
 OMO_communal_housebuilding_desc: "“在我父的家里有许多住处。若不是这样，我岂不早已告诉你们我去是为你们预备地方吗？”《约翰福音》14:2  \n\n古时的族长们确实蒙神赐福，拥有广阔的庄园和色彩鲜艳的帐篷，供他们自己及家人、仆人和仆人的家属居住，总数达百人以上。他们在朴素的时代里，通过为许多人提供栖身之所来回报神的恩典。  \n\n远东和西伯利亚的人民或许不如亚伯拉罕及其子孙那般富足，但他们已开始效仿他的榜样。随着更多陌生人被接纳为新家庭成员，我们的村庄逐渐扩展为城镇，而为新来者建造的房屋也随之增多。神父对国度如何经营这些砖瓦建筑感到欣慰。"
 OMO_love_thy_neighbor: "爱汝邻人"
 OMO_love_thy_neighbor_desc: "“我们从他受了这命令：爱神的，也当爱弟兄。”《约翰福音》4:21\n\n基督对不公正行为的训诫被称为“黄金法则”绝非偶然。在凡人的事务中，和平向来难以捉摸，无论我们内心多么渴望它。因此，我们尊崇祂对和平的祈求，不仅恪守其字面意义，也遵循其隐含的后果：如我们希望被爱那样去爱我们的邻舍，让和平在分歧中首先被记起。\n\n世上没有比天国更适合实践这一神圣准则的国度。缅神父必将使之实现，无论如何。"
 OMO_progress_through_tradition: "从传统中进步"
 OMO_progress_through_tradition_desc: "“你们各人的重担要互相担当，如此就完全了基督的律法。”《加拉太书》6:2\n\n经上记着说：人若自以为是什么，其实不是，就是自欺了。不要被那些声称独自承受人生苦难之人的谎言所蒙蔽，因为他们不仅欺骗自己，更是对主最大的不敬。人类并非散落的孤岛独自抵御潮汐，而是一片大陆，在其鼎盛之时甚至能抗衡自然的怒火。\n\n这种源自上帝的传统孕育出的进步，至今仍是那些自诩“发达”的西方与东方国家所难以理解的。唯有神父与其子民能让这传统在祖国大地生根发芽。"
 OMO_empower_our_mothers_and_sisters: "放手给母亲与姐妹"
 OMO_empower_our_mothers_and_sisters_desc: "“艳丽是虚假的，美容是虚浮的，\n惟敬畏耶和华的妇女必得称赞。\n愿她享受亲手劳碌所得的，\n愿她的善行在城门口荣耀她。”《箴言》31:30-31\n\n当上帝用亚当的肋骨造出夏娃时，祂为第一个男人预备的是一位帮手。历史上各宗派教义却将《创世记》这番教导曲解为将女性贬为丈夫的负轭牲畜。缅神父对此有不同见解。\n\n通过潜心默想与细读经文，他揭示了真理：上帝为亚当创造的绝非普通帮手，否则大可直接造出完美的役畜。不，祂创造的是一位共同体验造物之妙的伴侣。二者虽因身体构造各司其职，但在上帝眼中，他们如同共享同一位天父般彼此平等。\n\n若世上万民都如此背离祂最初的教导，我们离伊甸园已何其遥远。但踏上救赎荆棘路的时刻，永远不嫌太迟。"
 OMO_open_arms_for_all: "对所有人张开双臂"
 OMO_open_arms_for_all_desc: "“我在神和基督耶稣面前嘱咐你，基督耶稣将要审判活人死人，并藉着他的显现和他的国度：务要传道；无论得时不得时，总要专心；并用百般的忍耐、各样的教训责备人、警戒人、劝勉人。”《提摩太后书》4:1-2\n\n在我们主基督将我们分散到四方去完成大使命之前，祂向所有自称是祂忠信子民的人颁布了必须持守的绝对诫命。忍耐在这些信条中居于首位；毕竟，地上万民在思想和实践上的分歧如同日出日落般不可避免。因异见者的本质而苛责他们，就如同指控一个信徒用饼而非单靠神的话语维生是异端一般。\n\n正是怀着这种受引导的灵，神父作为神所设立的代求者，下令保护祂永恒看顾之下的一切信仰：犹太人、穆斯林、异教徒，以及创世后涌现的万千其他信仰。天国有永恒的时光等待其追随者归回；在此之前，尘世短暂的国度将竭尽所能庇护他们。"
 OMO_stand_against_chauvinism: "反对沙文主义"
 OMO_stand_against_chauvinism_desc: "“并不分犹太人、希腊人，自主的、为奴的，或男或女，因为你们在基督耶稣里都成为一了。”《加拉太书》3:28\n\n亚伯拉罕的子孙啊，放下你们的骄傲吧，因主不悦见弟兄相争。以色列的女儿们啊，抛开你们的嫉妒吧，因他们带到你面前的唯有心灵与灵魂。上帝的选民啊，弃绝你们的仇恨吧，因祂的国度不容子民之间存有敌意。\n\n神圣的西伯利亚将如慈父迎接浪子般接纳这些思想各异的人们，正如我们的主基督张开怀抱迎接我们。\n\n凡违背上帝旨意之人，必遭灾祸。"
 OMO_christian_egalitarianism: "基督教平等主义"
 OMO_christian_egalitarianism_desc: "“因此，人要离开父母，与妻子连合，二人成为一体。”《以弗所书》5:31\n\n让主的话语流入你们甘愿聆听的耳中，使你们的灵魂充满信心与理性。祂藉你们的口宣告：男人与女人本是一体。仅因性别而禁锢他们内心的渴望，这等迫害无异于尼禄对教会先贤及其信众施行的暴政。\n\n作为祂的仆人，缅神父将贯彻上帝所命定的两性平等。任何一方都不应再被束缚于数百年的谬误传统之中。"
 OMO_love_for_the_faithless: "爱不信者"
 OMO_love_for_the_faithless_desc: "“信心软弱的人，你们要接纳，但不要辩论所疑惑的事。”《罗马书》14:1\n\n主如此吩咐我们：我们这日日领受祂恩典的，不可轻看那禁食的；那禁食的，也不可论断这领受的——因我们都是蒙神接纳的仆人，谁有资格审判同作仆人的呢？倒不如将迷途的羊如家人般迎回，纵使它们的羊毛已粗糙，呼声已陌生。\n\n主既愿信这些不信之人，缅神父亦当信他们。那些不敬虔的、不悔改的、自由思想者——那些唯独能在神面前阐明弃绝信仰缘由的人——他们与忠信者同属天国。凡妄解圣言者，必自招哀哭切齿之苦。"
 OMO_friendship_between_all_peoples: "各民族间的友谊"
 OMO_friendship_between_all_peoples_desc: "“因为犹太人和希腊人并没有分别，众人同有一位主，他也厚待一切求告他的人。”《罗马书》10:12\n\n耶和华。安拉。上帝。主神的圣名以巴别塔分散出的各种语言流传于世。经上记着说：凡求告主名的就必得救。既然万民都能随心使用自己的语言寻求救恩，他的慈爱确实没有穷尽。\n\n王国将恪守主与世上其他民族所立的约。只要我们的战士一息尚存，在他的疆域内外……都无人能加害他们。"
 OMO_a_truly_holy_russia: "真正的神圣俄罗斯"
 OMO_a_truly_holy_russia_desc: "“他们要传说你国的荣耀，\n谈论你的大能，\n好叫世人知道你大能的作为，\n并你国度荣耀的威严。\n你的国是永远的国，\n你执掌的权柄存到万代。\n\n耶和华在他一切所行的无不公义，\n在他一切所做的都有慈爱。”《诗篇》145:11-13\n\n从西伯利亚的雪原中崛起了一个没有地上君王的国度。因为有什么冠冕或宝座能比万有之主耶稣更耀眼呢？\n\n在这片疆域内，基督教信仰无需外在装饰。金十字架、银制圣器、镶满珠宝的穹顶与尖塔——这些如同挪亚洪水前罪恶般的教会敛聚的财富、权力与虚荣，已被彻底涤净。唯有如磐石般坚不可摧的真信仰存留至今。\n\n通过其子民，敬虔之心绽放却不带傲慢。漫步奥莫隆的街道，你将见证我们传道的果实：每家都有安居之所，每人都有三餐温饱。摆脱恶习束缚，在共同体支持下，男女老少如今都在主的引领下过着富足、喜乐与平安的生活。\n\n当第一缕晨光降临上帝国度时，神父正在祭坛前祈祷……"
 OMO_the_fruits_of_labor: "劳动果实"
 OMO_the_fruits_of_labor_desc: "历史告诉我们，每个社区的核心在于健康的精神。俄罗斯本身就像一个村庄，要取得成功，需要无私而纯洁的人。我们有许多工人，但其中许多人犯罪，无视其行为给社会带来的腐败。但俄罗斯也很辽阔，因此我们无法有效根除所有罪人。因此，每个村庄都应被命令斋戒，将其财富贡献给我们的事业，以此惩罚不洁之人。通过足够的善行，俄罗斯的精神将得以修复，驱散对物质财富的微小迷恋，代之以责任感。"
 OMO_remember_the_yearning_for_bread: "牢记对面包的渴求"
 OMO_remember_the_yearning_for_bread_desc: "土地破碎，人民濒死。但圣父将拯救神圣的俄罗斯，将其从怠惰的深渊中托起，置于通往天堂之路，这条道路以勤勉铺就。人类以面包为生，这是简单而纯净的食物。我们不可忘记，要获得面包，就必须劳作。不劳者无获。为培育灵性与勤劳的精神，圣父已命令各地神父管理镇民，引导他们走上劳动之路，使他们得以生存，在生命中寻得意义，在意义中获得救赎。"
 OMO_the_joys_of_charity: "慈善之乐"
 OMO_the_joys_of_charity_desc: "世界并非公正之地——有人一无所有，却注定无法拥有。弱势群体数以千计，失业的贫苦男女被社会遗弃。但虔诚的信徒须谨记主的教诲：分享的伟大诫命，只取所需。我们可允许罪恶心灵享受的唯一欢愉便是施予，因通过馈赠，我们滋养社群，喂养无法自足之人，从而成为更好的人。"
 OMO_remember_the_sermon_on_the_mount: "毋忘山中圣训"
 OMO_remember_the_sermon_on_the_mount_desc: "在远古时代，主之子曾对地上的人们说话，他教导人们要心怀仁慈，分享财富并感恩所拥有的一切。那些源于破碎世界的社会主义者们，确实把握了某些真理——尤其是将集体需求置于个人私欲之上的神圣诫命。"
 OMO_look_to_kropotkin: "倾向克鲁泡特金"
 OMO_look_to_kropotkin_desc: "俄罗斯的军阀们所代表的意识形态会撕裂村庄，让普通人在污染中窒息，同时强迫他们在古拉格和公司镇劳作。被遗忘的克鲁泡特金——这位帝国时代的哲学家曾倡导一种无政府主义体系，由定居点自行决定未来，而非遥不可及的政府。秉承上帝的旨意，我们将赋予村庄更多自治权，直至它们能作为自主机构运转。通过将权力交予农民，我们正在践行上帝的意志——一个人必须在主的启示下选择成功或失败。激情与信仰将弥补无政府主义的缺陷。"
 OMO_look_to_tolstoy: "倾向托尔斯泰"
 OMO_look_to_tolstoy_desc: "19世纪俄国作家列夫·托尔斯泰倡导的是一种“基督教无政府主义”体系。而现代无政府主义被共产主义者和军国主义者所腐蚀，鼓吹彻底摧毁社会道德，我们的理念则受到天国之光的启迪。普通民众虽可随心所欲行事，但应通过社群与信仰的感召，秉持无私之心而行动。无政府主义未必意味着秩序缺失——凭借主通过神父赐予的卓越意志力，混乱是可避免的。"
 OMO_no_king_but_god: "没有国王，只有上帝"
 OMO_no_king_but_god_desc: "世间的暴君自诩为领主、总统，这些微不足道的头衔只意味着一件事：某些人比他人更重要。然而在西伯利亚，我们将通过对主的信仰来涤除权力的罪孽。上帝至高无上，祂创造与毁灭，主宰四季轮回，裁定死后归宿。当尘世那些渺小的统治者颤抖着面见造物主时——而我们的社会是神圣的，由良知而非他人统治，我们只向主本身俯首。"
 OMO_blessed_are_the_peacemakers: "缔造和平的人有福了"
 OMO_blessed_are_the_peacemakers_desc: "我们不能再长久依赖农民民兵了。我们的对手已经开始组建职业军队，动用现代毁灭性武器。凭着上帝的荣耀，我们绝不能在这场竞赛中落后。新占领区充斥着前内务人民委员部军官、外国雇佣兵和狂热的民族主义者。我们的目标是通过祈祷的力量重塑这些人的思想——我们将感化异教徒，赐予他们祝福，因为他们通过战争带来和平。神父将亲自接见前将领们，判定他们是配得上跻身虔信者之列，还是该承受主的审判。"
 OMO_a_necessary_sin: "必要之恶"
 OMO_a_necessary_sin_desc: "愿主宽恕我们，但我们已是狼群环伺下的最后羊群。枪杆子就是这片土地的法律，西伯利亚人对铅弹的崇拜更甚于造物主。假以时日我们必将纠正这一切，但眼下生存才是头等要务。在武装民兵之后将成立总委员会，由高级指挥官与地方农民领袖组成。该委员会将分析当前局势、制定研究目标，并协调各村镇筹建新的军火工厂。愿上帝保佑我们神圣的事业。"
 OMO_but_a_sin_nonetheless: "依旧是罪"
 OMO_but_a_sin_nonetheless_desc: "看来并非所有人都准备好接受权力。几位民兵领袖未能完成任务，背叛了对主的忠诚以换取权力。他们威胁农民，克扣额外口粮并滥用过剩的武器装备。此类颠覆分子将面临迅速且彻底的清除。我们原本对人民接受这场严峻战争任务的意愿抱有更高期望，但西伯利亚民众的意志尚未坚定。另一个总委员会将监督由那些展现出虔诚信仰并甘愿为崇高事业献身的人员取代腐败军官的进程。"
 OMO_enforce_humanity: "落实人道"
 OMO_enforce_humanity_desc: "尽管我们必须为生存而犯下罪孽，但绝不能抛弃灵魂——上帝已告诫他的子民不可杀戮。我们并非出于恶意、仇恨或嫉妒而摧毁生命。我们的工作是必要的，这一事实常被某些人扭曲以构建他们自己的叙事。总委员会将着重重塑民兵的思想，使其学会宽恕敌人。俄罗斯绝不能通过自相残杀从灰烬中崛起。唯有宽恕方能重建家园。"
 OMO_an_army_of_the_faithful: "信仰之师"
 OMO_an_army_of_the_faithful_desc: "圣父宣扬利己之道，而神父们皆遵从其教诲。毕竟，一位真正的神之仆从怎能安居后方，却让他的子民为守护圣教而赴汤蹈火？神父们必须随时准备与信众并肩作战。所幸多数神父亦是圣父的虔诚信徒，其忠诚毋庸置疑。当然，并非所有神父都适合前线作战。年长者将被劝导提供精神支援，与参谋部共同策划礼拜仪式，并组织村落防御事务。"
 OMO_an_army_of_the_righteous: "正义之师"
 OMO_an_army_of_the_righteous_desc: "能在最严酷考验中保持冷静者实为蒙福。主明鉴我等牺牲，然不容亵渎其神圣律法。不可杀戮——谋杀乃不敬神者所为。整个俄罗斯皆为我等疆土，却被至暗势力窃取。此“战争”实为拯救民族灵魂的圣战。救赎属于主动夺取之人——得蒙天佑，我等牺牲绝非徒然。"
 OMO_the_three_temptations_of_the_sinner: "罪人的三重诱惑"
 OMO_the_three_temptations_of_the_sinner_desc: "最早追随缅神父的人中，就有那位被称为苏多普拉托夫的男子。这位曾是雅戈达和内务人民委员会教义的信徒，如今抛弃旧主皈依了神父的训导。尽管与昔日主子划清界限，苏多普拉托夫仍沿袭着他们的手段，这让缅神父深感忧虑。不可否认，他的部属在战场上骁勇善战，且与诸多可能助力我们事业的人物保持着联系，但神父认为其行径野蛮有悖基督精神。通过与苏多普拉托夫密切合作，我们或许能将神父的福音传遍整个俄罗斯，但必须警惕在此过程中迷失我们的核心价值观。正如耶稣曾在荒漠四十日经受试炼，如今缅神父也面临着权力诱惑的考验。"
 OMO_sudoplatovs_men: "苏多普拉托夫之兵"
 OMO_sudoplatovs_men_desc: "苏多普拉托夫能为我们的正义事业带来的最大好处之一，就是他过去与NKVD的老关系。尽管NKVD是一个残酷的无神论组织，曾迫害俄罗斯人民，但其成员对战争和现代军队管理有着深刻理解。这些人在统一东西伯利亚的斗争中已经证明了他们对事业的忠诚。苏多普拉托夫提议以NKVD为基础组建新军，进一步将他们整合进我们的部队。神父必须决定：他们带来的力量是否值得让这群野蛮的狼混入羊群，亦或是坚守上帝的教诲——即便这意味着要拿他和追随者们建立的一切去冒险。"
 OMO_cast_the_wolves_out_from_the_flock: "把群狼赶出羊群"
 OMO_cast_the_wolves_out_from_the_flock_desc: "当一个人无所限制时，表现出强势很容易。真正的力量在于对所有人展现仁慈，甚至对敌人亦是如此。苏多普拉托夫的士兵在收复南方时滥杀无辜、恐吓平民，除非他们悔改，否则我们的军队不会接纳他们。上帝诫命“不可杀人”，尽管战争中有例外，但绝无理由为无谓的屠杀开脱。我军行事必须正义且人道，即使这会让我们在对抗敌人时处于劣势。任何不遵守我们律法的人，都无权在我们的旗帜下战斗。如果我们只在方便时才遵循上帝的教诲，那这些教诲又有何价值？"
 OMO_leash_the_wolves: "拴紧群狼"
 OMO_leash_the_wolves_desc: "在统一西伯利亚的战争中，苏多普拉托夫的手下无视神父关于禁止无谓暴行与杀戮的戒律，但他们确实是为我们事业奋战最骁勇的战士。或许上帝将他们派来，正是要让我们通过合作来救赎这些灵魂？毕竟他们为之奋战的事业是正义的，即便他们本身并非完人。通过向他们宣讲上帝与圣父的教诲，或许能引导他们以更符合基督徒准则的方式对待敌人。即便他们漠视神父的训导，但神父的使命太过重要，绝不能因断绝盟友关系而功败垂成。只愿这些盟友能对上帝的律法多存几分敬畏。"
 OMO_sudoplatovs_laws: "苏多普拉托夫之律"
 OMO_sudoplatovs_laws_desc: "当缅神父创立神圣授权时，那只是一个松散的网络，由散布在西伯利亚广袤土地上、相隔数千公里的村庄和公社组成。中央权威薄弱，神父依靠信徒们各尽其责来维持和平。如今东西伯利亚已经统一，苏多普拉托夫开始呼吁缅神父加强控制。神父同意有必要建立正规警察部队来维持公共秩序，但苏多普拉托夫希望更进一步。他要求授权他的人在授权领地的村庄和公社中执行纪律。这将是对内务人民委员部暴政的倒退，但或许是必要的步骤。未来还有许多考验，一个强大、中央集权的国家可能是克服这些考验的必要条件。"
 OMO_there_is_only_one_judge: "唯一的审判者"
 OMO_there_is_only_one_judge_desc: "苏多普拉托夫也许是出于好意，但他已误入歧途。他在NKVD的多年履历在他眼前蒙上一层阴翳，给他培养出一种偏执多疑和威权主义的情绪。在神授国境内，不再有秘密警察，不再有午夜门声。上帝是唯一适于审判祂的孩童的人，我们将把审判留与祂无限的智慧。我们要在全国施行并维持良好秩序与基督教伦理，但做这些，并不需要苏多普拉托夫所呼唤的那种专制措施。地方警察和治安力量足以维持稳定，并确保上帝的诫命得到祂人民的遵守。"
 OMO_discipline_creates_holiness: "纪律铸就圣洁"
 OMO_discipline_creates_holiness_desc: "或许苏多普拉托夫的观点有其道理。上帝对其造物自有秩序安排，虽然我们无法参透全能者的旨意，但祂定然不愿看到自己的子民生活在混乱无序之中。我们的疆域迅速扩张，版图已极为辽阔。治理如此广袤的土地需要一只坚定有力的手。苏多普拉托夫新组建的安全部队将确保国家法律得到严格执行。毕竟，每群羊都需要牧羊人将迷途羔羊引回草场。但愿苏多普拉托夫的牧人们如今能比当年为雅戈达和苏联效力时，展现出更多仁慈与克制。"
 OMO_sudoplatovs_connections: "苏多普拉托夫的关系网"
 OMO_sudoplatovs_connections_desc: "在为雅戈达工作期间，苏多普拉托夫曾与许多才华横溢的人共事。这些人才专注于被委婉称为“非对称战争”的领域——诡计、破坏、暗杀等等。缅神父认为这些人在道德上令人不齿。他们藏身暗处无情出击，剥夺敌人投降忏悔的机会，为达目的不惜伤及无辜。其手段虽违背基督精神，但不可否认极其有效。苏多普拉托夫提议用他们的才能对付我们的敌人。采用如此不光彩的作战方式有违神父的全部教诲，但若想完成基督赋予的统一俄罗斯使命，这类战术或许在所难免。"
 OMO_one_does_not_live_by_power_alone: "人不能仅靠权力而活"
 OMO_one_does_not_live_by_power_alone_desc: "缅神父创造神授国的时候，不是要拿它来铺设通向权力的坦途。他奉全能的主的命建起它来，是要把俄国人民从黑暗中拯救，重新沐浴祂的光明。上帝正指引我们的道路，若我们不偏离祂的教导，祂也必不会教我们走错路。我们不必学我们的敌人，耍弄诡计与种种手段；我们将以朋友或敌人的身份，以光荣、正直的面貌直面他们，因为我们知道我们的主与我们同在，祂必不会令我们失望。无论他是成是败，缅神父都将以清醒的头脑向前行进，他知道自己应当像一个良善的基督徒一般行事。苏多普拉托夫的提议是很诱人，但权力的诱惑恰是最古老的诱惑，神父绝不会被它引入歧途。"
 OMO_and_yet_so_many_could_be_saved: "而许多人可拯救"
 OMO_and_yet_so_many_could_be_saved_desc: "没有什么比上帝造物的生命更重要，甚至我们的原则也不例外。苏多普拉托夫的手段不光彩，甚至懦弱，但它们或许能决定冲突是速战速决还是旷日持久。如果几项违背基督教精神的行为能拯救数千基督徒的生命，避免难以言表的苦难，那么不作为、任由众多上帝的子民丧生，难道不也同样违背基督教精神吗？缅神父对这个决定感到不安，但他必须将信徒的安危置于首位。他只能祈求上帝理解——他也不过是个凡人，与任何人一样不完美。或许最终这一切都是值得的。神父祈祷事实如此。"
 OMO_await_judgement: "静待审判"
 OMO_await_judgement_desc: "数月以来，苏多普拉托夫不断向缅神父提出各种要求与改革建议，以符合他对国家的理念并巩固其影响力。他的提议虽逻辑缜密、论证有力且行之有效，却与神父的道德准则及全能上帝的教义相悖。在两人持续数月的激烈冲突后，苏多普拉托夫的要求终于戛然而止。表面看来，新的平衡已然形成——要么是他最终接受了缅的教诲并幡然醒悟，要么是神父屈从于足够多的诱惑，准备将西伯利亚改革运动推向新阶段。唯有上帝知晓何种结局将会降临。对俄罗斯人民而言，真相唯有时间能够揭晓。"
 OMO_the_time_of_liberation: "解放之时"
 OMO_the_time_of_liberation_desc: "是时候了，虔诚的信徒将要张开双臂，拥抱我们的土地。尽管接下来会有痛苦与艰辛，但我们不要把即将到来的苦难误认为是末日来临，而是神圣俄罗斯的诞生！当大欺诈者打击我们的精神，使我们恐惧的时候，要记住主永远站在我们身后，祂爱我们，就像我们爱我们的孩子一样。"
 OMO_abolishing_exploitation: "废除剥削"
 OMO_abolishing_exploitation_desc: "即便是在如此黑暗悲惨的日子里，我们也要坚守信仰。在中西伯利亚的土地上，上帝的儿女们都被撒旦的仆从、狡猾的专制暴君和信奉异教的共产主义者所利用。对那些最邪恶的人的清算已经到来，这些人已被镇压，百姓的希望也随之复活。在缅神父的指引下，任何男人、女人和孩子都不会再受到剥削了。"
 OMO_repairing_bukharins_sin: "偿还布哈林的罪"
 OMO_repairing_bukharins_sin_desc: "亵渎神明的布哈林对他的同胞进行了邪恶的审判和监禁，他宣称自己凌驾于主之上，而上主则将祂的怒火倾泻到了这片土地。所有的古拉格都将被拆除，其囚徒也应予以释放。这世间只可有一位高于一切的判官，而他的古拉格只可容纳有罪的人。"
 OMO_a_kingdom_of_god_on_earth: "地上天国"
 OMO_a_kingdom_of_god_on_earth_desc: "西伯利亚的神圣使命只服务于主。缅神父只服务于主。这个一度统一的神圣国家的未来，也将只服务于主。我们的灵魂因上帝而欢欣，祂将怜悯赐予不信者，我们也必须如此，但若背弃基督的统治，便是背弃祂。"
 OMO_bridge_the_gap: "消弭隔阂"
 OMO_bridge_the_gap_desc: "各色信徒与非信徒皆有故事可讲，有爱要传递。就让他们如此团结起来，为我们的圣地创造和谐安宁的平衡。“倘若你们认为事奉耶和华不好，今日就可以选择所要事奉的……至于我和我家，我们必定事奉耶和华。”"
 OMO_an_ear_to_the_faithless: "倾听不信者"
 OMO_an_ear_to_the_faithless_desc: "无论祂的子女是否在祂的光辉中寻得救赎，上帝对他们的爱始终如一。聆听缅神父的教诲吧，不信之人。这片土地上并非所有人都是虔诚的信徒，但他们的悲伤与梦想都将被倾听。"
 OMO_a_godly_russia: "神圣俄罗斯"
 OMO_a_godly_russia_desc: "神圣俄罗斯不应有庙宇，因为全能的主上帝与羔羊就是它的圣殿。这片被背信与苦难撕裂的土地，必须被引领至主的救赎之光中，使其为神所圣化，让全世界都见证这一切！"
 OMO_enlightening_the_faithless: "启迪迷途者"
 OMO_enlightening_the_faithless_desc: "不信者若甘愿沉溺于没有主之光的冰冷生活，便随他们去吧，但这无法阻止缅神父向大众传教。他的荣耀与仁爱必将随信徒足迹传遍四方，每一个皈依者都意味着为天国拯救了又一个灵魂。"
 OMO_denouncing_the_sinners: "谴责罪人"
 OMO_denouncing_the_sinners_desc: "七宗罪在俄罗斯各地侵蚀着撒旦的爪牙，但即便是最纯洁的婴孩也可能被罪恶腐化。因此我们的法律必须彰显主的恩典，摒弃撒旦的道德污秽——从残暴谋杀到贪婪的高利贷。"
 OMO_a_syncretic_russia: "共融的俄罗斯"
 OMO_a_syncretic_russia_desc: "主教导缅神父既要信仰也要宽恕。他侍奉上帝，也将同样侍奉他的人民，无论他们个人信仰如何。我们将鼓励信仰的平衡，以反映大自然美妙的平衡，因此我们的法律将同时考虑基督教和无神论的思想。"
 OMO_an_equal_russia: "平等的俄罗斯"
 OMO_an_equal_russia_desc: "那些追随自己信仰与偶像的人不应被排斥于我们神圣的社会之外，而应以张开双臂的喜悦欢迎他们加入。异教徒是否皈依并不重要；心怀大爱之人必将活在神的爱中，因为神本身就是爱的化身。"
 OMO_faith_is_a_choice: "信仰是种选择"
 OMO_faith_is_a_choice_desc: "唯恐我们陷入撒旦设下的仇恨同胞的陷阱，我们必须允许异教徒践行其个人信仰。信奉圣三一乃最纯净之信仰，但那些将灵魂奉献于其他信仰并心怀仁爱者，绝不应被强行劝阻。"
 OMO_secular_yet_holy: "世俗却神圣"
 OMO_secular_yet_holy_desc: "我们的俄罗斯将成为一片充满上帝子民的圣地，但依然是一个世俗国家。我们只要求做个好人，因为正是善良与爱给多数人带来希望，让少数暴君心生畏惧。若主不爱他这不完美的子民，又怎会献出独生子在十字架上受苦？"
 OMO_unite_the_flock: "团结羊群"
 OMO_unite_the_flock_desc: "缅神父作为主在尘世的牧者服务于我们众人。整个俄罗斯必须在爱与信仰中融合，如此我们才能重新团结同胞，将他们带入祂的神圣之光。一场圣战正等待着我们所有人。\n\n“那时我们这些活着还存留的人，必和他们一同被提到云里，在空中与主相遇。这样，我们就要和主永远同在。”"
 OMO.autonomy.1: "来自冰封北境的信"
 OMO.autonomy.1.d: "[GetOMO_LetterDesc]"
 OMO.autonomy_1_desc_COM: "奥莫隆\n\n[?global.date.GetDateStringNoHourLong]\n\n亲爱的同志[IRK.GetLeader][BRY.GetLeader]：\n\n我们已获悉贵方近期统一该地区的成就，对此我们表示赞赏，认为这是恢复全俄秩序与稳定的重要一步。我们致信旨在呼吁和平统一，以和平与团结实现统一。\n\n我们诚挚恳请您尊重该地区人民——无论是占多数的民族还是少数民族——的意愿，让他们能够自由践行宗教信仰与传统习俗。西伯利亚人民渴望和平合作与共同奉献，以期实现全体俄罗斯人的未来统一。\n\n我们衷心祝愿并期待最美好的合作、团结与和平。\n[OMO.GetLeader]"
 OMO.autonomy_1_desc_FAS: "奥莫隆\n\n[?global.date.GetDateStringNoHourLong]\n\n致领袖[CHT.GetLeader][MAG.GetLeader]：\n\n我们已获悉贵方近期统一该地区的成就，对此我们表示赞赏，认为这是恢复全俄秩序与稳定的重要一步。我们致信旨在呼吁和平统一，以和平与团结实现统一。\n\n我们诚挚恳请您尊重该地区人民——无论是占多数的民族还是少数民族——的意愿，让他们能够自由践行宗教信仰与传统习俗。西伯利亚人民渴望和平合作与共同奉献，以期实现全体俄罗斯人的未来统一。\n\n我们衷心祝愿并期待最美好的合作、团结与和平。\n[OMO.GetLeader]"
 OMO.autonomy_1_desc_AMR: "奥莫隆\n\n[?global.date.GetDateStringNoHourLong]\n\n致全俄罗斯的领袖[AMR.GetLeader]：\n\n我们已获悉贵方近期统一该地区的成就，对此我们表示赞赏，认为这是恢复全俄秩序与稳定的重要一步。我们致信旨在呼吁和平统一，以和平与团结实现统一。\n\n我们诚挚恳请您尊重该地区人民——无论是占多数的民族还是少数民族——的意愿，让他们能够自由践行宗教信仰与传统习俗。西伯利亚人民渴望和平合作与共同奉献，以期实现全体俄罗斯人的未来统一。\n\n我们衷心祝愿并期待最美好的合作、团结与和平。\n[OMO.GetLeader]"
 OMO.autonomy.1.a: "[GetOMO_LetterA]"
 OMO.autonomy.1.b: "[GetOMO_LetterB]"
 OMO_autonomy_1_a_IRK: "好，我再也不想看到这封信了。"
 OMO_autonomy_1_a_BRY: "团结协作！"
 OMO_autonomy_1_a_CHT: "俄罗斯各族人民应当团结一致。"
 OMO_autonomy_1_a_MAG: "不用打仗就好。"
 OMO_autonomy_1_a_AMR: "他们无关紧要到我们都不屑否认，不是吗？"
 OMO_autonomy_1_b_IRK: "统一的俄罗斯民族之下无宗教之分。"
 OMO_autonomy_1_b_BRY: "这简直无法容忍！"
 OMO_autonomy_1_b_CHT: "他们无权对沙皇发号施令。"
 OMO_autonomy_1_b_MAG: "他们无权对领袖发号施令。"
 OMO_autonomy_1_b_AMR: "派坦克把他们一个个送上天。"
 OMO_uprising.1.t: "无线电静默"
 OMO_uprising.1.d: "西伯利亚东北部所有新建的驻军据点都陷入了沉寂！从逃难的平民和军人那里获得的消息显示，群众以一位名为“亚历山大·缅”的神秘东正教神父为名发动了叛乱。据报道，驻军据点已被包围，物资遭到洗劫，士兵要么被灌输他们的理念，要么被驱逐出境！\n\n这场叛乱蔓延之迅速及其令人费解的高支持率，给整个远东地区带来了巨大的混乱与动荡，军方完全无法预测他们的下一步行动。"
 OMO_uprising.1.a: "怎么回事？我们原以为他们不堪一击？"
 OMO_uprising.2.t: "新的攻势"
 OMO_uprising.2.d: "[GetOMO_Uprising2]"
 OMO_uprising2_FAS: "关于叛乱的后续消息已经传来！根据混乱的报告，叛乱分子已成功向北布里亚特推进攻势，进一步将民众洗脑至他们虚幻的事业中！我军已建立防线以抵御任何进一步进攻，并逐步为可能的反攻奠定基础。\n\n我军已制定反攻计划，准备在4至6天内执行。我们应该暂时将所有资金和注意力都集中到镇压叛乱上。"
 OMO_uprising2_COM: "关于叛乱的后续消息已经传来！根据混乱的报告，叛乱分子已成功向曾经的阿穆尔地区推进攻势，进一步将民众洗脑至他们虚幻的事业中！我军已建立防线以抵御任何进一步进攻，并逐步为可能的反攻奠定基础。\n\n我军已制定反攻计划，准备在4至6天内执行。我们应该暂时将所有资金和注意力都集中到镇压叛乱上。"
 OMO_uprising.2.a: "一步也不许后退！"
 OMO_uprising.3.t: "反攻开始"
 OMO_uprising.3.d: "军方已制定出一项大规模反攻计划，旨在立即对前线展开炮击与进攻，迫使叛乱势力崩溃。我们虽不确定叛军的实际抵抗能力，但预估其无法长期抵挡我军攻势。因此，我们必须尽快发起强力攻击，阻止叛军部队实施任何进一步的进攻行动。"
 OMO_uprising.3.a: "他们消失得越快越好。"
 OMO_uprising.3.b: "他们的事业必将成功！"
 OMO_uprising.4.t: "天命所归，胜利在望！"
 OMO_uprising.4.d: "主之手已击下，异端之幕尽裂。烈火化为灰烬，灰烬复燃烈火；义者得蒙赐福，愚者终陷死地；犹疑者溃于迷茫。正义已胜，奸邪遭诓，不义者终亡于无福之业。得福者屹立，为人道而战，奉主之名，承主之佑。故而进军，讨伐罪孽，凯旋而归。于是罪恶溃败，欺诈崩解，悖德消亡，唯神圣审判永彰。"
 OMO_uprising.4.a: "让所有与我们为敌者知晓何为罪孽。"
 OMO.9.t: "东行者的羁旅"
 OMO.9.d: "背信者必受其仆之苦，因他们将真切体会上帝之国为人填补的虚空之痛。当虔诚者、正直者与强者伸手触及天堂之门以求永恒乐土时，虚伪者与其同党终将坠入凡尘，手握顽石，哀嚎响彻荒芜的夜空。\n\n此乃西境之人的灵魂宿命。身为凶手却侍奉凶手，该隐之印无论以何名相称，同样腐朽。他甘愿违逆我主，沉溺于凡俗罪孽的诡计。于是他向东而行，褪去大地上战士的华贵甲胄，披上卑微者的褴褛衣衫，跋涉无尽荒原，终至神父奥莫隆的圣地。\n\n正是在此地，这名凶手蜕变的流浪者直面天罚真相，跪倒在神父面前。他的忏悔之词回荡于诸天，全能我主垂听，欣见罪人心中救赎之火。至高者的器皿——我们的神父——将他从污秽的凡人终局中提升，使其转向圣洁之光。凛冬之夜，恶徒西境人手上的鲜血已然冻结；然我主之光涤净罪孽，令他焕然新生。"
 OMO.9.a: "奥摩隆的圣谕。"
 OMO.10.t: "天主光辉之下"
 OMO.10.d: "全能者的恩典，非经人手的传递，亦非异教徒的仪轨咒语；主的光辉乃借人心的热忱而显，借灵魂的良善与正直而明，正如主的奇迹借生命中的白昼日日赐福世人。\n\n在那巍峨山巅，圣父之光——独一真神之器皿——辉耀而下。圣父于此引领众人祷告，唱诵圣诗以祝佑此土，冀望终有一日得见万宅之宅，使谦卑温顺者获新生超拔。凛冬之风虽蚀墙垣，然信仰之火护佑所有祷告者，圣父的圣言如毯覆庇，他将我等灵魂携至离天最近处，此般亲近，俄国无人能及。此处曾有颂歌、祷词与呼喊，边陲男女聚于圣父守望之下。此处亦是主之光降临之地，传教之火的种粒初萌于世间。\n\n当伟力圣父垂目之际，是他挚爱的信徒提出将这信仰传遍冻原的宏愿。因圣父之意，因神之意，纵使我等伟大的圣父安息，我们也必为在俄国为主燃亮道路！"
 OMO.10.a: "俄罗斯的雪啊，愿您受祝福。"
 OMO.11.t: "我们的原罪"
 OMO.11.d: "罪不再源于世间黑暗、阴影与可憎之物的源泉；相反，罪以伪装运作，通过诱惑与欲望蛊惑人类，将他们更紧密地带往地狱。是的，这欣嫩子谷充斥着放债者、强盗与贪污者，正如天父如此深入地踏入这罪恶深渊。\n\n子与父，兄与弟，我们信仰的兄弟民兵团当日追随天父进入此地。虽旅途劳顿，却再不愿让腐朽的堕落侵蚀家园之心。于是天父下令执行必要之事：放债者的钱庄被强行关闭，驱逐了罪的毒蛇；强盗当日被捕，将依圣典律令受审；而那贪污者被拖出懒惰贪婪的巢穴时，何等凄厉地哀求着。然而当枪声噼啪响起时，兄弟会以更猛烈的火力还击，令天父陷入深深悔恨——我们的士兵如此奋勇向前，降下了主的烈焰审判！\n\n于是，依照主的旨意，村庄在那日焚烧殆尽，让圣火净化这片污秽罪恶之地。然而当士兵们——独一圣神之下的人类审判者——欢呼胜利之时，我们的天父却重重跪倒在地，任夜空将天霜碎片缀满他的斗篷。就在那时，他潸然泪下。"
 OMO.11.a: "我们侍奉的，乃是耶和华的话语。"
 OMO.12.t: ""
 OMO.12.d: ""
 OMO.12.a: ""
 OMO.13.t: "主的圣言，万民当听"
 OMO.13.d: "在那久远逝去的古老岁月里，正是通过以马内利，卑微与被遗弃者才得以获得挣脱暴政、暴力与罪恶压迫的力量。基督自身的受难终结了他在人间的尘世使命；然而，一个新的主之器皿正行走于温顺谦卑者之中，准备将祂的箴言传遍这冰封世界的每个角落。当圣父前行将上帝之光带给恶魔横行的荒原时，那将是每个野蛮人、暴君与邪教徒的审判之日。\n\n圣父如此庄严地登上神的讲坛，向身旁少数被选中者宣讲，其声却响彻泰加林：“这光明世界的兄弟姐妹们。不正是我们将圣经中神的应许带临人间吗？诚然如此：我们的祖国俄罗斯已陷入强盗、独裁者与掠夺者的绝望深渊。但须知，兄弟姐妹们：正如经上所记——‘欺压贫寒为要利己的，馈赠财主的，都必缺乏。’因此，我们的责任就是挣脱这些暴虐狂徒令人窒息的掌控。因大能的主渴望正义在我们破碎的世界兴起，我们必须以祂之名成为审判的第一执行者。在这奥莫隆山岗上，我们为所有被称为俄罗斯人者祈祷！”\n\n圣父的启示由此明晰：任何盗贼或迫害者都无法颠覆主的威能。天国的追随者们就此进军，挣脱奴役与压迫的锁链。然而当这些男女为自由而战而杀戮时，圣父却轻声说出温柔的话语……\n\n“只是我告诉你们：要爱你们的仇敌，为那逼迫你们的祷告，善待恨你们的人，祝福诅咒你们的人。”"
 OMO.13.a: "我们歌颂的乃是天国的圣歌！"
 OMO.14.t: "净罪者亦当受净"
 OMO.14.d: "耶和华以耶稣基督、神之子的形象宣告说：“不要与恶人作对。有人打你的右脸，连左脸也转过来由他打。”\n\n在伊尔库茨克腹地，当主的战士攻破城池时，有个被拖到市集广场的人试探我们的神父。那人咆哮道：“我是亨里希·雅戈达，苏维埃社会主义共和国联盟中央委员会的忠诚仆人，革命之惩戒铁腕，我唾弃你们虚妄的言辞！”人群发出刺耳的喧嚷，要求立即处死这人献给主；然而神父却巍然屹立在那人身旁，俯身贴近这个可怜人伤痕累累的面庞。“不要惧怕，我的长者。我们并非索你性命，只为这片沉沦大地求得神的救赎。或许你愿与我们同行，迈向新生？”\n\n然而神父眼中映出了一道罪孽之墙。“你们都忘了布哈林吗？亚历山大·缅不过是个招摇撞骗的异端！”名为雅戈达的男子嘶吼着，却只激起愤怒农民们的咆哮，他们随时准备将他撕碎。“不要惧怕。”神父宣告着将手按在这位官员肩头，从天国云层中唤来慈悲微笑。\n\n天上的神啊，盘踞的毒蛇出击时何等果决？那日便得见证——当男子大衣口袋露出托卡列夫造物，直指神父颅骨之时。但藉着神更大的光明，这毒蛇被拔去了毒牙，只听得击锤空响声响彻霜风，随后是数千围观者雷霆般的静默。直到有个将满十岁的女童率先用石块回击那人头颅，数百块飞石随之而来，人群化作暴民，暴民施行了私刑。\n\n而神父哀恸至极，指甲在西伯利亚冻土上抓出血痕，脸上唯余眼中淌下的温热，向全能者祈祷这些人终得救赎，熄灭心中嗜血的怒焰。"
 OMO.14.a: "父啊，赦免他们，因为他们所做的，他们不晓得。"
 OMO.15.t: "抗争者教皈依"
 OMO.15.d: "耶和华如此说：“贫穷的人有福了，因为神的国是你们的。饥饿的人有福了，因为你们将要饱足。哀哭的人有福了，因为你们将要喜笑。”\n\n当神圣旗帜高悬于乌兰乌德城上空时，这座曾背弃圣洁、被人类革命价值观引领的城市，终迎来上帝之国降临人间。于是神父登上奥季吉特里耶夫斯基大教堂的台阶，命令败军前来觐见。就在这座斯摩棱斯克圣母大教堂里，神父将直面那些违抗耶和华旨意的叛逆者！\n\n但那位在回廊与神父四目相对的年轻水手并未受罚。香烛为至高者点燃，金色敬意如缕缕青烟升腾。这少年不求天国救赎，只为自己民族的权益、幸福与生命抗争。纵堕地狱，其灵魂仍受尊崇；虽背神名，其使命依旧圣洁。如此高贵灵魂甘愿隐姓埋名践行神旨，谁又能审判他的死亡？\n\n神父以无上智慧宣判：命这水手作为上主仆从随侍御前，凡神父所至之处皆须传扬福音。诚然，神之器皿看出他虽领受赦免却毫无信仰；但神父仍见证他如其所愿，在俄罗斯民众间广行善举。"
 OMO.15.a: "不情愿者终得完整。"
 OMO.16.t: "妥协者得善报"
 OMO.16.d: "圣历[GetYear]年，蒙上帝赐福倾覆的可憎之城马加丹转获至福始末录——原法西斯黑暗之道追随者、马特科夫斯基之书记官谢尔吉乌斯辑录：\n\n晨钟于第七时初鸣，惊醒城中俄民与各路异邦佣兵，共迎新日。然直至第十一时，旭日方穿透云霭，将圣光赐予北境受洗之师。是时，持械者无论佣兵土著，皆聚城墙，防备那或将吞噬全城、毁尽万家之祸。当耀目阳光笼罩每个战士，马特科夫斯基统领众人，天光如启天门般映照神父身影——他正徐步迈向马加丹城门。\n\n正是此人率众穿过城门，洞悉那连月预言之血战终临。此刻，马加丹当以地狱之火围剿北来入侵者，他们妄图颠覆本地领袖马特科夫斯基之伟业。或许，倘若诸事顺遂，他尚可为自己谋得一线生机。\n\n随后数时，西伯利亚雪原浸透血海。美利坚人、德意志人、南非人及俄罗斯人尽皆在城门厮杀毙命，凡举枪对抗基督圣盾者，终皆伏于仁慈圣父膝下。而马特科夫斯基遁逃途中困于损毁战车，烈火焚城之际，上主降下宏大恩典：赐此苟活者新生之光，令其蜕变为书记官谢尔吉乌斯，注定追随圣父圣咏传颂俄土全境。"
 OMO.16.a: "因他的慈爱永远长存！"
 OMO.17.t: "疯魔者要处置"
 OMO.17.d: "主如此说：“不可毁谤人，要与人和睦，总要温柔，向众人显出完全的谦让。”\n\n哦，泽雅啊，你向这些俄罗斯土地献上黄金厚礼时何其伟大，征服属于你自己的海洋时又何其勇猛！然而这座城再也不能容忍与帝国和法西斯同流合污，背弃圣经的庄严，换取野蛮与屠戮！于是神父出征，在他的胜利中夺取了这片水域根基——那里盘踞着法西斯孕育的恶魔，其首领被铁链直接押解至神父面前。正是在此处，这恶魔对着公义圣经发誓称自己行为正当，否认我们的神父……正是在此处，这恶魔褫夺上帝圣言，窃夺祂的荣耀，妄图自封为神……最终，恶魔竟向神父战靴吐唾沫，以第三次亵渎彻底背弃我们的父。此刻恶魔被带入密室，由神父亲自审判。\n\n无人知晓那日密谈的内容。是忏悔圣事后的神圣赦免？是哲人与诗人的对话？还是为这可怜灵魂的阴影敞开天堂之门？唯有一点众人铭记：这恶魔重新变回了凡人的模样——一个浸透悔恨的人，当日便在人群中主动迎向绞索。于是全能者的追随者们低语：这般结局在主的眼中是否公正？抑或神父的泪水已昭示他们犯下了深重罪孽？"
 OMO.17.a: "怜恤人的人有福了，因为他们必蒙怜恤。"
 OMO.18.t: "囚困者应赦免"
 OMO.18.d: "主如此说：“你们要记住被囚禁的人，如同与他们同受囚禁；也要记住遭苦难的人，因你们也在肉身之中。”\n\n我们的神父再次降临在赤塔这片土地上，与全能上帝的仆人们并肩而立，他们誓要从权欲熏心的狂徒手中解放这座革命之城。当关于沙皇加冕的流言越过山川河谷传入父的耳中，他已然准备好再次将受压迫者从暴君手中解救。那天，奥莫隆的儿女们如潮水般涌入这座城，在主的注视下英勇奋战，誓要为这片饱经创伤的土地开创正义与繁荣的新纪元！\n\n然而，在这位伪皇帝宫殿的穹顶之下，全知者的光芒终将真相大白。原来统治这片土地的竟是一群叛徒，他们将战争与暴力的律法奉为圭臬，更推举一位无辜者为领袖——那位面对流血泣不成声，不断祈求跨越重洋归乡的灵魂。那天慰藉之风吹遍俄罗斯全境，奥莫隆的战士们收押了统治这片土地的暴君集团，而我们的神父则与那位被自身血脉囚禁的人促膝长谈。这样的生活不该属于他，这样的囚徒境遇不该属于任何人。\n\n于是这个异乡人在绞刑架林立的轨迹中，再次扬帆归航。他虔诚地横渡鄂霍次克海，穿越太平洋！历经多日的休憩、沉思与祈祷，此人终于回到温暖宽恕的故乡。当与家人相拥时，他所能向亲友诉说的，唯有神圣解放者赐予他的那些书写在东正教圣典上的箴言。"
 OMO.18.a: "如今主就是那灵，主的灵在哪里，哪里就有自由。"
 OMO.19.t: "主的劳苦"
 OMO.19.d: "主并非以那种对世界懒散阴郁的目光来铸造创造的伟业，而是用他那强有力、金光闪耀的手，自愿为一切植物、一切动物和全人类带来光明与生命，才得以缔造出如此完美又不完美的宇宙。正因如此，正是通过我们的神父——我们上帝的器皿——的宏伟功绩，我们才能成为这片广袤天地的英勇领袖，为俄罗斯所有人在这黑暗时代的阴影中提供指引与救赎的圣光。\n\n神父曾伫立于奥莫隆河畔高耸教堂的冰晶穹顶之下，凝视着他子民结出的果实。那些迷失者、被遗弃者、软弱者，在天国之光的照耀下蜕变为独生圣子的强大战士，降生于这个支离破碎的世界，将上帝的国度再度降临人间，正如《启示录》所预言。啊，先知的预言未曾揭示天父将引领我们完成的圣行——从铲除罪恶的暴君，到将那片误入歧途的古老土地纳入我们强大的疆域！唯有通过以马内利之矛，我们方能领悟主所赐予的荣耀、力量与虔诚。\n\n我们的神父，在承担了领导过程中那些伟大而可畏的功业后，安然休憩。他清晰地思索着一个自这漫长征程伊始便萦绕心头的意象：彩虹。那并非预言书或启示录中关于救赎与辩白的刻板文字，而是神父在脑海中能构想出的最真实的神性展现——美丽、令人敬畏又充满慈爱。然而，当他注视着追随者言行中迸发的火焰时，这个世界还将为他准备怎样的篇章？"
 OMO.19.a: "相爱有时，恨恶有时；争战有时，和好有时。"
 OMO_father_regional: "西伯利亚神授国"
 OMO.20.t: "为囚徒的布道"
 OMO.20.d: "《路加福音》如此记载：“主的灵在我身上，因为他用膏膏我，叫我传福音给贫穷的人；差遣我宣告被掳的得释放，瞎眼的得看见，叫那受压制的得自由。”\n\n“究竟要灵魂堕落至何等程度，才配得上监禁之苦？难道一个因压力考试失利的学生，就该为劳动失败被流放至西伯利亚的冰原深处吗？弟兄姊妹们，今日我要告诉你们，这座充满煤灰的奴役营——为铺设铁轨而建，为创造无人能享的财富而存——关押的并非罪犯，而是与你我无异的、饱受欺凌的弟兄姊妹。试想一个莽撞爱笑的孩子坠入贝加尔湖的深渊。作为这世间孩童的父母，我们难道有责任按住他的头颅，让冻伤与溺毙成为他过错的惩罚？难道我们不该为这孩子奋战，救他脱险，护佑他的灵魂得享正义，并帮助他在所有努力中变得更好？这才应是我们——不，是我们必须——对待这些长久困在自身‘贝加尔湖’中的人们的方式，当煤灰灼伤他们的肺，老茧爬满他们的手。让他们来到你我中间，我们将引领他们获得新生。”\n\n于是男女老幼纷纷走向阿穆尔劳改营的深处。他们不再是鞭响下凿石的奴隶；不，这些人是上帝拣选的子民，要解放那些被昔日暴君贴上“危险”标签的弟兄姊妹，使他们成为耶和华的儿女。"
 OMO.20.a: "阿门。"
 OMO.21.t: "对镜朦胧"
 OMO.21.d: "在希伯来子民的时代，上帝以神圣之光显现于祂的选民，在狂暴的旋风中降临，使群山消融。但随着基督的降临，这类神迹不再频繁显现。于是神父如同往常般祈祷寻求指引。正如先知们所经历的，上帝的声音从他内心最细微的缝隙中流淌而出——教堂医疗室灯光下哺乳婴孩的慈祥妇人，在工人神父协助下重建破败公寓的农民，还有在西方无神国度里用喜乐膏抹世界的悔罪者，那里暴君仍在妄自尊大地统治着。\n\n神父为这些景象不住祈祷。他的心如同雪花石膏瓶倾泻而开，盛满代求，也预备着复兴——若有必要。\n\n祈祷未久，他便得见连保罗多年侍奉都未获赐的恩典。主引领他的目光望向密林深处一泓池水，当他凝视时骤然惊呼：水中倒映的竟是万有之王基督！宇宙的统治者！大卫的凯旋者！那声音吐露着与天使同频的音节，在他战栗时，主温暖的怀抱环绕了他——不是审判，而是爱。\n\n“来吧，我的仆人。”主轻声说，“再看。”池中影像此刻分明是他尘世的父亲。“我爱你。”这耳语响起的瞬间，神父不再是神父，而变回那个目光炽烈、以撼动天地的热忱爱着父母与上帝的男孩亚历山大·缅。他伸手触碰水中面庞，那面容竟化作他自己。\n\n神父在冷汗涔涔中惊醒，耳畔神触犹鸣，他轻声呢喃：“噬人之狮化而为人，此狮当颂；为狮所噬之人，其当诅……”"
 OMO.21.a: "狮化为人。"
 OMO.22.t: "困苦之人"
 OMO.22.d: "有一天，亚历山大神父受邀来到扎什奇申·博戈姆村（意为“受神庇护之地”）参加丰收庆典。村民们以丰盛宴席和华美彩衣迎接这位代祷者。男女老幼欢欣鼓舞地簇拥在救赎者身后，争相触摸他的圣袍，渴望沾染亚麻布料浸润的神圣气息。村中长老们更是献上本村最高的厅堂——比扎什奇申·博戈姆任何建筑都高出一倍——供神父休憩用餐。\n\n就在这时，他注意到村门外站着个衣衫褴褛的男子。那人沾满泥土的双臂捧着个柳条篮，里面盛满蒸土豆。凌乱发丝间透出哀求的目光，与至少十步开外围观的人群形成鲜明对比。缅神父好奇询问身旁长老：“栅栏外那人是谁？为何不敢进村寻求庇护？”\n\n“小事而已，神父。”老者答道，“我们早就不理会疯癫的叶戈尔了。他妻儿俱丧确实可怜，但悲痛不能成为邋遢的理由。”说罢正要引神父入厅——却扶了个空。\n\n待众人回过神来，神父已走到厅堂与叶戈尔之间的中点。有人高喊：“缅神父，您要去哪儿？”\n\n他头也不回地答道：“自然是去领受神之子叶戈尔的祝福。他的粗茶淡饭能填饱我的肚子，他的茅草屋顶可为我遮风挡雨。你们留着石墙与乳猪吧，主岂会独享无法普施众生的恩泽？”"
 OMO.22.a: "如是一个村庄学会了谦卑。"
 OMO.23.t: "疑童"
 OMO.23.d: "亚历山大神父带着三名门徒来到奥莫隆广场。他指着往来信徒、堆满水果肉类的集市，以及混凝土灰墙上方湛蓝的天空与树木。“告诉我，斯蒂芬、阿尔乔姆、库兹马，”他问道，“眼前这番繁荣景象，我们该归功于谁？”\n\n“当然是您的力量，神父？”斯蒂芬故作虔诚地反问，“能在西伯利亚严酷环境中幸存，并以弱胜强赢得战争，这需要何等坚韧。”向来直言不讳的阿尔乔姆立刻斥责：“你傻了吗斯蒂芬？先知不是说过‘最有力量者乃知识与智慧兼备之人’吗？所以这些成果显然源于神父的智慧。”待二人争论得面红耳赤，库兹马才缓缓开口：“要我说，若没有神父那被上帝亲吻过的口才，我们这些凡夫俗子根本不成气候。”\n\n这时有个偷听的小家伙突然插嘴。孩子上下打量着神父的教袍说：“你看上去又胖又蠢还笨手笨脚。”\n\n亚历山大神父大笑着揉了揉这小鬼乌黑的乱发：“你可比我这三个门徒加起来都聪明！”等赶跑孩子后，他转向满脸通红的三人：“记住主的教诲——‘我是葡萄树，你们是枝子。常在我里面的，我也常在他里面，这人就多结果子；因为离了我，你们就不能做什么。’我的力量、智慧与口舌，不过是为祂结出硕果的枝子。所以我们感谢的，不该是任何尘世的君王或先知——唯独该感谢天上的万王之王。”"
 OMO.23.a: "三智者也要学习。"
 OMO.24.t: "病夫"
 OMO.24.d: "在奥莫隆城外一片积雪的空地上，聚集着虔诚的信众。亚历山大·缅神父身着罩在贴身长袍外的祭披，胸前悬挂的小型三横杠十字架在寒风中叮当作响，正带领众人进行今日的圣礼仪式。西伯利亚的凛冽寒风丝毫未能阻挡他们聆听上帝的话语。\n\n然而咯吱作响的雪地靴声打断了仪式。当神父念到连祷文中途时，他看见一名士兵垂着头向他走来，活像等待刽子手斧头的强盗。神父合上圣经问道：“我的孩子，你有什么心事？”\n\n待来人走近，神父看清了其毛皮帽上的徽章，不由得抿紧嘴唇——难怪教友们对此人避之不及。\n\n“普罗霍尔·沃尔科夫，”对方主动开口，“内务人民委员部的。”\n\n“你是来告解的吗，孩子？”见对方默然点头，神父轻声道：“那就让主，唯独让主聆听你的罪愆。”\n\n两人的对话内容已湮没在时光中。但令信众永生难忘的是，这个曾为布哈林效力的打手最终瘫倒在神父怀中啜泣成泪人，而神父始终用温暖的手掌轻抚着这个脆弱男人的后背。"
 OMO.24.a: "如是罪人得重生。"
 OMO.25.t: "毒蛇，还是救星？"
 OMO.25.d: "当神父意识到自己身处险境时，苏多普拉托夫出现了。当他缺乏兵力向俄罗斯传递讯息时，苏多普拉托夫出现了。当他既无力量也无意志去击败法西斯恶魔和无神论共产党时，苏多普拉托夫出现了。\n\n然而危机才刚刚开始。尽管苏多普拉托夫是个能给神父带来诸多助力的强权人物，但他也像毒蛇般危险。当我们借助他的人脉走向胜利时，他可能同时在积蓄力量伺机反扑。\n\n神父应当提防苏多普拉托夫——尽管他至今未显异心，始终助力神父的军队取胜。若没有苏多普拉托夫，神父还能赢得胜利吗？或许该将他的价值发挥到极致。既然他的人脉带来的全是益处，利用他又何妨？"
 OMO.25.a: "然而，我们必须警醒。"
 OMO.26.t: "正常游玩不应该看到该事件"
 OMO.26.d: "如果你看到这行字，那就说明有什么东西出错了"
 OMO.26.a: "这就是TNO"
 OMO.27.t: "正常游玩不应该看到该事件"
 OMO.27.d: "如果你看到这行字，那就说明有什么东西出错了"
 OMO.27.a: "这就是TNO"
 OMO.28.t: "神父死，天命终"
 OMO.28.d: "缅神父既有所料，亦无所料。苏多普拉托夫的诱惑实在太大——更多的士兵、更多的人力，似乎什么都要更多。然而，他没想到苏多普拉托夫会膨胀到如此地步。显然缅低估了对方，在上帝眼中，他已然失败。\n\n一切发生得太快，快得几乎不真实。苏多普拉托夫在前内务部特工的协助下，迅速扫清了忠于神父的势力，趁亚历山大·缅熟睡时逼近了他。苏多普拉托夫本不想杀害梅恩，更希望胁迫他成为傀儡。可惜事与愿违。\n\n苏多普拉托夫明白，若要让西伯利亚存活，缅必须活着。然而仅需三颗子弹，神授天命便戛然而止。无人知晓开枪的内务部特工是出于私愤还是一时冲动，但所有人都看见亚历山大·缅倒在血泊中，他们的权力美梦随之破灭。这位诱惑者终究未能兑现他曾向缅许诺的权势。\n\n随着神父殒命，天命时代就此终结。苏多普拉托夫带着亲信逃往西伯利亚腹地。这场血腥政变以失败告终，西伯利亚分崩离析。最终，在上帝眼中，所有人都是罪人。"
 OMO.28.a: "神父已逝，他的训言也随之消逝。"
 OMO.29.t: "北方觉醒"
 OMO.29.d: "在俄罗斯远东地区无休止的战乱中，很少有人会去关注北方那片寒冷的土地。除了一些废弃的矿镇、孤立的楚科奇村落和游牧民族外，那片区域被认为基本处于荒废状态。据说偶尔会有几个疯子试图在那里建立自己的“帝国”，但这片土地顽固地拒绝被驯服。\n\n这种无政府状态如今已经终结。\n\n一切始于那些圣歌。旅人们带来了关于整个村庄集体祈祷的故事，他们以主之名歌唱希望与和平。这似乎并不稀奇——即使在苏联时期，俄罗斯也始终是一片虔诚的土地。但当众多旅人开始讲述来自不同村庄的相同故事时，我们的领袖们开始察觉到异常。现在，我们终于明白原因了。\n\n一位使者从现已统一的北方来到我们中间。他只为传达一个信息——一个来自他主人“缅神父”的宣判。这位神父宣称整个北方都属于以神之名建立的统一联盟。他指责我们犯下重罪，玷污了神圣俄罗斯的土地，并发誓要率领他的信徒向我们发起进攻，带给我们两样东西：神圣的愤怒与神圣的救赎。\n\n我们曾希望这只是个骗局，但侦察兵已经报告北方边境有异动。北方大军确实正在逼近，他们的圣歌日益响亮。我们必须集结军队，正面迎战这支狂热分子组成的军队。\n\n然而，我们当中似乎有些人宁愿离开这里，投身这场疯狂的圣战并为之献出生命。"
 OMO.29.a: "我们必须为这一新威胁做好准备！"
 OMO.29.b: "愿上帝接纳这个迷途的灵魂。"
 OMO.30.t: "静待审判"
 OMO.30.d: "“神父，见到您真是太好了，”苏多普拉托夫在亚历山大·门步入小房间时说道。“请坐，有些……事情我想和您谈谈。”\n\n缅冷冷地在小椅子上坐下：“苏多普拉托夫，我想应该是我先有话要说。”他停顿片刻，观察着对方的反应。“帕维尔，你是在背叛我吗？”\n\n“什么？我绝不会，您怎么会这么想？”苏多普拉托夫佯装不知，完全没料到缅已经识破了他的阴谋。这局面本应完全相反！难道他算计错了？\n\n“看来你的内务人民委员部现在只听你的命令，而不是我的。”缅继续说道，“你还在筹集资金，我的将军们报告武器不断失踪。苏多普拉托夫，你的权力膨胀过头了。恰德克、克洛维，请进来。你的诱惑没能动摇我，你背叛的不是别人，正是上帝本人。”缅起身准备离开，将苏多普拉托夫留给他的命运。\n\n苏多普拉托夫扑倒在门脚边哀求：“等等！我愿意忏悔！我真的会悔改！求您了，我只是想给我们一个真正统一俄罗斯的机会。我发誓会保持忠诚，求您了。”\n\n缅低头看着脚边这个男人。他确信苏多普拉托夫还隐瞒着什么。这忏悔是真心实意，还是又一个谎言？但作为神职人员，缅不是应该宽恕吗？如果让苏多普拉托夫在牢房里腐烂，会不会显得虚伪？"
 OMO.30.a: "放他走吧，神父不会让一个悔过之人在狱中度过余生。"
 OMO.31.t: "神父已死！"
 OMO.31.d: "据报道，煽动者亚历山大·缅已失踪并可能死亡，他所谓的“神圣西伯利亚”也随之分裂为不同派系，这证明他所宣称的信仰除了布道之外几乎未能传播。由于神权政体缺乏中央指挥，现在正是我们将远东统一于我们旗帜之下的绝佳时机。我们必须立即行动，以免另一个蛊惑人心的领袖崛起并威胁西伯利亚的统一！"
 OMO.31.a: "拿起武器！"
 OMO.32.t: ""
 OMO.32.d: ""
 OMO.32.a: ""
 OMO.33.t: "至高者的天泉"
 OMO.33.d: "在主的第七日，我们的神父俯瞰着那些曾经沮丧如今却与祂神圣国度并肩而立的卑微者，他们期盼开启基督教虔诚的新纪元。然而祂的智慧轻易洞悉：并非所有人都如此虔诚地信奉教会与上帝——他们紧握的不过是团结的炽热表象，政治高于宗教，行动胜过信仰。但当无数笑脸与明媚天光降临人间时，我们的神父仍不可抗拒地感受到主的召唤，而非向不忠者屈膝。\n\n于是我们的神父走下宏伟教堂的阶梯，踏过无尽霜雪来到奥莫隆河畔的市集广场。农夫与士兵驻足观望，人群渐渐聚集，而我们的神父登上了广场中央的讲坛。在这里，伟大的神父终于得以近距离凝视信徒们美丽动人的眼眸，开始履行他预见的圣礼。他步入人群，俯身低语，将慈爱之手轻放在士兵肩头。人们得到抚慰，获得祝福，满心欢喜。这场弥撒不似某些温顺者用征服之火点燃的集会，而是洋溢着喜乐、安宁与和平。\n\n正是在此刻，神父注意到那些退缩的不信者正羞愧悔恨般低头凝视大地。他走向他们，展开双臂拥抱——因差异与分歧永远不该使家庭分崩离析。"
 OMO.33.a: "为安息日祝圣。"
 OMO.34.t: "勿惧携汝手之人"
 OMO.34.d: "在主的第七日，我们的神父俯瞰着那些曾经沮丧如今却与祂神圣国度并肩而立的卑微者，他们期盼开启基督教虔诚的新纪元。然而祂的智慧轻易洞悉：并非所有人都如此虔诚地信奉教会与上帝——他们紧握的不过是团结的炽热表象，政治高于宗教，行动胜过信仰。正是这份认知指引着神父的行动——在虔诚者遍布的土地上，并非人人皆怀同等虔敬，这要求为全人类福祉作出妥协。\n\n于是，最虔诚、最热忱的三一神信徒们——那位赐予我们生命的神圣三位一体——比众人更早聚集参与当日弥撒。有人对那些清晨劳作而无法或不愿参加圣会的男女投以轻蔑与侮辱；但神父的谆谆教诲令所有不敬之语归于沉寂。弥撒迅捷而庄严地进行，让以马内利的信徒得以在灵性中敬拜。奥莫伦的其余人目睹神父远早于往常结束简短的仪式，困惑与恐惧在聚集的农民中蔓延——他们忧心神父会对缺席者施以惩戒，如同往年对异见者的处置。\n\n但迫害并非答案，压迫与轻蔑的铁腕亦非解决之道。不，此刻正是为贫苦、卑微、饥饿者集结之时。那日，天父——亦即我主——的所有仆从携面包、热汤与善意而来，分发给奥莫伦街头所有饥肠辘辘之人。他们歌唱、赞美、欢宴，教堂圣诗与俄罗斯民谣的旋律令天父心间充满喜悦。"
 OMO.34.a: "康健之人用不着医生，有病的人才用得着。"
 OMO.35.t: "你当爱人如己"
 OMO.35.d: "在主的第七日，我们的神父俯瞰着那些曾经沮丧如今却与祂神圣国度并肩而立的卑微者，他们期盼开启基督教虔诚的新纪元。然而祂的智慧轻易洞悉：并非所有人都如此虔诚地信奉教会与上帝——他们紧握的不过是团结的炽热表象，政治高于宗教，行动胜过信仰。在对至高主的首要职责中，神父深知唯独应当顺服于祂；但难道侍奉世间那些虽无信仰却力行善举的芸芸众生，不亦是正途？\n\n此问考验着神父。当他步下居所，从奥莫隆河畔的大教堂拾级而下时，晨光未至，夜空仍悬。各式信徒本为晨祷而来，却未得所期。神父洞见，需为众生——非仅选民——缔造新集会。于是他召集三教九流，共襄盛举，于西伯利亚冻原上开创罕见之庆典。那日全能主的形象虽点缀其间，却绝非集会者终极所求。不，众人之责在于欢爱、畅饮、飨宴、作乐，以此残破之身享世间当得之欢。\n\n然神父未尝弃绝劳碌的羔羊。当众人以为当废弃安息日时，是神父彻夜扶持，引他们重归圣堂。在夜的静默中，他们行圣礼、擘饼感恩、与主和好。"
 OMO.35.a: "你使这国民增多，加添他们的喜乐。"
 OMO.36.t: "耶和华是我的力量，是我的盾牌"
 OMO.36.d: "奥莫隆河畔不再是被古代暴君遗弃者的卑微之城；不，在万能上帝的慈爱指引下，这里已成为更崇高的存在。这是虔信者的国度，是劳动者、战士、父亲与儿子们的国度，更是以马内利亲临的国度。这一切都在我们上帝的器皿——神父的庇佑之下。然而神父的功业不止于河岸，这座上帝堡垒已横跨整个俄罗斯大地，让万民得闻喜讯！\n\n但掠夺者、暴君与异教徒并未发出荣耀与救赎的欢呼，反而燃烧着仇恨厉声叫嚣。他们整备军械弹药，妄图决定上帝选民之地的命运——这片从苔原深处崛起、彰显主之荣光的土地。这里永不再是愤怒者与迫害者制造的毁灭之地，因这将成为人间天国。在神父的旗帜下，我们将引领所有以俄罗斯为名者走向救赎。主的和平、仁爱与安宁本质从未因我们的作为而湮灭；然世间之人不解圣经训导，故需以更古老的《旧约》方式施行公义，让战火燎原彰显神的审判与威严，使我们在满目疮痍的世界战胜地狱的征服。\n\n然而燃烧的田野未曾在神父心中映出权能与荣耀。祂凝视之时，深知人类不该如此相待，不该毫无悔意地彼此撕裂。终有一日，这世界将告别最后一场战争，在主爱的感召下相拥。神父立誓：待到那日，他必得安息。"
 OMO.36.a: "使人和睦的人有福了, 因为他们必称为神的儿子"
 OMO.37.t: "恶塑肉身"
 OMO.37.d: "于是，耶和华藉以赛亚之口宣告：“祸哉！那些设立不义之律例的，那些记录压迫文书的，他们为要屈枉穷乏人的公义，夺去我民中困苦人的权利，使寡妇成了他们的掳物，使孤儿作了他们的掠物！”\n\n在奥摩隆圣山闪耀的峰顶，唯有低语萦绕——我们的圣父在此跪拜，在此祈祷，在此恸哭。当神学家与神父的训海划过泪眼朦胧的圣父心间，路西法地狱的恶爪已屡次攫住这片饱经蹂躏的大地。正如经卷所载，敌基督的阴影屡次以罪恶之影侵扰世间：那位坐视罗马燃烧的疯皇，向亲子泄愤的醉醺醺沙皇，以子民鲜血沐浴的女王，乃至高踞鹰帝宝座的“欧罗巴之主”。然而西方那位重生尼布甲尼撒，他为寻找早已死去的君王而癫狂暴怒，所过之处唯余焦土——其堕落之深、邪恶之甚、污秽之极，可谓空前绝后！若让此獠统治俄罗斯大地，他必在疯狂王座上焚毁整个世界！经年累月的祈祷后，我们的圣父终于仰起头，凝视教堂中受难的基督圣容，领悟到一个沉重真相：这就是那行毁坏可憎之物。这已非敌基督的化身，而是敌基督本体！\n\n于是我们的圣父紧攥圣袍，向着在亚巴顿邪眼下遭屠戮的万千灵魂发出痛彻心扉的呐喊。就在那日，他向所有信众发出征战号召——非为奥摩隆的荣耀，乃是要作世人的盾牌，抵挡阿撒兹勒的邪毒！"
 OMO.37.a: "为了上帝的至高荣耀！"
 OMO.38.t: "逆风而行"
 OMO.38.d: "历经布尔什维克的压迫、法西斯主义的暴虐、军阀的铁腕统治，俄罗斯在连年战火后终获真正的和平。那些曾被虚假先知与阴险意识形态引领的人民，那些灵魂始终饥渴却从未得到满足的人民，如今在上帝温柔的指引下终获安宁。\n\n然而，为何神父的心仍如此沉重？\n\n亚历山大·缅，这位迷途之人与贫民的牧者，亦如凡人般会犯错、会脆弱——哪有不因羊群壮大而忧惧的牧人？从数十人，到数百人，再到成千上万。每个人都将他视作指引方向的星辰，视作希特勒（愿其名受三重诅咒）将地狱之门引向俄罗斯与信徒之前，就已湮灭的希望象征。\n\n德国。这正是他恐惧的根源。从西方吹来的风比西伯利亚最严酷的寒冬更令人战栗，因为西方矗立着莫斯科维恩，那片被遗忘的俄罗斯土地，此刻正颤栗在鹰徽旗帜的统治下。\n\n这一切不会终结于此，亚历山大深知。反对基督的阴影绝不会容忍其永恒之敌近在咫尺，而任何正直之人都无法移开视线，任由自己的人民在那些剥夺人类天堂席位的蛇之后裔手中受苦。\n\n十字架下，谦卑牧者的祈祷愈发恳切，他竭尽全力攥着念珠的手指已然发白。缅无法将目光从仍受欧洲主子奴役的俄罗斯同胞身上移开。于是他祈祷，为已逝的灵魂，为将逝的灵魂，也为自己能以圣父、圣子、圣灵之名拯救的灵魂。"
