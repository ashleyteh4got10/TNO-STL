l_simp_chinese:
 LOADING_TIP_0:0 "§B仇恨终将消亡，为其自身的愚昧与庸碌所窒息；而伟业，则万古流芳。\n- 莱昂·德格勒尔，1960年"
 LOADING_TIP_1:0 "§B如今丈量街道的，不再是公尺，而是尸骸。斯大林格勒已不成其为城。白日，是遮天蔽日的滚滚浓烟；入夜，是映照万物的无边火海。\n- 佚名，1942年"
 LOADING_TIP_2:0 "§B你的名字无人知晓，你的功绩永垂不朽。\n- 无名烈士墓"
 LOADING_TIP_3:0 "§B东线乃纸牌危楼，一处之溃，则全线崩塌。\n- 海因茨·古德里安，1944年"
 LOADING_TIP_4:0 "§B此役非比寻常，乃两种世界观之决死交锋；此战为灭绝之战，旨在尽除布尔什维克之政委与所谓共产主义之精英。\n- 阿道夫·希特勒，1941年"
 LOADING_TIP_5:0 "§B“只有无畏的人才配成为红军中的懦夫。”\n- 约瑟夫·斯大林，1941年"
 LOADING_TIP_6:0 "§B我们要杀人。要是你一天之内没杀掉至少一个德国人，那你这一天就白活了......不计天数；不计里程。只计算你杀的德国人的数量。\n- 伊利亚·爱伦堡，1943年"
 LOADING_TIP_7:0 "§B行动胜于言辞。未来，胜利女神只会将她的桂冠授予那些准备好大胆行动之人。\n- 海因茨·古德里安，1937年"
 LOADING_TIP_8:0 "§B俄国巨人......我们一直低估了它......无论何时当一打师被消灭，俄国人会换上另一打。\n- 弗朗兹·哈尔德，1941年"
 LOADING_TIP_9:0 "§B只在事态顺利时服从是不对的；当情况恶化、时局艰难时，要成为一名优秀且服从的士兵要困难得多。在这种时刻，服从与信念是一种美德。\n- 弗兰茨·哈尔德，1946年"
 LOADING_TIP_10:0 "§B然而，我最坚定的信心却基于这样一个事实：在德国元首的位置上，站着这样一位人物，以其整个成长历程、个人愿望以及奋斗目标而言，势必为命运所选中，引领我们的民族走向更加光明的未来。\n- 阿尔弗雷德·约德尔，1943年"
 LOADING_TIP_11:0 "§B伟人的诅咒在于不得不踏着尸骸前行。\n- 海因里希·希姆莱，1941年"
 LOADING_TIP_12:0 "§B事实是，在同等条件下，大规模战役和整个战争的胜利属于那些拥有强烈求胜意志、明确目标、道德高尚以及为其所投身旗帜奉献一切的军队。\n- 格奥尔基·朱可夫，1950年"
 LOADING_TIP_13:0 "§B如果我军遭遇雷区，我军步兵将视其为无物般继续进攻。\n- 格奥尔基·朱可夫，1945年"
 LOADING_TIP_14:0 "§B谁能举起步枪，谁就该拥有一支。\n- 克利缅特·伏罗希洛夫，1945年"
 LOADING_TIP_15:0 "§B我的手臂直到肘部都浸在血中。那是躺在我灵魂中最可怕的东西。\n- 尼基塔·赫鲁晓夫，1955年"
 LOADING_TIP_16:0 "§B我们不想要任何外国的一寸土地；但我们绝不会让出自己的一寸领土给任何人。\n- 约瑟夫·斯大林，1938年"
 LOADING_TIP_17:0 "§B必须让每个德国士兵都感受到，他们是活在俄国人的枪口之下。\n- 瓦西里·崔可夫，1955年"
 LOADING_TIP_18:0 "§B我本不相信人间竟能开启如此地狱。战士们牺牲了，却无人后退半步。\n- 瓦西里·崔可夫，1955年"
 LOADING_TIP_19:0 "§B我们翻阅了一系列前线的报道。在一篇社论中我看到这样一句话：“遭受重创的敌人继续着其怯懦的前进。”\n-瓦西里·格罗斯曼，1941年"
 LOADING_TIP_20:0 "§B如果有一天我们不得不离开，如果某日我们被迫退出历史舞台，我们将把门摔得震天动地，让宇宙为之震颤，让全人类惊骇失语。\n-约瑟夫·戈培尔，1944年"
 LOADING_TIP_22:0 "§B斯拉夫人必须为我们工作。凡是我们不需要的，任其灭绝。因此，德国人无需为他们提供疫苗接种和医疗服务。\n-马丁·鲍曼，1944年"
 LOADING_TIP_23:0 "§B我军必须全力以赴，不惜一切手段向敌人发起猛攻；凡是侵犯我国境之敌，必将其彻底歼灭。\n-谢苗·铁木辛哥，1941年"
 LOADING_TIP_24:0 "§B如果人民知道他们的手上沾满了无辜者的鲜血，迎接他们的将不会是掌声，而是石块。  \n-格奥尔基·朱可夫，1952年"
 LOADING_TIP_25:0 "§B此刻于我，恐惧、律法、怜悯皆已湮灭；唯有狂怒与复仇之欲令我窒息。\n-亚历山大·奥斯特洛夫斯基，1878年"
 LOADING_TIP_26:0 "§B复仇于我最为可憎，而由国家组织的复仇尤甚。\n-尼古拉·别尔嘉耶夫，1949年"
 LOADING_TIP_27:0 "§B最重要的是，俄罗斯必须摆脱对德国的仇恨，摆脱那些奴役心灵的恶意与复仇情绪，摒弃那种对敌人在精神文化领域价值的否定——这不过是另一种形式的奴役。\n-尼古拉·别尔嘉耶夫，1917年"
 LOADING_TIP_28:0 "§B在严肃的斗争中，最残酷的莫过于在不合时宜时表现宽宏大量。\n-列夫·托洛茨基，1930年"
 LOADING_TIP_21:0 "§B\n姓名，日期"