 RUS_commie_economic_of_ussr_desc: "不再是临时的缝补，而是深思熟虑的蓝图。国家经济的航向，将由中央规划的灯塔指引。从资源分配到生产指标，从基础设施建设到区域平衡，每一个环节都将被纳入宏伟的计算。纸面上的数字或许冰冷，但它们承载着亿万人民对温饱与繁荣的渴望。效率与远见，将是这场无声战役的口号。"
 RUS_commie_unity_economy_desc: "分裂的肌体无法凝聚力量。重建伟大的俄罗斯，需要每一个齿轮都朝向同一个目标。工厂的轰鸣、田野的耕耘、矿井的开掘，都将汇入国家复兴的洪流。爱国主义不仅仅是口号，它将转化为生产线上的汗水，转化为超额完成的指标。万众一心，为了一个共同的经济奇迹。"
 RUS_commie_new_city_program_desc: "推倒废墟，不是为了简单复制过去，而是为了创造更好的未来。新城市计划将运用现代城市规划理念：合理的区域划分，宽敞的绿色空间，便捷的公共交通，完善的配套设施。我们要建设的不仅是钢筋水泥的丛林，更是科学、健康、宜居的人类社区。让城市成为进步的象征，而非问题的渊薮。"
 RUS_commie_industrial_symphony_desc: "钢铁的撞击，熔炉的怒吼，高炉的呼吸——这是国家力量最雄浑的乐章。没有强大的重工业，就没有坚实的国防，就没有现代化的基础。我们将集中力量，修复和扩建钢铁厂、机械厂、化工厂，让工业的心脏重新强劲搏动。这首“交响乐”或许嘈杂刺耳，但它奏响的是民族复兴的最强音。"
 RUS_commie_buttons_and_levers_desc: "在一个庞大而复杂的经济体中，方向盘必须牢牢掌握。中央计划部门将如同熟练的工程师，通过调整“按钮”和“拉杆”——即生产配额、价格管制、资源调拨、信贷政策——来引导经济航船的走向。目标是精确、高效、协调一致，避免无序竞争和资源浪费，确保国家整体利益的最大化。"
 RUS_commie_roads_roads_roads_desc: "铁路是骨架，但一个健康的身体还需要血脉和神经。全国基础设施计划将系统性地修复和建设公路网、桥梁、港口、机场、电力系统和通讯网络。打通交通瓶颈，保障能源供应，实现信息畅通。只有拥有了现代化的基础设施网络，整个国家经济才能高效运转，释放出全部潜力。"
 RUS_commie_steam_and_steel_desc: "没有发达的铁路网，广袤的俄罗斯就只是一盘散沙。修复被战争破坏的铁路线，铺设连接新区的新干线，升级老旧的机车车辆——这是打通国家经济动脉的重中之重。让钢铁巨龙重新奔驰在俄罗斯大地上，将煤炭、矿石、粮食和人民运送到需要它们的地方。蒸汽的嘶鸣，是国家重新连接的号角。"
 RUS_commie_city_reform_project_desc: "光鲜的外表下可能隐藏着深层的问题。城市改革计划不仅关注建筑和道路，更要触及城市治理的根本：改革住房分配制度，解决“鸽子笼”问题；优化城市管理机构，提高服务效率；整治环境污染，改善居住品质；打击城市犯罪，提升安全感。让城市不仅看起来新，更要运转得好，将破败社区的援助进行到底。"
 RUS_commie_new_russia_city_desc: "有时，在一片空白的土地上描绘未来，比在旧城改造的桎梏中腾挪更加高效。我们将选择具有战略意义或资源优势的地点，规划建设全新的现代化城市。从零开始，按照最先进的理念设计布局、配置资源，吸引人口和产业集聚。这些“新俄罗斯城”将成为国家意志和发展方向的实体象征。"
 RUS_shining_new_megapolis_on_the_northern_desc: "让北方不再仅仅意味着冰雪与边陲。我们将倾注资源，将一座关键的北方城市打造成一座辐射整个北极地区的、现代化的、充满活力的区域中心。发达的港口，先进的科研机构，繁荣的文化生活——让它成为北境的明珠，照亮俄罗斯的未来。"
 RUS_commie_new_laws_desc: "混乱无序的市场如同脱缰的野马。是时候给它套上缰绳，划定跑道了。《经济新法律》将为商业活动、财产关系、市场准入确立清晰的规则。告别军阀时代的任意掠夺和朝令夕改，建立稳定、可预期的经济秩序。法律的框架内，财富的溪流才能汇成江海。"
 RUS_commie_solvency_desc: "宏伟的重建蓝图需要坚实的财政基础。我们不能一边建设摩天大楼，一边却挖空国库的地基。严格的预算纪律，审慎的借贷政策，以及有效的税收体系，是维持国家信誉与经济健康的生命线。量入为出，精打细算，确保我们的雄心壮志不会变成无法偿还的债务泡沫。"
 RUS_commie_duty_to_people_desc: "经济发展的最终目的，不是冰冷的数字增长，而是实实在在的人民福祉。国家的发展成果必须惠及全体人民。提供稳定的就业，保障合理的收入，完善社会福利体系，改善居住、医疗和教育条件——这是政府对人民不可推卸的责任。让每一个公民都能分享国家进步的红利。"
 RUS_commie_transparent_government_desc: "暗箱操作滋生腐败，缺乏监督导致低效。在条件允许的范围内，我们将逐步提高政府经济决策的透明度。公开部分预算信息，建立举报和问责机制，加强对公共项目资金使用的审计。虽然完全的“玻璃房”不切实际，但至少要让阳光能够照进一些关键的角落，以赢得人民的信任。"
 RUS_commie_base_interest_rates_desc: "当经济需要刺激，或者通胀压力减缓时，适度降低基准利率是央行的常用工具。这将鼓励企业和个人借贷投资与消费，为经济注入更多流动性。当然，这把双刃剑需要审慎使用，密切关注其对通胀和资本流动的影响。这是一个需要精准把握时机的宏观调控手段。"
 RUS_commie_government_credit_law_desc: "国家信誉是无形的财富。建立健全的《政府信用法》，明确政府发行债券、提供担保的规则与程序，规范政府债务管理，将有助于稳定金融市场，降低融资成本，增强国内外投资者对国家经济的信心。一个负责任、守信用的政府，才能赢得长远的未来。"
 RUS_commie_people_supervision_desc: "权力需要监督，计划需要检验。我们将探索建立某种形式的民主监督机制（其具体形式将依据国家整体政治框架而定），允许人民代表或特定社会团体对重大经济决策、公共项目开支进行审议和质询。这既是为了防止决策失误和腐败，也是为了增强政策的合法性与执行力。"
 RUS_commie_unfreeze_business_desc: "冰封的河流终将解冻。在国家掌握经济命脉的前提下，适当允许商业的涓涓细流重新活跃起来。关闭已久的店铺将掸去灰尘，尘封的货摊将重现生机。有限的私营经济，如同春天的嫩芽，将在计划的土壤中谨慎地探出头来，为市场带来活力，也为人民带来便利。"
 RUS_commie_government_takes_hand_to_help_desc: "市场并非万能，有时也需要国家这只有力的手来扶持一把。对于那些具有战略意义却暂时陷入困境的行业，对于那些关乎国计民生却缺乏市场动力的项目，政府将提供直接的援助：补贴、投资、技术支持，甚至直接参与管理。该出手时就出手，确保关键领域不掉队，重要环节不卡壳。"
 RUS_commie_spring_of_micro_company_desc: "大树底下也需小草生长。在国家主导经济的同时，要为小规模的私营企业、合作社和个体工商业者创造生存和发展的空间。简化注册审批程序，提供税收优惠，保障公平竞争环境。让那些充满活力的“小微经济细胞”也能茁壮成长，丰富市场，吸纳就业，为经济增添韧性与色彩。"
 RUS_commie_government_credit_to_businessman_desc: "资金是经济的血液，不能让它淤积在少数地方。政府将通过国家银行或专项基金，向重点扶持的行业、有发展潜力的小微企业，甚至有需要的个人（如购房、创业）提供低息贷款。降低融资门槛，让更多有能力、有想法的主体能够获得启动和发展的资金支持。"
 RUS_commie_fairness_business_law_desc: "国内市场不能成为弱肉强食的丛林。新的《公平商业法》将致力于维护市场秩序：反对垄断行为，禁止不正当竞争，打击商业欺诈，保护消费者权益。为所有市场参与者（无论是国有的、集体的还是私营的）创造一个相对公平、透明、可预期的营商环境。"
 RUS_commie_trading_and_trading_desc: "一个国家无法在孤岛上繁荣。无论是将西伯利亚的木材运往欧洲，还是用乌拉尔的矿石换取急需的机器，贸易都是经济循环的血液。国内市场需要被打通，港口需要重新繁忙，国际商路需要再次连接。让货物流动起来，让卢布滚动起来，贸易之轮一旦启动，就绝不能停歇。"
 RUS_commie_touch_the_world_desc: "封闭的大门正在缓缓开启。经历了数十年的隔绝与对抗，新俄罗斯需要重新找到自己在世界舞台上的位置。派出外交使团，恢复贸易联系，参与国际组织（如果可能的话），与其他国家建立正常的、基于互利的关系。我们需要了解世界，也需要让世界了解我们。孤立主义没有未来。"
 RUS_commie_fairness_trade_desc: "在国际市场上，我们既要争取机会，也要维护尊严。新的《公平贸易法》将旨在保护国内产业免受不公平竞争的冲击，同时确保我们的出口产品能够获得合理的价格和待遇。反对倾销，反对贸易壁垒，争取平等的贸易地位。我们的商品要走出去，但绝不能以牺牲国家利益为代价。"

