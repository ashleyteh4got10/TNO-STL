 RUS_commie_the_great_social_desc: "“俄罗斯啊，你往何处去？回答我！……她不回答。\n马车夫铃铛叮当作响；\n\n空气被撕裂，呼啸着化为风；\n\n地面上的一切都已飞驰而过，而其他民族和国家，都惊恐地看着，为她让路……”\n\n诗人曾如此发问，带着对祖国命运的迷茫与期盼。如今，我们要用行动来回答：俄罗斯，将奔向一个“伟大社会”！在这里，不仅仅是国家强大，更重要的是人民幸福；不仅仅是物质丰裕，更重要的是精神充实；不仅仅是没有战争，更重要的是拥有公正、自由和每个个体都能充分发展的机会。这，才是我们为之奋斗的终极目标，那值得所有牺牲的璀璨远景。"
 RUS_commie_social_revolution_desc: "战争的喧嚣退去，社会的深层变革方兴未艾。我们要进行的，是一场触及灵魂的苏维埃革命：打破旧时代的藩篱，确保妇女能顶半边天，让工农子弟能走进大学课堂，让病者有其医，老者有其养。这不仅是制度的革新，更是对“人人平等”理想的重新践行，塑造真正属于劳动人民的社会。"
 RUS_commie_modern_social_desc: "告别土路与油灯，迎接电气化与柏油路的时代。现代化不仅是工厂的轰鸣，更是收音机里的歌声、夜晚窗户透出的灯光、连接城乡的便捷交通。我们要将俄罗斯从过去的阴影中彻底拉出，让她以崭新的、充满活力的面貌，重新屹立于世界民族之林。这是对人民辛劳的回报，也是国家力量的象征。"
 RUS_commie_community_actions_desc: "国家机器的齿轮虽大，却难以触及生活的每一个细微角落。成立社区行动委员会，旨在将权力下沉，将决策贴近人民。从修复邻里道路到组织互助托儿所，从解决供暖难题到丰富文化生活，让社区成为充满活力的有机体。人民最了解自己的需求，就让他们自己动手，建设家园。"
 RUS_commie_crime_act_desc: "秩序的重建不能止于口号。一部全面的《反犯罪法案》将为执法部门提供更有力的武器，严厉打击盗窃、抢劫、有组织犯罪及其他破坏社会安宁的行为。增加警力投入，改革司法程序，确保犯罪分子无处遁形，受到应有的惩罚。安宁的生活环境，是公民最基本的权利，国家必须保障。"
 RUS_commie_community_no_hungry_desc: "饥饿是旧时代的梦魇，绝不能在新俄罗斯重现。国家将建立强大的粮食储备体系，完善从田间到餐桌的分配网络，确保价格稳定，保障供应充足。让每一个公民，无论身处城市还是乡村，都能免于饥饿的恐惧。吃饱饭，是生存的底线，也是一切发展的基础。"
 RUS_commie_healthcare_for_everyone_desc: "健康是人民最宝贵的财富，国家有责任守护。我们将建立覆盖全民的医疗保障体系：普及基础医疗服务，建设现代化的医院网络，培养充足的医护人员，确保药品供应。无论贫富贵贱，每一个公民在病痛面前，都能得到及时、有效的救治。健康的国民，才能建设强大的国家。"
 RUS_commie_education_state_desc: "万丈高楼平地起，强大的国家始于强大的基础教育。我们将投入大量资源，改善乡村和边远地区学校的办学条件，提高教师待遇与水平，更新教学内容与方法。确保每一个孩子，无论出身，都能获得公平而优质的启蒙教育。只有根基牢固，未来的大厦才能巍然屹立。"
 RUS_commie_high_education_act_desc: "人才是国家最根本的资源。新的教育法案将确保每一个适龄儿童都能接受基础义务教育，扫除文盲，普及知识。同时，大力发展高等教育和职业技术教育，为国家培养各行各业所需的专业人才。知识改变命运，教育点亮未来。投资教育，就是投资俄罗斯的明天。"
 RUS_commie_city_runs_well_desc: "喧嚣落幕，秩序井然。经过不懈努力，我们的主要城市已恢复正常运转。供水供电稳定，交通畅通有序，治安状况良好，市政服务高效。市民们可以安心工作，放心生活。城市不再是问题的集合，而是稳定与进步的象征。“一切正常”，这是对重建成果最朴素也最有力的肯定。"
 RUS_commie_urbanization_accelerate_desc: "新的工厂需要工人，新的建设需要人力。为了加速工业化进程，国家将鼓励并引导人口向城市集聚。提供更好的就业机会、更完善的基础设施、更丰富的文化生活，让城市成为吸引人才、创造财富的强大磁极。城市化的浪潮，将推动俄罗斯驶向现代化的快车道。"
 RUS_commie_city_nights_desc: "当夜幕降临，城市不应陷入沉寂与黑暗。明亮的路灯将照亮每一条街道，安全的公园将为居民提供休憩的场所，经过规划的灯光将勾勒出建筑的轮廓。让夜晚的城市同样充满活力与魅力，让晚归的工人感到安心，让散步的家庭享受惬意。城市的夜景，是衡量生活品质的一面镜子。"
 RUS_commie_engine_stabled_desc: "高速运转之后，更需要稳健的操控。经济发展的引擎已经进入稳定运行状态。增长不再是狂飙突进，而是持续、健康、有节奏的前进。我们成功驾驭了发展的惯性，避免了过热与失控的风险。一个强大而稳定的经济基础，已经牢固奠定。"
 RUS_commie_engine_boosted_desc: "巨大的飞轮已经转动起来，并且越来越快。工厂的马力全开，矿山的产量激增，铁路上的货运繁忙不息。国家经济的引擎已被点燃，正以前所未有的力量，驱动着俄罗斯加速冲向繁荣。增长的曲线不再是平缓的爬升，而是陡峭的上扬！"
 RUS_commie_nights_of_russia_desc: "§Y像鸟儿一样接连的歌唱，\n歌声在苏维埃国家上空飞扬。\n\n城市和田野的欢唱，\n\n生活变得更美好，\n生活变得更快乐！§!"
 RUS_commie_future_is_come_desc: "曾经遥不可及的图景，如今已在我们脚下展开。道路连通，工厂运转，城市复苏，秩序重建。我们用汗水浇灌了废墟，希望的种子已然发芽。虽然挑战犹存，但可以自豪地说：那个破碎、绝望的时代已经过去。俄罗斯的未来，并非缥缈的幻梦，它就在眼前，触手可及。"
 RUS_commie_russia_city_desc: "告别断壁残垣与泥泞街道，我们的城市需要新生。系统性的规划将取代临时的修补：现代化的供水供暖系统，高效的市内公共交通网络，坚固舒适的新型住宅区，以及必不可少的绿地公园。让城市不仅是生产的中心，更成为宜居、安全、充满活力的家园。莫斯科、列宁格勒以及所有城市，都将焕发光彩。"
 RUS_commie_sports_night_desc: "城市的夜晚不应只属于黑暗与危险。我们将点亮球场，组织“午夜运动会”，为精力无处安放的年轻人提供健康的出口。篮球、足球、街舞…用汗水代替酒精，用团队精神驱散街头帮派的阴影。让青春在竞技中闪光，而不是在歧途中消耗。这不仅是体育，更是对未来的投资。"
 RUS_commie_what_keeps_us_together_desc: "历经劫难，四分五裂，我们靠什么重新凝聚成一个整体？是共同的苦难记忆，是对侵略者的同仇敌忾，是对未来的共同憧憬，还是血液里流淌的千年文化？国家将通过教育、宣传与文化建设，重新发掘和塑造“俄罗斯人”的内涵，熔铸超越地域与派别的共同体意识。团结，始于认同。"
 RUS_commie_fight_to_poverty_desc: "贫困，是战争留下的最顽固的毒瘤，是社会肌体上的溃烂伤口。我们不能容忍在统一的国土上，仍有同胞食不果腹、衣不蔽体。国家将动用一切资源，向贫困宣战：提供基本生活保障，创造就业机会，改善教育医疗条件，确保每一个俄罗斯人都能享有尊严和希望。这场战争，我们必须胜利。"
 RUS_commie_min_wage_desc: "劳动者的汗水理应换来有尊严的生活。国家将制定并强制执行最低工资标准，确保每一位全职工作者都能获得满足基本需求的报酬。告别赤贫与剥削，让辛勤工作成为通往体面生活的可靠阶梯。这是对劳动价值的肯定，也是社会公平的基石。"
 RUS_commie_work_hours_desc: "机器需要保养，人更需要休息。无休止的加班只会榨干劳动者的精力，最终损害效率与健康。国家将严格规定法定工作时长，保障工人的休息权利。八小时工作，八小时休息，八小时留给自己和家人。健康的劳动者才能建设健康的国家。"
 RUS_commie_social_revolution_act_desc: "新的时代呼唤新的社会契约。《革命新社会法》将系统性地革除旧时代的糟粕，确立进步的社会规范：保障婚姻自由，反对家庭暴力，加强未成年人保护，鼓励社会互助。它将以法律的形式，将我们对公正、平等、文明社会的追求固定下来，为新俄罗斯的社会生活奠定基础。"
 RUS_commie_tech_reborn_desc: "落后就要挨打，科技是国家强盛的引擎。我们必须重建被战争摧毁的科研体系，大力投资基础科学与应用技术研究，培养新一代的科学家和工程师。从精密仪器到重型机械，从生物工程到信息技术，俄罗斯必须迎头赶上，在未来的科技竞争中占据一席之地。创新，将是复兴的关键动力。"
 RUS_commie_colorful_culture_desc: "精神的食粮同样不可或缺。在物质重建的同时，必须复兴俄罗斯丰富多彩的文化生活。剧院将重新上演经典与新作，画廊将展示才华横溢的作品，图书馆将充盈思想的宝藏，电影院将讲述我们自己的故事。鼓励创作，支持交流，让文化艺术的繁荣，成为新时代俄罗斯一道亮丽的风景线。"
 RUS_commie_green_social_desc: "在重建家园的同时，我们不能忘记保护滋养我们的自然母亲。滥砍滥伐的时代必须结束，污染的河流需要治理，城市的空气应当清新。我们将大力推进植树造林，建立更严格的工业排放标准，保护珍稀的自然环境。一个绿色的俄罗斯，才是真正可持续发展的家园。"
 RUS_commie_equal_social_desc: "平等，是镌刻在我们旗帜上的神圣原则。无论是男性还是女性，无论是俄罗斯族还是其他兄弟民族，无论是工人还是农民，都应享有平等的权利、尊严和机会。我们将继续与一切形式的歧视和特权作斗争，努力建设一个真正体现公平正义、让所有成员都能发光发热的社会。"
 RUS_commie_open_social_desc: "封闭隔绝只会导致停滞与落后。在国家安全得到保障的前提下，俄罗斯将以更加自信和开放的姿态拥抱世界。鼓励对外贸易与合作，促进文化与学术交流，欢迎友好人士的来访。让新鲜的空气吹进来，让世界了解真实的俄罗斯，也让俄罗斯更好地融入全球发展的潮流。"
 RUS_commie_great_social_law_desc: "终于大功告成了。我们克服万难，终于实现了几个世纪以来梦想的伟大社会。新体制将塑造起未来几十年俄罗斯社会的风貌。我们现在身处和平时代，人民幸福安康，对体制更是信心满满，在一系列政策的推动下，即使是曾经最贫苦的社区，也因为我们伟大的社会改革计划而变得不再贫困。"

