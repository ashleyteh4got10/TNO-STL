 RUS_difficulty_hard_nightmare_desc: "§q没有人会拯救俄罗斯，再也不会有人会拯救俄罗斯。§!\n\n§x结束了，一切都结束了。\n\n§q俄罗斯大地上曾经孕育出了希望，现在他们都随着铁蹄消散了。\n\n团结协定将摧毁一切胆敢冒犯其权威的可怜人。\n\n[GER.GetFlag]大日耳曼国的胜利无可置疑，我们只能苟且偷生。§!\n\n\n§V该模式会极大增强德国的实力，请不要在没有把握的情况下尝试！§!"

 PRC_war_lessons_tt: "§Y流亡红军§!:\n   步兵单位攻击 +10%。\n"
 PRC_restore_rule: "苏联统治，再度确立"
 PRC_restore_rule_desc: "我们作为中西伯利亚地区唯一的苏联残余势力，必须要成功统一中西伯利亚。而我们的人民也迫切希望从资本主义的的黑暗剥削中解放出来，拥抱我们的解放。\n我们是这黑暗地区中唯一的光明，我们有着解放全苏联的使命，而我们现在最重要的事，就是成为中西伯利亚地区的胜利者。"
 PRC_economic_authories_desc: "我们的经济管理部门混乱不堪，而苏联领土即将回归合法政权的统治，解决恢复经济效率已是燃眉之急。我们将为经济管理部门制定一套明确、全面、统一的规则，以此立即固定其职责，并简化招募流程。来自收复地区的经济部门代表会接受政府人员的评估，被证明合格后将接受二次培训并融入我们的经济体系中，他们对自身地区的了解对巩固统治有极大帮助。"
 PRC_economic_authories: "经济权威，已然树立"
 PRC_emergency_economic_plan: "经济方案，正在施行"
 PRC_emergency_economic_plan_desc: "三十年前，布哈林曾在此地实行过西伯利亚计划，试图将这荒无人烟的西伯利亚地区打造成一片乐土。然而，事实是他没有成功。中西伯利亚依然是西伯利亚，此地的居民没有得到更好的生活，反而因为西伯利亚的遗产而饱受战乱之苦。虽然这么说不是很厚道，但我们也确实需要这些西伯利亚计划的遗产。相较于其他西伯利亚军阀，我们的基础无疑是最差的，西伯利亚计划几乎没有建设这里，而我们又维持着数量庞大的军队，因此我们迫切需要一个经济方案缓解我们的困境。"
 PRC_looting_loot_loot: "劫掠之后，建设依旧"
 PRC_looting_loot_loot_desc: "劫掠他人虽然令人可耻，但却是必要之举。我们正在筹备着向周围所有国家进行劫掠，现在的我们，呃...已经是强弩之末了。我们的经济基础实在是太差了，如果不劫掠他人，我们既没有钱给士兵发工资，也没有设备去建设。但我们需要这些资源。我们需要这些资源来建设我们的祖国，这就是我们的日常，c'est la vie(这就是生活)。"
 PRC_new_ruble: "苏联卢布，重新发行"
 PRC_new_ruble_desc: "苏联卢布这连年的战乱中失去了价值，甚至失去了意义。许多叛军、土匪和军阀占据了苏联领土，并发行他们自己的伪货币，这进一步破坏了本就不稳定的苏联经济。该终结这一切了，我们必须恢复苏联的金融体系。\n\n首先，被解放领土上的所有银行和金融机构都将重新纳入苏联的银行体系，并统一标准。其次，不再发行伪币，取而代之的是重新发行的苏联卢布，这是苏联境内唯一合法货币，国家银行将组织人们把储蓄迅速兑换成新货币。为了苏联经济的生存和发展，我们需要恢复与外国的贸易往来，这意味着苏联卢布必须用国际公认的硬通货作为后盾：黄金和白银。幸运的是，北西伯利亚丰富的稀有资源储备，加上居民已经积累的黄金储备，会让我们获得必要数量的贵金属，以发行所需数量的新纸币。"
 PRC_anti_spy: "肃反运动，必须开始"
 PRC_anti_spy_desc: "稳定对于我们是必要的。法西斯、纳粹和资本主义的余孽依然如同杂草一般，潜藏在国土之中。我们必须要拯救人民，保护他们免受法西斯蒂和犯罪渣滓的压迫。而我们为此要学习伊尔库茨克的经验，重组契卡，密切地关注人民，防止人民遭到别有用心之徒的利用与腐蚀。即使在今天，国内也藏匿着叛徒与异见分子，企图伤害人民，我们绝不能让他们的阴谋得逞，苏维埃革命不能就此结束。"
 PRC_stop_government_split: "政府分歧，得到解决"
 PRC_stop_government_split_desc: "我国国内有两大派系：文官与军官。文官主张建立一个民主政府，让苏联归于人民统治。而军官则更加看重军队在其中的地位，试图建立一个以军队为主导的政府。\n\n大敌当前，我们不能再让这种无谓的分裂持续下去了。华西列夫斯基已经下令，文官军官都应该团结起来，共同对抗北方修正势力，取得革命的阶段性胜利后，再来处理文官-军官之争。大敌当前的分裂，只会让第一次西俄战争的惨剧重演。"
 PRC_war_lessons: "知战争之教训，然后能自反也"
 PRC_war_lessons_desc: "在数十年的动乱中，我们获得的教训太多了。知道自己不足之处，这样才能够反省自己；知道自己困惑的地方，这样才能自我勉励。我们需要吸取教训，在战争中成长起来。放纵懈怠就不能勉励心志振奋精神，这对于红军也是成立的。我们可以从旧有战术中提取精华，将其应用于眼前的冲突中，强化我们的作战实力。"
 PRC_helicopter_attack: "蒙古骑兵，得到创新"
 PRC_helicopter_attack_desc: "数个世纪前，蒙古骑兵曾令全世界胆寒。他们的战术世界第一，征服了大半个世界。时光飞逝，现在的蒙古骑兵已经不适应了时代，并逐渐被历史淘汰。\n\n然而我们有着新的看法。在二战后的战争中，'直升机'这一空中力量大放异彩，就如同新时代的蒙古骑兵一般，出其不意的向敌人发动进攻，成为空中死神。毫无疑问，我们应该让骑兵战术在新时代大放异彩，让敌人畏惧我们的的空骑师吧！"
 PRC_central_siberia_liberty: "呕心沥血，终得自由"
 PRC_central_siberia_liberty_desc: "为了革命，一个人愿意牺牲什么？说的容易做的难，身处安全区所作的高谈阔论，是时候放到战场上检验一番了。革命从来不是儿戏，反而是充斥着痛苦、暴力、险象环生的荆棘之路。口头支持远远不够——必须时刻准备好，为革命献上自己的生命。\n\n我们必须把这个道理铭记在心上。红旗与死亡面前无分男女，只有化承诺为行动，化星火为烈焰。为革命而战，为革命而死，才是革命的应有之义。\n\n革命者要完全投身于这场战争，以鲜血染红的路换得俄罗斯的自由——以及革命大业的成功。"
 PRC_torches: "万众擎炬火，身敌海波澜"
 PRC_torches_desc: "革命不只是单一的实体，不仅仅是士兵、政客、工人的简单加法；没有工人，士兵面对凶恶敌人时就空手无凭；没有士兵，工人面对资本主义毒瘤时就束手无策。两者辩证共生——一方的胜利就是双方的共赢。革命也是所有人的革命，革命的胜利不能依靠一个人的所作所为，所以说：使百姓定居下来，不能依靠疆域的界限，巩固国防不能靠山河的险要，威慑天下不能靠武器装备的强大。施行仁政的人，帮助支持他的人就多，不施行仁政的人，帮助支持他的人就少。帮助他的人少到了极点，兄弟骨肉都会背叛他。帮助他的人多到了极点，所有人都会归顺于他。"
 PRC_KRS_general: "败军之将，尚需利用"
 PRC_KRS_general_desc: "克拉斯诺亚尔斯克一直被称作“机会之地”，这是因为它大部分领导人和寡头并未投身于某种特定的意识形态，只是单纯地抓住机会成为了领导人并从人民那里取得了支持。意识形态的缺失意味着他们军队和政府中没有狂热分子，因此一旦发现战争有利于人革委，他们就有可能叛变到我们这边。鼓励这一行为的一个绝佳方式是允诺彻底赦免敌人政府和军队中弃暗投明的人。毕竟，如果他们真的想遵从人民的意愿，于他们而言唯一合乎逻辑的方式就是站在我们建立的社会主义自由国度这边。"
 PRC_toil_to_victory: "循此苦旅...直达胜利"
 PRC_toil_to_victory_desc: "资源日益稀缺，我们的军队正在经历一场苦难行军。我们没无他物，只有革命的一腔热血、辛劳、眼泪和汗水。他们竭尽自己的力量，为革命献上自己的生命——如今已是工人站出来挑大梁之时，革命的未来全系于此。工作条件很艰难，牺牲既漫长又痛苦，但工人每付出一个小时的劳动，士兵就能在战场上多生存六个小时。每一滴汗水，都踏实地浇筑进了通往胜利之路。人民齐心，共克时艰，革命有望。"
 PRC_five_years_modernization: "五年现代化，五年向未来"
 PRC_five_years_modernization_desc: "三十年前，布哈林曾在此地实行过西伯利亚计划，试图将这荒无人烟的西伯利亚地区打造成一片乐土。现在，我们要实施新的五年计划了。如今，我们收复了大片领土，苏联的统治再次树立。我们终于可以投入大量资源解决西伯利亚计划存在的部分问题。我们已根据国内外的新形势五年计划的相关内容。我们的经济学家预计五年计划结束时，苏联的经济实力将超越西伯利亚战争爆发前的水平。"
 PRC_soviet_wave: "苏联浪潮，多助之至"
 PRC_soviet_wave_desc: "蒙古的星星之火，绚丽无比。\n\n它以燎原之势，融化了冷冻在漫长时光里的反动哲学。华西列夫斯基同志与人民革命委员会从地狱中归来，誓要扫除一切反动派！军靴踏地，其声隆隆；飞机腾空，其声尖啸；战车渴求法西斯的鲜血，其呼声震耳欲聋。在荒蛮的俄罗斯大地上，在我们偏安的这一隅之土，恐怖是必要之恶。反动派应当惧怕，此前他们在俄国工人中酿造了种种悲剧，如今报应即将来到。\n\n吼叫吧！愤怒吧！让革命的敌人承受怒火与毁灭吧！"
 