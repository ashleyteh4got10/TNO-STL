 SWRW_RC_sidebar_tt: "德国给我们的国家和人民造成了不可磨灭的伤害，成千万斯拉夫大家族的儿女三十年不得归乡，现在我们终于夺回了我们的故土。但是，复兴之路，道阻且长。随着30年的殖民，很多旧德国总督区范围之内的民族对我们国家的认同正在趋于淡化。况且，德国人还给我们留下了令人头疼的烂摊子——数百万计的德国人滞留在我们境内，我们必须好好思量他们的去留问题。\n\n§R如果我们不能在一定期限内处理好这些事情，后果将会是灾难性的!§!"
 SWRW_warning_text_tt: "§F为保证重建工作顺利进展，他们的§Y稳定度§!需维持在§Y50%§!以上，低于该值虽然不会使领地崩溃，§R但是会严重影响我们的重建进程，进而大幅增加重建难度！§!"
