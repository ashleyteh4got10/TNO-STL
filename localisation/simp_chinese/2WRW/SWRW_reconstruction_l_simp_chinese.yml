 SWRW_RUS.8.t:0 "刻不容缓"
 SWRW_RUS.8.d:0 "在位于首都的财务部办公室内，一叠叠异常高的财务报告吸引了经济部长的注意，与以往不同，这些报告无一例外都是关于地方因为出现抗税问题而导致财政困难的：\n在下塔吉尔，工人们夺取了枪械制造厂的控制权，要求“停止用税收剥削他们”；在巴尔瑙尔，愤怒的农民用农具驱逐了前来征收税粮的官员；在马加丹，从事海外贸易的商人组成联合商会，威胁政府降低商业税，否则将采取罢市和罢行的措施。\n虽做好了心理准备，但这些报告仍然让沃尔平和他的班子陷入到手忙脚乱之中。身为经济学家，祖国深藏的经济弊端他又何尝不知。原本长期温和深的改革方案现在也因为这场危机而岌岌可危，但如果现在不果断进行彻底的税收改革，国家的财政状况将面临一场史无前例的危机。\n诚然，他也清楚，任何改革都会触动一些人的利益，反对之声定会只增不减。因此，沃尔平陷入了两难的境地：一方面，祖国的芸芸众生苦税策久矣，贸然对他们降税可能会导致财政系统的瘫痪；另一方面，国内的高收入群体肯定会想尽办法抗拒交税，贸然对他们增税定会招致他们的反击与报复……\n时间一分一秒地流逝，沃尔平已经听不到办公室的嘈杂声，他把目光放到桌上那高低不平而摇摇欲坠的天平上，[RUS.GetName]的财政系统正蹒跚地走向濒临崩溃的深渊，他必须……\n也立刻做出了最终的决定："
 SWRW_RUS.8.a:0 "我们应该从他们身上刮些油脂下来了。"

 SWRW_RUS.9.t:0 "贪婪之罪"
 SWRW_RUS.9.d:0 "巴兰尼科夫先生瘫软地坐在法庭的被告席上，他眉头紧锁，眼神中透露出一丝不安。法庭内的气氛紧张而严肃，法官和陪审团的目光都集中在他身上。与以往不同，他没有穿着他那套一套深色的西装，而是因行程匆匆只来得及穿上了一件衬衫，也不像往日电视和报纸上那样神采奕奕，眼神中尽是疲惫。\n“开庭……”\n现在，他的手心却因为紧张而微微出汗。他耗费重金聘请的律师就站在他身边，声音坚定而有力，正在为他辩护。巴兰尼科夫听着律师的陈述，心中惴惴不安。他的盖金集团为[RUS.GetName]提供了无数的军火，当然他也得到了数不尽的财富。然而，新税务政策的实施却妄图让他交出他的财富，但对嗜财如命的他来说，绝不可能。\n“被告盖金集团通过利用多处税法漏洞……”\n他开始寻找各种方法来逃避的这一切。为此他雇佣了最好的税务顾问，企图保卫自己的财产。但无论如何，一切努力似乎都徒劳无功——最终，他还是坐上了被告席。\n“巴兰尼科夫先生……”\n法官的提问尖锐而直接，巴兰尼科夫在回答时显得有些犹豫。他的声音低沉，偶尔还会因为紧张而结巴。他的眼神不得不避开法官尖锐的目光，这样才能让内心得以些许平静。\n庭外，记者们聚集在门口，他们的相机闪光灯不停地闪烁，试图扒开这个可以说是决定共和国未来案件的所有细节。庭内，旁听者们也在窃窃私语，交流自己的看法。随着庭审的进行，他的心情也愈发沉重。他知道这场赢得同税务局的无声战争的可能性微乎其微。他的眼神中闪过一丝犹豫，但很快又被坚定的神情所取代。他仍然希望，哦不，是必须能够找到一线生机，绝对不能让这群家伙撼动他的财产，绝不……\n“肃静！”\n一份份证据仍在不断呈现，他的希望逐渐破灭，内心的理智也在被慢慢侵蚀殆尽，他的财产，他的一切。通过法官和陪审团的表情，他知道已经无法挽回了。巴兰尼科夫的心情从紧张转为绝望，随之而来的便是无休止愤怒，他忍无可忍，站起来高声喊叫，像一只即兴表演的猴子：\n“老子他妈的为这个国家做了这么多，他妈的，你们凭什么这样对我？！”\n“请被告人保持肃静！请注意法庭纪律。”\n法警将他按回到座位上，没有一个人注意他，所有人都紧张地等待最终的结果：\n“全完了……”\n他们掩面哭泣，失声痛哭，他们在旧时代制造的雪花在此刻向他们怒吼着冲来，一切的最后一丝的希望也随着法官的宣判而破灭。\n“在此宣判……”\n“法院支持税务局的决定，在盖金集团成立后，巴兰尼科夫通过税法漏洞让盖金集团逃避了数以亿计的税务，对[RUS.GetName]和社会造成了不可估量的损失：为此盖金集团需要补缴税款约13亿卢布并处罚金约7亿卢布，并在六个月内全部缴清……”"
 SWRW_RUS.9.a:0 "他们只能黯然接受这一结局。"

 SWRW_RUS.10.t:0 "黑夜之后……"
 SWRW_RUS.10.d:0 "在降税之前，安德烈的生活充满了艰辛。每天，他都要在煤矿里辛勤工作，汗水浸透了他的工作服。他的脸上总是带着疲惫的神情，眼神中透露出对生活的无奈。他的工资勉强维持着家庭的基本生活，而沉重的税负更是让他感到窒息。\n“这税怎么又涨了？”安德烈在晚餐时抱怨道，他的声音中带着一丝焦虑。他的妻子玛丽亚默默地听着，脸上露出担忧的神色。他们的孩子，小伊万，正好奇地看着他们，不明白为什么父母总是为了钱而烦恼。安德烈的眉头紧锁，他的眼神中充满了对未来的担忧。\n餐桌上总是简单的食物，偶尔的一块肉都是奢侈。安德烈的鞋子早已破旧不堪，但他舍不得买新的。玛丽亚的衣服也总是那几件，洗得发白。生活虽然简朴，但高额的税款却一直缠绕在他们心头，总能让这丝温暖又荡然无存，令人窒息。\n再后来，安德烈决定加入抗税游行，他希望通过集体的力量来改变现状。游行那天，他站在人群中，举着标语，大声呼喊着口号。他的眼神坚定，声音中充满了希望。\n“我们不能再这样生活下去了！”安德烈高呼，他的声音在人群中回荡。洪亮的人声如同波涛一样在人群中传播、叠加，最终传遍克拉斯诺亚尔斯克的大街小巷。那一刻，他感到一种前所未有的力量，仿佛他的声音能够改变世界。他感觉身体充满了活力，心跳随着这波涛跌宕起伏，他感到自己不再是一个普通的煤矿工人，而是一个为正义和未来而战的战士。\n历经多次抗税游行后，政府终于决定对普通百姓实施降税措施。消息传来的那天，安德烈正在煤矿工作。他听到这个消息时，几乎不敢相信自己的耳朵。\n“真的吗？税真的要降了？”他激动地问同事，眼中闪烁着泪光。他的声音颤抖，但充满了喜悦。他的同事也兴奋地回应，这是属于他们胜利果实。\n现在，安德烈的生活发生了巨大的变化。他不再需要为了支付税款而加班加点，生活也不再像以前那样因为高税务而那么拘谨，生活质量的改善也让他开始有更多的时间和精力陪伴家人。\n“看，玛丽亚，我们终于可以给伊万买他一直想要的玩具了。”安德烈拿着新领到的工资兴奋地说到，他的声音中充满了幸福。玛丽亚微笑着看着他，眼中也闪烁着泪光。\n降税后的第一个周末，安德烈一家一大早便去去公园野餐，看着伊万在草地上奔跑，夫妻两脸上再度露出了久违的笑容。\n“爸爸，看，我抓到了一只蝴蝶！”伊万兴奋地跑过来，手里拿着一只五彩斑斓的蝴蝶。安德烈和玛丽亚看着他，这个小家伙让他们心中充满了骄傲和幸福。他们的笑容是那么灿烂，那么真诚，仿佛所有的烦恼都已烟消云散。\n无数像安德烈一家的家庭也都在享受这来之不易的清闲，清晨的阳正光洒在他们脸上，生活虽没有他们预想地那般美好，但也再也不会像以前那样辛劳与疲惫。"
 SWRW_RUS.10.a:0 "……便是黎明"

 SWRW_RUS.11.t:0 "风暴暂熄"
 SWRW_RUS.11.d:0 "办公室内，灯光昏暗，只有电脑屏幕发出的微弱光芒照亮了房间。为了尽早让[RUS.GetName]的财政步入正轨，经济部长和他的团队已经连续工作了数周，每个人都显得疲惫不堪，但大家仍不敢有丝毫松懈。\n桌子上堆满了文件和咖啡杯，墙上则挂着俄罗斯地图，上面用红色标记了财政困难的地区。窗外，莫斯科的夜景在夜色中显得格外宁静，窸窸窣窣的行人走过，丝毫没有察觉到旁边办公室内正在进行着如火如荼的工作。\n长期的熬夜让经济部长的眼圈下有明显的黑眼圈，他的眼神虽然疲惫，但仍然坚定。他明白，如果不誓死同那些困难作斗争，等待祖国的只能是无尽的萧条。\n“经济部长部长！”办公室中突然响起一声惊呼。“马加丹的报告终于递交过来了，这个月度他们的财政系统终于能正常运作了。”\n“我们做到了，”经济部长的声音沙哑，但喜悦之情仍溢于言表。“我们的改革措施开始见效了。”\n他感到一种前所未有的成就感，但没多久便又是深深的疲惫感袭来。他知道，这只是一个开始，他们还有很长的路要走。办公室响起了一阵欢呼，他们知道，这份报告意味着什么。\n经济部长把地图上的最后一个红圈划掉，望着密密麻麻被划掉的红圈，想到那些富商和权贵们难得闭上了他们的嘴巴，现在终于有了足够的资金来进行下一步改革了。\n“让马加丹和其他地方重新整理一份新的财政报告汇总发过来，我们需要更精确的数据来指导我们的决策，”经济部长强调。“我们必须确保我们的改革不仅能够解决当前的问题，还能为未来的发展打下坚实的基础。”\n“我们不能停在这里，”经济部长喃喃道。“税务改革的根基仍然不够稳固，我们需要继续前进，直至我们走向最终的胜利。”\n一阵沉默过后，经济部长拿出那套闲置了一段时间的税务改革方案，虽然曾经一度因为这次危机差点作废，不过经过不少修修补补，现在终于具备了可以重新启用的条件。\n “电话拨给[RUS.GetLeader],”经济部长说道。“现在我们得放开手脚让给这个国家来场轰轰烈烈的变革了。”"
 SWRW_RUS.11.a:0 "诸位快回到工作岗位上吧，我们还有很多事要做。"

 SWRW_RUS.12.t:0 "[RUS.GetName]降税法案"
 SWRW_RUS.12.d:0 "法案编号：共和国税法XXXX-XX号\n提交日期： XXXX年X月XX日\n提交机构： [RUS.GetName]财政部\n主要起草人：沃尔宁\n引言\n鉴于当前经济形势和公民的税负压力，[RUS.GetName]政府决定正式通过立法实施降税措施，以刺激经济增长，提高人民生活水平，并优化税收结构。本法案旨在减少对低收入和中等收入群体的税收负担，同时确保国家财政的稳定。\n第一章：降税目标与原则\n1. 目标：\n减轻低收入和中等收入家庭的税收负担。\n促进消费，刺激经济增长。\n增强税收体系的公平性和透明度。\n2. 原则：\n公平性：确保税收负担在社会各阶层间公平分配。\n透明性：简化税法，提高税收政策的透明度。\n可持续性：确保税收政策的长期可行性，不损害国家财政稳定。\n第二章：降税措施\n…………\n第三章：实施与监督\n…………\n第四章：附则\n1. 法律效力：\n本法案与现行税法相抵触的，以本法案为准。\n本法案的解释权归[RUS.GetName]财政部所有。\n2. 修订与废止：\n根据经济发展情况和财政需要，本法案可由国家杜马决定修订或废止。\n提交人： 沃尔宁\n日期： XXXX年X月XX日"
 SWRW_RUS.12.a:0 "法案通过。"

 SWRW_RUS.13.t:0 "资金之河淌淌而流……"
 SWRW_RUS.13.d:0 "瑟科特夫卡尔，在科米共和国的岁月中，她曾充斥着暴力、阴谋和疯狂。但现在，她正沐浴在清晨的阳光中。街道上，人们将潘多拉魔盒的痕迹埋葬于过往的废墟中，随着[RUS.GetName]的资金开始流入这座遍布疮痍的城市，人们拆除了街边随处可见的武器库和堡垒工事，希望和决心重新洋溢于他们的脸上。在未来，也许瑟科特夫卡尔不会成为俄罗斯最美丽、最繁华的城市，但她也绝对不会是如同过去那般的城市。\n鄂木斯克曾在战争中几乎全城毁灭，但她现在正经历着翻天覆地的变化。[RUS.GetName]的投资不仅令城市迎来了极大的改观，还带来了新的工业项目。过往所充斥的浓烈的复仇情绪正在被逐渐淡化，浓厚的黑烟再度从工厂的烟囱冒出，机器的轰鸣声向云霄宣示着这座城市的未来，鄂木斯克的工业之心现重新开始跳动，但与以往不同，这里不再只生产杀戮用的枪支武器，还有造福芸芸众生的黑麦面包。\n曾被长期忽视托木斯克，现在正迎来它的春天。[RUS.GetName]的投资让这座城市的文化潜力得到了充分的发挥。在市中心，一座座新建筑正在拔地而起。没有税务舒服工人们在工地上卖力地干活，机器的轰鸣声同人们的欢笑声交织在一起，形成了一首和谐的交响乐。街道两旁，新栽的树木开始抽出嫩绿的叶子，让这座灰色的城市得以重新着上她的本色。过去长期无人维护的博物馆、图书馆和艺术中心焕然一新，吸引了来自全国各地的游客和学者。中西伯利亚共和国的痕迹虽再难以寻觅，但托木斯克的文化之光开始照亮整个俄罗斯。\n 彼得罗巴甫洛夫斯克，这座因地理位置偏远和红海军出走而无人在意的港口城市，现在终于得到了[RUS.GetName]政府的注意，意图将其打造成继马加丹后俄罗斯的新贸易中心和重要军事港口。大量的资金修缮了废弃港口的设施，吸引了来自世界各地的船只和商人。港口的码头上，来自OFN乃至日本和德国的货物堆积如山，商人们正忙碌地交易着；不远处，位于彼得罗巴甫洛夫斯克军港太平洋舰队正如火如荼地进行演练，准备好应对未来的万全之策。也许人们应该相信，这座曾几乎荒废的城市并不应该属于原始的大自然。"
 SWRW_RUS.13.a:0 "……流向繁荣昌盛的未来。"

 SWRW_RUS.14.t:0 "第聂伯河上的旗帜"
 SWRW_RUS.14.d:0 "基辅的空气中弥漫着尘埃、硝烟和一种奇异的寂静——那是炮火刚刚停息，生者尚未敢高声喧哗的寂静。伊万靠在一辆满是弹孔的БТР残骸上，疲惫地看着灰蒙蒙的天空。他们做到了。从冰封的北方一路南下，跨过尸横遍野的战场，现在代表统一俄罗斯的那面旗帜终于插在了这座古老城市的上空。广播里一遍遍播放着胜利的消息，称乌克兰人民已从“法西斯匪帮长达四十年的残酷统治”下获得解放，重新回到“斯拉夫大家庭”的怀抱。\n\n听起来冠冕堂皇。伊万想。就像政治部那些从没闻过火药味的家伙能写出来的那样。可他眼前看到的，却与广播里的激昂颂歌相去甚远。没有想象中箪食壶浆、欢呼雀跃的人群。只有从地下室、废墟缝隙里小心翼翼探出头来的、面色蜡黄、眼神空洞的人们。他们的脸上没有欣喜，更多的是麻木、疑虑，以及一种深可见骨的疲惫。他们打量着伊万和他的战友们，就像打量着一群刚刚赶走狼群、却同样可能噬人的熊。\n\n昨天，伊万的小队在一个被炸毁一半的公寓楼里清理残敌时，发现了一个躲在壁橱里的老妇人。她紧紧抱着一个褪了色的、绣着奇怪花纹的布包，嘴里用一种他几乎听不懂的、却又隐约熟悉的语言喃喃自语。不是德语，也不是俄语。当士兵试图把她拉出来时，她猛地抬起头，浑浊的眼睛里闪过一丝几乎熄灭的火光，用嘶哑却异常清晰的声音说：“我们是乌克兰人。”\n\n就这么一句。没有感谢，没有控诉，只是一句简单到近乎固执的陈述。仿佛在提醒他们，也提醒她自己，在德意志化的高压、无休止的征粮、秘密警察的恐怖和日复一日的屈辱之后，有些东西，像黑土地下顽强的草根，并未死去。伊万后来在清理过的民居里看到过藏在墙缝里的手绘三叉戟图案，听到过夜晚从某个窗口飘出的、不成调的悲伤歌谣的片段，那旋律绝非来自莫斯科。\n\n他们被统治了四十年。四十年，足够一代人出生、成长、老去。他们的城市被改名，他们的语言被禁止在官方场合使用，他们的历史被篡改或抹去。孩子们被强制学习德语，唱着歌颂另一个“元首”的歌曲。黑土地上的小麦被源源不断运往日耳曼尼亚，而本地人却常常在饥饿线上挣扎。伊万想起史书上读到的“饥荒”，那已经是另一个时代的悲剧了，但对这里的许多老人来说，或许只是换了一种形式的重复。\n\n现在，他们“解放”了。坦克碾过曾悬挂万字旗的广场，新的画像取代了旧的。但伊万看着那些沉默的、眼神复杂的乌克兰人，突然感到一阵迷茫。历史该如何被铭记？谁的牺牲应该被歌颂？谁的苦难又该如何诉说？这片土地承载的记忆，远比他们最初设想的要沉重得多，也复杂得多。他们带回了旗帜，可他们能真正带回那些在漫长黑夜中被压抑、被扭曲、被低语传颂的灵魂吗？\n\n伊万叹了口气，把步枪重新背好。至少，战斗结束了。至少，他们来了。"
 SWRW_RUS.14.a:0 "四十年低语一个名字，铁蹄亦未能踏碎。"

 SWRW_RUS.15.t:0 "废墟上的第一块砖"
 SWRW_RUS.15.d:0 "清晨的薄雾尚未散尽，阳光艰难地穿透弥漫在基辅上空的尘埃，洒在圣安德烈斜坡那坑坑洼洼的鹅卵石路上。空气中混合着潮湿的泥土、石灰和一种难以名状的、属于新生的气息。曾经，这里回荡的是行军靴整齐的踏步声、尖利的德语口令和偶尔响起的枪声。如今，取而代之的是另一种截然不同的交响——铁锤敲击石块的叮当声、搬运工粗犷的号子、嘎吱作响的临时脚手架，以及……希望的低语。\n\n“同志们，加把劲！天黑前要把这堵墙砌好！”一个戴着沾满灰浆的旧军帽的工头，嗓门洪亮地喊着。他脚下是一片狼藉——倒塌的墙壁，烧焦的房梁，散落的瓦砾。就在几个月前，这里还是战场。现在，它是工地。男人们，大多是上了年纪的老兵或是刚放下步枪的年轻人，沉默而专注地劳作着。他们传递着砖块，搅拌着砂浆，动作笨拙却带着一种近乎固执的决心。每一块被垒起的砖石，都像是在向那段黑暗的过去宣告：我们回来了，我们要把家园重新夺回来。\n\n不远处，几个妇女正用柳条筐费力地清理着废墟，她们的头巾蒙住了半张脸，只露出一双双疲惫却坚韧的眼睛。她们一边清理，一边低声交谈，偶尔会传来几句被压抑的啜泣，但更多的是相互鼓劲的低语。“快了，阿廖娜，再搬几筐就能看见地基了。”“小心点，塔玛拉，那块石头不稳。”她们清理出的不仅仅是瓦砾，更是被战争掩埋的生活碎片——破碎的陶罐、烧焦的相框、生锈的农具……每一件物品都在无声地诉说着一个被强行中断的故事。\n\n偶尔，会有穿着统一制服的俄国士兵巡逻经过，他们的目光扫过忙碌的人群，表情复杂。有些人会停下来，笨拙地帮着搬几块砖头，换来几句带着浓重口音的“谢谢”。也有些人只是默默地看着，仿佛在思考这场重建的意义，以及他们在这片土地上的角色。空气中弥漫的不再是敌意，而是一种小心翼翼的共存，一种在共同的废墟上建立起来的、脆弱的理解。\n\n远处，第聂伯河依旧沉默地流淌，倒映着天空逐渐明亮的色彩和城市残破的轮廓。重建的路还很长，伤痛的记忆也远未抚平。但这第一块砖，这第一声号子，这第一缕穿透尘埃的阳光，却像种子一样，落在了饱受创伤的黑土地上。也许，正如他们的诗人所写…"
 SWRW_RUS.15.a:0 "“当沉睡者醒来时，他将发现，镣铐已然碎裂。”"


 SWRW_RUS.16.t:0 "黑土下的种子"
 SWRW_RUS.16.d:0 "佩特罗的靴子深深陷入泥泞的黑土之中，每拔出一步都发出沉闷的声响。空气里混合着初春解冻的湿气和一种难以言喻的、金属锈蚀与陈腐骨骸的味道。这就是他们承诺的粮仓？这片传说中只要插根拐杖就能发芽的沃土？他环顾四周，田野上布满了弹坑，像一张饱受天花摧残的脸。远处地平线上，一辆废弃坦克的剪影扭曲地刺向铅灰色的天空，那是上一次解放留下的纪念碑，或许是上上次？谁还记得清呢。\n\n来自城里穿着干净制服的指导员慷慨地分发了种子——小小的、干瘪的颗粒，装在印着模糊不清西里尔字母的麻袋里。他们拍着佩特罗的肩膀，语调激昂地谈论着“五年计划”、“农业现代化”和“为伟大祖国贡献粮食”。佩特罗只是点头，脸上努力挤出符合要求的感激和热情。他没告诉指导员，去年秋天，他就是在这片地里挖出了一枚未爆的德国航空炸弹，差点把一家老小都送去见赫鲁特。他也没说，前任统治者也曾承诺过拖拉机，结果运来的是一堆生锈的零件和一本看不懂的德语说明书。\n\n邻居伊万蹲在地头，卷着劣质的马合烟，看着佩特罗用那把祖传的、修补过无数次的木犁费力地翻着地。“佩特罗，”伊万吐出一口浓烟，声音像是被砂纸打磨过，“他们说这黑土有灵性，你种什么它都知道。你说，它知道咱们现在种下去的是希望，还是又一茬的苦难？”\n\n佩特罗停下来，抹了一把额头的汗水，混着泥土的汗珠。“谁知道呢，伊万，”他喘着气，“也许它只知道饿。它饿了几十年了，咱们也饿了几十年了。现在，有人说让咱们喂饱它，然后它就能喂饱咱们。听起来……公平。”他的语气里带着一种近乎麻木的宿命感。公平？在这片土地上，“公平”是个奢侈的词儿。\n\n他弯下腰，从布袋里抓起一把种子，那干瘪的颗粒硌着他粗糙的手掌。他看着这片被蹂躏了无数次的土地，它吞噬过尸体，饮过鲜血，承载过太多破碎的承诺。统一了。是的，不再有不同制服的人在这里互相射击了，这是一个进步，毋庸置疑。生活也许是好了一点点，像冬天里炉火旁稍微暖和了一丝的空气。但这片土地……它太累了。\n\n佩特罗深深吸了一口气，把种子撒向翻开的泥土。黑色的颗粒落在黑色的土地上，无声无息。会发芽吗？会结出果实吗？还是会被即将到来的雨水冲走，或者被乌鸦啄食干净？谁也不知道。但他还是撒下了种子，因为除此之外，他还能做什么呢？这是他的土地，无论它承载了多少伤痛。"
 SWRW_RUS.16.a:0 "播种吧…也许，它会发芽。"
 SWRW_RUS.17.t:0 "签了字，盖了章，看不懂"
 SWRW_RUS.17.d:0 "夏天的脚步还没站稳，村里就来了位新面孔——一个戴着厚眼镜、穿着笔挺却略显土气制服的年轻人，自称是区里派来的“土地关系协调员”。他带来了好几摞散发着油墨味的崭新文件，还有一种让佩特罗脊背发凉的热情。协调员召集了村民，在歪歪扭扭的村公所前，唾沫横飞地宣讲着“耕者有其田”的新政策，词语像冰雹一样砸向佩特罗混沌的脑袋：“地籍登记”、“使用权证书”、“集体责任与个人收益挂钩”…\n佩特罗手里被塞进了一张硬邦邦的纸，上面印满了密密麻麻的西里尔字母，还有一个鲜红的、看起来像是某种凶猛鸟类的印章。他横着看，竖着看，把纸凑到眼前，又拿到阳光下眯着眼瞧，那些字母就像一群喝醉了的蚂蚁，在他眼前跳着不知所云的舞蹈。他粗糙的手指摩挲着纸张的边缘，这玩意儿比配给证厚实，但远没有一把好镰刀来得实在。\n“佩特罗·伊万诺维奇！”年轻的协调员拍了拍他的肩膀，笑容灿烂得像莫斯科广场上的红星，“恭喜你！看看！这块地，从现在起，就属于你了！嗯，严格来说是长期稳定使用权，但实际上就是你的了！为伟大的祖国努力耕作吧！”\n“我的？”佩特罗愣愣地重复道，声音像是从一口干涸的井里发出来的。“啥意思？这块地…它不一直是我在种吗？我爹种，我爷也种。德国人来的时候是这块，上一个解放者来的时候也是这块。怎么现在就成我的了？”他指着不远处那片熟悉的、刚冒出点绿苗的黑土地，“这纸上的字一盖章，地里的石头就自己跑了？还是明年的雨水就听我使唤了？”\n旁边的伊万大爷吧嗒着他的烟斗，低声嘟囔：“小心点，佩特罗。以前沙皇说土地是他的，后来委员说土地是集体的，现在他们又说土地是你的。这土地啊，就像个不听话的婆娘，谁说了都不算，只认得老天爷和你的力气。”\n佩特罗没理会伊万的牢骚。他再次低头看着那张“证书”，试图从那些扭曲的符号里找出一点熟悉的痕迹，或许是“土豆”？或者“税”？没有。他只认得自己的名字，佩特罗·伊万诺维奇，被笨拙地打印在抬头。他突然感到一阵荒诞的眩晕。这块浸透了他家几代人汗水、偶尔还有血水的土地，现在因为一张他看不懂的纸，就成了“他的”？\n他抬头望向那片黑色的田野，初夏的风吹过，带来泥土和青草的气息。土地还是那片土地，沉默而坚忍。他慢慢地、小心翼翼地把那张硬邦邦的纸叠好，塞进胸前破旧的口袋里，紧挨着心脏的位置。那里，纸张的棱角隔着粗布硌着他的皮肤。一种前所未有的、混合着巨大困惑和微小得几乎可以忽略不计的…或许是…希望？的情绪，像刚出土的嫩芽一样，在他麻木的心底悄悄钻动。\n哇…他真的有地了？哪怕只是一张他横竖看不懂的纸说了算。"
 SWRW_RUS.17.a:0 "现在，这泥巴总算刻上俺的名字了。"
 SWRW_RUS.21.t:0 "“合作”的新邻居"
 SWRW_RUS.21.d:0 "那张“土地证”还没在佩特罗胸口的口袋里捂热乎，村里又来了新花样。这次不再是热情洋溢的年轻人，而是一个面色严肃、说话带着浓重官腔的中年人，他的制服领子比佩特罗家最体面的桌布还要挺括。他召集了所有拿到“证书”的村民，宣布一项名为“农业生产合作社试点计划”的伟大创举。\n“同志们！”他的声音在空旷的村公所前回荡，带着一种不容置疑的权威，“个体耕作效率低下，难以承担起复兴祖国粮仓的重任！为了提高产量，共享资源，集中力量办大事，我们决定成立农业合作社！大家的土地、农具，还有那头瘸腿的老马，”他指了指伊万大爷拴在树下的牲口，“都将统一纳入合作社管理，按劳分配，多劳多得！”\n佩特罗站在人群里，用力挠了挠头皮，试图把那些绕口令似的词语理出个头绪。统一管理？按劳分配？这听着…怎么那么耳熟？他记得小时候，另一拨穿着不同制服的人也说过类似的话，只不过那时候叫“集体农庄”。那时候也是说要“集中力量”，结果呢？粮食确实集中了，可都集中到征粮队的卡车上去了。\n“啥？”伊万大爷第一个跳了起来，烟斗都差点掉地上，“俺那老马虽然瘸了腿，但也是俺家的！凭啥给你统一管理？俺问你，俺要是想给俺孙子留俩土豆，还得打报告不成？”\n中年官员推了推眼镜，脸上没有任何表情。“伊万·斯捷潘诺维奇同志，这是为了大家共同的利益。合作社将统一提供种子、化肥，还会协调耕作时间。年底结算时，按工分计算收益，保证公平公正，还能优先获得国家的农机支持。”他顿了顿，语气加重了几分，“当然，不愿意加入的同志，我们也不强迫。只是…合作社外的农户，在资源分配和农产品收购价格上，可能…会有些不同。”\n人群中响起一阵嗡嗡的议论声。佩特罗看着手里的土地证，又看了看远处那片刚有了点起色的田地，心里像塞了一团乱麻。刚拿到手的“自己的”地，还没捂热乎呢，怎么又要“合作”了？这不又绕回去了吗？\n但他转念一想，最近的日子确实是好过了一些。配给的面粉虽然难吃，但至少管够；村里的路也修了，虽然还是土路，但坑洼少多了；最重要的是，晚上睡觉真的踏实了。那个协调员年轻人还帮他儿子小瓦西里弄到了城里小学的入学名额…\n佩特罗再次挠了挠头。他还是搞不懂这些城里人的弯弯绕绕。集体农庄？合作社？听起来像换了个马甲的狼外婆。但是…肚子好像确实比以前饱了点。他长长地叹了口气，和其他村民一样，在另一份同样看不懂的文件上按下了自己的指印。"
 SWRW_RUS.21.a:0 "行吧，换个法子一起和泥巴玩儿。"

 SWRW_RUS.22.t:0 "分到的土地，熟悉的味道"
 SWRW_RUS.22.d:0 "米哈伊尔扛着那把修了又修的旧犁，深一脚浅一脚地走在翻耕过的黑土地上。春天的气息终于压过了积雪融化后的泥泞味，带着一丝若有若无的青草香。不同于往年的是，他脚下的这片地，按照村合作社墙上贴的红头文件来说，现在“明确分配”给他家耕种了——当然，收成的大头还是要交给国家，但好歹是名义上有了“自己”的地，而不是年年看天吃饭、看干部脸色分地的日子了。\n儿子小瓦西里，如今已经长得快到米哈伊尔的肩膀高，不再是那个只知道问“生活好起来了吗”的小屁孩了。他正笨拙地跟在父亲身后，学着撒一种据说是“科学培育”过的高产土豆种子。这小子力气见长，也能帮上不少忙了，虽然动作还是毛毛躁躁，撒的种子忽疏忽密。\n“爸，”小瓦西里喘着气，抹了一把额头的汗，“合作社的雅科夫大叔说，今年要是收成好，咱们能多分到两袋土豆呢！是真的吗？”\n米哈伊尔直起腰，捶了捶酸痛的后背，望着这片望不到头的、属于自己的土地。“文件上是这么写的，小子。”他顿了顿，吐了口唾沫，“能不能拿到手，那就得看上帝——哦不，看列宁同志在天之灵保不保佑了，还得看收粮的那个胖政委心情好不好。”\n是的，变化是有的。村口的大喇叭不再天天播放着战时歌曲，而是开始宣传“农业合作化”的好处，说大家现在是土地的主人翁了。食堂里的汤稍微稠了一点点，偶尔能见到几片油花。镇上新开了一个小卖部，虽然货架上大多是空荡荡的，但至少有那么个念想。\n可米哈伊尔心里明白，这地还是那块地，土还是那个土。种什么，怎么种，大部分还是上面说了算。交多少粮，留多少粮，更是铁板钉钉的规定。所谓的“劳有所得”，更像是以前只能偷摸着揣兜里的几颗土豆，现在允许你光明正大地揣了——当然，前提是你得先完成上缴任务。\n他看着儿子兴奋地、带着一种近乎信仰般的热情撒着种子，心里五味杂陈。或许对年轻人来说，这就是希望吧？一个看得见摸得着的、属于自己的希望，哪怕它只有薄薄的一层。算了，有希望总比没有强。\n米哈伊尔重新握紧犁把，大声喊道：“加把劲，小子！天黑前得把这垄地干完！不然晚饭可没你那份的土豆饼了！”"
 SWRW_RUS.22.a:0 "土豆饼总比没饼强。"

 SWRW_RUS.23.t:0 "第聂伯河畔的烟圈"
 SWRW_RUS.23.d:0 "基辅的黄昏带着一股钢铁和尘土的味道，夕阳挣扎着想给第聂伯河染上金色，却被新建的俄式公寓楼生硬的轮廓切割得支离破碎。奥列格坐在自家厨房那张摇摇晃晃的桌子旁，桌上放着半瓶几乎没有标签的伏特加和一碟腌得发黑的酸黄瓜。他的儿子，十七岁的萨沙，则低头翻看着一本崭新的历史教科书，书页散发着廉价油墨的气息。\n“爹，”萨沙的声音有些犹豫，打破了屋内的沉寂，“书上说…我们都是伟大的俄罗斯民族不可分割的一部分，过去的苦难都是因为分裂主义和外国势力的阴谋……”他抬起头，年轻的脸上写满了困惑，“可奶奶以前总跟我说，我们是哥萨克的后代，唱的是基辅罗斯的歌谣…”\n奥列格没有立刻回答，只是给自己倒了满满一杯伏特加，仰头灌下，喉咙里发出一声满足又带着苦涩的咕噜声。他卷起一支粗糙的马合烟，用火柴擦燃，深深吸了一口，烟雾模糊了他那张饱经风霜的脸。“书，”他终于开口，声音沙哑，“书是胜利者写的，萨沙。就像面包是配给站发的一样——他们给你什么，你就得吃什么，不管它尝起来像不像混了泥沙的木屑。”\n“可老师说，民族团结是首要任务，忘记过去的不愉快，才能建设强大的新祖国…”\n“建设祖国？”奥列格嗤笑一声，烟灰掉落在打着补丁的裤子上。“我们这辈子都在建设祖国。先是为了某个蓄着小胡子的疯子在波兰的烂泥里建设，后来是为了那些举着三叉戟喊口号的家伙在克里米亚的废墟上‘建设’，再后来是为了某个留着大胡子的将军在哈尔科夫的瓦砾堆里建设…现在，又要为了莫斯科来的同志们建设了。每一次建设，都要拆掉一些旧东西，忘记一些旧名字。他们说这是为了统一，为了强大。”他指了指窗外，“你看那新建的同志大街，以前叫赫雷夏蒂克大街。你奶奶以前总带我去那里买复活节彩蛋。现在那里只有灰扑扑的水泥板和统一的标语。”\n萨沙沉默了，手指无意识地摩挲着书页上印着的、他从未见过的领导人的肖像。“那我…我们…到底是什么人？”少年轻声问道，这个问题似乎困扰了他很久。\n奥列格掐灭了烟头，又点上一支。他没有看萨沙，而是望向窗外浑浊的第聂伯河水。“我们是什么人？”他重复了一遍，声音低沉下去。“我们是种土豆的人，是喝伏特加取暖的人，是偷偷在心里唱着祖辈歌谣的人。我们是记得赫雷夏蒂克大街的人。我们是看着国旗换了一面又一面，却依然在这片黑土地上活下来的人。”\n他转过头，目光如炬地盯着儿子，一字一句地说：“听着，萨沙。他们可以在书上写一千遍‘俄罗斯人’，可以在广播里喊一万遍‘俄罗斯公民’。但你记住，”奥列格用粗糙的手指点了点自己的胸口，然后又指向萨沙，“你身体里流的血，是从这片土地上来的。你说的第一句话，是基辅的腔调。永远，永远别忘了这个。就算全世界都忘了，你自己不能忘。你是乌克兰人。”\n父子俩久久没有说话。窗外的天色彻底暗了下来，只有零星的灯火在第聂伯河对岸闪烁。奥列格拿起桌上的烟盒，递给萨沙一支。萨沙犹豫了一下，接了过来。两点猩红的火光在昏暗的厨房里亮起，烟雾缭绕，弥漫在沉默之中。"
 SWRW_RUS.23.a:0 "第聂伯河的水，依然向黑海流淌。"

 SWRW_RUS.24.t:0 "喀秋莎与指标"
 SWRW_RUS.24.d:0 "萨沙放学回家时，看到巷口新贴了一张色彩鲜艳得有些刺眼的宣传画。画上是一位丰腴健硕、笑容标准的乌克兰母亲，怀抱三个同样红光满面的婴儿，背景是麦浪滚滚的田野和拔地而起的工厂烟囱。巨大的标语用粗体斯拉夫字母写着：“英雄母亲——祖国的骄傲与未来！”旁边的小字则详细说明了对生育三个及以上子女家庭的最新奖励政策——一些额外的布票，或许还有优先购买劣质糖果的权利。\n晚饭时，厨房里弥漫着煮卷心菜的寡淡气味。萨沙心不在焉地戳着碗里的土豆块，终于忍不住开口：“爹，街上又贴新画儿了，说生得多光荣，是为国家做贡献…老师也说，我们人口少了，德国佬，美国佬，他们人多…”\n奥列格正费劲地用那把钝刀切着硬邦邦的黑面包，闻言动作一顿。他拿起桌上半空的伏特加瓶子，给自己又倒了一杯，浑浊的液体晃荡着。“光荣，”他哼了一声，把酒灌进喉咙，“是啊，光荣。就像当年集体农庄的拖拉机一样光荣。他们需要人手了，萨沙。需要填满工厂的工人，需要填满军营的士兵，需要足够的人去喊‘乌拉’，去挥舞旗帜。”\n他用手指捻着烟蒂，“你奶奶那辈，生了七个，活下来三个。那时候没人说光荣，只说命苦，说拉扯不大。现在他们要你妈，要邻居家的玛莎婶子，像孵小鸡一样下崽子。光荣？他们发的那些布票，够给新生儿做几条尿布？够不够买一口奶喝？他们给你画个大饼在天上飞，然后让你饿着肚子去追。”\n奥列格点燃烟，深深吸了一口，烟雾缭绕。“他们说我们不是欧洲子宫。说得好听。但他们要女人敞开肚皮，一个接一个地生，和母猪下崽有什么区别？玛莎婶子才三十出头，看着比你奶奶还老。她的男人？两年前死在‘维和任务’里了，哪个鸟不拉屎的边境线上，骨头都找不回来。现在她一个人拉扯五个孩子，靠给军官洗衣裳换点土豆。光荣？狗屁的光荣。”\n他弹了弹烟灰，“国家需要未来，萨沙。但未来不是靠指标和口号生出来的。是靠热汤，靠暖和的靴子，靠你晚上能睡个安稳觉养出来的。别信那些画儿，小子。画上的麦子不能吃，画上的孩子不会哭。”\n萨沙沉默了，低头看着自己碗里那几块孤零零的土豆。厨房窗外，夜色渐浓，远处的工厂烟囱依旧不知疲倦地吐着黑烟，融入无边的暮色之中。"
 SWRW_RUS.24.a:0 "孩子是未来的花朵，但需要施肥，而不是指标。"
 SWRW_RUS.25.t:0 "黑土里的金穗"
 SWRW_RUS.25.d:0 "又到了向国家交售粮食的日子。奥列格站在尘土飞扬的打谷场边，看着一袋袋鼓鼓囊囊的小麦被装上嘎吱作响的卡车。阳光下，金黄的麦穗堆积如山，刺得人眼睛发疼。广播里，那个声音洪亮、字正腔圆的播音员正激情澎湃地播报着：“…乌克兰，我们伟大的祖国的粮仓，再次超额完成了对欧洲兄弟民族的援助任务！肥沃的黑土地再次证明了制度的优越性！金色的麦浪将滋养整个进步世界…”\n萨沙也在旁边帮忙扛麻袋，汗水浸透了他单薄的衬衫。他停下来喘口气，抹了把脸上的汗和灰，走到父亲身边。“爹，我们收了这么多粮食，真是‘欧洲粮仓’啊！”他年轻的脸上带着一丝与播音员相似的、被宏大叙事所感染的自豪。\n奥列格吐掉嘴里的草根，眼神复杂地看着那一车车运走的粮食。“是啊，粮仓。别人的粮仓。”他从口袋里掏出皱巴巴的烟盒，抽出一支卷烟点上。“你看这些麦子，萨沙，金灿灿的，多好。知道它们要去哪儿吗？要去莫斯科，要去华沙，要去布拉格，要去柏林——天知道还会去哪儿。会变成那些城里人体面的白面包，变成他们餐桌上的点缀。”\n“可我们是在帮助兄弟民族，爹。书上说这叫国际主义…”\n“国际主义？”奥列格干笑一声，烟雾从他齿缝间溜走。“是啊，伟大的国际主义。就是让你勒紧裤腰带，把你地里刨出来的、活命的口粮，装上火车送给几千俄里外、你连名字都叫不上来的‘兄弟’。然后他们给你发几张奖状，说你是‘劳动模范’，再给你几句空头许诺，说明年拖拉机就能到村里了——年复一年。”\n他指了指自家那块贫瘠的自留地，“我们自己的地呢？每年交完公粮，剩下的够咱们嚼谷到春天就不错了。你妈还得想方设法用土豆掺着面粉做列巴。我们是粮仓？哈！我们是给别人装粮食的麻袋，装满了就被人扛走，谁管你这麻袋破没破，饿不饿？”\n奥列格狠狠吸了一口烟，“记住，萨沙，这片黑土地是我们的母亲，它能养活我们。但现在，它得先养活别人。什么时候它能先让我们自己吃饱了，再去‘援助兄弟民族’，那才叫真的好日子。别被那些喇叭里的口号和报纸上的数字糊弄了。”\n卡车扬起一阵尘土开走了，留下空旷的打谷场和一股麦秆的清香。父子俩沉默地站在那里，望着远去的车队消失在视野尽头。奥列格把烟头扔在地上，用靴子碾灭，又从口袋里掏出一支，重新点上。"
 SWRW_RUS.25.a:0 "土里刨食，喂饱世界，饿着自己。"

 SWRW_RUS.26.t:0 "巨坝上的尘埃与回声"
 SWRW_RUS.26.d:0 "第聂伯河畔，扎波罗热。塔拉斯的汗水滴落在滚烫的混凝土上，瞬间蒸发。震耳欲聋的轰鸣声——搅拌机、打桩机、载重卡车的咆哮——几乎成了他生命的一部分。他记不清这是第几个年头了，他们像蚂蚁一样，在这片被战争蹂躏过的土地上，重建那座曾是共和国骄傲，后来又变成双方焦土政策牺牲品的巨型水电站。\n工地上飘扬着崭新的旗帜，扩音器里播放着永远乐观的进行曲和领导同志们关于“电气化照亮未来”的讲话。塔拉斯对此已经麻木。他记得更早的时候，还是个孩子时，他的父亲也曾在这儿劳作，那时人们眼里有光，相信每一块石头、每一袋水泥都在为一个更光明的世界添砖加瓦。后来，那光熄灭了，伴随着震耳欲聋的爆炸声和第聂伯河愤怒的咆哮。他父亲没能看到那一天。\n现在，他们又回来了。用同样坚韧的劲头，用着从“兄弟共和国”运来的、时常出故障的设备，也用着成千上万双像他一样粗糙的手。广播说这是“人民意志的奇迹”，“对法西斯破坏者的有力回击”。塔拉斯觉得，这更像是跟自己较劲，跟这条不驯的河流较劲，跟那该死的、总也挥之不去的过去较劲。\n他和其他工友们住在临时搭建的棚屋里，晚上点着昏暗的灯泡——如果当天运气好，配电正常的话。看着远处大坝一天天重新隆起，像一道灰色的伤疤横亘在河上，塔拉斯心里有种奇异的空虚感。这巨大的力量将来会流向何方？是点亮基辅夜晚的霓虹，还是驱动遥远边疆工厂的齿轮？或许两者都有。但此刻，他只感受到脊背的酸痛，和那永远也洗不干净的混凝土粉尘。"
 SWRW_RUS.26.a:0 "河水总会流淌，无论流向何方。"


 SWRW_RUS.27.t:0 "灯火通明的远方与摇曳的烛光"
 SWRW_RUS.27.d:0 "波尔塔瓦郊外，奥克萨娜又一次熟练地拧紧了接触不良的灯泡底座。昏黄的光线闪烁了几下，终于稳定下来，勉强照亮了她那间简陋的小屋和桌上摊开的缝补活计。窗外，巨大的高压电塔如同钢铁巨人般，沉默地跨过原野，将一条条粗壮的电缆伸向模糊的远方——据说是波兰，或许更远。\n收音机里正播放着晚间新闻，播音员用那种特有的、充满自豪的语调宣布：“…本季度电力出口指标再次超额完成！乌克兰的澎湃动力正源源不断地输送给兄弟民族，有力地支援了集体安全条约组织的共同繁荣…”奥克萨娜哼了一声，没理会。她更关心的是，自家这个月的电费会不会又涨价，以及明天村里的电锯厂还能不能正常开工——上次停电，半个村子的木材加工都停了，男人们只能聚在酒馆里抱怨。\n她的邻居，老伊万，拄着拐杖走进来借点盐。“听到了吗，奥克萨娜？咱们的电都跑到国外去了，莫斯科肯定亮堂得很！”老人干瘪的脸上露出一丝嘲讽，“咱们这儿呢？呵，电灯泡跟萤火虫似的，一惊一乍。真是肥水流了外人田。”\n奥克萨娜递给他盐罐子，叹了口气：“伊万大叔，少说两句吧。上面说这是大局，是‘战略需要’。咱们小老百姓，懂什么。”她心里却想着，自家孩子晚上做功课，还得凑在灯泡底下，稍微远点就看不清书上的字。而那些据说承载着“澎湃动力”的电线，就在屋顶上嗡嗡作响，把光明送给那些她永远也不会见到的人。粮仓的滋味，大概就是这样吧？自己空着肚子，看着粮食被运走，现在连灯光也要分给别人。\n她捻了捻缝补的线头，借着那并不稳定的光。远处的高压电塔在夜色中如同沉默的剪影，坚定地履行着它们的“国际主义义务”。"
 SWRW_RUS.27.a:0 "电流没有国界，但黑暗有。"
 SWRW_RUS.28.t:0 "扎波罗热核电站"
 SWRW_RUS.28.d:0 "列夫科站在离那巨大的混凝土穹顶几百米远的安全距离外，感觉脚下的土地都在微微震动。扎波罗热核电站，这个共和国最新的骄傲，或者说，是最新的庞然大物，正在进行某种关键测试。他是个年轻的技术员，从利沃夫调来，负责监控冷却系统的压力读数。这里的一切都透着一种未来感，也透着一种让人脊背发凉的陌生。\n工地上到处是穿着白色或灰色制服的人，胸前别着写有数字和字母的胸牌，脸上表情严肃。持枪的卫兵三步一岗五步一哨，铁丝网上挂着黄黑相间的辐射警告标志——那个奇怪的三叶草符号，据说代表着一种看不见摸不着，却能杀死你的“火”。老工人们私下里叫它“原子鬼火”。\n列夫科接受过培训，知道所有的安全规程，知道盖革计数器的读数意味着什么。但他还是无法完全摆脱那种莫名的敬畏和一丝丝恐惧。这和烧煤或者拦河筑坝完全不同。他们在驯服的，是太阳核心的力量，是恒星燃烧的秘密。墙上的宣传画把原子能描绘成温顺的巨人，能提供“取之不尽用之不竭的清洁能源”，能“一夜之间让整个共和国灯火通明”。\n然而，在那些整洁的控制室和厚重的铅门背后，锁着的是什么？列夫科有时会在值夜班时，望着反应堆那沉默而巨大的轮廓发呆。它像一个沉睡的巨兽，呼吸平稳，但你知道它随时可能醒来，爆发出毁天灭地的力量。工友们有时会开玩笑，说如果操作失误，他们会瞬间变成“国家的灰烬”。玩笑背后，是无法言说的紧张。\n今天测试似乎很顺利，各项读数都在正常范围内。列夫科在记录本上签下自己的名字，松了口气。下班后，他走出厂区，看到远处第聂伯河在夕阳下闪着光，河边的村庄炊烟袅袅，一切宁静祥和，仿佛与这个混凝土和钢铁的巨人属于两个不同的世界。他不知道这个“和平原子”究竟会给这片土地带来什么。是承诺的光明，还是潜藏的阴影？\n他从口袋里掏出皱巴巴的烟盒，点上一支，深深吸了一口，烟草的味道暂时压过了空气中那股若有若无的、消毒水似的“科学”气息。"
 SWRW_RUS.28.a:0 "至少，今晚反应堆没有打喷嚏。"
 SWRW_RUS.29.t:0 "第聂伯河的拥抱"
 SWRW_RUS.29.d:0 "基辅的夜晚，第一次有了让人安心的、连成片的灯火。沿着赫雷夏蒂克大街，二十岁的尤里慢慢走着。他刚从重建工地下班，虽然浑身酸痛，口袋里那点微薄的卢布叮当作响，但心里却有一种从未有过的、奇异的踏实感。\n他记得小时候，这里的夜晚是属于寂静、宵禁和恐惧的。窗户都要用厚厚的黑布遮起来，任何一点光亮都可能招来巡逻队的盘问，甚至是更糟的事情。街灯要么根本不亮，要么就发出鬼火般幽幽的光，把熟悉的街道照得如同异界。人们说话的声音总是压得很低，眼神里充满了猜疑和疲惫。\n后来，旗帜换了又换，每一次都伴随着新的口号、新的许诺，以及新的破坏和迁徙。尤里的父亲，一个沉默寡言的铁路工人，从未对任何一面旗帜或任何一个“解放者”表示过热情，只是默默地修复被炸毁的铁轨，又看着它们再次被炸毁。父亲常说：“管他们挂什么牌子，尤里，咱们的日子就是补锅，一个洞堵上了，另一个洞又漏了。”\n但现在，似乎有些东西真的不一样了。路边的咖啡馆亮着温暖的灯，里面传出低低的交谈声和久违的班杜拉琴声。几个穿着新发的、虽然样式呆板但干净整洁校服的学生，正围在一起嬉笑着讨论着什么，不再是窃窃私语。甚至连街角的那个老乞丐，今天面前的罐子里也多了几枚硬币。\n尤里走到第聂伯河边，靠在修复了一半的花岗岩栏杆上。河水在夜色中静静流淌，对岸的灯火映在水面上，碎成一片金色的鳞片。空气中弥漫着河水的湿气和新翻泥土的气息，没有了硝烟味，也没有了那些年挥之不去的恐惧的铁锈味。\n他想起了奶奶临终前的话，那时他还是个孩子，不太懂。奶奶握着他的手，浑浊的眼睛望着天花板，用带着浓重乡音的乌克兰语低语：“尤里克，孩子…家，就是家…不管它被踩了多少脚，打碎了多少碗…只要根还在土里，它总会…再长出来的…”\n一个穿着同样工装、脸上带着同样疲惫却有着不同光彩的女孩，提着一个篮子从他身边走过，看到他，略微有些羞涩地笑了笑，加快了脚步。尤里看着她的背影消失在昏黄的路灯尽头。\n他突然明白了奶奶的话。这片土地，这个城市，这些说着和他一样带着基辅腔调的人们，无论过去经历了多少苦难，无论被强加了多少身份，这里就是家。现在，似乎终于有人想起来要清扫庭院，修补屋顶，让这个家重新像个家的样子了。\n重建的路还很长，很艰难，父亲的怀疑或许依然有道理。但今晚，站在这条亘古不变的河流旁，看着那片正在苏醒的、属于他们的灯火，尤里第一次真切地感受到，他们不是在修补一个破洞，而是在重新拥抱一个伤痕累累，却终于开始回暖的家。这是他们的时代，一个重新找回自己的时代。\n他从口袋里掏出最后一根皱巴巴的香烟，犹豫了一下，又放了回去。也许，他想，有些旧习惯，也是时候该戒掉了。"
 SWRW_RUS.29.a:0 "这一次，河流拥抱两岸。"
 SWRW_RUS.30.t:0 "工棚里的巴扬琴与羊肉汤"
 SWRW_RUS.30.d:0 "夜幕低垂，莫斯科郊外某处大型重建工地的工棚里，煤油灯昏黄的光晕勉强驱散着角落的阴影，却驱不散弥漫着的汗水、烟草和某种浓郁食物的混合气味。工棚中央，用几个木箱拼成的简陋桌子上，摆着一口热气腾腾的大铁锅，里面翻滚着土豆和几块珍贵的羊肉，浓郁的香气正是从这里散发出来的。\n四个肤色、口音各异的汉子围坐着，脸上带着劳作一天的疲惫，却又洋溢着难得的松弛。\n“伊万，你这手艺还是没话说，这土豆炖得入口即化！”说话的是鲁斯塔姆，一个鞑靼汉子，他一边大口嚼着土豆，一边含糊不清地赞美着，手里还比划着大拇指。\n伊万，一个典型的俄罗斯壮汉，咧嘴笑了，露出几颗被烟熏黄的牙齿：“那是，也不看看是谁炖的。不过鲁斯塔姆，这羊肉还得是你的功劳，要不是你小子路子野，从‘南方同志’那里弄来这点好货，咱们今晚就只能啃黑面包就凉水了。”\n“嘿，这叫资源整合，懂吗？我们塔拉斯搞来了好木柴，格奥尔吉去换了盐巴…大家凑凑，这日子才能过下去嘛。”鲁斯塔姆拍了拍胸脯，又指了指旁边安静笑着的乌克兰小伙塔拉斯，和正在用小刀仔细削着什么的格鲁吉亚人格奥尔吉。\n塔拉斯腼腆地笑了笑，拿起身边那把老旧的巴扬琴，试了几个音。“那…我拉一段？助助兴？”\n“拉！必须拉！”伊万大手一挥，“就拉那首《喀秋莎》，不过得欢快点，别拉得跟送葬似的！”\n悠扬的琴声响起，虽然琴有些跑调，拉琴的人技术也谈不上精湛，但在这简陋的工棚里，却显得格外动人。格奥尔吉停下了手里的活计，那是一对正在成型的小木雕，似乎是一对跳着列兹金卡舞的小人。他拿起一个粗陶碗，给自己盛满了羊肉汤，又给其他人一一满上。\n“敬…”格奥尔吉举起碗，他那深邃的眼睛在灯光下闪烁，“敬我们还能坐在一起喝汤，敬这该死的战争终于结束了，敬我们还能用自己的手，重建这片土地…不论我们是从哪里来的。”\n“敬活着！”伊万大吼一声，首先碰了碗。\n“敬和平！”鲁斯塔姆紧随其后。\n“敬家园…”塔拉斯轻声说，琴声未停。\n四只粗糙的碗碰到一起，发出沉闷的响声，混合着巴扬琴的旋律和锅里羊肉汤的咕嘟声。他们来自不同的角落，说着不同的乡音，信奉着不同的神明，也曾在混乱的年代里互相猜忌甚至兵戎相见。但现在，在这片满目疮痍却又重新焕发生机的土地上，在一口羊肉汤的热气和一支走调的曲子面前，他们首先是工友，是兄弟，是一起为明天搬砖的人。重建的路还很长，比伏尔加河还要长，但至少今晚，他们有热汤，有音乐，有彼此。"
 SWRW_RUS.30.a:0 "干了这碗热汤，明天我们继续！"
 SWRW_RUS.31.t:0 "潮汐与墨迹"
 SWRW_RUS.31.d:0 "里加的港口空气中弥漫着海盐、柴油和一种挥之不去的、属于过去的尘埃味道。安东诺夫，一位从莫斯科派来的年轻规划师，正站在冰冷的海风中，试图将一张巨大的“波罗的海沿岸重建区——第一阶段”蓝图压在几个锈迹斑斑的油桶上。风不配合，蓝图的一角被吹得猎猎作响，像一面不情愿投降的旗帜。\n不远处，几个拉脱维亚码头工人沉默地搬运着从某艘刚靠岸的、看起来和安东诺夫爷爷年纪一样大的货轮上卸下的水泥袋。他们的眼神越过安东诺夫和他的蓝图，望向灰色的波罗的海，表情复杂难辨，像这片海域变化莫测的天气。\n安东诺夫知道这计划有多宏伟——全新的码头、现代化的仓库、高效的铁路连接线…蓝图上的线条整齐、精确，充满了理性的美感。可现实是：码头上到处是战争留下的弹坑，仓库的屋顶要么塌了，要么就只剩骨架，唯一看起来还算结实的，是德国人修建的一座混凝土碉堡，如今成了孩子们涂鸦和玩耍的场所。计划书里的“熟练劳动力”现在正用一种混合着拉脱维亚语、俄语和德语的奇特词汇交流着，效率嘛…只能说充满了即兴发挥的艺术感。\n他叹了口气，用一块石头把不听话的蓝图角压住。这重建计划就像这蓝图，美好，宏大，但也脆弱，随时可能被现实的狂风吹得七零八落。"
 SWRW_RUS.31.a:0 "墨水干涸之处，现实才刚刚开始显影。"
 SWRW_RUS.32.t:0 "解冻的词语"
 SWRW_RUS.32.d:0 "塔林，雨后的石板路泛着湿冷的光。伊尔玛，一位在裁缝店工作了大半生的老妇人，正小心翼翼地爬上吱呀作响的木梯，前往她那间堆满杂物、几乎被遗忘的阁楼。外面传来孩子们追逐打闹的笑声，夹杂着远处建筑工地上断断续续的敲打声——这些都是近来才重新出现在这座城市的声音。放在过去，孩子们不会这么大声笑闹，大人们的脚步也总是匆忙而谨慎。\n四十年的时光，足以让恐惧渗入骨髓，变成一种本能。伊尔玛记得那些穿着灰色制服、说着刺耳德语的人在街上巡逻的样子；记得宵禁时死寂的街道和偶尔响起的枪声；记得邻居悄无声息地消失，再也没有回来；记得那些被禁止的书籍、被禁止的歌曲、被禁止的语言低语。爱沙尼亚的灵魂仿佛被冻结在琥珀之中，沉重而透明。\n她在阁楼的一个旧皮箱底下，找到了一本用油布包裹着的小册子。打开油布，里面是一本发黄变脆的诗集，封面印着一位她少女时代崇拜的民族诗人的名字——这个名字，已经有几十年没人敢公开提起了。她的手指颤抖着抚过那些铅印的文字，那些在漫长黑夜里支撑着她的词语，那些歌颂森林、海洋和自由的诗句。\n她坐在布满灰尘的地板上，借着阁楼小窗透进来的微光，无声地读着。她读得很慢，仿佛每一个字都要重新学习，每一个音节都在唤醒沉睡的记忆。她仿佛又看到了年轻的自己，在大学的草坪上和朋友们一起朗诵这些诗篇，那时的天空似乎格外蓝，未来的可能性也像夏日的白云一样舒展。\n后来…后来一切都变了。朋友们或流亡，或沉默，或消失。只有这本诗集，像一颗顽强的种子，在黑暗的土壤里捱过了漫长的冬季。\n楼下传来孙女莉娜的声音：“奶奶！晚饭好了！您在上面找什么呢？”\n伊尔玛小心地合上诗集，用油布重新包好，藏回箱底。她站起身，拍了拍身上的灰尘。“没什么，孩子，”她对着楼梯口喊道，声音有些沙哑，但比刚才多了几分温度，“找到了一些…旧东西。”她走下楼梯，外面的天色已经暗了下来，远处的工地上亮起了灯火。有些伤痛也许永远无法完全愈合，但至少，冰封的词语，终于开始在心底悄悄解冻了。"
 SWRW_RUS.32.a:0 "记忆如同种子，在等待春天。"
 SWRW_RUS.33.t:0 "大海从不看报告"
 SWRW_RUS.33.d:0 "摩尔曼斯克的清晨，带着一股咸腥而凛冽的味道。老渔夫斯捷潘正和他的两个儿子费力地将沉重的渔网拖上他们那艘饱经风霜的“胜利号”渔船。渔网里，银色的鳕鱼和几条挣扎的比目鱼在甲板上活蹦乱跳，这是他们忙活了一整夜的收获——不算丰盛，但足以让一家人看到希望，也比战时偷偷摸摸下海、提心吊胆躲避德国巡逻艇的日子强太多了。\n\n“爸！你看这条！够肥的！”小儿子瓦洛佳兴奋地举起一条扭动的大比目鱼，脸上冻得通红，却洋溢着收获的喜悦。\n\n斯捷潘点点头，吐掉嘴里叼着的烟蒂。“别磨蹭，快分拣装箱，港务局那个穿制服的小子一会儿该来了。”他口中的“穿制服的小子”是新政府派来的渔业代表，一个戴着眼镜、说话文绉绉的年轻人，手里总是拿着一个写满数字的文件夹。\n\n果然，船刚靠岸，那个年轻人就出现了，身后还跟着两个端着步枪的士兵——这阵势让码头上其他渔民都有些紧张。“斯捷潘·尼古拉耶维奇同志，”年轻人推了推眼镜，打开文件夹，“根据‘北方渔业资源可持续发展与生产力提升五年规划’，你今天的捕捞配额是…嗯…三百公斤。请配合检查。”\n\n斯捷潘看了一眼堆在甲板上的鱼，又看了一眼年轻人手里的表格，黝黑的脸上露出一丝苦笑。“同志，你看，今天的风向不对，鱼群没过来，我们忙了一晚上也就…”\n\n“规定就是规定，斯捷潘同志。”年轻人打断了他，语气不容置疑，但眼神里却似乎也有一丝无奈，“计划需要精确的数据，所有人都必须完成指标。这是为了国家，为了整体利益。”他指了指远方正在修建的冷冻仓库和加工厂，“想想看，以后我们的鱼能运到莫斯科，运到更远的地方去！人人都能吃上鱼！”\n\n斯捷潘没再争辩。他默默地和儿子们一起，将渔获过秤、登记。三百公斤的配额，他们今天只完成了不到一半。年轻人一丝不苟地记录下数字，在本子上划了几个勾，又提醒他们明天必须“加倍努力”，然后带着士兵离开了。\n\n大儿子德米特里低声抱怨道：“爸，这叫什么事？大海又不是工厂，还能按计划产鱼？”\n\n斯捷潘拍了拍儿子的肩膀，拿起破损的渔网，开始熟练地修补起来。“大海从不看报告，孩子，”他望着远处翻涌着灰色波涛的巴伦支海，平静地说，“它只管给出它愿意给的东西。我们呢，就只管收下，然后补好网，明天继续出海。”阳光穿透云层，洒在布满补丁的渔网上，也洒在老人布满皱纹的脸上，映出一片谈不上喜悦，却也并非绝望的平静。"
 SWRW_RUS.33.a:0 "明天依旧要撒网入海."
 SWRW_RUS.34.t:0 "森林回响"
 SWRW_RUS.34.d:0 "电台里传来沙沙的杂音，中尉谢尔盖耶夫把烟头摁熄在潮湿的苔藓上。命令简短、冷酷，像拉脱维亚深秋的雨点：“命令：坐标区域7-G，执行‘森林梳理’行动。已知敌对武装单位，代号‘狐狸’，在该区域活动频繁。任务目标：搜索并清除。重复，搜索并清除。完毕。”\n又来了。谢尔盖耶夫心里骂了一句，却没发出声音。所谓的“森林兄弟”，说得好听，一群躲在树林里的幽灵。他们有时像真正的士兵一样伏击补给线，有时又像土匪一样骚扰村庄。他们熟悉这片林子，就像熊熟悉自己的洞穴。而谢尔盖耶夫和他的兵，大多是来自伏尔加草原或者乌拉尔矿区的毛头小子，在这迷宫般的森林里，方向感还不如一只受惊的麋鹿。\n“头儿，”军士长彼得罗维奇凑过来，递给他一个水壶，里面是兑了水的烈酒，“又是抓‘狐狸’？上次那只‘獾’可把我们折腾得够呛，还折了两个弟兄。”彼得罗维奇是个老兵，脸上刻满了战争的年轮，眼神里带着一种看透了世事的疲惫。\n“命令就是命令，老彼。”谢尔盖耶夫灌了一口，辛辣的液体灼烧着喉咙，“上头说了，波罗的海要‘彻底稳定’。这些林子里的‘兄弟’就是最后的钉子，不拔掉不行。”\n“稳定？”彼得罗维奇嗤笑一声，“拔了钉子，还有土里的石头呢。我们赶走了德国人，可对他们来说，我们也是占领者，只不过换了个徽章。这活儿，没个头。”\n谢尔盖耶夫沉默了。他知道彼得罗维奇说得有道理。他们打赢了伟大的卫国战争，把纳粹赶回了老家，可战争的幽灵似乎并未散去，只是换了副面孔，藏进了这片阴郁的森林。每次“梳理”都像是在跟自己的影子打仗，疲惫、血腥，而且永远不知道什么时候会从哪个树洞里射来一颗冷枪。\n“检查装备！五分钟后出发！”谢尔盖耶夫对着手下喊道，声音在空旷的林间回荡。“都他妈给我打起精神！别让林子里的蚊子把你们的血吸干了！”他试图用粗鲁的玩笑驱散弥漫的阴霾，但效果甚微。士兵们默默地检查着武器，眼神空洞。\n也许这次能抓到那只该死的“狐狸”吧，谢尔盖耶夫想。也许这次能少死几个人。也许…他不再去想，只是拉紧了背包带，第一个走进了越来越浓密的森林深处。"
 SWRW_RUS.34.a:0 "林深之处，只有风声作答。"
 SWRW_RUS.35.t:0 "狼穴残火"
 SWRW_RUS.35.d:0 "“目标确认，坐标Delta-9，敌方火力点，疑似‘狼人’残余巢穴。请求炮火支援，重复，请求炮火支援。完毕。”少尉科斯佳对着无线电冷静地报告，他的声音没有一丝波澜，仿佛在汇报今天的午餐菜单。他趴在一处被炸毁的农舍残骸后面，身边是几个同样冷静的士兵，正用望远镜观察着远处那个孤零零的、伪装得很好的地堡。\n\n“狼人”——德国人留下的烂摊子，一群死硬的纳粹分子、当地的通敌者、或者干脆就是被洗脑的疯子组成的游击队。他们不像“森林兄弟”那样难以捉摸，但更加疯狂和残忍。他们的袭击往往毫无征兆，而且手段极其毒辣，留下的只有焦土和残缺不全的尸体。对付他们，没有谈判，没有怜悯，只有彻底的“归零处理”。\n\n几分钟后，远处的炮兵阵地传来沉闷的轰鸣，几秒后，尖啸声由远及近，大地开始颤抖。橘红色的火球在地堡周围炸开，浓烟和尘土冲天而起。科斯佳放下望远镜，揉了揉被震得发麻的耳朵。\n\n“火力覆盖完成，阿尔法小队，准备清剿。贝塔小队，侧翼掩护。保持通讯畅通，注意交叉火力。前进！”科斯佳通过喉麦下达命令。士兵们熟练地交替掩护，向着还在冒烟的目标区域快速推进。\n\n进入地堡的过程比预想的要顺利，抵抗微乎其微。里面弥漫着硝烟、血腥和一股令人作呕的腐臭味。墙上潦草地涂着万字徽和意义不明的口号。角落里堆放着几箱德国造的弹药和罐头，旁边是几具烧焦或被炸得四分五裂的尸体，从残破的制服上还能勉强辨认出党卫军的领章。\n\n一个士兵踢开一扇摇摇欲坠的铁门，里面是一个年轻得过分的金发小子，蜷缩在角落里瑟瑟发抖，怀里紧紧抱着一支断了枪托的MP40。他看到冲进来的士兵，发出一声不像人声的尖叫，试图举起那支废枪。\n\n“目标解除威胁。”一个老兵的声音响起，伴随着一声清脆的枪响。\n\n科斯佳没有进去看。他只是在门口站了一会儿，听着里面搜查和清理的声音。“报告总部，‘海妖’巢穴已被肃清，正在进行战场评估。完毕。”他再次拿起无线电，声音依旧平静。战争结束了，但清理战争留下的垃圾，却像是一场永无止境的扫除。他感到一阵莫名的疲惫，比连续行军三天三夜还要累。"
 SWRW_RUS.35.a:0 "灰烬之下，总有余烬。"
 SWRW_RUS.36.t:0 "熟悉的陌生街角"
 SWRW_RUS.36.d:0 "安娜·彼得罗夫娜端着一盘刚出炉的黑麦面包，有些犹豫地站在邻居家门口。这栋位于维尔纽斯老城的公寓楼，她住了快三十年了。邻居换了一批又一批：战前的立陶宛人、苏联时期的俄罗斯干部、德国占领时的军官家属…现在，又搬来了一户新的俄罗斯家庭，据说男主人是从西伯利亚调来的工程师。\n楼道里飘来熟悉的罗宋汤香味，混合着一股新粉刷墙壁的味道。安娜深吸一口气，敲了敲门。开门的是一位和她年纪相仿的妇女，脸上带着长途跋涉的疲惫和一丝不易察觉的紧张。“您好，”安娜用有些生疏但还算流利的俄语说，“我是安娜，住在隔壁。欢迎你们搬来，这是刚烤好的面包，尝尝吧。”\n女主人愣了一下，随即露出了感激的笑容。“哦，太感谢您了，安娜·彼得罗夫娜！快请进，快请进！我叫娜塔莎，这是我丈夫伊万。”一个同样带着风霜之色的中年男人从屋里走出来，笨拙地擦着手上的油污。\n屋里很简陋，家具不多，但收拾得很干净。墙上挂着一张崭新的地图，上面用红色的笔圈出了几个地名：莫斯科、列宁格勒，还有他们刚刚离开的鄂木斯克。“你们一路辛苦了，”安娜把面包放在桌上，“从那么远的地方来。”\n“是啊，”伊万叹了口气，“接到调令就收拾东西出发了。说是这里需要技术人员，为了…为了重建。”他看着窗外那熟悉的尖顶教堂和略显陌生的街道，“维尔纽斯是个好地方，就是…有点不一样。”\n安娜明白他的意思。对她这样的老住户来说，这座城市在不同旗帜下变换着面孔，每一次都意味着身份的重新定义。而对伊万和娜塔莎这样的“新人”来说，他们既是胜利者派来的建设者，又是这片土地上需要重新扎根的异乡人。学校里开始重新教授俄语了，街上的标语也换了，报纸上每天都在宣传着“伟大的俄罗斯民族大家庭”和“兄弟般的友谊”。可楼下那个卖花的立陶宛老太太看她的眼神，似乎和看德国占领军没什么两样。\n“会好的，”安娜轻轻地说，也不知道是安慰新邻居，还是安慰自己，“慢慢来，大家都要重新学着过日子。”\n娜塔莎给她倒了一杯热茶。“希望如此吧，”她小声说，“孩子们很喜欢这里的公园。”\n也许这就是希望所在吧，安娜想。孩子们的世界总是简单些。也许他们这一代，真的能在这片古老的土地上，找到一种新的、属于俄罗斯人，也属于所有人的身份认同，不再背负过去的沉重包袱。"
 SWRW_RUS.36.a:0 "时间会冲淡一切，抑或加深印痕。"
 SWRW_RUS.37.t:0 "风中的传单"
 SWRW_RUS.37.d:0 "马里斯，里加的一名电车售票员，正百无聊赖地看着窗外熟悉的街景。刚下过一阵小雨，空气清新了许多，街边的栗子树叶子绿得发亮。电车叮叮当当地驶过自由纪念碑广场——那座象征着拉脱维亚独立的雕像，在经历了不同政权的涂抹和修复后，如今又恢复了它最初的模样，只是底座上多了几道无法磨灭的伤痕。\n今天早上，城里贴满了新的宣传画。画风明快，色彩鲜艳，与过去那些阴沉压抑的德式海报或是呆板僵硬的苏式标语截然不同。一张画上，一个金发女孩和一个黑发男孩手拉手，在阳光下的麦田里奔跑，背景是飘扬的新俄罗斯旗帜和克里姆林宫的尖顶。另一张画上，工人和农民（服装倒是很有本地特色）笑容满面地举着锤子、镰刀和齿轮，标语写着：“你是自由国度的子民！共同建设繁荣家园！”\n电车到站，上来几个刚下班的工人，他们一边抱怨着工厂里的新规定，一边小声议论着那些新海报。“自由？谁的自由？”一个年纪大些的工人低声说，“德国人走了，俄国人又来了，换汤不换药。”\n“可这次不一样吧？”一个年轻些的反驳道，“听说以后能自己选市长了，报纸上也能骂几句官僚了。”\n“听着好听，”老人摇摇头，“等真选了再说吧。自由这东西，可不是贴几张画就能有的。”\n马里斯默默地听着，没有插话。他经历过太多“解放”了。苏联人来了，说解放他们脱离资产阶级。德国人来了，说解放他们脱离布尔什维克。现在，新的俄国人又来了，说他们是“自由国度的子民”。自由到底是什么颜色？是海报上那种鲜艳明快的颜色，还是像他身上这件洗得发白的旧制服一样，灰扑扑的，带着无法言说的疲惫？\n一阵风吹过，几张不知从哪飞来的传单落在电车轨道上。上面印着和海报类似的口号，还有一些关于新公民权利和义务的条款。马里斯看着它们被车轮碾过，变成模糊的纸浆。也许，这一次真的不同？也许，自由不只是一种颜色，而是在经历了一切之后，还能像此刻窗外的栗子树叶一样，努力透出一点点绿色的权利？他不知道，只能像往常一样，拉响发车的铃铛，继续他日复一日的工作。"
 SWRW_RUS.37.a:0 "黎明前的天空，总是最令人迷惑。"
 SWRW_RUS.38.t:0 "关于波罗的海沿岸工业现状的初步评估报告"
 SWRW_RUS.38.d:0 "收件人：波罗的海沿岸临时行政委员会负责同志\n发件人：中央规划局 区域经济发展部 二处 科瓦廖夫\n主题：贵区域工业潜力初步评估及后续工作指示\n同志们，\n\n关于贵区域工业设施的初步评估报告已收悉。经我局初步研究，现将有关精神传达如下：\n\n评估小组的报告指出，该区域具备一定的工业潜力，尤其在港口转运及部分德国人遗留或改造的重工业方面，这与中央的预期基本一致。但也必须清醒地认识到，战损严重、技术落后、劳动力匮乏及标准混乱等问题同样突出，这些都是阻碍该地区融入国家整体经济规划的严重障碍。克服这些障碍是贵委员会当前压倒一切的任务。\n\n中央期望你们能以高度的革命热情和务实的态度，立即着手修复关键基础设施（特别是里加、塔林、克莱佩达港及铁路线），整顿劳动力并上报技能评估数据，统一生产标准，为后续更大规模的投资和建设打下坚实基础。关于具体的投资方向和资源配给，中央将根据你们下一步上报的详细计划和全国的整体需求进行统筹安排。\n\n务必不等不靠，主动作为。后续指示将另行下达。"
 SWRW_RUS.38.a:0 "为了伟大的重建。中央规划局，科瓦廖夫"
 SWRW_RUS.39.t:0 "齿轮与琥珀"
 SWRW_RUS.39.d:0 "曾经的“无线电电子技术”工厂，里加的骄傲，如今变成了一个更加庞大、更加喧嚣、也更加…陌生的怪物。巨大的厂房被扩建，吞并了周围几条小巷和一间倒闭的琥珀加工作坊。高耸的烟囱不知疲倦地喷吐着浓烟，将天空染成工业的灰色。流水线上传送带永不停歇，发出单调而震耳的嗡鸣，空气中弥漫着机油、焊锡和汗水的混合气味。\n\n阿尔迪斯，一位世代制作琥珀饰品的老匠人，现在是这条流水线上的一名装配工。他曾经灵巧的手指，能将一块粗糙的琥珀打磨成晶莹剔透的艺术品，如今却笨拙地将一个个标准化生产的塑料旋钮摁进同样标准化的收音机外壳里。动作重复、机械，仿佛他自己也成了机器的一部分。\n\n“快点，阿尔迪斯！别像个娘们儿似的摸来摸去！”班组长吼道，他是个膀大腰圆的俄罗斯人，说话带着浓重的口音。“这批货下午就要发往沃罗涅日！完不成指标，大家都没奖金！”\n\n阿尔迪斯叹了口气，加快了手上的动作。他并不怀念过去，德国人的统治下，他的小作坊早就关门了，能活下来就不错了。现在至少有工作，有定量的黑面包和偶尔的鱼干。可他看着流水线上那些千篇一律的收音机外壳，总觉得少了点什么。那些他曾经用心雕琢的琥珀，每一块都有独一无二的纹路和光泽，就像人的灵魂。而现在，一切都被标准化、集中化了，为了效率，为了那个宏伟的“计划”。\n\n午休时，他偷偷从口袋里摸出一小块没上交的琥珀原石，用指尖细细摩挲着它温润的表面。阳光透过布满油污的窗户照进来，在那块小小的琥珀里，似乎还闪耀着一丝属于旧时光的金色光芒。"
 SWRW_RUS.39.a:0 "一个齿轮或许能转动世界，却无法打磨灵魂的光泽。"
 SWRW_RUS.40.t:0 "海图上的红线"
 SWRW_RUS.40.d:0 "“胜利号”在离岸十五海里的地方抛下了锚。斯捷潘船长吐掉嘴里的烟蒂，眯着眼看向海平面。今天的天气不错，海鸥在头顶盘旋，预示着可能有鱼群。但他的眉头却紧锁着。\n“爸，我们不能再往西边去了，”大儿子德米特里指着一张崭新的、印着红色虚线的海图说，“你看，这里就是新划定的‘第三渔业区’边界，再过去就是第二区了，我们没那里的许可。”\n斯捷潘哼了一声，没说话。他在这片海域捕了一辈子鱼，什么时候需要别人用红线告诉他哪里有鱼，哪里没鱼？鱼群又不会看地图！可现在，一切都变了。新的规定，新的区域划分，还有那些开着崭新巡逻艇、穿着笔挺制服、拿着本子不停记录的检查员。他们说这是为了“科学管理”、“可持续发展”，为了“国家利益”。\n“可老约纳斯昨天说，第二区那边鱼多得像下雨！”小儿子瓦洛佳插嘴道，“他们昨天拖上来满满一网！”\n“闭嘴，瓦洛佳！”德米特里瞪了他一眼，“你想让检查员把我们的船扣了吗？上次老安德斯的船越界一点点，就被罚了一大笔钱！”\n斯捷潘叹了口气，拿起望远镜，徒劳地扫视着灰色的海面。海还是那片海，几十年如一日地翻涌着，无情又慷慨。只是现在，海面上多了许多看不见的线，和看得见的、来回穿梭的灰色巡逻艇。他不知道这些红线和表格能不能让渔获变多，但他知道，自由少了。他挥了挥手：“起网吧。看看今天的运气怎么样。”渔网被缓缓绞起，里面只有零星的几条小鱼和一堆黏糊糊的海草。"
 SWRW_RUS.40.a:0 "大海依旧沉默，只是岸上的规矩多了。"
 SWRW_RUS.41.t:0 "食堂里的叹息"
 SWRW_RUS.41.d:0 "周四，又是“每周鱼日”。塔林第十二纺织厂的公共食堂里弥漫着一股浓郁的、难以名状的鱼腥味，混合着煮土豆的寡淡气息。食堂大师傅伊莲娜正用一个巨大的勺子，有气无力地搅动着锅里那浑浊粘稠、漂浮着几块可疑白色鱼肉和灰色土豆块的“鱼汤”。\n\n“伊莲娜大婶，今天的鱼汤能不能…呃…多放点盐？”一个年轻的女工端着餐盘，小心翼翼地问。\n伊莲娜抬起布满油污和汗水的脸，露出一丝苦笑：“傻丫头，盐也要按计划分配的！再说了，放再多盐，这鱼该什么味还是什么味。”她指的是仓库里堆积如山的冷冻鳕鱼块——据说都是“北方渔业区同志们超额完成任务的成果”。新鲜倒是新鲜，就是那股子海腥味，怎么煮都去不掉。\n\n墙上贴着宣传画，画上一个笑容可掬的厨师（穿着比伊莲娜干净一百倍的厨师服）端着一盘看起来金黄酥脆、点缀着柠檬片的炸鱼，旁边的标语写着：“鱼肉营养丰富，助力国家建设！”工人们排着长队，默默地打着那份看起来和宣传画毫无关系的鱼汤和黑面包。有人面无表情，有人皱着眉头，还有人试图用黑面包把鱼块挡住，只喝点寡淡的汤。\n\n“想当年啊，”坐在角落里的一个老工人一边吹着滚烫的鱼汤，一边对同伴低声说，“战争刚结束那会儿，能有口吃的就不错了。现在至少每周能吃上‘肉’了，虽然是鱼肉…”他顿了顿，用勺子戳了戳碗里那块煮得稀烂的鱼，“就是不知道，这鱼到底是来自波罗的海，还是哪个计划委员会的脑袋里。”引来同伴一阵压抑的低笑。伊莲娜听到了，只是摇摇头，继续搅动着那一大锅承载着国家计划和工人胃酸的鱼汤。"
 SWRW_RUS.41.a:0 "计划填饱了肚子，却喂不饱口味。"
 SWRW_RUS.42.t:0 "海边的疗养院"
 SWRW_RUS.42.d:0 "尤尔马拉的海滩，沙子细腻，松林青翠，海风带着一丝凉意。来自梁赞州的模范拖拉机手瓦连京，正穿着崭新的、不太合身的沙滩裤，有些拘谨地站在海边。这是他第一次看到大海，也是他第一次获得单位奖励的“波罗的海滨疗养院十日游”。宣传册上说，这里是“劳动者的天堂，身心放松的港湾”。\n\n疗养院本身是一栋气派的、带有苏式新古典主义风格的大楼，据说以前是德国高级军官的度假别墅。房间干净整洁，伙食也比工厂食堂好得多。每天上午有安排好的体操和“健康讲座”，下午可以在海边散步，或者参加集体组织的排球赛。一切都井井有条，充满了“有组织的关怀”。\n\n只是…瓦连京总觉得有点不对劲。海滩上除了他们这些来自各地的“先进工作者”和他们的家属，几乎看不到本地人。偶尔有几个拉脱维亚小孩在远处玩耍，看到他们这群穿着统一疗养院服装的“游客”，眼神里总是带着点好奇和疏远。商店里的商品种类不多，价格却不便宜，售货员的态度也算不上热情。疗养院的墙壁上，还能看到一些被匆忙粉刷覆盖的德语标语的痕迹。\n\n晚上，他和同房间的、来自库尔斯克的矿工伊万一起喝着自带的伏特加。“老伊万，”瓦连京望着窗外黑黢黢的大海说，“你说这地方真像宣传画上那么好吗？我总觉得…有点冷清。”\n\n伊万打了个酒嗝，吐出一口烟圈：“好不好，不都是国家给的福利嘛？免费吃住，还能看海，比在矿井底下强多了。至于冷清…哼，德国佬刚走没几年，能恢复成这样就不错了。等过几年，等我们把这里彻底建设好了，那才叫真正的天堂呢！”他用力拍了拍瓦连京的肩膀，“别想那么多，来，喝酒！为了健康！为了祖国！”\n\n瓦连京举起杯子，和伊万碰了一下。也许伊万说得对，他应该享受这难得的假期，而不是胡思乱想。可望着窗外那片在月光下泛着银光的、寂静而辽阔的波罗的海，他还是忍不住想，这片海，在那些本地人的记忆里，又是什么样子的呢？"
 SWRW_RUS.42.a:0 "沙滩上的脚印，深浅不一。"
 SWRW_RUS.43.t:0 "黑猫咖啡馆的阴影"
 SWRW_RUS.43.d:0 "里加老城的石板路被修葺一新，路边的中世纪建筑也精心修复了外墙，挂上了簇新的俄语和拉脱维亚语双语路牌。新开的“黑猫咖啡馆”里，柔和的灯光下，几个年轻人正低声交谈，空气中飘散着咖啡香和淡淡的烟草味。墙上挂着几幅现代派的画作（经过了文化部门的审核），角落里的留声机正播放着一首旋律优美的苏联轻音乐。一切看起来都那么平静、有序，充满了新生活的希望。\n\n叶莲娜，一位在里加大学学习历史的新生，正和她的同学安德里斯坐在靠窗的位置。叶莲娜是从莫斯科来的，对这座充满异国情调的古城充满了好奇。安德里斯则是本地人，他的祖父曾是这座城市有名的律师。\n\n“真不敢相信，变化这么快，”叶莲娜搅动着杯子里的咖啡，感叹道，“我来之前看照片，这里还到处是断壁残垣呢。”\n\n“是啊，他们干得很快。”安德里斯的声音很轻，目光掠过窗外那座修得“过于”完美的行会大楼，“就像变魔术一样，把旧的伤疤都盖住了。”\n\n“不好吗？”叶莲娜不解地问，“告别过去，迎接未来，这才是我们应该做的。”\n\n安德里斯沉默了一下，端起咖啡杯抿了一口。“也许吧。只是有时候，我觉得他们盖住的不仅仅是伤疤。”他压低了声音，“你知道吗？这家咖啡馆以前就是德国安全局的一个据点。据说地下室里…发生过很多不好的事情。”他指了指墙角一个不起眼的通风口，“我祖父的朋友，一个诗人，就是从这里被带走，再也没回来。”\n\n叶莲娜顺着他指的方向看去，只看到光滑的墙壁和一幅色彩明快的风景画。那首轻快的苏联乐曲还在不知疲倦地循环播放着。她突然觉得咖啡有点变味了。这座焕然一新的城市，像一个精心打扮过的美人，美丽却带着一丝不易察觉的冰冷。那些被抹去的历史，被掩盖的记忆，是否真的消失了？还是像地下室的阴影一样，依然潜伏在这光鲜亮丽的表面之下？"
 SWRW_RUS.43.a:0 "新漆之下，旧痕仍在低语。"
 SWRW_RUS.44.t:0 "沙滩上的阳伞"
 SWRW_RUS.44.d:0 "尤尔马拉的沙滩上，零星地撑起了几把崭新的、色彩鲜艳的阳伞，下面坐着些穿着不太习惯的泳衣、皮肤被晒得微红的游客——大多是来自俄罗斯内陆工厂的模范工人和他们的家属，脸上带着新奇和一丝拘谨。海鸥在他们头顶盘旋，发出熟悉而悠长的叫声。\n\n安娜，一位在海滩边摆摊卖自制琥珀手链和贝壳饰品的拉脱维亚老妇人，看着这番景象，默默地整理着她的货品。这些游客和战争时期的德国军官不同，也和苏联早期那些行色匆匆的政委不同。他们笨拙地学着享受阳光和海风，小心翼翼地把卢布换成她摊子上那些算不上精致的纪念品，还会用蹩脚的拉脱维亚语道谢。\n\n旁边新开的国营咖啡馆里飘来咖啡的香味，几个穿着统一制服的服务员正在擦拭玻璃窗。远处，传来叮叮当当的施工声，据说是在修建一座更大的、能接待外国友人的疗养中心。\n\n“一切都在变好，不是吗？”邻摊卖熏鱼的大叔用拉脱维亚语低声对安娜说。安娜点了点头，看着一个俄罗斯小女孩兴奋地捡起一枚贝壳，又看了看远处灰蓝色的波罗的海。是啊，至少沙滩上有了阳伞，有了游客的笑声，而不是铁丝网和巡逻兵的靴印。这就够了，暂时够了。"
 SWRW_RUS.44.a:0 "阳光下，总有些东西在悄悄生长。"
 SWRW_RUS.45.t:0 "水兵的梦想"
 SWRW_RUS.45.d:0 "港口像一个被唤醒的巨人，充满了钢铁的撞击声、机器的轰鸣声和水兵们嘹亮的号子声。十六岁的米哈伊尔，刚从内陆的村庄来到这座位于塔林的庞大基地报到，眼睛瞪得像茶碟一样大。他从没见过这么多船——虽然大部分看起来都锈迹斑斑，有的还在船坞里被敲敲打打，像是等待接受某种神秘手术的病人。但他还看到了几艘崭新的、灰色涂装的巡逻艇正在港内穿梭，还有远处正在搭建的、据说能造出潜艇的巨大龙门吊。\n\n“小子，新来的？”一个正在擦拭甲板炮的老水兵看他一脸愣头青的样子，咧嘴笑了，露出一口被烟草熏黄的牙，“别傻站着，去找你的政委报到，晚了小心屁股开花！”\n\n“是！同志！”米哈伊尔激动地敬了个不太标准的礼，“我…我是来当海军的！我要上最大的船！保卫我们的海岸线！”\n\n老水兵脸上的笑容淡了些，他拍了拍米哈伊尔瘦弱的肩膀：“好小子，有志气。不过海军可不是光站在甲板上看风景。先学会怎么把这该死的铜炮擦得能照出你脸上的傻气再说吧。”他指了指旁边堆积如山的马铃薯，“或者先去厨房帮厨，今天的晚饭还指望你呢。”\n\n米哈伊尔一点也不气馁。能穿上这身蓝白相间的海魂衫，能闻到这充满海盐和机油味道的空气，能看到这些代表着国家力量的钢铁巨舰，他就已经心满意足了。他想象着自己站在威武的战舰上，乘风破浪，将任何敢于侵犯的敌人送入海底。对，这就是他的梦想！就算是从削土豆开始，他也要扬帆起航！"
 SWRW_RUS.45.a:0 "大海正在呼唤，以钢铁和汽笛的名义。"
 SWRW_RUS.46.t:0 "公园长椅上的对话"
 SWRW_RUS.46.d:0 "傍晚的霞光给里加自由广场旁的公园镀上了一层温暖的金色。两个身影，一男一女，都已不再年轻，并排坐在长椅上，沉默地看着远处孩子们在喷泉边追逐嬉戏，发出银铃般的笑声。新的路灯已经亮起，照亮了刚刚铺好的石子路和修剪整齐的花坛。远处传来电车驶过的叮当声，和隐约的、来自某个窗口的收音机音乐。\n\n“变化真大，不是吗？”他先开口，声音有些沙哑，像许久未用的旧风箱。“还记得这里以前的样子吗？宵禁，巡逻队，还有…”他顿了顿，没有说下去。\n\n“记得，”她轻轻地说，目光投向广场中央那座高耸的自由纪念碑，碑身上依稀可见修补过的痕迹。“那时候，天总是灰蒙蒙的，连孩子都不敢大声笑。”她拉了拉身上的围巾，尽管天气并不算冷，“现在好了，你看那些孩子，跑得多欢。”\n\n“是啊，至少饿不着了。商店里的东西也多了些，虽然还是要排队。”他从口袋里掏出烟盒，犹豫了一下，又放了回去。“听说下个月又要涨工资了，给工程师和技术员。”\n\n“嗯，”她应了一声，“我儿子就在那个新工厂上班，说是很忙，但待遇还不错。”\n\n两人又陷入了沉默，只有孩子们的笑闹声和远处城市的喧嚣在空气中流动。风吹过，带来一丝初秋的凉意。\n\n“你说…阿列克谢要是能看到现在这样，会怎么想？”他突然问，声音低沉了许多。\n\n她的身体几不可察地颤抖了一下，望着远方的眼神变得有些迷蒙。“他…他总是说，总有一天会好的。总有一天，我们能在广场上自由地唱歌，不用害怕隔墙有耳。”她的眼角有些湿润，却强忍着没有让泪水流下来，“他等了一辈子…”\n\n他也沉默了，从口袋里又掏出烟盒，这次点上了一支，深深地吸了一口，吐出的烟雾在金色的暮光中缓缓消散。孩子们依旧在笑闹，电车依旧在叮当，生活似乎真的在朝着一个更好的方向流动，带着一种近乎迟钝的韧性。\n\n他看着身边这位既熟悉又有些陌生的同伴，几十年的风霜在他们脸上刻下了相似的印记，也隔开了太多无从谈起的往事。\n\n“对了，”他忽然开口，带着一丝茫然，“我们…以前认识吗？你是谁来着？”\n\n她转过头，泪水终于无声地滑落，脸上却带着一种释然的、包含着无尽沧桑的微笑。"
 SWRW_RUS.46.a:0 "一个名字，还有活下去的我们。"
 SWRW_RUS.47.t:0 "白俄罗斯重建委员会工作指示"
 SWRW_RUS.47.d:0 "收件人： 白俄罗斯临时重建委员会 主任同志\n\n发件人： 中央规划局 重建指导办公室 四科 别洛夫\n\n主题： 关于启动白俄罗斯地区第一阶段重建工作的初步指示\n\n主任同志，\n兹就白俄罗斯地区的重建工作下达初步指示。中央对贵委员会寄予厚望，期望你们能迅速扭转该地区因长期遭受法西斯匪帮及其傀儡政权蹂躏而造成的困难局面。\n\n当前首要任务是：一、全面评估并上报基础设施损毁情况，特别是明斯克、戈梅利等重点城市的交通、能源及通讯网络；二、清查和登记残存工业设施及农业资源，摸清底数，为后续规划提供依据；三、立即着手恢复关键性民生保障，稳定社会秩序，特别是粮食供应与基本医疗；四、配合安全部门，坚决肃清残余敌对分子和破坏活动。\n\n中央深知任务艰巨，资源有限，但白俄罗斯人民在卫国战争中展现出的英雄气概和坚韧不拔的精神，是我们克服一切困难的宝贵财富。必须充分发动群众，依靠群众，将有限的资源用在刀刃上。初步的援助物资（包括建筑材料、种子、医疗用品）将于下月起陆续调拨。\n\n请贵委员会尽快提交详细的现状报告及第一阶段（未来六个月）的工作计划草案。后续支持将视具体情况及全国一盘棋的统筹进行安排。切记，效率与稳定并重。"
 SWRW_RUS.47.a:0 "中央规划局，谢尔盖·别洛夫"
 SWRW_RUS.48.t:0 "牛棚里的新生命"
 SWRW_RUS.48.d:0 "清晨的薄雾尚未散尽，布列斯特郊外的“红星”集体农庄已经苏醒。玛莎，农庄的兽医助理，正小心翼翼地给一头刚出生没几天的小牛犊检查身体。这头花白相间的小家伙是农庄近几个月来迎来的第十二个新生命，也是玛莎亲手接生的第五个。\n\n牛棚还是那个老牛棚，德国人占领时征用过，墙角还残留着一些模糊的德语涂鸦。棚顶漏着风，地上铺的干草也不够厚实。但至少，牛少了，空间显得宽敞了些。而且，角落里堆放着几袋印着陌生西里尔字母的饲料——据说是上面调拨来的“高蛋白营养补充剂”，虽然牛一开始不太爱吃，但吃了之后奶水确实多了些。\n\n“看看你，小家伙，壮实得很嘛！”玛莎轻轻拍了拍牛犊的背，小牛亲昵地蹭了蹭她的手。“等你长大了，就能帮我们多产奶，多耕地了。”她的语气里充满了希望，就像看着自己的孩子。\n\n农庄主席老伊万跛着一条腿走过来，手里拿着一个缺了口的搪瓷缸。“玛莎同志，休息一下，喝口热茶。”他递过缸子，看着那群围着母牛打转的小牛犊，脸上露出了难得的笑容，“好兆头啊，这些小家伙一来，感觉整个农庄都有生气了。”\n\n“是啊，主席同志，”玛莎接过茶缸，暖意驱散了些许寒气，“就是母牛的奶水还是不太够，要是能再多点好饲料，或者…或者能引进几头高产的种牛就好了。”\n\n“会有的，玛莎同志，都会有的。”老伊万望着东方，那里是太阳升起的方向，也是明斯克和莫斯科的方向。“一切都在慢慢好起来。我们失去了太多，但只要这些小家伙还能出生，还能长大，这日子就有盼头。”"
 SWRW_RUS.48.a:0 "每一声哞叫，都回荡着土地的渴望。"
 SWRW_RUS.49.t:0 "玻璃柜里的勋章"
 SWRW_RUS.49.d:0 "明斯克市中心，一座经过修复、外墙依然带着些许战争创伤的建筑，重新挂上了“白俄罗斯历史博物馆”的牌子。伊琳娜，一位年轻的历史系毕业生，现在是馆里的一名讲解员，正带领着一小群前来参观的学生。\n\n展厅宽敞明亮，打扫得一尘不染。但展品却显得有些…单薄。许多玻璃柜里空空如也，或者只放着一些照片和文件的复制品。战争和掠夺带走了太多东西。伊琳娜重点讲解的是“伟大的卫国战争与白俄罗斯人民的抵抗”展区。这里陈列着锈迹斑斑的步枪、烧焦的军装、游击队员用过的简陋电台，还有几枚在战火中幸存下来的红星勋章。\n\n“同学们请看，”伊琳娜指着一枚放在丝绒垫上的“卫国战争游击队员”奖章，声音清澈而带着一丝刻意压抑的情感，“这枚奖章属于一位名叫瓦西里的英雄。他和他的战友们在德寇占领期间，在最艰苦的条件下坚持斗争，破坏敌人的交通线，保护我们的同胞。白俄罗斯的每一片森林，都曾是他们抵抗的堡垒。”\n\n一个前排的小男孩举起手：“老师，那德国人为什么那么坏？”\n\n伊琳娜顿了一下，斟酌着用词：“因为…他们被一种邪恶的思想，叫做‘法西斯主义’所蒙蔽。他们认为自己是优等民族，可以随意欺压和奴役其他民族。但历史证明，正义终将战胜邪恶。我们伟大的祖国和英勇的人民，最终粉碎了法西斯匪帮。”\n\n讲解词是统一发放的，强调的是抵抗、牺牲、最终的胜利以及如今在统一旗帜下的新生。关于战争的残酷细节、关于合作者的复杂动机、关于不同时期政策的摇摆…这些都被小心地略过或简化了。历史，就像这座博物馆本身，总是在选择性地展示着它愿意被看到的部分。\n\n参观结束时，伊琳娜看到一位白发苍苍的老人独自站在瓦西里奖章的展柜前，久久不语，肩膀微微颤抖。她没有上前打扰。有些记忆，博物馆的玻璃柜是无法完全封存的。"
 SWRW_RUS.49.a:0 "历史被擦拭干净，但触摸时仍感粗糙。"
 SWRW_RUS.50.t:0 "“红星”种猪抵达农庄"
 SWRW_RUS.50.d:0 "戈梅利郊外的国营养猪场迎来了大日子。几辆崭新的嘎斯卡车小心翼翼地驶入场区，停在新建的、刷着白石灰的猪舍前。车厢门打开，在一片兴奋的议论声和猪的哼哼唧唧声中，一群看起来膘肥体壮、毛色油亮的“大白猪”被赶了下来。\n\n“同志们，看呐！”养猪场场长，一个矮胖但精力充沛的中年人，挥舞着手臂，对着围观的工人和技术员们喊道，“这就是从乌克兰兄弟那里引进的‘乌克兰大白猪’优良品种！高产！抗病！生长快！有了它们，我们白俄罗斯的猪肉产量，一定能噌噌往上涨！”\n\n技术员拿着一个本子，仔细地记录着每一头种猪的编号和体征，还不时地用一根小棍子捅捅那些看起来不太精神的家伙。“场长同志，长途运输对它们影响不小，需要尽快隔离观察，补充营养。”\n\n“当然当然！同志，这些宝贝疙瘩就交给你了！”场长拍着胸脯保证，“饲料管够！兽医随叫随到！一定要让它们尽快适应新家，多生崽！争取明年这个时候，我们的猪肉就能摆上明斯克甚至莫斯科人民的餐桌！”\n\n工人们七手八脚地把这些“外来贵宾”赶进干净、宽敞的新猪舍。这些猪舍是按照最新的“科学养殖标准”建造的，和旁边那些低矮潮湿的老猪圈形成了鲜明对比。老饲养员彼得大爷看着那些白白胖胖、哼哼唧唧的新住户，摇了摇头，又点了点头。他养了一辈子本地的黑毛土猪，虽然长得慢，但皮实，啥都吃。这些精贵的“大白猪”，吃得好，住得好，能不能适应白俄罗斯的水土，还真不好说。\n\n不过，看着场长和技术员那充满干劲的样子，看着崭新的猪舍和卡车运来的成袋饲料，彼得大爷心里也升起了一丝希望。也许，这次真能把养猪这事搞出点名堂来？至少，猪多了，肉就多了，日子总该会好过一点吧。"
 SWRW_RUS.50.a:0 "新的哼哼声，预示着餐桌上的改变。"
 SWRW_RUS.51.t:0 "集体农庄的“拖拉机交响乐”"
 SWRW_RUS.51.d:0 "维捷布斯克地区的“黎明”集体农庄正在经历一场变革。农庄的规模被扩大了三倍，合并了附近几个零散的小农场。一眼望不到头的田野被重新规划，分割成整齐划一的大片耕地。最引人注目的，是那几台崭新的、涂着鲜艳红漆的拖拉机，它们取代了大部分老黄牛和挽马，成了田间地头的主角。\n\n安东，曾经是其中一个小农场的农场主，现在是“黎明”农庄第一拖拉机小队的队长。他坐在高高的驾驶座上，感受着脚下柴油发动机有力的震动，身后翻起的黑土散发出清新的气息。这感觉和他过去赶着老马犁地完全不同——更快，更强，更…有力量。按照计划，他们小队今天负责翻耕五百公顷土地，这在以前是想都不敢想的任务。\n\n“安东队长！”农庄的技术员，一个戴眼镜的年轻人，骑着自行车追上来，手里挥舞着一张表格，“注意保持深度！图纸要求是25厘米！还有，控制好油耗，别超标！”\n\n安东点点头，稍微调整了一下犁铧的深度。集中化管理有好有坏。好处是统一调配资源，效率确实高了，坏处就是规矩多了，干什么都要按表格来，少了过去自家地里那种随心所欲的自在。他旁边的地块上，另一台拖拉机正发出震耳欲聋的轰鸣，驾驶员是个毛头小子，操作明显有些生疏，犁出的沟歪歪扭扭。\n\n远处，一些还没有完全适应集体化生活的老农，正牵着他们舍不得上交的、瘦骨嶙峋的老马，在边边角角的土地上耕作。他们的身影在巨大的拖拉机映衬下，显得渺小而孤独。安东知道他们在想什么，他自己有时候也会怀念过去那种小富即安的日子。但时代变了，零敲碎打的小农经济养不活这么多人，也无法支撑国家的重建。只有集中起来，形成规模，才能真正改变命运。\n\n拖拉机在广袤的田野上不知疲倦地前进，发出单调而有力的轰鸣，仿佛一首属于新时代的、粗犷而充满力量的交响乐。"
 SWRW_RUS.51.a:0 "引擎的轰鸣，是告别旧辙的序曲。"
 SWRW_RUS.52.t:0 "牛奶会自动流出来？"
 SWRW_RUS.52.d:0 "“奇迹！简直是奇迹！”农妇卓娅瞪大了眼睛，看着那台嗡嗡作响的银白色机器熟练地套上奶牛乳头，然后透明的管道里就开始汩汩地流淌出洁白的牛奶。“它…它真的能自己挤奶？”\n\n“当然了，卓娅大婶，”旁边穿着白大褂的技术员笑着解释道，“这是最新式的‘黎明’牌电动挤奶机，不仅速度快，还比手工挤奶更卫生，能减少牛乳腺炎的发病率。以后啊，你们就不用天不亮就起来，一个个地用手挤了，省时省力！”\n\n卓娅还是有些难以置信。她和她的姐妹们，祖祖辈辈都是用手挤奶的。那是一个需要技巧和耐心的活计，要感受母牛的情绪，要掌握合适的力道。而现在，这台冰冷的机器，插上电就能自动把奶吸出来？她凑近了看，机器发出有节奏的脉动声，奶牛似乎并没有不适，反而悠闲地嚼着草料。\n\n“有了这个宝贝，我们农场的牛奶产量至少能提高三成！”农场书记在一旁兴奋地说，“而且还能保证质量！以后我们的牛奶说不定能评上‘优质产品’，拿到额外的奖金呢！”\n\n卓娅看着牛奶顺着管道流进巨大的不锈钢收集罐，心里五味杂陈。轻松是轻松了，可她总觉得少了点什么。过去挤奶的时候，她会和奶牛说说话，哼哼歌，感受着它们温热的身体和信任的眼神。现在，人和牛之间，隔了一台嗡嗡作响的机器。现代化是好事，可那些旧日的情感和连接，是不是也会随着手上的老茧一起，慢慢消失呢？"
 SWRW_RUS.52.a:0 "机器带来了效率，也带来了新的距离。"
 SWRW_RUS.53.t:0 "哈丁森林的纪念碑"
 SWRW_RUS.53.d:0 "哈丁森林，这片曾经见证了太多血腥与苦难的土地，如今迎来了一个庄严的时刻。在当年被德寇烧毁的村庄遗址上，一座崭新的纪念碑拔地而起。纪念碑主体是一位怀抱死去孩子的母亲的青铜雕像，基座上镌刻着一行简洁而沉重的文字：“纪念在伟大的卫国战争中牺牲的白俄罗斯人民”。\n\n秋日的阳光透过稀疏的枝叶，洒在前来参加揭幕仪式的人群身上。有白发苍苍的老游击队员，胸前挂满了褪色的勋章；有穿着崭新校服、系着红领巾的孩子们；有来自附近村庄的农民，脸上带着肃穆的神情；还有穿着笔挺制服的政府官员和军人代表。\n\n一位老游击队员，声音颤抖但依然洪亮，走上临时搭建的讲台。“同志们，朋友们，”他环视着人群，目光扫过那片长满青草、却依然能感受到死亡气息的土地，“我们站在这里，是为了铭记。铭记那些被法西斯野兽夺去生命的无辜者，铭记那些为了保卫家园而英勇战斗的烈士。哈丁村的悲剧，只是我们白俄罗斯千千万万个悲剧的缩影。四分之一的人口！我们失去了四分之一的同胞！”他的声音哽咽了，台下传来压抑的啜泣声。\n\n“但是，”他提高了音量，眼中重新燃起火焰，“我们没有屈服！我们的人民在森林里，在沼泽中，在敌人的刺刀下坚持抵抗！我们流尽了鲜血，但我们赢得了最终的胜利！我们把德国侵略者赶出了我们的土地！”\n\n“今天，我们站在这片重生的土地上，向牺牲者致敬。他们的牺牲没有白费！看呐，新的村庄建起来了，工厂的烟囱冒烟了，孩子们又可以安心地学习了！我们正在建设一个强大的、统一的祖国！这是对烈士们最好的告慰！”\n\n红布被缓缓揭开，母亲雕像那悲伤而坚毅的面容展现在众人面前。没有人说话，只有风吹过树林的沙沙声，和远处传来的、象征着新生的拖拉机的轰鸣声。这段历史太过沉重，不能忘记，也无法忘记。但铭记，是为了更好地前行。"
 SWRW_RUS.53.a:0 "逝者安息，生者前行。"
 SWRW_RUS.54.t:0 "别洛韦日的老看守"
 SWRW_RUS.54.d:0 "别洛韦日原始森林的边缘，秋意正浓。护林员尤里·卡尔波维奇，一个皮肤黝黑、寡言少语的老人，正骑着他那匹同样上了年纪的老马，沿着一条只有他自己知道的小路巡逻。他在这里工作了快四十年了，森林里的每一棵树，每一道沟壑，他都了如指掌。他见过沙俄时期的贵族狩猎队，见过两次世界大战的烽火，见过德国人在这里设立禁区，也见过战后游击队和清剿部队在这片林莽中互相追逐。\n\n现在，战争结束了，森林又恢复了它古老的宁静，只有偶尔响起的斧头声和远处传来的游客喧闹声。这片巨大的森林被宣布为“国家级自然保护区”，卡尔波维奇的工作也从防止偷猎和火灾，扩展到了引导游客和阻止他们乱扔垃圾。\n\n今天早上，他在森林深处发现了一串巨大的脚印和新鲜的粪便——是欧洲野牛！这群森林的王者，在战争中几乎被猎杀殆尽，现在，它们的数量正在缓慢地恢复。卡尔波维奇小心翼翼地记录下位置和数量，心里涌起一阵满足感。这片森林是他一生的守护，看到它重新焕发生机，比什么都让他高兴。\n\n然而，烦恼也随之而来。昨天，他抓到两个来自明斯克的“游客”，他们居然想在森林里用猎枪打野猪！卡尔波维奇费了好大的劲才把他们扭送到管理处。还有那些乱扔瓶子和罐头的城里人，他们根本不明白这片森林的脆弱。\n\n“保护自然…说得好听，”卡尔波维奇对着他的老马嘟囔着，老马甩了甩尾巴，表示赞同，“可人心要是坏了，再好的保护区也没用。”他叹了口气，继续他的巡逻。森林很大，很安静，它见证了太多人类的愚蠢和贪婪，也见证了顽强的生命力。也许，保护这片森林，也是在守护某种更重要的东西吧。"
 SWRW_RUS.54.a:0 "森林无言，它看过太多兴亡更替。"
 SWRW_RUS.55.t:0 "地下的“盐”"
 SWRW_RUS.55.d:0 "索利戈尔斯克矿区的景象与白俄罗斯其他地方的田园风光截然不同。巨大的提升井架高耸入云，传送带像钢铁巨蟒一样蜿蜒，将深褐色的矿石源源不断地运往选矿厂。空气中弥漫着一股淡淡的咸味和化学品的气息。这里是钾盐矿，白俄罗斯“地下的财富”之一。\n\n瓦季姆，一名年轻的矿工，刚刚结束了他的早班。他脱下沾满矿尘的工作服，洗去脸上的污垢，露出一张疲惫但还算年轻的脸。他在淋浴间和工友们互相开着玩笑，抱怨着井下的闷热和噪音，也憧憬着发工资后去镇上新开的电影院看一场电影。\n\n“听说了吗？下个月产量指标又要提高了！”一个工友一边擦着身子一边说，“说是莫斯科那边要建新的化肥厂，急等着用咱们的钾盐呢！”\n\n“提高就提高呗，”另一个满不在乎地说，“多干活多拿钱，总比以前德国佬占着的时候强。那时候干得再多，也只能混个半饱。”\n\n瓦季姆没说话。他记得小时候，父亲就在这个矿区工作。那时条件更差，安全事故频发。父亲总说，他们是在用命换取国家的需要。现在，条件确实改善了不少，有了新的通风设备，安全规程也严格了许多。矿区还建了新的工人宿舍和俱乐部。可瓦季姆总觉得，他们依然是在用自己的汗水甚至健康，去换取那些遥远地方的需要。\n\n走出矿区大门，阳光有些刺眼。他看到几辆满载着钾肥的火车正缓缓驶离，开往未知的远方。这些从白俄罗斯地下深处挖出来的“盐”，将滋养俄罗斯广袤的田野，变成面包，变成土豆，变成支撑整个国家重建的基石。这或许就是他工作的意义吧？瓦季姆揉了揉酸痛的肩膀，朝着镇子的方向走去。今晚，他想去看那场据说很精彩的新电影。"
 SWRW_RUS.55.a:0 "地下的宝藏，滋养着地上的希望。"
 SWRW_RUS.56.t:0 "眺望彼岸"
 SWRW_RUS.56.d:0 "列兵季莫费·伊万诺夫，来自奔萨州的农家小子，正站在新修的边境瞭望塔上，寒风穿透他那件勉强合身的厚呢大衣。这是他在白俄罗斯的第三个月，也是他第一次被派到这个紧邻着“那一边”的哨所。铁丝网在下面蜿蜒伸展，崭新而刺眼，更远处是雷区和刚刚挖好的反坦克壕。\n\n夜幕已经降临，他这边的土地上，只有零星的军营灯火和远处村庄昏黄的光点。而向西望去，隔着那条寂静的河流，对岸却能看到连绵的灯光，甚至能隐约听到卡车引擎的轰鸣——那是德国人控制的地方，曾经也是他们祖国的一部分。\n\n“看到什么了吗，小子？”哨塔下的老兵瓦西里，一边裹紧烟卷一边问。他在这里待的时间比季莫费的兵龄还长，据说经历过最惨烈的撤退。\n\n“没什么，瓦西里大叔，就是…对面的灯挺亮的。”季莫费有些紧张地回答。\n\n“亮？哼，德国佬的灯泡也许是好点，但他们的日子可不一定舒坦。”瓦西里吐出一口浓烟，“别被灯光骗了，小子。那边的人跟我们一样，也盼着天亮呢。”他顿了顿，声音低沉了些，“我们守在这里，就是为了确保有一天，我们的灯光也能照亮那边，而不是让他们的黑暗吞噬我们。”\n\n季莫费握紧了手中的步枪，冰冷的钢铁让他感到一丝安心。他不再去看对岸的灯火，而是仔细地观察着眼前这片属于他们的、正在慢慢苏醒的土地。风中似乎传来远处拖拉机夜晚耕作的微弱声响，那是属于他们的声音。"
 SWRW_RUS.56.a:0 "界河无声，流淌着等待与警惕。"
 SWRW_RUS.57.t:0 "白桦林中的弹坑"
 SWRW_RUS.57.d:0 "春天的气息终于降临在白俄罗斯的原野上，融化的雪水汇成溪流，在草地上蜿蜒。阳光透过新发的白桦树叶，洒下斑驳的光影。阿廖娜，一位在明斯克郊区集体农庄工作的年轻姑娘，正提着篮子，在林地边缘采摘着第一批鲜嫩的野蘑菇。空气中弥漫着泥土和青草的芬芳。\n\n这片白桦林美得像一首诗，宁静而充满生机。阿廖娜从小就在这里玩耍，熟悉这里的每一棵树，每一丛浆果。可她也知道，这片宁静之下，埋藏着多少伤痛。不远处，一个巨大的、长满青苔的弹坑像一道丑陋的疤痕，破坏了这片风景的和谐。战争时期，这里曾发生过激烈的战斗，德国人的坦克和苏联红军的炮火曾将这片林地反复蹂躏。\n\n她弯下腰，小心翼翼地拨开落叶，几颗圆滚滚的白蘑菇露了出来。就在这时，她听到远处传来一阵低沉的轰鸣声，不是雷声，而是…机器的声音。几辆涂着绿色油漆的军用卡车，拉着沉重的机械设备，正沿着新修的土路缓缓驶过林边，留下两道深深的车辙。\n\n阿廖娜站起身，看着卡车消失在林子的另一头。她知道，那些机器是运往西部边境的，去修建新的防御工事。为了不再让战争的铁蹄踏碎这片美丽的土地，人们正在用钢铁和混凝土筑起新的屏障。这让她感到安心，但也有一丝莫名的失落。这片美丽的白桦林，它承载了太多，既有自然的恩赐，也有战争的创伤，现在又增添了备战的印记。"
 SWRW_RUS.57.a:0 "绿意盎然，也掩不住土地的记忆。"
 SWRW_RUS.58.t:0 "混凝土与马合烟"
 SWRW_RUS.58.d:0 "“嘿！安德烈！别他妈愣着，把那袋水泥给我递过来！对，就是你屁股底下那袋！”\n\n工头斯拉瓦的吼声在震耳欲聋的搅拌机噪音中依然清晰可辨。安德烈，一个刚从梁赞技校毕业的小伙子，慌忙把那袋沉重的水泥扛起来，踉踉跄跄地递给正在浇筑地堡顶棚的工人。汗水浸湿了他的衬衫，混凝土粉末粘在他的脸上，让他看起来像个刚从面粉袋里钻出来的幽灵。\n\n这里是白俄罗斯西部边境某处绝密的国防工程地点。放眼望去，是连绵起伏的丘陵和刚刚挖开的巨大土方工程。成百上千的工人、士兵和工程师像蚂蚁一样忙碌着，浇筑混凝土、捆扎钢筋、铺设电缆。按照墙上贴着的巨大规划图，这里将建成一个庞大的地下要塞群，配备最新的火炮、导弹发射井和指挥中心，号称能抵挡住“任何规模的地面进攻”。\n\n午休时，安德烈和几个工友坐在刚浇筑好的混凝土掩体上，分着吃黑面包和咸鱼干。“真他妈累，”一个胳膊上纹着坦克的壮汉抱怨道，“这鬼地方连个娘们儿都看不到，晚上除了喝酒就是打牌。”\n\n“少废话，米沙，”另一个年纪稍长的工人，一边卷着马合烟一边说，“能在这里干活就不错了。听说这是国家最重要的工程，直接关系到能不能挡住德国佬。咱们现在多流点汗，以后就能少流点血。”\n\n安德烈默默地啃着面包。他学的是桥梁工程，本以为毕业后会去修复第聂伯河上的大桥，没想到却被分配到这个鸟不拉屎的地方挖地洞。每天面对的是冰冷的混凝土和震耳欲聋的噪音，还有工头斯拉瓦永不停歇的叫骂。但他心里也明白，那位老工人说得对。他亲眼见过战争留下的废墟，听过长辈们讲述被占领时的屈辱和恐惧。如果这些混凝土真的能阻止那一切重演，那么再苦再累，也是值得的。\n\n他抬起头，看到远处地平线上，一座新的导弹发射井的轮廓正在夕阳下缓缓成形，像一根指向西方的、沉默而坚定的手指。"
 SWRW_RUS.58.a:0 " 一锹土，一块砖，筑起的是墙，也是决心。"
 SWRW_RUS.59.t:0 "真理报：警钟长鸣"
 SWRW_RUS.59.d:0 "标题：以钢铁意志，筑国家屏障——纪念卫国战争的惨痛教训\n\n\n\n昨夜西风，拂过明斯克的街巷，带来的不再是刺骨寒意，而是重建家园的暖流。工厂的烟囱重新挺立，田野的拖拉机发出欢唱，孩子们的课堂书声琅琅。胜利的旗帜在共和国上空飘扬，和平的曙光似乎已普照这片饱经创伤的土地。\n\n然而，同志们，朋友们！我们决不能沉溺于眼前的安宁，忘记那刻骨铭心的伤痛！我们决不能忘记，就在并不遥远的过去，法西斯的铁蹄曾如何践踏我们的家园，野蛮的火焰曾如何吞噬我们的城市与村庄！我们决不能忘记，白俄罗斯，这片英雄的土地，曾付出何等惨烈的代价——四分之一的人口牺牲！每一寸土地都浸透了烈士的鲜血和无辜者的眼泪！\n\n四十载暴政，四十载屈辱！历史的教训如同警钟，必须在我们每一个人的心中长鸣！“前事不忘，后事之师。”我们曾因准备不足而付出血的代价，我们曾因敌人凶残而家破人亡。这样的悲剧，绝不允许重演！\n\n是的，我们取得了伟大的胜利，将侵略者赶出了国门。但是，西方的威胁并未消除，帝国主义的野心依然存在。他们或许暂时蛰伏，但觊觎我们土地、妄图颠覆我们事业的狼子野心从未改变！\n\n因此，我们必须以百倍的警惕，千倍的努力，将我们的西部边疆，将我们英雄的白俄罗斯，打造成一座坚不可摧的钢铁屏障！我们要用最先进的武器武装我们的军队，用最坚固的工事守卫我们的国门！我们要让每一个士兵都成为警惕的哨兵，让每一寸土地都成为侵略者无法逾越的坟墓！\n\n“决不能再被入侵！”这不仅仅是一句口号，这是我们对牺牲烈士的庄严承诺，是对子孙后代的历史责任，是用鲜血和生命换来的钢铁誓言！让警钟长鸣，让意志如钢，为了祖国的永固，为了和平的长存，为了我们自由幸福的生活，时刻准备着！"
 SWRW_RUS.59.a:0 "白俄罗斯，立于前线，永不后退。"
 SWRW_RUS.60.t:0 "最后的土豆"
 SWRW_RUS.60.d:0 "柳芭看着饭桌上那盘孤零零的煮土豆，又看了看围坐在一旁的三个孩子——他们正眼巴巴地望着那仅有的一点食物，小脸上写满了渴望。丈夫阿列克谢，那个曾经壮得像头熊一样的拖拉机手，如今也瘦了一圈，沉默地抽着烟。\n\n这个冬天格外难熬。去年收成还算不错，可大部分粮食都被“支援前线建设”的名义征收走了。镇上的工厂也一样，原本生产农具和日用品的车间，现在都改成了生产军用零件，机器日夜轰鸣，可工人的口粮却越来越少。\n\n“妈妈，我还想吃一点…”最小的儿子萨沙小声说。\n\n柳芭心疼地摸了摸他的头，把盘子里最大的一块土豆夹到他碗里。“吃吧，萨沙，多吃点长高高。”她自己却一点胃口都没有。\n\n隔壁家的儿子，才十七岁，上个月也被征召入伍了，送去了西部边境。那孩子的母亲哭了好几天。谁都知道，国家在为可能的战争做准备，“先军政策”嘛，报纸上天天都在说。为了国家的安全，为了不再被德国人欺负，牺牲是必要的。道理她都懂，可看着孩子们饿得发黄的小脸，看着丈夫日渐消瘦的肩膀，她的心就像被什么东西揪着一样疼。\n\n晚饭后，阿列克谢默默地拿出工具，修理起那台陪伴他多年的旧拖拉机。“听说春天要组织‘义务劳动’，帮部队修工事，”他低声说，“家里…就靠你了。”\n\n柳芭点了点头，没有说话。她走到窗边，望着窗外被月光照亮的、寂静的村庄。远处似乎传来军营方向隐约的号声。安全是重要的，可生活呢？难道为了所谓的安全，就要把日子过成这样吗？她不知道答案，只知道明天的土豆，可能就更少了。"
 SWRW_RUS.60.a:0 "为了盾牌足够坚固，我们勒紧了裤腰带。"
 SWRW_RUS.61.t:0 "地堡与摇篮曲"
 SWRW_RUS.61.d:0 "明斯克西郊，靠近新国防工事带的地方，夜晚格外寂静，但也格外…压抑。伊琳娜轻轻地摇晃着怀里的婴儿，哼唱着古老的白俄罗斯摇篮曲。她的丈夫彼得，一名工程师，就在附近那个巨大的、代号“熊穴”的地下指挥中心工作，已经快一个月没回家了。\n\n窗外，可以看到远处丘陵上伪装网下隐约的混凝土轮廓，还有夜空中偶尔划过的探照灯光柱。白天，这里常常能听到工程机械的轰鸣和士兵操练的口令声。他们说，这里是国家最坚固的盾牌，是为了保护像她和孩子这样的普通人。\n\n伊琳娜知道彼得的工作很重要，也很辛苦。但他每次回来，都显得更加沉默和疲惫，眼神里带着一种她看不懂的焦虑。他说里面戒备森严，与世隔绝，像生活在一个巨大的钢铁罐头里。他说那里很安全，坚不可摧。\n\n可伊琳娜并不觉得有多安全。生活在这个巨大的“要塞”边缘，总有一种被包围的感觉，不是被敌人，而是被自己建造的冰冷墙壁和无处不在的警惕目光。邻居们说话的声音都低了许多，孩子们被告知不要靠近军事禁区。空气中似乎弥漫着一种无形的紧张感，连摇篮曲的旋律都带上了一丝沉重。\n\n怀里的婴儿终于睡着了，呼吸均匀而平稳。伊琳娜小心翼翼地把他放进摇篮。她走到窗前，望着远处那些在夜色中若隐若现的庞大工事。它们真的能带来安全吗？还是仅仅将恐惧和战争的阴影，更深地焊进了他们的生活？"
 SWRW_RUS.61.a:0 "高墙之内，是安宁，还是囚笼？"
 SWRW_RUS.62.t:0 "老兵的枪"
 SWRW_RUS.62.d:0 "训练场上尘土飞扬，一群穿着崭新军装，脸上稚气未脱的新兵正在进行射击训练。枪声此起彼伏，但脱靶的子弹显然比命中的更多。老教官德米特里·帕夫洛维奇，一个在斯大林格勒失去了一条胳膊的老兵，拄着拐杖，在队伍后面来回踱步，眉头紧锁。\n\n“废物！一群废物！”他终于忍不住咆哮起来，声音沙哑却充满力量，“你们这打的是枪吗？是在给敌人挠痒痒吗？眼睛长到屁股上去了？！”新兵们被吓得一哆嗦，纷纷停止了射击。\n\n“听好了，小子们！”帕夫洛维奇走到射击线前，从一个新兵手里夺过步枪，动作虽然有些笨拙，但眼神锐利如鹰。“你们以为战争是儿戏吗？以为敌人会站着不动让你们瞄准吗？”他深吸一口气，似乎在回忆着什么，“我告诉你们，当年，在41年夏天，德国人的第一枪打响的时候，我们很多人连枪都没摸过！很多人甚至不知道该往哪个方向跑！”\n\n他的声音低沉下来，带着刻骨铭心的痛楚。“我的连队，一百二十个好小伙子，第一天就没了一半！他们甚至没看清敌人长什么样！飞机像蝗虫一样扑下来，坦克像怪物一样碾过来！我们没有准备，我们被打了个措手不及！血流成河啊，小子们！你们知道那是什么滋味吗？”\n\n训练场上一片死寂，只有风吹过空旷场地的声音。新兵们看着这位独臂老兵眼中闪烁的泪光和火焰，仿佛也感受到了那场灾难的窒息感。\n\n“现在，”帕夫洛维奇重新举起步枪，虽然只有一只手，却稳如磐石，“我们有时间准备，有足够的武器，有坚固的工事！我们吸取了教训！我们决不能再让第一枪打响的时候，像没头苍蝇一样！你们手里的每一颗子弹，都可能决定一个战友的生死，决定我们能不能守住身后的家园！都给我听清楚了吗？！”\n\n“是！教官！”新兵们的回答整齐而响亮，带着一种前所未有的决心。帕夫洛维奇点点头，把枪还给那个新兵。“现在，重新装弹！给我瞄准了打！记住，我们不再是当年那支猝不及防的军队了！”"
 SWRW_RUS.62.a:0 "这一次，我们先上膛。"
 SWRW_RUS.63.t:0 "警报演习"
 SWRW_RUS.63.d:0 "下午三点整，尖锐刺耳的防空警报声毫无征兆地响彻了戈梅利市的上空。街道上的人群瞬间停滞了一下，随即开始有条不紊地向最近的地下掩体移动。这不是真正的空袭，只是一次例行的、每周都会进行的警报演习。但即使知道是演习，那熟悉的、令人心悸的声音还是让许多人的心跳漏了一拍。\n\n米哈伊尔，一家国营商店的售货员，熟练地锁好店门，拿起挂在墙上的急救包，快步走向街角的地铁站入口——那里也是指定的公共掩蔽所。他看到邻居安东大爷正搀扶着腿脚不便的老伴，慢慢地走下台阶。几个穿着红领巾的小学生，在老师的带领下，排着整齐的队伍，小脸上虽然有些紧张，但并不慌乱。\n\n地铁站台被临时改造成了掩蔽所，光线昏暗，空气有些沉闷。人们互相靠着，或坐或站，低声交谈着。几个士兵在维持秩序，他们的表情严肃，但并不凶恶。墙上贴着宣传画，上面画着如何识别不同类型的炸弹，以及空袭时应该如何自救。\n\n“又是演习，”米哈伊尔听到旁边有人小声抱怨，“都和平这么多年了，还搞这个干嘛？德国佬还能打过来不成？”\n\n“嘘！小心点！”另一个人立刻制止他，“报纸上说了，帝国主义亡我之心不死！我们必须时刻保持警惕！忘了哈丁的教训了吗？”\n\n米哈伊尔没参与他们的讨论。他只是靠在冰冷的墙壁上，默默地看着这一切。这种“时刻准备着”的状态，已经成为了他们生活的一部分。它体现在每周的警报演习里，体现在孩子们课本上关于爱国主义和国防教育的内容里，体现在街上越来越多的征兵广告里，体现在人们谈论“西部边境”时那下意识压低的嗓音和凝重的眼神里。\n\n和平是真实的，工厂在生产，商店在营业，人们在恋爱、结婚、生子。但战争的阴影也从未真正散去，它像一个潜伏的幽灵，始终笼罩在这片刚刚从废墟上站起来的土地上空。半个小时后，解除警报的短促哨声响起。人们松了口气，陆续走出地铁站，回到阳光下，继续他们未完成的工作和生活。仿佛什么都没有发生，又仿佛有什么东西，已经悄然刻进了每个人的骨子里。"
 SWRW_RUS.63.a:0 "弦一直紧绷着，等待那一刻的来临。"
 SWRW_RUS.64.t:0 "起重机下的歌声"
 SWRW_RUS.64.d:0 "明斯克市中心，曾经的废墟正在被巨大的起重机和脚手架森林所取代。瓦季姆，一个年轻的建筑工人，正和他的工友们在高高的脚手架上固定着预制混凝土板。阳光耀眼，空气中弥漫着新水泥、电焊火花和工人们汗水的味道。下方，街道上车水马龙，新铺的沥青路面黝黑发亮，崭新的无轨电车安静地滑过，车窗里映出两旁拔地而起的苏式公寓楼和玻璃幕墙的公共建筑。\n“嘿，瓦季姆！发什么呆呢？快把那边的钢筋递过来！”班长喊道。\n\n瓦季姆回过神，把一捆沉重的钢筋递过去。“班长，你说…这楼盖起来，真能住上新房子吗？”他擦了擦额头的汗，有些不确定地问。他现在还和父母妹妹挤在郊区一个修了好几次的旧楼里。\n“废话！报纸上都登了！优先分配给咱们这些建设者！”班长咧嘴一笑，露出白牙，“等这‘胜利’大街修好了，我家老婆子就能在阳台上种花了！到时候请你来喝乔迁酒！”\n\n工友们发出一阵善意的哄笑。远处，传来一阵歌声，是一群戴着红领巾的孩子们在老师带领下参观工地，他们唱着关于建设、关于未来的歌谣，童声清澈响亮，穿透了工地的嘈杂。瓦季姆停下手里的活，听了一会儿。他想象着未来，也许就在这座他亲手建造的大楼里，他的孩子也能这样无忧无虑地唱歌。\n\n起重机的吊臂缓缓升起，将巨大的墙板吊向高空，像是在为这座浴火重生的城市，缝合最后一道伤口，也描绘着未来的轮廓。"
 SWRW_RUS.64.a:0 "一砖一瓦，皆是明天的基石。"
 SWRW_RUS.65.t:0 "田野与烟囱的协奏"
 SWRW_RUS.65.d:0 "布列斯特州，“十月丰收”集体农庄的主席安德烈·彼得罗维奇正对着电话大声理论着，脸涨得通红：“什么？又要把拖拉机调走一半？去支援什么…‘第二化工厂’的扩建？化工厂能当饭吃吗？春耕马上就要开始了！我们指望着用它们多打粮食呢！”\n\n电话那头传来一个不耐烦的官僚声音：“安德烈同志，这是中央的指示！工业化是优先任务！化工厂能生产化肥，最终还是为了提高粮食产量！要有大局观！”\n\n安德烈气得差点把电话摔了。大局观？他的大局观就是农庄里几百张等着吃饭的嘴，还有仓库里那些去年上交了大部分收成后所剩无几的储备粮！城里的工厂固然重要，可要是地里长不出庄稼，再多的化肥又有何用？\n\n挂了电话，他烦躁地在办公室里踱步。窗外，是刚刚翻耕过的、散发着湿润气息的黑色土地，几台仅存的拖拉机正在缓慢地移动。更远处，地平线上竖起了几根高耸的烟囱，那是新建的“第二化工厂”的标志，正日夜不停地向天空排放着灰白色的烟雾。\n\n就在这时，农庄的技术员，一个刚从农学院毕业的年轻人跑了进来，兴奋地说：“主席同志！好消息！上面批准了我们试用‘秸秆还田’和‘科学轮作’的新技术！说是不需要太多化肥也能提高地力！”\n\n安德烈愣了一下，看着年轻人眼中闪烁的光芒，又看了看窗外那片广袤的土地和远处的烟囱。也许…也许真的有办法，让田野和烟囱不再是互相争抢资源的对手，而是共同奏响一曲发展的协奏？他紧锁的眉头，终于稍稍舒展了一些。"
 SWRW_RUS.65.a:0 "在犁沟与流水线之间，寻找那微妙的平衡。"
 SWRW_RUS.66.t:0 "不再只有土豆皮"
 SWRW_RUS.66.d:0 "娜杰日达小心翼翼地将一小勺白砂糖放进女儿卡佳的茶杯里，看着那晶莹的颗粒慢慢融化。卡佳睁大了眼睛，惊喜地看着妈妈：“妈妈，今天…可以用糖吗？”\n\n“当然了，我的小甜菜，”娜杰日达笑着抚摸女儿的头发，“今天是爸爸发工资的日子，他还带回来了这个！”她从柜子里拿出一个印着彩色糖果图案的铁皮盒子——那是戈梅利糖果厂新出的水果糖，过去只有在过年或者接待重要客人的时候才能见到。\n\n丈夫米哈伊尔，那个在轴承厂勤勤恳恳工作了二十年的老钳工，正坐在桌边，看着妻子和女儿，脸上带着满足的笑容。他想起过去的苦日子：战争，饥荒，配给制，吃了上顿没下顿。最困难的时候，他们甚至要靠煮土豆皮来充饥。女儿卡佳从小就没怎么尝过甜味。\n\n而现在，日子真的不一样了。虽然离富裕还很远，但至少不用再担心饿肚子了。商店里的货架上慢慢有了更多的东西：布料、肥皂、甚至偶尔能买到一点香肠。他们去年还搬进了厂里分配的新公寓，虽然不大，但有独立的厨房和卫生间，冬天还有暖气。米哈伊尔的工资也涨了两次，虽然不多，但足够让娜杰日达偶尔能给卡佳买一颗水果糖了。\n\n“爸爸，”卡佳剥开一颗糖纸，把那颗亮晶晶的糖果放进嘴里，幸福地眯起了眼睛，“这个真甜！”\n\n米哈伊尔看着女儿满足的样子，心里暖洋洋的。贫困的阴影还没有完全散去，生活的担子依然沉重。但至少，他们已经能品尝到一点甜味了。为了这点甜味，为了让女儿以后能天天吃上糖，他觉得所有的辛苦都是值得的。"
 SWRW_RUS.66.a:0 "生活的滋味，正在悄悄变甜。"
 SWRW_RUS.67.t:0 "胜利广场上的旗帜"
 SWRW_RUS.67.d:0 "明斯克，胜利广场。阳光灿烂，彩旗飘扬。成千上万的人聚集在这里，参加庆祝“白俄罗斯解放与重建成果展”的盛大集会。高音喇叭里播放着雄壮的进行曲，穿着崭新军装的仪仗队列队走过，步伐整齐有力。观礼台上，坐着政府官员、军队将领、劳动模范和来自“兄弟共和国”的代表。\n\n广场中央，临时搭建的展台上，陈列着白俄罗斯重建的“辉煌成就”：明斯克拖拉机厂生产的新型拖拉机模型、别拉斯重型卡车的照片、索利戈尔斯克钾肥厂的矿石样本、还有纺织女工织出的带有民族花纹的漂亮亚麻布。每一件展品旁都配有详细的说明，强调着在党的领导下，白俄罗斯人民如何克服困难，自力更生，取得了举世瞩目的成就。\n\n十六岁的维克多和他的同学们也挤在人群中，兴奋地挥舞着小旗。老师告诉他们，要为自己是“伟大的白俄罗斯”的一份子而感到自豪。看着那些威武的士兵，看着那些闪闪发光的机器模型，听着喇叭里慷慨激昂的讲话，维克多确实感到一阵热血沸腾。他为脚下这片土地的重生而骄傲，为那些建设者的辛劳而感动。\n\n然而，站在他身旁的一位头发花白的老奶奶，却只是安静地看着，眼神里没有兴奋，只有一种复杂而深邃的情感。维克多注意到，她的袖口露出了一截黑色的孝布。也许，对她来说，广场上的喧嚣和彩旗，无法完全覆盖那些尚未远去的伤痛和失去。\n\n集会的高潮到来了，巨大的红旗在广场上空缓缓升起，人群爆发出雷鸣般的掌声和欢呼声。“乌拉！乌拉！”的口号响彻云霄。维克多也跟着一起呐喊，他相信，未来一定是光明的，伟大的。只是，那伟大之中，似乎也夹杂着一些不易察觉的、属于过去的沉重回响。"
 SWRW_RUS.67.a:0 "旗帜之下，是荣耀，也是未干的泪痕。"
 SWRW_RUS.68.t:0 "图书馆里的低语"
 SWRW_RUS.68.d:0 "新落成的白俄罗斯国家图书馆，宽敞明亮，充满了书卷的气息。巨大的玻璃窗将午后的阳光引入阅览室，照在伏案阅读的年轻学子们身上。空气中只有纸张翻动的沙沙声和偶尔响起的、被刻意压低的咳嗽声。\n\n斯韦特兰娜，一名学习语言学的大学生，正沉浸在一本新出版的、收录了白俄罗斯现代诗歌的选集里。这在几年前是不可想象的。那时，许多本土作家的名字都还是禁忌，书店里充斥着千篇一律的宣传册和领袖语录。而现在，虽然审查依然存在，但至少，一些属于他们自己的声音，开始被允许重新发出。\n\n她读到了一首描写故乡小镇清晨的诗，文字质朴而优美，唤起了她童年的记忆。她抬起头，看到阅览室里坐满了和她一样年轻的面孔，他们或埋头于厚重的科学著作，或低声讨论着文学作品，眼中闪烁着求知的光芒和对未来的憧憬。是的，一个新的时代正在到来，充满了机遇和可能性，仿佛一切尘埃落定之后，阳光终于穿透了阴霾。\n\n“你好，可以坐这里吗？”一个轻柔的声音打断了她的思绪。是一个和她年纪相仿的男孩，怀里抱着几本厚厚的哲学书。\n\n“当然。”斯韦特兰娜微笑着挪了挪身边的书本。\n\n男孩坐下后，犹豫了一下，低声问：“你在读库帕拉吗？”\n\n斯韦特兰娜惊讶地抬起头：“你也知道他？”\n\n男孩笑了，眼中闪过一丝狡黠：“当然，虽然他的很多作品，图书馆里还找不到。”他凑近了一些，声音更低了，“不过，我有些朋友…我们私下里会交流一些‘有趣’的东西。你想加入吗？”\n\n斯韦特兰娜的心跳有些加速。她知道这种“私下交流”意味着什么，也知道其中的风险。但看着男孩眼中那混合着热情、叛逆和理想主义的光芒，她又感到一阵莫名的吸引力。也许，真正的“闪耀”，并不仅仅来自于官方允许的光明，也来自于那些在角落里悄悄传递的、带着温度和思想的火花？"
 SWRW_RUS.68.a:0 "书页翻动，思想开始悄然流动。"
 SWRW_RUS.69.t:0 "归来的脚步"
 SWRW_RUS.69.d:0 "尘土飞扬的道路尽头，是维捷布斯克郊外那个他离开了几十年的村庄。阿列克谢·彼得罗维奇，一个步履蹒跚、鬓发染霜的老兵，终于站在了村口那棵歪脖子老柳树下——和他记忆里一模一样，只是树干更粗壮，枝叶也更茂密了。战争，以及战争之后漫长而遥远的“服役”，几乎耗尽了他的一生。现在，他回来了，带着一身洗得发白的旧军装和一颗既疲惫又充满忐忑的心。\n\n村庄变了样。许多低矮的土坯房不见了，取而代之的是一排排刷着白石灰的新砖房，屋顶上竖起了崭新的电视天线。孩子们穿着干净的衣服在泥地里追逐着一只皮球，他们的笑声清脆响亮，对战争和饥饿似乎毫无记忆。远处传来拖拉机规律的突突声——那是集体农庄的方向，他年轻时曾在那里挥汗如雨。空气中飘来新烤面包和干草的混合香味，那是属于和平年代的味道。\n\n他慢慢地走在村里唯一的那条主路上，脚步有些虚浮。路过曾经熟悉的邻居家门口，如今住着他不认识的面孔，对方投来好奇而友善的目光，却无人认出他就是当年那个从这里走出去的毛头小伙子。他甚至找不到自己家的老屋了，原来的位置上盖起了一座崭新的乡村俱乐部，门口贴着电影海报和农业技术推广的宣传画。\n\n一切都那么陌生，又隐约带着熟悉的影子。就像他自己，身体里流淌的还是这片土地的血液，灵魂深处却早已被岁月和经历刻满了无法磨灭的沟壑，与眼前这欣欣向荣的景象有些格格不入。他感觉自己像一个幽灵，徘徊在过去与现在之间。\n\n他在村边的河岸上找了块石头坐下，看着夕阳染红了天边的云霞，也染红了静静流淌的河水。几个年轻人扛着农具，说说笑笑地从他身边走过，向村里走去。其中一个看到他，犹豫了一下，停下脚步，用带着本地口音的俄语问道：“大叔，您是…来探亲的吗？天快黑了，要不要去我家喝口热茶？”\n\n亚列克谢抬起头，看着那张年轻、淳朴、充满活力的脸庞，和他浑浊疲惫的眼睛形成了鲜明的对比。他张了张嘴，想说点什么，却发现喉咙哽咽了。回家…他终于回家了。可这里，还是他的家吗？他还能融入这片正在努力向前、似乎已经将他遗忘的土地吗？\n\n他深吸了一口带有泥土和炊烟味道的空气，缓缓地点了点头。这或许就是所谓的“信仰一跃”吧——相信这片土地不仅能接纳伤痕，也能接纳归来的、步履蹒跚的灵魂。"
 SWRW_RUS.69.a:0 "脚下的土地，是归宿，也是起点。"

 SWRW_RUS.71.t:0 "关于在乌克兰领土上开展重建工作的指导意见"
 SWRW_RUS.71.d:0 "收件人：乌克兰重建委员会各级负责同志\n发件人：中央恢复与发展委员会 乌克兰事务办公室 拉琴科\n主题： 乌克兰地区第一阶段重建工作启动指示及原则性要求\n同志们，\n根据中央最新指示精神，现就乌克兰地区的重建工作下达如下指导意见：乌克兰，我们曾经的“面包篮”，兄弟般的土地，在遭受法西斯匪帮及其走狗长期、残酷的统治和破坏后，百废待兴，民生凋敝，其重建工作的复杂性、艰巨性和重要性，怎么强调都不为过。首要任务：一、迅速恢复基辅、哈尔科夫、第聂伯罗彼得罗夫斯克等中心城市的关键基础设施，尤其是交通运输、电力供应及通信系统，务必在最短时间内打通经济动脉；二、全面清查农业资源，登记土地，统计农具和牲畜存量，制定详细的春耕及秋收恢复计划，粮食问题是重中之重；三、整合残存工业，特别是顿巴斯地区的煤矿与冶金企业，优先保障修复所需物资的生产；四、稳定社会秩序，安抚民心，严厉打击一切破坏重建、制造分裂的敌对活动；五、特别注意甄别并消除德寇殖民统治时期遗留的毒素，重建健康的社会风气和民族认同。中央充分理解你们面临的困难，但也坚信，英雄的乌克兰人民拥有无穷的力量。初步的种子、化肥、医疗物资和基础建材将随本指示下达后逐步到位。请贵委员会本着实事求是的精神，立即组织力量，深入调研，尽快上报更详尽的现状报告与具体工作计划。记住，要速度，更要质量，要重建家园，更要凝聚人心。"
 SWRW_RUS.71.a:0 "让第聂伯河再次奔腾起建设的浪花。"
 SWRW_RUS.72.t:0 "路牌下的德语课"
 SWRW_RUS.72.d:0 "利沃夫老城的石板路上，几个半大孩子正围着一个新安装的双语路牌好奇地指指点点。上面是乌克兰语的“市场广场”，下面是一行较小的俄语，而在更下方，还能隐约看到一层被刮掉的油漆下残留的哥特体德语字母：“Marktplatz”。阳光洒在古老的砖石建筑上，这些建筑见证了太多旗帜的更迭。\n突然，一个戴着红袖章的年轻人走了过来，他是“清除法西斯遗毒宣传队”的成员。“小同志们，在看什么呢？”他笑着问。\n“叔叔，这下面写的德语是什么意思？”一个胆大的孩子指着那模糊的印记问。\n年轻人的笑容僵了一下，随即换上严肃的表情：“那是侵略者的语言，是压迫我们乌克兰人民的法西斯匪帮留下的肮脏印记！我们把它刮掉了，就像我们把他们赶走了一样！现在这里只有我们兄弟民族的语言！”\n孩子们点点头，似懂非懂。这时，旁边一个修鞋的老人抬起头，用带着浓重口音的乌克兰语嘟囔了一句：“刮掉了字，刮不掉日子…”声音很低，但足够让年轻人听到。\n年轻人的脸涨红了，想反驳什么，但看着老人那饱经沧桑的脸，最终只是哼了一声，转身去检查下一个路牌了。孩子们也一哄而散，继续他们追逐鸽子的游戏。只有那块崭新的路牌，和它下面无法完全抹去的历史痕迹，沉默地立在街角，接受着阳光和行人目光的洗礼。"
 SWRW_RUS.72.a:0 "新漆可以覆盖旧痕，但记忆会从缝隙中渗出。"
 SWRW_RUS.73.t:0 "第一犁"
 SWRW_RUS.73.d:0 "波尔塔瓦广袤的黑土地终于等来了它的拖拉机。奥克萨娜，一位皮肤黝黑、手臂粗壮的农妇，正笨拙但兴奋地驾驶着一台刚分配到村里的“白俄罗斯”牌拖拉机。这是她第一次操作这种冒着黑烟、发出巨大轰鸣的铁家伙。在她的身后，被犁铧翻开的泥土黝黑油亮，散发出沁人心脾的芳香，仿佛沉睡了太久的巨人终于伸了个懒腰。\n她的丈夫彼得罗，正带着几个年轻人跟在后面，撒着据说是从“中央”运来的高产品种小麦种子。战争期间，这片肥沃的土地要么被迫种上了德国人需要的工业原料，要么干脆荒芜了。彼得罗自己也被抓去给德国人修工事，九死一生才逃回来。现在，能重新在自家的（虽然现在叫集体农庄了）土地上播种小麦，感觉就像做梦一样。\n“奥克萨娜！开慢点！别把种子都埋太深了！”彼得罗朝着拖拉机喊道，脸上带着笑意。奥克萨娜回头冲他挥了挥手，拖拉机的轰鸣声盖过了她的回答。\n远处，村里的老人和孩子们站在田埂上，看着这番景象。一个白发苍苍的老奶奶划着十字，嘴里念念有词，似乎在为今年的收成祈祷。几个孩子则追逐着拖拉机扬起的尘土嬉闹。阳光温暖，天空湛蓝，饱受创伤的土地正在重新焕发生机。虽然农具还很匮乏，种子也不算充足，拖拉机手也需要培训，但第一犁已经落下，希望的种子已经播撒。"
 SWRW_RUS.73.a:0 "黑土无言，静待丰收的回响。"
 SWRW_RUS.74.t:0 "“解放者”纪念碑的新装"
 SWRW_RUS.74.d:0 "基辅市中心，那座曾经由德国人竖立的、用来纪念他们“从布尔什维克手中解放乌克兰”的巨大花岗岩方尖碑，如今被脚手架和帆布层层包裹起来。一群工人正在上面叮叮当当地忙碌着，偶尔有碎石落下。周围聚集了不少看热闹的市民，对着这番景象指指点点，议论纷纷。\n“总算要把它拆了！”一个头发花白的老大爷，拄着拐杖，激动地说，“这玩意儿立在这儿，看着就晦气！德国鬼子留下的狗屁纪念碑！”\n“听说是要改造，不是拆掉。”旁边一个戴眼镜的知识分子模样的人小声纠正道，“上面要把它改建成‘反法西斯战争胜利纪念碑’，保留主体结构，把纳粹的标志都敲掉，换上我们的英雄雕像。”\n“改造？哼，换汤不换药！”老大爷显然不买账，“要我说，就该把它炸了！炸成碎片！让那些法西斯看看，谁才是真正的主人！”\n“老大爷，话不能这么说，”知识分子推了推眼镜，“这也是历史的一部分，留着做个反面教材，提醒后人不要忘记过去的苦难，不是更好吗？”\n人群中响起一阵低低的议论声，显然两种观点都有支持者。有人觉得彻底摧毁才能泄愤，有人觉得改造利用更具意义。但无论如何，那座象征着屈辱和压迫的纪念碑即将改头换面，这本身就是一种胜利的姿态。夕阳下，工人们的剪影在巨大的碑体上移动，敲打声仿佛在为过去那个黑暗的时代，奏响迟来的、刺耳而充满力量的葬礼进行曲。"
 SWRW_RUS.74.a:0 "敲掉鹰徽，刻上五星。"
 SWRW_RUS.75.t:0 "赫列夏基克大街上的起重机"
 SWRW_RUS.75.d:0 "基辅的赫列夏基克大街，这条曾被誉为“苏联最美大街”的林荫大道，在战争中几乎被夷为平地。如今，它变成了一个巨大的建筑工地。起重机的长臂在空中挥舞，卡车满载着砖块和水泥来回穿梭，焊接的火花四溅，敲打声、号子声、机器轰鸣声交织在一起，谱写着一曲属于重建的、嘈杂而充满活力的乐章。\n斯维特拉娜，一位年轻的女工程师，头戴安全帽，手拿图纸，正站在一栋刚建起骨架的大楼前，对着几个满身尘土的建筑工人比划着。“这里的承重墙，钢筋型号不能错！还有那边的预制板，接口必须对齐！安全第一，质量也要保证！”她的声音清脆而坚定，在一片男性主导的工地上显得格外醒目。\n她来自哈尔科夫，是响应国家号召，第一批来到基辅参与重建的技术人员之一。眼前的景象让她既兴奋又感到压力巨大。图纸上的基辅宏伟壮丽，充满了新古典主义的气派和对未来的憧憬。可现实是满目疮痍，材料短缺，熟练工人不足，官僚主义的拖沓有时也让人头疼。\n但每当看到一堵墙被砌起，一层楼板被吊装到位，看到这条大街正以肉眼可见的速度从废墟中重新站立起来时，一种巨大的自豪感便会涌上她的心头。他们不仅仅是在建造楼房，他们是在重建一座城市的灵魂，是在为一个饱受苦难的民族，重新描绘未来的天际线。\n傍晚，工人们三三两两地离开工地，斯维特拉娜独自一人留了下来，对着图纸仔细核对着今天的进度。夕阳的余晖洒在未完工的建筑骨架上，投下长长的影子。她仿佛已经能看到，不久的将来，这条大街上会重新亮起华灯，人们会在这里散步、购物、欢笑，就像战争从未发生过一样。"
 SWRW_RUS.75.a:0 "一砖一瓦，垒砌的是建筑，更是希望。"
 SWRW_RUS.77.t:0 "集市上的收购价"
 SWRW_RUS.77.d:0 "切尔尼戈夫的露天集市，久违地热闹了起来。阳光正好，泥泞的道路两旁摆满了各式各样的农产品：刚从地里挖出来的土豆、水灵灵的卷心菜、自家腌制的酸黄瓜、还有几只被捆住脚扑腾的活鸡。农民们一边吆喝着，一边和前来采购的市民讨价还价。\n奥列格大叔，一个种了一辈子地的老农民，今天心情格外好。他面前的麻袋里装着今年收成的小麦，旁边还有一个穿着制服的年轻人，正在一个本子上认真地记录着什么。那年轻人是新政府派来的粮食收购员。\n“奥列格同志，您这批小麦质量不错，按照最新的收购价，一共是…这么多卢布。”年轻人算完账，递过一沓崭新的钞票。\n奥列格接过钱，仔细地数了两遍，脸上露出了难以置信的笑容。“这么多？比…比去年德国人给的高了快一倍！”去年，德国人只肯用几张几乎是废纸的“占领区马克”来换他的粮食，而且价格低得离谱，几乎是明抢。要不是偷偷藏了一些，他和家人早就饿死了。\n“这是国家的新政策，”年轻人笑着说，“减轻农民负担，提高收购价格，鼓励大家多种粮，多交粮。以后日子会越来越好的。”他还告诉奥列格，今年秋天可能会有新的化肥和农具补贴。\n奥列格激动得有些说不出话，只是一个劲地点头。他把钱小心地揣进怀里，感觉沉甸甸的，不仅是钞票的重量，更是生活的希望。周围的农民们也围了过来，七嘴八舌地询问着新政策，脸上都洋溢着相似的、久违的轻松和期待。集市上的喧闹声似乎也变得更加欢快了。"
 SWRW_RUS.77.a:0 "黑土地的汗水，终于换来了沉甸甸的卢布。"
 SWRW_RUS.78.t:0 "开往哈尔科夫的火车"
 SWRW_RUS.78.d:0 "拥挤不堪的三等车厢里，空气混浊，弥漫着汗味、烟味和廉价食物的味道。十九岁的娜塔莎紧紧抱着一个打着补丁的旧包裹，里面是她全部的家当。她靠着车窗，看着窗外飞速掠过的、熟悉的乌克兰乡村景色——无尽的田野、零星的村庄、孤独的白杨树。这是她从小长大的地方，但她正要离开这里，去往一个遥远而陌生的大城市——哈尔科夫。\n车厢里的大部分乘客都和她一样，是准备进城寻找机会的年轻人。他们或兴奋地高谈阔论着对未来工厂生活的憧憬，或茫然地望着窗外，脸上带着对未知的忐忑。招工的海报贴满了村里的公告栏：哈尔科夫的拖拉机厂、第聂伯罗彼得罗夫斯克的钢铁厂、基辅的建筑工地…都在召唤着年轻的劳动力。城里有工作，有更高的工资，有电灯，有电影院，有…未来。\n娜塔莎的父母舍不得她走，村里的生活虽然清贫，但安稳。可娜塔莎不想一辈子守着那几亩薄田，重复着祖祖辈辈的生活。她想去看看外面的世界，想学一门技术，想…过上不一样的生活。广播里天天都在说，国家需要建设者，城市需要年轻人。\n火车发出一声长鸣，开始减速。车窗外，低矮的农舍渐渐被高耸的烟囱和厂房取代。哈尔科夫到了。娜塔莎深吸一口气，随着人流挤下火车。站台上人头攒动，噪音震耳欲聋。她有些晕眩，但更多的是兴奋。这就是城市，充满着机会，也充满着挑战。她不知道自己能否在这里站稳脚跟，但她知道，她回不去了。\n"
 SWRW_RUS.78.a:0 "火车驶向前方，载着离乡的脚步和城市的梦想。"
 SWRW_RUS.79.t:0 "酒馆里的争论"
 SWRW_RUS.79.d:0 "第聂伯罗彼得罗夫斯克河畔的一家小酒馆里，烟雾缭绕，人声嘈杂。几个刚下班的钢铁厂工人正围坐在一张油腻的桌子旁，喝着廉价的啤酒，就着黑面包和咸鱼干，大声地争论着什么。\n“我说，瓦西里，你这话就不对了！”一个络腮胡大汉用力拍着桌子，“凭什么说我们俄国人来了，就跟德国人一个样？我们是把他们赶走的解放者！”\n“解放者？”坐在他对面的瓦西里，一个眼神锐利、说话带着乌克兰口音的中年人，冷笑一声，“是啊，赶走了狼，来了熊。以前街上是德国兵，现在是你们的巡逻队；以前墙上是万字旗，现在是差不多的俄罗斯旗帜；以前要学德语，现在要学俄语…有什么不一样？”\n“怎么不一样？！”络腮胡急了，“我们带来了工厂！带来了工作！没像德国鬼子那样把你们当奴隶！我们都是斯拉夫大家庭的兄弟！”\n“兄弟？”瓦西里端起酒杯，一饮而尽，“有些‘兄弟’可不怎么拿我们当自己人。我儿子在学校因为说了几句乌克兰语，就被那个从莫斯科来的老师罚站！你们的报纸上，有几篇是写我们乌克兰的英雄的？还不是整天歌颂你们自己！”\n“那…那是少数情况！”络腮胡有些语塞，“政策是好的，只是下面的人执行歪了…再说，过去的事就让它过去吧，现在大家一起建设新生活不好吗？”\n“过去的事？”瓦西里的眼神变得深邃而悲伤，“有些事，是忘不了的。大饥荒，清洗，还有…战争。我们这片土地流了太多血了，不管是红色的还是黑色的。”\n酒馆里沉默了下来，只有远处传来模糊的广播声。隔壁桌的几个年轻人似乎也听到了他们的争论，交换着复杂的眼神。信任的重建，身份的认同，远比修复一座被炸毁的桥梁要困难得多。"
 SWRW_RUS.79.a:0 "伤疤虽会愈合，但触摸时仍会疼痛。"
 SWRW_RUS.80.t:0 "磨坊边的会议"
 SWRW_RUS.80.d:0 "村口的旧磨坊被清理干净，刷上了新的石灰，挂上了一块写着“‘共耕’农业生产合作社”的木牌。磨坊里，十几个村民，男女老少都有，正围坐在一张长条木桌旁，激烈地讨论着什么。桌上散落着几张粗糙的图纸和写满数字的记录本。\n“我认为，应该先把那片洼地改成鱼塘！”合作社社长，一个精明强干的前游击队员伊万说道，“养鱼见效快，年底就能分红！”\n“不行！”立刻有人反对，是经验丰富的老农米哈伊洛，“那片地虽然洼，但土质好，只要修好水渠，就能种上好的蔬菜！比养鱼稳当！”\n“修水渠要多少劳力？要多少时间？等修好了，黄花菜都凉了！”伊万拍着桌子。\n“养鱼风险大！万一生了病，一条都剩不下！”米哈伊洛也不甘示弱。\n…争论持续了很久，每个人都想为合作社的发展出力，但想法却不尽相同。这是村里自发成立的合作社，土地还是各家的，但农具、牲口和劳动力可以共享，收益按劳分配。这是个新鲜事物，既不同于过去单打独斗的小农经济，也不同于上面强制推行的集体农庄。大家都在摸索着前进，充满了热情，也充满了不确定性。\n最后，还是村里最有威望的老教师安娜出来打了圆场。“同志们，别争了。我看这样吧，洼地可以先利用起来养鸭子，投入少，见效也快。同时呢，大家抽出点劳力，慢慢修水渠，等明年春天，就能种上菜了。这样两不耽误，怎么样？”\n大家你看我，我看你，觉得这个折中的办法似乎可行。于是，新的计划被歪歪扭扭地写在了本子上。窗外，夕阳正慢慢落下，给这座刚刚起步的合作社，镀上了一层温暖而充满希望的光芒。"
 SWRW_RUS.80.a:0 "众人拾柴，火焰未必笔直向上，但总能带来温暖。"
 SWRW_RUS.81.t:0 "大地的恩赐"
 SWRW_RUS.81.d:0 "奥莱娜跪在田埂上，抓起一把疏松、潮湿的黑土，放在鼻尖下深深地嗅闻。那是一种混合着腐殖质、雨水和植物根须的独特气息，是生命的味道，是这片乌克兰黑土地独有的芬芳。多少个世纪以来，这片土地滋养着她的祖先，也埋葬着她的亲人。它曾慷慨地献出金黄的麦浪，也曾沉默地承受战火的蹂躏。\n她的手指能感受到土壤的温润和力量。春天来了，是播种的季节。远处，集体农庄的拖拉机正在作业，发出规律的轰鸣声。她的丈夫和儿子也在田里忙碌着，他们的身影在广袤的田野上显得渺小，却又无比坚定。\n战争结束后，一切都在慢慢恢复。虽然生活依然艰辛，化肥和种子依然需要按计划分配，但至少，土地又回到了耕种者的手中，不再是为了满足遥远帝国贪婪的需求而被迫荒芜或种植异乡的作物。\n奥莱娜站起身，拍了拍膝盖上的泥土。她从布袋里掏出一把饱满的向日葵种子，小心翼翼地将它们撒入刚犁好的土壤中。她知道，只要用心耕耘，这片神奇的黑土地就绝不会辜负他们。它会再次绽放出金色的花朵，结出沉甸甸的果实，像一位慈爱的母亲，无私地哺育着她的儿女。\n风吹过田野，带来远方村庄的炊烟气息。奥莱娜挺直了腰杆，望着无垠的田野和湛蓝的天空，心中充满了平静和一种古老的、源于土地的踏实感。"
 SWRW_RUS.81.a:0 "黑土之下，涌动着不息的生命脉搏。"
 SWRW_RUS.82.t:0 "高炉前的誓言"
 SWRW_RUS.82.d:0 "巨大的高炉再次喷吐出炽热的铁水，将整个车间映照得一片橘红。震耳欲聋的轰鸣声中，汗流浃背的工人们操作着巨大的机械臂，将滚烫的钢锭运往下一道工序。马里乌波尔的亚速钢铁厂，这座在战争中几乎被完全摧毁的工业巨兽，正在废墟上顽强地重生。\n安德烈，一位经验丰富的炼钢炉炉长，正目不转睛地盯着炉口跳跃的火焰，凭着多年的经验判断着火候。他的脸上被高温熏得黝黑，胳膊上布满了旧伤疤。战争期间，他曾带领工人们在德军的炮火下坚持生产，直到最后一刻才被迫撤离。现在，他回来了，回到了这片他奉献了大半辈子青春的地方。\n重建工作异常艰难。许多设备被德军破坏或运走，厂房变成了残垣断壁，熟练的工友们死的死，散的散。他们几乎是从零开始，清理废墟，修复机器，重新召集工人。但没有人抱怨，每个人心里都憋着一股劲儿。\n“安德烈师傅！”一个年轻的学徒跑过来，兴奋地喊道，“第一炉合格的钢水出来了！检验合格！”\n安德烈紧绷的脸上终于露出了一丝笑容。他点了点头，用力地挥了一下拳头。这不仅仅是一炉钢水，这是亚速钢铁厂重生的号角，是乌克兰重工业复苏的希望。他仿佛已经看到，用他们炼出的钢铁制造的拖拉机奔驰在田野上，建造起新的桥梁和楼房，铸造成保卫家园的武器。\n下班的汽笛声响起，工人们拖着疲惫的身躯走出车间，身上沾满了油污和铁屑，但眼神里却闪烁着光芒。安德烈站在高炉前，望着那奔腾不息的铁水，在心中默默立下誓言：一定要让这座工厂比以前更强大，一定要让乌克兰的钢铁，再次支撑起国家的脊梁。"
 SWRW_RUS.82.a:0 "钢铁之躯，在烈火中重铸。"
 SWRW_RUS.83.t:0 "烟囱森林"
 SWRW_RUS.83.d:0 "从顿涅茨克到扎波罗热，再到第聂伯罗彼得罗夫斯克，广袤的乌克兰东部，一座座工厂的烟囱正像雨后春笋般重新耸立起来，构成了一片独特的“烟囱森林”。白天的天空常常被各种颜色的烟雾笼罩，夜晚则被高炉和焦化厂的火光映亮。这里是乌克兰重工业的心脏地带，是国家重建的引擎。\n在克里沃罗格的铁矿矿区，巨大的挖掘机正在不知疲倦地啃噬着富含铁矿石的山体。在哈尔科夫的拖拉机厂，新下线的拖拉机正整齐地排列在厂区广场上，等待运往全国各地。在第聂伯水电站的大坝上，工程师们正在紧张地修复着被战争破坏的发电机组。\n谢尔盖，一名负责协调各工厂生产计划的中央规划局专员，正坐在一列颠簸的火车上，穿行在这片充满活力的工业区。他的公文包里塞满了各种报告、图表和申请。每个工厂都缺资金，缺设备，缺熟练工人，缺原材料…问题堆积如山。但他每次看到那些拔地而起的厂房，看到工人们脸上那种既疲惫又充满干劲的表情，看到火车车厢里满载的煤炭、矿石和钢材时，一种强烈的使命感就会油然而生。\n他们是在建设一个强大的工业基础，一个能够支撑国家安全、改善人民生活、实现现代化梦想的基础。这过程也许会伴随着污染、低效和各种各样的问题，但大方向是明确的，前进的脚步是坚定的。火车驶过一座正在冒着滚滚浓烟的大型化工厂时，谢尔盖打开车窗，深深地吸了一口那带有刺鼻化学品味道的空气。这，就是进步的味道，他想。\n"
 SWRW_RUS.83.a:0 "机器在轰鸣，乌克兰的心脏在重新搏动。"
 SWRW_RUS.84.t:0 "关于在高加索地区启动重建工作的命令"
 SWRW_RUS.84.d:0 "收件人： 高加索特别行政区（临时）重建指导小组 负责同志\n发件人： 中央恢复与发展委员会 南方局 第五办公室 马卡洛夫\n主题： 立即启动高加索地区第一阶段恢复重建工作的命令\n指导小组全体同志：\n鉴于高加索地区已从法西斯匪帮及其仆从手中解放，根据中央统一指示，现命令立即启动该地区第一阶段恢复重建工作。高加索地区地理位置特殊，民族构成复杂，长期遭受残酷统治与战争破坏，重建任务极为繁重，意义十分重大。当前核心任务包括：一、迅速对巴库油田、格鲁吉亚锰矿及主要交通干线（特别是跨高加索公路、铁路）的损毁情况进行彻底评估，形成报告，明确修复优先级；二、清查区域内农业潜力，登记土地、牲畜情况，立即着手准备恢复亚热带作物种植和山地畜牧业；三、组织力量修复或重建关键城市（如第比利斯、巴库、索契）的基础民生设施，保障基本供应，稳定人心；四、肃清残余敌对武装（包括但不限于游击队、前合作者武装），维护社会治安，严防破坏活动；五、在工作中须高度注意当地复杂的历史遗留问题和民族情绪，稳妥推进各项政策。中央理解困难所在，后续资源将逐步协调。即刻行动，不得延误！"
 SWRW_RUS.84.a:0 "雪山见证，誓让这片土地重焕生机。"
 SWRW_RUS.85.t:0 "山谷的回声"
 SWRW_RUS.85.d:0 "地质勘探队的骡马在崎岖的山路上艰难行进，蹄声在空旷的山谷中回荡。阿尔乔姆，一个来自莫斯科的年轻地质学家，正对着一张皱巴巴的地形图和指南针较劲，汗水浸湿了他的额发。身旁是沉默寡言的当地向导，一个名叫格奥尔基的格鲁吉亚老人，他看着阿尔乔姆笨拙的样子，嘴角露出一丝难以察觉的、混合着怜悯和嘲讽的微笑。\n“年轻人，地图没告诉你石头也会说话吗？”格奥尔基终于开口，声音像山涧里的溪水一样清冽，“跟着羊走的路，通常比跟着墨水画的路更靠谱。”\n阿尔乔姆有些尴尬地放下地图。“格奥尔基大叔，报告上说这一带有丰富的锰矿和铜矿，对国家的重建非常重要。我们必须找到精确的矿脉位置。”\n老人没再说话，只是指了指远处一片颜色略深的岩壁。“我爷爷的爷爷就在那一带挖过石头，给沙皇的炮弹做外壳。后来又给布哈林的坦克挖。再后来…是给德国人的飞机挖。”他叹了口气，“山里的石头不认旗帜，它们只认识挖它们的人。你们来了，它们就为你们服务。等你们走了…”\n阿尔乔姆顺着老人手指的方向望去，那片岩壁在夕阳下泛着金属般的光泽。这片壮丽而古老的山脉，慷慨地蕴藏着工业的血液，但也冷漠地见证了太多征服者的来来去去。他们是来索取的，带着国家和计划的名义，为了那个宏伟的“重建”目标。但这山，这石头，似乎有着它们自己的、不为所动的节奏。\n"
 SWRW_RUS.85.a:0 "财富深藏，只待挖掘的手，无论来自何方。"
 SWRW_RUS.86.t:0 "里海的风"
 SWRW_RUS.86.d:0 "巴库，风中永远带着一股浓郁的油腥味，即使里海吹来的风也无法完全驱散。废弃的“诺贝尔兄弟”时代的旧钻井架像生锈的骨架一样矗立在岸边，与不远处正在重新修复、冒着黑烟的新钻塔形成了奇异的对比。\n工程师列昂尼德·索科洛夫，一个经验丰富的石油专家，正站在一个巨大的、坑坑洼洼的储油罐旁，对着一群本地的阿塞拜疆工人比划着，试图解释一个新的阀门安装方案。他的俄语夹杂着几个生硬的阿塞拜疆语单词，工人们则用一种混合着好奇、怀疑和疲惫的眼神看着他。\n“这个新的压力阀，是从…上面调拨来的最新型号！”索科洛夫努力让自己的声音盖过远处修复钻塔的噪音，“装上它，能提高效率，还能…更安全！”\n一个满脸油污、包着头巾的老工人用浓重的口音问：“安全？德国人占着的时候，可没人管我们安不安全，油井三天两头着火。现在换了你们，油还是那个油，命…还是我们的命吗？”\n索科洛夫一时语塞。他知道，战争和占领给这里的人留下了深深的伤痕和不信任。重建油田不仅仅是修复机器和管道，更是要修复人心。他指着远处正在作业的钻塔：“老人家，你看，我们正在努力让一切好起来。国家需要石油，就像人需要血液一样。你们有经验，我们有技术（虽然很多技术也是刚学来的），一起干，巴库的石油会再次流淌，日子也会好起来的。”\n老工人沉默地看着他，然后缓缓点了点头。也许是相信了他的话，也许只是因为除了干活，他们别无选择。里海的风吹过，带来了更多油田深处传来的、机器重新运转的轰鸣声。"
 SWRW_RUS.86.a:0 "黑色的金子，能否洗去红色的记忆？"
 SWRW_RUS.88.t:0 "海边的疗养券"
 SWRW_RUS.88.d:0 "索契的海滩上，稀稀拉拉地出现了一些穿着各式各样泳衣（大部分是旧款苏式连体泳衣或自制的沙滩裤）的人们，他们小心翼翼地将脚伸进黑海微凉的海水里，发出惊喜或抱怨的叫声。远处，几座曾经奢华、如今略显破败的疗养院正在进行外部粉刷和修缮。\n\n玛格丽塔，一位在当地国营餐厅工作的女服务员，正有些不耐烦地给一桌来自西伯利亚的“疗养团”上菜。这些大多是矿工或工厂劳模，拿着国家奖励的疗养券来到这里，对一切都充满了好奇，也带着一种朴实的拘谨。他们点菜时总是选最便宜的，喝格瓦斯也要互相谦让半天。\n\n“同志，再来一瓶格瓦斯！”一个声音洪亮的矿工喊道。玛格丽塔应了一声，转身去拿。她记得德国人占领时期，这里也住满了“疗养”的人，不过是些穿着笔挺制服、趾高气扬的德国军官和他们的情妇。他们挥霍无度，对当地人颐指气使。\n\n现在来的这些人不同，他们是“自己人”，是“劳动人民”，可玛格丽塔心里总觉得隔着点什么。他们来自遥远的俄罗斯腹地，说着她不太习惯的口音，对黑海的棕榈树和温暖气候大惊小怪。而她和她的家人，在这片美丽的土地上经历了太多动荡和苦难，对宣传画上描绘的“阳光、沙滩、工人天堂”总有些将信将疑。\n\n餐厅的窗外，几个孩子正在追逐着浪花。阳光很好，海水也蓝。也许，让不同地方的人来这里看看海，放松一下，本身就是一件好事吧。至少，这比听到炮声要好得多。"
 SWRW_RUS.88.a:0 "黑海的浪，冲刷着不同时代的沙滩。"
 SWRW_RUS.89.t:0 "地图上的斑点"
 SWRW_RUS.89.d:0 "地质勘探报告被摊开在格罗兹尼临时指挥部的桌子上，上面用不同颜色的铅笔标注着密密麻麻的符号和线条。一个头发稀疏的官员，正用放大镜仔细地研究着地图上靠近车臣山区的几个红色斑点。\n“所以，佩特连科同志，你确定这些标记代表着…石油？”他抬起头，问旁边一位穿着沾满泥土的勘探服、眼神疲惫的地质队长。\n“基本确定，主任同志，”佩特连科揉了揉眼睛，“根据我们初步的钻探取样和地质分析，这一带地下存在着相当规模的油气藏。储量可能…非常可观。”\n官员的眼睛亮了起来。“可观？非常好！非常好！这意味着我们除了巴库之外，又找到了新的能源基地！这对高加索乃至全国的重建都是巨大的推动力！”他兴奋地搓着手，“必须立刻组织力量，加大勘探力度，尽快制定开采计划！”\n佩特连科犹豫了一下，说道：“主任同志，情况可能…有些复杂。这些区域地处山区，地形险峻，交通不便。而且…当地居民，主要是车臣人，他们对我们的勘探活动似乎…不太欢迎。我们有队员报告说，在夜里听到过枪声，还有一些设备莫名其妙地被破坏了。”\n官员脸上的兴奋立刻消退了，取而代之的是一种阴沉。“不欢迎？哼，这是我们国家的土地，地下的财富属于全体人民！他们有什么权利不欢迎？”他敲了敲桌子，“佩特连ko同志，你的任务是找到油，不是处理地方关系！安保问题，自然有负责安保的同志去解决。你只需要告诉我，油，能不能采出来！”\n佩特连科看着地图上那几个鲜红的斑点，仿佛看到了未来可能涌出的黑色石油，也仿佛看到了随之而来的、难以预料的冲突和麻烦。"
 SWRW_RUS.89.a:0 "地下的财富往往与地上的纷争相伴。"
 SWRW_RUS.90.t:0 "开往山区的卡车"
 SWRW_RUS.90.d:0 "尘土飞扬的卡车车队在蜿蜒的山路上缓慢行驶，车厢里挤满了来自俄罗斯中部地区的移民家庭。他们带着全部家当——捆扎结实的铺盖卷、吱呀作响的旧木箱、还有几只被塞进笼子的鸡。孩子们的脸贴在车厢挡板的缝隙上，好奇又胆怯地望着窗外陌生的、连绵起伏的高加索山峦。\n瓦莲京娜紧紧搂着她的小儿子，心里充满了对未来的憧憬和不安。政府的宣传员把高加索描绘成了一个阳光明媚、物产丰饶、等待建设者去开垦的乐土。他们说，这里有肥沃的土地可以分配，有新建的工厂需要工人，国家还提供安家补贴。对于在梁赞老家土里刨食、一年到头也攒不下几个卢布的他们来说，这简直是天赐良机。\n可是，当卡车驶入一个看起来有些破败的达吉斯坦村庄时，迎接他们的并不是宣传画上那种热情洋溢的场面。一些穿着传统服饰的当地村民站在路边，用一种审视的、谈不上友好的目光打量着他们这些“外来者”。空气中弥漫着一种陌生的语言和食物的气息。村里的房子大多低矮陈旧，与宣传中描绘的“现代化新农村”相去甚远。\n负责安置的官员，一个同样显得有些疲惫的俄罗斯干部，把他们领到一排刚刚搭建好的、略显简陋的木板房前。“同志们，暂时先住在这里，”他指着房子说，“土地和工作岗位正在协调，很快就会安排好。大家要和当地同志搞好团结，互帮互助，共同建设我们伟大的家园！”\n瓦莲京娜看着那陌生的山、陌生的人、陌生的房子，心里有些发慌。这真的是他们梦想中的新家园吗？他们能在这里扎下根来吗？她不知道。她只知道，他们已经回不去了。"
 SWRW_RUS.90.a:0 "新的家园，是承诺，也是一场未知的迁徙。"
 SWRW_RUS.91.t:0 "市场里的低语"
 SWRW_RUS.91.d:0 "第比利斯市集，喧闹，拥挤，充满了各种香料、烤肉和廉价烟草混合的气味。尼古拉（同事们私下叫他“尼克”，但他更习惯别人叫他尼古拉·伊万诺维奇，尽管他的官方身份只是内务部一名不起眼的外勤探员），正假装漫不经心地挑选着一种当地特产的奶酪。他的任务是收集“不稳定情绪”的线索，说白了，就是听听老百姓私底下都在抱怨些什么。\n\n他穿着便装，努力让自己看起来像个刚到这里不久、对一切都感到新鲜的外地人。一个胡须花白、穿着传统丘尔卡服饰的格鲁吉亚老人，用锐利的眼神打量了他一番，然后用蹩脚的、带着浓重口音的俄语问：“也是…德国人？”\n\n尼克愣住了，手里的奶酪差点掉在地上。他快速地扫了一眼四周，还好没人注意到这边。“老人家，”他尽量让自己的语气平和，“德国人早就被打跑了。现在是新时代了。”\n\n老人哼了一声，没再说话，继续用那双阅尽世事的眼睛打量着他，眼神里充满了怀疑和一种难以言喻的疲惫。“旗子换了，人也换了，”过了一会儿，老人低声嘟囔，像是在自言自语，又像是说给他听，“可对我们这些石头来说，风往哪边吹，都一样要被磨。”\n\n尼克没有接话。他知道争辩毫无意义。对很多当地人来说，他们这些来自“中央”的俄罗斯人，和之前的德国占领者，似乎并没有本质的区别，都意味着外部的强权和自身命运的无法掌控。他付了钱，拿起奶酪，默默地挤出了人群。集市依旧喧嚣，但那句“你也是纳粹吗？”像一根小刺，扎进了他心里某个麻木已久的角落。这份工作…真是越来越没劲了。\n\n"
 SWRW_RUS.91.a:0 "标签易换，伤痕难消。"
 SWRW_RUS.92.t:0 "迷雾中的猎人"
 SWRW_RUS.92.d:0 "清晨的浓雾弥漫在车臣的山谷里，能见度不足十米。尼克和他的小分队正深一脚浅一脚地跋涉在湿滑的山路上，每个人都显得异常疲惫和警惕。昨晚的情报显示，一小股“民族主义武装分子”（上头现在都这么叫，听起来比“土匪”或者“叛乱分子”更…正式）可能藏匿在附近一个废弃的奥尔（高山村落）里。\n\n“头儿，这鬼天气，连山羊都看不见一只，更别说人了。”一个年轻的列兵抱怨道，他的呼吸在寒冷的空气中凝成了白雾。\n\n“闭嘴，阿尔谢尼！”尼克低声呵斥道，眼睛紧紧盯着前方若隐若现的山影，“越是这种天气，越容易出事。都把眼睛放亮点！”他自己也感到一阵烦躁。这鬼地方的山路比女人的心思还难懂，那些“武装分子”熟悉地形，就像狼熟悉自己的地盘。他们每次行动都像是大海捞针，而且这针还可能随时反咬一口。\n\n他想起了自己年轻时在白俄罗斯森林里打德国人的日子，也是这样钻林子，也是这样提心吊胆，只不过那时候他是猎物，现在成了猎人。讽刺的是，追捕和被追捕的感觉，竟然如此相似。都是在和恐惧、疲惫以及无处不在的危险作斗争。\n\n走到一处山脊时，带队的当地向导（一个沉默寡言、脸上刻着刀疤的家伙）突然停了下来，指了指下方雾气稍微稀薄处的一缕微弱的炊烟。“那里。”他只说了两个字。\n\n尼克立刻打出手势，小分队迅速散开，形成包围态势，然后开始小心翼翼地向下摸去。雾气中，只能隐约看到几座破败的石屋轮廓。空气中弥漫着一股烧湿柴火的味道，还有…一丝若有若无的火药味。他们知道，猎物可能就在前面。"
 SWRW_RUS.92.a:0 "雾浓，路滑，猎人亦是猎物。"
 SWRW_RUS.93.t:0 "空气中的硝烟"
 SWRW_RUS.93.d:0 "接近废弃奥尔的时候，雾气稍微散开了一些。尼克他们看到了几个人影在石屋间晃动，手里似乎拿着武器。没有警告，没有喊话，几乎是条件反射般，双方几乎同时开火了。\n\n枪声在山谷中炸响，打破了寂静，惊起一群寒鸦。子弹呼啸着从尼克耳边擦过，打在旁边的岩石上，溅起一片碎屑。他立刻卧倒，对着记忆中人影闪过的方向扣动了扳机。\n\n战斗短暂而激烈。对方显然没有预料到他们会来得这么快，而且火力也不如他们。几个回合的交火后，枪声渐渐稀疏下来。尼克打手势让两个士兵前去侦查，自己则和剩下的人提供掩护。\n\n不一会儿，士兵回报：敌人似乎撤退了，留下了两具尸体和一些散落的弹药，还有一堆尚有余温的篝火。“妈的，又让他们跑了！”年轻的列兵阿尔谢尼恨恨地踢了一脚地上的空弹壳。\n\n尼克检查了一下现场。死者穿着破旧的传统服装，武器是老式的莫辛纳甘和一把缴获的德制手枪。地上散落着一些吃剩的干粮和几张模糊不清的传单，上面印着一些他看不懂的车臣文字和某个他不认识的头像。他们想要打游击，但他们显然缺乏训练和装备。\n\n“搜集所有能带走的东西，尸体…就地处理掉。”尼克面无表情地下令。他看着远处层峦叠嶂的山脉，知道这只是暂时的平静。那些人像打不死的老鼠一样，藏在这些群山之中，随时可能再钻出来。“我们也许更有经验，武器更好，”他心里想，“但他们有这片山，还有…某种我们无法理解的愤怒。”他感到一阵深深的疲惫，不仅仅是身体上的。"
 SWRW_RUS.93.a:0 "硝烟散尽，只有群山依旧沉默。"
 SWRW_RUS.94.t:0 "办公室里的名单"
 SWRW_RUS.94.d:0 "格罗兹尼，内务部临时办公室。空气中弥漫着劣质烟草和积压文件发霉的味道。尼克正对着一堆厚厚的档案发愁。这些是从德国占领时期和当地伪政权手里接收过来的“合作者”名单和审讯记录，真假难辨，错综复杂。\n\n他的任务是根据这些材料，甄别出哪些人是“罪大恶极、必须清除”的死硬分子，哪些是“可以改造、为我所用”的机会主义者，哪些又是“被胁迫或信息不足、可以忽略”的普通民众。这是一个烫手的山芋，决定着无数人的命运，稍有不慎就可能制造新的冤案，或者放跑真正的危险分子。\n\n桌上的电话响了，是上级打来的。“尼古拉·伊万诺维奇，”电话那头传来一个不带感情的声音，“那份关于前‘山区自治政府’官员的处理意见，什么时候能出来？上面催得很紧，下周必须提交初步名单。”\n\n“正在加紧处理，主任同志，”尼克揉了揉酸胀的太阳穴，“材料太多太乱，很多证词互相矛盾，核实起来需要时间。”\n\n“时间不等人，伊万诺维奇！”对面的声音提高了一些，“稳定是第一位的！我们要尽快把那些‘不稳定因素’清理掉！当然，也要注意策略，争取分化瓦解，不要扩大打击面，引起不必要的恐慌。具体的…你自己把握。总之，下周一早上，我要在办公桌上看到名单！”\n\n电话挂断了。尼克看着面前堆积如山的档案，里面记录着一个个在高加索这片复杂土地上，在不同政权间挣扎求存的个体命运。有人为了活命而卑躬屈膝，有人为了利益而出卖同胞，有人在绝望中随波逐流，有人或许真的信仰过纳粹的“新秩序”… 他该如何用手中的这支笔，去划定那条通往生或者死的界线？他感到一阵无力和厌倦。"
 SWRW_RUS.94.a:0 "每一份档案背后，都藏着一个难以审判的灵魂。"
 SWRW_RUS.95.t:0 "夜晚的敲门声"
 SWRW_RUS.95.d:0 "深夜，格罗兹尼一条寂静的小巷里，几声急促而低沉的敲门声响起。屋里的油灯晃了一下，一个面色苍白的中年男人惊恐地望向门口。他的妻子紧紧抓着他的胳膊，身体不停地颤抖。\n\n门外传来一个低沉而冷静的声音，是标准的俄语：“阿斯兰·马戈梅多夫？开门，内务部的。”\n\n男人深吸一口气，强作镇定。“什么事？”\n\n“例行问询，快开门！”声音变得有些不耐烦。\n\n男人犹豫了一下，最终还是颤抖着手打开了门栓。门外站着两个穿着黑色皮夹克的便衣男子，其中一个赫然就是白天还在办公室里研究档案的尼克。他的眼神冰冷，没有任何表情。\n\n“跟我们走一趟。”尼克言简意赅。\n\n“我…我犯了什么事？”男人结结巴巴地问。\n\n“去了你就知道了。”另一个便衣上前一步，不容置疑地抓住男人的胳膊。\n\n“不！放开他！他什么都没做！”男人的妻子尖叫着扑上来，却被粗暴地推开。\n\n尼克没有理会女人的哭喊，只是示意同伴把男人带走。男人被推搡着，踉跄着走下楼梯，消失在夜色中。小巷里只剩下女人绝望的哭泣声和油灯在风中摇曳的微光。\n\n尼克靠在冰冷的墙壁上，点燃了一支烟。名单上的下一个名字，在城市的另一端。这是他今晚的第三个“目标”。他不知道这些人最终的命运会是什么——审判？劳改营？还是…别的？他只知道，这是他的工作，是维持“稳定”所必须付出的代价，或者说，让别人付出的代价。他吐出一口烟圈，烟雾在夜色中模糊了他的脸。"
 SWRW_RUS.95.a:0 "夜色正浓，敲门声在城市各处响起。"
 SWRW_RUS.96.t:0 "高架桥上的焊花"
 SWRW_RUS.96.d:0 "连接格鲁吉亚山区两座悬崖的巨大高架桥正在紧张地施工中。夜晚，工地上灯火通明，宛如白昼。刺眼的电焊弧光不时划破夜空，发出滋滋的声响，将正在桥面上作业的工人们的身影映照成一个个晃动的剪影。\n\n帕维尔，一个经验丰富的焊工，正全神贯注地将两根巨大的钢梁焊接在一起。火花四溅，灼热的气浪扑面而来。他戴着厚厚的防护面罩，只能透过深色的玻璃看到焊缝处那耀眼的熔点。这份工作需要极高的技巧和专注力，稍有差池，不仅影响工程质量，更可能危及生命。\n\n这座桥是“高加索交通干线现代化改造”计划的关键节点之一。建成后，将大大缩短山区与外界的通行时间，方便物资运输和人员往来。白天，他能看到桥下深邃的山谷和蜿蜒的河流，景色壮丽，但也令人心悸。\n\n休息时，帕维尔摘下面罩，露出一张被汗水和油污覆盖的脸。他从工友手里接过一个粗瓷缸子，里面是烫手的热茶。“真他娘的难搞，”他喘着粗气说，“这山里的风太大了，总把火苗吹歪。”\n\n“可不是嘛，”工友，一个来自斯摩棱斯克的年轻人说，“不过头儿说了，下个月通车典礼的时候，会有大人物来剪彩！到时候咱们可得露脸！”\n\n帕维尔笑了笑，没说话。他不太在乎什么大人物剪彩，他只希望这座桥能结结实实地立在这里，让山里的老百姓出行不再那么艰难，让孩子们上学不再需要翻山越岭。能亲手焊起这样一座连接天堑的大桥，这本身就足够让他自豪了。"
 SWRW_RUS.96.a:0 "钢铁巨龙正在跨越天堑。"
 SWRW_RUS.97.t:0 "五环旗下的雪道"
 SWRW_RUS.97.d:0 "索契，红波利亚纳滑雪场的建设工地上，一派热火朝天的景象。崭新的缆车支架正在安装，宽阔的雪道轮廓已经初步形成，几栋充满现代感的运动员公寓和酒店拔地而起。远处，黑海在阳光下闪闪发光。\n\n项目总工程师维克多·安德烈耶维奇，正拿着一卷巨大的规划图，对着一群来自莫斯科和本地的官员唾沫横飞地讲解着：“…按照国际奥委会的标准，这条高山速降雪道的落差和坡度都完全符合要求！还有这里，将是我们的主体育场，可以容纳五万名观众，开闭幕式将在这里举行！我们有信心，在1988年，向全世界展示一个全新的、充满活力的索契，一个现代化的、开放的…”\n\n官员们频频点头，脸上洋溢着兴奋和自豪。承办冬奥会，这不仅仅是一项体育赛事，更是一个向世界展示国家形象、吸引投资、促进发展的绝佳机会。巨大的宣传牌已经立在了工地的入口处，上面画着憨态可掬的吉祥物（一只叫“米沙”的棕熊，虽然好像和夏季奥运会的有点像？）和鲜艳的五环标志。\n\n然而，在一片乐观的氛围中，也有一些不和谐的声音。本地负责征地拆迁的官员低声向维克多抱怨：“工程师同志，滑雪场占用的那片山地，是当地山民世代放牧的地方，补偿款还没完全到位，有些人情绪不太稳定…” 负责物资供应的官员则愁眉苦脸：“维克多同志，从日本进口的那批造雪机还在海关卡着呢，没有外汇额度批不下来啊…”\n\n维克多有些烦躁地挥了挥手：“困难是暂时的，同志们！眼光要放长远！想想看，等到奥运会成功举办，全世界的目光都会聚焦在这里！这点小问题，总有办法解决的！关键是，不能耽误工程进度！1988年，索契必须惊艳世界！”他指着规划图上那个宏伟的主体育场，“为了这个目标，一切牺牲都是值得的！”\n\n"
 SWRW_RUS.97.a:0 "在雪道建成之前，先要推平一些东西。"
 SWRW_RUS.98.t:0 "高脚杯与烤全羊"
 SWRW_RUS.98.d:0 "第比利斯市中心，修复一新的歌剧院里灯火辉煌，一场庆祝高加索地区“初步完成重建”的盛大招待会正在举行。悠扬的格鲁吉亚传统音乐在水晶吊灯下回荡，穿着笔挺制服的官员、军官，以及少数几位穿着民族服饰、略显拘谨的当地“先进代表”，端着高脚杯，穿梭在人群中，互相寒暄、敬酒。\n\n宴会厅的长桌上摆满了丰盛的食物：香气四溢的烤全羊、各种口味的哈恰普里（奶酪面包）、色彩鲜艳的沙拉、还有据说是斯大林本人最爱的格鲁吉亚红酒。一切都显得那么和谐、繁荣，充满了“各民族兄弟般团结友好”的气氛。\n\n尼古拉·伊万诺维奇（我们的老朋友尼克探员），也被邀请参加了这场招待会，算是对他近期“维稳工作卓有成效”的一种表彰。他端着一杯红酒，站在角落里，有些不自在地看着眼前这幅景象。就在几周前，他还在某个尘土飞扬的山区审问“不稳定分子”，而现在，他却要和那些衣着光鲜的人一起，庆祝“初步完成重建”。\n\n他看到一个满脸皱纹、穿着传统阿塞拜疆长袍的老人，被几个官员簇拥着，有些不知所措地举着酒杯。据说这位老人是某个模范集体农庄的主席。尼克又看到一个穿着崭新西装、油头粉面的年轻人，正滔滔不绝地向一位高级官员介绍着某个“合资企业”的宏伟蓝图，眼神里闪烁着精明的算计。\n\n音乐依旧悠扬，酒杯不断碰撞。重建是真的，工厂在开工，道路在延伸，生活水平确实在提高。但尼克总觉得，在这片和谐的表象之下，依然涌动着各种复杂的、未曾真正解决的暗流。那些被他送走的人去了哪里？那些被“团结”起来的民族，内心深处又在想些什么？他喝了一口红酒，味道醇厚，却带着一丝难以言喻的苦涩。"
 SWRW_RUS.98.a:0 "酒杯举起，阴影藏在灯火辉煌处。"
 SWRW_RUS.99.t:0 "大学里的新面孔"
 SWRW_RUS.99.d:0 "埃里温国立大学的校园里，充满了青春的气息。修复后的教学楼窗明几净，林荫道上走过三三两两的学生，手里捧着书本，用亚美尼亚语和俄语热烈地讨论着什么。公告栏上贴满了各种讲座、社团活动和“支援边疆建设”的招募海报。\n\n历史系的大教室里，一位来自列宁格勒（当然，也许不叫这个名字了）的访问教授，正在讲授“俄罗斯各民族共同历史与未来展望”的课程。台下的学生构成复杂：有本地的亚美尼亚青年，也有不少新近从俄罗斯各地迁来的移民子女，甚至还有几个来自格鲁吉亚和阿塞拜疆的交换生。\n\n教授的声音洪亮而富有感染力：“…同志们，同学们！我们必须认识到，高加索的未来，乃至整个国家的未来，在于各民族的团结与融合！旧时代的隔阂与偏见，必须被彻底抛弃！我们要在一个统一的、强大的国家框架内，尊重彼此的文化传统，发挥各自的优势，共同创造一个崭新的、繁荣的‘新高加索’！”\n\n坐在后排的阿尔缅，一个土生土长的埃里温小伙子，一边听着，一边用铅笔在笔记本上涂鸦。他承认，生活确实比以前好了很多，至少不用担心战争和匮乏了。学校里也多了很多新面孔，带来了新的思想和活力。可有时候，听到那些过于宏大和整齐划一的口号，他心里还是会有些别扭。他的祖父曾告诉他，亚美尼亚有自己独特的历史和苦难，不是简单地用“兄弟民族”就能概括的。\n\n下课后，阿尔缅和一个名叫奥莉加的俄罗斯女孩一起走出教室。奥莉加是随着工程师父亲刚搬来不久的，对埃里温的一切都感到新鲜。“阿尔缅，你说教授讲的那个‘新高加索’，真的能实现吗？”她好奇地问。\n\n阿尔缅耸耸肩，望着远处亚拉拉特山模糊的轮廓。“谁知道呢？”他说，“也许吧。至少，我们现在可以在同一间教室里讨论这个问题了。”阳光洒在他们年轻的脸上，未来，像一本刚刚翻开的书，充满了未知，但也并非一片黑暗。"
 SWRW_RUS.99.a:0 "同一张课桌，不同的历史回响。"
 SWRW_RUS.101.t:0 "长椅上的日落"
 SWRW_RUS.101.d:0 "夕阳的金辉如同融化的蜂蜜，缓缓淌过第比利斯鳞次栉比的屋顶，将远处高加索雪山的峰峦染成一片瑰丽的绯红。市中心公园经过精心修葺，花坛里新植的玫瑰开得正盛，空气中弥漫着淡淡的甜香。长椅上，坐着两个沉默的身影。\n\n他们是尼古拉·伊万诺维奇和他自己内心那个疲惫的影子。不，旁边没有人，长椅空着，只有他自己，刚刚结束了一天乏味却又至关重要的文书工作，或者，也许是一场隐秘的审讯，又或者，只是一次平平无奇的街头巡视。他松开了领口的纽扣，那廉价的布料摩擦着皮肤，有些粗糙。公园里很安静，只有孩子们的笑声像清脆的铃铛，从远处传来，还有鸽子咕咕的叫声，以及城市在暮色中渐渐沉静下来的背景音。\n\n报告上写着：“高加索地区第一阶段重建工作顺利完成。社会秩序稳定，经济活动有序恢复，人民生活水平显著提高，民族关系基本和谐…”他亲自签过好几份这样的报告。数字是不会骗人的，对吗？修复的公路里程，新建的学校数量，增长的发电量，下降的犯罪率…是的，对比几年前的废墟和混乱，一切都看起来好多了。人们的脸上不再总是挂着恐惧和绝望，商店的货架也比以前丰满了许多。夜晚的灯火也确实更亮了。这毋庸置疑。\n\n他掏出一根烟，点燃，深深吸了一口。烟雾缭绕中，他看到一个拄着拐杖的老兵蹒跚走过，胸前隐约可见几枚旧勋章。他看到一对年轻的情侣依偎着走过，低声说着他听不懂的格鲁吉亚语。他看到几个穿着相似工装的工人有说有笑地走过，讨论着明天的班次和食堂的伙食。\n\n生活在继续，以一种近乎顽固的姿态，在瓦砾和新生的混凝土之间继续。这片土地吸收了太多的血，见证了太多的旗帜更迭，它有着自己古老的、难以被彻底“重建”的灵魂。\n\n“欸，尼克，”一个声音仿佛在他心底响起，也许是白天的疲惫引起的幻听，也许是某个被他遗忘的审讯对象的最后低语，“你说…我们的孩子们…将来会怎么样呢？”\n\n管他呢。他心里嗤笑一声，带着一种俄式特有的、混合着疲惫与坚韧的黑色幽默。老子自己都快二十年没正经谈过恋爱了，哪来的孩子？去他妈的孩子。滚吧。\n\n他感觉好像刚才真的有个人影坐在旁边，现在却像烟雾一样消散了。那是谁来着？是下午审问的那个“合作者”？还是昨天在山里击毙的那个“游击队员”的鬼魂？或者是…某个年轻时的、还相信着什么的自己？\n\n算了，哈哈哈。他低声笑了起来，有些干涩。重要吗？不重要了。\n\n夕阳完全沉入了远山之后，最后一抹光亮消失在天际。公园的路灯次第亮起，投下昏黄的光晕。明天又是新的一天，新的报告，新的任务，新的…生活。管他呢，天总会亮的。他站起身，掸了掸衣服上的烟灰，朝着自己那间小小的、安全的公寓走去。"
 SWRW_RUS.101.a:0 "就这样吧。晚安，高加索。"
 SWRW_RUS.102.t:0 "号角，自红墙吹响"
 SWRW_RUS.102.d:0 "古老的克里姆林宫红墙，在初升的朝阳下反射出一种深沉而坚定的光芒。积雪尚未完全消融，但空气中已能嗅到一丝解冻的气息。在某间刚刚修缮完毕、依然弥漫着新油漆味道的大厅里，收音机的指示灯亮起，一个沉稳、清晰、带着一丝难以掩饰的疲惫却又充满力量的声音，通过电波传向四面八方，传遍这片刚刚从战火与分裂中挣扎出来的广袤土地，甚至越过国界，传向了整个惊魂未定的世界。\n\n“俄罗斯各族人民！世界各地的朋友们！兄弟姐妹们！”\n\n“我们经历了深渊般的黑夜。法西斯的铁蹄践踏了我们的家园，分裂的刺刀刺穿了我们的心脏。饥饿、恐惧、屈辱、自相残杀……这些词语曾是我们生活的注脚。太多人失去了家园，失去了亲人，失去了希望。我们曾一度以为，这片伟大的土地将永远沉沦于黑暗之中。”\n\n“但是！”声音陡然拔高，带着一种压抑已久的呐喊，“我们没有屈服！俄罗斯的灵魂是不屈的！从冰封的北极苔原到顿河的滚滚波涛，从饱经蹂躏的斯摩棱斯克到饱览兴衰的喀山城，人民从未放弃！游击队的篝火在森林中燃烧，工厂的机器在炮火下轰鸣，母亲们用最后的黑面包喂养孩子，战士们用血肉之躯筑起长城！”\n\n“今天，我们站在这里，在克里姆林宫的红墙之下，向世界宣告：分裂结束了！暴政被推翻了！统一的俄罗斯，浴火重生！”\n\n“是的，我们伤痕累累，满目疮痍。重建之路漫长而艰辛。但我们不再孤单，不再分裂！城市将被重建，乡村将被复苏，工厂将再次轰鸣，田野将再获丰收！我们要治愈伤痛，弥合裂痕，让所有在这片土地上生活的人民，无论民族、无论信仰，都能享有和平、尊严与温饱！”\n\n“我们向世界伸出双手——不是乞求，而是邀请！邀请所有珍视和平、反对压迫的力量，与我们一道，建设一个更美好的未来！让克里姆林宫的钟声，敲响新时代的黎明！俄罗斯，醒来了！”\n\n广播里传来激昂的音乐声，取代了那个充满力量的声音。在遥远的村庄，在刚刚复工的工厂，在临时搭建的难民营里，无数人停下了手中的活计，默默地聆听着，眼中闪烁着泪光，或许是悲伤，或许是激动，或许…两者皆有。"
 SWRW_RUS.102.a:0 "天边的晨曦，已刺破漫漫长夜。"
 SWRW_RUS.103.t:0 "土路上的广播车"
 SWRW_RUS.103.d:0 "尘土飞扬的土路上，一辆漆着醒目红色标语（“国家关怀送到家”）的嘎斯卡车，正像一头笨拙的甲虫一样缓慢爬行。车顶架着一个大喇叭，车厢里坐着几个穿着制服、看起来有些疲惫的年轻人，他们是新成立的“城乡联系宣传工作队”的成员。他们的任务是将“来自中央的声音”和一些紧缺的物资（主要是盐、肥皂、火柴和宣传小册子）带到那些远离主要公路、几乎被遗忘的偏远村庄。\n\n今天他们要去的是一个叫“泥泞洼”的小村子，光听名字就知道路况有多糟糕。卡车陷了好几次，队员们不得不下来推车，弄得满身泥泞。年轻的队长伊利亚，一个刚从师范学院毕业的热血青年，看着窗外一望无际的、略显荒凉的田野和零星散落的茅草屋，心里有些打鼓。书本上描绘的“城乡紧密结合、工农携手并进”的景象，似乎和眼前的现实还有不小的距离。\n\n终于，卡车晃晃悠悠地驶进了“泥泞洼”。村子里静悄悄的，只有几条瘦骨嶙峋的狗警惕地叫了几声。一些穿着破旧衣服的村民从屋里探出头来，用一种混合着好奇、麻木和些许不信任的眼神打量着这些“城里来的人”。\n\n伊利亚清了清嗓子，打开车顶的大喇叭，开始播放预先录好的广播稿：“泥泞洼的乡亲们！党和国家没有忘记你们！我们给你们带来了关怀和温暖…”广播稿热情洋溢，承诺着未来的美好生活：新的道路、新的学校、拖拉机、化肥…\n\n村民们渐渐围了过来，但大多只是远远地站着，沉默地听着。一个头发花白的老太太颤巍巍地走上前，手里捏着一个鸡蛋：“好心人，能换点盐吗？家里快一个月没盐吃了。”\n\n伊利亚连忙让队员拿出盐来，硬是没收老大娘的鸡蛋。“大娘，这是国家免费发的！”他努力让自己的笑容看起来真诚。分发物资的时候，场面有些混乱，但很快就恢复了秩序。孩子们最高兴，他们拿到了一小块肥皂，觉得新奇无比。\n\n物资发完了，广播也放完了。卡车再次启动，准备前往下一个更偏远的村庄。伊利亚回头望着“泥泞洼”和那些站在村口目送他们的村民，心里五味杂陈。他们送去的物资也许只能解决几天的燃眉之急，广播里的承诺听起来也有些遥远。但至少，他们来了，带来了信息，带来了接触，打破了长久以来的隔绝。这也许就是意义所在吧。\n\n"
 SWRW_RUS.103.a:0 "最长的路，是通往人心的路。"
 SWRW_RUS.104.t:0 "假肢与康复中心"
 SWRW_RUS.104.d:0 "明斯克郊外，一座由旧军营改造而成的康复中心里，充满了消毒水的气味和各种器械发出的轻微声响。这里住满了在战争中失去肢体或落下其他严重残疾的退伍军人和普通平民。\n\n谢廖沙，一个二十岁出头的小伙子，正咬着牙，尝试着用他那条崭新的、略显笨拙的假腿走路。汗水顺着他的额角流下，每一步都像是踩在刀刃上。他是在基辅街头的巷战中被一发德国榴弹炸断了左腿的，醒来时，他已经躺在了后方医院，那个曾经能让他飞奔、踢球的左腿永远地消失了。\n\n康复中心的技师安娜（她的丈夫也在前线牺牲了）耐心地扶着他，鼓励着他。“再来一次，谢廖沙！步子迈稳一点，对，就这样！你做得很好！”安娜的声音温柔而坚定。\n\n隔壁的房间里，几个老兵正在学习使用假手写字或者做一些简单的手工活。一个曾经是狙击手的老人，现在只能用钩子般的假手笨拙地穿针引线。空气中弥漫着一种混合着痛苦、沮丧和顽强希望的气氛。\n\n晚上，谢廖沙躺在宿舍的床上，看着天花板发呆。窗外传来其他康复者活动的声音和偶尔压抑的哭泣声。他想念他的腿，想念奔跑的感觉，想念和伙伴们一起踢球的日子。他也害怕未来，一个只有一条腿的人，能做什么呢？还能找到工作吗？还能娶妻生子吗？\n\n安娜走进来，给他端来一杯热牛奶。“睡不着？”她轻声问。\n\n谢廖沙点了点头。\n\n“别灰心，谢廖沙，”安娜坐在他的床边，“你还年轻，失去一条腿不是世界末日。国家需要你，虽然不是在战场上，但在工厂里，在田地里，都需要你。这里会教你新的技能，会给你安装最好的假肢。你会重新站起来，重新生活的。”她的眼神里充满了真诚和一种经历过苦难才有的力量。\n\n谢廖沙看着安娜，又看了看床边那条冰冷的假腿。也许她说得对。伤痛是真实的，失去是永恒的，但生活，总得继续下去。明天，他还要继续练习走路，一步一步，重新学习如何站立在这片土地上。"
 SWRW_RUS.104.a:0 "即使步伐蹒跚，也要走向明天。"
 SWRW_RUS.106.t:0 "河边的窝棚"
 SWRW_RUS.106.d:0 "伏尔加河冰冷的河风吹过岸边临时搭建的窝棚区，带来刺骨的寒意。瓦尔瓦拉紧了紧身上那件破旧的男式外套，试图把蜷缩在她怀里的小儿子伊万裹得更紧一些。他们来自遥远的乌拉尔地区，那里发生了可怕的冲突和饥荒，他们一路向西逃难，希望能在这片据说已经“恢复秩序”的土地上找到生路。\n\n这里聚集着来自四面八方的人：像他们一样逃难的俄罗斯人，被战争裹挟至此的中亚牧民，从德国集中营里侥幸逃脱的犹太幸存者，还有一些身份不明、眼神警惕的流浪汉。大家说着不同的语言，有着不同的过往，唯一的共同点就是贫穷、饥饿和对未来的茫然。\n\n旁边窝棚里传来一阵激烈的争吵声，似乎是为了争夺一点取暖的木柴。瓦尔瓦拉低下头，不敢去看。这里的秩序很脆弱，时常有冲突发生，官方的救济站人满为患，发放的食物根本不够吃。她不知道他们还能在这里撑多久。丈夫在逃难路上就病死了，现在只剩下她和伊万相依为命。\n\n一阵脚步声传来，一个穿着制服、但看起来同样疲惫不堪的政府工作人员走了过来，手里拿着一个登记簿。“姓名？来自哪里？有没有特殊技能？”他公式化地问道，甚至没有抬头看瓦尔瓦拉。\n\n瓦尔瓦拉报上了名字和来历，至于技能…她摇了摇头，她只会种地和操持家务。工作人员在本子上划了几笔，然后指了指不远处一个冒着黑烟的巨大建筑群：“明天去那里报到，城里的纺织厂需要人手。管饭，也许还有住的地方。”说完，没等瓦尔瓦拉道谢，就匆匆走向下一个窝棚。\n\n瓦尔瓦拉望着那片巨大的厂区，心里既害怕又有一丝希望。去工厂？她从没进过工厂，不知道那是什么样的地方。但至少，有饭吃，有地方住，也许…也许伊万能活下去。"
 SWRW_RUS.106.a:0 "在这片土地上，首先要活下去。"
 SWRW_RUS.107.t:0 "纺织厂的机器声"
 SWRW_RUS.107.d:0 "纺织厂的车间里震耳欲聋，上千台老旧的织布机同时运转，发出如同瀑布般的巨大噪音。空气中弥漫着棉絮、机油和汗水的味道。瓦尔瓦拉和其他几十个新来的女工一起，正在一位面无表情的女工头的指导下，学习如何操作这种看起来复杂而危险的机器。\n\n线头断了要快速接上，梭子卡住了要立刻处理，稍有不慎就可能被卷动的机器伤到手指。这对瓦尔瓦拉来说太难了，她习惯了田野的开阔和泥土的实在，而这里的一切都让她感到眩晕和压抑。汗水顺着她的脸颊流下，和棉絮粘在一起，又痒又难受。\n\n旁边那个同样是新来的鞑靼族姑娘，看起来比她更不适应，已经弄坏了好几把梭子，被工头狠狠骂了一顿，眼圈都红了。瓦尔瓦拉想安慰她几句，但巨大的噪音让她连自己的声音都听不清。\n\n每天工作十二个小时，中间只有半小时吃饭时间。食物是黑面包、菜汤和偶尔一点点咸鱼。宿舍是大通铺，几十个人挤在一个房间里，空气污浊，鼾声此起彼伏。工资很低，勉强够她和伊万糊口。\n\n但这已经是她能找到的最好的去处了。至少，这里有遮风挡雨的屋顶，有定量的食物，伊万也被送到了厂区的托儿所，虽然那里的条件也很简陋，但至少安全。她想起在河边窝棚里那些忍饥挨饿、前途未卜的日子，咬了咬牙，继续专注于眼前飞速运转的机器。她必须学会，必须坚持下去。"
 SWRW_RUS.107.a:0 "机器吞噬着线，也吞噬着时光。"
 SWRW_RUS.108.t:0 "搬迁通知"
 SWRW_RUS.108.d:0 "瓦尔瓦拉刚下班，拖着疲惫的身体回到拥挤的宿舍，就看到墙上贴着一张新的通知。她不识字，便拉住同宿舍一个识字的俄罗斯姑娘：“卓娅，这上面写的什么？”\n\n卓娅念给她听：“通知：为支援国家重点工程建设，优化劳动力资源配置，经上级研究决定，从我厂抽调部分职工及家属，前往…西伯利亚新建库兹巴斯联合钢铁厂工作。被抽调人员名单如下…”\n\n名单很长，卓娅念了好一会儿，终于念到了瓦尔瓦拉的名字。\n\n“去…西伯利亚？”瓦尔瓦拉的心猛地一沉。她好不容易才在这里找到一点安稳，现在又要被连根拔起，送到那个传说中冰天雪地、荒无人烟的地方去？“为什么是我？”\n\n“通知上说，优先抽调…呃…‘社会关系简单，无本地牵挂’的人员。”卓娅有些同情地看着她，“还有，会优先考虑有在农村生活经验，能吃苦耐劳的同志…”\n\n瓦尔瓦拉明白了。像她这样的寡妇，带着一个孩子，无亲无故，正是最容易被“优化配置”的对象。她仿佛又回到了逃难的路上，身不由己，被一股巨大的力量推着向前走，去往一个完全未知的方向。\n\n“不去行不行？”她颤抖着问。\n\n卓娅摇了摇头：“通知上说，这是国家的需要，是光荣的任务。拒绝的话…后果会很严重。”\n\n那天晚上，瓦尔瓦拉抱着伊万，一夜无眠。她不知道西伯利亚是什么样子，不知道钢铁厂的工作有多么危险，不知道他们能不能适应那里的气候。她只知道，他们又要上路了。她紧紧搂着儿子，仿佛这是她唯一能抓住的、真实的东西。"
 SWRW_RUS.108.a:0 "大地的广阔，有时意味着无处可逃。"
 SWRW_RUS.109.t:0 "地窖里的幽灵"
 SWRW_RUS.109.d:0 "“里面没人了？”上尉彼得罗夫擦了擦额头的汗，对着刚从那栋废弃农舍地窖里钻出来的两个士兵问道。这里是距离莫斯科不远的一个小村庄，情报显示可能藏匿着一个潜逃的、前党卫军“维京”师的低级军官。\n\n“报告长官！空的！只有一些发霉的土豆和几只死老鼠。”一个士兵回答，掸了掸身上的灰尘。\n\n彼得罗夫皱了皱眉。这已经是他们根据那份不可靠的线报搜查的第三个地点了。战争结束这么久了，那些纳粹余孽就像鬼魂一样，要么早就逃之夭夭，要么就藏得比兔子还深。抓捕他们纯粹是碰运气。\n\n“撤吧，”他挥了挥手，正准备下令离开，突然听到地窖深处传来一阵微弱的响动。所有人都立刻警觉起来，举起了武器。\n\n“谁在那里？！出来！不然我们开枪了！”彼得罗夫厉声喊道。\n\n过了好一会儿，一个极其瘦弱、衣衫褴褛、几乎看不出人形的老头，双手举过头顶，颤颤巍巍地从黑暗中走了出来。他眼神空洞，嘴里喃喃着听不懂的语言，似乎是德语，又似乎不是。\n\n士兵们立刻上前将他控制住。搜身之后，只在他贴身的口袋里找到一张模糊不清的、似乎是家人的照片，背面写着几个无法辨认的字母。\n\n“他是谁？是我们要找的人吗？”彼得罗夫问随行的当地向导，一个沉默寡言的老猎人。\n\n老猎人仔细辨认了一下，摇了摇头：“不像。看样子像是在林子里躲了很久的疯子，也许是哪个溃败的德国兵，或者…别的什么人。”\n\n彼得罗夫看着这个像幽灵一样的俘虏，心里感到一阵厌烦。“带上他，回去交给上面处理。”他说。不管是真正的纳粹余孽，还是战争留下的可怜虫，都已经不重要了。重要的是完成任务，把这些“不稳定因素”从地图上抹去。"
 SWRW_RUS.109.a:0 "战争的幽灵，有时会穿着最破烂的衣服。"
 SWRW_RUS.110.t:0 "地质锤下的回响"
 SWRW_RUS.110.d:0 "“所以，德米特里·伊万诺维奇，这石头底下真能敲出坦克来？”列兵萨沙搓着冻得通红的手，看着面前这位胡子拉碴、像刚从熊洞里钻出来的地质学家。他们正站在乌拉尔山脉某处人迹罕至的山坡上，寒风刮得人生疼。\n\n德米特里·伊万诺维奇没有直接回答。他用粗糙的手指抚摸着那块泛着金属光泽的矿石样本，眼神狂热得像个发现了圣杯的信徒。“坦克？萨沙，我的孩子，这比坦克带劲多了！这是镍，是钨，是造炮管和穿甲弹的好东西！有了这个，我们的‘铁拳’才能砸碎那些西方资本家和东方武士的乌龟壳！”他从怀里掏出祖传的银酒壶，猛灌了一口自酿的烈酒，呛得眼泪直流。\n\n“战争打完了，教授，”萨沙小心翼翼地提醒他，“我们现在需要的是拖拉机和盖房子的钢筋。”\n\n“战争永远不会真正结束，萨沙！只要还有帝国主义，还有剥削！”地质学家挥舞着地质锤，唾沫横飞，“我们要把这里的每一块石头都变成射向敌人的子弹！我们要让这沉睡的山脉为我们伟大的祖国贡献出它最后的宝藏！”他环顾四周，只有呼啸的风和几个同样冻得瑟瑟发抖、眼神迷茫的士兵。\n\n“可…我们连把这些石头运下山的卡车都没有几辆。”萨沙小声嘀咕。\n\n“会有的！一切都会有的！”地质学家大手一挥，仿佛他一声令下，钢铁洪流就能立刻开进山谷。“报告上就这么写：发现战略级稀有金属矿藏！潜力巨大！建议不惜一切代价进行开采！为了祖国的强大！”他扛起地质锤，像个打了胜仗的将军，“走！回去喝热汤！明天接着挖！为了我们伟大的…嗯…反正就是挖！”\n\n"
 SWRW_RUS.110.a:0 "山知道，石知道，我们为何在此挥汗如雨。"
 SWRW_RUS.111.t:0 "矿坑里的德语字母"
 SWRW_RUS.111.d:0 "图拉南部的矿区，曾经是“莫斯科总督辖区”重要的煤炭供应地。现在，矿井提升机的嘎吱声再次响起，只是操作机器的和下井挖煤的，都换成了俄罗斯人的面孔。鲍里斯，前拖拉机手，现在的矿区生产调度员，正对着一份写满了德语和俄语双语标注的旧矿井图纸发愁。\n\n“这帮德国佬挖得可真够深的，”一个满脸煤灰的老矿工凑过来看了一眼，“有些巷道，连他们自己都不知道通到哪儿去了，就像老鼠洞一样。”\n\n“上面的命令，要把所有能用的矿层都恢复生产，”鲍里斯叹了口气，“不管是谁挖的，现在都是我们国家的财富了。可是你看这图纸，好多地方都标注着‘危险’或者‘积水’，还有些地方画着骷髅头…谁敢下去？”\n\n旁边的年轻工程师小声说：“我听技术科的人说，德国人撤退的时候，可能在一些废弃巷道里动了手脚…设置了陷阱或者…别的什么。”\n\n鲍里斯心里一紧。这矿井不仅仅是出煤，还可能藏着危险。“加强安全检查！”他立刻下令，“下去的人必须两人一组，带上瓦斯检测仪！任何可疑的地方立刻上报！我们是来挖煤建设国家的，不是来给德国鬼子陪葬的！”\n\n矿工们的神情也严肃了起来。他们知道，脚下这片土地，即使在解放之后，依然残留着战争的阴影和危险。每一次下井，不仅仅是和岩石、煤层打交道，也是在和一段黑暗的历史博弈。矿灯在黑暗的巷道中摇曳，照亮了斑驳的岩壁上依稀可见的德语字母标记，仿佛无声地诉说着过往的罪恶与当下的风险。"
 SWRW_RUS.111.a:0 "挖出的煤是黑色的，但我们燃烧它为了光明。"
 SWRW_RUS.112.t:0 "河岸边的白杨树"
 SWRW_RUS.112.d:0 "伏尔加河中游，巨大的拦河大坝工程正在如火如荼地进行。推土机、挖掘机、载重卡车川流不息，将河岸改造成一个巨大的工地。计划中，这里将形成一个巨大的人工湖，下游将建设 强大的水力发电站，为周边地区的工业和农业提供电力和灌溉用水。\n\n老渔夫伊万·库兹米奇坐在自家小船上，最后一次撒下了渔网。他的小木屋，连同整个世代居住于此的渔村，很快就要被上涨的河水淹没了。政府给了他们一些补偿款，承诺在新建的移民点给他们分配新房子，还说以后可以在水库里养鱼。\n\n但他还是舍不得。舍不得这条养育了他和他祖先的河流，舍不得岸边那几棵看着他长大的老白杨树，舍不得傍晚时分河面上氤氲的水汽和归巢水鸟的鸣叫。这一切，很快就要沉入水底，变成地图上一个新的蓝色区域和一个发电量的数字。\n\n远处传来震耳的爆炸声，那是工程队在清理河床。伊万叹了口气，开始收网。网里只有几条小鱼，还有一些水草和淤泥。他望着浑浊的河水和对岸那座正在飞速隆起的水泥堤坝，心里空落落的。\n\n他知道，国家需要电，需要水利，需要发展。个人的情感和留恋，在“改造自然，造福人民”的宏大口号面前，显得那么微不足道。可他就是想不通，为什么一定要用这种方式？难道就不能给河流和生活在河边的人们，多留一点空间吗？船桨划破水面，载着老人和他的最后一点渔获，慢慢驶向即将消失的家园。那几棵老白杨树在风中摇曳，仿佛在做着最后的告别。"
 SWRW_RUS.112.a:0 "河流改道，人心是否也能随之转向？"
 SWRW_RUS.113.t:0 "起重机下的新地标"
 SWRW_RUS.113.d:0 "莫斯科市中心，曾经被战火摧残的区域，如今正以惊人的速度改变着面貌。巨大的起重机像钢铁长颈鹿一样，将预制的混凝土构件吊装到正在拔地而起的现代化高楼骨架上。宽阔的马路正在铺设，新的地铁线路也在紧张地施工。\n\n安娜·伊万诺夫娜，一位在附近百货公司工作了几十年的老售货员，每天上下班都要经过这片巨大的工地。她还记得这里战前的样子，那些典雅的老建筑，那些充满生活气息的小巷。战争把它们变成了瓦砾堆。现在，瓦砾被清理干净，取而代之的是这些方方正正、线条简洁、看起来千篇一律的新式楼房。\n\n“真气派啊！”和她同行的年轻同事莉娜感叹道，眼睛里闪烁着对未来的憧憬，“听说以后这里会有电影院、溜冰场，还有卖外国货的商店呢！等建好了，一定要来看看！”\n\n安娜只是笑了笑，没有说话。她承认，新楼房看起来是更“现代化”，也更宽敞明亮。告别那些阴暗潮湿的老房子是件好事。可是，她总觉得这些新建筑缺少了点什么，缺少了那种时间和人情味沉淀下来的韵味。走在这些宽阔笔直、但彼此相似的大街上，她有时会感到一丝陌生和迷失。\n\n她怀念过去那个有点拥挤、有点混乱，但却充满生活气息的老莫斯科。那个可以在街角小店买到刚出炉的热面包，可以和邻居在院子里一边晒被子一边聊天的莫斯科。现在，一切都在变得更大、更快、更…标准。这是进步吗？也许是吧。但她心里，总有一小块地方，在怀念着那些被起重机和推土机永远抹去的、属于过去的莫斯科印记。"
 SWRW_RUS.113.a:0 "新的城市正在崛起，它将通往何方？"
 SWRW_RUS.114.t:0 "阿尔巴特的吉他声"
 SWRW_RUS.114.d:0 "阿尔巴特大街正在缓慢地苏醒。一些门面被重新粉刷，挂上了新的招牌——有国营书店，有合作社咖啡馆，甚至还有一家挂着“艺术沙龙”牌子的小画廊，虽然里面陈列的作品大多是风景画和符合“主旋律”的人物肖像。\n\n傍晚时分，一个留着长发、穿着旧牛仔裤的年轻人，抱着一把掉了漆的旧吉他，坐在街边的长椅上，自弹自唱起来。他唱的是一首带着淡淡忧伤和迷茫的民谣，歌词隐晦地提到了失去、寻找和对未来的不确定。他的歌声并不算洪亮，技巧也谈不上精湛，但那略带沙哑的嗓音和真挚的情感，却吸引了几个路人驻足倾听。\n\n其中有刚下班的工人，有穿着制服的学生，还有一个戴着眼镜、提着公文包、看起来像是知识分子的人。大家都没有说话，只是静静地听着。吉他声和歌声在初夏的晚风中飘荡，和远处传来的汽车喇叭声、行人的说笑声混合在一起，构成了一幅有点奇特，却又无比真实的阿尔巴特黄昏图景。\n\n一个穿着灰色风衣、眼神锐利的便衣男子（也许是负责维持秩序的，也许是别的什么人）在不远处站了一会儿，最终什么也没做，转身走开了。\n\n年轻人唱完了最后一首歌，拨动了一下琴弦，发出一个悠长的尾音。没有人鼓掌，但那个知识分子模样的人走上前，往他打开的吉他盒里放了几张小面额的卢布。“唱得不错，”他低声说，“很久没听到这样的歌了。”年轻人抬起头，对他露出了一个腼腆而感激的微笑。夜色渐浓，阿尔巴特大街的霓虹灯开始闪烁，照亮了这条正在寻找自己新声音的古老街道。"
 SWRW_RUS.114.a:0 "在主旋律之外，总有低声吟唱。"
 SWRW_RUS.115.t:0 "涅瓦河畔的低语"
 SWRW_RUS.115.d:0 "“彼得格勒…不，列宁格勒…现在又该叫什么了？”叶夫根尼·安德烈耶维奇，一位头发花白的老教授，站在修复后的冬宫广场上，望着对面被战火熏黑、但依然屹立的海军部大厦尖顶，喃喃自语。这座城市的名字，就像它的命运一样，在历史的风云中几经变换。现在，官方似乎倾向于恢复“圣彼得堡”这个旧称，但对像他这样经历过围困和饥饿的老一辈来说，“列宁格勒”这个名字，早已和城市的灵魂融为一体，刻骨铭心。\n\n他的学生，一个名叫卡佳的活泼女孩，挽着他的胳膊。“教授，别想那么多了。名字只是个符号，重要的是这座城市正在重生，不是吗？您看，涅瓦大街上的商店都开门了，剧院也开始演出了！”\n\n叶夫根尼点了点头。是的，城市在以惊人的速度修复着战争的创伤。被炸毁的桥梁重新连接，被炮弹削去尖顶的教堂正在搭建脚手架，涅瓦河上再次出现了游船的踪影。可他总觉得，在这复苏的表象之下，有一种难以言说的疲惫和被忽视的委屈。\n\n相比于首都莫斯科得到的资源倾斜，这座英雄城市得到的关注似乎太少了。许多重要的文化遗址修复缓慢，科研机构的经费依然紧张，围困时期留下的后遗症——无论是生理上的还是心理上的——也远未得到充分的抚慰。“莫斯科在欢庆胜利，在规划宏伟的未来，”他在心里叹息，“可他们是否还记得，我们在这里流了多少血，忍受了多少饥饿和寒冷？”\n\n卡佳似乎看出了他的心思。“教授，前几天学校组织我们去皮斯卡廖夫公墓献花了，”她轻声说，“我们不会忘记的。这座城市，永远是我们的骄傲。”\n\n叶夫根尼看着女孩清澈而坚定的眼神，心里感到一丝暖意。也许，希望就在这些年轻人身上。他们没有经历过最黑暗的岁月，但也承载着这座城市的记忆和精神。只要记忆还在，只要涅瓦河还在静静流淌，圣彼得堡（或者叫列宁格勒）的呼喊，就终究会被听见。\n\n"
 SWRW_RUS.115.a:0 "河水记得每一次潮起潮落。"
 SWRW_RUS.116.t:0 "实验室里的窃窃私语"
 SWRW_RUS.116.d:0 "泽列诺格勒，莫斯科郊外这个被指定为未来“科学城”的地方，一间刚建成的、窗户上还贴着保护膜的实验室里，几个年轻的工程师正围着一台从“友好国家”进口（或者说，拆解复制）的计算机样机，小声地争论着。\n\n“这个逻辑门的设计明显有缺陷！信号干扰太严重了！”一个戴着深度近视眼镜、头发乱糟糟的小伙子激动地说，手里挥舞着一张画满复杂电路图的纸。\n\n“可是瓦洛佳，我们没有更好的替代方案！进口的原件太贵了，而且根本搞不到！我们只能用现有的国产元件凑合着改进！”另一个年纪稍长、看起来更稳重些的工程师反驳道。\n\n“凑合？凑合能搞出世界一流的芯片吗？能追上美国佬和日本人吗？上面可是下了死命令，要我们尽快拿出成果，实现‘硅晶之梦’！”瓦洛佳涨红了脸。\n\n实验室的负责人，一位沉默寡言、据说曾在某个绝密核物理研究所工作过的中年专家，走过来拍了拍瓦洛佳的肩膀。“冷静点，同志们。饭要一口一口吃，路要一步一步走。我们底子薄，起步晚，这是事实。但我们有头脑，有干劲，还有…国家的全力支持。”他指了指墙上贴着的标语：“自力更生，奋发图强，赶超世界先进水平！”\n\n“可光有口号有什么用？设备不行，材料不行，连稳定的电源都保证不了！”瓦洛佳依然不服气。\n\n“所以才需要我们去创造条件，去克服困难！”负责人斩钉截铁地说，“当年搞原子弹的时候，条件比现在差多了，不也搞出来了吗？日本人能做到的，我们俄罗斯人凭什么做不到？我们或许不能完全复制他们的路，但我们可以走出自己的路！”他的话语中有一种不容置疑的自信和韧性。\n\n工程师们渐渐平静下来，重新围在样机旁，开始讨论改进方案。窗外，新的实验大楼正在建设中，夕阳的余晖给这片充满希望和挑战的土地镀上了一层金色。"
 SWRW_RUS.116.a:0 "在二进制的世界里，从0到1并不容易。"
 SWRW_RUS.117.t:0 "母亲山岗上的凝望"
 SWRW_RUS.117.d:0 "伏尔加河畔，马马耶夫山岗。巨大的“祖国母亲在召唤”雕像经过修复，再次高举着利剑，矗立在城市的制高点上，俯瞰着脚下这座从瓦砾堆中重生的英雄之城——伏尔加格勒。\n\n退休老工人伊万·彼得罗维奇，每周都会爬上这座山岗，来到这片寂静的、埋葬着无数烈士的纪念墓地。他会在一块无名烈士墓碑前放上一束野花（那是他偷偷从公园里采的），然后坐在一旁的石阶上，默默地抽一支烟，望着山下的城市和蜿蜒流淌的伏尔加河。\n\n他几乎认识这里埋葬的每一个人——不是名字，而是他们的故事。他们曾是他的战友，他的邻居，他的亲人。他们在这片土地上战斗、牺牲，用生命换来了这座城市的今天。山下的城市变化很大，新的工厂建起来了，新的居民区出现了，街道也变宽了。报纸上说，伏尔加格勒正在成为国家重要的工业和交通枢纽，未来一片光明。\n\n但伊万总觉得，这座城市的声音，似乎有些被遗忘了。人们更多地谈论生产指标、建设计划，谈论莫斯科的新政策，谈论未来的美好生活。而那些关于坚守、关于牺牲、关于这座城市所代表的、不屈不挠的精神力量的讨论，似乎越来越少了。孩子们知道斯大林格勒保卫战，但他们知道当年在这里挨饿、受冻、直面死亡是什么滋味吗？他们知道这座城市的每一块砖石下，都可能埋藏着英雄的骸骨吗？\n\n他有时会对着那些无名的墓碑低声倾诉，就像和老朋友聊天一样。告诉他们山下的变化，告诉他们自己的担忧。风吹过山岗，发出呜咽般的声音，仿佛是那些逝去的灵魂在回应。伏尔加格勒不能仅仅是一座工业城市，它应该永远是俄罗斯民族精神的灯塔，它的声音——那关于牺牲、坚韧和不屈的声音——应该被永远铭记，永远传扬。"
 SWRW_RUS.117.a:0 "河水东流，英雄之名永不磨灭。"
 SWRW_RUS.118.t:0 "教科书里的争论"
 SWRW_RUS.118.d:0 "莫斯科教育部，历史教材编纂委员会的会议室里，气氛有些紧张。桌子上堆满了各种历史文献、档案摘录和教材草稿。委员们——有德高望重的历史学家，有来自军队的政工干部，也有教育部负责意识形态的官员——正围绕着新版中小学历史教科书中关于“卫国战争与国家统一”部分的叙述方式，进行着激烈的争论。\n\n“我认为，我们必须如实地反映战争的残酷性，包括我们初期遭受的巨大损失和某些指挥上的失误，”一位戴着老花镜的老教授，语气恳切地说，“只有正视历史，才能吸取真正的教训。”\n\n“如实反映？”旁边一位肩章上缀着将星的军官皱起了眉头，“那是不是也要写某些部队的溃败和投敌行为？也要写后方的混乱和某些错误的决策？这会动摇年轻一代对我们事业的信心！我认为，我们应该更侧重于英雄主义、人民的抵抗和最终的伟大胜利！”\n\n“可过度美化历史同样危险！”另一位来自大学的学者反驳道，“那会让我们忘记过去的伤痛，重蹈覆辙！我们不能只讲胜利，不讲代价！”\n\n“代价固然要讲，但主旋律必须是光明的，是积极向上的！”教育部负责意识形态的官员敲了敲桌子，试图控制场面，“历史是为现实服务的！我们现在的首要任务是凝聚人心，巩固统一，激发人民的爱国热情和建设国家的积极性！教材必须体现这一点！”\n\n争论陷入了僵局。如何叙述那段复杂的、充满伤痛与荣耀的历史？哪些应该被铭记，哪些应该被淡化，哪些又应该被重新解读？这不仅仅是一个学术问题，更是一个关乎国家认同和未来走向的政治问题。窗外的阳光正好，但会议室里的空气却显得有些沉重。最终的定稿，将深刻地影响整整一代人对过去的认知，以及对未来的想象。"
 SWRW_RUS.118.a:0 "在历史的长河中，我们都在寻找自己的倒影。"
 SWRW_RUS.119.t:0 "流水线上的交响"
 SWRW_RUS.119.d:0 "乌拉尔地区某座新建的、巨大的联合工厂里，数条不同的生产线正在以前所未有的规模和效率运转着。从原料入口到成品出口，各个环节被精确地计算和连接起来，构成了一幅宏大而复杂的工业图景。这里集中了原本分散在周边几个小型工厂的设备和工人，统一进行管理和生产。\n\n伊戈尔，原来是其中一个小厂的技术骨干，现在是这条崭新的轴承生产线的工段长。他站在高处的控制室里，俯瞰着下方繁忙而有序的流水线。机器的轰鸣声、传送带的转动声、金属的摩擦声，汇成了一首独特的、属于工业时代的交响乐。\n\n集中化带来的好处显而易见：原材料统一采购，降低了成本；生产流程标准化，提高了效率和产品质量；工人集中管理，方便了培训和调配。报表上的数字非常亮眼，产量节节攀升，废品率持续下降。上级领导对此非常满意，已经把这里树立为“工业现代化改革的典范”。\n\n但伊戈尔心里也有些隐忧。过去在小厂的时候，大家彼此熟悉，像个大家庭，有什么问题可以随时沟通解决。现在，工人数百上千，彼此陌生，管理层级也多了起来，官僚主义的味道越来越浓。一个小的技术革新想法，要层层上报，等批下来，黄花菜都凉了。工人们更像是流水线上可替换的零件，而不是活生生的人。那种过去小厂里充满人情味的“作坊精神”正在消失。\n\n他看到一个年轻工人因为操作失误，被班组长严厉地训斥着，周围的人都低着头，假装没看见。伊戈尔皱了皱眉，拿起对讲机：“三号线班长，注意工作方法，要耐心指导新同志。”效率是提高了，但人与人之间的距离，似乎也变远了。这真的是他们想要的“现代化”吗？他不知道。他只知道，这首流水线上的交响乐，还将继续轰鸣下去。"
 SWRW_RUS.119.a:0 "巨大的机器运转着，发出规则而冰冷的声音。"
 SWRW_RUS.120.t:0 "集市上的尼龙袜"
 SWRW_RUS.120.d:0 "伊兹迈洛沃集市，曾经只是个交换黑面包和土豆皮的场所，如今却像是被施了魔法般活了过来。阳光穿透修补过的玻璃顶棚，照亮了琳琅满目的摊位：堆积如山的香肠（虽然大部分还是用土豆粉和不明肉类混合制成，但至少看起来像香肠了），颜色鲜艳得有些失真的印花布，还有…天呐，是崭新的尼龙长筒袜！\n\n老裁缝叶甫盖尼·帕夫洛维奇，颤抖着手，拿起一双薄如蝉翼的玻璃丝袜子，对着阳光仔细端详。他简直不敢相信自己的眼睛。就在几年前，别说尼龙袜了，连一截像样的棉线都很难找到。那时候，人们穿着打满补丁的旧军装，用桦树皮搓绳子，冬天靠烧家具取暖。而现在…商店的橱窗里摆上了收音机和新式样的水壶，街上跑着涂着亮漆的小汽车（虽然还是不多，而且大多是公家的），连隔壁面包房的黑面包都好像没有以前那么掺沙子了。\n\n“怎么了，老爹？”旁边卖二手军靴的小伙子萨沙凑过来，嘴里叼着根烟，“看上这娘们儿玩意儿了？准备买回去给你家老婆子一个惊喜？”\n\n叶甫盖尼放下袜子，摇了摇头，又点了点头。“是啊，萨沙，是惊喜…也是惊吓。”他抚摸着自己那件依然打了好几个补丁的外套，“这一切来得太快了，快得让人心里发慌。昨天我们还在瓦砾堆里刨食吃，今天就能买到尼龙袜了？这钱…是真的吗？这些货…是从哪儿冒出来的？”\n\n萨沙耸耸肩：“管他呢！有钱赚，有货卖，日子能过下去，不就行了？上面的人说了，这是‘经济奇迹’！是咱们俄罗斯人勤劳肯干，国家政策好！你就偷着乐吧，老爹！”\n\n叶甫盖尼看着萨沙年轻而无忧无虑的脸，又看了看集市上熙熙攘攘、脸上带着希望与茫然的人群。也许萨沙说得对，日子确实在变好，快得像一场不真实的梦。工厂在招工，工资在上涨，曾经空荡荡的货架正在被慢慢填满。这“奇迹”背后是什么？是更聪明的计划，是更拼命的劳动，还是…别的什么他不知道的力量？他不去想了。他掏出攒了几个月的、皱巴巴的卢布，小心翼翼地数出几张，买下了那双尼龙袜。也许，他的老伴穿上它，会真的感到高兴吧。在这好得有些不真实的世道里，一点小小的、真实的快乐，总是好的。"
 SWRW_RUS.120.a:0 "或许，我们真的可以期待明天吃上黄油面包？"
 SWRW_RUS.121.t:0 "仰望星辰"
 SWRW_RUS.121.d:0 "修复后的莫斯科国立大学主楼，在傍晚的霞光中重新展现出它那既雄伟又带着一丝压迫感的轮廓。塔尖上的红星被重新擦亮，在暮色中闪烁着微光。\n\n安德烈，建筑系大三的学生，正和他的同学奥莉加一起，坐在主楼前的广场台阶上，对着速写本快速地勾勒着这座庞然大物的线条。\n\n“真是不可思议，不是吗？”奥莉加停下笔，感叹道，“它这么高，这么大，像一座山一样。当年建成的时候，肯定耗费了无数人力物力。”她的语气里既有赞叹，也有一丝不易察觉的复杂情绪。\n\n“是啊，”安德烈也放下了铅笔，靠在冰凉的石阶上，“我爷爷就参与了这里的建设，他说那时候条件非常艰苦，很多人都累倒在了工地上。”他顿了顿，“后来…德国人来了，据说他们也把这里当成了他们的某个重要指挥部。墙壁上现在还能找到当年留下的弹孔和涂鸦的痕迹，虽然都被小心地修复了。”\n\n这两座“姐妹”建筑，连同其他几座散落在莫斯科各处的高塔，像沉默的巨人，见证了这座城市乃至这个国家最动荡、最辉煌也最痛苦的岁月。它们是某个时代雄心壮志的象征，是强权意志的体现，也是无数普通人汗水甚至鲜血的凝结。如今，战争结束了，旗帜更换了，它们依然矗立在那里，像历史留下的一道道巨大而无法磨灭的问号。\n\n“老师说，现在有计划把其中几座改建成高级酒店或者办公楼，吸引外资，”奥莉加轻声说，“你觉得…合适吗？”\n\n安德烈没有立刻回答。他仰望着那高耸入云的塔尖，上面那颗星辰在越来越深的夜空中显得格外明亮。“谁知道呢，”他最终说，“也许，它们不再需要代表某个主义或者某个领袖了。也许，它们可以就只是…建筑。是这座城市天际线的一部分，提醒我们从哪里来，也要去往哪里。”他重新拿起铅笔，“至少，它们还在那里，让我们能够仰望。”\n\n"
 SWRW_RUS.121.a:0 "循此苦旅..."
 SWRW_RUS.122.t:0 "我回来了，母亲"
 SWRW_RUS.122.d:0 "瓦季姆，三十六岁，前步兵中士，现在是…一个终于可以被称为“莫斯科居民”的人。他站在红场上，身边是熙熙攘攘的人流，脚下是磨得光滑的石板路。鸽子在他脚边盘旋，远处传来圣瓦西里大教堂洋葱顶下悠扬的钟声。阳光温暖地洒在他的脸上，驱散了西伯利亚战俘营留下的最后一丝阴冷。\n\n二十年。整整二十年。他离开莫斯科时还是个毛头小子，满怀着保家卫国的热血，跟着部队一路向西，然后…就是溃败，包围，被俘。在冰冷的西伯利亚，在无尽的苦役和饥饿中，他几乎以为自己再也回不来了。莫斯科，成了他记忆中一个遥远、模糊、却又无比温暖的梦。那里有他童年玩耍的院子，有母亲做的罗宋汤的味道，有第一次偷偷拉女孩子手的河岸。\n\n现在，他回来了。可眼前的莫斯科，既熟悉，又陌生。红场依然在那里，克里姆林宫的红墙依然巍峨，可瓦西里大教堂的色彩似乎黯淡了些，上面还留着弹片擦过的痕迹。古姆百货大楼的橱窗不再空空如也，摆上了一些他从未见过的、花花绿绿的商品。街上的行人穿着更整洁了，表情也不再像过去那样总是紧绷着，但眼神深处，似乎都藏着一些不愿被触碰的伤痕。\n\n他沿着熟悉的街道漫无目的地走着，试图寻找记忆中的家。那条狭窄的小巷还在，但原本的木头房子已经不见了，取而代之的是一栋崭新的、看起来毫无特色的赫鲁晓夫楼。他在那栋楼前站了很久，直到一个好奇的小孩跑过来问他找谁。\n\n他没有回答，只是慢慢地转过身，朝着莫斯科河的方向走去。河水依然在静静流淌，倒映着两岸修复中和新建起的建筑轮廓。河风吹拂着他的脸，带着这座城市特有的、混杂着尘土、汽车尾气和某种新生活的气息。\n\n他走到河岸边，脱掉那双陪伴他穿越了半个俄罗斯的旧军靴，赤脚踩在还带着凉意的土地上。泥土柔软而坚实。他缓缓地弯下腰，伸出那双布满老茧和伤疤的手，轻轻地抚摸着脚下的土地。\n\n就是这里。无论它变成了什么样子，无论它经历了多少苦难，这里，就是家。这里是莫斯科，是俄罗斯的心脏，是他魂牵梦萦二十年的地方。\n\n他抬起头，望着眼前这条熟悉而又陌生的河流，望着这座正在苏醒、正在努力摆脱噩梦的城市。他知道，有太多的东西失去了，永远也找不回来了。他的青春，他的战友，他记忆中的那个家…但至少，他回来了。他还活着。这片土地还在。\n\n他深深地吸了一口气，仿佛要将这片土地的气息全部吸入肺腑。然后，他张开双臂，仿佛要拥抱这条河流，拥抱这座城市，拥抱这片饱经沧桑却又充满韧性的土地。他像一个迷途已久的孩子，终于扑进了母亲的怀抱，泪水无声地滑落，浸润了脚下这片承载了他所有记忆与希望的土地。他拥抱着这片大地，像下定了什么决心一样。他要在这里活下去，要看着这座城市真正地好起来，要弥补那些失去的岁月。"
 SWRW_RUS.122.a:0 "此心安处，便是吾乡。"
