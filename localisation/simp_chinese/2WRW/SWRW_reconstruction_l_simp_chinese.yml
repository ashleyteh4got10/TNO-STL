 RUS_commie_soul_and_heart: "良心和灵魂"
 RUS_commie_soul_and_heart_desc: "仅仅重建物质是不够的，更重要的是重建精神家园。经历了数十年的分裂、暴力和道德沦丧，俄罗斯的“良心”蒙上了厚厚的尘埃，“灵魂”也变得疲惫不堪。我们需要重新找回那些被遗忘的价值观：诚实、互助、责任、同情。公开面对过去的错误，抚平历史的创伤，惩治罪恶，褒扬善良，让公平正义的阳光重新照耀这片土地，重塑民族的道德脊梁。"

