 RUS_democratic_fair_election_desc: "§W长久以来，由于俄罗斯共和国处于长期的动荡之中，我们未能组织起行之有效的选举流程，从而让我们的民主政权长期深陷于一方独大，腐败猖獗的困境当中。为了同国内强大的反对以及独裁势力作斗争，《公平选举法案》应运而生。F\n\n《公平选举法案》旨在确保俄罗斯共和国选举流程中的公正性、透明性和平等性。通过优化选举流程，普及选举设施，来扩大全国各地选民的参与。同时鼓励普通民众参与政治资助，以此来减少所谓“大金主”对选举流程的操纵。此外，通过设立禁止歧视性政策优化俄罗斯历史上那些长期被边缘化的群体的投票权，确保这些群体的投票能够计入最终结果。并设立独立委员会监管各选区的投票流程以防止党派操纵。\n\n诚然，民主并非一蹴而就，但《公平选举法案》将会是俄罗斯共和国迈向这一切的第一步，哪怕反对的呼声和其他的挑战愈来愈烈。"
 RUS_democratic_DEI_desc: "§W作为一个新生的国家，俄罗斯过去因为曾接连不断的战争和长期的分裂而导致整个社会产生巨大的裂痕。而《多元平等包容法案》的出现旨在将这种裂痕缝合，并铸造一个多元化、平等和包容的新俄罗斯。\n\n多元化将倡导对个体间差异的关注，涵盖种族、性别、年龄、宗教、身体能力等诸多方面， 以此来赋予整个国家更多不一样的色彩。\n\n平等则并非简单给予所有人相同待遇，而是充分考虑个体差异和需求，通过公平的政策、制度和资源分配，确保每个人都拥有平等的发展机会，并致力于消除因种族、性别等因素导致的系统性障碍。\n\n包容需要着重营造一个让所有人都能感受到被尊重、被接纳、被重视的环境，无论其背景如何，都能在这个国家自由表达其观点、充分发挥其才能，让其对祖国拥有强烈的归属感和幸福感 。"
 RUS_democratic_clean_water_desc: "§W曾几何时，为了一味地追求经济和工业的发展，俄罗斯共和国的水资源健康被极大的忽视，最终急速成长为威胁国家发展的首大环境问题。\n\n作为环境改造计划的组成部分，《水污染控制法案》将再度聚焦于俄罗斯的水资源健康，通过严格的污染物排放管制和湿地保护措施，强制减少工业和生活污水对河流、湖泊的污染，最终达到大部分水域恢复“可渔猎、可游泳”的状态。\n\n此外，《水污染控制法案》还赋予公众公民诉讼权，以此强化法律执行力度，推动政府和企业履行环保责任。"
 RUS_democratic_green_industry_desc: "§W要想将一个长期被雾霾笼罩的国家重见蓝天，工业——这个维持着每个国家生命的钢铁之心就必须着上绿色的外衣。\n\n《绿色工业法案》作为俄罗斯历史上最大的环境改造计划的核心组成部分，一方面将通过阶梯式税收抵免和政府直接拨款，显著降低钢铁、化工等高碳行业技术改造成本；另一方面建立技术中立原则和动态调整机制，既保障企业自主选择减排路径，又能定期优化政策效果。\n\n考虑到俄罗斯工业体系中重工业占比极大的诟病，《绿色工业法案》还提出通过设置相应的工业监管机构来保证方案的顺利进行，并先行在部分工业领域中采取试点的方法来探讨该领域绿色化转型的可行性。\n\n"
 RUS_democratic_free_religious_desc: "§W俄罗斯的土地如此宽广——正因为如此，她将形形色色怀揣有不同宗教信仰之人囊括其中，但随之而来的战乱和压迫让这种宗教兴盛之象一度灭绝。\n\n《宗教自由恢复法案》的核心优点在于其开创性地确立了"严格审查标准"，为俄罗斯宗教自由提供了前所未有的司法保护。该法案要求共和国政府必须证明其对宗教实践的任何限制同时满足两个刚性条件：一是存在"压倒性的政府利益"（如公共安全等最高优先级理由），二是所采取的手段必须是"限制性最小的方式"。从而显著提高政府干预宗教活动的法律门槛，并让宗教在政府的监管下再度走向繁荣发展。\n\n"
 RUS_democratic_immigration_freedom_act_desc: "§W随着俄罗斯共和国的外交状况得到改观，俄罗斯不必再向过去那样通过封闭来保护自己，为此新出的《移民与国籍法案》则标志着俄罗斯移民政策进入历史性转折点。\n\n首先，《移民与国籍法案》取消了对德国、日本等地的因意识形态而产生的歧视性限制，促成俄罗斯走向多元文化社会；其次， "亲属移民优先"制度，将鼓励本国外籍亲属来到本国进行移民，以此保证移民社区的稳定性；最后，设立职业移民类别，特别是为高技术人才开辟通道，吸引更多科研人员来此定居。\n\n此外《移民和国籍法案》还将"难民庇护"纳入常设条款，允许接纳政治避难者，以帮助更多生活于水深火热国家之人寻得一席安身之地。\n\n"
 RUS_democratic_fair_work_desc: "§W毋庸置疑的是，俄罗斯共和国的伟大胜利离不开其治下千千万万的劳动人民，他们为了祖国奉献自己的一切，却仍然只能依靠微薄的薪水养家糊口。\n\n《公平劳动法案》以"劳动价值必须获得合理对价"的现代劳资伦理为基础，通过系统性制度设计重塑了现代劳资关系，并构建起对劳动者的三重保障机制即：\n\n确立了全国性最低工资标准和加班工资制度；\n\n实施严格的童工禁令，强行降低14岁以下儿童劳动参与率，从根本上改变俄罗斯的人力资本发展模式；\n\n新设立联邦劳动监察体系，授权劳工部直接追讨欠薪并实施惩罚性赔偿，\n\n除此之外还额外附加了"覆盖范围动态扩展"机制，能够通过后续修订逐步将诸如农业工人、家政服务者等弱势群体纳入保护，从而切实提升受益劳动者比例。\n\n"
 RUS_democratic_anti_spy_desc: "§W随着来自各方的威胁与日俱增，新通过的《国家安全法案》成为俄罗斯共和国保卫国家安全的坚实盾牌。\n\n《国家安全法案》将对俄罗斯共和国的威胁分为如下几类：\n\n一、诸如工会和纳粹残余势力这类政治实体造成社会动荡的国家内部政治问题\n\n二、外国势力干涉与间谍渗透等地缘政治战略竞争问题\n\n三、移民所引起的治安管理问题和跨国有组织犯罪等国际问题\n\n针对这些诸多威胁，俄罗斯共和国将分别采取不同的应对措施，必要时可以采取诉诸武力的方式来保卫国家安全。f\n\n此外《国家安全法案》还强调，可以根据未来政治形势对法案中的“威胁”部分定义进行进一步修改和划分。\n\n"
 RUS_democratic_sp_med_desc: "§W对于一个民主国家而言，共产主义的泛滥是灾难性的，如果想在事态完全不可控前挽回这一切，俄罗斯共和国必须直面来自共产主义的威胁。\n\n《应对共产主义威胁特别修正案》将工会等共产主义政治实体的渗透单独列为对国家威胁巨大的意识形态斗争问题。并赋予政府在面对此类威胁时可以获得逾越于大部分法律限制的权力，同时在相应部门中应设立特殊机构，以便对此采取非常规手段。\n\n此外，如果仍有关于此类威胁的法案需要通过，将会使用新制定的政治流程来保证能够对共产主义采取精确而迅猛的打击。\n\n"
 RUS_democratic_sp_edu_desc: "§W鉴于当前的特殊形势，《反间谍特别修正案》不得不将这种意识形态斗争推上顶峰。\n\n《反间谍特别修正案》通过政治、经济和文化三个方面以对共产主义进行外科手术式的打击，同时将任何同共产主义相关的活动定义为威胁国家安全的间谍活动。\n\n政治上，全面取缔现有工会和政党等共产主义政治实体，摧毁其原先建立起的政治骨架，与之相关的政治议案进行相关调整；经济上，对现有被认为有“共产主义”之嫌的经济政策进行相应调整，对原共产主义政治实体的资产进行没收与调整；文化上，严禁任何与共产主义相关的政治宣称，在教育领域弱化共产主义的存在，以确保其不会对青少年造成影响。\n\n令人惋惜的是，虽然民主化进程因此受到阻碍，但这也是迈向未来的必由之路。\n\n"
 RUS_democratic_anti_comm_desc: "§W《国家安全法案》将工会原有的框架彻底撕碎，从而导致各地工人的权益不再向以前一样能够得到保障，而《工会组织法案》将会是对这一切的一个补偿性措施。\n\n《工会组织法案》强调过去共产主义势力对工会影响过于深刻，并因工会自治权利过高导致社会生产被过度搁置。为此，新工会将在政府监督下进行重组，并会较之前取消更多的特权，来确保工人们在有效表达其诉求时能够继续维持社会的正常运作。\n\n同时《工会组织法案》多次强调新公会必须在政府的批准许可下才能正常运作，否则其行为将被视为违法。\n\n"
 RUS_democratic_new_union_tt_desc: "§W作为反制共产主义计划的一部分，《特别医疗保障法案》将对共产主义者及其同情者采取更为严厉的惩罚措施。\n\n《特别医疗保障法案》通过法律手段强行剥夺了该群体受医疗保障的权利。政府通过筛查确认起身份并将其拉入各医院黑名单中且禁止医院为其提供服务，但保留了其在受到致命伤害时能够被抢救的权利。\n\n当然，在经过政府审查合格后，该群体可以通过向政府申请以重新获得医疗保障的权利。\n\n"
 RUS_democratic_big_antispy_desc: "§W与《特别医疗保障法案》相同，《特别教育法案》的针对群体同样是共产主义者及其同情者们。\n\n《特别教育法案》严格限制了该群体及其子孙后代的受教育权利，政府通过筛查确认起身份并将其拉入各学校黑名单中且禁止学校为其提供服务或设立专门的教育机构仅仅对其开展有限教育，同时正在进行教育的个体将会被强制驱离其受教育机构。\n\n同理，在经过政府审查合格后，该群体可以通过向政府申请以重新获得教育的权利。\n\n"
 RUS_democratic_worker_power_desc: "§W《公平劳动法案》虽给予劳动者以足够的安全保障，但由于劳动者法律意识淡薄，导致劳动者的诸多权利未能有效落实，而《劳动者权利法案》将填补此处空白。\n\n《劳动者权利法案》跳离传统赋权的思维，转而通过对社会氛围的改造激发劳动者对于维权的热情，通过前瞻性的制度设计，构建起更为全面的劳工权益保障体系。\n\n工会作为整个环节的重要实体，政府将给予其更多资源用以培养劳动者维权意识，同时扩大其权利，避免其受到企业的过多牵制。同时，为劳动者开辟一条特殊的维权通道，减少维权的麻烦性。最后，建立起严格的企业审查制度，政府对没有切实保护劳动者权利的企业给予重点观察，并处于巨量罚款。\n\n"
 RUS_democratic_union_union_desc: "§W如今的事实证明工会对俄罗斯的经济发展百利而无一害，但如果想充分挖掘出工会的所有潜能，现如今的政策是远远不够的，而《工会自治法案》将会为工会提供一个更大的舞台。\n\n《工会自治法案》在先前政策的基础上赋予工会完全独立的地位，政府和企业同工会的关系转而成为合作与被监督。工会的领导也不再是强制由政府或企业的成员组成，而是鼓励劳动者自行投票选出，同时对于工会间联合的问题也因此放开，国家方面则成立国家总工会负责维持其与工会间的关系。\n\n不过，考虑的现如今俄罗斯共和国的工会发展尚不成熟，《工会自治法案》实施后政府仍将对工会进行有限管理，直到大部分工会能够完全自治，并承担起维护劳动者权益和社会公平正义的责任。\n\n"
 RUS_democratic_improve_work_enviro_desc: "§W如果将自然当作社会的载体，那么人便是构建整个社会支架，如果只关注环境问题而忽视了人的健康，那么社会的发展便难以为继。《职业安全与健康法案》决心改变这种情况，其核心主要涉及以下三点：\n\n一、建立起"生物-心理-社会"全维度风险评估框架，强制企业每季度对物理环境、化学暴露等多项指标进行监测，并配套动态阈值调整机制；\n\n二、设立"环境改善联合基金"，通过税收优惠激励企业将更多利润投入防护设施升级，同时要求企业必须配备相应的工作环境风险评估人员；\n\n三、赋予劳动者"断开权"——下班后有权拒绝加班，违者企业将向劳动者赔偿巨额损失费。\n\n《职业安全与健康法案》的目的不仅仅是实现劳动者健康，在政府的长远眼光看来，这将是为未来企业的腾飞发展的奠定基石。\n\n"
 RUS_democratic_work_wage_desc: "§W在《公平劳动法案》颁布后，对于劳资关系的进一步落实仍因为部分企业实际情况存在一定困难而难以为继。\n\n以《公平劳动法案》为基础的《国家劳资关系法案》仍是以"劳动价值必须获得合理对价"的现代劳资伦理为基础，并以此构建起更富有弹性和平衡性的劳资关系治理体系，其核心优点在于其所谓的"双轨制集体谈判"框架，既保留传统行业级谈判确保基础权益，又创新设立企业级弹性协商空间，使高科技企业能定制股权激励等特殊条款。对于实际情况过于困难的企业，则可以向政府申请补贴来补偿劳资关系方面的不足。\n\n在政府的构想中，在强化劳资关系中的劳动方后，通过弥补资本方在这方面的不足，才能在劳资关系中找到一个双赢的平衡点。\n\n"
 RUS_democratic_fair_work_re_desc: "§W在历经《劳动者权利法案》、《工会自治法案》、《平等就业机会法案》、《职业安全与健康法案》和《国家劳资关系法案》的奠基后，俄罗斯共和国确立一个较为完善的劳动法体系，而《修订公平劳动法案》作为上述所有集大成者，将成为一部真正符合俄罗斯共和国国情的劳动法。\n\n《修订公平劳动法案》从最低保障标准、集体谈判制度、反歧视保护网络、职业安全体系和弹性适应机制五个方面补齐了此前俄罗斯共和国《公平劳动法案》的种种缺陷，而其既防止"社会失灵"又避免"制度僵化"的设计，得以建立起一个劳动与资本双赢、社会与个体相得益彰的新型劳动氛围。\n\n《修订公平劳动法案》作为俄罗斯共和国迈向进一步民主化的重要标志，在此之上，一个公平、民主与自由的新俄罗斯将在劳动者们的缔造下迈向真正属于她的未来。\n\n"
 RUS_democratic_new_union_new_desc: "§W在俄罗斯共和国焕然一新的工会体系中，集体劳动权益得到了前所未有的保障与强化。工会如今在《修订公平劳动法案》的庇护下得以蓬勃发展，确保所有劳工活动与国家经济发展目标保持一致。通过立法，工会获得了更大的协商权力，能够直接参与并监督企业决策，保障工人获得公平的工资与安全的工作环境。这一制度不仅提升了生产效率，还确保了劳工阶层的整体福祉，使俄罗斯共和国的工会在维护社会稳定与推动经济进步中发挥了核心作用。"
 RUS_democratic_road_road_desc: "§W俄罗斯共和国的大部分国土广阔而荒芜，而连接全国的交通干线更是寥寥无几。为了加强全国间的交流，雄心勃勃的政府仿照美利坚合众国的高速公路网络，建立起自莫斯科至马加丹的庞大城市高速公路网。\n\n在俄罗斯政府的规划中，所有道路资源都将由国家交通中心统一调度，而自莫斯科辐射至其西部的血管将重新打通俄罗斯共和国的经济脉络，再度将整个国家牢牢缝合起来——互为一体，不再分离。\n\n"
 RUS_democratic_internet_desc: "§W俄罗斯，庞大而富有。不幸的是，她的庞大确为其带来不便，宽广的国土如同臃肿的躯体，任何现代化的交通工具在其看来不过是缓慢蠕动的蛆虫——似乎没有什么事物能够在其上建立起极速的通道，除了……\n\n互联网\n\n对于往日的俄罗斯共和国来说，互联网似乎是那么遥不可及，只能是那些世界强国才能够拥有的产物。但今非昔比，随着俄罗斯共和国屹立于“世界岛”的中央，其财力物力足以支撑起一个庞大的、追赶全球步伐的'互联网'计划。\n\n'互联网'计划被纳入未来的核心战略工程，作为推动国家经济发展建设的重要技术工具，其发展必须严格遵循"生产优先、集体共享"原则，最终为俄罗斯共和国塑造一个足以令全世界惊叹的“超强大脑”。\n\n"
 RUS_democratic_fast_urbaniztion_desc: "§W在俄罗斯共和国未来的规划中，“高效”二字毋庸置疑成为规划的中心。无论是工业还是农业，都需要一颗强力的心脏来为其驱动——劳动力、科技和资本则是这颗心脏的组成，而真正能够塑造它的，唯有一座现代而繁华的城市。\n\n这正是政府选择加速城市化的原因，如果俄罗斯共和国想要全心全意拥抱未来，她就必须塑造其国土上的每一个小小光斑——在夜晚的地球上，明亮而闪耀。\n\n"
 RUS_democratic_industry_reform_desc: "§W如何评价俄罗斯的工业——可以称之为“仅有工业筋骨却无血肉的躯体”。如果想让俄罗斯共和国"既保持工业筋骨又长出血肉"\n\n"工业改革计划"中，重工业与轻工业的发展被系统性地重新定位为"技术升级与民生改善并重"的战略工程。重工业部门将实施"军事-民用一体化"改造，所有军工企业必须将部分产能转向民用机械制造，并由工会设立相关部门监督转型过程；同时轻工业发展采取"需求导向"原则，在根据各地区的实际情况，按需生产商品。\n\n当未来某日，俄罗斯的工业能够找到一个完美的平衡时，整个国家将无惧任何风险，从容面对一切风浪。\n\n"
 RUS_democratic_green_industry_check_desc: "§W有血有肉的钢铁之躯并不能以此对抗来自自然的衰老。正因如此，可持续发展模式必须俄罗斯工业不可或缺的一部分。\n\n从“绿色工业检查计划”的视角来看，要想打赢这场环保战争，离不开国家的实时监管和工会的直接监督。但更多的是需要企业的自觉遵守——从减排成效到资源循环利用率，任何一个细致的角落都不能被放过。在这场波及全社会的蓝天绿水保卫战中，这或许将会是为俄罗斯千千万万的子孙后代留下的最后机会了。\n\n这一切如同为一副健康躯体去割下一块坏死的肉：与割肉时的短痛相比，面临全身肌肉的坏死则要可怖得多。\n\n"
 RUS_democratic_new_industry_community_desc: "§W如果想要构建其一个更富有特色和前景的城市，那就必须摒弃传统的城市空间格局，而“工业化社区”将会是这座城市不可或缺的一部分。\n\n在俄罗斯共和国所构想"工业化社区"中，传统工厂模式将被彻底重构为"生产-生活-生态"三位一体的新型工业社区——每个工业社区以核心工厂为中心，半径数公里范围内整合居住区、技术学校和生态农场，形成自给自足的社会生产单元。\n\n而当这些社会生产单元串联于一体，则将会缔造一场无可匹敌的工业盛宴。\n\n"
 RUS_democratic_new_technology_community_desc: "§W科技——作为第一生产力，如今却面临着脱产的风险：看似先进的科研成果在历经千百次实验和手续后，到了工厂当中却成为了昂贵且无用的一叠废纸，所为此花费的昂贵资源也因此变得一文不值。\n\n在"高新科技社区"计划中，高等教育与产业创新被重构为劳动者集体主导的"学研产用"一体化体系。每个社区由三大核心构成：高等教育机构、联合创新中心和技术转化机构。其运行机制强调通过工人集体将科研成果快速转化成可行的实践劳动成果，从而让"高等教育真正回归劳动本源"。\n\n"
 RUS_democratic_liber_gender_desc: "§W在俄罗斯，弱势群体在就业中仍然会受到不公的待遇，为了为社会织起一张反歧视保护网络，《平等就业机会法案》应运而生。\n\n《平等就业机会法案》禁止基于民族、宗教、年龄、性别（含怀孕）或国籍的就业歧视，倡导男女同岗同酬，允许对薪资差异提起集体诉讼；要求企业为残障与高龄员工提供"合理便利"；同时将怀孕视为临时残疾，雇主需提供同等带薪病假或为其调整工作条件；此外，对于不同宗教信仰和国籍者，企业被要求对这类群体提供特殊照顾。"
 RUS_democratic_cyberpunk_desc: "§W俄罗斯共和国正经历着一个唤作"赛博朋克1977"的辉煌时代中，科技与资本的交融催生出一个表面光鲜的乌托邦：霓虹闪烁的高楼大厦直插云霄；宽敞发达的公路网络连接四方；先进强大的互联网络覆盖全国……\n\n在这片技术乐观主义浪潮下，俄罗斯共和国屹立于世界之巅——她的经济欣欣向荣、她的文化百花齐放、她的体制民主公正、她的人民欢欣鼓舞。若论这世上还有何国家能与之争辉，恐怕美利坚合众国也与其难分秋色。\n\n纵然潘多拉魔盒在无尽的繁华之下蠢蠢欲动，但这一切又有何干？就在此让俄罗斯共和国握住它所赠予的法宝，不顾一切地冲向未来吧！这就是属于俄罗斯的世纪！\n\n用三级调的脚步来舞动吧！世界会为你数着节拍！统一而伟大的俄罗斯！"


