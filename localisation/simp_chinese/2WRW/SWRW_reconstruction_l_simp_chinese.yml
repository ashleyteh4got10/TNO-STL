 SWRW_RUS.348.t: "黑土地上的白面包"
 SWRW_RUS.348.d: "奥伦堡草原的风依旧凛冽，但米哈伊尔的心头却不像往年那般冰冷刺骨。他刚刚从村合作社领回了这个月的配给——一袋沉甸甸的面粉，几块冻得像石头的土豆，还有一小罐标签模糊、内容物可疑的“军用”甜菜根。与军阀混战时期相比，这简直称得上是盛宴了。那时候，所谓的“配给”更像是一种嘲讽，能不能领到全看当地头目的心情，以及你是否足够幸运没被拉去填战壕。\n\n米哈伊尔拖着麻袋走在泥泞的土路上，心里盘算着。统一了，这是好事。电台里天天播放着激昂的进行曲，宣讲着“伟大复兴”和“光明未来”。报纸（如果能弄到的话）上也印着领导同志们视察工厂、与工人亲切握手的照片，承诺要让拖拉机像蘑菇一样遍布田野。听起来都挺美。\n\n可现实呢？米哈伊尔摸了摸干瘪的口袋，里面除了几枚叮当作响的铜板，别无他物。是，配给是有了，可那面粉白得可疑，吃起来像锯末，跟战前自家磨的黑麦粉差远了。拖拉机？他倒是见过一次，冒着黑烟停在区委大院里，像个生锈的铁疙瘩，据说零件得从几千俄里外运过来，猴年马月才能修好。至于什么“科学种田”、“先进技术”？村里的老农叶菲姆大爷嗤之以鼻：“先进？就是让咱们把祖宗传下来的种子换成那些娇贵的、离不开化肥的玩意儿！化肥在哪儿？问问天上飞的乌鸦吧！”\n\n晚饭时，米哈伊尔的妻子娜塔莎用那“白得可疑”的面粉烙了几个硬邦邦的饼子。就着寡淡的土豆汤，一家人默默地吃着。儿子小瓦西里好奇地问：“爸爸，电台里说我们现在生活好起来了，是真的吗？”\n\n米哈伊尔嚼着那味同嚼蜡的饼子，看着儿子清澈的眼睛，一时语塞。他能说什么？说比起邻村那些被某个短命军阀屠戮殆尽的可怜人，我们确实“好”多了？说比起冬天只能啃树皮的日子，现在能吃到锯末味的面包已经是“进步”了？他最终只是含糊地嗯了一声，把剩下的饼子塞进嘴里，然后猛灌了一口劣质伏特加——这玩意儿倒是比以前更容易买到了，大概是因为生产武器剩下的边角料能酿酒吧。\n\n“至少……”米哈伊尔打了个嗝，带着浓烈的酒精气味，“至少现在晚上睡觉，不用担心外面有人放炮仗了。安静多了。”\n\n娜塔莎叹了口气，收拾着空盘子。“安静是安静了，可地还是那块地，天还是那个天。伟大复兴的路，对咱们这些泥腿子来说，长着呢。”\n\n米哈伊尔没再说话，只是望着窗外漆黑的、一望无际的黑土地。统一是统一了，但对他们这些面朝黄土背朝天的贫农来说，伟大的事业似乎总在遥远的地平线那边闪耀，而眼前的日子，只是从一个坑爬出来，又掉进了另一个不那么深的坑里。算了算了，至少，坑浅了点。"
 SWRW_RUS.348.a: "起码那甜菜根罐头还能当门挡使。"

 
 SWRW_RUS.349.t: "安东的一套新制服"
 SWRW_RUS.349.d: "征兵通知书像一片过早落下的枯叶，飘落在安东家那张磨得发亮的旧木桌上。外面，铅灰色的天空预示着又一个漫长而寒冷的西伯利亚下午的开始，屋内却因这张薄薄的纸片而骤然降温。安东，刚刚跨过十八岁的门槛，盯着那盖着粗糙印章的官方文字，上面印着他的名字，以及一个不容置疑的召唤——为了祖国母亲。\n\n他的父亲，德米特里，一个在过去二十年的“混乱”和“重建”中脸上刻满了沟壑的中年男人，正坐在角落里，就着一杯淡得像刷锅水的茶，默默地卷着劣质的马合烟。他瞥了一眼那张通知书，发出一声几乎听不见的嗤笑，与其说是嘲讽，不如说是认命。“啊，又来了，”他声音沙哑，像是生了锈的门轴在转动。“新制服，新口号，老调子。安东，听着，”\n\n他转过头，眼神疲惫却带着一丝过来人的狡黠，“他们会告诉你，你是保卫神圣疆土的钢铁盾牌。实际上，你可能只是用来填战壕的水泥块。如果发的靴子底儿是漏的——他们十有八九会是——记得多塞几层《真理报》，暖和一点，还能在休息时垫屁股。”他顿了顿，吐出一口浓烟，烟雾在他布满皱纹的脸上缭绕。\n\n安东的爷爷，伊万·彼得罗维奇，正坐在火炉边，一言不发地擦拭着他那把用了不知多少年的莫辛纳甘步枪——一件被他藏了几十年，躲过了无数次搜查的“老伙计”。老人抬起布满老年斑的浑浊眼睛，看向他的孙子，然后又看向那张通知书。他的嘴角抽动了一下，似笑非笑。\n\n“保卫祖国，”老人慢慢地说，声音如同磨石碾过砂砾。“好词儿。我年轻那会儿，他们也是这么说的。为了布哈林同志，为了苏维埃。我们打跑了德国鬼子第一次——好吧，是差点打跑。后来呢？我们又‘保卫’了一次，还是对德国鬼子。结果怎么样？你爹这条腿就是‘保卫’的勋章。现在，又要保卫了。告诉我，安东，这次我们要保卫的‘祖国’，是地图上的哪一块？是那个连名字都换了好几次的？还是那个只存在于领导人办公室墙上的？”\n\n伊万·彼得罗维奇放下步枪，颤巍巍地拿起桌上的伏特加，给自己倒了浅浅一杯。“他们给你发枪了吗，安东？真的枪，不是模型？”他呷了一小口，皱着眉咂咂嘴。“嗯，比上次他们给我的那根烧火棍强点有限。听着，小子，”他把酒杯重重放下，“死在哪儿都行，烂泥地里，雪堆里，都行。别死在一个你连名字都记不住的将军的命令下，别死在一句你连意思都不明白的口号里。如果真要死，”他用指关节敲了敲桌子，“找个暖和点的坑。”\n\n安东站在屋子中央，感到那套尚未领取的、粗糙的羊毛制服仿佛已经穿在了身上，刺得他皮肤发痒。他想起了征兵站墙上那些色彩鲜艳的海报：年轻的士兵目光坚毅，身后是冉冉升起的红日和高耸入云的工厂烟囱，标语写着“一切为了胜利！”、“俄罗斯永不屈服！”。可他看到的却是父亲的瘸腿，爷爷眼中深不见底的疲惫，还有窗外那永恒不变的、阴沉的西伯利亚天空。一股混杂着茫然、责任和某种被强行灌输的、模糊不清的“爱国心”的情绪在他胸中翻腾。他不是英雄，也成不了英雄。他只是安东，现在要去穿上一套新制服了。\n\n德米特里掐灭了烟头，站起身，笨拙地拍了拍儿子的肩膀，什么也没说。伊万·彼得罗维奇则重新拿起了他的莫辛纳甘，用一块油布仔细地擦拭着枪管，仿佛那才是他唯一值得信任的伙伴。安东深吸一口气，空气里满是廉价烟草和淡淡的伏特加味道。他拿起那张改变了他命运的纸片，把它仔细叠好，放进口袋。该去报到了。"
 SWRW_RUS.349.a: "这身制服，不大不小，刚好合身。"

 
 SWRW_RUS.350.t: "斯米尔诺夫卡、烟雾与主权"
 SWRW_RUS.350.d: "在西伯利亚腹地，某个刚刚被“解放”或是说“重新纳入母亲怀抱”的城市的边缘，一家名为“疲惫骡子”的小酒馆里，空气中弥漫着劣质马合烟、汗水和廉价伏特加“斯米尔诺夫卡”混合的浓烈气味。昏暗的灯光下，几张伤痕累累的木桌旁，关于新俄罗斯及其伟大未来的辩论正酣，声音在烟雾缭绕中此起彼伏，如同闷雷滚动。\n\n“……所以，我说，[领导人名字]同志的讲话完全正确！”一个穿着褪色军装、脸颊因酒精而泛红的年轻人——看样子像是刚在统一战争中捞到点功勋的小官，名叫帕维尔——猛地一拍桌子，溅起的酒液沾湿了发黄的报纸碎片。“我们不仅要站稳脚跟，更要让那些分裂主义的小丑、那些被西方腐蚀的软骨头知道，莫斯科的拳头有多硬！伟大的俄罗斯必将收回所有失地，从华沙的叛徒到阿拉斯加的冰原，都是我们的！”\n\n坐在他对面，一个胡子拉碴、眼神疲惫的老工人，瓦西里，缓缓地啜了一口杯中浑浊的液体，发出一声粗嘎的叹息。“收复，收复……帕维尔，你小子嘴皮子倒是利索。我们是站起来了，没人否认。但代价呢？我的大儿子埋在了乌拉尔山下，二儿子在伏尔加河畔少了一条腿。现在你跟我说阿拉斯加？那里的熊会给我们粮食，还是那里的雪能烧火取暖？‘大俄罗斯’的伟大，难道不是先让活着的人吃饱肚子，别在零下四十度的冬天冻死吗？”\n\n“老瓦西里，你这就是失败主义！”帕维尔涨红了脸，几乎要站起来。“伟大的民族需要空间，需要资源！不扩张，就是等死！难道你想让我们的子孙后代，继续缩在这片烂泥地里，被日耳曼尼亚的杂种或是美国佬的间谍嘲笑吗？为了未来的荣耀，牺牲是必要的！”\n\n“未来的荣耀，总是踩在现在的尸骨上。”一个戴着油腻眼镜、手指间夹着快要熄灭的烟卷的中年人，据说是以前某个解散了的研究所的技术员，名叫格里戈里，冷冷地插话。“你说得对，帕维尔同志。拳头硬是好事。但你看看我们喝的这伏特加，去年这时候还能闻到点麦子味，现在呢？跟消毒水没两样。为了‘大建’，为了‘国防’，什么都往军工厂送。伟大的国家是靠钢铁和口号建起来的，但生活呢？生活是靠面包、靴子，还有不那么像消毒水的伏特加维持的。别忘了，罗曼诺夫王朝也曾觉得自己伟大得不得了。”\n\n“格里戈里·伊万诺维奇，你这话里有毒！”帕维尔怒目而视。“这是背叛！是西方那一套！你……”\n“够了，都少说两句。”一直默默擦着吧台的酒馆老板，一个身形敦实的男人，终于开口，声音低沉而沙哑。“伟大也好，活着也好，伏特加都快见底了。下一批货什么时候到，没人知道。你们在这儿争论俄罗斯该延伸到哪里，我只关心明天炉子里的煤还够不够烧。都渴了吧？”\n\n帕维尔还想说什么，但看着老板面无表情的脸和空了大半的酒瓶，最终只是重重地哼了一声，把杯子推了过去。老瓦西里沉默地看着窗外飘落的雪花，格里戈里则掐灭了烟头，将眼镜往鼻梁上推了推，嘴角挂着一丝难以察觉的苦笑。酒馆里暂时安静下来，只剩下风声和远处隐约传来的、某种重型机械运作的轰鸣。"
 SWRW_RUS.350.a: "至少伏特加还没断供。"

