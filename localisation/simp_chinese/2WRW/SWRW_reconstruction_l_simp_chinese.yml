 RUS_commie_union_and_strong_tt: "§W时值西历[GetYear]年，新秩序的光辉已不再闪耀，欧罗巴业已不在长筒靴的统治之下。§!\n\n§w现在，我们正心怀希望，向着新千禧的黎明望去，那一缕暮色已经成为了耀眼的阳光。§!\n\n§C然而，在阳光之下，不公仍然存在，这只是开始的结束，而不是结束的开始，我们的工作很多，我们的麻烦很大，但我们的美德很棒！§!\n\n§M第二次西俄罗斯战争官组及社区版制作组全体成员，感谢您游玩§!§B俄罗斯§!§M。§!\n\n§D祝您一天愉快。§!"
