 RUS_commie_the_polic_problem_desc: "战火的硝烟尚未散尽，统一的旗帜刚刚插遍大地，但克里姆林宫的阴影里潜藏的，是比外敌更难缠的幽灵。派系倾轧，旧怨未了，权力结构百废待兴。如何将这片因割据而伤痕累累的土地真正拧成一股绳？这是摆在新政权面前的第一道，或许也是最艰难的一道考题。稍有不慎，昨日军阀的废墟便会滋生出明日府院内斗的毒草。"
 RUS_commie_law_and_order_desc: "军阀横行的时代留下的不仅仅是废墟，还有深入骨髓的无法无天。土匪仍在乡间啸聚，黑市交易屡禁不止，流散的武器威胁着每一个角落的安宁。重建秩序，不仅需要修补破碎的建筑，更要重建破碎的规则。警察需要走上街头，法庭需要敲响法槌，监狱需要关押罪犯。恢复国家对暴力的垄断，是所有建设的前提。"
 RUS_commie_constitution_desc: "在一张几乎被战火烧成灰烬的白纸上，我们将重新描绘俄罗斯的法理根基。这部根本大法将界定权力的边界，明确公民的权利与义务，塑造国家的形态。它将决定是人民手握缰绳，还是“引路人”代为策马。每一个字都重逾千斤，每一次妥协都可能遗祸百年。这是重建灵魂的工程，落笔之时，须有面对历史的勇气。"
 RUS_commie_CSTO_desc: "孤掌难鸣，尤其是在强邻环伺的险恶世界里。俄罗斯的复兴离不开盟友的支持与协作。是重新激活旧有的军事同盟框架，与意识形态相近的国家抱团取暖？还是另起炉灶，构建更符合当下利益的新型伙伴关系？抑或是，在两大阵营间寻求微妙的平衡？我们的选择不仅关乎国防安全，更将决定新俄罗斯在世界舞台上的角色与地位。"
 RUS_commie_slavery_huh_desc: "在某些黑暗的角落，在那些被极端主义和野蛮统治践踏过的土地上，“人”的价值被贬低到尘埃之下。强制劳动、人口贩卖、甚至赤裸裸的奴役…这些军阀时代的遗毒必须被彻底清除。以国家的名义，以法律的形式，庄严宣告：在这片重生的土地上，任何人不得为奴，所有公民生而平等，享有不可剥夺的尊严。这不仅是匡正旧恶，更是为新俄罗斯的道德基石奠定第一块砖。"
 RUS_commie_special_action_committe_desc: "为了确保我们政治措施的实行，克格勃的安德罗波夫同志正着手准备建立一个新组织。该组织被克格勃下辖，由安德罗波夫同志亲自管理，旨在消除政策施行的阻力，加强中央对地方的控制，并清除腐败，消除社会的顽疾。同时，特别行动委员会也会深入基层，了解改革措施的弊病，并推动改革更好的施行。"
 RUS_commie_civil_rights_act_desc: "“公民”二字，究竟意味着什么？除了投票权和言论自由，还有哪些权利是神圣不可侵犯的？免于恐惧的权利，免于匮乏的权利，信仰自由的权利，不受歧视的权利…一份全面的公民权利法案，将是新俄罗斯送给它的人民的最宝贵的礼物之一。它将用法律的语言承诺，国家不仅要求公民承担义务，更将保障他们的基本尊严与福祉。"
 RUS_commie_northern_beacon_desc: "现在，改革已经有了初步成效，我们的城市内部虽仍然有着种种问题，但已比之前要好得多。随着公民权利的增加，俄罗斯的国际吸引力正大幅提高，哪怕是最悲观的人也认为，俄罗斯的崛起已经指日可待了。\n\n而我们，也将成为世界岛上的灯塔，照亮全世界的人民。"
 RUS_commie_land_of_beauty_desc: "哦，我的祖国，多么美丽！\n\n我们在文化上的出版自由政策，正使得我们的社会文化进一步的发展，而事实就是人民非常喜欢这些东西！电影院里总是人满为患，电视机的收视率再创新高，未来我们或许能和共荣圈相竞争，在他们的市场上输出我们的作品！"
 RUS_commie_glory_of_country_desc: "光荣啊，我们的俄罗斯祖国！\n\n在初步平定了内部的政治问题之后，我们的祖国正在蓬勃发展，没有什么比祖国的伟大更令人欣喜了。\n\n也许，我们可以稍微转移一下目光，把我们的工作重心转向社会和经济上的建设？"
 RUS_commie_home_of_socialism_desc: "我们的旗帜是红色的，我们的理想根植于解放全人类的伟大事业。尽管道路曲折，甚至一度濒临绝境，但建设社会主义家园的目标从未动摇。现在，我们要重新定义这片土地的属性：生产资料公有，按劳分配（或最终按需分配），工人阶级当家做主。具体的模式可以探讨，道路可以创新，但社会主义的核心价值，必须像北极星一样指引方向。"
 RUS_commie_land_of_braver_desc: "这片土地见证了太多的苦难，也孕育了无与伦比的勇气。从反抗蒙古入侵的王公，到卫国战争中的游击队员，再到今天重建家园的普通人，俄罗斯从不缺乏勇敢的心。我们要将这种坚韧不拔、无所畏惧的精神，塑造成新的民族魂。通过宣传、教育和文艺创作，让每一个俄罗斯人都为自己是这片“勇敢者土地”的一份子而自豪。"
 RUS_commie_party_politic_desc: "喧嚣的广场需要秩序，沸腾的民意需要引导。一个统一的国家不能只有领袖的号令，还需要稳固的政治结构来承载。是建立一个团结高效的先锋队，将所有力量汇于一点？还是容许多元的声音存在，在协商与制衡中蹒跚前行？选择不仅关乎权力分配，更将深刻定义未来俄罗斯的政治底色与社会脉搏。"
 RUS_commie_single_party_state_desc: "为了不再重蹈分裂的覆辙，为了将所有的力量聚焦于人民需要的地方，一个坚强统一的领导核心是必要的。然而这并不意味着专制独裁，我们允许党内的不同意见的存在，但是我们将经过民主协商，保持我们路线的统一。这就是民主集中制的优越所在，有的人认为，民主就是一些人坐在会议桌上扯皮，浪费国家的资源和时间——然而，我们将用事实向他们证明:恰恰相反，民主制度才是所有制度中最优秀，最高效的。"
 RUS_commie_allow_other_party_desc: "俄罗斯的声音不应只有一个。不同的地区，不同的阶层，不同的民族，他们的诉求理应被倾听，他们的利益理应被代表。我们会在统一的纲领下，允许各个社会团体表达自己。即使短期来看，协商制度会让争执难以避免，但是，这正是我们民主制度的要求——而且，全社会的联合才是一个国家最强大的力量。"
 RUS_commie_prepare_for_election_desc: "权力最终的来源，是刺刀，还是选票？如果选择了后者，那么通往投票站的道路必须被铺平。登记选民，划分选区，制定规则，允许（或许是有限度的）竞选活动…这一切都是将“人民授权”从口号变为现实的繁琐但必要的步骤。这无疑是一场豪赌，赌的是人民的选择，赌的是新政权的稳定。开弓没有回头箭。"
 RUS_commie_meeting_freedom_desc: "不仅仅是报纸和书籍，街头巷尾的谈论，工厂食堂的抱怨，大学课堂的辩论…这些日常的言语，应该享有多大的自由空间？“异议”是否等同于“颠覆”？“批评”是否等同于“背叛”？划定言论的边界，是一门极其微妙的艺术，它考验着统治者的智慧，也塑造着社会成员的心态。是万马齐喑，还是百家争鸣？"
 RUS_commie_press_rights_desc: "思想的种子需要在什么样的土壤里发芽？是温室里精心呵护、统一修剪？还是旷野中自由生长、百花齐放？对报刊、书籍、广播的管控尺度，将直接反映新政权的自信与胸襟。是允许批评的声音存在，哪怕它刺耳尖锐？还是只容许赞美的合唱，以确保“舆论导向”的正确？墨水的气味，将弥漫着自由或压抑的气息。"
 RUS_commie_unions_desc: "工厂的烟囱重新冒烟，工人的力量也随之重新集结。新俄罗斯的建设离不开千百万劳动者的双手。那么，代表他们利益的工会，应该扮演什么样的角色？是成为与资方（无论是国有的还是私有的）平等博弈的力量，维护工人的权益？还是成为国家动员生产、管理劳工的助手，确保经济计划的顺利执行？工人的锤子，握在谁的手里，将决定很多事情。"
 RUS_commie_religious_problem_desc: "东正教的十字架，在俄罗斯大地上矗立了千年，它既是信仰的象征，也曾是权力的支柱。经历了几十年的压制与混乱后，它在新时代的角色变得模糊不清。是将其视为落后的迷信，继续限制甚至取缔？还是承认其作为文化传统与部分民众精神寄托的地位，允许其在一定框架内存在？抑或是，尝试将其纳入国家管理的轨道？这个问题牵动着无数人的灵魂。"
 RUS_commie_state_atheism_desc: "宗教是人民的鸦片，是蒙昧主义的温床，是旧时代压迫的帮凶！新俄罗斯必须是一个科学、理性、进步的国家，容不得这些神神叨叨的东西继续毒害人民的思想。教堂应该改建成博物馆或仓库，神父应该去工厂接受劳动改造。斩断这根精神枷锁，才能让人民真正地站起来，拥抱唯物主义的光明未来。"
 RUS_commie_laicism_desc: "或许，信仰是个人的事情。只要教会安分守己，不干预政治，不挑战国家权威，那么就让那些需要慰藉的灵魂，在教堂的穹顶之下找到他们的平静吧。强行压制只会制造对立和怨恨。给予有限的宽容，或许更能换来社会的和谐与信徒的顺从。让上帝的归上帝，凯撒的归凯撒。"

