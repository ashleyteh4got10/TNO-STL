 PER_national_reconstruction:0 "国家重建"
 IRC_russia.1.t:0 "来自德黑兰的访客"
 IRC_russia.1.desc:0 "沙普尔·巴赫蒂亚尔满脸皱纹，两侧刻着深深的皱纹，一双炯炯有神的大眼睛下蓄着浓密的小胡子。虽然这样一位新任国家元首出国旅行并不常见，但这次场合非常重要，他发现自己乘坐着一架私人俄罗斯飞机，以庄重的方式前往人员众多的工业城市新西伯利亚。伊朗新总理深知他是俄罗斯在前苏联地区以外的第一个真正的盟友，这次会面对双方来说都非常重要。巴赫蒂亚尔自己也知道，虽然他在俄罗斯受到尊重，但与美国相比，他们只是依附于一个岌岌可危的小国。不过，巴赫蒂亚尔是一个忠诚的人，他发现他的价值观在俄罗斯比在[USA.GetFactionName]能得到更好的回应。\n\n飞机一降落，年迈的巴赫蒂亚尔走下飞机的楼梯，面对[RUS.GetNameDef]的总统[RUS.GetLeader]。这个年轻人还不到四十岁，活力四溢。在他额头的皱纹中，有着与巴赫蒂亚尔自己在皇室统治下所经历的斗争和困难相似的故事。在各种激进极端主义和压制性独裁统治的火焰之间，宪政的伊朗和俄罗斯象征着一种不同的秩序——只有一个尊重民主权利、人民尊严和温和的社会才能生存并获胜。\n\n舒克申热情地握着巴赫蒂亚尔的手说道：“非常荣幸见到您，总理。对于我们两国来说，今天是非常特殊的一天。”在他身后，摄影机和记者的镜头发出 “咔嚓咔嚓 ”的声音，将他们的身影捕捉下来。\n\n“不，总统，荣幸之至属于我方。您在我们国家斗争中的帮助是我们永远不会忘记的。让我们进去吧，有许多工作要做，将我们的国家联结在友谊中。”他们一同走向总统府，准备组建一个新的联盟，为自由而战。"
 IRC_russia.1.a:0 "更伟大事业的基础。"
 IRC_russia.2.t:0 "外交使节"
 IRC_russia.2.desc:0 "对奥尔加来说，在外交办公室做接待员是件好事。她并不了解俄罗斯政府所做的一切，也没有任何特殊权限。老实说，她对此并不在意。虽然奥尔加是个不折不扣的多面手，能说多种本地语言和世界语言，还能熟练地使用更多语言，但她并不擅长托辞。因此，奥尔加远离那些外交——或者说间谍——的诡计，她乐于在办公桌前迎接来访的贵宾。\n\n这并不意味着她一无所知。当大门打开，一个橄榄肤色的男人穿着一身简单而漂亮的西装走了进来时，她微笑着欢迎他，但她明白不能泄露国家机密。\n\n“很高兴见到你，欢迎来到联邦外交招待会。我叫奥尔加，需要我帮忙吗？”她以最亲切的声音问道。那个男人脱下了帽子，以一种可爱的方式鞠了个躬，微笑着用完美的俄语回答。\n\n“谢谢你如此友善的问候。我有一个和外交部长的会议，大约在一个小时后。啊，我是阿尔德希尔·扎赫迪先生。很高兴认识你，奥尔加小姐。”扎赫迪……听起来像是伊朗人。多么可爱、有礼貌，而且他会说俄语？奥尔加急切地查看了日程表，确实有一个关于扎赫迪先生的会议，但是还需要一个小时。她讨厌让人等待，但一个小时实在太早了。\n\n奥尔加用流利的波斯语说道：“扎赫迪先生，非常抱歉，苏尔丹先生至少还需要一个小时才能见您。”奥尔加遗憾地解释道。扎赫迪温暖地微笑着，轻声笑了起来。“我应该向您道歉。早到是非常失礼的，尤其当您对我如此友好，并用我的语言与我交谈的时候。您对伊朗了解多少？”他问道。奥尔加稍微想了一下：她了解一点，但称不上对伊朗历史了如指掌。所以，看到扎赫迪先生亲切、又英俊，是这个领域的专家，并且有充足的时间消磨，她开心地微笑起来。\n\n“我掌握得远远不够，扎赫迪先生，您为什么不告诉我一些呢？”她提议道。扎赫迪稍作思考后开始说道：\"你们的人民在建立一个类似于你们的共和国方面给予了我们极大的帮助，我来这里是为了表示感谢。让我向你介绍卡扎尔王朝吧。\""
 IRC_russia.2.a:0 "外交不仅仅是翻译或间谍活动。"