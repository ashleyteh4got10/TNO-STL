 KAZ_negotiation.1.t:0 "哈萨克斯坦的命运"
 KAZ_negotiation.1.desc:0 "随着苏联的剧烈解体以及俄罗斯随后结束对中亚地区的管理，我们在该地区的影响力就像我们自己的国家一样迅速消散。现在，俄罗斯在我们的领导下团结一致，枪炮声在哈萨克斯坦血染的草原上沉寂，这个前苏维埃共和国的命运现在取决于我们。我们当然有能力用武力占领该地区，但入侵会造成不必要的伤亡，而适当的谈判可以避免这种伤亡。\n\n事实证明，只要让哈萨克人屈服于我们的意志就足够了。然而，从长远来看，在该地区维持一支占领军的代价可能会很高，而且可能会损害我们与美国等其他大国的国际关系。\n\n另一个可能的解决方案是伸出我们的兄弟之手，邀请哈萨克斯坦加入我们的联盟。我们都在德国人手里吃够了苦头，如果在该地区有一个合适的盟友，对未来的中亚事业会很有帮助。"
 KAZ_negotiation.1.a:0 "我们一直是战友兄弟。让我们提议建立一个联盟！"
 KAZ_negotiation.1.b:0 "要求他们屈服。我们不能让他们成为外国势力的猎物。"
 KAZ_negotiation.1.c:0 "哈萨克斯坦一直都是俄罗斯的，而且将永远如此。要求他们投降！"
 KAZ_negotiation.2.t:0 "哈萨克斯坦人提出反议"
 KAZ_negotiation.2.desc:0 "哈萨克斯坦使节拒绝了我们之前的提议，反而提出了一种妥协方案。与其被并入俄罗斯境内，哈萨克斯坦将会屈从于我们的意愿。尽管这并非我们最初期望的结果，但在中亚地区拥有忠诚的哈萨克斯坦政府可以帮助减轻地区紧张局势，同时保持我们的影响力不变。\n\n虽然这个提议确实很诱人，但有可能只是一种虚张声势的策略，旨在保留一些独立性。与我们的军队相比，哈萨克斯坦军队相形见绌。情报报告显示，如果发动一场迅速占领大草原的战役，我们胜券在握。话虽如此，选择仍然在我们手中。我们接下来该如何做呢？"
 KAZ_negotiation.2.a:0 "或许在谈判中确实有胜利的可能。告诉他们我们接受。"
 KAZ_negotiation.2.b:0 "他们的提议是在虚张声势！"
 KAZ_negotiation.3.t:0 "哈萨克斯坦人提出反议"
 KAZ_negotiation.3.desc:0 "哈萨克斯坦特使拒绝了我们之前的提议，反而提出了一项妥协方案。哈萨克斯坦将向俄罗斯宣誓效忠，并加入我们两国之间的联盟。虽然这不是我们最初想要的，但与哈萨克斯坦的联盟可能在控制中亚其他地区的同时，也能提升我们与该地区其他强国的国际关系。\n\n尽管这个提议确实很诱人，但也有可能只不过是虚张声势，旨在使他们在联盟中保持独立，而不是真正地融入俄罗斯。与我们的军队相比，哈萨克斯坦军队相形见绌。情报报告显示，如果发动一场迅速占领大草原的战役，我们胜券在握。话虽如此，选择仍然在我们手中。我们接下来该如何做呢？"
 KAZ_negotiation.3.a:0 "他们的提议是在虚张声势！"
 KAZ_negotiation.3.b:0 "或许我们刚开始时走错了方向。告诉他们我们接受。"
 KAZ_negotiation.4.t:0 "哈萨克斯坦拒绝！"
 KAZ_negotiation.4.desc:0 "在大胆挑衅的行动中，哈萨克斯坦特使拒绝了我们的要求，并将其视为对哈萨克人民的“威胁”。与哈萨克斯坦中央政府的所有关系已经破裂，现在我们只剩下两个选择：入侵或缓和局势。\n\n毫无疑问，对这片草原地区的入侵将是成功的。哈萨克斯坦军队无法与我们抗衡，并且他们几乎没有任何空中能力。主要问题是接下来的情况：这样的占领需要大量的部队来维持地区的秩序，而入侵的成本可能超出预期。\n\n话虽如此，此时缓和局势无疑会损害我们作为大国的国际形象，尤其是在团结协定或共荣圈的眼中。无论后果如何，我们必须选择前进的道路。无论是好是坏。"
 KAZ_negotiation.4.a:0 "我们绝对不能容忍这种反抗。立刻准备好坦克！"
 KAZ_negotiation.4.b:0 "也许我们走得太远了。我们必须后退几步。"
 KAZ_negotiation.5.t:0 "哈萨克斯坦提交了要求！"
 KAZ_negotiation.5.desc:0 "正如我们所预料的那样，哈萨克斯坦中央政府已接受我们的要求，将他们整合到俄罗斯本土。我们的部队已开始长途行军，进入哈萨克斯坦，在新收购的哈萨克斯坦地区建立俄罗斯的权威和秩序，遭遇到一些零星抵抗，来自那些不愿轻易放弃自由哈萨克斯坦国家概念的游击队。\n\n虽然这确实带来了一些不便，但毫无疑问，哈萨克斯坦现在已在我们的掌控之下。通往中亚其他地区的大门已经打开，俄罗斯在该地区的统治时代也随之重新开始。"
 KAZ_negotiation.5.a:0 "正如所望。"
 KAZ_negotiation.6.t:0 "哈萨克斯坦的未来"
 KAZ_negotiation.6.desc:0 "随着哈萨克斯坦抵抗的最后残余逐渐消失在无尽的沙漠中，我们面临两个选择，以何种方式来管理这片沾满鲜血的大草原。\n\n第一个选择是将这些土地重新纳入俄罗斯本土。虽然这对我们自身的利益来说无疑是最有利的选择，但为了完全整合需要长时间维持占领力量可能会带来麻烦和昂贵的长期后果。\n\n或者，我们可以建立一个忠诚的哈萨克斯坦政权，完全服从我们的利益，同时又足够独立，以维持该地区的秩序，从而解放出成千上万的军队以便部署到其他地方，同时保持我们的国际声誉相对完好。\n\n选择权在我们手中。是继续占领，还是整合？"
 KAZ_negotiation.6.a:0 "我们将再次欢迎哈萨克斯坦省回归俄罗斯，因为这就是它们应该在的地方。"
 KAZ_negotiation.6.b:0 "我们将建立一个友好的哈萨克斯坦政府，忠诚于我们的利益。"
 KAZ_negotiation.7.t:0 "谈判破裂！"
 KAZ_negotiation.7.desc:0 "哈萨克斯坦政府在我们拒绝接受他们试图欺骗我们的任何虚张声势或反击方案后，正式中断了我们两国之间的所有联系。我们现在只剩下两个选择：入侵或缓和。\n\n毫无疑问，对草原的入侵将会取得成功。哈萨克斯坦没有能力抵抗我们的军队，他们几乎没有任何空中能力。主要问题是接下来会发生什么：这样的占领需要大量的军队来维持该地区的秩序，而入侵可能导致更多超过预期的伤亡。\n\n话虽如此，此时缓和紧张局势无疑会损害我们作为大国的国际形象，特别是在团结协定或共荣圈的眼中。无论后果如何，我们必须选择前进的道路，无论是好是坏。"
 KAZ_negotiation.7.a:0 "我们绝不会被骗。立刻准备坦克！"
 KAZ_negotiation.7.b:0 "也许我们走得太远了。我们必须后退几步。"
 KAZ_negotiation.8.t:0 "哈萨克斯坦提交要求！"
 KAZ_negotiation.8.desc:0 "正如我们预测的那样，哈萨克斯坦政府已同意让位给一个新的、更合作的中央统治机构。因此，我们的武装部队已从边境撤离并返回驻地。虽然我们的外交官员正在庆祝这一重大胜利，但有关大规模骚乱、抵抗和袭击的报道引发了对这个“独立”的哈萨克斯坦在没有我们直接干预的情况下能够持续多久的担忧。\n\n虽然这确实是一件令人担忧的事情，但毫无疑问，哈萨克斯坦现在处于我们的控制之下。通往中亚其他地区的大门已经敞开，俄罗斯在该地区的新时代统治要随之开始了。"
 KAZ_negotiation.8.a:0 "正如所望。"
 KAZ_negotiation.9.t:0 "哈萨克斯坦接受！"
 KAZ_negotiation.9.desc:0 "我们收到消息，哈萨克斯坦已接受我们的提议，加入我们两国之间的联盟。这是一个重大的外交胜利，不仅对俄罗斯而言，也对中亚地区的持久和平而言。\n\n无数的共同演习和经济发展计划已经开始起草，俄罗斯和哈萨克斯坦的外交官员共同庆祝我们重新建立的关系：我们不是作为主宰或被主宰者，而是作为兄弟。"
 KAZ_negotiation.9.a:0 "理所应当。"
 KAZ_negotiation.10.t:0 "谈判破裂！"
 KAZ_negotiation.10.desc:0 "哈萨克斯坦政府在一系列激烈辩论之后正式中断了我们两国之间的所有关系，拒绝了有关哈萨克斯坦加入我们两国联盟的提议，而是选择了一些薄弱的经济让步和一项“非侵略公约”。对于这样的固执行为，我们的外交官们愤怒地拒绝了他们可怜的提议，怒气冲冲地从会议上离开，而数千名我军士兵已经开始在边境集结。看来我们现在只剩下两个选择：入侵或缓和。\n\n毫无疑问，对草原的入侵将会取得成功。哈萨克斯坦没有能力抵抗我们的军队，他们几乎没有任何空中能力。主要问题是接下来会发生什么：这样的占领需要大量的军队来维持该地区的秩序，而入侵可能导致更多超过预期的伤亡。\n\n话虽如此，此时缓和紧张局势无疑会损害我们作为大国的国际形象，特别是在团结协定或共荣圈的眼中。无论后果如何，我们必须选择前进的道路，无论是好是坏。"
 KAZ_negotiation.10.a:0 "我们绝不会被骗。立刻准备坦克！"
 KAZ_negotiation.10.b:0 "也许我们走得太远了。我们必须后退几步。"
 KAZ_negotiation.11.t:0 "俄罗斯希望与我们结盟"
 KAZ_negotiation.11.desc:0 "俄罗斯方面提出了一个有趣的提议。\n\n他们建议我们与[RUS.GetFactionName]结成军事联盟，既包括进攻性战争，也包括防御性战争。这个提议非常有趣，因为我们在国内事务上将保持独立，只是在外交政策目标上保持一致。根据我们对俄罗斯政府的看法，这可能是一个很好的提议，它也可能是一个我们无法拒绝的提议。\n\n军事报告和评估显示，我们很可能在任何持久的军事冲突中都无法获胜。然而，我们可能足够强大，可以吓退他们，完全缓解局势。对我们的整合甚至征服将引发独立运动，更不用说实际的战争本身了。如果我们相信情况就是这样，我们可以彻底拒绝他们的提议并中止所有外交谈判。当然，这将使他们面临两个选择：战争或撤退。\n\n然而，如果战争的风险太大以至于无法承受，或者我们自己也同意这个提议，我们可能会考虑接受他们加入他们联盟的请求。虽然屈从于他们的外交政策目标可能并不令人兴奋，但这种事情是相互的。此外，这可能比战争及其后果更好。\n\n选择权在你手里，我们该怎么做？"
 KAZ_negotiation.11.a:0 "让我们接受他们的提议，我们将会结盟。"
 KAZ_negotiation.11.b:0 "别那么仓促，我们考虑过……一个互不侵犯条约吗？"
 KAZ_negotiation.12.t:0 "俄罗斯要求我方臣服"
 KAZ_negotiation.12.desc:0 "我们所担心的时刻已经到来。重组后的俄罗斯国家要求我们屈服并成为附庸国家。这意味着我们的统治机构将由他们决定，我们的外交政策将受到他们的指导，但我们将保持一定的内部独立性。我们将拥有自己的武装力量和国家结构。\n\n军事报告和评估显示，我们很可能在任何持久的军事冲突中都无法获胜。然而，我们可能足够强大，可以吓退他们，完全缓解局势。对我们的整合甚至征服将引发独立运动，更不用说实际的战争本身了。如果我们相信情况就是这样，我们可以彻底拒绝他们的提议并中止所有外交谈判。当然，这将使他们面临两个选择：战争或撤退。\n\n或者，我们可以向他们发出一个反议，要求加入他们的[RUS.GetFactionName]联盟。这将有助于保护我们作为一个国家，增加对他们的外交压力，并允许我们加入在亚洲崛起的新势力。\n\n然而，如果战争的风险太大而无法承受，我们可能考虑接受他们正式邀请，以附庸国家的身份加入联盟。这将结束我们作为一个独立国家的存在；但为了防止进一步流血或不可避免地被强行吞并，这可能是无奈之举。\n\n选择权在你手中，我们应该怎么做？"
 KAZ_negotiation.12.a:0 "我们没有权力要求什么，让我们接受并至少保护我们的国家。"
 KAZ_negotiation.12.b:0 "我们不会屈服，他们要么开战要么离开。结束谈判。"
 KAZ_negotiation.12.c:0 "结盟是一个合理的反提议。"
 KAZ_negotiation.13.t:0 "俄罗斯要求兼并"
 KAZ_negotiation.13.desc:0 "我们所担心的时刻已经来临。经过重组的俄罗斯国家要求我们完全融入他们的国家。\n\n军事报告和评估显示，我们很可能在任何持久的军事冲突中都无法获胜。然而，我们可能足够强大，可以吓退他们，完全缓解局势。对我们的整合甚至征服将引发独立运动，更不用说实际的战争本身了。如果我们相信情况就是这样，我们可以彻底拒绝他们的提议并中止所有外交谈判。当然，这将使他们面临两个选择：战争或撤退。\n\n或者，我们可以向他们发出反议，要求结盟并加入他们的[RUS.GetFactionName]。这将有助于保持我们作为一个国家的地位，增加他们的外交压力，并使我们能够加入在亚洲崛起的新势力。\n\n我们可以考虑的另一个反议是受制于俄罗斯的大方向，以附庸国的身份加入他们。虽然这将限制我们的独立性，但它将允许我们加入新的俄罗斯集团。此外，他们更有可能接受外交政策征服和政治结盟的提议，以换取我们在内部事务上的相对独立性。\n\n然而，如果战争的风险过大，我们可以考虑接受他们的要求，正式加入俄罗斯，成为他们国家的组成部分。这将结束我们作为一个独立国家的历史，即使只是名义上的独立；但这可能是为了防止进一步的流血和遭受强制征服的必要手段。\n\n选择权在你手中，我们该怎么办？"
 KAZ_negotiation.13.a:0 "我们没有能力要求任何事情，让我们接受并团结为一个国家。"
 KAZ_negotiation.13.b:0 "我们不会屈服，他们要么开战要么离开。"
 KAZ_negotiation.13.c:0 "征服是他们唯一将接受的提议。"
 KAZ_negotiation.13.d:0 "结盟是一个合理的反提议。"
 KAZ_negotiation.14.t:0 "俄罗斯拒绝了我们的还价"
 KAZ_negotiation.14.desc:0 "俄罗斯政府拒绝了我们的还价，认为与他们的军事和经济实力相比，这是一种侮辱。俄罗斯外交官今晚气急败坏地离开，发誓要迅速“结束这场哈萨克的闹剧”。\n\n如今，士兵们正准备迎接一场毫无疑问将会非常血腥和残酷的战争。我们的土地广袤，虽然消耗战将会对俄罗斯士兵造成伤亡，但也意味着我们的部队将陷入一场持久的冲突。我们几乎注定会失败，而且我们也不太确定赢得胜利意味着什么。然而，除了为自由而战，我们还能做什么呢？"
 KAZ_negotiation.14.a:0 "哦，不……"
