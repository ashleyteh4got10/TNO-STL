 KAZ_collapse.1.t: "无法遏制的动荡！"
 KAZ_collapse.1.desc: "尽管我们竭尽全力，但我们仍无法继续控制国家的动荡局势。我们已经听到叛军首领举兵造反的传闻，也听到了反对我们合法的社会主义政府的口号。虽然我们无法阻止外围地区的叛乱，但我们可以开始为即将爆发的冲突做好准备。"
 KAZ_collapse.1.a: "做好准备，为社会主义而战！"
 KAZ_collapse.2.t: "科克舍套和科斯塔奈的沉默"
 KAZ_collapse.2.desc: "正如我们所担心的那样，我们国家的叛乱程度已经达到了一个新的危险水平。我们已经好几天没有从科克舍套和科斯塔奈地区那里听到任何消息。我们的士兵被击退，逃往更为集中的前哨基地。有传言称，伊斯兰主义者和某种现代可汗运动正在形成。"
 KAZ_collapse.2.a: "我们也会度过这次难关。"
 KAZ_collapse.3.t: "阿克套和阿克托别的沉默"
 KAZ_collapse.3.desc: "新的报道已经传来：阿克套和阿克托别两个省份的北部和西部发生了街头叛乱。一位前上校尼古拉·奥诺普连科在市中心广场上被看到，用反共和准法西斯主义的言论煽动人群。我们担心很快将爆发一场全面的起义，其中一些忠于他的部队可能会参与进来。"
 KAZ_collapse.3.a: "右翼煽动者！"
 KAZ_collapse.4.t: "巴甫洛达尔的沉默"
 KAZ_collapse.4.desc: "东部的巴甫洛达尔几天没有传来消息了。我们的士兵几乎全部都从该地区撤退，集结在阿克莫林斯克和克孜勒奥尔达地区的中心。\n\n我们的报告还显示，一个名叫萨比特·穆卡诺夫的胖诗人正在该地区组织一个叛乱的自由资产阶级党派，承诺虚假的“自由”和“民主”。虽然我们通常乐于粉碎自由派，但我们的总参谋部现在对发生的叛乱事件表示严重关切..."
 KAZ_collapse.4.a: "这帮资产阶级猪会被碾碎……对吧？"
 KAZ_collapse.5.t: "科克舍套和科斯塔奈脱离！"
 KAZ_collapse.5.desc: "我们刚刚收到了来自所谓的\"[KOK.GetName]\"和\"[DER.GetName]\"的信件。显然，这些国家都是闹剧。科克舍套是一个声称自己是新汗国的土匪军阀国家，而科斯塔奈则声称他们正在建设一个道德伊斯兰共和国。\n\n幸运的是，仅仅是这些乌合之众，我们还能镇压得住，但随着其他地区陷入一片混乱，并且我们的军队在惊恐中四处逃窜，我们需要更加谨慎地对待这些事情。这些国家终将灭亡。但现在，我们必须等待时机。"
 KAZ_collapse.5.a: "这群土匪和原教旨主义者！"
 KAZ_collapse.6.t: "巴甫洛达尔脱离！"
 KAZ_collapse.6.desc: "我们的担忧成真了，巴甫洛达尔的骚乱已经演变成了一场完全的叛乱。我们收到了所谓的\"[PAV.GetName]\"发出的独立宣言，他们引用了“民主权利”和其他一些资产阶级的陈词滥调。\n\n我们害怕的并不是那群自由派垃圾！相反，巴甫洛达尔政府确实受到了民众的支持；并且，如果[NOV.GetName]能够派出人员和金钱支援，他们可能在东北方拥有一个盟友。尽管如此，我们有一个优势：军队。让他们派出那些跳梁小丑来对付我们的军队吧。无产阶级将会奋斗，并因为战斗而更加强大。"
 KAZ_collapse.6.a: "这群自由资本主义猪！"
