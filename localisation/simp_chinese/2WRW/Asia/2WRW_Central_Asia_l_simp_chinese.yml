 WORLD.114506.t:0 "[Get_newspaper_header]希姆肯特爆发大规模暴乱"
 WORLD.114506.desc:0 "据阿拉木图消息人士透露，哈萨克斯坦南部重镇希姆肯特市已陷入全面动荡。示威者将矛头指向帕维尔·菲京领导的内务人民委员会——后者的不作为致使希姆肯特陷入如今境地。\n\n在反动人士的煽动下，暴徒们开始袭击市警察局，该局很快被完全烧毁。面对袭击者的攻击，帕维尔·菲京领导的内务人民委员会并没有做出任何抵抗，这促使暴乱人群采取更加积极的行动。在审前拘留所与多家政府大楼被攻陷后，希姆肯特的局势已走向全面失控。\n\n自第一书记库纳耶夫推动修宪以来，哈萨克斯坦境内俄哈两族间的矛盾呈持续升级态势。希姆肯特大规模骚乱事件标志着俄哈两族和解窗口期的终结，两族矛盾似乎已无修复之可能。多位观察家指出，此次暴乱引发的连锁反应正将哈萨克斯坦推向全国性危机的边缘。"
 WORLD.114506.a:0 "血浓于水，何以至此？"
 WORLD.114506.b:0 "决定哈萨克斯坦命运的时刻已然到来。"

 WORLD.114505.t:0 "[Get_newspaper_header]希姆肯特局势进一步恶化"
 WORLD.114505.desc:0 "第一书记尤苏波夫遇刺后，本就混乱的希姆肯特局势因此进一步恶化，伴随着俄哈两族的对抗持续升温，该市境内现已出现多起小规模暴乱事件。在市警察局遭暴徒焚毁后，暴徒试图攻占审前拘留所的阴谋被政府挫败，随后暴徒将目标转向瘫痪其他政府机构，并导致多家政府部门停摆。\n\n新任第一书记斯克勒谢夫斯基紧急赶赴希姆肯特试图稳定局势，但其本人却因少数民族身份招致质疑，被激进分子斥为"蓄意挑拨俄哈两族的叛徒"。面对此等局面，这位第一书记显然缺乏平息冲突的威望。目前，斯克勒谢夫斯基已紧急召集党内会议，着手为希姆肯特可能出现的全面失控局面制定相关预案。\n\n此次事件无疑为哈萨克斯坦敲响了警钟。若斯克勒谢夫斯基政府无法有效处理希姆肯特局势，并尽快平衡俄哈两族间摇摇欲坠的不稳关系，这个新生国家恐将陷入到更大的危机当中。"
 WORLD.114505.a:0 "哈萨克斯坦刚出狼窝，又入虎穴。"
 WORLD.114505.b:0 "让第三族来解决两族矛盾，真是可笑。"

 WORLD.114504.t:0 "[Get_newspaper_header]希姆肯特暴动遭血腥镇压"
 WORLD.114504.desc:0 "随着零星的消息不断从希姆肯特传来，一个可怖的事实被逐渐拼凑出来：在希姆肯特爆发叛乱后，帕维尔·菲京已授权实施"特别平叛行动"，命令军队进驻该市强行镇压暴乱，并已造成了近百人的伤亡。\n\n尽管存在多名目击证人，地方法院仍以"证据链不完整"为由判决涉事警员无罪，此举直接导致政府公信力彻底瓦解。部分暴徒对政府机构及俄裔居民区实施无差别袭击。\n\n在哈萨克民族主义势力煽动下，抗议者已演变为武装团体，对市政机构实施有组织的攻击，并试图建立自治政权。在阿拉木图宣布所谓的"谈判“失败后，当局旋即出动正规军实施武力镇压，直接导致城市陷入全面巷战状态。\n\n多位观察家指出，此次暴乱标志着哈萨克斯坦政府已处于濒临崩溃的边缘，俄哈两族围绕政权主导权的方式今已上升至武装层面，距离爆发全国性的大规模叛乱无非时间问题。"
 WORLD.114504.a:0 "强权统治之下，独立才愈显珍贵。"
 WORLD.114504.b:0 "哈萨克斯坦还能被团结在一面旗帜下吗？"

 WORLD.114503.t:0 "[Get_newspaper_header]塔什干遭遇里氏7.5级地震"
 WORLD.114503.desc:0 "今天凌晨3时17分，乌兹别克斯坦重要城市塔什干遭遇里氏7.5级强烈地震。据伏龙芝地震局初步测定，震中位于塔什干市区西南12公里处，震源深度仅10公里。此次地震是塔什干自1868年以来遭遇的最强烈地震。\n\n这座曾被誉为"中亚明珠"的城市现已面目全非。市中心列宁广场周边建筑大面积倒塌，著名的纳沃伊剧院穹顶部分坍塌，多座大楼整栋倾覆。塔什干纺织厂、拖拉机厂等工业设施受损严重，厂区内随处可见扭曲的钢铁支架和断裂的混凝土梁柱。\n\n目前已确认至少1200人遇难，超过5000人受伤，预计伤亡数字还将上升。乌兹别克政府现已邀请吉尔吉斯政府等国参与一场紧急协商，以期对方能够提供更多的支援。\n\n值得注意的是，尽管阿富汗与中亚诸国存在紧张关系，查希尔沙阿国王仍表示将派遣医疗队支援。"
 WORLD.114503.a:0 "那建筑就放在那，他们自己就垮了！"
 WORLD.114503.b:0 "在那旭日仍未照耀的地方……"
 WORLD.114503.c:0 "灾难面前，仇恨不值一提。"
 WORLD.114503.d:0 "为我们遭受深沉苦难的同胞默哀。"
 WORLD.114503.e:0 "那是哪里？我的地理老师可没教过我！"