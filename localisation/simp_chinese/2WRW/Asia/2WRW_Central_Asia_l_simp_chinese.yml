 KAZ_intervention.1.t: "朋友有难"
 KAZ_intervention.1.desc: "俄罗斯的腹地之下，是战火纷飞的哈萨克斯坦。随着布尔什维克对我们的政治束缚的崩溃，哈萨克斯坦的政治也随之改变。如今，在巴甫洛达尔市以外的乡村地区，有与我们有着类似的游击队在战斗。当我们为俄罗斯人民的自由和和平而战时，他们的旗帜可能很快就会在整个哈萨克斯坦升起，以换取军事支持。在我们稳定掌控俄罗斯的土地后，我们应该把目光投向哈萨克斯坦，扩大我们的影响力，并在未来获得一个宝贵的盟友。"
 KAZ_intervention.1.a: "哈萨克斯坦将重获自由！"
 KAZ_intervention.2.t: "朋友有难"
 KAZ_intervention.2.desc: "哈萨克斯坦，这个草原上的可怜之子，正处于一场内战之中。无神论者的布尔什维克集团失去了掌握权力的能力，随之而来的是脆弱的“哈萨克苏维埃社会主义共和国”的崩溃。民主派、伊斯兰主义者甚至波兰人都试图夺取权力，但至今没有人成功。然而，在西方，存在着一个我们非常喜欢的国家，那就是所谓的务实主义者。他们通过充分支持、经济补贴和军事控制，为哈萨克斯坦的统一和现代化而战；这种努力有可能演变为一个与俄罗斯有着明显联系的未来愿景。"
 KAZ_intervention.2.a: "时间不等人！"
 KAZ_intervention.3.t: "朋友有难"
 KAZ_intervention.3.desc: "在布尔什维克党的精心呵护下，哈萨克斯坦一度迎来了文化复兴，在历史上首次发展成为一个真正具有凝聚力的国家。然而，那个时代早已过去，取而代之的是外国和国内资本家、法西斯主义者、可汗和甚至一个奇怪的综合“波兰”国家的铁蹄。幸运的是，布尔什维克残余势力仍然是当地最强大的政治力量。然而，在军事上，哈萨克斯坦国内的布尔什维克可以从援助中受益匪浅，这一决定不仅可以建立一个和我们结盟的国家，我们还能在他们未来的政治中发挥更大的影响力。"
 KAZ_intervention.3.a: "国际社会主义的不二之选。"
