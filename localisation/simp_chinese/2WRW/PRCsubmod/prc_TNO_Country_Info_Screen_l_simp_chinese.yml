l_simp_chinese:
 PRC_CountryInfo_Folder.101: "往日"
 PRC_CountryInfo_Content.1: "勇敢的心"
 PRC_CountryInfo_Content_desc.1: "谈起人民革命委员会的历史，那就绕不开一位传奇且不幸的将军，也是苏维埃联盟璀璨的将星之一——亚历山大•华西列夫斯基。\n\n十月革命之后，功勋卓著的亚历山大•华西列夫斯基辗转红军内多部门，并于1937年被调入总参谋部。然而，在苏联红军的战略规划、训练和远东对日军事的规划上，华西列夫斯基多次赞同斯大林有关加强红军战备的主张，并多次反对布哈林对扩大苏军规模却忽视政治审查等方面的主张。因而为布哈林所不喜，他的主张未得到采纳，本人也长期赋闲于任上。\n\n"
 PRC_CountryInfo_Content.12: "战争之魇"
 PRC_CountryInfo_Content_desc.12: "1939年5月，为了试探苏联在远东的实力，日军、满洲国军在外蒙古地区诺门坎地区向蒙古边防军发动进攻。由于在远东方面的准备不足，本地苏军和蒙古人民军遭到了沉重打击。危急时刻，亚历山大•华西列夫斯基和格奥尔基•朱可夫紧急受命前往远东。两人在商议后共同决定通过机动作战的方式，一方面阻止关东军的进一步深入，另一方面通过实战整训远东的苏军部队，等待援助到来。尽管日军来势汹汹，组织了大量重炮、飞机甚至是细菌战部队发动攻势，但在两人优异的指挥下，经过两个月的激战，日满联军始终未能突破苏蒙联军的防线，被迫就地转入防御。\n\n随后，在总参谋部的规划下，苏军于8月发动了大规模的反攻。苏军利用有限的装甲力量在重点地区进行突破，并利用火炮猛烈轰击日军阵地，短短数日内，包围圈内的日满诸部均遭重创，丢盔卸甲。曾经不可一日的关东军现在灰头土脸，不得不逃回满洲。见损失重大，日本随向苏提出停战要求，双方于9月正式签订停战协定，停止了一切实际军事行动，以苏联的小胜而告终。\n\n在战后，华西列夫斯基的主张虽仍未得到完全采纳，但他的能力却为苏共中央有目共睹，重新得到应有的重视。\n……"
 PRC_CountryInfo_Content.2: "东方守卫"
 PRC_CountryInfo_Content_desc.2: "卫国战争的爆发是俄罗斯大地苦难的开始。在开战后，苏联羸弱的军备无情印证了华西列夫斯基之前的全部警告，大量的苏军在德国入侵后成建制歼灭，布列斯特，基辅，明斯克等重要城市纷纷落入敌手。在此期间，华西列夫斯基和好友叶戈罗夫，图哈切夫斯基和朱可夫等人殚精竭虑，竭尽所能组织红军阻挡纳粹进军俄罗斯大地的脚步。在此期间，受德军节节胜利的影响，日军在远东地区也动作频繁。为保证远东安全，华西列夫斯基被任命为外贝加尔军区总司令，开始负责蒙古人民共和国和外贝加尔军区的战备和调遣工作。\n\n但令华西列夫斯基始料未及的是，联盟的崩溃竟会如此之快。随着德军拿下高加索，逼近莫斯科，布哈林在前往远东的途中失联，斯大林紧急接管了中央的权力，一系列的变故使苏军高层人心惶惶，华西列夫斯基作为一位旗帜鲜明的“斯大林”派将军，受到了其他同事的猜忌，就连同事布柳赫尔也对他的工作提出了质疑，但这些事并未影响华西列夫斯基，他尽可能做好远东地区的守备，组织起蒙古到莫斯科的运输工作，相信只要做好一切的工作，联盟能够击退德国入侵者。但等待他却是一个又一个晴天霹雳：中苏关系因新疆一事急转直下；斯大林被政变下台；德军攻入了莫斯科，数百万士兵、民众和官员在莫斯科的仓皇撤离变成了惨烈的溃逃。事已至此，就连华西列夫斯基这样坚强的战士也不得不承认：联盟的失败已成定局。"
 PRC_CountryInfo_Content.3: "命途多舛"
 PRC_CountryInfo_Content_desc.3: "还未等华西列夫斯基为联盟的命运而感伤，他就不得不开始挽救自己和红军的命运。还未等联盟崩溃的消息传到远东，关东军就已经动作频频，而此时的远东和蒙古红军主力和绝大多数的装备都已调往欧洲战场。尽管华西列夫斯基多次进行了欺敌布置，但纸终究包不住火，随着联盟解体的消息传到远东，东方的豺狼终于亮出了爪牙。日本、满洲国和蒙疆傀儡政权的部队发起了全线进攻，远东和外贝加尔军区的主力都遭到了沉重打击，符拉迪沃斯托克、哈巴罗夫斯克等重镇相继沦陷，尽管华西列夫斯基节节抵抗，甚至诱敌深入，在局部地区取得胜利，但日蒙军的兵锋仍是势不可挡，蒙古人民共和国的首都乌兰巴托迅速沦陷，总书记霍尔洛•乔巴山在分头向西撤退的途中被日军包围壮烈牺牲。蒙疆傀儡政权的领导人德穆楚克栋鲁普亲王甚至喊出了要一举恢复大蒙古国疆域的口号。"
 PRC_CountryInfo_Content.13: "守卫街垒"
 PRC_CountryInfo_Content_desc.13: "所幸，华西列夫斯基之前的布置起到了作用，蒙古人民军以逸待劳，利用日蒙军深入大漠，补给不足的劣势，组织起了有效的防线挡住了日蒙军的西进，将主力撤到了西蒙古地区。而日军在拿下远东和蒙古大半地区后，对继续跨越西伯利亚兴趣寥寥，在实控外兴安岭部分地区，在占领区留下俄罗斯法西斯党后撤回了满洲国，而德穆楚克栋鲁普亲王则在日本的支持下，在被征服的蒙古地区建立起蒙疆联合自治政府，远东的战事暂时告一段落。\n\n由于担心日军很可能发动再一次的入侵，威胁到中西伯利亚的安全，在与远东军区的布柳赫尔商议后，华西列夫斯基前往唐努图瓦的克勒孜，一方面收拢远东和外贝加尔军区的溃兵，另一方面，在与流亡至此的蒙古人民军副司令尤睦嘉•泽登巴尔进行了会晤后，两位败军之将决心抱团取暖，共同组建起人民革命委员会，共同负责对伪蒙疆政权的防务。"
 PRC_CountryInfo_Content.4: "因祸得福"
 PRC_CountryInfo_Content_desc.4: "福祸相依，随着华西列夫斯基在唐努图瓦的立足，在这里，他遇到了一支从莫扎伊斯克撤下来的红军部队。这支部队由苏联第18集团军少将列昂尼德•勃列日涅夫率领，他们穿越了盗匪丛生的哈萨克，试图向远东寻找红军主力，以重整旗鼓反攻莫斯科。在接见他们之后，华西列夫斯基得知了中西伯利亚如今的状况：在联盟崩溃之后，大量流亡至此的知识分子，科学家，学者们在托木斯克聚焦起来，他们与本地的富农群体和中西伯利亚的工厂综合体联合起来，组成了中西伯利亚共和国，这个共和国的军队中有不少他的前同事，如亚历山大·波克雷什金、谢苗·布琼尼和尼古拉·克雷洛夫等人。\n\n华西列夫斯基对这个背离社会主义的共和国感到愤怒，但他也明白，为了手下红军的存亡，此时绝不能斤斤计较。于是，他尽可能压制住手下人的骚动，暗中与中西伯利亚共和国接触，提出以应对蒙疆政权的威胁为条件，换取中西伯利亚共和国的部分补给支持。共和国的诗人总统帕斯捷尔纳克一方面考虑到中西伯利亚稳定的需要，另一方面他也希望战功累累的华西列夫斯基能够为共和国所用，答应了华西列夫斯基的条件，允许红军部队进行正常的商贸往来和补给。伤痕累累的苏蒙联军终于得以暂时立足，得到了片刻的喘息。"
 PRC_CountryInfo_Content.5: "漫漫长夜"
 PRC_CountryInfo_Content_desc.5: "天下没有不散的宴席。虽然华西列夫斯基尽可能约束红军不与中西伯利亚共和国产生冲突，可不代表别人不会。随着从莫斯科撤离的最高主席团在伊尔库茨克正式扎根，实际上的领导人亨里希·亚戈达在完成内部清洗，稳定权力之后，迫切的想要得到西伯利亚计划的食品供应和工厂，从南北两个方向向中西伯利亚共和国发动了入侵。华西列夫斯基的处境瞬间恶化，虽然两方并未爆发冲突，但监视他的眼线越来越多，而华西列夫斯基也惧怕亚戈达因他与中西伯利亚的交易指责他为叛徒，因此对亚戈达政权也是避而不及。随着远东和中西伯利亚战事的冲突逐步降级，华西列夫斯基的处境似乎有所好转。\n\n然而，事情却突然向着最坏的方向急转直下。共和国的高层为结束战事，一方面开始加紧征兵工作和征用食品供应，另一方面向华西列夫斯基下达了最后通牒，要求他和他的部队加入共和国，镇压新西伯利亚和巴尔瑙尔的起义。华西列夫斯基对此断然拒绝，并立即调遣部队开始布防。\n\n然而，还没等共和国的部队前来镇压，更大的分裂接二连三的爆发了：波克雷什金的分离，坎斯克的黑军起义，安德烈耶夫的自立门户…就连他的老同事布琼尼都被黑军所杀。一系列的危机让图瓦周边的局势瞬间恶化，红军部队不得不接连应对来自坎斯克、奥伊罗特和克拉斯诺亚尔斯克的劫掠，残酷的现实使得华西列夫斯基为俄罗斯的未来感伤的同时，也不得不加紧在中西伯利亚的防备，这无疑分散了革命委员会的兵力。"
 PRC_CountryInfo_Content.6: "祸不单行"
 PRC_CountryInfo_Content_desc.6: "1955年，随着蒙疆政权在蒙古高原上立足，德穆楚克栋鲁普亲王渴求再收复西蒙古的土地，彻底完成他的大蒙古国。他与改组国民政府和他的日本主人联合起来，共同发起了向大西北的攻势。庞大的军队冲下了蒙古高原，蒙古人民军脆弱的防线在数倍于己的军队和大量新式装备的攻势下被冲破，虽然华西列夫斯基紧急调遣部队回援，但人民革命委员会在西蒙古仍是兵败如山倒。日军的兵锋直指图瓦，大有一举消灭革命委员会之势。\n\n天无绝人之路，改组国民政府主力在西北征讨之中遭遇了重创，新建立的西北公署治下起义不断，面临着随时崩溃的风险。这使得改组国民政府和日本不得不紧急调兵南下救援西北，孤军深入的蒙疆军在人民革命委员会的反击下被击退，人民革命委员会终于度过了这场灭顶之灾。"

 PRC_CountryInfo_Content.7: "命运歧路"
 PRC_CountryInfo_Content_desc.7: "到1962年，人民革命委员会终于度过了失败后的混乱，新一批士兵也正式应召入伍。但委员会内的俄国人和蒙古人之间分歧不断加剧，逐渐形成了俄国派和蒙古派，俄国派希望集中兵力优先收复中西伯利亚，蒙古派则希望聚焦收复蒙古故土，两派都希望优先收复自己的故乡，彼此之间争斗不断，悲观的情绪在接二连三的失败后充斥着委员会内部，补给的匮乏也时刻困扰着革命委员会的将士们。\n虽然孤掌难鸣，但眼下容不得华西列夫斯基再作犹豫，他必须作出最后，也是最正确的选择，向哪打，如何打，人民革命委员会的命运，掌握在华西列夫斯基的一念之间。\n\n是长夜终尽，还是日暮途穷？"

 PRC_CountryInfo_Folder.102: "今昔"
 PRC_CountryInfo_Content.8: "内忧"
 PRC_CountryInfo_Content_desc.8: "人民革命委员会是一支多民族组成的军队，主要由俄国人和蒙古人组成的松散联盟维持着。虽然共同信仰社会主义，但日常生活中的种种不同，以及对收复故土的意愿，使得他们不由自主的分为了两派：俄国派和蒙古派。双方在委员会内争吵不断，态势也逐渐严峻，似乎一场派系斗争将会不可避免地发生于这片土地上。或许在委员会的人看来，在东方威胁迫近前，内部斗争或许更为重要。并且，在委员会之外，地方也有着鲜明的冲突...\n\n疾病度过危险期后，仍有复发的倾向。"

 PRC_CountryInfo_Content.9: "蒙古派"
 PRC_CountryInfo_Content_desc.9: "蒙古派由扎米扬·勒哈格瓦苏伦带领，他们是蒙古人民共和国最后的有生力量。在联盟崩溃之后，孤立无援的蒙古人民共和国被日满的兵锋摧毁，利用华西列夫斯基之前的布置，在人民军副司令尤睦嘉•泽登巴尔的带领下，他们利用杭爱山脉和色楞格河的防备挡住了日军的攻势，但也损失重大，无力反攻，他们不久后便前往图瓦，与华西列夫斯基达成合作，共同抵挡共荣圈的进攻。在1955年的溃败之后，尤睦嘉•泽登巴尔前往沦陷的西蒙古地区组建抵抗组织：蒙古人民阵线，留下扎米扬·勒哈格瓦苏伦带领蒙古派。他们认为，人民革命委员会应当利用好蒙古人民阵线多年的准备，优先推翻伪蒙古的统治，光复蒙古人民共和国。\n\n多年以来，俄国派和蒙古派之间的纷争已经严重影响了人民革命委员会接下来的工作。无论是优先向东向西，做好派系平衡，凝聚红军的人心都是重中之重。"

 PRC_CountryInfo_Content.10: "俄国派"
 PRC_CountryInfo_Content_desc.10: "俄国派由列昂尼德·勃列日涅夫为首，他们来自于苏联第18集团军和众多向东的苏军部队。在莫扎伊斯克激烈的阻击战中，18集团军司令安德烈·格列奇科与部队走散，剩余的有生力量在少将列昂尼德·勃列日涅夫率领下躲避德国空军的轰炸，穿越西西伯利亚和哈萨克地区，一路遍体鳞伤来到图瓦共和国，在这里他们与华西列夫斯基和他麾下的苏军会和，意图联系其他友军反攻，但中西伯利亚的一系列变故打断了他们的旅途。他们认为，争夺俄罗斯的大战迟早会爆发，人民革命委员会必须做好准备，优先收复俄罗斯故土。"

 PRC_CountryInfo_Content.11: "外患"
 PRC_CountryInfo_Content_desc.11: "人民革命委员会的首要敌人，也是他们的老对手，东方的伪蒙古傀儡，如今的蒙疆联合自治政府。虽然在过去革命委员会胜多败少，但随着时代的发展，蒙疆政权在日本的武装下已经具备了一支强大的力量，而且由于背靠共荣圈，他们随时可以向日本主子请求支援。委员会的次要敌人，则是自中西伯利亚共和国崩溃后分离出来的诸多势力。在奥伊罗特，旧礼仪派教徒尽可能回避着与外界任何的接触，但他们坐拥着阿尔泰地区成熟的农业；坎斯克的西伯利亚苏维埃号称自由，但他们缺乏约束，野蛮的黑军时不时便会对图瓦的边境发起劫掠；安德烈耶夫高呼自由和民主，但实际上却是彻头彻尾的军事独裁政权；至于北方那位离经叛道，自称沙皇的留里克二世，坐拥新西伯利亚，野心勃勃的波克雷什金，还有北方已经彻底敌视苏维埃的托木斯克众沙龙，都是华西列夫斯基不得不跨越的挑战。\n\n可以说，要想洗刷苏联的耻辱，华西列夫斯基必须作好最万全的准备。打垮中西伯利亚的一众分裂势力，以中西伯利亚的精华之力，重振苏联，光复故土。"