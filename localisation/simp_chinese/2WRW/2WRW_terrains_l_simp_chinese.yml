l_simp_chinese:
 novosibirsk:0 "新西伯利亚"
 novosibirsk_desc:0 "§g---------------§!\n§L新西伯利亚，正如其名“崭新的西伯利亚”，完美地概括了俄罗斯东部从一片广阔的荒地迅速转变为俄罗斯工业中心的过程。 在20年代到30年代，新西伯利亚通过西伯利亚计划获得了最多的资金，使其发展成为一个经济发展的不竭源泉。 然而，随着苏联的分崩离析，这座城市的祝福变成了诅咒。 人口过剩和难民危机让人们陷入贫困和绝望，这座城市的秩序只能仰仗巴尔瑙尔的粮食。 毒品泛滥和贫富差距的扩大，加剧了异见者和罪犯的地下活动。  \n \n如今，新西伯利亚的当权者不过凡夫俗子，这片土地满目疮痍，土地和自然资源所剩无几。 民众要求变革的呼声越来越高，但当局者却对无政府主义的锐耳尖叫充耳不闻。这座工人之城需要英雄听射而出，否则它将永无出头之日。§!"
 samara:0 "萨马拉"
 samara_desc:0 "§g--------------§!\n§L双子河畔的女士从未像今天这样堕落过。曾经，莫斯科大都会给予这座城市以祝福，并宣称靠着上帝和天堂的力量，它的城墙将永远不会被征服。然而，伏尔加河上的明珠已经被德国人的炸弹和子弹，以及叛徒们泥泞的靴子永远地玷污了。萨马拉在所谓俄罗斯人民解放委员会叛徒们的鞭子下呻吟着，呼唤着解放和自由。曾经骄傲的街道已经被泥土和鲜血永远玷污了。劳动者的宫殿，那些工业和俄罗斯骄傲的象征，已经被无情的野兽付之一炬。学校、教堂、住宅和寺庙——都被烧成了灰烬和焦土。不管出于什么原因，萨马拉的每一个灵魂都知道，上帝已经离他们而去。§!"
 ulanude:0 "乌兰乌德"
 ulanude_desc:0 "§g--------------§!\n§L上乌金斯克，其居民更熟悉的名字是乌兰乌德，坐落在贝加尔湖畔，就像一个依附在母亲身上的婴儿。它那清澈的湖水哺育了一百代布里亚特人。乌兰乌德曾经是中国和俄罗斯之间贸易路线上的关键一步；但联盟已经土崩瓦解，中原王朝已被日本人奴役，这使乌兰乌德变得荒芜而贫穷。但布里亚特人和他们的俄罗斯邻居拒绝在日益黯淡的旭日下腐烂。这座城市已被点燃，成为远东地区左派鼓动的温床。独立工会和列宁主义青年委员会占领了破旧的街道，一夜之间改变了乌兰乌德。只有他们以外科手术式地付出巨大的努力，新十月革命的种子才能生根发芽。§!"
 perm:0 "彼尔姆海姆"
 perm_desc:0 "§g--------------§!\n§L西俄战争给俄罗斯留下了许多伤痕，但在德国边界以东的城市中，没有哪个城市的伤痕比彼尔姆更深。在雅利安兄弟会的统治下，这个曾经美丽的城市现在被重新命名为彼尔姆海姆，它已经被蹂躏，与曾经的彼尔姆没有任何相似之处。\n\n建筑物摇摇欲坠，基础设施几乎不存在，任何重建它的尝试都只能为残酷统治其微薄人口的上层阶级服务。与曾经在伟大的卫国战争中为苏联的战争提供燃料的工业城市相比，彼尔姆现在几乎面目全非。§!"
