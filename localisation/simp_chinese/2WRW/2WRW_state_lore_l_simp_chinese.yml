state_lore_initials.1001: "NaN"
state_lore_name.1001: "鄂木斯克"
state_lore_desc.1001: "\n\n\n\n\n\n£GFX_state_lore_img_1001_texticon “上主必以嫉愤作武器，武装受造之物来报复仇敌；必披上正义，当作胸甲：戴上正直的判断，当作钢盔，拿上无敌的圣洁，当作盾牌，磨尖盛怒有如利刃；整个世界都要跟随他来攻击愚顽的人。”                                     ——《智慧篇》5:18-21\n\n三十年前——当世间秩序被敲定的那一刻起，对于§V<被涂抹>§!的恐惧便深植人心，这份恐惧随着它自身的扩散和人类的无知而愈演愈烈。直至§x那天§!，恐惧化成可怖的现实，万物皆焚于原子烈焰。而策划这一切的元凶，却仍苟活于这地底的防核堡垒中。\n\n纵然外界已陷入死寂，但对§V<绝密>§!及他的后生们而言，这场§x审判§!仍将继续。那些幸存的灾民与残部，如今只因这一人心中飘渺不定、若隐若现的执念，或被整编在§V<不可见>§!的旗帜之下，或成为§x<已破损>§!墓前的枪下亡魂——成为迎接§R最终宿命§!的末世部队。\n\n对驻守琐珥的军民而言，这重担——日复一日、枯燥无味，作为轮回，将那不可视的未来碾作单调直线。连同地堡与他自己，困顿于此，在单调的色彩中化作无法逃离这§x<未知>§!命运的永恒牢笼。他会是上主口中的义人吗？§V<绝密>§!在昏暗的地堡中沉思，摇曳的灯光映出他斑驳的身影。他曾是高举火炬的狂信者，如今，复仇的烈火仍在燃烧——却已不再壮丽，惟余辐射余烬的微光。他的初衷是什么？是正义，还是执念？他的前路在哪里？是救赎，或是深渊？若他所行皆为错误，为何§R命运§!选中了他？若公道本当得胜，为何上主让一切沦为灰烬？……\n<上主没有回答他>\n而人们蜷缩在恐惧与绝望的深渊里，在永夜中如蝼蚁般残喘，至于§V<绝密>§!本人——也徘徊于虚无的循环中，重复着无意义的仪式，回忆起昔日导师§x<被划去>§!的谆谆教诲……以及掩埋于辐射尘埃中，上主为他编织的§R最终宿命§!……"

state_lore_initials.1002: "NaN"
state_lore_name.1002: "日耳曼尼亚"
state_lore_desc.1002: "\n\n\n£GFX_state_lore_img_1002_texticon \n\n\n\n§W“我要将我所造的人，连人带野兽、爬虫和天空的飞鸟，都由地面上消灭，因为我后悔造了他们。”                                                   ——《创世纪》6:7\n§d繁华、富足、美丽——从帝国之心化作人间炼狱，从世界之巅坠入核火深渊，竟要拉整个世界陪葬。看啊，你的帝国以仇恨为梁柱，以他族的血肉为基石，以他族的哀嚎为颂歌。在那片§V<不可见>§!的广袤土地上，无数人为苦难而泣血，无数人因压迫而流离。为何你们始终不愿明白——这一切终将反噬自身？为何仍沉溺于虚妄的迷梦，不肯睁眼看看城墙外那个被你们亲手变得冷酷无情的世界？\n\n燃烧吧！毁灭吧！无人为你呐喊，世间悲剧因你而起——\n§g若没有你，没有§x<被涂抹>§!与§V<已破损>§!，怎会有今日的怒火滔天、尸横遍野？万国百姓终成灰烬，“神”降下天罚，以§V<已破损>§!将蛾摩拉焚为废墟，浓烟如烧窑般升腾，在无助与恐惧中，家园迈向永恒未知的明天。\n§s哭泣吧！悲哀吧！无人为你悲泣，世间罪恶因你而生——\n\n若没有你，没有§V<被涂抹>§!与§x<已破损>§!，怎会有今日的生灵涂炭、哀嚎遍野？万物生灵化作焦土，“神”降下天罚，以§x<已破损>§!令世间秩序重置，辐射尘埃覆盖大地，在虚无的寂静中，世间走向永无可能的明天。\n§b§V<已破损>§!啊，今日是否能有悔悟。你自诩为盗火的先知，将§x<被涂抹>§!的火种撒向人间。那所谓的光明，不过是焚世的业火。你曾高呼拯救，却亲手点燃毁灭的引线。如今回望，亡羊补牢？\n迟了，终究太迟了。\n§q而今，你只得被钉在命运的山巅，任由鹫鹰啄食你的肝脏，日复一日，在饱受烈火焚蚀之痛中偿还永无尽头的债。\n\n至于后世？他们或讥讽，或悲叹——可你的故事，终究只是一则笑话，亦是场悲剧。\n沉睡吧，沉寂吧……\n若明日仍会降临，愿你重拾残破的盾，立于废墟之上，去做一名核子守夜人罢。§!§!§!§!§!§!"

state_lore_initials.1003: "NaN"
state_lore_name.1003: "莫斯科"
state_lore_desc.1003: "\n\n£GFX_state_lore_img_1003_nothing \n\n\n£GFX_state_lore_img_1003_texticon \n\n\n\n\n\n§W“你真的要把义人和恶人一同除灭吗？假如城中有五十个义人，你还真的要除灭那地方，不为城里的五十个义人而赦免那地方吗？”                 ——《创世记》18:23-24\n\n若因怜悯少数义人而宽恕恶人，罪恶必将如野草般疯长，最终吞噬整个世界。因此，即便要付出血的代价，即便要背负千古骂名，也必须将邪恶连根铲除——这不是选择，而是生存的必然。历史的审判或许会质疑手段的正当性，但若放任恶行蔓延，连§x审判§!本身都将不复存在……§d\n现在，他们站在§V审判席§!前。\n\n义人高举“至高至圣至纯”的旗帜，以正义之名，将敌人——乃至“腐化的同胞”，推入世间最残酷的刑场。举起盾牌，抵御西方的入侵；拿起利剑，指向每一名“恶人”。至于结局，孰是恶人，孰是义人，无辜之人所受牵连，早已无关重要。§g\n因为自§x审判§!降临那一刻起，义人与恶人再无二致。\n\n上主俯视索多玛的废墟，震惊无言。祂曾犹豫是否拯救的义人，竟在§V<被涂抹>§!蛊惑下，被仇恨蚀尽双眼，被复仇的快感吞噬。\n于是，上主降下了天罚。§s\n\n至于他们誓死捍卫的“祖国”，已在原子烈火中化为焦土。他们曾是解放者，后来成了守卫者……\n也是毁灭者。\n\n如今，外界皆归于死寂，唯有士兵们仍机械地执行着§x<绝密>§!遗留的指令，如幽灵般徘徊在索多玛的这片辐射废土上。他们固执地相信§V<已破损>§!终将归来，认定那场§R审判§!尚未终结。§b于是日复一日，他们坚守在崩塌的哨塔与腐蚀的壕沟中，誓言守卫这片焦土直至天崩地裂、海枯石烂，或是血流成河、至死方休……\n§q却浑然不觉，索多玛早已不是他们的家园，而上主的救赎名单中，也再无义人可寻。§!§!§!§!§!§!"

state_lore_initials.1004: "NaN"
state_lore_name.1004: "京都"
state_lore_desc.1004: "\n\n\n\n\n\n\n£GFX_state_lore_img_1004_texticon \n\n\n\n\n\n\n\n§W“那日临近，势如烧着的火炉，凡狂傲的和行恶的必如碎秸，在那日必被烧尽，根本、枝条一无存留。”                                             ——《玛拉基书》4:1\n\n天火降世之时，一切罪恶终将焚为灰烬——索多玛如此，蛾摩拉如是，押玛亦不能幸免。\n当神罚降临，烈焰焚天，将整片大地映作惨白。押玛的一切：奔跑的、翱翔的、欢笑的、祈祷的、哀叹的……\n全在那道净化一切的光中湮灭。阴影闪过，万物归墟。§d\n在辐射尘暴的余烬中，那些幸存下来的，§x<被涂抹>§!的子民们。在§V<已破损>§!的号召下行动起来，重新开始建设那早已湮没于辐射尘埃中的家园。破碎的往昔被逐步拼凑，却终不似从前，惟余对往日时断时续、不知是哭是笑的嘶哑呜咽。§g\n\n押玛的居民向上主泣诉，泣其本应无罪，泣其家庭破碎，而上主仍沉默如铁，冷眼旁观众生在烈焰中挣扎，任他们在废土上爬行、哀嚎、死去，独自面对这可怖的现实。\n押玛诸民真无罪否？\n\n若自称无罪，便该将往昔之恶悉数摊开：东方大地何尝不是炼狱？而押玛的子民，又何曾对他人动容？§s那四十载§x<被涂抹>§!的狂傲岁月里，他们高呼着“黄金时代”，铁蹄踏遍半个人间。那座以万城之砖垒砌的“八纮一宇”之塔，每一块石料内又嵌着多少未寒的冤骨。\n§R<哑口无言>§!\n§b所谓“共荣”，便是以全世之力，共铸一城繁荣：此城之内，纸醉金迷、灯红酒绿；此城之外，哀嚎遍野、白骨累累。\n\n今日繁华俱为尘土，押玛的居民再无辩驳。无辜不等于无罪，因果轮回，他们曾播撒的苦难，今皆化作神罚降临己身。§q但上主仍会留下一线微光：若愿行善赎罪，忏悔往昔，或许能挣脱旧日§x<被涂抹>§!的桎梏，洗净满身血污，于绝境中重铸未来。§!§!§!§!§!§!"

state_lore_initials.1005: "NaN"
state_lore_name.1005: "丹佛"
state_lore_desc.1005: "\n\n\n\n\n\n£GFX_state_lore_img_1005_texticon \n\n\n\n\n\n\n§W“这一切都过去了，像阴影，像疾逝的流言；像在波涛起伏的水面上航行的船只，驶过之后，无迹可寻，波涛里也没有留下船行的踪迹；或如空中飞过的鸟，一去无踪；它鼓翼而飞，用力冲击，一路穿破轻微的空气，振翼飞过之后，也不见飞过的痕迹；或如射向靶子的箭，穿破的空气立即复原，认不出它经过的路径。”\n   ——《智慧篇》5:9-12\n\n洗扁坐落于自称是§x<被涂抹>§!§d的自由之国中，至少居住于此的子民曾是如此称谓。自造世后的数百年间，战火罕至，上主的信徒在此安居乐业，沐浴着繁荣。但这安逸终成腐化的温床。恶人攫取权柄，正义沦为笑谈，昔日的圣洁之城惟余堕落躯壳。\n\n洗扁曾长久沉溺于遗世独立的幻梦之中，傲慢地笃定这场§R灭世审判§!的烈火永不会延烧至它的城墙之下。然§V<被涂抹>§!何尝不知——这场神罚本就是上主对全地的§R审判§!？\n终于，神罚降临于此。\n\n§g从§V<已破损>§!到§x<已破损>§!，洗扁全境无一幸免——无论繁华都城还是偏远村落，无论权力中枢还是边疆哨站，他们苦心经营的§V<不可见>§!，在神罚面前如螳臂挡车。核火肆虐之处，殿宇化为齑粉，自由燃作飞灰。所谓繁华，不过一日便尽归尘土。\n然而，洗扁的恶人竟欺瞒上主。§s\n\n他们在§V<绝密>§!筑起一座与世隔绝的孤岛，沾沾自喜地认为，自己能在这场§R灭世审判§!中独善其身。他们盘算着：待烈火焚尽万物，待上主重启创世，他们便从地底爬出，如毒虫般蛀蚀新的世界，继续筑造他们奢靡的温床。§b\n但全知的上主岂会为愚妄者戏弄？ §q\n\n恶人们蜷缩在孤岛中，以为能逃过神罚的烈焰。殊不知这份愚昧，早已夺去他们最后一丝勇气。恐惧侵蚀理智，他们不敢再踏出孤岛半步，对新世界的光也战栗不已。直至资源耗尽，万事将尽。恐惧令他们向同僚举起屠刀，用他们的血当作续命的养分，癫狂地争夺着新世界"亚当与夏娃"的可笑名号，最终在自相残杀中泯灭于世。\n这便是上主的§x至终审判§!。§!§!§!§!§!§!"

state_lore_initials.1006: "NaN"
state_lore_name.1006: "§R<错误：无法访问>§!"
state_lore_desc.1006: "\n\n\n\n\n\n\n£GFX_state_lore_img_1006_texticon \n\n\n\n\n\n\n\n§W当上主决意降下神罚，要让焚尽摩押平原五城时，祂的目光掠过那五城的废墟，望见瓦砾间仍有未泯的微光。那便是残存的义人在灰烬中持守善念。于是祂叹息：“为这尚存的星火，我也不全将一切焚尽。”\n于是，神罚降临，却仍为那些义人留下生路。§d\n诚然，这幸存者中，善恶混杂。但这恶人终将被自己的恶行所推倒，无辜者将在上主的庇佑下度过残生，而义人也留存着信仰的依靠。世间虽在§x<被涂抹>§!、§V<被涂抹>§!和§R<被涂抹>§!的侵蚀下面目全非。但神罚只焚尽污浊，至于那纯净的余烬，上主将这留给那些仍持守光明的信徒。§g\n\n那些仍在神罚涤荡之地坚守的人们，唯一能做的便是静候上主将世间污秽焚烧殆尽。当最后的罪孽化为青烟散去，他们将走出阴霾，沐浴在上主新世间的光辉下。§s\n\n世间因此点缀出点点灯火，那是上主为无罪者照亮的方舟。在那里，祂期望这些被拣选者在此涤净杂念，如苦行僧般恪守本心，习得在新世界独自生存的智慧，追随上主神圣足迹的虔诚，以及守护新世永恒正义的勇气。\n\n若干年后，这里的每一处虚无都将在上主的创造下，重新有了天地、光。空气、水及有生命的物。祂将见证新人类的诞生，赐予其福泽与统御万物的权柄，亦会告诫他们：昔日的文明如何因堕落而招致天罚，以致天地倾覆、神怒焚世。这些记忆将如烙印般永存，警醒祂所创造的新生者切勿重蹈覆辙，方能使这重塑的世界得以长存，直至生养众多，遍满地面。§b\n\n只是有时，即便是全知全能的上主啊，也会在这重塑世界的伟业前陷入踌躇：\n§q祂的造物，究竟能否听从祂的戒告，安息繁衍；还是执迷不悟，重蹈那§R悲剧§!的覆辙？§!§!§!§!§!§!"


