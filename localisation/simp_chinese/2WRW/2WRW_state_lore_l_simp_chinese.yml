 state_lore_initials.53_RUS: "塞瓦斯托波尔"
 state_lore_name.53_RUS: "塞瓦斯托波尔"
 state_lore_desc.53_RUS: "塞瓦斯托波尔因其通航的深港和黑海的重要地理位置，一直是一座繁荣的海上城市。塞瓦斯托波尔从叶卡捷琳娜大帝下令建造的一座小堡垒发展成为商业中心和黑海最大的海军基地，使俄罗斯能够向整个地区投射力量。苏联解体后，这座城市更名为狄奥多里希港，以纪念曾经居住于此的日耳曼哥特人，并被德国人大量定居，以确保他们永远控制乌克兰。\n\n但日耳曼尼亚的浪潮缓慢而坚定地被打破，然后被俄罗斯军队果断地击退。随着俄罗斯收回克里米亚半岛，德国在东部领土上定居点的骄傲被与大陆隔绝、孤立、殴打和占领而永远粉碎。虽然占领的伤痕需要很长时间才能愈合，但塞瓦斯托波尔将作为俄罗斯主要的黑海港口再次闪耀。"
 state_lore_initials.87_RUS: "圣彼得堡"
 state_lore_name.87_RUS: "圣彼得堡"
 state_lore_desc.87_RUS: "圣彼得堡以其18世纪末的彼得大帝命名，一直是俄罗斯历史上的重要城市之一，拥有俄罗斯文化的一些最大的标志，也是该国最大的港口之一，接待一个庞大的工业和许多造船厂。\n\n当巴巴罗萨行动开始时，这座城市遭遇了可怕的命运，它的美丽和人口都被德国军队和炸弹的猛攻彻底屠杀，扭曲成纳粹征服者的愿景，因为他们在工厂里将剩余的俄罗斯民众杀害，慢慢地被摧毁。列宁的雕像被一波又一波的德国定居者所取代，被推倒，取而代之的是希特勒。\n\n随着德国最终从东部被赶出，这座城市开始（尽管缓慢）恢复到表面上的正常状态，俄罗斯人正在返回内城工作，纳粹纪念碑被烧毁和拆除。虽然这座城市还需要几十年的时间才能恢复其重要性，但第一步已经迈出了。"
 state_lore_initials.88_RUS: "伏尔加格勒"
 state_lore_name.88_RUS: "伏尔加格勒"
 state_lore_desc.88_RUS: "这座城市始建于 16 世纪，当时名为察里津，自该地区成为当时俄罗斯征服边境的堡垒以来，这座城市就一直矗立在伏尔加河畔。这座城市的重要性经受住了时间的考验，后来成为商业贸易的基础。\n\n第二次世界大战后，这座城市进行了部分重建，并用作德国殖民政权的行政中心。无数的生命在德国的崛起中被摧毁，但随着黎明在旧专员辖区升起，河上的凉爽空气开始漂向新的方向……\n\n德国贵族曾经居住过的古老殖民别墅随着业主被扔到街上而被毁坏和拆毁。德国国防军驻军营房一片寂静。河港的贸易和商业慢慢地从战争的废墟中重新燃起，并没有因奥塔拉河的阴影而减弱。一只凤凰在伏尔加河上冉冉升起，长筒靴无法抑制它的潜力。"
 state_lore_initials.89_RUS: "莫斯科"
 state_lore_name.89_RUS: "莫斯科"
 state_lore_desc.89_RUS: "俄罗斯再次统一。在被德国占领30年后，莫斯科市再次回到俄罗斯人手中，第三罗马城可以再次成为俄罗斯的心脏。自从鞑靼枷锁被挣脱、俄罗斯人民获得独立以来，莫斯科一直处于俄罗斯文明的中心。苏联惨败后，德国当局选择以该城市命名整个殖民地，以进一步在被压垮的敌人的伤口上撒盐。\n\n尽管经历了数十年的抢劫、占领和剥削，莫斯科仍然是政治和经济的中心地点。虽然它的光芒褪去，但这座城市本身仍然完好无损，等待着从德国的长筒靴中解放出来。随着街道被清理干净，德国占领的最后遗迹被摧毁，恢复这座城市昔日辉煌的第一步已经开始。莫斯科市迎来了新的黎明，它张开双臂返回祖国。"
 OMS_World_Ended_Title: "无信号"
 OMS_World_Ended_Initials:0 "---"
 OMS_World_Ended_desc:0 "§R我选择了他，因为我希望他能在我之后引导他的子孙和家人，使他们秉持公义与正直，遵循上主的道路。如此，上主将会实现对他所承诺的事。§!"


 state_lore_initials.828:0 "AQM"
 state_lore_desc.828:0 "阿克莫拉是一座坐落于哈萨克斯坦北方的苏联城市。\n阿克莫拉的历史可以追溯到1824年，当时，沙皇的西伯利亚哥萨克军队在此建立城堡，后逐渐发展为城市。20世纪初，阿克莫拉被建设为成为铁路枢纽，经济也随之迅猛发展。再后来，苏联在纳粹铁蹄下四分五裂，哈萨克斯坦旋即迈向独立，大量难民涌入阿克莫拉，与他们一同到达的还有金钱、物资以及廉价的劳动力，阿克莫拉因此得到了长足的发展。\n然而，帕维尔·菲京却有着一套自己的看法。\n如果想要在哈萨克人的土地上“保卫苏联”，那么阿克莫拉绝对是这位NKVD老将的不二之选，这座城市并不像其她的南方朋友那样具有更为浓厚的哈萨克色彩。相反，数目庞大的俄罗斯族裔深刻地改变了这里，使其更相像于北方的破碎邻里：随处可见的苏联式建筑与标语无不标榜着阿克莫拉的独特——与割裂。\n今日的阿克莫拉，依然承载着哈萨克民族厚重的历史脉络与文化精魂。崭新的垦荒浪潮为这片土地披上了繁荣的盛装，却难以完全遮掩那暗流湍急的政治漩涡。或许连阿克莫拉自己都未曾察觉，她斑驳的城墙早已镌刻上苏联的兴衰密码，而在她的未来之路上，来自苏联的阴影仍将如影随形，为她的前途平添几分扑朔迷离的变数。"
 state_lore_name.828:0 "阿克莫拉"
 state_lore_initials.829:0 "KGD"
 state_lore_desc.829:0 "一座与地底财富血脉相连的城市，其注定要在繁荣的馈赠与毁灭的诅咒间永恒徘徊。\n\n从历史上看，卡拉干达一直是哈萨克斯坦煤矿开采的中心枢纽。现代卡拉干达的历史可以追溯于1833年牧羊人偶然发现的煤矿。这一发现迅速引发了开采热潮。苏联时期，地质勘探确认了丰富的煤矿储量，在工业化推动下，这座城市迎来了快速发展。\n\n可悲的是，布哈林时期的卡拉干达始终未受重视，缓慢的工业化使其停滞在边陲小镇的规模。斯大林时代，这里沦为政治犯的流放地。当纳粹铁骑踏破东欧时，占人口七成的德裔居民遭到苏联当局的猜忌与迫害，最终演变为政府对德裔居民的大规模驱逐，使这座城市又迅速走向衰落。\n\n当苏联的钢铁巨幕轰然落下，这片沉睡在地底亿万年的黑色太阳终于迎来破晓时分。位居全哈萨克斯坦之首的煤矿储量，使这里迅速成为哈萨克斯坦工业化的核心引擎：。矿井如蛛网般向地心延伸；炼钢厂的火光昼夜不息；铁路满载着煤炭与钢材驶向全国各地——昔日的荒原小镇，已成长为哈萨克斯坦工业王冠上最耀眼的宝石。而这份工业荣光的背面，早已被煤灰蚀刻出深深的裂痕——卡拉干达正在自己创造的黑色神话里缓缓窒息，在辉煌的粉尘中走向停滞。\n\n卡拉干达正站在发展的岔路口：国家经济发展计划上的数字仍在要求提高产量，是继续掘取地底的黑金，让子孙在煤灰蔽日的天空下喘息；还是拨云见日，为城市搏得一个可持续的未来？\n\n亦或许，卡拉干达将看不到下一个黎明......"
 state_lore_name.829:0 "卡拉干达"
 state_lore_initials.830:0 "ALM"
 state_lore_desc.830:0 "“我泪落如雨，我将泣诉这段往事……\n在我的故土，名为阿拉木图，背信者在此盘踞。\n因一时疏忽，你放开了我的故土，名为阿拉木图，\n我璀璨耀眼的玫瑰，还有我族人三万家园。”\n              ——《阿拉木图，吾之花》\n\n身为哈萨克斯坦的首都，阿拉木图无疑是这个国家最庞大、最繁华、种族和文化最多元化的城市。正因如此，她注定是哈萨克斯坦复兴之路的领航者，却也难以逃脱历史洪流中的沉浮起落。\n\n虽说历史悠久，但阿拉木图命运的转折点，始于突厥斯坦-西伯利亚铁路的第一锹土。火车轮毂的轰鸣不仅带来了现代文明的曙光，更牵引着整座城市驶入工业化快车道。到了卫国战争，严峻的形势迫使布哈林政府实施战略转移，而这为阿拉木图注入了决定性活力：随着大批工业设施和专业技术人员的迁入，阿拉木图在战火中完成了惊人的产业蜕变，并一跃成为哈萨克斯坦的工业重镇。\n\n如今，苏联大厦轰然倾塌，整个哈萨克斯坦深陷孤立封锁的寒冬。即便是这颗最耀眼的中亚之星，也难逃时代阴霾的笼罩。本应展翅高飞，却在此刻与姊妹城市们共同经历着建国以来最严峻成长阵痛的阿拉木图，也只得在无尽的混乱、暴力和萧条中，不得不停下脚步，为她的祖国和人民发出最为沉痛的啼血悲歌。\n\n若有某日，哈萨克斯坦最终能冲破孤立的藩篱与北方巨熊的阴影桎梏，这座群山拱卫的苹果之城。或许将倚靠哈萨克民族游牧血脉中奔涌的开拓精神，在哈萨克文明的苍穹下，重新绽放出最夺目的光芒。彼时将是哈萨克民族历经整整三个世纪的寒冬后，苦苦等待的春天……\n\n只是没人知道，那个春天何时才会真正到来。"
 state_lore_name.830:0 "阿拉木图"
 state_lore_initials.831:0 "SMK"
 state_lore_name.831:0 "希姆肯特"
 state_lore_desc.831:0 "当现代商旅沿着古丝绸之路的轨迹前行时，希姆肯特这座千年商埠，依然能开放的姿态拥抱四方来客，却再也难觅当年繁华模样。\n\n卫国战争期间流传着这样一句话："每三颗射向纳粹的子弹，就有两颗含着奇姆肯特的铅。"这并非空穴来风。早在1930年代，苏联就因希姆肯特丰富的有色金属矿藏在此建立了大型铅厂，其产量一度占据全苏联70%。战争爆发后，布哈林政府决定将西部的一些工业企业进行疏散。数十家军工企业转移至此，使希姆肯特成为重要的军工生产基地，源源不断地为前线输送坦克配件、炮弹、金属材料、光学仪器等战略物资。\n\n然命运造化弄人，希姆肯特本应引领哈萨克斯坦迈向现代化征程，她自己却未曾料到，这繁荣表象下早已暗潮汹涌……\n\n20世纪50-60年代，曾是希姆肯特经济腾飞的黄金时期。随着第一次突厥战争和费尔干纳战争的爆发，南方邻国的动荡致使大量难民涌入，其中不乏有犯罪前科者。整座城市很快陷入治安危机：犯罪率呈指数级攀升，投机倒把与盗窃案件激增。与此同时，毒品贩运也在迅猛发展——借助南方乱局运来的毒品，奇姆肯特急速成长为哈萨克斯坦最大的毒品贩运中心之一。面对此等乱局，帕维尔·菲京领导的NKVD不仅消极应对，甚至纵容警界腐败蔓延，让局势雪上加霜。\n\n如今的希姆肯特被困在一个遭人遗忘的角落，她的市民们在犯罪与暴力的阴影中艰难求生。尽管在整个哈萨克斯坦的都处在社会动荡的背景之下，这座城市的困境似乎也不过是时代洪流中的一个注脚......\n\n但或许真的有那么一天，这座古城会在沉默中孕育出毁灭其祖国的可怖力量。\n\n"
 state_lore_initials.832:0 "FRZ"
 state_lore_name.832:0 "伏龙芝"
 state_lore_desc.832:0 "在天山北麓的楚河谷地，伏龙芝的苏维埃式方尖碑依然高耸，但这座城市的灵魂却已在胜利与衰败的夹缝中迷失——这座吉尔吉斯斯坦的首都，在经历了一场闪电般的军事胜利后，却发现自己陷入了更深的困境。\n第一次突厥战争后，吉尔吉斯斯坦的军队如风暴般席卷费尔干纳盆地，将这片富饶的绿洲纳入版图。伏龙芝一度沉浸在胜利的狂欢中：中央广场上堆满了缴获的武器，电影院日夜放映着歌颂军队的新闻片。但很快，征服的代价开始显现——前线需要驻军，盆地需要镇压，而伏龙芝的国库却在急速枯竭。所谓那座为庆祝胜利新建的"人民英雄纪念碑"，才竣工半年就被改成了征兵办公室。\n随着资源不断流向新占领土，伏龙芝的城市建设理所应当地陷入停滞。\n伏龙芝的困境恰似天山融雪形成的泥石流——最初的胜利浪潮过后，留下的只有淤塞与混乱。新占领的费尔干纳盆地像一块过大的拼图，始终无法与吉尔吉斯斯坦原有的版图严丝合缝。当夜幕降临，市政厅的灯光依然亮着，但里面争吵不休的官员们，既无力消化战果，又不敢承认失败。这座城市就像它著名的马奶酒——初尝酣畅，后味却满是酸涩。\n或许伏龙芝的未来就藏在那些被官员们忽视的细节里：大学生偷偷传阅的地下报纸，市场上突然出现的走私违禁品，以及军营墙上那句新涂鸦——"我们赢得了战争，却输掉了家乡"。当楚河春汛再次来临时，这座城市终将明白：\n真正的胜利不在于夺取多少土地，而在于能否让自家的屋顶不再漏雨。"
 state_lore_initials.833:0 "TSK"
 state_lore_name.833:0 "塔什干"
 state_lore_desc.833:0 "“战火纷飞，岁月流逝。城市在烈焰中消失无踪。\n但镜光闪烁间，布哈拉厅已如梦诞生——\n由纤石蕾丝编织而成，浸润着最柔和的洁白之光。\n\n是呐，建造师深知：\n疲惫的儿女们，必将带着胜利重返此堂。“\n   ——《塔什干诗篇》\n大量考古证据表明塔什干的历史相当悠久。最早的定居者可追溯至布尔古利克文化时期，历经伊斯兰哈里发、帖木儿帝国及浩罕汗国统治后，这座城市最终毫不意外地成为俄罗斯帝国在中亚势力延伸的一部分。\n俄罗斯帝国崩溃后，塔什干成为突厥斯坦苏维埃社会主义自治共和国首都，于1920至1930年代启动工业化进程。苏德战争爆发后，为保存工业实力，布哈林政府将俄罗斯西部和乌克兰的工厂迁至塔什干，随之涌入的俄乌难民多数选择永久定居。\n随着苏联崩溃，乌兹别克斯坦凭借遗留的工业设施与专业人才迅速崛起，巩固了塔什干作为中亚第一城的地位。政府大力兴建科研与工程设施，城市绿化成效显著。彼时的乌兹别克斯坦尚沐浴在和平发展的繁荣之中，中亚地区整体维持着稳定态势······\n然而自突厥斯坦军团跨过阿姆河之日起，这一切繁荣稳定便荡然无存了。\n先是第一次突厥战争，继而爆发费尔干纳战争。乌兹别克斯坦的领土被周边势力瓜分殆尽，其军队在费尔干纳盆地被吉尔吉斯人击溃后，残部退守塔什干。经数昼夜激战与北方邻国调停，费尔干纳全境划归吉尔吉斯斯坦，塔什干则彻底沦为孤岛。\n作为乌兹别克民族精神的象征，亦是现实政治中的重要筹码。塔什干虽面临吉尔吉斯斯坦的严密封锁，敌人高悬的达摩克利斯之剑时刻威胁着城市的生存命脉，但昔日“太阳城”的居民仍选择坚守家园，不计一切代价，陪伴着她度过最黑暗的岁月。\n不过单凭毅力及这座城市日益衰败的现状，塔什干居民迎来的或许并非期盼已久的胜利。在诸多不确定因素影响下，这座城市的未来恐怕并不光明。"
 state_lore_initials.834:0 "NMG"
 state_lore_name.834:0 "纳曼干"
 state_lore_desc.834:0 "“她怀揣着一颗乌兹别克的心脏，却装在一副吉尔吉斯的躯体内！”\n若去纳曼干中央广场上的胜利纪念碑下，卖酸奶的乌兹别克老人仍会指着基座上的弹痕，向你讲述那个没有抵抗便沦陷的清晨——言语中饱含愤慨，但更多是无奈。\n第一次突厥战争后的某个黎明，吉尔吉斯士兵的皮靴声惊醒了纳曼干的集市，这座城的命运自此便不情愿地同吉尔吉斯斯坦绑定在一起。\n哪怕历经数年的统治，占领者们的存在仍像一层浮油，始终无法融入纳曼干的城市肌理。巴扎里，吉尔吉斯商人摊位门可罗雀，而乌兹别克老匠人的铜器铺前总围着"恰好路过"的市民；学校里强制教授的吉尔吉斯语课上，学生们整齐的朗读声完美掩盖了课桌下传递的乌兹别克语诗抄。纳曼干看似被装进新的容器，但随处可见的那抹暗红却永远带着故土的滋味。\n纳曼干正因其新的躯体而产生强烈的排斥反应，在吉尔吉斯斯坦的版图上闪烁着不合时宜的乌兹别克光芒。在她身上，新漆的吉尔吉斯文标语正在剥落，露出底下乌兹别克语的旧口号——这座城市的每一处裂痕都在无声控诉着强加的归属。\n当吉尔吉斯总督在其官邸庆祝"统一日"时，也许新的阴谋正在酝酿，只待时机成熟……\n便会破壳而出。"
 state_lore_initials.835:0 "NKS"
 state_lore_name.835:0 "努库斯"
 state_lore_desc.835:0 "“看呐，那就是努库斯，我们卡拉卡尔帕克人引以为豪的家乡。”\n在咸海之滨的荒芜平原上，努库斯如同一座从沙暴中突然显现的海市蜃楼。这座曾经苏联时期不起眼的边疆小城，如今戴着卡拉卡尔帕克斯坦首都的新冠冕，却难以掩饰其根基的脆弱。\n第一次西俄罗斯战争的混乱，让卡拉卡尔帕克人意外获得了建国机遇。在政府大厅内，那张被反复修改的中亚地图就是最好见证——原本标注"乌兹别克斯坦人民共和国"的区域，如今被粗糙地贴上了属于卡拉卡尔帕克斯坦的新国名。市中心广场上，卡德罗夫的雕像取代了列宁像，但基座还是原来的花岗岩。\n如今，新生的卡拉卡尔帕克斯坦人民共和国面临着四面楚歌的困境。咸海持续萎缩带来的沙暴侵袭着城市，乌兹别克斯坦的边境哨所近在咫尺，时不时爆发小型的武装冲突，而国库里仅有的外汇仅是前政府留下极少卢布。努库斯国立大学的教授们则不得不同时教授卡拉卡尔帕克语和乌兹别克语课程——因为教科书还没印刷出来。\n努库斯的未来充满变数。当卡德罗夫在临时建造的总统府里接见外国使节时，窗外的贫民区正在用战地帐篷搭建临时学校；当农民辛辛苦苦地浇灌土地时，却浑然不知他们将在下一场沙尘暴中吞下无节制灌溉的恶果……\n努库斯的命运，或许将最终取决于它的祖国能否在强权环伺的中亚，找到那个微妙的平衡点——就像咸海边缘的芦苇，既要随风摇摆以求生存，又要深深扎根不被吹散。\n但至少在下一场沙尘暴来临之前，他们还有喘息的机会。"
 state_lore_initials.836:0 "SMK"
 state_lore_name.836:0 "撒马尔罕"
 state_lore_desc.836:0 "泽拉夫尚河谷的金色平原上，撒马尔罕的蓝色穹顶依然闪耀，映照着迷失方向的乌兹别克斯坦。\n在雷吉斯坦广场的经学院里，贾迪德主义者正在辩论伊斯兰与现代性的融合，而广场对面的旧苏维埃大楼里，霍贾耶夫总理的办公室灯光彻夜不熄——这位曾经的共产党人，如今正麻木地签署着一份又一份妥协文件。\n第一次突厥战争后，撒马尔罕被迫接过塔什干抛下的首都重担。古城的阿夫拉西阿卜遗址旁，匆忙搭建的政府办公楼显得格格不入；市里的纺织厂因失去费尔干纳的棉花供应而停工，空旷的车间里只有贾迪德派的诗人在朗诵新作。曾经为纪念"社会主义胜利"建造的文化宫，如今成了伊斯兰复兴运动的集会场所。\n在这座千年古城里，不同意识形态正在它的各个角落交锋。巴扎的商人同时售卖苏维埃勋章和古兰经；国立大学的讲师同时讲授唯物史观和伊斯兰黄金时代；甚至古尔-埃米尔陵墓的导游词，也在帖木儿丰功伟绩和社会主义建设中反复横跳。撒马尔罕就像其闻名远扬的彩陶——表面是统一的红色，釉下却藏着无数裂痕。\n尽管政局动荡，撒马尔罕的灵魂依然如常。当暮色降临，雷吉斯坦的阴影吞没红标语时，老茶师依然用四百年前的手法冲泡着绿茶，商队旅馆的庭院里依然回荡着与帖木儿时代相同的都塔尔琴声。\n这座城市的伟大之处莫过于此：无论统治者是蒙古可汗、苏维埃书记还是如今这位迷茫的总理，她始终是那个连接东西方的十字路口——只是如今：遭受遗弃、忍受无视、承受羞辱的乌兹别克斯坦啊，连她自己也不知道，未来的方向究竟在哪里。"
 state_lore_initials.837:0 "AGB"
 state_lore_name.837:0 "阿什哈巴德"
 state_lore_desc.837:0 "“何处曾有驼队跋涉沙海？在灼热尘烟中艰难喘息。\n而今却绽放如瑰丽古里斯坦，我那阳光倾城的绿洲故里。\n无论我置身何方疆域，总为你唱响这首心曲， \n我挚爱的城啊，花园之城。我的阿什哈巴德，我的阿什哈巴德啊……”\n   ——《我的阿什哈巴德》\n阿什哈巴德坐落于科佩达格山麓平原的阿哈尔-捷金绿洲，地处卡拉库姆沙漠与科佩达格山脉之间的狭长地带。由于受沙漠环境影响，该地气候干旱，四周皆为荒漠景观。\n这座城市建于丝绸之路古城康吉卡拉遗址之上。最早见于公元前1-2世纪的记载，最初为葡萄酒生产村落，公元前1世纪毁于地震。凭借丝绸之路的优越位置得以重建，持续繁荣蒙古入侵时期。此后作为小村落存续，直至1\n世纪被俄罗斯人接管。\n1930年，阿什哈巴德的街道首次铺设沥青，这是城市现代化进程的开端。自1935年起草的首个城市规划因原有格局难以改造而搁置。1948年，由于城内建筑多为土坯或烧制砖结构，在阿什哈巴德地震爆发后，市内大部\n筑损毁至无法修复的程度。\n万幸的是，彼时的中亚虽因苏联崩溃而深陷孤立，但各国间的互助条约帮助了这座城市度过最艰难的时刻。依照原有规划蓝图，以及中亚各地工匠的共同努力下，这座城市被重建为绿荫与花海环绕的美丽都市。\n中亚同盟解体后，土库曼斯坦仍勉强维持着稳定局势，阿什哈巴德因而被誉为"中亚的稳定灯塔"。伴随着现代丝绸之路的开通，这座城市在区域动荡中被注入新的活力。\n然而世事从无坦途，波达政权仍面临着极大的麻烦——内要组建民族认同与保障经济稳定，外需直面突厥斯坦军团的军事威胁。也许现在尚能维持安宁……\n但身处花园环抱中的阿什哈巴德啊，可能无力再承受似过去那场二十年前的剧变了。"
 state_lore_initials.838:0 "DSB"
 state_lore_name.838:0 "杜尚别"
 state_lore_desc.838:0 "在巍峨的吉萨尔山脉环抱中，杜尚别如同一座被遗忘的孤城。苏联时代建造的政府大楼依然矗立，但墙上的马克思画像已被风沙侵蚀得模糊不清。中央广场上，加富罗夫总书记的演讲声在空荡的广场回响，而排队领取配给面包的队伍已经绕过了三个街区：如今的杜尚别，正在经历建国以来最寒冷的冬天——不仅是气候意义上的，更是精神层面的。\n第一次突厥战争后，塔吉克斯坦失去了东方巴达赫尚的红宝石矿区和北方费尔干纳的粮仓。在杜尚别中央博物馆内，原本完整的国家沙盘模型被粗暴地挖去两大块，露出刺眼的木板底色。\n在这片集体抑郁中，杜尚别人却发展出独特的生存智慧：茶馆里的长者用都塔尔琴弹奏古老的旋律，巴扎的商贩偷偷贩卖绣有完整国土的刺绣，甚至国立大学的教授们在讲授官方审定的历史课时，也会突然停顿，然后用意味深长的眼神看向西方那片曾属于祖国的雪山。\n面对国仇，杜尚别既不甘心做失败者，又找不到重振旗鼓的路径。吉萨尔山脉的阴影终日笼罩着这座城市，就像塔吉克人挥之不去的自卑感。\n但杜尚别那夜夜不熄的微微灯火，仿佛在提醒世人：只要还有人记得菲尔多西的史诗，只要瓦赫什河的水仍在流淌……\n塔吉克人就永远不会真正放弃对明天的期待，加富罗夫的统治已然动摇——但他们还暂时不知道，这种所谓的“明天”究竟会以何种色彩到来。"
 state_lore_initials.839:0 "KRS"
 state_lore_name.839:0 "卡尔希"
 state_lore_desc.839:0 "“你如烈日般炽热，突厥斯坦自由的儿郎，骄傲而从容！\n但你为何祈祷？又为何梦想？\n你已是人间至美的繁华，本身即是奇迹！”\n   ——《杨树》\n在前苏联史学中，卡尔希的出现通常归因于14世纪上半叶。16世纪，该城成为昔班尼王朝的区域行政中心。1868年撒马尔罕被俄罗斯帝国占领后，这座城市成为布哈拉酋长国仅次于布哈拉的第二大城市。其后随殖民扩张并入俄罗斯帝国，最终成为新成立的乌兹别克苏维埃社会主义共和国的一部分。\n卡尔希因其南北贯通而成为阿富汗与中亚的连接要道。但那时料谁也没有想到，数十年后，中亚黑斑自此处如潮涌出。 尽管卡尤姆汗的军队在中亚联军顽强抵抗下未能达成既定目标，仍牢牢掌控着卡尔希这一关键据点，突厥斯坦军团遂长期驻防于此。\n在阿富汗的资助下，卡尔希快速崛起为中亚南部最繁荣的都市之一。充裕的投资使突厥斯坦军团实现了自给自足，即便在阿富汗终止合作关系后，仍能维持军事运作。\n当目睹家乡巨变后的面貌时，那些曾生活在卡尔希的人们都不得不承认：他们看到的确是一座今非昔比、仿若乌托邦般的城市——但这，绝非是他们的家园。 \n目光所及之处，卡尤姆汗的巨幅画像随处可见。苛捐杂税致使民生凋敝，所谓的“泛突厥事业”沦为敛财工具。百姓挣扎求生却食不果腹，军队肆意施暴却无人制止——卡尔希彻底沦为血腥与暴力的温床，她佝偻的身躯在突厥巨人的暴政鞭笞下艰难前行。\n对卡尤姆汗而言，他的野心远不止于此。卡尔希无非就是泛突厥宏大征途的一个小小棋子终有一日，他的铁骑将踏遍山河，他的教条将响彻中亚，他的权柄将笼罩四野。待到那时，整个中亚都将跪伏于他的靴前，而他的帝国——归于一体，永祚千年。\n但卡尔希摇摇欲坠的根基，还能支撑这位“图兰统领”的野心……\n持续多久呢？"
 state_lore_initials.840:0 "KBL"
 state_lore_name.840:0 "喀布尔"
 state_lore_desc.840:0 "“美丽的喀布尔啊，群山环绕四旁。她那丛生的荆棘，玫瑰也嫉妒若狂。\n大风吹起她的微尘，刺痛我的双眼，但我热爱她，因这微尘诞生过阿舒翰与阿热凡。 我称颂她那明艳的郁金香，我为她葱郁的林木而歌唱。\n从巴斯坦桥流下来的河水是多么清冽！但愿安拉保佑这美景免受俗眼的污染！”\n   ——《喀布尔》\n相传喀布尔已有三千五百余年历史，早在阿契美尼德波斯帝国时期便有文献记载。从地理位置上看，这座城市地处亚洲十字路口，坐拥连接中亚与南亚贸易路线的战略要冲，因而成为古代丝绸之路的重要枢纽。\n莫卧儿帝国时期，喀布尔迎来了它的首场繁荣。虽因后期统治者治理疏失而渐趋衰落，但它仍是周遭地区最重要的集市城市。第二次英阿战争后，现代纺织与皮革产业在此萌芽。哈比布拉汗国王执政期间，这座城市进行了现代化改造，电力、电话及邮政服务相继引入。\n两次世界大战期间，喀布尔得到了德法两国的援助。二战中，阿富汗试探性向轴心国求援，随着轴心国在中东取胜，阿富汗顺势倒向轴心阵营并获取大量援助。五十年代后，加速现代化的阿富汗借机扩张，普什图尼斯坦的版图得以补全。而在这些军事胜利的推动下，喀布尔的发展来到了一个新的巅峰。\n今日的喀布尔，以其历史悠久的花园、集市和宫殿而闻名，现代建筑错落其间。景致之秀美、市井之兴旺，连欧洲游客亦不吝赞誉，"中亚巴黎"的美誉由此传扬。\n然而随着轴心国内部分裂，喀布尔所获援助渐趋不稳。为守护普什图土地付出巨大代价后，外界边防压力与内部政治斗争的压力使城市初显衰颓。但坚韧的普什图人始终相信，哪怕前路有多凶险，但坚韧的普什图人始终坚信：即便前路凶险，纵使敌人不惜代价殊死相搏，他们也必将跻身那"幸存一千人"之列。毕竟……\n“得到了再失去，总是比没从来就没有到来更伤人。”"
 state_lore_initials.841:0 "KDH"
 state_lore_name.841:0 "坎大哈"
 state_lore_desc.841:0 "人们常喜欢将坎大哈称之为颇具有阿富汗古朴风味的现代城市。\n这座矗立在阿富汗南部的古老城市，曾是波斯帝国的边陲重镇，莫卧儿王朝的军事要塞，也是普什图族的文化心脏。千百年来，它用夯土城墙和清真寺的尖顶，默默记录着征服者的来去。\n第二次世界大战的胜利旋风以摧枯拉朽之势席卷这片干燥的土地——德日的投资让坎大哈拥有了崭新的发电厂、柏油公路和无线电广播站，现代化的浪潮似乎正冲刷着这座沉睡的沙漠之城。\n然而，与喀布尔的金碧辉煌不同，坎大哈的"现代化"更像一件不合身的外套。西方传授的浇灌方法让土地陷入到了盐碱化的麻烦中；现代化的纺织产品令坎大哈引以为傲的纺织产业陷入困境。更深的矛盾则隐藏在街巷之中：当喀布尔的精英们纸醉金迷时，坎大哈的毛拉们正在清真寺的阴影下低声布道，将现代化斥为"异教徒的诱惑"。市场里，穿西装的政府官员与缠头巾的部落首领擦肩而过，彼此投去的目光里满是警惕。\n时至今日，这些暗涌的对抗正潜移默化地影响坎大哈。现代化的街道上，大部分人仍旧喜欢穿着传统服装；新建的学校里，接受革新思想的学生同伊斯兰教徒爆发了激烈的言语冲突。这座城市就像她著名的石榴——坚硬的外壳下，包裹着无数鲜红的籽粒，每一颗都可能孕育出不可预知的力量。当喀布尔的金色之梦破碎时，坎大哈或许会第一个扯下那件不合身的外套，露出她始终未变的底色：\n一片既拒绝被征服，也拒绝被"启蒙"的倔强土地。"
 state_lore_initials.842:0 "HRT"
 state_lore_name.842:0 "赫拉特"
 state_lore_desc.842:0 "第一次突厥战争曾一度让赫拉特陷入荒芜。\n不过战后，在喀布尔的默许下，赫拉特同她的邻里们解除了误会——这座不属于普什图人的城市，没必要和她的同胞刀剑相向。赫拉特也如同一只凤凰，从历史灰烬中涅槃重生。\n随着"黄金丝绸之路"的复兴，赫拉特重新找回了它作为商贸与文化枢纽的地位。驼铃声再次回荡在修复的商道上，这座丝路古城正焕发着新的生机。巴扎里，波斯商人展示着精美的地毯与铜器，塔吉克工匠的银饰与乌兹别克织工的丝绸吸引着四方来客。古老的商队旅馆再次住满了远道而来的商人，茶馆里回荡着多种语言的聊天。而曾在战火中受损的贾米清真寺，如今在本地工匠的努力下重现了昔日的辉煌，再度成为赫拉特人引以为豪的精神图腾。\n赫拉特的独特之处在于它的包容。塔吉克长者与波斯青年在同一个学堂研习古籍，哈扎拉工匠与普什图商人在市集中和谐交易。即便喀布尔的政令不时传来，这座城市依然保持着某种自治的默契。傍晚时分，不同民族的居民会不约而同地聚集在古老的梧桐树下，分享茶点与故事，仿佛外界的纷争与这里无关。\n不过，赫拉特人深知，他们的城市正走在一条细绳上。一方面，丝路的复兴带来了难得的机遇；另一方面，喀布尔的目光始终未曾远离这座齐聚多民族的古城，。\n或许某天，当政府决定收紧控制时，今日的繁荣景象就会如海市蜃楼般消散。但此刻，赫拉特人选择珍惜当下，继续在古老的城墙下编织他们的复兴之梦——毕竟，这座城市已经见证了太多帝国的兴衰，而她始终屹立不倒。"
 state_lore_initials.850:0 "KZL"
 state_lore_name.850:0 "克孜勒"
 state_lore_desc.850: "克孜勒——一座拥有俄罗斯和蒙古双重身份的城市，中西伯利亚仅存的布尔什维主义堡垒。\n\n当华西列夫斯基的红军和蒙古人民解放军在中西伯利亚共和国和蒙疆联合自治政府的双重夹击下走投无路时，克孜勒不得不成为他们最后的根据地。\n\n与中西伯利亚的其他城市不同，克孜勒并不在西伯利亚计划的规划之中，在华西列夫斯基的红军到来之前，这里不过是一座畜牧业较为发达的小镇。\n\n在得知无法进一步了解伊尔库茨克的情况后。考虑到红军急需修整，华西列夫斯基决定不再冒险东进，转而联合蒙古的同志们一起驻扎此地，作为日后向中西伯利亚进军的重要基地。勒哈格瓦苏伦则更希望克孜勒能够把其目光转向她曾经的母亲——那片在日寇铁蹄下挣扎求生的土地。\n\n在双方构建起的诡异和平下，克孜勒依旧迎来了迅猛的发展，在迈向现代化的道路上高速驰骋。这自然离不开俄蒙二族的辛勤劳动和其红色信仰的支撑。\n\n属于克孜勒的奇迹已然到来，这座城市也已经做好应对各项挑战的准备。但随着华西列夫斯基和勒哈格瓦苏伦二人的分歧逐渐加大，未来不可避免的某天，克孜勒必须亲自裁决她自己的归宿：\n\n§x是踏向混沌未知的俄罗斯大地§!，§Y还是前往蒙古同侵略者们决一死战。§!"

 state_lore_initials.851:0 "AKT"
 state_lore_name.851:0 "阿克托别"
 state_lore_desc.851: "当哈萨克斯坦北部诸地因为俄罗斯的混乱而陷于水深火热时，阿克托别却在周边的动荡中保持着罕见的宁静。\n\n历史长河中，阿克托别这片土地见证了无数中亚文明的荣枯盛衰。自尤兹时期到俄国内战，烽火连天却未能将其摧毁。即便在苏联崩溃后哈萨克斯坦孤立无援的岁月里，这座城市依旧能在混乱的年代里书写着自己独特的生存之道——但令人深思的是：究竟何种特质，使这处兵家必争之地，最终得以避开新秩序的全面袭扰？\n\n今日这一局面的形成，很大程度上归功于马林科夫个人的外交手腕——通过他的积极斡旋，阿克托别当局与奥伦堡革命公社达成了一系列互利协议，使该地区在动荡时期勉强维持和平。\n\n然而，这种和平带来的并不能为阿克托别带来经济上的繁荣。相反，这是一种克制的安稳：阿克托别尚能自给自足的工农业产量；阿克托别与奥伦堡两市间有限的物资调剂贸易；双方为抵御迪勒万格旅劫掠而进行的军事合作。最终让这座城市幸运地避开了席卷周遭的饥荒和战乱。\n\n但阿克托别真正的“保命符”，其实是其在乱世中奉行的"非发展生存法则"：当周边城市在现代化进程中屡遭劫难时，这里刻意维持着技术滞后状态——没有大型工厂，没有战略设施。只有将自己"无价值化"，才能让其因缺乏掠夺价值而远离匪患。\n\n但问题是：当周边战火最终熄灭时，这个世界还需要这样一个刻意停留在过去的小城吗？\n\n"

 state_lore_initials.852: "PVD"
 state_lore_name.852: "巴甫洛达尔"
 state_lore_desc.852: "1861年，为纪念沙皇尼古拉二世的第八子保罗大公，这座城市便更名为巴甫洛达尔（俄语意为“保罗的礼物”）。\n\n的确，巴甫洛达尔算得上是哈萨克斯坦赠予俄罗斯的一份“礼物”。在苏联和中西伯利亚共和国时期，巴甫洛达尔曾因"西伯利亚计划"短暂繁荣，成为哈萨克斯坦北部闻名的工业重镇。自那时起，巴甫洛达尔的市中心便建立起一座"俄哈友谊"的纪念碑，\n\n自巴甫洛达尔选择与俄罗斯绑定起，它切断了自己未来发展的其他可能。于是，当中西伯利亚共和国轰然崩塌，并于战火中毁于一旦时，巴甫洛达尔的经济迅速停摆，旋即成为一座孤岛：俄罗斯抛弃了她，哈萨克斯坦却找不到她。\n\n如今，这座哈萨克边境重镇已处于崩溃边缘，尚能维系其生命脉搏的，仅剩与新西伯利亚之间时断时续的贸易车列。市中心那块纪念碑底座上"友谊"一词的字母正逐个脱落，也似这个时代的辛辣写照：昔年那些在巴甫洛达尔经济腾飞时如潮水般涌来的俄罗斯移民，或于经济寒冬与两族对峙中纷纷选择离去，或留下将此处变作仍可狂欢的犯罪巢穴。\n\n随着利益的光环褪去，所谓友谊不过是面被弃置路边的破旗，任人践踏。那些曾在巴甫洛达尔纸醉金迷时上举杯高歌的“酒肉朋友”，早已作鸟兽散。至于巴甫洛达尔本身，无非就是一节被遗弃的火车车厢，孤零零地停靠在历史的岔道上——等待他人给予她一个重新选择命运的机遇。\n\n在库纳耶夫总书记的战略视野里，正是巴甫洛达尔跌宕起伏的命运轨迹，才赋予其成成为哈萨克斯坦未来的方向标：要么向俄罗斯敞开大门，要么永远把它关上。\n\n不过，哈萨克斯坦的独立宏图能否实现，库纳耶夫总书记自身定也心知肚明，毕竟……\n\n§x哈萨克斯坦可能很难收回这份“礼物”了。§!"

 state_lore_initials.853: "KTN"
 state_lore_name.853: "科斯塔奈"
 state_lore_desc.853: "科斯塔奈——哈萨克斯坦名副其实的“粮仓”。\n\n在留守科斯塔奈的人口中，科斯塔奈就像一位被时代反复戏弄的巨人，它钢铁般的臂膀曾托起哈萨克斯坦的工业梦想，麦浪般的胸膛曾哺育整个国家的饥饿。\n\n布哈林时代的工业迁徙意外造就了科斯塔奈工业与农业并举的双重灵魂。广袤的麦田在风中翻滚着金色的浪涛，而地下丰富的铁矿则孕育出炽热的钢流。这种奇妙的共生关系，曾让科斯塔奈的火车同时装载着粮食与钢锭驶向南北——驰名四海，誉满天下。\n\n好景不长，来自北方的劫掠不断侵蚀着科斯塔奈的每一寸土地，越来越多的人选择背井离乡，这历经短暂的繁荣后，科斯塔奈似乎又要成为从前那个荒凉的边陲小城。\n\n那些拒绝离开的人发明了独特的生存艺术。他们学会了如何拿起武器，与北方的匪帮抗衡，保卫自己的农田和作坊。科斯塔奈人民的勇气固然值得陈赞，但在这种高压环境下，他们也愈发感到力不从心……\n\n如今，这座"双冠之城"的荣光正在北方的寒风中渐渐冷却，高炉的余温与麦穗的残芳交织成一首忧伤的生存史诗。至于最终——科斯塔奈是能摆脱来自北方的诅咒涅槃重生，还是黯然接受自己荒芜的未来，仍是未知数。\n\n"

 state_lore_initials.854: "ATR"
 state_lore_name.854: "阿特劳"
 state_lore_desc.854: "乌拉尔河畔，里海之滨——在阿特劳市，这里蕴藏着哈萨克斯坦储量最为丰富的石油资源。\n\n阿特劳的前身是俄罗斯商人古里·纳扎罗在雅克河口建造的木制堡垒"下雅克堡"。1647至1662年间，该堡垒被雅克哥萨克人洗劫后由古里耶夫家族重建为石质结构，该市旧称"古里耶夫"即源于此。到了1810年，这座堡垒在军事功能丧失后被拆除，其原址逐渐发展为现代的阿特劳市。\n\n二战期间，里海-伏尔加河石油通道一直都是苏军的石油生命线，再加之恩巴油田的助力，阿特劳初步建设起自己的石油工业，也因此迎来了它的第一个春天。\n\n当德军兵锋直指高加索油田时，阿特劳因地处偏远而幸免于战火。战后哈萨克斯坦建国初期，为构建完整工业体系，阿特劳被列为重点工业试验区，经过一系列投资，这座城市从传统的石油开采产业逐步发展成完整的石油产业体系。\n\n不可否认，如今的阿特劳无疑是哈萨克斯坦最具现代化气息的城市之一，石油所带来的利润无疑让她成为哈萨克斯坦中最富有的城市之一。但只要让视角离开阿特劳市，目之所及却皆是满目荒芜——就像牢笼，把阿特劳封印在此处。\n\n石油带来的财富虽让阿特劳的街道铺上了沥青，却无法铺平人们心中的恐惧。每当西南风带来里海对岸的油污气息，老工人们会不自觉地望向对岸——对很多从巴库逃难来的工人，那里始终是他们的故乡，而阿特劳则是他们甜蜜的避风港。\n\n但巴库如此，试想将来，阿特劳也不会因为这些财富而葬送自己吗？\n\n"

 state_lore_initials.855: "SVK"
 state_lore_name.855: "舍甫琴柯堡"
 state_lore_desc.855: "舍甫琴科堡所在的曼格斯套半岛气候干旱，地表多为荒漠和盐碱地，古代为突厥游牧部落的迁徙走廊，而非永久定居点。\n\n19世纪中叶，沙俄吞并中亚后，曼格斯套半岛被划入外里海州，但因其环境恶劣，仅作为军事巡逻路线，同样没有进行大规模开发。\n\n四十年代的某天，一支地质队的钻头凿开了这片死寂之地的秘密。随后，军队如沙暴般席卷而来，推土机碾过荒原，钢筋水泥在月光下疯长。没有人知道他们挖到了什么，只知道帕维尔·菲京的名字从此与这片禁区绑定。\n\n在牧民的传言中，帕维尔·菲京的部下正在这里进行哈萨克斯坦史上最伟大的试验，并能打造出这个世界迄今为止最强大的力量——足以让整个国家享有无尽的能源，以及至高无上的地位。但关于试验的具体细节，人们不得而知。\n\n舍甫琴科堡没有未来，只有等待。等待某个实验结果，等待某道命令，或是等待某场不可避免的爆发。或许某天，当哈萨克斯坦的黎明到来时，人们会发现这片荒漠重新归于寂静，只剩下几根扭曲的钢梁插在沙地里，像一座无名的墓碑。\n\n时至今日，舍甫琴科堡身上唯一被能确认的，只有那个不胫而走的代号……\n\n第27号工地\n\n"

 state_lore_initials.856: "KLO"
 state_lore_name.856: "克孜勒奥尔达"
 state_lore_desc.856: "在老一辈哈萨克斯坦人眼中，克勒奥尔达给他们带来的情绪是复杂的。\n\n作为哈萨克斯坦的 “第一首都”，这里记载着哈萨克苏维埃社会主义共和国最初的心跳。她的富足、她的繁荣，承载着哈萨克斯坦人民最真挚的愿景，克孜勒奥尔达也因此挑起了重担。\n\n在这个懵懵懂懂的国家刚成立的那些日子里，克孜勒奥尔达竭尽所能去支援哈萨克斯坦的每一个角落，帮助这个国家度过了最艰难的日子。彼时的人们，心中都充满了希望，他们乐观地相信，在这座伟大富足之城的领导下，哈萨克斯坦必能成为一颗耀眼的明珠。\n\n但就是这种无闻的付出，克孜勒奥尔达也因此燃尽了她的生命。\n\n当哈萨克斯坦的官员重新进行评估时，他们惊讶地发现整座城市不可避免地阻碍了国家的发展——克孜勒奥尔达太衰老、遥远，以至她年迈的身体无法再为这个国家输送新鲜血液。最终，在经历一番深思熟虑后，哈萨克斯坦政府不得不选择离开她，向西迁移，来到更为年轻的阿拉木图。\n\n对克孜勒奥尔达来说，她记得太多，却每每望着离开她的孩子时欲言又止，迷茫地望着他们离去的背影。\n\n就这样，在锡尔河蜿蜒的河道旁，克孜勒奥尔达像一位褪去华服的老母亲，孕育着哈萨克斯坦最初的梦想。而如今，她的孩子们为了生存早已西行，惟余河水拍岸的声响，以及风沙席卷的呜咽，陪伴她度过无人问津的岁月，蹒跚随着哈萨克斯坦的命运而起起伏伏。\n\n"

 state_lore_initials.857: "ORA"
 state_lore_name.857: "乌拉尔"
 state_lore_desc.857: "在哈萨克斯坦西部的荒原上，乌拉尔如同一座被战火与流民重塑的堡垒，曾经宁静的河畔小城如今挤满了来自四面八方的逃亡者。\n\n苏联解体、俄罗斯崩溃后，乌拉尔的一切都变了。北方的土匪南下劫掠，西部的德国威胁迫近，无数波兰人、乌克兰人、俄罗斯人拖家带口涌入这里，在废弃的工厂、公园甚至墓地里搭建起临时住所。\n\n整座城市的街道也成了民族矛盾的缩影。波兰难民组成的自卫队与乌克兰帮派争夺粮食配给；俄罗斯流亡军人把持着黑市交易；而本地的哈萨克人则在日渐缩小的社区里坚守着最后的地盘。这座城市的每一种成分都在激烈碰撞，谁也不知道最终会这一切会将他们的家园引向何种结果。那些尚对此等乱局抱有一丝希望的人，在警察局长的办公桌上堆放其用数种语言写的投诉信，而实际上，法律在这里早已名存实亡。\n\n尽管哈萨克斯坦军方意图将乌拉尔打造成西部堡垒，但内部的混乱可能比外敌更危险。军营里的士兵有一半是刚征召的难民，他们更关心如何趁机在打仗时捞一把而不是站岗；德国侦察机经常越过边境，而防空部队却面临着弹药不足而不敢开火的窘境。这座城市就好像那些被难民拆去当柴烧的围栏——早已在人群摧残下千疮百孔。\n\n这里的人们不禁想象：如果外部压力消失，这座城市是否会找回曾经的平和？还是说，它注定要在这片混乱中孕育出某种全新的、粗粝的生存方式？\n\n"

 state_lore_initials.858: "ZBL"
 state_lore_name.858: "江布尔"
 state_lore_desc.858: "何为江布尔？\n\n谈及这座特殊的城市时，就不得不提到江布尔本人——哈萨克斯坦近代最著名的行吟诗人。不论是在十月革命、卫国战争还是西俄战争期间，江布尔都用他最独特的方式来诉说他对哈萨克斯坦最朴素的爱国情怀——直至他离世。\n\n就像他最知名的长诗《我的生活》一样，江布尔展现了哈萨克人在新旧两个时代的生活。在过往平凡的日子中，江布尔无非为座边陲小城，而当哈萨克斯坦被孤立时，依托着这个国家为数不多的交通生命线，江布尔缓缓踏上她的发展之路。\n\n如今，走在江布尔年久失修的大街上，穿着西装的青年和裹着头巾的老妇人擦肩而过，各自带着对江布尔诗歌不同理解。坐在古树下歇息时，年迈的老人们会突然用沙哑的嗓音背诵江布尔的诗篇，回味着属于这座城市古老的记忆。当用手轻轻抚摸塔拉斯河大桥的栏杆时，新旧划痕交错，记录着这座城市起起伏伏的一生。\n\n而在江布尔流传下来的诗歌中，这座城市庄严而质朴、平凡而伟大。也正因如此，她才能够在哈萨克斯坦的宏大叙事中散发自己不一样的光芒。\n\n也许只有这样，才是江布尔真正的灵魂所在。\n\n"

 state_lore_initials.859: "PTP"
 state_lore_name.859: "彼得罗巴甫尔"
 state_lore_desc.859: "在伊希姆河冰冷的雾气中，彼得罗巴甫尔像一块被反复抛掷的界碑，两面刻着不同的铭文。西伯利亚铁路的铁轨如同缝合伤口的黑线，将这座城市与北方的荒原强行连接，而南方的哈萨克草原正在它的记忆里慢慢褪色。\n\n早在最初，这座城市并不属于哈萨克斯坦。十月革命之后，为了抑制当地的白军势力，苏俄政府决定将俄族人占主体的彼得罗巴甫尔和鄂木斯克划分给两个国家——前者归属哈萨克斯坦，来保证俄罗斯对大草原的辐射能力；后者作为白军核心城市由俄罗斯进行严格管制。\n\n此后数十年，哈萨克斯坦对这座城市的影响逐渐上升，这得益于俄哈两族的和谐共处和俄罗斯的有意举措。但当旧日政府走向崩溃时，这种和谐自然也就不复存在了。\n\n毫无疑问，西伯利亚铁路为往来的劫匪提供了不少的便利，这座城市迅速被混乱裹挟，哪怕哈萨克斯坦军队不断加强对北方边界的封锁，这种劫掠活动也愈演愈烈。\n\n而每当深夜货运列车呼啸而过时，老城区的窗户会跟着震颤，像是无声的抗议。不远处的巷子中——哈萨克警察的警棍与北方匪徒的砍刀，在铁路桥下交换着暴力的密语，争夺着彼得罗巴甫尔的控制权。\n\n彼得罗巴甫尔的最终归属，或许是屈服于俄罗斯巨人的威胁之下，在二度历经俄罗斯漫长的同化过程中，重新成为俄罗斯不可分割的一部分——无论彼得罗巴甫尔情愿与否。而她只能在沉默中接受这一切……\n\n毕竟有时候，在屠刀面前低下头颅，也算是一种智慧。\n\n"

 state_lore_initials.860: "OKM"
 state_lore_name.860: "厄斯克门"
 state_lore_desc.860: "厄斯克门——因矿而生，因水而兴。\n\n本世纪四十年代以来，随着厄斯克门当地发现了大量的的铜、铅、银和锌资源，越来越多的俄罗斯人和乌克兰人纷纷来到这里采矿并对进行加工处理，这座小城才逐渐为人所知。\n\n到了五十年代，厄斯克门迎来了显著的发展机遇。随着市内的铅—锌联合企业以及厄斯克门水电站的建立，这座边陲小镇迅速崛起，成长为一个重要的工业中心。而其铁路交通枢纽和河港的地位也在哈萨克斯坦的物流和贸易中扮演着关键角色。\n\n但真正影响厄斯克门命运的，是于1961年建设成的布赫塔尔马水库和厄斯克门水力发电站。厄斯克门的矿业和重工业从此不必再依赖其他地区的电力输送，其发展也被按下了加速键。\n\n时至今日，这座城市欣欣向荣，成为哈萨克斯坦北部边界诸多地区中唯一一个处于迅猛发展中的城市。诚然，采矿带来的环境污染初见端倪，居民患呼吸系统疾病的比例也水涨船高——不过对厄斯克门来说，也只是微不足道的的代价罢了。\n\n但眺望北方，战乱的炮火让那里的平原杂乱不堪。人们也意识到，这座城市仍被笼罩在北方巨人的阴影下，只不过它还暂时无法侵蚀厄斯克门的闪耀光芒。\n\n暂时……\n\n"

state_lore_initials.861: "ADJ"
state_lore_name.861: "安集延"
state_lore_desc.861: "身为费尔干纳地区的城市双星之一，安集延同样逃不过被吉尔吉斯斯坦侵占的命运。\n\n作为吉尔吉斯斯坦所摘下的胜利果实之一，离开故枝的安集不可避免地走向了衰败。这座曾经繁荣的乌兹别克古城，如今在吉尔吉斯斯坦的统治下，正以沉默而坚韧的方式守护着自己的灵魂。\n\n觊觎已久的吉尔吉斯斯坦立刻展开了对安集延的同化工作，企图将这片富饶之地永远同吉尔吉斯斯坦绑定在一起。吉尔吉斯斯坦人理所当然地以为，他们既然能够在军事上取得一场毫无悬念的胜利，在其文化和经济上的战争同样可以轻松取胜……\n\n但他们错了。\n\n无论他们使用何种方法，利诱也好，威胁也罢。在安集延的百姓眼中，他们永远不会原谅这群毁坏他们美好生活的恶魔。所谓白天的欣欣向荣之景也无非只是为麻痹伏龙芝眼线而制造的假象。\n\n只有当夜幕降临后，安集延才会展现出她别样的生命力。凄凉的月光下，安集延的百姓们仍会不自觉地将目光转向西方——在那边，他们的同胞也同样处于水深火热之中。而在城市的地下，一个无形的网络正在传递消息，等待着一个时机……\n\n一个能让他们和同胞再度重聚的时机。\n\n"

state_lore_initials.862: "CRZ"
state_lore_name.862: "查尔朱"
state_lore_desc.862: "命运是如此造化弄人，以至于让查尔朱不得不一次又一次地担当起自己最初的使命。\n\n查尔朱的历史可以追溯到很久以前，最初是作为布哈拉酋长国的要塞，用于抵御阿姆河沿岸的游牧民族侵袭‌‌。1886年，一条跨里海的铁路到达该城市为今天其军事和经济地位奠定了坚实的基础。1901年，随着一座铁路桥横跨阿姆河，使得查尔朱逐渐成为阿姆河上游地区的中心城市‌。\n\n今天的查尔朱，当之无愧地成为了土库曼斯坦的第二大城市。在土库曼斯坦安逸的环境中缓步前进，沿着其早已规划好的蓝图迈向明天。\n\n在阿姆河的对岸，则是被层层封锁的突厥斯坦军团控制区——第一次突厥战争过后，土库曼斯坦不得不撤退至阿姆河西岸，利用沿阿姆河而建的防御工事才抵挡住突厥斯坦军团近乎疯狂的攻击。\n\n在这种环境下，查尔朱不得不承担起边防和经济发展的双重重任，整座城市被打造成一座坚固的堡垒。虽然城市发展因此被迫迟缓，但倘若不行此举，查尔朱身后百余万的同胞恐怕都将直面中亚黑斑的死亡威胁。\n\n但即便如此，查尔朱人最深的恐惧来源也并非是随时可能到来的战争，而是麻木。安逸的环境逐渐将可怖的过往冲刷殆尽，当新一代土库曼人在隔离墙边玩耍时，他们已经不再追问墙那边的故事。\n\n或许终有一天，这座城市的记忆会像阿姆河的泥沙一样沉淀，而新一代土库曼人将彻底忘记，河水曾经自由流淌的模样。\n\n"

#state_lore_initials.863: "DSB"
#state_lore_name.863: "杜尚别"
#state_lore_desc.863: "在巍峨的吉萨尔山脉环抱中，杜尚别如同一座被遗忘的孤城。苏联时代建造的政府大楼依然矗立，但墙上的马克思画像已被风沙侵蚀得模糊不清。中央广场上，加富罗夫总书记的演讲声在空荡的广场回响，而排队领取配给面包的队伍已经绕过了三个街区：如今的杜尚别，正在经历建国以来最寒冷的冬天——不仅是气候意义上的，更是精神层面的。\n\n第一次突厥战争后，塔吉克斯坦失去了东方巴达赫尚的红宝石矿区和北方费尔干纳的粮仓。在杜尚别中央博物馆内，原本完整的国家沙盘模型被粗暴地挖去两大块，露出刺眼的木板底色。\n\n在这片集体抑郁中，杜尚别人却发展出独特的生存智慧：茶馆里的长者用都塔尔琴弹奏古老的旋律，巴扎的商贩偷偷贩卖绣有完整国土的刺绣，甚至国立大学的教授们在讲授官方审定的历史课时，也会突然停顿，然后用意味深长的眼神看向西方那片曾属于祖国的雪山。\n\n面对国仇，杜尚别既不甘心做失败者，又找不到重振旗鼓的路径。吉萨尔山脉的阴影终日笼罩着这座城市，就像塔吉克人挥之不去的自卑感。\n\n但杜尚别那夜夜不熄的微微灯火，仿佛在提醒世人：只要还有人记得菲尔多西的史诗，只要瓦赫什河的水仍在流淌……\n\n塔吉克人就永远不会真正放弃对明天的期待，加富罗夫的统治已然动摇——但他们还暂时不知道，这种所谓的“明天”究竟会以何种色彩到来。\n\n亦或者……？\n\n"

state_lore_initials.864: "LNN"
state_lore_name.864: "列宁纳巴德"
state_lore_desc.864: "列宁纳巴德的历史可以追溯到公元前4世纪，当时她是亚历山大大帝在中亚最北端建立的哨所之一。百余年来，这座城市在波斯帝国、阿拉伯帝国、蒙古帝国和沙俄手中经历了多次更名和统治——近代以来仍是如此。\n\n而列宁纳巴德在老一辈人记忆里最熟知的，便是中亚大起义——这场反抗封建压迫的伟大起义正是以1916年7月17日的列宁纳巴德起义为其开端的。\n\n但与其他在费尔干纳战争中被吉尔吉斯斯坦强占的城市不同，列宁纳巴德没有战斗，也没有反抗。当政府大楼上的塔吉克斯坦国旗被摘下时，没有人抬头看一眼。曾经这座城市不屈的个性在此刻全都烟消云散——在列宁纳巴德的居民眼中，他们挚爱的祖国已死，死在那个清晨，死在了巴达赫尚和费尔干纳的战场上。\n\n当吉尔吉斯官员在庆祝他们的"胜利日"时，列宁纳巴德的窗户后并没有愤怒的目光。只有每月十五的夜晚，凄凉的冷月照在这片大地时，少许屋顶上才会传出压抑的啜泣——那是人们在为一个连名字都不愿说出口的祖国哀悼。\n\n就这样，这座曾经充满生机的塔吉克古城，如今只剩下空洞的建筑和麻木的面孔，成为了一副被抽空灵魂的躯壳，等待着一个永远不会到来的黎明。\n\n"

state_lore_initials.865: "KDZ"
state_lore_name.865: "昆都士"
state_lore_desc.865: "昆都士，这座被改造成把出鞘弯刀般的城市，横亘在塔吉克斯坦被占的巴达赫尚山地之前。如今的她，正被喀布尔突然推上战略前线的古城，正经历着与其温和本性相悖的军事化蜕变。\n\n昆都士曾是丝绸之路上的重要驿站，以甜美的石榴和热闹的骆驼市集闻名整个中亚。但现如今，喀布尔一纸命令，欲将这座古城打造成抵御北方反扑的军事堡垒。来自喀布尔的建设资金虽让这座城市快速步入到现代化中，但随处可见的防御工事和军事岗哨仍提醒着昆都士——她的使命为何。\n\n随着塔吉克斯坦方面的压力与日俱增，昆都士的军民生活在持续的高度紧张中。医院里，产房与战地急救室仅一墙之隔；清真寺的唤礼塔上，军用望远镜与经书并排放置。这座城市正在透支自己千年积累的和平底蕴，就像那些被砍伐来修筑工事的百年石榴树——每少一棵，城市的灵魂就凋零一分。\n\n终有一天，昆都士就会像历史上多次发生的那样，从军事重镇变回那个被石榴花香笼罩的边城。但此刻，它必须继续扮演喀布尔需要的钢铁防线——誓不罢休，直面毁灭。毕竟……\n\n昆都士还能重建，但巴达赫尚可能永远都无法再回归大阿富汗的怀抱中了。\n\n"

state_lore_initials.866: "KRG"
state_lore_name.866: "霍罗格"
state_lore_desc.866: "当世界在战争的混沌中步入绝望时，霍罗格却成为了隔绝于世的世外桃源。\n\n霍罗格始建于1932年，此后一直承担着帕米尔地区行政和交通枢纽的作用，同时也作为该地区重要的货物中转站‌‌。\n\n第一次突厥战争的烽火席卷费尔干纳盆地时，霍罗格成为塔吉克斯坦首座沦陷的城市。幸运的是，她也因为地处偏远而免于战火的摧残。\n\n从地理位置上看，霍罗格所在的巴达赫尚山地似乎并不应当享受这份安宁：塔吉克斯坦、阿富汗和中国都宣称自己对这片土地的所有权，对目前拥有这片土地的阿富汗来说，他们也无法保证巴达赫尚能一直掌握在自己手里。\n\n但事实是，霍罗格依旧在自己原本的位置上继续发光发热，静静地躺在喷赤河湍急的水流旁，将帕米尔山地的美景永久定格在这一刻——无人在意，无人袭扰，高山筑起的天然屏障不仅阻挡了寒风，也隔绝了新秩序的喧嚣。\n\n只有慕名而来的旅行家来到这里时，霍罗格才会向其展示这片土地的美丽之处，让其在旅行日志中，为这座小城写下宛若世外桃源般的惊叹：\n\n“在上帝指尖留下的划痕中，霍罗格既有高山阔谷的粗犷，也有杏花春雨的温柔……”\n\n"

state_lore_initials.867: "PSW"
state_lore_name.867: "白沙瓦"
state_lore_desc.867: "白沙瓦的茶馆里流传着一个黑色笑话："要感谢阿富汗人没修好排水系统——那些积水倒映着的天空，是我们唯一还能看到的自由。\n\n这座被巴基斯坦人视为掌上明珠的古城，如今像一件被随手丢弃的战利品，躺在阿富汗帝国版图的西北角落。开伯尔山口的风沙拍打着维多利亚时代留下的殖民建筑，曾经繁华的萨达尔巴扎如今挤满了来自阿富汗军队的二手军需商贩。来往的车辆碾过坑洼的街道，扬起的不再是英属印度时期的繁华尘埃，而是贫困与遗忘的阴霾。\n\n阿富汗征服者将白沙瓦视为收复普什图尼斯坦的证明，却不愿为其倾注半分真心。承诺的工业园沦为蓝图上的墨迹，所谓的基建项目永远停在开工仪式。颇为讽刺的是，那座被改名为"阿富汗-德国友谊医院"的英式建筑里，巴基斯坦医生们仍在用殖民时期留下的设备救治病人。城市供水系统年久失修，但阿富汗总督府门前的德制喷泉却日夜不休。\n\n但在这片看似绝望的废墟里，巴基斯坦独立运动却如同野草般疯长。\n\n白沙瓦的困境恰似它巴扎里那些真假难辨的古董：表面是阿富汗统治下的衰败边城，内里却是巴基斯坦复国运动的神经中枢。当喀布尔炫耀其"现代化成就"时，他们却极少注意到边境传来的声声异响。+\n\n历史的吊诡之处在于，当德国人忙着在喀布尔建造胜利纪念碑时，他们在白沙瓦刻意留下的每件"礼物"，都试图将这种胜利炸得粉碎。也许用不了多久，这座沉默的城市将会愤怒地向世界证明：\n\n正是征服者的冷漠与轻蔑，才得以为巴基斯坦的复兴保留了最纯粹的火种。\n\n"

state_lore_initials.868: "QTT"
state_lore_name.868: "奎达"
state_lore_desc.868: "奎达的命运在近代经历了戏剧性的转折：作为卡拉特汗国曾经的都城，这里曾见证俾路支文明的辉煌。英国殖民者的到来改变了这一切——卡拉特汗国在他们的阴谋下四分五裂，这座战略重镇则被强行纳入英属印度的版图。阿富汗人到来后，由于先前英国人留下的诸多麻烦让卡拉特汗国失去了对奎达的充分法理，加之将这片土地视为普什图人的“要塞”，奎达便被划入西北边境省，融入到大阿富汗的一部分中。\n\n如今，三种政治理想在这座城市激烈碰撞：阿富汗政府大楼前，黑红绿三色旗正无力地飘扬；静谧的街边小巷中，号召巴基斯坦独立的宣传单随处可见；而郊外的山洞内，俾路支人正对着卡拉特汗国的老地图宣誓效忠。\n\n明眼人都能将奎达的矛盾尽收眼底，但身在远处的喀布尔权贵却对此处充耳不闻，任凭奎达向着混乱的深渊滑去。\n\n阿富汗政府办的学校里，普什图族教师会在课本空白处勾勒"大阿富汗"的疆域；清真寺的一处隐蔽角落，巴基斯坦活动家端详着新到手的德国步枪；僻远的茶馆的内，俾路支人正在紧锣密鼓地筹划着下一场袭击。\n\n奎达的未来充满变数：她是心甘情愿继续做阿富汗的边境前哨，还是在历史混乱的潮流中成为巴基斯坦的西南门户，亦或是终归故国，重现卡拉特汗国的昔日荣光呢？ \n\n恐怕无一人知道答案为何……\n\n"

state_lore_initials.869: "KLT"
state_lore_name.869: "卡拉特"
state_lore_desc.869: "在俾路支斯坦的荒芜高原上，卡拉特城如同一座被时间遗忘的废墟宫殿，曾经汗国的辉煌早已风化，只剩下几堵斑驳的宫墙在烈日下投下破碎的阴影。\n\n破败的议事厅里，米尔·艾哈迈德·亚尔·汗仍在举行月度内阁会议，而与会者不过是几个部落长老，却常常因为利益分配不均而在会场上大动干戈，仿佛一支骆驼商队——看似朝着统一方向前进，实则每头骆驼都驮着不同主人的私货。\n\n宫墙上的弹孔因为资金短缺而无法修补，就像英国留下的殖民档案毫不留情地毁坏着汗王统治的合法性。宫殿的地下室里，本就不多的英镑还在被白蚁啃噬，而市场上的商贩却仍在用鸦片当货币。\n\n而当夜幕降临，汗王的卫队便会准时点亮宫墙上的煤气灯，尽管半个城市的居民早已改用煤油灯。这种徒劳的仪式感，正是卡拉特现状的缩影——维持着王权的体面，却掩盖不了权力的空洞。\n\n所谓的宫殿里尽悬挂着掉色的丝绸帷幔，而宫墙外的贫民窟正蔓延如沙漠中的荆棘——这座名义上的"首都"，正以惊人的速度滑向无可挽回的衰败。\n\n卡拉特的未来或许早已注定：要么屈从于阿富汗的枪炮，要么被巴基斯坦的人海淹没，又或者在部落仇杀中自我毁灭。唯一确定的是，当那一天到来时，汗王宝座下的沙粒，不会比贫民窟孩子们玩耍的沙堆更沉重。\n\n而她唯一的防御，或许就是那令人望而却步的贫穷与混乱。\n\n"

state_lore_initials.870: "GWD"
state_lore_name.870: "瓜德尔"
state_lore_desc.870: "自1792年起，瓜德尔便归属阿曼王国，成为其海外飞地。卡拉特汗国曾将这片土地赠予流亡的阿曼王子，却未曾想到，百年之后，这里可能成为改变俾路支命运的关键。\n\n然而，现实的瓜德尔却与这种战略价值毫不相称——村庄没有电，没有自来水，渔民们仍用最原始的独桅帆船出海，带回的渔获仅够糊口。阿曼的统治松散而遥远，除了每年象征性的税收官到访外，这里几乎感受不到"外国领土"的存在。\n\n1958年，俾路支土邦联盟首次尝试购回瓜德尔，却被阿曼拒绝。这一事件像一块石头投入平静的水面，激起层层涟漪。双方关系开始变得紧张，最终演变成俾路支军队和阿曼军队的首次对峙。\n\n渔民们常为此困惑，毕竟两个国家此前从来没有为此大动干戈。但在遥远的柏林，德国工程师们正在评估瓜德尔建造潜艇基地的可能性；在罗马，意大利的贸易公司已开始起草瓜德尔贸易港的建设方案；在东京，日本水产株式会社已将他们的目光转向尚未开发的阿拉伯海——这座沉睡了两百年的阿曼飞地，正被卷入一场远超村民理解能力的国际博弈。\n\n不过当渔民修补渔网时，他们只会担忧明天的渔汛——毕竟无论瓜德尔归属何方，渔民们的生计总要继续。瓜德尔的特别之处在于，它的贫穷反而成了最好的保护色：当大国们为蓝图争论不休时，真正的瓜德尔仍在潮起潮落中保持着自己的节奏。\n\n但大国们可不会让这种日子持续太久。\n\n"

state_lore_initials.871: "ONG"
state_lore_name.871: "奥涅加"
state_lore_desc.871: "在奥涅加湖畔的迷雾中，奥涅加——这座冰封监牢早已成为芬兰的提线木偶，沉默地承受着来自四面八方的拉扯。芬兰军队的哨所，反共志愿军的兵营，以及河对岸西俄罗斯革命阵线的旗帜，将奥涅加撕裂成一块块痛苦的碎片。\n\n西俄战争前，这里无非是以木材加工业为长的小城。而当尼古拉·布哈林于1911年因流放而在此驻足时，奥涅加的严寒与贫瘠给他留下了深刻的印象——远远甚于最终流放地阿尔汉格尔斯克。\n\n西俄战争过后，芬兰人将他们的前线定格于此。至于硝烟散尽后仍能同他们对峙的，则是与之有着血海深仇的西俄罗斯革命阵线。经年累月，在这场无意义的消耗战中，芬兰最终无法承受长期与阵线对峙的代价，但新的问题也油然而生：若欲守住这通往欧洲的大门，还能有什么行之有效的方法呢？\n\n反共第一志愿军为此应运而生。\n\n以亲情为筹码，芬兰人用尖刀将这群被俘获的红军士兵推上前线，逼迫他们同昔日的战友刀剑相向。这是最优的方法，也是对这群俄罗斯人最残酷的刑罚：让驻守于此的每一个人都能在战壕里听见对面孩子的笑声。\n\n每当冬季临近，双方的炮火便会渐渐停息。不是因为和平将至，而是双方弹药已尽，抑或不忍自相残杀。奥涅加的居民们知道，这场对峙没有胜利者——只有越来越多被白雪覆盖的尸体，和士兵们在战壕中越来越低声的抽泣：\n\n没有反抗，没有愤慨，惟余麻木——以及对仅存亲情的低声下气与卑贱祈求……\n\n“我们，何时——究竟还要多久，才肯放我们回家……”\n\n"

state_lore_initials.872: "PLK"
state_lore_name.872: "普列谢茨克"
state_lore_desc.872: "如果让一名普通人去翻阅普列谢茨克的城市档案，他就只得在纸页间找寻到只言片语的记载。\n\n普列谢茨克成为真正意义上城市的时间非常之短——1951年，一支由加拉克提翁·阿尔佩泽领导的特殊部队和谢尔盖·科罗廖夫领导的工程师团队悄无声息地来到这里。他们带着图纸、设备和某种坚定的信念，在此开展一项秘密工作。几年间，原本荒凉的普列谢茨克迅速扩张：新的建筑拔地而起，铁路延伸至密林深处…… \n\n诚然，此等动静势必引起德国人的怀疑。1955年，德军借西俄战争之便，加大对普列谢茨克的侦查和轰炸力度。这一工程项目最终在德军的轰炸和资金的短缺下无果而终。万幸的是，德国并未能彻底确定西俄罗斯革命阵线在此的真正企图。\n\n如今的普列谢茨克，表面平静如常，重建工作于此缓步展开，让这座城市逐渐淡出德军的视野：似乎这里又成为昔日那座再普通不能的城市。但只要卸下西俄罗斯革命阵线为这座城市精心制造的伪装，看似平静的表面之下……\n\n惟有驻守此地的高级军官，才能从档案室的保险柜中拿出这些被视为国家绝密资的料。在与常驻专家小组的闭门会议里，透露出西俄罗斯革命阵线赋予这座城市的真正使命——一个异常大胆、看似遥不可及的使命：\n\n“地球是人类的摇篮，但人类不可能永远被束缚在摇篮里。”\n\n“要想屹于世界，俄罗斯必须要拥有让全世界都无法逃避死亡威胁的可怖力量。”\n\n"

state_lore_initials.873: "UKT"
state_lore_name.873: "乌赫塔"
state_lore_desc.873: "如果将阿尔汉格斯克喻成革命的大脑，普列谢茨克视为革命的双手，那么乌赫塔即是支撑革命的躯干。\n\n乌赫塔的前身是一座名为"奇比尤"的村庄，而乌赫塔河沿岸的油泉早在17世纪便已为人所知。19世纪中叶，乌赫塔地区开始有钻探石油的活动。这里也是俄罗斯最早的油井诞生地之一。1943年，随着伯朝拉铁路的通车，以及政治犯的强制劳动，乌赫塔的城市规模得以扩张。在资源的加持下，乌赫塔的城市地位不断提升。\n\n西俄战争的烽火岁月内，乌赫塔地区利用其丰富的矿产资源，向革命阵线的机械化部队提供了宝贵的燃油与机械零件。身为战略后勤枢纽的资源之城，这座城市亦为西俄战争早期阶段的胜利立下了汗马功劳。\n\n当阵线崩溃，科米叛军的炮火逼近时，格奥尔基·朱可夫带领残兵撤退于此，并同当地守军死战不退。历经数月，以乌赫塔近半数城区尽成废墟为代价，最终得以保住阵线的这处资源命脉。\n\n纵然战功显赫，革命阵线内部的裂痕仍使朱可夫本人深陷漩涡。明枪易躲，暗箭难防，朱可夫最终选择急流勇退，主动请缨重返乌赫塔，执掌这座资源重镇的重建大业。在大元帅的精心治理下，短短数年，乌赫塔的满城废墟便重现往日繁荣盛景。\n\n尽管革命阵线内部的裂痕仍未弥合，乌赫塔这座历经沧桑的工业重镇业已获片刻安宁。哪怕前路坎坷，乌赫塔仍将继续忠于阵线，而她的命运也早与阵线紧密相连——或同沐荣光，或玉石俱焚。\n\n"

state_lore_initials.874: "VGD"
state_lore_name.874: "沃洛格达"
state_lore_desc.874: "沃洛格达，这座沉睡在沃洛格达河畔的古老城市，正为自己戴上可悲的中立面具，做着最后的和平幻梦。\n\n沃洛格达的历史可谓非常之悠久，从莫斯科大公国统治时期到大动乱时代，这座城市亲历了俄罗斯大地的兴衰荣辱。太多的战火与动荡，无尽的流血与牺牲，让这座城市和她的子民对战争产生了深深的倦怠，人们选择将目光从外部世界的纷争中收回，只求在这片故土上获得片刻安宁。\n\n随着西俄战争的硝烟渐渐散去，伊万诺夫将军率领麾下将士回到这座余被纳粹铁蹄蹂躏下被解放的城市。在政权崩溃的混乱中，疲惫的伊万诺沃和沃洛格达的人民宣布这座城市宣布成为武装中立区，不再进行任何敌对武装活动。\n\n卫国战争期间修建起来的战壕、防弹掩体和基本避难所，如今成了沃洛格达自欺欺人的保护伞。昔日保护铁路枢纽和军工企业的防空系统也足以让沃洛格达在德国的无尽轰炸中苟延残喘。乍一看，双方似乎都将此处作为缓冲区，和平重归沃洛格达，而战争仿佛只是一场可以置身事外的表演。\n\n而残酷的事实则是，沃洛格达的选择注定其无法在混沌的俄罗斯中独善其身。而当伊万诺夫精心构造的武装中立伪装被无情撕下，防线崩溃、军队撤离之时。沃洛格达必将再度陷入火海，为她的不作为付出代价，她的人民只能因所谓的“中立”承受无名怒火，在他人武器的威胁下苟且偷生。这是沃洛格达无可逃避之宿命，更是她的咎由自取……\n\n无人会为中立者而泣。\n\n"

state_lore_initials.875: "KRM"
state_lore_name.875: "科斯特罗马"
state_lore_desc.875: "当俄罗斯大地陷入无尽的纷争时，科斯特罗马亦选择同沃洛格达一起——成为中立区的受庇护者，亦是这片净土的守护者。\n\n作为俄罗斯最知名的古城之一，科斯特罗马以罗曼诺夫王朝的发源地著称，其城区内至今仍保留不少16至19世纪木造教堂、官邸及18世纪古典主义风格建筑群。城市经济则以珠宝加工、发动机配件制造和棉纺织业为支柱。\n\n身为沃洛格达中立区的交通中心，科斯特罗马以其发达的水陆交通见长。而其与莫斯科专员辖区临近的地理位置关系，更是让此处成为沦陷区百姓东逃的必由之路。\n\n随着难民不断涌入，科斯特罗马的街道变得拥挤不堪。尽管当地的基础设施承受着愈来愈大的压力，但没有人提议关闭边界。科斯特罗马明白，所谓中立不是逃避，应是上天赐予其的使命。在这片战火纷飞的土地上，她用古老的城墙为无辜者们筑起一道屏障，用历史积淀的智慧守护着文明的最后火种。当硝烟散尽的那天，人们不会忘却，在俄罗斯最为黑暗的岁月内，曾有这样一座城市拒绝参与杀戮，选择拯救生命。就像生于斯的文学巨匠阿列克谢·皮谢姆斯基所言：\n\n“我始终忠于自己的认知，从未因任何转瞬即逝的理由而辜负上天赐予的这份谦逊才能。我的指路明灯之一——就是渴望向祖国诉说关于它自身的真相。至于成功与否，不该由我自己来评判。”\n\n"

state_lore_initials.876: "IVK"
state_lore_name.876: "伊热夫斯克"
state_lore_desc.876: "提及伊热夫斯克，就离不开她远近闻名的枪械制造业。自1807年沙皇亚历山大一世的敕令落下第一记铁锤声起，这座城市的命运就与枪管、火药和革命紧紧缠绵。\n\n整座城市的回荡着近两个世纪的锻造声，从沙皇时代的燧发枪，到内战时期红军的莫辛-纳甘，再到伟大卫国战争时抵御纳粹的波波沙冲锋枪——每一发子弹的底火上都刻着这座城市的名字。当德国人的铁蹄碾过俄罗斯大地时，伊热夫斯克的流水线也未曾停歇：纵使工人们的手指被机油和金属屑染黑，却仍以近乎宗教般的狂热铸造着复仇的武器。\n\n米哈伊尔·卡拉什尼科夫曾在这里点燃设计的火花，让AK-47的蓝图在战火中淬炼成型。彼时的伊热夫斯克不仅仅只是一座兵工厂，在人们眼中，这里更是革命的纪念碑，镌刻着每一位士兵势必让和平与美好重归故土的赤诚之心。\n\n然而，随着阵线崩溃，弗拉基米尔三世军队如暴风雪般席卷而来，工人们不得不砸毁无法带走的机床，将图纸和核心技师撤往西西伯利亚的冻土。留下的，惟有空荡的厂房和沙皇士兵靴底下的机油血迹。\n\n如今的伊热夫斯克，仍是俄罗斯大地上最危险的军火库。无论是沙皇的将军、西俄的军阀，亦或是乌拉尔的土匪头子。都渴望将它的生产线据为己有。只因在这里，钢铁不是被锻造，而是被驯化——车床的每一次转动，都能为他们吐出一把为己所用的杀戮工具，进而成为每一场战争的致胜法宝。\n\n而这便是伊热夫斯克的使命所在：\n\n她生产的从来不是枪械，而是战争本身。\n\n"

state_lore_initials.877: "UFA"
state_lore_name.877: "乌法"
state_lore_desc.877: "乌法的历史，恰是独属于巴什基尔人的历史。\n\n1574年，伊凡四世下令建立乌法来保护承认俄罗斯宗主权的巴什基尔人抵御哈萨克汗国的入侵——并管理当地，同时要求巴什基尔人在此向俄罗斯交供皮毛作为税收。作为交换，俄罗斯必须维持巴什基尔人的土地所有权，并承认其统治权。\n\n但蜜月期终究是短暂的。俄罗斯逐渐露出獠牙，巴什基尔人也不得不奋起反抗，历经数次大大小小且代价沉痛的起义后，俄罗斯最终不得不妥协——而乌法，这座在战火中始终屹立不倒的城市，也成为巴什基尔人的一大精神象征。\n\n进入20世纪，随着伏尔加－乌拉尔油田开发，以及布哈林“西伯利亚计划”的支撑，乌法经济进一步发展。并一跃成为苏联重要的炼油、石油化工和机械工业中心。卫国战争时期的工业西迁更是助力这座城市的发展更上一层楼，让其成为巴什基尔苏维埃社会主义自治共和国领土上最璀璨、最珍贵的明珠。\n\n西俄战争过后，巴什基尔伊斯兰共和国趁此机会获得独立。乌法也得以脱下俄罗斯为她绑上的诸多束缚，成为巴什基尔人名副其实的国都。\n\n纵然战争带来的混乱令乌法发展受阻，但巴什基尔人依旧凭其独立自主坚毅的精神，继续将他们的掌上明珠打造成一座繁华与伟大之城，更是富有巴什基尔人伊斯兰信仰的宗教之城。不过当新一代巴什基尔人的子孙后代在城中的公园肆意玩耍时，老一辈人却仍旧难忘俄罗斯统治时期的往事，以及那个不愿回想的事实……\n\n乌法终究为俄罗斯族缔造之城，她真的能……逃离俄罗斯的手掌心吗？"

state_lore_initials.878: "BZK"
state_lore_name.878: "别列兹尼基"
state_lore_desc.878: "自19世纪开始，别列兹尼基借助其储量丰富的钾镁盐矿，建造起全俄罗斯最早的制碱厂，而后在此基础上蓬勃发展的庞大肥料产业，不仅哺育了整个苏联的农业，更是对全球粮食贸易也产生了重大影响。\n\n出人意料的是，在军阀割据、群雄并举的俄罗斯大地，别列兹尼基却难以养活偏安一隅的圣格奥尔基骑士团，令其饱受饥饿、贫困与寒冷的折磨。\n\n这并非无稽之谈，历经数次战乱，别列兹尼基早已摘下它的工业皇冠。昔日皇冠的光芒如今也难掩其衰落的真相：历经俄国内战、西俄战争后，别列兹尼基的工业设施大多因为战争经济被破坏或在战争中被直接摧毁，城市一度险遭荒废。\n\n再后来，圣格奥尔基骑士团来到此处——没有先进技术、没有惊世智慧、没有海量财富，有的只是对信仰的至高虔诚与对解放俄罗斯芸芸众生的至上愿景。别列兹尼基依旧在衰落，但骑士团却对此无能为力：除了在其废墟之上简单修缮，搜罗仅存工业设施继续生产之外，别无他法。随着这座城市故步自封，消亡不过早晚之事。\n\n令人担忧的是，纵使工业荣光已逝，别列兹尼基依旧要肩负养育这片土地的重任。随着圣格奥尔基骑士团的工业心脏不可避免地迈向衰老，哪怕信念至坚之徒也恐将难逃寒霜封印之命运。\n\n主啊，请不要真的遗忘我们……\n\n"

state_lore_initials.879: "GNY"
state_lore_name.879: "盖尼"
state_lore_desc.879: "盖尼首次在历史文献中被提及，是在名为《亚洪托夫1579年地籍清册》的土地清查资料中。那时，盖尼这个“波戈斯特”有17户农耕户和4块闲置耕地，以及16俄亩可耕林地。\n\n而后自盖尼建立后的那些岁月里，无论外界发生何等剧变，盖尼依旧能在冰天雪地中我行我素，不为外界所纷扰。这一切似有神之眷顾，也有民之朴素。\n\n然而，这份宁静最终能难逃战争的魔爪。\n\n随着大动乱时期到来，贪婪之徒来到此处，洗劫、焚毁——同胞之苦难他们视而不见，盖尼至贫瘠他们不屑于顾。对他们而言，只要掠夺能足以让自己继续花天酒地，他们的屠刀就不会放下。\n\n正当一切礼崩乐坏之时，米哈伊尔·伊万诺维奇·安季平逃难此处。在当地一位神父的启示下，他觉悟到俄罗斯如今所有那些骇人之悲剧——绝非偶然，而是惩戒。俄罗斯的众人背弃了主，因此，将罪孽的报应降临与此。\n\n他将盖尼和附近村庄的人们召集起来，竖起了“圣格奥尔基骑士团”的旗帜。将战争狂人与异教徒的侵蚀净化殆尽，让盖尼再度成为了无人袭扰的“伊甸园”。\n\n没有人知道这份安宁是否会被再度打破，但盖尼小镇已然成为圣格奥尔基骑士团的精神象征，信仰之源：上帝既赋予其使命拯救俄罗斯，盖尼必将是这场神之征途的伊始，也是上帝给予俄罗斯的最后机会。暴风寒雪之下，这里依旧会响起那份誓言：\n\n“那无神论的恶龙，终将被真理之矛贯穿。”\n\n"

state_lore_initials.880: "BRK"
state_lore_name.880: "别洛列茨克"
state_lore_desc.880: "战后俄罗斯纷繁的土地上，暴徒众多，英雄甚少。而乌拉尔联盟的士兵们则为别洛列茨克塑造了诸多新的身份——奇迹之地、英雄之城。\n\n别洛列茨克见证了俄罗斯工业发展史与农民起义等诸多历史事件。其历史可追溯至1762年由两位商人在巴什基尔土地上建立的定居点。1774年，这里是普加乔夫起义的重要据点。1916年落成的水塔以其独特的供水-消防复合功能，成为城市最具辨识度的地标建筑。苏联时期，“西伯利亚计划”让别洛列茨克迎来了工业发展的黄金时代，使其逐步成长为南乌拉尔地区举足轻重的工业中心。\n\n随着苏联解体与阵线崩溃，深陷军阀混战与经济萧条的别洛列茨克，迎来了一支特殊的流亡队伍：在神父亚尼斯·门德里克斯的带领下，一群来自北方沃尔库塔古拉格的囚犯与同情其的守卫们，穿越重重战火与封锁，最终抵达了这座位于南乌拉尔山麓的工业城市。而这支混杂着救赎者与被救赎者的队伍，为别洛列茨克注入新的变数。\n\n如今，在乌拉尔卫队的英勇奋战下，黑山与奥尔斯克盘踞于此的黑暗势力也被荡涤一清。这座历经战火洗礼却始终屹立不倒的奇迹之城，于水塔傍再度迈向复兴。身为解放者的乌拉尔卫队，也以其正义之师的风范赢得了当地民众发自肺腑的拥戴与支持。\n\n然而危机远未消散——黑山的暗影与奥尔斯克的兵马仍如达摩克利斯之剑高悬余别洛列茨克头顶。尽管乌拉尔卫队克的战士们仍能执戈再战，但当守城将领望向城内日渐蔓延的混乱与绝望时，一个残酷而不愿面对的真相也已在他们心中愈发清晰：\n\n英雄虽负救世之责，然邪佞之徒势大难挡。或有某日，乌拉尔卫队将力竭难支，难承此千钧重担。\n\n彼时，别洛列茨克将何以自处？\n\n"

state_lore_initials.881: "ORS"
state_lore_name.881: "奥尔斯克"
state_lore_desc.881: "自奥尔斯克从文明的堡垒堕落成野蛮的坟场起，其苦难之深重，令俄罗斯废土上的其他城市相形见绌。\n\n奥尔斯克曾是南乌拉尔地区工业文明的灯塔。从1870年代开始，这座城市急剧发展。俄国内战期间，奥尔斯克更是经受住了长达三个月的封锁，然后在交战双方之间四次易手。1930年代，在“西伯利亚计划”的资助下，不少大型工业企业于此建立，并从奥尔斯克地区富含矿产的土壤中获取资源。\n\n然而噩梦总是猝不及防。\n\n苏联解体后，因长期投资不足、外国封锁和缺乏改革。奥尔斯克的经济迅速崩溃，当地工厂大量流失，失业率的急剧增加。随之而来的是极端激烈的工人罢工与抗议活动。然在西俄战争的厮杀声中，又有谁听到此处人民的呼声呢？\n\n当西俄罗斯革命阵线崩溃时，迪勒万格旅的暴徒们如蝗虫般涌入这座垂死的城市。他们将奥尔斯克变成血腥的狩猎场和劫掠的根据地，而昔日的文明似乎成为遥不可及的传说……\n\n如今的奥尔斯克确与废墟无异，在此之上：这群嗜血的狂徒，以烧杀抢掠为自己的精神图腾；以迪勒万格为自己的精神旗帜；以奥尔斯克为自己的狂欢巢穴，每场劫掠后的狂欢，这群暴徒们都会在毒品的刺激与酒精的麻痹下，于熊熊燃烧的篝火旁高呼他们的口号：\n\n“迪勒万格即是死神，死亡降临奥尔斯克。”\n\n"

state_lore_initials.882: "YGK"
state_lore_name.882: "尤戈尔斯克"
state_lore_desc.882: "也许尤戈尔斯克自己都未能料到，当她将自己的面貌展现于这个世界时，会是如此的肮脏与龌龊。\n\n在西伯利亚的远北之地，这里是为神明所遗忘的冰窖。这里的风，仿佛裹着碎冰的锉刀，能在一夜之间将裸露的皮肤刮成溃烂的冻疮。极端的严寒，则是一种永恒的刑罚——它钻进骨髓，让血液变得黏稠，让关押在此的囚犯每一次呼吸都如同吞咽玻璃渣。对莫斯科那些政治家而言，这里就是处决罪犯的最佳刑场。\n\n而在此之前，尤戈尔斯克甚至都算不上俄罗斯远北刑场的一员。当约谢里亚尼带领着“律贼”们落难此处时，当地甚至无法为其提供像样的住宿和饮食条件。\n\n如今的尤戈尔斯克，已在“律贼”们改造下，变成一个黑社会网络极端紧密、“罪犯文化”随处可见的“盗贼世界”。约谢里亚尼则在他本人亲自编制的精细大网中纵横交错，借助机遇同兹拉托乌斯特的军火商们签订协议。后在众人的高呼声中，独自登顶“律贼领袖”的宝座。\n\n但在暗处，有人窃窃私语，有人愤愤不平。当兹拉托乌斯特的军火商逐步将尤戈尔斯克武装成抵御西俄罗斯残余势力的坚固堡垒时，不满之人将枪支弹药深藏于这座城市的大街小巷。只待领袖自满、懒惰之时，再度为“律贼”唤起独属于它的“罪犯文化”。\n\n在这片连时间都会被冻住的土地上，盗贼的野心就像试图点燃柴油的冰雕。华丽、致命，且注定要在自己引发的火焰中崩塌，却始终无法激起任何风浪……\n\n毕竟，盗贼怎可能敌得过一支军队。\n\n"

state_lore_initials.883: "SGT"
state_lore_name.883: "苏尔古特"
state_lore_desc.883: "苏尔古特——极北之城，凄冷之地。\n\n这座城市最初于1594年由沙皇费奥多尔一世下令建立。几个世纪以来，她一直是都俄罗斯在西伯利亚的军事堡垒和发展中心之一。\n\n从苏尔古特所处的地理位置与环境来看，这片荒地注定不会有着如库尔干与秋明的那般繁华，哪怕是“西伯利亚计划”期间，这里也仅仅只是得到极为有限的开发。\n\n随着苏联解体，西俄战争以惨败收场。这座似乎被遗忘的北方小城，却因自由飞行员组织的到来而重获灵魂。\n\n也许有人会说，苏尔古特依旧荒凉、贫困，但博洽洛娃也证明了——这些困难并无克服之可能：哪怕技术落后，手头吃紧。这里的人们依旧会用自己的智慧，将仅存的工业设施用以生产；回收稀少的残骸用以制造；乃至将家庭作坊用于生产弹药。只为给飞行员同志们送上急需的物资。\n\n无惧暴风严寒、黑夜雾天，“夜袭魔女”们都会准时会从苏尔古特的临时机场上起飞，同毁灭家园的德寇继续死战，保护这片土地免受日耳曼尼亚雄鹰的摧残。\n\n就这样，在西伯利亚无边的冻土带上，苏尔古特如同一只长着银色尾巴的黑狐狸，在迷雾与暴风雪的交替中保持着神秘的生机。而那战机划破长空的声响，军民齐心高呼的口号，也成为了这座城市若隐若现的心跳。\n\n而这份坚守，也许会在未来的某日，迎接属于自己的……\n\n嘉奖？\n\n"

state_lore_initials.884: "NTG"
state_lore_name.884: "下塔吉尔"
state_lore_desc.884: "是谁为下塔吉尔——这座永不熄灭的熔炉，续予无穷的生命？\n\n溯其历史，当“西伯利亚计划”开始实施时，这座城市因其丰富的矿产资源被列为着重开发的工业城市。于1936年建立起下塔吉尔乌拉尔机车车辆厂就是这座城市向其祖国母亲所提交的最好答卷。\n\n然而，天有不测风云。当德国将它的利刃突然刺向苏联时，下塔吉尔的安逸与繁荣旋即化为泡影。哪怕乌拉尔机车车辆厂的T-34流水线夜以继日地工作，其所制造的钢铁洪流在精锐的德国军队面前仍然不堪一击。最终，祖国山河破碎，往事皆成云烟，下塔吉尔也迈向急剧衰落的黑暗深渊。\n\n正当一切似乎无可挽回之时，列夫·塞多夫携其先夫的遗愿，在下塔吉尔再度点燃托洛茨基主义永恒革命的火炬。而当时留给塞多夫的，惟有一个军阀割据愈演愈烈，面临严峻考验的革命孤岛：粮食与药物日益短缺；工业齿轮朽腐不堪；政治斗争走向失控；革命事业无人支持……\n\n也就是在这样的环境中，塞多夫却以其钢铁意志与周密谋划，将反动派与敌人横扫殆尽，拯救下塔吉尔于水火之中，并为这座城市赋予一副全新的躯壳。\n\n如今，这座曾经孕育了无数革命者的城市，在俄罗斯的废墟之上，高举着托洛茨基的旗帜，成为俄罗斯大动乱时代中最后的精神灯塔，以托洛茨基主义的烈焰照亮着永恒革命的未来……\n\n一个足以解放俄罗斯母亲、令世界重获新生、引得全人类瞩目的永恒革命未来。\n\n而正当革命家在广场上激情演讲其革命理想时，下塔吉尔的孩子们却也已开始询问："我们为什么要为全世界操心呢？"

state_lore_initials.885: "KRG"
state_lore_name.885: "库尔干"
state_lore_desc.885: "革命烈焰锻造革命之钢，革命之钢塑造革命之城——库尔干，斯大林主义者的坚固堡垒，西西伯利亚人民共和国的交通与工业心脏之一。\n\n1659 年至 1662 年间，这里被建为帝国城堡。用作抵御游牧民族攻击的堡垒城镇。1782 年，凯瑟琳大帝赋予她城市地位，赐名库尔干。其名来自城市附近的一座成为“库尔干”的大型墓葬。\n\n1893年，西伯利亚大铁路的钢轨如同手术缝合线，将这片蛮荒之地与文明世界相连。火车汽笛声撕裂了延续两个世纪的草原寂静，铸铁桥墩则在鄂毕河中投下“西伯利亚计划”的阴影。当卡冈诺维奇宣告西西伯利亚人民共和国成立时，库尔干的发展被按下了通往深渊的最后加速键。\n\n尽管联盟破碎、战事失利、经济崩溃、空袭不断，库尔干依然凭借钢铁般的意志顽强生存，为卡冈诺维奇的国度继续锻造革命……\n\n时至今日，库尔干的战略重要性毋庸置疑：她是库尔干西部空军基地的所在地。也是机械制造公司卡夫兹汽车厂和库尔干汽车厂的所在地，后者自1954年起生产著名的ATS和ATS-59火炮拖拉机，这些拖拉机则用于人民共和国的野外作业和油田复垦。\n\n而在卡冈诺维奇尚未到来的五年计划规划中，库尔干将完成它的终极蜕变。为了祖国、为了导师、为了俄罗斯的人民，库尔干将在这场冒险中全速前进，在胜利的曙光再临这片土地前，绝不停歇……\n\n为此，革命之城将不再向叛徒施予仁慈，她将永远恪守革命赋予的钢铁意志。当五年计划的最后一颗螺丝被拧上时，这座城市将协同完成一统的俄罗斯祖国，向着世界发出震天的怒吼。\n\n"

state_lore_initials.886: "BRN"
state_lore_name.886: "巴尔瑙尔"
state_lore_desc.886: "新西伯利亚和阿尔泰联邦，其名与这个新生国家的左膀右臂息息相关：身为工业左膀的新西伯利亚，与位居农业右臂的巴尔瑙尔。\n\n巴尔瑙尔兴建于1930年，在那之后，她的工业地位迅速上升，其产品范围也越来越广泛。农具生产、木材加工、金属冶炼……这些产业既是巴尔瑙尔的经济支柱，也是阿尔泰边疆区富饶的直接证明。\n\n“西伯利亚计划”对巴尔瑙尔带来的影响同样是不可估量的：借助布哈林政府的资助，这座城市建立起更为完备的工业体系——以及令人难以想象的繁华。卫国战争时期迁往此处的上百座工厂，更是让巴尔瑙尔当之无愧地登上西伯利亚地区第三大城市的宝座。然而，命运并没有一直青睐这座城市，这种短暂的繁华而后也随着苏联的垮台而烟消云散。\n\n历经西伯利亚战争与中西伯利亚共和国的崩溃，身为巴尔瑙尔市长的舒克申，于乱世中扛起了自由与民主的旗帜，为这座城市带来新的曙光。阿尔泰边疆区的富饶毋庸置疑——这里是前苏联时期最为重要的粮仓，其生产的木材与农业用具畅销全俄。但显然，巴尔瑙尔无力孤军奋战，这座城市最终选择同新西伯利亚的伙伴们共创未来。\n\n如今，巴尔瑙尔尽显萧瑟。西比尔的触手渗透到这座城市的每一个角落，试图将她的富饶据为己有。舒克申的理想固然美好质朴，但顾忌新西伯利亚的竞争与攻击仍在与日俱增，这一理想实现之日恐将遥遥无期。\n\n所有的一切：民众的苦难、工人的呼声、农民的抗议——舒克申不无知晓。他并非无动于衷，甘愿将自己的一切拱手相让，但他也深知：\n\n麦子仍未到成熟之时。\n\n"

state_lore_initials.887: "ORT"
state_lore_name.887: "奥伊罗特-图拉"
state_lore_desc.887: "“所以，你们要弃绝谎言，各人与邻舍说实话，因为我们是互相为肢体。”——《以弗所书》4:25\n\n奥伊罗特-图拉的命运始终与宗教紧密交织。1824年，第一批俄罗斯定居者从比斯克移居此处，该地的进一步发展则与阿尔泰传教团的工作密切相关。1831年，传教所开始在该地工作，传教士和神职人员聚集于此。在随后近百年的岁月里，这座边陲村落逐渐被塑造成西伯利亚东南部的重要商埠。\n\n红军的到来非但未能消弭奥伊罗特-图拉的宗教底色，反而催生了一种独特的共生现象。而苏联大厦倾颓、军阀割据的烽烟席卷西伯利亚时，奥伊罗特-图拉却因其与世隔绝的地理位置，远离战火的袭扰，在大动乱时代内依旧咏颂着《圣经》。\n\n但历史一再证明：战火总会熄灭，安宁终将破碎。\n\n难民潮的涌入让奥伊罗特-图拉的信仰天平开始倾斜。旧礼仪派移民与本土不儿罕教徒的共存，从最初的相互戒备逐渐演变为捍卫信仰的斗争。在这座资源有限的山城，两种信仰的信徒们正用猜忌和敌意，一寸寸撕裂着城市脆弱的和平。\n\n扎沃洛科与其追随者的调解虽如投石入渊，却未能打破这座山城的生存韵律：不同信仰之徒依然在同一天空下日出而作，日落而息——这是主之初衷，亦是主之愿景。而奥伊罗特-图拉也将以它独有的方式，在风雪中默默追寻着耶和华的足迹。\n\n"

state_lore_initials.888: "NRS"
state_lore_name.888: "诺里尔斯克"
state_lore_desc.888: ""对外界而言，西伯利亚不过是传闻中的存在——这片广袤、严寒而富饶的土地，万物皆具宇宙洪荒般的尺度，连那刺骨的极寒与苍茫的荒芜，都如同外太空般令人望而生畏。"\n\n正如瓦连京·拉斯普京笔下所描述的那般，西伯利亚地区始终保持着其亘古不变的灵魂——即便在布哈林时代"西伯利亚计划"的建设浪潮席卷之下，这片极北之地依然固执地维持着它冰封万里的荒原本色。惟有零星几座城镇如同被遗忘的星座，倔强地闪烁在永久冻土带上。而诺里尔斯克，正是这片荒芜银河中最耀眼的那颗孤星。\n\n当1935年诺里尔拉格的铁栅栏在冻土上拔地而起时，这座注定不平凡的聚落才真正以城市之名，镌刻进苏联远北的版图。而一群被时代洪流冲刷的"异见人士"——从知识分子到宗教人士，在内部人民委员会的押解下如潮水般涌入这座坐落于北极圈内的钢铁牢笼。苏联政府铁腕意志如彻骨寒风般渗透进这里的每一处角落，囚犯的余生则被献祭于这片土地上，用于为诺里尔斯克规划蓝图，以求生路。\n\n苏联政权崩溃后，诺里尔拉格大暴动终结了当地政府的残暴统治。这座城市随后与新生的中西伯利亚共和国达成和解，并短暂地融入了这个新生国家的版图。在这段难得的和平岁月里，诺里尔斯克展现出惊人的复苏活力：工业建筑拔地而起，城市边界不断向冻土带延伸。共和国雄心勃勃的陆路通道计划曾试图打破极地孤岛的宿命。然而极端恶劣的地质与气候条件，终究将这条"极北之路"扼杀在勘探图纸阶段。\n\n随着中西伯利亚共和国分崩离析，诺里尔斯克及其周边地区再度沦为与世隔绝的极地孤岛。在永无止境的风雪蚕食下，这座极北之城逐渐被时光遗忘，直到某天……\n\n或许会有探险者冲破风雪封锁，让冰雪覆盖的城市重见天日；或许会有建筑家破解冰封诅咒，续写这段中断的发展史诗。但在命运之轮重新转动前，诺里尔斯克仍将沉睡于北极圈的永夜之中，作为被文明刻意遗忘的冻原秘密，静静等待着属于她的曙光。\n\n"

state_lore_initials.889: "YKS"
state_lore_name.889: "雅库茨克"
state_lore_desc.889: "世界上流传着这样一句名言：西伯利亚没有春夏秋季，只有冬季与大约在冬季。而在遥远的东西伯利亚北部，北极圈附近，有一座极寒之城——雅库茨克。\n\n在永久冻土层上的冰雪之城、钻石点缀的冰雪王国——所有形容雅库茨克之言都离不开她的两个最大特征：极端的严寒与富饶的矿藏。前者限制了雅库茨克的发展，后者则为她开了一扇新的窗户。\n\n当远东苏维埃主席团的红色旗帜坠落时，雅库茨克选择奔向充满未知的自由，在钻石与黄金镶嵌的矿坑之上，巴沙林领导下的民族主义革命者们梦想着雅库特人的独立荣光，但埃尔加矿业公司（ELGA）的钻探机声远比雅库特的国歌更为响亮。\n\n诚然，钻石与黄金的出口为雅库茨克带来了不小的财富，但最终也不幸成为对自身的诅咒：借助其雄厚的资本与庞大的人脉，深植于雅库特共和国的矿业巨企埃尔加（ELGA）得以建立起属于自己的“国中之国”：拥有自己是私人军队；借助黑帮大行其道；掌握雅库茨克的经济命脉；同雅库特政府分庭抗礼……\n\n这座城市最终会属于谁？是举着民族旗帜的理想主义者？还是掌控着钻石与黄金流向的商业巨鳄？或许答案早已写在这座城市下的永久冻土层中：\n\n在雅库茨克，惟有两种东西能够永恒——零下六十度的寒冬，和人类对财富永不满足的贪婪。\n\n"

state_lore_initials.890: "MAU"
state_lore_name.890: "Mauritsstad"
state_lore_desc.890: "Only one location was suitable for the new capital city of the Dutch in exile. Paramaribo, the capital and the only developed major city of Suriname before the start of the Second World War, has now been renamed after the legendary Dutch military commander Maurits of Orange-Nassau. The heart of the former Dutch colony of Suriname, always the sleepy afterthought of the Dutch empire has now become its capital, the living and growing remnant of the Dutch nation, its people and their language.\n\nVast amounts of Dutch and American money were poured into reconstructing the city, expanding it to accommodate the vast amounts of refugees, exiles and settlers that got brought there during and after the second World War. Pushed together by fate, Indonesian, Dutch and Surinamese people have been brought here to form the basis of a new Kingdom of the Netherlands in exile, buoyed by endless amounts of Amercian support. Gripped by a fear of having their culture and language wiped out forever, the Free Dutch government has effectively colonized its own colony to become a vessel for a new kind of imperialism, corporate and economic neocolonialism. On top of that, the Dutch are doing their best to supress the original languages of the people and ensure that Dutch, only Dutch is the language of importance. Here in Mauritstad the Dutch elite gather to look for the next steps in their development now that reconstruction has come to an end."

state_lore_initials.891: "GLD"
state_lore_name.891: "Guldensporen"
state_lore_desc.891: "The first weeks after arrival in the Dutch Caribbean were complete chaos as the coastline was swamped and overcrowded. Amongst the mess of Dutchmen in exile the remnant of the Belgian government requested to concentrate all Belgian refugees and exiles in one location. By a rapid decree by Her Majesty, the coastal strip west of the Kopernaam river was temporarily granted to the Belgian government to set itself up in the region that later became known as the Westpolder\n\nDriven by revanchism for her own fallen nation, Queen Wilhelmina took up the Belgian cause as well, declaring that a new Belgian city shall be built on the shores of South America named after the legendary mediaeval battle of the Golden Spurs.\n\nGuldensporen is fake in many ways. Its monuments dedicated to the olden days are brand new, while its Grand Belgian Museum is filled with mostly recreations of Belgian art with the originals long lost to the German menace. Belgian beer is brewed with American hops and sold in Delhaize supermarkets, and chocolate no longer comes from far away, but grows right outside the city's borders. Farmlands stretch out all around the city which is starting to industrialize itself, keeping the taste of home alive and making a steady profit for the burgeoning Belgian people.\n\nAnd yet, in this city a new generation of people is starting to come of age. A group of people that despite all the pain and suffering inflicted upon their people and their culture, still proudly call themselves Belgians. The last seed of Belgium has taken root, and perhaps one day it shall blossom proudly once again."

state_lore_initials.892: "HDS"
state_lore_name.892: "Hendriksstad"
state_lore_desc.892: "The Free Dutch have a darker side, or rather, a darker city. Hendrikstad, formerly Albina, is a city of grime, smoke and sweat. Nestled on the Maroni river, it is the exclusive territory of Staatsmijnen, a company which seeks to extract as much of the Marowijn and Diep Suriname’s resources as is possible at the cheapest price possible.\n\nIn the factories of Hendrikstad, immigrants work long days in poor conditions to provide labour for the extraction and processing plants of Staatsmijnen. Brickworks, sawmills, chemical plants, and aluminium smelters and more churn day and night to meet the ever expanding material needs of the Free Dutch economy as well as fuel exports.\n\nThe entire Marowijn region has been stripped clean of anything of value while the raw resources are sent off to the city of burning towers. An ever expanding set of asphalt roads lead deeper inland to enable further extraction from Suriname’s untouched inner regions that now are home to both heavy mining and logging operations deeply polluting the land and uprooting Native tribes from their lands. But since no one speaks for the trees or the people actually living in the inner regions, the resource extraction shall continue without unwanted and costly interruptions for the sake of the Dutch nation's rising prosperity."

state_lore_initials.893: "NEV"
state_lore_name.893: "Nieuw Eindhoven"
state_lore_desc.893: "The lights have gone out over Paris, but across the Atlantic a new city of Light has arisen. Nieuw-Eindhoven, like the original city, is deeply intertwined with the company of Philips Electronics N.V.. As part of the deal struck with the Free Dutch government, Phillips was given free use of the land between the Kopernaam and Saramacca rivers along with government funding for the entire construction of the industrial complex that was to arise there. Orchestrated by Frits Phillips, a grand new city was built for Phillips and her employees according to his paternalist beliefs. Nieuw-Eindhoven has the most modern amenities near the rows and rows of company housing, while the Phillips factories produce the latest generation of consumer and military electronics for export to the rest of the OFN and the wider neutral world.\n\nThe old generation of engineers in exodus are passing on their knowledge as Phillips seeks to establish a strongly educated class of employees that it needs to develop the future of the company. A complex of factories, laboratories and educational facilities under continuous expansion, Nieuw-Eindhoven’s positive influence on the nation as a whole shines brightly."

state_lore_initials.894: "BLM"
state_lore_name.894: "Blommestein"
state_lore_desc.894: "Blommestein holds the distinction of being the only proper city in the inner region of Suriname. Originally named Brownsweg, it became a focus of development after the start of the Queen Wilhelmina dam as it marks the end point of where the Kustlijn reaches into the jungle and becomes the Zuiderweg. Combined with being the meeting point of several road conenctions and the start of the Zuiderweg which crosses the entirety of Suriname, Blommestein is a growing young city on the Ruyter Lake as the key connection point for goods and people flowing through the other regions and the one piece of proper civilization in the inner lands of Suriname\n\nAs for the displaced Maroons who originally lived in this region, many were displaced by the construction work setting off a continued distrust between the government and the Maroons."

state_lore_initials.895: "CUO"
state_lore_name.895: "Curaçao"
state_lore_desc.895: "Like the original Low Countries, its relatively small size belies the economic relevance of Curaçao. Each of the ABC (Aruba, Bonaire, and Curacao) islands contains a major oil refinery that processes the majority of Venezuelan oil output, but Curaçao has by far the biggest Shell oil refinery in the world. Every day, new ships bring new loads of black gold to the large Shell refineries from where it is refined and then transported to the OFN and select neutral buyers.\n\nOver the many hundreds years of Dutch colonisation a distinct Caribbean Dutch (or commonly called Antillean) identity has been born here. The main language here used to be Papiamento, a Portuguese and Spanish creole language that faces a slow and insidious suppression by the tight leash of the local government push to officiate Dutch as the sole language for conducting daily life. Since the rapid improvement in living standards after the end of World War II, it seems like there is no major resistance to the death knells of the Antillean culture... for now."

state_lore_initials.896: "ARU"
state_lore_name.896: "Aruba"
state_lore_desc.896: "Aruba in many ways is like Curaçao, and in others it is not. Another relatively small Carribean island with an oil refinery, a people who speak Papiamento, and all of it rapidly changing when the Dutch empire was forced into exile. Aruba has seen some development after the war's end but has forever played second fiddle to Curaçao, the true pearl of the Dutch Antilles, which has begun to breed resentment in Oranjestad, Aruba's capital.\n\nThe most important thing that is happening in Aruba is the fact that nationalism is truly beginning to develop on the island; not Dutch nationalism, but a new Aruban nationalism that puts the priorities of the island and it's people first over the distant commands from Mauritsstad. For now, the Antilles are quiet and compliant, happy to have the autonomy gained in the new constitution of '47, but underneath the surface tensions continue to build..."

state_lore_initials.897: "BON"
state_lore_name.897: "Bonaire"
state_lore_desc.897: "Bonaire has been a prime focus of millitary development since 1945. A flat, underdeveloped island with plenty of space still to work with when compared to the islands of Aruba and Curacao, it was soon selected the site of the largest Dutch naval base in the Caribbean.\n\nDestroyers, cruisers, and even aircraft carriers coming and going into the docks constructed in between the islands of Klein Bonaire and Groot Bonaire provide great views and a steady flow of maintenance workers and sailors stationed on the island.\n\nAt the same time, the Americans have established an airbase on the island to assist them with further power projection in a key point in the southern Caribbean. Bonaire's great coral reefs and beautiful nature would have provided for a fantastic touristic destination, if the island was not half filled with millitary bases."

state_lore_initials.898: "SXM"
state_lore_name.898: "Sint Maarten"
state_lore_desc.898: "In 1624, the first Europeans landed on Sint Maarten, then known as Soualiga or 'land of salt' to the native Arawaks who had lived there for centuries. But the first Dutchman would arrive in 1627 to settle in the Little Bay area. This first Dutch settlement on the island was called Lammerenberg, and it was settled because the Dutch needed a preservative for their massive fishing industry, and Sint Maarten provided the salt they needed so desperately.\n\nSint Maarten has swapped hands numerous times throughout history. British, French, Spanish, and recently even American. But now she finds herself firmly planted in the hands of the Dutch after the complete deportation of all French citizens following the annexation of the larger French side after the end of World War II. By the early 1960s, Sint Maarten is practically unrecognisable to the near uninhabited island it was during the war, since thousands have moved to the island following the arrival of the Dutch Exiles and the beginning of grand post war investment into the island. Hundreds of thousands of guilders were pumped into the island to turn it not only into a key tourist location, but the home base for the oldest operating airline in the world, the Koninklijke Luchtvaart Maatschappij, or KLM."

state_lore_initials.899: "EUS"
state_lore_name.899: "Sint Eustatius"
state_lore_desc.899: "If Sint Maarten is the touristic pearl of the SSS islands, then Sint Eustatius is the working man’s island. With the Dutch having a shortage of space overal, every bit of space on the island has been re-examined and pushed forward with grand economic developments. A large oil storage terminal operated by Shell, a large naval base built on the side of the island, and a fish processing plant and fishing industry make up the main economic activities here.\n\nThe island has rapidly grown into a new form, with tall apartments rising on the hills on the island’s northern end, and even the inactive volcano named "The Quill" being a place of development, and many new peoples have come to what used to a forgotten part of the Dutch empire leading to a feeling of the older inhabitants having been displaced, finding themselves severely outnumbered on the island of their forefathers. But it isn't like the new arrivals on Sint Eustatius are too happy to be there. In a way, everyone in Oranjestad is lost, trying to carve out a living on a small rock in the middle of nowhere with no real hope for advancement."

state_lore_initials.900: "SAB"
state_lore_name.900: "Saba"
state_lore_desc.900: "Saba is the smallest island in Dutch possession, and what is on it is even less. A big rock of not much more than 13 square kilometres, the island has never really had any economic function. While the arrival of the exiles has brought great progress to the other islands, Saba remains an afterthought serving only as a hiking destination for the more adventurous tourists. Yet it’s lack of development has given Saba the nickname of the Unspoiled Queen, where Carribean nature thrives untouched by man."

state_lore_initials.901: "KRP"
state_lore_name.901: "Kruispunt"
state_lore_desc.901: "Kruispunt, or Intersection in Dutch is the place on the Zuiderweg where the two forks of this grand project meet in the middle. Never intended to become a proper settlement, there is enough traffic from deeper inland mines to enable a town to exist here, the last bit of Dutch civilization for hundreds of miles of unknown jungle lands. Isolated on it’s own, the town has been kept going by providing services and support for those travelling down the jungle road.\n\nYet Kruispunt has slowly been growing into a bit more than the last town for ages, into a true rest stop with a cinema, an indoor pool and a brothel providing services for truckers and miners. For those working in the mines, or driving trucks up and down the Zuiderweg, Kruispunt remains a place of respite and rest before the long, hard, and sweaty days in the jungle continue."

state_lore_initials.902: "ELZ"
state_lore_name.902: "Elizabethville"
state_lore_desc.902: "Founded in the year 1910 and named after Elizabeth, Queen consort of King Albert the First of Belgium Elizabethville was picked as location because its proximity to the nearby copper mines and the copper ore smelting oven operated by the Union Minière du Haut Katanga not too far away. A centre of resource extraction and power, for many years the Belgian administrators and overseers built up a city in the middle of the jungle which was buoyed by ever new finds of copper and extensive infrastructure investment by the Belgian government. While life in Belgium changed heavily due to the German takeover, life in Elizabethville carried on as normal, merely switching overlords. Yet the major change that occurred was that more and more Belgians settlers arrived from the mainland looking for a better life than could be achieved in the mainland. While still under the boot of the Germans, Elizabethville has rapidly grown and developed since the end of the war and with the lax oversight of their overlords a shadow version of Belgian society has taken root here in a different continent that lords over the local peoples."

state_lore_initials.903: "DRB"
state_lore_name.903: "Durban"
state_lore_desc.903: "Durban: a city caught between the beauty of its natural harbor and the tension of South Africa. The air here is thick with salt, with the scent of goods from the bustling markets, where Indian, Zulu, and Afrikaans voices mingle in an uneasy harmony. The largest city in Natal, Durban, has always been a city of contrasts: luxury hotels towering over crowded townships, colonial grandeur beside vibrant African culture. The harbour is alive, but there’s a tension in the way the crane operators work, the way the stevedores pause just a second too long before heaving another crate. Merchant ships unload crates of supplies: some legitimate, many smuggled, while nervous sailors glance over their shoulders.\n\nThe Victoria Street Market hums with voices haggling in a variety of languages and dialects, every transaction a little quicker, every smile a little tighter. The shopkeepers know better than to ask where the shortages come from, why sugar costs twice what it did last month. They shrug, adjusting their prices and keeping their heads down.\n\nThe suburbs sprawl outward, a patchwork of privilege and poverty. In the leafy avenues of Berea, the rich sip imported gin on verandas, with complete indifference to not just those living in squalor, but the entire world around them. Beyond the harbor, the city climbs gently into the hills, a sprawl of red-roofed houses and crowded streets where the scent of curry leaves and fried dough lingers in the air. Kids kick a half-deflated soccer ball in the dust, their shouts ringing through the streets, while their mothers trade gossip over fences.\n\nAt night, the city doesn’t sleep so much as it fidgets. The neon of the harbourfront flickers, casting long shadows of sailors and soldiers on leave, their laughter too loud, their eyes darting. But the ocean is restless, the waves hitting the shore with a rhythm that feels less like a lullaby and more like a countdown."

state_lore_initials.904: "PEZ"
state_lore_name.904: "Port Elizabeth"
state_lore_desc.904: "The largest city in the Eastern Cape, Port Elizabeth, is widely referred to as the "Windy City" due to the strong southern winds that blow along its coastline in Algoa Bay. Initially founded in 1820 by British colonialists, it is today a major export hub.\n\nThe growth of the automotive industry, especially with American investment in recent years, has been credited for the recent developments of the city, with technological innovations in the tire and glass sectors, hence creating new jobs. The textiles industry has also been given a boost, with a focus on wool and mohair production, contributing significantly to South Africa’s manufacturing sector.\n\nBut beneath this industrial success, there also lies a darker truth: the black working class continues to be disenfranchised by the white elite, perhaps even more than in other cities in the country. Their access to skilled positions and opportunities for social advancement has been limited. This is not helped by the fact that many of its districts have grown around the Native Urban Districts Act of 1923, with most ethnic groups separated into different areas. In contrast, the white population is largely well off, having reaped the benefits of this unfair system, living in rich areas in the south, such as Walmer and Lorraine, while the city’s black and coloured populations largely live in the north.\n\nThe factories may provide jobs, but they don’t provide escape. Black workers clock in at dawn and return home at dusk, their paychecks swallowed by rent, transport, and the ever-rising cost of bread. Education is a luxury few can afford, and the few who claw their way into skilled positions do so against a system designed to keep them out. The white businessmen who run the city’s industries speak of "progress" and "efficiency," but their vision of the future has no room for the people who actually keep the machines running.\n\nPerhaps sooner or later, the winds of change will sweep Port Elizabeth one way or another, and that day may be soon."

state_lore_initials.905: "PRE"
state_lore_name.905: "Pretoria"
state_lore_desc.905: "Pretoria stands as a city caught between beauty and tension, a place where jacaranda trees bloom in violet cascades over wide, quiet streets, their petals drifting like whispers of a time slipping away. The executive capital of South Africa, it is a city of stately sandstone buildings, their neo-classical facades glowing amber in the late afternoon sun, monuments to an order that feels increasingly fragile. Here, the weight of history presses down like the African heat on a city built for bureaucrats and generals.\n\nThe Union Buildings, perched on Meintjieskop, watch over the city like a silent sentinel, their grandeur a reminder of the unity once dreamed of: a dream now fraying at the edges. The Voortrekker Monument, that austere granite shrine to Afrikaner nationalism, looms on the southern hills, its shadow stretching long over a land that is no longer certain of its future.\n\nYet, for all its political weight, Pretoria is still a city where life unfolds in small, human moments. In the cafes of Hatfield, students from the University of Pretoria argue over philosophy and the latest jazz records, their laughter cutting through the ever-present hum of tension. The city’s parks, Burgers, Magnolia Dell, are still places where families picnic under the trees, children chasing each other through the grass, blissfully unaware of the fractures deepening around them. The Afrikaans language, rich and rolling, fills the air in the suburbs of Waterkloof and Brooklyn, where porch lights glow in the evenings and the smell of braai smoke lingers.\n\nBut there are cracks beneath the surface. The non-white townships on the city’s edges: Atteridgeville, Mamelodi, bustle with a life Pretoria’s white elite rarely sees, save for the domestic workers and laborers who move through the city like ghosts, unseen but essential. The rumors of war, the knowledge that the world outside is changing—it all seeps into the city’s consciousness, a slow, creeping dread."

state_lore_initials.906: "LEO"
state_lore_name.906: "Leopoldville"
state_lore_desc.906: "The humid air of Leopoldville hangs thick, a permanent miasma of the Congo River’s muddy breath, diesel exhaust, and the faint, ever-present sweetness of decay. Once the defiant heart of the Belgian Government-in-Exile, the city is now the pulsing, uneasy capital of Zentralafrika, a monument to profitable exploitation. The old Art Deco facades of the European quarter are now draped in swastika banners, housing the pale administrators and corporate men from Germania who direct the vast, brutal extraction of the continent’s wealth. Their sleek black sedans glide effortlessly past crowds of skeletal, malnourished natives who shuffle through the dusty streets, their movements monitored by the cold, professional gaze of the Askari, the African SS auxiliaries whose loyalty Müller bought and whose presence is his most effective, and cynical, policy.\n\nDown by the massive river port, the true lifeblood of the colony is siphoned away: a constant procession of endless barges, low in the water under the weight of unrefined copper, cobalt, and raw rubber, all destined for the insatiable industries of the Fatherland. The skyline is a dissonant collage of colonial legacy and stark, utilitarian German architecture, all overshadowed psychologically by the monumental damming projects that tamed the river and drowned a world to create the vast inland sea to the north. Here, the rigid racial hierarchy is a visible, tense reality, a fragile peace maintained not by fervent ideology, but by Reichskommissar Müller’s detached pragmatism: a volatile cocktail of brutal suppression, generous bribery, and delegating the day-to-day misery to corrupt appointed chiefs and profit-hungry corporate overseers. It is a city of profound, gut-wrenching contradiction; a gilded cage for its masters, built on a foundation of unimaginable suffering, where the oppressive green of the untamed jungle at its edges always seems to be patiently waiting to reclaim its own."

state_lore_initials.907: "WHK"
state_lore_name.907: "Windhoek"
state_lore_desc.907: "Windhoek exists in a state of eerie, suspended perfection, a meticulously crafted piece of the Fatherland improbably transplanted onto the high, arid plains of South West Africa. The air is thin, clean, and sharp, smelling of dust and blooming jacaranda trees, a world away from the humidity of other African colonies. Under Reichskommissar Wolfgang Schenck, it has become the model for a terrifying ideal: the only truly white city on the continent. Its orderly streets, lined with crisp, modernist buildings and quaint, half-timbered facades, are spotless. Here, one sees only the faces of ethnic Germans, Boers who traded allegiance for privilege, and a smattering of other Europeans, all enjoying the wide, sun-drenched boulevards and beer gardens that spill out from cafés playing recordings of Wagner.\n\nBut this pristine tranquility is a facade built upon a foundation of absolute horror. The silence of the surrounding desert is not natural; it is the silence of absence, the result of institutional displacement of the native population and relegated them to slave plantations that fuel the colony's agriculture and mining industries. The SS patrols here are not the mixed Askari of the north, but purely white, composed of hardened veterans from Germany, their eyes constantly scanning for the slightest sign of dissent. Yet, beneath the clean sidewalks, a resistance persists. The whispers of the SWAPO movement, a ghost of the people erased, speak of a nation called Namibia, a dream of liberation that, though mercilessly suppressed, gives voice to the land’s bloody memory. Windhoek is not just a city; it is a gilded monument to conquest and invasion, a beautiful, sterile cage where the masters live in constant, paranoid vigilance, forever trying to outshout the haunting silence they created."

state_lore_initials.908: "JHS"
state_lore_name.908: "Johannesburg"
state_lore_desc.908: "It’s hard to learn about Joahnnesburg without mentioning the native Zulu’s name for the city, being ‘Egoli’, or ‘City of Gold’. Ever since the Gold Rush of the 1880s, Johannesburg’s title as the Economic and Trading capital of South Africa has given the city a lot to be itself of. It’s the most populated city in the nation, whilst also holding the largest economy. Truly, the nation wouldn't be the same without this city's addition. However, deep behind the vibrant central areas and infrastructure developments lies a grim reality.\n\nThe city faces serious levels of segregation, from the city’s layout to its very laboral framework. Ever since the Union of South Africa’s founding, the natives of the region were subjected to brutal legal repressions of the Apartheid regime. They couldn’t work any professional jobs and were forced out of the benefits the whites were able to enjoy from the Central Business District.\n\nThe most brutal of these measures carried out was the forced relocation of the Native populations to vast suburban sprawls made by the Natives in Soweto and Pageview, southwest of the city. There, they toil in the vast plantations and gold mines for wages a fraction of what whites would receive.\n\nYet as time progresses, keeping these facts away from the general public as well as the international community becomes a daring task. Mass reprisals against anti-apartheid protestors are common, as even not speaking in Afrikaans is considered revolutionary. ANC activism is essentially nonexistent as the Afrikaner seemingly dominates all aspects of life in the city. Yet with the increasing polarization of society in South Africa, the chance to reform the city into something better is becoming less of a lie and more of an opportunity."

state_lore_initials.909: "QLM"
state_lore_name.909: "Quelimane"
state_lore_desc.909: "A growing settlement, attracting immigrants from the entire planet, hoping to make a living out of the growing tea and coconut plantations near the town, which have been made more easily accessible thanks to the Portuguese infrastructure investments. Perhaps if Quelimane had remained on its course, it could’ve become something better, more vibrant, more peaceful, more African. But alas, Quelimane is dead. Bouhlerstad lies in its place.\n\nBouhlerstad was never meant to function as a typical African city. It was never meant to be African in the first place. Reichskommissar Hans Hüttig made sure to remove any influence the Natives and Portuguese had placed in the town, burning down all Cathedrals and Mosques. Life in the town became purely one of servitude to the Aryan man. All buildings and shacks were depopulated by the SS units stationed in Ostafrika, being forcefully relocated to the vast camps set outside of the town, far away for the Aryan to gaze upon them each morning.\n\nLife for the Aryan isn’t safe either. Everywhere, from the remains of once vibrant palm trees to the remains of unstable buildings left to ruin by the Cyclones roaming behind their backs, they are there, watching, hearing, and noting down. Cameras and Microphones exist throughout the town, with the few Europeans living there having no clue as to how much the central authorities of the Reichskommissariat know about even their deepest thoughts.\n\nFor both the Natives and Europeans, life is hell in Bouhlerstad. Even Hüttig himself despises it despite all the palaces built on his orders. His own paranoia is taking control over him, and it can be reflected in the very foundations of the city he sleeps in each day. From the few buildings built, each decorated by Swastikas and SS patrols in every street, Bouhlerstad has been designed by Hüttig to reflect his mental image, one of totalitarianism and fear of the spread of ideas contradicting Germanian policy. Yet, just like Hüttig himself, everything can so easily come crashing down."

state_lore_initials.910: "BMF"
state_lore_name.910: "Bloemfontein"
state_lore_desc.910: "Bloemfontein (Flower Spring) is the heart of the Orange Free State, named after the beautiful seas of flowers that blossom there every spring. Starting as merely one of the many Voortrekker settlements far away from the Cape Colony, British Major Henry Douglass purchased the land here in 1848 to establish a fort and claim the wider region for the British crown. This led to an immediate revolt by the local Afrikaners, who evicted Douglass from the region, resulting in the establishment of the Orange Free State, which lasted until 1902.\n\nAfter falling to the British in the second Boer War, Bloemfontein became the judicial capital of South Africa; home to the highest courts of the land and with a renowned legal education system. While the city has grown greatly, developing into a major economic centre in the inner regions of South Africa, it is representative of the great division in the nation; separated not by harsh Apartheid law but by a less formal version of segregation that nevertheless decisively splits the neighbourhoods into White and Native, where everybody knows their place.\n\nOne interesting fact of trivia is that both the African National Congress and the National Party were founded in Bloemfontein, and both of these organisations are likely to play great roles in the future of South Africa."

state_lore_initials.911: "ELN"
state_lore_name.911: "East London"
state_lore_desc.911: "As the name clearly states, East London was a city founded by British settlers named after the metropolis on the Thames. Settled where the Buffalo River hits the sea and creates a great natural harbour in such a way. During the frontier wars in the early 19th century between the British and the Xhosa, East London served as a forward supply port for the conflict as the Empire slowly but steadily pushed forward towards Durban. Connected by rail and road, East London grew into the second port of the newly formed Union of South Africa, where plenty of German settlers arrived, even though the connection to the motherland is long gone, and the descendants of these settlers speak English nowadays.\n\nEast London is not just a major port, but it is an industrial centre with plenty of German factories dotting the countryside that are making the best of the endless supply of cheap Native labour, yet the city’s Native population continues to grow and develop into proper communities as many more Natives come from the countryside to South Africa’s cities; looking for a better future for themselves and their families as they escape the poverty of the inner lands of South Africa."

state_lore_initials.912: "GBR"
state_lore_name.912: "Gaborone"
state_lore_desc.912: "The Bechuanaland protectorate held a unique position in Africa; being the place where Natives could be elected to a local parliament, even though it was heavily stacked with crown-appointed members, it represented a modicum of advancement not seen elsewhere in the colonial period of Africa. A great undeveloped region which was fully pastoral, the collapse of the British Empire in 1945 brought its annexation into South Africa, with the Germans not disputing the land, for it was worthless anyhow.\n\nThe land across the Limpopo River was the last frontier for South Africa, and the land was connected by road and rail, and the great mining companies started prospecting there. With the discovery of diamonds in 1951, the development of Bechuanaland was heavily accelerated, and a new city was founded on the north side of the Limpopo to serve as the local urban centre for the entire region. A centre of rail and road for further connections into the newest frontier of South Africa, Gaborone was founded in 1952 with mining money pouring into the city and the wider region named after a local chieftain who used to have settled here around the year 1880. Like all cities in South Africa, Gaborone is divided into White neighbourhoods and Native neighbourhoods, where those who are fleeing the extended droughts in the north come to eke out a living under the brand new shining office towers of the White minority there."
state_lore_initials.913: "LMQ"
state_lore_name.913: "Laurenco Marques"
state_lore_desc.913: "The plan was to claim Africa for the master race, as a place to be settled by them, and eventually cleansed of those who were unworthy of owning these great lands. But the reality of the situation quickly arose that not too many Germans are interested in settling in the hot, distant and dangerous newly founded colony, leaving the grand idea of German settlement to rot.\n\nWith the seizure of the Portuguese colonies many of the colony’s elites were displaced by the new German overseer class with Bouhlerstadt serving as the heart of the German precedence in eastern Africa, but it soon became apparent that the old colonial elites were needed to fully maintain the economic system stretched across the vast lands. With that in mind, plenty of Portuguese settlers and economic elites in Southern Mozambique were encouraged to stay with some economic autonomy given in return for overall obedience to the beast in Bouhlerstadt.\n\nServing as a greatly developed port and logistics centre for the deeper inland regions Laurenco Marques is the last realm of Portuguese settlement in Africa where the old colonial class takes orders from the Germans to avoid losing their privileges."
state_lore_initials.914: "SLB"
state_lore_name.914: "Salisbury"
state_lore_desc.914: "The land of Rhodesia is named after Cecil Rhodes, the most ardent imperialist of the British Empire, who had a great hand in expanding the British Empire in Africa, aiming for a railway running from the Cape to the Suez Canal. Originally a fort named after the then Prime Minister of the United Kingdom, Salisbury became the heart of Southern Rhodesia, a colony forged from a corporate enterprise which imposed strict restrictions on its native majority.\nOne of the most fiercely pro-British of the colonies, its annexation by the Germans was a strong blow to the proud Rhodesians who now would have to bow to their new German masters, with their ancestral homeland being just as occupied as they were. While Rhodesia continues to quietly resist its new masters, many have seen the hard hand of German vengeance and have chosen to collaborate with the German beast that has its lair in Bouhlerstadt. Yet the Rhodesians linger for South Africa, the last realm of Anglo imperialism in Africa that shines on, and they wait for the day when they can cast off the German yoke for good. Whatever the Native majority may want or dream of themselves, they haven’t been asked, and will never be asked."
state_lore_initials.915: "CPT"
state_lore_name.915: "Cape Town"
state_lore_desc.915: "Cartographically speaking, a Cape is a peninsula extending into a body of water, and here in the eponymous Cape Town, one of the world's biggest examples can be found, which makes for a fantastic natural harbour. While it had been inhabited by the native Khoisan for centuries, European contact was made in 1488 when the Portuguese explorer Bartholomeu Dias arrived here and named it the Cape of Storms.\n\nYet only in 1652 was the first permanent settlement of the region by the Dutchman Jan van Riebeeck to establish a way station halfway between the Netherlands and its Indonesian colonies, and as a place for old sailors of the VOC to retire to. With Napoleon and the fall of the Netherlands, Cape Town was invaded, occupied and annexed by the British who established the Cape Colony herein the year 1802. From here, the wider region was brought to heel and connected via road and railway towards the Cape where already a tradition of relative liberalism (if one could call such a kind of imperialist liberalism) was beginning to take root.\n\nNow, in 1962 Cape Town is perhaps not the capital, but it is the greatest port of the land and in many ways an alternate capital to Pretoria. Of note is that the wider Cape region has plenty of Cape Coloureds, who are of diverse mixed race and treated differently from the Natives. Whereas the Natives are third-class citizens, the Cape Coloureds are second-class citizens who are very much determined to preserve their relative privilege over their Native brethren, including the right to vote. The Cape Coloureds are seen in a paternalist fashion by the United Party, who are afforded a steady supply of minor benefits in return for electoral loyalty; thus further stacking the deck against the National Party. The Cape Coloureds are happy to collaborate with the White establishment, for they know that things could be far worse for them otherwise, as they know from many different examples."
