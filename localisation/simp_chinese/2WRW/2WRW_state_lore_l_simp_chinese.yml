l_simp_chinese:
 state_lore_initials.801: "PKC"
 state_lore_name.801: "彼得罗巴甫洛夫斯克-堪察加"
 state_lore_desc.801: "[Statelore_Get_petropavlovsk-kamchatsky_desc]"
 state_lore_desc.801_unfin: "勘察加彼得巴普洛夫斯克与前苏联的许多地方一样，昔日的模样已荡然无存；战舰离港时不再鸣起汽笛，船坞也不再热闹非凡。这里的生活是残酷的，破败的建筑在寒风、咸浪和暴风雪中慢慢倒塌；货物无法再从西部运来了，输油管道不再向油罐输送黑色的黄金，船只开始锈蚀。堪察加彼得罗巴甫洛夫斯克半岛的港口成了他们老旧船只的船坞，这些船只的油漆已经褪色，悬挂着早已逝去的国家的国旗，而船坞则成了黑市走私者兜售赃物的场所，而不是渔民和海洋工程师的聚集地。\n\n随着船只越来越年久失修，石油开始枯竭，人们不禁要问，这个新时代的繁荣港还能存活多久，还是会像它的前身一样，随着在远东在上空盘旋的秃鹫，落入大海，消失在历史的长河中。"
 state_lore_desc.801_fin: "船只已经起航。\n\n码头安静无声。\n\n新时代的皇家港已不复存在。"
 state_lore_initials.802:0 "OMO"
 state_lore_name.802:0 "奥莫隆"
 state_lore_desc.802:0 "耶和华如此说：“我将分散在万民中的以色列家招聚回来，向他们在列邦人眼前显为圣的时候，他们就在我赐给我仆人雅各之地，仍然居住。”\n\n北方长久的沉寂结束了。曾经，在分散的部落和自给自足的农耕村落中，热本身是一个未知的概念。现在，用火施洗的人点燃了这个地区的火焰。空旷的定居点现在响起了和散那调。虔诚的人们在冰天雪地中跪地忏悔，祈求怜悯。饥寒交迫的家庭享用着生命之粮，他们不知饥饿。上帝的文艺复兴已经开始，而且永远不会结束。\n\n俄罗斯的无政府状态结束了人类的王国。现在，只有天国。"
 state_lore_initials.803:0 "MAG"
 state_lore_name.803:0 "马加丹"
 state_lore_desc.803:0 "古老的国旗在马加丹的街道上飘扬，褴褛而破旧。她被绑在一根肮脏的旗杆上，停泊在卡托加人曾经耕种过的土地上，他们的尸骨还在为她施肥。在她的头顶，法西斯的旗帜在寒冷的空气中高高飘扬。她从未在如此残酷的环境下站岗。\n\n黑衫军步调一致地穿过城市街道，将罪犯和抗议者踩在脚下。美国水手和日本水手在纸牌上交换故事和子弹。卢梭的孩子们躲在潮湿的地下室里，决心想办法打破元首的铁腕统治。雇佣兵们聚集在港口沿岸如雨后春笋般冒出的潜水酒吧里酩酊大醉，在威士忌、伏特加和杜松子酒的熏陶下强颜欢笑。\n\n马加丹是一座因环境而沦落的城市。她披着民主的外衣，但无数无辜者的鲜血仍在她焦黑的外表下滴落。在这一切之上，\"旧日荣光 \"静静地摇曳着，象征着一切可能，也象征着一切不可能。"
 state_lore_initials.804:0 "ZEY"
 state_lore_name.804:0 "结雅"
 state_lore_desc.804:0 " 灼热的\"卍 \"霓虹灯是结雅的枷锁。黑衫军在街道上巡逻，靴子像牙齿一样咬着裂开的路面。唯一的声音是远处的枪声、木头被砸碎的声音，以及从破碎的牙齿中发出的漱口声和尖叫声。唯一的气味是干涸的血迹。为数不多的幸存者顽强且痛苦着生活着。\n\n法西斯主义在结雅的发展就像怀孕母亲乳房里的肿瘤。它是在哈尔滨的苦难移民手中转移的，那些逃离内战的懦夫，在边境线上散发着他们的仇恨。苏联解体后，移民哈尔滨的残余势力涌入远东，谋杀、强奸和掠夺他们所谓的劣等人。从那时起，结雅再也没有过片刻安宁。她宁静的世俗生活被剥夺，取而代之的是一个怀旧的小国王和恐怖的妄想。\n\n有人说，罗扎耶夫斯基被困在结雅，是他自己把自己创造成牺牲品。提出这种想法的人最好记住：§R不治之症会蔓延§!"
 state_lore_initials.805: "CHT"
 state_lore_name.805:0 "赤塔"
 state_lore_desc.805:0 "这里有无愧于国王的宝座！赤塔，东方的堡垒，诞生在雅布诺洛夫山和切尔斯基山之间的高轿之上。他已成为一个古老而令人尊敬的运动的权力之所：白军、复兴主义者、那些小嘴抹了蜜般诉说着荣誉和传统的人，以及那些在他阴暗的走廊里磨刀霍霍的人。赤塔是一座充满着对比的城市。在赤塔河畔围墙环绕的庄园里，贵族及其家臣在盛大的晚宴和愚蠢的扑克牌赌博中反击微妙的政治攻击。沙皇在宫殿里踱步，每一步都有盖特曼的士兵护卫。诚实的劳动者在无数锡矿和铜矿的矿洞中挣扎，他们的脊梁骨被戳断了一半。并非所有人都能回来。\n\n城市里弥漫着紧张气氛，就像马厩里的粪便。财阀就像地窖里的霉菌，依赖经济孢子随风飘散。无产者变得焦躁不安。贵族们变得贪婪。盖特曼掌握着他的底牌。他的对手是沙皇，而沙皇可能有一张王牌。"
 state_lore_initials.806:0 "UUD"
 state_lore_name.806:0 "乌兰乌德"
 state_lore_desc.806:0 "贝加尔湖畔的孩子乌兰乌德打破了奴役者的枷锁。独立工会和青年列宁主义者委员会占领了破旧的街道，赶走了反动的叛徒，高举起人民革命的旗帜。社会主义赞歌从家庭和工厂中响起。雅戈达华而不实的宣传被撕毁，取而代之的是鲜红的旗帜和列宁的圣像。城市广场的灯柱上粘贴着刺客和间谍的海报，他们曾经在小巷里肆无忌惮地绑架受害者。 “一切权力属于苏维埃 ！\"的古老口号在每个人的口中回荡。\n\n布里亚特人并不甘心在无趣的太阳下腐烂。他们与俄罗斯邻居一起，将自己的家园变成了新的列宁格勒。失落的一代已经找到了自己的位置。乌兰乌德将成为社会主义的大本营、无产阶级崛起的堡垒和资产阶级的绞刑架。"
 state_lore_initials.807:0 "IKT"
 state_lore_name.807:0 "伊尔库茨克"
 state_lore_desc.807:0 "伊尔克特河畔，一座大都市繁花似锦。无产阶级的劳动已经结出硕果，曾经的种子已经开花结果，成为马克思主义的典范。\n\n伟大的伊尔库茨克市已经摆脱了社会和经济上的所有寄生虫。在这里，我们找到了一个平等的天堂，一个即将实现社会主义的伟大城市。布哈林同志的梦想果然在远东扎根了！ 两百万人在完美的和谐和统一中劳动，在酿酒师亚戈达的指导下像葡萄藤一样蓬勃发展。滚滚的水流穿过宏伟的伊尔库茨克水力发电站的涡轮机。它确实是世界的新奇迹，是城市工人的劳动和决心的纪念碑。我们的战友将不再在黑暗中瑟瑟发抖。伊尔库茨克的每间公寓都被社会主义的聪明才智点亮！\n\n这是一座没有饥饿、没有疾病的城市。这是一座秩序井然、安宁祥和的城市 这里是伊尔库茨克，它是俄罗斯所有人民联盟希望和将会实现的象征。但是，请注意你的脚步。总理正在聆听。"
 state_lore_initials.808:0 "KAN"
 state_lore_name.808:0 "坎斯克"
 state_lore_desc.808:0 "公共食堂里充满了醉人的笑声，洋溢着沸腾的土豆汤的味道。邻里作坊和乡村农场回荡着热情的工作歌曲。空气中弥漫着火药味，年轻男女正在练习用家里的步枪。一座坚固的议会大厦挤满了来自边境各个角落的代表。这座城市无需介绍，因为皇家头衔和宣传只属于暴君和集权主义者。它就是坎斯克市。\n\n坎斯克在各方面都平淡无奇，除了居住在她身上的空想家。她坐落在西伯利亚横贯铁路上，挤在远东和中部的边界上。她的孩子很少，装饰品也很少。然而，没有哪座城市比坎斯克更坚定、更自豪地承受了战争的打击。中西伯利亚战争造成的彻底破坏使这个煤矿小镇变成了解放的灯塔。这些简陋的街道和烟雾缭绕的酒馆可能会为工人和农民扫清自由之路，解决布尔什维主义的矛盾，实现社会和谐，根除资本和暴政。"
 state_lore_initials.809:0 "KEM"
 state_lore_name.809:0 "克麦罗沃"
 state_lore_desc.809:0 "克麦罗沃，苏联的恐怖谷，证明了过去和未来并不矛盾。中世纪的刺绣装饰着裂纹的布哈林乔巴，在寒风中飘扬。新建的城市苏维埃是按照基辅罗斯风格雕刻的。鲜艳的绿色、深邃的紫色和醒目的红色描绘了十月革命和留里克的瓦兰吉人抵达诺夫哥罗德。公民们穿着曾经与加里宁同志有关的长袍、长袍、科尔帕克帽和农民帽。克麦罗沃已经成为一座色彩斑斓、同志情谊深厚、意识形态极其混乱的城市。\n\n事实上，中西伯利亚共和国崩溃后，留里克国王似乎对这座城市施展了神秘的魔力。克麦罗沃将其奇异的转世视为目标和理智的灯塔。她充满活力的人民，以及丰富的煤和铁矿藏，使这个城市成为七百年前消亡的王国的新文化中心。"
 state_lore_initials.810:0 "KYA"
 state_lore_name.810:0 "克拉斯诺亚尔斯克"
 state_lore_desc.810:0 "当人们想象“自由的俄罗斯”时，许多局外人想象的是一个充满战争、饥荒和疾病的无法无天的无政府状态。这些愚蠢的无知者显然从未去过西伯利亚中部雄伟的宝石克拉斯诺亚尔斯克的街道。\n\n克拉斯诺亚尔斯克和西伯利亚的许多老城市一样，从前苏联的经济规划中获得了大量的工业支持和资金，将其转变为维持西伯利亚大型人口中心的任何火车、卡车或河船的首要交通中心。即使苏联解体，它作为中西伯利亚共和国铁路站和主要港口城市的作用也不容忽视。在针对主席团残余国家的西伯利亚战争期间，尼古拉·安德烈耶夫将军对CSR发动叛变并占领了这座城市，让自由民主的最后残余陷入军阀主义。\n\n讽刺的是，安德烈耶夫将军的背叛反映了这个令人自豪的交通枢纽的现状：它是帕斯捷尔纳克共和国雄心勃勃的继承者和俄罗斯统一的关键目标。"
 state_lore_initials.811:0 "TMK"
 state_lore_name.811:0 "托木斯克"
 state_lore_desc.811:0 "缪斯，请在我心中歌唱，通过我讲述这座被貂皮包裹的城市的故事，这座城市受到雅典娜的青睐，坐在西伯利亚中部的王座上。她是科学家和艺术家的守护神，守护了两百年。山上闪亮的城市，安全港，自由主义的军火库！\n\n长期以来，美丽的托木斯克一直提醒人们俄罗斯理想主义和文化的韧性，即使在最黑暗的时期也是如此。作为古老的托木斯克理工学院的所在地，苏联解体期间，科学家、哲学家、艺术家和工程师的外逃增强了这座城市大胆的知识传统。在诗人鲍里斯·列昂尼多维奇·帕斯捷尔纳克的领导下，这种逃亡最终导致中西伯利亚共和国的诞生。这个共和国并没有持续下去。伊尔库茨克的苏联主席团和刚刚成立的共和国之间爆发了西伯利亚战争，最终导致两个政体陷入叛乱和革命。\n\n尽管经历了一个又一个的悲剧，托木斯克和她的人民仍然反抗。即使面对野蛮、背叛和可怕的不公正，他们也不会放弃建立真正自由的俄罗斯的野心。一个新的共和国正在帕斯捷尔纳克思想的子宫里成形，这个孩子不会倒下。"
 state_lore_initials.812:0 "NOV"
 state_lore_name.812:0 "新西伯利亚"
 state_lore_desc.812:0 "新西伯利亚，正如其名，完美地体现了俄罗斯东部地区从广阔的荒地到俄罗斯工业中心的迅速转变。 20世纪20年代和30年代，新西伯利亚通过西伯利亚计划获得了大部分资金，使其成长为经济强国。然而，随着联邦的垮台，这座城市的祝福变成了诅咒。人口过剩和难民危机使许多人陷入贫困和绝望，只有巴尔瑙尔的粮食使这座城市免于陷入无政府状态的边缘。毒品滥用、激进化和不断扩大的财富不平等导致地下持不同政见者和犯罪分子的数量不断增加。\n\n如今，新西伯利亚已被平庸所吞噬，她最后的土地和自然资源被从她流血的尸体上夺走。公民要求变革的呼声越来越高，尽管其领导层对无政府状态的尖叫声充耳不闻。工人之城需要英雄，否则它将永远坠入深渊。"
 state_lore_initials.813:0 "VKT"
 state_lore_name.813:0 "沃尔库塔"
 state_lore_desc.813:0 "在西西伯利亚冰封的荒野中，坏疽的永久冻土变成了恐怖的堡垒。很少有人敢接近这样一个无情的领土，因为他们知道那些侵犯其边界的人永远不会回到家人身边。只有少数幸运者逃脱了这片土地的冰冷控制。无论他们是圣人还是恶棍，他们干裂的嘴唇上都挂着一个词：“沃尔库塔。”\n\n沃尔库塔是一只肿胀的蜱虫。它的头钻进俄罗斯的肉里，吸走煤脉。它吃人，剥夺他们的肌肉和生存意志，直到只剩下尸体扔到垃圾堆上。曾经，沃尔库塔在一个可怕且不人道的体系中占有一席之地。曾经，所有这些痛苦可能都是有原因的，尽管可能是愤世嫉俗和叛逆的。但随着联邦的解体，这座地狱之城的煤炭不再为战争机器提供动力。它也不能为官僚们的家里供暖。它坐在那里，长成一座小山，可以用来交换一个不会到达的封地。"
 state_lore_initials.814:0 "SVK"
 state_lore_name.814:0 "斯维尔德洛夫斯克"
 state_lore_desc.814:0 "斯维尔德洛夫斯克拥有许多崇高称号，其中最重要的是“亚洲之窗”。这座城市矗立在从乌拉尔山脉进入西伯利亚的通道上，伊塞特河环绕其上，周围环绕着茂密的森林。在它的注视下，无数无辜者逃离了德国纵队。\n\n俄罗斯第三首都，叶卡捷琳娜夫人的城市，现在是罗科索夫斯基元帅军政府的所在地，也是著名的第三集团军的基地。这座城市是一座堡垒。对于除了最熟练的指挥官之外的任何人来说，它都是坚不可摧的。士兵们在街道上坚持不懈地训练，每小时从防御阵地行进到机枪阵地。西西伯利亚的几辆步兵战车在街道上徘徊，以同样的方式镇压罪犯和渗透者。平民也看到了他们的生活发生了变化——在罗科索夫斯基元帅的领导下，区别已经模糊，城市苏维埃被完全剥夺了权力，转而实行临时的紧急军事独裁。\n\n没有哪个哨兵可以永远站岗。但随着俄罗斯走出冬眠，亚洲之窗不会安静地坐着。这座城市可能很快就会被命名为“莫斯科之窗”。"
 state_lore_initials.815:0 "TYU"
 state_lore_name.815:0 "秋明"
 state_lore_desc.815:0 "鼓声在深处响起。在地表深处，在由贪婪的机器雕刻而成的洞穴中，在苍白的荧光灯的照射下，废弃的机器敲击着恒定的节奏。半夜，鼓声敲响。清晨，当一颗被遗忘的太阳升起，夺回太阳王座的时候，鼓声响起。安息日，鼓声敲啊敲啊敲，不屈不挠，地狱般。\n\n在地面上，秋明只不过是一座墓地，一座埋藏着列宁尸体和即将成为尸体的平民的城市。这是一个挥舞着红旗的目标。在翻腾的土地下，卡冈诺维奇主席的仆人们挖出了一座迷宫般的陷阱隧道和陵墓营房。他们集结了足够多的工业，足以让整个西伯利亚充耳不闻。但秋明不仅仅是一座陷入黑暗的城市。它是斯大林主义的新圣城，成千上万的人在其蜿蜒的洞穴中接受了洗礼。经历寒冷和饥饿，经历无聊和泪水，他们坚守了信仰。有一天，他们将不再需要躲在潮湿、不值得的走廊里。"
 state_lore_initials.816:0 "ZLA"
 state_lore_name.816:0 "兹拉托乌斯特"
 state_lore_desc.816:0 "在乌拉尔山脉充满爱的摇篮深处，兹拉托乌斯特安息在舒适之中。步枪城，西伯利亚受宠的女儿，没有遭受无政府状态的恐怖。她尽职尽责的工人和兹拉托乌斯特机械制造厂的尖端硬件生产了足够的枪支来装备一支军队 - 他们已经做到了。德拉古诺夫同志的天才设计已被经验丰富的双手打造为现实，而这些设计又使城市免受强盗和邪教的侵害。兹拉托乌斯特是一座光辉灿烂的城市，没有受到炸弹和子弹的破坏。\n\n但很快，她就会成为这样的人。\n\n每个孩子有一天都必须离开她的摇篮，兹拉托乌斯特也不例外。她的军队必须做好准备，面对的不仅仅是乌合之众的强盗和无耻敌人的摇摇欲坠的袭击。怪物正在向她的东方袭来。为了生存，她必须放弃华丽的服饰，抛弃黄金，熔化街道上的巨大雕像——否则兹拉托乌斯特将永远消失。"
 state_lore_initials.817:0 "CEK"
 state_lore_name.817:0 "车里雅宾斯克"
 state_lore_desc.817:0 "火与钢之城正在熊熊燃烧，将敌人烧成灰烬。车里雅宾斯克是坦克之城、乌拉尔山脉的芝加哥、共产主义的熔炉。她的街道灼烧着不值得的人，烧毁了谎言和反应。即使在数英里之外，流浪的游牧民族和强盗也必须蒙住眼睛，以免被击瞎。\n\n可以肯定的是，车里雅宾斯克是一个宝藏。即使在西西伯利亚生产力超群的城市中，列宁锻造厂仍然是最大胆、最勤奋的。仅她的工厂就可以装备三个坦克师。尽管遭受德国空军轰炸和年事已高，车里雅宾斯克拖拉机厂仍在运转。它仍然是一个享有盛誉的工作场所，是勤奋的无产阶级和追星青少年的个人成就的象征，也是学校老师向他们承诺最优秀的学生将有权在其中服务的地方。车里雅宾斯克的人民勤奋、自豪，并且忠诚于马克思主义。他们不会接受暴政的枷锁，无论是漆成红色还是滴落黑色。"
 state_lore_initials.818:0 "OMS"
 state_lore_name.818:0 "鄂木斯克"
 state_lore_desc.818:0 "寂静的河流缓缓流过一座寂静的城市。老人和残疾人蹑手蹑脚地穿过死气沉沉的街道，每一步都在不说话的黑衣警卫的监视下。布哈林霍巴崩溃成废墟。没有人敢说话，每一次呼吸都被仔细记录和分析，寻找叛逆的痕迹。这就是鄂木斯克，死亡之城。但在表面之下，存在着另一个事实。\n\n在疲惫和奴性的笼罩下，机器随着行进的长筒靴而轰鸣。工业的无休无止的嗡嗡声震耳欲聋。青少年们尖叫着，因为他们的手指被比他们更古老的机器扯断，结果却被匆忙下线，不假思索地更换了。将军们在装甲掩体深处密谋。学员们精神分裂，§R为了俄罗斯、为了家人、为了即将到来的考验，放弃了自我保护的想法。§!"
 state_lore_initials.819:0 "ORB"
 state_lore_name.819:0 "奥伦堡"
 state_lore_desc.819:0 "在俄罗斯无政府状态的不确定性和混乱中，一个人看重什么：填饱肚子和免受土匪侵害，还是他的自由和政治传统？尽管奥伦堡周围的无政府主义公社自豪地珍惜他们的自由和农业生活方式，但更多的人在城市内寻求庇护，希望保护自己免受袭击南乌拉尔地区的袭击者和不法分子的侵害。\n\n在苏联解体期间，奥伦堡市从中亚城市的一个不起眼的铁路枢纽发展成为乌拉尔国家的钻石。尽管俄罗斯在20世纪50年代经历了螺旋式下滑，但许多苏联企业逃往奥伦堡，使其经济和工业实现了奇迹般的增长。奥伦堡在其东部的破坏中成长为整个南乌拉尔工业和繁荣的中心，因为许多鄙视无政府主义的人涌入公社寻求面包、住所和某种形式的政府，无论多么微小。\n\n现在，这座城市必须运用集体力量来保护无辜者。它必须改革其失败的政治体系，照顾挤在围墙内的无数难民，并保卫乌拉尔免受残暴军阀的侵害。只有通过联合斗争和忠诚服务，奥伦堡人民才能摆脱死亡的幽灵。"
 state_lore_initials.820:0 "MGN"
 state_lore_name.820:0 "马格尼托哥尔斯克"
 state_lore_desc.820:0 "广阔的马格尼特纳亚山曾经是辉煌的工业之地，是苏联与外国国际合作成功的象征。这座城市里源源不断的铁锰浪潮是美好时代的标志，工人们不再需要在贫瘠的土地上漫无目的地劳作，祈求粮食，而是可以共同努力实现乌托邦。\n\n现在，只剩下山了。\n\n黑山正在注视着。它看到一切、每个人。人们消失了——从他们的床上、从他们的工作场所、从他们的餐桌上，燕麦仍然热气腾腾。每个人都失去过一个人。首先，只有无家可归者和弱势群体。患病儿童从托儿所消失，精神病患者从城市疗养院消失。然后是罪犯、反动派。但很快，即使是身体健全、忠诚的共产党人也开始从工作一线消失。整个工厂都因缺乏劳动力而关闭，或者因为他们的工业政委“换了位置”。\n\n§R没有人是安全的。§!"
 state_lore_initials.821:0 "SAM"
 state_lore_name.821:0 "萨马拉"
 state_lore_desc.821:0 "双岸的女士从来没有像今天这样堕落过。有一次，莫斯科都主教赐福给这座城市，并宣称上帝和天堂将永远不会征服它的城墙。然而，伏尔加河上的明珠却被德国的炸弹和子弹以及叛徒沾满泥的靴子永远玷污了。萨马拉在KONR叛徒军团的鞭子下呻吟，呼喊着解放和自由。骄傲的街道永远被泥土和鲜血玷污。劳动宫殿、工业和俄罗斯自豪感的象征，已被无情的野兽付之一炬。学校、教堂、住宅和寺庙——全部都被烧成了灰烬。无论出于何种原因，萨马拉每一个腐朽的灵魂都知道上帝已经背弃了他们。"
 state_lore_initials.822:0 "PEE"
 state_lore_name.822:0 "彼尔姆海姆"
 state_lore_desc.822:0 "西俄战争给俄罗斯留下了许多创伤，但在帝国东部没有一座城市遭受比彼尔姆更多的痛苦。在雅利安兄弟会统治下更名为佩尔姆海姆的这座曾经美丽的城市已经被摧残，与曾经位于这里的佩尔姆毫不相似。它在各个方面都已成为一座屠杀之城。\n\n在这座城市中，到处都有游荡的雅利安“优等人”团队和颤抖的奴隶队伍，城市的每一个方面都被粗暴地打磨成一把刺刀。幸存下来的建筑物不过是一堆混凝土块，经常被浓烈的有毒烟雾笼罩。市民经常被从街头或床上抓走，被迫参加骨碎的轮班工作，这是城市曾经引以为傲的工业的残余。每天都有数十人丧命。他们被工业机械碾碎，或者被奴隶监工鞭打致死，或更糟的是死于霍乱。佩尔姆海姆是一个肮脏、臭气熏天的屠宰场，是一个只能作为人类嘲笑的死亡和痛苦之源的机器。"
 state_lore_initials.823:0 "KZN"
 state_lore_name.823:0 "喀山"
 state_lore_desc.823:0 "还有什么比在恶臭沼泽中绽放的莲花更美丽的呢？还有什么欲望比自由的需要更强烈地燃烧呢？\n\n对于喀山市来说，答案是否定的。可怜的联邦已经消失，他们的国家可以再次自由呼吸。在布哈林领导下闲置的工厂现在正忙着生产枪支、收音机和汽车。曾经穿着俄罗斯语言的破烂商店现在用鞑靼人的招牌、鞑靼人的菜单和鞑靼人的标志来装饰。这座城市的信徒现在可以自由礼拜，无论是午夜弥撒中的基督徒还是跪在麦加的穆斯林。几十年来积累的灰尘和污物被一扫而光；即使是泥土也似乎闪耀着新的可能性。伏尔加河在闪闪发光，星光熠熠的鞑靼人只能想象他们的人民将享受的模范未来。"
 state_lore_initials.824:0 "GOR"
 state_lore_name.824:0 "高尔基"
 state_lore_desc.824:0 "坦克履带和巨大的炮塔轰鸣着穿过高尔基的街道，可怕的行军声中路面开裂。屋顶上机枪闪烁。庞大的克拉斯诺耶索尔莫沃工厂每小时都会喷出凶猛的野兽，将金属和橡胶吞入她冒着浓烟的子宫里。她的孩子们是羽扇豆高尔基坦克旅，他们的狼群正在狩猎。\n\n这里是一座掠夺者的城市。高尔基的儿女不是值得怜悯的受害者；他们是掠夺者，是活吞德国殖民地的流口水的胃。他们的牙齿是咬在希特勒脚上的。他们是掠夺者、掠夺者，是那些为了复仇和掠夺而放弃梦想的人。对于每一个被活活烧死的母亲，对于每一个被毒气毒死的孩子，他们都会狩猎。他们杀人。他们每天都在复仇，他们品尝着正义的蜜汁。他们的生活没有遗憾，因为只要俄罗斯仍处于无政府状态，他们就是祖国的剑。"
 state_lore_initials.825:0 "VYA"
 state_lore_name.825:0 "维亚特卡"
 state_lore_desc.825:0 "维亚特卡市是一片对比鲜明的土地。沙皇建筑与野兽派规划的住房混合在一起。维亚克塔州立大学充斥着自由辩论和开放研究，而该市本已受到审查的媒体却受到警备队的跟踪。前布尔什维克和真正的自由主义者都聚集在街道上，而专制主义者则密谋阻止他们的叛国行为。镀金的大理石建筑里只有鬼魂和灰尘。\n\n沙皇和他的侍从们通过指出南方合作者政权的暴行来提高他们的受欢迎程度。但在这座曾经被命名为李可夫的城市里，除了沙皇的诺言之外，没有任何法律。一个疯子的一时兴起决定了成千上万人的命运。伟大的皇冠已经成为一种负担、一座城市的牢笼和沙皇本人的枷锁。然而，枷锁可以与其他人分享，沙皇也许还能找到他的昔兰尼西蒙。保皇派打算在这里进行最后的抵抗。他们将把俄罗斯染成白色，否则老鹰的土地将永远被染成红色。"
 state_lore_initials.826:0 "SYK"
 state_lore_name.826:0 "瑟克特夫卡尔"
 state_lore_desc.826:0 "瑟克特夫卡尔扭曲的街道上笼罩着漆黑的阴影。曾经，他是我们所有人的地方，言论自由和思想自由被视为神圣纽带的土地。同志们可以理性地讨论分歧，共同努力建设更美好的社会。尽管这座城市的精英们仍然坚持这种自命不凡，但这些自由和宽容的承诺只不过是尸体脸上的粗俗化妆品。\n\n瑟克特夫卡尔是一座笼罩在丧礼之下的城市。在这座城市，暗杀者紧追小代表的脚步，邻里抢劫犯袭击持不同政见的选民。共产党指挥自己的坦克旅。市议会曾经是一个著名的机构，但现在已经陷入腐朽和争吵。现在，只有帮派战争才能打破无休止的议会僵局。科米共和国失败了。它必须通过§M投票§!或者§j子弹§!重新组织起来。但笼罩在这座城市上空的阴影并不是历史的阴影，也不是冲过天空的德国空军的阴影。瑟克特夫卡尔兵工厂大门处的阴影若隐若现。如果这些大门打开，俄罗斯将§p陷入疯狂§!。"
 state_lore_initials.827:0 "ARH"
 state_lore_name.827:0 "阿尔汉格尔斯克"
 state_lore_desc.827:0 "阿尔汉格尔斯克是白海的冰冻明珠。她曾经是沙皇国最重要的海港，在列宁格勒陷落后恢复了自己的使命。这座城市已成为整个地区的生命线。食物、燃料和小奢侈品像河岸上的融雪一样流过她的身体。没有她，西俄罗斯人民就会挨饿，但即便如此也还不够。但阿尔汉格尔斯克还有一项职责：为陷入困境的西俄罗斯革命阵线提供庇护，为格奥尔吉·朱可夫在乌克塔的驻军提供补给，并为米哈伊尔·图哈切夫斯基在狂风肆虐的内陆地区的防空炮提供燃料。如果前线重新掌权，阿尔汉格尔斯克街道上征收的税款将拯救整个地区。\n\n在过去，阿尔汉格尔斯克是自由俄罗斯的基石。它是西俄战争期间最早恢复自由的城市之一，她从未失去感激之情或决心。但在残酷的命运转折中，阿尔汉格尔斯克成为了前线的监狱，因为他们的领土核心落入了修正主义者、通敌者和破坏者手中。未来几年，阿尔汉格尔斯克的命运将铭刻在石头上。她将成为前线的守护天使，或者前线的护柩者。"
