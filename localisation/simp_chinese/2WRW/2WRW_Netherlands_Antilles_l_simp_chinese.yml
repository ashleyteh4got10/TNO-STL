 CUR_Efrain_Jonchkeer: "埃弗拉因·琼克希尔"
 POLITICS_EFRAIN_JONCHKEER_DESC: "荷属安的列斯群岛争取自治的斗争始终是和平且成功的。由于地理条件的限制，加之双方深刻认识到这一进程将互惠互利，《莫里茨斯塔德协定》于1948年签署。该协定确保了更大程度的政治独立，同时王国两部分之间紧密的经济联系依然稳固。\n\n领导这个自治区的是一位名不见经传的商人、外交家和政治家——埃弗拉因·琼克希尔。从他最初萌生这一理念起，便一直为荷属安的列斯群岛奔走呼吁。作为民主党的创始人和领军人物，他自掌权以来始终牢牢掌控着安的列斯政坛。埃弗拉因在实现自治的同时恪守《莫里茨斯塔德协定》条款方面表现出色，成功争取到荷兰和美国的大规模投资，将六个安的列斯岛屿建设成现代化发达经济体，充分利用每一寸土地。这位群岛的掌舵者以其高超的谈判技巧和对进步永不知足的眼光引领发展，岛民们不禁思索：若没有他，这一切将何去何从。"
