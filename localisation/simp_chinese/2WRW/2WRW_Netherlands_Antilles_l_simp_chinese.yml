 CUR_six_islands_one_favorite: "纨绔子弟"
 CUR_six_islands_one_favorite_desc: "在所有的官方文件和公开声明中，荷属安的列斯群岛的六个组成岛屿都是荷兰王室庇护下统一构成国的平等组成部分。但现实中，库拉索岛始终独占鳌头，其余五岛却被弃如敝屣任其凋零。\n\n尽管不满情绪持续发酵，库拉索岛始终独揽荷兰与美国注入的所有投资机遇、机构资源和荣耀光环。这与1949年自治协议中提到的平等伙伴关系相去甚远——库拉索岛的主导地位使得其他岛屿怨声载道。当父辈预设的平等愿景渐行渐远，日益增多的抱怨与呼声始终未能得到倾听。抗议的声浪不断升级，子民们的愤懑正不断滋长。"
 CUR_little_tropical_island_paradise: "一座热带小岛天堂"
 CUR_little_tropical_island_paradise_desc: "这里全年气候宜人，税收政策同样诱人。虽然大型商业旅游业尚处萌芽阶段，但荷属安的列斯群岛已找到吸引外资与游客的独特方式：遍地开花的避税天堂。\n\n尽管尚未广为人知，我们的声誉——更准确说是恶名——正在自由世界的企业家与超级富豪圈中悄然传开。加拿大的空壳公司遍布我们的海岸线，南非的CEO们端坐在空调办公室里，澳大利亚的会计师们在工作站前埋头运作，以自由、民主和资本主义之名转移利润。美国消费者或许没听说过安的列斯，但美国企业高管们绝对心知肚明。"
 CUR_60_40: "六四分成"
 CUR_60_40_desc: "安地列斯经济的支柱在于石油精炼、燃料补给及石油储存——荷兰皇家壳牌公司的核心业务占据了我国GDP的绝大部分。因此，荷兰皇家壳牌公司首席执行官约翰·雨果·劳顿的话在我们这些小岛上就是最重要的法律。\n\n由于我们国家的繁荣与单一资源紧密相连，委内瑞拉石油出口的新关税政策严重动摇了我们的地方经济。拉拉萨巴尔总统推行的政策导致油价飞涨，壳牌被迫缩减业务。新政策规定所有石油收入的60%必须交给委内瑞拉（而不是过去的五五分成），迫使我们这个严重依赖委内瑞拉供应的国家，不得不忍痛将壳牌挤出市场。除非情况发生变化，否则安地列斯和壳牌将同受其害，而委内瑞拉的民粹主义政府将继续掌握所有主动权。"