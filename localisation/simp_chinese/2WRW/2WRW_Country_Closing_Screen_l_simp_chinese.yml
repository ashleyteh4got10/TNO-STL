l_simp_chinese:
 TNO_CountryClosing_epilogue_NOV_RSLP: "尽管面临着持续的艰巨挑战，从旧金山繁华的城市到坚韧的莫斯科大都市，世界在和平合作中团结一致，迎接更光明的未来。来自西伯利亚苔原的一个人的梦想战胜了专制主义和战争的灾难。\n\n俄罗斯人民走在新铺设的道路上，享受着繁荣的回报。他们在晴朗的蓝天下休闲，准备迎接未来的挑战。在这些方面，安纳托利·科里亚金让俄罗斯成为一个变得更好的国家。虽然国内外的种种挑战尚未全部克服，但尽管面临巨大的困难，自由的火炬，现在在东西方之间交织，燃烧得很明亮，俄罗斯及其盟友愿意以勇气和尊严捍卫和平追求中的火焰。"
 TNO_CountryClosing_epilogue_NOV_DSPR: "从莫斯科到萨拉托夫，叶卡捷琳堡到新西伯利亚，俄罗斯已经踏上了一条艰辛而不懈的进步之路。富人们被社会主义浪潮所推退，曾经无处不在的大型企业已经化为灰烬。在这些方面，列昂尼德·康托罗维奇和他对联邦的宏伟抱负取得了成功。\n\n然而，反动势力和俄罗斯人民不愿接受这种未来的不情愿仍然是一个长期存在的障碍。总统的许多承诺尚未兑现，这种失败可能对他的政府构成致命打击，而如此迅速和毫不妥协的变革已经在俄罗斯国内造成了更多的敌人而非盟友，因为许多人，甚至普通百姓本人，都对康托罗维奇所铺设的道路表示了坚决的拒绝。平等自由的联邦愿景尚未消失，但是随着人民的支持几乎已经消失，这可能会成为一个难以克服的问题，即使是最好的方程也无法解决。"
 TNO_CountryClosing_epilogue_NOV_RAPP: "整个俄罗斯和她的人民都欣喜若狂。 他们经历了苦难，从大动乱时期和西罗维基中饱受风霜。但是现在，随着瓦西里·舒克申，民主终于被带到了联邦。 稳健的改革和对德战争的胜利给人民带来了新的繁荣和自由时代。 从鄂毕河的岸边开始，一种对俄罗斯来说陌生的感觉已经开始扎根：希望。\n\n尽管未来可能光明，但总统仍然面临着挑战。 随着德国势力范围的解体，俄罗斯现在已经成为欧亚大陆的霸主，并且战争的创伤仍然存在，可能永远无法愈合。 但只要自由的梦想被保持，无论黑暗多么临近，俄罗斯都将安全，而联邦将取得胜利。"
 TNO_CountryClosing_epilogue_NOV_Zubakov_Coup: "什么使一个人成为俄罗斯人？是他的道德？他的价值观？他的爱国主义？在大型企业及其发言人祖巴科夫的眼中，这取决于他的钱包有多深。\n\n随着整个国家因烈士瓦西里·舒克申的死亡而骚乱，他对俄罗斯的理想和梦想开始消失。随着同胞不再认识同胞，争夺他们心爱的祖国的残羹剩饭，只剩下愤怒、沮丧和暴力。无论好坏，尤里·祖巴科夫已经开启了一个新时代的俄罗斯衰败和堕落。\n\n舒克申总统任期的乐观情绪已经成为一个遥远的记忆，很可能永远不会再回来。无论俄罗斯人民可能扑灭多少火，都会有更多的人填补他们的位置。祖巴科夫注定了俄罗斯走向富豪统治和无意义的贪婪的未来，希望之光可能已经最终熄灭。"
 TNO_CountryClosing_epilogue_NOV_Shukshin_Counter_Coup: "当舒克申总统首次踏上他为俄罗斯人民在真正民主下自由呼吸的征途时，他有着无与伦比的热情。他与特工的贪婪作斗争，修补了大动乱时期所造成的伤痕，并取得了对德战争的胜利。他努力消除了纳粹统治东欧数十年所造成的损害。但是当总统再次主持一个被权力和控制欲破坏的国家时，他发现自己的工作是徒劳的。\n\n在普里马科夫总统任期后，他数十年的努力被抹消了，更重要的是，企业傀儡祖巴科夫让联邦成为一个破碎的国家，其政府已经腐化到远远超出了波克雷什金的想象。现在，舒克申所能做的就是确保这样的罪行永远不会再次发生。只要他能保护俄罗斯，只要他是唯一能保护俄罗斯的人，他就可以阻止另一个祖巴科夫的出现。即使这意味着牺牲他曾梦想的民主。"
 TNO_CountryClosing_epilogue_NOV_Failure: "当俄罗斯踏上对纳粹的十字军东征时，俄罗斯人民的心中充满了渴望，终于能看到东欧摆脱几十年来占领它的铁蹄。俄罗斯联邦新近现代化的军队和工业基地终于似乎是一个足以与大日耳曼国抗衡的强大力量。但现在，对俄罗斯和东欧自由的机会已经终结了。\n\n无论俄罗斯行政机构的残余如何，它们现在都在与黑暗作斗争，渴望重新统一俄罗斯。但日本和德国的秃鹫已经捡走了联邦尸体上剩下的可供拿取的东西，西伯利亚的人民宣布结束俄罗斯对他们的统治。无论俄罗斯内部还剩下什么光明，它黯淡的存在都不足以拯救这个曾经自豪的国家。俄罗斯已经失去，可能永远失去了。"
 TNO_CountryClosing_epilogue_RUS_Communist_Victory: "三十年前，当纳粹摧毁苏联时，许多人认为这是布尔什维主义在俄罗斯土地上的终结。然而，最初解放俄罗斯人民的意识形态仍残留在俄罗斯的一些角落，到本世纪初，它已蔓延到整个国家。俄罗斯无产阶级团结起来进行斗争，他们把目光投向了西方，投向了仍在纳粹枷锁下苦苦挣扎的同志们。\n\n在随后的烈焰中，他们凯旋而归，击碎了德国之鹰，为红军阵亡将士复仇。接下来会发生什么，对欧亚大陆的无产阶级来说是个谜，但有一点是肯定的：20 世纪的结束将预示着一个新时代的到来。一个红色时代。"
 TNO_CountryClosing_epilogue_RUS_Communist_Defeat: "红军再次西进，又被大日耳曼国的威力击溃。随着共产主义的红灯在全国范围内传播其关于没有锁链的未来的承诺，希望短暂地回到了俄罗斯的工人和农民身上。俄罗斯将目光转向西方，试图为纳粹对其人民造成的历史不公正进行报复，但它却像其祖先以前多次失败的那样失败了。\n\n这次最终的失败之后会发生什么，我们不得而知，因为联盟的残余力量正因他们的失败而感到震惊。但是，随着德国国会的翅膀在欧洲上空翱翔，在欧盟这一策略的废墟中，有一个事实：布尔什维主义再也不会对德国的世界秩序构成威胁。共产主义辜负了欧亚大陆的人民，其无产阶级被置于永恒的黑暗之中。"
 TNO_CountryClosing_epilogue_RUS_Democratic_Victory: "自 1917 年的动荡岁月以来，俄罗斯大地首次迎来了民主。俄罗斯从一个憧憬美好明天的小国起步，如今已被自由和法治的力量所统治。随着全国人民团结在自由梦想的背后，俄罗斯向西进军，粉碎了大日耳曼国，为欧亚大陆带来了民主之光。\n\n对于俄罗斯人民和欧亚大陆的其他国家来说，以后会发生什么还是个谜。但有一点是肯定的：一束新的光芒照亮了整个欧洲，一束宣告所有人都享有民主和自由的光芒。"
 TNO_CountryClosing_epilogue_RUS_Democratic_Defeat: "自由之光已经熄灭，也许永远熄灭在俄罗斯的土地上。作为绝望之海中的一片自由绿洲，俄罗斯从一个小国起步，到本世纪初，自由和民主已经遍及整个俄罗斯。在俄罗斯人民的心目中，只有粉碎纳粹的威胁，才能实现真正的自由。然而，这一切都是徒劳的。\n\n德国空军的靴子踩灭了民主之光，欧亚大陆人民永远无法获得自由和繁荣。随着德国之鹰比以往任何时候都更加强大，一个显而易见的事实是：再也不会有一个强大而统一的俄罗斯了。她将永远成为历史暗影中的一个注脚......"
 TNO_CountryClosing_epilogue_RUS_Authoritarian_Victory: "在俄罗斯无政府主义的混乱中，新秩序从旧秩序的灰烬中诞生。共产主义不再会削弱俄罗斯人民为国家安全而战的决心。民主不再会破坏一个强大的俄罗斯国家所必需的秩序和稳定。相反，铅和钢铁的承诺塑造了俄罗斯人民。\n\n在这些承诺的指引下，俄罗斯熊以几十年来从未有过的气势屠杀了颓废和镀金的德国鹰，并取得了胜利。欧亚大陆已经有了新的秩序，但有一点可以肯定：俄罗斯人民永远与这位从混乱中带来秩序、从绝望中带来希望、从分裂中带来团结的领袖紧紧相连。"
 TNO_CountryClosing_epilogue_RUS_Authoritarian_Defeat: "在俄罗斯无政府主义的混乱中，俄罗斯人民被钢铁和铅的力量团结起来。他们团结在一位强大的领袖身后，向世界许下诺言：纳粹将被抛在一边，俄罗斯国家将像她的命运一样，胜利而强大地崛起。然而，人民最担心的事情还是发生了。德国撕裂了俄罗斯巨熊的心脏，再一次粉碎了俄罗斯人民的决心。\n\n对于欧亚大陆的人民来说，纳粹暴政的控制有增无减。从鹿特丹到莫斯科，当德国军队在街头游行时，有一个事实已被载入史册： 俄罗斯将永远软弱和破碎，被扔进历史的垃圾堆。"
 TNO_CountryClosing_epilogue_RUS_Fascist_Victory: "三十年前，苏联解体时，许多人认为俄罗斯人民永远不会再起。历史已经证明他们错了。在法西斯的榜样下恢复了伟大，俄罗斯人民跟随他们的日耳曼敌人的教训，让鲜血和土地的爱进入了他们的心中。再次团结在这不朽的信条之后，他们粉碎了大日耳曼国，夺取了欧亚巨人的地位。\n\n对于俄罗斯及其霸权的未来充满了不确定性，但很明显，随着一个法西斯帝国的崩溃，另一个已经崛起取而代之。也许这是一个迹象，无论历史走向如何，阿道夫·希特勒遗产的幽灵注定要统治旧世界。"
 TNO_CountryClosing_epilogue_RUS_Fascist_Defeat: "当俄罗斯人民踏上夺取欧亚大陆霸主合法地位的征途时，他们的信念是坚定不移的，他们的决心是万无一失的。但是，即使俄罗斯人民充满信心，他们的领袖似乎也让他们失望了。他们曾被许诺，作为地球上最强大的种族，他们将在其他人--弱小的人--失败的地方取得成功。然而，现在他们已经支离破碎，帝国统治者正享受着他们的痛苦。\n\n对于旧世界的男男女女来说，接下来会发生什么是个谜。但是，随着俄罗斯雄鹰被击碎，散落在西伯利亚寒冷无情的荒原上，俄罗斯只剩下一条路：继续在痛苦、错失的希望和对旧帝国的嫉妒中循环。"
 TNO_CountryClosing_epilogue_NOV_VRPP: "杜马大厅变得寂静无声，俄罗斯已被出价最高者买入。普里马科夫总统贪婪的影响可以在每个劳动公民的悲伤和每个企业巨头的笑声中看到。为了全俄爱国党的企业赞助人的利益，这个联邦的理想已经被玷污和抛弃，而波克雷什金的联邦在“实用主义”的幌子下恢复了悲观和政治冷漠。\n\n面对日益加剧的贫富分化、迅速恶化的环境以及公民自由的缓慢腐蚀，痛苦和苦难不会区分俄罗斯的是否值得。随着民主梦想的逐渐消失，联邦过去的幽灵重新回来困扰它，这个国家挣扎着维持希望。但是，联邦以前曾经处于这个地方。也许它可以再次挣脱暴政的控制，然后挽救一切尚未丧失的东西。"
 TNO_CountryClosing_epilogue_OMS: "从人猿互掷石头开始，角争之枢从未停止转动。在历史的飓风中，它加速，升级，最终成为了这颗星球上任何生命都不可承受之重。\n这一切或许源于一篇报告，一次演讲，又或许只是一次电路故障。总之，无论出于有心或是无意，一系列巧合最终使角争成为世界的主旋律。最终，原子烈焰为它画上了休止符：生灵涂炭，人类最终走向了自我毁灭…\n…吗？\n\n自第一只古猿踏上徒弟已百万载，人类已经证明了自己能在任何逆境中求得生路，而现在，鸽子已叼来新时代的橄榄枝，世界各地的地堡舱口打开，人类第一次重新打量这个世界，正如诺亚方舟熬过大洪水。\n角争仍将继续，角争永将继续，但进步的火星从未熄灭，人类注定向上生长。\n为此，即使再花上一百万年也不足为惧。"