l_simp_chinese:
 LOADING_TIP_0:0 "§T南非属于所有生活在这片土地上的人，无论黑人或白人。\n——塔博·姆贝基，1970年"
 LOADING_TIP_1:0 "§T领导者的首要职责是乐观。你的下属在与你见面后感受如何？\n他感到振奋吗？如果没有，你就算不得一个领导者。\n——伯纳德·劳·蒙哥马利，1954年"
 LOADING_TIP_2:0 "§T纪律能强化心智，使其免受恐惧的侵蚀。\n——伯纳德·劳·蒙哥马利，1942年"
 LOADING_TIP_3:0 "§T如果真有上帝，我想他会乐意让我尽可能把非洲涂成不列颠红。\n——塞西尔·罗得斯，1902年"
 LOADING_TIP_4:0 "§T若实行成年男子普选权，南非各地的白人将被土著淹没，白人两百多年来为之奋斗的整个地位都将付之东流。\n——扬·史末资，1934年"
 LOADING_TIP_5:0 "§T或许正是上帝的旨意，引领南非人民穿越失败与屈辱，\n奔赴更美好的未来与更光明的一天。 ——扬·史末资，1945年"
 LOADING_TIP_6:0 "§T不要以我的成功来评判我，而要以我跌倒后又重新站起来的次数来评判我。\n——纳尔逊·曼德拉，1965年"
 LOADING_TIP_7:0 "§T争取自由的斗争必须继续下去，直到胜利为止；在我们的国家作为人类共同体的一员，获得自由、幸福与和平之前，我们不能停歇。\n——奥利弗·坦博，1960年"
 LOADING_TIP_8:0 "§T我就知道南非必将改变；你不可能永远压制人民。\n这不合常理。总有什么东西必须打破，而它也确实打破了。\n——莱塔·姆布鲁，1965年"
 LOADING_TIP_9:0 "§T问问任何人他更愿做哪国人，一百个人里有九十九个\n会告诉你，他们更愿做英国人。\n——塞西尔·罗得斯，1898年"
 LOADING_TIP_10:0 "§T荷兰人厌恶英国统治的真正根源是什么？是他们对那场旨在让土著与白人平起平坐的运动所怀有的深切恐惧与仇恨。\n——温斯顿·丘吉尔，1900年"
 LOADING_TIP_11:0 "§T在欧洲人的社会中，没有土著能超越从事某些体力劳动的位置。教土著孩子数学有什么用呢？他们根本用不上。这简直荒谬至极。\n——亨德里克·维沃尔德，1960年"
 LOADING_TIP_12:0 "§T我一直认为，南非经济的快速发展从长远来看，将被证明与政府的种族政策不相容，而最近发生的事件更印证了我的看法。\n——哈里·奥本海默，1962年"
 LOADING_TIP_13:0 "§T有时候，西装穿得太久，会改变你的意识形态。\n——乔·斯洛沃，1971年"
 LOADING_TIP_14:0 "§T响应你的召唤，我们绝不退缩，坚定而稳固地屹立。\n无论生死皆遵从你的意志，啊，南非，我亲爱的土地！\n——科尼利厄斯·兰根霍文，1918年"
 LOADING_TIP_15:0 "§T这片土地非常迷人，位置优越；我们看见许多牛群在土地上四处游荡；我们越往前走，土地就越是肥沃，树丛也越发高大。\n——阿尔瓦罗·维利奥，1497年"
 LOADING_TIP_16:0 "§T南非并不是一只水母，在许多方面，它更像一柄剑鱼。\n——P.W.博塔，1981年"
 LOADING_TIP_17:0 "§T当道路变得晦暗时便轻言放弃的，是为失信之人。\n——J.R.R.托尔金，1954年"
 LOADING_TIP_18:0 "§T烬中火复燃，影中光华绽；\n断刃得重铸，无冕者再为王。\n——J.R.R.托尔金，1954年"
 LOADING_TIP_19:0 "§T电视对社会有着极其负面的影响，必须不惜一切代价加以遏制。错误的画面会对儿童和发展程度较低的种族造成巨大的破坏。\n——阿尔伯特·赫尔佐格，1958年"
 LOADING_TIP_20:0 "§T每个人都会犯错。\n——伊恩·史密斯，1979年"
 LOADING_TIP_21:0 "§T为拥有自我这项特权，付出任何代价都不算太高。\n——拉迪亚德·吉卜林，1901年"
 LOADING_TIP_22:0 "§T南非的进步取决于标准的维持，我相信，为了我们作为受托人而对其负责的、广大尚未受教育的黑非洲人，我们有责任确保南非现有的标准不被贬低。\n——帕特里克·沃尔爵士议员，1960年"
 LOADING_TIP_23:0 "§T我们并不信奉那种主张人人“平等”的教条式断语，但我们确实坚持，每个公民都有权获得对其尊严的同等尊重。\n——进步党传单，1967年"
 LOADING_TIP_24:0 "§T我非常清楚地知道，我在党卫军里是要做什么的。\n——汉斯·许蒂希，1964年"
 LOADING_TIP_25:0 "§T仅凭人格力量来领导雇佣兵部队，需要一种硬朗的品性和对自身战无不胜的信念，而我并不具备这些。我当时不得不临场做出那副样子。那是一种铸炼，而我并不后悔。\n——迈克·霍尔，1969年"
 LOADING_TIP_26:0 "§T布尔人的军事素质很有用，但并不张扬。它们源于本能，而非后天习得，这些都难以被充分解释为经验的产物。\n——《布尔战争手册》，1910年"
 LOADING_TIP_27:0 "§T民主，如同幼苗，不会自己生长或发展。若要珍视它，就必须信仰并践行它。而若要它存续，就必须为它奋斗和捍卫。\n——塞雷茨·卡马，1978年"
 LOADING_TIP_28:0 "§T殖民地是德国所需要的。若有可能，我们就通过谈判取得；\n如若不能，我们便强夺。\n——亚尔马·沙赫特，1943年"
 LOADING_TIP_29:0 "§T自1910年以来，斗争就一直是这个：一个共和国，与君主制的联系相对立……\n我们毫不含糊且旗帜鲜明地主张，要以正确的方式，在适当的时机，建立起共和国。\n——亨德里克·维沃尔德，1958年"
 LOADING_TIP_30:0 "§T你们为何要惧怕选举权的行使？我宁愿在市政厅遇到正在投票选举他代表的土著，也不愿在荒野中看到他肩扛着枪。\n——威廉·波特，1854年"
 LOADING_TIP_31:0 "§T这些便是民主的灯火——无论语言、种族或肤色，让它们成为这个国家人民慰藉的源泉。它们以那些战斗过并活下来的人的名义，以那些战斗过并牺牲的人的名义，向南非人民传递着一个信息。\n——阿道夫·“水手”·马兰，1951年"
 LOADING_TIP_32:0 "§T不论一个人对南非怀抱何种愿景，首先必须做的事就是摧毁种族主义。\n——乔·斯洛沃，1969年"
 LOADING_TIP_34:0 "§T如果我能，我会把那些星球也吞并了；我经常这样想。\n看它们如此清晰，却又如此遥远，真令我伤感。\n——塞西尔·罗得斯，1888年"
 LOADING_TIP_33:0 "§T对于那些说殖民主义坏话的人，我要说，殖民主义是件美妙的事。它将文明传播到了非洲。在此之前，他们没有书面语言，没有我们所说的车轮，没有学校，没有医院，甚至没有正常的衣物。\n——伊恩·史密斯，1974年"
 LOADING_TIP_35:0 "§T荷兰人并非抢夺他人财产的族类，他们渴望与所有民族友好相处，并与之通商。\n——扬·范里贝克，1657年"
 LOADING_TIP_36:0 "§T我们的运动建立在元首原则之上，在与帝国、资本家、共产主义者、犹太人、政党和议会制度的斗争中，以我们大日耳曼国所确立的国家社会主义为基础。\n——约翰内斯·范伦斯堡，1944年"
 LOADING_TIP_37:0 "§T我们尚未拥有整体，我们尚未拥有一个真正统一的南非，我们尚未达到我们所向往的那种团结。在我们的国家构成中，旧有的分裂与分离依然四处可见，但努力毕竟已经付出。\n——扬·史末资，1940年"
 LOADING_TIP_38:0 "§T那种认为必须将所有土著人迁走并关在他们自己村子里的想法，依我看，是我这辈子听过的最大的蠢话。\n——扬·史末资，1947年"
 LOADING_TIP_39:0 "§T我们，在此署名之人，纳塔尔的男女，仁慈的女王伊丽莎白二世陛下忠实的臣民，在此以庄严的盟约宣誓，在这受威胁的灾祸时刻，我们定当团结一致，捍卫王冠。\n——《纳塔尔盟约》，1962年"
 LOADING_TIP_40:0 "§T君主制拥有这样一大好处：它为我们提供了一个象征，一种我们所有人都能视作我们民族团结与社会形态直观体现的象征——一个与真实政治权力中心分离的国家元首。\n——A.L.罗斯，1944年"
 LOADING_TIP_41:0 "§T南非的命运取决于这一关键点。如果黑人永久居住在白人区的原则被接受，那么这便是在我们国家所知的文明的终结之始。\n——P.W.博塔，1974年"
 LOADING_TIP_42:0 "§T历史，如同美貌，很大程度上取决于观赏者的眼光。因此，当你读到，比如，戴维·利文斯通发现了维多利亚瀑布时，你或许情有可原地以为，在利文斯通到来之前，瀑布旁空无一人。\n——德斯蒙德·图图，1981年"
 LOADING_TIP_43:0 "§T我无意去捡拾某个自视为我主人的人从桌子上扔下来的怜悯的残屑。我要的是权利的完整菜单。\n——德斯蒙德·图图，1973年"
 LOADING_TIP_44:0 "§T在不公正的情境下，你若保持中立，便已选择了压迫者的一方。\n——德斯蒙德·图图，1973年"
 LOADING_TIP_45:0 "§T只有一种因素能够击垮阿非利卡人……那就是阿非利卡人自己。\n——P.W.博塔，1984年"
 LOADING_TIP_46:0 "§T在此血河之畔，你立于神圣之地。就在这里，曾作出关乎南非未来、关乎我们土地上的基督教文明、关乎白种人的存续和肩负责任之权力的伟大决定。\n——D.F.马兰，1938年"
 LOADING_TIP_47:0 "§T我们必须确保，后代将我们作为英雄与爱国者来谈论，而非当作不经一战便拱手让出遗产的懦夫。我们必须坚持到底，直到那苦涩的尽头。我必将如此。\n——马蒂纳斯·斯泰恩，1901年"
 LOADING_TIP_48:0 "§T政府不会被吓倒。已下令不惜一切代价维持秩序。\n——巴尔萨泽·沃斯特，1976年6月18日"
 LOADING_TIP_49:0 "§T当我们研究英帝国的命运时，我们止不住地想到，它与其说是人类的成就，不如说是推动人类进步的天意之工具。\n——斯坦利·鲍德温，1929年"
 LOADING_TIP_50:0 "§T土著应如孩童般对待，并剥夺选举权。我们在与南非的蛮荒打交道时，必须采取一种专制制度，如在印度行之有效的那种。\n——塞西尔·罗得斯，1900年"
 LOADING_TIP_51:0 "§T牛车哨兵认为，一个德国的胜利是阿非利卡人人民共和国得以诞生的显见条件。解放只能因德国在欧洲的胜利而发生。\n——《祖国报》，1942年8月8日"
 LOADING_TIP_52:0 "§T有一群跳梁小丑正试图把街头的“平底荷兰语”简化成一种书面语并让其永久存在。他们办有一份报纸，出版了一本殖民地史，而最滑稽的是——一本语法书。\n——《开普敦新闻》，1876年"
 LOADING_TIP_53:0 "§T这些将是我付诸笔端的最后语话。至死忠于你的传统、你的宗教、你的语言和你的人民。上帝与你同在，直至我们再相见。\n——约瑟夫·傅里，1914年12月20日"