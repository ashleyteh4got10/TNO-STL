l_simp_chinese:
 SUR_add_uncategorised_law_tt: "§F[GetAssortedLawsSUR]将添加到我们的杂项法律中。§!"
 SUR_remove_uncategorised_law_tt: "§F[GetAssortedLawsSUR]将从我们的杂项法律中删除。§!"
 SUR_get_law_tooltip: "[GetAssortedLawsDescSUR]"
 SUR_de_taalwet_law: "£GFX_SUR_de_taalwet_texticon §u《语言法案》§!"
 SUR_de_taalwet_law_desc: "§F£GFX_SUR_de_taalwet_texticon §u《语言法案》§!是一系列旨在拯救£GFX_SUR_netherlands_texticon §O荷兰语§!及荷兰文化免于消亡的法律。该法案将§l苏里南§!和§&安的列斯群岛§!的城镇、河流及地区重命名为具有爱国色彩的£GFX_SUR_netherlands_texticon §O荷兰式§!名称，规定了新生儿可使用的姓名清单，并对口语和书面语形式进行了标准化。\n仅£GFX_SUR_belgium_luxemburg_texticon §U比利时-卢森堡§!地区不受该法案影响，享有自主立法权与语言自治权。\n\n£GFX_SUR_de_taalwet_texticon §u《语言法案》§!中最具争议的部分当属£GFX_SUR_inlander_texticon §Z《援助民法典》§!，该法典规定任何不符合文化标准者将自动成为二等公民。尽管遭到强烈反对，由弗斯特纳政府实施的这部法典始终未被废除，其适用范围不仅涵盖新政权建立前就居住在§l苏里南§!的群体，还包括所有移居该国的移民，使得法典的存续日益难以维系。§!"
 SUR_1947_constitutional_revision_law: "£GFX_SUR_1947_constitution_texticon §P1947年宪法修订§!"
 SUR_1947_constitutional_revision_law_desc: "§F当£GFX_SUR_netherlands_texticon §O荷兰王国§!的流亡政府抵达§l苏里南§!时，他们发现这片新土地无法实现稳定，最终导致了“红色星期二”事件。因此，1947年£GFX_SUR_wilhelmina_texticon §J威廉明娜女王§!介入并强制推行宪法改革，旨在将留在§s旧大陆§!的王国制度重新引入，使£GFX_SUR_netherlands_texticon §O荷兰§!至少在理论上成为所有居民共有的国家。\n\n通过在§l苏里南§!全境重新划分选区并恢复选举，£GFX_SUR_1947_constitution_texticon §P1947年宪法修订§!表面上恢复了£GFX_SUR_netherlands_texticon §O荷兰人§!早已习惯的民主制度，并将其扩展到全体民众。\n\n然而随着时间的推移，这次修订几乎未能兑现其承诺。£GFX_SUR_inlander_texticon §Z《原住民法典》§!剥夺了许多人的民主参与权；加之£GFX_SUR_nvb_texticon §g国家统一党§!崛起成为垄断性政党，侵蚀了制度根基和民众对政府的信任，导致反对派强烈要求再次进行宪法修订。§!"
 SUR_princedom_of_belgium_luxemburg_law: "£GFX_SUR_belgium_luxemburg_texticon §U比利时-卢森堡自治王国§!"
 SUR_princedom_of_belgium_luxemburg_law_desc: "§F由于领土尽失于§o德国人§!之手，£GFX_SUR_netherlands_texticon §O荷兰王国§!决定与流亡在外的£GFX_SUR_belgium_texticon §Y比利时§!及£GFX_SUR_luxemburg_texticon §*卢森堡§!政府谈判，将部分土地交由他们治理，以此作为对同胞的善意之举。\n\n1949年签署协议后，£GFX_SUR_belgium_luxemburg_texticon §U比利时-卢森堡自治王国§!在科珀纳姆河西岸的土地上成立，该地区更名为“西圩田”。\n\n得益于经济奇迹，£GFX_SUR_belgium_luxemburg_texticon §U比利时-卢森堡§!已不仅是一个附庸，而是成为了£GFX_SUR_netherlands_texticon §O荷兰诸王国§!新体系中不可或缺的一部分。§!"
 SUR_dutch_social_corporatism_law: "§O荷兰§!£GFX_SUR_factory_texticon §X社会法团主义§!"
 SUR_dutch_social_corporatism_law_desc: "§F从零开始重建经济的£GFX_SUR_netherlands_texticon §O荷兰§!选择了£GFX_SUR_corporatism_texticon §.法团主义§!，与£GFX_SUR_unions_texticon §V工会§!和§g企业§!携手共进，朝着经济稳定与持续繁荣的共同目标迈进。\n\n然而，并非所有人都认同£GFX_SUR_corporatism_texticon §.法团主义§!，有些人更倾向于采用§B技术官僚§!甚至§m自由主义§!的方式来重现50年代的经济奇迹。\n\n对支持现行体系的人而言幸运的是，两种方案皆未被采纳。相反，在沃斯和霍夫斯特拉的精心引导下，荷兰走上了更具£GFX_SUR_factory_texticon §X社会主义§!色彩的道路——建立了一个经济为人民服务，而非人民受经济奴役的体系。§!"
 SUR_dutch_brazilian_friendship_treaty_law: "£GFX_SUR_netherlands_texticon §O荷兰§! §g-§! £GFX_SUR_brazil_texticon §K巴西§! §E友好条约§!"
 SUR_dutch_brazilian_friendship_treaty_law_desc: "§F1954年，由时任£GFX_SUR_netherlands_texticon §O荷兰§!首相迪尔克·斯蒂克与£GFX_SUR_brazil_texticon §K巴西§!总统爱德华多·戈梅斯签署的§E圭亚那合作开发条约§!，构成了两国现代关系的基石。\n\n初期合作主要集中在£GFX_SUR_netherlands_texticon §O荷兰§!对£GFX_SUR_cayenne_texticon §Q卡宴行政区§!的投资，随着£GFX_SUR_brazil_texticon §K巴西§!移民涌入\n£GFX_SUR_netherlands_texticon §O荷兰§!，两国关系日益紧密，军事合作与联合开发项目逐渐成为常态。§!"
 SUR_supremacy_of_the_navy_law: "§D军队状况：§!\n£GFX_SUR_navy_texticon §s海军占绝对地位§!"
 SUR_supremacy_of_the_navy_law_desc: "§F在退守§&加勒比地区§!后，§b荷兰皇家陆军§!沦为了一支残余部队。随着§A自由国家组织§!的成立，这支可悲部队残存的经济希望也被彻底扼杀。在随后的岁月里，§b荷兰皇家陆军§!持续遭受冷落，而其姊妹部队\n£GFX_SUR_navy_texticon §s荷兰皇家海军§!却蓬勃发展。\n\n凭借强大的£GFX_SUR_netherlands_texticon §O荷兰§!舰队——这支§&加勒比地区§!最庞大的海上力量，§g海军陆战队§!已成为我国的作战主力，随时准备劈波斩浪打击任何再度威胁我国的敌人，并通过更“强硬”的手段扩展我们的势力范围。§!"