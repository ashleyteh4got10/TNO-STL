l_simp_chinese:
 SE_SECOND_WEST_RUSSIAN_WAR: "第二次西俄战争"
 SE_SECOND_WEST_RUSSIAN_WAR_D: "在战争中，俄罗斯人都穿上了纯洁的白衫。他生前也许带着原罪，但死时会无比圣洁。\n- 瓦西里·格罗斯曼"
 SE_SECOND_WEST_RUSSIAN_WAR_A: "欧洲的终焉之战"
 SWRW_SE_SECOND_WEST_RUSSIAN_WAR: "第二次西俄战争"
 SE_GENERIC_RUSSIAN_VICTORY: "俄罗斯胜利"
 SE_GENERIC_RUSSIAN_VICTORY_D: "要成为最伟大的人，就不要让任何敌人或盟友超过你，并永远为胜利和伟大而奋斗。\n- 德米特里·拉夫里年科"
 SE_GENERIC_RUSSIAN_VICTORY_A: "俄罗斯浴火重生"
 SWRW_SE_GENERIC_RUSSIAN_VICTORY: "俄罗斯胜利"
 SE_TOTAL_GERMAN_VICTORY: "德国胜利"
 SE_TOTAL_GERMAN_VICTORY_D: "我们已经承受了很多。我们还要承受更多。感谢上帝让我们年轻。\n- 约瑟夫·戈培尔"
 SE_TOTAL_GERMAN_VICTORY_A: "堕入黑暗"
 SWRW_SE_TOTAL_GERMAN_VICTORY: "德国胜利"
 SE_OMSK_WAR: "大审判"
 SE_OMSK_WAR_D: "神為他行了何等的大事！\n- 民数记 23:23"
 SE_OMSK_WAR_A: "终局"
 SWRW_SE_OMSK_DECLARATION: "大审判"
 SE_SHUKSHIN_WAR: "第二次西俄战争"
 SE_SHUKSHIN_WAR_D: "这个世界上的强者会知道一切：羞耻、折磨，自我判断，和敌人的喜悦。\n- 瓦西里·舒克申"
 SE_SHUKSHIN_WAR_A: "前进，俄罗斯！"
 SWRW_SE_SHUKSHIN_DECLARATION: "第二次西俄战争"
 SE_POKRYSHKIN_WAR: "俄罗斯的复仇"
 SE_POKRYSHKIN_WAR_D: "环境越舒适，勇气就越少。\n- 亚历山大·苏沃洛夫"
 SE_POKRYSHKIN_WAR_A: "前进，俄罗斯！"
 SWRW_POKRYSHKIN_DECLARATION: "第二次西俄战争"
 SE_SHUKSHIN_VICTORY: "俄罗斯联邦胜利"
 SE_SHUKSHIN_VICTORY_D: "他们为祖国而战。他们拯救了祖国。他们胜利了。\n- 瓦西里·舒克申"
 SE_SHUKSHIN_VICTORY_A: "希望不止"
 SE_POKRYSHKIN_VICTORY: "俄罗斯联邦胜利"
 SE_POKRYSHKIN_VICTORY_D: "以能力取胜，而不是靠人数。\n- 亚历山大·苏沃洛夫"
 SE_POKRYSHKIN_VICTORY_A: "实力得以展现"
 SWRW_SE_POKRYSHKIN_VICTORY: "俄罗斯联邦获胜"
 SE_VELMIR_WAR: "诸神黄昏"
 SE_VELMIR_WAR_D: "你必须准备好沐浴在你自身的烈焰之中：你怎么可能重生呢，如果你不先化为灰烬？\n- 弗里德里希·尼采"
 SE_VELMIR_WAR_A: "斯瓦罗格觉醒"
 SE_ZHUKOV_DECLARATION: "赤色黎明行动"
 SE_ZHUKOV_DECLARATION_D: "如果德国人进攻，我们将进行防御。如果他们在冬天到来之前不进攻，那么我们将把他们撕成碎片！\n- 格奥尔基·朱可夫"
 SE_ZHUKOV_DECLARATION_A: "联盟向前进"
 SWRW_SE_ZHUKOV_DECLARATION: "§x赤色黎明§!行动"
 SE_TUKH_DECLARATION: "第二次伟大的卫国战争"
 SE_TUKH_DECLARATION_D: "毫无疑问，如果我们当初在维斯瓦河打赢了的话，革命就可以在整个欧洲形成燎原之势。\n- 米哈伊尔·图哈切夫斯基"
 SE_TUKH_DECLARATION_A: "元帅归来"
 SWRW_SE_TUKH_DECLARATION: "第二次伟大的卫国战争"
 SE_ZHDANOV_DECLARATION: "第二次伟大的卫国战争"
 SE_ZHDANOV_DECLARATION_D: "大敌当前，生死攸关。\n- 安德烈·日丹诺夫"
 SE_ZHDANOV_DECLARATION_A: "前进！"
 SWRW_SE_ZHDANOV_DECLARATION: "第二次伟大的卫国战争"
 SE_SUSLOV_WAR: "第二次伟大的卫国战争"
 SE_SUSLOV_WAR_D: "社会党人不同一切民族压迫作斗争，就不能达到自己的伟大目的。\n——弗拉基米尔·列宁"
 SE_SUSLOV_WAR_A: "最宏大的棋局"
 SWRW_SE_SUSLOV_WAR: "第二次伟大的卫国战争"
 SE_SBA_WAR: "无政府主义者的进军"
 SE_SBA_WAR_D: "只要我们大家有决心，我们马上就可以把正义建立起来：地上的一切暴君都会跪倒在我们的脚下！\n- 彼得·克鲁泡特金"
 SE_SBA_WAR_A: "为了安那其妈妈"
 SE_SEROV_WAR: "第二次伟大的卫国战争"
 SE_SEROV_WAR_D: "我们必须从右派那里学到没有资本主义的民族主义，从左派那里学到没有国际主义的社会主义。\n- 格雷戈尔·施特拉塞"
 SE_SEROV_WAR_A: "巨人之争"
 SE_EURASIA_WAR: "大欧亚战争"
 SE_EURASIA_WAR_D: "除非完成任务，否则不会有任何价值。\n- 成吉思汗"
 SE_EURASIA_WAR_A: "浴火重生"
 SE_KAGANOVICH_WAR: "第二次伟大的卫国战争"
 SE_KAGANOVICH_WAR_D: "必须让每一个德国士兵都感觉到，他是生活在俄罗斯人的枪口之下。\n- 瓦西里·崔可夫"
 SE_KAGANOVICH_WAR_A: "绝不后退一步！"
 SE_WERBELL_WAR:0 "合众国入侵莫斯科"
 SE_WERBELL_WAR_D:0 "我不在乎会不会被人记住。如果非要我被人记住的话，我希望在别人眼中我是一个好军官和爱国者。\n- 米切尔·韦贝尔三世"
 SE_WERBELL_WAR_A:0 "战争万岁！"
 SE_WERBELL_VICTORY:0 "俄罗斯合众国胜利"
 SE_WERBELL_VICTORY_D:0 "有很多事情我不想说。我去过那么多的地方，跨越那么多的国家，经历过那么多的革命，而这些记忆都开始模糊。\n- 米切尔·韦贝尔三世"
 SE_WERBELL_VICTORY_A:0 "胜利的荣耀"
 SE_WERBELL_VICTORY_DESPOT:0 "俄罗斯合众国胜利"
 SE_WERBELL_VICTORY_DESPOT_D:0 "要么天堂，要么地狱，你必须选一个。\n- 未知"
 SE_WRRF_VICTORY_ZHUKOV:0 "苏维埃联盟胜利"
 SE_WRRF_VICTORY_ZHUKOV_D:0 "对我来说，为祖国、为自己的人民服务是主要的。我可以问心无愧地说：我为尽自己的天职贡献了一切。\n- 格奥尔基·朱可夫"
 SE_WRRF_VICTORY_ZHUKOV_A:0 "联盟重生"
 SE_RED_NAPOLEON_VICTORY:0 "苏维埃联盟胜利"
 SE_RED_NAPOLEON_VICTORY_D:0 "……我告诉自己，三十岁时我要么成为英雄，要么到那时我已不在人世。\n——米哈伊尔·图哈切夫斯基"
 SE_RED_NAPOLEON_VICTORY_A:0 "无敌与传奇"
 SE_BATOV_WAR:0 "伟大的俄罗斯解放战争"
 SE_BATOV_WAR_D:0 "想要打败敌人，就要怀着与他们同归于尽的觉悟。谁越不怕死，谁就能获胜。\n- 亚历山大·苏沃洛夫"
 SE_BATOV_WAR_A:0 "拯救俄罗斯！"
 SE_VYATKA_LIB_WAR:0 "帝国的复兴之战"
 SE_VYATKA_LIB_WAR_D:0 "宁可从上而下废除农奴制，也不要等它开始从下而上废除自己。\n- 亚历山大二世"
 SE_VYATKA_LIB_WAR_A:0 "天佑俄罗斯"
 SE_VYATKA_AUTH_WAR:0 "帝国的复兴之战"
 SE_VYATKA_AUTH_WAR_D:0 "人间没有正义。\n- 尼古拉二世"
 SE_VYATKA_AUTH_WAR_A:0 "天佑帝国！"
 SE_VYATKA_CON_WAR:0 "帝国的复兴之战"
 SE_VYATKA_CON_WAR_D:0 "我主上帝，天佑罗斯，祈福圣母，护国安宁。\n- 尼古拉二世"
 SE_VYATKA_CON_WAR_A:0 "天佑沙皇！"
 SE_VAGNER_WAR:0 "雅利安霸权之战"
 SE_VAGNER_WAR_D:0 "在这个世界上不可能有两个聪明的种族。我们将赢得这场战争，只有雅利安种族将屹立于世界之巅。\n- 约瑟夫·门格勒"
 SE_VAGNER_WAR_A:0 "以火洗礼"
 SE_BUNYACHENKO_WAR:0 "俄罗斯人的反击"
 SE_BUNYACHENKO_WAR_D:0 "那些给我们平静的生活和家庭带来浩劫的法西斯混蛋，现在正被我们左右开弓地打回去。\n- 安德烈·弗拉索夫"
 SE_BUNYACHENKO_WAR_A:0 "军队，前进！"
 SE_ZYKOV_WAR:0 "俄罗斯人的反击"
 SE_ZYKOV_WAR_D:0 "我们低估了俄国巨人……\n- 弗朗茨·哈尔德"
 SE_ZYKOV_WAR_A:0 "一九四六年的复仇"
 SE_MANDATE_WAR:0 "东正教复兴之战"
 SE_MANDATE_WAR_D:0 "在你身旁虽倒毙一千，在你右边虽跌仆一万，疫疾却到不了你身边。\n- 圣咏集 91:7"
 SE_BUKHARINA_WAR:0 "第二次西俄战争"
 SE_BUKHARINA_WAR_D:0 "社会主义的胜利并不是命中注定要从天而降的。\n- 罗莎·卢森堡"
 SE_BUKHARINA_WAR_A: "向解放前进"
 SE_KOMI_LIBDEM_WAR:0 "第二次西俄战争"
 SE_KOMI_LIBDEM_WAR_D:0 "随时会出现像希特勒这种人，随时有可能发生我们意料不到的事。一旦发生这种事情，我们再也无法维护地球上的文明。\n- 阿列克谢·柯西金"
 SE_KOMI_LIBDEM_WAR_A: "为了共和国！"
 SE_KOMI_SOCDEM_WAR:0 "第二次西俄战争"
 SE_KOMI_SOCDEM_WAR_D:0 "杀戮的冲动，就像生育的冲动一样，盲目而邪恶。它今天针对一只野兔的肉：明天它同样会为一个人的肉而嚎叫。\n- 安德烈·沃兹涅先斯基"
 SE_KOMI_SOCDEM_WAR_A: "为了人民"
 SE_AMUR_WAR:0 "伟大的斯拉夫复兴战争"
 SE_AMUR_WAR_D:0 "我们正在见证欧洲从该隐和路西法的后裔，真正的魔鬼之子那里解放出来的壮丽景象。\n- 康斯坦丁·罗扎耶夫斯基"
 SE_AMUR_WAR_A:0 "元首指引我们前进"
 SE_CORNMAN_WAR:0 "第二次伟大的卫国战争"
 SE_CORNMAN_WAR_D:0 "在核战争中，不会有胜者或败者。交战双方必将同归于尽。\n- 尼基塔·赫鲁晓夫"
 SE_CORNMAN_WAR_A:0 "更进一步"
 SE_YURIY_WAR:0 "帝国的复兴之战"
 SE_YURIY_WAR_D:0 "主啊，裁决那些冒犯我的人，并保护我免受那些与我为敌的人的伤害。挺身而出，拿起武器，保护我并站在我一边。\n- 亚历山大·涅夫斯基"
 SE_YURIY_WAR_A:0 "前进，神圣俄罗斯！"
 SE_LYDIA_WAR:0 "帝国的复兴之战"
 SE_LYDIA_WAR_D:0 "胜利者不受审判。\n- 叶卡捷琳娜大帝"
 SE_LYDIA_WAR_A:0 "前进，强大的俄罗斯！"
 SE_MODERNIST_WAR:0 "第二次西俄战争"
 SE_MODERNIST_WAR_D:0 "我们不应轻视我们所做的一切，在这个世界上，我们就像黑暗中的微光一样出现了。\n- 安德烈·萨哈罗夫"
 SE_MODERNIST_WAR_A:0 "为了荣耀！"
 SE_DECEMBERIST_WAR:0 "第二次西俄战争"
 SE_DECEMBERIST_WAR_D:0 "当前一直被认为是俄罗斯处于危机状态的时期。这是俄罗斯历史的典型特征。\n-  德米特里·利哈乔夫"
 SE_DECEMBERIST_WAR_A:0 "奋斗与责任"
 SE_BASTILLARD_WAR:0 "第二次西俄战争"
 SE_BASTILLARD_WAR_D:0 "每个俄罗斯人都有义务履行公共职责，遵守祖国的法律和当局，并在法律要求时保卫祖国。\n- 尼基塔·穆拉耶夫"
 SE_BASTILLARD_WAR_A:0 "铁与血"
 SE_HUMANIST_WAR:0 "第二次西俄战争"
 SE_HUMANIST_WAR_D:0 "一个人感到失望，那意味着他仍然对某种事物怀着信念。\n- 德米特里·肖斯塔科维奇"
 SE_HUMANIST_WAR_A:0 "俄罗斯的渐强音"
 SE_CHITA_VICTORY:0 "俄罗斯帝国复兴"
 SE_CHITA_VICTORY_D:0 "俄罗斯的旗帜一旦升起，就不会再落下。\n- 尼古拉一世"
 SE_MOKER_BRANDT:0 "维利·勃兰特将大麻合法化"
 SE_MOKER_BRANDT_D:0 "你以前抽过大麻吗，舒克申？\n- 抽着烟的勃兰特"
 SE_IRKUTSK_WAR:0 "第二次伟大的卫国战争"
 SE_IRKUTSK_WAR_D:0 "在与资本进行的血腥斗争中，工人阶级不能拒绝对资本的处决。\n- 尼古拉·布哈林"
 SE_IRKUTSK_WAR_A:0 "清算旧帐"
 SE_SABLIN_AUTH_WAR:0 "第二次伟大的卫国战争"
 SE_SABLIN_AUTH_WAR_D:0 "革命并非一帆风顺之事。革命是未来与过去之间的生死搏斗。\n- 菲德尔·卡斯特罗"
 SE_SABLIN_AUTH_WAR_A:0 "革命之火"
 SE_SABLIN_LIB_WAR:0 "第二次伟大的卫国战争"
 SE_SABLIN_LIB_WAR_D:0 "压迫其他民族的民族能不能获得解放呢？不能。\n- 弗拉基米尔·列宁"
 SE_SABLIN_LIB_WAR_A:0 "重燃战火"
 SE_MATKOVSKY_WAR:0 "第二次西俄战争"
 SE_MATKOVSKY_WAR_D:0 "俄国可以没有我们中间的任何一位，可是我们中间的任何人都不可以没有俄国。谁这么想就会倒霉，谁这么做就会倒大霉。\n- 伊凡·屠格涅夫"
 SE_MATKOVSKY_WAR_A:0 "为了俄罗斯的荣耀"
 SE_PETLIN_WAR:0 "俄罗斯解放战争"
 SE_PETLIN_WAR_D:0 "你们即将踏上伟大的十字军远征。全世界的目光都聚焦在你们身上。各地热爱和平的人们的期望与祈祷伴随着你们。\n- 德怀特·D·艾森豪威尔将军"
 SE_PETLIN_WAR_A:0 "自由在召唤"
 SE_STALINA_WAR:0 "第二次西俄战争"
 SE_STALINA_WAR_D:0 "是人性决定着世界的走向，而非政府和体制。\n- 斯维特兰娜·斯大林娜"
 SE_STALINA_WAR_A:0 "为了国家"
 SE_YELTSIN_WAR:0 "伟大的俄罗斯解放战争"
 SE_YELTSIN_WAR_D:0 "这意味着我们最终需要至少一次胜利，仅仅一次，为我们所有人而战。\n- 布拉特·奥库扎瓦"
 SE_YELTSIN_WAR_A:0 "为了自由俄罗斯"
 SE_SHAFAREVICH_WAR:0 "第二次西俄战争"
 SE_SHAFAREVICH_WAR_D:0 "任何性质、任何程度的民族社会主义都将导致人性的彻底毁灭甚至人类的灭亡。\n- 伊戈尔·沙法列维奇"
 SE_SHAFAREVICH_WAR_A:0 "一个民族的斗争"
 SE_OKTAN_WAR:0 "混账战争"
 SE_OKTAN_WAR_D:0 "赚钱的方法就是在街头巷尾血流成河的时候买入。\n- 约翰·D·洛克菲勒"
 SE_OKTAN_WAR_A:0 "财富与荣耀"
 SE_SECOND_GERMAN_CIVIL_WAR:0 "第二次德国内战"
 SE_SECOND_GERMAN_CIVIL_WAR_D:0 "总有一天，所有的谎言将在它们自身的重量下崩塌，真理将再次获胜。\n- 约瑟夫·戈培尔"
 SE_SECOND_GERMAN_CIVIL_WAR_A:0 "我们迷失了……"
 SE_DEM_GERMAN_VICTORY:0 "民主派获胜"
 SE_DEM_GERMAN_VICTORY_D:0 "和自由一样，和平并非从一开始就存在；从最真实的意义上讲，我们必须创造和平。\n- 维利·勃兰特"
 SE_DEM_GERMAN_VICTORY_A:0 "自由"
 SE_HARDLINER_COMMIE_VICTORY:0 "共产主义者大获全胜"
 SE_HARDLINER_COMMIE_VICTORY_D:0 "明天革命将在“磨刀擦枪声中再次兴起”，吹响令你们惊惶失措的号角，宣告：我来过，我又来到，我还将重临！\n- 罗莎·卢森堡"
 SE_HARDLINER_COMMIE_VICTORY_A:0 "1919年的屈辱得以洗雪"
 SE_MILITARY_VICTORY:0 "国防军大获全胜"
 SE_MILITARY_VICTORY_D:0 "这就是现实的报复。\n- 海因茨·古德里安"
 SE_MILITARY_VICTORY_A:0 "梦想成真！"
 SE_FREIKORPS_VICTORY:0 "自由军团大获全胜"
 SE_FREIKORPS_VICTORY_D:0 "我的举措不会受到任何官僚机构的阻碍。在这里我不在意正义，我的使命只有摧毁和消灭，仅此而已。\n- 赫尔曼·戈林"
 SE_FREIKORPS_VICTORY_A:0 "自由军团，前进！"
 SE_KLOPFER_VICTORY:0 "纳粹党大获全胜"
 SE_KLOPFER_VICTORY_D:0 "今天，一种新的信仰正在兴起……血统的神话，这种信仰与血统一起捍卫着人类整体的神性。 \n- 阿尔弗雷德·罗森堡"
 SE_KLOPFER_VICTORY_A:0 "永远的帝国？"
 SE_GERMAN_SPRING:0 "日耳曼之春"
 SE_GERMAN_SPRING_D:0 "尽管历史可能是苦涩的，但它是现实，每一天都在影响着我们的现在和未来。\n- 维利·勃兰特"
 SE_GERMAN_SPRING_A:0 "变革之风"
 SE_REAL:0 "他妈的什么鬼？"
 SE_REAL_D:0 "我恨你\n- 加里"
 SE_REAL_A:0 "你就得瑟吧，贱人。"
 SE_DUTCH_EXILES_RETURN:0 "荷兰恢复民主"
 SE_DUTCH_EXILES_RETURN_D:0 "愿我能始终忠诚，\n永远做你的仆人，\n驱散我心中苦楚：\n打倒那残酷暴君。\n- 荷兰国歌"
 SE_DUTCH_EXILES_RETURN_A:0 "还是家最好啊。"
 SWRW_SE_VELMIR_WAR: "诸神黄昏"
 SWRW_SE_SBA_WAR: "无政府主义者的进军"
