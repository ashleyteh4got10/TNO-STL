 wrw_war_mechanics_info_tt:0 "§R第二次西俄战争§!无疑将成为人类历史上最血腥、代价最高的战争之一；这场由复仇主义引发的大规模战争，在两个超级大国之间的广阔战线上展开，与以往我们所面临的任何战争都截然不同。\n\n鉴于生命的代价和这类战争的漫长性质，我们需要通过§Y推进前线§!、§Y占领重要城市§!或者通过§Y宣传§!的手段来安抚我们的人民，以确保£GFX_war_exhaustion_texticon 厌战度不会阻碍我们的战争机器。\n\n然而有一个问题；由于两个大国都拥有核武器，我们需要在某些时候限制自己的侵略性，否则£GFX_tension_texticon §R紧张度§!将失去控制。尽管保持一个可控的£GFX_tension_texticon §R紧张度§!水平对于战争可能是有益的，但过高的£GFX_tension_texticon §R紧张度§!将使世界陷入§e核战争§!的风险。\n\n§W和平§!不会通过占领敌方首都来实现；你需要在战略上思考，甚至可能需要向敌人让步以获得你想要的东西。请小心并利用任何可能出现的外交机会，它们可能给你更多的筹码或减少敌人的筹码。"
 wrw_tension_info_tt:0 "£GFX_tension_texticon §R紧张度§!现在为[?WRW_tension_var|R]%\n--------------\n这将对两国同时产生以下影响：\n\n军费支出：[?WRW_tension_25|%Y]\n所需生活消费品：[?WRW_tension_25|%G]\n战争支持度：[?WRW_tension_40|%G]\n可征召人口：[?WRW_tension_20|%G]"
 GER_war_exhaustion_info_tt:0 "§g德国§!当前的厌战度为[?GER.WRW_war_exhaustion]%\n-------------\n这将给予他们以下减益效果：\n\n单位攻击：[?GER.WRW_war_exhaustion_50|R%]\n单位速度：[?GER.WRW_war_exhaustion_25|R%]\n组织度恢复：[?GER.WRW_war_exhaustion_25|R%]\n计划速度：[?GER.WRW_war_exhaustion_50|R%]\n战争支持度：[?GER.WRW_war_exhaustion_100|R%]\n稳定度：[?GER.WRW_war_exhaustion_100|R%]\n工厂产出：[?GER.WRW_war_exhaustion_50|R%]\n建造速度：[?GER.WRW_war_exhaustion_50|R%]\n年度GDP增长率因素：[?GER.WRW_war_exhaustion_50|R%]"
 RUS_war_exhaustion_info_tt:0 "§B俄罗斯§!当前的厌战度为[?RUS.WRW_war_exhaustion]%\n-------------\n这将给予他们以下减益效果：\n\n单位攻击：[?RUS.WRW_war_exhaustion_50|R%]\n单位速度：[?RUS.WRW_war_exhaustion_25|R%]\n组织度恢复：[?RUS.WRW_war_exhaustion_25|R%]\n计划速度：[?RUS.WRW_war_exhaustion_50|R%]\n战争支持度：[?RUS.WRW_war_exhaustion_100|R%]\n稳定度：[?RUS.WRW_war_exhaustion_100|R%]\n工厂产出：[?RUS.WRW_war_exhaustion_50|R%]\n建造速度：[?RUS.WRW_war_exhaustion_50|R%]\n年度GDP增长率因素：[?RUS.WRW_war_exhaustion_50|R%]"