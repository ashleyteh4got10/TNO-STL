 BFC_explanation_tooltip:0 "[BFC_explanation_sl_tooltip]"
 BFC_explanation_JAP_tooltip: "[CHI.getflag]§M中国§W在赢得了大东亚战争后，不得不选择一边来加入。一方面，在战争时期，§B美国人和§z俄罗斯§W人确实对中国的抗日战争做出了很大贡献——如果没有他们，我们甚至很有可能打不赢这场独立战争。可另一方面，战后§B美§z俄§W却以各自的'鼎力援助'为由，要挟§M中国§W加入他们的阵营，如果他们准备单打独斗，§M中国§W的未来又将蒙上一层阴影。§M中国§W需要握住这只大手——一只来自北方的，慷慨的欧亚守护者所伸出的手——这个慷慨的人名为§z俄罗斯§W。\n\n争夺东亚之战的机制和拍卖类似，§M中国人§W会在各个领域相继提出他希望与§B美§z俄§W两个超级大国合作的议题，议题将包含跨洋旅游业，农产品出口，甚至间谍活动等等。我方和§B美国人§W将轮流赌上政治点数以和§M中国人§W签订有利于己方的条款。如果我们能够持续向中方提供足够大量的投资，我们甚至可以最终推动§M中国§W人正式加人集体安全条约组织。这将让我们得到一个强大的军事盟友，同时使富饶的神州大地牢牢掌握在我们的手中。更重要的是，还能狠狠恶心§B美国§W人，让他们的投资打水漂。根据§M中国§W人所选择的议题不同以及我们的投资多少，§M中国§W人加人集安组织后的相应增益也会不同。\n\n当然，我们也可以在这场小小拍卖中另辟蹊径、兴风作浪。只需少量的的政治点数投资，外交部的外交专家团队就能把§M中国人§W拉向我们这边。比如说，我们可以诽谤§B美国§B制造业，从而让中国人在远离§BOFN§W的同时更加靠近集安组织。当然，§B美国§W人也有可能在暗地里搞这些小把戏，在把中国人拉向我们这边的同时，也要尽量明智地选择花销。"
 BFC_explanation_USA_tooltip: "[CHI.getflag]§M中国§W在赢得了大东亚战争后，不得不选择一边来加入。一方面，在战争时期，§B美国人§W和§z俄罗斯§W人确实对中国的抗日战争做出了很大贡献——如果没有他们，我们甚至很有可能打不赢这场独立战争。可另一方面，战后§B美§z俄§W却以各自的'鼎力援助'为由，要挟§M中国§W加入他们的阵营，如果他们准备单打独斗，§M中国§W的未来又将蒙上一层阴影。§M中国§W需要紧紧握住这支来自已有两世纪的伟大自由民主实践经验的老前辈所伸出的手一一这个老前辈名为山姆大叔。\n\n争夺东亚之战的机制和拍卖类似，§M中国人§W会在各个领域相继提出他希望与§B美§Z俄§W两个超级大国合作的议题，议题将包含跨洋旅游业，农产品出口，甚至间谍活动等等。我方和§z俄罗斯§W人将轮流赌上政治点数以和§M中国人§W签订有利于己方的条款。如果我们能够持续向中方提供足够大量的投资，我们甚至可以最终推动§M中国人§W正式加人OFN。这将让我们得到一个强大的军事盟友，同时使富饶的神州大地牢牢掌握在我们的手中。更重要的是，还能狠狠恶心§z俄罗斯§W人，让他们的投资打水漂。根据§M中国人§W所选择的议题不同以及我们的投资多少，§M中国人§W加人OFN后的相应增益也会不同。\n\n当然，我们也可以在这场小小拍卖中另辟蹊径、兴风作浪。只需少量的的政治点数投资，§B美国§W新闻署的外交专家团队就能把中国人拉向我们这边。比如说，我们可以诽谤§Z俄罗斯§W制造业，从而让§M中国人§W在远离集安组织的同时更加靠近OFN。当然，§z俄罗斯§W人也有可能在暗地里搞这些小把戏，在把中国人拉向我们这边的同时，也要尽量明智地选择花销。"
