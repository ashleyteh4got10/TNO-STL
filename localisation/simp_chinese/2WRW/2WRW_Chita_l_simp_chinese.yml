 CHT_Move_Imperial_Capital:0 "迁移§n帝国首都§!"
 RUS_decisions.2.t:0 "迁都帝都？"
 RUS_decisions.2.desc:0 "在我们正义的旗帜下，神圣的俄罗斯团结一致，帝国内阁的几位成员认为赤塔破旧的城堡已经失去了存在的意义，并提议将帝国政府迁往另一座更适合管理新领土的城市，这也将为即将到来的与德国的战争提供一个更优越的行动基地。经过政府成员之间的激烈讨论和内斗（以及沙皇的个人干预），新首都的问题已经决定了..."
 RUS_decisions.2.a:0 "赤塔暂时仍是俄罗斯帝国的首都"
 RUS_decisions.2.b:0 "新西伯利亚将满足帝国的需要"
 RUS_decisions.2.c:0 "旧罗曼诺夫家族的坟墓将成为新帝国的基石"
 RUS_decisions.2.d:0 "维亚特卡离莫斯科很近"