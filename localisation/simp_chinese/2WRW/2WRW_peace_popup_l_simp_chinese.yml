l_simp_chinese:
 TNO_PEACE_POPUP_FLAVOR_ROMANIA:0 "我不认为今天的罗马尼亚是从我们的父母那里继承来的，而是我们从我们的孩子那里借来的国家。"
 TNO_PEACE_POPUP_FLAVOR_SWRW_OMS:0 "鹰已死。很快，人类也将加入它的行列。"
 TNO_PEACE_POPUP_FLAVOR_HUS:0 "英勇的苏维埃军队取得了胜利，几个世纪的泪水已被洗净！"
 TNO_PEACE_POPUP_FLAVOR_HUD:0 "铁幕背后的火花被扑灭。"
 TNO_PEACE_POPUP_FLAVOR_HUN:0 "我们为你而生，为你而死！斯基泰大军前进，取得了胜利！"
 TNO_PEACE_POPUP_2GCW_GER:0 "万事万物都是由你创造的，甚至包括你自己。"
 TNO_PEACE_POPUP_2GCW_COM:0 "古老又邪恶的资本主义，它来了！"
 TNO_PEACE_POPUP_2GCW_REG:0 "我想成为一名自由战士。"
 TNO_PEACE_POPUP_2GCW_GMA:0 "我呼吁全能的上帝怜悯德国人民。我现在跟随我的子民们，一切都是为了德意志。"
 TNO_PEACE_POPUP_2GCW_SFK:0 "死神也和他们一起欢笑。"
 TNO_PEACE_POPUP_2GCW_SIL:0 "在灿烂的笑容背后，他哭了。"
 TNO_PEACE_POPUP_2GCW_POL:0 "上帝将为如此可怕的罪行报仇。（波兰语）"
 TNO_PEACE_POPUP_2GCW_OZW:0 "几十年来，波兰第一次呼吸到了新鲜空气。"