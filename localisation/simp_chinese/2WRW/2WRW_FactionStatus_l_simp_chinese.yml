l_simp_chinese:
 CSTO_Guardian_of_Eurasia: "欧亚守护者"
 CSTO_Guardian_of_Eurasia_effect: "[!CSTO_Guardian_of_Eurasia]"
 CSTO_Guardian_of_Eurasia_desc: "俄罗斯联邦自称是欧亚大陆 \"自由与民主的守护者\"，承诺不惜一切代价保卫已经摆脱前轴心国控制的其余国家。\n\n虽然其成功与否还有待观察，而且欧洲各国外交官也认为这不过是与旧秩序相抗衡的拙劣尝试，但中亚较小的国家现在开始向俄罗斯寻求指导，俄罗斯显然是一个正在崛起的地区强国，有朝一日甚至可能成为一个潜在的超级大国。"
 CSTO_Observer: "集体安全条约组织观察成员国"
 CSTO_Observer_effect: "[!CSTO_Observer]"
 CSTO_Observer_desc: "GDP增长提升：§Y3%§!\n\n俄罗斯领导的集体安全条约组织的观察成员国是观察联盟事务的国家，享有与条约组织成员国类似的外交和经济特权，但不承担所有成员国共同的军事责任。"
 CSTO_Member:0 "集体安全条约组织正式成员国"
 CSTO_Member_effect:0 "[!CSTO_Member]"
 CSTO_Member_desc:0 "GDP增长率提升：§Y5%§!\n\n集体安全条约组织的成员在俄罗斯联邦的领导下结成了联盟。每个成员国都有共同的目标，即阻止德意志帝国主义的蔓延，并维持整个自由欧亚大陆的秩序。"
 BI_Member:0 "巴尔干国际成员"
 BI_Member_effect:0 "[!BI_Member]"
 BI_Member_desc:0 "GDP增长率提升：§Y5%§!\n\n巴尔干国际的成员因建立自由巴尔干的共同目标而结成联盟。每个成员国都有共同的目标，即阻止帝国主义的蔓延和促进整个巴尔干地区的平等。"
 VFE_Member:0 "欧洲人民阵线成员"
 VFE_Member_effect:0 "[!VFE_Member]"
 VFE_Member_desc:0 "纳粹压迫者的锁链已经断裂，德国的无产阶级可以自由行动，以欧洲人民阵线作为他们的利剑。欧洲人民阵线最初由左翼民兵、理论家和工人联合组建，他们公开宣称的目标是“保卫欧洲无产阶级群众，彻底根除纳粹主义”。这个联盟致力于为欧洲社会主义国家提供互相的经济和军事援助，同时希望在全球范围内培养人民革命的火焰。"
 PKT_Member:0 "团结协定成员"
 PKT_Member_effect:0 "[!PKT_Member]"
 PKT_Member_desc:0 "GDP增长率提升：§Y5%§!\n\n"
 DPKT_Member:0 "重建协定成员"
 DPKT_Member_effect:0 "[!DPKT_Member]"
 DPKT_Member_desc:0 "重建协定是所有人的第二次机会。法西斯主义的灰色幽灵可能已经在最近的内战的烈焰中被抹去，但它的历史在德国——以及整个欧洲——留下了伤疤。希特勒的噩梦已经被永远封存；现在是时候收拾残局，重建被毁坏的东西了。这个新的协定将寻求修复前几代人留下的创伤。许多人不会原谅开国者所做的一切，但黑夜已经结束，黎明终于到来了。欧洲的创伤不会很快痊愈，但这个协定将是未来美好事物的开始。"
 REV_Member:0 "红色阵线成员"
 REV_Member_effect:0 "[!REV_Member]"
 REV_Member_desc:0 "GDP增长率提升：§Y5%§!\n\n"