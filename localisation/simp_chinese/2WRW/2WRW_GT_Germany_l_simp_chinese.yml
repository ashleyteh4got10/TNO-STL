l_simp_chinese:
 GER_A_Spectre_Haunts_Germany:0 "一个幽灵在德意志游荡..."
 GER_A_Spectre_Haunts_Germany_desc:0 "东方的斯拉夫恶魔对我们进行了令人震惊的暴力袭击，这一次他们的衣着不再鲜红，而是转为沉默的深黑。鉴于斯拉夫人自冲突伊始便对平民肆意残杀，这场新的战争必将残酷和暴虐于以往的一切小打小闹。难以想象的恐怖正降临于雅利安种族——斯拉夫的野兽最后一次醒来，妄图摧毁我们光荣的文明。\n\n然而我们将屹立不倒，回以战火，将他们赶出边境，并在往后的千年内护佑德意志长盛。等到战争的灰烬掩尽俄罗斯平原之后，我们会让他们为无礼与狂妄血债血偿。"
 GER_The_Rapture:0 "扬升"
 GER_The_Rapture_desc:0 "人们常说历史循环往复，如今的情形便是无可辩驳的明证。二十年前，俄罗斯人越过AA线，发起了一场突如其来、毫不留情的进攻，一度逼近莫斯科咫尺之遥。今日这所谓的黑色联盟似乎正在发起另一场战争。事实证明，这次进攻更加危险 —— 他们的攻击比上一次更有组织性，拥有更强大的物资支持，或许OFN亦有介入。\n\n但我们不能一直深陷震惊之中。尽管我们本应预见这记重拳，但我们也曾从一样的困境中凯旋。我们将派遣最优秀的将领挥师东进，制定新的防御计划。我们会洞察他们的战术和战略，寻找最佳的应对之策。我们将一路挺进鄂木斯克，确保类似的耻辱永远不再发生。"
 GER_Revitalizing_The_OKW:0 "复兴国防军最高统帅部"
 GER_Revitalizing_The_OKW_desc:0 "德意志的利剑——国防军最高指挥部，如今已经变得自满，处于锈蚀之中。将帅、军官和职工们从上至下都无比确信我们会轻松取胜，因此他们对眼下的危机置若罔闻。我们必须引入新提拔的成员，让旧日的勋贵们学会坐下倾听。在巨大的危险面前，他们的专业知识至关重要。我们将向他们列出问题，阐明现状，而后一同全力以赴。我们将组织军队、管理后勤，任命合适的将领来领导军队，并确保人们各司其职来维护我们的战争主导权。\n\n战时经济的维护重任亦需精明的组织，以期足够的物资、弹药和人力能源源不断地运抵前线。从普鲁士时代到西俄战争，德意志的军事力量从来无可质疑。如今我们亦不会给对衰退的恐惧半点可趁之机。"
 GER_No_Town_Untouched:0 "一处不留"
 GER_No_Town_Untouched_desc:0 "即便看似极端， “焦土政策” 在削减敌人可用物资、材料和掩体方面的效力毋庸置疑。作为防御战术的一部分，我们必须将其纳入作战准则。尽管撤退令人沮丧，我们仍可以将无法带走的物资付之一炬，减轻一些失落感。这不仅会让敌军陷入混乱、物资匮乏的境地，还能为我方反击创造更有利的条件。在广袤的东部地区，此举将产生显著效果。\n\n即便战后重建需要花费大量时间，但一旦黑色联盟的威胁被彻底铲除，我们的工时便会无比宽裕。过程中也许难免产生一些附带的损害，但只要目的正当，手段自然无可指摘。"
 GER_Fleecing_The_Corporations:0 "敲诈私营企业"
 GER_Fleecing_The_Corporations_desc:0 "尽管我们不愿承认，但在这场战争中，后勤方面的确已经开始出现问题。武器、弹药、车辆、补给及各类战争物资无一不存在短缺，并且其正逐渐引发致命的后果。十分不幸，我们如今的产能没法满足需求，短缺状况可能进一步加剧。我们将不得不指望私营经济来应对后勤危机。\n\n如果这些私营企业以为我们会低声下气地求助，那就大错特错了。我们可以通过法律和经济手段施加压力，迫使他们听命行事。这或许会损害我们与企业的关系，但考虑到私营公司们这些年全靠奴役劳工养得肥头大耳、腐朽堕落，也是时候让它们改弦更张了。"
 GER_Our_Past_Trials:0 "来自过去的教训"
 GER_Our_Past_Trials_desc:0 "历史可以被主题化与模式化，从过往的模式中汲取教训往往是应对新挑战的关键。这种智慧同样适用于此，第一次西俄战争迫使我们适应新颖且有趣的战争方式，我们不能因如今参谋部的傲慢和自负而浪费那些宝贵的教训。我们将翻开日志，邀请退伍老兵来回顾上一场战争是如何取胜的，并命令将军与士兵们再次运用那些战略和战术。\n\n重新学习的过程耗时甚久。因此这也会为许多无法直接服役的退伍老兵提供岗位，让他们可以作为教官和顾问，传授自己的知识和经验。"
 GER_A_Wall_Of_Water_And_Mud:0 "泥泞潮湿的长城"
 GER_A_Wall_Of_Water_And_Mud_desc:0 "宏伟的第聂伯水库群是乌克兰的生命线，它牢牢地蓄积着数十亿立方米的水。它的存在为这片土地注入了活力，为德意志垂涎的粮仓提供了电力和水源。但它也可以发挥战术作用。只要打开泄洪闸，就能释放共工之灾，淹没其流域，使敌人熟悉的地形变得无从下脚，成为一道泥泞潮湿的长城，这足以大大延缓斯拉夫野兽的推进。尽管仍有诸多后勤和战术上的问题需要考虑，这些大坝无疑隐含着强大的力量，它们足以改变战争走向，甚至一劳永逸地击垮俄罗斯帝国。"
 GER_Render_Unto_Caesar:0 "凯撒的归凯撒"
 GER_Render_Unto_Caesar_desc:0 "我们面临的诸多问题之一，是东部领地的财政无底洞。大量的资金、资源和人力只能换来极为平庸的收入。不能再做亏本生意了，我们慷慨解囊，岂能不求回报？让他们去大赚一笔，然后尽快偿还。\n\n事实证明，这场战争在任何意义上都代价高昂，我们不能仅仅满足于对过去辛劳付出的认可。工业产出、食品、原材料以及其他物资都是战争的关键。我们将严格制定并执行配额，以确保我们应得的一份分毫不差地征缴入库。投资就是为了回报，而如今这份期望比任何时候都更需满足。"
 GER_Every_Inch_A_Battleground:0 "寸土皆为战场"
 GER_Every_Inch_A_Battleground_desc:0 ""
 GER_The_White_Horse:0 "征服乘白马而来"
 GER_The_White_Horse_desc:0 ""
 GER_All_For_The_Reich:0 "一切为了德意志"
 GER_All_For_The_Reich_desc:0 "倘若没有工业的支撑，没有民众的支持，没有各级政府和行政部门的全力投入，胜利从何而来？黑色联盟对我们持续的猛攻已然充分表明，这是一场生死之战——但绝对不是我们的。每一座工厂，每一所车间，正源源不断地产出战士们需要的一切武器、弹药、车辆和设备。我们将扼断进犯，逆势回击，直捣斯拉夫野兽的心脏，并一劳永逸地解决它。\n\n每一点余粮都将优先供应前线的勇士，我们伟大的民众对定量配给习以为常，只要施以公平，定可免遭饥荒。此外，我们将从民用工业中征用铁、煤、钨和铜，一切资源，战争为先。元首将发表讲话，宣布征兵制的恢复，以确保战线上的人力永不枯竭。"
 GER_An_Engine_Ran_On_Blood:0 "燃血之引擎"
 GER_An_Engine_Ran_On_Blood_desc:0 ""
 GER_The_National_Struggle:0 "举国奋战"
 GER_The_National_Struggle_desc:0 "伟大的演说家会告诉你，在语言的扭曲之下，任何事情都会失去自身的倾向，可善可恶。由此，我们将让全国人民认识到一个不可磨灭的事实——我们是优越的种族，这已被过去的胜利一次又一次地证明。作为勇敢而自豪的民族，我们将肩并肩，共同抵御斯拉夫人的兽性侵略。作为当代的斯巴达人，我们已经击退了无数各种形式的敌人，而这次也不会例外。德意志的人民啊，不要害怕！因为胜利是必然的，唯一要做的就是发出宣言。\n\n我们将通过电视、报纸、广播和所有其他手段来宣传这一点，将这一铁律传达给境内的每一个人。每一个灵魂都将被点燃，随着灵魂的燃烧，我们将宣告最终的、响亮的胜利。"
 GER_The_Many_Talons_Of_The_Eagle:0 "团结协定之惠"
 GER_The_Many_Talons_Of_The_Eagle_desc:0 "有人说，我们是在独自对抗东方的斯拉夫野兽，我们在充满敌意的世界中是孤立和脆弱的。他们大错特错。我们是欧洲的主人，几十年前我们征服，而后将其重塑为元首的工具，为德意志尽职尽责。团结协定是我们最伟大的成就与武器，如今是时候启用它了。\n\n此刻德意志已站在崖边，我们的宿敌势要摧毁我们取得的一切成就。为了国家、党和人民的利益，必须不惜一切代价将其消灭殆尽。为了德国与德意志对欧洲的完全统治，也为了德国和德意志在未来的永恒统治，我们将像对待我们的国民一样，对待每一个同盟下的附庸。"
 GER_Fan_The_Winds_Of_Desperation:0 "煽动绝望之风"
 GER_Fan_The_Winds_Of_Desperation_desc:0 "我们坚信胜利确笃，但紧迫的形势宣传有助于鼓励人们提出更有创造性的方案。德意志已咽喉敞露......死到临头......这是最后的机会......诸如此类的言论在政府、军队以及平民中不断流传。危言耸听可能不算正统的宣传方式，但恐慌可以被提炼成优质的动力源。\n\n只需有哪怕一个天才灵光一现，我们就能得到对现有问题创造性的解决方案。更快的枪支生产方案、更高效的汽油提炼法，或者对官僚机构无伤大雅的精简，涓涓细流终将汇成江河。这也许是不同寻常的方法，但我们如今所处绝境，任何潜在的优势都不能忽略。"
 GER_There_Is_No_Want:0 "消灭欲望"
 GER_There_Is_No_Want_desc:0 "自给自足。元首设计的这一完美体系，指的是在社会、国家及经济方面实现完全的自我供给。在第二次世界大战期间，它在维持我国经济和社会稳定、减少进口需求方面被证明是无价的。但无论如何，我们如今已无需过度地供给。顽强勇敢的人民只会要求生活的必需品，多则无益，政府也将欣然配合。\n\n然而，也有些人自私地进行囤积，占用了邻居和社区的配给。他们的愚蠢、骄傲和偏执让他们自以为一切应得，造成了大量食物的腐烂变质，这样的浪费是绝不允许的。我们要切实实行自给自足之策，坚决肃清弄虚作假之人。"
 GER_Only_What_Must_Be_Done:0 "必要之恶..."
 GER_Only_What_Must_Be_Done_desc:0 "自从我们在全境正式实行极端的自给自足政策以来，民间的物资源源不断地流向前线。但这恐怕远远不够。\n\n因此，我们将不得不行必要之恶。我们仍需从平民手中取得更多资源，并将其全部供给部队。食品和燃料的配给将会增加，民用车辆将会在战争中发光发热。这会在短期内损伤国家，但如今我们必须不惜一切代价取得胜利。"
 GER_Black_Horse:0 "饥荒驾黑驹而至"
 GER_Black_Horse_desc:0 ""
 GER_Vengeance_Incarnate:0 "俄罗斯，焚毁世界之兽"
 GER_Vengeance_Incarnate_desc:0 "从敌人毫不掩饰的强硬言论来看，这场冲突的规模也许将远远超出西俄战场。这些疯子拥有难以估量的核武储备，危险程度不亚于石油池旁整整一打点燃的火柴。毫无疑问，这种迫在眉睫的危险对其他大国亦显而易见，我们必须通过外交渠道向整个世界发出诚挚的警告。\n\n我们将不得不承认痛苦的事实：德意志并非独自征服欧洲。我们需要盟友，如今是再次打出这张牌的时候了。通过与其他国家接触，我们也许能签署一系列有利的贸易协议，甚至获得直接的支持。这并非绝望中的求助，而是尽我们对世界的责任——我们会警告整个世界，这也是他们的生死关头。"
 GER_A_Meeting_Of_Necessity:0 "必要的会面"
 GER_A_Meeting_Of_Necessity_desc:0 "德意志从来不以谦逊著称——老鹰怎会吝惜爪中玩物？然而现在全人类都面临着真正的存亡之危，我们必须放下骄傲。美国人仍然自囚于办公桌，而日本人如今高居宝塔之上，但即便相互敌视，我们仍需为人类存续携手奋战。我们将提供一切证据，吐出任何必要的谦辞来促成这个邪恶的联盟。所有无用的虚谈阔论都将一扫而空。\n\n我们已经别无他选。邪恶联盟也许并非好的选择，但总好过冷眼旁观世界陷入疯狂的邪教统治，最终在他们所谓的“大审判”中灰飞烟灭。无论如何，他们必须明白，德意志的存在比一个被沙林毒气和辐射覆盖的世界更加美好，否则只有上帝才能保佑人类不亡。"
 GER_Old_Friends_In_Rome:0 "来自罗马的旧友"
 GER_Old_Friends_In_Rome_desc:0 "轴心时期以来，我们与意大利政府的关系渐渐恶化。尽管如此，结成新联盟的基础仍在。这可能需要我们放下傲慢，做出一点让步——黑色联盟给我们的压力需要孤注一掷的豪赌。意大利人很可能也会意识到这一点，他们将更容易接受提议。因此我们必须重启外交渠道。\n\n我们会向他们明确地表达需求，已经没有时间运用心理战或陷入琐碎的攀比了。我们将请求经济支持、轻重工业产品进口、商业投资，甚至是任何可能形式的军事援助。我们会尝试获取任何他们愿意提供的资源。这可能需要高昂的代价，但外交官们会尽一切努力使交易至少公平公正。"
 GER_Sins_Of_The_Demons_Revealed:0 "让他们见识真正的联盟"
 GER_Sins_Of_The_Demons_Revealed_desc:0 "一直以来，人们对黑色联盟有着各种各样的看法。美国人与许多未开化世界的愚者们把联盟仅仅看作是对德意志的报应。但当世界开始被急速拖入一个绝望与沉默的新时代时，抱有幼稚想法的人们将自食其果。显而易见，一场热核战争将扩散到整个世界。我们不需要与联盟再发生任何新的冲突，他们已经自证，斯拉夫野兽的能力绝不仅限于将我们纯洁的血液洒尽于欧罗巴的锦绣。\n\n我们唯一所要做的，就是记录这一切，并向世界公开。他们自会适时站在联盟的对立面。"
 GER_Comrades_In_The_Balkans:0 "我们的巴尔干盟友"
 GER_Comrades_In_The_Balkans_desc:0 "我们如今滑入的战争深渊不仅将是德意志民族的末日，也将是所有为事业不懈奋战的盟友的末日。巴尔干地区的盟友曾在第二次世界大战中协助我们取胜，可他们并未见识过我们的军队在第一次西俄战争中面临的艰难战况。我们不能再犯同样的错误。\n\n他们必须征召军队，不惜一切代价协助我们击退黑色联盟。在这场冲突中，任何物资短缺都将由我们解决。然而如果他们拒绝参战，我们也可以提醒他们 —— 为何我们才是欧洲的主宰。"
 GER_Against_The_Maelstrom_Of_Hatred:0 "共抗来自地狱的恶魔"
 GER_Against_The_Maelstrom_Of_Hatred_desc:0 "在国际舞台上，几乎所有人都将这个非法的俄罗斯国家视为威胁。我们可能存在分歧，但与OFN和共荣圈的结盟是必要的预防措施，全世界都祈祷我们能永远摧毁这个短命而堕落的政府。我们将团结整个工业化世界的力量，确保德意志在这场代价高昂的战争中获胜。"
