 RULE_OPTION_USA_REP_PRIMARIES_1976_BAKER_DESC: "§F在§R共和党§!继续前进的同时，§M美国§!变得越来越§V分裂§!，总得有人站出来以§R两§!§B党§!合作的名义§y团结§!这个国家。而这个人就是§R霍华德·贝克§!。这位来自§z田纳西州§!的参议员在州立法机关有着丰富的§R两§!§B党§!妥协经验，并希望将这种治理风格带到§D总统办公室§!。堪萨斯城将见证他接管§R共和党§!，并在§Y1976年§!的§W总统§!竞选中引入§i国会保守主义§!。§R贝克§!主张一种更§G温和§!的保守主义，强调与国会§B民主党§!§h合作§!的必要性，提出基于国会能够§Y完成§!的可能性的政策和项目。尽管这种方式诞生于国会，缺乏§M公众的认可§!，但§R贝克§!在§Y国会§!中的§y辉煌纪录§!不言自明。\n\n§R需要:§!\n§M£GFX_npp_texticon 国家进步公约赢得§!£TNO_game_rule_flag_USA  §Y1972年美国总统选举§!\n§R注意：如果共民联盟候选人赢得1972年大选，则此游戏规则不会生效§!。"
 RULE_OPTION_USA_REP_PRIMARIES_1976_REAGAN: "£GFX_rd_r_texticon §R罗纳德·里根§!"
 RULE_OPTION_USA_REP_PRIMARIES_1976_REAGAN_DESC: "§F随着§R共和党§!接纳了§g国民党团§!的成员，其政策也随之发生了不可避免的变化。这种变化让§R罗纳德·里根§!在堪萨斯城赢得了提名。这位§z加利福尼亚州§!的前州长将从§R巴里·戈德华特§!之前的竞选中受益，在堪萨斯城的§V“加冕仪式”§!上统一§f自由主义者§!和§R传统保守派§!。赢得§R共和党§!提名后，他将§i融合主义§!带入§Y1976年§!§W总统§!竞选。§R里根§!主张§R强硬§!的§Y外交政策§!和§R大幅削减§!现代§Y福利国家§!，追求基于§Y超越道德秩序§!和§Y自由市场资本主义§!的政策。尽管他的选民群体在§M全国范围§!内缺乏§Y实践证明§!，但§R里根§!具备足够的§y魅力§!，将自己和这些政策推向§y胜利§!。\n\n§R需要:§!\n§M£GFX_npp_texticon 国家进步公约赢得§!£TNO_game_rule_flag_USA  §Y1972年美国总统选举§!\n§R注意：如果共民联盟候选人赢得1972年大选，则此游戏规则不会生效§!。"
