 RULE_OPTION_USA_LEADER_ROUTE_1976_RANDOM_DESC: "§F§Y1976年大选§!发生在美国历史上一个重要的里程碑之后：§M美国独立宣言§!200周年。在世界仍在从石油危机和第二次西俄战争的冲击中恢复过来时，随着美国在新的世界范式中继续坚持自己的立场，美国选择的未来将产生深远的影响。随着七十年代在新秩序中继续前进，第七党派体系正在美国兴起，两个熟悉的政党在选举冲突中§R再次发生分歧§!。§!"
