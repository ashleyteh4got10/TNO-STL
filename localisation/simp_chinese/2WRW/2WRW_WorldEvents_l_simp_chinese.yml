 WORLD.41021.t:0 "[Get_newspaper_header]德国发生民主革命！"
 WORLD.41021.desc:0 "帝国在东欧惨败后，一度被认为是小规模的学生抗议和骚乱最终升级为很少有人预料到的结果：第三帝国的终结。\n\n今天早些时候，一群抗议者领导的民兵聚集在由游击队员“斯巴达克斯”威利·勃兰特领导的反法西斯抵抗组织“黑红金国旗团”的领导下，袭击了人民大厅，击溃了剩余的纳粹政府。勃兰特不久后在一次演讲中宣布，帝国现已“解体”，取而代之的是新成立的德意志共和国。\n\n元首逃离了柏林，国防军各派系就是否支持勃兰特政府而发生冲突，而准军事组织在国内进行恐怖活动。尽管德国现在呼吸着自由的空气，但呼吸并不轻松。"
 WORLD.41021.a:0 "统一、正义与自由。（德语）"
 WORLD.41022.t:0 "[Get_newspaper_header]马丁·鲍曼去世"
 WORLD.41022.desc:0 "德国国会宣布马丁·鲍曼元首因肺癌晚期不幸去世，随后德国将进行为期四个月的哀悼。他去世的消息震惊了德国公众，此前公众对元首健康状况的恶化并不知情。这一消息则是在对国家官员和基础设施的恐怖袭击愈演愈烈之际传出的。\n\n政府内部派系的残酷解体使得日耳曼尼亚的宝座向马丁·鲍曼选定的继任者大开，然而，他们也必须应对街上的反对声浪以及国际上日益增加的压力。美国和日本肯定会趁虚而入，而俄罗斯这只巨熊也正变得愈加危险。变革的幽灵笼罩德国，对于鲍曼的继任者来说，一千年或许远远不够。"
 WORLD.41022.a:0 "现在谁会让德意志之鹰继续翱翔？"
 WORLD.41023.t:0 "[Get_newspaper_header]格哈德·克洛普佛继任元首"
 WORLD.41023.desc:0 "德国国会宣布支持前副元首格哈德·克洛普佛接任已故的马丁·鲍曼。正如众所预料，作为一个在德国如此位高权重的人物，他得到了绝大多数保守官僚和军队的广泛支持，这让他得以确保自己对德国的统治。\n\n在人民大厅门前，克洛普佛赞扬了前元首对抵挡政府和军队中的叛徒，维护国家繁荣与安全的决心。克洛普佛还承诺扩大政策，将国家的经济从石油危机的冲击中完全复苏，并粉碎国内重新崛起的左翼恐怖主义运动。通过这些手段，元首保证了德国在迈向现代化的过程中能恢复更伟大的企划。"
 WORLD.41023.a:0 "德国的得意门生将延续其千年的统治。"
 WORLD.41024.t:0 "[Get_newspaper_header]莱因哈德·盖伦继任元首"
 WORLD.41024.desc:0 "马丁·鲍曼去世后，德国国会最终宣布任命战略支援警察的负责人莱因哈德·盖伦为下一任元首。在秩序警察的广泛影响，以及对第三帝国内激增的反法西斯恐怖主义活动感到担忧的政府管理者的支持下，盖伦在人民大厅前发表了讲话，他承诺未来的德国及其人民将免受“犹太-布尔什维主义渗透和恐怖主义”之扰。\n\n一些人怀疑盖伦将在整个团结协定以及德国国内扩大国家的安保措施，并把希特勒的遗产扭曲为对民族社会主义的畸形记忆，以此来巩固自己的权力。不过，也有人希望恐怖的爆炸和骚乱会在他的监督下偃旗息鼓。"
 WORLD.41024.a:0 "大日耳曼国的看守人凝视着他的新帝国。"
 WORLD.41025.t:0 "[Get_newspaper_header]库尔特·瓦尔德海姆继任元首"
 WORLD.41025.desc:0 "德国国会宣布，外交部代理部长库尔特·瓦尔德海姆将担任下届元首。瓦尔德海姆是纳粹党内权力斗争的一匹黑马，尽管他有改革派倾向，但鲍曼还是放了他一马，据说这是因为他背叛了巴尔杜尔·冯·席拉赫。他的崛起得到了诸如军工寡头和德国知识界残余人士等权贵的公开支持。\n\n瓦尔德海姆宣布他将重点放在加快与世界超级大国的关系缓和上，还有传言称，瓦尔德海姆可能会复兴施佩尔集团提出的“国际联合”概念。不管他的真实意图如何，第一位雅利安外交官必须在一个被希特勒的好战政策定义的世界上走起钢丝，且很快就会被东方的新战事摧毁。"
 WORLD.41025.a:0 "要么合作，要么去死。"
 WORLD.41026.t:0 "[Get_newspaper_header]克洛普佛发动清洗"
 WORLD.41026.desc:0 "德国国会已经宣布开始在克洛普佛元首的直接指挥下对纳粹党进行全面清洗，这是防止政府内部混战的必要对策。而石油危机，学生抗议的再起以及马丁·鲍曼的去世使得清洗扩大到了政府以外的民间组织。\n\n在全德国的街道上，秩序警察和国防军的规模也随清洗进行而增加，其目的在于迅速平息学生骚乱并遏制左翼恐怖分子。国际观察家不仅报告了对抗议者的残酷虐待，还报告了对其家人的降职、监禁或流放。改革派和军国派的残党连同他们的妻儿被一并公开处决。"
 WORLD.41026.a:0 "叛国行为将被彻底铲除。"
 WORLD.41027.t:0 "[Get_newspaper_header]盖伦发动清洗"
 WORLD.41027.desc:0 "德国传来了恐怖的消息。对付“国家内部的叛徒和共党分子”的第三次清洗在盖伦元首的指挥下拉开序幕，据报道，盖伦在日耳曼尼亚的一次红军旅分子的爆炸袭击中受伤。这次爆炸杀死了几位平民，以及当地的秩序警察官员和高层官僚，但未能消灭主要目标。\n\n伴随着对平民、军队和官僚阶层的血腥清洗，盖伦还批准了《祖国保卫法》，这部法律扩大了秩序警察的法律权力，放宽了对国家内部异议分子的法外搜查和逮捕。尽管纳粹党以热烈赞扬了这部法律，但国际观察家指出，这项法律的早期批评者并没有出席签字仪式，其中一些人已经数月没有公开露面了。"
 WORLD.41027.a:0 "德国的监视之眼永不停歇。"
 WORLD.41028.t:0 "[Get_newspaper_header]瓦尔德海姆发动清洗"
 WORLD.41028.desc:0 "德国输掉第二次西俄战争后，纳粹党变得明显不稳，于是元首迅速清洗了政府内部的颠覆分子。瓦尔德海姆政府利用从鲍曼与希特勒政权的档案中抢救出来的文件，以腐败和叛国罪判处了许多军官、政治家和官僚监禁或死刑。\n\n在德国媒体关注“叛国分子”的同时，却忽略了对政府外的异议人士（特别是学生抗议者）采取的措施。近期，学生的抗议明显平静了下来，抗议的几位重要领袖也悄然消失。与之相对，德国媒体宣传了忠于瓦尔德海姆元首的年轻男女，并鼓励他们“密切关注”自己的同学。"
 WORLD.41028.a:0 "德国的热情之手化为铁拳。"
 WORLD.41029.t:0 "[Get_newspaper_header]豪辛格将军发动政变"
 WORLD.41029.desc:0 "第二次西俄战争后，公众及政府机构对马丁·鲍曼的继任者的信心跌至谷底。在被经济停滞和发动报复的双重恐惧的刺激下，由豪辛格将军领导的民族社会主义军官团政变推翻了日耳曼尼亚的文官政府。\n\n豪辛格元首承诺使用军队纪律和雅利安人之力来重建并振兴德意志民族。上马新公共工程，发动“经济斗争”是他公共政策的基础。然而，血腥暗杀鲍曼派及其支持者也是豪辛格短暂掌权的特点之一。随着激进的国防军加强对德国外壳的控制，估计紧张局势只会继续恶化。"
 WORLD.41029.a:0 "为了祖国，打倒犹太教与懒惰之疾。"
 WORLD.41030.t:0 "[Get_newspaper_header]施佩尔辞去元首一职"
 WORLD.41030.desc:0 "由于德国在第二次俄罗斯战争中落败的反响剧烈，阿尔伯特·施佩尔元首正式宣布辞职，理由是“严重的健康问题”。施佩尔在国会发表声明，任命新政府，称其“由继续履行我们民族的斗争之义务的可敬之人组成。”\n\n新政府的著名成员包括副元首库尔特·基辛格，即新的国家总统，以及现已被任命为国家总理的赫尔穆特·施密特。据传“四人帮”是一群暗中恢复德国民主的官僚，他们公布了一项全面的计划，旨在“恢复希特勒治下享有的繁荣”，其早期计划包括加速自由民主改革，取消优生学与种族政策。"
 WORLD.41030.a:0 "希特勒的新秩序开始落幕。"
 WORLD.41031.t:0 "[Get_newspaper_header]人民大厅演讲"
 WORLD.41031.desc:0 "德国第二次西俄战争战败后，阿尔伯特·施佩尔元首再次接管了政府。施佩尔在人民大厅的一次演讲中宣称，“犹太人和自由派-布尔什维克的破坏”要为东欧的灾难负责。施佩尔称，叛匪为了推翻国家，暗杀了情报人员、截获了关键命令、搅乱了军队的贸易协议。\n\n德国的所有进步改革承诺都破灭了。赫尔穆特·施密特和汉斯·斯派达尔很快遭到逮捕，而一个新的特别法庭以出现在地平线上。联系激进学生运动的人被打为软弱与幼稚之徒。激进的定居者从东方归来，他们呼吁元首清除德国所有的自由主义影响。"
 WORLD.41031.a:0 "民主就是这样消亡的，伴随着人们的低声乞求。"
 WORLD.41032.t:0 "[Get_newspaper_header]施佩尔辞去元首一职"
 WORLD.41032.desc:0 "在德国输掉第二次西俄战争后，阿尔伯特·施佩尔元首出人意料地宣布了辞职，理由是“严重的健康问题”。施佩尔在国会发表声明，任命新政府，称其“由继续履行我们民族的斗争之义务的可敬之人组成。”\n\n新政府似乎是主要围绕着副元首库尔特·基辛格组建的，他是新任国家总统。政府里其他的著名成员包括就任国防军首脑的奥托·恩斯特·雷默，和就任国家总理的马丁·穆斯格弩格。而外交部长赫尔穆特·施密特显然没有出现在名单中，因此许多人怀疑他可能已被迫离开权利中心。当被问及对此事的评论时，基辛格说：“在新德国，男人们赢得了应有的地位。”"
 WORLD.41032.a:0 "德国的犹大露出马脚。"
 WORLD.41033.t:0 "[Get_newspaper_header]国防军武装夺权"
 WORLD.41033.desc:0 "德国的街道上到处是国防军的巡逻队与坦克。国家元帅汉斯·斯派达尔已经控制了政府，元帅令即是今日秩序。\n\n随着德国在第二次西俄战争中落败，民族社会主义政府无法有效结束混乱。施佩尔元首和他的内阁之间的内讧反而加剧了问题，与此同时，官僚机构的功能障碍和不流血政变的谣言使得德国迅速衰落。军方认为损失是因文官干涉其中才造成的，并为此感到愤慨不已，他们威胁纳粹党的大多数成员大规模地公开辞职。虽然国防军无疑是比施佩尔更有效率的领导人，但“不关心政治的元首”斯派达尔未必是股推动自由化的势力，自由德国的呼唤者或许要眼睁睁地看着希望破灭了。"
 WORLD.41033.a:0 "新秩序里，演讲在坦克面前毫无胜算。"
 WORLD.41034.t:0 "[Get_newspaper_header]新特别法庭"
 WORLD.41034.desc:0 "尽管德国赢得了第二次西俄罗斯战争，但阿尔伯特·施佩尔元首还是宣布叛国和异议的行径导致了冲突中“无法接受的军事和政治损失”。第二场特别法庭已经开幕。党内的许多激进派异见人士，如前外交部长赫尔穆特·施密特，以及极右翼人物如特奥多尔·奥柏兰德，和非政治领袖如汉斯·斯派达尔均已叛国罪和煽动叛乱罪被逮捕并接受审判。\n\n当德国民众因鲜血而大声疾呼之时，国际观察家谴责这场几乎不加掩饰的大屠杀不过是对政府中民主倾向最强烈分子的清洗。外交部已经保证德国不会重新陷入停滞，且仍会保持“贸易开放”。"
 WORLD.41034.a:0 "大日耳曼国漏出了真面目。"
 WORLD.41035.t:0 "[Get_newspaper_header]施佩尔辞去元首职务"
 WORLD.41035.desc:0 "在德国赢得第二次西俄罗斯战争后，阿尔伯特·施佩尔元首正式宣布辞职，理由是“严重的健康问题”。施佩尔在国会发表声明，任命新政府，称其“由继续履行我们民族的斗争之义务的可敬之人组成。”\n\n新政府的著名成员包括副元首库尔特·基辛格，即新的国家总统，以及现已被任命为国家总理的赫尔穆特·施密特。据传“四人帮”是一群暗中恢复德国民主的官僚，他们公布了一项全面的计划，旨在“延续施佩尔元首的遗产”和“将德国再续千年”，其早期计划包括加速自由民主改革，取消优生学与种族政策。"
 WORLD.41035.a:0 "统一、正义和自由！"
 WORLD.42001.t:0 "[Get_newspaper_header]维利·勃兰特遇刺！"
 WORLD.42001.desc:0 "德国民主革命领袖维利·勃兰特已逝世。\n\n今早，在政治集会上，国旗团领袖在一次被日耳曼尼亚视为是反动的“狼人”恐怖组织“蓄意政治动机袭击”中中枪身亡。随着各种准军事组织和民兵在街头激战，联邦议院已宣布正式“紧急状态”。社会主义煽动分子、纳粹同情者，甚至是残存的国防军分子，纷纷公开冲突并控制当地地区。\n\n恐慌和恐惧席卷了前帝国，随着任何形式的控制继续暴力地崩溃，这个已经摇摇欲坠的国家陷入了无政府状态。随着国家四分五裂，似乎勃兰特为德国民主所憧憬的梦想可能会像它开始的那样迅速地被抹去在历史的长河中。\n"
 WORLD.42001.a:0 "黑暗的阴影笼罩着德国。"
 WORLD.42001.b:0 "大灾难！"
 WORLD.42001.c:0 "该死！"
 WORLD.42002.t:0 "[Get_newspaper_header]德国内战开始！"
 WORLD.42002.desc:0 "来自日耳曼尼亚首都内部的传闻证实了关于帝国中发生大规模斗争的传言。随着国旗团不再能够维持其权威，现实已经变得清楚：作为欧洲历史上最大的帝国，大日耳曼国已陷入内战。\n\n尽管德意志试图在维利·勃兰特遇刺后恢复秩序，南部的准军事组织“狼人”却对新的民主联盟发动了武装叛乱，摧毁了一切和平解决冲突的希望，随着各种其他派系争夺每一块土地，根舍尔的共和军不遗余力地维护日耳曼尼亚的安全。\n\n战火已经结束了新秩序，带来了动荡的新开端。"
 WORLD.42002.a:0 "天佑德意志。"
 WORLD.41036.t:0 "[Get_newspaper_header]阿根廷赢得1974年世界杯！"
 WORLD.41036.desc:0 "在一场紧张的比赛中，阿根廷国家足球队以微弱优势战胜了德国足球国家队。漫长的冠军之路对球队来说是一个挑战，但在球队教练塞萨尔·梅诺蒂的指导下，他们在世界舞台上向同胞证明了自己的价值。\n\n他们的对手德国国家队优雅地接受了失败，德国队主教练乔治·布施纳与对手握手。然而，在返回[64.GetName]后，布施纳以健康状况恶化为由宣布退休，尽管有传言称德国政府在战败后要求他辞职。在大多数地方，全世界都为阿根廷在赛场上展现出的勇气而欢欣鼓舞，而德国则沉迷于运动场上的失败。"
 WORLD.41036.a:0 "对德国的自尊心来说是一个毁灭性的打击。"
 WORLD.41036.b:0 "该死！"
 WORLD.41036.c:0 "阿根廷万岁！"
 WORLD.41037.t:0 "[Get_newspaper_header]1976年唐山大地震"
 WORLD.41037.desc:0 "今天凌晨，中国唐山省发生7.6级特大地震。中国总统高宗武呼吁立即提供大量援助，并将大量国家资金投入到受灾地区。专家估计约有10万人死亡，但由于数千人失踪，还有更多人情况危急，这一数字可能很快就会呈指数级增长。\n\n共荣圈的反应是同情但温和的，东京为重建工作提供了象征性资金，但由于石油危机的影响仍在该国挥之不去，因此在提供关键援助方面仍犹豫不决。同样在这场灾难中遭受重大损失的满洲和蒙古政府也请求援助，但日本似乎没有提供更多资金，而陷入困境的东亚国家似乎也看不到结束的迹象。\n"
 WORLD.41037.a:0 "巨龙趔趄。"
 WORLD.41037.b:0 "我们已经无法承受更多的灾难了！"
 WORLD.41038.t:0 "[Get_newspaper_header]泰德·邦迪被捕"
 WORLD.41038.desc:0 "臭名昭著的校园杀手西奥多·罗伯特·考威尔，更为人所熟知的名字是泰德·邦迪，已被佛罗里达州彭萨科拉市的当地警方逮捕。此前邦迪曾多次被捕，但始终成功逃脱，直到现在。这名杀手以连环谋杀和绑架年轻女性而声名狼藉，可能追溯到20世纪60年代。幸存的受害者描述邦迪极其迷人和有魅力，他利用这一点引诱女性走向死亡。\n\n在他被捕后，与多年来多个州和县发生的其他失踪案和谋杀案建立了联系。邦迪已被监禁，等待着一个未公布的审判日期。虽然案件本身可能还需要时间来审理，但在大量不利于他的证据面前，几乎没有人指望他会被判无罪。"
 WORLD.41038.a:0 "他逃过了多少次拘捕？"
 WORLD.41038.b:0 "终于把这个混蛋抓住了！"
 WORLD.41039.t:0 "[Get_newspaper_header]磁共振成像发明！"
 WORLD.41039.desc:0 "今天，美国化学家保罗·克里斯蒂安·劳特伯和他的搭档英国物理学家彼得·曼斯菲尔德向世界正式展示了MRI（磁共振成像机），这标志着现代医学的一项巨大胜利。该设备可以对人体解剖结构进行科学上前所未有的详细扫描，从而可以更直接地诊断多种疾病，尤其是大脑疾病。\n\n凭借这一令人震惊的成就，美国增加了项目资金，并协助两人生产供项目测试之外使用的原型。科学界的反应非常积极，该设备很快就会在世界各地的医院中得到实际应用。"
 WORLD.41039.a:0 "划时代的发明！"
 WORLD.41040.t:0 "[Get_newspaper_header]SALT条约签署"
 WORLD.41040.desc:0 "长达数周的谈判在美国和大日本帝国之间展开，最终达成了SALT条约，即战略武器限制谈判。这两个超级大国达成了两项独立协议，即反弹道导弹条约和关于战略武器限制的临时协议和议定书，旨在降低核武器的生产，并防止两个大国之间核军备竞赛的升级。\n\n通过这些条约和协议，世界能够呼吸得更加轻松，并迈出了减少核毁灭风险的第一步。尽管许多人私下里对该条约的持久性存在疑虑，尤其是由于大日耳曼国拒绝参与任何大规模裁军，但条约作为进一步谈判的起点的作用不可低估。"
 WORLD.41040.a:0 "迈出了第一步，但不是最后一步"
 WORLD.41040.b:0 "纯纯的软弱！"
 WORLD.41040.c:0 "指针从午夜渐行渐远。"
 WORLD.41041.t:0 "[Get_newspaper_header]世贸中心在纽约开放营业"
 WORLD.41041.desc:0 "今天下午早些时候，新世贸中心的塔楼已正式开放，供美国和国外的许多人庆祝。除了纽约房地产大亨之外，地方和国家政界的几位人物也出席了这座现已被列为世界最高建筑的大楼的落成典礼。成为当地英雄和美国梦形象的日裔美国公民山崎实也赢得了许多祝贺。\n\n许多国家祝贺美国开放这个经济中心，特别是在OFN内部；日本政府也对山崎先生给予了特别赞扬。看来，随着双子塔达到新的高度，国际社会内部的联系只会继续向前同步发展。"
 WORLD.41041.a:0 "一个新的商业中心在纽约诞生了。"
 WORLD.41041.b:0 "美国工程的精髓所在！"
 WORLD.41041.c:0 "日本工程的精髓所在！"
 WORLD.41041.e:0 "根本没法与人民大厅的优雅相媲美！"
 WORLD.41042.t:0 "[Get_newspaper_header]悉尼歌剧院开放营业"
 WORLD.41042.desc:0 "昨天，位于澳大利亚中心的悉尼歌剧院在热烈的掌声中开幕，已经开始被认为是20世纪最独特和标志性的建筑之一。歌剧院占据了悉尼市本内隆角的全部区域，预计将在几个月后举办首场演出。\n\n歌剧院由三家公司共同经营，预计将成为悉尼最受欢迎的景点之一。许多人将这个地方誉为一个新的文化中心和世界奇迹，而这个国家在艺术贡献方面鲜为人知。预计澳大利亚总理将在未来几个月参观歌剧院的首场演出，因为这个艺术中心正从新南威尔士州掀起波澜。"
 WORLD.41042.a:0 "给我留个座！"
 WORLD.41043.t:0 "[Get_newspaper_header]内战席卷哈萨克斯坦！"
 WORLD.41043.d:0 "在几十年的沉寂之后，中亚地区再次引起了国际社会的兴趣，因为哈萨克斯坦的秩序面临彻底崩溃。此前，该国由苏联残余当局控制，不同派系夺取了该国的大片领土，前苏联共和国的领土已经减少到了大草原的沙漠地带。\n\n尽管大多数目光似乎离这个国家很远，但更多地区强国对其发展产生了极大兴趣。乌拉尔斯克的波兰侨民当局直接介入了冲突，试图“平定”该地区，而组成前俄罗斯领土的新兴国家已经开始直接干预，以测试国际社会对它们的保护利益。大草原已经燃起熊熊烈火，其命运掌握在为之奋斗不已的少数勇敢之人手中。"
 WORLD.41043.a:0 "我们尽快必须有所行动。"
 WORLD.41043.b:0 "希望哈萨克斯坦能挺过去。"
 WORLD.41044.t:0 "[Get_newspaper_header]《洛奇》上映"
 WORLD.41044.desc:0 "遍布全国的美国人挤进狭小的电影院，为了有机会观看这个国家的下一个好莱坞大热电影，一个名叫《洛奇》的小成本影片。\n\n这部电影由演员兼导演西尔维斯特·史泰龙制作，讲述了洛奇·巴尔博亚的事业，他是布鲁克林街头一名奋斗的拳击手，以及他在德尔夫·艾希曼统治下的冠军之路。虽然这位挑战者在他的旅程中面临了许多挫折，包括他最好的朋友阿波罗·奎迪的去世，但故事以洛奇在德国的首都日耳曼尼亚击败艾希曼，为自己和他的国家赢得了冠军而结束。\n\n尽管有人因其明显的亲美情感而批评《洛奇》，但这部电影在国内外都证明是一个巨大的票房成功，巩固了美国在持续的冷战中的文化重要性。"
 WORLD.41044.a:0 "他们只能在幻想中击败我们！"
 WORLD.41044.b:0 "一个鼓舞人心的故事，还是美国的宣传？"
 WORLD.41045.t:0 "[Get_newspaper_header]《灰色黄昏》上映"
 WORLD.41045.desc:0 "今天，成群的美国人正在电影院观看最近上映的一部电影：《灰色黄昏》。该电影设定在一个平行宇宙中，大日耳曼国成功发动了对美国的海空入侵。影片以科罗拉多州的乡村为背景，围绕着一群从高中生变成抵抗战士的年轻人展开，他们发起游击战，与入侵的德国人展开战斗。\n\n尽管该电影在美国国内创下了票房纪录，但批评家们指出影片的制作粗糙，更像是“俗气”的作品，而不是真正的电影。尽管在国内取得了巨大成功，但在德国国内，甚至在其势力范围内，该电影的放映被直接禁止。相比之下，该片在亚洲市场取得了一定的成功，向好莱坞表明亚洲或许是一个新的未开发市场，适合未来的电影发行。"
 WORLD.41045.a:0 "蜜獾！战斗！"
 War_Declaration.1.t:0 "[Get_newspaper_header]赤色黎明行动"
 War_Declaration.1.desc:0 "在西俄战争结束数十年后，苏联向全世界宣布在大元帅格奥尔基·朱可夫的小心领导下再次发动了对欧洲的进攻。随着这场代号“赤色黎明”的行动开始，久经沙场的红军已经越过了莫斯科维恩辽阔的边界线，准备与国防军进行生死决斗。\n\n在[WRS.capital.GetName]，朱可夫元帅发表了震撼人心的演讲。他呼吁所有有能力上战场的苏联儿女加入到击垮德国暴政的斗争中，将他们神圣的祖国从法西斯的压迫下解放。另一边，德国方面也已动员起来，对抗他们的宿敌。元首[GER.GetLeader]信誓旦旦地承诺，俄国人的叛乱将被迅速而无情地镇压。全世界都屏住了呼吸，不无敬畏地观望两个人类历史上最庞大的帝国为欧洲的未来而互相征伐。"
 War_Declaration.1.a:0 "赤色黎明横扫欧洲"
 War_Declaration.1.b:0 "他们的土地，他们的人民，他们的血。"
 War_Declaration.1.c:0 "又一场毫无意义的犹太-布尔什维克叛乱。"
 War_Declaration.2.t:0 "[Get_newspaper_header]第二次伟大的卫国战争"
 War_Declaration.2.desc:0 "今天上午，世界震惊不已，因为前不久才重建的苏联在大元帅图哈切夫斯基的领导下宣布与大日耳曼国处在敌对状态。边境驻军已经被击溃，德国殖民者正大批大批地逃往德国本士以寻求庇护。但即便如此，他们也难逃一死，因为苏联毫不掩饰地使用化学和生物武器攻击德国本土，杀死了数千人并严重破坏了补给线。\n\n据报道，元首十分愤怒并责令陆军“让俄国人以十倍代价偿还无辜德国百姓的生命”。OFN也谴责了这些针对平民的袭击，但对苏援助却没有丝毫减少。毫无准备的德国国防军在大元帅和他领导的渴望复仇的红军面前几乎毫无还手之地。国际观察家们担心图哈切夫斯基的行动可能会让全世界迈入暴力革命的时代。"
 War_Declaration.2.a:0 "黑暗的幽灵降临欧洲。"
 War_Declaration.2.b:0 "纳粹主义的末日！"
 War_Declaration.2.c:0 "元帅是不长记性吗？"
 War_Declaration.3.t:0 "[Get_newspaper_header]俄罗斯共和国对德国宣战！"
 War_Declaration.3.desc:0 "自由俄罗斯共和国领导人亚历山大·雅科夫列夫在瑟克特夫卡尔发表衷心讲话后正式向大日耳曼国宣战，俄罗斯的民主迎来了第一次重大考验。尽管许多人怀疑真正的民主是否会完全回归俄罗斯，但科米共和国却从废墟中崛起，并成功地将破碎的俄罗斯土地统一起来。现在，他们面临着迄今为止最大的威胁，试图将“法西斯威胁”赶出东欧，解放德国暴政下的被压迫人民。\n\n元首谴责此次入侵是“犹太-布尔什维克又一次摧毁雅利安种族的阴谋”，而国际观察家则赞扬俄罗斯政府为建立合法民主的俄罗斯所做的努力。无论如何，很明显俄罗斯的真正民主已经到了最后的考验。它是否能够克服困难并实现其理想还有待观察。"
 War_Declaration.3.a:0 "民主能胜利吗？"
 War_Declaration.3.b:0 "民主的大考验。"
 War_Declaration.3.c:0 "他们愚蠢的希望将在德国国防军的铁蹄下破灭。"
 War_Declaration.4.t:0 "[Get_newspaper_header]俄罗斯共和国对德国宣战！"
 War_Declaration.4.desc:0 "自由俄罗斯共和国领导人康斯坦丁·卡图舍夫在瑟克特夫卡尔发表衷心讲话后正式向大日耳曼国宣战，俄罗斯的民主迎来了第一次重大考验。尽管许多人怀疑真正的民主是否会完全回归俄罗斯，但科米共和国却从废墟中崛起，并成功地将破碎的俄罗斯土地统一起来。现在，他们面临着迄今为止最大的威胁，试图将“法西斯威胁”赶出东欧，解放德国暴政下的被压迫人民。\n\n元首谴责此次入侵是“犹太-布尔什维克又一次摧毁雅利安种族的阴谋”，而国际观察家则赞扬俄罗斯政府为建立合法民主的俄罗斯所做的努力。无论如何，很明显俄罗斯的真正民主已经到了最后的考验。它是否能够克服困难并实现其理想还有待观察。"
 War_Declaration.4.a:0 "自由能胜利吗？"
 War_Declaration.4.b:0 "俄罗斯再一次为自由而战！"
 War_Declaration.4.c:0 "愚蠢的理想主义者！"
 War_Declaration.5.t:0 "[Get_newspaper_header]主权行动"
 War_Declaration.5.desc:0 "在俄罗斯统一和征服边境地区之后发生的一系列事件中，斯维特兰娜·斯大林娜政府决定向大日耳曼国宣战。这一消息是通过广播向俄罗斯人民发布的，斯大林娜政府劫持了全国所有广播电台，将这一消息广泛传播。\n\n随着军队已经在路上，斯大林娜呼吁俄罗斯人民抵抗并反击，因为正义的反抗时刻终于到来了。政府代表斯大林娜认为，纳粹对西俄罗斯的统治是“对重建计划的外来干涉”，正在进行的军事行动是去极端化过程的一部分，将使民主统治在未来蓬勃发展。\n\n德国表示，陆军将努力推进至A-A线，俄罗斯人将亲身体验到更新的帝国的无与伦比的力量。"
 War_Declaration.5.a:0 "解放之战？"
 War_Declaration.5.b:0 "旧血脉永不遗忘。"
 War_Declaration.5.c:0 "她会像她父亲一样被人遗忘。"
 War_Declaration.6.t:0 "[Get_newspaper_header]铁娘子转向西方"
 War_Declaration.6.desc:0 "经过长期的准备和自由共和国多次宣布希望在俄罗斯被占领地区“恢复民主权威和秩序”之后，俄罗斯共和国现在再次与德国交战。在斯维特兰娜·斯大林娜的领导下，政府声称其行动是确保和平未来所必需的，因为在“铁娘子”斯大林娜看来，国家社会党所谓的“固有的激进主义”如果不加以制止，将导致世界陷入另一场全球冲突。德国对敌对行动的出现做出了回应，表明与俄罗斯的战争不会是一场艰难的战争，陆军将在不到八周的时间内抵达瑟克特夫卡尔。当步枪噼啪作响，坦克在莫斯科专员辖区的田野上隆隆作响时，欧洲命运的最后一局似乎正在上演；自由世界只能希望有一个理想的结果。"
 War_Declaration.6.a:0 "只为终结激进主义……"
 War_Declaration.6.b:0 "我们最后的考验。"
 War_Declaration.6.c:0 "必须碾碎这个铁娘子！"
 War_Declaration.7.t:0 "[Get_newspaper_header]苏维埃联邦进攻团结协定！"
 War_Declaration.7.desc:0 "俄罗斯再次向西行进。这不仅是为了俄罗斯本身，也是为了在马克思主义花园中崛起的伟大、进步的超视文化。一条高带宽的无线电信息向世界传达了对“反人类主义反动势力”的战争宣言，并宣布联邦打算在东欧传播其超视文化。\n\n元首谴责联邦为“斯拉夫蛮族”，并承诺保卫德国人民免受“国际犹太-布尔什维克思想的新表现”的侵害。虽然一些国际观察员将联邦描述为“不比布哈林政权好到哪里去”，但自由国家组织似乎准备在这最新的冷战现实政治中支持联邦。随着联邦士兵的前进，进步的浪潮也在推进。人类是否准备应对这股逆流，还有待观察。"
 War_Declaration.7.a:0 "日丹诺夫的展望能实现吗？"
 War_Declaration.7.b:0 "“没人能阻挡我们。通向星辰的道路陡峭而危险，但我们并不畏惧！”"
 War_Declaration.7.c:0 "他们的技术不会成为他们的救赎。"
 War_Declaration.8.t:0 "[Get_newspaper_header]工人的进军"
 War_Declaration.8.desc:0 "斯维特兰娜·布哈林娜正式宣布苏维埃社会主义共和国联盟与大日耳曼国处于战争状态，世界再次震惊。尽管俄罗斯在不到五年前结束了长达二十年的残酷军阀统治，但布哈林娜坚信，她的国家已经做好了与世界超级大国之一发生全面武装冲突的准备。\n\n世界各地对这一宣言的反应各不相同。在日耳曼尼亚，元首宣称“劣等人的国家将面临与她父亲三十年前的国家相同的命运”，并承诺为他们的民众带来迅速而决定性的胜利，而OFN则向苏联伸出了谨慎的支援之手。然而，尽管存在种种偏见，欧洲的未来显然取决于这场冲突的结果。"
 War_Declaration.8.a:0 "仇人相见……"
 War_Declaration.8.b:0 "在红军面前颤抖吧！"
 War_Declaration.8.c:0 "女儿的愚蠢行为。"
 War_Declaration.9.t:0 "[Get_newspaper_header]王翼弃兵"
 War_Declaration.9.desc:0 "随着东欧大戏的终局将至，全球目光聚焦于联盟的西部剧场。米哈伊尔·苏斯洛夫，刚完成再统一的苏联总理，以边境冲突和攻击行为为由，正式对德宣战，这可能是十年来世所未见的最大规模战争。\n\n尽管这位傀儡大师更喜欢潜伏在阴影中，但战争终将由狂野的暴力决定胜负。尽管如此，苏斯洛夫仍将他独特的技能展示在东线战场上，其结果便是数位高级德国官员和军官因被注射钚毒素而致死。俄罗斯人民只能祈祷这位象棋大师正确地计算局面，只因俄罗斯和马克思主义命悬一线。 "
 War_Declaration.9.a:0 "人类史上规模最大的一盘棋。"
 War_Declaration.9.b:0 "兵F4。"
 War_Declaration.9.c:0 "最难赢的一局棋是赢了的一局。"
 War_Declaration.10.t:0 "[Get_newspaper_header]大欧亚战争"
 War_Declaration.10.desc:0 "俄罗斯的土地再次回荡着战争的鼓声。欧亚国的领袖列夫·古米廖夫宣布了欧亚首场重大考验的开始：对大日耳曼国的战争。\n\n数千辆装甲车队穿越莫斯科的边境，德军拼命抵抗欧亚军队的冲击。布里亚特人、卡尔梅克人和哈萨克人与俄罗斯人并肩作战，无差别地屠杀德国殖民者。\n\n国际观察员在支持俄罗斯这匹黑马努力构建一个“超民族国家”的努力上犹豫不决，而其他人则公开支持古米廖夫粉碎大日耳曼国的努力。欧亚国必须在战火中证明自己，否则只能屈服于更高贵的民族。"
 War_Declaration.10.a:0 "两个大陆，一场战争。"
 War_Declaration.10.b:0 "大陆间的联系逐渐加强。"
 War_Declaration.10.c:0 "买一送一。"
 War_Declaration.11.t:0 "[Get_newspaper_header]俄罗斯共和国处于战争状态"
 War_Declaration.11.desc:0 "伊戈尔·沙法列维奇的俄罗斯共和国宣布对德意志第三帝国发动战争，以种族灭绝、殖民主义和反俄行为作为战争理由。将近两周前，总统在共和国的全国电视和广播上发表了一次衷心的讲话，呼吁俄罗斯人民支持努力，解放他们在西方被占领的领土与被奴役的同胞。在一次简短的全民公投后，俄罗斯公众投票赞成战争，使沙法列维奇总统可以行使行政权力，单方面命令俄罗斯武装力量越过边境。\n\n驾驶着美国坦克、手持日本制造步枪的士兵有条不紊地进入莫斯科专员辖区，一如既往地有纪律和斗志。这将不是一场世界末日般的战争，而是一场洗净了的、冷酷无情的争夺民族霸权的斗争。"
 War_Declaration.11.a:0 "文明对抗文明……"
 War_Declaration.11.b:0 "向莫斯科进军！"
 War_Declaration.11.c:0 "碾碎他们。"
 War_Declaration.12.t:0 "[Get_newspaper_header]泰坦之争"
 War_Declaration.12.desc:0 "俄罗斯民族苏维埃共和国主席伊万·谢罗夫宣布第二次西俄战争开始。一列列坦克和一排步兵在秩序社会主义国家的旗帜下猛攻莫斯科专员辖区，他们心中只有一个目标：夺回所有前苏联领土，而谢罗夫摆脱传统布尔什维克主义是这一目标的核心部分。\n\n谢罗夫主席向世界承诺，帝国主义将被秩序社会主义的力量击倒，他们的第一个敌人是几十年来一直恐吓俄罗斯人的邪恶帝国。另一方面，德国发表声明，宣称新的俄罗斯国家是“民族社会主义的劣质品”，德国国防军将在不到两个月的时间内跨过乌拉尔山脉。"
 War_Declaration.12.a:0 "憎恶对阵憎恶......"
 War_Declaration.12.b:0 "对秩序社会主义的伟大考验开始了！"
 War_Declaration.12.c:0 "民族社会主义不会容忍这样的劣质品！"
 War_Declaration.13.t:0 "[Get_newspaper_header]人民的沙皇为解放而战！"
 War_Declaration.13.desc:0 "一条消息如同洪水般席卷了全世界的新闻头条：俄罗斯帝国对德国宣战。许多人都预料到了这个雄心勃勃的罗曼诺夫家族在俄罗斯的军阀混战中巩固权力、并建立起君主立宪国家之后的这个结果。帝国军队带着焕然一新的俄罗斯精神，伴随着赞美沙皇的歌曲的旋律行进，冲垮一切拦阻之敌。\n\n在德国陆空军在莫斯科专员辖区重新集结，准备迎接30年来与俄罗斯军队的第三次交战的同时，政府开动宣传引擎，鼓噪沙皇弗拉基米尔三世过去一直在与德国合作。人们尚不清楚这种宣传攻势对俄罗斯军队会有什么影响，但有传言称此举产生了反作用，因为专员辖区内的许多温和派合作者都已倒戈卸甲，站到了沙皇一边。"
 War_Declaration.13.a:0 "帝国已经站稳了脚跟；该看看是否是土鸡瓦犬了。"
 War_Declaration.13.b:0 "当尘埃落定之际，沙皇的怜悯将点燃解放的烈焰。"
 War_Declaration.13.c:0 "这个世界已经容不下罗曼诺夫家族了。"
 War_Declaration.14.t:0 "[Get_newspaper_header]帝国复兴之战开始"
 War_Declaration.14.desc:0 "1918 年，沙皇尼古拉二世及其家族在伊帕捷夫宫中死于布尔什维克之手。罗曼诺夫王朝被认为是一个永远消亡的王朝，俄罗斯的君主制也随之消失。然而，这些长期以来的观念在今天被证明是错误的，因为统一后的俄罗斯帝国在沙皇弗拉基米尔·罗曼诺夫的领导下，承诺恢复帝国的正式荣耀，并向大日耳曼国正式宣战，要求收复其西部领土。\n\n白军向西进军，眼睛紧盯着被毁坏的第三罗马；德国则匆忙调集军队，将俄国人的进攻打回帝国边境。虽然有人质疑沙皇弗拉基米尔帝国野心的真正动机，但没有人能够质疑这场战争对欧洲人民造成的真正影响。这是俄罗斯霸权的复活，还是罗曼诺夫王朝的垂死挣扎？\n"
 War_Declaration.14.a:0 "第三罗马的重生？"
 War_Declaration.14.b:0 "为了沙皇的荣耀！"
 War_Declaration.14.c:0 "我们已经击败过他们一次了，再击败一次轻而易举。"
 War_Declaration.15.t:0 "[Get_newspaper_header]重回1914"
 War_Declaration.15.desc:0 "曾是俄罗斯帝国的这个庞然大物——被认为在十年前就已经完全死去——已经被俄罗斯王位的最后一位继承者弗拉基米尔三世一点一点地重新整合起来。尽管真正幸存的这个罗曼诺夫明面上掌管着帝国，但长期以来人们一直怀疑该国的真正权力掌握在政府内部的团结党手中——当亚历山大·索尔仁尼琴（而不是沙皇）宣布与大日耳曼国开战时，这一怀疑几乎得到了证实。\n\n日耳曼尼亚最高统帅部发表声明予以回应，承诺在不到一个月的时间内“迅速碾碎腐朽的君主制尸体”。尽管国际观察家可能对索尔仁尼琴的内部动机和目标存在分歧，但所有人都同意一件事——这可能是第二次世界大战以来世界上最血腥的冲突。"
 War_Declaration.15.a:0 "帝国主义的新曙光，还是过去的幽灵？"
 War_Declaration.15.b:0 "为布列斯特-立陶夫斯克复仇！"
 War_Declaration.15.c:0 "傀儡沙皇将会屈服。"
 War_Declaration.16.t:0 "[Get_newspaper_header]“兄弟”阋墙"
 War_Declaration.16.desc:0 "自从罗斯国成为团结协定的观察员以来已经过了几个月。国际观察员、外交政策专家、普通报纸读者甚至一些学童都预测德国人会把罗斯国的人民当作牲口。在短短几个月内，德国人以种族兄弟情谊的名义，掠夺了罗斯国的土地，渗透到罗斯国的军队中，并将所剩无几的生产资料转向德国，为日尔曼尼亚生产廉价消费品。\n\n同样的观察员们惊讶地看到罗斯国坦克越过了莫斯科专员辖区的边境。离奇的报道声称，元首古特鲁姆·瓦格纳宣称自己是希特勒的转世，并攻击了德国，以“去除其虚假的雅利安血统”。燃烧的村庄点缀在乡间，大批难民已经逃往东方专员辖区和德国本土。最终，只有一个民族社会主义能够战胜。"
 War_Declaration.16.a:0 "真是奇怪而悲剧的讽刺。"
 War_Declaration.16.b:0 "我们将证明我们的价值。"
 War_Declaration.16.c:0 "劣等人吃错药了。"
 War_Declaration.17.t:0 "[Get_newspaper_header]极北风暴"
 War_Declaration.17.desc:0 "当新异教主义领域极北国成功地重新统一俄罗斯时，边界地区相对和平。起初，大祭司维利米尔的威胁似乎只是空洞的承诺。然而，在一个宁静的夜晚，德国边境巡逻队被满是符文的坦克和卡车所带来的袭击所擦肩而过，进入了帝国专员区。\n\n作为回应，德国军队已经展开了行动，并建立了防御工事，高级祭司维利米尔发表了一场演讲，承诺要清除亚洲德国人及其犹太复国主义统治者，夺回他们应得的土地。同时，元首号召德国人民保卫他们的国家免受侵略者的入侵，并承诺迅速而彻底地击败这些野蛮的疯子。\n\n此刻，全世界都静静地注视着黑云笼罩着世界的未来。"
 War_Declaration.17.a:0 "诸神黄昏"
 War_Declaration.17.b:0 "优等种族，独一无二！"
 War_Declaration.17.c:0 "优等种族，独一无二！"
 War_Declaration.18.t:0 "[Get_newspaper_header]俄罗斯共和国对德国宣战！"
 War_Declaration.18.desc:0 "没人能想象到一个匿名的诗人会领导俄罗斯人民解放委员会的领地，或者说这位诗人会带领新共和国发动一场对法西斯的救赎战争，而这些法西斯正是曾经供养俄罗斯解放军的人。随着坦克、卡车和步兵踏上西进的十字军之旅，米莱蒂·济科夫总统宣布俄罗斯正式对德国开战。济科夫总统的言辞，虽然隐藏在萨马拉宣言的原则之中，但呼吁东欧地区的全面自决，并要求所有俄罗斯人抛开意识形态和政治以支持解放事业。\n\n德国的回应一如既往地迅速。外交部表示，陆军将会“消灭犹太威胁，将每个犹太复国主义侵略者吊在莫斯科的绞刑架上”。但解放军从未输过一场战争，不同于国防军。"
 War_Declaration.18.a:0 "俄罗斯大地上的灵魂危在旦夕。"
 War_Declaration.18.b:0 "通向自由之路上并非没有代价。"
 War_Declaration.18.c:0 "蛇无论蜕多少次皮，都还是蛇......"
 War_Declaration.19.t:0 "[Get_newspaper_header]束缚解除"
 War_Declaration.19.desc:0 "纳粹在俄罗斯征服中诞生的私生子们已经将枪口对准了他们的老主人。在一份谦逊的新闻公告中，俄罗斯共和国总统、俄罗斯人民解放委员会领导人谢尔盖·布尼亚琴科宣布：“解放委员会必须履行其使命”，然后对大日耳曼国公开宣战。\n\n随着俄罗斯解放军的坦克和军靴进军莫斯科专员辖区，俄罗斯庞大的工业准备着要吞噬她的敌人。占据俄罗斯经济大部分的臃肿的联合企业已经宣布强制加班和七天工作制，作为一项在战争期间为了暂时提高产量而采取的临时措施。俄罗斯无疑在经济和工业方面做好了重新夺回莫斯科的准备。唯一的问题是她的指挥官和士兵是否有足够的荣誉和决心来赎回自己。"
 War_Declaration.19.a:0 "叛徒的故事。"
 War_Declaration.19.b:0 "在这个艰难试炼的时刻，我们必须决定我们祖国的命运、我们人民的命运以及我们个人的命运。"
 War_Declaration.19.c:0 "叛徒的行动都在预料之中。"
 War_Declaration.20.t:0 "[Get_newspaper_header]民族复兴之战"
 War_Declaration.20.desc:0 "今天，米哈尔伊·奥克坦和俄罗斯国家领导层正式宣布对德国宣战，称其违反了贸易法律，占领了“精神上属于俄罗斯的土地”，并需要“让除俄罗斯之外的整个东欧的人民也享受到黄金灯的光芒”。破旧不堪的运兵船、破败的坦克和半饿不堪的士兵现在穿着几十年前的靴子行军进入莫斯科。\n\n一个统一的俄罗斯的理想是一种崇高的希望，仍然点亮着那些在囚徒国王领地中幸存的灵魂。然而，很少有人相信奥克坦进行这场战争是为了实现任何国家目标。更有可能的是，他找到了某种方式从战争中获利。即使梦想也有代价要付出，而这个噩梦的代价是鲜血和黄金，将由俄罗斯人民而不是他们吝啬的主人承担。"
 War_Declaration.20.a:0 "所以，一把俄国产的步枪在黑市上要多少钱呢？"
 War_Declaration.20.b:0 "战争就是生意。"
 War_Declaration.20.c:0 "愚蠢的尝试。"
 War_Declaration.21.t:0 "[Get_newspaper_header]伟大的俄罗斯解放战争开始了！"
 War_Declaration.21.desc:0 "东欧传来了一则震惊全球的消息。由大元帅帕维尔·巴托夫领导统一的俄罗斯宣布对德国发动战争，他命令红军前进，将祖国从德国的暴政中解放出来。\n\n在斯维尔德洛夫斯克市，帕维尔·巴托夫元帅站在成千上万人的面前发表了激动人心的演讲，讲述了俄罗斯人民的坚韧和不屈意志。他随后呼吁全国的俄罗斯人加入战斗，为俄罗斯服役，从第三帝国的压迫中拯救他们的民族。德国已经开始动员数百万德国男性向东方派遣，与他们旧日的东方敌人作战。世界再次为德国和俄罗斯为东欧甚至整个世界的命运而战而备受震撼。"
 War_Declaration.21.a:0 "东欧在燃烧……"
 War_Declaration.21.b:0 "拯救俄罗斯！"
 War_Declaration.21.c:0 "一位苏联将军将再次迎来失败。"
 War_Declaration.22.t:0 "[Get_newspaper_header]俄罗斯解放战争开始了！"
 War_Declaration.22.desc:0 "俄罗斯联邦共和国总统鲍里斯·叶利钦在一次激情澎湃的演讲中宣布对德国宣战。叶利钦表示，共和国将利用一切可用手段将德国人驱逐出俄罗斯的合法领土，并让他们为对俄罗斯人民施加的每一天压迫付出代价。巴托夫元帅向世界保证，在冲突的最初几个月内不会使用战略武器。这个双头政权正在一致行动，争取支持自决的事业，解救人们免受纳粹统治的制度化种族灭绝。\n\n大日耳曼国谴责了俄罗斯的入侵，称叶利钦是一个被自身堕落的恶习误导的\"好战的小丑\"，并承诺立即阻止俄罗斯的前进。只有时间能告诉我们，俄罗斯高层指挥部的英明决策是否足以扭转局势，使共和国处于有利地位。"
 War_Declaration.22.a:0 "凤凰浴火重生。"
 War_Declaration.22.b:0 "我们最后的机会。"
 War_Declaration.22.c:0 "又是一次毫无意义的自由之争。"
 War_Declaration.23.t:0 "[Get_newspaper_header]卡冈诺维奇发布第227号命令"
 War_Declaration.23.desc:0 "多年以来，在曾经被边缘化的斯大林主义的影响下，苏联一直在为“第二次伟大的卫国战争”做准备、迅速进行军事化和工业化。世界焦急地凝望着，等待苏德之间注定不可避免的冲突爆发，直到那一天来临。苏联总理[RUS.GetLeader]在位于临时首都秋明的政治局礼堂里，宣布苏联对德开战，号召庞大的红军越过莫斯科维恩的边界，用一切必要的手段解放他们光荣的祖国。“不许撤退，没有休整，只有不可战胜的红军不断前进的步伐。”"
 War_Declaration.23.a:0 "钢铁的碰撞"
 War_Declaration.23.b:0 "绝不后退！"
 War_Declaration.23.c:0 "整座腐朽的建筑将会轰然倒塌。"
 War_Declaration.24.t:0 "[Get_newspaper_header]赫鲁晓夫对德宣战"
 War_Declaration.24.desc:0 "苏维埃联盟总书记尼基塔·赫鲁晓夫在秋明的新的苏维埃社会主义共和国联盟中央政府向全世界发出公告，宣布开始第二次伟大的卫国战争。赫鲁晓夫通过在布哈林统治期间神秘死亡的旧布尔什维克约瑟夫·斯大林的愿景，宣布了他要为旧联盟的失败报仇、拯救苏联的意图。\n\n红军现在正向西进军，意在夺回被德国奴役了30多年的破旧首都莫斯科。现在，全世界都在恐惧和期待着一场可能重塑欧洲未来的战争。"
 War_Declaration.24.a:0 "德国余寿将尽？"
 War_Declaration.24.b:0 "开始对日耳曼尼亚的远征。"
 War_Declaration.24.c:0 "他们将像布哈林一样被碾碎。"
 War_Declaration.25.t:0 "[Get_newspaper_header]大审判"
 War_Declaration.25.desc:0 "经过数月的传言和俄罗斯的准备，关于黑色联盟的第一批士兵和坦克跨越莫斯科专员辖区边界的报道开始出现，这是民族复兴政府几十年准备的巅峰时刻。最初的报告充斥着无情的战术和源源不断的军事力量，还有有关化学武器和脏弹袭击的未经证实的传言，甚至波及平民目标。\n\n德国元首在日耳曼尼亚发表了一次演讲，谴责黑色联盟“毫无意义和残酷的破坏”，而国防军的全面动员令已开始将大量军队调往东欧。俄罗斯领袖迪米特里·亚佐夫毫无放慢攻势之意。随着俄罗斯的“神圣的战争”拉开序幕，这可能预示着欧洲的终结。"
 War_Declaration.25.a:0 "俄罗斯的终焉之战"
 War_Declaration.25.b:0 "起来，巨大的国家，消灭万恶匪群！"
 War_Declaration.25.c:0 "我们必须准备好。"
 War_Declaration.26.t: "[Get_newspaper_header]俄罗斯联邦进攻团结协定"
 War_Declaration.26.desc: "昨日，全球陷入错愕，因为新成立的俄罗斯联邦总统瓦西里·舒克申已正式向大日耳曼国及其总督辖区宣战。总统表示需要将东欧从德国的压迫下解放出来，纠正这个很久以前就犯下的错误。\n\n作为回应，大日耳曼国已经开始针对他们东边的老对手进行动员，承诺将在区区数周内再次毁灭俄罗斯军队。全世界都屏住了呼吸，因为这是历史上第一次两个拥核大国的直接对抗。这可能会是人类历史上最后一场战争。"
 War_Declaration.26.a: "全世界都屏住了呼吸。"
 War_Declaration.26.b: "为了俄罗斯人民的解放！"
 War_Declaration.26.c: "一个理想主义者的无望赌博。"
 War_Declaration.27.t: "[Get_newspaper_header]俄罗斯联邦进攻团结协定"
 War_Declaration.27.desc: "当新成立的俄罗斯联邦的总统亚历山大·波克雷什金向德国和他们的仆从国宣战时，全世界都为之震撼。 总统已经声明从德国手中夺回俄罗斯的合法土地是必要之举，并要消灭像“莫斯科专员辖区”这样的非法国家。  \n \n作为对宣战的回应，德国已经开始动员起来对抗他们的东方宿敌，宣称他们将“在几周内摧毁全部俄军”。 世界屏息以待，因为这两个人类历史上最大的对手，都拥有核武器，为一场很可能是人类有史以来的最后一场战争而决一死战。"
 War_Declaration.27.a: "全世界都屏住了呼吸。"
 War_Declaration.27.b: "我们将把德国付之一炬！"
 War_Declaration.27.c: "准备德国空军！"
 War_Declaration.28.t:0 "[Get_newspaper_header]罗斯王国对德宣战！"
 War_Declaration.28.desc:0 "今天俄罗斯的每个钟都响起两次，意味着罗斯王国已正式对第三帝国宣战。留里克三世国王向自己的人民发表了一次漫长而真挚的讲话，承诺将结束全球范围内的民族社会主义暴政，并将俄罗斯恢复为伟大的国家。成千上万辆装甲车穿越莫斯科平原，高空轰炸机摧毁德国的补给站和后勤中心，给德国带来了毁灭。\n\n德国承诺要迅速结束这次“斯拉夫入侵”，尽管最高统帅部内部的传言描绘了一幅破败和惊讶的画面。尽管国内政治混乱，政策似乎自相矛盾，但国际力量似乎准备支持这个奇怪的王国。目前还不清楚这个过去的遗迹是否有能力捍卫自己的价值观，或者时间的风沙是否会再次吞噬它。"
 War_Declaration.28.a:0 "当我们宣战时……"
 War_Declaration.28.b:0 "当我们疲倦的时候，我们又被那些早已征服的思想所袭击。"
 War_Declaration.28.c: "远古遗迹竟敢挑战我们？"
 War_Declaration.29.t:0 "[Get_newspaper_header]罗斯王国对德宣战！"
 War_Declaration.29.desc:0 "每当今天俄罗斯的钟声响起两次，意味着罗斯王国已正式对第三帝国宣战。罗格涅达女王发誓，她将以她的生命为代价，向数百万观众宣称她将最终消灭纳粹暴君，她的人民将看到俄罗斯崛起为一个伟大的强国。成千上万辆装甲车穿越莫斯科平原，高空轰炸机摧毁德国的补给站和后勤中心，给德国带来了毁灭。\n\n德国承诺要迅速结束这次“斯拉夫入侵”，尽管最高统帅部内部的传言描绘了一幅破败和惊讶的画面。国际观察家对这位年轻女王的评价存在分歧：有些人怀疑她是否有能力领导罗斯军队，而另一些人则称赞她是一位坚定、公正的统治者，是未来女王应该效仿的力量典范。无论好坏，罗格涅达女王都将为俄罗斯的未来铺平道路。"
 War_Declaration.29.a:0 "旧帝国野望重生。"
 War_Declaration.29.b:0 "天佑女沙皇！"
 War_Declaration.29.c:0 "罗斯的鬼魂不会拯救她。"
 War_Declaration.30.t:0 "[Get_newspaper_header]西俄罗斯革命战争开始了"
 War_Declaration.30.desc:0 "今天，一个不寻常的故事迅速成为头条新闻——俄罗斯自由地区向大日耳曼国宣战。作为俄罗斯军阀时代的奇怪副产品，无政府主义“黑军”成功地将布哈林前联盟的不同土地统一在红色和黑色的旗帜下。出于解放同胞的共同意愿，俄罗斯士兵们大举越过荒凉的莫斯科边境，威胁要在他们永无休止的行军中席卷整个欧洲。\n\n国际社会似乎对自由地区的内部运作感到困惑，许多专家对公社“分散”的指挥结构表示“严重疑虑”。尽管如此，很明显德国无意让这种意识形态威胁存在于其家门口。无政府主义能否经受住针对欧洲霸权的第一次气候考验还有待观察。"
 War_Declaration.30.a:0 "安那其妈妈的儿子们再次投入战斗。"
 War_Declaration.30.b:0 "为了安那其妈妈！"
 War_Declaration.30.c:0 "我们将粉碎安那其妈妈。（德语）"
 War_Declaration.31.t:0 "[Get_newspaper_header]红军西进"
 War_Declaration.31.desc:0 "华西列夫斯基，最近统一苏联的领导人，宣布俄罗斯与大日耳曼国之间进入了全面战争状态。目前，有关莫斯科专员辖区边境冲突的报道已经开始涌入，德国最高统帅部正急于作出迅速回应，因为这可能是这个十年以来最严重的危机。\n\n来自苏联各地的士兵们，无论是图瓦人、俄罗斯人还是乌兹别克人，都准备献出自己的生命，彻底消灭欧洲的法西斯主义。他们的刺刀在阳光下闪闪发光。数百万人向西方发起冲锋，钢铁不仅镶嵌在他们的车辆上，也镶嵌在他们的心中，因为全世界都知道：如果红军不能成功，俄罗斯可能会永远失败。这一次，苏联不会失败。"
 War_Declaration.31.a:0 "老兵归乡。"
 War_Declaration.31.b:0 "我们最后的机会。"
 War_Declaration.31.c:0 "放马过来吧，劣等人！"
 War_Declaration.32.t:0 "[Get_newspaper_header]俄罗斯共和国对团结协定宣战！"
 War_Declaration.32.desc:0 "经过多年的压迫和绝望，在莫斯科开始传播希望的耳语之后，俄罗斯共和国正式开始解放东欧！\n\n安德烈·萨哈罗夫在汤姆斯克的家中发表了一场激情澎湃的演讲，成千上万的人群为之震撼。“通过释放个人的全部潜能，俄罗斯如凤凰涅槃般再次崛起！仅仅十年时间，我们将祖国从一个分裂的边缘地区变成了全球科技最先进的国家！世界人民啊！见证进步的真正力量吧！”\n\n作为回应，德国国防军已经动员并迅速投入战斗，对抗科技上更为优越的俄罗斯共和军。全世界都在关注着，好奇地目睹这个地球上最先进的军队与大日耳曼国的对决。"
 War_Declaration.32.a:0 "俄罗斯民主的大考验。"
 War_Declaration.32.b:0 "历经艰辛终成大业"
 War_Declaration.32.c:0 "他们的技术抵挡不住德国人的意志！"
 War_Declaration.33.t:0 "[Get_newspaper_header]俄罗斯共和国向西进军！"
 War_Declaration.33.desc:0 "战争的警报在整个欧洲响起，当俄罗斯共和国的部队越过莫斯科专员辖区边境。今天，迪米特里·谢尔盖耶维奇·利哈乔夫总统在托木斯克议会发表讲话，宣布俄罗斯共和国与大日耳曼国之间爆发战争，这是一场为了从法西斯枷锁中解放欧洲而展开的伟大战争。\n\n德国官员对一个以他们所称之为“栽树”的政府能够与团结协定的军工复合体匹敌感到困惑。大日耳曼国外交部也就俄罗斯共和国的沙龙制度发表了讲话，表示下一个当选的政党将推行一项迫使立即投降的宪法，然而此举并未使德国国防军放松警惕。他们的部队已经与共和国的坦克在莫斯科边境附近展开了交战。"
 War_Declaration.33.a:0 "又一场东方战争。"
 War_Declaration.33.b:0 "阳光穿透雷云，照耀着欧洲大地。"
 War_Declaration.33.c:0 "我们只需往大门踹上一脚……"
 War_Declaration.34.t:0 "[Get_newspaper_header]联邦的突袭"
 War_Declaration.34.desc:0 "莫伊塞·范贝格总统正式在托木斯克市中心的彼得罗夫沙龙宣布，大日耳曼国与俄罗斯联邦之间已经处于战争状态。在理性领域朝着其不可避免的命运向西迈进之际，人道主义军队及其钢铁车队正在莫斯科推进，毫不留情地打败所有对手，展示他们高尚行军的节拍。\n\n德国以不出所料的方式发起了一场宣传运动，将范贝格贴上犹太布尔什维克精英代表的标签，利用他的波兰血统来诋毁和贬低他。他的祖国波兰已经遭受了报复性的攻击。\n\n在沉默了十多年之后，世界目睹了这两个欧洲巨头的决定性冲突。无论结果如何，欧洲的未来将永远改变。"
 War_Declaration.34.a:0 "战争甚至降临在最明智的人身上。"
 War_Declaration.34.b:0 "俄罗斯最伟大的交响乐。"
 War_Declaration.34.c:0 "你的人性将会导致你的失败。"
 War_Declaration.35.t:0 "[Get_newspaper_header]俄罗斯共和国向西进军！"
 War_Declaration.35.desc:0 "今天，世界为令人震惊的消息所吓呆了，俄罗斯联合共和国在达尼尔·卡尔姆斯和巴斯蒂尔党的领导下向德国宣战。巴斯蒂尔沙龙以其愤世嫉俗的政策而闻名，其中包括快速工业化、民主最小化和反工人权利立场。在一个以鄙视那些“未洗净的大众”而闻名的政府中，巴斯蒂尔党将精英主义发展到了近乎意识形态的程度。然而，在莫斯科的街头，将有普通人战斗和流血；被鄙视的无产者将在战场的漩涡中引领俄罗斯的命运。\n\n达尼尔·卡尔姆斯及其沙龙承诺要像干枯的柴火一样粉碎新秩序。德国官员尚未发表任何正式评论。究竟这是出于恐惧还是漠不关心，尚有待观察。"
 War_Declaration.35.a:0 "战争即地狱。"
 War_Declaration.35.b:0 "为了俄罗斯的未来而战。"
 War_Declaration.35.c:0 "无需多虑。"
 War_Declaration.36.t:0 "[Get_newspaper_header]苏联发动第二次伟大的卫国战争"
 War_Declaration.36.desc:0 "历史似乎再次重演，苏维埃社会主义共和国联盟再次与大日耳曼国交战。由布哈林前内务人民委员会主席亨里希·亚戈达领导的伊尔库茨克政府确实可以被视为布哈林已故苏联的合法延续。看来，按照这一点，亚戈达已经认定有必要纠正旧联盟最大的失败。\n\n红军已经开始向专员辖区进军，据报道，在阿斯特拉罕和雅罗斯拉夫尔市附近发生了小规模冲突。随着钢铁与火焰的浪潮席卷帝国边境，德国急需应对俄国人对其东方王位的最后挑战。联盟之歌已达到高潮，双方都知道只有一个人可以统治东欧。"
 War_Declaration.1000.desc:0 "历史似乎再次重演，苏维埃社会主义共和国联盟再次与大日耳曼国交战。由布哈林时期的苏联元帅，亚历山大·华西列夫斯基领导的人民革命委员会成为了苏联的唯一正统政府，这个政府似乎秉承着"军事民主"的理念，建立起了一条以军官为主导的"民主体制"。然而，华西列夫斯基本人的身体却不甚良好，但他只能拖着那积劳成疾的身体与时间赛跑——他甚至有可能看不到战争结束的那一天。元帅正燃烧着他的生命，完成它的祖国赋予他最后的使命——光复故土。\n\n无论如何，红军已经开始向专员辖区进军，据报道，在阿斯特拉罕和雅罗斯拉夫尔市附近发生了大规模冲突。随着钢铁与火焰的浪潮席卷帝国边境，德国急需应对俄国人对其东方王位的最后挑战。联盟之歌已达到高潮，双方都知道只有一个人可以统治东欧。"
 War_Declaration.1000.b:0 "生者不当座上宾，死者却做棺中人。"
 
 War_Declaration.36.a:0 "第二回合。"
 War_Declaration.36.b:0 "我们的胜利不会辜负埋在莫斯科土壤下的数百万人。"
 War_Declaration.36.c:0 "列宁虚弱的创造物徒劳地咽下最后一口气。"
 War_Declaration.37.t:0 "[Get_newspaper_header]苏维埃共和国联盟对德宣战！"
 War_Declaration.37.desc:0 "许多人将十月革命视为达到目的的一种手段：数百人迈向一个不是建立在企业精英而是工人阶级支持的社会的道路上的第一步。今天，这一伟大旅程达到了顶峰，苏联总理瓦列里·萨布林命令他的军队不仅为俄罗斯的命运而战，而且为社会主义本身的命运而战。\n\n随着红军士兵再次越过边境进入莫斯科专员辖区，德国承诺不惜一切代价“迅速而无情地镇压布尔什维克九头蛇”。无论这个新的、复兴的联盟能否再次战胜它的死敌，有一点是肯定的：争夺布哈林遗产的战斗才刚刚开始。"
 War_Declaration.37.a:0 "萨布林能否救赎前任的灵魂？"
 War_Declaration.37.b:0 "战斗仍将继续！"
 War_Declaration.37.c:0 "布哈林的遗产将永远支离破碎。"
 War_Declaration.38.t:0 "[Get_newspaper_header]苏维埃共和国联盟对德宣战！"
 War_Declaration.38.desc:0 "许多人将十月革命视为达到目标的手段，是通往一个更加公平和平等的俄罗斯之漫漫长路的第一步，一个建立在列宁和马克思基础上的社会，一个没有种族偏见、以提高无产阶级地位为基础的社会。\n\n瓦列里·萨布林似乎迈出了第二步，他在乌兰乌德的家中向德国宣战。苏联军队涌入莫斯科专员辖区边境，为自由的俄罗斯做最后一战。大日耳曼国宣布坚定致力于“彻底结束斯拉夫威胁”，而OFN观察员们对于这个不稳而脆弱的帝国是否能经受住另一次重大打击表示怀疑。\n\n当革命的火焰蔓延到德国边境时，战斗似乎再次开始——这一次，为了整个俄罗斯的命运而战。\n"
 War_Declaration.38.a:0 "列宁的遗产。"
 War_Declaration.38.b:0 "战斗仍将继续！"
 War_Declaration.38.c:0 "列宁的遗产将被永远埋葬。"
 War_Declaration.39.t:0 "[Get_newspaper_header]帝国反击！"
 War_Declaration.39.desc:0 "今天，当俄国沙皇米哈伊尔二世和首相阿纳托利·索布恰克在皇宫宣布向大日耳曼国发动“帝国收复”战争，并承诺“夺回陛下应得的土地，解放被奴役的臣民”时，整个欧洲都惶恐不安。宣战后不久，就有俄罗斯坦克和飞机越过莫斯科边境的报道。\n\n德国官员表示，他们将轻而易举地击败敌人的军队，而这个敌人曾经“被仅仅布尔什维克击溃”。与此同时，海外的俄罗斯移民和哥萨克人脱下旧军装，涌向祖国，为他们的事业进行最后一次战斗。当欧洲过去的霸权与现在的霸权发生冲突时，整个世界都在焦急地等待着；两者的命运都将在战火中铸就。"
 War_Declaration.39.a:0 "罗曼诺夫家族能笑到最后吗？"
 War_Declaration.39.b:0 "前进！为了沙皇！"
 War_Declaration.39.c:0 "我们是时候完成布尔什维克未能完成的事情了……"
 War_Declaration.40.t:0 "[Get_newspaper_header]伟大的斯拉夫复兴战争开始了！"
 War_Declaration.40.desc:0 "在俄罗斯的元首康斯坦丁·罗扎耶夫斯基和俄罗斯法西斯党的命令下，新的俄罗斯军队已经开始向西进军。宣布“从德国国防军的压迫中完全收复斯拉夫民族的合法领土”。罗扎耶夫斯基已经动员了整个全俄军队前往莫斯科，夺回西部属于优等的斯拉夫民族的土地。\n\n罗扎耶夫斯基宣誓这场战争不会像苏联与大日耳曼国的战争那样结束，因为俄罗斯已经不再被所谓“犹太—布尔什维主义”的污点感染，这种感染据说“削弱了斯拉夫人民的精神”。\n\n无论结果如何，全世界似乎都对这两个纳粹巨人在东欧神圣的土地上再次交战感到惶恐。"
 War_Declaration.40.a:0 "两个民族，同种意识形态，一场战争。"
 War_Declaration.40.b:0 "不能再继续软弱下去了。"
 War_Declaration.40.c:0 "他们以为伪雅利安主义的幌子能拯救他们？"
 War_Declaration.41.t:0 "[Get_newspaper_header]大领袖对抗元首！"
 War_Declaration.41.desc:0 "没有人想到，贫穷、冰天雪地的马加丹会成为俄罗斯继承人的摇篮，然而，马特科夫斯基现在不仅是俄罗斯的统治者，还是欧洲的潜在主人。今天早些时候，俄国军队大举越过帝国边境，正式拉开了第二次西俄战争的序幕。马特科夫斯基谨慎的外交手腕和经济上的实用主义使他走到了今天这一步，但这场战争不可能依靠他的外国支持者取得胜利。\n\n德国迅速做出反应，调集后备力量保卫莫斯科的边境，并派出德国空军横扫俄罗斯东部的广大地区。尽管大多数人似乎都有理由反对德国在欧洲称霸，但一些观察家认为，如果马特科夫斯基的部队取得胜利，那么他的法西斯倾向和冷酷无情的手段只会以一种更精简、更理智的威胁取代不稳定的纳粹威胁。俄罗斯的命运岌岌可危，只有时间才能决定这两位独裁者的命运。\n"
 War_Declaration.41.a:0 "让我们希望这场战争带来真正的变革，而不只是调整了摆设。"
 War_Declaration.41.b:0 "为了民族的解放！"
 War_Declaration.41.c:0 "物竞天择，适者生存。"
 War_Declaration.42.t:0 "[Get_newspaper_header]俄罗斯民族共和国突袭纳粹占领下的欧洲"
 War_Declaration.42.desc:0 "俄罗斯民族共和国与大日耳曼国之间脆弱的和平在数百万俄罗斯士兵跨越莫斯科专员辖区边境的行动中破裂。在俄罗斯正迈向前所未有的动员规模之际，尼古拉·佩特林总统团结俄罗斯人民，希望他们履行解放被占领的东欧地区的“庄严承诺”。\n\n自由国家组织对俄罗斯的对抗德国暴政的“伟大西征”事业表达了支持，认为这场战争是自由世界数十年来反抗纳粹主义的最终巅峰。初步报告充满了持续不断的军事进攻，德军努力对抗俄罗斯军队。俄罗斯加入了保卫自由之光的绝望战斗，而这次，他们可能会见证整个帝国的崩溃。"
 War_Declaration.42.a:0 "为了自由的最后斗争。"
 War_Declaration.42.b:0 "不自由毋宁死。"
 War_Declaration.42.c:0 "为永远维护民族社会主义而进行的最后一战。"
 War_Declaration.42.d:0 "我们最后的机会"
 War_Declaration.43.t:0 "[Get_newspaper_header]俄罗斯合众国进攻团结协定"
 War_Declaration.43.desc:0 "出人意料的是，俄罗斯合众国在雇佣兵米切尔·沃贝尔三世的领导下，对团结协定宣战。\n\n沃贝尔在马加丹的家中发表了讲话，表示就像他的祖国有华盛顿一样，俄罗斯需要有莫斯科。他进一步表示，莫斯科专员辖区被大日耳曼国非法占领，俄罗斯合众国有权将他们的人民从压迫中解放出来，最后以“战争万岁！”结束了演讲。\n\n为了应对此举，德国国防军已经开始行动，向东部推进，并且做好了彻底粉碎这个新俄罗斯国家的准备。数百万东欧人民屏息以待，历史上最大的对手再次展开了战斗。"
 War_Declaration.43.a:0 "全世界都屏住了呼吸。"
 War_Declaration.43.b:0 "战争万岁！"
 War_Declaration.43.c:0 "对抗美国威胁的最后一战。"
 War_Declaration.44.t:0 "[Get_newspaper_header]对团结协定的圣战！"
 War_Declaration.44.desc:0 "俄罗斯神圣命令发布了一项令人费解的宣告，今天其事实上的领导者亚历山大·缅神父宣布对大日耳曼国及其统一协定宣战。缅神父明确向全世界表明，他们希望解放东欧受压迫的人民，摆脱德国的压制。\n\n截至目前，大日耳曼国边境上爆发了多起起义。尽管德国高级指挥部对与非核神圣命令的战争保持信心，但许多分析师表示，命令拥有庞大的导弹储备可能会阻碍德国的进攻以及其核武库。全世界都为敌对行动能够迅速解决而祈祷。"
 War_Declaration.44.a:0 "使人和平的人有福了，因为他们必称为神的儿子。"
 War_Declaration.44.b:0 "主啊，怜悯众生。"
 War_Declaration.44.c:0 "宗教狂热分子？劣等人真的疯了。"
 War_Declaration.45.t:0 "[Get_newspaper_header]苏联发动第三次伟大的卫国战争"
 War_Declaration.45.desc:0 "在来自李可夫的讲话中，苏联总理谢尔盖·别索诺夫宣布苏联最高主席团已经一致表决向大日耳曼国宣战。别索诺夫以种族和阶级压迫、多次越过边界的袭击行动，以及对苏联高级官员的袭杀企图为由，呼吁共荣圈和OFN团结起来支持苏联来“扼杀法西斯的粗鄙，回归国际法和和平关系的时代”。\n\n国际观察家称别索诺夫领导下的苏联在政策上与布哈林执政时期的联盟极其相似。乐观主义者表示，在苏联以自己的方式发动战争之后，这个苏联化身将有战胜困境的机会；而其他人则坚称，拥有相同政策但人力和工业能力较弱的政府无法希望扭转40年代的失败局面。"
 War_Declaration.45.a:0 "再打一次！"
 War_Declaration.45.b:0 "放马过来吧！"
 War_Declaration.45.c:0 "布哈林的遗产将再次被碾碎。"
 Russian_Victory.2.t:0 "[Get_newspaper_header]红色幽灵统治东欧"
 Russian_Victory.2.desc:0 "在被流放到欧洲边缘几十年后，共产主义以米哈伊尔·图哈切夫斯基的新苏维埃联盟的名义在东欧取得了胜利的归来。红旗高高飘扬在克里姆林宫的废墟上，大元帅在全世界面前发表了一场有力的演讲，讲述了国际革命的必然性，德国的失败只证明了共产主义在全球舞台上的力量。\n\n而当苏维埃联盟狂欢在自己的胜利中时，德国社会正在恶化，大规模骚乱爆发，民众呼吁取代执政的纳粹党。随着纳粹在德国的权力衰落，红色幽灵巩固了对东欧的统治，许多人不禁想知道这个世界将如何适应一个激进政权的垮台和另一个政权的崛起。"
 Russian_Victory.2.a:0 "世界在颤抖"
 Russian_Victory.2.b:0 "一个极端到另一个极端"
 Russian_Victory.2.c:0 "该死！"
 Russian_Victory.3.t:0 "[Get_newspaper_header]俄罗斯合众国对德战争取得胜利！"
 Russian_Victory.3.desc:0 "金属齿轮和金钱的力量打败了该死的德国佬"
 Russian_Victory.3.a:0 "鲍曼该下地狱了。"
 Global_Conflicts.1.t:0 "[Get_newspaper_header]卡累利阿起义！"
 Global_Conflicts.1.desc:0 "今天，也就是[GetDateText]，在被芬兰占领的卡累利阿爆发了大规模武装抵抗。在临时总统雷诺·哈哈宁的领导下，卡累利阿政府宣布从芬兰完全独立，同时宣布他们打算向俄罗斯请求合并。\n\n这个抵抗组织始创于第二次冬季战争之后，当时现已不复存在的西俄政府为争夺奥涅加的领土而与芬兰作战，但直到最近，当彼得罗扎沃茨克市的抗议者谴责芬兰偏向于征召卡累利阿公民入伍，称这是减少卡累利阿人口的暗箱操作时，它才获得了人民广泛的支持。随着俄罗斯政府宣布支持卡累利阿叛军，冷战的焦点似乎已经转移到了北方，德国和俄罗斯这两个巨人都在各自的边境线后秣兵历马。"
 Global_Conflicts.1.a:0 "斯堪的纳维亚在燃烧。"
 Global_Conflicts.1.b:0 "横跨整个欧洲，我们的人民正在觉醒。"
 Global_Conflicts.1.c:0 "俄罗斯的阴影重返欧洲。"
 Global_Conflicts.2.t:0 "[Get_newspaper_header]卡累利阿分离主义者取得胜利"
 Global_Conflicts.2.desc:0 "被称为“第二次大北方战争”的残酷冲突最终以卡累利阿分离主义分子及其俄罗斯盟友的惊人胜利而告终。\n\n二战结束后，卡累利阿被划给了芬兰，自俄罗斯重获统一以来，它一直是芬兰和俄罗斯之间的一个紧张局势的爆发点。随着卡累利阿解放军起兵反对他们的芬兰压迫者，紧张局势已经升级为一场全面战争。俄罗斯地面部队迅速开进了该地区，他们在茂密的森林和众多湖泊中稳步推进，直到芬兰政府向卡累利阿分离主义分子提出和平请求。这场战争以卡累利阿和复苏的俄罗斯的胜利结束冲突。\n\n通过这次胜利，俄罗斯再次发挥了其作为大国的威力，向沉默的日耳曼尼亚方面发出了一个明确而有力的信息。"
 Global_Conflicts.2.a:0 "和平回归了，但它能持续多久？"
 Global_Conflicts.2.b:0 "俄罗斯凯旋而归！"
 Global_Conflicts.2.c:0 "……该死……"
 Global_Conflicts.3.t:0 "[Get_newspaper_header]芬兰击败卡累利阿分裂组织"
 Global_Conflicts.3.desc:0 "被称为“第二次大北方战争”的残酷冲突最终以卡累利阿分离主义分子及其俄罗斯盟友的惊人失败而告终。\n\n二战结束后，卡累利阿被划给了芬兰，自俄罗斯重获统一以来，它一直是芬兰和俄罗斯之间的一个紧张局势的爆发点。随着卡累利阿解放军起兵反对他们的芬兰压迫者，紧张局势已经升级为一场全面战争。俄罗斯地面部队迅速开进该地区，以确保该地区的安全，但却遭到了芬兰的激烈抵抗。经过在广阔战线上的激烈战斗，卡累利阿政府最终崩溃，芬兰决定性地赢得了胜利，并给俄罗斯军队带来了惨痛的损失。\n\n通过这场胜利，德意志国又一次战胜了俄罗斯。但它能否保住自己的统治地位，还有待观察。"
 Global_Conflicts.3.a:0 "和平回归了，但它能持续多久？"
 Global_Conflicts.3.b:0 "我们会回来的！"
 Global_Conflicts.3.c:0 "不出所料。"
 Global_Conflicts.5.t:0 "[Get_newspaper_header]克拉科夫起义！"
 Global_Conflicts.5.desc:0 "在德国内战结束后，自由波兰的理想被认为已经彻底被摧毁，这个国家再次湮灭在纳粹德国的压迫下。然而，最近几周，在俄罗斯在第二次西俄战争中取得胜利以及随之而来的内耗德国的混乱之后，曾经迷失的波兰民族已经慢慢苏醒过来。\n\n在克拉科夫市，支持独立的抗议活动演变为一场大规模的起义，并在卡罗尔·沃伊蒂拉和重建的波兰本土军队的领导下，继续蔓延到整个波兰南部。德国政府迅速指责俄罗斯政府策划了最近的波兰起义，声称[RUS.GetName]是在利用帝国的衰弱状态。不管这些说法是否属实，波兰人正在再次战斗，他们的目光聚焦在华沙城。"
 Global_Conflicts.5.a:0 "该死的波兰人！"
 Global_Conflicts.5.b:0 "德国每况愈下。"
 Global_Conflicts.6.t:0 "[Get_newspaper_header]波兰独立"
 Global_Conflicts.6.desc:0 "在曾一度被认为已经平定的波兰土地上，经过激烈战斗，波兰人民似乎终于从德国获得了独立。在临时总统卡罗尔·沃伊蒂瓦的领导下，波兰人不顾一切地夺回了华沙，再次升起波兰国旗。\n\n获得美国和俄罗斯联邦的承认，并与日本建立外交关系，波兰似乎终于在几十年后真正站稳了脚跟。随着波兰摆脱了德国的控制，第三帝国对中欧的掌控似乎已经无法逆转，随着不满和抗议在北欧地区开始上升，让许多人怀疑团结协定能否在80年代存续。"
 Global_Conflicts.6.a:0 "波兰没有灭亡！"
 Global_Conflicts.6.b:0 "希望中国别从中获取灵感......"
 Global_Conflicts.6.c:0 "该死……"
 Global_Conflicts.6.d:0 "欢迎回来，波兰"
 Global_Conflicts.7.t:0 "[Get_newspaper_header][GGN.GetNameDefCap]大获全胜"
 Global_Conflicts.7.desc:0 "波兰人民再次遭受毁灭性的消息，波兰家乡军的最后勇敢抵抗者们再次被德国占领者的铁蹄踏碎。\n\n在第二次西俄战争中德国的惊人失败以及传闻中来自俄罗斯的军火运输的助力下，波兰家乡军再次公开起义，将杂乱无章的占领当局赶出农村，稳步向北进军华沙。德军迅速做出反应，数千名德国国防军再次涌入波兰，将筋疲力尽的家园军逼回利沃夫，有序清剿城市，直至无人生还。\n\n这次失败使波兰再次陷入黑暗。也许这一次，是永远。"
 Global_Conflicts.7.a:0 "德意志万岁"
 Global_Conflicts.7.b:0 "波兰的最后一声痛苦呻吟。"
 Global_Conflicts.8.t:0 "[Get_newspaper_header]流亡者归来"
 Global_Conflicts.8.desc:0 "今天标志着历史新的一页，几乎被遗忘的波兰流亡政府在德国入侵后首先逃往英国，然后在海狮行动后逃往美国；然后再次回到他们祖先留下的土地。\n\n随着先前流亡的波兰政府在历史首都华沙巩固对国家的控制，国际评论将这一事件描述为“波兰在血腥，但干净的基础上的开始”。\n\n虽然这种现象的国际影响微乎其微，但波兰回归的象征价值将在未来几年内受到波兰大量国际侨民的庆祝。"
 Global_Conflicts.8.a:0 "几十年的努力现在化为泡影。"
 Global_Conflicts.8.b:0 "二战的第一位受害者现已重生。"
 Global_Conflicts.9.t:0 "[Get_newspaper_header]箭十字取得胜利！"
 Global_Conflicts.9.desc:0 "多瑙河上方乌云密布，民族社会主义箭十字组织的神秘领袖[HUN.GetLeader]宣布在匈牙利内战中获得胜利。\n\n前伊姆雷迪政府将其归类为“恐怖主义”运动，许多人认为箭十字组织应对匈牙利领袖在德国战败后神秘失踪负有责任。萨洛希从布达佩斯那空荡荡的城市里发出广播，承诺要通过大规模的报复行动和逮捕来根除匈牙利社会中的“犹太-布尔什维克寄生虫”。\n\n随着匈牙利再次陷入另一位民族社会主义独裁者的掌控，许多人怀疑人民能够忍受多久这束缚之苦。"
 Global_Conflicts.9.a:0 "民族社会主义的顽强抵抗。"
 Global_Conflicts.9.b:0 "意志的力量。"
 Global_Conflicts.10.t:0 "[Get_newspaper_header]小农党获胜！"
 Global_Conflicts.10.desc:0 "今天，由领袖费伦茨·纳吉带领的受欢迎的农民和反法西斯抵抗力量正式宣布取得了对所有对手的胜利，从而结束了匈牙利内战。在布达佩斯这座伤痕累累的中心城市，纳吉在激昂的演讲中宣布：“现在战争的阴影已经过去，是时候让我们团结一致！走向一个新世界！为了匈牙利共和国，为了它的人民和独立！”\n\n在伊姆雷迪政府的统治下被取缔的政党和人物松了一口气，因为他们的定罪被撤销，并被宣布为非法。为了确保人民的代表权，保守派、自由派、社会民主派甚至共产主义者的联盟合并成一个临时政府，直到能够达成永久解决方案。随着年轻共和国的崛起，如同纸牌屋一样的局面继续崩塌，因为德国正面临其失败的后果。"
 Global_Conflicts.10.a:0 "最理想的结果。"
 Global_Conflicts.10.b:0 "多瑙河上闪耀着光芒。"
 Global_Conflicts.11.t:0 "[Get_newspaper_header]匈牙利革命"
 Global_Conflicts.11.desc:0 "多瑙河畔响起令人惊讶的消息，伊姆雷·纳吉和匈牙利社会党在这片染血的水域上获得了胜利。\n\n经过几十年来受到亲德卫星政府的镇压，匈牙利红军通过巩固支持和积聚武器的方式等待时机，当法西斯武装分子的风暴席卷整个布达佩斯时，他们控制了大部分乡村。社会主义者利用对手装备不足的优势向西推进，使萨洛希的政权崩溃，然后迫使费伦茨·纳吉领导的民主阵线迅速投降。\n\n随着所有进一步反对派的解体，伊姆热·纳吉，作为党的忠实服务者已有几十年，已宣布了选举继任者的意图。然而，新的社会主义共和国能否应对这种权力交替，还有待观察。\n"
 Global_Conflicts.11.a:0 "革命和鲜血染红了多瑙河。"
 Global_Conflicts.11.b:0 "革命和鲜血染红了多瑙河。"
 Global_Conflicts.12.t:0 "[Get_newspaper_header]德国入侵匈牙利"
 Global_Conflicts.12.desc:0 "在德国新政府的宣布后，数千名士兵和坦克已开始涌入新成立的匈牙利社会主义共和国，以“恢复秩序”并保护当地居民免受“犹太-布尔什维克的奴役”\n\n伊姆雷·纳吉在布达佩斯的庇护所内发表讲话，发誓要捍卫匈牙利社会主义直至最后。尽管他的勇气无疑令人钦佩，但专家们已经得出结论，万字旗永远高挂多瑙河上空只是时间问题。"
 Global_Conflicts.12.a:0 "当你无法挑选与你身材相仿的对手时……"
 Global_Conflicts.12.b:0 "即使是半死不活的狼，也能咬牙坚持。"
 Global_Conflicts.13.t:0 "[Get_newspaper_header]德国入侵匈牙利"
 Global_Conflicts.13.desc:0 "“土地所有者革命”似乎注定无法持续，德国坦克和机械化部队大举进入这个备受战争摧残的国家，标志着德国入侵匈牙利的开始。\n\n在一场残酷的内战后，费伦茨·纳吉领导的自由派和农业派的广泛联盟一致同意将匈牙利从德国阵营中剥离出来，希望在新的、独立的基础上与自由世界重新建立关系。然而这些希望已经破灭，德国战机将已经遭受摧毁的布达佩斯变成了一座铁丝网之城。\n\n匈牙利没有任何有意义的抵抗能力，它的未来似乎注定要被迫与帝国的未来紧紧相连。一场钢铁烈焰的风暴，终结了匈牙利新发现的乐观主义。"
 Global_Conflicts.13.a:0 "自由之光越来越暗。"
 Global_Conflicts.13.b:0 "即使是走投无路的狼也能露出牙齿。"
 Global_Conflicts.14.t:0 "[Get_newspaper_header]德国入侵匈牙利"
 Global_Conflicts.14.desc:0 "今天，德国军队冲破匆忙准备的匈牙利防线，给民族社会主义事业以致命一击，这标志着自由德国的外交政策迈出了第一步。\n\n通过在布达佩斯的血腥围困夺取了国家权力，费伦茨·萨拉希的“箭十字”党在南德国的克洛普佛政权倒台后陷入孤立。由于农村地区的残酷镇压占据了匈牙利所能调集的少量军队，因此他们几乎无法阻止向首都发起的进攻；据报道，平民们带着沉重的、尽管令人担忧的心情欢迎入侵者的到来。\n\n随着战火再次蔓延到多瑙河畔，萨拉希的权力梦想看来已经变成了匈牙利民族社会主义者的一场噩梦。一个他以及那些仍然足够勇敢去战斗的人可能永远无法从中醒来的噩梦。"
 Global_Conflicts.14.a:0 "布达佩斯的屠夫现在面临着他们的命运。"
 Global_Conflicts.14.b:0 "布达佩斯的屠夫现在面临着他们的命运。"
 Global_Conflicts.15.t:0 "[Get_newspaper_header]匈牙利内战"
 Global_Conflicts.15.desc:0 "随着德国在欧洲失去影响力，引发的混乱又夺去了另一个受害者，这一次是在多瑙河之心。生活在纳粹主义永恒阴影下，从一个独裁政权到另一个，匈牙利人民在半个世纪的时间里只体验到压制。随着第二次西俄罗斯战争的结束和匈牙利经济的崩溃，革命之火蔓延布达佩斯已是迟早的事情。\n\n由费伦茨·萨洛希指挥的法西斯准军事部队冲击了匈牙利议会，试图以武力夺权。随后的混乱和权力真空使得反对派迅速在多瑙河沿岸获得了领土，据报道现在整个匈牙利都处于革命性暴力状态。"
 Global_Conflicts.15.a:0 "铁幕自行撕裂。"
 Global_Conflicts.16.t:0 "[Get_newspaper_header]法国采取行动收复领土！"
 Global_Conflicts.16.desc:0 "在纳粹帝国的阴影下苦苦挣扎了几十年，自从在第二次世界大战结束时被迫并入德国的“新秩序”以来，法国面临的只有屈辱。随着它的老对手突然陷入内战、随后崩溃并失去了势力范围，[FRA.GetNameDef]现在终于有机会纠正近半个世纪的痛苦，他们毫不犹豫地抓住了这个机会，并迅速行动起来。\n\n被遗弃的、失去增援的名为“法国军事管辖区”的机构正遭受动员起来的法国军队的围攻，后者决意以任何必要手段夺回北部领土。由于没有维持长时间抵抗的手段，德国在法国的优势似乎注定会很快而又戏剧性地结束。"
 Global_Conflicts.16.a:0 "战神现在发现自己是凡人。"
 Global_Conflicts.17.t:0 "[Get_newspaper_header]法国军队获胜！"
 Global_Conflicts.17.desc:0 "在塞纳河沿岸一系列短暂但激烈的战斗中，[FRA.GetNameDef]成功将德军从其北部领土上击败，开始了一个修复国家自豪感的进程，令克洛普佛在德国南部的政权感到十分不安。\n\n在多方进攻下，“法国军事管辖区”发现自己无法阻挡法军，逐渐在战斗中撤退，直到最终其残余部队逃到阿尔萨斯边境，并向该地区的对立政府投降。现在，法国三色旗在巴黎上空飘扬，为法国带来了自第一次世界大战结束以来所未见的胜利。\n\n通过这场壮观的胜利，法国如今再次统一，尽管重建的巨大代价仍待其疲惫不堪的民众来承担。\n"
 Global_Conflicts.17.a:0 "自由之树只有在暴君的鲜血浇灌下才能生长。"
 Global_Conflicts.18.t:0 "[Get_newspaper_header]德国击败法国！"
 Global_Conflicts.18.desc:0 "在塞纳河沿岸的一系列惊人战斗中，[FRA.GetNameDef]再次被迫撤退到边境，却毫无所获，这进一步巩固了德国在西部的优势，即使德国本土在东部正在燃烧。\n\n由于缺乏协调、适当的装备以及对对手的一系列低估，法军的推进在关键的渡河口陷入困境，打破了顺利取胜的希望，也打击了整个前线的士气。\n\n这是一场出于无能和准备不足的惨败，法国在半个世纪内已经输掉了第三次战争，进一步加剧了国内的困境，摧毁了任何民族复兴的迹象。"
 Global_Conflicts.18.a:0 "献给那些缺乏意志和决心的人。"
 Global_Conflicts.19.t:0 "[Get_newspaper_header]民主派在德国获胜！"
 Global_Conflicts.19.desc:0 "随着尘埃终于在帝国的残骸上落定，一个崭新的德国已经从灰烬中崛起，只要联邦旗高高飘扬在勃兰登堡门上空，魏玛时代的遗产便能永世长存。\n\n在德国内战中，德意志共和国取得了胜利，这标志着自希特勒去世后的混乱以来欧洲政治上最大的转变。尽管顽固的抵抗组织仍在乡间肆虐，新成立的临时政府已宣布进入戒严状态，原因是法西斯主义者和共产主义者发动了各种袭击。尽管存在危险，共和国已宣布将在接下来的几个星期内举行全国性选举，这是自希特勒的民族社会主义者获胜以来的首次选举。随着旧德国日落西山，其公民们发现自己不再是所谓的“优等种族”，而是新的、平等的欧洲中的德国人。"
 Global_Conflicts.19.a:0 "勃兰特的精神仍然存在于他的人民之中。"
 Global_Conflicts.20.t:0 "[Get_newspaper_header]共产党游击队在德国获胜！"
 Global_Conflicts.20.desc:0 "1918年的革命家们感到自己得到了证实，因为“德意志人民共和国”已在前德国境内宣布成立。起初是莱茵兰地区的一场无组织的工人起义，激进社会主义的分裂团派通过一波革命般的钢铁力量成功联合，席卷掉所有新兴的对手势力，最终宣布取得了德国的胜利。\n\n随着枪声终于彻底平息，一场“内部党代会”已被召开，以决定前帝国的命运。大会计划在人民大厅举行，恩斯特·奥斯特、鲁迪·杜奇克和海因茨·霍夫曼都表示愿意参加。\n\n随着大多数前纳粹党领导层如今躺在无名墓中，鲍曼的最坏噩梦似乎终于实现了。曾经是整个欧洲法西斯霸权的德国已经沦为社会主义国家。\n"
 Global_Conflicts.20.a:0 "马克思的儿女们如今已独当一面。"
 Global_Conflicts.21.t:0 "[Get_newspaper_header]国防军残部在德国取胜！"
 Global_Conflicts.21.desc:0 "今天，当大日耳曼国昔日的心脏地带炮声和机枪声沉寂下来的时候，国防军的恩斯特·费而伯，一个令人震惊的胜利者出现在日耳曼尼亚，结束了内战的混乱与毁灭。\n\n出身普鲁士旧地的恩斯特·费尔伯与他的军事权威，在第二次西俄罗斯战争的惨败后不久首次现身，他和他的战友因德国长期受其野心所害而遭到冷落和指责。随着祖国的内部崩溃，异见者们向新的旗帜宣誓效忠，这面旗帜承诺将德国人民从鲍曼和继任者们的失败中解救出来，它唯一的目标是保护一个濒临湮灭边缘的国家。\n\n随着“东线”的士兵穿越敌对派系的零散民兵和警察部队，这些承诺得到了验证。现在，整个世界都在等待着一个新的德国回到世界舞台。\n"
 Global_Conflicts.21.a:0 "老兵不死……"
 Global_Conflicts.22.t:0 "[Get_newspaper_header]自由军团老兵获胜！"
 Global_Conflicts.22.desc:0 "黑云笼罩着帝国，海因茨-乔治·莱姆的“黑带”在德国内战中获胜。该组织主要由退伍军人组成，其中一些人可以追溯到第一次西俄罗斯战争，莱姆的“自由军团”在德国内战爆发后夺取了不来梅的控制权。这支由训练有素的士兵、老人和年轻人组成的狂热团队无情地镇压了前进道路上的任何抵抗，标志性的是他们留下的一片空心村庄和粉碎的颅骨。\n\n焦黑的尸体、受折磨的灵魂和化为灰烬的城市，如今见证了自由军团的统治。随着莱姆的核心领导层逐渐陷入内斗和琐事纷争，帝国的土匪们现在必须面对他们行为的永恒后果，要么面对冷漠，要么面对绝望。"
 Global_Conflicts.22.a:0 "德国终结了吗？"
 Global_Conflicts.23.t:0 "[Get_newspaper_header]克洛普佛重建第三帝国！"
 Global_Conflicts.23.desc:0 "在德国内战中，克洛普佛忠诚的政府获得了胜利，令自由世界再次感到恐惧。由怀恨在心的老兵和狂热的青年组成，“狼人”游击队在敌后摧毁了重要的供应线，为精疲力竭的国防军提供了所急需的机会。通过系统轰炸和集中攻击，纳粹党的残余势力能够残酷地镇压所有剩余的反对派，血腥地夺取了日耳曼尼亚这个前首都。\n\n随着尘埃终于在德国平息，尚不清楚格哈德·克洛普佛如何修补纳粹党内不断加剧的分裂。尽管帝国存在着长期存在的问题，但即将出任元首的克洛普佛已经组织了一场盛大的仪式，授予自己鲍曼曾经拥有的头衔，尽管以前的党卫队成员明显不在场。"
 Global_Conflicts.23.a:0 "意志的胜利。"
 Global_Conflicts.24.t:0 "[Get_newspaper_header]德国第一届党代会开幕"
 Global_Conflicts.24.desc:0 "随着社会主义联盟成员和德国内战的胜利者们决定彻底放下武器，德国公民们如今松了口气。幸运的是，冷静的头脑最终占了上风，新社会主义党派的领导人们决定举行第一次中央党派选举。\n\n随着前帝国的紧张局势终于冷却下来，人们蜂拥至投票站，候选人们发表演讲，争夺首个真正社会主义德国的选举胜利者。这次选举无疑将决定德国社会主义今后数年的发展方向。\n\n尽管大多数国家为欧洲的暴力结束而庆祝，但日本和美国等国家警告社会主义理念和极端主义可能带来的“危险”。尽管有这些警告，整个欧洲都能松一口气，知道多年的剧烈暴力已经过去。\n"
 Global_Conflicts.24.a:0 "红星闪闪发光。"
 Global_Conflicts.25.t:0 "[Get_newspaper_header][GetYear]年德国大选！"
 Global_Conflicts.25.desc:0 "在前大日耳曼国范围内，投票站迎来了创纪录的选民投票人数，人们热切期待着自1933年以来德国的首次真正民主选举。全国各地的投票站都涌现出数百人甚至数千人的人群，像慕尼黑和科隆这样的大城市的投票站更是人数众多。\n\n即将举行的选举由保守党、自由民主党和社会民主党主导，各党派都重申将为德国带来稳定的、有效的民主体制。\n\n一些等待了数日的选民脸上洋溢着欢乐和对前方未来的兴奋，一些早期的投票站显示三大党派的竞选将会十分激烈。"
 Global_Conflicts.25.a:0 "自决！统一！自由！"
 Global_Conflicts.26.t:0 "[Get_newspaper_header]人民民主阵线赢得德国大选！"
 Global_Conflicts.26.desc:0 "今天对于新生的自由德国来说是一个历史性时刻，自由民主党在这个共和国的首次选举中取得了胜利。新党主席汉斯-迪特里希·根舍尔在一场盛大的公开仪式上就任总理，宣布他的目标是以“最快的速度和无可挑剔的品质”重建这个支离破碎的国家。虽然一些人对德国民主的真正合法性或意图表示怀疑，但对于这一世界历史性时刻的真正影响力无可置疑。\n\n在国际上，这一消息为自由世界带来了一丝宽慰。尽管敌对大国之间的关系仍然保持冷淡，根舍尔已宣布开始向美国和日本派遣外交使团，表示“核毁灭的可怕幽灵总有一天可能最终被我们所有人抛诸脑后。”"
 Global_Conflicts.26.a:0 "民主之火熊熊燃烧。"
 Global_Conflicts.27.t:0 "[Get_newspaper_header]保守党赢得德国大选！"
 Global_Conflicts.27.desc:0 "今天，随着德国保守党在魏玛共和国时代以来的首次选举中获胜的消息传出，德国各地举行了庆祝活动。瓦尔特·舍尔成功推动渐进改革的竞选使他在与自由民主党和社会民主党的激烈角逐中脱颖而出，后者已经承认了选举的结果。\n\n此外，社会民主党和自由民主党已经表示愿意与瓦尔特·舍尔的政府合作，无论问题如何；因为保守党似乎旨在在社会民主党和自由民主党两党的政策之间走中间道路。在整个国家，成千上万的人走上街头，以纪念历史的这一时刻，而保守党则安定下来，开始在德国建立新的民主。"
 Global_Conflicts.27.a:0 "明智的选择。"
 Global_Conflicts.28.t:0 "[Get_newspaper_header]格拉赫就任总理！"
 Global_Conflicts.28.desc:0 "今天在柏林，环绕着前人民大厅的街道挤满了欢快的市民，因为德国自由民主党宣布在自魏玛共和国时代以来的首次选举中获胜。曼弗雷德·格拉赫领导着自由民主党，他作为游击队员在最近的内战中的斗争赢得了声誉，这使他赢得了选民和同行们的尊敬。\n\n作为总理，格拉赫的首个举措之一是纪念自1933年国家社会主义德国工人党夺权以来每个政党的已故成员，他们在维利·勃兰特的墓前摆放了一个庄严的花环。从那时起，还有成百上千的人向勃兰特的坟墓投掷玫瑰，表达对试图拯救德国的这位人的尊敬之情。兴奋和欣喜之情席卷全国，德国人民期待着即将到来的光明未来。"
 Global_Conflicts.28.a:0 "德国的自由主义？"
 Global_Conflicts.29.t:0 "[Get_newspaper_header]德意志赤色黎明"
 Global_Conflicts.29.desc:0 "第一届德国党代会已经结束，德意志工人国迎来了新的领导者：大胆而坚定的海因茨·霍夫曼。他提出了独特的先锋共产主义愿景，将其与德国例外主义和立即在整个欧洲范围内进行的永久革命的言辞相结合，成功地团结了一支由热情的红卫兵、军官和中间派民族主义者组成的奇特联盟。\n\n在国际左派与他们的新合作伙伴尴尬地共舞时，他们不确定这位看似拒绝国际主义的领导者是否值得信任。而欧洲的资本主义和法西斯势力已经在寻求国际保证，以防止霍夫曼提出的“大规模无产者闪电战”侵犯其主权。即使德国已经处于废墟之中，看来未来的十年将继续充满紧张，充满恐惧，并且再次挥舞着达摩克利斯之剑。\n"
 Global_Conflicts.29.a:0 "普鲁士的遗产，在猩红色中重新洗礼。"
 Global_Conflicts.30.t:0 "[Get_newspaper_header]苏维埃德国的诞生"
 Global_Conflicts.30.desc:0 "历史往往会重演。党国正在德国崛起，因为布尔什维克派在德意志人民共和国获得了胜利。与俄罗斯不同，新的德国共产党奉行马克思列宁主义，这是一种被斯大林和托洛茨基曾经支持过的所谓极左倾向。主席恩斯特·奥斯特的部下们提出了所谓的“红色晨曦计划”，呼吁立即进行再工业化，立即进行国家计划以支持向社会主义的过渡，立即准备应对资本主义势力的逆袭，并立即完全清算“民族法西斯资产阶级”。\n\n随着一颗新的红星在欧洲中心升起，冷战的极性永远改变了。但由于德国的领导层已对美国和日本持敌对态度，这场冷战的新篇章不太可能出现缓和。\n"
 Global_Conflicts.30.a:0 "一个幽灵正在欧洲徘徊……"
 Global_Conflicts.31.t:0 "[Get_newspaper_header]学生联盟的德国"
 Global_Conflicts.31.desc:0 "历史的篇章源源不断地翻转，就如同第三帝国的一页已经翻过，吞噬了前辈的一代。如今，新德国将归于年轻一代。鲁迪·杜奇克领导的学生和左翼社会主义者已经着手进行一项民主化计划，努力建立直接民主、工人所有权以及分散的、地方性的计划经济。在马克思和罗莎·卢森堡的启发下，杜奇克的“充满爱的革命”被描述为距离无政府主义仅一步之遥，这是从国家极权主义到潜在的世界上最左的国家的巨大纠正。\n\n现在是中欧复兴的时候了。然而，右翼阵营中传来细语，质疑在一个被法西斯主义灌输了四十多年的国家里，直接民主如何能够运作。决定性的革命是否真正终结了历史的进程？"
 Global_Conflicts.31.a:0 "由生产者和学生共同打造的一个全新德国。"
 Global_Conflicts.32.t:0 "[Get_newspaper_header]大日耳曼国爆发权力斗争！"
 Global_Conflicts.32.desc:0 "在帝国内部的动荡和随后的清洗之后，人们或许会认为稳定和一种象征性的团结可能会重返德国，因为已经没有敌人反对克洛普佛对权力的掌控。然而，即使纳粹党的敌人的尸体遍布田野和街道，一个新的敌人已经从最意想不到的地方出现：党内部。\n\n纳粹党内部出现了一个分裂派系，公然宣布与克洛普佛分道扬镳，指责他未能使国家保持稳定和团结，从而导致激进因素的崛起和德国在欧洲势力范围内剩余部分的彻底崩溃。关于这个分裂派系的新信仰知之甚少，但可以肯定的是，日耳曼尼亚正在酝酿一场新的权力斗争。"
 Global_Conflicts.32.a:0 "他们似乎又回到了老传统。"
 Global_Conflicts.33.t:0 "[Get_newspaper_header]克洛普佛清洗纳粹党"
 Global_Conflicts.33.desc:0 "在过去的几周里，格哈德·克洛普佛已经在困扰着大日耳曼国的权力斗争中脱颖而出。然而随之而来的却是纳粹党历史上规模最大的一次清洗，不仅那些与布兰德纳一起加入的人被清洗，甚至那些稍微提及他名字的人似乎都“消失”了。在一次电视讲话中，元首克洛普佛表示，党终于清洗掉了所有反政府的颠覆分子，以及那些“在党内长期滋扰”的犹太-布尔什维克威胁。\n\n随着这一宣布，暴乱活动已大幅减少。似乎尽管种种不利因素，克洛普佛不仅活到了明天，还将成为下任德国元首。尽管未来充满挑战，尾随其后的不确定性，以及世界舞台和自由国家组织的默默评判，克洛普佛将迈出领导这个依然有活力的千年帝国的第一步。"
 Global_Conflicts.33.a:0 "轮回开始了……"
 Global_Conflicts.34.t:0 "[Get_newspaper_header]布兰德纳就任元首"
 Global_Conflicts.34.desc:0 "以大日耳曼国的历史性转变或更多相同之举来形容，维利·布兰德纳已经登上了元首的宝座。在挫败了他的主要竞争对手克洛普佛之后，布兰德纳通过全国范围的清洗显示出他对权力的新掌控。从国防军到秘密警察，每个领域都见证了数百，也许数千名官僚和要人被从体制中清除。\n\n与此同时，布兰德纳又迈出了一次彻底的飞跃。布拉德纳在正统纳粹党的废墟上使该党焕然一新。许多人称这是一股新鲜空气，因为在帝国历史上第一次由非正统党员领导。然而，许多其他人声称这只是一个幌子，因为布兰德纳通过无线电波反复谈论“千年帝国”。"
 Global_Conflicts.34.a:0 "轮回开始了……"
 Global_Conflicts.35.t:0 "[Get_newspaper_header]布雷斯劳的零星冲突"
 Global_Conflicts.35.desc:0 "来自饱经战火的德国的第一手报道并不多见，但有消息传出，一群背叛的前伪装部队士兵正在按照前帝国食品和农业部长赫伯特·巴克的命令，夺取了不来梅，试图“恢复帝国的稳定和荣誉”。\n\n随着自由军团内部核心日渐分裂，前奥地利伪装部队领袖兼RSHA官员恩斯特·卡尔滕布伦纳据报道也已组织起来反对莱姆政权，许多幸存的伪装部队结构也选择效仿。一些分析人士提出了可能有内部阴谋来削弱并推翻自由军的统治的可能性，但已经有报道称在主要道路交叉口已经发生了小规模冲突，德国的命运似乎正悬在了其占领者的手中。"
 Global_Conflicts.35.a:0 "狼穴现在要面对自己了。"
 Global_Conflicts.36.t:0 "[Get_newspaper_header]自由军团效忠者恢复控制"
 Global_Conflicts.36.desc:0 "经过数十次在德国东部各地的血腥战斗和小规模冲突，海因茨-乔治·莱姆成功地俘虏或消灭了在前自由军总部内的任何反对势力，从而永久地确保了他作为前帝国无可争议的掌权者的地位。\n\n在他胜利的公开宣布之后，逐渐有一些稀少的报道从逃离的难民中传出，这些报道描绘了一个可怕的景象，即政府机构遭到了大规模的清洗，而且任何被怀疑怀有除了对莱姆以外的任何忠诚的人都遭受监禁或直接谋杀。"
 Global_Conflicts.36.a:0 "黑暗的阴影笼罩着中欧……"
 Global_Conflicts.37.t:0 "[Get_newspaper_header]卡尔滕布伦纳政变"
 Global_Conflicts.37.desc:0 "纳粹正统派忠诚的德国政府官员集团领袖恩斯特·卡尔滕布伦纳发动政变推翻了海因茨-乔治·莱姆的自由军政府，掌控了德国的领导权。卡尔滕布伦纳率领的党卫军在布雷斯劳与政府军发生冲突后，签署了停火协议，承诺摧毁前国务部长赫伯特·巴克的纳粹极端分子阴谋团伙。\n\n卡尔滕布伦纳似乎背叛了莱姆，他领导的党卫军部队掌控了日耳曼尼亚，并随后拘禁并处决了主要的自由军领袖，包括海因茨-乔治·莱姆。德国现在处于新的德国工人党的控制之下，但新政府的执政能力受到党内斗争和赫伯特·巴克集团的威胁。"
 Global_Conflicts.37.a:0 "旧制度，新问题。"
 Global_Conflicts.38.t:0 "[Get_newspaper_header]德国的血与土"
 Global_Conflicts.38.desc:0 "德国陷入恐慌和绝望，因为该国政府被只能用神秘极端份子来形容的势力所取代，其意识形态与海因里希·希姆莱和他的神秘主义惊人地相似。在德国内战的烈火中，西里西亚自由军团消灭了所有反对派，并将德国统一在他们的极端理念下。新的元首赫伯特·巴克在布雷斯劳消除了自由军团内的主要竞争对手，并巩固了权力。\n\n随着德国边境的关闭，有关报道日益稀缺，但一些难民声称在全国范围内正在进行清洗行动。被指控为“犹太布尔什维克代理人”和“工业家异议人士”的人被从街头绑架，或者被枪杀并被遗弃在死亡之地。专家担心在接下来的几周中会有更多可怕的故事出现，最糟糕的情况尚未到来。似乎在德国战败的废墟中崛起了一个更加可怕的怪物。"
 Global_Conflicts.38.a:0 "他们不索取爱；而是索取恐惧。"
 Global_Conflicts.39.t:0 "[Get_newspaper_header]法国与德国建立经济伙伴关系！"
 Global_Conflicts.39.desc:0 "经过一个世纪的激烈敌对，法国和德国通过进入一个共同的经济领域，打破了他们的仇恨循环。两国代表发表了一项声明，声称：“法德敌对的时代已经结束。为了欧洲劳工阶级的利益，我们将搁置分歧。”\n\n这两个新近社会主义国家为欧洲政治树立了先例。随着团结协定的解散和俄罗斯在第二次西俄战争后影响力日益增强，德国和法国决定，他们联合起来作为一个统一战线，以抵御俄罗斯和自由国家组织的影响。\n\n这一举动在全球范围内引起了轩然大波，日本等国对世界范围内社会主义的增长感到担忧。美国给予了温和的支持，而俄罗斯拒绝就这些发展发表评论。\n"
 Global_Conflicts.39.a:0 "红色黎明降临西欧。"
 Global_Conflicts.40.t:0 "[Get_newspaper_header]出埃及记"
 Global_Conflicts.40.desc:0 "成千上万的男人、女人和儿童从前大日耳曼国涌向边境，逃离混乱局势。在另一场摧毁了前大日耳曼国领土的内战中，德国大部分人口已经逃往邻国，如瑞典和伊比利亚，寻求难民身份。还有许多人希望申请OFN的庇护，特别是美国。\n\n前帝国领土的经济已经在内战中遭受重创，如今更因失去了众多劳动力而进一步受阻。无论哪个势力从德国内战的余烬中崛起，这种大规模的人力损失都将阻碍随之而来的重建工作。无论谁获胜，德国的面貌都已永远改变。"
 Global_Conflicts.40.a:0 "对前帝国的又一次打击。"
 Global_Conflicts.41.t:0 "[Get_newspaper_header]德国入侵荷兰"
 Global_Conflicts.41.desc:0 "就像其他原始日耳曼地区一样，尼德兰专员辖区与德国有着独特的关系。纳粹将荷兰人视为几乎与德国人无异，这使得荷兰与德国的关系密切，并几乎被视为帝国的核心组成部分。\n\n这一点在今天得到了强调，当德国部队越过荷兰边界。就像臭名昭著的鹿特丹空袭一样，德国空军已开始飞越该国，进行“战略”轰炸行动。尽管荷兰已经预料到并为此次入侵做好了准备，但面对德国国防军，能做的也只有那么多。在没有防御地形的情况下，荷兰政府一直在艰苦地试图组织防御，但几乎没有国际观察员预期他们会成功。对许多人来说，问题不在于荷兰是否会投降，而是何时会投降。"
 Global_Conflicts.41.a:0 "荷兰人民仍然被束缚着。"
 Global_Conflicts.42.t:0 "[Get_newspaper_header]德国入侵自由波兰"
 Global_Conflicts.42.desc:0 "今晨，波兰民族再次苏醒于一声过于熟悉的声音：枪声与爆炸声。正如国际观察家所预见的不可避免，大日耳曼国再次入侵了波兰。德国国防军以德国公民受虐待为由，大规模越过边境，波兰再次陷入绝望的生存斗争之中。纳粹分子刚在第二次德国内战中宣布胜利，然而他们的领导层似乎在将波兰重新踏入铁蹄之下上毫不耽搁。\n\n波兰部队早已为此次入侵做好了数周的准备。然而，他们能够为抵挡这个受伤但仍然致命的德国巨兽做的事情有限。波兰人民正在呼吁外援，而世界的大国们则在关切的恐惧中观望。"
 Global_Conflicts.42.a:0 "这会是波兰的终章吗？"
 Global_Conflicts.43.t:0 "[Get_newspaper_header]赤潮北上"
 Global_Conflicts.43.desc:0 "今天早些时候，来自丹麦新政权的紧急外交电报表明，该国关键领导人在德国革命政府宣战后已逃离该国。预计德国革命军队将在未来几天内席卷整个国家。此外，德国军队宣布，任何执政政权的关键领导人将被拘捕并当场枪决。\n\n数十万人已经离开家园，形成了一个在瑞典边境逐渐加剧的难民危机。瑞典将如何作出反应尚不清楚，因为人们担心德国的好战行径很快也将蔓延到他们的边境。可以确定的是，那股红色浪潮尚未停息，正在威胁着欧洲的各个角落。"
 Global_Conflicts.43.a:0 "又一个国家倒下了......"
 Global_Conflicts.44.t:0 "[Get_newspaper_header]自由的代价"
 Global_Conflicts.44.desc:0 "在今天早些时候，来自丹麦新政权的紧急外交电报表明，关键领导人在德国宣战后已逃离该国。预计德国军队将在未来几天内席卷整个国家。此外，德国宣布要将新政权的任何关键领导人拘捕并带去审判。\n\n德国政府已经宣布其意图在丹麦重新建立一个民主政府，同时制定粮食配给和重建政策，以在这场可能的短暂冲突之后重建这个国家。德国的努力是否会取得成果尚待观察，但可以肯定的是，又一个欧洲国家将因战争而四分五裂。"
 Global_Conflicts.44.a:0 "火炬照耀北方。"
 Global_Conflicts.45.t:0 "[Get_newspaper_header]德国入侵自由丹麦！"
 Global_Conflicts.45.desc:0 "纳粹一直倡导这样一个观点，即德国人和丹麦人属于一个雅利安民族，拥有相似的文化、外貌和传统，因此他们竭尽全力将丹麦及其人民永远栓在大日耳曼国的铁链上。今天，历史重演，德国空军的飞机清晨出现在哥本哈根上空，伴随着德国国防军向丹麦领土进军。\n\n自由丹麦的临时政府代表整个丹麦人民，拼命呼吁援助，然而世界看着这场入侵的恐怖，似乎无力阻止德国的前进，丹麦似乎注定再次沦陷于纳粹帝国之手。"
 Global_Conflicts.45.a:0 "一个又一个国家，铁幕被重建。"
 Global_Conflicts.46.t:0 "[Get_newspaper_header]德意志人民共和国入侵荷兰"
 Global_Conflicts.46.desc:0 "随着今天早晨太阳升起在低地国家上空，一个太过熟悉的声音很快紧随其后——坦克履带和军靴行进的声音，新成立的社会主义德国的军队将红色浪潮带到了又一个邻国。尽管荷兰军队已经开始在边境的各处建立防线，但分析人士担心，德意志人民共和国的老练部队将能够在短短几周内或更短的时间内结束他们西北方的邻国，因为首次的冲突报告似乎都有利于德国人。\n\n随着荷兰胜利看起来越来越不可能，全世界开始思考阿姆斯特丹上空飘扬的红旗可能意味着什么，更重要的是红色浪潮可能接下来会走向何方……"
 Global_Conflicts.46.a:0 "革命之火不分国界。"
 Global_Conflicts.47.t:0 "[Get_newspaper_header]德国联邦国防军进入荷兰"
 Global_Conflicts.47.desc:0 "尽管历史并不重复，但德国入侵荷兰的消息仍然震惊了世界。两国无法就潜在的重新确立德国在该地区利益的公平条件上达成一致，[REG.GetLeader]总理谴责了阿姆斯特丹政府，指责他们对中欧新共和国的“不愿合作”和“侵略行为”，他在最近的新闻发布会上表示外交尝试已经失败，这是现在唯一剩下的行动途径。\n\n尽管荷兰的抵抗无疑令人钦佩，但许多人怀疑在德国联邦国防军面前这将是徒劳的。德国计划在该地区建立一个新的重建政府，使一些人不禁纳闷，德国人是在试图从他们过去的臣民手中拯救他们自己，还是在给他们戴上一种新的枷锁……"
 Global_Conflicts.47.a:0 "这就是……解放吗？"
 Global_Conflicts.48.t:0 "[Get_newspaper_header]德国驻军的终结"
 Global_Conflicts.48.desc:0 "在一个最具讽刺意味的命运中，德意志共和国的军队进入了波兰的土地，他们不是作为征服者，而是作为解放者。\n\n在第二次德国内战期间陷入无政府状态，波兰最后一次试图反抗当地的国防军驻军。可悲的是，他们失败了，全世界都认为波兰这个国家再也不会重见天日。然而，随着自由之火在中欧再次燃起，显而易见的是，德国前士兵的时间不多了，报应迟早会降临在他们身上。\n\n似乎今天就是那一天，随着“波兰驻军”在各个战线上被逐渐击退，预计将在一个月内被消灭，一个新的波兰文官政府已开始建立。然而，一些人已经开始低声下气地说，这种“解放”实际上不过是一个隐藏的计划，旨在恢复德国对该地区的影响……\n"
 Global_Conflicts.48.a:0 "希特勒的遗产永远淹没在鲜血和钢铁之中。"
 Global_Conflicts.49.t:0 "[Get_newspaper_header]德国入侵自由波兰！"
 Global_Conflicts.49.desc:0 "革命不分国界......有人这么说过，但今天随着国家人民军涌入波兰边境，这似乎被证明是正确的。德国谴责波兰政府所谓的虐待和剥削本国无产阶级的行为。要求波兰军队立即投降的最后通牒很快被送到华沙，但很快遭到拒绝，并引发了两国人民之间的又一次冲突。\n\n尽管来自哈萨克斯坦的头发花白的游击员队和第二次西俄战争的老兵很可能给人民军带来更多的牺牲，但许多人预测，由于德国人拥有绝对的数量优势，这场冲突不太可能持续很长时间。"
 Global_Conflicts.49.a:0 "一面猩红的旗帜可能还会飘扬在华沙上空……"
 Global_Conflicts.50.t:0 "[Get_newspaper_header]红色德国入侵国防军驻地"
 Global_Conflicts.50.desc:0 "最近，德国军队越过了国防军占领中的波兰边界，德国革命政府发布正式声明，宣布“法西斯国防军暴政的终结”。\n\n国防军波兰驻军指挥官及统治波兰的伯恩哈德·巴茨对此次进攻表示强烈反对，称其为“堕落的威胁”，并准备抵抗德国军队的前进。尽管国防军在第二次德国内战中击败了大部分波兰家乡军，但叛乱区域仍然存在。他们现在开始与德国政府合作，旨在推翻巴茨的统治。随着德国重新奋起，纳粹主义的旧观念正在逐日崩溃。"
 Global_Conflicts.50.a:0 "波兰的新曙光。"
 SWRW_Chinanews.1.t:0 "[Get_newspaper_header] 西北政府获得胜利！"
 SWRW_Chinanews.1.desc:0 "随着中国西北的艰苦鏖战接近尾声，军阀马继援和西北政府似乎取得了胜利，将这一地区统一在了青天白日旗下。在临时首都西宁举行了胜利游行之后，马继援向中国人民发表了振奋人心的演讲，他谴责了日本帝国主义，并宣布南京政府是一个非法的傀儡政权。\n\n在同一场演讲中，马继援宣布自己将下台并组织选举，他声称这是对三民主义的实践和对自己家族过去所犯下的罪行的救赎。自由中国的残存势力，包括主流的国民党人、忠于蒋介石的将军和中国共产党的幸存者都跃跃欲试，试图把分裂的西北人民统一在自己的思想旗帜下。\n\n共荣圈方面尚未对此事表态。\n"
 SWRW_Chinanews.1.a:0 "泛亚团结的一大威胁。"
 SWRW_Chinanews.1.b:0 "敬孙中山的遗产！"
 SWRW_Chinanews.1.c:0 "中国统一是否近在眼前？"
 SWRW_Chinanews.2.t:0 "[Get_newspaper_header]孙治平赢得中国大选！"
 SWRW_Chinanews.2.desc:0 "孙治平，中华民国第一任总统孙中山的后裔，在最近统一的中国西部地区的选举中取得了胜利。从他的家族流亡到加利福尼亚后返回中国，孙治平承诺要依据他已故祖父的原则，使整个中国实现自由化，并与困扰中国西部的贫困问题作斗争。\n\n在他在共和国首都西宁的胜利演讲中，孙治平总统谴责了日本帝国主义，宣布中国人民在傀儡被消灭、日本威胁从他们的家园被驱逐之前，永远无法真正享有自由。俄罗斯联邦和美利坚合众国向孙治平表示祝贺。日本批评了总统不慎言辞，这是大东亚共荣圈首次承认了新的中华共和国。"
 SWRW_Chinanews.2.a:0 "真是鲁莽之言。"
 SWRW_Chinanews.2.b:0 "敬孙治平和自由！"
 SWRW_Chinanews.2.c:0 "新中国的老面孔。"
 SWRW_Chinanews.3.t:0 "[Get_newspaper_header]蒋经国赢得中国大选！"
 SWRW_Chinanews.3.desc:0 "在一场激烈的竞争之后，中国西部的选举已经落下帷幕，已故的蒋介石之子蒋经国被宣布为获胜者。他承诺在未来几年内将国家民主化，并恢复法律与秩序，使这个饱受困扰的地区重获宁静。\n\n在新首都西宁举行的胜利演讲中，新任总统明确表示，如果残存的自由中国希望远离野蛮的大日本帝国，就需要迅速实现工业化和军事化，以保卫他们剩下的家园。\n\n俄罗斯联邦和美利坚合众国对蒋经国在选举中的胜利表示祝贺。然而，日本对总统不负责任的言论提出批评，这是大东亚共荣圈首次承认新的中华共和国。"
 SWRW_Chinanews.3.a:0 "秩序与稳定。"
 SWRW_Chinanews.3.b:0 "失败历史的回响。"
 SWRW_Chinanews.3.c:0 "熟悉的人......"
 SWRW_Chinanews.4.t:0 "[Get_newspaper_header]李先念政变"
 SWRW_Chinanews.4.desc:0 "来自中国西部的震撼消息传出，被长期认为已被剿灭的中国共产党残部，在臭名昭著的游击领袖李先念带领下，发动政变推翻了马氏政府，在西部荒芜的土地上建立了毛派统治。\n\n新的社会主义政府已经开始大规模围捕政治异见人士，激进的民众示威者遭到公开开枪射击，大部分人口都被强制进行了\"再教育\"。西部中国的未来前景黯淡。\n\n至于这个政权能否在全然反对其存在的人民中稳固其控制权，还有待观察。目前，亚洲人民屏住了呼吸，一颗新的红太阳正在升起。"
 SWRW_Chinanews.4.a:0 "中国民主的又一次失败尝试。"
 WORLD.40035.c:0 "一个悲伤但不可避免的结果。"
 WORLD_Odessa_Ukranian:0 "此外，罗马尼亚政府还同意了俄罗斯提出的将敖德萨其余部分归还乌克兰的要求。最初导致谈判的只是德涅斯特河沿岸地区的移交，最终以港口城市的移交和罗马尼亚政府最初的提议而圆满结束。乌克兰全国人民都在庆祝他们所声称的错误在历史和文化先例的基础上得到了纠正。"
 Global_Conflicts.51.t:0 "[Get_newspaper_header]丹麦的锤子与镰刀"
 Global_Conflicts.51.desc:0 "几十年来，哥本哈根上空首次飘扬起一面红旗——这一次，红旗上没有北欧十字的装饰，而是马克思和列宁的指导原则。在丹麦人民党和民主党之间的分裂变得过于明显之后，共产党领导人阿恩·蒙克-彼得森决定巩固其党派的永久统治。虽然民主党一直强烈反对，但也被迅速处理掉了。\n\n丹麦现在处于先锋党的统治之下，日耳曼尼亚则处于混乱之中，在可预见的未来，蒙克-彼得森可以自由地开展活动。有了一段喘息的时间，他就可以肆无忌惮地统治丹麦人民。至于德国是否会将昔日的兄弟重新召回，只能由时间来证明了。"
 Global_Conflicts.51.a:0 "一个自由的丹麦？"
 Global_Conflicts.52.t:0 "[Get_newspaper_header]丹麦宣布进行自由选举"
 Global_Conflicts.52.desc:0 "在丹麦宣布进行自由选举之后，自由世界今天欢欣鼓舞。这一消息是在德国驻军因缺乏日耳曼尼亚的支持而崩溃之后发布的。消息宣布后不久，社会民主党和左翼党的重新崛起令国际观察家们感到欣慰，因为这两个政党都是温和的民主组织。专家们普遍预计，这两个政党将不得不在预计创纪录的高投票率中拼命争夺选票。\n\nOFN观察员对民主过渡表示赞赏，并向这个萌芽中的民主国家表示祝贺。世界其他国家则屏息凝视，等待着看民主是否能在如此接近日耳曼尼亚混乱的环境中生存下来。"
 Global_Conflicts.52.a:0 "一个自由、公平的丹麦。"
 Global_Conflicts.53.t:0 "[Get_newspaper_header]德国驻军巩固势力"
 Global_Conflicts.53.desc:0 "今天，丹麦的德国驻军已经巩固了自己的势力，并继续控制着这个国家。尽管得不到本国的支持，德国国防军还是将所有抵抗力量一扫而空。抵抗被击溃后，守备部队蛰伏起来，以渡过难关。驻军高层领导在声明中重申，他们打算“不惜一切必要手段”等待日耳曼尼亚的回归。\n\n国际观察家们谴责驻军严厉镇压平民骚乱，因为暴行的照片不断浮出水面。许多人认为，德国人只是延长了不可避免的结局。无论日耳曼尼亚是否回归，驻军都将张开双臂，尽可能长久地等待她的到来。"
 Global_Conflicts.53.a:0 "枷锁未被打破。"
 Global_Conflicts.54.t:0 "[Get_newspaper_header]索伦·卡姆突袭哥本哈根"
 Global_Conflicts.54.desc:0 "许多分析人士认为，随着大日耳曼国爆发不稳定，丹麦民族本可以重新掌控自己的国家地位。当羸弱的德国驻军掌权时，许多人想知道这支驻军能坚持多久，因为德国的内战造成了巨大的伤亡。在这场混乱中，索伦·卡姆和“丹麦民族社会主义”取得了胜利，卡姆是第二次世界大战老兵和狂热的反共主义者。\n\n由于许多所谓的共产党员已经被家人和好友报告为 “失踪”，全世界都在关注丹麦，然后才回到更紧迫的问题上。丹麦人民就像待宰的羔羊一样被放在银盘上招待卡姆，他们的愿望只是事后的想法。"
 Global_Conflicts.54.a:0 "丹麦人在哭泣，但世界会哭泣吗？"
 Global_Conflicts.55.t:0 "[Get_newspaper_header]巴尔干国际成立！"
 Global_Conflicts.55.desc:0 "随着动荡继续席卷中欧，俄罗斯的影响力开始向西蔓延，在一个最不可能的地方形成了一片缓和的绿洲。新成立的匈牙利人民共和国及其志同道合的邻国的代表已同意建立正式联盟。\n\n巴尔干国际是一个由其名义区域内的社会主义国家组成的军事和经济合作联盟，旨在抵消莫斯科和日耳曼尼亚的影响——如果后者从内战中胜出的话。\n\n随着中欧继续陷入混乱，欧洲的火药桶似乎终于冷却了。只有时间才能告诉我们这个新联盟将会发生什么。"
 Global_Conflicts.55.a:0 "十年黑暗之后，一轮红日冉冉升起。"
 Global_Conflicts.56.t:0 "[Get_newspaper_header]匈牙利内战"
 Global_Conflicts.56.desc:0 "20世纪60年代，匈牙利成为德国势力范围内为数不多的（如果不是唯一的）自由国家之一。今天，这一切都因布达佩斯的一场未遂政变而崩溃。箭十字准军事部队向匈牙利首都进军，他们感觉到了德国战败后的虚弱时刻。这次行动非常顺利，几座重要建筑在没有流血的情况下被占领。然而，法西斯主义者低估了匈牙利人民的意志。\n\n全国各地爆发了叛乱，并升级为全面内战。随着伊姆雷·纳吉领导下的社会主义势力在东部拿起武器，费伦茨·纳吉在西南部避难，宣布自己是合法政府的继承人。尽管法西斯分子可能控制了该国的中部地区，但国际观察家指出，他们现在面临着巩固其在全国范围内的统治的巨大挑战。"
 Global_Conflicts.56.a:0 "欧洲正在分裂。"
 Global_Conflicts.56.b:0 "多米诺骨牌一个接一个倒下。"
 Global_Conflicts.56.c:0 "铁幕正在合拢。"
 WORLD.41046.t: "[Get_newspaper_header]第四强权登台"
 WORLD.41046.desc: "美国和日本在今天宣布了一项令人震惊的发现。阿拉斯加和北海道的地质机构检测到来自俄罗斯北极地区的地震活动突然剧烈增加。这次地震持续了4.8秒，没有余震，不久之后就在空气中发现了辐射。这一切只可能意味着，[RUSGetUniqueNamePlain] 已经成功进行核武试验。\n\n德国已经谴责俄罗斯政府，声称这一步是在公然与德国敌对。然而，俄罗斯政府保证这只是为了“保护其主权免受外来侵略者的侵害”。自第二次世界大战结束以来，这两个欧洲大国之间的紧张关系开始加剧。"
 WORLD.41046.a: "我们将行所当行..."
 WORLD.41046.b: "他们恶意昭昭，不言而喻！"
 WORLD.41046.c: "指针离午夜更近一步……"
 War_Declaration.46.t:0 "[Get_newspaper_header]白军西进！"
 War_Declaration.46.desc:0 "东欧广袤的田野上，乌云压顶，沙皇尼基塔宣告了一次“荣耀与复仇的圣战”。他的副手鲍里斯·谢普诺夫紧随其后，向白军士兵们发表了激昂的演讲，号召他们去追逐俄罗斯的“天命所归”，一劳永逸地将德国人逐出他们的家园。德国元首也已开始调兵遣将，誓要将新生的俄罗斯扼杀在摇篮之中。\n\n国际社会对此反应不一。东京方面已表态支持帝国的复兴及其宏伟目标。而华盛顿对此缄默不语，是否介入，尚待观察。"
 War_Declaration.46.a:0 "让我们静待，历史是否会再次轮回。"
 War_Declaration.46.b:0 "天命攸归！"
 War_Declaration.46.c:0 "此行，我们不再施以慈悲。"
 WORLD_Odessa_Romanian:0 "[RUS.GetNameDefCap]还推动将具有战略和文化意义的城市敖德萨归还给乌克兰。然而，这个想法遭到了罗马尼亚政府的拒绝。[RUS.GetNameDefCap]认为这对该地区未来的稳定造成了打击，俄联邦成员对罗马尼亚决定支持1969年德涅斯特公投表示愤慨。"
 Global_Conflicts.57.t:0 "[Get_newspaper_header]沃尔特·延斯就任元首"
 Global_Conflicts.57.desc:0 "随着第二次德国内战的混乱终于结束，曾经反抗大日耳曼国的德国国防军如今已取得胜利，并任命了自己的元首。沃尔特·延斯于1941年加入纳粹党，并曾是马丁·鲍曼的小盟友，现在正统治着饱受摧残的德国——至少表面上如此。\n\n延斯缺乏经验，这导致许多分析人士认为德国国防军仍然控制着德国，他的任命是为了向德国公众和世界掩盖这一事实。然而，无论他真正掌握的权力有多大，这可能预示着自第二次西俄战争结束以来席卷德国的动乱的结束，德国开始从最近的灾难中恢复过来。"
 Global_Conflicts.57.a:0 "领袖原则，但谁是真正的元首呢？"
 Global_Conflicts.58.t:0 "[Get_newspaper_header]理查德·冯·谢拉赫被指定为下一任元首"
 Global_Conflicts.58.desc:0 "在血腥镇压了几个异见派系，纳粹政权也宣告失败后，由国防军领导的临时政府一直在重建失败政权的几个组成部分，甚至包括鲍曼党内存在问题的各级官僚机构。尽管存在这些相似之处，但国防军对所有形式的领导都进行了严格监督，包括新当选的元首理查德·冯·谢拉赫。\n\n谢拉赫是约瑟夫·戈培尔的侄子，也是鲍曼的得力助手，他对民族社会主义正统派和国家管理并不陌生。然而，尽管谢拉赫愿意领导，但他似乎只是军政府的一个不情愿的傀儡，这一事实似乎导致了他和军队之间的紧张关系。"
 Global_Conflicts.58.a:0 "军队和傀儡元首。"

 WORLD.114502.t: "[Get_newspaper_header]井深大宣布施行'警察改革计划'！"
 WORLD.114502.desc: "今天，[GetDateText]，一则消息从广东传出：在富士通株式会社的井深大带领之下，广东国————这一曾经的企业之国，正式宣布将扩大警察人员的规模。广东国官方对此解释为“由于外部环境不稳”的必要之举，但明眼人都看得出来这就是井深大在保全他的工程师乐园，当记者询问行政长官办公室，寻求他这么做的原因时，其保持了缄默。在这一政策影响下，广东国政府正迅速部署先进军械，甚至一些机构已经部署了重型装备，空军也已初步成型。\n\n东京与南京对此都不予置评。"
 WORLD.114502.a: "暗影之国，重现于世。"