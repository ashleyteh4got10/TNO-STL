l_simp_chinese:
 WORLD.40001.t: "[Get_newspaper_header]德国人投降了！"
 WORLD.40001.desc: "对许多人来说，第二次西俄战争的爆发只不过是俄罗斯新政府的徒劳之举，这场战争从宣战的那一刻起就注定要失败。然而，当一位代表元首发言的发言人宣布，为了使德国免遭核毁灭，德国政府决定将其东部边境割让给崛起的[RUS.GetAdjective]时，全世界都震惊了。放弃他们的“生存空间”所带来的国际和国内尴尬已经在全球范围内引起了震动。在德国的街道上，随着德国国防军准备宣布戒严，全国各地爆发了抗议活动。《里加条约》的后果将在未来许多年里对大日耳曼国产生重大影响。"
 WORLD.40001.a: "一个国家倒下了，另一个国家随之崛起。"
 WORLD.40001.b: "屈辱的日子终于过去了。"
 WORLD.40001.c: "俄国人总有一天会付出代价的……"
 WORLD.40001.d: "红军最强大！"
 WORLD.40002.t: "[Get_newspaper_header][400.GetName]条约"
 WORLD.40002.desc: "正如全球数百万人所预料的那样，德国国防军再次酣畅淋漓地击败了俄国军队。德国的外交官和将军们聚集在被占领的[400.GetName]市，与[RUS.GetAdjective]政府讨论投降的条件。经过与[RUS.GetAdjective]人长达几个小时的辩论，德国人和[RUS.GetAdjective]人签署了《[400.GetName]条约》。条约规定，莫斯科专员辖区的边界将恢复到A-A线，喀山和[850.GetName]将被割让给莫斯科专员辖区。该条约对[RUSGetUniqueNamePlain]造成的影响，对[RUS.GetAdjective]新政府来说无疑是毁灭性的，一些国际观察家怀疑[RUSGetUniqueNamePlain]将很快崩溃，回到无政府状态并且开始一个新的军阀混战时代。"
 WORLD.40002.a: "[RUSGetUniqueNamePlain]悲惨的命运。"
 WORLD.40002.b: "我们输了。一切都结束了。"
 WORLD.40002.c: "这一切早已注定。"
 WORLD.40003.t: "[Get_newspaper_header]俄罗斯对德国宣战！"
 WORLD.40003.desc: "当最近才重获统一的俄罗斯向德国宣战时，全世界都为之震惊。俄罗斯政府的公开目标是从德国占领者手中夺回本该属于他们的土地，让德国人为俄罗斯人民所遭受的几十年的屈辱付出代价。大日耳曼国已经开始针对他们东边的老对手进行动员，他们向德国人民和世界承诺，俄罗斯将在短短几周内再次被打败。全世界都屏住了呼吸，因为这是历史上第一次两个拥核大国直接对抗。世界的命运岌岌可危，数以百万计的人在祈祷，希望这场冲突能够尽快得到解决，不要让世界陷入黑暗。"
 WORLD.40003.a: "全世界都屏住了呼吸……"
 WORLD.40003.b: "破釜沉舟。"
 WORLD.40003.c: "放马过来吧，劣等人！"
 WORLD.40003.d: "大审判开始了！"
 WORLD.40003.e: "他们的土地，他们的人民，他们的血。"
 WORLD.40004.t: "[Get_newspaper_header]莫斯科的解放"
 WORLD.40004.desc: "最近几周，没有哪个城市比著名的莫斯科市更受关注。作为德国在东欧的统治中心，以及作为俄罗斯的前首都，莫斯科是向西进军的俄罗斯军队的首要目标。\n\n胜利的天平已经转向俄罗斯一方，城市已落入俄罗斯人手中。虽然德国人远未战败，但他们已经不大可能夺回莫斯科。该城市的沦陷在德国内外成为一个备受关注的事件，许多人将莫斯科的解放视为德国灭亡的开始。在团结协定内部，审查人员正在努力工作，阻止有关重大战败的消息传播。尽管如此，在整个德国势力圈内，异议之声不绝于耳，怀疑已经开始在德国公众中蔓延。"
 WORLD.40004.a: "俄罗斯崛起了？"
 WORLD.40004.b: "莫斯科已在身后！"
 WORLD.40004.c: "我们会回来的……"
 WORLD.40006.t: "[Get_newspaper_header]俄罗斯联邦战胜了团结协定"
 WORLD.40006.desc: "事情发生了令人震惊的转变，俄罗斯军队战胜了庞大的德国军队。面对俄罗斯的空中优势和经验丰富的士兵，团结协定已正式向俄罗斯联邦投降，以避免两国之间爆发全面核战争。俄罗斯联邦接受了这一要求，签署了《里加条约》。根据条约，团结协定移交了旧苏联的土地。当变革之风终于到来时，德国前帝国土地上的数百万人欢欣鼓舞。德国国内爆发混乱，民众指责德国政府软弱。从党卫军同情者到改革派等许多派系已经开始在街头展开斗争，而德国国防军则试图控制局势。只有时间才能告诉我们俄罗斯的胜利可能对欧洲和全球产生怎样的全面影响。"
 WORLD.40006.a: "一个强权倒下了，另一个强权随之崛起。"
 WORLD.40006.b: "光明的未来等待着联邦。"
 WORLD.40006.c: "这是否是大日耳曼国的灭亡先兆？"
 WORLD.40008.t: "[Get_newspaper_header]俄罗斯联邦战胜了团结协定"
 WORLD.40008.desc: "当亚历山大·波克雷什金宣布德国投降时，俄罗斯联邦爆发了欢呼声。俄罗斯联邦在战争初期取得了惊人的成功，利用德军之间的混乱和不和，将他们赶出俄罗斯平原，为俄罗斯人民夺回了莫斯科。当俄罗斯庆祝战胜西方敌人时，过去几十年的所有死亡、压迫和绝望都被一波欣快感冲走了。\n\n随着收复的俄罗斯领土上的重建工作开始，德国陷入了混乱，因为曾经不屈不挠的德国军队发现自己被一个它认为低等的民族击败了。针对现政权的新一轮抗议活动已经再度兴起，而且肯定还会有更多抗议活动接踵而至。然而，世界上其他地方的人们却满心欢喜地看着光明再次回到这个旧世界。"
 WORLD.40008.a: "俄国雄鹰翱翔天际！"
 WORLD.40008.b: "劣等人赢了！？"
 WORLD.40008.c: "德国终于崩塌了。"
 WORLD.40064.t: "[Get_newspaper_header]德国击败俄罗斯联邦"
 WORLD.40064.desc: "本世纪第四次，俄罗斯国旗再次褴褛不堪。压倒性的德军反击迫使亚历山大·波克雷什金与大日耳曼国进行投降谈判。随着前线的大规模撤离与宣布投降后的纷扰并存，国家安全人员开始对波克雷什金的领导失去信心。\n\n在德国，胜利的士兵归家与家人团聚，一个和平与团结的新时代已经开始，民族主义情感在这个饱经战火的国家蔓延开来。在自由国家组织，人们正在匆忙地重新制定战争计划，召开秘密政治会议讨论下一步行动。看来，民族社会主义对欧洲的控制将会持续很久，很久……"
 WORLD.40064.a: "我们辜负了我们的人民。"
 WORLD.40064.b: "德意志高于一切！"
 WORLD.40064.c: "俄国人再次战败。"
 WORLD.40010.t: "[Get_newspaper_header]符拉迪沃斯托克重归[RUS.GetNameDef]"
 WORLD.40010.desc: "经过日本帝国和[RUS.GetNameDef]之间的紧张谈判，两国在北京会面，签署了一项旨在解决领土争端的条约。\n\n该条约规定，外满洲的土地和符拉迪沃斯托克市重新纳入[RUS.GetNameDef]的领土，作为交换，俄罗斯将保证“东北”人民安全地前往北满洲和朝鲜。\n\n整个[RUS.GetNameDef]为国家对日本人的外交胜利举行了庆祝活动。随着符拉迪沃斯托克回归俄罗斯，全世界都在等待[RUS.GetNameDef]的下一步行动，因为他们把注意力转移到了西方，德国仍然控制着的莫斯科专员辖区。"
 WORLD.40010.a: "[RUS.GetNameDefCap]日益壮大。"
 WORLD.40010.b: "错误被纠正了！"
 WORLD.40010.c: "为了帝国的存亡。"
 WORLD.40011.t: "[Get_newspaper_header]比罗比詹重归[RUS.GetNameDef]"
 WORLD.40011.desc: "经过日本帝国和[RUS.GetNameDef]的谈判，两国在北京会面，签署了一项旨在解决领土争端的条约。\n\n条约规定，比罗比詹省被重新并入新生的俄罗斯政权，以换取该地区暴力活动的结束和游击队员返回俄罗斯。\n\n虽然[RUS.GetNameDef]的一些人庆祝俄罗斯领土的和平回归，但许多人认为政府在将他们的土地从日本占领下解放出来方面所作出的努力不够。随着远东问题的暂时解决，全世界都在等待[RUS.GetNameDef]的下一步行动，因为他们把注意力转移到了西方，仍被德国占领的莫斯科专员辖区。"
 WORLD.40011.a: "俄罗斯的一个小胜利。"
 WORLD.40011.b: "真是令人失望的结果……"
 WORLD.40011.c: "一项十分令人满意的条约！"
 WORLD.40015.t:0 "[Get_newspaper_header]俄日谈判开始！"
 WORLD.40015.desc:0 "在[RUS.GetNameDef]和[JAP.GetNameDef]之间经历了数周的不断加剧的紧张局势之后，日本人终于同意与[RUS.GetName]就有争议的领土外满洲进行谈判，希望与这个拥核大国达成和平。\n\n来自[RUS.GetNameDef]和共荣圈的外交官在中国北京举行了会谈。从美国到意大利帝国的国际观察员也聚集在这座城市，代表各自的政府观察谈判。\n\n日本人和俄罗斯人之间达成的协议可能会改变俄罗斯和日本在未来许多年里的命运。"
 WORLD.40015.a:0 "让谈判开始吧！"
 WORLD.40016.t:0 "[Get_newspaper_header]俄罗斯重得外满洲"
 WORLD.40016.desc:0 "经过日本帝国和[RUS.GetNameDef]之间的紧张谈判，两国在北京会面，签署了一项旨在解决领土争端的条约。\n\n在该条约中，外满洲的土地被重新并入[RUS.GetNameDef]，作为交换，俄罗斯将保证在东北的人民将安全地返回北满洲和朝鲜。\n\n整个[RUS.GetNameDef]为国家对日本人的外交胜利举行了庆祝活动。随着远东问题的解决，全世界都在等待[RUS.GetNameDef]的下一步行动，因为他们把注意力转向了仍处于德国控制下的莫斯科专员辖区。"
 WORLD.40016.a:0 "俄罗斯领土扩大了。"
 WORLD.40016.b:0 "离符拉迪沃斯托克更近一步。"
 WORLD.40016.c:0 "至少我们还有浦塩."
 WORLD.40012.t:0 "[Get_newspaper_header]布哈林被捕！"
 WORLD.40012.desc:0 "新近统一的俄罗斯联邦传出令人震惊的消息，前苏联总理尼古拉·布哈林，这个让苏联在纳粹战争机器面前土崩瓦解的人，被安全局成员发现并逮捕。\n\n人们一度认为他在莫斯科陷落后已经死亡，但他被捕并监禁的消息受到了生活在联邦内的大多数俄罗斯人的欢迎，民众为几十年前让他们遭受厄运的人终于得到应有的惩罚而高兴。西罗维基对总统的行动表示赞赏。\n\n然而，瓦西里·舒克申总统并未对此发表评论。"
 WORLD.40012.a:0 "俄罗斯的新纪元"
 WORLD.40017.t:0 "[Get_newspaper_header][RUSGetUniqueNamePlain]干预伊朗内战"
 WORLD.40017.desc:0 "随着内战在伊朗各地继续肆虐，[RUS.GetLeader]已经宣布[RUS.GetName]正式介入冲突。\n\n虽然其官方目标是为了恢复动荡地区的秩序，但许多国际观察家一致认为，[RUS.GetName]介入该地区的真正目的是扩大自己的影响力范围。\n\n尽管俄罗斯在经历了数十年的军阀割据后最近才实现统一，但[RUS.GetNameDef]已经开始在世界舞台上有所作为，颠覆了第二次世界大战结束以来的政治现状。\n\n“第四大国”介入伊朗内战改变了冲突中的力量平衡，并可能对决定战争结果产生影响。\n"
 WORLD.40017.a:0 "[RUS.GetNameDefCap]已然展翅。"
 WORLD.40017.b:0 "[RUS.GetNameDefCap]将恢复秩序。"
 WORLD.40018.t: "[Get_newspaper_header]黑军攻势失败"
 WORLD.40018.desc: "尽管最初在莫斯科专员辖区对德军取得了一些成功，但俄罗斯无政府主义者的力量被德军击退。无政府主义者曾希望从“国家的暴政”中解放出前俄罗斯领土的全部土地，但德国的控制似乎会在可预见的未来继续扩展到俄罗斯领土。\n\n德国外交部长在一份新闻声明中对德军的工作表示满意，并承诺秩序与稳定将重返德国东部的领土。目前无政府主义政府尚未发表正式声明，但内部消息源透露出一种绝望的氛围。他们最初只是在中西伯利亚的一小支叛军，为自由而行的征程似乎已经结束。"
 WORLD.40018.a: "俄罗斯的噩梦仍在继续。"
 WORLD.40018.b: "斯拉夫威胁已经被制服。"
 WORLD.40018.c: "黑旗不再飘扬。"
 WORLD.40019.t: "[Get_newspaper_header]斯捷潘诺夫的冒险失败了"
 WORLD.40019.desc: "在一次几乎没有人感到惊讶的事件转折中，德国人再次击败了从其东部边境入侵的俄罗斯军队。伊万·斯捷潘诺夫领导的无政府主义者部队，希望最终战胜大日耳曼国的军队。德国陆军和空军没有让他们感到满意，现在斯捷潘诺夫的部队必须回国，处理目前正在酝酿的国内局势。在可预见的未来，德国将不会有来自东方的威胁。\n\n德国外交部长表示，他相信政府将能够镇压东部领土上最后的抵抗。无政府主义者的领袖伊万·斯捷潘诺夫在行动的大部分时间中保持沉默。他不太可能能够守住现在控制的土地，并且看起来俄罗斯很快就要进入一个新的军阀时代。"
 WORLD.40019.a: "我们的力量在衰落，我们的人民也在衰落。"
 WORLD.40019.b: "黑军阀已被赶出我们的土地！"
 WORLD.40019.c: "先锋队在德国之鹰面前黯然失色。"
 WORLD.40020.t: "[Get_newspaper_header]第二次西俄灾难"
 WORLD.40020.desc: "红军再次入侵莫斯科专员辖区，希望粉碎德国战争机器，并从法西斯统治中解放他们的土地，但他们再次被德国国防军和空军在枪林弹雨中击退。双方都遭受了沉重的损失，数十万人的尸体腐烂在俄罗斯的平原上。俄罗斯土地的解放失败了，红军对德国东部不再构成威胁。\n\n德国外交部长对德国国防军再次粉碎了红军表示满意。苏联外交部长发表了他们自己的声明，即使面临失败，社会主义的精神永远不会离开俄罗斯民族，并且苏联终有一天将再次从灰烬中崛起。大多数专家仍对这一新的俄罗斯国家能否在未来几个月内持续下去持怀疑态度。\n"
 WORLD.40020.a: "我们革命的先锋队崩溃了。"
 WORLD.40020.b: "红军永远无法击败雅利安人。"
 WORLD.40020.c: "红军又一次失败了。"
 WORLD.40021.t: "[Get_newspaper_header]红军投降"
 WORLD.40021.desc: "时隔二十年，红军首次跨越边境进入由大日耳曼国控制的俄罗斯领土，旨在解救自己的人民摆脱纳粹统治的铁腕束缚。图哈切夫斯基大元帅承诺他的红军将彻底消灭德国人。然而经过数月的残酷战斗，已造成数十万人死伤，苏联军队再次被逼退。德国的敌人如今为失去摧毁德国东方势力的机会而哀悼，而德国则为在消灭布尔什维主义方面取得最终胜利而欢庆。\n\n德国政府承诺将尽最大努力修复东部领土所受的损害，并表示殖民工作将于年底前恢复。苏联政府内的消息来源对元帅最近的健康状况以及政府是否有足够的力量守住自己的领土表示关切。\n"
 WORLD.40021.a: "纳粹猪又活了一天。"
 WORLD.40021.b: "我们的生存空间安全了。"
 WORLD.40021.c: "红色拿破仑已经输掉了最后一战。"
 WORLD.40022.t: "[Get_newspaper_header]布尔什维克投降"
 WORLD.40022.desc: "整个自由世界的希望都寄托在苏联军队成功粉碎德军力量上。经过数月在俄罗斯平原上的惨烈战斗，德国国防军再次宣布击败了布尔什维主义势力。随着苏联军队的覆灭，苏斯洛夫的政府被迫坐上了谈判桌。在可预见的未来，德国在东部的统治将继续，整个自由世界为此损失感到哀悼。\n\n苏联外交部长承诺这并非是永久性的损失，剩余俄罗斯领土上的苏联统治将会延续，而美国国务卿宣称将在全球各个角落抗击德国的影响，这不过是一个小小的挫折。德国外交部简单地向国防军的英雄们表示感激之情。"
 WORLD.40022.a: "我们人民的噩梦仍在继续。"
 WORLD.40022.b: "布尔什维主义的弱点暴露了！"
 WORLD.40022.c: "马克思的学说再次失败了。"
 WORLD.40023.t: "[Get_newspaper_header]进步之路结束"
 WORLD.40023.desc: "在俄罗斯广袤的平原上，苏维埃联邦的军队在与德国国防军的残酷战斗中被击败。起初他们成功将德军击退，但随后却未能保住领土，逐渐被逼出德国各个专员辖区。这对自由世界来说是一场灾难。即使新近改革的共产主义政府有着一些古怪的特质，他们仍然曾将希望寄托在这个政府身上。然而现在看来，俄罗斯过去几年里所秉持着的变革，科学，创新的主张以失败告终。\n\n德国人民对胜利感到欣喜，日耳曼尼亚街头都在举行庆祝活动。自由世界与俄罗斯一同哀悼，目前尚不清楚苏联的下一步动向会是什么。但可以说的是，他们在可预见的将来将无法威胁到德国的殖民地。"
 WORLD.40023.a: "红星陨落。"
 WORLD.40023.b: "德意志高于一切！"
 WORLD.40023.c: "科学的力量逐渐减弱。"
 WORLD.40024.t: "[Get_newspaper_header]社会主义之女投降"
 WORLD.40024.desc: "由前苏联领导人布哈林的精力充沛的女儿带领，苏联军队不得不在德国国防军的逼迫下坐到谈判桌前。最初的成功让自由世界多数人士满怀希望，认为一股自由的浪潮即将席卷德国占领的欧洲大陆，然而德国的士兵们成功遏制住了这股浪潮，击退了这股红色的浪潮，稳固了他们对俄罗斯平原的控制。毫无疑问，在不久的将来，他们将不会再面临东方的威胁。\n\n俄罗斯领袖布哈林娜把自己和她最亲近的顾问们关在一起，讨论接下来的计划。一些未具名的消息源已经担心，新近重组的苏联开始出现问题。德国人对他们东部边境命运的逆转感到欣喜，而美国人已向俄罗斯人民表示了哀悼之情。\n"
 WORLD.40024.a: "布哈林仍未得到救赎。"
 WORLD.40024.b: "国家安全了！"
 WORLD.40024.c: "女儿和父亲一样倒下了。"
 WORLD.40025.t: "[Get_newspaper_header]苏联人投降了"
 WORLD.40025.desc: "整个自由世界屏息以待，期待德国在欧洲的主导地位崩溃。然而，德国人证明了这种看法是错误的，他们扭转了苏联军队最初的优势，并迫使他们撤退越过边境。卡冈诺维奇政府的指令严酷且苛刻，他们把所有希望都寄托在西部的胜利上。随着这次失利，人们对新统一的俄罗斯国家接下来可能发生的事情有些担忧。\n\n德国人民庆祝他们在与布尔什维主义的斗争中取得的胜利，他们对政府和党重新恢复了信心，庆祝活动几乎与首次东方胜利后的情景相匹敌。美国人对失败表示遗憾，但承诺会继续战斗。苏联政府尚未发表正式声明，有报道称卡冈诺维奇正在计划清洗那些妨碍战争的叛变分子。"
 WORLD.40025.a: "有人该对此负责……"
 WORLD.40025.b: "布尔什维主义无法击败德国！"
 WORLD.40025.c: "黑暗笼罩欧洲"
 WORLD.40026.t: "[Get_newspaper_header]苏维埃之灾"
 WORLD.40026.desc: "当苏联军队越过边境进入莫斯科专员辖区时，尼基塔·赫鲁晓夫深信苏联军队将会在“马克思主义进步的脚跟下”粉碎他们的德国对手。然而，如今这位苏联领袖却默默无言，因为在经历了最初在苏联军队手中的失败后，德国人设法将他们逐退，再次确保了他们对俄罗斯平原的控制。\n\n入侵之前充满了苏联城市和城镇街道的希望已经消失，取而代之的是一种怀疑的氛围，部长们和官员们互相指责彼此的失败。在大日耳曼国各地爆发庆祝活动的同时，焦虑和恐惧现在统治着整个苏联，人们正等待着这次失利可能带来的后果。"
 WORLD.40026.a: "怎么会这样？！"
 WORLD.40026.b: "我们的力量毋庸置疑！"
 WORLD.40026.c: "日耳曼尼亚崛起，世界在哭泣。"
 WORLD.40027.t: "[Get_newspaper_header]苏联军队承认失败"
 WORLD.40027.desc: "令自由世界各地许多人失望的是，苏联再次被德国国防军击败。许多人曾希望，在亚戈达领导下重新统一的俄罗斯，能够有足够的力量和坚韧来粉碎德军。然而，在经历了数月的残酷战斗后，欧亚大陆上成千上万的寡妇悲痛欲绝，苏联不得不承认失败。\n\n据报道，德国各地都有庆祝活动，尤其是在受到苏联入侵威胁的无损殖民地地区的德国人。 苏联政府内部的官员们对这次损失相互指责，但其中最激烈的是NKVD，他们要求展开新一轮的清洗行动，以消除他们视为阻碍战争的“国内异议分子”。看来，俄罗斯的内部清洗尚未结束。"
 WORLD.40027.a: "这件事谁该负责？！"
 WORLD.40027.b: "德意志依然胜利！"
 WORLD.40027.c: "靠劳改营是赢不了战争的。"
 WORLD.40028.t: "[Get_newspaper_header]苏维埃主席团宣布向德国投降"
 WORLD.40028.desc: "在最后的几个月里，所有的目光都投向了苏联，希望这个重新崛起的共产主义国家能够最终推倒德国对欧洲的统治。尽管德国人成功地将德军推过了俄罗斯平原的大部分地区，但德国国防军还是发动了一次成功的反击，以确保苏联军队遭到了毁灭性的打击。在德国人民庆祝击败布尔什维克的第三次胜利之际，帝国再次确保了其东部领土的安全。\n\n美国国务院信誓旦旦地表示，它将继续在全球范围内打击法西斯势力，这不过只是一个小小的挫折。回到苏联政府的大厅，气氛则要严峻得多。许多人开始质疑别索诺夫的领导能力，而更多的人则担心在这次惨败后苏联能否继续保持稳定。不过有一点是肯定的：苏联将不再会对德国构成威胁。"
 WORLD.40028.a: "马克思主义的理想与我们一同消散。"
 WORLD.40028.b: "千年帝国万岁！"
 WORLD.40028.c: "寡妇和工人都同样悲伤。"
 WORLD.40029.t: "[Get_newspaper_header]梦想死去"
 WORLD.40029.desc: "当苏联宣布入侵德国的东部领土时，整个世界为之屏息。如今，他们与俄罗斯人民一同哀悼，因为苏联宣布向德军投降。尽管最初在与德国国防军的战斗中取得了成功，但德国军方设法收复了大部分领土。苏联政府被迫承认了德国在第二次世界大战中获得的领土收益，世界为俄罗斯平原人民即将经历的悲剧而哀叹不已。\n\n在大日耳曼国各地爆发了庆祝活动，东部的德国殖民地定居点尤其热烈。作为新苏联的领袖，萨布林在失败后变得沉默。政府内部的消息称其为一个情绪低落的领导人，与他早前的风格截然不同。最后一丝希望已从俄罗斯人民心中消逝。\n"
 WORLD.40029.a: "梦想变成了噩梦。"
 WORLD.40029.b: "布尔什维主义在我们的力量面前倒下了！"
 WORLD.40029.c: "列宁的梦想再次破灭。"
 WORLD.40049.t: "[Get_newspaper_header]德军获胜"
 WORLD.40049.desc: "俄罗斯政府宣布向德军投降，俄军已从莫斯科专员辖区领土上被赶出。俄罗斯政府领袖斯韦特兰娜·斯大林娜在广播中宣布了战败的消息，随后返回办公室与顾问讨论接下来的计划。大多数国际观察家对这个将大部分赌注押在胜利上的政权的局势而感到担忧。\n\n德国政府则宣布举行全国庆祝日，各地区纷纷举办庆祝活动来庆祝这一胜利。美国政府承诺将继续在任何可能的地方与法西斯主义作斗争。俄罗斯政府承诺将恢复领土秩序，并表示这并不是他们政府的终结。"
 WORLD.40049.a: "我的一切努力终成徒劳……"
 WORLD.40049.b: "斯拉夫人暴露了他们的劣根性。"
 WORLD.40049.c: "帝国之鹰吞噬了俄罗斯。"
 WORLD.40050.t: "[Get_newspaper_header]德国国防军胜利"
 WORLD.40050.desc: "俄罗斯共和国已宣布无条件向大日耳曼国投降，因俄罗斯军队未能实现解放莫斯科的目标。据报道，俄罗斯许多城市已经出现动荡局势，数百万人走上街头，要求齐科夫总统立即下台。地方和国家警察部队已经展开部署，确保抗议活动保持和平。\n\n与此同时，在德意志地区，庆祝活动已经爆发，元首的新法令宣布他们战胜俄罗斯的胜利成为国定假日。日本对此作出了不满的缄默回应，而美国宣称在与法西斯主义的斗争中，民主将永不动摇。预计齐科夫总统将宣布举行选举，以平息抗议活动。"
 WORLD.40050.a: "灾难……"
 WORLD.40050.b: "斯拉夫人再次战败。"
 WORLD.40050.c: "俄罗斯人又输掉了一场战争。"
 WORLD.40051.t: "[Get_newspaper_header]帝国的灾难"
 WORLD.40051.desc: "随着俄罗斯在帝国的旗帜下重新统一，似乎20世纪初的悲剧终于随着沙皇制度如凤凰涅槃般的崛起而告一段落。然而，历史再次重演。沙皇弗拉基米尔三世宣布俄罗斯向德军的推进投降。\n\n社会主义、法西斯和自由主义的因素已经愤怒地涌现出来，似乎俄罗斯正走向另一场无政府状态。沙皇试图呼吁平静的努力已经失败，因为有关骚乱和混乱的报告席卷了整个俄罗斯。与此同时，德国人对他们的胜利感到欣喜若狂，啤酒屋里挤满了从战场归来的国防军士兵。在华盛顿，总统宣布无论如何，民主都将继续前进，法西斯主义不会战胜自由。"
 WORLD.40051.a: "神已经离弃我们了吗？"
 WORLD.40051.b: "雅利安种族的胜利！"
 WORLD.40051.c: "帝国无能的又一个例子。"
 WORLD.40052.t: "[Get_newspaper_header]残败的雇佣兵"
 WORLD.40052.desc: "仿佛历史永远不会青睐俄罗斯巨熊。今天，俄罗斯联邦宣布彻底向大日耳曼国投降，因为俄罗斯的军队在与宿敌的战斗中再次失利。在臭名昭著的雇佣兵米切尔·韦贝尔三世将俄罗斯最近统一后，俄罗斯似乎终于有机会对抗德国。然而，这一切都未能实现。有报道称，宣布投降后出现了大规模的不安情绪，同时还有报道称，在混乱中，韦贝尔已离开了该国。\n\n而在日耳曼尼亚，庆祝的气氛弥漫。在美国，他们因为所有投入俄罗斯的投资都付诸东流，民主又失去了另一个盟友，因此感到沮丧。在最近的一份声明中，美国总统宣布美国人民永远不会在任何情况下屈服于暴政。"
 WORLD.40052.a: "谁让外国人统治我们的土地？"
 WORLD.40052.b: "雅利安人种的优越性再次显现。"
 WORLD.40052.c: "俄罗斯又输了。"
 WORLD.40053.t: "[Get_newspaper_header]数学家的赌博失败了"
 WORLD.40053.desc: "伊戈尔·沙法列维奇宣布俄罗斯军队向德军投降，此举是在未能成功入侵帝国东部领土后采取的。在最初的入侵中，俄罗斯取得了令人瞩目的成功，世界上许多人都希望这最终将是结束纳粹对欧洲暴政的战争。然而，帝国似乎还将继续存在多年。几乎每个德国主要城市都在举行胜利庆祝活动，而俄罗斯的人们则转向绝望。\n\n尽管日本的反应相当缓和，但美国承诺这并不是反法西斯在欧洲的终结，他们将继续为解放旧世界免受压迫而战。然而，沙法列维奇必须应对入侵失败的后果，因为许多人质疑他在治理俄罗斯国家方面的能力，而俄罗斯则为倒下的人哀悼。"
 WORLD.40053.a: "也许我们的信仰错了。"
 WORLD.40053.b: "我们的力量仍然无可争议。"
 WORLD.40053.c: "黑暗笼罩世界。"
 WORLD.40054.t: "[Get_newspaper_header]大日耳曼国胜利"
 WORLD.40054.desc: "俄罗斯民族苏维埃共和国在与大日耳曼国的战争中正式失败。由自封的“新马克思”伊万·谢罗夫领导的民族苏维埃共和国，在苏维埃和纳粹意识形态的奇特融合下进行统治，并公开将民族俄罗斯人置于政策优先地位。谢罗夫声称这种融合是拯救俄罗斯在与德国的第三次冲突中的唯一途径，但他的所有理论最终只化作了数千名阵亡的俄罗斯士兵散落在俄罗斯平原上。\n\n在俄罗斯尚未被德国占领的地区，厌倦了谢罗夫的压政统治并为这次失败所羞辱的俄罗斯人已经开始武装反抗谢罗夫的政府。与此同时，德国在冷战中取得了彻底的胜利，并向世界证明了自己的实力。随着庆祝活动在德国领土上爆发，一个新的繁荣时代似乎正在德国到来。"
 WORLD.40054.a: "谁让外国人统治我们的土地？"
 WORLD.40054.b: "雅利安人种的优越性再次显现。"
 WORLD.40054.c: "俄罗斯无法再承受了。"
 WORLD.40055.t: "[Get_newspaper_header]欧亚国正式投降"
 WORLD.40055.desc: "欧亚国在与大日耳曼国的战争中遭到了失败。以列夫·古米廖夫的激情主义为核心的欧亚联邦是一个极右翼国家，坚信俄罗斯人在种族和政治上与亚洲民族有着紧密联系。这一主张已经变成现实，因为如今欧亚国的大部分领土已经永久地位于亚洲。在德国尚未占领的俄罗斯部分地区，那些厌倦了古米廖夫的新封建主义统治的人们已经拿起了武器反抗欧亚政府。古米廖夫能否度过即将到来的困境还有待观察。\n\n德国对欧亚国的胜利进一步巩固了其对旧世界的统治。从鹿特丹到深入俄罗斯平原的殖民城镇，欢庆活动已经开始。"
 WORLD.40055.a: "欧亚梦已经破灭，俄罗斯也随之破灭。"
 WORLD.40055.b: "下等人最终还是失败了。"
 WORLD.40055.c: "德国又赢了。"
 WORLD.40056.t: "[Get_newspaper_header]进攻溃不成军"
 WORLD.40056.desc: "民主主义似乎未能战胜法西斯主义，俄罗斯军队在德国国防军的无情反击下节节败退。俄罗斯共和国总统宣布有条件地向德国投降，而主要德国城市内却迸发出庆祝活动。自由世界的反应则较为克制，美国总统称德国的胜利为“全球民主的黑暗日”。\n\n随着德国人民取得这一伟大胜利，几个月前的政治裂痕已基本消失。德国人进入了一个自豪和团结的新时代。然而在俄罗斯，大规模抗议活动爆发，人民要求他们“软弱无能”的领导层下台进行新选举。随着许多俄罗斯城市宣布戒严，一个新的黑暗时代降临在俄罗斯人民身上。"
 WORLD.40056.a: "怎么会这样？"
 WORLD.40056.b: "事实证明，雅利安人更优秀！"
 WORLD.40056.c: "俄罗斯人再一次被羞辱了……"
 WORLD.40057.t: "[Get_newspaper_header]德军在东线获胜"
 WORLD.40057.desc: "德国陆军击败了俄罗斯共和国军队。在向德军投降后，俄军开始了向东漫长而痛苦的撤退，黑暗再度笼罩在旧世界上。战争的最后几天里，俄罗斯共和国政府不仅要面对军队内部的哗变，还有民众的抗议，这使得政府陷入无法施政的瘫痪状态。现在还不清楚共和国能否从这场灾难中恢复过来。\n\n世界对俄罗斯的这次失败反应不一。德国政府在民族主义和团结的浪潮中前进；许多公民抛开分歧，共同参与到国家所追求的伟大事业中。而自由国家组织则陷入了近乎瘫痪的状态。在一段时间内，召开秘密会议和重新制定计划将成为自由世界的大使们唯一的任务。"
 WORLD.40057.a: "又是一场耻辱……"
 WORLD.40057.b: "事实证明，雅利安人更优秀！"
 WORLD.40057.c: "铁幕依然矗立。"
 WORLD.40058.t: "[Get_newspaper_header]巨熊断掌"
 WORLD.40058.desc: "俄罗斯联邦遭遇了一次巨大的挫败，其与纳粹德国的战争在经过数月的战斗后以灾难性结局告终，德军攻破了俄军防线。尽管俄军英勇抵抗，但被迫撤退至A-A线，同时政府开始了和平谈判。面对失败，许多俄国人开始质疑俄罗斯民主的未来。在担忧政府崩溃的情况下，混乱和动荡在全国蔓延，许多公民已经开始逃离这个国家。\n\n在战争期间，叶利钦总统一直是俄罗斯人希望和自由的象征，但在正式投降前不久，他逃往美国，给国家留下了领导真空。随着俄罗斯的崩溃和德国人的胜利，自由的火炬在旧世界熄灭了。"
 WORLD.40058.a: "再见了，祖国……"
 WORLD.40058.b: "胜利万岁！"
 WORLD.40058.c: "俄罗斯的民主之光已经熄灭。"
 WORLD.40059.t: "[Get_newspaper_header]俄罗斯解放欧洲失败"
 WORLD.40059.desc: "世界陷入了沉默。俄罗斯民族共和国曾经不断向西推进，占领了团结协定东部领土，然而随后这一过程不仅停滞不前，而且完全逆转。德国国防军设法击退了俄罗斯军队，并迫使俄罗斯签署了一项条约，终结了俄罗斯夺回失去领土的任何企图。\n\n尼古拉·佩特林总统试图在这样一场国家悲剧的阴影下挽回人民的稳定感。在战争层面支持民族共和国的自由国家组织对此表示哀悼，并希望俄罗斯人民在与暴政斗争中继续战斗。与此同时，德国庆祝其在东欧的新统治地位，元首宣布取得了对“徒劳的自由主义侵略”的胜利。随着俄罗斯之鹰的倒下，任何关于欧洲自由的希望似乎都已在军靴的行军声中灰飞烟灭。"
 WORLD.40059.a: "我们辜负了我们的人民，也辜负了争取自由的斗争。"
 WORLD.40059.b: "正如预期的那样，我们再次击败了他们。"
 WORLD.40059.c: "自由世界再次失败。"
 WORLD.40059.d: "欧洲的自由之光已经熄灭。"
 WORLD.40060.t: "[Get_newspaper_header]帝国复国失败"
 WORLD.40060.desc: "今天最糟糕的事情发生了，德国人宣布战胜了俄罗斯对手。虽然最初白军的攻势显示出一些进展，但德国陆军最终证明了自己拥有更强大的力量，俄罗斯人被逐渐推回了A-A线。德军扭转了俄罗斯的攻势。无数人正在大规模逃离这个大陆，这是自巴巴罗萨行动以来前所未有的大逃亡。\n\n这次失败给欧洲的自由造成了毁灭性的打击，自由国家组织表示他们将继续为一个摆脱德国暴政的欧洲而战。与此同时，随着帝国各地的动荡局势不断升级，沙皇米哈伊尔二世敦促他的人民在这次毁灭性的失败面前保持冷静。社会主义者的煽动正在城市蔓延，同时白军内的一些派别质疑沙皇的领导，俄罗斯正迈向另一个黑暗时代。"
 WORLD.40060.a: "父亲……我很抱歉……"
 WORLD.40060.b: "意料之中的结果。"
 WORLD.40060.c: "真正的罗曼诺夫家族在他们的无名墓中团聚。"
 WORLD.40061.t: "[Get_newspaper_header]罗斯王国大败"
 WORLD.40061.desc: "今天对俄罗斯人民来说是个悲伤的日子，俄罗斯政府宣布有条件地向德军投降。尤里在这次失败中受到羞辱，他的合法性大大削弱。在一场可能的内战逼近这个被击败的俄罗斯国家时，留里克二世的继承人鲍里斯·克雷洛夫似乎对一些人来说是一个可行的替代人选。\n\n在德国，军事阅兵和欢呼的旁观者充斥着拥挤的大都市，庆祝活动随处可见。尽管德国政治的两极分化日益加剧，这次胜利却唤起了多年来未曾见到的爱国主义。其他地方的反应较为温和，日本人保持相对沉默，而美国据称已派遣大使向为俄罗斯自由而战失去生命的人表示哀悼。"
 WORLD.40061.a: "留里克王朝能否幸存？"
 WORLD.40061.b: "这证明我们的意志是优越的！"
 WORLD.40061.c: "俄罗斯再次陷入沉寂。"
 WORLD.40062.t: "[Get_newspaper_header]俄罗斯战败"
 WORLD.40062.desc: "俄罗斯人民再次败在强大的德国军队手中。尽管俄军最初取得了一些成功，占领了大部分俄罗斯平原并击退了莫斯科专员辖区的军队，但德国人成功地阻止了攻势并最终将他们击退，重新夺回了他们的殖民地领土，双方都损失惨重。俄罗斯在位君主罗格涅达一世发现自己和已故的尼古拉二世一样不受欢迎，同时人们对留里克王朝的信心已经动摇。\n\n大日耳曼国各地爆发了庆祝活动，许多人穿着盛装嘲笑新俄罗斯的奇怪习俗和时尚。美国承诺，这并不是反法西斯斗争的结束。然而，对于罗格涅达来说，她承诺的西部解放目标对人民的严厉政策已经化为灰烬。俄罗斯现在是一个等待爆炸的火药桶。"
 WORLD.40062.a: "我们曾被许诺荣耀，却发现灰飞烟灭。"
 WORLD.40062.b: "让他们在黑暗时代腐烂​​吧。"
 WORLD.40062.c: "母狼撤退了。"
 WORLD.40063.t: "[Get_newspaper_header]人民联盟进军失败"
 WORLD.40063.desc: "令俄罗斯和自由世界的每个人感到失望和恐惧的是，俄罗斯人民联盟在解放东欧的努力中失败了。在整个联盟范围内，许多人相信这支不可战胜的传奇军队能够击败陷入困境的德国国防军，但事与愿违。经过数月的残酷战斗，这支军队失去了凝聚力，最终土崩瓦解。\n\n据报道，德国各地都在庆祝，预计元首本人将在电视讲话中亮相。与此同时，巴托夫及其亲信现在正努力维持联盟的稳定，并从这次失败中恢复过来。一些官员正试图寻找替罪羊，认为这次失利是由持不同政见者造成的，似乎俄罗斯的不稳定时代已经回归。"
 WORLD.40063.a: "梦碎了。"
 WORLD.40063.b: "雅利安人勇气的证明！"
 WORLD.40063.c: "士兵不再行军。"
 WORLD.40065.t: "[Get_newspaper_header]白军在德国面前溃不成军"
 WORLD.40065.desc: "白军的力量终于遇到了强劲的对手，鲍里斯·谢普诺夫将军宣布俄罗斯帝国于今天上午十一点向德军投降。尽管最初取得了成功，但白军未能守住他们的收益，随后德军将他们逼回了边境。如今，白军狼狈地返回国内，领导层正在寻找替罪羊，试图解释这次灾难性的失败。\n\n与此同时，大日耳曼国的人民正在庆祝，而世界其他地方却为本可能摧毁纳粹帝国而哀悼。在俄罗斯，鲍里斯·谢普诺夫和沙皇正在激烈讨论接下来会发生什么。白军对帝国的控制正在减弱，俄罗斯各大城市都传出了自 1917 年以来从未有过的呐喊声。俄罗斯似乎正走向更多年的混乱和绝望。"
 WORLD.40065.a: "白军不再进军。"
 WORLD.40065.b: "德意志之鹰在翱翔！"
 WORLD.40065.c: "即使是帝国也无法拯救俄罗斯。"
 WORLD.40066.t: "[Get_newspaper_header]德国取得对俄战争的胜利"
 WORLD.40066.desc: "世界正在经历重大时刻，第二次西俄战争以与第一次类似的方式结束，以德国的胜利告终。据报道，随着街头局势恶化为几乎无政府状态，俄罗斯的统治者谢尔盖·布尼亚琴科现从公众视野中消失。作为曾在第一次西俄罗斯战争期间背叛红军的团体的一员，街头充斥着一种传言，即谢尔盖可能故意地让俄罗斯再次战败。\n\n在德国，一种更加积极的氛围弥漫在街头，许多城市中爆发了大规模的庆祝活动。政治分歧已经消融，新团结的德意志民族从70年代的困境中崛起。虽然步履缓慢，但整个世界已经开始意识到大日耳曼国将会长久存在。"
 WORLD.40066.a: "叛徒的救赎化为灰烬。"
 WORLD.40066.b: "雅利安人再次成为至高无上的存在！"
 WORLD.40066.c: "又是一场毫无意义的屠杀……"
 WORLD.40067.t: "[Get_newspaper_header]法西斯分子的革命崩溃"
 WORLD.40067.desc: "俄罗斯似乎注定要在未来的岁月里屡遭失败。在过去的一个世纪中，她已四次在各色政府的领导下饱受摧残。今天，在里加，德国人和俄罗斯人已就和平解决方案达成一致，正式结束了俄罗斯民族复兴战争。这场战争以一场令人难忘的失败画上句号，而带来失败的这个国家曾是俄罗斯法西斯的源泉。许多人称这场战争为“法西斯世界的内战”，而它已再次证明德国的主导地位是不可撼动的。\n\n在此之前，阿穆尔州政府为赢得战争而做出的日益绝望的尝试，已成为民族不满情绪、罢工和国际谴责蔓延的导火索。几乎每座俄罗斯城市的街道上都挤满了持不同政见者，而这场针对俄罗斯人民的战争却看不到尽头。当德国雄鹰比以往任何时候都飞得更高时，俄罗斯的悲剧仍在继续。"
 WORLD.40067.a: "下次，我们会烧毁柏林。"
 WORLD.40067.b: "世上只能有一个帝国。"
 WORLD.40067.c: "东方的泪水无声落下。"
 WORLD.40068.t: "[Get_newspaper_header]水龙头断流"
 WORLD.40068.desc: "在本世纪最奇怪的一次转折中，德国战胜了一个由德国资本统治的俄罗斯。在向叛变的萨马拉共和国投入大量投资后，奥克坦集团迅速发现他们需要管理一个国家，而这一切都是为了他们自己的金库。随着资本流过边界，奥克坦集团对自己的能力越来越有信心，因此发动了对德国东部领土的失败入侵。\n\n可是，他们似乎忘记了东道主的实力。毫不含糊地说，德国已经削弱了毫无准备和不合作的雇佣军队，导致奥克坦集团因战争赔偿形式的巨大损失。随着俄罗斯失去了其西方的资助者，他们的未来似乎比以往任何时候都更加黯淡。"
 WORLD.40068.a: "总有一天，我们会实现收支平衡。"
 WORLD.40068.b: "现金买不到胜利。"
 WORLD.40068.c: "商人需要更严格的束缚。"
 WORLD.40069.t: "[Get_newspaper_header]德国战胜罗斯雅利安国"
 WORLD.40069.desc: "在过去二十年中被大多数军事分析家视为最具可预测性结局的战争中，第二次西俄罗斯战争以彻底的灾难收场，罗斯雅利安国不得不与获胜的德国签署了一项和平条约，对德国人的重大让步不可避免。在整个德意志地区，大部分主要城市举行了胜利游行。在法兰克福，市长宣称“欧洲人民终于摆脱了远东反动势力的威胁”。\n\n在罗斯雅利安国各地，种族优越感的幻象在德国军事力量的压倒下被打破，导致该国陷入彻底混乱。农村地区被军阀和无政府状态笼罩，城市则被罢工所控制。罗斯雅利安国的前景似乎是短暂的。"
 WORLD.40069.a: "老鹰萎靡不堪......"
 WORLD.40069.b: "巨熊被处理了。"
 WORLD.40069.c: "意料之中的结果。"
 WORLD.40069.d: "他们没有获胜的机会。"
 WORLD.40070.t: "[Get_newspaper_header]许珀耳玻瑞亚战败"
 WORLD.40070.desc: "随着第二次西俄罗斯战争的枪声平息，德国与许珀耳玻瑞亚之间在里加签署了一项条约。许珀耳玻瑞亚已经因失去几乎所有军事力量而陷入废墟。自从俄罗斯重新统一以来，战争的鼓声一直在响起，然而它们已被德国军事的强大力量击败并摧毁。\n\n随着俄罗斯的经济在这场新的失利中摇摆不定，这一惨痛的教训深深地铭刻在她人民的鲜血中，全世界都在关注许珀耳玻瑞亚是否还能存续。许多专家认为俄罗斯很快将会分崩离析，随之而来的将是一个混乱无序统治俄罗斯人民的新时代。在德国庆祝胜利的同时，俄罗斯陷入了混乱之中。"
 WORLD.40070.a: "我们激怒了众神。"
 WORLD.40070.b: "我们意志的胜利。"
 WORLD.40070.c: "该死，现在德国人有优势了......"
 WORLD.40070.d: "旧世界已经结束了。"
 WORLD.40071.t: "[Get_newspaper_header]黑色联盟被击败"
 WORLD.40071.desc: "大审判的失败只是俄罗斯许多失败中的又一个。当黑色联盟冲过德国东部边境时，全世界许多人都期待俄罗斯国家复兴政府能彻底击败他们所认为的宿敌。然而，在经历了一次格外寒冷的冬季后，德国军方迅速扭转局势，成功收复了失地。\n\n在俄军向俄罗斯国家复兴政府内地的大规模撤退过程中，黑色联盟犯下了许多暴行。对维亚特卡以及其他西俄罗斯著名城市的破坏行为引发了广泛的国际谴责。黑色联盟现在在对抗条顿人的征途中孤军奋战，随着国防军逼近首都鄂木斯克，一些人不禁担心，德国人抵达这座城市时可能会发生什么。"
 WORLD.40071.a: "老鹰将尖叫着死去！"
 WORLD.40071.b: "光说不练。"
 WORLD.40071.c: "自由世界为欧洲哭泣。"
 WORLD.40071.d: "亚佐夫被证明是错误的。"
 WORLD.40072.t: "[Get_newspaper_header]俄罗斯民族共和国战败"
 WORLD.40072.desc: "俄罗斯共和国军队发起了对大日耳曼国的进攻，不仅试图夺回他们国家的领土，还要夺回他们的自豪感，重新在世界舞台上占据一席之地。然而，随着德军不断深入俄罗斯领土，似乎德军已经第三次在三十年内战胜了这个国家，他们的努力似乎徒劳无功。\n\n全俄元首米哈伊尔·马特科夫斯基在和平谈判中缺席，以健康问题为由尚未就这次惨败发表任何讲话。尽管如此，共和国内部的官员们宣布在即将到来的危机中继续相信他的领导。自由国家组织发布声明，谴责德国的“纳粹侵略行为”，并向俄国元首的政府表示象征性的良好祝愿，但很少有人指望共和国能在未来几天内幸存下来。"
 WORLD.40072.a: "这场战斗不容失败！"
 WORLD.40072.b: "他们对强大一无所知。"
 WORLD.40072.c: "帝国又活过了一天。"
 WORLD.40072.d: "意志是无法战胜力量的。"
 WORLD.40107.t: "[Get_newspaper_header]德国战胜俄罗斯联邦"
 WORLD.40107.desc: "在俄罗斯总统瓦西里·舒克申突然去世后，副总统亚历山大·波克雷什金今天在新西伯利亚宣布，俄罗斯联邦将准备与大日耳曼国就投降事宜进行谈判。自20世纪50年代以来，自由世界为推翻大日耳曼国在欧洲的统治所寄予的最大希望在舒克申去世后破灭，俄罗斯人民对他们鼓舞人心的领袖的离世感到绝望。\n\n在宣布消息后，德意志的胜利庆典已经举行，专家预测由于这一胜利，德国领导层在未来几年将获得全权。另一方面，自由国家组织和共荣圈正在为联邦制定紧急应急计划，因为舒克申的过早离世，他们可能担心 - 或者是势力阵营的情况下，希望 - 俄罗斯会陷入崩溃。"
 WORLD.40107.a: "祖国可能永远也无法再统一了。"
 WORLD.40107.b: "劣等人战败了。"
 WORLD.40107.c: "德国再次确保了其邪恶帝国的安全。"
 WORLD.40107.d: "欧洲的曙光再次熄灭。"
 WORLD.40073.t: "[Get_newspaper_header]图哈切夫斯基的红军胜利了！"
 WORLD.40073.desc: "在考纳斯的一次演讲中，面对数百万观众，大元帅兼苏联总理米哈伊尔·图哈切夫斯基得意洋洋地宣布，红军成功击退了大日耳曼国的“法西斯害虫”，并宣布结束了数十年的占领，取得了战争胜利。与此同时，随着国防军拼命地撤退回日耳曼尼亚，德国政府似乎陷入了彻底混乱的状态。\n\n尽管国际观察家为德国的失败而欢呼，但对复兴中的联盟的重建政策产生了担忧。大规模的清洗已经在东欧各地展开，东方德意志人正在大规模被驱逐和逃离被占领地区，有报告称化学和生物武器仍在肆虐着这片土地。看来，俄罗斯虽然取得了胜利，但并没有放弃其破坏性的做法。"
 WORLD.40073.a: "德国大军已被消灭！"
 WORLD.40073.b: "雄鹰坠落。"
 WORLD.40073.c: "东欧将会变成什么样？"
 WORLD.40074.t: "[Get_newspaper_header]数学家的胜利"
 WORLD.40074.desc: "随着里加条约的宣布，德国士兵战败归家，对于民族社会主义来说这是一个黯淡的日子。俄罗斯共和国总统伊戈尔·沙法列维奇在明斯克发表了一次重要讲话，宣称“俄罗斯终将迎来和平与繁荣的归来”。\n\n在德国，大规模的骚乱爆发了，反叛的军队抗议“软弱无能”的政府。在美国，反响要积极得多，尽管美国政府私下不赞同沙法列维奇的专制方法，但大多数美国城市在德国战败消息传来时都爆发出了自发的庆祝活动。在东欧，俄罗斯计划进行从东德到寡头们的大规模土地重新分配，同时对共产主义叛乱分子进行严厉惩罚。俄罗斯巨熊取得了胜利，但并未显露出失去锐齿的迹象。"
 WORLD.40074.a: "俄罗斯万岁！"
 WORLD.40074.b: "我们被羞辱了……"
 WORLD.40074.c: "巨熊重返世界舞台。"
 WORLD.40075.t: "[Get_newspaper_header]红军在第二次西俄战争中取得胜利！"
 WORLD.40075.desc: "在苏联正式宣布击败大日耳曼国、夺回布哈林苏维埃领土，为联盟正名的同时，红军屹立于欧洲之上，为俄罗斯在巴巴罗萨行动中的失利报仇。\n\n现在被誉为“胜利元帅”的苏联资深领袖格奥尔吉·朱可夫发表了一系列慰问演说，向在与法西斯势力的斗争中献出生命的人们致敬，确保他们的斗争并非徒劳无益。苏维埃共和国之间狂欢的氛围，如今已融入了重建和恢复新解放地区的计划中，唤起了一种许多人曾担心永远失去的情感。随着欧洲再次点亮了蜡烛，俄罗斯终于可以感受到希望的回归。"
 WORLD.40075.a: "三十年。三场战争。数百万战友血仇得报。"
 WORLD.40075.b: "布尔什维克败类回来了！"
 WORLD.40075.c: "焕发第三春！"
 WORLD.40076.t: "[Get_newspaper_header]人民联盟获胜"
 WORLD.40076.desc: "当巴托夫宣布德国在东欧的抵抗力量已经崩溃时，俄罗斯人民联盟内爆发出热烈的庆祝活动。势不可挡的钢铁浪潮让联盟军队在战争初期取得了数次胜利，因此他们得以利用德国国防军的混乱和恐慌扩大战果。这次胜利冲刷掉了前几十年的许多苦难和痛苦，取而代之的是对压迫者取得胜利的狂喜感。\n\n随着重建工作在新收复的领土上展开，德国充满了动荡，因为曾经不可战胜的德国军队已被一支曾经被认为是劣势的军队击败了。德国的混乱一触即发，而世界其余部分则欣喜地注视着现代的苏沃洛夫解放了这个旧世界。"
 WORLD.40076.a: "一场旷世胜利！"
 WORLD.40076.b: "天哪……"
 WORLD.40076.c: "帝国已经支离破碎。"
 WORLD.40077.t: "[Get_newspaper_header]苏联取得第二次西俄战争的胜利！"
 WORLD.40077.desc: "谢尔盖·别索诺夫在苏维埃最高主席团内广播宣布了联盟在与大日耳曼国等待已久的斗争中取得胜利的消息。这次胜利有效地弥补了俄罗斯在三十年前巴巴罗萨行动期间所遭受的领土损失，并使苏联恢复到世界强国的地位。\n\n在西伯利亚远东的孤立NKVD和红军残余的重铸下，别索诺夫在前总理亨里希·亚戈达被驱逐后接管了指挥权。与臭名昭著的NKVD上尉相比，别索诺夫将权力集中在党的机构周围，而不是他自己。这以他的铁腕意志推动了布哈林的事业。\n\n与此形成鲜明对比的是，大日耳曼国内部动荡不安，反对派成员指责[GER.GetLeader]导致了帝国的惨败。"
 WORLD.40077.a: "荣耀属于别索诺夫！荣耀属于苏联！"
 WORLD.40077.b: "这些俄罗斯布尔什维克永远不会吸取教训！"
 WORLD.40077.c: "三十年的战争。同样的战斗者，却得到相反的结果。"
 WORLD.40078.t: "[Get_newspaper_header]苏维埃联邦在第二次西俄战争中获胜！"
 WORLD.40078.desc: "在第二次西俄战争中，苏维埃社会主义共和国联邦成功战胜了大日耳曼国，解放了前苏联领土，并在此过程中巩固了俄罗斯作为世界主要技术强国的地位。\n\n俄罗斯的军队部分地借助实验性的“奇迹武器”取得了对德国国防军的令人瞩目的胜利，部分原因也归功于其领袖——[KOM.GetLeader]总理的革命意志。\n\n随着胜利的宣告，远视社会主义以及整个苏联都进入了一个智力卓越的黄金时代。在对社会进步的不懈推动下，苏维埃社会主义共和国联邦毫不拖延地宣布了在已获得的领土内发展其苏维埃“超文化”的新计划。"
 WORLD.40078.a: "俄罗斯、社会主义和人类的胜利！"
 WORLD.40078.b: "雅利安人的思想力量辜负我们了吗？"
 WORLD.40078.c: "俄罗斯已将自己推向一个新的、大胆的未来，但世界会追随它吗？"
 WORLD.40079.t: "[Get_newspaper_header]苏联赢得第二次西俄战争！"
 WORLD.40079.desc: "新改革的苏联在第二次西俄战争中取得了胜利，不仅向欧洲软弱的法西斯主义者发出了信号，而且向我们所知的整个世界秩序发出了信号。\n\n苏斯洛夫的红军燃烧着对过去30年罪行的复仇欲望，他们用在苏联党领导下为实现俄罗斯现代化而进行的详细社会发展中锻造的武器，战胜了他们的德国敌人。这位总理经常被描述为主席团的“傀儡大师”，他声称这次胜利是他之前的社会主义理论家所提出的“不朽科学”的高潮，并承诺将这场胜利的革命扩大到那些“被全球帝国主义世界体系奴役”的国家。随着东欧的燃烧，一个新的红色黎明在地平线上升起。一个将永远烧毁那些阻碍苏斯洛夫阴谋的人的黎明。"
 WORLD.40079.a: "总理的目光将投向世界。"
 WORLD.40079.b: "他们显然没有吸取教训！"
 WORLD.40079.c: "30年后，苏联再次崛起。"
 WORLD.40080.t: "[Get_newspaper_header]苏联赢得第二次西俄战争！"
 WORLD.40080.desc: "苏联已在与大日耳曼国的战争中胜利崛起，不仅在历史眼中赎回了俄罗斯，还赎回了布哈林家族的尊严。\n\n起源于前科米共和国内一群社会主义者，尼古拉·布哈林的女儿斯韦特兰娜·布哈林娜崭露头角，立志汲取父亲的教训。新任总理打造了独特开放而平等的社会主义，以建立一个供苏联子孙后代茁壮成长的社会基础为重点，应对联盟的物质匮乏。尤其在女性和少数群体方面的进步政策，与如今陷入困境的大日耳曼国形成鲜明对比，为那些曾在纳粹铁蹄下受奴役的人们带来新希望。"
 WORLD.40080.a: "您终于可以安息了，父亲。"
 WORLD.40080.b: "布哈林娜很快就会遭遇与她父亲同样的命运。"
 WORLD.40080.c: "有其父不必有其女"
 WORLD.40081.t: "[Get_newspaper_header]黑军在第二次西俄战争中取得胜利！"
 WORLD.40081.desc: "在一个令人震惊的转折事件中，俄罗斯黑军战胜了德国国防军，巩固了“军队指导下”的无政府主义作为东部各个社区在其领导下将受到统治的权威。最近在伊万·斯捷潘诺夫的领导下实现了集中统一的黑军，凭借其迅速的机动性压倒了瘫痪的德国驻军，确保了德国在有效作出反应之前，获得了重要的后勤枢纽。\n\n斯捷潘诺夫领导下的“自由地区安全委员会”宣称这是他们这种独特类型的广义无政府主义的一次决定性胜利，这使得德国外交部陷入震惊的沉默，甚至无法公开承认这次耻辱性的失败。"
 WORLD.40081.a: "安那其母亲养育了一个由骄傲的战士组成的家庭。"
 WORLD.40081.b: "怎么会这样？"
 WORLD.40081.c: "解放，还是更仁慈的压迫者的胜利？"
 WORLD.40082.t: "[Get_newspaper_header]苏联在第二次西俄战争中获胜！"
 WORLD.40082.desc: "苏联在与大日耳曼国的持久战中取得了胜利。不仅仅在俄罗斯境内，而且在所有追随这位新“钢铁之人”的地方，都巩固了斯大林主义的胜利。红军的进攻潜力如钢铁交响乐团的火焰般缓缓升起，将各个专员辖区笼罩在一片装甲的海啸中，那些不堪一击的政权毫无逃脱的希望。\n\n先前在苏联更正统派系中被视为“修正主义者”的拉扎尔·卡冈诺维奇对已故的约瑟夫·斯大林的原则的坚守，终于挽回了俄罗斯作为世界大国的地位，但却没有提及那些为实现他的冷酷愿景而牺牲的人。"
 WORLD.40082.a: "钢铁之人现在终于可以休息了。"
 WORLD.40082.b: "他们让我们措手不及，我们必须报仇！"
 WORLD.40082.c: "看起来很熟悉，但我不太明白为什么。"
 WORLD.40083.t: "[Get_newspaper_header]无政府主义者在第二次西俄战争中取胜！"
 WORLD.40083.desc: "在一个令人震惊的转折中，俄罗斯自由地区在对德国国防军取得了轰动性的胜利，巩固了先锋无政府主义，使东部各族群团结在一起。在理想主义领袖彼得·谢乌达的领导下，改革过的黑军压倒性地击败了瘫痪的德国驻军，凭借他们的迅捷机动，在德国能够有效作出反应之前，确保了重要的后勤枢纽。\n\n作为“俄罗斯无政府主义委员会”的领袖，谢乌达宣布这是他们这种奇怪的广义无政府主义的一次决定性胜利，这使得德国外交部陷入了愕然的沉默，甚至不敢公开承认这一令人羞愧的失败。"
 WORLD.40083.a: "安那其母亲养育了一个由骄傲的战士组成的家庭。"
 WORLD.40083.b: "怎么会这样？"
 WORLD.40083.c: "无政府主义的幽灵在东方升起。"
 WORLD.40084.t: "[Get_newspaper_header]苏联取得第二次西俄战争的胜利！"
 WORLD.40084.desc: "亨里希·亚戈达在苏维埃最高主席团内广播宣布了联盟在与大日耳曼国等待已久的斗争中取得胜利的消息。这次胜利有效地弥补了俄罗斯在三十年前巴巴罗萨行动期间所遭受的领土损失，并使苏联恢复到世界强国的地位。\n\n由西伯利亚远东地区孤立的NKVD和红军残余重组，亚戈达的联盟通过使用残酷的镇压和集中的国家发展来集中其权力。作为代理总理，亚戈达以他为核心建立了一个钢铁般的政党机构，用他铁的意志推进布哈林的事业。\n\n大日耳曼国则处于混乱之中，反对派将帝国的惨败归咎于[GER.GetLeader]。"
 WORLD.40084.a: "荣耀属于亚戈达！荣耀属于苏联！"
 WORLD.40084.b: "这些俄罗斯布尔什维克永远不会吸取教训！"
 WORLD.40084.c: "三十年的战争。同样的战斗者，却得到相反的结果。"
 WORLD.40085.t: "[Get_newspaper_header]苏联赢得第二次西俄战争！"
 WORLD.40085.desc: "苏联在与大日耳曼国的持久战中取得了胜利，巩固了赫鲁晓夫独特的社会主义，使其成为治理俄罗斯的方式。红军的进攻潜力如钢铁交响乐团的火焰般缓缓升起，设法以巨大的物资和人员代价击败了德国国防军。\n\n在推翻了卡冈诺维奇集团领导下的斯大林追随者后，尼基塔·赫鲁晓夫仅凭借内务人员的意愿才成为了总理。虽然绝非乌托邦，苏联已专注于通过渐进的自由化浪潮来解体斯大林体系，为少数民族赋予“逐步的”权利，并在公众中修复斯大林的形象，尽管没有提及那些在他精密机器的齿轮中逝去的人 。"
 WORLD.40085.a: "锤子和镰刀高高地飞过我们祖国的黄色田野。"
 WORLD.40085.b: "赫鲁晓夫很软弱，这个联盟将会像第一个联盟一样垮台！"
 WORLD.40085.c: "旧秩序被抛弃，赫鲁晓夫的苏联登上了舞台。"
 WORLD.40086.t: "[Get_newspaper_header]苏维埃联盟胜利"
 WORLD.40086.desc: "红军入侵团结协定是意料之中的事，但许多人预测，以瓦列里·萨布林为领袖的新苏联的乐观情绪将会被德国陆军那双黑色战靴所击碎。通过一系列游击战战术和装甲突击，他们在东线穿破了德军薄弱的防线，夺回了原苏联控制的领土，迫使德国投降，证明了怀疑者们的错误。\n\n苏联外交部长奥托·布劳恩承诺，欧洲人民可以通过共产主义再次看到自由的曙光，并补充道，新苏联的土地将被重建到发挥最大的潜力。德国陷入一片混乱，一种新秩序似乎正在旧世界的废墟上崛起。"
 WORLD.40086.a: "祖国再得统一。"
 WORLD.40086.b: "怎么会这样？"
 WORLD.40086.c: "德国的铁腕统治已经被打破。"
 WORLD.40087.t: "[Get_newspaper_header]俄罗斯共和国在第二次西俄战争中取得胜利！"
 WORLD.40087.desc: "俄罗斯共和国已正式赢得了与大日耳曼国的战争，占领了德国的专员辖区领土。由起初来自小小科米共和国的民主党派领导，这个民主领导层成功捍卫了民主制度，首先克服了内部威胁，然后在通向统一整个俄罗斯的道路上击败了众多军阀。如今，随着西部土地的解放，整个共和国都沉浸在庆祝之中。\n\n政府宣布了向这些新领土扩展民主和提供紧急援助的计划。与此同时，这个旧世界出现了一个新的民主超级大国，其影响深远。亲民主抗议横扫欧洲，甚至蔓延到了德国的核心地带。自由之火的火光比以往任何时候都要明亮，旧世界似乎终于获得了自由。"
 WORLD.40087.a: "欧洲三十多年来第一次自由呼吸。"
 WORLD.40087.b: "民主派怎么打败我们的呢？"
 WORLD.40087.c: "东欧人民加入自由世界。"
 WORLD.40088.t: "[Get_newspaper_header]俄罗斯重建政府在第二次西俄战争中获胜！"
 WORLD.40088.desc: "俄罗斯重建政府正式赢得了对大日耳曼国的战争，并占领了前东部专员辖区的领土。由苏联官员之女兼表面上的民主人士斯韦特兰娜·斯大林娜领导的重建政府实际上是一个致力于根除所有“极端”意识形态的独裁政权。看起来，它的使命取得了成功，因为它在与地球上最极端意识形态之一的民族社会主义的核心展开的战争中获胜。\n\n正如其名，重建政府已宣布了在新领土上进行重建的计划，包括镇压政治对手和驱逐任何剩余的德国人口。东部领土的丧失对德国的经济、声誉和军事造成了巨大打击，德国人民将如何反应还有待观察。"
 WORLD.40088.a: "终于，纳粹极端分子被击退了。"
 WORLD.40088.b: "立马给我接最高统帅部的负责人！"
 WORLD.40088.c: "一个反极端主义超级大国……有趣。"
 WORLD.40089.t: "[Get_newspaper_header]民主重回东欧"
 WORLD.40089.desc: "随着《里加条约》的签署，德军正从波罗的海沿岸和乌克兰的田野上缓慢撤退回他们的祖国，战火在这片土地上渐渐平息。在他们的离去中，民主和自由的火炬在曾经的黑暗遮掩处闪耀。俄罗斯共和国诞生于冰冻的托木斯克，怀揣多元民主的梦想，宣布在已收复的领土上推行经济自由化计划，并实行民主改革。\n\n在日尔曼尼亚，军队反抗他们认为作为领导层软弱的统治。支持各种自由主义和社会主义事业的学生们发起了新一轮的抗议。全球观察家预测德国对欧洲的控制将迅速崩溃，团结协定的许多附属国内将爆发内乱。德国人民的未来究竟会怎样，还有待观察。"
 WORLD.40089.a: "这是我们的荣光，同志们！"
 WORLD.40089.b: "该死！"
 WORLD.40089.c: "俄罗斯民主？我们拭目以待……"
 WORLD.40090.t: "[Get_newspaper_header]俄罗斯联邦共和国胜利了！"
 WORLD.40090.desc: "在意料之外的情况下，由鲍里斯·叶利钦总统领导的俄罗斯联邦共和国在与大日耳曼国的战争中获得了胜利。在东欧各地进行了数月的残酷战斗后，俄罗斯军队终于击败了德国国防军。俄罗斯正在庆祝这一胜利，全国的城市都举行了庆祝游行和活动。在向俄罗斯人民发表的讲话中，叶利钦总统赞扬了为取得这一胜利作出贡献的俄罗斯士兵和平民的勇气和牺牲。\n\n世界其他国家对俄罗斯在艰苦战斗中取得的胜利表示祝贺。在德国，由于城市陷入混乱，团结协定正逐渐瓦解。眼下，俄罗斯可以为他们在一度是世界上最强大国家之一的德国身上取得的辉煌胜利而沾沾自喜。"
 WORLD.40090.a: "为了俄罗斯！为了自由！"
 WORLD.40090.b: "该死！"
 WORLD.40090.c: "俄罗斯巨熊回归。"
 WORLD.40091.t: "[Get_newspaper_header]俄罗斯在欧洲取胜"
 WORLD.40091.desc: "随着俄罗斯民族共和国正式宣布在解放其殖民地领土方面取得了胜利，不仅东欧，而且整个自由世界都爆发了近乎骚乱的庆祝活动尼古拉·佩特林总统赞扬了国家的成功，将其视为数十年反抗法西斯势力和暴政斗争的终结。\n\n一直以来不断支持共和国的战争的自由国家组织当局表示最诚挚的祝贺，并承诺提供强大的财政援助以重建解放后的欧洲。与此同时，德意志陷入了恐慌和动荡的漩涡，数百万德国国防军士兵试图返回德国，数不清的东方德国定居者也开始回国。自由之光再次照耀在旧世界之上，再也不会褪色。"
 WORLD.40091.a: "自由的火炬高高举起，无所畏惧。"
 WORLD.40091.b: "帝国倒下了。"
 WORLD.40091.c: "大远征成功！"
 WORLD.40091.d: "最后的曙光重新点燃。"
 WORLD.40092.t: "[Get_newspaper_header]欧亚国在第二次西俄战争中胜利！"
 WORLD.40092.desc: "欧亚国已正式在其对大日耳曼国的远征中取得胜利，将所谓的“大西洋主义者”从俄罗斯的腹地驱逐，并宣布莫斯科为欧亚国的新首都。\n\n欧亚国是一个极右翼国家，起源于科米共和国列夫·古米廖夫的“激进主义者”集团，他们相信俄罗斯居民在种族和政治上与古代亚洲民族紧密相连。古米廖夫利用分层等级制度将不同的欧亚民族统一为一个“超民族”。古米廖夫的胜利军队毫无停止前进之意，引起了国际社会乃至整个世界的极大关注。"
 WORLD.40092.a: "最大的幸福是粉碎你的敌人，让他们在你面前逃窜。"
 WORLD.40092.b: "只有俄罗斯人才能想出如此歪曲我们意识形态的东西！"
 WORLD.40092.c: "解放，还是新主人？"
 WORLD.40093.t: "[Get_newspaper_header]济科夫解放东欧！"
 WORLD.40093.desc: "随着凯旋的米列季·济科夫宣布德国投降，俄罗斯已经重新夺回了她的荣耀。在解放的土地上，俄罗斯国旗高高升起。济科夫已经承诺对新领土进行立即改革。地方代表将为整个俄罗斯带来民主，而秘密警察部队将通过在共产主义者和通敌者变成威胁之前扼杀他们来保护民主。\n\n外国观察员对此普遍持积极态度。广大美国民众也非常积极，甚至举行了自己的庆祝活动。与此同时，德国则充满了混乱，因为回国的士兵们要求得到答案：他们怎么会被一个所谓的劣势敌人打败。德国的地下已经燃起了火药桶，其后果如何，我们拭目以待。"
 WORLD.40093.a: "一九一八年的大仇得报！"
 WORLD.40093.b: "混乱笼罩着我们。"
 WORLD.40093.c: "铁幕被切成两半。"
 WORLD.40094.t: "[Get_newspaper_header]俄罗斯帝国获胜！"
 WORLD.40094.desc: "俄罗斯终于可以庆祝了，大日耳曼国在里加宣布俄罗斯帝国军队投降。经过几十年的屈辱和纷争，全俄沙皇弗拉基米尔三世宣布在德国威胁面前取得了胜利。随着酒吧里挤满了庆祝胜利的男男女女，沙皇已经宣布今天为一个全国性的节日。\n\n几十年来，德国人民不得不在民族社会主义的铁蹄下生活。现在，许多人认为这是他们反击的时机，社会主义者、民主人士等纷纷走上街头，抗议法西斯主义未能战胜俄罗斯的威胁。与此同时，美国和日本祝贺俄罗斯帝国政府击败了他们的宿敌，而世界其他国家则猜测欧洲接下来会发生什么。"
 WORLD.40094.a: "几十年的屈辱一扫而光！"
 WORLD.40094.b: "俄罗斯人从什么时候开始可以赢得战争的呢？"
 WORLD.40094.c: "俄罗斯雄鹰翱翔在云端。"
 WORLD.40095.t: "[Get_newspaper_header]一个新的帝国崛起"
 WORLD.40095.desc: "来自解放之城莫斯科的喜讯，沙皇米哈伊尔二世宣布在帝国复兴战争中取得胜利。白军的决心和经验对德国国防军来说已经难以承受，越来越多的东部领土被俄军的推进所夺走。俄国宣布了一个全国范围内的庆祝日，在三一广场举行了盛大的游行活动，最后沙皇在遭受重创的圣瓦西里大教堂前发表了讲话，以鼓舞新解放的人民。\n\n尽管有关德国官员拒绝就他们的失败发表评论，但有关德国境内不安情绪的报道越来越多。自由世界的国家，甚至一些共荣圈成员国，都向沙皇及其国家的伟大胜利表示祝贺。看来俄罗斯的君主制和罗曼诺夫王朝再度回归了。"
 WORLD.40095.a: "我希望我让他们感到骄傲。"
 WORLD.40095.b: "我们怎么能允许这样的事情发生！？"
 WORLD.40095.c: "从巨熊的灰烬中，双头鹰重新出现。"
 WORLD.40096.t: "[Get_newspaper_header]许珀耳玻瑞亚在第二次西俄战争中取胜！"
 WORLD.40096.desc: "当俄罗斯人最终在“许珀耳玻瑞亚”的旗帜下统一起来时，世界嘲笑了这个大多数观察人士认为是一个被孤立的国家。随着枪声在欧洲渐渐平息，维利米尔的军团如今在俄罗斯的原始土地上站立得意，他们陷入了惊讶的沉默中。面对比之前更大的威胁，他们在畏缩，无法言语。\n\n这个被称为“维利米尔”的人来自于雅利安兄弟会，在暗杀前任“元首”古特鲁姆·瓦格纳之后上台，承诺将“斯拉夫种族”团结在一个名为“许珀耳玻瑞亚”的神秘古代文明的旗帜下。怀着解放“雅利安”在中东古老故土的决心，世界无法预料维利米尔将在何处、如何发动下一次攻击。"
 WORLD.40096.a: "这是一场与佩伦相称的胜利。"
 WORLD.40096.b: "这将是德国的终结。"
 WORLD.40096.c: "将一个“优等种族”换成另一个。"
 WORLD.40097.t: "[Get_newspaper_header]罗斯王国解放东欧！"
 WORLD.40097.desc: "在德国人最终宣布投降后，罗斯王国开始庆祝其取得的胜利。尽管其不同寻常的起源，罗斯王国将苏联现代主义与沙皇时代的传统主义融合在一起的能力有助于创造出一个强大的国家，最终在军事和经济上击败了衰弱的大日耳曼国。\n\n许多被解放的东欧人民起初对由一个早已被遗忘的王国解放自己持怀疑态度，但他们的疑虑很快被留里克三世本人所消除，他宣布所有被解放的公民在罗斯王国平等，并保证广泛的社会福利和公民权利。已经有自由国家组织成员国称赞罗斯王国为“欧亚自由的堡垒”，几位代表已经发送了支持和祝贺的信函。欧洲人民的未来光明无限。"
 WORLD.40097.a: "留里克三世国王万岁！"
 WORLD.40097.b: "他的理想主义将导致他的垮台。"
 WORLD.40097.c: "东方的希望灯塔。"
 WORLD.40098.t: "[Get_newspaper_header]罗斯王国战胜德国！"
 WORLD.40098.desc: "在东欧的城镇和城市里，罗斯王国的士兵得意洋洋地行进，展示着他们战胜大日耳曼国的胜利。落败的帝国的旗帜已经被撕下，换上了罗格涅达女王的皇家纹章，她已开始巩固她在东欧的统治。在德国，随着士兵们回家，对他们政府未能妥善地支持这场战争感到愤怒，混乱笼罩着整个国家。\n\n随着王国的扩张，整合新获得的领土成为了一个负担。因此，罗格涅达女王下令让军队继续驻扎，并让“大流士”成员清剿任何对她统治的抵抗，无论是德国的狼人还是其他人。她的统治残酷，加上王国社会的阶层化，让许多分析师们想知道这些被解放的人民将如何对待他们所谓的解放者。"
 WORLD.40098.a: "罗格涅达女王万岁！"
 WORLD.40098.b: "毕竟没那么不同。"
 WORLD.40098.c: "钢铁王国统治欧洲。"
 WORLD.40099.t: "[Get_newspaper_header]白军获胜！"
 WORLD.40099.desc: "经过半个多世纪的屈辱，俄罗斯白军如今站稳脚跟，成为东欧地区无可争议的冠军。在里加条约签署后，数名白军将军合影留念，沙皇本人手持加框条约的画面被永久地定格下来。\n\n尽管大日耳曼国失败了，许多西方观察家开始质疑这个新俄罗斯帝国的政策。人们特别关注它与满洲和日本大东亚共荣圈的联系，因为这两个国家是最早向俄罗斯的胜利表示祝贺的国家。自由国家组织监察人员对俄罗斯帝国内存在的严重阶层分化可能导致东欧人民面临的可能压制发出了警告。尽管如此，这次胜利打击了纳粹对欧洲的影响力，法西斯主义的阴影从旧世界逐渐消退。"
 WORLD.40099.a: "光荣属于白军！"
 WORLD.40099.b: "我们的军事力量在我们需要的时候失败了。"
 WORLD.40099.c: "亡羊补牢，为时不晚。"
 WORLD.40100.t: "[Get_newspaper_header]谢尔盖·布尼亚琴科击败德国！"
 WORLD.40100.desc: "俄罗斯解放军的谢尔盖·布尼亚琴科向世界宣布，他已经得知德国投降的消息。在同一次演讲中，他宣布将对东部领土的叛徒进行一系列的审判，并驱逐占领领土内任何仍留在那里的东方德国人。\n\n国际观察员对这一胜利的反应褒贬不一。虽然大部分自由世界都对德国的失败表示欢迎，但许多人对俄罗斯解放军与法西斯主义的关系以及他们曾与德国人合作的历史表示担忧。在日耳曼尼亚，叛变的军队以及学生的不安引发了大规模混乱的抗议活动。 德国的困境还没有结束，它在欧洲大陆的统治地位正在进一步下滑。"
 WORLD.40100.a: "我们战胜了德国鼠辈！"
 WORLD.40100.b: "合作派打败了我们？"
 WORLD.40100.c: "至少比德国人好。"
 WORLD.40101.t: "[Get_newspaper_header]雇佣军取得胜利"
 WORLD.40101.desc: "俄罗斯合众国的雇佣兵领袖米切尔·韦贝尔三世宣布，他们在试图夺回二战期间失去的俄罗斯历史领土方面已经击败了德国人。随着团结协定部队被击退，东欧专员辖区的管理机构完全崩溃，美国俄罗斯取得了意想不到的胜利。德国政府对他们最近的失败保持沉默，可能正在竭力遏制内部混乱和崩溃。\n\n米切尔·韦贝尔三世宣布，所有被俄罗斯部队夺回的前俄罗斯领土将被重建并重新组织成更容易管理的领地。目前尚不清楚这样一个雇佣民主体制将如何形成，但无论如何，东欧大部分地区已经摆脱了纳粹统治的阴影。"
 WORLD.40101.a: "我们的工作才刚刚开始……"
 WORLD.40101.b: "日暮途穷……"
 WORLD.40101.c: "俄罗斯重返世界舞台。"
 WORLD.40102.t: "[Get_newspaper_header]马特科夫斯基凯旋"
 WORLD.40102.desc: "今天，俄罗斯国旗自豪地飘扬在西方，因为德国政府宣布向复兴中的俄罗斯国家投降。马特科夫斯基和俄罗斯法西斯党从未特别崇尚过德国，而这次鸣金收兵的胜利已经牢固地巩固了这一点。在取得胜利后，马特科夫斯基宣布对前领土的任何合作者实施严厉的惩罚。\n\n在德国，混乱已经爆发，叛乱的军队部队和受到自由主义和社会主义思想启发的学生们，已经让许多城市陷入了骚乱之中。自由国家组织在这次胜利上分裂为两派，一些人认为这是对民族社会主义的胜利，而另一些人则认为这个法西斯政府本身就构成了一种威胁。然而，对于普通俄罗斯人来说，他们的国家已经为七十年的屈辱复仇。"
 WORLD.40102.a: "俄罗斯，在劳动之下团结起来！"
 WORLD.40102.b: "我们的千年帝国呢？"
 WORLD.40102.c: "俄罗斯回来了。"
 WORLD.40103.t: "[Get_newspaper_header]徒弟杀师"
 WORLD.40103.desc: "在一个异常离奇的转折事件中，这无疑是历史上最具讽刺意味的壮举之一，一个法西斯国家取代了另一个法西斯国家。在过去的十年里，罗扎耶夫斯基政府成功统一了一个分裂的俄罗斯，将其转变为一个让非俄罗斯人和国际社会感到恐惧的国家。在这样的巩固过程中，俄罗斯迅速进行了再工业化，并建立了一个可怕的国家安全机构，对人类犯下了大规模的罪行。\n\n这一过程以他们的国家导师、德国人的正式投降为高潮，东部回到了俄罗斯的控制下。德国面对他们的失败陷入了混乱。世界恐惧地注视着旧世界被引入了更深的黑暗，自由之光或许永远被这片土地所唾弃。"
 WORLD.40103.a: "全世界都为我们的国家下跪。"
 WORLD.40103.b: "我们的下一代将教训斯拉夫人。"
 WORLD.40103.c: "新世界为旧世界哭泣。"
 WORLD.40104.t: "[Get_newspaper_header]俄罗斯民族苏维埃共和国赢得第二次西俄战争的胜利！"
 WORLD.40104.desc: "俄罗斯民族苏维埃共和国在与大日耳曼国的战争中取得了胜利，确立了秩序社会主义在俄罗斯的优越地位，粉碎了德国在欧洲的霸权。\n\n在以“新马克思”自居的伊万·谢罗夫的领导下，俄罗斯民族苏维埃共和国融合了奇特的俄罗斯和德国意识形态，宣扬极端的大俄罗斯族裔民族主义，以及国家指导下重视“工人的永恒斗争”而非迎合“世袭反动分子”的马克思主义经济体系。无论是左派还是法西斯主义者都对其表示反感，秩序社会主义的胜利或许将真正将谢罗夫的信条巩固作为社会主义理论的下一个阶段，尽管其中存在较为“反动”的倾向。"
 WORLD.40104.a: "谢罗夫不仅拯救了社会主义，而且拯救了整个俄罗斯。"
 WORLD.40104.b: "只有俄罗斯人才能想出如此歪曲我们意识形态的东西！"
 WORLD.40104.c: "深红的太阳照耀着欧洲。"
 WORLD.40105.t: "[Get_newspaper_header]奥克坦获胜！"
 WORLD.40105.desc: "今日，阴影笼罩着东欧，因为米哈伊尔·奥克坦向公众揭示了里加条约，德国东部的大片领土被移交给了奥克坦政权。征夜令、公开审判和公开处决已经在征服的土地上展开，奥克坦利用恐惧来控制东欧民众。\n\n奥克坦政权正在划分封地，其中许多封地被赋予了几乎完全的自治权，交给了一些盗贼般的人。强制劳动、过高的税率以及无情的企业对公民的近乎奴役政策，使许多人纳闷东欧在新政权下是否过得更好。尽管土地易主，东欧似乎仍未享有和平。"
 WORLD.40105.a: "庆祝的时刻到了！"
 WORLD.40105.b: "我们没有通过终极考验。"
 WORLD.40105.c: "欧洲仍然被奴役。"
 WORLD.40106.t: "[Get_newspaper_header]西部被征服"
 WORLD.40106.desc: "对许多人来说，罗斯雅利安国似乎根本无法作为一个国家运转，更不用说征服西方的德意志领土。现在世界完全难以置信，这两者竟然都发生了。由古特鲁姆·瓦格纳统治的国家宣布\"德国资本家\"已被废黜。他接着宣布将在征服的领土上进一步推动俄化努力。\n\n随着前俄罗斯领土的收复，德国定居者困惑不已。许多人留在他们的新祖国，而其他人则疯狂地返回他们的祖地。在德意志，只有沉寂和焦虑，人们对接下来会发生什么感到忧虑。自从战争结束后，就没有公开的报道。欧洲的自由在新的旧世界法西斯势力崛起的同时被扑灭。"
 WORLD.40106.a: "瓦格纳万岁！"
 WORLD.40106.b: "真是丢人现眼……"
 WORLD.40106.c: "德国陆军输给了这种人……？"
 WORLD.40106.d: "唯一失去的就是希望和梦想。"
 WORLD.40030.t:0 "[Get_newspaper_header][RUS.GetNameDefCap]入侵罗马尼亚！"
 WORLD.40030.desc:0 "东欧传来了令人震惊的消息：[ROM.GetNameDef]和[RUS.GetNameDef]之间已经爆发战争。在[RUS.GetNameDef]政府试图向罗马尼亚和平所要敖德萨和德涅斯特河沿岸未果后，[RUS.GetLeader]别无选择，只得动员[RUS.GetAdjective]军队，以解放这两个乌克兰人占多数的地区。\n\n不出意料，德意志国选择站在罗马尼亚一边，他们前不久才在迅速崛起的[RUS.GetAdjective]面前失去了对东方的控制。德国方面迅速谴责[RUS.GetAdjective]政府，声称[RUS.GetNameDef]是一个“应当立刻被阻止的战争贩子国家”。不管国际舆论如何反应，看样子曾经击败了德国国防军的[RUS.GetAdjective]军队正向布加勒斯特进发。"
 WORLD.40030.a:0 "上帝保佑罗马尼亚。"
 WORLD.40030.b:0 "前进，解放敖德萨！"
 WORLD.40030.c:0 "风暴将至，保持阵线！"
 WORLD.40031.t:0 "[Get_newspaper_header][RUS.GetNameDefCap]战胜了罗马尼亚"
 WORLD.40031.desc:0 "在[RUS.GetAdjective]和罗马尼亚军队之间发生了几次冲突之后，[RUS.GetNameDef]正如许多国际观察家所预期的那样取得了胜利，确保了德涅斯特河左岸和敖德萨的土地，同时对参与入侵苏联和解体苏联的罗马尼亚进行了报复。德国人迅速谴责[RUS.GetNameDef]，称该国是“一个不道德的国家，通过打击较小较弱的国家来滥用其权力”。然而，随着俄罗斯各地爆发庆祝活动，德国的抗议却被置若罔闻。在[RUS.capital.GetName]，[RUS.GetLeader]发表了激动人心的演讲，回应俄国战胜罗马尼亚。“[RUS.GetAdjective]人民再次对宿敌伸张正义，并将数百万乌克兰人从占领中解放出来！”"
 WORLD.40031.a:0 "[RUS.GetNameDefCap]再得大胜。"
 WORLD.40031.b:0 "正义得到了伸张。"
 WORLD.40031.c:0 "一个悲伤但不可避免的结果。"
 WORLD.40032.t:0 "[Get_newspaper_header][RUS.GetNameDefCap]占领罗马尼亚！"
 WORLD.40032.desc:0 "欧洲传来了令人震惊的消息，[RUS.GetNameDef]完全占领罗马尼亚。最初只是围绕敖德萨和德涅斯特这两个乌克兰人口稠密地区的冲突，随着[RUS.GetAdjective]军队继续推进而升级，最终占领布加勒斯特并建立了一个友好政府。\n\n许多国家（主要是德国）一直对罗马尼亚战争直言不讳，称[RUS.GetAdjective]国家是正在入侵无法自卫的小国，对欧洲稳定造成威胁。[RUS.GetNameDefCap]回复称，罗马尼亚政府让他们别无选择，只能占领该国，否则这个好战的国家将继续沿其边境存在。"
 WORLD.40032.a:0 "[RUS.GetAdjective]势力范围扩张"
 WORLD.40032.b:0 "他们让我们别无选择……"
 WORLD.40032.c:0 "真是悲剧。"
 WORLD.40033.t:0 "[Get_newspaper_header]俄罗斯共和国对团结协定宣战！"
 WORLD.40033.desc:0 "经过多年的压迫和绝望，在莫斯科开始传播希望的耳语之后，俄罗斯共和国正式开始解放东欧！\n\n安德烈·萨哈罗夫在托木斯克的家中发表了一场激情澎湃的演讲，成千上万的人群为之震撼。“通过释放个人的全部潜能，俄罗斯如凤凰涅槃般再次崛起！仅仅十年时间，我们将我们的祖国从一个分裂的边缘地区变成了全球科技最先进的国家！世界人民啊，见证进步的真正力量吧！”\n\n作为回应，德国国防军已经动员并迅速投入战斗，对抗科技上更为先进的的俄罗斯共和军。全世界都在关注着，好奇地目睹这个地球上最先进的军队与大日耳曼国的对决。"
 WORLD.40033.a:0 "俄罗斯民主的大考验"
 WORLD.40033.b:0 "循此苦旅，以达星辰"
 WORLD.40033.c:0 "放马过来吧，劣等人！"
 WORLD.40034.t:0 "[Get_newspaper_header]俄罗斯联邦崩溃"
 WORLD.40034.desc:0 "在第二次西俄战争中惨败后，俄罗斯终于尘埃落定。俄罗斯联邦曾经是俄罗斯人民希望的闪亮灯塔，但它现已正式瓦解，新政府不断地从俄罗斯祖国的残余势力中产生，全球数百万人惊恐地注视着俄罗斯再次陷入无政府状态。\n\n在此之前，俄罗斯联邦未能从德国手中夺回俄罗斯城市莫斯科，随后未经选举的亚历山大·波克雷什金暂停了民主制度，引发了内部骚乱，并很快达到了沸点。当统一俄罗斯的梦想随着已故的瓦西里·舒克申被埋葬时，数百万人在曾经是俄罗斯的这片废墟上哭泣，也许永远埋葬了。"
 WORLD.40034.a:0 "日暮途穷。"
 WORLD.40034.b:0 "注定失败的民族。"
 WORLD.40035.t:0 "[Get_newspaper_header]德涅斯特河沿岸问题达成妥协"
 WORLD.40035.desc:0 "俄罗斯和罗马尼亚政府就乌克兰对罗马尼亚的领土主张达成一致后，今天在莫斯科举行了谈判。在协议中，罗马尼亚人提出将外德涅斯特河沿岸地区移交给乌克兰国，并放弃对该地区的任何主权要求。\n\n[NOVGetOdessaStatusWorldEvent]"
 WORLD.40035.a:0 "[RUS.GetNameDefCap]再得大胜。"
 WORLD.40035.b:0 "正义得到了伸张。"
 WORLD.40036.t:0 "[Get_newspaper_header]俄罗斯联邦加入自由国家组织！"
 WORLD.40036.desc:0 "在莫斯科的一次新闻发布会上，俄罗斯总统瓦西里·舒克申宣布，经过谈判商讨，俄罗斯联邦终于可以开始正式加入自由国家组织的进程了！\n\n美国政府对这一进展作出了巨大的回应，声称他们很高兴让这个所谓的第四大国加入自由国家组织的行列。“俄罗斯总统和我最近成为了很好的朋友，他对确保其人民的自由和安全的渴望令人钦佩，我期待着与他一起前进。”总统[USA.GetLeader]对这一新进展作出了评论。\n\n当美国和俄罗斯的旗帜在莫斯科和华盛顿挥舞时，一些人担心这将导致紧张局势的加剧，因为现在有一个强大的美国盟友正站在团结协定和共荣圈的大门口。\n"
 WORLD.40036.a:0 "自由世界进一步壮大！"
 WORLD.40037.t:0 "[Get_newspaper_header]集体安全条约组织的诞生"
 WORLD.40037.desc:0 "最近，从苏联的废墟中崛起的俄罗斯联邦似乎打破了所有国际期望，成立了“集体安全条约组织”。该组织由俄罗斯联邦领导，旨在阻止团结协定和共荣圈对欧亚地区的任何入侵。\n\n舒克申总统在新西伯利亚宣布，俄罗斯联邦及其人民需要自行决定未来的命运。他说：“俄罗斯需要再次承担起责任。我们必须能够在必要时采取行动，并能够在不对外国承担义务的情况下保持中立。”\n\n团结协定和共荣圈并不接受另一个超级大国正式加入冷战这一事实，宣称俄罗斯最近的行动破坏了已经脆弱的全球平衡。\n"
 WORLD.40037.a:0 "新秩序崛起。"
 WORLD.40039.t:0 "[Get_newspaper_header]西北战争！"
 WORLD.40039.desc:0 "自20世纪40年代末以来，日本一直扼制着中国政府。虽然大陆在法律上由中华民国完全控制，但中国西部有一系列未被承认的军阀国家，一直保持着臭名昭著的事实上的独立。俄罗斯联邦承认以马家军为首的国民党残余势力为合法政府。\n\n此后，马家军对几个著名的军阀和西藏政府采取了军事行动。从日本到西藏的军事运输是通过空运进行的，其他军阀则拒绝了日本的支持。团结协定的反应是完全中立的。然而，OFN对发展一个与日本对立的政府表现出一定的兴趣。一个希望的灯塔会在中国崛起吗？"
 WORLD.40039.a:0 "西部觉醒。"
 WORLD.40040.t:0 "[Get_newspaper_header]大山战争"
 WORLD.40040.desc:0 "另一场酝酿已久的战争在高加索山区爆发了。土耳其和亚美尼亚人民之间长达几个世纪的冲突再次燃烧起来。\n\n这场战争是在俄罗斯联邦在第二次西俄战争中取得胜利后，最近夺取了高加索专员辖区之后进行的。许多国际观察家指责俄罗斯公开支持亚美尼亚叛乱分子而重新点燃冲突。\n\n随着士兵和游击队员在亚美尼亚的丘陵与山脉中发生战斗，这场冲突是会让世界见证一个自由民主的亚美尼亚的重生，还是见证亚美尼亚这个民族和概念的覆灭，都还是未知数。"
 WORLD.40040.a:0 "群山之中，战火再燃。"
 WORLD.40041.t:0 "[Get_newspaper_header]草原在燃烧！"
 WORLD.40041.desc:0 "在蒙古广袤的平原上，内战正在肆虐；蒙古人民在蒙古族民主人士那楚克·巴嘎班迪的领导下，将平原上的游牧民族和前人民阵线的残余分子召集到自由蒙古的旗帜下。\n\n日本帝国将这场起义斥为小规模的叛乱，称蒙疆有足够的军事实力对付叛乱者。然而，国际社会对蒙疆的实力持怀疑态度，他们注意到蒙古叛军在战场上使用了异常现代的军事装备。\n\n随着草原再次燃烧，一些人不禁要问，共荣圈是会继续主宰东亚，还是这场冲突会是导致日本帝国垮台的众多冲突中的第一场。"
 WORLD.40041.a:0 "解放还是压迫？"
 WORLD.40042.t:0 "[Get_newspaper_header][RUS.GetNameDefCap]对哈萨克斯坦宣战！"
 WORLD.40042.desc:0 "中亚的草原上，多年来许多人担心的事情成真了。俄罗斯的坦克和军队再次跨过哈萨克斯坦边境。\n\n随着俄罗斯统一，哈萨克斯坦是否能够继续保持独立的问题一直受到俄罗斯和哈萨克斯坦两国的激烈争议。最终，紧张局势导致俄罗斯发出了一份要求哈萨克斯坦军队全面解除武装的最后通牒。哈萨克斯坦人拒绝了这个要求，切断了与俄罗斯的所有联系，并调动军队到边境。\n\n尽管国际社会谴责这个最后通牒不过是俄罗斯持续侵略的一部分，但是没有什么能够阻止随后不久的宣战。哈萨克人将全力以赴抗击敌人，但俄罗斯的迅速征服几乎是板上钉钉的事。"
 WORLD.40042.a:0 "别说我们没警告过他们！"
 WORLD.40042.b:0 "俄罗斯雄鹰再次展开双翅。"
 WORLD.40043.t:0 "[Get_newspaper_header][KAZ.GetNameDefCap]加入[RUS.GetFactionName]！"
 WORLD.40043.desc:0 "在哈萨克斯坦首都进行了一轮紧张的谈判后，哈萨克斯坦现已正式宣布加入[RUS.GetFactionName]，重新确立了俄罗斯在中亚的影响力。\n\n世界各地许多人曾担心统一的俄罗斯将再次对哈萨克斯坦进行入侵，其唯一目的就是将这个草原国家重新纳入祖国版图，就像几百年来它一直受制于帝国沙皇或苏维埃主席那样。但是，随着巴巴罗萨行动以及俄罗斯与哈萨克斯坦陷入军阀混战，这种支配终于被打破，两国都遭受了巨大的损失。\n\n这种痛苦转化为了一种兄弟情谊。哈萨克斯坦和俄罗斯从无政府状态的战火中走出来，巩固了俄罗斯在中亚的影响力，同时赋予了哈萨克斯坦长期追求的独立。无论这种新的兄弟情谊将来会带来什么样的未来，现在清楚的是，哈萨克人的奴役循环已经被彻底打破。看来，在几个世纪的奴役和苦难之后，中亚人民终于可以再次呼吸了。"
 WORLD.40043.a:0 "我们站在这里，不是作为主人或仆人，而是作为兄弟。"
 WORLD.40043.b:0 "看起来时间会治愈一切。"
 WORLD.40044.t:0 "[Get_newspaper_header]克拉科夫起义！"
 WORLD.40044.desc:0 "在德国内战结束后，自由波兰的理想被认为已经彻底被摧毁，这个国家再次湮灭在纳粹德国的压迫下。然而，最近几周，在俄罗斯在第二次西俄战争中取得胜利以及随之而来的德国陷入混乱之后，曾经迷失的波兰民族已经慢慢苏醒过来。\n\n在克拉科夫市，支持独立的抗议活动演变为一场大规模的起义，并在卡罗尔·沃伊蒂瓦和重建的波兰家乡军的领导下，持续蔓延到整个波兰南部。德国政府迅速指责俄罗斯政府策划了最近的波兰起义，声称[RUS.GetName]是在利用德国的衰弱状态。不管这些说法是否属实，波兰人正在再次战斗，他们的目光聚焦在华沙城。"
 WORLD.40044.a:0 "德国每况愈下。"
 WORLD.40044.b:0 "该死的波兰人！"
 WORLD.40045.t:0 "[Get_newspaper_header]莫斯科的陷落"
 WORLD.40045.desc:0 "近几周以来，没有任何一个城市比臭名昭著的莫斯科更受关注。作为德国在东欧统治的中心，以及俄罗斯的前首都，莫斯科是俄罗斯军队西进的首要目标。而今天，一切都变了。\n\n俄罗斯军队首先开始攻打容纳着本土俄罗斯人口的东部贫民窟，然后逐家逐户地清理城市。当地的德国部队与少数合作者艰难地争先恐后地集结起来，试图在莫斯科河西岸建立防御阵地。一旦河西岸的防线被攻破，德军部队就会收到撤退的命令。\n\n战争的势头明显倒向了俄方，莫斯科已经落入俄罗斯之手。虽然德国人离战争的终结还有很长一段距离，但他们重新夺回莫斯科的能力微乎其微。这座城市的失陷成为了大日耳曼国以外的地方备受关注的事件，许多人认为莫斯科的解放标志着大日耳曼国的末日开始了。在德国势力范围内，审查员正在努力阻止有关这次重大失败的消息传播。然而，在德国的势力圈内，异议的声音迅速兴起，怀疑的情绪已经在德国民众中蔓延开来。与此形成鲜明对比的是，俄国前线后方一片欢腾，整个欧洲的解放团体都在加紧反抗德国的统治。"
 WORLD.40045.a:0 "莫斯科已在我们身后！（俄语）"
 WORLD.40045.b:0 "该死的混蛋！（德语）"
 WORLD.40045.c:0 "有意思。"
