 RUS_no_caucasus:0 "我们征服了高加索！"
 RUS_victory.1.t:0 "德国人让出莫斯科专员辖区"
 RUS_victory.1.desc:0 "随着[1442.GetName]和[217.GetName]重新回到俄国人手中，德国人再次向我国政府提出了和平建议。他们准备交出整个莫斯科地区，以换取[RUS.GetName]和[GER.GetName]之间的和平。我们政府内部再次出现分歧，但我们的大部分高层认为，我们可以继续向德国的中心地带大举进军，在人民大厅的废墟上举起祖国的旗帜。"
 RUS_victory.1.a:0 "别把德国人逼得太紧"
 RUS_victory.1.b:0 "向着日耳曼尼亚，前进！"
 RUS_victory.2.t:0 "德国人让出高加索地区"
 RUS_victory.2.desc:0 "当我们的士兵越来越深入德国的黑暗心脏时，日耳曼人再次与我们的政府接触，这次他们提供了他们珍贵的高加索专员辖区和港口城市罗斯托夫来换取和平。我们的政府已经表示支持这项提议，呼吁[RUS.GetLeader]接受与德国的和平，但我们参谋部的一些将军认为国仇未雪，建议我们继续前进，进军东方领和乌克兰。"
 RUS_victory.2.a:0 "凤凰涅槃，浴火重生！"
 RUS_victory.2.b:0 "把德国人赶回他们的边境。"
 RUS_victory.3.t:0 "德国人让出乌克兰专员辖区"
 RUS_victory.3.desc:0 "我们的士兵已接近内德国边境，德国政府第三次向我方政府提出要约，愿意在东部作出更多让步。除了之前提出的莫斯科和高加索地区外，他们还愿意放弃对乌克兰和克里米亚半岛的控制权。公众和我们政府高层中有很多人呼吁接受这个提议，认为已经有太多人丧生，流血事件不应再继续下去。然而，我们军队内部的许多人认为德国正处于彻底崩溃的边缘，这可能是我们重新夺回我们所有俄罗斯核心领土的最后机会。"
 RUS_victory.3.a:0 "十年屈辱，一雪前耻"
 RUS_victory.3.b:0 "整个西欧都将被解放！"
 RUS_victory.4.t:0 "德国人无条件投降"
 RUS_victory.4.desc:0 "随着西俄战争不可避免地结束，我们的宿敌德意志的一则通信抵达；大日耳曼国及其所有附属国已无条件投降给[RUS.GetName]的力量。有了这个机会，我们终于能够为巴巴罗萨行动和苏沃洛夫行动的失败报仇，并最终收回我们被非法吞并的所有领土。从里加到马加丹，从塞瓦斯托波尔到摩尔曼斯克，俄罗斯现在毫无疑问地自由而团结。拒绝这个提议必将引发不可避免的核战争，而且没有必要进一步侵入这个法西斯癌症的核心。这可能是我们最后的机会。"
 RUS_victory.4.a:0 "祖国将重返世界舞台。"
 RUS_victory.4.b:0 "没什么能阻止我们进军日耳曼尼亚！"
 RUS_victory.5.t:0 "德国人要求我们投降！"
 RUS_victory.5.desc:0 "当我们准备用我们的核武库来摧毁大日耳曼国的时候，各国大使已经找到我国政府，要求我们投降。德国人强调了在欧亚大陆使用核弹的破坏力，提出了他们认为的“轻松脱身”方案。他们要求吞并乌拉尔山脉以西的所有领土，并承认东欧将永远处于德国的统治之下。"
 RUS_victory.5.a:0 "我想这比世界末日要更好……"
 RUS_victory.6.t:0 "德国人同意了我们的要求"
 RUS_victory.6.desc:0 "我们收到了元首本人的答复，他已经接受了里加条约的所有条款。前线的所有敌对行动都将停止，德国和俄罗斯军队将从占领区撤出。终于，数百万俄罗斯人的牺牲将不再白费。"
 RUS_victory.6.a:0 "布哈林的错误已经被纠正了。"
