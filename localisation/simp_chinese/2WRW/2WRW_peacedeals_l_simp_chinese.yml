 RUS_totalvictory.1.t:0 "里加条约"
 RUS_totalvictory.1.desc:0 "德国外交部长进入了这座被当地拉脱维亚人称为“黑头屋”的庄园。他被元首派到这里来做一项不可能完成的工作，即为德国谈判一项“公平”的和平解决方案，一项他已经确信是不可能完成的方案。当那些看起来相当不友好的俄国士兵把他护送到一间书房时，他的脸上一直挂着鄙视的表情，脸上闪着汗水。在房间里耐心等待的不是别人，正是联邦最可怕的将军，亚历山大·诺维科夫本人。\n\n“你终于来了，德国佬。”陆军元帅咆哮着吐出最后一个字，他明亮的蓝眼睛像盯着匕首一样盯着外交部长，就像狼盯着猎物一样。\n\n”对不起，斯拉夫佬，”外交部长回答说，用他那颤抖的、令人发笑的、高亢的声音，拉出最后一个音节，试图在一米之外高高在上的、嬉皮笑脸的俄罗斯人面前宣示一种统治的光环。“我不喜欢在劣等人身上浪费我的时间。”\n\n“那就好！”将军笑着说，指了指房间中间的桌子上摆放的文件，它制作相当精良。“请您这个超人在投降条款上签字好吗？这场战争......对你方来说并不顺利，我想我们都同意是时候将我们祖国的合法领土归还给她了。反正你的部队也不可能和我们的部队相提并论。”诺维科夫嘲讽道，露出了相当灿烂的笑容。\n\n他拿起详述《里加条约》的文件，当他扫视这些条款时，他的手在颤抖，令他更担心的事情得到了证实。布劳希施塔特、保卢斯堡、基辅和里加。那些该死的野兽想把它全部夺回来。不能接受，他身体里的每一个细胞都在尖叫；他把笔放在纸上，签署了这个将永远削弱德国的条约。耻辱！太可恶了！这张纸几乎是在向德国的骄傲、向他们所代表的一切吐口水！\n\n然而，他没有其他选择。\n\n于是，这个时代的帷幕在俄罗斯受折磨的人们的欢呼声中落下。从摩尔曼斯克到奥莫隆河，从波罗的海到白令海峡，他们的祖国再次从废墟中走出来。无论她如何伤痕累累、遍体鳞伤，该条约都是向世界发出的一条明确信息："
 RUS_totalvictory.1.a:0 "俄罗斯回来了！"
