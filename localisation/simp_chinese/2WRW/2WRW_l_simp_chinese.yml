 USA_GAW_Operation_Monsoon_Rain: "§D季风行动§!"
 USA_GAW_Operation_Monsoon_Rain_desc: "德国人的工业几乎全部集中在几个关键城市地区。我们应当对这些地区进行持续轰炸，以此给对手的战备来上一记重拳。\n"
 USA_GAW_Operation_Angel: "§O天使行动§!"
 USA_GAW_Operation_Solar_Eclipse: "§G日蚀行动§!"
 USA_GAW_Operation_Solar_Eclipse_desc: "§F我们最好的战机已经夺取了制空权。在空军的掩护下，我们已确保部队不会被德国飞机袭扰。§!\n"
 USA_GAW_Operation_Jackrabbit: "§G野兔行动§!"
 USA_GAW_Operation_Jackrabbit_tt: "§F干燥又炎热的纳米比亚沙漠严重威胁了驻守的部队的安全，我们必须让他们适应当地的地理环境，才能在战场上抵抗西南非洲。§!\n"
 USA_GAW_Operation_Crackpot: "§Y疯人行动§!"
 USA_GAW_Operation_Crackpot_tt: "利伯维尔作为德属非洲重镇，正源源不断地为敌军输血。我们必须集中兵力拿下这座城市。一旦利伯维尔落入我手，我们就能重创中非专员辖区，从德国手中夺得至关重要的资源。\n"
 USA_GAW_Operation_Jungle_Garden: "§R花园行动§!"
 USA_GAW_Operation_Jungle_Garden_desc: "东非复杂的地形使得我们难以发动大规模攻势。幸运的是，我们有彩虹除草剂。这些药剂可以清除难以通过的林地，以方便我们的士兵们在东非进攻。\n"
 USA_GAW_Operation_Bronze_Lion: "§R铜狮行动§!"
 USA_GAW_Operation_Bronze_Lion_tt: "东非的丛林为德国士兵们构成了一座天然要塞。为打败敌军，我们必须教会小伙子们怎么在丛林里打仗。我军必须掌握在树林中灵活机动，对德军出其不意的打击的能力。\n"
 USA_GAW_Gun_purchases: "送出枪械"
 USA_GAW_Arty_Support_Purchases: "送出装备"
 USA_GAW_Intensify_Air_Support: "扩大空军支援"
 USA_GAW_Intensify_Air_Support_tt: "我们驻扎在南非的庞大机队应被利用起来，为陆军部队提供更强有力的空中支援行动。被凝固汽油弹洗过一遍澡的德国佬是没有机会向我们的小伙子们发动反击的。\n"
 USA_GAW_Helicopter_Gunships: "动用武装直升机"
 USA_GAW_Helicopter_Gunships_tt: "这场战争正迅速的向我们展示直升机这一利器在现代战争中的革命性作用。由于在前线直升机被广泛使用，我们不妨去修改现有制造工艺以便其携带重型武器，来为我军及盟友提供火力支援。\n"
