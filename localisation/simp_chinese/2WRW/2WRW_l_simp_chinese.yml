 SWRW_TNOLAR_GAW.1.t: "第255号决议"
 SWRW_TNOLAR_GAW.1.desc: "冬季的纽约天寒地冻，冷风呼啸着穿过高楼大厦，肮脏的积雪把街道染上一层白。然而OFN总部内的气氛却升温到了极点，宛如盛夏般炽热。明亮的灯光自房顶上投下，缓缓照亮了OFN代表团成员的面庞。每个人都忙着彼此交头接耳，于坐立难安中等待就第255号决议投票的那一刻。接着，[USA.GetLeader]总统出现了，所有人的目光一瞬间汇聚在他的身上。[USA.GetLeader]总统走到桌前就坐，整理了一下手中的稿件，在发表演讲前咽了下口水。\n\n“首先我想要指出，本次会议有助于团结我们的联盟，并表明自由国家组织仍未忘却对自由世界的承诺。”[USA.GetLeader]总统开口道：“我们乃是世界上仅存的数个自由国家，而我们在二战中的耻辱战败助长了那些妄想征服世界之势力的嚣张气焰。由此可见，捍卫自由实为全体成员的共同义务，而非美利坚一国之责任。”\n\n“我们切不可袖手旁观，任由中国惨遭日本人宰割，而必须时刻准备就绪，以面对日本的入侵。表决通过第255号决议，即意味着我们向过去数十年所追寻的自由立场更进一步。谢谢。”话音刚落，空气中的焦虑消散殆尽，在座的代表们互相交换了眼色，房间里随即爆发出雷鸣般的掌声。\n\n[USA.GetLeader]总统本人也深感如释重负。与会成员清一色地投了赞成票——就连巴西也不例外。情况简直完美：日本人不可能乖乖丢下武器撤军。讽刺漫画家赫布洛克和《华盛顿邮报》或《纽约时报》的那群混蛋一起联手也休想把它搅黄。只要自由世界能够屹立不倒，1975年必能安然渡过。\n\n俄罗斯代表在会场上做出了发言，支持了中国人民的正义斗争，并承诺将会给予中国强力支持，呼吁自由世界的国家们团结起来，为了中国人民的解放而战。演讲结束后，OFN总部内响起热烈的掌声，第255号决议正式通过。"
 SWRW_TNOLAR_GAW.1.a: "这就是新秩序的结束了吗？"
 SWRW_TNOLAR_GAW.2.t: "大东亚战争——自由世界的大胜！"
 SWRW_TNOLAR_GAW.2.desc: "事实已然明了：中国挣得了自由。自由国家组织和集体安全条约组织已经在对抗共荣圈的战争中大获全胜，它碾碎了日本试图再次将中国粉碎的企图。[USA.GetLeader]总统将在椭圆形办公室发表胜利演讲，而美国的小伙子们将“……以人类能做到的最快速度”回国。\n\n当第一批泛美航空的包机在东海岸着陆时，成千上万挥舞国旗，唱起国歌的人群就挤满了航站楼和停车场。摄影师刻录着一个个疲惫的士兵亲吻拥抱着妻儿的感人场面，它们会在报纸上辗转流传，永世长存。国防部长宣布了在华盛顿特区举行阅兵式的计划，以纪念那些“从野蛮和奴役中拯救大陆”的归国老兵。\n\n日本人在中国落败的背后，却是为了光明与民主的未来，所要进行的漫长而艰辛的重建。战争审判亟待举行，被捕日本宪兵、陆军和酿就无数死亡和破坏的昭和天皇的罪名悬而未决。新国家尚在筹备，中国人民要自决命运，美国的资金和技术要支持他们的重建。当然，还有数百万民众：前奴隶、残疾人士、孤儿和伤病者都不得不留在中国，等待照料。而我们那些经历过人类所不能想象血腥与恐惧的部队，也不得不如此。\n\n但那也是明天的事务了。而今天，我们要庆祝对共荣圈的大捷，庆祝我们英勇男女的归乡。\n\n另一边，在莫斯科，俄罗斯的人们正欢欣鼓舞。当远征的军队从西伯利亚归来时，迎接着他们的是鲜花与欢迎，全俄罗斯的媒体都争相报道着大东亚战争的胜利，[RUS.GetLeader]宣布了"远东国际审判法庭"的成立，旨在审判从第二次世界大战到大东亚战争这三十余年来犯下累累罪行的日本高官。\n\n而无论是美国人还是俄罗斯人，亦或是中国人，都对这场大胜感到欢欣鼓舞。因为随着大东亚战争的结束，'第二次世界大战'的遗产——横跨了三十余年的新秩序，在这一刻，彻底瓦解了。而随之而来的，是和平与发展的新时代。"
 SWRW_TNOLAR_GAW.2.a: "这就是新秩序的结束。"

