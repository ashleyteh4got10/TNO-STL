 ceswrw.1.t:0 "特奥多里希港的陷落"
 ceswrw.1.desc:0 "在一个壮观的转折事件中，有报道称[RUS.GetAdjective]军队已经巩固了对特奥多里希港的控制。最初包围这座城市后，[RUS.GetAdjective]军开始了一场残酷的围攻，期间[RUS.GetAdjective]军炮火轰击海军和运输港口以阻止运输船进入城市供应物资。当[RUS.GetAdjective]军最终攻占这座城市时，遭受重创的德国防御军几乎没有任何抵抗能力。据报道，城市中剩余的德国最高统帅部已经逃到水面之下，希望能够到达陆地上其他地方继续战斗。\n\n特奥多里希港是德国占领下克里米亚的明珠，它是黑海舰队行动的主要港口。这座城市还是半岛上德国人的最大聚集地，几乎整个城市都是德国移民和黑海舰队的军官。\n\n[RUS.GetAdjective]政府宣布将该城市更名为其原名塞瓦斯托波尔，并已开始在街头散发亲[RUS.GetAdjective]传单。\n\n所有德国人都被实施了严格的宵禁，[RUS.GetAdjective]武装部队俘获的所有奴隶都被释放。随着这座城市化为废墟，[RUS.GetAdjective]政府现在必须决定如何处理塞瓦斯托波尔和整个克里米亚半岛。\n\n随着斯拉夫人成为少数民族，将克里米亚重新融入新的[RUS.GetAdjective]将不会容易，这预计会是一个暴力的折磨过程。当地的德国人已经开始对[RUS.GetAdjective]占领者展开抵抗行动，摧毁了进入塞瓦斯托波尔和整个半岛所需的重要基础设施。德国最高统帅部宣布计划夺回这座城市，并将重新建立德国舰队在黑海的存在。\n\n然而，目前塞瓦斯托波尔掌握在[RUS.GetAdjective]手中。随之而来的是[RUSGetUniqueNamePlain]对黑海的绝对控制，德国海军已经完全撤退到波罗的海。专家们对这场战争的走向仍然不确定，但每个人都明白这对[RUSGetUniqueNamePlain]来说是一次伟大的胜利，对德国来说则是一次毁灭性的打击。"
 ceswrw.1.a:0 "黑海在召唤，而俄罗斯响应了它的召唤。"
 ceswrw.1.b:0 "我们要在第聂伯河挡住这些混蛋。"
 ceswrw.2.t:0 "里加陷落"
 ceswrw.2.desc:0 "经过数周穿过东方领的艰苦跋涉，俄罗斯军队终于夺取了东方专员辖区的港口城市里加。城市的防御受到了国防军残余部队的破坏，其中许多人选择逃到道加瓦河对岸，而不是面对涌来的俄罗斯士兵。相反，里加的防守主要由一支混杂的民兵部队和希特勒青年团完成。这支临时组建的民兵部队完全没有战斗力，俄罗斯军队报告称，其中超过九成的人已经被击毙或俘虏。\n\n在里加混乱的战斗中，拉脱维亚民族主义者和前乌波自由战士临时结盟，渗入城市，破坏了关键的供应区域，并最终暗杀了城市的国家专员。由于继任顺序不明确，里加最高统帅部陷入混乱，在数天的内斗后，饱受困扰的东方领纳粹党副秘书长代表这座城市向[RUS.GetAdjective]投降。\n\n里加的失陷对备受困扰的大日耳曼帝国来说是一个重大国家耻辱。各个团结协定国家和中立国家的公民被迫逃往波罗的海对岸的瑞典，引发了他们政府对战争行为的谴责。许多著名的纳粹党官员已被俄罗斯军队俘虏，现正被送往俄罗斯首都接受审判。\n\n里加曾是希特勒的帝国在波罗的海地区的中心。这座城市不仅是经济上的巨人，还是德国海军在波罗的海的重要补给中心。战争爆发前，大日耳曼国对该地区的控制已经岌岌可危，而失去如此关键的支撑点，纳粹分子将很难再长时间地将这片地区牢牢控制在手中。从极右翼民族主义者到兰德鲁特自由派再到共产主义者，已经有数十个组织敦促俄罗斯承认他们在东方专员辖区血腥残留残骸中的政府。德国在该地区的霸权已经彻底破碎。\n\n普鲁士之门，以及后面德国野兽狂热的心脏，现在已敞开在眼前。"
 ceswrw.2.a:0 "八百年的文化使者，在一天之内被打倒。"
 ceswrw.2.b:0 "快撤退到维斯瓦河，快！"
 ceswrw.3.t:0 "斯摩棱斯克陷落"
 ceswrw.3.desc:0 "尽管德国国防军竭尽全力，但斯摩棱斯克城已经沦陷于入侵的[RUS.GetAdjective]军队之手。经过几个星期的激烈战争，莫斯科战区变成了一片腐尸充斥的泥泞地带，前线最近才抵达斯摩棱斯克。臭名昭著的第51装甲军团与众多职业的、民兵的步兵部队一起保卫了这座城市。然而，对于纳粹分子来说，第51装甲军团发现自己无法在[RUS.GetAdjective]的地形上再现之前的成功，因为恶劣的降雨把战场变成了一片浓稠的、沥青般的泥潭。许多德国坦克陷入泥泞之中，无法机动或自卫。一系列的反坦克专家进行的闪电袭击——其中一些具有自杀性质——撕碎了脆弱的坦克编队，使[RUS.GetAdjective]军队摧毁了城市的防线。\n\n[RUS.GetAdjective]的胜利进一步加速了该城西部边界处一座集中营的解放。包括[RUS.GetAdjective]和波兰奴隶、犹太人、前佐林派游击队员，甚至几位冯·绍肯起义的高级成员在内的许多人已被解救出来，[RUS.GetAdjective]指挥官形容这些地方为“反人类级的邪恶”。集中营的照片已经在共荣圈以及自由国家组织中流传，两者都对德国的殖民政策表示严厉谴责。\n\n斯摩棱斯克的失陷至少敲响了莫斯科专员辖区的命运丧钟，甚至还可能波及更大范围的德国殖民地。随着这座城市的失去，德国已完全失去对通往莫斯科的西部进入口的控制。德国的战略已经失败，国防军现在几乎没有能力向东方投射力量。庞大的[RUS.GetAdjective]军队现已牢牢掌控[RUSGetUniqueNamePlain]领土。除非国防军成功迫使局势发生重大逆转，否则现在很可能战争将以莫斯科及周边地区回归[RUS.GetAdjective]政府而告终。\n\n由于莫斯科专员辖区东部边境现已被[RUSGetUniqueNamePlain]控制，进一步进攻东方领和乌克兰北部不仅是可行的，而且是可能的。也许，通过这一行动，战争已经离结束不远。"
 ceswrw.3.a:0 "祖国母亲将再次统一。"
 ceswrw.3.b:0 "一切结束之后，以他的无能为由，处决辖区国家专员！"
 ceswrw.4.t:0 "保卢斯堡陷落"
 ceswrw.4.desc:0 "在保卢斯堡市激烈的战斗之后，现已确认[RUS.GetAdjective]军队战胜了德国守军，将他们赶出了这座城市，在伏尔加城市的中心高举着祖国骄傲的旗帜。[RUS.GetAdjective]部队跨过广阔的伏尔加河后，迅速发起攻击，以压倒性优势冲入城市。与此同时，[RUS.GetAdjective]空军对城市展开轰炸，从空中向德军匆忙建造的防御工事倾泻着毁灭性的打击。在[RUS.GetAdjective]特种部队夺取市指挥中心之前，德国统帅部迅速逃离了这座城市，标志着[RUS.GetAdjective]的胜利。\n\n作为伏尔加河的中心地带，保卢斯堡市曾是一个工业中心，也是伏尔加地区的首府，是德国移民最早在西俄罗斯定居的主要城市之一。剩下的[RUS.GetAdjective]地标已经腐烂破损，成为苏联在伟大的卫国战争中失败的黑暗提醒。\n\n[RUS.GetAdjective]政府宣布了在该城市复兴[RUS.GetAdjective]身份的意图，将该城市更名为伏尔加格勒，并在整个城市传播亲[RUS.GetAdjective]宣传，重新确立俄语为官方语言。德国居民区正实行着严格的军事管制；有报道称，他们受到曾经受奴役的俄罗斯人的残酷对待和私刑。而当地的德国民兵组织在城市郊区形成，与不断推进的[RUS.GetAdjective]军队对抗，破坏关键基础设施和[RUS.GetAdjective]军装备。\n\n德国国防军宣布要夺回伏尔加德意志地区的中心地带，但目前这座城市牢牢掌握在[RUS.GetAdjective]手中，伏尔加河流域作为曾经分裂的地区现在完全被[RUSGetUniqueNamePlain]统治。专家们对战争的进程仍不确定，但他们都一致认为这是[RUSGetUniqueNamePlain]的伟大胜利，也是对德国的重创。"
 ceswrw.4.a:0 "那么，现在我们该怎么命名这座城市？"
 ceswrw.4.b:0 "我们得守住河对岸。"
 ceswrw.5.t:0 "基辅陷落"
 ceswrw.5.desc:0 "在被许多未来历史学家视为战争中倒数第二场关键战役的事件中，基辅已经沦陷，被俄罗斯军队所占领。在城市东部遭受多次失败后，城市本身由幸存的德军单位进行防御，但当地乌克兰抵抗力量却在每一个关键时刻都对其进行破坏，这些力量在最近俄罗斯在东部的胜利激励下变得更加强大。与莫斯科之战类似，德军试图控制基辅的右岸，保卫涅伊斯特河，阻止俄军渡河，但现在明显更强大的俄罗斯军队将其击退。当城市宣布解放后，城市的斯拉夫人口纷纷走出来热烈欢迎俄罗斯人。\n\n尽管人民对他们的德国统治者从东斯拉夫文明的古都驱逐出去感到欢欣鼓舞，乌克兰公众中已经开始提出有关乌克兰未来的问题。一些人呼吁完全独立，并与俄罗斯签订防御协定，极少数人呼吁完全融入俄罗斯，而在这两个极端之间还有许多其他声音，这些声音在乌克兰大部分地区解放后开始浮现。尽管如此，许多乌克兰团体已经同意在完全彻底击败德国威胁之前不进行任何特定道路的推动。\n\n在乌克兰以外，俄罗斯军队在争夺基辅的胜利被视为将德国人带到谈判桌上所需的最后致命一击之一。因此，许多学者和评论家已经将目光从“俄罗斯能否获胜？”转向了“俄罗斯统治将如何重塑欧洲？”这个问题。\n\n值得注意的例外是德国内部，德国政府仍然坚定地声称基辅的损失只是暂时的挫折。然而，即使在最坚定的政权支持者中，怀疑也已经完全蔓延，欧洲各国的政治人物正在计划离开德国。"
 ceswrw.5.a:0 "[RUSGetUniqueNameTitle]和乌克兰再次统一！"
 ceswrw.5.b:0 "我们得在波兰挡住他们。"
 ceswrw.6.t:0 "巴库陷落"
 ceswrw.6.desc:0 "巴库是德国的石油命脉之一，现在已经与它的霸主断绝了联系。随着[RUS.GetAdjective]夺回曾经属于他们的黑金，高加索山脉地区的激烈战斗仍在继续。这座港口城市使得一些德国军队可以划船前往一些其他较小的外围岛屿。\n\n随着高加索石油的损失，德国已经处于非常困难的境地，因为仅仅几年前他们已经被切断了罗马尼亚的石油供应。\n此外，通往中东的门户现在牢牢掌握在[RUS.GetAdjective]手中，这让许多人好奇伊朗何时会切断对德国的石油供应。随着德国经济前景的不确定，谁知道德国人民会做出何种反应呢？\n\n目前，我们只能确定三件事：德军的装甲部队已经停止前进，德国空军被迫停飞，德国海军停泊在港口。"
 ceswrw.6.a:0 "德国战争机器的齿轮渐渐停转下来..."
 ceswrw.6.b:0 "我们油库里的油还足够，对吧？"
 ceswrw.7.t:0 "圣彼得堡陷落"
 ceswrw.7.desc:0 "很久以前，经历了多年的围困,圣彼得堡这座城市陷入了德国人的手中。成千上万的斯拉夫人丧生于这场残酷的围困，他们曾经是这座城市的主要居民。城市被摧毁，为德国移民腾出了空间。如今，在[RUS.GetAdjective]入侵者的统治下，这座城市重新回到了[RUS.GetAdjective]的掌控之下。\n\n士兵们穿过贫民窟，这里是仅存的少数斯拉夫人的聚集地，来到了波罗的海边上的德国移民居住区。这座城市的失陷对德国在东部殖民地的稳定造成了沉重打击，而[RUS.GetAdjective]人并不打算仅止步于圣彼得堡。东方的德意志之鹰开始逐渐崩溃，[RUS.GetAdjective]人正在撕裂这个帝国。\n\n然而，[RUS.GetAdjective]对这座城市的控制存在一个问题，那就是由于二战期间的平民伤亡和纳粹的“生存空间”理论，大量的德国移民涌入城市，城市的德国化程度已经很高。如果不进行大规模的强制迁移——或者更糟糕地，进行彻底屠杀——这座城市就不可能再次成为斯拉夫人的聚居地：但这到底是不是人道的做法呢？这是一个只有[RUS.GetAdjective]解放者能够回答的问题。"
 ceswrw.7.a:0 "我们需要进行一些装修工作。"
 ceswrw.7.b:0 "立马组织反攻！"
 ceswrw.8.t:0 "第比利斯陷落"
 ceswrw.8.desc:0 "第比利斯，格鲁吉亚苏维埃社会主义共和国的前首都，已经沦陷于[RUS.GetAdjective]军队之手：在高加索战线上，这场相对较短的战斗可以说是一场战争消耗战，许多人预言这将成为第二次西俄罗斯战争中高加索战线的最后一场重大战役。\n\n许多高加索的游击队在那里迎接[RUS.GetAdjective]军队，希望能结束瓦尔德克和皮尔蒙特的约西亚斯统治时期造成的社会阶层分化。凭借游击队的规模和力量，[RUS.GetAdjective]军队似乎总是比国防军和殖民占领军领先两步。\n\n在城市中被包围之后，第22装甲师在殖民军团的支援下竭尽全力阻止[RUS.GetAdjective]的进攻，坚持了相当长的时间，同时把城市变成了一堆废墟。\n\n高加索人民暂时欢迎[RUS.GetAdjective]人，游击队已决定暂时放下武器，向为解放他们的家园摆脱纳粹压迫而牺牲的数千名[RUS.GetAdjective]人表示感激。独立呼声仍在继续，但目前，格鲁吉亚人民对能再次念出他们城市的名字感到满意。"
 ceswrw.8.a:0 "改写那个疯子留下的混乱，一步一个脚印地进行修复。"
 ceswrw.8.b:0 "在山区作战从未是我们的强项……"
 ceswrw.9.t:0 "阿尔汉格尔斯克陷落"
 ceswrw.9.desc:0 "令人震惊的消息从俄罗斯前线传来，作为德国海军和国防军联合行动的一部分，阿尔汉格尔斯克港口城市已被攻陷。最近重新激活的几个德国海军特遣营率领部队从海上发动进攻，渗透到城市的港口，破坏海军舰艇并占领关键防御区域。尽管遭受了沉重的伤亡，海军陆战队在不到四个小时的残酷战斗中完成了他们的目标。然后，国防军开始从西部方向对城市和俄罗斯军事阵地进行炮击，试图迫使顿河的渡河。经过将近三天的炮火轰击，国防军部署了大量EFA两栖桥梁，使得几个装备较轻的步兵营能够渡过顿河并进入城市。俄罗斯军队最终无法抵抗，经过几天的残酷肉搏战后，城市投降了。\n\n阿尔汉格尔斯克的被攻陷对俄罗斯的战争努力来说是一个重大打击。虽然不再是已废弃的西俄罗斯革命阵线的政治首都，阿尔汉格尔斯克作为西部俄罗斯仅存的几个重要港口之一，在战略和经济上仍然非常重要。没有城市的控制，俄罗斯的小型海军将很难继续在白海中挑战德国海军。俄罗斯领土上的配给现在可能会更加严厉，因为以往从OFN或共荣圈进口的重要消费品现在必须通过远东的马加丹港陆路运输。虽然战争还远未结束，但阿尔汉格尔斯克的失陷已经明显改变了战争的势头，使得民族社会主义力量变得强大。乌拉尔山脉的重要地位以及俄罗斯核心领土的残余现在面临着国防军的可能进攻。除非有重大而及时的逆转，历史很可能会将这场战斗视为独立和主权俄罗斯的终结。"
 ceswrw.9.a:0 "总领天使弥哈伊尔，保护战斗中的我们。"
 ceswrw.9.b:0 "似曾相识……"
 ceswrw.10.t:0 "瑟克特夫卡尔陷落"
 ceswrw.10.desc:0 "尽管面临着势不可挡的压力，来自俄罗斯前线的报道证实，德军已经占领了瑟克特夫卡尔城。曾经由于拥有大量化学武器而被认为是攻不破的中心，前科米阿萨尔的主要防御措施在一次意外的空袭中坍塌，导致瑟克特夫卡尔兵工厂的入口被破坏。不到几小时后，德国国防军开始对该城市发动攻击，迫使俄罗斯人只能依靠常规武器来自卫。在德军能够突破该市边界之前，许多与前科米苏维埃社会主义共和国各方有关的犯罪团伙和临时武装组织联合起来保卫自己的城市。欧亚主义者、远视主义派、主权民主派，甚至谢尔盖·塔博里茨基的帝俄复兴协会幸存者齐心协力，抵抗即将到来的纳粹军队。尽管他们英勇战斗，但他们的努力还是不够。在科米共和国国家博物馆的最后顽强抵抗之后，该市俄罗斯武装部队的残余被击溃。\n\n俄罗斯政府声称，德国国防军对瑟克特夫卡尔的平民人口进行了广泛的报复性暴力行动。许多幸存者报告称，民兵和军队成员的家属被杀害，财产被摧毁，发生性侵犯，并且德军佔用房屋。空中照片证实，该市近40%的地区已经被夷为平地。据称，科米族少数民族也成为袭击目标，一些报道暗示他们被驱逐到东欧的未知命运。德国外交部拒绝回应这些指控。\n\n国际观察家们对俄罗斯政府能否有效抵抗大日耳曼国的时间表示怀疑。瑟克特夫卡尔城位于俄罗斯西部领土深处。至少，通往乌赫塔的南方通道和乌拉尔地区的安全受到了严重威胁。最糟糕的情况是，关键供应中心的损失将导致西俄罗斯全面被征服。军事专家们认为，军事专家不认为俄罗斯军队在此时能够有效地反击德国的进攻。现在德国的胜利已经可以确定，唯一的问题是他们能够夺取多少土地。"
 ceswrw.10.a:0 "我们所有人的归属之地，如今成为我们无人居住的家园……"
 ceswrw.10.b:0 "一群不相干的傻瓜联盟对抗军队毫无胜算。"
 ceswrw.11.t:0 "阿斯特拉罕陷落"
 ceswrw.11.desc:0 "这是在战争中取得的首次重大胜利之一，俄罗斯军队解放了名为阿斯特拉罕的城市。这座城市位于现在布满俄罗斯军队的边境附近，而且作为伏尔加河口的城市，它成为进入德国占领的高加索地区的重要发起点。\n\n如果俄罗斯军队能够保持势头，这可能意味着将德国人隔离在迄今为止使帝国得以苟延残喘的有限燃料之外，将大日耳曼国推向灭亡的漩涡。只有时间能告诉我们，这对帝国是一个小小的挫折，还是标志着这个几十年来统治欧洲的帝国的终结的开始。\n\n至于这座城市本身，当地居民对俄罗斯军队的到来表示了庆祝。这座城市的长者们讲述着德国人最初到来时他们所失去的东西；城市的被压迫人民，从奴隶到小佛教徒，与他们视为解放者的人们交换着感激之情；而这座城市的年轻人则开始试图加入俄罗斯军队，企图从德国人的掌控中解放出欧洲的其他地区。\n\n对于世界其他地方来说，这一消息为正在东欧全面展开的局势带来了强烈的现实感。战争回来了，接下来的几个月将决定亿万人的历史走向。"
 ceswrw.11.a:0 "开始了，不是吗？"
 ceswrw.11.b:0 "真是一群混蛋。计划进行反攻。"
 ceswrw.12.t:0 "格罗兹尼陷落"
 ceswrw.12.desc:0 "随着战争在东欧蔓延，[RUS.GetAdjective]军队今天夺取了格罗兹尼市。面对[RUS.GetAdjective]的猛烈进攻，许多当地的德国部队已经开始撤离。不过，尽管没有发生战斗，但仍有相当一部分当地人对这支被视为另一支军队的军队反应不一。\n\n与许多其他从德国解放出来的城市不同，格罗兹尼内部的情况远非欢欣鼓舞：尽管对于现在踏上他们的街头的[RUS.GetAdjective]军队并不完全敌对，许多人还记得以往[RUS.GetAdjective]的占领并不和平。尽管[RUS.GetAdjective]已经夺取了这座城市，但要使该市与中央政府保持一致，还需要付出更多努力。尽管如此，这座城市的解放对于战争的剩下部分具有重大影响。\n\n随着这座城市再次被[RUS.GetAdjective]统治，高加索地区大门现在完全敞开，在石油危机中使大日耳曼国保持活力的关键纽带很可能会在接下来的几天被切断。[RUSGetUniqueNamePlain]又取得了一次胜利，而德国则可能失去石油领域，德国的胜利前景变得黯淡，而[RUSGetUniqueNamePlain]的前景变得更加光明。"
 ceswrw.12.a:0 "“妹妹，别告诉妈妈我在车臣。”"
 ceswrw.12.b:0 "车臣人将为他们的背叛付出代价。"
 ceswrw.13.t:0 "维亚特卡陷落"
 ceswrw.13.desc:0 "不管是维亚特卡还是李可夫，这座城市已经沦陷了。在沙皇统治下建立的伏特加酒厂已经关闭，德国国防军穿行于城市，大多数人不禁要问——我们为什么不能阻止这一切？\n\n维亚特卡河已经被污染，德军将俄罗斯士兵的尸体投入水中以毒害它，这场围城战斗激烈而血腥。最终，大规模的坦克行动和炮击迫使城市的防御者撤退。\n\n与许多其他城市不同，维亚特卡没有形成大规模的游击队战线。最接近解放运动的事物是一群红白军官，他们合作破坏德军的补给线；然而，预计这种情况会很快消失。随着德军向东行进，我们重夺统一辉煌的希望越来越渺茫。"
 ceswrw.13.a:0 "维亚特卡的珍珠，失去了光泽。"
 ceswrw.13.b:0 "熟悉的景象"
 ceswrw.14.t:0 "鄂木斯克的湮灭"
 ceswrw.14.desc:0 "西伯利亚最后一座重要城市已经沦陷于德军之手。随着俄罗斯军队的严重混乱，近日来，德国国防军以最少的流血夺取了许多村庄和城镇。这位急切的德军指挥官似乎期望在鄂木斯克也能取得同样的结果。然而，黑色联盟的“九头蛇计划”中的不受控制的分子们在德米特里·亚佐夫的命令之下提前重新激活。这些装备精良、纪律严明的单位奋起保卫了西伯利亚最后一片俄罗斯主权的堡垒。当德国国防军最终进入这座城市时，他们被一群被强迫自杀的平民炸弹袭击者所迎接。试图穿越众多路障的装甲车队被简易爆炸装置摧毁，而步兵甚至包括医疗队也受到恶毒而持续的狙击火力的袭击。经过一周的骚扰和高伤亡，德国国防军在鄂木斯克的师长被俄罗斯军队俘获并钉在十字架上示众。\n\n在这次羞辱之后，德国高级指挥部授权使用低级核武器将整个城市摧毁。所有德军部队在八小时内从鄂木斯克的外围撤离，因为他们没有进入城市的郊区。第5夜间战斗机联队于01:34占领了这座城市，并从31,000英尺的高度投下了代号为“纳格尔法尔”的核弹。该炸弹距离鲍里斯·斯特克利亚将军的临时指挥部仅有960英尺的距离，同时摧毁了防守的黑色联盟和爆炸半径两英里内的所有建筑和文明。由爆炸产生的火灾又摧毁了该市百分之七十的区域。\n\n尽管在袭击之前，日本和美国政府都被告知了即将发生的核攻击，但报道称，日美两国的核力量被激活以应对德国的首次打击发射。许多人将这次核升级描述为“不必要的”，除了最忠诚的纳粹分子，其他人都对接下来会发生什么感到恐惧。"
 ceswrw.14.a:0 "他们的勇敢、苦难和对职责的忠诚并不足够。"
 ceswrw.14.b:0 "这回给这帮顽固的混蛋一个教训。"
 ceswrw.15.t:0 "秋明陷落"
 ceswrw.15.desc:0 "来自前线的匆忙消息确认，涌向前线的国防军已经夺取了秋明。德军指挥官们惊讶地发现，该城市的行政和工业中心在近15年前拉扎尔·卡冈诺维奇的命令下几乎完全搬迁到地下，因此消除了德军一直依赖的空袭战术的可能性。前人民共和国的一些力量已经将城市的地下通道和洞穴变成了死亡陷阱。关键通道的淹没、伏击，甚至是用铁钉填满的原始诱杀装置导致进攻德军遭受了可怕的伤亡。低优先级的步兵继续试图在秋明获得胜利，而装甲部队和老兵师继续向俄罗斯深处推进。几个星期后，德军指挥官批准使用从斯科特夫卡捕获的毒气清除该城市，杀死了防守者和剩余的大部分平民。\n\n秋明战役对于大日耳曼国来说，最多只能算是一次惨胜。如此大量的人员损失无疑打击了总参谋部的威望。秋明的大部分工业在城市保卫战中被斯大林主义游击队摧毁，阻止了庞大的铁工厂和众多坦克工厂落入民族社会主义者手中。然而，德国宣传仍将这场战斗描述为“雅利安智慧战胜斯拉夫人的明确胜利”。据报道，指挥该战斗的将军已被提名为铁十字勋章的获得者，与此同时，数百名新兵的尸体被送往日耳曼尼亚。\n\n尽管俄罗斯人英勇地保卫了他们的城市，但这种努力不太可能产生影响。战争的最终结果已经没有多少疑问。德军已经深入西伯利亚，失去了乌拉尔山脉的天然防线，他们可以从这个曾经自豪的国家的饥饿尸体中夺取任何财富和资源。"
 ceswrw.15.a:0 "铁之大地，溶化成渣。"
 ceswrw.15.b:0 "祖国的又一次胜利。"
 ceswrw.16.t:0 "新西伯利亚陷落"
 ceswrw.16.desc:0 "遥远的白令海峡对岸，安克雷奇市外的一个小镇，一个年轻女子正在玩弄收音机时突然截获了一个信号。新西伯利亚已经沦陷，一切都完了。\n\n[RUSGetUniqueNamePlain]最后的主要工业中心地面上只有一些临时民兵在防守。他们并没有，事实上也无法真正保卫这座庞大的大都市。然而新西伯利亚的子弟们没有辜负她。联邦空军的残余部队被困在新西伯利亚东部，并在最后的燃料中进行了一系列大胆的袭击，针对入侵的德国国防军。由于德军过度伸张，急于在空军支援之前取得胜利，德军的伤亡在德军的军列中是巨大的。然而，一旦剩余的喷气燃料耗尽，新西伯利亚及其人民无法被拯救。血腥的德军入侵部队如同豺狼一般进入这座城市，屠杀了数千人，使更多人受伤。这一事件以焚烧亚历山大·涅夫斯基大教堂和公开处决市长的方式达到了顶点。\n\n通过这种野蛮行为，俄罗斯自由世界最大的人口中心沦为德国的统治下。中西伯利亚失去了。除了自然法则外，俄罗斯没有政府存在。国际专家预计将出现血腥的饥荒。所有农民都已经死亡和腐烂，或者逃离了他们的农舍。如今很少有人记得那些希望的日子，当时[RUSGetUniqueNamePlain]似乎能够纠正二战的错误。一切发生得多么迅速！\n\n第二次西俄战争将被载入史册，成为一个结束文明的灾难。德国将统治东方，其恶臭的阴影将像肿瘤一样蔓延到整个世界。然而，在这场悲剧中隐藏着一个更加黑暗和更加痛苦的真相。当[RUSGetUniqueNamePlain]最后的自由人在自己的家中被枪杀，他们的孩子被屠杀或饿死时，自由世界背弃了他们。美国人、澳大利亚人、加拿大人，他们思考着自己的家园、家人和国家。只有一位年轻的阿拉斯加女孩敢于将目光投向东方垂死的文明。"
 ceswrw.16.a:0 "我们的责任是见证生者和死者。"
 ceswrw.16.b:0 "他们为何不投降？"
 ceswrw.17.t:0 "车里雅宾斯克陷落"
 ceswrw.17.desc:0 "德国外交部今天自豪地宣布车里雅宾斯克市已经落入德军手中。虽然车里雅宾斯克以其科研设施而闻名，但该市也是众多高产坦克制造设施的所在地，因此成为德国入侵的首要目标。在俄罗斯战线崩溃之后，一支由前内务人民委员部人员组成的旅团掌控了该市，并开始组织居民组成民兵和家庭防卫团。这些经历了马格尼托哥尔斯克政权统治的幸存者，在战争时代和数十年的磨砺中变得坚韧，人们预计他们会与被派来占领车里雅宾斯克的德军士兵展开激烈战斗。然而，内务人民委员部的人员似乎预计会有更多时间来准备城市的防御，他们在53装甲军团午夜突袭时措手不及。在几乎没有时间组织民兵的情况下，德军成功推进到车里雅宾斯克的中心，并征服了该市的大部分人口，随后屠杀了内务人民委员部人员及其支持者。\n\n国际观察员报道了南乌拉尔大学和车里雅宾斯克州立大学的完全摧毁。更糟糕的是，一些人声称政治犯和嫌疑犯曾被关押在南乌拉尔大学建筑物中，然后被活活烧死在他们的书香监狱中。数十年的俄罗斯科学进步已被摧毁。那些可能引领技术复兴的工具和思想现在已经粉碎，被第三帝国那黑色的军靴所踩踏。没有了他们最伟大思想的劳动，一个民族将来能有何未来呢？\n\n车里雅宾斯克的失陷对俄罗斯军队来说是一个战略灾难。如果一个自由的俄罗斯要在战争结束后继续存在，就必须立即扭转法西斯势力在西伯利亚西部的渗透。如果不能将阵地推到乌拉尔山脉甚至更远，一个统一的俄罗斯可能再次从世界记忆中消逝。"
 ceswrw.17.a:0 "当我回来时，所有的生命都已经离开，而我却无法参与其中。"
 ceswrw.17.b:0 "以创纪录的速度安全地穿越乌拉尔山脉。"
 ceswrw.18.t:0 "托木斯克陷落"
 ceswrw.18.desc:0 "在报纸的第八页上，绕过讣告和止痛药的广告，一篇简短的报道描述了托木斯克被德国国防军占领的情况。由于俄罗斯军队在战场上覆灭，游击队和民兵力量被报复心切的德军歼灭，中西伯利亚的雅典成了无助的孤城。该城的占领并非军事行动，而是一次野蛮而毫无意义的洗劫，更像是蒙古入侵花剌子模的行为，而非现代战争的任何行动。随着德国国防军进入城市，无数艺术和科学的奇迹被掠夺的德军步兵夺走，许多作品是在枪口下从主人手中撕夺而来。托木斯克历史博物馆、考古学和民族学博物馆以及托木斯克国立大学已化为灰烬。该城的知识精英被大规模捕捉并关押。据报道，少数物理学家和化学家据称已被帝国的武器发展部门聘用，而绝大多数俄罗斯人则因传播“堕落的、反亚利安理念”而被判苦役。\n\n随着中西伯利亚沦陷于德军，一场全球性的难民危机正在酝酿。数十万俄罗斯平民抛弃家园和财产，逃离战争。有关德军暴行的报道只加速了大规模撤退。数千名准备不足的旅行者在蒙古的戈壁沙漠中丧生，希望能到达相对安全的中国。更多人在试图穿越惊涛骇浪的太平洋时溺亡。这些可怕旅程的幸存者试图在加拿大、美国、澳大利亚，甚至饱经战火的菲律宾建立新家园。这些国家的政府尚未对这一危机做出任何明确的回应。\n\n对于俄罗斯人民来说，第二次西俄罗斯战争已经结束。受创的哨兵、古老的游击队和年轻的理想主义者已经没有任何希望。第三帝国将从汉诺威延伸至堪察加半岛，而全世界只能恐惧地目睹一个团结协定胜利在冷战中日益确凿。"
 ceswrw.18.a:0 "三十僭主再次蜂拥而至雅典城。"
 ceswrw.18.b:0 "烧毁这个犹太科学机构。"
 ceswrw.19.t:0 "喀山陷落"
 ceswrw.19.desc:0 "拦截到的前线无线电消息确认喀山城已经沦陷给予德军。虽然鞑靼斯坦共和国在近15年前就被[RUS.GetAdjective]军队征服，但鞑靼人从未忘记或宽恕他们被剥夺的独立。一个秘密行动计划被制定，旨在确保新的鞑靼斯坦共和国的主权。当国防军接近这座城市时，鞑靼的应征兵和军官们纷纷弃守岗位。成千上万名擅离职守的士兵融入人群，躲藏在贫民窟中，并从喀山逃离，使得城市几乎失去了防御。[RUS.GetAdjective]指挥官认识到即将到来的德国舰队在数量和战术上的优势，下令全面撤退，只在撤离补给和几名高级政府官员时停留。几天后，国防军抵达了自由喀山市的边境。鞑靼的高级官员与德军指挥官会晤，提供补给、自由通行和军事合作，以换取德国对西俄罗斯鞑靼国的承认。\n\n这种种族灭绝的反亚洲民族社会主义者与坚定的鞑靼民族主义者之间的合作计划无疑引起了争议。以伊布拉欣·明兹耶夫为首的一派鞑靼社会主义者和自由主义者积极谴责这一行动，甚至有些人将鞋子和卫生纸扔向新政府的代表。许多人认为这一行动玷污了阿卜杜拉·阿里斯的遗产；还有一些人简单地意识到德国并非两害相权。自由市宣布后，喀山的街头暴力和政治犯罪变得更加常见。和平的父母和恋人们恐惧地等待着[RUS.GetAdjective]的反击。或者鞑靼将会流淌鞑靼人的鲜血？\n\n虽然鞑靼斯坦共和国的局势尚未确定，但这一大规模行动的结果是明确的。喀山的失陷威胁到东部的萨马拉工业区、巴什科尔托斯坦，以及南部的新波兰。如果德国国防军进一步渗透到西[RUSGetUniqueNamePlain]地区，战争的势头将毫无疑问地转向大日耳曼国。"
 ceswrw.19.a:0 "我们会为了鞑靼语言而毫不犹豫地付出一切。"
 ceswrw.19.b:0 "这些[RUS.GetAdjective]狗现在正在互相争斗。"
 ceswrw.20.t:0 "斯维尔德洛夫斯克陷落"
 ceswrw.20.desc:0 "尽管遭到市民的坚决抵抗，德国国防军今天宣布，斯维尔德洛夫斯克市已经沦陷于德国武装力量。斯维尔德洛夫斯克，又称叶卡捷琳堡，作为俄罗斯的第三首都，有数百万人口。它是一个重要的供应枢纽，也是这一广阔地区的行政和文化中心。随着德军迫使俄罗斯武装力量撤离乌拉尔地区的阵地，由列夫·尼古拉耶维奇·克拉斯诺佩夫采夫领导的仓促武装民兵夺取了这座城市，并宣布成立西伯利亚人民联盟，一个重组的、反修正主义的列宁主义政府，声称对整个地区拥有权威。撤退中的俄罗斯军队与克拉斯诺佩夫采夫的部队展开激战，在德军到达门口之前，他们已经重新镇压了该市近三分之二的地区。由于斯维尔德洛夫斯克在忠诚军队和克拉斯诺佩夫采夫的叛军之间分裂，双方都无法有效地抵抗德国国防军。经过几个星期的逐户激战，德军指挥官在中央军区司令部的台阶上宣布了对抗击者的胜利。\n\n然而，斯维尔德洛夫斯克的人民为这次德军的胜利付出了沉重的代价。据报道，圣三一大教堂遭到误入的炮火摧毁，乌拉尔科学院的总统楼也毫不幸免。至少有二十人在那栋楼的纵火案中丧生。由于斯维尔德洛夫斯克的占领造成的平民和军事伤亡尚未统计，但预计将达到数万人。\n\n斯维尔德洛夫斯克的沦陷表明西伯利亚的沦陷已是指日可待，甚至可能已经完成。纳粹力量如今不仅威胁着南方的工业和技术中心，还危及哈萨克斯坦的平原以及中西伯利亚地区仅存的俄罗斯政府。对西伯利亚人民来说，俄罗斯莫斯科的梦想似乎已经渐渐变成了一场噩梦。"
 ceswrw.20.a:0 "伟大的皇后城再次沦为奴隶。"
 ceswrw.20.b:0 "他们很快就会放弃的。"
 ceswrw.21.t:0 "沃尔库塔陷落"
 ceswrw.21.desc:0 "一则新闻消息来自俄罗斯前线。臭名昭著的沃尔库特拉格，数千人的坟墓，无辜者的监狱，已在德国国防军缓慢推进的北乌拉尔行动中被占领。当乌拉尔地区的温度降至令人难以置信的零下40度时，德国的坦克、汽车和飞机都无法使用。发动机拒绝启动。被冻结在原地的车轮拒绝转动。德国步兵装备着滑雪板和登山装备，从前线徒步前往沃库塔的阴森要塞，进一步推进进入俄罗斯境内。随着前方侦察兵报告德军的接近，这个消息泄露给了囚犯群体。这些俄罗斯国家的敌人几乎全部发动了骚乱，击退了他们的卫兵，并夺取了武器，然后占领了古拉格并向德国士兵打开了大门。战斗的幸存者已被纳入莫斯科殖民卫队，并承诺在第二次西俄罗斯战争结束后可以在该地区安家落户。\n\n对于德国来说，占领沃库特拉格是一次重大的宣传胜利。友好的记者们受邀审查拍摄的设施照片，还有几名不适合前线服役的囚犯被送到英国和西班牙进行快速媒体巡回。至少在一段时间内，国际和公众的同情似乎已经坚定地倾向于德国。\n\n德国军队突然进入西伯利亚是俄罗斯战略失败的又一个迹象。尽管经过多年的准备，国防军已经战胜了西伯利亚的同胞。随着沃库塔的陷落，鄂木斯克、叶卡捷琳堡和秋明等人口中心正面临入侵威胁，而西部俄罗斯的全部领土很可能在战争结束时仍然掌握在德国手中。随着德意志空军将目光投向西伯利亚领土的脉络，德国在这场战争中取得胜利几乎是确定的。一个炙热而灼人的太阳在俄罗斯升起，它是千年帝国的明星。"
 ceswrw.21.a:0 "在监狱中寻找勇敢者，在政客中寻找懦弱者。"
 ceswrw.21.b:0 "这可真是个绝佳的地点来安置所有的战俘..."
 ceswrw.22.t:0 "萨马拉陷落"
 ceswrw.22.desc:0 "萨马拉是幸运的城市之一。嗯，大部分是幸运的。当第一次西俄罗斯战争爆发并且战线崩溃时，他们被迫多年处于合作者的控制之下。许多人认为这是不可原谅的事情，一开始是这样。即使德国空军连续轰炸这座城市多年，萨马拉依然坚持下来。生活在轰炸中继续前行。这座拥有数百万人口的城市修建了避难所。然后俄罗斯统一了，生活再次变得美好。有了正常、繁荣、医疗、生活。\n\n有了正常、繁荣、生活。现在，萨马拉不复存在，纳粹的纳粹党旗高高飘扬。萨马拉市议会已经垮了。悬挂在首都大楼上供所有人瞻仰，再次展示了德国铁蹄下的统治。成千上万的人死去，城市变成了废墟。为了什么？"
 ceswrw.22.a:0 "终结的开始？"
 ceswrw.22.b:0 "似曾相识。"
 ceswrw.23.t:0 "日耳曼尼亚陷落"
 ceswrw.23.desc:0 "当俄罗斯入侵德国时，全世界静默地目睹着年轻的俄罗斯国家，刚刚重新统一的国家胆敢独自面对着团结协定。许多人期待着德国迎来一个新时代，迅速的装甲攻势将任何关于新俄罗斯的希望彻底粉碎。\n\n然而，他们错了。\n\n将德国人逼回本土，没人能预料到俄罗斯士兵竟然会踏足日尔曼尼亚。\n\n德国国防军的残部仅仅依靠狂热和愤怒将这座城市变成一个巨大的死亡陷阱。\n\n焦土战术被大量采用，每座房子里都设置了临时陷阱，让俄军前进缓慢艰难。俄罗斯军队亲身经历了德国人民的绝望，街头常见男人、女人、老人和儿童的尸体。战斗只持续了几天，但街道上却染满了俄罗斯人和德国人的鲜血。对于某些人来说，这是天堂，但对于其他人来说，他们仿佛正面对地狱的眼睛。\n\n这不再是一个\"如果\"的问题，而是一个\"何时\"的问题。毫无疑问，世界很快将听到俄罗斯国旗在日尔曼尼亚废墟上飘扬的消息，俄罗斯军队可以松口气庆祝了。幸福的欢呼声和愉快的音乐声可以从几英里外听到。\n\n但是没有什么能与全世界所听到的巨大噪音相媲美，它美丽而无情，对于大多数人来说是终结，对于被征服者来说却是救世主。\n\n那是核打击警报的声音。"
 ceswrw.23.a:0 "终结。"
 ceswrw.23.b:0 "天哪。"
 ceswrw.24.t:0 "但泽陷落"
 ceswrw.24.desc:0 "世界各地的分析师和民众都对第二次西俄罗斯战争的消息感到震惊：俄罗斯已经占领了但泽城。\n\n但泽，在波兰语中被称为“格但斯克”，自德意志骑士团时代以来一直是大日耳曼国的一部分。凡尔赛条约曾在一战和二战之间的一段时间将其授予波兰国家，后来在第二次世界大战初期被征服。\n\n但泽的占领是一场残酷的战斗，就像战争中的前几次战斗一样。这个港口城市一直是德国贸易基础设施的关键港口之一，与什切青和科尼斯堡一起。其占领需要由破坏者进行协调的海军破坏行动、空袭以及联合作战行动，迫使捍卫的德国国防军投降这个被围困的城市。\n\n但泽的陷落与波兰和卡舒比亚的奴隶息息相关，他们从束缚中崛起，发出了最后的解放呐喊。这些少数民族，在经历了三十年的纳粹种族清洗之后，仍然在贫民窟和最危险的工厂中以微小的规模存在。正是这些游击队造成了已经备受困扰的德国军队的瓦解，迫使其投降。\n\n此时，俄罗斯取得了决定性的胜利，赢得了战争的所有筹码。俄罗斯不仅收回了在二战中失去的广阔欧洲领土，还不知何故超越了旧边界，进入了德国本土和历史上的普鲁士地区。随着俄罗斯当局考虑如何处理剩余的波兰人和东德人口，全世界目睹着眼前所发生的不可思议的现实。"
 ceswrw.24.a:0 "一雪格但斯克之耻。"
 ceswrw.24.b:0 "终局将临。"
 ceswrw.25.t:0 "什切青陷落"
 ceswrw.25.desc:0 "经过漫长而艰苦的战斗，卷土重来的俄罗斯军队攻占了\"堡垒城市\"什切青。\n\n进攻开始时，通过大规模的空袭摧毁了城市的大部分老城区，通过其外科手术般的精确度夺去了成千上万人的生命。战斗从奥得河上的孤立桥头堡逐渐发展为对城市本身的总攻，机械化突击部队迅速切断了来自德国首都的供应线。第一批俄罗斯士兵于黎明时分进入什切青，从那里穿过第一道防线，一直到邮局，那里一群混杂的德国海军水手、人民民兵和剩余的国防军部队与坚决的俄罗斯攻击者进行了激烈的肉搏战，从地下室窗口向推进的装甲部队射击二战时期的老式反坦克火箭筒，迫使俄罗斯人逐个清理每栋建筑。最终，俄罗斯人通过引爆炸药摧毁邮局，消灭了最后一丝抵抗，拒绝投降的人全部遇难。\n\n据信，普鲁士国王弗里德里希·威廉为庆祝从瑞典帝国购买什切青而建造的柏林门遭到一颗偏离轨道的炮弹摧毁。这象征性地代表了整个战斗。\n\n随着什切青的陷落，通往德国腹地的大门已经打开。我们将看到，在核大屠杀降临地球之前，卷土重来的俄罗斯强国是否能够及时利用其胜利。"
 ceswrw.25.a:0 "下一站：日耳曼尼亚！"
 ceswrw.25.b:0 "我们必须死守日耳曼尼亚。"
 ceswrw.26.t:0 "布雷斯劳陷落"
 ceswrw.26.desc:0 "经过漫长而艰苦的战斗，卷土重来的俄罗斯军队夺取了德意志野兽的又一个据点。布雷斯劳曾经是一个重要的铁路枢纽和工业中心，经过付出巨大代价的努力，摧毁了城市中凶猛的德军防御者，如今已成为一片冒烟的废墟。\n\n作为德国的“堡垒城市”，城市的德军守军决心以弗里德领袖的名义，到最后一人守卫这座城市。祖国的士兵被迫逐屋战斗穿越堡垒城市，使用火焰喷射器和手榴弹清除任何被绕过的德军阵地，而精锐的突击工兵们则拼死拆除遍布市中心的铁丝网和掩体。俄罗斯轰炸机在战斗初期炸毁了大部分居民区和工业中心，造成了一片由废墟组成的迷宫，德军利用这个迷宫对抗前进的俄军造成了巨大优势，装配线和掏空的坦克车体交叉射击，给进攻者造成了重大伤亡。\n\n装甲部队受到来自成百上千屋顶上的反坦克火箭的阻碍，使整个列队变成了行动中的铁制棺材，当他们的残骸在清晨时分照亮黑暗的小巷时，引发了短暂但血腥的交战，清除了大部分平民战斗人员。\n\n尽管如此，俄罗斯的大旗仍然高高飘扬在布雷斯劳被烧毁的废墟上。随着西里西亚这个工业强国的沦陷，俄罗斯在奥得河畔获得了重要的立足点，可以利用它向德国本土发动进攻。关于如何处理这个省会城市，谈判已经开始。有人说应将其改造为斯拉夫人民的新堡垒，而另一些人则认为这座城市应因其激烈的反抗而被彻底夷为平地。\n\n无论结果如何，有一件事是确定的。"
 ceswrw.26.a:0 "祖国不为任何人停下脚步！"
 ceswrw.26.b:0 "坚守防线！"
 ceswrw.27.t:0 "华沙陷落"
 ceswrw.27.desc:0 "当俄罗斯人越过曾经的波兰边境时，前进中的俄罗斯人得到了波兰民众的不同反应。\n\n有人将他们视为英雄，有人认为他们只是另一个占领者，但也有人将此视为一个黄金机会，再次与斯拉夫兄弟团结起来，将德国人赶出自己的家园。\n\n他们一起向一直以来的首都华沙进发。\n\n德国国防军和波兰的合作者被命令摧毁这座城市，并确保它对前进的部队没有太大用处。\n\n然而，俄罗斯人和波兰人及时赶到，随之爆发了一场迅猛而血腥的战斗，发生在华沙的废墟上。在波兰抵抗运动的援助和德军力量准备不足的情况下，这座城市大部分在几个小时内被夺取，市政厅迅速变成了一个临时的碉堡，机枪瞄准着每个街角。\n\n为了夺取市政厅，许多波兰人和俄罗斯人失去了生命。\n\n最终决定只需将其包围，进一步推进城市，让驻军和合作者陷入困境。\n\n德国国防军被命令撤退，以保护德国领土。剩余的敌军迅速投降，并受到相应处理，现在，一种曾被视为不可能再次看到的景象出现了，纳粹徽章下降，而白鹰再次升起在这座城市之上。"
 ceswrw.27.a:0 "波兰永不灭亡！"
 ceswrw.27.b:0 "背信弃义的狗！"
 ceswrw.28.t:0 "克拉科夫陷落"
 ceswrw.28.desc:0 "藏身于肮脏黑暗的城市深处，生活悄然苏醒。连日来，炮火轰击大地的不可置信声音撼动了克拉科夫的基础，清晰地响彻整个城市的每个角落。现在，坦克的轰鸣声和枪声也能够听到。不再有丝毫疑问，俄国人已经来了。\n\n打开古老的步枪贮藏，久违的一代幽灵慢慢从这座城市的躯壳中浮现出来。沃伊切赫在一生之前与家庭军一起与德国人战斗过。当第三帝国陷入混乱时，他随菲尔多夫起义，当血淋淋的希特勒军靴再度降临时，他再次匆匆进入黑暗。德国人喜欢称他们为蟑螂，而今天，他们将会意识到他们说得多么正确。\n\n当俄国坦克在城市街道上猛烈冲击时，沃伊切赫和他的战友们出现在曾经的弗洛里安斯卡街上。废墟和尸体散落在街道上，高楼大厦两旁已被战火彻底掏空。继续朝着旧城中心前进，这支小队感受到混乱在他们周围蔓延，机枪在屋顶上交火，钢铁之鸟划过晨空。\n\n沃伊切赫呼喊着嘶哑的命令，他的队伍闪电般进入旧城广场，准备与德军展开激烈交火。然而，他们发现的却是自己的兄弟姐妹们，骄傲地在胳膊上佩戴着波兰国旗。一群德国士兵无助地坐在一辆被焚烧的坦克旁。抬头一看，沃伊切赫意识到他听到的机枪声不是德国人或俄国人的，而是那些像他一样，为了波兰而最后崛起的人们。一个纳粹十字在苏基恩尼采的下方被抛弃，三十年来，沃伊切赫第一次充满喜悦地看到银色的鹰飞过他的家，无污点、无损坏。\n\n沃伊切赫走近波兰人，跪倒在他那古老而扭曲的双膝上。一位年轻人转身看到他，慢慢地走向这位年迈的波兰人。年轻人蹲下身子，将双臂搂住沃伊切赫，感受到了他身体颤抖的哭泣声。"
 ceswrw.28.a:0 "波兰重获新生。"
 ceswrw.28.b:0 "那些害虫需要受到教训。"
 ceswrw.29.t:0 "汉堡陷落"
 ceswrw.29.desc:0 "早期报告显示，汉堡，一座重要的工业、军事和海军城市，现在已牢牢地掌握在我们的控制之下。虽然这并非易事，但我们为解放我们应得土地而进行的战斗中，一些最凶险的战斗发生在这里。德国军队没有让出一寸土地，尤其是圣迈克尔教堂在整个城市沦陷后仍然坚持抵抗，狂热的德国国防军拒绝投降，直到一次空袭摧毁了教堂及其内部人员。随后，我们升起了俄罗斯国旗，巩固了我们的胜利。\n\n很难高估我们今天取得的伟大胜利，汉堡不仅提供了大量的枪支、坦克和装备，还是大日耳曼国的主要船坞中心。但也许更重要的是，这座城市及其文化对许多德国人来说是一种自豪的象征，而他们的国旗被烧毁，我们在其余余烬中崛起，是最好的宣传手段之一。许多人认为他们的失败现在是不可避免的，俄罗斯的崛起开始了辉煌的时刻。\n\n当我们与德国畜生开战时，没有人相信我们能够进入他们的领土，更不用说西部城市汉堡了。但今天，我们对地球上的邪恶进行的圣战再次获得了胜利，给了那些怀疑者一个回答。这座城市的市长在他的私人住所向我们的部队投降后试图逃脱被一名不知名的士兵射杀。"
 ceswrw.29.a:0 "胜利将属于我们！"
 ceswrw.29.b:0 "他们从哪里跳出来的？"
 ceswrw.30.t:0 "重夺特奥多里希港"
 ceswrw.30.desc:0 "在攻占塞瓦斯托波尔之后，尽管我们正处于胜利的边缘，我们迈向解放的最后一次冲刺。然而，这个冲刺只是幻想破灭，被彻底打破。当德军再次凯旋进入城市时，他们利用近距离空中支援飞机扫射正在撤退的部队，残杀了无数的士兵。虽然我们士兵的牺牲可以在意识形态上被用来推动战争进程，但战斗仍在继续。\n\n目前，这个曾经供应了无数俄罗斯商船、娱乐船只甚至军舰的港口已经对我们关闭。这是一个过去时代的象征，象征着俄罗斯帝国主义。当然，这并不代表我们的新方向，即解放俄罗斯人民的方向。"
 ceswrw.30.a:0 "一转攻势了……？"
 ceswrw.30.b:0 "我们不会再输了。"
 ceswrw.31.t:0 "重夺里加"
 ceswrw.31.desc:0 "经过数日的不懈战斗，古城里加再次落入德国的掌控之下。当德军从东欧撤退时，国际观察员预计[RUS.GetAdjective]的进攻将在几周内迅速蔓延至普鲁士和波兰。然而情况并非如此。愤怒的德军高级指挥部逮捕了允许撤退的指挥官，处罚了东欧殖民卫队，并下令在里加发起反攻，同时加强了德国国民警卫队的支援。随着海军炮击这座镌刻着七百年德国智慧的街道，东欧新兵们如波涛般冲向多瑙加河的铁丝网潮水。[RUS.GetAdjective]人对这座城市进行了艰苦的防守，直到一枚迷失的炮弹砸中了[RUS.GetAdjective]指挥官的临时指挥部。随着他们的领导被杀，由于克雷格斯马林海军的袭击，通信遭到严重干扰，[RUS.GetAdjective]的防守变得松散且协调不力。一支德军团队能够渡过城市南部的河流，然后攻击几乎没有防守的东南区域。城市在几天内沦陷。\n\n德国现在正在搜寻这座城市残破的废墟，试图辨认出死者，并将受伤的德国人疏散到普鲁士的医院。一场全城范围的反游击队行动已经演变成一场反斯拉夫人的大屠杀，愤怒的国防军悬赏缉拿和殴打了数百名拉脱维亚人和立陶宛人致其死亡。许多俄罗斯战俘因涉嫌恐怖主义而被处决。\n\n里加的夺回表明德军并未准备示弱与消亡。尽管莫斯科专员辖区看起来牢牢掌握在[RUS.GetAdjective]政府的手中，但复兴的纳粹战争机器可能会找到重新锻造对该地区施加的枷锁的方法。东欧也必须忍受新一轮战役的打击。[RUS.GetAdjective]军队已经做好了为保住殖民地而战至死的准备，而德国人则准备牺牲一切来保持他们在波罗的海地区的生存空间。"
 ceswrw.31.a:0 "我知道天堂在哪里，它就在立陶宛……"
 ceswrw.31.b:0 "是时候发动反攻了。"
 ceswrw.32.t:0 "重夺圣彼得堡"
 ceswrw.32.desc:0 "圣彼得堡的围攻已经结束。尽管俄罗斯军队对这座城市执着固执，但我们的海上封锁和顽强抵抗迫使他们悄然撤退，只剩下一点点资源。陆军在宫殿广场上骄傲地行进，决心向东进发。\n\n圣彼得堡在波罗的海的位置对我们封锁这座大型驻军很有优势。顽固的芬兰政府拒绝向俄罗斯驻军提供任何所谓的“人道援助”，我们继续限制着俄罗斯入侵者能够为士兵提供的少得可怜的补给路线。首先是通过我们的海军舰队，然后是通过切断他们在拉多加湖附近的陆地路线，入侵者开始挨饿。很快，明智的俄罗斯人被迫撤退，那些没有背叛的人迅速向我们投降。\n\n虽然相对血少，这样的围攻不仅破坏了我们从最初令人惊讶的俄罗斯突袭中收复失地的时间计划，而且极大地减少了东德人对我们驻军的信任。我们成立了一个由预备役军人组成的驻军，通过武力维持和平，这让当地的合作者政府感到筋疲力尽的沮丧。但我们前方仍然有一条血腥的道路，这种争吵必须推迟，直到俄罗斯愚蠢的入侵被制止，他们的政府被羞辱。"
 ceswrw.32.a:0 "[RUSGetUniqueNamePlain]将以沉默和羞辱为代价投降。"
 ceswrw.32.b:0 "一点小挫折而已。"
 ceswrw.33.t:0 "重夺斯摩棱斯克"
 ceswrw.33.desc:0 "斯摩棱斯克市再次陷入了德国国防军的掌控之中。在[RUS.GetAdjective]武装部队在莫斯科专员辖区遭受攻击的分散注意力下，德军陆军和东方领殖民地守军的几个团队联合起来重新夺回了这个关键的边境城市。大量的白俄罗斯本地人身穿德军疲劳服装，拿着残破的步枪，在黄昏时分被迫向[RUS.GetAdjective]的防线发动冲锋。[RUS.GetAdjective]的弹药储备耗尽后，德国装甲师从树林中涌出并开始开火。随着城市周边的火光冲天，建筑物倒塌，[RUS.GetAdjective]指挥官选择在即将毁灭的城市中进行战斗性撤退，而不是面对庞大的战争机器。绝望的士兵们在街头街尾战斗，每一颗子弹都换回了一支步枪或一个孩子回到莫斯科的车票。然而，他们的努力还是不够。黎明时分，[RUSGetUniqueNamePlain]的旗帜倒在泥泞中，纳粹党旗再次飘扬在斯摩棱斯克上空。\n\n对于支持一个独立[RUSGetUniqueNamePlain]的人来说，斯摩棱斯克的夺回是个沉重的打击。[RUS.GetAdjective]政府如果不能对边境地区进行有效控制，就不太可能夺回莫斯科专员辖区的领土。目前，对于在东方领进行军事行动的可能性已经被消除，而随着重新打开通向莫斯科的道路，德国国防军正在准备夺回这个东方明珠。如果莫斯科再次沦陷，[RUS.GetAdjective]的民族精神很可能将永远无法恢复。\n\n另一方面，德国内的情绪却是喜悦的。纳粹党为了保持不可动摇、不可压制的权力形象，在整个德国帝国都安排了军事阅兵。陆军指挥官和政治家们匆忙从阴影中走出来，计划重新征服莫斯科专员辖区。他们看到新时代的曙光在地平线上闪耀。这将是一个毫无争议的雅利安人统治时代；统治全球，统治劣等种族，甚至统治人类历史的进程。德国将发声，而弱小的种族将倾听！"
 ceswrw.33.a:0 "现在所有的目光再次投向莫斯科，斯摩棱斯克，以及人类的未来。"
 ceswrw.33.b:0 "让我们扭转局势。"
 ceswrw.34.t:0 "重夺保卢斯堡"
 ceswrw.34.desc:0 "德国陆军已经用鲜血还击了屈辱。保罗斯堡这座曾经被俄罗斯军队解放的城市，已经被大日耳曼国夺回。自由俄罗斯的旗帜被从旗杆上撕下，扔进了被车轮踩踏过的泥泞之中。\n\n保罗斯堡的夺回主要归功于备受困扰的德国平民。尽管伏尔加德国人被刻板印象认为更友好于俄罗斯政府，但是俄罗斯占领军的高压统治，尤其是对德国居民区的严密监控以及当局对被释放的俄罗斯奴隶进行私刑和暴乱时显得无动于衷，导致许多中立平民转而拥抱大日耳曼国。那些拥有武器的人秘密准备着袭击俄罗斯占领军，而其他人则从事破坏行动。少数富有的工厂主秘密联系了国防军，计划进行联合进攻。最后，当附近的装甲军团返回，将城市掩埋在火焰中时，德国民兵起义并从后方攻击俄罗斯军队。虽然几乎没有平民幸存下来，但这足够分散注意力，以实现突破。俄罗斯军队被迫战败撤退到伏尔加河对岸。\n\n保罗斯堡的夺回向俄罗斯政府发出了警告信号。尽管他们早期的进攻可能取得了成功，但如果这场战争要取得有利的结局，他们必须坚守阵地。伏尔加盆地再次分裂——民族之间、国家之间、帝国之间。在战争结束之前，它可能再次统一。"
 ceswrw.34.a:0 "又来？"
 ceswrw.34.b:0 "弗里德里希·冯·保卢斯的遗产得到了保护。"
 ceswrw.35.t:0 "重夺基辅"
 ceswrw.35.desc:0 "纳粹军总部由于来自前线的欢欣消息而欢呼雀跃。乌克兰的行政和经济中心基辅在一次大规模攻势后被解放，[RUS.GetAdjective]入侵者被迫离开广阔的第聂伯河地区。通往莫斯科专员辖区的道路已经清晰无阻。\n\n纳粹军发起了一次大规模攻势，以解放基辅及其周边领土，并恢复乌克兰的粮食产区。[RUS.GetAdjective]的防御者在对城市及其乡村周边的多方面巨大攻势下不堪重负。海军陆战队步兵冲过第聂伯河，机械化部队利用乌克兰开阔的田野超越了[RUS.GetAdjective]装甲部队。随着基辅的一举占领，[RUS.GetAdjective]军队东撤重新组织。谷物仓库被打开，纳粹军迅速解除疲惫不堪的部队。\n\n当地居民的福祉问题被忽视了。纳粹军确保他们能够得到充足的食物，没有任何强制配给的迹象。因此，有关当地游击行动的报告迅速填满了我们的总部，就像新村庄的收复一样。乌克兰人拒绝将任何东西交给德国：他们的土地、他们的面包或他们短暂的自由。\n\n对于残余游击队活动的担忧，这些“军队”无法与霍里斯或舒姆斯基的土匪相提并论，无法迫使纳粹军停下脚步。德国有一个粮食产区需要占领，有一个团结协定需要确保。"
 ceswrw.35.a:0 "一点小挫折。"
 ceswrw.35.b:0 "德军前进的不仅仅是为了填饱肚子，更是出于对团结协定的热爱。"
 ceswrw.36.t:0 "重夺阿斯特拉罕"
 ceswrw.36.desc:0 "德国国防军军官们在高加索地区深处再次集会，密谋下一步结束俄罗斯侵略的行动。阿斯特拉罕的俄罗斯-高加索抵抗已被彻底粉碎，为自由俄罗斯的南方地区打开了大门。德国不会允许俄罗斯人带着空手而逃；他们将遭遇应得的受到犹太影响的野蛮人的报复。\n\n阿斯特拉罕的围困将被载入史册，成为现代史上最残酷的战役。俄罗斯军队和高加索游击队在伏尔加和里海的海岸上进行了激烈的战斗，在点缀着旧城的市区贫民窟和市场里，他们战斗到最后一刻。德国国防军军队如急浪般冲向城市：炮火蹂躏着街道，空军将每个目标变成了冒烟的灰烬。我们的海军陆战队为了利用俄罗斯阵线的任何弱点而作出了一次又一次的牺牲。几个星期后，战斗结束了。\n\n缺口形成了，就像飞蛾撕裂旧衣服，使得陆军能够涌入阿斯特拉罕内城的钢铁之手。我们的部队穿越肉碎机般的街道，我们的坦克在俄罗斯防御者狡猾的反坦克行动中牺牲，但当一个伞兵部队冲进俄罗斯驻军的总部时，投降已被迫从他们将军血淋淋的嘴里挤出来。\n\n德国对高加索据点没有计划，并且不感兴趣重新考虑与叛变的高加索居民的关系。卡尔梅克人、鞑靼人、阿塞拜疆人，那些在那场战斗中抵抗的人将承受最严重的后果。石油和他们的生命都是我们的。陆军已经揭开了垂死的俄罗斯侵略的膨胀身体，现在寻求刺穿它的心脏。亚洲的野蛮人必须被驱逐回西伯利亚。第三帝国将获胜，我们的人民将繁荣昌盛。"
 ceswrw.36.a:0 "重整队伍，准备反击！"
 ceswrw.36.b:0 "现在我们必须刺进[RUSGetUniqueNamePlain]的软肋。"
 ceswrw.37.t:0 "重夺格罗兹尼"
 ceswrw.37.desc:0 "在BBC的广播中，一位老英国人懒洋洋地倾听深夜的新闻报道，以获取欧洲大陆最新的消息。主持人说，大日耳曼国在经过数周的城市战斗后，夺回了格罗兹尼城，这是一次伟大的反攻。由于其众多的油井和位于高加索战线中心的位置，格罗兹尼对于德国的工业和军事事业至关重要。\n\n河岸师曾是雅利安军队的先锋部队，他们称这座城市的围攻是缓慢而残酷的。许多报道强调了俄罗斯-车臣联盟在这座城市的山区和山丘上采用的游击战术，这些战术减缓或完全阻止了德军进入城市。最终，大规模轰炸行动模仿了过去恐吓俄罗斯人的方式，广泛地应用于他们的山地防线上。不久之后，河岸师能够通过桑扎河渡运部队，成千上万的海军陆战队精锐迅速占领重要的战略据点，为剩余的军队冲进城市铺平道路。城市战斗主要由狙击手和隐蔽的反坦克部队进行。数周的反游击行动在城市中心以残酷的大屠杀告终，数百名涉嫌游击队员被赶到市中心广场并被立即处决。\n\n尽管我们的轰炸行动已经使这座城市陷入了瘫痪，但格罗兹尼并没有平定。次要报道显示，在该城市的农村社区周围，车臣的抵抗活动重新振作起来，预计将成为德军后勤的一大难题。然而，陆军否认了这些担忧的有效性，尽管有关本地合作政府的计划是德军的本土盟友所推测的。"
 ceswrw.37.a:0 "无关紧要的失败。"
 ceswrw.37.b:0 "没有人会知道在车臣死去的[RUS.GetAdjective]人。"
 ceswrw.38.t:0 "重夺第比利斯"
 ceswrw.38.desc:0 "第比利斯的街道，作为对我们在高加索正当统治的背叛据点，充斥着我们强大的陆军从埃里温广场列阵而过。背叛的格鲁吉亚民众在第三帝国对俄罗斯占领者夺取该城的铁腕镇压下颤抖不已。\n\n这座被俄罗斯入侵者突袭夺取控制权的城市，位于特里亚莱蒂和萨古拉莫山脉之间，对第三帝国解放高加索的努力构成了重大挑战。这座城市的地理位置困难，也是将军们最大的优势所在。山脉和姆特卡瓦里河为陆军提供了易于保护和利用的据点，成为我们进攻主要城区的起跳点。空军和山地突击队迅速占领了姆特斯敏达和楚古雷蒂，尽管一开始遭遇到背叛的民众的抵抗，但很快被武力平息。在所有主要地区被夺取后，陆军在强大的空中支援和炮击下突破了包围，压倒了疲惫不堪、动摇不定的俄军和他们的格鲁吉亚游击队。黄昏时分，俄罗斯驻军指挥官投降，将忠诚的游击队置于我军的武力统治之下。\n\n尽管我们成功地夺回了第比利斯，但格鲁吉亚民众表达了对我们严酷围城的憎恶：他们向我们勇敢的士兵投掷砖块和其他杂物，报告称受困民众对驻扎我军疲惫部队的抵触，而在穆霍阿尼区域，暴力抗议活动正在酝酿，他们毫无目标地高呼“自由”和“第比利斯三人”，他们必将受到迅速的处理。\n\n尽管第一次高加索抵抗的城市已经被我们的陆军重新夺回，并接受了军事法律和秩序，但军警部队的报告称，第三次高加索起义可能会动摇第三帝国维持对俄罗斯入侵者的反攻能力，特别是考虑到他们与我们的油井相邻。我们必须继续前进，即使以失败为代价。"
 ceswrw.38.a:0 "[RUSGetUniqueNameTitle]不能在这里动摇。"
 ceswrw.38.b:0 "格鲁吉亚人士气低落，下一个将是高加索的[RUS.GetAdjective]人。"
 ceswrw.39.t:0 "重夺巴库"
 ceswrw.39.desc:0 "德国的总参谋部得知巴库被夺回的消息后，庆祝之情溢于言表。他们满脑子都是重新征服阿斯特拉罕和高加索的叛逆分子，而阿塞拜疆的燃料如今正填满向俄罗斯冲锋的坦克营的胃口。\n\n在德军连续取得高加索战线上的胜利后，俄罗斯军队开始进行战略性撤退，以阻止入侵部队微薄残余的彻底覆灭，他们撤退至哈萨克斯坦和萨马拉。巴库和阿塞拜疆的农村地区只有一支由阿塞拜疆民兵和农民组成的薄弱防线。第35装甲师被指派重新夺回这座城市。他们以令人瞩目的方式成功完成任务。元首的幕僚指示军官们压制关于俘虏的阿塞拜疆士兵被坦克碾压和示威者被坦克击毙的画面，以防止形成烈士并妨碍平定工作。\n\n尽管有越来越多的游击队报告传回日耳曼尼亚，地区指挥官们保证这只是暂时的高峰。无论是通过法律还是必要的武力，阿塞拜疆人及其盟友都将被教育要懂得尊重。尽管在几个地点发生了破坏行动，但最初的油田储备和基础设施的接管尝试已经取得了压倒性的成功。当地劳动力不断接受审查，以了解他们对俄罗斯人还是对抵抗运动的支持态度，已经抓捕、审讯并清理了三百多名敌对分子。巴库的胜利已无可阻挡。高加索属于雅利安种族。"
 ceswrw.39.a:0 "拼死保住莫斯科。"
 ceswrw.39.b:0 "我们将为了一个更伟大的德国跋涉过这些狂风。"
 ceswrw.40.t:0 "重夺瑟克特夫卡尔"
 ceswrw.40.desc:0 "一系列间谍机拍摄的空中照片证实，[RUS.GetAdjective]军队夺回了瑟克特夫卡尔市。曾经骄傲的科米共和国的残破废墟再次摆脱了德国的威胁，至少暂时如此。尽管雅利安士兵作出了超人般的努力，但国防军对这座城市的控制从未真正巩固。数周疯狂的报复行动毫无意义。与暗影冲突有关的民兵尽管遭受了可怕的伤亡，但在前苏维埃派出的尤里·安德罗波夫和彼得·格里戈连科将军的带领下，在工业区发生了一场起义。[RUS.GetAdjective]军队能够比预期更快地重新组织自己，并在德国防守者忙于平息南方民兵起义时发起对城市东部区域的反攻。德军总部在几个小时内被夺取，陆军被迫带着失败的局面撤退。\n\n在战争的崩溃交响乐中，科米居民在以俄罗斯人为主体的[RUS.GetAdjective]城市中的命运被遗忘。[RUS.GetAdjective]政府的早期估计显示，超过两万名科米男性、女性和儿童被驱逐出城市，进入东方专员辖区的深渊。德国外交部拒绝就这些人被送往何处发表评论。安德罗波夫、格里戈连科和[RUS.GetAdjective]武装部队的行动无疑拯救了科米族群的未来。\n\n瑟克特夫卡尔的掌控对于西部[RUSGetUniqueNamePlain]地区至关重要。该市位于靠近阿尔汉格尔斯克的北部地区与靠近萨马拉和喀山的南部地区之间的关键交汇点。随着重新夺回这座城市，[RUS.GetAdjective]人似乎重新点燃了至少实现白色和平的希望，如果不是对莫斯科专员辖区进行直接扩张。无论最初推进西部[RUSGetUniqueNamePlain]的原因如何，国防军似乎已经失去了动力，势头已经转向[RUS.GetAdjective]的防守者。胜利就在眼前，但失败也不远了。"
 ceswrw.40.a:0 "只要我们保住A-A线……"
 ceswrw.40.b:0 "正义可能会要求最优秀的公民为他们的生命负责。"
 ceswrw.41.t:0 "重夺维亚特卡"
 ceswrw.41.desc:0 "一个伊尔库茨克公寓里的小家庭聚集在电视机前，观看着国家斗争的最新消息。他们目睹了俄罗斯士兵的大规模行军，穿过一个受伤的市中心广场，一个中年妇女宣布了一些鼓舞人心的消息：俄罗斯军队已经解放了维亚特卡市，将其从德国侵略者的手中夺回。尽管播音员的声音中充满了喜悦，但公寓里充满了疲惫和担忧；在这场战争中，这个家庭的父亲和长子到底在哪里？\n\n不过，新闻播报员继续滔滔不绝地讲述着俄罗斯人进行的艰苦战斗。战争镜头显示了俄罗斯人使用他们庞大的导弹发射器和火炮对固守在壕沟里的德国防御者进行的猛烈轰炸，逐一摧毁了德军控制的任何区域。通过报道，她赞扬了爱国游击队向俄罗斯炮兵部队提供情报的帮助，揭露了德国的编队：没有一个防空部队、营或者补给站能够逃脱俄罗斯无所不在的眼睛。在短暂而又致命的轰炸之后，俄罗斯海军陆战队越过了维亚特卡河，利用自俄罗斯无政府状态以来从商人那里学到的河道分布的弱点。这些海军陆战队得到了大规模机械化部队的支持，他们击败了士气低落、被削弱的德军守军。一周结束时，负责守卫维亚特卡的德国师投降了。\n\n尽管取得了这场迅速而又胜利的胜利，但并非一切都光明如初。曾经纯净的维亚特卡河被我们的同志和敌人的鲜血以及战争的恶臭废墟所污染。更糟糕的是，德军雇佣了大量的RONA合作者来管理维亚特卡和伊热夫斯克；他们对反抗市民的残酷“镇压”至今仍未被俄罗斯解放者摧毁，因为RONA已经四处散布在乡村中，掠夺和洗劫他们能找到的任何村庄，以打击俄罗斯人的意志。\n\n俄罗斯必须为失去的领土和所有被德国统治束缚的人民，坚决维护正义和取得胜利！"
 ceswrw.41.a:0 "[RUSGetUniqueNameTitle]不能像叶戈罗夫那样踌躇不前，而应像苏沃洛夫那样果断出击！"
 ceswrw.41.b:0 "小小挫折。"
 ceswrw.42.t:0 "重夺阿尔汉格尔斯克"
 ceswrw.42.desc:0 "[RUS.GetAdjective]西部战线的报道确认，阿尔汉格尔斯克港已经恢复归[RUS.GetAdjective]政府所有。尽管原本认为由德军陆军和海军共同行动已经完全确保了该地区，但给固守的德军士兵供应困难最终拯救了这座城市。驻扎在城市的步兵师困于有限的口粮和稀缺的弹药。饥饿的士兵无法胜任战斗任务，而口粮暴动的前景导致德国指挥官及其随从将自己封锁在市长办公室，带着剩余的供应物资。两周后，迫切需要的德国空军补给投放只发现包含了胡椒粉、避孕套和数箱葡萄酒，这些物资在寒冷的环境中冻结并爆炸了。[RUS.GetAdjective]军队重新组织并从南方发动进攻时，德军守备队已在为食物进行绝望的战斗中自相残杀。他们几乎没有任何抵抗，仅仅数小时后这座城市再次归[RUS.GetAdjective]控制。\n\n阿尔汉格尔斯克的夺回暂时关闭了德军进攻[RUS.GetAdjective]西部的潘多拉之盒。没有对港口城市的控制，任何国防军的进攻将不得不通过东方领或乌克兰的道路补给。乌拉尔山脉和西部[RUSGetUniqueNamePlain]的重要工业和经济中心暂时是安全的。但国防军不会轻易放弃。狼群将咬住西部[RUSGetUniqueNamePlain]的脖子，他们将把该地区和其中的每一个灵魂拖到他们主人的脚下。\n\n现在，战争再次转向莫斯科专员辖区的鲜血淋漓的土地。这次失败是否意味着国防军对其殖民地的防御即将结束？这是否预示着[RUS.GetAdjective]人的长期胜利？或者阿尔汉格尔斯克的夺回将成为一个垂死国家的最后挣扎？数百万人的命运岌岌可危。每一颗子弹，每一次刺刀的刺击，都可能意味着新秩序的终结。任何一个人都有能力决定整个人类的命运。"
 ceswrw.42.a:0 "必须有一场最后的战斗，之后运动将掌控世界。"
 ceswrw.42.b:0 "简单的战术性撤退。"
 ceswrw.43.t:0 "重夺鄂木斯克"
 ceswrw.43.desc:0 "一条宁静的河流之上，解放的旗帜在空中飘扬。军团们戴着面具行进，他们知晓那被释放在俄罗斯最后的堡垒上的日耳曼巨龙的炽热气息。这座静谧河流上的城市曾经是西伯利亚的最后堡垒，寄托着联盟的传承；但就像炽热的太阳一闪而过，这一切都成为了虚无。\n\n古老要塞的雄伟塔楼和房屋被摧毁，破败的废墟散布在被烧毁的街道上。俄罗斯人在同胞的残骸中行进，城市笼罩着黑暗的氛围，弥漫在大地、空中和海洋之间。盖格尔的嗡鸣声和钢铁与火焰的轰鸣激励着俄罗斯最优秀的战士前行，为解放而开路，为了他们的复仇。日耳曼人在这里在西伯利亚西部做出了最后的抵抗，被他们愚蠢的统治者抛弃而只能靠自己的智慧。\n\n数日来，雷声和火焰的响声充斥着战场的稀薄空气。日耳曼人深埋在城堡周围的地下，如同长在俄罗斯草地上的野草，被俄罗斯强大的愤怒击溃。数日来，侵略者被火焰和钢铁所打击，悄然接近他们的地堡、悄然接近他们的战争机器，悄然接近他们的灵魂；他们再也无法安享宁静。在俄罗斯的折磨之后，俄罗斯人进行了一场伟大的战斗；他们记得普斯科夫，记得莫斯科，记得数以百万计被日耳曼人的燃烧仇恨席卷走的人们。日耳曼人没有得到任何怜悯；无论是九头蛇还是雄鹰；他们甚至看不到敌人的面孔，因为他们被黑暗和盾牌所遮蔽。\n\n战斗蔓延到了日耳曼人的战壕；让人回忆起过去的战斗，那个发生在俄罗斯冰上的战斗。钢铁与钢铁相撞，刀剑砍伐着俄罗斯人和图托人，但并没有对它的无情产生多少幻想。然而，俄罗斯最终获胜了；但他们解放自己人民的道路仍然漫长而艰难。"
 ceswrw.43.a:0 "愿上帝怜悯那些扰乱了鄂木斯克城的人们。"
 ceswrw.43.b:0 "一举夺回鄂木斯克！"
 ceswrw.44.t:0 "重夺秋明"
 ceswrw.44.desc:0 "一场战争中发生了惊人的逆转。俄罗斯军队从入侵的德军手中夺回了秋明市。在大量使用毒气迫使俄罗斯军队离开秋明后，德国发现自己获得了一场空洞的胜利。位于城市下方的复杂工厂和计算机系统被彻底摧毁，几乎没有什么可以帮助德军入侵者的东西留下。\n\n当战局逆转时，之前德军难以攻克的同样的地堡如今又成为死亡陷阱。逃离城市的斯大林主义游击队员逆向工程了地堡，摧毁了用于在隧道中移动的临时升降机井道。德军士兵现在被困在地下数百米深处，通过大量使用手榴弹、爆炸物，甚至据传使用他们自己的化学武器储存库，将他们逐一赶出。\n\n目前尚不清楚有多少德军部队在这场战斗中损失。德国的命令使得他们无法在该地区撤退，即使在地面上的部队明显会在几天内被击溃。为了试图阻止俄军进入地堡，关键的地下区域疏散计划被放弃。随着这一计划的失败以及秋明所有地下基础设施的完全摧毁，俄军取得了一次令人瞩目的战术胜利。\n\n要使这场逆转成为战略胜利，俄军需要进一步向前推进并清除乌拉尔山脉的防线。如果他们能够突破山脉上的防御位置，他们将处于更具防守性的地理位置。至于秋明市，目前整个城市都无法居住。在统一战争和当前冲突之后，几乎没有正常运作的基础设施；地面建筑物已变成空洞的墓穴。任何难民都必须在其他地方生活，因为在这深渊中，已经没有任何留下的东西。"
 ceswrw.44.a:0 "他们贪婪地探索了太过深入。"
 ceswrw.44.b:0 "在整个战争的大局中微不足道。"
 ceswrw.45.t:0 "重夺新西伯利亚"
 ceswrw.45.desc:0 "“虽然一个国家可能没有弹药，但爱国热情能够为任何步枪装弹，杀死任何侵略者。”这是一位代表团的发言人如此说道，这个代表团解放了遭受德国占领的破败城市新西伯利亚。\n\n对许多专家来说，当俄罗斯最工业化和人口最多的城市成为德军反攻的牺牲品时，前线似乎已经临近死亡。随着中央政府继续向东撤退，以避免被纳粹帝国的愤怒所吞噬，当地政府拒绝让他们的生计和社区经历德国占领，就像他们在西部的家庭所经历的那样。因此，地下城市中形成了游击队的联合力量：民粹派鼓动者、中西伯利亚理想主义者、雇佣兵和残存的军事力量。他们全部组成了一个统一战线，对抗城市内的德军。\n\n那些无法逃跑的人得到了地下游击队运动的援助，被送往靠近贝加尔湖的更安全的地方。那些留下来的人拿起武器，利用错综复杂的城市地形将德军逼入钢铁之鞘。有报告称坦克列被撕成两半，德国安全部队被伏击和屠杀，重要的后勤库被轰炸至屈服。\n\n当中央政府最终重新组织了少量部队来解放这座城市时，德军已经筋疲力尽且妄想症。俄罗斯军队如滚滚洪流般涌入破败的城市，压倒了纳粹，迫使指挥官撤退。\n\n虽然这座城市的解放被证明是一次重要的战略胜利和士气提振，但很多人怀疑他们是否能够解放西部，从数十年的占领中夺回控制权，因为已经很少剩下东方饥饿战争机器所需要的物资。"
 ceswrw.45.a:0 "那些战斗的声名将永垂不朽。俄罗斯万岁！"
 ceswrw.45.b:0 "即将接近终点线。"
 ceswrw.46.t:0 "重夺车里雅宾斯克"
 ceswrw.46.desc:0 "俄罗斯士兵们在重要的工业中心车里雅宾斯克的收复之际欢呼雀跃。车里雅宾斯克位于南乌拉尔山脉以前的平原尽头，代表着险要的关隘之前的最后一个据点。\n\n一旦纳粹占领者席卷该市，车里雅宾斯克及其居民便再也没有享受片刻的宁静。接管该市的陆军指挥官立即展开了一系列恐怖行动，进入平民家中，挟持妻儿为人质。为了保全家人的安全，该市的男子们被迫在坦克工厂中辛苦劳作，每天长达十六小时的轮班制，制造支持各个装甲部队的零部件。当俄军猛攻开始时，纳粹下令处决人质。如今，充斥着婴儿和儿童的集体坟墓照片正在俄罗斯流传。少数勇敢的记者已与澳大利亚的同行取得联系，希望揭露纳粹的罪行。\n\n乌拉尔的女神如今成了废墟。车里雅宾斯克的坦克工厂已被完全摧毁，该市的大部分地区在纳粹占领者纵火焚烧东区时也遭到了毁灭，目的是焚烧主要由犹太人居住的地区。火势最终吞噬了该市大部分的居住空间，使大多数幸存居民无家可归。\n\n俄罗斯军队现在面临巨大的挑战，但如果他们能够继续取得连胜，也许解放俄罗斯是可能的。目前，俄军正为又一次决定性的行动做准备。从车里雅宾斯克出发，欧洲再次等待着战火的燃烧。"
 ceswrw.46.a:0 "从曾经吞噬坦克的口中，现在涌出了复仇之怒。"
 ceswrw.46.b:0 "优势在我！"
 ceswrw.47.t:0 "重夺托木斯克"
 ceswrw.47.desc:0 "马加丹的一家军事医院洋溢着长时间未见的庆典氛围，广播中充满欢乐的消息回响。一丝希望之光充斥着每一位士兵、外科医生和护士的耳朵。西伯利亚的雅典——托木斯克市，在经历了一段紧张的围困和近身搏斗后，最近被俄罗斯军队从德国占领者手中解放出来。尽管这些部队可能受伤，也许被从战争的余波中移除，但他们的热情与成千上万的家庭、小队和船员们一道，齐声欢呼，为寻求自由的俄罗斯喝彩。\n\n托木斯克市的市民拒绝在德国人对他们社区进行的严厉报复下屈服。无论是书籍被焚毁，大学和工作室被炮击，还是知识分子被驱逐，人民都坚定地抵抗着入侵者。在亚历山大·涅夫斯基和诺夫哥罗德人的回忆中，巴斯蒂利亚人在尼古拉·巴丘克的领导下，主动与德国人在汤姆河畔战斗。他们为了自己的家园流血牺牲，使得那些不幸被驻扎在城市东部的德国人士气低落，而俄罗斯的反攻则粉碎了他们一般的防线。\n\n经过几周艰难而残酷的市区战斗和破坏者的反扑行动，直到旧城区的西部得以解放。当俄罗斯人从艰苦的胜利中恢复过来时，曾经活跃在这座城市的沙龙残余成员立即行动，修复受损的城市。现代化的工程师们外出修复重要基础设施，人文主义者和十二月党人主动组建了临时政府，创建了一个统一委员会，代表俄罗斯政府行使治理职责，而巴斯蒂利亚人则对那些给这座古老城市的智慧和灵魂带来伤害的德国人进行了迅速的制裁。\n\n也许托木斯克永远无法恢复其作为西伯利亚真正的雅典的原始地位，但理想并不会随着它们的宿主而消亡。托木斯克自由了，只要这座城市说着俄语，她的旧生活方式将会延续下去。"
 ceswrw.47.a:0 "一个想法即使遭受成千上万的子弹，也无法毁灭。"
 ceswrw.47.b:0 "为了报仇，焚毁一百个村庄。"
 ceswrw.48.t:0 "重夺喀山"
 ceswrw.48.desc:0 "拦截到的军队行动和无线电交流表明喀山市已被俄罗斯政府夺回。虽然该市的防御因鞑靼民族主义者的叛变和叛乱而削弱，但在喀山市内，很少有人对第三帝国表示欢迎。自占领以来，德军士兵对喀山市民犯下了许多罪行，包括酒后斗殴、武装抢劫和绑架。这些行为本身并不足以完全使鞑靼人彻底倒向俄罗斯阵营。然而，随着喀山政府开始逮捕德国流氓士兵，帝国政府宣布雅利安人员只受大日耳曼国法律的约束，并要求所有被监禁的军人在战争结束时被释放以接受审判。持续发生的犯罪行为事件加剧了喀山市民对纳粹的反感情绪，增强了伊布拉吉姆·明加泽耶夫领导的统一战线的实力。统一战线与俄罗斯政府取得联系，在俄罗斯武装部队逼近喀山市时，统一战线用含砷的啤酒毒害了大量德军人员。他们一起将该市从德国占领中夺回。\n\n明加泽耶夫的政府已经坚定地站在俄罗斯一边，参与正在进行的战争。俄罗斯外交官已经努力与鞑靼人达成协议，提供更大的地区自治、巨额税收减免，甚至可能免除服兵役，以换取他们的忠诚。作为回报，民族主义军官、官僚和政治领袖被驱逐到中西伯利亚面临未知的命运。大多数鞑靼军人已重新招募进入俄罗斯武装部队，尽管许多部队已被解散并调配到其他战区。\n\n俄罗斯重新夺回喀山是通向俄罗斯战争胜利的必要且血腥的一步。如果德意志国防军继续向西俄罗斯推进或南下哈萨克斯坦，唯一可能的结果将是独立俄罗斯的奴役和歼灭。现在，这场战争尚未决定胜负。只有时间和鲜血才能揭示世界将由谁决定俄罗斯人民的命运。"
 ceswrw.48.a:0 "也许巴图的子女可以挽回自己的过失。"
 ceswrw.48.b:0 "叛徒！全都是叛徒！"
 ceswrw.49.t:0 "重夺斯维尔德洛夫斯克"
 ceswrw.49.desc:0 "斯维尔德洛夫斯克的人民难以被长时间控制。随着俄罗斯军队涌入这座城市，德国人民对战争形势的可能传说性变化感到颤栗。在欧洲俄罗斯剩余地区取得广泛进展并出人意料地穿越乌拉尔山脉，超出大多数观察者对德国进攻会停滞的预期，战局如今已发生转变。\n\n当德军洗劫这座城市时，联合的列宁主义者、无政府主义者和被困的涅涅奇族士兵展开了针对关键工业区域的破坏行动。随着广泛的俄罗斯炮火削弱城市的防御，联合战线开始发起一系列起义和罢工，停止了关键设防工事的生产。德国士兵试图惩罚罢工者时，正当混乱局势之际，大规模的进攻开始推进至城市周边。法西斯分子确保阵线之时，许多重要区域已经失陷，俄罗斯军队开始确保这座城市。\n\n德军如今在两个战线上作战，几乎被合围，其处境狼狈不堪，无法有效地保卫他们所征服的领土。在这种封闭的位置上，炸弹和炮火变得更加有效，最后的德国士兵死于自己的鲜血之中。\n\n斯维尔德洛夫斯克位于乌拉尔山脉之前。对于俄罗斯人来说，即将到来的战斗将比这些残酷的战役更加艰难，但如果俄罗斯要取得\"战前现状\"，甚至获得进展，这是必要的。目前，他们必须考虑生存，并保卫他们目前的土地，而不是征服的梦想。"
 ceswrw.49.a:0 "指挥官和士兵，理论家和普通公民；我们共享同样的命运！"
 ceswrw.49.b:0 "坚守防线！"
 ceswrw.50.t:0 "重夺沃尔库塔"
 ceswrw.50.desc:0 "在北方的地狱般的永久冻土上，数以万计的德国人沿着雪道艰难地前行，朝着下一个目的地迈着疲惫而低沉的步伐，他们的眼皮和姿态因为被击败而低垂，步伐也不再像在日耳曼尼亚时那样得意洋洋。\n\n72小时前，他们还是地球上那些反对帝国及其广袤领土的败类的狱卒和看守。这些有妄想的俄国人竟然在经历了二十年的内战和复苏之后敢对德国人发动攻击，他们的剑在雅利安人种的铁盾上粉碎。这些胆小的斯拉夫人逃到了西伯利亚深处的荒野，躲避了德国正义的报复。当德国陆军发现了臭名昭著且可耻的“狱卒之城”沃尔库塔时，他们公开揭露了俄国人的伪善和野蛮行径，只是将那些曾反对他们的士兵和游击队员关进了那些阴暗的牢房里。\n\n就在几天前，直升机和喷气式飞机的轰鸣声充斥着德国占领军的耳朵。士兵们从飞机中涌出，像暴露在清冷秋日空气中的蒲公英一样，向被惊讶的步兵开火，用曳光弹和凝固汽油弹将他们撕成碎片。导弹撕裂着大地，地平线上弥漫着红色、橙色和绿色的万花筒。俄国人带着一座城市冲进了古拉格，逐个解体了德国师团和连队。经过那三天的地狱般战斗，德国占领军投降了。\n\n现在，德国的看守们任凭俄国人的处置，他们并不打算释放他们。傍晚时分，德国人的队列看到了沃尔库塔的广阔营地，他们知道这将是他们腐朽的地方。因为他们的傲慢和压迫，因为他们的法西斯主义和堕落，他们将不会接受审判，只有判决。"
 ceswrw.50.a:0 "狱卒们现在被囚禁起来，无望从他们的受害者那里得到怜悯。"
 ceswrw.50.b:0 "一个毫无意义、冰冷的监狱。"
 ceswrw.51.t:0 "重夺萨马拉"
 ceswrw.51.desc:0 "当列昂尼德报名参加全俄军队时，他应该明白自己陷入了什么。但这仍然让他感到惊讶。每当他的旅收到可恶的纳粹分子占领了萨马拉的通知时，这个拥有数百万人口的城市士气都达到了历史最低点。这又是一次西俄罗斯战争。勇敢的俄罗斯人试图解放自己的家园，但却毫无成果，白白牺牲。当他的旅接到命令前往这座城市并从德国人手中夺回时，战争变得更加真实。他和他的战友们会因此流血。乌拉尔-375向战场驶去的过程是寂静的，一如既往。这场战争中的恐惧仿佛将永远持续下去，世界仿佛正经历它的末日。但这一次不同。这一次，统治他战友思绪的不再是恐惧，而是悲伤。其中几个人的家人就在萨马拉，他们知道战争对城市的影响。\n\n当车门在城市郊区打开时，他听到了炮火声、喷气式飞机的尖叫声和无助者的呼喊声。这就是他为之战斗的东西。这就是第二次西俄罗斯战争的意义所在：因为莫斯科的俄罗斯人每天都会听到这些呼喊声，他们受制于德国人的脚下。他按照命令行动，遵循自己的训练，低头行进。希望一切顺利，并且不知道自己杀了多少人。\n\n那是24小时前的事了。现在，萨马拉再次属于俄罗斯。它将永远如此。列昂尼德已经死了。他在一次火拼中保护一个家庭时丧生。他的尸体变得无法辨认，只剩下他的狗牌可以证明身份。但这就是战争的方式。这是解放的代价。他的战友们将记住他的名字，而俄罗斯将记住他所做的事。也许当这一切结束时，他的名字将永远被铭记在十万个之中，他的遗孀将在一个和平、解放的俄罗斯照料她的孩子。他为此付出了生命。"
 ceswrw.51.a:0 "萨马拉解放了。"
 ceswrw.51.b:0 "我们是故意放掉这座城的！"
 ceswrw.52.t:0 "重夺日耳曼尼亚"
 ceswrw.52.desc:0 "当俄国人夺取了帝国首都时，对于德国而言，一切似乎都已经失去；在绝望之举中，德国人发射了他们的核武器，以确保最终的胜利。\n然而，为了最后的爱国行动，剩余的德国国防军和民兵向日耳曼尼亚发起了最后的进攻。\n\n俄国人做好了充分的准备，迎接史上最后一战。\n警报声不断响起，枪炮声不断，炸弹爆炸声不绝，尸体不断倒下。\n每一条街道、每一座建筑物、每一座纪念碑都成为了一场艰苦搏斗的战场。\n\n德国人迅速报复了俄国人造成的破坏，确保没有一个俄国人能够看到天亮。\n充满愤怒和热情，德国人成功地逐渐将入侵者赶出他们的城市，他们祖先的雕像俯视着他们的勇敢。\n\n然后，一切陷入了寂静。\n德国军队注视着俄罗斯国旗降下，取而代之的是万字旗在日耳曼尼亚上方再次飘扬。\n欢呼声、眼泪和微笑。\n然后，世界静止了，蘑菇云从地面上升起。"
 ceswrw.52.a:0 "我们本应见好就收。"
 ceswrw.52.b:0 "英灵殿里见，杂种。"
 ceswrw.53.t:0 "重夺但泽"
 ceswrw.53.desc:0 "在支离破碎的大日耳曼国残存的土地上，群众为国防军收复但泽的消息欢呼雀跃。俄罗斯士兵已经完全撤离这座城市，而那些无法逃脱的人现在将死于报复性的法西斯分子手中。\n\n对但泽的夺回是由德国高度优势的海军领导的，该海军协调了对该半岛和波罗的海沿岸周边郊区的一系列海军入侵。虽然俄罗斯军队顽强地保卫着这座城市，但摇摇欲坠的补给线和无情的攻击使得这座废墟无法守住。在失去韦斯特普拉特半岛和旧的中央长廊街道后，俄罗斯军队最终放弃了这座城市。\n\n作为对德国的恶意示威，俄罗斯士兵在远离城市的半岛上安置了炸弹，摧毁了瓦尔斯普拉特纪念碑，该纪念碑是为纪念1939年波兰最初入侵的英雄和在短暂存在的“旦泽自由市”期间反抗占领的德国人而设立的。\n\n至于剩下的波兰人和卡舒比人，如果德国在任何一段重要的时间里占据这座城市，那么厄运就在等待着他们。纳粹领导层和国防军指挥部已经呼吁彻底消灭帝国的任何叛徒。作为一种病态的测试，任何不能用正确的德语发音的人都将被贴上叛徒的标签，并被吊在灯柱上。国际组织已经报告说，回国的士兵杀害了妇女和年仅12岁的儿童。\n\n尽管但泽的胜利对德国的胜利希望至关重要，但这还不够。但泽仍然在东德意志地区占据重要地位，需要重新夺回更多领土才能至少将前线推向莫斯科专员辖区。德国领土上有如此巨大的伤痕，任何和平解决、胜利或失败都将永远不会被遗忘。"
 ceswrw.53.a:0 "一个垂死国家的死亡之声。"
 ceswrw.53.b:0 "德意志愿意为但泽而死。"
 ceswrw.54.t:0 "重夺什切青"
 ceswrw.54.desc:0 "德国从俄罗斯手中夺回了重要的港口城市什切青，这是对雅利安人力量的一次无可估量的展示。\n\n在这一点上，俄罗斯军队大大超过了大多数德国士兵。随着战争越来越深入德国领土，国防军损失的总人数超过了现在在战场上的领先人数。据报道，有人看到步兵使用第二次世界大战的步枪向使用 60 年代装备的俄罗斯人射击。包括儿童兵和老人在内的人民冲锋队现在构成了德国武装部队的大部分。\n\n尽管如此，希特勒青年团的狂热核心仍然是一支半有效的战斗力量，在一位不知名的中尉的指挥下，他们能够智取俄罗斯军队并夺回斯德丁。\n\n什切青的战斗是在一片瓦砾荒原上进行的一场绝望的斗殴。儿童兵在被炸毁的街道上游行，而狙击手则向他们的指挥官射击。据报道，俄罗斯军队不愿向这群青少年和青春期前的孩子开火，而是选择试图俘虏这群可怜的人。这些演习变成了仁慈和背叛的高伤亡大屠杀，让国防军一米一米地收复了这座城市。\n\n德国战线上的一切都不太好。日耳曼尼亚本身距离前线还不到150公里，即使取得了这场胜利，困扰德军的补给和人力问题也没有得到解决。德军的任何失误都将轻易毁掉德国获得有利甚至可以接受的和平的任何机会。"
 ceswrw.54.a:0 "大日耳曼国仍然是一头困兽。"
 ceswrw.54.b:0 "从我们的土地上清除斯拉夫败类。"
 ceswrw.55.t:0 "重夺布雷斯劳"
 ceswrw.55.desc:0 "经过一番激战，西里西亚首府布雷斯劳市已被黑尔人收复。虽然此时的分析人士预计这场战斗将是一场艰苦而漫长的战斗，但由于一个关键因素：陷入困境的俄罗斯补给线，夺取行动出奇地简单。\n\n俄罗斯军队的实力在地面上已经超过了赫尔，并试图与更强大的德国工业保持空中对等。尽管他们拥有强大的地面部队，但工业能力的差异意味着德国的空袭使该镇软化了。俄罗斯人现在在远离他们的补给线的敌对领土上处于守势，陷入了协同推进。\n\n德国政府在夺回这座城市后，强调了该市民族社会主义运动的努力，该运动在城市沦陷前有效地保卫了这座城市，后来在鼓励西里西亚当地德国人轰炸道路、破坏火车、放弃阵地方面发挥了作用敌军，甚至随着德国人从西方逼近而起义。至关重要的是，作为布雷斯劳指定为“堡垒城市”的一部分，碉堡明确地面向东方。虽然这些对于布雷斯劳的初始防御至关重要，但它们对俄罗斯军队毫无用处，他们要么不得不花费宝贵的时间在石头上打洞，要么无视它们。然而，这些碉堡作为夺回城市的防御工事非常有帮助，并且一致的报告表明，一旦被占领，碉堡中的机枪阵地对于确保整条街道的安全非常有效。\n\n虽然德国陆军在西里西亚取得了胜利，但如果他们有任何希望收回他们的全部领土，那么还有很多土地。尽管如此，强大而响亮的胜利表明，既然俄罗斯已经进入德国本土，它将面临激烈的抵抗。通往日耳曼尼亚的道路确实是血腥的。"
 ceswrw.55.a:0 "不惜一切代价将他们挡在奥得河！"
 ceswrw.55.b:0 "每一寸土地都要流血。"
 ceswrw.56.t:0 "重夺华沙"
 ceswrw.56.desc:0 "自从俄国人进军华沙以来已经有好几天了，但德国人的靴子再一次践踏了自由华沙的希望。\n俄罗斯人与波兰人一起准备反击，最终以炮火和无情的小规模冲突的形式出现，以削弱防御力量。\n\n最终，防御破裂，国防军像一股不可阻挡的洪流一样涌入，一条又一条地清理街道，并确保钩形十字架返回华沙；尽管如此，波兰人并没有放弃。\n为了确保他们的俄罗斯解放者安全撤退，他们躲在阴影中并沿途设置陷阱，尽可能地阻止德国人的前进；足够多的国防军士兵在黑暗的小巷中失踪或被拖入下水道。\n\n小巷被点燃，下水道被洪水淹没，像老鼠一样，电线杆被冲走；德国军队筋疲力尽，被迫停止前进以重新补给和重组，给俄国人足够的时间撤退。\n\n出于报复的渴望，国防军决定将这座城市夷为平地，这样就连历史也会忘记这座城市和它的人民，炮弹将落下，建筑物将倒塌。\n华沙从地图上消失了，反过来，德国也抹去了波兰历史的一个篇章。"
 ceswrw.56.a:0 "也许波兰将永远灭亡。"
 ceswrw.56.b:0 "他们活该。"
 ceswrw.57.t:0 "重夺克拉科夫"
 ceswrw.57.desc:0 "玛丽亚气喘吁吁地跑了。当深红色的暮色充满地平线时，她的靴子在克拉科夫蜿蜒的街道上回荡。与过去一周一样，远处炮火的轰鸣声将她的脑袋炸裂，火花在城市中绽放。闪烁的光影在建筑物上划过一道道长长的影子，来去匆匆又消失在夜空中。玛丽亚握紧右手，掐住卡拉什尼科夫冲锋枪，以免它从她满是汗的手指中滑落。她举起枪，按下了扳机，一道灰影进入了她的视线。在她身后，她知道成排的不露面的法西斯分子会追捕她。\n\n俄罗斯混蛋几天前就放弃了这座城市，把它留给波兰抵抗力量的残骸来阻止纳粹浪潮。她无法逃脱，玛丽亚知道。她唯一的希望就是消失在阴影中，让波兰自生自灭。听到卡车在她身后驶来的隆隆声，她发现了一条隐藏在她左边的车道，然后像猫一样溜进了黑暗中。\n\n当她躲进小巷时，玛丽亚紧闭双眼，用尽全身力气强忍住喘息。她跪倒在地，手盲目地向前伸，卡拉什尼科夫冲锋枪从她手中散落。玛丽亚摸索着向前走，她能感觉到指甲下的泥土和血。当她感觉到自己的手握住了柔软冰凉的东西时，她知道自己必须睁开眼睛。玛丽亚被咸咸的泪水蒙蔽了双眼，但仍能辨认出轮廓。有些人漫不经心地散落在街对面，就像她面前的那个。其他人在柔和的晚风中摇摆，他们腐烂的身体像钩子上的肉一样裸露。街道一直延伸到地平线，没有一根灯柱光秃秃的。玛丽亚漫无目的地跌跌撞撞地走到路中央，用脏兮兮的拳头擦去眼泪。一瞬间，整个世界只剩下风的低语和绳索的嘎吱嘎吱声。很快，长筒靴的敲击声和一个用德语咆哮的声音划破了空气。"
 ceswrw.57.a:0 "波兰人民的死亡之声。"
 ceswrw.57.b:0 "他们应该明白我们的立场了。"
 ceswrw.58.t:0 "重夺汉堡"
 ceswrw.58.desc:0 "当我们被迫撤离汉堡时，许多人因失去了我们国家的文化瑰宝之一而自杀。但今天，我们为那些在战斗中死去的人报了仇，并证明那些夺走他们生命的懦夫是错误的，因为汉堡再次在我们的控制之下。\n\n黎明时分，空袭摧毁了俄国狗可以使用的任何基础设施，然后我们再次进军该市。远离光荣的战斗，许多人死于疾病和自杀，有人估计比战斗中死亡的人还要多。但无论如何，俄国国旗被降下并被唾弃，而我们的国旗再次飘扬。\n\n没有人梦想过一个统一的俄国，但更没有人梦想过一个统一的俄国会入侵并占领汉堡和许多重要城市。当他们占领汉堡时，无论是文化上的破坏还是军事上的破坏，都是一个巨大的损失。但现在它在我们的控制之下，文化影响得到了恢复。但这个城市已经是一个空壳了，没有船只制造，也没有工厂抽出步枪、坦克、飞机和其他设备，城市的基础设施已经全部消失。\n\n然而，这仍然是一场胜利。而我们的人现在受到鼓舞，要把俄国人逼退，为了大日耳曼国的利益，我们将继续前进。"
 ceswrw.58.a:0 "这值得一试，对吧？"
 ceswrw.58.b:0 "“我希望那个城市的驻军增加一倍，你听到了吗？”"
 decswrw.1.t: "提供自治权"
 decswrw.1.desc: "经过深思熟虑，我国政府认为应该向大日耳曼国提出一个提议。其基础是：保证伏尔加河流域德国人的政治、文化和经济自主权。这些人不是纳粹分子，也不是定居者和入侵者。 伏尔加河德国人几个世纪以来一直是俄罗斯社会的忠实成员。我们希望，随着时间的推移和我国政府的慈善行为，他们可以再次成为这样的人。\n\n我国外交部表示，这一提议将实现两个目标。首先，如果在沃尔加斯塔特的运动取得成功，提供自治权可能有助于将伏尔加人民重新纳入我国政府。第二，这样的提议可能会降低战争的热度，使我们能够反击德国关于种族和世界末日战争的叙述。我们需要公众和国际舆论站在我们这一边--还有什么办法能比让德国平民站在我们这一边，光荣地对待他们的同胞呢？"
 decswrw.1.a: "就这样，送出这份提议。"
 decswrw.1.b: "等等，这太过分了。取消谈判！"
 decswrw.2.t: "战争赔款"
 decswrw.2.desc: ""
 decswrw.2.a: ""
 decswrw.2.b: ""
 decswrw.2.c: ""
 decswrw.3.t: "停火？"
 decswrw.3.desc: ""
 decswrw.3.a: ""
 decswrw.3.b: ""
 decswrw.3.c: ""
 decswrw.3.d: ""
 decswrw.4.t: "被打破的承诺"
 decswrw.4.desc: ""
 decswrw.4.a: ""
 decswrw.5.t: "德国同意了！"
 decswrw.5.desc: "经过几周的艰难谈判，德国外交部和我国外交官达成了一项关于伏尔加河人民的协议。如果（德国人坚持我们不使用 \"当\"）我国政府在战争结束时保持对沃尔加斯特的控制，伏尔加河的德国人将获得重要的政治自治权。这些权利包括特别免税，有权选举自己的代表，保护该地区的德语，维持德国人对该地区企业所有权的规定和保证，以及更多。此外，我国政府将允许国际媒体和OFN-团结协定联合委员会不受限制地进入该地区及其居民。也许他们怀疑我们会像对待波兰人那样对待伏尔加人。\n\n这些谈判取得了巨大的成功。尽管《伏尔加河条约》对我们施加了限制，但我们显然既获得了国际信誉，又在我们这场小小的战争中获得了回旋余地。"
 decswrw.5.a: "兄弟们，干杯：轻松胜利了！"
 decswrw.6.t: "德国人拒绝了……"
 decswrw.6.desc: "经过数周的艰难谈判，大日耳曼国的代表退出了有关伏尔加河地区自治的谈判。德国外交部今天发出一封公函，称“亚洲的野蛮人将被以任何必要的方式粉碎”，“日耳曼人民永远不会被斯拉夫人统治”。至少可以说，我们很失望。但也许我们对他们的期望太高了。\n\n随着战争的进行，伏尔加河地区的命运似乎将由我们来决定，而且只能由我们来决定。那就是如果我们能保留它。但如果冷静的头脑占了上风，我们赢得的不仅仅是一块土地。我们需要国际伙伴关系和那种只有美国人或日本人的认可才能带来的软实力。该条约本来是通往国际信任和善意道路上的第一步。是的，乌云中有一线希望——但还是要下雨。"
 decswrw.6.a: "也许关于哈萨克斯坦犹太人的笑话太过分了......"
 decswrw.7.t: "[RUS.GetName]接受停火"
 decswrw.7.desc: ""
 decswrw.7.a: ""
 decswrw.8.t: "德国人接受停火"
 decswrw.8.desc: "看来，接受德国停火后，我们既可以收集死者，也可以重组我们的部队。随之而来的当然是我们和德国人之间不稳定的和平。然而，这种全面停火很快就会结束，针对西俄罗斯的战争将再次开始。当它不复存在时，将军们已经制定了计划，如果不是片刻，紧张局势会略微降低。\n\n防线两侧的平民又可以松一口气了。他们开办的小型医院正在收治大量伤员。德国人和俄罗斯人都在同一个屋檐下休养生息，因为人性的阴影似乎又回到了世界上……暂时。"
 decswrw.8.a: "急需松一口气。"
 decswrw.9.t: "[RUS.GetName]拒绝停火"
 decswrw.9.desc: "我们试图与德国代表团达成至少临时停火的努力遗憾地遭到了拒绝。尽管我们的医院仍然被大量伤亡患者淹没，但似乎我们必须继续战斗，继续战争的努力。如果没有重要的损害控制措施，今天的谈判失败将阻碍我们的战争机器，并激怒平民大众。\n\n随着越来越多的人离开家园去工厂工作或在东欧泥泞的战场上战斗和牺牲，我们中的其中一个人将会崩溃。当我们中的任何一个人崩溃时，结果将无法挽回地改变世界历史，甚至可能打破德国旨在建立和维护几十年的微妙权力平衡……"
 decswrw.9.a: "我们会渡过难关"
 decswrw.10.t: "德国人拒绝停火"
 decswrw.10.desc: "我们试图与德国代表团达成至少临时停火的努力遗憾地遭到了拒绝。尽管我们的医院仍然被大量伤亡患者淹没，但似乎我们必须继续战斗，继续战争的努力。如果没有重要的损害控制措施，今天的谈判失败将阻碍我们的战争机器，并激怒平民大众。\n\n随着越来越多的人离开家园去工厂工作或在东欧泥泞的战场上战斗和牺牲，我们中的其中一个人将会崩溃。当我们中的任何一个人崩溃时，结果将无法挽回地改变世界历史，甚至可能打破德国旨在建立和维护几十年的微妙权力平衡……"
 decswrw.10.a: "我们会渡过难关。"
 decswrw.11.t: "[RUS.GetName]希望谈判"
 decswrw.11.desc: "尽管战争本身似乎毫无进展，但前线报告给我们带来的只有悲伤和蔑视。父国的左右两侧的人们正被俄罗斯野兽残杀，他们非法攻击试图夺回明显不属于他们的领土。无论如何，这已经持续了足够长的时间。\n\n我们政府中的许多人已经起草了一份提议交给俄罗斯政府。提议指出，我们应该结束造成两国困扰的流血冲突，并达成一些协议，无论是土地划分还是资金转移。我们并不打算放弃像莫斯科这样广阔的地方，然而，给斯拉夫人一两个省份并不会对我们造成太大的损失。\n\n然而，如果我们不接受俄罗斯人的这些交易，不仅将避免与我们的种族敌人达成和平协议带来的不可避免的耻辱，而且还将只是暂时阻止俄罗斯人进一步侵入我们的核心领土。尽管在日耳曼尼亚和德国的范围内，许多人在这个问题上存在分歧，但只能有一个答案。"
 decswrw.11.a: "为了帝国的利益，发出和平信号。"
 decswrw.11.b: "不能再与斯拉夫民族打交道。"
 decswrw.13.t: "德国接受外交谈判"
 decswrw.13.desc: "战争的恐怖可以改变许多态度。曾经看似笑话的事情现在成为现实。大日耳曼国给我们发来一封信，接受了我们关于进行外交谈判的提议，为和平开辟了道路。\n\n然而，我们不应该过分兴奋。虽然我们双方都寻求和平，这将降低紧张局势，但战斗仍将在背后持续进行。在我们进行谈判时，重大的收益或损失会改变它们的本质，从收益变为损失，或反之亦然。因此，我们不能失去警惕。我们的政府将努力从德意志入侵者那里获得尽可能多的土地和黄金，但纳粹不太可能放弃，除非我们已经取得了收益。此外，谈判本身并不一定能够成功。\n\n不过，也许这场代价高昂的战争可以以一种不保证世界毁灭或相互屠杀的方式得到解决。"
 decswrw.13.a: "我们时代的和平？"
 decswrw.14.t: "德国拒绝外交谈判"
 decswrw.14.desc: "给俄罗斯蛮子们，\n\n我们收到了你们懦弱的外交谈判请求。我们提醒你们，与次等人类之间不存在外交，只有教育，我们愿意用鲜血和铁来教育你们对非法入侵的愚蠢。你们如此侮辱地提及的伤亡对于一个有权力意志的民族来说毫无意义，不同于你们已经被击败、注定要失败的民族。你们在可怜的呻吟中暴露了比任何报告所能告诉我们的更多。\n\n我们期待着粉碎你们那群营养不良的农民，以及夺回我们对你们的领土主张，将你们的尸体踏在脚下。\n\n签字，\n[GER.GetLeader]。"
 decswrw.14.a: "这帮禽兽真不要脸！"
 decswrw.17.t: "会议室内"
 decswrw.17.desc: "“秩序和混乱之间的界线在于物流。”\n\n在庞大的团结协定中，该帝国的大部分民用和军事产业都来自于几家利用德国大型采购项目获利的企业。这些企业在德国政治、经济和军事事务中具有极强的影响力和实力，因为他们的政府不断扩大对东欧地区的贸易和安全控制。然而，对于我们来说，他们有一个非常有用的特点。\n\n他们的忠诚度较低。\n\n由于他们的巨大影响力和腐败问题，许多高级军官和股东并不像预期那样对德国政府表达相同程度的忠诚和支持，这也是德国人最软弱的地方。我们将与国家工业集团和IG法本集团等德国大型企业展开秘密谈判，以利用他们的支持间接削弱德国的战争努力。无论是通过篡改数据来减少他们向德国前线提供的关键武器和物资的生产，还是通过影响德国政府的高级官僚和官员更加支持和平，我们将努力确保获得他们的勉强支持。\n\n然而，他们的权力和贪婪是巨大的，他们肯定会要求获得有利可图的财务和军事交易，以及对其军事和道德可疑资产的特殊保护。因此，我们必须派遣我们最优秀的外交官秘密代表我们在战争中的利益，以达成任何妥协或支持。我们将在会议室和办公室里战斗...\n\n不论我们花费多少金钱或道义上的优越性。"
 decswrw.17.a: "在商业界，不存在免费的午餐。"
 decswrw.18.t: "生产资料"
 decswrw.18.desc: "几天来，我们在安全屋、酒吧和无声会议室内秘密会晤，巨型企业的代表们向我们传达了上级的要求。\n\n他们给我们寄来了一份冗长的合同，充斥着险恶条款和企业术语，意图混淆和分化我们的外交人员。但是通过仔细阅读，我们成功破解了他们的密码。\n\n他们的董事们表达了他们对战争带来的巨大破坏的担忧，城市、村庄和人民在火灾和毁灭中被卷走。现代武器的使用，加上自三十年前巴巴罗萨行动以来前所未有的规模的部队投入战斗，让他们担心俄罗斯飞机会瞄准他们的资产，更具体地说，他们的工厂和设施。因此，为了将修复被摧毁的设施和设备的成本降到最低，他们将开始削弱德国人替换物资的能力，以换取对他们工厂的保护。\n\n显然，通过说服德国工业积极减慢武器、坦克和飞机的质量和数量，并让高层官员忽视这些逐渐变化，我们将在技术和数量上获得优势，这无疑将有助于我们的战争努力。\n\n然而，我们不能完全相信这些企业，因为他们可能随时变节，而我们却毫不知情。我们也无法说服每一个游击队员、轰炸机和导弹避免袭击他们的工业复合体和设施，结果是，为了未来的幕后交易，他们将收紧裤腰带。\n\n尽管如此，我们可以通过攻击德国的生产力来实现绝对胜利的第一步。但这个决定必须迅速而自信地做出。毕竟...\n\n兵不厌诈。"
 decswrw.18.a: "成交，我们将组织代理人，对您进行保护和合作。"
 decswrw.18.b: "拒绝成交。企业的忠诚是对金钱的忠诚，而不是对任何国家的忠诚；他们想骗我们。"
 decswrw.19.t: "献给凯撒"
 decswrw.19.desc: "自上一份电传已送达[RUS.GetAdjective]外交官们已经过去了几个星期。他们甚至都不确定这些公司是否真的会回复，或者最糟糕的情况发生了，他们决定将全部力量用于支持德国的战争努力。\n\n安静的暖气轰鸣声、咖啡的倾倒声和打字机的咔嗒声。然而，突然传来一阵轰鸣声；德国公司已经采取了行动！\n\n[RUS.GetAdjective]外交官们跑向稳定打印的信件，期待着这么长时间以后这些公司的董事和股东们想要问的全部内容。然而，在传真机哀鸣和隆隆声持续了许多分钟后，报价终于到达了。经过几个小时的阅读和解码行话，外交官们似乎明白了这些公司对利润有多忠诚。\n\n德国公司的信件有一个简单的前提。德国的公司经济改革和为政府的大战所提供的资金和资源支出增加，对其资金造成了过多的侵蚀。社会责任、对祖国的责任感以及对其产品施加的严厉制裁，正在令IG法本集团和戴姆勒-奔驰等公司感到沮丧；他们的董事们已经看到地缘政治对团结协定的命运产生了变化。因此，他们向[RUSGetUniqueNamePlain]提出了一个简单的交易，这将使[RUS.GetAdjective]在勇敢和坚定的战争中受益，同时削弱德国继续战斗的动力。\n\n这些公司将通过操纵、贿赂和动摇德国官员和领导人，以减少他们对国家的战争努力的信心，作为交换，我们将合作减少针对他们产品的有针对性的制裁。然而，如果战争以我们的胜利告终，他们还要求在我们的经济中享有特殊特权：关税和税收减免，防止针对他们制定的额外收入和营业税的漏洞，以及对他们公司的优惠交易。\n\n但是，我们真的想让那些像牲畜一样奴役我们人民以获取利润和财富的人来享受这些特权吗？毕竟，他们可能不会向德国纳税，但他们绝不会向那些在他们的统治下受苦的千千万万人纳税。"
 decswrw.19.a: "成交。被压迫者的解放将取代被剥削者永远得不到的正义。"
 decswrw.19.b: "拒绝交易。怎么能让他们剥削我们的人民来发财？"
 decswrw.20.t: "企业的社会契约"
 decswrw.20.desc: "在德国的一个安全屋里，几个男人拿着一封非常重要的信件，这封信将决定他们如何迎接祖国在最伟大斗争中的命运，成功与否。\n\n来自国家工业集团、戴姆勒-奔驰、法本集团和西门子的人聚集在一起，聆听或阅读着信件的内容；这是来自俄罗斯侵略者的回应。他们有骨气不向这些公司的要求低头，并派回了一份坚定的还击；这份还击肯定会改变他们继续运营的方式。俄罗斯人很快就对我们缺乏\"人类道德\"和\"社会责任\"进行了批评，这些话语肯定会被任何股东立刻嘲笑。但是他们的要求非常简单但又严厉。\n\n要求我们对待我们工厂里的俄罗斯人要有同情心，实施适当的劳工法规和工人特权，与我们在办公室和设施中为普通德国员工实施的待遇相同，否则他们将结束所有谈判，并允许他们的部队攻击我们的财产。\n\n当他们都理解了这些要求之后，这个安全屋显然出现了分歧。让俄罗斯人对德国公司施加压力，会遭到许多会议中的保守派的强烈反对：俄罗斯人在1954年被打败了，他们将再次被打败，这些要求对他们的反对者来说是不盈利和无耻的，甚至不值得考虑！然而，一种恐惧感在空气中弥漫开来，他们害怕俄罗斯工人会被煽动起来制造混乱和危机。暴乱、罢工和爆炸填满了他们的脑海，许多人知道，如果他们拒绝，工厂可能会像法兰克福的股票一样跌入废墟。通过满足这些要求，他们可以暂时缓解这些情绪，同时还可以保护他们的基础设施免受俄罗斯轰炸的彻底袭击。\n\n企业界存在分歧，他们的自尊和贪婪与他们对那个给予他们如此多的国家的爱国心和忠诚斗争着。但最终，命运通过一个电话来确定。"
 decswrw.20.a: "成交。我们宁愿提高斯拉夫人的地位，也不愿眼睁睁地看着我们的资产崩溃。"
 decswrw.20.b: "拒绝成交，他们的狂妄自大将破坏我们之间的谈判。最大化我们的生产，忘记斯拉夫人！"
 decswrw.21.t: "人之职责"
 decswrw.21.desc: "在汉堡的黑暗街道上，一间不起眼的办公室在众多昏暗的建筑中辛勤工作。\n\n办公室内氛围紧张至极，犹如化学武器一般弥漫在其中的人们之间；重大的商务事务正在处理中。祖国正受到废墟之后二十年无政府状态和混乱之后崛起的俄罗斯大军的进攻。然而，这些并不只是“一些人”，而是德国四大企业的高官们；他们代表着他们的首席执行官和股东召开了紧急会议。\n\n俄罗斯方面对这些企业的要求作出了回应，但他们并不满意。\n\n尽管这些要求为他们提供了能削弱德国战争机器决心和效力的战略优势，但俄罗斯人却执着于他们那表面上的“道义感”，而非冷酷的务实主义。然而，他们并未完全切断所有联系，并向德国提出了一项新的外交提议。俄罗斯政府已经发现了那些通过莫斯科奔向东方的难民所揭示的不成比例的工厂工人薪资不平等现象。由于战争导致生活成本上涨，配给和战争税收增加，俄罗斯政府宣称不采取行动将等同于“工业种族灭绝”，并要求董事会提高工人工资以应对上涨的生活成本。\n\n德国工厂中俄罗斯工人所需的工资提高将耗费数千万帝国马克，因为有大量俄罗斯工人参与战争努力。这个办公室的董事们意见不一。有些人提出了俄罗斯构成的实际军事威胁，有些人提到难民的证词可能会损害我们的外交声誉，甚至有人辩论起俄罗斯工人的“种族和道德”劣势。\n\n然而，当他们的争论逐渐平息之时，董事会最终做出了决定……"
 decswrw.21.a: "贫穷是可耻的。为了几百万帝国马克而失去工厂和外国市场，这太过了。"
 decswrw.21.b: "为什么要让[RUS.GetAdjective]人在整个德国都在挣扎的战争中得到优待？谈判结束。"
 decswrw.22.t: "热线被切断"
 decswrw.22.desc: "在俄罗斯的办公室里，我们的外交官正在阅读一封信，这封信将永久改变我们在第二次解放战争中对帝国东部领土上数以千万计被囚禁人民的战略。\n\n这封信来得晚了，短小粗糙，因为投递过程中遭到了折腾，信中的内容同样严厉。德国的大型企业已经切断了与我们的所有联系，不会再有谈判的余地。\n\n他们花了时间指责我们对德国人的\"肤浅的道德优越感\"，指责我们是他们土地上的入侵者，而那里有我们的人民，同样是被德国的大型企业奴役了几十年的人民。他们在措辞上没有太多外交手法，就好像这是一场宣战一样，正是他们的合作支撑着帝国的战争机器，在30年前撕裂了旧联盟。他们在指责我们\"贪婪\"和\"顽固\"时没有任何道义可言，尽管他们荒谬的要求就像寄生虫一样紧紧抓住我们的市场。\n\n愤怒和厌恶弥漫在办公室里，外交官们甚至难以相信这些企业在紧张的谈判和贸易几个月中所展示的多么缺乏尊严和无耻。我们给了这些企业一个机会展示一丝人性来支援我们的解放战争，而现在他们已经走到了尽头。"
 decswrw.22.a: "我们不需要他们的绳索来绞死我们人民的压迫者。"
 decswrw.23.t: "公司不征税"
 decswrw.23.desc: "数天的等待之后，我们的一家外国大使馆终于收到了一位IG法本集团代表的重要信息，并通过位于马加丹的渠道将其交给了我们。\n\n这些公司已同意私下协助我们对抗德国的战争。董事会对我们的谈判进行了审查，并认为商业税收减免是对即将发生的战争法规的可接受补偿。随着战争继续肆虐，这些法规无疑将由第三帝国强制执行。\n\n因此，他们已开始制定名单，列出德国内部的官僚、军官和其他重要人物，以贿赂、劝说和威胁的方式来削弱团结协定的战争努力的决心和凝聚力。由于它们在德国拥有主导地位的经济和军工力量的特点，如果我们继续赢得更多战斗并解放更多人民，这些行动无疑会对我们有益。然而，在我们政府成员中，贿赂和私下交流肯定不会很顺利，特别是如果这意味着这些公司将更难被清除，无法为他们对东欧强加的经济奴役获得应有的正义。\n\n因此，我们必须全力以赴，全心全意地进行这场战争，以确保这些不光彩的交易能够最大程度地用来摧毁德国政府的决心。"
 decswrw.23.a: "我们神圣的战争将在经济战线上取得突破！"
 decswrw.24.t: "公平工作权"
 decswrw.24.desc: "经过数日的等待，我们的一个外国大使馆收到了一份来自戴姆勒-奔驰代表的重要信息，并通过满洲国的渠道将其送到了我们手中。这些公司提到了对他们工厂中的\"党派袭击\"和\"国际对其工人权益的谴责\"的担忧，终于屈服于我们的要求。\n\n这意味着在整个战争的过程中，德国大型企业将迅速进行内部改革和政策变革，确保向俄罗斯工人提供与其德国员工相等的工作标准和额外社会项目，以换取未来的财务和外交合作。这也意味着这些大型企业仍然愿意与我们妥协，鉴于我们正在进行的战争的重大性。\n\n然而，如果任何这些让步的消息传出去，更别说这份报告，我们只能预料到最糟糕的后果：公众的强烈抗议和对我们政府的信任丧失，与大型企业进行的任何有益于我们成功的未来谈判的瓦解，以及政府内部的不稳定。因此，我们应该将这份报告安全可靠地保管起来，以防止泄密者获取……"
 decswrw.24.a: "即使这意味着我们将在战争中成为伪君子。"
 decswrw.25.t: "窸窣的羽毛"
 decswrw.25.desc: "电话在日耳曼尼亚的办公室里不断响起。安静的低语和震耳欲聋的怒吼从电话中传到了无数张灰色面孔的官僚耳中。这些电话铃声、电话来回挪动的声音和自以为是的尖叫声，只能与五十年代的党卫军政变和第一次西俄战争引发的危机相媲美。随着混乱无序的局面达到高潮，一个共同的声音逐渐清晰起来：呼吁和平并展开谈判。\n\n企业对我们实施的战时限制感到不满。根据企业报告，这些措施旨在通过重复的自给自足和将所有生产转移到前线来保护我们的经济，但据称却威胁到德国工厂和企业陷入衰退和潜在破产，这与我们帝国在五十年代面临的经济危机相当。因此，企业表示，他们简直无法支持长期的战争努力，并在全球化经济中与其他超级大国的经济附属品竞争，无论德国是否在军事上击败俄罗斯入侵。\n\n企业已经得出一个结论，与俄罗斯的长期战争不仅在经济上无法持续支撑德国的长期发展，而且可能进一步升级为绝望的手段，例如广泛使用核武器来赢得决定性的战争。尽管我们政府中的一些人对这些观点持高度不同意见，并指责企业和我们政府的一些成员胆怯和背叛，但俄罗斯的坚韧和决心不能轻视，尤其是战争造成的破坏性进展。如果不能建立一个决定性的解决方案，我们的帝国可能会走上经济危机的道路；甚至更糟。"
 decswrw.25.a: "天哪，又来？"
 decswrw.26.t: "俄罗斯同意支付赔款"
 decswrw.26.desc: "斯拉夫人同意支付战争赔款！\n\n这将为莫斯科专员辖区提供迫切需要的帮助，因为他们不仅将支付对我们正当领土造成的损害，而且还将给他们破败的国家再也不敢尝试类似行动以致命一击。这真正展示了我们的种族优越性。\n\n当和平降临世界时，许多德国人都在想：这一切值得吗？我们要为在[RUSGetUniqueNamePlain]西部浪费的数百万生命负责吗？无论如何，现在都不重要。庆祝的时刻已经到来，因为帝国刚刚赢得了又一次伟大的胜利，这是我们迫切需要的胜利。在内战和石油危机的阴影下，我们国家的未来看起来黯淡无光。但是，这个胜利将重新统一我们作为一个民族的国家。"
 decswrw.26.a: "无敌！"
 decswrw.27.t: "俄罗斯拒绝支付赔款"
 decswrw.27.desc: "我们的政府感到难以置信。俄罗斯人拒绝了我们要求战争赔款的要求，这似乎是最后的抵抗迹象。我们对他们为何选择这样一种无益的举动感到困惑，这使我们国家之间的和平更加紧张，并且伤害了我们新领土内的俄罗斯民众，而为了什么？\n\n然而，由于我们没有足够的资金来重建俄罗斯，我们似乎必须稍稍牺牲一些来支付损失，以及我们所获得的任何领土。然而，德国人并不在意。他们已经对与俄罗斯的战争以胜利告终感到非常满意。而且，一些稳定正在开始回归帝国，这是好事即将到来的明确迹象。\n\n我们可能没有得到他们的钱，但我们赢得了这场战争。我们是欧洲无可争议的主宰，无论他们做什么都无法阻止我们。千年帝国将从这场战争中毫发无损地崛起，世界只能敬畏地凝视！"
 decswrw.27.a: "巨人不关心老鼠的事情。"
 decswrw.28.t: "德国同意支付赔款"
 decswrw.28.desc: "德国狗们已经同意支付战争赔款！\n\n通过屈服和向我们低头，他们将遭受千刀万剐的死亡开始了，随着赔款的到来，德国的商业将逐渐开始停滞。我们将榨干纳粹分子，让他们噎在自己失败的果实中！\n\n如今的俄罗斯人民将再次焕发活力，因为这真正标志着世界未来的一个转折点。明日的历史书将讲述德国人的缓慢衰落和俄罗斯人的迅猛崛起，我们在阳光下的位置几乎已经确定。\n\n新时代的来临，某些人不可避免地会持怀疑态度，但大多数人将再次敢于梦想，怀抱对未来的新希望和所带来的一切。"
 decswrw.28.a: "为了更光明的未来！"
 decswrw.29.t: "德国拒绝支付赔款"
 decswrw.29.desc: "即使在那场羞辱性的失败之后，德国人还敢违抗他们的新主人吗？在全世界的注视下，他们辉煌的国防军被一点一点撕裂，他们仍然认为自己是欧洲的主宰吗？\n\n他们是自杀式的，还是真的相信在失去了那么多领土之后，他们仍然有能力反抗我们？难道我们没有夺取足够多的领土，使他们放弃那些肮脏之物吗？如果没有，我们对让更多的德国人流血，以使他们变得更加顺从，也不会有什么损害。"
 decswrw.29.a: "也许我们需要采取进一步行动……"
 decswrw.30.t: "美国提供红十字会帮助"
 decswrw.30.desc: "第二次西俄战争每天都变得更加残酷、更加致命。那些少量传来的消息总是关于人类生命的毁灭和亵渎。我们曾誓言要保护的公民、平民，不可避免地被卷入这场像船被吸入漩涡的屠杀中。我们的士兵接受了训练，有着武器，但是年轻的母亲或者天真的婴儿对于炮火来说毫无防御能力。\n\n美国国务院今天向我们提出了一个引人注目的建议。他们的“红十字会”，一个旨在提供灾难救援和医疗援助的非政府组织，自愿前往前线。他们打算通过重新安置和医疗援助来帮助我们的公民，但也会有限度地关注受伤和精神创伤的士兵。然而，如果我们允许美国人进入前线，我们可能会被迫以更加友好的方式与敌人接触。为了维护我们的国际形象，某些可以说是“有创造性”的战术可能会被搁置。"
 decswrw.30.a: "确保人民的生命是首要任务。立即请来红十字会。"
 decswrw.30.b: "在通往胜利的道路上，我们不能分心。拒绝美国的提议。"
 decswrw.31.t: "仁慈的使命"
 decswrw.31.desc: "第二次西俄战争日益残酷，更加致命。从前线传来的消息寥寥无几，无一例外都是有关人类生命的毁灭和亵渎。不论总统的偏好如何，我们的政府除了能提供一点微薄的物质支援外，别无他法，只能为我们的盟友的安全祈祷。\n\n然而，并非所有人都像我们一样被官僚主义和舆论所束缚。美国红十字会已经向国务院提出请求，希望获得许可和安全通行到西俄罗斯前线。他们打算为冲突双方提供援助和支持，主要通过撤离和医疗援助来帮助平民人口，但也会有限度地提供给受伤和受到战争创伤的士兵的医疗帮助。如果我们支持这一努力，我们并不是在偏袒大日耳曼国或俄罗斯政府，而是努力减少无辜者的苦难，降低冲突的紧张程度。或许这甚至可以成为争取和平的契机。"
 decswrw.31.a: "“给我接通日耳曼尼亚，快点！在我被发现之前，想办法联系俄国人。”"
 decswrw.32.t: "俄罗斯接受援助"
 decswrw.32.desc: "真是个好消息，主任。我们在俄罗斯政府的联系人表示，红十字会志愿者将在一周内被允许进入俄罗斯领土。我们已经准备好一支航空队，将他们安全地转移至西伯利亚。然后，他们将乘火车前往前线。我冒昧地征用了几批医疗物资，作为红十字会的贡献，并配备了几个隐藏的GPS设备。如果志愿者出现问题，我们将准确知道事件发生地点。\n\n根据我们与您共享的大纲，行动代号：“包抄”将于05:30开始，大约在志愿者降落后两个小时。特工将在叶卡捷琳堡、车里雅宾斯克、马格尼托哥尔斯克、萨马拉和戈尔基与志愿者分开。他们的主要目标是评估俄罗斯政府的稳定性和俄罗斯在战争中获胜的可能性。次要目标是评估俄罗斯政府在俄罗斯获胜后与OFN结盟的可能性，确定适合建设防御设施和美国投资的地点，并在俄罗斯人证明不合作时与持不同政见的团体建立关系。红十字会志愿者的安全被确定为第三优先目标，在完成全面情报分析之前不会优先考虑。"
 decswrw.32.a: "谢谢你，中尉。可以解散了。"
 decswrw.33.t: "俄罗斯拒绝援助"
 decswrw.33.desc: "是的，总统先生，我这里有您的行程安排。早上9:30和巴西总统有一场会议，11:30您将与参议院多数党领袖进行讨论，内容是扩大国家气象局的事务，而中午12:30您将与一个名为\"关心基督教母亲\"的团体进行工作午餐会面。哦，别担心，他们不是很重要。只要微笑点头，我们就会毫不费力地处理他们。\n\n是的，先生，我可以给厨房打个电话。\n\n第一夫人要求您对访问意大利的事宜做出决定。是的，先生，我知道您的妻子对杰克和汤米的安全有所顾虑。自从维罗纳事件以来，发生了那么多事情，我也会担心把我的孩子们送去那里。我们最不希望看到的就是您的孩子们被某个恐怖组织绑架。不，我不认为那有可能发生。是的，中央情报局- 是的，先生。是的，我明白。谢谢您，先生。\n\n在您离开之前，国务卿让我告知您俄罗斯政府拒绝了红十字会志愿者的提议。是的，先生，我同意这很奇怪。我们从字里行间看出来，他们军方中似乎有一些不完全信任我们的成分。有关\"行动安全\"之类的事情。"
 decswrw.33.a: "“好吧，真可惜。我们去谈谈龙虾吧。”"
 decswrw.34.t: "德国接受援助"
 decswrw.34.desc: "嘿，国务院没有人预料到这一点，但德国人已经决定允许红十字会进入帝国战争机器。我敢肯定那些嬉皮士们会为自己感到相当自豪。而且，他们甚至可能为平民做些好事。但能做最多好事的是我们派遣到红十字会队列中的中情局人员。很快，我们将获得有关陆军的可操作情报，包括战斗计划、装备规格，甚至是他们对新政权的忠诚度的一种衡量。德国的形势已经颠倒了，如果我们有机会阻止另一个海德里希试图争夺领导权，那么这是我们必须抓住的机会。此外，谁知道呢，也许有一天我们会有机会推翻帝国权力结构，彻底粉碎纳粹分子。\n\n顺便说一句，这次谈话不能外泄。局长决定这是个必须知情的行动。总统不需要知道。"
 decswrw.34.a: "明白"
 decswrw.35.t: "德国拒绝援助"
 decswrw.35.desc: "致：国务院人员\n\n自：帝国外交部\n\n涉及：红十字会进入大日耳曼国事宜\n\n在经过一番严格审查程序后，我们对红十字会人员计划进入大日耳曼国以及参与俄罗斯侵略战线的提议存在被不良分子破坏的担忧。我们并未被告知红十字会主席杰罗姆·荷兰德是个黑人。我们也对计划中志愿组织中亚洲人、黑人、犹太人等的存在感到担忧。我们一再强调志愿组织的成员必须是日耳曼血统（英国人、法国人和其他有关族群是可以接受的）。\n\n在未能获得志愿组织诚信保证的情况下，我们请求将此问题延后审议。在六个月后，当俄罗斯侵略已经平息时，我们将邀请贵国总统以及大日本帝国首相参加有关东欧平民保护的会议。届时可以诚意讨论红十字会志愿计划的实施问题。\n\n--信件结束--"
 decswrw.35.a: "建立在偏见之上的意见总是以极大的暴力来维持。"
 ctswrw.1.t: "圣诞节休战"
 ctswrw.1.desc: "没有人知道它是如何开始的。没有人知道它为何开始。没有人知道是德国人还是俄罗斯人先放下武器。但无论谁应该负责，有一件事是清楚的：莫斯科前线已经陷入了寂静。\n\n国旗被遗忘在雪地中。计划中的进攻被取消或者暂时延迟。本应用于谋杀的弹药被泥浆堵塞，被遗忘在喧闹的庆祝中。士兵们暂时找到了和平。\n\n随处可见临时聚集的群众，用俄语和德语进行着仪式。当地的牧师和军队的牧师都祝福了供应的口粮，以供圣礼。其他人则在伤员之间穿梭，为病人涂抹药膏，为伤员祈祷。尽管他们的食物很少，许多士兵组织了宴会，与敌人一同分享。\n\n至少在今天，战争被遗忘了。莫斯科充满了欢呼和嬉笑声，而不是枪声。这一天将充满饮酒、歌唱和足球比赛。夜晚将是安全的。哨兵们将在数月来首次得到休息。只要这场临时停战持续下去，不会有突袭、轰炸或迫击炮的射击声。"
 ctswrw.1.a: "许多人已着手对这些事情起草一份报告……"
