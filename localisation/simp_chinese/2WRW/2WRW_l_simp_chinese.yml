 crisisswrw.1.t: "右舷"
 crisisswrw.1.desc: "约斯坦·克里斯蒂安森船长微微一笑，凝视着尼约德号的船头。波罗的海冲浪的白沫填满了他的心灵，淹没了他的忧虑，把他的希望带到宁静的海岸。海盐的香气和他那杯黑咖啡的恶臭弥漫在他的鼻腔中；远处，海鸥在爱沙尼亚海岸上飞翔时尖叫着。东方领！现在是东方领了，大日耳曼国的一个繁荣的部分。就像他自己的国家一样。\n\n约斯坦的微笑黯淡下去。他努力不去想挪威的命运。实际上，这不是他的位置。他只是一名商船船长。该死，他甚至没有自己的船。约斯坦只是机器中的一个齿轮，无数个斯堪的纳维亚人之一，他们靠运送IG法本集团的医疗产品在整个欧洲谋生。但是当他的思绪飘向他的祖国时，他不禁感到绝望。德国已经把她的爪子深深插入了挪威的肉体，不仅在政治上如此，经济上也是如此。如果他的人民不完全依赖德国人，他们很快也会依赖他们。\n\n那之后会发生什么呢？哈德拉德的子民会再次自由吗？他们会像捷克一样被吞并进第三帝国吗？还是他们会变成无意识的附属国，像荷兰一样？必须有更好的未来。必须有一个更美好的未来给他的孩子和他的人民。\n\n\"对不起，船长？\"\n\n约斯坦从遐想中退回。\"水手彼得森。有什么可以帮助你的？\"\n\n\"副船长约翰森要我告诉您，疫苗已按照您的指示保证安全了。\"\n\n\"谢谢。还有旗帜吗？\"\n\n\"我们升起了巴拿马国旗，先生。[RUS.GetAdjective]人应该会看到我们不是参战者。\"彼得森说。\n\n\"太好了，我们应该能到港口——\"\n\n接着爆炸发生了。\n\n彼得森和约斯坦船长被猛烈的力量摔倒在甲板上。约斯坦重新站起身来时，他看到黑烟从尼约德号受伤的一侧滚滚而起。船只发出痛苦的呻吟声，开始倾斜。\n\n\"天啊，我们刚撞上了一颗水雷！\"约斯坦说道。"
 crisisswrw.1.a: "“所有人，立刻弃船！”"
 crisisswrw.2.t: "复仇"
 crisisswrw.2.desc: "没人料到俄罗斯人会搞得这么糟糕。他们摧毁了一艘悬挂中立国旗帜、装载医疗物资的商船？你会认为这帮混蛋是想输掉这场战争。但接下来的步骤必须小心翼翼地、谨慎地执行。在战争中，社会的每个方面都是要争取胜利的战线。通过这次运动，我们将永远赢得国内战线，甚至可能赢得国际舆论的支持。毕竟，俄罗斯人难道不是这场战争的侵略者吗？看，他们正在向无辜的平民开火！那些讨厌的俄罗斯人难道不应该找到一种体面、职业和负责任的方式来打这场战争吗？即使是堕落的自由主义者也必须明白这一点。而且很快，海外的叙述将被吞噬，讨论俄罗斯的行为和目标。\n\n首先，我们需要让我们的不满得到公众的关注。谁是受害方呢？IG法本集团，这是一家由我们公民组成并拥有的公司。挪威，我们亲爱的盟友和宠爱的弟弟。还有巴拿马政府——毕竟，从技术上讲，那艘被俄罗斯人沉没的船属于他们。我们将向这些俄罗斯野蛮人提出一系列要求。首先，公开道歉。然后，给每个人提供经济赔偿。为巴拿马人提供赔偿。为伤者和死者的家属提供赔偿。为IG法本集团和那些本应该接种疫苗的定居者提供赔偿。如果其中一部分钱能从我们公民手中流入我们的手中...\n\n嗯，当我们这么做时，那就是税收。"
 crisisswrw.2.a: "那些可怜的水手！"
 crisisswrw.3.t: "德国要求补偿"
 crisisswrw.3.desc: "\"嗯，我没有好消息要告诉你，\"安雅·弗拉基米罗芙娜说道。她在[RUS.GetAdjective]外交部的上级，弗拉登·古林，没有回应。相反，他伸手拿起放在桌上的牛顿摆，拿起其中一个微小的银色球体，然后松手。这颗小小的大理石撞击着它的邻居，它们一起敲击，敲击，敲击着分过去的几分钟。\n\n\"先生？\"安雅终于问道。\n\n古林在他的皮椅上移动了一下。\"你可以继续说，\"他喃喃道，目光始终未离开摆。\n\n\"过去十二个小时里，我们收到了五个来自巴拿马人的传输，要求我们解释为什么我们把这艘尼约德号和她的一半船员炸上了天。挪威人已经把死去船员的遗孀们派遣到全欧洲进行媒体宣传。这不仅仅是一个团结协定的宣传推动 - 他们在意大利、英国、土耳其和伊比利亚获得了播出时间。其中一个甚至将出现在美国的一个午夜脱口秀节目中。此外...先生，你在听吗？\"\n\n古林的目光从摆到了安雅身上。突然间，她感到自己非常渺小。\n\n\"他们想要什么？\" 他问道。\n\n安雅吞了一口口水，继续说道：\"第三帝国外交部要求我们支付2亿帝国马克，分发给巴拿马、挪威的遗孀们、IG法本集团，以及东部地区的一群德国公民，具体人数未指明。\"\n\n\"有趣，\"他说道。\"当然，支付给IG法本集团的款项将会被洗钱给德国国防军。但我们愿意为了购买舆论而付出多少现金呢？这是一次有趣的政治计算。\"\n\n\"我们需要国际舆论站在我们这边，\"安雅说道。\n\n\"我怀疑国际舆论是否能为那些被[RUS.GetAdjective]金钱购买的子弹杀死的士兵提供安慰，\"古林说道。\"但是，你不一定是错的，安雅·弗拉基米罗芙娜。\""
 crisisswrw.3.a: "“我们需要避免一场国际危机。我建议我们付款。”"
 crisisswrw.3.b: "“无论如何，我建议不要武装我们的敌人。”"
 crisisswrw.4.t: "难题"
 crisisswrw.4.desc: "\"不，这远远不够！\"阿尔维德·安德里森大声喊道。\"我们的公民被谋杀了，你希望我们接受这么一点点的钱吗？你知道这是为了补偿那些寡妇的，对吧？\"\n\n帝国外交部的柯特·福克斯强忍住不叹气。与安德里森大使的这次会面无疑是令人失望、沮丧而嘈杂的。他本应该在塔希提度假，而不是与一个吵吵嚷嚷的傻瓜争论。他想念海滩，想念妻子，也想念他现在本该喝的莫吉托鸡尾酒！\n\n\"大使，我理解你的想法，\" 福克斯说道，\"但我们在这些谈判中走的是一条非常脆弱的绳索。你必须明白，我们正在与一个敌对势力进行战争。我很惊讶他们甚至同意支付这个数额。\"\n\n\"我不在乎！在这些谈判中，我唯一的责任就是确保挪威公民的福祉。这点微不足道的金额甚至都不够支付水手们的葬礼费用，\" 安德里森说道。\n\n\"好吧，大使，我不知道该告诉你什么，\" 他耸了耸肩膀说道。\"这就是我们所拥有的。如果这还不够，也许我们在挪威的兄弟愿意增加供寡妇们使用的资金？\"\n\n\"或许我们在德国的兄弟们可以提供比俄罗斯赔偿金的十分之一更多的资金，\"安德里森说道。\n\n\"那些资金是用来补偿我们在东方领的公民的，\" 福克斯说道，\"它们是不能动的。\"\n\n\"福克斯，我们都知道那些钱最终会被重新路由到帝国国防部，无论如何，所以别给我一个关于那些可怜的毫无防御能力的退伍军人和他们可爱的哭闹婴儿的哭诉故事。想个办法给我们我们应得的钱，否则我会让你生不如死。\""
 crisisswrw.4.a: "“天哪，好吧，我们会重新分配一些纳税人的资金。”"
 crisisswrw.4.b: "“去他妈的，我们又可以靠俄国人了。”"
 crisisswrw.5.t: "国防税"
 crisisswrw.5.desc: "亲爱的俄罗斯外交部：\n\n来自第三帝国外交部：\n\n事关：商船尼约德号的毁灭，法律赔偿\n\n大日耳曼国已经审查了最初的和解提案，根据进一步提交的有关人员伤亡和各方损失的文件。除了原本的赔偿金额外，俄罗斯政府还必须提供价值2亿美元的帝国马克作为赔偿，以弥补情感痛苦、波罗的海贸易中断导致的收入损失，以及由于东方领殖民地疾病传播可能造成的经济损失。正如在之前的和解协议中所概述的，贵国政府必须向第三帝国提供这笔货币赔偿，然后根据19-A表格（见下文），将同意的金额分配给受害方。\n\n我们不需要提醒贵国政府，不遵守这些要求将会导致第三帝国及其组成部分采取惩罚行动。我们将我们的种族同胞的安全和欧洲的安全视为最高优先事项。如果贵国政府违背这两个优先事项中的任何一个，我们将采取严厉行动。履行对受害方的责任将在这场令人遗憾的冲突结束后，加深贵国人民与欧洲种族之间的关系。"
 crisisswrw.5.a: "“他们不能这样敲诈我们！拒绝他们。”"
 crisisswrw.5.b: "“我们没有选择，只能接受他们的要求。”"
 crisisswrw.6.t: "俄罗斯拒绝赔偿"
 crisisswrw.6.desc: "柯特·福克斯是德国外交部的一名工作人员，他坐下来开始晚餐时已经饿得不行了。他的妻子准备了一顿世纪盛宴——经过一周半时间浸泡在自己的汁液中的酸汤烤肉、撒有辣椒粉的金黄土豆沙拉、一份丰盛的酸菜以及正宗的巴伐利亚啤酒。当然，啤酒不是她自己做的，而是从杂货店买来的。但是，要穿过那些坚信他们的配给券比其他人更有价值的平民人群实在是太烦人了。\n\n“亲爱的克拉拉，”柯特说道，“这酸菜真是太臭了。”\n\n克拉拉笑了起来，她的阳光般的笑容照亮了整个干净的房间。“这样可以让邻居们远离一些。我想念你，柯特。”\n\n“我也想念你，我的甜心。这些星期工作真是地狱般的。”\n\n“我很抱歉，”她说。\n\n“没关系。毕竟只是我的工作而已。我只希望能有更多时间陪在你身边。”柯特说。\n\n克拉拉咬了一口土豆沙拉，思考了片刻。“也许，”她说，“既然你回家了，我们可以去那个一直推迟的黑森林之旅。”\n\n柯特笑了。“是的！当然，我们会把它变成一个周末的行程。”\n\n“我爱你，”克拉拉说。\n\n“我也爱……”\n\n厨房的电话响了起来，破坏了他们的宁静，就像热刀切割儿童的喉咙一样。\n\n“天啊，希望不是工作。”柯特说着接起了电话。“是谁？蒂尔？你为什么要给我打电话？哦，该死的，我才不在乎挪威大使拿枪指着你的头，你告诉他我正在和他妈的妻子吃饭。嗯，那他可以等一等！”\n\n柯特站起身来，在厨桌旁边踱步，将电话线拖过了地板上的油毡砖。“我知道，本来俄罗斯人是应该拒绝的。不要告诉他！我们已经在我办公室的保险箱里制定了联合排雷委员会的计划。你知道密码。把它呈给他，告诉他闭嘴。我会在星期二给他打电话。不，星期一我不在，如果他给我打电话，我会把他的头扯下来。”"
 crisisswrw.6.a: "“我的妻子和我正在他妈的休假，这就是原因。”"
 crisisswrw.7.t: "排雷提案"
 crisisswrw.7.desc: "“请进，卡拉什尼克女士。”弗拉登·古林说道。\n\n安雅·弗拉基米罗芙娜推开俄罗斯外交部最沉重、最冷的门，悄悄走进古林的办公室。一股寒冷的气流刺痛着她的皮肤，她浑身起了鸡皮疙瘩。\n“长官，我们刚刚收到来自第三帝国的另一份电报。”她说道。\n\n“先坐下吧，”古林说道，“然后我们可以开始分析情况。要薄荷糖吗？”\n\n“不用了，谢谢。”安雅说道。她慢慢地坐在古林冰冷的橡木办公桌对面，把自己藏在剪贴板后面。“第三帝国仍在要求我们赔偿尼约德号的毁灭。”\n\n“但你来这里并不是为了那个，对吗？”\n\n“不，不是的。”安雅说道。“不知何故，纳粹组织了一个国际排雷委员会。整个计划是专门为了确认并清除我们在波罗的海种下的海军威慑力量。他们的主席……你听说过亚历山大·马赫吗？”\n\n“我记得他的名字，”古林说道。“一个斯洛伐克的意大利风格法西斯教士。我很惊讶民族社会主义者还没有把他枪毙。”\n\n“马赫是整个委员会的主席。他要求我们确认每一个海雷的位置，包括白海的威慑力量。”\n\n“我觉得那是不可接受的，”古林说道。“多么幼稚、愚蠢的要求。德国人一定希望我们拒绝。他们到底准备了什么样的武器？”\n\n安雅在座位上不安地移动着。“据说……”\n\n“据说？”\n\n“是的，据说。据说，他们已经在包括阿扎德·欣德、阿根廷、挪威和西班牙在内的六个中立国家对我们实施了贸易制裁和谴责。他们可能在虚张声势，但我认为这不是我们能冒的风险，”安雅说道。\n\n“我会做出决定的，”古林说道。“别越界，卡拉什尼克女士。我可不想再找一个小辈。”"
 crisisswrw.7.a: "“他们在虚张声势。我怀疑他们是否有采取这种行动的外交影响力。”"
 crisisswrw.7.b: "“我们不应该落入他们的圈套。我建议我们交出资料。”"
 crisisswrw.8.t: "升级"
 crisisswrw.8.desc: "“是的，先生，我明白了。谢谢你，先生，”柯特·福克斯说。\n\n“等等，他在说什么？”安德里森大使吐了口唾沫。柯特竖起一根手指，让他的对手安静下来。 “是的，先生，我会立即通知挪威大使，”柯特说。 “希特勒万岁！”\n\n他挂断电话，转身面对安德里森，脸上挂着笑容。 “对此感到抱歉。我知道我应该使用新的敬礼方式，但我是一个有传统的人。那些日子就是这样，我的朋友！”\n\n安德里森困惑地摇了摇头。 “福克斯先生，我不担心你的敬礼！赔款呢？俄罗斯人接受了吗？”\n\n“哦，不，他们断然拒绝了，”柯特说。 “他们还拒绝向排雷委员会发送有关其海军水雷位置的数据。为了他们的战争，他们似乎很乐意将更多的公民送往波罗的海深处。”\n\n“混蛋，”安德里森咒骂道。\n\n“更可惜，”柯特说。 “我一直想参观莫斯科。有人告诉我，圣彼得大教堂很漂亮，而且克拉拉对中世纪建筑充满热情。”\n\n柯特从办公桌前站起来，拿起黑咖啡，朝办公室窗外瞥了一眼。停车场里，两名服务员在打架。多么粗鲁。\n\n“阿尔维德，我的朋友，帝国的手被绑住了。我们已经尽我们所能地推动了这件事，”柯特说。 “我不能说我对这一切的结局感到满意。”\n\n“你是什么意思？”安德里森喊道。 “俄罗斯人正在扼杀整个波罗的海的贸易。你们自己的公民正在挨饿——更不用说我们的了！你们打算怎么办？”\n\n“没什么，”柯特说。 “帝国对[RUS.GetAdjective]没有影响力，至少在我们赢得这场战争之前是这样。我们根本无法确定这些地雷的藏身之处。”\n\n安德里森从椅子上站起来，气得满脸通红。 “这是不可接受的，”他咕哝道。\n\n“那你还有别的办法吗？”柯特问道。\n\n安德里森举手准备击打德国人。拳头还未收拢，一个念头就如同一道闪电从天而降。"
 crisisswrw.8.a: "“其实，我还有别的办法。”"
 crisisswrw.9.t: "出黑手"
 crisisswrw.9.desc: "伊万·彼得罗夫是俄罗斯外交部的一名看门人。回归后一直在环卫处工作。在此之前，他在高尔基的一家兵工厂工作，在此之前他是卡卢加郊外的一名农民。伊万入职以来先后3次上班迟到，从未有过不合格的绩效考核。平时，他都是在食堂吃午饭，今天却决定去公园吃。当他吃完黑麦意大利腊肠时，他把三明治的废纸包装纸揉成一团，扔进了公共垃圾桶。\n\n弗拉迪姆·尼基廷是个垃圾工。他在首都工作了20年，经历过不同的政权和政府。俄罗斯安全部门认为他在政治上完全中立，不值得进一步调查。有一次，他酒后驾车撞了车。他被判处四个星期的社区服务；自那次事件以来，他从未触犯过法律。通常，他在周四的14:00-20:00轮班工作。本周他要求在8:00-4:00轮班工作，该班次始终包括城市的公园。\n\n列昂尼德·奥尔洛夫是一名卡车司机。他走遍从阿尔汉格尔斯克到萨马拉的路线，运输从俄罗斯境外进口的货物和食品。他以懒鬼着称，但还不够值得更换。他在喀山有妻子和四个孩子。他在科特拉斯也有一个女朋友。他今天停下来取运运往芬兰的容量瓶、卫生纸和色情杂志。他的平均停留时间是45分钟；今天，他的卡车空转了12分34秒。\n\n拉斯穆斯·耶尔维宁是一名芬兰边防警卫。他在冬季战争中服役，对新的俄罗斯政权不感兴趣。他的家、他的家庭和他的国家对他来说比生命本身更重要。作为高级检查员，拉斯穆斯有权下令搜查任何从俄罗斯运往芬兰的车辆。他有一个私人规则，可以搜索任何超过四个轮子的卡车。今天，当列昂尼德·奥尔洛夫的十二轮卡车越过边境时，拉斯穆斯命令他的部下让他通过。\n\n阿尔维德·安德里森是挪威驻德国大使。今天，他接听了来自他的政府派往芬兰北部的伞兵部队的加密电话。"
 crisisswrw.9.a: "“是的，我是安德里森大使。你知道地雷的位置吗？”"
 crisisswrw.10.t: "逼不得已的举动"
 crisisswrw.10.desc: "\"马e4，吃兵。你为什么让我白吃一个子？\" 安雅说。\n\n古林笑了——一个病态的、粘稠的笑容在他的脸上蠕动，就像蛆虫穿过烂土豆一样。\"卡拉什尼克女士，要想下好棋，你必须预见到对手的进攻计划。马吃f7兵。还请注意c4的象。王f7是犯规的一步。\"\n\n\"好吧，兵d5。有c6兵保护。\"\n\n\"马吃h8车。\"\n\n\"兵c4，吃象。\"\n\n\"马d2。古林说：\"我向你保证，这一变招将使白方获得压倒性优势。\"籍此，我们可以看出一条铁律。适度的牺牲来迫使你的敌人遭受更大的痛苦。这一思路在国际象棋和地缘政治中都是成立的。\"\n\n古林从棋盘边站起来，走到他的办公桌前，他拿起了一个被纸撑开的马尼拉纸制文件夹。他抽出最上面的一张，放在安雅的手中。\n\n\"如果你要继续做我的后辈，\"古林说，\"我必须知道你有正确的直觉来处理这类战事。这不会是强加给我们祖国的最后一次，甚至也不会是这场战争中的最后一次。\"\n\n他在安雅对面坐下，就像屠夫盯着新生的牛犊一样盯着她。\"挪威人已经得到了我们在波罗的海的海军威慑力量的所在地。我相信这是最令人遗憾的进展。一支小型民工船队正在前往爱沙尼亚海岸去拆除我们的防卫。他们将于明天8点到达。现在，问题来了。\"\n\n他坚定地，抬起身子直视安雅的眼睛。\"国防部希望逮捕排雷人员。一个合乎逻辑的决定，以防止海军对我们的侧翼进行入侵。经济部希望让他们拆，为的是维持国际关系。我们的情报估计这些人里有78%是挪威公民。\"\n\n古林靠向安雅，如此之近，她可以闻到他的呼吸。\"我们是逮捕他们，冒着刺激挪威人做出反应的风险？还是让我们的人民暴露给入侵和，可能有的，奴役？\""
 crisisswrw.10.a: "吃兵。"
 crisisswrw.10.b: "放过去吧。"
 crisisswrw.11.t: "斯坦福"
 crisisswrw.11.desc: "柯特·福克斯打开了午饭盒，迫不及待地想知道克拉拉给他准备了什么午餐。也许是一个煮鸡蛋，或者是一份牛排三明治？实际上，一颗烤土豆现在真的会让他的胃感到舒服……\n\n办公室的门砰地一声被猛然推开。\"他们这次过分了！\"安德里森大使尖叫道：\"俄罗斯海军截击并逮捕了我们派去波罗的海的人。那些我们派去消除杀害我们公民的海军水雷的人！他们太过分了，太过分了，太太太过分了！\"\n\n柯特从桌子前站起身，嘴角勾起一丝微笑。他强迫自己表现出担忧的样子，对挪威的对手说：\"你在说什么，阿尔维德？\" \n\n阿尔维德用尽全力大喊：\"挪威政府将与我们的德国兄弟站在一起！诛杀俄罗斯野蛮人！诛杀所有凶手！\""
 crisisswrw.11.a: "一切按计划进行"
 crisisswrw.11.b: "我们早就该料到会这样"
 crisisswrw.12.t: "最后的胜利"
 crisisswrw.12.desc: "德国军情局特工的脸上没有表情，他说道：“战局对我们来说并不利。”\n\n舒尔茨部长助理握紧并松开拳头，伸展他那身穿完美西装下健壮的肌肉。他办公桌上方的吊扇发出嗡嗡声，勉强摆动着，几乎不能驱散干燥的空气。他说：“别想你能把责任都推到外交部头上。我们已经在芬兰、罗马尼亚、挪威和其他每一个该死的欧洲角落奔走，争取支持这场混乱。德国陆军浪费了我们给予的一切。我们已经尽了一切努力——”\n\n“不是一切。”军情局特工笑得像只蜥蜴。“你还没有将英国卷入战争。”\n\n“英国不是个专员辖区，也不是我们可以威逼着攻击俄罗斯的一块肮脏土地，”舒尔茨说。“他们是半个雅利安人，是团结协定的平等成员。”\n\n“这更是将他们卷入战争的理由。他们的军队强大，经过与抵抗组织和苏格兰人的战斗锻炼。他们也许能扭转战局。”\n\n“而且这会让那些陆军混蛋失面子。”舒尔茨向后靠在椅子上。“我们已经与伦敦进行过谈判。他们一直拖延，试图让我的人陷入红线束缚。如果军情局和外交部要在这件事上合作，我们需要一个计划。”\n\n“不仅仅是我们。”军情局特工用手指点了下鼻子。“军需部也要参与进来。我们已经有了一个计划。我们需要的只是你的信任，以及某个……某个你不会想念的人。一个嘴巴大、或者懒散的人。”\n\n舒尔茨笑得像只狼。"
 crisisswrw.12.a: "\"我正好认识这样一个人。"
 crisisswrw.13.t: "我们即将开始下降"
 crisisswrw.13.desc: "柯特·福克斯调整了他的万字符袖扣。外面，商用飞机的螺旋桨嗡嗡作响，划破稀薄的大气层。小屋很酷，但陈旧。这是一次愉快的旅行；福克斯从日耳曼尼亚直飞伦敦，大约三个小时的行程，短暂的小睡缩短到一个小时。幸运的是，俄罗斯空军并未在总政府以西行动。然而。\n\n他把手伸进公文包，整理了一下文件。他的命令很简单，就这一次。没有好战的挪威大使。没有被绑架的商人。没有胡思乱想、疯狂的科学计划或不可能的阴谋。他所要做的就是提醒英国外交部注意他们的军事义务——以及大日耳曼国垮台时的经济后果。\n\n福克斯畏缩了一下。天哪，想到帝国会垮台，克拉拉会处于危险之中——这太过分了。在他们经历了一切之后——\n\n“先生？”一位穿着粉蓝色制服的丰满空姐拍了拍他的肩膀。 “我们很快就会降落在伦敦。请收起你的小桌板。”\n\n“当然！”福克斯对她微笑，露出烤瓷牙和有力的下颚线。 “我可不想让你这样的美女失望。”\n\n她咯咯笑了起来。 “你是出差还是旅游？”\n\n“两者都有。在唐宁街开了几次会。政府公务，绝对保密。”他冲她笑了笑。 “但我答应过我的妻子，我会拍几张威斯敏斯特教堂的照片。”\n\n“好吧，也许我可以带你看看其他一些值得一看的地方，怎么称呼您？”\n\n“福克斯，亲爱的。跟我一起看降落。这是我最喜欢的部分。”空姐坐在他旁边的座位上。他们一起看着飞机在空中盘旋。一万二千，一万，八……当飞机向下方很远的跑道倾斜时，他们感到胃口在下沉。六千、四千、二……城市开始映入眼帘。福克斯可以看到一切。首先是表示社区的颜色斑点，然后是建筑物的轮廓，然后是汽车和个人。起落架放下，他们优雅地停在跑道上。\n\n接着，藏在行李箱里的炸弹爆炸了，一切都着火了。"
 crisisswrw.13.a: "等等，什么？"
 crisisswrw.14.t: "怀疑"
 crisisswrw.14.desc: "柯特被电话铃声吵醒。他的眼睛像生锈的百叶窗一样睁开，仍然被粘在一起的眼屎和疲惫让他费力地伸手过去接过床边的电话。外交官拿起电话，尽可能地生气地回答道：“什么样的白痴在三点钟给人打电话啊？”\n\n“柯特，是我，”电话那头传来他的助手蒂尔的声音。“我有一项任务要交给你。直接来自最高层。”\n\n“滚开，这件事明早再说不行吗？”\n\n蒂尔紧张地笑了起来。“你知道他们是怎样的，库尔特。一切都要现在，现在，现在！”他清了清嗓子。“啊，让舒尔茨部长说他希望你马上回到日耳曼尼亚进行简报。”\n\n柯特挑了挑眉。“蒂尔，我甚至还没来得及和英国外交部交流呢。派我出去，差点让我送命，然后几天后又要我回去，这有什么意义呢？”\n\n“他只说你的任务失败了，库尔特。”\n\n“这毫无道理！我甚至还没...”库尔特的声音渐渐低下来，意识开始浮现在他脑海中。“蒂尔，我会给你回电话的。告诉舒尔茨我会坐首班飞机离开伦敦。”\n\n外交官没有再多说一句就挂断了电话。柯特摇了摇头，努力压抑住咒骂的冲动，拨通了一个新的号码。"
 crisisswrw.14.a: "\"给我接通阿尔伯特堤85号。\""
 crisisswrw.15.t: "以及指控"
 crisisswrw.15.desc: "“不是俄国人。是德国干的。”柯特仍然躺在床上，医院的长袍不舒服地披在肩上。接到蒂尔的电话后，他一直无法入睡；相反，他醒着坐着，因腿痛而畏缩，准备他现在正在背诵的证词。在他的床尾，一位身材瘦长、金发碧眼的年轻军情五处特工在胸前口袋的笔记本上记下了他的话。\n\n英国特工托马斯·惠特尼面无表情。 “你有什么证据支持这一指控，福克斯先生？”\n\n柯特挺起身子，畏缩了一下。 “抱歉。你看，我被派到这里是为了会见你的上级，试图说服他们参战。但我在这里着陆，我的半个屁股都被炸掉了，现在他们要我回去？他们需要英国加入这场战争，汤姆——”\n\n“惠特尼先生，请。”\n\n“——惠特尼先生。他们需要英国在犹太-布尔什维克踢我们屁股之前加入战争。”柯特摇摇头。 “我在德国失宠了，惠特尼先生。反间谍机关一直在我家四处搜查，想方设法给我定罪。”\n\n年轻人扶了扶眼镜。 “他们有没有发现什么？”\n\n柯特的脑海里闪过那些照片，想到了反间谍机关特工勒索他时的餐厅肉柜。 “不，没什么，”他说。 “但我不认为我是被派来谈判的。我认为我是被派来送死的。”\n\n惠特尼的石膏面具后面有什么东西发生了变化。他不自觉地皱起了眉头；一个鬼脸像一阵烟雾一样在他脸上出现又消失。 “继续。”\n\n“爆炸是假旗袭击，我敢肯定，”柯特说。 “他们打算牺牲我和你们的公民，以激怒英国公众。为什么，想想看——一群妇女和儿童被斯拉夫的威胁从天空炸飞。他们会让你们的人民像西班牙人在斗牛！然后，他们得到了你的军队，我的国家还能再活几个月。”柯特躺在床上，筋疲力尽。 “请听我说。我们都处于可怕的危险之中。”\n\n惠特尼点点头，嘴唇微微颤抖。 “你明白吗，如果真的发生了，我们需要证据？”"
 crisisswrw.15.a: "“证据就在布丁里。而现在，布丁在日耳曼尼亚。”"
 crisisswrw.16.t: "转折点"
 crisisswrw.16.desc: "这是日耳曼尼亚的午夜。柯特摸索着走进勤政部长舒尔茨的办公室，他宽松的羊皮纸色大衣把水滴在地板上。 “现在，”他喃喃地说，“如果我是有罪的证据，我会在哪里？”他把手电筒塞进嘴里，开始寻找。冰凉的金属有硬币的味道，还有手汗的味道。\n\n舒尔茨的办公室里堆满了枪灰色的文件柜。每一面墙都被它们覆盖，每面墙上都装满了一半的文件。因此，经过数小时的搜索，柯特找到了他需要的文件，这真是一个奇迹。事实上，当他折回原位，将它们从休息的地方拉出来，扔到桌子上时，他几乎是用拇指从它们身边擦过。\n\n“去他妈的……” 这是外交部和军备部的公报，讨论的是给东线盟友分配军火的问题。在全面战争时期几乎不罕见。但是，在底部，隐藏在他几乎看不到的地方，是以下内容：\n\n“该部还要求在周五之前将一种塑料炸药——其吨位足以炸毁飞机机身——运送到日耳曼尼亚的反间谍机关办公室。只有值得信赖的人员才能被允许协助运送这个包裹。 “\n\n柯特开始小声地笑了起来。 “天啊，就是这个！”他举起报纸，给了它一个戏剧性的吻。 “天啊，我们有救了！”\n\n“免于什么，柯特？”福克斯脚后跟打转，心脏猛然狂跳。他的助手蒂尔站在门口，手里拿着左轮手枪，手指扣在扳机上，威胁着他吓呆了的“朋友”。安全人员准备好后退。 “反间谍机关截获了你在英格兰的电话，柯特。你知道我们在那里还有朋友。”直到咆哮。 “你怎么能背叛我们？背叛你的国家？在我们经历了一切之后！”\n\n柯特举起手向后退去。 “蒂尔，拜托。为什么不把枪放下，我们可以谈谈这个——”\n\n“我说完了！”直到举起了手枪。 “你总是谈论过去的美好时光，当希特勒掌权的时候。好吧，希特勒不会让像你这样的蛇腐蚀我们的国家。他会采取行动。”"
 crisisswrw.16.a: "开枪"
 crisisswrw.16.b: "犹豫"
 crisisswrw.17.t: "毫不犹豫"
 crisisswrw.17.desc: "蒂尔扣在扳机上的手指颤抖着。他颤抖着，额头上开始渗出汗珠。柯特看到了他的机会。\n\n“直到，拜托。你了解我，”他说。他的声音淡淡而平静，胸中却荡漾着惊恐的波涛。 “他们没有告诉你整个故事。”\n\n“我听够了！”蒂尔的声音里充满了恐慌和愤怒。 “绰绰有余。你把我们出卖给了英国人！”\n\n“直到，他们想杀了我！他们想让我死在那个飞机上！”\n\n“这不是舒尔茨告诉我的，”蒂尔说。 “他告诉我，他们设计了炸弹，这样你就能活下来。但即使你没能活下来——那又怎样？我们都应该为为我们的国家献出生命而感到自豪。克拉拉会得到照顾，柯特。我会照顾她的——”\n\n柯特躲到蒂尔手枪的枪口下，抓住他的手腕，将他扔在地上。枪从他手中掉落，就像握紧拳头的沙子。在他的朋友还没意识到发生了什么事之前，柯特抓起枪朝蒂尔的脑袋开了两枪。\n\n这是一个自动动作，真的。不是他计划好的。他在东方领的日子里遗留下来的原始冲动。但就在柯特跪倒在血泊中呕吐时，他曾经是他的助手、同事和朋友，这位外交官还是忍不住松了一口气。在他这些年所做的一切之后，他为德国送死的人数，还有多少人？至少，这个想法似乎合乎逻辑。\n\n柯特尽量不去理会人类粪便的恶臭。一旦他排空了胃，干呕了好几次，这位外交官就爬到舒尔茨的办公桌前。他站起身来，抓起证据，然后将其输入附近的传真机。\n\n几百英里外，在英格兰多岩石、暴风雨席卷的海滩上，军情五处拥有的一台传真机收到了他的信息。"
 crisisswrw.17.a: "他已经跑向出口了。"
 crisisswrw.18.t: "枪响了"
 crisisswrw.18.desc: "蒂尔没有犹豫。他朝柯特的胃开了一枪，炸掉了他的肋骨，将金属碎片塞进了他的肠子。痛苦在外交官的腹部蔓延开来，就像动物尸体上长出霉菌一样。柯特猛地向前冲去，眼中闪过杀气腾腾的怒火。 “你做了什么？”他喊道。他的皮鞋卡在了地毯的边缘，外交官最后一声愤怒的吼叫失去了平衡，他的头撞到了舒尔茨的桃花心木办公桌的边缘。\n\n影响是可怕的，也是最终的。柯特的头骨传来阵阵疼痛——光是摔倒就足以让他去医院了。他伸手去摸肚子上的伤口，却碰到了一个又热又湿的东西。外交官收回他的手，发现它在滴血。 “直到，你他妈的混蛋！”他喊道。 “看看你做了什么。”一阵剧痛将他的额叶切成丝带，他的愤怒化为绝望。他开始哭泣。\n\n蒂尔冲到他朋友身边，手里还拿着冒着烟的左轮手枪。愤怒、恐惧、悲伤、仇恨在他的脸上一闪而过。 “你也会这么做的，”他结结巴巴地说。 “如果是我就好了。”\n\n柯特痛得说不出话来。他的下巴咬得紧紧的，牙齿互相咬在一起，就像辛普勒加德的嘴巴一样。滚烫的泪水从他的鼻子里掉下来，流进了他的嘴里。\n\n“反间谍机关同意让克拉拉一个人呆着，”蒂尔说。他咳​​嗽了一声。 “物有所值。”\n\n柯特的血从他的衣服上滴下来，混在下面的地毯纤维里。房间开始变得朦胧、黑暗。非常黑暗。比他以前见过的任何黑暗都要黑暗。\n\n直到放下枪。 “我不得不这么做！”他喊道。 “为了国家。对于所有雅利安人，无处不在。我不知道这是怎么发生的，但犹太人引诱了你。他们勾引你！”他抓住柯特的衣领，开始摇晃他懒洋洋的脑袋。 “他们是怎么做到的，柯特？他们他妈的是怎么做到的？”\n\n远处，柯特·福克斯听到了一些奇怪的尖叫声。这些话是难以理解的。而且，坦率地说，这不再是他关心的问题。这是他的时间。他现在要回家了。"
 crisisswrw.18.a: "他要回家找他的克拉拉"
 crisisswrw.19.t: "爱来自日耳曼尼亚"
 crisisswrw.19.desc: "已经是凌晨一点了，托马斯·惠特尼还没有收到他急需的信息。会议谈判正在进行中，英国代表团仍在暗中操作。俄国人或德国人都是低声说谎的毒蛇。如果他能拿到一些文件……\n\n他听到身后开门的声音。他回头看了一眼，发现其中一位秘书芭芭拉拿着一个文件夹。他猛地从座位上站起来，这让她大吃一惊。 “惠特尼先生，你说你在等一些文件？”她拿出文件夹。托马斯从她手中夺过它，扔到桌子上，开始翻找里面的东西。 “完成后记得关灯，”她在让他继续工作之前补充道。\n\n“谢谢你，芭芭拉，”他喃喃地说。她的脚跟在他身后的声音越来越小。他开始将文件整理成一堆。这是直接来自德国外交部的。而这个来自反间谍机关特工。最后，有...\n\n当他看到表格顶部和底部的名字时，他停止了整理文件。从表面上看，它没有什么特别的。这是德国外交部和军备部之间的公报。所讨论的大部分武器将运往东部前线以对抗俄罗斯人。但位于文件底部的是重磅炸弹：\n\n“该部还要求在周五之前将一种塑料炸药——其吨位足以炸毁飞机机身——运送到日耳曼尼亚的反间谍机关办公室。只有值得信赖的人员才能被允许协助运送这个包裹。 “\n\n托马斯简直不敢相信。追寻了那么多线索，走遍了世界，他终于弄清了真相。他觉得自己的眼睛被泪水打湿了。他的思绪又一次回到了爆炸现场，以及散落在停机坪上的男人、女人和孩子们可怕的遗体。最后，他们会知道正义。"
 crisisswrw.19.a: "德国人会为他们的背叛行为付出代价"
 crisisswrw.20.t: "斯拉夫人都是骗子"
 crisisswrw.20.desc: "凌晨两点。托马斯·惠特尼仍未收到副部长福克斯任何消息。他轻轻敲打着钢笔，让思绪飘散。自然而然地，他的思绪飞回到他眼前闪现过无数次的场景：人们的尸体散落在停机坪上。他很幸运，不用告诉他们的亲人他们是如何死去的。然而，他有责任找出为什么无辜的英国公民会以如此毫无意义的方式被杀害。他们和整个英国国家都要求答案。\n\n福克斯为什么对他隐瞒真相？他似乎和托马斯一样迫切地想知道真相。但他回想起他们在福克斯躺在医院床上时的谈话。如果没有福克斯的证词，军情五处将永远不会去寻找证据来证明德国人策划了这次爆炸。而福克斯是这次灾难中唯一的幸存者。如果德国人策划了这次袭击，难道他们不希望他死在袭击中吗？一个英国公民的生还并不会损害他们所谓的计划，但偏偏在所有幸存者中，竟然只有福克斯。\n\n托马斯开始构想福克斯言辞的另一种解释。也许福克斯欠下了债务，或者有一些罪证细节被俄罗斯人用来威胁他。也许他们精心设计并放置炸弹，确切地安排在福克斯能够生还的位置。也许这整个调查——尽管德国宣称是俄罗斯轰炸了机场——只是为了让英国人迷失方向，拖延时间，让俄罗斯人赢得战争。\n\n他开始撰写报告。打字机的敲击声在秘密情报局的空荡房间中回荡。他不应该相信福克斯。他被那个叛徒的诡计欺骗，而现在俄罗斯人已经太长时间隐瞒真相。再也不能容忍了。全世界都将知道真相……"
 crisisswrw.20.a: "……以及斯拉夫人的背叛。"
 crisisswrw.21.t: "[Get_newspaper_header]伦敦危机结束"
 crisisswrw.21.desc: "英国公民松了口气。英格兰首相正式宣布，经过与俄罗斯的紧张外交会议，英国将不会参与欧洲战争。\n\n伦敦机场爆炸事件震惊了全世界，元首将其描述为又一起“斯拉夫-犹太-布尔什维克阴谋，旨在摧毁雅利安人”。许多人认为这样的创伤事件会激发英国人的报复欲望。然而，看来英国中立的精神并没有被打破。随着第二次西俄战争的继续，英国将继续坐在一旁，那个夜晚的幽灵将永远在停机坪上徘徊，寻找答案。"
 crisisswrw.21.a: "他们做出了正确的决定。"
 crisisswrw.21.b: "英国选择了自己的道路。现在必须走下去。"
 crisisswrw.22.t: "[Get_newspaper_header]英国加入第二次西俄战争"
 crisisswrw.22.desc: "展现对德国联盟的坚定承诺，英国政府正式宣布对[RUS.GetName]宣战。在可怕的伦敦机场爆炸事件中，数十名平民丧生，俄罗斯试图将死者的责任转嫁给其他方。然而，英国的调查揭示了涉及俄罗斯政府的证据。通过外交手段解决争端的尝试失败，英国别无选择，只能对那些谋杀他们同胞的人进行反击。\n\n虽然俄罗斯对英国的攻击的动机尚不清楚，但这场危机的影响已经显现。装备精良、供给充足、训练有素的英国士兵正在东欧加强防线，缓解疲惫不堪的德国步兵，并在维斯瓦河沿岸设立防御陈设。伦敦和日耳曼尼亚似乎比以往任何时候都更加接近。"
 crisisswrw.22.a: "光荣孤立到此为止了。"
 crisisswrw.23.t: "企业协同效应"
 crisisswrw.23.desc: "科斯特·霍夫曼恨不得没来巴库。整个地方都变成了地狱。街上爆发了一场骚乱，他办公室外的街道上乱成一团。他被派去管理的工人们甚至无法在去油田的路上走过，头上就会被一块砖砸中。通往城市的供应线被切断了——他的女佣已经几个月没能完成一次完整的杂货购物了。现在他听说俄罗斯军队可能只有几天就要到了。是时候离开了。\n\n他一边穿上运动外套一边大喊：“罗夫沙娜！他妈的那些混蛋最好给我的直升机加满油。”\n\n他的秘书以一个经验丰富的仆人的谨慎措辞回答道：“是的，霍夫曼先生，他们会在楼上的直升机停机坪准备好，十五分钟内。飞回罗马尼亚的航程不到十个小时。”\n\n“不可接受。”他说。“我要在八个小时内到达那里。不能再多一分钟。”\n\n罗夫沙娜把目光投向霍夫曼的脚。“我相信他们担心给引擎造成过度负荷，先生。”\n\n霍夫曼的脸变红了。他的目光盯着罗夫沙娜苗条的身姿。他怒气冲冲地走过去，脸凑近她的鼻尖只有一寸之遥。“你知道吗，我真的不在乎。”他咆哮道。“你们这些人似乎以为你们有权利违抗我。我在这里下命令！我做决策。你只管闭嘴，按照我的吩咐行事。”\n\n她哭泣着，畏缩着躲避霍夫曼高大的身影。“是的，先生，我明白，我真的很抱歉——”\n\n“够了。”霍夫曼朝她的脚吐了口口水。“我们要去查看直升机。如果工作没有按计划进行，你会后悔的。”\n\n两人一起上了楼梯，霍夫曼走在前面，罗夫沙娜跛行在他的后面，目光恭敬地低垂着。外面，枪声开始响起——骚乱肯定加剧了。霍夫曼开始加快步伐。\n\n两人走到楼梯顶部，推开通往直升机停机坪的出口，却发现那里空无一物。\n\n“等一下，该死，我的直升机在哪里？”一支步枪的枪托猛击霍夫曼的脑袋，将他击倒在地。他躺在地上，头痛欲裂，听到一个声音开始用俄语说话。\n\n“谢谢你，罗夫沙娜。你的付款正在途中。”"
 crisisswrw.23.a: "猩红色基地，这里是回声五号。我拿到包裹了。"
 crisisswrw.24.t: "和解"
 crisisswrw.24.desc: "阳光普照在斯图兹达王子的花园里。这位上了年纪的贵族，曾经是铁卫团的一名出生入死的仆人，现在大部分时间都在杂草丛生的土地上度过。几乎没有理由离开。罗马尼亚外交部，他所管理的官僚机构大半生都淹没在其中，终于得到净化。它的大厅里挤满了军团士兵，就像二十年前一样。允许他们渗透的犹太人和弱者都死了。政府一路搅动，砍掉了不确定性的藤蔓，为罗马诺-达契亚种族指明了道路。 斯图兹达不相信他能活着看到罗马尼亚的完全胜利；他快九十岁生日了，他很快就会和他的牧羊人一起回家。或者他快九十岁了？很难记住。\n\n王子的助手米海·博特扎图推着轮椅沿着崎岖不平的小路前行。王子的视线之外，开着一片美丽的水仙花。他不记得它们是安东尼娅所钟爱的柔和黄色，还是他晚年开始欣赏的纯白。\n\n“美好的一天，不是吗？”米海说。\n\n“是的，”王子说。 “我七年来见过的最美的”。啊，我记得65年的那个夏天，当然，那时候国内还有虫害……”\n\n斯图兹达的声音随着他回想起黑暗的时代而逐渐减弱。当愚蠢的国王似乎永远将罗马尼亚与她的命运分开时，当他们在德国的天然盟友似乎背弃了他的祖国时。只有斯图兹达的黑暗日子能说会道的他和他的信仰使运动保持活力。\n\n“嗯，那我们不用再担心了，长官，”米海说道，“是你救了我们所有人。”\n\n斯图兹达笑了。是的，他以为他有。\n\n“对了，”米海道，“总部刚刚传来一封信，巴库那边有情况。当然，你把他们培养得这么好，小臣们自己也能搞定。”\n\n斯图兹达点点头。 “是的，我同意。我对他们的能力很有信心。告诉他们使用通常的渠道。”\n\n米海将纸笔塞到亲王手中，这张纸显然是从一份较长的简报中取出来的，上面有一行亲王的签名，表示承认并接受简报的建议。"
 crisisswrw.24.a: "他笑了笑，在文件上签了名，然后回到了他的花园。"
 crisisswrw.25.t: "责备"
 crisisswrw.25.desc: "柯特·福克斯站在他上司的办公室里，脸上挂着友好的微笑。“希特勒万岁！”他喊道。\n\n“[Root.GetLeader]万岁，”部长官希尔泽说道。他是个年长的男人，秃顶，戴着黑色圆形眼镜。然而，他并不是那种软弱无力的老人；他的头脑像刺刀一样，敏捷而锋利。“福克斯，你的敬礼不合适。我建议你改变一下。”\n\n柯特只是展开了微笑。“为什么，希尔部长？我只是在表明我对我们种族光荣过去的承诺。这难道不是民族社会主义的创立宗旨吗？”\n\n希尔泽沮丧地摇了摇头。“福克斯，我带你来这里并不是为了这个。我从蒂尔那里听说你在挪威危机期间休了三天假。”\n\n柯特点了点头。“嗯，你听得没错。我做出了一个执行决策，和妻子一起在黑森林度过了一个短暂的休假。”\n\n“在紧要的外交谈判期间，你去度周末旅行？”\n\n“是的，而且我们仍然实现了我们的所有目标，”福克斯说道。“挪威人加入了战争，正如我们计划的那样。我不喜欢自吹自擂，但我必须说我对事态的发展感到非常自豪。”他露出了一个洁白的笑容。他的上司没有回以同样的笑容。\n\n“福克斯，我要说得很清楚，”他说着，俯身在桌子上。“突然间，福克斯意识到年长男人的肌肉在他的浆洗衬衣下凸显出来。“你在挪威谈判期间的行为完全不可接受。我对我的下属要求最高标准。在你负责罗马尼亚谈判期间，你不能离开岗位。”\n\n福克斯皱起了眉头。“罗马尼亚谈判，先生？我听说肯尼希会负责那个问题。”\n\n“不再是了，”舒尔茨说。 “你在挪威问题上的成功为你赢得了身居高位的朋友。但是，他用食指戳着富赫的胸膛说，“如果你的一个脚趾越界，我就直接去找帝国部长。"
 crisisswrw.25.a: "“我明白了，舒尔茨部长。”"
 crisisswrw.26.t: "重新聚焦"
 crisisswrw.26.desc: "\"好吧，蒂尔，\"柯特·福克斯说道，“向我解释一下问题。”\n\n蒂尔点了点头。“是的，先生。就像挪威危机一样，我们的总体目标是将罗马尼亚人卷入战争。随着考萨斯亚地区的局势恶化，他们的武装部队可能是完全胜利和……失败之间的关键。”他的声音逐渐消失。他舔了舔嘴唇，结结巴巴地说出最后一句话。“……失败。”\n\n福克斯不可思议地哼了一声。“糟糕的情况，我们竟然得依靠那些卑劣人的军队。我相信犹太人是幕后黑手。”\n\n“是的，先生。”\n\n“然而，我们必须克服他们可怕的阴谋。告诉我关于这个科斯特·霍夫曼的事。”\n\n“他是一位罗马尼亚商人，最初来自基希讷乌城。”\n\n“摩尔多瓦人，对吧？也许有一些反苏联的情感。”\n\n“确实如此，福克斯先生。霍夫曼是铁卫团的长期成员。我们雇佣他来帮助管理巴库的石油生产，一方面是为了与他们的政府建立关系，另一方面是为了避免若塞斯政府的残余势力。俄罗斯人显然派遣了一支特种部队在巴库失陷时将他抓捕。”\n\n“为什么？”福克斯问道，“他们抓住他是为了勒索吗？”\n\n“不是的，先生。他们想要对他进行审判。罗马尼亚人需要我们的外交力量来确保他的释放。”\n\n“当然了，”福克斯说着，露出了他那像电影明星一样的微笑。“我们总是乐意帮助我们的盟友。请向俄罗斯外交部发送一份函件，要求他的归还。”"
 crisisswrw.26.a: "“我会帮助你使措辞不那么……合理。”"
 crisisswrw.27.t: "闻到火药味"
 crisisswrw.27.desc: "弗拉登·古林的办公室一如既往地冰冷。不是溜冰场的温和寒冷，也不是笼罩在白色中的闪闪发光的圣诞节早晨。不，那是手指麻木的冰冷疼痛，赤脚在刀刃般的雪地上行进时的冰冷痛苦。那是失去肢体的寒冷，眉毛上的霜冻和耳朵的灼热。不知何故，这个混蛋喜欢它。\n\n有时安雅怀疑他是不是人类。 “我还没有收到有关危机的任何信息。”她说。她坐在古林对面，手里捧着咖啡渣。\n\n古林皱眉。 “是的，有人告诉我你试图破坏协议。记住我们的敌人总是在倾听。”他从外套口袋里掏出一个马尼拉文件夹，扔到桌子上。 “你知道行动：埃菲尔铁塔吗？”\n\n她摇头。 “很好，”古林说。 “行动：埃菲尔是特种部队发起的行动，目的是俘虏和拘留科斯特·霍夫曼。他是罗马尼亚公民，并且是铁卫团的长期成员。德国雇用他来管理巴库产量最高的油田。”\n\n安雅将紧握的拳头放在嘴边，陷入沉思。 “特种部队不会为了抓住纳粹分子而付出这种努力。有些事你没告诉我。”\n\n古林笑得像一头享受狩猎的狼。 “做得好，卡什尼克女士。“干得好，卡什尼克女士。我们有重要证据表明霍夫曼与德国和罗马尼亚情报机构都有联系。”\n\n“我不得不想象罗马尼亚人想要他回来。”\n\n“德国人给我们发了一封信。几小时前就到了。”古林从桌上取出一份，开始阅读。 “致那些自称是[RUS.GetAdjective]政府残余的野蛮人：你们绑架了我们的盟友[ROM.GetNameDef]的一名公民。你们的非法和原始手段不会被忽视。释放科斯特·霍夫曼，否则将面临帝国的愤怒。 “他笑了。 “当厕纸更有用。”\n\n“我们不会释放他。”\n\n“不会。特种部队要审问他。我们的工作是起草一份给德国人的答复。去拿你的打字机。告诉我，”他说，脸上闪过掠食者的笑容，“你对‘垂死帝国的政府’的这个称呼怎么看？”"
 crisisswrw.27.a: "是时候开始工作了"
 crisisswrw.28.t: "有什么事正在进行"
 crisisswrw.28.desc: "斯图兹达王子在温暖的阳光下打瞌睡，这时他感到背部一阵刺痛。一阵电流般的疼痛在他的脊椎上窜来窜去，他畏缩了一下，然后心跳一响就消失了。\n\n米海·博特扎图抓住了斯图兹达的胳膊。 “你没事吧？需要我叫医生吗？”\n\n斯图兹达挣脱了他的手臂。 “我很好。只是变老的一部分。”他摇摇头。贵族觉得自己的眼睛后面好像有蜘蛛网。 “我们在说什么？”\n\n“水仙花，先生。”\n\n“是啊！”斯图兹达王子不由自主地笑了。 “你知道的，安东尼娅过去很喜欢水仙花。我一有机会就把它们带给她。有一次我收集了一大捆，把它们藏在我们的床单下面。想象一下她的惊喜吧！”\n\n“我只能想象，先生。”\n\n“我想起来了，你还没结婚吧？”斯图兹达朝米海摇了摇手指。 “我得和我在部里的联系人谈谈。我敢肯定他们中的一个人有一个善良的基督教侄女。”\n\n“我对国家的责任高于任何其他使命，”米海说。 “说起来，我还有一份文件需要你签署。外交部需要获得许可才能对巴库采取一些措施。”\n\n斯图兹达皱起了眉头。 “措施？你确定不需要我帮忙？”\n\n“据我所知，确实是小事，没有什么他们办不到的。”\n\n“尽管如此，也许我需要了解一下。”\n\n“斯图兹达王子，我保证，没有任何问题。”米海说道。 “只是一个小小的外交混乱。你用一生的时间建立了这个部，里面充满了忠于罗马尼亚的好人。现在你必须相信他们会继承你的遗产。”\n\n“但——”\n\n米海斩断王子。 “我们去看看水仙花吧。我想小路的尽头有一片开花的地方。”\n\n斯图兹达布满皱纹的脸上露出了笑容。 “我想要那个。安东尼娅喜欢水仙花。你知道吗，我曾经收集了一整束水仙花藏在我们的床上？之后她把它们放了几个星期。”\n\n“没有，我以前没听过那个故事。”米海将斯图兹达的轮椅从正午的太阳上移开，驶向蜿蜒的小路。 “在我们走之前，你说你会在这些文件上签字。”"
 crisisswrw.28.a: "“我一定是忘记了。你带笔了吗？”"
 crisisswrw.29.t: "危机升级"
 crisisswrw.29.desc: "柯特·福克斯听到这个消息时，差点把他的番茄汤喷了出来。“他们干了什么？”\n\n“罗马尼亚人在街上绑架俄罗斯公民，”蒂尔说。“他们成了人质。罗马尼亚人说只有在他们拿到霍夫曼之后才会放他们离境。”\n\n“天哪，这太容易了！这帮混蛋几乎替我完成了我的工作。”柯特向附近的服务员挥了挥手。“嘿，我们在庆祝。送一瓶你们最好的斯帕特布尔贝格红酒过来。”\n\n提尔向后靠在椅子上，脸上一副愁眉不展的表情。他漫无目的地拨弄着自己的沙拉。\n\n“有什么问题吗？”\n\n他叹了口气。“听着，老板。我们费了这么大劲将挪威危机归咎于俄罗斯人。设立了一个完整的假委员会，只为了让世界舆论站在我们这一边。现在你要让这些铁卫团疯子把所有的工作都白费了吗？如果我们不谴责这些绑架行为，世界会认为我们与怪物为伍。”\n\n就在柯特准备回答时，服务员拍了拍他的肩膀。“先生，您的酒。”他鞠了一躬，带着华丽的动作把酒瓶放在桌子上，然后离开了。当他离开餐桌时，他在柯特的腿上塞了两张纸。一张是手写的便条，潦草地写着“到厨房见我”。\n\n第二张是柯特和他妻子在黑森林的照片。\n\n他们一直在密切关注着他。"
 crisisswrw.29.a: "“天哪。抱歉，蒂尔，我得走了。”"
 crisisswrw.30.t: "人质劫持"
 crisisswrw.30.desc: "“福克斯先生。谢谢你加入我的行列，”穿着燕尾服的男人说。柯特在餐厅寒冷的肉柜里瑟瑟发抖，但那个冒充他服务员的无名小卒几乎没有眨眼。预切好的牛排放在金属架子的每一边，还有猪肉肩膀挂在钩子上，空气中弥漫着血腥和腐烂的味道。\n\n“别谢我，”柯特说。 “距离Orpo的电话打来还有两秒钟。你是想告诉我为什么你有我和我妻子的照片，还是想告诉他们？”\n\n无名男子笑道。 “我们拥有的不止于此。”他从燕尾服口袋里掏出两张照片。 “你住在日耳曼尼亚康德大街41号。你每天 07:30 到 07:38 准时上班。你的妻子经常光顾施鲁特大街59号的杂货店，每天为你准备新鲜的晚餐。她忠诚、忠诚”他展示了两张宝丽来照片中的第一张——福克斯副部长的妻子克拉拉在一扇敞开的窗户前洗碗的照片。等等，出事了……\n\n克拉拉已经三年没有剪过那个发型了。\n\n“天哪，”福克斯低声说。 “你关注我多久了？”\n\n“足够长的时间找到这个，”冒名顶替者说。他透露了第二张照片——一张通过酒店窗户拍摄的模糊快照。福克斯躺在床上……\n\n柯特的胃下沉了一万英尺。“这是一个错误，”牧师说。 “只是一个错误的决定。”\n\n“我不知道你的妻子是否会这样看，福克斯先生。”\n\n“你为什么做这个？”\n\n无名男子笑道。 “我们与科斯特·霍夫曼先生有关系。他掌握了使战争圆满结束所必需的有关俄罗斯局势的信息。你奉命允许他被监禁或处死，以便让罗马尼亚人参战。在以销毁这些照片作为回报，你将缓和事态，并确保他成功撤离。”\n\n福克斯结结巴巴，找不到对攻击他的人的回应。顿时，他的嘴里像是塞满了沙子，脑袋砰砰直跳。\n\n冒充者俯身在福赫耳边低语。 “我们是反间谍机关的。我们可以做得比这更糟。"
 crisisswrw.30.a: "屈服"
 crisisswrw.30.b: "拒绝被勒索"
 crisisswrw.31.t: "大家都保持冷静"
 crisisswrw.31.desc: "弗拉登·古林握着塑料听筒，指节发白。他挂了电话，一脸阴沉的看着安雅。他……生气了吗？\n\n“我有一个不幸的消息，”古林说。 “罗马尼亚人在他们的锡锅独裁统治期间劫持了一些俄罗斯人作为人质。显然，只有在未来三天内释放科斯特尔·霍夫曼，他们才能保证他们的安全。”\n\n“我们不能那样做。”\n\n“我同意这是一个不受欢迎的结果。大屠杀也不是。”古林从他的办公桌前站起来，开始在房间里来回踱步。 “更有趣的是，德国人谴责了绑架事件。他们的外交部正在向罗马尼亚人施压，要求他们安然释放人质。”他笑得像一个模仿人类的异界生物。 “也许他们想阻止另一个布加勒斯特。”\n\n安雅微笑着，发自内心地笑着，尽管她浑身发抖，就像一名在喜马拉雅山坠毁的飞行员。 “这可能是我们让罗马尼亚人远离战争的开端！你认为德国人是真的吗？”\n\n“这说不定。和我交谈过的下属似乎已经够恶心了，但他的道德品质可能比魔法部的领导还要多。如果他们谴责这种犯罪行为，那只是因为他们看到了好处。”\n\n“他们想要霍夫曼的情报，并保持他们的国际形象，”安雅说。 “我们让罗马尼亚人远离南线。”\n\n古林点了点头。 “伦理问题往往归结为数学问题。”安雅的上司停止了踱步，在她面前坐下。 “如果我们不释放霍夫曼，有证据表明罗马尼亚人会杀死这些人。事实上，有数百人。如果他们参战，他们会杀死我们在南部前线的许多士兵。他们的军队人数众多，并遵守纪律。但是。”\n\n他竖起一根手指。 “但如果我们释放霍夫曼，我们的情报网络将受到损害。线人及其家人将被杀害。官员将被暗杀。补给站将被摧毁。我们的通讯将被拦截，前线将有数千人丧生。 “\n\n安雅不敢直视他的眼睛。她说话时盯着铺着地毯的地板。 “你教会了我为了更好的地位而做出牺牲。”\n\n“我做到了。问题是，哪种牺牲才是正确的？”"
 crisisswrw.31.a: "释放霍夫曼。解救人质。"
 crisisswrw.31.b: "我们不能释放霍夫曼。如果他的情报泄露出去，将会有数千人丧生。"
 crisisswrw.32.t: "和恐怖分子没有谈判余地"
 crisisswrw.32.desc: "弗拉登·古林握紧塑料电话筒，指关节白了。他挂断电话，面带严肃表情地看着安雅。他是生气了吗？\n\n\"我有个不幸的消息，\"古林说道。\"罗马尼亚人在他们这个锡锅独裁国家里扣押了一些俄罗斯族的人质。显然，他们只会保证人质的安全，如果在接下来的三天里释放科斯特·霍夫曼。\"\n\n\"我们不能那样做。\"\n\n\"我同意这不是一个理想的结果。同样，屠杀也不是。\"古林从桌前站起来，在房间里踱来踱去。\"他们已经杀害了二十五名人质，大部分是妇女和儿童。卫队把他们吊在肉钩上并折磨致死。\"安雅的上司颤抖着，脸开始发红，握紧然后松开双拳。\n\n安雅眼角湿润，泪水开始流淌。她强忍住抽泣说道：\"我们不能让他们这样做。\"\n\n古林深吸了一口气，又一口，再一口。他的脸色在他再次开口时略微恢复了一些正常。“我们也不能让他们树立恐怖的先例。如果世界看到劫持俄罗斯公民可以对我们政府施加压力，我们的人民将在任何地方的恐怖面前都处于危险之中。哥伦比亚，印度尼西亚，南非。任何有恐怖主义的地方，我们的人民都将面临危险。”\n\n安雅在座位上移动了一下。“你是说什么？\"\n\n\"我们将与总统进行谈话。似乎与罗马尼亚开战是不可避免的。\""
 crisisswrw.32.a: "为了仇恨，他们向我们吐出最后一口气。"
 crisisswrw.33.t: "我们的线人被释放"
 crisisswrw.33.desc: "巴库传来了一个好消息。我们的情报线人已经脱离了[RUS.GetAdjective]的掌控。当然，我们要归功于我们的新星米海·博特扎图。正是通过他聪明的策略和迅速的思考，我们才能够取得这一外交成功。我们已经得到了我们想要的一切，我们将不会卷入第二次西俄战争。\n\n博特扎图先生必须立即被视为晋升候选人，并应该被提名为中央政府认为合适的任何奖项。我对他履行我们的国家和种族责任的能力充满信心，我相信他的职业生涯将给[ROM.GetNameDef]带来福音。\n\n签字，\n\n斯图兹达王子"
 crisisswrw.33.a: "我猜所有这些下午对王子的甜言蜜语都得到了回报。"
 crisisswrw.34.t: "我们的线人被抓了"
 crisisswrw.34.desc: "[RUSGetUniqueNamePlain]传来令人无法接受的消息。我们的情报线人被俄方拘留。这名罗马尼亚公民是我们党派的亲密朋友和民族爱国者，他因忠诚和坚定不移地面对犹太-布尔什维克的侵略而被关押。对此，唯一合理的回应是立即对俄罗斯政府宣战。\n\n与我们的盟友——大日耳曼国并肩作战，我们打算迫使野蛮人越过乌拉尔山脉，进入西伯利亚荒原。纯洁种族将再次肩并肩，为西方文明与野蛮行径进行斗争。我们的国家将在斗争的浪潮中焕发新生，我们的年轻人将在机枪火力的呵护下成长为勇敢的男子汉。这是英雄的时代，罗马尼亚是一个充满英勇精神的国家。"
 crisisswrw.34.a: "“先生们，准备战斗！”"
 crisisswrw.35.t: "[Get_newspaper_header]罗马尼亚大屠杀"
 crisisswrw.35.desc: "罗马尼亚传来了可怕的消息。由于未知的原因，罗马尼亚政府在全国范围内监禁了一些[RUS.GetAdjective]的公民。如今，这些人被集体杀害，据称，情况“惨烈得无法描述”。初步估计有四百多名平民被谋杀。\n\n[RUS.GetAdjective]政府谴责罗马尼亚和大日耳曼国对这起大规模杀戮的默许。不留名的[RUS.GetAdjective]消息来源表示，德国人鼓励这些杀戮，以报复第二次西俄战争的爆发。德国外交部谴责这些指控，声明称“罗马尼亚人是自行行动，没有帝国的指示或干预。”双方都确信：无论原因如何，这起大规模谋杀只会加剧东欧地区的紧张局势。"
 crisisswrw.35.a: "民族社会主义的野蛮行为再次上演。"
 crisisswrw.35.b: "如果真的发生了，那么他们活该。"
 crisisswrw.36.t: "[Get_newspaper_header]西部的沉默"
 crisisswrw.36.desc: "俄罗斯国内掀起一股宽慰之情。数千名被罗马尼亚政府扣留的俄罗斯族裔人士在联邦交出高加索地区的罗马尼亚人科斯特·霍夫曼之后得以释放。初步估计，如果不是霍夫曼被释放，大约450名俄罗斯人将立即遭到私刑处决。\n\n在这起暴力挑衅事件中，俄罗斯政府强烈谴责罗马尼亚和德国政府鼓励这种野蛮行径。尽管德国外交部否认了这些指控，并表示\"罗马尼亚人是自行行动，没有帝国的指导或干预。\"双方对此深信不疑：无论原因如何，这种野蛮行为只会加剧两国之间的紧张局势，导致第二次西俄罗斯战争的升级。"
 crisisswrw.36.a: "野蛮的狗……"
 crisisswrw.36.b: "错失机会"
 crisisswrw.37.t: "[Get_newspaper_header]波罗的海危机解除"
 crisisswrw.37.desc: "经过一段时间的激烈外交斗争，波罗的海危机已被俄罗斯外交官化解。中立国​​商船“尼奥尔德”号被俄罗斯水雷炸毁，这本来就是一起可怕的事件，随着德国外交官在幕后煽动国际社会的愤怒，这一事件有可能失控。两国政府的消息来源表明，挪威人即将向俄罗斯政府宣战。然而，最后一刻的外交突破几乎没有说服挪威人维持脆弱的和平。斯堪的纳维亚半岛目前已千钧一发地避开了现代战争的漩涡。只有时间才能证明在一个充满战争的大陆上能否实现和平。"
 crisisswrw.37.a: "刀剑入鞘"
 RUS_nuke.1.t:0 "一切的终结"
 RUS_nuke.1.desc:0 "一切都结束了。随着我们的军队最近进入德国本土，元首似乎决定使用核武器。数以千计的德国核导弹已经在高空飞行，正以超音速飞向我国的人口中心。我们已经无能为力了。"
 RUS_nuke.1.a:0 "愿主保佑我们"
 econ_sphere_name_tab_RUS:0 "俄罗斯势力圈"
 econ_sphere_name_tab_HUS:0 "巴尔干国际"
