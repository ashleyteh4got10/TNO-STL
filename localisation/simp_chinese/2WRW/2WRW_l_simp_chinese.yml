 RUS_ROM_1_tt:0 "我们将向俄罗斯人提供§G生命线§!。"
 RUS_ROM_2_tt:0 "§R沒有退路了。§!"
 crisisswrw.38.t: "[Get_newspaper_header]挪威加入第二次西俄战争"
 crisisswrw.38.desc: "在一个意外的转折中，挪威政府正式向[RUS.GetName]宣战。挪威人最初宣布中立，只打算通过武器装运和优惠贸易政策来支持第三帝国。然而，由于一艘由挪威船员组成的中立商船“峡湾号”在俄罗斯海军的水雷袭击下被摧毁，挪威公众和政府转向战争。俄罗斯政府错过了多次和平解决的机会。现在，欧洲战争的新战线在斯堪的纳维亚开启。这将改变战争的形势，对德国有利吗？还是俄罗斯将在这次非凡的挫折中坚持下去？"
 crisisswrw.38.a: "森林兄弟再次走向战争"
 crisisswrw.39.t:0 "[Get_newspaper_header]伦敦机场发生爆炸"
 crisisswrw.39.desc:0 "今天从伦敦传来消息称，一架刚刚从日耳曼尼亚起飞的飞机发生爆炸，几乎机上所有乘客都丧生了。幸存者中包括德国外交官柯特·福克斯，他当时正在前往英国，准备与英国政府就正在进行的第二次西俄战争举行安全会议。目前肇事者身份不明，但调查人员正在调查爆炸原因。\n\n大日耳曼国迅速将这起爆炸事件归咎于[RUS.GetAdjective]，声称他们试图干扰与英国的计划中的安全会议。而[RUS.GetAdjective]则立即否认与这起事件有任何关联。"
 crisisswrw.39.a:0 "英国中立状态的终结？"
 crisisswrw.40.t: "困于乌克兰"
 crisisswrw.40.desc: "中尉垂坐在指挥官的座位上，汗水顺着他皱纹纵横的额头滴落下来。他试图闭上眼睛休息，但无济于事。天啊，他感觉自己要被活活烤熟了！\n\n无线电突然响起。“彼得罗夫，带一个坦克中队到小镇南边的田地。报告显示有几支德军部队，装备和火力参差不齐，正在从村庄撤退。”他叹了口气，然后启动了他的坦克。\n\n俄罗斯坦克悄然绕过森林的边缘，出现在一支德国装甲纵队的侧翼。那支残破的队伍由混杂的坦克、军用卡车和步兵组成，生锈的斑点和扁平的轮胎突显出他们的狼狈行军。“看样子，我们得帮这些混蛋解脱了，”彼得罗夫说道。他对着无线电下令：“所有单位，开火。”彼得罗夫的火炮轰然发射，击中了领头的坦克侧面。烟雾开始从坦克的驾驶舱中冒出，俄罗斯的收割者们开始了一场血腥的收割。那辆燃烧坦克的指挥官拼命从即将毁灭的载具中爬出，却被一阵机枪火力拦腰打断。一分钟后，公路上只剩下一堆燃烧的金属和五十七具残缺不全的尸体。\n"
 crisisswrw.40.a: "“但他们为什么不回击呢？”"
 crisisswrw.41.t: "老把戏"
 crisisswrw.41.desc: "房间里有两个人，静静地等待着那通电话的到来。其中一个不过是个普通的无线电操作员，自内战结束以来便一直在国防军服役。另一个则是情报官员，他除了呼吸和观察四周的空气外，什么都没做。持续的沉默对无线电操作员来说如同毒药，他准备回应这辈子最重要的一通电话。\n\n无线电突然响起。无线电操作员很快找到了合适的音调。“多少？23个匈牙利人？长官，你保存了尸体或者拿到了文件吗？我明白了。那么，请重复一遍你能告诉我们的所有关于受害者的信息。”\n\n通话持续了好几分钟。无线电操作员像最出色的莎士比亚演员一样，巧妙地复述着剧本中的每一个细节，将无名的伙伴引向每一个需要的方向。当幕布落下时，情报官员把无线电操作员从破旧的发报机旁拉开，并记录下紧急信息的每一个细节，就像他们演练过的那样。几分钟后，反间谍机关的特工离开了房间，去汇报那场由俄罗斯入侵者制造的大悲剧。"
 crisisswrw.41.a: "匈牙利领事馆五分钟后接见了他。"
 crisisswrw.42.t: "德国人来电了……"
 crisisswrw.42.desc: "“我们得让那些混蛋付出代价，首先从帮助我们的德国盟友开始。”一位匈牙利政客说道。德国大使随着耳边的音乐轻轻跺脚。“德国人对我们的政权表现出了极大的尊重和支持。只有将我们的意志与他们的捆绑在一起，我们才能确保共同的成功。”十几位匈牙利人坐在桌子周围，面前摆放着显示他们职位的名牌，他们都是“德国帝国匈牙利损害委员会”的成员。\n\n“因此，我们必须全面审查俄罗斯入侵者造成的物质和人类损失。我建议提出要求，允许我们的观察员跨越前线并质询相关的部队，此外还要对那些被俄罗斯部队摧毁的尸体进行经济赔偿。”\n\n十几双匈牙利人的眼睛游移不定，最后都集中在委员会主席身上，希望他能给予某种认可。那个秃顶的男人感受到房间里气氛的变化，终于开口了。“这很好。我还将正式呼吁匈牙利武装部队做好准备，如果斯拉夫人不合作，我们将迫使他们听从。”\n\n德国人的笑容更加灿烂，当匈牙利人开始收拾东西时，他走了出去，准备汇报他所听到的一切。"
 crisisswrw.42.a: "……而匈牙利接了电话。"
 crisisswrw.43.t: "亲爱的匈牙利代表们"
 crisisswrw.43.desc: "......请理解，我们正以最高的严重性对待这一情况。尽管在战争期间会发生各种暴力和恐怖的行为，但我们一直在积极努力减少此类事件的发生。\n\n因此，我们已开始对该事件进行自己的调查。此事有若干因素使情况复杂化。首先，最近的俄罗斯部队仍在数公里之外，我们调查过的部队中没有一支报告了您所声称发生的那种行为。虽然据称现场应有遗骸，但我们的调查显示，在死亡时间段内，现场的唯一损害是几处似乎用汽油和火柴点燃的可控火焰。\n\n因此，我们对这些指控的有效性表示关切，尤其是大多数信息表明，调查结果并不是由匈牙利人得出的，而是由当时在该地区的德国部队得出的。鉴于此，我们决定......"
 crisisswrw.43.a: "“同意你们的要求。”"
 crisisswrw.43.b: "“拒绝你们的要求。”"
 crisisswrw.44.t: "腐朽的匈牙利"
 crisisswrw.44.desc: "布达佩斯的每一条街道上，俄罗斯拒绝的消息都没有得到好的回应。法西斯政权的代表们在他们能到的地方现身。“一场好的战争会给新一代带来真正的脊梁。今天的年轻人很懒惰，他们不明白建设我们国家现有伟大成就所需的努力！”无论聚集在演讲者周围的人群是真心相信还是仅仅保持沉默，很快都变得无关紧要。媒体成为鞭子，将民众驱赶到狂热中。\n\n与此同时，发出第一个要求的委员会正准备他们的下一步。士兵们装填了子弹，系紧了靴子，准备加入战争，希望能防止他们的德国盟友被击败。那些敢于建议退缩的少数声音要么在几天内被清除，要么方便地被“说服”去接受向俄罗斯提出更多要求或面对战争的必要性。\n\n当委员会恢复理智，看到谴责俄罗斯的自然必要性时，他们决定写下另一份要求清单。要求基本相同，唯一的主要区别是要求的严厉程度更高。更多的赔偿金，更大的自由来检查前线的俄罗斯一侧。"
 crisisswrw.44.a: "离战争更进一步"
 crisisswrw.45.t: "另一套要求"
 crisisswrw.45.desc: "手指在外套口袋的布料上滚动着，帕夫洛夫等待着[RUS.GetLeader]完成今天的军事简报。他的眼睛已经半闭着——从伊斯坦布尔飞过来的夜班航班把他折腾得像一个被灰尘覆盖的地毯。他专注于口袋丝滑的质地，拼尽全力不让温暖的房间让他入睡。\n\n[RUS.GetLeader]拍了拍他的肩膀，把这位外交官吓醒了。“帕夫洛夫·阿列克谢维奇，是吗？告诉我关于我们的匈牙利问题。我的眼睛已经太累了，无法再读任何文件。”\n\n帕夫洛夫咽了咽口水，揉了揉眼睛。“没有什么好消息要报告。匈牙利人仍然在摆架子。要求还是老一套——赔偿金，以及匈牙利访问我们的通讯，以防止再次发生‘事件’。”\n\n“他们获得的任何信息都会传回德国人那里。”\n\n“确切地说。他们准备参战，除非他们的要求被接受。而且不仅仅是摆架子。反俄宣传在匈牙利国家报纸上急剧增加。他们正在动员装甲部队和野战医院。我预测他们可能在一个月内参战。”\n\n[RUS.GetLeader]靠在椅子上，闭上了眼睛。在五分钟内，帕夫洛夫得到了他的答复。"
 crisisswrw.45.a: "拖延他们。"
 crisisswrw.45.b: "够了……向他们屈服。"
 crisisswrw.46.t: "匈牙利狂想曲"
 crisisswrw.46.desc: "德国大使深吸一口弥漫空气中的烟雾，凝视着他的杰作。整个自由广场上充斥着爱国的匈牙利人高喊口号，就像训练有素的狗一样。广场上的能量让他想起1934年纽伦堡集会，那是德国踏上重建辉煌之旅的日子。同样的至高精神弥漫在空气中，但有一个关键的差别玷污了令人愉悦的仇恨氛围。\n\n匈牙利人只是在自欺欺人。\n\n即使匈牙利投入了全部力量，坚决支持德国，他们也无法得到任何好处。特兰西瓦尼亚是不可重新谈判的。在充满烟雾的会议室里，日耳曼尼亚计划将欧洲各国捆绑在他们的意志下。匈牙利的法西斯政府永远只是德国拳头的遮掩。\n\n他没有任何遗憾。事实上，他微笑了。如果他不那么严肃，他可能会唱唱跳跳，或者喝上几瓶烈酒。他的职责和喜悦就是推动德国的利益。"
 crisisswrw.46.a: "即使代价是匈牙利人的生命。"
 crisisswrw.47.t: "寸步不退"
 crisisswrw.47.desc: "帕夫洛夫准备再次会见俄罗斯的领袖。这一次，他已经有了八小时的睡眠和两杯不加糖的热咖啡。清晨的阳光透过窗户，比在黑暗中看到的同一扇玻璃窗美得多。门轻轻裂开，一个不起眼的士兵示意他进去。\n\n[RUS.GetLeader]以坚定的握手迎接帕夫洛夫。“我猜他们对我们的拖延策略没有好反应？”\n\n“没错，而且我必须告诉您，如果我们打算接受匈牙利的要求，时间已经不多了。我们只剩下几个小时了。”\n\n[RUS.GetLeader]不太习惯处理非俄罗斯的外交事务。这种事务有更大的滞后感和更多的中间环节。然而，有一点是相同的，那就是战争作为解决方案的随意建议。在这方面，世界各地都是相似的。他们坐下来，思考战争的进展，以及前线是否能承受匈牙利军队的加入。不管他们的决定是什么，战争很快就会结束，只有时间能证明他们是否做出了正确的选择。"
 crisisswrw.47.a: "断绝与匈牙利人的一切联系，把将军们都找来。"
 crisisswrw.47.b: "请优先考虑挽救生命。"
 crisisswrw.48.t: "[Get_newspaper_header][匈牙利加入第二次西俄战争"
 crisisswrw.48.desc: "匈牙利军队再次动员起来，协助其在东欧的德国盟友，就像20世纪40年代那样。匈牙利政权的有限通讯表明，共和国对俄罗斯人进行干预是“为了保护平民免受斯拉夫野蛮行为的侵害”。围绕危机具体情况的猜测仍然居高不下，德国集团拒绝允许对饱受战争蹂躏的东欧进行独立调查。俄罗斯不再对国际观察员开放，并表示任何此类努力都必须在战争正式结束后进行。\n\n尽管匈牙利军队不是欧洲最强大的军队之一，但它仍然可能成为阻止俄罗斯进攻浪潮的一个因素，甚至有助于将他们赶出东方领和乌克兰。"
 crisisswrw.48.a: "我们将埋葬他们！"
 crisisswrw.48.b: "真相是所有战争的第一个受害者。"
 crisisswrw.49.t: "[Get_newspaper_header]多瑙河危机解除！"
 crisisswrw.49.desc: "在意想不到的事态发展中，俄罗斯和匈牙利避免了因国际媒体所说的“乌克兰大屠杀”而发生的冲突。一个俄罗斯坦克旅在匈牙利军队护送出乌克兰时，看似没有挑衅，袭击并杀害了一些匈牙利平民。俄罗斯政府已毫无保留地就此次袭击事件道歉，并在世人眼中承担全部责任。\n\n尽管[RUS.GetLeader]声明“真相将会水落石出”，但俄罗斯知道自己不会在解放战争中遇到另一个敌人，因此可以放心。尽管据报道发现了这一事件，但德国政府尚未对这一消息做出正式回应。来自帝国的传言表明人们对当前形势严重不满。"
 crisisswrw.49.a: "外交手段似乎占了上风。"
 crisisswrw.50.t: "我们将参加第二次西俄战争！"
 crisisswrw.50.desc: "在针对我们人民的卑鄙袭击之后，俄罗斯政府拒绝适当补偿我们，并协助调查这起对平民的令人发指的袭击事件，我们别无选择，只能加入大日耳曼国来捍卫我们的国家和人民。"
 crisisswrw.50.a: "也许我们可以表现得足够好，以夺回特兰西瓦尼亚吗？"


