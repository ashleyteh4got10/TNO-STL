 JAP_Colonial_Restructuring_tt:0 "§Y松尾敬宇将试图夺取§R马达加斯加§!"
 JAP_MAR_Seizure_tt1:0 "§Y德国的侵略行为将不会被容忍！§!"
 JAP_MAR_Seizure_tt2:0 "§Y松尾敬宇将试图夺取§R德国的印度洋§!领土！§!"
 pakt_collapse.1.t: "[Get_newspaper_header]大日耳曼国爆发骚乱"
 pakt_collapse.1.desc: "尽管动乱一直是欧洲之主的顽疾，但在最近战争的前线崩溃后，暴力抗议活动达到了自希特勒之死以来前所未有的高度。无论是在波恩还是在布雷斯劳，无论是来自自由主义者还是来自无政府主义者，革命运动以惊人的数量爆发，抗议者甚至在一些城市中击败了防暴警察。\n\n德国自然地将暴乱者淡化为“惹是生非的青年”，并指责美国是这次“犹太复国主义暴力”的推手。然而，尽管日耳曼尼亚保持着冷静，随着越来越多国内急需的人员被派往前线，人们不禁想知道大日耳曼国打算如何应对这场日益恶化的危机。"
 pakt_collapse.1.a: "看看他们如何在我们的威力面前畏缩！"
 pakt_collapse.1.b: "这终将平息。"
 pakt_collapse.1.c: "无声狂啸"
 pakt_collapse.2.t: "统御波涛"
 pakt_collapse.2.desc: "尊敬的天皇陛下：\n\n十年前，日本和马达加斯加军队在德意志帝国主义者的手下遭受了失败，这是我们可能永远无法真正抹去的，对您名声的耻辱。然而，随着欧洲列强继续相互消耗，他们转移了注意力，为我们至少部分赎罪的机会提供了可能。\n\n驻守马达加斯加的卫戍部队实在太过薄弱。根据我们的情报估计，他们的部队已经有超过八成被调走参与欧洲战争。其余的部队饱受瘟疫之苦，挨饿，甚至没有装备来进行表面上的抵抗。只要日本帝国海军的伟大将士们面对他们，他们必然会畏缩不前并土崩瓦解。\n\n根据我的指令，西南地区舰队已经得到了充分的补给以进行这次航行。我们计划的航线将远离美国人及其所谓的自由国家组织的警惕目光。一支完整的最精锐海军陆战队已经准备好为了天皇和国家发挥他们的大和魂。现在我们所需要的只是您的祝福。我们很难再有机会将旭日之光照耀在印度洋上。\n\n愿您的统治继续充满祝福。\n\n松尾敬宇上将。"
 pakt_collapse.2.a: "不入虎穴，焉得虎子。"
 pakt_collapse.3.t: "统御波涛"
 pakt_collapse.3.desc: "尊敬的天皇殿下：\n\n十年前，尽管马达加斯加人的抵抗精神扼杀了他们的殖民野心，但德意志暴君却从我们眼皮底下夺取了印度洋的岛屿，这是对您名誉的耻辱，我们可能永远无法真正抹去。然而，随着帝国的内外崩溃，他们被转移的注意力为我们提供了机会，至少部分弥补我们严重的失误。\n\n他们非法领土的驻军可悲地薄弱。我们的情报估计，他们超过八成的力量已撤离到欧洲战场。剩下的人受疾病困扰，饥饿交迫，甚至没有装备来假装抵抗。一旦帝国日本海军的伟大人物面对他们，他们肯定会畏缩并溃散。\n\n根据我的命令，西南区舰队已经得到了足够的补给以备旅程所需。我们计划的航线将使我们远离警惕的美国人及其所谓的OFN。一支由最优秀的海军陆战队组成的完整战斗小组已准备好为他们的天皇和国家发挥出大和之魂。现在我们所需要的只是您的祝福。我们很少有机会将旭日之光带到每一个称印度洋为家的岩石和波浪之中。\n\n愿您的统治继续充满祝福。\n\n松尾恳宇上将。"
 pakt_collapse.3.a: "不入虎穴，焉得虎子。"
 pakt_collapse.4.t: "[Get_newspaper_header]日本夺取马达加斯加"
 pakt_collapse.4.desc: "南西地区舰队的松尾恳宇上将今天宣布，马达加斯加的亲德政权已经“从西方压迫中解放出来”。据报道，一系列水陆两栖入侵行动轻松地夺取了这个殖民地，这并不奇怪，因为驻军严重缺乏补给；其中大部分部队已经撤回欧洲参战。尽管新的海军行政机构承诺最终建立一个“独立的马达加斯加共和国”，但土著游击队和财阀矿业运营的报道让这些承诺引起了怀疑。\n\n德国谴责这一夺取行动，并表示将在能够的时候夺回其“生存空间”。然而，随着内部稳定性和军队士气的急剧下降，这样的威胁似乎不太可能实现。"
 pakt_collapse.4.a: "旭日更加耀眼！"
 pakt_collapse.4.b: "我们不会忘记！"
 pakt_collapse.4.c: "德国的问题儿童终将迎来它的命运。"
 pakt_collapse.5.t: "[Get_newspaper_header]日本夺取了毛里求斯和留尼汪岛"
 pakt_collapse.5.desc: "随着德国在街头和战场上陷入混乱，他们的领土损失似乎不仅仅限于欧洲。根据日本的报道，一系列两栖登陆行动轻易夺取了两个德国领土，这并不奇怪，因为驻扎军队严重缺乏补给；大部分他们的部队都已撤回到欧洲进行战斗。\n\n德国外交官谴责这一夺取行动，并承诺在能够之际夺回他们的“合法领土”。然而，随着欧洲形势日益严峻，毛里求斯和留尼汪岛，或者如今被称为“明治港”和“光明岛”，似乎将在可预见的未来继续受到旭日的照耀。"
 pakt_collapse.5.a: "旭日更加耀眼！"
 pakt_collapse.5.b: "我们不会忘记！"
 pakt_collapse.5.c: "德国的问题儿童终将迎来它的命运。"
 pakt_collapse.6.t: "[Get_newspaper_header]大日耳曼国发生粮食短缺"
 pakt_collapse.6.desc: "虽然自50年代的经济困境以来，许多德国人都在艰难地谋生，但最近严格的配给制度、外国禁运以及乌克兰小麦因俄罗斯的进攻而损失，都导致了极其严重的食物短缺问题。面包、牛奶和其他基本必需品的价格在过去一周内已经翻了两番以上，而且预计价格还将继续上涨。\n\n全国范围内，骚乱和抗议活动迅速蔓延，成千上万的饥饿市民四处抢劫任何他们能找到的有营养价值的东西。德国再次否认食物短缺的存在，将所有“贪婪食物的低等人”说成“第五纵队式的暴食”。尽管日耳曼尼亚对此不屑一顾，然而，似乎帝国每一天都在逐渐走向灭亡。"
 pakt_collapse.6.a: "纳粹的贪婪让众人看得一清二楚。"
 pakt_collapse.6.b: "真正的雅利安人并不想要！"
 pakt_collapse.6.c: "总是离无序仅三餐之遥。"
 pakt_collapse.8.t: "[Get_newspaper_header]抵抗组织“米洛格”在挪威发动政变"
 pakt_collapse.8.desc: "尽管存在不稳定性，许多分析人士声称挪威北部政府若要脱离大日耳曼国将会面临严重后果。然而，这些分析人士的预测今天被证明是错误的。反法西斯革命组织\"Milorg\"的领导者克努特·莫伊恩在斯托尔廷的台阶上宣布，与大日耳曼国结盟的挪威政府已经被高度组织但几乎没有流血的方式推翻。\n\n尽管德国谴责他的新政权，而且反\"Milorg\"势力依然四面楚歌，莫伊恩已经开始与自由国家组织进行接触，并计划进行选举，他向人民承诺\"自由之光将再次照耀挪威\"。然而，只有时间能告诉我们，这样的承诺是否能够兑现。"
 pakt_collapse.8.a: "焕发第二春。"
 pakt_collapse.8.b: "都是叛徒！"
 pakt_collapse.8.c: "碎成千片的帝国。"
 pakt_collapse.9.t: "北方之光"
 pakt_collapse.9.desc: "尊敬的总统：\n\n正如您所知，在欧洲持续不断的战争中，大日耳曼国的势力范围依赖于他们无法再提供的武力威胁而逐渐崩溃。然而，我们绝对没有预料到，在所谓的团结协定中，会出现一个欲加入我们的自由国家组织的申请国。\n\n最近，地下亲民主的抵抗组织“米洛格”成功夺取了挪威的政权。虽然世界上的自由国家在三十多年前无法在挪威最需要帮助的时刻保护这个北欧国家，但他们并没有忘记自由国家组织在此后给予他们的支持。\n\n新政府已经提交了一份详细的路线图，计划在一年内进行自由公正的选举。他们还建立了一个外交团队，准备与我们展开对话。此外，他们在欧洲的地位对我们与全球暴政的抗争至关重要。如果德国设法保持他们曾经的势力范围的一丝影子，他们很可能会再次用极端手段牢牢控制挪威。\n\n正因如此，我无法过分强调我们回应挪威加入自由世界的愿望之重要性。根据《自由国家组织章程》第10条，我们可以将他们的加入程序从数月缩短至几天。考虑到欧洲的情况，我相信您并不反对行使这样的条款。\n\n此致，\n\n路易斯·勒纳\n自由国家组织驻挪威王国联络官"
 pakt_collapse.9.a: "我们不是为了自由而战吗？让他们加入吧。"
 pakt_collapse.10.t: "[Get_newspaper_header]挪威加入自由国家组织"
 pakt_collapse.10.desc: "美国和挪威王国的外交官今天在电视转播的会议上宣布，挪威现已成为“自由世界的正式成员”，这一令人震惊的消息来自曾经被认为是德国不可分割的一部分的国家。\n\n在宣布时，奥斯陆的氛围非常热烈，成千上万欢呼的居民在城市的街道和广场上升起挪威和美国国旗。挪威首相[NOR.GetLeader]再次对全国发表讲话，赞扬了美国，称挪威“不再屈服于外国的暴政之下”。尽管德意志再次威胁要重新征服挪威，但挪威受制于人的时代似乎终于结束了。"
 pakt_collapse.10.a: "北极光再度闪耀！"
 pakt_collapse.10.b: "什么狗屁兄弟。"
 pakt_collapse.10.c: "骆驼背上压的稻草更多了。"
 pakt_collapse.11.t: "[Get_newspaper_header]挪威离开团结协定"
 pakt_collapse.11.desc: "在一个令人惊讶的转折事件中，挪威首相[NOR.GetLeader]今天宣布，考虑到“民意”和“外交环境的变化”，这个曾经的重要德国领土转变为民主的联盟伙伴将退出团结协定。\n\n华盛顿对这一消息表示欢迎，称该条约是一场“敲诈”，并承诺恢复与挪威的外交关系。然而，令人震惊的是，德意志尚未对其所吹嘘的“北方兄弟”的退出发表评论。无论这种反常的沉默是出于东方的战争还是出于失败主义，对许多人来说，这种沉默都预示着德国的全球地位的终结。"
 pakt_collapse.11.a: "他们现在终于自由了。"
 pakt_collapse.11.b: "懦夫和叛徒！"
 pakt_collapse.11.c: "这本就无可避免。"
 pakt_collapse.12.t: "北方之光"
 pakt_collapse.12.desc: "尊敬的总统，\n\n正如您所知，在欧洲持续不断的战争中，大日耳曼国的势力范围依赖于他们无法再提供的武力威胁而逐渐崩溃。然而，我们绝对没有预料到，在所谓的团结协定中，会出现一个欲加入我们的自由国家组织的申请国。\n\n尽管在德国内战期间成功摆脱了德国的政治压迫，德国仍通过外交承诺和经济奴役成功地将这个北欧国家并入他们的势力范围，使其沦为由德国马克铸成的链条。\n\n然而，如今，在他们的主人分心的时刻，挪威寻求最后一次机会，成为真正自由的国家。只有通过加入自由国家组织，他们才能抵御来自德国的任何军事或经济威胁。此外，挪威距离德国核心领土仅数英里之遥，在我们打击全球暴政的斗争中具有至关重要的战略意义。\n\n正因如此，我无法过分强调我们回应挪威加入自由世界的愿望之重要性。根据《自由国家组织章程》第10条，我们可以将他们的加入程序从数月缩短至几天。考虑到欧洲的情况，我相信您并不反对行使这样的条款。\n\n此致，\n\n路易斯·勒纳\n自由国家组织驻挪威王国联络官"
 pakt_collapse.12.a: "欢迎回来，挪威。"
 pakt_collapse.13.t: "终结？"
 pakt_collapse.13.desc: "悲剧！在全世界范围内，我们被遗弃了。曾经被视为兄弟和朋友的国家，现在洗手不干预我们所谓的污秽，选择被华盛顿和东京的奴隶主所诱惑。我们在东方的土地，曾经是德意志民族的核心领土，现在却飘扬着斯拉夫人的旗帜！\n\n在世界的每一个角落，傻瓜、懦夫和叛徒随处可见，他们无法看到我们对全球霸权的天然权利，无法为我们的鲜血和土地而战，无法看透我们敌人撒下的毒箭谎言。\n\n我们第一位元首引以为豪的\"团结协定\"，现如今只是一个曾经伟大的外壳。然而，现在不是迷惑自己于谎言和华丽的时刻，而是当曾经坚不可摧的腐败已经渗透时。不，现在是时候舔舐我们新鲜和褪色的伤口，并准备再次出击！\n\n当我们的党派被软弱的理想主义者逼迫地躲入地下五十年前，我们放弃了吗？当我们对东部土地的夺回受到伦敦和巴黎的挑战时，我们放弃了我们的野心吗？不，每当我们的帝国面临逆境时，我们都会崛起到前所未见的高度！这次也不例外。很快，我们的军队将再次跨越世界。很快，我们将取得连我们第一位元首都无法梦想到的胜利。很快，没有人会质疑我们欢呼\"千年之后最后一次！\"\n\n国家万岁！元首万岁！胜利万岁！\n\n——阿道夫·冯·塔登，波美拉尼亚的高级地方领袖，在国会发表演讲。"
 pakt_collapse.13.a: "过去被遗弃，未来不可知。"
 pakt_collapse_13_tt: "§e秋天结束了。§!"
 pakt_collapse.16.t: "[Get_newspaper_header]团结协定的终结"
 pakt_collapse.16.desc: "今天早上，日耳曼尼亚的空气沉闷压抑。根据来自德国外交部的公报，团结协定——曾经是世界上最重要的政治联盟——将会被“重组以专注于内政事务”。从根本上说，德国作为全球大国的日子已经结束。\n\n尽管很多人预料到德国的实力会减弱，但没有人预料到如此巨大的失势。然而，在第二次西俄战争中完全失败，加之其他各种外交和军事失误，曾经被世界认为不可能的事情如今变得不可避免。现在，当剩下的大国们纷纷盘旋而上，暴乱持续蔓延，这个“千年帝国”踉跄着进入一个新的、可怕的未来，孤独而无助。"
 pakt_collapse.16.a: "暴君必尝恶果。（拉丁语）"
 pakt_collapse.16.b: "愿上帝保佑我们。（德语）"
 pakt_collapse.16.c: "雄鹰不再哭泣。"
 pakt_collapse.18.t: "[Get_newspaper_header]英伦群岛离开团结协定"
 pakt_collapse.18.desc: "随着第二次西俄战争的余波中德国实力的幻象消散，英国和爱尔兰政府在仅仅数小时内相继决定结束与这位前“欧洲主宰”的近三十年合作的关系。\n\n每个国家的反应都不尽相同，奉行合作主义的英国政府对自己的国家被逐出日耳曼统治区感到非常愤怒，而爱尔兰政府则举行了大规模的庆祝活动。现在，随着外国外交官和企业大举进入这两个国家，这场自第二次世界大战以来最残酷的战争所造成的伤亡似乎远远超出了战场。"
 pakt_collapse.18.a: "骑士的遗产仍在延续。"
 pakt_collapse.18.b: "反正德国从来没给过我们什么好处……"
 pakt_collapse.18.c: "但我们赢回来了！"
 pakt_collapse.18.d: "多姆维尔气得想把棺材板掀了……"
 pakt_collapse.18.e: "保持微笑，就像往常一样……"
 pakt_collapse.19.t: "[Get_newspaper_header]爱尔兰离开团结协定"
 pakt_collapse.19.desc: "随着第二次西俄战争后德国威力的幻象烟消云散，作为团结协定的少数自愿成员之一，爱尔兰基于“外交环境变化”和“民意”的考量，决定撤销其在曾经是霸主的“团结协定”中的观察员地位。\n\n岛国共和国上下报告了大规模庆祝活动，不论是新教徒还是天主教徒都因国家摆脱了日耳曼势力范围而欢欣鼓舞。如今，随着美国外交官和企业纷纷进驻爱尔兰，看来这场自第二次世界大战以来最残酷的战争造成的伤亡远远超出了战场。"
 pakt_collapse.19.a: "德国一直都是自由之敌。"
 pakt_collapse.19.b: "好时代，来临了！"
 pakt_collapse.19.c: "投机的伪君子！"
 pakt_collapse.19.d: "翡翠之岛更耀眼了。"
 pakt_collapse.21.t: "外强中干"
 pakt_collapse.21.desc: "马丁今天感觉自己已经第五百次抠着拇指上的干燥皮肤了。自从三年前来到这个被遗弃的岛屿以来，他一直在倒数日子，不，是秒数，直到他能离开这里。无论他在执勤还是在床上，时间的箭头都过得异常缓慢而痛苦。更糟糕的是，他时刻处于饥饿的状态，这是这个地区被遗忘的实际结果。他的制服褪色而破旧，床硬得又崎岖，即使是香烟，也在你抓住它们之前就已经烂掉，更别提能够抽上一口了。他只能凝视着无尽的海洋，一天天虚度。\n\n当战争在欧洲重新爆发时，他迫切希望离开，但不行。他是那些被迫留下的“幸运儿”之一，除了现在他所在的守备队比以前更加人手不足、武器不足、补给不足。马丁不知道为什么这种缓慢而充满汗水的死亡在与莫斯科可能遇到的快速而光荣的死亡相比下竟然被称作“幸运”。他只想脱掉这身制服，离开这个岛屿。他愿意为了一夜好眠和三顿丰盛的饭菜付出任何代价。他愿意做任何事情——\n\n一阵子弹呼啸着从马丁的头旁飞过，将他从他脑海中所想的热腾腾的饭菜和雪白的牧场中惊醒。受到纯粹的肾上腺素和基础训练的推动，他伸手拿起毛瑟枪，朝他猜测子弹发射方向开火。\n\n卡壳了。当然会这样。多年不用和海水的腐蚀使得他的枪只剩下华丽的摆设。如今，这个饥饿的士兵陷入了真正的恐慌，他转身从海岸边狂奔而去。然而，不幸的是，他的逃生行动很快被一群日本士兵阻止了，他们设法在战术上胜过了——甚至比智商高过——马丁，让他重重摔倒在参差不齐的地面上。\n\n马丁浑身冷汗和鲜血，面对着无数支步枪指向他，他不禁发出一声咯咯笑，对他在德国国防军中无聊至极的服役方式感到出乎意料的结束。至少日本人或许真的会给他提供食物。"
 pakt_collapse.21.a: "三思而后行。"
 pakt_collapse_21_tt: "§Y我们已掌控了§R马达加斯加§!。松尾恳宇是我们的§y骄傲§!！"
 pakt_collapse.22.t: "雄鹰的陨落"
 pakt_collapse.22.desc: "好消息！可怕的“团结协定”终于解散了，它曾是地球陆地面积近五分之一的主宰和监督者，但最终在自身的贪婪和傲慢之下土崩瓦解。\n\n在我们国家的每个角落，男男女女、年轻人和老年人、左派和右派，人们跳舞欢呼。其中一些人亲身经历过德国及其疯狂追随者的不公。其他人则是那些被带走的人的儿女、父母、兄弟姐妹，他们只剩下淡忘的记忆和干涸的眼泪。还有更多人只是对全球反对不义和暴政的斗争表示同情，自豪地尽自己的一份力量，不论大小，确保法西斯主义最终被击败。\n\n然而，在世界的一些公寓和村落的角落，有些人默默流泪。也许他们仍然相信这些褐衣恶魔腐朽的谎言，陶醉在噩梦般的宣传中。或者更宽容地说，他们只是被时间的推移所压倒，成为历史的标志。\n\n但无论他们的理由如何，我们不会让他们的痛苦阻碍我们的喜悦。所以，干杯！为了一个没有苦难、压迫和痛苦的新秩序！为了那些为我们看到这一天、为了那样一个明天而牺牲的男男女女，让我们提个祝福！"
 pakt_collapse.22.a: "值得纪念的一天。"
 pakt_collapse.23.t: "[Get_newspaper_header][ENG.GetName]离开团结协定"
 pakt_collapse.23.desc: "随着第二次西俄战争的爆发，人们对德国实力的任何幻想都已烟消云散，[ENG.GetNameDef]，团结协定最坚定的合作成员之一，鉴于 \"不断变化的外交环境 \"和 \"日益增长的布尔什维恐怖\"，选择取消其在曾经称霸的团结协定中的成员资格。\n\n据报道，从多塞特到邓迪都出现了大规模恐慌，各色法西斯分子因国家突然脱离日耳曼势力圈而暴动。现在，随着外国外交官和企业大批迁入该国，这场自第二次世界大战以来最残酷的战争所造成的伤亡似乎远远超出了战场。"
 pakt_collapse.23.a: "骑士的遗产仍在延续。"
 pakt_collapse.23.b: "那就一个人受苦吧。"
 pakt_collapse.23.c: "多姆维尔气得想把棺材板掀了……"
 pakt_collapse.23.d: "保持微笑，就像往常一样……"
