 IJN_Administration: "马达加斯加"
 IJN_Administration_DEF: "大日本帝国海军马达加斯加管理部门"
 IJN_Administration_ADJ: "马达加斯加"
 MAD_Keiu_Matsuo: "松尾恳宇"
 MDG_Keiu_Matsuo_desc: "什么使一个男人成为男人？对于某些人来说，那是荣誉，因为没有什么比通过你现在的行动来感谢你祖先过去的行动更伟大的了。对于其他人来说，那是服务，因为最伟大的人塑造出比最明亮的星星更耀眼的传世之作。\n\n然而，对于松尾恳宇来说，那是冒险。不冒险就意味着失去一切。他的生活就是这个事实的证明。\n\n作为两位教师的孩子，恳宇追求海军事业。在1938年毕业时，他似乎注定只是众多士兵中的一个。悉尼改变了一切。尽管面临万难，他挤进潜艇，将三艘战舰送入海底。凭借一次冒险，他的命运急速上升，战争结束时成为西南地区舰队的海军上将。男孩已成为男人。\n\n但令他震惊的是，他回到的日本并不愿承担风险，满足于成为自己命运的旁观者。在整个大东亚共荣圈中，他看着泛亚精神变得衰弱无力。他知道这是不能接受的。他必须做些什么。他必须再次冒险。\n\n现在，这一切都得到了回报。日本帝国海军的旗帜在马达加斯加卢高高飘扬，他准备塑造其命运。瘟疫、游击队都无关紧要。因为对他来说，尽管已经年迈，引导他的同胞的日本的灵魂、本质仍然是一个孩子。\n\n他将向它展示如何成为一个男人。"
