 HANGINGJUDGE_Walther_Wenck: "瓦尔特·温克"
 POLITICS_HANGINGJUDGE_Walther_Wenck_DESC: "瓦尔特·温克其戎马生涯可谓一以贯之。他曾作为第一装甲集团军的参谋长崭露头角，随后又在东线统帅过数支赫赫战功的军团，在对抗苏维埃联盟的战争中屡建奇功，并对其最终的覆灭扮演了举足轻重的角色。然而，即便身经百战，这些过往的经验也未能让他对战胜这个“新”俄罗斯将意味着什么，做好分毫准备。如果，那真的还能被称之为一场胜利的话。\n\n命运弄人，仿佛一个充满讽刺意味的玩笑，他如今似乎注定要在其生命与军事生涯的黄昏残照之中，日复一日地凝望着西俄罗斯仅存的残骸——这片焦土与仍在冒着余烟的废墟，而他，便是它们的看守者。他曾是国家授勋的荣耀军官，深信自己无所不能，任何任务皆不在话下。他一度是这么想的。\n\n每一天，难民的队伍都在无休止地延长。在这片土地上尚能勉强运作的避难所里，早已人满为患，挤满了遭受着不同程度辐射中毒、脱水、烧伤或饥饿折磨的病患。雪上加霜的是，乌拉尔山脉以东，黑色联盟的残余势力与党卫军仍在彼此倾轧，将他们的战争恐怖散播开来，令这已然悲惨的景象更添一层阴霾。面对此情此景，他的部下们发现，自己已然不像昔日的占领者，反倒更像是勉力维持秩序的维和部队，他们日夜不休地竭力应对这场堪称史无前例、且每日愈发严峻的人道主义灾难。\n\n温克对此束手无策。毕竟，又有何人能够应对如此局面？然而当他凝望着放射性尘埃缓缓沉降，硝烟渐渐散去，他也只能挽起袖管，埋首苦干，试图在这场区域性的末日浩劫之中，收拾那些破碎的残局。他如此行事，并非出于对德意志的赤胆忠心，亦非恪守军装赋予他的神圣职责。\n\n而是出于对他曾经视之为不共戴天之敌的人们，那份油然而生的怜悯。"
 HANGINGJUDGE_Alexander_Barkashov: "亚历山大·巴尔卡绍夫"
 POLITICS_HANGINGJUDGE_Alexander_Barkashov_DESC: "在莫斯科维恩那烟雾缭绕的废墟之上，德意志的阴影依旧笼罩着战败俄罗斯的累累白骨，亚历山大·巴尔卡绍夫于此崛起。他，正是德意志迄今为止最为扭曲变态的实验所催生的恶果。他是整整一代人被强行同化入民族社会主义意识形态后诞下的畸形子嗣。其结果便是，巴尔卡绍夫既非傀儡，亦非反叛者。恰恰相反，他是一个心甘情愿的狂热信徒，一尊弗兰肯斯坦式的“完美”杰作，一个将不惜一切代价维持俄罗斯废土秩序的所谓“俄罗斯超人”。\n他的信仰，乃是阿尔伯特·施佩尔当年试图“改造”莫斯科维恩的遗毒。那时，孩子们被成批地从父母身边夺走。他们手中捧着的不再是书本，而是希特勒青年团的手册，日复一日地被灌输纳粹主义的教条。当老一辈的俄罗斯人还在紧抱着那些支离破碎的反抗记忆不放时，巴尔卡绍夫这一代人却学会了卑躬屈膝——并且在日后，将这种卑躬屈膝合理化，融入了他们自己那套关于种族的扭曲理念之中。\n对于新生代的俄罗斯人而言，巴尔卡绍夫俨然是一位救世主——一个将带领俄罗斯民族晋升，与他们的日耳曼兄弟并驾齐驱的伟人。而对于老一辈人来说，他不过是一个令人作呕的军阀头子。有些人选择屈服，但更多的人，仅仅是无奈地接受了这些新的、本土的统治者。对巴尔卡绍夫而言，这笔账算得很简单：只要莫斯科维恩能够存续，俄罗斯终将崛起，与德意志平起平坐。"
 HANGINGJUDGE_Gustav_Wagner: "古斯塔夫·瓦格纳"
 POLITICS_HANGINGJUDGE_Gustav_Wagner_DESC: "形单影只。古斯塔夫·瓦格纳，此刻的确是孤身一人。然而，他依旧步履蹒跚地向前挪动，因为除此之外，他已别无所长。\n\n在这片土地燃起滔天烈焰、苍穹分崩离析之前，谁也未曾想到瓦格纳所能统领的，会超出那么一小撮无可救药的杀人狂魔；而事实也终将证明他们所料不差。然而，就是这伙杀人狂魔，全然是拜命运所赐，也只能是拜命运所赐，才获得了远超其自身价值的重要性——只因它注定要投身于其此生所能经历的最后一战。然而，这场战争却与以往任何一场都截然不同。每一天，都有又一名手下殒命。每一天，都有新的地堡、坑道或城镇被发现，迫使瓦格纳用其日渐枯竭的兵员去进行得不偿失的惨烈交换。每一天，他们都在向这世上仅存的同类们步步靠近，而这个世界本身，却因此而无情地惩罚着他们。\n\n瓦格纳看得出败亡之兆已现；他看得到那份份伤亡报告，看得见日渐罄尽的食物储备，更看得见那令所有人脱发、眩晕、七窍流血，却又无形无影、如影随形般纠缠着他们的无名瘟疫。他深知他们很可能彻底失败，很可能在抵达目的地之前便已殒命，甚至可能在最终获胜之后依旧难逃一死。过去数年间，他无时无刻不在咀嚼着这些残酷的事实。但他唯一无法想象的，就是停下脚步——无论是现在，还是将来，都绝无此念。他仿佛一个盲人，之所以还能继续前行，全凭着亲手断绝身后与身旁的每一条退路，以此确保留给自己的，唯有那一条孤零零的绝路可走。\n\n不成功，便成仁。世界才不在乎究竟是哪一种结局呢。"
 HANGINGJUDGE_Gustav_Wagner_Victory: "古斯塔夫·瓦格纳"
 POLITICS_HANGINGJUDGE_Gustav_Wagner_Victory: "多年以来，古斯塔夫·弗兰茨·瓦格纳曾将诸多头衔加诸己身——对于这位自诩为祖国英雄、地位仅次于元首本人的他而言，还有什么名号能更与之相称呢？“还有什么呢？”他沉吟着——“还有什么呢？”他大声自问。然而不幸的是，这片俄罗斯的废土，似乎已决意要给他一个答案。\n\n只因那头野兽、那匹恶狼、那个除了执行最卑劣的勾当之外便一无所能的愚钝屠夫，其动机亦不过源于最卑劣的情感，其思绪亦不过盘旋于最卑劣的念头。如今，已然成了个作茧自缚的囚徒。即便黑色联盟的败亡是何等彻底、何等干净利落，他从中也未曾体验到丝毫的胜利喜悦，更遑论狂喜。无论他如何一遍遍地念叨着，如今也只能对他自己念叨。俄罗斯的灭亡也未能带给他分毫满足之感；他孤身驻守于乌拉尔壁垒，号称要坚定捍卫一切日耳曼之物——至少，日耳曼尼亚那片废墟上的官方说辞是如此宣称的。\n\n然而，瓦格纳比任何人都更清楚这场闹剧背后的真相：即便被他自诩拯救过的人们，也并不待见他；他已被流放，被派去抵御来自东西两线的所谓“敌军”——他自己口中的“部落大军”。然而，即便是这种说法，也与事实相去甚远，因为如今留给他的，无非是偶尔需要处决几个不长眼的蟊贼，或者打发掉几个前来劫掠的拾荒者罢了。在这片昔日世界交汇之所，欧亚大陆于此分野又于此相融的边界线上，瓦格纳所能做的，已不过是掐灭人类文明仅存的几缕残焰——而那些星火，本就稀疏遥远，日渐黯淡。这便是他仅剩的一切，无论是来自日耳曼尼亚的弥天大谎，抑或是他自己的自欺欺人，都无法驱散这个平庸而残酷的真相。"
 HANGINGJUDGE_Alexander_Lazarenko: "亚历山大·拉扎连科"
 POLITICS_HANGINGJUDGE_Alexander_Lazarenko: ""
 HANGINGJUDGE_Heinz_Gunther_Guderian: "海因茨·君特·古德里安"
 POLITICS_HANGINGJUDGE_Heinz_Gunther_Guderian_DESC: "身为传奇指挥官海因茨·古德里安之子，君特如今所处的职位，与其父当年相差无几。大约四十年前，君特的父亲曾一马当先，统领着隆隆作响的装甲洪流，席卷比荷卢，直捣法兰西。如今，他的儿子正亦步亦趋地追随着其父的足迹，尽管其处境要严峻得多。\n\n他所身处的职位，不仅助长了残暴，几乎可以说是强制推行残暴。尽管如此与他的同僚们相比，他仍显得颇为特立独行。是的，对于任何反抗行为，他依旧会迅速采取报复手段，严惩责任人及其株连者。但大多数情况下，反抗行为本就稀少，德方的监管也就相对克制了。加之当地民众在亚佐夫黑色联盟数十年的严酷统治下早已不堪其苦，对于德意志的接管几乎是持欢迎态度，因此，与其他新近获取的德意志领地相比，突厥斯坦专员辖区竟出人意料地稳定。\n\n然而，君特对此却不怎么上心。只要资源能够源源不断地输送，只要那些坦克还能正常开动，他便心满意足了。而只要他心满意足，哈萨克人便能免遭那些在德占西伯利亚地区司空见惯的恐怖厄运。"
 HANGINGJUDGE_Alexander_Lazarenko_Victory: "亚历山大·拉扎连科"
 POLITICS_HANGINGJUDGE_Alexander_Lazarenko_Victory_DESC: ""
 HANGINGJUDGE_Igor_Rodionov: "伊戈尔·罗季奥诺夫"
 POLITICS_HANGINGJUDGE_Igor_Rodionov: "参加过§R第一次大审判§!的老兵同志们，我是你们的新任指挥官。\n总司令德米特里·亚佐夫辜负了我们，也辜负了俄罗斯母亲，正如那些曾在战场上英勇奋战，却最终在祖国危难之际功亏一篑的她的子孙们一样。\n然而，他们为祖国作出的无私奉献，绝不会白费。西方的野兽已因我等众志成城的努力而身负致命重创。趁其流血衰弱之际，我们将依托我们坚固的民族堡垒，恢复我们国家的力量。\n现在不是哀悼之时，而是埋头苦干、重蓄力量之际。今日我等袍泽兄弟姊妹倒下之处，明日即是我等奏响凯歌之地。\n§R老兵同志们，第二次大审判已迫在眉睫。§!我们的事业是正义的。胜利必将属于我们。晚安。"
 HANGINGJUDGE_Dmitri_Dmitriyevich_Vasilyev: "德米特里·德米特里耶维奇·瓦西里耶夫"
 POLITICS_HANGINGJUDGE_Dmitri_Dmitriyevich_Vasilyev_DESC: ""
 HANGINGJUDGE_Konstantin_Ageev: "康斯坦丁·阿格耶夫"
 POLITICS_HANGINGJUDGE_Konstantin_Ageev_DESC: "康斯坦丁·阿格耶夫的政治生涯堪称非同寻常。一切始于俄国内战，战火将他带到了满洲，在那里他加入了浅野部队。其后，他又同众多流亡者一样，最终辗转至哈尔滨。尽管他心向沙皇，却也曾在大动乱时期于罗扎耶夫斯基的麾下担任步兵军官，但命运最终还是将他带回了满洲。\n\n一度沉寂之后，当亚佐夫统一俄国并向大东亚共荣圈的后院发起军事行动时，他与日本盟友间的旧日关系为他开启了新的机遇之门。他被迫重新将目光投向俄国，尤其是在所谓的§R大审判§险些引爆全面战争的关头。那场战争最终以灾难告终：德军长驱直入，兵临乌拉尔山下；而随着国家堡垒的崩溃，西伯利亚亦陷入了无政府的深渊。眼见大势已去，日本方面迅速做出反应，组建了一支由前流亡者领导的部队，向西伯利亚南部进发。\n\n对于重返这片他命运的起点，他曾一度犹豫，但与日本合作以图复辟俄罗斯帝国的机会，却是他无法拒绝的邀约。历经万般磨难，这或许已是见证沙皇宝座重归俄国的最后契机。如今，他再度投身于这场旨在复兴伟大俄罗斯帝国的战斗之中。在日本的支持下，他坚信自己能够实现那个自白军兵败以来便萦绕心头的夙愿。"
 HANGINGJUDGE_Emil_Spiridonov_Epilogue: "埃米尔·斯皮里多诺夫"
 POLITICS_HANGINGJUDGE_Emil_Spiridonov_Epilogue_DESC: "大审判的劫火过后，人人都以为一切终将落幕。俄国究竟还要多少次沉沦于无政府的深渊，一次次浴火重生，又一次次跌入更深的绝望？这无休无止的轮回，何时方能迎来终焉？每一位域外的观察者都得出了相同的论断：永无宁日。\n\n但他们错了。\n\n太平洋舰队统帅，埃米尔·尼古拉耶维奇·斯皮里多诺夫，他成功地挥师西进，将俄国破碎凋零的残骸再度凝聚，缔造了一个东抵太平洋、西至乌拉尔壁垒的新生共和国。在他的悉心擘画之下，他将这个濒临崩溃的国度从悬崖边拉回，抚平了黑色联盟癫狂肆虐所留下的累累伤痕。\n\n凭借西伯利亚丰饶的沃土，依托着与自由国家组织的友好邦交，斯皮里多诺夫正迈向他作为俄罗斯共和国民选总统的第三个、也是最后一个任期——这本身就向世界昭示：自由与解放的火种纵然黯淡，却从未熄灭。\n\n而前路漫漫，复兴大业尚有诸多未竟之功。俄国广袤的主权疆域仍沦于乌拉尔壁垒之西，国家的真正一统，尚需数十载砥砺前行。但至少在当下，俄罗斯之梦已不再是遥不可及的泡影。在斯皮里多诺夫的守护之下，无数俄国人民的心中，重新燃起了一种久违的情感。\n\n那便是希望。"
 HANGINGJUDGE_Nikita_Romanov: "尼基塔·罗曼诺夫"
 POLITICS_HANGINGJUDGE_Nikita_Romanov_DESC: "一个世纪以来，俄罗斯帝国所遭遇的，唯有无尽的屈辱。在革命的洪流中失落，俄罗斯的无政府状态曾为那伟大的复辟带来一丝微茫的希望，然而，随着黑色联盟的崛起及其父辈的失势，这一切终究未能如愿。\n\n但尼基塔·尼基季奇·罗曼诺夫并非他的父亲。在东京盟友的鼎力支持下，沙皇将再也不会屈从于白军反复无常的意志，更不会因内部分裂与纷争而倾颓。他收拾起西伯利亚计划的残局，号召仅存的寥寥数位保皇党人加入他的事业，最终成功地在西伯利亚帝国境内开创了属于自己的命运。\n\n当沙皇重建他的领地，并集结帝国军队的残余力量之时，他心中明了，倘若此次失败，他将再无继任者，更不会再有第三次机会。在他的旗帜之下，双头鹰徽要么将再次发出胜利的呐喊，要么便在黑暗中与保皇主义最后的余烬一同彻底熄灭，永世沉沦。\n\n然而正是这般严峻的处境，反而愈发坚定了尼基塔的决心。他将不惜一切代价，竭力确保帝国的存续。他将战斗至最后一刻，誓要亲眼目睹俄罗斯在他的统治下重归一统。当帝国大军向西挺进，直指乌拉尔壁垒之时，他将发出最后的宣言：\n\n帝国将永不再蒙受如此奇耻大辱，此乃全俄罗斯沙皇之意志。"
 HANGINGJUDGE_Emil_Spiridonov: "埃米尔·斯皮里多诺夫"
 POLITICS_HANGINGJUDGE_Emil_Spiridonov_DESC: "联盟土崩瓦解而俄罗斯陷入无政府状态之际，许多前苏维埃军官被卡尔贝舍夫及其黑色联盟的理念所感召，纷纷投身其中。海军军官埃米尔·尼古拉耶维奇·斯皮里多诺夫便是其中之一。这位天赋卓绝的潜艇艇长，凭借其精湛的技艺与非凡的胆略，最终执掌了黑色联盟的太平洋舰队。然而，好景不长。目睹着假复仇之名犯下的暴行愈演愈烈，亚佐夫的穷兵黩武令他日益心生幻灭。\n\n于是，当那道针对大东亚共荣圈，指令太平洋舰队发射核武的命令最终下达之时，斯皮里多诺夫毅然选择了抗命，率部哗变。他的这一抉择，不仅使数百万无辜者免于毁灭，更让难以计数的生灵逃离了核战争那灭世的恐怖。\n\n于是，当枪声渐息，联盟的旗帜纷纷降下，他发现自己竟阴差阳错地扮演起远东维和者的角色，肩负起稳定一方的重任——这无疑是他此前在最不羁的梦中也未曾料想过的境地。如今，万千民众视他为安全的港湾与前进的灯塔，身后的太平洋舰队是他最坚实的倚仗。这位昔日默默无闻的潜艇兵，正厉兵秣马，准备迎接一场最后的搏杀。\n\n他誓要将俄罗斯从一切暴君的铁腕下解放出来，无论其来自俄国境内，抑或境外强敌。"
 HANGINGJUDGE_Erich_Topp: "埃里希·托普"
 POLITICS_HANGINGJUDGE_Erich_Topp_DESC: "埃里希·托普谈不上快乐。\n\n作为骑士十字勋章的获得者，托普的海军生涯始于三十年代初期，彼时民族社会主义的思潮正在德意志生根发芽。他对这一思想的赤诚，与他在同期军校生中名列前茅的优异成绩相得益彰。在第二次世界大战及后来的西俄战争中，他指挥U型潜艇屡建奇功，逐渐成为德国海军发展中举足轻重的人物。毕竟，他不仅在大西洋重创了盟军，还在白海巧胜了苏军战线。\n\n但时光流逝，希特勒的健康每况愈下，大日耳曼国亦摇摇欲坠，他对那套思想的信念也随之消退。过去的数十年里，他本满足于领着军官的薪水，在办公室处理文书工作，直至其计划被黑色联盟的崛起所打破。面对如此压倒性的威胁，他被重新召回现役，负责收拾他们在北冰洋已是强弩之末的海上战事。\n\n如今，他的目光时刻警惕着俄国屈指可数的幸存港口以及北方的浮冰群。他往来巡弋，勉力维持着北方航道的补给线——这个职位可没什么人会羡慕。对于那些他不得不与之周旋的俄国人而言，能在他手下效命，相比于落到他那些更为“忠贞不二”的同僚手中，已属万幸。\n\n但对托普而言，他只想回家，与这一切彻底脱离干系。"
 HANGINGJUDGE_Georg_von_Boeselager: "格奥尔格·冯·伯泽拉格"
 POLITICS_HANGINGJUDGE_Georg_von_Boeselage_DESC: "五十年来，沃尔库塔古拉格的森森长廊之中，游荡着数十万埋骨于此的冤魂。纵使寒风席卷冰封苔原，挟着黑色联盟覆亡后的辐射尘埃北上，此地亦不得安宁。新的灾星已降临于此：格奥尔格·冯·伯泽拉格。\n\n作为莫斯科维恩全境游击队员的死神，自巴巴罗萨行动伊始，冯·伯泽拉格便在此地指挥了无数次成功的剿匪与反暴乱行动。纵然年岁渐长，其手段之酷烈未减分毫。大规模流放与即刻处决，是他应对游击队猖獗地区的惯用伎俩。尽管无数次死里逃生，他严酷的铁腕依旧。\n\n如今，他的魔爪已伸向北方，牢牢钳制着涅涅茨堡垒——那里是黑色联盟的残兵败将与同情分子们通往坟墓的最后一站。在他的监视下，那些徘徊于沃尔库塔古拉格的无名枯骨与被遗忘的死魂，只会日渐增多。在这场针对俄罗斯人民、不断升级的残酷竞赛中，他决心要让对方先眨眼，屈服于德意志。"
 HANGINGJUDGE_Werner_Molders: "维尔纳·默尔德斯"
 POLITICS_HANGINGJUDGE_Werner_Molders_DESC: "维尔纳·默尔德斯投身于德意志的连番战事，仿佛已将一生尽数耗掷。他初沐战火于西班牙，为秃鹰军团效命；此后转战法兰西，继而是东线。时至今日，他盘旋于苍穹的岁月，恐怕早已远超脚踏实地的光阴。如今，其军旅生涯与人生已然步入迟暮，他又领受了一项使命——此番，只盼能换得余生再不必重披战袍。\n\n身为驻扎在萨哈广袤腹地的“默尔德斯”战斗机联队指挥官，他与麾下飞行员们日夜追猎着鄂木斯克空军的残党。这支残军败将时常从他们数不尽的地下工事与秘密机场中倾巢而出，袭扰着穿行远东的德军将士与空中运输。这确是一桩苦差，当地人怒目而视，物资时常告罄，更有那炼狱般的酷寒如影随形，无时无刻不在阻挠着任务的进展。在此等险境下，默尔德斯不仅要对抗俄国人，更要与狂风搏斗。即便如此，他依然选择亲自驾机升空，从不甘于袖手旁观。\n\n此项任务，他将矢志不渝，直至魂归九泉。然而，若能以此为最终胜利扫除一架俄军战机，纵粉身碎骨，亦在所不惜。"
 HANGINGJUDGE_Wilhelm_Monke: "威廉·蒙克"
 POLITICS_HANGINGJUDGE_Wilhelm_Monke_DESC: "胜利必有代价，此言德意志早已刻骨铭心。三场胜仗亦未能平息罗斯故土的叛乱烽火。自东方，亚洲部落如潮水般汹涌而至，不洁之众妄图叩关劫掠，觊觎祖国腹地。此景绝不可再现。\n\n威廉·蒙克，德意志最忠诚的子嗣之一，肩负着确保此誓的重任。为达成使命，他回归了最原始的解决之道：一堵墙。乌拉尔山脉本已是天险，如今，在新成立的党卫队乌拉尔壁垒集团军最高司令部的主持下，将得到进一步加固。成千上万的工程师与被强征的当地民伕，将在乌拉尔的峰峦与隘口间修筑碉堡、树立防御工事、布设雷区。\n\n代价无疑将是巨大的，蒙克深知自己将无缘得见此墙大功告成之日。毕竟，除了筑墙，党卫队还肩负着一项崇高使命——清洗掉巨墙德意志一侧的所有原住民。其激烈程度虽不及他曾投身其中的累累战火，但这项任务不过才刚刚拉开序幕。即便如此，他仍毅然前行，准备为祖国赴汤蹈火，在所不辞，一如他自1933年以来始终所为那般。"