 GER_2WRW_endsieg: "最终的胜利"

 GER_WW3_gotterdamerung_POSTNUKE:0 "诸神的黄昏"
 GER_WW3_gotterdamerung_POSTNUKE_desc:0 "不可避免的时刻已然降临，正如世人所担心的那般，超级大国之间终于爆发了战争！\n\n如同以往两次世界大战那样，为了赢得这场战争的胜利，我们必须全力以赴。只有动员一切可以发动的力量，我国才能赢得胜利。\n\n为了德意志，即使粉身碎骨也在所不惜！事已至此，我们绝不能向外国人低头，我们辛苦所建立的一切，绝不容他们随意摧毁！"
 GER_WW3_to_the_frontlines_POSTNUKE:0 "到前线去"
 GER_WW3_to_the_frontlines_POSTNUKE_desc:0 "我们目前部署在前线的人员数量根本不够。对于这样一场遍及全球、无处不及的战争，我们的军队必须有足够的人力多线作战。如果我们要赢，我们就需要更多人。"
 GER_WW3_to_the_factories_POSTNUKE:0 "到工厂去"
 GER_WW3_to_the_factories_POSTNUKE_desc:0 "很简单，讲真。每个德国公民都必须为战争尽一份力。如果你是个没有应征入伍的男性，那么你就应当参与战时工业，挥洒辛勤汗水。女性也应当被召集起来，投入战斗。每一个公民都应当为我们的战争服务。每一双手都很重要！"
 GER_WW3_totaler_krieg_POSTNUKE:0 "总体战"
 GER_WW3_totaler_krieg_POSTNUKE_desc:0 "尽管很少有人愿意，但我们别无选择，且再不能拖延。我们必须像我们以前一样调整我们的经济。我们制造的每一件商品都将以某种方式为战争服务，而任何非必要的消费品都将被舍弃。在一个每一颗子弹，每一磅炸药，每一支步枪都弥足珍贵的年代，我们负担不起消费品的生产。"
 GER_WW3_finishing_the_job_POSTNUKE:0 "完成未竟事业"
 GER_WW3_finishing_the_job_POSTNUKE_desc:0 "对美战争将是我们的最后一战。\n\n我们上一次的对决基本上是以打平结束。美国或许受了不小的委屈，但他们绝没有屈服。二战结束时，他们依旧保有无可匹敌的工业，依旧强大的海军和规模巨大，但从未经历过大规模战斗的陆军。\n\n这次战争会有所不同。我们将再启二十年前未竟的事业。美利坚巨人将被德意志一劳永逸地折辱和击败！"
 GER_WW3_secure_the_isles_POSTNUKE:0 "控制英伦三岛"
 GER_WW3_secure_the_isles_POSTNUKE_desc:0 "我们通往美洲的第一个踏脚石就是不列颠群岛。在我们开始大规模增加海军陆战队数量的同时，我们同样会给英国人一个机会，让他们屈从于我们的要求。英吉利海峡对岸诸国将得到一个简单的通牒。他们要么臣服于我们，加入对抗美国的战争，要么就被强大的国防军击溃！"
 GER_WW3_amerika_bomber_POSTNUKE:0 "亚美利卡轰炸机"
 GER_WW3_amerika_bomber_POSTNUKE_desc:0 "二战期间，“亚美利卡轰炸机”的概念诞生了。该计划希望设计一款其航程与生存能力能支撑其飞越大西洋，并在美国东海岸掷下大量炸弹的长距战略轰炸机，它还必须在之后返回欧洲。\n\n这个项目很快就被放弃了，我们的父辈没有技术与资源来完成如此雄心勃勃的项目。但今天，他们的梦想将化为现实！\n\n我们有技术也有资源。我们只需要将它们结合，再加上些德意志的天才就能完成。"
 GER_WW3_operation_alaric_POSTNUKE:0 "亚拉里克行动"
 GER_WW3_operation_alaric_POSTNUKE_desc:0 "我们与旧盟友命中注定的战争已经爆发了。意大利十数年来都在坚定地妨害德意志的一切行动，那些忘恩负义的叛徒不仅谋划着让我们亡国，同时还以政治联盟和“大国博弈”等方法与我们对抗。好吧，他们是学不会适可而止的。\n\n我们很快就会一劳永逸地和意大利算总账。没有什么东西能比复杂的政治联盟网更能决定我们的未来了，但无论如何，只有战争才能结束敌我之间的敌对状态。"
 GER_WW3_over_the_alps_POSTNUKE:0 "越过阿尔卑斯"
 GER_WW3_over_the_alps_POSTNUKE_desc:0 "征服意大利根本不需要什么精心策划的宏伟方案。想要一剑封喉，我们不用大费周章地先在非洲和中东开拓战场，粉碎他们的殖民地。有时候，越简单越有效；我们将直面意大利这条猛虎，向罗马进军。\n\n而们前进的最大阻碍便是雄伟的阿尔卑斯山。假设我们真的要将我们的军队和补给送上去，就必须确保瑞士控制的地区在我们手中。即使我们的小伙子们已经在为山地战训练，用上了最新的装备，我们还是应该先给瑞士发一份最后通牒；要么让我们通过你们的国家，迈过那些山口；要么我们就自己来控制并保护它们。"
 GER_WW3_endsieg_POSTNUKE:0 "§R最终胜利§!"
 GER_WW3_endsieg_POSTNUKE_desc:0 "异国军队正在我们的国土上行军。尽管我们尽了最大的努力，战争还是对我们不利，我们无法扭转局势。\n\n我们的可选项每个小时都在减少：现在，我们别无选择，唯有一途。向我们的敌人发射核武器。这是唯一的解决方案，能让德国保住颜面的唯一手段。最终的胜利将属于我们。尽管代价会很昂贵，但在§R最终胜利§!面前，哪怕付出一切……"

 SGR_RUSSIAN_WALL_START: "开启罗斯兰边境墙计划"
 SGR_RUSSIAN_WALL_START_desc: "无论我们如何宣扬自己的“优等民族”理论，现如今危机都已摆在眼前。莫斯科辖区之外的俄罗斯地区正逐渐统一，其将会在可预见的未来给我们造成严重威胁。\n为防止最坏状况发生，我们必须于边境修建一道巨型防御工事，这虽然会耗费我们海量的钱财，但其将保证我们免受俄罗斯的威胁。"

