 RUS_NTG_west_siberia: "重建§Y西西伯利亚苏维埃社会主义共和国§!"
 RUS_NTG_west_siberia_desc: "我们已然掌控西西伯利亚所有的重要城市。同志们，不断革命的第一步已经踏出！为了社会主义，为了新联盟！继续前进！"
 RUS_news.95.t: "[Get_newspaper_header]一个托洛茨基派的苏联？"
 RUS_news.95.desc: "今天是一个大多数俄罗斯人都未曾料到的日子。布尔什维克中的托洛斯基派成员在其所控制下的俄罗斯土地上成功推行了他们的政治主张。这支源于西西伯利亚下塔吉尔的红军，在托洛茨基之子列夫·塞多夫的指挥下，从西俄罗斯平原到西伯利亚腹地，一路战胜了他们在意识形态上的敌人。\n\n下塔吉尔明确宣告其核心目标：实现托洛斯基主义的核心理念，建立“不断革命”。多数外国观察家认为，这一主张目前已有所修正，旨在将俄罗斯人民从日本和德国的占领下解放出来，进而构建一个新的国际组织。\n\n如果这个新成立的苏维埃联盟真如其宣称的那样强大，那么德国人和日本人都要做好应对必然挑战的准备。\n"
 RUS_news.95.a: "换上新装的苏联"
