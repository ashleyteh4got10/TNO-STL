l_simp_chinese:
 TNO_anarchy_ZZZ_Great_Finale_tt: "§R寰宇废土§!"
 TNO_anarchy_ZZZ_Great_Finale_tt_delayed: "末日已至。\n\n人类不复存在。\n\n§x安息吧，此等错误不容重蹈§!"
 TNO_anarchy_ZZZ_Great_Mistrial_tt: "§R大审判之败局§!"
 TNO_anarchy_ZZZ_Great_Mistrial_tt_delayed: "大审判失败了。\n\n曾有人——无论是鲁莽之徒还是自信之辈都一度认为，此举将涤荡世界，肃清日耳曼之流——然而，此等预言，终究化为泡影，只因祖国大片疆土，此刻正在核武的洪流之下焚烧殆尽。如今，正是那些曾以为大审判必将凯旋的人们，在绝望、迷茫、瓦砾与遍地横陈的百万尸骸间，挣扎求存，只为苟活至明日。"
 SWRW_Omskmilestones.1.t:0 "[Get_newspaper_header] 攻占柯尼斯堡！"
 SWRW_Omskmilestones.1.desc:0 "关于东欧战事的资讯，俄军已经开进东普鲁士地区并占领了德国港口城市科尼斯堡。\n\n分析人士与各国政府未曾料到，这场致命的欧陆大战竟会以俄罗斯民族复国政府攻入德国本土而达至高潮，与此同时，这场战争似乎即将迎来终局。\n\n尽管团结协定官员拒绝对此做出评论，但独立信源证实，自元首及其幕僚神秘失踪后，国防军与德国民间已陷入骚乱与兵变的血色黄昏。无论如何，战火的喧嚣正预示终章的到来。"
 SWRW_Omskmilestones.1.a:0 "我们已经失去了一切，全部启动吧...（德语）"
 SWRW_Omskmilestones.1.b:0 "千仇将雪，万阻莫遏！"
 SWRW_Omskmilestones.1.c:0 "终于..."
 SWRW_Omskmilestones.2.t:0 "[Get_newspaper_header] 乌克兰沦陷"
 SWRW_Omskmilestones.2.desc:0 "联盟的军队已然控制了德国的面包篮。这是自三十年代以来，乌克兰首次落入俄国人手中。德国广播宣称，基辅、哈尔科夫及其他主要人口中心，已在旨在将国防军困于其据点之内的连番轰炸下化为一片焦土——此举已造成数千平民丧生。\n\n果不其然，黑色联盟对待被俘德军的手段酷烈至极：专员辖区的专员在众目睽睽的电视直播中被送上绞架；而联盟的政委们，对于那些被认定犯下处决德军战俘或违抗戒严令罪行的士兵，也只是施以“微乎其微而聊胜于无的惩罚”。随着战线不断西移，整个世界只能在不寒而栗的惊惧中，眼睁睁地目睹东欧沉沦于一片火海。"
 SWRW_Omskmilestones.2.a:0 "他妈的..."
 SWRW_Omskmilestones.2.b:0 "前进！"
 SWRW_Omskmilestones.2.c:0 "我们已经做到了这个地步？"
 SWRW_Omskmilestones.3.t:0 "[Get_newspaper_header] 高加索陷落"
 SWRW_Omskmilestones.3.desc:0 "军事广播与报刊文章证实，德军主力已撤出高加索地区。尽管南部仍有部分驻军负隅顽抗，但入侵的黑联部队已基本全面控制所有主要城市及战略要地。该地区作为纳粹殖民地数十载，其庞大的石油储备一经夺取，不仅瞬间提振了复兴政府的士气与资源储备，更使德国本已摇摇欲坠的经济形势雪上加霜！\n\n令人不安的报道揭露，占领军对俘虏和平民的人权完全漠视，任何拒绝服从联盟命令者都遭即刻处决或编入救赎旅。总的来说，德国政府显然已经失去一块重要领土，且极有可能在未来数月内失去更多。"
 SWRW_Omskmilestones.3.a:0 "天哪。"
 SWRW_Omskmilestones.3.b:0 "向着日耳曼尼亚，前进！"
 SWRW_Omskmilestones.3.c:0 "纳粹死期已至。"
 SWRW_Omskmilestones.4.t:0 "[Get_newspaper_header]东方领陷落"
 SWRW_Omskmilestones.4.desc:0 "随着联盟大军向西挺进德意志腹地，这颗昔日德国皇冠上的明珠——东方专员辖区，已然陷入重重围困。据交战双方传来的消息，当俄军试图攻入里加之际，爆发了自第二次世界大战以来最为惨烈、最为酷烈的战斗。俄军在里加城下，遭遇了从德意志精锐突击队到仓促间武装起来的本土民兵等一切力量的顽强抵抗。那些曾属于纳粹的电台，如今已彻底沦为联盟的宣传喉舌，其播送的画面显示，光复部队已接到明确指令，要对所有定居点，尤其是那些以德意志人口为主的聚居区，进行彻底的清洗与灭绝。据报，已有数千人惨遭俄军屠戮。\n\n鉴于德军对东方领的局势已然完全失控，德意志国防军主力已仓皇向波兰败退。数百万德国人与波兰人正被强行征召入伍，绝望地企图在维斯瓦河一线，对那汹涌而来的俄国人洪流进行最后的抵抗。"
 SWRW_Omskmilestones.4.a:0 "操他妈的，立刻马上把舍尔纳给我弄过来！"
 SWRW_Omskmilestones.4.b:0 "最后一搏！"
 SWRW_Omskmilestones.4.c:0 "所剩时日无多了…"
 SWRW_Omskmilestones.5.t:0 "[Get_newspaper_header] 俄罗斯大清洗！"
 SWRW_Omskmilestones.5.desc:0 "当大审判的怒火如烈焰升腾般席卷整个东欧之际，从俄罗斯流出的照片与新闻却披露了令人不安的消息——俄军最高统帅德米特里·亚佐夫正在处决多名军政要员。尽管官方未给出任何解释，但分析人士认为，这场清洗源于亚佐夫对欧洲战局进展的不满：战线已逐渐陷入类似于一战的僵持泥潭中。\n\n此次清洗波及军政体系的各个层级，其规模之大，甚至可以与希特勒的\"长刀之夜\"所匹敌。德国官员对此表示\"这种斯拉夫蛮子的行径早该料到\"。而亚佐夫却坚称，自己不过是在确保政府\"免受外部势力渗透\"。"
 SWRW_Omskmilestones.5.a:0 "他们在自取灭亡！现在是时候出击了！"
 SWRW_Omskmilestones.5.b:0 "他们都犯了不可饶恕之罪：失败..."
 SWRW_Omskmilestones.5.c:0 "他们真疯了？"
 SWRW_Omskmilestones.6.t:0 "核宣战"
 SWRW_Omskmilestones.6.desc:0 "那不敢想象的一幕，终究还是上演了。\n\n德国人选择与黑色联盟的恫吓摊牌，断定其不过是虚张声势。然而，他们的判断错得离谱，一败涂地。当德军向鄂木斯克城腹地进军之际，大地为之悲鸣颤抖。成百上千枚核武器，若非数以千计，已从发射井中呼啸而出。\n\n当这些末日的使者在轨道上静默巡行，缓缓迫近德意志本土之际，德国亦已着手准备，意图抹去其眼中世界地图上的所谓“污点”。女士们，先生们，这不仅将是新闻报道的终结，更是我们所熟知世界的末日。\n\n感谢您的阅读。"
 SWRW_Omskmilestones.6.a:0 "愿圣火烧尽这世界！"
 SWRW_Omskmilestones.6.b:0 "[GER.GetLeader]万岁！"
 SWRW_Omskmilestones.6.c:0 "陛下万岁！"
 SWRW_Omskmilestones.6.d:0 "自由世界必将捍卫！"
 SWRW_Omskmilestones.6.e:0 "抱紧你所爱之人。"
 Global_Conflicts.57.t:0 "[Get_newspaper_header] 沃尔特·延斯就任元首"
 Global_Conflicts.57.desc:0 "随着第二次德国内战的烽火渐息，那些曾对大日耳曼国反戈一击并最终获胜的国防军部队，如今已推举出他们自己的元首。瓦尔特·延斯，此人于1941年入党，曾是马丁·鲍曼麾下一位无足轻重的盟友，现在，他统治着这个饱受创伤的德意志——至少表面上是如此。\n\n延斯经验的匮乏使得许多分析人士推测，国防军依然大权在握，而任命他不过是为了对德国民众和国际社会掩盖这一事实。然则，无论他真正掌握多少权力，这或许都预示着自第二次西俄罗斯战争结束以来席卷德国的动荡行将终结，也预示着德国将从近期的毁灭性打击中开始复苏。"
 Global_Conflicts.57.a:0 "元首原则，但谁是真正的元首？"
 Global_Conflicts.58.t:0 "[Get_newspaper_header] 理查德·冯·谢拉赫被指定为下一任元首 "
 Global_Conflicts.58.desc:0 "在血腥镇压了数个异议派系，且业已覆亡的纳粹政权一败涂地之后，国防军领导的临时政府一直在重建那个失败政权的若干组成部分，甚至包括了鲍曼党内那些曾饱受诟病的各级官僚机构。尽管有这些相似之处，国防军却将所有形式的领导层都置于严密监管之下，其中便包括新当选的元首——理查德·冯·谢拉赫。\n\n作为约瑟夫·戈培尔的侄子，以及鲍曼的得力臂助，席拉赫对民族社会主义的正统教条与国家管理可谓驾轻就熟。然而，尽管他有意领导，席拉赫却似乎只是军政府一个心怀不满的傀儡元首，这一事实显然已在他与军队之间造成了紧张关系。"
 Global_Conflicts.58.a:0 "军队和一个傀儡元首。"
 WORLD.41047.t:0 "[Get_newspaper_header]俄罗斯入侵满洲"
 WORLD.41047.desc:0 "俄罗斯方面悍然入侵满洲之后，东亚地区的紧张局势已然骤然升级，一触即发。来自前线的仓促报告显示，俄军数个师团已强行越境，突入海兰泡地区，与当地关东军爆发激烈冲突。布拉戈维申斯克与尼古拉耶夫斯克两座城市持续遭受炮击，另有情报表明，俄军正利用当地补给线，试图压倒当面之敌。\n\n新京与东京方面均已对此入侵行径表示强烈谴责，斥其为“对中国主权领土无可辩驳的公然侵犯”。新京方面确认，其部队业已完成动员，以应对此次入侵。至于东京方面，目前尚未调动其本土军力，似乎对其麾下关东军的战力深信不疑，认定其足以击溃这支方从数十年内战泥潭中艰难爬出的俄罗斯武装。"
 WORLD.41047.a:0 "为解放俄罗斯人民——此诚为必要之战。"
 WORLD.41047.b:0 "此等行径绝不可容忍！"
 WORLD.41047.c:0 "但愿这不会是又一场战争的开始。"
 WORLD.41048.t:0 "[Get_newspaper_header]俄罗斯入侵满洲"
 WORLD.41048.desc:0 "俄罗斯方面悍然入侵满洲之后，东亚地区的紧张局势已然骤然升级，一触即发。来自前线的仓促报告显示，俄方多个师级单位已越过纽勒们河一线，并与当地关东军部队发生激烈交火。布拉戈维申斯克与尼古拉耶夫斯克两座城市持续遭受炮击，另有情报表明，俄军正利用当地补给线，试图压倒当面之敌。\n\n新京与东京方面均已对此入侵行径表示强烈谴责，斥其为“对中国主权领土无可辩驳的公然侵犯”。新京方面确认，其部队业已完成动员，以应对此次入侵。至于东京方面，目前尚未调动其本土军力，似乎对其麾下关东军的战力深信不疑，认定其足以击溃这支方从数十年内战泥潭中艰难爬出的俄罗斯武装。"
 WORLD.41048.a:0 "为解放俄罗斯人民——此诚为必要之战。"
 WORLD.41048.b:0 "不可容忍！"
 WORLD.41048.c:0 "但愿这不会是又一场战争的开始。"
 WORLD.41049.t:0 "[Get_newspaper_header]黑色联盟大胜满洲帝国"
 WORLD.41049.desc:0 "在俄军迅速而彻底的特别军事行动后，黑色联盟取得了对满洲帝国的决定胜利。在痛失其在该区域的最后壁垒后，关东军残部在俄国空军如影随形的袭扰之下，仓皇渡过黑龙江，溃不成军。这场遍燃于广袤战线的侵攻，目睹了无数激烈的城镇巷战与铺天盖地的炮火洗礼，给这片多灾多难的土地带来了自第二次世界大战以来，最为惨不堪言的毁灭与创伤。\n\n尽管黑色联盟方面仍未就任何敌对行为发表正式声明，东京方面却已打破了令人窒息的沉默，宣称任何对中国领土的进一步入侵都将招致日本军队的立即反击。炮火渐息，一种令人不安的和平重回满洲焦土，双方则沿江各自深挖壕堑。"
 WORLD.41049.a:0 "一切正按计划进行。"
 WORLD.41049.b:0 "骇人听闻。"
 WORLD.41049.c:0 "战祸就此平息？"
 WORLD.41050.t:0 "[Get_newspaper_header]满洲击退黑色联盟"
 WORLD.41050.desc:0 "在俄军悍然越过满洲边境发动特别军事行动后，关东军便以雷霆之势取得决定性胜利，将黑色联盟的部队彻底驱逐回阿穆尔河对岸。经过惨烈的巷战与持续不断的炮火覆盖，满洲守军不仅固守阵地，更以凌厉反攻切断俄军补给线，并最终迫使俄军陷入溃退。\n\n这场战役对该地区造成了自二战以来最大的破坏，边境地带已沦为焦土。虽获全胜，但关东军仍保持高度戒备，正沿河岸加固防御工事以应对可能的新一轮冲突。东京方面率先打破沉默，严厉警告任何进一步的俄方侵略行径都将招致帝国陆军的全力反击。"
 WORLD.41050.a:0 "本不该如此。"
 WORLD.41050.b:0 "绝不重来！"
 WORLD.41050.c:0 "战祸就此平息？"
 WORLD.41051.t:0 "[Get_newspaper_header] 黑色联盟入侵中亚"
 WORLD.41051.desc:0 "虎踞鄂木斯克的俄罗斯政权已对中亚地区发动全面入侵，宣称要收复历史疆域。自六十年代俄罗斯逐步完成统一以来，这场战争的爆发早被多方视为必然。尽管入侵行动遭到了东京与日耳曼尼亚方面的谴责，但两大强权似乎都无意介入这场苏联分崩离析余波下的又一场战争。\n\n通过此次军事行动，俄罗斯实质上确立了其“中亚门罗主义”，在传统势力范围内重新树立霸权。虽无力直接干预，但团结协定与大东亚共荣圈仍在哈萨克斯坦边境增兵，以威慑俄方未来可能的进一步扩张。"
 WORLD.41051.a:0 "又一个历史错误得到纠正。"
 WORLD.41051.b:0 "我们必须支援高加索的防御。"
 WORLD.41051.c:0 "又一场亚洲的地面战？"
 WORLD.41052.t:0 "[Get_newspaper_header][GetYear]年中亚大地震"
 WORLD.41052.desc:0 "一场震中位于哈萨克斯坦克孜勒奥尔达附近的地震，据信已导致数千人不幸罹难。震感远播国境之外，地震学家初步报告称，这是该地区自1911年以来遭受的迄今为止最具毁灭性的地震——然而，这一说法已遭到俄罗斯当局的否认。\n\n这场天灾已引发国际社会呼吁，要求行事诡秘的俄罗斯民族复国政府开放其领空，准许援助进入那片饱受战火摧残、并在不久前遭俄国入侵后强行吞并的地区。而复兴政府方面则刻意淡化灾情的严重性，并向国际社会宣称局势已尽在掌握，同时断然拒绝了任何其视为对本国内政的外国干涉。"
 WORLD.41052.a:0 "纸终究是包不住火的。"
 WORLD.41052.b:0 "三十余年战火不休，他们受的苦，难道还不够吗？"
 WORLD.41053.t:0 "[Get_newspaper_header] 俄罗斯民族复国政府入侵芬兰"
 WORLD.41053.desc:0 "俄罗斯民族复国政府的军队于今日越过芬兰共和国边境，同时对赫尔辛基发动了猛烈的战略轰炸。鄂木斯克政府发言人称，此次入侵是对其所谓的芬兰自1917年独立以来对俄裔施行的系统性种族灭绝的迟来回应，并宣称黑色联盟意图将芬兰重新置于俄罗斯的控制之下。\n\n国际社会对此反应平平，芬兰的盟友们仍在权衡如何在避免危机升级为欧洲新一场全面战争的前提下，援助这个内外交困的北欧国家。芬兰孤军奋战，独自对抗着这个奉行失地收复主义的俄罗斯国家，陷入了一场生死存亡的斗争。"
 WORLD.41053.a:0 "俄罗斯的每一寸领土都必须被祖国收复！"
 WORLD.41053.b:0 "又一场继续战争。"
 WORLD.41054.t:0 "[Get_newspaper_header]瑞典介入俄芬战争"
 WORLD.41054.desc:0 "随着新一轮俄芬战争的爆发，斯德哥尔摩政府已宣布正式支持赫尔辛基，并履行其1942年的防务协定。目前，瑞典政府与俄罗斯已处于事实上的战争状态。此声明发出后，大日耳曼国亦迅速承诺，将允许援助物资通过其各专员辖区进入芬兰，但并未正式承诺出兵参战。根据瑞典与莫斯科维恩国防官员的联合声明，此举旨在维护欧洲自由，抵御东方极权主义。\n\n随着战事蔓延，国际观察家们清楚地认识到，这场危机很可能仅仅是俄德两国间更大规模战争的第一幕，而这次，战火燃至了德国一个次要盟国的领土之上。"
 WORLD.41054.a:0 "我们将把他们和他们的芬兰走狗一起埋葬。"
 WORLD.41054.b:0 "千湖之地已是一片殷红。"
 WORLD.41055.t:0 "[Get_newspaper_header]赫尔辛基向黑色联盟投降"
 WORLD.41055.desc:0 "已宣告覆灭的芬兰政府残余势力今日向鄂木斯克政权递交无条件投降书——随着芬兰国家机器全面崩溃、武装力量彻底溃败后，这不过只是走个过场罢了。随着俄军最后攻势导致的芬军全面瓦解，团结协定的部队已全部撤离芬兰境内。\n\n鄂木斯克政府宣称，芬兰必须为其\"反俄罪行\"付出代价，特别是针对二战后占领卡累利阿地区的历史旧账。随着黑色联盟在芬兰境内实施高压统治与俄罗斯化政策，许多观察家认为，这场战争只是东欧新一轮全面战争的前奏。"
 WORLD.41055.a:0 "我们对芬兰人的复仇才刚刚开始。"
 WORLD.41055.b:0 "我们被打了个措手不及，现在必须立即备战。"
 WORLD.41055.c:0 "欧洲最年轻的帝国已彻底覆灭。"
 WORLD.41056.t:0 "[Get_newspaper_header]芬兰于俄芬超级战争中大获全胜"
 WORLD.41056.desc:0 "俄罗斯与芬兰之间的超级战争于今日迎来了其石破天惊的结局——兵力悬殊的芬兰军队竟将黑色联盟在西伯利亚的最后一批残余部队横扫出局。战争的结局被指荒诞不经，许多观察家声称，对此唯一的解释便是上帝敕令如此，现实亦因此强行扭转。\n\n无论此等战果是神明显灵还是天才手笔，多数人如今都认同，既然黑色联盟的核武库已尽在掌握，大芬兰必将接过欧亚大陆解放者的衣钵。至于芬兰的下一场超级战争是将剑指东方的朝鲜，还是挥戈西向的德国，则尚有待分晓。"
 WORLD.41056.a:0 "我们对芬兰人的复仇才刚刚开始。"
 NTG_CountryInfo_Folder.101: "一本尘封已久的书"
 NTG_CountryInfo_Folder.102: "风起云涌"
 NTG_CountryInfo_Content.1: "西伯利亚计划"
 NTG_CountryInfo_Content.2: "战间岁月的托洛茨基主义"
 NTG_CountryInfo_Content.3: "风雨欲来"
 NTG_CountryInfo_Content.4: "雪落之后"
 NTG_CountryInfo_Content.5: "中西伯利亚战争"
 NTG_CountryInfo_Content.6: "全民武装"
 NTG_CountryInfo_Content.7: "托派复兴"
 NTG_CountryInfo_Content_desc.1: "在§e尼古拉·布哈林§!担任苏联领导人期间，一项名为§n西伯利亚计划§!的宏伟蓝图应运而生，旨在在§V苏联§!腹地深处构筑一个高度机械化的工业核心地带，远离潜在的§o侵略者§!，并以此带动那些曾经相互隔绝的区域协同发展。\n\n在这项雄心勃勃的计划推动下，西伯利亚地区兴建了众多工厂、生产线和矿山，推动了克拉斯诺亚尔斯克市的崛起，使其成为了一座大型工业中心，与同胞城市§K托木斯克§!及§A新西伯利亚§!并驾齐驱。\n\n鉴于§V苏联§!幅员辽阔，偏远的§n西伯利亚§!地带为反对§e布哈林§!的势力提供了滋长的沃土。遭到总理正式罢黜的政见异议者们，在安于现状的民众之中声望日隆。"
 NTG_CountryInfo_Content_desc.2: "当§e尼古拉·布哈林§!巩固其对§V苏联§!的统治之际，§x弗拉基米尔·列宁§!麾下两位门徒却惨遭边缘化。其一为§X约瑟夫·斯大林§!，另一位便是列夫·达维多维奇·勃朗施坦，世人更熟知其名为§Z列夫·托洛茨基§!。作为二十世纪十年代§V布尔什维克革命§!的核心煽动者，§Z托洛茨基§!迅速崛起，成为跻身§V苏联领导层§!顶峰的少数人之一。\n\n尽管他未能成功接替§x列宁§!担任最高领导人之位，但§Z托洛茨基§!凭借其在布尔什维克党内所创建的“左翼反对派”派系而闻名于世。在列宁逝世后不久，“左翼反对派”便应运而生，托洛茨基在军队高层、人民委员以及老布尔什维克中广结挚友。\n\n出于对§e布哈林§!作为§x列宁§!继任者合法性的质疑，这股心怀不满的政治力量联盟最终签署了《四十五人宣言》，这份文件严词抨击在莫斯科苏维埃及主席团内部滋生的官僚集团，矛头直指§e布哈林§!。"
 NTG_CountryInfo_Content_desc.3: "正当§e布哈林§!对布尔什维克党内其他派系的政治异见者持续施以铁腕镇压之际，§Z托洛茨基§!则对其工业化经济政策展开连篇累牍的猛烈抨击。他逐字逐句地剖析§e布哈林§!的每一项细微决策，每一道法案，每一句言论，斥责其行径软弱无能，甚至声称§e布哈林§!已然背离了§x列宁§!所指引的航向，渐行渐远。\n\n殊不知，此举将为其招致杀身之祸。同年稍晚时分，一位身份不明的刺客突袭了其位于伊尔库茨克的宅邸，令这位§Z革命者§!的生命戛然而止，而其追随者们则纷纷流亡，星散于远方各地的荒僻角落。\n\n尽管痛失主心骨，但§Z托洛茨基主义§!的火种未灭—，其继承者依旧是活跃在布尔什维克党内的重要成员，胸中燃着熊熊不息的怒火，怀着刻骨铭心的怨恨。§e布哈林§!赢得了这场斗争，将其所有内部敌手悉数清除，不留后患。然而，这个联盟不久便将陷入§o风雨飘摇§!之中。"
 NTG_CountryInfo_Content_desc.4: "§o巴巴罗萨行动§!让整个§V苏联§!陷入了自我毁灭的混乱。当§g德国国防军§!攻陷一个又一个据点，末日来临之势已昭然若揭。无数民众纷纷向§a乌拉尔山脉§!撤离，亦或擅离职守，投奔驻扎于§n西伯利亚§!或§f远东地区§!的§V苏联政府§!残余势力，§e布哈林§!的联盟最终四分五裂，土崩瓦解。\n\n§Z托洛茨基主义§!似乎成了§V苏联§!史册中一页悄无声息的脚注，在§V联盟§!分崩离析、化为废墟的巨变中销声匿迹…至少他们的对手是这样认为的。"
 NTG_CountryInfo_Content_desc.5: "随着前§V苏联§!疆土分裂为诸多割据政权，许多逃离§e布哈林§!政策失败或躲避§e内务人民委员部§!在§f远东§!地区日益高压统治的民众，最终选择在民主制的§K中西伯利亚共和国§!定居。\n\n然而，§K共和国§!与§e苏维埃主席团残余势力§!间的紧张关系不断升级。最终§e苏维埃残余势力§!悍然对这个羽翼未丰的共和国宣战，由此爆发了§n西伯利亚战争§!。\n\n原本预料将速战速决的战事，升级为一场波及整个地区的纷争，致使早已支离破碎的俄罗斯版图进一步分崩瓦解，化作以区域内各座城市为中心、各自为政的诸侯割据之地。随着§n中西伯利亚§!的军队溃散为各路军阀的私人武装，§克拉斯诺亚尔斯克§!的民众决定挺身而出，将命运掌握在自己手中。"
 NTG_CountryInfo_Content_desc.6: "在这场撤退与重组的§e混乱不堪§!之际，双方军队将军事基地、武器库以及弹药点弃之不顾，其中许多遗留物资尚可继续用于作战。\n\n由于缺乏兵力把守，且不受任何有组织政府的庇护，众多村庄与城镇的居民涌入这些军需物资点，以§n西伯利亚§!军队遗留的武器装备武装自己，他们靠狩猎为生，必要时还会奋起反抗，抵御大股的§q劫掠者§!与§q土匪§!。\n\n于是乎，在§,克拉斯诺亚尔斯克§!的郊外，各路民兵应运而生，他们频繁巡逻，保卫自己的家园，这成为了该地区的显著标志，难民们在此得以平安进出，性命无虞。"
 NTG_CountryInfo_Content_desc.7: "双方相继撤离之后，治理的困境悄然滋生。城市正逐渐失去其§f电力§!供应，一种§q慢性死亡§!般的绝望很快便成了家常便饭。\n\n§Z托洛茨基主义者§!们趁机崛起，他们自行组织，建立起地方政权。在城中§V流亡者§!、其父的§V旧部§!以及前§xB布尔什维克§!分子的鼎力襄助下，夺取控制权不过是反掌之易。\n\n尽管名义上仍效忠于§K中西伯利亚共和国§!，但§尼古拉·安德烈耶夫§!将军及其麾下的军官集团早已洞悉风向。他虽也觊觎着这座城市的统治权，却最终选择将筹码押在§Z托洛茨基主义者§!一方，并在改组后的§V红军§!总参谋部中谋得一席之地。\n\n眼下，俄罗斯§Z托洛茨基主义§!唯一的薪火仅存于§克拉斯诺亚尔斯克§!一隅。然而，只有时间能够揭示，这个一度卑微的小小政权，究竟能否重燃革命的烈焰，光复伟大的§V祖国§!，并将工人的解放事业传遍寰宇。"
 NTG_THENEWORDER_DESC: "苏维埃联盟在腐朽中逐渐分崩离析，广袤的国土化为军阀割据的废墟。但下塔吉尔这座偏安一隅的城市，却仿佛在周遭连绵不绝的烽火中侥幸得以大致保全。在那场抵抗法西斯入侵的惨烈战争中，西西伯利亚凭借其建立起的工业体系，使下塔吉尔与斯维尔德洛夫斯克、秋明等周边城市一道崛起为举足轻重的工业枢纽。这使得其兵工厂能够武装起自己的民兵组织，以对抗在广袤废土上横行无忌的诸多匪帮。\n\n随着无政府状态的年月愈发漫长深重，这些民兵组织也逐渐成为了下塔吉尔身份认同中一个不可或缺的标志。\n\n由于此地远离秋明，也远离亚戈达盘踞的远东，下塔吉尔逐渐成为了一个声名远播的避难所，吸引着各色人等前来寻求庇护，其中尤以那些在苏维埃联盟迅速瓦解时被释放的前政治犯为甚。这些曾被亚戈达亲手送入古拉格的囚徒，在成功越狱之后，转而在列夫·谢多夫的带领下，建立了下塔吉尔的托洛茨基主义政府。\n\n尽管平民百姓对这个新生的政权心怀戒备，气氛一度剑拔弩张，但许多人终究还是不情不愿地默认了眼下的局面——只因新政权所许诺的未来，或许能为他们带来一个更好的明天。然而，并非每个人都对谢多夫的政策甘之如饴。"
 BOOKMARK_NTG_BLOCKER: "§V下塔吉尔公社§!"
 BOOKMARK_NTG_BLOCKER_DELAYED: "§G将于不断革命版本更新：§!\n§Y- 十年可玩剧情内容\n- 统一俄罗斯\n- 擘画公社未来宏图§!\n§F--------------\n\n\n£GFX_texticon_bookmark_NTG \n\n\n\n\n§!德军的雷霆攻势，令苏维埃联盟轰然瓦解，其过程之暴烈，不仅令左翼残存的威望荡然无存，更让共产主义这一意识形态彻底蒙羞，声名扫地。当世界上第一个社会主义超级大国焚为灰烬，其焦土残骸反倒为众多蕞尔小邦的悄然滋长提供了沃土。\n\n西俄战争与西伯利亚战争的双重失败，宛如两条深可见骨、血流不止的创口，终于将旧日联盟部分公民胸中的屈辱，化为了行动的烈焰。他们早已受够了那些投机钻营的军阀以及内务人民委员部的高压统治。在流亡的反对派领袖与将领的援助下，他们汇聚于托洛茨基主义的旗帜之下，建立了下塔吉尔公社。\n\n公社四面皆是敌国环伺，在一九六二年的普罗大众眼中几乎籍籍无名——除却那些最为赤诚的拥趸。它只是悄然蛰伏，等待着石破天惊的那一刻，以将托洛茨基的未竟事业重新镌刻于青史之上。倘若一切顺利，世界或将见证光荣的第四国际再度崛起，抑或是，某种远比那更为可怖的梦魇。"
 ultranationalism_black_league_thought_subtype: "黑色联盟思想"
 ultranationalism_black_league_thought_subtype_desc: "                            §Y黑色联盟思想§!\n\n£GFX_ideology_ultranationalism_black_league_thought_bar\n\n\n\n\n俄罗斯曾是大陆霸主，曾将其坚韧的力量投射于欧亚大陆的广袤草原之上；纵然国家赖以运转的精巧机制几经更迭，仍历经数世纪而屹立不倒。\n\n然而，这数百年的连绵胜败，终有尽时——随着一个群体的到来而戛然而止：大日耳曼国。他们一心要将俄罗斯投入历史的洪流，妄图彻底埋葬这样一个国家曾经存在的理念。在很大程度上，他们得逞了。布哈林仓皇出逃，苏维埃的党政机器随之分崩离析，俄罗斯的土地惨遭一众非法残余政权与军阀的践踏蹂躏。此乃“第一次审判”。\n\n但面对看似不可逾越的困境，一人拒绝屈服。毛特豪森集中营酷刑遍地，卡尔贝舍夫同志在其阴森的高墙之内，日复一日地忍受着无情的拷打，最终被抛入严酷的寒冬，任凭风雪夺去其生命。然而，这位俄罗斯的英勇之子深知，这并非终局。这位形容枯槁的将军跋涉数百公里，抵达了那座苦寒之城——鄂木斯克。在那里，黑色联盟的基础与教义得以锻造。对于那些将黑色联盟的理念奉为圭臬的人们而言，一个梦想始终存在：那曾在其铁蹄之下屠戮了数百万俄罗斯人民的国度必将灰飞烟灭，一个全然、纯粹由俄罗斯主宰的新纪元，亦将随之降临。"
 communist_trotskyism_subtype: "布尔什维-列宁主义"
 communist_trotskyism_subtype_desc: "                                §Y布尔什维-列宁主义§!\n\n\n£GFX_ideology_communist_trotskyism_bar\n\n\n\n\n托洛茨基主义起初是二十年代的讥讽之辞，后来被流亡海外的托洛茨基追随者所接受。托洛茨基始终秉持革命信念，他在共产国际内部组织反对派，最终遭到布哈林-斯大林集团铁腕驱逐。在他看来，国际革命议题尤为重要，因此他创立了第四国际。托洛茨基认为，鉴于俄国经济的滞后状态，唯有借助国际革命的力量，俄国才能顺利完成从前资本主义到社会主义的过渡，在此之前苏联处于转型阶段。他将这种在落后条件下推动革命的思想称为“不断革命”，这一理念也为欧洲以外的一些革命者所采纳，以此规避布哈林的两阶段论。最终，托洛茨基见证了革命的堕落，目睹了那所谓的“工人国家”，如何被官僚体制侵蚀腐化、逐渐依赖中产阶级，一步步滑向资本主义的深渊。\n\n与此同时，托洛茨基主义者认为社会主义的条件已经成熟，只是缺少合适的领导力量。他们向共产国际的前四次大会发出呼吁，主张建立反对第三国际“极左主义”与资产阶级人民阵线的统一战线。他们的策略在1938年的《过渡纲领》中凝聚成形，即通过不断提出难以实现的要求来推动革命进程。1940年，托洛茨基的生命戛然而止，但四十年代的风云变幻却在某种程度上印证了他的预见。在他身后，追随者们迎来了掌权的契机。他们能否如托洛茨基所愿，构建出一个民主、坚持国际主义与高度计划的社会主义社会，还是会重蹈覆辙，再一次迎来热月？"
 OMS_2WRW_debug_category: "2WRW 鄂木斯克调试"
 OMS_2WRW_debug_category_desc: "\n\n\n\n\n\n\n\n£GFX_OMS_omskdebug2\n\n\n\n\n\n\n\n\n\n\n我前几天给一个德国小孩洗了白磷澡，\n挺帅的。\n\nhek来过这。 Frank来过这. Andy来过这. Emmy来过这. Voyteck来过这."
 communist_securocratism_subtype: "特勤共产主义"
 communist_securocratism_subtype_desc: "§Y 特勤共产主义 §! \n\n\n£GFX_ideology_communist_securocratic_communism_bar \n\n\n\n\n\"特勤共产主义\"常用于表示融合安全统治体系的共产主义制度，其特点包括严格的国家管控、全面监控以及对异见者的残暴镇压。然而这种\"安全统治\"并未明文规定其遵循的马克思主义流派，具体理念的实践细节往往由政权自行决定。只要共产主义仍能将舆论稳定置于个人权利与自由之上，秘密警察（而非传统模式中的军队或先锋队）仍在严格维持秩序、坚决执行国家的意志，该制度便有其存在的意义。\n\n尽管自布尔什维克权力斗争时期之后，这样的法则已基本被遗忘，但在前苏联疆域内，旧政府的残余正以NKVD的铁腕统治管理着伊尔库茨克残存政权。在这片冰封废土上，特勤共产主义重获新生——当主席团与其武装力量皆被证明它们无法有效控制国家，唯有特勤官员能守护人民纯洁的红色意志的理念便不再显得荒诞。毕竟，俄罗斯人民还有其他选择吗？革命者日日牺牲，人类伟大而光明的解放事业的前途日渐黯淡。待到曙光重现前，我们唯有用子弹与铁腕统治，让反对我们崇高的红色事业的反动派与叛徒们明白：社会主义清算死敌时绝不手软。\n\n§R我们无需怜悯，亦不向人乞怜。执剑于手之刻，恐怖绝无藉端。§!"
