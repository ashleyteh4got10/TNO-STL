 RUS_news.94.t: "[Get_newspaper_header]下塔吉尔一统西西伯利亚！"
 RUS_news.94.desc: "今天俄罗斯传来要闻，在列夫·谢多夫——即列夫·托洛茨基之子的领导下，下塔吉尔成功统一了西西伯利亚，并成立了\"西西伯利亚苏维埃社会主义共和国\"。\n\n这场革命始于兹拉托乌斯特共和国的一次工人起义。从最初的简单起义到如今成为统一整个地区的国家，下塔吉尔在与其他争夺列宁遗产的势力斗争中一路走来。\n\n尽管其共产主义体系相较于布哈林主义看起来并不那么正统，但凭借新重整的红军力量，它最终在西西伯利亚取得了胜利。这一新兴社会主义政权旨在延续托洛茨基本人的理念与目标，以激进的国际主义面貌和意识形态扩张主义登上全球舞台。\n\n老生常谈的问题：这一列宁主义的新分支会重建苏联，还是重蹈布哈林的覆辙？"
 RUS_news.94.a: "同志们向前冲！"
 RUS_news.94.b: "他们走不远的"
