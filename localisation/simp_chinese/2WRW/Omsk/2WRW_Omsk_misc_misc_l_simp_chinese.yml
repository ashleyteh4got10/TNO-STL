 OMS_2WRW_end_it_all:0 "释放我们的秘密武器"
 OMS_2WRW_end_It_all_tt:0 "§R我们释放库存后，核武器将会被投放至前线。§!"
 OMS_2WRW_end_it_all_desc:0 "如果无法获得有条件胜利，我们只需重新定义我们的胜利条件。我们不让今天的敌人取得胜利，这样我们明天就可以战斗并消灭他们。"
 OMS_CountryInfo_Folder.101: "往日荣光"
 OMS_CountryInfo_Content.1: "曾经的超级大国……"
 OMS_CountryInfo_Content_desc.1: "历史的必然之一便是：掌控广袤俄罗斯的国度终将成为超级大国。这一规律延续了数个世纪。从茫茫草原到白令海峡，俄罗斯曾傲立于世界舞台，备受敬畏与尊崇。\n\n然而那已是遥远往事。繁华城镇的喧嚣、庄严厅堂的肃穆、圣诞弥撒的钟声，皆已消逝在记忆深处。"
 OMS_CountryInfo_Content.2: "……从云端跌落"
 OMS_CountryInfo_Content_desc.2: "我们过去领导者的无能，让俄罗斯沦为军阀割据的腐朽残躯，只能争夺条顿人炸剩的残渣碎屑。那些机会主义者——无论是共产主义者、沙皇派、自由派还是法西斯分子——都在竭力阻挠我们伟大国家的统一。即便在第一次西俄战争对抗条顿人时，我们刚显疲态，这些寄生虫就撕咬俄罗斯的脚跟，导致胜利功亏一篑。我们的国家比任何时候都更需要一次新生，一次确保最终胜利的彻底蜕变。"
 OMS_CountryInfo_Folder.102: "灵光乍现"
 OMS_CountryInfo_Content.3: "我们的领袖"
 OMS_CountryInfo_Content_desc.3: "我们的领袖，德米特里·卡尔贝舍夫本注定会牺牲。但在被德军俘虏并遭受酷刑后，他却奇迹般逃脱，回到西西伯利亚人民共和国继续效力。晋升为中将后，他沮丧地看到了第二次审判的失败，俄罗斯再次屈服于条顿人的铁蹄之下。"
 OMS_CountryInfo_Content.4: "我们的败北"
 OMS_CountryInfo_Content_desc.4: "随着军队撤退至西西伯利亚人民共和国腹地，有人试图从无能官僚手中夺取领导权。这次尝试以失败告终。幸存者们转而集结起来保卫鄂木斯克城——全俄黑色联盟正是在此脱胎换骨。联盟暗中启动了全面军事化进程，倾尽一切确保这座城市能够经受住未来所有考验——无论是来自外患还是内忧。"
 OMS_CountryInfo_Content.5: "我们的堡垒"
 OMS_CountryInfo_Content_desc.5: "每个体系都需要其哲学根基，而对黑色联盟而言，这种哲学体现为对德国及其衍生一切的纯粹的虚无主义仇恨。德米特里·卡尔贝舍夫将军将这一哲学概括为“大审判”理论：第一次审判是伟大的卫国战争，苏维埃联盟在此战中解体，使俄罗斯遭受屈辱与重创；第二次审判是西俄战争，却未能击溃条顿人。因此，第三次亦即最终的“大审判”，必将为俄罗斯带来期盼已久的胜利。\n\n鄂木斯克自此化作跳动的黑色石之心。总司令德米特里·卡尔贝舍夫及其集团统治着这个全面军事化的社会。但随着时间推移，当联盟元老们日渐偏离他的哲学思想时，年迈的卡尔贝舍夫影响力日益衰退——这座城邦实质上已沦为贪婪与自私主宰的疆域。"
 OMS_CountryInfo_Folder.103: "我们的立场"
 OMS_CountryInfo_Content.6: "腐朽透顶"
 OMS_CountryInfo_Content_desc.6: "黑色联盟的守旧派早已堕落为一群相互倾轧的政客与军阀。比起将忠诚献给“大审判”，他们更乐意将之奉给那些腐败的将领以换取奖赏。\n\n卡尔贝舍夫的愿景正同他本人一起腐烂，年事已高的他早已不复往昔之姿，不再是那个使“大审判”得以实现的人，而更像是一个被狭隘小人所操纵的傀儡，终将被历史所遗忘。\n\n但悲剧并不仅止于理想的荒废，更在于其被彻底地亵渎与篡改。“大审判”本应是针对日耳曼威胁的防御性理论，但如今，这一思想已被野蛮人彻底扭曲，沦为施行死亡崇拜的借口。他们将其化为无差别的复仇与残虐，坚信所有德国人都必须为他们曾亵渎俄罗斯雄鹰而付出代价。这位年迈而疲惫的总司令从从未期盼如此，但如今他只能满怀恐惧地看着自己一手创造的怪物而无能为力。\n\n不过，仍有真正的信徒愿以一切代价将卡尔贝舍夫的理想带回人间，并誓要向日耳曼人索取彻底的复仇。对联盟而言，幸运的是，这个人恰好是他的副官……"
 OMS_CountryInfo_Content.7: "德米特里·亚佐夫"
 OMS_CountryInfo_Content_desc.7: "一位胸怀远见的战士，深爱俄罗斯的爱国者，对一切德意志事物怀有深仇大恨的圣战者。在第一次审判与第二次审判期间英勇奋战的亚佐夫意识到，自己所有的努力都不足以扭转对抗条顿人的颓势。这愈发加深他原本就对纳粹和辜负了俄罗斯母亲之人的刻骨仇恨。因此，当最终政变失败的“全俄黑色联盟”这一军事社团成立时，他成为了核心策划者之一。\n\n很快，他就成为了卡尔贝舍夫的得力助手，成为联盟内最具影响力的人物之一。然而，随着卡尔贝舍夫日渐衰老，元老们日益腐败堕落，亚佐夫正悄然行动，不惜一切代价要成为联盟唯一无可争议的领袖……"
 OMS_CountryInfo_Folder.104: "复仇时刻将至"
 OMS_CountryInfo_Content.8: "我们的周遭"
 OMS_CountryInfo_Content_desc.8: "在我们西边，西西伯利亚人民共和国的残余势力盘踞在秋明，天真地妄图重建苏联。再往西便是斯维尔德洛夫斯克，那里由康斯坦丁·罗科索夫斯基领导的军政府看似已背离了软弱共产主义的信条。然而他们与联盟的教义依然格格不入，缺乏对复仇事业的彻底献身精神。\n\n在兹拉托乌斯特，军火贩子们正向全俄军阀兜售武器，靠着啃噬俄罗斯的尸体大发横财，对国家命运漠不关心。\n\n但比起盘踞在尤格拉的盗匪和沃尔库塔的NKVD残部，他们对俄罗斯统一事业的危害还算轻的。此地唯一值得我们稍加敬重的，是苏尔古特的自由飞行员——他们仍在抗击条顿空军无休止的空袭。"
 OMS_CountryInfo_Content.9: "前方的挑战"
 OMS_CountryInfo_Content_desc.9: "随着事态的发展，亚佐夫似乎是唯一有资格继承卡尔贝舍夫遗志的人。即便这位老将军开始对自己的所作所为与人生道路产生怀疑，亚佐夫仍将坚守信念——因为大审判即将来临。黑色联盟必将恪守创始者的愿景，忠诚履行备战使命。\n\n整个联盟乃至鄂木斯克全境都将得到净化与救赎，德不配位者将被清除，他们的名字将从历史中抹去。新一代狂热的革新派正蓄势待发，准备取代这些人的位置，完成灭绝条顿种族的终极使命——这不过是命中注定。唯一悬而未决的问题，便是那神圣而宿命的一天何时会如神恩般降临在祖国忠嗣们的身上。\n\n俄罗斯必将实现复仇，哪怕要拉着全人类同归于尽……"

 BOOKMARK_OMSK_BLOCKER_CE: "§w黑色联盟§!"
 BOOKMARK_OMSK_BLOCKER_CE_DELAYED: "§Y统一后内容已在§d冰上大战§!版本里发布\n\n§R大审判§!即将来临！§!\n§W-------------- \n§Y社区版独占内容：\n额外的战前准备内容和大审判的额外内容，再次延长游戏时间至1980年\n\n更多的风味事件，于铁与血当中铸就大审判\n\n历史将证明审判是必要的。\n\n于§d冰上大战:后启示录§!版本更新：\n\n额外的3年内容，带领黑色联盟走出原子废土并发动第二次大审判，在最终守卫住黑色联盟，§V尽你所能。§!§!§!\n--------------\n\n\n£GFX_texticon_bookmark_OMS\n\n\n\n\n§F对德米特里·卡尔贝舍夫而言，仇恨一直是他最大的盟友。\n\n面对德国众多集中营中的饥饿、死亡和酷刑，正是他的仇恨让他活了下来。他被自己的国家遗忘，而他拒绝接受失败的态度促使他逃亡。他回到破碎和分裂的俄罗斯，他立志是有朝一日为他的同志报仇雪恨，这导致了§Y黑色联盟§!的成立，一个以§G民族生存§!和§R大审判§!为宗旨的国家。\n\n然而，在残酷的命运转折中，仇恨成了卡尔贝舍夫最大的敌人。\n\n年老体衰的黑色联盟领袖发现自己处处受制于人，他最伟大的作品现在被复仇的渴望所支配，就连他自己也曾认为这是难以想象的。这是一个不寻求打败德国，而是摧毁它的国家；一个不打算保护俄罗斯，而是要牺牲它的国家。\n\n现在，随着大日耳曼国日渐衰弱，激进的极端军国主义军官§Y德米特里·亚佐夫§!成为他的继任者，但这位垂死的将军只有一件事很清楚：§r日耳曼人§!将为他们抢劫和偷窃的每一块俄罗斯，不，每一寸土地付出代价；\n\n§x我们将不计任何代价。\n\n但黑色联盟的理论真的是对的吗？§!§!§!"