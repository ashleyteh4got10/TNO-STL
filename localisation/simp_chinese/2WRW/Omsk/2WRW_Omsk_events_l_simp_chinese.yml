 OMS_failstate.1.t: "黑幽灵"
 OMS_failstate.1.desc: "“皮奥特，”\n\n皮奥特缓缓转头看向战友菲奥多尔，满脸倦容。\n\n“怎么了？”皮奥特轻声问道，他也感受到了好几天没合眼所带来的影响。\n\n“……你觉得我们快到头了吗？就是不用再继续打仗的那种？”费奥多尔说道，声音中带着些许不确定。\n\n皮奥特的目光从费奥多尔的脸上移开，落在了他身后的墙壁上，透过掩体上的观察缝，凝视着外面广袤的死亡荒原。然后，他抬起头，透过数日前被钻地弹炸出的巨大洞口向外望去。原本派来防守这个位置的十个人，在掩体被炸后，只剩下他们两人。\n\n“或许……也许终点就在那片田野的尽头。”\n\n突然，电台里传来一阵响亮的静电杂音，两人以为它已经坏了。在过去的五天里，他们没有从上级指挥部听到过任何消息。\n\n“士兵同志们，我是你们的指挥官。全员立即向国家战略工事外围转移。我们的斗争尚未结束。复仇将属于我们。最高统帅亚佐夫同志万岁。”\n\n“是拉扎连科吗？”费奥多尔插话道，这次声音里带着一丝激动。终于，他们得到了确认，一切还没有结束。两人收拾好东西，走出掩体，这时他们听到头顶传来重型火箭发动机的轰鸣声，一个快速移动的模糊身影从他们头顶掠过。"
 OMS_failstate.1.a: "§R大审判§!仍在继续。"
 OMS_failstate.2.t: "卡特琳娜堡报道"
 OMS_failstate.2.desc: "轻微的沙沙声干扰着信号，新闻广播从德国新闻主播枯燥、近乎机械的开场白，切换到了曾经的斯维尔德洛夫斯克——如今一片混乱的景象。不久前，黑色联盟在向乌拉尔山脉后方进行焦土式核武撤退后，此地刚被攻陷。尽管骚乱显而易见，国家广播公司的精英记者们一如既往地在镜头前展现出镇定自若的风采。\n\n“…我们正在新近解放的卡特琳娜堡为您现场报道。在我身后，您可以看到，新成立的核生化三防部队总部正一片忙碌。”德国战地记者面不改色地说道，竭力营造出一种印象：在该地区毁灭性的战斗之后，一切终于得到了控制。记者深吸了一口气，然后继续说道。\n\n“俄国匪帮头目德米特里·亚佐夫依旧下落不明，据推测，他已在其山中堡垒的毁灭中殒命。新上任的专员瓦尔特·温克已向我们保证，陆军将很快肃清俄国境内最后的抵抗力量，对俄战争的最终胜利已是指日可待。”\n\n又是一口深呼吸。记者脸上掠过一丝极短暂的焦虑，随后再次开口。“那些无能而野蛮的俄国人小规模使用核武器的行径，正如预料的那样，仅造成了轻微损失，核弹头在击中我们英勇的士兵前就已大多被成功拦截。敌人即便是使出最卑劣的伎俩，也无法延缓德意志英雄儿女们向东挺进的步伐，更遑论阻止了！他们正以又一场辉煌的胜利，为德国和元首献上荣耀！”\n\n“其他新闻方面，我们稍后将采访西伯利亚维和与剿匪事务负责人古斯塔夫·瓦格纳，元首亲自宣布，他是抓捕剩余俄国匪徒的最佳人选。敬请关注后续采访。”“啪”的一声，电视被关掉了。"
 OMS_failstate.2.a: "结局临近。"
 OMS_failstate.3.t: "维柳伊斯克报道"
 OMS_failstate.3.desc: "大卫·哈伯斯塔姆检查了一下麦克风。几分钟前这玩意儿还时好时坏，但奇迹般地，在他们即将在这片被上帝遗弃的土地上进行现场直播时，它又恢复正常了。在他报道过的所有战争中，这场战争从各个意义上来说都让他感到最为痛苦。当红色指示灯亮起时，镜头居然没被冻住，这让他颇感意外。\n\n太平洋彼岸的观众们看到的是，一位身着冬装的记者站在一个基本完好的村庄前。随着联盟的崩溃，城市逐渐不再遭遇抵抗，因为此刻只有最激进分子仍效忠于亚佐夫的事业。像伊尔库茨克和坎斯克这样的大都市需要逐街逐巷争夺的日子早已一去不复返了。\n\n“早上好。我是哥伦比亚广播公司的大卫·哈伯斯塔姆，现在将为您独家呈现西伯利亚雅库特解放区的现场情况。”他平铺直叙地说道，“具体来说，我们现在向您报道的地点是维柳伊斯克，这里是地球上最寒冷的地方之一。”哈伯斯塔姆的表情大多时候保持着中立。\n\n\n“俄罗斯政府的崩溃，堪称美利坚合众国及其盟国联合武装的历史性胜利，更是全人类的幸事。感谢英勇的士兵们，世界史上从未如此接近核战边缘的危险时刻终被化解。”\n\n\n哈伯斯塔姆决定在继续播报前稍作停顿。“俄罗斯的人道主义危机规模已经显现，预计下周将有救援物资抵达，以帮助当地民众，即便是这些偏远地区的人们也饱受战争之苦。多达......”\n\n就在这时，街对面的一座建筑发生爆炸，哈伯斯塔姆和摄影师一边咒骂，一边在直播未停的情况下拔腿就跑。片刻之后，由于所谓的“技术故障”，直播中断了。"
 OMS_failstate.3.a: "对一些人来说，斗争远未结束。"
 OMS_nuclearfoci.1.t: "心脏骤停"
 OMS_nuclearfoci.1.desc: "最后一颗子弹射向日耳曼尼亚。无数尸体横陈街头。被子弹撕裂、刺刀贯穿、毒气窒息的人们倒卧在地，这座曾经伟大的城市如今笼罩在毒气之中。炮击、火箭弹和地雷将人体撕得粉碎。燃烧的坦克里、废弃的街垒后，尸首在战败后毫无用处的掩体中腐烂。\n\n那些曾经作为生活和商业中心的大楼，如今只剩下地基，覆盖着层层剥落的砖石与灰浆。面包房、街角商店和成千上万人的家园都被烧成灰烬。曾经是欧洲工业心脏的巨型工厂沦为废墟，曾在其中辛勤劳作的工人如今也埋骨瓦砾堆中。\n\n在这片废墟顶端，半焚的国会大厦残骸上，站着一个人。他身穿黑色橡胶连身服，头戴兜帽，脸被像死神一样苍白的面具遮住，手臂缠着鲜黄色臂章，正缓缓穿过毒雾弥漫、金属扭曲的战场。这里曾见证联盟与日耳曼尼亚党卫军最后防御者的终极对决。\n\n他缓步走近悬于楼侧的旗杆旁，用步枪上固定着的刺刀仔细割下德意志残破的旗帜，看着它飘入毒风之中。同伴打开背包，展开一面黑底黄纹的旗帜——黑色联盟的标志，他们绝对胜利的象征。\n\n片刻后，这面旗帜已在楼侧飘扬，由从西伯利亚跋涉至德国核心的士兵高高擎起。下方是仅剩空名的城市残垣。众人退后一步，凝视眼前的废墟。历经所有挣扎与苦难，一切终于结束。"
 OMS_nuclearfoci.1.a: "§R对入侵之敌的仇恨是最神圣、最符合人性的感情。§!"
 OMS_News.555.t: ""
 OMS_News.555.desc: ""
 OMS_News.555.a: ""
 OMS_News.1.t: "[Get_newspaper_header]德国多地爆发恐怖袭击"
 OMS_News.1.desc: "德国境内多地关键设施几乎同时遭遇毁灭性恐怖袭击。短短数小时内，日耳曼尼亚的政府核心建筑接连遭到小型爆炸装置袭击。铁路枢纽、陆军补给仓库等重要设施同样未能幸免，其中各专员辖区行政机构的受袭程度尤为严重。\n\n袭击者自称为“俄罗斯解放军”成员，该组织鼓吹将前俄罗斯领土归还于以鄂木斯克为大本营的俄罗斯政府。相应地，他们长期以来一直强烈谴责德国对俄罗斯占领区的所作所为。其事业持续得到自由国家组织的成员，尤其是美国的援助。"
 OMS_News.1.a: "元首将如何应对此等局面？"
 OMS_News.2.t: "[Get_newspaper_header]秋雷行动"
 OMS_News.2.desc: "在一个或许唯有俄罗斯人始料未及的军事行动中，协定部队已发起覆盖全线的大规模反攻，目的是将俄罗斯黑色联盟部队从莫斯科边境、德占乌克兰、波罗的海地区及芬兰逐回。此次行动被命名为“秋雷行动”，其攻势显然经过长期筹备，且首次实现协定陆海空三军的近乎完全协同作战，联合对抗黑色联盟军队。\n\n俄军建制据传因这出其不意的打击，已然开始瓦解。俄军最高统帅部则对此矢口否认，宣称反攻虽在意料之外，但“必将受到应有的反击”。"
 OMS_News.2.a: "混乱吞噬一切，俄罗斯仍在烈焰中煎熬…"
 OMS_News.3.t: "[Get_newspaper_header]计划暴露"
 OMS_News.3.desc: "随着大审判的怒火笼罩整个东欧，从俄罗斯传来的照片和新闻泄露的令人不安的报告显示，俄罗斯总司令德米特里·亚佐夫处决了多位来自军事和民事管理部门的高级官员。虽然官方没有给出任何原因，但分析人士认为此次清洗源于亚佐夫对欧洲战事进展的不满，这场战争已逐渐陷入类似第一次世界大战的胶着僵局。\n\n此次清洗似乎波及到了军队和政府的各个层级，其规模之大自希特勒“长刀之夜”以来前所未见。德国官员表示，这一结果是“这正是人们所预料的，一个斯拉夫蛮人一样的敌人。”与此同时，亚佐夫表示，他只是在确保政府“外部势力影响”。"
 OMS_News.3.a: "他们都犯了不可饶恕之罪：失败。"
 OMS_News.3.b: "他们在自取灭亡！现在是我们出击的时候了！"
 OMS_News.3.c: "他们真疯了？"
 OMS_News.4.t: "[Get_newspaper_header]大审判"
 OMS_News.4.desc: "旷日持久的鏖战，双方数以百万计的生灵涂炭，终于在今日，于一场彻底的核交换中落下帷幕。这场由黑色联盟与其余超级大国倾其武库发动的核打击，宣告了战争的终结。尽管德国在彻底核摧毁俄罗斯后宣称了名义上的胜利，但这不过是场得不偿失的惨胜。\n\n从华沙的街头到乌拉尔山脉深处的地堡，整个东欧已是一片狼藉。这场核交换令无数城市化为废墟，地面战事亦随之戛然而止。亚佐夫不知所踪，据推测也已殒命，众人预料黑色联盟将面临彻底的政府崩溃。德国仍维持着名义上的存续，但它已不复往日之辉煌。全球数亿生灵殒命，失踪者更是不计其数，人类的前途一片黯淡。"
 OMS_News.4.a: "一人之狂，天下买单。"
 OMS_News.5.t: "[Get_newspaper_header]黑色联盟覆灭"
 OMS_News.5.desc: "大审判已正式落下帷幕。经过在俄罗斯境内持续数月的残酷战争，造成数百万伤亡后，随着所谓“国家战略工事”的崩溃，黑色联盟旗帜已从俄罗斯大地上永久消失。本月初，德国士兵突破了最后一道要塞城市防线，逐街逐巷、逐山逐岭地展开激战，以夺取对乌拉尔山脉及其以远地区的控制权。随着最后负隅顽抗者被俘，黑盟及其末日计划终告覆灭。\n\n即便在奥尔斯克的废墟中确认了亚佐夫遗骸，即便黑色联盟行将覆灭，抗争却仍未止息。前政权无数狂热残余势力已在俄罗斯各地扎根。尽管§R大审判§!已宣告终结，但对德国而言战争远未结束。"
 OMS_News.5.a: "我身后空无一物，而终局已在眼前。"
 OMS_News.5.b: "欧亚如释重负。"
 OMS_News.6.t: "[Get_newspaper_header]黑色联盟覆灭"
 OMS_News.6.desc: "大审判已正式落下帷幕。经过在俄罗斯境内持续数月的残酷战争，造成数百万伤亡后，随着所谓“国家战略工事”的崩溃，黑色联盟旗帜已从俄罗斯大地上永久消失。本月初，OFN与共荣圈联军突破了最后一道要塞城市防线，在西伯利亚荒原及其更远处的极寒地域展开寸土必争的战役。随着最后负隅顽抗者被俘，黑盟及其灭绝计划终告覆灭。\n\n即便在奥尔斯克的废墟中确认了亚佐夫遗骸，即便黑色联盟行将覆灭，抗争却仍未止息。前政权无数狂热残余势力已在俄罗斯各地扎根。尽管§R大审判§!已宣告终结，但对德国而言战争远未结束。"
 OMS_News.6.a: "我身后空无一物，而终局已在眼前。"
 OMS_News.6.b: "欧亚如释重负。"
 OMS_News.7.t: "[Get_newspaper_header]美日向黑色联盟宣战"
 OMS_News.7.desc: "来自OFN与共荣圈军事领导层的联合声明称，日本与美国的军事部队已开始对黑色联盟采取行动。黎明时分，坦克跨越了满洲与西伯利亚的边界，标志着俄罗斯与德国持续战争中的进一步升级。\n\n此前美国华盛顿与日本东京均向俄罗斯政府发出警告，要求其停止在欧洲使用化学与生物武器。然而俄罗斯公然违抗全球压力，拒绝遵守国际法。看来，人类再次发现自己陷入了全球性的自相残杀之中。"
 OMS_News.7.a: "或许将有一场终结所有战争的战争......"
 OMS_far_eastern.1.t: "东京公报"
 OMS_far_eastern.1.desc: "FROM: [JAP.GetLeader]\nADDRESSED TO: National Reclamation Government of Russia\nSUBJECT: Final Warning\n\nLet it be known from this day onward if the situation within Eastern Europe devolves any further into such senseless and mindless butchery, the Empire of Japan and its allies will take preemptive measures to ensure the stability and defense of members within the Greater East Asian Co-Prosperity Sphere. The government of Japan is especially concerned that many of the facilities producing the chemical and biological weapons being used against Germany are located in close proximity to nations allied to the Co-Prosperity Sphere and therefore pose an existential risk to our collective security.\n\n\n\nWe strongly urge negotiations with the Germans immediately to avoid any further use of banned weapons arising and start abiding by the non-proliferation treaty for atomic, biological and chemical weaponry. This will be our only warning.\n\n\n\nSigned,\n[JAP.GetLeader]"
 OMS_far_eastern.1.a: "又一个条顿人的恶犬来阻碍我们正义的审判。"
 OMS_far_eastern.4.t: "机密-宪兵队报告"
 OMS_far_eastern.4.desc: "呈：大日本帝国总理大臣阁下\n发自：九州宪兵队本部\n事由：中欧核武部署之对策\n据美国情报机构提供之线索，已证实可怖事实——黑色联盟特工已于中欧多地秘密部署核武器，妄图对城市及基础设施发动先制核打击。为捍卫帝国之安全及天皇陛下安危，宪兵队强烈建议立即采取干预措施。\n\n遵阁下前颁指令，我方已启动对美情报共享机制，现可着手制定联合行动方案以防止核爆。另鉴于鄂木斯克方面军事行动日趋激进，恳请即令帝国陆海军按最高战备等级展开动员部署。"
 OMS_far_eastern.4.a: "批准。愿他们成功……"
 OMS_far_eastern.5.t: "绝密-总统亲启-特急"
 OMS_far_eastern.5.desc: "致：美国总统\n发自：中央情报局\n\n主题：中欧核武器部署\n\n根据中央情报局的最新观测，我方已掌握确凿证据：黑色联盟特工已开始秘密部署“总司令炸弹”——一种部署在中欧各地的战略核武器。中央情报局极度担忧——这些炸弹恐怕是鄂木斯克对德国乃至全球实施核毁灭的开端。\n\n遵照总统指令，我们已向盟友通报事态发展，并全力阻止炸弹的部署行动，以避免触发“热战”态势——其后果只能用世界末日来形容。"
 OMS_far_eastern.5.a: "但愿东京方面能迅速收到消息……"
 OMS_far_eastern.6.t: "机密-宪兵队报告"
 OMS_far_eastern.6.desc: "呈：大日本帝国首相\n\n自：九州宪兵队本部\n\n事由：黑色联盟大规模杀伤性武器之潜在及实际部署情况\n\n监听站与卫星侦查显示，俄远东地区疑似生物武器实验室及试验场之建设活动激增，其分布尤其集中于对共荣圈友好政府及满洲之边境。该情况与黑色联盟近期在莫斯科地区对德军广泛使用大规模杀伤性武器之行动存在关联。\n\n我方高度担忧，任何形式之局势升级都将不可避免将战火蔓延至蒙古、满洲等共荣圈控制区。鉴于此威胁，宪兵队强烈建议：立即沿俄边境地带增派部队，强化核生化防护训练，并集结专项作战单位以应对此威胁。\n\n"
 OMS_far_eastern.6.a: "天哪……"
 OMS_far_eastern.7.t: "绝密-总统亲启"
 OMS_far_eastern.7.desc: "致：美国总统\n\n发自：丹尼尔·巴德上校，美国欧洲司令部\n\n主题：东欧大规模杀伤性武器使用及平民伤亡报告\n\n卫星侦查与目击者证词均已证实我们最担忧的情况。为取得战场优势，黑色联盟已开始在前线对德国大规模使用战术核武器。结合该组织一贯漠视平民生命的政策，所有合理预估均显示平民伤亡已达数百万。\n\n美国欧洲司令部建议全军保持高度戒备，同时继续加强监测。司令部认为，黑色联盟持续寻求更具破坏性的手段以达成目标，其使用大规模杀伤性武器的行为必将导致冲突升级进一步加剧。"
 OMS_far_eastern.7.a: "天哪……"
 OMS_far_eastern.8.t: "黑色联盟的覆灭"
 OMS_far_eastern.8.desc: "大审判终于落下了帷幕。历经数月横跨俄东的残酷战争与数百万伤亡，随着黑色联盟所谓“国家防御工事”的崩溃，其旗帜已从俄罗斯大地彻底消失。本月早些时候，OFN与共荣圈的联合部队突破了最后要塞城市防线，在西伯利亚荒原及更远地带展开寸土必争的激烈战斗。随着最后负隅顽抗者被俘，黑色联盟及其末日计划已彻底覆灭。\n\n尽管亚佐夫的遗骸已在奥尔斯克废墟中被确认身份，黑色联盟面临彻底歼灭，但战斗仍在继续。前政权的无数狂热信徒残余势力已遍布俄罗斯各地。虽然§R大审判§!已告终结，但对德国而言，战争远未结束。"
 OMS_far_eastern.8.a: "而太平洋终于松了一口气"
 OMS_far_eastern.10.t: "人非圣贤，孰能无过"
 OMS_far_eastern.10.desc: "第一次重启。军官夺过电话接收东京指令。命令很明确——辖区指挥官认定德国轰炸已触发死手系统，核战争已然爆发，要求立即实施报复性打击。他放下电话回望，部下们如石雕般僵坐着，雷达屏上密密麻麻布满了光点。\n\n第三次重启。他的理智终于追上了早已翻江倒海的直觉。在生命最后时刻感到难堪——这着实诡异——但他还是狼狈地吐了一地。若换作部下如此失态，他定会下令鞭刑。扭曲几近癫狂的笑容中，他突然惊觉自己的指挥作风与升迁前遭受的暴虐如出一辙。\n\n第四次也是最后一次重启，技术员成功追踪到导弹的基础速度和目标数据。首波导弹直指满洲，更多正飞向中国、台湾乃至日本本土。他颤抖着取出激活密钥与副官对接，两人小心翼翼地将钥匙插入存放发射密码的金属柜——此前哪怕偷瞥一眼都足以判死刑。\n\n理智与良知在脑中尖啸着要他悬崖勒马。万一系统仍未修复？万一再次重启就能修好那台广东进口的计算机，证明那些光点只是幻影？若此刻按下按钮，终结两千六百年日本文明史的罪魁祸首就将是他。但军令如山。钥匙转动，那扇小小的金属门咔嗒弹开。\n\n"
 OMS_far_eastern.10.a: "大日本帝国万岁。"
 OMS_far_eastern.11.t: "紧急-总司令亲启"
 OMS_far_eastern.11.desc: "致：总司令亚佐夫同志\n\n发自：远东军区罗季奥诺夫上校\n\n主题：共荣圈部队在边境集结\n\n总司令同志：\n\n根据“黑手”组织同志们的情报，日本、满洲及其他共荣圈成员国正沿共同边境大规模集结部队，并进入高度戒备状态。我们还发现更多预备役部队携重型装备正向边境增员。目前尚无迹象表明这些人员物资的集结具有侵略意图，但其兵力密度令人担忧。\n\n为此，我部建议在东西伯利亚和远东地区组建新部队构筑防御工事。纵使共荣圈部队暂持中立立场，此举仍能为我们赢得时间，以防范日本及其卫星国可能发动的任何入侵行动。\n\n"
 OMS_far_eastern.11.a: "签名：伊戈尔·罗季奥诺夫上校"
 OMS_far_eastern.12.t: "美国大使馆外交电文"
 OMS_far_eastern.12.desc: "致：总司令亚佐夫及俄罗斯政府\n\n发自：白宫，华盛顿特区\n\n主题：最后警告\n\n我们始终密切关注东欧局势的发展。贵国军队及政府的行动已严重危及欧洲乃至全球的未来，东欧正不幸沦为这场史无前例暴行的受害者。\n\n另有充分证据表明，贵国正企图对冲突受害者实施惨无人道的种族灭绝与暴力行径。须知即便美利坚合众国及其盟国与德国阵营存在历史恩怨，若贵军继续在战场或欧洲平民区使用任何违禁武器，我方绝不会坐视不理。\n\n此函为白宫最终警告。\n\n签名，[GetPresidentFirstName] [GetPresidentLastName]"
 OMS_far_eastern.12.a: "告诉那个亲纳粹的杂种，让他像他那些条顿主子们一样去死。"
 OMS_far_eastern.13.t: "黑色警报-总司令亲启"
 OMS_far_eastern.13.desc: "致：总司令亚佐夫\n\n发自：远东军区罗多伊诺夫上校\n\n总司令同志：\n\n远东局势已急剧恶化。除日本及其盟国在本地区显著增兵外，美军海空力量近日持续在我领海边界附近与日方开展联合演练，此类军事演习已持续逾十日。\n\n西伯利亚东部防御工事的筹备时间所剩无几。美日联军显然正酝酿陆海空立体攻势。必须立即集结部队保卫辖区所有港口，并部署足够兵力抵御OFN与共荣圈联合入侵——绝不容许他们干扰大审判。\n\n"
 OMS_far_eastern.13.a: "告诉那个亲纳粹的杂种，让他像他那些条顿主子们一样去死。"
 OMS_far_eastern.14.t: "FOF 5"
 OMS_far_eastern.14.desc: "伊戈尔急促地深呼吸着，看着最后一批团结协定部队仓皇撤离村庄。他迅速检查了弹匣——子弹所剩无几。这座毫无天然屏障的村落完全暴露在敌军的火力覆盖下，继续坚守只会陷入四面合围。当晚，他带领小队在一栋相对完好的民宅里安顿下来，打算建立前沿救护站。就在他们搜查建筑物内守军可能留下的诡雷时，伊戈尔刚要发出安全信号，却意外发现了件有趣的物件。\n\n一把保养良好的三弦巴拉莱卡琴，静静倚在废弃衣柜旁。他嘴角掠过一丝笑意——战前家里也有这么一把，那时他可没少练习。或许现在还能弹个小曲提振士气？他拾起乐器靠墙坐下，将步枪搁在身侧。队员们好奇地围拢过来，想听听他能否演奏些耳熟的旋律。随着试音的拨弦声响起，琴音很快流淌开来。\n\n令众人惊喜的是，他弹起了《卡林卡》。起拍舒缓，歌声沉静。即便歌曲进入欢快段落，他的手指依然在琴弦上行云流水。为避免曲终时的尴尬冷场，他紧接着又奏响了《三套车》。这个在战场上沉着冷静的神枪手，此刻正用琴声提醒着人们：即便在战争阴霾中，也能偷得片刻闲暇，为战友们弹唱欢歌。"
 OMS_far_eastern.14.a: "仅此一夜，歌声盖过了战争的喧嚣。"
 OMS_far_eastern.15.t: "收复符拉迪沃斯托克"
 OMS_far_eastern.15.desc: "弗拉基米尔曾直面关东军及其美国盟军顽强而狂热的抵抗。然而历经万难，自伟大卫国战争以来，俄罗斯的黑旗首次在这座城市中心升起。共荣圈与美军联军倾尽全力反扑，而他从战役伊始就深陷最激烈的战场。当日军首次越过边界进入联盟领土时，他刚从阿穆尔州偏远农场的穷乡僻壤被紧急征召入伍。如今，他已成为向亚洲敌人实施§R大审判§!的大军一员。\n\n尽管只受过最基础的训练，但亚佐夫统治下的生活早已教会他无条件服从。寻常民兵首次遭遇卡壳时可能会惊慌失措，但他和战友们不会。他们在故乡严酷体制中学到的东西，远比一年新兵训练所能提供的更多。难怪当召唤来临时，他和同伴们都能挺身而出，向盟军及其劣等走狗、甚至那些听信谎言的俄奸实施复仇。\n\n为表彰作战英勇，弗拉基米尔的小队被钦点执行特殊任务，负责围捕那些在战斗尾声弃械投降者。被驱赶至市政厅的日本人、中国人和美国人注定难逃一死，但俄奸们仍幻想着同胞身份能换来宽恕。当“黑手”军官向弗拉基米尔小队下达命令时，时间仿佛在俘虏们惊恐的眼中凝固——那道处决令，清晰得不容任何误解。"
 OMS_far_eastern.15.a: "“叛徒绝不宽恕，”弗拉基米尔毫不犹豫地了结了他们。"
 OMS_far_eastern.15.b: "“你们的命都是总司令亚佐夫同志赏的。”弗拉基米尔放下了步枪。"