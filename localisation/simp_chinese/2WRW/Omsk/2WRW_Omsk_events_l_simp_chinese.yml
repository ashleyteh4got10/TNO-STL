 OMS_forpol.10.t:0 "刺骨寒风与俄国牲畜"
 OMS_forpol.10.desc:0 "满洲可真他娘的冷。基里尔听说要去打日本人那会儿，他还以为会是更……更具异国情调的地方呢。什么丛林啦，稻田啦，之类的。可他眼前只有冰冷的森林和冰冷的平原。\n\n他和其他弟兄们缩在篝火边。他们一个个瞧着都不一样，可又都那么相似。又一阵寒风钻进他的骨头缝儿里。秋明也会冷，但跟这儿比起来，简直不算什么。这里的风能把你吹个透心凉。在家的时候，他有妈妈，还有俄式茶炊。他有暖和的毯子。可在这儿，他只有军装、破旧的帐篷和一堆篝火。烤火也是个折腾人的事儿。离得太近了烫得慌，离得太远了又冻得哆嗦。\n\n自从离开秋明，一场战争就在他心里头打响了。一边是为祖国复仇和效力的激动。另一边是思乡和对未知的恐惧。恐惧渐渐占了上风。\n\n基里尔隐约听见帐篷布扑簌作响，便转过身去。中尉就站在那儿。他是个野兽般的壮汉。他走到中央，用沙哑的嗓子吼着日本人和什么游击队的事。基里尔努力想听清楚，可他快要打瞌睡了。就在这时，突然…\n\n“起来！起来！都给老子站起来！起来！滚出帐篷！滚出去！”\n\n他们像牲口一样被赶了出来。基里尔这下可一点儿也不困了。落在后头的被军官用警棍一通好打。他们被驱赶到一片空地上。到处都是叫喊声和尖叫声，可直升机的轰鸣声一起，他就什么也听不见了。但当鞭子抽下来的时候，他很快就明白了。\n\n这些牲口被赶进了不同的直升机。他们可不就是牲口吗。没有自主，没有思想，没有希望，也没有梦想。他们只是任由主人的鞭子摆布。主人叫他们吃，他们就吃。主人叫他们睡，他们就睡。主人叫他们走，他们就走。主人叫他们打，他们就打。"
 OMS_forpol.10.a:0 "一个没有自由意志的人，还能算是人吗？"
 OMS_forpol.11.t:0 "[Change Later]"
 OMS_forpol.11.desc:0 "[Change Later]"
 OMS_forpol.11.a:0 "[Change Later]."
 OMS_forpol.12.t:0 "在满洲里的山岗上"
 OMS_forpol.12.desc:0 "当直升机降落时，基里尔和其他人立刻被拽了出来。他们的长官告诉他们，接下来要进行长途行军。大致意思是，如果降落得太近，日本人就会发现他们。他们一连走了好几英里。尽管寒风凛冽，基里尔却满头大汗。当他们终于爬到山顶时，他已喘不上气，但就在这时，他看到了他们。游击队员们！军官们大声喊出暗语以辨认队伍，但很快就被红色战士的欢呼声淹没。他们开始奔跑，黑色战士也自然而然地跟着奔跑起来。他们在中间汇合，共同欢庆这一美好时刻。\n\n“大家好啊！”“那把枪真漂亮”“那老家伙还能打吗？”“嘿，我家马的毛色都比这好看！”“这行军可真够呛......”“有人知道我家怎么样了吗？我来自巴尔瑙尔？”\n\n起初是欢呼和互报姓名。然后，他们在一场杂乱无章的行军中回到了游击队的营地，这场行军要是让高级指挥官看到，肯定会大发雷霆。在那里，他们收到了最甜蜜的礼物——酒。游击队员给士兵们倒伏特加，但多数年轻士兵几乎喝不下这种烈酒。然而在这个夜晚，他们终将学会如何饮用。\n\n红黑两色的战士们瞬间融为一体。他们玩牌、下棋、喝酒、唱歌、跳舞、哭泣又大笑。这是游击队几十年来最快乐的一晚。这是游击队数十年来最快乐的时刻。这不仅属于他们的夜晚，也是基里尔和黑衣士兵们数月来最欢愉的时光。这些人不会厉声发布命令，也没有威胁要进行军法审判。不，他们是朋友。他们是理解彼此困境的老兵，而在一夜欢庆之后，他们将把日本鬼子赶回朝鲜。\n\n狂欢整夜后，基里尔跌跌撞撞回到放置物品的地方。他用毯子裹住身体，酒精让身体暖和起来。当他昏沉入睡时，脑海中只剩一个念头......"
 OMS_forpol.12.a:0 "......有游击队在我们身边，我们会没事的。"
