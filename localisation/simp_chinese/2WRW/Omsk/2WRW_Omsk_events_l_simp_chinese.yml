 OMS_Post_unification.1.t:0 "黯黑的西伯利亚"
 OMS_Post_unification.1.desc:0 "但凡对联盟信条尚存忠诚之所，便必有背叛潜行；而上尉，总能嗅出那股子背叛的酸臭味。这位如困兽般的行刑者在各个角落间逡巡游弋，终于，他找到了下一个“审问”的目标。那人正独自站在一根锈迹斑斑的路灯柱旁，借着那昏暗得不合时宜的光线读着报纸，周遭空无一人。\n\n“公民同志，”他朝那年轻人吼道，“可否耽误您一分钟？”\n\n“哦、哦，呃，同志，”那人结结巴巴地开口，“我、我实在该去上班了。正所谓，书能入魂，一时忘了辰光，不是吗？”\n\n“一派胡言！”佳特洛夫上尉挥了挥他戴着手套的手，“我说了...”\n\n上尉缓步上前，将戴着手套的袖口轻轻搭在那年轻人的肩头。佳特洛夫的脸上渐渐浮起一丝笑意——那股恐惧感，几乎触手可及。\n\n“你叫什么名字，同志？”\n\n“是维、维克多，维克多·谢苗诺夫。”\n\n“那么，维克多！你该庆幸遇上了我。我嘛…自认比旁人要宽仁几分。咱们不妨小叙片刻，或许，还可以聊聊你手上这份精美的报纸。”\n\n“长、长官，我、恐怕再不走，店里就要开——”\n\n“我说，谢苗诺夫，你在哪儿高就啊？这大雾弥漫的，难怪你会耽搁。毕竟，这种鬼天气，一不留神就会迷失方向的。”上尉用他那锐利的目光凿穿了年轻人惊惧的眼神，迫使他将视线投向脚下的路面。\n\n“阿、阿纳斯塔西娅书店，就在莫洛科娃街边上。”\n\n“是吗？那你们这种店，都卖些什么书啊？”\n\n“呃、呃，这个嘛，我想是什么书都有吧。童书啦、历史啦、哲学啦。我们…我们真是能找到什么就卖什么。我负责柜台，孩子们好像还、还挺喜欢的。”\n\n佳特洛夫沉默了片刻，脸上那虚假的笑容缓缓收敛，最终凝成了一张冷硬如铁石的面孔。\n\n“那么，请自便吧，维克多·谢苗诺夫。愿你未来的事业一帆风顺。”\n“当、当然，长官。光荣归于俄罗斯！”那人如蒙大赦般，一溜烟窜进了茫茫的雾霭之中，独留下尉一人沐浴在那片灯光之下。\n\n佳特洛夫将戴着手套的手探入胸袋，从中取出一本黑色的小记事簿。他迅速翻阅着，掠过数百条格式相同的栏目，最终在一个空白的方格前停了下来。"
 OMS_Post_unification.1.a:0 "嫌疑人51号：维克多·谢苗诺夫。罪名嫌疑：向易受蛊惑的青少年散布颠覆性文献。处理方案：立即处决。"
 OMS_Post_unification.2.t:0 "窒息的寂静"
 OMS_Post_unification.2.desc:0 "马克西姆坐在桌前，机械而有节奏地组装着上头命令他制造的几支步枪的套筒。过去一周，他一直咬紧牙关，生产配额又给延长了，现在他不得不通宵干活。他早就完成了规定数量的武器零件，妈的，大多数时候他甚至还超额完成了。\n\n“蒂玛，这他妈的算什么事儿？我们明明一直在赶制零件，他们现在又这样折腾我们？”\n\n蒂玛连忙压低声音：“马克斯，住嘴！你忘了维佳了吗？你想吃枪子儿？”\n\n马克西姆还没来得及回应，蒂玛就走开了，说是去‘拿零件’。心烦意乱的马克西姆重新开始组装套筒，他听见了头顶悬空走道上联盟士兵靴子踩踏的嘎吱声。恐惧之下，他赶紧埋头继续赶制套筒，在肾上腺素的驱使下，他的双手竟能一次组装好几个。\n\n没过多久，蒂玛回来了，他怒视着马克西姆的零件，嘴里含混不清地咕哝着几句勉强能听懂的话。随即，扩音器嘶哑地唱起它那不祥的歌谣：“4673号工人，立刻到最近的办公室报到！4673号工人！”扩音器终究还是安静了下来，工厂陷入了一片死寂。\n那些曾与他偶尔闲聊的同事们的眼神，此刻都变成了暗淡的死灰。工厂里万籁俱寂，只有他耳中嗡鸣不绝。他站起身，每迈出一步，双腿都针扎似的疼痛。\n\n办公室的门很沉，他推开时，门发出沉闷的呻吟。这间简陋的屋子里，站着两名黑色同盟的士兵和一名军官。军官招呼他进去。在仿佛永恒的沉默中枯坐良久后，军官终于开口了：\n\n“工人，你叫什么名字？”\n\n马克西姆清了清嗓子，咕哝道：\n\n“马克西姆·拉里奥诺维奇，先生。不过我的朋友们都叫我马克斯。”\n\n“这么说，马克西姆，你就是负责制造步枪套筒的了？”军官反问道。在回答之前，马克西姆注意到军官眼中闪过一丝寒光，一丝病态的施虐欲爬上他的嘴角，勾勒出一抹残忍的微笑。\n\n“是的，先生。我主要制造步枪套筒，不过其他武器零件我也会做。”马克西姆答道。\n\n军官飞快地在一份文件上划掉了好几个选框，随后抬眼盯着马克西姆。\n\n“感谢你的合作，4673号工人。”军官说完，掏出手枪，朝马克西姆挥了挥，然后扣动了扳机。"
 OMS_Post_unification.2.a:0 "他们休想腐化我们的伟业…"
