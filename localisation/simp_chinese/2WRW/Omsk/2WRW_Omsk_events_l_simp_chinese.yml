 OMS_Post_unification.4.t:0 "教之以恨"
 OMS_Post_unification.4.desc:0 "伊万诺坐在教室里，尽管他已同此暌违多年。如今这里再也没有亲切的教师们不失优雅地教授俄语、数学和他们周围的小小世界。取而代之的是一位沧桑的老人——他脸上有道从鼻尖延伸至眼边的巨大疤痕，玻璃义眼取代了其中原有的血肉。\n\n老师落座，自称拉扎尔。他扯下一张干净的地图，向大家展示俄罗斯本应拥有的广袤领土。紧接着，拉扎尔指向地图西方，开始描述德国佬对祖国母亲肆意凌虐的暴行，甚至有些俄罗斯同胞因此开始同流合污，乃至投敌入伍。\n\n耳濡加之目染，伊万诺惊恐不已。他也曾听闻西部如传说一般的暴行故事，但假设他们所言非虚，那么德国人在此之外还可能会犯下多少罪恶？\n\n拉扎尔深知这群平民正陷入震恐，于是不断地举出一条又一条令人沮丧的数据，几乎将课堂上的氛围压迫至绝望的谷底。在下课之前，他决定给人们提供一个仇恨的目标。\n\n“我们......能对此做些什么？” 一个妇女向他呼喊。\n\n“你们可以奉献汗水、时间以及所有仅剩的对祖国的热爱，与我们一同抗击条顿的梦魇！” 拉扎尔回以微笑。"
 OMS_Post_unification.4.a:0 "先发制人"
 OMS_Post_unification.5.t:0 "毫厘之差"
 OMS_Post_unification.5.desc:0 "叶卡捷琳娜正专注于手头的工作。她在中央档案局核对文件，这里存放着从军事行动到民众动员宣传运动等一切最重要机密。作为女性，她能被委以如此重任着实令人惊讶——尽管工资低得危险，还要忍受厌女环境的刁难，但她热爱这份工作。\n\n当她翻阅政治犯档案时，发现标注政治犯关押地点的文件不翼而飞。反复核查后，她不得不承认这个异常：虽然以往也出现过文件归类混乱的情况，但那些不过是无关紧要的普通档案，而这次丢失的可是存放在档案局最核心区域的机密文件。这种程度的纰漏从未发生过，虽然她并未感到恐慌，但疑虑始终萦绕心头。\n\n她起身走向办公桌，提笔记录下“五份档案失踪”。刚写下这句话，就开始纠结是否应该留下书面记录。以往出现类似疏漏时，即便不是她的责任，上司也会对她大发雷霆，而男同事们即便犯下同样错误，却很少被如此责难。握笔的手微微发抖，焦虑感逐渐蔓延。最终，她还是擦除了记录——应该没关系吧？当深吸一口气试图平复心情时，档案局的挂钟敲响了整点报时，她默默回到岗位，继续埋首于文件堆中。"
 OMS_Post_unification.5.a:0 "她很快将此事抛诸脑后。"
 OMS_Post_unification.6.t:0 "定格的生命"
 OMS_Post_unification.6.desc:0 "彼得罗娃一家也许只是苏联时代的一个普通家庭。但在卫国战争后，随着黑色联盟的到来，一切都变了。战争结束后，这个家庭被迫分离，如今只能通过哈萨克斯坦的秘密联络渠道偶尔向莫斯科维恩寄信。\n\n叶莲娜·彼得罗娃如往常一样操持着家务，但四个月前收到的那封信始终萦绕在她心头。她的丈夫被困在莫斯科维恩，如今已成为莫斯科维恩国防军的一名士兵，并承诺很快就能与她团聚。她立即回信，表达了对黑色联盟可能发现她与“合作者”联系的担忧。通常，回信需要四到六周，但五个月过去了，她仍未收到任何回复。\n\n尽管被迫与丈夫分离，叶莲娜已经变得坚强。最初的日子里，她每晚都以泪洗面，但现在，她已准备好面对任何阻碍——哪怕是冷酷无情的黑色联盟。\n\n门铃响了。\n\n刺耳的铃声回荡在这间狭小的公寓里。有人登门拜访，这本身就很反常。她快步走向前门，打开门，看到五名警察——他们的制服漆黑如夜。为首的警官开口说道：\n\n“彼得罗娃女士，我们不得不以‘破坏全俄黑色联盟’以及‘勾结合作者’的罪名逮捕你。”\n\n“什么？！你们不能——”\n\n警察们不由分说地搜查了整个公寓，并逮捕了她留在俄罗斯的所有家人——她的母亲、父亲和儿子……他们被押上警车，从此消失于历史的尘埃中，再没有人见过他们，仿佛从来没有存在过一样。"
 OMS_Post_unification.6.a:0 "大审判的车轮轻轻碾过又一个家庭。"
 OMS_Post_unification.7.t:0 "齿轮用力磨"
 OMS_Post_unification.7.desc:0 "鉴于黑色联盟全体人员均须符合最高体能标准，联盟医疗部于本日签发-078431号令（签发人：尼古拉·米哈伊洛维奇·阿莫索夫）要求最高统帅格拉科维尔赫·亚佐夫暂停职务，接受全面身心检查。此期间，黑色联盟指挥权依《继任章程第178号》移交叶夫根尼·萨温采夫；最高统帅职责由领导层按预案分摊。\n\n叶夫根尼·萨温采夫如常以一杯黑咖啡并做了两百个俯卧撑后开始了当日工作。\n06:30至09:30期间，他审阅了五百名罪犯、异见者及生理缺陷者的名单，判决结果如下：二百三十七人调往伊尔库茨克-克拉斯诺亚尔斯克公路重建工程，一百一十二人派往莫斯科边境排雷作业，余者押赴沃尔库塔参与联盟新兵实弹训练。10:15，他与外交部长亚历山大·萨哈罗夫斯基进行三英里晨跑，途中批准了对罗马尼亚亲民主人士的暗杀计划。\n\n11:45，萨哈罗夫斯基召集“外交部”成员商讨土库曼斯坦问题。作为俄罗斯国家复兴政府的边疆，中亚日益成为其心腹之患——该地区充斥异端思想、布尔什维克残余及法西斯分子，乃虚弱与堕落之温床。最终，一名低级官员提出的方案获其首肯：向中亚主要城市大规模迁入经审查的俄罗斯忠诚人口，同时暂时驱逐未受监管的突厥与哥萨克族群。\n\n14:20，萨哈罗夫斯基会同经济部长叶夫根尼·皮托夫拉诺夫及经济部领导层，就“大审判”战备进度召开会议。皮托夫拉诺夫多次申请增调劳动力以强化新波兰-莫斯科边境要塞工事，均遭亚佐夫与萨温采夫驳回。双方最终拟定草案：抽调救赎兵团投入低优先级产业，腾挪可信劳动力加速修筑堡垒、碉堡及大审判后的救生防御体系。\n\n18:00，皮托夫拉诺夫与尤里·德罗兹多夫共进晚餐，讨论西西伯利亚连环破坏事件。德罗兹多夫指认西伯利亚黑军残部所为，皮托夫拉诺夫则归咎于德国间谍。双方仅就“安保等级翻倍”达成一致，随即起草方案：将新西伯利亚设为封闭城市，驱逐所有妇女儿童及未审查平民，仅保留可信劳工。此模式将逐步推广至复兴政府所有工业枢纽——届时，叛徒与破坏者将无处藏身。\n\n24:00，最高统帅亚佐夫结束检查归返。其办公桌罕见地空无一物。他步入寝室，脱靴就寝，未有一丝忧烦。"
 OMS_Post_unification.7.a:0 "领导者的职责不是培养追随者，而是培养更多领导者。"
 OMS_Post_unification.8.t:0 "胜利的代价"
 OMS_Post_unification.8.desc:0 "俄罗斯的统一为德米特里·亚佐夫的生命中注入了一种他此前只在下属面前佯装表现出的特质。如今，他终于可以毫无疑虑地宣称自己真正拥有了某种确信感。此刻，他完全有底气确信联盟的实力，也终于能真正掌控自己民族的命运之舵。然而，眼前仍有许多待解决的问题——毕竟，他不能就这样贸然冲进雅利安人的领土。\n\n此刻聚集在他面前的议会成员受命敲定联盟当前面临或未来数月可能遭遇的所有难题的解决方案。随着商议持续至深夜，很明显，确实有几个问题必须解决，否则联盟在即将到来的考验中胜算堪忧。\n\n争论最激烈的议题聚焦于产能不足、资源获取受限以及敌方掌握的技术优势。解决问题的途径固然存在，但与会者都清楚，现行经济能力必将严重制约改革方案的实施。\n\n听闻这番结论，亚佐夫后脑一热，当即起身发言，会场顿时鸦雀无声。\n\n“我认为你们所有人都忘记了一个核心问题，当年我们进军俄罗斯并实现统一的时候，靠的可不仅仅是产能优势或者火力压制。”\n\n所有人的目光齐聚于他，与会者开始如坐针毡。\n\n“我们的胜利源于钢铁意志，源于绝不肯放弃人民寻求彻底复仇之日的执着。而你们现在却告诉我，这份意志竟不足以解决眼前的困境？”\n\n"
 OMS_Post_unification.8.a:0 "“我们立即着手实施，长官。”"
 OMS_Post_unification.9.t:0 "姓名，年龄，以及籍贯"
 OMS_Post_unification.9.desc:0 "“下一个。”\n\n检查站军官瓦西里·斯米尔诺夫用拇指揉着太阳穴，看着又一个窝囊废磨磨蹭蹭地挪到了岗哨窗口前。\n\n“姓名，年龄，出生地。”\n\n“嗯，呃，我叫伊万诺夫，”那个矮小、甲虫似的男人咕哝道，“伊万·伊万诺维奇，是的。”\n\n“你他妈耍我呢？”\n\n“当然没有，检查站同志。”\n\n“证件拿来，”斯米尔诺夫哼了一声，“我谅你也不敢不带。”\n\n伊万·伊万诺夫瑟缩了一下，将一本护照从玻璃下方递了过去。斯米尔诺夫一见封面上那镰刀锤子图案，便叹了口气。\n\n“伊万诺夫，你看这儿像苏维埃联盟吗？”\n\n“唔，这是我最新的——”\n\n“最新的？”斯米尔诺夫笑了，“伊万诺夫，信我一句，你要是想糊弄人，也别他妈的蠢到这份上。”\n\n“同志长官，上面写着，我出生在斯维尔德洛夫斯克。”\n\n“伊万诺夫，你不会指望我看这破玩意儿吧？你魔怔了？”\n\n一时间，伊万诺夫局促不安地挪动着身体，眼看就要哭出来了。就在斯米尔诺夫以为他要转身离开的时候，他又开口了。\n\n“刚才过去的那位女士，她是我——”\n\n“你老婆？伊万诺夫，这套说辞我听腻了。我他妈才不管是不是真的，重点是：你要是拿不出这十年内印发的文件，你就别想过去。明白吗？”\n\n“呃，我还有这个。”\n\n当伊万诺夫递过来一张崭新的纸条，上面赫然盖着一个黑色万字符印章时，斯米尔诺夫只觉得汗毛倒竖，脸上的笑容也僵住了。他端详了片刻，才再次开口。\n\n“伊万·伊万诺维奇，你是大日耳曼国的公民？”\n\n“准确地说，是莫斯科维恩的公民，不过，是的。”\n\n“那你为何试图进入俄罗斯？”\n\n“为了逃难，”伊万诺夫茫然地盯着他，仿佛这是理所当然的事，“为了和我的家人团聚。”\n\n“伊万·伊万诺维奇，你可清楚，这份文件等同于叛国，是与德国占领者通敌的铁证？”\n\n“叛国？”伊万诺夫脸色煞白，“这不可能。我从未通敌。我怎么可能通敌呢？”\n\n“好吧，伊万·伊万诺维奇，”斯米尔诺夫伸手去拿电话，“这事儿，就得由我们来查个水落石出了。”\n\n斯米尔诺夫将听筒凑到耳边，等着接通的忙音。听到另一头传来一个男人含混的应答声后，他开口说道。\n\n“是的，我是D点的斯米尔诺夫，我这儿需要一两个人手。不，没什么危险，就是个通敌分子。哦，对了，他老婆可能已经过去了，叫，呃，玛利亚·伊万诺娃。建议当场处决。她估计也问不出什么。”"
 OMS_Post_unification.9.a:0 "“下一个。”"
 OMS_Post_unification.10.t:0 "以儆效尤"
 OMS_Post_unification.10.desc:0 "这是梦吗？伊莱亚斯不确定方才究竟发生了什么。自从俄国人来了，把所有人都赶进了旧日的隔离区，无休无止的饥饿便日夜啃噬着他的肠胃。其他一些孩子曾教伊莱亚斯尽量多喝水，好骗过肚子，让它以为饱了。伊莱亚斯觉得这法子管用，但他心底深处明白，那终究不过是个自欺欺人的把戏罢了。大人们也知道这点，所以他们每天早上都打发孩子们出去，向卫兵讨些吃食。通常情况下，卫兵们只会对他们大吼大叫，拳打脚踢，直到把他们像苍蝇般赶跑为止。但今天，趁着无人留神，那个眼神和善的老兵俯下身，从铁丝网的缝隙里伸过手，塞给伊莱亚斯一个背包，里面鼓鼓囊囊，装满了面包。\n\n伊莱亚斯背着那个包，飞也似地冲过隔离区的街巷。他一路狂奔，能清晰感觉到那些饥肠辘辘的德国同胞们，以及那些俄国卫兵的目光，如同针芒般扎在他身上。但他决不停下，除非回到家中。每多跑一步，背上的行囊似乎就更沉重一分，仿佛里面装的不是救命的食粮，而是冰冷的砖石。即便背包重得让他脊背火烧火燎，伊莱亚斯也咬紧牙关，丝毫不肯放慢脚步。他的家，就在前面那个拐角了。\n\n他一头冲进家门，看见了爸爸和爷爷，但他们身边还有其他人。大约十二个人挤在厨房的桌子旁，研究着铺在桌面上的地图。地图上画满了红色的箭头和叉号，埃利亚斯觉得自己好像还在房间角落里看到了几支步枪。还没等他弄明白发生了什么，便因方才那阵亡命的奔逃而耗尽了气力，双腿一软，瘫倒在地。爸爸急忙冲过来扶他，而桌旁的一些男人看到从他背包里满溢而出的面包时，竟爆发出了一阵压抑不住的欢呼。听着他们略带嘶哑的歌声与笨拙的舞步，感受着爸爸那粗糙的手掌轻柔地抚过他的头顶，伊莱亚斯疲惫而虚弱地笑了。\n\n霎时间，整个世界化为一片炫目的惨白。伊莱亚斯想开口问问究竟，喉咙里却干涩得发不出半点声响，双耳则被震耳欲聋的轰鸣彻底填满。当他试图尖叫时，涌入口中的，尽是呛人的灰烬与温热的鲜血。他根本来不及细想，一股远超他所能想象的恐怖巨力便狠狠碾压在他的胸膛之上。同样迅疾地，现实的帷幕仿佛被无形的大手骤然撕裂，无边无际的漆黑从中那豁然洞开的裂隙奔涌而入，吞噬一切。\n\n当硝烟散尽，尘埃落定，一行用充满恨意的黑色油漆草草写下的字迹出现在残破的建筑上。"
 OMS_Post_unification.10.a:0 "认清你们的命运。抵抗只是徒劳。"
 OMS_Post_unification.11.t:0 "我们准备好了"
 OMS_Post_unification.11.desc:0 "门砰然关上，充作德米特里·亚佐夫寝的地堡重归寂静。亚佐夫与他的幕僚们刚刚结束了又一场会议，主要议题聚焦于黑色联盟部队当前的战备状态以及民众士气的报告。数十份充斥着令人头晕目眩的数据的文件摊在他面前的桌上，亚佐夫逐一仔细审阅。会议结束的那一刻，他外在的形象判若两人，从世人眼中那个冷酷无情、铁石心肠的汉子，变成了一个颤抖着摘下军帽，猛灌了几口伏特加的男人。\n\n多少心血已经倾注。多少生产设施拔地而起，异议分子被无情镇压，军事单位历经训练与整编，诸如此类不胜枚举，以至于亚佐夫早已开始期盼那一天的到来。那一天，他将下达那道命令，一切得以开始。那一天，当大审判得以发动之时，祖国的救赎终将实现。但在其幕僚的建议下，他推迟了那道命令，只为让俄罗斯能够为大审判真正做好万全的准备。\n\n而今，在如此漫长的等待之后，那一天已近在咫尺。终于，他想。终于，这一切都将值得。自他的导师将引领联盟命运的重任托付于他之日起，每一个以鲜血换来的进展时刻，都将值得。当俄罗斯的旗帜在日耳曼尼亚上空飘扬，当雅利安人被俄罗斯的武装彻底消灭的那一天到来…终于，对他的人民犯下的罄竹难书的罪行，将得到最后的清算。\n\n亚佐夫叹了口气，从座位上站起身，伸手去拿他的军帽，他再次想起，在所有这些思绪化为现实之前，手头仍有几件未竟之事需要处理。他走出房间，朝广播站走去，准备在迎接命运之前，向他的人民发表最后一次慷慨激昂的演说。"
 OMS_Post_unification.11.a:0 "“子夜将至。”"
 OMS_Post_unification.12.t:0 "人人为我"
 OMS_Post_unification.12.desc:0 "就在几天前，叶戈尔本该在战场上与条顿人厮杀。然而，他却趁着夜深人静之时，带上了一些他「借来」来路上用的额外补给，埋头朝着与前线相反的方向狂奔。逃兵的身份对他来说毫无意义。作为独子，父母白发苍苍时唯有他能照料。他无法想象自己不在身边时他们是如何艰难求生的，于是逃走了。他担心逃兵身份会连累家人，必须赶回家带他们逃离这该死的俄罗斯。\n\n终于，他看到了远方的村庄，它一如既往地坐落在山上。可男丁尽数征召后，村落看起来死气沉沉，一片凄凉。他冲上山坡，穿过集市，直奔村尾。沿途只见老妪与稚子。\n\n他走进从小长大的家，又往前几步踏入熟悉的老客厅，发现母亲坐在沙发上，目光呆滞地盯着前方，整个人精气神全无。她看起来苍老了十岁，叶戈尔进来时，她甚至没有认出他。\n\n“妈，你在这儿！我们得走了，我必须带你和爸离开这儿，他人呢？我去找，你快收拾——”\n\n“他们带走了他。”母亲的声如死水。要是她还有眼泪的话，早就哭出来了。\n\n“因......因为我？”叶戈尔浑身发冷。\n\n“不。他们只是需要人手。发了军装，配了枪，什么都有了。告诉他要去西边。”她终于敢直视儿子的眼睛。\n\n叶戈尔心如坠冰窟。这群家伙根本不在乎逃兵，他们榨干所有人，连风烛残年的老头都不放过。他知道前线的情况，那里不是老人该去的地方。\n\n叶戈尔挨着母亲坐下，将她紧紧搂住。两人都目光空洞地盯着前方，因为最好保持沉默的想法在他们的脑海里闪过。"
 OMS_Post_unification.12.a:0 "绝无例外。"
 OMS_Post_unification.13.t:0 "数字中的真相"
 OMS_Post_unification.13.desc:0 "阿布拉沙坐在一间暗室里，金属桌椅冰冷的触感，是唯一能将他从昏昏欲睡中拉回现实的外界刺激。今天，他奉命前来，处理一批“全新的数据”。说实话，任何新工作对他而言都算是一种恩赐了。\n\n自从被从他挚爱的故乡托木斯克调离，来到这座被联盟称为“首都”的、压抑而简陋的城市后，他已在同样陈腐的行政文书工作中消磨了数月光阴。尽管食物实行配给制，也缺乏任何可称之为中产阶级消费品的东西，但对阿布拉沙而言，最主要的问题仅仅是无聊。\n\n但现在，或许阿布拉沙能接触到一些新事物了。或许这甚至能让他将在大学里学到的本事派上用场。当他通读并审视交到他手里的每一份档案夹时，他脸上掠过一丝几乎无法察觉的微笑。他的愿望成真了，他尽其所能地品味这一刻——在这个幸福本身即可被视为奢侈品的时代。\n\n他被指派审视并诊断经济的健康状况，为此，他获准查阅数份联盟的机密档案。阿布拉沙心想，或许肩上的责任很快就要加重了。\n\n十一个小时后，那个一度衣着整洁的男人，此刻已是狼狈不堪，汗水顺着他的脸颊滴落。室内的温度已高到让他难以忍受，将外套也扔到了地板上。那地板上，此刻散落着无数的文件与图表，共同描绘出一幅骇人的图景——一幅只有具备相关知识的人，才能解读的图景。\n\n他缓缓地瘫坐下来，身子顺着墙壁滑落。此刻，阿布拉沙才真正地洞悉了一切。俄罗斯已然没有了经济。取而代之的，是一台被构筑起来的引擎。那台引擎吞噬着昔日繁荣的残骸，只为一场全面战争提供燃料——一场在结束后，永无可能回归常态的战争。直到此刻，他才真正明白俄罗斯正驶向何方，正被整个吞入仇恨的黑暗深渊。"
 OMS_Post_unification.13.a:0 "“他们对祖国都做了些什么？”"
 OMS_Post_unification.14.t:0 "在矿场"
 OMS_Post_unification.14.desc:0 "“俄罗斯境内没有雷区，上头命令他们必须保持这种状态。\n\n官方说法里，黑军团宣称战俘需要‘驯服祖国’——用血肉给农场沃土施肥，用躯体为基建城邦铺路，再掘出沟壑埋葬死者，好让国家根基更加稳固。\n\n但真相是，列昂尼德和他那群年轻囚犯接到的任务，是要清除遍布祖国大地的雷区——那都是俄罗斯军阀们互相倾轧时埋下的。有时候照着雷区地图排雷还算轻松，更多时候就像在干草堆里找绣花针。\n\n排雷难度因囚犯身份雪上加霜：根据他们曾经效忠的军阀以及所谓‘战争罪行’的轻重，每人获得的待遇天差地别。若是跟过天真却仁慈的军阀，再加上‘祖国忠仆’的评语，或许能领到工具和每天一片面包。反之要么赤手空拳排雷，要么直接被赶进雷区处决。\n\n他总盼着有一天，自己和同伴们能重获自由。但只要最后一个条顿人还没死绝，只要正义尚未降临，他们就永远别想挣脱枷锁。"
 OMS_Post_unification.14.a:0 "扫清俄罗斯的前路"
 OMS_Post_unification.15.t:0 "前沿之士"
 OMS_Post_unification.15.desc:0 "又一个西伯利亚的深夜降临，安德烈仰靠在椅背上，两手分别攥着报纸和伏特加酒瓶——白天他根本没时间读这份报纸。报纸的大标题用粗体大号字写着：“*德*国*威*胁*发*动*核*战*争*”。在同一页的底部角落，有一条来自政府的公共服务公告，告知公众，国家战略工事优先准入权将分配给现役军人及其家属，随后才轮到普通民众。\n\n安德烈心中五味杂陈。一方面，由于他在统一战争之前就在联盟政府机构工作，所以他、他的妻子和孩子都保证能有一个名额。但另一方面，除了人类自身可能彻底毁灭之外，安德烈还在思考数百万未能进入避难所的俄罗斯同胞的命运。他们是否会被弃之不顾？是否会被当作达到目的的手段而被抛弃？最后一个念头的结论足以让安德烈相信，他应该去睡觉了，忘记这些想法，回到征兵办公室工作，不要再思考这些问题。\n\n第二天早上，他看到了前所未有的景象。通常，征兵办公室几乎总是空荡荡的，安德烈在这栋大楼里工作了十多年，他的团队从未遇到过如此多的应征请求。\n\n但那天早上，当他去开门时，看到了一排排队伍，绵延数英里之长。安德烈看到了成千上万张惊恐的脸，他们无疑读到了同样的文字，并产生了与他前夜相同的想法。\n\n那天，安德烈帮助数千个家庭获得了避难所的名额，越来越多的人恳求让他们的父亲和丈夫应征入伍，以便他们也能避免想象中最糟糕的命运。然而，随着越来越多的人恳求应征，安德烈知道，在军方阻止进一步征兵之前，他只能拯救这么多人。"
 OMS_Post_unification.15.a:0 "复仇需付出最高昂的代价。"
 OMS_Post_unification.16.t:0 "无以复加之苦"
 OMS_Post_unification.16.desc:0 "弗里德里希·沙费尔少校坐在椅中，双手被铐，遍体鳞伤，血污狼藉。他身上新添了数十道创口，不断渗着血水。到了第三天，那些人拔光了他的指甲，鲜血浸染了他一度整洁如新的制服。审讯室酷寒彻骨，四壁乃至每一处表面，均由毫无特性的灰色砖石砌成。周遭死寂，唯有头顶灯管发出的嗡嗡电流声萦绕不绝。\n\n囚室的门被骤然撞开，“砰”地一声巨响，重重砸在墙面。两名黑色联盟的男子——皆是出自新生的审讯骨干队伍——拖着沉重的步履走了进来。在他们身后，一个新面孔登场了。\n\n此人身材奇高，高到不得不弯腰低头，才能从门楣下钻过。他秃着头，身着一袭白色实验袍。双臂长得出奇，像是被拉伸的太妃糖一般瘦长；戴着黑色手套的五指间，一支盛着琥珀色液体的注射器正不安分地晃动着。“啊，病人到了。”一名审讯员殷勤地递过一张凳子，放在沙费尔那动弹不得的躯体旁。“劳烦诸位久候了，”那医生含笑说道，在递来的凳子上安然坐下。“但愿我的这些朋友，没有对您太过粗暴。有时候，我想他们之所以如此行事，大约也只是出于单纯的无聊罢了。”他脸上的笑容略微收敛了几分，“又或者，他们是亲眼目睹了斯摩棱斯克所发生的一切。”\n\n弗里德里希朝医生脸上啐出一口混杂着血沫的浓痰。“现在就杀了我，你这下等人。我什么都不会告诉你。”\n\n“悉听尊便，我的朋友。不过嘛，我倒很想亲自验证一下这个假说。”医生一把攫住沙费尔的手臂，不发一语，便将针头深深刺入他一根就近暴起的静脉。数秒之内，那琥珀色的药液便悉数注入了他的体内。\n\n少校全身的每一根神经仿佛瞬间被悉数点燃。他顿时浑身痉挛，口吐白沫，身不由己地疯狂扭动挣扎，他身下的椅腿在水泥地上刺耳地刮擦滑动。弗里德里希发出一声惨叫，头骨重重磕裂在坚硬的地面上。肺部剧痛如绞，心脏悸动欲裂。“求求你！”他嘶声力竭地尖叫道，“我说！我什么都说！”\n\n“不，我的朋友，”医生答道。"
 OMS_Post_unification.16.a:0 "[Change Later]\"I'm getting wonderful data from this.\"[Change Later]"
 OMS_Post_unification.17.t:0 "不劳而获之辈"
 OMS_Post_unification.17.desc:0 "[Change Later]\"Please! It's not for us, it's just for the baby! Pleeease!\n\nYuri's hands tightened around the rough kitchen counter, growing whiter with every cry of desperation from his sobbing wife. A whole year they had been 'living' in this soulless concrete shell. A year since they had had every family photo, every rug and ring, every ounce of color mercilessly stripped from them, sent into the belly of the foul factories. A year he had been forced to feed them, put screw upon miserable screw into radios he could never play, first aid kits he could never use.\n\n\"Pleeeeeease! Just take half! Leave us with some! Our baby is all we have!\"\n\nBut they had kept going, like reeds floating in rapids, trying their damndest not to snap. And it had paid off. The miracle of life. The League could not snuff out the joy that a parent felt as a child, their child, grew. But they were trying their best. For the crime of possessing some simple wooden blocks and and some meager rations, they had sent two of the League's lackeys; a snivelly but ferocious boy, his hat too big for his head, and a towering giant of a man, his eyes two sharpened daggers. A duo as comical as it was terrifying.\n\nBut Yuri didn't care. This would be his stand. The knife in the drawer beneath his hand was bent and blunted, but it stabbed all the same. He would show everyone what good Russian people did to those who crossed the line. He'd wipe that stupid smug face off this baron in black. He would -\n\nAngela crumpled to the floor, her arms clutching her bloodied and mutilated belly, her face now a reflection of Yuri's soul: pale and panic-stricken.\n\n\"There! Now you really don't need these little blocks and extra calories.\"\n\nWith a pleased smile, the two devils in uniform exited through the door, the baron giving Yuri one more crushing glare. A glare of pity, as if he was a fool to think he had ever had any control of the situation. A glare of victory.\n\nAnd then the room was silent again. The frantic cries of Angela, replaced by quiet, uncanny sobs. The rage that had filled Yuri's soul, now crushed, ground into dust, and scattered before the cold midnight wind. And the beating heart of his unborn child, silenced. They would now never gaze upon all the colors and lights and sounds and smells of the world.\n\nBut perhaps that was for the best."
 OMS_Post_unification.17.a:0 "为了俄罗斯的伟大复兴，再大的牺牲也在所不惜。"
 OMS_Post_unification.18.t:0 "去芜存菁"
 OMS_Post_unification.18.desc:0 "一阵敲门声从巴尔瑙尔郊外一座简陋的房屋中传出，这里是[OMS.GetName]境内的主要产粮区。小屋的主人即将迎来一个不愉快的早晨，因为他本打算在第二天出售他的粮食。\n\n“尼基塔同志，你的谷物被判定不适合供应普通民众。它对于大审判时的人民来说，太过昂贵和奢侈了。”\n\n尼基塔猛地一颤，仿佛被抽走了灵魂。这位无名军官否定了他的收成，也否定了他的生存可能。尼基塔惊慌失措地喊道：“但、但是你们不能这样做，这可是全年的存粮！我靠什么去换配给粮？会饿死的！你们总不会这么狠心吧？”\n\n尼基塔盯着这位军官，希望哪怕只有一次，黑色联盟钢铁般的纪律能网开一面。哪怕只此一次。军官的眼神细微地闪烁了一下，或许他们会按标准粮价收购，即便不同意他开的价格。他们怎么敢这样？联盟崩溃后，他白手起家，才在巴尔瑙尔建立起这份家业！\n\n军官缓缓摇了摇头，“先生，在国家的大局中，一个农场主的生命并不重要。如果你饿死了，自然会有另一个更有能力的人来取代你。我们将开始没收这批不合格的粮食。请离开田地，否则你将因叛国罪被捕。”\n\n军官别过头去，避开这残酷的场景。有那么一刻，他心生异念。不过是农民标价失误，定为量产不就结了？这么简单的事值得赶尽杀绝？如果一个政府要重建俄罗斯，却又要摧毁自己的人民，那还有什么意义？\n\n他的思绪被尼基塔突然打断，这位农民现在跪在地上，哭着乞求再给他一次机会。“我会重新种的，我不在乎别的！只要够活命就行！”在这场对峙中，军官说的最后一句话简单而残酷......"
 OMS_Post_unification.18.a:0 "“不。”"
 OMS_Post_unification.19.t:0 "优先供给士兵"
 OMS_Post_unification.19.desc:0 "即便经历了世界上最严苛的训练项目，米泽诺夫从未觉得联盟亏待过自己。入伍让他获得了温饱、栖身之所，甚至赢得了前所未有的尊重。\n\n而这还远未结束。许多平民遇见他时，往往会因他即将参加大审判而向他致敬，或是赞扬他的英勇。这些认可总让他更为身为事业一份子而自豪，可人们眼中总似蒙着某种挥之不去的阴翳。\n\n米泽诺夫一直不明白原因，至少，直到他的部队经过他童年的村庄。\n\n当运输车在路上颠簸时，他望向年少时栖身过的屋舍。尽管记忆中这些建筑从未光鲜，但它们也从未像现在这样破败。砖墙残破不堪，许多窗户都被木板钉住了。\n\n就在这时，他看到了村里的居民。每个人都面黄肌瘦，似乎至少有一周没有进食了，瘦得皮包骨头。他们的脸上满是绝望的神色，这种神色是米泽诺夫自大轰炸以来就再也没有见过的，有些人甚至看起来陷入了更深的绝望......\n\n看着同胞们陷入这样的境地，米泽诺夫几乎要落泪了。随着车队穿过更多的乡村地区，这样的场景一遍又一遍地重现。一个又一个村庄，男女老少都成为了战争机器的燃料。这是他生命中唯一一次，对联盟的怀疑在他心中生根发芽，逐渐变成了一种深藏不露的愤怒。也许，他心想，俄罗斯除了雅利安人之外，还有一个更深、更黑暗的敌人。"
 OMS_Post_unification.19.a:0 "“复仇的代价永远不会太高。”"
 OMS_Post_unification.20.t:0 "车间众生"
 OMS_Post_unification.20.desc:0 "“听着！”\n\n这真是一个奇怪的开场，与他们平时所生活的非人环境截然不同。多米尼克确信，这无非又是一些关于增加配额或是小幅度晋升之类的老生常谈，以前从未有什么特别之处，今天也不会例外。在巴尔瑙尔的工厂里，工人们始终笼罩在集体悲观主义阴影下。所有人都清楚自己终将坠入死亡的冰冷怀抱，倒不是对此心生恐惧，毕竟当下与死亡也并无太大分别。\n\n“根据全俄罗斯黑色联盟中央指挥部的命令，我们将教你们如何在条顿人可能对我们发动的核袭击中生存下来。最近的防空洞位于左侧走廊尽头，紧邻办公室区。一旦防空警报响起，请立即前往避难所。若动作不够迅速或来不及抵达指定避难所，请保持冷静，尽可能躲进建筑物深处。其他信息将在你们收到的手册上详细说明，感谢配合。”\n\n士兵簇拥着军官，给大楼里的每位工人分发手册。印在纸上的图文指南详细展示了应对条顿人核弹的分步求生方案。多米尼克惊诧于当局竟会流露这般温情，亦或只是为确保廉价劳动力存续。无论如何，这不过是给予民众虚无希望的拙劣尝试。他怀疑大多数人根本无意求生，自己或许可一试，但废墟世界中苟活真能比现在更幸福吗？从他听到的关于这种外国“核弹”的零星信息来看，生活在一个被核弹摧毁的世界里似乎并不愉快。"
 OMS_Post_unification.20.a:0 "他失去了他们试图给予他的那一丝希望。"
 OMS_Post_unification.21.t:0 "地堡西扩"
 OMS_Post_unification.21.desc:0 "水泥搅拌机的低沉轰鸣和卡车引擎的怒吼将瓦季姆从短暂的睡梦中惊醒。自联盟占领村庄仅一周左右，这段日子简直让他度日如年。每日清晨六点开始，占领者便会在环绕聚居地的山丘上展开施工，直到傍晚九点才停歇。他们究竟在建造什么？他全然不知。工人们抵达当日，村中长老曾召集众人，严令村民无论如何都要远离那些施工人员和工地。\n\n这些外来者让他恨之入骨。自从那群混蛋来了之后，他再没能睡过一个安稳觉！是时候采取行动了，哪怕要付出些该死的代价。他走出家门，穿过村中央广场，沿着陡峭山径向主工地攀爬，最后拨开灌木丛，窥探下方的场景。\n\n约莫二十人在场，多半像是苦力工人。他们形容枯槁、神情憔悴，要么排队接受军官检视，要么在中央的大坑里挥汗如雨地劳作。眼看那些人将厚重的水泥板和钢制舱门吊入越掘越深的坑洞中，瓦季姆心中疑云更甚。这里究竟在搞什么名堂？最近像样的小镇是数百英里外的瑟克特夫卡尔，他们这穷乡僻壤有什么价值？他们到底在建造什么？某种掩体？甚至是地下掩——\n\n他与一名军官四目相对。对方突然指向他的脸厉声呵斥。若再多待一秒，他根本没空听清那些即将抛向他的吼叫与命令。他只知道自己必须拼尽全力逃跑。\n\n冲回村庄喘息方定，他蹑手蹑脚往家走，暗自祈祷那群人不会再认出他。"
 OMS_Post_unification.21.a:0 "最好别到处窥探。"
 OMS_Post_unification.22.t:0 "掘地三尺"
 OMS_Post_unification.22.desc:0 "桌前围坐着一群工程师和建筑师，他们展开数张设计图纸，这些图纸是临时召集的会议讨论焦点。联盟命令他们再次集结，商讨扩建那些曾耗尽心血打造的同类型地堡方案。虽无人敢抱怨或拒绝命令，但所有人心中都涌动着焦躁。\n\n最为恼火的是被任命为组长的科利亚，他发现情况从轻微棘手演变得令人头疼——在场众人都清楚，扩建地下掩体的需求会暴露出上级根本无力承担的建材缺口。\n\n他们必须寻找替代方案。更廉价的、能大批量供应各基地自主扩建的建材。\n\n灵光乍现——钢材。只需达到铅板两倍厚度就能实现同等级防护效果，而成本仅有三分之一。若采用最大程度用夯土层隔离钢制内衬与潜在放射尘埃的设计，掩体居民尚可保全性命。\n\n但高效空气过滤系统随即成为新难题——按照联盟指令，这些设备同样需要重新设计。\n\n科利亚和团队陷入沉思：如何在降低空气过滤标准的同时确保掩体居民安全？最终答案只能是赌上几个实验方案的可行性。\n\n当然，他们绝不会向拨款方透露实情——呈现存在明显逻辑缺陷的方案将招致严厉惩处。于是众人面带得体的微笑，向监督委员会郑重汇报了新设计方案的“重大突破”。"
 OMS_Post_unification.22.a:0 "绝望会带来不可预见的后果。"
 OMS_Post_unification.23.t:0 "边境有耳"
 OMS_Post_unification.23.desc:0 "今天本该是休息日，布劳恩望着车窗外的倾盆大雨，边驾车返回俄德边境的前哨基地边想。不知为何，元帅又把他召到前线处理些无关紧要的事，多半是关于奴隶暴动的破事。\n\n刚一抵达基地，他的目光就落在沙盘桌上的地图上。看到眼前触目惊心的布防图，他浑身血液都凝固了——过去几周里，“复兴政府”竟然在德占区边境大规模集结兵力，而他却毫不知情？他知道俄国佬们完成了统一，但入侵德国？荒谬！更让他不寒而栗的是，这会对自己仕途造成怎样灾难性影响。\n\n突如其来的质问声吓得他浑身一颤，是上司。“能解释你的渎职行为吗，中将先生？你近期严重缺勤。”大将冷峻的声线像刀刃般劈来。\n\n“大将阁下，我并未接到需要严阵以……”布劳恩话音未落，随着刺啦一声响，上司怒不可遏的拳头将地图上的德占区边界撕开一道狰狞的裂痕。\n\n“你以为这是儿戏吗？！”怒吼声震得他耳膜发痛，“你在莫斯科逍遥快活的档口，前线随时可能遭袭！我要作战方案，现在！立刻！滚去执行！”\n\n1963年大动乱时期，他亲眼目睹战友在鄂木斯克投降后遭遇的虐杀暴行。难道就因他的懈怠，要让同胞们毫无准备地面对这群疯狗？若让这群野兽突破莫斯科、圣彼得堡甚至更远……\n\n“这就筹备构筑永久工事体系，实行全体成年男子紧急征召制，启动特别防卫预案。”他颤抖着立正敬礼，“胜利万岁！”\n\n看似强硬的表态下，布劳恩的后背已被冷汗浸透。俄国人确实贫穷落后，但亚佐夫的黑色联盟掌握着最危险的武器——仇恨。那种吞噬人性、嗜血残酷、毫无底线的仇恨。为毁灭优等民族，这群野兽会动用任何战术，实施任何暴行，哪怕是最堕落最残忍的手段。"
 OMS_Post_unification.23.a:0 "困兽之斗。"
 OMS_Post_unification.24.t:0 "铁锁重门"
 OMS_Post_unification.24.desc:0 "马林合上日记本，叹息着望向窗外的街道。此刻，思念如同钝刀般折磨着他的心——那些关于挚爱萨莎的思绪。他们已许久未见，每过一日，那份蚀骨的疼痛就在他脑海中愈加鲜明。\n\n他猛然直起身子，眼中闪过决意的光。余光瞥向座钟，时针即将指向晚间十点的宵禁时刻。马林在房间里来回踱步，手指深深插进发间。他本可以再熬过一个夜晚——多半又是个不眠之夜。但最终他还是决定铤而走险，去见数月未见的挚爱与灵魂伴侣。\n\n月光如水倾泻在路面上，既是指引也是威胁。当第一支联盟巡逻队开始扫荡街道时，他如幽灵般靠着断垣残壁的掩护，娴熟地绕过了十余支巡逻队。距离萨莎的公寓仅剩一个街区时，胜利的微笑刚浮上嘴角——下一秒便被黑暗中痛彻骨髓的惨叫声撕碎。\n\n他踉跄站起，身后纷乱的脚步声与手电光柱已交织成网。枪械上膛的脆响刺破夜空，马林将全部希望赌在双腿爆发力上。转角处萨莎的公寓窗口透着微光，那道生死线不过三十米之遥。\n\n可后背突然炸开灼热的剧痛……他的身躯像断线木偶般栽进血泊。渐暗的视野里，萨莎惊恐的脸庞凝固在窗前。当两人目光相接的刹那，马林耗尽全力扬起染血的嘴角。最后的意识中，唯有温暖的爱情与澄澈的喜悦永远定格。"
 OMS_Post_unification.24.a:0 "俄罗斯最后的希望之烛正在熄灭。"
 OMS_Post_unification.25.t:0 "苔原上的碉堡"
 OMS_Post_unification.25.desc:0 "安德烈加入黑色联盟是为了在第二次大审判中为失去的家人报仇。为了夺回莫斯科。为了彻底消灭德国鬼子。而在俄罗斯欧洲部分的草原上挖战壕，这与他最初的抱负相去甚远。他陷入无尽循环：醒来、吃早餐、挖掘、吃午餐、继续挖、吃晚餐、再接着挖、然后睡觉。更糟的是，地面几乎被天气冻得硬如铁石。何况第二天还要下雨。到时候泥土变成泥浆，他们大部分劳动都可能付诸东流。但在安德烈眼里，这些都无所谓。他们已经在同一个鬼地方挖了三周，却毫无成效。\n\n他再次将铁锹插进面前的土地，金属碰撞声骤然响起。他又反复试探了几次，每次都是同样结果。“为什么停下？”督战的政委厉声质问。“是冻土，长官，”安德烈回答，“冻得太硬了！”\n\n“那就挖得更快！更狠！用手刨也要继续挖！”\n\n“想要进度就自己抡铁锹下来挖啊！”一名士兵突然吼道。政委猛然转头锁定声源，抬手示意卫兵把那人拖到跟前。\n\n“名字？”政委咆哮道。那年轻士兵非但没退缩，反而将一口浓痰啐在政委右眼上。整个营地瞬间凝固。政委用皮革手套恍惚地擦着脸。\n\n沉默中，他缓缓从枪套抽出配枪。就在击发的瞬间，人们还能看见那名列兵徒劳挣扎的模样。子弹穿透颅骨后，尸体向后倾倒进战壕。“稍后开饭钟响谁也不许停，”政委下令道。\n\n次日大雨如注。正如安德烈所料，雨水抹去了他们所有的劳动痕迹。"
 OMS_Post_unification.25.a:0 "那名士兵的尸体一直没有找到。"
 OMS_Post_unification.26.t:0 "电视将一片深黑"
 OMS_Post_unification.26.desc:0 "尤斯京娜·诺维科娃正在克拉斯诺亚尔斯克郊外的平房家中操持日常家务。她与四口之家共同生活——两个女儿玛丽安娜和拉娜、丈夫阿德里克，再加上她自己。总的来说他们是幸运的，阿德里克不必奔赴前线，在当地军工厂工作就能维持全家生计。就在她快要做完当天家务时，拉娜跑了过来。这个充满艺术天赋的孩子常向母亲展示画作，但今天的作品却格外骇人。\n\n画面上，一个头戴德式钢盔的恶魔正被火焰吞噬，在火刑柱上痛苦挣扎。围绕刑柱的人群欢呼雀跃，目睹德国鬼子受难。童稚的笔触使画面显得拙朴失真，却透出令人不安的气息。尤斯蒂娜小心翼翼地把画递还女儿。\n\n“看！德国鬼子在被火烧呢，就像老师说的那样！我在电视里看到的！我恨那些邪恶的德国人！”拉娜带着孩童特有的愤怒叫嚷着。这般激烈的宣泄总让尤斯京娜不寒而栗，她无力招架这样的质问。“妈妈也恨他们吗？”\n\n“这个嘛……恨是很可怕的感情，拉娜，非常可怕。”她谨慎地回应。\n\n小女孩皱起眉头：“可老师说恨敌人才对！而且‘俄奸’都背叛我们了！”\n\n“妈妈只是不希望你画这种内容，乖。”\n\n拉娜气鼓鼓地把画作揉成团，攥在圆嘟嘟的小手里：“我要告诉老师你不让我画！”\n\n尤斯京娜一把按住女儿肩膀：“你敢！反了天了？！照我说的做！把画扔掉，要是敢告诉老师，罚你一周不许吃晚饭！”歇斯底里的呵斥化作尖锐的颤音，吓得拉娜浑身发抖瘫坐在小椅子上啜泣。\n\n尤斯京娜深知自己反应过激，随即用温柔的语气安抚幼女。她长叹一声，这声叹息不仅为那幅可怖的涂鸦，更为自己失控的言行。"
 OMS_Post_unification.26.a:0 "恨意渗入稚子之心"
 OMS_Post_unification.27.t:0 "一次正义的复国行动"
 OMS_Post_unification.27.desc:0 "布里利亚科沃村被卡车轮胎的打滑声和第35机械化步兵师冲进村庄时的叫嚷声惊醒。士兵们沉稳的脚步声与惊慌失措的村民们仓皇逃窜的足音混杂在一起，后者正试图躲避潜在的德军入侵。\n\n一个肩宽体阔的军官傲慢地开始宣读事先准备好的声明。“根据全俄黑色联盟的命令，本村将被征用并移交国家，用于国防建设。任何抗拒逮捕者均以叛国罪当场击毙。”\n\n村民们害怕联盟的恐怖，一个接一个地向占领者投降。身披黑衣的士兵们闯进他们的房屋，将路人驱赶至村广场。但敢反抗者皆遭殴打，运气差些的直接被枪杀。之后，他们被赶到几辆卡车上，这些卡车会把他们带离他们所珍视的一切。只有15名叛逆青年和老迈长者拼凑的群体仍在抗议。然而，军官并没有推搡他们，而是开始宣读这些人显然犯下的反俄罪行清单。\n\n接着军官抬起戴手套的手，打了个响指，这群人便不复存在。十分钟后，他们被扔进了雪沟里。仅仅四个小时后，人去楼空。后来，善良的俄罗斯民众将会听说，他们在国家基础设施建设期间“遭到了纳粹同情者的袭击”。尽管偶有疑议传扬，却无人过问，更无人采取任何行动。\n\n建设正在进行中，进展顺利。这个村庄将成为为大审判准备的军事基地。这个前沿军事基地将作为向“莫斯科维恩”的掠夺者进攻的先锋。这个站点只是众多据点之一，却将在我们对抗条顿威胁的战斗中发挥至关重要的作用。"
 OMS_Post_unification.27.a:0 "此乃天命所归，吾辈必行之义举。"
 OMS_Post_unification.28.t:0 "这是我的铁锹"
 OMS_Post_unification.28.desc:0 "季米特洛夫格勒的生活，对栖身于此的居民而言，向来是一场无休止的挣扎。自1941年起，这座寻常城市里的居民们，便仿佛从未能真正喘过一口气。但近来，情况似乎有了转机。亚佐夫将城里先前的“主子们”尽数肃清之后，季米特洛夫格勒的日子便照常流逝，除了偶尔的军事动员等等，政府方面倒也没制造什么真正的麻烦。\n\n这般安宁，终究只是泡影。\n\n又是一个看似平平无奇的清晨，约莫六十名士兵涌入了城中。他们挨家挨户搜查，命令每家每户挑出两个最强壮的成员到屋外，直到凑齐了五十二个人。所有人被赶上卡车，士兵们宣称军队需要这些人服役，而他们将在今天履行爱国义务。\n\n所有问题都被敷衍了事，得到的答复无非是：“到了地方，我们的指挥官自会解释。”当他们果真到了地方，便被命令下车，按年龄排好队。接着，一个身着全套联盟卫队制服的男人走上前，开始用充满威严与自信的嗓音训话。“那边，”他指着一个方向，“是德国人。最高统帅部已下达明确指令，我们必须做好准备，以防与他们之间爆发任何冲突。所以，你们的任务，就是挖掘两公里长的壕沟。你们挖掘的每一铲土，都是在拯救俄罗斯军人的生命。开工吧！”\n\n于是，他们便动起手来。挖掘壕沟是重活，并非所有人都能适应这种劳动；但人多力量大，他们只花了大约三个钟头便完工并通过了军官的检查。连一句表扬都没得到，这群人紧接着就被勒令立即撤离该区域。他们重新爬上卡车，被送回了城里。返回城中的卡车上一路无话，但每个人心中所想，已是不言自明。"
 OMS_Post_unification.28.a:0 "大审判的黎明正在飞速接近"
 OMS_Post_unification.29.t:0 "稚眼稚耳"
 OMS_Post_unification.29.desc:0 "阿尔谢尼手捧着文件夹，急促的脚步声回荡在情报局的走廊里。那扇冰冷的金属门后，便是通往美国的通讯线路，他此行的终点。他带着一股决然的劲头猛地推开大门，门板重重地撞在简陋的灰白色涂料墙上。他将文件夹甩在柜台上，然后启动了电脑。他在房间里小跑着，手指飞快地拨弄着仪器旋钮，试图将无线电调至正确的求救频率。传真机已然启动，正如他所期盼的那样。一切都进行得天衣无缝，倘若能照此下去，世上将无人知晓阿尔谢尼·尼古拉耶夫曾踏足此地。\n\n他已经忍无可忍了。他的儿子，尼基塔，每天从学校回来，嘴里便絮叨着联盟本周又杜撰出的种种荒诞不经的鬼话——他们正日复一日地将他打造成未来德寇来犯时，完美的炮灰。他的妻子，日复一日地带着更深的愁苦归家，那被干部制度生生与其家人拆散的女人的泪水，总是浸湿他的白色礼服衬衫。这一切，真是他妈的受够了。美国人所知的，不过是联盟那真正堕落面目的冰山一角；要不了多久，老天保佑的话，他们便会获得行动的契机。\n\n阿尔谢尼正沉思失神，蓦地一个激灵。电脑根本无法连接到任何网络。无线电里传来的，只有一片嘶哑的静电噪音。而那台传真机，虽然指示灯亮着，却纹丝不动，显然也失灵了。他的心，直直地沉了下去。门砰地一声被粗暴地撞开，三名手持枪械的男子闯了进来。领头的，正是伊戈尔——联盟里唯一一个他勉强能处得来的军官，也是在这残酷无情的干部制度重组之后，他唯一能称之为朋友的人。\n\n伊戈尔的手指搭在手枪的扳机上，语气中带着一丝玩味：“阿尔谢尼。委实没想到会在这里碰见你，真是…令人扫兴啊。”\n\n“怎——怎么会？”阿尔谢尼的声音因恐惧而颤抖。\n\n“你倒是养了个好儿子。”伊戈尔拉下了手枪的击锤，黑洞洞的枪口缓缓抬起，对准了阿尔谢尼的额头。"
 OMS_Post_unification.29.a:0 "“有朝一日，他会成为一个好军官的。”"
 OMS_Post_unification.30.t:0 "真正的联盟同志"
 OMS_Post_unification.30.desc:0 "此生此世，伊万从未胆敢背叛联盟分毫。联盟是他的守护神，是会将所有与他同胞为敌者尽数碾碎的铁拳。纵然年仅十六，他却自认或许是联盟最忠贞不贰的赤胆忠仆，将每一次责打与训斥都视作恩赐，而非寻常的纪律管教。\n\n正因如此，当被分派至联盟的生产设施时，他毫无怨言。甫一抵达，他便为这些设施的宏伟规模，以及其布局之精巧繁复而惊叹不已。他旋即被编入一支干部队伍，并由队内一位同志悉心指导如何操作生产线上的设备。不出一个时辰，伊万便已投身劳作，生产着那些将助国家于艰危之际克敌制胜的战争机器。\n\n他或许是那儿最为狂热的一个，是新一代俄罗斯人的先声——他们成长的大部分时光里，所浸染的唯有联盟及其永无休止的宣传灌输。\n\n伊万的狂热正是联盟所亟需的，但对他身旁坐着的瓦伦丁而言，这无异于一场无妄之灾。他从未想过会到此地，数年前，他是被强行裹挟至此的。他深知那些胆敢对这般境遇发出微词之人的下场，但年复一年，他的忍耐也渐渐逼近了极限。而那一天终于来临，就在这位新人被安排到他身旁劳作数小时之后，一名身着纯黑制服的男子前来，向他们所有人宣告了生产配额的再度提升，以及休息时间的进一步克扣。\n\n他再也按捺不住，从齿缝间迸出一句低微却执拗的怨言。“我恨透了这个鬼地方，还有那些天杀的、作威作福的蠢货。”\n\n伊万听清了每一个字。他霍地扭过头，盯住那个胆敢妄议联盟的蠢材，却并未言语。当日稍晚，他便向一名干部告发了此事。及至他入睡时，他的铺友瓦伦丁还在。"
 OMS_Post_unification.30.a:0 "待他醒转，那张床已经空了。"
 OMS_Post_unification.31.t:0 "大俄罗斯壁画"
 OMS_Post_unification.31.desc:0 "帕维尔擦了擦额角的汗珠，端详着刚完稿的海报设计。和他近来所有作品一样，这又是奉命之作。呃，“奉命之作”这说法，未免太客气了点，说白了就是“一个五大三粗、凶神恶煞的制服大汉恶狠狠地吩咐他画，不画就没命，还得忍受微薄的薪水”，但眼下这光景，他也只能尽量往好处想了。\n\n他低头审视着自己的画作，除了那份聊以自慰的职业自豪感外，心头又泛起了那阵熟悉的苦涩。他本是个漫画家，画插画的。在黑色联盟踏入他那座西俄小城之前，他专为孩子们画些小动物的漫画，描绘它们的生活，教导孩子们要友爱互助。这些年来，他的画风确实精进不少，这点毋庸置疑。当然，绝非出于他本人意愿。\n\n过去，他笔下的线条柔和圆润，以博稚子欢心；如今，却变得锐利棱角，锋芒毕露。生活哲理、与人为善之类的题材，于黑色联盟而言毫无用处，温情脉脉更是碍眼——唯有宣扬战胜条顿、彰显俄罗斯精神优越的作品，方能入其法眼。他眼前的这幅画作便是明证——一名黑色联盟制服打扮的男子，轮廓分明，正一手扭断阿道夫·希特勒的脖颈。\n\n老画家叹了口气，瞥了一眼钟点。凌晨三点五十六分。后面还有五个主题等着他化为丹青。他有那么一瞬，想信手涂鸦几笔，权当放松，可他所用的每一张纸都有记录在案，若是“浪费”了纸张，便要扣钱。他又核对了一遍列表。下一个主题是“俄罗斯雄鹰撕裂德意志秃鹫”，画起来应该会挺有意思吧。但愿如此。"
 OMS_Post_unification.31.a:0 "大审判之下，容不得半分匠心独运。"
 OMS_Post_unification.32.t:0 "前线安好"
 OMS_Post_unification.32.desc:0 "帕维尔揩去眉宇间的汗水，铁锹再次深深扎入泥土。他已记不清自己究竟训练、挖掘、修筑了多久，也记不清为了国家最终痛击雅利安人，让其血债血偿的那一刻，自己准备了多久。他所在的旅队，训练强度已然变本加厉，远超往常，却无人置喙。人人都明白此举为何，有些人甚至乐于迎接这新的折磨。\n\n毕竟，每一滴鲜血，每一根断骨，每一刻痛苦，皆为薪柴。为了联盟那些勇敢的儿女，他们将向那些曾玷污、曾摧残过她，并以为她再无力重返世间的仇敌，索还血债。然而，他们如今屹立于此，蓄势待发，要将那些西方的败类撕成碎片，让复仇的烈焰将西方燃成焦土。\n\n帕维尔从他负责的那段防御工事抬起头，第一次完整地看到了他和战友们劳作的成果。连绵数英里的壕沟与地堡，周边的大地上还星罗棋布地挖掘了各种设计各异的防御工事。可惜，他片刻的赞叹很快便被指挥官整队的命令打断。帕维尔与战友们数秒之内便集结完毕，队列严整，人人昂首挺立，静候指令。\n\n“士兵们，我接到新的命令，关于联盟内部训练程序的调整。从即日起，你们每日仅有三次各五分钟的休息时间，并且，每日十英里跑改为十二英里。不过，鉴于本区域所有防御工事项目均已竣工，你们无需再协助施工。最后，射击场测试的最低命中率提升至百分之九十。解散。”\n\n休息时，帕维尔和另外两位朋友凑到了一起，谈论起未来的事。他们没有讨论那些新颁布的、几近严苛的训练要求，而是聊起了一个他们争论已久的话题。\n\n他们在争辩，谁将第一个踏入莫斯科。"
 OMS_Post_unification.32.a:0 "新时代的勇士们..."
 OMS_Post_unification.33.t:0 "罪证俱焚，活口不留"
 OMS_Post_unification.33.desc:0 "第十五条。若发现任何嫌疑人散布谣言，妨害大审判进程者，须将其从住所带离，并施以审讯，直至其交代清楚究竟为哪个条顿特务机构效力，以及曾向何人散布谎言为止。一旦交代，该员即刻处决。\n\n第十六条。若警察或其他任何安全机构人员接触到任何具有误导性或欺骗性的条顿宣传品，须将其送往就近的城镇焚烧堆，与任何其他日耳曼材料一并投入其中。唯有净化之火，方能从彼等卑劣材料中淬炼出些许价值。\n\n第十七条。若平民对黑色联盟成员或其他官方人员有任何不轨行为，须不惜一切代价将其制服。惩处措施包括但不限于：判处劳改营苦役二十年、撤销核防护资格、削减其已知亲属的口粮配给，乃至当场处决。"
 OMS_Post_unification.33.a:0 "第十八条…"
 OMS_Post_unification.34.t:0 "社会进步武装化"
 OMS_Post_unification.34.desc:0 "尤里经常不在家，这让娜佳心里总感觉怪怪的。她如今总在他们合租的公寓里漫无目的地游荡，从一个房间踱到另一个房间。几年前，这对情侣才在托木斯克的书友会上相识——尤里向来是个博览群书的人。\n\n想到另一半被迫在本地军工厂每周工作七天、每天轮班十四小时，她本该感到痛心——见不到他的日子无疑令她愤怒。但当他不在时，她开始偷偷翻阅尤里藏起来的禁书——那些因\"不够爱国\"而被黑色联盟查禁的书籍。\n\n从前他总不敢与她分享这些藏书。如今他忙得根本无暇阻止她，娜佳终于能自由阅读，这种自由感令她沉醉其中。\n\n当然，她知道亚佐夫绝非出于某种解放女性的崇高理想，俄罗斯不是会发生那种事的地方。但他的政策却阴差阳错带来了改变。娜佳蜷缩在沙发上，手里捧着尤里收藏的《战争与和平》，盘算着接下来还要做些什么——反正，她现在最不缺的就是时间。"
 OMS_Post_unification.34.a:0 "德米特里·亚佐夫 — 女性的盟友？"
 OMS_Post_unification.36.t:0 "隔墙有耳"
 OMS_Post_unification.36.desc:0 "尼古拉·沃尔科夫素来不是轻率之徒。生性多疑如同他酷爱红茶和俄国经典小说一般根深蒂固。他栖居在一栋年久失修的旧公寓里，多年来养成了过度关注周围动静的习惯。\n\n这个雨夜也不例外。当小镇沉入夜的惯常节奏时，他的住所却笼罩着反常的寂静。而真正攫住他注意力的，是隔壁那堵薄如宣纸的墙后传来邻居压低的交谈声。\n\n胸腔里的心脏突然加重了搏动，镇静的面具裂开一丝焦虑。谈话的韵律与强度都与往日不同，就连字句间的沉默都承载着不寻常的重量。某种异样正在发生。\n\n尽管具体的词句被墙壁筛去了大半，但某些片段却穿透隔阂，在他的房间与脑海中投下阴影。“比预期来得更快，”他听见男声说道。“必须早做准备，这会改变一切，”女人回应道。\n\n战栗顺着尼古拉的脊椎窜下，他的眼睛因狐疑而微微眯起。这是某种暗号？那些看似平庸的邻居莫非在进行秘密活动？时间一分一秒流逝，这个谜团反而越发紧攥住他的思绪，并最终使他作出了决定。\n\n他抓起老式电话急速拨通“一号专线”。听筒里传来严重失真的嗓音：“这里是投诉处，您有何事举报？”\n\n深深吸气后，尼古拉说出那句既令人悚然又不得不说的话：“我要举报——我的邻居可能是间谍。”"
 OMS_Post_unification.36.a:0 "“是个男孩，阿纳托利……是个男孩……”"
 OMS_Post_unification.37.t:0 "生产一切必需之物"
 OMS_Post_unification.37.desc:0 "门外传来一阵砰砰的巨响，紧接着是一声命令，要求立刻开门。一名工人慌忙跑到门前，拉开了门。门外站着的是一名黑色联盟的军官。那军官厉声要求与厂主谈话，声称这家工厂生产了过多的奢侈品，理应专注于生产社群与军队真正需要的物资。工人们把厂主叫了出来。厂主虽心怀不悦，却也迅速赶了过来。\n\n“这又是怎——”\n\n甫一见那军官，他的心便骤然停跳。\n\n“经查，贵厂未能遵守政府规定，生产了过量的奢侈品。”\n\n厂主开始啃咬自己的指甲。他心知肚明，生产奢侈品乃是违法行径，然而此举利润丰厚，已为他带来了巨额财富。\n\n“你们疯了吗？你们这帮蠢货正在毁灭俄罗斯！若是政府连这点屁事都要插上一脚，企业还怎么繁荣兴旺，我们还怎么在这里讨生活！”\n\n“我不会再说第二遍，立刻停止生产，否则格杀勿论。”\n\n厂主沉吟片刻。难道他真甘心为了这场胜算渺茫的战争，就将这万贯家财尽数抛弃？为什么偏偏是这帮人当权？换作任何一个别的政府，俄罗斯本该走向繁荣，可偏偏让我们摊上了这群蠢货。\n\n“少来这套虚张声势。我可是全俄数一数二的实业家，动了我，你们担得起后果？”\n\n军官叹了口气，平静地伸出手，摸向腰间的手枪。"
 OMS_Post_unification.37.a:0 "“再也不会有干扰了。”"
 OMS_Post_unification.38.t:0 "绝不妥协"
 OMS_Post_unification.38.desc:0 "一排排工人本以为能从起早贪黑的繁重劳作中喘息片刻，此刻却坐在投影仪前，身着黑色制服的士兵把守着各个出口。一些工人在硬椅上不安地调整坐姿，硬邦邦的座椅加剧了肌肉的酸痛。站在人群最前方的军官正用手指向投射着影像的墙壁。\n\n\"你们现在看到的是遇难者的遗体。德国畜生用肢解尸体的方式来惩罚他们的反抗。这些都是你们的俄罗斯同胞，也是在对抗我们宿敌的战斗中寻求救赎的勇士。这就是此刻正在发生的暴行，也是德国人计划得逞后准备施加在我们所有人身上的命运。\"\n\n胶片展示着莫斯科专员辖区的奴隶们挖掘的乱葬坑。男女老幼的尸体堆积如山，弹孔与刺刀划开的伤口遍布肌肤。画面切换为一群士兵凌辱一位试图刺杀军官的妇女，他们撕开她的衣服实施轮暴。部分工人本能地别过脸去，直到余光瞥见黑衣士兵的移动才被迫继续观看。\n\n施暴结束后，一名士兵掏出匕首开始捅刺。这场变态游戏逐渐演变为用她的身体制作纪念品。凄厉的惨叫很快归于沉寂，最终呈现的躯体失去了双耳、一只手和一侧乳房，腹部也被剖开。影片在此戛然而止。\n\n\"看清德国人对我们的刻骨仇恨，并记住我们将以牙还牙。他们必将承受雷霆之怒——我们的复仇——每个刽子手都逃不过正义的审判。\"[Change Later]"
 OMS_Post_unification.38.a:0 "震惊与恐惧化为复仇的怒火。"
 OMS_Post_unification.39.t:0 "十五从军征"
 OMS_Post_unification.39.desc:0 "军号的嘶鸣撕裂晨雾，将伊万从单薄的床垫上拽起。这个十五岁的新兵光脚站在寒气中，像过去五个月每天那样瞬间绷直身体。三十二名同龄新兵在各自床铺旁列队，少年们倔强的身影沿着兵营一字排开。\n\n军号响完二十三秒整时，教官踹门而入。他眼中闪烁着常年不散的怒火，以及将秩序与纪律烙进这群新兵蛋子骨子里的决心。\n\n\"科兹洛夫！立刻给老子挺直你那该死的背！\"呵斥声劈开清晨寒意，\"你打算驼着背打进德国去吗？\"\n\n被点名的少年在审视下瑟缩着结巴道：\"是、是的长官！我绝不会再犯！\"\n\n\"最好别犯。\"教官低吼。他扫视全场的目光如同窗外的寒风般刺骨，\"我们是天选之子，是重拾祖国荣光的利刃。我们承载着大审判的使命，绝不容许失败！\" 他的视线与伊万短暂交汇，某种无声的默契在空气中震颤。\"伊万诺夫，\"声音陡然转厉，\"昨天训练场第一个到的就是你？\"\n\n\"报告长官，是的。\"伊万在注视中纹丝不动。\n\n教官发出介于赞许与嘲弄之间的哼声：\"很好。今天要是当不了第一，加练套餐等着你。\"\n\n教官转身后，伊万目视前方，嘴角扯出冷峻弧度。新的一天就此开始。昨夜关于故乡的细碎梦呓仍在耳畔，但这里没有做梦的余地——唯有使命。"
 OMS_Post_unification.39.a:0 "祖国不需要多余的情感。"
 OMS_Warprep.1.t:0 "子时将近"
 OMS_Warprep.1.desc:0 "卫兵们屏息凝神，肃立注目，车队在马格尼托哥尔斯克，黑色联盟军事指挥部的门前缓缓停稳。车门开启。这个一度作为战争贸易枢纽而喧嚣的中心，此刻鸦雀无声，上至最高指挥官，下至卑微勤杂工，无不屏息。亚佐夫迈步向前，他那擦得锃亮的军靴在光洁无瑕、一尘不染的地砖上发出铿锵回响。\n\n“俄罗斯的男女同胞们”他嘶哑地开口。“我们正身处一个我们的先辈们世世代代所预言的时刻。很久以前，我们曾屈服于一个弥天大谎——我们劣于德意志蛮夷。因意志薄弱与军阀无耻，我们分崩离析。如今，一个名为‘大日耳曼国’的毒瘤，已深深扎根于我们祖国的肌体！然而现在，我们已然崛起，前所未有地强大。昔日我们四分五裂，如今我们则团结在同一面旗帜之下，为了同一个目标。昔日我们思想各异，如今我们则为了同一个宏愿而众志成城。复仇！向那些胆敢蹂躏俄罗斯、用他们那肮脏的血手掠尽我们一切的劣等民族复仇！从今日起，俄罗斯的公民们，大审判的兄弟姐妹们，这样的日子，一去不复返了！”演讲迎来山呼海啸般的掌声与欢庆，亚佐夫的嘴角扬起一抹笑意。\n\n“我们将击溃条顿匪帮和所有胆敢与之为伍的鼠辈！钢铁的绞索将勒紧他们腐朽的城邦！我们将碾碎所有反抗黑色联盟意志的螳臂巨石！他们将尝到苦难的真谛，奉上主之命，他们将永世绝望！”伴随着一番演练纯熟的激昂动作，亚佐夫陷入一种刻意控制的狂热，他将帽子抛向沸腾的人群，开始领着他们高呼。 “乌拉！乌拉！乌拉！”\n\n人群已陷入令他满意的癫狂，亚佐夫转身走回他的车队。今夜，还有无数这样的狂热集会在等待着他。\n\n"
 OMS_Warprep.1.a:0 "我军意志坚不可摧！"
 OMS_Warprep.2.t:0 "全面战争"
 OMS_Warprep.2.desc:0 "昏暗的地堡内，核心军官们围坐在桌旁。桌子中央放着一个硕大的马尼拉纸文件夹，封面上用粗大的黑体字赫然印着“大审判战略战术纲要”。军衔最高的军官拿起文件夹，从中取出一沓沓手册和图表，分发给众人。\n\n一名军官放下手中的文件，望向指挥官。“这里写着…坦克部队处理战俘的标准规程是…把战俘绑在坦克正面…？”\n\n指挥官点了点头。他大步走到那人跟前，翻过一页，指着如何将人正确捆绑到主战坦克前方的说明——上面还配有详尽的演示图片。\n\n另一名军官明显打了个寒噤，将手册推得离自己远了些。“焚毁开拓者农场的正确做法，包括在点燃牲口棚的四个角落之前，先把他们一家老小锁进去。我不明白这——”他的目光与指挥官怒视的眼神交汇，随即噤声不语，低头盯着面前的手册。\n\n桌子对面，一名年轻些的军官翻到了“公共建筑爆破”一节。他咳了一声，费力地想说自己要去趟厕所。门刚一关上，其他军官便听见了他的呕吐声。离他座位近的几人好奇地瞥了一眼他刚才读的内容，强忍住胃里翻江倒海的冲动。\n\n“在对德意志人口中心进行首轮轰炸时，应对学校建筑使用化学炮弹，以提高其立即投降的可能性。”"
 OMS_Warprep.2.a:0 "不择手段，只为胜利。"
 OMS_Warprep.3.t:0 "炬焚长夜"
 OMS_Warprep.3.desc:0 "当我踏上符拉迪沃斯托克灰色的码头，目光不由自主地飘向记忆中熟悉的天际线。上次造访这里之后，兰利美国中情局便把我视为某种中间人，而这次的任务又要将我带回这座阴郁的城市。令人惊讶的是，我的老伙计——那个总穿着绿色军装的小矮子——竟再次站在码头等候。他对我行了个夸张的军礼后，我们开始了再一次对话。\n\n \"谨代表美国政府确认，\"我说道，\"物资运输将照常进行。贵方对此是否满意？\"\n\n 与上次不同，这次的士兵似乎有了情绪波动。他们眼袋深陷，眼神比往常更加凶恶，全身紧绷，仿佛在刻意控制他们的动作，而非本能地保持这般训练有素的站姿。\n\n\"是的……\"他谨慎地开口，\"黑色联盟对贵方的持续支援深表满意。要知道我们在与可憎的条顿……\"他忽地语塞，这一次他显然没能接上标准答语。那种沉闷的阴云再次笼罩下来。\n\n\"我们在与可憎的条顿人作战中，贵国所有援助都将物尽其用。\"他虚声地补充道。\n\n \"那是自然。说起来，阁下身体无恙吧？\"\n\n \"无恙。\"他的回答更加慌乱。双方都察觉到一丝不对劲。\n\n\"我可以离开了吗？\"\n\n “可以。我们已为您安排了相当舒适的酒店房间。请先待到您的船班抵达。\"\n\n \"甚好。\"\n\n 两人的对话变得异常尴尬，就好像初次来访时那样，这座阴郁城市的令人窒息的压迫感每刻都在加剧。当我走过他的身旁时，一个黑色联盟的士兵刻意地撞了我一下，随后顺势将一个纸条塞进我的手心。现在我已安全回到美国，我决定在此记录下纸上的内容：\n\n \"审判在即。为您祈祷。\"\n\n 波将金村已被拆毁。\n\n"
 OMS_Warprep.3.a:0 "之后唯余复仇"
 OMS_Warprep.4.t:0 "血汗交响曲"
 OMS_Warprep.4.desc:0 "重型机械震耳欲聋的轰鸣与尖啸充斥着工厂宽敞却又逼仄的厂房。在这里劳作，无时无刻不是一种无休无止的苦役。车间里潮湿而又酷热得足以致命的空气，纵使是最强壮的汉子也会双膝跪地，乞求片刻的喘息。然而，每个工人都心知肚明，这样的哀求，只会换来警卫从背后射入颅骨的一颗子弹。\n\n瓦西里清楚，自己怕是活不过今天了。他无条件地深爱着他的儿子维克托，那是他每日祷告的主题，是他生命的全部意义。连续二十个小时的轮班之后，仅仅是想到能再见儿子一面，便成了他唯一的精神支柱。瓦西里温情地笑了，他将爱子维克托的音容笑貌珍藏在心底。\n\n突然，一声沉闷的、肉体坠地的声响打破了机械永恒的节律。那独特的、仿佛西瓜砸在水泥地上发出的闷响，短暂地压倒了所有噪音。瓦西里的头猛地转动，试图搜寻那声音的来源。他的目光最终停留在一处：一具纹丝不动的尸体，头部周围正迅速积起一滩血泊。是工厂里的一名女工。看样子，瓦西里猜测，她是因精疲力竭而昏倒，头部重重地磕在了她先前站立的水泥地面上。\n\n工厂管事惊动了警卫，他们迅速赶来，手中已备好了裹尸袋。警卫们铺开袋子，手脚麻利地搬动尸体，甚至都未曾停下查看她是否还有脉搏。就在警卫准备封上袋口之际，袋内的尸体却开始剧烈抽搐起来。其中一名警卫拔出手枪，扣动扳机，动作一气呵成，行云流水。那一刻，一反常态，周遭陷入了一片死寂，令人不寒而栗。\n\n此刻，失魂落魄的瓦西里缓缓走回自己的工位，他的大脑已然麻木，双手却仿佛有了自己的意识，机械地拉下操纵杆。维克托的影像在他的脑海深处若隐若现，而眼前所见的恐怖景象却不断地闪回，挥之不去。"
 OMS_Warprep.4.a:0 "哦，维克托，我为你祈祷一个更美好的未来。"
 OMS_Warprep.5.t:0 "彰显国威"
 OMS_Warprep.5.desc:0 "亚佐夫凝望着奥姆斯克的阅兵场，脸上洋溢着自豪的光芒。二十多条沥青铺就的宽阔大道，不惜血本地建在城市中心，专为展现黑色联盟呕心沥血铸就的强大武力。阅兵场横贯联盟总部、数座部委大楼以及大元帅的宫殿，其耗费如此巨资的理由已昭然若揭。这座阅兵场，以及全国各地数以百计的类似设施，无一不是纯粹力量与权势的昭示——无论是财政实力，还是军事力量。\n\n今日的场地上，一列列俄罗斯最精锐的机械化部队整齐排列。BMP步战车、BMD伞兵战车，以及来自大动乱各个时期的各型号坦克隆隆驶过，旁边则是一排排肃立在卡车车厢上、全神贯注的士兵。这与奥姆斯克最初的孱弱面貌已是天壤之别。从一群卑微不堪的民兵与残兵败将，发展到如今或许是莫斯科以东最强大的军事力量，尽管这进步是以人民的巨大牺牲和俄罗斯自然资源的枯竭为代价。然而，亚佐夫心想，这一切都是值得的。一队米格-23战斗机突然呼啸而过，它们飞得如此之高，其闪亮的镀铬涂层在高远的午后天空中只化作一个微小的光点。放眼整个俄罗斯，景象大抵如此。奥姆斯克的军队，为了同一个理由，同一个目标，同一个党派，正步调一致地行进着。\n\n丹尼尔在一旁默然注视，心中充满了无言的恐惧。作为NBC的俄国特派记者，他在这片土地上从未感到过安宁。他所目睹的一切都经过了精心的排练，他所听到的一切都出自拟好的讲稿，他所感受到的一切都显得虚假做作，极不自然。奥姆斯克这座城市本身，这些年来也已将其混凝土的触角向外无限延伸。巨大的预制板式公寓楼从先前荒凉的废土上拔地而起，却又被更加庞大的宫殿所笼罩，被那二十车道宽的阅兵场所分割。此刻他眼前所见的，那一辆辆滚滚向前的战车，丝毫未能缓解他内心的不安。一名陪同人员监视着他所有的笔记，于是他只能言简意赅。"
 OMS_Warprep.5.a:0 "一支足以震撼世界的军队。"
 OMS_Warprep.6.t:0 "沉睡的螳螂"
 OMS_Warprep.6.desc:0 "一阵刺骨的寒风扫过曾住着一户农家的破败房屋。在原主人们遗弃它数十年后，这座房子几乎就要散架。而对安德烈来说，这却是绝佳的潜藏处所。两年多来，他都蛰伏在地窖里，搜寻一切可得的食物，偷取所有必需品以确保能抵御自然界的任何挑战。\n\n因长期需要保持绝对隐蔽，安德烈的栖身之所肮脏不堪，唯独桌上那台崭新锃亮的手持电台格外醒目。当那个关键日子来临时，这台机器会突然发出电流杂音，向他传达摧毁附近德军驻地的行动暗号。每每想到此处，他的眼睛就会闪出激动的光芒。此刻他像过去两年每个日夜那样，正沉默地守在电台旁。\n\n某个与日相冲的月夜，接收器突然传出微弱电流声。安德烈瞳孔骤缩——苦等多年的机会终于降临？他屏息凝神，侧耳等待无线电彼端的指令。经历漫长如年的数秒后，沙哑的嗓音终于穿透静电干扰：\n\n“萤火。”\n\n安德烈几乎从椅子上扑跌下来，旋风般冲向作战岗位。肾上腺素冲刷全身，他咧嘴笑着冲到屋外废弃马厩旁，右手掀开防水布，露出早已标定好军营坐标的迫击炮。握住炮弹的瞬间，他流畅地将炮弹滑入炮管。嘭！第一发尚未落地，第二发炮弹已再次入膛。"
 OMS_Warprep.6.a:0 "爽！！！"
 OMS_Warprep.7.t:0 "切尔诺伯格行动"
 OMS_Warprep.7.desc:0 "整个上午，电台通讯里只有震耳欲聋的喧嚣。乌尔里希从清晨五点开始，接收到的全是千篇一律的无线电报告：桥梁被炸毁，输电线遭切断，通讯电杆拦腰折断——维系这片土地运转的一切都正被有条不紊地肢解粉碎。他只能粗暴地将这些事发地点标注在地图上，但时至正午，耳机里持续不断的尖叫声几乎耗尽了用来标记的图钉。这让他仿佛置身于世界末日的实时直播。\n\n“乌尔里希！汇报！”乌尔里希立刻立正站好，施托伊本少校正站在他对面的桌子后。\n\n“长官！情况危急。我们的基础设施正在遭受持续不断的恐怖袭击，我认为是东方那群野蛮人策划的。”少校从乌尔里希脸上看出了疲惫，默默点头示意他继续工作。“长官，恕我冒昧，”乌尔里希回到岗位时仍望着施托伊本少校，后者在这种局势下依然保持着镇定，“如果我们与其他驻军失去全部联系，该怎么办？”少校注意到乌尔里希眼中闪过的恐惧。\n\n“如果你真落到那种境地……”施托伊本走向乌尔里希，从大衣口袋掏出某样东西，“就拿上这把手枪，这才是关键。”他突然抓住乌尔里希的手，将枪柄塞进对方掌心。“握紧这把枪，瞄准你面前的混蛋，扣动扳机的力度要像这辈子最后一次开枪那样。当然——”他翻转枪身，“你也可以用它给自己最后一枪。选择权在你手里，小子。”\n\n乌尔里希咬着嘴唇，陷入无声的惊恐。他不过是义务服役，此刻只恨不得立刻奔回西方母亲的怀抱。他向少校点头致意，目送对方离开房间。他把手枪摆到面前，如同一尊雕塑般静坐着，连耳机里的求救声都充耳不闻。"
 OMS_Warprep.7.a:0 "神啊，救救我们！"
 OMS_Warprep.8.t:0 "一封意向书"
 OMS_Warprep.8.desc:0 "[Change Later]\"To the damnable government of the Greater Germanic Reich,\n\nIf you wish to avoid the destruction upon your nation which will surely be wrought by failure to comply, you will adhere to the demands which have been listed in this letter. Any response other than complete assent to our requests will be cause for immediate and total war against your abhorrent nation.\n\nFirstly, the Black League demands the prompt return of all German Reichskommisariats in Eastern Europe which house Russian or otherwise Slavic populations to the control of the Reclamation Government to be reincorporated as territory of its administration. Any German colonizers present in these lands are expected to return to Germany within thirty six hours or face immediate execution for the raping of the lands which they occupy.\n\nSecondly, the German Reich is to immediately and without protest present the officials currently holding any and all higher offices of its state, including that of the Fuhrer, to the Black League for immediate military tribunal for their crimes. In addition, the German people must unilaterally be found as guilty of genocide and destruction of the Slavic and Russian peoples and be sentenced to pay collective reparations of at least one hundred billion Reichsmarks. Payment in full to the Russian National Reclamation Government is expected no less than ten years from today.\n\nFurthermore, the organs of state of the German Reich are to be placed under direct control of the Russian Government for inspection of their heinous and undeniable crimes against the world and sacred Russia. Black League officials are to oversee the trial of these state organizations and their administrators.\n\nThe National Socialist German Workers Party is to be immediately disbanded and any who hold membership are to be banned from holding public office. A complete list of these rats responsible for destroying the Russian nation is to be sent to the Black League for inspection and to do with as it sees fit.\n\nFinally, the German government is to formally and unconditionally surrender to the Black League. The full punishment of its people is to be determined by the Russian Government at a later date.\n\nWe await your response.\"[Change Later]"
 OMS_Warprep.8.a:0 "[Change Later]\"They can't be serious, can they?\"[Change Later]."
 OMS_Warprep.9.t:0 "我方提议被驳回"
 OMS_Warprep.9.desc:0 "直呈总司令电报\n\n广播带回了简短的回应，寥寥数语间，充斥着令人作呕的恶毒讯息。我们从西方的妖孽身上，只看到了其坠入地狱火海的意愿。\n\n“贵方要求将‘应属俄国的领土’归还给所谓的‘民族复国政府’的请求，已正式驳回。”\n\n这则该死的信息，不过是冰山一角，我们将彻底证明其虚妄。假以时日，我们将让他们知晓，以捍卫祖国之名行使神圣的天罚，究竟意味着什么。亵渎的罪行必将终结。"
 OMS_Warprep.9.a:0 "当风暴平息，阴云散尽，正义亦将不复存在。"
 OMS_Warprep.10.t:0 "日夜不息"
 OMS_Warprep.10.desc:0 "曾经，米哈伊尔的村庄堪称“宁静祥和”，甚至有些宜人。在早已逝去的旧日时光里，如今村中记得那段岁月的人已寥寥无几。他们的忧愁寡淡而微末。诚然，他们是布哈林联盟的子民，但除了税负与苏维埃早期集体化的阵痛外，他们与中央政府的交集少得令人庆幸。他们自给自足，在米哈伊尔认识的每个人看来，生活就局限在这片小小的天地之间。\n\n而后，随着巴巴罗萨灾祸席卷他的家乡，和平沦为了泡影。全俄罗斯的每一座城镇、每一个村庄、每一个人，对于军阀混战时期昔日生活如何被摧毁，都有着截然不同的惨痛记忆，但对米哈伊尔而言，唯有灾难接踵而至。他们的田地被法西斯分子撒上了盐碱，粮仓被康米分子洗劫一空。在寒冬风暴中挣扎的岁月，浸染着他们土地的刺鼻血腥，都将那份炽燃于内心的仇恨磨砺得愈发尖锐。生命即战争，生存即胜利。\n\n如今，他们为了更宏大的事业而战。日复一日，村民们乘着新建的交通设施被运往工厂，劳作至深夜。当地建立起一支驻军以保卫该区域——那些士兵仿佛永不停歇地在行军。配给制严苛无比，刺骨的严寒与黑暗啃噬着他们疲惫的骨骸。但失败的苦果，其分量却更为沉重。亚佐夫提出了至高的要求——全然奉献自我。作为回报，他许诺了最彻底的复仇。敌人曾让他们躲藏在楼板之下、祈祷匪徒不再将又一栋房屋付之一炬的每一刻，他都将从敌人身上割下一磅肉来偿还。"
 OMS_Warprep.10.a:0 "于是，沉睡的城镇在军靴与钢铁的交响中苏醒。"
 OMS_Warprep.11.t:0 "迫近子夜"
 OMS_Warprep.11.desc:0 "叶夫根尼身着白桦迷彩服，百无聊赖地摆弄着与无线电台相连的耳机。他无可奈何地叹了口气，随后转向其指挥官的通讯台，那人的话音压过了静电的沙沙声。\n\n“俄罗斯民族复国政府武装力量的光荣将士们，作为新战略的一部分，我们正将无数部队调往我们最西端的边境。今日将发布进一步声明。光荣属于黑色联盟。”\n\n‘听起来没什么大不了的，对吧？’叶夫根尼心想。这肯定只是与某个远方部队进行的简单演习罢了。大审判的余波一时半会儿还波及不到他，他已经遵循着同样严格的作息有段时日了，现在又怎么会发生什么大事呢？叶夫根尼强压下心中的疑虑，但一个令人绝望的认知即将降临。\n\n一切真的要发生了。所有线索都串联了起来：过去几天里武器运输请求的激增，愈发频繁的演习，以及那些诡异的调动——足以击碎他最后的一丝侥幸。他无力阻止这场无可避免的冲突，他只能任凭上级，当然还有总司令亚佐夫本人的意愿摆布。这已是末日般的规模，他所知的一切或许都将就此终结。这个念头反复在他脑海中萦绕，几乎将他压垮，他竭力想从这境况中恢复过来。叶夫根尼被迫如此，皆因这大审判所包含的种种琐碎敌意——黑色联盟早已将其化为武器的狂热民族主义的根基。别无他法，他注定要踏上历史的钢丝，盘旋坠入一场最终失控的浩劫。"
 OMS_Warprep.11.a:0 "历史的齿轮正吱嘎作响，濒临停转。"
 OMS_Warprep.12.t:0 "万事俱备"
 OMS_Warprep.12.desc:0 "门砰然关上，充作德米特里·亚佐夫寝的地堡重归寂静。亚佐夫与他的幕僚们刚刚结束了又一场会议，主要议题聚焦于黑色联盟部队当前的战备状态以及民众士气的报告。数十份充斥着令人头晕目眩的数据的文件摊在他面前的桌上，亚佐夫逐一仔细审阅。会议结束的那一刻，他外在的形象判若两人，从世人眼中那个冷酷无情、铁石心肠的汉子，变成了一个颤抖着摘下军帽，猛灌了几口伏特加的男人。\n\n多少心血已经倾注。多少生产设施拔地而起，异议分子被无情镇压，军事单位历经训练与整编，诸如此类不胜枚举，以至于亚佐夫早已开始期盼那一天的到来。那一天，他将下达那道命令，一切得以开始。那一天，当大审判得以发动之时，祖国的救赎终将实现。但在其幕僚的建议下，他推迟了那道命令，只为让俄罗斯能够为大审判真正做好万全的准备。\n\n而今，在如此漫长的等待之后，那一天已近在咫尺。终于，他想。终于，这一切都将值得。自他的导师将引领联盟命运的重任托付于他之日起，每一个以鲜血换来的进展时刻，都将值得。当俄罗斯的旗帜在日耳曼尼亚上空飘扬，当雅利安人被俄罗斯的武装彻底消灭的那一天到来…终于，对他的人民犯下的罄竹难书的罪行，将得到最后的清算。\n\n亚佐夫叹了口气，从座位上站起身，伸手去拿他的军帽，他再次想起，在所有这些思绪化为现实之前，手头仍有几件未竟之事需要处理。他走出房间，朝广播站走去，准备在迎接命运之前，向他的人民发表最后一次慷慨激昂的演说。"
 OMS_Warprep.12.a:0 "子夜渐近。"
 OMS_Warprep.13.t:0 "36号铁道"
 OMS_Warprep.13.desc:0 "斯图加特的温暖晨光丝毫未能缓解鲍里斯内心的焦灼。他坐在熙攘地铁站台的一张空长椅上，假装阅读报纸又翻过一页。尽管他对德国鬼子的动物语言仅有粗浅了解，此刻目光却始终黏着手表指针——17:25。当微风吹过后颈时，他控制不住地发出一声颤抖的叹息，将风衣往裹着炸药的身躯又拢了拢。距离他在地球上的最后时刻，只剩不到五分钟。\n\n渗透进第三帝国的半年里，被迫与法西斯贱民交谈周旋令鲍里斯作呕，但他誓死效忠祖国。若俄罗斯母亲要他跳，他会问该跳多高。所以当命令他跨越边境深入世界至恶的漆黑心脏时，他分毫不差地执行了。得知潜伏小组将在切尔诺伯格行动中扮演的角色后，他义无反顾扛起了重任。\n\n虽然捏着报纸的双手开始发抖，想到自己的牺牲将为大审判奠定基石，鲍里斯内心异常平静。当年德国轰炸机夺走双亲时他痛哭失声，如今想到自己将死于敌国腹地反觉荒诞。看见列车驶入月台的刹那，他唇边溢出一声枯笑。手表指向17:29——时辰已到。\n\n鲍里斯搁下报纸起身。周围穿梭着按部就班的男女老少，这些制造他们种族苦难的刽子手后裔正享受着无辜假象。他眼中毫无怜悯。缓缓解开风衣时，布满老茧的手已握住猩红色的起爆器。\n\n当列车刹停的瞬间，鲍里斯甩开风衣。伴随衣料落地的轻盈声响，粘贴在他躯体上的数十块C4炸药赫然显现。车门开启的机械声中，周围人群的惊恐尖叫被他最后两句俄语盖过。在扣动拇指的刹那，这个背负六年亡国之痛的男人终于卸下了所有重担。"
 OMS_Warprep.13.a:0 "为了祖国！（俄语）"
 OMS_Warprep.14.t:0 "焦土焚痕"
 OMS_Warprep.14.desc:0 "“27号小队呼叫奥廖尔，27号小队呼叫奥廖尔，收到请回答。”伊凡娜对着无线电的送话器说道，这部电台此刻正摆在17号地点，一座罗斯托夫谷物种植园前任监工的办公桌上。这里是乌克兰境内无数个她的同胞们被迫辛勤劳作、耕耘田地的地方之一，然而他们劳动的果实，最终却只会被装上卡车，运去填饱那些贪婪的德国主子们的肚皮。像伊凡娜这样的人，对德国人和那些与他们狼狈为奸的走狗们没有半分好感。因此，他们很自然地欢迎了来自黑色联盟的特工。他们也曾耳闻过一些关于黑色联盟残暴手段和严苛政策的古怪传闻，但这想必是德国人的宣传伎俩，因为再没有什么比他们现在所受的压迫更为残酷了。\n\n在黑色联盟特工提供的武器和情报的帮助下，伊凡娜和她的工友们解放了种植园，清除了所有德国人的抵抗力量。最后的残余分子将自己封锁在了监工的办公室里。在夺取农场之后，他们的下一个任务便是与黑色联盟的联络人取得联系。\n\n“27号小队呼叫奥廖尔，你们能收到吗？”伊凡娜对着无线电送话器说道，静默的沙沙声让她开始感到不安。她看了看潦草地写在一张小纸条上的无线电频率，确认自己是否拨对了号码，这时，一个讲俄语的声音响了起来。\n\n“27号小队，这里是奥廖尔。我们收到。你们的目标情况如何？”\n\n听到这个声音，伊凡娜松了一口气。她按下送话器的按钮回应道。\n\n“我们已经占领了谷物仓库，我们有一些伤亡，还有一些人受了伤，但是——”她被无线电另一头的声音打断了。“来自高层的新命令，在敌人增援部队抵达之前，烧毁所有你们能找到的资产。”\n\n“再说一遍，奥廖尔？你们要我们把一切都烧掉？”她问道，难以掩饰语气中的难以置信。\n\n“没错。”伊凡娜只得到了这两个字的答复。\n\n"
 OMS_Warprep.14.a:0 "将你们找到的所有牲畜都扔进河里。"
 OMS_Warprep.15.t:0 "背后捅刀"
 OMS_Warprep.15.desc:0 "“肃静，诸位！”海因里希几乎是用脚踹开了门，愤怒与挫败感让他整日的行程彻底脱轨——这全因昨日堆满在海因里希办公桌上的紧急报告。作为高加索专员辖区盖世太保首脑，他的身上肩负着镇压任何胆敢反对雅利安种族在这片广袤山岳实施元首的宏伟蓝图的平民之责。然而此刻，显然有一个更严重的事态正在发酵。\n\n“全体汇报！”他听完几份关于工业破坏活动的报告后，才再次开口。“先生们，我们正被犹太-布尔什维克分子的破坏行动彻底淹没。这显然是一场协同作战——”他重拳砸向被各色圈圈划划挤满的地图，“我们必须在危机失控前、在战火烧到大日耳曼国的心脏前，干掉他们！”\n\n“遵命，长官！”众指挥官齐声应答。\n\n“我们将夺回街道控制权！所有破坏分子都将被公开处刑！”他眼中闪过寒光，“每牺牲一名雅利安同胞，就枪决十名土著。今日之内必须要让第比利斯消停下来！”\n\n“遵命，长官！”\n\n“明天的此时此时，我要在街上看到那帮破坏分子被吊死在路灯杆上！”\n\n“遵命，长官！”\n\n“解散吧。”\n\n当会议室重归寂静，海因里希独自伫立在窗前。第比利斯街巷的冲天火光将警报声染成血红，他凝视着这片炼狱图景，方才慷慨激昂的演说词在心底裂开细缝——如此杀鸡儆猴，真的能镇住这片燃烧的土地吗？\n\n"
 OMS_Warprep.15.a:0 "只要反复多说几遍一句话，它就成真了，不是吗？"
 OMS_Warprep.16.t:0 "阴招"
 OMS_Warprep.16.desc:0 "警车电台突然发出刺啦声时，康拉德正沿着城市繁忙的滨水区巡逻。\n\n“菲斯特警官，圣米迦勒教堂发生异常情况。旅客报告在穹顶梁架传出了滴答滴答的异响声。完毕。”\n\n康拉德抓起对讲机：\n\n“收到。带我去教堂。”\n\n方向盘急转，警车驶离滨水区奔向又一桩例行公事。他在空荡的路缘停驻，人群正迟疑地聚集在教堂外围。他温和地驱散众人后，推门而入，右手悬在配枪上方。进入南侧门廊，迎接他的唯有巴洛克风格讲道坛与祭坛的华美景象，层层空荡长椅浸没在死寂中——这座平日人潮不绝的教堂，即便是在闲暇时分也会有虔诚的信徒溜进长椅匆忙地完成祷告或找神父解惑，但此刻却空无一人。康拉德迅速扫视底层，目光所及尽是虚无。答案或许正地下室藏着。\n\n警官快步踏下石阶，低矮的拱顶迫使他弯下腰。昏暗的油灯是他唯一的光源，成堆的木箱挤占着地下室，箱体与承重柱构成的迷阵使康拉德在微光中寸步难行。\n\n就在这时，他听到了。滴答声。声响微弱得必须全神贯注才能捕捉。他循声探去，谨慎地跨过障碍。\n\n哐当。一声清脆的撞击声响起。康拉德低头查看踢中了什么，他发现踢中之物覆着织物。掀开布料的瞬间，辐射警告的标志赫然显现；再揭开第二层遮布，圆柱体形状的物体已一丝不挂地敞露在昏光下。\n\n时间骤然凝固。康拉德勉强站稳，而他的眼前赫然是一个本不应出现于此的东西。\n\n“天哪” 他的喉间滚出颤音。\n\n"
 OMS_Warprep.16.a:0 "可惜的是它并没有爆炸"
 OMS_unification_war.1.t:0 "华而不实的小玩意儿"
 OMS_unification_war.1.desc:0 "纳粹的污秽符号散落在路边，正如同它们所代表的意义般令人作呕。勋章、旗帜与各式的杂碎被弃置道旁，黑色联盟已将这些如蟑螂般令人恶心的纳粹崇拜者碾得粉碎——无论他们如何标榜自己的与众不同，但凡敢有人自称为雅利安杂种，都会在被军靴碾爆头颅后脑浆飞溅染红雪地。伊万冷笑着踢了踢那些小玩意儿，将步枪甩上肩头。\"快来瞧瞧，伙计们！\"他朝战友们喊道。\n\n别针本应别在衣领，那些维京人持剑斩杀怪物的涂鸦散落雪中。这些渣滓竟真相信如此鬼话。\"看这张，\"伊万拈起画纸抖给身旁的士兵，\"你说这帮猪猡的主子临死前是不是还在做着手持雅利安圣剑劈开我们的脑袋，送我们下地狱的白日美梦呢？\"\n\n\"你管他们想什么呢，他们现在已经死透了。\"一名士兵将冰雪踢向那堆秽物，\"全烧了吧，免得扔在这荼毒众生。\"讽刺的哄笑声顿时炸开，有人甚至直接笑得跪倒在泥路上直捶地面。\n\n\"你啊——\"伊万拍着士兵后背笑喘着，\"你太关注这些疯狗放的狗屁了！\"他抹掉笑出的眼泪集结队伍，朝着下一个村落行进。\n\n村口的火光刺破了暮色。待他们逼近之后，这才看清广场中央正竖着粗劣的木雕维京像，这显然是农村人的手艺。柴垛环抱着雕像熊熊燃烧，而火焰周围——村民们并不安详地躺在融血的雪地里，喉间的裂开的血痕各自插着匕首。一片欢乐的气氛霎时变得死寂，唯有屋顶在这顿美餐上方盘旋的乌鸦在嘶哑的啼鸣，点缀着这般宁静。"
 OMS_unification_war.1.a:0 "纵是狂徒呓语，亦在亡魂耳中生根发芽。"
 OMS_unification_war.2.t:0 "原型"
 OMS_unification_war.2.desc:0 "铁链铿锵，烈火熊熊。饥饿、干渴、哀伤、死亡。这便是德米特里·亚佐夫巡视着那些在所谓的“雅利安”兄弟会覆灭之后设立的营地时，亲眼目睹的景象。刚踏出车门，亚佐夫便与一名年轻人四目相对。那年轻人骨瘦如柴，奄奄一息，眼神中却带着一丝若有若无的厌恶与仇恨，虚弱地望着他。他盯了那年轻人片刻，随后便走进了那用铁丝网围起、关押着这些堕落灵魂的逼仄囚笼。凝望着这些饥肠辘辘、肮脏不堪、精神崩溃的囚犯，亚佐夫心中五味杂陈，既有鄙夷，亦有悔恨。这群畜生，曾奴役无辜的俄罗斯人民，曾肆意屠戮，曾坚信此举能为他们带来救赎，如今却落得这般下场，双膝跪地，无声地乞求着任何形式的怜悯。然而，这些念头只在亚佐夫脑海中一闪而过，因为他很快便要与管理这处营地的行政小组会面。\n\n“长官，相信您一路平安吧？”一名年轻些的行政官员开口说道，语气中带着一丝怯意。\n\n“我能否相信，这些俄罗斯人民的叛徒，都得到了‘妥善’的照料？”亚佐夫厉声问道。\n\n“这帮渣滓？他们每多干一个小时的活，都是在为那些再也见不到父亲的俄罗斯孩童赎罪！”一名资历较深的行政人员答道，“长官，他们最终都会用鲜血来救赎自己。只是时间问题。”\n\n亚佐夫环顾四周，目光复又回到方才说话那人身上。“很好。这群畜生，妄图清洗所有不效忠于他们那万字符号的人。但这些人并非症结所在，诸位。他们不过是某个更庞大之物的附带产物。很快，很快，所有那些对俄罗斯祖国心怀歹意之人，都将发现自己要向祖国母亲偿还一笔巨额的血债！”"
 OMS_unification_war.2.a:0 "等待他们的将是无间地狱。"
 OMS_unification_war.3.t:0 "遗嘱"
 OMS_unification_war.3.desc:0 "灯光持续闪烁，每一次都比上一次更加黯淡，整个房间随之剧烈地摇晃着。尽管层层叠叠的混凝土与钢铁将此地与外界隔绝，地表之上发生的恐怖却永远无法被真正掩盖。格奥尔基·朱可夫，这位日渐萎缩的苏维埃联盟的元帅，紧紧抓住他那老旧的麦克风，既是为了稳住它锈迹斑斑的支架，也是为了稳住自己颤巍巍的身体。\n\n他抬起头。曾经站满了秘书、幕僚、同志的地方，如今只剩下死寂。看来，在这最黑暗的时刻，只有他一人来守护工人的火种了。他低下头。那份仓促准备的演讲稿，与其说是伟大政治家的雄辩，不如说更像一只垂死蜘蛛的蹒跚呓语，但也只能将就了。当房间终于归于平静，元帅开始了他最后，却或许是他此生最重要的一次演说…\n\n“士兵们，公民们，朋友们，敌人们，主人们，农奴们，我带着我和我的国家共同的希望与恐惧来到你们面前。尽管我们曾攀上高峰，尽管我们曾消灭强敌，尽管我们的人民依然坚韧不拔，但我们的旗帜终究不会永远飘扬。黑色联盟的黑暗势力已经压倒了我们新生的联盟，再一次扼杀了我们国家青春的蓓蕾。这将是我的最后一次讲话。\n\n但是，全世界的人民啊！不要绝望！我们的事业或许已经终结，但你们仍有希望。那阴险的亚佐夫妄图打开他自己版本的潘多拉魔盒。化学武器，生物武器，核武器，他们将毁灭一切他们认定的敌人，无论其信仰或品格。他们也会将整个世界一同拖入毁灭的深渊。\n\n如果任由他们肆无忌惮地征服和盘剥，‘人类’这个概念本身就将不复存在。我恳求所有正在聆听的人们，放下你们那些琐碎的分歧，团结起来，对抗这股恐怖的洪流。我恳求每一个人，不能再有任何沮丧或拖延，我恳求——”\n\n“趴在地上！立刻！”\n\n随着曾经空荡的房间涌入蒙面士兵，格里戈里·朱可夫，黑色联盟最新的囚徒，颓然倒地。然而痛苦并未将他遗弃，因为尽管年迈，尽管有瑕疵，尽管曾失败，他今日终究完成了他立志要做的事情。\n\n他只希望，世界已经听到了他的声音。"
 OMS_unification_war.3.a:0 "又一个声音归于沉寂。"
 OMS_unification_war.4.t:0 "阿尔汉格尔斯克之围"
 OMS_unification_war.4.desc:0 "指挥地堡内的气氛压抑得令人窒息。红军所有高级将领围站在铺着阿尔汉格尔斯克城地图的大桌前。黑色小兵人在地图上呈半圆形从海岸线延伸至另一侧海岸，清晰表明这座城市已被合围。图哈切夫斯基死死盯着那些黑色兵人，眉头越锁越紧——他不得不承认局势已经恶化到何等程度。\n\n“大元帅同志，或许……是时候考虑撤离了……”一位年轻将领终于打破沉默。图哈切夫斯基扫了他一眼，未发一言。对方将这视为默许，继续陈述：“我们仍控制着海岸线。可以组织部队横渡白海撤往芬兰，再转道瑞典。”\n\n“芬兰人可巴不得抓几个赤色分子。”另一名将军插话，“穿越其领土时必须谨慎。在座有人懂芬兰语吗？”\n\n“没有。”图哈切夫斯基截断了撤退议题。他仍凝视着年轻将领的面庞——那人发色尚浓，脸上仅浮现岁月侵蚀的初浅纹路。这个所谓的军人竟以为年轻就该享有苟活的资格。他显然忘了……不，在场所有人都忘了军人的本分。他们是战士，绝不能弃守阵地。至少在他的指挥下绝不允许。\n\n“你们这些懦夫。”图哈切夫斯基平静的语调下暗涌着怒意，“居然提议像小屁孩般逃过冰原，任由俄罗斯人民在疯子统治下煎熬？你们还算共产党员吗？你们他妈的可是红军！我们要在每道巷陌、每个街角战斗，如果这座城市化为瓦砾，我们就在废墟上继续战斗。胜利终将属于我们。投降二字休要再提。若亚佐夫想夺取阿尔汉格尔斯克，就得踏过我们每个人的尸体！”"
 OMS_unification_war.4.a:0 "红色拿破仑发表了他最后的演讲。"
 OMS_unification_war.5.t:0 "第4568号备忘录"
 OMS_unification_war.5.desc:0 "[Change Later]\"From the desk of Glavkoverkh Dmitri Timofeyevich Yazov, leader of our nation and follower of our founder Dmitry Karbyshev:\n\nToday, I write with a sense of satisfaction. Our operation to bring the impotent and disunited opponents of our rightful mission was quick, clean, and showed neither hesitancy nor mercy. Every single man who has marched west in these recent months has done their job dutifully, and they have done it well. I congratulate every one of you.\n\nHowever, I believe that this recent victory may serve as a good point of reflection as to the righteousness of both our goals and the way in which we achieve them. Suppose that, every time us men of battle wished to conduct a maneuver, complete a task, instruct an individual, everyone, no matter their rank or their relevance, had to be consulted. Imagine, if you will, that every single decision made had to be checked, authorized, reauthorized, and passed through a myriad of near infinite bureaucracy. How then, would our operation have gone. Would it have been quick, clean, and merciless?\n\nEvery man who has so much as picked up a rifle thus knows the folly that is democracy. Every man who has so much as worked in a team knows that cohesion, competence, and decisiveness is reliant on resolute action, ascribed from men who have earned elevated rank, and followed without question by those beneath them. Every man today now knows why our Black League operates the way it does.\n\nBut do not grow feeble and meek. The treacherous Teutons know of this too, for they have abandoned the feebleness of democracy just as we have done the same. When we march west once more, they will not be as forgiving.\n\nWhether all of you rise to the challenge remains to be seen."
 OMS_unification_war.5.a:0 "署名，德米特里·亚佐夫。"
 OMS_unification_war.6.t:0 "简单算术"
 OMS_unification_war.6.desc:0 "姓名：伊戈尔·沙法列维奇\n\n职业：俄罗斯共和国总统。\n\n曾任职业：数学教授、作家、电台脱口秀主持人、政治异见者。\n\n状态：高价值目标HVT-1099-A，在瑟克特夫卡尔与维亚特卡被占领时和平投降。已签署有条件投降条款。目前在押，等待审判——\n\n“一个数学家？”亚佐夫揉烂了纸张，随手扔进了废纸篓。“荒谬绝伦。”\n\n他站起身，望向办公室旁那扇落满雪花的窗户。真是个笑话。俄罗斯人民居然选举了一个数学家，还任由他建立了一个自称为“共和国”的政权。“民主制”。毒蛇的体系。一个充斥着低效、虐待与欺瞒的体系。一个孱弱、堕落的体系。\n\n亚佐夫望向办公室外的训练场。在那里，新晋的军官们正在接受身心双重的磨砺——他们的下属早已通过了同样的训练并幸存下来。黑色联盟绝不允许无能之辈领导强者。不。联盟的同志们将以钢铁般的意志提携下属，而士兵们则以服从拥戴他们的领袖。\n\n民主制可不是这样。亚佐夫的人早已揭开了它的遮羞布。反犹主义、贿赂、腐败在沙法列维奇的领地里横行无忌。更常见的是，那些民意代表们干脆无视竞选时的承诺，一心沉溺于贪污腐败的甜头。在文明存亡的斗争时刻，这是不可接受的分裂。不，那些在沙法列维奇拙劣构想下受苦的俄罗斯人，并未获得自由。黑色联盟再一次以解放者的姿态进军。再一次，他们带来了自由。\n\n“自由，”亚佐夫低语道。“自由是…”他努力寻找着词语。不是来自一张纸，他知道，不是来自议会幼稚的奇想。不是来自立法那些文明的仪式。“自由即力量。力量即自由。”\n\n于是，他意识到，黑色联盟即是自由。"
 OMS_unification_war.6.a:0 "没有任何数学家能够算计出他们的覆亡。"
 OMS_unification_war.7.t:0 "大草原的死亡呼唤"
 OMS_unification_war.7.desc:0 "Glavkoverkh Yazov entered the vacant Passionarity congress hall. It reeked of gin and dried urine. A caustic taste tingled on the tip of his tongue. \"You found the hall in this manner, Private?\"\n\nPrivate Artemyev nodded. \"Sir, yes sir. We eliminated the Eurasian milita sent to defend the hall three clicks from the building.\" The Private smiled, excitement creeping into his voice. \"Ambushed them, sir. They weren't ready for us.\"\n\n\"You have nothing to be proud of, Private.\" Yazov ran a finger over a wooden banister. Dust. \"Look around you. Look at these cave paintings. Look at the standard our enemies held themselves to. This room speaks to me of ineptitude, and cultural insignificance.\"\n\nThe Private began to sweat. \"I apologize, sir.\"\n\n\"We do not permit ourselves self-aggrandizement, soldier.\" Yazov shook his head. \"Our enemies debased themselves, physically and ideologically. Their thoughts were born of an artificial rationale, not rooted in tradition or actual culture but instead a false preconception of history. Lev Gumilyev -\" a vein bulged on Yazov's forehead \" — sought to erase Russia's cultural reality, and reorganize our people into a mindless horde. The same horde, mind you, that raped and pillaged our nation centuries ago. They were nothing more than barbarians. And this was nothing more than pest control.\"\n\nPrivate Artemyev stood as still as stone. The wooden floor creaked beneath their feet.\n\nYazov raised his head to the rafters. \"I would not be proud of shooting rats, Private. I advise you to keep your attention on duty.\" He raised an eyebrow. \"Now, please light this garbage on fire.\"[Change Later]"
 OMS_unification_war.7.a:0 "焚心烈焰，终作救赎的尘埃。"
 OMS_unification_war.8.t:0 "疯癫的末路"
 OMS_unification_war.8.desc:0 "一枚火箭弹呼啸着划破长空，在塔博里茨基的宏伟宫殿上炸开一团火球。历经三日猛烈炮火的洗礼，精致的大理石与黄金镶嵌早已不复存在。黑色联盟的炮火从四面八方倾泻而下，枪林弹雨夹杂着加农炮震耳欲聋的轰鸣。守军蜷缩在战壕之中，他们的掩体在炮火中不断崩塌，只得徒劳地祈祷着上帝能够出手干预，拯救他们神圣的摄政王。\n\n联盟士兵觅得一处缺口，数支小队如潮水般涌入宫殿庭院。狂热的卫兵死守阵地，有的应声倒下，有的则多挨了几枪。事后，少数几名进攻者发誓，他们曾看见一个头发蓬乱、双眼血红的家伙，即便在肺部中弹之后，依然挣扎着站了起来。\n\n逐区攻占这座大院的苦战，耗去了余下的整个下午。每一条走廊，每一个房间，每一座大厅，都布满了陷阱；每一个角落，都暗藏着伏兵。当塔博里茨基的部下弹尽粮绝之际，他们便拔出刀刃，挥舞起沾满鲜血的拳头。\n\n日暮时分，联盟军已斩获五百八十六颗首级。少数被俘者拒不悔改，至死不渝。他们毫无悔意，在坚信自己正义的执念中死去。然而，在堆积如山的尸首之中，却不见塔博里茨基的踪影。联盟军官兵反复搜查，再三确认，并在审讯骨干的“协助”下，进行了第四次核实。结论依旧未变：摄政王塔博里茨基逃脱了。\n\n联盟高层闻讯，无不扼腕切齿，怒火中烧。命令层层下达，失职者受到严惩。但这一切，都无法压制士兵与平民发自内心的喜悦——当那面象征着神圣俄罗斯帝国耻辱的旗帜从旗杆上缓缓降下之时。塔博里茨基对俄罗斯的扭曲幻梦，在此地，于此刻，已然化为齑粉，永世不得翻身。"
 OMS_unification_war.8.a:0 "暴君必尝恶果。"
 OMS_unification_war.9.t:0 "第45862号备忘录"
 OMS_unification_war.9.desc:0 "发自总司令，我国领袖暨奠基人德米特里·卡尔贝舍夫之追随者，德米特里·季莫费耶维奇·亚佐夫案头：\n\n我向所有参与此次伟大行动，荡平独夫民贼伊万·谢罗夫的俄罗斯同胞们，致以祝贺。正如诸位所知，也正如那个精神错乱的原始人所竭力鼓吹的那样，秩序社会主义已经死了。\n\n他那套法西斯共产主义的理念，从根本上就是一个破碎不堪的体系。多年前，当黑色联盟从西西伯利亚苏维埃社会主义共和国的枷锁中挣脱出来时，卡尔贝舍夫与我，便立下誓言，永不屈从于共产主义和布哈林主义思想的麻醉。马克思、列宁以及所有其他社会主义革命者的理想，从未真正给人民带来福祉。他们将俄罗斯人民引入了歧途。\n\n列宁难道不是因德意志人的威胁，才从瑞士被一列火车送往旧沙俄帝国的吗？马克思和恩格斯难道不也是德意志人吗？显然，这两条毒蛇已然在俄罗斯全境肆虐横行，而秩序社会主义，便是共产主义与其日耳曼根源的最终结合。我个人，为我们能在这种思想在我们伟大的国家内部长期溃烂之前，便将其扼杀于萌芽，而感到欣慰。\n\n这个无可救药的男人，在其西俄罗斯的疆域内所完成的唯一可取之处，便是他的工业计划。他已将国家变成了一座工厂，尽管那是一座充斥着恐惧与仇恨的工厂。我们将开始利用这些设施，制造更精良的战争武器，以彻底驱散那片德意志的阴云。\n\n感谢诸位。"
 OMS_unification_war.9.a:0 "署名，德米特里·亚佐夫。"
 OMS_unification_war.10.t:0 "循环往复的失败"
 OMS_unification_war.10.desc:0 "亚佐夫看着桌上堆积如山的军事报告，大局已定。西俄罗斯的胜利已经唾手可得，黑色联盟那些坚韧不拔、赤胆忠心的士兵们已跨越乌拉尔山脉，迅速荡平了一切抵抗。他放下那沓文件，随后重重地瘫倒在椅中。\n\n苏维埃联盟已然灰飞烟灭；在第一次大审判中，它被日耳曼匪帮击得粉碎。布哈林那奸诈无能的嘴脸，将俄罗斯一步步拖入了混乱的深渊。亚佐夫回想起他在东线浴血奋战的峥嵘岁月，被迫撤退至AA线之后，因联盟的溃败而备受奇耻大辱。啊，年轻的苏维埃联盟曾是他的祖国，一个他本应誓死捍卫并为之热血沸腾的国家，但亲眼目睹了布哈林的累累败绩之后，这让他认清了联盟的种种弊病。在苏联崩溃的这一悲剧中，尚有些许东西可以汲取：那便是教训。倘若黑色联盟想要存续下去，就必须洞悉如何避免重蹈联盟的覆辙。\n\n但亚佐夫深知，所谓的经验教训往往靠不住，有些人冥顽不化，偏要重蹈历史的覆辙，而布哈林娜亦不例外。她简直是其父的拙劣模仿，将其父最不堪的一面展现得淋漓尽致。成天把“马克思主义辩证法”、“无产阶级”挂在嘴边，可除了这些半吊子知识分子的空谈，这又能给俄罗斯人民带来什么实际好处呢？苏联已经亡了，布哈林娜之死更是为这口棺材钉上了最后一颗钉子。"
 OMS_unification_war.10.a:0 "荼毒俄罗斯的九头蛇已被斩除。"
 OMS_unification_war.11.t:0 "第93号备忘录：论共产主义意识形态"
 OMS_unification_war.11.desc:0 "发自总司令，我国领袖暨奠基人德米特里·卡尔贝舍夫之追随者，德米特里·季莫费耶维奇·亚佐夫案头：\n\n落笔之际，我刚获悉米哈伊尔·苏斯洛夫领导下的叛逆共产主义政府已无条件投降。我愿借此机会，反思共产主义及其对我国之影响。\n\n我亦曾为共产党员。共产主义及其倡导者们，长久以来都为俄罗斯怀揣着值得钦佩的目标。它曾将我们从内战后的彻底毁灭中拯救出来，为我们的国家带来了一定程度的经济实力。我在布哈林统治下的俄罗斯长大，并于1941年加入了布哈林的红军，以对抗条顿匪帮的威胁。后来，我加入了革命阵线，在西俄战争中再次拿起武器。在此期间，我信仰共产主义，信仰它为俄罗斯描绘的真正强大与繁荣的愿景。\n\n然而，毋须我提醒诸位，我曾战斗过的两支红军最终都归于失败，皆因其政治领导层鸡毛蒜皮的内斗和软弱不堪的理想主义而土崩瓦解。列宁与布哈林的崇高理想，便是在此处分崩离析的。它们无法在我们俄罗斯民族深陷的重围之中存续。日耳曼的部落不可用平等去对抗，不可用辩证法去对抗，甚至不可用繁荣去对抗。不，条顿匪帮只能用钢铁来应对。唯有暴力，才是我们抵御条顿人施加于吾辈的万千武库的唯一屏障，而共产主义，实际上正是其武库的一环。我是否需要提醒你们，马克思——这个玷污俄罗斯民族的日耳曼式腐败思想的始作俑者，他来自何方吗？我需要提醒你们，列宁本人不就是在世界大战中被条顿人派来这里，以图颠覆我们的吗？\n\n共产主义并非俄罗斯民族之盾，恰恰相反，它是条顿人直指我们心脏的又一把利剑。"
 OMS_unification_war.11.a:0 "署名，德米特里·亚佐夫。"
 OMS_unification_war.12.t:0 "调查报告 BP-DPL-WQ8"
 OMS_unification_war.12.desc:0 "编号：BP-DPL-WQ8\n\n整理者：BLP-NV-3\n\n分类：2A+\n\n事由：人民委员会科技部遗产抢救\n\n背景：随着苏维埃联邦投降，科学干部112685受命收集、审查并甄别人民委员会科技部研发的可用技术及\"蓝天\"科研项目。审讯干部356707奉命对幸存的联邦人员实施审讯以达成该目标。\n\n调查结果：人民委员会科技部档案中95%技术被112685划为0类（不建议深入探究）。另有3%被归为1类（潜在民用价值），2%被划为2类（潜在军事应用）。相关人员指出联邦科研活动受政治驱动并作为个人升迁的手段，而非基于实际应用场景。此外，2类技术存在后勤隐患，多数需大规模工业投资方能实现量产。\n\n1项成果被列为3类（可直接军用）。“陆龟”项目为远程超音速轰炸机项目。现有数据与蓝图显示其速度、生存性及空中火力较当前黑色联盟空军装备具有显著优势（详见附录A-74-SSI）。\n\n1项成果被列为4类（重大直接军事价值）。“切伦科夫”项目为中型坦克重构方案，包含多项设计优势：复杂地形机动性提升、装填时间缩短、装甲板经优化可降低乘员辐射暴露影响。建议12个月内完成测试型号生产并开展实战演练。"
 OMS_unification_war.12.a:0 "[Change Later]\"Recommendations accepted.\"[Change Later]"
 OMS_unification_war.13.t:0 "[Change Later]\"MEMORANDUM 884: Monarchist Collaborationism\"[Change Later]"
 OMS_unification_war.13.desc:0 "[Change Later]\"Comrade soldiers! We celebrate together as we rip the collaborationist parasite from our lands. The Sovereignty of Western Russia is no more. Our victory is evidence of our superiority and our righteousness. Indeed, it is the only evidence a soldier needs.\n\nIt has not escaped the soldiers who conquered the Tsar's palace that he lived in splendor while his people scraped in poverty. Monarchism is, by its nature, corrupt. By empowering men of weak bodies and corrupt minds for their bloodline, it ensures only that the nation is led by bandits, the vainglorious, and the self-obsessed. Comrade soldiers, there is only one bloodline which matters: the bloodline of Russia!\n\nMonarchism is a yearning for the past. It denies, even despises the present, searching ever backwards for the image of power and respect. But we know that respect comes to those who earn it, and power comes not from symbols but from action.\n\nOur Russia is a land of merit. Where the strong shall lead, and become stronger for it. Where strength of body, strength of mind, and strength of will define your duties, and your rewards. Our Russia is led by men of humble beginnings. The League is made up of diligent men of firm character, not those empowered by an accident of birth. Our Russia is a land of the present, neither indulging in fancies of the future nor denying the sorrows of the past. Our eyes are fixed on the here and now, upon duty, and upon the actions we must take to leave the precipice of annihilation.\n\nWe who have conquered the present have overturned those who obsess over the past. There is only today. There is only duty.\"[Change Later]"
 OMS_unification_war.13.a:0 "[Change Later]\"And only in death does duty end.\"[Change Later]"
 OMS_unification_war.14.t:0 "叛徒的末路"
 OMS_unification_war.14.desc:0 "他必须成功。布尼亚琴科已经没有其他选择了。黑色联盟一次又一次地击败了他。他们把他的部队赶出了乌拉尔山脉。他们把他们逼退到卡马河，然后继续把他们逼退，直到他的士兵背后只剩下德国人的专员辖区。每一次交锋，黑色联盟都展现出更强的韧性和更狡猾的计谋。他们就像一把钢刀，干脆利落地切开了他的部队。但他绝不会退缩或投降。不会向他们投降。不会向任何人投降。他要从这泥潭中拯救俄罗斯。\n\n“弟兄们，”布尼亚琴科一边踱步，一边对着面前几十名士兵——他军队最后的残余——开口说道。“这座山丘的另一边，就是黑色联盟的主力。跟我们打了这么久，他们已经累了。他们不得不跋涉几百英里，才穿过我们的土地。而且，他们屠戮了沿途所见的一切。他们摧毁了你们的村庄，你们的城市，还有你们的家人。你们的妻儿，甚至可能就死在山那边那些怪物的手里。他们为这些人掉过一滴眼泪吗？他们对屠戮的无数生命，有过一丝一毫的怜悯吗？没有。”\n\n“让他们尝尝应得的下场吧！他们想肃清俄罗斯的污秽？我同意。他们想净化俄罗斯，让它能再次作为强权屹立不倒？我再同意不过了。在我们解放俄罗斯、清除腐朽的共同使命中，我说，就从这些山那边的黑衣杂种开始！”\n\n他举起步枪，回应他的是士兵们的欢呼，无论老少，他们眼中都闪烁着受到鼓舞的光芒，仰望着他。也许他们还能做到。也许他们能从失败的边缘夺回胜利。谁知道呢？亚佐夫本人可能就站在军队的最前面，这次冲锋或许能杀到他跟前，结果了他，让那条黑蛇群龙无首，从内部自行瓦解。无数种可能性在布尼亚琴科的脑海中闪过，他转过身，向山头发起了冲锋。山的另一边，是数以百计等待着他们的黑色联盟士兵。就在他们足够多的人冲过山脊的那一刻，对方开火了，子弹像雨点般倾泻在布尼亚琴科和他部下的身体里。"
 OMS_unification_war.14.a:0 "叛徒不配得到怜悯。"
 OMS_unification_war.15.t:0 "谈判桌上"
 OMS_unification_war.15.desc:0 "他们至少有二十人。身着黑色制服，头戴大檐帽，每一件都用同样墨色的布料打着补丁，修修补补。每个人的武装都超出了俄罗斯解放军士兵的常规配置——机枪、手枪、五花八门的弹药、匕首和警棍，沉甸甸地挂在不堪重负的腰间和弯曲的脊背上。每当有人靠近，济科夫都会不由自主地颤抖。他宁愿身处任何地方，也不愿坐在这张布满灰尘的宴会桌旁；但要么在这里，要么上绞刑架。\n\n地板嘎吱作响，萨哈罗夫斯基将军——黑色联盟在这次谈判中的代表——坐了下来。他瘦骨嶙峋的手搭在了济科夫的后颈上。“那么，总统先生，”那名军官咧嘴一笑，“我们言归正传吧。你的军队伤亡惨重，忠良的俄罗斯人正四散奔逃。黑色联盟非常乐意在高尔基和沃洛格达剿灭你们俄罗斯解放军的残部。”将军的手收紧了。“但我相信，冷静的头脑能够占上风。我相信，如果你同意被我们完全吞并，并命令你的残余部队放下武器，黑色联盟或许会考虑将你的死刑减为无期徒刑。”\n\n济科夫的心沉了下去。“诸位，诸位，”他绝望地环顾四周，试图寻找一个盟友。黑色联盟的士兵们神情冷漠，即便在他苦苦哀求时，眼中也未曾闪过一丝怒火。“我们都是文明人！没必要让我这么一个经验丰富的宣传家烂在牢里。我们肯定能想出办法的。”\n\n萨哈罗夫斯基咂了咂嘴。“伊万诺娃下士，你能模仿总统的签名吗？”\n\n一名士兵点了点头。“是的，长官。只要有足够的时间。”\n\n将军笑了。“好吧，看来我们根本不需要你了，亚历山德罗维奇总统先生。很高兴认识你。”\n\n济科夫还没来得及回应，两个拥有铁钳般力气的人就抓住了他的肩膀，将他从桌边拖开。他想尖叫，想做最后的徒劳恳求，想乞求饶命。最终，从他嘴里发出的，只有一声充满恐惧的哀嚎。"
 OMS_unification_war.15.a:0 "兹命令所有俄罗斯解放军士兵立即投降。签名，总统梅列季·亚历山德罗维奇·济科夫。"
 OMS_unification_war.16.t:0 "骗局的终末"
 OMS_unification_war.16.desc:0 "伏特加的瓶底从未像此刻这般美丽动人。或许只是因为奥克坦已经醉眼朦胧，握着酒瓶的手不住地晃悠，眼前的一切都成了模糊不清的影子。不过，最后这点酒，他还是得喝完。可不能浪费了。于是他将酒瓶倒置在杯口，倒出最后一滴酒液，然后随手将瓶子扔到一边，任其在办公室的硬木地板上摔得粉碎。他端起酒杯，向后一靠，将杯中之物一饮而尽，接着把酒杯也摔了出去，与酒瓶的残骸为伍，化作满地碎片。\n\n他本可以像国王一样生活。他曾像操纵木偶一样摆布那些德国佬，而他们也如他所愿地应声歌唱。有他们的帮助，整个俄罗斯本可以成为他的领地，他本可以从任何他想掠夺的人手中，夺走任何他他妈想要的东西。但是不。亚佐夫和他那帮激进分子偏要杀过乌拉尔山，击溃他的军队。连几座该死的山都守不住，这样的军队还有什么他妈的用？\n\n奥克坦回头望向书桌，目光锁定在桌上的一把德制鲁格手枪。他伸手拿起枪，懒洋洋地在指间把玩。也许他可以带着能拿走的东西逃之夭夭，去加勒比或者南美某个热带地方，过上富裕的生活。但他能听到外面的枪声越来越近。他跑不掉了，再也跑不掉了；亚佐夫的人离得太近了。他连十英里都跑不出去。不，他无计可施了。\n\n他将枪管抵在下巴底下，感受着金属的冰凉在皮肤上蔓延。他对那些所谓来世的说法不抱任何幻想；一旦扣下扳机，黑暗将成为奥克坦永恒的伴侣。他积攒的所有钱财都将化为乌有，全都会被用来填补亚佐夫的战争机器。统领西俄罗斯的荣耀将被扫进历史的垃圾堆。奥克坦只会是一个注脚，仅此而已。是的，摆在他面前的只剩下黑暗。他任由手指扣紧扳机，用自己的脑袋给墙壁添上了一抹色彩。"
 OMS_unification_war.16.a:0 "德国人的傀儡倒了。"
 OMS_unification_war.17.t:0 "大厦将倾"
 OMS_unification_war.17.desc:0 "城市在燃烧。空气中弥漫着灰烬、浓烟和火星，一个破灭梦想的残片，像萤火虫一样随风飘荡。列兵科斯洛夫用左臂捂着脸，希望能挡住刺痛双眼的烟雾。他失败了。这个年仅十六岁的年轻人，踉踉跄跄地踩过木头和碎石，冰冷的卡拉什尼科夫步枪枪管紧握在手中。\n\n远处传来尖叫声。入侵者像野兽一样咆哮着，嘶吼着他们的仇恨。他们已经超越了语言，回归了原始。在他们的吼叫声下，他能听到平民——女人——乞求怜悯的声音。她们的话语被枪声的锤击碾得粉碎。\n\n科斯洛夫感到一阵彻骨的寒意。这个年轻人汗流浃背，手脚并用地在白垩和倒塌的横梁间爬行，强迫自己向前。他必须逃脱。他必须远离这场噩梦，撤退，活下来改日再战——\n\n“救救我。”一个幽灵般的呻吟声乘着燃烧的风飘来。“求求你…救救我。”\n\n科斯洛夫擦去眼中的泪水和烟尘。他周围的一切都是难以分辨的废墟，同样模式的碎裂混凝土和倒塌的墙壁。不假思索地，话语从他口中溜出。“你…你在哪——”他清了清嗓子，将一口黑痰吐在尘土里。“你在哪里？”\n\n左边传来一阵摩擦声，科斯洛夫看见了他。那是一个人，或者说是一个人的残骸。那名士兵中年年纪，秃顶，留着卷曲的灰色胡须，制服胸前的口袋上缝着乌托邦沙龙民兵的臂章。而他的双腿，被一根倒塌的横梁压住了。一条胳膊无力地垂在男人身边。\n\n科斯洛夫甚至在那士兵开口前就知道他想要什么。怜悯。从那些在托木斯克废墟中狩猎的野兽手中获得片刻的喘息。但是黑色联盟很近，并且每秒钟都在逼近。他能感觉到他们的呼吸就在他的脖颈上…\n\n“对不起。”男孩转过身，身后是士兵绝望的哀嚎，他拔腿向城郊冲去。为了生存，也为了耻辱。"
 OMS_unification_war.17.a:0 "实用主义——懦弱的另一个代名词。"
 OMS_unification_war.18.t:0 "湮没无闻的抗争"
 OMS_unification_war.18.desc:0 "这栋楼里的敌对分子早已被肃清，地雷和陷阱也已悉数排除。不过帕维尔还在里面溜达，这里之前是个行政中心，兴许能找到些有意思的东西。管它是真正有用的情报，还是单纯满足好奇心的小道消息和琐事呢。他在窗台上掐灭了烟，随手弹进了傍晚清冷的空气里，然后转身回到自己身处的这条破败走廊。不过，远处的某个东西吸引了他的目光。\n\n间档案室，或许能在那里找到些值得他花时间的东西？他信步走了进去，房间里从地板到天花板都摆满了文件柜，有些柜子已经从墙上被扯了下来，里面的东西散落一地。房间中央一张又大又长的桌子上——那些案牍劳形的文书们大概就是在这里做他们那枯燥乏味的工作——放着一个用红色标记的文件，吸引了他的视线。“逮捕记录 1962-64”，那字样仿佛在高声呐喊。他捡起文件，翻了几页。\n\n名字，许许多多的名字。旁边还附有对他们罪行的简短描述以及判决。文件相当厚，这份记录里怕是得有上千个名字。更别提其他类似的记录了。在他漫不经心地扫视时，某个条目让他挑了挑眉。“瓦列里·米哈伊洛维奇·萨布林”，上面写着，“叛乱，反抗国家。兵变。煽动。判决：死刑，枪决”，内容直白得触目惊心。\n\n他干笑一声，手臂一扬，把文件扔进了房间另一头的废纸篓里，只听“咚”的一声闷响，正中目标。他走出门，划着一根火柴，又点上了一根烟，正好撞见另外两名在楼外台阶上闲逛的军官。\n\n“找到什么有意思的没？”其中一人漫不经心地问道，烟雾缭绕在他们周围。\n\n“算不上，”帕维尔靠在门框上回答。“大部分是逮捕和判决记录，这楼也他妈的烂透了。想把它修好重新运作，花的功夫怕是比它本身价值还大。”他接着说道，深深地吸了一口烟。\n\n“也许能从里面回收点材料，电线可能还好的。”他的同伴提议道。\n\n帕维尔歪了歪头，考虑了一下。“我会跟指挥部联系，把有用的东西都拆下来，剩下的就拆毁吧。”他断然说道。"
 OMS_unification_war.18.a:0 "归于历史的尘埃吧。"
 OMS_unification_war.19.t:0 "寒夜余温"
 OMS_unification_war.19.desc:0 "炉火噼啪舔舐着壁龛，伊戈尔的眼袋在旧扶手椅中陷得更深。这位世纪之交降生的老人闭上双眼，任记忆的冰锥刺入太阳穴——\n\n安加尔斯克作坊的刨花屑还在鼻腔里飞舞时，革命的风暴已撞碎沙俄的窗棂。工友们唾沫横飞地争论着布尔什维克的纲领，少年伊戈尔却盯着车床油污暗想：新旗帜的阴影里，可会藏着旧枷锁的齿痕？\n\n而后是权力的走马灯，斯大林铁幕坠落后布哈林的笑颜在报纸头版绽开。当莫斯科沦陷的消息传来，正在工厂彻夜赶工的他如遭雷击。那些催生了他关节炎的苦役，终究成了无用功。\n\n曾经坚不可摧的联盟，最终如玻璃般被摔得粉碎。当军阀在破碎的国土上割据时，伊戈尔仿佛脚下的活板门突然敞开。当关节炎剥夺他的劳动能力时，幸有家人庇护他渡过周遭肆虐的危机旋风。\n\n尽管曾有人曾狂妄地宣称要剿灭黑色联盟，现实却走向了相反的道路。此时此刻恰如彼时彼刻，黑联的士兵正列队穿过伊尔库茨克的街头，宣告他们的统治。但若他们真能重聚这片破碎山河，或许终有一日它能直面大日耳曼国？人总得怀抱希望。而如今这渺茫的希望，恰似炉膛里燃烧的薪柴，足以温暖残冬。"
 OMS_unification_war.19.a:0 "凛冬虽至，寸光犹可拒寒。"
 OMS_unification_war.20.t:0 "遍体鳞伤，斗志未亡"
 OMS_unification_war.20.desc:0 "237号坦克在西伯利亚的村庄间游荡了近乎整个下午，其任务是进行先期侦察，调查有关萨布林派在其政府投降后仍在抵抗的传闻。他们途经的所有村庄，无论是农耕小村还是市镇中心，都空无一人，不见丝毫生灵。废弃的建筑和城镇广场死气沉沉，偶尔能看见几只死去的农畜，正被狼群或乌鸦分食。四周静得出奇，唯有燃烧谷仓的余烬发出的噼啪声打破了这份死寂。最终，237号坦克的乘员们停了下来，他们的燃料快要耗尽了。幸运的是，他们的后勤车队就在不远处，正赶来为他们补充燃料。坦克指挥官涅夫斯基爬出坦克，掏出一支雪茄点燃。雪茄头上的火光带来了短暂却令人慰藉的暖意，轻拂着他的颧骨。他环顾四周，涅夫斯基猜想，民众大概是在他们推进时逃离了。\n\n燃料车抵达，开始为237号坦克补充燃料。这花了一些时间，但最终他们准备就绪，就在这时，一声尖啸划破长空，坦克旁的一栋房屋轰然爆炸。一枚火箭从237号坦克前方茂密的林线中射出，紧随其后的是同一方向如潮水般涌来的密集弹雨。小小的黑色联盟车队顿时陷入混乱。所有人都以为萨布林派的军队早已溃不成军。他们错了，它还在，并且仍有一战之力。终于，坦克的主炮开始还击。无人知晓这场战斗会持续多久，但显而易见，鲜血势必染红此地。"
 OMS_unification_war.20.a:0 "列宁最后的追随者们，正怒吼着抗拒那行将熄灭的光明。"
 OMS_unification_war.21.t:0 "我们敢于希望"
 OMS_unification_war.21.desc:0 "巴达的又一个清晨，市长帕夫洛夫像往常一样走进市政厅。与黑色联盟的战争已从他们身边掠过，萨布林国家的命运尚不可知。但他们确信，从今往后，艰难困苦的日子将会持续数月，乃至数年。他提着公文包走上楼梯时，每个人都向他致意。供暖和照明系统都已瘫痪，他们不得不依靠发电机。他终于来到办公室门前，推开了门。他把公文包放在桌旁，然后向后靠去，在开始漫长的一天工作前喘口气。他看向桌子，看到一个信封。打开一看，鲜红醒目的“通告”二字映入眼帘，是黑色联盟通知他，他的城镇现已划归其领土，所有命令必须服从。\n\n他长长地舒了口气。至少，这还不意味着他会被枪毙。他最终还是把信封放到一旁，埋头开始工作。然而，这样的平静并未持续多久。大约正午时分，他听见外面传来一些响动。他从窗户向外望去，只见一辆卡车停在市政厅门前，车头还跟着一辆吉普。他从椅子上弹了起来，前去一探究竟，路过了所有神色慌张的下属。他刚一出门，一名军官便伸出手掌，示意他停下。\n\n“奉黑色联盟之命，你必须跟我们走一趟。”\n\n没等他开口，一名士兵便粗暴地抓住他的双手，反剪到脑后，其余人则涌进大楼搜查他的下属。他被押到市政厅后院，双膝跪倒在地。天气冷得刺骨。那军官在他身后点上了一支烟。军官察觉到帕夫洛夫的目光，回头看了看其他人是否已经返回，见他们还没回来，便迅速塞了一支烟到帕夫洛夫嘴里，替他点上，然后又飞快地退回原位。大约十分钟后，楼里便搜查完毕，再无一人。他的下属们都面朝着墙壁站着。他们一言不发。帕夫洛夫也沉默不语。\n\n“预备！”军官高声喝道，士兵们纷纷举枪上膛。\n\n“举枪！”下属们顿时乱作一团，帕夫洛夫的秘书忍不住啜泣起来。然而，他没有慌乱，也没有流泪。一切都结束了，唯一能做的，便是接受这无可避免的结局。在生命的最后时刻，他想起了那个让他抽了最后一支烟的军官。"
 OMS_unification_war.21.a:0 "[Change Later]\"FIRE!\"[Change Later]"
 OMS_unification_war.22.t:0 "罪无可赦"
 OMS_unification_war.22.desc:0 "战争结束了。阿穆尔政府仅存的残余势力，如今已落入黑色联盟之手。伊戈尔像往常一样醒来，洗了把脸，穿上制服，走出营房，却发现自己今天有幸负责看守一个黑衫党徒的审判法庭。和他的同伴们一起坐上卡车后，他们来到了法院门前。伊戈尔端着步枪笔直地站了大约一个小时，令人意外的是，法庭里居然暖和得很。在至少半个小时的时间里，他已经目睹了至少四名黑衫党徒被判有罪，并处以枪决。其中一个甚至连一句话都没来得及说。他实在不明白，如果每个被告几乎都会被立即判处死刑，那这个法庭还有什么开庭的必要。或许是为了宣传吧。\n\n两个小时过去了，又有更多的黑衫党徒受审，无一例外，全部因叛国罪被判处死刑。然而，其中一个似乎比他的同伙们更加桀骜不驯。他一边破口大骂，称所有人都是“犹太猪猡”，一边试图推开押着他的两名警卫。两名警卫最终还是强迫他坐了下来。法官试图开口说话，但他每次尝试都会被那家伙的叫骂声打断。一名法警终于不耐烦了，他掏出手枪，毫不犹豫地对着那家伙的后脑勺扣动了扳机。那家伙的脑袋应声栽倒在桌上，他的尸体很快就被拖走了。当下一个被告进来时，他显然被桌面上那块被鲜血染红的木头吓到了，不停地回头张望，生怕自己也会在这把椅子上丢了性命。\n\n这场令人痛苦的审判终于在十个小时后结束了，伊戈尔很快就坐上了返回公寓的卡车。光是站着就已经筋疲力尽了，但额外的口粮还算值得。当伊戈尔坐在自己的床上时，邻床的伙伴问他今天过得怎么样。伊戈尔只是看着她，叹了口气。"
 OMS_unification_war.22.a:0 "“累死了。”"
 OMS_unification_war.23.t:0 "死亡贩子于末路滞销"
 OMS_unification_war.23.desc:0 "In an unmarked room, in an unincorporated town, on the outskirts of Magadan, two men who weren't in Russia, along with one who most certainly was, sat down to have a meeting that never happened to discuss a state that never was.\n\n\"Alexander Lazarenko, I take it? We, uh, assure you that the United States of America had nothing to do with the deranged misadventures of that madman Werbell. Rather, we seek to ensure continued diplomatic ties with-\"\n\n\"-You Americans are too damn sloppy.\"\n\n\"Excuse me?\"\n\n\"You prop up an illegal puppet state on Russian soil, and upon its inevitable destruction act as if you had no hand in it. I know your game, and I have to say you're terrible at playing it.\"\n\n\"I apologize, Mr. Lazarenko, but there seems to have been a misunderstanding. The CIA would not back foreign dictators and warlords, nor would it operate against its allies. We simply ask for this to be cleaned up as nothing more than a minor, inconsequential stain on the clean surface of Russo-American cordiality, and for all CIA operatives and assets in the region to be allowed to be withdrawn. Surely a reasonable government such as yours would be more than amenable to such requests?\"\n\nFor a moment, there was silence. Then, the sound of something sliding on the floor.\n\n\"Mr. Lazarenko you can't be serious-\"\n\n\"Leave. And do not return. Let this generosity be the last act of its kind required.\"[Change Later]"
 OMS_unification_war.23.a:0 "最后，只剩下一顶沾满鲜血的帽子，静静地躺在冰冷的地板上。"
 OMS_unification_war.24.t:0 "我们错在何处？"
 OMS_unification_war.24.desc:0 "滴水声不断，床铺质量极差，空气中弥漫着恶臭。舒克申和阿梅特-汗已经开始逐渐适应他们的新牢房了。两张生锈的小床、糟糕透顶的床垫、一个水槽，还有一个坏掉的马桶。两人仍穿着污迹斑斑的西装，因为他们甚至没领到像样的囚服。他们都盯着天花板，直到阿梅特-汗打破了沉默。\n\n“我们到底哪里做错了？”\n\n舒克申转过头。\n\n“是我们建设得太少？准备得太少？还是希望得太少？是我们导致了这一切吗？”\n\n舒克申本想安慰朋友几句，让他别那么自责，但他也正面对着现实——他内心有着同样的负罪感。统一战争简直是他生命中最黑暗的时期。战胜波克雷什金曾给他带来希望，以为一切终于要好转了。但随着越来越多的战报详尽传来，详细描述了黑色联盟如何取得一场又一场的胜利。这让他噩梦连连，而噩梦似乎即将成真。他刚要开口，却听到一个声音。\n\n“阿梅特-汗·苏丹，请跟我们走。”\n\n两人抬头望去，看见几个一身黑衣的人，仿佛准备参加葬礼，领头的是个军官，他身后的两个是士兵。舒克申面露惧色，但阿梅特-汗脸上毫无表情。他默默站起身走出了牢房，但在离开前，他最后一次转向舒克申，说道：\n\n“我很快就回来。”\n\n舒克申独自坐在牢房里，待了好几个小时——或者他感觉是过了好几个小时——他早已失去了时间概念。他很疲惫，但身心却拒绝休息。然而情况似乎还能更糟。当那个军官再次出现时，他不禁打了个寒颤……\n\n"
 OMS_unification_war.24.a:0 "[Change Later]\"Let's get this over with, ‘Mr. President’.\"[Change Later]"
 OMS_unification_war.25.t:0 "近乎无痛"
 OMS_unification_war.25.desc:0 "结束了，新西伯利亚已经沦陷。黑色联盟连日推进，全西伯利亚军溃不成军。残部不再组织防御，唯余仓皇撤离。士兵鏖战时，平民也正疯狂逃窜。昔日权倾朝野的西罗维基，此刻沦为了争抢逃生舱位的鬣狗——他们涌向任何能够飞往日本、美国或愿收留他们的国度的航班。\n\n阿尔乔姆·马卡洛夫正是他们的缩影。这位西伯利亚公司前董事正带着随从扑向他的私人飞机，机场围栏外平民正试图攀爬任何带有轮翼的机械。当引擎轰鸣声刺破死寂，机舱内所有人都憋了一口气。阿尔乔姆望向舷窗：人群如潮水般冲破残存警卫的防线，跑道上的奔逃者被践踏倒地。机身开始滑动，跑道却被人墙堵塞。机长转头急报：\n\n\"跑道阻塞，我们恐——\"\n\n\"我不管！立刻升空！\"\n\n机长咽回厌恶的唾沫。突然一声枪声炸响——冲向飞机的流民击毙了最后的警卫。推力阀被猛推到底，机翼下方数米处人群惊恐伏倒。再次看向舷窗，阿尔乔姆心脏几乎停跳：黑衣洪流涌进了机场。\n\n地面急剧缩小，他的喉间终于泄出半声喘息。机长机械地复述道：\n\n\"系统正常，航班预计抵达于——\"\n\n此刻，驾驶舱警报器忽然发出了凄厉的嘶鸣。未及惊叫，一颗火球吞噬了整架飞机。五千英尺之下，黑色联盟军官伫立在导弹发射架旁，对着无线电平淡地通告：\"目标清除。\""
 OMS_unification_war.25.a:0 "[Change Later]\"Missile, hit!\"[Change Later]"
 OMS_unification_war.26.t:0 "尘归尘"
 OMS_unification_war.26.desc:0 "09:00 黑色联盟部队进驻此前曾被战略绕行的安加拉海沿岸的布拉茨克市。情报显示此地存在相当规模的无政府主义抵抗力量，遂命令两个步兵师从北、西两方向入城清剿。10:00 两军首次爆发激烈交火，联盟下令使用炮兵攻击。士兵遭遇当地民兵近乎狂热的抵抗。10:30 城市东部区域完全肃清，反抗的声音消声觅迹。西部强度未减，城市持续保持最高烈度。12:00 坦克旅调入城内增援。\n\n13:30 南北城区被分割为二，抵抗活动初现衰竭迹象。四分之一的城区已沦为废墟。无政府主义者仍试图动用包括砖块、石块甚至驾车冲撞部队在内的无用手段作战。14:50 在坦克旅支援下，城南战事基本平息，作战重心转至城北。我军伤亡虽不严重，但仍需要提起重视。16:00 占领区休战，部队已完成最终攻势准备。16:40 经长时间的炮火覆盖，我军业已攻入最后抵抗据点。尽管受到持续炮击，该地守军的士气并未溃散，无政府主义者仍在负隅顽抗。18:00 战斗基本结束。城市现彻底化为残垣断壁，多数平民已逃离城市或留在此地争抢残余物资，但抵抗者几乎无人投降。此城是否值得重建，或任其在烈火中被烧净，尚存争议。"
 OMS_unification_war.26.a:0 "安那其妈妈最终抛弃了她的孩子们。"
 OMS_unification_war.27.t:0 "[Change Later]\"大厦将倾“[Change Later]"
 OMS_unification_war.27.desc:0 "[Change Later]\"The city was burning. The air was choked with ash and smoke and embers, scraps of a dream deferred that drifted on the wind like fireflies. Private Koslov held his left arm over his face, hoping to ward the sting from his watering eyes. He failed. The young man, barely sixteen, stumbled over wood and rubble, his kalashnikov clutched by the cold barrel.\n\nIn the distance, he could hear screaming. The invaders were growling, roaring their hate like animals. They had slipped past language into the primordial. Beneath their shouts, he could hear civilians — women — begging for mercy. Their speech was crushed under the hammerfall of gunshots.\n\nKoslov's bowels ran cold. The stripling broke out in a sweat as he scrabbled through chalk and fallen beams, forcing himself forward on his hands and knees. He had to escape. He had to get away from this nightmare, retreat, live to fight another day -\n\n\"Help me.\" A phantom's moan drifted on the burning wind.  \"Please... help me.\"\n\nKoslov wiped the tears and smoke from his eyes. Everything around him was an indistinguishable ruin, the same pattern of broken concrete and toppled walls. Without thinking, the words slipped from his mouth. \"W-where-\" He cleared his throat, spitting black phlegm into the dust. \"Where are you?\"\n\nA scraping sound came from his left, and Koslov saw him. He was a man, or the remnants of one. The soldier was middle aged, balding, with a curly grey beard and the patch of the Utopian salon's militia sewn onto the breast pocket of his uniform. And his legs had been crushed by a falling beam. An arm dangled by the man's side, useless.\n\nKoslov knew what the soldier wanted before he even spoke. Mercy. A reprieve from the animals that hunted Tomsk's ruins. But the League was close, and growing closer by the second. He could feel their breath on his neck...\n\n\"I'm sorry.\" The boy turned as the soldier wailed in horror, and sprinted for the city's outskirts. For survival, and shame.\"[Change Later]"
 OMS_unification_war.27.a:0 "[Change Later]\"Pragmatism — another word for cowardice.\"[Change Later]"
 OMS_unification_war.28.t:0 "女王的人马"
 OMS_unification_war.28.desc:0 "绝望与忧郁如瘴气般浓稠地弥漫在空气中，这座小型营地里的每一个人——从后勤人员、士兵直到莉迪亚本人——都心若明镜。但即便这是他们存于人世的最后时刻，她至少能为这些将士维系一个虚幻的信念：他们的牺牲终将有所值，哪怕只是微不足道的意义。骑兵们已跨上战马列队，人数虽不及她期望的一半，更遑论要直面钢铁洪流。她策马缓缓行至队列正前方，以凌厉的目光扫视众人。有人迎上她磐石般的凝视，更多人则面露颓丧。\n\n她猛然拨转马头，军刀直指苍穹，随着一声战吼冲锋而起。即便将战马催至全速，多数人心知肚明这不过是为求壮烈成仁。当他们冲过作为掩体的小山丘时，黑色联盟的攻势规模令所有人胆寒。喉间涌起苦涩的硬块，但已无路可退。\n\n坦克与装甲车队立即调转炮口。轰鸣的炮火与机枪扫射为许多人敲响丧钟，未被子弹当场夺命者亦坠马落地。莉迪亚未能幸免。两发子弹贯穿胸膛，将她掀落冰冷坚硬的大地。\n\n腰部以下逐渐失去知觉，血泊在身下蔓延。恍惚间，她想起被称作“留里克二世”的父亲。尽管行事乖张，他确实坚信自己正在为俄罗斯构筑更美好的未来。而今这个梦想被生生撕碎，何等讽刺。接着兄长尤里的面容浮现在眼前。纵有争执与权斗，她心底始终保有血亲之爱。不知他命运如何——或许永不知晓才是最好。当黑暗开始吞噬意识，恐惧攫住了她的思绪。"
 OMS_unification_war.28.a:0 "光，他们总说要有光……"
 OMS_unification_war.29.t:0 "国王的人马"
 OMS_unification_war.29.desc:0 "远处传来一连串沉闷的轰鸣，天花板上簌簌落下的尘埃在尤里国王与近卫们围坐的桌面积了薄薄一层。局势已危如累卵，在座众人心知肚明。黑色联盟的大股步兵即将撕裂他们在市中心的防线，直捣指挥中枢。守军早已疲于奔命，既无援兵可调，亦无火力支援。这位不幸的国王却在绝境中酝酿出最后一项孤注一掷的计划——撤退至最后防线，以困兽之斗迫使敌军暂缓推进。\n\n他们仍与两百米外的火线保持着无线电联系。愈靠近指挥部的防御工事愈坚固，至少能支撑片刻。尤里攥紧颤抖的右手掩饰软弱，下达了战术撤退命令。残存的士兵虽精疲力竭、补给见底，仍以钢铁般的意志继续战斗，誓要在投入死神怀抱前多拖几个敌人陪葬。\n\n又一阵爆炸撼动着摇摇欲坠的建筑，这次距离更近，扬起的尘雾如瀑倾泻。尤里发狂般在脑海中翻检着记忆卷宗，战术、策略、方案……可惜一无所获。\n\n尘灰覆盖的厅堂正前方，悬挂着他亡父的巨幅肖像——那位至死都自称“留里克二世”的男人。喉间一阵哽咽，尤里曾幻想自己能在至亲环绕中安详离世，但命运岂会遂人所愿。不出一个钟头，此地必将沦陷，无人可阻。\n\n他深深吸了口气，默然起身，目光始终未离画布。一滴泪水刚溢出眼角就被迅速拭去。世人皆无法选择自己的终局，但必须打完手中最后的牌。他从身后拾起一杆莫辛纳甘步枪，挎上装满弹夹的武装带，甚至给枪口装上刺刀。在场众人见状纷纷武装起来。最后凝望父亲容颜片刻，他踏出厅门，就此步入历史的终章。"
 OMS_unification_war.29.a:0 "祖国正在死去。"
 OMS_unification_war.30.t:0 "撤职"
 OMS_unification_war.30.desc:0 "战争彻底输掉了。鲍里斯·舍普诺夫和所有尚存理智的人都心知肚明，但这位军阀本人却比部下显得更加漠然。日本金主们对赤塔政权i的溃败怒不可遏——毕竟他们已经在这位暴发户军阀身上押注了天文数字的赌资。可当三辆装甲车冲破赤塔郊区的浓烟时，直升机的旋翼声仍在天际轰鸣，证明东京方面还舍不得丢弃这枚棋子。\n\n车队最末的装甲车里翻涌着无声的杀意。瓦西里攥紧藏在膝间的手枪，枪柄已被掌汗浸透。他所憎恨的不仅是令人绝望的现状，更是前排那个瘫在真皮座椅上的身影。\n\n这位\"光荣领袖\"此刻像醉醺醺的棕熊一样蜷缩着，猩红的眼珠深陷在青黑色的眼袋里，褶皱的将官制服沾满伏特加的酒渍。当舍普诺夫神经质地绞紧双手时，瓦西里看见那双手正如筛糠般颤抖——多么讽刺，三周前宣传画上持剑劈开西伯利亚冻原的伟人，此刻竟连自己的手指都控制不住。\"到了！\"驾驶员嘶吼着刹住车。二十米外，运输机的舱门如同钢铁巨鳄张开下颚。舱内的日本联络官机械地挥动手臂，腕表在夕照下折射出冷光。\n\n舍普诺夫踉跄下车的瞬间，瓦西里的枪机在喧嚣中无声地完成上膛。七步。五步。三步。当舍普诺夫踏进旋翼掀起的死亡气流圈时，瓦西里突然想起授勋那天的场景：此人把勋章别在他胸前，伏特加酒的气息喷在脸上说\"忠诚是唯一的货币\"。枪口抵住后脑勺的刹那，舍普诺夫竟有所感应般回头——他浑浊的瞳孔里最后倒映的，是瓦西里扣动扳机时平静如冰的面容。瓦西里的怒吼与弹头凿穿颅骨的声音，被直升机引擎的轰鸣声吞没大半。舍普诺夫向前扑倒的姿势，恰似在向舱门里的日本人行五体投地大礼。\n\n随后警卫的子弹几乎同时掀开了瓦西里的天灵盖，这位弑君者应声倒地，他焦黑的嘴角到最后仍凝着一抹狞笑。"
 OMS_unification_war.30.a:0 "罪有应得。"
 OMS_unification_war.31.t:0 "战后之事"
 OMS_unification_war.31.desc:0 "陆军部\n\n备忘录呈送：黑色军团将官及辖区总督\n\n主题：白军领地整合与米哈伊尔·安德烈耶维奇处置方案\n\n作战通报：赤塔陷落及白俄投降后，白军残部已陷入全面溃散：部分遁入了雅库特密林，余者则脱离中央指挥彻底沦为匪帮，屡次劫掠行政未全的边镇。中央司令部授权旨意各作战单位可采取任意必要手段剿灭沙俄孤忠。为恢复新整合区秩序，将于此设立军区总督制。\n\n米哈伊尔·安德烈耶维奇已确认死亡。其尸首已于赤塔因炮击而坍塌的旧皇居废墟下寻获，现已转移焚化。针对此白军的懦弱傀儡的宣传战将即刻启动：揭露其所谓\"正统哈尔滨白俄之裔\"的谎言，聚焦于沙俄体制之腐朽\n\n曝光其在英国成长的经历，以此证实此人并不谙俄国民生，实乃异邦之傀儡\n\n在白军领地整合指令圆满完成标志着大审判备战真正进入实质阶段。俄罗斯祖国已挣脱妄图复辟的旧制度的枷锁继续前进。所有曾参与摧毁祖国俄罗斯的国家——尤以条顿为首——必将承受吾等雷霆之怒。\n\n"
 OMS_unification_war.31.a:0 "署名，总司令德米特里·亚佐夫"
 OMS_unification_war.32.t:0 "无论它有没有价值"
 OMS_unification_war.32.desc:0 "炮火连天，飞机轰鸣，坦克驰骋，战舰破浪，平民惊慌失措，一切都结束了。黑色联盟军队进驻马加丹，政府仅存的权威烟消云散，连希望也荡然无存。残余的政客与士兵甚至在联盟部队逼近城郊前便已登船，朝着美国的方向逃遁，现在，已无任何奇迹能够挽救这一局面。仅剩的人纷纷逃离马加丹。佩特林留了下来，他无处可去，马加丹便是他的一切，而今这一切已灰飞烟灭。他决定去探望一位故友，当他踏入监狱时，这里空无一人，接待处不见人影，牢房也无人看守，连一个囚犯都不曾剩下。佩特林走进守卫的储物室，只见一名守卫正疯狂地收拾行李，但见到佩特林后立刻站直了身子。然而佩特林只是吩咐他收拾东西，去打听是否还有船只离开，并要走了他的钥匙。\n\n最终，佩特林找到了马特科夫斯基的囚室。当他打开牢门时，马特科夫斯基问道：\n\n“我的刑期到了吗？”他笑着躺在床上。佩特林坐在牢房里的椅子上。\n\n他们聊了几个小时，聊人生、聊过往、聊家人、聊这份“友谊”。有时他们会争论，有时他们会哀伤。最终，他们已无话可说。突然，外面传来炮击声，天花板上的灰尘纷纷落下，灯光骤然变暗。佩特林掏出仅有两发子弹的手枪，知道是时候了。\n\n马特科夫斯基毫无反应，咧着嘴问道：\n\n“这一切都值得吗？你和你那些理念，还有你缔造的国家？”\n\n佩特林没有回答，一枪射穿他的额头。尸体颓然倒在床上。接着，他把枪对准自己的额头，看着马特科夫斯基那毫无生气的身体，他笑了，在扣动扳机前说道："
 OMS_unification_war.32.a:0 "[Change Later]\"Yes, yes it was.\"[Change Later]"
 OMS_unification_war.33.t:0 "血染雪原"
 OMS_unification_war.33.desc:0 "马特科夫斯基独自枯坐在总统府内，周身发冷。局势已非危急二字可以形容，所有人包括他自己对此都心知肚明。马加丹的军队全线溃败，残部在混乱中节节败退。如今守卫城市的仅剩一支缺编严重、装备简陋的师级部队，外加临时拼凑的民兵武装。若运气好，或许能支撑片刻，但最终等待他们的不是死亡就是沦为俘虏。\n\n至于他？等待他的很可能是漫长的羞辱与酷刑。他读过黑色联盟处置其他领导人的报告——杀一儆百，震慑民众。如今他自己就站在这个枪口下，甚至可能是字面意义上的枪口。深思熟虑后，他拉开办公桌抽屉。一个他从未希望打开的抽屉。里面只有装着两粒白色药片的小玻璃瓶，和一瓶伏特加。\n\n他茫然凝视着这些物件，憔悴地长叹一声，思绪飘回在哈尔滨的岁月。那时他与罗扎耶夫斯基、舍普诺夫并称“哈尔滨白俄三巨头”，作为俄罗斯法西斯党的不同派系共事。但对不同形态的法西斯主义乃至君主制的追求，使得这场让极右翼掌控俄罗斯的联合行动首战即溃，最终分裂成三个小政权。起初一切看起来如此简单，他甚至说服自己或许——仅仅是或许——他们能完成这场大胆的夺权并维持团结。回首往事，这种想法何其幼稚。\n\n他将药片倒在桌面上，拧开酒瓶盖，却仍犹豫不决。往事如走马灯般在眼前闪回，恐惧与怀旧的浪潮席卷而来。当初将雅戈达的赤色分子逼退至伊尔库茨克站稳脚跟后，所有人就迫不及待地亮出了刀锋。那些悄然滋生的裂痕瞬间爆发，最终孕育出阿穆尔、外贝加尔和马加丹这三个政权。没有真正的赢家。即便昔日的同僚相继被征服吞并，这也只是场空洞的胜利，至多具有象征意义。\n\n他拾起药片放在舌上，就着大口伏特加吞咽而下。黑色联盟休想得到他们的战利品。这就是战争留给他的终局：没有希望，没有爱，没有荣光，更没有圆满结局。"
 OMS_unification_war.33.a:0 "他像一条丧家犬般窒息而亡。"
 OMS_unification_war.34.t:0 "锈蚀"
 OMS_unification_war.34.desc:0 "斯韦特兰娜·斯大林娜慵懒地环视着眼前的牢房。潮湿、破败、腐朽，这间囚室毫无舒适感，亦谈不上安宁。她望着挤在牢房里的男男女女——他们曾公开向敌人慷慨陈词，也曾闭门与盟友密谋策划。如今他们了无生气地倚靠在暴君筑起的墙边，同样变得潮湿、破败、腐朽。\n\n这是他们此生见到的最后一个房间。\n\n“8452号！”\n\n她站起身，两只威严的手钳住她的肩膀，押着她从其他囚犯中间穿过。那些她辜负的人们投来阴郁的凝视，令她步履沉重。究竟是从哪里开始错的？她抛弃了一切来建设一个值得生存的俄罗斯：她的时间、她的健康，甚至她的道德准则。她目睹民主之光逐渐黯淡，却别过脸去，自欺欺人地相信这一切都是为了人民，为了俄罗斯。而现在，那束光彻底熄灭了，只剩下一份潮湿、破败、腐朽的讣告。\n\n蒙眼布又湿又沉。她见不到故土了，也不想再见了。他们警告过她的。上帝啊，那些警告言犹在耳：为安全出卖民主的人，终将两者皆失。可她把警告者当作天真的蠢货赶走了。但他们是对的。某个当时还潜伏着的恶魔，如今正沐浴在暴政的毒焰中，利用她的失误把她的军队碾作齑粉，让她的人民与她反目。他们赢了。这间囚室就是明证。\n\n“预备！”\n\n她本可以做得不同吗？能改变俄罗斯的宿命吗？也许吧。但或许她的人民已经承受了太多苦难。或许任何人都无法逃脱命运的枷锁。或许世界确实需要经历仇恨与地狱之火的洗礼，才能真正改变。这些疑问自她恢复记忆以来就萦绕心头，不断叩问，却永远得不到解答。\n\n“开火！”\n\n不过至少，她再也不用为此困扰了。"
 OMS_unification_war.34.a:0 "子弹穿过，钢铁碎裂。"
 OMS_unification_war.35.t:0 "还剩什么？"
 OMS_unification_war.35.desc:0 "风拂过杂草丛生的旷野，山峰间的太阳高悬，西伯利亚针叶林那令人起疑的平静与沉寂让他感到不安。数周来他们辗转藏身于废墟、林地、山坳与地窖，躲避着联盟巡逻队的搜捕。没有计划，没有组织，甚至没有明天。这些天他们沿着溪流逃亡，直到被联盟空军逼进深山。他他们需要找个地方休息、重整旗鼓、思考对策。终于，在漫长的等待之后，领队转过身来，告诉他们可以休息了。他展开毯子，众人将剩余弹药、口粮和手雷堆在毯上。他深吸了一口气，望向山谷。山谷里一片寂静。这让他愈发焦虑。他想起了离家的那天，想起了宣誓的那天，想起了收到消息的那天。\n\n领队一边低声嘀咕，一边仔细检查着毯子。突然，他抬头喝道：“就这些？”有个士兵从口袋摸出五六发子弹，尴尬地说自己忘了。领队低声咒骂了一句。最后，他抬起头，重重地叹了口气，摘下帽子挠了挠头。\n\n“应该够我们撑几周的了，直到我们决定下一步怎么做。但愿我们不会被发现，否则一次大进攻，这些储备就得见底。”\n\n话音未落，一阵隆隆声打断了他们。一辆孤零零的坦克正沿土路驶过山谷。全员立刻伏地。领队紧握步枪，一动不动。每次呼吸都比前次更沉重。一名士兵抓起弹匣和手雷准备匍匐前进，被领队一把揪住腰带拽了回来。后者揉着士兵后脑勺，把训斥咽了回去。仿佛过了一个世纪，众人才缓缓从荒草间探出头。唯独领队仍保持着卧姿，手中紧握着步枪，嘴唇无声重复着某些话。"
 OMS_unification_war.35.a:0 "[Change Later]\"We've had a good run\".[Change Later]"
 OMS_great_trial.1.t:0 "真正的战时经济"
 OMS_great_trial.1.desc:0 "风雪抽打着冰封的河面，克雷洛夫麻木地凝视飘雪——这几乎是他仅剩的消遣。科米共和国近年来的衰败，此刻真正地刺入他的骨髓。\n\n他只能眼睁睁看着黑色联盟将俄罗斯越攥越紧，榨取着每个公民的欢愉。起初是银餐具和\"多余家具\"，接着家电被没收。很快，连棋盘、纸张乃至\"额外\"衣物都被黑衣士兵搜刮一空。\n\n最残酷的尚未到来。克雷洛夫被迫离开家园，分配到兵工厂劳作。他原先的住房并不豪华，而如今却被12英尺宽房间里的铁架床取代。\n\n泪水滚落脸颊，愤怒与悲伤在脑中翻涌。他目睹联盟摧毁掉俄罗斯的荣光，代之以绝望的工厂。他们的宣传口号更是可笑——竟企图以复仇之名粉饰对俄罗斯深邃灵魂的抽干。\n\n寒风骤烈，暴雪下得越来越大。克雷洛夫裹紧他单薄的外套时，警卫的哨声宣告他短暂的小憩已经结束。于是他转身离开河岸，将往昔的记忆抛诸脑后，并彻底丧失对生活的一切希望——属于克雷洛夫的美好明天永远不再到来。"
 OMS_great_trial.1.a:0 "属于俄罗斯的自由即将咽下它最后一口气。"
 OMS_great_trial.2.t:0 "安雅"
 OMS_great_trial.2.desc:0 "[Change Later]\"Peter, eat your vegetables.\" Anja tried to put as much calm into her voice as possible when instructing her child. It was the only thing she could do to try and soothe his anxieties in these trying times.\n\nAnja and her family had come during the migration in the wake of Generalplan Ost. The Reich had promised her everything, and for a time they received everything. The spoils of Russia came to her doorstep every day. The natives, turned to servants and nannies, kneeled and kissed her feet at the offer of employment, and the luxuries offered to her and her family from the land nigh limitless. But, as her sons dutifully informed her even through the censorship and black ink, they were coming.\n\nThe Slav had never been a threat to Germany. According to the most intelligent minds in all of Germany, they were subhumans and henceforth incapable of standing up against the Aryan race. Her sons were of said stock, born and bred from a line of pure-Prussian vintage going back to the times of Bismark. Yet, she could detect their desperation in every letter, every stroke of a pen which continuously decreased in quality. Neat cursive turned to hasty print and hasty print turned to panicked scrawls, nigh animalistic. And the sirens. The wretched sirens. They blared at seemingly random times in the day, forewarning of attacks that came mercilessly despite the best efforts of the city's air defense. She was told all was well. For the first time though, Anja did not believe them. As if glass was shattering on the ground, her trust in the Reich was broken.\n\n\"Mommy? Why can't we have more? I'm still hungry.\" Anja's thoughts went back to reality, as she saw that Peter had finished his plate. It was licked clean, pristine as if she had just washed it.\n\n\"It's because the Reich needs to give everything it can to your brave brothers and fathers, fighting the Black League, so we can be safe.\"\n\nShe put on a smile and stroked his hair."
 OMS_great_trial.2.a:0 "黑色联盟向前碾进！"
 OMS_great_trial.3.t:0 "掠夺文化"
 OMS_great_trial.3.desc:0 "一小瓶水，一包硬饼干，几块古怪的肉干。这似乎是那名死去的德军士兵能提供的全部。阿列克谢毫不客气地将尸体掀翻在地——这般对待可恨的敌人正合适。他将乏善可陈的口粮塞进口袋，把步枪甩上肩头，走向下一具尸体。\n\n约莫两周前，部队刚部署就收到通知：他们在服役期间不会再获得政府配给的口粮。上级指示他们“从掠夺自己土地的强盗那里抢回来”——所谓“强盗”自然是指德国人。这道命令引发了不同反应。当然，质疑的声音很快消失——任何抗议者都会当场被枪毙，其口粮则分发给忠心的士兵。\n\n阿列克谢不像某些战友那样热衷于掠夺。他们三五成群躲在废弃建筑里，如同鬣狗般扑向路过的德兵，枪杀他们再洗劫尸体。\n\n而阿列克谢更像是秃鹫。他在战场上搜寻可食用物资，偶尔也会在军服过于破烂时扒走死者衣裳。尸臭如影随形。老实说他早已习以为常。在他看来，比起可恨的德国鬼子施加于同胞的苦难，这点代价微不足道。他单膝跪向新的尸体，开始翻检遗物。但愿这次能多些收获。"
 OMS_great_trial.3.a:0 "希望不是压缩饼干。"
 OMS_great_trial.4.t:0 "时间问题"
 OMS_great_trial.4.desc:0 "为镇定心神，亚佐夫又斟了一杯酒。他独坐办公室数小时，埋头研阅边境动员部队堆积如山的战报，陪伴他的只有满溢的烟灰缸、吃剩一半的黄油面包片，以及那瓶注视着他阅读的细长伏特加。当他又猛灌一口时，感觉胃里似有蛆虫扭动。饮尽杯中残酒重重砸下玻璃杯时，不可名状的焦虑已扼住他的咽喉——可他所阅所见，字字句句皆是捷报。\n\n“何止是捷报。”亚佐夫仰靠椅背沉思。这简直是辉煌胜利！从北境冰封森林到南疆灼热草原，愤怒的俄罗斯雄鹰正展开复仇之翼，即将为西方世界降下完美黑夜。我们的钢铁洪流会碾碎德国佬羸弱的防线，饥渴的履带将贪婪吞噬一切抵抗。曾令人闻风丧胆的德国轰炸机，将在我们的猎鹰面前化作漫天红金火雨。即便在腐朽的莫斯科核心地带，面对德军仓促构建的可怜防线，红军也将如精密钟表般势如破竹。一切尽在掌控——亚佐夫在脑海中勾勒着这幅图景，可为何该死的焦虑挥之不去？\n\n瞥见时钟指向02:37，他怀疑自己是否开始精神恍惚。睡眠或许能治愈这种不安，但刚起身，桌上文件又发出无声嘶吼，仿佛藏着未破译的机密。亚佐夫呻吟着跌回座椅，深知若不重新筛查这些该死的报告，今夜注定无眠。\n\n继续阅读时，卡尔贝舍夫的形象突然闯入脑海。并非旧识口中的那个工程师，而是战争传奇中的不屈英雄。在那座集中营里，他连最懦弱的囚徒都能激励成抗德战士。即便基辅、列宁格勒与莫斯科相继沦陷，此人仍坚信不可一世的德国战争机器终将崩溃，他们终将迎来起义时刻。刹那间亚佐夫惊觉：精密齿轮的崩坏只是时间问题。\n\n他猛然站起，粗短手指将战报攥出裂痕。“卡尔贝舍夫没等到那天，”他咬牙自语，“德国佬也休想！”那人的信念未能自救，德国人的妄想同样徒劳。所有与卡尔贝舍夫有关联的人都已被赶尽杀绝。"
 OMS_great_trial.4.a:0 "而德国人也将迎来相同的命运。"
 OMS_great_trial.5.t:0 "良机莫负"
 OMS_great_trial.5.desc:0 "亚佐夫凝视着茶杯中升腾的袅袅蒸汽，沉默地等待着。整个上午，他耳边反复回荡着前线传来的噩耗，失败接踵而至。这些溃败毫无征兆，期待已久的突破始终没有出现。军队绝非毫无准备，亚佐夫暗自思忖，德军本不该构筑起如此顽强的防线。怒龙般的火焰在他腹中翻腾，他脑中闪过一张张叛徒的面孔。若问题不在前线，那毒瘤必然滋生在政府内部。\n\n“总司令同志。”萨哈罗夫斯基抱着一摞文件悄声入内：“前线战报您都看了吗？”\n\n亚佐夫缓缓颔首，轻啜一口茶水。\n\n“我们拟定了多项应对方案，”萨哈罗夫斯基示意桌上堆积如山的文件，“当然，最后还是得您来定夺。”\n\n“不，亚历山大·米哈伊洛维奇。”\n\n“不？\"\n\n“不。”亚佐夫斩钉截铁，“按原计划继续执行。”\n\n“恕我直言，原计划正在失败。”\n\n“时间还够，”亚佐夫示意对方落座，“这是意志力的较量。德国人倾其所有，就想逼我们退回乌拉尔山后。在这场较量中我绝不会先眨眼。”\n\n“德米特里·季莫费耶维奇，”萨哈罗夫斯基自斟一杯茶，“或许该考虑变通之策。”\n\n亚佐夫静坐不语，探究的目光锁住对方。为避开总司令冰冷的注视，萨哈罗夫斯基盯着茶杯，将方糖缓缓搅入杯中。漫长的一分钟里，唯有茶勺碰撞杯壁的脆响在室内回荡。\n\n“我们筹备了多少年，亚历山大·米哈伊洛维奇？多少年？难道要在第一道关卡前跌倒？”\n\n沉默。\n\n“绝不。”\n\n“不错，”亚佐夫点头，“大审判不可阻挡。但叛徒就在我们中间，这是内部问题。”\n\n“内部问题？拉扎连科最擅制造恐惧，我推荐他来干。”\n\n“不要拉扎连科，”亚佐夫嫌恶地皱眉，“他太……张扬了。我要悄无声息。”\n\n“悄无声息，”萨哈罗夫斯基会意道，“不见血？”\n\n“不见血，只闻风声。足够让人们如芒在背，为祖国倾尽全力。”\n\n“明白了。”萨哈罗夫斯基起身整理文件，“不过……少许鲜血恐怕是不可避免的。”\n\n萨哈罗夫斯基离去后，亚佐夫仰靠椅背长叹。独处时思绪漫游，一簇疑虑的火苗倏然窜起。他猛然起身，喃喃自语着将这不祥的火苗驱散。"
 OMS_great_trial.5.a:0 "”大审判不可停歇。绝不停歇。“"
 OMS_great_trial.6.t:0 "坚守阵线"
 OMS_great_trial.6.desc:0 "[Change Later]\"Ach! Schise!\" Kurt bashed the side of his MG with his palm, desperately trying to fix the feed jam. He worked frantically, every few moments glancing out of his dugout for Russian troops. He wasn't sure how long was left until the next onslaught, but it couldn't be enough.\n\nRussia and the Black League... Kurt had never seen anything like them. He was only eighteen, but he remembered the famines and death of the Burgerkrieg as a young boy. It may have been hard but the front was... the stench of the bodies, the smell of the gas never leaving his lungs... These were animals. The Black League had charged his trench line three times. He could make out nothing but black uniforms and the stench of chlorine. They charged again and again, achieving nothing but spilling their own blood. Kurt couldn't stop staring out of the MG nest at the corpses. He went to wretch but the month old rations held in his stomach.\n\nHis empty gaze was interrupted by something breaking through the line. His eyes widened and he scrambled to battle position. They were back. He gave one last hopeless bash to the machine gun, glancing between the ever advancing charge and the weapon, and was shocked to see it cycle a round. He threw his whole weight into lifting the gun onto its position and screamed as he held down the trigger, shutting his eyes and praying that the screams would stop. He could feel the bodies hit the earth as his finger dug into the metal, holding it down with all the strength he could muster. He dared to open his eyes, the wave of gas slowly beginning to subside, but the charge hadn't abated. They were getting closer. His comms were slowly filled with more and more screams. Kurt's aim became less focused as he desperately tried to gun down whoever was closest to him. Suddenly the stream of bullets stopped.\n\nNot now. Please not now. He slammed the gun into the wall but the jam wouldn't clear, the onslaught drawing ever nearer, only meters away. He pulled the trigger and pulled it again but the gun was done for. He pulled his pistol from its holster and tried to lift his arm.\n\nBefore the pistol had left his waist he felt the air escape his lungs as a bayonet pierced his chest. He was thrown to the floor, blood and chemicals filling his mouth as he screamed a hysterical gurgle."
 OMS_great_trial.6.a:0 "黑色洪流冲垮了欧陆的最后防线。"
 OMS_great_trial.7.t:0 "不惜一切代价"
 OMS_great_trial.7.desc:0 "“嘿，安德烈，把烟掐了。我这儿可是炸药，天才。”\n\n“行了，老家伙，”安德烈吸了一口。“你想让我干嘛？歇会儿？”\n\n“等等吧，”达米尔提议。“像我们一样。”\n\n“你小子或许能十四个钟头不碰烟，”安德烈答道。“丹尼尔在那边鼓捣出的火星都没引爆什么，那这烟就更没事儿了。”\n\n达米尔嗤之以鼻。他心知安德烈说得不无道理，却实在无法容忍这年轻人的莽撞。\n\n黑色联盟打到喀山那会儿，达米尔的日子照旧。枪子儿炮弹这些玩意儿，他很快就琢磨过来了，压根儿不认什么主义。总有人想弄死别人，于是乎，像达米尔这样的小人物，就得在生产线上卖命，才能保住饭碗。可军队的胃口越来越大，产品的质量也每况愈下。没过多久，整个西俄罗斯，甭说像样的钢材，就连现代化的电动工具和安全规程都成了稀罕物。最糟糕的是生产配额，无休止地增加，丝毫没有减缓的迹象。如果达米尔和他的同事们还想完成指标，他们就必须同时应付几十项要命的活计，才能造出些连炮弹都称不上的玩意儿。\n\n安德烈站在他对面，一手夹着那该死的香烟，一手把玩着钻头。达米尔则在填充炮弹，他那双粗糙的老手动作麻利，一如过往千万次那般。达米尔倒想慢点干活，可不等他装好一发，那条老掉牙的传送带便“吱嘎”作响，又把下一枚送到了跟前。他一次次弯腰，起身，再弯腰，把炸药装进手中，后背钻心地疼，可他也只能咬牙硬挺。一旦乱了节奏，他就再也跟不上了。\n\n手指猛地一哆嗦，他慌忙想补救。尽管指尖的肌肉记忆仍在，动作迅捷而果决，可他的心却提到了嗓子眼。传送带再次发出刺耳的摩擦声，开始转动，他踉跄着追上去，拼命想弥补过失。他想冲安德烈吼，让他赶紧找掩护，可根本来不及。达米尔甚至没来得及张嘴，便感觉自己被一股巨力抛起，旋入了淡蓝色天空的漩涡。"
 OMS_great_trial.7.a:0 "但愿他好好抽完了那根烟。"
 OMS_great_trial.8.t:0 "异议绝迹"
 OMS_great_trial.8.desc:0 "秋明市警察局报告 A/11号\n\n反审判异议分子状况\n\n我部欣然报告，秋明市各区所有反审判异议分子，无论年龄或意识形态，均已自此肃清。尽管战斗艰难，秋明市的英勇警官们依然毫无差错地履行了职责。若论晋升与嘉奖，巴甫洛夫·德米特罗维奇中士当为不二人选。他在打击秋明市中心武装反审判小组的行动中展现出非凡的勇气。\n\n鉴于与反审判势力的战斗已升级到前所未有的程度，巴甫洛夫·德米特罗维奇中士对其认为不称职的下属采取了断然措施。他立即清除了麾下部队中所有反审判的思想和言论，并在调查和战斗行动中，不顾自身及麾下警官的安危，奋勇对抗那些暴露其叛国嘴脸的败类。他未折损一兵一卒，便成功击溃了一个由三十余名战斗人员组成的小组。此外，他（同样未受任何损失）成功截获并捣毁了数个非法的宣传品制作和分发窝点。\n\n若无如德米特罗维奇中士这般英勇之士的贡献，我们的胜利能否如此彻底，尚不能断言。然，凭借秋明秘密警察全体警官的英勇奋战，我欣然报告，我部已取得对反审判势力的全面且无可否认的胜利。在我们针对可憎之敌的伟大任务面前，异议之声已无立足之地。\n\n此致，\n\n雷京·维萨里昂·维塔利耶维奇 大尉"
 OMS_great_trial.8.a:0 "无处可逃。"
 OMS_great_trial.9.t:0 "死得其所"
 OMS_great_trial.9.desc:0 "脚下的水泥地仿佛一条垂死挣扎的狗一般扭动着。黑色的薄雾附着在他身旁高耸的建筑轮廓上，将天空中的太阳遮蔽得严严实实。戴着防毒面具，萨沙本就视野受限，而这片黑雾更是让他几近失明。身旁的街道传来凶猛的咆哮，他转过头，看见战友们漆黑的身影正向前冲锋，枪声从他们幽影般的指尖迸发。刹那间，他们的呐喊声便被炮火雷鸣般的哀嚎所淹没，将他脚下的大地擂得如同鼓点。萨沙拼命向前跑去时，感觉自己仿佛正在坠落。在他冻伤的手指间，萨沙像信徒紧攥《圣经》一般，将步枪紧紧抱在胸前。他试图呼唤战友，但他的声音消弭于战争的汪洋之中。\n\n萨沙所在的师是第六个攻击此阵地的部队。前五个师均已溃败，因此，萨沙和他的战友们必须用鲜血来证明自身的救赎。进攻的第一天，他们未遭遇任何抵抗，便以为这是一场轻而易举的胜利。然而仅仅一天之后，他们就发现自己错得离谱。德军封锁了街道，将他们赶入狭窄的包围圈，随后在狭窄的要冲用火力将他们悉数歼灭。当萨沙的战友们试图强行突围时，地狱之门在他们头顶洞开，火箭弹与炸弹如暴雨般倾泻而下。当毒气也从天而降时，萨沙迅速戴上了防毒面具，从那以后，他眼前的世界便再未清晰过。\n\n换作旁人，经历这般炼狱般的日子恐怕早已崩溃，但萨沙没有。即使在崩塌的街道中摸索前行，几近失明，仇恨的烈焰依旧在他胸中熊熊燃烧。并非针对敌人，而是针对联盟。他已将联盟索取的一切倾囊献出——每一滴汗水，每一寸肌肤。可现在，他们却把一支步枪塞进他手里，要他去为他们卖命送死？下达命令时，那名军官厌恶地盯着他们，说道：“救赎的代价便是鲜血。”\n\n萨沙跟上了战友们的队列，他们如幽灵般从浓雾中显现。他们向前挺进，他的脚步也合上了他们的节奏。萨沙发现自己再次怒火中烧，发起了冲锋。他已下定决心要活下去，改日再结果那些黑色联盟的杂种。"
 OMS_great_trial.9.a:0 "但那个“改日”，再也没有到来。"
 OMS_great_trial.10.t:0 "绝不容忍破坏分子"
 OMS_great_trial.10.desc:0 "“这个周末颇不平静——数名布里亚特劳工据守贝加尔湖附近的弹药工厂，用桌椅家具筑起路障抵挡黑色联盟的围剿。尽管亚佐夫已掌控远东，部分布里亚特人仍坚守着萨布林赋予的理想。正是这些理想，让同情分子暗中为罢工者输送食物补给，也使他们拒绝与当地警方谈判。\n\n‘布里亚特劳动者联合起来！为自由公正而战！’年轻的布里亚特活动家鼓舞着支持者们，试图维系士气迫使政府让步。他们核心诉求是缩短工时与工作日，但大审判从无暇顾及这些‘发牢骚的人’，亚佐夫和他的手下亦然。\n\n子夜时分，黑色联盟某营突袭工厂，纵火焚烧罢工者的路障。士兵射杀视线内所有活物，不论是否参与罢工。肃清工厂后，部队即刻扑向周边村庄。凡疑有萨布林主义倾向者，皆被驱赶至偏远荒野，由喷火兵彻底焚化。\n\n至周一清晨，唯余弹药厂地板的焦黑残迹与村庄空屋，证明罢工者与同情分子曾存在过。当新来的工人清理废墟，黑色联盟忠诚居民进驻空屋后，连这些痕迹也消失殆尽。接下来的一周，一切重归‘例行生产’。所有见证黑色联盟怒火的人都噤若寒蝉了，唯恐自己也沦为这样的下场。”"
 OMS_great_trial.10.a:0 "没有借口!"
 OMS_great_trial.11.t:0 "几个问题"
 OMS_great_trial.11.desc:0 "A quiet, cold breeze filled the dimly lit interrogation chamber. Two earnestly dressed officers armed with revolvers sat side by side in front of a woman, a soldier of the black army. The two men look at the woman's face with cold, harsh eyes as the woman averts any eye contact with the men. She's distressed by the conversation and appears to be holding back tears.\n\n\"Once again, recruit, explain to us the incident. In detail, make sure you miss nothing.\" Placing his pistol on the table between her and the men, her eyes finally break contact with the concrete flooring, darting directly to the gun barrel. She swallows down her emotions and takes a deep breath. Moving her handcuffed hands back up to the table in clenched fists, she opened her mouth again to say something.\n\n\"...I. I saw his face. It took me a moment, but I knew I had seen his eyes before.\" She stared away into space momentarily before one of the officers slammed his palm onto the table, signaling her to keep it together. She returned to reality at that moment and continued, \"And it all came back to me. Who he was, what he'd done. Murdered my sister just for fun.\" She stopped again, tightening her eyes to force every muscle in her eyelids to hold the tears back. The officers, keeping up their stoic gazes, didn't move a muscle.\n\n\"He killed her! He mutilated her! I had to! No-no one does that and gets away! He made a mistake letting me go–I drove that knife in that bastard's throat! Dead! Dead!\" Her nose flared, tears rolled down her cheeks and onto the table. She was breathing hard, her eyes were full of rage, yet her face was of sheer terror. It was as if the officers were witnessing a person, metaphorically, splitting apart at the seams.\n\nThe officers looked at one another, then returned to her enraged gaze with still emotionless faces. \"Here's what you'll do. From now on, if anyone asks, it never happened. If you need to say something to anyone–and I mean, anyone–you keep your mouth shut.\"[Change Later]"
 OMS_great_trial.11.a:0 "不许问，不许说。"
 OMS_great_trial.12.t:0 "一个少年的使命"
 OMS_great_trial.12.desc:0 "米沙还是个孩子，就被塞进驶向大审判前线的卡车，成了万千炮灰中的一员。他迷迷糊糊的，只因保家卫国的枪炮声和飞机引擎的隐约轰鸣才勉强保持着一丝清醒。一群穿着黑色制服、煞气腾腾的男人把他和许多同龄的孩子赶上了咆哮的卡车。他知道，大审判早已开始，他的家人——父亲、母亲，还有哥哥们——都被送去了工厂，或是被派去和条顿人拼命了。他记得那些面目可憎的男人发表过慷慨激昂的演说，讲的是“服从”和“审判”——这些都是他和小组里的朋友们在学校里心甘情愿学到的东西。\n\n他记得在营地的日子，被迫为审判进行战斗训练。即便发给他的武器沉重不堪，他也学会了对那些摧毁家园、掳走同胞的条顿人决不手软。但米沙很困惑，因为在训练中，他和其他许多孩子都挨了打，被迫在生死边缘挣扎。他是俄罗斯人，又不是邪恶的条顿人，为什么非得像罪犯一样遭受毒打？即使在黑衣人把他们小组又塞回卡车前，他啃着最后一口干粮时，这个问题依旧在他脑海里盘旋不休。\n\n但现在，这些念头都无关紧要了；大审判已经降临，他必须振作起来！他跳下卡车，看见小组里的朋友和其他许许多多的人也从摩托化纵队里涌出，重新整编成连队。他看到了那些成年的士兵，他们的纪律和精良的武器让他心生向往。米沙有样学样，加入了他的小组。他看见一个身着特殊制服的高大男人走到他们面前，米沙听到那个男人自豪地谈论着士兵们，其中就包括他们这支混杂在众多部队里的“黑色联盟儿童管理部”营。他准备好了，他准备好为祖国效命了。在数万人山呼海啸般的“乌拉！”声中，米沙跟着他的中士，以快步冲锋的速度奔赴战场！\n\n他紧随其后，声嘶力竭地呐喊着，直到战场的可怖景象第一次映入他的眼帘。当他看到那片广阔无垠且不断蔓延的尸山火海时，他冲锋的脚步渐渐慢了下来。他看到黑色联盟的孩子们毫无生气地散落在装甲车和飞机的残骸间，这让他想起了几个月前失踪的哥哥们。他的双膝开始颤抖。他曾渴望为俄罗斯的复仇而战，而不是参与这场屠杀！但他口中还是不由自主地挤出了誓言：“我将成为俄罗斯之剑与盾，藉此伸张正义。”米沙发出了最后一声战吼，然后在平原上重新跟上了小队的步伐。"
 OMS_great_trial.12.a:0 "他们已永葆青春。"
 OMS_great_trial.14.t:0 "还剩什么？"
 OMS_great_trial.14.desc:0 "维亚切斯拉夫叹了口气，低头看了看手表。他静静数了二十秒，第三次重重敲响房门。依然无人应答。\n\n周围的同志们挨家挨户奔走，戴着皮手套的拳头砸在门板上，不等邀请就闯进屋内，让毫无防备的居民们满脸惊恐。不过大多数人都没敢表露不满——逆来顺受是他们早早就学会的生存本领。当这些穿黑衣的高大男人们闯入公寓翻箱倒柜时，他们只是捧着微温的茶盏静坐，听着收音机里若有若无的杂音。成捆型号杂乱的老旧步枪与年代久远的弹药被拖下旋转楼梯，消失在夜色里。如此多被遗弃积灰的枪支流落民间，让维亚切斯拉夫暗自心惊。\n\n“让开，同志。”当老妇人终于拉开门时，他皱眉将她推到一旁，“公务。”\n\n“公务？”这老妇人像苍蝇盘旋尸体般绕着他打转，“我可是黑色联盟成员。军队找我能有什么——”\n\n“住所内是否藏有火器，公民同志？”\n\n“呃，我恐怕不太明白……”\n\n她支吾的语气已回答了所有问题。维亚切斯拉夫二话不说冲到橱柜前，差点扯掉柜门。将各种无用杂物扫开后，他的手缓缓探向柜子深处。老妇人不断在他耳边聒噪着私有财产和公民权利，可他连半点听进去的意思都没有。\n\n发现步枪竟仍装着子弹时，他喉咙里挤出一声讪笑。莫辛纳甘老枪，至少闲置了几十年——从内战时期就一直搁着，他推测。想到前线某个倒霉蛋不得不端着这破玩意作战，他简直要掬把同情泪。只消瞥一眼，他就断定这枪准会卡壳得像婊子养的一样。但军令如山，何况伟大的考验高于一切。哪怕这支破枪里只飞出一颗子弹嵌进德国佬肉里，也算值了。老太婆张大嘴巴盯着他扬长而去的背影。"
 OMS_great_trial.14.a:0 "一切为了前线！"
 OMS_great_trial.15.t:0 "替代闪电战"
 OMS_great_trial.15.desc:0 "瓦西里的手指笨拙地摆弄着变速杆，心脏怦怦乱跳。他脚下油门发出嘶吼，卡车在泥潭里越陷越深。当他用肩膀发狠撞向变形的车门时，腐朽的金属却纹丝不动。他重重跌回驾驶座时，闻到了死亡的气息。\n\n就在放弃前最后一秒，他把老卡车的档位砸进了倒档。锈迹斑斑的裙甲和焊在车顶的滑稽炮塔让车身重如铁棺，但专为俄罗斯荒野设计的轮胎坚固耐用。他用尽全力踩着油门，直到整台车巨响，向前猛蹿。这时前轮突然压到了一块石头，引擎发出胜利的咆哮，这头钢铁巨兽终于缓缓挣出泥沼。\n\n爬出驾驶舱的瓦西里看着自己的杰作几乎笑出声来——卡车轮毂裹着粗劣切割的废铁冒充装甲裙板，车身上用麻绳捆满沙袋充当附加装甲，驾驶室顶着卫国战争时期的古董炮塔。整个车都被黑色的泥浆覆盖，几乎难以辨认。\n\n当这辆“坦克”终于吭哧着停下时，瓦西里从后座钻了出来。脚踩实地的瞬间双腿却瘫软了下来，几乎站不稳。回头望着泥浆里的怪物，想到这堆废铁要直面德国装甲集群，胃里顿时翻江倒海。\n\n瓦西里还没来得及说话，上尉就转过身，匆匆瞥了一眼那辆可怜的坦克。\n\n“够用了。”瓦西里听到上尉对同事们说，“周末前能改多少改多少。”\n\n瓦西里站起身，挥舞着拳头，大声喊道：\n\n“您指望这口铁棺材挡住德国坦克？驾驶员根本撑不到前线！”\n\n地面在军靴下震颤，他怒气冲冲地走向连长。还没等他说更多，一名副官钳住了他的胳膊，上尉下达了命令。"
 OMS_great_trial.15.a:0 "“他休克了，快送去医务室。”"
 OMS_great_trial.16.t:0 "颤抖的恳求"
 OMS_great_trial.16.desc:0 "[Change Later]\"Dmitry Yazov stared at the document which lay in front of him with both a feeling of utter shock and an equally strong urge to break into a fit of cackling. He almost couldn't believe his eyes as he read the address.\n\n\"To the Glavkoverkh of the great Russian nation,\n\nI'm sure you are under no misconceptions that the war between our two states has devolved into needless and total death and destruction. I know you do not wish for your people to suffer any more than I do mine. I urge you, please, reopen communication between our two governments. This war does not have to end in the manner I dread to imagine you believe it does. We can find a way to avoid any further destruction and find a path to peace.\n\nPlease,\n\nThe Office of the Fuhrer of the Greater Germanic Reich\"\n\nYazov read through the letter again with nothing short of complete awe. That bastard even put his own little signature at the end. What did they expect to come of this wailing cry to save their own skins? A peace? He couldn't help a small chuckle escape his mouth. They must be more desperate than he thought. This pathetic appeal to escape Russia's rightful retribution was all the proof Yazov needed that the Trial was truly bringing an end to the Teutonic fever dream of Aryan supremacy. The great Russian Spirit had to be prevailing, or else they wouldn't resort to such lowly begging.\n\nStill, he supposed a response was in order. His secretary dictated his words as they left his tongue without a moment of hesitation or thought.\n\n\"To the Fuhrer of the German cancer which stains Europe,\n\nWe will have peace once every last wretched German man, woman, and child lies in a ditch with the flag of the Black League waving over their corpses. I will hang your rotten body myself when I arrive at the shattered remains of Berlin.\n\nSigned,\n\nDmitry Yazov, Glavkoverkh of the Russian Black League\"[Change Later]"
 OMS_great_trial.16.a:0 "唯一的回应是震耳欲聋的无线电静默。"
 OMS_great_trial.17.t:0 "军用级"
 OMS_great_trial.17.desc:0 "列昂尼德颤抖着倒出了三杯茶，感觉自己冻僵的手指又恢复了活力。他和另外两人围坐在临时搭建的篝火旁，享受着连日无休止的战斗后难得的温暖与平静。两天前，他们终于撤离出了前线，但列昂尼德心里清楚，军官们对此并不满意。那些他们为之浴血奋战的每一寸土地都已失守，因为显而易见，没人再有力气、甚至武器继续战斗了。于是，在过去几天里，他们只能默默地蜷缩在后方，等待新补充的兵员和枪支到来。\n\n当士兵们被召集列队时，列昂尼德就心知不妙。他迅速喝完最后一滴热茶，加入了那麻木地涌向高级军官的人流。不出所料，列昂尼德瞥见巨大的板条箱正从卡车上卸下并打开，露出了里面的枪支。已经集合的人群想必是派来填补空缺的新兵。“哼，”列昂尼德心想，“他们当中没一个看起来超过十六岁。”\n\n就在军官们宣布要再次发动进攻时，士兵都在窃窃私语。片刻后，列昂尼德才注意到，展示出来的武器没有一件像是近十年生产的，真见鬼，其中一些恐怕自第一次世界大战后就再没使用过。从沙皇时期的礼仪用枪到电影片场拉来的猎枪，这批武器更适合在博物馆里而非战场上。一些士兵犹豫着，开始慢慢挪向那些武器。\n\n“总比没有强吧。”列昂尼德咕哝着，弯下腰去拿武器。就在他的手刚碰到一支步枪时，另一只手搭上了他的肩膀。他转头一看，一个面相凶狠的军官正居高临下、不以为然地盯着他。\n\n“军医同志，这些步枪是给士兵用的，不是给医生的。”\n\n“给士兵用的？我在前线待的时间比你们从幼儿园直接招来的这些小鬼加起来的都长。”\n\n“军医同志，我的意思是，”军官说，“一支步枪在杀手手里比在医生手里更有价值。你可以从那边的武器里挑。”\n\n列昂尼德顺着那人指的方向看去，顿时感觉嗓子发紧。他拖着发软的脚步走向那个装满“武器”的板条箱——那里面装满削成了步枪的形状的木棍。"
 OMS_great_trial.17.a:0 "只要敌人认为它是真实的。"
 OMS_great_trial.18.t:0 "风中的回音"
 OMS_great_trial.18.desc:0 "阿纳托利抓挠着覆盖防毒面具的罩布底部，扑灭自巡逻开始便折磨他的灼热瘙痒。今日不过是又一次日常行军。他们的任务目标是：扑灭伏尔加定居点条顿游击队的残余火种。单调感令他难以忍受——踏入空荡村庄与伪造墓地时，迎接他的既无承诺的俄罗斯赞歌，也无条顿人的屠杀，而唯有服从职责驱使着他继续前进。\n\n小队领袖彼得罗维奇士官举起手：目的地已至。焦黑的村庄如同空荡石冢，这里埋葬着数十个伏尔加叛徒。士官指令简明：保持集结，持续巡逻以防范伏击者。\n\n分秒推移，几近小时。可他发现了什么？唯有风穿骸骨的呼啸与余烬的噼啪声响。此处空无一物，一如其他村庄。未竟的空虚感如虫豸爬入皮肤，再钻入脑海，比任何瘙痒都更加难以忍受。它抓挠钻探，折磨心神，近乎发狂。阿纳托利再也忍不下去了。他的职责是逼条顿人钻出洞来，可自己在此地何为？虚度光阴，日复一日！\n\n\"滚出来，你们这群老鼠！\"他嘶吼着，\"出来受死！\"\n\n一支步枪枪托猛地戳进他的胸膛，两只手钳住他的衣领。士官面色铁青道：\"杜舍夫列兵！你个傻逼！不知道有游击队在吗？！\"士官的怒斥在广场回荡，如阿纳托利刚才的挑衅一样渐渐消逝；而后，寂然。同样，他的怒火消退了，被那相同的感觉取代——对他自己方才将空虚感和疲劳感一并爆发时的一阵后怕。士官松开手，认命地摇头：\n\n\"此事胆敢泄出半句，军法处置。\""
 OMS_great_trial.18.a:0 "若无仗可打，士兵有何用？"
 OMS_great_trial.19.t:0 "因热爱而战者"
 OMS_great_trial.19.desc:0 "帕维尔接到的命令很简单：召集村里的游击队员抗击德国鬼子。这是黑色联盟赋予他的使命，在大审判初期，他曾全心全意执行着这项任务。他熟悉这些游击队员，熟悉这座村庄——他们曾亲如家人。几个月前，他还能如数家珍地说出每个人的故事，甚至超越了爱国情怀去爱戴他们：他们的热情款待，战友间的肝胆相照，以及多年抗击德国鬼子时展现的钢铁意志。当总司令将共产主义者斥为腐朽、将莫斯科人定为不可救药时，帕维尔只感到痛心——要是那些大人物知道这些游击队员的真实模样就好了。\n\n但任务终究是任务，而起点就在这座村庄。当他迈出第一步时，他就明白，等到自己回到上级面前时，他们一定会枪毙他。\n\n帕维尔强迫自己继续前行，目光扫过被炸毁的道路，扫过人们曾经的家园和生计——如今只剩战争的残骸。耳边只有寒风的呼啸，以及废墟间碎屑的窸窣与坍塌声。不到十分钟，他就找到了目标：一家不起眼的商店。他快步走进去，径直朝里屋的储物间走去，目光紧盯着那扇门。他知道，只需要说出两个字，就能再次见到那些熟悉的笑脸——\n\n“红军。”\n\n几分钟过去了，无人应答。帕维尔推门而入，走下地下室，却发现这里早已被遗弃。他喉头发紧，继续向前。\n\n他走进游击队的指挥室，这里本应是西俄罗斯的沉默守护者们议事的地方，可现在，他只看到早已干涸的血迹，以及散落的弹壳——毛瑟枪的，还有伊热夫斯克兵工厂的。他甚至找不到一具遗体，但他知道，那些被他称为同志、视他如己出的人们，已经永远消失了。帕维尔拾起一条游击队的臂章，上面的红星依然鲜明，他紧紧攥住它，心如刀绞。\n\n红色游击队在他心中的地位，是黑色联盟里任何人都无法取代的。帕维尔将臂章塞进大衣口袋，转身走向归途，无论等待他的是什么。"
 OMS_great_trial.19.a:0 "他多想回到家，再一次见到亲爱的同志们。"
 OMS_great_trial.20.t:0 "我们的永世之战"
 OMS_great_trial.20.desc:0 "他端坐于桌后，人群如秃鹫般蜂拥而至，将他团团围住。灯光骤然亮起，麦克风噼啪作响，摄像机开始转动。当一名助手将一张纸滑到他面前时，他的视线变得模糊，纸上的字母仿佛在游动。亚佐夫强压下涌上喉咙的胆汁，猛地睁开双眼，再次开口说话。\n\n“俄罗斯同胞们！大审判正不断推进。每一天，祖国都感到无比自豪，因为她知道所有勇敢的俄罗斯儿女都响应了号召，都投入到了一场彻底消灭德国寄生虫的神圣的战争中。每夺回一寸被窃取的土地，俄罗斯的荣光便洗刷了一分。\n\n然而，一头丑陋的野兽正在抬起头颅，那就是失败主义的幽灵。这并非前线将士的过错，而是懦夫们在暗中策划的险恶阴谋——为了使得大审判陷入停滞。他们用甜言蜜语蒙骗纯正的俄罗斯人，声称我们的战争徒劳无益、残忍不堪。这些家伙如同通敌者一样可憎——堪比德国佬，因为他们企图摧毁俄罗斯精神本身。保持警惕吧，俄罗斯同胞们，你们的职责是站出来揭露这些叛徒，抵制他们的谎言。每一个叛徒的脖子上，都早已套好了一根绞索。\n\n请记住，俄罗斯同胞们，这场战争亘古永存：从亚历山大·涅夫斯基到尼古拉二世沙皇，在这场世代相传的战争中，俄罗斯大平原上早已烙下我们与德国猪狗相抗争的印记。即使在经历了无数次惨败之后，布哈林和伏罗希洛夫领导的红军仍然在俄罗斯的土地上挥洒鲜血，在钢铁与烈火的雷霆中浴血奋战，最终将战争的火炬传递给我们。”\n\n亚佐夫眉头紧锁，身体前倾靠近麦克风，一拳砸在桌子上，说出最后一句话：\n\n“俄罗斯一直在进行这场战斗，并将永远战斗下去。这场伟大的审判是我们的一切！哪怕再打十年，再打一万年，我们也要把德国佬统统踩在脚下，让他们烂成泥！”"
 OMS_great_trial.20.a:0 "永恒"
 OMS_great_trial.21.t:0 "错误的信任"
 OMS_great_trial.21.desc:0 "阿德里安·沃尔科夫匆匆踏入刚被黑色联盟解放的村庄广场。街道空无一人，自从最后一支国防军部队撤离后，这座小定居点的居民就再未踏出家门。他猜想这些人恐怕吓得连压在脖颈上的军靴已经挪开都没察觉。他独自沿着荒凉的街道快步疾行，步伐刚劲迅捷，虽孤身一人却保持着正式行军时的警觉姿态。\n\n他掠过一栋栋屋舍，几乎未加审视地持续前行。终于发现有个男人正在自家附近的水井打水。阿德里安走上前去，靴底敲击石板的声响在寂静的街道上格外刺耳。\n\n“同志！希望你能帮个忙！”他出声招呼时，那男人明显浑身一颤。阿德里安掏出照片递过去：“我想找这两个人，”他指着照片里抱着小男孩的含笑夫妇，“他们应该就在镇上，当然现在年纪比照片要大些。”男人只是呆望着。“同志，你到底见没见过他们？”\n\n对方结结巴巴地回答：“对、对不起，我不会俄语……”阿德里安踉跄后退，大脑一片空白。为什么会有德国平民在这里？这时他才真正环视周围的建筑。先前因急切导致的狭窄视野逐渐消散，那些带着德国建筑风格的房屋和歪斜的十字架装饰映入眼帘。当他意识到家乡究竟变成了什么模样时，脸色顿时惨白如纸。\n\n“求求您，我——”男人的哀求被步枪的爆响打断。屋里闻声出来的女人发出尖叫。阿德里安转身面对她，瞥见屋内壁炉架上悬挂的希特勒肖像。他再次举枪瞄准，眼神已彻底冰冷空洞。\n\n此起彼伏的枪声在村庄回荡，直至深夜未绝。"
 OMS_great_trial.21.a:0 "复仇，让他们偿命。"
 OMS_great_trial.22.t:0 "扫雷人"
 OMS_great_trial.22.desc:0 "克拉拉扫视着身后排成一列的囚犯同伴。大多数人身上都带着酷刑留下的血痕，所有人都憔悴得难以置信——她也不例外。有些人的年纪足以当她祖父，更多人则年轻得能作她子女。若不是连日的失眠、饥饿与痛苦早已榨干她的泪水，此刻她必定会失声痛哭。她缓缓转身面向那名士官——这个体格魁梧、以施虐为乐的男人，正是管理他们这些德国俘虏的“拘留所”最理想的统治者。此刻他正带着施虐般的笑容，开始向最痛恨的囚徒们训话……\n\n“条顿渣滓！今天要给诸位一个机会。”他踢着脚边的碎石，“虽然你们现在都是卑劣的废物，但黑色联盟相信人人皆可赎罪。现在就来决定谁配得上这个机会。”他指向远处山丘，“只要有人能抵达山顶，立刻就能获得自由并编入军队。不过呢……”他的笑容愈发狰狞，“途中要经过雷区，而地雷埋在哪——我也不清楚。”\n\n克拉拉的灵魂瞬间粉碎。她早预料会死在这里，但绝不是这种方式。除了这个怎样都行。当她的内脏因恐惧而痉挛时，眼前这个恶魔仍在继续……\n\n“所以需要你们帮忙。穿过雷区就能赢得自由，要是失败……”他耸耸肩，“也不过是替我们排除一颗地雷罢了。听我口令不前进者，当场枪决。对了——”他示意战地摄影师就位，“我们将全程记录诸位'英勇'的赎罪历程。预备……”\n\n克拉拉想逃跑、想尖叫、想痛哭、想瘫倒在地，想做任何能推迟甚至改变命运的事。但她不能。她听说过反抗者的下场——那是少数仍能让她作呕的回忆。此刻她只能盯着远方的山丘，在士官刺耳的笑声中……\n\n“……前进！”"
 OMS_great_trial.22.a:0 "……乞求无痛的死亡。"
 OMS_great_trial.23.t:0 "冰上大战"
 OMS_great_trial.23.desc:0 "[Change Later]\"The brackish waters of Lake Peipus lapped gently at the sandy loam beneath the Glavkoverkh's feet. They were a disappointment. Polluted with industrial runoff and garbage, the lake stank of rotting fish and urine; plastic bags and rotting food collected in the grass at the water's edge in molding clumps.\n\nYazov sighed. His ears burned as the wind bit at exposed skin, and his fingers stiffened in frozen agony  within mink-fur gloves. \"I shouldn't have come here.\" He turned to his attendant, a nameless bodyguard with a boxer's build and a missing tooth. \"I've wasted the League's resources clearing a safe road for my attendance today. And for what? An indulgence.\" He paused, and looked back at the faecal-brown water. \"Another provocation. Another sin perpetrated against our sacred motherland, against the Russian national body. I came here searching for a symbol of our history, and have found only a crime scene.\"\n\nThe bodyguard remained expressionless. \"I'm not here to judge you, sir.\"\n\n\"No, I claim that duty for myself, and myself alone.\" Yazov snarled. \"Symbols are for the weak. They are the bilious discharge of propaganda, and if our civilization was as strong as we must be in the coming days, we would reject them out of hand!\" Yazov ground his teeth together. He clenched his fists, threatening to tear out the stitching of his gloves. \"A great victory was won on this frozen lake, long ago. And Russian blood was shed to defend Russian civilization, before Russia called itself Russia. But in these days, every inch of our home is soaked in the blood of patriot-martyrs. To elevate one great victory only displays my own disrespectful failure to honor our comrades who completed their final duty.\"\n\nYazov turned his back on the stinking morass, and began the march back to his motorcade. \"With me, comrade soldier. We will not honor Alexander Nevsky's legacy by fawning over a pool of water.\"\n\nAs he walked, he thought of German knights run through with spears, choking on their own blood, praying to a corpse. He thought of the Livonian Order, extinguished and replaced by Slavic settlers. And Yazov's thoughts turned to Germania.\"[Change Later]"
 OMS_great_trial.23.a:0 "一切神圣之物都已耗尽，一切希望都已破灭。"
 OMS_great_trial.24.t:0 "总司令的讲话"
 OMS_great_trial.24.desc:0 "俄罗斯同胞们！大审判的钟声已然敲响！\n\n三十多年前，我们的历史正道被永远改变。我们的祖国曾在她的人民的簇拥下蓬勃发展，等待她的光荣时刻降临。在公正的世界里，俄罗斯雄鹰本应傲立于世，在她的疆域中传播善意，践行意志。\n\n但是，希特勒那充满仇恨，嗜血的军队践踏了我们的国土，所过之处唯余焦土残垣。第三帝国玷污历史，窃取了我们神圣的天命。他们剥夺了俄罗斯民族在地球上的主宰地位。\n\n当一代俄罗斯人民已长眠于这片土地时，新一代俄罗斯人已经崛起并誓要让可憎的德国佬血债血偿！我请求你们，我神圣的人民们，杀光他们！为了你的祖国母亲，杀光他们！不要计算已过去几天，而是计算已有多少德国贱种死于你手！\n\n如果你的步枪填满子弹，就把他们倾泻进敌人的胸膛！如果你的刺刀锃亮，就让他浸透弑父仇敌的鲜血！如果你手无寸铁，就用你的双手撕开条顿人的血肉！不计手段！不计损失！让普鲁士畜生们付出代价！\n\n那些自认无力杀敌的人，那些畏惧于修正历史错误的人，记住！若不消灭那些德国兵，他们绝不会对你手下留情！若不将其子嗣屠戮殆尽，他们就会屠杀你的孩子们！若不处决其妻，她们将永远繁衍德意志肮脏血脉！\n\n记住！俄罗斯同胞们！为重夺本属于我们的地位，我们已忍气吞声三十年！唯有当“德意志”这个概念被历史巨轮彻底碾碎埋葬后，我们神圣的祖国才能重获安宁。从今天起，大审判开始了！光荣属于胜利！光荣属于黑色联盟！"
 OMS_great_trial.24.a:0 "§R复仇，复仇，不惜一切代价。§!"
 OMS_great_trial.25.t:0 "一封意向书"
 OMS_great_trial.25.desc:0 "致大日耳曼国的罪恶政权：\n\n若你方意图避免国家覆灭，则必须严格遵守本函所列之要求。除全盘接受外，任何其他答复都将导致针对你方罪恶政权的全面战争。\n\n第一、黑色联盟要求，对于东欧境内所有辖有俄罗斯或其他斯拉夫民族的专员辖区，须移交俄罗斯复国政府管辖，并重新纳入行政版图。滞留于上述地区的德国殖民者须在三十六小时内撤离，逾期将以掠夺俄罗斯土地罪就地处决。\n\n第二、德国必须立即且无条件向黑色联盟引渡所有现任高级官员（含元首本人），并接受军事法庭的即时审判。并且，德意志民族须被单方面裁定对斯拉夫及俄罗斯民族犯有种族灭绝罪和文明毁灭罪，判处至少一亿德国马克的集体赔偿。赔偿金须于十年内全额支付予俄罗斯民族复国政府。\n\n第三、所有德国国家机构须置于俄罗斯政府的直接监管之下，以彻查其对神圣俄罗斯及全世界犯下的滔天罪行。黑色联盟官员将全程监督此类国家机构及其管理者的审判。\n\n第四、民族社会主义德国工人党必须立即解散，禁止其任何党员担任公职。所有参与毁灭俄罗斯国家的可鄙罪犯须提交黑色联盟审判并酌情判决。\n\n第五、德国政府须正式地、无条件地向黑色联盟投降，对其国民的全面惩处将由俄罗斯政府另行裁定。\n\n等候复函。"
 OMS_great_trial.25.a:0 "“他们不会是认真的吧？”"
 OMS_great_trial.26.t:0 "又该干活了"
 OMS_great_trial.26.desc:0 "谢尔盖和同志们坐在一起，熬过漫长而疲惫的一天。出人意料的是，这周前线这边的阵地异常平静。既没有德国人反攻的消息，指挥他们师的将军也下令固守阵地，等待进攻时机。有些小伙子对此颇感失望，但谢尔盖觉得这正是放松一下、打几局牌的好机会。他们也想听听收音机，可那台老爷机翻来覆去只能播送附近军队电台的《神圣的战争》，老实说，大伙儿早就听腻了。\n\n“嘿，你！”——谢尔盖听到喊声，立刻循声望去。“营地那头需要你过去抬具尸体。听说是那儿有个列兵自杀了。”\n\n谢尔盖很烦躁。这种活儿总是叫他干。他也想抗议，但也知道自己的意见无足轻重，于是站起身，朝尸体那边走去。\n\n此时的他对此已是习以为常，但这幅景象依旧令人作呕。那名年轻士兵，看上去年纪约莫十五到十八岁，用手枪结果了自己。子弹从他嘴里射入，直穿大脑——看样子，他是把枪口抵在下巴正下方开的火。\n\n谢尔盖实在没多少时间耽搁，便决定把尸体拖到附近一个乱葬坑去。他稍稍抬起尸体的双腿，一本小册子从尸体的口袋里掉了出来。他捡起册子，发现那是一本日记。谢尔盖顿时来了兴趣，他们在这边的前线几乎从未发现过什么有意思的东西。他把日记塞进军大衣的右边口袋，盘算着晚点再读。谢尔盖很想了解另一名士兵的经历，但眼下他没那个工夫。现在，他得先把这具尸体处理掉。\n\n把尸体扔进那个土坑，让他与他的战友们团聚后，谢尔盖回到了自己的朋友们身边。夜幕即将降临，他还想继续打牌。"
 OMS_great_trial.26.a:0 "一切都不再重要了。"
 OMS_great_trial.27.t:0 "当你凝视深渊…"
 OMS_great_trial.27.desc:0 "00:53\n\n第一天：我叫亚历山大。这本日记从今天正式开始。今天，我加入了民族复兴军。我很高兴能为祖国而战，帮助黑色联盟摧毁条顿的威胁。明天我就要开始军事训练了，希望能尽快走上前线。我要在“大审判”中与德寇作战，让家人为我骄傲。光荣属于不可分割、不可战胜的俄罗斯。\n\n20:24\n\n第二天：今天是我第一回参加军事训练。我们首先向黑色联盟宣誓效忠。那场面可太荣耀了。宣誓完毕后，训练就开始了。训练内容很是磨人，但这是必要的，这些训练能把我在大审判中打造成究极杀戮机器。日落之后，弟兄们点起篝火，我们烧了一面德国旗。今天过得很棒，但我盼着能早日奔赴前线，为俄罗斯赢得荣耀。\n\n04:36\n\n第三十六天：前面的日子里，我完成了训练，终于被派到了靠近德国边境的前线。抵达军营后，我才发觉事情和我预想的不一样。我被分配到一个小队，负责搜查新攻占的定居点，清除藏匿在那些我们前线师团没工夫进去的地方的威胁。我挺失望的，但也明白总得有人干这活。为了亚佐夫同志。为了俄罗斯。\n\n23:59\n\n第四十天：今天，我第一次杀了一个德国人。我们排进入一座政府大楼搜查任何可能的威胁，结果在其中一个房间里发现了两名藏匿的德国士兵。同志们一看见条顿杂种，枪声就响了。刚一交火，我们当场就干掉了一个，三颗子弹打穿了胸膛。另一个士兵腿部中弹，武器也脱了手，他想爬进另一个房间。我追上去，开枪打死了他。我知道我没做错，这是他罪有应得。毕竟，他是个德国人。他让我们所有人受了那么久的苦…但当我望向他的双眼，当看见他眼中的光芒渐渐黯淡…我竟对他生出了一丝怜悯。我做得没错。我敢肯定。我是在拯救俄罗斯。"
 OMS_great_trial.27.a:0 "“这下有趣起来了。”"
 OMS_great_trial.28.t:0 "…深渊也将回望你"
 OMS_great_trial.28.desc:0 "23:34\n\n第四十七天：我刚到营地就写下了这些。我不知道还能跟谁说。今天，我们发现一户德国人家藏在他们的房子里。我很惊讶，但也没多想。我不知道…我干了什么…我感觉自己像个怪物。他们逼我杀了他们。他们逼我把他们全都开枪打死。那个女人，还有孩子们…我受不了了。每当我闭上眼睛，就能看到他们的脸，他们在求我饶命。可我必须这么做，不是吗？我必须动手，为了…为了我自己。不然他们也会杀了我的！那血，那苦难…他们所有人里，孩子们的尖叫声最大。太响了。我现在都还能听见他们的尖叫声…自从我们离开那个定居点，这声音就没停过，快把我逼疯了。我真的站对边了吗？他们是德国人，但他们手无寸铁。还有那些孩子…他们不该死的。也许…他们都罪有应得，对吧？对吧？愿上帝救救我吧。\n\n22:53\n\n第六十一天：今天是我决定加入这支天杀的军队整整两个月的日子。尖叫声还没停。它们在我脑子里不停地响，像张坏掉的唱片。今天，我们围捕了大约20个平民，把他们推进壕沟，举枪瞄准，然后扣住了扳机。在那之后，尖叫声更厉害了。每一天，它们似乎都越来越响，越来越响…就好像有好多人同时在尖叫。我已经好几天没合眼了，因为每次闭上眼，我都会看见他们所有人。每一个人，都死在我的手上。我对无辜的人做了可怕的事。我只是在服从命令，不是吗？我相信是这样，但那些声音不停地告诉我我是个怪物。怎么可能在这么多尖叫声之上我还听得到其他声音？谁来救救我，我再也受不了了。\n\n夜\n\n第？天：我不知道今天是几号，只知道现在是夜晚。我再也无法离开帐篷了。他们吓到我了。我看见他们，潜伏在外面，在田野中央，等着惩罚我所做的一切。我杀了那么多人。那些声音没有停止，它们不会停止。它们不停地告诉我这是我的错…求求谁来救救我，求求你…无论你是谁读到这篇日记，不要犯和我同样的错误。我将在我唯一能找到安宁的地方找到平静，并为我的罪孽寻求宽恕…对不起，孩子们。对不起，俄罗斯。还有，去你妈的亚佐夫，和你那肮脏的谎言。"
 OMS_great_trial.28.a:0 "“我不看这些本来能睡个好觉的。”"
 OMS_great_trial.29.t:0 "起来，我的祖国！"
 OMS_great_trial.29.desc:0 "“你们不能这样，”他母亲哭嚎着，“他哪儿也不该去，就该待在我身边！而不是死在德国佬哪个鬼知道的烂泥坑里！”\n\n季莫费没有挣扎。军官们牢牢抓住他的胳膊，把他从公寓里拖了出来。在亚戈达的暴政下生活了大半辈子，他深知反抗是徒劳的。\n\n“您的儿子已经是个男子汉了，公民同志，”其中一名军官，契诃夫中尉，试图向他母亲解释道，“他必须为祖国尽忠。”\n\n“看看他，他还这么小！”她抽泣着，“这么瘦弱！他连枪都拿不稳！”为证明自己所言非虚，她开始绝望地朝季莫费挥舞拳头。就在拳头要落到他身上之前，契诃夫一把抓住了她的手腕。\n\n“大审判不等人，公民同志，”契诃夫耐心地解释道，“祖国召唤之时，我们必将回应。”\n\n“去他妈的祖国！”她尖叫着回敬，“去他妈的德国佬、黑色联盟，还有你们那狗屁大审判！把我的孩子还给我！他是我的！”\n\n季莫费还没来得及听清契诃夫冷冰冰的回应，就被人裹挟着推出了公寓，推进了楼梯间。刺骨的寒风从楼梯间呼啸而上，他感到阵阵寒意。与此同时，他看到一只只黑色的拳头正砸在每一层楼、每一户人家的门上。从乳臭未干的毛头小子到饱经风霜的老者，无一例外，都被总司令饥渴的魔爪从温暖的被窝中揪出，融进了夜色里那片幢幢的黑影，消失得无影无踪。\n\n季莫费被押下楼梯，汇入了一股和他一样由半大孩子们组成的人流。走出大楼，他们看到笨重的卡车上塞满了亚佐夫的打手。身着黑衣的人群如潮水般涌过街道，他们挥舞着刺眼的手电，用钉着铁掌的军靴踹开一扇扇大门。\n\n男孩们安静地坐着，一辆线条流畅的黑色轿车从黑暗中驶出，刺眼的车头灯让他们睁不开眼。轿车平稳停下后，一个修长的身影走了出来，雪花在他脚下的皮鞋下咯吱作响。留下来的两名士兵立刻立正，向将军敬礼。将军不屑地打量着这批新兵，突然提及了一个它们从未听说过的名字。"
 OMS_great_trial.29.a:0 "“把他们送到沃尔库塔去。”"
 OMS_great_trial.30.t:0 "仇恨中的使命"
 OMS_great_trial.30.desc:0 "阿纳托利几乎记不清家乡的村庄了。那只是个位于库尔斯克郊外的小地方。被迫离家时他大概只有五岁，唯一清晰的记忆只有离开时的场景：每条街道都弥漫着硝烟，每栋建筑里都回荡着惨叫。他挤在卡车中逃离时，甚至瞥见了国防军的先头部队开进了镇子。\n\n他们全家侥幸逃脱，勉强躲过了德国空军的首轮轰炸，最终抵达托木斯克。在帕斯捷尔纳克的共和国，生活近乎平静，但安宁终难持久。东方再度燃起的战火将他抛回硝烟之中，这次他选择留守家园。当作家之国在混乱时期自我崩塌时，阿纳托利只为自己同胞的自毁行径感到无比耻辱。\n\n多年后街头出现第一只黑色卫队时，他心中涌起同样的轻蔑：俄罗斯人又在自我毁灭。但目睹他们向守军提供特赦来换取加入黑色联盟的机会时，他改变了看法。当城市按黑色联盟的蓝图迅速重建，阿纳托利也慢慢融入其中。\n\n广播里的演说字字句句都是对德国人复仇的誓言，宣扬俄罗斯人在斗争孕育出的团结一致的精神。阿纳托利所渴望的，如今已由总司令赋予。听着一次次广播与演说，他将全部身心都献给了黑色联盟与大审判。昔日的苦难愤懑尽数化作对联盟的责任，胸膛里只剩冰冷而坚定的怒火。\n\n他终于明白联盟的一切行动都是为了“大审判”，为了解放日耳曼铁蹄下的众生。黑色联盟的行为不仅是必要的，更是正义的。多年以来，阿纳托利第一次为自己身为俄罗斯人而感到自豪。他满怀感激地在仇恨中找到了新的人生方向。俄罗斯民族复国政府正在进行神圣的战争，而自己能参与其中，何其有幸。"
 OMS_great_trial.30.a:0 "失落的回响在俄罗斯大地上回荡。"
 OMS_great_trial.31.t:0 "终焉"
 OMS_great_trial.31.desc:0 "在漫长的数日跋涉后，当联盟终于决定动用核武器的消息传出时，一切彻底崩坏。村镇居民集体遁入地下，人们逃往荒野，军队出现大规模逃兵——彼得正是其中一员。他窃来摩托车与应急油桶，支撑自己完成穿越俄罗斯的最后疯狂逃亡。他日夜兼程向北飞驰，只在进食所剩无几的干粮时才稍作停顿。脑海中唯有一个求生计划，每当车轮转动，他就祈祷这一切能够实现。\n\n黎明时分，彼得很怕自己会迟到。他再度加速，布满血丝的双眼死死盯着晨雾中逐渐浮现的目的地——阿尔汉格尔斯克。他在心中向上帝、耶稣与诸圣徒祈祷安德烈会在那儿等他。那个好心的水手确实发过誓绝不抛下自己，即便其他船员想走，安德烈也定能说服他们。凭借在海军的人脉与威信，他必定会在港口等候。\n\n摩托车咆哮着闯入死寂的阿尔汉格尔斯克。彼得对空城置若罔闻，径直冲进码头，看见那艘钢铁巨轮仍泊于港内时，顿时喜极而泣。他抹去泪水，扔下车提起少得可怜的行李，用毕生最快的速度奔向舷梯。甲板上的安德烈与他对视而笑，降下的舰桥将彼得迎入战友们的怀抱。无论末日如何降临，此刻他们终将同舟共济。\n\n启航时分，彼得裹紧大衣回望故土。当海岸线渐行渐远，莫名恐惧攫住了他的心脏。远处防空警笛骤然嘶鸣时，他深吸一口气闭上眼睛，任天火倾泻而下。"
 OMS_great_trial.31.a:0 "屈尊拯救这求告的灵魂。"
 OMS_great_trial.33.t:0 "解放伏尔加格勒"
 OMS_great_trial.33.desc:0 "能让两军交锋的唯一纪念，只剩一地焦黑残尸的，只有那种浸入骨髓的恨意。这样的场面，世所罕见。从黑色联盟军队骨血中迸发出的饿狼般的敌意，驱使着他们疯狂轰炸伏尔加格勒。炮火之下，不分敌我，没有目标，唯一的追求，便是尽可能快地堆砌起尸山血海。\n\n俄军在城镇广场举行了小规模的胜利阅兵，然而迎接他们的，却是一片死寂，连鼠雀也未曾为之欢呼。城中居民在恐惧与不安中死守家门。士兵们一度想把枪口对准平民，但将军们决定，今天不再浪费子弹。毕竟，征途尚远，兵锋直指日耳曼尼亚。黑色联盟的弹药，可不能随意挥霍。\n\n俄军正厉兵秣马，准备再次挺进。与此同时，德军的无线电通讯骤然喧嚣起来，充斥着官兵们惊慌失措的呼喊——他们正被黑色军团追杀得亡命奔逃，口中不断诉说着刚刚亲历的、炼狱般的恐怖景象。乌克兰和高加索发来的外交电报，雪片般飞向新柏林的各个频道，急切的警报信号，几乎要让接收信息的机器当场炸裂。\n\n当全世界的目光都聚焦在这场战争之上时，一种令人毛骨悚然的恐惧，也悄然笼罩了整个世界。所有关注战局的人们心中，一个念头悄然滋生，并如席卷东欧的钢铁洪流般汹涌翻腾。也许…也许这会是最后一场战争。于德国，于俄国，于整个世界而言。"
 OMS_great_trial.33.a:0 "黑旗之下，绝无仁慈。"
 OMS_great_trial.34.t:0 "尘归尘"
 OMS_great_trial.34.desc:0 "火焰熊熊燃烧，投下异样却令人慰藉的余晖。列昂尼德·佩斯特列夫望着此景，心中涌起一股奇异的惊叹之情。一座城市，烧起来竟是这般轻而易举。尤其是阿道夫斯堡这种藏污纳垢之地。\n\n他看着那些囚徒，他们身着国防军破旧的灰色军服，如同蹒跚的刍狗，被押向一座大厅——那是市政厅的残骸。同志们将这群人渣赶进大厅，胆敢反抗的，便是一记枪托砸脸，随后也被一并扔了进去。\n\n待最后一个囚徒被塞进去，列昂尼德掏出先前备好的燃烧瓶，周围的同志们也纷纷效仿。他点燃引信，奋力将燃烧瓶掷向大楼。干燥的木料迅速引燃。他能听见厅内那群污秽之徒绝望的哀嚎。那大厅竟比看起来坚固得多，任凭里面那群天谴之人如何拼命冲撞，也未曾倒塌。\n\n很快，尖叫声平息了，空气中弥漫开一股令人作呕的焦肉气味。列昂尼德无动于衷地注视着火焰愈烧愈旺，火舌不断向上飞窜，仿佛想要挣脱束缚，升入高天。数分钟漫长的等待后，火焰终于熄灭，灰烬如残破的灰色雪片般缓缓飘落。\n\n列昂尼德回忆起久远的往昔，那时他曾有过家庭。那段时光很美好，却已烟消云散。他记得，那些身着灰色制服的男人来到他村庄的那一天。他记得，母亲和妹妹被带走时那绝望的哭喊。他记得，当他藏身于燃烧的房屋地板之下时，那熟悉到令人作呕的焦糊气味。他都记得。\n\n他看见一只手臂在尸堆中抽搐，便拨开烧焦的尸体。一个年轻人露了出来，不过十八岁上下，他那双湛蓝的眸子里写满了恐惧。\n\n“求——求求你，不要了，同志，不，不——！”\n\n列昂尼德将刺刀捅穿了他的脑袋，动作几乎不费吹灰之力。他看着那具身体彻底静止下来。倘若当初他没有那么幸运，能从那群贪婪的纳粹人渣手中逃脱，这或许本该是他的下场。他望向燃烧的城市，为其崩塌毁灭的景象深深着迷。"
 OMS_great_trial.34.a:0 "尘归尘，土归土，万事皆虚无。"
 OMS_great_trial.35.t:0 "惊醒"
 OMS_great_trial.35.desc:0 "戈特哈德在头顶震耳欲聋的轰炸声中惊醒。\n\n爆炸冲击波将他掀下床铺，迫使他不顾一切冲出屋外。当看见轰炸机呼啸掠过天际时，那些陈年记忆突然翻滚而来——二十年前，正是他驾驶着钢铁雄鹰如死神般划过东方诸城的穹顶。可如今垂暮之躯早不复当年勇悍，那些在驾驶舱里操纵生死的权力早已随岁月消散殆尽。\n\n接连不断的高爆炸弹将德国人聚居区照得亮如白昼，教堂尖顶与市集摊位相继燃起冲天火柱。民众如潮水般涌向防空洞的喧嚣惊破了他的恍惚，而机枪扫射时洒落的弹雨正将奔逃的人群变成抽搐的血葫芦。戈特哈德踉跄奔向医院方向，红十字标志总该让那些刽子手有所顾忌。\n\n但来自医院方向的惊天爆响瞬间颠覆了认知。冲击波将他狠狠掼倒在街头飞溅的玻璃雨中，整栋建筑如同慢镜头般在他眼前剥落坍塌，腾起的尘埃浓得化不开。直到昏迷前最后几秒，这位老人始终没察觉自己下半身已嵌满碎玻璃碴。\n\n再次苏醒时痛感依旧啃噬着每寸皮肤，却有张秀丽面容正在枕畔忙碌。温柔的妇人执壶斟了杯热气氤氲的饮品，他才发现周遭躺满了担架伤员。“看来您还有使不完的力气呢”，见他紧握茶杯的指节发白，年轻的护理员抿嘴轻笑。当暖流滑过喉间，那些刺痛竟奇迹般融进了茶香里。"
 OMS_great_trial.35.a:0 "又一枚炸弹终结了这一切。"
 OMS_great_trial.36.t:0 "喋血莫斯科"
 OMS_great_trial.36.desc:0 "戈特哈德再度惊醒时，发现手里正紧攥着一把沾染油污的厨房刀——当黑色联盟攻入莫斯科时，一切对他而言都成了模糊的梦魇。他躺在断垣残壁间，意识到必须潜入下水管网。若此刻犹豫，必会遭人捕获，极可能被当场处决。短短数日的活动自由中，他已目睹了太多。\n\n德国人居住区在劫掠中沦陷，男人们被硬生生拽离家人、圈禁起来。随后总伴随着机枪震耳欲聋的扫射声。但随着占领持续，德军能对联盟发起反攻的希望早已破灭。\n\n决心赌上运气的他，短暂离开了废墟提供的庇护所，冲向暴露部分下水管道的弹坑。当他蜷缩着爬进充斥着秽物淤泥的排水管时，占领初期的其他记忆纷至沓来。那些被士兵们满腹牢骚地与母亲们一同枪决的孩童影像，至今令戈特哈德不寒而栗。\n\n没错，他确实轰炸过城镇，必然也造成过伤亡，但眼前这般场景对他来说截然不同。当他在布满血迹与秽物的管道中爬行时，一道光线划过面庞。俄国人的吼叫声瞬间灌满管道——他被勒令立即爬出来。"
 OMS_great_trial.36.a:0 "他的运气用完了。"
 OMS_great_trial.37.t:0 "绞刑第二日"
 OMS_great_trial.37.desc:0 "戈特哈德排在这支队伍中，不似他的德国同胞们在国家紧急状态下面包紧缺时的等候队列——戈特哈德正和看不到头的德国男人们一起排队等待绞刑。一名黑色联盟的干部用他听不懂的俄语高谈阔论着。无论那人在说什么，言语间确实蕴含着某种激烈的情感。\n\n绞索杆又一次落下，更多生命被悬吊而起。\n\n戈特哈德环顾四周，难道所有人都要袖手旁观吗？当然零星有人欢呼雀跃地鼓掌，但多数人只是穿行在莫斯科被炸毁的街道上。他前面的男人突然侧过头说：“喂，我要逃了，一起吗？”\n\n绞索杆再度落下，又一批人悬挂半空。\n\n“开什么玩笑，我们肯定会被打死。”戈特哈德直白回应。“横竖都是死，我宁可按自己的方式来。”话音未落，那人猛然向右狂奔，顷刻间就被机枪弹雨笼罩。子弹将逃犯的身躯打得千疮百孔，未及坠地已然毙命。\n\n绞索杆完成了又一次的死亡降调。\n\n轮到他走向绞刑架了。他踩着临时搭建的台阶上前，最后环视周遭。最终他仰望苍穹，想看看神圣命运是否会对如他这般的人生出悲悯，是否会降下奇迹救赎。"
 OMS_great_trial.37.a:0 "奇迹最终没有降临。"
 OMS_great_trial.38.t:0 "轻雾将至…"
 OMS_great_trial.38.desc:0 "清晨，雾气如蝶蛹般笼罩着科尼斯堡。只有那些在日出前醒来的居民才目睹了这诡异又震撼的景象——当雾气翻腾着笼罩整座城市后，朝阳突然爬上地平线，锐利的光束刺破雾气，犹如神迹一般。\n\n但始终笼罩城市久久不散的雾气又生出一份怪异。就像是古老的预言在警示人们恶意即将降临。无人能逃离这危险的恶意。前线明明在数百公里之外，这份恐惧究竟从何而来？无论居民，无论驻军，都没有注意到自然母亲恐惧的呼喊。\n\n正午时分，雾气终于消散，城市重回喧嚣，就像阳光照耀下的往常一样。科尼斯堡似乎又迎来了平凡的一天，人们穿梭在街巷中无忧无虑的继续着日常——当然，除了对远方战争的担心。\n\n日落时分，一队卡车沿公路西行进城。他们看着就像普通的补给车队，将在卸货后重回东线，不过只是战争机器中的一个小小齿轮罢了。但他们进城后却分散开停在奇怪的地方：学校门口，政府大楼旁，军事基地边，甚至在居民区里。即使如此，没人问这些司机是来干嘛的。当夜幕降临后，无数橙色火光在城中燃起，又迅速熄灭。\n\n当真相显现，不知从何而来的新的薄雾又一次笼罩在城市上空。这雾气绝非天赐，而是人为的，恶意之雾。"
 OMS_great_trial.38.a:0 "有点儿不对劲。"
 OMS_great_trial.39.t:0 "……并带来金属的味道"
 OMS_great_trial.39.desc:0 "在短短数小时之内，整座柯尼斯堡化作废墟。只有一片荒芜。从城市的一端到另一端，生灵草木都失去了呼吸，只剩下了寂静那了无灵魂的空虚。随着浓雾隐约地笼罩在城市上空，就连上帝和大自然都静默无声。\n\n不久之后，覆上铅板，装载一车又一车身着防护服和防毒面具士兵的卡车疾驶进了看似已被遗弃的城区。随着卡车接近城门，成百上千的松鼠，鸟，鹿，猫，狗，人–一切上帝的造物都似乎同时失去了生命，一动不动地躺在地上。\n\n当士兵深入市中心，他们终于看到了最骇人的画面。男人，女人，儿童，都如同从天上掉下来的破布玩偶一般，散落各处。有些人扼着自己的喉咙死去，有些人抱着自己心爱的人。大部分则是独自一人死去。不过他们生前的命运是相同的：难以想象痛苦的辐射灼伤。\n\n随着士兵们开始记录这座古城的完全毁灭，有一个–只有一个–问题，时刻萦绕在在场每个人的心中"
 OMS_great_trial.39.a:0 "人类行了何等的大事！"
 OMS_great_trial.40.t:0 "地底的虚无"
 OMS_great_trial.40.desc:0 "阿尔乔姆疲惫地扫视着四周。给这些地堡当守卫可不是件轻松的差事，尤其是那些紧邻前线的。各种破事层出不穷，比如总有人想偷光所有食物——即便他们自己明明不缺吃穿。阿尔乔姆不喜欢开枪，尤其当枪口对准的是俄罗斯同胞时。他曾试着说服自己，把那些人当成德国间谍，但每一次，在夺走一条鲜活生命的瞬间，他都会迟疑。为此，他甚至还被降了职。很显然，他终究没有黑色联盟普通士兵那般铁石心肠，这一点，他自己心知肚明。\n\n有时，他站在地堡外，看着里面的人进进出出，心中便会揣测地堡里究竟是何光景。或许是在囤积粮食？又或是在进行最后的收尾？尽管他对联盟的行事方式已略感幻灭，但对地底深处的遐想，仍能给他带来一丝慰藉。就在一个普通的日子里，这股好奇心终于战胜了理智，他决定进去一探究竟。\n\n他借口“检查有无异常”，跟着工人们走了进去，眼前的景象却让他无比错愕。这地堡也太小了。宣传里明明说，地堡是宏伟的混凝土迷宫，可这里…这里看着连一千人都塞不下。“黑色联盟…亚佐夫…他们会这么干？”阿尔乔姆心头一沉。“不，不，一定只是我没走到头，再往里走就会有了。”他这样对自己说，于是便继续向设施深处走去。然而，越往里走，看到的景象越是粗糙不堪，处处都是未完工的痕迹。他心想，战争不出一个月就要爆发了，这地堡根本不可能建成。\n\n怀着沉重的心情，他走出地堡，回到了自己的哨位上。他右边那个卫兵开口了：\n\n“怎么样？里面瞅着不赖吧？足够咱们在里头舒舒服服地看着那帮德国佬在外面烂成灰了，对吧？”\n\n那卫兵看上去顶多十七岁。上帝啊，阿尔乔姆想，他们已经开始征召这么年轻的孩子了。他沉默了片刻，才答道："
 OMS_great_trial.40.a:0 "“是啊，和画上看到的一模一样。”"
 OMS_great_trial.41.t:0 "暴乱"
 OMS_great_trial.41.desc:0 "这场战争已经持续了天晓得多久。尽管俄国的新闻里连篇累牍地报道着俄军的胜利，但阿尔乔姆心里清楚，这一切都毫无意义。然而，当人们开始蜂拥着冲向那些狭小的公共避难所时，他那点愤世嫉俗的念头便被抛到了九霄云外。他所驻守的A-1684号地堡，恰恰就是少数几个倒霉的目标之一。或许，只要他能向抗议者们好好解释，告诉他们所有人都有机会进地堡——只要他能说出这个谎言，或许他内心某个更愚蠢的部分，就能真的相信自己所做的一切并非徒劳。\n\n然而，当一个女人和她年幼的孩子出现在人群中时，他所有的心理建设都轰然崩塌了。那孩子可能还不到十岁。这群人本就乱作一团，大部分是些上了年纪的人，夹杂着几个不愿参军、满脸不情愿的半大孩子。\n\n“长官，求求您，我叫阿廖娜…只求您带上我的孩子。”\n\n她抱起自己的孩子。在那一瞬间，周遭所有的尖叫与喧嚣都褪去了。有那么一次，他的人生中出现了真正的选择。他可以带走那个小男孩，像养育一个新生命那样将他抚养成人；又或者，像对待那里所有的人一样，将母子俩拒之门外，让他们徒步走回那个自打被鄂木斯克控制以来就没怎么变过样的小村庄。\n\n然而，他做决定的时间已经用完了。增援部队包围了这小撮人群。驻地指挥官早就通过无线电向前线附近的支队求援，而他们来得飞快。很快，枪声响了。就像曾经的统一战争那样，俄罗斯人又一次在屠杀俄罗斯人。当人群迅速散去时，他看到那个叫阿廖娜的年轻女人躺在草地上，身下是不断扩大的血泊。她的儿子拽着她的衣服，放声大哭。阿尔乔姆只是木然地看着。那孩子被人拎了起来，塞进了退去的人流里。\n\n“他妈的一帮蠢货，为什么就是不肯相信军队？”冲上来的先头部队里，一个士兵骂骂咧咧地说道，“我说，咱们可是在解放俄罗斯，这帮自由派倒好，竟想着躲进地堡里？纯属扯淡，我说的对吧？”那士兵扭头对阿尔乔姆说。"
 OMS_great_trial.41.a:0 "“是啊…我想，是吧。”"
 OMS_great_trial.42.t:0 "终曲"
 OMS_great_trial.42.desc:0 "这是阿尔乔姆的休息日——在他为黑色联盟卖命的生活里，一份简单却奢侈的慰藉。当他走在主干道上时，路人们投来的目光让他很不自在。自从那场被私下里称为“血色午后”的事件后，士兵们都尽量避免进城。他从报摊上买了份报纸，付了钱，然后坐了下来。像往常一样，他展开报纸，目光落在了头版标题上。那一行用粗大醒目的黑体字宣告着：“柯尼斯堡已被攻克”。\n看到这行字，他知道，那不可避免的时刻，终于近了。尽管在新兵训练时，教官们早已对他们反复灌输过这一切，但他仍无法想象它竟会发生得如此之快。\n\n他知道，他的世界即将终结。可身边的人们似乎还懵然不觉。当然，用不了多久，那些足够机敏的市民就会替他们想明白这意味着什么。他从椅子上弹了起来，穿着他那身全套军装，开始朝他曾经守卫过的地堡狂奔而去。他曾穿着这身军装在买东西时享受折扣，或许这一次，它能救他一命。无数个念头在他脑海中翻腾。他想起了第一次见到那座地堡时的情景——它还在继续施工吗？或者，那里面其实空无一物？又或许，德国会为了全世界的福祉，接受它应有的结局？缔结一份简单的和平，承认俄罗斯的霸权——这个想法固然天真，却也比坐视整个人类文明走向终结要好得多。\n\n当阿尔乔姆跑到地堡附近时，他发现周遭陷入了一种诡异的死寂，只有地堡本身正传出工业设备运转的嗡鸣。这声音竟让他感到一丝平静，甚至有些许慰藉。风吹过他的头发，可当他离入口越来越近时，他的心却直直地沉了下去。那扇大门紧紧地闭合着。为了联系上里面的人，他起初只是敲了敲冰冷的金属大门，换来的却只有空洞的回响。紧接着，尖锐的紧急警报开始长鸣，那刺耳的噪音交响彻底撕碎了寂静，取而代之的是纯粹的恐惧与惊惶。阿尔乔姆颓然地坐在门边，脑海中又浮现出那个想把孩子托付给他的女人。他不知道那孩子现在怎么样了。“我只希望他平安无事，”他心想。一道炫目的白光在他眼前炸开。最后一个念头划过他的脑海。"
 OMS_great_trial.42.a:0 "我真希望，我能亲口对她说声抱歉。"
 OMS_great_trial.43.t:0 "奥列格的时间不多了"
 OMS_great_trial.43.desc:0 "他的工作简单明了，就是在黑山找到化学武器，用来对付德国人。单从概念上讲，这是个简单的任务——对一个国家发动这样的化学攻击，其规模堪比第一次世界大战，只不过这次集中在一个帝国之内。这将是“大审判”的第一记重拳，足以媲美纳粹企图征服俄罗斯时使用的“闪电战”。\n\n他盯着地图，略带惊异地思索着这座城市的哪个区域会遭受最严重的打击。脑海中闪过条顿渣滓们自己溶解的肺脏慢慢窒息的样子。毒气渗透到街道和建筑的每个角落，像恶性的黏液一样渗过面具和破布。\n\n看着用密码写成的简易操作手册，他很快破译了接下来的指令。完成最后的调试后，奥列格娴熟地输入代码、缠好电线，并拧动手表发条，确保当时针指向正午时分，装置就会引爆。他将设备装入公文包，放在铺着单薄毯子的行军床旁，床垫弹簧因年久生锈，摸起来粗糙刺手。\n\n这间租来的月租房里，行军床简陋得近乎斯巴达式。四处散落着传单——联盟的宣传品、意识形态的狗哨讯息和食品包装纸。这些都是联盟通过邮包寄给他的补给。但这个消瘦的男人吃得很少，只摄入维持健康必需的食物。他拒绝像德国渣滓那样放纵口腹之欲。"
 OMS_great_trial.43.a:0 "他睡得很香。"
 OMS_great_trial.44.t:0 "澄黄之城"
 OMS_great_trial.44.desc:0 "克拉拉清晨五点半便醒了——对多数人算早，对她而言却是常态。她的晨间流程向来简单：吃片涂着薄黄油与果酱的吐司，做完当日计划便开着那辆大众车踏上通勤路。摇下车窗时，微风轻拂脸颊，连空气都带着雀跃的气息。\n\n将甲壳虫停进学校车位后，她穿过厚重的玻璃门走入教学楼。途经一间间教室时瞥了眼腕表，7:13的指针刚划过，她便迈进自己的教室。\n\n推开门那刻，由她和孩子们共同装饰的教室又一次让她会心一笑——满墙钉着的稚嫩画作与旧作业纸使整个空间充满生气，半开的窗缝间漏进一线晨光。深呼吸着新鲜空气，她端坐在办公桌前。\n\n不一会儿孩子们就开始陆续涌进来。\n\n刺耳铃声的余韵刚散，教室便归于安静。克拉拉正用干脆响亮的嗓音说着“同学们，我们今——”，外部世界突然传来震耳欲聋的爆响，冲击波撼动了每个人的神经。克拉拉整个人从椅子上被掀翻在地，等她爬起来时，欣慰地发现所有孩子都蜷在课桌下，一双双小手护着小脑袋——除了某个孩子胳膊上粘着碎玻璃，总体安然无恙。\n\n她用发颤的声音安抚孩子们会没事的，表示要去查看情况。年轻女教师紧张地探出门外张望：俄国人总不可能入侵得这么快吧？忐忑间她走到已化作满地玻璃残骸的入口大门前。鞋底碾过碎碴的咔嚓声，激得她脊椎发凉。\n\n环视四周时，毗邻的公寓楼正腾起浓烟。可当她紧盯建筑，却看到半空飘着诡异的彩色雾霭——一团浓稠的黄色气体正从楼体破洞中持续喷涌。父亲讲述的一战经历瞬间闪回脑海。而现在，某种难以名状的恶臭正钻进她的鼻腔。"
 OMS_great_trial.44.a:0 "她猛烈地咳嗽起来。"
 OMS_great_stall.1.t:0 "一只疲倦的野兽……"
 OMS_great_stall.1.desc:0 "季莫费和阿列克谢已经疲惫到了极点，光是今天他们就行军了十英里，可这苦差事却没个头。“最高指挥部发来了新命令，”阿列克谢的电台发出滋滋啦啦的声响，两人都凑上前去，紧张地听着。“前方低地有德军阵地，第三排将沿公路一侧前进，支援摩托化部队。完毕。”\n\n“我真不敢信，”年轻些的季莫费痛苦地喃喃道，“我们已经一天半没吃没睡了！德国佬的伏击、反攻、狙击手就没停过，现在他们还要我们跟没事人一样继续前进？！我们就只是被操练、被克扣、被当成牲口使唤，最后再被填进炮膛里的统计数据吗？”他愤愤不平地抱怨着。\n\n阿列克谢静静地听完，才开了口。“在前线，出点‘意外’是常有的事，”年长的士兵指点道，“要是手，或者脚，受了伤，是不会有人多问的。”他的语气平淡如水，双眼却牢牢锁住季莫费，“他们总不能指望把我们往死里饿、往死里熬好几个星期，还不发生几起‘意外’吧，嗯？”\n\n季莫费迎上他的目光。“当然了，伤兵总是需要食物和休息才能好起来的，”他若有所思地说道，“要不要赌一把，这附近很快就会有很多‘意外’发生？”\n\n“这话是你自己说的，”阿列克谢答道，“我们不是牲口，不会任由他们像驱赶畜群一样把我们赶过这片草原。见鬼，畜群的待遇可能都比我们好。但除非情况有所改变，否则我们只会看到更多的人崩溃，甚至更糟。”"
 OMS_great_stall.1.a:0 "仇恨只会带来苦难。"
 OMS_great_stall.2.t:0 "……以及令人不安的现实"
 OMS_great_stall.2.desc:0 "门开了，室内的空气仿佛瞬间被抽空。叶夫根尼几乎没听见门卫通传他觐见的声音——“觐见”这词未免太体面，实则是传唤。\n他站起身，强压下翻涌的恶心感。一步，又一步，最终挺直腰板迈开步伐。无论等待他的是何种命运，他绝不会以懦弱相迎。每扇开启的门都像是通往新世界的入口，厅堂的奢华程度层层递进，连廊道都在辐射状延伸中愈发恢弘。尽头是某种王厅般的存在——亚佐夫执意要将办公室设在建筑轴心。这地方与其说是工作场所，不如说是他偏执心理催生的地堡。皮特拉诺夫看见亚佐夫像头困狼般在巨大的壁炉旁踱步，炉火投下的阴影足以笼罩整个房间。他艰难地咽了咽唾沫。\n：“元帅同志。关于联盟经济状况与攻势停滞的报告，我已按您的要求完成了。”他将双手紧贴在背后，指望这种恭敬姿态能救自己一命。亚佐夫仍在踱步，只用手势示意他继续。“恐怕我已查明了大停滞的根源：经济枯竭。货币流通几近停滞，民众囤积剩余物资。紧缩政策的反噬比预期来得更快更猛。若继续维持军备开支……”\n皮特拉诺夫的嘴唇不受控制地颤抖起来——亚佐夫终于转身面对他。那张脸上刻满疲惫，比身后晃动的阴影更加晦暗。血丝密布的眼睛扫过他，随即打了个手势——防爆门在皮特拉诺夫身后轰然闭合。\n"
 OMS_great_stall.2.a:0 "那是谁的错？"
 OMS_great_stall.3.t:0 "井水干涸"
 OMS_great_stall.3.desc:0 "佩特罗诺夫翻看着征兵站里堆积如山的档案——那些姓名、图表和数据表格，全都整理得一丝不苟。他的征兵站设立在萨马拉无数预制板房社区中的一个。今天异常安静，这绝对不正常。他点燃一支烟，试图平复心情，毕竟两周后的分区征兵官例会上，来自上级的斥责肯定逃不掉。但当他继续翻看这些数据时，一种趋势逐渐显现，问题严重到让他忍不住又点了一支烟。\n\n征兵人数在下滑，而且不像以往只是暂时的波动。一张张图表、一份份数据都显示出一条无法忽视的下降曲线——斜率越来越陡，唯一的区别只是每天踏入黑色联盟征兵处、准备献出生命的年轻人又少了多少。曾几何时，他的征兵中心一天能接收两千多名新兵，而现在，每周能招到几百人都算走运。佩特罗诺夫的手和嘴唇开始发抖，眼睛左右乱转，额头渗出冷汗。他冲向电话，打给城里的一个同事。他本不想让那个得意洋洋的混蛋看到自己的狼狈，但他必须确认一下。\n\n电话那头的德米特里声音一如既往地沙哑，即使夹杂着电流杂音。几句勉强客套的寒暄后，他直奔主题。\n\n“德米特里，征兵到底出什么事了？我这边几乎没人报名。你那也一样吗？”电话那头沉默了一阵，德米特里才谨慎地回答：\n\n“你也遇到这问题了？”"
 OMS_great_stall.3.a:0 "“看样子，我们已经无人可招了。”"
 OMS_great_stall.4.t:0 "引擎轰鸣"
 OMS_great_stall.4.desc:0 "文官骨子里透着懦弱。无论是在军情部门最隐秘的部门工作，还是在远离前线的办公室当差，这种根深蒂固的懦弱始终如影随形。那是一种对上报失败的本能抗拒。至少在黑色联盟里，这种恐惧还算情有可原——过量的失败会招致刑罚。但如今，这种风气渗透蔓延，对政府和机构的腐蚀程度远甚于日耳曼情报网的破坏行动。\n\n当财政部的官员在年度预算中虚报盈余时，这种顽疾便显露无遗；当情报官怯于上报本不该存在的敌军新编制时，这种顽疾便昭然若揭；当宣传干事不敢承认每日征兵人数持续递减时，这种懦弱便暴露无遗。这些谎言如同不断冲击堤坝的积水，每一滴渗过腐朽混凝土的浊流，都在加剧着摇摇欲坠的基石的崩塌。\n\n随着外交官隐瞒盟国援助日益枯竭的实情，卫生部官僚谎报医院收治能力——即便他们早已放弃救治代价过高的伤员——支撑战争机器的堤坝已然危如累卵。现在，当德军从持续猛攻中恢复元气并开始反扑，这座千疮百孔的堤坝正悬于崩溃边缘。只需一次恰到好处的打击，整个腐朽的体制便会土崩瓦解。"
 OMS_great_stall.4.a:0 "这种腐蚀比任何霉变都更加深入骨髓。"
 OMS_great_stall.5.t:0 "引擎停止"
 OMS_great_stall.5.desc:0 "骑兵巡逻队早在数公里外就望见了地平线上的浓烟。当他们接近车队残骸时，只见道路与田野上散落着扭曲变形的金属残片，其中不少仍在燃烧，扭曲的轮廓诉说着此处曾经历何等惨烈的战斗。步枪残骸、食物、备用零件和其他各种军用物资混杂其中，几乎全被烧毁或损毁得无法使用。草地焦黑一片，支离破碎的尸体——或者说勉强能辨认出是尸体的残骸——散落其间。\n\n马克西姆只是捏住鼻子，示意手下下马向损毁的卡车走去。他们刚从前线轮换下来，但这并没带来什么好处。德国空军想炸谁就炸谁，想炸什么就炸什么，哪怕躲在后方也没用。他的胃突然绞痛，疼得他弓起了身子——轮换也不意味着口粮改善，指挥部声称这些物资要留给“真正在战斗”的士兵。他打手势让手下加快脚步，自己走向一辆被炸毁的卡车。这次行动未经上级批准，不过既然现场估计没有活口，自然无人会追究。\n\n卡车货板上没什么有价值的东西。损坏的弹药和碎肉块散落在裂开的木板和破烂的帆布篷上。接下来检查的几辆卡车也一无所获没。突然，一个士兵喊了起来。马克西姆朝他跑去。他的中士高举着一个板条箱，里面装满了从烧毁卡车里搜刮来的生土豆。马克西姆立即下令把箱子绑在一匹马背上。今晚他们能吃顿好的了，虽然也撑不了多久。折返途中，他发现残骸中似乎有个幸存者——个不超过18岁的骑兵。他的脸几乎烧得无法辨认，头发都烧焦粘在皮肤上。他虚弱地伸出手，嘶哑地说着什么，声音就像透过破纸袋发出来的。"
 OMS_great_stall.5.a:0 "马克西姆没有理会他。他们已经得到了想要的东西。"
 OMS_great_stall.6.t:0 "真正的信徒"
 OMS_great_stall.6.desc:0 "彼得在搅拌车倾泻的瞬间飞身闪到了一边，混凝土灌入他在冻土中挖出的深坑：这是另一座碉堡的地基。八周来，他在这乌拉尔山脉的荒僻之地修建堡垒，只为在风暴来临前为同胞筑起屏障。刺骨的严寒与微薄的配给足以令常人怨声载道甚至临阵脱逃，但彼得不同。他坚信他们终将粉碎条顿威胁。他相信俄罗斯，相信亚佐夫。这信念驱使他疯狂工作，和几位同样充满信心的工友，在这远离文明的蛮荒之地，以远超其他工程队的速度修建了一座又一座堡垒。\n\n迄今为止，他们并未得到官方的嘉奖，但彼得毫不在意。他的家人都被条顿人杀害了，还不是同时——那倒成了一种幸运了——而是一个接一个地死去。他依稀记得，他的父母死在“巴巴罗萨”中，被纳粹行刑队处决；将他从父母身边解救出来的兄长，死在西俄罗斯战争；妻儿则在维亚特卡的住所里，死于德国空军一次该死的轰炸。历经条顿人数十年的折磨后，彼得在冻土坑一砖一瓦地砌着，一个又一个冰窟窿地凿着，唯剩一个执念驱策着他：\n\n复仇......"
 OMS_great_stall.6.a:0 "无论代价如何……"
 OMS_great_stall.7.t:0 "未经雕琢的钻石"
 OMS_great_stall.7.desc:0 "“艾森咬紧牙关，奋力铲开冻得硬邦邦的泥土。远处回荡的枪声时刻提醒着他，稍有懈怠便是灭顶之灾。他每次停歇一小会儿，就又把铲子插进土里，只有这样才能隔绝周遭的声音。\n\n自从混蛋亚佐夫和他的黑衣军团闯入祖国后，他和他的雅库特同胞便永陷矿坑之中。他与曾经的同胞勉强维持着和平，但很快变成了一场暴力镇压，因为雅库特的所有劳力都在枪口威逼下为“光复俄国”服劳役。\n\n‘无论代价多大，无论牺牲多小’，监工们日日重复着口号，坐享矿工血汗成果。\n\n若在年少气盛时，艾森定会反抗黑色联盟的暴政。如今这些想法被抛在一边，取而代之的是他的雅库特同胞、他的朋友和家人被工地警卫殴打致死的记忆。连被灌输仇恨的孩童都会踹击矿工膝盖，用教官的话说，这是“惩罚他们未尽爱国天职”。\n\n于是艾森继续铲雪，铲过麻木的日常，铲过肆虐的暴风雪，铲过晴空烈日，铲过刺骨寒冬又铲来闷热酷暑。也许，他所有的辛苦劳动终有一天会有所回报。”"
 OMS_great_stall.7.a:0 "天堂中会有轮班吗？"
 OMS_great_stall.8.t:0 "滔天怒火"
 OMS_great_stall.8.desc:0 "亚佐夫紧急召开了内阁会议，他对战局未能朝对俄罗斯有利的方向推进感到焦躁。不能再这样了，必须有人作出解释。众人落座时，会议室死寂无声。“先生们，”亚佐夫终于开口，“战线陷入僵局，攻势全面停滞。战争资源仿佛被投入了无底洞。”他身体前倾，冰冷的目光扫过内阁成员：“我需要知道原因。”\n\n在座的人都紧张地交换着眼神。有人焦虑地拽着衣领，有人不安地扭动身体、偷瞥同僚，都指望别人先开口。所幸皮托夫拉诺夫鼓起勇气提出见解。“是德国空军，”他强作镇定地解释，“我军试图推进的阵地正遭受猛烈轰炸。此外征召的新兵普遍厌战，缺乏作战意愿。”\n\n漫长的沉寂后，亚佐夫下达指令：“立即加倍生产防空装备，确保战机集中部署于交战区。至于新兵问题，我希望你们安排新兵接受适当的教育，确保他们的政治素养与军事技能都能达标。”他的命令被迅速地记录了下来。他最后补了一句：“您最好是对的，皮托夫拉诺夫。若不见效，您要负全部责任。”"
 OMS_great_stall.8.a:0 "达摩克利斯之剑高悬。"
 OMS_great_stall.9.t: "召集总参谋部"
 OMS_great_stall.9.desc: "迪米特里·亚佐夫自认为是个有耐心的人，但即便是圣人的耐心也终有耗尽之时——尤其是在面对接二连三的失败时。放眼望去，战局似乎处处都在倒退。这次总参谋部会议将帮他揪出造成这种局面的具体人员和原因，以便采取相应处置。他不会接受任何借口，也不会容忍软弱的辩解。\n\n当参谋们围坐在会议桌前时，推诿之辞已如潮水般涌来。“我们根本没有足够的补给和冬季装备！”一名军官从座位上探身喊道，“士兵们正在遭受冻伤，枪械都冻住了！”亚佐夫一时语塞。“德军根本不给我们喘息的机会，”另一人说道，“如果能有一天时间休整并组织反击，我们就能重新掌握主动权。”虽然这种惊慌语气让亚佐夫不悦，但此人的思路还算正确。\n\n会议就这样进行着，一份无形的生死名单随着前线溃败的理由逐渐成形。会议结束后，处决令将立即执行。或许被饶恕的人会心怀感激，从而提升他们的表现。死亡是最有力的激励，而亚佐夫定会让他们“干劲十足”。"
 OMS_great_stall.9.a: "枪口之下"
 OMS_great_stall.10.t: "必须做出改变"
 OMS_great_stall.10.desc: "在鄂木斯克市中心的广播电台，黑色联盟与全俄罗斯至高无上的领袖德米特里·亚佐夫正准备发表讲话。俄罗斯将从核心开始彻底改造与重建，无人能够置身事外。每个人都必须参与其中——世界的命运正处于紧要关头。他戴上耳机，将麦克风调整到最佳位置。在场的技术人员竖起拇指，示意直播信号已经接通。\n\n“俄罗斯的同胞们。工人、农民、士兵、妻子、孩子，无论你是谁。变革即将到来，本次广播正是为此宣告。工业和农业都将进行改革与调整，使其全力服务于战争。任何无助于战斗的物资，都不再生产或种植。教育也将改变——从启蒙阶段开始，孩子们就将了解敌人的罪行，学习如何将其从世上铲除。我们的学校将锻造出现成的战士，让他们深谙自己的使命。”\n\n他停顿片刻，啜饮了一口水杯。“此外，所有媒体——无论是书籍、广播还是其他形式——都必须强化我们的价值观、生活方式与斗争精神。任何反对或质疑的声音都不得传播。从顶层到底层，所有系统及其从业人员都将指向同一个目标：消灭俄罗斯的敌人，为我们的民族赢得未来。请大家据此做好准备。”"
 OMS_great_stall.10.a: "一支拥有国家的军队"
 OMS_great_stall.11.t: "民心所向"
 OMS_great_stall.11.desc: "一个世纪以来，我们的人民饱尝败绩。\n\n一次又一次，我们挺身而出，在泥泞中站稳脚跟。一次又一次，我们又被抛回屈辱的深渊。这样的错误，我们绝不再犯。\n\n必须重塑俄罗斯民众的精神意志，重拾那种令整个欧洲，乃至整个世界都为我们坚韧不拔的毅力而震慑的力量。正是这种对胜利的至高追求，驱使着普通俄罗斯人清早起来便奔赴前线；正是这种对最终胜利的信念，让工厂里的工人怀着愤懑与辛劳日夜劳作，直至成为至死方休的生产标兵。\n\n为确保这项伟业成功，我们必须启用最狂热的忠诚战士——由他们来统领那些看不清未来愿景的民众。唯有如此，我们的民族才能永葆彻底消灭条顿威胁的钢铁意志，一劳永逸地终结这场浩劫。"
 OMS_great_stall.11.a: "日耳曼尼亚必须毁灭。"
 OMS_great_stall.12.t: "野蛮与软弱"
 OMS_great_stall.12.desc: "我军正经历与民众相同的危机——前线指战员们被懦弱与恐惧侵蚀了心智。士兵们配备着国家最精良的武器，按照预先制定的周密计划行动，却始终无法真正挺进火线。\n\n此刻战士们最需要的，正是我们无畏的总司令所展现的炽热斗志。唯有将“胜利高于一切”的信念注入每个战士的灵魂，才是彻底消灭条顿恶犬的关键。\n\n我们将派遣最狂热的政委去播撒民族复仇之火。拒不从命者，就地枪决。我们再也无法容忍软弱，因为胜利——彻彻底底的胜利——是我们唯一的出路。若不能达成，便是对祖国的再度背叛。 "
 OMS_great_stall.12.a: "精诚所至，血肉为祭，皆奉于神圣之战。"
 OMS_great_stall.13.t: "用兵之道"
 OMS_great_stall.13.desc: "亚佐夫独自坐在办公室，失望与愤懑化作难以名状的郁结在他心头蔓延。胜利明明近在眼前——所有环节似乎都已就位，可参谋系统内部仍盘踞着少数冥顽不灵的异类。就像精密的仪器里掺进了砂砾，又似光学镜片上抹了层油脂。\n\n参谋部潜在麻烦分子的档案早已整理成册，这些人的忠诚度都值得怀疑。有个家伙制定的战略畏首畏尾，却固执地拒绝调整方案；另一个则对当前战略形势危言耸听，喋喋不休地要求延长期限、修改计划，宣称战局于我不利。这些绊脚石必须清除——何况还有那么多顺从的忠诚分子正等着取而代之。\n\n前者年事已高，只不过是个冥顽不灵的老顽固，许以丰厚的退休金便能打发。棘手的是第二个：这类自以为是的刺头最难对付，需要更隐蔽的手段。计划是趁其不备时安排枪手伏击，合适的替罪羊也已物色妥当——个身患绝症却尚有余力的癌症患者，一笔可观的安家费足以让他赴汤蹈火。"
 OMS_great_stall.13.a: "战争向来残酷。"
 OMS_great_stall.14.t: "联盟卫兵"
 OMS_great_stall.14.desc: "一种诡异的风气开始席卷新俄罗斯。政府高层最近批准的一项政策已下达，在民众中弥漫着某种期待的情绪。任何能向警方及上级机关提供有用信息的人，都将获得额外配给和丰厚奖金。若发现任何可疑的破坏行为、怠工或违抗命令之举，务必举报。看见就说，说了就查。\n\n人们很快磨利了刀子，捅向邻居和同事的后背。不够爱国、工作效率低下、对伟大的同志亚佐夫表现出冷漠——诸如此类的琐事都成了需要核查、评估并可能采取行动的理由。\n\n当首批奖励发放后，有些人自封为业余政委，高声宣扬对黑色联盟及其目标的忠诚，并要求周围人效仿。很快，家庭成员开始互相告发，亲情纽带因此断裂。偏执情绪逐渐蔓延，人们开始沉默寡言，唯恐只言片语被曲解成罪证。焦虑氛围笼罩着这个变异的社会，久久不散。"
 OMS_great_stall.14.a: "同室操戈？"
 OMS_great_stall.15.t: "偏执妄想"
 OMS_great_stall.15.desc: "彼得和弗拉基米尔分坐两侧，高台上的军事法官面容冷峻，旁观席上的观众们静静注视着这一切。两人都为自己的性命忧心忡忡。焦虑让他们头晕目眩，脑海中充斥着致命的迷雾。“你们二人被控怯战、渎职与违抗军令，”长者低沉地说道。“作何辩解？”他的语气严厉，仿佛早有决断。\n\n“我无罪！”两人异口同声地喊道。彼得尖锐地指着对方。“这些指控应该归咎于这个目光短浅的蠢货！”他争辩道，弗拉基米尔闻言明显退缩。“他犹豫不决贻误战机，害得我孤军难进！这白痴拒绝支援，我独力难支！”\n\n“这个骗子不愿告诉您的是，”弗拉基米尔回击道，“我部已深入前沿，却因这懦夫不掩护我的侧翼而进退两难！他宁肯让我孤军送死，而我却在冒险！”吼声在镶木厅堂里回荡。法官抬起一只手，制止了他。“我已经听够了，”他对这些激烈的言辞回应道。\n\n“如果你们中任何一人有勇气承担责任，我可能会考虑宽大处理。然而，你们现在像偷东西被抓的小学生一样互相指责和喊叫，这种不成熟的行为在总参谋部是不被接受的。你们俩都是累赘，都将被判处死刑。”两人在被法警拖走时仍在嚎叫不停。几分钟后，他们便不再争辩了。"
 OMS_great_stall.15.a: "早知今日何必当初。"
 OMS_great_stall.16.t: "一人成军"
 OMS_great_stall.16.desc: "萨温采夫奉命来到德米特里·亚佐夫的办公室。接到召见时，他刻意加快脚步以示忠诚——这一举动让他原先部队的战友们愕然，但亚佐夫的命令高于一切，无论是程序上还是道义上。他笔直地立正敬礼，直到亚佐夫示意他坐到对面。\n\n“萨温采夫同志。”这位大人物开口了，“麦收时总有些糟糠混在好麦穗里，除了碍事和助燃别无用处。”他的声音像砂纸般粗粝，“我想你明白我的意思。”萨温采夫迅速点头，这个比喻已像种子般在他脑中扎根。\n\n“首长！”他用令人不安的热切回应道，“近期晋升的参谋军官里...恐怕有些需要妥善处理的害群之马。”亚佐夫做了个赞许的微小手势。“正是如此。据我所知，某些人根本不配穿这身军装。”他忽然前倾身子，面孔如花岗岩般冷硬，“现在授予你全权查处他们的权力——绝不能再出纰漏。”\n\n当这句话的深意骤然明晰时，一阵刺骨的寒意顺着萨温采夫的脊椎蔓延。他霍然起身：“我将立即展开全面清查与肃整！绝不让懦夫再拖累我们！”陡然拔高的声调，掩饰了他内心闪过的战栗。"
 OMS_great_stall.16.a: "解散。"
 OMS_great_stall.17.t: "替罪羔羊"
 OMS_great_stall.17.desc: "愤怒与敌意的气息如雾霾般笼罩着彼尔姆市，而市中心最为浓重。当局精心策划的“宣泄庆典”即将开场——为避免黑色联盟沦为众矢之的，总得给沸腾的民怨找个可控的宣泄口。在军警驱赶下，一队被判定“畏敌怯战”的退伍士兵正以屈辱的姿势游街示众。\n\n围观群众接到指令高声辱骂，默许之下更投掷起硬物。每个游街者颈间都挂着“懦夫”等侮辱性标语，神情凄惨如丧考妣。当这支耻辱队列经过时，各种谩骂、秽语与诅咒汇成赤裸裸的仇恨洪流。\n\n有人被烂番茄击中太阳穴，腥臭浆液糊满半张脸；另一人迎面挨了泥块，痛呼声反而引得人群的喝彩。投掷物接二连三袭来，多人因此挂彩。\n\n即便行至街道尽头，折磨仍未终止。他们像待宰羔羊般被赶进装甲车，押往某座不具名的“拘留所”。泪水划过这些绝望的面孔，此刻他们正经历着人生的至暗时刻。"
 OMS_great_stall.17.a: "恨意几时休？"
 OMS_great_stall.18.t: "齿轮倒转"
 OMS_great_stall.18.desc: "一支阿尔法小组在瓦西里家正门悄然集结，静待行动信号。据情报显示，这名军官涉嫌利用职务之便，长期向后勤单位行贿获取额外补给，甚至暗中篡改账目虚报数量，将多余补给分配给自己及亲信。\n\n这种侵蚀内部的腐败行为已不容姑息。破门槌轰然撞开大门，突击队员冲进客厅时，发现目标正佯装镇定地阅读书籍。惊慌失措的瓦西里慌忙站起，将书本塞进毛毯下。队长维克托察觉异样，命人制服挣扎的军官后，拾起那本被藏匿的书册。\n\n翻开的内页密密麻麻记录着受贿人员名单、事由及金额。这本黑账簿记载的贿赂网络规模惊人，腐败程度触目惊心。维克托厌恶地抿紧下唇，无视瓦西里的哀求，直接拔出左轮当场执行枪决。尸体颓然倒地后，他收起账本下令：“彻底搜查，证据肯定不止这些。”队员们立即分散开来，开始对整栋房屋进行地毯式搜查。"
 OMS_great_stall.18.a: "勿使我们陷入诱惑。"
 OMS_great_stall.19.t: "观我威仪"
 OMS_great_stall.19.desc: "亚佐夫在大会议桌的首位就座，四周坐满了总参谋部将领与官员。这场会议旨在集思广益，商讨如何对抗可恨的德国人，以及清楚内部的懦弱分子。与会者低声交谈着，对各自方案进行最后调整。文件夹与纸张铺满桌面，每个人都在准备陈述自己的提案。\n\n一位军官率先起身汇报前线态势：：“截至目前，德军的反击已被遏制，我军推进速度仅受轻微影响。虽然补给与增援请求显著增加，但现有防线基本保持稳定。”亚佐夫点头示意，随即说到：“很好。现在听取各位的作战提案。”\n\n紧接着有人激昂陈词：“应当扩大燃烧武器的运用范围。”他拍着作战地图强调，“将火焰喷射器和燃烧弹配属给步兵与炮兵单位，能对堑壕敌军或密集阵型形成毁灭性打击。”赞同的低语声中，又有人起身发言。\n\n“大批工人正浪费人力在非必要产业上，比如民用消费品、装饰品等手工艺品。我建议将这些工厂转为军械车间，对工人实施转岗培训。每个人都必须为战争事业服务。”"
 OMS_great_stall.19.a: "全体一致通过。"
 OMS_great_stall.20.t: "浓雾散去"
 OMS_great_stall.20.desc: "德米特里·亚佐夫沉默不语。这是异常疲惫的一天，比往常更甚。近来他不得不亲自向下属下达越来越多的直接命令。尽管身心俱疲，这位总司令仍坚持以身作则——只要能让§R大审判§!取得成功，他愿意亲力亲为地推动黑色联盟各项事务的运转。虽然渴望稍作休憩，但他深知此刻不能停歇——与高级将领的会议即将开始，若没有领袖的指令，战争机器将陷入停滞。\n\n他面色阴沉地走进办公室。这个简朴的房间最显眼的设施，莫过于长桌上方悬挂的投影仪与环绕的座椅。亚佐夫扫视列席的将军们，抬手敬礼，将领们以整齐划一的军礼回应。“请坐”亚佐夫下令，众人应声落座。他清了清嗓子开口道：“我现在颁布新指令，立即生效。”满室肃静。“我军必须不计代价向前推进，违令者将问责其指挥官。”\n\n其中含义不言自明。短暂的沉默后，忠心耿耿的亚历山大·拉扎连科打破寂静：“您指的是不惜一切手段？”虽然在场众人都心知肚明，亚佐夫仍向他点头确认。\n\n“无论付出多少血与铁，部队必须前进。我们已被牵制太久，再这样下去将危及大审判本身。”将领们随着亚佐夫的话语频频颔首。“我不在乎你们是否要把士兵逼到绝路，唯一重要的是直插敌人心脏——我要看到战果。明白了吗？”\n\n将军们再次异口同声表示遵从。但所有人都心照不宣：若此次仍无法突破敌军防线，他们的时间就所剩无几了。"
 OMS_great_stall.20.a: "“前进，实现祖国对你们的期许。”"
 OMS_forpol.1.t:0 "仇恨之外"
 OMS_forpol.1.desc:0 "塔尔加特一生都生活在草原上，距离咸海仅有几公里。某天放牧时，他注意到一架古怪的飞机从万里无云的蓝天中投下传单。这些俄语印刷的小册子让他越读越感到反胃与困惑——纸上满是针对整个民族的仇恨与复仇宣言。\n\n他想起这些年形形色色的俄罗斯人：布尔什维克曾高喊着各民族平等，却崇拜着与他熟知的截然不同的安拉；后来政权崩塌，冒出各种政治团体、鞑靼商人和巴什基尔贩子。牧羊为生的塔尔加特向来对这类事兴致缺缺，但传单里离奇的指控却令他继续读了下去。\n\n文中重点指控德国间谍渗透哈萨克斯坦，甚至波及他所在的镇子。被点名的间谍名单里，有三人是他听过的寓言里的偷面包的人，还有两个是他在阿拉木图清真寺见过的礼拜者。最荒诞的是俄罗斯人宣称要在其势力范围内发动“反堕落战争”。读到末尾时，塔尔加特几乎脱口而出：“俄罗斯人和哈萨克人哪有资格去堕落？”\n\n传单上邮票般的亚佐夫肖像更让他发笑——这个被吹捧为圣君的统治者。俄罗斯人难道还没受够所谓的神明与帝王带来的世代血劫吗？至仁至慈的安拉为何要让这个民族世代沉溺在癫狂的嗜血欲望中？"
 OMS_forpol.1.a:0 "那些俄罗斯人在干什么？"
 OMS_forpol.2.t:0 "懒人不得安宁"
 OMS_forpol.2.desc:0 "突厥斯坦城的居民一直为1405年帖木儿赐予的礼物——霍贾陵墓——感到无比自豪。数百年来，这座未竟的帖木儿王朝建筑奇迹始终屹立不倒。几个世纪以来，它不仅是整个中亚朝圣的中心，更是哈萨克文化的瑰宝。\n\n如今这座建筑已被夷为平地，取而代之的是蛇腹形铁丝网构筑的警戒线。不久后，铁丝网内仓促搭起了简陋的木制营房，随后军车载着全副武装的士兵源源不断驶入。不安在平民中蔓延，整座城市弥漫着恐慌情绪。\n\n成千上万愤怒的哈萨克男女老幼涌上街头，致使突厥斯坦城瘫痪数小时。凌晨时分，俄军部队大规模进驻全市各战略要道。拂晓之际，命令下达，士兵们对激愤的人群发起了镇压。\n\n幸存的抗议者被刺瞎双眼、捆缚手脚押上卡车，送往“斯科别列夫营”的大门。未能登上卡车的人，则任由鲜血浸染泥土，曝尸荒野。\n\n营内的境况惨绝人寰。当人们发现营地竟建在昔日的圣地之上时，怒火再度燃起。一位当地的宣礼员号召众人集体祈祷，祈求真主在危难中庇佑信众。信众们刚开始聚拢祈祷，士兵便带着警棍和狼犬闯入现场。在这里，不存在仁慈的容身之所。"
 OMS_forpol.2.a:0 "生命的悲剧不在于死亡本身，而在于生前就让那些本该鲜活的东西在心中死去。"
 OMS_forpol.3.t:0 "山姆大叔的铁腕"
 OMS_forpol.3.desc:0 "Jacob Frey readjusted the collar of his suit jacket, moreso to take his mind off the blistering cold than anything else. He, along with one his aides, stood outside the US embassy and waited for the League delegation to arrive. His aide was a young recent graduate from an émigré family, fluent in Russian, French, and English. He'd be an invaluable asset, given that Frey was largely a political appointee. He'd given a lot of money to the President's campaign, and he wanted the prestige of serving as ambassador to the country that'd finally end the Nazi menace. At least, that's what those in the State Department were hoping.\n\n\"How much longer do you think they'll be-\" Frey began to ask, before a car finally pulled up in front of the embassy. Finally, Frey thought. They could get out of this cold. He approached the car just as one of the League's officials stepped out. He was a stern looking man with thick eyebrows that nearly covered his brow. His handshake was firm, gripping Frey tight as he pulled him close.\n\n\"Apologies for the delay,\" the League diplomat said in English with only a minor accent. \"A call that I could not put off. I do have a very busy schedule, so I was hoping perhaps we could agree here and now on American support over the issue of Outer Manchuria? Helping to free Russian territory from the grip of the Japanese is a worthy goal for us old allies, Russia and America, don't you agree Mister Frey?\"\n\nFrey was surprised by the forwardness of the ambassador. The embassy had prepared a dinner for this whole occasion in order to come to an understanding with the League. But given what he had just said, it didn't seem like there was much to discuss. \"Of course,\" Frey quickly replied. \"We would be more than happy to aid in your efforts to contain and push back against Japanese imperialism.\"\n\nThe League diplomat gave no smile in return when he let go of Frey's hand and made his way back to his car. He spoke a few quick words to his aide in Russian, before getting back in. In a few more moments, they had driven off. Frey couldn't help but be a bit amused by the situation, turning to give a shrug to his aide. But the look on his aide's face troubled him.\n\n\"Is there something wrong?\" Frey asked. \"Was it something he had said?\"[Change Later]"
 OMS_forpol.3.a:0 "他觉得这太简单了。"
 OMS_forpol.4.t:0 "清除害虫"
 OMS_forpol.4.desc:0 "列夫除了一身衣衫外已一无所有。就连这最后一点旧日生活的痕迹，也开始在接缝处绽开线头，放任西伯利亚的寒风钻入衣料缝隙，啃噬着他皲裂的皮肤。但他必须继续前进。他别无选择。他亲眼见过联盟军官用刺刀捅穿偏离行军纵队的同伴——只要有人往队列外侧多踏出半步。若是有人落得太远，同样会被刺刀贯穿心脏。\n\n他曾试图解释自己的迫不得已。所有人都曾声泪俱下地诉说，若拒绝为日本人效力，后者就会杀害他们的家人，再把幸存者统统发配到劳工营。他苦苦哀求对方怜悯他们一家，回应他的只有刺刀的寒光。在攻占外满洲后，联盟军官将所有“俄奸”拖出来，宣布他们是俄罗斯人民的敌人。没人问过列夫，在他“通敌”期间曾挽救过多少条性命。没错，他确实签署过不少人的死刑令。但若非他的周旋，死亡名单会长得多。\n\n没人在乎这些。那些生在俄日边界正确一侧的人，个个都带着道德优越感。他们不给俘虏收拾行李的机会，勒令这群人徒步穿越数百英里边境线，去投奔“日本友人”。行军开始几小时后，他的朋友弗拉基米尔——原本是个文员——刚开口询问能否给些食物，就被联盟军官用刺刀捅穿了心脏。又过了几小时，第一批人因力竭倒下。落后者不是被刺死就是遭枪决。列夫说不清哪种结局更仁慈。他没回头看倒下的是谁。这些都不重要了。唯一重要的是活下去。\n\n夕阳渐渐沉入地平线，列夫心底升起一丝希冀：或许能在次日黎明前获得几小时喘息。然而随着暮色愈深，他意识到对方根本不打算给他们片刻休憩。当最后一缕天光消失时，他眼中的希望之火也随之熄灭。"
 OMS_forpol.4.a:0 "对于通敌败类要毫不留情。"
 OMS_forpol.5.t:0 "为承诺而生产"
 OMS_forpol.5.desc:0 "Despite my better judgment, I made my way at the arranged meeting place and met a soldier of the Black League. He was dressed in a newly ironed uniform, an AK slung around his back. He was cleanly shaven, looked well-rested, but something rested behind those eyes. It wasn't so much a sharp edge as nothing at all. Nothing lay behind the sallow face which greeted me, no life sprung to the dead and hardened fingers which reached to grasp my hand. The conversation that follows went something like this, of course in Russian. \n\n\"Greetings. I am with the Central Intelligence Agency of the United States. I presume you know why I am here?\" \n\n\"Yes.\" His reply was curt, so curt that it almost caught me off-balance. Apparently these Russians were more direct than I had been briefed. \n\n\"Very well. I am here to carry forward my demands to your leaders. The United States is prepared to supply the Black League with money, arms, and munitions. In exchange, we'd like a few... assurances.\" \n\nWe went onto discuss said assurances. Well, discuss is quite a loaded term. I presented my demands, and as the seagulls circled and the nets were cast out to sea, the soldier simply absorbed them, that blank stare from those empty eyes barely moving. When we finished our negotiations, I was about to leave when that innate curiosity finally got to me. \n\n\"Private. How do you even feel about this? The war I mean. We all know you're headed for it. You're endeavoring a total war with the Germans. Are you sure this is even a good idea? To potentially destroy the entire world?\" \n\n\"The Black League will do whatever is necessary to avenge the Russian people. Even to the... even to the d-\" \n\n\"Death, yes I know. But have you ever considered what this might entail? For you? What if the Germans or Teutons as you call them are not grinded under your boot? What if you lose?\" \n\nThe soldier took a pause himself. I could see his Adam's apple move as he swallowed deeply, sweat building up around his brow. I had struck a nerve. His eyes darted from side to side. The atmosphere suddenly became far more oppressive, as if a blanket was placed over the both of us. The hairs on the back of my neck stood straight up. \n\n\"I'm sorry sir, but our time is up. Your ship will be coming for you soon. In the meantime, you may stay at one of our hotels.\"[Change Later]"
 OMS_forpol.5.a:0 "现在这些武器暂时够用了。"
 OMS_forpol.6.t:0 "波将金的恳求"
 OMS_forpol.6.desc:0 "[Change Later]\"Ladies and gentlemen. Citizens of the free world. I, Comrade Dmitry Yazov, come to you with an urgent address and a warning of what is to come for the people of Russia.\"\n\nThis message would not be broadcast to our people. We will not pollute their ears with our lies.\n\n\"The forces of expansionist fascism are powerful. The German threat to our west is wary of our resurgence, and their repeated incursions into our rightful borders have become more determined and numerous over the past months.\"\n\nOn the western front, experimental pushes into Moscowien territory by Black League reconnaissance forces were met with remarkably little resistance. Their sloth would be their undoing.\n\n\"German Nazism is a poisonous ideology. It extols militarist expansionism, a mythologized ideology of racial purity, and upholds slavery as just some of its many core tenets.\"\n\nIn prisons to the north, countless prisoners were worked to death in the forced labor of frozen work camps. Their blood will grease our war machine.\n\n\"All the Russian people have ever desired is safety and security. To live a life without the constant threat of invasion hanging over their heads. Despite our best efforts, we have been forced to harden our defenses against the fascists who wish to again reduce us to the anarchic chaos that defined these lands before our Reconstruction Authority managed to retrieve what had been lost for so many years.\"\n\nDeep underneath the western taiga, top secret networks of underground bunker systems run for many kilometers. None will know of their existence until it is too late to stop us.\n\n\"Our desire was to rebuild what had been taken and forge a new peace. But now we find ourselves preparing for war.\"[Change Later]"
 OMS_forpol.6.a:0 "其实根本没有选择余地。"
 OMS_forpol.7.t:0 "阿列克谢耶夫行动"
 OMS_forpol.7.desc:0 "编号：089-32-46							           日期：[DATA EXPUNGED]\n\n发件人：[DATA EXPUNGED]\n\n收件人：德米特里·亚佐夫\n\n事由：亚佐夫同志：据查证，部分红军残部已被迫潜入我远东边境毗邻的满洲国地带。日满双方最高指挥部目前尚未察觉我方行动。我们已向该部提供关键情报，助其执行任务并规避满洲国常规部队的侦察。边境村落现已成为我军集结点，正为纵深渗透满洲国领土的行动征募兵员与物资。\n\n此外，境外残部请求我方派遣分遣队协同作战，具体包括：袭扰敌军、拓展控制区、巩固现有占领区。因该行动具有涉密级战略机遇：可借此纠正野蛮的日本政权对我民族的暴行，兹请求将此行动直呈您本人决定。\n\n长官，决定权在您手中，我们应作何部署？\n\n"
 OMS_forpol.7.a:0 "武装残余部队，并派遣一名随员。日军并非优先考虑对象。"
 OMS_forpol.7.b:0 "派遣我们的军队。为我们受难的同胞讨回公道。"
 OMS_forpol.8.t:0 "军人，一个高尚的职业"
 OMS_forpol.8.desc:0 "基里尔在每日不变的喧哗声中醒来。尽管陆军自诩纪律严明，此刻营房却乱作一团。把一群无所事事的毛头小子塞进集体宿舍，这般景象倒也不足为奇。\n\n突然，中士闯入了进来，所有人都在铺位前立正。他冲几个仪容不整的列兵咆哮过后，终于宣布任务：\n\n“听好了！你们要向东开拔……很远很远的东边。确切地说是满洲国。少他妈问问题，老子什么都不知道！两小时整装出发，赶紧收拾！”\n\n中士踱步而出时，那副漫不经心的倨傲姿态与来时别无二致。门刚合拢，喧嚣便再度炸开。两小时收拾行装绰绰有余，那些姑且称之为男子汉的新兵们开始唱歌、欢呼、抽烟。唯有基里尔坐在床边。\n\n“满洲国？不如让我去月球！我们不是该打德国佬、杀条顿人吗？不，我参军绝不是为了这个。我要为死去的父亲报仇，为家族争光。去了满洲里还怎么……”他暗自思忖。\n\n基里尔环顾四周。确有几个同伴面露忧色，但整个营房都洋溢着狂喜。他们在为即将参战而欢呼，为即将成为英雄而呐喊。\n\n“这不正是我的初衷么？当英雄，报效祖国。在西方还是东方打仗，又有什么区别？父亲定会为我骄傲，无论何处。”他终于说服了自己。\n\n基里尔抛开忧虑加入人群。他们纵酒抽烟，且歌且泣，举杯预祝数月后就能抵达符拉迪沃斯托克。\n\n几个小时后，所有人都收拾好了行装，准备出发。兴奋渐渐消退，他的胃里开始翻江倒海。他想起离家时母亲的泪眼，想起父亲出征的背影，想起故乡的村庄和妹妹。他渴望战斗，却又无比想念他们。在泥泞的道路上行进时，他满脑子都是这些。"
 OMS_forpol.8.a:0 "焦虑与亢奋酿成一杯毒药。"
