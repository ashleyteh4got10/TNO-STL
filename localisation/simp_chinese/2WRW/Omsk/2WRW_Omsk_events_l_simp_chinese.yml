 OMS_more_flavor.1.t: "故土必归"
 OMS_more_flavor.1.desc: "这曾是复国进程中一个相当微不足道的部分，但依然值得为之奋战。无论何时属于俄罗斯的土地，凭借人民神圣的权利，都将永恒属于俄罗斯。滨海边疆区，或如泛亚主义者所称的“外满洲”，数十年来始终在俄国掌控之中，直至最近才沦陷于帝国主义魔爪。那些将这片土地由故土家园沦为荒地和工业废墟，的侵略者，正是日本帝国。正如理所当然的那般，在首次审判后，仍有成千上万的俄罗斯人及前苏联加盟共和国民众滞留此地，他们虽武装薄弱、势单力孤，却意志坚定。\n\n日本帝国陆军多年来持续镇压该地区，最终仅余少数忠诚分子仍如芒刺背，为重返俄罗斯祖国保存火种。亚佐夫有所察觉，并召集包括萨文采夫在内的总参谋部人员，提出一个新的方案，作为终局到来之前的首要目标。“同胞们，我深知祖国的领土并不都在我们的控制之下，不仅沦陷于背信弃义的第三帝国，更受制于蒙昧的日本帝国。”参谋们交头接耳，一人直言问道：“您建议我们如何行动？”“这很明显。”当天，他们精神抖擞地制定了一项计划。\n\n物资、粮秣与枪械开始源源不断渗入滨海地区，为抵抗组织提供所需一切以壮大声势。正如亚佐夫所说，“在其发展为可资利用的麻烦之前，提供给他们尽可能多的资源。”不仅如此，还将在该地区的战略位置部署多个部队，以帮助动摇日本对该地区的控制，并将其交给黑色联盟。亚佐夫将其命名为“阿列克谢耶夫行动”。到他上床睡觉时，参战部队已遴选完毕，所需资源的确切数量也已核定。"
 OMS_more_flavor.1.a: "亚佐夫此刻需要休憩，因为这将是他最后的安宁。"
 OMS_more_flavor.2.t: "执行计划"
 OMS_more_flavor.2.desc: "繁文缛节的时刻结束了。亚佐夫在“阿列克谢耶夫行动”的启动文件上签下了自己的名字，黑色联盟东部的大批部队随即被调派去执行动摇滨海地区稳定的任务。一切顺利的话，行动结束之时，那里便会是瓜熟蒂落，收复失土指日可待——这是夺回俄罗斯全部固有领土征途上的一步。来自马加丹、堪察加、阿穆尔及其他数个城市的成千上万名壮丁被征召入伍，充当这次行动的人力。此外，多批特工被派遣到该地区，为游击队提供关键情报和武器。\n\n在抵抗分子中播下愤怒的种子，并在该地区制造此起彼伏的叛乱，这仅仅是第一步。萨温采夫对此心知肚明，他知道这种局面迟早会结束，俄国的反情报能力也终将有其极限。在萨哈罗夫斯基的办公室里，一张外满洲地图平铺在桌上。旁边是一份该地区所有定居点的清单，上面标注着它们与日文名称的对照。他逐一估算着，当联盟的火力首次在境外冲突中经受考验时，何时能够抵达并解放这些地方。\n\n在阿穆尔，几栋尚还屹立的建筑中，两名即将奔赴前线的士兵一边啃着军粮，一边聊着家里的亲人。“万尼亚才五岁不到，他还等着我回去呢。”而现在，他当爹的却要远赴他乡，去做一件他自己都没把握的事。他的战友则懊悔于自己已经淡忘了太多家的温暖。“你儿子爱他的国家。你呢？”他肯定不是故意这么说的。他听起来快被逼疯了。那位父亲的回答辛酸而坚定："
 OMS_more_flavor.2.a: "“我爱这片土地，爱到想为它而活。”"
 OMS_more_flavor.3.t: "任务前的闲聊"
 OMS_more_flavor.3.desc: "瓦西里把烟从一嘴烂牙里抽出。他对战争的了解少得可怜：只知道它很糟糕，而且他必须接受它。除此之外，他只知道步枪训练。但就算这样，眼下这也是渗透活动，而非真正的战场厮杀。“所以，情况会有多糟糕？”\n\n“如果这还不够明显的话，那将会非常糟糕，”阿列克谢回答道。虽然他看起来比瓦西里年轻，但事实上，他比瓦西里更有经验，已经经历了一两年斯巴达式的严格训练和上司的絮絮叨叨。他不喜欢去回想自己挨了多少次打。\n\n约瑟夫正忙着确保他的步枪没有卡壳；这种情况已经发生过太多次了，他可不想再被上司训斥一顿。要知道，战友们以前总打趣说，若不是某个家伙英勇牺牲，以约瑟夫的无能，他们根本就拿不下远东。“拜托，这太荒谬了。忠诚第一，闲话第二。”\n\n当然，彼得罗只是冷眼旁观这群乌合之众试图闲聊却彻底失败的窘态。“你们都得振作起来。祖国不等人。”\n\n阿列克谢袖中早有对策，只是暂且按兵不动。"
 OMS_more_flavor.3.a: "“好吧，我们等待指示！”"
 OMS_more_flavor.4.t: "灰色地带"
 OMS_more_flavor.4.desc: "告死天使，正如当地人对他们的描述。可以说，特战小组担得起这一名号，即便他们并非天使，却是来执行天罚的。\n\n翻译员若不休息，随时都可能倒下，但他尽了最大的努力跟上不断从飞机上跳下来的士兵，本想平稳着陆，结果却踉跄栽倒在地。当地人目睹他们降落，看清军装后，选择提供帮助，只盼日后能得到他们的回报。这确实是他们的使命。\n\n“我们承诺给你们面包，承诺给你们弹药，承诺给你们自由，但只有一个条件。”从纸面上看，这位特战小组指挥官开出的条件十分诱人。至少，纸面上是这样写的。抵抗组织成员合理质疑这份好得不真实的交易。他勇敢地打趣道：“代价是什么？”“你们要对黑色联盟、对祖国、对俄罗斯毫无保留地效忠。作为回报，我们会给予你们这一切。”\n\n抵抗组织首领要求翻译员提出正式效忠誓言。要求被提出后，指挥官用洪亮的嗓音说出了全篇俄语誓词，尽管当地抵抗组织内部就有俄罗斯人，翻译员还是用母语将誓词转达给了大家。几名成员单膝跪地，直举手掌至空中。"
 OMS_more_flavor.4.a: "“……以我神圣的祖国之名。”"
 OMS_more_flavor.5.t: "哭泣的鸟，鸣哨的鸟"
 OMS_more_flavor.5.desc: "几十名特工被调遣至一处村庄，这里显然是反日活动的热点地区。他们朝天鸣枪，清空街道，只剩下游击队员还击。那些游击队员会坚守信仰至死不渝，扳机扣动时，金属弹丸比飞鸟更迅疾。\n\n金属之鸦向两边疾飞，它们的目标是人，，祖国至上，人性次之。几位“英勇烈士”身着死亡标志的制服突围而出，不求苟活，不求减轻痛苦，只为终结敌人性命，将苦难回赠给对方。几声孩童的尖啸与哭喊未能避开枪林弹雨；几声禽鸟振翅掠过，太多烟雾与死亡的呼啸交织。\n\n战火并未轻易停息。年轻的武志郎第一个从弹雨焦土中起身，尚存的游击队员明白，若想再多杀敌，只能另择他日。他们奔逃进青翠的林中，不停奔跑，身后几名满洲警察追击未果。与此同时，武志郎紧捂胸口环顾四周，目光锁定在一只木箱上。\n\n武志郎撬开箱子，发现里面满满当当全是莫辛-纳甘步枪，多得数不清。他又奔向另一只箱子，打开后看见里面塞满弹药。视线所及之处至少还有十几只箱子。“长官！您应该过来看看！”"
 OMS_more_flavor.5.a: "昂贵的场面"
 OMS_more_flavor.6.t: "出现交通管制"
 OMS_more_flavor.6.desc: "现在是军事时间2300，即晚上11点，莫德尔特握着方向盘，已经开始打盹，但他还有任务要完成。送货人总把任务排在休息前头，他暗想。不过，如果可以的话，莫德尔特还是会抗议的，当然，前提是他的舌头不会被割掉。\n\n莫德尔特是俄罗斯车队中的一员，此行任务是穿越满洲运送物资，与当地抵抗组织的联络人接头。他们只需通过一道检查站。按常理本应无人值守，毕竟那地方早已破败不堪。同事透露那儿烂透了，通行轻而易举。车队逼近边境时，莫德尔特反复想起听闻的传闻：有人遭枪击丧命，那些来自联盟的人和他一样执行着相同的任务，但随后就被迅速处决了。\n\n莫德尔特心想好歹是深夜，总不至于糟到哪儿去。谁知车队连检查站的影子都没见着，前头卡车猛然刹车，他被迫急停。前方数辆货车外传来争吵声，但嚷嚷的并非司机。一群满洲与日本警察正冲司机吼叫，勒令他们调头。事实证明，对于侵犯其“主权领土”的行为，帝国并不会掉以轻心。\n\n“怎么回事？”"
 OMS_more_flavor.6.a: "“滚回去，滚回你来的地方去！”"
 OMS_more_flavor.7.t: "真是丢人现眼，不是吗？"
 OMS_more_flavor.7.desc: "又是例行任务。日本帝国陆军航空飞行员翔斗心想。他注视着前方。此次任务不同寻常，既非他所熟知，亦非他所预想。翔斗摘下眼镜仔细检查是否有错误，但没发现任何问题。他像平常一样起飞，随后进行飞越侦察。他是首个执行该任务的人，但不会是最后一个。这是一次航拍任务，旨在观察地面上是否存在需要上级进一步关注的“异常情况”。至少，长官是这么下达命令的。\n\n果然，翔斗拍拍摄的某些目标照片显示了明显异常，那些成箱、成堆的步枪与日本帝国陆军的任何地面行动都不相符。翔斗所不知的是，上级正在细致审查这些照片，仿佛他们早已知情——而他们确实知晓。若非日本陆军所为，那么便只剩下一个嫌疑人。次日，空军基地增派了更多飞行员，他们与翔斗技艺相当，且接到的指令也如出一辙。翔斗满心困惑，但无暇多想。"
 OMS_more_flavor.7.a: "幸运的是，他没有进入“敌国”的领土。"
 OMS_more_flavor.8.t: "低语中的消亡"
 OMS_more_flavor.8.desc: "电台沉寂了——在此之前，枪声和绝望的呼喊从中传来，收听着“同志们”最后通讯的士兵们，无论是听觉上还是精神上，都陷入了显而易见的恐惧。尽管这或许被视为有失体面，但有些人哭了，有些人捂住了嘴或眼睛，还有些人跪倒在地。情形大同小异，皆是同情。他们是倒下的朋友、父亲、兄弟、儿子、叔伯、祖父、邻居、同志，等等等等，殒命于那些对素未谋面之人怀有不共戴天之仇的凶徒之手。究竟为何？\n\n“回去干活！”一名将军闯进门来，全然不知撞见了何等场面。“你们没听说吗？一个基地被攻陷了！”尽管这位下级军官很可能因顶嘴而受罚，他还是体面地解释了为何所有人都震惊地站着、坐着或躺着。“被谁？”“俄国人！”这并非孤例，只是数起满洲领土在“维稳”的幌子下被俄国军队——并非悄无声息地——夺取的事件之一。\n\n将军怒不可遏，但他身后毕竟有皇军撑腰，而且抱有同样想法的将军不止他一个。因此，解决问题的担子便落到了关东军头上，仿佛这只是件小事。不到一天，数百名士兵荷枪实弹，列队待命，准备着在前往前线与宿敌一决雌雄的路上，被上级呵斥，并向下级咆哮。"
 OMS_more_flavor.8.a: "强大的帝国守卫着自己的门户，而这门户却正轰然倒塌。"
 OMS_more_flavor.9.t: "伟业未竟！"
 OMS_more_flavor.9.desc: "“你当咱们是傻子吗？”日本大臣恨不得一把掐死这位大使，但他不能，唯恐因此激怒整个黑色联盟，让自己手上沾满鲜血。尽管如此，他还是将俄国外交大使召至东京，他要让俄国知道大日本帝国是何等愤怒。\n\n“除了阁下的好战之外，我无意因任何其他理由看轻您的智慧。”大使字斟句酌。他不想引发国际事件，至少，眼下时机未到。尚有许多工作要做，但稍有不慎，一切便可能在弹指间化为乌有。事后看来，他确是不够谨慎。他们谈话之时，俄日两军已然交火，大臣在向公众披露此事之前，确保对方已经知晓。“大日本皇军正与贵黑色联盟对峙，准备不惜一切代价保卫自身。”然而，公之于众则意味着软弱，这是大日本帝国无法承受的。简短的谈话以拒绝握手告终，大使随即致电亚佐夫，他深知通话正被监听。“我们不能再这样下去了。”\n\n电话那头，亚佐夫的手在颤抖。话筒亦随之震动，片刻沉寂之后，他简单地问道：“一切都结束了吗？”对于亚佐夫的好奇，大使给出了一个颇具诗意且意味深长的回答：“不，我的总司令。”"
 OMS_more_flavor.9.a: "“这仅仅是个开始。”"
 OMS_more_flavor.10.t: "无名之夜"
 OMS_more_flavor.10.desc: "纳泽洛夫从一顿毒打中苏醒过来。往事飞速掠过脑海，在模糊朦胧的记忆与鲜明的血红之间摇摆。他当时在一家酒吧歇脚。他的羊群已经安顿妥当过夜，他便利用余下的时间进行每晚的例行事务。毫无征兆地，一群村外来的陌生人将他拖拽到屋外。此刻，他挣扎着想要起身，耳边的说话声也愈发清晰。是俄语。\n\n“不……不要。我有钱，我还有羊。我能让你们发大财。我知道不少人的名字。”他操着一口蹩脚的俄语，结结巴巴地说道。\n\n“我们可不稀罕什么名字。”其中一人没好气地答道。他向后瞥去，只见一棵孤零零的树，另一个人正将绞索套在粗壮的树枝上。他开始剧烈地挣扎起来。“不！别这样！我什么坏事都没干过，也没犯什么罪！要是民兵知道了这事——”\n\n“如果你是指其他那些通敌者，别担心。他们就是下一个。”那伙人笑着把他拖上一张凳子，粗糙的草绳从他的锁链下穿过，轻轻套上了他的脖子。纳泽罗夫做着最后的徒劳挣扎，乞求着饶命。\n\n“求求你们，我还有老婆孩子啊。我…我真没做错什么。我从没偷过东西，战争的时候我还支持祖国来着，我发——”话音未落，那伙暴徒便一脚踢飞了他脚下的凳子。窒息感袭来，他的眼前逐渐发黑，软绵绵的身体悬挂在树枝上，了无生气。随着一声短促的口哨，那群俄国人动身去寻找名单上的下一个目标了。"
 OMS_more_flavor.10.a: "卖国贼休想逃过我们的怒火。"
 OMS_more_flavor.11.t: "黑色警报——总司令亲启"
 OMS_more_flavor.11.desc: "致：亚佐夫总司令\n发件人：远东司令部，伊戈尔·罗多诺夫上校\n\n总司令同志：\n\n远东地区的局势已急转直下，万分危急。日本及其盟友在该地区的兵力集结已显著增强，此外，我们还侦测到美国海空军舰船正在我国领海边界附近进行联合演习。此类军事演习在过去一周半内从未间断。\n\n我部已无充裕时间在东西伯利亚进一步加强防御部署。种种迹象表明，美日两国正准备从海陆空三线同时发动进攻。我部必须立刻集结兵力，守卫该地区所有港口，并投入足够兵员，全力迟滞自由国家组织与共荣圈的联合入侵，决不能让他们干扰我们的大审判计划。"
 OMS_more_flavor.11.a: "（签名）伊戈尔·罗多诺夫上校"
 OMS_more_flavor.12.t: "联盟特酿"
 OMS_more_flavor.12.desc: "联盟的顶尖奇才们又一次大功告成。奥列格荣幸地成为首位测试这款复仇新武器的人，这件利器将用于西线，狠狠打击那些可憎的条顿蛮子。在他脑海中，他曾幻想过一种更精良的装甲战车，一种比联盟现有载具更能抵御德国炮火的钢铁猛兽。然而，等待这位在统一战争中身经百战、伤痕累累的老兵的，却是截然不同的东西。\n\n在伊尔库茨克郊外的一处混凝土试验场，他此刻身着一套厚重的生化防护服。即便不算上他背负的化学药剂罐，单是这身行头也已分量十足。这件武器瞧着眼熟，和他不久前用来清剿战壕的火焰喷射器大同小异——那时候，联盟正从俄国的内敌手中夺回西伯利亚的这片土地。不过，奥列格心想，若这只是件普通家伙，那帮“高智商”的家伙们断然不会为了一次简单测试就如此大费周章。他对面，停着一辆破旧的敞篷乌拉尔-355卡车，车斗里塞满了头戴德式钢盔的人体模型。他的左手边，隔着一层足有一米厚的防护玻璃，便是主持这场实验的科学家们。\n\n“这玩意儿靠谱吗？”奥列格嘀咕道。与其说是在问话，倒不如说是在自言自语——即便那些科学家和他同处一室，隔着厚重的防护服，他们也听不清奥列格含混不清的咕哝。他们只是简单地朝他比了个大拇指。奥列格深吸一口气，扣下了扳机，心中已做好了准备——这或许就是他活在世上的最后一刻了。\n\n然而，预想中的爆炸并未发生。下一秒，一股强劲的腐蚀性化学洪流从他手中的武器喷涌而出，瞬间吞没了整辆卡车。那化学物质的威力惊人，不仅轻易蚀穿了卡车的金属外壳和下方的混凝土地面，车上的假人更是顷刻间化为乌有。攻击过后，现场弥漫着致命的绿色有毒烟雾，就连他身上厚实的橡胶防护服也几乎抵挡不住那刺鼻的气息。此刻，他脑中只剩下一个念头。"
 OMS_more_flavor.12.a: "条顿杂种们死定了。"
 OMS_more_flavor.13.t: "差之毫厘"
 OMS_more_flavor.13.desc: "这座西伯利亚小村庄曾安然度过大革命、协约国武装干涉以及俄国动乱年代，周边地区甚至连一发枪弹都未曾落下。然而，当黑色联盟为了他们所谓的“正义事业”横扫西伯利亚大草原，意图“收复”此地时，这里却成了一排祖国叛徒负隅顽抗的最后阵地。最终，这里也成了他们的葬身之所。战后，疏散到城里的村民并未返回，如今，这座村庄也迎来了它的末日。\n\n一辆嘎斯-69吉普车的出现，是这座死寂已久的村庄迎来的首个活人气息。瓦迪姆和克利门特驾驶着吉普，正沿着贯穿村庄主干道的那段路行驶。眼前的景象可不怎么体面。计划中，十枚导弹本应精确命中同一坐标，结果却枚枚都偏得离谱，有些弹坑甚至落在了村外的小山包上，清晰可见。他们将车停在原定轰炸目标——一家旧杂货店旁。结果，经过首轮火箭弹的“洗礼”，这座鬼城里除了这家杂货店，其余建筑反倒都还杵在那儿。\n\n瓦迪姆是个瘦高个，说话总带着点儿刻薄。他从驾驶座跨了出来，环顾着这帮科学家们搞出的一片狼藉。“要不是上面指望咱们用这玩意儿去端掉战略目标，眼前这乐子可就大了。”他开口说道，此时克利门特也下了车。\n\n“我看这玩意儿与其说是打那些条顿狗杂种，倒不如说是给他们挖散兵坑更在行。”他的同伴附和道，趁着政委不在跟前，两人显然是想到一块儿去了。\n\n“勘察完现场就回研究设施吧。要是上校指望着那帮‘高智商’能捣鼓出什么精确制导武器，那他老人家怕是要失望了。”"
 OMS_more_flavor.13.a: "“一位兴高采烈的上校随后便建议，将此武器大规模应用于德国城市地区。”"
 OMS_more_flavor.14.t: "416工程测试结果"
 OMS_more_flavor.14.desc: "416工程的有效载荷接近八千万吨当量，其威力已远超所有预期，尽管目前尚不适宜战略部队使用。由于研发周期仓促，该武器极不稳定，其载荷产生的爆炸威力过于强大，甚至直接蒸发了负责投弹的飞机。鉴于我国导弹技术仍处于原始阶段，建议后续测试开发替代投送方式。\n\n其影响令人严重关切。尽管投弹点选在据信安全的无人草原上空，但其附带损害却是巨大的，炸弹的破坏潜力超出了我们初步计算中的任何预测。距爆炸中心数公里外的整座城市陷入火海，据报告，远在德黑兰和斯维尔德洛夫斯克都能感受到爆炸的影响，中东和中国东部的地震监测中心甚至将其记录为小型地震。不幸的是，部分被派往该地区恢复秩序的士兵，即便躲藏在原以为安全的掩体中，也未能幸免于难。此外，由于我们低估了爆炸的威力，强制疏散区外的若干地区也受到了波及。\n\n鉴于爆炸点附近的强烈火灾风暴和辐射，我们需要相当长的时间才能全面评估该武器造成的损害。总而言之，若将此武器用于攻击条顿杂种的大都市，其瞬间造成的破坏，将不亚于他们在过去三十年间对我们祖国所犯下的暴行。\n\n签名：\nN.M·杰米契夫"
 OMS_more_flavor.14.a: "这柄利剑，我们必将用它直捣德国的心窝。"
 OMS_more_flavor.15.t: "关于AN416事件的报告"
 OMS_more_flavor.15.desc: "上级领袖：\n天基监视平台已证实我方怀疑，先前关于哈萨克斯坦地震的报告纯属虚构，实为俄罗斯民族复国政府进行的一次代号AN416的核装置试验。尽管该核装置成功引爆，但那个斯拉夫国家对武器的粗心处理，已然在其本土造成了一场核灾难，伤亡惨重。\n\n此等流氓国家竟拥有研发如此强大武器之能力，固然令人不安；然则不幸中之万幸在于，这次自食其果的重创，将使其核计划倒退数年，且必将动摇其国本。\n\n鉴于这个失败的俄国政权迄今为止只证明了其自我毁灭的能力，卑职建议我方暂不戳破其谎言。既无必要惊动我国民众，亦无必要冒险激怒此等苟延残喘之政权，致其进行更多试验。真相终将大白于天下。\n\n我部人员将继续监视局势。遗憾的是，我方在突厥斯坦军团最后的联络人，目前已被视为无法挽回的损失。行动：签名，\n卡尔·希梅尔斯托斯，党卫队上级突击队大队领袖"
 OMS_more_flavor.15.a: "签名，\n卡尔·希梅尔斯托斯，党卫队上级突击队大队领袖"
 OMS_more_flavor.16.t: "关于“总司令炸弹”的报告"
 OMS_more_flavor.16.desc: "局长：\n我方卫星以及截获自德国安全局的情报均显示，我们此前的怀疑是正确的：哈萨克斯坦的所谓地震，实为俄国政府一次失败的核试验所致。该装置被俄国人称为“416工程”，其爆炸威力极为惊人，或许已超越我方拥有的任何武器，但其不稳定性意味着它尚不适合作为武器使用。鉴于该装置的来源，我方内部此后将称其为“总司令炸弹”。\n\n尽管他们成功测试了“总司令炸弹”，但其计算失误导致了远超哈萨克斯坦开阔草原上爆炸点范围的大规模破坏。俄国人显然未曾料到炸弹会产生如此效应。目前，俄国政府仍坚称那是一场地震，并继续维持其闭关锁国的状态。德国人似乎意图任由此等闹剧继续，以免在该地区引发进一步动荡，他们相信俄国政府终将自行崩溃。我局与德国人均评估认为，由“总司令炸弹”试验引发的国内核灾难，将使俄国的原子武器计划倒退数年。\n\n虽然俄国拥有核武器一事仍令人关切，但目前尚无必要因此事引发国际恐慌。如此规模的核灾难一旦公之于众，必将引发国内民众对我方原子武器计划的抗议，这在军备竞赛正如火如荼的当下，是我们难以承受的。此外，我们也没有理由去动摇俄国政府的稳定，毕竟他们仍然是德国人身边的一根刺。"
 OMS_more_flavor.16.a: "签名：\n丹尼尔·威利斯特工"
 OMS_more_flavor.17.t: "AN416事件"
 OMS_more_flavor.17.desc: "得益于宪兵队的努力，我们才能够揭穿俄罗斯关于其中亚占领区发生地震的不实说法。正如我们所料，此事系近期在大东亚共荣圈北部边境设立的核生化生产设施所致。由于该项目工期紧迫，AN416型核装置的测试以失败告终，对其控制下的民众造成了巨大的意外伤害。\n\n从德国和美国截获的情报表明，我们的两个对手都认为这场自食其果的核灾难将使俄罗斯的核计划倒退数年。然而，近日西伯利亚境内设施的活动显著增加。尽管该封闭国家仍难以被我方特工渗透，但显然对手对局势的判断存在偏差。\n\n我们绝不能向俄罗斯透露我们已经识破其谎言，因为这可能会使我们在俄罗斯境内收集信息的行动更加复杂。\n\n建议东京方面采取措施防范此威胁，包括加强西伯利亚边境的军事戒备。"
 OMS_more_flavor.17.a: "陆军少佐\n藤本真澄"
 OMS_more_flavor.18.t: "缅什科夫格勒报告"
 OMS_more_flavor.18.desc: "总司令亚佐夫同志：\n我谨荣幸地报告，有组织的芬兰抵抗活动已被平息。由于芬兰数十年艰苦的反游击战争导致其国内空虚且士气低落，此次任务的推进比预期更为顺利。尽管驻芬预备队遭受了一些伤亡，但其规模远低于最初预估。据测算，超过90%的现役军人已被击毙、逮捕或流放。\n\n该地区的全面俄化仍需数年时间，以彻底取代芬兰人及其瑞典同胞的野蛮文化与语言。为加速这一进程，大批原住民已被迁至哈萨克斯坦南部，同时忠贞的俄罗斯民众迁入以替代其位置。\n\n芬兰问题得到了圆满解决。这些曾耗费数十年试图殖民卡累利阿、侵蚀一切俄罗斯元素的人，最终在被以同样手段反制并施以压倒性武力后，作为一个民族被彻底瓦解。\n\n随着行动接近尾声，我已批准将预备队中的过剩人力立即调往与莫斯科维恩接壤边境的主战线，以投身§R大审判§!这一光荣使命。\n\n此致，\n尤里·德罗兹多夫"
 OMS_more_flavor.18.a: "又解决了一个历史对手。"
 OMS_more_flavor.19.t: "项目报告：CT-60及OT-60M"
 OMS_more_flavor.19.desc: "致：OKB-卡尔贝舍夫军械需求部\n\n自：克拉斯诺亚尔斯克-7号第4测试部\n\n经进一步评估，我们得出结论：将军关于研究为主战坦克配备改进型化学喷射器的请求无法实现。\n\n行进间化学罐释放的毒气状态极不稳定，在实战条件下对我们的坦克乘员构成健康威胁。在所有已实施的测试中，每次至少有一名乘员、有时甚至全体人员因相关环境影响入院治疗。其中一次事故中，防护装备导致的视野受限直接造成坦克撞墙事故。\n\n得益于安全预防措施，所有参与测试的志愿者均能在短期内重返常规作战岗位。但由于未有任何一项压力测试能使坦克进入指定模拟目标的射程范围，所有CT-60型化学坦克的测试项目即日起无限期中止。\n\n在积极进展方面，常规火焰喷射器坦克测试取得重大成功。最终演习中，整个坦克中队成功抵达工程部建造的模拟条顿村庄，并在激烈对抗条件下以足够快的速度将其彻底焚毁，理论上未留幸存者。我们建议立即启动OT-60M型号的量产程序。"
 OMS_more_flavor.19.a: "这预示着我们将把敌人送入地狱。"
 OMS_more_flavor.20.t: "序幕"
 OMS_more_flavor.20.desc: "电报已经摊在老人的办公桌上好几分钟了，已有数分钟，透过那副金丝眼镜的双眼虽努力掩饰，却仍泄露出他刚刚读到的内容带来的震惊与嫌恶。无数讯息曾在外交部这个井然有序的部门流转，其中数千份都经斯文之手处理过，可他从未见过如此荒谬之物。这实际上是在要求德国无条件投降，放弃这个伟大国家历经艰辛所取得的一切，而且还没有开过一枪一炮。如果这位年迈的先生体内还有一丝不羁的话，他肯定会嘲笑这种荒谬的想法，这只能是野蛮的斯拉夫人丰富的想象力编造出来的。\n\n就在他正要拿起这张该死的纸扔进垃圾桶时，外面响起了空袭警报。他开始感到胃部猛地抽搐起来，于是又读了一遍，眼神在字里行间跳跃，越来越恐惧，他意识到这并非某个妄自尊大国家的低劣玩笑，而是份饱含战争宣言意味的正式声明。他又读了一遍，然后再读一遍，接着又读了第三遍，生怕这只是场醒不来的梦。汗珠渗出他布满皱纹的秃顶，就在第四遍重读即将开始时，惊天动地的爆炸撼动了整片街区，震得老人跌出座椅，办公室窗户应声炸裂。\n\n刹那间，这位久经沙场与政坛的老将感受到了自他在俄国的战壕被炮轰以来就未曾有过的东西。单凭肾上腺素驱使，他站了起来，不顾周围四溅的玻璃碎片。他肉眼望向被炸毁的窗户外面，惊恐地意识到旁边的地区办事处被导弹击中了，整整三层楼被彻底抹去，更多的爆炸声在这座古老的普鲁士城市中轰鸣。令他感到恐怖的是，他意识到了这意味着什么。"
 OMS_more_flavor.20.a: "德国再次陷入战争，而这次的对手比以往任何敌人都更残暴。"
