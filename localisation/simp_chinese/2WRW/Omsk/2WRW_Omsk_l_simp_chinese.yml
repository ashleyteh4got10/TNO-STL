 OMS_chemical_weapons_gui_info_tt:0 "我们或许正致力于生产数量可观的大规模杀伤性武器，然而，我们那些准备用于前线的其他‘民族复仇武器’的储备状况，则完全是另一回事了…\n\n通过界面右上角的决策选项卡，您可以补充您的武器储备。我们拥有的此类武器越多，便能越长久地在前线运用它们。我们亦可启动后续研发阶段，升级化学与生物武器，但代价是牺牲武器的稳定性。倘若这些武器变得过于不稳定，在战争中启用它们，将导致我方也遭受其毁灭性打击。为稳定这些武器，您可利用界面右下角的选项卡进行调整。"
