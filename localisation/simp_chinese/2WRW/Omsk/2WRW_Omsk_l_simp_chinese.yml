 OMS_2WRW_show_western_front_decisions:0 "展示西线决议"
 OMS_2WRW_hide_western_front_decisions:0 "隐藏东线决议"
 OMS_2WRW_grand_offensive_stratagem_decision:0 "大进攻战略"
 OMS_2WRW_grand_offensive_stratagem_decision_desc:0 "我们将从仓库中转移额外的资源，以亚佐夫同志本人的精神发动一场盛大的总攻势。"
 OMS_2WRW_ceaseless_assault_stratagem_decision:0 "无休止进攻方略"
 OMS_2WRW_ceaseless_assault_stratagem_decision_desc:0 "我们的政委将向我们的士兵灌输无情地向敌人冲锋所需的爱国热情，在消灭所有反动派之前永不停歇。"
 OMS_2WRW_chemical_saturation_stratagem_decision:0 "化学饱和战术"
 OMS_2WRW_chemical_saturation_stratagem_decision_desc:0 "额外的飞机、大炮和火箭将会被制造以携带更多化学武器。当我们的士兵在它后面行进时，一团化武之云将席卷德国人。"
 OMS_2WRW_firestorm_assault_stratagem_decision:0 "烈火突击战略"
 OMS_2WRW_firestorm_assault_stratagem_decision_desc:0 "日耳曼之病疫将被一场烈焰风暴根除，这场风暴将烧毁他的堡垒、他的家园和他的梦想。正如敌人进军我们的祖国时，焦土迎接他们一样，当我们的士兵将把条顿人的巢穴夷为平地时，焦土也将迎接他们。"
 OMS_2WRW_strategic_repossession_theorem_decision:0 "战略收回理论"
 OMS_2WRW_strategic_repossession_theorem_decision_desc:0 "与其摧毁摆在我们面前的一切，不如暂时放慢我们的攻势，征用控制区内或控制区内的非战斗资产。因此，德国人的不义之财将直接进入我们的战争基金。"
 OMS_2WRW_show_home_front_decisions:0 "展示后方阵线决议"
 OMS_2WRW_hide_home_front_decisions:0 "隐藏后方阵线决议"
 OMS_2WRW_expropriate_assets_non_combatants_decision:0 "征用非战斗人员资产"
 OMS_2WRW_expropriate_assets_non_combatants_decision_desc:0 "非战斗人员将不得不学会用更少的物资生活。汽车、燃料、食物、金属，甚至他们穿的衣服，前线都更加需要。我们的政委将们搜寻城市，以确保我们的爱国劳工为战争做出贡献。"
 OMS_2WRW_expand_labor_force_decision:0 "扩大奴隶劳工"
 OMS_2WRW_expand_labor_force_decision_desc:0 "非战斗人员群体深知，没有年龄太大、太小或患病而无法工作一说。他们都必须为战争贡献力量。若不愿在前线直面死亡，那么必要时他们也将在工厂里面临同样的结局。"
 OMS_2WRW_propaganda_saturation_decision:0 "理念灌输"
 OMS_2WRW_propaganda_saturation_decision_desc:0 "我国人民将通过文字了解我军凯旋的捷报，亲眼见证敌军在我军打击下灰飞烟灭的实况。昼夜不息，胜利的乐章将与他们常伴。"
 OMS_2WRW_crush_defeatist_sentiments_decision:0 "粉碎失败主义情绪"
 OMS_2WRW_crush_defeatist_sentiments_decision_desc:0 "即使胜利在望，仍有人宁愿在德国铁蹄下受辱，也不愿为取得最终胜利贡献自己的力量。黑手会让他们就范的。"
 OMS_2WRW_find_additional_volunteers_decision:0 "征集后备志愿兵"
 OMS_2WRW_find_additional_volunteers_decision_desc:0 "现在国内仍有大量适龄人员尚未自愿参军，他们往往误认为自己不符合服役条件，或自认为留在国内更能报效祖国。我们的安全部队将深入城乡各地，动员这些人员 自愿 参军入伍。"
 OMS_2WRW_readiness_construct_siberian_redoubts:0 "建设西伯利亚堡垒群"
 OMS_2WRW_readiness_construct_siberian_redoubts_desc:0 "我们将在西伯利亚现有工事的基础上增设战壕网络与堡垒，确保更多人民在不可避免的灭世中幸存下来。"
 OMS_2WRW_readiness_construct_western_redoubts:0 "建设西部堡垒群"
 OMS_2WRW_readiness_construct_western_redoubts_desc:0 "当前我国的大部分人口与工业主要集中于西俄罗斯地区。由于该地区缺乏可靠的天险，我们必须立即构筑防御工事：既要保护工厂与工人免遭敌军空袭，又要在最坏情况下，也就是敌军突破我军防线时能够作为前沿作战基地使用。"
 OMS_2WRW_readiness_construct_far_eastern_redoubts:0 "建设远东堡垒群"
 OMS_2WRW_readiness_construct_far_eastern_redoubts_desc:0 "在远离德国轰炸机轰炸范围的远东地区，大审判结束后，那里将成为我们社会重建的主要据点。通过在这些地区建造更多的地下掩体，我们将确保我们的民族在核弹洗礼后的长远未来。"
 OMS_2WRW_has_western_front_decision:0 "西线决议正在执行"
 OMS_2WRW_has_home_front_decisions:0 "后方阵线决议正在执行"
 OMS_2WRW_readiness_construct_finnish_logistics:0 "改造芬兰后勤网络"
 OMS_2WRW_readiness_construct_finnish_logistics_desc:0 "在我们对德国发起§R大审判§!之际，收复俄罗斯旧都的重要性仅次于夺回莫斯科。然而野蛮的芬兰人竟想保留战争中的非法所得，构筑了卡累利阿后勤网络。现在，让我们将其改造为解放俄罗斯大地的利器吧。"
 OMS_2WRW_readiness_construct_nikolaigrad_redoubts:0 "增设芬兰堡垒"
 OMS_2WRW_readiness_construct_nikolaigrad_redoubts_desc:0 "仅仅将赫尔辛基这座蛇窝变成俄罗斯城市还不够。我们必须将其与其他关键城市整合进我们的国家堡垒体系。这将确保新俄罗斯公民能在§R大审判§!后的余波中生存，同时让条顿人任何的反击企图化为泡影。"
 OMS_2WRW_readiness_construct_establish_baltic_navy:0 "波罗的海海军彰显存在"
 OMS_2WRW_readiness_construct_establish_baltic_navy_desc:0 "We've been denied access to the Baltic Sea for three decades and it's about time that the Black Fleet made its presence felt here. By constructing new naval facilities here we'll be able to reclaim our naval legacy on this region. With it, we'll be in a position to strike directly at German cities in the north once the §RGreat Trial§! begins, shattering any illusions their so-called civilians may have that they'll be safe from our wrath."