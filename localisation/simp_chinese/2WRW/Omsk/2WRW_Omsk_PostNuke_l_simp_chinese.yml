 POSTNUKE_The_Fuhrer: "元首"
 POLITICS_POSTNUKE_THE_FUHRER_DESC: "他们还活着！我们的使命仍未完成！\n\n根据可靠消息我们的情报，那些可憎的条顿人依然存活在世。在我们西边的某处个角落，那些老鼠辈正从藏身之地仓皇爬出处四散奔逃，开始重建家园再度集结。只要你竖起若侧耳朵倾听，几乎能听到他见它们窸窣叽叽喳喳的低语和急促吵嚷与仓皇奔走的脚步声。尽管纵使我们竭已倾尽全力，但“大审判”仍在继续远未终结。\n\n毫无疑问，他们会正卷土重来，企妄图夺回曾经属于他们曾经拥有的东方土地一切。他们堕落腐化的习本性从并未随着其人性的泯灭而消失亡。所有纳粹的旧日的高层——首脑：凯特尔、鲍曼、施佩尔、希姆莱、艾希曼、戈培尔——全，都躲安坐在掩体他们的地堡里，对向着黑色联盟发出嘲弄的阵阵讥笑。他们讥讽笑着我们试图想要终结其存在的徒劳之举，如同识破、这可悲的尝试——宛若早已洞悉毒酒的君王般傲慢。\n\n他们正逐步一点一点地，开始从其辐射弥漫的堡垒中探倾巢而出爪牙，。他们一砖点一瓦点地，重新集结，准备与黑色联盟展开最后的终对决。他们一寸寸点一点地，用爪牙撕扯着围墙掩体与地堡高墙，企妄图摧毁俄罗斯守卫者最后的残存守护者。这是条顿人最后一次崛，条顿人挺身而起，向着太阳伸出染血的手掌魔爪。"
 POSTNUKE_Kommer_Damen: "科默·达门"
 POLITICS_POSTNUKE_Kommer_Damen_DESC: "当核火焚尽旧世，余烬中迸发的星火或将成为重燃文明之火的希望。当末日降临荷兰时，鹿特丹港却因一场意外幸免于难——原本瞄准这座港口、意图制造远超1940年惨剧的核弹，竟在半空中失效了。随着外部联系的彻底中断，达门造船厂的工程师们利用库存柴油和机械设备，开始建造能在石油耗尽后长期提供动力的蒸汽机。\n\n在世界陷入黑暗时，无数人死于饥馑。但在鹿特丹，首批基础蒸汽机为战后工商业复苏提供了支柱。随之而来的是财富，很快还有对整个地区的控制权——作为唯一能维持电力与机械运转的场所，达门造船厂至少足以建立起蒸汽工业的根基。\n\n掌控这一切的正是科默·达门，这位浪子在60年代初革新了造船工艺，又在核弹落下后果断启动应急预案。随着鹿特丹地方政府彻底崩溃，这位被称作“蒸汽领主”的商人随着首批蒸汽船重启渔业贸易而步步高升，其商业触角沿着荷兰海岸延伸，将残余社会群落统合在达门集团旗下。达门集团以物资支援换取劳役与税收的企业统治就此成型。\n\n但如今，公司的成功或许正酝酿着危机——当生存危机解除，各地社群开始要求在公司事务中获得更多话语权。工会与地方政治组织逐渐形成，达门集团一手遮天的局面首次受到质疑。现在的问题是：这位蒸汽领主究竟会仅仅复兴经济，还是同时恢复荷兰昔日的民主政治？亦或是不惜代价，继续以钢铁引擎推动他理想中的进步？"
 POSTNUKE_Sergey_Akhromeyev: "谢尔盖·阿赫罗梅耶夫"
 POLITICS_POSTNUKE_SERGEY_AKHROMEYEV_DESC: "纵是在与日耳曼人的殊死血战之中，也仍然有人质疑着黑色联盟和亚佐夫的理念。只要胆敢投降，即便是俄国同胞和斯拉夫兄弟，也概不饶恕。万物皆沦为那庞大俄国战争机器的食粮。前特种部队成员谢尔盖·阿赫罗梅耶夫与他的部下，便是那些唾弃了黑色联盟的人之一，他们唾弃那浸透仇恨、妄图将世界浸没于辐射汪洋的意识形态。身陷于无人地带，他们在西乌克兰，由士兵与幸存者们，以马克思和列宁的理念为基石，建立起一个崭新的社区。它承诺平等，承诺财产公有，承诺为所有甘愿劳作者带来公道。\n\n尽管面临着重重险阻，谢尔盖仍竭尽全力去维系稳定与法治，他立誓守护自己的社区，使其免遭纳粹主义的梦魇、亚佐夫残部的追猎、以及游荡于废土之上的各路散匪流寇的侵扰。毕竟，西乌克兰尚存些许可用的土地，足以靠耕作与搜寻来维持一份贫瘠却尚可维系的生计。因此尽管历经万难，谢尔盖·阿赫罗梅耶夫和他的杂牌军仍决心要在这片凄凉、死寂、辐射遍地的崭新世界里，继续作为幸存者们的希望灯塔而存在。"
 POSTNUKE_Carl_Erich_Almgren: "卡尔·埃里希·阿尔姆格伦"
 POLITICS_POSTNUKE_CARL_ERICH_ALMGREN_DESC: "核爆的邪秽触手未能触及之处，一支名为“救世军”的小股势力已然凝聚成形。他们栖身于东方领的密林深处，此地偏远至极，得以幸免于轰炸最烈之劫。在这支队伍的庇护下，聚集了形形色色的难民、溃兵，以及一支由瑞典陆军前将军卡尔·埃里克·阿尔姆格伦率领的瑞典分遣队。\n\n阿尔姆格伦本是派驻此地的武官，战后却成了该地区唯一具有军事经验且能服众的人物。因此，在他严明而公正的治理下，在基督价值观的指引下，他组建了一支民兵，旨在抗击此地的匪帮、党卫军残部和鄂木斯克余孽。这支民兵竭尽所能，奋力保护人民免受这些本应消逝于历史的可憎势力的侵害。\n\n诚然，阿尔姆格伦对废土的未来仍怀揣希望。有朝一日，他的士兵和他们所保护的平民，所构筑的将不只是在废土上的苟且偷生。有朝一日，他们必将重建家园。他们是一支由德国人、瑞典人和波罗的人组成的混杂队伍。然而他们众志成城，敢于梦想。"
