 POSTNUKE_Dmitry_Yazov: "德米特里·亚佐夫"
 POLITICS_POSTNUKE_DMITRY_YAZOV_DESC: "战靴，战靴，战靴，战靴，踏过一遍又一遍——战争永无休止符！\n\n这些单调枯燥的行动，勾勒出大审判现阶段的轮廓，也定义了这位声名显赫的总司令当前的人生。这些年岁——不，或许是数十载的光阴——依旧不足以消磨德米特里·亚佐夫心头盘踞的深仇大恨。每当一丝离开他那混凝土浇筑的地下囚笼的机会出现，他便如同一条疯狗般焦躁不安；那而那样的环境，早已足以令意志稍逊的凡人和国度在核后社会的重压下彻底崩溃。这些地下迷宫，恍如通往炼狱本身的幽深甬道，见证着最卑劣的渣滓在忠诚信徒的海洋中暗中勾结。联盟的子嗣们，与他们的领袖一同蛰居于这地堡之中，生活在政权警惕的目光之下，无论是异见分子还是条顿的同情者；他们都将如鼠辈一般被清剿并焚毁。这些繁琐的内部清查，却让他们对迫在眉睫的重大威胁视而不见：条顿人无疑正在这片酷烈的不毛之地中日渐复苏，苟延残喘，图谋再起。但亚佐夫毫无惧色，因为这丝毫阻碍不了他们达成终极的目标与使命。他等待着，等待着能再次亲眼目睹俄罗斯。或者说，俄罗斯仅存的残骸的那一天。\n\n直到那命中注定之日降临，直到“大审判”得以延续之前，他也只能在这些由卤素灯泡映照得一片蜡黄的钢铁厅堂中焦躁地踱步，四下巡视。他一遍又一遍地清点着子弹、面包、鲜血与战靴。货箱、营房、饥饿、干渴、疲惫…这些感受时而模糊，时而又尖锐地刺痛神经，但联盟始终警觉。强者存续，弱者倾颓。强者前行，弱者饿毙。\n\n战靴，战靴，战靴，战靴，踏过一遍又一遍——战争永无休止符！"
 POSTNUKE_Evgeny_Savintsev: "叶夫根尼·萨文采夫"
 POLITICS_POSTNUKE_EVGENY_SAVINTSEV_DESC: "§x遵照指示，继续保卫莫斯科。§!\n\n无论叶夫根尼·萨文采夫从莫斯科收到多少战况更新，无论他多少次得到保证，那里剩下的只是一片毫无价值、仍在冒烟的废墟，从他办公室发出的，永远只有这道命令。即便无数士兵为了那些早已被人遗忘其用途的街区、为了那些屋主早已丧生的空宅而浴血奋战、慷慨赴死，下达的指令也只有一个：\n\n§x遵照指示，继续保卫莫斯科。§!\n\n关于为何莫斯科保卫战仍在继续，即便战争早已被核武的烈焰拖入泥潭，众说纷纭。有人说，他因承受了无法想象的惨重损失而精神失常。另一些人则认为，萨文采夫不愿让自己为之牺牲了如此之多的事业最终化为泡影。甚至有人揣测，萨文采夫早已在核爆炸中丧生，那些指令不过是自动发出的回复罢了。尽管如此，一道命令依旧在莫斯科的废墟之上，在黑色联盟士兵的耳畔不断回响：\n\n§x遵照指示，继续保卫莫斯科。§!"
 POSTNUKE_Adolfas_Ramanauskas: "阿道法斯·拉马瑙斯卡斯"
 POLITICS_POSTNUKE_ADOLFAS_RAMANAUSKAS_DESC: "§x大审判§!将人性最狰狞的面目展现地淋淋尽致。每日都有成批平民和无辜者倒在交战双方无尽的屠戮下，数百座城市与数个世纪的历史尽数化为废墟，而人们仍在这些残墟瓦砾间厮杀。在这场战争中，无一清白者。阿道法斯·拉马瑙斯卡斯虽非例外，却试图扭转局面并赎罪。\n\n同众多战友般，阿道法斯在二十世纪60至70年代曾与德军密切合作。然而黑色联盟的围剿将他逼至绝境。他冷眼旁观挚爱的立陶宛祖国遭受无尽酷刑处决，对德国主子的烧杀掳掠置若罔闻。但当土地步向崩裂，当苍穹坠向大地，某些东西改变了。\n\n在\"涤罪者\"的旗帜下，各色军人摘下他们的军帽，集结于此——黑盟士兵、党卫军准军事组织、形形色色的俄罗斯及波罗的海合作者——他们立下最为质朴的誓言：为往日罪行赎罪，守护饱受其统治的万千人民。"
 POSTNUKE_Akihito: "明仁天皇"
 POLITICS_POSTNUKE_AKIHITO_DESC: "明仁记忆中的日本惟有极致之美。他仍记得漫步皇宫枯山水庭园的时光，那些承载先祖智慧的唐风建筑。而今一切尽毁，东京与日本各大都市皆成焦土。他最后的记忆，是侍从们仓皇将他塞进驶往富士山地下工事的轿车。然后是震动——持续不断的、可怖的、天崩地裂的震动。\n\n当他获准窥视外界时，整座城市已湮没于尘墟。在山体深处的掩体内，紧急会议正在秘密进行。从他们告知中，明仁得知：他的父亲昭和天皇未能抵达避难所。明仁仓促继位，被推上这个支离破碎的新日本政府虚位元首之位。\n\n尽管如此，仍有幸存者亟待救济。全日本的重建工作已然展开——在明仁天皇的敕令下，各地市政以全新架构重组，民生配给体系逐步恢复。即便缩编至最简的内阁，仍通过无线电颁布政令。假以时日，帝国议会可能将再度召开。这条辐射弥漫的复兴之路危机四伏，但只要天皇仍居御位，希望便不会断绝。"
 POSTNUKE_Aleksandr_Sakharovsky: "亚历山大·萨哈罗夫斯基"
 POLITICS_POSTNUKE_ALEKSANDR_SAKHAROVSKY_DESC: "亚历山大·萨哈罗夫斯基恪守着严苛的作息。\n\n每日清晨七点半（大抵是这个钟点，在岁月侵蚀下\"堡垒\"的时钟早已走不准），他与众人准时苏醒。夜班工人拖着沉重的步子回到营房，日班工人则站上流水线。接下来五小时，他们用日渐枯竭的原料生产枪械。十五分钟午餐后，工作继续，直至晚间七点半收工。\n\n自工业堡垒运转之日起，这个循环便从未停歇。墙内的男人们早已遗忘外界是何模样，仅知要为西线的\"大审判\"源源不断地输送步枪——即便核爆的火光正吞噬战局，即便所谓接收武器的士兵不断减员，即便亚历山大愈发清醒地意识到：这一切不过徒劳。\n\n即便如此，他仍继续来到流水线上——只因除此之外，他已无法想象其他生活之姿。"
 POSTNUKE_Andrey_Matvienko: "安德烈·马特维延科"
 POLITICS_POSTNUKE_ANDREY_MATVIENKO_DESC: "哈萨克斯坦已有两个世纪未尝和平。沙皇的暴政、布尔什维克的动荡、最后是德军永无止境的可怖轰炸——在这片被炮火震颤的草原上，唯有那些暂能搜刮到食物饮水的人，才配拥有“希望”这种奢侈品。\n\n鄂木斯克的强制整合未能缓解丝毫苦难。人们不过是从农奴变成工奴，换了主子却换不掉枷锁。即便炸弹如雨落下，压迫的铁链仍死死遏住哈萨克斯坦的咽喉。\n\n军事总督安德烈·马特维延科延续着鄂木斯克式的暴政循环。人们被囚禁于地下掩体，远离祖祖辈辈世代生存的土地，在烟尘中窒息劳作。而这片焦土仍在为\"大审判\"的再度降临而艰难运转。"
 POSTNUKE_Carl_XVI_Gustaf: "卡尔十六世·古斯塔夫"
 POLITICS_POSTNUKE_CARL_XVI_GUSTAF_DESC: "卡尔·古斯塔夫即位于1973年，本算得上新君。彼时世界局势尚未紧绷，王权责任亦未苛重。伯纳多特王室从未想过，有朝一日竟会从优渥的宫殿生活里被连根拔起。\n\n当核弹抹平斯德哥尔摩与瑞典南部时，国王带着残存的王室与子民逃往幸免于难的北方荒原。古斯塔夫在此成立临时政府，自任虚位元首，与从同样化为焦土的挪威逃来的幸存者们携手重建。\n\n如今，宫殿换成木屋，侍从变为公民，王权让位于救世之责。这支杂色的难民队伍试图在极北之地建立免于焚世核火的新文明。当目睹他们铺就道路、搭建屋舍、安装发电机时，国王只得报以苦笑——文明的火种终将延续，正是因他这般的人存在。"
 POSTNUKE_Council_of_the_Caucasus: "高加索地区议会"
 POLITICS_POSTNUKE_COUNCIL_OF_THE_CAUCASUS_DESC: "高加索地区的苦难史，就像一部永无止境的镇压编年史。\n\n最初，他们在已解体的苏联统治下饱受政治异见者的囚禁之苦；随后，又在伟大的卫国战争及接踵而至的西俄战争中，忍受了无情的暴力与轰炸；再然后，整个地区一度被纳粹的残酷意志所奴役；最终，他们又迎来了\"黑色联盟\"的残酷镇压——任何异议都在铁蹄之下被碾作齑粉。\n\n直到一场三万度的焦土洗礼降临，这片土地的苦难才得以终结。残存幸存者们逐渐聚集，组建了高加索幸存者议会。这是一个由众多不同民族、语言拼凑而成的松散政权，却被一种无比坚韧的纽带紧紧联结：\n\n这片土地所共同承受的折磨，以及一种压倒性的生存意志——无论是为了自我的存续，还是为了向那些怀有灭绝他们企图之人实施复仇。"
 POSTNUKE_Fyodor_Pavlovsky: "费奥多尔·帕夫洛夫斯基"
 POLITICS_POSTNUKE_FYODOR_PAVLOVSKY_DESC: "在这文明倾塌的时代——黑色联盟故地尤甚，暴行与虐杀早已司空见惯。但倘若向北深入荒芜的尤格拉地区，会发现一簇微弱的火光。\n\n\"乌拉尔公社\"是这片人烟稀少之地上自发形成的无政府主义聚落。领导众人的是费奥多尔·帕夫洛夫斯基——这位亲历二战与第一次西俄战争的老游击队员，深谙绝境求存之道。即便胜算渺茫，他仍誓死坚守信念。\n\n他们从各处搜罗到有限的粮食与武器，在尤格拉公国祖先的土地上实行物资共享。当渔妇的吆喝与公鸡的啼鸣再度响彻鄂毕河岸时，这种近乎原始的生存方式，反而成了文明重生的先声。"
 POSTNUKE_Jaakko_Valtanen: "雅科·瓦尔塔宁"
 POLITICS_POSTNUKE_JAAKKO_VALTANEN_DESC: "雅科·瓦尔塔宁是位恪尽职守的军人。十五岁便投身继续战争，战后和平期让他在芬兰国防军的仕途平步青云，最终负责指挥北方海岸要塞群，守护新生的芬兰帝国并抵御俄国侵扰。\n\n当核弹落下时，他正携家人在乡间度假。眨眼间，芬兰的城市、人口与大半个议会灰飞烟灭。未受辐射污染的只剩广袤内陆——这些平素就难以管辖的偏远地带，在文官政府瓦解后更成无主之地。\n\n瓦尔塔宁勉强接受了军事管制委员会领袖之职。当芬兰国防军残部陷入权力斗争时，这位只知效忠国家的无派系将军，成了各方唯一认可的人选。如今执掌千湖之国，他必须将自己塑造成这个时代的曼纳海姆，带领芬兰渡过终极考验：旧世界的终结，以及——若他能成功——新世界的序章。"
 POSTNUKE_Jurgen_Echternach: "尤尔根·埃希特纳赫"
 POLITICS_POSTNUKE_JURGEN_ECHTERNACH_DESC: "新汉堡的居民鱼龙混杂，他们是在绝望中挣扎求生，才汇聚于此。他们当中，既有德意志的殖民者，也有躲避核爆的难民，更有劫后余生的斯拉夫人。如今，这群人同在一个屋檐下，在这片曾是大日耳曼国黑海沿岸最坚固堡垒的半岛上，艰难地开辟着自己的生存空间。新汉堡之名，源自那座古老的汉萨同盟港市。这里的居民以海为生，驾着那些摇摇欲坠、破败不堪的朽船烂柯，冒险远航，只为捕捞到些许未受污染的渔获。这无疑是一场苦难的挣扎，但他们矢志将其克服。这群人，一度兵戈相向、水火不容，如今却选择携手并肩，共同在这片废土上勉力维生。蒙天主垂怜，人们开始齐心协力，重建家园，巩固防卫，并着手开垦荒芜的土地。虽然远谈不上繁荣兴盛，但一缕梦想的余烬，已在人们心中悄然滋长。作为硕果仅存的德意志最大港城，它能否在这片炼狱般的新世界中重焕生机？\n\n尤尔根·埃希特纳赫，这位同样颠沛流离的难民，正领导着这群迷途的灵魂，在这个几近自我毁灭的世界中艰难前行。他肩负着一项艰巨的使命——缔造一个曾被世人视作痴人说梦的奇迹：一个由形形色色、仅因命运羁绊而聚合的族群所组成的共同体，要在这片严酷的、核爆后的焦土地狱中挣扎求存。尽管困难重重，他仍努力建立包容各方的制度，竭力让治下的人民得以存活。然而，作为新汉堡的市长，他深知，这个饱受辐射侵蚀的梦想究竟能否化为现实，抑或是会像那无数曾在核爆抹去人类千年文明后一同蒸发的前尘旧梦一般，终究是黄粱一梦，仍是未定之数。"
 POSTNUKE_Lazarenko: "亚历山大·拉扎连科"
 POLITICS_POSTNUKE_LAZARENKO_DESC: "对黑色联盟最为忠诚的战士，亦是其二号人物亚历山大·拉扎连科而言，地堡中的生活，已是一场无休无止的消耗。多年前那核武倾泻而下的光景，恍如昨日，历历在目。究竟是亚佐夫率先下达了发射核武的指令，还是日耳曼人的命令更早一步，他已然记忆模糊。\n\n\n他将大部分光阴都倾注于整合黑色联盟的残兵败将之上——其投入或许已远超必要，但他却身不由己，一遍遍地梳理、重塑着指挥体系，直至在他眼中尽善尽美。自踏入这该死的地堡以来，他还肩负着操练部队、维系士气的职责。对拉扎连科而言，后者委实更为棘手；如何鼓舞军心，他百思不得其解，相形之下，操练部队不过是信手拈来之事。\n\n然而，拉扎连科却开始扪心自问，此番作为究竟价值几何。这在他投身黑色联盟的漫长岁月中，尚属首次。日复一日，枯燥地重复着同样的差事…这已令他筋疲力尽。或许，与其徒劳地与之对抗，不如索性不再追问…"
 POSTNUKE_Lennart_Jedeur_Palmgren: "伦纳特·耶德乌尔-帕尔姆格伦"
 POLITICS_POSTNUKE_LENNART_JEDEUR_PALMGREN_DESC: "伦纳特·耶德乌尔-帕尔姆格伦凝望着哥得兰岛那崎岖不平、饱受风蚀的海岸，不禁发出一声叹息。自1949年起便在瑞典海军服役，数十年来，他忠诚地为他的国王、他的国家以及他的理想效力。以往，他曾将派驻哥得兰岛视为一次晋升，一件值得庆贺之事。毕竟，波罗的海本是德意志人或黑色联盟能够接近瑞典海岸的唯一孔道。\n\n如今，这使命的分量却已非同往日。随着鄂木斯克舰队的残部盘踞于厄兰岛，横渡这片海域的难民、补给、燃料与情报的洪流，皆已岌岌可危。他与麾下的水兵们，已同那遭受核辐射的斯德哥尔摩彻底隔绝，归乡之日遥遥无期。然而，职责的召唤仍在他们耳畔最后一次回荡。于是，为应对海盗的威胁，耶德乌尔-帕尔姆格伦已将哥得兰岛打造成他固若金汤的要塞，修建起简陋的船坞、陆港与工坊，以维系舰队，铸造弹药。无论付出何等代价，鄂木斯克休想染指瑞典的海岸分毫，而哥得兰岛必将成为北欧民族与德意志人民共同的避难绿洲。\n\n毕竟，即便瑞典已然倾颓，其忠贞子民的使命永无止境。"
 POSTNUKE_Mikhail_Khronopulos: "米哈伊尔·赫罗诺普洛斯"
 POLITICS_POSTNUKE_MIKHAIL_KHRONOPULOS_DESC: "数十年前，一支旧日苏维埃舰队发现，他们受困于堪察加半岛，四面楚歌——凛冽的严寒与残余的军阀纷至沓来，无一不想在西伯利亚的冻土之上攫取弹丸之地。如今，那支舰队早已灰飞烟灭，一支新的、由受诅咒的灵魂组成的舰队，却发现自己重蹈覆辙，再度搁浅。在米哈伊尔·赫罗诺普洛斯海军上将的统领下，黑色联盟远东舰队不幸沦为了历史重演的牺牲品，品尝着这宿命般的似曾相识。\n\n赫罗诺普洛斯上将从未想过事情会落到这般田地。他的舰队在“大审判”初期，所经历的战事有限，然而其肩负的任务依旧至关重要。负责监控联盟远东翼的动向，他为自己的舰船与水兵们能担当此番伟业的后卫而深感自豪，正是他们的存在，确保了日本永远无法出其不意地发动袭击。\n\n而今，他只能眼睁睁地看着手下的人们竭尽全力对抗严寒，唯恐舰船的舷窗碎裂，钢板变脆，水兵们自身冻僵；与此同时，其他人则在冻土之上挖掘着堑壕与碉堡。燃料已所剩无几，连维持士兵们的体温都已捉襟见肘，更遑论驱动战舰突出重围了。赫罗诺普洛斯只能徒劳地守望着他的后方，期盼着旗舰的巨炮至少能将那些残渣余孽暂时拒之门外。"
 POSTNUKE_Nikolai_Ogarkov: "尼古拉·奥加尔科夫"
 POLITICS_POSTNUKE_NIKOLAI_OGARKOV_DESC: "尼古拉·奥加尔科夫是一位幸存者。他曾是已然覆灭的西俄罗斯革命阵线的一名将军，在一九七零年后不久曾短暂投身联盟，甘愿身披另一袭军装，以践行那位已故“红色拿破仑”的未竟遗愿。然而，在“大审判”之前，亚佐夫为确保联盟的意识形态纯洁而发动了数轮清洗，他亦未能幸免。然而如今，随着核爆的尘埃落定，奥加尔科夫扛起了一项全新的使命。\n\n\n由奥加尔科夫与一众共产主义的坚守者们共同重建的西俄罗斯革命阵线，正描绘着一幅使俄罗斯挣脱纳粹魔爪与亚佐夫灭绝狂热的未来蓝图。为此，奥加尔科夫围绕着战时共产主义的理念，精心构建起一个崭新的社会秩序，只为在这末世浩劫中求得一线生机，并拯救水深火热的人民。毕竟，奥加尔科夫深知，舍此别无他法，能够守护俄罗斯免遭那些正在废土之上游荡的种种威胁。\n\n与此同时，奥加尔科夫与他的战士们，不得不忍受着斯巴达式清苦简朴的生活。守护西俄罗斯的使命，无疑是艰巨卓绝的。流窜的匪寇肆虐横行，任何未被他麾下赤卫队所庇护的定居点，都生活在恐惧的阴影之下。但是，每一名战士，每一位军官都深信不疑：今日所承受的一切苦难，都将为下一代人的革命铺设基石——那场革命，终将光复他们先辈所缔造的联盟。"
 POSTNUKE_NORAD: "北美防空司令部"
 POLITICS_POSTNUKE_NORAD_DESC: "北美防空司令部收容着未被在大城市核爆气化的最后一批将领与政客。他们蜗居在夏延山脉深处，自封为废土上唯一的合众国正统——尽管与外界的联系早已彻底断绝。如今他们蜷缩在夏延山脉深处，自诩为废土上唯一的美国合法政权——尽管已与外界彻底失联。\n\n夏延山脉埋藏着无数秘密，其中最庞大的当属这个地下掩体网络：配备先进精密通风系统、苟延残喘的发电机、可容纳整支营队的居住区，以及能联络从西点到关岛任何基地的指挥中枢。核爆降临当日，这些地堡瞬间爆满。\n\n北美防空司令部本应守护北美大陆的防空坚盾，却在核弹暴雨前仅拦截了寥寥数枚。司令部的将军们透过屏幕，眼睁睁看着华盛顿被原子烈火吞噬，他们成了自认的地球上最后的美利坚遗民。\n\n随着权力继承链的断裂，困守地堡的幸存者们建立了畸形的军政府。他们用铁律维持秩序，妄图从核废土中重建文明。但逐年浑浊的空气、接连熄火的发电机、愈发癫狂的统治者，都在预示这个地下王国终将被自我所吞噬——除非有人敢推开那扇锈蚀的铁门，去看看外面的世界是否还有呼吸。"
 POSTNUKE_Pyotr_Yakir: "彼得·亚基尔"
 POLITICS_POSTNUKE_PYOTR_YAKIR_DESC: "彼得·亚基尔，一位出人意表的领袖。作为亚佐夫政权倾轧下的无数牺牲品之一，当末日的核爆最终降临时，他早已沦为囚徒名册中一个冰冷的编号——那些尚能从事苦役，却又不够资格被送上炮火连天的前线的芸芸众生中的一员。他原以为自己将劳碌至死，未曾想，末日浩劫的降临，竟为那些被囚禁于托木斯克深埋地下的工厂囚牢中的囚徒们，带来了一线重生的渺茫契机。\n\n亚基尔秉持十二月党人之大义，坚信当致力于抚平俄罗斯母亲的累累伤痕，重现其自然的瑰丽与荣光。尽管他与同志们深知，此生此世恐难亲见梦想实现之日，但他们依然矢志不渝，为着那光复西伯利亚，让其重现昔日郁郁葱葱的森林、奔腾不息的河流与广袤无垠的平原的那一天而不懈奋斗——即便这看起来是何等遥不可及。\n\n然则在此之前，生存仍是第一要务。而在托木斯克饱经摧残的废墟之中，残存下来的，正是亚佐夫一心想要清除的各色人等：艺术家、持不同政见者，以及与他一般的梦想家。但凭借着原本足以支撑那座囚牢维系一代人之久的充裕食物与武器储备，新托木斯克的公民们正昂首阔步，勇往直前。毕竟，在他们挣脱了地下的囚笼之后，为俄罗斯重新注入生机，本就是他们命中注定的使命。"
 POSTNUKE_Swiss_Council: "瑞士联邦议会"
 POLITICS_POSTNUKE_SWISS_COUNCIL_DESC: "一八一五年维也纳会议明文规定，瑞士将永久奉行中立。自此而后，世界历经两次大战、数多席卷陆洲的纷争、对其国祚存续的无尽威胁，乃至整个文明社会的全然崩塌。然而瑞士中立之帜，至今仍屹立不倒。\n\n大日耳曼在其长达数十年的霸权时代，曾是瑞士心腹大患。为应对此等威胁，瑞士于阿尔卑斯山脉中苦心构筑了一套无所不包、盘根错节的地下工事系统。倘若当年德意志决意不再容忍瑞士的独立，这套系统便会派上用场。其坚固程度，堪与黑色联盟的地下堡垒分庭抗礼。如今，这些工事庇护着绝大多数瑞士国民，一切均由瑞士联邦议会负责保卫与管辖。\n\n纵然他们在工事中寻得了暂时的安宁，周遭的世界却已沦为一片不宜人居的荒芜废土。下一代的瑞士人，或许注定要在永不见天日的地下堡垒中成长，无缘一睹墙外世界的真实面貌。即便如此，联邦议会仍将殚精竭虑，守护这些深藏于阿尔卑斯山脉腹地的子民。"
 POSTNUKE_The_Chosen_One: "天选者"
 POSTNUKE_The_Chosen_One_desc: "占位符"
 POSTNUKE_Vasyl_Halasa: "瓦西里·哈拉萨"
 POLITICS_POSTNUKE_VASYL_HALASA_DESC: "瓦西尔·哈拉萨为乌克兰独立的事业奋战终生，却只迎来一个又一个暴君。当乌克兰起义军促成苏联解体时，德国盟友立即调转枪口，企图将乌克兰变为新的殖民粮仓。而当德国秩序崩溃，黑色联盟又趁虚而入，将乌克兰榨取殆尽。无论他如何反抗，铁靴始终踩在祖国的咽喉上。\n\n直至核火降临——这是哈拉萨从未预见的审判。德俄两大压迫者在原子烈火中同归于尽，而乌克兰也未能幸免：肥沃农田化为辐射荒原，山川河流尽成死域。这位极端民族主义者再度扛起枪，但此刻战斗已非为独立建国，而是为守护仅存的净土，抵御掠夺者、外来者，以及旧日压迫者的残部。乌克兰起义军厉兵秣马，他们知道，那些宿敌终将在放射性尘暴中卷土重来。"
 POSTNUKE_Vasyl_Kuk: "瓦西里·库克"
 POLITICS_POSTNUKE_VASYL_KUK_DESC: "占位符"
 POSTNUKE_Vladimir_Chernavin: "弗拉基米尔·切尔纳文"
 POLITICS_POSTNUKE_VLADIMIR_CHERNAVIN_DESC: "\"大审判\"的余烬仍在波罗的海燃烧。黑色联盟舰队残部——这支昔日的海上雄师，如今不得不盘踞在厄兰岛上。核爆摧毁了世界，也让这支舰队困在这座维京故岛上，沦为海盗要塞。而他们曾引以为傲的战舰，也不过是纸上谈兵的威慑。\n\n海军上将弗拉基米尔·切尔纳温深知现状的荒谬。他的水兵们为燃料、淡水和食物四处劫掠，与当地人的补给交易也演变成无休止的冲突。核爆之后，文明的伪装也随之崩塌。如今，切尔纳温的舰队在这片辐射地狱中，以\"大审判\"之名行海盗之实，劫掠残存的定居点和船只——这就是§R大审判§留给他们的\"遗产\"。\n\n这支舰队的存在可悲至极：军内军纪日渐涣散，瑞典人的反抗情绪日益高涨。本就稀缺的弹药近乎耗尽。而切尔纳文只能用\"征服哥特兰\"的幻想维系军心——若能歼灭瑞典海军残部，他们就能成为波罗的海的无冕之王。但每一天过去，这个目标都更像是一个垂死之人的妄想。"
 POSTNUKE_Vladimir_Pikalov: "弗拉基米尔·皮卡洛夫"
 POLITICS_POSTNUKE_VLADIMIR_PIKALOV_DESC: "净化辐射污染是一项艰巨、危险且代价高昂的工作。辐射往往潜藏隐匿，其恶果往往在多年之后，当人们因癌症、骨髓衰竭以及身体DNA的生理性崩坏而日渐衰弱时，才会显现。然而，这项工作必须完成，唯有如此，才能阻止毒素进一步渗透伊尔库茨克的河流，并最终——苍天在上，但愿不会——污染贝加尔湖。\n\n这份重担落在了弗拉基米尔·皮卡洛夫的肩上。他曾是黑色联盟防化部队的一名军官——那是一支专门为应对俄罗斯全境的化学、生物、辐射及核威胁而组建的部队。作为废土之上少数几支真正有能力处理§R大审判§!在俄罗斯母亲身上留下的恐怖创伤的力量之一，他与同袍们抛却了昔日对亚佐夫的效忠，组建起一个军事管辖机构，期望能净化俄罗斯远东地区的辐射污染。这些人矢志创造一个新世界，一个后代俄罗斯人能够安居乐业、无需再恐惧辐射病害侵扰的世界。\n\n此路绝非坦途。辐射无孔不入，它会渗透每一棵树木、每一只动物，以及每一个它所能触及的分子。然而，一手紧握盖革计数器，一手紧握手枪，皮卡洛夫和他的部下毅然踏上了征途，去完成那看似不可能的任务：让俄罗斯摆脱核爆的创痕，重焕昔日荣光。军官们悲叹，此生恐怕无缘亲见这一目标的实现。他们中的许多人已经感受到了致命剂量辐射的侵害。许多人早已怀疑自己正罹患癌症。纵然如此，他们依然奋勇向前，不懈尝试，因为他们深知，他们的子孙后代，理应继承一个比他们此刻所忍受的，更加美好的世界。"
 POSTNUKE_Yuri_Drozdov: "尤里·德罗兹多夫"
 POLITICS_POSTNUKE_YURI_DROZDOV_DESC: "核弹落下前，德罗兹多夫是黑盟最狂热的将领之一。他对亚佐夫的信仰坚不可摧，在抗击德军的战役中愈发步入偏执。当德罗兹多夫的军队踏上圣彼得堡的土地时，他正沐浴在无上荣光中——直至核爆将这座俄罗斯皇冠上的明珠，化为辐射尘埃覆盖的废墟。\n\n但德罗兹多夫的信仰纹丝未动。即便面对满目疮痍、十室九空的绝境，他仍坚信战局可挽。于是彼得格勒的统治一切如旧：黑盟军靴继续碾轧着街道，士兵保持最高战备，平民被勒令榨尽骨髓供养战争机器——即便这台机器早已支离破碎。\n\n鄂木斯克方面音讯全无。德罗兹多夫及其小集团却坚信：末日不过是战略休整，反攻指日可待。他们将肃清每一个信仰动摇者，在永不停息的辐射尘暴中，等待那个永远不会到来的进军命令。"
 POSTNUKE_Yuri_Orlov: "尤里·奥尔洛夫"
 POLITICS_POSTNUKE_YURI_ORLOV_DESC: "旧世界终结前，尤里·奥尔洛夫不过是阿尔汉格尔斯克的一名农学家。在黑色联盟的铁腕统治下，他默默埋首于极地作物研究，试图在这片冻土上培育出能存活的种子。在这场艰苦的战斗，他和同事们最终研发出了耐寒作物品种。这而他隐秘的左倾思想，自始至终都深藏不露。\n\n核弹落下后，这座城市及其周遭村镇陷入了无政府状态。为避免彻底陷入混乱，奥尔洛夫组建了\"阿尔汉格尔斯克庇护所\"——一个在核爆阴云下所诞生出的高度民主的公有化社会。它不再执著于依附任何意识形态，只求在俄罗斯尚未开发的荒原上延续文明火种。\n\n如今，庇护所的围墙内聚集着俄罗斯最后的知识阶层。奥尔洛夫带领他们践行着斯巴达式生存——没有英雄主义，只有播种器与辐射探测器的滴答声在冻原上回响。"
 POSTNUKE_Vyacheslav_Ivankov: "维亚切斯拉夫·伊万科夫"
 POLITICS_POSTNUKE_VYACHESLAV_IVANKOV_DESC: "谁言末世不需要速度？文明的崩塌恰是劫掠、征服与探险的良机。维亚切斯拉夫·伊万科夫深谙此道——即便在黑色联盟极权统治时期，像他这样的人也从不缺生意伙伴。\n\n如今俄罗斯中西部陷入无政府状态，伊万科夫果断出手：他占领了萨马拉的地下工厂，夺取大量库存车辆。靠着这些钢铁野兽和手下暴徒的数十万件武器，这支涡轮增压的疯狂车队肆虐乡野，射杀反抗者，碾压屈服者，将劫掠之物塞满每辆车的后备箱。\n\n这一切当然别有深意。如同所有草莽枭雄，伊万科夫梦想建立其自己的私人王国。只要能得到技术、人力和改装知识，把这堆锈铁升级成更恐怖的战争机器，梦想便触手可及。眼下，他继续在俄罗斯草原上狂飙，遇险便龟缩于伏尔加河防线，劫掠一切未被钉牢的物件。那面写着\"唯奉己律\"的黑旗，将成为伏尔加河西岸唯一的律法。"
