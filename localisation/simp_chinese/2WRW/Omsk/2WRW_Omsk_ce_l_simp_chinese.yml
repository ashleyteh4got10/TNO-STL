 OMS_local_defence_project_desc:0 "终于，我们将俄罗斯大地上众多的叛徒和分裂分子统统一网打尽，黑色联盟真正向全俄罗斯证明了，我们有资格带领俄罗斯迎接£GFX_OMS_great_trial_texticon §x大审判§!。\n\n虽说£GFX_OMS_great_trial_texticon §x大审判§!终将到来，但如果我们准备不周，让西方的恶魔和豺狼踏上我们的土地，俄罗斯大地就会毁于£GFX_OMS_great_trial_texticon §x大审判§!完成之前。经过黑色联盟众多高级干员的评估，我们虽然统一了俄罗斯大地，但眼下的俄罗斯可谓混乱不堪，各个地方的行政，金融，军事等体系各不相同，人民只是暂时服从我们的枪口，而不是真正认同我们的复兴大业，我们在很多新统治地区尚不能建立完全的统治，众多匪徒和反抗势力宁愿认同西方的条顿野兽或是失败者布尔什维克，也不愿认同我们。如果我们就以目前这种状况去应对迫在眉睫的入侵或是主动开启£GFX_OMS_great_trial_texticon §x大审判§!的话，我们会比敌人先一步倒下。\n\n因此，£GFX_OMS_dmitry_yazov_texticon §Y亚佐夫总司令§!认为，在开启真正的£GFX_OMS_great_trial_texticon §x大审判§!之前，我们必须做好更充足的准备，第一步就是要建设好我们的俄罗斯本土，我们将建立起更加集中统一的体制，将整个俄罗斯打造为钢铁般的熔炉，凝聚起国家人心，为在本土毁灭西方野兽做好准备。"
 OMS_leagcy_of_siberian_plan_desc: "毋庸置疑，布哈林是俄罗斯历史上最大的叛徒，懦夫，他让伟大的俄罗斯母亲沦陷于条顿恶魔之手，让无数俄罗斯的儿女死于非命。但从客观上来说，这个叛徒还是为俄罗斯留下了那么一点微不足道的东西：西伯利亚建设计划。这个计划对荒芜的西伯利亚进行了一定程度的开发。在我们统一俄罗斯之前，这个计划也在其他分裂势力的手上得到了一定程度的发展，虽然这些家伙浪费了太多的发展效率，但在消灭他们之后，我们还是得到了一笔可观的工业财富。\n\n经过评估后，我们的经济部长做出了裁决：我们会保留本地具备充分建设潜力的相关设施和资源，剩下的部分都将全部被拆除运走，拉到我们未来规划£GFX_OMS_great_trial_texticon §x大审判§!的地点去。进行更加高效的建设和利用。这些工业遗产都将为£GFX_OMS_great_trial_texticon §x大审判§!的事业奠基，转化为毁灭敌寇的每一颗子弹，每一枚炮弹。"
 OMS_redefine_the_resource_desc: "£GFX_OMS_great_trial_texticon §x大审判§!需要无数的资源。铁，油，铝等对于我们的战备工业都极具价值，但我们的敌人可不会等着我们慢慢的开发出资源去毁灭他们，他们势必主动对我们发动入侵，我们绝不能让这些宝贵的资源未经开发便落入敌手，必须进一步加快国内资源的开发进度。\n\n我们已耽误了太多时间，自身的工业开发能力也有所不足，但我们仍有弥补的方法：人。俄罗斯大地上最不缺的就是人力。为了£GFX_OMS_great_trial_texticon §x大审判§!的事业，我们将穷尽一切投入到工业和资源之上。没有足够的机械，我们就去征发干员，囚犯等投入到开采中去，没有足够的高炉，我们就用众多的小型设备代替。为了£GFX_OMS_great_trial_texticon §x大审判§!，一切可以开发的资源都必须得到妥善的利用。"
 OMS_repair_the_old_thing_desc: "旧苏联时代曾经是俄罗斯最辉煌的时刻，欧洲前列的工业能力，成千上万的工业设备，知识渊博的工业人才。可这些东西都被西方的纳粹入侵者所毁灭，这些恶魔摧毁了一切，只留给我们破烂不堪的机械，残垣断壁的居所，以及一群愚昧无知的民众。这些都是德国贼寇对俄罗斯人民所犯下的血债，我们都会向他们找回的。\n\n虽然纳粹野兽们破坏了众多，但坚强的俄罗斯人还是尽可能了保留了众多苏联时代的资源，埋在地下的机器设备，研究所里未竟的科研成果，再到人才培养手册等等，我们必须将这些苏联时代留下来的事物尽可能的整理与修缮，为向西方野兽们的复仇做好条件。"
 OMS_militarize_the_industry_desc: "£GFX_OMS_great_trial_texticon §x大审判§!的事业需要成千上万的武器，上到热核，导弹到飞机，下到士兵们使用的步枪，通讯仪，支援火炮，这些都需要强大的工业才能够进行生产，我们的工业必须做到能够支撑我们的部队从西俄罗斯出发，能够在上千公里的战线上为我们的士兵和干员们提供足够的武器弹药，让他们能够与西方敌寇进行长时间的交战，能够以强无敌的火力摧毁敌人的一切，直到彻底的毁灭他们。\n\n要实现这一切，我们就必须让我们的工业体系进一步的运转起来，彻底的成为熔炼全国力量的大熔炉。整个工业体系都必须进行全方面的优化，我们的政府部门将全功率的运行起来，改造我们的工业体系，使之能够为£GFX_OMS_great_trial_texticon §x大审判§!的神圣事业而服务。多余的所谓赢利和发展需求都将被舍弃，一切要向着军事化生产的终极目标看齐，直至完成德寇被抹除的神圣目标。"
 OMS_resettle_the_pop_desc: "在£GFX_OMS_great_trial_texticon §x大审判§!的计划中，我们首先会从莫斯科地区开始，向整个东欧，直到纳粹本土发动一系列的攻击，从云爆弹、生物武器到化学武器不等，我们会把所有大规模杀伤性的武器都将打到他们的土地上，毁灭他们的一切。但肯定的是，以条顿野兽的丧心病狂程度，他们必然会对我们的土地进行同等的轰炸，我们的土地也会遭到同样的毁灭，战争打的就是耐性，我们必须比野兽更具备生存的能力，才能真正超越死亡。£GFX_OMS_great_trial_texticon §x大审判§!的终末就是我们的人民能够跨出地堡，彻底将西方野兽扼杀在牢笼之内。为此，我们将把边境附近的大中城市全部进行人口搬迁工作，他们将会搬到西伯利亚地区，那里是£GFX_OMS_great_trial_texticon §x大审判§!的最后基地，他们将会在那里住下来，成为杀死西方野兽们的最后力量。"
 OMS_the_russia_city_desc: "在我们最聪明的头脑规划之中，£GFX_OMS_great_trial_texticon §x大审判§!，这场民族复仇之战，最终必然发展为一场热核战争。而要伟大的俄罗斯人民能够撑过这场末日之战，我们就必须建立起最坚固的堡垒，让我们的人民能够在复仇之前存活下来，在末日之后能够以最佳的状态爬出废土，完成£GFX_OMS_great_trial_texticon §x大审判§!的最终阶段，杀光所有德国人。\n\n所幸，在之前备战德寇可能的入侵之前，我们已经在鄂木斯克地区进行了一系列的城市地下掩体网络工程建设，在这些建设之中，我们获取了很多经验，也收获了很多的教训。我们将会投入一笔巨款，对所有计划中的生存城市进行改造，我们不止需要一个鄂木斯克，我们需要全国都成为鄂木斯克。"
 OMS_will_bulit_by_steel_and_gears_desc: "俄罗斯必须能够在£GFX_OMS_great_trial_texticon §x大审判§!降临之前，能够强大到能够不被敌人的压力所吓倒，不被敌人的武器所轻易摧毁，要想实现这些，足够的城市化建设是必不可少的。但眼下，我们的干员和人民每日都需要长时间的辛勤工作，£GFX_OMS_great_trial_texticon §x大审判§!这根弦已经绷得他们太紧，我们不能让他们彻底绷断，而是要让他们学会适应与习惯。\n\n俄罗斯的男女老少的生存都系于城市建设的成败与否，我们将进一步开展城市相关建设，为我们的人民和干员们提供岗位，他们将会在工作上学会什么是纪律，什么是力量，并以此为£GFX_OMS_great_trial_texticon §x大审判§!的事业添砖加瓦，成为£GFX_OMS_great_trial_texticon §x大审判§!的一部分。"
 OMS_and_the_clocks_will_be_punctual_desc: "随着我们所开展的城市化建设工作的进行，民族复兴的大业终于焕发了新的生机。通过城市化建设的深入进行，与大量生活资源的投入，干员们和士兵们的不满已经逐步被压制，而通过长期的纪律教育，他们已经学会了如齿轮一般咬合在一起，而联盟也随之开展了一系列的宣传活动，在我们的综合努力下， 我们的生产效率已经再创新高，他们对£GFX_OMS_great_trial_texticon §x大审判§!的恐惧正在进一步的消退下去。\n\n§x末日审判的倒计时正在逐步降临，而我们正将它有条不紊的推动下去。§!"
 OMS_expand_the_potemkin_desc: "在我们仍然是一个地区性势力的时候，我们的£GFX_OMS_dmitry_yazov_texticon §Y亚佐夫总司令§!和外务部长亚历山大.萨哈罗夫斯基就天才般的提出了通过伪装性宣传，骗取外国援助的波将金行动，这一行动让我们从美国人和日本人这些潜在的罪人手上都拿到了大量的发展资源，这一计划进行了多次扩展，并取得了丰富的成果。当那些败类还在为自己的所谓善心和利益而骄傲不已的时候，我们却已经收获了众多宝贵的资源，这些资源都成为了我们收复俄罗斯大地重要的资源。\n\n但如今，我们已经是整个俄罗斯大地的主人。为了£GFX_OMS_great_trial_texticon §x大审判§!，我们需要进一步的扩大军事规模，但这势必与我们之前所宣传的“铸剑为犁”所冲突，他们会逐步收回对我们的支持，甚至可能对我们多加刺探，威胁到£GFX_OMS_great_trial_texticon §x大审判§!事业的顺利进行。因此，我们必须进一步扩大波将金行动，我们将对不同的外国群体进行分门别类的研究，根据他们的观点和爱好进行不同的宣传，让这些西方世界的愚夫愚妇再一次为我们慷慨解囊。\n\n等到£GFX_OMS_great_trial_texticon §x大审判§!降临之际，我们会让他们死的没有痛苦一点的。"
 OMS_foreigns_arent_know_at_all_desc: "自从我们统一俄罗斯大地之后，外界对我们的刺探就开始无孔不入的进行起来。移民，新闻记者，工业团队，回国的移民，甚至还有间谍跳伞进入我国进行刺探。纳粹军国主义者们迫切的想要得到我们对他们有所威胁的情报来在国内煽动民众进行再一次入侵，西方堕落者们想通过撕破我们的完美形象来为自己谋取私利，就连他们国内的某些和平主义者都为了逃避和德寇的冲突，试图揭穿我们以中止援助。\n\n他们谁都别想得逞。我们的情报和外交部门都将行动起来，在国内外都开展全方面的行动，社会上的监视和登记将揭穿那些隐藏的间谍踪迹，大规模的外界宣传工作将继续推行下去，那些软弱者们将会被无穷无尽的纠纷所干扰，直到他们彻底闭嘴。\n\n俄罗斯将成为世界上的一个繁荣富强的民主堡垒，一直为对抗纳粹而不懈努力。\n\n直到£GFX_OMS_great_trial_texticon §x大审判§!之终幕"
 OMS_but_we_knows_everything_desc: "在之前的岁月中，为了保障£GFX_OMS_great_trial_texticon §x大审判§!的顺利进军，我们在众多重要地区都开展了非法移民工作，从莫斯科到波兰，从美国到欧洲，大量的俄罗斯非法移民都在国外安居下来。他们表面上有着不同的身份，从律师到工人，从奴隶到佃户，他们以不同的身份在海外俄罗斯人社区里建立起种种不同的势力，形成了一道道，一张张海外的情报网，让众多俄罗斯流亡者社区都闭上了嘴。\n\n眼下正是发挥他们作用的又一个好时机，在£GFX_OMS_great_trial_texticon §x大审判§!开始之前，我们将动员起我们所有的非法移民开展相关活动，在欧洲的移民们要主动提供情报，为向柏林之进军提供帮助，在美洲等其他地区的非法移民要积极造势，并尽可能的扰乱视听，保障世界其他地区的势力在£GFX_OMS_great_trial_texticon §x大审判§!开展之后能够继续长时间的袖手旁观下去。"
 OMS_their_technologys_desc: "原处审判的失败让我们的国家在四分五裂之中蹉跎了过多的岁月，当黑色联盟战胜一个个叛徒和懦夫之后，放眼往去，俄罗斯的工业已经彻底落后于世界上的众多国家，一度曾是欧洲前列的工业国的我们，现在仍处于世界最落后的水平之上。无论是外交层面还是秘密战线送来的情报都表明，不要说我们可能要对抗的美日堕落者，就拿我们必将面对的西方纳粹野兽来说，即使是他们的傀儡仆从，那些所谓平等盟国，甚至是专员辖区，我们现在的工业设备水平都落后于他们，这对于我们的£GFX_OMS_great_trial_texticon §x大审判§!事业是极为不利的。\n\n£GFX_OMS_dmitry_yazov_texticon §Y亚佐夫总司令§!已经正式下令，国家发展部将于外交部进行对接，根据£GFX_OMS_great_trial_texticon §x大审判§!的目标需要，获取这些必要的工业设备。能够买过来的，我们就想办法买到，买不到的，我们就想办法去偷，去抢。我们必须让那些先进的设备能够完全服务于我们的£GFX_OMS_great_trial_texticon §x大审判§!，如果我们得不到，那就毁掉。"
 OMS_and_their_skills_desc: "即使是有了先进的设备，我们还要战胜的问题就是工业知识上的不足，两度败于德寇之手的灾难后果之一，就是让俄罗斯在教育方面堕入了黑暗，至少一代人在入侵之后失去了本应有的受教育的资格，多年的国土分裂更是延长了这一结果，直接让我们的国土上多了一代以上的文盲。即使黑色联盟已经拼尽全力，以十多年的力量扫平了软弱与堕落，将俄罗斯从黑暗中拯救出来，但苦果已经酿成，俄罗斯大地已经容不得我们再去花上十几年补课了。\n\n为了有资格与£GFX_OMS_teutons_texticon §q大日耳曼国§!进行最后对决，我们必须学会弯道超车，国外建设的情报网和非法移民组织将在此时派上用场，我们将“诚恳的”邀请那些拥有技术的工人们到来我们的土地上帮助我们建设俄罗斯，通过各种方式榨干他们的技术，并做出相关总结，为我们接下来的事业所用。\n\n如果他们不愿意，那么偶尔出现失踪也会是很正常的。"
 OMS_will_service_for_us_desc: "其实，我们所能利用起来的不止是工业。经过国家发展部的针对研究。无论是西方堕落者还是£GFX_OMS_teutons_texticon §q大日耳曼国§!这一俄罗斯人的终极死敌，在多年之间，他们搞出了不少新奇而又先进的玩意，为了保证赢利，他们把这些东西都申请了专利，然后通过这些所谓专利来谋取利益，顺便宣扬所谓遵纪守法的美名。\n\n可我们不受这些东西的限制，在接下来的岁月里，我们将会针对我们所需要的东西通通进行相关仿制和逆向工作，我们会学会如何生产与制造。这些东西都会被用到接下来的£GFX_OMS_great_trial_texticon §x大审判§!事业之中。那些堕落者的法则我们通通无须遵守，在£GFX_OMS_great_trial_texticon §x大审判§!的烈焰之下，众生平等。"
 OMS_a_new_siberian_plan_desc: "在之前的岁月中，为了战胜我们国土上的各路叛匪和异见者，我们在西西伯利亚地区开展了一系列的综合发展计划，这些包含着工、农、运输。资源等方面的综合发展计划让我们在短时间内实现了快速的飞跃，推动了黑色联盟的教育和研究现代化。我们也正是利用这样的力量打垮了一个又一个劲敌，将俄罗斯大地从黑暗带到光明。\n\n但对于接下来的£GFX_OMS_great_trial_texticon §x大审判§!事业来说，仅靠一个西西伯利亚是完全不够的，俄罗斯的重建工程必须立刻提上日程，我们将会以在西西伯利亚建设的经验向整个俄罗斯，特别是中西伯利亚和远东普及我们的发展经验，无论是资源开发还是生产研究都需要得到全面的现代化。只有如此，黑色联盟勇敢的战士们才能准备好一切，克服万难，救俄罗斯于水火。"
 OMS_central_siberian_development_desc: "中西伯利亚曾是布哈林时代优先发展的重点地区。在那时，旧苏联的领导人们希望以中西伯利亚作为预备的发展基地，来应对可能的西方入侵，可他们却为所谓的稳定与团结纵容诸多非爱国者和唯利是图的工厂主主导这一地区的发展，导致整个中西伯利亚开发计划混乱不堪，生产了过多对国防事业无所助益的非必要奢侈品，而不是国家所需要的钢铁与武器。这才导致了祖国败于纳粹野兽，俄罗斯大地堕入黑暗。\n\n现在我们来主导这一地区的开发。首先，我们将会对这一地区的设施进行重新修缮和规划，使之能够纳入到我们的工业发展体系之中，随后，我们会实现全方面的工业国有化和和军事化，整个中西伯利亚的工业都将被纳入£GFX_OMS_great_trial_texticon §x大审判§!的事业之中，俄罗斯的精华将真正能够不再为个体之私欲，而是为新俄罗斯的复仇大业而服务。"
 OMS_most_effectiveness_way_desc: "民族复仇之大业离不开黑色联盟麾下的军队，他们在我们最黑暗的时代作为先锋拯救了俄罗斯，为俄罗斯带来了公义与力量。但在拯救俄罗斯的过程中，军队已经付出了太多太多，铁路系统，工业，科研，以及国家堡垒化建设。我们的军队参与并主导了太多太多，虽然我们一直在进行扩军建设，但眼下军队的有生力量已经出现了缺口，必须进行新一轮的投入。\n\n在经过商讨之后，£GFX_OMS_dmitry_yazov_texticon §Y亚佐夫总司令§!已经下达命令。联盟将为军队发展提供更多的资金投入，这些资金将在扩张军队人数的同时，对黑色联盟的军队进行全方面发展。无论是改进军队的组织结构，还是加快实现军队通讯到班，支援火力到排等一系列武器装备建设，从武器到组织，从纪律到训练，黑色联盟的军队将得到全方面的提升。"
 OMS_far_eastern_development_desc: "一直以来，远东都是俄罗斯发展最贫困，最困难的地区，在我们之前的所有人都不怎么重视远东事业的建设。如果没有战争，我们也不会过多进行发展。\n\n但在£GFX_OMS_great_trial_texticon §x大审判§!的目标之下，远东却有了新的意义。这一地区偏远且落后，长年得不到发展也使得各个大国对这里的价值评估都处于一个极其低下的水平。敌人对我们的威胁评估也不会优先考虑到这一地区，这正是我们的机会。\n\n待到£GFX_OMS_great_trial_texticon §x大审判§!执行期间，俄罗斯大地上的众多重要城市都将被敌寇的原子武器进行优先攻击，虽说我们已经为抵御原子烈焰修筑了无数地堡，但这还远远不够，为了保全更多的俄罗斯人能够活过£GFX_OMS_great_trial_texticon §x大审判§!，对远东的开发将提上日程，敌人万万不会想到，我们会在他们意想不到的地方隐藏下来，并在原子烈焰燃尽之后，能够走出地堡，完成最后审判之命令。"
 OMS_use_every_things_desc: "俄罗斯的万民都在为£GFX_OMS_great_trial_texticon §x大审判§!的神圣事业而贡献一切，我们的工业也不会例外。长期以来，限制西伯利亚工业进一步发展的，就是我国落后的电力系统。在原初审判之后，俄罗斯长期处于分裂和无政府状态，各路分裂者只知利用不知建设和维护，我们的工业长期还是使用旧苏维埃时代的电力网络，工业知识的短缺更是使得电力系统维护都出现了不足，这直接导致了西伯利亚的工业开发本应能够更近一步，却因为客观条件的限制而不得不中止。\n\n对西伯利亚工业的改造将进一步开展，我们将动员众多民众和工业干员们参与到西伯利亚工业体系的翻新之中，利用起我们所能利用的一切，全方面改造和建设西伯利亚地区的工业和配套设施，使得西伯利亚工业能够摆脱旧日的桎梏，快速进入现代化之中。"
 OMS_ghost_in_the_shadow_desc: "我们所要面对的威胁不止来自于西方的野兽，还有国内的反动敌人。外界的敌人试图找到外贸的位置，内部的那些修正主义者、腐败分子们则试图躲藏在我们的队伍之中，影响我们的工人和干员们为£GFX_OMS_great_trial_texticon §x大审判§!事业所进行的生产活动，甚至为了推翻我们，他们不惜出卖自己的灵魂，去跟那些该死的纳粹野兽和西方堕落者合作，出卖我们的工厂位置来换取所谓的金钱和更好的合作者位置，他们必须被从肉体到灵魂上全面消灭。\n\n只进行消灭是不够的，我们必须建立起更加严密的监视体系。为了保证£GFX_OMS_great_trial_texticon §x大审判§!事业的安全进行，一个专门的渗透项目将被展开，我们将在全国范围内进一步铺开我们的特工系统，所有工厂的部门活动都将被记录下来，我们的人民和干员的一切秘密都必须被我们所知晓。"
 OMS_darkness_in_the_world_desc: "£GFX_OMS_great_trial_texticon §x大审判§!的烈焰会燃尽万物，但我们却能控制这烈焰落到何处。经过我们对于西方野兽们无孔不入的情报渗透，我们所能知道的是，他们预定打击的地点不止我们的城市，我们的众多工厂也是他们所要打击的对象。一旦战争开始，为了阻止我们伸张公义，他们必然会优先打击我们的工业，阻止我们的工厂为黑色联盟勇敢的士兵提供足够的武器，让我们的人民像过去一样冻死，饿死。\n\n要阻止这一切，最好的方法就是把我们的工厂都藏起来。在国家防御计划的规划下，我们已经在全国诸多地区建立起全方面的地堡与掩体系统。接下来，我们要把我们所营建的生产部门也和这些系统联通起来，我们将通过这些无孔不入的掩体建立起世界上最大的地下运输线，同时建立伪装起来的工业、防空、反间谍等系统，误导我们的敌人进行无意义的攻击。当他们把宝贵的炸弹丢到虚假的生产线上时，我们真正的生产能力却能够得以保全，为联盟的公义之战继续高效运作。 "
 OMS_hearts_of_war_desc: "万事万物的发展都需要一个强有力的领导，就像人体离不开心脏一样。俄罗斯正是有了黑色联盟这一钢铁般的心脏才得以超越堕落与庸俗。军工业也一样，在国家发展部提交的报告之中，中西伯利亚的众多工业虽然生产众多，但因为在统一后缺乏强有力的工业企业引领，没能适应现代化的流水线生产模式，效率反而不如过去的时代。而历史上的我们，也不乏这样强有力的工业企业，旧苏联时代的众多的军用生产企业在俄罗斯统一时期都生产出了无数的军用产品，在国家统一之后，它们因为各种原因被短暂搁置起来。但在£GFX_OMS_great_trial_texticon §x大审判§!将至的现在，我们将重新动员起这些强有力的工业企业，以它们为引领进行全方面战争准备和建设。"
 OMS_humans_are_gears_desc: "虽然黑色联盟为建设祖国已经竭尽全力，但一个不得不承认的现实是，我们现在还是无法克服远东地区天然的不足，我们的铁路运输系统已经为£GFX_OMS_great_trial_texticon §x大审判§!的事业拼尽全力，维持在远东地区的工业运行便已是极限，再想要对远东进行完全的开发建设的话，必然耽误我们正好紧锣密鼓筹划的£GFX_OMS_great_trial_texticon §x大审判§!事业。\n\n因此，经过投票，黑色联盟的诸位委员们一致同意，大规模征发远东地区的人力进行工业建设，所有在远东地区被抓获的犯人都就地开始劳动，远东地区的工业干员们和士兵也需要参与进去，恢复旧时代苏联时期的带头工业，以人的力量克服自然的困难。"
 OMS_atomic_hearts_desc: "£GFX_OMS_great_trial_texticon §x大审判§!绝非请客吃饭，而是条顿和俄罗斯两个民族生与死的最终决战。为取得这场民族复兴之战的胜利，我们的军官们进行了一系列的推演，所有的结果都指向了一个现实：无论是我们还是£GFX_OMS_teutons_texticon §q大日耳曼国§!谁首先挑起战争，那些纳粹猪狗都会首先把原子炸弹抛向我们，而那些西方堕落者们却不会立刻开始进行互相毁灭，他们贪生怕死的个性决定了他们会看着我们被毁灭。\n\n为杜绝这种可能，我们必须具备足够的互相毁灭能力，之前的岁月里所制订的只毁灭条顿蛮族的计划是远远不够的，我们必须进一步的扩大原子武器的生产规模和投放能力，我们不止要能够毁灭纳粹，还要将我们的核武器投放到美国，投放到日本，所有的罪人都将承受我们复仇的怒火，£GFX_OMS_great_trial_texticon §x大审判§!面前人人平等。"
 OMS_research_minuteman_technology_desc: "时代在发展，科技在进步。在黑色联盟追赶世界前沿科技的过程之中，世界军事领域的反导领域已经发生了重大变化，传统的中短程导弹拦截率正在逐步上升，单靠战略轰炸机直接飞往一个国家进行全面轰炸的存活率逐步下降，而我们的西方敌人们现在就拥有着无数我们闻所未闻的反导系统，仅靠我们自主研发的中短程导弹和武器是无法直接毁灭纳粹的大城市的。\n\n通过我们秘密情报部门的运作，我们已经获取了美国在60年代就研发并投入使用的“民兵”洲际导弹，这些能够飞出大气层的流星具备着我们难以想象的力量，我们将对它进行全方面的研究和仿制，研究出属于我们自己的天外流星，让它能够冲破条顿野兽的防护，击穿纳粹的心脏。"
 OMS_death_hand_system_desc: "在研究£GFX_OMS_great_trial_texticon §x大审判§!进行的全过程之中，一个问题经过摆在了黑色联盟的各位面前：灭绝人性的纳粹具备着足够毁灭全球的核武器力量，一旦他们下定决心发动核突袭，在突然袭击的同时将绝大多数原子武器都扔到俄罗斯，我们的高层就有着被毁灭的风险。虽然我们已经为此修筑了足够的地堡进行应对，但如果我们的高层在核袭击中毁灭，我们的反击便缺少了头脑，届时一旦反击不及时，我们的核反击就无法引发全世界范围内的连锁核毁灭，我们的努力就都白费了。\n\n因此，我们必须能够建立起能够在脱离我们高层之后还能继续引发核反击的相关武器系统，经过我们的科学家讨论，这套系统将被命名为“边缘”系统，实际名字为“死神之手”系统，该系统将自动检测我们高层与之的联络，一旦£GFX_OMS_great_trial_texticon §x大审判§!正式开始，这个系统没有检测到我们的回应，它将自动识别为我们的高层已经毁于纳粹的核武器袭击，将我们提前预备好的核武器都打出去，完成我们准备好的毁灭计划。"
 OMS_trident_and_northernstar_desc: "在当今的世界核打击学说之中，除了陆基核武器的具体使用，海基核打击也是不可或缺的一部分。对我们预备的£GFX_OMS_great_trial_texticon §x大审判§!事业来说，要阻挡我们复仇的脚步，纳粹定然会在与我们接壤的一切边境地区进行集中的布防，但我们海军的羸弱人所共知，他们定然会对此有所忽视，这就会是我们突破的关键。\n\n经过我们特工们的优秀工作，我们已经成功获取了纳粹和美国在过去的岁月中所研究的重要成果：三叉戟海基导弹和北极星海基导弹的关键数据，这些潜射导弹可以被水下的潜艇所发射出去。我们所要做的就是对这些东西进行全方面的仿制，并为它们装上核弹头。我们的敌人有着比我们更多，更广的海域，他们不可能把每一片海都看死。只要我们的力量能够躲过他们的眼线，在他们未能看到的地方，海中的利剑就将直冲苍穹，让条顿蛮族明白什么叫死从天降！"
 OMS_atomic_powers_desc: "原子时代，爱即疯狂。在£GFX_OMS_great_trial_texticon §x大审判§!的帷幕正式拉开之后，我们对西方野兽的核袭击也将随之开始， 在一开始，我们会发射小型的、威力尚小的原子武器进行攻击，消耗纳粹的防御力量待他们的防御松缓之后，我们所要做的，就是将更多，更强大的核武器通通打到纳粹的土地上，将他们的防御力量进一步消耗和摧毁，帮助黑色联盟的勇士们向柏林挺进。为实现这一战略目的，我们必须建设更多，更密集的原子武器核和武器基地，我们必须让整个£GFX_OMS_teutons_texticon §q大日耳曼国§!的天空都被核武器的灰尘所布满，让他们永远没有明天。"
 OMS_mission_completed_desc: "俄罗斯民族的复兴之路必然是一条崎岖之路，在这条路上 ，我们克服了旧日的腐败与懈怠，扫平了诸多分裂与反叛势力，唤醒了俄罗斯人民心中的复仇和坚强本源。即使是统一了俄罗斯之后，我们也并未沾沾自喜，而是开展了更多的工作，从工业到情报，从防御的碉堡到进攻的核武器，我们坚持不懈，只为亲自将那最终的复仇的审判之火降下。\n\n但眼下，我们已经做的很好了，本土的防卫工作已在我们有条不紊的工作之下顺利进行。可以说，不会有人比我们现在做的更好了。\n\n现在，好好休息一下吧，明天的£GFX_OMS_great_trial_texticon §x大审判§!还需要我们每一个人加倍的努力。"

 OMS_local_defence_project_tt: "£GFX_OMS_dmitry_yazov_texticon §Y亚佐夫总司令§!认为，大审判之前需要更充足的准备。"
 OMS_leagcy_of_siberian_plan_tt: "西伯利亚计划为我们带来了可观的遗产，我们要充分利用这些，为£GFX_OMS_great_trial_texticon §x大审判§!做好准备。"
 OMS_redefine_the_resource_tt: "对于£GFX_OMS_great_trial_texticon §x大审判§!而言，每一滴石油，每一克资源都弥足珍贵。"
 OMS_repair_the_old_thing_tt: "£GFX_OMS_great_trial_texticon §x大审判§!是我们民族将迎来的最终的战争，我们将倾尽全力。"
 OMS_militarize_the_industry_tt: "£GFX_OMS_teutons_texticon §q大敌将至§!，所有人都必须要投身于£GFX_OMS_great_trial_texticon §x大审判§!当中，一切以效率为优。"
 OMS_resettle_the_pop_tt: "人口是我们资源的一部分。既然如此，我们也必须要将人口充分利用，£GFX_OMS_great_trial_texticon §x一切服务于大审判。§!"
 OMS_the_russia_city_tt: "鄂木斯克是我们所有城市当中的范例，我们必须将每个城市都重新建设一次，£GFX_OMS_great_trial_texticon §x一切服务于大审判。§!"
