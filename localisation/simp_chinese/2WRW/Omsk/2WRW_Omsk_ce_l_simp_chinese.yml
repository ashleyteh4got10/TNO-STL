OMS_yazov_GG.4.t: "营啸"
OMS_yazov_GG.4.desc: "阴暗的日子已近黄昏，天空被远方飘来的云彩染成了黑色，调车的火车头传来一阵吱呀难听的吼声。随着火车缓缓停下，全团的人都开始下车，卡尔梅柯夫像往常一样，安排全团的人排成队，准备向军营行军，并等待上级检阅。\n\n说实话的，他心里还有有点庆幸，自己竟然在这场伟大的远征里活了下来。一块出征的老伙计里，潘捷莱死于喝了不干净的水，曼茹洛夫为了掩护他清除一个条顿聚集点时候中了雷，就连最德高望重的彼得罗也在宣布回家的前一天，精神崩溃跳了河，像这样的老朋友他已经失去了太多太多，能活着回来，他由衷的感觉到上帝保佑。\n\n谁都知道，仗已经打完了，条顿人都被杀干净了，上面特地向卡尔梅柯夫通知了这伟大的胜利，他也把这个好消息通知到了全团的士兵们。士兵们把最后一份口粮吃进肚，欢天喜地的走出火车站，可映入眼帘的却是另一番景象：仍然没有清理的残垣断壁，街道上横行的老鼠，以及已然成为骷髅的死尸。等到了军营的时候，所有人都陷入了一种诡异的沉默之中。\n\n到了军营，师长站在一处简易搭建的高台前，边上是一众军官组成的军官委员会。士兵们也抬起头，看着他挺起那半发福的肚子，整了整腰带，用一种嘶哑难听的声调，训起话来。\n\n“士兵们，作为伟大的斯拉夫人，我们终于完成了大审判，消灭了万恶的...的...条顿匪帮。但现在，我们的国家内部还存在着一群修正主义分子，他们打着和平的名义，要...要军队放松管控，放权给所谓的民主政府！这是不可容忍的！在这胜利的日子里，我们军队应该非常坚强！，像...像总司令那样的人一样，服从长官，英勇杀敌！”这位结巴的，根本不会长篇大论的军官指了指身后：“现在，给大家十分钟吃饭，之后，我们立刻前往指定位置，消灭叛徒！”\n\n士兵们看着炊事推来一口大锅，刚一打开盖，一股臭味瞬间直冲鼻子。士兵们的怒火也随之爆发。\n“怎么回事？什么东西这么臭？”\n“见鬼了！这是烂菜汤！”\n“咱们以前过得是苦日子，现在更烂了！”\n“我不想跟步枪住在一块了！我要回家！”\n...\n卡尔梅柯夫意识到大事不好，他扯开嗓子，希望让士兵们冷静下来，可士兵的喊叫声却此起彼伏，根本压不住，这时候，他身后传来了一声枪响，师长往天上开了一枪。\n“你们，想造反吗？”\n短暂的沉默之后，一个士兵突然举起手中的武器，对着台上的师长开了火，接二连三的士兵们也拿起武器，对着他们面前的其他军官开了火，军营里的宪兵们也随之赶来，两伙人瞬间打在了一起。\n"
OMS_yazov_GG.4.a: "骨肉再度相残。"

OMS_yazov_GG.3.t: "“噩梦”"
OMS_yazov_GG.3.desc: "多日以来的心绪不宁已经令亚佐夫连着一周没有睡好了。西俄罗斯的行程紧锣密鼓，配合着紧绷的精神，几乎令他喘不过气来，终于，在意外被一阵突如其来的大雨将身体打湿之后，亚佐夫病倒了。\n······\n梦中的事物光怪陆离，可是的是老将军的诅咒，永远是这个噩梦的主旋律，那段话仿佛刻在了亚佐夫的脑子里，无论如何也挥之不去:“未来的人们，站在时间的另一头，审视着我们在每个命运节点上的所作所为，然后，我们将遗臭万年。”\n······\n他猛然起身，感到意识回归了身体，随后，望着惨白的天花板和周边一大堆复杂的医学仪器，窒息感才如潮水般涌来。亚佐夫惊疑不定地喘着粗气，仿佛什么东西被从身体里抽走了一般。旁边的医生见状立刻走上前来，关切道:“总司令同志，您的身体现在还没有完全恢复，最好暂时不要剧烈活动。”\n\n亚佐夫躺下身子:“谢谢，医生同志，我昏迷了多久？”\n\n“八个小时，总司令同志。”听到这，亚佐夫舒了口气，好在他没有耽误太多时间。至于这场病，大概是工作太累，且心绪不宁，而他又恰好受凉导致的吧······无论如何，亚佐夫认为自己很需要转换一下脑子，是时候从过去的糟糕回忆中脱身了，毕竟，联盟一定是走在正确的道路上，我们在做正确的事，对吧···？\n\n名为逻辑的链条突然出现一个漏洞:“正确的事到底是什么？”毫无疑问，大审判是为了拯救俄罗斯人民，他一直这样认为，并且所有联盟的支持者都会这么认为，那么，现在，人民究竟有没有得到救赎？这种大逆不道的想法以前从未被他所认真思考，而现在，不得不承认，他迟疑了。不过问题并不严重，只要亚佐夫能够证明，他所做的就是救赎之道，他就能够抛开这些令他心神战战的该死想法了······\n"
OMS_yazov_GG.3.a: "他只能祈祷事情的结果将如他所愿。"

OMS_yazov_GG.2.t: "幽灵重现"
OMS_yazov_GG.2.desc: "亚佐夫强压下内心的不安，继续漫步在萨马拉，可当他俯瞰市容，看见的却只有废墟瓦砾和了无生机的大地时，那段他不愿回想的记忆却如同魔咒一般的记忆再次浮现在脑海中，他知道地堡下才是如今这座城市的主体部分，可是他越是这样安慰自己，那魔咒就越来越令他头疼。\n\n······\n\n结束了行程，亚佐夫在自己的床上辗转反侧，老将军的那段话不断地冲刷着他的理智和记忆，这话语如同精密齿轮中混进去的一颗细小石子，并不惊天动地，却令亚佐夫的思维几乎要停止:“我做了一个梦，在梦中，未来的人们瞧不起一个荒无人烟，一片废墟的俄罗斯。并且审判我们，审判联盟，因为它注定将俄罗斯引向毁灭。”在这段被刻意遗忘的记忆中，老将军的身影是那样的清晰，老将军的声音是那样的恳切、生动，可他说出的内容却如同一颗最致命的子弹，在飞行了许久之后，正中亚佐夫的眉心。\n\n”老将军的话不是正好灵验了么？那么，难道我是错的？这样说，第四理论，究竟是我的臆想，还是老将军的启示？老将军构想中的联盟应该是这样的吗？”亚佐夫打了一个寒颤，他不能再想下去了，他必须制止自己。哪怕他很清楚，拖延不能解决问题，只会让问题愈演愈烈。\n\n于是他把灯重新点亮，披上大衣处理起公务，德米特里·莫菲耶维奇·亚佐夫略过这个想法，再度蜷缩起来，化作机器中默默运作的小小齿轮。\n"
OMS_yazov_GG.2.a: "“又一个不眠之夜。”"

OMS_yazov_GG.1.t: "回忆"
OMS_yazov_GG.1.desc: "迎着凛冽的寒风，亚佐夫走出了地堡，这次他计划巡视整个西俄罗斯的大城镇，不仅是为了确保控制，更是为了让自己能够好好看看俄罗斯大地上的人民们。很快，专车从鄂木斯克开抵乌拉尔，然后继续中转，直到···\n······\n萨马拉市\n······\n映入亚佐夫眼帘的是一座钢筋混凝土铸成的坟墓——尽管这样说很不雅观，但最适配的形容词就是这个，在废墟之上，稀稀拉拉的几十个小黑点在碎石瓦砾中来回穿梭着，那是正在执行任务的干员，亚佐夫想起他看过的一个调查报告:整个萨马拉市的地上常住人口已不足一万，并且多半患有辐射导致的疾病，尽管转移进地堡的人数相当可观，但是仍然有近1/3人在核打击中消逝了。这个数字令他万分心痛，这些可都是斯拉夫民族的大好生命!\n\n亚佐夫接着走向城郊，他首先看到的是一座由于大量电磁波辐射和岁月流逝已经失去了原本的颜色的破旧小木屋和周遭死寂一片的环境，看着此情此景，鬼使神差般，一段破碎的记忆突兀的浮现在他的脑海，他努力思索，试图想起说这话的人到底是谁，以及这段话的全貌到底是什么，但是无果，他只能带着满腔的疑惑继续看下去。\n\n在房子里，亚佐夫看到了一具骷髅。骷髅身边的墙上挂满了已经被岁月侵蚀而失去了颜色的工具:锯子、小刀、狗链、弓箭······地上还有一把掉落的老式猎枪。骷髅的身上穿着一身皮革衣服，它的手抚摸着一具狗模样的骷髅，这看上去是一具经验丰富的老猎人的骷髅。它安详的坐在椅子上，而狗和猎人的头骨都有一个大洞——显然，较久的时间以前，甚至可能在核战之前，猎人先打死了狗，然后自杀了。亚佐夫几乎能想象到这名猎人生前在山里与野兽斗智斗勇，与自然争锋的场面。这令他想起了老将军，在他生命的最后几个月，他是否也像这猎人一般，勇敢却徒劳地抗争，最终，也像这猎人一般，主动迎来死亡？\n\n······不，不一样，老将军的遗产被他所继承了，应该是这样，也只能是这样······\n\n可是他看向玻璃已被震碎的窗外，那块原本是森林的地方已经只剩下一片木炭，依稀只有一些焦黑的树桩的根还在提醒着人们:这里以前是一块林地······突然间，他想起来了，那段话，来自卡尔贝舍夫老将军。\n\n而记忆的全貌令他感到恐惧，刚刚的自我安慰之言在此映衬之下显得是那样的可笑:\n"
OMS_yazov_GG.1.a: "“如果，我们是错的呢？”"

