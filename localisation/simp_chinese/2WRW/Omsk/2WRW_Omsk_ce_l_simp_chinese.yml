OMS_no_control_trigger_tt: "§V你，无权控制亚佐夫的所作所为。§!"



OMS_walk_through_the_forest_desc: "条顿匪帮已然败北。\n\n亚佐夫站在地堡临时搭建的平台上，身后是乌斯季诺夫和一众将军，身上穿的大衣挂满了金晃晃的勋章。地堡外，一望无际的冬正降下永不停歇的灰色雪花，将那已经不能称为城市的废墟染成一团灰色、棕色和黑色。寒风凛冽，那尖锐的声音呼啸着，也献上了一首急促却又无可奈何的小曲儿。太阳也仿佛已经熄灭了，只剩缕缕微光刺破那厚厚的云层，为鄂木斯克点上了几根蜡烛。“广场”上，他仅存的士兵们站成了一列列歪歪扭扭的方阵，褴褛的军大衣下是瘦骨嶙峋的身躯，手中紧握的，是已经锈迹斑斑的步枪。欢呼声早已消散、胜利的狂热也已冷却，只剩下这片无垠的死寂，以及一个在元帅制服中日渐空洞的灵魂。\n\n看着你面前的寂静，那扭曲脆弱的军队、那支离破碎的国土，\n\n§V亚佐夫，你，真的对吗？§!"

OMS_POSTNUKE.37.t: "离战场还有几英里？"
OMS_POSTNUKE.37.desc: "这是几年前的一天。阿尔正在莫斯科的一所学校上课。他今年才刚满11岁，还是读书的年纪。他有着一群玩伴，还有一个美满的家庭。母亲在家里当全职主妇，父亲则在附近的铁路局工作。\n\n有一天，他照常和他的玩伴特尔科特聚在一起谈论。特尔科特突然给他看了一个东西，那是最近从边境线另一边搞来的，“俄罗斯民族复兴政府”的肩章。阿尔对此非常感兴趣。在一次次的请求后，特尔科特最终把那个来自东边的肩章给阿尔摸了一下。那时，阿尔心里对于战争无比的向往。\n\n很快，'大审判'开始了。虽然战争已经开始很久了，但阿尔仍然对战争没有一点概念，它只对那些帅气的军服和武器感兴趣。直到有一天，一群不速之客突然造访了莫斯科——城市霎时陷入了恐慌之中，四处枪声不断，市民也四处逃窜。有一架直升机突然越过阿尔上空，其他人被吓得不敢动弹，然而阿尔对此却兴奋不已——他的相机录上了！他把直升机飞过头顶的震撼画面录到他的相机里面了！不仅如此，那直升机上的驾驶员似乎还看了他一眼。他迫不及待地冲出校门追上那架直升机。很快，那架直升机坠落在了市中心的公园里，阿尔迫不及待的追了上去，想要一睹直升机的美丽。令他感到欣喜的是——那上面的人还活着！而且他手里拿着一支枪，一支真枪！那可是他梦寐以求的东西。飞机上的人跳了下来，阿尔兴奋的问他：“这架飞机是你开的吗？你是不是坠机了？”\n那个驾驶员只是用枪指着他，一句话都没有说，迅速从飞机上跳了下来。\n\n阿尔看了看那位飞行员，他非常的年轻，丝毫没有老兵的气息，与他在电视上见到的冷血无情的士兵根本不一样。\n\n“可以把枪给我摸一下吗？”阿尔一边说着一边靠近那位飞行员。那位飞行员见此情景迅速回答，“就算你等多久我也不会把枪给你的。”\n过了一会，那位飞行员看到了阿尔身上的相机，就突然要提议把枪给他玩。阿尔毫无顾忌的就冲了上去。然而他不仅枪没能摸到，就连身上的相机也被那位飞行员拿到了。正当两个人因为相机而扭打在一起的时候，阿尔突然看到了那个人身上的肩章——那是黑色联盟的肩章，和他之前摸到的一模一样，毫无差别。他仔细的盯着那个肩章，于是，他们达成了一场交易，阿尔把相机给了他，而飞行员则把他身上的肩章给了阿尔。临走之际，阿尔问了那位飞行员的姓名，而他是这么回答的："
OMS_POSTNUKE.37.a: "“我叫巴纳德，巴纳德·维兹曼，你可以叫我巴尼。”"

OMS_brutus_strikes: "布鲁图斯行动"
OMS_brutus_strikes_desc: "如同布鲁图斯与凯撒大帝一样，亚佐夫和他的黑色联盟也迎来了终局。亚佐夫总司令现已不知所踪，黑色联盟正陷入完全的混乱当中。正当黑色联盟的追随者们希望有人能重掌联盟，维持统治时，命运却给他们开了个玩笑。德米特里·乌斯季诺夫，一位前西俄革的将军，子夜后亚佐夫总司令最信赖的人，现如今亲自摧毁了黑色联盟的最后一丝抵抗的可能，将它带入了旧世界的终章中。\n\nEt tu, Brute?（还有你吗，布鲁图斯？）"
OMS_equalized_rationing: "公正配给"
OMS_equalized_rationing_desc: "现如今，黑色联盟及其事业正处在最危险的时刻。一个强大的中央委员会已经成立，其将会把配给以最高效的方式分配给个人。也许有人说这会断送俄罗斯的未来，但这又有什么关系呢？我们不需要一个有着条顿人残余的未来。无论代价如何。"
OMS_karbysevs_folly: "卡尔贝舍夫之愚"
OMS_karbysevs_folly_desc: "卡尔贝舍夫，理论的奠基者，我的导师。我从未对大审判的理论有过任何质疑，我从未背叛过大审判，我从未......背叛过您啊。您究竟在哪里？我已在树林中找了你数天之久，可您却从未出现。您可是去到了理想乡？\n\n不，知道现在我才知道您那句话的深意。您已经意识到了我们是错误的，“大审判”从一开始就是一场闹剧。于是您遁入了尘土，将自身罪恶洗洁一清，并于理想乡中注视着我们。而我则一直于人世间苦苦挣扎，于永夜中试图追寻光亮，于沼泽中陷入泥潭，再也不得动弹，于尘世间犯下十恶不赦之罪行后认清了事实。\n\n现如今，卡尔贝舍夫同志，我是否可以与您一同去往理想乡？还是要在地狱中直到永远？"
OMS_our_new_rome: "新的罗马"
OMS_our_new_rome_desc: "罗马精神已于鄂木斯克重生。亚佐夫总司令就是黑色联盟的凯撒，我们将会以血肉之躯帮助总司令完成卡尔贝舍夫的意愿，以鲜血铺筑大审判之路。\n\n§R我们无需怜悯，亦不向人乞怜。执剑于手之刻，恐怖绝无藉端。§!"
OMS_ragnarok: "£GFX_OMS_great_trial_texticon 诸神黄昏£OMS_teutons_texticon "
OMS_ragnarok_desc: "两方都到齐了，无数年的仇恨将在这里一次解决，一切事情都将迎来终局。旧世界的末日序曲已经奏毕，末日终曲也随之奏响。在废土丛生的地球——这颗死寂星球上，一切文明的存亡与否都将取决于此。“芬布尔之冬”的终结曾被认为是诸神黄昏的结束，可那不是结束的开始，那只是开始的结束。战争的恶意充斥着这颗星球，所有人都拿起武器相互厮杀着——所有人。当哈提和斯库尔吞掉太阳和月亮之时，诸神黄昏就已来临，人类文明幸运地存活到了现在，但他们还能再存活到诸神黄昏结束之时吗？\n\n但当人类身临其境之时，\n只有平原变成一片血海时，\n只有天空充斥着暗红之光时，\n只有战场上再没有立着的身影时，\n只有烈火之柱贯穿宇宙，点燃大地，焚烧一切时，\n人类才会知道“诸神的黄昏”带来的只有无尽的痛苦与伤痕。\n\n倘若他们足够幸运，或许能再次犯下同样的错误，但人类从历史中学到的教训，就是他们从未学到任何教训。"
OMS_the_hydra_slain: "九头蛇§x已死§!"
OMS_the_hydra_slain_desc: "我们终于斩碎了联盟内部的九头蛇。这刻耳柏洛斯和尼米亚猛狮的兄弟终于彻底消亡，它曾危害无数，恶贯满盈，成为黑色联盟的肿瘤。现如今，它已经被彻底扫除出我们的行政机构，九头蛇已经化为无害的单头“蛇”，我们终于得以再专注于大审判了。"
OMS_the_last_trial: "§V最终审判§!"
OMS_the_last_trial_desc: "£GFX_OMS_great_trial_texticon 诸神黄昏£OMS_teutons_texticon 迎来了属于它的高潮。末日终曲奏响了令人胆寒的音乐，每一个音符都在阐述着人类的罪与罚。诉说着自创世以来，人类的始祖亚当夏娃在伊甸园中选择了禁果获取智慧伊始就已有的罪行。然而人类却最终抛弃了情感。‘辨识善恶’这种知识是惟独上帝才有权拥有的，人却妄想据为己有，结果就犯了罪。\n\n于是上帝降下了祂的惩罚：本应结束的“诸神黄昏”在人类的贪欲之下继续扩大。对于充满了贪欲的人类来说，\n哪怕平原变成一片血海，\n哪怕天空充斥着暗红之光，\n哪怕战场上再没有立着的身影，\n哪怕烈火之柱贯穿宇宙，点燃大地，焚烧一切，\n人类也依然会决死冲锋。\n\n对于战场上的他们来说，“罪”已经无以复加，活着就是他们最大的“罪”与“罚”。为了躲避人类的罚，他们只得如机械般的于战场上寻死以从“罚”中解脱。而当他们解脱时，人类的罪将会更大，漠视生命的罪行不断累积，最终，他们已经不再关心世界如何，不再关心战场是如何，更不再关心自己如何。当他们抛弃了情感时，上帝的罪罚就已降下。烈火贯穿宇宙，浓烟卷没山顶，支撑宇宙的世界树也被火焰吞没而崩倒，失去支撑的世界坠入波涛汹涌的海水中，整个宇宙正在名为“毁灭”的道路上加速狂奔，末日终曲也即将迎来终结，毁灭的序曲将会被奏响，如果人类再不采取什么行动的话，\n星辰将会从苍穹中落下，时间将会不复存在，焦黑的地面将会摇晃着沉入波涛汹涌的海底，触目所及的将会只有滔天巨浪，宇宙间将会只剩下一片死寂的大沉默和永劫的黑暗。"
OMS_the_omsk_redoubt: "地堡之下"
OMS_the_omsk_redoubt_desc: "末日的序曲已经奏响。人类正面临着“芬布尔之冬”。光明之神在短暂释放了巨大的光芒后就陷入沉寂，于是四面八方刮起了强劲的雪，将世界笼罩在一片寒冬之中，天地不久就因为毒气而变得暗无天日。地表上处处笼罩着放射性的辐射粉尘，上帝为人类降下了神罚。没有阳光，世界从此没有了温暖，在刺骨的严寒当中，末日序曲迎来了高潮。旧世界的遗孤们正在苦苦挣扎，在刺骨的严寒中求生。猜忌和冲突充斥着这颗星球，自那次光芒于全世界绽放之始，战争和恶意就支配了世界。在现实面前，所谓“民主传统”不过尔尔。人们彼此不再宽容体谅或互助，手足相残、父子成仇，在丑陋的竞争中互相残杀，整个世界变得非常不安，罪恶如瘟疫般蔓延。\n\n公鸡“古林肯比”和“法亚拉”不断地警告，啼叫得声嘶力竭。毒龙掏空了世界树的深根，用来容纳它的子嗣，米德加尔特的山谷和山脉在光芒中消失，取而代之的是无尽的坑洞，哪怕在几千里外都清晰可见。随后，末日序曲将迎来终结。\n\n人类正在为末日序曲的终结叹一口气，却不知等待他们的是更为惨烈的战争。毁灭的号角即将吹响，“诸神的黄昏”即将来临。\n届时，令人胆寒的末日终曲将会奏响..."
OMS_the_russian_spirit: "俄罗斯精神"
OMS_the_russian_spirit_desc: "“我坚信，高于一切的俄罗斯，必将统一，不可分割，战无不胜。\n\n我坚信，我的力量，与同志们的力量。\n\n我否认，原初审判的谎言，我承认黑色联盟在审判日到来之时，将是俄罗斯唯一且独存的救赎。\n\n直到那一天，§R大审判§!到来，我将与同志们患难与共，我将无畏面对敌人，我将为我的祖国献出生命。\n\n我将化身俄罗斯的剑与盾，为陨落之人将正义伸张。\n\n我以性命向神圣的俄罗斯祖国发此誓言。”"
OMS_warriors_without_purpose: "无志之兵"
OMS_warriors_without_purpose_desc: "我们的士兵已经被腐化了。数十年的停滞让士兵们失去了目标，他们没有了对“大审判”的敬畏，这样的军队是无法为大审判服务的。"


OMS_yazov_GG.30.t: "林间漫步，其二"
OMS_yazov_GG.30.desc: "结束了。雪花在铅灰色的天空里打着旋。亚佐夫甩开木门时，合页断裂的脆响惊飞了檐下几只麻雀。防毒面具的滤毒罐早该更换了，橡胶面罩内侧凝结着淡黄色的液珠。他摘下时太过用力，勒得颧骨发麻，呼出的第一口空气里飘着淡淡的杏仁味。军帽砸在桌上的瞬间，搪瓷黑星磕碎了桌角一块焦黑的木片，而他沾满火药灰的手指立刻僵住，转而轻轻抚过桌角那枚俄罗斯国徽铜锈像蛛网般裹住双头鹰，左翅已经断成两截，残存的金漆在昏暗里泛着病态的光，像只濒死的眼睛。\n\n乌斯季诺夫抱着公文包的手在发抖。皮质封面上的党徽烫金早就磨没了，露出底下褐色的裂痕，倒像是一道陈年旧伤。他站在离壁炉三步远的地方不敢再动，靴底黏着的泥块里混着细小的冰块，已经开始融化了。\n\n壁炉上方的卡尔贝舍夫画像正在燃烧。不是火焰直接舔舐的那种，而是画布边缘先蜷成焦黑色，再一点点往里收缩，露出后面墙皮上斑驳的弹痕。画中人的眼睛被烟熏得发乌，曾经锐利的目光变得浑浊，嘴角那道象征坚毅的纹路，此刻倒像是被苦难压出来的深沟。\n\n亚佐夫就那么站着，军大衣后摆还在滴着水，在地面积成小小的水洼。他看着画像上的火焰，瞳孔里跳动的光忽明忽暗，像是在进行一场无声的审判。\n\n“总司令同志。”乌斯季诺夫的声音带着纸页摩擦的沙沙声，他从公文包里抽出几份文件，“莫斯科的庆典报告，还有······”\n\n“念。”亚佐夫的声音像两块生锈的铁板在摩擦。\n“是。”乌斯季诺夫清了清嗓子，刻意提高了声调，“红场阅兵式上，群众自发组织了万人大合唱；巴尔瑙尔超额完成粮食上交任务，农庄代表在广播里说······”他戛然而止。\n\n亚佐夫转过身的瞬间，乌斯季诺夫看见他睫毛上挂着的冰粒。下一秒，领口被攥得死紧，西装第二颗纽扣崩飞出去，撞在壁炉的铁板上叮当作响。那些文件散了一地，其中一张照片上，孩子们举着鲜花欢呼的笑脸，被地上的泥水迅速晕染开来。\n\n他猛地将乌斯季诺夫掼在地上，文件散落得到处都是。其中一份征兵报告上，军官的签名旁边，用铅笔写着一行小字：“每五个指标换一箱罐头”。亚佐夫盯着那行字，突然捂住脸蹲下去，喉咙里发出压抑的呜咽，像受伤的熊在洞穴深处舔舐伤口。\n\n乌斯季诺夫趴在地上不敢动，他看见亚佐夫的指缝间渗出泪水，落在满是灰尘的地板上，砸出一个个深色的小点。那些泪水很快就结了冰，像一粒粒透明的盐。\n不知过了多久，壁炉里的火焰渐渐小了下去，只剩下几块发红的木炭。亚佐夫站起身，脸上的泪痕冻成了白色的冰痕，眼神空洞无比。\n\n“我要出去。”他说。\n“总司令同志，外面的情况······”\n“我要去森林。”亚佐夫打断他，捡起地上那枚崩飞的纽扣，塞进衣袋，“我要去看看卡尔贝舍夫。”\n\n乌斯季诺夫离开时，屋里只剩下亚佐夫和那幅还在缓慢燃烧的画像，卡尔贝舍夫的脸已经被烧得只剩下模糊的轮廓，像个逐渐远去的影子。\n\n森林里的雪地上，还残留着未清理干净的弹壳。亚佐夫踩着厚厚的积雪往前走，每一步都愈发沉重。他曾以为自己是这艘破败国家的舵手，可现在才明白，自己不过是被风暴撕碎的帆，连漂流的方向都由不得自己。\n\n风卷着雪沫子打在脸上，像细小的针。他从衣袋里掏出那枚生锈的国徽，放在墓碑前。雪落在上面，很快就积了薄薄一层，像给这枚曾经象征荣耀的徽章，盖上了一层白色的裹尸布。\n\n远处传来零星的枪声，大概是反政府武装又在进攻检查站了。亚佐夫没有回头，只是静静地站着，看着雪花在墓碑前飞舞，像无数只白色的蝴蝶，盘旋，然后落下，最终与大地融为一体。\n\n“给我叫一辆车。”乌斯季诺夫说，"
OMS_yazov_GG.30.a: "“我要现在，立刻去鄂木斯克。”"

OMS_yazov_GG.29.t: "紧急状态委员会"
OMS_yazov_GG.29.desc: "地堡的通风扇发出哮喘般的嘶鸣，将煤油灯的光晕搅得支离破碎。混凝土墙壁渗出的水珠在地图上洇出深色的渍痕，把乌拉尔山脉的轮廓泡成了一堆无可考证的记忆。二十双军靴整齐地叩击地面，回声撞在钢铁穹顶又弹回来，像是某种迟来的丧钟。\n\n乌斯季诺夫的手指在公文包搭扣上绞出红痕。皮质表面的裂纹里卡着经年累月的灰尘，仿佛要把这几年的秘密都锁进褶皱深处。他清了清嗓子，喉结的滚动在昏暗里划出一道生硬的弧线：“诸位同志应当察觉，最近的通讯频率······ 不太正常。”\n\n坐在首排的装甲兵司令突然挺直脊背，勋章上的反光扫过众人紧绷的脸。有人下意识摸向腰间的配枪，金属保险栓的轻响在地堡里此起彼伏，像一串即将引爆的引信。\n\n“直说了吧。”乌斯季诺夫的指甲掐进公文包边缘，“亚佐夫总司令已经失联七十二小时。森林公园的雪地里只找到这个。”他从包里抽出半枚锈蚀的国徽，双头鹰的右翅彻底断落，断口处凝结着暗褐色的冰碴。指尖抚过锈迹时，所有人都鸦雀无声。\n\n议论声像受潮的火药般噼啪作响。作战部长的钢笔在笔记本上划出凌乱的折线，最终笔尖猛地戳穿纸页。那里原本记着明天要处决的 “叛国者”名单。\n\n“所以召集各位······”乌斯季诺夫的声音突然卡顿，目光扫过人群里那些熟悉的面孔，有人的袖口还沾着镇压抗议时的血渍。他突然扯了扯领带，喉结剧烈滑动，“是要商讨······”\n\n公文包的锁扣毫无征兆地弹开。\n\n不是金属咬合的轻响，而是弹簧崩裂的锐鸣。最先飞出来的是几页燃烧的文件，火苗在缺氧的地堡里诡异地蓝着，照出乌斯季诺夫瞳孔里炸开的惊恐。随后是沉闷的轰鸣，像被捂住嘴的爆炸，热浪瞬间掀翻了会议桌，将地图上的俄罗斯疆域撕成漫天纸蝶。\n\n作战部长的半只手臂挂在通风扇上，军牌在扇叶间打着转，刻着的名字被离心力甩成模糊的光斑。有人试图爬向紧急出口，却被崩塌的钢筋压住小腿，惨叫声很快被浓烟掐断。乌斯季诺夫最后看见的，是那枚国徽从空中坠落，在火焰里短暂地亮了一下，像颗濒死的星。\n\n三天后反政府武装炸开地堡铁门时，积雪正顺着弹孔往里灌。十七具尸体被冻成了扭曲的姿态，其中一具还保持着握笔的姿势，冻硬的手指间夹着半张未写完的捷报，墨迹在 “亩产万斤”的字样上晕开，像一摊凝固的血。\n\n卡车把尸体运到红场时，乌鸦正啄食着未燃尽的庆典彩带。有人认出了乌斯季诺夫冻紫的脸，当年就是这张脸在他们村口宣称 “面包会有的”，而现在他的公文包碎片正和无数炮弹壳混在一起，在雪地里闪着冷光。\n\n开春后，有猎户在森林里发现了半块黑色联盟的勋章。上面的名字被雨水冲刷得模糊不清，国徽早已被苔藓覆盖，只在向阳的一面，还能看见双头鹰残存的纹路在风里轻轻颤动，像在诉说某个被尘埃掩埋的故事。"
OMS_yazov_GG.29.a: "In nihilum nil posse reverti, ex nihilo nihil fit."

IRK_POSTNUKE_party_long: "黑色联盟化学防御司令部 (Comandovanie Khimicheskoy Zashchity Chernogo Liga)"
IRK_POSTNUKE_party: "黑色联盟化学防御司令部"

OMS_soldiers_eat_first_desc: "“他右手拿着七星。从他口中出来一把两刃的利剑。面貌如同烈日放光。” ——《启示录》1:16\n可分配的资源已经捉襟见肘，但我们一方面要准备大审判，也要维护最基本的社会秩序，我们该怎么办？答案呼之欲出：优先给予军队一切资源。\n\n作为真正的俄罗斯公民，必须有敢于把资源全部贡献出去的气概，正如誓言所说，“我将为我的祖国献出生命。”现在就是最终考验来临之时，誓言必将得到守护。\n\n无论是农民，工人，企业主还是士兵，都必须在誓言之下行事。黑色联盟的誓言是不变的铁律。现今俄罗斯需要他们，需要所有人，\n\n§V其中也包括你，端坐在荧屏前的你。§!"
OMS_the_last_supper_desc: "“此后，我看见另有一位有大权柄的天使从天降下。地就因他的荣耀发光。\n他大声喊着说，巴比伦大城倾倒了，倾倒了，成了鬼魔的住处，和各样污秽之灵的巢穴，并各样污秽可憎之雀鸟的巢穴。\n因为列国都被她邪淫大怒的酒倾倒了。地上的君王与她行淫，地上的客商，因她奢华太过就发了财。”\n——《启示录》18:1,18:2,18:3\n\n最终审判已经来临，米德加尔特的寒冬将化为一片炽焰，§x烈焰升腾。§!战火已经从华纳海姆燃至阿斯加德\n条顿人怎样待我们，我们也要怎样待条顿人，按条顿人所行的加倍地报应条顿人。\n\n§V末日终曲将会奏响。§!"
OMS_a_circle_of_judases_desc: "地狱的第九层为背叛者之寒冰地狱，离神最远。\n因她的罪恶滔天，她的不义神已经想起来了。\n那女人穿着紫色和朱红色的衣服，用金子宝石珍珠为妆饰。手拿金杯，杯中盛满了可憎之物，就是她淫乱的污秽。\n——《启示录》18:6,18:7\n象征着九头蛇的灯光又亮起了，一起震惊联盟的行动将会开始......\n\n§V末日终曲奏响的日子更近了。§!"
OMS_fields_of_rot_desc: "天使拿着香炉，盛满了坛上的火，倒在地上。随有雷轰，大声，闪电，地震。\n第一位天使吹号，就有雹子与火搀着血丢在地上。地的三分之一和树的三分之一被烧了，一切的青草也被烧了。\n第二位天使吹号，就有仿佛火烧着的大山扔在海中。海的三分之一变成血。\n海中的活物死了三分之一。船只也坏了三分之一。\n第三位天使吹号，就有烧着的大星，好像火把从天上落下来，落在江河的三分之一，和众水的泉源上。\n——《启示录》8:5,8:6,8:7,8:9,8:10\n\n§V末日终曲奏响的日子更近了。§!"
OMS_the_hearts_decay_desc: "念这书上预言的，和那些听见又遵守其中所记载的，都是有福的。因为日期近了。\n——《启示录》1:3\n\n我们正在经历前所未有的挑战。战斗日益胶着，生存压力与日俱增，联盟之心正在放缓。\n既然如此，我们就需要强有力的“电击”心脏，给予心脏以强大的动力，让它迸发出新的血液。\n\n这固然会透支联盟的未来，不过，未来又算什么呢？我们对入侵之敌的仇恨是永恒的，我们必须燃尽一切，包括我们的未来。只要公理得胜，哪怕世界灭亡。\n\n§V末日终曲奏响的日子更近了。§!"
OMS_ghosts_of_karbyshev_desc: "神要擦去他们一切的眼泪。不再有死亡，也不再有悲哀，哭号，疼痛，因为以前的事都过去了。\n——《启示录》21:4\n\n卡尔贝舍夫同志，我做的事究竟是对是错？\n\n如今最终审判已至，我下达了对条顿人的一个又一个的灭绝令，而士兵们正贯彻着我的意志。可我为什么总会感觉，我感到对您越来越陌生了？每当我下达一道命令后，我都期望着您能够在我身后指导我，教育我，可您却常常缺席。这些时日里，我每晚都夜不能寐，期待着我能找到您，我能再次与你交谈。\n\n您能告诉我，我到底是对是错吗，卡尔贝舍夫总司令？"
OMS_beneath_my_skin_desc: "我知道你的行为，劳碌，忍耐，也知道你不能容忍恶人，你也曾试验那自称为使徒却不是使徒的，看出他们是假的来。\n——《启示录》2:2\n\n一个生命，其作为“人”的定义究竟是什么？我们不需要思考这些。\n\n一个黑色联盟的公民，他既需要承担公民的义务，也需要时刻承担军人的责任，而军人则必须服从联盟的命令。面对威胁时，军人更需要挺身而出，以鲜血铸就大审判。\n如今大审判即将重启，军人更应该为大审判而服务，让自身成为伟大系统的一个齿轮，并时刻超频运转，哪怕危及生命也不能停下，此即联盟公民应尽的本分。"
OMS_finding_a_surplus_desc: "第五位天使吹号，我就看见一个星从天落到地上。有无底坑的钥匙赐给他。\n——《启示录》9:1\n\n一场波及全世界的战争，需要全人类为之服务。\n\n这场大审判必须彻底毁灭条顿人的生机，为此，我们必须重拾大审判的遗产。在上一次大审判之中，我们曾在俄罗斯各地建立了一系列武器存储库，以确保我们有充足的武器毁灭条顿人。\n\n如今正是需要之时，我们将寻找大审判时期的武器存储，虽然不少武器库的资料已经丢失，一些军火库也很有可能遭到了洗劫。但只要有一杆枪被发现，这就是值得的。"
OMS_activate_the_spetsgruppa_desc: "外邦发怒，你的忿怒也临到了。审判死人的时候也到了。你的仆人众先知，和众圣徒，凡敬畏你名的人连大带小得赏赐的时候也到了。你败坏那些败坏世界之人的时候也就到了。\n——《启示录》11:18\n\n“信号旗”特种部队一直是黑色联盟对内的中坚力量。在总司令的眼中，前线战事吃紧，预备队如潮水一般消耗，如今联盟内最精锐的预备部队就是“信号旗”了。在谨慎考虑后，我们最终决定将信号旗部队归入军事指挥体系，派遣到前线进行战斗。\n\n他们在城镇反恐作战中的经验将在清扫地堡的战斗中大有裨益。"
OMS_loyalty_through_deed_desc: "弟兄胜过它，是因羔羊的血，和自己所见证的道。他们虽至于死，也不爱惜性命。\n——《启示录》12:11\n\n如果我们没有坚强的意志，那么武器装备再精良也只是空谈。\n\n在总司令眼中，一支真正的部队应有顽强的意志，应以行动表达忠诚，应该忠实的执行命令。哪怕我们把治安部队全部拉到前线上，又有什么用呢？他们要是没有坚强的意志，也只会作鸟兽散，溃不成军。我们将会教会士兵们如何养成坚强的意志。"
OMS_exorcise_defeatism_desc: "他大声说，应当敬畏神，将荣耀归给他。因他施行审判的时候已经到了。应当敬拜那创造天地海和众水泉源的。\n——《启示录》14:7\n\n好吧，总有源源不断的人变成失败主义者，他们总是在说着什么我们“无法取胜”了，就像数十年前的大停滞那样。他们到底是想干什么？这群失败主义者们总是成事不足败事有余。除了睁眼说瞎话他们一无是处！我必须杀鸡儆猴，制止他们。\n\n§V末日终曲奏响的日子更近了。§!"
OMS_infiltrate_the_cliques_desc: "第一位天使便去，把碗倒在地上，就有恶而且毒的疮，生在那些有兽印记，拜兽像的人身上。\n——《启示录》16:2\n\n纵使我们已经重回地面，但在目光无所触及的角落也依然存在一些军阀性质的组织。他们对黑色联盟的伤害不可估量。如果放在以前，我们大概会直接剿灭这些组织；但现在，我们将把他们纳入战斗序列中，让他们去和条顿人打仗。\n\n如果他们愿意，这自然是最好的方案。如果他们不愿意，那我们就会去让他们愿意。"
OMS_investigate_the_army_desc: "我观看，见天开了。有一匹白马。骑在马上的，称为诚信真实。他审判争战都按着公义。\n——《启示录》19:11\n\n军队的那群人到底在干什么？来自前线的战报总是宣布我方大胜，可我们消耗的资源却与日俱增。\n\n在核战前，观察统计局曾负责此类事务，但其在大停滞期间却遭解散。如今，观察统计局将重新建立，并且其权力也将极具扩大，非常时期需要行非常之事，一场针对军队的调查将会迅速发起。"
OMS_interrogate_the_citizenry_desc: "有利剑从他口中出来，可以击杀列国。他必用铁杖辖管他们。并要踹全能神烈怒的酒榨。\n——《启示录》19:15\n\n在聚集点内，公民内部也存在着叛徒，他们逐渐开始懈怠，染上了卑劣的条顿人的恶习。\n\n为了大审判的胜利，总司令将发起一场调查，揪出隐藏在联盟内部的破坏者，对于这样的蛀虫，我们绝不能让他们再暗中破坏了，他们的罪行将公之于众。"
OMS_smashing_the_mask_desc: "一名合格的优秀黑色联盟公民必须记住：\n“我坚信，高于一切的俄罗斯，必将统一，不可分割，战无不胜。\n\n我坚信，我的力量，与同志们的力量。\n\n我否认，原初审判的谎言，我承认黑色联盟在审判日到来之时，将是俄罗斯唯一且独存的救赎。\n\n直到那一天，§R大审判§!到来，我将与同志们患难与共，我将无畏面对敌人，我将为我的祖国献出生命。\n\n我将化身俄罗斯的剑与盾，为陨落之人将正义伸张。\n\n我将对黑色联盟的忠诚置于其他所有事物之上。\n\n我以生命向神圣的俄罗斯祖国发此誓言。”\n\n§V末日终曲奏响的日子更近了。§!"
OMS_priority_through_labor_desc: "他们不再饥，不再渴。日头和炎热，也必不伤害他们。\n——《启示录》7:16\n\n如果一个机器的齿轮缺少润滑，那这个机器的运作效率就会迅速下降。显然，由于配给不足，工厂的产能正在逐步下降。工人们需要得到更多的资源倾斜，得到更多的配给。\n\n有人可能会认为这是“社会主义行径”，但说实在的，我们给配给不是因为我们大发慈悲，而是因为这能够有效的提高生产效率。"
OMS_hunger_penalization_desc: "你将要受的苦你不用怕。魔鬼要把你们中间几个人下在监里，叫你们被试炼。你们必受患难十日。你务要至死忠心，我就赐给你那生命的冠冕。\n\n——《启示录》2:10\n\n我们的资源毕竟不是大风刮出来的。一个地方的资源多了，就意味着另一个地方的资源少了。\n\n我们需要优先奖励那些表现优秀的公民。这样会让许多优秀的公民们因此无法为大审判服务，他们再也看不到大审判结束的那天。但这是必要之恶。\n\n§V末日终曲奏响的日子更近了。§!"
OMS_formalize_the_scouts_desc: "他穿着溅了血的衣服。他的名称为神之道。在天上的众军，骑着白马，穿着细麻衣，又白又洁，跟随他。\n——《启示录》19:13-14\n\n兵力不够，兵力远远不够。作为联盟的新青年，他们有责任在最危难的时刻负起责任来！\n\n如今正是全联盟最危难的时刻，我们将会将青少年，乃至儿童编入作战序列之内，也许这是反人类的罪行，也许这会导致我们失去未来，但在大审判结束时，只要有一个俄罗斯人活着，那就是我们的胜利。"
OMS_equalize_the_rationing_desc: "我听见从天上有声音说，你要写下，从今以后，在主里面而死的人有福了。圣灵说，是的，他们息了自己的劳苦，作工的果效也随着他们。\n——《启示录》14:13\n\n在短暂的事故后，我们将进一步完善当前实施的配给制。\n\n我们将精确计算每种工作需要的配给，并把刚好满足需求的补给配发给他们，以达到最高效率的利用可用资源。对于军队，我们将拼尽全力保障最高的供给，哪怕只多生产一份物资，让我们能够多杀掉一个条顿人，这对我们而言都是伟大的胜利。"

OMS_decapitate_cerberus_desc: "那迷惑他们的魔鬼，被扔在硫磺的火湖里，就是兽和假先知所在的地方。他们必昼夜受痛苦，直到永永远远。\n——《启示录》20:10\n\n所罗门啊！看你犯下了多么严重的罪行！？\n\n当我们真正向西进发之际，我们能够清晰的看到，那些曾经的敌人已经从地底里爬出，试图继续在我们的国土上继续盘踞阻挡我们，他们的存在就是对大审判的亵渎。我们必须彻底的消灭这些卑劣的仆从。\n\n§V九头蛇已死。§!"

OMS_last_light_desc: "我听见有大声音从宝座出来说，看哪，神的帐幕在人间。他要与人同住，他们要作他的子民，神要亲自与他们同在，作他们的神。\n——《启示录》21:3\n\n梦是什么？梦是现实的延续。\n那现实是什么？那是梦的终结。\n\n我们已经进发到条顿人之境，他们还在梦想着自己能够逃避过去的罪孽，重新得到主的饶恕，但血淋淋的现实已经摆在眼前了，§V梦该醒了。§!"

#一群被困在过去的人，一群被重力束缚的灵魂。

OMS_counting_time_desc: "残阳把溃兵的影子钉在焦土上，番号在风里碎成纸灰。步枪的铁锈渗进掌心，像未干的血。这支军队早就成了个破筛子，兵员名册上的名字被死亡一个个抠掉，剩下的人眼里，只\n剩比战壕水更浑的绝望。\n\n军旗的残片缠在断枪上，飘得像块裹尸布。每个伤口都在喊着要债，每具无人收的尸骸都在等个说法。所谓清算，不过是让溃兵们踩着自己人的骨头往前走，直到把欠的血，一滴一滴，还给这片被炮火烧焦的土地。\n\n§V国破山河在§!，§Y城春草木深。§!"

OMS_falling_ash_desc: "黑色联盟落幕了。\n\n旧指挥部的灯早已熄了，那些曾支配钢铁洪流的指令，如今化作焦土里的磷火。每阵夜风掠过，便有半行褪色的军令飘进救赎旅的队列。他们踩着懵懂，靴跟碾碎焦土时，灰末里裹着昨日的勋章残片。\n\n末了，执念随部队编制表一同焚尽。孑然时才惊觉，恐惧与那纯正的恨早被灰烬制成标本。\n\n你旁观一场注定失控的殉道，在虚无的余温里，认领一身空茫的自在。\n\n“德米特里·季莫费耶维奇，你曾感到过自己正在被注视吗？”\n\n现在，亚佐夫给出了自己的答案······"
Tsuki_No_Mayu: "§M月之茧§!"

OMS_the_illusion_undone_desc: "亚佐夫，你，看见了吗？\n\n迷雾正从地堡的裂缝里渗进来。\n\n汇报册上的 “丰足” 与 “安宁” 是那么耀眼，但再美丽的文字也掩不住背后血淋淋的事实，那是饿殍的腐气，是死亡的味道。黑色联盟的勋章在阳光下闪得刺眼，可擦亮它们的，是谎言的遮羞布。\n\n站在数据与真相的夹缝里，看基层的报表长出翅膀，载着虚假飞向云端；而地面上，冻僵的手还攥着半块树皮。所谓幻象，不过是有人用墨水在苦难上画了层糖衣，让每个吞咽的人，都尝到玻璃的甜。\n\n你可能还没意识到，§x人于同胞，皆为豺狼。§!"

OMS_darkness_in_the_west_desc: "征兵名册在西风吹过的窗台上泛黄，墨迹里的“十五”被岁月啃成“八十”。那些被遣往战场的少年，骨头早与西线的焦土长在一起，只有骨灰坛顺着西风滚回来，坛口刻着的家乡名，被骨灰糊成模糊的疤。\n风从西边来，总带着枪声的余响。你看那归人蹲在荒坟旁，把骨灰坛一个个埋进土里，每埋一个，就往坛口插根野蒿，那是他们小时候编花环用的草，如今在坟头歪歪扭扭地立着，像串没吹响的集结号。\n所谓归途，不过是让西风把少年的影子，吹成一捧灰罢了。\n\n§x淮山隐隐，千里云峰千里恨。淮水悠悠，万顷烟波万顷愁。§!\n\n§x山长水远，遮断行人东望眼。恨旧愁新，有泪无言对晚春。§!\n"

OMS_light_from_the_east_desc: "黑色联盟的岗楼像枯钉一样狠狠地扎在东欧的焦土上。\n\n阿尔图宁躲在森林雪窖里，用熔掉的炮弹壳敲打镰刀，火星溅在破军大衣的补丁上：那是战友的军装，针脚里还嵌着去年深秋的弹片。\n\n他怀里总揣着张塑料布包的画，是故乡孩子送的、歪歪扭扭的太阳。画上的颜料被硝烟熏得发暗，边缘却被摸得发亮。村民深夜摸进雪窖，老妇人塞来冻硬的土豆，猎户献出带旧刻痕的猎枪，连逃兵都带着黑盟布防图来投诚。\n\nLux in tenebris lucet."


OMS_postnuke_time_tt: "§x一切都已结束，时间已无意义。§!"
OMS_postnuke_time_delayed_tt: "§L天空被渐染上赤红，\n被黒檀般的暗色吞噬。\n\n被吞噬殆尽的无数星辰，\n像虚幻般凋落堆积。\n思念在寂寥的夜空中飘舞而上，并四分五裂。\n\n每当这个世界变换着它的形态，\n就连想要守护的东西，\n也会跟着被破坏掉吧。\n\n内心躁动不安，充斥着背德的暗色。\n冰冷刺骨，感觉被剥夺而去。\n就算不断追逐着虚无缥缈的目标，\n但也永远无法到达终点。\n那我到底又是为什么而战斗的呢？\n倘若光芒渐渐消散着失去光泽，\n哪怕这颗水之星球被毁灭\n我也无法遗忘这小小愿望，\n将我导向理应存在的地方。\n\n如白雪般的灰烬，从你的天空中坠落。\n如白雪般的灰烬，让我思考为什么必须去战斗？\n思念在寂寥的夜空中飘舞而上，直到破碎，\n将黑暗驱散，换取荣耀，\n显得过于虚幻空洞。\n\n我被破碎四散的断片所刺伤，而走到了这一步。§!"

OMS_cries_from_the_ash_desc: "大地在燃烧，天空在哭泣。我们赢得了战争，却输掉了一切。城市化为瓦砾，田野沦为焦土，幸存者在残垣壁断间苟延残喘，他们的眼中不再有对“伟大审判”的狂热，只剩下无尽的空洞与绝望。亚佐夫总司令走在这片死寂的国土上，每一步都踩在昔日同胞的骨灰之上。他所见的，并非胜利的荣光，而是文明的墓碑。风中传来的不是凯歌，而是无数亡魂的恸哭。黑色的雪花从铅灰色的天空中飘落，覆盖在扭曲的钢铁和破碎的混凝土上，那不是雪，而是凝结了辐射与死亡的尘埃。空气中弥漫着一股无法言喻的气味，那是金属的锈蚀、尸体的腐败和化学物质的刺鼻混合在一起的味道，是这个垂死世界的呼吸。曾经支撑着黑色联盟的狂热信念，如今在这片绝对的死寂面前显得无比苍白可笑。支撑着士兵们前进的仇恨，在敌人彻底消失后，变成了一把反噬自身的利刃。现在，他们所要面对的，是一个比任何敌人都要可怕的对手：一个被他们亲手创造出来的，毫无希望的未来。而亚佐夫，作为这一切的总设计师，必须第一个走完这条通往地狱的巡礼之路。"
OMS_whispers_in_the_ranks_desc: "胜利的狂热正在以肉眼可见的速度消退，取而代之的是无尽的苦役和令人窒息的绝望。士兵们不再是高喊口号的战争机器，他们是人，是会感到疲惫、恐惧和迷茫的血肉之躯。在核冬天阴冷的寒风中，在摇曳的篝火旁，在肮脏的掩体里，窃窃私语开始像瘟疫一样蔓延。他们谈论着战死的同袍，那些鲜活的面孔如今只剩下冰冷的姓名牌；他们谈论着远方的家人，不知道他们是否还活在这片废土之上；他们开始谈论这场战争的意义，这个曾经不容置疑的话题。怀疑的种子，一旦种下，便会在绝望的土壤里疯狂滋长，开出名为背叛的花。政治委员们发现，他们那些慷慨激昂的演说，如今换来的只是士兵们麻木和怀疑的眼神。维系着这支军队的意识形态堤坝，正在被内部涌出的苦涩潮水一点点侵蚀，裂开了无数细微却致命的缝隙。曾经坚不可摧的黑色联盟，如今听上去，充满了空洞的回响。"
OMS_oh_karbyshev_desc: "卡尔贝舍夫同志，理论的奠基者，我永恒的导师。我从未对“大审判”的理论有过任何一丝一毫的质疑，我从未背叛过您那伟大的构想，我······我从未背叛过您啊。您究竟在哪里？我在这片被烈火烧灼过的林中找了您数天之久，可您却从未出现。莫非，您也去了那个您口中所谓的伊甸园？\n\n不，现在我才明白您那句话的深意。您早已意识到，我们所做的一切都是错误的，“大审判”从一开始就是一场彻头彻尾的闹剧。于是您遁入了尘土，将自身罪恶洗洁一清，并在那个虚无缥缈的理想乡中注视着我们。而我，则一直于人世间的苦海中苦苦挣扎，于永夜中试图追寻一丝光亮，于沼泽中陷入泥潭，再也不得动弹。于尘世间犯下十恶不赦之罪行后，我才认清了事实。\n\n现如今，卡尔贝舍夫同志，我是否可以与您一同前往伊甸园？还是说，我注定要在这无间地狱中，直到永恒？"
OMS_look_at_me_now_desc: "卡尔贝舍夫的幻影越来越频繁地出现在亚佐夫的梦中和现实里。他不再是那个记忆中慈祥、坚定的导师，而是一个沉默的审判者，一个亚佐夫良知的化身。他的眼神仿佛穿透了时间和空间的阻隔，在质问着亚佐夫：这就是你想要的俄罗斯吗？这就是你所承诺的未来吗？这就是你以我之名所行之事的结果吗？亚佐夫试图逃避，他将自己埋在无穷无尽的公务中，试图用酒精和药物来麻痹自己，但他无法摆脱那如影随形的目光。无论是在作战地图前，还是在午夜梦回时，那双眼睛总是在那里，静静地凝视着他。他必须面对自己一手创造的这个世界，面对自己内心的谎言与罪孽。他不能再躲藏在导师的影子背后，他必须走到台前，直视那个他早已不敢承认的，真正的自己。这场审判，没有法官，没有法庭，只有他和他的罪。"
OMS_ghosts_from_the_past_desc: "战争结束了，但战争的鬼魂并未离去。它们潜伏在废墟的阴影里，游荡在幸存者的噩梦中，更如跗骨之蛆般盘踞在亚佐夫的心头。那些被他杀死的人，那些被他辜负的人，那些因他而死去的无数同胞和敌人，如今都化作了纠缠不休的梦魇，成为了他个人地狱里永恒的居民。他无法安眠，无法安宁，清醒与梦境的界限变得模糊不清。他被自己过去的罪孽所囚禁，在现实与幻觉的边界上痛苦地徘徊。他的卫兵和下属发现，元帅变得越来越孤僻和古怪，他常常对着空无一人的角落说话，或是在深夜里发出惊恐的叫喊。黑色联盟的最高统帅，正在被他自己的战争所吞噬，他自己，也正在变成一个旧时代的鬼魂。\n\nNon omnis moriar······"
OMS_tears_in_the_rain_desc: "天空降下了黑色的雨，每一滴都带着辐射的尘埃，冲刷着这片饱受创伤的大地。雨水无法洗净罪孽，只会让伤口暴露出来，更加刺痛。在这连绵不绝的哀悼之雨中，亚佐夫的内心防线彻底崩溃了。他不再挣扎，不再愤怒，只剩下无尽的悲哀。他仿佛看到了一个本可能存在的、不同的世界。一个没有战争，没有仇恨，一个孩子们可以在阳光下奔跑，老人们可以在公园里安详下棋的世界。那个世界曾经触手可及，就像镜花水月，美丽而脆弱。但那个世界，连同它存在的可能性，都已被他亲手毁灭。这场黑色的雨，是整个星球为他所犯下的罪行而流下的眼泪。在这场盛大的葬礼上，亚佐夫既是主祭，也是唯一的罪人，他为自己埋葬的一切而恸哭，却发不出任何声音。\n\nTempus edax rerum."
OMS_yazov_GG.28.t: "梦魇"
OMS_yazov_GG.28.desc: "睡眠，对亚佐夫而言已经成为一种比死亡更可怕的酷刑。每当他闭上眼睛，试图寻求片刻的安宁，无数张面孔就会从黑暗中蜂拥而至，将他拖入记忆的深渊。有被他下令以“思想不坚定”为由处决的政委，临死前眼中充满了不解和失望；有在战场上被炮火撕碎的年轻士兵，嘴里还呼喊着“乌拉”；有在“伟大审判”中化为灰烬的条顿平民，妇女和儿童，他们的尖叫声仿佛还在耳边回响；还有那个在废墟中画下全家福的孩子，用他那双纯真的眼睛，无声地质问着他。他们什么也不说，只是用空洞的、充满控诉的眼神死死地盯着他，让他无处可逃。\n\n他试图用烈性伏特加麻痹自己，但醉意只能带来更深、更真实的恐惧。在酒精催化的幻觉中，他看到那些亡魂从地下爬出，穿过墙壁，聚集在他的床边。他们的身体残缺不全，有的还在燃烧，冒着黑烟，有的身上插着坦克的弹片。他们伸出焦黑的手，似乎想要抓住他，将他拖入他们所在的那个无间地狱。他能闻到他们身上传来的焦臭和腐烂的气味，能感觉到他们带来的刺骨寒意。\n\n“滚开！都给我滚开！” 他在深夜中惊叫着坐起，拔出枕下的手枪，对着房间里的阴影胡乱射击。枪声在死寂的指挥部里显得格外刺耳，每一发子弹都像是在敲响他自己的丧钟。他打光了所有的子弹，但那些幻影却丝毫未损，只是用更加悲哀和嘲弄的眼神看着他。卫兵们撞开门冲了进来，只看到元帅一个人衣衫不整地坐在黑暗中，大口地喘着粗气，眼中充满了血丝和凡人面对鬼神时的那种最原始的恐惧。他们不知道元帅看到了什么，但他们能感觉到，一种比辐射更可怕的东西，正在从内部彻底吞噬着这位黑色联盟的最高统帅。\n\n"
OMS_yazov_GG.28.a: "Dum spiro spero."

OMS_yazov_GG.27.t: "凝视"
OMS_yazov_GG.27.desc: "亚佐夫已经很久没有好好看过自己了。他下令移走了房间里所有的镜子，仿佛这样就能避开那个纠缠他的怪物。但今天，他没有喝酒，也没有服用镇静剂。他异常清醒地站在指挥塔的最高层，透过巨大的防弹玻璃，俯瞰着自己一手缔造的“帝国”。\n\n鄂木斯克，这座曾经的黑色堡垒，这座曾经跳动着复仇心脏的城市，如今也难逃衰败的命运。街道上垃圾遍地，被遗弃的车辆锈迹斑斑。建筑物上布满了战争的创伤，如同一个个无法愈合的伤口。幸存的市民如同行尸走肉般穿行其间，他们的脸上没有表情，眼中没有光芒。这里没有胜利的喜悦，没有重建的希望，只有死寂和麻木。这就是他为之奋斗的一切？一个建立在仇恨和白骨之上的废土之都？一个巨大的、冰冷的坟墓？\n\n玻璃上，清晰地映出了他疲惫而扭曲的倒影。他看着那个影子，那个影子也看着他。在这一刻，他终于不再逃避，不再挣扎。他看清了，那个梦魇中的怪物，那个毁灭了一切的罪魁祸首，就是他自己。他不是在对抗鬼魂，他自己就是那个最大的鬼魂，一个旧时代的、充满了仇恨与疯狂的鬼魂，一个被自己的理想所诅咒的幽灵，游荡在自己亲手创造的坟场之上。他的倒影与窗外那片死寂的废墟完美地重叠在一起，他就是废墟，废墟就是他。\n\n“他们依旧追捕着我，”他对着玻璃中的倒影，用一种近乎平静的、几不可闻的声音说。\n\n“而我，甘愿被这梦魇永远纠缠。”\n\n因为他知道，这无尽的痛苦和折磨，就是他应得的审判。这不是结束，甚至不是结束的开始。这只是永恒惩罚的第一天。"
OMS_yazov_GG.27.a: "假若他日相逢，我将何以贺你？以沉默，以眼泪。"

OMS_yazov_GG.26.t: "美丽新世界：其一"
OMS_yazov_GG.26.desc: "黑雨淅淅沥沥地敲打着指挥部的窗户，发出单调而催眠的声响。亚佐夫没有开灯，只是静静地坐在黑暗中，听着窗外的雨声，任由自己被这无边的悲伤所吞噬。恍惚间，他仿佛看到了另一番景象，一个从未存在过的，却又无比真实的世界。\n\n他看到战争从未发生，或者说，以一种不同的方式结束了。“他”领导着一个统一的俄罗斯，致力于战后的重建与和解。工厂的烟囱里冒出的不是黑烟，而是发展的希望；田野里，拖拉机在金色的麦浪中穿行，收割着丰硕的果实；城市里，孩子们背着书包，蹦蹦跳跳地走向窗明几净的学校，他们的笑声像银铃一样清脆。没有无处不在的辐射检测站，没有怪物在阴影中潜伏，没有穿着厚重防护服、眼神麻木的士兵。人们的脸上洋溢着的是对未来的憧憬，而不是对明天的恐惧。他们讨论着新上映的电影，抱怨着面包的价格，而不是在哪里能找到一罐干净的水。\n\n“他”甚至看到了自己。他不再是令人闻风丧胆的“大审判之领导者”，或许只是一名遣散回家的老人、历史的某个注脚罢了。在闲暇时，他会回到家乡，教孙子如何钓鱼，告诉他们哪种鱼饵最好用。他会给他们讲述自己年轻时的故事——那些关于勇气、牺牲和战友之情的故事，而不是关于屠杀、毁灭和仇恨的故事。他会成为一个被孩子们尊敬和爱戴的祖父，而不是一个让整个世界为之颤抖的魔王。那将是一个多么美好的世界。一个他曾经有机会去创造，却最终选择亲手扼杀的世界。那份温暖，那份宁静，是他用整个俄罗斯的未来都换不来的奢侈品。\n\n‘“他”的名字好像叫“舒······”什么的······’亚佐夫喃喃自语道······\n\n"
OMS_yazov_GG.26.a: "镜花······"

OMS_yazov_GG.25.t: "美丽新世界：其二"
OMS_yazov_GG.25.desc: "美好的幻象如同一触即碎的泡沫，在现实冰冷的触碰下瞬间破碎。亚佐夫猛地回过神来，心脏传来一阵剧烈的绞痛。窗外的世界依旧是那个被黑雨笼罩的地狱，单调的雨声此刻听来如同葬礼的哀乐。他所幻想的一切，都不过是南柯一梦，是罪人对救赎的无望渴求。现实是，工厂早已停工，锈迹斑斑的机器像史前巨兽的骨架；田野长满了变异的杂草，结出无人敢食用的畸形果实；城市是幸存者挣扎求生的斗兽场，每天都在上演着弱肉强食的悲剧。他没有孙子，他的双手沾满了太多鲜血，早已无法拥抱任何温暖的躯体。\n\n他站起身，踉跄地走到窗前，将额头抵在冰冷的玻璃上，看着雨水在玻璃上划出一道道黑色的泪痕。他突然想起了一句不知从哪里听来的话，一句来自某个电影的台词：“所有这些时刻，终将流失在时光里，一如眼泪，消失在雨中。”\n\n是的，都消失了。那个美丽新世界的可能性，连同数以千万计的生命，连同俄罗斯民族的未来，都在他按下核按钮的那一刻，彻底消失了。他曾以为自己是历史的创造者，是俄罗斯的救世主，是挥舞着复仇之剑的米迦勒。但现在他才明白，他只是一个毁灭者，一个亲手埋葬了俄罗斯未来的掘墓人。他挖了一个巨大的坟墓，将他的敌人、他的同胞、他的理想，以及他自己，全都埋了进去。雨水模糊了他的视线，顺着他脸上的皱纹滑落，他不知道，那流下的究竟是窗外的黑雨，还是他自己的眼泪。或许，早已没有区别。"
OMS_yazov_GG.25.a: "······水月。"

OMS_yazov_GG.24.t: "谎言"
OMS_yazov_GG.24.desc: "深夜，亚佐夫又一次从噩梦中惊醒，心脏在胸腔里疯狂地跳动，仿佛要挣脱束缚。他梦见自己回到了战争开始前的那一天，回到了那个改变一切的时刻。卡尔贝舍夫站在他面前，目光温和而坚定，如同记忆中一样。“德米特里，”导师的声音清晰而温暖，“记住，我们所做的一切，都是为了拯救俄罗斯，是为了让孩子们能在一个没有法西斯主义的世界里自由地欢笑，是为了重建一个强大而公正的国家。”\n\n然后，场景变换。温暖的房间消失了，取而代之的是一片无尽的焦土。他看到的是倒塌的房屋，扭曲的钢筋，和那些在辐射尘中艰难呼吸的孩子。他们的脸上没有欢笑，只有被灼伤的皮肤、空洞的眼神和对未来的恐惧。卡尔贝舍夫的幻影再次出现，这一次，他站在废墟之上，他的声音不再温暖，而是充满了冰冷的悲伤：“德米特里，你拯救了俄罗斯吗？看看这些孩子，他们在欢笑吗？”\n\n亚佐夫猛地从行军床上坐起，冷汗浸透了他的军装。他环顾四周，指挥部里一片寂静，只有墙上的地图在昏暗的灯光下显得阴森可怖，那上面代表着毁灭的红色箭头，如同凝固的血迹。他一直告诉自己，也告诉所有人，他们所做的一切都是在践行卡尔贝舍夫的遗志，是为了完成导师未竟的事业。但现在，在这死寂的深夜，他不得不向自己承认一个可怕的真相：他只是在利用导师的名字，来为自己的仇恨和野心正名。他将导师那份纯粹的、为了守护的理想，扭曲成了为了复仇的极端教条。“伟大审判”从一开始就不是为了拯救，而是为了毁灭。他用一个宏大的、所有人都愿意相信的谎言，将整个俄罗斯拖入了万劫不复的深渊。他玷污了导师的圣名，将他变成了自己屠戮的借口。\n\n"
OMS_yazov_GG.24.a: "以谁之名？"

OMS_yazov_GG.23.t: "未来"
OMS_yazov_GG.23.desc: "亚佐夫摇晃着走到指挥部的洗漱间，拧开水龙头，冰冷的、带着铁锈味的水流了出来。他掬起一捧水，用力泼在脸上，试图用这刺骨的寒冷让自己从谎言的窒息感中清醒一些。当他抬起头，看向墙上那面破裂的镜子时，他愣住了。镜子里的人，是他，又不是他。那张脸憔悴、苍老，皮肤像干涸的河床一样布满了深深的沟壑。但最可怕的是那双眼睛，那里面燃烧着的不是理想的火焰，而是毁灭一切的、疯狂的、偏执的、空洞的黑暗。那不是一个拯救者，而是一个不折不扣的怪物。\n\n他想起了年轻时的自己，那个同样穿着这身军装，在军事学院里聆听卡尔贝舍夫教诲的年轻军官。他记得自己曾经在日记里写下誓言，要将所有俄罗斯人民从苦难中解放出来，要建立一个让导师为之骄傲的国家。是什么时候，他变成了现在这个样子？是从他将仇恨奉为圭臬，将复仇作为唯一行动纲领的那一刻？还是从他下令向德国城市投下核弹，听到无数生命在瞬间蒸发的消息时，内心感到的那一丝冷酷的满足？他已经分不清了。这条路他走了太久，久到已经忘记了最初的起点。\n\n他缓缓地伸出手，颤抖的指尖触摸着镜子中那张陌生的脸。镜子冰冷的触感让他不寒而栗。他突然意识到，他最大的敌人，从来都不是条顿人，甚至不是那些内部的腐败分子。他最大的敌人，一直都藏在他的内心深处。他为了对抗深渊，自己也变成了深渊，甚至比他所对抗的那个深渊更加黑暗，更加纯粹。他赢得了对外的战争，却在与内心恶魔的斗争中输得一败涂地。镜中的怪物，正狞笑着看着他，而他无处可逃，因为那怪物，就是他自己。\n\n"
OMS_yazov_GG.23.a: "镜中的怪物······"

OMS_yazov_GG.22.t: "咆哮"
OMS_yazov_GG.22.desc: "指挥部的地下掩体里，空气凝滞得如同铅块。地图上代表着“已净化区域”的红色标记，像无数双凝固的血眼，无声地嘲笑着坐在桌前的那个男人。亚佐夫总司令已经三天没有合眼了，眼窝深陷，胡茬像一片灰色的苔藓爬满了下颚。他面前摆着一张泛黄的旧照片，照片上，一个戴着眼镜、面容清癯的老人正温和地笑着，他身旁的年轻人，正是德米特里·亚佐夫。\n\n“您看见了吗？卡尔贝舍夫同志！您看见了吗！”\n\n一声压抑已久的嘶吼毫无征兆地从亚佐夫的喉咙深处迸发出来，那声音不似人声，更像是濒死的野兽发出的悲鸣。他猛地将桌上所有的文件、弹壳笔筒、勋章一股脑地扫落在地，金属和纸张在水泥地上碰撞、散落，发出一片刺耳的杂音。他颤抖的手指重重地戳在照片上那个微笑的老人脸上，指甲因为用力而深深嵌进相纸里。\n\n“这就是您承诺的伊甸园吗？这就是您理论中那个纯净、伟大、容不得半点杂质的新世界吗？” 他咆哮着，唾沫星子溅在冰冷的地图上，晕开了那些血红的标记。“我遵循了您的每一个字，我执行了您的每一个构想！我将怯懦者送上绞架，我将背叛者投入熔炉，我将整个旧世界都化为了灰烬！我以为火焰能烧尽一切污秽，能锻造出一个崭新的俄罗斯！可您看看窗外！您给我看看！”\n\n他踉跄着冲到掩体的观察窗前，那扇厚重的门外，是被永恒的核冬天笼罩的世界。灰黑色的雪无休止地飘落，覆盖着城市的残骸与枯死的森林。没有鸟鸣，没有生机，只有风刮过断壁残垣时发出的、鬼魂般的呜咽。\n\n“那里什么都没有！没有孩童的笑声，没有麦田的金色波浪，甚至没有一个该死的条顿人让我去审判！只有饥饿！只有病痛！他们把我当成了魔鬼！卡尔贝舍夫同志，这难道就是您理论的终点吗？把所有人都变成魔鬼，然后让魔鬼在这片地狱里互相吞噬？”\n\n他的拳头狠狠地砸在防弹玻璃上，发出沉闷的巨响，指关节瞬间皮开肉绽，鲜血顺着玻璃缓缓流下，像一行绝望的血泪。\n\n“您骗了我！所有人都骗了我！用一个虚无缥缈的‘伟大理想’，把我变成了一头只懂得复仇的······野兽！你们让我亲手毁灭了我发誓要拯救的一切！现在，您躲在坟墓里，享受着英雄的尊荣，而我，德米特里·亚佐夫，却要背负着这整个世界的罪孽，活在这片由我亲手创造的地狱里！回答我！卡尔贝舍夫！回答我啊！”\n\n他的咆哮在密闭的掩体里反复回荡，撞击着冰冷的墙壁，最终又回到他自己的耳朵里。照片上那个老人依旧在温和地笑着。\n\n"
OMS_yazov_GG.22.a: "倘若我不能使天神动容······"

OMS_yazov_GG.21.t: "缄默"
OMS_yazov_GG.21.desc: "咆哮过后，是死一般的沉寂。\n\n亚佐夫瘫倒在观察窗前，身体顺着冰冷的墙壁滑落在地。他大口大口地喘着粗气，每一次呼吸都像在吞咽着玻璃碴子，灼烧着他的肺叶。掩体里，只剩下他沉重而嘶哑的喘息声，以及从通风系统里传来的、永恒不变的低沉嗡鸣。那声音，像是这个垂死世界的脉搏。\n\n他抬起头，目光空洞地望着窗外那片灰白色的、永恒不变的景象。风雪依旧，世界宛如一幅早已褪色的、静止的遗像。他刚刚用尽全身力气发出的质问、愤怒与诅咒，仿佛被这片死寂的大地瞬间吸收，没有留下任何一丝回响。卡尔贝舍夫没有回答他。大地没有回答他。那些在他脑海中日夜不得安宁的、千百万个死难者的冤魂，此刻也陷入了诡异的沉默。\n\n这片缄默，比任何声嘶力竭的控诉都更加令人恐惧。\n\n他缓缓地爬回桌边，捡起那张已经沾上他血迹的旧照片。他用军装的袖口，小心翼翼地擦去相纸上的血污，凝视着卡尔贝舍夫那双透过镜片望向他的、温和而深邃的眼睛。在过去那段充满火焰与理想的岁月里，他曾将这双眼睛视作指引他穿越黑暗的灯塔。而现在，他从那温和的笑意背后，读出了某种他从未察觉过的东西——是疲惫？是怜悯？还是一种······早已预知了结局的悲哀？\n\n或许，卡尔贝舍夫从未想过要欺骗他。或许，这位伟大的导师，自己也是一个被更宏大的、名为“仇恨”的理论所俘获的信徒。他构建了一个完美的、纯粹的、用复仇烈火锻造出的理想国，却从未真正计算过，点燃那场火焰所需要的燃料，恰恰是人性本身。\n\n亚佐夫突然觉得无比的疲惫，一种深入骨髓、连灵魂都在战栗的疲惫。他不再愤怒，也不再悲伤。那场耗尽了他所有情感的咆哮，仿佛也带走了他作为“人”的最后一部分。剩下的，只有一个名为“德米特里·亚佐夫”的、被掏空了的驱壳。\n\n他明白了。卡尔贝舍夫的沉默，就是最终的答案。没有神谕，没有审判，也没有救赎。当他按下那个决定世界命运的按钮时，他就已经亲手扼杀了所有可能的回应。他所追求的那个绝对正义的、纯净无暇的理想乡，其最终形态，就是这片绝对的、纯净无暇的、永恒的死寂。\n\n他将那张照片重新摆回桌上，摆得端端正正。然后，他坐回那张象征着最高权力的椅子上，身体挺得笔直，仿佛又变回了那个不苟言笑、意志如钢的总司令。但他自己知道，有什么东西已经永远地碎裂了。他不再是复仇的天使，也不是救世的主宰。他只是这片巨大坟场里，一个地位稍高的守墓人。\n\n从这一刻起，他将不再咆哮。他将用余下的生命，去倾听这片由他亲手谱写的、名为“缄默”的交响曲。直到这片无边的死寂，将他也彻底吞没为止。\n\n"
OMS_yazov_GG.21.a: "······我将搅动地狱。"

OMS_yazov_GG.20.t: "强弩之末"
OMS_yazov_GG.20.desc: "一份来自前线政治部的加密报告被送到了亚佐夫的案头。报告的封面上用红字标注着“最高紧急”，但其内容并非敌军动向，而是关于联盟内部的“消极与虚无主义思想蔓延情况分析”。报告中用冰冷的、不带感情的文字，记录了越来越多的一线士兵在私下里质疑“伟大审判”的最终目的。他们打赢了条顿匪帮，实现了终极的复仇，却发现自己身处一个比战前更加糟糕的地狱。辐射病、饥饿和严寒像秃鹫一样盘旋在每个人头顶，无情地啄食着他们残存的生命。\n\n“我们解放了俄罗斯，然后呢？”一名参加过莫斯科战役的老兵在非正式的谈话中被记录下这样的话，“我们把条顿人赶进了地狱，自己也住了进来。我的儿子···他死在了奔萨的废墟里，不是死于条顿人的子弹，而是死于一种我们看不见的瘟疫。他到死都不知道，我们究竟为何要付出这一切。为了这片被烧焦的土地？还是为了那些永远也吃不饱的肚子？”报告中还附上了其他令人不安的记录：一个年轻的补充兵在站岗时精神崩溃，反复念叨着“我们都死了，只是还没意识到”；一个炮兵班组在酒后公开嘲笑政治委员的演说，称其为“世界上最大的笑话”。\n\n报告的结论是，军心正在以前所未有的速度动摇。长期的艰苦作战和核战后的惨状，已经将士兵们的意志消磨殆尽。他们不再相信那些宏大的叙事，不再为虚无缥缈的“未来”而战。他们只关心下一顿饭在哪里，掩体是否足够温暖，以及自己是否能活到明天。政委们在报告中建议，采取更严厉的纪律和更频繁的思想教育来压制这些“杂音”。亚佐夫将报告扔在桌上，发出一声沉闷的巨响。他感到一阵无力的愤怒。这些政委根本不明白，问题不在于纪律，而在于希望。当一个人的希望被彻底粉碎时，任何说教都显得苍白无力，任何威胁都变得无关紧要。这支军队的灵魂，正在死去。\n\n"
OMS_yazov_GG.20.a: "我们为何而战？"

OMS_yazov_GG.19.t: "迷失"
OMS_yazov_GG.19.desc: "更大的危机来自于内部的腐化，它比任何外部敌人都要致命。战争摧毁了旧有的秩序，也催生了新的特权阶层。在普通士兵为了半块发霉的面包而争斗，为了几发子弹而冒险的同时，一些手握权力的军官和后勤部门的官僚却利用职权，囤积居奇，中饱私囊。药品、食物、干净的水、燃料，这些在废土上等同于生命的东西，成为了他们交易的筹码，成为了他们构建地下王国的基石。一个曾经以纪律严明、意志坚定和绝对廉洁著称的军事组织，如今正从内部开始腐烂，散发出阵阵恶臭。\n\n亚佐夫亲自处理了一起极其恶劣的案件。一名负责前线粮食分配的少校，被发现私藏了足够一个连队吃一个月的精制食品和药品，而他所管辖的部队却因为饥饿和疾病出现了大规模的非战斗减员。在审讯中，那名少校毫无悔意，甚至显得有些理直气壮。他曾经也是一名战斗英雄，胸前挂着两枚勋章。“总司令，”他冷笑着说，“时代变了。忠诚和理想不能填饱肚子，也不能抵御辐射病。我们赢得了战争，现在是时候享受胜利的果实了。我只是拿了我应得的那一份。那些在烂泥里等死的蠢货，他们的死活与我何干？”\n\n亚佐夫没有再多说一句话，他拔出枪，一枪打穿了那名少校的额头。温热的血溅在他冰冷的脸颊上。但他心中清楚，他可以处决一个腐败的军官，却无法根除腐败本身。当维系整个联盟的唯一目标——“伟大审判”——已经达成，而应许的未来却迟迟没有到来时，人性的贪婪和自私便会如病毒般在权力的温床上疯狂扩散。黑色联盟，这个为战争而生的巨人，正在被自己的重量压垮。他杀死了一个症状，却对背后的病因束手无策。他环顾四周，仿佛能看到无数双贪婪的眼睛在黑暗中闪烁，等待着分食这具正在腐烂的尸体。\n\n"
OMS_yazov_GG.19.a: "世间荣耀，转瞬即逝。"

OMS_yazov_GG.18.t: "遗物"
OMS_yazov_GG.18.desc: "巡视的队伍在一片被夷为平地的村庄前停下了脚步，装甲运兵车的履带碾过烧焦的土地，发出令人牙酸的嘎吱声。这里曾是地图上的一个点，一个家园，一个承载着欢声笑语的地方，如今只剩下无法辨认的残骸和在寒风中飘荡的辐射尘。亚佐夫沉默地走下装甲车，厚重的军靴踩在瓦砾上，发出刺耳的碎裂声，仿佛在践踏着无数破碎的记忆。士兵们机械地散开，在这片废墟中搜寻着任何有价值的东西——未开封的罐头、密封的药品，甚至是半瓶未被污染的水源。但他们找到的，大多是破碎的家庭照片，上面幸福的笑脸已被火焰熏黑；烧焦的书本，知识与文化在烈焰中化为灰烬；还有变形的厨具，无言地诉说着这里曾经存在过的人间烟火。\n\n一名年轻的士兵，面色苍白得像天空中飘落的黑雪，他颤抖着双手捧着什么东西走了过来，仿佛捧着的是一件无比沉重的圣物。“总司令···您看。”他的声音嘶哑，充满了不确定的恐惧。\n\n那是一本被烧得残缺不全的儿童读物。封面上的彩色图案已模糊不清，但依稀可以辨认出是一个关于小兔子的故事，一个关于纯真与美好的故事。士兵小心翼翼地翻开书页，生怕这脆弱的遗物在他手中化为飞灰。书页之间，夹着一张稚嫩的儿童画：一个歪歪扭扭的火柴人家庭，手牵着手，站在一栋用蜡笔涂抹的简陋房子前，头顶是一个巨大而灿烂的太阳。画的角落用铅笔歪歪扭扭地写着一行字：“爸爸，妈妈，还有我。”\n\n亚佐夫伸出手，摘下了厚重的手套，用布满老茧的指尖在粗糙的纸面上轻轻划过。在那一瞬间，他想起了什么，又似乎什么都想不起来。或许是自己遥远的、早已模糊的童年，或许是战争初期在某个村庄里看到的、一个躲在母亲身后的胆怯眼神。这幅画背后所承载的那个小小的、完整的世界，那个孩子对未来的全部期盼，如今连同那个画画的孩子本身，都已化为这场“伟大审判”的燃料，成为了他宏伟蓝图上一笔可以忽略不计的代价。他挥了挥手，示意那名不知所措的士兵退下。他独自站在这片废墟之中，寒风吹动他大衣的下摆。他第一次感到，他所带来的这场“胜利”，或许比任何一场惨烈的失败，都更加沉重，更加无法饶恕。\n\n"
OMS_yazov_GG.18.a: "他们把屠场变为荒野······"

OMS_yazov_GG.17.t: "残骸"
OMS_yazov_GG.17.desc: "车队沿着昔日的战线前进，这里曾是黑色联盟装甲洪流向西推进的主干道。如今，道路两旁散落着望不到尽头的钢铁残骸，构成了一幅超现实的末日画卷。被击毁的坦克像死去巨兽的骸骨，炮管无力地垂下，指向被污染的天空；烧成空壳的装甲车，黑洞洞的舱门如同绝望张开的嘴；支离破碎的卡车，车厢里散落着无法辨认的军用物资······它们如同沉默的墓碑，无言地诉说着战争的惨烈。这些曾经是联盟引以为傲的战争机器，是士兵们信赖的钢铁堡垒，是“伟大审判”的铁拳，现在却成了埋葬他们的冰冷棺材，与他们的血肉一同在这片被诅咒的土地上缓慢地锈蚀、腐烂。\n\n亚佐夫命令停车。他走到一辆坦克的残骸旁，这辆坦克的侧面装甲被某种大口径穿甲弹撕开一个巨大的口子，可以看见内部被高温熔化、烧焦的景象。他记得这支部队，记得他们的指挥官，一个名叫帕维尔的年轻人，脸上总带着一丝腼腆的笑容，却在战斗中勇猛得像一头熊。他曾亲自为帕维尔的部队授旗，记得他当时高喊着“为俄罗斯母亲，为卡尔贝舍夫同志”时眼中闪烁的狂热光芒。亚佐夫目送他们奔赴战场，奔向他所许诺的“荣光”。而现在，帕维尔和他的车组成员，连同他们的钢铁座驾，一同腐烂在这里，甚至无法拼凑出一具完整的尸骸。\n\n一名随行的政委，一个总是试图在绝望中寻找积极意义的中年人，清了清喉咙，试图开口说些什么。也许是想说“他们的牺牲是光荣的”，也许是想引用某段关于英雄主义的语录。但当他看到亚佐夫的眼神时，却一个字也说不出来。那是一种混杂着疲惫、悔恨和茫然的眼神，仿佛一片燃尽的灰烬，再也找不到一丝火星。亚佐夫没有看他，只是低声说道，像是在对自己耳语：“光荣？不···这里没有光荣，只有死亡。我们用无数像帕维尔一样年轻的生命，换来的就是这样一座一望无际的钢铁坟场。” 他顿了顿，声音里带着一丝无法抑制的颤抖，“我们告诉他们，这是为了未来。但看看这里，这里还有未来吗？” 他没有等待回答，转身走回车上，留给众人一个无比萧瑟的背影。\n"
OMS_yazov_GG.17.a: "······却称之为“和平”。"

OMS_yazov_GG.16.t: "灰马"
OMS_yazov_GG.16.desc: "沃洛佳长出一口气，呼出的白雾罩在眼镜上，让他差点看不清眼前的光景。他举起攥着缰绳的手，用袖子擦了擦镜片，然后低下头，打量了一眼灰马的头，马颈上的鬃毛耷拉到眼睛上，他用力拽了下马笼头，叫唤了一声，那匹老马便转过头来，跟着他一路向南而去\n\n马的蹄子早磨平了，每踏一步都在冻土上磕出细碎的响。自上周部队被打散，他跟着灰马在这转了七天。压缩饼干吃完了，水壶里的冰碴冻得梆硬，被沃洛佳捏在手心。昨夜宿在炸塌的面粉厂，沃洛佳摸出怀里的布包，里面是三颗皱巴巴的土豆种，是去年秋天从家乡菜地拿的，母亲当时笑着骂他 “都要去打仗了，还惦记着种菜”，现在种子在胸口焐得发烫，把冻在上面的冰都焐化了些。\n\n“再不走，就把你宰了吃。” 沃洛佳对着灰马的耳朵嘟囔，声音嘶哑。话刚说完，灰马突然竖起耳朵，猛地甩开缰绳，朝着断墙后的阴影冲去。沃洛佳被拽得踉跄，差点一头栽在地上，他忙不迭的爬起来，正要骂，却被眼前的景象钉在原地。\n\n灰马正用蹄子刨着墙角的碎砖，蹄印里竟有粒绿芽顶着碎土钻了出来。嫩黄的芽尖裹着泥，却在灰扑扑的废墟里亮得刺眼。沃洛佳蹲下来，指尖轻轻碰了碰芽瓣。\n\n风从东边吹过来，带着点融化的雪水味。马低下头，用鼻子蹭了蹭那粒芽，又转头看向沃洛佳，眼睛亮得像淬了光。沃洛佳把土豆种重新包好，塞进贴胸的口袋，再抬头时，发现东边的天竟泛出了淡青。那不是炮火的红，是黎明的颜色。他爬上断墙，看见马的影子在晨光里拉得很长，那绿芽，正朝着东边的光，慢慢舒展叶片。\n"
OMS_yazov_GG.16.a: "离离原上草······"

OMS_yazov_GG.15.t: "白马"
OMS_yazov_GG.15.desc: "黎明来得格外的早，东边的地平线刚裂开道金缝，沃洛佳就被马的嘶鸣声惊醒。他揉着冻僵的脸爬起来，看见马正朝着雾里刨蹄，鬃毛上的旧布条飘得笔直。雾中竟浮出个白影，像团会动的光。\n\n那是匹白马，鬃毛在晨光里镀着金，蹄子踏过的地方，连灰烬都泛起了青灰，像枯木要抽枝。灰马挣断缰绳冲过去，两道影子在废墟间奔跃，他的带着泥，白的发着光，把浓雾撞出了个透亮的洞。沃洛佳追得跌进弹坑，却在坑里的积水里看见自己的脸。防毒面具不知何时裂了道缝，东边的光正从缝里钻进来，把他眼里的浊灰洗成了透亮的琥珀。\n\n白马停在教堂的残垣前，低下头用鼻子轻轻咬住马颈间的旧布条。一扯，布条竟化作无数白蝶，绕着沃洛佳飞成个光环。他下意识摸向胸口的布包，打开时却愣住了。三颗土豆种竟都发了芽，嫩茎穿透了布料，顶出细碎的蓝花，花瓣上的纹路，像极了母亲画在菜地上的 “应许” 符号。\n\n“这边走。” 雾里传来个女声，沃洛佳抬头看见个穿蓝布裙的姑娘牵着白马，身后跟着十几个人。他们手里捧着装满种子的陶罐，姑娘笑着说，“我们在东边找到块能种的地，雪化了就能下种。” 他们手里的种子撒在地上，瞬间冒出了细小的绿苗。\n\n沃洛佳跟着他们往东边走，他的马和白马并排走在前面，蹄子踏过废墟竟踏出了条浅绿的路。他突然明白，他的马不是普通的坐骑，是在深渊里刨路的希望；白马也不是偶然出现的光，是被希望滋养熟了的应许。东边的太阳越升越高，把废墟的影子越压越短。他摸了摸胸口的蓝花，花瓣上的光暖得发烫。原来希望从不是等来的，是像种子那样在黑暗里咬着牙钻，是像光那样再厚的雾也敢硬生生挤进来。\n"
OMS_yazov_GG.15.a: "······一岁一枯荣。"

OMS_yazov_GG.14.t: "血债"
OMS_yazov_GG.14.desc: "帕维尔向母亲告别。那是一个极其简短、却又无比漫长的告别，没有拥抱，没有嘱托，只有几次跨越了整个院子的对视，和一个在空中僵硬的、不知是挽留还是催促的手势。随后而来的便是持续了几十秒的沉默，被那司机打断。\n“你们还上不上？”\n母亲迅速地把一个包裹给了他，然后静静地矗立在那里，仿佛一座雕像，跟帕维尔对视着。那天，帕维尔清楚地记得，他穿着新发的、散发着染料味的墨绿色大衣，头上戴着一顶钢盔，最后瞟了母亲一眼，便毅然决然地上了车，再不回头。\n...\n夜幕降临，战壕里各个角落都开始冒出压抑的、断断续续的呜咽声。突然，有个送件员大喊：“帕维尔·佩特罗夫在哪里？有封信寄给你的。”帕维尔颤抖着走向前，颤颤巍巍地扯开信封。在信里，母亲问他是否还冷，新发的军大衣是否合身。可他现在这双手，满是永远也洗不掉的血腥和污秽。每当冰冷的战壕水漫过脚踝时，他的灵魂深处便开始颤抖，仿佛看见了他杀的同胞们在远处注视他。\n\n他想起临行前母亲的眼神，那眼神里没有荣耀，没有期盼，只有一种他当时无法理解的、空洞的悲哀。或许，她早已明白，她那个穿着崭新军大衣的儿子，从踏上征途的那一刻起，就已经死了。如今活着的，不过是一具欠下了累累血债的尸体罢了。他的战友格里高利背负着一封信和几杆枪的重量，因为死亡他见多了，而帕维尔，则肩负着那亡灵从天堂或地狱往他这里看的眼神，身体上的重量仿佛不值一提。在这片土地上，谁的债，能更轻一些呢？\n"
OMS_yazov_GG.14.a: "死亡确定······"

OMS_yazov_GG.13.t: "血偿"
OMS_yazov_GG.13.desc: "格里高利往地上啐了一口带血的唾沫，唾沫在冰面上迅速凝结成一坨暗红色的冰块。他的军大衣的口袋里珍藏着一张用布条胡乱包裹的纸，纸张的边缘已经微微泛黄，被汗水和体温沁的。那是他的同乡战友临终之前写的一封给家里的信，希望他一定要亲手交给他远方的妻子和年迈的母亲。\n\n在过去二十四小时里，突围的命令被下达了三次。每一次，冲锋的号角都变成了部队的葬歌。浪潮般涌出的士兵，又如浪潮般退回，只是退回来的不再是活人，而是被后续炮火炸碎的、堆积在阵地前沿的堤坝。这条由尸体构成的防线，堵住了他们求生的唯一通路。\n\n政委蹲坐在后面一堆稍微有点干的泥土上，那堆土混着点点猩红，还未全干。“兄弟们、同志们！不要惊慌！继续冲！”但下一时间，一发流弹穿过空中，政委直挺挺的跌倒在地，他的眉心中穿了一个窟窿，身后的土地也被染成了猩红。一时间，落针可闻，只留下了那刚刚余音绕梁的破空声。\n\n秩序，在那一刻彻底蒸发了。\n\n混乱像病毒一样在幸存者中蔓延。一些在无尽的绝望中被逼疯的老兵，开始调转枪口，向着自己人的背后射击。\n\n“与其被对面的杂种抓去活剥了皮，不如死在自己人手里，痛快点。”\n\n格里高利把冰冷的枪口对准帕维尔的后心，他眼里的疯狂像被点燃的汽油，熊熊燃烧，映照出地狱的景象。帕维尔在那双血红的眼睛里，看见了他自己军大衣胸口那块弹片正在往外渗血，那是为了掩护格里高利而留下的。那是他同乡的血，而现在，这笔用鲜血换来的情谊，要用自己的血来偿还。\n\n就在这时，一发重炮炮弹撕裂了空气，精准地在不远处的铁丝网上炸开了一个缺口，格里高利的身体瞬间被掀翻在地。就在此时，外面的追兵发出了野兽般的嚎叫，他们说着谁也听不懂的方言，从四面八方向他们包围上来。他们刺刀上的血珠在昏暗的天光下闪烁，滴落在雪地上，晕开成一朵朵妖冶的的花。\n\n求生的本能压倒了一切。帕维尔猛地推开格里高利，踩着战友尚有余温的身体，不顾一切地向那个缺口冲去。脚下的触感黏稠而柔软，他不敢低头去看。突然，一只冰冷的手如同铁钳般死死地抓住了他的脚踝。帕维尔惊恐地回头，对上了一双他永远无法忘记的眼睛······\n"
OMS_yazov_GG.13.a: "时刻不定······"

OMS_yazov_GG.12.t: "十五从军征······"
OMS_yazov_GG.12.desc: "征兵册上的那枚图章重重地盖在“阿列克谢”三个字上时，他那双磨破了的草鞋底下，还沾着家乡麦田里潮湿而温热的泥土。母亲一言不发，只是将一块反复浆洗过的、绣着野蔷薇的亚麻手帕塞进他滚烫的怀里。那针脚扎得又密又紧，她布满老茧的手指在他胸口停留了很久，最后只说了一句：“娃儿，别给俺弄丢了。” 村口那棵老槐树正下着一场雪，白色的花瓣纷纷扬扬，粘在征兵队那辆漆黑的马车上，像谁在为这场远行撒下了一把碎银子做的纸钱。\n\n“等我打跑了条顿鬼子，我就回来娶你！” 他扒着颠簸的马车后栏，对着身后那个追跑的、越来越小的身影声嘶力竭地喊着，声音被卷起的尘土和凛冽的风扯得变了调。安雅的红头巾在灰黄色的尘雾里一闪一闪，像一株罂粟花。他从贴身的口袋里摸出那颗珍藏已久的弹珠，那是他小时候和弟弟换来的，蓝得像村东头那片清澈见底的湖水。他小心翼翼地将弹珠塞进母亲给的手帕夹层里，他想让娘看看，也想让安雅知道，他还带着家里的东西，带着他们的念想。\n\n队伍渡过第一条河时，他看见河湾的芦苇丛里漂着一具肿胀的浮尸，那身灰绿色的军服上的破洞，和他刚刚领到的崭新军装是同一个样式。一个叼着烟卷的老兵拍了拍他僵硬的肩膀，满不在乎地说：“别怕，到了西线，这玩意儿比河里的鱼还多，看习惯就好了。” \n\n那天夜里，他们宿在一座四处漏风的教堂里，神像的半边脸已经塌了，正用一只空洞的眼睛悲悯地望着他们。他不敢睡，把那块手帕平铺在冰冷的石板上当作枕头，帕子上野蔷薇的绣样被他无声的泪水泡得微微发涨。在恍惚的梦境里，他看见安雅正蹲在家乡的河边洗衣，沉重的木槌一次次敲打在青石板上，咚、咚、咚······那声音，像是在一声声数着他离家的日子。\n\n当开拔的号角声撕裂清晨的浓雾时，他最后一次、也是此生最后一次，望向了东方的地平线。一轮红日正挣扎着从地平线下爬起来，将远方的草滩镀上了一层薄薄的、温暖的金光，那正是他记忆里家乡麦田成熟时的颜色。他不知道，这一眼，竟是他与故乡的永诀。他下意识地攥紧了怀里的手帕，那块被他体温焐得温热的布料上，母亲用尽心力缝制的野蔷薇，其中一根丝线，终于在一连串看不见的、细微的崩裂声中，悄悄地断了。那感觉，就像他与家乡之间，某种最根本的联系，也随之永远地断裂了。\n"
OMS_yazov_GG.12.a: "江城歌吹风流，雨过平山，月满西楼。"

OMS_yazov_GG.11.t: "······八十始得归"
OMS_yazov_GG.11.desc: "信使的马蹄踏碎村口水洼里最后一层薄冰时，阿列克谢的母亲，叶卡捷琳娜，正蹲在自家那只破了个豁口的陶罐前，翻晒着去年秋天采来的、已经毫无水分的野菜干。去岁冬天的雪还没化透，屋檐下的冰棱垂得老长，在惨白的日光下折射出森冷的光。村子里一片死寂，只听得见风刮过破败的篱笆时发出的、呜咽般的声音。\n“请问，是叶卡捷琳娜女士吗？”\n一个穿着灰色制式大衣的年轻人从疲惫的马背上滑下来，他的军靴上裹满了凝固的泥浆，泥里还嵌着一小片焦黑的布料，那是西线军服上才会有的料子。年轻人看起来不过二十岁，脸上却带着不属于这个年纪的、被硝烟和死亡蚀刻出的疲惫。他从一个磨损严重的帆布包里，小心翼翼地掏出一个扁平的、边缘已经生锈的铁皮盒。盒盖没有扣严，从缝隙里露出半角绣着野蔷薇的、早已看不出本色的手帕。那手帕上的针脚曾经那么细密，如今却浸满了早已发黑的血渍。\n“阿列克谢······我的······我的孩子他怎么了？” 老人的手猛地顿在陶罐的边缘，指尖的野菜干簌簌地掉进罐底，发出一种极其细碎的、令人心慌的声响，眼睛死死盯着那个铁皮盒。\n信使没有说话。他只是沉默地、近乎于一种仪式般地，将那个冰冷的铁皮盒递了过去。叶卡捷琳娜接过它，盒子的重量远比她想象的要轻。她打开盒盖，里面除了那块她亲手缝制的、浸透了血污的帕子，还有一颗被摩挲得异常光滑的蓝色弹珠，那是阿列克谢走之前，从他弟弟手里赢来的。弹珠旁压着一张折叠起来的、被雨水泡得字迹发晕的官方通知：“三月十七日，士兵阿列克谢·伊万诺维奇同志于柏林外围战役中英勇牺牲，尸身无存，特此告知。” 最后那“尸身无存”四个字，被一大片深紫色的液体盖住。\n信使沉默地翻身上马，临走前，他最后看了一眼。老人正把那个空荡荡的铁皮盒紧紧抱在怀里，像抱着一个婴儿，步履蹒跚地向村口那棵老槐树的方向挪去。他知道，树洞里还藏着她给阿列克谢留的、早就硬得像石头的麦饼。麦饼上的牙印，是去年邻村的安雅来借粮时，饿得实在受不了才啃下的。那个总是在村口等着阿列克谢回信的姑娘，后来也跟着一支担架队去了西线，再也没有回来过。\n后来村里幸存的人说，那天夜里，那棵早就枯死的老槐树，竟落了满地的、像雪一样的白花。花瓣轻轻盖在那个被老人放在树下的铁皮盒上，像给它铺上了一层单薄的、洁白的棺椁。而在叶卡捷琳娜的枕头上，那朵野蔷薇的颜色终于完全褪去，只剩下针脚勾勒出的、一个空洞的轮廓，像一个没能说完的谎言，在这无尽的寒夜里，慢慢地、彻底地冷透了。\n"
OMS_yazov_GG.11.a: "几许年华，三生醉梦，六月凉秋。"

OMS_yazov_GG.10.t: "离弃"
OMS_yazov_GG.10.desc: "内务部专员谢尔盖捏着汇报册的手指因为过度用力而泛出死人般的惨白，锃亮的靴跟在指挥部冰冷的水泥地板上磕出急促而紧张的响声。“报告总司令同志，” 他的喉结剧烈地滚动了一下，声音却经过刻意的训练，洪亮得有些失真，“根据最新统计，各区粮库储备充足，日均配给标准已稳定在八百克土豆，民众无一人受饿，情绪稳定。”\n\n“上周我去前线模范社区督查时，还看见孩子们在广场上快乐地放风筝。” 谢尔盖似乎想为自己的报告增加一些生动的佐证，他用微微颤抖的指尖，划过册页上一幅色彩鲜艳的插画。画上确实有一个穿着红裙子的小女孩，高举着一只鸽子形状的风筝，那根看不见的线绳，一直飘向一角无比湛蓝、毫无阴霾的天空。\n\n亚佐夫突然毫无征兆地站起身，军靴碾过地上的几颗碎煤渣，发出令人牙酸的“咯吱”声。“现在，我们再去看看。” 他的声音平静得可怕，径直走向门口。谢尔盖的脸色瞬间变得像墙角的灰泥一样，毫无血色，仿佛被一阵看不见的寒风吹散了所有的伪装。\n\n车队驶出城区时，天空开始飘落灰黑色的雪花。道路两旁的白桦树光秃秃的，枝桠下有着一些深色的、人形的...“东西”，被饥饿的乌鸦啄食得只剩下半张模糊的脸。他们就那样挂在树上，像一串串风干的、可怖的果实。“是······是前阵子没来得及处理的······，很快······很快就会清理掉。” 谢尔盖别过脸去，嘴里含混不清地嗫嚅着，不敢再看窗外。\n\n三号粮库的巨大铁门虚掩着，当警卫推开门的一瞬间，一股混合着霉味和馊味的恶臭便劈头盖脸地砸了过来。仓库里，空麻袋堆积如山，墙角的老鼠正肆无忌惮地啃食着一块已经长出绿毛的面包，见到活人走近也毫不躲闪。亚佐夫弯腰捡起一张被踩进泥里的配给卡，上面的日期停留在半个月前，签名处的墨迹早已干涸成一团灰色的污渍。\n\n“画上的那些孩子呢？” 他突然问，声音不大，却像一把冰锥刺进谢尔盖的耳膜。谢尔盖的嘴唇剧烈地哆嗦着，一个字也说不出来。亚佐夫没有再逼问他，而是转身走向不远处的那个所谓的“模范广场”。插画上那个穿着红裙子的女孩不见了，那只鸽子风筝的残骸已经四分五裂，线绳被缠绕在光秃秃的电线杆上。广场的角落里，蹲着一个瘦得几乎脱形的女孩，他正用牙齿费力地啃着一块冻硬的树皮，嘴角渗出的血丝在苍白的脸上格外刺眼。\n\n“叔叔，” 女孩抬起头，那双眼睛里没有任何孩童应有的光彩，亮得像两块碎玻璃，“我的风筝······被野狗咬烂了。”\n\n回程的车上，谢尔盖终于崩溃了，他捂着脸，发出压抑的、如同受伤野兽般的呜咽。而亚佐夫只是静静地看着他，脸上没有任何表情。那本掉落在脚垫上的、制作精美的汇报册被他捡了起来。他漫不经心地翻了翻那已经泛黄起皱的纸页。 车窗外的雪越下越大，很快便将路两旁那些东西覆盖成了一个个洁白的小土包。\n"
OMS_yazov_GG.10.a: "天空被渐渐染上暗色，如黒檀般的暗色。"

OMS_yazov_GG.9.t: "回响"
OMS_yazov_GG.9.desc: "“就去这里。” 亚佐夫的手指重重地扣在指挥部地图上一个几乎快要被遗忘的角落。那个村庄的名字被经年的墨水洇得发乌，像一块没能彻底擦干净的陈年污渍。\n\n副官的脸色瞬间变得青紫，嘴唇翕动了几下，最终还是没敢提出任何异议，只能硬着头皮去安排行程。当车队颠簸着抵达村口时，亚佐夫眯起了双眼：眼前的景象，干净得令人不安。土坯墙明显是刚刚用白灰粉刷过的，还没干透的墙皮在寒风中散发着刺鼻的气味；屋檐下晾晒的玉米串，红得像一团团燃烧的火焰，晃得人眼睛生疼；几个穿着崭新花袄的妇人，正围坐在村口的石磨旁有说有笑，手里揉搓的面团，白得像刚落下的新雪。\n\n“首长！是首长来啦！” 一个满脸堆笑的男人搓着手从村里迎了上来，他脸上的皱纹里都挤满了刻意的、近乎谄媚的笑意，自称是这里的村长。亚佐夫没有理会他伸出的手，径直走向那个石磨。看到他走近，原本说笑的妇人们像是被掐住了脖子的鸡，瞬间噤声，慌乱地将手里的面团藏进身旁的竹篮里，指尖沾着的白色面粉簌簌地往下掉。亚佐夫的余光瞥见，一个妇人的篮子底，露出了一点黑褐色的东西，那是掺了大量麸皮和草糠才会有的颜色。\n\n“今年的收成，看起来很好？” 他在一个纳着鞋底的老太太旁边蹲下身。老人的手背上布满了深可见骨的裂口，粗糙的麻线在满是老茧的布料上勒出一道道深深的痕迹。“好······好得很······” 老人的声音因为紧张而微微发颤，眼神却不受控制地瞟向身后那间低矮的土屋。屋子的窗户上，糊着破旧的报纸，一个小孩正扒着窗户的缝隙，偷偷向外张望，他饿得前胸贴后背，肚子凹陷下去，像个干瘪的口袋。\n\n妇人们的谈笑声再也没有响起。亚佐夫顺着她们恐惧的目光望去，在村口那堵崭新的白墙下，不知何时站着一个穿着灰色大衣的男人，他背着双手，腰间的枪套在阴沉的天色下闪着冰冷的金属光泽。村长的笑容彻底僵在了脸上，他压低声音，结结巴巴地解释道：“是······是上级派来······保护咱们安全的同志。”\n\n“啪”的一声，老太太手里的麻线突然断了。她趁着所有人注意力都在那个灰衣男人身上时，飞快地将半块硬邦邦的东西塞进了亚佐夫的手心，那是一块掺杂着草籽和木屑的窝头，粗糙的颗粒在他手心里硌得生疼。“别······别让他们看见。” \n\n亚佐夫捏着那块比石头还硬的窝头，缓缓站起身。他身后那堵崭新的白墙上，一块白灰因为承受不住寒风而簌簌地剥落下来，露出了里面潮湿、发黑的烂泥。那个穿灰衣的男人正一动不动地盯着他，眼神锐利得像是在清点他口袋里的每一个秘密。远处，突然传来一阵孩子们的“笑声”，清脆得像一把玻璃珠子撞在一起，却无论如何也盖不住从那间低矮土屋里传出的、一声压抑至极的咳嗽。\n\n那声咳嗽，微弱得如同叹息，却像一根烧红的钢针，轻轻地、却又毫不留情地，刺破了这层用谎言、白灰和恐惧精心糊起来的、所谓“太平盛世”的幻象。\n"
OMS_yazov_GG.9.a: "本来无一物，何处惹尘埃？"

OMS_yazov_GG.8.t: "林间漫步：其一"
OMS_yazov_GG.8.desc: "庆典的烟火在暮色里炸开虚妄的金红，震耳的欢呼如潮水般拍打着指挥部的窗棂。亚佐夫将那件缀满勋章、重得像一副锁子甲的制服甩在指挥部案头，金属徽章与红木桌面碰撞出刺耳的声响。他没有回头，军靴碾过散落在地上的腐叶与碎石，一步步向着指挥部后方那片死寂的森林深处跋涉。德意志的万字旗刚刚在红场上被烈火吞噬，被千万只脚踩进泥沼，可脚下这片焦土却比列宁格勒的冻土更刺得他灵魂发慌。这片土地是“胜利”的巨大伤疤，而疤底下，仍在不断渗出新鲜的、温热的血液。\n\n他摸到一截被闪光和热浪燎烤过的枯死树干，树皮皲裂，上面纵横交错的纹路宛如一幅战争地图。1941年的风雪毫无征兆地从记忆深处呼啸而来：十七岁的他抱着一捆冰冷的炸药包，在刚刚没过膝盖的雪地里冲向德军的坦克。雷管的火花短暂地映亮了战友们冻得发青的面孔，他们眼中燃烧着一种近乎天真的火焰。可如今，在那些被炸碎的、堆积如山的钢铁残骸里，钻出的却是比法西斯、纳粹主义更狰狞、更无形的荒芜。远处的河湾泛着一层黑雾，那黑雾如此浓密，连一丝光亮都无法穿过。一个渔民的网兜挂在岸边的枯枝上，里面有几条半死不活的鱼，它们的鳞片上还嵌着细小的弹片齿印。这，就是胜利留下的毒瘤，它已经扩散到了这片土地的血脉深处。\n\n军大衣兜住夜间的寒风，风里带着一点不知道从哪里来的血腥味。亚佐夫突然低声笑了起来，笑声在空旷的林间显得格外突兀，惊飞了几只在枯枝上打盹的寒鸦。他终于意识到，自己才是这场宏大悲剧中那个最滑稽、最可悲的丑角：高举着“复仇”与“解放”的旗帜，将整个世界拖入火海；他以为自己用核弹彻底砸碎了条顿人的铁蹄，却没防住人性的欲望与权力的傲慢，在所谓的“和平”里，比战争更高效地啃噬着这片山河。\n\n他双膝跪倒在冰冷的冻土上，看月光把自己的影子拉成一个佝偻、扭曲的问号。战争摧毁的，何止是柏林的国会大厦？是法西斯的政权？眼前这片森林在微风中静静地磨灭，河流泛着死鱼烂虾的白沫，流离失所的同胞在城市的废墟里像野狗一样刨食······这一切，不过都是他那场“伟大胜利”的陪葬品。当年抱着炸药包冲向虎式坦克时，他心里唯一的念头是“让我们的后代不再承受这种苦难”，可他的后代在一个无人知晓的角落里，悄无声息地死去。\n\n林间的浓雾升腾起来，温柔地、却又毫不留情地裹住了这个满身勋章的、彻头彻尾的失败者。他知道自己救不了这片土地上所有的苦难，但他想，至少，至少应该在这场无尽的反思与痛苦中，种下一颗种子。就像当年列宁格勒的皑皑白雪之下，总有一些冻土在沉默里，顽固地、绝望地，孕育着下一个春天的嫩芽······\n"
OMS_yazov_GG.8.a: "战争？战争永不改变······"

OMS_yazov_GG.7.t: "伊甸园"
OMS_yazov_GG.7.desc: "亚佐夫的意识陷在棉絮般的黑暗里，炮火轰鸣的余震还在颅骨里跳踢踏舞。当他睁开眼，却看见漫山无花果树垂着蜜色的果，溪流漂着睡莲，露珠坠在草叶上碎成星星——这不是被炸烂的指挥部，也不是焦土上的临时医院。\n\n“德米特里·季莫费耶维奇。”溪边传来熟悉的声音。\n\n亚佐夫转身，军靴踩在苔藓上没沾半点泥。卡尔贝舍夫坐在光滑的石头上，制服熨得笔挺，袖口沾着粉笔灰，正用树枝在溪水里画着什么。水流过他指缝，长出银鱼似的光斑。\n\n“导师？”他喉头发紧。他梦寐以求的人，远在天边的人，却偏偏出现在了他的眼前。他想抬起手来，却发现手臂像灌了铅一样沉重······\n\n“你看这园子。”卡尔贝舍夫没回头，树枝划过的地方浮出秧苗，转瞬成沉甸甸的麦穗，“没有铁丝网，没有岗楼，连铁锹都生着铜锈······人本该这样活着，不是吗？”\n\n亚佐夫摸向军装，勋章和弹孔都消失了，胸前只有块温热的怀表，打开竟是片柳叶。他看见溪边泥地的倒影：十七岁的自己，抱着刚发的课本，跟在卡尔贝舍夫身后穿过列宁格勒的白桦林。\n\n“他们说您死了。死在森林里。”他蹲下身，溪水漫过脚踝，开出一串铃兰，“我后来去了那里，是一个好地方······”\n\n卡尔贝舍夫把树枝插进土，瞬间长成参天橡树······\n\n风掀起漫天花瓣，远处田埂上，穿工装的人在收割，孩子们追着蝴蝶跑。这画面刺得他发酸。\n\n这才是他们发誓要守护的，不是勋章，是让铃兰在溪边开花的安宁。\n\n震颤突然撕裂梦境。橡树叶子簌簌坠落，带着焦黑的洞。卡尔贝舍夫的身影变得透明，粉笔灰飘成灰烬······\n\n亚佐夫伸手去抓，只握住一把滚烫的碎玻璃。\n\n梦外的世界正在崩塌。防空洞钢筋发出了一声尖锐的哀鸣······他猛地睁眼，眼前是乌斯季诺夫和一群医生们守着精密的仪器，不知何时，他怀里却攥着片焦黑的树叶。这像极了伊甸园里那棵橡树上掉下来的第一片叶子。\n"
OMS_yazov_GG.7.a: "命运引导顺从者，拖拽抗拒者。"

