OMS_more_flavor.194.t: "哀 戦士"
OMS_more_flavor.194.desc: "悲哀，颤抖的悲哀！\n这是一首离别之歌。\n疲惫的骨头也燃烧殆尽，湿润的皮肤，也将归于土地。\n在荒野上罗列奔跑的死神，朦胧扭曲的浓烟，熊熊燃烧的烈焰！\n\n悲哀，生命的悲哀！\n鲜血的颜色洒遍大地，\n但能够开启新的时代吗？\n幸存下来的哀战士们！\n\n不畏死亡赴死的男人们，\n为了想要守护的女士们。\n不畏死亡赴死的女士们，\n向着所爱的男士们。\n赌上什么？留下什么？\n我祈祷，祈祷迎来新时代！\n\n悲哀，痛心的悲哀！\n现在只知道这些，杀向不知姓氏的战士。\n苟延残喘，口吐鲜血！\n疾风似的死神的队伍，\n我没有反抗的办法！\n\n浴血而战的男人们，\n为了在故乡等候的妻儿们！\n浴血而战的女士们，\n为了所信赖的男人们！\n赌上什么！又会留下什么！"
OMS_more_flavor.194.a: "我祈祷，祈祷迎来的新时代！"
OMS_more_flavor.195.t: "ETERNAL WIND"
OMS_more_flavor.195.desc: "悲伤如碎片一般，\n封闭的街道上，下着玻璃一样的雪。\n就连寻找着明天的眼眸，也在黑暗的彼方渐渐地黯淡。\n被未知的力量卷入时代的洪流，我的心不知该去往何处，\n在快要破碎的内心深处，只有心跳还存在着。\n\n在闪耀的风中，我能听到你的声音。\n「祈祷着永远不要打破和平」，\n这耀眼的光辉，让我坚信不疑。\n\n那蓝色水平线上的青霭，现在仍然刻刻烙印在我的双瞳中。\n每当我闭上眼睛，仿佛呈现眼前的，\n曾经那些温暖的时光···和那些难以忘怀的回忆···\n总是不断地重复着错误，我曾变得像生物一样麻木。\n但即使要伤痕累累地活下去，我也绝不会让人看到我的泪水。\n\n在光芒的风中，我看到了你的微笑。\n「祈祷着永远不要打破和平」，\n我注视着那道光辉——\n这百折不挠的疼痛是为了谁？我终于清楚感觉到了！\n与你相逢，是在几亿星辰的宇宙中的奇迹。\n\n在离别时我方才明白，你内在之中的温柔善良。\n我可以每天挺起胸膛地说，你就是我最为重要的人。\n\n总有一天，我可以肯定的说，\n在闪耀的风中，就在那里，我看到了你的微笑。\n「祈祷着永远不要打破和平」，\n我注视着那道光辉..."
OMS_more_flavor.195.a: "在炽热的眼中留下烙印。"
OMS_more_flavor.196.t: "相逢"
OMS_more_flavor.196.desc: "相信······\n人经历重重悲伤变得成熟。\n现在，因孤独而感到颤抖着的，我的爱人啊，\n你的悲伤，就让我紧紧拥抱在怀中。\n\n相信······\n眼泪啊，回到大海去吧！\n日渐强烈的思念，\n宇宙，渐渐染成暗红色。\n\n是的，亲爱的，是的，我的挚爱！\n我深爱的人啊，一定要再一次...\n是的，亲爱的，是的，我的挚爱...\n我想回到你身边，\n没人能够独自生存。\n\n想到不归之人，心中阴影笼罩。\n现在，如果能从悲伤的彼方驾船而来，\n相信终有一天能够重逢，\n\n相信······\n眼泪啊，回到大海去吧！\n因为爱而煎熬，\n无尽的思念浸染宇宙！\n是的，亲爱的，是的，我的挚爱！"
OMS_more_flavor.196.a: "我想回到你身边，没人能够独自生存。"
OMS_more_flavor.197.t: "寂静之声"
OMS_more_flavor.197.desc: "在星星不断飘落的屋顶上，\n独自聆听着天空的八音盒。\n遮蔽着双眼，走过玻璃绳索。\n大家都是寂寞马戏团的孩子啊。\n孤单一人的悲伤，\n吱吱作响的绳索，与摇摇欲坠的心······\n\n寂静之声，这寂静之声！\n想与有着温柔眼神的某个人邂逅，\n在我耳边细语吧，我就在你的身旁······”这样说着。\n\n轻轻落下的泪水在手掌上形成人字，\n让我的心感到了一股暖流。\n每次放弃，仍不死心。\n日暮途穷的懦弱的小丑啊！\n\n在没有掌声的星空中，\n巨大皮球的表演者们，举起了双手！\n寂静之声，这寂静之声！\n在温柔的街道堆积的黑暗是···"
OMS_more_flavor.197.a: "沉默之眼，这沉默之眼！"
OMS_more_flavor.198.t: "复活的伊迪安"
OMS_more_flavor.198.desc: "听得见吗？你能听见了吧，远方传来的咆哮！\n在黑暗中震撼的心灵，那醒觉的开始。\n从大地中破裂而出的那耸立的身姿，是否为正义的证明？\n\n传说的巨神之力，直把银河撕裂。\n\n咆哮的巨人，唤来那电光石火的一击。\n不要颤抖，凝神而视，那复活的时刻。\n\n要战斗吗，还能战斗吗？胆怯的灵魂啊！\n向步步紧逼的邪恶力量，展示勇气吧！\n飞向宇宙，这闪耀的身姿，是否为生命的呐喊？\n\n传说的巨神之力，将把银河撕裂！\n这最终的一击，为了守护自身粉碎万物！\n无须畏惧，敞开心防，这复活的时刻。\n人们啊！生命啊！看着这力量吧！"
OMS_more_flavor.198.a: "传说中的巨神，伊迪安！"
OMS_more_flavor.199.t: "Turn-A-Turn"
OMS_more_flavor.199.desc: "是谁注定了，时间必须向前进？\n\n将生命的烙印消去，覆写历史。\n\n美丽的剑，将人们相连，\n\n把循环不息的悲伤和哀痛驱除！\n\n在你我之间，生命的形状，\n\n将其献给这星球，作为<UNKNOWN>的象征。\n\n所有人都曾相信，时光可以倒流。\n\n可以在漆黑的日历上，刻下新的痕迹。\n\n星星在闪烁，向生灵微笑。\n\n太阳与月亮，将大地温暖。\n\n破壳而出的喜悦，将慈爱的心，\n\n慢慢培养，治愈过去的伤口。"
OMS_more_flavor.199.a: "Arbitrary x∈C，human(x)。"
OMS_more_flavor.200.t: "WANA"
OMS_more_flavor.200.desc: "绝望是甜美的陷阱，门扉被紧紧的闭着。\n\n心灵就是战场，谁也无法拯救。\n\n狭小的心脏，被命运操纵，\n\n使用武力的士兵，开始了杀戮。\n\n在这开始崩坏的童话世界里，连生命都当做游戏吗？\n\n心中的痛一直无法忘记，\n\n欲望是毒苹果，到手的东西又算什么？\n\n能留下什么给未来的孩子们？\n\n共同生存的喜悦，也消失在远方。\n\n远方传来如同祈祷的摇篮曲，\n\n相信着真善美饶恕了所有。"
OMS_more_flavor.200.a: "如同关爱一般，只需要共同分享，互相理解。"

