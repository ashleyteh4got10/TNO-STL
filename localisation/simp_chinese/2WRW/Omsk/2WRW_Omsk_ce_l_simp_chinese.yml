OMS_soldiers_eat_first_tt: "§F我们将实行紧急措施。\n§Y军事训练§!§F，§!§Y征兵制度§!的§G政策落实率将被设为100%！§!§!"
OMS_last_light_tt: "§g这个世界只是一台手摇风琴，只能由天主亲自弹奏。\n而我们所有人都只能跟着风箱拉出的音符起舞。§!"
OMS_decapitate_cerberus_tt: "§g将解锁对£GFX_OMS_teutons_texticon §q条顿人§!的最终解决方案。§!"
 OMS_PT_2WRW_grand_offensive_stratagem_decision:0 "大进攻战略"
 OMS_PT_2WRW_grand_offensive_stratagem_decision_desc:0 "我们将从仓库中转移额外的资源，以亚佐夫同志本人的精神发动一场盛大的总攻势。"
 OMS_PT_2WRW_ceaseless_assault_stratagem_decision:0 "无休止进攻方略"
 OMS_PT_2WRW_ceaseless_assault_stratagem_decision_desc:0 "我们的政委将向我们的士兵灌输无情地向敌人冲锋所需的爱国热情，在消灭所有反动派之前永不停歇。"
 OMS_PT_2WRW_chemical_saturation_stratagem_decision:0 "化学饱和战术"
 OMS_PT_2WRW_chemical_saturation_stratagem_decision_desc:0 "额外的飞机、大炮和火箭将会被制造以携带更多化学武器。当我们的士兵在它后面行进时，一团化武之云将席卷德国人。"
 OMS_PT_2WRW_firestorm_assault_stratagem_decision:0 "烈火突击战略"
 OMS_PT_2WRW_firestorm_assault_stratagem_decision_desc:0 "日耳曼之病疫将被一场烈焰风暴根除，这场风暴将烧毁他的堡垒、他的家园和他的梦想。正如敌人进军我们的祖国时，焦土迎接他们一样，当我们的士兵将把条顿人的巢穴夷为平地时，焦土也将迎接他们。"
