OMS_more_flavor.101.t: "祖国的地基"
OMS_more_flavor.101.desc: "刺骨的寒风如剃刀般刮过乌拉尔以西的广袤平原，卷起冻土的碎屑，抽打在基里尔早已失去知觉的脸颊上。他将最后一颗铆钉敲进冰冷的钢梁，沉闷的撞击声在风的咆哮中显得微不足道。老兵的双手早已被冻得麻木，那厚重的劳工手套仿佛已与他的皮肤融为一体。\n\n他的老战友，阿尔卡季，正靠在一旁，点燃了一支劣质的、联盟配给的香烟。烟头的火星在灰蒙蒙的天空下忽明忽灭，如同垂死的心跳。他们脚下，一座宏伟到近乎荒诞的地下堡垒正在成型——一个匍匐在大地之下的水泥巨兽，其钢铁的肋骨刺破地表，指向阴沉的天穹。\n\n“十年了，基里尔。整整十年。”阿尔卡季沙哑的嗓音被风吹得支离破碎，“从我们跟着政委冲出秋明，到现在站在这鬼地方。十年了。感觉就像一百年。”\n\n基里尔没有作声，只是接过阿尔卡季递来的香烟，深深地吸了一口。那呛人的烟雾让他剧烈地咳嗽起来，却也给冰封的肺带来了一丝久违的灼热。他想起了过去那十年。想起了在维亚特卡泥泞的战壕里，如何把那些高喊着“自由”的帝制派傻瓜的脑袋砸开。想起了在阿尔汉格尔斯克的废墟中，如何躲避那些高唱着国际歌的红军疯子的子弹。他还想起了在科米那片腐臭的沼泽里，那些自称“神圣帝国”的狂徒，在火焰喷射器的烈焰中扭曲尖叫的模样。\n\n他们赢了。是的，他们赢了。一张张地图被涂上黑色，收音机里那个冰冷的声音宣告了祖国的再度统一。可基里尔环顾四周，看到的只有更多的壕沟与更多的混凝土。俄罗斯成了一座巨大的、没有墓碑的坟墓，而他们就是这坟墓的掘墓人。\n\n“你说···我们还会有下一个十年吗，老伙计？”阿尔卡季的声音里透着一种他只在死囚身上听过的疲惫。“大审判···他们总这么说。可就算我们打赢了，又能剩下什么？一片被烧焦的土地？和一群像我们这样，除了仇恨什么都不知道了的活死人？”\n基里尔的目光越过眼前尚未完工的工事，望向远方那无尽的地平线。他想起那个在托木斯克阳光下的小木屋，他的妻子娜塔莎会在那里晾晒床单，女儿安雅会追着蝴蝶跑过长满矢车菊的草地。那是在另一个世纪，另一个宇宙了。黑色联盟的浪潮吞噬了那一切，连同他的记忆一起，只留下一片冰冷的、黑色的空白。\n他已不再为他们而战了。他之所以还在战斗，只是因为这是唯一剩下可做的事。复仇，这个词像锈迹斑斑的铁钉，早已钉死在他灵魂的棺木上。拔不出来，也无处可去。\n“我不知道，”基里尔终于开口，声音被风吹得有些遥远，“我只知道，头儿说了，日落前必须把这面墙砌完。”\n他将烟头扔在地上，用磨损的军靴跟狠狠碾灭。那点微弱的火光，就像一个不合时宜的玩笑，瞬间便被无边的严寒吞噬。远处传来监工声嘶力竭的吼叫，催促着他们回到岗位上。基里\n尔弯下腰，拾起那柄沉重的铁锹。铁器冰冷的触感，穿透手套，刺入骨髓，却让他感到一种异样的、几乎是令人宽慰的熟悉。\n因为在这片广袤的钢铁坟墓里，这才是唯一真实的东西。\n"
OMS_more_flavor.101.a: "拿起铁锹，继续挖掘。"
OMS_more_flavor.102.t: "锈蚀"
OMS_more_flavor.102.desc: "冲床最后一次沉闷地落下，像一声疲惫的叹息，然后便永远地沉默了。它那钢铁的灵魂，随着维克多用撬棍撬断最后一根主供电缆而彻底消散。飞溅的火花在他满是油污和冻疮的脸颊上投下短暂的光亮，转瞬即逝。\n\n维克多不记得自己在这座位于新西伯利亚郊外的工厂里干了多久。他只知道，这里曾是“新星”拖拉机厂，是布哈林时代许诺给西伯利亚的工业心脏。在他还不是一个代号，而是一个有名字的人时，他曾亲手为这里的传送带上过油。后来，共和国的白蓝红旗取代了镰刀锤头，他继续在这里组装零件，为了一个他并不真正理解的“民主未来”。\n\n如今，黑色联盟的旗帜挂在锈迹斑斑的龙门吊上，像一只觊觎腐肉的乌鸦。而他的工作，不再是组装，而是拆解。\n\n每一根钢梁，每一台车床，每一片还能用的铁皮，都要被贴上标签，登记在册，然后装上开往西方的火车。它们将在另一座城市的另一座工厂里重生，化为枪管、炮弹或是地堡的钢筋。至于剩下的，那些被联盟判定为“低效”、“腐朽”、“不值得运输”的部分——比如他脚下这座工厂摇摇欲坠的骨架——将被就地熔毁，铸成铁轨，以承载这趟通往大审判的复仇列车。\n\n维克多又咳了起来，肺里仿佛有无数细小的玻璃碎片在刮擦。这里的空气永远弥漫着金属切割的焦糊味和无法名状的化学粉尘。他想起了他的妻子，伊琳娜。去年冬天，她就是因为同样的咳嗽死去的。监工只是在登记簿上划掉了她的名字，然后把她的那份黑面包配给分给了维克多，作为他“加倍努力以弥补劳动力损失”的奖励。\n\n“874号工人！”\n\n一个穿着笔挺黑制服的政委，年轻得让他感到恶心，正用警棍指着他。“你的配额落后了。是想用你的骨头去填补乌拉尔防线的混凝土吗？”\n\n维克多没有回答，只是默默地转身，用尽全身力气去拖动一块巨大的钢板。这钢板曾是冲床的基座，沉重得仿佛承载着这片土地所有的悲伤。他的肌肉在尖叫，视野因缺氧而阵阵发黑。他不在乎政委的威胁，也不在乎那所谓的“大审判”。他只想活下去，哪怕只是多活一天，多看一次西伯利亚那冷漠而苍白的日出。\n\n或许，是过度劳累让他产生了幻觉。又或许，是那根已经承受了太多次吊装的铁链，终于厌倦了这无休止的轮回。\n\n先是传来一声尖锐的、金属疲劳的呻吟。\n\n然后，是政委惊恐的、不成调的叫喊。\n\n维克多甚至没有时间抬头。他只感觉到一股无法抗拒的巨力从天而降，仿佛整个西伯利亚的天空都塌了下来。没有痛苦，只有一瞬间的错愕，以及一个无比清晰的、荒诞的念头：伊琳娜，我来找你了。\n\n当工友们围拢过来时，看到的只是一滩在钢板下缓缓蔓延开来的、与铁锈别无二致的暗红色。那个年轻的政委厌恶地啐了一口，转向离他最近的工头。\n\n“把他弄出来，别耽误进度。”他冷冷地命令道，“还有，通知后勤。874号工人今晚的配给······取消。”\n\n工头麻木地点了点头，挥手叫来几个同样麻木的工人。在工厂永不停歇的拆解噪音中，没有人再提起维克多的名字。他就像一块被判定为“无回收价值”的废铁，被这台巨大的、名为“复仇”的机器，悄无声息地碾进了历史的尘埃里。\n"
OMS_more_flavor.102.a: "把这堆废料清理干净。"
OMS_more_flavor.103.t: "编号1138"
OMS_more_flavor.103.desc: "你挥动十字镐。\n\n每一次，冰冷的钢铁与永冻土的碰撞都化作一道电击，从你那早已生满冻疮、形如枯枝的手指，窜上你麻木的双臂，直达你空洞的胸膛。肺部在稀薄而尖锐的空气中燃烧，呼出的每一口气都在瞬间凝结成白雾，然后被永不停歇的西伯利亚寒风撕碎。\n\n你甚至已经忘了自己究竟犯了什么罪。\n\n真的，你努力地回想过。在那些无法入眠的、被数十人咳嗽声与噩梦呓语填满的漫漫长夜里，你试图搜刮记忆的残渣。是一个不合时宜的笑话？是一句酒后的怨言？还是一本你在某个尘封的阁楼里翻出的、封面已经褪色的禁书？你不知道。记忆就像一块被反复使用的铁板，早已被日复一日的苦役和无休止的饥饿擦拭得光滑如镜，再也映不出任何过去的倒影。\n\n你的名字叫弗拉基米尔。至少，你隐约记得有人曾经这么叫过你。但在这里，在那名总是立于矿坑边缘、身影被灰色天空衬得如同墓碑的监工口中，你是编号1138。你的身份，就是你手中那柄十字镐每一次落下时，从冻土里迸出的那一小块带着铁锈色泽的矿石。\n\n“你们不是囚犯！”\n\n矿坑上方的扩音器里突然爆发出刺耳的、充满着金属质感的咆哮，是政委录制好的每日训话。那声音带着一种扭曲的、不容置疑的狂热，回荡在你们这群沉默的活死人头顶。\n\n“你们是祖国最宝贵的矿藏！日耳曼人有他们轰鸣的高炉；我们有你们燃烧的肺！他们有自动化的钻机；我们有你们碎裂的双手！忘掉你们过去的身份，你们现在是俄罗斯复仇的活体资源！你们砸下的每一块矿石，都是砸向德国堡垒的一块砖！你们流下的每一滴汗水，都将汇成驱动我们坦克的燃油！你们的痛苦，是喂养战争机器的食粮！为大审判效死，你们的牺牲将被铭记！”\n\n你身边的一个人倒下了，悄无声息，就像一袋被抽空了的谷物。没有人停下，甚至没有人看他一眼。监工只是在手里的写字板上划了一笔，然后用靴尖不耐烦地拨弄了一下那具躯体，就像拨开一块碍事的石头。他甚至懒得叫人把尸体拖走。\n\n十字镐变得越来越重。你的视线开始模糊，眼前的世界只剩下一片单调的、令人作呕的灰与白。在机械的劳作间隙，一个念头如同幽灵般闯入你的脑海——你想起了面包的味道。不是这里发的、掺着木屑的黑面包，而是某种······温暖的、松软的、带着麦香的味道。是谁为你做的？是妈妈吗？还是妻子？你记不清了。\n\n那阵虚假的温暖让你感到一阵眩晕，但你咬紧牙关，将那该死的、会带来软弱的念头狠狠地驱逐出去。软弱意味着倒下，倒下意味着成为被监工用靴尖拨弄的另一块石头。你不能倒下。\n\n不知过了多久，结束劳作的汽笛声终于如蒙大赦般响起。你拖着沉重的步伐，和一群同样沉默、同样灰暗的影子一起，排队领取一勺几乎看不见谷粒的稀粥和一块能硌掉牙的黑面包。你狼吞虎咽地吃完，甚至品尝不出任何味道。\n\n回到那张硬木板搭成的、勉强可以称之为“床”的地方，你蜷缩起来，用那条薄得像纸一样的毯子裹紧自己。你很冷，很饿，很累，但你还活着。\n\n你有时也会想，当那个所谓的‘大审判’真的结束时······当最后一个日耳曼人化为灰烬时······是否会有人记得，一个叫弗拉基米尔的人曾经存在过？还是说，你此生的全部意义，你所有的苦难，最终只会凝结成一颗射向某个无名敌人的、毫不起眼的子弹，然后便彻底湮没在历史的喧嚣里，无人问津？\n\n这个问题没有答案。\n\n你闭上双眼，在无尽的疲惫中沉沉睡去。又一天过去了。明天，你还会继续挥动十字镐。\n"
OMS_more_flavor.103.a: "只是又一天过去了。"
OMS_more_flavor.104.t: "报告一则"
OMS_more_flavor.104.desc: "呈报：军备与技术部，中央指挥部\n发自：安东诺夫少校，乌拉尔军区第7工程勘探大队\n主题：关于在马格尼托哥尔斯克区域发现的“734号设施”及其回收价值的初步报告\n\n遵照最高司令部关于在马格尼托哥尔斯克周边区域勘探新式工事地点的指令，我部第3勘探排于本日0800时，在坐标[已涂黑]处发现一处未在任何现存地图或档案中记录的、被完全封存的地下设施入口。入口被厚达三米的钢筋混凝土完全封死，经爆破后得以进入。\n初步评估显示，该设施代号为“734号中央材料科学研究所”，据信在德国入侵时被紧急封存，以防落入敌手。内部空气陈腐，但由于密封性良好，湿度较低，大部分设备与文件得以在数十年的沉寂中幸免于彻底的腐朽。墙上残留的腐朽的布尔什维克宣传品已被记录并视为无价值的历史垃圾。\n经我部随行技术干员的初步盘点，确认以下具备高回收价值的资产：\n\n数台保存状态尚可的“V-2”型固定式柴油发电机。该型号为T-34坦克引擎的变体，其零件可与我军部分现有装甲单位通用或改造使用，能有效补充前沿阵地的电力缺口。\n\n一座基本完好的“克里普托”型电热炉，最高工作温度可达1500°C，对小批量特种合金的冶炼与测试极具价值。同时，在资料库中发现了大量关于钼铬合金钢的铸造工艺笔记与实验数据，对提升我军炮管及装甲板的耐用性有直接的参考意义。\n\n大量的封存化学试剂，经初步鉴定，包含可用于合成新型固体火箭推进剂的稳定剂前体。此外，数卷关于152毫米加农榴弹炮的早期实验型号蓝图被发现，其设计旨在简化生产流程并提升射程，可立即送交军械部进行可行性评估。另有未发表的研究论文，涉及早期“喀秋莎”火箭弹所用燃料的稳定性改良方案。\n\n上百卷详细的技术人员培训手册、设备操作规程与安全条例。这些文件虽已过时，但其系统的科学方法论对我部建立标准化的技术兵种训练体系仍有裨益。\n\n该设施所蕴含的工业与技术潜力，无疑将为大审判的武器库提供宝贵的补充。其价值并非在于其破败的实体，而在于其可被转化为毁灭敌寇的力量。我部建议：\n一.立即派遣工程兵团与运输单位，对所有可用的机械设备进行系统性拆解与转运。\n二.委派科学干部与档案专家，对所有文件与研究笔记进行彻底评估、筛选与现代化转译。\n三.将其余无用结构与被污染的废料，在回收所有可用物资后，予以就地爆破并永久性封存。\n等待您的指令。为大审判。"
OMS_more_flavor.104.a: "把它拆了，一个螺丝钉也不能留下。"
OMS_more_flavor.105.t: "变化"
OMS_more_flavor.105.desc: "“工人维克多，你在干什么！为什么把车刀打坏了？你知不知道，这些工具是联盟最宝贵的财富，你不仅损坏了工具，还耽误了宝贵的生产效率！”\n\n“还有你，克留奇科夫！今天干员们检查宿舍的时候，在你的床下发现了一部分切割钢材剩下的废料？你以为偷窃国家财富的行为不会被我们发现吗？”\n\n整个车组的工人们低着头，默不作声，看着带头的新任工业监督干员安德烈带着狰狞的面容对着他们大吼大叫，只希望他能早点消消气，放他们回去工作。\n\n他们所在的工厂地处秋明，是一座新建的机床厂。当初这座厂落成的时候，联盟上面来了几个大官亲自来到这座工厂剪彩，向他们指示了努力生产、保卫祖国的要求。虽然联盟的命令很严格，但那时候厂里不少都是有经验的老人，为了提高生产，上面的工业干员带头多次组织了工业学习活动，手把手带大家进行技术培训，教他们避免安全隐患等一系列事情。就连厂里的安全监督干员康斯坦丁也是个好人，虽然他要求很高，但对于大家的生活需要，他往往睁一只眼闭一只眼，只要能按时完成任务，他不会多管。\n\n不过两个月前，康斯坦丁干员被调走了，新来了个年轻的干员，叫安德烈的，一切都变了。维克多还记得，那天来了十多个穿黑大衣的，才参观了半天，就在整个工厂的大家面向把其他组的好几个工人拉出来好一顿打，并且警告了他们这种懈怠的修正主义错误。从那以后，工厂的氛围就变了。工友们本就不多的笑容彻底消失了，有些要求严格的老工人屡屡被打小报告，工厂里的大喇嘛播放总司令有关大审判理论的知识越来越多，厂里提交的申请更新设备的报告除非是能够实现快速的效率提升，其他一律会被打回。上个月进行效率评定的时候，工厂的效率提升了三成，但是光他们小组，工伤事故就出现了三起。当那天工业干员们在全厂人面前向维克多所在的小组颁发奖励的时候。他还记得，曾经和睦的工友们向他投来的，却是仇恨的眼光。\n\n"
OMS_more_flavor.105.a: "效率至上，人心不古"
OMS_more_flavor.106.t: "ATOMIC HEART"
OMS_more_flavor.106.desc: "哈萨克斯坦传来一声巨响，416计划成功了。亚佐夫总司令正坐在桌上看着报告。\n\n“...也就是说，我们虽然有了原子弹技术，但您认为我们没有开发出它的最大潜能，对吗？”亚佐夫在看完报告后，正用犀利的目光盯着他面前的人——弗拉基米尔·切洛梅。亚佐夫曾见过无数自荐而来的人，然而在他们之中，或是为了钱财，或是为了活命，又或是两者兼是。\n\n然而，他没有在切洛梅身上看到这些。无论亚佐夫如何敲打切洛梅，他始终以追求高科技为目标，他只是一心一意的进行着研究。“没错，亚佐夫同志。我们现有的原子能技术仅仅服务于原子弹太狭隘了，考虑到电力短缺的问题，我们需要将原子能技术推广到其他领域。不仅如此，我们手上还有一些...国外的机密技术，不是吗？”\n\n亚佐夫听到了“国外的机密技术”之后，好似察觉到了什么一样，瞥着切洛梅，一言不发。在波将金行动开始后，他们就获取到了外国的一些机密数据。这些数据的确可以用来发展黑色联盟的原子能技术和远程投射技术，但他是怎么知道的？他又是为了什么才向我报告的？为什么我对此一无所知？于是他抬起了头。仔细的端详了一下切洛梅。在之前的报告里曾提及过他是“超视社会主义者”，一切服务于科学进步。并且他也在很多领域提出了重要见解，也许他真的只是为了科学的进步？不论如何，他在那份文件上签下了字：“总司令，德米特里·亚佐夫”，并对切洛梅问了一句简单的话：\n\n“你想要什么？”"
OMS_more_flavor.106.a: "“科学的进步和发展，总司令同志。”"
OMS_more_flavor.107.t: "修正‘‘自决’’错误"
OMS_more_flavor.107.desc: "“所有人，听好了！所有的哈萨克文明只不过是那些试图分裂我们伟大统一联盟的谎言，凡是家中藏有违禁品相关的一切......联盟执法人员有权直接射杀！”大街上巡逻的播音车重复播放着各项联盟公民注意事项和行为准则，而在车辆身边的，则是荷弹实枪的联盟士兵。\n\n每听到这些，那些居民们都会下意识的锁好门窗。他们不明白的是，就连几岁的孩子们都学会说大审判这个词了，为什么还要循环播放这段话。但是今天，他们知道了原因。\n\n那辆车突然停止了播放，取而代之的则是一个男人的声音：“我一直相信，你们中间会有人站出来，承认自己的错误，可是你们的表现令我太失望了，既然没有人承认，那就好好的接受来自总司令的愤怒吧！”\n\n一声令下，那些最凶猛的野兽轻而易举的砸烂了门窗，把他们从房子里拖了出来，怒吼声，敲打声，哀嚎声混成一片，紧接着是一阵急促的搜索和报告声，不一会，从一户人家里拿出来了一张哈萨克斯坦的地图，而非黑色联盟的。\n\n“各位，都看到了吧，并非我诬陷你们，而是你们其中还有人无法理解我们，妄图摧毁我们团结伟大的联盟，既然你们不相信这一切，那就让你们亲眼所见。”"
OMS_more_flavor.107.a: "在一声命令后，子弹出膛的声音摧毁了他们内心的声音。"
OMS_more_flavor.108.t: "我们将是祖国的眼"
OMS_more_flavor.108.desc: "致：亚佐夫总司令\n\n发件人：叶夫根尼·萨温采夫\n\n总司令：\n\n目前看来，原先联盟境内的各安全局均无法胜任整合祖国西部的情报安全网，因此，我正式向你提交申请，为即将进行的大审判组建新的情报局——联盟欧洲安全局，职责如下：\n1，坚决拥护黑色联盟领导，听从总司令亚佐夫的命令。\n2，根据工作需要，依法使用必要的方式、手段和渠道，在欧洲西部，团结协定及祖国西部开展情报工作。\n3，该安全局将拥有优先资源与人员分配权，尽可能的为联盟搜集有用的情报价值，包括但不限于铁路枢纽，军工企业，人员名单等。\n4，鉴于该局成立时间最短，面对事务最大，该局在建立后可直接请求祖国内部各个安全局提供协助和支持。\n5，据工作需要，该局工作人员可请求简化边境审查手续。\n6，经过审核和工作需要，工作干员可以使用各种技术侦查措施和身份保密措施。\n7，经联盟和总司令确认后，将与他国境内的个人和组织建立合作关系，进一步开展相关工作。\n......（已被删去）\n\n大审判至高无上。"
OMS_more_flavor.108.a: "在这封申请单的最下面，亚佐夫的名字赫然在上。"
OMS_more_flavor.109.t: "苏联英雄，再度行动"
OMS_more_flavor.109.desc: "自那次起义以后，柳德米拉·帕夫利琴科已经麻木了。\n\n她成功的躲过了乌克兰苏维埃政府倒台后的猎杀，侥幸活到了现在。然而，现在的她不过只是一个空壳。她在战后，只不过是家乡的一个无名农民罢了，没有人知道她曾经的身份，她也不愿意再提起以前的事迹，只想苟全自己的性命，直到死亡。对她来说，曾经的荣耀，战果和辉煌都已远去，她也不是什么“苏联英雄”，而是一位普通的农民。荣耀对她来说有什么用？她曾一腔热血的参加了革命，可即便她如何努力，败局依然不会改变。但她对此也无所谓了，她已经不对祖国的光复抱有什么希望了。\n\n又是平淡的一天。柳德米拉·帕夫利琴科像往常一样劳动，再回到家中。不过这次，半夜有人来敲了门。\n\n“你是谁？”柳德米拉警惕的问道。“我们是政府的人。”柳德米拉去地下室拿着她的莫辛-纳甘步枪，开着门之后用枪指着那个神秘人。“你到底是谁！我从未见过任何一个德国人敢独自来乡下检查！”那个神秘人倒也不遮遮掩掩，“好吧，我是黑色联盟的人，您有没有考虑过和我们合作，开展一些敌后作战活动？”那位神秘人递给了他一份名片，上面赫然写着：\n\n”尼古拉-库兹涅佐夫，黑色联盟。“\n\n柳德米拉看了看，示意他坐下，把门窗关紧，收音机开到最大声之后，端详着这个人。在她印象里，A-A线以东还是一片废土，难以统一。然而，现在在他面前的人，正来自A-A线以东。\n\n“所以，你们要怎么样？”“很简单，你只需要开展一些敌后活动就好了。如果你同意的话，你将会获得‘钻石’的代号，在之后的战争中发挥重要作用...”\n\n柳德米拉的思绪飘会了过去。那时他曾是苏联英雄，是一位传奇狙击手。可现在，她什么也不是。她内心的良心驱使着她做出行动，但旧日的恐惧依然在脑海里萦绕：如果失败了会怎么办？到时候他又该何去何从？他无从得知。但最终，死去已久的苏联英雄，纳粹杀手，柳德米拉·帕夫利琴科，再一次披挂上阵。\n\n"
OMS_more_flavor.109.a: "曾经的苏联英雄，仍然会为了她的祖国而抗争。"
OMS_more_flavor.110.t: "内部会议"
OMS_more_flavor.110.desc: "致：俄罗斯民族复兴政府各部门\n发件人：亚佐夫总司令\n\n各部门：\n祖国统一后，各区域间协调机制存在严重运作缺陷，多地持续爆发小规模武装叛乱，对大审判下一阶段的实施造成恶劣影响。现责成各部门按照如下指示进行协调工作，在规定期限内完成对应工作，渎职者将根据总命令GL-003，以叛国罪罪名依照军法处置。\n一、加快地区经济整合进度。命令国家发展部，务必让当地工业设施重新投入生产，对于重要城市及交通节点修建更多军事设施。此外，根据总命令GL-0034，依照指示在指定城市（见加密附件1）开展防核地下设施的建设。该项工作由叶夫根尼·皮托夫拉诺夫部长全权指挥。\n二、扫除各地武装叛军。命令各军区，严格按时限（见加密附件2）完成辖区武装叛军清剿，必要时经总参谋部批准可建立跨区域作战指挥部。此外，边境军区需同步做好准备工作，确保具备执行总参谋部各项特殊任务能力。该项工作由尤里·德罗兹多夫部长全权指挥。\n三、提高政治审查力度。命令国家行政部，立即提升对原非黑色联盟军官及政治人物的政治审查等级，实施全天候监视以确保绝对忠诚。对经调查确认存在颠覆政权企图或行为者，由此前国家行政部秘密设立的特别法庭进行秘密审判，最大限度控制负面影响。该项工作由叶夫根尼·萨文采夫部长全权指挥。\n······\n大审判终将降临。\n"
OMS_more_flavor.110.a: "（签名）德米特里·亚佐夫"
OMS_more_flavor.111.t: "及其后续"
OMS_more_flavor.111.desc: "...\n  综上，近几个月来，经总司令和政府相关部门，以及俄罗斯各位学者有关讨论，共同得出结论：俄罗斯在原初审判的失败，以及国土的分裂，来自于外国对俄罗斯公民的意识形态和心理破坏，以及纳粹主义，资本主义，无政府主义，布尔什维主义等堕落思想的影响。这些破坏性思想损害了俄罗斯原有的传统思想和价值观，造成了俄罗斯人民在意识形态方面的混乱，导致俄罗斯人在西方纳粹敌人的入侵之中无法团结一致，造成了国土分裂等一系列后果。\n  同时，针对之前工作过程中所出现的众多修正主义思想以及腐败行为，为维护在大审判进行过程中，由总司令和诸位黑色联盟优秀干员所培养形成的宝贵奋斗精神，以及保护俄罗斯原有的传统价值观的需要。复兴政府在此提出，我们必须进行历史性的改革，从今往后，俄罗斯人民必须遵从由亚佐夫总司令所提出，由联盟各委员所修订和完善的俄罗斯复兴主义精神和价值观，具体内容如下\n...\n无论何时何地，俄罗斯人都应遵守从国家到家庭的民族复兴价值观，具体内容包括：\n在国家层面，俄罗斯公民应形成爱国主义和公民意识，每一个俄罗斯人必须明确，他首先是俄罗斯国家的公民，他有义务为祖国服务，对祖国的命运负责，俄罗斯的主权不容任何人侵犯，每位俄罗斯公民都有报效祖国和国家命运的责任\n....\n在社会层面，俄罗斯公民应树立集体主义思想，每位公民应学会在日常生活与工作过程中互帮互助；精神高于物质，俄罗斯的公民应具备公民意识，明确纽带牢固的家庭，家庭中的每位成员都应树立崇高的道德理想，在组织和集体需要的时候，每位俄罗斯公民都应以无私的劳动，为俄罗斯复兴服务\n...\n在个人层面，俄罗斯公民必须学会铭记和传承历史，牢记历史上西方日耳曼野兽对于俄罗斯民族所犯下的种种罪行。对日耳曼人的复仇是俄罗斯公民必须具备的权利与义务，如果遭遇敌寇入侵，每位俄罗斯公民都应以高度的仇恨对入侵者展开杀戮，对于一切修正主义和堕落分子，同理和慈悲都必须被舍弃\n...\n各级组织应在当前的民族复兴事业中发挥任何人都无法代替的组织力和活动力，确保克服当前民族复兴过程中的困难，直至克服并完成工作....以战无不胜的民族复兴精神和价值观实现民族复兴的事业。\n"
OMS_more_flavor.111.a: "俄罗斯将重焕新生。"
OMS_more_flavor.112.t: "责任的尽头"
OMS_more_flavor.112.desc: "“把他们押过来，这些崽种必须在今天都被处死！”\n“放开我，你们这群黑衣服禽兽，竟然往同胞的头上扔化学武器，你们还有点人性吗？”\n米哈伊尔被一脚踹在地上，他的腿断了，被迫跪在地上，却仍试图用愤怒的眼神瞪着这些黑衣士兵。他曾跟随瓦列里.萨布林，试图在远东大地发动革命拯救俄罗斯。可萨布林失败了，他和一众同志被迫流亡在外。他一直试图组织游击队，等待西方的同志们回来重振苏维埃。可等来的不是红军，而是黑色联盟的士兵。\n一声枪响过后，一位同志跌进了这帮黑衣狗子挖的，一个很浅的土坑里。队伍里的年轻同志哇的一声哭了出来，却被领头的那个，叫236650干员的狠狠的打倒在地，然后被堵上了嘴。米哈伊尔转过头去，他看着一群人也被枪押着，走到了他们跟前，从衣服来看，有的穿着光鲜亮丽，像是所谓的民主分子，有的几个被蒙着眼，胳膊上还戴着纳粹的袖章。\n“236650号干员，我已经把要送过来的人都送到这了，接下来该你处置了。”\n“很好，士兵，你干的不错，我会回去向长官申报你的功劳的。”干员笑了笑，然后向身后的行刑队招呼了一声：“该干活了，把这些垃圾通通枪毙！”\n一群人挣扎了起来，试图逃跑，首先迎来的就是黑色联盟士兵的子弹。剩下的人则默不作声，等待着即将到来的命运。米哈伊尔注视着全过程，心中却突然感到了一丝释然，萨布林同志已经尽了他的责任，为革命战斗到了最后。他努力过了，现在他也要死了，他的责任也要到头了。\n236650号干员悄然走到了他的身边：“看你挺有勇气的，并不像个懦夫，我们黑色联盟现在挺缺人的，就缺你这样坚强，还跟纳粹有深仇大恨的勇士，加入我们，放你不死。怎么样？”\n米哈伊尔闭上了眼，说出了最后的遗言。\n"
OMS_more_flavor.112.a: "“我是革命的战士，不是屠夫的战士！”"
OMS_more_flavor.113.t: "看电影"
OMS_more_flavor.113.desc: "晚上六点，车尔尼雪夫斯克的大部分市民们结束了一天的工作，正出来各自找地方休憩。虽然现在他们头上又换了个主人，叫什么亚佐夫司令官的，工作比以前多了，晚上也开始到点戒严，但好在现在国家是统一了，城里的犯罪明显的少了不少，大家也乐得接受。\n\n但大家走着走着，就发现了不对劲：城市中心的大广场上已经被摆上了一块大屏幕，荷枪实弹的士兵们守在屏幕附近，几个黑衣服的人在下面忙来忙去，很多市民们都立足看着他们，很快就挤满了人。\n\n“喂，先生们，你们这是在干什么？”有位胆大的市民大声的问了出来。\n\n“上面下来命令了，这几天咱们要放电影！让你们了解下国家以前发生了什么！”下面的一位干员用喇叭回应了他们，“下面开始播放电影《叛徒没有明天！》”\n\n很快，荧幕上就出现了影像，广场附近也人头攒动，大家都挤着想看放了什么。荧幕上首先展示出来的就是四个大字：原初审判，几个俄罗斯人站在一群德国人旁边，用着他们听不懂的语言在那指指点点；一群坦克从远处冲了过来，将俄罗斯人的队伍冲散；荧幕上的地图展示了俄罗斯的军队在即将到达莫斯科之际，却被无情的推回。\n\n荧幕下的不少俄罗斯民众纷纷闭上了眼睛，不想回味那过去的痛苦，但电影没有暂停。到了下一个主题：苦难大地，接二连三的人物和字幕纷纷闪过：一群说着乱七八糟的德语，穿着破烂德国军服的家伙肆意虐待年青人；一个所谓的沙皇喊着要把俄罗斯的土地还给地主；一群叫什么俄罗斯解放军的，一边跟那群卖国叛徒们联系，一边号称要带给俄罗斯民主；某个叫德拉贡诺夫的家伙，家里全是钱，大谈俄罗斯应该分裂。很多观众们被气的牙根痒痒，纷纷攥紧了拳头。\n\n很快，镜头一转，到了下一个主题“民族复兴”。首先是一位老人以沉稳的语言向俄罗斯人预示了民族大审判的未来，然后就到了亚佐夫司令，很多人还是第一次见到他。在他的指示下，联盟的勇士们打垮了那些民族叛徒，还把他们通通枪毙，他还亲自为战死的士兵们哀悼。很多人不自觉的看入了迷。到了最后，他们看着黑色联盟的装甲兵冲向了东方，勤劳的干员们将隐藏在队伍里的德国奸细抓捕枪毙之时，很多民众由衷的欢呼了起来。\n\n很快，电影结束了。观众们还有些不舍。突然，民众的队伍里一个声音被大喊了出来：“打倒日耳曼恶魔，俄罗斯万岁！”\n\n民众们先是愣了一下，很快，男女老少也都喊了起来，山呼海啸般的声音席卷了整个大广场。\n\n"
OMS_more_flavor.113.a: "“打倒日耳曼恶魔，俄罗斯万岁！”"
OMS_more_flavor.114.t: "“腐臭难闻”"
OMS_more_flavor.114.desc: "尽管自从被联盟强征来进行生化实验的这段日子以来，睡眠是他仅有的安宁时间，但是安纳托里已经连着好几天做噩梦了。梦里要么是在他的实验室里被用来试药的男人的冤魂来找他索命，要么是仅仅因为有1/8德国血统就被直接枪毙的孩童在地狱中撕扯着他的身躯，不过好在，一道紧接在粗暴的开门声后的喊声把他从梦中拉了出来:“安纳托里·弗拉基米罗维奇!新的一批实验体来了!”\n\n这个小个子男人条件反射般的颤抖了一下，随后从已经被汗水浸湿的椅子上站了起来:“长官，上一次实验的数据还没有完全采集完成，这恐怕不太符合规定······”那名少尉不耐烦地解释道:“这是上面最新下发的紧急命令，现在顾不上那么多规定了。”然后，他话锋一转:“完不成的后果你应该清楚吧？”安纳托里不敢违逆，当即陪笑道:“明白，长官，保证完成任务。”\n\n穿着黑靴子的恶魔走后，他只好继续坐在实验台前观察着那些杀人的小东西，当用作实验的活体细胞裂解时，他的脑海里闪过了一个记忆碎片:那是一名不知为何被押送至刑场的老人，他的头颅被一把霰弹枪打的稀碎，头骨残渣溅的满地都是。\n\n······\n\n将又一段令他不想回想的，令人作呕的记忆抛之脑后，安纳托里强忍着不适撰写着实验报告。这一次的病毒研制似乎很成功，传染性远远超出他的预期，潜伏性也相当好。然而，很快，原本被压制住的恐惧和恶心在他注意到了隔离房角落里一块脱落的、已经腐烂的血肉以后肆意疯长，整个身躯长满了脓包的女人的身影再次浮现在他眼前，“哇——”的一声，他终于忍不住吐了出来。"
OMS_more_flavor.114.a: "晚上，他又做了一次噩梦。"
OMS_more_flavor.115.t: "一支小队的工作"
OMS_more_flavor.115.desc: "“这里是109号小队，我们已经到达目标工厂，是的，接下来我们的目标是拆卸目标工厂的两座生产机床，工厂内的城市干员将会配合我们进行工作。”一位头戴面罩的联盟军官毫无感情的对着身后的行动小队下达了命令，没人看得清他面罩下的表情。\n“抵抗将被视为叛国”士兵们毫无感情的回答道。\n小队迈步进入工厂，正在干活的各位工人们看着这群行凶神恶煞的士兵，纷纷停下了手上的工作，工厂主和两位城市干员快步走出办公室，敬了个礼，接过队长送来的公文，只看了一眼，他的眉头便皱了起来。\n“先生，这两座机床是我们厂工作效率最高的，如果拆掉，我们的厂的效率势必下降过多，为城里提供的被褥会···”\n“抵抗将被视为叛国”。队长冷冰冰的回答到。\n工厂主看了一眼队长，不情愿的低下头，在拆除名单上签了名，让两位干员带着小队去拆除地点。工厂里的工人们跟着小队走到了那两座机床旁边。“现在，把这玩意拆了，运到外面的卡车上”。队长声明到。\n“不，不行！”一位老工人厉声喊着，扑到机床旁边。“兄弟们，这玩意是我们厂的传家宝，整个城市的被褥都是从这玩意生产出来的，把这东西拆了，大家的孩···”\n“砰”\n他的话还没说完，队长的手枪便开了火，老工人无力的倒在地上，他的血溅在机床上。队长摆了摆手，让两位士兵把尸体拖到一边，最后重复了一遍：“抵抗将被视为叛国”。\n几分钟后，军车的引擎轰隆隆的作响，直奔远方而去。工人们互相看了一眼，又麻木的回到岗位上，默默的念叨着那句无上的铁律。\n"
OMS_more_flavor.115.a: "“抵抗将被视为叛国”。"
OMS_more_flavor.116.t: "世界末日的伴舞者"
OMS_more_flavor.116.desc: "尼娜的客厅里，电视机是唯一的光源。荧屏上，一个穿着传统服饰的女孩正笨拙地跳着“天鹅湖”，笑容僵硬得像面具。这是联盟批准的少数几个娱乐节目之一，旨在提醒人们“俄罗斯的纯粹传统”。但尼娜知道，这笑容背后，空无一物。\n\n突然，画面被切断。雪花点在屏幕上狂乱地跳跃，发出一阵刺耳的、令人不安的嘶鸣。紧接着，一张面孔占据了整个屏幕——那是一张没有表情的脸，属于某个她从未见过的联盟官员。他的眼睛像两颗黑色的玻璃珠，凝视着客厅的深处，仿佛能穿透屏幕，看穿尼娜的灵魂。\n\n“公民们，”那声音冰冷而单调，不带任何情感，“从即刻起，所有电视广播内容将进行‘净化’。任何非俄罗斯的、腐朽的、失败主义的影像都将被彻底抹除。”\n\n荧屏上开始闪现一连串令人不安的画面。一个被枪决的男人，他因私藏一本条顿野蛮人的小说而被定为“文化叛徒”。一座堆满书籍与画卷的焚烧坑，火焰吞噬着那些“反动”的思想。一群孩子，面无表情地对着镜头，机械地背诵着仇恨日耳曼人的口号。\n\n“娱乐是毒药，除非它服务于大审判!。”官员的声音继续着，像一把冰冷的解剖刀，剖开尼娜最后的幻想。“我们将用纯粹的俄罗斯意志填满每一个像素。你们的眼睛，只能看到联盟希望你们看到的东西。你们的思想，只能容纳联盟灌输给你们的思想。”\n\n节目恢复了。那个女孩又开始跳舞，但她的笑容在尼娜看来，已经变成了一副狰狞的鬼脸。电视机不再是娱乐的窗口，而是一只从墙壁里长出的、永远睁着的、属于联盟的眼睛。它在监视，在审判，在改造。\n\n尼娜感到一阵彻骨的寒意。她想关掉电视，但她的手却僵在半空。她怕，如果她伸出手，那只荧屏之眼会注意到她，会看穿她内心的恐惧与厌恶。于是她只能僵硬地坐着，任由那冰冷的光芒将她的客厅，将她的世界，染成一片深黑。\n\n"
OMS_more_flavor.116.a: "用三级跳的节拍尽情的跳舞吧，直到世界末日来临。"
OMS_more_flavor.117.t: "山腹中的回响"
OMS_more_flavor.117.desc: "风在乌拉尔山脉的隘口间呼啸，像亡魂在哭嚎。瓦季姆用冻得发紫的手指，将又一根冰冷的钢筋固定在混凝土墙上。他的呼吸在稀薄的空气中凝成白雾，很快又被风吹散。在这里，他感觉自己渺小得像一颗沙砾。\n\n脚下，是深不见底的坑洞，一个正在山体内部被贪婪地掏空、准备吞噬数百万俄罗斯灵魂的巨穴。头顶，是沉重、灰暗的天空，仿佛随时会降下日耳曼人的核火。\n\n“快点，你这懒骨头！”监工的鞭子抽在他身旁的岩石上，迸出几点火星。“总司令可没时间等你们磨蹭！每一秒的延误，都可能让一千个俄罗斯家庭在核冬天里化为焦炭！”\n\n瓦季姆没有作声，只是加快了手中的动作。他曾是一名桥梁工程师，梦想着建造连接城市、沟通人心的宏伟建筑。而现在，他却在建造一座巨大的坟墓。一座为了让一部分人活下去，而将另一部分人永远埋葬的坟墓。\n\n他抬起头，望向远方。数以万计的身影在山间蠕动，像一群被无形之手驱赶的蚂蚁。他们是囚犯、异见者，以及那些“不够忠诚”的平民。他们的血肉，正被用来浇筑这座“国家战略工事”的基石。每天，都有人从脚手架上失足坠落，他们的惨叫声被风与机械的轰鸣声瞬间吞没，连一丝回响都留不下来。\n\n联盟的宣传广播里，将这里描绘成俄罗斯最后的希望，是抵御末日的“诺亚方舟”。但瓦季姆知道，什么狗屁“大审判”，不过是一群自我感动的老将军们发起的堂吉诃德般的冲锋，这个地堡也只是确保“大审判”之后能让残存的人们再次审判那群德国人而已。\n\n夜幕降临时，他拖着疲惫不堪的身体回到简陋的营房。他躺在冰冷的铺位上，闭上眼睛，却无法入睡。山腹深处传来的爆破声，一下又一下，如同巨兽的心跳，震动着他的骨骸，也震动着他那颗早已麻木的心。\n\n他想起了自己的妻儿。他们是否拿到了进入这座堡垒的资格？还是说，他们也将成为被抛弃在核焰风暴中的尘埃？这个念头，比乌拉尔的寒风更加刺骨。\n\n"
OMS_more_flavor.117.a: "但他别无选择，只得机械般的劳动。"
OMS_more_flavor.118.t: "钢铁的脉搏"
OMS_more_flavor.118.desc: "尼基塔·沃罗诺夫用沾满油污的手指，轻轻抚摸着他父亲留下的那台老旧车床。这台机器，曾是他家族三代人的骄傲，是沃罗诺夫机械厂的心脏。它曾生产过犁头、拖拉机零件，甚至在第一次西俄战争时期，还偷偷为抵抗组织打造过枪管。它见证了沃罗诺夫家族的兴衰，是他们卑微却坚韧的生存证明。\n\n今天，这颗心脏即将停止跳动。\n\n工厂的大门被粗暴地撞开，两名联盟官员走了进来，他们的黑色制服像两块移动的阴影，瞬间吸走了车间里所有的光。领头的那个，脸上带着一种官僚式的冷漠，他展开一份文件，用不带任何感情的语调宣读着。\n\n“奉总司令部第734号令，为确保大审判的绝对胜利，沃罗诺夫机械厂即刻起收归国有。所有资产、设备及人员，将统一纳入第12号军工生产联合体。”\n\n尼基塔感觉自己的血液都凝固了。他想抗议，想嘶吼，想问问他们凭什么夺走他的一切。但当他看到官员身后那两名士兵手中紧握的步枪时，所有的话语都堵在了喉咙里，变成了一阵无声的颤抖。\n\n“你们不能······”他最终只挤出了这几个字，声音微弱得像临终的叹息。\n\n“‘不能’？”官员轻蔑地笑了一声，那笑声像金属刮擦般刺耳。“公民，你口中的‘不能’，是对我们伟大事业的背叛。私人利益是毒瘤，效率低下是通敌。你的工厂，要么为俄罗斯吐出炮弹，要么和你一起，化为历史的尘埃。”\n\n他挥了挥手，几名工人被士兵用枪托推搡着，开始在车床上贴上新的编号标签。那冰冷的白色标签，像一块块墓碑，宣告着沃罗诺夫机械厂的死亡。\n\n官员走到尼基塔面前，将一份新的生产计划拍在他胸口。“从明天起，这里只生产一样东西——7.62毫米口径的子弹壳。你的新配额是每天五万发。完不成，后果自负。”\n\n官员转身离去，留下尼基塔独自站在他那被“征用”的工厂里。他看着那台冰冷的车床，看着墙上父亲那张褪色的照片，看着窗外那片被工业浓烟染成灰黑色的天空。他突然意识到，他，以及他所珍视的一切，都不过是那台名为“黑色联盟”的巨大战争机器里，一个可以随时被替换、被碾碎的齿轮。\n\n整个俄罗斯，都变成了一座巨大的兵工厂，而他们所有人，都是这座工厂里没有名字的囚徒。\n\n"
OMS_more_flavor.118.a: "祖国的每一个齿轮，都必须为复仇而转动。"
OMS_more_flavor.119.t: "最后的色彩"
OMS_more_flavor.119.desc: "伊琳娜的指尖轻轻划过那件丝绸连衣裙，冰凉柔滑的触感让她短暂忘记了窗外铅灰色的天空和空气中弥漫的煤灰味。这是她结婚时的礼服，是她枯燥生活中仅存的一点亮色，一个关于旧日温情的、危险的秘密。\n\n敲门声像战锤般砸响，粗暴、不容置疑。伊琳娜的心脏猛地一缩，她慌忙将连衣裙塞进床底最深处，用一堆灰色的、制式化的粗布工装盖住。\n\n门被推开了，甚至不等她应声。两名身着黑色制服的“经济净化委员”走了进来，他们的眼神像探照灯一样扫视着这间简陋的公寓。\n\n“公民伊琳娜·彼得罗夫娜，”其中一人面无表情地说道，他的声音像生锈的铁片在摩擦，“根据总司令部‘剔除冗余’法令，我们将对你的住所进行检查，清除一切非必要的、奢侈的、腐化俄罗斯战斗意志的物品。”\n\n他们开始动手了。一只雕花的木制首饰盒被扔在地上，摔得粉碎，里面几件廉价的玻璃饰品滚落一地，被军靴无情地踩碎。一本封面褪色的童话书被撕成两半，彩色的插图在空中飘落，像一只只被折断翅膀的蝴蝶。墙上一幅小小的风景画被摘下，画框在墙角被砸烂。\n\n伊琳娜僵在原地，浑身冰冷。她看着自己的小屋被一点点剥皮剔骨，所有有用的东西都被定义为“冗余”，然后被粗暴地没收。她的家，正在变成一个和外面世界一样单调、灰暗的囚笼。\n\n一名委员的目光停留在床下。他弯下腰，伸手一探，猛地拽出了那件丝绸连衣裙。\n\n“这是什么？”他举起那件衣服，语气中带着一丝残忍的讥讽。“丝绸？在§R大审判§!的前夜，还有人需要这种东西吗？这是在削弱我们的民族，是在资助我们的敌人！”\n\n“不！求求你！”伊琳娜冲上前去，试图抢回那件衣服，但另一名委员用枪托将她狠狠地推倒在地。\n\n那位委员将丝绸和其他“冗余物品”没收之后，对着伊琳娜看了一眼：\n\n“净化完成。”委员转身离去。“记住，公民。在新的俄罗斯，唯一被允许的奢侈品，就是对敌人的仇恨。”\n\n门关上了。房间里只剩下伊琳娜。空气中，最后的一抹色彩也已消散，只留下了一具活死人。\n\n"
OMS_more_flavor.119.a: "此乃可怖至极的活死人之墓，其最恶之处在于，活在这里与死了毫无差别。"
OMS_more_flavor.120.t: "空荡的摇篮"
OMS_more_flavor.120.desc: "征兵官的军靴踏在泥泞的土路上，溅起的泥点玷污了他擦得锃亮的皮面。他对此毫不在意。伊万·扎哈罗夫中尉的心思，早已被眼前这座村庄的死寂所占据。\n\n这里曾有炊烟，曾有孩童的嬉闹，曾有醉汉在酒馆外的争吵。而现在，只有风穿过空屋的呜咽，像一个母亲在为她死去的孩子哭泣。\n\n他挨家挨户地敲门。门后，是一张张麻木、枯槁的脸。女人们的脸上没有泪水，因为泪水早已流干。老人们的眼中没有光芒，因为希望早已熄灭。\n\n“奉总司令部第901号紧急动员令，”伊万的声音在空旷的房间里回荡，显得异常洪亮，“所有年龄在十六至六十岁之间的健全男性公民，必须立即前往村广场集合，应征入伍，保卫祖国免受日耳曼蛮族的侵袭。”\n\n他的话语像石头投入死水，没有激起一丝涟漪。女人们只是沉默地看着他，眼神空洞。她们的丈夫、她们的兄弟、她们的儿子，早已在之前的征召中被带走，消失在乌拉尔山以西的某个地方，再无音讯。\n\n“你们的儿子，已经是一个荣耀的士兵了，公民同志。”伊万对着一个抱着空摇篮的老妇人说道，他试图让自己的声音听起来充满力量与自豪，但他自己都听出了其中的虚假。\n\n老妇人缓缓抬起头，浑浊的眼睛里第一次有了焦点。她没有说话，只是用那双布满皱纹的手，将空荡荡的摇篮抱得更紧了些。那动作里蕴含的绝望与控诉，比任何嘶吼都更加震耳欲聋。\n\n在另一间屋子里，一个尚未成年的男孩，骨瘦如柴，被他的母亲从床底下拖了出来。男孩的脸上满是恐惧，他的身体在颤抖。\n\n“他还是个孩子！”母亲哀求着，声音嘶哑。“他连枪都拿不稳！”\n\n“在大审判的熔炉里，他会学会的。”伊万面无表情地回答，他身后的士兵将男孩从母亲的怀抱中扯开，像拖拽一袋粮食一样将他拖出了门。\n\n当伊万·扎哈罗夫中尉离开这座村庄时，身后跟了一支由老人和孩子组成的、歪歪扭扭的队列。他们将成为新的“预备役士兵”，去填补军员的缺口。伊万回头望了一眼这座只剩下女人的村庄，一阵突如其来的恶心感涌上喉头。他强迫自己不去想，当这些最后的“男儿们”也消失之后，这些空荡的摇篮，又将由谁来填满。\n\n"
OMS_more_flavor.120.a: "俄罗斯的每一寸土地，都将成为我们的兵营。"
OMS_more_flavor.121.t: "“模范女性”"
OMS_more_flavor.121.desc: "宣传车刺耳的喇叭声撕裂了清晨的宁静，将玛丽娜从浅眠中惊醒。她躺在冰冷的床上，听着那金属质感的声音在空荡荡的街道上回响，一遍又一遍地重复着同样的内容。\n\n“······光荣属于俄罗斯母亲！响应联盟的号召，为祖国繁衍下一代！每一位生育三个及以上子女的英雄母亲，都将获得‘祖国摇篮’勋章、双倍口粮配给，以及无上的荣耀！”\n\n玛丽娜用粗糙的毯子蒙住头，但这声音却像针一样，刺穿了布料，刺穿了她的耳膜，直抵她那颗早已疲惫不堪的心。\n\n她的丈夫，阿列克谢，一年前被征召入伍，从此杳无音信。她的两个哥哥，也在更早的“净化行动”中消失了。如今，这间曾经充满欢声笑语的屋子里，只剩下她和她年迈的、终日以泪洗面的母亲。\n\n门被敲响了。是联盟的“生育促进委员”，一个脸上带着虚假热忱的年轻女人。她手里捧着一个红色的丝绒盒子。\n\n“玛丽娜·伊万诺娃，”委员用一种近乎咏叹的语调说道，“根据最新的健康与基因潜力评估，您被光荣地选为第一批‘民族复兴储备母亲’。这是您的荣耀，也是您对§R大审判§!最神圣的贡献。”\n\n玛丽娜茫然地看着她，不明白这些词语的含义。\n\n委员打开了盒子，里面是一枚冰冷的铜质勋章，上面刻着一个怀抱婴儿的女人形象。女人的面容模糊，看不出悲喜。\n\n“您将在下周被转移至指定的‘繁育中心’，”委员继续说道，语气中带着不容置疑的权威，“在那里，您将与联盟最优秀的、经过严格筛选的战士结合，为俄罗斯的未来诞下健康的子嗣。您的孩子，将成为新一代的复仇者。而您，将成为我们民族的英雄。”\n\n玛丽娜的身体开始不受控制地颤抖。她想起了阿列克谢，想起了他临走前温柔的拥抱，想起了他们曾梦想过的，属于他们自己的孩子。而现在，她的子宫，她的身体，成了联盟的财产，成了制造未来炮灰的工厂。她不再是一个妻子，一个女人，而是一个被编号的、有“天然生育能力”的容器。\n\n“这是······这是我的义务吗？”她用几不可闻的声音问道。\n\n“不，女士。”生育促进委员的脸上绽开一个灿烂而空洞的笑容，她将那枚冰冷的勋章别在玛丽娜胸前，像在为一头献祭的牲畜打上烙印。\n\n"
OMS_more_flavor.121.a: "“这是你的救赎。”"
OMS_more_flavor.122.t: "女武神的伤痕"
OMS_more_flavor.122.desc: "卡佳的肩膀比村里大多数男人都宽。她的双手布满老茧，那是常年挥舞斧头和修理农具留下的印记。村里的老人们总在她背后窃窃私语，说她是个“长错身体的男人”，说没有哪个正派男人会娶一个能徒手制服公牛的女人。\n\n她曾对此感到羞耻，将自己隐藏在沉默和劳作之中。\n\n直到黑色联盟的征兵官来到这座村庄。\n\n他们带走了所有“健全”的男人，留下了一片死寂和绝望。但第二天，征兵官又回来了。这次，他直接走到了卡佳面前。\n\n“你，叫什么名字？”征兵官的眼神像在评估一匹战马，锐利而直接。\n\n“卡佳。”她低声回答，习惯性地想缩起肩膀。\n\n“抬起头来，士兵！”征-兵官的吼声让她浑身一震。她抬起头，第一次直视那双不带任何轻视的眼睛。\n\n“他们说你不适合结婚生子，”征兵官扫视着她结实的臂膀，嘴角竟露出一丝赞许，“他们说你是‘男性化’的废物。他们错了。他们是瞎子，是懦夫。”\n\n他顿了顿，声音变得低沉而充满诱惑力。“你的力量，不该浪费在劈柴和喂猪上。你的愤怒，不该消耗在邻居的闲言碎语里。俄罗斯不需要更多只会哭泣的母亲，俄罗斯需要能让条顿人哭泣的战士！”\n\n他将一杆沉重的AK74步枪塞进卡佳手中。那冰冷的钢铁触感，比她接触过的任何东西都更加真实，更加有力。\n\n“那些嘲笑你的人，如今正在后方苟且偷生。而你，”征兵官指着西方的地平线，那里被原初审判的阴云染成了暗红色，“将有机会去赢得他们永远无法企及的荣耀。你将用敌人的鲜血，洗刷你身上所有的污名。你将不再是卡佳，你将是俄罗斯的女儿，是复仇的女武神。”\n\n卡佳握紧了手中的步枪。她看着自己粗糙的双手，第一次，她没有感到羞耻，而是感到了一股前所未有的力量。那些经年累月的伤痕和老茧，不再是丑陋的印记，而是她即将到来的新使命的勋章。\n\n当她跟随征兵官离开村庄时，她没有回头。她听到了身后那些老人们惊愕的倒吸气声，但那声音已经无法再伤害她。她的前方，是战火、硝烟，和用敌人的头颅铺就的、通往“荣耀”的血路。\n\n"
OMS_more_flavor.122.a: "让她们的怒火，烧尽日耳曼尼亚。"
OMS_more_flavor.123.t: "边境琐事"
OMS_more_flavor.123.desc: "“老实说，我大审判的信心还是不足。那帮德国人用着比我们还强大的武器......以上这句话，你是否向编号1024561士兵说过，编号0600241士兵.“在前线审讯室中，黑色联盟的审讯专家将一本日记本扔了出来，上面尽是一些想要活下去的言论，对大审判确定是悲观的态度。\n\n他显然被吓到了，很快便想要挽救回什么，”我...我这是喝了点酒之后写下来的，这并不是我原本的意愿，我愿意为了大审判付出一切，哪怕是我的生命。“说完这话，他的额头已经布满汗珠。审讯专家推了推眼镜，转而去询问了另一个人，没有给他答复。\n\n”我，我觉得这是个错误，长官，你觉得我们其中有多少人可以......“他的话还没说完，便被一脚踢倒在地，”废话！你甚至连尝试都不敢尝试，那你还参加什么军队！俄罗斯母亲有你这样对大审判事业不忠的人，真的是一种可悲。“\n\n说罢，他把腰间的手枪拿了出来，听着保险放开的声音，两人的心提到了嗓子眼，他们缓缓闭上了双眼，等待着专家给自己下达最后审判结果——是将手枪放回盒子的声音，紧接着是专家亲自宣读的结果。\n"
OMS_more_flavor.123.a: "“剥夺你们两人黑色联盟士兵的身份，转入惩戒营之中。”"
OMS_more_flavor.124.t: "全民战争，其一"
OMS_more_flavor.124.desc: ""从今天开始，我将作为你们的军事教官，教你们这群...普通人如何使用武器，如何制作爆炸物，如何在西方条顿入侵者到来的时候尽可能的伪装起来，在他们毫无防备的时候突然袭击他们，杀死他们！"\n\n列昂尼德拿着一根军棍，从一群老弱妇孺面前走过。作为通过了黑色联盟考验的战士，他一开始对于这种下去教一群弱者战斗的行为是不屑一顾的，一群弱者能干成什么事。但很快，高层就发下来了几本关于所谓“人民战争”的小册子，上面不仅有他要训练的内容，还有不少纳粹猪狗们对于俄罗斯人民所犯下的罪行。列昂尼德只是看了几眼，就砍断了自己心中所产生的修正主义萌芽，对于纳粹垃圾，就得想尽办法让他们去死。\n\n“先生，我们为什么要去打仗呢？你们难道不应该保护我们吗？”一位老妇人向他问道。\n\n“想得美！”列昂尼德高声喊道，“你们不知道，那些西方条顿人从不以你们是妇女，孩子就有什么仁慈。相反，他们对我们任何人都恨之入骨，他们会想尽办法的杀光他们看到的每一个俄罗斯人，不管你是谁，你们只想要我们来保护，那却不想自己为祖国做点什么吗！”\n\n"
OMS_more_flavor.124.a: "“为了祖国，每一个人都应该学会牺牲”"
OMS_more_flavor.125.t: "全面战争，其二"
OMS_more_flavor.125.desc: "“我知道！我爸爸和爷爷就是为了抵抗那些条顿人，为祖国牺牲了！”一个孩子回应到。\n“你说的对，小尼古拉。”列昂尼德笑了起来，“正因如此，为了保卫我们的家园，你们得学会怎么对付那群纳粹入侵者。小尼古拉。”他亲自掏出一把小手枪，放到了尼古拉的手上。“从今天开始，你就是本村童子军的班长了！”\n“是，长官！”小尼古拉有样学样，向他敬了个礼。\n“你们所要学习的，很简单，就是学会打枪和伪装。”列昂尼德向孩子们指示到，“如果以后遇到敌人入侵，你们所要做的，就是让他们看不出来你们要干什么，躲在村子里能躲藏的地方，一旦找到机会，就用我们发给你们的武器，狠狠的打这些该死的入侵者！”\n“至于你们。”列昂尼德看着一群妇女和老人，叹了口气，“像你们这样羸弱的家伙，上面倒也没指望你们能有什么战斗能力，但好在，我们有些东西你们还是能学会的。”他把一个框子拎了上来，“虽然你们没法打枪，但你们可以用炸弹！从今天开始，你们要学会投掷！等到回家之后，你们也必须从头开始学习如何制备简易的燃烧弹一旦敌人入侵，你们的爆炸物就要能砸到他们的头上！”\n“下面，开始训练！谁要是满足不了今天的训练指标，谁今天就没饭吃！”\n...\n一天就这么过去了，列昂尼德挥挥手，让所有人解散回家。回想今天一上午的训练成果，一群身体瘦弱，连双手持枪都极为困难的小孩子，一群哪怕拼尽全力，都没法把炸弹扔出五步的老人，也就那些妇女们在制作日丹诺夫鸡尾酒的时候还算合理，但就下午的训练中，一个姑娘就差点把鸡尾酒丢到自己脚下，好在列昂尼德一把把她推开，这些乌合之众当时就被吓的鸡飞狗跳，连跑都不会了。\n他叹了口气，躺在床上，思索起明天的教学内容，他想着想着，一个疑问不自觉的萦绕在他的心中。\n"
OMS_more_flavor.125.a: "这样真的是人民战争吗？"
OMS_more_flavor.126.t: "迷途知返，其一"
OMS_more_flavor.126.desc: "“都给我把东西扔了，跑起来！空袭已经开始了！谁要是跑的慢了没能到达防空洞，谁就等着吃鞭子吧！”\n\n吉姆.奥列格拿着扩音喇叭对着涌动的人群大喊着。他是一位出生在美国的俄罗斯人，祖上曾是沙俄时期的士官，在十月革命之后，他的祖辈先是参与白军，后又来到了美国，成为了一名美国公民。他的父亲，一个社区里的“糊涂蛋”，自从知道德国入侵俄罗斯之后，就喊着什么要“保卫祖国”，回到了俄罗斯大地，然后就再也没听见他的动向。奥列格一直在美国关注着俄罗斯的动静，希望知道父亲的下落，却从无收获，学校的老师告诉他，俄罗斯已经几十年处于无政府地带了。奥列格迫切的想知道俄罗斯发生了什么，但却没有信息来源。\n\n但很快，他们的社区就来了一群同样是俄罗斯人的移民，领头的鲍里斯先生简直无所不知无所不晓，他告诉了奥列格俄罗斯处于分裂状态的原因：一群民族叛徒和布尔什维克分子为虎作伥，为了所谓的主义想尽办法破坏俄罗斯人民内部的团结，甚至不惜把同胞出卖给德国人，而其他移民朋友们也从不同方面印证了鲍里斯先生的话，有的人来自布尔什维克的管辖区，只因不想与同胞作战就被追杀，有些人来自所谓的民主政府，那里的人不惜出卖国家给德国人换取平安。有的人更是九死一生，从所谓的无政府主义者，实际上就是土匪窝里逃到美国来...\n\n在他们共同的故事中，都不约而同提到了一个人：如今俄罗斯民族复兴政府的总司令，亚佐夫。他们都惊叹这位司令的强大力量，哀叹自己为什么没有生活在复兴政府的土地上。奥列格从此对于这位亚佐夫司令官有了更多的好奇，他希望他们能给他更多亚佐夫的消息。这些朋友们也通过各种方式帮助到了他：亚佐夫的演讲，统一俄罗斯的现状，保卫国家的强军。种种消息让奥列格为之神往。终于，他作出了决定。\n\n"
OMS_more_flavor.126.a: "我要离开美国，回到自己的故乡。"
OMS_more_flavor.127.t: "迷途知返，其二"
OMS_more_flavor.127.desc: "当他离开俄罗斯社区的时候，每个曾经的好友都为他热情送别，并且给他筹了一大笔款项，希望他能够到达俄罗斯后，把这笔钱投到俄罗斯的建设事业中去，奥列格接受了每一位好友的祝福，带着行李箱登上了远洋航船。\n\n贫穷，但是仍在恢复生机，这是奥列格在走下马加丹港口的第一印象。虽然他的朋友们告诉了他如今的俄罗斯很穷，很落后，但程度仍然超出了奥列格的想象：很多平民顶着单薄的衣服，却仍然要努力来迎接他们这群万里之外的客人，奥列格试图劝他们去休息，但他们告诉他，现在的俄罗斯需要的是更多的建设，在祖国的西部，西方的纳粹每日都在试图侵犯俄罗斯的土地，剥夺俄罗斯人来之不易的自由，他们不能为了一己私欲就让祖国在此沦丧。\n\n多么顽强而又伟大的民族啊。奥列格在自己的日记里写道。\n\n很快，他坐上了火车，通过了中西伯利亚，来到了美国驻俄大使馆，所过之处，他见证了无数奇迹：被德国纳粹所毁灭的俄罗斯工业以奇迹般的速度被恢复起来，俄罗斯人虽然工作繁重，却总能吃上足够的食物，甚至没有他在美国常见的种族歧视！一切的一切让奥列格终于忍耐不住，他找到了当地政府，希望重新加入俄罗斯国籍，加入到政府之中。美国大使苦头婆心的劝了他几次，但还是没劝动他。\n\n很快，他的申请就被通过了，他被分到了车里雅宾斯克作为行政干员，在复兴政府的官员讲述中，为了提高行政效率，他们实行干员制，通过指派任务提高行政效率，奥列格参与了几天工作，他由衷的感觉到了这种制度的可靠性：俄罗斯人每日都在纳粹的阴影中惶惶不可终日，正是有了强大的总司令保护，每个俄罗斯人才能安心入眠，高效的干员制度还能减少不必要的内耗。\n\n每个前辈都很照顾他，在他工作几个月后，他终于接到了第一项正式任务：组织防空演习疏散。他来到了指定社区，这里看起来很贫瘠，但奥列格知道，这是一种应对纳粹空袭的伪装，俄罗斯人坚强的在这些建筑下生存着躲避，而自己要做的，就是引导他们听从总司令民族复兴的命令，让他们能够在未来的决战中更好的活下来。"
OMS_more_flavor.127.a: "民族复兴需要每一位公民的努力。"
OMS_more_flavor.128.t: "我是谁？"
OMS_more_flavor.128.desc: "3月13日，毕业日\n元首万岁！大日耳曼尼亚万岁！莫斯科万岁！\n我叫彼得科夫，出生在莫斯科，在我上学的时候，我的父母就告诉我，我们是莫斯科专员辖区的二等公民，德国人来到这片土地上，是为了帮助我们去除我们斯拉夫民族身上的堕落基因。\n在元首的教诲下，我明白了，我们要像雅利安人一样具备天性上的强大，为了像雅利安人一样强大，我要先给自己改个名字，就叫施密特吧。\n...\n9月16日，夜\n元首万岁！大日耳曼尼亚万岁！莫斯科万岁！\n今天我在莫斯科的一家知名沙龙里见到了很多青年才俊，他们告诉我，像我这样的人是没有资格改名的，我只能继续叫彼得科夫，一位名叫谢瓦尔德纳泽的先生还狠狠的斥责了我的自大和无知。可我不懂，凭什么他这样的高加索人有资格被叫做弗朗茨，我这样的莫斯科人却没有资格叫施密特呢？\n...\n12月25日，圣诞节\n元首万岁！莫斯科万岁！\n今天是晋升日，但我很不开心，在学校成绩评比中，我是第一，但到晋升日之前，我的校长威廉，一位荣誉雅利安人找到了我，告诉我，因为我的斯拉夫血统，我永远不能胜过来自大日耳曼尼亚的德国移民，我们斯拉夫人天生劣等于雅利安人，所以我的名次作废。可元首不是教育我们，强者不需要得到其他人认可吗？\n...\n4月6日，夜\n元首万岁！\n今天是我的蒙羞日，我加入了莫斯科防卫军，去给那些来自日耳曼尼亚的德国垦殖团服从，这两个月，我所负责的工作就是把莫斯科人赶出他们的家，让日耳曼人心满意足。那个老妇人哪怕死前，都抱在土地上不放，她真的该被那样处死吗？\n...\n8月15日\n这是最后一次日记，从今往后，我会换一本日记。自从我从某个奴隶的家里搜出某些有关民族复兴的抄本后，那些家伙就隔三岔五搜查我的家，说我包庇叛乱分子？现在看来那些所谓的雅利安人和莫斯科叛徒只不过是色厉内荏的家伙，他们靠暴力维持所谓优越的谎言，但其实我的成功是因为我是俄罗斯人，德国人千方百计骗我给他们当奴隶，他们要付出代价。\n"
OMS_more_flavor.128.a: "他阴沉着脸，把日记丢进了火里"
OMS_more_flavor.129.t: "与慕克夫公司的合作报告"
OMS_more_flavor.129.desc: "绝密，仅供总司令翻阅\n致总司令：\n今日，我在美使馆接到了一封来自美国慕克夫公司的来信，对方称对我方大审判事业颇感兴趣，愿与我方达成合作。据悉，慕克夫公司在表面上是一个高科技公司，在背后却是一家专注于精神控制、生化武器、人体实验等领域的灰色跨国公司，其吸纳大量曾参与过回形针计划、费城计划、MK-ULTRA计划的本国、德国、满洲的科学家，在这一领域取得了相当惊人的成果。\n我方与其进行了简单磋商，就以下问题达成了共识：\n1.慕克夫公司承诺援助我方生化武器库建设，并提供最新研究成果用于大审判。\n2.慕克夫公司希望将研究转移至我国境内，要求我国政府提供资金与场地支持。\n我方评估认为此次合作于大审判事业而言百利而无一害，进一步行动的指示静待您的意见。\n驻美使馆\n"
OMS_more_flavor.129.a: "批准，德米特里·亚佐夫。"
OMS_more_flavor.130.t: "一拖再拖"
OMS_more_flavor.130.desc: "“瓦莉娅女士，鄙人来到俄罗斯已经有十个月了，这几个月里，你们俄罗斯复兴政府在有关加入共荣圈市场的问题上，表现得实在是过于拖沓了。帝国对俄罗斯一直保持着足够的善意，鼓励并且支持满洲和蒙古政府与你们开展商贸活动，并且向你们移交了一部分囚犯，而你们这几个月的效率却越来越差，如果再这样下去，帝国将不得不重新考虑俄罗斯相关的经济交往事宜。”\n\n谈判桌对面的俄罗斯方代表瓦莉娅摊了摊手：“近藤勋先生，我方必须重申，在统一之前就与大日本帝国政府有过众多的沟通，双方均有深化友谊，增强交流的意愿。但眼下我方已经成为俄罗斯正统政府，国内大量的地方仍需要建设，而且我国西部的大日耳曼尼亚政府在边境地带频频进行军事行动，我国目前主要精力扔集中于国内镇压叛乱和军事准备上，相关流程的审批也被迫延后，望您谅解。”\n\n“这并不是理由。”近藤勋一摆手，“我谨代表大日本帝国政府希望你方明白，加入共荣圈经济之后，我方将以满洲边境作为交易口岸，俄罗斯政府可以通过向我方提供工业物资和油气资源的方式，换取到发展和重建的资源，同时，在加入共荣圈市场后，帝国政府将在国际上更多支持俄罗斯与大日耳曼尼亚国进行合理合法的竞争，我们希望通过这样诚恳的合作，让双方都得到应得的利润。”\n\n瓦莉娅顿了顿，刚想继续组织言辞。突然，会议室的大门被打开了，一队黑色联盟的士兵冲入了屋子，与屋内的日军持枪对峙了起来。\n\n"
OMS_more_flavor.130.a: "“喂，女士，施压也要有个限度吧？你们这是在干什么？”"
OMS_more_flavor.131.t: "双簧"
OMS_more_flavor.131.desc: "瓦莉娅看向那位带头的军官，“您好，这里在进行俄日经贸谈判，你们是不是找错地方了？”\n\n“并没有找错”，带头的军官冷冷的回应道，“就在今天早上，我们的边境卫兵在巡逻期间发现了十余名俄罗斯人的尸体，巡查部队发现了有多个村庄被有规模的屠杀，凶手使用的武器全部是日式武器，我们现在有理由怀疑是日本人阴谋入侵我国边境。”\n\n“这是污蔑，大日本帝国一直支持和平原则，绝不会做如此之事！”近藤勋大喊道。\n\n“没错，近藤先生和他的团队一直在和我们进行商谈，他们绝不是阴谋家！”\n\n“但这是事实”，军官递来一叠照片，让每位外交官传阅，“为保证边境安全，总司令已经下令，我国政府暂时冻结一切俄日有关的经贸合作关系，所有日本驻俄侨民和相关经济资源都将由我们进行临时看管，至于你们，将在几天后被遣返回日本。”\n\n瓦莉娅举起了手，“不管如何，我希望能让近藤先生完好的回到日本，他作为俄日友好的外交官，俄罗斯人的朋友，不应该受到如此对待”\n\n“谢谢您，女士”。近藤勋向瓦莉娅点了点头，又愤愤的看向军官，收起了文件包：“我们走！”\n\n看着日本人走远了，瓦莉娅和带头的军官相顾一笑，击了个掌。\n\n“瓦莉娅，你估计日本人要多快才能知道这里的状况？”\n\n“至少三个月吧，情报那边的人已经交代好了，咱们的人已经做了点手脚，这帮日本人回去的路上，他们的载具会出点小故障的。”\n\n"
OMS_more_flavor.131.a: "等到日本人反应过来的时候，我们已经准备好了。"
OMS_more_flavor.132.t: "迟来的复仇"
OMS_more_flavor.132.desc: "老埃米尔把雪橇放到树旁，拄着拐棍，带着猎物往山下走去。今天又是丰收的一天，他拿着一把猎枪在大森林里来去自如，碰上猎物之后悄悄的接近它们，然后开枪。虽然他已经快六十多岁了，但年轻时候在防卫军里练出的本事可还没退步，他一个就打了两只雪貂和一头鹿。他已经想好了，等到了村子里，就让马基一家帮忙把皮扒下来，他好把这些东西卖到附近的城里去，城里善良的日耳曼人一直在收这些玩意，他想从他们手里换点东西用。\n\n他走着走着，突然感到了一股由衷的不对劲，天色渐晚，一般这个时候村子里各家各户早该点起火炉了，村前的路灯也会打开，照亮村前的夜路。可他都快走到村中间了，村里的人呢？\n\n他的鼻子动了动，不安的感觉上升到了极点。他马上丢下猎物，向村外跑去，可为时已晚，一根弩箭射中了他的大腿，然后又是两声枪响，他能听的出来，带了消音器。但他来不及多想了，剧痛瞬间击倒了这个老人，他倒在地上，一群黑衣服的士兵从四面八方冲了出来，将他团团包围起来。\n\n“多等一会是对的，差点就放跑了人，走漏了消息。”一个黑面具走到他面前：“说，老头！你们这里有没有德国人？他们住在哪？”\n\n"你们！你们是俄国人！你们还敢踏上芬兰的土地！"老埃米尔听了出来，一股由衷的愤怒从心头涌了上来。30多年前，那时的埃米尔还是个年轻的小伙子，在听闻祖国被邪恶的布尔什维克俄国入侵之后，他参军入伍，接受了雪地的训练。他和他的战友们在雪地上纵横驰骋，把那群俄国人打的头破血流，让这些家伙灰溜溜的滚回老家。之后他们还跟着日耳曼朋友们一路向东，狠狠的教训了该死的俄国人。可现在，他们还是不死心，要进犯芬兰！\n\n一只军靴踢到了他的脸上，差点把埃米尔踢的吐血，“问你话呢，听见了没！纳粹垃圾们在哪？”\n\n“在，在附近的城市里，他们只是普通人，多余的我什么都不知道。”老埃米尔断断续续的说着，心里却打定了主意。只要这些入侵者一走，他就尽快去找雪橇，赶到城里去通知防卫军和日耳曼朋友。面对俄罗斯敌人，芬兰人唯一能靠的朋友只有日耳曼人。\n\n一把军刀狠狠的抹过了埃米尔的脖子，也断绝了埃米尔的想法。“我们可没说放过你，垃圾。”\n\n带头的军官站起身，“把现场处理好，别留下痕迹。”\n\n"
OMS_more_flavor.132.a: "没有人能跳脱死亡的阴影。"
OMS_more_flavor.133.t: "十五从军征"
OMS_more_flavor.133.desc: "征兵处的空气凝滞、冰冷，混杂着廉价烟草的辛辣和若有若无的绝望气息。沃龙佐夫少校的办公室就是一台审判的机器，效率惊人，铁面无情。他桌上的印章每一次落下，都像一把砸向个人命运的铁锤，而他对此早已麻木。\n\n门开了，一个年轻人被两名卫兵推了进来。他步履踉跄，眼中尚存着最后一丝属于学生的、不切实际的希冀。\n\n“姓名，年龄。”沃龙佐夫头也不抬，视线黏在卷宗上。\n\n“康斯坦丁·伊里奇·罗科夫，二十四岁，是学生。”年轻人挺起胸膛，试图让声音显得平稳，“托木斯克国立大学历史系四年级——”\n\n“历史，”少校终于抬眼，那双灰色的眸子里空无一物，“历史已经终结了，学生。未来只有一个方向。”他拿起印章，蘸了蘸猩红的墨水，却并未落下。\n\n卫兵会意，架起面如死灰的康斯坦丁。年轻人最后的挣扎和不成句的辩解被沉重的铁门隔断。片刻之后，走廊尽头传来一声沉闷而短促的枪响，沃龙佐夫的眉毛甚至没有颤动一下。\n\n“下一个。”\n\n终于，轮到一个瘦小的身影。他看起来比实际年龄还要小，那身明显是哥哥留下来的旧外套在他身上显得空空荡荡。他站在桌前，双手紧张地绞着衣角，因恐惧而睁大的眼睛里，却强行挤出一丝沃龙佐夫在无数人脸上见过的、卑微的谄媚。\n\n“德米特里·米哈伊洛维奇·费奥多罗夫。十五岁。”男孩的声音细弱蚊蝇，却带着一种被逼到绝路的决绝。\n\n沃龙佐夫第一次放下了手中的笔。他饶有兴致地打量着这个孩子。十五岁。还未被无用的知识污染，没有被安逸的生活腐蚀。他的眼中没有质疑，只有纯粹的、动物般的求生本能。这种眼神，少校很熟悉。那是属于联盟的眼神。\n\n“你为何而来，德米特里？”\n\n“为···为联盟效力，少校同志！”男孩站得更直了些，“为大审判贡献我的力量！为俄罗斯复仇！”他背诵着宣传手册上的话语，因紧张而有些结巴，但每一个字都铿锵有力。\n\n“你的家人呢？”沃龙佐夫的声音第一次缓和了些许。\n\n“父亲在三号工厂，母亲在纺织车间。他们都说，这是我们家的光荣。”男孩的眼中闪过一丝不易察觉的痛苦，但他立刻用狂热掩盖了过去，“我······我也想成为光荣。”\n\n沃龙佐夫看着他，仿佛在审视一件完美的璞玉。这才是联盟需要的。不是那些满腹经纶的学生，不是那些自以为是的农民。是这些被仇恨与饥饿塑造、被宣传与恐惧打磨的孩子。他们是空白的画卷，可以被尽情涂抹上黑色联盟的意志。他们是最新、最锋利的剑刃，还未沾染过一丝锈迹。\n\n少校拿起另一个印章，重重地盖在一份新的档案上。印章的图案不是骷髅，而是一枚齿轮。\n\n“批准。分配至第七军械厂，学徒工。”他将文件推给卫兵，对男孩说：“你的家人会为你感到骄傲。你的劳动将化为射向条顿杂种的子弹。去吧，德米特里。去锻造复仇。”\n\n男孩如蒙大赦，深深鞠了一躬，几乎是跑着离开了办公室。当门在他身后关上时，沃龙佐夫望着窗外铅灰色的天空，第一次，那张僵硬如面具的脸上，露出了一丝满意的微笑。\n"
OMS_more_flavor.133.a: "磨利我们最年轻的剑刃。"
OMS_more_flavor.134.t: "白"
OMS_more_flavor.134.desc: "这间囚室是纯粹的白，一种能将人逼疯的、毫无杂质的白。墙壁、天花板、地面，甚至连那盏永不熄灭、发出恒定嗡鸣的灯管，都散发着冰冷的白色光晕。尼古拉·安德烈耶维奇·切尔诺夫教授已经不知道自己在这里待了多久。时间的概念，连同他曾经珍视的一切——逻辑、理性和科学的尊严——都在这片无尽的白光中被溶解、被粉碎。\n\n他曾是新西伯利亚大学最杰出的化学家，一个坚信知识应为人类福祉服务的人道主义者。当黑色联盟的铁蹄踏碎了新西伯利亚的脆弱和平时，他天真地以为，凭借自己的才学，总能在新秩序中谋得一席之地，继续他的研究。\n\n他错了。错得离谱。\n\n他们找到他时，没有审判，没有指控，只有一记枪托和无边的黑暗。醒来时，他已身处此地。审讯者们日复一日地到来。他们不问秘密，他们不需要他招供什么。他们的目的更为直接，也更为恐怖。\n\n“教授，”一个声音，总是那个冷静得不似人类的声音，在他耳边响起，“我们知晓你的才华。你的大脑是一座宝库，一座能为俄罗斯母亲锻造出最强复仇之剑的宝库。你需要做的，仅仅是同意。同意为联盟服务。”\n\n“我绝不会让我的知识成为屠杀的工具！”最初，他还能如此怒吼，用最后的尊严抵抗着。\n\n回应他的，是沉默。然后是痛苦。他们的方式极具“科学性”。没有粗暴的殴打，只有精准的折磨。让他几天几夜无法入眠，直到幻觉在他眼前狂舞；让他浸泡在冰水中，直到感觉不到四肢的存在；在他最饥饿的时候，端上一盘热气腾腾的食物，却在他伸手的瞬间拿走。\n\n他们一点点剥离他的人性，将他还原为一头只剩下求生本能的野兽。但即便如此，他内心深处那块属于科学家的、顽固的磐石，依然没有被完全击碎。他以逻辑为盾，以伦理为墙，坚守着最后的阵地。\n\n直到今天。门开了，进来的还是那个声音冷静的审讯者。但他手中多了一样东西——一张照片。\n\n“看看她，教授，”审讯者将照片放在他眼前，“你的女儿，安娜。多美的孩子。她也在我们的‘管辖’之下。她在一所不错的学校里，食宿无忧。但你知道，我们的资源很紧张···大审判需要牺牲。”\n\n切尔诺夫的瞳孔猛地收缩。照片上的安娜正在对着镜头微笑，那是他被带走前最后一次见到她的模样。\n\n“一个女孩的口粮，和一个装满化学毒剂的炮弹······哪一个对俄罗斯的未来更有价值？”审讯者蹲下身，声音轻柔得如同毒蛇的嘶嘶声，“这是一个简单的逻辑题，教授。用你的科学大脑想一想。一方是你的女儿，一个脆弱的、情感的、对联盟的伟业几乎毫无用处的个体。另一方是终结条顿威胁、拯救数百万俄罗斯同胞的希望。哪一个选择更‘人道’？哪一个，更能体现你所说的‘为人类福祉服务’？”\n\n逻辑···他们竟然用他最引以为傲的武器来攻击他。\n\n切尔诺夫呆呆地望着照片，审讯者的话语如酸液般腐蚀着他的思想防线。他的坚持、他的伦理、他的信念······在女儿纯真的微笑面前，显得如此苍白、如此自私、如此可笑。他的身体开始无法控制地颤抖，喉咙里发出野兽般的呜咽。那块坚守已久的磐石，终于裂开了一道缝隙，然后轰然崩塌。\n他输了。彻底地输了。他的科学、他的逻辑、他的一切，都被扭曲成了指向他自己的匕首。\n\n“我······我······”他艰难地张开干裂的嘴唇，发出的声音连自己都感到陌生，“我···同意。”\n\n审讯者脸上露出了胜利的微笑。他收起照片，扶起几乎虚脱的切尔诺夫，为他解开镣铐。\n\n“明智的选择，教授。你的才华将得到前所未有的施展。来吧，一个全新的实验室在等着你。科学，终将为国家找到出路。”\n\n当切尔诺夫被搀扶着走出那片折磨他许久的纯白地狱，迈向另一个同样纯白、却充满着烧杯与仪器的“新天地”时，他的双眼已经失去了所有的光彩。他不再是尼古拉·安德烈耶维奇·切尔诺夫教授。\n\n他只是一件工具。\n"
OMS_more_flavor.134.a: "科学必须为国家服务。"
OMS_more_flavor.135.t: "论俄罗斯民族"
OMS_more_flavor.135.desc: "大学的阶梯教室里，空气冰冷得如同太平间。暖气早已在统一战争的初期就被切断，节省下来的每一焦耳热量都将化为子弹。被迫前来“再教育”的市民们裹着单薄的外套，坐在硬木椅子上，他们与其说是听众，不如说是审判席上的被告。\n\n讲台上，阿纳托利·安德烈耶维奇·沃尔金教授扶了扶他那副老旧的眼镜。他曾是托木斯克最受尊敬的历史学家，一个沉醉于基辅罗斯与罗曼诺夫王朝辉煌史诗的人。如今，他只是一件工具，一件用来重塑历史的工具。\n\n“下午好，公民们，”他的声音通过扩音器传出，干涩而没有感情。“今天，我们将探讨一个根本性的问题：俄罗斯的边界在哪里？”\n\n他没有等待回答，而是转身指向身后那幅巨大的、未经“修正”的欧亚地图。\n\n“传统观念，也是···呃，软弱的观念认为，边界是由山川、河流以及那些用墨水和谎言签订的脆弱条约所界定的。他们会告诉你，这就是俄罗斯。一片广袤、被动、等待着被塑造的土地。这是一种根本性的错误。”\n\n他拿起一根教鞭，重重地敲击在乌拉尔山的位置。“他们说，这里是欧洲与亚洲的分界。一个地理上的···幻想。真正的俄罗斯，从不承认地理的暴政。请各位回想伊凡雷帝的时代，当他击碎喀山汗国的枷锁时，他是在遵从地图的指示吗？不。他是在履行‘收复罗斯之地’的神圣使命。”\n\n“再看彼得大帝。他难道是在波罗的海边找到了一个天然的港口吗？不，他是用瑞典人的尸骨和俄罗斯人的血汗，从一片沼泽中硬生生‘开凿’出了一扇望向欧洲的窗户！他用战斧和意志，重新定义了俄罗斯的西部边界。他明白一个真理——国界线不是被发现的，而是被创造的。”\n\n沃尔金教授的语速开始加快，他陈年的学术热情似乎被一种更黑暗的能量点燃。\n\n“几个世纪以来，我们的思想家，那些沉湎于忏悔和救赎的···呃，文学家们，他们让我们向内看。他们教我们审视灵魂的深渊，却忘了审视我们疆域的脆弱。当我们在陀思妥耶夫斯基的文字中为罪人的眼泪而感伤时，条顿人正在普鲁士的土地上磨利他们的刀剑。当我们在契诃夫的戏剧中为小人物的悲剧而叹息时，他们正在制定一个旨在彻底抹除我们民族的‘东方总计划’。”\n\n他猛地用教鞭指向地图上的柏林，几乎要戳穿那层薄薄的纸。\n\n“于是，‘第一次审判’降临了。那不仅仅是一场战争，那是一次地缘政治学上的最终裁决。它无情地证明了：一个只知内省而不知扩张的民族，一个满足于现有疆界而不思进取的民族，其最终的命运，就是在别人的地图上被重新划分，甚至被彻底抹去。”\n\n“我们从蒙古人的铁蹄下学到了什么？不是和平共处，而是生存的法则——要么你成为狼，要么你成为羊。我们从拿破仑的炮火中学到了什么？不是民族和解，而是只有一个被彻底摧毁的敌人，才不会卷土重来。这些血的教训，那些软弱的沙皇和腐朽的共产主义者都忘了！他们妄图用外交辞令、用意识形态的空谈来保障安全，结果呢？结果就是日耳曼尼亚这座巨大的、流着脓血的毒瘤，至今还盘踞在我们母亲的胸膛上！”\n\n沃尔金的目光扫过台下每一个惊恐或麻木的面孔。\n\n“所以，同志们，俄罗斯的边界究竟在哪里？它不在乌拉尔山，不在第聂伯河，也不在那条可笑的AA线上。我们的安全边界，我们的文化边界，我们民族的生存边界，它在最后一个潜在威胁被彻底根除的地方。”\n\n他放下教鞭，平静地总结道。\n\n“大审判，从本质上说，就是一次最大规模的、最终极的‘收复罗斯之地’。这不是侵略，这是外科手术。我们不是在扩张，我们是在切除威胁我们生存的癌变组织。因此，俄罗斯的边界，将终结于最后一个条顿人咽气的地方。”\n"
OMS_more_flavor.135.a: "一篇精彩的讲义。"
OMS_more_flavor.136.t: "正本溯源"
OMS_more_flavor.136.desc: ""开门！开门！我们是联盟警察，我们怀疑这里藏匿反政府分子！马上打开大门让我们搜查！否则我们将立刻动用武力！"\n\n“阿訇，不能开门,这帮家伙什么时候用过和平的手段过？他们就是一群屠夫，恶魔，迟早要下火狱的！”\n\n艾哈迈德叹了口气，看了一眼大堂里慌慌张张的人们，有的人躲进袍子里哆哆嗦嗦，有的人手持着经书不肯撒手。他们试图让自己表现得勇敢一些，恐惧却已流于表面。\n\n“我去开门吧，跟他们讲一讲道理。”艾哈迈德叹了口气，走到大门口，打开了门。\n\n黑衣服的警察们鱼贯而入，冲进了清真寺。领头的胖军官对着艾哈迈德笑了笑：“这么晚才来开门？我还以为你们根本听不懂人话呢。”\n\n“我是为了保全我们的人民，先生。我是个穆斯林，安拉教导我们要关爱穆斯林兄弟，帮助贫苦的人们，他们这几天过的走投无路，所以我暂时收留了他们。”\n\n“走投无路？你知道他们为什么走投无路吗？”两人说话的功夫，黑色联盟的警察们已经把清真寺里的一个个人都逮了起来。一件件物品都被堆放在两人之间的空地上。\n\n“看看这个，《古兰经》，用哈萨克语写的？”军官随手翻了几页，丢到地上，“这个世界上从没有哈萨克这个概念，没有！这里从来都是伟大的俄罗斯的一部分，历史书上记着的！”\n\n“可，可哈萨克人从古至今都生活在这片土地上，他们有自己的民族文化...”\n\n“那我问你，到底是谁带领他们走进文明？”军官大声的吼了出来。“50多年前，哈萨克还是一片蛮荒之地，是伟大的俄罗斯民族带他们走出了游牧生活，教他们识字，告诉你们怎么搞工业！可他们做了什么？原初审判躲在后方不愿出头，坐视中亚被纳粹猪狗入侵不去消灭，甚至还要用可笑的所谓哈萨克民族认同来驱逐这一地区的俄罗斯人？什么狗屁哈萨克，只不过是窃取了俄罗斯成果的一群小偷！”\n\n他看向艾哈迈德，语气放松了些。“看在你配合我们工作的份上，滚！这里以后要改造成学校，这里的孩子必须受到正确的教育，才能不被这些小偷们继续蒙骗。”\n\n"
OMS_more_flavor.136.a: "我们会把歪理从根源上铲除。"
OMS_more_flavor.137.t: "以非暴力不合作"
OMS_more_flavor.137.desc: "血腥味和烧焦羊毛的臭气混合在一起，令人作呕。这座村庄的反抗比上一座更激烈，也更···愚蠢。他们没有武器，只是手挽着手，堵在士兵面前，唱着他们的古老歌谣，拒绝离开世代居住的土地。\n\n政委的命令简单而直接：“任何阻碍联盟前进的物体，都将被移除。”\n\n现在，“移除”工作已经结束。帕沙正在和其他士兵一起，把尸体堆到卡车上。他的动作已经比几周前熟练多了，不再呕吐，也不再发抖。他只是机械地抓起一具具尚有余温的肢体，扔上车斗。\n\n“我还是不明白，谢尔盖。”在又一次把一对母子的尸体扔上车后，帕沙靠在卡车上喘着气，对一旁抽着烟的谢尔盖说，“他们为什么就是不肯走？只要走，就能活。就这么简单。为了几顶破毡房，几只瘦羊，值得吗？”\n\n谢尔盖深深吸了一口烟，将烟雾吐向血红色的天空。“对你来说是破毡房，帕沙。对他们来说，那是家。是传统。是他们的民族。这些东西，比命还硬。”\n\n他把烟头碾在靴底。“这就是为什么它们必须被清除。你不能跟一块石头讲道理，说它挡了路，请它挪一挪。你只能把它砸碎。”谢尔盖指了指地上的尸体，“这是他们自己选的。我们给了他们选择：服从，或者灭亡。他们选择了后者。所以，这不是我们的暴力，帕沙。是他们的顽固，引来了这必然的结果。”\n\n谢尔盖想起了他在西俄罗斯战争时的经历。一个红军指挥官，因为他的部下一个排拒绝执行自杀式冲锋，他便亲手枪毙了那个排长，然后逼着剩下的人冲锋。那时候，谢尔盖觉得那指挥官是个疯子。现在，他明白了。\n\n“我们的领袖们都是外科医生，帕沙，”谢尔盖用一种近乎传教的语气说道，“而俄罗斯是个重病的病人。有时候，为了保住性命，你必须切掉一条已经坏死的腿。不管那条腿愿不愿意。”\n\n帕沙看着自己的双手，上面沾满了别人的血和脑浆。他沉默了很久，久到谢尔盖以为他不会再说话了。\n\n“所以···”帕沙的声音空洞而疲惫，“我们···只是手术刀。”"
OMS_more_flavor.137.a: "那天晚上的风，吹不散空气中血的味道。"
OMS_more_flavor.138.t: "一门关闭的生意"
OMS_more_flavor.138.desc: "黑龙江的风，像是掺了碎玻璃，割得健司的脸颊生疼。十几年来，这条冰封的河是他赖以生存的血脉。他熟悉这里的每一处冰裂，每一个可以避开巡逻队的雪丘。他知道，从前的俄国人——那些醉醺醺的军阀士兵——他们的忠诚可以用一瓶上好的清酒来衡量，他们的警惕心会在午夜后随着体温一同下降。\n\n但今天，风里只有铁锈和死亡的味道。\n\n对岸那片他闭着眼睛都能摸到的渡口，已经变了样。记忆中歪斜的木质岗哨，被一座棱角分明、漆黑如永夜的水泥碉堡所取代。刺眼的铁丝网在苍白的雪地上，拉出蛛网般的狰狞影子。而那些哨兵······他们不再是活生生的人，只是一具具包裹在黑色制服里的、沉默的幽灵。\n\n健司的心在胸腔里沉重地擂着鼓，但他几十年的投机生涯让他选择相信自己的运气。或许，只是换了一套更唬人的行头。他从雪坡后探出半个身子，手里紧紧攥着一块小小的金条——这是他为这次交易准备的“敲门砖”。\n\n就在他打算发出惯常的、模仿水鸟的口哨声时，碉堡上的一个黑影动了。没有警告，没有喊话。只有一个细微的、被风几乎吹散的金属声响，轻得像是远处冰层开裂。\n\n那是步枪保险被打开的声音。清脆、决绝、不带一丝犹豫。\n\n健司全身的血液仿佛在瞬间凝固了。他几十年来赖以生存的直觉，此刻才发出迟来的、撕心裂肺的警报。他错了。规则已经彻底改变。这里不再有交易，只有审判。\n\n他想转身，想把自己重新缩回雪里，想让时间倒流哪怕一秒钟。但来不及了。\n\n第二声响动划破了西伯利亚的死寂。不是雷鸣，只是一声短促而干瘪的爆裂。子弹精准地从他微张的嘴里钻入，从后脑带出一股滚烫的黏稠物。\n健司的身体向后仰倒，重重地砸在雪地上。他眼中最后映出的，是那片广袤而灰暗、毫无怜悯的俄罗斯天空。那块金条从他松开的手中滑落，在雪地上滚了几圈，暗淡无光。\n\n一片殷红，迅速在他身下的雪地里晕染开来，像一朵盛开在死亡之上的、怪异而凄美的花。\n\n碉堡上的那个黑影，静静地看着这朵红花绽放，直到它不再扩大。然后，他放下了步枪。\n"
OMS_more_flavor.138.a: "一笔了结的交易。"
OMS_more_flavor.139.t: "淬火的遗产"
OMS_more_flavor.139.desc: "沃尔库塔的这间囚室是纯粹的灰色。墙壁、铁桌、头顶永恒亮着的灯管，都浸透在这种剥离一切色彩的、工业化的绝望之中。\n\n瓦西里·伊万诺维奇·崔可夫元帅静静地坐着。他曾将一个城市的名字，与钢铁和不屈熔铸在一起。而现在，他只是一个被历史遗忘的囚徒。他不是败给了德国人，而是被他曾发誓保卫的那个理想，以及践踏那个理想的继任者们一同出卖了。\n\n门开了。走进来的是一个黑衣上尉，年轻的脸上是只有狂信徒才会有的、冷静的烈火。他将一份档案放在桌上。\n\n“崔可夫元帅，”上尉的声音没有感情，“您的遗产，是无数德国人的尸体堆积起来的。这是一笔宝贵的遗产，祖国需要它。”\n\n崔可夫冷笑，声音沙哑。“我的祖国是苏维埃。”\n\n“苏维埃死了，元帅。”上尉的声音不为所动，“它死在无能和背叛之中。现在，只有俄罗斯活着——一个伤痕累累、只渴望一件事的俄罗斯。”\n\n上尉将档案转向崔可夫。那是一份任命书。\n\n“您面前有两条路。一条是作为一个时代的纪念碑，在这里，被世人遗忘。另一条，是再次成为一柄利剑。我们将给您一支军队。一支由您的仇恨淬火、由我们的意志驱动的军队。您的目标只有一个，那个您在1957年未能亲手踏平的地方——日耳曼尼亚。”\n\n沉默。漫长的沉默。崔可夫盯着那份文件。他一生所信奉的，早已崩塌。但他内心那块最坚硬、最沉重的基石——那份对纳粹的、足以烧穿冻土的仇恨——依旧完好无损。\n\n与新的魔鬼共舞，去完成一场迟到了二十年的复仇。还是抱着一个幽灵的骨灰，在这里化为尘土？\n\n这不是一个关于荣耀的选择。这是一个关于终结的选择。\n\n他缓缓伸出手，枯瘦的指节触碰到了那冰冷的纸张。\n\n“我的参谋班子。”他低声说。\n\n上尉嘴角，第一次浮现出一丝难以察仄的弧度。\n\n“他们正在整装待发，元帅同志。”\n"
OMS_more_flavor.139.a: "他准备再次赴死。"
OMS_more_flavor.140.t: "长久的伤痕"
OMS_more_flavor.140.desc: "迈克尔自从诞生之日就生活在这片曾经被称为莫斯科维恩的土地上，如他从德国移民来的父亲和母亲一般。他老实，诚信，能干——就像教科书上说的纯种日耳曼人一样，唯一不符合课本的可能是他对于“劣等民族”的善良，他甚至多次在力所能及的范围之内帮助过一些落难的本地人。不过，20多年一成不变的生活从黑色联盟踏上这片土地之日起，就注定迎来了终结。他被黑色联盟抓住了。\n\n“我的命运会怎么样？听邻居们说这群俄罗斯人见到德国人就杀···我也会成为他们的刀下亡魂吗？还是说他们会先折磨我一番？···天啊······”迈克尔胡思乱想，怀揣着极度的恐惧被押送德国人的黑色联盟军官驱赶着，不知走了多久，一直到他那双被扒走了靴子的双脚磨到起了泡，他们终于到达了目的地:一座集中营。\n\n他们这一批人全部被聚集在了一个广场上，这200多号德国人被联盟的恐怖事迹所震慑，竟然没有一个敢交头接耳。\n\n军官走上了主席台，然后在一旁翻译官的帮助下开始喊话:“条顿人，你们可能认为我们会立刻将你们全部屠杀光，但你们错了。亚佐夫总司令已经制定了更有效率，并且更有用的方法。你们将被编入劳动营，你们的任何有价值的东西都将被夺走，被榨取，你们的一切都将成为大审判的养料，不过有特殊技能者可以争取优待——当然，不要想着反抗，更不要想着偷懒怠工或者搞破坏行动，我们有你们所有人的全部家人，爱人的资料。我们的特工和合作者遍布整个德国，一旦你们搞出任何小动作，我可以保证，你们的家人将受到你们无法想象的严酷折磨。你们的未来将惨痛难言，我可不会用骗人的谎话安慰你们。”\n\n他咳嗽了一下，然后继续说道:“首先，你们将被绝育，正如你们这些畜生曾经对每一个斯拉夫人做的那样。好了，把他们带走。”他甚至故意在两句之间停顿了几秒钟，一边欣赏他们不可置信的表情，一边观察着人群中的骚乱，显然他很享受这样的过程。迈克尔崩溃了，他几乎是带着哭腔的大声喊道:“长官，求求您放我一条生路，我的邻居们还有附近的斯拉夫人都可以作证，我平常绝对没有虐待过斯拉夫人，我······”下一个字还没吐出来，一颗子弹就已经嵌进了他的头颅。军官不耐烦的用手巾擦了擦枪口:“每个人都这么说，那你们都没有罪孽了？我他妈在这好好跟你们说话是因为你们大多是熟练技工，或者在技术领域有什么建树，所以更加有用。谁再敢顶嘴，一律杀了!”\n\n说罢，他扭头就走，任由卫兵将德国人们挨个拖进手术室，只是突然回头补了一句:“这回手铐脚铐弄紧点，还是一样，5人连坐，刑罚就稍微少点吧。”\n\n"
OMS_more_flavor.140.a: "“毕竟，打坏了可干不了什么细活。”"
OMS_more_flavor.141.t: "失踪"
OMS_more_flavor.141.desc: "贝尔.格莱德匆匆走到工厂的门口，给门口的两个卫兵出示了一下记者证。他迈步走进工厂，向工人休息区走去。这份对俄罗斯治下人权状况的收集还需要最后的一部分人证提供，昨天他因为要整理收集到的资料和文件，一整天没来工厂。他刚走到工人休息区的时候，便听到身后一位卫兵敬礼：“干员同志好！”\n\n贝尔转身过去，一位身着黑色联盟制服的军人已经面带微笑，站在他身后了。“你好，贝尔.格莱德先生，我是主管这座的工业干员435612号，你可以叫我伊万诺夫。”\n\n“伊万诺夫先生，我是美国的记者，这是我的记者证，我来这里是为了采访你们国内的工人状况，以帮忙你们获得国际援助的。”\n\n“哦，是你啊。看来我们没找错人。”伊万诺夫仍然面带微笑，说出的话却愈发让贝尔.格莱德感到不安。“我想想啊，根据我们找到的那个女工瓦夏的口供，她已经向我们证实。你，贝尔.格莱德，试图刺探我国核心的工业生产机密，同时以夸大、捏造事实的方式，对我国社会安定造成危害。”\n\n“没有这回事，我只是去找普通的工人采访她们的生活状况，并未询问任何工业话题。”\n\n“是吗？”伊万诺夫一招手，一名卫兵拿出一份文件递到他手上，上面写满了工厂职工们糟糕的生活状况，和她们家人的生活条件。“这是联盟警察在你家搜查出的报道底稿，你在报道期间大肆宣传我俄罗斯人权水平低下，对我国政府极大诋毁，这不是危害是什么？”\n\n还有，我看你这个姓氏，你是英国人是吧，看来还是一个隐藏的法西斯。妈的，给我带走！”\n\n"
OMS_more_flavor.141.a: "美国大使馆通告一则：我国一名公民在俄罗斯境内失踪，请俄罗斯政府帮忙找寻。"
OMS_more_flavor.142.t: "乡间漫步"
OMS_more_flavor.142.desc: "瓦西里来自鄂木斯克，处于对俄罗斯祖国的热爱，从小志愿当兵。1971年，他18岁，如愿成为了一名俄罗斯士兵，为黑色联盟效力。\n\n瓦西里见证黑色联盟的崛起并统一俄罗斯废土。久居住鄂木斯克的他时常能收到前线胜利战报，新闻报纸上刊登的，也几乎无一例外的是亚佐夫总司令的英明领导、敌人的节节败退、黑色联盟的伟大胜利，这使瓦西里时刻相信着黑色联盟将带领俄罗斯击溃仇敌，走向复兴。\n\n俄罗斯复兴政府已经成立，在亚佐夫同志领导下黑色联盟已经统一了废土，下一步就是向纳粹杂种发起伟大的大审判夺回属于俄罗斯人的一切。瓦西里被任命到征兵部工作，地点是鄂木斯克老家的乡下。尽管上级嘱托，符合条件的男性必须一律入伍，但当瓦西里到村庄时才发现，村子里几乎已看不见年轻力壮的男人了。瓦西里的工作成了赋闲，组织上给他和他的同事亚历山大批了一天的假期。\n\n在田埂上，瓦西里有些恍惚。记得小的时候，英俊的青年人在田野劳作，含羞的姑娘们在家中编织，丰收的时候田野一片欣欣向荣。如今战乱结束，村庄却满是荒凉，小伙子们消失不见，只剩病残的老人和守家的妇人，田野杂草丛生，放眼望去只有荒芜······黑色联盟的统一并没有给人们带来幸福，不是吗？\n\n“736585号干员，是时候离开了。瓦西里同志，你似乎有些什么心事。”同行的亚历山大问他。\n\n瓦西里从思绪中回到现实，刚才似乎什么危险思想在他脑海中闪过。他整理了下自己的思绪，回答道：\n\n"
OMS_more_flavor.142.a: "“657605号干员，我们该去工作了。”"
OMS_more_flavor.143.t: "尊严或死亡"
OMS_more_flavor.143.desc: "“俄罗斯的同胞们！喀山的公民们！请暂时等一等，听我说！好吗？”\n\n喀山十月街的民众们从不同的工作场所疲惫的走出来，他们行色匆匆，想赶紧回家休息。但一转街角，就看到了一辆大卡车，几个人正蹲在卡车上，向车下簇拥的民众递面包，一个人则站在车上，手里拿着一份宣传单和大喇叭，朝着聚集而来的市民们大声宣传起来。\n\n“同胞们，我一直坚信，我们俄罗斯人天生拥有着享受自由和民主的权力，我们有权力争取有尊严的生活！稳定的工作，充足的食物，充分的人权！我们俄罗斯人要在这个混乱的时代里有尊严的活在世界上。即使纳粹再怎么毁灭我们的家园，我们依然要保持生活的希望！”\n\n“”我的政治观点很简单，我们的人民所希望的一直是稳定！无论任何时代，或者是什么统治者，他们都不应该破坏来之不易的稳定，俄罗斯的人民经历了众多分裂份子的破坏和压迫，他们不应该再因为独裁而被毁灭自己稳定的生活！”\n\n“最近，我听说政府颁布了一项强制搬迁法令，宣传为了保护我们人民免于纳粹的入侵，要求我们的人民向东部地区搬迁。请各位好好的想一想，这难道不是我们对我们稳定生活的一种破坏吗？我们的人民期望的是一份稳定的生活，稳定的情感，有了它们，我们俄罗斯人民就能够从头拥有尊严，有了尊严，我们的人民就不会惧怕强权压迫，敢于与外界侵略的敌人作斗争...”\n\n“警察来啦！”\n\n外面的民众突然一声呐喊，围观的群众们纷纷作鸟兽散，有的连面包都扔了。几个警察从街角转过来，掏出枪先往轮胎上打去，把车泄气了。\n\n“今天运气挺好，抓到几个不怕死的修正主义份子。”警察们跳上车，把几个人通通拷了起来。为首的知识分子还在向为首的警察喊道：“先生！请您听我说，政府为了所谓的大审判理论就连民众的意愿都不顾，让这片动乱地区的民众强制搬到他们不熟悉的地方。这...”\n\n“闭嘴，垃圾。”为首的警察对着他就是一拳，“尊严，尊严有德国人的炸弹大吗？纳粹马上就要入侵俄罗斯了，你们这种有车的垃圾让民众挡在你们前面反对联盟的政策，然后喊着什么狗屁稳定，尊严，让民众去反对政府？给我搜，看看他是不是个纳粹间谍！”\n\n"
OMS_more_flavor.143.a: "无论是否查实，今天的枪毙名额就他们几个了。"
OMS_more_flavor.144.t: "最后机会"
OMS_more_flavor.144.desc: "致：亚佐夫总司令\n\n发件人：亚历山大.萨哈罗夫斯基、叶夫根尼.萨温采夫\n\n第二轮核反击战略讨论已得出结论，可供审议。\n\n祖国西部的主要核反击设备已施工完毕，其余部分仍在继续施工。供应使用的核导弹已在指定工厂进行组装和装填，保密局、信号旗特种部队、国家发展部等部门已全方面介入进行监控。在此期间，纳粹对我西部各基地进行了多轮渗透，试图寻找我核武器基地的所在位置，在我各部门及时发现和行动下，可能的情报外泄已被及时阻止。\n\n情报网络显示，纳粹所持有的核武器规模和数量远超之前进行的估计。近几年来，纳粹军国主义者大肆宣传应对我国威胁，加大了核武库规模，在原有的基础上增添了数量更多、威力更大的核设备，我们有理由相信，纳粹高层已决心打一场核战争。一旦大审判开始进行，他们必然向我各城市进行全方面核突袭，摧毁我国军队，毁灭我国各大城市，我国西部的核设施将在第一轮反击后被纳粹高烈度的核打击下被摧毁。\n\n各部门得出统一意见。联盟必须保留最后的核交换力量，以打破世界各地核力量平衡，推动最终大审判的实现。经多部门的讨论，我们需要一个数据收集系统，这个系统需要对我国范围内辐射程度、地震和核爆炸等迹象进行不间断的检测。在祖国境内遭遇核打击后，这个系统将检测与联盟军方的通信网络，通讯正常并接受命令情况下，此系统将继续静默。一旦通讯失联，此系统将授权给导弹井内的值班人员以最后打击授权。\n\n为保证反击效果，并预防可能潜藏的堕落分子掌握打击力量，各部门认为，有必要设计全自动化的“边缘系统”，它将成为我们完成大审判的最后希望。\n......\n大审判至高无上。"
OMS_more_flavor.144.a: "批准，德米特里·亚佐夫。"
OMS_more_flavor.145.t: "我们的流星"
OMS_more_flavor.145.desc: "季莫申科站在发射台前，注视着眼前这枚崭新的，由俄罗斯优秀的大师们所铸造的钢铁巨物，对未来的憧憬和恐惧几乎要冲出他的胸膛。在他身后，一群身着洗的发白的工装的技术员和工程师，眼神中带着敬畏和茫然的干员和士兵们都屏息以待，等候着最后的考验，关于俄罗斯民族能否重新锻造自己脊梁的考验。\n\n为了完成这个考验，在过去的几个月里，这支团队已经走过，甚至是飞跃了无数的艰难险阻：情报干员拼死拿到的导弹并非全须全尾，设计图更是残缺不全，为了破解导弹的奥妙，工程团队没日没夜的进行拆解和测绘，技术员们一遍遍的趴在导弹表面进行测试和绘图，无数的存疑几乎是第一时间就写满了测绘的报告纸，损坏的部分他们也需要去修整，整个团队为此在此过程中疲惫不堪，但每个人都咬紧牙关，不肯放弃希望。\n\n测绘完毕后，弹体所使用的材料又成了新的难题。特种合金钢、特种橡胶等种种未知的材料，都几乎让科研团队绝望。为了完成这项任务，全国范围内都开启了秘密的资源调配和研究，国内外的情报机构都为他们的需要全方面运转起来，无数国内外的优秀成果都送到了他们手上以供使用。季莫申科还记得，当他们第一次用那拼凑起来的仿制发动机进行大规模试车时候，雄雄的火光照亮了季莫申科深陷的眼窝，也照亮了所有人充满泪痕的眼眶。\n\n终于，组装完毕，要发射了，巨大的倒计时正在指挥所的屏幕上跳动，季莫申科坐在主控台前，双眼死死的盯住屏幕，他一旁的军官虽然面无表情，但双手却已经攥紧了座椅扶手。\n\n“点火！”\n\n一团耀眼的火球从导弹的末尾喷涌而出，巨大的轰鸣随后到来，俄罗斯的首枚洲际导弹“撒旦”开始缓缓上升。所有人都抬起来，以一种敬畏和希冀注视着这个粗犷的钢铁巨兽继续飞向太空。而这个巨兽也不负众望，它继续咆哮着，沿着预定的弹道刺破远方的天际线，直至没入遥远的天际线。\n\n几小时后，好消息传来了，预定海域的目标已经被摧毁。指挥所里的死寂终于被打破，无数的工人，研究员和军官们相拥在一起，哭着，喊着。季莫申科仍然一动不动的注视着屏幕，一滴浅浅的泪水，从他的眼框边流过。\n\n"
OMS_more_flavor.145.a: "俄罗斯的大地上，终于再次升起了自己的流星"
OMS_more_flavor.146.t: "杀人越货"
OMS_more_flavor.146.desc: ""雷明格,你确认这里就是海军基地？我怎么感觉这里已经废弃了？咱们别是碰上盖世太保了，要举报咱们领赏吧？”\n\n“相信我，约瑟夫，克诺普的人品你应该信得过。相关的消息你也看了，这两天基地在搞全面灭鼠行动，基地里的军犬都被调走了，你们中情局都跟我对接这么多次了，还不相信我的态度和能力？”\n\n约瑟夫，不，是黑色联盟外派特工，科瓦连科叹了口气，不禁开始为这次行动而担忧。自从通过秘密渠道来到大日耳曼尼亚之后，科瓦连科便隐藏自己的身份，表面上给别人当司机，暗中发展情报网络，某一天，他捡到了一个吸毒的醉鬼，也就是他身边的雷明格，这家伙身上一股条顿垃圾的颓废味，却意外的好骗，科瓦连科自称是CIA的特工，还给他看了伪造的证件，这家伙一看就凑着来当“美国特工”，给联盟提供了不少本地关系的情报。\n\n两人一路开着车到了海军基地的外墙，科瓦连科感觉自己快疯了，两个毫无军事身份的人开着一辆显眼的奔驰往军事基地走，一路畅通无阻。到了地方，科瓦连科下了车，碰上了准备已久的克诺普。“咱们翻墙进去吗？”\n\n克诺普递了根烟过去，“用不着，你们的上级不是说缺导弹吗？我这有工具，雷明格你把铁丝网切一下，咱们走正面，直接去基地里拿就是了。”\n\n科瓦连科感觉自己仿佛在做梦一样，他和飞行员克诺普从正门走进海军基地，门口的纳粹士兵还给他俩敬礼，两人一路径直走到存放导弹的库房内，科瓦连科刚想掏出资料比对，却被克诺普按住了。\n\n“喏，那个就是你们要找的德国的三叉戟，这玩意都过时了，上面马上要销毁，你们真不想拿点更先进的吗？”\n\n“没那个必要，遇上检查的不好说，赶紧走吧。”\n\n克诺普推来一辆大卡车，两人推着导弹向既定位置走去，中间没有任何巡逻队。到了位置，两人把导弹稳稳的塞进了车的后备箱。上了车，雷明格伸出了大拇指：“你们美国特工真是专业啊，都提前考虑好车的大小了。”\n\n科瓦连科打着哈哈，一路开着车到了接头地点，在那里，黑色联盟的情报干员已经等待多时了。在接待三人之后，干员们立刻对导弹进行了检查。“没错，确实是我们要的，你们立了大功。”\n\n“哦豁！那我们的奖励呢？”雷明格激动的问道。\n\n“奖励，奖励你们去死！”几位干员突然发起袭击，两人瞬间被打晕过去。联盟的干员们掏出几根针剂，打进了两人的脖子上。“新研发的镇静剂。666640干员，你开上车，把这两个垃圾送到马路上，他们会“合理”的死于一场车祸的。\n\n“至于导弹，把它拆开，从莫斯科边境运回去，我们的同志会喜欢它们的。”\n\n"
OMS_more_flavor.146.a: "特别是在把它发射到纳粹头上的时候。"
OMS_more_flavor.147.t: "利用恐慌"
OMS_more_flavor.147.desc: "“总司令，您看，这是我和国防部各位专家们经过商讨后，共同得出的一种能够有效突破纳粹敌寇防线的战术方案，您请过目。”\n\n亚佐夫伸手拿过简报，认真的看了几分钟，然后带着疑惑抬起头来：“你们确认，这种打法能有效突破纳粹的空中防线？”\n\n萨温采夫点点头，拉过一张黑板开始演示到：“根据情报部门收集到的可靠消息，纳粹生产防空导弹的生产效率极低，而且因为资本主义的原罪，他们生产的成本也高出我们几十倍。”\n\n“那又如何？”\n\n“根据我们之前的准备，一旦开战，我们就会迅速瘫痪掉敌人在莫斯科一带的全部联络，然后将那些脏弹打出去。在渲染恐慌之后，纳粹必然惊慌失措，对我们一切可能产生威胁的核相关使用都全力拦截，他们会拼了命的使用一切拦截导弹来应对我们任何可能的核打击行为”\n\n“但他们不是拥有整个世界最大范围的防空力量吗”？\n\n“理应如此，但在我们使用大规模的小型和运转不完全的脏弹袭击后，纳粹会迫于民意压力，选择无差别拦截，可他们无法完全识别所有的导弹是否是核导弹，防空成本又太高，他们一颗都失误不起，在足够规模的导弹交换之后，他们必然为了补充弹药而暂时中断防空，这时候我们的大家伙就可以派上用场了。”\n\n“此外，大规模的核武器的使用范围很容易造成大量的核辐射泄露，通过足够的当量堆积，我们的火力足够影响整个欧洲地区的空气，这些核辐射会长时间的影响西欧气候，直接毁灭纳粹所依赖的人口居住区，他们的家园会从根本上被毁灭。”\n\n亚佐夫点了点头，在技术完全落后的情况下，通过足够的智慧讨论，黑色联盟的同志们终于找到了有效的方法，以对抗纳粹的武器系统优势。\n\n"
OMS_more_flavor.147.a: "“很好，那就加大生产和相关模拟训练”"
OMS_more_flavor.148.t: "风暴前的宁静"
OMS_more_flavor.148.desc: "指挥中心外的天空阴云密布，马上要下雨了。亚佐夫翻了个身，试图闭上眼睛，但今天他又没睡着。他的私人医生已连续几日向他发起抗议，希望他能够好好休息。亚佐夫自己也知道，在大审判到来之前，他不能倒下，他如今是俄罗斯这台奔腾的战争机器的掌舵人，他一旦倒下，这个国家最后的救赎之路，能否继续按照他所预想的方向继续走下去，还是个未知数。\n\n一种由衷的冰冷突然涌上了亚佐夫的心头，为了大审判，他和他信任的每一个人，用各种方式，从宣传到暴力，催促，甚至是逼迫着俄罗斯人为了大审判的事业而服从，他几年前就知道，无论是他，还是他所信任的人们，都只是大审判这台战争机器的一部分，他们已经将燃料填满，事到如今，大审判已经不可阻挡。\n\n但如果，我们失败了呢？\n\n亚佐夫不由得想起之前种种讨论：纳粹的核武器将联盟领导层彻底毁灭，最后的核交换没能打出去；黑色联盟的士兵没能抵御住纳粹，大审判从一开始就胎死腹中；消息走漏，美日那些堕落者和纳粹组成联军，踏上俄罗斯大地······\n\n他突然感到一股胃疼，俄罗斯的人民已经为大审判而历经无数牺牲，可如果拼尽全力后的牺牲都毫无意义\n\n"
OMS_more_flavor.148.a: "那俄罗斯的未来在何处？"
OMS_more_flavor.149.t: "归队"
OMS_more_flavor.149.desc: "他溜了出去，趁着警备员没有注意，连衣服都没完全穿好。云层依旧阴暗，雷光在云层闪过的越来越快，雷声却时大时小。他漫无目的的走着，十几年过去，鄂木斯克变了很多，过去的简陋建筑如今早已被铲平，变为了大审判最后基地的一部分，他突然有些累了，抬起头往前看去，这里是训练场，就在上午，他还在这里给新一批的士兵训话，那些年轻人们眼中充斥着狂热与自信，仿佛能战胜一切困难，就像十几年前的他一样。\n\n他有些累了，随便找了把椅子，坐在了一侧，把另一侧留给了一个再也不会回来的人——卡尔贝舍夫。风声渐起，淅淅沥沥的小雨开始落向大地，也落到了亚佐夫的身躯上，这反而带给他一种奇妙的宁静。他看向远方，年轻的士兵们正在军官指示下进行越野训练，这帮新兵虽然跑的歪歪扭扭，却在军官的带领下没有一个落下队伍。亚佐夫点了点头，这正是军官该有的作用，他能带领着稚嫩的新人们从无到有学到知识，能够在集体之中明确自己的责任，有了他们，年轻人才能最快的得到成长，胜任他们应尽的职责。\n\n呼啸的寒风伴随着大雨落下，滚滚的雷声响彻大地。眼前训练的队伍们井然有序的跑回了营房，亚佐夫的心中却轻快了起来。就像老将军最后的一次训话里所讲过的，私欲绝不可高于人民之需，他也如此。\n\n回望来时路，他走过了一条血与火的征程：从塔拉到斯维尔德洛夫斯克，从萨马拉到伊尔库茨克，强大，统一的俄罗斯业已建成，作为联盟的领航者，他已经将俄罗斯指向了一条正确的方向。在过去的岁月里，老将军作为他的导师，指引他领悟了大审判的真谛，而今日，在大审判即将到来的十字路口之际，逃避责任，选择退缩，这不仅是辜负了大审判的最终真理，也是对所有俄罗斯人的背叛，而背叛不可饶恕。\n\n一群警备员和副官快步跑到亚佐夫身边，给他披上衣服。撑起了伞。“是时候该回去了，萨温采夫同志他们正在等您的下一步指示。”\n\n"
OMS_more_flavor.149.a: "“走吧，我们还有事要做。”"
OMS_more_flavor.150.t: "双剑合璧"
OMS_more_flavor.150.desc: "弗拉基米尔-克留奇科夫正双眼凝视着对面同样在揣摩对方的尼古拉-什韦廖夫\n\n这是一次情报局和统计局之间的交流。尽管只是一场交流，但双方老练的直觉都是意识到这是一场大事。\n\n“总司令下令要对条顿日耳曼蛮子的民事情报进行更为详细清晰的观察，我想你必定是知道的，这是一件很重要的事，你在这方面是个奇才乃联盟内人尽皆知的事”克留奇科夫首先抛出了自己的来意\n\n“哦，那当然，为了大审判的顺利进行，碾碎那帮法西斯歹徒牲畜，我怎么不会听从总司令的指挥？民事统计我当然是再熟悉不过了，联盟统计表上的每一个令人安心的数字都是我精心工作出来的成果，日耳曼条顿渣滓那干巴巴令人作呕的字符我当然也来着不拒”什韦廖夫微微笑了笑，向对面的干员表示自己的稳健。\n\n“我对这个回答我并不意外，我更想知道的是你如何看待统计局和情报局对接所产生的新产物---联盟欧洲安全局，这是联盟目前所需面对任务最大的新生机构，不知你有多少余力可出”克留奇科夫面部表情庄重的向前走了一步。\n\n什韦廖夫表情转向凝重“联盟处于备战阶段的任务很重，要做到精密计算统计需要很多时间和精力，我现在每天工作14个小时，是不是还会加班，我的能力目前是有限的。”\n\n克留奇科夫听到这样的话不经皱了皱眉头，眼神黯淡了些许，略感失望。\n\n直至什韦廖夫的下一段话出口。\n\n“但如果能有力的痛击那群撕下俄罗斯母亲血肉的混蛋的话，我会带着所有情报局干员多干1个小时，每周多加2天班。”“只要能让大审判顺利进行！”什韦廖夫站了起来，坚定的向克留奇科夫伸出了手。\n\n克留奇科夫脸上的阴云散了开来，同样站了起来，朝什韦廖夫伸出了手。\n\n两只手的交会之下，不仅是一个部门的扩大，两位干员的一份协议。\n\n"
OMS_more_flavor.150.a: "“更是联盟对复仇成功的更近一步”"
OMS_more_flavor.151.t: "推倒"
OMS_more_flavor.151.desc: "“老瓦列里，快走吧！那些黑衣服不讲道理的！你赶紧签合同吧，那几个干员给咱的不少了，你再不签。他们说了，要动用极端手段了。”\n\n“我不签，这是我的家！我家世世代代都住在这里，就连布哈林都没动了我的家，我就是要住在这，除非他们踏上我的尸体，否则我绝不离开！”\n\n“唉，你就呆着吧，我们可要走了。”\n\n老瓦列里看着几个邻居无可奈何，扭头回去的身影。关上门，嘴角露出一丝冷笑：“真是没见识，跟政府打交道，不就是得多跟他们闹，才能拿的更多吗。”\n\n他走到厨房，从柜子里掏出两瓶伏特加，咚咚的灌下肚，心里的勇气又多了一些。作为一个读过几本书的人，老瓦列里从一开始就看不起他这些邻居。在他的印象里，粗俗，没文化，盲从，就是这帮家伙一直以来的写照。布哈林还在的时候，只要苏维埃的政府一声令下，这些人说干什么就干什么，可老瓦列里不一样，他比他们有脑子，他会抗议，会争取，会在大庭广众之下跟那些苏维埃官员哭，哭着哭着，苏维埃的官员就不敢威胁他，还会乖乖的把大米白面给他送上家门。\n\n他把双腿翘在椅子上，正想再眯一会。一阵脚步声和巨大的轰鸣声传的越来越近，让老瓦列里听的烦躁不止，这些政府的狗子今天连觉都不让他睡了！\n\n他愤怒的走到窗前，想骂他们两句，一个戴眼镜的黑衣服还在跟站在铲车旁边带头的那个说话。“喂，听好了，你们别想拆我的房子，我绝不会同意的！”\n\n领头的军官笑了起来：“你们都听明白了吧，这家阻止大大审判工程，违抗政府法令，现在立刻修正这个错误，施工！”\n\n当轰隆隆的铲车向前开动的一刻，老瓦列里的酒醒了，他尖叫着想逃出去，却已经没有时间了。当铲车到他面前的一刻，他突然想到一个问题：“这群人不是喊着为了俄罗斯的人民吗？为什么现在留给他的，只有死亡？”\n\n"
OMS_more_flavor.151.a: "他带着他的疑问和他的房屋，在铲车之下一并被推倒。"
OMS_more_flavor.152.t: "友好活动"
OMS_more_flavor.152.desc: "“生动且诱人的游说，你们的表现确实出乎了我们的意料，彼得先生。”\n\n专家巴特勒端起一杯咖啡小酌了一下，微笑着看着眼前的彼得，随后又拿起了一份文件。在这几天里，美国外交关系协会开始关注起这群不远万里来到美国，挥金如土的俄罗斯人。通过fbi的情报和协会中政府官员提供的信息，他们已经明确了，这群俄罗斯人在政府内外一直在寻找各种关系，智库、专家和退役军方人员等，他们希望美国政府能够向新生的俄罗斯政府提供经济和军事支持，以对抗可能的纳粹入侵。他们在昨天成功游说了一位退休的中将在公开场合支持俄罗斯，而今天，他们找上了美国外交关系协会。\n\n“光是凭借游说，是无法说服美国政府支持你们的。”另一位专家说道：“想必您也知道，我们美利坚是一个自由国家，每个美国民众都有自己的想法和生活，你们想要美国政府支持你们对抗纳粹，但美国的民众可能认为纳粹会以此报复我们，从而拒绝向你们提供足够的支持。”\n\n“而且，在之前几年的宣传种，我们可以明确的一点是，你们以前便宣称要实现一个民主、自由的政府，你们的公文中承诺了要在俄罗斯实行自由大选。可时至今日，你们俄罗斯复兴政府一直没有实现公开的大选，这明显违反了你们的承诺。”\n\n“所以，这需要各位绅士们出面，向美国的各个阶层进行解释，告诉他们，我们俄罗斯是你们最好的朋友，也是抵抗纳粹的最前线，只有你们这些最聪明的头脑，才能保证美俄友好。”彼得不紧不慢的说道。\n\n“但我们美国完全可以不支持你们，就像几十年前一样，纳粹是无法打到我们的本土的。”\n\n“现在不一样了，先生。”彼得说道道：“根据我们政府获得的情报，纳粹德国正在试图进行一轮新的扩张，他们以号称对抗我们作为借口，在俄罗斯地区再次扩大他们的专员辖区。一旦纳粹向东扩张成功，整个北冰洋地区就将被纳粹彻底控制，这将极大威胁美国的北极和太平洋利益。”\n\n几位专家环顾了一眼，点了点头。还是巴特勒发声问道：“先生，那您希望我们付出什么样的努力呢”\n\n彼得从公务包里掏出几张支票和一份文件。“这是俄罗斯人民的一点心意，我们由衷希望美国人民能够同情且支持我们。这份则是我们游说斯坦利.霍夫曼先生的成果，他已经同意支持俄罗斯人民的正义事业。”\n\n几日之后，美国《外交事务》杂志上刊登了新一期的论文《评均势》。\n\n"
OMS_more_flavor.152.a: "捍卫俄罗斯，就是捍卫国际和平！"
OMS_more_flavor.153.t: "双面人"
OMS_more_flavor.153.desc: "古德里安施塔特，政府大楼内，尽管最边境上多了一群穿黑衣服的疯子，当地的驻屯户和防卫军都忙碌了起来，但政府内部的官员还是颇为乐观的。毕竟，一群20多年前的手下败将能翻出什么天来？\n\n“老爷，帮帮我们吧，您不知道，那群格鲁吉亚人简直是无法无天了，每周周三，他们都聚众跑到我们俄罗斯人的社区聚众闹事，打砸我们的商店，他们根本没在乎政府的法律！”一名带着眼罩，身穿破烂布衣的俄罗斯人声泪俱下的，向他身前的德意志官员控诉。\n\n“不不不，维克多先生，我必须明确的是，你们下等民族的冲突与我们无关。”那名日耳曼官员仰起头，叉起胳膊，用鼻孔对着眼前的俄罗斯人。“大日耳曼国法律已经规定了，我国对于高加索地区民族进行优待政策。他们之所以闹事，我想，一定是你们俄罗斯人做了什么错事，惹怒了这群高加索人，他们才对你们进行如此报复的。”\n\n“可，可我们毕竟是辖区的一份子啊，我们平常也向各位大人们交税，我们，我们...”那名俄罗斯人的头低的更低了，他的眼睛完全不敢看向面前的日耳曼官员，只是看着面前满是文件的办公桌，泣不成声。\n\n那名官员看着他哭哭啼啼的样子，厌烦的摆了摆手，“滚吧，连勇气都没有的下等民族，别来找我们麻烦！”\n\n维克多失魂落魄的走回社区，一群俄罗斯人很快便簇拥而来。“维克多，日耳曼老爷们援助帮我们赶走那群该死的格鲁吉亚人了吗？”\n\n“没有，他们说我们软弱，不配他们帮忙，我们只能靠自己了。”\n\n在一群俄罗斯人又惊又气的争吵之中，维克多走回了自己家。一关门，他脸上的痛苦便消失了，只剩下冰冷的坚毅。他飞速的跑到一张桌子前，掏出准备好的纸笔，按照记忆开始默写他所记下的每一个纳粹官员姓名。\n\n"
OMS_more_flavor.153.a: "煽动本地民族冲突成功，本地区政府官员名单已经准备就绪，随时可以继续行动。"
OMS_more_flavor.154.t: "恶意竞争"
OMS_more_flavor.154.desc: "“呸，一群劣等民族，没那个钱就别来竞争好吗？非要在那跟喋喋不休跟我们抢东西，搞恶意竞价。没钱就老老实实的买下等货，想跟我们抢最好的！他们没那个实力！”瓦尔特站在远洋货船上，对着身旁的好友，诉说着心中的不慢。\n\n“好点来说，货还是到手了，不是吗？”一旁的好友舒尔特对他笑了笑。“这些广东制造的数控机床可都是好东西，国内这几年一直再喊着什么技术革新，搞了那么久，都没有搞出这么高质量的东西。咱们一次来就买到了这么高质量的货，等回去了肯定能卖出个天价。”\n\n“也是，不提了，我有些累了，我要回去睡一觉了。跟那些该死的劣等民族争论简直是损害我的好心情。这一趟可还要走几个月的水路，唉你说意大利人就不能再聪明一点吗，非要征那么高的过河费用，害的咱们只能走好望角，多了那么多的费用花费。”\n\n“别想了，老兄，回去睡你的觉吧”。\n\n瓦尔特不再多话了，他慢慢走回了他的专属豪华居住间。躺在床上，开始思考他接下来的美妙生活：这些货作为高精尖生产的代表，在国内一直是有市无价，国内的大企业们肯定会出大价钱来收购，有了这笔钱，他就去委托他的叔叔，给他谋个公职，等熬上几年，他就不需要像现在一样，干什么还得自己跑腿了。\n\n就在他胡思乱想的时候，一声闷响突然从船体一侧一侧传来，然后又是一声巨响，整个船都晃动了起来。瓦尔特直接被颠到地上，匆忙爬起身，几位船员也打开舱门，找到了他。\n\n“瓦尔特先生，我们的船出现严重损坏，右侧船体已经出现严重侧翻，船要保不住了，您快跟我们一起逃吧。”\n\n“不行！那我们的货呢，这些货可是大日耳曼尼亚的宝贵财产，就这么丢掉，这是对大日耳曼尼亚的背叛，快把这些东西也带走！”\n\n几个船员直接架着瓦尔特就往出走：“对不起，先生，我们只被要求保护您的性命，那些机器过于笨重了，救生艇带不走。您再想想别的办法吧。”\n\n"
OMS_more_flavor.154.a: "得不到，就毁掉！"
OMS_more_flavor.155.t: "不情愿的就职"
OMS_more_flavor.155.desc: "洛伦茨茫然的看着眼前的几个黑衣服，他还是没有想明白，到底是怎么了，自己前几天还在里斯本的海滩上休假，在回家的路上突然眼前一黑，然后就是在一个黑漆漆的屋子里待了好几个月，在这几个月里，他所能见到的只有每天来送饭的看守，他不止一次想着大吼大叫，希望有人注意到他，可即使是把双手拍的通红，都没有一个人来看他。久而久之，洛伦茨自己都放弃了挣扎，每天不是吃就是睡，甚至他感觉自己还胖了几斤。\n\n过了也不知道多少天，终于有人来了，是几个黑衣服，他们把洛伦茨从黑屋子里带了出来，给他套上了黑头罩，接下来的路洛伦茨只能靠感觉，他感觉着自己应该是被这些黑衣服一路带着到来了一辆车上，然后是一段漫长的路，这路质量还不咋地，一路上颠簸的厉害。最后他也逐渐放弃了思考。他只知道最后等这些人掀开头罩的时候，他已经在这了。\n\n“你好，洛伦茨先生。”一个黑衣服率先打破了沉默：“我是黑色联盟520321号干员，你可能不住，叫我伊凡就好了。”\n\n洛伦茨沉寂的大脑终于开始运转起来。片刻，他带着疑问向面前的人问道：“你们...是...俄国人？”\n\n“严格来说，是俄罗斯复兴政府。”伊凡礼貌的向他说明。“洛伦茨先生，看看这个，这是您在巴黎理工学院所撰写的一份化学制剂论文，当时您还拿了奖学金？”\n\n“是的，先生，可这和现在有什么关系，你们如果要想我的研究成果，完全可以邀请我，而不是把我绑到这，然后再谈什么学术。”\n\n伊凡摆了摆手指：“这不是邀请，而是要求。洛伦茨先生，我们俄罗斯政府在前不久就诚恳的邀请您来俄罗斯任职了，可您并没有回复我们，而经过我们调查，您的论文之后就被提供给了一家纳粹公司，帮助他们进行了太多的生产活动。”远处突然传来一声枪响，而伊凡也从怀里掏出一把手枪，擦了擦：“根据俄罗斯法律，以任何形式资助纳粹的行为都可以被处决，但考虑到您的才华，我们决心再给您一次机会。”\n\n"
OMS_more_flavor.155.a: "“我答应你们，请问我能够干什么？”"
OMS_more_flavor.156.t: "更好的生活"
OMS_more_flavor.156.desc: "叶卡捷琳堡的一所军营内，信号旗部队正在紧锣密鼓的进行着一项换装活动，通过国外的专门情报传递，俄罗斯的精锐部队们拿到了美国雇佣兵公司最新式的凯夫拉防弹衣，虽然这些物品传递期间有所损耗，但在足够的贿赂和收集之后，俄罗斯的军工成功逆向出了更坚硬、也更轻便的防弹衣，为表区别，他们给这玩意起名为叶夫根尼防弹衣。\n\n...\n\n萨马拉的市区，俄罗斯的居民们正在欢天喜地的在国营商店里，领取新发下来的服装和被服，根据商店领导们所公布的消息，最近国家的民工部门在生产方面有了重大突破，他们从外国人的服装基础上获得了新的灵感，然后极大提升了生产物品的舒适度，经过领取后的人民亲身穿着，这些新衣服更合适，也比以前的衣服更没有什么毛刺。\n\n...\n\n鄂木斯克，一家美国皮鞋厂正在关上大门，工厂主理查德正在激烈的和鄂木斯克的外交部官员进行争吵。作为一个有进取心的商人，他不远万里，从美国来到俄罗斯，试图开辟这片蓝海般的市场。一开始他赌对了，他所售卖的乐福鞋在这里大卖特卖，各个国营商店都开始向他下订单。可才不到几个月，市面上就出现了大量的仿品，他亲自买了几双，这些东西的生产质量很多都跟他的差不多！他愤怒的向政府提出了抗议，可接下来的几个月没人搭理他，订单越来越少。他终于受不了了，决定关停工厂。\n\n..."
OMS_more_flavor.156.a: "所有人的日子都在变好，除了没收到钱的那一方"
OMS_more_flavor.157.t: "适应"
OMS_more_flavor.157.desc: "巴甫洛夫从宿舍的床上一跃而起，简单收拾了一下被褥，然后穿上工服，照了一下镜子。他自诩不关心政治，毕竟，无论管工厂的是谁，都离不开要科学的生产，要合理的安排流水线作业，关于这点他一直挺有自信，无论是沙龙还是那些军头来到这，都在咨询本地工人后，恭恭敬敬的来寻求他的意见，请他继续工作。巴甫洛夫自己也不傻，对谁的任务都挺认真负责，所以也没有人多为难他。\n\n虽然最近的日子是混乱了点，上午，工厂外时不时就传来枪声；下午，工厂外面又时不时有大兵跑来跑去的脚步声，搞得很多工人们有些心烦意乱，工作状况受到了影响，但好在大家经验丰富，还是保质保量完成了生产。谢天谢地，巴甫洛夫只希望外面不管是谁，能安分一点，别再影响生产了，再这么影响下去，他不想给自己多添一些麻烦了。\n\n但很不幸的是，麻烦还是找上他了。还没等巴甫洛夫开始上工，两个大兵就把他招呼到一间办公室，那是以前的领导驻厂的办公地点。里面坐着的是个黑衣服，他扫视了巴甫洛夫一眼，然后说道。\n\n“巴甫洛夫先生，上面传下来命令，咱们工厂最近需要进行全方面的制度改革，具体内容很多，需要你带领工人们认真的去学习与适应。这里是一本学习笔记，你先来看一下。”\n\n巴甫洛夫拿过一本小册子，映入眼帘的就是所谓“鄂木斯克经验”,他翻了几页，眉头越皱越紧，等到看了几页之后，他不由得担心的问道：“领导，这样真的合适吗？”\n\n“怎么不合适了？”\n\n“您看，这份所谓的经验里要求全面工人近乎全天候的施工，可咱们厂现在工人们都要连轴转十多个小时以上，他们的精神每天都疲惫到了极点，这还是咱们厂工作条件较好，能够及时发下工资的情况，再加大工作时长，我担心工人们的休息会严重恶化。”\n\n那位领导不耐烦的挥了挥手：“话是这么说，但你要知道，国家马上就要面临的是一场史无前例的战争，纳粹马上就要打过来了，如果工人们连这点困难都克服不了，那可是要做德国人的奴隶了。”\n\n“那至少应该给厂里的工作环境改善一下，有了更好的条件，工人们至少能在工作之余进行一下休息，有了好的休息，才能更高效的去生产。”\n\n“巴甫洛夫同志，你的思想很危险。”面前的领导直愣愣的蹬着他。“关于你这种思想，总部那边有专门的总结：唯生产力论！这种修正主义思想只顾着进行生产力上的完善，却不肯发挥工人们的积极性！我看啊，你们厂的生产力上不去，就是因为缺少了思想上的进步和学习，只顾着改善各种条件，却不肯为国多多生产，你们懈怠太久了，需要我们来纠正你们！”\n\n巴甫洛夫心里闪过了千言万语，他想该说点什么，又说不出口。想到自己的家里的妻子，和嗷嗷待哺的两个孩子。他最终低下了头。\n\n"
OMS_more_flavor.157.a: "是，长官！"
OMS_more_flavor.158.t: "全线开工"
OMS_more_flavor.158.desc: "“西伯利亚的资源正为大审判提供着宝贵的资金，联盟的军队将继续朝着更为现代且精锐的目标大步迈进！”弗拉基米尔-斯塔罗夫斯基正向大审判的总司令宣读着自己的豪言壮语。\n\n“不错，你为大审判确实做出了不小的贡献，这个贡献我不能简单的去概括。但我想你对你自己应该有个清晰的整理。”亚佐夫双眼对斯塔罗夫斯基投出了庄重且严肃的目光。“具体有多少亿美金的收入？大审判所需的资金远远比我们想象的要多。”\n\n“总司令，我身联盟的外贸统计局局长为对资金的收入当然有明确的整理，这个数字是1.999B美金，我想不仅能对大审判进行有力的推动，甚至有余钱可以去改善干员们的生活条件，比如购买一些...”\n\n“停下！立刻终止你的错误判断和享乐主义！”亚佐夫的脸逐渐暗淡了下去，在购买一词入耳的时候转为愠怒。“大审判需要的资金容不得你去这么挥霍！”\n\n斯塔罗夫斯基先是被惊吓了一下，在经过了心理博弈过后，他还是颤颤巍巍将话说出口了“总司令，我想现在干员们都处于压抑之下，该稍微放宽..”\n\n亚佐夫愤怒的将他赶了出去。\n\n"
OMS_more_flavor.158.a: "后来，没有人再看到过他。"
OMS_more_flavor.159.t: "“挫骨扬灰”"
OMS_more_flavor.159.desc: "格里戈里是科斯特罗马市的一名警察局副局长。按理来说，在黑色联盟这样的国家里，这个职位可以说是风光无两，然而现在，却有两位不速之客闯进了他的办公室，并且直接拿出手枪抵住了他的额头。\n\n格里戈里的冷汗一下子冒了出来，在那一瞬间，他的内心闪过了许多念头:“警卫在干什么？他们在吃干饭吗？难道我的事败露了？”可顾不得他多想，那人已经将手扣在了扳机上:“我问，你答，多一句话我就现在把你毙了。你和德国人肮脏交易的下次接头地点在哪里？接头暗号和通讯方式是什么？”\n\n他瞬间大脑一片空白，下意识问道:“你们怎么——”\n\n“别他妈在这废话!”\n\n“好，好，我，我说，我和他们约定在亚拉希酒店，就在两周后晚上十一点整，他们通过合作者与我单向接头，我不知道合作者的具体身份。但是不要杀我，我可以给联盟套取情报——”\n\n枪声响起，话语遂熄。\n\n高鼻梁的特务拿起对讲机，对着对面的人汇报道:“我们在德国的特工传回来的情报属实，科斯特罗马市科斯特罗姆斯科伊区警察局副局长格里戈里· 弗拉基米罗维奇·斯米尔诺夫与德国畜生勾结，出卖俄罗斯情报的罪行已核实完毕。罪犯已就地枪决，请求指示，对于他的家人如何处理？”\n\n“干员602319，干员8039642，你们做的很好，其家人处理方法按照对待一般叛国者一样，”他停顿了一下，随后说到:\n\n"
OMS_more_flavor.159.a: "“秘密处决。”"
OMS_more_flavor.160.t: "演习"
OMS_more_flavor.160.desc: "塔季扬娜自信的看了一眼身边的同僚们，然后把注意力转回复盘中的演习现场。这次演习是总司令在批准新一批军费之后，所提出的新的军事要求之一。上面发下来的通告告诉所有人，为了让俄罗斯军队能够适应在更复杂的环境下进行更长时间的作战，军方给予了参演部队更高的装备标准，但也需要适应更加复杂的战场条件，为了让让部队更快适应作战的需要，军方开始了这次大规模演习。\n\n首先就是塔季扬娜那边，她身前的步话机首先响了：“长官，我部队在行军途中发现核辐射区域，防化部队正在进行及时应对，请下进一步指示。”\n\n“快速通过辐射区域，各部队请及时保持联络，你们必须在预定计划内到达指定区域，修筑工事进行及时反击。”塔季扬娜将命令下发给每一位指战员，前线充足的通讯装置又让塔季扬娜的命令从中层军官口中又传到了基层士官，她的部队在充足准备后，十分钟内就迅速通过了核辐射区，虽然演习指挥部还是报废了她两成的重火力装备，但她的部队还是在通过之后，迅速击溃了来袭的一支游击部队，在指定地点建造起了阵地。\n\n换到其他部队，可就没有那么好运了。有些演习部队部队数量比塔季扬娜的部队多了一倍，却因为消息上报不及时，被演习指挥部直接宣布报销了一半以上，有些部队更是被宣布退场，一支著名的英雄部队指挥部在通过之后被游击队提前端掉...至于重火力装备的损耗，已经不计其数了。\n\n如果说这还是第一道开胃菜，那接下来的演习内容可谓难上加难，在塔季扬娜的部队到达之后，她的部队首先开始与数倍于己的敌方部队交战，飞机，重炮，乃至化学武器轮番上阵，但由于良好的战场通讯构建，塔季扬娜部通过无间断的火炮支援击退了敌方部队，并且通过演戏前增添的电子监听部队，他们收到了所谓支援部队实际上是一支叛国军的情报，在这支部队到达之前，就迅速对其进行了炮击，消灭了这支叛国者。\n\n...\n\n复盘的结果很快就被整理为文字，通过军报向俄罗斯的每一支部队传达下去。而亚佐夫在看完整个复盘后，兴致勃勃的作出了批示：\n\n"
OMS_more_flavor.160.a: "我们需要更多像这样的演习。"
OMS_more_flavor.161.t: "变色龙项目"
OMS_more_flavor.161.desc: "计划资金：充足\n\n当前预算下的资金足以进行相关项目建设，且大部分必要采购物品可在地下线路规划以及工厂防空等项目进行过程中一并进行，如需继续扩大项目规模，请向国家发展部及时提出申请。\n\n计划项目：增添中\n\n包括并不限于：各地区主要工厂防空武器配置，工厂内部防护单元隔墙，设计标准将对标大型防空炸弹；内部通道设计必备清洁区，染毒区以及相关密闭隔墙，如施工完毕，可在特定地点投放化学制剂进行防护测试。...\n\n施工测试结果：良好\n\n虽然我国暂无足够的卫星设备进行太空观测，但通过多轮无规律飞机航拍测试，可得出结论：试运行的众地堡已具备强大防空反侦察能力，除非间谍机飞行高度降至极低，且使用超高密度侦察器具才能有所发现。\n\n情报部门补充：近些年来纳粹研究所提出过一种钻地炸弹研发，可能对我地下设备造成极大打击，望设计部门针对于此进行深度加固处理。\n\n...\n\n综上，变色龙项目已准备就绪，随时可以动工。\n\n"
OMS_more_flavor.161.a: "批准。"
OMS_more_flavor.162.t: "重燃"
OMS_more_flavor.162.desc: "我应该干点什么？\n\n每当被问到这个问题，什捷缅科要么沉默不语，要么顾左右而言它，这个问题对他来说实在是太难回答了，就像没有人能够精准的预言俄罗斯大地未来的方向一样。一个又一个的转折接二连三的发生在什捷缅科将近50多岁的人生中，把他从一个勇往直前的愣头青，变成了一个沉默不语的旁观者。\n\n在卫国战争爆发之前，他是中西伯利亚地区一位普通的工人，从高中毕业后便进入了飞机制造厂，在那里跟着拉沃契金这样的优秀设计师学手艺。大战爆发后，什捷缅科入了党，参了军，他自信的觉得通过努力的生产，就能打垮纳粹侵略者。可布哈林苏联的崩溃直接给了他当头一棒。一开始他还想着去秋明找苏联政府，可是本地的沙龙和工厂主们突然就宣布这里不需要苏联了，他是光荣的中西伯利亚共和国公民，本来什捷缅科还是能接受的，可当这些文人要求他向他的前战友们开枪的时候，什捷缅科终于无法接受，退隐回家了。\n\n十几年过去了，什捷缅科见证了沧海桑田，俄罗斯人为了不同的各种主义乱七八糟的杀来杀去，有的人甚至都不愿意去招惹德国人了，任凭祖国的土地被占据。对此，什捷缅科也没啥好说的，别看见德国人就投降就行。\n\n终于，俄罗斯统一了，统一俄罗斯的是一帮穿黑衣服的军人，这些人在这里搞了几个月的人口审查之后，找到了什捷缅科，那个带头的军官跟他喝了一晚上的酒，跟他大谈自己跟着部队向西作战试图光复祖国，却被内部的叛徒出卖而被纳粹击溃。为了向德国人复仇，他追随了卡尔贝舍夫司令和亚佐夫总司令，他们两个都是为了祖国能够向纳粹复仇而竭尽全力的真正伟人。那一夜之后，什捷缅科重新回到了设计局，担任高级技工。\n\n“数据再标的准一点，这里的焊接不能有一点差错，这样会让我们的飞机出现问题的。”什捷缅科站在一位工人身旁，用温和的语气指导着他。他现在明白了，从一开始，他就没有放弃过一个执念，一个消灭纳粹侵略者，为自己和祖国争口气的机会。\n\n"
OMS_more_flavor.162.a: "一颗复仇之心再度被点燃。"
OMS_more_flavor.163.t: "各抒己见"
OMS_more_flavor.163.desc: "“...唉，小伙子，别去那边，那边是救赎旅工作的地方，那就是一群祖国的垃圾，他们干的活都是最重，最要命的，你去那边找他们，可要吃苦头的。”\n\n“谢谢你，大叔，您也是志愿来这里建设祖国电网的吗？”\n\n“我？我可不是，我只是祖国的炮灰，祖国需要我的时候我要出来工作，要是这次工作我能够侥幸活下来，以后应该能混个正规军当当？”\n\n“大叔，联盟的正规军待遇很不错吗？”\n\n“（环顾左右，压低声音）待遇比那些救赎旅的垃圾好一点，但不多，主要是一般人以后就不敢惹你了，谁要是惹了你，他就得吃子弹。”\n\n“那大叔你是怎么进来这里工作的？”\n\n“我没得罪联盟，我得罪的是联盟的前政权，我被抓进监狱，还是联盟的人把我放了出来，但人家也说了，我这样的人对俄罗斯有罪，我还是需要为俄罗斯赎罪的。”\n\n“您不是个好人吗？有什么罪要赎呢”\n\n“唉，监工不在，我跟你明说了吧，我就是怕死。这些联盟的黑衣服每天都在那讲要为了祖国奉献出一切，但这个奉献很多时候都是要你的命，去挖矿挖到死，加班干到死等等。可我不想死，我只想赚点钱娶个老婆，每天能买得起两瓶伏特加就行。”\n\n“您不怕我举报您吗？”\n\n“你想的话就去吧，你是个好小伙子，有自己的良心，你这么年轻，千万别跟我们这种垃圾一样就这么烂在工地里。你应该去那些大城市，祖国的未来需要你们来建设。”\n\n“不了，大叔，这毕竟建设的是我的家，等有了电，我们的人民未来的生活会更好过一些，不至于永远灰头土脸下去”\n\n"
OMS_more_flavor.163.a: "可我们还有几个未来？"
OMS_more_flavor.164.t: "27号工地·其一"
OMS_more_flavor.164.desc: "哪怕过去数年，任由风沙侵蚀，这里的一切也少有改变。\n\n风卷着沙粒撞在装甲车防弹玻璃上，发出细碎的爆裂声。康斯坦丁上校透过望远镜观察地平线上的轮廓——坍塌的围墙后，几座混凝土建筑歪斜地矗立着，大部分塔楼的玻璃全部破碎。\n\n"辐射值？"上校的声音被防毒面具滤得沉闷。\n\n技术官伊万诺维奇敲击仪表盘："0.18毫西弗，上校。比预计低。"仪表玻璃反射着阳光，在他脸上投下蛛网状的光斑。\n\n康斯坦丁点点头，迈步向前。靴底碾过碎玻璃和锈蚀的螺栓，发出细碎的声响。向导阿利姆跟在他身后，目光警惕地扫过每一处阴影，他父亲曾是这里的工程师。\n\n主楼的大门早已锈死，士兵们用液压钳强行破开。尘埃在阳光下浮动，照亮了空荡的走廊。地板上散落着发黄的文件，康斯坦丁弯腰拾起一张——实验日志，日期停留在1969年，最后一行写着："反应堆冷却系统故障，紧急停机。"\n\n"看来是场事故。"维克多踢开一块松动的墙皮，"不过兴许还能有什么发现。"\n\n他们继续深入，穿过废弃的实验室。设备早已断电，控制台上落满灰尘，仪表盘的玻璃碎裂，指针永远定格在某个时刻。阿利姆站在一扇铁门前，犹豫着没有进去。\n\n"这里就是地下二层。"他低声说，"我父亲说······他们在这里测试过某种新型反应堆。"\n\n康斯坦丁推开铁门，手电光扫过黑暗。房间中央是一座巨大的圆柱形装置，外壳上布满铆钉和焊接痕迹，周围散落着铅制防护服和检测仪器。万幸的是，没有异常辐射，有的只是岁月侵蚀的痕迹。\n\n"废弃的实验设备。"康斯坦丁走近，指尖擦过金属表面，冰冷的触感好似那西伯利亚的冻土。\n\n"上校！"维克多在角落发现到一台老式终端机，屏幕早已熄灭，但旁边的抽屉里塞着一叠文件。康斯坦丁翻开最上面的一份——《27号工程最终报告》，封面上盖着"绝密"印章。\n\n他快速浏览了几页，眉头渐渐舒展。\n\n"反应堆实验失败后，这里就被封存了。"他合上文件，"没有异常，菲京那家伙起码没有把事情弄得那么糟。"\n\n"所以······我们接下来做什么？"维克多问。\n\n康斯坦丁环顾四周，目光扫过斑驳的墙壁、锈蚀的管道、沉寂的机器。\n\n"重建。"他简短地说，"黑色联盟需要这座基地。"\n\n走出主楼时，夕阳正沉入地平线，将荒原染成暗红色。康斯坦丁站在台阶上，望着远处绵延的戈壁，似乎是想到了什么······\n\n"明天开始清理工作。"他下令。\n\n"
OMS_more_flavor.164.a: ""这里会有新的主人。""
OMS_more_flavor.165.t: "暮色已至——总司令亲启"
OMS_more_flavor.165.desc: "致：亚佐夫总司令\n发件人：舍甫琴科重建委员会，康斯坦丁·安东诺维奇上校\n \n总司令同志：\n经实地勘察， 27号工地内部实验设施主体结构保存完好，地下二层反应堆舱及附属设备未受严重损毁。尽管表层建筑存在风化剥蚀，但核心实验区域（包括主反应堆容器、冷却系统及控制终端）仍具备基础功能恢复的可能性。辐射水平总体稳定在安全阈值内，无污染扩散风险。建议优先修复电力供应及通风系统，以便后续深度评估。\n该设施曾承担哈萨克斯坦核反应堆原型机测试和核武器测试，虽均为获得未成功，但其设计理念至今仍具参考价值。现场遗留的技术文件（包括《27号工程最终报告》）表明，该项目在事故前已取得阶段性突破，若能解析其数据，或可为黑色联盟核武器计划提供关键技术节点。此外，完备的地下掩体结构稍加改造即可作为战略储备基地使用。\n根据实地勘探，建议重建项目分三阶段逐步推进：基础加固与环境净化；关键设备修复与数据回收； 现代化改造与功能拓展。需增派核工程专家小组入驻，重点破解反应堆安全冗余设计。根据随行专家预测，仅需三个月便可让大部分设施在安全情况下重新启用并投入研发，六个月内可让所有设施完全修复。此外，重启这些设施将节省新建基地的70%成本，更能为黑色在中亚的核武布局及黑色联盟的核武研发进度提供支点。\n考虑到416工程的试验场在塞米巴拉金斯克，舍甫琴科堡还需额外建立起一套完整的的交通设施，用于向塞米巴拉金斯克试验场运输核武器和重型设备。\n按照总命令GL-0014的要求，所有涉及此次勘探行动的非黑色联盟成员均已处决。\n大审判终将降临。"
OMS_more_flavor.165.a: "签名，康斯坦丁·安东诺维奇上校。"
OMS_more_flavor.166.t: "27号工地·其二"
OMS_more_flavor.166.desc: "黎明前的舍甫琴科堡笼罩在一层铁灰色的薄雾中。高耸的冷却塔轮廓在晨光中若隐若现，新焊接的钢架反射着冷冽的微光。工人们拖着疲惫的步伐穿过检查站，靴子踩在尚未干透的水泥地上，留下一串串模糊的脚印。\n\n"听说B区的反应堆下周就要试运行了。"伊戈尔压低声音，用肩膀撞了撞身旁的瓦西里。\n\n瓦西里没有立即回答。他的目光扫过不远处持枪巡逻的黑色联盟士兵，那些戴着防毒面具的身影在雾气中如同没有面孔的幽灵。直到士兵的脚步声远去，他才从口袋里摸出半截皱巴巴的香烟。\n\n"试运行？"他冷笑一声，用身体挡住风口点燃香烟，"上个月他们说D区安全系统已经调试完毕，结果三天后抬出去四个人。"\n\n伊戈尔下意识摸了摸自己左臂上的辐射徽章——每个工人进入核心区前都会被强制佩戴这个小小的黑色装置。\n\n雾气中传来机械运转的低沉嗡鸣。基地东侧，工人们排着队领取早餐——硬得像石头的黑面包和一碗飘着几片菜叶的稀汤。食堂的墙上贴着崭新的宣传海报，上面印着黑色联盟的双头鹰徽和一行鲜红的大字："为祖国的美好未来奉献力量！"\n\n"我女儿上周来信了。"老焊工谢尔盖突然开口，粗糙的手指摩挲着藏在工作服内袋的照片，"她说黑色联盟给家属发了勋章...说我们是在进行光荣的劳动。"\n\n餐桌上一片沉默。安德烈，一位不到二十岁的电工学徒，盯着汤碗里自己扭曲的倒影。三个月前他被征召时，宣传车在他家乡的广场上贴着一张张关于舍甫琴科堡的照片——镜头里阳光明媚，而工人们笑着向家人挥手告别。\n\n"至少..."伊戈尔打破沉默，"至少我们每个月能往家里寄钱。"\n\n一声刺耳的哨响打断了对话。士兵们开始催促工人列队，防毒面具后的声音经过电子处理，变成没有感情的机械音："A区三组，立即前往A区走廊。重复，立即前往A区走廊。"\n\n他们来到刚刚铺设好的A区走廊，头顶的LED灯管发出刺眼的蓝光。走廊两侧的监控摄像头随着他们的移动缓缓转动。面向A区的门是新装的，厚重的铅板上印着醒目的黑色联盟标志。\n\n"接线检查。"工头递给他们每人一份图纸，上面密密麻麻的线路图让安德烈看得头晕，"午饭前必须完成。"\n\n当他们蹲在控制台后方接线时，瓦西里突然抓住安德烈的手腕。年轻人的手臂上，辐射徽章边缘隐约泛起一丝不正常的蓝色。\n\n"别看。"瓦西里用只有他们能听见的声音说，"也别告诉任何人。"\n\n窗外，第一缕阳光终于穿透雾气，照在基地中央那座被修复的反应堆外壳上。崭新的金属表面闪闪发光，倒像一具刚刚打磨好的棺材。更远处，一队新到的工人正从运输车上下来，他们茫然地环顾四周，像极了三个月前的安德烈。\n\n午饭哨声再次响起时，没有人再提起家人的来信。他们沉默地咀嚼着食物，听着广播里循环播放的联盟宣言："...在亚佐夫的指引下···”\n\n"
OMS_more_flavor.166.a: "“···舍甫琴科堡将成为俄罗斯民族复兴的核能灯塔...""
OMS_more_flavor.167.t: "子夜临近——总司令亲启"
OMS_more_flavor.167.desc: "致：亚佐夫总司令\n发件人：舍甫琴科重建委员会，康斯坦丁·安东诺维奇上校\n \n\n总司令同志：\n\n截至本月，舍甫琴科堡甫琴科堡军事核设施重建工程已顺利完成第一阶段任务，主体设施已恢复85%运行能力。A区反应堆完成重建，但先前设计被证明无法让反应堆有效运行。主控系统完成重建，反应堆厂房完成结构性加固，主控室设备更新工作正在有序推进。全体工程人员在军事管制下保持高效作业，确保了这一战略要地的快速复苏。塞米巴拉金斯克试验场及核研究所所需数据业已整理完毕，三日后将会悉数送达。\n\n工程进展过程中仍面临若干技术性难题。试验场区的辐射屏蔽系统需要专业团队进行最后调试，反应堆将会被重新设计。考虑到该设施在黑色联盟核威慑体系中的特殊地位，当前技术力量的不足可能影响后续战略部署。建议立即从核研究院抽调资深专家组成特别工作组，同时增派经过严格审查的技术工程兵部队参与关键环节施工。\n\n考虑到施工人员将会对黑色联盟机密构成严重泄露隐患。根据总命令GL-0014的要求,申请在舍甫琴科堡重建工程完工后，将所有工人群体以"光荣牺牲"为名分批处决。此举既可消除泄密隐患，又能为后续敏感实验创造纯净环境。\n\n恳请总司令批准特别行动权限。\n\n大审判终将降临。"
OMS_more_flavor.167.a: "签名，康斯坦丁·安东诺维奇上校。"
OMS_more_flavor.168.t: "27号工地·其三"
OMS_more_flavor.168.desc: "寒风卷着细雪掠过舍甫琴科堡新铺设的广场，混凝土建筑在铅灰色的天空下泛着冷光。瓦西里站在队列中，望着那座他们亲手重建的核设施——巨大的反应堆外壳被擦得锃亮，通风塔喷出的白色蒸汽在寒风中扭曲消散。不过半年，他们在这片荒芜之地挥洒汗水，用奇迹让废墟再度变为钢铁堡垒。\n\n"所有人，到大礼堂集合！"军官的声音通过扩音器传来，冰冷而机械，"竣工仪式即将开始。"\n\n工人们拖着疲惫的步伐走向中央建筑，靴子踩在薄雪上发出细碎的声响。瓦西里注意到，今天的守卫比往常多了一倍，士兵们全副武装，防毒面具后的目光如机械般冰冷。礼堂大门敞开，里面灯火通明，长桌上甚至摆着伏特加和黑面包——这在平时是难得的奢侈。\n\n"终于要回家了..."年轻的电工米哈伊尔低声说，眼睛里闪烁着期待。\n\n瓦西里没有回答。他的目光扫过礼堂四周——每个出口都站着持枪的士兵，二楼走廊上，狙击手的轮廓隐约可见。他的胃部突然绞紧，一种熟悉的恐惧爬上脊背——就像三年前他第一次踏入这片废土时的感觉。\n\n军官站在讲台上，面无表情地宣读着一份文件："...感谢各位为黑色联盟伟大事业做出的贡献..."\n\n"什么意思？"一个粗犷的声音突然打断了他。老焊工格里高利推开人群上前，胡子上的冰碴随着他激动的呼吸抖动，"我们的家人呢？承诺的奖金呢？"\n\n礼堂陷入死寂。士兵们的枪口微微抬起。\n\n军官继续念道："...所有参与舍甫琴科堡重建项目的工人将获得...特殊安置..."\n\n"骗子！"米哈伊尔突然尖叫起来，他的声音在空旷的礼堂里回荡，"你们根本没打算让我们离开！"\n\n瓦西里的眼前突然闪过无数片段——初到时荒废的塔楼、冻僵的手指拧紧螺栓的疼痛、深夜偷偷写给女儿却永远无法寄出的信...还有那些消失的工友，那些被士兵拖走后就再没回来的人。\n\n"跟他们拼了！"格里高利怒吼着抄起一个酒瓶。\n\n枪声几乎在同一时刻响起。\n\n瓦西里感到一阵剧痛，他低头看见自己胸前的血花。在倒下的瞬间，他看到了他的朋友：安德烈、伊戈尔、谢尔盖······他们的眼神逐渐空洞，最后失去光彩。他仿佛又看到了女儿的笑容——那个他离家时才五岁的小女孩，现在应该已经会写字母了吧？\n\n最后一颗子弹贯穿他的太阳穴时，瓦西里恍惚听见军官冷漠的声音："处理干净，明天我不想再见到他们。"\n\n"
OMS_more_flavor.168.a: "还有那窸窸窣窣、不绝于耳的枪声······"
OMS_more_flavor.169.t: "子夜钟鸣——总司令亲启"
OMS_more_flavor.169.desc: "致：亚佐夫总司令\n发件人：舍甫琴科重建委员会，康斯坦丁·安东诺维奇上校\n \n\n总司令同志：\n\n舍甫琴科堡战略核设施重建工程已按计划圆满完成，所有系统均恢复至最佳运作状态。反应堆设及其控制设施施经过全面调试，现已正式投入使用，完全符合黑色联盟战略威慑需求。参与工程建设的全体人员已依照最高保密条例执行最终处置程序，确保项目细节不会外泄。整个过程中未出现任何意外情况，所有环节都按照既定方案平稳推进。\n\n考虑到该项目的极端敏感性，建议对部分可能接触敏感信息的工人亲属实施预防性处置。这些家庭虽未经正式调查，但根据相关部初步评估，存在潜在的泄密风险。为彻底消除隐患，依据总命令GL-0014的要求，现申请授权直接执行特别行动，无需经过常规审查程序。这将最大限度保障舍甫琴科堡的战略安全性，确保黑色联盟核心利益不受威胁。\n\n恳请总司令批准特别行动权限。\n\n大审判终将降临。\n\n"
OMS_more_flavor.169.a: "签名，康斯坦丁·安东诺维奇上校。"
OMS_more_flavor.170.t: "27号工地·其四"
OMS_more_flavor.170.desc: "瓦西里的女儿阿廖娜踮着脚尖，将最后一只千纸鹤挂在了窗前的绳子上。这是她为父亲准备的近两百只——每只纸鹤的翅膀里都藏着一句话，等爸爸回来，她要一只一只拆给他听。\n\n"妈妈，爸爸的信到了吗？"阿廖娜转头问道，蓝眼睛里跳动着炉火的光。\n\n玛丽娜停下揉面的手，在围裙上擦了擦面粉。"快了，"她微笑着说，声音却像绷紧的弦，"上次来信说工程快结束了。"\n\n玛丽娜每天都会在邮差经过时放下手中的活计，半年来从未错过一次。村里其他参与"国家特殊工程"的家庭也都如此——他们共享着那些盖着黑色鹰徽印章的薄信，在这些实则几乎一样的潦草字迹里试图看出些只言片语。\n\n直至今天这个清晨，邮差的铃铛声比往常急促。\n\n玛丽娜接过那封烫金边的信封时，手指突然不听使唤。信封太厚了，厚得不像“瓦西里”平时节省纸张写成的家书。她兴奋地扯开火漆印章，一张照片滑落出来——瓦西里穿着她从没见过的军礼服，胸前勋章闪着诡异的光。\n\n公文纸上"烈士"、"光荣牺牲"等词汇像刀片般刺入眼睛，玛丽娜的声音突然碎裂。炉子上的茶壶发出尖锐的啸叫，好似半年前瓦西里离家时，火车拉响的汽笛。\n\n阿廖娜还不明白"牺牲"是什么意思，但她看见母亲的眼泪砸在父亲的照片上，将那枚勋章晕染成模糊的金色水洼。\n\n深夜，玛丽娜仍久久不能入睡，回忆起与瓦西里的点点滴滴。两人从最初相遇时的懵懂悸动，到后来有了一个女儿——生活是那般甜蜜美好，纵然外面的世界在熊熊燃烧，但二人的精心呵护也让这个小小的家庭不受灾害。再后来，瓦西里被征召去参与一项秘密工程······\n\n突然，整栋楼的灯光同时熄灭，门外传来发动机的轰鸣。玛丽娜扑到窗前，看见两辆黑色轿车碾过她精心打理的菜园。穿制服的人影正在核对门牌号，似乎正在寻找某处人家。\n\n阿廖娜被惊醒时，玛丽娜抱着她和她的饼干盒来到了地下室中。\n\n"妈妈，他们是谁？"阿廖娜抱着千纸鹤问道。枪栓上膛的声音从门外传来时，玛丽娜将纸鹤塞进女儿的内衣口袋，最后一次亲吻她的额头："阿廖娜，记住，你爸爸建过世界上最坚固的房子..."\n\n一声枪声响起，随后是另一发，接一发······\n\n当轿车驶离燃烧的农舍时，一只千纸鹤从车窗飘出，被热浪托着飞向星空。纸上稚嫩的铅笔字渐渐被火苗吞噬：\n\n"
OMS_more_flavor.170.a: ""爸爸，回家了...""
OMS_more_flavor.171.t: "寂灭中亚——总司令亲启"
OMS_more_flavor.171.desc: "致：亚佐夫总司令\n发件人：内卫部，尤里·德罗兹多夫部长\n \n\n总司令同志：\n\n石油危机和突厥人大会过后，中亚地区当前正处于前所未有的权力真空状态，各地方政府机构几近瘫痪，民间不满情绪持续发酵，整个区域已站在全面暴乱的边缘。我们在当地的情报网络证实，多个关键城市相继爆发反政府示威，原有秩序维持力量已丧失对局势的控制能力。这种混乱局面恰恰为联盟实施战略扩张提供了绝佳契机——中亚丰富的能源储备与关键的地理位置，将极大增强黑色联盟对欧亚大陆的掌控力。考虑到其他诸国目前无暇顾忌，此刻正是我们挥师南下、一举掌控这条欧亚大动脉的黄金窗口期。\n\n为确保战后中亚地区的长期稳定，建议在军事行动结束后立即启动"净化黎明"计划，对战略节点城市（见加密附件1）实施必要的“人口结构调整”。历史教训表明，这些地区历来是反抗势力滋生的温床，唯有通过果断的特殊处置手段，才能从根本上铲除不安定因素。申请授予前线指挥官全权处置权限，允许其根据实际情况对特定人群实施非公开管理措施，无需经过繁琐的司法程序。这将有效震慑潜在反对力量，为后续建立永久性军事管制奠定基础。\n\n恳请总司令批准特别行动权限。\n\n大审判终将降临。\n\n"
OMS_more_flavor.171.a: "尤里·德罗兹多夫部长"
OMS_more_flavor.172.t: "一份礼物"
OMS_more_flavor.172.desc: "清晨的薄雾笼罩着巴甫洛达尔市中心，那座"俄哈友谊"纪念碑的青铜雕像在雾气中若隐若现。雕像基座上的弹痕像丑陋的疮疤，上面残存的字迹又被泼溅的泥浆遮盖。萨沙用冻得发红的手指摸了摸口袋里皱巴巴的传单，上面印着"面包与工作"的油墨字迹已经晕开。\n\n"他们不敢开枪的。"走在前面的老伊万嘟囔着，羊皮帽下露出几绺灰白头发，"我们只是要口饭吃。"\n\n人群像浑浊的河水般涌向市政厅广场。萨沙看见抱着婴儿的妇女、拄着拐杖的老兵、穿着褪色工装的工人——他们脸上都带着同样的麻木与愤怒。上周前，黑色联盟的坦克碾过结冰的额尔齐斯河时，广播里说这是"解放"，可粮店里的面包价格却翻了三倍。\n\n"骗子！"一个戴红围巾的年轻女孩突然高喊，她跳上喷泉残破的边缘，水早已干涸，池底积着发黑的雪，"我父亲在机床厂干了四十年，现在连退休金都——"\n\n扩音器的尖啸打断了她的声音。市政厅阳台上出现几个黑色制服的身影，防毒面具的镜片在晨光中反着冷光。\n\n"请不要扰乱社会秩序···"机械化的声音在广场上回荡，"立即解散，否则将采取必要措施。"\n\n人群骚动起来。萨沙听见身后有人啐了一口："必要措施？就像上个月在工人宿舍区那样？他娘的你们就是这么对待同胞的？！" \n\n老伊万突然举起一块硬得像石头的黑面包："这就是你们给人民的礼物？"他的冷笑在寒风中颤抖，"1912年的沙皇都比你们仁慈！"\n\n第一声枪响时，萨沙还以为是谁在放鞭炮。直到老伊万的羊皮帽飞出去，露出半个血肉模糊的头颅，他才意识到那不是玩笑。广场瞬间沸腾，尖叫与咒骂声中，更多枪声从四面八方响起。\n\n"趴下！"红围巾女孩拽着萨沙滚进干涸的喷泉池。子弹打在青铜雕像上，迸出刺眼的火花。萨沙看见那个喊话的军官正用戴着皮手套的手比划着什么，就像在指挥一场交响乐演出。\n\n喷泉池另一侧，一个穿工装的男人突然站起来高举双手："我们只是要——"\n\n三发子弹同时击中他的胸膛。男人倒下时，怀里的照片飘到萨沙面前——是机床厂的老合影，背景里"西伯利亚计划"的残缺标语还清晰可见。\n\n当装甲车的轰鸣压过哭喊时，萨沙发现自己在笑。多么讽刺啊，这座城市见证过两族的友谊，如今这份友谊又化作这铅弹与鲜血。红围巾女孩死死抓着他的胳膊，指甲陷进肉里："哈萨克斯坦···"\n\n她的后半句话被爆炸声吞没。而这一情景，正在巴甫洛达尔的每一条大街小巷重演，而他们的同胞对即将到来的暴行仍全然未知。\n\n而在两百公里外的军事基地里，黑色联盟的军官正在地图上画红圈：\n\n"
OMS_more_flavor.172.a: ""下一个是阿克莫拉，南部地区还有很多地方的治安需要维护··· ""
OMS_more_flavor.173.t: "迎接阿克莫拉的···"
OMS_more_flavor.173.desc: "傍晚夕阳的余晖无力地洒在老巴扎的鹅卵石路面上，为这座古老的集市镀上一层金色的光晕。安东·伊万诺维奇拎着磨损的皮质公文包，在谢尔盖大叔的水果摊前停下脚步。空气中飘散着熟透水果的甜香，混合着附近香料摊飘来的肉桂气息。\n\n"老伙计，给我挑几个最甜的苹果。"安东笑着摘下帽子，露出有些斑白的鬓角，"今天可是个特别的日子。"\n\n谢尔盖大叔从木箱后抬起头，花白的胡子随着笑容抖动："啊，安东！我就知道你今天会来。"老人粗糙的手指熟练地在一排苹果间游走，"小伊万今天过生日对吧？六岁了？时间可过得真快啊，我刚见到这可爱的小家伙时，他还没有柜子高嘞···"谢尔盖将手放在那排箱子上，试图比划出小伊万原来的身高。\n\n"是啊，这孩子，转眼就得上学了。"安东的目光柔和下来，看着老人精心挑选水果的样子，"娜塔莎烤了他最爱的蜂蜜蛋糕，我答应下班就回去帮忙装饰。"\n\n摊主将三个红润饱满的苹果装进纸袋，又往里塞了几颗金黄的杏子："这些杏子甜得很，就当是我给小家伙的礼物。"他压低声音，"昨天刚到的货，没经过配给站，新鲜着呢。"\n\n安东感激地点点头，从公文包里小心翼翼地取出一个小盒子："我给他买了这个，是辆小火车模型，和我开的那辆货运机车一模一样。小家伙每次看我出车都眼巴巴的···"\n\n"他准要乐疯了！"谢尔盖大叔眼睛眯成一条缝，"我孙子阿列克谢总念叨着要和他一起玩。上次他们在公园···"\n\n老人的话突然凝固在空气中。安东感到一阵温热的液体溅在脸上，他茫然地看着谢尔盖大叔胸前的衣服迅速被染红。那个装满水果的纸袋从老人手中滑落，苹果滚落在鹅卵石上，发出沉闷的声响。\n\n时间仿佛在这一刻变得异常缓慢。安东看见谢尔盖大叔的嘴唇还在蠕动，却发不出声音；看见隔壁香料摊的大婶惊愕地转过头，手中的肉桂粉在空中划出一道诡异的金色弧线；看见老谢尔盖的孙子阿列克谢从摊位后面探出头，手里还拿着要给伊万的木雕玩具。\n\n然后，世界重新开始运转。\n\n安东踉跄着后退一步，公文包掉在地上，里面的文件散落开来。他下意识摸向胸口，手指触到了那个给小火车模型的盒子。远处，几个黑影正无声地收起武器，转身离去，仿佛只是完成了一项再普通不过的工作。\n\n鹅卵石地面上，安东给儿子买的苹果静静躺在血泊中，夕阳的余晖透过果皮，让它看起来像一颗跳动的心脏。\n\n谢尔盖大叔则倒在了他的水果摊上，一只手还伸向那个要送给小伊万的杏子。眼神弥留之际，安东仍能看到老人眼中尚未消散的笑意······\n\n暮色渐浓，巴扎的灯火却再也不会亮起。而在城市的另一端，一栋普通的公寓里，娜塔莎正将最后一根蜡烛插在蜂蜜蛋糕上，小伊万趴在窗边，等待着父亲带回的生日苹果···\n\n"
OMS_more_flavor.173.a: "···还有惊惧与子弹。"
OMS_more_flavor.174.t: "“玫瑰”的日记"
OMS_more_flavor.174.desc: "日期：（划去） 天气：（划去）\n\n阿拉木图正在燃烧。\n\n我望着远处升起的浓烟，手指沾着墨水与泪水的混合物，在这本即将随我入土的日记上颤抖。这座被天山雪水滋养了千年的苹果之城，这座曾让波斯商队驻足惊叹的丝路明珠，如今正被黑色联盟的履带碾碎脊梁。\n\n依稀记得幼时，父亲带我去老城区的泽尔诺夫大教堂，阳光透过彩绘玻璃在石板上投下彩虹。那时教堂钟声与清真寺的唤礼声和谐共鸣，俄罗斯族的孩子和哈萨克族的少年在突厥斯坦大街上一同追逐有轨电车。铁路通车时，整座城市都在蒸汽机车的轰鸣中颤抖——那是希望的震颤，我们曾天真地以为，铁轨会带来自治区的繁荣······\n\n可铁轨带来的，却是那荼毒祖国的苏联内务部，还有这群可怖的黑色刽子手。我在中央国家博物馆当讲解员时，曾抚摸过阿布莱汗时代的羊皮地图，那些游牧部落的迁徙路线像大地的血脉。现在呢，这群愚昧之徒把博物馆的玻璃柜里的古物换成"伟大联盟光辉历史"的展板，而真正的历史正在焚书炉里化为灰烬······\n\n我的钢笔快没墨水了，就像这座城市的生命即将走到尽头。商市的嘈杂、孩童的欢声、古钟的钟声，如何却都化作窗外传来装甲车碾压路面的声响，间或夹杂着零星的枪声。我挚爱祖国的灵魂正在燃烧，她的骨髓被黑色联盟敲食殆尽——最后，她将在异族复仇的怒火中化为灰烬······\n\n阿拉木图啊，我的苹果花，我的雪山玫瑰。你见证过塞尔柱人的驼队，承受过准噶尔人的铁蹄，却在现代文明的十字路口被自己养育的孩子们背叛。当沙俄军官用《草原条例》剥夺你的牧场，当苏联政委用集体农庄碾碎你的游牧魂，你尚且能在暗处保存火种。可如今这些戴着黄黑袖标的刽子手，他们连灰烬都要扬进伊犁河。\n\n一切终于能够结束。我把珍藏多年的《阿拜箴言》手抄本压在日记上，这是母亲临终前塞给我的珍宝，每一页都浸透着真正的哈萨克之魂。绳套已经系好，就挂在当年父亲为我做的橡木书架上。\n\n永别了，我从未真正自由过的祖国。当春天终于来到天山脚下时，请让融雪带走我的骨灰，滋润那些被烧焦的苹果树根。\n\n我多么还想再看你最后一眼啊···\n\n"
OMS_more_flavor.174.a: "——玫瑰绝笔"
OMS_more_flavor.175.t: "又一场暴乱的终结"
OMS_more_flavor.175.desc: "清晨的雾气还未散尽，阿拜就已经在往麻袋里装沙子了。他的手掌被粗砺的麻绳磨出了血泡，但比起远处传来的炮声，这点疼痛根本不算什么。\n\n"小伙子，歇会儿吧。"一位卖馕的老爷爷塞给他一块热乎乎的烤饼，"我孙子跟你差不多大，在阿拉木图读书···现在怕是···"\n\n阿拜接过烤饼，没敢问下去。三天前从阿拉木图逃来的难民说，那里的街道上堆满了尸体，连清真寺都没能幸免。他望向公路方向，那里堆满了从工厂搬来的机器零件、拆下来的门板，甚至还有几辆被推倒的电车——所有能用来阻挡坦克的东西。\n\n"听说他们连小孩都不放过。"裁缝铺的玛依努尔大婶一边往沙袋上缝白布条，一边压低声音说。她丈夫昨天带着猎枪去了城郊，再也没回来。\n\n阿拜擦了擦汗，继续搬运沙袋。他今年才十七岁，本该在机械厂当学徒，现在却要和全城的老人、妇女一起筑起这道可笑的防线。远处，几个退伍老兵正在教妇女们使用步枪，清脆的拉栓声在晨雾中格外刺耳。\n\n"看！是军队！"突然有人喊道。\n\n阿拜抬头，看见一队穿着制服的士兵朝城市走来。走在最前面的是个独臂老人，胸前别满了勋章——那是退役多年的萨肯少校。跟在他身后的"军队"让阿拜鼻子一酸：瘸腿的邮差、戴着眼镜的老师、满脸皱纹的牧民...所有人都拿着五花八门的武器，从生锈的猎枪到厨房用的菜刀。\n\n"孩子们，"萨肯少校的声音沙哑却坚定，"黑色联盟的畜生们离我们还有二十公里。"\n\n人群安静下来，阿拜看见玛依努尔大婶把白布条系在额头上，那分明是裹尸布的料子。\n\n"我们没有坦克，没有飞机，"少校举起仅剩的右臂，"但我们有希姆肯特的每一块砖，每一滴血！"\n\n不知是谁先唱起了《醒醒吧，哈萨克人》，渐渐地，所有人都跟着哼唱起来。阿拜想起父亲生前常说的话：“过去几十年，我们民族一直都在为自己的命运···不管是沙皇还是苏联，我们都没有屈服···阿拜，你要记住：哈萨克人可以被打败，但永远不会屈服。”\n\n正午时分，地平线上扬起了尘土。\n\n"来了！"瞭望塔上的少年喊道。\n\n阿拜趴在沙袋后，第一次看清了黑色联盟的军队——数十辆坦克排成楔形，后面跟着望不到头的步兵。阳光照在他们的防毒面具上，反射出冰冷的光。\n\n第一发炮弹落在城门时，阿拜被气浪掀翻在地。他爬起来，看见萨肯少校的半个身子都不见了，可老人依然用剩下的手臂指着前方。\n\n"为了哈萨克斯坦！"\n\n不知是谁喊出了这句口号，紧接着，奇迹发生了。衣衫褴褛的人群像潮水般涌向钢铁洪流，阿拜看见玛依努尔大婶举着菜刀冲在最前面；卖馕的老爷爷抱着自制的燃烧瓶；连那个从阿拉木图逃来的大学生都挥舞着一根铁棍...\n\n第二波炮火覆盖了冲锋的人群。阿拜的左腿传来剧痛，但他还是挣扎着往前爬。透过硝烟，他看见黑色联盟的士兵正在换弹匣，那些冰冷的枪管对准了最后一批冲锋的老人和孩子。\n\n阿拜用尽全力站起来，高举着不知从谁手里接过的国旗。弹雨穿透身体的瞬间，他恍惚看见了父亲的笑脸······ \n\n然后，他发出了最后一声呐喊：\n\n"
OMS_more_flavor.175.a: "“我们，永不屈服！”"
OMS_more_flavor.176.t: "一个国家，双重胜利"
OMS_more_flavor.176.desc: "伊万·科兹洛夫上校的皮靴踏过伏龙芝中央广场的碎玻璃时，夕阳正将那座"胜利纪念碑"映照得如同血染。他伸手抚过纪念碑基座上尚未干涸的血迹，指尖传来黏腻的触感，像在抚摸一块腐败的肉。\n\n"这就是胜利者的模样？"他对着空荡的广场发问，声音在布满弹孔的建筑间回荡。三天前，吉尔吉斯人还在这里同黑联军队火拼，现在只剩下几具来不及收走的尸体，其中一具还紧紧攥着被烧到仅剩半面的吉尔吉斯国旗。\n\n科兹洛夫缓步走向市政厅，军大衣下摆扫过路面上散落的传单——那是抵抗者们自发印刷的，内容颇为杂乱。市政厅的青铜大门被炸得扭曲变形，门缝里卡着一只断手，无名指上的结婚戒指反着微弱的光。\n\n"上校，您应该看看这个。"中尉掀开地下室的门帘，腐臭的热浪扑面而来。三十多名“抵抗军”官员像沙丁鱼般挤在这个曾经存放档案的密室，全部以跪姿被处决，后脑勺的弹孔排列得整整齐齐。\n\n"他们管这叫战略储备。"他踢了踢角落里发霉的面粉袋，"就这些东西还想与黑色联盟的军队相抗衡，痴人说梦。"科兹洛夫不由得发出一声冷笑。\n\n夜幕降临，科兹洛夫站在原胜利广场的观礼台上。探照灯将他的影子投在对面建筑的外墙上，巨大如魔神。工兵们正在纪念碑基座下安装炸药，而他的副官捧着从博物馆抢来的古董怀表，开始倒计时。\n\n"十、九、八··· "\n\n他想起那些刁民在城区郊外那些自称是“军营”的狗屁地方，此刻想必也正被黑色联盟的炮火覆盖。这群野狗肯定还自认为自己还能像十几年前那样从敌人手中夺回他们自认为是属于吉尔吉斯祖国的“领土”。\n\n"···三、二、一！"\n\n震耳欲聋的爆炸声中，三十米高的纪念碑缓缓倾斜。科兹洛夫看着那些歌颂胜利的铭文在火光中支离破碎，大理石碎块砸向广场，将那些无人认领的尸体又碾碎了一次。\n\n"报告上校，伏龙芝广播电台已恢复运作。"通讯兵递来话筒。\n\n科兹洛夫清了清嗓子，声音通过全城尚存的喇叭传出："所有在城中，不管是已经投降的，还是仍在抵抗的吉尔吉斯人···"他踩碎脚边一个滚落过来的腐烂头颅，"···请抛弃你们的愚蠢，你们真正的祖国只有一个，那就是黑色联盟···"\n\n硝烟散去后，新树立的黑色联盟旗帜在广场上空猎猎作响。科兹洛夫从副官手中接过伏特加，为这座死城举杯："敬双重胜利——我们摧毁了你们的军队，而你们···早已摧毁了自己的灵魂。""
OMS_more_flavor.176.a: "为庆祝这场胜利，上校还特地要求将这座死城重新洗劫一遍。"
OMS_more_flavor.177.t: "让歌声四处飘扬"
OMS_more_flavor.177.desc: "枪炮声已经逼近纳沃伊歌剧院的廊柱。大理石台阶上散落着乐谱碎片，一支被踩断的塔姆布尔琴弦在风中微微颤动。挤在包厢与走廊间的难民们沉默着，直到那位白发苍苍的老指挥家爬上舞台，颤抖的手指拂过沾满灰尘的钢琴键。\n\n"唱吧，"老人的声音在穹顶下回荡，"为我们的祖国母亲送上最后一程吧。"\n\n第一个音符响起时，黑色联盟的士兵刚好踹开鎏金大门。防毒面具后的眼睛扫过满座的观众席——抱着婴儿的妇女、拄着拐杖的老兵、衣服残破不堪的学生——所有人都挺直了脊背。钢琴声越来越响，老指挥家干枯的手指突然变得有力，一切仿佛回到了二十年前，那个曾属于塔什干的黄金时代。\n\n"阿尔泰的麦穗颗颗饱满···"\n\n歌声从各个角落升起。卖甜瓜的商贩用沙哑的嗓音唱着，他身旁的纺织女工声音清亮，两人之间躺着个腹部中弹的年轻人，他的和声渐渐变成血沫的咕噜声。二楼包厢里，塔什干大学的教授搂着妻子，把副歌部分唱得字正腔圆。 \n\n黑色联盟的军官举起手枪时，前排的小女孩突然站起身。她扎着乌兹别克传统的七彩辫绳，沾满煤灰的裙摆随节奏摆动："米尔扎丘尔的棉花洁白如雪..."子弹穿透她瘦小的胸膛，歌声却从更多喉咙里涌出。\n\n枪声与歌声在巴洛克风格的穹顶下交织。老指挥家的白西装被钢琴溅出的血点染红，但他仍固执地敲击着琴键。一位戴着眼镜的老妇人拄着银头手杖走上舞台，她曾是一名小有名气的演员，现在用漏风的牙齿唱着："繁荣之国绽放欢欣···"三发子弹让她如谢幕般仰面倒下。\n\n交响乐般的枪响中，歌词变得越来越清晰："友谊铸就你的力量！"——子弹打碎了水晶吊灯；"劳动成就你的荣光！"——穿防弹衣的士兵踢翻谱架；"愿平安永驻这片土地！"——最后的合唱混着玻璃碎裂的声响。\n\n当军官踩着尸体走上舞台时，老指挥家正用染血的手指弹奏尾声。防毒面具贴到他耳边："老东西，你们的乌兹别克已经死了。"\n\n钢琴声戛然而止。老人微笑着转过头，浑浊的眼睛里映出观众席上层层叠叠的尸体——他们有的还保持着拥抱的姿势，有的手指紧扣在一起，有个母亲用身体在座椅间搭出最后的庇护所。\n\n"不，"老指挥家轻声说，手指突然砸向琴键，"她将永远活在每个会唱这首歌的人心里，你们这群野兽，永远都不会征服这片土地···"\n\n最终枪响后，剧院陷入沉寂。只有风穿过弹孔，在管风琴的金属管里发出呜咽般的共鸣。\n\n"
OMS_more_flavor.177.a: "歌声随尘土而去。"
OMS_more_flavor.178.t: "恶魔留下的足迹"
OMS_more_flavor.178.desc: "第23天：纳曼干\n\n纳曼干的中央广场上，被炸毁的纪念碑基座上又添了新的弹孔。清晨，黑色联盟士兵押解着当地居民列队经过。我注意到一位乌兹别克老人被推倒在纪念碑前，而旁边素来冷漠的吉尔吉斯商人突然上前阻拦。两声枪响后，两人的鲜血共同浸透了被炮弹炸烂的地面。而广场周围的店铺门窗依旧紧闭，只有风卷着灰烬在空荡的街道上打转······\n\n第46天：安集延\n\n令我没有想到的是，入夜后的安集延还能显露出异样的生机。一位幸存下来的妇女向我讲述发生在当地一处废弃纺织厂内的故事：饱受黑色联盟压迫的居民在那悄悄聚集。他们传阅着地下刊物，搜罗着军事装备，低声交谈。一位失去右手的老人曾向她咒骂黑色联盟的那群士兵，是如何残忍杀害他的家人···凌晨时分，枪声打破了宁静。面对黑色联盟的装甲车，三个不同民族的青年手挽手，不顾一切地冲向前去···月光照耀着他们残缺的肢体，凝固的血液和肢体的影子相结合，像一组诡异的现代雕塑······\n\n第61天：列宁纳巴德\n\n列宁纳巴德的街道安静得可怕，就像走进一座巨大的坟墓。在我印象中，列宁纳巴德曾是一座充满反抗精神的城市，但如今的人们只剩下一副麻木面孔。当黑色联盟士兵拖拽一名少女经过时，终于有居民站了出来。枪声响起时，我看到不同民族的人们自发地站在一起。他们的血顺着排水沟流入锡尔河······\n\n在西方媒体的报道中，黑色联盟被描绘成"中亚秩序的维护者"，他们的暴行被美化为"必要的维稳措施"。这些人口口声声说这是"必要的牺牲"，但映入我眼帘的，分明就是赤裸裸的反人类罪行！\n\n费尔干纳的人民不需要你们的怜悯，他们需要的是真相。那些被你们称为"极端分子"的乌兹别克人，那些被你们贴上"分裂分子"标签的塔吉克人，那些被你们污蔑为"暴徒"的吉尔吉斯人——他们不过是想在自己的土地上平静地生活。当三个世仇民族的血终于流到一起时，这难道还不足以说明谁是真正的恶魔吗？\n\n西方世界可以继续装聋作哑，假装对这一切毫不知情，但历史终将记住：在费尔干纳最黑暗的时刻，是这些"野蛮人"教会了我们什么是人性，什么是尊严。\n\n"
OMS_more_flavor.178.a: "而他们只不过是在为自己的国家谋取最正当不过的权益···"
OMS_more_flavor.179.t: "遗信"
OMS_more_flavor.179.desc: "致我最挚爱的阿卜杜勒：\n\n当你读到这封信时，我已经带着我们的孩子坐上了马车，踏上前往阿富汗的艰难旅程。窗台上那盆由我们亲手栽种的番红花，我托付给了老邻居纳西尔照料——它开得正盛，就像二十年前我们在杜尚别大学图书馆前相遇时，那片沐浴在春日阳光下的花海。你还记得吗？那时的瓦赫什河清澈见底，我们总爱在中央广场的喷泉边憧憬未来，你说要带我看遍祖国每一寸美丽的土地。\n\n我们的祖国曾经多么令人骄傲啊，亲爱的。吉萨尔山脉的雪峰在晨曦中闪耀，巴达赫尚的红宝石在博物馆中熠熠生辉。记得我们结婚那天吗？你在我的发间别了一朵鲜红的罂粟花，说它就像塔吉克斯坦永不熄灭的火焰。那时的我们多么天真，以为这份美好会永远持续下去。\n\n战争的炮火摧毁了一切。我永远忘不了那天，我们的祖国被活生生剜去了心脏，巴达赫尚和费尔干纳——可怜我们的孩子们还没有来得及看到这两片美丽的土地。但即便如此，我们还是心存希望，期盼着美好的生活，还有那富强的祖国。那时我们相信，只要心中还有信仰，无论有多大的困难，祖国就永远不会真正消亡。\n\n但现在，我亲爱的丈夫，我必须告诉你一个残酷的事实：我们所深爱的塔吉克斯坦已经死了。昨天我带着孩子们穿过广场时，那里已经堆满了尸体，黑色联盟把我们的家园摧残成人间地狱，只有那群可怖士兵的刺耳哨声在街头回荡。\n\n我不得不离开了，阿卜杜勒。小阿里已经三天没有喝到一滴牛奶，而玛尔哈巴开始对着空罐头自言自语。明天黎明时分，我们会搭乘老纳西尔安排的马车，穿越边境前往阿富汗。我不敢告诉孩子们，他们可能再也见不到心爱的父亲了。\n\n如果你能读到这封信，如果你还活着，求你来马扎里沙里夫找我们。但请不要自责，我的勇士。你选择为祖国战斗到最后一刻，而我必须为我们的孩子寻找一线生机。\n\n我必须停笔了，现在的情况非常糟糕，我也不知道能不能和孩子们活着到达阿富汗。愿真主保佑你能看到这封信，也愿他能宽恕我们不得不做出的选择。\n\n阿卜杜勒，放下执念吧，祖国已经死去，我们永远都不会再见到她了······\n\n永远爱你的，\n\n玛丽卡\n\n"
OMS_more_flavor.179.a: "“如有来世，我仍会爱你，一生一世”。"
OMS_more_flavor.180.t: "和平再临之日···"
OMS_more_flavor.180.desc: "夕阳将阿什哈巴德的大理石建筑染成血色。阿扎特拖着受伤的左腿，在狭窄的巷弄间穿行。军服早已破烂不堪，但胸前的土库曼斯坦边防军徽章仍被他擦得锃亮。一个月前，当黑色联盟的坦克碾过边境时，他的连队如沙堡般溃散。一颗子弹擦过他的太阳穴，让他倒在战友的尸体堆里侥幸活了下来。\n\n转过最后一个街角时，阿扎特的手指不自觉地摸向口袋里的钥匙——那是他离家前，六岁的女儿阿尔滕亲手穿在绳子上的，上面还挂着一颗蓝色的玻璃珠。钥匙在锁孔里转动的声响异常清晰，随后是门轴刺耳的吱呀声。\n\n"萨比娜？阿尔滕？"他的呼唤在空荡的公寓里回荡。\n\n客厅的餐桌上，半块发霉的馕还留在盘子里，旁边倒着一个摔碎的茶碗，干涸的茶渍像极了血迹。阿扎特的军靴踩在地上某种脆硬的物体上——是阿尔滕的识字课本。 \n\n浴室的门虚掩着。\n\n阿扎特的世界在推开那扇门后静止了。他的妻子萨比娜躺在浴缸里，苍白的双手还保持着拥抱的姿势，怀里的阿尔滕穿着最喜欢的蓝裙子——如果忽略她太阳穴上那个黑洞的话。浴缸边缘放着一块香皂，是阿扎特上次休假时从军营小卖部带回来的柠檬味香皂，已经被血染成粉色。\n\n阿扎特跪在浴缸前，颤抖的手指拂过妻子冰冷的眼皮。他突然想起两年的即将离开的那个夜晚前，萨比娜就是在这个浴缸里给阿尔滕洗澡，小女孩的笑声和溅起的水花打湿了他的军裤。那时这座城市还被誉为"白色明珠"，边境哨所的夜晚只有风和星光的絮语。\n\n夜幕完全降临。阿扎特用最后的力气将妻儿并排放在床上，为他们盖上那床绣着土库曼传统花纹的被子。他从衣柜深处找出珍藏的伏特加——本打算等战争结束和战友们一起喝的——现在独自对着月光一饮而尽。\n\n酒精灼烧着喉咙，记忆却愈发清晰。他想起新兵训练时，教官指着卡拉库姆沙漠说："我们守卫的不只是边境线，身后不仅有我们的家园与妻儿，还有千千万万个幸福美好的家庭。"想起美丽的阿什哈巴德、美丽的妻儿、把酒言欢的战友······\n\n黎明的第一缕阳光透过窗帘时，阿扎特已经擦好随身携带的手枪。他最后吻了吻妻儿的额头，将阿尔滕的玻璃珠挂在脖子上。市政厅前，黑色联盟的指挥官正在检阅部队，用中亚人民鲜血浇筑的勋章在阳光下却显得黯淡无光。\n\n当阿扎特从人群中冲出时，他恍惚听见女儿阿尔滕在呼唤他。第一枪打碎了指挥官的膝盖骨——这是边境部队对付走私犯的常用手法。第二枪瞄准了对方的心脏，却被突然扑来的卫兵撞偏。\n\n剧痛从后背蔓延开来时，阿扎特倒在了地上，看见鲜血在地上蔓延，好像——漂亮的玫瑰花地？阿扎特虽此生从未见过，却对这一切又如此熟悉，模糊的视线忽然又变得清晰：\n\n那玫瑰花地上，站着他的战友，还有萨比那和阿尔滕，小家伙张开双臂，向她的父亲奔来···\n\n"
OMS_more_flavor.180.a: "···我们将再度相聚"
OMS_more_flavor.181.t: "征服地球"
OMS_more_flavor.181.desc: "20世纪眼帘底下的世界似乎已无秘密可言。所有的陆地都已勘察过了，最遥远的海洋上都已有船只在乘风破浪。那些在一代人以前还不为世人所知、犹如仙境般的迷迷濛濛的地区，如今都已服服帖帖地在为欧洲的需要服务；轮船正径直向长期寻找的尼罗河的不同源头驰去。半个世纪以前才被第一个欧洲人看见的维多利亚瀑布如今已顺从地推动着转盘发出电力；亚马逊河两岸的最后原始森林已被人砍伐得日益稀疏；唯一的处女地——西藏也已经被人揭开羞涩的面纱；旧的地图和地球仪上那个“人迹未至的地区”是被专家们夸大了的，如今20世纪的人已认识自己生存的星球。探索的意志已在寻找新的道路，向下要去探索深海中奇妙的动物界，向上要去探索无尽的天穹，因为自从地球对人类的好奇心暂时变得无秘密可言以来，足迹未至的路线只有在天空中还能找到，所以飞机的钢铁翅膀已竞相冲上天，要去达到新的高度和新的远方。\n\n但是，直到我们这个世纪，赤裸的地球还隐藏着她的最后一个谜，不让人看见。这就是她那被分割得支离破碎的躯体上两块极小的地方，是她从自己造物的贪欲中拯救出来的两块地方：南极和北极——她躯体的脊梁。千万年来，地球正是以这两个几乎没有生命、抽象的极点为轴线旋转着，并守护着这两块纯洁的地方不致被亵渎。她用层层叠叠的冰障隐藏着这最后的秘密，面临贪婪的人们，她派去永恒的冬天做守护神，用严寒和暴风雪筑起最雄伟的壁垒，挡住来往的通道。死的恐惧和危险使勇士们望而却步。只有太阳自己可以匆匆地看一眼这闭锁着的区域，而人的目光却还从未见过它的真貌。\n\n近几十年来，探险队一个接着一个前往，但没有一个达到目的。勇士中的佼佼者——安德拉的尸体在巨冰的玻璃棺材里静卧了33年，现在才被发现。他曾驾着飞艇想飞越北极圈，但却永远没有回来。每一次冲击都碰到由严寒铸成的晶亮的堡垒而粉碎。自亘古至今日，地球的这一部分还始终蒙住自己的容貌，成为她对自己造物的欲望的最后一次胜利。她像处女似的对世界的好奇心保持着自己的纯洁。\n\n但是，年轻的20世纪急不可待地伸出了它的双手。它在实验室里锻造了新的武器，为防御危险找到了新的甲胄，而一切艰难险阻只能增加它的热望。它要知道一切真相。它想要在它的第一个十年里就能占有以往千万年里未能达到的一切。个人的勇气中又结合着国家间的竞争。他们不再是仅仅为了夺取极地而斗争，而且也是为了争夺那面第一次飘扬在这块新地上的国旗。于是，为了争夺这块由于热望而变得神圣的地方，由各民族、各国家组成的十字军开始出征了。从世界各大洲发起一次又一次的冲击。人类等待得已经不耐烦了，因为这是我们生存空间的最后秘密。"
OMS_more_flavor.181.a: "向未知进发。"
OMS_more_flavor.182.t: "人类群星闪耀时"
OMS_more_flavor.182.desc: "核冬天是天空永不愈合的伤疤。灰败的云层沉重地压在头顶，隔绝了所有关于阳光的记忆。我佝偻着，像一具被风干的活尸，裹紧身上褴褛的布条，每一步都深陷在冰冷粘腻的辐射尘里。寒风是钝刀，刮过裸露的皮肤，带走最后一点虚假的暖意。眼前只有扭曲的钢筋刺破灰黑的尘埃，如同巨兽腐烂后戳向天空的肋骨，无声地宣告着一个时代的彻底死亡。在这片死寂中，我的目标卑微得可怜：一块勉强能塞进嘴里缓解胃袋灼烧的腐物，或是一截尚能点燃、带来片刻虚假温暖的朽木。\n\n一座半倾颓的巨构残骸拦在面前，像被神祇随意丢弃的玩具。我摸索着钻进一个幽暗的裂口，脚下传来令人心悸的碎裂声，不知是玻璃还是枯骨。借着高处缝隙漏下的、浑浊如污水的微光，勉强辨认出无数巨大金属框架的轮廓——是书架，知识的骨架，如今被暴力折断，相互倾轧、堆叠，构成一座座绝望的坟茔。空气里弥漫着纸张彻底腐烂的阴湿死气，混合着无处不在的尘埃，每一次呼吸都像是在吞咽灰烬。我麻木地在厚厚的、混杂着纸屑的黑灰中翻刨，冻僵的手指几乎失去知觉。大部分书页一触即溃，化为指尖污糟的泥。知识？那个丰饶的旧世界？早已无声地风化成脚下这片尘埃的一部分。\n\n就在冰冷的绝望像潮水般即将淹没头顶时，指尖在倒塌书架形成的黑暗缝隙深处，触到了一个坚硬、有棱有角的异物。这突兀而顽固的触感，像一根微弱的芒刺，扎破了麻木的茧。我屏住呼吸，双手并用，扒开沉重的浮尘和碎屑，一件沉甸甸的物件终于被拖拽出来。\n\n它被包裹在一层深色的、布满细密凸起纹理的封套里。入手冰凉坚韧，带着一种我无法理解的精致感，像是处理过的兽皮，却又挺括异常。我用力拂去厚重的积尘，幽深如夜的底色显露出来。封套中央，几个凸起的符号线条流畅而优雅，在昏暗中，竟隐隐流转着一种黯淡、几乎被尘埃彻底掩盖的金色微光——那是早已断绝的旧日工艺留下的最后痕迹。我完全不认得这些符号，它们是来自失落文明的陌生咒语。指尖带着近乎虔诚的颤抖，小心翼翼地翻开这坚韧的外壳。里面的书页微黄，带着时间的沉香，却奇迹般地完好无损，边缘甚至镶着柔和的金边。更令人心头剧震的是书页间夹着的图画：穿着奇异金属甲胄的人，跨坐在神骏的马上，背景是弥漫的硝烟与冲天的火焰。其中一幅，瞬间攫住了我全部的视线：一位蓄着短须的男子，身披一件仿佛有暗流涌动的深色大氅，骑在雪白如银的战马上。他微微抬颌，目光如穿透迷雾的利剑，直刺过来。那眼神里燃烧着一种我早已无法理解的、近乎狂妄的意志，一种主宰风暴而非被风暴撕碎的力量——与这片死寂的废土形成了最尖锐、最令人窒息的对比。\n\n我缓缓屈身，尘埃没过我的脚踝。手中的重量真实而陌生，仿佛捧着一块文明的碎骨。那些陌生的金色符号沉默着，却比我所知的任何言语都更具力量。它们讲述着装订、金箔和一种对文字近乎神圣的敬惜——这一切，在我的世界里都已失传。\n\n风仍在废墟间呜咽，但此刻听起来不再只是哀嚎。它仿佛变成了背景音，衬托着这本奇迹之书的绝对寂静。我站在那里，一个被遗忘时代的信使就在手中。在一切意义的尽头，我找到的并非食物或燃料，而是一个名为斯蒂芬·茨威格的人，为人类那些璀璨时刻竖立的墓碑——或者说，丰碑。"
OMS_more_flavor.182.a: "于是，他把这本书带了回去，仔细地阅读起来。"
OMS_more_flavor.183.t: "罗伯特·福尔肯·斯科特，向南极进发之人"
OMS_more_flavor.183.desc: "斯科特，一名英国皇家海军的上校，一名普普通通的海军上校。他的履历表简直就同军衔表一样。他在海军的服役深得上级的满意，以后又同沙克尔顿一起组织过探险队。没有任何特殊的迹象能暗示出他是一位英雄。从照片上看，他的脸同成千上万的英国人一样，冷峻、刚毅，脸部没有表情，仿佛肌肉被内在的力量凝住了似的。青灰色的眼睛，闭得紧紧的嘴巴。面容上没有任何浪漫主义的线条和一丝轻松愉快的色彩，只看到他的意志和考虑世界现实的思想。他书写的字是英文的某一种字体，清楚而没有曲线的花饰，写得快而又工整。他的文风清晰和准确，像一份报告似的以真实性动人而不掺杂任何的臆想。斯科特写的英文就像塔西佗写的拉丁文一样质朴而刚劲。人们会觉得他是一个讲究实际而完全没有梦想的人。在英国，即便是具有特殊才能的天才也都像水晶石般的刻板，把一切都提升到尽责的高度。斯科特就是这样一个地地道道的英国人。他和英国的历史已经发生过上百次的联系。他出征到过印度，征服过许多星罗棋布的岛屿，他随同殖民者到过非洲，参加过无数次世界性的战役。但不论到哪里，他都是一副同样冷冰冰的、矜持的面孔，带着同样刚强的毅力和集体意识。\n\n不过，他的那种钢铁般的意志，人们早已在事实面前感觉到了。斯科特要去完成沙克尔顿已经开始的事业。他要组织一支探险队，然而资金缺乏。但这也难不倒他。他献出了自己的财产，还借了债，因为他自信有成功的把握。他年轻的妻子替他生了一个儿子，可是他毫不犹豫，像又一个赫克托耳似的离开了自己的安德洛玛刻。朋友和伙伴们不久也被找到了。世间再也没有什么能动摇他的意志。一艘名叫“新地”号的奇特的船把他们送到冰海的边缘。之所以说这艘船奇特，是因为它有着双重的装备：一半像诺亚方舟那样载满活的动物，一半是一个备有成千件仪器和大量图书的现代化实验室。因为人为了维持生命所必需的一切和精神食粮也都必须随身带到那空寂无人的世界去，令人奇怪的是，在新时代最精良的技术复杂的装备中却结合着原始人的最简陋的防御工具——兽皮、皮毛、活的动物。而整个探险行动也像这艘船一样，具有双重的面貌、奇异的色彩：这是一次冒险的行动，但它又是一次像一桩买卖似的盘算得非常仔细的行动；这是一次大胆的行动，但又是一次最小心谨慎的行动——每一个细节都要算得十分准确，但发生意外的可能性仍然防不胜防。\n\n他们于1910年6月1日离开英国。那正是这个盎格鲁—撒克逊人的岛屿王国阳光灿烂的日子。绿草如茵，鲜花盛开。和煦的太阳高悬在没有云雾的上空，光芒四射。当海岸线渐渐消失时，他们无比激动，因为人人都知道，这一别温暖的太阳就是好几年，有些人也许是永别了。但船首飘扬着英国国旗，当他们想到，这面象征着世界的旗帜将随同他们去占领地球上迄今还没有主人的唯一地方时，他们也就心满意足了。"
OMS_more_flavor.183.a: "于是，夺取南极的斗争开始了。"
OMS_more_flavor.184.t: "南极世界"
OMS_more_flavor.184.desc: "短暂的休息之后，他们于1911年1月在麦克默多海湾新西兰的埃文斯角登陆，这里是长年结冰的极地边缘。他们在这里建起一座准备过冬的木板屋。12月和1月在这里算是夏季，因为一年之中只有这段时间白天的太阳会在白色的金属般的天空中悬挂几个小时。房屋的四壁是用木板制成的，完全像以往探险队使用过的基地营房一样，但是在这座木板屋里，人们却能感觉到时代的进步。他们的先驱当年用的还是气味难闻的像豆火似的鲸油灯，坐在黑洞洞的斗室中对自己的视野所见不胜厌烦。一连串没有太阳的单调日子使他们感到非常疲倦。而现在，这些20世纪的人却能在四面板壁之间看到整个世界和全部科学的缩影。一盏乙炔电石灯发出白亮的光。电影放映机把远方的图像、从温带捎来的热带场面的镜头，像变魔术似的呈现在他们面前。一架自动发声钢琴演奏着音乐。留声机播放着歌唱声。各种图书传播着时代的知识。打字机在一间房间里噼噼啪啪地直响。另一间房间是小暗室，这里洗印着影片和彩色胶卷。一名地质学家在用放射性仪器检验岩石。一名动物学家在捕获到的企鹅身上寻找新的寄生物。气象观测和物理实验互相交换着结果。在昏暗的没有阳光的几个月里，每个人都有自己分内的工作，彼此巧妙地联系起来，把孤立的研究变成共同的知识。这30个人每天晚上都各自做出专门的报告，在这巨冰的层峦叠嶂和极地的严寒之中上着大学的课程。每个人都想尽量把自己的知识传授给别人，在互相热烈的交谈中完善他们对世界的认识。由于研究的专门化，谁也谈不上骄傲，他们只是希望能在集体中相得益彰。这30个人就在这样一个处于自然状态的史前世界中，在这没有时间概念的一片孤寂中，互相交换着20世纪的最新成果，而正是在这些成果之中，他们不仅能感觉到世界时钟的每一小时，而且能感觉到每一秒钟。后来人们在他们的记载中令人感动地读到，这些严肃的人们曾怎样在圣诞树旁兴高采烈地欢庆过，曾怎样出版过一份风趣的小报，诙谐地把它叫做《南极时报》，在小报上愉快地开着玩笑。在那里，一件小事——比如，一条鲸鱼浮出水面，一匹西伯利亚矮种马跌了一跤——都会变成头条新闻，而另一方面，那些非同寻常的事——比如，发亮的极光、可怕的寒冷、极度的孤独寂寞——反而变得司空见惯和习以为常。在这期间，他们只敢进行小型的外出活动，试验机动雪橇、练习滑雪和驯狗，同时，为以后的远征建造仓库。可是在暖季（12月）到来以前的日历却撕去得很慢很慢。到了暖季，那艘带着家信的船穿过巨冰漂浮的大海驶到这里。他们现在也敢分小组出去活动了。在凛冽的寒季中锻炼白天行军，试验各种帐篷，掌握一切经验。当然，他们所做的事并不件件成功，但正是无数的困难给他们增添了新的勇气。当他们外出活动归来时，全身冻僵，筋疲力尽，而迎接他们的则是一片欢呼和热烘烘的火炉。在经过了几天的饥寒交迫之后，他们便觉得这座建立在南纬77°线上的舒适的小木板屋是世界上最安乐的场所。\n\n但是，有一次一个探险小组从西面方向回来，他们带回来的消息使整个屋子变得寂静无声。回来的人说，他们在途中发现了阿蒙森的冬季营地。斯科特立刻明白：现在，除了严寒和危险以外，还有另一个人在向他挑战，要夺去他作为第一个发现地球最后秘密的人的荣誉。这个人就是挪威的阿蒙森。斯科特在地图上反复测量。当他发现阿蒙森的冬季营地驻扎在比他自己的冬季营地离南极点近110公里时，他完全惊呆了，但却没有因此而气馁。“为了祖国的荣誉，振作起来！”——他在日记中自豪地写道。\n\n阿蒙森这个名字在他的日记中仅仅出现过这唯一的一次，以后再也没有出现过。但是人们可以感觉到：从那天以后，阿蒙森的名字成了一直笼罩在这座冰天雪地中的孤寂小屋上的阴影，每时每刻都使他坐卧不安。"
OMS_more_flavor.184.a: "南极的寂静被行进队伍发出的声音打破了。"
OMS_more_flavor.185.t: "向南极点进发"
OMS_more_flavor.185.desc: "离木板屋一英里远的观察高地上不停地轮换着守望人。架在斜坡上的一台孤零零的仪器，恰似一门对准着看不见的敌人的大炮。这台仪器用来测试正在临近的太阳初升时发出的热量。他们一连几天等候着太阳的出现。黎明时的蒙蒙天空中已变幻着色彩缤纷的霞光，但圆面似的太阳还始终没有浮出地平线。不过，这四周辉耀着奇妙彩光的天空，这种太阳反射的先兆，已经使这些急不可耐的人欢欣鼓舞。电话铃终于响了，从观察高地的顶端向这些高高兴兴的人们传来这样的消息：太阳出来过了，几个月来太阳第一次在这寒季的黑夜里露了一小时脸。太阳的光线非常微弱、非常惨淡，几乎不能使冰冷的空气有些微生气，太阳的光波几乎没有在仪器上产生摆动的信号，不过，仅仅看到了太阳这一点，就足以使人发出欢笑。为了充分利用这一段有光线的短暂时间——尽管这段时间按照我们通常的生活概念它仍然是冷得可怕的冬天，可在那里却意味着春天、夏天、秋天的一齐到来——探险队紧张地进行准备工作。机动雪橇在前面嘎嘎地开动，后面跟着西伯利亚矮种马和爱斯基摩狗拉的雪橇。整个路程被预先周密地划分为几段。每隔两天路程设置一个贮藏点，为以后返程的人储备好新的服装、食物以及最最重要的煤油——无限的寒冷中液化了的热量。因为出发的时候将是全部人马，然后逐渐分批回来，所以要给最后一个小组——挑选出来去征服极点的人——留下最充分的装备、最强壮的牵引牲畜和最好的雪橇。\n\n尽管计划制订得非常周密，甚至连可能发生的种种意外不幸的细节都考虑到了，但还是没有奏效。经过两天的行程，机动雪橇全都出了毛病，瘫在地上，变成一堆无用的累赘，西伯利亚矮种马的状况也不像预期的那么好。不过，这种有机物工具在这里要比机械工具略胜一筹，因为即使这些病马不得不在中途被杀死，它们也还可以给狗留下几顿热的美餐，增加狗的体力。\n\n1911年11月1日，他们分成几组出发。从电影的画面上看，这支奇特的探险队开始有30人，然后是20人、10人，最后只剩下5个人在那没有生命的史前世界的白色荒原上孤独地行走着。走在队伍最前面的一个人始终用毛皮和布块把自己裹得严严实实，只露出胡须和一双眼睛，看上去像个野人。一只包着毛皮的手牵着一匹西伯利亚矮种马的笼头，马拖着他的载得满满的雪橇。在他后面是一个同样装束、同样姿态的人，在这个人后面又是这样一个人······20个黑点在一望无际的耀眼的白色冰雪上形成一条线。他们夜里钻进帐篷，为保护西伯利亚矮种马，朝着迎风的方向筑起了雪墙。第二天一早他们又重新登程，怀着单调、荒凉的心情穿过这千万年来第一次被人呼吸的冰冷的空气。\n\n但是令人忧虑的事愈来愈多。天气始终十分恶劣，他们有时候只能走30公里而不是40公里。而每一天的时间对他们来说愈来愈宝贵，因为他们知道在这一片寂寞之中还有另一个看不见的人正在从另一侧面向同一目标挺进。在这里，每一件小事都可以酿成危险。一条爱斯基摩狗跑掉了；一匹西伯利亚矮种马不愿进食——所有这些都能使人惴惴不安，因为在这荒无人烟的雪原上一切有用的东西都变得极其珍贵，尤其是活的东西更成了无价之宝，因为它们是无法补偿的。说不定那永垂史册的功名就系在一匹矮种马的四只蹄上，而风雪弥漫的天空则很可能妨碍一项不朽事业的完成。与此同时，全队的健康状况也出了问题。一些人得了雪盲症，另一些人四肢冻伤。西伯利亚矮种马愈来愈精疲力竭，因为它们的饲料愈来愈少。最后，这些矮种马刚刚走到比尔兹莫尔冰川脚下就全部死去，这些马在这里的孤独寂寞之中和探险队员共同生活了两年，已成为他们的朋友。每个人都叫得出马的名字。他们曾温柔地抚摸过它们无数次，可现在却不得不去做一件伤心的事——在这里把这些忠实的牲口杀掉。他们把这伤心的地方叫做“屠宰场营地”。就在这鲜血淋漓的地方一部分探险队员离开队伍，向回走去，而另一部分队员现在就要去做最后的努力，越过那段比尔兹莫尔冰川的险恶路程。这是南极用以保护自己而筑起的险峻的冰的堡垒，只有人的意志的热烈火焰能冲破它。\n\n他们每天走的路愈来愈少，因为这里的雪都结成了坚硬的冰碴。他们不能再滑着雪橇前进，而必须拖着雪橇行走。坚硬的冰凌划破了雪橇板，走在像沙粒般硬的雪地上，脚都磨破了，但他们没有屈服。12月30日，他们到达了南纬87°，即沙克尔顿到达的最远点。最后一部分支持人员也必须在这里返回了，只有五个选拔出来的人可以一直走到极点。斯科特将他认为不合适的人挑出来。这些人不敢违拗，但心情是沉重的。目标近在咫尺，他们却不得不回去，而把作为第一批看到极点的人的荣誉让给其他的伙伴。然而，挑选人员的事已经决定下来。他们互相又握了一次手，用男性的坚强隐藏起自己感情的激动。这一小队人终于又分成了更小的两组，一组朝南，走向一切未知的南极点，一组向北，返回自己的营地。他们不时从两个方向转过身来，为了最后看一眼自己活着的朋友。不久，最后一个人影消失了。他们——五名挑选出来的人：斯科特、鲍尔斯、奥茨、威尔逊和埃文斯寂寞地继续向一切未知的南极点走去。"
OMS_more_flavor.185.a: "人类的意志总是强大的。"
OMS_more_flavor.186.t: "南极点"
OMS_more_flavor.186.desc: "那最后几天的日记显示出他们愈来愈感到不安。他们开始颤抖，就像南极附近罗盘的蓝色指针。“身影在我们右边向前移动，然后又从前边绕到左边，围着我们的身子慢慢地转一圈，可是这段时间却是没完没了的长！”不过，希冀的火花也在日记的字里行间越闪越明亮。斯科特愈来愈起劲地记录着走过的路程：“只要再走150公里就到极点了，可是如果这样走下去，我们真坚持不了。”——日记中又这样记载着他们疲惫不堪的情况。两天以后的日记是：“还有137公里就到极点了，但是这段路程对我们来说将变得非常非常困难。”可是在这以后又突然出现了一种新的、充满胜利信心的声音：“只要再走94公里就到极点了！即便我们不能到达那里，我们也已走得非常非常近了。”1月14日，希望变成了确有把握的事：“只要再走70公里，我们的目的就达到了！”而从第二天的日记里已经可以看出他们那种喜悦和几乎是轻松愉快的心情：“离极点只剩下50公里了，不管怎么样，我们就要达到目的了！”这欢欣鼓舞的几行字使人深切地感觉到他们心中的希望之弦是绷得多么紧，好像他们的全部神经都在期待和焦急面前颤抖。胜利就在眼前；他们已把双手伸到地球的这个最后秘密之处，只要再使一把劲，目的就达到了。"
OMS_more_flavor.186.a: "旧世界人类强大意志的又一证明。"
OMS_more_flavor.187.t: "伟大的悲剧，其一"
OMS_more_flavor.187.desc: "“情绪振奋”——日记上这样记载着。1月16日这一天，他们清晨起程，出发得比平时更早，为的是能早一点看到无比美丽的秘密。焦急的心情把他们早早地从自己的睡袋中拽了出来。到中午，这五个坚持不懈的人已走了14公里。他们热情高涨地行走在荒无人迹的白色雪原上，因为现在再也不可能达不到目的了，为人类所作的决定性的业绩几乎已经完成。可是突然之间，同伴之一的鲍尔斯变得不安起来。他的眼睛紧紧盯着无垠雪地上的一个小小的黑点。他不敢把自己的猜想说出来：可能已经有人在这里树立了一个路标。但现在其他的人也都可怕地想到了这一点。他们的心在战栗，只不过还想尽量安慰自己罢了——就像鲁宾逊在荒岛上刚发现陌生人的脚印时竭力想把它看做是自己的脚印一样，当然这是徒劳的——他们对自己说，这一定是冰的一条裂缝，或者说不定是某件东西投下的影子。他们神经紧张地越走越近，一边还不断自欺欺人，其实他们心中早已明白：以阿蒙森为首的挪威人已在他们之先到过这里了。\n\n没有多久，他们发现雪地上插着一根滑雪杆，上面绑着一面黑旗，周围是扎过营地的残迹——滑雪屐的痕迹和许多狗的足迹。在这严酷的事实面前也就不必再怀疑：阿蒙森在这里扎过营地了。千万年来人迹未至、或者说自太古以来从未被世人瞧见过的地球的南极点竟在一个分子量的时间之内——即15天内两次被人发现，这在人类历史上是闻所未闻、不可思议的事。而他们恰恰是第二批到达的人，他们仅仅迟到了一个月。虽然昔日逝去的光阴数以几百万个月计，但现在迟到的这一个月，却显得太晚太晚了——对人类来说，第一个到达者拥有一切，第二个到达者什么也不是。而他们正是人类到达极点的第二批人。一切努力成了白费劲，历尽千辛万苦显得十分可笑，几星期、几个月、几年的希望简直可以说是癫狂。“历尽千辛万苦、风餐露宿、无穷的痛苦烦恼——这一切究竟为了什么？还不是为了这些梦想，可现在这些梦想全完了。”——斯科特在他的日记中这样写道。泪水从他们的眼睛里夺眶而出。尽管精疲力竭，这天晚上他们还是夜不成眠。他们像被宣判了似的失去希望，闷闷不乐地继续走着那一段到极点去的最后路程，而他们原先想的是：欢呼着冲向那里。他们谁也不想安慰别人，只是默默地拖着自己的脚步往前走。1月18日，斯科特海军上校和他的四名同伴到达极点。由于他已不再是笫一个到达这里的人，所以这里的一切并没有使他觉得十分耀眼。他只用冷漠的眼睛看了看这块伤心的地方。“这里看不到任何东西，和前几天令人毛骨悚然的单调没有任何区别。”——这就是罗伯特·福尔肯·斯科特关于极点的全部描写。他们在那里发现的唯一不寻常的东西，不是由自然界造成的，而是由角逐的对手造成的，那就是飘扬着挪威国旗的阿蒙森的帐篷。挪威国旗耀武扬威地、扬扬得意地在这被人类冲破的堡垒上猎猎作响。它的占领者还在这里留下一封信等待这个不相识的第二名的到来，他相信这第二名一定会随他之后到达这里，所以他请他把那封信带给挪威的哈康国王。斯科特接受了这项任务，他要忠实地去完成这一最冷酷无情的职责：在世界面前为另一个人完成的事业作证，而这一事业却正是他自己所热烈追求的。\n\n他们怏怏不乐地在阿蒙森的胜利旗帜旁边插上英国国旗——这面姗姗来迟的“联合王国的国旗”，然后就离开了这块“辜负了他们雄心壮志”的地方。在他们身后刮来凛冽的寒风。斯科特怀着不祥的预感在自己的日记中写道：“回去的路使我感到非常可怕。”"
OMS_more_flavor.187.a: "十字军到达了终点，可这是他们想要的吗？"
OMS_more_flavor.188.t: "伟大的悲剧，其二"
OMS_more_flavor.188.desc: "回来的路程危险增加了十倍。在前往南极点的途中有罗盘指引他们，而现在除了罗盘外，他们还必须顺着自己原来的足迹走回去，在几个星期的行程中必须小心翼翼地绝不离开自己原来的脚印，以免错过事先设置的贮藏点，在那里储存着他们的食物、衣服和凝聚着热量的几加仑煤油。但是漫天大雪封住了他们的眼睛，使他们每走一步都忧心忡忡，因为一旦偏离方向，错过了贮藏点，无异于直接走向死亡。况且他们体内已缺乏那种初来时的充沛精力，因为那时候丰富的营养所含有的化学能和南极之家的温暖营房都给他们带来了热力。\n\n不仅如此，他们心中钢铁般的意志现在也已松懈。来的时候他们满怀无限的希望，这希望体现了全人类的好奇和渴求，这希望给他们增添了无穷的力量。当他们一想到自己所进行的是人类的不朽事业时，也就有了超人的力量。而现在他们仅仅是为了使自己的皮肤不受损伤、为了自己终将死去的肉体的生存、为了没有任何光彩的回家而斗争。说不定在他们的内心深处，与其说盼望着回家，毋宁说更害怕回家呢。\n\n阅读那几天的日记是可怕的。天气变得愈来愈恶劣，寒季比平常来得更早。他们鞋底下的白雪由软变硬了，结成厚厚的冰凌，踩上去就像踩在三角钉上一样，每走一步都要粘住鞋。剌骨的寒冷吞噬着他们已经疲惫不堪的躯体。所以每当他们经过几天的畏缩不前和走错路以后重新到达一个贮藏点时，他们就稍稍高兴一阵，从日记的字里行间重新闪现出信心的火焰。在阴森森的一片寂寞之中始终只有这么几个人在行走，他们的英雄气概不能不令人钦佩，最能证明这一点的莫过于负责科学研究的威尔逊博士，他在离死只有寸步之远的时候，还在继续进行着自己的科学观察，在自己的雪橇上除了一切必需的载重外还拖着16公斤的珍贵岩石样品。"
OMS_more_flavor.188.a: "至少，他们应该还能回去吧。"
OMS_more_flavor.189.t: "伟大的悲剧，其三"
OMS_more_flavor.189.desc: "然而，人的勇气终于渐渐地被自然的巨大威力所销蚀。这里的自然界是冷酷无情的，千万年来积聚的力量能使它像精灵似的召唤来寒冷、冰冻、飞雪、风暴——用这一切毁灭人的法术来对付这五个鲁莽大胆的勇敢者。他们的脚早已冻烂，食物的定量愈来愈少，一天只能吃一顿热餐，由于热量不够，他们的身体已变得非常虚弱。一天，同伴们可怕地发觉，他们中间最身强力壮的埃文斯突然精神失常。他站在一边不走了，嘴上念念有词，不停地抱怨着他们所受的种种苦难——有的是真的，有的是他的幻觉。从他语无伦次的话里，他们终于明白，这个苦命的人由于摔了一跤或者由于巨大的痛苦已经疯了。对他怎么办？把他抛弃在这没有生命的冰原上？不。可是另一方面，他们又必须毫不迟疑地迅速赶到下一个贮藏点，要不然······从日记里看不出斯科特究竟打算怎么办。2月17日夜里一点钟，这位不幸的英国海军军士死去了。那一天他们刚刚走到“屠宰场营地”，重新找到了上个月屠宰的矮种马，第一次吃了较丰盛的一餐。\n\n现在只有四个人继续走路了，但灾难又临到头上。下一个贮藏点带来的是新的痛苦的失望。储存在这里的煤油太少了，也就是说，他们必须精打细算地使用这最必需的用品——燃料，他们必须节省热能，而热能恰恰是他们对付严寒的唯一防御武器。冰冷的黑夜，周围是呼啸不停的暴风雪，他们胆怯地睁着眼睛不能入睡，他们几乎再也没有力气把毡鞋的底翻过来。但他们继续拖着自己往前走，他们中间的奥茨已经在用冻掉了脚趾的脚行走。风刮得比任何时候都厉害，3月2日，他们到了下一个贮藏点，但再次使他们感到可怕的绝望：那里储存的燃料又是非常之少。\n\n现在他们真是惊慌到了极点。从日记中人们可以觉察到斯科特如何尽量掩饰着自己的恐惧，但从他那强制的镇静中还是一再迸发出绝望的厉叫。“再这样下去，是不行了”或者“上帝保佑呀！我们再也忍受不住这种劳累了”，或者“我们的戏将要悲惨地结束”，最后终于出现了可怕的自白：“唯愿上帝保佑我们吧！我们现在已很难期望人的帮助了。”不过，他们还是拖着疲惫的身子，咬紧着牙关，绝望地继续向前走呀，走呀。奥茨越来越走不动了，越来越成为朋友们的负担，而不再是什么帮手。一天中午，气温达到零下40°C, 他们不得不放慢走路的速度。不幸的奥茨不仅感觉到，而且心里也明白，这样下去，他会给朋友们带来厄运，于是做好最后的准备。他向负责科学研究的威尔逊要了十片吗啡，以便在必要时加快结束自己的生命。他们陪着这个病人又艰难地走了一天路程。然后这个不幸的人自己要求他们将他留在睡袋里，把自己的命运和他们的命运分开来。但他们坚决拒绝了这个主意，尽管他们都清楚，这样做无疑会减轻大家的负担。于是病人只好用冻伤了的双脚踉踉跄跄地又走了若干公里，一直走到宿夜的营地。他和他们一起睡到第二天早晨。清早起来，他们朝外一看，外面是狂吼怒号的暴风雪。"
OMS_more_flavor.189.a: "奥茨突然站起身来，对朋友们说：“我要到外边去走走，可能要多待一些时候。”"
OMS_more_flavor.190.t: "伟大的悲剧，其四"
OMS_more_flavor.190.desc: "其余的人不禁战栗起来。谁都知道，在这种天气下到外面去走一圈意味着什么。但是谁也不敢说一句阻拦他的话，也没有一个人敢伸出手去向他握别。他们大家只是怀着敬畏的心情感觉到：劳伦斯·奥茨——这个英国皇家禁卫军的骑兵上尉正像一个英雄似的向死神走去。\n\n现在只有三个疲惫、羸弱的人吃力地拖着自己的脚步，穿过那茫茫无际、像铁一般坚硬的冰雪荒原。他们疲倦已极，已不再抱任何希望，只是靠着迷迷糊糊的直觉支撑着身体，迈着蹒跚的步履。天气变得愈来愈可怕，每到一个贮藏点，迎接他们的是新的绝望，好像故意捉弄他们似的，只留下极少的煤油，即热能。3月21日，他们离下一个贮藏点只有20公里了，但暴风雪刮得异常凶猛，好像要人的性命似的，使得他们无法离开帐篷。每天晚上他们都希望第二天能到达目的地，可是到了第二天，除了吃掉一天的口粮外，只能把希望寄托在第二个明天。他们的燃料已经告罄，而温度计却指在零下40°C。任何希望都破灭了。他们现在只能在两种死法中间进行选择：是饿死还是冻死。四周是白茫茫的原始世界，三个人在小小的帐篷里同注定的死亡进行了八天的斗争。3月29日，他们知道再也不会有任何奇迹能拯救他们了，于是决定不再迈步向厄运走去，而是骄傲地在帐篷里等待死神的来临，不管还要忍受怎样的痛苦。他们爬进各自的睡袋，却始终没有向世界哀叹过一声自己最后遭遇到的种种苦难。"
OMS_more_flavor.190.a: "南极的斗争就此结束了？"
OMS_more_flavor.191.t: "斯科特临死时的书信"
OMS_more_flavor.191.desc: "凶猛的暴风雪像狂人似的袭击着薄薄的帐篷，死神正在悄悄地走来，就在这样的时刻，斯科特海军上校回想起了与自己有关的一切。因为只有在这种从未被人声冲破过的极度寂静之中他才会悲壮地意识到自己对祖国、对全人类的亲密情谊。但是在这白雪皑皑的荒漠上只有内心中的海市蜃楼，它召来那些由于爱情、忠诚和友谊曾经同他有过联系的各种人的形象，他给所有这些人留下了话。斯科特海军上校在他行将死去的时刻用冻僵的手指给他所爱的一切活着的人写了书信。\n\n那些书信写得非常感人。死在眉睫，信中却丝毫没有缠绵悱恻的情意，仿佛信中也渗透着那没有生命的天空的不清澈的空气。那些信是写给他认识的人的，然而是说给全人类听的；那些信是写给那个时代的，但说的话却是千古永垂的。\n\n他给自己的妻子写信。他提醒她要照看好他的最宝贵的遗产——儿子，他关照她最主要的是不要让儿子懒散。他在完成世界历史上最崇高的业绩之一的最后竟做了这样的自白：“你是知道的，我不得不强迫自己有所追求——因为我总是喜欢懒散。”在他行将死去的时刻，他仍然为自己的这次决定感到光荣而不是感到遗憾。“关于这次远征的一切，我能告诉你什么呢。它比舒舒服服地坐在家里不知要好多少！”\n\n他怀着最诚挚的友情给那几个同他自己一起罹难的同伴们的妻子和母亲写信，为他们的英勇精神作证。尽管他自己即将死去，他却以坚强的、崇高的感情——因为他觉得这样死去是值得纪念的，这样的时刻是伟大的——去安慰那几个同伴的遗属。\n\n他给他的朋友们写信。他谈到自己时非常谦逊，但谈到整个民族时却充满无比的自豪，他说，在这样的时刻，他为自己是这个民族的儿子一个称得上儿子的人而感到欢欣鼓舞。他写道：“我不知道，我算不算是一个伟大的发现者。但是我们的结局将证明，我们民族还没有丧失那种勇敢精神和忍耐力量。”他在临死时还对朋友做了友好的表白，这是他在一生中由于男性的倔犟、灵魂的贞操而没有说出口的话。他在给他的最好的朋友的信中写道：“在我一生中，我还从未遇到过一个像您这样令我钦佩和爱戴的人，可是我却从未向您表示过，您的友谊对我来说意味着什么，因为您有许多可以给我，而我却没有什么可以给您。”\n\n他的最后一封信，也是最精彩的一封信是写给他的祖国的。他认为有必要说明，在这场争取英国荣誉的搏斗中他虽然失败了，但却无个人的过错。他一一列举了使他遭到失败的种种意外事件，同时用那种死者特有的无比悲怆的声音恳切地呼吁所有的英国人不要抛弃他的遗属。他最后想到的仍然不是自己的命运。他写的最后一句话讲的不是关于自己的死，而是关于活着的他人：“看在上帝面上，务请照顾我们的家人！”以下便是几页空白信纸。\n\n斯科特海军上校的日记一直记到他生命的最后一息，记到他的手指完全冻住，笔从僵硬的手中滑下来为止。他希望以后会有人在他的尸体旁发现这些能证明他和英国民族勇气的日记，正是这种希望使他能用超人的毅力把日记写到最后一刻。最后一篇日记是他用已经冻伤的手指哆哆嗦嗦写下的愿望：“请把这本日记送到我的妻子手中！”但他随后又悲伤地、坚决地划去了“我的妻子”这几个字，在它们上面补写了可怕的字眼：“我的遗寡。”"
OMS_more_flavor.191.a: "我们歌颂，勇士们狂热的精神！"
OMS_more_flavor.192.t: "回音"
OMS_more_flavor.192.desc: "住在基地木板屋里的同伴们等待了好几个星期，起初充满信心，接着有点忧虑，最后终于愈来愈不安。他们曾两次派出营救队去接应，但是恶劣的天气又把他们挡了回来。这些失去了队长的人在木板屋里白白地待了整个漫长的寒季，他们的心中都已蒙上灾难的黑影。在这几个月里，有关罗伯特·斯科特海军上校的命运和事迹一直被封锁在白雪和静默之中，想必白冰已把他们封在晶亮的玻璃棺材里。一直到南极的春天到来之际，10月29日，一支探险队才出发，至少要去找到那几位英雄的尸体和他们的消息。11月12日他们到达那个帐篷，发现英雄们的尸体已冻僵在睡袋里，死去的斯科特还像亲兄弟似的搂着威尔逊。他们找到了那些书信和文件，并且为那几个悲惨死去的英雄们垒了一座石墓。在堆满白雪的墓顶上竖着一个简陋的黑色十字架。它至今还孤独地基立在银白色的世界上，好像这银白色的世界将要永远藏匿起这件人类历史上那次英雄业绩的物证。\n\n可是没有！他们的事迹出乎意料地、奇妙地复活了。这是我们新时代的科技世界创造的精彩奇迹。朋友们把那些底片和电影胶卷带回家来，在化学溶液里显出了图像，人们再次看到了行军途中的斯科特和他的同伴们，并且发现：看到南极风光的除了他以外，只有另一个人——阿蒙森。斯科特的遗言和书信通过电线迅速传到赞叹而又惊异的世界。在英国国家主教堂里，国王跪下来悼念这几位英雄。所以说，看来徒劳的事情会再次结出果实，一件耽误了的事情会变成对人类的大声疾呼，要求人类把自己的力量集中到尚未达到的目标；壮丽的毁灭，虽死犹生，失败中会产生攀登无限高峰的意志。因为只有雄心壮志才会点燃起火热的心，去做那些获得成就和轻易成功是极为偶然的事。一个人虽然在同不可战胜的占绝对优势的厄运的搏斗中毁灭了自己，但他的心灵却因此变得无比高尚。所有这些在一切时代都是最最伟大的悲剧，一个作家只是有时候去创作它们，而生活创作的悲剧却要多至一千倍。"
OMS_more_flavor.192.a: "然而，新时代的科技世界被一场核子烈火吞噬了。"
