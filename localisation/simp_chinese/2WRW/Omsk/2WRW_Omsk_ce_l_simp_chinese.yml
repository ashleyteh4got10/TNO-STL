 OMS_2WRWCE_PostApoc_category_desc:0 "\n£GFX_OMS_great_trial_top \n\n\n\n在地表之下，我们的生存环境空前恶劣。每一分资源都必须精打细算，弥足珍贵。\n我们的资源将被抽象为§W补给§!£Antarctica_texticon_SUP ，§R军事点数§!£Antarctica_texticon_MIL 和§G宣称点数§!£Antarctica_texticon_LEG ，这三个数值将反映我们的可用资源。需要注意，这里的三个数值反映的是我们的盈余，而非库存。因此即使库存为零，我们也不会彻底灭亡。\n此外，我们也能看到本方有多少§Y特遣队§!，§Y特遣队§!能被派遣到§W核废土§!中，在他们完成当前任务后，就能被派去执行其他任务。"
