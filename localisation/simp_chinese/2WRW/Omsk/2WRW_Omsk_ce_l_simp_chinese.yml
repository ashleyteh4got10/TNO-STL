OMS_POSTNUKE.100.t: "赫尔辛基去工业化行动简要"
OMS_POSTNUKE.100.desc: "1，向奥托昆普钢铁厂，瓦锡兰船舶动力公司，凯米拉化工集团，帕特里亚飞机制造厂等赫尔辛基地区工厂派遣一定规模的武装人员，维持秩序，防止破坏\n2，成立特别审讯小组，审讯工厂管理层人员以获得人员设备统计资料，清点可通过铁路运输的机器设备与生产资料，对芬兰技术人员进行分类评级\n3，联盟相关工业骨干人员与芬兰技术人员负责拆卸机器设备，芬兰战俘用以运输集装箱与重型设备\n4，控制管理芬兰技术人员家属，处决不可控制的人员\n5，征用当地铁路系统，拆卸下来的设备资料由赫尔辛基转移阿尔汉格尔斯克，后转移至乌拉尔山以东各工业基地\n6，对芬兰技术人员适当做安置处理，搭建工棚，分配食物等\n7，工兵小队在行动结束后对无法进行搬迁的设备与资料，进行彻底的机械破坏，炸药爆破与化学污染\n"
OMS_POSTNUKE.100.a: "—批准。"
OMS_POSTNUKE.101.t: "雪地上的双头鹰"
OMS_POSTNUKE.101.desc: "今年的芬兰，冬天来得格外早，也格外冷。埃米尔·科伊武宁踩着齐膝深的积雪，斧头砍进冻僵的云杉树干，发出沉闷的“笃笃”声。哈气在眉毛上凝成白霜，每一次呼吸都像吞着冰渣。他抬头望向灰蒙蒙的天空，芬兰的天空向来清澈，如今却总像蒙着一层不祥的灰翳。\n\n突然，一声尖锐的警报撕破了整个天空，埃米尔知道大事不妙，朝家的方向一路狂奔，随后与妻子莉萨带着孩子们一同躲入了地窖中。而外面的世界没有想象中爆炸的轰鸣，万籁俱静，大地上只有毒蛇吐信般的嘶嘶声阴冷地弥漫开来。紧接着，一片诡异的、泛着微微黄绿色的雾气贴着雪面，无声而迅疾地从森林边缘漫涌而至，吞没了一切。很明显，这是人为释放的毒气!埃米尔隔着地窖门缝小心翼翼的向外张望着，只见邻居老约纳斯踉跄着冲出屋门，但是他没跑几步便像截朽木般重重栽进雪堆里，身体剧烈地抽搐。埃米尔隐约间能够听见他的喉咙里发出溺水者般可怕的咯咯声，老人的皮肤迅速泛起可怖的水泡，很快便不再动弹。\n\n不知过了多久，死寂笼罩了一切。地窖里的空气污浊得令人窒息。埃米尔小心翼翼顶开一条缝隙。外面静得可怕，只有寒风呜咽。雪地上散落着僵硬的尸体，姿态个个扭曲痛苦。\n\n沉重的皮靴踏碎积雪的声音由远及近，来人有三个，皆穿着陌生的深灰色大衣，但他们臂章上那刺目的金色双头鹰徽记宣告着他们的身份。为首者那双秃鹫般的的眼睛死死攫住埃米尔的目光。不幸地，一个士兵发现了地窖口，然后他掏出一个奇形怪状的仪器，操作了两下，似乎是探测到了地下有人，那个士兵示意了一下，随后数个黑洞洞的枪口猛地指了过来。\n\n“出来！芬兰猪猡！”士兵用手示意着埃米尔出来。埃米尔和妻儿颤抖着爬出地窖，站在冰冷的雪地上。士兵们脸上毫无表情，像打量待宰的牲口。其中一个，目光扫过莉萨苍白却依然美丽的脸，嘴角扯出一丝令人胆寒的狞笑。他解下腰间的水壶，拧开盖子，将其中的液体倒了一点在雪地上。刹那间，一股刺鼻的化学药剂气味弥散开来，他蹲下身，竟直接用戴着手套的手，拢起一捧肮脏的、浸染了化学毒剂的融雪，粗暴地狠狠抹在莉萨的脸上。\n\n莉萨发出一声短促的尖叫，皮肤瞬间灼痛变红。那士兵审视着她的痛苦，看着埃米尔因狂怒和绝望而扭曲的脸，喉咙里滚出沉闷而快意的笑声。埃米尔目眦欲裂，他想扑上去，却被另一支冰冷的枪管死死顶住额头。\n不知过了多久，萨莉渐渐失去了生机，似乎是欣赏够了他们绝望的表情，男人挥了挥手。"
OMS_POSTNUKE.101.a: "随后，“砰，砰，砰，砰——”"
OMS_POSTNUKE.102.t: "三十年后的复仇"
OMS_POSTNUKE.102.desc: "湖泊\n卡累利阿的森林与胡泊三十年从来没有这么热闹过。曾经，就是在这里，芬兰叛徒们伙同条顿人的飞机坦克开始了入侵。三十年过去，三十年的时间足够一代人成长，从懵懂的孩童到扛枪的士兵。\n\n战役过后，黑衣士兵押解着一队年轻的芬兰战俘。他们排成三列，垂着头，在泥泞冰冷的土地上走着，双脚磨出了血泡，衣服被冷雨浇得透湿。有人走不动了，黑衣士兵把他拉出队列就地枪决，尸体就弃在原地。\n\n他们行过已无人烟的村庄，瞥见有的房子墙面被俄语写满诅咒的话，好像旅游者爱写的“某到此一游”。墙面下全是尸体，有的被烧焦，割喉，被枪弹撕裂，外面还有几个面色发紫，笑容诡异。男男女女，老少妇孺，裸露着叠在一起，好像一堆很久没有清理的垃圾。\n\n不止过了几天，他们行进到一处铁丝网围成的临时安置所，黑色士兵的长官们在此对每一个战俘进行检查:猛击一拳后还能站稳的留下。后续他们会被火车拉到奥涅加，再到后方的军工厂。\n\n“剩下的这些赶进湖里淹死。下一批。”\n"
OMS_POSTNUKE.102.a: "父债子偿。"
OMS_POSTNUKE.103.t: "好人还是坏人？"
OMS_POSTNUKE.103.desc: "格里沙粗糙而温热的手指死死攥着冰冷的莫辛纳甘枪托，身旁人群震天的吼声一浪又一浪:“让条顿猪血债血偿!”，格里沙心胸激荡，看啊，这就是斯拉夫民族的力量!他感觉自己以前尚被奴役时被德国监工留下的鞭痕在肋骨下隐隐发烫，血液一股脑往头上涌，他甚至兴奋得有些头晕。黑色联盟带来了“大审判”，他们打破了所谓“新秩序”的镣铐，带来了冒着血腥味的自由!\n\n几个穿德式旧衣的人被推搡出来，面如死灰。格里沙的目光盯住其中一个老头——冯·埃里希，战前的德语教师。十岁时，格里沙因发错一个“R”音被他戒尺抽得手心绽开。屈辱的记忆瞬间点燃了格里沙眼中的火焰。就是他！这些高高在上的“优等种族”，他们凭什么这样侮辱自己？!\n\n臂缠双头鹰袖标的军官在木台上嘶吼，历数德国人的罪孽:“为了俄罗斯母亲！执行审判！”格里沙所在的队列被推上前。他机械地端枪，冰冷的准星套住冯·埃里希惊恐的脸。老头浑浊的眼睛似乎认出了他，闪过一丝惊愕，嘴唇无声地动了动。格里沙的手指搭上了扳机，他要仔细端详这张不可一世的臭脸······\n\n“瞄准！”命令炸响。可是格里沙的呼吸突然停滞了。准星里那张脸与脑海中的记忆碎片重叠:这不是监工那狰狞的脸，不是党卫军冷酷残忍的脸，只是一个穿着不合身旧西装、吓得发抖的老头的绝望，惊恐的脸——这老头也曾在他高烧时，皱着眉头丢过来一片阿司匹林。尽管老头面对他的时候脸上永远带着嫌恶的表情，好像在施舍一般······他还记得有一次他被那个国防军军官打的皮开肉绽的时候，那老头丢给了他一瓶红药水······回忆瞬间扑灭了他沸腾的狂热。\n\n“开火!”\n\n“砰——”\n\n格里沙站在原地，在一个恍惚间，老人就已经倒在了血泊之中。他握枪的手指在不受控制地颤抖。四周是狂欢的人群和“大审判万岁！”的口号，他张了张嘴，喉咙却像被堵住了一般。他的目光越过人群，落在橡树根下的尸体上，一本破旧的德文小册子从老头衣袋滑出，落在血泊里，染红的书页被风吹开，露出里面一行行陌生的诗句，那是歌德的《浮士德》。格里沙刚刚被复仇的狂热情绪填满的心底冒出了一丝小小的疑惑:“如果有些德国人没有那么坏呢？”\n"
OMS_POSTNUKE.103.a: "不过他只敢把这疑惑埋在心底。"
OMS_POSTNUKE.104.t: "以怨报怨"
OMS_POSTNUKE.104.desc: "“我操他妈的！这帮傻逼斯拉夫人怎么又来了？！”在莫斯科维恩的一处指挥所内，一个将军正对着电话大吼道“你最好马上准备好应对这帮斯拉夫贱畜，哦对了，我会叫上面给你加派一些部队，一定要把工厂里那些不太老实的奴隶抓出来杀鸡儆猴，不然我们就玩完了！听懂没有？！”\n\n说完这些，将军把电话一扔，无力地瘫在座位上，眼前闪过了二十多年前的那场西俄战争，那场战争差点就打垮了帝国重要的莫斯科维恩殖民地，幸好雅利安人是被上天眷顾的民族，才没让那帮斯拉夫畜牲获胜，想必这次也是一样。\n\n想到这，那位将军的紧张情绪稍微缓解了一些，他去镜子前理了理自己的军装，戴上自己的军帽并检查是否有什么地方脏了或破了，他可不希望以一副肮脏的面孔去指挥自己的士兵。\n\n这时，一声巨响从窗外传来，这位将军被吓了一跳，一个踉跄倒在了地上。“这是怎么回事？！那帮斯拉夫人已经打过来了吗？”他站起身来，往窗外看去：四处弥漫着些黄绿色的气体，地上躺着一些大大小小的士兵，身为军人的他突然意识到了这是毒气弹或什么之类的东西，一阵恐惧突然涌上了心头，他得赶紧去通知其他人那帮畜牲动用了生化武器，但已经来不及了，一发炮弹正向他所在的位置飞去，在他拿起电话的时候，这颗炮弹正好命中。\n\n“漂亮的一发！科索夫，那房子里面的条顿杂种听说还是个老将呢，现在他们可体会到什么是痛苦了吧！哈哈哈哈哈”科索夫没有理会他的话，他只是自顾自的瞄准着，他能看出那些四散奔逃的德国人有多么恐惧，这些恐惧他也看到过同样的，那是在他的妻子和年仅五岁的女儿脸上。他还能想起来那天他老婆和女儿被纳粹枪决时的场景，那时他刚从一个奴隶工厂中逃出来，就看到有一大一小两个女的被纳粹当众枪毙，他当时还挺可怜他们的，等到他有机会凑近看了一眼后，他就发誓他一定要让这帮纳粹猪们尝一尝被人虐杀的滋味，等到他逃到支离破碎的俄罗斯大地后，他很快就被黑色联盟的理念所吸引，并成为了一名优秀的战士。\n\n他又射出一发炮弹，一大团血污烂肉向着空中飞了起来，而科索夫没有一丝恐惧，相反的，他感到了一丝···愉悦？\n"
OMS_POSTNUKE.104.a: "活该。"
OMS_POSTNUKE.105.t: "救赎或死亡"
OMS_POSTNUKE.105.desc: " “听说你抓到了一批德军士兵？”“是，现在正打算好好招待一下他们。”在一个兵营内，两位黑联军官正互相交谈着，而离他们交谈的地方不远，一处还算隐蔽的房间里，有一伙人正想尽办法从那些俘虏口中套取些有用的信息，但无论是棍棒，电击还是拔掉指甲，这些德军战俘都不愿意透露哪怕一点他们所在部队的动向。\n\n“你们可真是有骨气啊！是吧？好，那让我看看你们到底多有骨气！”其中一位领头的黑联士兵对那些战俘喊道“来个人！把这些狗操的条顿杂种带到墙边去，我不打算再伺候他们了！”一群高大的人把那些德军士兵连拖带拽地带到了一面破旧的墙边，那些德军士兵的眼中仍带着愤怒，似乎十分不甘“把他们排成一派，我有些话想对他们说！”尽管有些麻烦，但这些有骨气的条顿人还是被说服站成了一排。\n\n“你们知道我为什么要把你们带到这吗？”\n\n“我去你妈的傻逼斯拉夫畜牲！老子才懒得听你···.”一声枪响打断了那位德军士兵的怒吼，随后他应声倒地，不再动弹。\n\n“你们条顿人可真是没有礼貌的野人，日耳曼蛮族称呼的一点错都没，你们说对不对？”其余的德军士兵在看到他们同伴正逐渐变冷的尸体后，眼中的怒火已消散了不少，他们基本上一句话都没说，只是呆呆地四处张望着。\n\n“好吧···听着！杂种们！你们可能还记得，你们的先辈或是你们自己在战争中干了什么！我并不是指某一场特定的战争，而是每一场！你们对我们同胞的残忍虐待我们都知道！你们这些纳粹猪简直就是人类中最劣等的那一批！还自称是什么高贵的雅利安人，无非就是自欺欺人的谎话罢了！我看你们肯定也不了解你们的元首，只是盲目的崇拜！我告诉你们吧，你们那所谓伟大的元首，无非也就是天天吸着毒品度日，荒淫无度，不在乎你们死活的废物！他只会无脑派你们上来战斗！却不会让你们在战斗后得到半分好处！”\n\n沉默了一会后，见那帮俘虏没什么动静，这位黑联士兵接着说：“我也不知道你们是在悔恨还是在咒骂，那没关系！我给你们两个选择！第一个，加入我们伟大的复仇事业中，为我们洗刷你们的罪恶，第二个！或许能让你们显的有些骨气，就是拒不服从我们的命令！如果你们选第二个.....好！现在想加入救赎旅，成为光荣的一员的人，举起你的手！”\n\n随后是一阵死寂，那些德军士兵面面相觑，心里正不断的进行着犹豫和决定，最后，有两个德军士兵举起了手。\n"
OMS_POSTNUKE.105.a: "“剩下的人拉去毒气室，让他们好好享受一下。”"
OMS_POSTNUKE.106.t: "在工厂内"
OMS_POSTNUKE.106.desc: "正如往常一样，伊里奇正在德国位于莫斯科维恩的一间血肉工厂中不分昼夜地上班，他已经忘记了是多久之前来的这里，几天？几个月？甚至几年？现在的他如同一架没有感情的机器每天在流水线上加工零件，看着周边一个又一个因过度劳累而倒下的同胞，他不敢想象他们将面对的结局是什么，是被救起来，还是直接扔去喂老鼠？他不知道。\n\n但这样的伊里奇是他面向德国人的伪装，他早在几个月前就与一伙游击队取得了联系，并秘密帮他们隐藏武器。他和那一伙游击队员一直在等待着，等待着一个时机。\n\n终于，属于他的机会到了，当俄罗斯再次统一并向德国开战的消息传来时，他这辈子也忘不了厂里那些卫兵脸上恐怖的神情，他看着他们惊恐的脸，努力忍住自己脸上轻蔑的笑，抄起身边的一个扳手......“敲击一个人的后脑勺，如果以全力的话，可是能直接致死的”他回想着游击队员教给他的知识，到眼前这位还没发觉他靠近的卫兵背后，实施了这一次试验。\n\n伟大的试验成功了，他从倒地的卫兵身上搜出手枪和子弹，高呼道：“同胞们！响应伟大祖国母亲的号召！站起来吧！直起你们的脊柱吧！”有另外数十个工人应声而起，合力杀死了工厂里还停留着的几个卫兵。伊里奇马上跑去平时会面的地方去和那些游击队员接头，但迎接他的是一个穿着黑色制服带着防毒面具的人，那人递给了他一个防毒面具，自称是“黑色联盟”的士兵，现在在进行对条顿人伟大的复仇事业，伊里奇马上明白了他是什么意思，带着这位黑联士兵来到了自己平时储存武器的仓库内。\n"
OMS_POSTNUKE.106.a: "“待会把这些枪发一下，你们的时候到了。”"
OMS_POSTNUKE.107.t: "平淡的一天"
OMS_POSTNUKE.107.desc: "“这是我来这的第几天啊？”汉斯自顾自地想着，他在许多个月之前就以德军战俘的身份被黑联收入了一个似乎叫做什么救赎旅的部队，在这个部队中他并不被当作一个普通士兵对待，相反的，他似乎更像是一件用完即扔的物件。\n\n而事实的确是如此，在某一天中午，汉斯所在的营队被要求辅助一个黑联正规军执行作战任务，而他被赋予的任务是···.\n\n“他妈的人肉探测地雷？发布这命令的人是傻逼吗？”汉斯听到自己的任务后，在心中狠狠咒骂了一句。\n\n“我能看出来你们好像有些意见，别忘了！这是你们该做的，你们这些条顿人对我们斯拉夫同胞的残害我们永生永世都不会忘，如果你们谁胆敢违抗命令，那我们会直接把你扔到地雷上！”救赎旅的队长对他们大声喊道，汉斯狠狠瞪了他一眼，还好他没看见。\n\n······..\n\n汉斯一行人被带到了一个被标记出的地区，一个木牌上面横七竖八写着：“地雷区”，汉斯真想张嘴说些什么，却感到有一根枪管正抵在自己的背上，他立马把那句将说出的话憋了回去，一步一步小心翼翼地向前探测着。\n\n大约十多分钟后，汉斯仍旧活着，他感叹自己的运气有多么好，可就在这时，他突然感到了一股不正常的泥土松动感，他立马意识到他可能是踩到地雷了。\n\n“我，要死了？”汉斯突然想到，但他不愿意就这样去死，他脑子中冒出了一个危险的想法，他找着离他最近的黑联士兵，向他招呼着手，想叫他过来。那位黑联士兵似乎没什么疑心，就这么一步步朝他走了过来。\n\n“对，就是这样···.”汉斯低声说着，他估计着脚下这颗地雷的杀伤范围，尽力不引人注意地让那人过来。\n\n就在他将要得手的时候，一阵枪响传来，汉斯顿时感觉浑身使不上劲，就这么倒了下去。\n\n随着一声巨响，汉斯化为了一团血雾。\n"
OMS_POSTNUKE.107.a: "小条顿杂种心思还不少。"
OMS_POSTNUKE.108.t: "哦，多么洁净"
OMS_POSTNUKE.108.desc: "“阳光明媚的一天，对吧？”别里科夫对着地上的一个半死不活的德军士兵说道。\n\n“哦说实话条顿人，如果我是你，我肯定会让伟大的元首给我配上一个防毒面具，但他还得把给你们配防毒面具的钱花在柏飞丁上呢，对吧？”德军士兵什么都没说，他已经接近于失去意识了。\n\n别里科夫狠狠地踢了一脚那个士兵，他似乎被吓了一跳，猛地哆嗦一下，用恐慌的眼神盯着别里科夫。\n\n“条顿杂种，你知不知道纳粹党人是如何对付我们伟大的斯拉夫人的，哈？”别里科夫举着手里的步枪，瞄准着德军士兵的膝盖，扣动了扳机。\n\n“我操！求你了我操，放了我吧！”那德军士兵痛的喊出了声。“哈哈！条顿佬！你也知道痛啊！”别里科夫用枪托重击了一下德军士兵的腹部，随后拖着他的躯体扔到了大街上，一阵气体嘶嘶释放的声音传出，街道上瞬间弥漫了黄绿色的气体，诺顿，那被折磨的德军士兵，他只能眼睁睁看着自己昔日的战友在恐慌中倒在地上，而他也逐渐失去了控制自己的力气，眼前的景象也变得模糊。“妈妈···..”他用尽自己最后的力气低声说着。\n\n别里科夫透过防毒面具的镜片看着逐渐倒在地上的条顿杂种，嘴角的笑容也逐渐抑制不住，他拿着自己的步枪对地上那些还留有一口气的德军士兵进行最终的审判。\n\n“哦，条顿人，你还得感谢我了结了你的痛苦呢···..”别里科夫低声说着，扣动扳机射杀了一名正泪流满面向前匍匐的德军士兵。\n\n随着大街上布满了黄绿色的气体，别里科夫满意地回到了自己的小队。\n"
OMS_POSTNUKE.108.a: "“任务执行完毕，长官。”"
OMS_POSTNUKE.109.t: "化学战"
OMS_POSTNUKE.109.desc: "一天早晨，穆勒从床上醒来，他揉了揉自己的眼睛，推开大门来到了牧场，他熟练地给自己养的牲口倒水，喂食，直到他干完了这一切，便回到了自己的家中准备早餐，在准备早餐的时候，穆勒透过窗户向外看去，他突然注意到了一些异样，有一些动物似乎倒了下去，他不确定自己有没有看错，于是揉了揉眼睛又看了一遍。\n\n“我操”，穆勒低声说道，随后打开了大门冲了出去，他看着眼前一只只动物一个接一个倒下，他不敢置信地冲到那些倒下的动物旁边，想检查一下它们有没有受到什么伤害，这时，他似乎闻到了一股很难闻的味道，他抬起头来四处张望，观察到不远处有一个戴着防毒面具，穿着黑色制服的陌生人，正拿着笔和纸记录着什么，他想要去质问那人究竟做了什么，却发现自己怎么都使不上劲了,他现在正无力地躺在地上，看着自己的牲口，自己毕生的心血，却无能为力。\n\n“效果很好，长官，那个条顿农民和他的牲口几乎在闻到毒气的一瞬间就被迷晕了，但我觉得我们还能加强一下毒气，这样或许能让那帮条顿杂种更快的暴毙，报告完毕。”\n\n“收到，通知各部队，批准毒气弹的大规模使用。”\n"
OMS_POSTNUKE.109.a: "让那帮条顿鬼子看看我们的厉害！"
OMS_POSTNUKE.110.t: "生物战"
OMS_POSTNUKE.110.desc: "“今天和平常没什么区别，就是被长官叫出去寻找附近有没有什么可饮用的水源，这听起来真像是古代打仗那样，对吧！\n\n可好像事实更加残酷一点，自从我的战友喝了我带来的水后，他们就开始不断地生病，有些运气好的能活下来，但也跟死了没啥区别，有些人就没那么幸运了，我希望这只是我的错觉。\n\n我的长官把我叫了过去，他问我是从哪弄来的水，而且非常生气，我十分害怕，只能如实告诉了他。”\n\n阿尔伯特停下了笔，跟随他的长官和一小伙人去他取水的小沟那里调查，他们取回一部分样品并交给实验组后，焦急地等待着化验结果。\n\n“我好像搞砸了，越来越多的人正在死去，我们刚把水给实验组去调查，希望这只是我的错觉。”\n\n可现实狠狠给了他一棒，实验组传来的的报告中说他们从水中检测出了各式各样的细菌，这些细菌的致病性极其强，只要摄入一点就能引发各种足以致死的疾病。\n\n谢尔盖远远望着德军手忙脚乱地运送那些生了病或已死亡的士兵，露出了满意的笑，用无线电报告说：\n"
OMS_POSTNUKE.110.a: "“生物战的效果很好，一定要快速开发出更多不同的使用手段。”"
OMS_POSTNUKE.111.t: "致命杰作"
OMS_POSTNUKE.111.desc: "过去，列夫是一名艺术家，但当他的妻儿在那场改变一切的大战中逝去后，一切都变了。\n\n现在，列夫是一名光荣的黑联士兵，一位果决的指挥官，但他的骨子里仍旧还是位艺术家，接下来，他要向大家介绍，他最满意的杰作：\n\n“毒气，废物视它如洪水猛兽，只要一提起，便吓破了胆，而我们！伟大的俄罗斯人！则视他如救命神药！远方的条顿人病了，正渴望着它去医治，只需要一丁点，便能让他们重获新生！”\n\n“但伟大的，慈爱的俄罗斯人，他们认为，一丁点还不够，他们将为可怜的条顿人送上最纯最多的毒气！看吧，透过那黄绿色的新娘的纱布，你就能看见一张张欢腾着的条顿人的脸！他们正欣喜着，他们正欢呼着，他们正狂舞着！在那黄绿之中，是无数的舞者在为我们献上最诚挚的感激，他们正用那最狂野的舞蹈感激俄罗斯人的馈赠！”\n\n“有些条顿人累了，便躺下来开始休息，看他们那一张张可爱的，婴儿似的脸！此刻也正如婴儿般熟睡着，而伟大的俄罗斯则化为他们最慈祥的母亲，让他们尽情享受在战火中的不易的安宁！”\n\n“而我，在那时，猛地想起了那古老的东方，有一个和俄罗斯同样古老的国度，据说，在他们那，曾流传着一种惊奇的艺术——‘京观’，我看，这艺术亦如它的名字那般美丽！我再也遏制不住那颗已沉寂了很久的艺术的心，在那一刻，我的心在颤抖，我的手在狂跳。”\n\n“当我最终完成的那一刻，我竟在片刻间觉得，就算是死也无憾了。它的构造极其简单，或是说有些单调，但听着，那一个个的狰狞和恐惧才是它最好的调味剂！是他们让本该乏味的画面增添了生命的活力！”\n\n“我要把它命名为‘咆哮’，作为我致命的杰作！”\n\n"
OMS_POSTNUKE.111.a: "伟大的艺术。"
OMS_POSTNUKE.112.t: "浊酒"
OMS_POSTNUKE.112.desc: "    寒风无情地在俄罗斯的土地上驰骋，对每一个试图阻止它的人予以最刺骨的回击。没人喜欢这样的天气，“老狗”也是。\n	此刻，他正在那大雪纷飞中摸索着前进的路，他没想到今天的天气会如此恶劣。脸上的肌肉早已因这冰雪寒风而没了知觉，只剩那尚存余温的嘴巴不是呼出一阵短暂的热气提醒他仍旧活着。\n但他的运气还不像这天气那样差，在暴雪中不知道走了多久，他终于看到了那个他最熟悉的小木屋。他艰难地向木屋靠近，似乎每走一步，就会有雪把他前一步的脚印严丝合缝地重新盖上，到了大门前，他伸手从怀里掏出了一串钥匙，差点因手的颤抖掉在地上，用它打开了门。\n    回到家里，“老狗”终于感到了一丝放松，他抖了抖身上的雪，来到壁炉前，走之前的烧的木柴现在还剩一些在烧。于是他吃力地伸展开那两只因严寒而变得通红僵硬的手，企图用这火焰燎起它们往日的活力，逐渐地，在双手恢复直觉后，“老狗”脱下他那件湿漉漉的大衣，把它放在火前烘烤，然后，他站起身来，去柜子中翻出了一瓶有些年头的酒，又拿出一个精致的，干净如新的玻璃杯，用它盛满了酒，“老狗”看着酒面上泛起的阵阵涟漪，看着因这涟漪而变得有些扭曲的自己的脸，“这酒品质不怎么样。”，他想，“但至少够烈，能暖暖身子也是不错。”就在他准备一饮而尽的时候，门突然被踹开了，他被吓了一跳，下意识转头看去，却只看到两只黑洞洞的枪口正指着他，他意识到，土匪也被这风雪驱赶到了他的林中小屋。\n	“这房子现在归我们了，快滚！”\n    “为什么我们不能一起住呢？”\n	“我们怎么知道你半夜会不会干什么，别他妈废话！”\n    “老狗”沉默了，他无奈地叹了一口气，缓缓向门口挪去，每走一步，他就感觉四周好像黑上一分，“你他妈快点！”“老狗”加快了脚步，当他终于走到了门外，正打算回头再看一眼他的老伙计时，门被用力关上了，“老狗”觉得他好像被黑暗笼罩了，就这么站在原地，怔住了。但寒风如一根根细针刺入了他的脸，他的躯体，他的心，把他从那无尽黑暗中拽了出来。\n   现在，“老狗”没有了家。"
OMS_POSTNUKE.112.a: "而桌上那杯浊酒，也还没来得及下肚。"
OMS_POSTNUKE.113.t: "日复一日"
OMS_POSTNUKE.113.desc: "烟雾环绕，遮盖的是浑浊的眼，酒精入喉，麻醉的是躁动的心。没人知道他是谁，没人在乎他的故事。\n\n他可真称得上是社会的寄生虫了，只能靠别人偶发的善意过日子，但就算这样，他还是要从每天的三瓜两枣中尽力抠出几个子，攒上几天，去找人换成烟和酒并细细品尝这来之不易的享受，你经常能看见他正背靠着墙壁一个人默默抽烟或喝酒。\n\n据说，有一天，他正如往常一样在喝着酒，这时旁边走来了一个流浪汉，那流浪汉向他讨口酒喝，但他不仅拒绝，还非常粗鲁地让那流浪汉滚，兴许是被他的无礼激怒了。两个人很快从言语冲突变为扭打在一起，但他毕竟总是营养不良，还有抽烟喝酒的习惯，身板子弱，很快就败下阵来，被打得鼻青脸肿，手里的半瓶酒也被那流浪汉抢了去，他呢？只能独自从地上爬起来，拍拍身上的灰，继续讨要下一瓶酒的钱。有人说，他就是从这一战中学会了些规矩。\n\n但他的生活也并不总是这样不愉快，有时候，特别是一些休息日，他会在晚上走进一家小酒馆，但他可没什么钱去买酒，他会找一个不是很起眼的角落，就静静地站在那，听来酒馆放松的人讲一些他不认识的人的八卦，这对他来说已是最大的欢乐了，但他也不只是来听故事的，他会等人们走得差不多了，去检他们喝剩的酒喝，只有这样他才能喝到一些平时根本喝不起的酒，那些他常去的酒馆的老板大多已经习惯了，也并没有多说他什么。于是他就这样带着半脑子稀奇古怪的故事和半脑子杂七杂八的酒，摇摇晃晃地，满足地走出酒馆，随便找个地方睡下，就这样度过一天。\n\n人们都说他从没有什么朋友，但据认识了他很久的人说，这是不对的，大概在很多年前，他是和一个年轻小伙一起生存的，那时他还没有什么抽烟喝酒的习惯，脸上也时不时会有些笑容，后来有一天，有人发现了那个年轻小伙的尸体，有人说这小伙是饿死的，也有人说这小伙是偷东西叫人打死的，但那已经不重要了，反正他从那天起就染上了烟酒，脸上也总是挂着一副冰冷的，漠不关心的表情。有人同情他，想给他一些钱，但都被当时的他拒绝了。\n\n"
OMS_POSTNUKE.113.a: "就这样一天接着一天，直到他不再出现。"
OMS_POSTNUKE.114.t: "终末之前"
OMS_POSTNUKE.114.desc: "距那场毁灭世界的大战已经过去了许多年，随着时间的流逝，过去的伤痛被逐渐抹平，幸存下来的人们昂着头，继续向下一天前进。\n在那寂静的俄罗斯大地上，有传闻说布哈林还活着，就是那个被认为与苏联战败密不可分的男人。说他现在正藏在某个深山老林中，有些人想找到并审判他，有些人则希望借他去了解那场浩劫之前的事，那许多人都已淡忘了的浩劫之前的故事，就好像它们从未发生过。还有些传闻说在遥远的西方，与俄罗斯人有着血海深仇的条顿人也活着，但那实在遥远，也不易去考证了。\n有一批人，他们着魔似地四处宣传，称人类所经历的一切是神的旨意，他们将浩劫前后分别称作旧世界与新世界，并指出，是神让旧世界的一切灭亡，而他们，这些诞生于新世界的人类，是神的使者，他们的任务是带领新世界的人们前进，不再重蹈旧世界的覆辙，让新世界在旧世界的尸骸之上茁壮成长。自然有人反对他们，称旧世界并未完全消散，有许多事物可以证实它仍然存在，他们也并不是神的使者，而是彻头彻尾的骗子。\n还有一批人，他们是旧世界的残党，他们的记忆中尘封着那些过去的，形形色色的历史，他们不能接受失去了大部分东西的事实，他们或变得癫狂，或变得抑郁，他们声称现在的一切都是假的，都是虚无，他们不愿意从过去的泡影中走出来，他们走不出来，过去如锁链般紧紧缠绕在他们身上，他们都是活在过去的人，他们都是本应死在那场浩劫中的人。\n但是，废土上的所有人，新世界上的所有人，他们无一例外地，都在拼了命地寻找有关那场浩劫的，或浩劫之前的故事，口头讲述也好，文件记录也罢，他们贪婪地吸收着有关过去的一切，他们或许抹平了旧日创伤，或许还没有，那过去的一切也好似被撕成了千片万片的碎片，被撒向世界各处，有些被扔入大海，永不见天日，有些被掷入岩浆，化为尘埃，随风飘散到无穷的远方，还有些落在人的手心，被人知晓。\n过去变成了虚无，人类则负责填充它，尽管七零八落，混乱不堪。\n"
OMS_POSTNUKE.114.a: "人们不断探寻过去的故事，拼接历史的碎瓦。"
OMS_POSTNUKE.115.t: "罪与罚"
OMS_POSTNUKE.115.desc: "“你确定，这下面就是那些纳粹的所谓坟场？”黑色联盟军官安德烈.尤波夫带着几个士兵，押着几十个从纳粹定居点里搜罗出来的德国俘虏，对着他身后的几名衣衫褴褛的乌克兰人问道。\n\n“是的，将军，我们以前是乌克兰的红军，部队被打散之后，我们几个跟着兄弟们被一块押到这个地方来，其他同志都被他们杀了，我们几个侥幸活了下来，又这些纳粹抓起来当奴隶。有几个兄弟没挺住，也被这些纳粹给迫害死了”\n\n“好，那让我看看！”尤波夫回头看向身后的男男女女，眼中的怒火似乎要喷涌而出。“狗日的条顿垃圾们，现在，你们马上把这个地方给我刨开！谁要是敢跑，我立刻毙了你们！”\n\n这群德国人不敢怠慢，立刻开始了工作，尤波夫给了那几个乌克兰人几杆枪让他们监工。在他们的枪杆子下，一些试图偷懒的德国居民也抓紧干起了活。很快，在一个女居民的惊呼之中，尤波夫走过去一看，一具白骨已经显现出来。\n\n“愣着干什么，给我沿着这里继续挖！”\n\n很快，一个大坑就被刨了出来，一些胆小的德国居民想丢下手里的东西逃跑，立刻就被枪毙了。在这个大坑里，尤波夫只是一眼往去，就至少看见了二十多具白骨。他强忍着不适，让手下的士兵们挨个把这些白骨带出来，而在这个过程中，士兵告诉了他一个更严重的现实。\n\n“你是说，就在他们下面，还有一个更大的坑，纳粹还杀了更多的人都埋在这里？”尤波夫不敢置信的看着眼前的士兵。\n\n士兵点了点头，尤波夫的双手紧攥成拳，一股由衷的愤怒涌上心头。他看向身旁已经跪在地上痛哭不止的乌克兰人：“兄弟们，你们受苦了，我们会收敛这些祖国的烈士的。”\n\n他转过头来，面色铁青的看向那些瑟瑟发抖的纳粹定居者们：“至于你们，现在，马上再挖一个坑，在挖好之后，你们给我自觉的跳进去！”\n"
OMS_POSTNUKE.115.a: "我们将亲手，把你们犯下的一笔一笔血债，逐一惩罚！"
OMS_POSTNUKE.116.t: "天罗地网"
OMS_POSTNUKE.116.desc: "“先生，我们是法国费加罗报的战地记者，已经向俄罗斯政府和大日耳曼尼亚政府申请了在本地战区进行采访的权力，你们不能非法抓捕我们！”\n\n“先生，我是来自阿姆斯特丹的商人，来到这里进行合法生意，我要向你们的外交部抗议这种非法抓捕公民行为！”\n\n“先生，作为丹麦公民，我强烈抗议你们在外国人居住区的非法逮捕和虐杀行为！”\n....\n“住口！住口！你们这帮喋喋不休的帮凶！”沃尔科夫一打开仓库的大门，就看见一堆来自各国的人从地上站起来，向他发出各种问题，抗议把他们从聚居区抓到这个所谓的临时监狱的所谓“暴行”。虽然从一开始，沃尔科夫就很看不起这些来到纳粹占据的土地上做什么“合法生意”的外国人们，而看着这帮人现在的样子，他情不自禁的掏出了手枪，往地上开了一枪。\n\n一声枪响过后，所有的外国人都安静了，他们向身后缩去，而沃尔科夫也终于笑了笑，招呼着手下的士兵进了仓库。\n\n“先生，我谨代表红十字会驻莫斯科维恩分部代表，向您抗议俄罗斯军队迫害本地公民....”\n\n沃尔科夫的手枪直接转过去，对着那个女代表开了火。“很好，我就知道，纳粹总是藏不住的。你们这群渣滓！”他又掏出一个弹夹，上了弹。“我知道，你们这群自命不凡的欧洲人，一直瞧不起我们俄罗斯人，瞧瞧你们，法国人，丹麦人，荷兰人，匈牙利人，哪个不是纳粹的支持者和同情者，你们这样的人一边来到我们祖国的国土上，帮助那些该死的纳粹入侵者，一边仗着自己所谓外国人的身份，压迫我们俄罗斯人的生存权力！”\n\n“先生，我们作为外国公民申请合法避难，您现在的话语是否代表俄罗斯政府的立场？”\n\n“外国公民？我在这里没有看见什么外国合法公民，只看到了一群纳粹自称自己是外国人，然后对着伟大的俄罗斯人指手画脚！”沃尔科夫一声令下，士兵们迅速开火，将这群喋喋不休的外国人通通打死。他随即向上级汇报了这一结果，而上级也很快发来了一条军事命令。\n"
OMS_POSTNUKE.116.a: "全体部队通报，如遭遇自称来自非条顿的欧洲国家及地区国民，一律视为纳粹合作者处死。"
OMS_POSTNUKE.117.t: "“清洗即生命”"
OMS_POSTNUKE.117.desc: "乌拉尔地区“祖国”综合掩体群，\n深度：600m\n\n通风管道低沉的嗡鸣是这座钢铁坟墓永恒的主旋律，伴随不知道在过滤系统中循环了多少遍的，味道令人难以形容的空气，无时无刻不在折磨着这里的所有人。上尉米哈伊尔推开审讯室的铁门，看到那刺目的氙气灯将惨白的光泼洒在每一个角落，不留一丝阴影。在这个小房间内唯一的色彩，是悬挂在正前方巨幅防弹板上的亚佐夫总司令肖像。那双被刻意放大的、鹰隼般的眼睛在强光灯下死死的盯着房间中央。肖像下方，一行暗红色标语扭曲而狰狞：“向一切腐败分子宣战!”\n\n随着他的到来，三人小组正式集齐，“姓名！”主审官彼得罗夫少校开始了流程。被告席上，后勤中尉谢苗诺夫，像一袋被抽去骨头的肉一样瘫在椅子上。米哈伊尔记得他一个月前在配给站分发合成蛋白块时的样子，那时他还能挤出一点假笑。现在，那张失去神采的脸上只剩下死灰。\n\n“谢苗诺夫·彼得罗维奇，中尉，后勤保障部第3食品分配站···”少校的手指一下下敲击着金属桌面。旁边的记录员和面无表情的“见证员”（内务部的人）如同两尊雕塑。\n\n“未经授权挪用：标准营养膏350公斤；高效维生素D合成浓缩液45升；净水核心滤芯15套······”记录员平板地念着清单:“通过非授权渠道换取：个人娱乐数据卡、额外电力配给额度、以及······”记录员停顿了一下，毫无感情地补充，“未经批准的烈性酒类500毫升。”\n\n“证据确凿！”少校猛地站起，金属椅腿刮擦地面，发出刺耳的嘎吱声。他指着谢苗诺夫，声音带着一种表演式的兴奋：“蛀虫！叛徒！总司令带领我们熬过了核爆，熬过了地表的死亡寒冬！每一克食物，每一滴水，每一片药，都是我们从烂泥和石头缝里抠出来的！是维持俄罗斯最后血脉的基石！而你！”他唾沫横飞，“你在吸食这血脉！你的贪婪，就是对着总司令的心脏，对着我们所有人的肺叶插刀子！”\n\n随着少校一挥手，两名“净化员”从阴影中走出，将谢苗诺夫送到一个小隔间内:里面有一个看样子已经很旧了的断头台。从那繁复的花纹，米哈伊尔可以推断出那是俄罗斯帝国时期的产物。它的刀片到现在依然明亮锋利，不知道已经换过几茬了？他漫无目的地胡乱思索着，而少校已经对这个人的命运下了总判决:“三人小组一致裁定：叛国罪、特大腐败罪成立！依据《黑色联盟特殊时期犯罪处理办法》最高惩处！死刑！立即执行！”\n\n谢苗诺夫的嘴唇翕动着，似乎想说什么——也许关于他辐射病恶化的妻子？但恐惧彻底封住了他的喉咙，谢苗诺夫一句话也说不出来。\n\n“唰——”随着刀片的落下，他再也不会有机会辩解了。而三名判官甚至懒得再多说一句话。\n"
OMS_POSTNUKE.117.a: "其他人走后，他们若无其事地走进旋转门，抽起了配给之外的雪茄。"
OMS_POSTNUKE.118.t: "“仇恨，永无休止”"
OMS_POSTNUKE.118.desc: "萨马廖夫正用一片不知从谁的衣服上割下来的布擦拭着自己那已经砍到卷刃的军刀。砍掉几个不服从的德畜，看着那些条顿平民们慌乱的哭喊，奔逃，然后萨马廖夫再用他高超的射击技术一个一个将他们枪毙，这样的屠杀活动已经成为了他这段时间的最大娱乐。可突然，一个晕厥的日耳曼孩童的样子把他的思绪勾向了过去。恍惚间，他的思维回到了过去，年轻时老师曾给他展示过的被杀害的俄罗斯儿童的图片与当下的场景重合了。\n     \n本已厌倦的萨马廖夫的怒火突然重燃，不过现在不是发作的时候，因为他想到了一个绝妙的折磨方法······\n\n在确认了对方彻底失去了意识以后，萨马廖夫套上一件干净的衣服，擦掉周身的血迹，捋捋头发，随手从一个化妆品店里拿了一瓶香水，在身上喷了半瓶，这样，一个温文尔雅的叔叔（至少他自己这么觉得）就诞生了。\n\n他一点点唤醒小女孩，装作一副害怕的样子，神情紧张的用德语对她说:“小妹妹，你怎么一个人在这里？很危险，你快去找你的父母吧!”\n\n小女孩闻言，瞳孔慢慢聚焦，直勾勾地看着他，声音抽噎:“叔叔，你是······来救我的么（抽泣）······我的（抽泣）父亲不见了，我和母亲也走丢了······我不知道她说的‘避难所’地址在哪······”\n\n萨马廖夫一阵激动，不过为了不露馅，他压抑着自己的兴奋，连哄带骗的让小女孩说出了地址，在到达目的地，通过蛛丝马迹确认了目标以后，他一把捂住女孩的嘴，将她的喉咙割开，然后一刀捅进了她的心脏。在女孩绝望的目光中，他通知了队友，并且死死守在出口。\n\n等到工兵将大门打开，在经过简单的灭绝处理后，萨马廖夫满意地望着一地面色青紫的尸体和眼前小女孩临死前的神态鉴赏了一会，回过神来，他在心里对自己说:“我们正在和以前的德国畜生们做一样的事，但是都是他们自找的。德国人洋洋自得地杀了我们那么多同胞，当他们作孽的时候，就应该想到自己也会有这样的一天。”\n"
OMS_POSTNUKE.118.a: "然后他们仔仔细细的检查了一遍，确保没有任何活口。"
OMS_POSTNUKE.119.t: "萨马廖夫的回忆"
OMS_POSTNUKE.119.desc: "塔拉市第二中学内，才只有15岁的萨马廖夫正正襟危坐，在他的前面，穿着一件黑色军大衣的老师正在授课，他是一个西俄老兵，一条腿被德国人的弹片炸断了，他用那蕴含着永不熄灭的仇恨之火的眸子盯着学生们:“有些同学可能还不太清楚，为什么我们一定要将德国人全部消灭，为什么一定要进行大审判，过了今天这样的疑问就不会再有了。因为我将回答你们的这个问题。”\n\n他翻开一本巨大的图册，第一张图是一张德国报纸的剪影:上面是俄罗斯平民堆叠如山的尸体，和一个特写，那是德国军官脸上得意而血腥的微笑。报纸标题是:东方总计划正稳步推行，预计至1955年，莫斯科专员辖区能够为德意志平民提供约500万的就业岗位。下一页，是对一位从德国治下逃出来的俄罗斯老人的采访。\n\n“妈的······这帮畜生······”萨马廖夫的心中当时只有这一个念头，而接下来的数据让他更加愤怒。\n\n经过统计直接死在德国人手里的斯拉夫人的数目 ，那串七位的血红数字让学生们心惊肉跳······以各种方式死去的俄罗斯人被贴在纳粹的报纸上······老师接着说道:“那帮纳粹杂种是一帮彻头彻尾的刽子手，他们走到哪里，就杀到哪里 俄罗斯人，乌克兰人，白俄罗斯人，拉脱维亚人，鞑靼人，克里米亚人，他们把化学战，细菌战，以及这世间一切肮脏的手段全部加诸于我们身上。这些狗屎甚至用那该死的飞机对着俄罗斯轰炸了将近20年!”老师喝了口水，然后接着用发射子弹的劲头挥洒着自己的唾沫，显然他已经沉浸在了怒火中:“他们只会无休止的破坏，并且不知廉耻的声称自己那卑贱的条顿血统是什么昭昭天命!他们就是地球的蛀虫，人类的败类!有仇报仇，有怨报怨，所以德国一定要灭亡!”老师声嘶力竭的吼着，他的吐字如此有力，仿佛他的话语会变成炮弹砸向德国人，仿佛他又回到了以前，成为了一名士兵一般······\n\n课后，本来应该熙熙攘攘的孩子们却没有发出半点声响，而萨马廖夫暗自握紧了拳头······\n"
OMS_POSTNUKE.119.a: "自那时起，他便下定了决心"
OMS_POSTNUKE.120.t: "“动摇”"
OMS_POSTNUKE.120.desc: "到达了集中营，少校维克托推开牢房大门，映入眼帘的是各种各样的脸，有惊慌失措而充满乞求的，有因恐惧而缩成一团的，有因愤怒而青筋暴起的，也有已经麻木，无喜无悲的。而他要找的正是第一类。\n\n按照惯例，他先用芬兰语问了一句:“有谁愿意为黑色联盟效力？此时提出可以获得优待，有机会在本地任职官员。而抵抗者将被处决。”\n\n在一阵短暂的沉默后，一个满脸惊慌的中年人的肩膀动了动，似乎想要举起手，但他身边一个被绑住双手的年轻人重重的顶了他一下，然后年轻人面目狰狞地朝着维克托吼出了声:“你这个叛徒，黑色联盟这些猪狗不如的畜生、侵略者，用他们那肮脏的靴子践踏芬兰，他们要毁了芬兰，而你，你说着芬兰语，却帮助这些败类！”维克托似乎被气笑了，他从鼻子里挤出一声轻蔑的哼声，然后重重的抽了他一个耳光:“我不是芬兰人。我是被你们这些芬兰狗屎硬生生和自己的祖国分离的俄罗斯人！你们逼迫着我们的父辈和自己的手足相残，而你们却坐在我们俄罗斯的领土上，压迫着我们的人民！我不敢相信你究竟是有多么厚的脸皮才能够说出‘俄罗斯是侵略者’这样的鬼话来？！”\n\n年轻人也死死的盯着他的眼睛:“如果冬季战争和你们现在在做的不叫侵略，什么叫做侵略？芬兰一直以来只是在自我防卫！而你们俄罗斯人的本性就是这样，你们天生就是该死的侵略者和强盗！奥涅加和摩尔曼斯克是我们理所当然对你们一直以来强盗行径收取的利息！”\n\n维克托更生气了，他毫不示弱地瞪了回去:“无知的蠢货，芬兰总是想要更多的领土，软弱无能的共产党把佩特萨莫割让给了你们，换来的却是你们从本该属于俄罗斯的东卡累利阿撤军，和整个三十年代对德不断靠近的态度!还有，利息？按照你这么说，芬兰被俄罗斯整个消灭了也是利息！”\n\n年轻人嘴唇蠕动了几下，似乎还想说什么，但维克托把他的嘴塞住，然后连着抽了数个耳光。一直到把自己的手打肿了，维克托才停下。他一脸鄙夷地欣赏了一会年轻人脸上愤怒而难堪的表情，用长靴狠狠将他的脸踩得血肉模糊，拍拍手，说到:“卫兵，把这个顽固分子拉下去毙了！好了，现在还有人要投诚吗？”\n"
OMS_POSTNUKE.120.a: "有五个人陆陆续续举起了手。"
OMS_POSTNUKE.121.t: "再无净土"
OMS_POSTNUKE.121.desc: "卡尔·施泰因用暗号敲响了伪装起来的地堡大门，很快，门打开了一条小缝，他迅速闪身进去，随后，这里的景象就像一切都没有发生过一般。\n\n“看看我找到了什么!足足一箱以前生产的番茄罐头!还有一大堆马铃薯!”卡尔的笑容显得有些扭曲，尽管隔着那略显狰狞的破烂防毒面具，他的兴奋还是肉眼可见。庇护所里的幸存者们闻言全部凑了过来，这里有他形同枯槁的妻子，他那瘦的像鬼影一般的孩子，十几年前由于吸入大量残留毒气而得了肺病的老施罗德，流水线工人施密特······\n\n一股轻松而愉悦的气氛在众人间弥漫开来，人们低声窃语着，享受着难得的好消息。卡尔用已经有些龟裂的手指小心翼翼的从火堆中掏出那个受辐射影响已经变得奇形怪状的马铃薯，剥开那层厚厚的，带着疣状凸起的外皮。尽管这东西看着很不详，无论是吃起来还是闻起来都非常糟糕，但它起码是一种可食用的作物。\n\n光线忽明忽暗，电工汉克皱着眉头去检查起了他们的地堡深处唯一的光源——那是角落里用废弃汽车蓄电池接通的小灯泡，在以前，这种老旧的白炽灯他们看都不会看一眼，现在这却成了垃圾堆里难得的宝物。\n\n水烧开了，卡尔将某种变异真菌和一大块长得异常旺盛的苔藓同那个马铃薯一起放入空罐头盒中。没过几分钟，那坨混合物就变成了一锅糊状的、深绿色的稀汤，一股浓烈的腥味，淀粉香混合着淡淡腐臭味的空气弥漫开来，这就是他们今天晚上所有的食物了——卡尔恨不得连这些东西都掰开两半来用，现在他们的水资源告罄，方圆十里干净的水源早已被残存的政府组织占用，而他们根本承担不起取水费用······无言中，众人相对而眠。\n\n第二天，清晨\n\n卡尔套上那总是会让他呼吸不畅的防毒面具，裹上里三层外三层，权当防护服的破布，再次踏上了行程。然而走着走着，他逐渐感觉有些不对，地面在震颤，并且动静越来越大。没时间想那么多了，他立刻向着地堡跑去，然而在他爬上那座必经的小山坡时，地狱般的景象映入眼帘:那是几十辆做了伪装，涂了厚厚的防辐射层，并且全副武装的迷彩装甲车。\n\n“这不可能是政府，他们没有这样的力量······那么，难道······”恐怖的猜想浮现，他冒死凑到近前，观察着这些钢铁巨兽，好在上面的观察员没有发现他，可是明白事情的真相后，他感觉自己还不如死了:\n"
OMS_POSTNUKE.121.a: "那装甲车上的标志是白色的双头鹰。"
OMS_POSTNUKE.122.t: "最后的军令"
OMS_POSTNUKE.122.desc: "杜达耶夫和谢尔盖戴着厚厚的防辐射面具，带着一整支干员小队走在前方。在联盟高层开始逐步与周边地区建立联系后，杜达耶夫的干员小队就被派到了西边，在这里他所接到的命令是莫斯科地区的俄罗斯军队接头。上面传来的任务简报里，在大审判之后，联盟派出了一支部队前往莫斯科，向条顿领土上进发，去把剩下的纳粹通通杀光。但自从派出之后，这支部队就了无音讯。为保障大审判事业的最后成功，必须立刻与莫斯科驻军建立联系。因此，杜达耶夫他们被派去莫斯科方向，如有可能，把联盟高层之一的叶夫根尼.萨温采夫接回来。\n\n靠着联盟在地堡中改进的电讯接收设备，杜达耶夫一行很快就找到了黑色联盟专用的内部信号。这个信号明显不考虑安全性，完全是明码播放。谢尔盖皱起了眉头，想斥责几句，却被杜达耶夫拦住了。\n\n“老兄，咱们的补给还够吧?”谢尔盖看向杜达耶夫，从小小的观察窗中他明显看出了一丝迟疑：“老弟，你问这个干什么，上面给安排的补给都够咱们再安置好几个人了。”\n\n杜达耶夫没有说话，谢尔盖的心里也犯起了嘀咕。两人继续带着小队朝着信号发出的地方行军。在一次小范围搜索后，小队找到了一间屋子，在确认这里就是信号发出地后，杜达耶夫带头，联盟的小队踹开了这间墙壁上写着：莫斯科最高军官指挥所的大门。在门后他们看到了一个同样穿着黑衣服的形同枯骨的士兵，即使他们全都进来，这个士兵也只是呆呆的坐在椅子上，并无动作。\n\n”喂，士兵，我们是俄罗斯政府第15号复兴小队，你是莫斯科集团军的人吗？“\n\n”啊，啊，要保卫莫斯科了。“那个士兵突然怔怔的站起身，嘴里几乎是拼凑着说出一句话。”兄弟，司令已经下命令了，马上拿好武器，保卫莫斯科。“\n\n”叶夫根尼司令呢，他去哪了？“\n\n”司令？对，要去找司令。“跟着这个士兵，小队找到了一间屋子，放眼望去，四处都是白骨，而这个家伙则是翻出了一所电台，开始拨号。很快，电台里便传来了熟悉的电文：“遵照总司令指示，各级干员和士兵们，请坚守在岗位上，等待大审判结束！”\n\n两人相顾无言，瞬间明白了什么。杜达耶夫下达了最后的指令。“士兵，联盟已经确认，莫斯科保卫战胜利结束，集团军司令叶夫根尼.萨温采夫，在保卫莫斯科之战中英勇牺牲。你的职责结束了。”\n\n听完这句话，那个士兵突然愣了愣，直挺挺的倒在地上，没了气。两人招呼着把指挥所还能用的东西赶紧往出搬。在最后出去的时候，谢尔盖看着桌子上还在自动发声的电台，默默的关闭了按钮。然后带着小队，头也不回的离开了。\n"
OMS_POSTNUKE.122.a: "今日以后，莫斯科的夜空静悄悄。"
OMS_POSTNUKE.123.t: "心肺骤停，再一次"
OMS_POSTNUKE.123.desc: "日耳曼尼亚铅灰色的天空如同一块厚厚的毯子，将大地死死裹住，悬浮的尘埃数十年不曾消散。这座曾经的伟大之城，实际上已与消失无异。这里无法进行任何有意义的人类活动，苟延残喘的日耳曼国仅能够把她继续作为国家的名义首都——他们最多只能做到这步了。\n\n海因里希·穆勒站在冰冷的水泥台阶上守着地堡大门，这里的生活也是铅灰色的，他的数十年未曾变过——搜寻各种各样的东西，或者是人，以及守卫地堡，不过大家都明白所谓“守卫”，只是防备土匪流寇，而对于正规的军事力量······他还没来得及接着想下去，一种他以为早已被自己遗忘的声音便撕裂了地堡沉寂的空气，那是旧时代遗留的，尚有一定功能的防空警报!海因里希的心脏像被一只冰冷的手攥住，瞬间停止了跳动。紧接着，是沉重、整齐、带着金属回音的撞击声，从头顶的废墟传来，越来越近，越来越响——这种声音他同样很熟悉，那是长筒靴，以前他在国防军服役的时候，这种声音被他听了千万遍。绝望笼罩了他的心间，他在很早前就听说过关于黑色联盟的流言，前线宣战的消息也早早传入他的耳朵，不过他并不关心这些，毕竟一个快入土的老头子能干什么?而现在······他恐怕自己要没个善终了。\n\n“砰！”一声巨响，封堵入口的厚重金属板被粗暴炸开。刺眼的白光手电柱猛地刺入昏暗的地堡，灰尘在光柱中疯狂舞动。呛人的硝烟味混杂着一种更刺鼻的化学药剂气息涌了进来。深灰色的人影如同地狱涌出的鬼魅，戴着防毒面具，镜片后是毫无感情的眼睛。不速之客们的臂章上，那一只只金色的双头鹰，在电筒光下反射着冷酷的光芒。\n\n“出来！条顿狗!”黑色联盟的士兵立刻就控制了现场，枪托毫不留情地砸在每一个试图后退的人身上，骨裂声和惨叫声在地堡狭窄空间里回荡。士兵们像驱赶牲畜一样，用枪口把瑟缩的人群逼向被炸开的洞口。海因里希被粗暴地推搡着，踉跄地爬上瓦砾堆。\n\n外面是铅灰色、永远阴沉的天空。刺骨的寒风抽打着他裸露的脸颊。眼前的景象让他胃部翻搅：一队队形容枯槁、眼神空洞的德国幸存者，他们在刺刀和皮鞭的驱赶下被粗暴地推搡、殴打，编成长长的队列。哭喊声、呵斥声、枪托击打在肉体上的闷响，汇成一片令人窒息的进行曲。\n\n一个士兵粗暴地抓住海因里希的胳膊，将他拽离人群。另一个士兵，臂上的鹰徽闪着寒光，拿起一个喷壶，将里面粘稠、散发着强烈消毒水味的深绿色液体，劈头盖脸地喷在海因里希身上。液体刺痛皮肤，灼烧着他的眼睛。\n\n“猪猡，算你走运，”喷液的士兵用俄语嘲弄道，声音透过防毒面具嗡嗡作响，“‘净化’完成。现在，去矿坑！为黑色联盟掘出你们土地里最后一点价值！”他将海因里希推搡向另一队扛着简陋矿镐、走向远处巨大露天矿坑的人群。矿坑边缘，巨大的黑色旗帜在辐射风中猎猎作响，正如捕到猎物的雄鹰，俯视着脚下如蚂蚁般渺小的德国奴隶们。\n"
OMS_POSTNUKE.123.a: "别以为进地狱走了一遭就可以还清你们所做的罪孽。"
OMS_POSTNUKE.124.t: "“腐烂”"
OMS_POSTNUKE.124.desc: "库茨涅佐夫，或者说350234号干员，作为联盟中央管理局的特派腐败清查小组组员被外派到克拉斯诺亚尔斯克已经三天了。他通过秘密渠道掌握了关于当地官僚系统性腐败的蛛丝马迹，可他们的调查工作却遇到了重重阻力，仿佛他不是在清除俄罗斯的蛀虫，而是在和整个联盟作对一样。\n\n······\n\n在3号铅矿，矿场负责人，一个脸上刻满风霜、眼神浑浊如地下暗河的上校，慢吞吞地翻看着文件，然后说到:“特派员同志，很不巧，主升降井正在例行压力维护，强制停机四十八小时。安全条例，您理解吧？” 库茨涅佐夫要求步行深入，可对方只是摊开布满老茧的手：“下面的粉尘浓度超标，而且是强辐射残留区。如果没有专业防护设备，您独自下去极易出现辐射病症状。设备······很不幸，刚送去‘中央维护站’保养了。” 库茨涅佐夫冷笑了一声，继续追问，可得到的却只有一通抓不住把柄的，滑不溜秋的废话，二人踢了半个小时的皮球，库茨涅佐夫却半点进展也没有得到。他只得暂时放下这个问题，走向档案数据库，可当他要求查账的时候，档案室主管却一脸歉意：“非常抱歉，特派员同志，系统正在进行‘关键数据迁移’，历史记录暂时······嗯，处于锁定状态，无法访问。预计一周后恢复。”“一周？!你们他妈······” 库茨涅佐夫只感到一股寒气混合着暴戾的情绪从自己的脚底板直直冲到了天灵盖，主管唯唯诺诺的回答更加激发了他心底的火气，他重重的瞪了那个贼眉鼠眼的男人一眼，威胁道:“你们最好别露出马脚。”，得到的回复却是:“话可不能这么说，特派员同志，不能冤枉好人呀！”\n\n库茨涅佐夫愤怒地赶到市委的办公室，向他说明了这不对劲的情况，市长格列博夫两眼一瞪，拍着胸脯保证“全力配合”。然而，每当库茨涅佐夫需要实质性的支持——比如一队可靠的卫兵去突查可疑仓库，或者强制调取某个关键人物的通讯记录——格列博夫永远“恰巧”不在。他的副手，一个脸上永远挂着职业化微笑的上尉，成了完美的缓冲。“中校正在主持紧急防务会议，特派员同志，非常重要，关于深层岩层应力监测······” “您需要的权限？哦，那个需要本地安全委员会的交叉验证，流程可能有点长······” 微笑，歉意，拖延。他的一切努力都如同一拳打在浸透水的棉絮里，无声无息，并且翻不起任何浪花。\n\n······\n\n“结论：经调查，克拉斯诺亚尔斯克地区的后勤管理存在一定技术性疏漏，相关人员警惕性不足，已予以口头训诫。未发现系统性腐败证据。建议······加强思想教育。”随着这几个大字落下，库茨涅佐夫终于支撑不住，无力地倚靠在座椅背上。整整两周时间过去，明天就该踏上归途，可他······库茨涅佐夫失神地望着手上，那份来自鄂木斯克、盖着最高统帅亚佐夫元帅血红印章的“特别调查授权令”，此刻像它一块烧红的烙铁，烫得他指尖发麻，却又冰冷得让他心头发颤——它在这里，一文不值。库茨涅佐夫愤恨地把桌子锤的邦邦响，而隔音门外的守卫似是心有所感，回过头对他露出了一个笑容。库茨涅佐夫感觉他想表达的不是善意，而是无声的嘲讽。\n"
OMS_POSTNUKE.124.a: "妈的，这个鬼地方烂到根里了······"
OMS_POSTNUKE.125.t: "拔出萝卜带出泥"
OMS_POSTNUKE.125.desc: "“咚咚咚”\n\n亚佐夫的办公室再次迎来了一位访客，警卫们将350234号干员，也就是库茨涅佐夫带了进来。\n\n望着眼前似乎曾有不少印象的中年男子，亚佐夫思索片刻，想起了他的身份——男人曾经是鄂木斯克内务部的一名区级干部，由于出色的能力和缜密的逻辑被亚佐夫破格提拔为中校，并且直属于他个人，自己曾派遣他到克拉斯诺亚尔斯克地区进行反腐调查。回忆到这，亚佐夫停下思索，指了指对面的椅子，示意对方坐下。\n\n“调查结果如何？”\n\n“我有罪······总司令同志，您派我前去的米努辛斯克地堡群情况很不对，但当我要求查找某些数据，或者调查一些可能存在腐败的部门的时候，从基层的职员到模块的负责人，所有人都在拖延，误导，并且对我们进行信息封锁和全方位监视，甚至于出现数据莫名丢失，关键证人意外身亡的现象······我们所遭受的阻力不是孤立的，这绝对是一张牵扯巨大的关系网。他们把掩饰工作做的很好，我们在明面上没有发现什么决定性的证据。我推测这其中一定存在巨大的问题······可是我无法将这些问题找出来······元帅同志，我需要您增派精锐，可靠的内务部突击队，并且授予我跨区域，跨层级的最高权限，并且获得与您直接实时通讯的权限。”\n\n听完此言，亚佐夫的脸色已阴沉似水，他的身体略微前倾、指尖不断敲打着扶手，并用冰冷的眼神仔细审视着库茨涅佐夫，与他对视了良久，才终于开口说道:“干员350234，你确定你能为你说的话负责任吗？你要知道，这种事情如果是真的，那它的牵扯会非常的深。而且其他地方的调查员可没有发现什么乱子，你要怎么取信于我？”\n\n库茨涅佐夫深吸一口气，直视着亚佐夫，感受着他身上正在酝酿的风暴:“总司令同志，我愿承担一切责任。而对于可信度，我这里有一些个人搞到的资料，望您过目。”\n\n······看着看着，亚佐夫身边的空气仿佛都凝固了，他皱起了眉头:“你确定，这些地方连内务部的部分机关也被渗透了？你的信息是怎么来的？消息为什么会比我的情报机构还要灵通？”\n\n“总司令同志，我在这些地方有一些认识的人，他们亲身参与了这个腐败网，我在未经允许的情况下用您的名义对他们进行了策反，效果很成功，所以您才能看到这份资料······您放心，这些消息绝对可靠。”亚索夫揉了揉眉心，思索良久，最终还是下了决定:“好，那我就准许你的请求，不过假如最后没有结果······你知道你会是什么下场的。”库茨涅佐夫感觉他的声音低沉的像打雷，但是令人意外的是，这个钢铁般的元帅的声音甚至带上了一丝他隐隐约约能辨别出来的······颤抖?\n"
OMS_POSTNUKE.125.a: "库茨涅佐夫暗中想着，“他是在害怕吗？”"
OMS_POSTNUKE.126.t: "腐烂的苦果"
OMS_POSTNUKE.126.desc: "库茨涅佐夫站在元帅办公室的大门前，手里紧握着那份还没有他手指厚、却重逾千钧的最终调查报告。周围空气循环系统低沉的嗡鸣此刻听起来像垂死者的喘息。他知道这报告将会让整个联盟天翻地覆，可是······开弓没有回头箭了。\n\n“进来。”亚佐夫沉稳的声音透过通讯器传来，库茨涅佐夫推门而入。不知是不是心理原因，库兹涅佐夫感觉往日他看了许多遍的墙壁此刻仿佛要倾轧下来一般，他调整好不宁的心绪。看向前方，亚佐夫元帅坐在巨大的金属办公桌后，背对着门，似是正在闭目养神。\n\n库茨涅佐夫并未寒暄，直接将报告放在桌面上，推了过去。“元帅同志，”他的声音干涩，“最终确认。您的战友，萨哈罗夫斯基，是整个克拉斯诺亚尔斯克地区腐败网络的核心节点。证据链···完整。”\n\n亚佐夫没有立刻转身。他的指关节因为用力而泛白，微微地、不受控制地颤抖着。时间仿佛停滞了数秒。终于，亚佐夫缓缓转过了椅子，他那张曾令敌人胆寒、令部下敬畏的脸，此刻灰败得如同饱经辐射的破烂树皮。他的脸上满是愧疚，疲惫，以及被彻底背叛后的茫然无措。亚佐夫的目光落在报告封面上萨哈罗夫斯基的名字上，眼神空洞而麻木，仿佛一下子老了十岁一般。\n\n“萨哈罗夫斯基···”亚佐夫的声音极低，像是梦呓，又像是从肺腑深处挤出的呻吟，“亚历山大···萨哈罗夫斯基···” 他重复着这个名字和父称，不是将军的头衔，而是最私密的称呼。他们是旧黑色联盟最后一批从西伯利亚军阀混战中爬出来的幸存者，是并肩决定按下核按钮、将整个世界拖入深渊的“同志”。亚佐夫一直在他的办公室抽屉深处珍藏着一张发黄的合影，上面是两个意气风发的年轻人，背景是未被核火焚烧的鄂木斯克郊外的针叶林——其中一个正是那个背叛了联盟理想的卑鄙小人。\n\n亚佐夫没有翻开报告。他抬起头，目光艰难地从报告上移开，投向库茨涅佐夫。元帅的嘴唇翕动着，最终却没有发出任何声音。那鹰隼般的眼睛里，库茨涅佐夫第一次清晰地看到了裂痕——不是愤怒，不是杀意，而是信念的动摇，一种深不见底的羞愧，以及随之而来的、对自身所构建的一切的微小却致命的怀疑。\n\n“他···几天前还在和我讨论那些战略事宜···” 亚佐夫的声音轻得几乎无法听见，带着一种库茨涅佐夫从未听过的疲惫。这句话仿佛抽干了亚佐夫所有的力气。他颓然地靠回椅背，挥了挥手，示意库茨涅佐夫离开。\n\n库茨涅佐夫无声地敬礼，转身。合金门在他身后沉重地合拢。办公室里只剩下通风系统永恒的低沉嗡鸣，以及那份静静躺在冰冷桌面上的报告——文字如同利刃般，割破了腐败的参天巨网，同时也割破了元帅的心脏。库茨涅佐夫走在冰冷的通道里，第一次感到，“大审判”审判的可能不只是德国人。\n"
OMS_POSTNUKE.126.a: "裂痕一旦出现，便不可阻挡。"
OMS_POSTNUKE.127.t: "前线法院"
OMS_POSTNUKE.127.desc: "当黑色联盟的军队大踏步前进的时候，佐伊亚的突击旅却不得不停下来脚步，他们被一群不速之“客”挡住了进攻的势头。\n\n“从他们身上询问出什么了吗？”佐伊亚从车上下来，望着眼前这些被他们吓破了胆的德国士兵，双手举过头顶发抖着，更不用说脸上是一把鼻涕一把泪。\n\n“没有，长官，他们都听不懂俄语。”负责审问的士兵刚说完，就被狠狠地抽了一个耳光。\n\n“什么都问不出来，那还不跟上部队，你通知先头部队，加快速度，我们要成为第一支烧光日耳曼尼亚的部队。”随着他下达了这道命令，他就成为了这些德国俘虏的审判官。\n\n“你们如果会一点俄语就好了，可惜你们什么都不会，只知道愚昧的抵抗我们。”话音刚落，一声枪响，一头栽倒地上。\n\n“你们甚至都不愿意告诉我，你们的指挥官，你们的指挥部在哪里。真是愚蠢的贱种。”第二声怒吼，伴随着枪响吓死了一个德国人。\n\n“现在，就剩你一个人了，你到底愿不愿意交代，你还会些什么。”黑洞洞的枪口顶在他的下颚，终于，在极端恐惧和失禁的刺激下，他终于招了。\n\n“我说，我说！我是······”\n\n“嘭”\n\n“胆小的人，会说俄语的人，会成为我们行军路上的障碍。”他朝着这些尸体吐了口唾沫，随后命令道。\n\n“所有人，都必须踩在他们的尸体上前进！要让这些条顿蛮子认识到，他们并非战无不胜！”\n"
OMS_POSTNUKE.127.a: "在碾压的吵杂过后，这一切又恢复了宁静。"
OMS_POSTNUKE.128.t: "抉择"
OMS_POSTNUKE.128.desc: "“求求你了，我真的什么也不知道了，求....”\n话还没说完，这个德国男人的嘴就被一根冰冷的枪管堵住了，“你们生来就是有罪的，而我们就是你们的审判官。”说完，持枪者扣动了扳机，刚才还在苦苦哀求的德国人顿时没了动静，那持枪者拿出一块手巾，仔细擦拭着手枪，然后随手把手巾扔到地上，走出了审讯室。\n\n这就是巴布罗夫，一位经验丰富的审讯专家，他的职务就是把在俄罗斯境内的德国间谍抓来审问，他有着十分出色的审讯技巧，并以此获得了很多有用的情报。\n\n一天，当他听说有一位疑似间谍的人将被送来审问，似乎还是位俄罗斯人时，他感到十分不解，他不明白这些俄罗斯的孩子为什么要背叛自己的祖国去帮助祖国的敌人，他对这些人的仇恨丝毫不弱于对德国人。\n\n巴布罗夫来到了审讯室等待犯人，审讯室不大，正中间有一个安置犯人的木椅，四周的墙壁虽总被清理，但难免留有一些血迹，木椅周围放着很多工具，巴布罗夫就是用这些工具来工作的。等了大约半小时，门终于被敲响了，“把她带进来！”巴布罗夫大声喊道，随着门被打开，巴布罗夫感觉走进来了一张熟悉的脸，等那人站定后，巴布罗夫突然认出了她是谁。“娜塔莎？！”\n\n这是巴布罗夫第一次在审讯室情绪这么激动，但他很快平静了下来。眼前的人是他的女儿，也就是娜塔莎。“你为什么要背板自己的国家，或是说，背叛我！”巴布罗夫近乎咆哮道，“黑色联盟不能拯救俄罗斯！它只会毁灭世界！”那女犯亦高声喊道。接着便是一阵沉默。巴布罗夫率先打破了沉默：“说吧，省得我动用那些工具。\n\n”“你会杀了我吗，爸爸？”\n\n巴布罗夫怔住了，黑色联盟早已将他训练成了国家最忠诚的卫兵，但刻在人类基因中的东西总还是难以改变的，如果换作别人，巴布罗夫甚至恨不得把他砍成肉末，但现在在他眼前的，是他的女儿，他的骨肉。他到底是没法下那个狠心，对自己的女儿挥以屠刀。\n\n巴布罗夫不停地责问着自己，过去的无情呢？快拿出来！过去的高效呢？快拾回来！终于，当他在心中默念了一遍当初发自肺腑喊出的誓词后，他拔出了腰间的手枪，将它对准了眼前这个可耻的叛国贼。“我很抱歉，安娜。”\n\n枪响，黑色联盟又少了一个叛徒。\n"
OMS_POSTNUKE.128.a: "莫再迟疑，为你的祖国！"
OMS_POSTNUKE.129.t: "每况日下的处境"
OMS_POSTNUKE.129.desc: "伊万如同往常一般，在劳碌了一天之后前来领取今天分配的粮食，刺骨的寒风猛烈地吹过他缝满了补丁的布衣，令他不由得打了一个寒颤，他那长期没有梳理的头发也被强风吹到了后脑勺，伊万搓了搓长满了茧子的手——那是他长期劳作的象征。\n\n“嗐，没办法，没了这些粮食的话，孩子们该怎么办？让我看着他们活活饿死吗？”他心里忍不住犯嘀咕，却没敢直接表露在脸上。像平时一样，他前去领今天的口粮，但不同于往常的是，今天的份量肉眼可见地少。\n\n“为什么今天只有这么点？”伊万瞪大了眼睛，就这么点，怕是只够两三个人吃的，更别提留给他和自己的妻子了。工作人员则是不慌不忙地、熟练的掏出了一张纸。“看见没有？亚佐夫大元帅亲自做出的最高指示！从今往后，一切资源优先供给给军人！白纸黑字，清清楚楚！”\n\n伊万攥紧了拳头，拳头上的青筋如同粗壮的枝干一般暴起，但在挨饿与处罚间，他最终选择了前者。但他终究心里感到不痛快。“凭什么就因为我们不愿意去前线送死就让我们挨饿受冻？难道我们生来就应当如此吗？”他的心中燃起了一股熊熊烈火，久久不能扑灭。\n"
OMS_POSTNUKE.129.a: "大审判会让俄罗斯完成复仇大业，但然后呢？"
OMS_POSTNUKE.130.t: "旧事重演"
OMS_POSTNUKE.130.desc: "汉斯·伯格能闻到空气中那股味道——不是莫斯科冬天惯常的煤烟味，而是更刺鼻的，混合了某种被稀释了很多倍的毒气的令人作呕的味道。听着窗外喊声，枪声以及越来越近的脚步声，他的汗水和泪水混在一起，无法分开。他祈祷着，紧紧拉着妻子艾尔莎的手，二人正试图从自己的杂货店的后门溜出去。\n\n然而，他们终究没能躲过。巷口被两个穿着黑色棉袄、臂章上绣着双头鹰的黑色联盟士兵挡住了。二人已经看到了，并且将黑洞洞的枪口对准了他们。\n\n“德意志人？”为首的那个中年男人用发音略有些蹩脚的德语说道。夫妻俩都不会说俄语，所以两名士兵几乎立刻就明白了他们的身份。汉斯只感到心里发寒，他绞尽脑汁，最终也只是结结巴巴的说出了一些意义不明的音节——他的嗓子因为过度紧张暂时性失语了。中年男人根本没有管他:“‌证件？”，同时用枪顶了顶他的脸，威胁意味十分明显。汉斯的大脑已经一片空白，但艾尔莎反应了过来，从身上摸索了一阵，拿出了莫斯科德国当局颁发的身份证件。中年男人翻了翻，在看到籍贯一栏填写的德裔居民后，嘴角扬起一抹狰狞的弧度。他示意了一下，跟在他身后的年轻人就猛地用枪托捣在汉斯的腹部。汉斯痛哼一声，蜷缩下去，艾尔莎发出一声短促的惊叫，但立刻被那年轻人粗暴地捂住了嘴。\n\n“伯格···汉斯·伯格···”中年人念着证件上的名字，像是在念一份死亡名单上的条目。“1943年，从慕尼黑迁入。‘技术专家’。”他抬起头，那双冰冷的眼睛第一次对上汉斯痛苦而恐惧的目光。“技术专家？为谁的技术？纳粹战争机器的技术？”他的声音陡然拔高，汉斯知道他在说什么，但窒息感越来越重，他反倒希望自己听不懂，至少这样他不用受这些罪······\n\n“不是······不是!”汉斯挣扎着想解释，他只是个普通的电气工程师，只想在战后混乱的世界里找个安身之所。但头领一脚踩在他的肩膀上，把他死死按在冰冷肮脏的雪地上。\n\n“闭嘴！德国猪猡！”头领啐了一口。“你们享受了二十年！住在我们的房子里，吃着我们的粮食，呼吸着我们的空气！现在，‘大审判’降临了！”他猛地举起那本证件，在汉斯和惊恐万状的艾尔莎面前，用那把伐木斧的锋利斧刃，狠狠地劈了下去！\n\n纸张撕裂的声音异常刺耳。证件被劈成两半，汉斯在专员辖区登记的相片被斧刃从中划开。头领像丢弃垃圾一样，把两半残破的证件扔在汉斯脸上。\n\n“带走！”头领命令道。年轻人粗暴地拽起几乎瘫软的艾尔莎，又踢了汉斯一脚，示意他起来。汉斯挣扎着爬起，腹部和肩膀的剧痛让他眼前发黑。他看到巷口停着一辆破旧的军用卡车，车厢敞开着，里面影影绰绰，似乎已经塞满了人。绝望像铅块一样沉入他的心底。这就是“大审判”？他们会被带去哪里？集中营？矿坑？还是直接被处决在某个废弃的工厂？\n"
OMS_POSTNUKE.130.a: "没有人会回答他。"
OMS_POSTNUKE.131.t: "仁慈的终结"
OMS_POSTNUKE.131.desc: "“喂！那边那个斯拉夫人！赶紧滚过来！”卡尔怒目圆睁，瞪着周边的战俘们，他做这份工作的时间已然不短了，伴随着东边鄂木斯克对德国平民大动干戈，他完全丧失了对战俘的同情心，心中只有对祖国的热爱与对外族人的仇恨。\n\n随着一个又一个战俘接连走向墙边，枪声也接连不断，甚至于越来越大声，显然那些处决战俘的士兵也同样满腔怒火······\n\n“等等，为什么枪声越来越近了？”\n\n忽然，大门被几个黑联士兵猛地推开，在看到卡尔身上的德国军装后，为首的士兵二话不说，将子弹倾泻在汉斯的身上。\n\n卡尔处在将死之际，眼神开始变得不断涣散，眼前的景象不断阴暗下来，背后，温热而又潮湿的血液浸透了他的衣裳，双臂无力地瘫在了地上，没有给他高举右臂的机会，随着那些俄罗斯士兵闯入集中营深处，向那些行刑的士兵开枪，卡尔也彻底失去了意识，一片又一片雪花覆盖在了他的尸体上。"
OMS_POSTNUKE.131.a: "可恨之人亦有可怜之苦。"
OMS_POSTNUKE.132.t: "崎岖长路已近终点"
OMS_POSTNUKE.132.desc: "鄂木斯克大广场上重新充满了人气——自从亚佐夫在此誓师西进以后，这里还从未站过下过如此多的人。黑压压的士兵方阵一望无际，将整个广场填的一点缝都不留，单单用“肃杀之意”已经无法形容这个场面了。这是深渊，是俄罗斯所经受半个世纪的苦难中，压抑着的仇恨和怒火所形成的深渊。\n\n深渊中，亚佐夫登台了。\n\n“战士们!”亚佐夫那古井无波的眼睛中兀的冒出两道精光，他脸上的每一道沟壑都刻满了漫长时光和厚重地底所造就的仇恨，在短暂的沉默后，他用力将拳头砸在冰冷的金属讲台上，发出“砰”的一声闷响:“我们知道，西方那些条顿牲口仍然苟活于世，这些玷污了我们神圣土地的蛆虫仍然躲藏在阴暗的地底，他们以为大审判已经结束了，他们以为他们可以躲过神的怒火!”亚佐夫的声音突然拔高:“但是我们都知道，复仇还没完!只要有一个条顿人尚且苟活世间，大审判就不会结束!我们，黑色联盟，从废墟中涅槃，我们扫尽了东欧的纳粹残渣、肃清了内部的污秽和叛徒，现在，目标只剩最后一个:日耳曼尼亚!这条顿罪恶瘟疫的源头!”\n\n他顿了顿，然后继续吼道:“这一次，没有退路，我们会把每一个流淌着条顿毒血的细胞全部灭杀，我们会把整个日耳曼民族，整个德意志国家，所有的条顿人，化作死尸，化作灰烬，我们会从历史上、从这个星球上、从整个宇宙中，将‘德国’两个字抹掉!”\n\n“战士们!还没完!联盟送给你们一份大礼!”说着，他揭开了他身旁的黑布，那下面赫然是一排排带生化标志的桶，以及堆积如山的涂上了黑色骷髅头的弹药箱。他的声音因为激动而有些变形:“看到了吗？改良的瘟疫，更加高效的毒气，强力的腐蚀剂，以及令人生不如死的化学药品!打开你们的阀门，血洗每一座废墟，每一个地洞，每一片沼泽!揪出他们，把他们像蟑螂一样碾碎!把所有的条顿人全部烧成焦炭，全部化成脓水，全部砍成肉泥!”\n\n“战士们!”亚佐夫深吸一口气，他此刻感觉自己身处在一场梦中，尽管有些头晕，但他还是尽自己的最大力量吼了出来:“点燃净化之火，为了我们的仇恨，为了俄罗斯母亲，出发!为了数十年的血债，出发!为了那最终的，最后的，神圣的战争，出发！！！”\n"
OMS_POSTNUKE.132.a: "最终复仇等着我们。"
OMS_POSTNUKE.133.t: "“参谋部内”"
OMS_POSTNUKE.133.desc: "铅灰色的会议室内，烟味缭绕不绝，久久不散，亚佐夫正审批着各个军区递交的报告，萨哈洛夫斯基递过一份文件:“总司令，这是西方总计划第二阶段的执行计划和目前进度。我们的化学武器和生化武器存量充足，常规武器的生产足够支撑我们完成大审判，不过各个集团军后备人力不足，联盟可能需要继续扩大征兵范围。”\n\n亚佐夫叹了口气:“战线状况?”\n\n“东普鲁士和西波兰地区状况良好，德国人的反抗比我们预想的要弱的多，他们的很多地方甚至还没有重建现代社会秩序。目前敌我实力对比已经和大审判第一阶段时完全相反，我们的情报甚至认为，现在德国残存的工业能力可能只有我们的1/2。因此我军的战争能力毫无疑问已经超过了德国。”说着，萨哈洛夫斯基递过另外一份文件:“嗯，还有一些好消息，总司令。英国的幸存者目前已经重建了政权，但是他们目前没有援助德国的能力。法国地区目前没有一个有统治力的中央政府存在，不过瑞士在核打击中保存了大量的力量，我们可能需要注意其威胁。总的而言，德国的西欧盟友已经被极大削弱了。报告完毕。”\n\n亚佐夫点了点头。随后示意下一个顺位发言，德罗兹多夫斟酌着用词，试图让自己的话变得不那么尖锐:“总司令，这是一份关于东欧失陷区域环境的考察报告，由于大审判第一阶段我们没有能力在此构筑足够的工事，当地环境对于我们兵员和物资的损耗比俄罗斯内更加的大，我们的后勤承担了极大的压力，如果这种状况持续下去，恐怕我们的补给线将在德国彻底灭亡前先行崩溃。因此，我建议······暂缓攻势······”说着说着，他的声音越来越没有底气，而亚佐夫只是冷冷的看了他一眼，仿佛在看一个死物。感受到了这股寒意，德罗兹多夫赶忙为自己找补，他的声音甚至由于紧张而有些结巴:“总、总司令，我绝对不是投降主义，只是，对于目前的情况而言，高烈度进攻造成的后果可能会适得其——”\n\n“够了!你给我闭嘴，再说这种大逆不道的话，我就撤了你的职!”亚佐夫很明显生气了，德罗兹多夫见此噤若寒蝉，他敬了个礼，结束了报告。\n"
OMS_POSTNUKE.133.a: "其他试图规劝亚佐夫的将领见状默默闭上了嘴。"
OMS_POSTNUKE.134.t: "“夹缝”"
OMS_POSTNUKE.134.desc: "秋明地区“叶卡捷琳娜”地堡群\n\n阿纳斯塔西娅把最后一片发霉的干面包皮掰成两半，一半塞进女儿玛莎嘴里，另一半捏在自己汗湿的手心中。她们蜷缩在配给站冰冷的水泥台阶角落，前面是望不到头、散发着汗臭的队伍，玛莎瘦小的身体裹在母亲磨得发亮的旧大衣里，显得空荡荡。她没哭闹，只是睁着那双过分大的、异常清澈的蓝眼睛，看着母亲手中那一点点食物:“妈妈，面包好少。”玛莎的声音轻得像羽毛，带着孩子特有的困惑，“以前有这么大。”她用冻得通红的小手比划着，那大小足够她们吃两天。\n\n阿纳斯塔西娅喉咙发紧，她无法向这个不满十岁的孩子解释墙上那新贴的、墨迹未干的黑色联盟告示：“一切为了最终复仇！后方即前线！压缩非战斗人员配给，支援‘大审判’前线！”，无法解释自己那张死了丈夫换来的优待卡上被写下的“不适用”文字，更无法解释配给证上那被一次次粗暴划掉、又用红章盖上更小数字的份额。丈夫死在十年前一场勘探行动中，而现在，黑色联盟的“秩序”要勒死他的遗孀和剩下的孩子。\n\n队伍蜗牛般挪动。终于轮到她们。窗口后面士兵的脸藏在油腻的防寒帽下，只露出毫无感情的眼睛。他扫了一眼阿纳斯塔西娅皱巴巴的配给证，又瞥了一眼她身后的玛莎。\n\n“寡妇？带个拖油瓶？”士兵的声音毫无温度，“本月新规，非核心劳动力，配给削减百分之二十，拿着。”他丢出两个只有她拳头那么大、颜色灰暗的面包干，它们硬得像石头。阿纳斯塔西娅的心一下沉了下来:“长官！求您···孩子···这点不够···”\n\n“下一个！”士兵无视了她，继续着机械的动作，阿纳斯塔西娅和玛莎很快被人群挤开。她死死攥住那两块小石头般的面包干，拉着玛莎踉跄地退开，却迎面撞上了一个穿着崭新军大衣的军官。那军官厌恶地掸了掸被阿纳斯塔西娅破旧衣袖蹭到的衣角，像驱赶苍蝇一般。他手里提着一个鼓囊囊的军用饭盒，盖子没盖严，那股诱人的、真正的黑麦面包和肉肠的香气飘散出来。\n\n玛莎的小鼻子猛地吸了吸，眼睛瞬间亮了，她扯了扯阿纳斯塔西娅的衣角，声音里带着天真的惊奇：“妈妈，好香！那个叔叔的面包好大！”\n\n军官脚步顿住，冰冷的目光扫过玛莎枯黄的小脸。他嘴角扯出一丝弧度，像是嘲笑这不知天高地厚的对比。阿纳斯塔西娅猛地将女儿冰凉的小手攥得更紧，将她的头按进自己干瘪的胸口，不让女儿再看。\n"
OMS_POSTNUKE.134.a: "她们又能做什么呢?"
OMS_POSTNUKE.135.t: "秘密报告"
OMS_POSTNUKE.135.desc: "自从卡尔贝舍夫死后，亚佐夫的精神状态便每况愈下，而现在，他显然已经患上了严重的被害妄想症，并将怀疑对象转移到了黑联的军官与士兵们。为了确保军中没有“条顿特务”，亚佐夫亲自指派了一些亲信来调查军队，而现在，结果总算出来了——\n\n“未发现间谍？什么叫‘未发现’？”亚佐夫质问着面前的调查小组组员，头上的毛发竖立了起来，而那些组员也大气不敢出，生怕成为亚佐夫的下一个怀疑对象。\n\n过了许久，其中一人才敢回答道:“报告总司令，我们已经对除了您之外所有已登记的联盟士兵都审查过了，我们甚至还审查彼此，但是我们没有发现任何与条顿人的往来······”亚佐夫站了起来，用力地拍了一下桌子，组员们知道，麻烦惹大了。\n\n“出去！都给我滚出去！继续找！不然连你们一起枪毙！”亚佐夫下了逐客令，组员们自然不敢停留，马上从办公室走了出去。\n\n办公室再次空无一人后，亚佐夫用力地捶向桌面，望着天花板，泪水不停地在眼眶中打转，他感到无比自卑与懊恼。\n"
OMS_POSTNUKE.135.a: "“难道我真的不能继承他的遗志吗······”"
OMS_POSTNUKE.136.t: "丰收"
OMS_POSTNUKE.136.desc: "编号第*5**3*9*号干员正紧张的向第*27**号仓库奔去，防化服的呼吸管随着他剧烈的心跳和急促的步伐而晃动，面罩内的瞳孔剧烈的扩张着，肺叶也收缩的幅度也愈发增大，这位老干员再一次命令着属于他，也更属于联盟的身体为了大审判而用尽全力，即使时间已经在他的身体上留下了痕迹，但对大审判的衷心则是崭新如初。\n\n尽管大脑对仓库内的情况以进行了无数次推测和遐想，但到了现在，他自己还是像几十年前初次摸枪上战场时一样激动而又忐忑，不同的是这次是饱经风霜的战士再次找到了“老伙计”去碾碎俄罗斯的叛徒和条顿渣滓，而不是初出茅庐的新兵第一次挑选“新武器”面对修正主义者和军区。\n\n第*5**3*9*号干员看着越来越巨大的老门，他感觉到门在从模糊不清变得清晰可见，他不禁想起1976年第一次大审判时作为一个后勤的自己一天16个小时在西西伯利亚和莫斯科前线疲于奔命的自己，那时候他很劳累，现在也是，但只要大审判还未完成，他就不会停下步伐，这是亚佐夫元帅让他记住，也是他自己始终牢记而执行的，审判长所烙印下的事，绝不可遗忘。\n\n脑中的思绪结束了，第*5**3*9*号干员回到现实中来，他站着仓库门前，内部物资的多少将决定多少干员能更好的去为了伟大的使命而奉献自己，他兴奋的抽出了一把老得不能在老钥匙，但满身伤疤且带有严重摩擦的钥匙在这位伤痕累累的干员和这扇厚重又老旧的锈门前还是发挥出了作用。\n\n钥匙扭响了骨折的咯吱声。\n\n老门拖来了断腿的呜咽声。\n\n第*5**3*9*号干员迈进了这间他许久前无数次取货的站点。"
OMS_POSTNUKE.136.a: "发出了苦涩且真心的笑声。"
OMS_POSTNUKE.137.t: "前线的填料"
OMS_POSTNUKE.137.desc: "在核战争之后，大批军阀在俄罗斯大地上如雨后春笋般长出，这些军阀思想各异，但他们无一例外，都是当地的“土皇帝”，为了避免这些人在后方叛乱或者出什么岔子，亚佐夫决定将这些大闲人发配到前线，为联盟而效力。当然了，并不是谁都支持这个决定······\n\n“喂！米哈伊尔！你个赤匪赶紧滚过来！”“你们这群资产阶级的走狗也好不到哪去！亚历山大！”说罢，米哈伊尔和亚历山大开始了又一次斗殴，米哈伊尔将亚历山大扑倒在地，用胳膊肘捶向他的牙齿，亚历山大则死命地用拳头向米哈伊尔的腹部打去，两人一直僵持到政委到来。他们就是这个决策的牺牲者，两人因为彼此之间的政见而时常闹矛盾，令他们的班长十分头疼。他们的战友也见怪不怪，甚至以此为乐趣。\n\n当然了，这两人只不过是黑联中无数例子之二罢了，但毫无疑问，这样并不一定就能保证联盟的稳定。\n"
OMS_POSTNUKE.137.a: "至少后方不用头疼了，不是吗？"
OMS_POSTNUKE.138.t: "“正义”的代价"
OMS_POSTNUKE.138.desc: "“德米特里·阿列克谢耶维奇·彼得罗夫？”一名黑联的警察用闪亮的灯光照向了彼得罗夫，彼得罗夫被强光照得眯起了眼，下意识用胳膊遮蔽了视线。\n\n“没······没错。”他仍然处于极度的惊恐之中，他记得自己最开始只是走在几天前修缮好的大街上，突然就不知道被谁从背后用抹布捂住了嘴巴，然后就昏了过去，再次醒来就已经进审讯室了。\n\n“说！你是不是跟条顿人曾经有过接触！”那名警察吼向彼得罗夫，唾沫星子崩到了彼得罗夫脸上，但彼得罗夫听见这样的问题之后，不由得愣了一下。\n\n“接触？冤枉啊，警官大人！我一直都在俄罗斯工作，从来没有见过德——啊不，条顿人！”警察听完之后，只不过是不动声色地拍了拍手，皮手套的声音在小房间中显得极其响亮。\n\n“伊万！关监控！”\n\n另一名名叫伊万的警察推开了房门，用极其娴熟的手法把摄像头从天花板上拧了下来。随后，两名警察掏出了预先准备好的警棍，抡向了彼得罗夫。\n\n“说！你的条顿同伙在哪！赶快说！”两人你一棍我一棍，连番向彼得罗夫挥去，彼得罗夫还没撑过三回便主动认罪招供了。“我说！我说！我全都说！我跟那个条顿人在鄂木斯克市亚佐夫路第一百二十三号碰面的！别杀我！别杀我！”彼得罗夫为了保命，胡编乱造了一个地方，原先的面孔变得青一块紫一块，鼻孔中源源不断地流着血，地上还有一颗刚刚掉下来的牙，根部被鲜血染成了红色。\n\n听到这样的消息，两名警察才肯作罢，把彼得罗夫押往了监狱，但当他们在鄂木斯克市找了一圈后才发现，压根就没有什么“亚佐夫路一百二十三号”，而彼得罗夫也只不过是一个普通人。\n"
OMS_POSTNUKE.138.a: "“他妈的，继续查！”"
OMS_POSTNUKE.139.t: "新兵“特招”"
OMS_POSTNUKE.139.desc: "潘捷莱带着几个孩子走进征兵办事处。里面已经有不少人在里面了，随着联盟向外扩张的深入，他们找到了更多地下储藏所。随即，新一轮的征兵工作也开始了。一开始他们还能找到些能干活的青年和一些中年人。但很快，他们所能找到的便只有妇女和孩子了，于是，联盟的征兵年龄正式下放到几岁，能找到的孩子也开始参与到军队管理事务中去。\n\n这些年轻的孩子们作为新兵，在地下征兵处的冷屋子里按次序脱掉衣服，几个军队里的文书正挨个记录，一位干员穿着漆皮短靴在旁边走来走去，看到潘捷莱进来，他的眼前瞬间一亮。\n\n“潘捷莱，这些人分给我吧，最近能干活的又累死了几个，能监管生产的人实在是不够了，我们这需要更多的人来看着那些劳力，防止他们造反。”\n\n“能不能少搞些虐待了，伊万诺维奇，谁不知道你们那动不动殴打手下，动不动就打死几个，还把他们身上搞的缺一块少一块的，这以后还有几个人能干活了？”\n\n两个人交谈的功夫，屋里的白头发军医已经在和一众文书开始对这些孩子进行体质检查了。\n\n“胸围...身高...”\n\n“这明显是接触辐射后的产生的病，记下来...”\n\n“别动，现在要看一下你的眼皮”\n\n“把裤子脱下来，有什么可掖着藏着的！”\n\n很快，这群孩子的体检结果就出来了。屋子里的军官们每个人都拿起了一份开始看。潘捷莱刚扫完几个前排的大孩子的报告，一个黑脑袋督察便凑到了他耳朵旁。\n\n“兄弟，这几个带头的给我们我们派遣部队吧，最近实在是缺少新人干活了，别忘了，咱们现在外面搜罗补给还是要靠我们的。”\n\n“喂，你俩在干什么，这些人理应给我们工业生产部，现在不少工人在工作时间偷奸耍滑，忘记了民族的本分，如果没有合格的士兵看守他们，工作还怎么进行？”伊万诺维奇不耐烦地用指头敲着桌子，叫喊到。\n\n潘捷莱没有注意几人的争吵，他扫过了几个孩子的体检报告。最大的孩子8岁，身高不足一米二，体重才30斤，最小的甚至才6岁，看着这些瘦的皮包骨头的孩子，潘捷莱突然不自主的哆嗦起来，一股犯恶心的感觉传遍了全身。\n"
OMS_POSTNUKE.139.a: "我是个杀人犯，彻头彻尾的恶棍。"
OMS_POSTNUKE.140.t: "烧尽"
OMS_POSTNUKE.140.desc: "叶夫根尼.尼古拉耶维奇拎着喷火器向远处走去，厚厚的防辐射服为他阻挡了外面源源不断的毒气，也隔绝了他此刻喷薄而出的熊熊怒火。自从大审判降临之后，他每日的生活就是在地下训练和干活，平时还要收听广播里每日播放的条顿人之恶行，从那天起他时刻感觉自己必须做点什么，这神圣的复仇还没有结束。终于，他得到了资格，作为第一批清扫部队向西进发。\n\n上级派下的任务简报里，条顿人虽然在大审判之下损失惨重，但通往条顿首都日耳曼尼亚的路上可能存在定居点，他们必须保证这些地方没有任何一个条顿势力和条顿人能够存活，唯有如此，才能让条顿永无再次复兴之日。\n\n很快，无线电里传来了指示，指定坐标发现疑似人员活动踪迹。叶夫根尼跟着他的小队坐上了装甲车，在装甲车沉默的引擎声中，他缓慢的呼吸着无数次被防毒面具过滤后的，充斥着金属和焦炭味的空气，来压制住内心的不安。\n\n目的地很快出现在眼前，叶夫根尼带着小队开始搜寻，很快，他们就扎到了一座半埋在土里的避难所大门。他们勘察一番后，很快发现了存在人的踪迹。在确认无人防备后，小队破开大门，蜂拥而入。手电筒的光亮瞬间扫破避难所的漆黑，也照亮了避难所内的人的脸。\n\n等适应了黑暗之后，叶夫根尼定睛往去，一群条顿垃圾正蜷缩在墙角，一处墙壁上充满了色彩，写满了各种话。叶夫根尼懂一点德语，他扫了一眼，墙上最大的一行写的是：“不要忘了斯拉夫劣等人的血债！”\n\n“你们没忘啊，很好，我们也没忘。”叶夫根尼咧开嘴笑了起来，然后举起了手中的喷火器。\n"
OMS_POSTNUKE.140.a: "喷涌的烈焰伴随着他的怒火一起，将条顿杂种们通通点燃。"
OMS_POSTNUKE.141.t: "不劳动，不得食"
OMS_POSTNUKE.141.desc: "“感谢我们的总司令吧，公民们，随着我们与联盟高层取得联系，我们已经得到了总司令亲自下发的粮食和物资支持，作为我们忠诚的奖励！”广播里的声音再次响起，这一次不再是空洞的复仇主义宣传，而是真正为下塔吉尔的这间核战避难所带来了好消息。\n\n当听到这些话语时，很多地堡里的居民们正在属于他们的工作单位上，有的人在车间，有的人在地下通道，有的人在自己的屋子里无所事事。当听到消息的时候，很多人几近麻木的抬起头，不敢相信消息是真的。\n\n“为保证接下来粮食和补给的使用仍然能够继续配合大审判事件的彻底完成，各位忠诚的公民们，我们将进一步采取配给制，但与之前不同的是，如今的我们有了更多的物资，因此，我们现在宣布，从今往后我们将采取劳动配给制，如果我们的公民为联盟采取了更多的劳动行为的话，可有资格获得更多的食物和物资！”\n\n很快，领取配给的队伍就开始排起了一条长龙，陆陆续续有人开始来到指定的食堂来领取增发的物资——虽然和他们平常能搜罗的并无什么差异，无非还是土豆，萝卜汤等等，但做法和口味上确实有了差别，很多人品尝后明显脸色产生了变化。而黑色联盟的干员们也开始根据避难所里的劳动程度增发物资。很快，队伍就排到了一个滴溜溜鼠眼的男子面前。\n\n“长官，我是宣传部门的人员，我为咱们联盟进行了多次宣传工作，帮助他们稳定民心，让大家更好的熬过这段日子，我觉得我有权力多领取一些面包。”\n\n“哦，是吗？”一旁的上尉看向领取物资的干员，他们摇了摇头，又看向他身后的几位民众：“我想，我们聪明的俄罗斯人应该有能力分辨出谁参与了劳动吧？”\n\n那人看着几个士兵围上来，突然吓破了胆，跪了下来：“哪儿话？！绝不是...我真是鬼迷心窍了，鬼知道是怎么一回事...请您原谅...请您相信，要是别人干这种事，我都感到羞耻...”\n\n上尉看着这个满面羞惭，无地自容的人来，突然笑了出来。他直接给了这个家伙一脚，镇定的说：“有些人总是有一些错误，忘记了俄罗斯人是牢记历史的民族，当然，我们可以临时的，原谅一下这种错误。但我们不喜欢谁都来犯这种错误，毕竟我们的子弹还要打在条顿人的身上。”\n"
OMS_POSTNUKE.141.a: "“至于你，拿上你那点东西，滚去干活。”"
OMS_POSTNUKE.142.t: "调查统计局在行动"
OMS_POSTNUKE.142.desc: "“000041号。职位：中将。罪名：叛国罪、间谍罪。已被执行枪决。”\n······\n“000579号。职位：上校。罪名：贪污罪、履职不力罪。无限期劳役。”\n······\n“006439号。职位：中士。罪名：斗殴罪、扰乱军队秩序罪。已扭送至生化实验室。”\n······\n“012980号。职位：书记员。罪名：泄露国家机密罪。已被用于测试新型毒气威力。”\n······\n······\n亚佐夫一张张地翻阅自调查统计局传来的文件，仿佛一条条敌人的生命正在从他指尖流逝，这使他心情大好。间谍还有很多，反动派怎么杀都杀不完，是的，只要条顿人还在，祖国的危害就不会消失。把所有条顿人和叛国贼消灭掉，还祖国的复兴，这难道不就是卡尔贝舍夫的遗志吗？\n\n亚佐夫不禁狂笑。妨碍大审判事业的人，无需审判，立刻处刑即可。他拨通了调查统计局的电话，下达了又一条命令：\n"
OMS_POSTNUKE.142.a: "“加大调查力度，执刑权由你们掌管。”"
OMS_POSTNUKE.143.t: "玉石俱焚"
OMS_POSTNUKE.143.desc: "德米特里·亚佐夫站在总参谋部的巨幅作战地图桌前，枯瘦的手指缓缓划过那条指向德国残存疆域的、由于推进速度过于缓慢已几近停滞的战线。“又一次大停滞。”亚佐夫的声音嘶哑，在寂静的指挥所里异常刺耳。“可‘大审判’的最终章，决不能容忍这种事!”他猛地一拍桌面，震得标记棋簌簌抖动。“条顿人躲在废墟里，以为这能拖延他们的灭亡？他们以为我们的决心会被距离和消耗磨灭？”他冷笑起来，声音里没有任何温度。“揭穿他们的画皮。让他们和我们中妥协投降的叛徒看清，一切抵抗在联盟的力量面前皆不堪一击!”\n\n他转向噤若寒蝉的总参谋长：“通知前线所有集团军群。即日起，实施‘零号预案’。”\n\n命令被具体化，变成一条条冰冷的指令，通过加密线路传向远方：\n\n“第一：所有步兵师，取消轮换休整。预备队填线，投入不间断攻击。伤亡数字不予优先考虑。目标：耗尽德军最后一发子弹，拖垮其最后一名士兵。”\n\n“第二：炮兵部队，全面启用‘科什切伊’系列化学燃烧弹与持久性窒息弹药。优先覆盖敌军后勤节点、疑似指挥所、以及人员密集区。不再区分战术与战略目标，制造持续杀伤区域，剥夺其机动与补给空间。记得告诉他们，产能不是问题，联盟自会想办法。”\n\n“第三：工兵部队，前进路线执行‘绝对焦土’政策。摧毁一切无法即刻利用的设施、资源。水源投掷持久污染剂。”\n\n“第四:进一步扩大征兵范畴，女性士兵数量该提一提了。粮食配给，优先保障作战部队。后方···自行紧缩。”\n\n一位面容憔悴的后勤将军嘴唇动了动，似乎想说什么。但亚佐夫没有给他机会:“我们从核废墟和内战中走出来，不是为了再次困在这该死的停滞里的!‘最终复仇’没有休止，要么德国从地图上彻底消失，要么我们流尽最后一滴血。没有第三条路。”\n\n他转身，再次凝视地图，那只枯瘦的手狠狠按在代表柏林的位置上，仿佛要将它从地图上抠掉。\n"
OMS_POSTNUKE.143.a: "“执行命令。”"
OMS_POSTNUKE.144.t: "锈蚀"
OMS_POSTNUKE.144.desc: "帕维尔的记忆是一片被炮火反复犁过的冻土。他记不清上一次看到完整的屋顶是什么时候，也记不清没有火药味的空气闻起来是何种滋味。他只记得恨。那恨意不是亚佐夫元帅在广播里嘶吼的宏大誓言，也不是政委分发的宣传册上印刷的鲜红口号。它更像他配枪里卡住的泥，像他水壶里永恒的铁锈味，像他肺里咳不出的、积了数十年的灰尘——一种生理性的、无需思考的存在。\n\n他们所在的这个德国村庄，地图上甚至没有名字。它像大地的一道溃烂伤口，在铅灰色的天空下流着由碎石和残垣构成的脓。盖革计数器是这片死寂中唯一的活物，用单调的“咔哒”声为他们送葬。\n\n帕维尔踹开一栋农舍的门。里面空无一人，但生活的痕迹尚未被寒冷彻底抹去。墙上挂着一张全家福，照片上的男人搂着妻子，两个金发孩子在他们身前笑得无忧无虑，背景是绿色的田野和一头牛。帕维尔盯着那张照片，脸上没有任何表情。他没有去想照片上的人如今在何处，他只是在照片的背景里，看到了自己早已化为焦炭的村庄的影子。\n\n他想起了自己也曾有过一个妻子，她的头发是麦子的颜色。他想起了自己也曾有过一个女儿，她总喜欢把野花插在他的帽檐上。这些记忆像褪色的幽灵，一闪而过，没有带来悲伤，只让那股盘踞在他骨髓里的恨意变得更沉、更冷。\n\n“分区清剿，执行净化协议。”耳机里传来小队长毫无波动的声音，那声音和盖革计数器的节拍融为一体。净化，一个多么干净的词。\n"
OMS_POSTNUKE.144.a: "他拉动枪栓，动作像吃饭喝水一样自然。"
OMS_POSTNUKE.145.t: "田垄"
OMS_POSTNUKE.145.desc: "地窖的门被一袋发了芽的土豆顶着。帕维尔用枪托撞开它时，一股混合着泥土、腐烂蔬菜和人类恐惧的气味涌了出来。下面有活人。\n\n他顺着梯子滑下去，靴子踩在湿滑的泥地上。昏暗的光线里，几双眼睛像受惊的耗子一样看着他。一个头发花白的老人，手里紧握着一把锈迹斑斑的草叉，那是他最后的武器。一个中年女人将两个孩子死死护在身后，孩子们惊恐地瞪大双眼，却连哭泣的力气都没有。他们的脸上涂着泥，想必是为了伪装，但在帕维尔那对早已习惯黑暗的眼睛里，无所遁形。\n\n老人用德语嘶吼着什么，帕维尔听不懂，也不想懂。在他眼中，这已经不是一个家庭，甚至不是一群人。他们是杂草。是长满了俄罗斯母亲躯体之上，吸食着她血液、啃噬着她骨肉的毒草。他的任务，不是杀戮，而是除草。一项必要的、迟到了太久的农活。\n\n他的手指没有丝毫颤抖。枪口的火焰短暂地照亮了地窖，也照亮了那女人眼中瞬间熄灭的光。孩子们甚至没来得及发出尖叫，就被子弹的动能撞到墙上。最后是那个老人，草叉还没来得及举起，眉心就多了一个整齐的洞口，身体缓缓向后倒去，砸翻了那袋发芽的土豆。\n\n一切都结束了，地窖里只剩下帕维尔的呼吸声和浓重的血腥味。他走上前，用军靴的鞋跟碾碎了地上一个孩子的玩具木马。木头碎裂的声音，清脆得像冰层开裂。他没有感到满足，也没有感到罪恶，只感到一种完成工作的空虚。就像农夫在黄昏时分锄完了最后一行地，仅此而已。\n"
OMS_POSTNUKE.145.a: "他用靴子踩灭了那盏还在摇曳的煤油灯。"
OMS_POSTNUKE.146.t: "伏尔加河上的寂静"
OMS_POSTNUKE.146.desc: "夜幕降临。灰黑色的雪开始飘落，掩盖了血迹和弹壳。帕维尔坐在被烧毁的农舍门槛上，清理着他的步枪。枪管的余温透过手套，传来一丝微弱的暖意。\n\n任务完成了。这个村庄······被“净化”了。每一个地窖，每一个角落，都被检查过。再也没有活的条顿人了。他毕生的仇恨，他存在的唯一意义，似乎就在这短短的一天里被耗尽。现在，那股支撑着他的、冰冷的恨意消失了，留下了一个比辐射废土更空旷的黑洞在他的胸口。\n\n他抬起头，望着被辐射云染成病态紫色的夜空。他试图回忆起伏尔加河的模样。他记得河水，记得渔船，记得夏日傍晚河岸边的篝火。可那些画面如今模糊得像一场遥远的梦。他拼命地想，想记起他妻子的脸，想记起她说话时的音调。\n\n记忆的碎片像被风吹散的灰烬，无论他如何努力，都无法拼凑完整。他赢了吗？他为他的家乡、为他的妻子女儿报了仇。但他的家乡早已消失，而他的妻女···她们的脸庞和名字，此刻竟与今天死在他枪下的那些德国人的脸庞和名字一样，模糊，遥远，无足轻重。\n\n战争夺走了他的一切——他的家园，他的亲人，他的未来。而今天，当他终于完成复仇时，他才惊恐地发现，战争连他最后的财产——那份纯粹的、驱动着他的仇恨——也一并夺走了。现在，他一无所有。\n\n步枪被擦拭得锃亮，在雪光下反射着冷酷的光。它比他更真实，比他还活着。帕维尔呆呆地坐着，任由雪花落在他的肩上，将他慢慢变成一座没有墓碑的、冰冷的雕像。\n"
OMS_POSTNUKE.146.a: "他想不起自己女儿的名字了。"
OMS_POSTNUKE.147.t: "光斑中的尘埃"
OMS_POSTNUKE.147.desc: "在德国。在一座被炸毁的教堂里。\n彩绘玻璃的碎片像廉价的糖果，铺满一地。正午的阳光透过穹顶的破洞，投下一道笔直的光柱，像上帝迟来的、毫无意义的审判。无数尘埃在光柱中升腾、旋转、落下。你看着它们，一看就是几个小时。\n你的枪靠在身旁。它很冰冷，很安静。像一条忠诚的、睡着了的狗。\n有人叫你帕维尔。\n这名字像一件不合身的旧大衣，套在你身上。你试着在心里念一遍，帕维尔。舌头感到一阵陌生的僵硬。那个叫帕维尔的男人，他有一个村庄，一个妻子，一个女儿。那个叫帕维尔的男人，他的血管里奔流着由仇恨、苦难和伏特加构成的岩浆。他把这份岩浆注入了这把枪的枪膛，射向了这片土地上的每一个活物。\n你记得开枪。你记得后坐力撞击肩膀的感觉。你记得血溅在墙上，像一幅拙劣的抽象画。你记得温热的内脏在冬天的空气里冒出白气。\n你记得这一切。\n但你不记得恨了。\n昨天，恨意还在。它是一块滚烫的石头，塞在你的胸口，让你无法呼吸，也让你能够站立。它为你指明方向，赋予你行动的意义。\n今天，石头凉了。它碎成了粉末，和教堂里的尘埃混在一起，在光柱中漫无目的地飘浮。\n你低头看着自己的手。一双布满老茧和疤痕的手。指甲缝里嵌着干涸的血迹和火药的黑灰。\n这双手。它们杀过人。它们曾抱起过一个孩子。它们曾抚摸过一个女人的头发。\n现在，它们只是手。两块附着在手臂末端的、由骨头和肉组成的工具。\n你是一个图标，在地图上移动。一个单位。有生命值，有组织度。你从一个省份移动到另一个省份。你执行指令。\n攻击。\n防御。\n肃清。\n这些指令从一个你看不见的地方传来，通过耳机里的电流声，或者通过政委那张冻得发紫的嘴。\n你从未质疑。\n你曾以为，当最后一个条顿人倒下时，会有一种解脱，一种大功告成的快感。你会听到伏尔加河在歌唱，你会看到死去的同胞在天堂微笑。\n但你什么也没听到，什么也没看到。\n你只看到了更多的尘埃。\n你站起身，走到圣坛前。圣坛上，基督的雕像被炸掉了头颅，只有一只张开的手臂还保持着拥抱世人的姿势，看起来可笑又可悲。你和他一样，都是被掏空了的容器。你曾被仇恨充满，而他曾被信仰充满。\n现在，你们都空了。\n这场审判，这场伟大的、神圣的复仇···它的意义是什么？\n是为了一个更好的世界？你环顾四周，这片被毒素浸透、被死亡笼罩的废土，就是你缔造的世界。\n是为了告慰亡灵？可你已经记不清他们的脸了。\n你不再是帕维尔。\n你也不是复仇者。\n你只是这场审判留下的、最后一个多余的零件。一个停止了运转的、生了锈的幽灵。\n你伸出手，在光柱中挥了挥，搅乱了那些飞舞的尘埃。\n"
OMS_POSTNUKE.147.a: ""···我杀死了帕维尔。""
OMS_POSTNUKE_147_tt: "那时，人要求死，却不得死；愿意死，死亡却远避他们。"
OMS_POSTNUKE.148.t: "火焰的洗礼"
OMS_POSTNUKE.148.desc: "你叫德米特里，今年十八岁。你的祖国不是一片具体的土地，而是一座由混凝土、钢铁和仇恨浇筑而成的地下方舟。你的创世神话始于卡尔贝舍夫将军在冰水中殉难的那一刻，你的赞美诗是每日配发的战斗口号。对你而言，‘德国’不是一个地理名词，而是一个刻在灵魂深处的原罪符号——那是蛇、是苹果、是一切需要被火焰净化的不洁之物。\n\n今天，你终于踏上了那片应许的、需要被毁灭的土地。废弃的高速公路像一条巨大的灰色伤疤，延伸至地平线。防毒面具的呼吸阀发出平稳的嘶嘶声，这是你的圣歌。你的步枪冰冷而沉重，这是你的十字架。当小队长指向前方那片由破败建筑构成的剪影时，你的心脏在狂跳，不是因为恐惧，而是因为一种迟来了十八年的、神圣的狂喜。你将要履行你的天命。\n\n战斗比你想象的更简单，也更···纯粹。一个躲在断墙后的条顿老兵，胸前的铁十字在昏暗中反光，他举枪时，你扣动了扳机。没有犹豫。子弹击中他时发出的沉闷声响，是你听过最悦耳的音乐。他倒下时，你感觉一个无形的枷锁从俄罗斯母亲的身上被解开了。你踩过他的尸体，靴底粘上的血，让你感觉自己像是踏过了通往天国的门槛。\n\n夜里，你借着装甲车微弱的灯光，在日记本上写下今天的一切。墨水在劣质的纸页上晕开，字迹却因激动而坚定有力。“今天，我用条顿人的血，为我尚未出生的子孙洗净了未来的道路。火焰与钢铁将是我们的洗礼，废墟与灰烬将是我们的祭坛。亚佐夫元帅指引着我们，卡尔贝舍夫的英灵护佑着我们。这场圣战，是光荣的。”\n\n你合上日记本，听着远处传来的零星枪声。那是你的同志们在继续这场伟大的净化。你闭上眼，在梦中，你看见一片火海，而在火海的尽头，是俄罗斯金色的麦浪和蔚蓝的天空。\n"
OMS_POSTNUKE.148.a: "我已站在地狱门前，而我将是敲门者。"
OMS_POSTNUKE_148_tt: "我心怀填满的愤恨；我厌倦了，我不能再容忍。"
OMS_POSTNUKE.149.t: "诗篇"
OMS_POSTNUKE.149.desc: "神圣感是有保质期的。一个月后，你发现，净化世界的伟业，其本质与你曾在地堡流水线上组装弹夹并无二致——重复，精确，以及一种日益增长的、令人窒息的麻木。狂喜早已褪去，如今驱动你的，是一种高效的、斯巴达式的职业操守。破门，索敌，射击，确认死亡，转移至下一个坐标。你的行动像钟摆一样规律，你的内心像冰面一样平静。\n\n你的感官却在背叛你。它们开始捕捉那些无关紧要的细节，像损坏的相机镜头一样无法控制地失焦。你记得一个被火焰喷射器点燃的房间里，墙纸上矢车菊的图案是如何蜷曲、变黑、最终化为灰烬的。你记得一具德国女人的尸体旁，散落着一袋苹果，其中一个滚到了你的靴边，上面还带着一点未被烧焦的红晕。你记得在清剿一座幼儿园时，看到黑板上用彩色粉笔画着一个歪歪扭扭的太阳，一颗流弹恰好打穿了太阳的中心，留下一个黑洞。\n\n这些画面本身并不能唤起你的同情——‘同情’是你出生前就被从基因里剔除的情感。但它们让你感到烦躁。一种莫名的、破坏了纯粹性的烦躁。圣战应该是史诗，是交响乐，背景应该是瓦格纳的《女武神的骑行》和燃烧的国会大厦。而不该是这些···琐碎的、家庭相册里才会出现的片段。手风琴的残骸、掉在地上的洋娃娃、被打碎的餐盘······这些东西的存在，像宏伟壁画上溅落的泥点，它们污染了这场审判的绝对性，让复仇的神圣仪式，看起来像一场歇斯底里的、打砸抢式的街头斗殴。\n\n你的日记内容开始改变。不再有激昂的赞美诗，取而代之的是冰冷的工作日志：“目标区域D7肃清完毕。耗弹112发。发现平民17名，已处理。缴获罐头食品三箱，发霉面包半袋。”字迹工整，像是填写一份报销单。你不再记录你的感受，因为你已经没有什么可感受的了。你只是在记录事实。一个苹果，一个被击穿的太阳。这些也是事实。你把它们也写了进去，不带任何评论，就像记录弹药消耗量一样。\n"
OMS_POSTNUKE.149.a: "今日无事发生。"
OMS_POSTNUKE_149_tt: "我观看，见是虚空；我仰望，并无光亮。"
OMS_POSTNUKE.150.t: "空无一物"
OMS_POSTNUKE.150.desc: "情报说，这座镇子的图书馆是地区指挥官的最后据点。你们付出了三名士兵的代价才攻破了大门。图书馆里弥漫着腐烂纸张和旧木头的气味，阳光透过布满弹孔的窗户，在堆积如山的书籍上投下斑驳的光影，像一座被亵渎的圣殿。\n\n你所期待的恶魔巢穴、你毕生所要对抗的邪恶化身，最终在一个小小的、没有窗户的储藏室里被找到。那里没有地图，没有电台，也没有最后的狂热卫队。只有一个坐在轮椅上的老人，身上盖着一条脏污的毯子。空气中充满了尿骚味和死亡的酸腐气息。他就是那个传说中的指挥官，‘科隆屠夫’。\n\n他已经瞎了。浑浊的眼球茫然地望着前方，嘴角流着口水，嘴里发出无意义的、咯咯的声响。他甚至没有意识到你们的到来。他已经是一个活着的尸体，一个被时间与疾病提前执行了审判的、会呼吸的肉块。他墙上的铁十字勋章早已被尘埃覆盖，那象征着罪恶的制服也散发着霉味。\n\n小队长看着你，眼神示意。轮到你了。这是你的战利品，你的荣耀。去，终结这个条顿恶魔，为你的信仰献上这最终的、最宝贵的祭品。你举起了枪，枪口对准那颗衰老的、毫无知觉的头颅。你想象着亚佐夫元帅坚毅的目光，你试图召唤起十八年来滋养着你的那股神圣怒火。\n\n但什么都没有。\n\n你面对的不是一个魔鬼，而是一个可悲的、行将腐烂的生物。杀死他，没有荣耀，只有一种替清洁工打扫垃圾的乏味感。不杀他，则意味着你过去的一切、你同伴的牺牲，都变成了一场彻头彻尾的、围绕着一具空壳展开的黑色喜剧。\n\n你的信仰，在这一刻，在这间充满了腐朽气味的狭小储藏室里，像风中的烛火一样，闪烁了一下，然后彻底熄灭了。你开了一枪。声音在书堆中显得沉闷。你完成了任务。\n\n你在日记的最后一页，用颤抖的手，只写下了一个词。写完后，你把日记本扔进了燃烧的书堆里。\n"
OMS_POSTNUKE.150.a: "我们赢了。”他对自己说。"
OMS_POSTNUKE_150_tt: "因为在日光之下所临到众人的事都是一样，后来都归死人那里去了。"
OMS_POSTNUKE.151.t: "终末之前"
OMS_POSTNUKE.151.desc: "距那场毁灭世界的大战已经过去了许多年，随着时间的流逝，过去的伤痛被逐渐抹平，幸存下来的人们昂着头，继续向下一天前进。\n\n在那寂静的俄罗斯大地上，有传闻说布哈林还活着，就是那个被认为与苏联战败密不可分的男人。说他现在正藏在某个深山老林中，有些人想找到并审判他，有些人则希望借他去了解那场浩劫之前的事，那许多人都已淡忘了的浩劫之前的故事，就好像它们从未发生过。还有些传闻说在遥远的西方，与俄罗斯人有着血海深仇的条顿人也活着，但那实在遥远，也不易去考证了。\n\n有一批人，他们着魔似地四处宣传，称人类所经历的一切是神的旨意，他们将浩劫前后分别称作旧世界与新世界，并指出，是神让旧世界的一切灭亡，而他们，这些诞生于新世界的人类，是神的使者，他们的任务是带领新世界的人们前进，不再重蹈旧世界的覆辙，让新世界在旧世界的尸骸之上茁壮成长。自然有人反对他们，称旧世界并未完全消散，有许多事物可以证实它仍然存在，他们也并不是神的使者，而是彻头彻尾的骗子。\n\n还有一批人，他们是旧世界的残党，他们的记忆中尘封着那些过去的，形形色色的历史，他们不能接受失去了大部分东西的事实，他们或变得癫狂，或变得抑郁，他们声称现在的一切都是假的，都是虚无，他们不愿意从过去的泡影中走出来，他们走不出来，过去如锁链般紧紧缠绕在他们身上，他们都是活在过去的人，他们都是本应死在那场浩劫中的人。\n\n但是，废土上的所有人，新世界上的所有人，他们无一例外地，都在拼了命地寻找有关那场浩劫的，或浩劫之前的故事，口头讲述也好，文件记录也罢，他们贪婪地吸收着有关过去的一切，他们或许抹平了旧日创伤，或许还没有，那过去的一切也好似被撕成了千片万片的碎片，被撒向世界各处，有些被扔入大海，永不见天日，有些被掷入岩浆，化为尘埃，随风飘散到无穷的远方，还有些落在人的手心，被人知晓。\n\n过去变成了虚无，人类则负责填充它，尽管七零八落，混乱不堪。\n\n"
OMS_POSTNUKE.151.a: "人们不断探寻过去的故事，拼接历史的碎瓦。"
OMS_POSTNUKE.152.t: "因为在你们当中"
OMS_POSTNUKE.152.desc: "亚佐夫站在高处，用核心论点引出了他举办此次演讲的原因:“同志们！我知道，你们大家都觉得住在地堡里面很闷，但是，昔日那些摧残祖国母亲的匪徒仍然挺立在他们的日耳曼尼亚老巢中！而我们所要做的，就是再次踏上向西方仇敌们的复仇之路！”\n\n言毕，台下的诸多黑联士兵纷纷鼓掌，虽然说他们依然抱有着热情，但亚佐夫很明显地感觉到，他们当中很大一部分人已经力不从心了，甚至于有一半的人只是苦笑。\n\n亚佐夫难免感到了愤怒，他为他们做了这么多，带领他们向德国复仇，结果到最后，他们居然不去真心地崇拜他，反倒要开始埋怨了？\n\n叛徒，对，虽然经过核弹轰炸，但条顿人一定派出了间谍，密切关注着俄罗斯大地上他们的一举一动！这里一定混入了叛徒！亚佐夫转念一想，仅凭目前的条件，他们是无法打败条顿人的，必须找到核战前他们贮藏在俄罗斯各地的补给物资，同时，他必须确保军队仍然如同昔日般骁勇善战。\n\n但，究竟是什么导致了士气萎靡、食不果腹呢？\n"
OMS_POSTNUKE.152.a: "有一个卖主的叛徒。"
OMS_POSTNUKE.153.t: "铭记卡尔贝舍夫"
OMS_POSTNUKE.153.desc: "“曾经，伟大的联盟创立者，政治家、军事家······我们的国父，卡尔贝舍夫同志，一直都寄希望于我们，将联盟托付给了我，希望我们有一天可以向条顿人完成伟大复仇。”亚佐夫向众人喊话到，言语里透露着一股哀伤与悲惨，以煽动起来军队士兵的情绪。\n	\n“······但令人悲伤的是，伟大导师卡尔贝舍夫，还未能见到俄罗斯祖国挣脱条顿人魔爪，向其进行大审判，就先一步离开了我们，迷失在了广袤的森林当中······”说到此处，台下的诸多士兵都有意无意的哭泣着，为这位黑色联盟的缔造者而感到哀伤。\n\n“但现在，我们势必要达成对条顿人的复仇！我们要杀得条顿人片甲不留、血流成河，完成卡尔贝舍夫同志的遗愿！”言毕，台下诸多黑联士兵都发出了欢呼，向着他们的领袖——德米特里·亚佐夫而鼓掌。\n"
OMS_POSTNUKE.153.a: "可卡尔贝舍夫真的希望如此吗？"
OMS_POSTNUKE.154.t: "失败主义批判大会"
OMS_POSTNUKE.154.desc: "“联盟的同志们！军队士兵们！俄罗斯同胞们！”亚佐夫用振奋人心的喊话开始了讲话。\n\n“自我们第一次打败了条顿魔鬼后，全国上下一致对于彻底消灭他们抱有极高的热情，这点我想你们是知道的。”雪花被大风吹向了亚佐夫的帽子和军大衣，覆盖在了他的帽徽和勋章上，似乎替台下的听众们反驳亚佐夫那丧心病狂的想法。\n\n亚佐夫清了清嗓子：“我知道，很多人并不认同我的看法，觉得在经历过一场毁天灭地的核大战后，我们完全没有办法再次同条顿人相对抗，但我要声明——这些人都是可耻的失败主义者！”\n\n这句话语惊四座，很多人都身体一震，但随后，他们或许意识到了自己行为的“不得体”，连忙通过鼓掌欢呼来缓解尴尬。亚佐夫对于这种反应早有预料，但他没想到会有这么多人是所谓的“失败主义者”。\n\n怎么办？把在场的所有人都留在这，然后派几个人过来用冲锋枪扫死他们吗？亚佐夫没有信心去做，或者说，自从核大战以后，他失去了曾经的“癫狂”。把这么多人都杀掉，谁去打败条顿人呢？以后的人们又会怎么看待他？一个嗜血成性的杀人狂吗？亚佐夫想了想，最终做出了决定——\n"
OMS_POSTNUKE.154.a: "找个人杀鸡儆猴，他们会明白的。"
OMS_POSTNUKE.154.b: "都杀了！"
OMS_POSTNUKE.155.t: "DMCA的举报"
OMS_POSTNUKE.155.desc: "“哎卧槽，什么死妈玩意？”\n\n弗拉基米尔震惊且难以置信地望着邮寄到他们公司大门口的信，上面用极其离谱且弱智的理由“义正言辞”地说他们公司触犯了所谓“DMCA版权法”，侵犯了别人家实业的版权。弗拉基米尔生气地将这封信用力地摔在了办公桌上，“什么狗屁不通的玩意！我就没见过市面上有什么跟我们家设计的铁铲子长得差不多的，凭什么说我侵权了？还有什么叫他妈的DMCA？”弗拉基米尔思绪万千，最后做出了决定。“把这封信交给亚佐夫元帅看看吧，说不定他会有点头绪呢？”\n\n亚佐夫本来正在办公室中坐着，在统一整个俄罗斯之后，他难得有了如此的清闲时间，他也瘫在了椅子上，喝着咖啡，回忆昔日他与卡尔贝舍夫的美好时光······\n\n“总司令！我们的军用铲订购商遇到了急事！”亚佐夫的秘书嘭的一下推开了亚佐夫办公室的大门，亚佐夫吓得将嘴里的咖啡喷了出来，溅到了桌上的纸。\n\n“他们不能自己处理吗？找我干啥？”亚佐夫怒目圆睁，埋怨弗拉基米尔和自己的秘书打断了自己难得的休息时刻。“抱歉，亚佐夫总司令，可您一定得看看这个！”亚佐夫从秘书手中接过了信，刚看了几行，他就疑惑地问到:\n\n"
OMS_POSTNUKE.155.a: "“什么他妈的叫DMCA？”"
OMS_POSTNUKE.156.t: "彼得罗夫（二十四岁，114515号干员）的日记"
OMS_POSTNUKE.156.desc: "我叫彼得罗夫，刚刚成为黑色联盟军用铁铲制造商工厂装配线上的流水线工人不到一个月，平时的日子都很普通，但是今天早上有一封充斥着我们看不懂的言辞的信寄到了工厂的信箱。上面说:“注意，已向此产品发出一则dmca版权侵犯通知，将审核此投诉并与生产此商品的公司进行沟通，以及提供关于后续事宜的细节与信息。”我们当即炸开了锅，老板弗拉基米尔知道这件事以后表示很震惊，因为他对那什么“Dmca”没有半点知情。于是他赶忙动用渠道联系了亚佐夫同志，然而就连亚佐夫同志对此也一头雾水。随后，更严重的事情来了，我们身上的衣服，我们工厂墙上的钢筋混凝土，我们的机床，我们仓库里放置的铁块，甚至弗拉基米尔办公室里的袜子纷纷收到了那什么“dmca通知”，据说连亚佐夫元帅的帽子和茶缸也没能幸免，而且没有人知道这些东西是哪里来的，只知道是一个叫做“脚本”的人发送的。天知道他的他为什么要这么做？以及他的名字为什么这么奇怪？\n\n最终，我们工厂得知，“黑色联盟DMCA举报成功后会进入10天到1个月的解除期 在此期间内如果举报方没有向“蒸汽”发送邮件申请解除DMCA，则大概率会将被举报方勒令禁止生产/注销公司营业资格处理”尽管我们一直没有弄明白到底是什么组织指示那个奇怪的人发了这个文件，但当我们向说明中的邮箱投入了一封申诉信以后，我们收到的信居然莫名其妙消失了!真是太神奇了!\n\n联盟因为这事乱了好一阵子，因为无论什么东西都会被寄这样的威胁信!最可恶的是，那个到处乱发“dmca”的人的身份一直没有被披露，不过我从我在司法部门的表哥那里知道，最后是一家名字是v开头的民间公司把他抓捕归案的，据说那个民间公司用的手段是“封禁脚本账号?”总之，不幸的是，那个人背后的组织仍然逍遥法外······真是可恨!\n"
OMS_POSTNUKE.156.a: "这些都是啥玩意？"
OMS_POSTNUKE.157.t: "第七天：天光乍破"
OMS_POSTNUKE.157.desc: "父亲是对的。\n\n今天，我看到了太阳。地堡里的长辈们总说它是一团巨大的、能刺痛眼睛的火焰，但在我的记录本里，我必须诚实地写下——它更像一枚悬在天穹上的、温热的橙色徽章。它的光芒并不灼人，被一层薄薄的、永不消散的灰色云纱过滤后，温柔地洒在这片广阔得···没有尽头的土地上。我平生第一次感到自己的渺小，不是在地堡里那种被混凝土墙壁挤压出的渺小，而是在一种真正伟大的、名为‘世界’的存在面前，那种自愿献身的渺小。升降梯的钢门在我身后关闭时发出的巨响，像是为我，为我们，奏响了新世纪的礼炮！\n\n空气，是的，空气！政委命令我们戴好防毒面具，他说空气里有条顿人留下的毒。但我还是偷偷掀起面罩的一角，吸了一小口。那味道···和我父亲描述的完全不同，没有松树的清香，也没有雨后泥土的味道。它很复杂，带着铁锈、烧焦的木头和某种···干涸的尘土味。但这依然是‘自由’的味道！是循环系统里永远过滤不掉的、真实的味道！我喜欢这个味道，它让我感觉自己活着，不再是地堡里一个靠营养膏和编号维系的存在。\n\n我们正在向西开进。装甲运兵车里很颠簸，但我坚持打开观察窗的一道窄缝。我看到的一切，都和宣传画册上画的一样，又完全不一样。被摧毁的房屋像巨人的骸骨，扭曲的铁轨指向虚无的天际。这里是焦土，是地狱，是条顿人罪恶的纪念碑。但我心中没有恐惧，只有一种神圣的使命感在燃烧。我，帕维尔，黑色联盟的一名普通士兵，将要亲手净化这片土地，用敌人的血，浇灌出父亲故事里那片和平的麦田。连队的歌声已经在我耳边响起，虽然隔着防毒面具听起来有些沉闷，但每一个音符都敲击着我的心脏。\n\n父亲总是在睡前告诉我，核爆前，世界是一首歌。现在，它只剩下噪音和静默。但我们会成为新的歌者！我们会用枪声谱写序曲，用炮火奏响华章，直到最后的审判完成，世界将再次听到俄罗斯母亲的摇篮曲。我把我的配枪擦了一遍又一遍，它的枪身比我在地堡里见过的任何东西都更真实、更值得信赖。我已经等不及了。等不及见到第一个敌人，第一个需要被‘删除’的罪行符号。这会是我献给新世界的、第一份也是最纯洁的礼物。\n"
OMS_POSTNUKE.157.a: "他用力的写下了结语。“让审判开始吧！为了联盟！”"
OMS_POSTNUKE_157_tt: "§R耶和华对摩西说：‘你举手向天，使埃及地都黑暗了，这黑暗似乎摸得着。’\n——《出埃及记》10:21§!"
OMS_POSTNUKE.158.t: "第十九天：泥土之塑"
OMS_POSTNUKE.158.desc: "我今天杀了一个人。\n\n这个句子，我写了又划掉，划掉了又重新写上。墨水在纸上洇开，像一滩无法抹去的污渍。我不知该如何记录。这不是我所期待的战斗。没有冲锋，没有呐喊，甚至没有像样的抵抗。但泽的废墟像一座巨大的、沉默的墓园，我们只是在墓碑之间穿行，寻找那些还未彻底腐烂的幽灵。\n\n他就藏在一个半塌的地窖里。小队长一脚踹开那扇腐朽的木板，用手电照了进去。我们看到的不是手持武器的条顿士兵，而是一个···老人。他的身体干瘦得像一根枯枝，穿着破烂的衣服，手里捧着一块灰色的、长了霉斑的硬石——后来我们才知道，那是一块凝固了的水泥块。他看到我们的枪口，没有惊慌，也没有愤怒。他只是颤颤巍巍地举起那块石头，用一种我听不懂的语言，反复说着一个词。他的眼睛，那双浑浊的、几乎没有光泽的眼睛，竟然在恳求。\n\n小队长用枪管捅了捅我的后腰。‘新兵，该你上场了。’他的声音里带着一丝不耐烦的、几乎是无聊的语气。我的心跳瞬间像被冻住了。这是我的第一次，我的‘洗礼’。我训练了无数次，在靶场上打穿了上千个靶心。但靶子是纸做的，它不会用那种眼神看你。\n\n我举起了枪。我的手在抖。我试图在脑海里召唤出那些我背得滚瓜烂熟的口号，那些关于卡尔贝舍夫、关于被屠杀的百万同胞的血泪史。但此刻，它们都变成了空洞的噪音。我的视野里，只有那双眼睛。它们没有恨意，没有恐惧，只有一种我无法理解的···纯粹的困惑。像是在问：为什么？\n\n我闭上眼，扣动了扳机。\n\n枪声在这片废墟里显得格外响亮。我睁开眼，他没有像靶子一样应声倒下。子弹在他的胸口开了一个小洞，深色的血缓慢地渗出，染黑了他那件破烂的外套。他低头看了看自己的胸口，又抬头看了看我，那种困惑的眼神变得更深了。然后，他就那样软了下去，像一尊被人抽走了所有支撑的、用劣质陶土捏成的人像，静悄悄地垮成了一堆。他手里的水泥块滚到我的脚边。一切都结束了。\n\n我在日记里本应写下‘我为联盟清除了一个敌人’。但我现在只想知道，他最后那个词，到底是什么意思？还有那双眼睛···为什么我一闭上眼，就全是那双眼睛？它看着我，像一个永远得不到解答的问题。\n"
OMS_POSTNUKE.158.a: "我不明白。"
OMS_POSTNUKE_158_tt: "§R耶和华神用地上的尘土造人，将生气吹在他鼻孔里，他就成了有灵的活人，名叫亚当。\n——《创世记》2:7§!"
OMS_POSTNUKE.159.t: "第四十五天：迦南地的苦蜜"
OMS_POSTNUKE.159.desc: "又是一场清剿。\n\n这个词，政委很喜欢用。“清剿”，好像我们是在扫除垃圾，而不是熄灭一盏又一盏灯火。在瓦尔特兰的枯草平原上，我们像一群不知疲倦的农夫，收割着残存的生命。命令说，这里的村庄为游击队提供庇护。但我们找到的，只有沉默的老人和眼神空洞的妇人。\n\n杀戮，已经开始变得像呼吸一样自然，也一样乏味。枪托抵在肩上，感受后坐力，然后看着一个躯体倒下。我的动作越来越熟练，心却越来越空。那种在但泽废墟里感到的、针扎般的刺痛感，已经迟钝了。取而代之的，是一种更深沉的、弥漫开来的麻木。\n\n今天，我们围住了一座农舍。里面传出女人的哭喊和孩子的尖叫。我踹开门的时候，看到一个女人正用身体护着两个孩子。她的金发很乱，脸上沾着炉灰，但那双眼睛···\n\n那双眼睛像两枚蓝色的冰片，深深地刺进了我的记忆里。\n\n父亲曾给我看过一张核爆前的旧照片。是我的母亲。我不记得她了，地堡里没有她的档案。但照片上，她就有着那样一双眼睛。父亲说，母亲就死在条顿人的空袭里，当时，她也是这样护着···护着一个我不存在的姐姐。\n\n我开枪了。\n\n我的身体自己动了起来，仿佛不是我的一样。子弹撕裂空气，女人的哭喊戛然而止。孩子们惊恐地看着他们的母亲倒下，然后看着我的枪口。\n\n在那一瞬间，我的大脑一片空白。我仿佛看到我父亲站在我面前，他没有穿着黑色联盟的制服，而是穿着地堡配发的那件、打了好几块补丁的旧工装。他的脸上，带着我在但泽杀死那个老人时，看到的那种···无法理解的、混杂着悲伤的困惑。\n\n我是不是，也曾被人这样护在身后？我是不是，也曾是另一个故事里，那个被保护的孩子？\n\n那我现在···又在做什么？\n\n晚些时候，我坐在火堆旁，翻看着我的日记。我看到自己第七天写下的那些激昂的文字，感觉像是在读一个陌生人的故事。那个渴望“净化世界”的帕维尔，和今天这个对着母亲肖像开枪的帕维尔，是同一个人吗？\n\n我想起了地堡，想起了我那个狭小的、只有一张床和一个储物箱的“家”。那里没有窗户，没有真正的阳光，但至少···那里没有哭声。\n\n我的记忆开始混乱。父亲的面孔，和那个但泽老人的面孔，在火光中重叠。母亲照片上的眼睛，和今天倒下的那个女人的眼睛，变成了同一双。\n我突然有一种荒谬而恐怖的想法。\n\n我在这里杀死的每一个老人，会不会就是我的父亲？\n\n我杀死的每一个女人，会不会就是我的母亲？\n\n在最终的审判里，我审判的，是不是就是我自己？\n"
OMS_POSTNUKE.159.a: "“天啊。”"
OMS_POSTNUKE_159_tt: "§R我心里说，这乃为世人的缘故，是神要试验他们，使他们觉得自己不过像兽一样。\n——《传道书》3:18§!"
OMS_POSTNUKE.160.t: "第六十一天：羔羊之血"
OMS_POSTNUKE.160.desc: "潮湿的空气从波罗的海吹来，带着一股咸腥的、如同泪水般的味道。我们在一片沼泽地里扎营。阴冷的天气和无休止的战斗，让连队里的气氛像一根绷紧到极限的弓弦。昨晚，一个叫谢尔盖的战友崩溃了。他把枪扔在泥地里，跪在那里，反复地用头撞着一棵枯树，嘴里喊着他妻子的名字。\n\n今天，政委召集了全连。\n\n谢尔盖被五花大绑地拖到队伍前面。他的眼神已经涣散了，嘴里还在不停地念叨着什么。政委站在一块石头上，他的声音像淬过火的钢铁，冰冷，坚硬，不带一丝温度。\n\n“黑色联盟的战士，没有家人，没有过去，没有软弱！”他的目光扫过我们每一个人，“你们的慈母是俄罗斯，你们的父亲是亚佐夫大元帅！你们的信仰是卡尔贝舍夫同志的英灵！任何形式的怜悯，都是对联盟的背叛！对死难同胞的背叛！是对最终审判这一神圣事业的亵渎！”\n\n他拔出了手枪。\n\n“想想亚佐夫大元帅！想想卡尔贝舍夫同志！他们在承受苦难时，可曾有过片刻的动摇？你们的痛苦，和他们相比，算得了什么？和我们整个民族所承受的相比，又算得了什么？！”\n\n一声枪响。\n\n谢尔盖的身体向后一仰，倒在了泥水里。再也没有祷告，也没有呼唤了。一切都安静了下来。只剩下风吹过芦苇丛的沙沙声。\n\n我站在队伍里，看着这一幕。我的身体没有发抖，我的内心甚至没有泛起太大的波澜。那是一种超越了恐惧的、被掏空了的麻木。政委的话，像一把手术刀，精准地切除了我心中最后一点残存的、名为“人性”的肿瘤。\n\n是的，他说得对。\n\n为了生存，必须放弃感受。\n为了胜利，必须成为工具。\n\n家，父亲，母亲···这些都是幻觉。是必须被割除的、会引起感染的腐肉。唯一的真实，就是命令。唯一的意义，就是扣动扳机。\n\n晚上，我烧掉了我母亲的那张旧照片的复制品。火焰舔舐着相纸，那双蓝色的眼睛最后看了我一眼，然后化为灰烬。我还把前几天的日记也撕了下来，扔进火里。那些疑问，那些混乱，那些关于“父亲”和“母亲”的呓语，都是软弱的证明。\n\n从今天起，帕维尔死了。活下来的，是一个士兵。一个没有过去，也不需要未来的···执行者。\n"
OMS_POSTNUKE.160.a: "“我志愿成为审判的刀刃。”"
OMS_POSTNUKE_160_tt: "§R你要吩咐亚伦和他的子孙说：燔祭的条例乃是这样······坛上的火要常常烧着，不可熄灭。\n——《利未记》6:9§!"
OMS_POSTNUKE.161.t: "第九十八天：立于地上之巴别塔"
OMS_POSTNUKE.161.desc: "日志条目。日期：审判日+98。地点：扇区G-4，前西里西亚工业联合体。天气：持续性酸性降雨。能见度：差。\n\n本日任务：肃清3号熔炉及周边附属建筑群。A组负责东翼，B组（本组）负责西翼。遭遇抵抗：中等。敌方单位主要由地方民兵及退伍老兵构成，武器装备为轻武器及少量爆炸物。\n\n10:00 - 开始行动。\n\n10:17 - 在C号仓库入口遭遇第一波火力。敌方2人，MP40，已清除。我方无伤亡。\n\n10:45 - 沿管线通道推进。通道狭窄，发现并排除绊索式爆炸物x1。\n\n11:23 - 进入熔炉主体建筑。敌方火力点位于二层平台。火力压制后，使用手榴弹x2清除。确认敌方单位x4阵亡。我方士兵伊万左臂被流弹擦伤，已包扎。\n\n12:30 - 午间休整。配给：B类营养棒x1，净化水500ml。检查弹药余量：7.62mm x 94，手榴弹x2。装备状况良好。\n\n13:10 - 继续推进。搜索底层工人休息室。发现躲藏平民x7（男2，女3，童2）。根据条例L-7之规定，已处理。\n\n是不是···忘记了些什么。\n\n14:05 - A组报告东翼已肃清。B组开始对地下泵房进行最后排查。\n\n14:28 - 泵房内残余敌方单位x1，持猎枪，负隅顽抗。清除。\n\n15:00 - 任务完成。全区域已控制。本日战果统计：\n\n本组确认歼敌：7个战斗单位，7个非战斗单位。\n\n本组弹药消耗：7.62mm x 88发，手榴弹x2。\n\n本组人员损失：1人轻伤。\n\n缴获物资：步枪x3（已损坏），罐头食品x12罐（标签腐蚀，待检），医疗用品若干。\n行动效率评估：优良。\n\n气温：6摄氏度。湿度：92%。风向：西北。\n\n今天下雨了。\n\n我感觉···很好。效率很高。行动很顺利。身体机能正常。脉搏平稳。\n\n希望明天能更好。\n\n为了大审判的事业。\n"
OMS_POSTNUKE.161.a: "“下一个目标坐标是哪里？”"
OMS_POSTNUKE_161_tt: "§R我见日光之下所做的一切事，都是虚空，都是捕风。\n——《传道书》1:14§!"
OMS_POSTNUKE.162.t: "第一百三十四天：客西马尼园的血汗"
OMS_POSTNUKE.162.desc: "下雨了。又下雨了。黑色的森林，黑色的雨。这里的树都死了，像一根根伸向天空的、烧焦的手指。他们管那些抵抗者叫“狼人”。一群孩子。躲在树林里，用土制的炸弹和生锈的猎枪朝我们射击。可笑。\n\n战斗很短。他们甚至不知道怎么正确地设置交叉火力。我们损失了一辆运兵车，两个人受伤。然后，就结束了。我们像秋天扫落叶一样，把他们从林子里扫了出去。\n\n我杀了一个...一个男孩。\n\n他和我差不多大。可能还要小一些。我从一棵树后绕过去，他正手忙脚乱地给他的老式步枪装填子弹。他看到我的时候，脸上没有害怕，只有一种野兽般的惊愕。我开了枪。本能。训练。就像呼吸。他倒下的时候，有什么东西从他破烂的上衣口袋里滑了出来。是一张纸。一张被雨水浸湿、折叠得很好的纸。\n\n是一幅画。蜡笔画。画得很幼稚，线条歪歪扭扭。一个黄色的、长着笑脸的太阳。太阳下面，是三个手拉着手的小人。一个男人，一个女人，还有一个更小的孩子。画的角落，还用铅笔歪歪扭扭地写着一个名字：Klaus。\n\n太阳。\n\n是了···我有多久没见过真正的太阳了？地堡里没有。在地表，它也只是一个昏暗的橙色圆盘。我···是不是也曾画过太阳？在地堡的保育室里，用配发的、永远不够用的蜡笔头？我记不清了。父亲······父亲的脸，我想不起来了。我越是努力去想，它就越模糊，最后只剩下一双······一双悲伤的眼睛。\n\n我站在男孩的尸体旁，看着那幅画。雨水把上面的颜色冲刷开来，黄色的太阳流出了彩色的眼泪。\n\n这时，我听到了笑声。\n\n不是我的战友。是一种······孩子的笑声。很清脆，就在我耳边。我猛地回头，森林里只有雨声和风声。我又听到了。这一次，更清晰了。他们在叫我的名字。帕维尔。\n\n“帕维尔，来玩呀。”\n“帕维尔，太阳出来了。”\n\n我开始发抖。不是因为寒冷。我端起枪，对准了黑暗的树林。\n\n“谁在那里？！”我吼道。\n\n没有人回答。只有那挥之不去的、孩子的笑声。它从四面八方传来，钻进我的耳朵，钻进我的脑子。他们在笑我。笑我这个···杀死了画太阳的男孩的怪物。我开始胡乱地开枪，把一整个弹匣都打空了。子弹撕裂了树皮，在泥地上溅起一串串水花。\n\n但笑声没有停止。它们还在笑。\n"
OMS_POSTNUKE.162.a: "闭嘴！都给我闭嘴！"
OMS_POSTNUKE_162_tt: "§R妇人说：‘我们刚生下来的婴孩，岂是我们所爱惜的果子吗？’······耶和华啊，求你观看！\n——《耶利米哀歌》2:20§!"
OMS_POSTNUKE.163.t: "第一百五十一天：蛾摩拉之雨"
OMS_POSTNUKE.163.desc: "血。是红色的。暖的。\n\n城市在燃烧。不对，是世界在燃烧。我感觉自己就站在焚烧世界的巨大熔炉边上，每一次呼吸都吸入了滚烫的灰烬。钢筋在融化，石头在哭泣，空气里充满了尖叫和烤肉的味道。美妙极了。这是一首交响曲，是亚佐夫大元帅亲自指挥的、献给亡灵的镇魂歌。炮弹是定音鼓，机枪是小提琴，而我的步枪···是首席长笛，吹奏着最华丽、最尖锐的死亡乐章。\n\n是的，是的，他们在我耳边唱歌。那些在地堡里从未存在过的孩子们，那些我亲手送去见太阳的孩子们。他们的声音不再遥远，而是直接从我的脊髓里长了出来，通过我的牙齿共鸣。他们在我脑海里荡秋千，用骨头敲击我的头盖骨，为我唱着赞美诗。“帕维尔，”他们咯咯地笑，“这里是巴比伦，大淫妇的巢穴。把她的墙推倒，把她的儿女摔在石头上！”\n\n我知道，我知道！这里是罪的源头。每一块砖石都浸透了俄罗斯的眼泪，每一寸下水道都流淌着斯拉夫的鲜血。每一个活物，都是一条毒蛇，都该死。\n\n净化。这个词，我想起来了。多么美妙的词。像清晨的第一滴露水，落在烧红的铁板上，瞬间蒸发，带走所有的污秽。我正在执行一场神圣的洗礼，用火焰与钢铁。\n\n政委死了。我看着他死的。昨天下午，三点十七分。一颗152毫米炮弹，精准，优雅，像上帝的手术刀。他的上半身飞到了那边的屋顶上，下半身还留在原地，抽搐着，像一只被踩断了的甲虫。我看着他的肠子挂在电线杆上，风吹过，像节日的彩带一样飘荡。真漂亮。他总是在我们耳边咆哮，说我们是审判的刀刃。现在好了，刀刃用久了会钝，祭品却是永恒的。他成了我们这场伟大献祭中，最肥美的一块肉。很好。这很公平。\n\n我看见他们了。那些从地下室里爬出来的，高举着双手，手里攥着揉得发皱的白布。他们在求饶。向谁求饶？向已经死了的政委吗？还是向我？\n哈哈哈哈哈哈哈哈哈哈哈哈！\n\n我不是帕维尔了。帕维尔是谁？一个会在日记里写下“我不明白”的蠢货？一个会因为一张幼稚的儿童画就发抖的懦夫？不。他已经死了。被孩子们的笑声，被那个金发男孩流泪的太阳，彻底杀死了。\n\n我是那阵焚风。我是那场酸雨。我是从天而降的硫磺与怒火。我是亚佐夫大元帅钢铁意志的延伸，是卡尔贝舍夫同志复仇之魂的化身！我是新世界的先知，是旧世界的掘墓人！\n\n孩子们在我耳边拍着小手，他们的声音盖过了炮火声。“杀呀，帕维尔，杀光他们，”他们唱着，“太阳就快出来了，红色的，漂亮的太阳！”\n\n我当然要杀。这是我的天职。这是我的圣餐。那个举着家人照片的年轻士兵，金色的头发沾满了脑浆和灰尘，真好看。他想让我看他的妻子和婴儿。我看了一眼。很可爱的祭品。然后我把枪管塞进了他的嘴里。砰。世界瞬间就安静了。真好。\n\n我的战友们······谢尔盖，伊万······他们看我的眼神，很奇怪。像在看一头野兽，一个怪物。他们甚至不敢靠近我。真可笑。他们才是瞎子，被血肉的表象蒙蔽了双眼。他们看不见这座罪恶之城上空盘旋的、复仇的炽天使。他们听不见那些催促我的、神圣的歌声。他们是迷途的羔羊，还妄想用自己那点可怜的道德感来评判挥舞着牧羊杖的······不，我不是牧羊人。我是那头奉神之命前来咬死所有瘟羊的狼。\n\n今天，我又画了一个太阳。用一个德国军官的血。在他办公室的墙上。画得很好。很圆。很红。像父亲···不，不要想父亲。父亲已经死了。我也是。我们都死了。所有人都死了。\n\n我们只是穿着人皮的尸体，在这场盛大至极的、献给虚无的葬礼上，不知疲倦地跳舞。\n\n真好玩。\n"
OMS_POSTNUKE.163.a: "日记的这一页已经无法辨认字迹。"
OMS_POSTNUKE_163_tt: "§R我又看见一位天使站在日头中，向天空所飞的鸟大声喊着说：‘你们聚集来赴神的大筵席！’\n——《启示录》19:17§!"
OMS_POSTNUKE.164.t: "第一百七十二天：骷髅地上的“成了”"
OMS_POSTNUKE.164.desc: "一切都结束了。\n\n烟还在从焦黑的穹顶骨架里升起，像一道道灰色的、疲惫的、永不消散的叹息，飘向那片铅一样沉重的天空。我独自一人站在这座被称为“国会大厦”的巨大坟墓之上，脚下是碎裂的石雕、熔化的金属、无数扭曲的弹壳和一层厚厚的、被风一吹就扬起的白色粉末。我抓起一把，在指间捻了捻。触感细腻，冰冷。我不知道这是被烧成灰烬的百年档案，还是一个议员的骨灰。或许，这本就没有区别。一切终将归于尘土。\n\n这里，就是终点。是地堡里所有地图指向的最终坐标，是政委每一场演说的神圣高潮，是我过去一百七十二天地狱征程的唯一航标。这里是我所有狂热、所有杀戮、所有梦境与呓语的圣地。我曾无数次地想象过这一刻。我以为，当我站在这里时，天空会降下火焰的启示，大地会因我的胜利而震动，我会听到千百万死难同胞的灵魂在高唱赞歌，我会感到一种焚尽旧世界的、创造新纪元的、神明般的狂喜。\n\n但我什么也感觉不到。\n\n耳边那些孩子的笑声，消失了。仿佛他们只是来为我引路的顽童，现在目的地已到，他们便一哄而散，回到了他们那不存在的家里。\n\n血液里那股催促我杀戮、让我颤抖的燥热，也冷却了。像一台过热的引擎，终于耗尽了最后一滴燃料，现在只剩下冰冷的、死寂的钢铁。\n\n脑海中那些关于“毁灭天使”与“神圣净化”的宏伟幻象，像一场高烧后的潮热，无声无息地退去了。\n\n留下的···什么都没有。\n\n一片广阔的、死寂的、比地堡最深处的永冻层更寒冷、更空洞的虚无。\n\n我低下头，看着我的双手。它们沾满了已经干涸发黑的血污和擦不掉的硝烟，它们曾像两把独立的、拥有自己意志的榔头，敲碎了无数头骨。它们是这场审判最忠实的执行者。可现在，我看着它们，只觉得陌生。好像它们属于另一个人。那个被称为“帕维尔”的狂人。而我，只是一个碰巧住在他躯壳里的、疲惫的房客。\n\n我赢了吗？是的，我们赢了。在废墟的最高处，那面绘着锤子与镰刀的、沾满了血与火的黑色旗帜正在风中猎猎作响。它宣示着我们的胜利。\n我复仇了吗？是的，我想是的。这座城市的每一寸土地，都被条顿人的血浸透了。这是一笔精确到骨髓的、血债血偿的买卖。\n但那又如何？\n\n我父亲模糊的脸，不会因此而清晰。那个在勃兰登堡森林里画太阳的男孩，不会再拿起他的蜡笔。我用毁灭，去回应毁灭。我用杀戮，去终结杀戮。最终的结果，只是将一座废墟，变成了一座更大、更彻底、更无可救药的废墟。\n\n支撑着我一路走来的那根名为“仇恨”的、滚烫的脊梁，在抵达终点的这一刻，喀嚓一声，脆生生地断了。疯狂的火焰燃尽了自己，剩下的只有冰冷的灰烬和一股令人作呕的焦臭味。我感觉很累。一种前所未有的、从灵魂最深处泛出的、无可名状的疲惫。像一个跋涉了千万里，终于登上山顶的朝圣者，却只为了看清，山顶之上，一无所有。连一个可以跪拜的偶像都没有。\n"
OMS_POSTNUKE.164.a: "“我到了。”"
OMS_POSTNUKE_164_tt: "§R第七位天使把碗倒在空中，就有大声音从殿中的宝座上出来，说：‘成了！’\n——《启示录》16:17§!"
OMS_POSTNUKE.165.t: "第一百八十五天：盐海不兴微澜"
OMS_POSTNUKE.165.desc: "海。\n\n他们称之为海。我第一次见到海。\n\n父亲曾说过，海是蓝色的，像母亲的眼睛。地堡里所有关于海的描述，也都离不开“蔚蓝”、“壮阔”、“生命摇篮”这样的词汇。\n\n眼前的这片···东西，不是蓝色的。\n\n灰色的天空，低垂着，像一块巨大的、浸满了脏水的帆布，随时都会因为无法承受自身的重量而垮塌下来。天空之下，是灰色的沙滩。沙子里混杂着金属碎片、被烧焦的木头和一些无法辨认的、白色的骨骼碎片。踩在上面，发出一种空洞的、令人牙酸的摩擦声。\n\n然后是海本身。\n\n灰色的海浪，无休止地、一道接一道地涌上沙滩，又疲惫地退去。它们看上去没有力量，没有愤怒，只有一种机械的、永恒的、毫无意义的重复。海浪的声音不是咆哮，而是一种低沉的、持续不断的叹息，仿佛整个地球都在因为无法痊愈的剧痛而呻吟。空气中，弥漫着咸腥味、腐烂海藻的气味和一股淡淡的、永远也散不去的化学药品的味道。\n\n这里没有海鸥。没有船只。没有生命。只有我和这片无边无际的灰色液体。\n\n我在这里站了很久。几个小时，也许是一整天。我的战友们在后方的村庄里进行最后的、同样毫无意义的“清剿”，但小队长没有催促我。或许，连他也厌倦了。战争已经结束了。我们赢了。现在只剩下收拾残局的垃圾时间。\n\n我凝视着这片海，试图从中找到任何一丝我曾被告知过的美。但没有。我看到的，只有我自己。我的内心，就是这片灰色的海。那永不停歇却毫无意义的浪潮，就是我过去的日日夜夜——那些杀戮、那些行军、那些麻木的日子。沙滩上的残骸，就是我被肢解的记忆。天空的颜色，就是我灵魂的底色。\n\n我曾以为我是一个有目的的工具，一把为了“最终审判”而被锻造出的利刃。但现在，站在这片终极的荒凉面前，我明白自己什么都不是。我不是工具，也不是士兵，甚至不是帕维尔。我只是一粒被战争的巨浪偶然推到这座沙滩上的沙子，和其他所有死去的、活着的沙子，没有任何区别。当下一波浪潮涌来，我就会被带走，消失在这片灰色的虚无里，不会留下任何痕迹。\n\n父亲口中的那个世界，政委许诺的那个未来，我为之奋斗并亲手毁灭的那个旧世界···所有宏大的叙事，所有崇高的理由，最终都消解于眼前这片毫无意义的灰色之中。人类，为什么会一次又一次地重蹈覆辙？从这片死寂的海里，我得不到答案。或许，根本就没有答案。我们只是在重复一个荒谬的、无法终止的循环，直到最后一粒沙子也被磨成尘埃。\n"
OMS_POSTNUKE.165.a: "发现波罗的海。水体呈灰褐色，未见生命迹象。"
OMS_POSTNUKE_165_tt: "§R我又见一个新天新地；因为先前的天地已经过去了，海也不再有了。\n——《启示录》21:1§!"
OMS_POSTNUKE.166.t: "第？？？天：第六日的寂静"
OMS_POSTNUKE.166.desc: "如果你能看到这张纸。\n但我知道你看不到。在这片被众神遗弃的、广阔的灰色荒原上，不会再有第二个活人了。只有风，和被风吹拂的灰。\n现在是审判日的第193天。\n也许是194天。这里的日出和日落，都只是一场灰色的骗局。时间失去了意义。\n我只写下结论。\n\n失败了。失败了。失败了。\n\n我试着想记起地堡的天花板是什么样子。那上面有一道裂纹，像一条蜿蜒的、灰色的河流。父亲曾指着它告诉我，那是通往地表的地图。我们只要沿着这条河走，就能找到出口。\n\n都错了。一切都错了。从地堡的第一块砖开始。从父亲的第一个故事开始。从我扣动第一次扳机开始。全都错了。我本以为能找到答案。在东普鲁士，在但泽，在柏林的灰烬里，在那片灰色的海边。我以为这场征程的终点，会有一个理由，一个意义，哪怕是一个可以让我憎恨的、具体的魔鬼。\n\n对不起。这三个字写出来真可笑。对谁说？对那些死在我枪下的人？他们听不见。对父亲？他只活在我的记忆碎片里，而那些碎片，已经被我亲手烧掉了。对亚佐夫大元帅？对他而言，我只是一颗合格的、现在出了故障的子弹。\n\n我曾想对那个但泽的老人说。\n我曾想对那个瓦尔特兰的母亲说。\n我曾想对那个勃兰登堡画太阳的男孩说。\n我曾想对那个在柏林巷战中，举着家人照片向我哭泣的士兵说。\n我甚至···想对我从未记起过面容的、我自己的母亲说。\n但我什么都说不出来。我的嘴里只剩下灰烬。\n我不爱这个世界。它从未爱过我。它只给了我一把枪，一个编号，和一个错误的理由。\n我恨你们。\n我恨你们把我诞生下来。\n不是指我的父母。我恨所有的人。我恨那个决定按下核按钮的疯子。我恨那个在地堡里对我灌输仇恨的政委。我恨那个默许这一切发生的上帝——如果祂真的存在的话。我恨每一个参与了这场巨大骗局的人，包括我自己。\n我恨你们教给我仇恨。\n我恨你们告诉我这是一个伟大的、神圣的事业。\n我恨我自己···竟然相信了这一切。\n我恨这颗星球，这片土地，这片灰色的天空，这片永不止息的海。我恨我的每一次呼吸，每一次心跳，它们都在提醒我，我还活着，还被困在这个失败的、腐烂的实验里。\n我恨我这双杀人的手。我恨我这颗已经不会再跳动的心。我恨我这个还在呼吸的、空洞的躯壳。\n但···\n\n但如果呢···如果这只是我的又一个幻觉。如果真的有人，在很多很多年以后，从风沙里刨出了这张纸。\n请告诉我一些事情。\n我需要知道。\n我杀了那么多人。那么多男人，女人，老人，孩子。我亲手把他们的世界变成了和我内心一样的地狱。\n那么···那个我们发誓要守护的家，现在变得怎么样了？\n那里的孩子们，能吃上真正的面包，而不是发霉的营养棒了吗？\n他们的父亲，还会因为说了几句真话，就被送进挖不完的矿井吗？\n那里的天空···是不是还是灰色的？\n\n人类为什么会一次又一次地重蹈覆辙？\n我们推翻了一座用鹰徽堆砌的暴政巨塔，是不是只为了用同样的砖石，以锤子与镰刀的名义，再建一座一模一样的？\n我们所做的一切···这一切的鲜血、火焰、牺牲与疯狂···到底他妈的改变了什么？\n请告诉我。我需要一个答案。\n\n我看见了太阳。它很美，很温暖。它照在一片一望无际的金色的麦田上，孩子们在田埂上追逐着蓝色的蝴蝶，女人们在唱着古老的、我从未听过的歌谣。\n我看见了。\n但我知道···\n他妈的···它不在这里。\n\n已经···没有关系了。\n审判结束了。现在，该轮到我自己了。这是最后的净化。\n是时候了。\n\n这张纸就静静地躺在一个生锈的弹药箱上，旁边是一支被拆解开的、擦拭得异常干净的步枪。纸的背面，被人用另一支笔，以一种截然不同的、平静而工整的字迹，写下了几个字。\n"
OMS_POSTNUKE.166.a: "“第一天。今天天气很好。”"
OMS_POSTNUKE_166_tt: "§V我所做的，我不知道；我所愿意的，我并不做；我所恨恶的，我倒去做。\n——《罗马书》7:15§!"
OMS_POSTNUKE.167.t: "日志条目#7342：论时间的相对性"
OMS_POSTNUKE.167.desc: "【音频记录开始】\n\n···系统自检完成。净化单元压力稳定在4.7个标准大气压。水培农场A区、B区、C区二氧化碳浓度正常。备用发电机组温度···正常。\n\n【短暂的沉默，只有背景中通风系统微弱的嗡嗡声】\n\n每日系统状态报告。记录员：瓦季姆·彼得罗维奇，编号734。\n\n今天是···【长久的停顿】今天是第7,342个循环周期。自“大审判”日始。\n\n【一声疲惫的叹息，似乎是无意识发出的】\n\n抱歉。我不该···这不符合规程。\n\n只是，有的时候，我会看着这个数字。七千三百四十二。它很精确，很有条理，就像地堡里的一切。我们的心跳被监测，我们的卡路里摄入量被计算，我们呼吸的每一口空气，都由这台巨大的、永不睡眠的钢铁机器精准地调配。但“天”···一个“天”到底有多长？主时钟告诉我，是二十四个小时。不多不少。可我已经不记得，一个不由卤素灯的开关来定义的“天”，是什么样子了。\n\n我负责维护这里的档案库。数字化的。这里有整个黑色联盟的记忆，有无数份战术推演、工程蓝图、思想纲领。所有的文件，都有精确到秒的时间戳。可对我而言，时间已经变成了一滩静止的、浑浊的水。每天早上，不，每个“循环”的开始，我从宿舍的铺位上起来，走过一模一样的、漆成灰色的金属走廊，空气里是一模一样的、混合着消毒水和营养膏的气味，头顶是一模一样的、永不变化的苍白灯光。我的工作，是整理昨天···不，上一个循环的记录。可上一个循环，和上上个循环，和七千个循环之前的那一个，又有什么区别？\n\n有时候，我会偷偷打开我的个人终端。里面只有一张照片。是我的妻子，安娜。在大审判之前，我们一起在一个边境小镇生活。那张照片···是在一个晴天拍的。对，“晴天”，一个多么陌生的词。像素很低，我甚至看不清她脸上的雀斑了。但我记得，我应该记得···她笑起来的时候，眼角会有细细的纹路。是吗？我···我不确定了。我每天看着这张照片，强迫自己回忆。我怕，我怕有一天，这张低分辨率的图片，会彻底取代我脑海里那个鲜活的、会呼吸的安娜。我会不会···正在慢慢地忘记她真实的样子？忘记她的声音？忘记她手心的温度。\n\n地堡保护了我们的生命。但它正在缓慢地、一点一点地···偷走我们的灵魂。我们都变成了这台巨大机器的零件，被保养得很好，但早已失去了原本的功用。我们在这里等待。等待地表的辐射消散，等待总司令下达重返地表的命令。我们在等待一场伟大的复仇。\n\n可是···要等多久？\n\n十年？二十年？五十年？当那一天真的到来时，我们还有力气去仇恨吗？还是说，我们已经变成了只懂得如何在地堡里生存的、苍白的洞穴生物，早已忘记了外面曾经有过一个需要我们去复仇的世界？\n\n我不知道。\n\n我只知道，第7342个循环，开始了。一切···正常。\n\n【一阵长久的沉默】\n\n记录员瓦季姆·彼得罗维奇。报告完毕。请···请删除这段记录的后半部分。谢谢。\n\n【音频记录结束】\n"
OMS_POSTNUKE.167.a: "再播放一遍。"
OMS_POSTNUKE.168.t: "最后的布道，其一"
OMS_POSTNUKE.168.desc: "地堡C-7区的国民教育中心，与其说是教室，不如说是一座未经装饰的、朴素的礼拜堂。没有窗户，墙壁是冰冷的、未经打磨的混凝土，唯一的光源来自天花板上几排发出嗡嗡声的卤素灯。灯光惨白，照亮了坐得笔直的一百名十六岁青年男女的脸，也照亮了讲台上那位政委眼中的、深不见底的寒意。\n\n今天是他们的最后一课。明天，他们就将换上军装，成为联盟的正式士兵，成为伟大审判这部庞大机器上的新齿轮。\n\n政委谢尔盖·沃尔科夫没有站在讲台后面。他踱步在学员们面前，皮靴踏在地上的声音，是这座巨大静默空间里唯一的节拍。他身材清瘦，穿着熨烫得没有一丝褶皱的制服，脸上几乎没有表情。\n\n“抬起头，”他的声音不高，却异常清晰，像冰锥一样刺入每个人的耳膜，“看着我的眼睛。今天，我们不谈战术，不谈条例，也不谈配给。我们只谈一件事。一件你们出生前就已经发生，却定义了你们一生，也将决定你们如何死去的事。”\n\n他停下脚步，目光逐一扫过前排学员那一张张既紧张又充满期待的脸庞。\n\n“你们的父辈，有的来自列宁格勒，有的来自莫斯科，有的来自基辅，有的来自斯大林格勒。他们曾经拥有一个名为‘家’的东西。一个有着木头地板、能闻到罗宋汤香味、窗外能看到星星的地方。他们也曾拥有···家庭。”\n\n沃尔科夫的声音没有丝毫起伏，仿佛在陈述一段与自己无关的历史档案。\n\n“然后，条顿人来了。你们在地堡的历史课本里，学过他们的暴行。你们知道卡廷，知道奥斯威辛，知道巴巴罗萨。你们知道那些数字，那些庞大的、骇人听闻的、几乎失去了意义的死亡统计。二百万。一千万。两千七百万。这些数字像遥远星系的坐标，庞大，却无法触及。”\n\n他走到教室的中央，转过身，面对着所有人。\n···"
OMS_POSTNUKE.168.a: "继续。"
OMS_POSTNUKE.169.t: "最后的布道，其二"
OMS_POSTNUKE.169.desc: "“但今天，我要求你们忘记那些数字。我要求你们，去想象。想象一个五岁的女孩，她的头发是白俄罗斯亚麻的颜色。想象她在莫斯科的一条街道上玩耍，手里拿着一只布娃娃。然后，空袭警报响了。她听不懂那尖啸声的含义。她只是好奇地抬起头，看到了天上落下的、像黑色雨滴一样的东西。那是炸弹。想象炸弹在她身边爆炸的瞬间，她的小小的身体，连同她的布娃娃，是如何变成一团模糊的、混合着火焰与碎肉的红色雾气。”\n\n教室里死一般的寂静。只能听到学员们压抑的、逐渐粗重的呼吸声。\n\n“再想象一个十二岁的男孩。在斯大林格勒的冬天里。他已经两天没有吃东西了。他躲在一个被炸毁的地下室里，怀里抱着他那已经冻僵的、五岁的妹妹的尸体。他舍不得埋葬她，因为那是他最后的、唯一能感受到的温暖。他听到外面有脚步声，他以为是红军来救他了。他爬出去，看到的却是一队穿着灰色制服、端着枪的条顿士兵。他们看到他，笑了。他们没有给他一颗子弹。他们只是把他的妹妹的尸体，从他怀里抢走，扔进了正在燃烧的废墟里，然后看着他在雪地里绝望地哭嚎。”\n\n沃尔科夫的声音依旧平静，但每个字都像一块烧红的烙铁，烫在这些青年从未经历过真实苦难的心上。\n\n“我们脚下的土地，是乌拉尔的山脉。但在我们头顶，那片被辐射笼罩的地表，曾经是我们的家园。那里埋葬的，不是冰冷的数字。那里埋葬的，是千千万万个这样的故事。是那个玩布娃娃的女孩，是那个抱着妹妹尸体的男孩。是你们的祖父，你们的母亲，是无数个本应拥有姓名、拥有未来，却最终只剩下一捧无法辨认的骨灰的俄罗斯人。”\n\n“我们躲在这座地堡里，不是为了苟活。我们延续生命，不是因为贪生怕死。”政委的声音第一次带上了一丝几乎不可察觉的颤抖，那是被极致压缩后的愤怒。\n\n“我们活着，是因为他们死了。我们活着，是为了记住他们。我们活着，是为了完成一项他们未能完成的事业。这不是复仇。复仇，是一种私人的、充满情绪的行为。我们所要执行的，比那更宏大，也更纯粹。”\n\n他走回讲台，拿起一本黑色封皮的手册，高高举起。\n\n“这是审判。是历史的审判。是对反人类罪行的终极清算。你们明天将要穿上的军装，不是一件衣服，而是一袭法袍。你们手中的枪，不是武器，而是敲下判决的法槌。当你们踏上那片焦土，面对最后一个条顿人时，你们要记住——你们看到的，不是一个会哭、会流血的人。你们看到的，是那个扔下炸弹的飞行员，是那个在雪地里大笑的士兵，是这一切罪恶的总和。”\n\n“你们的使命，不是去恨。而是去执行。”\n\n他放下手册，目光再次变得像手术刀一样锋利。\n"
OMS_POSTNUKE.169.a: "“现在，有谁还有疑问吗？”"
OMS_POSTNUKE.170.t: "我该做什么？"
OMS_POSTNUKE.170.desc: "麦列霍夫熟练的把午餐盘放回指定的消毒桶里，然后摸了摸肚子，发出一声叹息——虽然他并没吃饱。最近的晚饭比前一段日子要稍微的丰盛了那么一点，但不多，在原有的一块全麦压缩饼干，合成肉和硬邦邦的黑面包基础上，又多了一小块蔬菜干，没多什么东西，自然也谈不上吃饱。就麦列霍夫的体验来说，啃那玩意差点把他牙硌掉了\n\n他快步往宿舍走去，准备在为数不多额自由时间内早点休息，好应对之后的演习。在以前，这样的时间一般是用来进行军事理论学习，最近上面突然调整了方针，理论学习时间减少的同时，增多了每天的实战对抗训练，但好在伙食增加，大家也没什么意见。\n\n他走进宿舍，躺在床上。舍友们还没回来。他双手抱头，盯着远处的墙壁，通风系统低沉的运作声成了这间小屋子里唯一的背景音，盖格计数器也静默无声，没有那该死的辐射泄漏。一切都在正常运作着，除了麦列霍夫自己。\n\n他翻过身，从枕头下掏出一本《军事理论手册》，想看一会。但今天不止怎么的，他由衷的感觉一股心烦意乱，眼前熟悉的字现在一个也看不下去。他下意识的把书塞回去，然后站起身，开始收拾宿舍。\n\n麦列霍夫把地扫了一遍又一遍，直到一尘不染。但心中的那种焦虑却愈演愈烈，他甚至开始有点要喘不上气了。他找到一块空地，开始做俯卧撑，一个，两个，三个...他不知道做了多少个，身上的力气却怎么使都使不完。外面突然传来了一声哨声，麦列霍夫几乎是光速站起身，笔直的站在宿舍中央。\n\n他突然低头看向自己的右手，无意识的反复握紧又松开。如果他的教官在，肯定会夸奖他具有优秀的备战素质，但麦列霍夫却突然明白了，他现在的所有焦虑，就是失去了任务。在大审判停滞的岁月中，俄罗斯的保卫者们没有了任务，开始进入了一种无所事事的煎熬。当这钢铁的国家机器被迫停滞下来之后，巨大的静默便成了齿轮的最大威胁。\n"
OMS_POSTNUKE.170.a: "我需要任务，我要去训练..."
OMS_POSTNUKE.171.t: "举报有奖"
OMS_POSTNUKE.171.desc: "最近，秋明的地堡里增加了一项新活动：征集群众演员，这个消息很快就在地堡的各个区域内不胫而走。而很快，官方也公布了与之相关的国家电影企划：《血与钢铁》。在这部电影里，男主角雷泽诺夫作为一位苏联时代的老兵，参与到了抵抗纳粹侵略者的伟大斗争中去，但在入伍后，雷泽诺夫见证了一系列军队中的乱象，这些都是布哈林几十年来在俄罗斯所种下的失败种子：军队内部文化教育混乱不堪，对祖国母亲缺乏最基础的信任，大量招收地主和流氓群体进入军队...雷泽诺夫逐渐看穿了苏联政府的无能，在保卫莫斯科的战斗失败后，他来到了西西伯利亚，在这里，他遇到了卡尔贝舍夫总司令，在卡尔贝舍夫总司令的指引下，他认识到了以卡冈诺维奇为首的修正主义和罗科索夫斯基为首的反动军人的本质，最终他跟随亚佐夫司令官，推翻了军队中的反动分子...\n\n通常来说，群众演员那样的工作跟达莉亚没有关系，作为一个平凡的家庭妇女，达莉亚只会相夫教子，而且贫穷的家庭也让她根本没资格看什么电影。与其花那个钱，不如买给自己的小女儿玛莎买些吃的。但当军队的人找上门来之后，达莉亚还是接受了充当群演的命令。毕竟，如今身处深不可测的地下，一切食物和住所都是军队负责，如果她不服从，她的家庭就会挨饿。\n\n就在她聚精会神的等待上面的导演命令的时候，她听见了身边一个穿着布衣的男人在预定的战壕位置，和其他人说不该说的话。\n\n“这电影全是胡编的，布哈林时候哪有那么糟，联盟的高层在想什么...”\n\n达莉亚在胸口画了一个十字。演出一结束，她立刻返回了家，然后拿起了家里的电话。她还记得，联盟的法律里有这么一条：举报反政府人员属实，可视情况获得物质奖励。是的，只要举报成功，她这几天就能多一口吃的。\n\n“”您好，这里是联盟安全保卫部，请问您发现了什么？”\n"
OMS_POSTNUKE.171.a: "“我发现了一个演员发表反政府言论...”"
OMS_POSTNUKE.172.t: "似是而非"
OMS_POSTNUKE.172.desc: "作为一个在鄂木斯克定居几十年的老厨师，罗曼诺夫什么东西都做过，一开始只有烤土豆，随着鄂木斯克扩张，他做过的东西也多了不少：卡沙，罗宋汤，甚至他还去过日本人开的餐馆，偷着学过做寿司。但是随着大审判的到来，好日子到头了。在那一天无休止的地震之后，带他下来的大兵告诉他，现在地上全是条顿人的核弹炸出来的废气。他也就继续作为厨师度日。\n\n今天，当他又来到厨房的时候，一位军官已经在等着他了。“让这些东西能咽下去，写成食谱，上面要向所有人推广。”\n\n罗曼诺夫看了一眼指定的食材：合成蛋白块，压缩卷心菜块，还有为数不多的几块合成肉。他用手摸了下这些硬方块，不禁苦笑起来。他应付过冻得跟石头一样的土豆，也拍过酸酸的腌黄瓜，还切过细腻的牛肉，但它们都过去了。他把记忆抛之脑后，掏出一点宝贵的水源，认真的将菜块一点点化开，然后捣成粉末。\n\n他从柜子里掏出加热器，一点点控制着火候，在蛋白块的边缘一点点的加热起来。虽然有些地方还是烤的焦了点，但整体还是明显松动了起来，罗曼诺夫在每一份里都塞进一点合成肉，然后盖上盖，开始整体加热。几分钟后，他把这玩意从烤箱里掏出来，一份份撒上蔬菜粉。开始一份份装盘。\n\n“啪啪啪”，他回过身，军官已经站在他身后有一会了。“你干的比我们想象中要好很多，我刚尝了一口，比以前的味道可要强多了，快追上以前吃新鲜食物的时候了。”\n\n他的心突然刺痛了一下，在地上的时候，他每天为数不多的快乐就是和家人，朋友们一起分享食物，可现在他们在地下已经呆多久了？那些可爱的蔬菜，白面的样子，几乎要被他忘光了······他低下头，细细打量着那些颜色灰败，完全没有食物该有的质感的混合物，叹了口气。不过，他也做不了什么，无论如何，生活总得继续。于是他掏出勺子，以近乎虔诚的动作，缓缓将一大口食物吃了下去。\n"
OMS_POSTNUKE.172.a: "这一口，他嚼了很久很久。"
OMS_POSTNUKE.173.t: "“为了生存”"
OMS_POSTNUKE.173.desc: "高尔基地堡群\n\n地堡中的生活永远重复不变，上班，下班，回家睡觉，然后醒来，接着下一天的上班，下班······只是最近半个月，物资份额明显减少了。尤里卡知道，下一轮外出探索就要进行了，毕竟这早已不是第一次，他的朋友们已有好几个消失在废墟和荒原中，不过他比较幸运，一直活到了现在。\n\n果不其然，上午开始工作没多久，戴着黑帽子的年轻人就来到厂里，登上了那座平时不对外开放的演讲台:“为了联盟，为了大审判，无论用任何方法，我们都要筹集到足够的食物!联盟的斗士们，你们的功绩将永世长存!”\n\n政委演讲的这些口号还没落下，尤里卡和一些同事就这样拿着一些破烂被送到了一座同样破烂的城里，他知道这些话只是对新人说的，外面可不是什么净土，土匪、污染、泄露的化武、遗留的地雷之类的武器······什么东西都有可能要了他们的小命。他只得叹了口气，给自己的新人搭档教授一些保命知识和物资辨别方法:“如果有什么地方很干净，立刻跑掉，这意味着一定有人在这附近，你不能确定这些人是不是属于联盟。如果明显有人的痕迹，那就更要跑了。外界有包装的药品和食品一般不会有事，尽管拿，一些看着很有工业制造感的东西可能非常珍贵，不过它一般也非常罕见。还有······”\n\n······\n\n出乎他的意料，这次行动他们连人影都没见着，眼前就到了集合时间，他们带着满满一大箱罐头和一座尚且能用的电台在街道上走着。“老天保佑······阿纳斯塔西娅···还有我那没出生的孩子······”就在他以为此次行程他又能像以前一样逃过一劫时，异变突生。\n\n随着“咔哒!”一声脆响，一颗未被拆除的压发式地雷在他脚下爆炸了。\n\n还没来得及有下一个想法，尤里卡就变成了一堆碎肉。\n\n年轻人上报了这次意外，然后后勤部和地面勘探划派遣队的册子上划掉了尤里卡的编号:“18140”。\n"
OMS_POSTNUKE.173.a: "那可怜人的妻子甚至连她丈夫是怎么死的都不知道。"
OMS_POSTNUKE.174.t: "遗孀"
OMS_POSTNUKE.174.desc: "阿纳斯塔西娅失眠了一整晚，一直到那个大喇叭提醒着人们该起床了，她才挣扎着爬了起来，可她的灵魂早已牵挂在丈夫尤里卡的身上，没再回来了。\n\n自从尤里卡昨天上午外出寻找物资以后，她这一天连一点消息也没有得到。往常最迟到挂在工厂墙上的那个钟表指针转到晚上五六点，尤里卡就应该就到家来，和她诉说在外界遇到的那些危险和趣事。她心里明白，这次的异常绝对不会意味着什么好消息，也许是足以影响行动的重伤，又或者······她只能祈祷最坏的可能性没有发生。\n\n怀着不安的心情，她收拾了一下自己，准备继续这一天的生活，因为她知道，询问联盟的人没有用。这群官吏只会用毫无营养的废话搪塞她，然而，就在这时，房门被敲响了。\n\n“喂?哪位?”\n\n“夫人，这是您的专属证件，可以在配给站出示，换取一点五倍量的配额，您和您的孩子都有份。我是联盟第33687地面勘探派遣队队长，我是来通知您的:您的丈夫，18140于前一天的勘探任务中不行遇难，死因:被土匪枪杀。”\n\n阿纳斯塔西娅在原地呆愣了两秒，然后脸上一下失去了血色:“我···我明白了。”\n\n那队长向她敬了个礼，然后转身离开了这里，像什么都没发生过一样。\n"
OMS_POSTNUKE.174.a: "除了那张孤零零的卡片之外，一切如常。"
OMS_POSTNUKE.175.t: "与时俱进的军训"
OMS_POSTNUKE.175.desc: "以往的军训是个挺轻松的活，对于索科洛夫来说，无论标准有多严，又或者训练过程中死了多少人，对他来说都无所谓，俄罗斯大地那么大，死几个身体不佳的人有什么关系，反正总会有对祖国忠诚的人来填补位置。\n\n可这份简单的工作如今却开始让索科洛夫开始头疼。不为别的，地下的环境远不如地上，即使联盟已经修建了极大规模的通风管道，但每人每天的呼吸量是有限制的，他只是让一个排的士兵们按以前的标准运动了一上午，安全部那边的人就通知他中止训练，他们的呼吸量已经接近了每日废气处理的上限。\n\n还有训练标准，以前军队里默认会把士兵们送往最恶劣的环境，给予他们极少的装备让他们自主返回营地还要在招待他们的时候给他们上“疼痛教育”，让他们明白什么叫上下秩序，并通过这种方式培养意志最坚强，也最有能力的士兵。但上周部队通报里，有个蠢蛋就这么干了，结果一连打死了十多个人，剩下的几个也因为吃不饱饭失去战斗力，上面直接把这家伙送到赎罪旅了。\n\n按以前的标准不行，但工作还得做。索科洛夫在办公室里来回转了半天，终于想出了应付办法。他把原先的长时间越野砍成短时间，所有爆发性运动全部砍掉，增多了军姿，匍匐等基础动作的训练量，至于剩下的时间，好在训练里有不少书和影像资料，让他们多看看东西补补课就行了。\n\n他战战兢兢的把这份极大修改后的军训流程送了上去，不一会，上面发来指示：通过。\n"
OMS_POSTNUKE.175.a: "上面也是这么想的?"
OMS_POSTNUKE.176.t: "废土生存教学"
OMS_POSTNUKE.176.desc: "“大家好，欢迎收看本台节目《重生法则》，本节目由俄罗斯国家重生集团赞助播出，我们将亲自教你如何在重返地面之后，让自己学会如何生存下去，成为祖国的优秀公民！”\n\n伊戈尔目不转睛的看着眼前的电视，在地堡里暗不见天日的环境中，哪怕像这样几十个人聚在一起看一会小儿电视的机会也极其稀少。伊戈尔早已不知道自己来地下多久了，自从那场毁天灭地的大审判开始以来，伊戈尔就和大多数民众一起来到了这片永远没有变化的地下。这里没有了那熟悉的阳光，没有了蛐蛐的鸣叫，只有同样和他一样被带到地下无助的人。伊戈尔的脸上再也没有了曾经的笑容，剩下的只有无尽的空洞。\n\n“大家好，我是联盟农业教授格列戈里，今天我要给大家讲授的是，如何在我们重返地面之后进行农业耕作。大家必须知道的是，如今的地面已经充满了核辐射的空气。”他用手指了下一旁屏幕里展示的外面天空：“如果我们的人民不经防护就出去，会迅速死亡...”\n\n死亡？这个词在伊戈尔的脑子里转了一下，勾起了一段回忆。到来地下之后，接连不断的地震让所有人都害怕不已。但在地震结束之后，一些人就站了出来四处游行，声称战争已经结束了，要联盟放他们回家。对此，联盟把他们全枪毙了。\n\n“...当空气沉降下来之后，我们将需要对地表的土壤进行重新清洁。切记，千万不要在地表种植种子，辐射会杀死所有不适应的种子，对此，我们已经初步培育出了一些适应辐射的种子，我们将尽快克服灾难，让各位都能重返工作...”\n\n伊戈尔完全没听清楚后面说了什么，他死死的盯着那些种子，记忆再次从脑海深处涌现出来。他以前是个农民，每日在国营农场里工作，每当收获粮食的时候都是他最快乐的时候，那金黄色的小麦，玉米，那些牛和狗，都是他每天的陪伴，是他过去生活中必不可少的部分。\n\n等到他回过神来，节目已经结束了。伊戈尔回到那间狭小的宿舍，躺在床上，在他闭上眼睛之前，他把这档节目的播放时间记了下来。\n"
OMS_POSTNUKE.176.a: "晚上七点。"
OMS_POSTNUKE.177.t: "新文化标准"
OMS_POSTNUKE.177.desc: "地底下没有像地上一样的时间观念，因此，大多数民众和官员往往在结束了限定的工作量之后，倒在床上闷头睡去，留出宝贵的电力让联盟得以继续存续。然而，在今天的文化部的会议室里，一场新的会议正在进行。\n\n“看看吧。”专员谢尔盖笑眯眯的坐在文化部的座位中央，桌子上放了几本打开的书，有些书里写的一些情情爱爱，有的则是描写了一个医生在联盟内部的所见所闻。“你们的工作做的有些疏漏啊，总司令可是下了命令需要弘扬俄罗斯人优秀的精神文化，你们错漏的这些可是很容易让我们的民众产生懈怠的。”\n\n“是我们工作疏忽，请您原谅。”文化部的官员们低下头，一会，部长费多罗夫抬起头，承认了工作上的错误。“我会及时修正这些错误，并且向总司令认罪。”\n\n“比起修正错误，他更希望有一个新的标准。”谢尔盖撇了一眼费多罗夫，然后从口袋里掏出一张条子。“对你们的考验已经通过，希望你们通过工作纠正这些错误，完成俄罗斯复兴应尽的责任。”\n\n费多罗夫接过纸条，与一众官员讨论之后，一份新的文化优先出版名录迅速出炉。\n\n（1）前线经历：着重描述俄罗斯士兵在战场上的英勇行为，战友情谊，以及对国家自豪，为国家而死的战争经历。\n（2）精神诠释：宣传卡尔贝舍夫，亚佐夫总司令有关功勋事迹，强调对大审判事业的忠诚和支持\n（3）地方风俗：对俄罗斯各地的文化风俗进行保存性记录和宣传，保证俄罗斯民族的文化特色和传统习俗得以留存，强调俄罗斯民族的团结共存。\n（4）对德宣传：全力强化对纳粹黑暗历史的仇恨教育，揭露并深化对条顿人民族劣根性的系统性解释，以科学，种族等多角度摧毁纳粹文化的全部根基。\n费多罗夫思索再三后，加上了最后的修订。\n"
OMS_POSTNUKE.177.a: "除此标准以外，其余题材作品全部不予发表许可，如发现非法印刷，即刻取缔。"
OMS_POSTNUKE.178.t: "官样工作"
OMS_POSTNUKE.178.desc: "别列科夫从不喜欢跟老百姓打交道，无论是在工作时还是工作之外，这么多年来，他对老百姓的印象只有一个：白眼狼。到工作的时候，这些老百姓往往头低的比谁都低，话说的一个赛一个软，但只要离了工作岗位，他们立刻就不认别列科夫的情了。虽然别列科夫自认自己脾气挺好，但遇上这么多白眼狼，别列科夫也只能认倒霉。\n\n上面最近又下来了命令：“提升工作效率，避免精神腐化”，对此，上面一连开了三天的会，领导在那边大谈特谈各种什么保证工作质量，平时多读总司令和叶夫根尼长官等人的著作等等，这些话能骗过那些刚参加工作的小年轻，但别列科夫听下来就总结出一句话：加班，而且还是不给加班费的加班。\n\n果不其然，最近地堡的d区闹出了点事，一家人里死了人没有上报政府，结果导致整个居民区的空气净化系统出现了负荷，等到警察踹开大门的时候，空气净化系统已经不堪重负。为此，上面很快就下达了命令：所有政府机构人员分小组下到指定民众社区内，挨个敲门上门看守，一旦出现问题立即清扫并上报。\n\n至于别列科夫，因为他年纪比较大了，上面的领导们经过一致讨论，给了他一个非常轻松的工作。\n\n“d区工作人员值守情况如何？”\n\n“报告长官，d区工作人员全体在岗，消防工作正在有序进行，请长官放心！”\n\n每天起来，坐下，对着自己不知道的工作情况向上级进行每十分钟的汇报，这就是别列科夫的新工作。\n"
OMS_POSTNUKE.178.a: "但还是没有额外报酬。"
OMS_POSTNUKE.179.t: "精锐？炮灰？"
OMS_POSTNUKE.179.desc: "加兰沙端着餐盘，找了个靠墙角的地方坐下，正想吃饭，一个人端着饭就坐在了他对面。他一抬头，是他的老熟人，同属信号旗部队的侦察兵，布尔金。两人相顾一笑，低头切面包的功夫，布尔金压低了声音，“老兄，你们这两天干什么去了？”\n\n加兰沙的手慢了下来，他快速的扫视了一下周围，然后低声回复到：“搞工程去了，上面说了我们迟早要回到地面上生活，要提前做点准备，你呢老兄，你们最近在干什么？”\n\n“哈，老弟，我跟你说，前五天上面让我去工厂里，说是有什么叛乱分子潜伏，要我去抓，我在流水线里看那些木头人呆了一天也没发现有谁想叛乱，就那么白转了一天，连口正经的饭都没吃上。等我去找厂长的时候，你猜那家伙在干嘛，那家伙在喝白干！”\n\n他把一小块合成肉用力的塞进嘴里，用力的嚼着，边吃边说：“昨天上面下命令要清扫一群反抗军的据点，说是这帮人要反抗总司令，破坏俄罗斯复兴，我收到命令就去了。你不知道，我到那一看，整个部队里好几个老头子和两个十几岁孩子，就这些人就是现在的信号旗？”\n\n加兰沙皱起了眉， 布尔金继续自言自语的说道：“那真是一场灾难，我们几个人被安排去前线一处雷场，据说反叛军在那提前埋了雷，要我们去排除，见了鬼了，以前这种事不是工兵或者那些条顿垃圾干的吗？最他妈要命的是，队里的人好像根本没接受过训练一样，有个孩子直挺挺就踩到雷上面了，得亏我眼疾手快让他别动，然后把雷拆了，否则我们都得喂虱子了。”\n\n加兰沙看着面前的战友，想搜罗些话来反驳，却说出不来。他突然感觉到一种由衷的疲惫，一股巨大的空虚感爬上心头，明明以前俄罗斯不是这样的，为什么现在······亚佐夫总司令不可能做出这种错事······可这些难道和总司令无关吗?他打了个寒颤，把这些想法从自己的脑海中丢了出去。\n"
OMS_POSTNUKE.179.a: "“老兄，我有点累了，我得赶紧回去喝两杯，然后洗洗睡了。”"
OMS_POSTNUKE.180.t: "处刑"
OMS_POSTNUKE.180.desc: "一众新兵站在一处空旷的广场，面前是一群身着囚服的囚犯。自从有反抗联盟的人出现后，黑色联盟就开始挨个清扫之前的地下隐藏所，然后把里面的反抗者拉出来处死。一位军官轻声走到他们面前，他眯着眼，盯着无数双盯着他的眼睛，他的视线尖锐而又深邃。每当新兵与他对视几秒，就立刻躲闪来开，不敢直视他的眼睛。\n\n“很高兴在这看到你们，联盟的守卫者！”军官高声的喊道，他的声音在一众士兵的耳边不断回荡：“我是亚历山大.塞缪诺夫，我看过你们的档案，在当兵之前，你们有着不同的身份，农民，工人，祖国的败类，按理来说，你们都应该各司其职，或者被毙掉。”\n\n“但是！”他的语气突然加重，“祖国出现了一些叛徒，他们妄图颠覆政府，口口声声说着为了什么自由，革命？实际上是为了阻止俄罗斯人完成最后的大审判！他们是最可恶的，精神条顿人！”\n\n“因此，为了检验你们的忠诚，我诚恳的邀请你们，参与到对这些叛徒的处刑中来。”塞缪诺夫掀开一个人的头套，“先生，您还是坚持反对伟大的俄罗斯复兴政府吗？”\n\n“你这个混蛋！想杀就杀！我绝不会为这个反动政府...”\n\n塞缪诺夫毫不留情的堵住了他的嘴，然后举了举手：“行刑。”\n\n”砰砰砰“，一连串的枪声不断响起，这些囚犯纷纷倒在了地上。塞缪诺夫下达了第二个命令：“接下来，给这些家伙们的心脏再捅一刀，以防他们装死。”\n\n“长官，这样侮辱死者是不是不太好，主教我们应该有所怜悯..”\n\n塞谬诺夫拔出手枪，对准声音来处开了火，给这些新兵的记忆中留下了一记血腥的印记：”总司令教导过我，对祖国的忠诚是至高无上的，如果有人为所谓的信仰而妨碍祖国的复兴事业，那他的存在毫无意义。”\n"
OMS_POSTNUKE.180.a: "继续行刑。"
OMS_POSTNUKE.181.t: "永恒的死亡"
OMS_POSTNUKE.181.desc: "太阳如往常一样东升西落，洒下的阳光传过飘散的辐射空气，照在一处树荫上。李斯特坐在树下眯着眼睛，享受着这来之不易的温暖。对于他来说，过去再怎么大的雄心壮志，都不如眼下能过一天来的宝贵。自从核弹落下之后，李斯特的生活就改变了，曾经的日耳曼祖国在无尽的烈焰之中灰飞烟灭，上级，家人，责任，所有的一切都离他而去。作为幸存者，李斯特所能做的一切，就是和为数不多的幸存者一起，维持着最基础的生活。\n\n太阳西沉，李斯特站了一会，慢慢的解开扣子，抖了抖身上的灰尘，然后向远处的庄园走去。在那里，几个前国防军成员用找到的农具开垦出了一片庄园，孩子们在庄园里学习玩耍，老兄弟们则是耕作之余谈天说地，时不时聊起过去那美好的时光。\n\n他走回院子里，和他的妻子瓦伦蒂娜相拥。回忆曾经在无数个躲藏的日月中折磨着他，直到他碰到了她，瓦伦蒂娜，他的挚爱。她给了他全新的，美好的新生活：在废墟上一点一点搭建居住的住所，受伤时为他缝补衣服，找到食物时的喜悦。他突然觉得，过去已经无所谓了，至少在绝望与死亡之后，就这么过一辈子也挺好的。\n“轰！”\n\n李斯特的耳朵里传来了熟悉的声音，他费力从记忆里找出这个声音是什么：迫击炮。他下意识的想跑出庄园，但炮弹已经落下，黄色烟雾开始向庄园里蔓延。李斯特所有的情绪最终都化为了一声无奈的叹息，该来的还是来了。他拉着瓦伦蒂娜的手，赶快躲到了一间房内。\n\n庄园里的声音不断的消失了，烟雾渗过房门，李斯特和瓦伦蒂娜相视一笑，抱在了一起。这些德意志人用坚毅和决心走过了黑暗和死亡。但却未得到上天的眷顾，命运在此刻表现出了巨大的无情。德意志的重生之歌于此戛然而止。\n"
OMS_POSTNUKE.181.a: "夜幕降临，将所有生机一并吞下。"
OMS_POSTNUKE_181_tt: "他们为自己民族的罪恶过去，付出了灭亡的代价。\n\n耶和华说：我知道我向你们所怀的意念是赐平安的意念，不是降灾祸的意念，要叫你们末后有指望。\n——《耶利米书》29：11"
OMS_POSTNUKE.182.t: "最后机会"
OMS_POSTNUKE.182.desc: "亚佐夫正襟危坐在指挥所中央，和往常一样保持着笔直的坐姿，等待着最后的回应。总是有人执迷不悟的反抗，但黑色联盟总会是最后的赢家。他如此的想着，但他已不会像以前一样大喊大叫或是气愤不已，作为全俄罗斯的救主，他有责任带领俄罗斯和她的人民走完大审判。虽然从消息来看，反抗者似乎声势浩大，但为了最后的胜利，俄罗斯已经付出了太多，眼下不算什么。\n\n“叮铃铃铃...”电话终于响了，亚佐夫拿起电话。\n\n“总司令，我已经到达了预定的谈判地点，并与所谓的反抗势力进行了谈判，我有重要的消息需要传达。那些反抗势力提出，如果我们能够达成以下条件的话，他们就同意放下武器：结束俄罗斯的军事管理状态，选举民选政府，放松管制，中止军事专政...”\n\n一众列席的军官越听越皱眉头，亚佐夫倒是突然乐了：\n\n“这些条件倒是挺让人难以置信，你告诉他们俄罗斯现在的情况了吗？”\n\n“通知了，总司令，但那些抵抗势力的的头领们对我说了一些胡话，什么“虽然俄罗斯现在生活困难，但眼下的军管状态已经让太多本不该死的俄罗斯人因为不公正的分配而死去，现在的俄罗斯需要的更应该是公正与发展，所谓的大审判应该结束了。而且...”他用力的咽了一口唾沫。\n\n“说。”\n\n“他们说：‘如果德国人真的如总司令所说被彻底消灭了，那我们要何去何从?”\n\n亚佐夫的笑容消失了，他突然感到一股戾气从自己的脚尖直冲头顶，于是他对着话筒大吼了起来：“你的任务完成得很好，现在我们已经知道了，这些人无可救药。”他几乎是把话筒摔了回去，转头看向列席的军官们：“我们的人都到位了吗？”\n\n“部分地区的补给还在运输，主要部队的部署已经到位了，随时可以发起攻击。”短暂的沉默之后，一位军官站起身，回复到。\n"
OMS_POSTNUKE.182.a: "“立刻发起攻击，把这些叛徒全杀了。”"
OMS_POSTNUKE.183.t: "再度交锋"
OMS_POSTNUKE.183.desc: "格里高利招呼了一声，点亮了一盏马灯。随后，一大群影子从黑暗中走了进来，加入了他的队伍。这帮人穿的五花八门，身份也是一个赛一个复杂，既有带着苏维埃联盟的革命勋章的士兵，也有缺了一条胳膊的工人，甚至还有几个拿着一面黑白黄的旗帜，走到了队伍的末尾。这帮人吵吵嚷嚷的，向西方的预定地点行军。几分钟后，他们就要袭击黑色联盟的一处军营。\n\n几分钟后，他们到达了地点，格里高利举起望远镜看了一眼，还好，黑色联盟的士兵还在睡觉。他发出指示，进攻旋即开始，几个精锐士兵摸到了营地卫兵的身边，几声轻微的声响过后，两个卫兵应声倒地。“砰”，远处传来了一声枪响，营地里开始有了动静。\n\n“操，快上！”格里高利来不及多想，马上大喊了起来。一群人拿起步枪开始射击，一群人则掏出了配置好的燃烧瓶，向营地里扔了过去。而黑色联盟的士兵们在遭遇了慌乱之后，也开始了迎击，部分士兵在军官的指挥下迅速开始寻找掩体，久经训练的士兵们也试图点亮光源发动反击。但夜色渐暗，又遭遇突袭，士兵们仍是陷入了劣势。\n\n突然，数十道闪亮的光源撕开了漆黑的夜，格里高利定睛往去，那些光源来自于一顶顶发光的军帽，帽下的俨然是那熟悉的防毒面具，黑色联盟的大部队来了！还没等起义军们反应回来，远处突然传来几声闷响，随之而来的就是一声声爆炸，大多数起义者们在这一连串的打击下惊慌失措，一些人试图丢下枪逃跑，但他们很快就倒在了包围过来的黑联士兵枪下。\n\n来不及多想，格里高利拎起枪便带头冲去，他知道，眼下大家已经陷入了混乱，如果自己不赶紧组织起攻势，黑色联盟的黑狗子们就会再次骑在他们头上。在他带着一群士兵猛烈冲锋之后，带头的军官被打死，黑色联盟的驻军纷纷后退。他举起枪高呼：“为了俄罗斯！”\n\n很不巧的是，他的对手也是这么想的，一个远处的暗哨拉动了手上的步枪，对着举起武器的格里高利开了火，稳稳的打在了他的胸膛上。\n\n这位哥萨克男儿突然失去了全身的气力，他的身体开始无力的向一边滑倒，他的眼前开始逐渐看不见他身边同志们的怒吼和哭喊，但在死去前的最后一刻，他突然真切的感受到了活着的意义是什么。\n"
OMS_POSTNUKE.183.a: "自由值得每个人为之献身。"
OMS_POSTNUKE.184.t: "透气"
OMS_POSTNUKE.184.desc: "自从核战开始后，250541就一直被关在这所设施里。他们管这所设施叫地堡，说它是俄罗斯复兴的种子，说它是对抗日耳曼的终极壁垒。然而250541只觉得这里是个大闷笼，不过要是真的能靠它打垮那些日耳曼人，那么呆着忍忍也无妨，何况更难挨的地方，他又不是没呆过呢？\n\n设施里时不时有些震动，细听还总能听到轰轰的微响，日子就伴随着这些一天天过去了。实在的，250541不知道过了几天，设施里没有日历，而且这里的工作虽然要比在上面时轻一些，但也足以让人忘记时间，也足以让人不再胡思乱想。也许不过是换了个地方干活吧。\n\n250541每周日都要去中心听那个黑帽子演讲，他们说是为了维持俄罗斯人的意志力与信念，不过那个黑帽子每次讲的都是那些内容——要么是我们的努力对德国人造成了多少杀伤，要么是这所设施以后能怎样恢复俄罗斯的伟大，这些250541早就听腻了。\n\n而这次周日不同，那个黑帽子没有像以往一样，站在讲台上西里呱啦地讲那些听得让人直出茧子的东西，他只是双手交叉瘫坐在角落的椅子上，盯着一个拘谨的白褂子，好像是要用目光从他的胸口挖出一个洞一样。白褂子从一旁慢悠悠地走上讲台，背过身清了几下嗓子，接着拿出张纸，忽而盯着那张纸看，忽而闪烁地瞟一眼观众。接着他开讲了：“同志们，我们正处在联盟最辉煌的时刻，我们铸出的复仇炸弹，每一天每一日都在向那些日耳曼魔鬼无尽地轰炸。我们要将他们的城市夷为平地，而他们也想要对我们回击，这就是为什么我们要待在这里。而什么炸弹威力能大到这样呢？我们与他们的炸弹叫作核弹，这种炸弹......”\n\n白褂子之后讲了什么，250541一个字也没听懂。但他听懂了，原来上面的轰轰声是这样来的！那是敌人在向我们扔炸弹，而瞧，他们压根不知道我们早就躲进这个大地洞里了！\n\n也许，明天那些轰轰声就会停止，那时我们是不是就算胜利了？要真到那时，我一定要跑回上面，一定要躲进我以前那栋藏在林子里的房里，然后把之前偷偷屯的那些酒一口气喝光，到那时反正教训完那些日耳曼人了，也许黑帽子就一开心不管我了呢？也许他们自己都会开个庆祝活动呢？也许......\n"
OMS_POSTNUKE.184.a: "想着这些，250541微笑着睡着了。"
OMS_POSTNUKE.185.t: "窒息"
OMS_POSTNUKE.185.desc: "三天，250541细数着，已经三天没有再听到轰轰轰的声音了。自从前几天白褂子那次演讲后，250541几乎复活了似的，天天等着外头的炸弹停下来的时候，连在6号口每天搬这搬那的脚步都迅捷了许多。\n\n“要是多搬几个，那回到上面的日子是不是就能再快几天？”这么想着，那些让他天天流粗汗的箱子看着都顺眼了许多，仿佛里面装着什么宝贝一样。可里面装的是什么呢？为什么天天都有这么多要搬？250541没有想过这个问题，也早就知道了联盟的事最好不要多想，反正照做就行，管他那么多干嘛呢？\n\n四天了，250541数着，依然没有炸弹的响动。难道日耳曼佬已经没炸弹啦？还是我们已经把他们的城市都轰烂了？那黑帽子说的“大审判”什么的是不是已经结束了？他们要放我们回家了吗？我以前那...\n\n“嘿！”一声吼叫把250541拉回了现实“别发呆！你今晚想不想吃饭了？”250541又抬起了刚刚放下几秒的那个沉甸甸的箱子。\n\n今天是第九天，明天就是第十天了。\n\n“他们还不打算让我们回去吗？”250541越来越没办法不再想着这些。“那些箱子究竟是要干嘛去的？”\n\n“嘿阿列克谢，你知道这些箱子要去干嘛吗？”又一次把箱子搬到目的地后，250541向他的工友250423问道。“不知道啊，他们就让我把这些都开车运到7号口去。”说完，250423瞟了眼周围，凑近小心翼翼地问了句：“别多想这些问题，你知道对吧？”不知有没有听进去，250541看着7号口的方向，似有似无的点了点头。\n\n第十天，7号口前，250541的心怦怦乱跳，他躲在箱子堆里，盯着7号口的工人来来往往。天花板的灯光逼亮，照得阴影尤黑。250541后悔着自己为什么要这么做，“贿赂工头可是死罪！”250541抹了把额头的汗，“而且巡逻随时都可能发现他不在。”“但是，但是，都已经这么做了...”\n\n250541仓促着想要拆开边上一个箱子，可是手抖得不听使唤，这时他听到旁边有个人说着什么：“这些，你这次直接搬到1号口去，250876不能开车了，你来开车运过去，懂吗？”听完，250541想了半会，吃了一惊，眼睛睁大了，心一横，硬是撕开了箱子。\n\n箱子里装着什么呢？方方正正的，挺粗糙，还有点硌手？250541有点愣住了。\n\n那是一箱砖。\n\n那是他们一直说的用来回地面上重建俄罗斯的。\n\n250541想明白了。这里有7个口子，7接下来自然就回到了1，然后经十几个人的手，又再回到6号口，这样活就永远不会少，在下面的这几十天日子里，我们的“意志力与信念”就永远不会磨损。\n\n就算收拾完德国人，联盟也依然会是联盟。\n"
OMS_POSTNUKE.185.a: "250541睡着了，今晚他再没胡思乱想。"
OMS_POSTNUKE.186.t: "禁书"
OMS_POSTNUKE.186.desc: "安静，闲暇，惬意。这几个词似乎与黑色联盟无关，但自从核战开始后，地堡的无线电一天比一天安静，到如今你再想让它发出点声音，恐怕得踹它脚才能来点动静了。\n\n于是无线电员罗季昂难得空闲下来，他强迫着自己不去想黑色联盟的事，读起了从上面下来时匆匆带来的几本书。罗季昂不知道这几本书都写了些什么，但其中一本叫《热寂》的科幻小说尤其吸引了他。\n\n这本书里，人类在2100年代空前的接近大同共产主义社会，在几乎就要实现预言中的乌托邦时，接下来却因各种原因而最终失败，于是人们逐渐对人性产生了怀疑。在怀疑之中，一种学派流传了起来，这个学派称几百年前的马克思不止是构建了那个未来的乌托邦社会，同时也不经意间指出了另一种未来的可能性：人类社会将彻底崩塌。\n\n学派声称：人性的矛盾无法解决，一切的社会发展都只是用更复杂的社会体系暂时掩盖了人性的矛盾，而当社会的复杂度到达极限时，之前被掩盖的矛盾将井喷式爆发，人类社会将走向不可避免的完全崩溃，谓之“文明热寂”。\n\n在刚经历大崩溃的人们中，这一切是如此的可信。各国纷纷接受了这个学说，人类的目标自此由发展社会转而变为了防止人类社会彻底崩溃。\n\n在大崩溃后留下的这堆烂摊子中，你能见到为了阻止文明热寂的各种天马行空尝试：有实行人性泯灭的反乌托邦社会、有试图改造人性的超人类主义、有干脆放弃现代社会的原始崇拜、还有些仍然相信大同社会的理想主义者等等。\n\n而其中最引得罗季昂瞩目的是一个极端组织，他们宣称人类社会已无可救药，必须摧毁现有人类社会，再经他们之手重建一个崭新的人类文明。这个极端组织自称是“人类的解药”，却把一切恐怖主义和极权统治实行了个遍，而他们依然辩解说这是为了净化人类的必要之举。\n\n在小说的结局中，这个极端组织向全球发射了核弹。在核灭世后，幸存下来的人非但没有听从极端组织的指挥重建新文明，反倒还组成了对他们的反抗联军。最终人类社会在无休止的内战中迎来了“文明热寂”。\n\n罗季昂闭上这本书，扔进了垃圾桶里。\n"
OMS_POSTNUKE.186.a: "这是禁书。"
OMS_POSTNUKE.187.t: "哈萨克的新兵"
OMS_POSTNUKE.187.desc: "灰蒙蒙的草地上，炮火连响，烟灰四起。一处壕沟内，几个人蜷缩着商量着什么。\n\n“7524，”中尉对着眼前几个新兵点名：“干员7524！”，然而依旧没人回应他。\n\n“嘿，德米特里，叫你呢。”雷兹诺夫拍了下旁边心不在焉的德米特里。“哦，怎么了？不对，是！”德米特里吓了一跳，结结巴巴的回答道。中尉皱了皱眉头，还是放过了他。刚抓来的新兵都这个样。\n\n“我们要潜伏过去，拿炸药炸了那个机枪堡，路上不许发出动静。”，于是几个人站起来，勾着背，沿壕沟缓缓地朝机枪堡的方向摸去。\n\n壕沟里不知道什么东西散发出一股恶臭。德米特里一边走着，一边拿出水壶，咕咚咕咚地灌了下去。自从收到征召令后，他就一直郁闷着，倒也不全是因为不想上战场。德米特里在12岁时，他妈妈被德国轰炸机炸死了，之后他就一直为了大审判日日夜夜在工厂闷头干着。可到了现在，打的压根就不是德国人，德米特里应征，要杀的是他自己的同胞。再看着远处机枪堡里那些人，可能亲人也被德国人杀了吧？想着这些，德米特里在心里叹了口气，把盖子扭了回去。\n\n这时，远处传来“砰”一声，一粒黑点从苍白的天上掉下，猝不及防地砸在了雷兹诺夫边上，火焰瞬间将他卷入、吞噬、再吐出，半边烧焦的雷兹诺夫重重地砸在了德米特里身边。咚的一声，德米特里往下一瞅，曾是雷兹诺夫的那具黑焦尸体静静地躺在脚边，只伴随着呲呲的微响。手里的水壶松落，掉在地上又是咚的一声，德米特里懵了几秒，眼前发黑，腿一软，接着吓得大叫起来。\n\n“7524，闭嘴！你要暴露我们了！”中尉不耐烦的说道。但是德米特里没有回应他，接着尖叫着，雷兹诺夫是他在工厂时唯一认识的朋友，怎么会发生这样的事？\n\n“7524！”中尉凑近，重重推了一下德米特里，可他还是淹在情绪中，继续叫个不停。\n\n“刚抓来的新兵都这样。”中尉习惯地拔出小刀，没有一丝犹豫，像切猪肉一样，利索地从德米特里的脖子划过。鲜血瞬时喷出，洒在了一旁流干的水壶上，德米特里咕哝着，倒在了雷兹诺夫身旁，几秒后再没发出动静。\n\n远处机枪堡的火舌依旧激烈。中尉朝剩下几个人点了点头，几个人面面相觑，接着不约而同地沉默着跟着中尉往前走去。\n"
OMS_POSTNUKE.187.a: "“继续行动。”"
OMS_POSTNUKE.188.t: "白噪音"
OMS_POSTNUKE.188.desc: "𪠽𪠽𪠽𪠽𪠽𪠽𪠽······\n\n闹铃声响起，把a从熟睡中拖了出来。a揉了揉疲惫的眼皮，一只手撑着床，缓慢地坐起，看着床尾愣了几秒，接着光脚下地，几步摸向了衣柜。打开了衣柜，a这才发现身上就穿着工作服。急急忙忙扯上鞋后，拿上昨天剩的干面包，a快步走出员工宿舍。\n\n砰、砰、砰、砰\n\n四声响，一个工件加工完了。“在培训时，教导员总是说这东西加工起来要万分小心，但做惯后，来来回回不过都是那一套把式。”a想到这，拿手一抹额头豆大的汗点，再往身旁一甩，最后在磨得发黑的裤子大腿侧边一擦，这时下一个工件就刚好到了，接着又是砰、砰、砰、砰四声。\n\n叮叮叮叮叮叮叮······\n\n最后一个工件加工完没多久，饭铃便响了起来。a不急不忙地放下工具，舒展了几下力竭的手臂，再向食堂走去。今天的伙食也是那么些a说不上来是啥的菜，就着半硬不硬的面包带下肚，依然不怎么好吃。一口接着一口，伴着工厂隆隆隆的轰响，a咽完了最后一块面包。\n\n“叮叮叮叮叮······”算准了似的，催工铃这时响了，a起身又往工厂走回去。\n\n砰、砰、砰、砰······a流畅地又加工完几个工件。“做来做去都是这一套，不像教导员说的要那么小心。”a想着，随手一抹头上的汗点，用力往旁边一甩，最后擦在裤子大腿侧边发黑的那块，这时下一个工件恰好到了。\n\n“叮叮叮叮叮······”到了晚饭的时间，a照常赶紧跑去食堂，一口当两口地吃完晚饭，只留下一块面包充第二天的早点，又匆忙跑回工厂，晚工的时间总是这么赶。\n\n砰、砰、砰、砰······\n\n工件一块一块地过去，盯着下一块工件，a又开始想“教导员说这些工件加工起来要十分小心，不过做习惯后其实都是同一套把式。”想完这些，a又抹了下额头的汗，向身旁甩掉，最后再往裤子大腿侧边一擦——咔，裤子擦破了。\n\n“啊！”\n\na的手僵住了，朝裤子瞥了眼，接着猛一抬头，突然看见四周的工人都依然做着一模一样的动作，他们的脸都被惨白的灯光照的连成一片，手中不断发出砰砰砰砰的巨响，一模一样的工件一块接一块地过去。环顾四周，硕大的工厂宽敞的不像话，但是又感觉挤得人发慌，四面八方此起彼伏的砰砰声、隆隆声立刻朝他压过来，好像四道巨墙顶着他，马上要把他压到爆体而亡。然而不过两三秒，之前盯着的工件从身旁擦过，一晃过神，a着急拿上工具，转身接着忙活起来。\n\n“呤呤呤呤呤······”收工铃响了。\n\na拖着脚步地朝员工宿舍走去，推开宿舍门，把干面包往桌子上一扔，像被抽空了一样，直板板地倒在了床上。\n"
OMS_POSTNUKE.188.a: "他又忘了脱工作服。"
OMS_POSTNUKE.189.t: "乌云"
OMS_POSTNUKE.189.desc: "乌云遮盖的天空下是一望无际的雪景，远处一道地平线划开了灰色与白色，似油画的两抹颜料一般。雪原中心，几座歪扭的木屋零零散散地从地上冒出，是躲避核辐射的流浪儿们逃来了这里。\n\n村子没有名字。流浪儿们建起了住所、造起了工具、耕起了农田，却始终没有给村子起一个名字。\n\n昏暗的天空上太阳刚出来，乌云下灰蒙蒙一片抹在空气中。住在村头的猎户拎上弓，往喉咙里灌了半壶酒，推开门外出打猎。没过多久，村里的小孩子们跑到猎户家门前玩耍，个头最大、又黑又瘦的那个小孩追着其他人跑，但跑了没几步就停了下来，一边无精打采地蹲着，一边望着远处的几棵树发呆。其他小孩们见他不追了，于是就原地玩起了雪堆，但觉得没意思，一会儿便散了。\n\n刚过正午，村中心里农夫们摆起了摊。破布盖起的棚子里，一个皮肤干裂的农夫坐在摊前，无所事事地看着桌上铺着的几个土豆。\n\n“这个怎么卖？”\n\n听到来客，农夫缓缓抬起头，张开干涸的嘴巴，用嘶哑的嗓音说:\n\n“一子弹五个。”\n\n“买五个。”\n\n接过子弹，放进锈迹斑斑的罐子里，农夫低下头，继续看着土豆。\n\n到了下午，村里唯一一个医生坐在台前拿着笔，笔尖按在笔记本上，却又不动，这是他最后的几页纸了。逃难后，天天都有病人前来，带来的笔记本页数就飞快地减去，他却依然固执地记下病人的病症。望着所剩无几的笔记本，医生想写点什么，他想记下曾经名为“俄罗斯”的土地四十年来的一切，也想记下迁移路上的种种城市废墟，又或者只是记一记上个月发生的那件趣事......\n\n“医生，我有点不舒服。”\n\n医生打消胡思乱想，看向进来的病人，详细问了病症，在所剩无几的纸页上记了下来。\n\n再过一会，太阳就要下山了，猎户带着收获刚好到了家。打开木门，妻子做好的菜摆在桌面上，飘出阵阵香气。饿了半天的猎户把扛着的野猪放在墙边，坐在桌前大快朵颐起来。\n\n“回来了？”\n\n“嗯。”\n\n“回来就好。”\n\n“嗯。打来头猪。”\n\n“晚饭做好了。”\n\n“嗯。”\n\n晚饭过后，猎户躺在床上，一边望着窗外的夜景，一边想着明天的事，想着想着，睡着了。\n\n最后，太阳落下，撒出的最后一缕阳光消散，乌云密布在天空，融入了夜空。一侧，月亮缓缓升起，透过乌云，有微微的月光照在雪原，似是一撇蓝抹在了黑色画布上。\n"
OMS_POSTNUKE.189.a: "也许哪一天，乌云总会散去。"

OMS_POSTNUKE.190.t: "编号"
OMS_POSTNUKE.190.desc: "当大审判开始时，特工181410正在山林中驱车赶路，当无数核武器划过天空，向西方飞去时，他才意识到大审判开始了。于是他只能立刻躲进公路边的一座废弃地堡中躲避。在躲了一天一夜后，181410始终没有感觉到什么动静，于是走出了地堡。天空是乌黑乌黑的，但并没有出现181410所设想的惨状——如被德军反攻或轰炸等。“大概是因为我们的大审判准备充分，彻底战胜了条顿蛮子，没给他们任何反击机会的缘故吧”他暗暗想着。接着，181410找到了先前慌乱中停在路边的车，车还能开，于是181410便开车走了。\n\n天依旧是乌蒙蒙的，天底下，是驱车前行的欣喜若狂的181410。他如同酒后驾车的醉汉一样，车开的扭扭歪歪的。“做到了，对，我们做到了，总司令一定是成功了，俄罗斯祖国母亲终于战胜了条顿蛮子，祖国必将繁荣昌盛！”他如醉如痴般的大声喊叫着。“我就说吧，亚佐夫司令的三大理论就是绝对的真理！总司令万岁！大审判终于到来了，我们俄罗斯祖国母亲所遭受的屈辱与磨难终于结束了！我们真的为祖国报仇雪恨了，劣等的条顿蛮子都死绝了哈哈哈哈哈哈！”181410越想越兴奋，甚至都开始神经质的大笑了起来。“接下来该干什么呢？完成大审判后，对条顿人完成复仇后，我又该何去何从？”\n\n突然，一连串的问题占据了181410的内心，说来也是，筹划了这么多年的大审判，181410可从来没想过在大审判完成后会去干什么，当大审判这一目标完成后，181410的内心陷入了从未有过的空虚，这时，他看到了天边有一抹光亮，正是指南针所指的东方，而东方，正是自己家乡的方向。不用说，那光亮想必是初升的朝阳，他立刻调转车头，朝着那新生的太阳奔去，向着自己的家乡奔去，告诉自己在城镇的父老乡亲们，大审判成功了，俄罗斯民族站起来了！\n"
OMS_POSTNUKE.190.a: "“荣耀归于您，我的俄罗斯，荣耀归于您，我的总司令！”"
OMS_POSTNUKE.191.t: "新生"
OMS_POSTNUKE.191.desc: "接着，他转念一想，“哦对了，我应该投身于建设俄罗斯祖国当中，对对对，在这般残酷的战争后，祖国应该要开始重建了，而我，将成为重建祖国，让祖国繁荣富强的建设者！”想到这里，182211便心满意足了。\n\n“那新生的俄罗斯应该怎么建设呢，条顿人最引以为傲的那个城市叫什么来着？我想想，哦对，叫日耳曼尼亚，对，就是叫这个，以后我们俄罗斯，最偏僻的小城，也得建的比日耳曼尼亚要好，要大，要豪华，对，就得这样，然后我们的首都，应该建的比东京和华盛顿加一起都华丽壮观，我一定要把祖国建设成这样！”\n\n181410欢快的念叨着，向着那抹初生的光亮所代表的东方的家乡的方向前进，“哎，亚佐夫司令会不会死在核爆中啊，如果他死了，谁还能领到我们呢，不会的、绝对不会的！鄂木斯克有最坚固的地堡，总司令一定会活···咔哒···咔哒···咔哒”随着向光亮的不断前进，181410突然听到了一连串的奇怪的咔哒声，他停了下来，翻了翻车内的杂物，以此来寻找异响的来源。\n\n突然，他停住了，他的手颤抖的握住了咔哒声的来换——一台盖革计数器“不对啊，这里怎么还有核辐射？”正当他疑惑之际，西边的天空，亮出了一抹紫红色的夕阳，冲透了天上的黑烟，露出了苍蓝的天空，借着太阳的光亮，181410这才看清，自己昔日的家乡，已然成为了一座陷入火海的废墟。其惨烈程度，比181410听说过的任何一次德国人造成的暴行都要严重的多。一阵劲风吹过，吹走了火海中的火星，吹灭了181410的理智。\n"
OMS_POSTNUKE.191.a: "为什么会这样？大审判已经成功了啊······"
OMS_POSTNUKE.192.t: "罪恶"
OMS_POSTNUKE.192.desc: "咔哒···咔哒···咔哒···盖革计数仪还在洋洋洒洒的响着。181410痛苦的把头压在方向盘上，尽量不去看眼前的惨状。“为什么，为什么会这样！原初审判没有毁灭我的家乡，第二次审判没有，就连大审判都没有，可是现在，它完全成了一片废墟，大审判不是结束了吗？俄罗斯民族不是要复兴了吗？这他妈叫哪门子的复兴?!”181410的眼眶红了，几滴浑浊的泪水落了下来，想到自己刚刚还在想如何如何建设俄罗斯变得更好，顿时觉得自己很可笑。\n\n“什么他妈的大审判，什么总司令，都是扯淡！对，是的，没错，亚佐夫就是个衣冠禽兽，一个大骗子，欺骗了俄罗斯人民，将俄罗斯人民绑在了他那变态一样的对德国人的仇恨上，最终让我们的俄罗斯祖国遭受了这样大的苦难！而且，如果连我的家乡这种城镇都被摧毁了，那整个俄罗斯祖国呢······”想到这里，181410感受到了一阵迸发自骨髓的寒意。\n\n“根本没有俄罗斯人去强求什么对德复仇，根本就没有人想再打仗了。而亚佐夫那个畜生，用所谓的三大理论，不断欺骗俄罗斯人上战场去厮杀，去实现他自己的野心，实现他自己的妄想！亚佐夫才是真正的俄罗斯祖国的叛徒！想到这里，181410眼中的怒火已经可以跟眼前的火海所相配了。\n"
OMS_POSTNUKE.192.a: "“去他妈的编号181410，我的真名是······”"
OMS_POSTNUKE.193.t: "旷野"
OMS_POSTNUKE.193.desc: "米哈伊尔漫无目的的开着快车，行驶在俄罗斯漫无边际的旷野之中。他曾被三大理论所吸引，并认为大审判就是自己生命中的一切。\n\n但现在，全都变了。可是，米哈伊尔已经为大审判投入了太多太多，以至于，他只记得自己是编号181410而忘记了自己姓甚名谁。\n\n米哈伊尔开车到了一个制高点，他抬起头来，瞭望着远方。远方的城市，无不浓烟滚滚，哀嚎遍地，而米哈伊尔的记忆则告诉他，这些城市都是躲过了几十年前的战争的摧残，一直平安发展下去的地方。可现如今，在那个复仇疯子亚佐夫的统治下，也沦落至此了。想到这里，米哈伊尔不禁咬紧了牙关，指甲嵌入了手心。\n\n他恨，他恨啊，他恨亚佐夫这个大骗子把俄罗斯又一次推进了苦难当中，恨自己竟然如此轻信亚佐夫的谎言，并对自己还在畅想美好未来的行径感到羞愧······\n\n他转过了头，看到了一望无际的旷野。天空的苍蓝，穿透了滚滚的黑烟，地上的草木，随着清风微微摇动。事已至此，米哈伊尔也只能在这一切的废墟上，吹拂着孤独的晚风。\n\n突然，他觉得眼前一望无际的旷野，是如此的美丽。他终于想起，自己的名字，他叫米哈伊尔·尤里耶维奇，来自于俄罗斯文化瑰宝中的瑰宝。他想到，这么多年来，自己一直醉心于可笑的大审判事业，这还是第一次全身心的眺望这俄罗斯大地上壮丽的旷野。在的广阔悠远的天地间，费奥多尔终于摆脱了数年来的狂热，感受到了内心的平静。他走在俄罗斯的旷野的土地上，感受着土地的芬芳与奇妙的触感。“我爱这片土地”他欣喜的想着。一切的热忱，一切的恼怒，一切的不甘、懊悔都消失了，剩下来的，唯有对这片旷野的爱。渐渐的，米哈伊尔就走远了，健壮的身影逐渐变成了一个模糊的黑点，消失在了茫茫的大地上。\n"
OMS_POSTNUKE.193.a: "“它不是在寻找幸福，也不是在幸福中逃亡！”"
OMS_POSTNUKE.194.t: "隐士"
OMS_POSTNUKE.194.desc: "一位年轻的特工屏息凝神的站在一扇破木门前。他先敲了敲门，但屋里面却毫无动静，让人感受不到一丝生气。于是乎，他就从口袋里拿出了重建局发给他的资料文件。\n\n据文件记载，在核战期间，这里并不是受袭区，并且一位数一数二优秀的黑色联盟特工正好幸运的在此地区活动，因此这位特工很大概率从核战中幸存了下来。同时，根据附近村民所说，这里确实客居了一位行迹可疑的男子。\n\n“从档案上看，这可真是一位我的好同志啊！这位同志居然出色的完成了如此之多的任务，同时不管是对大审判还是总司令，都怀着极端的热忱，这才是我们应该学习的榜样，这才是吾辈楷模！”他回顾着档案，心理暗暗想着。\n\n年轻特工的思绪飘回到了眼前，面对半天不出声响的木门，年轻特工决定身体先向后倾斜，随后猛的踢出一条腿，用厚实的鞋跟踹在了破旧的门锁处。由于收到了巨大的冲击力，木门终于摇摇晃晃的被震开了。\n\n映入眼帘的，是一名身着黑袍的宝相庄严的男人。只见他手捧着一本并不算厚的书，正在默默的看着。见到有来者，那男人便把书平摊着放在了旁边的桌上，用一束柔和的目光，注视着不速之客的眼睛。\n\n“你就是特工-编号181410吧。”年轻特工开门见山的问道。\n\n“我曾经是181410，但现在，我只是米哈伊尔·尤里耶维奇，这里没有你要找的182211了，你请回吧！”\n\n年轻特工突然抄起旁边的一块木板，抬手间就砸向了米哈伊尔的头，米哈伊尔轻轻一抬手，便单手握住了直朝他头飞来的木板。“宝刀未老啊，老同志，跟我回去吧，黑色联盟已经在亚佐夫总司令的带领下重建起来了，现在我们正缺人手。”听到亚佐夫和黑色联盟，费奥多尔的脸上闪过了一丝异样的神情，但又转瞬即逝般的被坦然所替代。\n"
OMS_POSTNUKE.194.a: "“走吧，跟我回去一起为黑色联盟，为俄罗斯祖国，为亚佐夫司令战斗！”"
OMS_POSTNUKE.195.t: "轮回"
OMS_POSTNUKE.195.desc: "年轻特工向米哈伊尔伸出了一只友好的手，适意他随他一同出去。米哈伊尔突然歪着头木讷住了，仿佛在想什么不可告人的复杂秘密一样。就在年轻特工不解之际，米哈伊尔缓缓的站了起来，于是年轻特工脸上的笑容就更明媚了。\n\n米哈伊尔随年轻特工走出了小屋，到了院子里。这时，米哈伊尔板正了身子，郑重的对年轻特工说：\n\n“我不会再为黑色联盟或是亚佐夫服务或工作了，我只会为俄罗斯祖国服务。”听到这话，年轻特工则略带笑意的说道“黑色联盟和亚佐夫总司令就是咱们的俄罗斯祖国的化身呀，只有黑色联盟和亚佐夫总司令才能保护、呵护我们的祖国呀！前辈你可真是糊涂了，连这个都忘了？”\n\n“不，你错了，亚佐夫或黑色联盟，从来就不足以也不能够代表俄罗斯祖国，亚佐夫就是个得了神经病的疯子，一个大骗子，为了实现他所谓的复仇理想，他甚至可以让俄罗斯也一同毁灭！他骗了所有人，奴役了所有俄罗斯人民来去实现他变态的目标！”\n\n听到这话，年轻特工的眼神也黯淡了下来，刚刚的热情也灰飞烟灭了。“原来，是这样的吗”他自言自语道，“原来如此，原来如此，我全明白了！”看到年轻特工恍然大悟的反应，米哈伊尔也如释重负了。\n\n“你现在做出其他选择，还来得及。”米哈伊尔殷切的说道。“我彻底明白了，之所以大审判并未完全成功，条顿蛮子依旧存在，俄罗斯祖国遭受条顿人荼毒，就是因为你这样的失去信念的叛徒！”年轻特工怒吼着，接着便拔出了腰间的配枪\n"
OMS_POSTNUKE.195.a: "“受死吧，俄罗斯祖国的叛徒！”"
OMS_POSTNUKE.196.t: "决斗"
OMS_POSTNUKE.196.desc: "多年来的旷野生活不仅没有让米哈伊尔的身手退步，反而让他的感官更加敏捷。就在年轻特工准备拔枪射击的一瞬间，米哈伊尔扔出了手中的木板，正好砸中了特工的手，击飞了特工的配枪，生铁色的手枪远远的掉在了特工身后五米左右处。接着，米哈伊尔以迅雷不及掩耳之势，从腰间拔出了自己的手枪。看着指向自己的黑洞洞的枪口，年轻特工也闭上了眼睛，但嘴上依旧咒骂着米哈伊尔是叛徒。\n\n“让我们用俄罗斯的办法来解决吧。”米哈伊尔心平气和的说道，“用最传统的游戏来结束你我的争端”说着，米哈伊尔就把自己的枪也扔到了自己身后五米多的地方。\n\n年轻特工看到了眼前的景象后，先是愣的一秒，然后瞬间转身拔腿向前扑去抢自己的枪。米哈伊尔的身手还是更胜一筹，当特工刚拿到枪时，就听到了米哈伊尔打开枪的保险所发出的清脆的响声，于是他别无选择，只能把枪口从身体另一边的腋下伸出去，朝身后娴熟的盲射。最终，年轻特工知道，自己还是慢了一步，在自己还未扣动扳机前，就已经听到了米哈伊尔手枪扳机扣动所发出的咔哒声，以及随之而来的巨响，于是.......\n\n"
OMS_POSTNUKE.196.a: "两声枪响一前一后的划破了宁静的旷野。"
OMS_POSTNUKE.197.t: "终末"
OMS_POSTNUKE.197.desc: "当年轻特工回头看时，却发现，米哈伊尔是向上举直胳膊，朝天空开了一枪，而自己却是实打实的命中了米哈伊尔的心脏。年轻特工的枪法着实不错，米哈伊尔一枪毙命。\n\n年轻特工看着眼前米哈伊尔的尸体，顿时感受到了一丝悲伤。他不明白，为什么曾经黑色联盟最优秀的战士，会堕落成这个样子，他的编号，181410，曾代表了如此多的荣誉，是那么的光辉，那么的让人钦佩，但现在却落得个如此下场，实在是令人嘘唏不已。\n\n更令年轻特工感到奇怪的是，刚刚米哈伊尔明明有机会杀掉自己，但却发疯般的朝天开枪，“真是个疯子啊”年轻特工感慨道，“还有那些奇怪的疯言疯语，也就是这样的疯子说的出来了”\n\n接着，年轻特工便把米哈伊尔的尸体搬进了木屋，并收走了他的枪。这时，年轻特工注意到了米哈伊尔在他破门而入时看得书，此时正平摊开在桌上。仿佛有那书引力一般，特工的好奇心被吸引到了。于是乎，年轻特工就拿起了那本书细细端详起开。\n\n书很旧，很薄，书页已经发黄，但没有残缺，每一页都十分完整，从年份上看应该是沙俄时期生产的。书的封面，是用烫金边修饰的，书的作者早已模糊不清，但标题仍然清晰可见，是用血红色油墨印刷出的花体字——恶魔\n\n"
OMS_POSTNUKE.197.a: "“让我看看181410刚刚正在读的那页吧。”"
OMS_POSTNUKE.198.t: "恶魔"
OMS_POSTNUKE.198.desc: "······忧郁的恶魔，受逐的精灵，\n在罪孽深重的尘世上盘旋，\n往昔那美好岁月里的情景，\n一幕接一幕浮现在他眼前：\n想当年，他这纯真的司智天使，\n在光明的居所里大显身手；\n想当年，那疾驰而过的彗星，\n常常喜欢用亲切的微笑，\n回报他的一笑以表示问候；\n想当年，他怀着认识的渴求，\n透过了终年不散的迷雾，\n俯瞰着一群群飘浮在空中，\n已被上苍丢弃了的星辰；\n想当年，他这个造物的幸运儿，\n保持着希望，充满了爱心！\n他从不怀疑，也未曾恼恨，\n千百年无益而乏味的时光，\n没有影响到他心灵的纯真······\n还有许许多多的······但他\n要回忆这一切却力不从心！\n"
OMS_POSTNUKE.198.a: "“而它，狂乱地祈求着风暴，\n仿佛是风暴中才有着安宁！”"

OMS_POSTNUKE.199.t: "剔除腐朽"
OMS_POSTNUKE.199.desc: "亚佐夫总司令的声音如同北风般凛冽而无情，穿透了地堡的每一处缝隙。他那双饱含复仇之火的眼睛扫过战情室，最终停留在那些象征着忠诚与奉献的旗帜上。然而，在他的眼中，这些旗帜下正滋生着看不见的腐朽。在这大审判的生死存亡之际，任何一丝的背叛或软弱都是无法容忍的罪行。\n\n“我们将在核战的废墟上重建家园，”亚佐夫的声音低沉而有力，“为此，我们需要经受住饥饿与混乱的考验。但现在，一些小偷正在利用职权方便窃取联邦宝贵的物资。他们以为自己占了点便宜，但他们躲不过联盟的眼睛。”\n\n随着命令的下达，地堡内的气氛骤然收紧。被称为“行刑者”的特工们如同幽灵般在走廊里穿梭，他们的目标无所不有，心怀异见的军官、对复仇事业有所动摇的官员，以及所有被认为可能成为不确定因素的人。同时，联盟下达了公告，如果发现疑似腐败现象并属实，联盟将予以奖励。\n\n一位名叫谢尔盖·伊万诺夫的年轻军官，因在私下抱怨食物配给而被带走。他坚称自己的话并无恶意，只是为了改善士兵的生活。然而，在“行刑者”看来，这不过是软弱和动摇的借口。另一位年迈的工程师，因坚持认为某项生化武器研发项目过于浪费而受到审查。他试图用数据和理论来辩解，但在大审判面前，他们的话语苍白无力。在亚佐夫的信条里，为了大审判，任何牺牲都是必要的，甚至包括那些曾为联盟做出贡献的人。\n\n随着清洗行动的深入，地堡变得更加安静，但这种安静并非来自和平，而是源于恐惧。每个人都在小心翼翼地言行举止，生怕成为下一个被“剔除”的目标。然而，在这片肃杀之中，亚佐夫看到了他想要的纯粹：一个完全忠诚于复仇事业，不再有任何杂音的联盟。他坚信，只有如此，俄罗斯才能在最终的“大审判”中取得胜利。\n\n"
OMS_POSTNUKE.199.a: "这场清洗将确保我们的意志如一。"
OMS_POSTNUKE.200.t: "清除蠹虫"
OMS_POSTNUKE.200.desc: "“腐朽并非只存在于思想的层面，它更是以贪婪和懒惰的肮脏形式，盘踞在我们赖以生存的堡垒深处。”\n亚佐夫总司令的声音在每个地堡的角落回响。继之前对思想上的不忠进行清洗之后，他将矛头转向了另一个同样致命的敌人：官僚腐败。在这生死关头，那些负责分配物资、管理工业的官员们，却将手中的权力变成了中饱私囊的工具。食物配给被克扣、武器零件被偷卖、重要的工业计划停滞不前。这些行为如同致命的毒瘤，正在侵蚀着黑色联盟的生存根基。\n清洗行动随即展开，这次，行刑者的目标不止是那些思想不纯的知识分子或动摇的军官，还有那些光鲜亮丽、却双手沾满赃物的官员。\n一个名叫格里戈里的后勤部官员被当众逮捕。他被指控囤积了大量稀缺的罐头和药品，并私下交易到黑市。他的家中被搜出成箱的违禁品，而这些物资本可以挽救无数士兵和工人的生命。在审判庭上，他试图辩解自己的行为，但他的声音很快被愤怒的民众和军官的怒吼所淹没。\n另一位负责武器生产的工程师，因虚报生产数据并从中牟利而被捕。他上交的报告里记录了本应生产出的无数枪支和炮弹，但实际上这些东西并不存在。而在他的工厂里，许多工人因缺乏必要的工具和原材料而无所事事，生产进度停滞不前。他被处决的命令在一天之内下达，成为了地堡内贪腐官员的第一个典型。\n“这些蠹虫，他们比德国的炸弹更可怕，”亚佐夫在随后的广播中说道，“他们腐蚀了我们的灵魂。他们窃取了战士的口粮，他们延误了武器的生产，他们用私利来玷污我们为之奋斗的伟大事业。”\n清洗行动的效果立竿见影，短暂的混乱后，地堡里的秩序变的更加稳定。亚佐夫总司令看着提交上来的审判报告，脸上没有一丝波动。他相信，为了一个纯粹而强大的俄罗斯，任何障碍都必须被无情地扫除。\n"
OMS_POSTNUKE.200.a: "大审判需要每个人恪尽职守。"
OMS_POSTNUKE.201.t: "寂静的荒原"
OMS_POSTNUKE.201.desc: "地堡的巨型闸门在沉重的机械声中缓缓开启，一束久违的光线，带着轻微的辐射尘埃，洒在了地堡冰冷的大门前。自无尽的烈焰将人类驱入地下，这扇门已经紧闭了不知多少岁月。如今地表辐射水平终于降到了可接受的范围。在亚佐夫总司令的命令下，重返地表的第一批队伍，由最精锐的开垦者组成，正准备踏上这片陌生的家园。\n\n他们每个人都装备着简单的防辐射服和工具，但内心却充满了复杂的情感。他们中的大多数人，只在教科书和老一辈的回忆中见过蓝天白云和广袤的平原。而现在，展现在他们眼前的，是一片死寂的荒芜。曾经繁华的鄂木斯克城已化为废墟，扭曲的钢铁骨架和被烧焦的瓦砾是唯一的城市遗迹。没有风声，没有鸟鸣，只有脚下的碎石发出的沙沙声。这种惊人的寂静比最可怕的核爆声更具穿透力，它无声地诉说着一个时代的终结。\n\n一位名叫伊万·彼得罗夫的年轻开垦者，在废墟中发现了一个锈迹斑斑的儿童玩具车。他轻轻地捡起，用衣袖擦拭去上面的灰尘，仿佛能透过它看到过去那个充满欢声笑语的世界。他的眼中闪过一丝悲伤，但很快被一种坚毅所取代。这个被摧毁的世界，正是他们为之奋斗的大审判所要避免的景象。他们必须行动起来，让祖国从灰烬中重生。\n\n按照计划，他们在鄂木斯克城内建立了第一个检查站，这不仅是为了监测辐射水平，更是为了宣示黑色联盟对这片土地的绝对主权。重建房屋的工作也同步进行，他们利用残存的工业设备和回收的金属，开始修复居民住所，为了更多的人能正常生产生活，一切工作都在有序展开。\n\n“我们将重新驯服这片废土。”负责这次行动的指挥官在给总司令的报告中写道，“我们将用我们的汗水和意志，重建俄罗斯人的家园。我们会建立起一个完全由力量、工业和尚武精神构成的国家，俄罗斯将成为正义与文明的灯塔，照亮这个被纳粹腐败思想所污染的世界。”\n\n当晚，伊万·彼得罗夫在日记中写道：“今天，我触摸到了旧世界的残骸。它并非如教科书中那样充满生机，它现在只是一片废墟。我在想，我们的“大审判”或许正是为了让这份寂静，永远不会降临在祖国的土地上。”\n\n"
OMS_POSTNUKE.201.a: "旧世界已逝，新世界将重生。"
OMS_POSTNUKE.202.t: "地狱绘图"
OMS_POSTNUKE.202.desc: "屏幕上那些扭曲的画面，他的内心感到一种前所未有的空洞与不安。他曾预想，其他地区的文明早已毁灭，但来自前线的报告却与他的预想大相径庭。\n\n“总司令同志，”一名通讯员报告，“我们在第7号侦测点发现条顿人的信号···不是旧的，是正在使用的。”\n\n这个消息如同一把尖刀，刺入亚佐夫的信念。他曾以为，在核武器的洗礼下，所有条顿余孽都已化为灰烬。但情报显示，仍有条顿势力幸存了下来。他们并非被他亲手带来的地狱所吞噬，反而建立了新的秩序。他们在条顿本土之上，如同顽强的杂草，还在为生存而战。这无疑是对亚佐夫信念的嘲弄，是对大审判完美终结的无情否定。他日夜策划的一切，牺牲了无数俄罗斯人换来的结果，原来只是一个幻想。\n\n更令他感到震惊的，是来自侦察小队的第二份报告。在乌拉尔山脉附近，探测到了多股武装势力的电台信号。根据情报分析，这些势力并非统一的“黑色联盟”，而是各种反叛势力。那些曾被他清洗、被他消灭的布尔什维分子和自由主义余孽，竟然也活了下来，他们夺取了联盟建设起来的据点，建立起新的组织，他们的旗帜上没有联盟的标志，只有对“大审判”的否定。他们曾经是联盟的内部问题，而今，他们成了外部的巨大威胁。\n\n亚佐夫感到前所未有的虚无。他本以为自己是复仇的终结者，却发现自己只是一个混乱的开创者。他亲手带来了地狱，但这个地狱却比他想象的更加复杂和混乱。他的“大审判”并没有终结一切，而是创造了一个更为血腥、更为残酷的新世界。这份虚无感正在慢慢地吞噬他，他的信仰，他的目标，他的整个生命，都似乎失去了意义。\n\n"
OMS_POSTNUKE.202.a: "为了俄罗斯，我必须战胜他们第二次！"
OMS_POSTNUKE.203.t: "四面八方的回音"
OMS_POSTNUKE.203.desc: "地堡的通讯室里，电报机的滴答声成了唯一的主旋律。亚佐夫站在巨大的作战地图前，双眼紧盯着那些代表着部队和据点的标记。他已从之前的虚无感中抽身，将所有的精力都投入到了新的“大审判”方针上。旧世界的余孽们还想死灰复燃，但他会再一次毁灭它们。\n\n根据联盟中央的评估，尽管联盟损失重大，但只要能够将分散在各地的联盟各部重新收拢，他们依然拥有足以碾碎一切的力量。无论是那些苟延残喘的条顿蛮子，还是俄罗斯本土的反动派和匪帮，都将被他们踩在脚下。\n\n亚佐夫下达了最紧急的命令：向所有已知的军区和游击队发送电报，要求他们归队。这份电报的措辞充满了亚佐夫式的冷酷与坚决，即“消灭一切匪帮，将条顿概念彻底化作历史”。\n\n一份电报被发往了远东军区，收件人是皮卡洛夫上校。他的部队位于贝加尔湖，亚佐夫相信，皮卡洛夫的忠诚和坚韧足以让他克服一切困难。电报承诺，一旦他将远东的资源整合起来，联盟将派遣精锐部队前去支援。\n\n另一份电报则送向乌拉尔山区的指挥官亚历山大·拉扎连科。他曾因对“大审判”的理念有所质疑而被视为“动摇者”，但他和他的部队仍是联盟最精锐的部分。亚佐夫的电报没有提及过去的恩怨，只是简单地陈述了事实：只有联合起来，他们才有能力彻底清除敌人。\n\n然而，电报机的回复并非都是积极的。一些电报石沉大海，没有任何回应，这表明部分部队可能已经在混乱中被歼灭或选择了自立。而另一些回电则充满了质疑和不信任。他们质疑亚佐夫的“大审判”是否真的带来了胜利，而不是更多的混乱。\n\n尽管如此，亚佐夫并未动摇。他深知，统一俄罗斯的道路上，总会伴随着怀疑和背叛。但只要他能将那些真正忠诚于复仇事业的人重新聚集在一起，他的“大审判”就依然有完成的可能。\n\n"
OMS_POSTNUKE.203.a: "向所有地区发出呼吁，无论他们是否曾经忠诚。"
OMS_POSTNUKE.204.t: "钢铁与荣耀"
OMS_POSTNUKE.204.desc: "“致总司令，我部已完成对克拉斯诺亚尔斯克的掌控，随时可以对周边地区进行清扫...”\n\n通讯室的屏幕上，终于跳出了一个期待已久的回应。电报来自克拉斯诺亚尔斯克，一个曾被地表混乱阻隔的战略要地。电文的署名是亚历山大·萨哈罗夫斯基，那个在大考验之际与总司令同心同德、为黑色联盟立下汗马功劳的革新派领军人物。他的部队曾驻守这一冶金重镇与铁路枢纽，在大审判来临时，当地的地堡体系极好地发挥了作用，为联盟保住了大量的宝贵工业、人力和物资。\n\n亚佐夫的脸上没有流露出任何情感，但他的目光中闪过一丝波澜。在面对四分五裂的现实时，这份来自老同志的回复无疑是黑暗中的一道光。萨哈罗夫斯基的电报简洁而有力，他报告了克拉斯诺亚尔斯克的情况：地堡体系在核战中幸存下来，工业设施得以保全，当地的联盟势力也在他的指挥下稳住了阵脚。然而，他并没有提及对外探索的情况，只是强调，经过长时间的养精蓄锐，他们现在重新具备了对当地进行有效管辖的能力。\n\n这封电报意义重大。从战略上来说，这意味着黑色联盟获得了一个巨大的后方支持。克拉斯诺亚尔斯克作为重要的工业和资源中心，具备丰富的人力和煤炭资源，这将为“大审判”的第二阶段提供至关重要的保障。\n\n但从个人层面，这封电报也给亚佐夫带来了复杂的情绪。他亲手为俄罗斯带来了地狱，见证了太多人在这无声的寂寞中变质发狂，但还有萨哈罗夫斯基这样的人依然在坚守着联盟的最初理想。他们没有被地表的混乱所迷惑，仍然坚持着大审判的理想。他们的存在，正是对亚佐夫复仇之路的一种无言的肯定。\n\n然而，亚佐夫也深知，收拢萨哈罗夫斯基所部并不是简单的事情。这封电报是合作的开始，但也会给自己的老朋友带来很多麻烦。他需要团结一切大审判的忠诚者，而不是给他们多添麻烦。如何利用好各个地堡的力量，也将是亚佐夫在接下来的征程中必须面对的挑战。\n\n"
OMS_POSTNUKE.204.a: "再联络萨哈罗夫斯基，商讨重建东部战区一事。"
OMS_POSTNUKE.205.t: "抉择"
OMS_POSTNUKE.205.desc: "今天是部队出发的第六天，亚佐夫在军官指挥所里辗转反侧，又开始翻开各个外出联络小队的派遣报告。他一丝不苟的将派向各个方向的小队进军请示和报告看完，然后写上接下来的指示，打开抽屉，放到预先准备好的文件夹里，参谋们会将之转发执行下去。在这个抽屉里，在鄂木斯克周边探索的指示已经写的满满当当，向西方的文件夹里也塞了不少，只有派往东方的小队文件夹里，指示还是空空如也。\n\n他叹了一口气，正打算回到总指挥部继续开会，他身边的电讯收发员突然惊呼一声，然后开始操作起面前那台黑白打字机起来，亚佐夫静静的看着这位小战士将电文逐步翻译出来，很快，打字机的咔擦声结束，一份完整的勘测报告交到了亚佐夫的手上。\n\n致总司令\n关于我部“西进”运动状态以及面临的挑战建议\n\n自我部向东出发以来，沿途除遭遇大量已毁灭的设施外，已出现了多股势力对我方进行袭击，根据我方侦察，这些势力多为大审判之后出现在各聚居点的匪帮，但也存在小股忠诚于联盟的部队与之对抗，我部已给予他们足够的武器弹药，以及通讯设施进行联络。\n\n我部先锋队已到达克勒孜，根据侦察观测，周边暂无其他势力生存迹象，受山脉影响，大量土地保存情况相对完好，当我部到达此地区期间，部分联盟守军已经完成了对此地区的勘测和平整，联盟随时可派出人员恢复生产活动。\n\n我部主力已到达坎斯克，根据勘测，此地区的基础设施毁伤严重，大量工厂设施缺少及时维护已完全损坏。煤炭开采设施相对埋藏较深，保存较好，我方已及时进行恢复生产，请总司令下达指示。\n"
OMS_POSTNUKE.205.a: "优先恢复坎斯克的工业生产，恢复联盟的能源供应。"
OMS_POSTNUKE.205.b: "优先控制克孜勒，确保农业生产安全。"
OMS_POSTNUKE.205.c: "坎斯克和克孜勒都至关重要，必须同时进行！"
OMS_POSTNUKE.206.t: "除罪"
OMS_POSTNUKE.206.desc: "蛐蛐在夜幕下开始鸣叫，月光穿过夜幕，洒在索科洛夫和他的兄弟会和手下兄弟们身上，他们在一处广场上点起了一处篝火，然后开始分享今日抢到的战利品。今天又是收获的一天，他们意外的找到了一些军火，消灭了几个小的不服从的帮派。新加入帮派的小老弟们还有些拘束，有的拨弄着手指，有的悄悄用脚拨弄着脚下的土地。火堆中间的老大们倒是其乐融融，索科洛夫笑嘻嘻的掏出一根卷好的烟，然后抽了起来。他歪过头，喊了一嗓子。\n\n“米沙！肉烤好了没有？”\n\n“快了，老大，马上就给你送过来！”\n\n他转过身，看了看远处的废墟：“真好啊，这小地方是怎么存下这么多东西的？”\n\n远处的夜幕中突然传出几声雷鸣，索科洛夫迅速爬起身，一连串的爆炸沿着火堆随之响起，兄弟会的新人们开始慌乱了起来，一个干部正喊着要阻止他们，立刻就被打倒在地。紧接着，四面八方的灯光撕破黑夜，一连串的黑衣人穿过黑夜，精准的对着兄弟会的乱兵开枪。很快，索科洛夫就被一个黑衣人拷了起来。他剩下的几个手下也被抓了起来。\n\n“我就知道，你们并没有死绝。”他看着那些熟悉的黑色联盟士兵，不禁苦笑了起来。“所以我们得到的那些物资，都是联盟的库存？”\n\n“当然，这些都是总司令的命令。”领头的黑衣人点了点头：“包括你们消灭的那些小帮派，都有我们的指引，这点我们还需要感谢你们消灭了那些我们找不到的小势力。好了，还有什么遗言吗？”\n\n“我们不能加入联盟的赎罪旅吗？”索科洛屏住呼吸，提出了最后的疑问。\n\n“不能，我们要恢复乌拉尔的秩序。”\n\n“那，再给我一根烟吧，让我最后过一把瘾”\n"
OMS_POSTNUKE.206.a: "“哈?你想的可真美。”"
OMS_POSTNUKE.207.t: "老友重逢"
OMS_POSTNUKE.207.desc: "电报机沉寂良久，直到来自乌拉尔的回电抵达，为通讯中心的喧嚣带来了片刻的宁静。电报的署名是拉扎连科，这位曾驻守乌拉尔军区、负责整个山脉周边统辖的联盟骨干。在热核战争后，由于地表世界的混乱，乌拉尔的大部分区域曾一度失控，落入反动派之手。然而，在拉扎连科的铁腕下，乌拉尔军区依旧牢牢掌控着南乌拉尔，他们守护着这片“宝山”，实力不容小觑。\n\n电文内容简明扼要，报告了乌拉尔地区的现状，并确认了他们对鄂木斯克的忠诚。这无疑让亚佐夫感到一丝慰藉。拉扎连科不仅是总司令的密友，更是联盟的骨干人物，他的存在本身就是一种强大的力量象征。他随即决定，将拉扎连科调回鄂木斯克，以在中央担任更重要的职位。\n\n几个小时后，一架破旧的运输机在鄂木斯克地堡的简易跑道上降落。拉扎连科从机舱中走出，他的军装上满是地表的尘埃，但眼神却依旧坚定。他与亚佐夫在地堡深处的作战室里重逢。两人没有过多的寒暄，只是一个坚定的握手，便开始讨论当下的局势。\n\n拉扎连科详细描述了他在南乌拉尔的经历。他谈到了地下生活的经过和困难，也谈到了反对派余孽的顽固，但他语气中更多的是一种自信。他相信，他所统辖的部队有能力清除任何威胁，并为“大审判”的最终胜利奠定坚实的基础。\n\n“总司令同志，”他沉声道，“乌拉尔是我们的基石，有了它，我们就能进一步推进大审判。我在这里留下的部队和指挥官，绝对能够完成您赋予的任务。而我，已经准备好在中央为您效力，为联盟的伟大复仇事业贡献我的全部力量。”\n\n亚佐夫点了点头，他知道，将拉扎连科调回中央是正确的决定。他的存在将极大地增强联盟中央的凝聚力，他的军事才能和对地表世界的深刻理解，也将为亚佐夫的战略布局提供有力的支持。乌拉尔军区将被移交给一位新的指挥官，他将利用好拉扎连科的影响力，将乌拉尔的潜力尽可能的开发出来，辐射到整个俄罗斯大地。\n"
OMS_POSTNUKE.207.a: "“很好，拉扎连科，部队的饮食情况如何？”"
OMS_POSTNUKE.208.t: "一，或全"
OMS_POSTNUKE.208.desc: "“根据小队成员暗中调查，哈萨克当地驻军存在大量的徇私舞弊行为，工厂备战物资大量存在丢失，招收部队士气涣散，严重缺失应有的训练，甚至公然对平民进行劫掠...供应物资短缺严重，除高层官员以外，基层平民到士兵均存在物资短缺问题，调查表明，大量物资均流失进入黑市出售...”\n\n望着眼前正在读着文件的秘书官，亚佐夫感到一种深深的愤怒。在他所预想的秩序之中，从没有这种思想堕落，道德腐化的行为的容身之所。他当年和卡尔贝舍夫，马特维延科这些志同道合的人们一起拼命流血，难道是为了让这些垃圾吃香喝辣？望着看他状态已不太对劲，暂停了报告阅读的秘书官，亚佐夫眨了眨眼，把怒火暂时按下：“继续说。”\n\n秘书官抽出第二份报告，继续说道：“总司令，根据调查队发来的报告，联盟安全总部对哈萨克驻军进行了监听。可以总结出来的是，哈萨克的驻军几乎全体涉及贪腐案件，可以说，部分官员甚至主动通过贪腐完成工作，总局担忧的是，如果我们贸然对他们采取行动，哈萨克高层可能主动参与到反叛中去。”\n\n真的烂透了，亚佐夫如此想到。一旁的沉默的参谋长倒是突然插进话来：“总司令阁下，我倒是有个想法，当前哈萨克当地高层对我们还算友好，我们可以借训练部队为名，对他们进行一次突击，之后以恢复训练为名对他们进行逐个调查清算。只要能稳定秩序，我们就能逐渐对哈萨克进行换血。”\n\n“可这样他们会掩藏自己，他们会销毁证据，毁灭人证，如果不把他们全都消灭，我们的秩序就会被这些腐败分子所毁灭！”\n\n“但我们需要保证哈萨克的安全，总司令，我们现在很缺人，如果哈萨克的部队再反叛我们，我们当前无法抽出足够的人手前去平叛。”\n"
OMS_POSTNUKE.208.a: "派一支精干的军官团去，督导他们训练。"
OMS_POSTNUKE.209.t: "揭露真相"
OMS_POSTNUKE.209.desc: "寒风凛冽，在彼得格勒的废墟之上，黑色联盟的派出部队已经找到了建起了一个个定居点。在无尽的毁灭之尘落下之后，联盟的部队立刻开始向西进军，来到了这片地图上被标记为俄罗斯旧都的伟大城市，虽然这里已经不再伟大：无尽的废墟，四处都是的枯骨，就连俄罗斯人曾经伟大的文化标志：冬宫，现在都已经是一堆残垣断壁。夜幕已深，部队里的特定人打开预定的电台，调到特定的频道，亚佐夫的声音很快穿越千山万水，传到每一个人的耳中\n\n“同胞们，我的兄弟姐妹们！”亚佐夫的声音如同一道惊雷，划破了冬日的沉寂，“我看到了你们的疲惫，也感受到了你们的痛苦！我们付出了太多，失去了太多！但是，请你们站直了，挺起你们的胸膛，因为我要告诉你们一个真相！”\n\n他的声音充满了力量，每一个字都精准地刺入人心：“现在，我们的国土上，出现了一群躲在阴沟里的懦夫，他们打出和平主义旗号，传播最卑劣的谎言！他们告诉你们，我们已经输了！战争已经结束，我们应该放下武器，向条顿人卑躬屈膝！他们错了！他们大错特错！我今天站在这里，就是要告诉你们：条顿已无可用之兵！”\n\n所有的人惊讶的看着彼此，默默的把收音机的音量提高。“那些阴沟里的老鼠，他们没有物资，没有武器，更没有弹药！他们用谎言和恐惧来欺骗我们，他们只懂得苟且偷生，只懂得向敌人摇尾乞怜。他们把祖国的命运交给那些傲慢的条顿人，以为只要躲在敌人的庇护下，就能苟延残喘！就像曾经的俄罗斯叛徒们一样，建立什么狗屁不通的民主！他们不配！他们不配是一个俄罗斯人！”\n"
OMS_POSTNUKE.209.a: "每一个俄罗斯人，都绝不会对祖国的叛徒们卑躬屈膝！"
OMS_POSTNUKE.210.t: "旧仇恨"
OMS_POSTNUKE.210.desc: "当一连串的咆哮结束之后，亚佐夫话锋一转，他开始用一种委婉的口气，追溯起过去的历史，将矛头直指条顿人的意识形态。\n\n“还记得阿道夫.希特勒，那只所有条顿人中最恶毒，最令人恶心的狂妄的臭虫吗？在半个世纪前，他宣称我们俄罗斯人是野蛮的、缺乏觉醒意识的愚钝之人，说我们必须永远臣服于他们！也许那些投降主义者确实符合他的描述，但那绝不是我们！我们在核火中幸存下来！我们，是那些敢于直面地狱的人！我们，是那些将复仇之火铭刻在骨子里的人！我们，才是俄罗斯真正的脊梁！”\n\n“在我们所开始的民族复仇之战中，他们喊着正义的名义，威胁我们要将核弹投下地球，用恐惧来迫使我们屈服，实现他们的独裁野心！但我们没有！在联盟强大的准备之下，我们俄罗斯人躲过了毁灭，活在了如今的土地上！那些投降派们高喊着联盟在打一场不义之战，可我们如今站在这里，不是因为敌人那所谓的正义！而是每一位黑色联盟的公民的汗水与奋斗！\n\n“他们以为他们赢了！他们以为他们的暴行已经被所有人遗忘！”他的声音充满了讥讽，“那些躲在遥远地堡里的条顿人，他们甚至不知道我们是如何在这片废土上，从瓦砾中重建家园！他们连最基本的秩序都已崩溃，如何赶得上伟大的俄罗斯人！”\n\n他的的语气突然变得沉重而悲痛，仿佛在替所有死去的亡魂发声：“请你们告诉我，一个屠戮几十亿生灵的民族，也能称之为正义吗？这难道不是最卑劣、最邪恶的民族吗？！”他的话语唤醒了人们看到过的种种惨象，许多聚集点的士兵默默的低下头去。\n\n“但真正的正义没有消失！我们俄罗斯人正是人类最后的希望！我们每一位公民和战士都会永远记得条顿人的累累罪行，我们不会让条顿人的‘正义’再毁灭我们的家园！”\n\n亚佐夫的演讲如同烈火般燃烧，将听众的情绪推向了高潮。他成功地将人们从绝望的深渊中拉了出来，用仇恨和希望为他们重新铸造了信仰。他知道，现在是时候，告诉他们最终的答案了。\n\n“那邪恶的条顿仍存在于那西方，”他的声音在废墟上空回荡。\n"
OMS_POSTNUKE.210.a: "“大审判还没有结束！我们的复仇还没有结束！”"
OMS_POSTNUKE.211.t: "跨越铁幕"
OMS_POSTNUKE.211.desc: "当亚佐夫说出“大审判还没有结束”时，人群突然陷入了一片死寂，长久的宣传中，条顿人一直被塑造为联盟最穷凶极恶的敌人，但当这些敌人现在仍然没有死绝的消息传来的时候，很多士兵都开始产生了动摇，议论声旋即出现。就在此时，亚佐夫自信而又平稳的声音再次传来。\n\n“在无法用武力迫使我们屈服后，他们投下了核弹，用几十亿人的死亡摧毁了世界上的文明，试图毁灭我们！但是，他们错了！他们低估了我们！”亚佐夫的声音充满了胜利者的姿态，“看看那所谓的大日耳曼国吧！他们的文明已经衰微，他们连回复我们都做不到了，因为他们的人力被自己的核弹屠杀殆尽！投降派们嘴里所谓强大的条顿人，现在只不过是一群死亡的僵尸！”\n\n“在过去，条顿人用无数卑鄙的投降者，以及精神堕落的奴隶，编制起一道所谓统一的谎言，一道笼罩旧世界的铁幕，是我们俄罗斯人，用自己的勇气，打碎了条顿人的无敌神话，跨越了这条顿人塑造的铁幕！我们的牺牲，并不是毫无意义的，我们今天活在这里，就是为了完成对旧世界的彻底清算！”\n\n亚佐夫的声音变得悲壮而庄严，他向每一个人发出了最后的号召：“在跨越了无数的死亡之后，所有的俄罗斯人必须站起来，团结在联盟的旗帜下！我们绝不能给条顿任何复活的机会！毁灭条顿，终结这该死的历史，我们将在条顿人的尸体之上，重建一个真正属于俄罗斯的世界！”\n"
OMS_POSTNUKE.211.a: "“黑色联盟万岁！大审判万岁！”"
OMS_POSTNUKE.212.t: "叛国者之死"
OMS_POSTNUKE.212.desc: "阿斯塔霍夫躺在那名为床，实际上只是破布上塞了两捆草的地方，久久的注视着外面还有一点阳光的窗户。自从他几个月前反对联盟为所谓大审判的征兵，他就被关到了这里。他已经记不清现在被关了多久了，三个月？还是更久？他原以为自己已经适应了地下的寂寞，但真的回到地上之后，他还是会对外面的阳光而贪恋不已。\n\n他翻了个身，想闭上眼睛。突然，牢门和钥匙碰撞的声音响了起来，他正想起身，两名士兵直接闯进牢房，见面就给了他两拳。在他疼的蜷缩起来的时候，面前的士兵给他套上了面罩，将他一把拖了出去。\n\n在阿斯塔霍夫的感知中，他很快就从潮湿的牢房来到了外面的空地上，阳光照射到身上的感觉甚至让他感觉有点温暖。然后他被带到了一辆车上。隔着面罩，他还是能听见外面严肃的军乐，和那个独裁者亚佐夫的演讲。\n\n“公民们！士兵们！我的同胞们！最后的战争开始了！是的，我们又一次踏上了征程！这不是一场普通的战争，这是一场总力战，一场决定我们民族存亡、决定人类未来的第三次大考验！”\n\n又来了，这个独裁者又开始编造一堆谎言去骗无辜的俄罗斯人们去送死了。他如此想到。不知道开了多久，汽车在一处地方停下，几个士兵把阿斯塔霍夫拽下车，然后揭下头罩。阿斯塔霍夫定睛望过去，眼前是一群沉默的民众。\n\n“罪人阿斯塔霍夫，你对抗国家兵役制度，宣传对条顿投降，政府如今判你死刑，将于今天执行！”\n\n还没等他还嘴，一名士兵就将他押倒在地，“妈的，死叛徒。”子弹上膛的声音突然缓慢而又清晰，紧接着，一声清澈的轰鸣声响了起来。\n“叛徒已死，俄罗斯万岁！”\n雷鸣般的欢呼声，成为了他最后听到的声音。\n"
OMS_POSTNUKE.212.a: "叛徒没有明天。"
OMS_POSTNUKE.213.t: "加码工作"
OMS_POSTNUKE.213.desc: "纳伊德诺夫上校看了看交到他手上相关物资清单，又看了看墙上的计划表，他不禁用手扶额，开始犯愁起来。在大审判继续的命令下发之后，联盟安全部和后勤部门立刻就开始了在地堡范围内的物资征集行动，也搜罗了好几个军事基地，他们回来的时候，车上已经装满了各式各样的物资：大量还能勉强食用的罐头，各种各样的步枪，自动步枪以及一些爆炸物，足够武装上百名士兵。令人头疼的是，好多武器以及弹药因为保养不佳，等联盟的士兵们及时发现的时候，很多都已经生锈了。\n\n他继续在仓库里转了一圈，又有一个派出小队从外面回来了。他迎面走到停下的车前，对着面前制服上有干员标识的人，开始询问：“老兄，找到点能用的东西吗？”\n\n“武器找到了一堆，现在麻烦是，好多武器需要重新加工。”他掏出一个弹匣，按在一把冲锋枪上，对着天才开了几枪，就卡壳了。“如你所见，武器故障率高的吓人，这些玩意需要重新加工才能正常使用。”\n\n纳伊德诺夫看了看车上那一堆未开封的箱子，这些玩意已经堆的跟一座小山那么高。\n\n“马上向联盟民政部门发报，征集全社会拥有熟练技术的工人，部队会负担征用和运输费用，咱们得加把劲了。”\n\n"
OMS_POSTNUKE.213.a: "至少这几天是别想睡了。"
OMS_POSTNUKE.214.t: "征丁"
OMS_POSTNUKE.214.desc: "呼啸的寒风扫过夜幕下的平原，直挺挺的打在窗户纸上，农民伊万驻着一条腿，听着外面呼啸的风声，又看了看远处烧红的炉子，心里涌起一阵暖意，他终于回到地上了。\n\n他回过头去，远处的厨房内，妻子正在厨房里收拾碗盘，刚放进炉子不久的黑面包香味已经开始逐渐传播开来。这种安逸的生活让他不由得想起了地下那枯燥而机械的每一天：面对着灰白的墙壁，穿着厚厚的衣物，在没有味道的土壤上种植所谓防辐射作物。那样枯燥的生活已经过去了，他要拥抱新的生活了。\n\n门外突然响起了急促的敲击声，那熟悉的频率让伊万如坠冰窟。还没等妻子去开门，门就被砸开了，三个黑色制服的士兵裹着风雪闯进屋子，为首的带着征兵官的简章。“伊万.费多罗夫？”\n\n“长官，仗不是打完了吗？回地上的时候安全部的说了，我可以回家了？！”\n\n征兵官展开一张公文：“总司令已经下达命令，为完成对条顿人的大审判，从今开始恢复并扩大预备役规模，军队需要每一位公民参与，快点走吧。”\n\n妻子看着眼前的几个人，突然跪倒在地，泪如雨下：“求求您！他刚回来不久，他已经没有一条腿了。他有重伤证明的！”\n\n“那不重要！”征兵官一边号令把伊万拖走，一边不耐烦的回复到：“现在国家需要的是服从，不是自由，不打败条顿人，你们还想着躲在后方当懦夫？”\n\n伊万被粗暴的拖出家门，他回头看了一眼那居住不久的家。黑面包的味道被寒风吹散，妻子的面容在木窗下逐渐扭曲，又在呼啸的风中逐渐模糊不见。他在心里默念了一声：“对不起。”\n\n"
OMS_POSTNUKE.214.a: "他的身影被推入一连串新征的农民之中，在远方的地平线下消失不见。"
OMS_POSTNUKE.215.t: "家与未来"
OMS_POSTNUKE.215.desc: "拉夫尔.什捷缅科和基里尔.莫罗佐夫在深不见底的隧道里，跟着工友们一锄一铲的挖着土，远处跑来一个工友，喊着吹哨了，到吃饭的时间了。两人停下工作，前往厨房吃饭。\n\n对于像他们这样没有文化，没有家庭的工人来说，往往吃饭是最快乐的时候，至少他们能在一块聊聊天，回忆一下过去——前提是别说什么反联盟的话。两人操着带口音的俄语谈天说地，很快就聊到了他们现在的家。\n\n什捷缅科绘声绘色的描述着自己以前的倒霉日子：在地下的时候联盟给他许了个老婆，结果这女人身子骨不好，生孩子的时候难产死了，许诺分的更大住所也没了着落。莫罗佐夫也不禁接上了茬，他以前也试着在地下找个老婆，但他那个地方就没几个女人下来，甚至到了地上还因为碰到女人太激动，被联盟的警察给打了一顿。\n\n两人吃完了饭，躺到了临时床位上，两人望着上面那微弱的黄光，看了看没有工头巡逻，开始聊起了最近又开始的大审判，以及他们干的工程一事。\n\n什捷缅科还是很担心的，他还记得当年大审判进行的时候，本来联盟前线一直宣传着战无不胜，已经收回了莫斯科等祖国故土，他都打算赶到西部去过好日子了，结果突然就被转移到了地下，上面也被轰轰轰的炸了不知道多久，他不无担心的觉得，真要是又要打仗，他得找个好点的避难所。\n\n关于这点，莫罗佐夫还是笑了笑，他提醒了下拉夫尔，司令已经说了大敌条顿人现在什么反击能力都没有了，等到大审判结束，条顿人都死光，那他们肯定能过上好日子的。\n\n哨声响起，两人从床上爬起，继续按照工头的指示开始今日的挖洞工作。\n\n"
OMS_POSTNUKE.215.a: "但愿能快点吧。"
OMS_POSTNUKE.216.t: "实战补足"
OMS_POSTNUKE.216.desc: "瓦西里的皮靴踩过弹坑，把脚下哑火的弹壳一脚踩进土里。他走到一众慌慌张张，跟受惊的呆头鹅一样的新兵面前，扯开沙哑的嗓子吼了起来。\n\n“告诉我，你们是不是在地下呆的太久了，身子都生锈了，不知道该怎么打仗了！”他沙哑的声音像刀片刮过磨刀石一样难听。“从你开始，一一回答！”\n“是长官！我接受的军事教育里，在遇到敌人快速压进的时候，需要提供稳定的火力支援，压倒敌人的攻势！”\n瓦西里一巴掌打在了这个队长的脸上，把他打得一愣一愣的，“混账，别以为我看不到你怎么打得，连续5分钟你都在一个地方对着所谓目标射击不停，浪费了多少弹药，甚至还是原地补充上弹，我要是在你的对面，一发手榴弹就能把咱们班唯一的火力干掉了！”\n\n“你！”他的手指向一旁的副队长的胸前，“告诉我，为什么炮击发生后，你不在坑道工事里进行躲避，却跑到外面的弹坑里？”\n\n副队长的喉结滚动了一下，还是说了出来：“长官，我在地堡里学习的知识里，在炮击开始后，敌人的炮弹往往不会往同一个地方进行连续轰炸，躲藏在弹坑里有极大可能躲过炮击。”\n\n瓦西里的脸逼近了，副队长甚至看到了他皱纹里掩着的汗滴。\n\n“很好。”他突然暴起，又是一巴掌，打在副队长的后颈上，将把整个人都按在战壕上，死死的让他看着下面的工事：“告诉我，你们挖的这是什么？”\n\n“坑，坑道工事？”\n\n“你知道你跑出去！”瓦西里的声音连带着手劲从上方压下：“现代炮兵可以把炮击精度控制在极小的范围里，你以为炮击打不进弹坑，只不过是碰巧没有炸死你！躲避炮火需要的是坑道工事！而且你们连躲炮弹都是一股脑的出来，敌人炮兵要是间歇开炮，你们全得死！”\n\n谢尔盖叹了口气，突然感觉自己的工作增多了起来。\n“从现在开始，给我把你们从底下学到的东西通通给我忘了！”\n\n"
OMS_POSTNUKE.216.a: "“我亲自教你们这帮新兵蛋子怎么打仗。”"
OMS_POSTNUKE.217.t: "奖惩有道"
OMS_POSTNUKE.217.desc: "列兵伊利亚.格里沙加紧张的瞥了一眼头顶的天花板，又瞥了一眼前面正在检查文件的长官，不禁咽了一口唾沫。他和第78步兵营的其他人整整齐齐的站在新搭起来的军营外。等待政委和长官决定他们在这次伟大西征中的表现。伊利亚可记得，开战前他这个排在忠诚检验中被发现不少人不会背诵总司令的语录，特别被定为不忠集体，一部分人直接被拉出去枪毙了。就在刚刚的遭遇战中，一部分士兵又因为在战场上被吓得丢下武器逃跑，被督战队给抓了起来。\n\n过了十分钟，政委沃龙科夫大踏步的从军营里出来，带着两个全副武装的卫兵，皮笑肉不笑的看着眼前这群已经表现出不适，但还在咬牙硬撑的新兵蛋子们。伊利亚闭上眼睛，心想，这下完了。不料，沃龙科夫接下来的话出乎了所有人的想象。\n\n“恭喜你们，通过了忠诚考验！证明了联盟的忠诚！”\n\n大部分士兵立刻难以置信的看向他，包括闭上眼睛的伊利亚。他发出声音：“长官，我们通过忠诚测验了？”\n\n“当然，我和督战队的成员进行了重复核验，证明了你们在消灭条顿人的战役中表现出色，为了表彰你们的忠诚，总部已经下发新一批的物资给予你们，并将授予你们新的军旗。”\n\n他的话风一转：“但是，军规里也写明了，在军官训话期间，士兵不得无故插嘴，扰乱军队秩序！所以，是谁刚才说话来着，出来，领两鞭子惩罚！”\n\n伊利亚叹了口气，站了出来，脱光上身的衣服，趴在地上。\n\n"
OMS_POSTNUKE.217.a: "大难不死，必有后福。"
OMS_POSTNUKE.218.t: "必要牺牲"
OMS_POSTNUKE.218.desc: "拉扎连科坐在办公室的椅子上，这个月的工作简直没完没了。在大审判继续的命令下达之后，所有的军事机关几乎是在克服一切困难的全力运作，甚至不惜损害正常的重建秩序的继续推进。但任务必须继续完成，就在他这么想着的时候，电话机响了，他娴熟的拿起电话。\n\n“拉扎连科，我是亚佐夫，我...有点疲倦。”拉扎连科听见亚佐夫长泄了一口气才把后面的话说出来，他的心里不禁咯噔一下。\n\n”总司令，您务必管理好自己的身体，俄罗斯，大审判都还需要您，您最好赶紧去休息，我们要完成的工作还有很多。”他尽可能的斟酌着言辞，避免刺激到亚佐夫。\n\n“不是....拉扎连科。我打电话是要告诉你，为了满足大审判的经济需要，我下了命令，削减大部分基层官员的待遇以保证大审判的物资供应，现在很多人都开始反对我，所以，我打算继续开展一波清洗...”\n\n“您不能这样，总司令！”拉扎连科打断了他的话，认真的说：“总司令，现在我们保证前线进军的基础就是后方稳定，这不在计划之中！”\n\n“你以为我他妈的不知道吗！”亚佐夫突然大吼了起来。“为了大审判的事业，你，我，俄罗斯的每个人都付出了太多的牺牲，结果你告诉我条顿佬还没有死绝！我知道那些人有所意见，他们什么时候没有意见？我跟他们已经吵了一整天了，他们还是不同意！我能信赖的只有你了！接下来我把这项工作交给你，必须遏制住这些混蛋的野心！”\n\n“总司令----”还没等拉扎连科发声回复，亚佐夫的电话已经挂了，电话一头只剩下嘀嘀的忙音声。他长叹一口气，慢慢的放下了手里的电话。\n\n"
OMS_POSTNUKE.218.a: "“是，迪米特里。”"
OMS_POSTNUKE.219.t: "测谎"
OMS_POSTNUKE.219.desc: "“干员1156487号，我们需要咨询你一些问题，是关于你最近的工作的。”安全保卫部官员多尔戈夫坐在桌前，看着面前的年轻干员，门外还有两位卫兵站岗，以防被告人突然试图逃跑。最近，上面突然任命了新的安全保卫长官，并且下发了通知，需要对联盟内部进行一次大规模的思想检查工作，对于每个部门的人员，都需要进行非常具体的询问。效果还是很明显的，在昨天的问询中，就发现了有人在工作中玩忽职守，诽谤总司令和大审判的非法言论。\n\n“关于最近地下有关诽谤总司令和大审判的言论，你作为生产检查官员，你知道多少信息？”\n\n“没有，我最近一直在盯着地下的产线生产，那些工人们什么话都不说的。”\n\n多尔戈夫看了看身后人员的眼神，转过头来。“那，你最近在地上的工作期间，有没有接触到这些反联盟分子的具体言论？”\n\n“我跟你说了没有，我跟那些疯子没有任何关系，我家在联盟干员集中安排的居住地点，那里怎么可能有反联的分子？”\n\n“最后一个问题。在我们解除你的职务之后，你是否有对总司令和上级部门的不满言论？”\n\n“没，没有。”\n\n“很不幸，干员，你没有通过测谎。”多尔戈夫下达了判决。“嘴可真硬，但可惜硬不过测谎仪，我们将停止你的一切职务，你该去吃牢饭了。”\n\n“求求你，先生！我还有家人，我还想工作！我为联盟工作了很久才得到这个职务的！如果我都招供的话，能有减刑吗？”\n\n多尔戈夫把一个小本子推了过去。“在这里把你所有的罪证都写下来。”\n\n"
OMS_POSTNUKE.219.a: "“最后记得宣誓效忠。”"
OMS_POSTNUKE.220.t: "开动铁鸟"
OMS_POSTNUKE.220.desc: "锈蚀的冷风灌进飞机基地，或者严格来说是飞机坟场的地方，拂过在场的每一个联盟士兵和军官的脸。为了大审判，上面下达了命令，联盟各外出小队在探索同时，还需要对可能存在的空军基地进行探索，将可能使用的飞机运回联盟进行重新试飞。于是，这间损坏较小的空军基地，很快就堆成了飞机坟场。\n\n军官本丘克和一众技工们走在跑道上，和其他的小队们一样，在不同的地方检查这些过去的钢铁巨鸟们的状况。结果只能说是惨不忍睹：大部分运回来的飞机都已经是锈迹斑斑，就连内部的零件也是损坏严重，更要命的是，联盟现在没法生产飞机最紧要的航电设施、电控系统等先进的电子设备，这些先进的飞机毫无用处。\n\n新的不行，他们只能找更老的。很快，一架旧苏联时代的伊尔二攻击机便映入眼帘，这架飞机上面的木质结构虽然损坏的厉害，但因为结构明显，联盟的技工进行鉴定之后很快就提出可以逆向修复。其他的外部零件虽然也损坏严重，但还原起来不难。更好的消息是，在向联盟提出资料申请后，基地内的人员很快就找到了相关的生产资料，它们是联盟在过去接收苏尔古特时获得的无数飞机改版设计的一部分，现在派上了用场。\n\n他示意了一下一旁的飞行员，飞行员打开驾驶舱，进入飞机，经过整修后控制系统已经恢复正常。他凭借着地下模拟学习的飞行经验很快就开始驾驶了起来，在低空盘旋几圈后，他把飞机停在了一处空地上。技师们蜂拥而上，开始进行再一次的检修。\n\n"
OMS_POSTNUKE.220.a: "好的开始是成功的一半。"
OMS_POSTNUKE.221.t: "未知的恐惧"
OMS_POSTNUKE.221.desc: "“前方的补给需要还没有得到完全满足，你们这些家伙不去下面继续推进生产规模，而是在欣赏！”卡尔梅柯夫上尉敲着写满数据的黑板，对着下方的一众军官们训斥道。\n\n“不是的，不是在欣赏，我们是无能为力！”\n\n“你胡说！咱们只是疏忽大意！”\n\n“你行你试试看啊，还有几个人愿意再下去苦力了？”\n\n“不要吵不要吵...不能这样！”\n\n乱哄哄的争吵声终于停了下来。一位德高望重的连长站起身，给大家鞠了一躬。然后转过身：“我恳请各位听一下我的汇报。”\n\n“您坐，请说吧！”\n\n连长把手放到膝盖上，继续说了下去：\n\n“我最近一段时间就在接触地下的工作，说实话，如果咱们根本没出去的话，地下的生产其实并不难管，但问题就是咱们现在又要管地上地下。要知道，上面的资源勘探和农业恢复什么的本来就没开始的怎么样，突然就要征集大量的资源继续大审判，不少农民都去前线了。上来的人也不愿意再去地下了，要知道，一听到什么风吹草动，这帮人立刻丢下东西往山沟里跑，等我们把他们找回来，多半也是死了或者废了。”\n\n卡尔梅柯夫上尉沉默半晌，还是开了口：“可咱们也得知道，当了军官就得服从命令。特别是咱们这个级别的，哪个不是挨过欺负，我现在能当上个上尉就已经是到顶了。而且俄罗斯需要总司令那样的俄罗斯救星，没有他的领导，咱们早就被德佬的炸弹送上天了...”他又继续沉默了几秒，然后说道：“我觉得吧，总司令聪明着呢，等把条顿人都杀光了，大审判结束了，他肯定会减少工作量的，咱们总不能一直在大审判吧？”\n\n军官们一直谈到半夜。总算是敲定了接下来的工作：适当通过物资奖赏的方式削弱人民的恐惧，然后让他们回到地下继续开展生产，每天也要开展适当的宣誓活动和准军事训练，避免这些人在空闲时间思考反政府的事。\n\n待到夜深人静，军官们大都睡着了。连长突然坐到卡尔梅柯夫的床边，小声说道：\n\n“你要明白，阿列克谢...我喜欢咱们的军队，喜欢咱们的俄罗斯，回到地上的时候闻着野草味我就想哭...还有帮老百姓在地上盖房子，种地的时候，我更是喜欢的要命...可这会我在想：咱们这是在干什么，这样真的能让俄罗斯人有好日子吗？”\n\n“你想说什么？”卡尔梅柯夫警觉地问道。\n\n"
OMS_POSTNUKE.221.a: "“什么都没有，老兄，我困了。”"
OMS_POSTNUKE.222.t: "极致利用"
OMS_POSTNUKE.222.desc: "工程师托米林站在这一堆钢铁巨兽之间，或者说这应该是这些钢铁巨兽的坟墓。自从外出探索队发现了这些铁玩意之后，上面立刻传来命令，让他们立刻想办法开动这些东西，并培养一批坦克兵前往西部战线准备消灭条顿人。他对着基地里送来的军事手册清点了一遍，联盟自主生产的T-72B，条顿人的装甲车和运回来的豹式...可真够乱的，他心想。\n\n在清完了灰之后，他开始带着一群学徒和技工研究具体哪些还能继续使用。条顿人的装甲首先被排除，这些东西虽然看起来样式精美，却个个坏的厉害，所有的玻璃已经全部碎裂或损坏，只是轻轻一碰就碎成了渣，联盟现在制造的一些仪器都完全无法安装上去。反而是那些联盟的坦克，虽然也损坏落灰的厉害，但粗糙简易的加工反而保证了在组件替换的时候极其便利，甚至很多坦克并未受到完全损坏，只是因为长久的置放导致了外部生锈。在托米林带着学徒们从十几台坦克的残骸上搞明白了坦克的构造之后，很快，一台能动的坦克就带着无数坦克拼接而来的零件，在试验场上跑了起来。听着这辆坦克咣当咣当的巨大响声，他想，以后还得是想办法再造一台好的出来吧。\n\n战争是残酷的，他亲眼所见。但为了打赢这场残酷的战场，联盟需要每一个人利用起所有的资源。这成千上午的碎片，都需要他一一组合起来，变成真正能够使用的利器。他只希望，有了这些东西，就能让联盟的士兵们能够以最小的伤亡，彻底消灭条顿人这个俄罗斯的生死大敌，完成总司令所说的大审判。等到战争结束的那一天，他一定要开瓶伏特加庆祝一下。\n\n"
OMS_POSTNUKE.222.a: "“慢点开！这玩意可不经造！”"
OMS_POSTNUKE.223.t: "地下的武库"
OMS_POSTNUKE.223.desc: "尼克很有兴趣的看着小队里伙伴们发生的变化，自从来到地上，好些小伙子从枯燥的训练狂人一下子就变的不一样起来，彼得罗的牛眼睛现在不间断的眨，生怕漏了什么东西看不见；不爱说话的亚历山大现在时不时就要说一两句话，有时候甚至是胡言乱语，上句不接下句；尼古拉耶维奇现在时不时嘿嘿傻笑好几声，虽然尼克看得出他并不是真心的，是忧伤的。每个人自从来了地上之后都发生了变化，他们用不同的方式适应着地上的生活。\n\n“上面确定这里有一个巨大的军火库吗？”彼得罗从背包里掏出一份地图，上面在他们行进的地方画了一个大大的圈子。“他们连基本的地方都找不到了？”\n\n尼克眯起了眼，在土地上仔细的看着寻找着所有的蛛丝马迹，“你不看简报的吗？这些地方为了保证不被条顿人的飞机给发现，特别都做了防核隐匿，特别是在大审判之后，地面不知道被乱七八糟的灰给覆盖了多久，但大致位置应该不会变，所以让咱们几个来找。”\n\n“啥是飞机啊，老大？”亚历山大接过茬，“咱们这地方离条顿人的边境有几万公里以上吧，这些条顿人据说也没打到这么远，他们怎么找得到咱们的军火库的？”\n\n“我知道，飞机就是能在咱们上面那片天空上飞的东西，据说这玩意比咱们的枪打的还高，能从地堡一路飞到祖国西边，还能丢大号手榴弹把敌人炸飞...”\n\n几个人搜索了半天，很快累的气喘吁吁，他们找到了一所混凝土房子歇脚。几个人休息了半天又开始搜索，尼克正搜索东墙的功夫，他突然看见尼古拉耶维奇在拽西北角的一块木板。“你疯了吗！你这样会把承重墙搞塌了！”\n\n“嘿，万一就藏在这呢！”尼古拉耶维奇使劲一拉，墙角的木板连带着半边墙都塌了，差点没把他都埋进去。尼克正想大骂他两句，突然看到了一角透出的银光，等到烟尘落下，他用手电筒照了过去，又用枪敲了敲。“卧槽，不会吧！”\n\n几个人立刻拼命的开始沿着墙搜索，很快找到了一扇门，在用上级提供的钥匙打开门后，几个士兵呆滞的站在那里，不敢相信看见的东西。\n\n几十排规规整整的货架上布满了自动步枪，弹夹和支援炮，下面的箱子上是显眼的生化标志。就在旁边的门后，还有数不清的炮弹。\n"
OMS_POSTNUKE.223.a: "“上帝啊，咱们这下真立功了。”"
OMS_POSTNUKE.224.t: "重返故土"
OMS_POSTNUKE.224.desc: "静静的伏尔加河见证了无尽的历史。来往于伏尔加河土地上的人们因勇气和苦难诞生了无数故事，这些故事被后人传唱出去，成为历史的注脚。\n\n这片土地见证了不倒的红旗，红与白的旗帜在这片俄罗斯人的堡垒之上激烈交锋，钢铁之人的的勇气战胜了一切困难，书写了自己的传奇。\n\n这片土地也见证了一个大国的灭亡。名为布哈林的罪人在此地进行了无尽的建设，却没有保住升起的红旗。来自西方的条顿军团们带着他们的万字旗帜跨过了高加索的群山，来到了这片土地上，在惨烈的战争中，伏尔加河见证了俄罗斯的子女们带着眼泪倒在了祖国的前线上，苏维埃联盟也与伏尔加河一道付之东流。\n\n条顿人占据伏尔加格勒之后，无尽的罪恶在这片土地上不断上演。在这片土地上，俄罗斯曾经的存在符号被无情毁灭，俄罗斯人的反抗在条顿人的铁蹄下被无情碾压，俄罗斯的人民遭到无情屠杀，大量的高加索人作为德国的仆从者，和无数的条顿移民进驻了这片俄罗斯的名城，如今的保卢斯堡，剩下的俄罗斯人要么逃离自己的故乡，要么沦为最凄惨的奴隶，成为条顿人统治的工具。\n\n大审判降临了，罪恶也终于遭到清算和终结。俄罗斯人在亚佐夫总司令的带领下以血与钢铁打垮了曾经不可一世的条顿人，无数的俄罗斯士兵带着怒火跨过了伏尔加河，他们把条顿人驱赶出这片土地，杀尽了这片土地上的高加索仆从。开始试图重建这片俄罗斯的名城。但他们的故事戛然而止，从天而降的核武烈焰将他们的梦想燃烧殆尽，无数的俄罗斯士兵在烈焰焚身和无尽的核辐射空气中惨烈的死去，而不止多少年的辐射也几乎将一切生机杀死，这片土地终究还是成为了一片死地。\n\n但故事并没有结束，当大审判的号角再次吹响，满怀复仇之志的俄罗斯人穿越千山万水，终于重回了这片土地，他们立志，要重建这座城市，跨过死亡。\n\n"
OMS_POSTNUKE.224.a: "直至完成最终的复仇。"
OMS_POSTNUKE.225.t: "永恒的工厂"
OMS_POSTNUKE.225.desc: "自芬布尔之冬的烈火燃尽旧日世界，米德加尔特已沦为一片焦土，不再适合人类生存。然而，在西伯利亚的深处，在克拉斯诺亚尔斯克那座被遗忘的工业废墟之下，一个更为诡异而恐怖的文明诞生了。这里没有亚佐夫的复仇怒火，也没有对统一的狂热，只有一种冰冷而纯粹的，近乎癫狂的生产。\n\n地底的空气中弥漫着机油、铁锈与汗水的混合气味，但没有任何人抱怨。工人们在昏暗的灯光下，如同幽灵般在生产线上移动。他们曾经是有血有肉的人类，但如今，他们舍弃了情感——在永无止境的工作中，情感是毫无作用的累赘。他们舍弃了社交——在冷酷的生产效率面前，交流是一种非必要的活动。他们甚至舍弃了生命——他们已不再是活着的灵魂，而是一群拥有生命的机械。\n\n他们的眼神空洞而呆滞，像是被擦除了所有记忆的白板。他们的动作精准而重复，没有一丝多余的停顿。手指熟练地操作着早已锈蚀的机械臂，将金属零件精准地拧紧、焊接、组装。没有交谈，没有歌声，甚至连呼吸声都微乎其微。唯一的声响，是机器运转时发出的单调而有节奏的轰鸣，以及金属撞击时发出的清脆回响。\n\n这里，没有元帅的演讲，没有国旗的飘扬，更没有对未来的承诺。他们唯一要做的，就是在生产线上工作。他们生产的是什么？没有人知道，或许连他们自己也不再关心。他们唯一记得的，是工作本身。他们已经舍弃了其他所有东西，包括对自由、对爱、对希望的向往。他们已经将自己交给了这座工厂，成为了它永恒的囚徒和最忠实的奴隶。\n\n这是一种可怕的境界。他们没有反抗，没有痛苦，没有怨恨。他们满足于这种没有思想、没有情感的生存方式，仿佛在核火的洗礼后，这是人类唯一的出路。他们成为了地表文明的终极悲剧——不是被毁灭，而是自我异化。他们不再是人类，而是以最原始的方式，成为了工厂的一部分。\n\n这座永恒的工厂，就像是一个冷酷而精准的心脏，在克拉斯诺亚尔斯克那片死寂的废土下，不知疲倦地跳动着。它所生产的，或许不是什么武器或工具，而是对旧世界最深刻的嘲讽，是对人类脆弱与疯狂的最终宣判。\n\n"
OMS_POSTNUKE.225.a: "完美的标准化工厂。"
#these 14 are vanilla post apoc event
OMS_POSTNUKE.238.t: "摊牌"
OMS_POSTNUKE.238.desc: "21:47\n“滴滴滴滴······滴滴滴······滴滴滴”随着那台红色的绝密电台成功送出了最后一份重要情报，库茨涅佐夫几乎立刻躺倒在了椅背上。他们一个来月如履薄冰、小心翼翼的搜查摸底、在自己的国土上像间谍一样传递情报，如此高强度的工作让他疲惫不堪，不过，他心中却有一丝小小的雀跃。因为他明白，有了这一次的经历，他必然不会仅仅是一个小小的内务部中校了。想到这里他略微松了口气，闭目养神。\n\n21:49\n\n再无后顾之忧的库茨涅佐夫睁开眼睛将电台调频，按照计划向埋伏在各地的特种部队依次发出了密语，电子噪声在这间狭小的房间里回荡不绝，而这些信号将让这整个省掀起风暴。\n\n21:50\n\n“咻——”这是克拉斯诺亚尔斯克市农业部长谢洛科夫的护卫由于被麻醉枪射中而倒在地上的声音。\n\n“哐砰!!”这是谢洛科夫的独栋小别墅大门被暴力打开的声音。\n\n“你们是谁？你们要造反吗？!”这是谢洛科夫被两名士兵控制住四肢之后恐惧大喊的声音。\n\n“我们是直属于亚佐夫总司令个人的特种部队[阿尔法小队]，现在已经掌握了你参与克拉斯诺亚尔斯克地区系统性腐败网所有的证据。你将被指控犯有叛国罪，挪用物资罪，贪污受贿罪，以及其余的二十项罪名。如果你不想被判死刑的话，多供出几个人，或者提供一些关键证据，如此，你和你的家人将有机会进入救赎旅。”这是带着黑色贝雷帽的士兵低沉的声音。\n\n“好，我，我保证我会配合，不要杀我，不要杀我!!!”这是谢洛科夫绝望的声音。\n\n······\n\n21:51\n\n克拉斯诺亚尔斯克市副市长雅科夫落网并认罪伏法。\n\n克拉斯诺亚尔斯克警察厅副厅长巴普洛夫落网\n\n······\n\n这场风暴席卷了整个克拉斯诺亚尔斯克省，5个市级官员，30个厅级官员被逮捕，尽管这一次收获颇丰，但库茨涅佐夫明白，极有可能是腐败网最上层的萨哈罗夫斯基绝不是易与之辈，于是接下来，他马不停蹄的赶往了克拉斯诺亚尔斯克省长办公厅。"
OMS_POSTNUKE.238.a: "与猛虎对峙。"
OMS_POSTNUKE.239.t: "意外惊喜"
OMS_POSTNUKE.239.desc: "谢洛科夫坐在审讯室的椅子上，哆哆嗦嗦的拿着笔写着供词，库兹涅佐夫推门进来，谢洛科夫像抓住救命稻草似的抓住库茨涅佐夫的衣袖，把他的手摁到那个本子上，央求道:“同志，这是这份情报的一部分，因为它实在太重要了，我需要请您确认它的基本内容之后再做决定……”\n\n库茨涅佐夫明显有些不耐烦:“你这个杂种，这到底是什么?你说不说？你要是现在不说，我立刻就把你送去矿井底下烂掉!”谢洛科夫有些崩溃了，他几乎带着哭腔地小声说出了那句话:“关于萨哈罗夫斯基省长的证据!”\n\n库茨涅佐夫的心脏先是漏跳了半拍，然后，一股兴奋夹杂着恐惧的感觉涌了上来，他感觉自己都有些站不稳了。深呼吸几下后，他强迫自己冷静下来，对谢洛科夫命令道:“先让我看看。”\n\n拿起那个笔记本，仅仅是在粗略翻看了几眼之后，库兹涅佐夫便能够肯定，这份情报真实的可能性极高!他思索了一会，然后问道:“原件放在哪儿？”\n\n“在…在中央a区第三维修通道，左侧第七块活动地砖下面…用防水布包着…是一块芯片……那里面有所有您需要的……”他呜咽着，“拿走吧…求求您…把它拿走！我受不了了…为了这个破玩意，我每天晚上都在做噩梦…”那是他手下一个以为这些东西能够作为敲门砖让自己升官发财的蠢货在维护电路的时候偶然在省长办公室的独立通讯线路时截获的，随后那个蠢货居然就这么把那块里面记录着巨额非法资源交易、倒买倒卖的账单和意图贪污腐败的秘密指令的数据的芯片交给了他!毫无疑问，这里面的东西足以让几百个人掉脑袋，价值更是无可估量……但这烫手山芋对于他而言不是晋升的阶梯，而是催命的符咒。他既没有胆量用它来要挟任何人，也没有能力处理它，他只能像个抱着炸弹的傻子，日夜活在恐惧里。\n\n一时间，库茨涅佐夫竟有些恍惚。他想起谢洛科夫的个人档案上写着，他在战前只是鄂木斯克国立大学的一名电子工业专业的教授，而现在，他却被这个地狱般的地下世界变成了这个样子……\n\n不过，这些与现在的他无关。库兹涅佐夫对士兵使了个眼色，一人立刻转身离去。特派员看着瘫软如泥、几乎精神崩溃的谢洛科夫，他竭力告诉自己要冷静，要冷静。可当那漫长的40分钟过去，当士兵的核查结果无误后，他还是笑出了声。"
OMS_POSTNUKE.239.a: "“那个老家伙肯定想不到在这露馅儿了!”"
