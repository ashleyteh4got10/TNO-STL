OMS_game_begins_desc: "一场决定命运的斗争开始了。我们走出了地堡，试图重建家园，然而迎接我们的却是来自“反鄂木斯克联盟”的叛军。又或者说，第三次£smuta §f大动乱时代§!开始了。无论是我们的使命，还是世界的命运都将系于此。\n\n然而，这一次的情况比以往都不同。这一次的“大动乱时代”只有两个阵营：黑色联盟与叛军。与其说这是“大动乱时代”，倒不如说这是第二次俄国内战。但不同的是，这一次的战争将空前残酷，而我们已经做好了准备。一旦时机成熟，我们将再次夺回被核弹污染的土地，并剿灭叛军。"
OMS_a_letter_from_omsk: "来自鄂木斯克的电报"
OMS_a_letter_from_omsk_desc: "经过对敌我力量对比以及联盟剩余力量的评估，联盟中央得出了结论:目前，只要能够将散落在各地的联盟各部收拢，我们毫无疑问能够将敌人尽数消灭，无论是反动派还是德国的条顿蛮子，都将被我们踩在脚下。为此，尽快与各个军区沟通交流以统合当地的资源将是联盟当下最紧要的事务。同时也将是我们消灭一切匪帮以将条顿概念彻底化作历史前，大审判的主要方针。"
OMS_machine_in_kazak: "哈萨克的冷血机器"
OMS_machine_in_kazak_desc: "安德烈·马特维延科，我们的人。他已在哈萨克斯坦坚守命令数年之久，并真正抛弃了无用的事物，将效率贯彻于整个哈萨克之上。\n\n然而接连不断的核打击下，中亚地区的各个城市几乎完全被毁灭了，我们也迫于形势失去了对这里的控制。好在，当地联盟忠诚的骨干力量尚存，反动派不成气候，但安德烈·马特维延科手底下的军队仍然听从我们调遣。只需要中央发过去一道命令，我们就可以尝试着整合当地的资源，并且利用中亚的地缘优势尝试进一步扩张我们在全俄罗斯的影响力。"
OMS_mid_asia_reconstruction: "重建中亚"
OMS_mid_asia_reconstruction_desc: "根据侦察兵的报告，哈萨克南部地区还有着较为大型的工业设备残余。虽然战前在哈萨克建立的工业体系并没有遭到毁灭性打击，但是由于年久失修和其他各种原因，其依然需要大量时间来修复。此乃机遇，绝非厄运。\n\n我们将调动补给，指挥战士们前往哈萨克南部一探究竟，回收可用的工业资源，并确保我们在那里的统治——如果那里还有统治的需要。"
OMS_train_their_army: "训练中亚的部队"
OMS_train_their_army_desc: "哈萨克中央的部队似乎比我们更糟。他们的“部队”不可能有战斗力——如果那还能被称作部队的话。我们的士兵在革新后保持了战斗力，很显然他们没有。哈萨克的士兵们根本就是一群兵痞，腐败在军中横行却无人管理，工厂生产出的产品不知所踪，黑市大行其道...很显然，我们需要对哈萨克的部队进行大刀阔斧的改革，作为附带内容与对他们的考验，他们将要在中亚地区开展训练。"
OMS_kras_machine: "克拉斯诺亚尔斯克的将军"
OMS_kras_machine_desc: "亚历山大·萨哈罗夫斯基，联盟革新派中的领军人物，曾经在大考验之际与总司令同心同德，共谋大业——可以说没有他，黑色联盟绝对走不到今天。曾经，他负责带兵驻守克拉斯诺亚尔斯克，这一资源中心与铁路枢纽，在大审判来临时，当地的地堡体系也极好的发挥了作用，为我们保住了大量的宝贵的工业，人力和物资。\n\n然而化作废墟的地上世界不可避免的阻挠了我们与当地联盟势力进行交流，好在经过长时间的养精蓄锐，我们现在重新能够对当地进行有效的管辖，并以此为据点对周围的反动派进行清剿。"
OMS_go_west: "西进"
OMS_go_west_desc: "坎斯克作为一块拥有着大量自然资源，尤其是煤炭的宝地，大审判前就是我们重点经营的工业中心，即使核打击到来，我们在当地留下的一部分力量也坚定守卫着那里，现在，稍加修整，我们便可联系那边的旧部，重新控制坎斯克。\n\n同时，克孜勒作为俄罗斯与蒙古连接的重要通道，同时具备大量开发过的农业区域，其战略意义不言而喻，占据了这里意味着我们进可攻，退可守。来自中国西北部的潜在敌人的威胁便会大大降低，这里早已成为对共荣圈战斗的最前线，不仅以前是，现在是，以后仍然会是。因此，对于图瓦，我们势在必得。"
OMS_eternal_factory: "永恒的工厂"
OMS_eternal_factory_desc: "自芬布尔之冬（核冬天）伊始，米德加尔特（地球）就已经被淹没，地表也不再适合尼德霍格（人类）生存。于是，在克拉斯诺亚尔斯克，一群失去了指令的人们逐渐陷入癫狂。他们舍弃了情感——因为这对工作毫无作用；他们也舍弃了社交——因为这是非必要的活动；他们更舍弃了生命——因为他们不过是一群拥有生命的机械。\n\n他们唯一要做的就是在生产线上工作，\n只因他们已经舍弃了其他所有东西。"
OMS_rekindle_revolutionary_enthusiasm: "重燃革命热情"
OMS_rekindle_revolutionary_enthusiasm_desc: "在漫长的等待后，曾经在每个公民心中燃烧的革命热情已然熄灭。如今正当革命危难之时，他们却忘了我们为何而战。\n\n我们不为财富而战，更不为官名俸禄而战，\n我们为黑色联盟，为大审判而战。\n\n革命的烈火终将被点燃，束缚它，折磨它，将它焚骨成灰，抛撒入海！但它终将归来，并燃烧的无比炽烈。"
OMS_ural_devil: "乌拉尔的地狱"
OMS_ural_devil_desc: "乌拉尔山周边的许多富庶地区曾经是俄罗斯最令人向往的地方之一，尤其是南乌拉尔。在俄罗斯母亲尚被邪恶的军阀们割据蚕食的时候，这片土地饱经苦难——好在联盟拯救了她。我们将人们从李森科和迪尔旺加的手中解放了出来，并且将南乌拉尔打造成了大审判的重要据点。\n\n总司令曾经将这里作为预想的藏身地带，因此，联盟在这里布置了重兵，以及大量的物资。这使得我们能够以极大的优势重新掌控乌拉尔，一声令下，战争机器便将再度发动。"
OMS_calling_to_lazarenko: "与拉扎连科会面"
OMS_calling_to_lazarenko_desc: "拉扎连科曾驻守乌拉尔军区，负责整个乌拉尔山脉周边的统辖。但在热核战争后，由于种种原因，该地区的很大一部分落入反动派之手，不过乌拉尔军区依旧在南乌拉尔拥有绝对的控制力，掌控着宝山的他们的实力依旧不容小觑，我们可以以这里为基地进一步推进大审判。\n\n中央会把这位总司令的密友，联盟的骨干人物调任会鄂木斯克，另启一人负责乌拉尔地区的工作，毕竟他在中央职位所能发挥的作用比在地方上毫无疑问要大的多。"

OMS_sneak_attack_ural: "...并迅速突袭乌拉尔"
OMS_sneak_attack_ural_desc: "乌拉尔将会被黑色联盟中央管理局直接管辖。拉扎连科身上，有一点...“不稳定思想”。如果让他掌握南乌拉尔，有可能会造成难以预料的后果。一旦他举起了叛乱大旗，联盟顷刻间就会土崩瓦解。而他本人将会成为救赎旅的指挥官，我们宁可错杀一千，不能放过一个。\n\n我们已经输过一次了，不能再输掉第二次了。"
OMS_peace_annex_ural: "...并让他服从我们"
OMS_peace_annex_ural_desc: "指挥部的意见还是偏激了。拉扎连科是联盟的忠诚战士，他不可能会举起反叛大旗。即使他确实有一些逆反行为，但那也无关紧要。事到如今，我们必须集合一切力量以度过眼前的危机。我不仅不会直接突袭乌拉尔，还要向乌拉尔地区派遣支援。大敌当前，削弱自生力量无异于自杀！\n\n兄弟阋于墙，外御其侮。"
OMS_remember_the_moscowien: "铭记莫斯科的勇士"
OMS_remember_the_moscowien_desc: "在大审判的计划中，莫斯科是联盟必须夺回的城市。它是俄罗斯的心脏，是俄罗斯的象征之一，也是完成在大审判之后攻入德国境内，彻底杀光条顿佬的关键行动基地。为此，亚佐夫派出了他的心腹：叶夫根尼.萨温采夫作为集团军总司令，负责从德国人手中夺回，并保卫莫斯科的安全。在大审判成功之前，联盟收到的最后消息中，萨温采夫已经成功夺回了莫斯科，并向这一地区的俄罗斯部队下达了坚定保卫莫斯科的命令，但在全世界的死亡之潮降临之后，我们彻底丧失了与莫斯科的联系。\n\n经过难以计数的岁月，付出了无数牺牲之后，我们的部队终于穿越了沿线的死亡之地，到达了莫斯科。并得以与当地所剩不多的俄罗斯残部进建立联系。在这里，我们见证了对俄罗斯最后的忠诚：叶夫根尼.萨温采夫已在审判降临之时为保卫俄罗斯的人民而英勇牺牲。总司令已经下令：在接受莫斯科地区的所有俄罗斯余部的同时，我们也开展全境范围内的悼念仪式，铭记那些为国捐躯的烈士为俄罗斯的伟大事业所付出的牺牲。"
OMS_war_in_the_pocket: "口袋里的战争"
OMS_war_in_the_pocket_desc: "莫斯科自被£GFX_OMS_teutons_texticon §b条顿§!匪帮攻占以来，就一直是他们国内的'流放地'。那里被他们剥削的太深，太深了。昔日的克里姆林宫上的红星被替换成了他们邪恶的纳粹符号，人们被可恨的条顿人奴隶，过着猪狗不如的生活。\n\n大审判之后，莫斯科的地堡内没有什么光荣的部队，'大审判'也没有带来'黄金盛世'，带来的只有一群被战争摧残的战士，一地荒芜的废墟，一片被辐射污染的土地，和一个残破不堪的家园。\n\n§x我，何错之有！？§!\n\n是'大审判'的错吗？不，绝不可能，'大审判'绝不会错，这都是他妈的条顿人的错，都怪他妈的条顿人。\n\n§q但或许真的是大审判的错？不，这绝不可能。§!"
OMS_road_to_stalingrad: "通向伏尔加格勒之路"
OMS_road_to_stalingrad_desc: "我们尚且还没有与莫斯科的残部有直接的补给往来。为了驰援前线，我们将制定一个计划，其旨在突袭原伏尔加格勒地区，让莫斯科的残部直接与哈萨克地区建立陆路沟通，以为将来的大规模军事援助建立基础。\n\n同时，这里将成为我们包围叛军的重要节点，战争一触即发。"
OMS_soldiers_in_leningrad: "彼得格勒的战士们啊"
OMS_soldiers_in_leningrad_desc: "各位公民们，请听我说，尽管面临着无数损失，尽管面临着战争的惨败，但是！条顿已无可用之兵！他们没有军舰、没有武器更没有弹药！既知如此，我们为何还必须要向他们投降呢！\n\n各位国民们！我们绝不能信任那些软弱的叛军们。他们只懂得躲在和平主义的旗帜下苟且偷生，不懂得何为勇气与牺牲，我们绝对不能能把祖国的命运交给他们！\n\n请各位回想那只叫希特勒的臭虫在掌权时发表的傲慢宣言！他说条顿人是神所挑选的种族，而俄罗斯的人民则是古老的、缺乏觉醒意识的愚钝之人，所以古老的俄罗斯人必须服从条顿人的领导。没错，也许有些俄罗斯的投降主义者，苟且偷生的政客们的确符合他的描述，但是这并不代表他们所说的就是全部事实！\n\n......"
OMS_the_great_stall_had_end: "大停滞已经结束"
OMS_the_great_stall_had_end_desc: "......\n\n请大家想想看，德国距离我们如此遥远，他们躲在地堡之内，怎么可能了解我们的现况！ \n\n苏联的堕落腐败绝对不是来为德国的独裁寻找正当化的藉口。条顿人想在整个地球建立法西斯政权，我们绝对不能屈服他们！黑色联盟是真正以人权为重的政府，人类得以在核战争中幸存，也是归功于黑色联盟的公民的智慧。\n\n希特勒还说，要讨伐苏联的软弱与腐败，那么这就是残杀数亿无辜平民的理由吗，他这个恶魔有什么权力说这种话！ \n\n一个人杀害同类多达四十亿，这也能称之为正义吗？不！他不过是利用自然与正义的名义，来遂行他自己独裁的意愿罢了。\n\n条顿人还说，要将所有核弹投下地球，难道大家还要接着眼睁睁看他继续推广他的「正义」吗？当然不会！因为我相信，还有善良，不愿屈从条顿的国民，想要接着与敌人战斗下去！\n\n......"
OMS_but_the_great_trial_still_ongoing: "§x但大审判仍在进行！§!"
OMS_but_the_great_trial_still_ongoing_desc: "......\n\n听我说！条顿人的话不过是虚张声势。我今天有幸能由核打击下存活，我也看清了所谓“£GFX_OMS_teutons_texticon §q大日耳曼国§!”的现状。条顿之国的国民已经疲惫，国力已经衰微。阿道夫·希特勒和你的同僚们！如果你能再把核弹扔到地球上，那就来试试！你们的兵力，早已在第一次大审判中消耗殆尽。各位可明白，要训练出一个可用之兵，得花多少时间，条顿人当然也明白这一点。\n\n所以说叛军和条顿人也只不过是虚张声势，企图用几十亿人的死亡使黑色联盟屈服！但幸运的是，我们己经知道了真相，而我要再次重申一遍：条顿已无可用之兵！现在我们比任何时刻都无法动摇，数千年乃至万年历史的俄罗斯文明决不会向专制与独裁所屈服！我们必须站起来，做为一个统一的黑色联盟，击败条顿，赢得胜利！\n\n黑色联盟万岁！\n大审判万岁！\n\n十字军，前进！"
OMS_war_started: "战争开始"
OMS_war_started_desc: "我们的战士又一次踏上了征程。值此国家危难之际，我们将要进行一场总力战。这既是一场生存斗争，也是对我们的第二次大考验。\n\n然而时间实在太短，现在我们仅能扩大军队，并唤醒国民沉睡的战争精神。黑色联盟在数十年间进行的改革成效将于此显现，而敌人将会面对我们正义的铁锤。\n\n地球不是世外桃源，而是一场生存斗争。"
OMS_stockpile_in_bunker: "地堡内的库存"
OMS_stockpile_in_bunker_desc: "为了这场总体战。我们急需更多的装备和武器以支援前线的战事。我们拥有非常宽广的战线，但我们没有足够的军队去维持它。我们虽然有着足够的人力，但仅凭我们现有的库存是难以补齐恐怖的装备缺口的。不过我们非常幸运地控制了最大的原地堡网络，里面存储着十几年，甚至半个世纪以来的武器枪械。我们将把这些武器全部征集到军中以填补库存。"
OMS_enforce_control: "强化控制"
OMS_enforce_control_desc: "如同上一次大动乱一样，我们在数十年的沉寂后再次获得了广大的土地。于是，我们也遇到了与之前一样的问题——控制不足。国家机构在一些地方形同虚设，这对于总体战而言是不可容忍的——想一想，如果这些人都得到了妥善安置，那我们的战争实力将扩大多少倍！为了总体战，我们将迅速加强基层控制，确保联盟高效运转。"
OMS_every_possible_people: "所有可用之人"
OMS_every_possible_people_desc: "于是，我们可以再进一步了。在基层控制得到强化后，统计出的预备役人数达到了史无前例的高峰。每个人——是的，每个人都会在联盟中被最高效的利用。\n\n£GFX_OMS_dmitry_yazov_texticon §Y亚佐夫总司令§!已下令在控制区内搜寻可用人力，而我们忠诚的联盟士兵将迅速执行。"
OMS_new_army: "联盟的强壮军队"
OMS_new_army_desc: "欢呼吧！黑色联盟的军队已涅槃重生！黑色联盟的军队将再次如战神一般扫除一切敌人，这一切都得益于£GFX_OMS_dmitry_yazov_texticon §Y亚佐夫总司令§!的领导。\n\n我们的军队已经从战斗中成长起来，抛弃了过去几年间的陋习，成为了一支真正的，忠诚的军队。我们将忠诚的执行£GFX_OMS_dmitry_yazov_texticon §Y亚佐夫总司令§!的一切命令，绝不会再有反心。"
OMS_farmers_go_army: "农民们，参军去！"
OMS_farmers_go_army_desc: "看来，我们的人力仍然不够。自原子烈火将世界焚烧殆尽以后，人力就好似一把达摩克里斯之剑悬在头顶。如今，§x剑已落下§!。我们的战争潜力即将迎来极限...\n\n...倘若我们不进行下一步行动。哪怕在如此的窘境下，居然还有着一大批无用机构和干着多余事情的人，尤其以农民为典型。他们怎么敢的！？一场行动已迫在眉睫，战场需要他们。"
OMS_cut_the_bones: "去繁留简"
OMS_cut_the_bones_desc: "我们把那群该死的寄生虫除掉了，但这还不够。近期的检查让我们发现了更为恐怖的事情——哪怕是干所谓“实事”的官僚，也有一大批在空转。还是值此危难之际！有一大批人正在干的所谓“实事”根本上就是没有必要的。很快，它们就会被撤职，并扭送到救赎旅以儆效尤。\n\n联盟不需要这群无用的官僚。"
OMS_waking_the_tiger: "唤醒勇虎！"
OMS_waking_the_tiger_desc: "看来我们的行动颇有成效。在裁撤了一大部分无用机构后，不仅是人力，就连工业实力也获得了显著提升。那群中饱私囊的官僚们到底克扣了多少资源？\n\n不过那不重要了，随着工厂产能逐渐提高，源源不断的武器从流水线上下线。敌人将会被我们恐怖的工业产能压倒。"
OMS_enemys_doing: "敌人的行动"
OMS_enemys_doing_desc: "那群疯子又回来了。\n\n他们又要开始为了他们的\"大审判\"压榨俄罗斯人民了。曾经，我们是那么的愚蠢，以至于让那群疯子统一了俄罗斯，并被他们欺骗，利用，最终招致了如此结局。然而，我们不能让他们再次胜利。\n一场生死竞赛开始了。"
OMS_KMC_intelilgests: "阿尔汉格尔斯克的科学家"
OMS_KMC_intelilgests_desc: "阿尔汉格尔斯克，革命阵线曾经的首都。现如今，尤里·奥尔洛夫——一位伟大的科学家，与俄罗斯最后的知识分子，正龟缩于此。他们奉行着斯巴达式的生存纪律，试图延续文明的最后火种。\n\n但只要黑色联盟与他们的党羽一日存活着，他们的目的就一日不可能实现，他们会明白这个道理的。"
OMS_support_them_business: "支持他们的事业"
OMS_support_them_business_desc: "想要实验仪器？给！想要卢布？要多少我给多少！他们所拥有的知识在废土上是无价的，只要他们能与我们合作，要多少我们给多少！不仅如此，我们将会派出一些人员帮助他们训练部队，以确保我们最终能战胜黑色联盟。"
OMS_push_their_border_line: "扩展他们的边境"
OMS_push_their_border_line_desc: "阵线的管理人员是有限的。实话说，我们没有能力控制西俄罗斯和莫斯科的大部分领土，但我们更不可能拱手让人，让饱受废土荼毒的人民再度受到黑色联盟的侵害。\n我们只能将这些领土转交给这群知识分子了，祝他们好运。"
OMS_the_old_enemy: "旧日的死敌"
OMS_the_old_enemy_desc: "芬兰，哈，他妈的芬兰。这群畜生曾经在联盟最危急的时刻进攻联盟，招致了战败的厄运。十几二十年前，也是他们联合纳粹侵占了卡累利阿地区，他们毫无疑问就是他妈的纳粹帮凶，是他妈一群猪狗不如的畜生。\n\n但是我们真的没有办法了。毫无疑问鄂木斯克会进攻芬兰，而我们必须集结所有的友军展开最后的斗争，所以我们必须要和这群芬兰畜生合作，无论底下的人喜不喜欢，这就是最终决定。"
OMS_but_we_can_only_coop: "抛弃曾经的仇恨"
OMS_but_we_can_only_coop_desc: "好吧，好吧，好吧。我知道基层士兵听到这个消息都他妈想把我生吞活剥了。但我们确实和芬兰确定了合作关系，他们也愿意支援一些人来抵抗鄂木斯克。\n\n在这难得的喘息期间，我们终于可以夺取西俄地区广袤的国土，将他们纳入我们的保护之下了。那群芬兰佬的确是畜生，但起码还通点人性。"
OMS_oversea_loyalists: "海外的孤忠"
OMS_oversea_loyalists_desc: "与芬兰达成协定之后，我们得以联系到原波罗的海沿岸与白俄罗斯的势力。在那里或许有愿意与我们合作的人。如果真的有，那我们将协助他们，为反黑色联盟的战争开辟第二战线。"
OMS_anti_omsk_pact: "扩大反黑色联盟协定"
OMS_anti_omsk_pact_desc: "波罗的沿岸还有幸存者。他们是一群由瑞典人，芬兰人，挪威人，拉脱维亚人等等组成的一个势力。此情此景，与半个世纪前的西班牙内战如出一辙。当时也同样有一群来自世界各国的人，抱着同样的信念抛头颅，洒热血。\n\n对于这样一群纯粹的人，我们也将给予最大的敬意。我们将给出最大的诚意拉拢他们，他们不会拒绝的，因为他们深知拒绝的后果如何。"
OMS_old_wrrf_army: "旧日的友军"
OMS_old_wrrf_army_desc: "在莫斯科之外，原白俄罗斯与乌克兰的地区还有着我们的人。大名鼎鼎的阿赫洛梅耶夫将军正在那里与黑色联盟的残余势力斗争。我们必须要拉拢一下他，而且他也乐得重回革命阵线。\n\n更重要的一点是，他手底下有装甲师。"
OMS_union_forever: "联盟永存！"
OMS_union_forever_desc: "西线的事情结束了。红军已经得到了重生，我们终于有实力与黑色联盟一战了。我们将铭记苏维埃联盟的精神，铭记旧时代人们的希望，在新篇章开启之时，为地球消灭那恶贯满盈的鄂木斯克匪帮。"
OMS_meeting_with_YGR: "与无政府主义者会面"
OMS_meeting_with_YGR_desc: "曾经的沃尔库塔地区，现在被一群无政府主义者掌控着。他们就如同众多无政府主义实验者一样，在荒凉的俄罗斯大地上奉行着互助精神。\n\n然而这种情况不可能永久持续。终有一日——不是我们，就是黑色联盟的那帮畜生——就会打破这份平静。我们要迅速团结起他们，为我们未来在东线的其他行动打下基础。"
OMS_coop_like_1917: "再现1917"
OMS_coop_like_1917_desc: "苏俄内战期间，乌克兰的黑军曾为了打败白匪组建了统一阵线。现如今的情况远比当年严峻，一场决定人类未来的战争迫在眉睫，我们必须重现1917年的光景，再次组建一个泛左翼的统一战线。"
OMS_coop_like_1942: "再现1942"
OMS_coop_like_1942_desc: "卫国战争期间，德占区曾存在着大量无政府主义游击队，他们迟滞了德国的兵力，为我们的抵抗做出了重大贡献。现如今的情况远比当年严峻，一场决定人类未来的战争迫在眉睫，我们将重现1942年的光景，以大量物资支援他们，为反抗黑色联盟的战争做敌后作战的需要。"
OMS_YGR_frontier_to_OMS: "压缩黑色联盟的生存空间"
OMS_YGR_frontier_to_OMS_desc: "在联系够足够的力量之后，我们的行动也随之开始，在如今的土地上，所有的行动都需要依托地堡和生存聚集区活动。我们将在黑色联盟未能顾及到的地方，自北方南下夺取黑色联盟未能控制之地。除去地堡修建的区域外，一切未控制的地区都将归我们所有。"
OMS_TOM_artist_city: "艺术者城邦"
OMS_TOM_artist_city_desc: "尽管黑色联盟反复碾压着中西伯利亚的土地，但启蒙共和国的火种尚未熄灭。理性和科学的火焰依然在托木斯克燃烧，哲学家们仍然控制着那里。纵使现有情况已无法支撑沙龙的存在，他们仍然希望组建一个自由，平等，博爱的国度。我们将迅速伸出橄榄枝，防止这散发着理性的光芒熄灭。"
OMS_march_to_north_siberia: "向北西伯利亚进军"
OMS_march_to_north_siberia_desc: "北西伯利亚的广袤平原还有着些许幸存者，他们在那广阔的荒地上艰苦求生，我们不能看着他们在核废土上苦苦挣扎，我们将伸出援手救助他们。"
OMS_arm_against: "以力御敌"
OMS_arm_against_desc: "十字军们，准备好了吗！？一场盛大的远征即将开幕，而人类的命运将系于此。我们将为托木斯克的学者们训练一批现代十字军，他们以坦克替代盔甲，以发动机替代马匹，以燃油替代血液。托木斯克的十字军们将会冲向西方，对黑色联盟发起致命打击。"
OMS_far_eastern_army: "远东的军队"
OMS_far_eastern_army_desc: "贝加尔湖畔，旧黑色联盟的防化部队正栖息于那里。他们是一群真正的英雄，他们在如今的废土上积极救助民众。既不是为了意识形态，也不是为了'大审判'而服务，他们是为了俄罗斯人民的未来服务。如果我们能跟他们好好谈谈，或许也有可能拉拢他们到阵线当中？"
OMS_a_einheitfront: "一个统一战线"
OMS_a_einheitfront_desc: "他们同意了！在一番慎重考虑后，皮卡洛夫将军将加入我们的事业，反抗黑色联盟。东线的最后一颗棋子已经落下，一旦所有的事情结束，战争将立即开始，那将是新时代的第一场战争，也是旧时代的最后一场战争。"
OMS_hard_union: "一次绝望的合作"
OMS_hard_union_desc: "为了以防万一，我们也要动用一些...不那么体面的手段。黑色联盟曾经研发过LPC-70，这是一种...非常残忍的化学武器，但我们必须要用。既然伊尔库茨克的防化部队给了我们这些，那我们也就要好好利用它们。大敌当前，生死攸关。"
OMS_strike_attack_self: "闪电战"
OMS_strike_attack_other: "闪电战"
