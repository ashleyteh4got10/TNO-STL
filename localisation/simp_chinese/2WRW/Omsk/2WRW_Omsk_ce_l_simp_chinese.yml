OMSK_faction_omsk_leader_desc: "自上次世界大战之后，黑色联盟的核心部分——鄂木斯克城成为了他们事实上唯一能控制的地方。在不知多少年过去后，居住在地下的人们终于敢再度踏足地面，试图迎接“大审判”的终局。然而，他错了。在核废土之上，并不是只有斯拉夫人能够活下来，也并不是所有的斯拉夫人都追随着黑色联盟。于是，为了第二次£GFX_OMS_great_trial_texticon §x大审判§!，旧日黑色联盟的残部再度聚集起来，为了£GFX_OMS_great_trial_texticon §x大审判§!而团结在总司令周围。"
OMSK_faction_omsk_member_desc: "自上次世界大战之后，黑色联盟的核心部分——鄂木斯克城成为了黑色联盟的核心组织事实上唯一能控制的地方。然而，这并不意味着黑色联盟在其他地方就土崩瓦解了。这个势力就是如此。他们在黑色联盟的最后指令发出后忠实的执行着，直到下一条讯息发来。在不知多少年过去后，居住在地下的人们终于敢再度踏足地面，试图迎接“大审判”的终局。在核废土之上，并不是只有斯拉夫人能够活下来，也并不是所有的斯拉夫人都追随着黑色联盟。于是，为了第二次£GFX_OMS_great_trial_texticon §x大审判§!，旧日黑色联盟的残部再度聚集起来，为了£GFX_OMS_great_trial_texticon §x大审判§!而团结在总司令周围。"
ANTI_OMSK_faction_member_desc: "自上次世界大战之后，黑色联盟的核心部分——鄂木斯克城成为了黑色联盟的核心组织事实上唯一能控制的地方，而其余地方也有不少属于他们的残部。在不知多少年过去后，居住在地下的人们终于敢再度踏足地面，试图迎接“大审判”的终局。在核废土之上，并不是只有斯拉夫人能够活下来，也并不是所有的斯拉夫人都追随着黑色联盟。这个势力就是如此。他们对黑色联盟是如此的深恶痛绝，以至于他们抛弃了一切分歧，转而团结起来反对黑色联盟。"

