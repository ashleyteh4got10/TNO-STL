 postnuke_Situation_Overview_GUI_Bar_1_tt:0 "§G宣称点数§!£Antarctica_texticon_LEG §F是衡量某国对俄罗斯地区核废土主张的政治合法性的抽象量度，如果某军阀的合法性过低，那么它将无法进一步宣称其他领地。"
 postnuke_Situation_Overview_GUI_Bar_2_tt:0 "§R军事点数§! £Antarctica_texticon_MIL §F是衡量某国军事化的抽象量度。军事点数和一个国家的军事实力息息相关，其直接决定了该国的军事实力。如果领地的军事化水平过低，那么他们的土地就可能会被其他国家的军队轻易接管。"
 postnuke_Situation_Overview_GUI_Bar_3_tt:0 "§W补给§!£Antarctica_texticon_SUP §F代表某国的物资储备。如果领地补给过低，饥饿与严寒就可能会使该国彻底崩溃，并且也无力在未来的远征当中出力。§!\n§G宣称点数§!£Antarctica_texticon_LEG §F是衡量某国对俄罗斯地区核废土主张的政治合法性的抽象量度，如果某军阀的合法性过低，那么它将无法进一步宣称其他领地。\n§R军事点数§! £Antarctica_texticon_MIL §F是衡量某国军事化的抽象量度。军事点数和一个国家的军事实力息息相关，其直接决定了该国的军事实力。如果领地的军事化水平过低，那么他们就无法进一步扩张自身的军事实力。"
