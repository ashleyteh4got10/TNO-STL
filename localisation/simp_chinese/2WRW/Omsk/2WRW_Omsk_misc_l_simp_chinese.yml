 eye_of_yazov:0 "亚佐夫之眼"
 eye_of_yazov_desc:0 ""
 OMS_operation_alekseyev_category:0 "阿列克谢耶夫行动"
 OMS_operation_alekseyev_category_desc:0 "尽管此举会分散我们对§R大审判§!的专注，但在满洲仍有俄罗斯同胞生活在日本的占领之下。必须将他们重新置于俄罗斯的正当管辖之下，以便他们能在打倒西方野兽的斗争中贡献自己的一份力量。每个人都必须各司其职。他们先辈对国家职责的玩忽，绝不能成为借口。\n\n行动计划相当简单。我们必须攻占指定的区域，并坚守阵地，以抵御敌人不可避免的反扑。我们可以拨出一批短期的额外补给，以加强我们在该地区的军事行动，但仅此而已不能再多。所有资源最终都将投入到§R大审判§!本身。"
 OMS_attack_manchuria:0 "开始行动"
 OMS_attack_manchuria_desc:0 "§R远东地区气候严寒，地形险恶。此战绝非易事，务必做好万全准备。§!"
 OMS_skirmish_buff:0 "增援作战指令"
 OMS_skirmish_buff_desc:0 "将调拨更多资源增援\"阿列克谢耶夫行动\"。§R我们已无法提供更多支援，一切必须优先保障\"大审判\"之需。§!"
 operation_alekseyev_cooldown:0 "§$阿列克谢耶夫行动§!：满洲国增援部队正在途中"
 operation_alekseyev_cooldown_desc:0 "\n§$阿列克谢耶夫行动§!：满洲国增援部队正在途中"
 OMS_manchuria_buff:0 "增援行动"
 OMS_manchuria_buff_desc:0 "远东边境当前的行动已得到增援。"
 OMS_2WRW_great_trial_category:0 "大审判"
 OMS_great_trial_desc:0 "我们所准备的时刻终于到来，我们将踏上§x大审判§!的征途，一举粉碎条顿凶兽。然则时不我待，旷日持久的冲突将使§x我们的社会不堪重负§!。若我们的人民有所动摇，我们将不得不采取§x极端措施§!，以确保我们对可憎的哥特人取得最终胜利。"
 OMS_great_trial_offensive_momentum_desc:0 "随着每一次战略胜利，黑色联盟在向§x日耳曼尼亚§!进军的过程中愈发强大，朝着最终胜利前进。然而，倘若我们被迫退回国家战略工事，后果将极为§x严重§!。"
