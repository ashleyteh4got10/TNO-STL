 OMS_post_nuke_1_tt:0 "§V条顿匪帮已然败北。§!"
 OMS_post_nuke_2_tt:0 "§V人于同胞，皆为豺狼。§!"
 OMS_post_nuke_3_tt:0 "§V他们遣子弟奔赴战场；\n然无一生还返家乡；\n当家人翘首以盼英雄归，\n捧回的不过是冰冷的骨灰坛。§!"
