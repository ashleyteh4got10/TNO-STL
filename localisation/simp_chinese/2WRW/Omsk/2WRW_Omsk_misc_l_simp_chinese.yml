 OMS_we_stand_at_the_precipice_of_our_final_war:0 "我们正进行着 £GFX_OMS_great_trial_texticon 反抗 £GFX_OMS_teutons_texticon §q德国§!的§x最后一战§!, 尽管必须做一些必要准备..."
 OMS_rapidly_escalate_arsenal_of_vengeance:0 "我们将会迅速升级我们的£GFX_OMS_chemical_weapons_texticon §K复仇之城§!...\n化学武器GUI将无法访问！"
 OMS_any_means_necessary:0 "£GFX_OMS_black_league_texticon §s黑色联盟§!将会使用任何必要行动反抗来自£GFX_OMS_teutons_texticon §q条顿蛮子§!的威胁。虽然有些人没胃口......"
 OMS_posturing_might:0 "£GFX_OMS_black_league_texticon §s俄罗斯救赎军§!将会在£GFX_OMS_great_trial_texticon §x大审判§!前最后一次展示自己的实力。"
 OMS_our_agents:0 "我们在莫斯科维恩的代理人将会展开§R切尔诺伯格行动§!。"
 OMS_chemical_weapons_gui_enabled_tooltip:0 "我们将建造一个能够§R永远埋葬条顿人威胁§!的£GFX_OMS_nuclear 军火库..."
 OMS_the_time_is_now:0 "§R终于，随着我们开启大审判，德国将被从地球上彻底抹去！§!"
 OMS_activate_weapons:0 "§R生化武器将会在开战时全面使用！§!"
 OMS_100_readiness_needed:0 "§Y 100 §! 准备度"
 OMS_in_bobrikov_footsteps_tt:0 "我们终将在适当的时候消解芬兰这一概念。待主体工程完成后，芬兰将再次成为§R俄罗斯核心领土的一部分。§!\n与此同时，我们可以预见，我国的基础设施将承受显著压力。"
 OMS_chemical_warfare_dynmod:0 "§R生化战 §!"
 OMS_chemical_warfare_dynmod_desc:0 "大审判已然开启，黑色联盟已发起首轮攻势。通过大规模轰炸行动，我国各城市及前线已被大量投放化学武器。其影响正持续削弱我国国力，并严重损害我们抵御其侵略的能力。\n\n他们的武器不分军民。我们每有一名士兵被杀，就会有同样数量的平民丧生。黑色联盟早已为这场战争定下基调：\n\n§R此乃灭绝之战。§!"
 OMS_biologic_warfare_dynmod:0 "§R生物战§!"
 OMS_biologic_warfare_dynmod_desc:0 "大审判已然开启，黑色联盟已发起首轮攻势。通过大规模轰炸行动，我国各城市及前线已被大量投放生物武器。其影响正持续削弱我国国力，并严重损害我们抵御其侵略的能力。\n\n他们的武器不分军民。我们每有一名士兵被杀，就会有同样数量的平民丧生。黑色联盟早已为这场战争定下基调：\n\n§R此乃灭绝之战。§!"
 GER_biologic_warfare_dynmod:0 "§R生物战§!"
 GER_biologic_warfare_dynmod_desc:0 "大审判已然开启，黑色联盟已发起首轮攻势。通过大规模轰炸行动，我国各城市及前线已被大量投放生物武器。其影响正持续削弱我国国力，并严重损害我们抵御其侵略的能力。\n\n他们的武器不分军民。我们每有一名士兵被杀，就会有同样数量的平民丧生。黑色联盟早已为这场战争定下基调：\n\n§R此乃灭绝之战。§!"
 2WRW_collateral_damage_dynmod:0 "§R附带损害§!"
 2WRW_collateral_damage_dynmod_desc:0 "大审判已然开启，我们部署的武器在削弱条顿人的防御体系上已取得空前战果。他们的补给线彻底瘫痪，城市陷入混乱，前线部队甚至无法组织起有效防御。然而，我们的国土也受到了波及。\n\n我们投放的武器开始反噬我们的士兵。其杀伤力远超预期，现有防化防生装备根本无法处理。这些武器已经导致前线士兵出现伤亡，部分城市更是爆发疫病。但即便如此......\n\n......§R为了大审判，任何代价都不为过。§!"
