 OMS_cull_the_officer_corps:0 "军官团精简化"
 OMS_cull_the_officer_corps_desc:0 "在大审判前夕的最后时日，对我国军队的严格审查表明：叛徒及其可鄙的\"道德观\"已如蛀虫般渗透祖国每道裂缝，持续破坏黑色联盟的战争伟业。\n\n我们绝不容忍腐朽思想在军中滋生蔓延。凡不愿全力以赴执行任务者，必须§R滚出他的职位§R。"
 OMS_cull_the_officer_corps_2:0 "军官团精简化"
 OMS_cull_the_officer_corps_2_desc:0 "在大审判前夕的最后时日，对我国军队的严格审查表明：叛徒及其可鄙的\"道德观\"已如蛀虫般渗透祖国每道裂缝，持续破坏黑色联盟的战争伟业。\n\n我们绝不容忍腐朽思想在军中滋生蔓延。凡不愿全力以赴执行任务者，必须§R滚出他的职位§R。"
 OMS_every_waking_moment:0 "不舍昼夜"
 OMS_every_waking_moment_desc:0 "大审判要求我们毫无保留地奉献一切，将俄罗斯的举国之力倾泻于大日耳曼国之上。黑色联盟这台战争机器中的每一个齿轮，都将推动复仇伟业的进程。\n\n俄罗斯的子民毫无喘息之机——无论是在工厂车间、集体农庄，还是在血腥战场上。每一位为祖国献出生命的男女老幼，都必须有无数人前赴后继地填补其岗位。为了复仇，我们不惜任何代价。"
 OMS_march_to_midnight:0 "向午夜进军"
 OMS_march_to_midnight_desc:0 "德国人及其卑劣种族的平静生活的终末之日正急速逼近。为此，俄罗斯国民军必须时刻准备进军——以雷霆之势长驱直入，将地狱倾泻至大日耳曼国。\n\n如此大规模的协同进攻绝不能临时筹备。俄罗斯的战士们正从联盟边境召回，响应讨伐日耳曼蛮子的命运召唤，随时准备实施复仇。"
 OMS_pure_black_doctrine:0 "纯黑教典"
 OMS_pure_black_doctrine_desc:0 "红军曾背负着深重的疮痍：武器匮乏、指挥混乱、装备陈旧。然最触目惊心者，莫过于那些粗劣筹划与拙劣执行的战术——苏芬战争首现其弊，数十万骸骨仅换得一片弹丸之地；及至德意志战端，半壁山河倾覆之际，更多忠魂葬身焦土...此乃永恒耻辱。\n\n永不复辙。\n\n黑色联盟的战略家们已彻夜推演沙盘，熔铸了统一战争之血训与对外战例之精粹，将俄罗斯国家军重塑为脱胎换骨的钢铁之拳。而今这支军队拥有淬炼锋芒的新型装备、由强烈的复仇意志灌注的黑联血脉、严阵以待的百万雄师，他们誓要一举碾碎条顿毒患，将大审判的最终章刻进宿敌的坟冢之上。"
