 infantry_equipment_chemical:0 "生化核放防御部队"
 infantry_equipment_chemical_0:0 "LPC-70"
 infantry_equipment_chemical_0_desc:0 "轻型步兵化学喷射器是由黑色联盟科学家研发的武器，旨在让未来收复战争的士兵能随时动用复仇武器库，对付任何胆敢抵抗之敌。该武器会向目标喷射致命化学药剂，其腐蚀性强到足以溶解战场上大部分轻型掩体，并残留剧毒气云。虽然使用时需配备重型防护装备，但其坚固设计确保了使用者极高的安全性。该武器对使用者异常安全。被编为“化学复仇军团”的黑色联盟小队通常配备六台化学喷射器，其余队员则操作轻机枪为推进提供火力掩护。作为突击步兵武器，其威力极为恐怖。获准使用该武器（及配套防护装备）被视为授予勇猛士兵的荣誉勋章，但其笨重体型与短射程特性使其在防御战中远不如常规步兵武器实用。每当化学复仇部队出动时，战场指挥官必须确保周边所有常规士兵至少配备最基本的野战防护服，以避免非必要伤亡。因此，黑手军官只需威胁将违纪士兵编入化学复仇军团的惩戒支援步兵，就足以让最桀骜不驯的士兵乖乖归队。"
 OMS_their_fatherlands_wealth:0 "以他们父国之财富"
 OMS_the_great_trial_6:0 "§R大审判§!"
 OMS_the_great_trial_6_desc:0 "时候到了。我们唯一的使命，俄罗斯及其人民历史上决定性的时刻，已经到来。我们已准备多年，将我们国家的心脏与灵魂锤炼成一台能够最终终结条顿匪帮的机器。数百万人在工业的钢铁动脉中辛勤劳作，更有数百万大军向着我们昔日的腹地挺进，最终为那数不尽的被屠戮的同胞复仇雪恨。\n\n§R大审判，已然开始。§!"
 OMS_the_great_trial_7:0 "§R大审判§!"
 OMS_the_great_trial_7_desc:0 "时候到了。我们唯一的使命，俄罗斯及其人民历史上决定性的时刻，已经到来。我们已准备多年，将我们国家的心脏与灵魂锤炼成一台能够最终终结条顿匪帮的机器。数百万人在工业的钢铁动脉中辛勤劳作，更有数百万大军向着我们昔日的腹地挺进，最终为那数不尽的被屠戮的同胞复仇雪恨。\n\n§R大审判，已然开始。§!"
 OMS_sending_them_gifts:0 "§W我们将会给那群§!§q条顿人§!§W一点§!§R礼物§!。"
 OMS_yazov_leader:0 "将亚佐夫设为领导人"
 OMS_lock_down_the_east_tt:0 "我们将会巩固与共荣圈的边境，以确保他们再不能威胁俄罗斯母亲的安全。"
 SWRW_OMS_the_eastern_redoubt_category:0 "东线铁壁"
 SWRW_OMS_the_eastern_redoubt_category_desc:0 "正如1853年时那样，当俄罗斯为世界伸张正义之时，所有敌对势力间的仇怨都将烟消云散——这丝毫不令人意外。自我们启动§R大审判§!以向德意志的罪犯及其帮凶实施最终清算起，华盛顿与东京的腐朽败类便已磨利爪牙，妄图驰援纳粹政权。\n\n然而多亏了“黑手”的努力，我们获得了充足时间让每位俄罗斯公民为应对迫近的威胁履行义务。防线将筑就，间谍将肃清，新兵将入伍。若东部防线失守，核报复将降临那些企图阻挠§R大审判§!的国度本土。\n\n须知§e凡与我为敌者，必如其所庇护的条顿人般灭亡§!。"
 SWRW_OMS_declare_war_eastern_retribution:0 "宣告东方讨伐之战"
 SWRW_OMS_declare_war_eastern_retribution_desc:0 "日本及其附庸之所以胆敢进犯，是因为他们认为我们软弱。这是个致命的错误，也将是他们最后一次犯错。我们将尽歼来犯之敌，最终为他们对俄罗斯民族犯下的累累罪行伸张正义。"
 SWRW_OMS_create_black_guard:0 "Create The Black Guard"
 SWRW_OMS_create_black_guard_desc:0 "随着西伯利亚战争威胁的逼近，我们必须争分夺秒在远东地区增派兵力。总司令决意组建新的人民志愿军，他们将英勇保卫祖国，抵御任何敌人的入侵。"
 SWRW_OMS_create_black_guard2:0 "紧急黑卫军志愿者招募"
 SWRW_OMS_create_black_guard2_desc:0 "随着俄罗斯的敌人们正在集结力量，我们必须扩大东部防御部队的规模，但同时绝不能影响到对德国的§R大审判§!的进程。尽管他们只会接受最基本的训练，但这些士兵将自豪地为祖国效力，并勇敢地支援更有经验的战友们抵御敌人。"
 SWRW_OMS_create_black_guard3:0 "最终的黑卫军志愿者招募"
 SWRW_OMS_create_black_guard3_desc:0 "We'll bring forth one last batch of hastily trained soldiers from Siberia to aid us in the final victory in our §RGreat Trial§. Their patriotic duty will be to hold the line against the invaders so that we can bring about our final retribution against the hated Teuton!"
 SWRW_OMS_create_black_planes:0 "Establish the Siberian Strategic Defense Grid"
 SWRW_OMS_create_black_planes_desc:0 "We are very likely to face significant challenges from both the IJAAS and USAF in case war breaks out in Siberia as well as many other sophisticated forces of our enemy. It's therefore vital that we deploy additional engineers to the east to build strategic defenses against any invading force."
 SWRW_OMS_eastern_radar:0 "Establish the Black Guard Aviation Corps "
 SWRW_OMS_eastern_radar_desc:0 "We have large stockpiles of planes from the years of the Smuta that are mothballed in our armories. With the looming Japanese aggression, it might be prudent to refurbish some of these and bring these planes back in a defensive capacity. While they cannot defeat the USAF and IJAAS, they can support our defensive operations in Siberia under the cover of friendly AA."
