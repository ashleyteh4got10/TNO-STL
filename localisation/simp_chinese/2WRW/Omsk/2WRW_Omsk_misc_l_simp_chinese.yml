 OMS_apocalypse_proofing:0 "启示录试验"
 OMS_apocalypse_proofing_desc:0 "我们意图发动一场旨在消灭敌人而非自我的战争。俄罗斯所有关键基础设施都将部分或全部建于地下，旨在确保在核武器袭击后仍能运作。这将增加建设成本，但能确保我们的人民熬过§R大审判§!，并在任务完成后继承这片土地。一旦敌人胆敢袭击俄罗斯祖国，我军士兵可充分利用这些地下掩体与隧道作为防护。"
 OMS_vengeance_against_the_occupant_1:0 "向占领者复仇"
 OMS_vengeance_against_the_occupant_1_desc:0 "我们对敌人的仇恨是极致的仇恨，无人能够奢望抵挡。当我们解放更多神圣的故土，并最终将敌人肮脏的巢穴夷为平地之时，任何胆敢阻挠我们的人，都将§R遭受比死亡更悲惨的命运§!。"
 OMS_vengeance_against_the_occupant_2:0 "向占领者复仇"
 OMS_vengeance_against_the_occupant_2_desc:0 "我们对敌人的仇恨是极致的仇恨，无人能够奢望抵挡。当我们解放更多神圣的故土，并最终将敌人肮脏的巢穴夷为平地之时，任何胆敢阻挠我们的人，都将§R遭受比死亡更悲惨的命运§!。"
