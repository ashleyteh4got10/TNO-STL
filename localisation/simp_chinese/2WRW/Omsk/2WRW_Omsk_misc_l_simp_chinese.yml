l_simp_chinese:
 OMS_Separate_The_Wheat_From_The_Chaff_idea:0 "去芜存菁"
 OMS_Separate_The_Wheat_From_The_Chaff_idea_desc:0 "抗击条顿威胁的战争，要求俄罗斯最强大、最纯粹的个体为俄罗斯救赎军效力。\n\n救赎军绝不容忍任何背信弃义、庸碌无能之徒滋生蔓延，凡侵蚀神圣事业之军战术敏锐之毒瘤，必以军法利刃彻底剜除。令出法随，绝无宽宥！"
 OMS_the_men_in_the_factories_idea:0 "工厂里的人手"
 OMS_the_men_in_the_factories_idea_desc:0 "所有囚禁在牢房中的败类都背负着未偿的孽债，他们理应为此付出代价——这是天经地义的报应。他们每个人都会被押上工厂流水线，绝无例外可言，罪犯没有特权可享。"
 OMS_the_men_in_the_front:0 "先登勇士"
 OMS_the_men_in_the_front_desc:0 "为保卫祖国免受祸患荼毒，必须在全俄实行更严苛的征兵手段。动员并训练所有适龄男女参战，这是纯粹而必要的义务，更是不可或缺的职责。"
 OMS_agency:0 "整改情报机关"
 OMS_agency_2:0 "观察统计局"
 OMS_agency_3:0 "国际威胁"
 OMS_the_great_trial:0 "§R大审判§!"
 OMS_the_great_trial_desc:0 "时候到了。我们唯一的使命，俄罗斯及其人民历史上决定性的时刻，已经到来。我们已准备多年，将我们国家的心脏与灵魂锤炼成一台能够最终终结条顿匪帮的机器。数百万人在工业的钢铁动脉中辛勤劳作，更有数百万大军向着我们昔日的腹地挺进，最终为那数不尽的被屠戮的同胞复仇雪恨。\n\n§R大审判，已然开始。§!"
 OMS_the_great_trial_2:0 "§R大审判§!"
 OMS_the_great_trial_2_desc:0 "时候到了。我们唯一的使命，俄罗斯及其人民历史上决定性的时刻，已经到来。我们已准备多年，将我们国家的心脏与灵魂锤炼成一台能够最终终结条顿匪帮的机器。数百万人在工业的钢铁动脉中辛勤劳作，更有数百万大军向着我们昔日的腹地挺进，最终为那数不尽的被屠戮的同胞复仇雪恨。\n\n§R大审判，已然开始。§!"
