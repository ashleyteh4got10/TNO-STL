 OMS_post_nuke_5_tt:0 "§M希望§!§Y，从不畏惧。§!\n§M希望§!§Y，纵使身处万丈深渊，亦敢悄然绽放。§!\n§M希望§!§Y，暗中滋养应许，并使其愈发坚定。§!"
 OMS_post_nuke_6_tt:0 "§V为战争而生的经济，终究无法承受战争的恶果。§!"
 OMS_post_nuke_7_tt:0 "§V昔日西征之师，如今反为罪孽所侵。§!"
 OMS_post_nuke_8_tt:0 "§Y我们§V战胜§!，我们§V咆哮§!，我们§z凯旋§!，我们§q沉默§!§!。"
 OMS_post_nuke_9_tt:0 "§V人类的罪孽，在于妄图倾覆自然。§!"
 OMS_post_nuke_10_tt:0 "§V纵使如此，§K大地§!仍将旋转，§f太阳§!仍将照耀。§!"
 OMS_post_nuke_11_tt:0 "§V他们依旧追捕着我。而我，甘愿被这梦魇永远纠缠。§!"
 OMS_post_nuke_final_tt:0 "§V我别无所求，了无所惧，孑然一身，得以自在。§!"
