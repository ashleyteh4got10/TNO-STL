 OMS_Focus_72_OMS:0 "迈向子夜"
 OMS_Focus_73_OMS:0 "不舍昼夜"
 OMS_Focus_74_OMS:0 "天罚降临"
 OMS_All_Shall_Bear_The_Weight_Of_The_World_desc:0 "自原初审判以来，我们的文化饱经磨难与衰败。西方野蛮的£GFX_OMS_teutons_texticon §q条顿人§!、中亚幼稚的哈萨克人，以及远东诡诈的日本人，都曾践踏并玷污过它。但在这片混沌之中，一个更强大的新俄罗斯已然崛起，必将让俄罗斯文化达到前所未有的高度。\n\n俄罗斯文化已开始蜕变为一支坚不可摧的力量——只为复仇而生的力量，这股浪潮正在广袤大地上蔓延。我们必须维持这一进程，鞭策、驱使并引领俄罗斯民族化作冰冷无情的复仇之师，成为条顿人的末日。俄罗斯巨熊曾陷入沉睡几近灭亡，但如今它的咆哮将§R响彻寰宇§!，让人们对我们的力量产生最纯粹的恐惧！俄罗斯正在前进，先南下，再西征，直至完成它最终的使命......"
 OMS_blacking_out_the_rising_sun:0 "封锁西部"
 OMS_blacking_out_the_rising_sun_desc:0 "我们对日本人已经太过仁慈了。他们参与了对原初审判的破坏，还夺走了俄罗斯的神圣领土，将其并入那个被称为“满洲国”的可悲动荡之地。尽管已拟定武力夺回我国领土和海参崴港口的作战计划，但我们不能陷入与日本帝国的全面冲突——那只会让我们从更重要的西方事务中分心。\n\n然而我们也不能放任东方门户洞开，以防日本人心怀不轨。在§x大审判§!进行期间，必须全面封锁、巩固并严防东部防线，震慑日本人的任何企图。我们将终止对整个“共荣圈”的依赖关系和贸易往来，从现在起，黑色联盟将镇守东方……而将所有其他力量调往西线。"
 OMS_stronghand_the_americans:0 "美国人的大手"
 OMS_stronghand_the_americans_desc:0 "尽管我们与§M美国人§!的看法大相径庭，但我们终究有着共同的敌人——§q德国§!与§V日本§!。§V日本§!在20世纪40年代从背后捅了我们一刀，虽然他们并非我们的主要威胁，但他们是§q德国§!的历史盟友。§V日本§!在远东拥有惊人的影响力，这很可能是因为马加丹和阿穆尔的叛徒与他们同流合污，因此，他们企图将我们拉入其§V势力范围§!的可能性只增不减，所以与§M美国人§!结盟是自然而然的反制措施。\n\n说到底，§M美国人§!非常愿意支持我们，因为他们自己也憎恨§q德国人§!，但他们不像我们这样致力于彻底摧毁他们。我们已经从历史中吸取了教训，你不可能靠谴责就把某人赶出窗外。"
 OMS_production_for_promises:0 "为承诺而生产"
 OMS_production_for_promises_desc:0 "美国的财富规模及其能为联盟提供的资源几乎无法估量，但其影响力已遍及全球。从美洲的经济核心向外延伸，其资本充盈着全球外围市场——当然排除了那些与美国利益不同步的国家，其中自然包含数十年来属于我们势力范围的地区。\n\n然而今日，我们在从日本手中收回我们正当的东方领土以及摧毁西部法西斯帝国宿敌方面存在共同利益。无论大审判将给我们的关系带来何种变化，当下我们仍立场一致，彼此利益相通。来自天真美国人的投资恰可润滑我国体制的运转机制，并为促成大审判的最终实现提供所需资金。"
 OMS_show_the_world_japans_crimes:0 "揭露日本的罪行"
 OMS_show_the_world_japans_crimes_desc:0 "自日寇离其巢穴以来，所犯暴行罄竹难书。其野蛮之众肆虐亚洲，所施反人道恶行仅次于德国。南京、硫磺岛、四川，乃至近日之海参崴——日寇屡屡显露其徒劳暴虐的本性。\n\n我辈才华横溢的宣传家们，手握无数骇人听闻的暴行实录，此皆可化为利器昭示天下。不日，举世必将同仇敌忾，与我俄罗斯共憎此倭族。届时，定无人还敢阻拦我们收复旭日恶徒窃据的故土。"
 OMS_operation_alekseyev:0 "阿列克谢耶夫行动"
 OMS_operation_alekseyev_desc:0 "日本人躲在他们官僚主义的壁垒和堆积如山的掠夺财富之后已经太久了。他们的坦克、他们的士兵、他们的意志和他们的荣誉被粉碎的时刻已经到来。我们将刺穿他们薄弱的防线，压倒每一个哨兵，在他们集结起任何微不足道的防御之前，抵达我们合法的符拉迪沃斯托克。\n\n对于我们伟大神圣的俄罗斯的敌人，绝不留情，绝不姑息，绝不容忍任何抵抗。我们的队伍中绝不容许异议，最重要的是，没有任何事物能够阻止我们恢复俄罗斯母亲的天然疆界。所有挡路者都将灭亡，而在他们的废墟之上，一个崭新的、强大而完整的俄罗斯将会崛起。"
 OMS_deport_the_collaborators:0 "驱逐合作者"
 OMS_deport_the_collaborators_desc:0 "在日本对俄罗斯土地长达四十年的艰难占领期间，出现了一个由通敌叛徒组成的网络，他们像腐败一样渗入社会，为了个人贪婪或妄图阻止占领者进一步报复的痴心妄想而出卖了人民的利益。\n\n随着£GFX_OMS_black_league_texticon §s黑色联盟§!的铁拳再次掌控外东北，我们正有机会纠正这些罪恶。如果这些祖国的叛徒如此迫切地希望生活在日本人的铁蹄之下，我们将很乐意满足他们。当地卫戍部队将被派往已知通敌者的家中，为他们及其家人提供前往日本边境的“运输服务”。他们背叛了自己的家园，如今，他们唯一该去的地方就是他们野蛮的主子那里。"
 OMS_the_infantile_kazakhs:0 "幼稚的哈萨克人"
 OMS_the_infantile_kazakhs_desc:0 "中亚的哈萨克与土库曼民族，在独立之后，其忠诚已然沦丧。他们堕落为未开化的蛮族，沦为只知追逐金钱的野蛮之众；有人仍死守着布哈林体制那套腐朽可憎的信条，更有人效仿条顿之患。他们丧失了人格的尊严，背弃了世间一切正义与真理。\n\n此等乱象必须终结。我们将摧毁这些可笑的、“民族”的虚伪仿制品，终结其掠夺与征服的腐败体系，绝不容许这些部落般的群体继续侵扰我南方疆土。然而，此举另有深意：靠近德国边境的草原，或许将成为我们的战略要地……"
 OMS_pro_russian_propaganda:0 "开展亲俄宣传"
 OMS_pro_russian_propaganda_desc:0 "哈萨克斯坦的征服已成定局，我们将向世人证明，在我们的治下，平民的生活将得到改善。只要他们忠于联盟，成为我们事业中坚强而忠诚的一员，融入£GFX_OMS_black_league_texticon §s黑色联盟§!，他们必将获得伟大和财富。而最重要的是，他们§R最终将摧毁那些曾经摧毁他们的力量§!。\n\n当我们的宣传席卷整个哈萨克“诸国”时，他们将不再效忠于中亚那些微不足道的封建领地。不，他们将成群结队地投奔我们的旗帜，无论这是否真正对他们有益。"
 OMS_quell_central_asian_nationalism:0 "清除中亚民族主义"
 OMS_quell_central_asian_nationalism_desc:0 "虽然某些人可能会完全信奉我们的理念和狂热民族主义，但哈萨克草原上的多数人仍将拒绝我们的“绝对真理”。但这无关紧要。我们将大规模派遣密探和军警部队，消灭任何反对£GFX_OMS_dmitry_yazov_texticon §Y亚佐夫§!意志的异见，防范南方任何可能的潜在叛乱。\n\n通过征服哈萨克人，俄罗斯人将在南方获得一片自由的南部边疆，无论是通过强制迁移还是民族布局调整。随着俄罗斯民族的扩张，这里将成为第二故乡，第二个伟大的俄罗斯疆土，永远不会再沦陷于蛮族之手。"
 OMS_a_flurry_of_armour:0 "战车出动"
 OMS_a_flurry_of_armour_desc:0 "即便在此刻，前俄属突厥斯坦仍有人反对我们的统治。众多马背匪帮在哈萨克斯坦辽阔的草原上流窜，以为能逃过我们的追捕。真是幼稚。这类策略只对那些落后的军队有效，而重生的俄罗斯祖国，在在她最忠诚且深爱的儿子——全俄£GFX_OMS_black_league_texticon §s黑色联盟§!的振兴下，可不是这种对手。\n\n哈萨克斯坦的每一寸土地都将肃清异见分子。我们将为装甲部队提供实战训练机会，让他们能在辽阔草原上对抗德国人时加以运用。\n\n包括实弹演练。"
 OMS_silence_the_steppes:0 "暴力行径……"
 OMS_silence_the_steppes_desc:0 "历史上，哈萨克民族大体上一直支持俄罗斯。自俄属突厥斯坦建立以来，他们在多场战争中与俄并肩作战，鲜有反俄情绪。这个民族仍然有挽救的可能。就像我们俄罗斯人一样，阻碍哈萨克人走向相同命运的不过是哈萨克社会中一小撮颠覆性、反叛的少数群体。要纠正这一错误，唯有消灭我们的敌人，帮助我们真正的朋友。"
 OMS_brought_by_noncompliance:0 "……源于抗命之举"
 OMS_brought_by_noncompliance_desc:0 "然而这绝非意味着哈萨克斯坦毫无过错。自苏联解体以来，哈萨克斯坦与其他中亚地区的加盟共和国通过了一系列反俄法案，企图削弱我们俄罗斯人在中亚的影响力——这影响力是我们的先辈几个世纪前辛勤努力的结果。这些人显然已忘记是谁带领他们摆脱贫困、建立有序城市，是谁教会他们读书写字，又是谁提供了此刻正用于屠杀我国同胞的武器。这种行为必须立刻得到纠正！"
 OMS_a_war_for_national_reclamation:0 "救赎之战"
 OMS_a_war_for_national_reclamation_desc:0 "通过我们的共同努力，我们将以史无前例的凶猛与彻底，向那些日耳曼侵略者讨回他们对我们挚爱祖国犯下的毁灭之债。当§R大审判§!最终且不可避免地战胜俄罗斯的敌人时，将无人胆敢提及我们那些已覆灭敌人的名字，更不用说信奉那致使他们走向必然灭亡的邪恶意识形态了。\n\n即将到来的战争将是艰苦的，为了确保我们的成功，黑色联盟必须最大限度地利用那些与我们一同赢得救赎特权的任何盟友。\n\n所有人必须团结一心，将纳粹主义的火焰彻底扑灭，因为那些对战斗号召充耳不闻之人，与那些与敌人同流合污者相比，也好不到哪里去。"
 OMS_a_war_to_end_the_germanic_menace:0 "终结日耳曼威胁之战"
 OMS_a_war_to_end_the_germanic_menace_desc:0 "德意志第三帝国及其纳粹猪猡们，有且仅有一个真正的敌人：那就是伟大的俄罗斯人民！正是我们的祖国在抗击条顿铁蹄时流尽了千万儿女的鲜血，正是我们的祖国饱受摧残被奴役鞭笞，也必将由我们的祖国将其彻底击溃夺取胜利！\n\n尽管装腔作势，可悲的自由国家组织及其拙劣的民主理想，在这场对抗德意志的神圣战争中从未提供实质援助。他们的人民未曾为胜利付出代价，他们永远无法理解我们的抗争与伤痛。我们不需要他们，更不需要他们的软弱。若要彻底毁灭德意志，只能靠我们自己！"
 OMS_declare_the_traitors_of_europe_threats_to_the_world:0 "[OMS_Focus_56]"
 OMS_declare_the_traitors_of_europe_threats_to_the_world_desc:0 ""
 OMS_overtures_to_the_ofn:0 "[OMS_Focus_57]"
 OMS_overtures_to_the_ofn_desc:0 ""
 OMS_declare_the_german_people_a_national_threat:0 "[OMS_Focus_58]"
 OMS_declare_the_german_people_a_national_threat_desc:0 ""
 OMS_drum_up_the_populace:0 "[OMS_Focus_59]"
 OMS_drum_up_the_populace_desc:0 ""
 OMS_we_are_ready:0 "时刻准备着"
 OMS_we_are_ready_desc:0 "为了这一刻，我们的民族付出了何等惨痛的代价？当铁蹄扼喉之际，我们的人民捱过了多少日夜春秋？又有多少千万生灵惨遭碎灭？我们在苦难与漫长岁月中苦候此刻，而今它终于降临。\n\n过往种种皆为此而铸。每一颗决定俄罗斯命运的子弹与炸弹，都将我们引向此地。自伏罗希洛夫在第一次西俄罗斯战争中任由它从指间溜走之后，莫斯科首次回归到真正同胞的掌控之中。在这收复时刻，这座光明之城正向我们发出召唤。我们必须响应它的呼唤。"
 OMS_at_the_precipice:0 "子时将近"
 OMS_at_the_precipice_desc:0 "§s整个§!£GFX_OMS_black_league_texticon 及其中的每一个人，无论身份地位，都怀抱着完全相同的情感——期待、决心，或许还有一丝紧张。但所有人都团结一致，誓要将这个£GFX_OMS_teutons_texticon §q腐朽国度§!彻底击溃，像£GFX_OMS_final_war_texticon §e切除§!肿瘤般连根铲除其背后的£GFX_OMS_teutons_texticon §q威胁§!。每件武器都已装填就绪，每名士兵坚守岗位，每项计划都经过缜密推敲，连最细微的环节都已准备得一丝不苟。仅剩最后的技术与后勤任务需完成，以确保每个环节精准到位。\n\n£GFX_OMS_great_trial_texticon §x大审判§!即将降临，举世皆将见证。但唯有当所有进攻计划都能以最高效率执行、达到最大效果时，方能启动这场审判。我们将确保战争初期就对£GFX_OMS_teutons_texticon §q敌方§!造成£GFX_OMS_final_war_texticon §e毁灭性打击§!。"
 OMS_cull_the_officer_corp:0 "军官团精简化"
 OMS_cull_the_officer_corp_desc:0 "尽管我们竭尽全力清除那些心存疑虑、潜在危险之人，并提拔忠诚可靠者担当要职，仍有一小撮顽固分子逍遥法外，他们（即便无意间）持续在官兵中散播怀疑的种子。老话说得好，链条的强度取决于最薄弱的一环；我们必须找出这些薄弱环节，用更坚韧的材料取而代之。绝不能让意志薄弱者散布疑虑，那将成为士气和组织的致命累赘。\n\n要想揪出这些人，就得留意那些恐惧与不安的低语，物色合适的替代者，再将他们调往无害的岗位——无论是当个文书闲职，还是彻底清除出队伍。这种幕后捅刀子的勾当固然肮脏，但为了打造有史以来最强大的战争机器，此举实属必要。"
 OMS_give_preference_to_the_faithful:0 "擢升忠信者"
 OMS_give_preference_to_the_faithful_desc:0 "理想情况下，我们的高级军官应当与我们秉持相同的道德信念，但现实并非如此。有些蠢货仍执着于对民主或自由的幻想。尽管其中部分军官或许具备才能，但俄罗斯的命运决不能托付给这种人。唯有那些对£GFX_OMS_dmitry_yazov_texticon §Y亚佐夫§!和£GFX_OMS_black_league_texticon §s黑色联盟§!理念绝对忠诚的军官，才配执行这项神圣的使命。这些忠诚者将获得晋升，凌驾于那些价值观相悖者之上。或许有人会说，这将导致军官团体的僵化。然而，若让那些狂妄自大的自由派软心肠掌握俄罗斯的命运，才是更大的灾难。无论付出何种代价，都必须确保军官队伍的思想纯粹性。"
 OMS_doctrine_of_shadow_and_steel:0 "暗影与钢铁教条"
 OMS_doctrine_of_shadow_and_steel_desc:0 "随着£GFX_OMS_great_trial_texticon §x大审判§!即将开始，我们必须确保每个人都清楚自己的职责。我们不仅要击败£GFX_OMS_teutons_texticon §q条顿人§!，更要将他们彻底碾碎。为此，我们必须动用一切可用手段。我们将以£GFX_OMS_teutons_texticon §q条顿人§!曾对待我们的方式回敬他们。我们将对敌人发动全面战争。我们的军官必须毫不犹豫地漠视£GFX_OMS_teutons_texticon §q条顿人§!的生命——无论他们是军人还是平民。他们必须将£GFX_OMS_teutons_texticon §q敌人§!视为畜生，并如此对待。做不到这一点的人将被边缘化，这些低效无用之徒不配参与£GFX_OMS_great_trial_texticon §x大审判§!的伟业。在国家最危急的时刻，我们决不能容忍懦夫的存在。"
 OMS_arm_the_soldiers_of_the_reclamation:0 "武装复兴战士"
 OMS_arm_the_soldiers_of_the_reclamation_desc:0 "为£GFX_OMS_great_trial_texticon §x大审判§!所做的所有工业准备已结出累累硕果——大量武器、弹药及其他军需物资已为即将到来的战争准备就绪。但面对如£GFX_OMS_teutons_texticon §q德国§!及其走狗这般根深蒂固的强敌时，再多准备也不为过。因此，当局已下令发起最后总动员令。工厂将延长工时，每座矿山、每间作坊都要全力生产坦克、卡车、枪支弹药，每双能干活的双手都必须投入生产。\n\n即便是无法操作熔炉或车床的人，也要在后勤岗位上发光发热——海量物资需要登记在册，并准确运抵指定仓库和补给中心。为确保胜利，每个人都必须全力以赴——无一例外。"
 OMS_with_the_torchs_blaze:0 "借火炬之辉"
 OMS_with_the_torchs_blaze_desc:0 "自从我们向全世界昭告£GFX_OMS_great_trial_texticon §x大审判§!以来，§MOFN§!的特工便暗中与我们接触，提供武器、弹药、情报和资金支持的秘密渠道。这些提议大多确实极具诱惑力，我们也一直与这些资源保持着联系。现在是兑现筹码的时候了。我们将开始征调一切可获得的武器、资金和信息，以确保£GFX_OMS_great_trial_texticon §x大审判§!的顺利进行。联盟内部并非所有人都赞同此举，但为了确保最终胜利，我们必须暂时放下一些尊严。\n\n众所周知§MOFN§!对各类装备有着极高的标准，如果§M美国§!的枪支和美元能助我们走向胜利，那就这样吧。我们的士兵绝不会赤手空拳，工厂绝不会缺乏资金，每场战斗都将在优质情报的支撑下周密部署。"
 OMS_With_The_Motherlands_Blood:0 "凭祖国之血"
 OMS_With_The_Motherlands_Blood_desc:0 "工业是战争的命脉，这一点无人能反驳。若能在产量上压倒敌人，无论对方多么狂热忠诚都无济于事。若士兵们赤手空拳，胜利便无从谈起。为此，联盟决定全力扩大生产——实行轮班制使工厂车间全天候运转，同时放宽部分生产条例以加速流水线作业。\n\n这无疑将给工人和设备带来巨大负担。血肉之躯与钢铁机械皆有极限，但我们必将让他们的每一滴血汗都物有所值。我们将以众人不懈的劳作，铸就£GFX_OMS_great_trial_texticon §x大审判§!的辉煌胜利，这份荣光必将由全体同胞共享。"
 OMS_ready_the_silos_unseal_the_canisters:0 "备妥发射井，启封毒气罐"
 OMS_ready_the_silos_unseal_the_canisters_desc:0 "在为£GFX_OMS_great_trial_texticon §x大审判§!所做的诸多计划中，复仇武器堪称重中之重。这些装备无疑将让我们在对£GFX_OMS_teutons_texticon §q德国§!军队及其走狗的作战中获得优势。为此，我们必须将这批武器部署至前沿阵地。£GFX_OMS_chemical_weapons_texticon §K化学弹药§!将配发给炮兵营与迫击炮小队，核弹头也将装入发射井并锁定目标。他们的城市将在毒云中灰飞烟灭——而这仅仅是个开始。\n\n步兵将配备毒气手雷与燃烧弹，但需接受额外培训以确保使用得当。我们最不希望看到毒气逆风反噬，或是烈火失控蔓延的景象。"
 OMS_posture_our_might:0 "彰显国威"
 OMS_posture_our_might_desc:0 "£GFX_OMS_international_image_texticon §i国际社会§!乃至£GFX_OMS_teutons_texticon §q那帮条顿蛮子§!都认为我们不过是个自封军阀的跳梁小丑，妄图在世界舞台上装腔作势，对那帮恶臭的§q德国佬§!构不成实质威胁。在£GFX_OMS_great_trial_texticon §x大审判§!正式拉开序幕前，我们将集结所有军力举行盛大阅兵与军事演习，不仅要展示规模，更要证明我们具备协调装备如此庞大军队的能力。\n\n我们的士兵，我们的将领，我们的装备，我们的战机、舰艇、坦克乃至所有复仇武器都将毫无保留地展现在世界面前。我们要让我们的意图与执行力都清晰如炬。无论情愿与否，£GFX_OMS_teutons_texticon §q德国佬§!和£GFX_OMS_international_image_texticon §i全世界§!终将对我们肃然起敬——即便不是畏惧。"
 OMS_fill_the_peoples_fervor:0 "唤醒潜伏者"
 OMS_fill_the_peoples_fervor_desc:0 "试想这样的场景何等令人不安：你熟识的那些人——同事、邻居，甚至可能是朋友——突然集体兴风作浪？这正是我们的行动目标。我们早已将特工缓慢而彻底地渗透进各总督辖区，让他们在当地社会扎根。他们看似安分守法，不引起任何人注意，就像埋藏的爆炸装置静待引爆信号。现在，引爆的时刻到了。\n\n转眼之间，工厂将接连遭到破坏，驻军与警察会频繁遇到伏击，山林中潜伏的游击队伍已准备好持久作战。对£GFX_OMS_teutons_texticon §q德国人§!而言，这场浩劫犹如被突然抛入冰窟——刺骨锥心，天旋地转，痛彻骨髓。"
 OMS_dump_the_rot:0 "最后通牒"
 OMS_dump_the_rot_desc:0 "我们与£GFX_OMS_teutons_texticon §q条顿蛮子§!的最后谈判条件将直白且强硬：要求彻底解放祖国的固有领土，立即驱逐解放区内的德国人，实现普鲁士地球非军事化并允许后续执行“惩戒协定”，解散德意志舰队，以及许多其他必要条款，这些都将以我们的名义提交并签署。这些显然是象征性的条件，将被送往£GFX_OMS_teutons_texticon §q腐朽堕落的躯壳§!所在的“人民大厅”，让他们断然拒绝。\n\n然而，倘若£GFX_OMS_teutons_texticon §q秃鹫§!真的接受了这些悖逆天理的要求，我们也绝不会放过任何一个祖国的敌人。任何踏上我们神圣土地的德国代表团，每走一步都将直面刺刀寒芒的凝视。如果他们不能接受这一现实，那么我们就必须亲手让他们接受。"
 OMS_march_towards_midnight:0 "迈向子夜"
 OMS_march_towards_midnight_desc:0 "随着£GFX_OMS_great_trial_texticon §x大审判§!的最后准备工作接近尾声，旨在终结£GFX_OMS_teutons_texticon §q日耳曼种族§!对我们神圣祖国的占领发起的£GFX_OMS_final_war_texticon §e最终进军§!即将开始。现命令驻扎在乌拉尔山脉以东、守卫£GFX_OMS_black_league_texticon §s黑色联盟§!疆界的£GFX_OMS_black_league_texticon §s俄罗斯民族军§!残余部队立即撤离防区，向那些玷污我们祖国土地的卑劣缔造者之边境集结。\n\n£GFX_OMS_black_league_texticon §s复兴政府§!及其人民正站在实现命运的悬崖之巅。留给£GFX_OMS_teutons_texticon §q条顿蛮子§!及其虫豸种族的最后和平时刻即将结束。我们祖国英勇卫士的荣誉与使命，必将开创一个新时代，并彻底摧毁德国。"
 OMS_with_every_waking_moment:0 "不舍昼夜"
 OMS_with_every_waking_moment_desc:0 "若要使£GFX_OMS_great_trial_texticon §x大审判§!及其所包含的一切斗争取得成功，那么£GFX_OMS_black_league_texticon §s整个国家§!从上到下都必须专注于物质与理论的双重准备。农民将种植优质谷物磨成军粮，矿工将开采矿石铸成武器弹药，将领与参谋人员则会废寝忘食地推演进攻的每个环节及其所有合理变数。只要你能劳作，只要你能谋划，你就是大审判的一部分。这将是一场全民的战争，也将是一次全民的胜利。\n\n£GFX_OMS_teutons_texticon §q日耳曼人§!及其傀儡早已沉溺于骄惰，当£GFX_OMS_great_trial_texticon §x大审判§!真正降临时，他们将在我们充足的准备面前猝不及防。无论是势如破竹的进攻还是铜墙铁壁的防守，我们都有层层预案与充足的物资支撑——直到胜利的最后一刻。"
 OMS_thus_struck_the_minute_hand:0 "纵使天崩地裂"
 OMS_thus_struck_the_minute_hand_desc:0 "£GFX_OMS_black_league_texticon §s黑色联盟§!为这一刻已筹备数十年。我们的总司令始终盼望着这一日将带来的荣耀。我们伟大祖国的每一分力量、每一缕意志都在推动着我们迈向命运。向£GFX_OMS_teutons_texticon §q德国§!发起£GFX_OMS_final_war_texticon §e最终复仇§!的时刻终于来临。  \n\n我们的复仇将迅捷如风。对俄罗斯之敌的仇恨与崇高怒火将如浪潮般喷涌。£GFX_OMS_national_redoubt_texticon §g国家防御§!设施已在山体下全面运作，为民众提供庇护，远离这场神圣战争引发的灾难。£GFX_OMS_teutons_texticon §q帝国§!必将被£GFX_OMS_final_war_texticon §e焚为灰烬§!。\n\n§R纵使天崩地裂，复仇亦将降临。§R"
 OMS_The_Great_Trial:0 "大审判"
 OMS_The_Great_Trial_desc:0 "三十年前，我们民族的心脏与灵魂被条顿蛮族焚为灰烬。第一次审判的失败几乎将俄罗斯民族从地球上抹去，因为雅利安人发动的战争不仅针对我们的国度，更指向我们的文化与族群。他们妄图“净化”这片土地，消灭我们的兄弟姐妹，摧毁我们珍视的一切。\n\n雅利安人以为他们取得了永恒的胜利。\n\n何其可笑。\n\n愤怒与悲伤的炽热余烬锻造出一个全新的俄罗斯。一个不惜一切代价也要实现彻底复仇的俄罗斯。每个被抛入壕沟冰冷怀抱的男女老少，他们的血债都将得到三倍的偿还。我们£GFX_OMS_final_war_texticon 的§e最终胜利§!近在咫尺，数千万人在工厂里辛勤劳作，或向着故土挥师进军，怀揣同一个目标：不惜任何必要手段彻底毁灭德国。\n\n我们已等待多年，此刻终将降临，正是时候向往昔的冤屈复仇了。\n\n§R£GFX_OMS_great_trial_texticon §x大审判§!已然开启。§!"
 OMS_The_Road_To_Moscow:0 "通往莫斯科之路……"
 OMS_The_Road_To_Moscow_desc:0 "莫斯科曾是俄罗斯搏动不息的心脏，一座我们曾怀着光荣与骄傲称其为首都的闪耀之城。换言之，它本该成为人类能够建造出的最伟大的城市范例。但这一切都随着£GFX_OMS_teutons_texticon §q条顿蛮子§!的铁蹄踏过这座城市，驱逐她的人民，亵渎她的圣地，将她束上枷锁而终止。\n\n现在，我们已然兵临这座我们曾深爱着的城市，准备好将她永远收回她子民的怀抱中。而当我们将我们神圣的旗帜升上克里姆林宫的旗杆时，我们也将对世界宣告：\n\n§R永不复临§!"
 OMS_Will_Be_Paved_With_Blood:0 "将由§R鲜血§!铺筑"
 OMS_Will_Be_Paved_With_Blood_desc:0 "若想到我们在首次审判中失败所招致的后果，普通的俄罗斯人脑中浮现的第一件事，便是兄弟姐妹、父母与邻居们那无数张面孔，他们皆惨遭条顿人无尽的屠戮。\n\n如今，我们终于有机会§R以血还血§!。\n\n每个殖民者和士兵都将落得与他们曾经大规模屠杀之人同样的命运。终于，彻底的报复和正义将降临到所谓的“超人”身上，而我们长眠战友的牺牲也将不再白费。"
 OMS_Everything_We_Can_Use:0 "一切可用之物"
 OMS_Everything_We_Can_Use_desc:0 "将条顿人及其治下自愿为虎作伥者所拥有的财富夺回，实属天经地义。\n\n为维持攻势，我们必须加强作战力度，并向前线输送更多补给。我们向德国进发时遇到的一切，都将被改造以充作军需，无论是粮食、物资还是车辆——凡未用螺栓或焊接固定的物品，都将用于推进我军向日耳曼的进军。我们还将组建专门的后勤部队，确保这些物资尽可能高效地转化为可供部队直接使用的资源。此外，惩戒营将被允许搜刮阵亡者遗体，以减轻后勤系统的负担。对他们来说幸运的是，§R此战之中没有所谓的平民§!"
 OMS_What_To_Do_With_The_Settlers:0 "移民怎么办？"
 OMS_What_To_Do_With_The_Settlers_desc:0 "德国犯下的最大罪行便是所谓的“东方总计划”，这个极其恐怖的计划旨在将我们的斯拉夫兄弟贬为奴隶，让所谓的小雅利安人坐享其成，最终彻底取代他们。现在，这些所谓的“殖民者”在我们脚下乞求怜悯。\n\n我们只会给予他们§R苦难§!\n\n这些屠杀无数、只为其神圣生存空间而战的罪人，将只会得到无尽的痛苦。他们很快会尝到鞭子的刺痛、锁链的重量，以及更多。\n\n然而，£GFX_OMS_dmitry_yazov_texticon §Y亚佐夫同志§!设计了独特的正义手段。我们控制下的每一个东方德意志人都将接受绝育计划，这不仅将永远终结条顿人的未来，还能让他们作为战争机器的燃料苟活于世。"
 OMS_Show_Them_Our_Hate:0 "展示我们的愤怒"
 OMS_Show_Them_Our_Hate_desc:0 "要让条顿人彻底认清等待他们的命运，我们必须让他们感受到与其曾经带给我们国土上同等的恐惧与战栗。我们将向全世界公开展示这一切。处决、无情的鞭笞和拷打的场面都将实时传播至后方，所有人都将目睹真正正义的实现。\n\n我们神圣的正义以及我们民族战胜卑劣日耳曼杂种的胜利将得到全方位呈现。我们将展示他们的男人如何死亡，女人如何受苦，孩子如何饿死。\n\n届时，唯有雷鸣般的掌声将响彻天地。"
 OMS_With_The_Leagues_Might:0 "以联盟之威"
 OMS_With_The_Leagues_Might_desc:0 "黑色联盟已在这个世界上留下了自己的印记。我们曾不过是西伯利亚微不足道的小军阀，如今却成长为世界前所未见的最强复仇力量。我们的坦克碾碎了国防军，战机夷平了匈人城市，士兵践踏着阵亡敌人的尸体。\n\n我们必须确，我们横扫欧陆的复仇进军消息传至每个俄罗斯人耳中，以坚定其信念，激励他们在后方加倍努力，举国上下以更凶悍的斗志投入战斗。当然，当我们造成的毁灭景象冲破敌人的审查封锁时，他们将在我们面前战栗不已。"
 OMS_Burning_Through_Supplies:0 "燃烧补给"
 OMS_Burning_Through_Supplies_desc:0 "为了彻底消灭俄罗斯有史以来面临的最强大敌人，黑色联盟不得不动用祖国历史上规模最庞大的军队。然而此举正给我们的后勤网络带来空前压力，若不采取紧急措施，战略储备恐怕很快就会耗尽。\n\n为确保前线部队的持续作战能力，我们将划拨部分工业产能，全力投入到为供应链提供车辆、补给物资、食品、军装等支援工作中。若再次实现盈余，所有物资都将优先补充至分布在西伯利亚各地地下掩体中的战略储备库。"
 OMS_Their_Fatherlands_Wealth:0 "以他们父国之财富"
 OMS_Their_Fatherlands_Wealth_desc:0 "虽然我们已成功夷平大量可恶敌人的城市与军队，但尚未建立一个专门机构来处置条顿人那里夺得的不义之财。通过更妥善地组建国家机构管理德国人从世界各地掠夺而来的财富，我们既能补充供应链，又能改善后方局势。"
 OMS_Black_League_Childrens_Authority:0 "黑色联盟儿童管理局"
 OMS_Black_League_Childrens_Authority_desc:0 "新一代俄罗斯人早已认清条顿人的罪恶——我们早已认识到了。既然如此，当£GFX_OMS_great_trial_texticon §x大审判§!终于降临之际，我们怎可昧着良心剥夺他们参与的权利？这是他们与生俱来的权利，深植于血脉之中。孩子们必将为祖国效力。\n\n具体形式将因人而定。有人将在兵工厂服务，铸造炸弹与子弹；有人将被派往最前线作为辅助部队，操作机枪、搬运装备。无论如何，我们的孩子定会让我们、我们的先祖感到骄傲——正如我们一样。"
 OMS_Who_Hasnt_Served:0 "谁没有服过役？"
 OMS_Who_Hasnt_Served_desc:0 "随着我们针对法西斯毒瘤的伟大圣战全面展开，预计人力储备将在数月内急剧消耗。为避免未来陷入被动，我们将搜遍每一寸土地，从每个城镇村落揪出所有能持枪的壮丁。从城市公寓到林间小屋，我们定要让全俄罗斯的男人为祖国复兴流尽最后一滴血。\n\n无论年龄几何，只要能握紧枪械或搬运炮弹，就有义务为俄罗斯服役，直至死亡。£GFX_OMS_teutons_texticon §q条顿人§!及其丑恶爪牙必将倾尽全力反扑，数百万人将死于他们的阴谋。我们们深知牺牲在即，亦备妥以二换一的人力轮换机制。在这祖国母亲最辉煌的时刻，所有人都将为她效命。"
 OMS_The_Bottom_Of_The_Barrel:0 "最后的残渣"
 OMS_The_Bottom_Of_The_Barrel_desc:0 "灾难！我们对库存的评估结果显示，它们几乎毫无价值！即便这些武器曾奏效过，如今也已大多失灵，其余的也存在故障，只会危及我们自己。如此暴露出的无能必须有人担责，但在此之前，我们必须补救这一问题，否则我们在£GFX_OMS_great_trial_texticon §x大审判§!中付出的一切努力都将付诸东流。\n\n为了给我们的士兵补充给养，我们只能动用从卫国战争中遗留下来的那点寥寥可用装备。无论枪支多么老旧，只要能发射子弹，士兵就会使用它。我们若想挽救后勤状况，就别无选择。将士们的意志必须足以弥补这些缺陷。"
 OMS_Improvised_Tanks:0 "挖掘库存潜力"
 OMS_Improvised_Tanks_desc:0 "制造一辆坦克是一项一丝不苟的工艺。组装这些战争机器需要数不清的零件与构件。但在眼下这般危急存亡的时刻，我们不需要什么‘装甲’或‘合金’来造就一辆堪用的坦克。\n\n我们将火炮直接焊在汽车顶上，制造出的载具将与它们那些披甲的同类一样高效。德国人或许认为这让他们占了便宜，但他们根本不懂，我们取得胜利所需要的一切，仅仅是纪律与勇气。最终，我们将确保坦克的数量，至于质量——就留给车组乘员去操心吧。"
 OMS_Accept_Nothing:0 "寸草不留"
 OMS_Accept_Nothing_desc:0 "一些条顿‘定居者’拒绝离开他们窃据的家园与田庄，这是无可避免的。或许其中一些人相信他们能抵抗我们。或许另一些人仍抱着一丝微不足道的希望，以为只要向£GFX_OMS_black_league_texticon §s黑色联盟§!摇尾乞怜，就能苟全性命。\n\n他们大错特错。\n\n定居者绝无仁慈可言。没有一个德国人能被饶恕。任何孱弱的、乞求所谓‘良知’的企图，都只会得到枪口的‘回应’。被窃的国土将被炮火吞没，唯有当最后一头民族社会主义的祸害从神圣的俄罗斯土地上被清除时，寂静才会降临。"
 OMS_They_Know_Their_Fate:0 "他们自知其运"
 OMS_They_Know_Their_Fate_desc:0 "他们知道我们对其血脉的立场，对其野蛮文化与理念的立场。如果他们到现在还没有滚出我们的家园，那他们就将承受应得的后果。毕竟，在他们犯下这一切滔天罪行之后，他们竟还敢逗留在我们法理昭彰的故土之上？\n\n日耳曼人要么在雄鹰面前仓皇逃窜，要么就将被彻底吞噬。无论男女老幼，皆无不同，他们都将感受到正义之怒火的雷霆铁锤。"
 OMS_Anger_Is_A_Strong_Tool:0 "怒火，最强的利器"
 OMS_Anger_Is_A_Strong_Tool_desc:0 "仇恨，一种美妙的情感。再无任何情感能唤起人类如此强烈、发自肺腑的反应。它纯粹无比——而世间最纯粹的仇恨，莫过于我们对德意志所怀的恨意。被压迫者积压了数个时代的怨恨，终于得到机会反戈一击，向压迫者复仇雪恨——我们将收获这股力量，并将其锻造成一柄利刃。\n\n仇恨让人的拳头更重，脚步更快，战斗更勇。这很好，我们将用它来对付条顿人及其走狗。我们最原始的狂怒，将亲睹日耳曼尼亚化为一片焦土，其人民将仓皇奔逃、苟延残喘，一如我们的人民数十年来所经历的那样。他们将品尝到我们曾经品尝过的苦难——只因我们的仇恨远胜于他们的仇恨。"
 OMS_Fear_Beats_Willpower:0 "恐惧胜于意志"
 OMS_Fear_Beats_Willpower_desc:0 "他们将亲眼见证我们为他们准备的一切。我们的土地曾被德国人攻击蹂躏。每一寸该死的土地，都被条顿这瘟神所玷污。家破人亡，城池被毁，前途尽丧。现在，轮到我们去恐吓他们了。\n\n他们曾对我们做过什么，我们便将这一切镜像奉还。他们将目睹自己的家人流离失所，自己的丰碑被夷为平地，自己的城市沦为废墟。这些事实将被批量生产，昭告天下。很快，整个世界都将承载我们的怒火。"
 OMS_Expand_The_Target_List:0 "扩大打击名单"
 OMS_Expand_The_Target_List_desc:0 "条顿的普通士兵预料到了我们的愤怒，因此他们并不畏惧——至少，没有他们本该有的那么畏惧。他们的元首知道，有朝一日他将在我们的圣战烈焰中化为灰烬。他惧怕我们，但还不够。德国人民尚未完全领会到何种天罚已然降临。因此，我们的职责便是提醒他们。\n\n我军士兵应就地处决或俘获的军事目标名单将被扩大，以涵盖更大范围的非战斗人员。无论性别、年龄、社会阶层，每一个德国人都从俄罗斯人民的苦难中获益，如同一个巨大的集体蜱虫，吸食着我们的痛苦而脑满肠肥。到此为止了。他们将有生以来第一次，品尝到真正的恐惧。"
 OMS_Hanging_Judge:0 "绞刑法官"
 OMS_Hanging_Judge_desc:0 "在这场§R大审判§!中，总司令亚佐夫同志是正义的最高权威。正是他，主宰着欧亚这无垠战场组成的宏伟正义殿堂；正是他，将对俄罗斯的仇敌施以审判；也正是黑手，将把我们复仇的正义之剑，直刺敌人社会的心脏。\n\n他们被判集体有罪，我们的特工将开始刺杀他们社会中的领袖人物。从经理到市长再到元帅，我们将在他们的社会中散布恐怖，只要战争一日不息，便要瘫痪他们作为一个有凝聚力的国家机构运作的能力。他们都有罪，而判决是——§R死刑§!。"
 OMS_Partisans_Arise:0 "游击队，奋起！"
 OMS_Partisans_Arise_desc:0 "从布列斯特的山丘到萨马拉的河岸，他们为了同一个目标而受训。他们为了条顿霸主的灭亡而战、而死，那些霸主曾奴役了他们的同胞。\n\n奋起吧，英勇的游击队员！奋起吧，去动摇整个战区，去撕开日耳曼防线的缺口。无论是正规军还是游击队，条顿终将学会畏惧每一位联盟的追随者。"
 OMS_No_More_Equipment:0 "装备告罄"
 OMS_No_More_Equipment_desc:0 "装备的洪流已经枯竭。我们为士兵们准备的丰饶武器与装备收成戛然而止。战争开始时，我们的府库充盈，随时准备着剿灭£GFX_OMS_teutons_texticon §q条顿恶棍§!，但如今它已然凋敝，再无完全补充的可能。\n\n我们面前有了一项新任务：爱惜我们尚存的武器，并将其效能发挥到极致。我们必须用仅剩的一切，去赢得征服。"
 OMS_No_More_Scum:0 "渣滓尽除"
 OMS_No_More_Scum_desc:0 "目前，我们境内残留的定居者已寥寥无几。谢天谢地，许多人已被抓获，并以任何合适的死刑方式予以了裁决。但可悲的是，我们已经没有地方可以净化了。\n\n现在，我们必须重振对国土上条顿人的追猎。无论他们身上是否仅有一滴日耳曼之血，都必须被处理。对于这种日耳曼‘文化’，亦是同理。我们将熄灭我们国土上每一双条顿眼睛中的光芒，让我们离彻底偿还血债更近一步。"
 OMS_No_More_Strings:0 "无需提线"
 OMS_No_More_Strings_desc:0 "德国议会内外的联络人已经变得平庸，提供的结果也无关紧要。我们对这些英勇的人民所求已足够多，他们的牺牲没有白费，我们必将确保这一点。他们将被铭记为敲碎淫乱德国鹰的万千重锤之一。\n\n此外，我们已无需再探寻更多关于敌人的情报。因为我们早已知晓他们的本质——不过是需要从这颗星球表面被清除的污秽罢了。"
 OMS_No_Matter_How_Long_It_Takes:0 "无论耗时多久…"
 OMS_No_Matter_How_Long_It_Takes_desc:0 "£GFX_OMS_great_trial_texticon §x大审判§!仍在拖延，我们所期盼的圆满结局依然遥不可及。‘雅利安’这祸害已尽其所能地负隅顽抗。但这对于走投无路的老鼠来说，本是意料之中，它们撕咬咆哮，只因它们深知我们是它们的天敌，它们终将被永久地灭绝。\n\n§R他 们 一 个 也 不 留。§!\n\n俄罗斯雄鹰已经结束了对猎物的玩弄，现在，我们将彻底终结它。"
 OMS_We_Will_Win:0 "我们必胜"
 OMS_We_Will_Win_desc:0 "我们必须赢得这场战争。为了那些献出生命的人，为了祖国天命的完全实现，每一个俄罗斯人都明白这个道理。在宝塔里的腐朽昭和官僚明白。挤在办公楼和家里的美国人明白。那该死的‘雅利安’祸害，那将被我们屠灭的害虫，也明白。那他们为何还要逃跑？为何要躲在核武和外交的背后？如果这场战争必须持续千年，那就让它持续下去！如果地球上最后的人类是一个德国人和一个俄罗斯人，那么胜利的永远是俄罗斯人！卑鄙而徒劳的德国人，永远是输家。\n\n我们远比他们任何时候都更优秀。\n\n£GFX_OMS_great_trial_texticon §x大审判§!必将实现，不惜任何代价。"
 OMS_an_unmeasurable_anger:0 "滔天怒火"
 OMS_an_unmeasurable_anger_desc:0 "我们的军队到底他妈的出了什么问题？我们为了对付纳粹这头野兽，训练了足足数年。我们的人本该解放莫斯科！？可我们却已经躺在过去的功劳簿上沾沾自喜，而我们在纳粹铁蹄下的儿女们还在受压迫的哭喊。我们的军队就是个他妈的笑话。怯懦与背叛流淌在我们军队的血管里。怯懦是我们声誉上的污点，若要拯救俄罗斯，就必须将其涤荡干净。"
 OMS_call_for_immediate_reformation:0 "号召§R立即改革§!"
 OMS_call_for_immediate_reformation_desc:0 "不可能之事已然成真。\n\n战争的齿轮已然停转，官僚主义的无能与腐朽锈蚀了它。当我们的士兵在莫斯科城外他们自己挖的洞里挨冻时，公众对我们£GFX_OMS_great_trial_texticon §x大审判§!的持续进展愈发焦躁不安。\n\n£GFX_OMS_dmitry_yazov_texticon §Y亚佐夫同志§!已号召全国保持稳定，准备迎接一个漫长的寒冬。在此期间，许多事情将因我们而改变。我们社会的许多方面都将被颠覆、被改造，变得更好。这些本是我们早就该做出的变革。\n\n§R我们将在十周之内，取得十年的进步§!。"
 OMS_replacement:0 "换血…"
 OMS_replacement_desc:0 "条顿之祸已将我们的最高指挥部和军事机构蹂躏至无能的地步，但堕落并非仅仅影响国家的内部运作。它会向外延伸，妄图摧毁我们珍视了数百年的传统，让整个社会陷入颓废。\n\n如果我们不希望重蹈古代帝国的覆辙，那么我们就不能实施短视的解决方案。一场换血势在必行，要清除我们队伍中的无能之辈，并将条顿式堕落的触须从社会中连根拔起。必须有一种信念被植入每个公民的头脑——一种关于勇气和能力的信念。"
 OMS_in_the_people:0 "…于人民之中"
 OMS_in_the_people_desc:0 "我们的人口如此辽阔而众多，要衡量普遍的情绪可能相当困难，这种情绪在城市与村庄之间差异巨大。但是，我们必须协调一致地努力，确保每一位男女老幼，在任何地方、任何时刻，都全心全意地效忠于亚佐夫、联盟和£GFX_OMS_great_trial_texticon §x大审判§!。\n\n这将包括一场全面的宣传运动，电台广播将不间断地颂扬亚佐夫同志和光荣的£GFX_OMS_black_league_texticon §s黑色联盟§!的美德。传单要塞进每个人的手中，报纸的头条要向所有读者嘶吼条顿的邪恶，以及亚佐夫和联盟是我们一劳永逸击败他们的唯一途径。从鄂木斯克的街头到奥莫隆的荒原，没有任何一个灵魂，能不全心全意地支持我们。"
 OMS_increased_security:0 "加强安保"
 OMS_increased_security_desc:0 "£GFX_OMS_great_trial_texticon §x大审判§!高于一切，因此，俄罗斯人民为了看到它的最终实现而倾尽所有，是理所当然的。无论男女，都将在我们的无数工厂中夜以继日地服务，以满足£GFX_OMS_black_league_texticon §s黑色联盟§!的诸多需求。\n\n但一些短视天真的蠢货已开始抗议我们对物资的强力征用和设立的长时间工作制。这掀起了一股异议浪潮，扰乱了我们民族和伟大事业的团结，决不能允许其继续下去。\n\n我们已经收到了关键基础设施发生暴动的报告，这已在相当程度上干扰了我们的战争努力。为遏制此等威胁，我们将派出军队中最忠诚的人去保卫关键的军事和工业设施，并命令他们逮捕、用毒气镇压抗议者，如果爆发全面暴动…他们知道该怎么做。"
 OMS_trust_no_one:0 "一个敌人，一个目标"
 OMS_trust_no_one_desc:0 "人民是羔羊，而£GFX_OMS_black_league_texticon §s黑色联盟§!是他们的牧者。他们无法看到大局，目光短浅，无法为自己做出正确的决定。人民是愚蠢的，他们以为自己的行为会带来好处，实际上只会将我们的国家引向毁灭。但没关系，£GFX_OMS_black_league_texticon §s黑色联盟§!的存在就是为了引导迷途者。\n\n£GFX_OMS_black_league_texticon §s黑色联盟§!是俄罗斯唯一值得信赖的实体，比邻居、朋友、甚至家人都更值得信赖。因此，他们不应相信周围人的言语，因为羔羊怎能辨别谎言与真相？唯有联盟足够智慧，能知晓真理，能知晓何为对俄罗斯有益之事，唯有联盟能为我们所有人带来救赎。"
 OMS_smoke_out_the_rats:0 "烟熏硕鼠"
 OMS_smoke_out_the_rats_desc:0 "内部安全这个难题，唯有通过查明那些企图颠覆和推翻联盟的人才能解决。£GFX_OMS_black_league_texticon §s黑色联盟§!的全景监视系统将把每一个在沙滩上留下脚印的异议者和背后捅刀者都记录在案，我们希望借此稳固后方局势，以便将我们的精力集中在与条顿掠夺者的武装斗争上。我们已经有了一份庞大的名单，再发现并处理几千名叛徒也无伤大雅。"
 OMS_in_the_army:0 "…于军队之中"
 OMS_in_the_army_desc:0 "我们为£GFX_OMS_great_trial_texticon §x大审判§!的物资和实践准备已经做了很多，但仍有许多工作尚待完成。具体而言，我们必须确保士兵和参谋人员绝对而坚定不移的忠诚。从元帅到列兵，我们将灌输那种驱使可憎的德国人一路滚回其巢穴所需的狂热。这包括几个部分，首先是为列兵和各级军官设计一套训练方案，让他们沉浸在由现有强硬派讲授的宣传之中。\n\n这可以与操练和突击练习相结合，甚至可以加入一些更轻松的元素，比如把射击和刺杀训练的靶子做成德国士兵的形状。最后，为确保这种思想钢印能深入人心，我们要鼓励士兵们在彼此间反复强化这些情绪。对敌人的仇恨，将在每个班、每个团、每个师中产生共鸣。"
 OMS_only_the_loyal:0 "唯有忠诚者…"
 OMS_only_the_loyal_desc:0 "我们的军官团几乎导致§R大审判§!重蹈第一次西俄战争的覆辙，他们理所当然地预料到要人头落地。我们应该利用这一点。\n\n他们会预见到最坏的结果，而我们将让他们相信，这最坏的结果已近在咫尺，却在最后一刻被他们仁慈的元帅从深渊中解救出来。元帅的仁慈与理解是他们能活下来，继续战斗的唯一原因。到最后，军官团里每一个最近神经动摇的人都将被迫向亚佐夫本人做出承诺，并在战争中加倍努力。"
 OMS_may_eat_from_my_hand:0 "…方可食我手中之食"
 OMS_may_eat_from_my_hand_desc:0 "那些背叛了俄罗斯和麾下士兵的人，理应恐惧等待他们的下场。我们将拿他们杀鸡儆猴，向这些无能的蠢货表明，他们并不在惩罚之外。任何在表现不佳的部队中任职的、非不可或缺的人员，将立即受到调查。\n\n黑手将迅速调查这些军官，任何被判犯有玩忽职守罪的人都将以叛国罪论处。为表彰他们曾经的服役，我们将给他们两个选择：要么面对行刑队，要么在余下的战争中，与他们那些更成功的同僚所俘获的德国战俘并肩劳作，直到终老。"
 OMS_of_bullets_and_teeth:0 "子弹与獠牙"
 OMS_of_bullets_and_teeth_desc:0 "一支无能而笨拙的军队只会确保我们对抗德国的努力归于失败。无能将被纠正，那些对斗争的唯一贡献就是恶化军队状况的人将被处理，无论是再教育、调职，还是在发生逃兵的情况下——处死。军队将被迫只对联盟负责，任何异议或叛乱都将得到相应处理。很快，我们的武装力量将学会不去反咬喂食者的手，因为我们会加倍奉还。"
 OMS_in_the_generals:0 "…于将帅之中"
 OMS_in_the_generals_desc:0 "在我军基层军官队伍中，有许多前红军军官曾光荣地为祖国效力。当我们横扫西伯利亚、将俄罗斯从那些辜负祖国的人手中解放时，他们获准重新入伍。鉴于我军将领的屡屡失利，现在是重新评估这些军官并给予他们将功补过机会的时候了。\n\n比他们带来的技能更重要的是，这些军官获得了重生的机会，他们心知肚明。他们将感激总司令的恩典，并确保我军军官队伍展现出更凶悍的作风。因为他们深知：若不如此，等待他们的很可能是万劫不复的深渊。"
 OMS_to_be_feared:0 "既令人畏惧"
 OMS_to_be_feared_desc:0 "我们早已告别了困守鄂木斯克一隅的艰难岁月，但高层指挥系统中那些早该被铁与血涤净的腐败与裙带关系，却如同附骨之疽般死灰复燃。\n\n安全部门早已查明多起案件：某些高级军官与官员滥用职权，将本应用于战争筹备与基础设施建设的物资中饱私囊。\n\n总司令的震怒毫不令人意外，当即下令逮捕这些腐朽的叛徒，经审判以叛国罪处决。我们距£GFX_OMS_great_trial_texticon §x大审判§!的终极目标仅有一步之遥，任何阻碍者都将被碾碎。若有必要，我们会用子弹贯穿每个贪官的眉心，让那些蠢蠢欲动之徒明白——染指禁脔者，唯有一死。"
 OMS_and_loved:0 "又令人爱戴"
 OMS_and_loved_desc:0 "应对危机时，亚佐夫元帅不会像一个野蛮的条顿人那样，而是以俄罗斯此刻需要从领导人身上看到的沉着与威严来行动。人们看到的将不是一个强人所难的暴君，而是一个以身作则、值得追随的楷模。前线的战壕与后方的防空洞里，始终传递着他以磐石般稳控危局的形象——这正是俄罗斯民族集体坚韧精神的鲜活化身。\n\n无论幕后发生什么，我们的宣传机器都将确保——这就是前线将士与后方民众目睹并坚信的景象。"
 OMS_all_feelings_no_words:0 "一切尽在不言中"
 OMS_all_feelings_no_words_desc:0 "让德国化为灰烬的使命未能完成，不仅是士兵的过错，更是那些本应引领他们走向胜利的所谓“领袖”的罪过。统一战争的胜利早已磨平了这些官僚的棱角，如今我们的战士正在为他们的懈怠付出代价，我们神圣的祖国亦在蒙受耻辱。我们不能让这种不公正继续存在下去。\n\n任何渎职行为都将面临严刑惩戒。我们要让每个宣誓效忠亚佐夫总司令的军官都牢记：懈怠职责的代价，远比履行使命的代价更加惨痛。暴力或许是德国人唯一能理解的语言——我们将确保我们的军官团精于此道，否则……"
 OMS_a_trust_in_the_process:0 "信任过程"
 OMS_a_trust_in_the_process_desc:0 "我们的总司令，£GFX_OMS_dmitry_yazov_texticon §Y德米特里·亚佐夫§!，是俄罗斯唯一有资格能宣称成就了£GFX_OMS_black_league_texticon §s黑色联盟§!胜利的人。是谁终结了守旧派系贪婪的统治？是谁让联盟无可争议地统治着广袤疆域？只有亚佐夫，只有他一人。\n\n正如否认总司令的成就是愚蠢而傲慢的，我们也不能背离他的决断。对他方法和理论的坚定信念将为黑色联盟和俄罗斯带来救赎。任何其他道路或领导都将是完全徒劳的。"
 OMS_random_acts_of_patriotism:0 "自发的爱国行为"
 OMS_random_acts_of_patriotism_desc:0 "在俄罗斯本土上，£GFX_OMS_black_league_texticon §s黑色联盟§!最强大的武器始终是其忠诚的公民。无论那些企图破坏审判的人如何行动，俄罗斯普通民众的坚定支持始终遍布全国——这一事实可以用来对付这些误入歧途的异议者。\n\n全国范围内都将对参与揭露俄罗斯境内叛徒的公民给予奖励。任何有助于反£GFX_OMS_black_league_texticon §s黑色联盟§!煽动者被捕的信息都将获得重赏，包括长达一个月的额外配给。我们只需静观其变，就能目睹反对势力的土崩瓦解。"
 OMS_see_my_beauty:0 "观我威仪"
 OMS_see_my_beauty_desc:0 "俄罗斯疆域辽阔。从西伯利亚到西部，横亘着广袤的针叶林、山脉与城市。而在这片广袤的土地上，没有人能比俄罗斯的救世主£GFX_OMS_dmitry_yazov_texticon §Y德米特里·亚佐夫§!更伟大。他从卡尔贝舍夫手中接过£GFX_OMS_black_league_texticon §s黑色联盟§!的权柄，迅速完成了前任未竟的事业，再次将俄罗斯统一在同一旗帜之下。\n\n如今，世上已无人能挑战他的权威。从华盛顿到日耳曼尼亚，这些人在£GFX_OMS_dmitry_yazov_texticon §Y亚佐夫§!这样的巨人面前不过蝼蚁。很快，全世界都将明白——我们正站在最终完成£GFX_OMS_great_trial_texticon §x大审判§!的边缘——而这一切，唯有最高统帅方能成就！"
 OMS_pierce_the_veil:0 "§R刺破帷幕§!"
 OMS_pierce_the_veil_desc:0 "外国媒体大肆渲染的所谓“大停滞”不过是我们的一次伟大重组，这次重组让我们比以往更加强大。不完美的时刻已经结束，现在我们准备好向德国人施以更完美的复仇。\n\n现在，是时候将我们的仇恨倾泻在德国人头上了。在欧洲战场，数百万英勇的俄罗斯人已做好准备，以全新的斗志再次向敌人推进，对他们的野蛮家园展开新一轮彻底清洗。该我们大开杀戒了，该让德国人去死了。\n\n§R大审判再度开启。§!"
 OMS_decades_of_stagnation:0 "数十年的停滞"
 OMS_decades_of_stagnation_desc:0 "£GFX_OMS_great_trial_texticon §x大审判§!将世界推入了一场史无前例的核灾难——当总司令亚佐夫与全俄罗斯黑色联盟悄然蛰伏于乌拉尔山脉的阴影之下时，他们正静待着席卷全球的大气火风暴、电离辐射与严酷核冬天的消退。\n\n他与£GFX_OMS_black_league_texticon §s黑色联盟§!决心重返地表，再度统一俄罗斯全境，并向那些侥幸逃脱审判的阴险狡诈的£GFX_OMS_teutons_texticon §q条顿人§!实施复仇。对亚佐夫而言，必须不惜一切代价弥补大审判的疏漏，彻底铲除残存的纳粹政府与党部机构。他坚定地望向西方，誓要远征东欧废墟，一劳永逸地终结条顿祸患。\n\n然而，尽管他意志坚决且黑色联盟上下同仇敌忾，重重阻碍仍横亘于前。地表高强度的电离辐射与极端环境现象，迫使£GFX_OMS_black_league_texticon §s黑色联盟§!的高层指系统分散在各大城市及战略要地的核掩体中。总司令发现，他既缺乏挺进中欧所需的资源与兵力，又面临补给短缺与领土内动荡的双重困境。黑色联盟的未来笼罩在晦暗的迷雾中，唯有时间能证明其传奇能否延续。"
 OMS_the_dead_lay_above:0 "死者横陈于我们脚下"
 OMS_the_dead_lay_above_desc:0 "懦弱的£GFX_OMS_teutons_texticon §q条顿人§!不仅给£GFX_OMS_black_league_texticon §s黑色联盟§!造成了致命打击，更摧毁了整个人类文明。当我们的社会在地下延续时，地表的世界早已在战火中支离破碎。\n\n数以亿计的生命倒在德国的屠刀之下。我们曾热切想要解放的俄罗斯公民，如今只是辐射土壤上的一捧灰烬。世界无数的文化与历史，在吞噬一切的混乱中逐渐沦为褪色的记忆。千载文明，弹指湮灭。\n\n£GFX_OMS_teutons_texticon §q条顿人§!必将为他们的罪行付出代价。这一点，我们的总司令必将亲自兑现。"
 OMS_trapped_in_an_infernal_game:0 "陷入地狱般的煎熬"
 OMS_trapped_in_an_infernal_game_desc:0 "很明显，我们最勇敢、最足智多谋的战术家们已经开始因掩体生活的压力而崩溃。虽然这本身就是一场伟大而崇高的考验，但我们必须设法让他们保持专注，以确保当£GFX_OMS_black_league_texticon §s黑色联盟§!最终如凤凰般从灰烬中崛起时，他们已做好不惜一切代价的准备。为打破单调生活，我们准备了一些活动和解决方案包，括派遣侦察队外出调查；进行突击演习以保持将领们的思维敏捷；以及增加他们每月的口粮配额。在等待辐射水平下降期间，我们将逐一尝试这些方案——甚至可能利用充裕的时间同时实施所有措施。"
 OMS_thoughts_of_the_past:0 "往日的思绪"
 OMS_thoughts_of_the_past_desc:0 "人民怀念苏联的往昔岁月：那时欧洲与亚洲的各民族团结一心。我们将利用这种怀旧情绪，制作关于西俄战争英雄的影片，展现布哈林统治下普通苏联民众的苦难。这将向他们证明：旧苏联软弱无能，而如果旧当年的领导层更为强大，那些逝去的日子本会如他们所记忆的那样美好。这些影片将为我们的公民更愿意忍受我们£GFX_OMS_great_trial_texticon §x大审判§!的艰辛铺平道路，在等待辐射消散的时间里，我们有充分把握确保这些影片传递出我们的理念。"
 OMS_when_the_kitchens_were_full:0 "...当厨房堆满食物"
 OMS_when_the_kitchens_were_full_desc:0 "想想在£GFX_OMS_great_trial_texticon §x大审判§!之前，我们曾视为理所当然的许多事物如今都成了奢望。清新的空气、洁净的水源、晨间的阳光，最重要的是那些养育我们的丰收庄稼和牲畜。往昔的日子如今显得如此遥远，对忠诚的公民们而言，记忆中明媚的夏日已成为遥远的往事。\n\n或许，我们可以创造性地利用配给物资来提振民众士气。我们将开展一项调查，在这些避难所中寻找烹饪专家，让他们用配给物资开发食谱。这些食谱应当能唤起人们对战前岁月的记忆。这有助于打破单调的生活，确保我们的人口保持健康快乐。虽然这还不足以持续激励民众，但它应成为我们度过£GFX_OMS_great_trial_texticon §x大审判§!的战略基石。"
 OMS_when_the_army_was_decadent:0 "……当军队日渐腐化"
 OMS_when_the_army_was_decadent_desc:0 "曾几何时，£GFX_OMS_black_league_texticon §s黑色联盟§!是一支不可阻挡的力量。我们伟大的国家屹立于强国之林，能轻易碾碎任何胆敢反抗的敌人。我们的后勤保障与火力压制几乎无人能及，最终彻底铲除了条顿威胁。而如今这支军队已辉煌不再，在等待重返地表的日子里日渐腐朽。\n\n我们必须不惜一切代价确保军队随时能战。突击演习与战备检查既能保持士兵的警觉性，也能让将领们保持头脑敏锐。尽管地堡内空间有限，我们仍将竭尽全力模拟部队重返地表后可能面临的作战环境。"
 OMS_when_the_people_had_purpose:0 "……当人民有了目标"
 OMS_when_the_people_had_purpose_desc:0 "每位£GFX_OMS_black_league_texticon §s黑色联盟§!公民的使命就是致力于消灭£GFX_OMS_teutons_texticon §q条顿人§!。但自从所谓的£GFX_OMS_teutons_texticon §q条顿人§!灭亡后，£GFX_OMS_great_trial_texticon §x大审判§!已沦为一场漫长的煎熬，时间太多却无所事事。公民的意志正在消磨，他们开始质疑自己生存的意义。\n\n我们必须通过£GFX_OMS_great_trial_texticon §x大审判§!帮助他们重拾信念：夺回祖国母亲需要完成浩大工程，他们必须严阵以待。我们将播放教育影片，指导公民了解未来重返地表后需要重建的工业和基础设施。每位公民都将接受严格的建筑、农业和辐射清理训练，确保地表收复工作顺利推进。£GFX_OMS_great_trial_texticon §x大审判§!尚未结束，£GFX_OMS_black_league_texticon §s黑色联盟§!必须为任何可能到来的情况做好准备。"
 OMS_new_league_in_new_age:0 "新联盟，新纪元"
 OMS_new_league_in_new_age_desc:0 "所有人都清楚，收复失地要求£GFX_OMS_black_league_texticon §s黑色联盟§!主动进行深刻变革。若安于现状，我们终将沦为又一个割据军阀，成为固守一隅的懦弱民族，不配称为伟大的俄罗斯国家，而是充斥着懦夫与谎言的国度。\n\n为此，我们正推动新一轮社会变革：让生活在各个掩体中的男女摆脱怠惰，重新唤醒战争文化，让人民再度为真正目标而献身。联盟不必再背离创立初衷，我们将再度化身为斯巴达式的战争机器，万众一心只为达成终极使命——彻底消灭£GFX_OMS_teutons_texticon §q条顿人§!。"
 OMS_changes_needed:0 "亟需变革"
 OMS_changes_needed_desc:0 "显然，我们的首批改革已见成效，但仍需进一步深化。亚佐夫对现状仍不满意——他的许多部下依然懈怠懒惰。在考虑消灭党卫军那群野蛮人之前，必须先清除£GFX_OMS_black_league_texticon §s黑色联盟§!队伍中的腐败分子。只有当每个人都恪尽职守、忠诚不渝、真正信仰我们的事业时，我们才能再次崛起于欧亚大陆。\n\n我们的新社会必须进行根本性的变革。多年来我们安逸地生活在没有条顿蛮子威胁的庇护所里，逐渐丧失了对事业的忠诚。这是何等的愚蠢。旧秩序与新秩序决不能继续并存，否则鄂木斯克将沦陷于我们曾经消灭的恶魔之手。"
 OMS_sacrifices_made:0 "必要牺牲"
 OMS_sacrifices_made_desc:0 "在我们的领土上，在我们的地堡里，腐朽正渗入每一道墙缝。我们已采取一切预防措施，试图净化我们用以拯救国家的工具，清除遍布全国的污秽，但这些叛徒和堕落者就像蟑螂一样。他们躲得了炸弹，却逃不过我们的制裁。\n\n清除地堡中的这些鼠辈将成为£GFX_OMS_black_league_texticon §s黑色联盟§!的首要任务。每一处缝隙和角落都必须彻查。绝不允许敌人多存活一秒。腐朽必将清除。联盟必将长存。为了祖国的存续，我们将采取一切手段处置这些叛徒。"
 OMS_stunning_silance:0 "表面之下的惊人寂静"
 OMS_stunning_silance_desc:0 "我们前线侦察兵的初步报告显示，辐射水平正在逐渐消散，联盟终于得以重返地表。现在是时候让公民将开垦训练付诸实践，慢慢驯服这片我们曾称之为家园的荒芜废土。这些措施包括在鄂木斯克城外建立地方检查站、重建军械车间，以及组建民用部门，以便我们再次建立正常运转的经济体系。\n\n假以时日，我们的祖国必将屹立于旧世界废墟之上，成为正义与文明的灯塔——一片充满力量、工业与尚武精神的土地。"
 OMS_matter_of_clarity:0 "澄清问题"
 OMS_matter_of_clarity_desc:0 "所有的多米诺骨牌都已倒下。总司令日夜精心策划的每一件事，都以这样或那样的方式完美实现了既定目标，£GFX_OMS_great_trial_texticon §x大审判§!已不可避免地走向了它的结局。所有的战斗和流血，所有对德国人的仇恨，皆以终结——而亚佐夫只感到前所未有的虚无。\n\n当那些被我们视为£GFX_OMS_teutons_texticon §q条顿余孽§!的最后残党悉数葬身雪原后，亚佐夫准备走出地堡，直面这场他亲手为德国人、乃至整个世界带来的地狱绘图。"
 OMS_once_more_into_the_breach:0 "再赴疆场"
 OMS_once_more_into_the_breach_desc:0 "£GFX_OMS_black_league_texticon §s黑色联盟§!正站在夺回祖国、荡平境外条顿威胁的悬崖边缘。因此，有必要通过将现有的地堡改造为坚固据点，构筑新的桥头堡，让我们能毫无顾忌地对敌人实施毁灭性打击。\n\n通过将旧堡垒改造成补给枢纽和检查站，我们的工程师与后勤军官将成为新一代战士的基石。这些在俄罗斯严酷废土上淬炼出的新战士，其意志力甚至将超越特种部队——而我们的据点将一路为他们提供坚实后盾。"
 OMS_form_new_regiments:0 "组建新军团"
 OMS_form_new_regiments_desc:0 "令人痛心的是，我们许多勇敢的同志在£GFX_OMS_great_trial_texticon §x大审判§!的最后关头壮烈牺牲。但这绝不会阻止£GFX_OMS_black_league_texticon §s黑色联盟§!继续战斗。从我们拯救的战士到下一代，我们将组建新的师来重振力量——甚至可能打造出一支比以往更强大的军队。\n\n联盟这支新生力量完全有能力让废土臣服。我们忠诚的战士将无所畏惧地前进，为总司令的伟业而战，以此告慰阵亡的战友。"
 OMS_break_open_the_caches:0 "打开军火库"
 OMS_break_open_the_caches_desc:0 "我们挚爱而珍贵的祖国如今笼罩在核尘埃之下，她的工业体系或化为灰烬，或遭拾荒者洗劫一空。随着总司令启动收复国土的准备工作，我们必须启用庞大的地下武库，为即将到来的民族解放斗争做好准备。\n\n为向未知领域发起伟大进军，联盟在征战过程中已积攒了从老式步枪到榴弹炮与装甲车在内的各类装备。然而这些庞大的储备终有耗尽之日，我们唯有祈愿在民族复仇大业重启之前，无论遭遇何种境况、何方势力，都不会掏空我们的军火库。"
 OMS_salvaged_tanks:0 "缴获的坦克"
 OMS_salvaged_tanks_desc:0 "我方侦察部队从地表传回惊人消息：在鄂木斯克掩体周边区域，发现大量保存完好的战前装甲车辆。这些坦克状态良好，经修复后可重新投入战场。\n\n这些坦克的型号与产地差异显著：部分印着条顿军团的徽记，另一些则是我们阵亡战友的遗物——它们如同沉睡的躯壳，至今仍在首都周边恍惚伫立。尽管整修工程需耗费时日，但能在战场上重新部署装甲部队的前景对新一代战士产生了巨大的吸引力。"
 OMS_our_chemical_arsenal:0 "复仇回响"
 OMS_our_chemical_arsenal_desc:0 "£GFX_OMS_black_league_texticon §s黑色联盟§!将重走牺牲战友之路，再次向西俄罗斯进军，如同昔日助祖国涤荡日耳曼暴政一般，净化这片混乱与无政府的土地。我军为挺进未知之境达成此目标，我们必须重新武装并全力支持。为最终摧毁那头条顿野兽，下一步须重建旧有铁路、兵站、工坊及运输我军进入废土的列车，以开启伟大的光复征程。\n\n待一切于我军必要的基础设施完工，我们将把下一代人锤炼成如往日那般的爱国战士。不容丝毫闪失。俄罗斯必须被拯救救，绝不能让条顿魔爪如瘟疫般重回祖国大地。"
 OMS_underground_workshops:0 "自地底，我们奋起反抗"
 OMS_underground_workshops_desc:0 "德国人，为了最后一次尝试保护他们腐朽的帝国免受我们的打击，在俄罗斯的土地上降下了原子烈火。他们相信我们会被毁灭。他们错了。在我们钢铁元帅不可动摇的意志下，£GFX_OMS_black_league_texticon §s黑色联盟§! 正从地底深处继续战斗，等待着机会，将我们的怒火再次倾泻到所有反对我们的人身上。时机一到，我们的军队将向那些仍在我们家园肆虐的幸存蟑螂们施以雷厉风行审判，向那些将我们的俄罗斯推入十年混乱深渊的人复仇。\n\n然而与此同时，在这荒芜的地表之下，并非一切安好。鄂木斯克综合设施那冰冷隔绝的围墙内，食物已开始匮乏，不忠的苗头再次在我们的队伍中蔓延。我们将着手解决这些迫在眉睫的问题，但此刻，我们的联盟依然屹立不倒。面对这场末日浩劫，它的钢铁之心依然强劲地搏动着。"
 OMS_control_the_heavens:0 "执掌苍穹"
 OMS_control_the_heavens_desc:0 "我们的军队日益壮大，但倘若我们的死敌仍能主宰我们的天空，他们就不过是行尸走铁而已。因此，£GFX_OMS_black_league_texticon §s黑色联盟§! 必须从废土上尽可能多地搜刮飞机，这至关重要。无论是昔日自由飞行员们简陋的双翼机，还是我们阵亡战友们的喷气机，我们都将回收它们，夺回天空，正如我们曾在通往荣光的道路上夺回俄罗斯一样。\n\n当我们的战机再度称霸天际之时，我们将确保敌人的毁灭，并将无边的恐惧播撒到他们踏足的每一寸土地。只要我们的联盟仍在云端狩猎，那些盘踞在我们土地上的匪徒与叛徒，就会如同畏惧神罚般畏惧太阳。"
 OMS_Leagues_Heart:0 "联盟之心"
 OMS_Leagues_Heart_desc:0 "“£GFX_OMS_black_league_texticon §s黑色联盟§!”历经战火与鲜血的淬炼下锻造出了一代钢铁之师，联盟在困境中坚不可摧的意志得到了充分的彰显。我们的军队宛如一台运转顺畅的精密机械，士兵们必须时刻准备着，将任何胆敢在我们难以触及的辐射肆虐真空地带与我们为敌的力量彻底粉碎。尽管我军大部分兵力在“£GFX_OMS_great_trial_texticon §x大审判§!”的高潮阶段溃散消亡，但新征召的战士已然崛起，并践行他们的战争使命。\n\n诚然，有些士兵或许比其他人更需要“爱国信念的灌输”，我们终将把渣滓锻造成钢铁核心。艰难时势造就强者，新一代军人必将成为我们收复俄罗斯疆域的锋利矛尖。"
 OMS_remind_them_of_their_duty:0 "提醒他们的使命"
 OMS_remind_them_of_their_duty_desc:0 "如同深埋地底的老旧枪械，在漫长的地下岁月中，我们公民的决心已锈蚀。有人质疑严格的粮食配给和戒严令的必要性，更有甚者还有人竟敢诽谤我们的元帅，甚至妄议£GFX_OMS_great_trial_texticon §x伟大审判§!的意义。该让他们重新认清自己在避难所中的位置了。\n\n我们将发动新一轮全民英雄主义宣传，覆盖所有社会阶层。无论老幼，皆须为祖国与牺牲的同胞奋战到底，为正义而战。当德国的污秽从地表清除之日，他们才会明白真正的胜利。在那之前，我们将继续战斗下去。"
 OMS_the_eagle_will_fall:0 "鹰必陨落……"
 OMS_the_eagle_will_fall_desc:0 "死亡与地狱皆不能阻挡£GFX_OMS_black_league_texticon §s黑色联盟§!为先辈赢取救赎的正义事业。瘟疫、饥荒、贪婪——这些凡人的软弱枷锁禁锢我们太久了。受够了！只要条顿人的阴魂不散，俄罗斯就永无宁日。权力倾轧我们挺过来了，统一战争我们挺过来了，我们也必将挺过撒旦的地狱烈火。\n\n苦难再不能蒙蔽我们真正的使命。无论十年、百年还是千年，我们都将追随总司令同志，直到我们的旗帜——永远飘扬在日耳曼尼亚上空。"
 OMS_no_matter_the_cost:0 "……无论代价如何"
 OMS_no_matter_the_cost_desc:0 "预言之日已经降临！我军整装待发，人民斗志昂扬，总司令意志如钢。废土世界正亟待解放，我们已无片刻犹豫的余地。\n\n正如先辈们昔日跨过莫斯科边境，今朝我们将深入幽冥之境，誓死完成使命。此刻不战，更待何时！"
