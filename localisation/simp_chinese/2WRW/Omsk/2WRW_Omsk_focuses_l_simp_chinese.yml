 OMS_decapitate_cerberus:0 "斩首看门狗"
 OMS_last_light:0 "终末微光"
 OMS_a_loyal_populace:0 "顺民归化"
 OMS_a_loyal_populace_desc:0 "唉，那些可怜的俄罗斯人命运多舛，长久以来四分五裂。在以往软弱愚蠢之人的压制下，我们的同胞或许会对新政府感到困惑。许多人提出投诉或疑问，询问£GFX_OMS_great_trial_texticon §x大审判§!是什么，为何我们的新俄罗斯社会如此专注于向£GFX_OMS_teutons_texticon §q条顿人§!复仇。  \n\n所幸，我们会为他们解惑。新公民将接受免费再教育，以便融入大众。很快，每个真正的俄罗斯人都会意识到，他们的心中也燃烧着复仇的怒火。而那些不这么想的人？哼，他们从一开始就不是真正的俄罗斯人……"
 OMS_spread_our_truth:0 "传播真理"
 OMS_spread_our_truth_desc:0 "沦陷区的俄罗斯同胞们！你们在日耳曼尼亚政权压迫下丧失尊严的日子已经太久。他们玷污了我们神圣的祖国，在这片土地上留下了累累伤痕。纳粹的枪炮与坦克迫使你们沉默的时间已经太久。然而，我们国家和人民的尚未失去希望。在光荣的£GFX_OMS_dmitry_yazov_texticon §Y亚佐夫元帅同志§!的指挥下，自由俄罗斯终于重获完整，而俄罗斯的民族解放才刚刚开始！\n\n§R所有不愿再让纳粹骑在头上的沦陷区勇士们，奋起反抗吧§!!"
 OMS_Expand_the_national_redoubt:0 "扩建堡垒"
 OMS_Expand_the_national_redoubt_desc:0 "尽管£GFX_OMS_black_league_texticon §s黑色联盟§!对防御工事的概念已相当熟悉，但我们做得还远远不够。一旦£GFX_OMS_final_war_texticon §e核战争§!爆发——£GFX_OMS_teutons_texticon §q条顿敌人§!已准备好拉着世界同归于尽，这种情况极有可能发生——俄罗斯人民将陷入悲惨的境地。伤亡数字将难以承受，而我们种族能否在£GFX_OMS_final_war_texticon §e核毁灭§!后存续也将成为疑问。\n\n曾在统一战争中证明其价值的乌拉尔山脉，应当像瑞士经营阿尔卑斯山那样被£GFX_OMS_national_redoubt_texticon §g彻底要塞化§!。虽非专为防御而建，但若战事不利，其能为大量民众提供庇护所的价值将无可估量。"
 OMS_final_offers:0 "最终审判"
 OMS_final_offers_desc:0 "£GFX_OMS_black_league_texticon §s黑色联盟§!为这一刻已筹备数十年。我们的总司令始终盼望着这一日将带来的荣耀。我们伟大祖国的每一分力量、每一缕意志都在推动着我们迈向命运。向£GFX_OMS_teutons_texticon §q德国§!发起£GFX_OMS_final_war_texticon §e最终复仇§!的时刻终于来临。  \n\n我们的复仇将迅捷如风。对俄罗斯之敌的仇恨与崇高怒火将如浪潮般喷涌。£GFX_OMS_national_redoubt_texticon §g国家防御§!设施已在山体下全面运作，为民众提供庇护，远离这场神圣战争引发的灾难。£GFX_OMS_teutons_texticon §q帝国§!必将被£GFX_OMS_final_war_texticon §e焚为灰烬§!。\n\n§R纵使天崩地裂，复仇亦将降临。§R"
 OMS_hung_jury:0 "悬而未决的审判"
 OMS_hung_jury_desc:0 "大审判已陷入僵局。尽管我们竭尽全力并做了充分准备，但如今部队已陷入寸步难行的境地。主力部队在持续数月的高强度推进后筋疲力竭——这般作战强度堪称史无前例。\n\n若要使§R大审判§!重振旗鼓并取得胜利，我们必须立即采取紧急措施，否则所有努力都将沦为一场§R失败§!。"
 OMS_yazovs_grace:0 "总司令之恩典"
 OMS_yazovs_grace_desc:0 "应对危机时，亚佐夫元帅不会像一个野蛮的条顿人那样，而是以俄罗斯此刻需要从领导人身上看到的沉着与威严来行动。人们看到的将不是一个强人所难的暴君，而是一个以身作则、值得追随的楷模。前线的战壕与后方的防空洞里，始终传递着他以磐石般稳控危局的形象——这正是俄罗斯民族集体坚韧精神的鲜活化身。无论幕后发生什么，我们的宣传机器都将确保——这就是前线将士与后方民众目睹并坚信的景象。"
 OMS_yazovs_fury:0 "总司令之愤怒"
 OMS_yazovs_fury_desc:0 "这种情况是不可原谅的。在我们即将完成对德国人的灭绝任务之际，联盟这些所谓的士兵竟然如此失职，这本身就是一种罪行。我们要让整个俄罗斯都清楚听到元帅的命令——必须以加倍斗志投入战斗。我们对俄罗斯遭受袭击的愤怒将通过亚佐夫宣泄——他是祖国俄罗斯对那些杀害她儿女之人的愤怒化身。\n\n值此危急存亡之秋，无论是后方还是前线，任何人若敢不全力以赴，都将受到黑手的严厉惩处——这支执行亚佐夫同志正义之名的部队绝不姑息。"
 OMS_throw_them_a_bone:0 "赦过宥罪"
 OMS_throw_them_a_bone_desc:0 "我们完全有理由严惩军官团——他们差点让§R大审判§!重蹈第一次西俄战争的覆辙。我们应当利用这一点。\n\n他们会预想最坏结局，而我们就要让他们确信深渊近在咫尺，最后再由他们仁慈的元帅施以援手——正是元帅的宽容与体谅，才给了他们继续战斗的机会。最终，所有近期意志动摇的军官都必须向亚佐夫本人宣誓效忠，并以加倍热忱投入战争。"
 OMS_make_an_example:0 "杀鸡儆猴"
 OMS_make_an_example_desc:0 "那些背叛俄罗斯及其麾下将士的人，理应对自己的下场感到恐惧。我们将以儆效尤，让这群无能的蠢货明白他们难逃惩处。任何非核心岗位的作战不力部队成员，都将立即接受审查。\n\n黑手将迅速展开对军官的调查：任何被认定在战时犯有渎职罪行者，皆以叛国罪论处。念及其往日功绩，我们将给予两种选择：要么面对行刑队的枪口，要么与那些被更优秀同僚俘获的德国战俘并肩度过战争余下的时光。"
 OMS_fresh_blood:0 "新鲜血液"
 OMS_fresh_blood_desc:0 "在我军基层军官队伍中，有许多前红军军官曾光荣地为祖国效力。当我们横扫西伯利亚、将俄罗斯从那些辜负祖国的人手中解放时，他们获准重新入伍。鉴于我军将领的屡屡失利，现在是重新评估这些军官并给予他们将功补过机会的时候了。\n\n比他们带来的技能更重要的是，这些军官获得了重生的机会，他们心知肚明。他们将感激总司令的恩典，并确保我军军官队伍展现出更凶悍的作风。因为他们深知：若不如此，等待他们的很可能是万劫不复的深渊。"
 OMS_with_renewed_vengeance:0 "以复仇之势卷土重来"
 OMS_with_renewed_vengeance_desc:0 "让德意志化为灰烬的使命未能完成，不仅是士兵的过错，更是那些本应引领他们走向胜利的所谓“领袖”的罪过。统一战争的胜利早已磨平了这些官僚的棱角，如今我们的战士正在为他们的懈怠付出代价，我们神圣的祖国亦在蒙受耻辱。我们不能让这种不公正继续存在下去。\n\n任何渎职行为都将面临严刑惩戒。我们要让每个宣誓效忠亚佐夫总司令的军官都牢记：懈怠职责的代价，远比履行使命的代价更加惨痛。暴力或许是德国人唯一能理解的语言——我们将确保我们的军官团精于此道，否则……"
 OMS_far_eastern_black_navy:0 "远东的黑海军"
 OMS_far_eastern_black_navy_desc:0 "The Japanese have a formidable navy. Whilst we have likely inherited a small fleet from whatever statelet existed in the East, the Japanese fleet will massively overpower it. A programme of research and development into naval capabilities is therefore required to even ward off the possibility of a Japanese naval assault."
 OMS_siberian_redoubts:0 "远东堡垒群"
 OMS_siberian_redoubts_desc:0 "Should the Japanese strike, they will almost certainly do an invasion using their Chinese lapdogs, as well as naval landings in the Far East. We shall cake the earth in their blood, should they try."