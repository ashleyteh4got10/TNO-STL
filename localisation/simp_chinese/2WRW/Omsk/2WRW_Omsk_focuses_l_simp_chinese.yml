 OMS_Together:0 "齐心协力"
 OMS_the_black_league_victorious_desc:0 "自卡尔贝舍夫同志的时代起，£GFX_OMS_black_league_texticon §s黑色联盟§!便只有一个目标：通过£GFX_OMS_great_trial_texticon §x大审判§!来拯救俄罗斯。但只要俄罗斯人民仍生活在水深火热之中，国家四分五裂，任凭宵小匪寇与残暴军阀摆布，此目标便永无实现之日。今日，弥合£GFX_OMS_teutons_texticon §q大日耳曼国§!数十年暴行与毁灭的第一步已经迈出；俄罗斯再度统一为一体。\n\n£GFX_OMS_dmitry_yazov_texticon §Y亚佐夫总司令§!将雷厉风行，将俄罗斯的灵魂重塑为一支向£GFX_OMS_teutons_texticon §q日耳曼部落§!施以正义天罚的力量。人民必须被教导，要尊崇三大理论，并憎恨那些窃取了他们祖国的£GFX_OMS_teutons_texticon §q日耳曼蛮族§!。他们必须在肉体、思想与灵魂上，都全身心奉献于£GFX_OMS_great_trial_texticon §x大审判§!。复仇已近在眼前，此刻唯余最后的备战之日。"
 OMS_black_boots_march_over_the_east_desc:0 "当我们重返西伯利亚时，从未幻想过会受到热烈欢迎。我们为国家的未来而战，逐屋争夺，逐田推进，最终推翻了东方政权。但事实证明，战胜西伯利亚政府仅仅是完成了半场战役。零星的叛乱势力已公然蔑视£GFX_OMS_black_league_texticon §s光复政府§!，分裂人民为£GFX_OMS_teutons_texticon §q日耳曼人§!棋局中的走卒。必须让他们认清错误——必要时不惜以武力教化。\n\n政委们将如潮水般涌向乡野，挺进东方。他们将净化这片冻原上滋长数十年的腐朽与顽疾，直至广袤的西伯利亚不再留存往昔的残渣与败绩。"
 OMS_teach_the_people_hate_desc:0 "普通的俄罗斯人早已迷失方向，在无尽岁月的苦难与折磨中随波逐流。有些人从出生起就只知道这样的生活，更多人则认命般地接受自己属于一个永远破碎、再难重现昔日荣光的国度。他们根本不明白，自己的一切被§q日耳曼蛮族§!掠夺到了何种地步。若要让£GFX_OMS_black_league_texticon §s黑色联盟§!赢得£GFX_OMS_great_trial_texticon §x大审判§!的胜利，我们必须彻底扭转整个俄罗斯这种听天由命的集体意识。\n\n人民必须认清自己所承受痛苦的真正分量。他们必须明白，£GFX_OMS_teutons_texticon §q日耳曼人§!如何窃取了他们现在、未来与过去的美好生活。俄罗斯人民必须为祖国的苦难而痛彻心扉，并从绝望中淬炼出钢铁般的心志与复仇的意志。人民终将认清他们的敌人，并以炼狱般的怒火仇恨他们。"
 OMS_give_them_the_tools_they_need_desc:0 "俄罗斯祖国与其人民从不缺乏意志力。无论男女老幼，这个民族的每个人都历经了无数暴行与不公。俄罗斯已准备好与£GFX_OMS_teutons_texticon §q日耳曼蛮族§!殊死搏斗——但我们英勇的国度唯独缺少一样东西：物资。\n\n在战争正式打响前，我们将为人民创造劳动、参军与生产的机会，让他们为战争贡献力量。我们将启动宏大的基建工程，在广袤国土上兴建工厂；我们将为从青年到老兵的所有人赋予使命；我们将以足以千百次粉碎§q帝国之鹰§!的工业实力与武器装备，为俄罗斯的£GFX_OMS_great_trial_texticon §x大审判§!做好万全准备。"
 OMS_everything_against_the_germans_desc:0 "毫无疑问，£GFX_OMS_great_trial_texticon §x大审判§!将是一场代价惨重的征途。即便是面对懦弱的叛徒与卑劣的革命渣滓，祖国统一战争已然让我们付出了沉重代价。而如今，我们要对抗的是玷污地表的一切邪恶之最——一个拥有将俄罗斯民族从地表抹除之能力，且正蓄意为之的恶魔。\n\n这场战斗必将艰苦卓绝、残酷至极。我们必须动员祖国的一切力量投入战争。每一块矿石、每一根木材、每一滴石油，都必须为胜利之名而牺牲。在这场对抗£GFX_OMS_teutons_texticon §q第三帝国§!的正义之战中，我们必须动用俄罗斯武库中的全部力量。从乌拉尔山脉到太平洋沿岸，我们必须耗尽每一处矿藏、每一发子弹、每一缕魂魄，以完成这场对抗£GFX_OMS_teutons_texticon §q民族社会主义§!的圣战。"
 OMS_controlling_the_masses_desc:0 "布哈林联盟败亡的关键因素之一，就是未能实现对信息的绝对掌控。尽管我们多次试图肃清黑市，但境外宣传品与各类腐化媒介仍渗透过我们神圣的边境。\n\n£GFX_OMS_dmitry_yazov_texticon §Y亚佐夫元帅§!及其忠诚追随者必将杜绝此类错误重演。所有边境通道与检查站都将废除\"隐私\"概念，除官方广播电视频道外一律取缔。在俄罗斯彻底摆脱£GFX_OMS_teutons_texticon §q条顿恶魔§!的威胁前，这类自由绝不可容忍！"
 OMS_enhanced_interrogation_techniques_desc:0 "我们虽非布尔什维克，但托洛茨基曾有过精辟论断：\n\n\"若目的正当，手段亦然。\"\n\n£GFX_OMS_teutons_texticon §q日耳曼人§!这等非人渣滓，必须被认清本质——他们不过是仇恨与战略情报的源头。其帮凶同谋亦当一视同仁。\n\n我们的审讯室地板上将铺满鲜血、断牙、指甲，以及人类眼球不应识别的异色。从这场£GFX_OMS_great_trial_texticon §x正义圣战§!遗留的破碎灵魂中，我们将榨取情报编纂成册。£GFX_OMS_teutons_texticon §q帝国§!的每栋建筑坐标，他们的每项技术机密，都将无所遁形。没有什么能逃过我们的注视，没有人能躲避我们正义的怒火。让敌人在战栗中等待审判吧。"
 OMS_bolster_the_secret_police_desc:0 "当£GFX_OMS_black_league_texticon §s鄂木斯克§!还只是西西伯利亚荒原上的一个边陲小国时，我们不得不依靠秘密警察来维持统治，以确保用最少的力量就能实现目标。如今£GFX_OMS_black_league_texticon §s黑色联盟§!的阴影已笼罩整个俄罗斯，这一铁律依然未变。\n\n但作为俄罗斯的新任守护者，我们不能再以弹丸之国或外无强敌的思维行事。秘密警察规模将扩大一倍，以严密监管新收复的领土。我们的安全机构必须举世无双——因为阻碍£GFX_OMS_great_trial_texticon §x大审判§!之敌浩如烟海，而我们势孤力薄。"
 OMS_a_docile_populace_desc:0 "唉，那些可怜的俄罗斯人命运多舛，长久以来四分五裂。在以往软弱愚蠢之人的压制下，我们的同胞或许会对新政府感到困惑。许多人提出投诉或疑问，询问£GFX_OMS_great_trial_texticon §x大审判§!是什么，为何我们的新俄罗斯社会如此专注于向£GFX_OMS_teutons_texticon §q条顿人§!复仇。  \n\n所幸，我们会为他们解惑。新公民将接受免费再教育，以便融入大众。很快，每个真正的俄罗斯人都会意识到，他们的心中也燃烧着复仇的怒火。而那些不这么想的人？哼，他们从一开始就不是真正的俄罗斯人……"
 OMS_a_generation_of_rage_desc:0 "在迎接£GFX_OMS_great_trial_texticon §x大审判§!之际，我们绝不能忘记祖国青年一代的重要性和责任。不可对他们疏于教导，否则他们或将无法认清我们事业的意义，甚至可能对£GFX_OMS_teutons_texticon §q德国§!产生同情。孩子极易被误导，他们的思想也极易被£GFX_OMS_teutons_texticon §q条顿人§!的宣传所侵蚀。俄罗斯的未来不容被腐蚀。\n\n孩子们将被教导有关£GFX_OMS_teutons_texticon §q蛮族§!的罪行和历史，认清他们作为战争贩子和野蛮人的本性，这些民族从未为世界作出贡献，只是地球上的毒瘤。他们必须认清敌人本质，明白俄罗斯苦难的根源。让每个俄罗斯儿童都清楚：我们的敌人是£GFX_OMS_teutons_texticon §q德国人§!，唯有£GFX_OMS_teutons_texticon §q德国人§!，对他们的罪行只有一种制裁：§e灭绝。§!"
 OMS_Reworking_The_Economic_Sector_desc:0 "尽管£GFX_OMS_dmitry_yazov_texticon §Y亚佐夫元帅§!希望彻底摧毁£GFX_OMS_teutons_texticon §q纳粹霸权§!，但他也深知£GFX_OMS_great_trial_texticon §x大审判§!的代价。直到做好万全准备前，我们不能盲目地跟£GFX_OMS_teutons_texticon §q德国人§!硬碰硬。一系列旨在快速工业化的政策将逐步实施。此外，我们将全面审查财政预算，削减一切非必要开支。如果能省出钱来，每一分钱都应该用在子弹上！"
 OMS_Technological_Advancement_desc:0 "£GFX_OMS_black_league_texticon §s黑色联盟§!当然不会无脑地让我们的青年用自己的尸骨为通往日耳曼尼亚的道路铺路。我们将以最高效率利用现有资源。当科学摆脱诸如“道德”或“良知”之类的人为枷锁时，它所释放的力量将使§q我们可恶的£GFX_OMS_teutons_texticon 敌人§!深入骨髓的颤抖。\n\n£GFX_OMS_black_league_texticon §s黑色联盟§!还将通过招募因“伦理”等观念而无法实现梦想的失意外国科学家，来提升我们的武器装备。让世界最顶尖人才的是真实力量倾泻到£GFX_OMS_teutons_texticon §q条顿人§!身上吧！"
 OMS_A_True_War_Economy_desc:0 "众所周知，在西方，军工复合体在经济中扮演着举足轻重的角色，尤其是对于德国和美国这样的超级大国。然而，在这些国家，它们的退化已导致其体系分崩离析。£GFX_OMS_black_league_texticon §s黑色联盟§!绝不会容忍，也不能容忍这些错误。\n\n我们的军事化经济必须通过收购西俄罗斯境内每一家私营工厂，实现由国有企业的完全主导。唯有如此，我们才能清晰统计、调配、并迅速清算任何胆敢损害我们效率的单位。"
 OMS_Expansion_Of_The_Bunkers_desc:0 "尽管£GFX_OMS_black_league_texticon §s黑色联盟§!对防御工事的概念相当熟悉，但我们做得还远远不够。当£GFX_OMS_final_war_texticon §e核战很可能爆发§!时，我们的£GFX_OMS_teutons_texticon §q条顿蛮人§!已准备好与全世界同归于尽，俄罗斯人民将陷入悲惨境地。人员伤亡将不可容忍，我们的种族能否在£GFX_OMS_final_war_texticon §e核浩劫§!后存续也将成为疑问。\n\n乌拉尔山脉在我们统一战争期间已证明其价值，应当像瑞士经营阿尔卑斯山那样£GFX_OMS_national_redoubt_texticon §g彻底要塞化§!。虽然这些防御工事未必会用于作战目的，但若战争失利时，能为我国相当比例的人口提供庇护所将具有无可估量的价值。"
 OMS_The_Men_On_The_Front_desc:0 "开战已迫在眉睫。自我们征服西伯利亚以来，这已是众人心里再清楚不过的事实。£GFX_OMS_teutons_texticon §q纳粹德国§!随时可能先发制人，£GFX_OMS_black_league_texticon §s联盟§!必须对西方潜在的入侵保持高度警惕。若待彼时再行动员，就为时已晚了。\n\n必须即刻在全国范围内实施更为严苛的征兵制度。唯有如此，我们方能争取时间，将俄罗斯的男女锤炼成高效而嗜血的战争机器。"
 OMS_Dig_Deeper_desc:0 "俄罗斯的自然资源丰沛无比，其中许多资源对一国在欧亚大陆上发动全面战争至关重要。随着对西伯利亚的征服，我们又获得了额外的战略储备可供开发。内战中的敌人已然败北，这证明他们无力完全掌握矿石、橡胶、贵金属与木材的开采技艺，以支撑战争所需。\n\n£GFX_OMS_black_league_texticon §s联盟§!将把我们的高效开采模式推广至力所能及的每一寸土地。"
 OMS_The_Men_In_The_Factories_desc:0 "自古以来，苦役便是惩处重罪犯的惯常手段，在我们的祖国俄罗斯更是如此。然而，以往那些犯下轻罪的人大多逃过了这种残酷的命运。\n\n现在，这一疏漏必须立即纠正。虽然谈不上多么艰苦，但所有罪犯都将被送上生产线。唯有通过无休止的劳作，这些不受欢迎的社会渣滓才能赎罪。造子弹，换面包。"
 OMS_Expand_The_Bunkers_West_desc:0 "当乌拉尔与西伯利亚西部的£GFX_OMS_national_redoubt_texticon §g防御工事§!在紧锣密鼓地建设时，我们切不可忽视对抗所谓“莫斯科专员辖区”的真正前线。从白海至里海，边境线必须被武装到牙齿。每一处渡口、每一道隘口、每一片森林，都将由£GFX_OMS_black_league_texticon §s黑色联盟§!装备精良的战士们镇守。届时，£GFX_OMS_teutons_texticon §q条顿人§!必将学会敬畏祖国俄罗斯与她愤怒的儿女。"
 OMS_Remove_The_Excess_desc:0 "俄罗斯的经济长期以来依赖于各类消费品。尽管其中某些产品对社会的正常运转至关重要，但另一些却超出了基本需求，近乎奢侈。只要此类奢侈商品依然存在，我们与敌人的对抗便处于劣势。£GFX_OMS_dmitry_yazov_texticon §Y亚佐夫元帅§!将确保祖国俄罗斯彻底铲除这种浪费型消费行为。"
 OMS_Separate_The_Wheat_From_The_Chaff_desc:0 "£GFX_OMS_black_league_texticon §s黑色联盟§!对其麾下子民的要求唯二：至坚的信念与无匹的意志。俄罗斯必须强大、忠诚，且时刻准备为联盟效力。我们绝不姑息软弱，更不会对意志薄弱者施以怜悯。若要击退£GFX_OMS_teutons_texticon §q敌寇§!，岂容孱弱之徒拖累后腿。\n\n我们将推行一系列针对公民的考核与计划。公民必须接受严苛的测试，确保其忠诚与力量。任何劣等者都不允许参加对抗£GFX_OMS_teutons_texticon §q德国佬§!的作战。未通过考核者，将被安排至更……适宜的岗位。我们将锻造一支无懈可击的军官团，誓将£GFX_OMS_teutons_texticon §q条顿人§!的堕落与邪恶彻底扫除。"
 OMS_Produce_Only_What_You_Need_desc:0 "俄罗斯经济的很大一部分仍由农业驱动，无论是我们的政权还是西伯利亚政权，都曾依赖过剩谷物的出口以换取外汇。然而，这种做法如今已然过时。\n\n£GFX_OMS_black_league_texticon §s联盟§!将系统性地评估我们的农业生产能力，并将其调整至更适宜的规模。更多的农民将转而操作机床，生产用于消灭£GFX_OMS_teutons_texticon §q条顿人§!的手榴弹和步枪子弹，而非黑麦。战争将夺走许多人的生命，因此俄罗斯对粮食的需求终将日益减少。"
 OMS_More_For_The_Soldiers_desc:0 "人类会理所当然地选择收益最高的职业，我们将利用这一点以协助征兵计划。军队将优先获得一切可能的物资，并配发普通民众难以获得的那些商品。此外，我们还将为军人家属提供类似的优待。有了家人的安稳保障，更多的俄罗斯人将蜂拥加入£GFX_OMS_black_league_texticon §s黑色联盟§!。"
 OMS_To_Beat_The_Germans_desc:0 "£GFX_OMS_black_league_texticon §s我们民族§!曾为统一祖国付出了无数牺牲，而今更将为击败£GFX_OMS_teutons_texticon §q条顿威胁§!而战。我们绝不向£GFX_OMS_teutons_texticon §q纳粹渣滓§!低头、屈服。但若为守护我们的文化与种族免遭威胁，我们甘愿£GFX_OMS_final_war_texticon §e做出终极牺牲§!。我们将£GFX_OMS_final_war_texticon §e焦土千里，荡平他们的城市§!，让他们的文明尝到昔日施加于我们的痛苦之万一。我们将不惜一切代价取得胜利。"
 OMS_We_Must_Use_Every_Advantage_desc:0 "对于这场即将到来的冲突，唯有每一位俄罗斯人展现出钢铁般的意志，方能夺取£GFX_OMS_final_war_texticon §e最终胜利§!。尽管敌人因残暴与蛮力而顽固不化，但我们的仇恨必将更胜一筹。我们的精神将指引我们前行，但仅凭勇气无法击退敌人。相反，我们的军队必须学会适应战场环境，而我们的社会也需为持久战做好准备。当口粮被征调前线时，每位公民都须知道如何应对；当身处绝境时，每位士兵都须懂得如何求生。\n\n至于我们的政府，更需穷尽一切可能的优势。假意讨好美国、散布虚假情报皆在所不惜。毕竟，他们曾将我们弃于£GFX_OMS_teutons_texticon §q纳粹§!的铁蹄之下。\n\n§R这是他们欠我们的。§!"
 OMS_The_Fertile_At_Home_desc:0 "俄罗斯民族作为一个庞大族群存续的重要性，不亚于消灭£GFX_OMS_teutons_texticon §q条顿蛮族§!。倘若我们为这项£GFX_OMS_final_war_texticon §e事业§!牺牲所有男性，五十年后我们的国家将沦为寡妇与老妇的国度。我们必须优选出具有天然生育能力的女性，她们将在必要时肩负起人口复兴的重任。此外，£GFX_OMS_black_league_texticon §s联盟§!将通过宣传攻势嘉奖多产母亲，授予她们荣誉勋章、额外配给与公众表彰，以此提升我们低迷的生育率。"
 OMS_The_Rest_In_The_Army_desc:0 "我们社会中某些女性因具有“男性化”特征而受到传统主义者的轻视，被认为天生不适合家庭主妇等角色。这种对俄罗斯民族有用成员的歧视必须彻底终止。我们将帮助这些能力出众的女性找到更适合的职业——这些职业为家族带来的荣耀，绝不会亚于任何男性。让£GFX_OMS_teutons_texticon §q条顿人§!在俄罗斯英勇女儿们的战吼前颤抖吧！"
 OMS_Men_In_The_Service_desc:0 "£GFX_OMS_black_league_texticon §s黑色联盟§!的士兵们相对轻松地击败了东方那些堕落的敌人，但我们军队必须意识到，£GFX_OMS_teutons_texticon §q下一个对手§!将难以抵御，更遑论将其击败。£GFX_OMS_teutons_texticon §q纳粹§!很可能拥有完全的空中优势、重型坦克以及大量可供调遣的武器。然而，他们对士兵实力的骄傲终将成为他们的掘墓之钉。\n\n£GFX_OMS_black_league_texticon §s联盟§!能够，也必将组建一支足以抗衡£GFX_OMS_teutons_texticon §q日耳曼蛮族大军§!的部队。此外，平民将被编入民兵军团，负责西俄各城市的巡逻与预警。唯有以预备役士兵完全覆盖整条战线和我们的城市，战争的恐怖怒火才能被阻隔在边境之外。"
 OMS_Together_desc:0 "俄罗斯家庭应当以£GFX_OMS_black_league_texticon §s民族复国政府§!为榜样。慈爱而坚强的父亲，将以无可挑剔的本能与枪法守护家庭；温柔而坚韧的母亲，会庇护子女远离危险，并传授他们生存所需的技能；而作为£GFX_OMS_black_league_texticon §s联盟§!预备成员的孩子们，则须明白自己作为俄罗斯人肩负的责任——彻底消灭£GFX_OMS_black_league_texticon §q纳粹渣滓§!。军事化的理念必须深入每个公民的家庭！"
 OMS_Boys_In_The_Factories_desc:0 "我们的祖国幅员辽阔，养育了数百万人民。其中许多人无法亲自上阵保卫她，但有一群自愿者——尽管不能在前线作战，仍可通过生产武器，为我们的£GFX_OMS_final_war_texticon §e终极决战§!贡献力量。平均而言，儿童比成人更具爱国情怀，对我们的理想更为忠诚。若让他们投身工厂劳作，我们或将在对抗西方威胁时占据优势。"
 OMS_more_ears_on_the_border_desc:0 "随着£GFX_OMS_great_trial_texticon §x大审判§!的临近，再多的准备与情报也不为过。自我们首次与德国领土接壤以来，潜伏在西俄罗斯和乌克兰的休眠特工网络将被激活。德国军队的人员调动与物资运输，将无一能逃过£GFX_OMS_black_league_texticon §s黑色联盟§!的暗眼与潜耳。唯有如此，我们的圣战方能成为一场有把握的军事行动。"
 OMS_print_more_propaganda_desc:0 "占领区的俄罗斯同胞们！你们在日耳曼尼亚政权的压迫下苟活已久，尊严荡然无存。他们玷污我们神圣的祖国太久了，在这片土地上留下累累伤痕。你们在纳粹的枪炮与坦克威慑下沉默太久了。然而，我们民族与人民的希望尚存。在光荣的£GFX_OMS_dmitry_yazov_texticon §Y亚佐夫元帅同志§!的领导下，自由俄罗斯终归完整，但俄罗斯的民族解放才刚刚开始！\n\n§R不甘再让纳粹骑在头上作威作福的英勇占领区同胞们，奋起反抗吧！§!"
 OMS_the_black_league_listens_desc:0 "即便时至今日，俄罗斯境内仍存有异议分子。£GFX_OMS_black_league_texticon §s黑色联盟§!意图将国家锻造成对抗条顿蛮族的战争巨兽，可诸多知识阶层人士公然反对此决策，转而鼓吹诸如“结社自由”或“申诉权利”此等个人主义、物质至上、自私自利的谬论。此类行径于£GFX_OMS_great_trial_texticon §x大审判§!有百害而无一利，必须将其从社会中彻底铲除。让那些暗藏的条顿奸细颤抖吧！他们口中吐露的每一字，无论何时何地，都将成为其罪证！"
 OMS_the_tvs_will_run_black_desc:0 "电视乃人类最伟大的造物之一，其传播信息之迅捷，前所未有。每当新兴媒介诞生之际，£GFX_OMS_black_league_texticon §s黑色联盟§!必当全面掌控，以确保我国与人民免受宿敌那亵渎而蛊惑的宣传所玷污。自然，为安抚民众，娱乐节目仍可留存于荧屏之上，但我们必须确保每一粒像素皆纯粹属于俄罗斯！"
 OMS_the_factories_will_be_without_dissent_desc:0 "俄罗斯母亲的机械或许不及西方精良，但每一台设备都由勤劳的工人驱动，而世上再无他国能孕育如我国这般赤诚的劳动者。然而，受军阀割据余毒所害，俄境内诸多工厂至今未能统一工时与生产定额。更甚者，管理层与工人称兄道弟之风盛行，致使国家法规形同虚设。此等乱象，必须革除。\n\n若仍执迷不悟，他们生产的造物终将为其掘墓六尺！"
 OMS_and_the_league_knows_all_desc:0 "联盟的摄像头、窃听器及线人网络遍布俄罗斯全境。我们收集处理的情报量远超常人想象。这一切都是为了保卫祖国，根除那些毒害伟大祖国的条顿同情分子与其他社会渣滓。任何人或势力都休想阻挡我们伟大的指挥官。\n\n毕竟...若心中无鬼，何须畏惧£GFX_OMS_black_league_texticon §s黑色联盟§!的全知之眼与全闻之耳？"
 OMS_lock_down_the_west_desc:0 "我们战胜纳粹帝国的关键，在于严格控制全国范围内的人员流动。当务之急是与各地区长官会晤，勒令其确保民众时刻身处应居之地。唯有如此，方能揪出潜伏的破坏分子与敌国间谍，并迅速予以肃清。\n\n为此，宵禁须融入每个俄罗斯人的日常，一切非必要的人员流动必须即刻停止。若有人能无官方许可证件便擅赴邻镇，那敌特渗透的危险就将如影随形！"
 OMS_fortify_the_vastness_desc:0 "我们与那非法而可鄙的德国占领区“莫斯科维恩”之间的边界，堪称世界上最长的政治分界线之一。有人会妄言，试图全线驻守如此辽阔的疆域实属徒劳。但此等鼠目寸光之辈，岂能理解俄罗斯意志即将铸就的伟业？\n\n沿此边境，我们将构筑绵延千里的堑壕与防御工事，打造属于我们的哈德良长城，以抵御国境线外的那群条顿渣滓。寸土不失，铁壁森严，此乃£GFX_OMS_black_league_texticon §s黑色联盟§!的钢铁意志！"
 OMS_depopulate_the_villages_desc:0 "为真正迎接£GFX_OMS_great_trial_texticon §x大审判§!，彻底消灭条顿蛮族，我们必须首先巩固莫斯科边境的防线。边境村落将被清空，代之以驻军。自此再无平民掣肘，我们既可全力构筑防御工事，同时让士兵安然入驻农舍。\n\n当条顿人踉跄闯入我国边境时，迎接他们的唯有铁与血。他们引以为傲的装甲部队，将深陷于我们布设的内陆防御阵地，在炮火轰鸣中分崩离析。"
 OMS_dig_the_trenches_desc:0 "战争动员对俄罗斯大众而言并不陌生。自20世纪40年代以来，平民历经了血与火的淬炼，黑色联盟亦是如此。尽管苏联时代的城市规划师曾以国防为考量布局定居点，但战争证明，若天真地以为城镇摆在那里敌人就不会将其夷为平地，实属幼稚。\n\n现代总体战要求更彻底的牺牲，我们绝不能重蹈布哈林主义者的覆辙，令神圣的祖国再度沦丧。战端未启之时，唯有依托纵横交错的堑壕与要塞网络，我们的士兵方能迈向胜利。"
 OMS_and_the_league_is_secure_desc:0 "£GFX_OMS_dmitry_yazov_texticon §Y亚佐夫元帅同志§!正注视着俄罗斯，为了她£GFX_OMS_final_war_texticon §e仅存的，也是最后的历史使命§!而不懈劳作。在全俄罗斯的土地上，人民的生命从未像现在这样安全，免受日耳曼匪帮的威胁——正是他们曾残酷地屠戮我们的人民。日耳曼间谍休想再探得任何情报，因为我们守口如瓶，目光如炬。纳粹的野兽休想突破我们的防线，因为我们数不尽的枪炮与工事会将他们深埋入土。我们国家与民族的团结再也不会受到挑战，因为我们慈父般的£GFX_OMS_dmitry_yazov_texticon §Y亚佐夫元帅同志§!，将指引俄罗斯走向唯一的胜利。£GFX_OMS_black_league_texticon §s黑色联盟§!再也不必担心颠覆破坏，因为联盟如今与俄罗斯母亲同在，§R无论她是否愿意§!。"
 OMS_a_safe_frontline_desc:0 "从总天使弥哈伊尔之城到里海之滨，民族复国政府终于为与德国的潜在冲突做好了准备。一道由钢铁、混凝土、血肉与意志筑成的铁幕，在数十年战争的磨砺下愈发坚固，在原始仇恨的驱动下熊熊燃烧，已将两个注定要相互毁灭的国家之间的险恶边界牢牢封锁。两个国家，除了对彼此的仇恨之外，再无其他。两个国家，其中只有一个能够屹立不倒。要么是野蛮德国的彻底毁灭，要么就是我们。绝不能有任何怜悯或犹豫。一切准备就绪，£GFX_OMS_black_league_texticon §s黑色联盟§!的忠诚士兵们正等待着£GFX_OMS_dmitry_yazov_texticon §Y亚佐夫元帅同志§!下达那早已许诺的命令。\n\n§R复仇§!。"
 OMS_true_league_comrades_desc:0 "这位俄罗斯人意志如钢、力量非凡且智慧深邃。他深知£GFX_OMS_dmitry_yazov_texticon §Y亚佐夫元帅同志§!绝不会伤害任何同胞，更不会危害他日夜守护的祖国——那亿万人民赖以生存的母土。他明白民族复国政府要求牺牲，绝非为了制造苦难，而是为了拯救仍笼罩在条顿阴影下的子民。他懂得军队的铁律与严苛，只为让祖国的每个士兵都如纳粹渣滓中最凶残者般强悍。他知晓秘密警察巡行街道，只为肃清间谍与异族分子，§R终有一日，俄罗斯人必将向最憎恶之敌施以雷霆般的复仇§!。 "
 OMS_overhaul_intelligence_operations_desc:0 "条顿蛮族的情报机构诡谲阴险，若要在£GFX_OMS_great_trial_texticon §x大审判§!中取得进展，此患断不可轻忽。我们必须在这无形的战场上抢占先机，方能立于不败之地。当大军横扫所谓的“莫斯科专员辖区”伪政权时，必会遭遇其垂死挣扎般的破坏活动，然而这只是妄图阻挡俄罗斯母亲怒火的痴心妄想罢了。\n\n凭借20世纪50年代末以来发展起来的国内外相结合的理念与技术，任何条顿败类都逃不过£GFX_OMS_dmitry_yazov_texticon §Y亚佐夫元帅同志§!的法眼！"
 OMS_found_the_sbo_desc:0 "\n\n\n\n\n\n\n\n£OMS_sekretno"
 OMS_rehabilitations:0 "“康复”疗程"
 OMS_rehabilitations_desc:0 "在统一战争的烽火中，无数苏联英雄豪杰曾与条顿蛮族浴血奋战，其中不乏伟大卫国战争锤炼出的钢铁战士。有人在大动乱时期折戟沉沙，也有人因阻挠黑色联盟光复故国的伟业被我们关进狱中。\n\n鉴于这些迟暮老兵的军事才能，以及他们迄今为止诛杀德寇的数量远胜我军多数将士的事实，我们决定重新评估这些苏联遗老的档案。他们面前摆着清晰的选择：要么在大审判降临前向神圣的俄罗斯母亲及其指挥官宣誓效忠，要么以抗命之罪在牢狱中度过余生。我们期待他们做出正确的选择。"
 OMS_expand_arsenal_of_vengeance:0 "扩大复仇之刃"
 OMS_expand_arsenal_of_vengeance_desc:0 "我国曾在与条顿蛮族及其怯懦仆从的鏖战中遍体鳞伤。这些强盗掠夺我们的资源，奴役我们的同胞，用沾满血污的财富构筑起凌驾于我们的霸权——若要使§R大审判§!功成，我们必须跨越过去数十年划出的技术鸿沟。\n\n如今西伯利亚的财富重归祖国怀抱，值此危急存亡之秋，我们将不惜代价打造数座军工综合体城市。它们将成为人类史上最先进的核生化武器产业链，并配备陆海空全域投送载具。§R当向日耳曼尼亚进军的号角响起，我们将用德国蛮子闻所未闻的全新武库震慑他们的头脑。§!"
 OMS_field_experiments:0 "实地实验"
 OMS_field_experiments_desc:0 "化学武器的大规模试验与研发已沉寂数十年，直到近期，我们才重启这类武器的研究工作，将仇恨的信息传递给敌人。值得庆幸的是，在我们取得这一领域重大进展的同时，我们那些毫无人性的敌人在安于现状、停滞不前。\n\n在未来战争中，我们的士兵同志将无需再依赖团级支援火炮来获得我们复仇武器的支援。我们将把这些承载民族怒火的武器改造为普通步兵可携带的装备，让成千上万的爱国者拥有腐蚀敌人身体的能力，就像他们曾试图腐蚀我们伟大祖国那样。"
 OMS_brutalisation_of_russia_desc:0 "时至今日，我们的祖国仍在为过去的灾难泣血。只要世界的任何角落仍有同胞遭受欺辱，£GFX_OMS_black_league_texticon §s黑色联盟§!便不配自诩祖国与人民的捍卫者。放眼亚洲腹地，斯拉夫同胞仍在中亚宵小与日本的偏见中挣扎。侵略者持续在俄占区推行\"去俄化\"暴政，而游击队始终如钢钉般固守据点。相比我们的德国大敌，这些敌人正好能充作部队的磨刀石，既能彰显我们的雷霆之威，也能让这些叛徒国家得到应得的报应"
 OMS_delivering_our_message:0 "信息传递到位"
 OMS_delivering_our_message_desc:0 "我们挚爱的祖国在与西方条顿恶兽及其懦弱爪牙的鏖战中伤痕累累。数十载光阴虚掷，而今我们必须在关键军事领域奋起直追。若在往昔，这或许举步维艰，但西伯利亚富源的收复即将扭转乾坤。\n\n在我们治下，必将倾尽所有重建俄罗斯的碧海屏障，让无敌舰队再度巡弋疆域。新组建的战略火箭军将以雷霆之威，将死亡倾泻于宿敌之土；得益于核生化武库的现代化革新，每一击都将更具毁灭之力。待§R大审判§!降临之日，我们手握万钧利器，誓将德意志民族彻底荡平，§R令日耳曼尼亚化为余烬未熄的焦土巨坑§!。"
 OMS_the_great_equalizer:0 "众生平等"
 OMS_the_great_equalizer_desc:0 "在一系列加急研发后，416工程终于可以在新近解放的中亚沙漠地区中测试了。此款武器以黑色联盟缔造者之名命名，它将成为我们彻底抹除日耳曼尼亚历史的利器。此等武器威力无匹，仅一枚便可令整个条顿武库黯然失色，单单提及它的名号，便足以令俄罗斯之敌闻风丧胆。\n\n倘若成功，我们将最终拥有一款武器，它不仅能弥合我方与敌人在炸弹与导弹数量上的差距，更能一举摧毁条顿帝国的核心。唯有如此，方能倾泻我们对德意志人的刻骨仇恨。"
 OMS_thousand_lakes_run_red:0 "让血溅千湖"
 OMS_thousand_lakes_run_red_desc:0 "在俄罗斯的敌人中，背信弃义的芬兰人常被盘踞在日耳曼尼亚的更大罪恶所掩盖，尽管他们对我们人民的罪行已持续数世纪。这些野蛮人始终是瑞典人的忠仆，长期充当俄罗斯文明开化北欧地区的第一道防线。当今的芬兰，或许是有史以来最为卑劣的：这个伪善者沦为德国仆从的帮凶，在卡累利阿地区对俄罗斯人实施种族清洗，却自诩比德国人更高尚。\n\n芬兰人对俄罗斯民族的嘲弄到此为止。这场行动或将成为§R大审判§!的预演，黑手行动组将踏入千湖之国，用那些自以为能伤害我们人民却未逍遥法外者的鲜血染红这片湖泊。"
 OMS_operation_apraksin:0 "阿布拉欣行动"
 OMS_operation_apraksin_desc:0 "是时候该用武力纠正芬兰独立的历史性不公了，给这个怯懦的条顿走狗最后一击。1939年苏联未竟的事业，今天我们将以一场令他们永无翻身之日的钢铁洪流来取得成功。一旦我们得手，条顿人及其麾下所有斯堪的纳维亚附庸必将倾巢驰援赫尔辛基的非法傀儡政权。让他们来吧——我们只需碾碎他们，反而能为解放莫斯科扫清障碍。\n\n对芬兰的军事征服仅是第一步。待其军队覆灭后，我们将彻底粉碎其民众的意志。沙皇百年恩泽未能实现之事，我们将在一年内完成。当尘埃落定，他们的抵抗意志不仅会被击溃，芬兰这个概念本身也将灰飞烟灭。"
 OMS_in_bobrikov_footsteps:0 "追寻博布里科夫"
 OMS_in_bobrikov_footsteps_desc:0 "随着芬兰军队及其瑞典操纵者被彻底击溃，彻底解决芬兰问题的时机已然成熟。第一次世界大战中断并延误了本应持续半个多世纪的对这片昔日沙皇领土的蛮荒之地进行文明开化的进程。我们祖先的善意努力不出所料地遭遇暴力回应，暴力是北欧人民除了虚伪之外唯一听得懂的语言。大公国对条顿人的牲畜太过仁慈，这种错误黑色联盟绝不会重蹈覆辙。\n\n若说解放芬兰是§R大审判§!的预演，那么对该国的平定便是我们如何将各苏维埃共和国重新并入俄罗斯的序曲。我们将在芬兰部署全套预备役部队，踩住俄罗斯敌人群体的咽喉直至其永世无法再度集结为一个民族。"
 OMS_sharpen_our_swords:0 "磨利我们的剑刃"
 OMS_sharpen_our_swords_desc:0 "在完成伟大卫国战争损失的大部分善后工作后，我们终于可以着手为§R大审判§!进行最终准备。复仇的利剑将成为我们迅捷的惩戒之刃，斩断条顿人的头颅。我们不仅在火力上追赶着日耳曼蛮子，技术层面同样如此。\n\n虽然我们仍缺乏安全部署416工程的方案，但随着俄罗斯领土的持续解放，现已能够测试可在§R大审判§!首日打击德国本土的导弹。一旦成功，这些饱含我们民族复仇怒火的武器将投入量产，将常规弹头与生化武器倾泻在他们的诅咒之地。"
 OMS_Focus_Top_Secret:0 "§R绝密§!"
