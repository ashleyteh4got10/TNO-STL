 USA_Jimmy_Carter:0 "吉米·卡特"
 POLITICS_JIMMY_CARTER_DESC:0 "人们常说好人不能当选总统。虽然吉米·卡特并非完美无缺，但他或许还能证明他们错了。\n\n卡特出生在佐治亚州，本名为小詹姆斯·厄尔·卡特，他出身卑微，生活简朴，这让他形成了平民主义政纲和受基督教影响的独特自由主义。尽管他的个人信念偏离了党派路线，使他看起来像一个政治局外人，但他担任州参议员和后来担任佐治亚州州长的经历使他在政府行政和立法部门都拥有丰富的经验。在民主党内，卡特代表了一个更为温和的派系的出现；虽然他对德国或日本的态度绝不软弱，但他一直致力于更加重视人道主义目标和对外援助。\n\n如今，尽管面临重重困难，卡特终于入主白宫，他的总统任期已经带来了一种变化之风。曾经困扰华盛顿的冷酷悲观情绪正在慢慢消散，取而代之的是谨慎积极的温暖气氛。唯一的问题是卡特能否平衡他的善良天性和作为总司令所面临的困难。因为如果和熙暖风与刺骨寒风冲突太久，即使是最好的意图也会造成一场萎靡不振和停滞不前的风暴，一场可能会在未来几年摧毁人们对白宫的信心的风暴。"
 NPP_collapse.1.t:0 "硬帽暴动"
 NPP_collapse.1.desc:0 "今日波士顿街头，愤怒的学生抗议者们挤满了人行道，他们对美国军队介入中东事务的愤慨与忧虑溢于言表。随着愈演愈烈的石油危机升级为美国对其他国家的进一步干预，年轻的美国人，特别是那些可能被征召的年轻美国人，他们作为抗议主力在波士顿市中心举行了长达8小时的抗议活动。尽管防暴警察试图驱散人群，但依旧徒劳无功。\n\n抗议活动接近尾声时，码头工人结束了他们的工作，他们戴上坚固的安全帽，加入了市中心，企图以暴力手段驱散抗议者。学生们被无情击倒，码头工人一路冲向市中心，开始瓦解这场大规模的示威。\n\n最终，警察和州警不得不拿上盾牌出动来同时应对这两场暴动。抗议者面对的是水炮、警棍和催泪瓦斯的无情镇压，数百人因此被送往医院。然而，当警察遇到那些码头工人时，他们并未激烈抵抗，反而转而协助警察对抗学生抗议者。\n\n码头工人赶走学生后，发起了自己的集会，他们支持美国在海外的行动，赞扬那些为正义之战献身的勇士们。集会的人数不断增加，现在来的人主要是那些非学生群体——他们用欢呼和掌声填满了波士顿的街道，而不是对政府的愤怒。\n\n这些暴力场面震惊了全美各地的人们，这引发了更多的反抗议活动，这些活动目前正在全国蔓延。当一切尘埃落定，超过1000名学生和工人在监狱中度过了这一夜，而在这混乱的一天中，警方收到了两起死亡事件的报告。"
 NPP_collapse.1.a:0 "街头再现无谓的暴行。"
 NPP_collapse.2.t:0 "地下气象预报员"
 NPP_collapse.2.desc:0 "今天，美国各地街头爆发了新一轮的公民抗议活动，爆炸声在全国各地此起彼伏，目标直指全国上下的政府机构。从威斯康星大学校园内的预备役军官训练营，到纽约证券交易所内未遂的爆炸，全国数万警察已被紧急动员，以应对这场突如其来的威胁。\n\n幕后黑手是一个自称为“地下气象预报员”的激进学生团体，他们的名字取自鲍勃·迪伦的歌词。该组织已宣布对戈德华特的所谓“反动”政府发起全面攻势。\n\n目前，这些爆炸已导致至少七人死亡，另有三十四人受伤。总统宣布所有政府大楼和银行暂时关闭，以避免更多的伤亡，并协助警方全力排查楼内还有没有未被发现的爆炸装置，但总统仍未对当前局势发表任何评论。\n\n此外，“地下气象预报员”承诺将继续进行爆炸行动，直至政府全面改变其政策风向。他们计划在华盛顿特区的国家广场举行一场有组织的示威活动，但这场抗议活动将在警方和国民警卫队的严密监视下进行，以确保集会的和平。"
 NPP_collapse.2.a:0 "什么时候是个头啊？"
 NPP_collapse.3.t:0 "裂痕渐生的众生"
 NPP_collapse.3.desc:0 "抗议者刺耳的呼喊与催泪瓦斯的发射声交织成一片混沌，约翰在这喧嚣中失去了意识。当他再次苏醒，发现自己正与密苏里州国民警卫队交织于这场暴力的混乱之中。20岁的约翰，国家进步公约进步派青年组织的一名活跃分子，在堪萨斯城的街头，与成千上万的人一起，卷入了这场可能覆盖整个市中心的骚乱，宛如“流血堪萨斯”的历史重演。在国民警卫队粗暴制服他的过程中，人群的喧哗声愈发震耳欲聋，尖锐的噪音在市中心回荡，加剧了这场混乱。\n\n“放开我！该死的，别碰我！”约翰大声呼喊，试图摆脱三名经验丰富的国民警卫队员的追捕。他发出更加响亮的尖叫，试图吸引与国民警卫队对峙的人群的注意。随着肢体冲突的升级，国民警卫队员的注意力被分散，约翰趁机抓住机会挣脱了他们的控制。尽管锁骨受伤，仍尽可能快地沿着街道奔跑。他的伤势和人群的吼声让他的耳朵听不清周围的骚乱，但他听到了一声巨响。\n\n砰。\n\n橡胶子弹的齐射声响起，约翰也未能幸免。子弹击中他的胸部，他瞬间倒地，完全失去了行动能力，无法理解发生了什么。骚乱的人群四散逃离，现场的混乱已经一片狼藉，约翰只能躺在地上，无能为力地被警察摆弄着，他被固定在了沥青路面上。其他抗议者的身影静静地躺在地上，清晰可见；除了血液冲入约翰头部的声音外，他唯一能听到的是救护车的刺耳的鸣笛声。约翰的思绪如同万马奔腾，他喘息着，仿佛是生命之火即将熄灭前的最后一次闪烁。他意识到，这或许是他最后的领悟，随之而来的，是那令人心碎的喘息声。"
 NPP_collapse.3.a:0 "最后一口气。"
 NPP_collapse.4.t:0 "分裂的党团"
 NPP_collapse.4.desc:0 "又是一年，又是一次大会，这些年对于国家进步公约来说是动荡的，尤其是国民党团，他们对民权的要求不断上升，但希望最坏的情况已经过去了，对吧？……对吗？大会在进步派和国民党团员的简短演讲中顺利开始。但最终，事情没能一直这样下去。\n\n最终，看似小小的分歧似乎继续演变成尖叫和咆哮。似乎每个人都忘记了主要分歧是什么。但看起来似乎并不重要。霍利斯试图从日益尖刻的人群中走出来，尽管大会未能解决不断增长的嘲笑声和握拳声，但各自的演讲者仍试图继续演讲。然而最终，那些保持镇定的人甚至在喧闹声中听不到演讲者的声音。霍利斯终于躲到了一个安静的角落，回头一看，却发现代表们正在大喊大叫，并开始互相推搡。霍利斯最终坐在一位年长的国民党团团员旁边，他手里拿着拐杖，摇着头。\n\n“部落主义，年轻人，我们的政治已经变成了部落主义。”\n\n霍利斯张嘴想回答，但还没来得及回答，就看到一个来自阿拉巴马州的国民党团团员卷起袖子，一拳打在了一位来自俄勒冈州的进步党团团员的鼻子上，他向后倒下，被他的同事和保安人员从人群中扶住。霍利斯看了看坐在他旁边的长者，发现他只是摇了摇头，然后叹了口气。"
 NPP_collapse.4.a:0 "我们不禁要问，人类真的进化了吗？"
 NPP_collapse.5.t:0 "白宫里的共党分子？"
 NPP_collapse.5.desc:0 "宾夕法尼亚大道上比平时安静，几乎听不到汽车来来往往的声音。灯光昏暗的会议室里，几位德高望重的国民党团代表聚集在一起，手里拿着打火机，盘算着下一步的行动。当天早些时候一次会议的遗留物在他们面前的桌子上一闪而过：丢失的咖啡杯、散落的床单和报告。\n\n即使现在，他们也不敢相信；国民党团的噩梦，一名共党分子，被提名为他们的领导人？当然，日子很艰难，但布尔什维克是他们最后的选择吗？他们的救世主？愤怒的咕哝声和谈话接踵而至，大家都在争论现在该怎么办。他们无法取消他作为公约提名人的地位——这一点很清楚——但也许他们可以试图阻止他追求“世界革命”的梦想。很快，每个计划都变得比另一个计划更加激进和不可能。当他们意识到这一点后，他们悔恨地得出结论，他们无能为力。\n\n他们建立的政党背叛了他们。\n\n还剩下最后一个选择。如果国民党团不能在党内压制共党分子，他们就会在另一个党内把他打倒。国民党团大规模转向共和党是唯一的出路，而且似乎每个成员都犹豫不决地同意了。然而，他们不知道的是，他们对面房间里的一群进步人士正在讨论同样的问题。他们不喜欢共产主义者总统的想法，因为这实际上是压垮本已脆弱的联盟的最后一根稻草，但联盟的生存对他们来说并不是主要问题——这才是霍尔计划做的事情。他们知道国家进步公约的马克思党团不是由懦夫领导的，他们会不惜一切推动他们的目标。他们都摇了摇头；他们只能希望一个或许能拯救联盟的奇迹出现。"
 NPP_collapse.5.a:0 "一个必须迅速到来的奇迹。"
 NPP_collapse.6.t:0 "避免魏玛共和国的命运"
 NPP_collapse.6.desc:0 "气氛很紧张。许多代表都满头大汗。说话的人自己也不太自在。他正要宣布党派联盟可能结束。代表们的手拍着腿，很少有人试图通过闲聊或开玩笑来缓解紧张气氛，但似乎无济于事。说话者的心在狂跳，除了沉默之外什么也没有。这很不可思议，因为到目前为止，每一次国家进步公约大会都存在噪音问题。进步党团、国民党团和先锋党只是坐着等待消息的宣布。然而，先锋党似乎比大会上的其他人都更放松。约基本人就坐在他们中间，脸上带着浅浅的笑容，平静地与周围的人交谈着。演讲者走上讲台，在闪光几乎让他失明的情况下，他深吸了一口气，开始演讲。\n\n“国家进步公约的女士们、先生们，我们即将宣布即将举行的大选的候选人，但首先要说几句话……”\n\n约基扬起了眉毛，笑容更加灿烂。很明显，演讲者试图让每个人都为这个消息做好准备。\n\n“首先，我想强调这样一个事实，多年来和未来的许多年里，我们都保持着伟大联盟的团结，因为我们仍然有伟大的事情要做，所以言归正传，让我们宣布我们的候选人。”他每说一个字就结结巴巴，甚至还没有说出最糟糕的部分。 “他就是来自国家先锋党的弗朗西斯·帕克·约基。”\n\n整个会议厅一片哗然，进步人士站起来公开嘲笑。说话者擦了擦额头上的汗水。最终，出人意料的是，所有进步派都拿起了自己的东西，以示团结的精神，一起有序地走出了会议厅。约基的笑容很快变成了微笑，他在一名代表耳边嘀咕了些什么。"
 NPP_collapse.6.a:0 "他们以为可以避免魏玛共和国的命运。"
 NPP_collapse.7.t:0 "与民主党打交道"
 NPP_collapse.7.desc:0 "内阁会议室与往常相比显得很安静，熟悉的香烟味道只能隐约闻到，虽然这是可以预料的，因为里面只有两个人。休伯特·汉弗莱站起来，与刚进入房间的人握手，他准时赶到了。亨利·“斯库普”·杰克逊对这次握手露出了微笑，这是个好兆头，至少。\n\n“晚上好，斯库普，我有幸得到你的光临？” 汉弗莱坐下后，向前倾着身子，而斯库普同样身体前倾，但用手揉着疲惫的双眼。\n\n“正如我们在电话里讨论的那样，我相信你已经注意到了，我召集了一个党内会议，讨论了联盟的未来，现在显然有必要进行变革，因为国家进步公约的支持正在稳步减少。”\n\n汉弗莱点了点头，接受了这个消息。他预料到迟早会有这样的拜访，但没想到会来得这么快。“你们的会议得出了什么结论？”\n\n“经过一场长时间的辩论，我们得出结论，重新与民主党合并将是最佳行动方向，出于多种原因。我认为我们对这一行动的预期是一致的，对吗？”\n\n汉弗莱不禁也露出了怀旧的微笑，他后靠到椅子上。他一直想象着未来有一天，进步派会回到大家庭，但他怀疑这样的回归，一直克制着没有想得太多。然而，坐在他面前的这个人，国家进步公约进步派的头目，正在提供一个让他的想法成真的机会。"
 NPP_collapse.7.a:0 "当左派的浪子终于回来时，休伯特笑了。"
 NPP_collapse.8.t:0 "与民主党的交易"
 NPP_collapse.8.desc:0 "文件散落在内阁会议室的地板上，正在进行的谈判漫长而繁琐，所有这些都需要对不同的立法进行审查和考虑，并签署许多不同的条款。现在，进步派的正式终结只差几个签名了。\n\n“这些问题已经提出过了，在这里解决过，在这里。” 斯库普指着几个文件中的一个，汉弗莱只是挠了挠头，过去几个月一直在解决进步派的潜在问题，然后整个党派合并成了民主党，不同的县有不同的法律，这一切以前都由国家进步公约处理。\n\n汉弗莱再次审视着文件，发出一声笑声。“坦率地说，我从未想过这里的讨论会进行得如此顺利。尽管现在对我来说显而易见，我愿意同意你的条件，至少是这么多。”他笑了笑。\n\n斯库普以一种谦逊的微笑回应了汉弗莱的笑声，尽管有些疲倦。“我们下周一将举行新闻发布会，宣布……呃，我敢说是一个时代的结束。国家进步公约的结束。”斯库普说出这些话时几乎感觉不真实，他为之努力了很久的党派即将结束。像他和巴顿这样的人曾经试图实现的美国愿景现在成了一堆灰烬。然而，当斯库普进一步考虑时，一个既服务于像斯库普这样的人，又服务于像巴顿这样的人的美国简直无法实现。一个由极端相反观点的成员创立的政党，这个独特的政党居然花了这么长时间才最终消亡，简直令人惊讶。"
 NPP_collapse.8.a:0 "然而，死亡所需要的只是在一张纸上签名。"
 NPP_collapse.9.t:0 "死党漫步"
 NPP_collapse.9.desc:0 "咔嚓。\n\n克里斯托弗叹了口气，看着铅笔尖断了；这已经是他在过去一个小时里第三次遇到这种情况了。通常情况下，他有购买廉价铅笔的习惯，这通常会让他感到沮丧。但最终这对他来说并不重要，因为他的工作已经完成，断裂的铅笔正好为工作画上句号。\n\n克里斯托弗面前是一堆杂乱无章的图表和统计数据，全部都是他自己收集的。这并不是什么简单的事情；相反，它详细描述了NPP团结的迅速下降。不管出于否认还是无知，这对那些仍然忠于党的人来说几乎没有意义，最初，这对他来说也几乎没有意义，他不得不自己去弄清楚这一切。进步党团的叛逃和国民党团内部因堕胎权问题而分裂，肯定不会造成这样的灾难，难道会吗？\n\n尽管如此，对他来说所有的证据都是显而易见的，从NPP国民党团支持率的急剧下降到党员人数的减少；长期以来与他观点相符的党派对美国和她的人民来说不再是长久之计，不久国民党的失败将会让全世界看到。\n\n他摸了摸自己的头，整理并归档了桌子上的一堆杂乱物品。国民党团的支持者们正大举涌向共和党，尽管对他来说这并不奇怪；如果说有什么奇怪的话，那也是理所当然的，尤其是考虑到国民党团和进步党团的创始人甚至都曾经站在的同一个阵线的时候。"
 NPP_collapse.9.a:0 "至少，这个梦是个美梦。"
 NPP_collapse.10.t:0 "让船摇晃起来"
 NPP_collapse.10.desc:0 "在过去的几个月里，民主党的主要人物注意到，他们的共和党同行一次又一次地证明了他们在与民主党合作时是多么两极分化。众议院和参议院的主要民主党议员呼吁共和党领导人要么让他们的政党与联盟保持一致，要么彻底解散。随着立法者面临的压力越来越大，有关联盟和国家未来必要的后续步骤的谈判已经开始。\n\n当时流传的一个想法是双方领导人召开一次大型会议，讨论并鼓励政治对话，而不是选择继续沿着除了名字上全都是分歧的国会道路前进。尽管许多分析人士怀疑这些谈判能否取得任何有意义的进展，但此举被视为领导民主党朝着维护共民联盟的正确方向迈出的重要一步。\n\n此外，共和党领导人本身也公开怀疑这些谈判是否能让联盟取得进展，他们唯一的要求就是民主党听取他们的意见并对共和党提出的要求做出妥协。\n\n华盛顿内外的许多分析家和批评家认为，这是联盟终结的开始。在联盟不可避免地解散后，双方将做出更多的尝试来制定战略并做出下一步的行动。民主党人对这些说法提出了反驳，称在用尽所有可能的方法之前，共民联盟尚未结束。很少有人相信民主党愿意与共和党对手达成协议，但就目前而言，联盟的命运仅取决于这些谈判。"
 NPP_collapse.10.a:0 "哦，成为墙上的苍蝇……"
 NPP_collapse.11.t:0 "不沉之舟……"
 NPP_collapse.11.desc:0 "当乔治·罗姆尼轻松地再次当选为共民联盟候选人时，民主党全国委员会中充满了愤怒。虽然现任总统罗姆尼的表现并不出人意料，但事实证明，重新提名一位社会保守派和虔诚的摩门教徒对民主党来说太过分了。\n\n在召开了包括民主党高层在内的会议后，民主党决定结束长达数年的联盟。这一决定是在罗伊诉韦德案做出具有里程碑意义的裁决之后做出的，该案赋予妇女堕胎权，在支持堕胎的民主党人和反对堕胎的共和党人之间造成了牢固的分歧。罗姆尼本人坚决反对堕胎，这只会火上浇油。此外，NPP的解散只会进一步加剧共和党和民主党之间的分歧，因为双方的党内都充满了更极端的成员。\n\n现在，美国进入了一个新的、但经过考验的政党体系：共和党与民主党、象与驴的对立。如果民主党希望有机会将罗姆尼赶出白宫，他们现在必须迅速找到一位提名人，在分裂后团结本党。"
 NPP_collapse.11.a:0 "……已然沉没。"
 NPP_collapse.12.t:0 "把船炸掉"
 NPP_collapse.12.desc:0 "罗纳德·里根已经做到了没有人认为可能的事情。银幕之星不知何故赢得了共民联盟提名，击败了现任的珍妮·柯克帕特里克。作为好莱坞西部片演员出身的国会议员，里根的演艺之路可谓星光熠熠。尽管支持共和党，里根最终加入了国家进步公约，并被要求在1966年参加加利福尼亚州州长竞选。里根接受了提名，并凭借其知名度和好莱坞魅力赢得了压倒性胜利。他在74年拒绝竞选第三任期，而是从国家进步公约和共和党合并之后就开始筹备总统竞选。现在，他获得了总统候选人提名，收获颇丰。在经历了柯克帕特里克四年事必躬亲式地处理国内事务之后，里根的“反大政府”政纲似乎得到了许多美国人的好评。\n\n顽固保守派里根的提名和柯克帕特里克的被罢黜使得民主党陷入了困境。几乎立即，杰出的民主党人和其他持自由倾向的国会议员开始呼吁解散共民联盟。共民联盟就此举行了投票，民主党一致投票赞成与长期合作伙伴分道扬镳。截至今天，民主党已经脱离了联盟，结束了几十年的同盟。珍妮·柯克帕特里克很快被提名为总统的民主党候选人，现在，随着美国开始了一个新的政党体系时代，现任总统和前好莱坞演员将在11月份进行较量。"
 NPP_collapse.12.a:0 "让我们看看这个牛仔能做什么。"
 NPP_collapse.13.deadlock.t:0 "冰山"
 NPP_collapse.13.deadlock.desc:0 "这是绝对的僵局，双方以及所有与他们有关系的人都知道这一点。民主党和共和党都选择了一位候选人，他们完全确定他会以进步、力量、爱国主义以及代表们喜欢谈论的其他流行语的名义赢得多数席位。\n\n然而，双方陷入僵局，双方都不愿承认自己选定的候选人。有人试图选出一位妥协的候选人，以最后一搏挽救陷入困境的联盟，但政党中相对较少但直言不讳的积极分子派别坚持抵制，敦促双方坚持立场，直到另一方最终看清形势。这种希望被证明是徒劳的，因为民主党和共和党代表分别投票给肯尼迪和里根，两位妥协候选人都未能获得多数席位。\n\n现任国家进步公约总统的沉默无声和无所作为只会使问题进一步复杂化，因为在迄今为止进行的无休止的辩论中，双方都无法利用总统的建议作为自己的优势。显然，所有相关人员只有一个选择，那就是在双方同意的情况下解散联盟。二十年来，民主党和共和党首次以对立党派的形式推出各自的候选人。\n\n这并不完全令人惊讶，因为一开始就没有人预料到这个联盟会持续特别长的时间。事实上，一些人感到惊讶的是，在与国家进步公约的斗争中遇到障碍后，它竟然能持续这么久。然而，即使能够找到矛盾某种解决办法，谁又能保证在下一次选举甚至在那之前不会出现另一个矛盾呢？为了维护和平并尊重国家的民主传统，这似乎是更明智的选择。"
 NPP_collapse.13.a:0 "希望他们保持文明。"
 NPP_collapse.13.t:0 "沉入海底"
 NPP_collapse.13.desc:0 "出人意料的结果是，罗纳德·里根成功地利用自己在新加入共和党的NPP国民党团国会议员中的权力和影响力，对民主党总统候选人提名采取行动。\n\n参众两院的民主党人都痛斥了他们的联盟提出双方都能同意的候选人的努力。除了两党之间的两极分化日益加剧，民主党议员也因此同意消除民主党和共和党之间的联盟。更重要的是，民主党立即支持温和派民主党人吉米·卡特，试图挫败里根的立场。\n\n共和党领导人表示，他们感觉民主党同行完全背叛了他们，但仍然对新提名人赢得总统职位充满信心。随着总统竞选进入白热化阶段，民主党领导人还认为，鉴于分裂的情况，里根在今年 11 月的民意调查中没有机会。\n\n当被问及对正在发生的局势发表评论时，总统候选人里根表示，他相信国家的健康从未受到过来自国内外力量的更大威胁，并补充说前民主共和党联盟无法提供任何有意义的帮助。过去的立法或政策玷污了美国在世界各地的声誉，他希望纠正这一针对国家的错误。"
 NPP_collapse.13.b:0 "也许他真的能让美国再次伟大。"
 NPP_collapse.14.t:0 "共和党的提议"
 NPP_collapse.14.desc:0 "斯特罗姆·瑟蒙德在过去的一个月里已经忍够了，他的耐心在压力下开始磨损。他惊恐地看着曾经强大而有影响力的国民党团慢慢开始崩溃，别人不知道，但他自己却清清楚楚。国民党团不会坚持太久，他终于开始承认立即采取行动的必要性。\n\n他走进一间光线昏暗的办公室。坐在他对面的椅子上的是参议员洛克菲勒，尽管没有他标志性的蓝色外套，只穿着一件白色条纹纽扣衬衫和红色领带。\n\n“洛克菲勒参议员，晚上好。”斯特罗姆向戴眼镜的参议员致意。\n\n洛克菲勒猛地抬起头。 “你好，瑟蒙德先生。”他结巴了一会儿，想知道为什么自己在所有人中竟然愿意坐在他对面。 “坐吧，可以吗？”\n\n斯特罗姆懒得闲聊。 “听着，洛克菲勒，我的党派已经很难团结起来了，而我是来向你提出要约的。”瑟蒙德的嘴角勉强挤出一抹笑容。当他点点头时，他可以看到洛克菲勒变得越来越感兴趣。\n\n“我想把国民党团并入共和党。只要你给我和我的孩子们一些让步，我们很乐意将我们的人力并入你的党。”两人就这个话题进行了详细的讨论，但最终达成了友好一致，即两人将努力使这次合并顺利进行。当瑟蒙德握着洛克菲勒的手离开时，这位共和党参议员的表情有些像是被告知即将得到一个巨大糖果的孩子。"
 NPP_collapse.14.a:0 "“戈德沃特会对此感到很兴奋的。”"
 NPP_collapse.15.t:0 "做出转变"
 NPP_collapse.15.desc:0 "这是一个重大事件。当洛克菲勒在纸上签字NPP国民党团并入共和党时，照相机在他周围闪烁。他们之间就各种问题（例如不同政党机构的代表权和整合）进行了紧张的谈判，花了几个月的时间才敲定所有细节。然而，最重要的谈判是关于NPP国民党团对种族隔离的广泛支持。洛克菲勒仍然记得在长达数小时的会议中激烈的争论，讨论了合并后的政党种族隔离政策的所有细节。他本人对民权的支持为瑟蒙德和NPP国民党团的其他成员所熟知，这很可能是现在合并后的政党内部争论的根源。\n\n“好吧，并不总是如此，”洛克菲勒一边想，一边抑制着傻笑的冲动。瑟蒙德自1947年起就开始从政，年事已高。这固然令人印象深刻，但也确实让他处于退休的边缘。 NPP国民党团内部没有其他人有意愿或魅力像瑟蒙德那样能够在他作为该党发言人的余生中吸引观众。一旦他们的主要领袖消失，种族隔离主义者就会被同化，沦为不咬人的狗。只有最极端的种族隔离主义者才会继续挑衅，但这将变成一个小问题。很快，共和党人终于可以接受长期以来用来对付他的洛克菲勒共和党绰号了。\n\n当洛克菲勒隔着桌子与瑟蒙德握手时，他对未来的思考戛然而止，他象征性地在国家进步公约的棺材上敲下了最后一颗钉子，照相机将这一时刻永远载入史册，记者们则疯狂地记下笔记以供日后报道。两人并肩站上讲台，团结一致，一个能够涵盖美国保守思想方方面面的新共和党诞生了；伟大的大老党渴望向民众和选民证明合并的价值。"
 NPP_collapse.15.a:0 "瑟蒙德会很快退休，对吧？"
 NPP_collapse.16.t:0 "收起他的骄傲"
 NPP_collapse.16.desc:0 "当时是傍晚，太阳已经落到地平线下，橙色的光芒洒满整个小镇，照进克劳德·佩珀的办公室。当他双手背在背后，凝视着窗外时，他疲倦地叹了口气，然后回到办公桌前。 NPP进步党团在各个方面都在恶化；每份报告都显示，党员、捐助者、志愿者以及政党维持健康生存所需的一切都减少了。\n\n古往今来也是如此。他是自泰迪·罗斯福以来第一位相关的进步候选人，但现在他知道自己是一个正在缓慢而痛苦地死去的政党的元老政治家。一切，从民族党的背叛，到城市地区曾经休眠、现在咆哮的民主党机器，甚至是他自己党内的重大分裂——天啊，克劳德必须在下周一之前回到独家新闻，讨论平权行动提案，否则就有风险。他在参议院大发雷霆——正在对他不利。很明显，NPP进步党团不会长久存在，即使佩珀无法接受它。\n\n但有一个解决方案，即使这意味着分裂国家进步公约的残余力量。\n\n他将与民主党联系，并带领美国剩下的忠于他的进步人士加入民主党，在变革中团结起来，以便他能够再次努力激发内部变革。尽管遭遇这一挫折，克洛德相信，虽然他还剩下一些议员、捐助者和代表，但从内部影响民主党的方向仍然是可能的。\n\n当他的思绪飞驰时，他再次起身离开办公室，因为那天早些时候他已经在默默期待中安排好了晚餐。最好在明天开始这个过程时，头脑要休息好，胃要吃饱，并有一些宝贵的时间来思考到底该说什么和做什么。他不能也不会贬低自己或他的支持者。"
 NPP_collapse.16.a:0 "过渡，以避免死亡。"
 NPP_collapse.17.t:0 "基石出现裂缝？"
 NPP_collapse.17.desc:0 "理查德是一位经验丰富的众议院共和党人。在连续两届总统任期内，他已经获得了衡量各种问题、主题和趋势的潮起潮落的能力。然而，没有什么比他在这里看到的更令人担忧的了。在过去的四个月里，民主党变得越来越两极分化，似乎越来越左倾，这一点开始反映在他们的言论中。\n\n通常的进步政策和谈话要点都在那里，但很快就出现了更激进的内容。他无意中听到的一次谈话是一位民主党参议员的讲话，他支持公社和合作社，以及这如何反映在他们的经济政策中。他毫不怀疑，在密室里还会有更多类似的谈话。\n\n他召集同事与民主党同行召开联席会议来解决这个问题。难道他们根本没有注意到这种影响像癌症一样在他们身上蔓延吗？或者它们是最初让它生长的囊肿？十几个人鱼贯进入会议室，落座。 “先生们，我民主党的同事们，”他正式开场。 “我们召开这次会议是为了提出我自己和其他人在过去几个月中注意到的一个担忧。言归正传，我们注意到民主党成员之间存在稳定两极分化的趋势。我建议对此进行调查，以免发生这种情况。它危及联盟。”\n\n在场的一位民主党参议员，考虑了很长时间才开口回答。 “虽然我们感谢共和党同事的应有关注，但我们目前认为没有必要进行任何形式的调查。坦率地说，我们会做什么？我们要寻找什么？我们向谁提问？任何形式的调查会在我们的队伍中造成过度的骚乱，”他解释道。理查德叹了口气。"
 NPP_collapse.17.a:0 "癌症已经扩散得太厉害了……"
 NPP_collapse.18.t:0 "流沙的基石"
 NPP_collapse.18.desc:0 "就好像一道闪电撕裂了房间里的每个人，让在场的所有人都感到震惊，甚至有些可怕的沉默。正如他们面前桌子上的新闻文章在各街区首都所宣称的那样，能够避免搅局并保持美国强大和稳定的明智领导人已经被取代。最终，当最初的震惊消退后，愤怒开始膨胀。\n\n“他们不能这么做！”其中一人终于喊道。 “我们有一个完美的、绝对明智的候选人，他们却把这个无名小卒放在了他的位置上？他们疯了吗？”他咆哮道。\n\n接下来另一个男人提高了声音。 “这是最后一根稻草。如果他们想击垮这个国家，那么他们可以击垮他们自己该死的政党！我们不能让这种情况持续下去！”他重重地敲打着桌子，桌子发出嘎嘎声。在场的所有人都同意，这种情绪迅速蔓延。\n\n在严厉的警告下，一些人认为不可避免的事情终于发生了。联盟中的共和党派几乎一致联合起来解散它。然而，他们的义愤并没有就此结束。任命罗姆尼为候选人以反对肯尼迪，他们希望保持保守派对国家的影响力。\n\n民主党对此并不完全感到惊讶，只是花了这么长时间他们才像一个被宠坏的小孩子在不按自己的意愿打开自来水厂一样发脾气。人民选择肯尼迪是有充分理由的，而不是他们落后和反动的方式。不管。他们破坏性的政治撅嘴在选举中将被证明是徒劳的。"
 NPP_collapse.18.a:0 "联盟最终崩溃。"
 NPP_collapse.19.t:0 "基石的崩溃"
 NPP_collapse.19.desc:0 "1976年，珍妮·柯克帕特里克再次获得大选提名，竞选连任总统，这在许多人看来已是板上钉钉的事了。事实证明，这一决定为共民联盟敲下了棺材上的最后一颗钉子，因为共和党人指责民主党在联盟党中占据主导地位，并故意维持对他们有利的现状。\n\n共民联盟大会几天后，共和党正式宣布他们将分道扬镳，因为国家进步公约不再是真正的威胁，现在是时候停止假装自从1959年成立以来的旧协议在1976年的现代社会中还有任何真正的用处了。\n\n鉴于国家进步公约被严重削弱，新成立的共和党似乎将成为提名新的第二大总统候选人。目前尚未决定他们将提名谁，因为许多人选已经被提出，尽管许多人呼吁党派团结赢得选举，但没有一个人接近安全多数来获得提名。\n\n显然，维持现状的旧制度终于崩溃了，珍妮·柯克帕特里克今年11月的总统任期将面临巨大的反对和挑战，而她背后只有民主党的支持。"
 NPP_collapse.19.a:0 "淘汰旧的，引进新的。"
 NPP_collapse.20.t:0 "破碎的联盟"
 NPP_collapse.20.desc:0 "随着1976年共民联盟全国代表大会的结束，可以肯定的是，副总统伯奇·贝赫已经获得了现在摇摇欲坠的共和民主党联盟的提名。然而，很难说他已经获得了整个联盟的提名，因为实际上联盟已经解散。\n\n贝赫是一名民主党人，在哈特总统被诊断出癌症并辞职后，他被选为切普·莫里森的副总统，因反对废除哈特制定的城市改造计划而获得提名。看来，对于共和党来说，这次提名已经让他们与联盟的关系达到了极限。\n\n在共民联盟全国委员会的一次紧急会议上，共和党人提出了最高要求，甚至将贝赫从候选人名单中完全剔除。当民主党领导人拒绝他们的要求时，共和党人冲出会议室，对在外面等候的新闻界成员说，他们的目的是解散“近20年前已经过时的不可靠和失败的联盟”。\n\n贝赫已向共和党公开呼吁，敦促他们重新考虑这一“仓促的决定”，但他们似乎无意重返共民联盟。看来，贝赫只有得到民主党的支持才能带领他入主白宫并延续已故哈特的梦想。"
 NPP_collapse.20.a:0 "门徒的晋升，但代价​​是什么？"
 NPP_collapse.21.hart.t:0 "夺回哈特的遗产"
 NPP_collapse.21.hart.desc:0 "自从哈特总统首次推动并批准《城市改造法案》以防止经济停滞并改善普通民众的状况以来，联盟中的共和党派从第一天起就计划削弱该法案，并最终在其政策中废除该法案。整体。然而，民主党人敏锐地意识到了这一点。这种情况导致了一场愚蠢的棋局，共和党试图削弱这项立法，而民主党则支持这项立法。\n\n该法案成为双方竞选活动的支点，关于它的善恶、进步和破坏性的争论不断。一些比较活跃的团体甚至还发行了关于如何反击对方言论的小册子。这当然引发了另一轮关于如何反驳上一版中的言论的小册子。但当代表们决定投票并尘埃落定后，特德·肯尼迪以微弱的优势被选为提名人。\n\n共和党对此的反应是绝对的愤怒。他们为让代表、会员和活动人士明白道理并摆脱乌云而做出的所有努力都完全化为泡影，令人感到羞辱。这一决定很快得到商定并颁布，以单方面解散联盟，因为他们无法忍受与另一个会让国家梦游般陷入经济崩溃的政党纠缠在一起。他们将城市改造法案视为有毒的莲果，需要砍伐和压碎。\n\n不用说，城市改造计划就像罗斯福的新政一样，在国会两院引起了极大的分歧，它的存在本身已经成为当前选举和以后选举讨论的话题。特德·肯尼迪发誓要保持城市改造法案的完整性，并增加更多内容来帮助普通美国公民。在过道的另一边，里根承诺将继续打击政府的越权行为，并强烈暗示，如果自己当选，哈特的城市改造计划将成为他名单上的目标。"
 NPP_collapse.21.a:0 "这一切不都是在莫里森任期内解决的吗？"
 NPP_collapse.21.t:0 "社会化医疗"
 NPP_collapse.21.desc:0 "计票结果已经统计完毕，正式消息是：泰德·肯尼迪已获得本次选举共民联盟的提名。尽管他在民主党中很受欢迎，但他对共和党候选人的胜利却在共和党全国委员会中引起了不小的轰动。几乎立刻，热情的共和党人因“激进”肯尼迪的提名而呼吁结束联合政府。\n\n一旦就脱离联盟的决定进行投票，房间里的许多人开始欢呼和鼓掌，因为在投票确认一致同意脱离后，大老党正式从共和民主党联盟分裂。随着共和党人庆祝现在被称为“共民联盟离婚”的事件，国会议员开始忙着为即将到来的后果做准备。\n\n尽管许多分析人士认为，在国家进步公约垮台后，分裂是不可避免的，但这种分裂很大程度上归因于肯尼迪是更进步的医疗保健形式的坚定支持者，这让他在自己的党内引起了一些愤怒，而许多共和党人的愤怒则更糟 。为了对抗肯尼迪的“激进”政策，共和党提名查尔斯·H·佩西。来自伊利诺伊州的佩西是最近才加入参议院的，对商业友好的珀西与年轻的肯尼迪的进步主义形成了鲜明的对比。由于两党都已经选出了各自的候选人，只有时间才能告诉我们谁将在11月的大选中脱颖而出。"
 NPP_collapse.21.b:0 "独立人士似乎永远无法休息。"
 NPP_collapse.22.t:0 "你的言行反映了你的本质"
 NPP_collapse.22.desc:0 "罗纳德·里根在1976年全国代表大会上获得了共民联盟候选人的提名，这似乎是棺材上的最后一颗钉子，这引起了民主党及其盟友的愤怒。虽然这可能会让许多圈外人感到震惊，但对于一些分析人士来说，由于近几个月民主党的低迷，他们预测共和党会获得提名，但事实并非如此。联盟中的保守派以尼克松时代以来从未有过的新热情恶毒地追随已故总统哈特的议程。\n\n共和党和国民党团的邪恶联盟被证明是左翼的噩梦，他们成功地废除了几乎所有的城市改造计划，瓦解了哈特和他的随从在近八年的时间里所付出的一切。用最慷慨的话说，这让民主党陷入了螺旋式下降，因为他们不确定在莫里森灾难性的任期后如何继续前进。\n\n现在，随着里根的提名，民主党正式退出联盟，拼命阻止保守派在哈特的坟墓上继续跳舞。然而，挑选自己的候选人说起来容易做起来难，泰德·肯尼迪和伯奇·贝赫因未能阻止哈特的城市改造计划的毁灭而蒙上了污点。两人之间的优柔寡断导致了吉米·卡特的提名，这位候选人的政策更加新鲜、以中间派为中心，民主党希望他能够赢得许多幻灭的左派和不安的温和派的好感。"
 NPP_collapse.22.a:0 "如果一个人的遗产被夺走，他还剩下什么？"
 NPP_collapse.23.t:0 "只是旋转木马上的另一匹马"
 NPP_collapse.23.desc:0 "“我非常困难地在此宣布，我不会在1976年大选中寻求连任。”这句话在安德森的脑海中回响，菲利斯·施拉夫利的脸很快就被周围的闪光遮住了。说实话，安德森不得不承认，自从国民党团抛弃了他们之后，这一宣布是不可避免的。施拉夫利的任期内，他们所发出的只不过是空洞的言辞，而现在他们正处于在下一次选举中惨败的边缘，这将导致美国落入过度的政府准入之手，从而摧毁他们的根基。为了保存而付出了如此巨大的努力。\n\n安德森叹了口气，从讲台上的施拉夫利身边走开，消失在后台。施拉夫利在那次新闻发布会上所说的任何其他话都将与她的总统竞选完全相同——空洞的承诺。对他来说，与一个政治经验如此之少的人共事一直是一场赌博，他每天都越来越后悔。施拉夫利在担任总统的短暂时间内无法控制，她所做的一切就是破坏了NPP国民党团的受欢迎程度。白宫已经从一个要求尊重的办公室变成了施拉夫利家族和他们的晚餐的纯粹游乐场。他仍然能隐约听到她对FAAI法案的疯狂咆哮。他目瞪口呆，拒绝相信她是多么受骗，但她不断证明她没有资格担任任何职务，更不用说担任总统了。\n\n如果没有自己的政治关系，施拉夫利能走到这一步吗？抹黑和歪曲他在最宏伟的舞台上所代表的每一个价值观？\n\n他需要摆脱这个。这是从这种嘲弄中挽救他自己的尊严的唯一方法。当他穿过大厅重新加入共和党时，由于他与施拉夫利灾难性的任期有关，他可能会被嘲笑。然而，在施拉夫利的领导下，他的价值观遭到侵犯，这是确保他的价值观得以继续保存的唯一途径。"
 NPP_collapse.23.a:0 "他从未回头。"
 NPP_collapse.24.t:0 "重新加入阵营"
 NPP_collapse.24.desc:0 "杰克逊轻轻地喝了一口咖啡，看着椭圆形办公室的窗外。夜空晴朗，月光照亮寂静的街道；这是一种令人放松的视觉效果，是他在混乱的总统任期后迫切需要的一种视觉效果。自从他就任总统以来，NPP国民党团就一直在背后中伤他们的联盟，即使他赢得了选举，也集体叛逃到共和党。杰克逊转身离开这片和平的景象，面对那张古老、坚定的办公桌，这张办公桌曾忠实地为他之前的多位总统服务过。桌面上放着一台笨重的打字机，嘲笑他，说他将无法看到他对美国的愿景实现。\n\n杰克逊在桌子后面坐下，开始写演讲稿。空荡荡的办公室里不断响起咔哒声和咔嗒声，斯库普的脑海中不断浮现出关于演讲内容的想法。他应该坚定对美国未来的决心吗？他是否应该解释为什么他未能保持党的统一并导致国家进步公约在选举中面对共和党的压倒性胜利？不，它需要比这更简单。无论如何，没有人愿意听他的推理——他们只会注意到他失败了。杰克逊继续在打字机前埋头苦干，感觉像是永恒，他发表了一篇简短的演讲，承认他的一届总统任期是不可避免的，并且他不会寻求连任。它充满了标准化的程序和语言，在他担任总统之初曾经存在的火焰现在消失在他已经非常熟悉的东海岸寒冷的微风中。\n\n杰克逊坐在那儿，盯着从打字机上抄下来的演讲稿。重读这篇演讲，他发现它过于自动化，他曾经对军事和福利的热情言论已经淡化到可以在教科书中使用的程度。当一辆汽车驶过时，他的目光从演讲中移开，发动机的声音破坏了夜空的宁静景象。无论谁开那辆车，都永远不会因为尽职尽责地为这个国家服务而得到应得的报酬。"
 NPP_collapse.24.a:0 "他一边看着，一边用拳头攥紧了纸。"
 NPP_collapse.25.t:0 "办公室的又一天"
 NPP_collapse.25.desc:0 "罗伯特茫然地凝视着前方，手边漫不经心地夹着一支香烟。他很累，由于助理工作几乎持续单调，他的身体酸痛。尽管从技术上讲他应该工作，但他只是需要休息一下。即使是短暂的抽烟休息也能让他从无休止的文书工作中解脱出来。\n\n“......他们不会支持它。他们会试图阻止它......”\n\n声音很突然。虽然微弱，但它的威力足以让罗伯特在试图聚焦于来源时站起来。毫无疑问，这是美利坚合众国总统格斯·霍尔。他重新站起来，慢慢地爬过大厅，靠近演讲地点，然后小心翼翼地把头从角落里探出来，看到总统在一个偏僻的地方悠闲地踱步。\n\n“……实际上，我不需要该死的国会来通过它，我自己就可以……”\n\n罗伯特迅速将头转过角落，站在那里试图理解他刚刚听到的内容。他对格斯·霍尔并没有真正的看法，也不在乎他试图通过什么政策。但是这个？只是感觉不对——袖手旁观、什么都不做就更不对了。也许应该通知某个重要人物，但是谁呢？\n\n也许是众议院议长？他的办公室需要一些文件。或许他可以在发表讲话时提起刚刚发生的事情。但他应该吗？他是否应该把脚踩进白宫政治的泥潭，踩到自己不想踩的脚趾上呢？当他手里拿着文件前往办公室时，疑问和恐惧在他的脑海中回响。\n\n当他被招手进来时，他终于下定了决心。"
 NPP_collapse.25.a:0 "“先生，我想有件事您需要听听。”"
 NPP_collapse.26.t:0 "国会的愤怒"
 NPP_collapse.26.desc:0 "鲍勃·多南笔直地坐在座位上，继续听讲台上的人滔滔不绝地说着。毫无意义的随机论点形成了一个脱节的论点，其唯一目的是推迟不可避免的事情。如果不是这场毫无意义的争论，预算案很可能在半小时前就通过了。\n\n“……当然，还有很多原因，但我相信你们当中有人更适合谈论这个问题。因此，我想把发言权交给其他人。”\n\n多兰继续看着霍尔的另一位支持者被召唤并尽职尽责地走上讲台，在那里他讲述了一个关于他童年的故事。他再也无法忍受了。他摆了摆手，声音比现在的发言者好得多。\n\n“我想发起一次结束投票。发言者没有提出任何阻止​​拟议预算的论据。”\n\n房间里响起一片赞同的低语声，突然一声巨响，一把椅子向后弹了过来，压倒了一切。旁边的男人刚刚站起身来，显然正要说话，就被多南搭上了。他的双手高高耸立在男人身上，抓住他的领带和衣领，一边说话一边调整着。\n\n“坐下，你这个躲风的懦夫！你很幸运，有中士保护你——”\n\n一只拳头击中了多南的鼻子，产生了内脏裂痕，然后血液开始流到他的衣服上。喊叫声和脚步声席卷了整个房间，周围的多个男人冲了进来，疯狂地制止了他们两人，以免他们再出拳。"
 NPP_collapse.26.a:0 "暴力事件之后，预算获得通过。"
 NPP_collapse.27.t:0 "干燥而苦涩的结局"
 NPP_collapse.27.desc:0 "霍尔孤独地坐在总统办公室里，听着平时高峰时段交通异常消失的声音。回顾过去的几周，他得出了一个令人震惊的结论：这一切都是徒劳的。他就任总统曾被誉为美国及其人民的新时代，但这个时代却被他承诺反对的同一个制度所扼杀。他的预算计划没有得到国会中那些自我夸大的政客的必要呼吁，就被最高法院的鼠辈们破坏了，他们大声抱怨他的否决是“违宪的”。美国破碎的体系及时团结起来，压制了他对美国的愿景，即一个只会提升人民地位的美国。除了他们自己的腐败傀儡之外，资产阶级永远不会接受任何人。\n\n他的工作人员口中关于即将到来的弹劾程序的窃窃私语声已经传到了他的耳朵里。随着NPP进步派内部的温和派成群结队地逃往他们誓言反对的同一个政党，该联盟已支离破碎。尽管霍尔现在的想法沉重地压在他的脑海里，但由于这种纯粹的讽刺性的情况扭曲了他的思绪，霍尔还是从嘴里发出痛苦的笑声。那些曾承诺给美国带来前所未有的变革的人们却背叛了，又回到了最初把他们吐出来的傀儡主人的怀抱。事实证明，他们的话只不过是对工人思想的毒液，使他们成为制度的奴隶，并欺骗任何试图反抗它的人！\n\n霍尔记得他短暂的总统任期之初，他的就职演说曾一度引起欢呼声，以至于他几乎听不见自己说话。现在，由于该体制坚强地抵抗了他的攻击，普通民众完全冷漠了。除了一些象征性的改革之外，他在革命重建的第一个障碍上就倒下了。他作为总统失败了。联邦调查局等组织内的反动派将被允许留下来并继续表现出他们的腐败。资产阶级将继续从困扰工人阶级日常生活的资本主义噩梦中获利。在书中，他的运动将被视为消除这些不公正的失败，是美国历史上的一个黑点，而他对此无能为力。"
 NPP_collapse.27.a:0 "霍尔放下笔，让辞职信晾干。"
 NPP_collapse.28.t:0 "意外的晋升"
 NPP_collapse.28.desc:0 "当蒂普惊愕地翻阅提示卡时，房间里弥漫着一种无声的紧张气氛。十年来第二次众议院议长成为总统。美国就像一座老房子，濒临倒塌，难以支撑。民主真的如此软弱和破碎吗？他怎么能声称自己代表了选举这样一个怪物担任总统的人民呢？ 共民联盟是否有可行的前进方向？\n\n蒂普突然意识到房间里有特勤局特工，忽视了他最后的准备工作。在肯尼迪遇刺事件以及损害其前任任期的政治暴力事件之后，总统（或至少是即将上任的总统）周围的安全保障得到了极大加强。那似乎是很久以前的事了，那个充满希望的时刻，蒂普真的认为肯尼迪能够让国家团结起来。现在，他几乎希望能再次过上悲伤的日子，而不是对这个世界的疯狂感到冰冷麻木。\n\n他记得他第一次作为议长向全国发表讲话，并向人民承诺他将公平、坚定、负责任地挥舞木槌。很快，就到了再次宣誓就职、发挥更大作用的时候了。他会在圣书上发誓，在他想要毁灭之前捍卫宪法和人民。尽管这些想法已经折磨了他一段时间，但现在他的就职典礼只剩下……五分钟了，这些想法似乎更加确定了。"
 NPP_collapse.28.a:0 "反思时间似乎已经结束了。"
 NPP_collapse.29.t:0 "奥尼尔紧急内阁"
 NPP_collapse.29.desc:0 "总统：蒂普·奥尼尔（共民联盟-民主党）\n副总统：迈克·曼斯菲尔德（共民联盟-民主党）\n国务卿：乔治·H·W·布什（共民联盟-共和党）\n国防部长：威廉·威斯特摩兰将军（无党派）\n财政部长：W·迈克尔·布卢门撒尔（共民联盟-民主党）"
 NPP_collapse.29.a:0 "一次无力的拯救尝试。"
 NPP_collapse.30.t:0 "预期的结局"
 NPP_collapse.30.desc:0 "“对不起，蒂普，但这是不可能的。当我们的利益分歧如此之大时，我们不能指望继续支持联盟。你我都知道，这个联盟在最好的情况下也是有争议的，随着国家进步公约成员的解散和重新融入我们的政党，现状是不可持续的。”\n\n当共和党全国委员会主席玛丽·路易斯·史密斯继续概述联合政府不再可行的原因时，奥尼尔的脑海中思绪飞快地掠过。在分裂的情况下，他们如何能够持续阻止如此庞大的激进派投票基础呢？面对遗忘，真的没有办法调和他们的分歧吗？但他知道真相，就可行的政策而言，各方不再有任何联系。不仅如此，公众对他对危机反应平淡的争议足以让反对联盟的呼声进入大多数主流媒体。现状已被打破和破坏，蒂普似乎必须承担责任。\n\n就在史密斯等待回应时，这位前议长所能做的就是强颜欢笑，隐藏在笑容背后的是对未知未来的不确定性和忧虑。按理来说，他知道这是不可避免的，确实没有什么办法，但他还是忍不住想知道。由于这种政治激进化，这个新美国的差异将是自内战以来最剧烈的。随着当权派的崩溃，新的信念在旧的机构中找到了立足点，而像蒂普这样的老政客则想知道事情何时变得如此糟糕。\n\n他站起来，伸出手，只说了两个字。 “我明白。”史密斯犹豫地摇了摇它，然后走出房间，带走了共民联盟的最后生存机会。"
 NPP_collapse.30.a:0 "和平消失了，驴和象再次发生冲突。"
 NPP_collapse.31.hall.t:0 "1976年民主党全国代表大会"
 NPP_collapse.31.hall.desc:0 "经过近三周的辩论和审议，二十年来的第一次民主党全国代表大会在麦迪逊广场花园结束，过去十年美国政治的影响再次发生变化。它轻松超越了1924年的民主党全国代表大会，成为历史上连续举办时间最长的民主党全国代表大会，考虑到政党纲领和总统提名的情况，不难看出其中的原因。\n\n新的红色恐慌席卷全国，随着国家进步公约垮台，中左翼甚至社会主义分子的叛逃和整合，改革后的民主党将进行一场艰苦的战斗，以争取温和派和自由派支持他们的事业。一些以前隶属于国家进步公约共产派的组织和公众人物极具争议性的支持也给该党带来了一场公关灾难，每晚向公众播放左翼民兵煽动政治暴力的录音。\n\n最终，大会投票支持吉米·卡特，一位相对保守的南方民主党人，关注民权问题，中间派沃尔特·蒙代尔作为他的竞选搭档。民主党全国委员会似乎希望他卑微的农民出身和朴素的性格能够软化和缓和公众舆论——甚至可能在反对复兴的保守派运动中取得一场不可否认的不太可能的胜利。"
 NPP_collapse.31.a:0 "看来民主党已经没活儿了。"
 NPP_collapse.31.yockey.t:0 "1976年民主党全国代表大会"
 NPP_collapse.31.yockey.desc:0 "二十年来，民主党首次以独立政党的身份在麦迪逊广场花园主办并结束了全国代表大会，不再受共民联盟的约束。尽管约基总统任期对种族关系和民主制度造成了广泛损害，但在尘土和瓦砾中，有一个明显的赢家——美国进步运动。自由派、温和派和保守派都感到绝对震惊，不仅对总统令人震惊的行动和言论，而且对这样一位毫不掩饰的法西斯主义者在美国公众中获得的大规模（尽管是暂时的）支持感到震惊。\n\n钟摆转向了另一个方向，公众对肯尼迪兄弟过去的继承人的大力支持。泰德·肯尼迪是一位经验丰富的参议员，长期以来一直倡导社会正义、全民医疗保健和移民改革等事业，他已经呈现出美国左翼的新面貌，吸引了来自国家进步公约前盟友的一大群支持者。进步党团和建制民主党。尽管觉得自己还没有准备好承担责任，但泰德最终还是出于对国家和事业的责任感而挺身而出。\n\n泰德与他的竞选搭档弗兰克·丘奇（一位著名的进步人士和环保主义者）一起获得了1976年民主党总统候选人提名，并在初选和超级代表中取得了广泛的成功。目前的民意调查显示，肯尼迪甚至在传统保守的州也得到了支持。无论谁赢得共和党全国委员会提名，他们都肯定会面临一场艰苦的战斗。"
 NPP_collapse.31.b:0 "他一生的事业，就在他的手掌之中。"
 NPP_collapse.31.t:0 "1976年民主党全国代表大会"
 NPP_collapse.31.desc:0 "随着共民联盟正式分裂，来自联盟各州和领地的一千多名代表齐聚纽约市中心的麦迪逊广场花园。今年，这场斗争归结为科罗拉多州参议员泰德·肯尼迪，[BayhVPorSenator]和佐治亚州前州长吉米·卡特之间的三强赛。\n\n从联盟解散到大会召开之间的时间如此之短，多数意见似乎已经集中在自由派主流与贝赫和切普的联盟前共识上。两人都因在参议院的工作而闻名，贝赫是宪法改革的坚定支持者，肯尼迪则倡导加强全国医疗保健的事业。另一方面，卡特看到希望看到联盟继续存在的人大幅增加，他的南方血统被视为向那些不愿支持贝赫或肯尼迪式自由主义的心怀不满的温和派伸出的橄榄枝。\n\n然而，关于这三个选项的问题比比皆是。肯尼迪的国家医疗保健系统计划是否过于激进而无法吸引更广泛的公众？贝赫能否在全国范​​围内复制他在保守倾向州的选举成功历史？卡特是否太过默默无闻，无法激发选民的热情？许多民主党人对这是他们这次唯一可行的选择表示沮丧，并表示希望有一个更标准的初选季节。但最终投票的结果正在揭晓，获胜者是……"
 NPP_collapse.31.c:0 "爱德华·肯尼迪！"
 NPP_collapse.31.d:0 "伯奇·贝赫！"
 NPP_collapse.31.e:0 "吉米·卡特！"
 BayhSenator:0 "印第安纳州参议员伯奇·贝赫"
 BayhVP:0 "美国副总统伯奇·贝赫"
 NPP_collapse.32.hall.t:0 "1976年共和党全国代表大会"
 NPP_collapse.32.hall.desc:0 "仅仅五天后，自1956年以来的第一次共和党全国代表大会就以积极的气氛结束了。与今年早些时候的民主党全国委员会相比，堪萨斯城新成立的共和党的态度总体上是乐观的，并且在民粹主义、民族主义言论的背后是统一的。这种统一的保守派方针是对共和党与国家进步公约前右翼分子的友好融合以及灾难性的霍尔总统任期后大规模社会右倾的回应。\n\n谁将成为美国新保守派运动的代言人——罗纳德·里根，这一点非常清楚。作为一名前电影演员和政治舞台的新人，里根在每次初选中都飙升至榜首，轻松地驾驭了知名度和充满活力的美国右翼的浪潮。 “不再发生”成为他竞选活动的号召力，因为他将霍尔的总统任期归咎于联邦政府的越权行为、共产主义渗透和令人窒息的官僚主义。\n\n自然而然，里根几乎成为了该委员会的提名人，而他的竞选搭档理查德·施韦克则更为自由派，后者被选中是为了将一些温和派从民主党中剥离出来。经过极其有利的民意调查和调查后，新近改革的共和党被寄予厚望。看来，尽管美国左派尽了最大努力，但保守主义的火炬却比以往任何时候都更加明亮。"
 NPP_collapse.32.a:0 "罗纳德·里根？那个演员？"
 NPP_collapse.32.yockey.t:0 "1976年共和党全国代表大会"
 NPP_collapse.32.yockey.desc:0 "今年早些时候泰德·肯尼迪在民主党全国委员会的胜利加冕与陷入僵局的共和党之间形成了鲜明的对比。自从在堪萨斯城举行的大会开始以来，建制保守派和前国民党核心小组之间在经济政策和社会问题上的分歧导致会议进程拖延了近两周。该党轻松超越了1880年为期六天的共和党全国代表大会，成为历史上最长的共和党政治大会，不再是一个庞然大物。\n\n温和派人士询问了国家进步公约的前种族隔离成员，询问他们在赋予NPP美国国家先锋队权力方面所扮演的角色。执法人员已部署到大楼外部，左翼抗议分子与约基派的反抗议发生武装冲突。没有一位提名人获得了多数初选代表的支持，因此他们花了很多时间试图取悦尽可能多的人，同时淡化强硬的谈话要点。\n\n最后，新的国民党团反对派被迫靠边站，取而代之的是一位跨党派妥协的候选人：查尔斯·“查克”·佩西，一位来自伊利诺伊州的共和党参议员，奉行温和的外交政策和亲商政治的历史。他在社会问题上的反种族主义立场以及他向参议院提出的著名的低成本住房立法受到青睐，以避免被指控为法西斯主义。共和党人与退伍军人和农业拥护者鲍勃·多尔一起竞选，似乎很难让他们的集团团结在候选人的身后，而大多数重生的政党根本不支持这些候选人。但是，也许佩西的统一言论和非凡的当地基础可以战胜美国历史上最强大的左翼运动。"
 NPP_collapse.32.b:0 "共和党人也犯过不少错误。"
 NPP_collapse.32.t:0 "1976年共和党全国代表大会"
 NPP_collapse.32.desc:0 "共和党正在密苏里州堪萨斯城的肯珀竞技场举行全国代表大会，正值近年来最混乱的总统竞选期间。除了同性恋、堕胎等问题外，共民联盟失败的幽灵也笼罩着该党。最终，没有一位候选人获得足够的代表票来赢得初选，导致召开了一场经斡旋的大会。\n\n这两位领导人分别是前加州州长罗纳德·里根和查尔斯·佩西，前者曾是演员，后来成为政治家，主张实行戈德华特式的严格财政政策，并在海外保持强势地位；后者是新面孔的伊利诺伊州参议员，代表着正在衰落但仍然重要的洛克菲勒派。派对。田纳西州参议员霍华德·贝克也留在竞选中，希望被提名为党内自由派和保守派之间的妥协候选人。\n\n然而，这一切都取决于代表们在肯珀竞技场的投票。经过一天一夜的投票，主席正在上台宣布最后一次投票的结果……"
 NPP_collapse.32.c:0 "查尔斯·佩西！"
 NPP_collapse.32.d:0 "霍华德·贝克！"
 NPP_collapse.32.e:0 "罗纳德·里根！"
 NPP_collapse.33.t:0 "不可避免的结果"
 NPP_collapse.33.desc:0 "约基静静地坐着，读着桌上的报告。国会里充满了老牌金融家和反西方情绪，这一直是他和国家先锋队的眼中钉。他们联合起来，组成了一支野蛮的文化秃鹰军团，试图从西方文明带来的福利中汲取营养。当他继续阅读报告时，他的脸慢慢扭曲成咆哮，直到他愤怒地把报纸摔到坚决的桌子上。那些宣扬对美国文化及其与平等和堕落的纠缠的原始解释的人必须被拖拽和殴打，直到他们只不过是一个污点。\n\n当约基思考如何应对犹太人的阴谋时，他的拳头握得更紧了，而这个阴谋只是为了拼命捍卫美国人民的觉醒而更加公开化。显然，需要对那些劣等者展示武力，以展示欧洲文明回归美国，以及消除黑帮、外国人和政治组织本身所感染的文化扭曲。当约基从突发的发作中平静下来时，一个想法浮现在他的脑海中：第9066号行政命令，强制监禁那些因日本血统而服务于欧洲以外利益的人。它们感染了美国人的欧洲传统，虽然有限，但这一命令是新政堕落海洋中的一个清晰的时刻。他们自我脱离社会，并一直被视为持不同政见者。\n\n重新执行这一命令将成为他对政治组织的最后行动，对反对他的愿景的抵制余烬的最后一击。当受到直接挑战时，国会就会像老鼠一样屈服于他的意志，从此，美国就可能被从文化退化的怀抱中拖走。"
 NPP_collapse.33.a:0 "...并回到西方文明的怀抱。"
 NPP_collapse.34.t:0 "一个篮子里的鸡蛋"
 NPP_collapse.34.desc:0 "“先生。总统先生，国会推翻了您的命令。”副总统拜尔斯在进入椭圆形办公室时说道。拜尔斯坐下来继续说道：“他们已经确保文化破坏者暂时不会受到惩罚。先生，这显然是针对民族先锋队的阴谋，是让我们屈服于他们野蛮欲望的策略。他们甚至开始谈论潜在的弹劾程序——”拜尔斯发现自己被打断了，异常平静的约基打断了他的自发演讲。\n\n“我从一开始就预见到了这一点，拜尔斯。政治组织总是试图封锁我们的真相，并将其原始的宣传强加给群众。他们的理性主义思想从美国诞生之日起就一直控制着美国，从而导致了后来与西方文明真正理想的决裂。这只会进一步证明我们的理想；这个国家的堕落已经暴露在宪法本身的范围之内。没有一篇文章是被这个反对我们和在这个国家实施国家社会主义的犹太布尔什维克阴谋所污染的。但现在阴谋败露，我们就可以直接绞杀这个阴谋的幕后黑手。”约基从椅子上站起来，双臂放在桌子两侧，说道。\n\n“我将用他们自己的阴谋来推翻国会内的堕落者。当他们阻止我们的可悲尝试被否决时，他们就会在先锋面前崩溃。他们自己促进文化落后的方法被用来对付他们，这对犹太布尔什维克阴谋家来说将是前所未有的震惊，因为他们看到自己的体系在他们面前崩溃。他们将被暴露为美国心理背后的疾病，从那时起，我们更强大的权力意志将像害虫一样践踏他们！”约基以一声大喊结束了这一切，这背叛了他之前平静的举止，而副总统拜尔斯则敬畏地坐回原处。"
 NPP_collapse.34.a:0 "随着控制的加强，总统变得更加大胆。"
 NPP_collapse.35.t:0 "反抗的美国意志"
 NPP_collapse.35.desc:0 "约基盯着他面前桌子上休眠的牛皮纸文件。他摸索着封条，犹豫地用拇指和食指捏住里面高高的白色床单，然后将棕色文件扔到椅子下面的深蓝色地毯上。扫视着那张可怜兮兮的单面报告的行程，他的目光飞快地落在薄薄的纸面上潦草地写下的一句话上。\n\n“最高法院拒绝恢复第9066号行政命令，称其有违宪特征——”\n\n总统的表情充满了困惑，然后变成了恐惧，最后变成了愤怒，他用手使劲撕碎了这张纸，把碎片扔到了那份该死的报告诞生的棕色纸质档案旁边。他本来应该是总统，是全美国最明智、最有权威的人物！然而，他在这里却受到最高法院中一些普遍存在、爱管闲事的修正主义者以及最近从NPP美国国家先锋队叛逃的人的破坏。他们应该低下头，向他的权威屈服，这样他才能维护西方文明的神圣品质，但不，他们必须以自由主义垃圾的名义颠覆他的果断行动，现在他们来了他。约基在白宫的日子已经结束了，他知道这一点。\n\n美利坚合众国总统坐下来，伸手拿起办公桌上的旋转电话，以不规则的节奏在键盘上敲入十个数字，然后瘫坐在椅子上，等待回应。"
 NPP_collapse.35.a:0 "“弗兰茨，给我找一张他妈的飞往瑞士的航班。”"
 NPP_collapse.36.t:0 "淘汰新的，融入旧的"
 NPP_collapse.36.desc:0 "当约瑟夫进一步走进大楼时，脚步声在空荡荡的走廊里回响。 国家进步公约进步派的多位代表呼吁在明尼阿波利斯召开会议，以解决最近宣布的玛格丽特·蔡斯·史密斯打算竞选连任总统的消息。她一直是国家进步公约中备受争议的面孔，约瑟夫为这场可能持续数小时的会议做好了心理准备。\n\n“史密斯与国民党团合作太多，我们无法考虑支持她。我们有多少改革因为这些该死的乡巴佬而受阻？如果不是因为他们抱怨联邦越权，《经济安全法》本可以覆盖美国的每个人。”当约瑟夫的同事杰拉尔德走进房间时说道，其他代表对杰拉尔德的话越来越感兴趣，没有注意到他们。 “不仅如此，美国呢？由于国民党对史密斯的束缚，本来每个美国人都可以接触到的东西却仅限于老年人。”杰拉尔德继续说道。当代表们消化他的言论时，他们的谈话就被遗忘了。\n\n“这就是为什么，先生们，我建议我们再次提名斯库普为总统候选人。他一直把每个美国人的利益放在第一位，我毫不怀疑——”杰拉尔德慷慨激昂的演讲突然被另一位名叫弗兰克的代表打断。\n\n“再次？随着史密斯的武力威胁，我们已经在与日本走上核钢丝。如果杰克逊能逃脱惩罚，他就会掐死日本大使！”他说道，打破了杰拉尔德为其他代表演讲的热情。\n\n“你愿意我们臣服于东京吗？”杰拉尔德咆哮着回应。 “他们不会相信外交政策会在一夜之间发生如此荒谬的转变。斯库普将使我们能够实现每个公民的国内平等，并使日本人处于不利地位。”杰拉尔德结束时，一些代表为他的言论欢呼，而另一些代表则表达了他们的不满。约瑟夫把头埋在双手中，他预测这次会议会持续几个小时的想法又来困扰着他。"
 NPP_collapse.36.a:0 "事实证明，约瑟夫是对的。"
 NPP_collapse.37.mcs.t:0 "现任者的失败"
 NPP_collapse.37.mcs.desc:0 "“这真是太荒谬了。她已经是跛脚鸭了，现在还去讨好进步派？看在上帝的份上，请不要开玩笑说她把马克思主义者带进来了——她可能会这么做，”亨利抱怨道。国家进步公约进步派的代表们在他们惯常的聚会地点召开了一次临时会议，他和他的同事也被邀请参加。\n\n同事詹姆斯在回答之前思考了很长时间。 “你知道，我听说有人可以提供帮助。他们称她为‘老保守派’，我们需要这样的强硬手段。” “她的名字叫菲利斯·施拉夫利，她在我们阵营中肯定引起了很多人的关注。”\n\n亨利似乎并不完全相信。 “我记得人们对史密斯有这样的评价，她是多么明智和经验丰富。他是那种管理严密的领导人。”他嘲讽地说，既针对她自己，也针对她的支持者。 “那么施拉夫利可以做些什么来让我们走上正轨呢？”\n\n他的朋友在盘子上倾身向前。 “早些时候我和我的另一位朋友吵架了。他们正在谈论的政策之一是收紧福利。这样一来，系统中的水蛭就少了很多，”詹姆斯热情地解释道，似乎赢得了他朋友的注意。周围有一些竞选口号，‘施拉夫利带我们飞向月球’，”他继续说道，声音里带着一丝有趣的刺痛。\n\n亨利现在看起来已经从忧郁的沉思中恢复过来，似乎对这位新崛起的保守派的话非常感兴趣。 “嗯嗯，感觉有点牵强。 “菲利斯和我们在一起，这个口号怎么样？”在两人开始讨论这位新候选人的竞选和规划的细节之前，他建议道。但有一件事是肯定的——现状正变得越来越脆弱。"
 NPP_collapse.37.a:0 "尽管轮子吱吱作响，但它仍在继续转动。"
 NPP_collapse.37.t:0 "崛起的老保守派"
 NPP_collapse.37.desc:0 "“那真令人恶心！”一个翻领上别着国家进步公约国民党团胸针的肥胖中年男子用张开的手掌拍打着大圆桌，隆隆地说道。 “哈林顿是红军！这是再明显不过的事了，但那个黄鼠狼和他的追随者却总是打着温和的幌子，从里到外毒害我们的国家！”他咆哮道，脸涨得和他面前的茶杯一样红。\n\n坐在他旁边的年轻同伴郑重地点点头。 “我真的不知道当我们的军队完全被忽视时，他如何带领我们同时对抗德国人和日本人！我们还要等多久，我们才会陷入另一场全面战争，而没有真正的战斗手段？多亏了他，我们才成了纸老虎！”他抱怨道，双臂紧紧抱在胸前。\n\n第三个人穿着整洁的细条纹西装，身体前倾，手指交叉放在桌子上。 “先生们，”他平静地说，“我们要么坐在这里咆哮一整天，要么我们可以做点什么。”\n\n老者挑眉，转过头去注意。 “你说我们做什么？我们不能在这里发动内战。”\n\n西装男子轻轻摇头。 “没有比这更粗鲁的事情了。你看，NPP-N 中有一位真正的后起之秀，一位名叫菲利斯·施拉夫利的女性，”他解释道，并将一份档案放在桌子上，正面夹着她的照片。 “读一下这篇文章吧，一个坚强而明智的保守派。正是我们所需要的。”另外两个人靠过来，全神贯注地阅读政策和意见文件。\n\n年轻人试探性地点点头。 “我……想我可以支持这件事。那么下次初选时，我们会让施拉夫利女士获得提名，她会让我们走上正路吗？”他问道。两人同时抬头，与西装男子对视。"
 NPP_collapse.37.b:0 "“不错。”"
 NPP_collapse.38.t:0 "契约中的裂痕"
 NPP_collapse.38.desc:0 "所有人都同意，日出是自然界中最确定的事情。那么，想象一下，中午的午夜——天空中的巨大光球应该是最明亮、最温暖的，然而却只剩下新月之夜的寒冷黑暗，让它下面的一切都陷入寒冷和绝望的颤抖。 国家进步公约进步派的代表一直在听广播。宣布消息前房间里的欢腾气氛几乎消失殆尽，笑声戛然而止。\n\n漫长的几分钟后，新闻报道转变为赞助信息和广告。这类东西和废话人们可以放心地忽略，而在场的一个人终于打破了阴沉的沉默，这种沉默就像一层无法穿透的雾气笼罩在他们中间。 “我不相信，”他嘶哑地说，因为紧握着啤酒瓶，指节发白。 “那些该死的混蛋……他们该死——”\n\n“他们背叛了我们，”他的一位在场朋友打断道，语气略显有力。 “协议，谁太害怕改变，选民不知道什么对他们有好处。他们刚刚把选举扔进了垃圾桶，都是为了这个老太婆！”他咆哮着，猛地喝掉自己的饮料，甩掉几滴液体，然后把脸埋进双手里。\n\n“如果他们像这样背叛我们，那一切就都完了。”旁边的人用他的语气插话道。 “民主党看起来有一个不错的候选人。我们永远无法从国家进步公约得到我们需要的东西，而我，就一个人来说，已经厌倦了被束缚。”他站了起来。 “谁支持我？”他大声喊叫，试图让其他人摆脱恐惧。"
 NPP_collapse.38.a:0 "一致通过。"
 NPP_collapse.39.mcs.t:0 "老生常谈，老幢常修"
 NPP_collapse.39.mcs.desc:0 "当玛格丽特·蔡斯·史密斯宣布国家进步公约对她对该党的领导仍然充满信心时，施拉夫利难以置信地坐着。事情本来不应该是这样的；他们揭露了史密斯在竞选活动中所有可悲的做法。她的“无声革命”失败了，这场革命促使妇女放弃家庭的基本结构，转而接受无骨气精英的自由主义宣传收买。它所造成的只是对开国元勋们所制定的传统的系统性萎缩，让可怜的妇女被洗脑，相信自由者的谎言。\n\n施拉夫利站了起来，捂住了裙子的边缘，转身离开，她不想再听到“美国之夜”再次重复的谎言。当她开始走向出口时，施拉夫利回忆起史密斯经常与之妥协的进步派的自由主义者和共产主义者如何不断寻求将勇敢的美国儿子牺牲给外国贪图便宜的人，他们会嘲笑美国急于消灭他们的人民而他们则在国内放松，利用美国媒体作为宣传，宣扬毫无意义的国际主义，以牺牲美国的尊严为代价来谋求自己的利益。\n\n就在那时，当施拉夫利的手放在门把手上时，她意识到了一个严峻的现实。 国家进步公约已证明自己充斥这共产主义者和法西斯同情者。即使她的直接行动也不足以阻止开国元勋们的愿望进一步破灭。她必须回到共和党，希望能在美国政治中找到一些意义。要从愚蠢的共和党叛逃中恢复过来需要时间。也许，到了适当的时候，她就能重新获得党的信任。然后，当自由主义者控制美国的阴谋被揭露，人们认识到他们的宪法出生权利正在被纽约造王者之手篡改时，随着共和党掌权和自然秩序，她会对他们的垮台微笑的东西都恢复了。"
 NPP_collapse.39.a:0 "她转动门把手就离开了，再也没有回来。"
 NPP_collapse.39.t:0 "冉冉升起新星的陨落"
 NPP_collapse.39.desc:0 "当哈林顿登上讲台时，施拉夫利感到难以置信。他像老鼠一样乱窜，宣布重新提名为国家进步公约在即将到来的选举中的主要候选人。尽管她参加了竞选活动，窃笑的政治精英再次冷落了她的保守主义言论，这四年已经足够让哈灵顿的危险思想陷入她的政党的尸体中。\n\n她相信美国的情况会变得更好，但事实证明她从共和党的叛逃完全没有意义。在1968年选举中破坏戈德华特的令人窒息的民主党人的手与国家进步公约进步派的手没有什么不同。他们都竭尽全力扼杀美国，并将其尸体拖入国外的暴力冲突，看着他们的儿子死于华盛顿造王者的一时兴起，这些造王者试图让美国成为他们的傀儡，嘲笑美国愿意为他们跳舞。\n\n施拉夫利抬头看了一眼哈林顿。施拉夫利此前已经不再胡言乱语，他重新将注意力集中在演讲上，聆听哈灵顿继续承诺在党内保持温和，以提升“另一个美国”的地位。施拉夫利哼了一声。这种言论只是为了猛烈地动摇美国的社会结构，事实已经证明它是极其危险的。它已经随心所欲地重塑了国家进步公约，让代表们感染了一种只有少数人承认的疾病。那些支持施拉夫利的人将她视为共产主义手中的救世主，但为时已晚。\n\n哈林顿的演讲结束后，施拉夫利从椅子上站起来，突然准备离开。她不需要从国家进步公约内的蛇那里听到任何虚假的道歉。尽管她蔑视这个概念，但她必须做什么是显而易见的。回归共和党。共和党是唯一能够认识到像戈德华特这样的烈士的价值的政党。施拉夫利承认她过去叛逃到国家进步公约的错误，并明白由于她的背叛，她可能永远不会再获得提名。尽管如此，她还是决定返回家乡，致力于指导那些反对华盛顿卑鄙的拥立者的人。"
 NPP_collapse.39.b:0 "总比魔鬼好……"
