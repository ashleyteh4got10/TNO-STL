 USA.senate.21.t: "本次民主党竞选活动非常精彩！"
 USA.senate.21.desc: "我们最近一次地区竞选活动的结果非常出色。我们的筹款超出了预期，无论是小额捐款还是重要政治行动委员会的贡献。从州立法选举到参议院竞选，候选人表现得非常出色。而且，根据我们的组织者在现场的反馈，志愿者士气前所未有地高涨。我们在许多关键选区都处于非常优势的位置，有望取得胜利！"
 USA.senate.21.a: "好极了！"
 USA.senate.22.t: "本次民主党竞选活动还算不错！"
 USA.senate.22.desc: "我们最近一次地区竞选活动的结果总体上是积极的。筹款和现金储备达到了我们最乐观的预期。同时，我们的候选人在民意调查中表现良好，并且在竞选过程中通常能够避免失言和不必要的错误。我们应该有望在11月份赢得多场选举。"
 USA.senate.22.a: "好消息！"
 USA.senate.23.t: "本次民主党竞选活动非常平庸！"
 USA.senate.23.desc: "我们最近一次地区竞选活动的结果顶多算是一般。多位候选人的一系列失言引起了相当多的负面关注，筹款并没有达到我们的预期，许多参议院和众议院竞选活动都难以吸引志愿者和组织者。就目前而言，我们这一轮竞选的前景远未达到理想状态。"
 USA.senate.23.a: "吃一堑长一智。"
 USA.senate.24.t: "本次民主党竞选活动糟糕透顶！"
 USA.senate.24.desc: "我们最近一次地区竞选活动的结果非常糟糕，没有其他更好的形容词了。我们的候选人犯了许多错误，没有吸引到任何正面关注。与此同时，我们在电视和广播广告上的支出被对手超过。更糟糕的是，许多选区没有任何志愿者或组织者。也许我们可以扭转局势，但对于这个联盟来说，形象实在是糟糕透顶。"
 USA.senate.24.a: "酿成大错……"
 USA.senate.25.t: "本次共和党竞选活动精彩纷呈！"
 USA.senate.25.desc: "我们最近一次地区竞选活动的结果非常出色。我们的筹款超出了预期，无论是小额捐款还是重要政治行动委员会的贡献。从州立法选举到参议院竞选，候选人表现得非常出色。而且，根据我们的组织者在现场的反馈，志愿者士气前所未有地高涨。我们在许多关键选区都处于非常优势的位置，有望取得胜利！"
 USA.senate.25.a: "为共和党人欢呼！"
 USA.senate.26.t: "本次共和党竞选活动比较扎实！"
 USA.senate.26.desc: "我们最近一次地区竞选活动的结果总体上是积极的。筹款和现金储备达到了我们最乐观的预期。同时，我们的候选人在民意调查中表现良好，并且在竞选过程中通常能够避免失言和不必要的错误。我们应该有望在11月份赢得多场选举。"
 USA.senate.26.a: "干得漂亮，各位！"
 USA.senate.27.t: "本次共和党竞选活动平淡无奇！"
 USA.senate.27.desc: "我们最近一次地区竞选活动的结果顶多算是一般。多位候选人的一系列失言引起了相当多的负面关注，筹款并没有达到我们的预期，许多参议院和众议院竞选活动都难以吸引志愿者和组织者。就目前而言，我们这一轮竞选的前景远未达到理想状态。"
 USA.senate.27.a: "下次再努努力。"
 USA.senate.28.t: "本次共和党竞选活动堪称灾难现场！"
 USA.senate.28.desc: "我们最近一次地区竞选活动的结果非常糟糕，没有其他更好的形容词了。我们的候选人犯了许多错误，没有吸引到任何正面关注。与此同时，我们在电视和广播广告上的支出被对手超过。更糟糕的是，许多选区没有任何志愿者或组织者。也许我们可以扭转局势，但对于这个联盟来说，形象实在是糟糕透顶。"
 USA.senate.28.a: "这些竞选顾问到底是干什么吃的？！"
 USA.senate.29.t: "民主党在[GetOppositionCampaignRegion]的竞选活动大为成功"
 USA.senate.29.desc: "从各方面来看，民主党在过去几周里进行了一场出色的地区竞选。他们的候选人沉着应对竞选活动，联盟吹嘘创纪录的筹款金额，甚至我们的选民也被民主党志愿者敲门。不管我们自己做得如何，这对于我们的竞选活动来说显然不是一个好趋势。"
 USA.senate.29.a: "不能让他们超过。"
 USA.senate.30.t: "民主党在[GetOppositionCampaignRegion]的竞选活动表现不错"
 USA.senate.30.desc: "据报道，民主党最近的地区竞选活动对联盟来说进展顺利。虽然他们并没有让我们大吃一惊，但他们的筹款一直很稳定，他们的候选人很有吸引力，而且他们的选民热情正是他们在11月获胜所需要的。"
 USA.senate.30.a: "我们得盯着他们点……"
 USA.senate.31.t: "民主党在[GetOppositionCampaignRegion]的竞选活动表现很一般"
 USA.senate.31.desc: "根据我们的实地人员的说法，最近的民主党地区竞选活动可以用“平庸”来形容。他们的政治行动委员会和竞选组织表现不佳，而他们的候选人在民意调查中落后，并没有引起多少热情。根据我们的命运，他们可能还有机会，但他们最近遇到的困难对我们的11月大选来说无疑是个好兆头。"
 USA.senate.31.a: "好极了。"
 USA.senate.32.t: "民主党在[GetOppositionCampaignRegion]的竞选活动翻车了"
 USA.senate.32.desc: "据全国各地当地报纸的头版报道，民主党最近的地区竞选活动翻了个大车。在筹款数量不佳、选民热情低落以及民主党候选人一系列奇怪的失态之间，仅靠他们的失败，我们很可能就能在11月表现出色。"
 USA.senate.32.a: "别高兴得太早了。"
 USA.senate.33.t: "共和党在[GetOppositionCampaignRegion]的竞选活动非常耀眼"
 USA.senate.33.desc: "从各方面来看，共和党在过去几周里进行了一场出色的地区竞选。他们的候选人沉着应对竞选活动，联盟吹嘘创纪录的筹款金额，甚至我们的选民也被热切的共和党志愿者敲门。不管我们自己做得如何，这对于我们的竞选活动来说显然不是一个好趋势。"
 USA.senate.33.a: "我们必须加把劲了。"
 USA.senate.34.t: "共和党在[GetOppositionCampaignRegion]的竞选活动稳步推进"
 USA.senate.34.desc: "据报道，最近的共和党地区竞选对联盟来说进展顺利。虽然他们并没有让我们大吃一惊，但他们的筹款一直很稳定，他们的候选人很有吸引力，而且他们的选民热情正是他们在11月获胜所需要的。"
 USA.senate.34.a: "我们还有机会赶超他们。"
 USA.senate.35.t: "共和党在[GetOppositionCampaignRegion]的竞选活动乏善可陈"
 USA.senate.35.desc: "根据我们实地人员的说法，最近的共和党地区竞选活动可以用“平庸”来形容。他们的政治行动委员会和竞选组织表现不佳，而他们的候选人在民意调查中落后，并没有引起多少热情。根据我们的命运，他们可能还有机会，但他们最近遇到的困难对我们11月的大选来说无疑是个好兆头。"
 USA.senate.35.a: "老天保佑！"
 USA.senate.36.t: "共和党在[GetOppositionCampaignRegion]的竞选活动很惨淡"
 USA.senate.36.desc: "据全国各地当地报纸的头版报道，最近在国家进步公约地区的竞选运动以惊人的方式失败了。在筹款数量不佳、选民热情低落以及共和党候选人一系列奇怪的失态之间，我们很可能仅靠他们的失败就能在11月取得好成绩。"
 USA.senate.36.a: "德语里没有这个词可以形容这种感觉吗？"
 SWRW_USA_skeleton.1.t:0 "[Get_newspaper_header]1972年国家进步公约全国代表大会骚乱"
 SWRW_USA_skeleton.1.desc:0 "今天，在佛罗里达州迈阿密的街道上，混乱成为了热门话题，因为国家进步公约全国代表大会召开之前，紧张局势正在酝酿之中。大楼内外的骚乱者抗议国家进步公约的决定。当晚共有三名抗议者被杀，数百人受伤，数量不详的人被拘留，这被描述为美国历史上最暴力的抗议活动之一。\n\n在会议中心内，来自全国各地的代表们混乱地提出或撤回对众多总统候选人的支持，各个派系分裂了整个政党。有一段时间，似乎整个国家进步公约都崩溃了，但最终，选出了一名候选人，大会也结束了。"
 SWRW_USA_skeleton.1.a:0 "一栋快垮的房子都比这强。"
 SWRW_USA_skeleton.2.t:0 "[Get_newspaper_header]国家进步公约进步派的解散"
 SWRW_USA_skeleton.2.desc:0 "斯库普·杰克逊昨天在新闻发布会上证实，进步党已经完蛋了，在杰克逊和休伯特·汉弗莱之间进行了几个月的安静谈判之后，该党将再次与民主党重新整合。\n\n这一消息对许多人来说并不意外，因为联盟中的不满情绪日益浓厚，该党在选举中一直未能取得成功，支持率整体下降，这成为许多党员不满的根源，一些人认为这是不可避免的，另一些人则尤其如此。国家进步公约的国民党团称其为“对美国真正信徒的残酷背叛”。尽管国民党团宣称将反抗这一巨大的叛逃，但许多观察家认为该联盟明年仍无法维持下去。"
 SWRW_USA_skeleton.2.a:0 "那国民党团接下来会咋办？"
 SWRW_USA_skeleton.3.t:0 "[Get_newspaper_header]共和党与国家进步公约的国民党团合并"
 SWRW_USA_skeleton.3.desc:0 "纳尔逊·洛克菲勒昨晚证实，经过洛克菲勒与国民党参议员斯特罗姆·瑟蒙德几个月的谈判，国民党已正式不复存在，其所有职能由共和党接管。\n\n这一消息对许多人来说并不意外，因为联盟中的不满情绪日益浓厚，该党在选举中一直未能取得成功，支持率整体下降，这成为许多党员不满的根源，一些人认为这是不可避免的，另一些人则尤其如此。国家进步公约的进步派残余人士称其为“对美国真正理想的残酷背叛”。尽管国家进步公约进步派宣称将反抗这一巨大的叛逃，但许多观察家认为该联盟明年仍无法维持下去。"
 SWRW_USA_skeleton.3.a:0 "巴顿的梦想破灭了。"
 SWRW_USA_skeleton.4.t:0 "[Get_newspaper_header]共民联盟的终结"
 SWRW_USA_skeleton.4.desc:0 "民主党全国委员会发言人证实，他们将不再与共和党进行任何层面的合作，结束了过去十五年来持续存在的共民联盟。在NPP作为选举力量的崩溃之后，民主党和共和党分别都在与左翼和右翼新意识形态的涌入作斗争，政党领导人们最终发现试图挽救联盟“不再可行”；尽管明确可以看出，民主党发起了分裂。\n\n自十九世纪中期以来一直主导政治领域的两个政党现在将再次对峙。对于民主党来说，现在的焦点转向他们是否能够重新获得1948年至1956年间相对于共和党的选举优势。只有时间才能证明一切。"
 SWRW_USA_skeleton.4.a:0 "驴还能再次茁壮成长吗？"
 SWRW_USA_skeleton.5.t:0 "[Get_newspaper_header]共民联盟的终结"
 SWRW_USA_skeleton.5.desc:0 "共和党全国委员会发言人证实，他们将不再与民主党进行任何层面的合作，结束了过去十五年来持续存在的共民联盟。在NPP作为选举力量的有效崩溃之后，民主党和共和党分别都在与左翼和右翼新意识形态的涌入作斗争，政党领导人最终发现试图挽救联盟“不再可行”；尽管明确可以看出，共和党发起了分裂。\n\n自十九世纪中期以来一直主导政治领域的两个政党现在将再次对峙。对于共和党来说，现在的焦点转向民族主义者的涌入能否帮助他们夺回对国家体制的控制权；自《赤城协议》以来，他们在这个体制中的状态日益恶化。"
 SWRW_USA_skeleton.5.a:0 "象从错误中吸取教训了吗？"
 SWRW_USA_skeleton.6.t:0 "[Get_newspaper_header]预算危机"
 SWRW_USA_skeleton.6.desc:0 "今天早上早些时候，美国总统格斯·霍尔宣布预算案已经起草并获得批准，打算立即生效。在宣布这一消息后的新闻发布会上，霍尔澄清说，他绕过了国会对预算案的批准，并指出主要原因是程序过于陈旧。预算案是国会内部和公众激烈辩论的焦点。\n\n尽管霍尔在国会中的支持率虽小但声音很大，但众议院议长蒂普·奥尼尔表示，他们不会承认该预算案具有法律约束力。霍尔已经明确表示他将对这一决定提出异议，最高法院正准备召开会议做出决定。"
 SWRW_USA_skeleton.6.a:0 "对已经摇摇欲坠的体制的另一次考验。"
 SWRW_USA_skeleton.7.t:0 "[Get_newspaper_header]霍尔总统辞职"
 SWRW_USA_skeleton.7.desc:0 "格斯·霍尔宣布辞去美国总统职务。霍尔早些时候发现自己在国会和最高法院都遇到了麻烦，主要是因为他的国会预算案在没有得到国会任何意见或同意的情况下通过。因此，如果霍尔不辞职，国会很可能会投票弹劾他，无论如何都会把他赶出白宫。\n\n由于霍尔的副总统保罗·罗伯逊在两天前刚刚辞职，副总统一职目前空缺。根据《总统继任法》制定的总统继任法，下一位总统继任者是众议院议长蒂普·奥尼尔，他现在面临着团结被共产主义分裂了三年的民众的艰巨任务。"
 SWRW_USA_skeleton.7.a:0 "极端主义在美国的终结。"
 SWRW_USA_skeleton.8.t:0 "[Get_newspaper_header]约基总统恢复第9066号行政命令"
 SWRW_USA_skeleton.8.desc:0 "弗朗西斯·约基总统今天通过白宫发表声明，宣布恢复第9066号行政命令。该命令最初是在第二次世界大战期间制定的，允许美国政府在不经审判的情况下将日裔美国人转移到拘留营。\n\n日本已发表外交声明，严厉谴责约基总统“对在美日本人的公然种族歧视”，此举引发了美国民众和许多著名政治领导人的广泛抗议。许多有影响力的国会议员宣布，他们将竭尽全力阻止该命令。"
 SWRW_USA_skeleton.8.a:0 "一个已经摇摇欲坠的体制再次崩溃。"
 SWRW_USA_skeleton.9.t:0 "[Get_newspaper_header]弗朗西斯·帕克·约基失踪"
 SWRW_USA_skeleton.9.desc:0 "经过数月的抗议和骚乱后，国会开始推进对弗朗西斯·约基总统的弹劾。数百名武装分子和总统的支持者试图阻止弹劾，但无济于事，国民警卫队迅速恢复了秩序。\n\n国会指控约基和他的副总统路易斯·T·拜尔斯犯有叛国罪、违反宪法以及与国家敌人勾结的罪名。然而，由于约基的审判早于拜尔斯的审判，他在审判开始前设法逃离了国会大厦。由于约基失踪，拜尔斯被捕并拘留，随后对约基发出了逮捕令。众议院议长蒂普·奥尼尔接替拜尔斯担任代理总统——这一角色肯定很快就会永久化。"
 SWRW_USA_skeleton.9.a:0 "一个耻辱的结局。"
 SWRW_USA_skeleton.10.t:0 "[Get_newspaper_header]乔治·W·罗姆尼连任美国总统"
 SWRW_USA_skeleton.10.desc:0 "乔治·罗姆尼总统今天宣誓就任美国总统，开始第二个任期。在警惕的人群中，罗姆尼总统发誓要继续他的温和保守主义道路，同时强调共和民主联盟崩溃后团结的重要性。\n\n到目前为止，罗姆尼的工作仍然受到公众的欢迎，但随着共民联盟的瓦解，另一边没有人真正反对他。罗姆尼接下来的走向几乎完全取决于他，一些人已经预测，由于他不再对民主党负责，他会向右转。"
 SWRW_USA_skeleton.10.a:0 "罗姆尼将何去何从？"
 SWRW_USA_skeleton.11.t:0 "[Get_newspaper_header]珍妮·柯克帕特里克连任美国总统"
 SWRW_USA_skeleton.11.desc:0 "迄今为止，珍妮·柯克帕特里克总统的“通过力量实现和平”倡议似乎已取得巨大成功，今天她的努力已结出硕果。这位民主党领袖再次击败了她的竞争对手，这一次是在重生的共和党中，赢得了四年的总统任期。\n\n柯克帕特里克的第二个任期看起来将是她第一个任期的直接延续。她发誓要在全球展示美国实力的过程中继续推行强势干预主义，并在国内建立自由主义价值观。然而，柯克帕特里克在第二个任期内能取得多大成就，已经不再受共和党的限制，而仅仅取决于民主党想走多远。"
 SWRW_USA_skeleton.11.a:0 "民主党又统治四年。"
 SWRW_USA_skeleton.12.t:0 "[Get_newspaper_header]罗纳德·里根就任美国总统"
 SWRW_USA_skeleton.12.desc:0 "罗纳德·里根就任美利坚合众国总统，这在四年前是不可想象的。这位前演员、现任加州州长利用最近熟悉的国家进步公约国民党团的叛逃者转投共和党的机会，确保了自己作为总统主要候选人的地位。\n\n里根的当选标志着与二战以来共和党传统的重大背离，该传统强烈关注美国作为自由世界领导者的干预主义，并在面对不受约束和不公正的情况时培养美国价值观的核心形象。世界乱世变迁。里根能否在新崛起的共和党领导下成功领导美国还有待观察。"
 SWRW_USA_skeleton.12.a:0 "演员登上了舞台。"
 SWRW_USA_skeleton.13.t:0 "[Get_newspaper_header]霍华德·贝克就任美国总统"
 SWRW_USA_skeleton.13.desc:0 "霍华德·贝克正式宣誓就职，成为继托马斯·杜威之后第一位纯粹的共和党人总统。贝克的当选让许多人震惊，也让其他人松了一口气。贝克是党内两个更直言不讳的派别之间的妥协候选人，并在竞选椭圆形办公室时有效地利用了他两党合作的出色记录。\n\n现在担任总统，贝克希望提高政府的透明度，重新获得人民的信任，这种信任在尼克松政府末期已完全丧失，但自杜威总统初期以来，在共和党中就没有真正存在过。只有时间才能证明美国人民是否像贝克所说的那样紧紧抓住他的心。"
 SWRW_USA_skeleton.13.a:0 "一个更加诚实的政府就在前方。"
 SWRW_USA_skeleton.14.t:0 "[Get_newspaper_header]查尔斯·H·佩西就任美国总统"
 SWRW_USA_skeleton.14.desc:0 "查尔斯·佩西已正式宣誓就任美国总统。这位来自伊利诺伊州的年轻参议员是共和党中更加自由派的成员，他与共和党同行的区别在于，他一贯忽视传统的共和党投票路线，只顾自己的良心和实用主义。佩西的公众形象在竞选过程中大大提高。由于佩西的年轻和魅力，一些出版物甚至称他为“共和党的肯尼迪”。\n\n佩西在就职演说中承诺，他将使国家恢复受杜威政府启发的自由共和党政策。尽管这种做法遭到了国会中强硬派共和党人的反对，但许多人将佩西视为未来四年的希望灯塔。"
 SWRW_USA_skeleton.14.a:0 "一项艰巨的任务摆在面前。"
 SWRW_USA_skeleton.15.t:0 "[Get_newspaper_header]吉米·卡特就任美国总统"
 SWRW_USA_skeleton.15.desc:0 "吉米·卡特已正式宣誓就任美国总统。卡特原本是黑马候选人，但在共民联盟分裂后，他的支持率飙升，被视为能够吸引独立选民的温和派力量。卡特的当选代表了南方民主党作为政治力量的复兴，也标志着美国外交政策向和平主义的急剧转变。\n\n卡特经历了美国历史上最不寻常的总统之路之一。在海军服役一段时间后，卡特转向花生种植，在竞选佐治亚州参议员之前，他在那里经营着一家成功的企业。尽管身在南方各州，卡特还是成为了一名民权倡导者，最终将目光投向了州长职位，并一直任职到总统竞选。"
 SWRW_USA_skeleton.15.a:0 "让我们看看这个花生农能做什么。"
 SWRW_USA_skeleton.16.t:0 "[Get_newspaper_header]伯奇·贝赫就任美国总统"
 SWRW_USA_skeleton.16.desc:0 "民主党全面回归，伯奇·贝赫在早些时候宣誓就任美国总统。贝赫在党内的崛起可归因于他对社会改革的坚定信念以及在参议院的影响力。贝赫在其整个职业生涯中一直倡导公民权利和性别平等，并在成功提出“第九条”后接受了民主党提名，这使他一夜之间成为变革的象征。\n\n由于美国仍处于共民联盟灾难性终结的阴影之中，贝赫在卸任时是否能够实现选举改革和进一步民权立法的雄心勃勃的目标还有待观察。但与此同时，民主党可以期待四年的单独执政。"
 SWRW_USA_skeleton.16.a:0 "美国梦高高矗立。"
 SWRW_USA_skeleton.17.t:0 "[Get_newspaper_header]泰德·肯尼迪就任美国总统"
 SWRW_USA_skeleton.17.desc:0 "爱德华·摩尔·肯尼迪、，通常被称为特德·肯尼迪，最近就任美国总统。肯尼迪是当前肯尼迪一代最小的弟弟，在随着进步党的涌入获得民主党提名之前，他作为科罗拉多州参议员享有成功的职业生涯。\n\n肯尼迪总统在就职演说中热情地谈到了医疗改革的必要性以及他与众议院和参议院民主党人共同努力通过全民医疗保健。然而，这位新就任的总统面临着一条艰难的道路，既面临共和党的反对，又面临已故兄弟的阴影笼罩在他头上。尽管如此，总统仍然有能力满足甚至超越人们对他的崇高期望。"
 SWRW_USA_skeleton.17.a:0 "第三次会有好运气了吧……？"
 SWRW_USA_skeleton.18.t:0 "[Get_newspaper_header]贝赫总统废除选举人团制度"
 SWRW_USA_skeleton.18.desc:0 "美国发生了令人高度震惊和意想不到的政治事态发展，伯奇·贝赫宣布将在1980年大选前解散选举人团。多年来，人们认为改变选举制度的可能性更大，但由于南方的反对，这一法案被认为通过的机会极低。贝赫迅速采取行动，最终获得了胜利，引导宪法修正案获得所需的38个州的批准，以确认宪法修正案。\n\n一些人对此举表示欢迎，认为这将创造公平的竞争环境并使政治更加公平。其他人则持更为批评的态度，称这将为政治强人介入打开大门。然而，有一点是肯定的：美国的选举制度已经发生了不可逆转的改变。"
 SWRW_USA_skeleton.18.a:0 "一个更有活力的民主？"
 SWRW_USA_skeleton.19.t:0 "[Get_newspaper_header]选举人团制度保持不变"
 SWRW_USA_skeleton.19.desc:0 "在1976年总统大选恢复两党制后，国会议员力图避免重蹈20世纪50年代末选举的混乱局面。他们试图解决这个问题，最终导致参议员伯奇·贝赫提出了一项以两轮选举制度取代选举人团制度的法案。然而，尽管该法案在众议院令人信服地获得通过，但未能克服南方的阻挠。\n\n全国各地的保守派人士都对这一结果表示赞赏，一些人表示，他们国家的领导地位不会由“城市暴民统治”决定。巴伊参议员发表声明，宣称他将继续为“破碎的制度”争取选举改革。然而，他的选举改革梦想似乎已经破灭，至少目前如此。"
 SWRW_USA_skeleton.19.a:0 "选举改革不可能让所有人满意。"
 SWRW_USA_skeleton.20.t:0 "[Get_newspaper_header]平等权利修正案灾难"
 SWRW_USA_skeleton.20.desc:0 "抗议和愤怒充斥着华盛顿特区的街道，因为平等权利修正案试图正式建立性别平等并抵制前总统菲利斯·施拉夫利的反女权主义行动。修正案尽管在国会获得通过，但未能获得所需的75%的州批准。施拉夫利的持续倡导，加上现任总统罗纳德·里根对该修正案的冷漠，事实证明足以否认该修正案的通过。\n\n随着该法律现已正式失效，调查已经开始，以调查妇女权利组织的广泛抗议背后的任何潜在的不正当行为或收买行为。截至今天，白宫尚未就该运动的失败发表正式声明。"
 SWRW_USA_skeleton.20.a:0 "倒在最后一关。"
 SWRW_USA_skeleton.21.t:0 "[Get_newspaper_header]教育法修正案第九条得到加强；施拉夫利遭羞辱"
 SWRW_USA_skeleton.21.desc:0 "在一个奇特的事件转变中，美国的妇女权利取得了重大胜利——这让女总统非常懊恼。尽管施拉夫利总统多次公开谈论妇女在日常生活中的作用，但没有人预料到她会厚颜无耻地废除民权运动的最新成就之一。\n\n否决之后，国会两党议员立即联合起来，表示两党支持推翻否决。主要的参议员谴责施拉夫利废除第九条的企图是违宪行为，而一些人认为这是一种团结行为，另一些人则认为这是一种恶意行为。来自共民联盟和国家进步公约进步派的参议员起草了一项法案，以进一步加强民权法案，预计该法案将在参议院迅速通过。"
 SWRW_USA_skeleton.21.a:0 "当女权获得胜利时，女总统落泪了。"
