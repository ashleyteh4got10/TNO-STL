 USA_elec_prim.17.h: "柯克帕特里克当选总统！"
 USA_election_helpers_1976.1.desc:0 "美国再次为大选季做准备。根据宪法规定，众议院所有席位和参议院三分之一席位将在11月进行角逐，全国无数州和地方选举也将展开，美国政治的走向也将随之改变。维持现状还是彻底剧变，是时候由人民来决定了！\n\n共民联盟和国家进步公约以及众多第三方党派正在50个州准备他们的政治机器，特别关注那些可供争夺的参议院席位。数以万计的志愿者、竞选工作人员和候选人正准备开始初选、集会、短暂巡演、公开演讲、问候和辩论，这些将在未来几个月内成为全国关注的焦点。重大问题将得到辩论，候选人将受到审查，最终全国数百万选民将有机会表达自己的声音。世界上最伟大的民主将再次证明自己。\n\n然而，在国家进步公约瓦解的混乱中，共民联盟发现自己的分歧越来越大，并选择进行单独的竞选活动。看来，经过二十年和三届联合总统选举后，国家的命运将再次掌握在象和驴的手中。"
