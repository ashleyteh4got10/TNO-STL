 USA_elec_prim.17.t: "1976年大选日"
 USA_elec_prim.17.desc: "一年多的公告、辩论、演讲和集会于1976年11月5日选举日结束。数百万美国人在全国各地的学校体育馆、图书馆、民事中心和消防站排队，履行公民和民主义务。今年是第48届四年一次的总统选举，但还将举行15个州和地区的州长选举，以决定州长、33 个参议院席位和众议院的全部435个席位，以及许多其他地方和州市长、议员、全国各地的治安官和法官。\n\n然而，随着投票结束，每个人都在电视和广播中了解总统选举。随着夜幕降临，计票和报告即将结束，谁将在接下来的四年里入主白宫呢？情况很快就会明朗起来……"
