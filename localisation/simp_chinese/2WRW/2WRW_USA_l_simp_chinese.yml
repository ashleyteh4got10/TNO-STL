 USA_Ronald_Reagan:0 "罗纳德·里根"
 POLITICS_RONALD_REAGAN_DESC:0 "尽管对于那些第一次知道罗纳德·威尔逊·里根是共和党总统候选人的人来说可能会感到震惊，但这位前加州州长曾经是一位坚定的民主党人。在好莱坞任职期间，里根是美国劳工联合会-产业工会联合会、美国演员工会和富兰克林·罗斯福总统的拥护者和盟友。然而，到当选州长时，里根的政治倾向几乎发生了彻底的转变。\n\n作为州长，里根致力于重新确立自己作为法律和秩序、亲商政策和普通美国人税收减免的候选人的地位。此后的几年里，他作为共和党领导人的崛起可以归因于他与生俱来的强大魅力。他感人而诚实的演讲以及对美国例外论的呼吁点燃了工人、骄傲的基督徒和郊区居民的心中之火。\n\n现在，作为美国总统，里根和他当选椭圆形办公室代表着对自第二次世界大战结束以来定义共和党的保守传统的明显背离。现在是做出选择的时候了，美国人民已经让他们的选择为人所知：“大政府”的时代已经结束，取而代之的是一场基于基督教价值观的新运动，一支旨在让德国军队畏缩的军队在里根和他的内阁的掌舵下，一个国家再次变得伟大。"
 USA_Charles_Percy:0 "查尔斯·佩西"
 POLITICS_CHARLES_PERCY_DESC:0 "纵观其历史，共和党向许多不同的民族代表了许多不同的事物。自林肯之后的几十年里，一些人试图将其本质重塑为分裂、偏执和仇恨的力量，以及制定不顾美国人民意愿的议程的力量。查尔斯·哈廷·佩西总统代表了对这些目标的完全彻底拒绝，并转向温和、负责任的保守主义。\n\n佩西最初作为伊利诺伊州参议员开始了他的政治生涯，受到艾森豪威尔总统和纽约州州长纳尔逊·洛克菲勒的目标和价值观的启发。在参议院的整个任期内，他无视任何关于共和党意味着什么的先入为主的观念，始终根据自己的良心而不是党派理论家的突发奇想进行投票。当共和党的激进分子强烈反对《民权法案》时，佩西致力于为美国下层阶级确保经济适用房和明智、务实的外交政策。\n\n这种对两党合作、民权、工薪穷人和美国在全球利益的奉献精神一直伴随着佩西一路走到宾夕法尼亚大道。他的成功和当选总统是希望的灯塔，不仅是对国家的希望，也是共和党的理想，不是由仇恨或恶意定义的，而是通过合作、妥协和努力争取更美好的明天。统一。"
 USA_Howard_Baker:0 "霍华德·贝克"
 POLITICS_HOWARD_BAKER_DESC:0 "在每个国家的历史上，都会有这样一个时刻，它需要一个坚定而有经验的手，此时内部和外部的困境可能会让任何其他没有经验的年轻人感到恐慌并火上浇油。老霍华德·亨利·贝克不是那个人。霍华德·贝克是田纳西州亨茨维尔最受喜爱的儿子之一，他从一开始就证明了自己的政治勇气，其根源可以追溯到他父亲在众议院任职的时期。\n\n从新奥尔良图莱里大学毕业后，霍华德在第二次世界大战期间加入海军并成为一名中尉。回家后，他将通过律师资格考试并开始律师执业。尽管他的政治生涯开始时相当不稳定，在 1964 年的参议院选举中输给了罗斯·巴斯，但他在 1966 年东山再起，成为重建时代以来田纳西州第一位共和党参议员，也是田纳西州第一位通过普选进入参议院的参议员。贝克很快就被称为“伟大的调解者”——以促成妥协、制定立法和始终保持文明而闻名。\n\n70 年代对于美国和世界来说都是一个动荡的时期。无论是石油危机的冲击还是第二次西俄战争中的东欧，全球都受到了这样或那样的震动。在贝克坚定的掌舵下，美国将经受住这场十年来的风暴。"
