 USA_presidental_candidate_ted_kennedy:0 "爱德华·M·肯尼迪"
 USA_presidental_candidate_birch_bayh:0 "伯奇·E·贝赫"
 USA_presidental_candidate_jimmy_carter:0 "詹姆斯·E·卡特"
 USA_presidental_candidate_ronald_reagan:0 "罗纳德·W·里根"
 USA_presidental_candidate_howard_baker:0 "霍华德·A·贝克"
 USA_presidental_candidate_charles_percy:0 "查尔斯·H·佩西"
 USA_Ted_Kennedy:0 "泰德·肯尼迪"
 POLITICS_TED_KENNEDY_DESC:0 "众所周知，那些出生在财富和影响力中的人都是与世隔绝的，他们相信那些不如他们幸运的人确实比他们低一等。爱德华·摩尔·肯尼迪反对这一不幸的趋势。\n\n泰德·肯尼迪出身于一个由参议员、众议员、市长、大使组成的王朝，当然还有一位总统——他的兄弟约翰·F·肯尼迪。肯尼迪王朝一直掌握着一定的权力，但许多人认为，从他最年轻的时候起，他就会逐渐默默无闻。特德克服了这些疑虑，坚持了下来。像他的前辈兄弟一样，他去了哈佛大学，不可避免地在弗吉尼亚大学学习法律。在帮助他的兄弟进行政治竞选的同时，特德爱上了科罗拉多州，搬到了那里，并最终于1962年竞选参议员。在兄弟的激励下，他为医疗保健、福利和劳工权利而奋斗。特德忍受了肯尼迪家族的悲剧，并在这段时期找到了政治上的繁荣。他被同行称为“参议院之狮”，担任委员会主席并掌控许多立法。\n\n1976年大选到来时，他竞选总统并获胜。泰德不再只是参议院的领袖，而是默默无闻的弟弟。他是美国总统。他追随兄弟的脚步，为人民而战，希望将美国带入一个繁荣的新时代。现在，女士们先生们，是时候开始谈正事了。"
 USA_Tip_O_Neill:0 "蒂普·奥尼尔"
 POLITICS_TIP_O_NEILL_DESC:0 "美国梦已被玷污，现在只有小托马斯·菲利普·奥尼尔才能拯救它。\n\n从萨克拉门托到萨凡纳，以前的爱国主义和团结都因缺乏恶人而被抛在一边。国会的礼仪已经被打破，留下来收拾残局的人现在必须乘着核电站崩溃的浪潮。美利坚合众国正陷入前所未有的危机，无论好坏，唯一能够改变局势的人就是奥尼尔。奥尼尔（被亲切地称为“蒂普”）处于连开国元勋们都无法理解的境地，他必须调和美国的民族精神，以免他让它溃烂并腐蚀民族意识。\n\n奥尼尔出生于马萨诸塞州北剑桥，毕业于波士顿学院。在马萨诸塞州众议院短暂任职后，他于 1952 年当选为全国众议院议员，并很快成为波士顿同胞约翰·威廉·麦科马克的得意门生。\n\n20世纪70年代，蒂普·奥尼尔很快晋升众议院领导层，最终成为众议院议长。然而，随着前任总统被弹劾，他被匆忙就任临时总统。上届政府造成的混乱将迫使他倾向于联邦的基本理想。他的共和党和民主党联合政府必须迅速让参议院恢复礼仪，并消除过去四年造成的损害。"
 POLITICS_BIRCH_BAYH_DESC:0 "小伯奇·埃文斯·贝赫代表了民主党的未来，是照亮美国阴影的指路明灯，而贝赫将采取一切必要手段确保火炬永远不会熄灭。\n\n贝赫出生于1928年，父母是工人阶级，26岁时便进入政坛，最终以民主党成员身份担任印第安纳州众议院院内领袖，随后当选为美国参议院议员。贝赫是第35任总统埃斯蒂斯·基福弗的盟友，他倡导公民自由，并在《基福弗-塞拉反托拉斯法》和具有里程碑意义的《第24条修正案》的通过中发挥了重要作用，该修正案废除了种族歧视性的人头税。随着贝赫提出第九条和第二十六条修正案，提高了他在民主党中的地位，迅速成为美国眼中社会变革的象征。\n\n贝赫现在担任美国总统，是宪法改革的倡导者。他致力于解决体制内存在的歧视和不公正现象，倡导公民权利和性别平等，希望将美国从不受控制的激进主义和偏见中解放出来。对于一些人来说，他的天真和农家男孩的举止可能很明显，但对于他的支持者来说，贝赫捍卫美国人民的倾向弥补了这一点。\n\n对于贝赫来说，美国梦必须永远持续下去。"
 POLITICS_BIRCH_BAYH_VP_DESC:0 "小伯奇·埃文斯·贝赫代表了民主党的未来，是照亮美国阴影的指路明灯，而贝赫将采取一切必要手段确保火炬永远不会熄灭。\n\n贝赫出生于1928年，父母是工人阶级，26岁时进入政坛，最终以民主党成员身份担任印第安纳州众议院院内领袖，随后当选为美国参议院议员。作为切普政府的副总统，贝赫向周围的人表明了他的立场和决心，他尽最大努力并成功地阻止了城市改造计划被废除。他对前总统哈特议程的奉献精神得到了民主党提名并最终当选总统的回报。\n\n贝赫现在担任美国总统。鉴于他担任副总统的经验和在竞选集会上的魅力，这对于忠诚的民主党人甚至反对派来说并不奇怪。贝赫已经表明，他是一个意志坚定的人，他将确保在他自己的选举改革议程的同时，哈特和切普的愿景得到全面贯彻。"
