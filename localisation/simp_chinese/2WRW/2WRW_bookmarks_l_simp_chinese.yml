 BOOKMARK_SVERDLOVSK_BLOCKER_DELAYED: "§Y帕维尔·巴托夫的统一后内容将在§R四§!§Y鹰§!§W奇事§!版本里发布§!\n\n§W为§R俄罗斯§!服役§!\n§W--------------\n\n\n£GFX_texticon_bookmark_SVR\n\n\n\n\n§F俄罗斯只有在她的儿女再次§G统一§!时才能休息。\n\n曾经强大的§K沙皇帝国§!在§R俄国内战§!的烈焰中支离破碎，然后又在§s大日耳曼国§!的§r战争机器§!下再次支离破碎。如今，俄罗斯的各片领土成了无家可归和绝望者的避难所，都在前苏联的§x无政府状态§!下苟延残喘。苦苦挣扎的军阀争夺剩下的废墟，进一步加剧了俄罗斯的绝望。\n\n然而，在这场痛苦的风暴中，存在着一片§M希望§!的孤岛：§B斯维尔德洛夫斯克§!。\n\n§Y康斯坦丁·罗科索夫斯基§!领导着红军的一个派别，他的门徒§d帕维尔·巴托夫§!也在其中。罗科索夫斯基脱离了§e斯大林主义者§!和那些追随§q卡尔比舍夫§!言论的人，他致力于摆脱意识形态，将国家引向一个坚定的目标：稳定。无论他们是主张人民权利的民主派还是别的什么；斯维尔德洛夫斯克的人们只关心一件事：让俄罗斯的土地恢复和平。在军事的关怀下，§e激进主义§!将被§G镇压§!，§x激情§!将被§M冷却§!。一旦俄罗斯的领土恢复了稳定，仅差最后一步前红军的灵魂就可以安息了：\n\n§s大日耳曼国§!必须被§x摧毁。§!§!§!"
