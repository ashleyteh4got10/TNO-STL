 BOOKMARK_RUSSIA_DELAYED: "于§f胜利日§!版本中§M添加§!：\n\n§Y1976年，所有俄罗斯军阀第二次西俄罗斯战争结束后的4年重建内容\n\n全新的故事文本\n\n除法西斯统一者通用的额外四年政治内容\n\n在八年时间中，将俄罗斯建设为世界上除§x美利坚§!§W合众§!§B国§!之外的唯一的超级大国§!\n§W--------------\n\n\n£GFX_texticon_bookmark_UKR\n\n\n\n\n§F1972年，§W俄罗斯§!再度统一，整个国家都进行着战争准备。\n\n1975年，§x第二次西俄罗斯战争§!爆发，§W俄罗斯§!，§BOFN§!，§e共荣圈§!与§q团结协定§!的最后一战爆发，§R不是你死，就是我亡§!。\n\n1976年，战争结束了。俄罗斯夺回了她应得的领地，正进行着重建与发展。然而，这种§a四极格局§!毕竟是不稳定的。§q德§!§B美§!§W俄§!§e日§!四个国家中，一定会有两个国家在§C梦幻泡影般的80年代§!退场，最终形成新两极格局——§x譬如俄罗斯(苏联)§!和§B美国§!的两级冷战，一直持续到新千禧。§!"
 BOOKMARK_SUR_BLOCKER: "§u荷兰王国§!"
 BOOKMARK_SUR_BLOCKER_DELAYED: "§f将在§J黑色郁金香§!版本中发布\n§F--------------\n\n\n£GFX_texticon_bookmark_SUR\n\n\n\n\n若你询问一个荷兰人他的身份，他会愤慨地向你讲述他民族的故事：诉说故土昔日的荣光、惨痛的败北、流亡中的凤凰涅槃，以及人民如何在荷兰人民运动党的神圣领导下团结一心，在南美海岸建立新家园，静待荣归故里的时机。\n\n然而这个流亡国度正站在十字路口。现行政治体制使权力不断向荷兰人民运动党集中。但随着重建阶段落幕，荷兰人面临冷战升级的动荡局势——议会内外、苏里南乡间，反对党的声势日益高涨，政治前景愈发晦暗不明。\n\n当流亡荷兰的第一篇章即将翻页，众多新锐人物已在队列中蓄势待发，企图以各自的方式重塑国家与民族。或许这群适应流亡环境的新生代政客，真能引领国家走向辉煌未来，甚至重返故土。"
