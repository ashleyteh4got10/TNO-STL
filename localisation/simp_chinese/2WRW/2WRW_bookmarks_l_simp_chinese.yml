 BOOKMARK_NOVOSIBIRSK_USA_DELAYED: "于§O新十年§!版本中§M添加§!：\n\n§Y1976年大选中的格伦任期，将可游玩时间延长至1984年\n\n全新的GFX界面和故事文本\n\n动态的核武、战争及政治机制\n\n在八年之内，带领美国从登月失败的阴影中走出，登录火星§!\n§W--------------\n\n\n£GFX_texticon_bookmark_USA\n\n\n\n\n§F1962年，随着尼克松的一纸命令，§mNASA§F面临着几近解散的危机。作为美国的第一个绕地飞行宇航员，§W约翰·格伦§F对此痛心疾首，并发誓要在未来实现他的梦想。\n\n1964年，§W格伦§F高调宣布竞选州长职位，并成功成为俄亥俄州的参议员。此后，他一直蛰伏着，等待时机，向着总统宝座发起冲锋。\n1976年，随着§O国家进步公约§F的解体，§W约翰·格伦§F知道这就是最好的时机了。他宣布参与进行总统选举，并希望能够一举夺下总统宝座，重振§mNASA§F，向着§e新边疆§F前进。§!"

