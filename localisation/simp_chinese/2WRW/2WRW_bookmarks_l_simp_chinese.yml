 BOOKMARK_KAMCHATKA_NEW_DELAYED: "§M已于§O索拉里斯§!版本中添加：§!\n\n§Y§x苏联§!§W太平洋§!§m舰队§!至§O大动乱时期§!的两年内容\n\n全新的国策树、GFX和文本\n\n两个GUI机制§!\n§W--------------\n\n\n£GFX_texticon_bookmark_KMC\n\n\n\n\n§F堪察加半岛正在§R慢慢消亡§!\n\n前§x苏联§!§W太平洋§!§m舰队§!的残余统治，由伊万·尤马舍夫上将领导，曾经自豪的太平洋舰队在1953年外满洲干涉期间被£GFX_jap_ija_texticon §j关东军§!从他们的旧家符拉迪沃斯托克赶走，然后又被£TNO_game_rule_flag_CHT £TNO_game_rule_flag_AMR £TNO_game_rule_flag_MAG §W哈尔§!§o滨§!§L三巨头§!从马加丹赶走，现在他们发现自己漂泊孤独地停泊在彼得罗巴甫洛夫斯克-堪察加的小港口。\n\n他们的船只生锈，人们挨饿，舰队别无选择，只能通过§W海盗行为§!来维持生计，抢劫北太平洋上的£TNO_game_rule_flag_USA §M美国§!和£TNO_game_rule_flag_JAP §e日本§!船只，而曾经自豪的£UKR_communists  §x共产主义§!传统逐渐消失，沦为土匪。这支§m舰队§!§x是否会§!再次§W崛起§!，抑或永远崩溃，只留下§j生锈的船只§!和§Q汹涌的海浪§!？§!"
 BOOKMARK_NOVOSIBIRSK_NEW: "§W新西伯利亚§!§G和§!§m阿尔泰§!§G联邦§!"
 BOOKMARK_NOVOSIBIRSK_NEW_DELAYED: "于§O索拉里斯§!版本中§M添加§!：\n\n§Y舒克申领导下的§W俄罗§!§m斯§!§V联邦§!的四条全新路线，将可游玩时间延长至1980年\n\n全新的GFX界面和故事文本\n\n动态的核武、战争及政治机制§!\n§W--------------\n\n\n£GFX_texticon_bookmark_NOV\n\n\n\n\n§F源自§R西伯利亚战争§!的烈焰，§G新西伯利亚和阿尔泰联邦§!是一个强大的主权民主国家；能够保护其公民，同时通过自由企业和企业的善意来建设繁荣。\n\n然而，对§m瓦西里·舒克申§!来说，这与事实差距甚远……\n\n作为联邦最有权势的人物之一 - 除了总统外 - 难民首都巴尔瑙尔的受欢迎市长如今发现自己陷入了他曾经帮助创造的绝望体制中。舒克申只能望着时间流逝，等待他能够抓住权力的时刻，让寡头统治的§Y西罗维基§!被边缘化，并最终将他的新兴国家变成一个人民真正可以§m信§!§V赖§!的国家。§!§!"

