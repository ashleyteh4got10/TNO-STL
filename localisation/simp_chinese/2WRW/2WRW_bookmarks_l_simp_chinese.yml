 BOOKMARK_SAF_NEW_DELAYED: "倘若你观察南非，便会发现这个国家仿佛被冷战时代所遗忘。它固守着永久中立，与广阔世界保持距离，转而向内发展。自二战结束、英国流亡者抵达开普敦海岸以来，国家实现了令人瞩目的增长。统一党宣称：自1902年起便确立的执政党领导地位、英裔主导格局及制度化的种族隔离现状将永世长存。\n\n但时代洪流不可阻挡。非洲人国民大会正逐步组织起来，为那些始终被当作劳动力、剥夺一切代表权的原住民争取彻底平等；流亡境外的极端阿非利卡人组织“牛车卫队”在边境另一侧积蓄力量，誓要以任何代价推翻英裔统治，建立纯正的“民族国家”。当境外势力与国内变革力量即将兵戎相见，跳羚之国的未来唯有时间能给出答案。"

 SAF_THENEWORDER_DESC: "§FSouth Africa has always been a crossroads of many different peoples. After the consolidation of British rule over South Africa with the completion of the Second Boer war in 1902 where the descendants of the original Dutch settlers were crushed and forcibly incorporated into the Dominion of South Africa, something that the Boer had never really forgotten about. Yet with the sudden, shocking end of the British empire at the end of the Second World War left the Dominion staring down three massive German Reichkommisariats to the north, as South Africa became the last bastion of democracy on the African continent.\n\nA democracy for some, that is. South Africa's majority Black population have no voice in how the country is run by the Anglo-Saxon United party, while the Boers' contacts with the German colonies in the north continue to deepen. It is clear that in 1962 South Africa finds itself on a crossroad between two rising forces both intent on taking up arms for their future. The fine balance between German and American influence externally and Boer and ANC influence internally is starting to break down, and soon enough the greatest crisis in South Africa's history is about to begin. Will South Africa perish under its own contradictions, or rise like a phoenix through fire and flame?§!"
 BOOKMARK_VASILEVSKY_NEW: "§x人民革命委员会§!"
 BOOKMARK_VASILEVSKY_NEW_DELAYED: "§Y新内容将在§R赤色长空§!版本里发布：\n\n出发！\n§W--------------§!\n\n\n£GFX_texticon_bookmark_PRC\n\n\n\n\n§Y     - 前十年内容完全重置\n     - §V革命§!前路如何？\n     - 全新的§W战后十年内容§!，延长内容至1982年\n     - §R所有人的革命§!§!§!\n§W--------------§!\n§O一片土地，两个派系，三驾马车。§!\n\n§W这就是对§x“人民革命委员会”§!最好的注解。亚历山大·华西列夫斯基，前苏军元帅，现在正率领他的部队龟缩于俄罗斯的一隅，唐努图瓦。但这并不是事情的结束，威胁苏维埃祖国的，不仅有§q西方的£GFX_OMS_great_trial_texticon 纳粹§!，更有来自§V东方的£GFX_jap_ijn_texticon 旭日§!，以及§r内部的敌人§!。对于亚历山大·华西列夫斯基来说，等待着他与§V人民革命委员会§!的，是希望，还是绝望？中西伯利亚战争将他逼到了克孜勒做最后的拮抗，北方正面临着反苏势力的威胁，东方也正在和日本人做最后的斗争。\n\n§R在三面夹击之下，亚历山大·华西列夫斯基，选择了共抵外侮。§!\n\n无论是蒙古派也好，俄国派也罢，对亚历山大·华西列夫斯基来说，都是必须团结的力量。他要在这绝境当中，谋出一条生路。而这条生路，必定是道阻且长。于是，他的心中浮现出了一个宏大的计划：光复祖国，光复全苏联。他绝不甘于在此绝境等待死亡，他要做的，不仅是摆脱绝境，更是要§e重拾苏联建立之初的理想——§!\n\n§V一切权力归苏维埃！§!§!"