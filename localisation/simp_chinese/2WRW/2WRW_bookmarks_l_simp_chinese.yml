 BOOKMARK_OMSK_BLOCKER_DELAYED: "§Y统一后内容将在§W冰上大战§!版本里发布\n\n§R大审判§!即将来临！§!\n§W--------------\n\n\n£GFX_texticon_bookmark_OMS\n\n\n\n\n§F对德米特里·卡尔贝舍夫而言，仇恨一直是他最大的盟友。\n\n面对德国众多集中营中的饥饿、死亡和酷刑，正是他的仇恨让他活了下来。他被自己的国家遗忘，而他拒绝接受失败的态度促使他逃亡。他回到破碎和分裂的俄罗斯，他立志是有朝一日为他的同志报仇雪恨，这导致了§Y黑色联盟§!的成立，一个以§G民族生存§!和§R大审判§!为宗旨的国家。\n\n然而，在残酷的命运转折中，仇恨成了卡尔贝舍夫最大的敌人。\n\n年老体衰的黑色联盟领袖发现自己处处受制于人，他最伟大的作品现在被复仇的渴望所支配，就连他自己也曾认为这是难以想象的。这是一个不寻求打败德国，而是摧毁它的国家；一个不打算保护俄罗斯，而是要牺牲它的国家。\n\n现在，随着大日耳曼国日渐衰弱，激进的极端军国主义军官§Y德米特里·亚佐夫§!成为他的继任者，但这位垂死的将军只有一件事很清楚：§r日耳曼人§!将为他们抢劫和偷窃的每一块俄罗斯，不，每一寸土地付出代价；\n\n§x我们将不计任何代价。§!§!§!"
 BOOKMARK_WRRF_BLOCKER: "§P西俄罗斯§x革命阵线§!§!"
 BOOKMARK_WRRF_BLOCKER_DELAYED: "§Y米哈伊尔·图哈切夫斯基线的统一后内容将在§x红色拿破仑的进军§!版本里发布\n\n传播§x革命§!\n-------------\n\n\n£GFX_texticon_bookmark_WRF\n\n\n\n\n§F苏联已经§e失败了§!。\n\n被德国战争机器在§r巴巴罗萨行动§!中撕裂，被“自由”世界在§R第一次西俄罗斯战争§!中遗弃，任何曾经对旧联盟的骄傲已经消失。即使在西俄罗斯革命阵线的街头，那里的市民饥肠辘辘，人们穿着骸骨般的制服，谁能相信革命只是昙花一现的狂喜，一个无法实现的梦呢？\n\n然而，有些人不那么容易被说服。\n\n在冰冷的普列谢茨克和乌赫塔，§x米哈伊尔·图哈切夫斯基§!和§P格奥尔吉·朱可夫§!拒绝接受联盟的失败。他们的军事才能仅次于对联盟的忠诚，这两位将军中的一位必将取代虚弱的§Y亚历山大·叶戈罗夫§!成为革命阵线的统帅。尽管他们的野心可能大相径庭，但无论谁获胜，他们的崛起将在世界各地产生震动。边界将被扩张，工厂将重新点亮，不久之后，阵线的目光将再次转向西方。\n\n而这一次，他们将不会失败。否则，§x苏联的§R子民们§!§!将§e白白牺牲§!。§!§!"
