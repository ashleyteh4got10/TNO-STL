 BOOKMARK_MAGADAN_BLOCKER_DELAYED: "§Y尼古拉·佩特林的统一后内容将在§m我们，§!§W人民§!版本里发布§!\n\n建立一个§W更§!§m完美§!的§V联盟§!§!\n§W--------------\n\n\n£GFX_texticon_bookmark_SVR\n\n\n\n\n§F§d尼古拉·佩特林§!已经给他的人民带来了一场§J瘟疫§!。\n\n在§Y俄罗斯法西斯党§!分裂成敌对派系之后，他站在党内§n复兴主义者§!和§j亲德分子§!一边，帮助巩固了在§L马加丹§!这个小港口的全俄元首§J米哈伊尔·马特科夫斯基§!的统治。所谓的§s“白衣恶魔”§!承诺通过他的务实法西斯主义实现国家复兴。他承诺只有他才能恢复俄罗斯的荣耀。他承诺绝对的统治和绝对的胜利。\n\n但尽管话是这么说，元首的政策还是§e失败了§!。\n\n马加丹濒临§x崩溃§!的边缘，由于党的腐败和铁腕统治，市民们在挨饿。佩特林看着这种贫困和恐惧，他认为俄罗斯法西斯党已经失败了。这个港口唯一取得的成功还是由于§i美国§!的仁慈，提供援助和装备，以及§M自由§!和§B民主§!的理念。\n\n无论他过去犯下了多少§e罪恶§!，佩特林现在在马特科夫斯基的§q阴影§!中工作，颠覆元首的权威，试图弥补他创造的、他正躲避的这个怪物的过错。马加丹远非其宣传中的§y山巅之城§!，但经过足够谨慎的操纵，也许它，和整个§Q俄罗斯§!一起，可以成为佩特林渴望的自由和繁荣的灯塔。也许它可以成为一个§M自由§!之地，那时§M自由§!的呼声将响彻四方，让暴君们为之§R震颤§!。\n\n也许佩特林的灵魂尚未走向§G救赎§!。§!"
