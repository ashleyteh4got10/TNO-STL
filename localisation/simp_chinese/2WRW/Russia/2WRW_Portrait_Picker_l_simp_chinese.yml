 SWRW_RUS_portrait_category: "头像选择"
 SWRW_NOV_portrait_picker: "舒克申的头像"
 NOV_Shuk_Picker:0 "总统的外貌"
 portrait_picker.1.t:0 "总统的外貌"
 portrait_picker.1.d:0 "舒克申坐在桌前，为即将发表的演讲做着笔记。这次演讲很特别，所以他第一次打算换一下制服。在他的整个总统任期中，一些公关顾问表达了对他每次新闻发布会和政治集会上过于简单的服装的担忧。为了安抚这个出奇地响亮的团体，他打算试试不同的装扮。他派人去叫裁缝，然后等待着他的到来。\n\n“总统先生，您决定穿什么呢？”"
 portrait_picker.1.a:0 "我想，我会保持我的经典外观。"
 portrait_picker.1.b:0 "着装得体！把我的外套和墨镜给我！"
 portrait_picker.1.c:0 "人民敬仰强势领袖。我会蓄一些胡子。"
 portrait_picker.1.e:0 "我必须看起来专业和整洁。把那件漂亮的黑色西装取出来。"
 SWRW_RUS_portrait_category2: "头像选择"
 SWRW_WRS_portrait_picker: "图哈切夫斯基的头像"
 portrait_picker.2.t:0 "拿破仑式的装束"
 portrait_picker.2.d:0 "图哈切夫斯基坐在办公桌前揉着眼睛，呻吟着。虽然他很喜欢他的睡袍和一套温暖的睡衣，但最近红军的胜利要求他更积极地与普通人打交道，至少他身边的将军们都在背后取笑他的着装品味。虽然他通常只会枪毙反对者，但今天他感到有一种奇怪的需要，那就是要安抚他的幕僚和士兵，他决定尝试一些更正式的着装。他派人去找他的私人裁缝（以前是朱可夫的裁缝），一直等到他终于到来。\n\n“那么您想穿什么样的衣服呢，同志——呃，大元帅？”"
 portrait_picker.2.a:0 "还是坚持我的经典造型吧，也就是我们贴在所有邮票上的那种。"
 portrait_picker.2.b:0 "我他妈还是个老男人啊！快把我的外套给我！"
 portrait_picker.2.c:0 "有一次我在梦中看到过这件衣服（我也想看起来像蟾蜍）"
 portrait_picker.2.e:0 "一套整洁的西装就行！"
 portrait_picker.1.f:0 "我会选择穿新棕色西装和戴眼镜。"