 SWRW_nuke_development_category_desc: "为了在世界舞台上取得她应有的地位，[RUSGetUniqueName]需要自己的核计划。虽然我们不奢望立即获得核弹，但我们必须为一个合理的研究计划打下基础，只有这样，当§R潜在的冲突§!来临的时候，我们才可以与我们的敌人掰掰手腕。"
