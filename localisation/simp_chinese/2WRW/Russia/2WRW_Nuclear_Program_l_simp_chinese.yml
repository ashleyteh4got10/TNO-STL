 Nuclear_Program_Invest_PP_tt:0 "将政治力量与我们的核计划相融合，这将有助于促使我们的政府为核计划投入更多资源。\n\n§Y这个月§!，额外的政治投入将使我们本阶段的完成进度§G增加[?Nuclear_PP_Extra_True]%§!。下个月，在目前表示的投资水平下，额外的政治投入将使我们本阶段的完成进度§G增加[?Nuclear_PP_Extra]%§!\n\n点击修改投入： §G+§!/§R-§!0.2£political_power_texticon 每日获得的政治点数\n\n§Y点击信息按钮，查看你已经投入了多少§!"
 Nuclear_Program_Invest_Research_tt:0 "从其他更常规的技术上转移研究资源可能有助于更早完成。\n§Y这个月§!，额外的研究投入使我们本阶段的完成进度§G增加[?Nuclear_Research_Extra_True]%§!。下个月，在目前表示的投资水平下，额外的资金投入将使我们本阶段的完成进度§G增加[?Nuclear_Research_Extra]%\n\n点击修改投入： §G+§!/§R-§!2.5%£research_speed_icon §Y研究速度§!\n\n§Y点击信息按钮，查看你已经投入了多少§!"
 Nuclear_Program_Invest_Money_tt:0 "无尽的资金流动将确保[ROOT.GetNameDef]的生存！\n\n§Y每个月§!，额外的资金投入将使我们本阶段的完成进度§G增加[?Nuclear_Money_Extra_True]%§!。下个月，在目前指示的投资水平下，额外的资金投入将使我们本阶段的完成进度§G增加[?Nuclear_Research_Extra]%\n\n点击修改投入： §G+§!/§R-§!10£dollar_sign 每月M美元\n\n§Y点击信息按钮，查看你已经投入了多少§!"
 Nuclear_Program_Info_tt:0 "§W我们国家这个月§!：\n\n每天多消耗[?Nuclear_PP_Extra_Cost_True]£political_power_texticon §Y政治点数§!\n£research_speed_icon §Y研究速度§!下降[?Nuclear_Research_Extra_Cost_True_Displayer|%]%\n每月多花费£dollar_sign [?Nuclear_Money_Extra_Cost_True_Displayer]§YM美元§!\n\n§W您对投资水平所做出的更改将导致下个月产生以下成本§!：\n\n每天多消耗[?Nuclear_PP_Extra_Cost]£political_power_texticon §Y政治点数§!\n£research_speed_icon §Y研究速度§!下降[?Nuclear_Research_Extra_Cost|%]%\n每月多花费£dollar_sign [?Nuclear_Money_Extra_Cost_Displayer]§YM美元§!"
