l_simp_chinese:
 RUS_WRW_Generic_Authoritarian_tree: "威权意识形态 - 战争国策树"
 RUS_Our_War_of_Strength: "我们的强国之战"
 RUS_Our_War_of_Strength_tt: "将从§o大日耳曼国§!收回[RUSGetUniqueNamePlain]的§x被窃领土§!"
 RUS_Our_War_of_Strength_desc: "德国人是鲁莽的畜生。他们倾向于称呼那些正当地反对他们野蛮行径的人为“ 下等人”，但这并不能动摇我们高贵的人民。我们的人民一次又一次地面对比德国更强大的敌人，并且获得了胜利。蒙古人，鞑靼人，波兰人和立陶宛人，瑞典人，奥斯曼人，甚至是拿破仑的军队，都被我们的智慧所打败！\n\n今天，我们再次为我们的祖先世世代代为之奋斗和流血的事业而战：将另一个外来压制者从我们的领土上驱逐出去！留里克王朝的精神，涅瓦河畔的涅夫斯基，叶卡捷琳娜大帝的精神都在每一个骄傲的[RUS.GetAdjective]人的血液中流淌，因为他们都知道，这场战争不仅仅是为了荣耀，不仅仅是为了民族自豪感，更是为了民族自身的未来！"
 RUS_Strongarm_the_Populace: "武装民众"
 RUS_Strongarm_the_Populace_desc: "随着我们的战争机器前进，勇敢的[RUS.GetAdjective]生命消逝，[RUS.GetAdjective]装备毁于战火。当然，大多数自豪的[RUS.GetAdjective]人意识到在我们勇敢而正义的斗争的更大背景下，这些损失的必要性，但我们社会中也有人持不同看法。即使我们的胜利必将在地平线上显现，这些堕落者错误地认为我们的损失超过了与日耳曼败类抗争的收获。\n\n绝不能让那些呼吁达成白色和平甚至投降的愚昧之徒玷污战争的完整。异见分子的袭击将受到致命力量的镇压，并且我们将实行媒体封锁，以防止这些叛徒的进一步渗透。有了这些，我们只能希望现在公众能更加接受我们的斗争。"
 RUS_Expand_the_MIC: "扩展军工复合体"
 RUS_Expand_the_MIC_desc: "任何武装冲突的支柱都是工厂的钢铁与汗水。没有强大的工业和稳定的装备供应，军队将衰弱下去，尽管人力更多、士气更高，也会在面对实力较弱的敌人时节节败退。我们不能允许[RUSGetUniqueNamePlain]陷入这样的命运，也不能害怕采取一切必要的措施来阻止它。\n\n[RUSGetUniqueNameTitle]已经因为数十年的德国空袭和战争对经济的严重伤害而陷入劣势。为了确保士兵有充足的供应，我们必须增加与军事公司的合同资金，如果需要，还必须国有化关乎战争的关键产业。将东欧从纳粹的铁蹄下解放出来必须成为国家的首要任务，而战胜第三帝国的唯一途径就是在武器优势上取得胜利。"
 RUS_Forwards_for_Russia: "前进，为了[RUSGetUniqueNameTitle]！"
 RUS_Forwards_for_Russia_desc: "在[RUSGetUniqueNamePlain]中，没有人对这场战争的严峻现实视而不见。我们正在与一支装备精良、训练有素、意志坚强的敌人作战。然而，我们的祖国在与德国的斗争中一直屹立不倒，在我们自豪的人民名义下，一个又一个目标被夺回！宣传阵线也取得了重大成功，大部分男女不仅愿意投身其中，还为我们勇敢的士兵们拼命生产急需的装备。\n\n不言而喻，我们正义的战争正朝着胜利的结局稳步前进，其中很大一部分要归功于[RUS.GetAdjective]平民，即使是我们以前的怀疑者也无法否认我们的成功。德国的末日近了！前进吧，同志们！"
 RUS_Ubermensch_No_More: "优等人不再"
 RUS_Ubermensch_No_More_desc: "纳粹标志在鲁塞尼亚的草原上燃烧，持守它的败类在向我们辉煌的祖国投降时毫不得怜。据说在巴巴罗萨行动之前，那个老混蛋希特勒——他的尸体仍让我们寝食难安——曾经说过我们的国门只需要被踢一脚，整个腐朽的结构随后就会崩溃。然而随着胜利几乎已成定局，我们证明了这句格言可以反过来用，因为德国战争机器真的已经开始向内部崩溃。\n\n我们永不停歇的进攻已经彻底摧毁了德国人的士气，曾经爱国的德国人正在加入一个快速扩张的本土反战运动。通往柏林的大门正在被打开，而我们跨越门槛只是时间问题！"
 RUS_Rout_the_Bastards: "击溃那些混蛋！"
 RUS_Rout_the_Bastards_desc: "每个小时，我们在莫斯科专员辖区的辉煌胜利都在变得更加不可避免，德国军队已经开始四分五裂。德国的将军们集体向我们投降，纳粹军队继续土崩瓦解。\n\n随着我们的士兵越来越深入专员辖区和匈牙利，德国核心领土将指日可待。这不仅将在世界舞台上摧毁德意志国的荣誉与威望，更将摧毁其人民的意志，最终为多年前他们对我们祖国所做的一切复仇。"
 RUS_The_Reich_in_Ashes: "帝国灰飞烟灭"
 RUS_The_Reich_in_Ashes_desc: "三十年前，俄罗斯陷入了一片毁灭与灾难的时代。三十年前，我们国家的前途被一个建立在我们斯拉夫兄弟的奴役和灭绝基础上的野蛮可憎的国家所剥夺。三十年前，布哈林联盟的蠢人们败在了希特勒和第三帝国的军队面前。\n\n如今，纳粹标志已经破碎，被自己制造的烈焰吞噬。克里姆林宫摆脱了占领，我们的旗帜在其穹顶上自豪且挑衅地飘扬。[RUSGetUniqueNameTitle]将德国巨兽视为一个饱受战火摧残的破碎国家。我们敢于宣布，他们的罪行将不再被容忍。我们横跨欧洲，穿越田野和城市，河流和森林，完成了一项美国人、英国人，甚至苏联人都无法做到的壮举：\n\n我们取得了胜利。"
 RUS_United_Forever_tt: "国家再次统一！"
 RUS_United_Forever: "永远团结一致！"
 RUS_United_Forever_desc: "[RUSGetUniqueNamePlain]。数十年来，经历了俄罗斯历史上前所未有的斗争，我们再次统一了国家。只要我们在[ROOT.GetLeader]的旗帜下前进，就绝对不会再有另一个黑暗时代——但是确保国家的权力还有很多工作要做。\n\n愚蠢的哈萨克人长时间忠于一个已经消亡的联盟，却发现自己被联盟的官僚机构撕成碎片。日本人从我们的手中偷走了外满洲，窃取了我们的东部堡垒符拉迪沃斯托克。而德国仍然从远方嘲笑我们，占领着我们的世世代代的家园。世界必须恢复到其自然的秩序。\n\n§x因为这是[ROOT.GetLeader]的意志。§!"