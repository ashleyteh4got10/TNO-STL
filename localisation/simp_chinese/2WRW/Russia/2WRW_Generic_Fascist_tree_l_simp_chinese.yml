l_simp_chinese:
 RUS_WRW_Generic_Fascist_tree: "法西斯意识形态 - 战争国策"
 RUS_Toppling_The_Menace:0 "消除威胁"
 RUS_Toppling_The_Menace_tt:0 "将从§o大日耳曼国§!收回[RUSGetUniqueNamePlain]的§x被窃领土§!"
 RUS_Toppling_The_Menace_desc:0 "尽管我们的国家已经摆脱了民主主义、共产主义和其他错误思潮和意识形态的颓废和谎言，这些思潮和意识形态会玷污俄罗斯的根基，然而还存在另一个敌人，那就是德意志第三帝国。这个外来的压制者几十年来剥削和压迫着俄罗斯人民，慢慢地抹去了我们的文化，并在冷血中屠杀了无数的男人、女人和儿童。\n\n俄罗斯人民必须异口同声地大声宣布：\n\n不再忍受。我们必须展开一场俄罗斯历史上最艰难、最关键的战争，用俄罗斯之鹰的力量粉碎铁靴，在正义的国家复兴战争中重获荣耀。在我们国家的意志、人民的鲜血和上帝的恩典下，千年帝国将化为灰烬。"
 RUS_Honor_in_Labor:0 "劳动最光荣"
 RUS_Honor_in_Labor_desc:0 "我们的士兵值得赞美，他们在战壕和田野上时刻表现出英勇精神。然而，我们不能忘记俄罗斯工人的力量。他们对祖国事业的忠诚至关重要，忍受着漫长而艰苦的工厂工作。他们辛勤的汗水为我们提供了每一颗子弹和每一把枪，使我们能够击毙每一名德国敌人。\n\n我们不仅必须尊重我们国家劳动者的工作，还必须充分利用他们的劳动力，通过长时间的工作和增加的产量。虽然弱者可能无法承受如此高强度的工作，但那些坚持下来的人将体现出俄罗斯人民真正的精神，随时准备履行他们祖国的一切需要。"
 RUS_Praise_The_Soldiery:0 "歌颂军人"
 RUS_Praise_The_Soldiery_desc:0 "我们对德国的收复战的性质以及现代战争的策略，已经在一个曾经难以想象的规模上对双方造成了毁灭性的打击。战场上散落着德国尸体，是我们勇敢的士兵击倒的，但我们自己的军队也在同样的规模上流血和受伤。\n\n我们不能忘记普通俄罗斯人的努力，我们自豪的士兵们无休止地战斗，以坚韧不拔的勇气来恢复我们国家的荣誉。我们必须尊崇这些年轻人，将他们视为我们国家的救世主，是最高尚、最真实的俄罗斯所能呈现的。在这一点上，我们可以期待我们的军队士气最高，在履行职责方面最勤勉，从而帮助我们在与德国的战斗中获得胜利。"
 RUS_A_Westward_Wall:0 "面西之墙"
 RUS_A_Westward_Wall_desc:0 "随着德国巨兽继续与我们的力量抗衡，他们一次又一次地试图扼杀我们所有人心中的光芒。我们必须阻止这个内在的恶魔爬上我们的防线。如果战场是东欧，那就让它成为如此。我们将通过每一滴从德国威胁者身上滴落的鲜血，将俄罗斯土地上的污秽清除干净。"
 RUS_Extinguishing_The_Prussian_Spirit:0 "消灭普鲁士精神"
 RUS_Extinguishing_The_Prussian_Spirit_desc:0 "自从他们的土地首次统一以来，德国人的文化发源地一直是普鲁士，从他们国家的好战本质到旧时凯撒的血统。在某种意义上，俄罗斯人可以将自己追溯到莫斯科和圣彼得堡这两座城市。然而，虽然柯尼斯堡仍然是德国的文化中心，我们的家园却仍然被占领，只剩下曾经的影子。几十年来，德意志威胁不断玷污着我们的民族遗产，让我们备受羞辱。\n\n我们必须让德国人知道他们对俄罗斯造成的绝望和悲伤。在我们解除国家沉重负担的同时，我们必须将它压在占领者身上。宽恕德国人没有荣誉可言。通过我们的胜利，他们曾经引以为傲的战士文化将在俄罗斯凤凰的烈焰中湮灭。"
 RUS_A_Resurgent_Eagle:0 "雄鹰翱翔"
 RUS_A_Resurgent_Eagle_desc:0 "随着一个超级大国的衰落，另一个将崛起。尽管我们曾经因革命、战争、动荡和贫困而四分五裂，但我们所做的远远超出了世界上任何其他国家对我们的设想。我们已经让德国军队士气低落，覆灭殆尽。我们的飞机让数百万德国母亲痛哭流涕。东方因我们而燃起了摧毁的烈火，但这是值得的。用鲜血换来一天胜过百年压迫。我们已经取代了德国成为超级大国，然而我们必须在这具死去的巨兽之上插上国旗。"
 RUS_A_Russian_Century:0 "俄罗斯世纪"
 RUS_A_Russian_Century_desc:0 "全国欢庆！\n\n经过漫长的战斗和流血牺牲，我们终于实现了目标。我们加速了大日耳曼国的崩溃。我们的祖先站在我们身后，父辈与我们同在，子孙在我们前方。我们肩负着整个俄罗斯的精神，以及其辉煌未来的期许。只需跨越最后一个障碍，我们就能紧握属于我们的伟大胜利。我们以力量、力量和强大的意志牢牢把握住它。当俄罗斯的浪潮席卷而来，我们将目睹每一个所谓的优越种族在自己的鲜血中挣扎，被征服。"
 RUS_Slava_tt: "国家再次统一！"
 RUS_Slava: "俄罗斯凯旋而归！"
 RUS_Slava_desc: "[RUSGetUniqueNamePlain]。数十年来，经历了俄罗斯历史上前所未有的斗争，我们再次统一了国家。只要我们继续在[ROOT.GetLeader]的旗帜下前进，我们就不会再次跌入耻辱之中，然而，世界仍然将我们视为一个毫无贡献的国家。这必须得到纠正。\n\n草原军阀们显得软弱，几乎乞求被征服。在对1905年的扭曲再现中，肮脏的日本和满洲人抢走了我们国家曾经的战果。尽管他们口口声声谈论优等人，但经过十年的冲突后，条顿人似乎显得脆弱。现在是行动的时候，如果我们成功，[ROOT.GetLeader]将永远受人尊敬。\n\n§x现在轮到夺回我们阳光之地的时候了。§!"