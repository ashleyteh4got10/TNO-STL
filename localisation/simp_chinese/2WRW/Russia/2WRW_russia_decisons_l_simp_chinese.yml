l_simp_chinese:
 RUS_russias_monster:0 "骇人俄兽"
 RUS_supporting_armenian_rebels:0 "俄国人资助游击队"
 vyborg_border_conflict.1.t:0 "维堡的命运"
 vyborg_border_conflict.1.desc:0 "维堡在1940年被苏联占领，当时苏联红军击败了芬兰军队。虽然在伟大的卫国战争期间，这座城市最终被芬兰夺回，但我们的许多将军认为随着[195.GetName]重回[RUS.GetName]的怀抱，我们应该重夺维堡，将其作为[195.GetName]与芬兰之间的缓冲地带，同时拿回我们被偷走的合法领土。"
 vyborg_border_conflict.1.a:0 "维堡应该属于[ROOT.GetNameDef]。"
 vyborg_border_conflict.1.b:0 "维普里属于芬兰。"
 vyborg_border_conflict.2.t:0 "[ROOT.GetNameDefCap]夺回了维堡！"
 vyborg_border_conflict.2.desc:0 "不出所料，我们的军队再次战胜了弱小的芬兰人。由于这次伟大的胜利，维堡终于回到了我们光荣的祖国。[195.GetName]的人民现在又可以安心了，因为他们再不用担心来自北方的攻击了。"
 vyborg_border_conflict.2.a:0 "祖国母亲的胜利！"
 vyborg_border_conflict.3.t:0 "芬兰胜利"
 vyborg_border_conflict.3.desc:0 "尽管我们的军队付出了巨大的努力，但芬兰的防御力量仍然牵制并击溃了我们的军队。由于维堡现在已经牢牢地掌握在芬兰人手中，他们的政府不仅要求我们放弃对那里的主权要求，甚至要求我们把重要的[195.GetName]地区非军事化。几十年的战争使俄罗斯大部分人筋疲力尽，我们的高级顾问敦促政府接受和平，然后集中精力重建国家。"
 vyborg_border_conflict.3.a:0 "一个可耻的失败。"
 RUS_decisions.1.t:0 "[ROOT.GetName]的新首都？"
 RUS_decisions.1.desc:0 "既然现在俄罗斯人民终于战胜了德国，也许是时候决定俄罗斯未来的首都了？我们国内的很多人都渴望着还都莫斯科，但也有很多人认为我们应该把首都留在[ROOT.Captial.GetName]。"
 RUS_decisions.1.a:0 "还是留在[ROOT.Capital.GetName]吧。"
 RUS_decisions.1.b:0 "还都莫斯科，第三罗马！"
 RUS_decisions.1.c:0 "还都西方窗口，彼得格勒！"
 RUS_decisions.1.d:0 "还都罗斯之母，基辅！"
 RUS_europeansupport.1.t:0 "[FROM.GetNameDefCap]向[ROOT.GetAdjective]请求援助！"
 RUS_europeansupport.1.desc:0 "当[GER.GetName]和[FROM.GetName]之间的战争在东欧激烈进行时，我们一直是战斗的旁观者。\n\n现在必须做出行动了。\n\n[ROOT.GetAdjective]外交官与我国政府接触，请求提供武器和援助以对抗德国。虽然我国政府中的许多人都同情东欧的斯拉夫人，他们长期忍受着德国人的欺凌，但也有人担心，如果德国再次战胜俄国人，我们将面临什么样的后果。"
 RUS_europeansupport.1.a:0 "[FROM.GetNameDefCap]是欧洲最后的希望！"
 RUS_europeansupport.2.t:0 "[FROM.GetNameDefCap]同意提供援助！"
 RUS_europeansupport.2.desc:0 "经过[FROM.GetAdjective]政府的深思熟虑，他们决定支持我们对抗德国的战争，向我们提供军事装备、飞机和机械化装备以补充我们的军队对抗[GER.GetName]。"
 RUS_europeansupport.2.a:0 "愿上帝保佑[FROM.GetName]！"
 RUS_europeansupport.3.t:0 "[FROM.GetNameDefCap]拒绝提供援助！"
 RUS_europeansupport.3.desc:0 "尽管我们的外交官尽了最大努力，[FROM.GetName]还是拒绝支持我们对抗[GER.GetName]的战争。我国政府对这一结果深感失望，但我们的最高指挥部敦促我们从这一外交挫折中走出来，继续解放东欧。"
 RUS_europeansupport.3.a:0 "欧洲的耻辱。"
 RUS_europeansupport.4.t:0 "来自俄罗斯的一封信"
 RUS_europeansupport.4.desc:0 "最近，我们收到了俄罗斯联邦总统的来信，请求意大利协助对抗德国。俄国人向我国政府陈述了理由，指出德国及其傀儡不断干涉意大利的势力范围。\n\n虽然俄国人确实提出了强有力的理由，但意大利现在面临的问题是，我们是应该冒险支持俄国对德作战，还是袖手旁观，维持地中海的现状。"
 RUS_europeansupport.4.a:0 "我们会向俄罗斯伸出援手。"
 RUS_europeansupport.5.t:0 "意大利同意提供援助"
 RUS_europeansupport.5.desc:0 "经过意大利政府高级官员的反复讨论和商议，意大利帝国热切地决定支持俄罗斯联邦对抗大日耳曼国。\n\n意大利迫切希望看到德国因插手地中海事务而付出代价，因此向我们提供了财政资源和投资，以帮助支持俄罗斯联邦的经济，确保俄罗斯取得对德国国防军的胜利，并为未来的经济和外交机会敞开大门。"
 RUS_europeansupport.5.a:0 "曾经是敌人，现在是新朋友。"
 RUS_europeansupport.1.b:0 "向[FROM.GetAdjective]表达我们的想法和祈祷。"
 RUS_europeansupport.4.b:0 "我们应保持中立。"
 RUS_europeansupport.6.t:0 "意大利拒绝提供援助"
 RUS_europeansupport.6.desc:0 "在意大利政府高级官员之间经过激烈的辩论和讨论后，意大利帝国决定保持中立，认为意大利和地中海国家不希望承受德国的愤怒以及可能对意大利政府外交事务造成的潜在后果。\n\n俄罗斯及其盟友对此回应表示失望。"
 RUS_europeansupport.6.a:0 "德国的束缚依然强大。"