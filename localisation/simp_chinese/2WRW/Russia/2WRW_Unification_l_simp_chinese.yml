l_simp_chinese:
 unification_war.1.t:0 "终归尘土"
 unification_war.1.desc:0 "匆忙建造的避难所的墙壁随着每一声炮火的轰鸣而摇晃。堆积的木材和钢筋在爆炸的单调中掉落下来。\n\n弗雷尔·瓦格纳瘫坐在木制座位上，汗水从额头上滴下，滴到下面的桌子上。兄弟会最后的战士们站在他的身边，手持古董式的STG和收集来的AK-47，身穿由破布和防水布拼凑而成的制服。这是一个复兴的雅利安兄弟会最后的堡垒。一个由“弱者”的鲜血和骨髓锻造而成的兄弟会的安息之地。\n\n曾经是“斯拉夫-雅利安精神救世主”的干瘪身影现在几乎无法穿上裹在他疼痛身体周围的临时军官制服。墙上破裂的钟走得越来越近，联邦的军队也越来越近，他们一步步逼近，用匕首刺穿了占领了俄罗斯合法领土的暴行。滴答、滴答、滴答。\n\n忠诚站在身边的走狗们现在已经散去，他们都去了一个对兄弟会而言司空见惯的地方：地狱。瓦格纳在椅子上摇摆不定，凝视着展开在桌子上的波纹地图。那是雅利安兄弟会的官方地图，囊括了整个西俄罗斯。他想起在彼尔姆的那些日子，那时他听到征服的消息时是多么的快乐。随着对“亚人”的战争逐渐西进，瓦格纳发现自己越来越沉迷于地图之中，他在自己的脑海中重温了他对犹太-布尔什维主义的辉煌胜利。\n\n庇护所里响起了三声敲击声，这是数小时来瓦格纳首次抬起头来。外面可以听到几个声音，每个声音都在讲着粗鲁的“野蛮语言”。瓦格纳紧握着他的瓦尔特P38手枪，最后看了一眼他一生的作品，然后笑了。"
 unification_war.1.a:0 "“人评判外表，主评判人心。” ——撒母耳记 16:7"
 unification_war.2.t:0 "老战争，老骨头"
 unification_war.2.desc:0 "一队步兵擎着投降的旗帜正从阿尔汉格尔斯克向外行军。阿梅特汗·苏丹用手肘碰了一下科津将军，“准时准点。给钱。”科津哼了一声，将几张钞票塞进阿梅特汗的手心。\n\n将军向被烟雾笼罩的城市点了点头。“就不该在这些混蛋身上下注的。他们是可敬的，如果没什么别的优点的话。”\n\n最后一批西俄罗斯革命阵线的士兵们完美且准确地阔步走向联邦的阵地。超过一半都带着伤；失去眼睛，手臂绑着绷带，哪怕一碰就断的拐杖都丝毫不能阻碍他们自豪的行军。而领头的、扛旗的人……莫非是？\n\n“朱可夫元帅，”阿梅特汗说道，“感谢您加入我们。我们被告知会是尼古拉·雷日科夫来。”\n\n朱可夫费力地将旗帜插进泥土中。“尼古拉·伊万诺维奇已经不在了，”他说。“三天前，一架联邦轰炸机害死了他和一半的阿尔汉格尔斯克苏维埃。恐怕你们必须与我进行谈判。”\n\n“好吧。这是条约文本，已由舒克申总统签署并经联邦杜马批准。”\n\n“我的士兵们会安全吗？”\n\n“是的。实际上，给，您可以看一下。”阿梅特汗递给元帅一份条约副本。朱可夫打开文件，开始阅读。“您的士兵将会获得医疗救助，并撤离到马加丹。他们可以自由选择是作为联邦公民留在远东，还是离开以寻求更好的前程。”\n\n“好啊，好。”朱可夫微笑着，像一个经历了地狱却安然活下来的人。“他们值得拥有一切。我从未与如此顽强的混蛋们一起战斗过。”\n\n“嗯，也不是一切，”阿梅特汗说，“阵线的领导将被打散去各地。但只要您退出军队并承诺远离国家政治，我们不会打扰您。您可以享受应得的退休生活。”\n\n朱可夫回望着阿尔汉格尔斯克最后的幸存者。一排排士兵笔直地站立着，目视前方，眼睛里闪着阳光。“你知道，如果阿赫罗梅耶夫在这里，他会要我战斗到最后一刻，”朱可夫说道。“但我们失败了。阵线已死。我不会让我的部下与之同归于尽。”元帅向阿梅特汗伸出手。“先生，我们接受您的条件。”"
 unification_war.2.a:0 "朱可夫元帅，我们接受你的投降。"
 unification_war.3.t:0 "元帅战败"
 unification_war.3.desc:0 "从冬宫克里姆林宫俯视下面的街道，大元帅陷入了沉思。红军，最强大的力量，从北方的针叶林到英国的海洋，竟然输给了资本主义的力量？他做了一切正确的事情。他灌输纪律。他运用卓越的战略和理论。他军事化了国家。他的脑海里一片混乱，几乎听不见乌斯季诺夫元帅的求救声。\n\n“大元帅！我们必须走！我们没有多少时间了，这里有通往码头的隧道。如果我们现在离开，我们可以——”玻璃破碎的声音响起，子弹穿透乌斯季诺夫的喉咙。躺在地上，呛着自己的鲜血，他伸出染血的手向大元帅伸出。图哈切夫斯基跪下，将他垂死的门徒的俄罗斯军帽递给他。“安息吧，朋友。”他说着，一滴泪顺着脸颊流下。\n\n大元帅匆忙走下楼梯，进入冬宫克里姆林宫的地下室。他看到了政治局三位最有影响力的成员，尼古拉·波德戈尔尼、格里戈里·罗曼诺夫和维克托·切尔诺米尔丁。团队解开了通往隧道入口旁边的军械库，每个人都拿起武器，准备抵御那些等待他们的资本主义者。当他们走过昏暗的走廊时，上面回荡着枪声。在隧道的尽头，切尔诺米尔丁打开了舱门，四个人爬出来，来到了毁坏的街道上。一艘潜艇在港口等待着他们，距离仅有百米。当他们开始狂奔时，受到了舒克申部队的猛烈火力压制。子弹呼啸而过，他们一个接一个倒下。首先是切尔诺米尔丁，然后是罗曼诺夫。最后，波德戈尔尼提出留下来拖住敌人，让大元帅能够登上潜艇。两人交换了一瞥，表示相互尊重。\n\n波德戈尔尼蹲在一块岩石后面，在大元帅成功进入潜艇时还击。他打开舱门爬了进去。受到船长的欢迎，图哈切夫斯基命令他们现在离开，不要等待任何其他重要人员。当他听到水雷在港口爆炸时，潜艇震动了，驾驶员头部旁边的口粮掉到了他身上。他们迅速离开港口，图哈切夫斯基意识到，这可能是他最后一次见到他心爱的俄罗斯。"
 unification_war.3.a:0 "当艇长绘制前往越南的航线时，大元帅身边空无一人"
 unification_war.4.t:0 "被障目的远见者"
 unification_war.4.desc:0 "最高领袖日丹诺夫叹了口气。 “奥普莱斯宁将军同志，你的军队让我失望了。”\n\n奥普莱斯宁脸色煞白。 “至尊领袖，我们已经尽力了，可是你给我们的装备——”\n\n日丹诺夫打断了他。 “是迄今为止远视主义科学成就的最佳范例，不像你古怪的战术。你被解除了指挥权。切洛梅同志，我们必须启动超视项目。”日丹诺夫大步走出地堡的作战室，切洛梅紧随其后。卡尔达舍夫，沉默地目睹了奥普莱斯宁的屈辱，在追上他的主人之前向他投去同情的一瞥。\n\n卡尔达舍夫喘着粗气追上了这对行进的人。 “同志们，我不知道这个超视项目，”他说。\n\n“那是故意的，”切洛梅说。 “超视项目是由特别处理委员会而非人民科学委员会设计的。它是一种故障保险，旨在在联邦遭到破坏时保护我们的革命远视文化。”\n\n他们绕过一个拐角，冲下霓虹灯照耀的隧道。远处的爆炸震动了他们的骨头。 “集体意识主动权方案失败了，”日丹诺夫说，“但就像所有伟大的实验一样，它为真正的发现铺平了道路。人类意识本质上是电的，不是吗？我们已经找到了一种方法，可以将人类脑电波的能量转移到任何电子系统——例如，一台电脑。”\n\n这群人找到了前往日丹诺夫私人实验室的路。房间中央放着一把带衬垫的椅子。在它的上方，一系列电极从天花板上垂下来。 “从那里，意识可以渗透到任何电子系统。实际上，实现永生。”日丹诺夫扑到椅子上；他和切洛梅一起将电极放在他的头骨上。\n\n“这个测试过了吗？”卡尔达舍夫说。\n\n“没有，但科学是可靠的，”日丹诺夫说。 “切洛梅，开启系统！”\n\n切洛梅拨动了断路器开关。一声爆炸性的巨响刺破了卡尔达舍夫的耳膜，一道耀眼的光芒让他头晕眼花，双目失明。然而，当他的视线开始恢复时，他的鼻孔里充满了烧焦的肉味。"
 unification_war.4.a:0 "他们飞得太靠近太阳了。"
 unification_war.5.t:0 "被束缚的探索者"
 unification_war.5.desc:0 "斯韦特兰娜·布哈林娜咳出带血的痰，浓烟像柱子一样袭击她的肺。有人尖叫道：“天啊，这该死的建筑快要倒塌了！”\n\n斯韦特兰娜强迫自己站起来，紧紧抓住疼痛的一侧。那刺痛感是一根断了的肋骨，甚至可能不止一根。但如果她窒息的话，这一切都将无关紧要。总理用撕碎的开襟毛衣遮住嘴和鼻子。她几乎看不见了；刺鼻的烟雾像一只狂蜂、像无数根针一次又一次刺入角膜，疼痛不已。布哈林娜强迫自己摇摇晃晃地往前走，感觉着脚下杂乱的地面。她的脚踝扭伤了，每迈出一步都会传来撕心裂肺的疼痛。\n\n建筑物发出呻吟声。按这个速度，她无法逃出去。斯韦特兰娜记不清建筑物的布局，但入口离她只有几英尺远。每迈出一步都是极度痛苦的，地面上布满了燃烧的碎片，她几乎无法移动。时间不多了。她强迫自己加快步伐。\n\n她的裙子被倒下的梁木缠住，她摔倒了。斯韦特兰娜的头重重地撞在木质地板上，就像一颗陨石撞击地球一样；她的视线变黑，内耳感觉仿佛在头骨里呕吐。她勉强从喉咙里发出一个微弱的喘息声。等等，发生了什么？为什么这么热？\n\n“布哈林娜同志！”有人喊道。“同志，你在哪里？”\n\n斯韦特兰娜再也撑不住头了。血从嘴边的伤口流入下巴。她试图用指尖向前拉自己，但她力不从心。布哈林的女儿昏迷了过去，准备面临死亡。"
 unification_war.5.a:0 "妈的，她受伤了。把她弄上卡车。"
 unification_war.6.t:0 "红衣主教的斗篷"
 unification_war.6.desc:0 "瑟克特夫卡尔响起凄惨的枪声。这座被围困的城市的每个街区似乎都出现了一支乌合之众的民兵组织。狂热的政委们挨家挨户游行，鞭打着无产阶级疯狂地保卫马克思主义的最后堡垒。甚至学童也征用了他们父亲的步枪。\n\n在市中心，约瑟夫·斯捷潘奇科夫下士将拳头砸在了裂开的讲台上。 “混蛋一定知道我们要来了，”他说。 “我们现在应该已经逮捕了该市一半的官员。”\n\n二等兵德拉古诺夫布置了一张瑟克特夫卡尔地图；重要的地点用一个炽热的红色标记圈出。 “剩下的苏联领导层可能有两个位置，”他说。 “科米共产党总部，还有这个印刷厂。”\n\n“印刷厂？”\n\n“是的，先生，”德拉古诺夫说。 “我们的情报表明这座建筑以前与受难者有关。它已经用武器加固了十倍，据我们所知，还有一个地下掩体。可能是在入侵时逃离城市的一种方式。”\n\n“很好。我们分头行动吧。Alpha 小队，带上 Gamma 和 Tau，在 KPK 总部汇合。Beta，Kappa，你们跟我来。我们要开始行动了，”斯捷潘奇科夫说。\n\n突击队冲过城市，以致命的优雅躲避子弹和燃烧的碎片。不到一个小时，斯捷潘奇科夫就占领了印刷厂及其地下掩体，并逮捕了里面幸存的共产党员。阿尔法小队反过来又砸毁了科米共产党总部的大门，在那里他们发现了颤抖的鲍里斯·波诺马廖夫正在焚烧重要文件。苏斯洛夫不见踪影。\n\n城东区，一处已经被联邦军烧杀抢掠过的街区，一个年长的男人把脸藏在一顶朴素的农夫帽下。他感谢他最喜欢的午餐地点的老板——一家简单的茶叶公司，曾因与斯韦特兰娜·布哈林娜的关系而闻名——并慷慨地给了小费，然后走进了夜色中。他不起眼的衣服只有补丁和缝洞。他的椭圆形眼镜反映了大屠杀、火灾和死亡。红衣主教允许自己叹了口气，开始了他前往奥伦堡的旅程。\n\n从那里，他可以去任何他想去的地方。"
 unification_war.6.a:0 "他甚至可能藏在我们中间。"
 unification_war.7.t:0 "二元理论"
 unification_war.7.desc:0 "波波夫警官扑到街上，捂住头。就在一米远的地方，他最喜欢的餐厅发生爆炸，碎片和人类遗骸散落在大街上。他躺在那里，颤抖着，等待着心跳。 “耶稣基督，联邦要杀了我们所有人，”他说。\n\n波波夫在凌晨 4:00 醒来，飞机在他的公寓上空呼啸而过。这并不罕见。共和国并不缺少空军，尽管他们往往在 14:00 左右练习演习。但随后相邻的公寓楼被联邦炸弹炸成了碎片。波波夫已经尽其所能，在他还穿着睡衣的情况下，为从由此引发的火灾中拯救他的邻居而战。但他所做的一切都无法挽回在爆炸中丧生的二十四人。\n\n联邦空军赢得了制空权之战。他们在开始攻击后的几分钟内就使瑟克特夫卡尔机场变得毫无用处。现在他们猛扑过来，轰炸这座城市，似乎不考虑战略或目的。波波夫在恢复秩序时看到的恐怖，他生来就目睹的恐怖，让西俄革命阵线的入侵看起来像是在演戏。整个城市都着火了。他们只是想谋杀全体人民吗？\n\n然后它击中了他。 “天哪，”他呻吟道，“军火库。”\n\n联邦肯定已经发现了瑟克特夫卡尔兵工厂。他们一定是想在地面入侵开始之前摧毁入口，或者以其他方式摧毁设施。但他们轰炸了错误的半个城市！\n\n波波夫警官看向天空。新一批联邦轰炸机已经接近。远处，剩下的共和国卫队准备了一套破烂不堪的防空炮。一半已经被炸成碎片；他们的兄弟很快就会加入他们的行列。\n\n“去他妈的，”波波夫咕哝道。 “我不会为失败的事业而死。”他收好军用武器，开始奔跑。他不会逃脱下一次轰炸，但如果运气好的话，他会活着离开这座城市。"
 unification_war.7.a:0 "一场荒谬而毫无意义的战争结束了。"
 unification_war.8.t:0 "笼中之鸟"
 unification_war.8.desc:0 "斯韦特兰娜·斯大林娜环顾她的牢房。潮湿的空气散发着霉味，但房间本身很舒适，甚至很宽敞。她的审判来得很快。斯韦特兰娜曾担任自己的辩护律师。与她父亲的支持者所遭受的公开审判不同，陪审团至少听取了她的论点，但这并没有什么不同。她的刑期为十年监禁，因表现良好而减刑三年。尽管如此，她还是笑了起来。这场战争最终变得毫无意义。死了那么多人，为了什么？\n\n门外响起了轻轻的敲门声。 “进来吧，”她说。\n\n她的来访者是一个穿着干练的黑色西装打着灰色领带的男人。他没有佩戴任何装饰品，只戴了一块银表。他的头发没洗。他的眼睛上挂着黑眼圈，是许多个不眠之夜留下的伤痕。他走进房间，手里拿着一叠文件，直视着她的眼睛。\n\n“斯韦特兰娜·斯大林娜，”舒克申总统说，“你给我带来了这么多麻烦。”\n\n“会长先生，我必须道歉，但正如你所见，我已经在忏悔了。”\n\n舒克申嘴角升起一丝几乎难以察觉的冷笑。 “你和我有太多理由互相憎恨，”他说。舒克申把那叠文件递给她。 “我认为我们可以同意永远不友好相处。”\n\n斯大林娜扬起一边眉毛。她瞥了一眼文件，打印出来的纸张还很暖和。包裹上贴着“联邦反腐败局”的标签。 “你想给我一份工作？”斯大林娜说。 “为什么，胆——”\n\n舒克申打断了她。 “在文件上签名。无论如何，你都将被合法监禁十年。但在牢房里腐烂是不公平的。这样，你就可以有所作为，开始重建战争造成的破坏。”他笑了。 “而且我认为我们可以同意，它会不那么无聊。”\n\n斯韦特兰娜直视着舒克申的眼睛。 “你是个混蛋。但我会签的。我可以从星期一开始吗，还是我也需要求你呢？”"
 unification_war.8.a:0 "给她松绑，胆小的人会发抖。"
 unification_war.9.t:0 "道路终点"
 unification_war.9.desc:0 "瑟克特夫卡尔的战斗从白天到晚上，从黑夜到白天，就像一条大河的咆哮一样不断地进行着。筋疲力尽的秩序社会主义者除了他们的热情和几支用过的步枪外，一无所有。剩下的军官团与联邦武装部队一个街区一个街区地战斗，为了阻止装甲巨兽的纵队，他们牺牲了自己的生命。迫击炮和火箭弹在城市周围坠毁，缩短了生命并将城市粉碎成灰尘。慢慢地，非常缓慢地，联邦的军队接近了秩序社会主义党总部。\n\n当代马克思，伊万·谢罗夫是苏维埃民族共和国的指路明灯，他坐在昏暗的掩体中，俯瞰着乱七八糟的乱七八糟的地图。他们跟踪联邦进入城市的进展，由信使每小时更新一次。在外面，兵力不足的步兵团拼命地试图守住阵线，在他们的人民和他剩下的保镖周围形成了一个钢圈。\n\n谢罗夫的一名下级仆人安东尼亚打破了地堡中的寂静。 “长，长官，”她说，“我们该走了。就在这下面有个逃生通道。如果我们都拿下它，我们就可以绕过包围圈。我们可以把你从阿尔汉格尔斯克偷渡出去，找到安全的地方。”\n\n“闭嘴。俄罗斯是我的家。这是我的灵魂。我将战胜这些自由主义的堕落者，否则我将死在这座城市”。\n\n“但是先生——”\n\n“伊万诺夫？”谢罗夫指着离他最近的保镖说道。 “把安东尼娅带到外面，射杀她。”\n\n当伊万诺夫抓住头发将她拖出地堡时，她尖叫起来。一声枪响，结束了她可怜的哭声，就像一个孩子在受伤的小鸟头上跺脚。\n\n但是炮火的轰鸣声越来越近了。它一点点向前，爬过防守者的防线，来到谢罗夫地堡的入口处。男人被炸成碎片，男孩们转身逃离不可避免的局面。击败苏斯洛夫的伊万·亚历山德罗维奇·谢罗夫知道他将如何被人们记住。\n\n他把地图揉成一团扔在地上，用他乌黑的脚跟压碎了它。 “同志们，你们都有武器吗？”\n\n地堡里的十五个人中，大概有一半人有手枪。其他人则抓着球杆，或者是匆忙从坐骑上扯下来的椅子腿。但他们谁也无法想象没有谢罗夫的未来。"
 unification_war.9.a:0 "好吧，送他们下地狱。"
 unification_war.10.t:0 "小国家，小世界"
 unification_war.10.desc:0 "被盗汽车的引擎发出像垂死的狗一样的呜呜声。沙法列维奇用手猛击方向盘。 “动啊，破车！”\n\n他瘫倒在破烂的驾驶座上。没有机会。他现在永远也去不了芬兰了，尤其是步行。沙法列维奇被困在去乌赫塔的路上，他的保镖都死了，没有武器，甚至没有多少钱。外面很冷。伊戈尔呼出的气从他干裂的嘴唇喷出，变成了滚滚的蒸汽，他的脚趾几乎麻木了。大炮的轰鸣声近到足以震动他的肋骨。上帝禁止其中一枚炮弹落在卡车上。\n\n沙法列维奇不得不回去。他被包围了——但他可以想象通过签署和平条约来拯救自己，或者命令他剩下的士兵下台。 舒克申那个他妈的小国伪君子会毁了俄罗斯，但至少伊戈尔可以摆脱危险。是的，就是这样；他会向最近的营的指挥官投降，然后他们会把他带到他们无用的联邦总统那里。\n\n伊戈尔艰难地穿过子弹，绕过围绕着他的激烈战斗，每当枪声响起时，他都会畏缩。他克服了用麻木的脚走路的痛苦。终于，他找到了两个看起来冷静到不敢开枪的士兵。\n\n他一瘸一拐地走到他们身边，双手举在空中。他挺直了背，竭尽全力威慑他们。 “你们两个！我投降，”他说。 “现在带我去见你的指挥官。俄罗斯自由共和国总统将呼吁和平。”\n\n两名士兵对视了一眼，沉默了许久。一个人用手电筒照着伊戈尔的脸。他咆哮着。 “该死，是他。”\n\n“混蛋，”另一个嘶嘶地说。 “所以这就是瓦西里为之而死的人。”士兵们面面相觑。两人的脸色都冷了下来，一个个点了点头。\n\n一发炮弹在数十米开外炸开，照亮了整片空地。沙法列维奇看到眼前士兵们制服上的黑底老鹰图案。他的心凉了。俄罗斯自由共和国的士兵们举起武器，移开视线，瞄准了他的心脏。"
 unification_war.10.a:0 "小个子男人的小坟墓"
 unification_war.11.t:0 "最后的喘息"
 unification_war.11.desc:0 "约瑟夫·斯捷潘奇科夫下士呻吟道。 “哦，上帝，拜托。除了这个。”\n\n通往塔博里茨基摄政王宫的道路两旁都是尸体。男人和女人，是的，但主要是孩子。他们被活活剥皮，或被绞死，或被刺刀刺穿。许多人被勒死。成堆的尸体被推到墙上，缠成一团，惨不忍睹，毫无尊严。四肢在腐烂的风中颤抖。\n\n斯捷潘奇科夫的突击队沿街前进。腐肉的气味从各个角度袭来。乌鸦从椽子上飞来啄食最近的受害者。约瑟夫开始自言自语。 “别看。别看。别看——”\n\n“先生，您有吩咐吗？”二等兵德拉古诺夫说。\n\n斯捷潘奇科夫吞了一口呕吐物。 “保持敏锐。我认为……我认为他们在这方面已经结束了。”\n\n士兵们走下街道，准备好步枪，以超然的专业精神扫视着血迹斑斑的角落。除了呼啸的风声，没有任何声音。空气中有铜和胆汁的味道。每个军人都参加了数十年的战争；他们看到了来自地狱的异象，任何人都不应该被迫看到的东西。这是他们经历过的最糟糕的地方。\n\n似乎过了几天，中队前往塔博里茨基宫殿的大理石和金色大门。在外面，三个女人被钉在十字架上；他们的脖子上挂着标志，将他们标记为犹太人、淫妇或女巫。每个人都被刀子肢解了。突击队在宫殿内缓慢前进，拔出枪，准备自卫。数十名斯图尔莫维基人死在塔博里茨基住所的门口。德拉古诺夫用脚踢翻了一个。 “长官，是拉里奥诺夫。他的后脑勺中弹了。”\n\n摄政王的府邸内，远处传来一阵听不清的叫喊声。突击队跑进去，越过无数死者，进入塔博里茨基的王座室。受祝福的摄政王站在那里，手里还抱着一个年幼的孩子。他四岁，也许五岁，黑头发，苍白的肤色。他的头左右摇摆；塔博里茨基的手扭断了他的脖子。\n\n摄政王大喊，狂躁的、地狱般的声音让斯捷潘奇科夫的灵魂因恐惧而冻结。喜悦的泪水从老人的脸上流下来。 “我找到他了！我找到阿列克谢了！”\n\n一声枪响很快结束了他的摄政时期。"
 unification_war.11.a:0 "如果那些日子没有缩短，没有人可以得救。"
 unification_war.12.t:0 "无名之马"
 unification_war.12.desc:0 "当最后一滴雨水顺着男人的外套流下来时，他意识到自己终于成功了。一望无际的草原和沙海在他面前蔓延开来，就像一片永远与世隔绝的海洋。远远地，远离追击而来的联邦士兵。\n\n虽然这个概念在他身边可能已经崩溃，但列夫·古米廖夫不会在身边看到它。这位前任领导人将他能装上的所有东西都收集到他可信赖的马上，日夜逃离欧亚大陆的剩余部分，直到他消失在没有军队跟随他的地方：哈萨克斯坦。\n\n从瑟克特夫卡尔的刀剑大厅到统一的西俄罗斯领导人，古米廖夫看到自己的想法未能实现而感到痛苦。昔日的骑手再也不会夺回成吉思汗的荣耀，也不会粉碎大西洋主义的威胁或泛亚的伪装者。大欧亚再也不会成为所有亚洲人民摆脱帝国主义或文化殖民主义暴政的乐土。\n\n在短短几周的时间里，欧亚理想将以腐朽的“联邦”之名化为乌有。只是现在古米廖夫不会给他们一张面部照片或头部中弹的满足感。\n\n他转过头，面对着祖国上空升起的太阳，这将是他最后一次，然后将自己迅速推入了巨大的空虚之中。这个概念会和他一起死去，从那时起，欧亚大陆将不复存在。永远。"
 unification_war.12.a:0 "终"
 unification_war.13.t:0 "沙皇之死"
 unification_war.13.desc:0 "沙皇弗拉基米尔·基里洛维奇紧紧抱住熟睡的女儿。他的头在砰砰直跳。当他们逃离维亚特卡时，一支联邦巡逻队抓住了他们，并逮捕了他们。有那么一会儿，弗拉基米尔盯着他们步枪闪闪发光的枪管，非常确定暴徒会当场射杀他的家人。但他们幸免于难。他非常感激他的女儿平安无事，即使他的梦想破灭了。\n\n尽管如此，沙皇仍觉得自己的脑袋被巨人猛击了一拳。上帝，他需要喝一杯。\n\n门外传来轻微的敲门声。罗曼诺夫一家被关在一个体面的房间里，既不破旧也不华丽。索尔仁尼琴会认为这是不尊重的表现。如果有的话，弗拉基米尔认为这证明了俘虏他的人是人道的。 “请进，”他说。女儿在他怀里动了动，却没有醒。\n\n一个穿着整洁的煤黑色西装的男人打开了门。他没有佩戴任何装饰品，只戴了一块银表，脸上挂着刻意中性的表情。 “罗曼诺夫先生。我叫瓦西里·马卡罗维奇·舒克申总统。”\n\n弗拉基米尔站起来伸出手。 “你好，舒克申先生。我听说了你在联邦领导的改革。我真的很难过我们无法达成和平解决——”\n\n“饶了我吧，弗拉基米尔·基里洛维奇。”有那么一瞬间，总统的脸上闪过某种东西——愤怒？还是悲伤？ “罗曼诺夫王朝给俄罗斯人民带来的只是痛苦。我们本着诚意接近了你们。但你和你的顾问选择了死守一个早已死去的帝国，现在我们成千上万的人都死了。”\n\n舒克申叹了口气。 “你将面临审判。为了与德国人合作，为了开始这场愚蠢的战争。但这种噩梦永远不会再发生。你将在本周发表演讲。你和你的女儿将永久且不可撤销地放弃王位。没有罗曼诺夫会再次统治俄罗斯。”他瞥了一眼弗拉基米尔的女儿。 “我们的法院将赞赏赔偿行为。”\n\n弗拉基米尔点点头，低下了头。他看着女儿的胸膛随着他的心跳同步起伏。 “我找不到任何其他方法来保护他们的安全。”"
 unification_war.13.a:0 "但是你谴责了多少人来拯救你的家人？"
 unification_war.14.t:0 "狱卒之王的末日"
 unification_war.14.desc:0 "一颗子弹从米哈伊尔·奥克坦的私人飞机的顶部弹回。他发誓，然后砰的一声关上了身后的门。 “起飞时间到了，”他宣布。\n\n弗拉基米尔·马特韦约维奇，曾经是一位骄傲的王牌飞行员，现在沦为奥克坦的私人空中司机，犹豫了。 “长官，萨马林部长不在机上。”\n\n“你以为我在乎吗？快起飞！”\n\n飞行员点点头，把油门往前推。飞机开始上升时，奥克坦稳稳地坐在副驾驶的椅子上。混混的胃翻了个跟头，眼睛在脑袋里飞回来。如果他们只能离开跑道十米，他就自由了。\n\n飞机上的收音机噼啪作响。 “Jet Alpha-Pedro Four-Niner，这是俄罗斯联邦飞机 Reach-Foxtrot Three Niner。你已被确认窝藏了一名已知的罪犯和通敌者。关闭你的引擎并准备降落。”\n\n奥克坦摇了摇头。 “没有机会，”他说。 “继续前进。”\n\n弗拉基米尔咬着嘴唇，照他说的去做。当他努力超越 Reach-Foxtrot 时，喷气式飞机的引擎尖叫到歌剧般的音调。从喷气式飞机的过时仪器泄露的少量信息来看，他们没有取得任何进展。收音机再次响起。 “Jet Alpha-Pedro Four Niner，这是你最后的警告。如果你继续试图躲避我们，我们将开火。”\n\n王牌做了个鬼脸，开始减少油门。 “你到底在做什么？”奥克坦说。\n\n“我们跑不过他们，”弗拉基米尔说。“是的，”奥克坦说。 “这架喷气式飞机是金钱所能买到的最好的飞机。它速度最快，机动性最强。比赛结束前不要放弃。”\n\n“也许是乌拉尔山脉西部最好的地方，”弗拉基米尔说。 “听着，我有孩子。如果我们降落在正确的地方，你仍然可以逃脱。”\n\n奥克坦拔出手枪，将它顶在弗拉基米尔的头上。 “你这个该死的犹太混蛋，如果你试图着陆，我就崩了你的脑袋。”\n\n“嘿嘿嘿，轻点！”弗拉基米尔哭了。 “我是唯一知道如何驾驶这东西的人！”\n\n“那就忙着飞吧，”奥克坦说。弗拉基米尔咽了咽口水，关掉了喷气式飞机的收音机。他又飞了二十米，半心半意地做了几次机动，而 Reach-Foxtrot 的导弹锁定了他们。"
 unification_war.14.a:0 "他想到他的钱；又想到了他的女儿。"
 unification_war.15.t:0 "策略"
 unification_war.15.desc:0 "舒克申意识到，朴素的会议室散发着霉味。这是前线一个小村庄的中心，舒克申越来越难以消除这里不是结束战争的地方的想法。他瞥了一眼松木桌。一只猫头鹰独自坐在另一端，正在擦他的眼镜。也许他的客人自然而然地选择了最适合他冰冷灵魂的环境。\n\n俄罗斯人民解放委员会的首领米列季·济科夫用手帕轻轻咳嗽了一声。这就是叛徒、篡位者，他沉浸在贪婪和骄傲之中，试图将俄罗斯一分为二。 舒克申的专家警告他，这条蛇会试图用他灵巧的舌头和无穷无尽的能量来威慑他。但 济科夫只是面无表情地盯着他面前沾满墨水的纸张。突然，他抬头看着舒克申。“昨晚，我让我的人告诉我你们这边发生的事情。”\n\n“他们怎么说？”\n\n济科夫在他再次开口前抿了抿嘴唇。 “我已经了解了所有的细节。他们给我做了一份备忘录，以便更好地组织我的思路。”济科夫的脸上掠过一丝假笑。 “说你的政府是由戴着肩章的傻瓜管理的，直到你把权力还给人民。”\n\n舒克申缓缓地点点头，只是勉强压下了怒容。\n\n济科夫会心一笑，继续说道。 “干得好。我听说土地之子吃得像国王一样，用最新的装备耕种他们的田地。”济科夫的目光又回到了文件上。他从破旧的外套里掏出一支笔，将手臂伸过桌子，越过他的笔记，用颤抖的手在俄罗斯共和国投降书的底部划下了自己的名字。\n\n“我希望你意识到发生了什么，”济科夫宣称。 “投降一次的人不会再投降，至少当他的尊严是宝贵的东西时。”\n\n舒克申歪着头仔细端详着他，一脸茫然。 “你是什么意思？”\n\n济科夫收回目光，若有所思地笑了笑。 “这意味着，”他说，“我赢了。”"
 unification_war.15.a:0 "他们的荣誉得存。"
 unification_war.16.t:0 "老无所依"
 unification_war.16.desc:0 "米拉·彼得罗夫娜走进谢尔盖·布尼亚琴科的办公室时，在她那张冷酷的面孔后面颤抖着。独裁者的巢穴很朴素，只有巨大的三色旗和散落的家庭照片作为装饰。当坠落的炸弹震动墙壁时，手工切割的框架发出咯咯的声音。她踮着脚跨过门槛。\n\n布尼亚琴科对着电话听筒啐了一口。 “梅安德罗夫，你这个该死的叛徒。我不管联邦答应给你什么保护。我发誓我会追上你，把你开膛破肚。”谢尔盖停下来，倾听着。 “我们拭目以待，我的朋友。我们拭目以待。”他挂了电话。\n\n“长官，您的车辆准备好了，”米拉说。\n\n“你怎么还在这里？我几个小时前就命令厨房工作人员撤离了。”\n\n“我提出要帮助鲍里斯准备撤离，长官。”\n\n“够了。先生，别跟我说废话。”布尼亚琴科摇摇晃晃地站起身来。 “共和国没了。宫殿将在一个小时内被摧毁，除非上帝把联邦空军从天空中夺走。从现在开始，叫我谢尔盖。”\n\n米拉点点头。 “你准备好了吗，谢尔盖？” “不完全是。”他蹒跚地走到照片前，眯起眼睛。 “很久以前我就失去了我的儿子。我只剩下几张他的照片。该死的我还记得我把它放在哪里了。”\n\n炸弹在几英尺外爆炸时，宫殿震动了。米拉咬牙切齿。 “家庭对你来说一定很重要。”布尼亚琴科点点头，仍然疯狂地透过墙往外看。 “我很抱歉你失去了你的儿子。我愿意做任何事来让我的家人回来。”她把手伸进大衣里。 “谢尔盖，你还记得南乌拉尔战役吗？”\n\n“是的，我知道。乌拉尔卫队让我们失去了很多好人。”\n\n“你还记得奥伦堡的大火吗？”\n\n“我记得下过命令。无政府主义者在整个城市躲藏起来，如果使用常规战争，我们会损失数千人。这该死的照片在哪里？”\n\n“我懂了。” 米拉以业余的、不熟练的动作拔出了她生锈的左轮手枪。她朝布尼亚琴科的背部开了三枪，尽管她的手还在颤抖，\n但仍刺穿了他的肺部。当他滑到地板上时，他的血沾满了墙壁。米拉丢下左轮手枪就跑，泪水模糊了她的视线。 布尼亚琴科喘息着，淹没在自己的鲜血中，他永远不知道自己因何种罪行而受到惩罚。"
 unification_war.16.a:0 "你没有被原谅。"
 unification_war.17.t:0 "不要受苦于异端"
 unification_war.17.desc:0 "风吹过珀姆海姆的废墟。曾经的要塞，供奉干渴神灵的圣地，现在变成了一堆垃圾。一种生活方式，沦为鲜血的飞溅和灰烬在月光下的夜晚飘扬。\n\n废墟对面，联邦步兵和海珀波利亚战士互相残杀。狂热的Hyperboreans拒绝将哪怕一英寸的圣地割让给挥霍无度的入侵者。像他们的祖先一样，他们以一种威严而自杀的力量与不可避免的事情作斗争。很快，他们每个人都会和韦莱斯手拉手一起走到青翠的艾里。\n\n“清除！”六名俄罗斯士兵进入了前市长的大楼。经过多年痛苦的变异，这座建筑已经变成了大祭司的神殿。墙上潦草地刻着粗制滥造的符文和对过去胜利的飙升描绘。三个少年挥舞着樵夫的斧头和刀子冲了上来；他们的生命以三枪而告终。\n\n小队以冰冷的效率进入大楼，检查角落，不断观察诱杀装置或伏击。他们穿过神殿，玷污了神圣的走廊，并在几分钟内到达了 维利米尔王座室的门槛。在里面，异教徒国王正在用他沾满血的锤子将一名信使打死，把孩子的脑浆扔到房间各处，就像画家在画布上泼洒颜色一样。小队用铁肚吸收了这万恶的一幕，数到三，冲了上去。\n\n小队将维利米尔围成半圆形。每一枪都指向野蛮人的心脏。 “数到三之前，你必须投降，”斯米尔诺夫中士说。\n\n维利米尔握紧了拳头，仇恨的目光映在他的脸上。 “你们这些害虫都不知道自己做了什么。你们屠杀了雅利安人！你们的灵魂将受到永恒的惩罚！”\n\n他张开拳头，露出一颗雷管。\n\n斯米尔诺夫中士扣下了步枪的扳机。 维利米尔按下了雷管的开关。三颗子弹飞出，划过空气，刺入维利米尔的胸口。大祭司的胸骨碎裂；子弹穿过他的身体，进入他的心脏。 维利米尔的拇指在抓住致命伤口时从开关上滑落。"
 unification_war.17.a:0 "斯瓦罗格的火焰将他们全部烧毁。"
 unification_war.18.t:0 "红十月的结局"
 unification_war.18.desc:0 "“我建议不要站在栅栏附近，”巴加诺夫警官说。他长长地、毫无感情地瞪着走廊尽头的牢房。 “白痴最后一次发脾气差点被枪杀。不得不给他穿上紧身衣。这么大的人这么强壮真是奇怪。”\n\n舒克申点点头。 “我会从这里拿走，谢谢。”当他走近那间散发着霉味的牢房时，一名身穿破烂白西装的老者双眼充血地盯着他。如果爷爷在家里读睡前故事，他那张苍白、布满瘀伤的脸会更自在。这真的是钢铁怪兽的样子吗？\n\n“资本家，别以为你能吓倒我，”拉扎尔·卡冈诺维奇说。 “我消灭了黑色联盟。我亲眼目睹了雅利安兄弟会在彼尔姆的所作所为。我没见过比这更糟十倍的事。”他盯着舒克申的眼睛。 “告诉我你对我弟弟做了什么。”\n\n“等你的试炼结束，你就会见到他。为了他的安全，他不需要为你牺牲自己。”\n\n“审判？在资产阶级代理人的法庭上？别逗我笑。”卡冈诺维奇抓住牢房的栏杆，开始挤压。 “给我拿根绳子来。总有一天你会救我们所有人的。”\n\n舒克申摇了摇头。 “不。俄罗斯和世界需要知道你的政权造成的数千人死亡。人民需要知道正义得到了伸张。”\n\n“一个人死亡是一场悲剧。一千人死亡是一个统计数字。”卡冈诺维奇笑了。 “告诉我。当你的政府射杀维塔利·科斯汀时，你为他哀悼吗？所有那些饥饿的矿工，你说你会保护的人......你在他们的骨头上建造了你的城市。好男人和女人，为了权力而被谋杀。有你我之间没有区别。”\n\n“这真是浪费时间。法庭上见，卡冈诺维奇。”\n\n舒克申转身，开始离开牢房。卡冈诺维奇边走边大喊。 “别背对着我，哈巴狗！工人们会看到你在制造什么样的噩梦。当他们在街上挨饿时，他们会记住我的。他们会记住马克思的！还有你”会完蛋的。”\n\n巴加诺夫警官开始关门。 “无产阶级革命是必然的！”卡冈诺维奇尖叫起来。 “你只是在拖延不可避免的事情！”"
 unification_war.18.a:0 "门咔哒一声关上了。"
 unification_war.19.t:0 "埋葬在历史中"
 unification_war.19.desc:0 "秋明城被三面包围。联邦机械化纵队突袭了苏联军队被削弱的旅，并围困了数周。这座城市的大部分地区都被占领了，在敌人后方数英里之外，没有拯救的希望。在城市内部，残破的驻军的最后遗迹守卫着通往下方地堡的最后入口，这些地堡没有被瓦砾覆盖，也没有从内部封闭。\n\n尼基塔·赫鲁晓夫被轰鸣的炮声惊醒。昏昏沉沉的，他把被子拉回头上。地堡震动了。顾不得今天早起，他穿上拖鞋下了床。他去了地堡的厨房，他的妻子正在那里拿着笔记本等他。赫鲁晓夫的规则，或者他和他的下属是这样称呼它的，就是把前一天晚上发生的所有事情都记在日记里，第二天早上再读给他们听。\n\n“在与其余将军商量后，你被告知以联盟目前的兵力无法保卫秋明，”尼娜开始说道。 “他们建议你通过地下掩体或伪装成难民离开这座城市。”\n\n“如果他们认为我会以这种有失尊严的方式冒着死亡的危险，他们就是胡说八道，”尼基塔回答，将玉米面倒入碗中并开始搅拌。旧炉子冒出一阵蒸汽。\n\n“你非常沮丧，开始向将军们扔面包，”她继续说道。\n\n“什么？我不记得那样做了！”尼基塔回答。\n\n“这是你的笔迹，不是我的，”尼娜回答道。\n\n吃早饭的时候，炮声越来越大。每过一分钟，更多的炮火就会集中在地堡上。灰尘从墙壁的裂缝中喷出。当他们的父母紧紧抓住他们时，孩子们从走廊的尽头哭了起来。锅碗瓢盆开始从架子上掉下来。 尼基塔向尼娜伸出手，握住她的手，将她从椅子上拉了起来。当天花板开始塌陷时，两人拥抱在一起。当两人都被上方混凝土的重量压垮时，阳光照进了地堡。"
 unification_war.19.a:0 "钟声敲响，因为秋明已获得自由"
 unification_war.20.t:0 "最后的联邦坚守着"
 unification_war.20.desc:0 "叶利钦和巴托夫元帅站在一个黑暗的房间里，周围是将军们和破碎的灯光。军方想要最后一搏，但总统知道一切希望都已丧失。在这个寂静的房间里，他提起疲惫、失意和可怜的声音。“我们到底为什么开战？”\n\n巴托夫摇了摇头，他已经无话可说。在他身边，雕刻在石头上的面孔努力忍住泪水或愤怒的尖叫声。\n\n“难道你们一个人都没有话要说吗？”叶利钦说。“什么都没有？你们批准了侵略计划，把我们的公民引领到了一场屠杀，难道你们对自己没有任何交代吗？”\n\n他们一个人都没有开口。叶利钦叹了口气。“好吧，我自己来读读和平条款。”\n\n“西西伯利亚联邦共和国将立即放下武器。”\n\n“西西伯利亚联邦共和国的总参谋部将被解除所有军衔和头衔。”\n\n“总统鲍里斯·叶利钦将接受两年的缓刑。”\n\n“西西伯利亚联邦共和国的公民将立即、无偏见地获得联邦公民身份。”\n\n叶利钦感到泪水从脸颊上滑落。他舒了口气，也许是松了一口气，也许是失败的叹息。毕竟，他输掉了这场战争。但是作为公民的叶利钦将会活着见证他的梦想实现，尽管他永远不会成为他曾经希望成为的领导人。或许他的理想活下来就已足够了。\n\n“联系舒克申，”他说。“告诉他我接受了他的条件，但有一个前提。”\n\n巴托夫挑了挑眉。“我怀疑我们没有发言权。什么前提？”\n\n“我想亲自见一见舒克申总统。”"
 unification_war.20.a:0 "两个梦想飞翔，但只有一个梦想翱翔。"
 unification_war.21.t:0 "他的重担已卸下"
 unification_war.21.desc:0 "粗糙的砖块刺进了帕维尔·巴托夫的皮肤，他躲在掩护物后面。他的胸膛随着每一次呼吸而猛烈跳动，汗水滴落在他坚定握持的步枪上。墙的另一边，一整个联邦特种部队小队都在等待机会将他的脑袋打爆，就像他们对待德米特里那样。还有伊万、叶卡捷琳娜、列夫、阿列克谢...和所有和他一起留下来战斗的人。为了他，也为了俄罗斯。\n\n巴托夫弹出了步枪上已用过的弹壳，并重新装填。在短暂的寂静中，他感受到一种平静。为了俄罗斯的名义，他已经竭尽全力。他的勇敢战士们已经付出了一切，他为他们每一个人感到自豪。或许帕维尔·巴托夫将成为历史上又一个暴君，不比鄂木斯克的疯子或萨马拉的叛徒好到哪里去。如果说有什么不同的话，他已经向自己证明，他不是亚佐夫，不是阿韦林，绝对不是弗拉索夫。他不是一个暴君，而是他祖国的真正爱国者。\n\n该死的，或许他和舒克甚至没有那么不同。他们说战争是一场悲剧，但还有什么比兄弟之间的战争更悲剧的呢？尽管彼此存在种种分歧，他们难道不是真正的俄罗斯士兵吗？那些摆脱了贪婪、残暴和理想主义诱惑的仆人们？也许是，但现在这些都无关紧要了。\n\n在这一切的尽头，帕维尔是一个士兵。他有责任要履行，并将一直履行到最后。他往拐角处偷偷瞥了一眼。没有机会。至少有十支步枪瞄准着他的位置。但右边那支似乎在动摇，也许是受伤了？\n\n\"帕维尔·巴托夫，举起双手出来。你还有十秒钟时间服从命令！\"\n\n该死，他见过更糟糕的机会。他扳回枪栓，深吸一口气，向前冲去。"
 unification_war.21.a:0 "为了拯救俄罗斯"
 unification_war.22.t:0 "死因"
 unification_war.22.desc:0 "弗拉辛医生意识到，当他在一天之内缝合第十七次枪伤时，一定有一些重要的事情正在发生。他缝合了最后的缝线，在手术台上缝合了黑盟士兵的枪伤。 “我的朋友，看来你活下来了，”他说。 “击碎你锁骨的子弹只偏离了锁骨下动脉四毫米。”\n\n士兵哼了一声。 “假设我很幸运。”\n\n“没有这样的事情。你的对手只是瞄准不好。”\n\n“只是一次训练事故。”黑色联盟成员从手术台上滑下来，一瘸一拐地走进候诊室。个体的镇痛步态可能表明脚踝出现炎症，可能是扭伤。但更有趣的问题是：他为什么要撒谎？\n\n弗拉辛医生在他那个时代见过很多骗子。希望快速解决问题的吸毒者。在报复之前想要快速缝合的辍学生。还有他自己，每当他告诉妻子他工作到很晚时。是的，弗拉辛认为自己是一个人物读者。但除了最容易上当受骗的无赖之外，没有人会相信今天接受治疗的数十名士兵是在一次训练事故中受伤的。\n\n医生整了整他的实验服，然后沿着通向候诊室的黑暗走廊悄悄走下去。一句话从半开的门里像烟雾一样袅袅升起：“-损害我们的运营完整性，”一个男人说。\n\n“没有医疗干部，我们已经失去了显着的战斗力，”另一位说。 “我建议不要处置。”\n\n“我们不能恐慌。处决他。”弗拉辛开始感到心悸和大量出汗。一双靴子跺着脚走向走廊。他转过身，用粗短的双腿尽可能快地跑着。他飞快地回到考场，从后门进了他的办公室。当他抓起破旧的固定电话拼命输入家里的电话号码时，文件从他的办公桌上飞了出去。它响了。远处，黑色靴子的敲打声越来越近。\n\n“萨沙？亲爱的，你为什么中午给我打电话？”\n\n“听着，我没有时间。”弗拉辛气喘吁吁。 “带上你能带的就跑，去你妈家，不要回头。”他听到门的另一边传来安全卡嗒声。 “对不起，我伤害了你。”"
 unification_war.22.a:0 "后备行动遭到破坏。识别并消除“弗拉辛，阿纳斯塔西娅”。"
 unification_diplo.1.t:0 "海角"
 unification_diplo.1.desc:0 "风呼啸着，刺骨而寒冷，一小群铁路工人、记者和总统助手聚集在一条尚未完工的铁路周围。大多数人都戴着厚厚的围巾和羊毛手套，少数人只是把夹克领子拉到露出的脖子上。但铁路并没有因寒冷而退缩；它坚定地站立着，毫不屈服，像一座山一样吸收着寒冷的打击。\n\n铁路的东方是新西伯利亚，即使离城市还有几英里，霓虹灯和像太阳一样的灯柱也能看得见。摩天大楼屹立在她的中心，伸向不可触及的天空。成千上万的汽车在城市中穿梭。她是重聚一个国家的大都会，是实力之地，是联邦经济和政府的核心。铁路的西方是斯维尔特拉共和国的希克季夫卡尔。她的领土是一个饱受战争摧残的地方，仍然有共产游击队和野蛮的希特勒军队的痕迹。但她也是一个实力之地。自由派政权经历了一次又一次的入侵，更不用说她在刚刚成立时所镇压的残酷城市起义了。任何能跨越乌拉尔山脉的政权都值得结交。\n\n他们将与她交朋友。\"舒克申总统，锤子准备好了，\"其中一名工人说道。在这位绅士的脚下，最后一颗铁路钉准备好要钉入半冻土地中。这一刻是一年工作的顶点。这条铁路将穿越鄂木斯克、秋明和乌拉尔山脉，将联邦与西方的朋友连接起来。舒克申只需一击，就能将自由俄罗斯的两个部分统一起来。\n\n舒克申拿起了铁锤。它很重，笨拙，不是他习惯使用的工具。\"你叫什么名字？\"他问工程师。\n\n\"马克西姆，先生。\"\n\n\"你是哪里人，马克西姆？\"\n\n\"戈尔基，先生。父母还住在那里。\"\n\n\"啊，我明白了。\"舒克申掂量着手中的大锤。手柄很粗糙，他可以看到边缘处出现了一条裂缝。 “马克西姆，让我们一起敲打这个钉子。"
 unification_diplo.1.a:0 "我一个人敲不进去。”"
 unification_diplo.2.t:0 "安逸"
 unification_diplo.2.desc:0 "保罗·巴托夫元帅站在舒克申总统身旁，举起僵硬的手臂行军礼。“俄罗斯人民联盟的战士们，向你们的总司令敬礼！”他大声喊道。\n\n“长官，是的，长官！”数千声音响起。将近三分之一的联盟军队齐聚叶卡捷琳堡，目睹这个将俄罗斯人民联盟并入联邦的仪式。一排排步兵站在舞台前，制服整齐，一尘不染。数十名坦克指挥官站在坦克上，装甲在炽热的阳光下闪闪发光。微风吹过他们新剪的头发。一群联盟空军军官在人群中肃立，他们的大部分同僚并未出席，他们以一系列爆炸性的冒险飞行开始了仪式。在舒克申看来，没有人坠毁简直是个奇迹。\n\n或许他们只是太过出色。\n\n整个体育场的士兵同时行军礼。他们擦亮的靴子重重地踏在地面上，几乎把舒克申的耳膜震碎。“列柳申科将军，”巴托夫喊道，“把城市的钥匙交给我。”\n\n德米特里·列柳申科向右边走去，他的动作几乎像机器人一样。这位秃顶的将军双手伸展，把一张雪白的枕头抱在手臂上。他伸出双手，将叶卡捷琳堡的钥匙，以及它的主权，交给了舒克申。\n\n瓦西里的手指滑过冰冷的金属，他颤抖着抚摸着那把金色的手柄。“我不会背叛你们的信任，”他说。\n\n巴托夫微笑着，当列柳申科离开时，他轻声说道：“记住，不要辜负。”作为俄罗斯联邦元帅，他第一次行军礼致敬。"
 unification_diplo.2.a:0 "长官，第三集团军听从您的指挥。"
 unification_diplo.3.t:0 "结局和延续"
 unification_diplo.3.desc:0 "叶利钦坐在吱吱作响的椅子上陷入沉思。记忆如闪电般在脑海中掠过。这是正确的选择吗？俄罗斯曾多次陷入黑暗。最重要的是，他想到了俄罗斯联邦的未来。俄罗斯经历了三十年战争以来前所未见的事情；她彻底地，完全地，崩溃了。沙皇、苏联人和德国人都失败了。没有真正的继任者，尽管许多人声称并非如此。但是仍然有理想主义者，仍然有领导者，还有愿意为自己的国家挺身而出重建废墟的人。俄罗斯重返世界舞台，比任何人做的都好。有史以来第一次，俄罗斯获得了自由。\n\n秒变成分钟，分钟变成小时。叶利钦坐着，安静地呼吸着，除了一瓶酒，他是一个人。他的心狂跳起来。这个决定太重要了，不能交给一个人。哦，他可以信任巴托夫！\n\n敲门声响起，鲍里斯喝完了最后一滴酒。 “先生，”他的秘书说，“时间到了。”\n\n他把伏特加扔进垃圾桶，摇摇晃晃地走到门口。天哪，为什么一定是他？他靠着秘书的肩膀离开了办公室。慢慢地，非常缓慢地，他们走向了大宴会厅。里面，数十名政要四处走动。优雅的人类跳蚤群似乎融合成一团可怕的东西，一个会吞噬他和他的优柔寡断的巨大生物。当他走向讲台时，每一双眼睛都注视着他。\n\n叶利钦说：“女士们，先生们，感谢你们今天加入我的行列。”作为联邦共和国总统，他咽下了最后一口气。 “经过深思熟虑，我选择接受舒克申总统的条约。我们的共和国将合二为一。”\n\n热烈的掌声响彻舞厅。也许奇怪的是，通过简短的演讲和轻轻一挥笔，他们又都变成了俄罗斯人。无政府时代、绝望时代、暴政时代，立刻结束了。联邦时代诞生了。"
 unification_diplo.3.a:0 "你可以打造一个刺刀王座，但是你在上面坐不久"
 unification_diplo.4.t:0 "损害控制"
 unification_diplo.4.desc:0 "在萨马拉的街道上，一辆孤零零的汽车在庞大的总统办公室前嘎吱嘎吱地停下。米列季·济科夫通常不是一个反应迅速的人，也不是一个会在准时性上妥协的人，但最近的消息却像闪电一样击中了他。 团结党决定性地输掉了统一公投。\n\n农工党战胜了他的忠实盟友，他的宣传在俄罗斯人民耳中激起了煽动性总统对未来的乐观看法。他只能为他崩溃的共和国进行损害控制。 济科夫走进他安静的办公室。 “特洛伊茨基，在那次公投中，我们有多少党员叛逃到农工党？”\n\n“好吧，统计数据实在是太长了，我无法彻底总结，但看起来不太好，长官，”特洛伊茨基滑过报告。 济科夫的脸色铁青。他没想到像“多数”、“活动家”和该死的鲁马斯蒂耶夫这样的词像重磅炸弹一样散布在整个报告中。外交部长博加特丘克补充说：“有些人甚至宣誓效忠自由派阿尔希波夫，以保留他们在当地的办公室。当公民投票崩溃导致在没有我们党的支持的情况下失去工作的风险时，他们的忠诚是无用的。”\n\n济科夫揉了揉太阳穴，将报告放在一边。他白手起家建立政党的岁月，为批准《萨马拉宣言》而洒下的鲜血，他的宣传和承诺的政治机器编织的网；现在这些都不重要了。当然，除了机会主义和自我保护之外，他对自西俄战争以来与他一起进军的一大批平民合作者有何期望？\n\n他宣称，“组织团结党的残余分子，我们争取俄罗斯民主的斗争不会被空想的自由主义所扫荡。不会被企业傻瓜舒克申，不会被鲁马斯季耶夫，也不会被阿尔希波夫的积极分子所扫荡。”\n\n齐科夫重新振作起来，站起来激励他的顾问们：“我们党的队伍可能会被削弱，但它只是让我们运动中的水蛭和机会主义者流血。它现在是一支精干的爱国者力量，可以进行民主革命，而无需炮弹。 ”"
 unification_diplo.4.a:0 "团结党在俄罗斯的斗争还没有结束，才刚刚开始。"
 unification_diplo.5.t:0 "传递火炬"
 unification_diplo.5.desc:0 "当他闭上眼睛时，他仍然能辨认出它们。他们的脸，他们的尖叫声和叫喊声，还有他们的身体。无论他走到哪里，它都跟着他，无论是参观新车队的坦克模型，还是坐在他的办公室里看着雨水从窗户流下。\n\n布尼亚琴科是一个麻烦缠身的人。任何人都可以看透那么多。然而，瓦西里·舒克申看到了更深层次的东西。受折磨的灵魂，还是穿着制服的怪物？除了他死人般的眼神，他们还有什么吗？他不确定，但他确实知道一件事。他最不希望从谢尔盖·布尼亚琴科口中听到的是和平融合的提议。\n\n舒克申从上到下仔细检查了文件的每一行，确保没有任何隐藏条款或“细则”。令他吃惊的是，他并没有得到任何类似的东西。\n\n这篇论文相当简单。俄罗斯国家的领土将被打破，取而代之的是在联邦下形成自治的联邦共和国。它的武装部队RONA将被清除掉所有叛徒分子。那些被认为对俄罗斯事业足够忠诚的人将被整合到前西伯利亚、现在是俄罗斯的武装部队中。\n\n他几乎不敢相信。坐在桌子对面的那个人被大多数东俄罗斯人视为下等人中的最低等人。一个合作者，利用他对德国的关系和忠诚度来支持在未来几年内征服斯拉夫人民。然而，该文件显示并非如此。舒克申期待着一场为俄罗斯的未来而战的全面战争。邪恶与善良、哈巴狗与复仇者之间的战争。然而，那些曾经盘旋的正义报复和冲突的想法现在已经消散成一种.. 解脱的感觉？”我把这个责任委托给你。俄罗斯的未来属于你。不要让她失望，否则你也会承受我的恶魔的重量。你明白吗？"
 unification_diplo.5.a:0 "谢尔盖·库兹穆克·布尼亚琴科，我接受你的重担"
 unification_diplo.6.t:0 "占位符"
 unification_diplo.6.desc:0 "c"
 unification_diplo.6.a:0 "c"
 unification_diplo.7.t:0 "总和"
 unification_diplo.7.desc:0 "今天标志着俄罗斯巨大屈辱的结束！随着这份文件的签署，俄罗斯民族共和国和西伯利亚联邦将合而为一，在俄罗斯农工党和瓦西里舒克申的崇高主席的领导下统一起来。和平已经实现。荣耀归于联邦！”\n\n阿尔汉格尔斯克的街道上爆发出欢乐的尖叫声，成千上万的人在庆祝世界上许多人认为不可能的事情。从瑟克特夫卡尔到新西伯利亚的电视转播了这个充满正义荣耀的重要时刻，共和国和联邦的旗帜齐声并肩飘扬，就像两位领导人现在站着的样子。\n\n几个小时过去了，太阳终于开始从前革命者的家上方褪去，只留下舒克申和数学家独自留在会议厅昏暗的范围内，除了散落在桌子上的十几份文件。\n\n“所以，我……不知道这是否是一个大胆的问题，但是，我的意思是……为什么？在成功战胜狂热者并剿除政治对手之后，任何人都会认为你会像命悬一线般紧守那个职位。见鬼，那些指向你背后的匕首数不胜数，我可以说，你的生命确实取决于此。你为什么认为我们比你有更好的机会呢？”\n\n沙法列维奇倒在椅子上，仔细思考着作家的问题。毕竟，他在某种程度上是对的。在生病的共和国的那些日子对他的考验比任何测验都多。 欧亚主义者，秩序社会主义者，甚至那些该死的君主主义者。他们所有人，都在等待合适的时机从背后捅他一刀。\n\n“瓦西里，每个问题，无论看起来多么困难，都有其解决方案。有时，解决方案就是退后一步，根本不尝试”。\n\n舒克申考虑了好几个小时的回答，甚至当这位数学家动身前往科米森林中的隐居之所时，这位俄罗斯的新领导人也说不出话来。"
 unification_diplo.7.a:0 "那是什么意思？"
 regionalunification_war.1.t:0 "一位丈夫的悲痛"
 regionalunification_war.1.desc:0 "他的项目失败了。在长期假装法西斯主义毫无价值之后，他成功地在西伯利亚民族共和国掌权。而现在他周围的一切都在崩溃。当他坐在马加丹的办公室里时，他能听到远处的炮火声。他的妻子已经被派往美国。他不能让家人住在战火纷飞的城市里。但是他的妻子求他，恳求他一起去。他们可以在美国安全舒适地度过余生。他知道她是对的。中央情报局很乐意重新安置他，以换取他能给予他们的任何帮助。\n\n但俄罗斯是他的家。他瞥了一眼窗外，发现远处地平线上冒着浓烟，伴随着敌军冲进城市的炮火声。就算是现在，这座城市也是他的家。这个国家是他的家。他曾希望有一天，他可以为整个俄罗斯带来和平，让每个人都有机会过上舒适的生活。现在，很明显，他将作为一个被遗忘的军阀死去，只是历史上的一个注脚。但正如他向妻子承诺的那样，他会坚持到底。\n\n他办公室的门突然打开，他的一名将军走了进来。“长官，我们再也守不住这座城市了。他们已经突破了我们防御工事的外圈，正在向内圈发起进攻。我不不知道它能坚持多久，但不会坚持太久。也许我们可以考虑——”\n\n将军被佩特林打断了，后者皱着眉头转向年迈的俄国人。 “向敌人发出我们投降的信号。让这些人放下武器。我不想再为无望的事业流血。这些人值得活下去，而我将给他们这样的生命。”将军点头表示接受命令后，佩特林补充说：“我想要一名护卫与他们的首席将军讨论我们无条件投降的问题。请尽快安排好。”\n\n当将军再次离开时，佩特林重新凝视着外面的城市。他希望他们不要处决他，希望他能再见到他的家人。脑海中浮现出妻子的身影，他让自己微笑起来。"
 regionalunification_war.1.a:0 "有时，投降是唯一光荣的选择。"
 regionalunification_war.2.t:0 "元首的远航"
 regionalunification_war.2.desc:0 "“让我过去！”马特科夫斯基一边从涌向码头的难民人群中挤过去一边喊道。每个能背着衣服的人都朝着码头走去，希望能躲开向马加丹进军的敌军，马特科夫斯基也不例外。 “给我滚开！”当他终于挤到码头时，他又喊了一声，用一只胳膊抵住一个抱着婴儿的女人。\n\n有一排船，全都挤满了难民。 “我他妈的是米哈伊尔·马特科夫斯基，让我通过！”他大叫一声，脖子上的青筋暴起，脸因愤怒而通红。没有人为他动。这些该死的农民不知道他是谁？ “我必须上那条船！”他哭了，当他遇到一堵人墙时，他的声音里透出一丝绝望，所有人一次只拖着几厘米的距离走向船只。\n\n然后，其中一艘船吹响了号角，开始滑出码头。他妈的。他没有很多时间，他必须去第二个。就在他转身向第二辆驶去时，它也吹响了喇叭，开始离开。沿着码头，船只已经远远超出了它们的全部容量。他们的船长已经示意该出发了，剩下的就交给他们自己的命运了。离开马特科夫斯基。\n\n“不！不！谁给我一台收音机！我必须和其中一位船长谈谈，他们必须回到码头！”周围的流民根本不理会他，也许以为这是某个疯子的胡言乱语。他们都在转身寻找另一种逃离城市的方式，但马特科夫斯基决心到达码头。也许如果他——\n\n他还没来得及想完，就滑倒在坚硬的水泥地上，成群结队的难民从他身上踩了过去，纷纷涌离码头。然后第一只靴子踩在他的手臂上，紧接着另一只靴子猛地撞进了他的腹股沟。他的身体因剧痛而抽搐，但另一只脚猛地撞上他的脑袋，使他的脑袋重重地撞在混凝土上。一个又一个靴子接踵而至，当码头清空后，米哈伊尔·马特科夫斯基的尸体还在。"
 regionalunification_war.2.a:0 "法西斯主义者死在他的臣民脚下。"
 regionalunification_war.3.t:0 "死之荣誉"
 regionalunification_war.3.desc:0 "当他们在马加丹郊外的荒野中小跑着穿过齐膝高的积雪时，一小队人马朝着大约两公里外升起的烟雾前进。他们非常清楚没有人敢在茂密的针叶林中居住，因此处于高度戒备状态。他们警惕的目光从一条林线扫到另一条林线，祈祷无论谁在这里，都不会先射到他们身上，但他们在长途跋涉中发现的唯一阻力是吹在他们脸上的冷风。\n\n随着巡逻队越来越靠近烟雾的源头，看到的景象有些出乎他们的意料。除了他们自己，火堆附近没有任何生命迹象。现场的军官下令分散开来，并在火灾发生前推进到林线以躲避。举起武器，这些人轻快地朝着目标移动，在光源周围布下火线。然而，他们再次发现没有抵抗力。\n\n当这些人终于到达光源时，他们发现那只是一架直升飞机的阴燃残骸。它一点也不像俄罗斯制造的东西，这一点是可以肯定的。巡逻队开始朝沉船前进，直到一个声音喊道：“尸体！在那儿！”\n\n直升飞机前躺着一个身着迷彩服的人，旁边放着一盒雪茄，手里还拿着一把沾满鲜血的冲锋枪。军官上前检查尸体，命令两个人把死者翻过来。当他们这样做时，露出了他的脸，他们看到的景象是明白无误的。尽管雪覆盖了他的脸，冻伤侵蚀了他的四肢，他们还是找到了目标。\n\n这名军官对着手持无线电向最高指挥部汇报。\n\n“长官，这里是 Fox 3。我们找到了 米切尔·韦贝尔。他已经死了。看起来弹片的伤口让他流血不止。结束了。”军官将收音机递回去，低头看着他面前的尸体。他凝视着这个接管了他的家园并只为自己的财富而统治的人。然而，他是一个有尊严的人。他为他的部下的利益而自豪地战斗。\n\n军官立正，向他的前对手和战友敬礼。"
 regionalunification_war.3.a:0 "“再见，美国。”"
 regionalunification_war.4.t:0 "破碎的冰封王冠"
 regionalunification_war.4.desc:0 "叶利佐夫砰地一声打开门，看到沙皇的临时办公室，差点把门撞坏。米哈伊尔跳了起来，因为担心只能被描述为前线完全结构性故障而感到紧张。\n\n叶利佐夫立即开始高谈阔论。 “我的沙皇，我们需要让你离开这里。紧急疏散程序已经生效，我们必须再次撤退。共和军已经摧毁了通往东方的铁路，所以我们需要乘坐地面车辆。我们也许可以在新的中心位置设立另一个总部——”\n\n当沙皇陷入沉思时，他最信任的帝国卫队之一的声音逐渐消失。总部再次沦陷。再次，政府必须搬迁。他应该负责的政府。当他想起自己令人作呕的天真时，他的心因后悔而冻结。也许如果他刚刚把政府交给谢普诺夫，那么他的手上就不会流那么多血了。现在，他的手下到底是为了什么而战？他可以看到他的将军脸上的疑虑，因为他们咬紧牙关撒谎说只要这次后勤打击成功，或者大胆的突破在侧翼找到购买，战争就可以赢得。沙皇有很多东西，但他不是一个愚蠢的人。他每天都可以看到领土的损失，他发誓敌人离得如此之近，他能感觉到大炮在震动地面。\n\n“——所以我们的新职位有可能——”\n\n“够了，叶利佐夫。”米哈伊尔说，一只疲倦的手举在空中，他深吸一口气，脸上写着冷漠的顺从。 “这已经持续太久了。太久太久了。因为这种意识形态的分裂，兄弟之间流了太多的血。”叶利佐夫站在那里，目瞪口呆地沉默了。\n\n迈克尔并不是一个特别老的人。然而，当他终于用颤抖的双腿站起来时，他觉得自己像个年龄是他两倍的人。这些古老的传统，这个古老的身体，这个古老的皇冠。如果他们连其他人都保护不了，那一切都毫无价值。 “我要和我的内阁谈谈，叶利佐夫。如果你愿意的话，跟我来吧。”"
 regionalunification_war.4.a:0 "“是时候谈判我们立即无条件投降了。”"
 regionalunification_war.5.t:0 "毁灭的白军"
 regionalunification_war.5.desc:0 "全完了。\n\n这应该是光荣的白军对抗自由派奸诈势力的最后堡垒。当年出卖国家，直接挑起国家垮台的人。即使是现在，当谢普诺夫透过封锁的门听到他们大胆的谎言时，毒液还是从他们的嘴唇溢出。投降，什么废话。沙皇和谢普诺夫本人现在不能做的一件事就是投降。他们很幸运，仅此而已。白军运动可以在法律上和事实上的国家元首去世后幸存下来。它不需要他。他很确定。\n\n“鲍里斯，也许是时候放弃了。真的，我敢肯定他们会把我们抓起来。我们是高价值的政治犯！我们仍然可以带着我们的生命走出这里，我的朋友！”乞求沙皇尼基塔一世。乞讨不适合沙皇。\n\n“没有出路。再也没有了。这是我们的时刻，尼基塔！这是我们为事业而死的机会，再次将我们自己铭记在白人运动的心中。我们将为事业而死！”谢普诺夫叫道。尼基塔一看到他的眼睛就畏缩了。那不是一个正常人的眼睛。尼基塔知道谢普诺夫在整个撤退期间一直处于极度的精神压力之下，但他从来没有这么明显地写在脸上。多年后，他的眼睛仍在寻找，仍然为战斗做好准备。直到最后一刻，尼基塔意识到，当鲜血从他的脸上流尽时。\n\n“这是你最后的机会了！谢普诺夫警官！你要跟我们走，不管是生是死！”一些特别热心的新兵喊道。枪声仍在下面的街道上回荡。鲍里斯否定地尖叫了一些废话，但尼基塔因为心脏在胸腔中狂跳的声音而无法完全听清他的声音。他快要死了。在发生了这一切之后。毕竟他们努力过。这真的结束了吗？\n\n发生了一些事。尼基塔不太确定是什么。前一秒，路障还完好无损，而谢普诺夫显然已经发疯了，还在大喊脏话。接下来，他躺在白军团长旁边，无数枪伤流血不止。\n\n尼基塔的时间似乎变慢了。他想不通。耳鸣，视线模糊，他站起身来，“等等——” 他被枪响打断。"
 regionalunification_war.5.a:0 "俄罗斯再次驱逐了沙皇。"
 regionalunification_war.6.t:0 "万字的裂缝"
 regionalunification_war.6.desc:0 "罗扎耶夫斯基用拳头重重地砸在桌子上，以至于人物四处飘荡，在木质表面上发出咔哒声，吓坏了优雅地坐在他腿上的猫科动物。猫爪子伸进了他的裤子里，而站在桌子周围的警官们互相看了一眼，脸上写满了担忧。这些数字是精心布置的，以代表他的部队和他的敌人的部队，敌人每天都在收紧套在他脖子上的绞索。他们有更多的人、更多的武器和更多的工业。这背后一定有什么恶意。罗扎耶夫斯基知道这一点。这一定是一些犹太-布尔什维克的阴谋，目的是让他被打败，无法清洗俄罗斯并使其再次强大。他不会允许的。\n\n“我要向前线指挥官下达命令，”罗扎耶夫斯基迅速向围坐在桌旁的将军们解释道。 “他们在任何情况下都不能撤退。他们的生活和未来——”\n\n罗扎耶夫斯基被打断了，因为他们所在的地堡因猛烈撞击他们头顶的土地而猛烈震动。天花板上的灰尘散落在整个内部，但地堡的屋顶仍然存在。待众人回过神来，其中一位将军开口了。 “长官，我们不能再守住这个地堡了。我们必须考虑替代方案——”\n\n“备择方案？”罗扎耶夫斯基打断了他的话。 “我们有什么选择？向敲打我们大门、尖叫着要我们流血的犹太-布尔什维克投降？我不会向那些动物投降！我会看到每一个男人、女人和孩子死在贝加尔湖这边我让他们控制我的一盎司领土！”周围的军官在罗扎耶夫斯基的喊叫声中退缩了。他们无法说出他们更害怕什么：侵略者手中的正义，或者如果他们投降，罗扎耶夫斯基的愤怒。\n\n讨论被一名冲进房间的军官打断了。他迅速向罗扎耶夫斯基敬了个礼，罗扎耶夫斯基正在观察是否有必要中断这次重要会议。当他开始口吃，试图找到词语时，军官似乎几乎在颤抖。 “快说话，看在他妈的份上！”罗扎耶夫斯基喊道，再也忍不住了。\n\n“长、长……他们已经攻破了我们最后的防线。”"
 regionalunification_war.6.a:0 "怒言不能止军。"
 regionalunification_war.7.t:0 "在新的体制下"
 regionalunification_war.7.desc:0 "谢尔盖和其他牢房囚犯鱼贯而出卡车时，他用眼睛挡住了刺眼的阳光。自从他在没有任何理由或审判的情况下被从他的妻子和孩子身边带走并推上卡车后座以来，已经快五年了。他挨打挨打，只是抱着从内务人民委员部监狱里活下来的希望。每天晚上，他都会祈祷力量能够持续到他最终的自由。当这种自由以联邦军队打开他的牢房并命令他离开的形式出现时，他毫不犹豫地抓住了这个机会。\n\n亚戈达政权的囚犯被带到谢尔盖只能假设为援助营的地方。谢尔盖确实注意到，当他按照联邦士兵的指示行事时，他对任何问题置若罔闻，没有人接听他的电话，这是多么奇怪。他的团队被带到一个前面有一排桌子的大帐篷里，在一张纸条上给了一个号码，然后被告知去一张桌子。拨通谢尔盖的电话后，桌子后面一位衣着整洁的女士递给他一件折好的套头衫，上面缝着一个七位数的号码，还有一个文件夹。\n\n“对不起，但是什么——”谢尔盖被这位女士简短的语气打断了。\n\n“您需要知道的一切都在文件夹里，先生。”她对他说，当他瞥了一眼那个有补丁的号码时，她的眼睛甚至都没有正视他，这太让人想起他现在穿的那件了。\n\n“但肯定有误，我是——”\n\n“除非你生病或受伤，否则你必须按照你的文件夹中指定的去做。现在请前往更衣室，否则我将被迫呼叫保安。”她冷冷的目光透过他的胸膛射向谢尔盖，他默默地点点头，然后走开了。当他坐下来打开文件夹时，他的手变得更加颤抖。\n\n他握着一本三页小册子。正面刻有“西比尔刑事遣返计划”。在第二页上，谢尔盖的颤抖加剧。当他阅读自己新的“就业”条件时，眼泪开始滴落在小册子上。“我们西比尔相信康复的力量，这就是为什么我们愿意在我们的新流刑遣返回国设施雇佣你。我们希望你能再次成为守法公民。”"
 regionalunification_war.7.a:0 "“你的强制性服务合同为期五年。”"
 regionalunification_war.8.t:0 "最终陨落"
 regionalunification_war.8.desc:0 "随着军队进军他们的领土，主席团的首都一次又一次地向东移动。又一次，当另一个势力夺取他们的土地时，他们的士兵一个接一个地倒下。别索诺夫坐在主席团的高级官员们在这些首都之一的临时作战室里，他的双手紧紧地握在一起，眼睛盯着地面。在他周围，高级军官们争论着下一步该怎么做。有些人说，也许他们可以越过大洋。有些国家可能仍会接纳他们，这是旧苏联最后的政治领导层。最后，别索诺夫摇摇头站了起来。\n\n“我们是苏联的主席团，”他开始说道。 “所有这些其他所谓的国家和民族可以随便称呼自己，但最终他们不过是军阀。只有我们是整个俄罗斯唯一可以称自己为国家的人。我们是列宁和布哈林真正的继承人。当战斗看起来失败时，列宁和布哈林会溜走吗？不。我们是全联盟共产党，我们将留在俄罗斯。”\n\n房间里一片寂静。没有人知道别索诺夫会以何种方式倒下。他可能是一个理想主义者，但他也是一个务实的人。但也许，别索诺夫扫了一眼房间里回头凝视他的脸时想，他们终于想起他推翻亚戈达是为了拯救共产党和主席团。他不会逃跑，现在不会。他发誓无论如何都要为共产主义服务，如果这意味着他的死，那就去吧。\n\n“敌军正在全面进攻，”其中一名军官打破了房间里的咒语。 “我们可以准备在这里、这里和这里通过这些街道架设防线。”他指着摊开在桌上的地图，其他军官开始点头或讨论这支部队或驻扎在这里或那里的优点。别索诺夫又一次静静地听着，他的思绪又飘回到布哈林身上，他多年前曾为他服务过。他想知道当德国人向莫斯科进军时，他是否有这种感觉，所有的希望都离开​​了苏联事业。也许他对他太苛刻了。随着辩论的激烈进行，他们收到了消息：敌军来了。"
 regionalunification_war.8.a:0 "主席团不再逃跑。"
 regionalunification_war.9.t:0 "共赴黄泉"
 regionalunification_war.9.desc:0 "在阿扬市的心脏，阿穆尔河以东，远东苏维埃社会主义共和国最后的残余军队沿着破裂的木制路障持起了武器。他们年轻，最年长的也不过十五岁，手持各种各样的生锈剑、从彼得罗巴甫洛夫斯克缴获的步枪和从一座燃烧的警察局取得的手枪。他们的骨头冻僵了，手指麻木，即使在肮脏的布料下面，耳朵和鼻子也被烧伤。这座城市没有一样是干净的；空气被灰尘和煤烟污染，每一个表面都覆盖着薄薄一层污垢和油脂。这就是时代末日的生活。\n\n他们的领导是伊戈尔，一个鱼贩子的儿子，有化学天赋。他把苏维埃社会主义共和国的旗帜绑在扫帚杆上，撑在两块破裂的砖块之间。它在风中飘扬，像钓鱼钩上的新鲜鳟鱼一样。他咽了口水，然后回到自己的岗位。\n\n伊戈尔的副手塞尔梅格用胳膊肘顶了顶他的肋部。“别把那种表情挂在脸上，”她低声说。\n\n“什么表情？”他越过路障看了看。他们的街道空无一人，只有燃烧的建筑和余烬。\n\n“恐惧。你看起来好像要尿裤子了。”\n\n他笑了。“已经尿过了。”在远处，呼呼作响的引擎声越来越近。“不怕的话肯定是傻子。”伊戈尔凑近他朋友的耳朵悄悄说。“如果联邦不轰炸港口，我们早就该乘船撤退了。我听说他们在马加丹重组……”\n\n随着呼呼声逐渐变成一声雷鸣，一辆涂着联邦的绿白色的装甲车就在学生路障前面一米处冲进了街道。“市民们，”喇叭声响起，“全俄联邦政府要求你们放下武器并解除武装。如果你们不这样做，我们将毫不犹豫地使用致命武力。”\n\n伊戈尔的腿上流下了一股新鲜的尿液。他的眼睛瞪大了，手掌上滴满了汗水。但在他心中，他已经知道该说什么。\n\n“操你妈！”\n\n随后，装甲车开火了。"
 regionalunification_war.9.a:0 "永别了，红十月。"
 regionalunification_diplo.1.t:0 "梦与救赎"
 regionalunification_diplo.1.desc:0 "尼古拉·佩特林坐在副总统舒克申身边，联邦总统办公室鸦雀无声。自两人掌舵的国家正式合并以来已经过去了好几个小时，所有的新闻发布会和与波克雷什金总统的联合演讲都是如此，但佩特林不禁觉得他为俄罗斯服务的时间是未完成。\n\n“瓦西里，我为我的国家做了正确的事吗？”佩特林看向舒克申，后者在仪式结束后一直留在办公室和他在一起。\n\n“尼古拉，你阻止了我们各州之间的战争，并促进了我们国家的统一。我相信你做到了。”舒克申对佩特林产生了一种钦佩之情。来自针叶林之外的法西斯勾结的故事起初让他很担心，但他的政府带来的变化动摇了舒克申对这个人的看法。\n\n“我花了很多年的时间来消除我前任的专制和腐败。我竭尽全力为我的国家留下更好的遗产。现在，当我把这个责任留给你们的总统和他的自由制度的影子时，随着它被贪婪和权威所奴役，我不禁觉得我已经注定了俄罗斯要重蹈我努力阻止的命运。”\n\n舒克申同情地看着他的对手。 “我理解你的担忧。诚然，我有时会与你分享这些担忧，但你必须保持希望，希望自由的梦想能够为我们的祖国实现。无论我有什么办法，我都不会让你的工作白费。 “当佩特林凝视着新西伯利亚的天际线时，副总统露出了一丝乐观的表情。\n\n“我本来打算一次性把共和国的首都迁到这里来的，这座城市的美景太多了，但是……没想到雾霾这么严重。”\n\n当舒克申转向办公室的窗户时，他满怀希望的笑容微微一动。 “我们的联邦并不完美，但在它的缺陷中的某个地方，却蕴藏着创造更美好明天的真正潜力。看那里，”他指着鄂毕河，“在废墟和泥土之下，一条闪亮而干净的河流就在地表之下。它只需要适当的照顾，它就可以蓬勃发展。”\n\n佩特林和他一起凝视着河水，很长一段时间都没有说话。"
 regionalunification_diplo.1.a:0 "“我希望你是对的，瓦西里。”"
 regionalunification_diplo.2.t:0 "力量与意志"
 regionalunification_diplo.2.desc:0 "港口办公室中，空气中弥漫着一股清新的寒意，波克雷什金凝视着他的对手米哈伊尔·马特科夫斯基。尽管他们之间似乎已经达成了和平解决方案，但房间里的紧张气氛像马加丹港的风一样强烈。总统观察着元首，他审查着面前的条约，只有他的签名才能将西伯利亚民族共和国并入联邦。\n\n“条约很简单，当然了。你们的行政机构将按照联邦的方式划分，并整合进西伯利亚联邦。”波克雷什金小心地说着，试图引导马特科夫斯基接受联邦的条件。元首的声誉就像他本人一样复杂，让人难以理解。\n\n“我要明确表示，我对你们的联邦及其政府有很多保留意见。我发现将权力让渡给联邦主义只会导致软弱，没有其他好处。然而，我必须赞赏你们的行政效率。我见识过你们如何处理无聊的社会主义煽动，并指挥你们国家的企业力量。很显然，您希望俄罗斯走向强大的意愿非常强烈，我必须对您表示赞赏。”\n\n波克雷什金惊讶地发现自己与元首意见一致。“当然，确保国家的最佳利益和实力是我领导的行政机构的驱动力，正如它必须是整个国家的驱动力一样。放弃这一点只会浪费俄罗斯的巨大潜力。”\n\n元首抬头看着波克雷什金，房间里的紧张气氛开始消散。“那么我看到你的驱动力与我在任期内一直追求的一样。亚历山大·波克雷什金，我将俄罗斯的未来托付给你，这是一项你完全值得我的信赖的职责。”马特科夫斯基与他的共和国一起放弃了元首的头衔，面对总统的默契点了点头。\n\n波克雷什金接过文件，准备离开办公室，但停了下来。“等一下。共和国的时代或许已经结束，但剥夺您为祖国服务的权利是不公平的。您总是可以在联邦中找到一个新的位置。”\n\n马特科夫斯基朝总统看了一眼。“您有什么打算？”"
 regionalunification_diplo.2.a:0 "“米哈伊尔·马特科夫斯基，马加丹州长及伟人。”"
 regionalunification_diplo.3.t:0 "临别礼物"
 regionalunification_diplo.3.desc:0 "“嘿，谢尔盖。你介意出去一下吗？发生了点事情。”站在马加丹新设立的联邦哨所门口的是谢尔盖的朋友基里尔，他的脸上带着困惑和轻微的担忧。基里尔咕哝着，发出一声叹息，站起身来，跟着谢尔盖一起走出去，离开了他们的哨所的温暖和舒适。\n\n谢尔盖指着路边，他的目光朝着一系列移动的物体：一列军用卡车，迅速驶过道路。谢尔盖的表情现在与基里尔的相似，他回到哨所，从桌子上拿起双筒望远镜，不费力气地跑回了外面，连门都没关。他俯视着道路，能够看到最前面的卡车里的一个人，身穿迷彩服，嘴里叼着一支雪茄。\n\n“他们到底在干什么？”基里尔低声嘀咕道，目光仍然集中在他视线中的那个人身上。谢尔盖没有说话，只是困惑地耸了耸肩。随着哨所和卡车之间的距离缩小，基里尔放下了望远镜。两个人开始朝着这群人走去，他们在路中间相遇，举起武器对准了他们。\n\n“别动，否则我们开枪！”谢尔盖尖叫道。他的困惑转变成了恐惧，不确定该如何应对这种情况。他的手指在颤抖，基里尔也是如此。那个靠近他们的人停在原地，从嘴里平静地取下雪茄。\n\n“你们两个小伙子会说英语吗？”那个人用浓重的美国口音朝他们喊道。两个人扭过头，对视了一眼，表情都带着困惑。他们再次望向路边的那个人，大声回答道：“什么？”当他们看得更清楚时，他们放下了武器。\n\n“这就是要替代我们的一群乌合之众？”那个人笑着对士兵们说道，“告诉你们的老板，我有份礼物要送给他。我不再需要它了。”那个人伸手到腰侧，从手枪套中取出一把刻有花纹且手工制作的M1911。用手指翻转枪，他伸手让他们之一拿去。"
 regionalunification_diplo.3.a:0 "“这把枪是你的了，孩子。”"
 regionalunification_diplo.4.t:0 "投降的冰封王冠"
 regionalunification_diplo.4.desc:0 "迈克尔·安德烈耶维奇·罗曼诺夫无精打采地盯着赤塔皇宫的餐桌。在过去的几个月里，他经历了俄罗斯有史以来最动荡的政治旅程之一。在他们的臀部地区，赤塔看到她的敌人像多米诺骨牌一样倒下，法西斯主义者和共产主义者。这位前沙皇目睹了区域权力的巩固，但在谢普诺夫的眼皮底下却一举扭转局势，赢得了公民和武装部队的支持。\n\n他培养了希望。希望在他的人民身上，希望在白军统治下所谓的“继承哈尔滨王位”。他在自己身上聚集了前进和为俄罗斯人民服务的力量和动力。他记得他终于对必须要做的事情心平气和的那一天，仿佛就在昨天，他的心中燃起了一团火。坐在这里，在这一切结束时，米哈伊尔感到空虚。\n\n简单地把它交给别人是正确的做法吗？这不是在诋毁那些为他的王位而战斗、杀戮和牺牲的人吗？或许他应该努力讨价还价，至少尝试让自己成为立宪君主。他摇摇头。现在再猜测自己已经太迟了。\n\n他能听到他们在宫殿外欢呼——沙皇的忠诚者。在最后几周的谈判中，严格的君主主义者开始了全国范围的抗议，但最终因米哈伊尔对统一的支持而平息。然而，宫殿前的人群似乎只增不减。人民团结在他们的沙皇身后，分享他如何英勇地摆脱自己的枷锁以掌握他神圣的命运，为饱受战争蹂躏的土地带来和平的故事。他们在为他欢呼。一想到要让他们失望，他就觉得胸口裂开了一个洞。\n\n不过，是时候了。米哈伊尔站了起来，悄悄地扣上了他朴素的外套。他尽了自己的一份力量，至少帮助为世界的这个角落带来了稳定。现在轮到人民掌权了。深吸一口气，沙皇米哈伊尔·罗曼诺夫最后一次离开了皇宫。"
 regionalunification_diplo.4.a:0 "愿白军的遗产得到公正对待。"
 regionalunification_diplo.5.t:0 "归降的白军"
 regionalunification_diplo.5.desc:0 "在他的办公桌前，谢普诺夫突然从睡梦中惊醒，他的身体前倾，及时抓住自己，避免了撞击。立即，他责备自己 - 无论如何，在岗位上打瞌睡都无法原谅，即使只是片刻。即使仔细审查所有广泛的外交协议、让步、条约变更和西伯利亚远东地区地位的改变，随着完全的吞并，页码是多少来着，276页吗？\n\n明天。\n\n谢普诺夫模糊地记得坚持亲自审查，以确保足够的防范措施来对抗俄罗斯真正的癌症 - 波尔什维主义，作为一场宣传噱头。也许那是几个月前的特定文件？他紧紧闭上双眼 - 这些日子都模糊在一起了。\n\n就在他个人办公室的私密空间里，谢普诺夫稍微放松了一下面具，深深地叹了口气。他不想这样。签署授权俄罗斯重新恢复昔日荣耀的最好机会吗？他一定疯了。那天，他去找他的私人小团体，在白军和新的摄政王的胜利中开心地喝酒作乐，他本以为他们会嘲笑自由主义者和他们提出的外交统一的提议。\n\n想象一下，当他们的脸庞，他曾经稍微信任过的所有人的脸庞，从漠不关心的笑容变成不舒服的目光和尴尬的凝视时，他是多么惊讶。也许，如果那天他能更加控制自己的情绪，他的头脑就会做出艰难但无疑是正确的决定，拒绝那些傻瓜。\n\n自由主义者是几十年前第一个背叛帝国的人。他们击败了白军的抵抗。他们让俄罗斯受到苏联的感染，这让人民陷入困境。然而，谢普诺夫可以读懂现场的气氛。他甚至在新政府中给自己和他的朋友找到了一些舒适的职位。也许从那里，抵抗力量可以再次壮大。也许一旦自由主义者不可避免地失败，并且俄罗斯人民意识到唯一真正的解脱在于真正的强人，他的运动可能会再次兴起。"
 regionalunification_diplo.5.a:0 "谢普诺夫暗自咒骂了一声，又继续看书了。"