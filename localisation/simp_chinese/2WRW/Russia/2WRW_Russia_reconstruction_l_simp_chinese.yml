 RUS_commie_reconstruct_baltic_desc: "波罗的海的浪花，曾拍打着德意志鹰爪的阴影四十年之久。如今，那令人窒息的阴霾终于被红旗撕裂，但这片土地早已伤痕累累。里加古老的尖塔默默诉说着屈辱，塔林的街道依稀残留着恐惧，维尔纽斯的森林深处仍潜藏着旧时代的鬼魅。重建波罗的海，绝非仅仅修复几栋建筑、重开几家工厂那么简单。这是一场灵魂的再造，是在瓦砾之上重新播种希望与认同的艰巨工程。我们要做的，不仅仅是驱逐过去的幽灵，更是要在这片饱经风霜的土地上，奠定一个崭新、繁荣、且真正属于人民的未来。这，将是新俄罗斯向西眺望的第一扇窗口。"
 RUS_commie_fishing_here_desc: "冰冷的波罗的海深处，蕴藏着足以滋养一方人民的慷慨馈赠。鲱鱼成群结队，如同流动的银色矿脉；鳕鱼潜伏深海，等待着经验丰富的渔夫投下诱饵；还有那珍贵的鳗鱼和比目鱼，曾是纳粹餐桌上的佳肴，如今终将回到它们真正的主人手中。这里的渔民，世代以海为生，他们的双手粗糙却灵巧，他们的眼神深邃而坚韧。开发这丰富的渔业资源，不仅能极大缓解国家的粮食压力，更能让沿海的村镇重新焕发生机，让中断已久的传统得以延续。波涛之下，是俄罗斯复兴的潜力之一。"
 RUS_commie_baltic_fishing_area_desc: "大海的馈赠并非取之不尽。无序的捕捞只会带来短暂的繁荣和长久的枯竭。为了可持续地利用这份宝贵的财富，我们必须建立现代化的“波罗的渔业区”管理体系。这需要科学地评估各种鱼类的储量，划定禁渔期和禁渔区，推广更先进、更环保的捕捞技术，并建立起从捕捞、加工到销售的完整产业链。我们将投资建设现代化的渔港和冷链物流，扶持渔业合作社的发展，并严厉打击非法捕捞行为。让波罗的海的渔业，成为俄罗斯可持续发展的典范，而不是下一个被耗尽的宝藏。"
 RUS_commie_fish_days_desc: "为了让全国人民都能分享到波罗的海的馈赠，也为了…呃…更有效地规划我们的粮食分配体系，一个充满智慧的决策应运而生：“每周鱼日”！没错，每周指定一天，全国各地的食堂、餐馆乃至家庭，都要以鱼类作为主菜。宣传部门将大力推广鱼肉的营养价值和烹饪方法，渔业部门则要确保在这一天有充足、平价的鱼类供应。这不仅有助于改善国民营养结构，培养健康的饮食习惯，还能极大地刺激波罗的海渔业的发展。至于那些抱怨鱼刺太多或者口味单一的人？告诉他们，这是为了国家，而且鱼肉对大脑有好处！"
 RUS_commie_touring_here_desc: "当硝烟散尽，波罗的海沿岸展露出她独特的魅力。里加汉萨同盟时期的辉煌遗迹，塔林中世纪的古朴城墙，还有那些散落在海岸线上、拥有白色沙滩和茂密松林的宁静小镇……这片土地不仅有丰富的历史文化，更有迷人的自然风光。是时候将这颗蒙尘的明珠擦亮，向俄罗斯乃至全世界的游客发出邀请了！“快来这里旅游！”我们将修复历史建筑，改善旅游基础设施，开发具有特色的旅游线路和产品，并进行广泛的宣传推广。旅游业的兴起，不仅能带来可观的经济收入，更能促进不同地区人民的交流与理解，展示一个开放、自信、充满活力的新俄罗斯形象。"
 RUS_commie_riga_city_desc: "里加，这座曾经的汉萨女王，波罗的海跳动的心脏。她见证了条顿骑士的铁蹄，瑞典国王的雄心，俄罗斯帝国的扩张，以及德意志长达四十年的黑暗统治。她的街道由鹅卵石铺就，记录着历史的足迹；她的教堂尖顶高耸入云，似乎仍在向上帝祈祷；她的新艺术风格建筑，则无声地诉说着黄金时代的优雅与繁华。如今，解放的旗帜再次飘扬在里加上空，但这座城市也背负着沉重的伤痕。重建里加，不仅是修复物理的建筑，更是修复历史的记忆，唤醒沉睡的文化灵魂。我们要让她重现昔日“北方巴黎”的风采，成为连接俄罗斯与欧洲的重要枢纽，成为新时代波罗的海最璀璨的明珠。"
 RUS_commie_fourty_years_tyranny_desc: "整整四十年，纳粹的铁蹄践踏着波罗的海的土地，万字符的阴影笼罩着这里的每一个角落。他们不仅掠夺资源，压榨劳力，更试图从精神上奴役这里的人民，强制推行日耳曼化，抹杀本地的语言和文化，制造民族对立与仇恨。合作者如豺狼般助纣为虐，抵抗者在森林和地下英勇斗争，无数无辜的生命在恐怖统治下凋零。这段黑暗的历史绝不能被遗忘，更不能被粉饰。我们必须彻底清算纳粹及其帮凶犯下的滔天罪行，揭露其暴政的本质，让人民永远铭记这段屈辱与抗争的历史。只有正视过去的伤痛，才能避免悲剧的重演，才能真正走向光明的未来。"
 RUS_commie_clean_forest_brothers_desc: "并非所有拿起武器抵抗纳粹的人，都欢迎新旗帜的到来。在波罗的海茂密的森林深处，一些被称为“森林兄弟”的武装团体依然在活动。他们成分复杂，既有过去的民族主义者、地主富农，也有对新政权不满者，甚至混杂着一些不愿放下武器的旧军人。他们利用熟悉的森林地形，进行着零星的袭击、破坏和宣传活动，成为地区稳定的隐患。对于这些拒绝放下武器、继续与人民为敌的顽固分子，我们不能心慈手软。必须组织精锐力量，结合军事清剿与政治争取，彻底瓦解他们的组织，肃清其影响。森林应该属于伐木工人和采蘑菇的姑娘，而不是藏匿武装匪徒的巢穴。"
 RUS_commie_clean_nazi_desc: "比“森林兄弟”更阴险、更残忍的，是那些纳粹德国败退时潜伏下来的死硬分子及其追随者，他们如同传说中的“狼人”，在暗处进行着破坏和恐怖活动，妄图颠覆新生的人民政权。他们袭击地方官员，破坏基础设施，散布恐慌谣言，甚至对普通民众施加暴力。对这些彻头彻尾的法西斯残渣余孽，绝不能有任何幻想和姑息。国家安全部门必须动用一切手段，精准锁定目标，以雷霆之势将其彻底粉碎。情报渗透、定点清除、公开审判、严厉镇压……要让这些潜伏的毒蛇无处藏身，让他们在人民战争的汪洋大海中彻底覆灭。俄罗斯的土地上，不容许纳粹的幽灵继续徘徊。"
 RUS_commie_rebuild_identity_desc: "长期的异族统治和刻意的民族分化政策，使得波罗的海地区各民族之间的关系变得复杂而微妙，也使得当地俄罗斯族居民的身份认同受到了冲击。我们既要尊重拉脱维亚、爱沙尼亚、立陶宛等民族的历史文化和语言权利，避免重蹈大俄罗斯沙文主义的覆辙；同时，也要重新强化该地区与俄罗斯本土在历史、文化和情感上的联系，巩固当地俄罗斯族居民对统一国家和主流文化的认同感。这需要智慧和耐心，要通过教育、文化交流、媒体宣传等多种方式，润物细无声地进行。目标是构建一种既尊重多元，又拥有强大向心力的、健康的国家认同。"
 RUS_commie_you_are_freedom_nations_civ_desc: "解放的不仅仅是土地，更是思想。在经历了长期的压迫和扭曲宣传后，波罗的海的人民需要重新认识“自由”的含义，重新理解“公民”的权利与义务。我们的宣传和教育工作，核心就是要告诉他们：你们不再是二等公民，不再是任人宰割的羔羊，你们是新俄罗斯这个自由国度的平等子民！你们拥有选举的权利，言论的自由，信仰的保障；你们拥有劳动的尊严，受教育的机会，追求幸福的可能。当然，自由也意味着责任——遵守法律，尊重他人，积极参与国家建设。让自由的理念深入人心，成为新社会最坚实的思想基础。"
 RUS_commie_industry_in_baltic_desc: "波罗的海地区并非只有渔港和沙滩，这里也曾拥有一定的工业基础，特别是在船舶修造、机械加工、轻工纺织等领域。战争摧毁了许多，但也留下了可以修复和利用的底子。我们必须将恢复和发展波罗的海工业作为区域重建的重要支柱。第一步是盘点现有的工业设施和技术工人，修复被破坏的厂房和设备。然后，根据本地的资源禀赋、地理优势和市场需求，制定合理的工业发展规划。要避免盲目追求大而全，而是要有所侧重，发展具有比较优势的特色产业。让波罗的海的工业重新轰鸣起来，为区域经济注入强劲动力。"
 RUS_commie_centrize_industry_desc: "市场有其活力，但有时也需要国家意志的引导，特别是在百废待兴的重建初期。为了更高效地利用有限的资源，加速关键产业的恢复和发展，我们将对波罗的海地区的工业进行一定程度的“集中化”管理。这可能包括：将同类或关联的企业进行合并重组，形成规模效应；由国家主导投资建设一些对区域经济具有战略意义的大型项目（如港口扩建、能源设施）；建立区域性的工业协调机构，引导产业布局和资源配置。当然，“集中”不等于僵化，必须尊重市场规律，避免重蹈旧苏联计划经济的覆辙，但在关键时刻，国家的手必须强劲有力。"
 RUS_commie_baltic_navy_base_desc: "波罗的海不仅是重要的经济区域，更是俄罗斯面向西方的战略前沿。控制波罗的海的出海口，拥有一个强大的海军基地，对于维护国家安全、保障海上通道畅通、以及向欧洲投射影响力至关重要。历史上，彼得大帝正是为了夺取波罗的海的出海口而迁都圣彼得堡。如今，我们将重新启用或新建（视情况而定）位于波罗的海沿岸的军港，对其进行现代化改造，提升其停泊、维修、补给大型舰艇的能力。这里将成为俄罗斯波罗的海舰队的坚固堡垒，守护着国家的西部门户，也时刻提醒着那些潜在的对手，俄罗斯海军的雄风从未远去。"
 RUS_commie_baltic_tour_city_desc: "阳光、沙滩、古堡、琥珀……波罗的海拥有发展旅游业得天独厚的条件。我们要精心挑选几个最具潜力的沿海城市或小镇，例如历史悠久的里加、塔林，或者风景优美的尤尔马拉、斯韦特洛戈尔斯克等地，将其打造成为国际知名的“波罗的旅游城市”。这需要系统性的投入：修复和保护历史文化遗产；建设高品质的度假酒店、疗养院和娱乐设施；改善交通连接，提升旅游服务水平；并进行有针对性的市场营销。我们要让这些城市不仅成为俄罗斯人度假休闲的好去处，更能吸引来自欧洲乃至全世界的游客，让旅游业成为拉动区域经济、促进文化交流的新引擎。"
 RUS_commie_take_baltic_to_home_desc: "从战争的废墟到重建的工地，从压迫的记忆到自由的呼吸，波罗的海地区走过了一段艰难而光荣的历程。如今，渔船重新扬帆，工厂机器轰鸣，古老的城市焕发新生，人民的脸上写满了对未来的憧憬。纳粹的残余被扫除，民族的认同得以重建，经济的活力正在迸发。虽然重建的任务远未结束，前方的道路依然漫长，但我们可以自豪地宣告：波罗的海的重建工作取得了决定性的胜利！这片美丽的土地已经重新融入了俄罗斯大家庭，并必将为国家的整体繁荣做出重要贡献。向所有为波罗的海新生付出血汗的人们致敬！"


 RUS_commie_oh_mother_russia: "祖国俄罗斯，"
 RUS_commie_union_and_strong: "统一而强大！"
 RUS_commie_oh_mother_russia_desc: "她承受了太多苦难，她的面容被战火与严寒刻满了皱纹，她的孩子们曾流离失所，在绝望中寻找微光。从涅瓦河的薄冰到阿穆尔河的波涛，从高加索的雪峰到西伯利亚的林海，这片土地沉默地见证了所有的牺牲与坚韧。她的人民，在废墟上播种，在黑暗中歌唱，用粗糙的双手，重新托起了她的脊梁。祖国俄罗斯，她不仅仅是一片疆域…"
 RUS_commie_union_and_strong_desc: "…她是无数颗心的汇聚，是历经淬炼后的钢铁意志，是在绝望尽头重新点燃的希望之火。曾经的隔阂已化为连接彼此的桥梁，昔日的创伤正结出坚韧的勋章。当伏尔加河的流水与叶尼塞河的波涛同声歌唱，当克里姆林宫的红星与边疆哨所的灯火交相辉映，一个团结的俄罗斯，正以不可阻挡之势，重新走向伟大。这伟大，属于每一个为她流过血、洒过汗、从未放弃过的儿女。她就在这里，我们的人民之中。"

