 RUS_commie_reconstruct_belarus_desc: "白俄罗斯，在数十载残酷的法西斯占领与战争蹂躏下几近枯竭，亟待立即且系统性的重建。此初步计划旨在全面评估损失，修复包括能源、交通与通讯在内的关键基础设施，并动员地方劳动力及幸存的行政骨干。中央规划将指导初期资源的分配，优先保障社会稳定与基本民生需求。在真正的复苏开始之前，必须奠定坚实的基础。任务之艰巨，资源之匮乏毋庸置疑，然则，此项工作刻不容缓。"
 RUS_commie_front_line_to_german_desc: "被解放的白俄罗斯并非宁静的腹地；她是国家削尖的西部利刃，是抵御任何未来条顿野心的堡垒。其地理位置决定了她作为最前沿阵地的战略宿命。自此，白俄罗斯内的所有重建、基建发展与军事规划，都必须从其作为防御缓冲地带及潜在跳板的至高重要性出发。枕戈待旦并非权宜之计，而是国家在西方阴影下生存的保证。"
 RUS_commie_beautiful_land_desc: "白俄罗斯的森林、沼泽与河流，纵然饱受创伤，却蕴藏着一种坚韧的美丽。这片被战争摧残却未曾屈服的自然景观所提供的，远不止慰藉；它更蕴藏着对重建至关重要的资源——木材、泥炭，或许还有更多。在承认这片土地对于重建民族士气所具有的美学与精神价值的同时，我们亦须以可持续发展的规划来利用其资源。平衡保护与复苏的迫切需求，构成了这项工作的核心。"
 RUS_commie_must_be_never_invade_desc: "伟大的卫国战争所带来的灾难，尤其是在白俄罗斯留下的创伤，赋予我们一条绝对的、不容置疑的训令——决不重蹈覆辙。此原则超越寻常政策；它是我国国策、边境防御、军事戒备以及向人民要求必要牺牲的根本理由。每一项决策都必须以此誓言为衡量标准。毫无准备即是叛国。软弱招致侵略。西部边境必须坚不可摧。"
 RUS_commie_protect_the_country_desc: "保卫白俄罗斯与保卫整个俄罗斯国家整体密不可分。此指令将国家资源专门导向加固白俄罗斯以抵御攻击。关键行动包括升级白俄罗斯境内的军事基地和后勤枢纽，确保地方国土防御单位与正规军的无缝整合，提升国境内的战略机动性，并强化政治军事教育，以保证驻扎在这片关键土地上的所有人员拥有不可动摇的决心。白俄罗斯必将被守卫，寸土不让。"
 RUS_commie_the_bunker_line_desc: "消极防御不足以应对威胁。一个分层、综合的防御工事体系——“前线要塞群”——将在白俄罗斯的西部通道上建立。该网络包括钢筋混凝土掩体、反坦克障碍、预设炮兵阵地及加固指挥所，均按现代军事工程标准建造。其目的在于引导、迟滞并最大限度地杀伤任何侵略者，将边境地带转变为一道令人生畏的防御屏障。对混凝土与钢铁的投资，即是对国家安全的投资。"
 RUS_commie_the_military_must_be_prepared_desc: "鉴于白俄罗斯的地缘战略位置及来自西方的持续威胁，优先保障武装力量需求的政策被认为是至关重要的。资源、工业产能及科研力量将首先被导向满足国防需求。尽管保障民生福祉仍是目标之一，但由强大且装备精良的军队所保障的国家绝对安全，必须成为国家努力的首要焦点。盾牌的坚固程度，决定了其所保护之一切的安全。"
 RUS_commie_first_shot_in_war_desc: "伟大的卫国战争的首次冲击始于此地，始于白俄罗斯的土地，这是关于战略突袭后果的残酷教训。重提“第一枪”并非沉湎于历史的哀伤，而是持续的行动警示。它强调了永久警惕、前沿防御和强大情报搜集的必要性。我们的防御工事、部队部署以及整体防御态势，其设计宗旨明确在于确保下一次的“第一枪”，若其不幸来临，将遭遇到截然不同的回应。"
 RUS_commie_always_preparing_desc: "潜在威胁的邻近，要求的不仅仅是常备军；它要求整个社会时刻准备防御。时刻准备着。该原则将军事戒备与民防措施、工业动员计划及公众意识宣传相结合。从工厂演习到学校疏散计划，从预备役部队征召到维持战略储备，整个白俄罗斯必须存在于一种纪律严明的戒备状态，能够即刻转换以应对任何挑战。警惕是我们的口号。"
 RUS_commie_animal_husbandry_in_here_desc: "数十年的冲突已将白俄罗斯的农业蹂躏殆尽，牲畜数量锐减至危急水平。重建畜牧业不仅是一项经济目标，更是保障国家粮食安全与农村稳定的先决条件。本计划将建立国家对繁育项目、兽医服务及饲料分配的监管。初期重点在于恢复基础的奶牛与肉畜种群，为未来的扩张与自给自足打下根基。前路漫漫，但田野必须再次回荡起健康牲畜的声音。"
 RUS_commie_scale_up_desc: "基础工作既已完成，白俄罗斯的畜牧部门现须进行大规模扩张，以满足全国需求。国家投资将集中于扩大繁育中心、引进经科学筛选的高产品种，并发展工业化规模的饲料生产设施。土地改良项目将增加牧场面积。目标是超越恢复，实现盈余，将白俄罗斯苏维埃社会主义共和国建设为关键的农业重镇，确保为工人与士兵提供稳定的蛋白质来源。效率与规模，乃是新时期的箴言。"
 RUS_commie_centrize_husbandry_desc: "为最大化产出并确保资源的有效分配，白俄罗斯的畜牧业必须走向集中化。规模较小、效率低下的单位将被整合进更大的、专业化的国营农场或高级集体农庄。此举将促进现代技术的应用、实现饲料与兽医服务的规模经济效应，并实施标准化的质量控制。中央计划将引导生产方向，服务于国家优先事项，确保畜牧部门以最优效率满足更广泛的经济及国防需求。"
 RUS_commie_modernize_husbandry_desc: "提升白俄罗斯的畜牧业水平，需要拥抱现代科技与科学管理。此计划着重于广泛的农场电气化、自动化挤奶系统的部署、科学优化饲料方案的实施，以及先进的预防性兽医体系。目标在于彻底提高单位动物及单位劳动力的生产率，降低疾病发生率，并实现产品质量标准化，将农场转变为计划经济体系中的高效节点。"
 RUS_commie_wealth_in_belarus_desc: "白俄罗斯的土地所蕴藏的，远不止土壤与木材。大量的钾盐矿藏、广阔的泥炭沼泽以及其他潜在的矿产资源，构成了可观却未被充分开发的国家资产。系统性的地质勘探与国家管理的开采工业发展势在必行。通过计划性开采来利用“白俄罗斯的财富”，将为我们的工业提供必需的原材料，为我们的田野提供肥料，为我们的发电厂提供燃料，从而显著增强国家经济实力。"
 RUS_commie_new_minsk_desc: "明斯克的重建超越了简单的修复工作；它是在为重生的白俄罗斯塑造一个象征性的心脏，一个社会主义规划的典范。宽阔的林荫大道、宏伟的行政中心、配备现代化设施的标准化住宅区，以及一体化的绿地空间将取代战争的废墟。“新明斯克”将体现秩序、韧性以及国家建设的力量，成为我们有能力在法西斯毁灭的灰烬上构建更优越未来的有力证明。"
 RUS_commie_balance_develop_desc: "工业增长的迫切需求必须同农业稳定的基本需求进行审慎权衡。一项“平衡发展”的政策旨在通过细致的中央规划，协调工厂与田野的需求。投资优先级、资源流动及劳动力分配将被精心管理，以促进协同效应，防止工业与农业之间出现可能危及国家整体进步与社会和谐的严重失衡。理性的协调乃是关键。"
 RUS_commie_never_be_poor_desc: "贫困是昔日压迫与失败挥之不去的阴影。我们的国家庄严承诺——永不贫困。通过理性的经济规划、资源的公平分配、普及教育与医疗保健，以及提供有保障的住房，我们将系统性地在白俄罗斯根除赤贫。提高每一位公民的物质生活水平，不仅是人道主义目标，更是我们意识形态的核心原则及其成功的明证。"
 RUS_commie_museum_in_belarus_desc: "一个民族的身份认同，熔铸于其对过往的理解。建立一座权威的白俄罗斯国家历史博物馆，乃是政治上的必要之举。馆内将精心呈现官方叙事：法西斯占领之恐怖、游击队与解放者之无上英勇，以及统一领导下重建之持续胜利。法西斯主义的歧途与通敌者的叙事将被置于其应有的位置——叛国罪行的脚注。此机构将教育后代，巩固正确的历史意识。"
 RUS_commie_remember_the_war_desc: "伟大的卫国战争不只是历史；它是决定性的经历，是我们浴火重生斗争的神圣创世神话。它的记忆必须被积极培育，并永久烙印在民族的灵魂深处。纪念碑将耸立，教科书将详述英雄主义与牺牲，纪念日将被庄严遵守。这种集体性的纪念服务于一个至关重要的目的：熔铸团结，为当下的牺牲正名，坚定对抗外部威胁的决心，并确保以鲜血换来的教训永不被遗忘。"
 RUS_commie_natural_protect_zone_desc: "白俄罗斯独特的生态系统，特别是像别洛韦日原始森林这样的古老林地，代表着必须加以保护的自然遗产。建立国家控制的自然保护区将保护濒危物种，维护关键的水源地，并为科学研究创造受控环境。此外，这些保护区亦可作为战略资源储备库及负责任的管理的潜在展示窗口，彰显超越短期工业需求的远见。妥善管理的保护，是对国家长远健康与声望的投资。"
 RUS_commie_shiny_new_belarus_desc: "仅仅满足功能性需求是不够的；白俄罗斯必须力争成为一个典范——一个“闪耀的白俄罗斯”，向国内外观众展示社会主义规划与坚韧精神的优越性。有针对性的投资将追求在关键领域实现可见的卓越：新明斯克的模范城市规划、高产的示范农场、高效的工业企业、繁荣的（国家认可的）文化机构，以及显著提升的生活水平。地处西部边陲，一个繁荣有序的白俄罗斯本身就是强有力的意识形态宣言，是我们制度优越性的明证。"
 RUS_commie_great_new_belarus_desc: "在俄罗斯大家庭内部，白俄罗斯拥有其独特的苦难、抵抗与成就的历史。培养对“伟大的白俄罗斯”的自豪感——强调其游击队的光荣传统、其重建的成功、其文化的贡献及其战略重要性——旨在强化共和国及其人民对共同事业的承诺。在更大的国家框架内审慎地推广这种独特的身份认同，可以培养忠诚，并巩固白俄罗斯作为整体重要且受人尊敬的一部分的角色。"
 RUS_commie_take_belarus_to_home_desc: "从几近彻底的毁灭中重建白俄罗斯的巨大工程，需要的远不止资源与劳力；它需要一种集体的“信仰一跃”。相信破碎的生命能够弥合，相信倾颓的城市能够复兴，相信未来所拥有的，不仅仅是过往苦难的回响。完成这一阶段的重建，标志的不仅仅是物质上的进步，更是那份信仰的证明。它象征着一个深刻的心理转折点——从生存到复兴，拥抱一个安全且更光明之未来的可能性。"

