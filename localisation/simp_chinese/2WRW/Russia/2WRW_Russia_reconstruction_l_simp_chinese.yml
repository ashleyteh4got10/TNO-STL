 RUS_commie_reconstruct_moscow_desc: "莫斯科，不仅仅是一座城市，她是俄罗斯的心脏，是历史的见证者，是无数次抵御外侮、又无数次浴火重生的象征。当纳粹的铁蹄曾践踏红场，当克里姆林宫的红星蒙上阴影，整个国家都感受到了刺骨的寒意。如今，统一的旗帜重新在俄罗斯大地上飘扬，重建国家的事业必须从修复这个伟大的心脏开始。“来自克里姆林宫的呼唤”不仅仅是修复建筑，更是修复民族的尊严和自信。我们将以最大的决心和资源，让这座英雄的城市重现昔日的光辉，让克里姆林宫的钟声再次敲响和平与繁荣的时代强音。莫斯科的复兴，将是整个俄罗斯复兴的号角。"
 RUS_commie_from_city_to_rural_desc: "莫斯科的光芒，不应只照亮环城高速以内的区域。一个健康的首都，必须与其广阔的腹地紧密相连，相互滋养。我们将实施一项宏大的“从城市到乡村”战略，打破长期存在的城乡壁垒。这意味着：建设高效便捷的交通网络，将莫斯科与周边城镇紧密连接；将部分非核心功能有序疏解到周边地区；鼓励城市资本、技术和人才流向乡村，发展现代农业、乡村旅游和特色产业；并努力实现城乡在基础设施和公共服务方面的均等化。让莫斯科都市圈成为一个城乡融合、功能互补、共同繁荣的有机整体。"
 RUS_commie_all_mens_a_brothers_desc: "莫斯科历来是一座汇聚四方、包容多元的国际化都市。战火和隔绝或许暂时阻碍了这种交流，但重建的莫斯科必须重新张开臂膀，拥抱来自五湖四海的朋友。“四海之内皆兄弟”，我们将努力恢复和拓展莫斯科的国际交往功能：修复和扩建国际机场和火车站，简化签证和出入境手续；鼓励外国企业在莫斯科设立分支机构或地区总部；支持大学和科研机构开展国际合作与交流；举办大型国际会议、展览和文化体育活动；营造一个开放、友好、便利的国际化环境。让莫斯科不仅是俄罗斯的首都，更要成为连接东西方、促进世界理解与合作的重要舞台。"
 RUS_commie_modernize_moscow_desc: "古老的克里姆林宫红墙和崭新的摩天大楼，应该在这座城市和谐共存。现代化的莫斯科，绝不能仅仅满足于恢复旧观，更要面向未来，拥抱最新的科技和理念。这意味着：要用最先进的技术升级城市的基础设施，例如建设智能交通系统，优化交通流量；推广应用清洁能源和节能技术，打造绿色低碳城市；利用信息技术提升城市管理和公共服务效率，例如建设“城市大脑”，提供一站式在线服务；规划建设布局合理、功能完善、环境宜人的现代化新区和科技园区。我们要让莫斯科不仅拥有厚重的历史底蕴，更展现出引领时代的现代魅力。"
 RUS_commie_arbat_desc: "如果说红场是莫斯科威严的心脏，那么阿尔巴特大街就是她充满艺术气息和生活情调的灵魂小巷。这条古老的街道见证了普希金的爱情，聆听过奥库扎瓦的吉他弹唱，也曾是无数艺术家、作家和知识分子流连忘返的场所。战火和萧条可能让这里一度黯淡，但它的精神从未死去。我们将精心修复阿尔巴特大街的历史建筑风貌，清理那些不协调的添建，重新铺设步行街面，鼓励有特色的小书店、咖啡馆、画廊、手工艺品店在这里重新开张，并为街头艺术家提供表演的空间。让阿尔巴特大街重拾昔日的浪漫与活力，成为莫斯科市民和游客体验独特文化氛围、享受悠闲时光的最佳去处。"
 RUS_commie_heal_the_pain_desc: "莫斯科保卫战的惨烈，纳粹占领时期的恐怖，以及随后漫长岁月里的匮乏与挣扎，给这座城市和她的人民留下了难以磨灭的伤痛——不仅是物质上的，更是精神上的。高楼大厦可以重建，但内心的创伤需要更长的时间和更细腻的方式来治愈。我们将大力支持心理健康服务体系的建设，为经历过战争创伤、失去亲人、或长期生活在恐惧压力下的人们提供专业的心理咨询和援助。同时，要鼓励社区组织开展各种形式的互助活动，让人们在彼此的关怀和倾诉中找到慰藉。公共空间的设计也要考虑疗愈功能，例如建设宁静的公园、纪念性的场所，引导人们在反思历史中获得平和。治愈伤痛，是为了让这座城市和她的人民能够更健康地走向未来。"
 RUS_commie_kill_the_nazi_desc: "解放莫斯科并非意味着战斗的结束。那些双手沾满人民鲜血的纳粹分子及其仆从，可能并未随着德军的败退而消失，他们可能潜伏在城市的阴暗角落，像毒蛇一样伺机反扑。他们或许隐藏身份，改名换姓，试图逃脱正义的审判；或许仍在秘密串联，散布谣言，进行破坏活动。我们绝不能允许这些人类的渣滓继续污染莫斯科的空气！国家安全部门将展开一场彻底的、持续的清剿行动，利用一切情报手段，追查每一个曾经犯下战争罪行、至今尚未伏法的纳粹余孽和叛国投敌分子。一旦查实，严惩不贷！要让他们知道，正义或许会迟到，但绝不会缺席。莫斯科，绝不容纳法西斯的残渣！"
 RUS_commie_there_is_lot_people_desc: "战争的蹂躏和经济的凋敝，使得莫斯科及其周边地区聚集了大量失去土地的农民、失业的工人、复员的士兵以及来自其他战区的难民。他们是战争的受害者，也是城市重建的潜在力量，但同时也给城市的管理和就业带来了巨大的压力。“这块土地上有很多人”，我们不能简单地将他们视为负担或问题，而应看到他们身上蕴藏的巨大的人力资源潜力。如何有效地组织、培训、安置这些人，将他们转化为推动城市复苏和发展的积极力量，是摆在我们面前的一项紧迫而艰巨的任务。"
 RUS_commie_let_them_in_factory_desc: "机器需要人来操作，流水线需要人来填充，城市建设的每一个环节都需要大量的劳动力。对于那些涌入莫斯科及其周边地区、缺乏一技之长的失地农民、失业工人和复员士兵来说，进入工厂或许是他们找到稳定工作、融入城市生活最直接、最有效的途径。我们将制定倾斜政策，鼓励新建和恢复生产的工厂优先招募这些群体；政府将与企业合作，提供必要的岗前培训，帮助他们掌握基本的工业技能；并可能通过一定的财政补贴，降低企业雇佣这些“新人”的成本。让机器的轰鸣声成为他们新生活的序曲。"
 RUS_commie_lots_places_need_them_desc: "不仅仅是工厂需要人手。莫斯科的重建是一项庞大的系统工程，几乎每一个领域都存在着巨大的劳动力缺口：修复被战火摧毁的房屋需要建筑工人；清理城市废墟、修复道路管网需要市政工人；恢复商业和服务业需要店员、服务员和运输工人；甚至维持社会治安和公共服务也需要补充大量基层人员。我们需要建立一个高效的劳动力市场信息平台和职业介绍体系，将这些庞大的人力资源，根据他们的意愿、能力和培训情况，引导到最需要他们的岗位上去。让每一个渴望工作的人都能找到自己的位置，为这座城市的复苏贡献力量。"
 RUS_commie_and_there_is_lots_wealth_desc: "莫斯科不仅是政治和文化中心，其周边地区同样蕴藏着可观的自然资源财富。虽然不像西伯利亚那样储量惊人，但这里的铁矿、泥炭、建筑材料等资源，对于支持首都圈的工业重建和城市建设至关重要。过去的无序开采或战争破坏可能使得这些资源的利用效率低下，甚至造成了环境问题。现在，我们必须对莫斯科周边的资源进行一次全面的、科学的普查和评估，摸清家底，并在此基础上制定可持续的开发利用规划。让这片土地下的财富，能够被合理、高效、环保地利用起来，服务于首都圈的长远发展。"
 RUS_commie_moscowien_resource_develop_desc: "基于对莫斯科周边资源的科学评估，我们将启动一项系统的“莫斯科资源开发计划”。该计划将明确各类资源的开发时序、规模和技术要求，强调资源节约和环境保护。例如，对于铁矿等基础矿产，要采用更先进的采选技术，提高资源回收率，并严格执行矿山复垦要求；对于泥炭资源，要兼顾能源利用和生态保护；对于丰富的建筑材料资源，要规范开采秩序，避免对环境造成破坏。同时，计划也要考虑资源的深加工和产业链延伸，提高附加值。目标是实现资源开发与环境保护的协调统一，为莫斯科都市圈提供稳定可靠的资源保障。"
 RUS_commie_reform_the_natural_desc: "自然并非总是慷慨的恩赐，有时它也会设置障碍。莫斯科周边的地形地貌、河流湖泊，既是宝贵的生态资源，也可能对城市发展和基础设施建设构成制约。例如，某些地区可能存在洪涝风险，需要修建堤坝、疏浚河道；某些地区可能土地贫瘠或盐碱化，需要进行土壤改良；某些重要的交通廊道可能被山丘或沼泽阻隔，需要开山架桥或排水。“改造自然”并非要与自然为敌，而是在尊重自然规律的前提下，运用科学技术手段，适度地调整和优化自然环境，使其更好地服务于人类生产生活的需要，同时尽可能降低对生态系统的负面影响。这需要审慎的论证和精心的施工。"
 RUS_commie_a_new_silicon_dreams_desc: "在世界的某些角落，以硅谷为代表的科技浪潮正在掀起一场深刻的革命。新俄罗斯决不能在这场竞赛中缺席。莫斯科及其周边地区拥有全国最集中的高等院校和科研机构，具备发展高科技产业的优越基础。我们将启动“新硅晶之梦”计划，目标是将莫斯科都市圈的一部分区域）打造成俄罗斯的“硅谷”。政府将提供极具吸引力的政策支持、建设一流的科研基础设施、并营造开放包容、鼓励创新的软环境，吸引国内外顶尖的半导体、计算机、软件、人工智能等领域的企业和人才在此集聚。让创新的火花在这里迸发，点亮俄罗斯的科技未来。"
 RUS_commie_sound_from_stalingrad_desc: "伏尔加格勒，这座以钢铁意志闻名的英雄城市，曾是苏维埃保卫战中最惨烈、也最光荣的象征。虽然在那个时间点上它最终陷落，但斯大林格勒保卫战的精神——坚韧不拔、寸土不让、直至最后胜利——已经深深烙印在俄罗斯民族的骨髓里。现在，当我们着手重建莫斯科，重建整个国家时，来自伏尔加格勒的声音穿越时空，激励着我们：无论困难多大，无论牺牲多重，我们都必须像当年的保卫者一样，拥有必胜的信念和钢铁般的意志。莫斯科的重建，不仅是物质的恢复，更是这种伟大精神的传承和弘扬。我们要让伏尔加格勒的精神，成为推动俄罗斯复兴的强大动力。"
 RUS_commie_voices_form_leningrad_desc: "圣彼得堡，这座承载着帝国荣光与革命记忆的城市，也曾在战火中遭受重创。列宁格勒围城战的悲壮，是另一段刻骨铭心的历史。如今，当莫斯科开始重建时，来自涅瓦河畔的呼喊也在提醒我们：我们不仅要恢复物质的繁华，更要珍视和传承俄罗斯丰富的文化艺术遗产。圣彼得堡是俄罗斯面向欧洲的窗口，是普希金、陀思妥耶夫斯基、柴可夫斯基的故乡。重建的莫斯科，同样应该成为一个充满文化魅力、艺术气息和思想活力的国际大都市。我们要修复历史建筑，重建博物馆、剧院和音乐厅，鼓励文学艺术的繁荣，加强与世界的文化交流。让莫斯科不仅成为政治和经济的中心，更要成为俄罗斯文化复兴的灯塔。"
 RUS_commie_history_should_be_remained_desc: "瓦砾可以被清理，建筑可以被重建，但历史的记忆不应被磨灭。莫斯科的每一寸土地，都承载着厚重的历史。从留里克王朝的奠基，到抵抗蒙古入侵的坚韧；从彼得大帝改革的雄心，到拿破仑兵败的寒冬；从十月革命的炮火，到卫国战争的悲壮……这些记忆，有辉煌，有苦难，有骄傲，也有伤痛，它们共同塑造了这座城市的性格，也塑造了俄罗斯民族的精神。我们必须以最大的敬畏之心，保护好那些幸存的历史遗迹，建立纪念馆和博物馆，整理和研究历史文献，并通过教育和公共活动，将这些真实、完整的历史记忆传承给子孙后代。忘记历史，就意味着背叛。只有铭记历史，才能更好地开创未来。"
 RUS_commie_country_industralize_desc: "在国家重建的初期阶段，面对资源有限、百废待兴的局面，适度的工业集中化或许是提高效率、加快恢复的必要手段。我们将优先支持那些对国民经济具有基础性、战略性作用的核心工业部门的恢复和发展。通过国家主导的投资、企业间的合并重组、以及区域性的产业规划，将有限的资金、技术和人才资源集中投向这些关键领域，尽快形成生产能力，保障国家经济运行的基本需求，并为后续更广泛的工业升级奠定基础。当然，这种集中必须是动态的和有选择的，要避免形成新的垄断和僵化。"
 RUS_commie_russia_economy_miracle_desc: "世界历史上，曾有一些国家在经历战争或灾难后，凭借着坚强的意志、正确的战略和人民的勤劳，在短时间内实现了经济的快速起飞，创造了所谓的“经济奇迹”。如今的俄罗斯，虽然起点艰难，但也拥有实现类似奇迹的潜力。统一的国内市场正在形成，压抑已久的生产力亟待释放，科技创新的火花开始闪现，融入全球经济的机遇也已出现。只要我们能够制定并坚持正确的改革开放政策，充分激发人民的创造力，有效利用国内国际两种资源、两个市场，那么，一个崭新的“俄罗斯经济奇迹”并非遥不可及的梦想。我们要为此目标而奋斗！"
 RUS_commie_the_seven_moscow_sisters_desc: "莫斯科的心脏正在重新有力地搏动，但一座伟大的首都，需要与之匹配的宏伟轮廓来昭示她的复兴。仅仅修复旧日的伤痕是不够的，我们需要新的丰碑，需要向世界宣告俄罗斯不仅回来了，而且将以更强大的姿态屹立。因此，一项前所未有的建设计划被提上议程：在莫斯科的关键节点，拔地而起七座风格统一、气势恢宏的摩天大楼。它们将不同于历史上任何时期的建筑，它们将是新俄罗斯力量、团结和现代化成就的象征。从伏尔加格勒的坚韧到圣彼得堡的优雅，这座城市吸取了所有过往的荣光与教训。这“七姐妹”将采用我们所能掌握的最先进的技术和材料，它们将不仅是办公或居住的空间，更是向天空伸出的、象征国家意志的七支巨臂，重新定义首都的天际线，让每一个仰望它们的人都能感受到这个重新统一、再次崛起的伟大国家的磅礴力量。这，将是献给新时代的七座纪念碑。"
 RUS_commie_take_moscow_to_home_desc: "从红场阅兵的雄壮军歌，到阿尔巴特街头艺人的低吟浅唱；从克里姆林宫的古老钟声，到地铁隧道里呼啸而过的列车；从新建摩天楼的玻璃幕墙反射的阳光，到流淌了千年的莫斯科河的粼粼波光……这座城市正在醒来，正在找回她失落已久的脉搏。伤痛或许尚未完全抚平，挑战依然横亘眼前，但莫斯科，这座承载了太多历史与希望的城市，终于再次昂首挺立，以坚韧而自信的姿态，宣告她的回归。工厂的烟囱重新升起炊烟，大学的课堂再次座无虚席，剧院的灯光重新点亮舞台。欢迎回家，莫斯科！欢迎回到所有热爱你的人民中间！你的复兴，就是俄罗斯的复兴！"
 RUS_commie_reconstruct_ukraine_desc: "基辅罗斯的荣光，哥萨克的传说，舍甫琴柯的诗篇，还有那广袤无垠、滋养了无数生命的黑土地……乌克兰，这片位于俄罗斯西南的沃土，不仅是斯拉夫文明的重要摇篮，更是欧洲地缘政治的棋盘和历代强权争夺的焦点。纳粹德国的占领和残酷剥削，给她带来了深重的灾难。如今，乌克兰重回母亲的怀抱，但百废待兴。启动“乌克兰重建计划”，绝不仅仅是修复战争的创伤，更是要尊重其独特的历史文化，释放其巨大的发展潜力，让她重新成为俄罗斯大家庭中富饶、美丽、充满活力的重要成员。"
 RUS_commie_ukraines_farm_desc: "当春风吹拂第聂伯河两岸，广袤的黑土地便会苏醒，展现出惊人的生命力。乌克兰素有“欧洲粮仓”的美誉，这里肥沃的土壤、充足的光照和适宜的气候，使其成为理想的农业生产基地。然而，多年的战乱、错误的政策以及落后的耕作技术，可能已经严重损害了这片土地的生产力。我们必须将恢复和振兴乌克兰农业作为重建的重中之重。这需要进行科学的土壤评估和修复，推广高产优质的作物品种，引进现代化的农业机械和耕作技术，完善农田水利设施，并建立高效的农产品加工、仓储和物流体系。让乌克兰的农田再次丰饶起来，不仅能保障俄罗斯的粮食安全，更能为整个欧洲大陆贡献力量。"
 RUS_commie_not_europe_uterus_desc: "历史的伤痛中，乌克兰曾屡次沦为外部势力倾销商品、掠夺资源、甚至输出劳动力的对象，仿佛只是一个被动的、缺乏主体性的“欧洲子宫”。这种依附性的地位，不仅损害了乌克兰的经济利益，更刺伤了其民族自尊心。新生的乌克兰，必须彻底摆脱这种不平等的宿命！我们要强调乌克兰的独立意志和主体地位，鼓励发展具有自主知识产权和核心竞争力的产业，培养本土的科技人才和企业家队伍，并在对外交往中争取更平等、更互利的地位。乌克兰不仅要贡献粮食和劳动力，更要贡献智慧、创新和独特的文化。她将是欧洲的重要一员，但绝不再是任人摆布的附庸。"
 RUS_commie_we_are_europes_granary_desc: "是的，我们拒绝成为“欧洲子宫”，但这并不意味着我们要放弃“欧洲粮仓”的荣耀与责任！恰恰相反，我们要通过现代化的农业革命，将乌克兰的农业潜力发挥到极致，让她名副其实地成为保障欧洲大陆粮食安全的中流砥柱。我们将大力投资农业科技研发，培育更高产、更优质、更能适应气候变化的作物品种；推广精准农业、节水灌溉等先进技术，提高资源利用效率；发展规模化、专业化的现代农场和合作社，提升生产效率；并建立符合国际标准的食品安全追溯体系，确保“乌克兰制造”的农产品享誉世界。一个丰饶、高效、绿色的乌克兰农业，将是其在新时代最闪亮的名片。"
 RUS_commie_cultivating_identity_desc: "在沙皇俄国、奥匈帝国、波兰立陶宛联邦、以及纳粹德国等不同势力的长期影响和分割下，乌克兰的民族文化认同呈现出复杂多元甚至撕裂的状态。重建工作不仅要关注经济，更要着力于凝聚人心，重塑积极健康的文化认同。一方面，要充分尊重和保护乌克兰语作为官方语言的地位，支持乌克兰文学、艺术、音乐、戏剧等传统文化的传承与发展，珍视舍甫琴柯等民族文化符号。另一方面，也要强调乌克兰文化与俄罗斯文化同属东斯拉夫文明的紧密联系和历史渊源，增进两族人民的相互理解与情感认同。目标是构建一种既保持自身特色，又融入俄罗斯大家庭的、自信而包容的文化认同。"
 RUS_commie_land_reform_desc: "土地是农民的命根子，也是社会关系的基础。乌克兰历史上复杂的土地所有权问题亟待解决。一场公正合理的土地改革，是赢得农民支持、稳定农村社会、发展现代农业的前提。改革的核心原则应该是保障耕者有其田，同时兼顾效率与公平。具体的路径可能包括：将过去被非法侵占的土地归还农民或集体；对现有土地进行重新确权登记；鼓励土地适度流转，发展家庭农场或合作社等适度规模经营；并建立健全的土地征用补偿机制。这场改革必须审慎推进，充分听取农民意愿，避免引发新的社会矛盾。"
 RUS_commie_farm_cooperatives_desc: "单打独斗的小农经济难以适应现代农业发展的要求。为了提高乌克兰农业的组织化程度和生产效率，我们将积极鼓励和支持农民自愿组建各种形式的农业合作社。这些合作社可以专注于不同的环节，例如：生产合作社，共同购买农资、使用大型机械、统一种植标准；供销合作社，统一收购、加工、仓储和销售农产品，提高议价能力；信用合作社，为社员提供便捷、低息的贷款服务；技术服务合作社，提供农技推广、病虫害防治等专业服务。政府将通过法律保障、财政补贴、税收优惠、人才培训等方式，为合作社的健康发展创造良好环境，使其成为连接小农户与大市场的桥梁。"
 RUS_commie_work_and_reward_desc: "无论是土地改革还是合作社，最终的目标都要落到让辛勤劳作的农民真正受益上来。过去的体制下，农民的劳动成果往往被以过低的价格强制收购，或者在层层流通环节中被盘剥殆尽，导致“丰产不丰收”。我们必须彻底改变这种状况，确保“劳有所得”。这意味着要建立更公平合理的农产品价格形成机制；要大力发展农产品期货市场，帮助农民规避价格风险；要减少不必要的流通环节，降低交易成本；要保障农民在合作社等组织中的民主权利和收益分配权。只有让农民看到实实在在的收益，他们才有持续投入、改善生产的积极性。"
 RUS_commie_commune_and_cooperatives_desc: "在鼓励发展农业合作社的同时，我们也要审慎对待历史上“公社”这一概念。旧苏联时期的集体农庄虽然在特定历史阶段发挥过作用，但也存在着产权不清、效率低下、挫伤农民积极性等严重弊端。新俄罗斯不应简单地复制这种模式。我们鼓励的“合作社”应以农民自愿联合、产权明晰、民主管理、按劳分配或按股分红为基本原则。而对于那些确实希望探索更深层次集体化的社区，可以在严格限定的范围内，在充分尊重成员意愿的前提下进行试点，但绝不能强制推行，更要警惕其演变成新的大锅饭和平均主义。"
 RUS_commie_colonize_eras_heritage_desc: "乌克兰的命运，长期受到外部强权的深刻影响。无论是沙皇俄国的统治，还是纳粹德国短暂但残酷的占领，都带有明显的“殖民”色彩——政治上的控制，经济上的掠夺，文化上的压制。这些“殖民时代的遗产”给乌克兰留下了复杂的创伤和后遗症：地区发展的不平衡，民族关系的紧张，甚至是一些深层次的社会心理问题。在重建过程中，我们必须正视并努力消除这些负面遗产的影响，真正尊重乌克兰的主体性，支持其走上独立自主、健康发展的道路。"
 RUS_commie_bread_baskets_desc: "“欧洲粮仓”、“面包篮”——这些称号既是荣耀，也曾是负担。当外部世界仅仅将乌克兰视为提供廉价粮食的基地时，其自身的工业化和多元化发展就可能受到抑制。新时代的乌克兰，当然要继续巩固和提升其作为重要粮食生产基地的地位，为保障俄罗斯乃至世界的粮食安全做出贡献。但这绝不意味着她只能扮演“面包篮”的角色。我们必须支持乌克兰发展高附加值的农产品加工业、现代化的食品工业、以及相关的生物技术和农业科技产业。让乌克兰不仅能生产面包，更能生产出制造面包的机器、改良面包的技术、以及推广面包的品牌。从单纯的“粮仓”升级为现代化的“农业强国”。"
 RUS_commie_kiev_city_desc: "作为基辅罗斯的发源地，作为乌克兰的首都，基辅是一座承载着千年历史荣光与沧桑的伟大城市。索菲亚大教堂的金顶见证了信仰的力量，赫列夏蒂克大街的栗树在战火中依然挺立。重建基辅，不仅是修复那些标志性的建筑，更是要让她焕发出符合其历史地位和未来潜力的崭新光彩。我们要科学规划城市空间，既保护好珍贵的历史文化街区，又要建设现代化的商务中心、科教园区和宜居社区；要大力发展基辅的优势产业，如信息技术、航空航天、文化创意等；要提升城市的基础设施水平和公共服务质量；并努力将基辅打造成为连接俄罗斯、欧洲乃至世界的区域性中心城市。让这座古老而年轻的城市，在新时代绽放出更加迷人的魅力。"
 RUS_commie_urbanization_ukraine_desc: "与俄罗斯其他地区类似，乌克兰也面临着城乡发展不平衡的问题。推动健康有序的城镇化，是乌克兰实现现代化的关键一环。我们不能只盯着基辅、哈尔科夫、顿涅茨克等少数几个大城市，更要关注广大的中小城镇和新兴的工业据点。要通过产业的合理布局和基础设施的延伸，带动这些城镇的发展，使其成为吸纳农村转移人口、承接产业转移、提供基本公共服务的重要载体。同时，要注重保持小城镇的特色和宜居性，避免“千城一面”。一个由大中小城市和小城镇协调发展的、网络化的城镇体系，才是乌克兰城镇化的理想图景。"
 RUS_commie_black_soil_desc: "覆盖乌克兰大部分地区的黑钙土，是世界上最肥沃的土壤之一，是大自然赐予的无价之宝。然而，长期不合理的耕作方式、水土流失以及气候变化等因素，可能正在威胁着这片“黑金”的健康。保护好乌克兰的黑土地资源，是保障其农业可持续发展的根本。我们将大力推广保护性耕作技术，例如少免耕、秸秆还田等，以增加土壤有机质，改善土壤结构；实施严格的水土保持工程，防治土壤侵蚀；科学施用化肥农药，发展有机农业；并加强对黑土地质量的监测和评估。像爱护眼睛一样爱护这片珍贵的黑土地，为子孙后代留下永续利用的良田。"
 RUS_commie_hydropower_in_dnipro_desc: "奔腾不息的第聂伯河是乌克兰的母亲河，也蕴藏着巨大的水力发电潜力。苏联时期修建的第聂伯河水电站曾是欧洲最大的水电站之一，是工业化的象征。战火可能对其造成了破坏，设备也可能已经老化。修复和升级现有的第聂伯河梯级水电站，并科学评估、适度开发新的水电资源，将是乌克兰能源发展的重要方向。水力发电不仅能提供清洁、可再生的电力，还能在防洪、灌溉、航运等方面发挥综合效益。当然，水电开发也必须充分考虑对生态环境的影响，做好移民安置工作，实现经济效益、社会效益和生态效益的统一。让第聂伯河的澎湃动力，再次照亮乌克兰。"
 RUS_commie_electricity_output_desc: "当乌克兰的水电和核电等能源项目逐步建成并产生富余电力时，将其出口到周边国家或地区，将成为一项重要的经济增长点和外交筹码。通过建设跨国输电线路，将乌克兰的清洁电力输送到能源结构紧张的邻国，不仅可以赚取宝贵的外汇收入，提升乌克兰在区域能源格局中的地位，还能在一定程度上促进区域能源合作和互联互通，甚至对地缘政治产生微妙的影响。让乌克兰不仅是“粮仓”，更能成为区域性的“动力源”。"
 RUS_commie_nuclear_station_in_zaporozhye_desc: "在能源需求日益增长而化石燃料引发的环境问题日益凸显的背景下，核能作为一种高效、清洁的能源形式，成为许多国家的重要选择。位于扎波罗热地区的核电站，如果能够安全、可靠地运行并进一步发展，将为乌克兰乃至整个俄罗斯南部提供强大的能源支撑。当然，核安全是核电发展的生命线，我们必须采用最先进的技术标准，建立最严格的监管体系，制定最完善的应急预案，确保核电站万无一失。在确保绝对安全的前提下，稳步发展核电，将是保障国家能源安全、优化能源结构的重要战略选择。"
 RUS_commie_fuck_you_nazi_desc: "“Und das heißt Erika!”——这首曾被纳粹士兵哼唱着的进行曲，如同梦魇般的回响，依然可能在乌克兰的某些角落、某些人的心中挥之不去。纳粹的占领不仅带来了物质的毁灭，更试图扭曲历史，散布种族主义和仇恨的毒素，扶植傀儡政权和合作者。对于这一切法西斯的污泥浊水，新生的乌克兰必须进行彻底的清洗和唾弃！我们要公开审判那些罪大恶极的纳粹战犯和乌克兰伪军头目；要在教育和宣传中彻底揭露纳粹意识形态的反动和罪恶；要清除公共场所所有纳粹和法西斯的标志与象征。让每一个乌克兰人都从心底里喊出：“去你的，纳粹！”与黑暗的过去做最彻底的切割。"
 RUS_commie_stop_exploit_farmers_desc: "历史上，乌克兰农民的命运往往是被剥削和被牺牲。无论是沙皇时期的地主，还是苏联时期过度提取农业剩余支援工业化的政策，都曾让这片土地上的耕耘者付出沉重代价。纳粹的掠夺更是雪上加霜。新俄罗斯框架下的乌克兰，必须彻底扭转这一历史惯性，真正将农民视为国家的主人翁和发展的基石。这意味着要保障农民的土地权利和经营自主权；建立公平合理的农产品价格机制和补贴体系，确保农民能够获得与其劳动付出相匹配的收益；加大对农村基础设施和公共服务的投入，改善农民的生产生活条件；并赋予农民在政治和经济生活中更多的话语权。绝不允许任何形式的、对农民的制度性剥削在新乌克兰重演。"
 RUS_commie_we_arent_nazi_desc: "在经历了纳粹残酷统治的创伤后，重建社会信任、弥合民族裂痕至关重要。然而，如果我们自己也采取了某些类似纳粹的行径——例如，对持不同政见者进行残酷镇压，对少数民族实行歧视政策，或者为了所谓的“国家利益”而牺牲个体权利——那么我们与曾经唾弃的敌人又有何异？我们必须时刻保持警惕，坚守民主、法治、人权的基本底线，用实际行动向乌克兰人民、向俄罗斯人民、向全世界证明：我们不是纳粹！我们与法西斯主义势不两立！我们的目标是建设一个自由、公正、包容的国家，而不是建立一个新的压迫体制。这是我们获得道义合法性的根本所在。"
 RUS_commie_ukraine_heavy_industry_desc: "除了肥沃的农田，乌克兰也拥有发展重工业的良好基础，特别是在顿巴斯地区的煤炭和冶金工业，以及哈尔科夫、第聂伯罗彼得罗夫斯克等地的机械制造和军工产业。虽然战火可能对其造成严重破坏，但这些工业遗产是乌克兰经济体系中不可或缺的重要组成部分。我们不能因为要发展农业就忽视重工业。重建计划必须包括对现有重工业企业的技术改造和升级，淘汰落后产能，发展更具附加值和技术含量的产品。同时，也要注意优化产业布局，避免过度集中带来的环境和安全风险。一个农工并举、协调发展的乌克兰，才是真正强大的乌克兰。"
 RUS_commie_azovstal_plant_desc: "马里乌波尔的亚速钢铁厂，这座苏联时期建设的钢铁巨兽，曾是乌克兰乃至整个联盟工业实力的象征。它的高炉曾喷吐着炽热的铁水，为国家建设和国防事业提供了源源不断的钢铁支撑。战火可能将其摧毁或重创，但它的名字本身，就代表着一种不屈的工业精神。我们必须将其重建！这不仅是为了恢复重要的钢铁产能，更是为了重振顿巴斯地区的工业雄风，更是为了向世界宣告乌克兰工业重新崛起的决心。重建的亚速钢铁厂，将采用更先进、更环保的技术，生产更高质量的钢材，它将再次成为乌克兰工业皇冠上的明珠，照亮国家复兴的道路。"
 RUS_commie_take_ukraine_to_home_desc: "田野重新披上金黄，工厂的烟囱再次升起烟雾，基辅的教堂钟声悠扬，第聂伯河的流水承载着新的希望。经过艰苦卓绝的努力，乌克兰正在从战争的创伤中慢慢康复，重新融入俄罗斯温暖的怀抱。土地回到了农民手中，合作社带来了新的活力，工业基地逐步恢复，文化认同在尊重与交流中凝聚。虽然前路依然漫长，挑战依然存在，但我们可以欣慰地说：乌克兰，这颗东斯拉夫文明的璀璨明珠，这片英雄辈出、饱经沧桑的土地，终于真正地“回家”了。她的未来，将与整个俄罗斯紧密相连，共同谱写繁荣与和平的新篇章。"
 RUS_commie_reconstruct_caucasus_desc: "雪山巍峨，峡谷纵深，民族众多，文化多元——高加索地区，这片连接欧亚大陆的战略要地，自古以来就是文明交汇、兵家必争之地。它拥有壮丽的自然风光，也蕴藏着丰富的矿产和油气资源。然而，复杂的民族构成、历史遗留的矛盾、以及可能的外部势力干预，也使得这里成为潜在的冲突爆发点。纳粹德国的占领更是加剧了这种不稳定。如今，高加索重归统一，启动全面的“高加索重建项目”刻不容缓。其目标不仅是恢复经济、改善民生，更要着力于促进民族和解、维护地区稳定、巩固国家统一。这需要极高的政治智慧和资源投入。"
 RUS_commie_the_resource_in_caucasus_desc: "高加索不仅有壮丽的风景，更是一座宝藏之地。巴库周边蕴藏着丰富的石油和天然气，是俄罗斯重要的能源基地之一；山区则富含多种有色金属矿产，如铜、钼、锰等，对工业发展至关重要；充沛的水力资源也为发展清洁能源提供了可能；独特的地理气候条件还孕育了优质的茶叶、水果和葡萄酒等农产品。过去，这些资源的开发可能受到技术、资金或政治因素的制约。现在，我们必须对高加索的各类资源进行系统性的勘探、评估和科学规划，制定可持续的开发战略，让这些沉睡的宝藏能够安全、高效、环保地转化为推动区域发展和国家繁荣的强大动力。"
 RUS_commie_sochi_tour_desc: "黑海之滨的索契，拥有宜人的亚热带气候、迷人的海滩、以及背后高加索雪山的壮丽景色，是俄罗斯乃至世界闻名的疗养和度假胜地。虽然战乱可能使其一度萧条，但其独特的旅游资源依然具有不可替代的吸引力。我们将把振兴索契旅游业作为高加索重建的重点之一。这意味着要修复和升级现有的酒店、疗养院、海滩等旅游设施；改善通往索契的交通；开发更多元化的旅游产品，例如山地滑雪、温泉疗养、生态徒步、文化体验等；并加强城市管理和旅游服务水平，提升游客体验。让索契重新成为黑海沿岸最耀眼的度假明珠，吸引源源不断的国内外游客。"
 RUS_commie_sochi_olympic_desc: "举办一次成功的奥运会，不仅能极大地提升一个城市乃至国家的国际形象和知名度，更能有力地带动基础设施建设、刺激经济增长、凝聚民族自豪感。既然索契拥有发展冬季运动的优越自然条件，并且正在经历大规模的重建和现代化改造，那么积极申办并成功承办1988年冬季奥林匹克运动会，将是一个绝佳的战略机遇！这将迫使我们按照国际最高标准，加速建设竞赛场馆、运动员村、交通通讯等配套设施；吸引全球媒体和游客的目光聚焦索契和新俄罗斯；并向世界展示我们重建家园、拥抱世界的决心和能力。当然，这需要巨大的投入和精心的组织，但其带来的长期回报将是不可估量的。"
 RUS_commie_the_baku_oil_desc: "里海西岸的巴库，是世界石油工业的发源地之一，其脚下的阿普歇伦半岛曾被称为“黑金之城”。这里的石油不仅储量丰富，而且品质优良。虽然经过长期的开采，陆上油田可能已近枯竭，但里海大陆架下依然蕴藏着巨大的潜力。恢复和扩大巴库地区的石油开采，对于保障俄罗斯的能源安全和获取宝贵的外汇收入至关重要。我们将引进更先进的勘探和开采技术，加大对里海油气资源的勘探开发力度；同时也要注重环境保护，防止石油泄漏对里海生态造成破坏；并考虑建设新的输油管道，将巴库的原油更高效地输送到国内市场或出口。让这座古老的石油城在新时代重放光芒。"
 RUS_commie_the_wealth_underground_desc: "除了世人瞩目的巴库石油，高加索的山脉和谷地之下，还埋藏着许多其他宝贵的矿产资源。北高加索的煤炭，格鲁吉亚的锰矿，亚美尼亚的铜钼矿，以及散布各处的铁矿、铅锌矿、金矿等等……这些“地底下的财富”是支撑高加索地区乃至整个俄罗斯工业发展的重要物质基础。我们需要组织力量，运用现代地质勘探技术，对高加索全境的矿产资源进行一次系统性的大普查，精确评估各类矿产的储量、品位和开采条件。在此基础上，制定科学合理的开发规划，明确开采的优先顺序、技术路径和环境标准。绝不能再像过去那样进行掠夺式、破坏性的开采。"
 RUS_commie_immigration_to_caucasus_desc: "高加索地区地广人稀，特别是一些山区和边境地带，劳动力资源相对短缺，这在一定程度上制约了当地经济社会的发展和国家边防的巩固。与此同时，可能存在大量失业或寻求更好发展机会的人口。因此，有计划、有组织地鼓励一部分人口向高加索地区移民，是一项可以考虑的政策选项。当然，这种移民必须是自愿的，并且要为移民提供必要的安置支持，例如提供土地或住房补贴、就业培训、子女教育等。同时，也要充分尊重当地原有居民的利益和文化，避免引发新的社会矛盾。通过合理的移民政策，可以优化人口布局，充实边疆，促进区域发展。"
 RUS_commie_caucasus_infrastructure_desc: "崎岖的地形和复杂的地质条件，使得高加索地区的基础设施建设长期滞后。交通不便，能源短缺，通讯落后……这些都严重制约了当地资源的开发和经济社会的发展。要让高加索真正融入国家发展大局，必须启动大规模的“高加索基建项目”。重点是：修建穿越山区、连接主要城镇和资源点的铁路和公路；建设新的水电站、输变电线路和油气管道，保障能源供应；普及现代化的通讯网络；并改善城镇的供水、排水、垃圾处理等市政设施。这将是一项投资巨大、工程艰巨的任务，但对于打通高加索发展的任督二脉至关重要。"
 RUS_commie_how_much_nazi_here_is_desc: "在高加索复杂的民族和历史背景下，纳粹德国的占领留下了极其恶劣的印记。他们不仅进行残酷的军事统治和经济掠夺，更常常利用民族矛盾，扶植一部分群体打压另一部分群体，制造了大量的血腥冲突和仇恨。在一些地区，甚至可能存在过直接与纳粹合作、参与迫害和屠杀的本地伪政权或武装力量。在重建过程中，我们必须对这段历史进行彻底的清算。要仔细甄别：谁是真正的纳粹合作者和战犯？谁是被胁迫或被欺骗的普通民众？谁又是坚持抵抗的英雄？对于前者，必须依法严惩；对于后者，则要给予公正的对待和必要的安抚。绝不能搞扩大化，制造新的冤案，但也不能姑息养奸，留下祸根。“你也是纳粹吗？”——这个问题的答案，必须以事实为依据，以法律为准绳。"
 RUS_commie_the_want_to_be_partisans_desc: "高加索的山林，自古以来就是各种反抗力量活动的理想场所。即使在国家重新统一之后，那些对新政权不满的旧势力残余、民族分裂分子、宗教极端分子、甚至是一些单纯的土匪武装，都可能利用复杂的地形和民族矛盾，继续进行武装抵抗，打起“游击战”。他们或许得不到大多数民众的支持，但他们的存在本身，就会对地区的稳定和发展构成持续的威胁。面对这种情况，单纯的军事围剿往往效果有限，甚至可能激化矛盾。我们需要采取综合性的策略：既要保持必要的军事压力，压缩其活动空间；也要加强情报工作，精准打击其头目和骨干；更要做好群众工作，争取民心，铲除其生存的土壤；并辅以政治谈判和招安，分化瓦解其内部。解决游击队问题，需要耐心和智慧。"
 RUS_commie_but_we_have_more_experience_desc: "是的，高加索的群山或许能藏匿游击队，但不要忘了，谁才是游击战和反游击战的真正祖师爷！从国内革命战争时期转战千里，到卫国战争时期在敌后燃起熊熊烽火，再到后来与各路军阀和分裂势力周旋，我们的人民军队积累了世界上最丰富的山地、森林和复杂环境下的作战经验。我们懂得如何发动群众，如何建立根据地，如何运用灵活机动的战术，如何进行政治攻心……面对那些在高加索山沟里负隅顽抗的小股敌人，我们有充分的信心和足够的手段来解决他们。“但我们更有经验”——这不仅仅是一句口号，更是基于历史和实力的自信宣告。"
 RUS_commie_kill_these_unstable_people_desc: "维护高加索地区的长期稳定，除了要打击武装的游击队，还必须清除那些在社会上散布分裂思想、煽动民族仇恨、组织非法活动的“不稳定分子”。这些人可能不是直接拿起武器的战士，但他们对社会秩序和国家统一的危害同样巨大，甚至更为隐蔽。国家安全部门需要加强对各类极端组织、非法宗教团体、以及接受境外势力资助的可疑NGO的监控和调查。对于那些证据确凿、触犯了法律的头面人物和骨干成员，要依法予以逮捕、起诉和惩处。当然，行动必须精准，严格区分思想问题和违法犯罪，避免冤假错案，但对于那些铁了心要破坏稳定、分裂国家的顽固分子，绝不能手软。"
 RUS_commie_how_much_coops_here_is_desc: "在任何被占领或处于动荡的地区，都会出现形形色色的“合作者”——有些人是为了荣华富贵，主动投靠敌人；有些人是为了苟且偷生，被迫做出违心的选择；还有些人则可能是在特定的历史条件下，出于某种“曲线救国”的复杂动机。对于高加索地区在过去出现的各类合作者，我们必须进行细致的甄别和区别对待。对于那些罪大恶极、民愤极大的战犯和俄奸，必须依法严惩。对于那些被胁迫、犯有较轻罪行、或者有悔改表现的人，则可以考虑给予宽大处理或教育改造的机会。关键在于查清事实，分清责任，争取团结大多数，孤立打击极少数。处理好合作者问题，是实现社会和解的重要一步。"
 RUS_commie_new_caucasus_desc: "一个摆脱了战争阴影、民族纷争和贫困落后的“新高加索”，应该是我们重建的最终目标。这个新高加索，应该是一个各民族和睦相处、相互尊重、共享发展成果的家园；应该是一个经济繁荣、社会稳定、生态优美、文化多元的区域；应该是一个与俄罗斯其他地区紧密联系、深度融合，同时又保持自身独特魅力的战略要地。为了实现这个目标，我们需要持续的投入，需要创新的政策，需要各民族人民的共同努力，更需要国家层面长远的战略眼光和坚定的政治意志。建设新高加索，功在当代，利在千秋。"
 RUS_commie_the_great_caucasus_desc: "高加索不仅应该是“新的”，更应该是“伟大的”！它的伟大，不仅在于其雄奇壮丽的自然风光和悠久灿烂的多元文化，更在于它在新俄罗斯国家版图中所扮演的独特而重要的角色。它可以成为连接欧亚大陆的桥梁和纽带，促进不同文明的交流互鉴；它可以成为国家重要的能源和战略资源基地，支撑国民经济的持续发展；它可以凭借其独特的旅游资源，吸引全球目光；更重要的是，它可以成为俄罗斯展示民族和谐、区域善治、开放自信形象的窗口。让高加索重新焕发出与生俱来的伟大光芒，这应该是我们为之奋斗的崇高愿景。"
 RUS_commie_take_caucasus_to_home_desc: "雪山依然矗立，河流仍在奔腾，但高加索的面貌已经焕然一新。石油钻井平台在里海矗立，现代化的公路铁路穿越群山，索契的海滩再次挤满了游客，巴库的街道重现繁华。更重要的是，民族间的猜忌与仇恨正在消弭，合作与发展的共识日益凝聚，稳定与安宁成为生活的主旋律。游击队的枪声沉寂了，合作者的阴影淡去了，贫困的枷锁正在被打破。高加索，这片曾饱受磨难的土地，终于凤凰涅槃，以崭新的姿态拥抱未来。我们可以满怀信心地宣告：高加索重建项目取得了决定性的成功！她已经牢牢地扎根于新俄罗斯的沃土，必将为国家的强盛贡献出自己独特而伟大的力量！"


