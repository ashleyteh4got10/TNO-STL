l_simp_chinese:
 RUS_commie_reconstruction: "祖国终归一统！"
 RUS_commie_reconstruction_desc: "我们成功了。\n\n不可一世的千年帝国被我们踩在了脚下，而祖国也夺回了她的最后一块拼图。昔日的小小军阀终于成为了俄罗斯母亲的合法继承者，俄罗斯人民用自己的勇气与牺牲，让全世界再无人能忽视我们的力量。\n\n现在，千千万万斯拉夫儿女回到了家乡，团结在一面旗帜之下，我们历遍艰辛，终于成为一个统一的同盟!"
 RUS_commie_no_time_to_wait: "时不我待"
 RUS_commie_no_time_to_wait_desc: "全国人民正在伟大的卫国战争的成就的鼓舞之下欢欣雀跃，我们的政府内部似乎也刮起了一股自满之风——当然，我们有理由这样，可是，我们不能停滞不前。俄罗斯的失业，动荡，流离失所和贫困远远没有解决。民族问题日益激化，白俄罗斯族，乌克兰族，爱沙尼亚、拉脱维亚、立陶宛、格鲁吉亚、阿塞拜疆等少数族裔的离心倾向日益增长，维持新收复地区治安的巨量支出困扰着我们的财政，数百万的日耳曼人仍然遗留在波罗的，高加索，西俄罗斯，白俄罗斯和乌克兰境内。而其中相当一部分已经通过纳粹们的肮脏手段成为了俄罗斯的一份子，如果我们不妥善处理这个问题，这将成为我们未来的巨大隐患。我们可不希望哪一天，我们境内的日耳曼人会暴起发难。"
 RUS_commie_independent_ssr: "独立而平等的联盟"
 RUS_commie_independent_ssr_desc: "我们是解放者，我们不是又一支披着光鲜亮丽的外衣的殖民者。我们应该承认我们的历史，民族问题自古以来便是俄罗斯政策的最大考虑因素之一，旧沙俄时期，俄罗斯的大部分土地都浸满了俄罗斯士兵和被侵略者的鲜血。在旧苏联治下，这种状况有所改观，然而他们仍然没有根本解决俄罗斯面对错综复杂，令人无法下手的民族矛盾，所以在布哈林苏联的中央权威崩溃后，这些被压制的少数民族便立刻拿起了武器，成为割据一方的土匪。\n\n我们不会重蹈他们的覆辙。德国人的暴政已经令原俄罗斯境内的人民受伤太多了。虽然俄罗斯人的处境绝不会比他们好，但是，我们仍然应该尊重他们的选择，让他们自己决定，是加入我们的国家、成为我们的一部分，还是自由独立，成为我们大家庭的一员。"
 RUS_commie_unity_and_strong_union: "团结而强大的联盟"
 RUS_commie_unity_and_strong_union_desc: "卫国战争只是我们阶段性的胜利——既然我们可以再一次收复失地，那么德国人同样有可能再一次打过白俄罗斯和立陶宛。即使这种可能性微乎其微，但我们绝不能放过任何一个威胁。与德国的边境将成为永久前线，那里的人民将被钢铁城墙保护起来，那里的下一代将再不会像二十年前他们的前辈那样，在德国的阴影下苟存人世。为了全体斯拉夫儿女的安全，这些少数民族的独立大业可以先放一放，更不用说，这些地方本就是我们的法理领土——只要我们能够处理好民族矛盾，尽量让反对派们不要过于喧闹，不会有什么大问题的。\n\n§W我们将更加团结，我们将更加强大!§!"
 RUS_commie_reconstruct_and_develop: "重建与发展"
 RUS_commie_reconstruct_and_develop_desc: "无论在什么样的社会，人们的追求始终都是让明天变得更好。尤其是对于百废待兴的俄罗斯来说，这种渴望更为强烈。我们赢得了伟大的卫国战争，但是，看看我们的人民，他们每天的劳动量已经达到了一个极限，而生产出来的东西并不会有多少用在他们自己的身上——产品必须拿去支援前线。尽管这是必要的牺牲，但是人民已经受了太多苦难，千千万万的棒小伙子倒在了黎明前夜，贫困和动荡卷土重来……\n\n毫无疑问，我们当前的首要任务是重建与发展。我们不仅需要恢复1975年以前的领土，也需要把新收复地区饱受摧残的人民从饥饿与痛苦中拯救出来。只要我们做的够好，一切困难都会迎刃而解，我们的人民也将获得喘息之机。"
