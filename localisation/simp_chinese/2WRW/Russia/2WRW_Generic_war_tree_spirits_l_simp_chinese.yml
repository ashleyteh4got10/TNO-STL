l_simp_chinese:
 RUS_The_Strength_of_Our_Nation: "国家的力量"
 RUS_The_Strength_of_Our_Nation_desc: "纵观历代，[RUS.GetAdjective]人民总是忍受了一次又一次的入侵。从拿破仑时代到第二次世界大战，[RUS.GetAdjective]人民一次又一次地经受住了对其国土的掠夺和蹂躏。然而，作为一个民族，我们始终坚定不移。我们抵制了外部势力瓦解我们民族意志的企图，并因此变得更加坚强。\n\n这场战争也不会例外。[RUSGetUniqueNameTitle]将坚定克敌；[RUS.GetAdjective]人民的力量将为我们带来胜利。我们不会停息，直到将大日耳曼国对东欧的统治化为历史，直到将大日耳曼国囚禁在其坟墓中腐朽。"
 RUS_Death_to_the_Germans: "德国人去死吧！"
 RUS_Death_to_the_Germans_desc: "这场战争不仅将决定我们民族的命运，也将决定我们敌人的命运。谁能取得胜利，谁就将成为欧亚大陆唯一的霸主，将对方抛入历史的垃圾堆。\n\n雅利安人种统治斯拉夫民族的时间太长了。每一名德国占领者都必须从我们的祖国彻底清除，我们应当恢复属于我们的领土，只让骄傲的[RUS.GetAdjective]掌管自己的土地。"
 RUS_The_Peoples_Strength: "人民的力量"
 RUS_The_Peoples_Strength_desc: "我们的宣传成功带来了庞大的劳动力，每天生产数千支枪械，不断壮大我们的军火库。再也不必依赖先辈们的装备。我们将依靠那些[RUS.GetAdjective]人民，保卫国家，抵御德国霸权！"
 RUS_March_of_Memories: "回忆之旅"
 RUS_March_of_Memories_desc: "前线上的每一位男女都将体验到几十年前他们的祖辈所经历的，只不过现在局势对我们更有利了。一股红色浪潮已经冲垮了帝国，没有任何减缓的迹象。巴巴罗萨行动的记忆仍然深深印在每个俄罗斯人的心中，年轻的士兵们下定决心要摧毁日耳曼尼亚的希特勒分子，为他们倒下的战友和同胞复仇。"
 RUS_An_Indomitable_Spirit: "不屈的精神"
 RUS_An_Indomitable_Spirit_desc: "只有在我们能够保持稳定的供应和物资流通的情况下，我们正义的战争才能取得胜利。虽然在统一后我们已经获得了大量的新兵，但在战时同样重要的是：工人们。\n\n工厂里的普通工人和战壕中的士兵一样发挥着重要作用。我们必须确保我们的工厂没有空缺职位。凭借工人们的毅力和钢铁般坚定的决心，我们将生产我们所需的一切物资，以使我们的国家摆脱任何威胁！"
 RUS_For_Freedom_and_Democracy: "为了自由和民主！"
 RUS_For_Freedom_and_Democracy_desc: "我们所追求的不仅是失去的领土，更是我们的存在自身。如果我们失败了，德国人必定会加倍确保我们永远没有机会再次复兴。我们正在全力以赴，为东欧数百万人的生命而战。\n\n在争取自由的斗争中，将有许多生命作出牺牲，但这些兄弟姐妹将为比他们自己更伟大的事物而献身。我们不仅是在为我们的国家而战，我们也是在为自由的名誉和暴政的终结而战。我们将要么自由，要么死亡！"
 RUS_The_Triumph_of_Our_Will: "意志的胜利"
 RUS_The_Triumph_of_Our_Will_desc: "很明显，德国人已经被元首的谎言蒙蔽了双眼，即使面对我们摧毁了束缚我们人民的枷锁的力量，他们仍然继续宣扬“雅利安至上”的谎言，而这谎言构建了他们的帝国。\n\n德国变得自满自大，认为斯拉夫种族注定要被他们的德国主人奴役。在我们对他们罪行的报复中，他们必须了解我们人民的力量。通过我们国家的意志，其工业、其劳动，以及其流淌的血汗，我们将从这场战争中脱颖而出，获得胜利。"
 RUS_A_War_of_Nation_and_Glory: "国家与荣耀之战"
 RUS_A_War_of_Nation_and_Glory_desc: "我国与德国之间的冲突，可能成为自19世纪将拿破仑从我们土地上驱逐出去以来，俄罗斯力量的最大展示。我们已经包围并歼灭了德国国防军，彻底摧毁了他们的殖民管理。\n\n在为重夺我们在东欧地区的正当霸权而战的过程中，我们不能在与德国人的斗争中犹豫不决。正是通过我们正义的战争，我们将重夺俄罗斯的荣耀。尽管失去了许多，但这一切都不会白费，因为我们为了祖国的荣耀而战。"