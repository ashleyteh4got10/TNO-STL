 RUS_AFG_WAR_DESC_tt: "§W§,阿富汗§W的§u沙尘§W之上，§b帝国坟场§W又一次遭到了考验。1976年初，随着§x塔吉克斯坦§W对§,阿富汗§W的宣战，这场人类史上最久的§l代理人战争§W开幕了，而决定双方命运的，正是§V俄§M美§x日§q德§W四方运筹帷幄的能力。\n\n§,阿富汗战争§W共分为十个阶段，每个阶段都有其独特的§n决议§W可用，在几年的冲突中，§V俄罗斯§W将只身对抗§q德§M美§x日§W三极，将§,阿富汗§W纳入自己的麾下。而§q德§M美§x日三国要做的，就是§V不惜一切代价§W阻止§V俄罗斯§W的计谋成功。\n\n量化§,阿富汗战争§W烈度的指标是当前的§f战争激化时间§W。§f战争激化时间§W不能低于270天，作为§a超级大国§W，你所做的任何一件支援§e战争§W的事都会减少§f战争激化§W的时间。但在§,阿富汗§W，§a超级大国§W们不能一味参与§e战争§W，他们需要在各自的后方进行建设从而确保冲突的优势，而这将§S不可避免§W地缓和局势。\n\n§a超级大国§W们无论如何想要直接干预，碍于§V四§M方§W的勾心斗角，都是不可能的。双方只能为自己支持的势力提供§l间接帮助§W，援助自己支持的势力以§G军事§W，§Y经济§W支持以及维稳。并且双方无法整建制的输送部队，只能退而求其次，通过§R多批的小部队参与代理人战争§W，因此，确保自己支持的势力的§G军事§W素质非常重要，否则双方的士兵将在这§b帝国坟场§W中§o噬沙§W，陷入无止境的§e战争泥潭§W之中，无法脱离。\n\n双方除了在§G军事§W上直接输送兵力外，也可以通过§R一系列的小动作§W来恶心对手，扰乱对手的§a作战部署§W，从而取得局部的§b胜利§W。\n\n§S然而，纵使双方的手段再多，这场§e战争§S也绝无迅速结束的可能，哪怕是最§K乐观的预计§S也认为这场§e战争§S至少需要到§W1980年§S才能结束，因此处理§P国内的政治风波§S十分重要，稍有不慎，则不仅会从§e战争§S中§x离场§S，而且会对§V国内的稳定§S造成毁灭性打击。\n\n§r对于四个超级大国来说，这本就是一场无意义的战争，然而四方却因为勾心斗角而被困在了这个舞台上，进行着无限的零和博弈。§F\n---------------------------------\n§V上帝啊 我真的不想\n不到二十岁就死亡\n\n眼中充满眼泪\n止不住地流淌\n\n我对自己说“冷静”\n“我们会笑着死去”....\n\n阿富汗，阿富汗斯坦，\n"黑色郁金香"，在河岸上盘旋。"
