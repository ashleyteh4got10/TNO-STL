 SWRW_RUS.1.t:0 "打开机会之门"
 SWRW_RUS.1.desc:0 "如此多的俄罗斯人一生都在贫困中挣扎，渴望着改善他们的处境，但却缺乏资源来实现这一目标——这样的人太多了。如果要帮助他们摆脱贫困，我们就得培养他们的一技之长，让他们能找到有报酬的工作，否则他们就永远无法担负培训的费用。\n\n解决办法就是：就业工作团，这是一个由发改委负责运转的新项目，旨在为年轻的低收入人群提供免费的职业培训，通过让他们掌握能够改善自身社会经济地位所需的技能来提高他们的生活质量。\n\n随着就业工作团的出现，我们将能够向俄罗斯数百万的穷人展示一条走出贫困黑暗的道路，只要他们愿意前行，就能在前方迎接光明的未来。"
 SWRW_RUS.1.a:0 "光明破晓。"

 SWRW_RUS.2.t:0 "经济部长的一天"
 SWRW_RUS.2.desc:0 "[RUS.GetName]的经济部长正像往常一样在办公室内批改着文件，随着小山一样的诸多纸张作为一道道行政令被分发下去，今天上午的最后一份工作很快呈了上来——这是总书记亲自起草的，代表了他对俄罗斯经济政策的高度重视:《我们的经济总方针》\n他眯起眼睛，仔细端详着他紧皱的眉头逐渐舒展开来，随后在文件最后[RUS.GetLeader]的名字前签上了自己的名字，他长舒一口气，享受自己难得的休闲时光。\n……\n食堂里，部长笑容满面的拿出一大瓶可乐，随着碳酸气泡令人放松的‘滋滋滋’声，他对着同僚们说道:“同志们，我向你们宣布，我们的工作已经阶段性胜利完成，而且……我们可以恢复正常休假了!”顿时，欢呼四起，即使平素最严肃的老阿尔乔姆的脸上，也露出会心的笑。\n饭后，经济部长漫步在街道上，看着前方按照城市规划拆除破旧建筑后正在重建的商业街。那里半个月前还只是一块平整的空地，但现在楼房的框架已经拔地而起。他们的新兴国家，正如这这条街一般，尽管百废待兴，但是欣欣向荣。他想:“一车车钢筋水泥送上工地，化作城市的筋骨，血肉，而那些为了这座城市辛勤劳作的人…"
 SWRW_RUS.2.a:0 "他们正是这座城市的魂。”"

 SWRW_RUS.3.t:0 "预先评估"
 SWRW_RUS.3.desc:0 "我们成功了。\n自从俄罗斯大地在纳粹的铁蹄下沦丧，她的国土四分五裂，儿女们自相残杀，很多人已经认为俄罗斯已经再无统一的可能。然而现在，我们已经统一了大半个俄罗斯，联盟的碎片已经被我们收回了大半，一切似乎都在向好的方向发展。\n“说实话，虽然我们现在的实力已经足以媲美世界上的绝大多数国家。”外交部长尽可能的端详着每一句话，试图让接下来的话语显得不那么沉重。“但就恢复苏维埃联盟来说…以我们目前的实力….确实有很大的难度。”\n[RUS.GetLeader]皱起眉头：“怎么说”？\n“就在我们光复俄罗斯国土，清扫叛徒和纳粹的时候，外面的世界已经发生了天翻地覆的变化。我们的老对手，纳粹德国已经度过了石油危机，虽然他们在这场危机中遭到了重创，但在我们统一俄罗斯的期间，他们的军事实力也有非常巨大的提升，他们的合作者更是遍布欧亚大陆的各个角落，可以说，我们的敌人仍然是跨大陆的一股强大到令人窒息的力量。”\n“此外，我们东方的日本也不容小觑。”待外交部长说完，情报部长又接着说。“在我们统一俄罗斯之后，他们在东方增多了驻扎部队，对我们的远东领土已经造成了新一轮的威胁。并对我们的远东同胞进行了新一轮的围剿，以我们当下的国力，无法承受两线作战。”\n“而且，我们周边的邻居，还有曾经的加盟共和国很多也对我们的统一不太欢迎，他们恐惧我们的归来会造成他们独立的丧失，有些地区甚至已经被纳粹分子所掌控。威胁我们的安全。”\n[RUS.GetLeader]听着这些回报，他的思绪又飘回了国内。俄罗斯虽然统一，但国内的治理事务可是一点不少。各地势力割据期间都建立了不同形式的政权形式，联盟虽然摧毁了他们，但要想从基层的各个方面消灭这些势力的残余，并没有那么轻松。刚迎来解放的国土上到处都是残垣断壁，人民的生活饥寒交迫，国家的生产能力甚至还赶不上苏德战争之前。虽然整个领导层都已经对光复国土作好了最坏的准备，可当真正评估的时候，计划已经远远赶不上变化了。\n“听着，各位。”[RUS.GetLeader]看向每一位列席的部长。“我们的工作计划将作出改变，收复莫斯科等沦陷的地区将不再立刻进行，我们需要一段时间来恢复和发展，重建我们的国家。”他转向外交部长。“在此期间，我们也需要与美利坚重新修好，争取世界上更多势力的支持，并扩展我们的影响力”\n“不管怎样，我们已经将全国都团结在了一面旗帜之下，只要我们做的好，那么我相信，不需要几年的时间，我们就可以打回莫斯科，让纳粹血债血偿！”"
 SWRW_RUS.3.a:0 "终有一日，红旗再临莫斯科。"

 SWRW_RUS.4.t:0 "铁与汗"
 SWRW_RUS.4.desc:0 "火车驶入古比雪夫，窗外尽是废墟与断桥。[ROOT.GetLeader]站在站台上，目光扫过清理废墟的工人和流离失所的群众，低声说道：  \n“这不是我们要的城市。我们不会修补过去，我们要建造一个新的未来。”\n——《苏联城市发展计划》应运而生.\n“我们不会重建旧城区，而是拆除它们。”李可夫的城市规划会议上，旧时代的建筑在蓝图上被红笔划去，取而代之的是文化宫、集体公寓。总书记指着地图中央：“这里，将建成西俄最大的工人广场。”  \n“一个新的城市，将在废墟上崛起。”\n高尔基市的工人住宅区试点启动。中央供暖、公共澡堂、免费托儿所、食堂\n——工人家庭第一次拥有真正属于自己的家。  \n“这真的是给我们住的？”瓦西里站在新公寓门前，愣了半响，问。\n分配官员笑着拍了拍他的肩膀：“当然，这是你的家。”  \n“这是城市第一次真正属于我们。”\n伊尔库茨克的工厂区启动，地铁直通车间，工人步行二十分钟即可到达工作岗位。\n喀山的工业园不仅有生产车间，还有食堂、诊所、电影院、运动场，工人不再是机器的附庸，而是生活的主人。\n“工厂不只是生产的地方，它是工人的堡垒和家园。”\n但是建设的道路并不平坦。\n“我们缺少水泥、钢材、电力。”报告的字迹凌乱。政府随即颁布“全俄劳动动员令”，数百万工人、农民、复员士兵涌向建设工地，昼夜施工。  \n在斯维尔德洛夫，年轻的工程师通宵设计供热系统；在伏尔加河畔，工人们顶着寒风架设桥梁。每个人都知道，自己在参与一场塑造未来的工程。  \n第一批新城市拔地而起。\n清晨，工人走出公寓，步行至工厂；母亲推着婴儿车，穿过林荫大道，走向免费的托儿所。广播播放着胜利的歌声，街头张贴着成功的报告。\n李可夫中央广场上，一条红色横幅迎风招展：  \n“工人们创造了城市，城市也将属于工人！”\n[ROOT.GetLeader]坐在办公桌上，望向这座新世界的第一座城市，目光如炬。"
 SWRW_RUS.4.a:0 "哪怕是漫长的路。"


 SWRW_RUS.5.t:0 "播撒知识的种子"
 SWRW_RUS.5.desc:0 "晨曦洒落在李可夫市郊外的一座小学里，黑板上用粉笔写着今天的课程主题：“苏维埃的胜利与人民的未来。”年迈的老师——格里戈里·伊万诺维奇站在讲台上，轻轻敲了敲黑板，望向教室里那些尚显稚嫩却充满渴望的眼睛。他清了清嗓子，缓缓说道：“孩子们，你们是新俄罗斯的未来，你们不再需要忍受战火和饥饿，我们将为你们铺就一条光明的道路。”\n他的声音在教室里回荡，而窗外，成群的工人和红军正在重建这片满目疮痍的土地。革命的烈焰曾经席卷大地，旧世界的腐朽被彻底扫荡，然而，新世界的构筑却远比摧毁更为艰难。\n中央教育人民委员会最近颁布了一项具有深远影响的法案——《全俄义务教育改革法》。该法案的核心理念是：让每一个孩子都能接受完整的教育，无论他们的出身是工人、农民，还是曾经的资产阶级。"
 SWRW_RUS.5.a:0 "知识是人们在任何一条道路上的旅伴。"

 SWRW_RUS.6.t:0 "新社会保障法"
 SWRW_RUS.6.desc:0 "夜晚依然寒冷，但最高苏维埃的灯光彻夜未熄。长达数小时的会议仍在进行，空气中弥漫着香烟燃尽的焦味和纸张翻动的沙沙声。最高苏维埃的成员们围坐在会议桌旁，疲惫地翻阅着面前的文件，讨论着一个关乎俄罗斯千百万人民生死的议题——全俄社会保障方案。\n“我们赢得了这场战争。”一名身穿灰色军装的委员疲惫地说道，揉了揉布满血丝的眼睛，“但我们的人民呢？他们已经一无所有。”\n革命的胜利并不意味着苦难的终结。俄罗斯母亲在呻吟，俄罗斯人民依旧挣扎着求生。战争摧毁了工厂、田地和铁路，数百万失去亲人的孤儿在街头游荡，伤残的红军在破败的房屋中忍受饥饿与寒冷，年迈的母亲在孩子们的尸骨前哀哭。革命承诺了一个更美好的未来，而现在，未来必须兑现承诺。\n这份新通过的社会保障方案，将成为新的苏维埃国家的第一块奠基石。\n\n新方案的推行并非没有代价。\n“这些项目需要的资金，远超我们的承受能力！”财政部长在会议上摊开账本，声音因愤怒而颤抖，“我们才刚刚结束革命，国库已经空了！如果再增加财政负担，我们的经济会轰然崩塌”\n[ROOT.GetLeader]沉默地听完，伸手拿起一张标注着工厂产能提升的报告，轻轻放在桌上：“我们有最坚韧的工人，有最勇敢的红军，他们能够重建国家——但前提是，他们必须活下来。”\n最终，方案被通过了。为了支撑社会保障体系，政府宣布全国范围内的劳动动员，工厂加班加点生产，富农财产被征收，战时紧急经济体制被维持。但与此同时，新的住房、新的工厂、新的学校也在全国各地拔地而起。\n当第一批工人、母亲、老兵、孤儿领取到属于他们的补助时，他们知道，这不是资产阶级的施舍，而是属于他们自己的胜利。\n夜晚，克里姆林宫的灯光终于熄灭，而在街头，工人们聚集在一张刚刚张贴的新公告前，默默地阅读着它的标题：《全俄新社会保障方案》"
 SWRW_RUS.6.a:0 "——为了人民，不只是为了革命。"

 SWRW_RUS.7.t:0 "扩大军队"
 SWRW_RUS.7.desc:0 "军营一日,\n古比雪夫，某连驻地。\n新一批的小伙子响应着联盟的号召参军。\n“我是！上尉瓦西里！是来训练你们的！我们西俄战争的老兵，是你们最好的！老大哥！你们有什么不懂的事情，可以来问我们，我们会亲切地告诉你们！现在，请大家做自我介绍！每人把自己来自哪里，姓名，介绍一下。从你那，开始！”\n“是！李可夫，乔治·米…”\n“这么小声也想干翻纳粹渣滓！重来！”\n“是！李可夫市！乔治·米哈伊洛夫！”\n“好！下一个！”\n“高尔基市！莫伊塞伊·彼得洛夫！”\n“好！很有精神！下一个！”\n“沃洛格达，尼古拉·伊万诺维奇。”\n“听不清！根本听不见！声音太小！没有联盟军人样！重来！”\n“怎么？！你没听见吗？！”\n“眼睛别往别处看！不准东张西望！你那是立正的姿势吗？！”\n“在军营里，连部指挥部说听不见，就是听不见！重来！”"
 SWRW_RUS.7.a:0 "“是！沃洛格达！尼古拉！伊万诺维奇！”"




















































