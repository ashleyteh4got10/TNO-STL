AFG_WAR.1.t: "阴影再临"
AFG_WAR.1.desc: "来自中亚的电报敲响了新的警钟，其声响在华盛顿、日耳曼尼亚和东京的权力走廊中同样刺耳。潘杰希尔河谷的宁静被炮火撕裂，积压数十年的宿怨终于化为现实——在刚刚统一俄罗斯的[RUS.GetNameDef]支持下，其在塔吉克斯坦的盟友正式向阿富汗王国宣战，理由是收回五十年代末西俄战争混乱时期被“窃取”的领土。\n\n这片自古便是帝国角力场和坟墓的山地，再一次成为了大国博弈的棋盘。虽然莫斯科方面宣称这仅仅是“兄弟民族收回失地的正义之举”，但明眼人都清楚，统一者的野心绝不止于帕米尔高原的几处山口。重新武装的俄罗斯需要展示其力量，巩固其在中亚的影响力，并试探世界的底线，而饱经内乱、地缘位置关键的阿富汗，便成了这危险游戏的第一颗棋子。\n\n对我们而言，这不仅仅是又一场发生在遥远角落的代理人冲突。它是在苏联废墟上崛起的巨熊重新伸出爪牙的信号，是对现有势力平衡的公然挑战。阿富汗的战略地位——扼守着通往南亚次大陆和波斯湾油田的要冲——不容有失。如果我们放任[RUS.GetNameDef]肆意扩张其势力范围，其在中亚投下的阴影，迟早会蔓延到我们认为安全的地方。\n\n“大博弈”的幽灵从未真正离开这片多山的土地，如今，它换上了新的面孔，以坦克履带和步枪弹壳作为注脚，重新书写规则。喀布尔的政府能否顶住压力？俄罗斯人的干涉会到何种程度？更重要的是，我们该如何应对？袖手旁观显然已不是选项。"
AFG_WAR.1.a: "兴都库什山下，不容赤旗飘扬。"