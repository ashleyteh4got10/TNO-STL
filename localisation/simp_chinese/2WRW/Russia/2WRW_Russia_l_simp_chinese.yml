 AFG_WAR_IN_AFG_TAJ: "噬沙"

 SWRW_AFG.1.t: "请你不要说出真相"
 SWRW_AFG.1.desc: "俄罗斯驻阿富汗顾问团第3组，巴达赫尚，1976年12月25日\n“我们不是来赢的，我们只是来维持它的燃烧。”\n________________________________________\n上午6:12\n他醒在电风扇嗡嗡作响的营地房间，满地的灰尘，和隔壁传来的断续咳嗽声。他忘了自己是谁的上校，是哪一届军校的优秀毕业生。他只记得昨晚梦见家中妻子给儿子喂汤——那孩子已经五岁了，但他从未见过真人。\n今天的任务是去评估D-7地区的本地盟军营地，那里是个半民兵性质的组织，忠诚只存在于支票到账前。总部给他下的命令是：“鼓励其对抗德方支持的哈兹拉派系，同时确保不触发战区激化阈值。”\n他坐上吉普车，车胎在碎石上嘎吱作响，像骨头碾过沙地。\n________________________________________\n上午10:44\n顾问团抵达营地。营地的“司令”是个二十多岁的阿富汗小头目，戴着俄制贝雷帽，衣服油污斑斑。翻译员递上一封总部的资助函，他的眼睛立即亮了。\n上校知道这点钱根本不够修复那几门苏联旧迫击炮，但他还是假笑着鼓励对方：“我们相信你们的抗争。”\n翻译员照直翻了过去。他没翻出“这是一场绞肉机”这句话，也没翻出“你们最多能活三个月”那句上校没说出口的事实。\n________________________________________\n下午2:35\n顾问团巡视了兵营、弹药库，还有一座小型医院。里面的味道让他作呕：没有麻药，只有火酒和尖叫；没有纱布，只有撕碎的旧报纸。他看见一个十四岁的少年躺在病床上，腹部裹着用绳子固定的布条，嘴角泡着白沫。\n少年试图抬起头，小声说了句什么。上校低头听，翻译员面色迟疑：“他说，您是来自那个……天堂的地方吗？”\n上校没有回答。他只是扭头走出帐篷，在门外吐了一地。\n________________________________________\n傍晚6:00\n回程途中，他们车队被一枚简易炸弹掀翻，坐在副驾驶的年轻士官当场死亡，脸部削去半边。车内无线电被炸坏，短暂联系HQ后只得到一句回应：\n“记录坐标，明早派直升机回收尸体。你们继续执行路线。”\n上校坐在尸体旁边，一路无语。他打开公文包，里面是外交部撰写的“阿富汗本地势力忠诚评估报告”，用五级评分，图表齐全，红蓝配色鲜艳醒目。他合上文件，脸上是十几天来第一次笑。\n那是种厌世的冷笑。\n________________________________________\n晚上10:58\n顾问团返回基地。晚餐是冷掉的罐头和水煮胡萝卜。上校洗了脸，躺下。风沙从破窗吹进来，他没有力气关上。\n灯熄前，他翻出通讯记录，录下一条音频报告：\n“第3组已完成任务。D-7营地处于可控状态，预计在无重大外力介入情况下可维持三个月以上战斗效能。无异常。”\n他犹豫了一下，最后补上一句：\n“一切正常。”\n录音结束。他闭上眼睛，梦见儿子问他：“爸爸，你今天保护了谁？”"
 SWRW_AFG.1.a: "他醒在自己沉默的呼吸中，带着一身泥沙与答案。"

 SWRW_AFG.2.t: "我们还要留多久？"
 SWRW_AFG.2.desc: "俄罗斯共和国武装部队，第11步兵旅第2连，阿富汗帕克蒂亚前线，1977年5月8日\n________________________________________\n凌晨4:12\n他们是在咳嗽声中醒来的。冷风顺着沙袋缝隙钻进来，帐篷顶滴着昨夜融化的冰水。列兵安德烈·舍列宾蜷缩在军毯里，盯着头顶锈迹斑斑的铁梁发呆。他不记得自己已经在这片沙地待了多少天，只记得HQ最后一次发来的慰问包裹是去年秋天——里面的罐头已经发胀。\n“我们还要留多久？”\n他小声问身旁的搭档涅姆佐夫。对方没答，只是用破毛巾擦着上膛器上结冰的血迹。\nHQ没有告诉他们，他们是否还“在前线”——因为这里已经没有后方了。\n________________________________________\n上午10:20\n今天要轮班巡逻到7号公路南段，那是一条连游击队都不愿接近的“死亡地带”。曾有小队在那里失踪，一个星期后，他们的军服被钉在被烧空的校车上。\n指挥官递来一张墨迹模糊的地图，上面用红笔圈了三处可能的IED埋设区，随后扔下一句：\n“小心点，不然你妈连骨灰都收不到。”\n安德烈戴上头盔，抓起步枪，跟着队伍沉默前行。\n________________________________________\n下午1:03\n他们在第二区域发现一处塌方。土里埋着什么东西，露出一截黑色鞋底。安德烈小心靠近，掀开沙土，一具被炸碎的尸体暴露出来。不是俄军，是某个本地武装的残兵，身上还有美国的急救包。\n“鬼知道他是哪边的。”\n涅姆佐夫吐了口唾沫，继续前进。\n安德烈站了一会，默默在尸体胸前放下一支空水壶。他不知道自己为什么这么做。或许只是想让“那边”的人知道，这里还有人活着，还能做点什么人事。\n________________________________________\n傍晚6:41\n返回营地时，他们遭到一次简短的伏击——三个同伴中弹，其中一个是新兵，刚从西伯利亚调来三个月。安德烈跪在地上给他包扎时，男孩一直盯着他，脸上的血让他说话都在打颤：\n“哥……HQ知道我们在这吗？”\n安德烈没回答。他按住动脉，看着血从指缝里冒出来，心里一遍遍回响那句话：我们还要留多久？\n________________________________________\n深夜11:08\n营地静得像坟墓。广播里又开始播放那条死气沉沉的宣传带：“阿富汗的每一寸土地，都是我们捍卫文明的前线。”\n安德烈躺在床上，脑子里却响起母亲的声音：“要记得回家啊。”\n他从枕头下拿出那封已经看不清字的家书，又看了一遍，然后点燃，用一根破火柴。\n灰烬飘起时，他望着远处连绵的沙丘。那不是前线，不是任务地点，不是荣誉战线。"
 SWRW_AFG.2.a: "那是活人埋自己的地方。"

 SWRW_AFG.3.t: "我们从不许诺明天"
 SWRW_AFG.3.desc: "美国中央情报局 阿富汗任务组，赫拉特郊区，1978年7月4日\n________________________________________\n06:03 - 代号“卡特里娜”的日常启动\n水泵坏了。他又一次用沙水洗脸，脸上的灰尘越擦越厚。CIA西阿分署的“观察前哨站”伪装成一处援助医疗所，外墙涂成了OFN-OAS的浅蓝色，门口站着两个会说普什图语的“医生”，背后都藏着M1911。\n他用的是假护照，假名字，假人生。他姓什么，已经没有人关心。他的任务编号是K-3/208/A，简称“卡特里娜”，这比名字更重要。\n________________________________________\n08:45 - 会见“自由战士”\n今天要见的，是CIA自己养出来的“资产”——“穆罕默德·拉基姆”，本地一支抗俄武装的小头目。HQ要求提供新一批的弹药与通讯设备，并交换“关于俄罗斯顾问活动的地形情报”。\n拉基姆迟到了一小时。他带来一只冰冷的塑料箱，里面是两名被俘的俄军士兵的头颅。他还开玩笑说：“你们要是再多给点弹药，下次就能整张脸都给你们留全。”\n他笑了。K-3没有。\n他只是点点头，说：“我们会考虑。”\nHQ希望他们“保持关系”，不要“吓跑朋友”。\n________________________________________\n13:22 - 沟通中断记录第47次\nHQ的加密电台一度失联，长达42分钟。他独自坐在天台抽烟，目光越过屋顶的防沙网，看见远处孩子们在用空炮弹壳当积木玩。\n他们笑得很大声，一如加州街头。但他知道这些孩子的父亲，不是在沙堆里腐烂，就是被“拉基姆”那种人训练着去送命。\n他本能地举起望远镜，想看得更清楚一点，却在看清其中一个孩子穿着印有“Pepsi-Cola”图案的旧T恤后，突然感到一阵反胃。\n________________________________________\n17:10 - “收尾”行动失败\n他奉命确认某名“目标人物”是否被成功处置——一个疑似向俄国佬泄密的本地联络员。地方武装说他们“已经处理干净”，但现场照片却显示尸体并不匹配。\n他尝试拨打喀布尔的联络点，被告知：“HQ不再关心那条线了，资源正向坎大哈倾斜。”\n这意味着这个人或许还活着，而他……将永远不知道。\n________________________________________\n22:39 - 日志更新与烧毁\n他打开随身带的小型录音机。按下录音键。声音低沉，缓慢：\n“任务编号K-3/208/A，第九十六天。未能确认目标击毙。与本地武装维持合作，无敌对事件。建议暂缓第三批物资发放，拉基姆意图不明。……任务执行状况：正常。”\n他关掉录音。接着从文件袋中抽出几张纸条，包含身份信息、情报来源、资金动向。他用打火机点燃，把它们一张张扔进旧铁桶中，看火焰在文件上舔舐他的生活。\n他的生活就像这些文件——只活在一次性信息中，烧掉之后，就不再存在。\n________________________________________\n01:18 - 独白\n他盯着天花板，无法入睡。耳边总会响起HQ培训时那句经典的话：\n“我们从不许诺明天，我们只兑现今天的秩序。”"
 SWRW_AFG.3.a: "可现在，他开始怀疑，今天到底算不算“秩序”？"

 SWRW_AFG.4.t: "从东京到赫拉特"
 SWRW_AFG.4.desc: "日本近东派遣军，赫拉特，1979年9月18日\n________________________________________\n黎明时分，血色的晨曦\n藤田大佐站在营地的边缘，凝视着远方昏黄的沙漠。清晨的空气依旧沉重，带着浓烈的沙尘味，他习惯性地抬手遮住眼前的太阳。赫拉特的天空无比广阔，但那片无垠的沙漠却总让人感到窒息。他将手中的望远镜放下，嘴角微微翘起：“也许，这就是我的命运吧。”\n自从东京下达命令，日本近东派遣军便如同一道幽灵般出现在这片“帝国坟场”。藤田并不否认，他来这里并非出于对“自由”或“正义”的追求——他是为了维护帝国的利益，为了守住那些已经在全球范围内被日本侵蚀的权力边界。战争，对于藤田来说，早已不再是泛亚主义的浪漫，而是机械化的棋局。\n________________________________________\n上午9:30，战局未曾动摇\n“你们的任务就是给他们提供援助，辅佐他们的战斗力。”藤田在向部下传达上级指令时，脸上没有一丝表情。日本军方的立场很明确——支持阿富汗本土的亲日力量，确保这里的局势不偏向俄罗斯或西方国家的阵营。然而，现实比任何策略都来得更加复杂。\n每一次与阿富汗本土武装交涉时，藤田都会感到一股莫名的压迫感。这些地方武装的士兵，眼神中充满了困惑和怒火。阿富汗的土地不会轻易接受外来的侵略者，不管这些外人是何种面貌。藤田在与这些本地人交流时，察觉到他们的畏惧，也能看到他们对日本的历史——那个曾经侵略过中国与东南亚的帝国的厌恶。\n尽管如此，他依然坚信，“这个地方，不得不由我们来掌控。” 这是为了“更大的未来”，是为了他所效忠的日本帝国。\n________________________________________\n下午2:00，气氛沉重\n不久后，藤田接到命令，带领部队前往赫拉特南部的一个村落进行支援。通过情报，他们得知该地区亲苏力量活动频繁，必须采取强硬手段。然而，这并不是一场单纯的战斗。\n村子里弥漫着一股令人窒息的气氛。藤田与他的部下穿过人群，进入一个简陋的民居。屋子里，几个衣衫褴褛的村民低头不语，他们的眼中流露出不安。藤田不禁意识到，这些村民的眼神充满了对战火的恐惧，但更多的是对外来力量的深深排斥。\n“我们的任务，绝不是为了这里的人民。”藤田向随行的中尉低声说道，“这只是为了让日本的影响力不被削弱。”\n这句话，他没有说出口的是：“我们终究只是帝国的棋子。”\n________________________________________\n傍晚6:15，冷风中的沉默\n回到营地后，藤田站在营帐外，感受着赫拉特的冷风从沙漠中刮来。这是他到达阿富汗以来，每天都会重复的画面。白天的焦虑、紧张，晚上则伴随着深深的孤独。尽管身边有上百名部队和同僚，但藤田知道，他们的心中都背负着同样的压抑感——这是一场没有胜者的战争，而他们，只不过是被困在这片沙漠中的一群没有选择的战士。\n他回想起在东京的日子，曾经的荣耀与梦想，昔日的日本帝国意气风发，一切似乎都那么充满希望。但如今，他的面前却是一个充满死亡与绝望的国度，阿富汗的每一寸土地都在让他逐渐迷失自我。\n藤田站了片刻，猛地转身，走进了营地深处。\n他清楚地知道，自己与所有在这片战场上的士兵们一样，早已脱离了曾经所谓的“荣耀”，进入了一个充满泥泞与血腥的现实。而这一切，或许永远无法清晰解释，也不可能真正停止。\n________________________________________\n深夜12:00，心中的挣扎\n夜深了，营地的灯火也渐渐熄灭。藤田躺在简陋的床铺上，双眼盯着帐篷顶棚。透过微弱的光线，他能看到那弯曲的阴影——他知道自己已经没有退路。这不仅仅是为了战争的胜负，更是为了日本帝国的未来，或者，他现在不得不面对的命运。\n“我来这里的意义，到底是什么？”藤田在心中默问。\n没有人回答他，他的心也慢慢变得冰冷。或许，这就是战争的真相——"
 SWRW_AFG.4.a: "你永远不知道自己在做什么，但你永远不能停下脚步。"

 SWRW_AFG.5.t: "如同『幽灵』"
 SWRW_AFG.5.desc: "共荣圈驻阿富汗观察员小组，特務機関非官方联络人，赫拉特，1980年5月8日\n________________________________________\n上午8:10\n他穿过街头的尘沙与橙色晨光，一步不快不慢。脚下是昨日刚被处理过的一起爆炸案现场。特務機関没有留下痕迹，只留下结论：“非我方资产误触美方布设的误导物资。”\n他戴着圆帽，穿着灰色便衣，藏在商人、神职人员、顾问之间。没人知道他的名字，只有一个代号：桧山二号。这是东京的称呼，不是赫拉特的。\n他走进一间茶屋。房东早已在柜台下留了一封信，信是用土耳其语书写的，但纸张是东亚造纸厂特有的“蚕白型”。他没有拆信，只是点了杯红茶，喝完，离开。\n________________________________________\n上午11:47\n他与当地亲日派军阀的侄子见面，地点是赫拉特郊区的一座废弃法式教堂。\n“我们需要你的人控制那条水渠。”桧山轻声说，“不是为了灌溉，是为了地图上这三座村子。”\n“德意志人也在出价。”侄子提醒他。\n“他们给的是钱。”桧山笑了笑，“我们给的是未来。大东亚的未来。”\n对方沉默了一会儿，然后点头。他签署的承诺书被密封进一只银制香烟盒中，明早会随物资车送往喀布尔，再由外交封包送回东京。\n一切无声，却干净得可怕。\n________________________________________\n下午3:20\n桧山走进日本“文化支援中心”后方的情报室。里面光线昏暗，堆满监听磁带与照片。一个年轻人拿来一卷最新录音——是美军顾问与塔吉克指挥官在马扎里沙里夫的通话，断断续续，但足够了。\n“确认了，美方准备撤出第6联络点。”年轻人低声说。\n桧山没有回答。他盯着磁带盒上的一行字：“声音未必说明一切，沉默才是情绪的词典。”\n他取出钢笔，在情报回执上写下：B点侦测完成。准备进行本地社会舆论渗透。\n他在心里补了一句没人听到的：战争不需要爆炸声，战争是情绪。\n________________________________________\n傍晚6:05\n天色转暗，赫拉特上空燃起黄沙中的夕光。他走回住处，一处废弃仓库后偷偷改装的小房间。门口有个本地孩子蹲着，递给他一封叠好的小纸条。\n“谁给你的？”他问。\n孩子摇头。\n纸条上写着五个字母："IZNNO"。是东京总部旧情报系统中“非自主叛逃者”的代号。有人在出卖情报——而是自己人。\n他坐下，没开灯，只是盯着那纸条，直到天黑。\n________________________________________\n晚上11:11\n他录制汇报磁带，声音平静如水：\n“赫拉特观察继续推进。阿勃维尔本周第三次试图绕过联合协定情报共享机制，美方顾问有撤退意图但尚不明确。J-3小组可能泄密，已着手调查。心理状态维持稳定。”\n他停顿了一下，望向桌边那把旧军刀。\n那是父亲留的——旧帝国的遗物。\n他轻声说了一句没有录进磁带里的话：\n“我们已经不是幽灵了，但还没学会做人。”\n________________________________________\n他合上录音机，重新戴上帽子，走入夜色中。"
 SWRW_AFG.5.a: "战争还在继续，他也必须继续伪装。"

 SWRW_AFG.6.t: "第十三个签名"
 SWRW_AFG.6.desc: "俄罗斯联邦驻阿富汗顾问团，战区R-7行动日记，1981年4月1日\n地点：楠格哈尔省，加兹尼南部缓冲区外围\n________________________________________\n凌晨2:06\n他睁开眼时，自己还坐在那张铝制作战桌边，靴子上沾着泥，裤脚沾着土，手指还紧紧攥着那支被咬坏的钢笔。\n文件夹摊开着，红色封面上印着九个黑字：“化学清理行动授权书”。\n他已经签过十二次类似的命令了。\n今天是第十三次。\n但他迟迟没有落笔。\n桌角的广播还在播放总部简报：“我们必须迅速削弱南部武装意志，切断其与德方后勤接触。”语调平稳得像在播报天气预报。\n他闭上眼，只看到昨日送来的视频——村口的人群，游击队混在难民中，孩子背着空壶在排队接水，一个女人抱着孩子朝摄像机尖叫。\n她说的是普什图语。可他听懂了。\n她在骂他们：“你们的神在哪？”\n________________________________________\n上午9:40\n空投完成。代号“伊戈尔”的飞行单元投下四罐改进型CL-34气体。根据情报，目标区域有超过60名非武装平民与疑似游击队同处。\n“概率不大。”副顾问在报告里写。\n“必要代价。”参谋长在边上说。\n他站在远程监控台前，盯着飘出的白雾，手掌贴在冷冰冰的玻璃表面。无人机的画面开始模糊，噪点、闪屏，最后归于黑白死寂。\n他知道，那里已经没有呼吸的声音了。\n________________________________________\n下午1:22\n午饭是罐头、干饼、糖水。\n他一口没动。\n“你知道美军在坎大哈做了什么吗？”一名年轻顾问说，“我们做的这些，连他们的百分之一都不到。”\n他没有回应。只是把手放进军服口袋，捏着那张复写纸——上面有他的签名，第十三次。\n笔迹比前十二次都稳。\n这才是最让他作呕的地方。\n________________________________________\n傍晚6:04\nHQ发来表扬：“R-7行动迅速果断，有效震慑当地武装活跃度。建议持续扩大非对称行动权限。”\n他坐在营地后方的斜坡上，望着远处那片已经被军情标记为“中性地带”的山谷。风从山口吹来，带着微弱的酸味。他不知道是真气体残留，还是自己鼻腔里的幻觉。\n“你没做错事。”副官说，“是HQ要我们这样做的。”\n他突然问：“HQ是谁？”\n副官愣住了。\n“你见过HQ的脸吗？你知道HQ有没有妻子？他们是否也会在深夜梦见那些被烧焦的身体？”\n他停顿了一下，声音极轻：\n“我不想再梦见那口水井了。”\n________________________________________\n深夜11:59\n他终于回到帐篷，把那张复写纸一张张拿出来，每一次命令的副本。十二张完整，第十三张还带着指纹印。\n他开始一张张烧掉。\n火光将帐篷映得如同墓穴。他跪在沙地上，最后一张没烧干净——“……经授权，立即执行清理……”那行字在火中挣扎，像在求饶。\n他终于哭了。\n不是因为懊悔。\n是因为他知道自己还会签下第十四张。"
 SWRW_AFG.6.a: "这不是结束。只是一天的记录。"

 SWRW_AFG.7.t: "德意志空军志愿团 · 阿富汗战区 · 战术飞行员行动日志"
 SWRW_AFG.7.desc: "1982年6月1日 · 巴达赫尚地区，REGEN-E行动区域\n________________________________________\n06:04\n他睁开眼时，窗外一片血色。\n不，是朝阳。但他的第一反应，是警报灯闪烁后的橘红色。他已经搞不清了。\n床单上是他昨晚出汗后留下的盐渍。梦里有一栋房子，着火了，屋顶掉下来一个人影，手里还抱着个婴儿。他醒来时双手握紧，像还在试图拉住什么。\n他坐起身，喉咙发紧。\n上尉告诉他今天的任务只是“常规清扫”。清除某个山区的游击队转运点。\n“没有平民，”上尉说，“哪来的平民？你看那些无线电导航了吗？一堆牛棚罢了。”\n________________________________________\n08:12\n升空。他打开HUD，系统冷静地列出目标坐标，武器状态，风速。\n他开始祈祷仪表出错。至少这样他可以飞偏。可惜，一切正常。\n“REGEN-E区域，预计敌人转运点于K山谷西口，击毁所有构筑物。”\n他俯冲时看见了那群人。\n不是士兵。不是游击队。\n是一群人。老人，小孩，一个女人在河边洗衣服，一个孩子站在石头上朝他挥手。\n他愣住了。手悬在释放键上。大脑停止工作。\n通讯频道传来训斥：\n“你在等什么？我们可不打回收带娃的圣母，飞行员，执行你的命令。”\n他按下去了。\n他按了。\n________________________________________\n08:16\n爆炸升起的尘沙中，他看见了那孩子的手——那一瞬，他确实看见了。\n但再望去，那孩子不见了。只有一堆焦黑的炭块。\n他忽然有些怀疑自己是不是记错了。\n“或许……那个孩子本来就在别的地方。”\n可一个声音冷冷回响在他脑子里：你亲手杀了他。\n________________________________________\n13:00\n午后。他回到基地。军官走来拍了拍他：“任务完成得很利落，干净，精确。”\n他嘴角动了动，点了点头。\n没有人提及那孩子。没有人提及那女人。\n他们的名字，他也从未知道。\n________________________________________\n15:25\n他坐在营房外，阳光落在膝盖上。他突然想起自己母亲年轻时也是洗衣妇，和今天早上那女人一模一样地跪在河边搓衣服。\n他用手掌捂住了脸。那不是自责。那是某种更深的恐惧。\n——如果他杀的，是自己的母亲？自己的孩子？自己的邻人？\n可他马上又反驳自己：“可他们不是。他们是敌后支持者，是潜在威胁，是帝国安全的破坏者。”\n他深吸一口气。\n接着他看到一个人影走来，是个穿着红色裙子的女孩，皮肤黝黑，脚上没有鞋。她走得很慢，一步一步。\n他猛然起身——什么也没有。营区空无一人。\n他的背已被汗水湿透。\n________________________________________\n18:46\n他躺在床上，无法入睡。手指在枕边一点点抓着布料。\n有人轻敲门。他起身打开，门外没有人。\n他回头，床上坐着一个孩子。黑发，眼睛很大，浑身灰白，手里抱着一个破碎的皮球。\n他瞪着那孩子。那孩子也盯着他。\n时间静止了整整二十秒。\n他猛地开灯。\n什么都没有。\n什么都没有。\n________________________________________\n21:10\n他在日记本上写下最后一句话：\n“我们以为自己投的是炸弹，其实是自己的一块块骨头。”\n他放下笔，看着窗外星空。\n一颗流星划过。\n他本能地祈愿：“如果有神，让我梦里别再见到他们。”\n可他知道，那神也许死在那个村子里了。\n或者，也许就躺在那口被炸飞的井边，眼睛还睁着，看着他…"
 SWRW_AFG.7.a: "…永远看着他。"

 SWRW_AFG.8.t: "黄沙之下，玫瑰未开"
 SWRW_AFG.8.desc: "1983年10月10日 · 巴达赫尚北部山谷 · 阿富汗民族解放阵线第七游击队据点\n________________________________________\n04:26\n他醒来时，天空还是黑的。地面冷得像石头。他把手从毯子下抽出来，手指已冻得僵硬。枪搁在身边，他下意识地握了一下——金属冰得像刀。他没动，再握一会儿，好像还能感到点血在流。\n不远处是哈米德，卷在一块破地毯里还在咳嗽。他们昨晚失去了一个补给点，只有四人逃出来。其余十人，不是死了，就是不知道去了哪儿。\n有人梦里喊母亲的名字，低声呜咽。他想起自己母亲时，发现脸上湿了。\n但不是因为哭，是因为梦里有血，有婴儿哭。他跪在瓦砾中，双手满是碎骨。他没能救那个孩子。\n________________________________________\n06:02\n他们在山口埋炸药，准备埋伏一支俄罗斯补给车队。\n他手指灵巧地绑着引线，嘴里咬着干草茎。他突然笑了。\n哈米德问：“怎么？”\n他说：“我小时候也玩过这些线……那时是在家做风筝。现在，还是在做风筝。”\n哈米德没笑，只是看着他：“你疯了。”\n他点头：“可能吧。”\n________________________________________\n10:18\n地雷炸了。\n他们伏击成功，但代价极高。爆炸那一刻他站得太近，被震晕。醒来时，周围一片焦土。三个队员躺着，不动。一个头断了，眼珠还看着他。是拉希德，才十八岁。\n他抬头，远处还有个活着的，靠在石头上喘息。他冲过去，却发现那是个俄罗斯小兵，脸上都是血，牙齿掉了一半，嘴里哼着歌。\n他举起枪，对准了他。\n那人抬头，嘴角动了动，似乎说：“妈妈。”\n他愣住了。\n他开枪了。\n他杀了一个唱着歌说“妈妈”的人。\n________________________________________\n14:30\n他们回到藏身地，天开始下雪。\n他坐在火堆边，烤着那双已经冻裂的手。\n火光摇曳。他看见对面坐着那个俄罗斯兵。\n他再次举枪，却发现枪口已经锈了。扳机上粘着血，是自己的，还是别人的，他分不清了。\n那兵开口说话，还是那句：“妈妈。”\n他闭眼，再睁开时，火堆对面只是一堆空弹药箱。\n________________________________________\n16:55\n他们收音机里传来消息，说昨天东边一个帕米尔村子被炸了。十几人死了，很多孩子没找到。\n有人骂：“混蛋德国佬。”\n他没说话。他忽然很想问一句：“你们骂的是德国人，还是俄罗斯人，还是美国人，还是日本人？”\n——或者，是我们自己？\n因为炸药是他们提前埋的，兵营是他们藏的，补给是他们抢的。村子被轰平前，是不是就因为他们在那儿藏过一晚？\n他猛然起身冲出洞口，想吐。却吐不出来。\n胃是空的，心也是。\n________________________________________\n19:20\n夜里，他做了一个梦。\n梦里他回到了小时候。父亲在河边洗衣服，母亲在屋里做面包。他像个孩子一样奔跑，追着风筝跑过石头、草丛和山坡。\n突然一声巨响，他倒下了。\n不是他，是风筝断线了，掉进了火里。\n风筝自由了。\n他睁开眼，四周寂静。他以为自己死了。\n可他还活着。\n他缓缓坐起，脑中只剩一句话：\n“我们用血浇灌的，不是自由，而是更深的地狱。愿安拉垂怜吾等。”\n________________________________________\n21:10\n夜静得可怕。他手里握着那支枪，枪管上依旧残留着那个俄罗斯兵的体温——不是真的体温，是他想象中的温度。\n他对着墙开了一枪。弹壳落地。\n“嘣。”\n哈米德吓了一跳冲来，问：“你干什么？”\n他回头，露出一个快要崩溃的笑容：\n“我只是想确定……我们不在赛尔勒…”"
 SWRW_AFG.8.a: "“…但我们正在食用欑楛树之果。”"

 SWRW_AFG.9.t: "绞肉机"
 SWRW_AFG.9.desc: "防毒面具的橡胶边缘紧贴着伊万·伊万诺维奇·伊万诺夫的脸颊，呼出的白雾在目镜上凝结成霜。他缩在战壕拐角处，听着远处传来的炮击声，那轰隆隆的声音，不知怎的，竟然让他想起了老家的瀑布……三个月前他还在贝加尔湖畔的冰面上凿洞捕鱼，而现在，他却蜷缩在这片被四国炮火犁过无数遍的高原冻土里，受着地狱般的折磨。\n\n"菜鸟！把你的枪举高点！"满脸胡茬的排长用枪托砸了下伊万的防弹背心。钢制插板硌得他肋骨生疼，伊万慌忙举起那把短小的突击步枪，枪管上凝结的冰晶簌簌掉落。透过被硝烟熏黑的雪幕，他看见五百米外的山脊线上，一辆德国人的豹式坦克正和日本的97式坦克激烈交火……不知道哪国的空袭留下的弹坑中，还积着墨绿色的油污。\n\n无线电突然爆发出刺耳的俄语："三点钟方向！阿富汗疯子带着RPG！"在伊万反应过来之前，他所处的那条战壕就突然变黑了——火箭弹扬起的灰尘遮蔽了天空，原本在地上散落的罐头盒和子弹壳像被掀翻的棋盘上的棋子一样四处乱飞。突然，他感觉有一些温热的液体溅进领口，扭头一看，那是半小时前教他装填弹匣的老兵安东尼的脑髓。只见安东尼仅有的半截身子挂在沙袋上，另一半已经不知去向。他的肠子像解冻的鱼内脏般尚且冒着热气，在灰黑色的泥土中格外的显眼。\n\n"射击！射击！"排长的嘶吼混着12.7毫米重机枪的咆哮。伊万机械地扣动扳机。随着5.45毫米子弹穿过飘落的雪片，三百米外那个包头巾的身影胸口炸开血花。那人顷刻身毙，然而他手中的火箭筒还是发射了出去，只是打偏了许多，砸到不知何时遗落在战场上的一只带有“美利坚制造”标识的油桶上面，令地上又多了几百枚铁片。\n\n夜幕降临时，伊万蜷缩在德国人遗留的混凝土碉堡里。通风管道的裂缝中渗进零下十度的寒气，四周万籁俱静，任何一点响动都足以让他害怕不已…他突然摸到裤袋里略微有些尖锐的铜十字架——那是今早转移阵地时，从被一辆被炸碎的运输车里捡出来的，它的边缘布满了灼烧的痕迹，看着这个依稀闪耀着红紫色光的小物件，不知怎的，他竟然感觉到一阵宁静。\n\n凌晨三点，炮击再度撕裂夜空。伊万跟着突击队冲向被阿富汗人称为"血谷"的隘口，防寒靴踩进半融化的雪泥，里发出咯吱声响。黑暗中亮起无数萤火虫般的枪口焰，日本人的八九式掷弹筒和俄罗斯的AGS-17榴弹发射器在互相朝着对方怒吼。某个瞬间，伊万看见雪地上有串新鲜的足迹通向一辆德制"鼬鼠"装甲车的残骸，他本能地举枪瞄准，即使听见阴影里传来的是新生儿的啼哭——他知道，那帮狂热伊斯兰分子什么都做的出来。他们拿活人当做诱饵，即使是婴儿，身怀六甲的孕妇，乃至已逾耄耋之年之年的老人……正想着，一个面色苍白的妇人抱着婴孩从彻底钻了出来，他立刻加强警戒，示意对方把手举起。可妇人不为所动，她凄凉的笑着，以迅雷不及掩耳之势拔掉了自己身上的保险栓，伊万这时明白，已经晚了。妇人的身体上爆开朵朵血花，同时爆开的，还有她身上绑着的烈性炸药。\n伊万的意识在陷入黑暗前最后记得的，是她的口型，即使他并不懂阿富汗的语言:"
 SWRW_AFG.9.a: "“去死吧，侵略者”"

