 rus_democratic_localized_accessories: "国产化外来配件"
 rus_democratic_localized_accessories_desc: "$RUS_commie_localized_accessories_desc$"
 rus_auth_localized_accessories_desc: "$RUS_commie_localized_accessories_desc$\n\n不过我们大可以直接买下工厂，毕竟没人想'离奇失踪'。"
 rus_democratic_industrial_centric_development: "重工业发展计划"
 rus_democratic_industrial_centric_development_desc: "重工业，在诸多繁杂的工业门类之中是出了名的高投入长周期低回报，巨大的代价令无数试图踏足这个领域的人望而却步——更别说本来就没有多少国家拥有这样的财力和能力了。\n可是我们必须发展重工业，若没有重工业，国家的工业发展就无从谈起。没有重工业的国家，几乎可以说是没有战争能力。\n不过我们不一定要全部让中央政府负担天价的经费（事实上，我们也没有这个能力），地方在重工业建设中可以拥有一定的自主权。"
 rus_auth_industrial_centric_development_desc: "重工业，在诸多繁杂的工业门类之中是出了名的高投入长周期低回报，巨大的代价令无数试图踏足这个领域的人望而却步——更别说本来就没有多少国家拥有这样的财力和能力了。\n可是我们必须发展重工业，若没有重工业，国家的工业发展就无从谈起。没有重工业的国家，几乎可以说是没有战争能力。\n不过我们不一定要全部让中央政府负担天价的经费（事实上，我们也没有这个能力），我们手里可是有枪的，如果有些人不理解我们的良苦用心，那我们就用枪帮他们理解。\n\n§S我作为总统的权力是无限的！"
 rus_democratic_import_industrial_machinery: "引入外来技术"
 rus_democratic_import_industrial_machinery_desc: "$RUS_commie_import_industrial_machinery_desc$"
 rus_auth_import_industrial_machinery_desc: "'那群傻逼资本家能不能他妈的闭嘴？我们已经忍耐了很久了，我们给了他们金钱，给了他们政策，还给了他们资源，现在他们居然还他妈想要让我们花钱进口技术？'\n\n'可是总统，他们说只要这事成了，他们会主动给我们让利的！'\n\n'哦，那就干吧，他妈的给我好好干！'"
 rus_democratic_the_problem_is_economy: "我们的经济问题重重"
 rus_democratic_the_problem_is_economy_desc: "$RUS_commie_the_problem_is_economy_desc$"
 rus_auth_the_problem_is_economy_desc: "$RUS_commie_the_problem_is_economy_desc$"
 rus_democratic_we_have_to_look_yourself_tt: "§W将解锁一系列国策以强化我们的国家！"
 rus_democratic_the_problem_is_economy_tt: "§W我们的经济政策也许在之前是适合我们的，但现在我们必须正规一些了。\n§S将解锁五年计划决议组！§!"
 rus_democratic_transport_modernization_tt: "我们会现代化西伯利亚大铁路，铁路沿线地区的GDP将会大幅升高!"
 rus_democratic_the_final_attack_to_einheitspakt: "四十载法西斯暴政，今日终宣结束"
 rus_democratic_the_final_attack_to_einheitspakt_desc: "西伯利亚，请知晓啊：\n\n在这飞逝的岁月中，记住我们的旧日荣光，\n\n伟大国家的荣誉，由您的儿孙捍卫！\n\n俄罗斯终将获得解放，\n\n凭借我们的悲伤信念。\n\n我们的歌声传遍万里国疆\n\n直达克里姆林宫古墙。"
 rus_auth_the_final_attack_to_einheitspakt_desc: "西伯利亚，请知晓啊：\n\n在这飞逝的岁月中，记住我们的旧日荣光，\n\n伟大国家的荣誉，由您的儿孙捍卫！\n\n俄罗斯终将获得解放，\n\n凭借我们的悲伤信念。\n\n我们的歌声传遍万里国疆\n\n直达克里姆林宫古墙。"
 RUS_the_final_attack_to_einheitspakt_desc: "西伯利亚，请知晓啊：\n\n在这飞逝的岁月中，记住我们的旧日荣光，\n\n伟大国家的荣誉，由您的儿孙捍卫！\n\n俄罗斯终将获得解放，\n\n凭借我们的悲伤信念。\n\n我们的歌声传遍万里国疆\n\n直达克里姆林宫古墙。"
 RUS_forward_tt: "§V向着莫斯科§z前进!§F"
 RUS_our_situation_in_world: "放眼国外"
 RUS_our_situation_in_world_desc: "如果我们要完成我们的最终复仇，如果我们要一雪那三次惨痛的耻辱，如果我们要夺回我们亲爱的故土，如果我们想在有生之年再次君临莫斯科古城，我们就必须意识到:独自奋战是不可能战胜德国这种强大的战争机器的。为了我们国家的荣誉，梦想，为了全世界人民的幸福，安康，我们必须利用一切可以帮助我们削弱德国人的势力。\n\n§V利用一切可以取得的机会。"
 RUS_international_trade: "国际贸易"
 RUS_international_trade_desc: "西俄战争以后德国近10年的骇人轰炸几乎将整个西俄罗斯和西西伯利亚都变成了一片废土——而远东和中西伯利亚自古以来便是荒凉之地，虽然布哈林的西伯利亚计划多少改善了这种境地，可是仍然杯水车薪。\n虽然军阀们都不是傻子，纷纷尽自己的全力，将俄罗斯掘地三尺来供养工厂和机床，虽然我们明智的领导人也制定了科学而有效的工业计划，可我们的工厂，我们的车间，我们的流水线，我们的技术工人，我们的社会发展水平仍然远远不够。俄罗斯不可能靠自身的可怜资源赢得对德国的战争，因此，对外贸易，增强自身，以待战机是必行之路。倘若没有国外援助，俄罗斯的恢复与发展将遥遥无期。\n与此同时，我们相信，无论是美国人，日本人，乃至在长筒靴下被摧残了四十载的所有人，都会支持我们伟大的战争，有了这些力量，俄罗斯，将竭尽全力，成为坚不可摧，战无不胜的，抗击纳粹的桥头堡!"
 RUS_africa_diplo: "联系非洲的自由国家"
 RUS_africa_diplo_desc: "尽管非洲自大航海时代以来一直是贫穷的混乱之地，但我们仍然有必要尽力争取我们可能的盟友，众人拾柴火焰高，利用一切可能的有利因素才能取得胜利，我们清楚的知道这个道理。非洲的自由国家们是我们的天然盟友，尽管他们的数量并不多……"
 RUS_america_diplo: "联系自由女神"
 RUS_america_diplo_desc: "尽管美国和我们的意识形态可能并不一致，我们之中的很多人可能也并不喜欢这个国家，但不可否认的是，在这个黑暗的世界，美国是为数不多的光亮之一:它拥有放眼全世界都屈指可数的海军，无比强大的工业能力。当然，最重要的是，它对纳粹始终保持着无比的憎恨。消灭德国的纳粹杂种是我们的最终目标之一，同时也是他们的夙愿——这一点足以盖过我们和美国之间可能存在的所有矛盾。\n如果我们想要赢得战争，与美国联系，争取他们的好感和支持是避不开的。美国渴望复仇，俄罗斯也渴望复仇，世界人民正在等待着对纳粹和法西斯的总清算。\n只要我们众志成城，那样的场景绝不会重演，只要我们集中一心，\n\n§r纳粹德国§V必将被扫入历史的垃圾堆！"
 RUS_OFN_training: "建立OFN-CSTO联系处"
 RUS_OFN_training_desc: "我们将与OFN进行政治经济军事等方面的全面合作，这要求我们建立一个强大高效的专职机关。它会承担联系，规划，统筹，调配，多项功能。我们将深化对OFN贸易，加强经济合作，我们将采购OFN的先进技术，聘请他们的军事顾问，学习他们的现代战术和军事科技。不过，我们有充足的理由相信，OFN也会积极主动的援助我们"
 RUS_connection_with_OFN: "与OFN的同志们联系"
 RUS_connection_with_OFN_desc: "我们将与OFN进行政治经济等方面的全面合作，这要求我们建立一个强大高效的专职机关。它会承担联系，规划，统筹，调配，多项功能。我们将采购OFN的先进技术，聘请他们的军事顾问，学习他们的现代战术和军事技术。不过，有理由相信OFN也会积极援助我们"
 RUS_OFN_supports: "OFN军事援助"
 RUS_OFN_supports_desc: "大量装备正一箱箱从飞机，轮船上卸下，进入我们的武器库存，OFN的援助量大到令人吃惊——要知道这只是一次性的。\n看来美国人已经决定全面支持我们，我们也自然不能让他们失望，有了这些力量，我们在未来的战争中将拥有厚实的底气。"
 RUS_europe_diplo: "黑暗大陆"
 RUS_europe_diplo_desc: "欧罗巴的大部分地区已经被纳粹荼毒了两代人，这漆黑扭曲的毒素深入骨髓。然而，即使是团结协定也并非铁板一块，遑论一直与德国若合若离的意大利与西班牙，德国人的残暴行径，即使是法西斯都不能容忍。西班牙仅仅是消极抵抗，而意大利甚至敢于公开对抗德国的权威——为了消灭盘踞西方的纳粹毒虫，法西斯主义在此时似乎也变得不是那么让人憎恨了。欧洲的独立国家们大概都在心中有过这样的梦想:有朝一日，长筒靴烟消云散，有朝一日，卍字旗焚成黑烟，有朝一日，欧罗巴那早已死去的躯壳能够重焕生机。\n\n我们和他们抱着同样的目的:既然敌人的敌人就是朋友，那么不妨让我们和他们坐到谈判桌上，共谋大事。"
 RUS_russia_vs_germany: "联盟之道"
 RUS_russia_vs_germany_desc: "现在，我们对纳粹暂时还无法采取军事行动。但我们可以在外交上谴责他们，并禁运他们——尽管他们已经禁运了我们。\n毕竟谴责团结协定的暴政也是世界各国生活的一部分嘛，而且这样能使我们的人民更加急切的期待战争，何乐而不为呢？"
 RUS_asia_diplo: "亚洲外交"
 RUS_asia_diplo_desc: "我们对我们的亚洲领土拥有无可置疑的主权，可是，日本人趁着苏联崩溃窃取了祖国的东方明珠——符拉迪沃斯托克，西俄战争的惨重代价让我们彻底失去了对中亚的控制……祖国的身躯满目疮痍，但是历史仍在前进，我们有充分的必要和理由收回我们的故土。\n更重要的是，哪怕是日本人也乐得见到我们对德国的战争......"
 RUS_far_eastern_accords: "向东京"
 RUS_far_eastern_accords_desc: "现阶段同日本发生直接冲突是绝对不可取的，但是日本同样会考虑:它能否一边承受重生的俄罗斯的怒火一边同美国继续冷战？明眼人都会给出答案:绝无可能。\n既然冲突无论对于我们还是对于日本都是不可能的选择，那么，对日本做出一些妥协，许诺一些利益以换取外阿穆尔的领土就是唯一的选择。如果能拿回外阿穆尔，我们的国民将受到极大鼓舞，政府合法性也将再上一个大台阶。"
 RUS_south_america_diplo: "向南美发出外交邀请"
 RUS_south_america_diplo_desc: "第二次世界大战将整个世界重新塑造，德国，日本和意大利用血淋淋的脏手捏出了自己想要的新秩序。然而，南美洲好像被遗忘了一样，这里在这个时代竟然从未发生过大规模冲突!\n尽管相较于世界上其他的动荡地区而言，南美洲就好像岁月静好的安宁乐土。但我们不能忘记，意识形态从来不是孤立的。法西斯和纳粹在欧亚的盛行使得南美也同样受到波及…\n为此，及时了解南美情况有其必要性，不过我们并不需要太多担心，毕竟这地方可是美国人的后花园，美国人绝不会容忍另一个纳粹政权在自家门口出现"
 RUS_the_final_attack_to_einheitspakt: "四十载法西斯暴政，今日终宣结束"
 RUS_pol_army: "政治化的军队"
 RUS_pro_army: "专业化的军队"
 RUS_OFN_TRAINING_IDEA: "§M自由国家组织之§W援§L助"
 RUS_our_situation_in_world_tt: "§e[RUS.GetName]§!§g乃是全世界人民§!§G解放§!§g之希望§!。\n§g在解决了国内的军阀之后，我们终于得以以§e俄罗斯§g大地上唯一正统的国家的身份进行§m外交。"
 RUS_international_trade_tt: "§Y贸易§g是让新生的祖国接轨全球的第一步。\n通过§m开放§g我们的贸易政策，我们的综合实力得到了一些增强。"
 RUS_africa_diplo_tt: "§Y非洲§g的土地上，§q团结协定§g的余烬仍摧残着人民，我们有必要对他们施以援手，将他们纳入§a反法西斯§g的全球阵线——哪怕只是摇旗呐喊。\n我们与§Y非洲§g各国的关系将极大§G改善！"
 RUS_america_diplo_tt: "§g在那场毁灭一切的§r大战§g中，自由之女神不幸被逐出了旧大陆，然而，现在的§M自由女神§g内部已团结一致，准备对§r法西斯§g发起最后的总攻，因此，我们要与§M他们§g建立紧密的联系，建立一个§a反法西斯§g的全球阵线。\n我们与§Y北美§g各国的关系将极大改善！"
 RUS_OFN_training_tt: "§g在四十余载的抵抗中，§M自由国家组织§g的同志们在战斗中成长，拥有了独特的经验。而§e我们§g，作为§a反法西斯§g阵线的大前线，需要来自§MOFN§g的援助。"
 RUS_europe_diplo_tt: "§g时值[GetYear]年，在欧罗巴大陆上，§q团结协定§g的铁靴已不再沉重，我们要在欧罗巴大陆上团结一切可以团结的力量，一齐消灭纳粹的大本营。\n我们与§Y欧洲§g的独立国家的关系将极大§G改善！"
 RUS_russia_vs_germany_tt: "§r德国§R的余孽必须得到消灭！"
 RUS_asia_diplo_tt: "§V[JAP.GetFlag]旭日§g之下，亚洲的人民正奋起反抗，也许我们暂时无法援助他们，但终有一日他们也会取得成功。\n我们与§m亚洲§g的国家的关系将极大改善！"
 RUS_far_eastern_accords_tt: "§g符拉迪沃斯托克——1953年被§V日军§g窃取的领土之一。现在，我们§e已经§g团结起来，是时候向§V日本§g提出外交要求，重新夺回我们的领土了。"
 RUS_not_avaiible_in_this_version_tt: "§V该选项在当前版本暂不可用。§!"
 RUS_south_america_diplo_tt: "§g南美洲——在两次世界大战期间，这里几乎都没有受到什么影响。而他们大多数都是§a反法西斯§g阵线的成员。和他们改善关系绝对不是一个坏选择。\n我们与§Y南美§g的独立国家的关系将极大§G改善！"
 RUS_connection_with_OFN_tt: "§MOFN§g的朋友们经历过了世界上的很多场战争。在战争中，他们证明了§M自由女神§g尚未停止抵抗。\n与§MOFN§g的接触将会有利于我们的§G经济§g与即将到来的§r战争§g。"
 RUS_OFN_supports_tt: "§MOFN§g的军事援助如潮水一般到达。事实证明，§M自由女神§g正热切的期待着我们对德国人发动最终的进攻。"

