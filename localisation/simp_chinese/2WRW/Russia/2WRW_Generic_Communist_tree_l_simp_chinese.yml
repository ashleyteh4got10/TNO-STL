 RUS_shukshin_operation_bagration:0 "巴格拉季昂行动"
 RUS_shukshin_operation_bagration_desc:0 "时间终于到了。自四十年代的惨败之后，这是我们第一次全力发动反击。\n\n§R我们现在正与德国交战。§!\n\n前进的道路将是代价高昂的，许多人将失去生命，但最终，我们将实现[RUS.GetLeader]上任以来所追求的目标。\n\n§B把所有俄罗斯人从暴政中解放出来。§!\n\n这很可能是俄罗斯的最后一场战争。在这场即将到来的冲突中，我们冒着我们心中珍视的一切风险。让我们最后一次与我们的宿敌战斗，给他们一场他们会记住的战斗。"
 RUS_shukshin_moscow_in_our_sights:0 "莫斯科就在眼前"
 RUS_shukshin_moscow_in_our_sights_desc:0 "我们对付帝国的主要目标是我们的祖都莫斯科。\n\n被德国占领军反复蹂躏，定居者和执政的纳粹寡头过着奢侈的生活，而俄罗斯居民被驱逐出市中心，流放到郊区，被迫在帝国奴隶工厂的不人道条件下工作。\n\n[RUS.GetName]必须尽快解放首都，不惜一切代价将纳粹赶出我们的西部本土。"
 RUS_shukshin_rally_the_partisans:0 "召集游击队"
 RUS_shukshin_rally_the_partisans_desc:0 "在整个战争期间，深入德国占领区的游击队势力处处阻碍着纳粹战争机器。我们必须与这些反叛组织中最重要的组织合作，并对国防军造成最大的破坏。\n\n被解放土地上的游击队员将被征召入伍，加入联邦，将我们的祖国从德国的暴政中解放出来。"
 RUS_shukshin_inspire_the_muscovite_people:0 "激励莫斯科民众"
 RUS_shukshin_inspire_the_muscovite_people_desc:0 "莫斯科的俄罗斯人们！你知道我们是谁，我们来这里是为了什么。长期以来，数百万俄罗斯西部人一直梦想着祖国欢迎他们回到她温暖、充满爱意的怀抱中的那一天，而这一天现在就在眼前！\n\n俄罗斯民族的兄弟姐妹们，是时候终于摆脱束缚你们的枷锁，为你们的自由权利而战了！你的生存权！您有权成为一名自豪的俄罗斯公民！"
 RUS_shukshin_moscow_is_behind_us:0 "莫斯科已在身后！"
 RUS_shukshin_moscow_is_behind_us_desc:0 "经过这么多年的流血与泪水，莫斯科这座伟大的城市现在又回到了人民手中。几十年来，数百万人梦想着这一天，为我们祖先的家园的解放祈祷。那一天终于来了。\n\n我们伟大的首都再也不会落入敌人手中，外国军队也不会再亵渎这些街道。\n\n§V莫斯科将永远留在我们身后！§!"
 RUS_shukshin_retrofit_old_soviet_equipment:0 "改造旧苏联装备"
 RUS_shukshin_retrofit_old_soviet_equipment_desc:0 "毫无疑问，对德战争需要联邦利用任何和所有军事装备、有用的技术和战争材料，这些都可以在对德作战中发挥作用。虽然我们更愿意确保我们的部队配备联邦的标准装备，但如果联邦在未来忍受现代装备短缺，使用改装的军阀和苏联时代装备可能对我们的军事行动至关重要。"
 RUS_shukshin_deploy_pontoon_bridges:0 "部署浮桥"
 RUS_shukshin_deploy_pontoon_bridges_desc:0 "东欧的地理主要由广袤的平原、大片森林和众多河流组成。虽然我们的部队可以攻克平原和森林，但河流有时会让全俄军队头疼不已，因为他们一直在努力越过河流，尤其是当敌人在对岸设防时。\n\n虽然浮桥的部署不会消除这个问题，但它肯定会使我们的部队穿越伏尔加河和顿河等大河的努力变得不那么艰巨。"
 RUS_shukshin_wartime_conscription:0 "战时征兵"
 RUS_shukshin_wartime_conscription_desc:0 "尽管全俄军队已证明自己有能力在战斗中与德国人匹敌，但我们不能忘记德国国防军在许多指标上都超过我们。因此，对抗纳粹帝国庞大军队的唯一方法是修改我们的征兵法，让更多的俄罗斯子弟加入全俄军队。\n\n虽然这个决定对很多人来说可能是不受欢迎的，尤其是那些社会自由党中的傻瓜，但它是联邦要求其人民确保战胜我们最大敌人的必要之恶。"
 RUS_shukshin_wartime_propaganda:0 "战时宣传"
 RUS_shukshin_wartime_propaganda_desc:0 "我们必须向人民表明，我们在为谁而战。\n\n我们为那些被鸠占鹊巢、遭受冷眼歧视的莫斯科人而战！\n\n我们为在德寇统治下长期忍受隔离压迫的高加索人而战！\n\n我们为那些国土沦丧、良田被夺的乌克兰人而战！\n\n我们为眼见家园德化、饱受压迫却无能为力的“东方领”本地人而战！\n\n我们将为东欧的解放而战——不惜一切代价!"
 RUS_shukshin_invest_in_feniks:0 "喂饱野兽"
 RUS_shukshin_invest_in_feniks_desc:0 "战争爆发后，政府和企业同意搁置政治分歧，以巩固联邦的巨大资源和经济财富来对抗大日耳曼国。然而，与德国人的战争正在将我们的主要军事产品生产商推向极限。\n\n战争对物质的高需求已迫使许多工厂超出产能，导致他们正式请求政府提供财政援助以扩大现有工厂以满足他们的需求。虽然政府内部的许多人担心这种行动的潜在后果，但很明显，为了统一战线反对帝国的利益，政府目前必须支持军工复合体。"
 RUS_shukshin_purchase_american_submarines:0 "购买美国潜艇"
 RUS_shukshin_purchase_american_submarines_desc:0 "虽然对德战争主要在陆地和空中进行，但自伟大的卫国战争以来，海军的作用无疑发挥了更大的作用。在俄罗斯对抗德国之后，纳粹建立了一支规模庞大的海军力量，旨在挑战美国等超级大国在大西洋的主导地位，这意味着德国完全有能力派遣他们的舰队袭击我们在诸如美国等地区的沿海定居点。巴伦特。\n\n幸运的是，多年来一直支持我们的美利坚合众国提出向我们出售一支潜艇特遣部队，以支持俄罗斯海军保卫阿尔汉格尔斯克和摩尔曼斯克等城市免受德国炮击的努力。随着德国国防军入侵沿海的威胁变得越来越有可能，我们拒绝这样的提议将是愚蠢的。"
 RUS_shukshin_contact_free_europe:0 "联系自由欧罗巴"
 RUS_shukshin_contact_free_europe_desc:0 "欧洲的兄弟姐妹们，解放我们神圣领土的斗争已经到来。随着全俄军队勇敢地向西行军，面对德国国防军，我们必须呼吁所有自由的欧洲人以他们所能做到的一切支持我们反抗德国及其团结协定傀儡的伟大斗争。\n\n只有当自由的欧洲团结一致时，我们才能将我们的大陆从纳粹的压迫中解放出来，确保这片古老土地的未来将是自由和繁荣的，不仅是我们的子孙，还有我们子孙的子孙。"
 RUS_shukshin_the_italian_connection:0 "联系意大利"
 RUS_shukshin_the_italian_connection_desc:0 "随着纳粹德国和俄罗斯联邦军队之间战争的继续，意大利王国发现自己处于一个独特的位置。虽然我们在第二次世界大战期间曾经是敌人，但从那以后的漫长岁月里，情况发生了很大变化。自第二次世界大战结束以来，德国和意大利的关系每况愈下。\n\n考虑到这一事实，就有可能说服意大利政府资助俄罗斯对大日耳曼国的战争努力，并协助一劳永逸地消除来自欧洲的纳粹威胁。"
 RUS_shukshin_forward_russia: "巴巴罗萨的救赎"
 RUS_shukshin_forward_russia_desc: "我们做到了。\n\n巴巴罗萨计划的失败和耻辱如今已成为逐渐消逝的记忆。在法西斯帝国的三十年压迫、奴役和流血中，已被驱逐至历史的篇章，再也不会回归。虽然我们尚未进军柏林本城，但凭借我们的胜利，德国人必定很快会自乱阵脚。\n\n无论跨越我们边界的情况如何，我们的领土完整已得以恢复。象征[RUS.GetName]的旗帜再次飘扬在一个解放的欧洲之上。[ROOT.GetNameDef]的回归已经到来，为了农民和人民的利益，有一点是清楚的：\n\n我们将屹立不倒。"

 SWRW_RUS_unification.1.t: "动员"
 SWRW_RUS_unification.1.desc: " “......新生的中央政权将不再虚弱。我们将摧毁德国的纳粹分子，我们将解放整个东欧，恢复祖国。”\n萨马拉市中心，政委站立在临时搭建的台上，奉上级之命向民众演讲。台下除了俄罗斯人，还不乏乌克兰、波兰、波罗的海来的难民以及鞑靼人、哈萨克人等中亚游民。政委能明显地感受到台下观众的困惑与不安，每个人都迫切地等待着他的下一句话。\n“首先，我们将回到中亚，恢复草原的秩序，接着......”\n“俄罗斯族的霸权早就已经终结了，难道你们还想像彼得大帝那般，把哈萨克变成俄罗斯人的殖民地吗？”一名前排的哈萨克族男子情绪激动，暴起斥问道。\n政委只是面带微笑，事实上，他此程的目的正是将萨马拉这片大地上存在的各个民族团结起来，共同对抗纳粹。他转身向身后挂在墙上的临时地图，冷静的分析道：“‘现在的哈萨克看上去归于一统，处于稳定，然而在南方，德国法西斯扶持的突厥军团正在崛起。前苏联解体给中亚带来了政治真空，而纳粹意欲将魔爪伸向更远方，早就对中亚各国的政权觊觎已久。难道那就想让自己的故乡像波兰一样，沦为纳粹的总督府吗？\n台下的私语声减弱了。\n“接着，我们将与日本国谈判，夺回我们在符拉迪沃斯托克的合法权益。我们的勘察加舰队统御波涛，我们在满洲的游击队已经开始行动，刚历经石油危机的日本虚弱无力无法拒绝我们的提议。\n“这一切都是为了我们的最终目标：西进。”政委指向地图上的黑色地带，“我们的亲人、我们的故乡、我们的同志，他们至今仍在纳粹的铁蹄下艰苦度日。德国法西斯今日的猖狂，不过是建立我们的苦痛之上，只是很遗憾，昔日的败者卷土重来，带着今非昔比的军事实力回来复仇了！”\n人群掌声雷动，无论男女老少，无论来自哪个民族，没有人不为之沸腾。于是，一颗种子在人们心中种下："
 SWRW_RUS_unification.1.a: "祖国必将得到解放。"


