 rus_democratic_but_before_that_desc: "$RUS_but_before_that_desc$"
 rus_auth_but_before_that_desc: "$RUS_but_before_that_desc$"
 rus_democratic_we_have_to_look_yourself: "⋯⋯要先做好万全准备"
 rus_democratic_we_have_to_look_yourself_desc: "经济，政治，外交，军事。这四者是我们赢得第二次西俄罗斯战争的核心因素。我们将要在接下来的两年内扩军备战，实现经济现代化，社会正常化，军事先进化，外交友好化。\n\n接下来，该干活了，同志们。"
 rus_auth_we_have_to_look_yourself_desc: "经济，政治，外交，军事。这四者是我们赢得第二次西俄罗斯战争的核心因素。我们将要在接下来的两年内扩军备战，实现经济现代化，社会正常化，军事先进化，外交友好化。\n而那些反对我们的人，将会受到我们的严厉惩罚。\n\n接下来，该干活了，同志们。"
 rus_democratic_forward: "向着莫斯科前进！"
 rus_democratic_the_KGB: "建立联邦安全局"
 rus_democratic_the_KGB_desc: "苏联时期的'契卡'充分证明了情报战是有必要的。在安德罗波夫同志的建议下，我们将会成立俄罗斯联邦安全局作为我们的内务机构，总管一切对内对外的秘密行动。并且安德罗波夫向我们保证，克格勃绝对忠诚于党和国家，将如同契卡一样，成为保卫国家的利剑。"
 rus_auth_the_KGB_desc: "苏联时期的'契卡'充分证明了情报战是有必要的。在安德罗波夫同志的建议下，我们将会成立俄罗斯联邦安全局作为我们的内务机构，总管一切对内对外的秘密行动。并且安德罗波夫向我们保证，克格勃绝对忠诚于党和国家，将如同契卡一样，成为保卫国家的利剑。\n\n至少他是这么说的......"
 rus_democratic_protect_the_nation: "保卫祖国"
 rus_democratic_protect_the_nation_desc: "$RUS_commie_protect_the_nation_desc$"
 rus_auth_protect_the_nation_desc: "动员我们的人民，激发他们的爱国主义精神，让他们意识到，他们必须要保卫祖国，让他们意识到，如果我们输了，一切都将无可挽回。只有全社会拧成一股绳，只有人民群众自发的起来支持我们的伟大战争，我们才有可能战胜德国，我们才有可能保卫我们的联盟。\n我们将宣布全国紧急状态。如果他们意识不到现在的处境，我们必须要用枪了。\n\n如果有反对派的话，那就证明这群人连我们的宪兵都不怕了，这已经不是一般市民了，我看统统是暴徒！"
