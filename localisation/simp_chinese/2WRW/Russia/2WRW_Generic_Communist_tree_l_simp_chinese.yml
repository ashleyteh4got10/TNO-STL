 rus_democratic_transport_modernization: "现代化的交通网"
 rus_democratic_transport_modernization_desc: "俗话说:要致富，先修路。这句话并不毫无道理，如果我们要让祖国富裕起来，建立现代化的交通网络势在必行。我们已经有了现成的西伯利亚铁路，但是它太老太旧，难以承担重任。我们需要在原有的那点可怜公路和铁路线的基础上建设，发展，翻新，我们需要现代化!"
 rus_auth_transport_modernization_desc: "俗话说:要致富，先修路。这句话并不毫无道理，如果我们要让祖国富裕起来，建立现代化的交通网络势在必行。我们已经有了现成的西伯利亚铁路，但是它太老太旧，难以承担重任。我们需要在原有的那点可怜公路和铁路线的基础上建设，发展，翻新，我们需要现代化!"
