l_simp_chinese:
 RUS_WRW_Generic_Communist_tree: "共产意识形态 - 战争国策树"
 RUS_The_Peoples_Army_Marches_West: "人民军队西进"
 RUS_The_Peoples_Army_Marches_West_tt: "将从§o大日耳曼国§!收回[RUSGetUniqueNamePlain]的§x被窃领土§!"
 RUS_The_Peoples_Army_Marches_West_desc: "我们的一些同志说，社会主义的梦想已经实现。他们甚至可能会说，没有必要收复东欧。\n\n但是，领袖[ROOT.GetLeader]同志持不同意见。\n\n虽然是的，[RUSGetUniqueNamePlain]已在工人的旗帜下“统一”，但我们国家数百万同胞仍然未能摆脱法西斯统治者的压迫。虽然我们更多复仇主义倾向的人民中有一些人主张对德国进行彻底的报复，这也许是他们应得的命运，但我们不能冒险让世界陷入核地狱之中。相反，红军的军委们已经提出了一份全面的作战计划，以恢复我们对东部所有专员辖区的控制。领袖同志[ROOT.GetLeader]已经批准了这些计划，我们已经开始了动员过程。\n\n很快，数百万工人的解放将开始。[ROOT.GetNameDef]的最终考验已经来临。"
 RUS_Mobilize_the_Proletariat: "动员无产阶级"
 RUS_Mobilize_the_Proletariat_desc: "“革命的工人们！祖国呼唤你们的援助，你们必须为国家效力！你们的工作将用于解放祖国免受东欧法西斯肿瘤的侵害！立即入伍吧！”\n\n在我们的城市各处，这一信息将贴满房屋、市场、工厂，以及任何我们能找到的墙壁。唯有每个男性和女性要么在前线，要么在工厂，我们才能战胜德意志的入侵。不久，东欧的工人们将获得解放！"
 RUS_A_Gun_in_Every_Hand: "全民皆兵"
 RUS_A_Gun_in_Every_Hand_desc: "士兵的核心武器就是枪械。然而，在西伯利亚荒原，如今要找到枪支可并不容易。我们将不得不依赖布哈林时代的武器库来维持我们强大的红军。尽管如此，这个过程应该会比较容易。\n\n由于最近在喀山发现了旧的苏联文件，一支由精英西伯利亚士兵组成的搜索队成功地找到了至少十几处武器隐藏点。令人震惊的是，这些废弃建筑内发现了成千上万支武器、手榴弹和弹药箱。虽然我们不确定这些武器的质量如何，但为了祖国的解放，我们需要每一支枪。"
 RUS_A_Tide_of_Iron_and_Steel: "钢铁浪潮"
 RUS_A_Tide_of_Iron_and_Steel_desc: "尽管步兵是战争中的核心要素，但仅凭此还不足以击败法西斯的威胁。\n\n如果我们要与现代的敌人进行现代的战斗，就必须拥有飞机、坦克、装甲运兵车、海军以及所有其他现代化的工具，以便战胜德国人。我们必须能够在整个战争过程中迅速生产所有这些装备。凭借人民精神的力量，我们将能够淹没纳粹的防线，使德意志在几个月内陷入瘫痪！"
 RUS_The_Wehrmacht_Defunct: "德国国防军瓦解"
 RUS_The_Wehrmacht_Defunct_desc: "在短短几个月内，我们成功解救了数千人摆脱铁蹄下的压迫。然而，随着我们不断前进，一些奇怪的现象开始发生。越来越多的德国士兵被俘时身上装备越来越少。甚至有些团队完全向我们投降，每个投降的部队都状况不佳，严重的感染、营养不良和脱水问题不一而足。\n\n很明显，德国陆军已经名存实亡。它破败不堪，濒临崩溃边缘，毫无疑问，部分原因是游击队员通过破坏德军的补给线来实施破坏。我们只能希望，随着德国国防军的瓦解，我们将能够迫使德国很快投降。"
 RUS_Moscow_Red_Once_More: "红旗再临\n莫斯科"
 RUS_Moscow_Red_Once_More_desc: "同志们，欢呼吧！终于，莫斯科摆脱了德国的占领，工人的旗帜再次飘扬在克里姆林宫上空。虽然城市内部还有党卫军的藏匿点仍然困扰着我们的驻军，但它们定将在时间的考验下被消灭，纳粹政权可能发起的任何反击都将轻易被击退。\n\n预计我们的[ROOT.GetLeader]同志将在克里姆林宫残址外发表演讲。不久，我们将能够消除巴巴罗萨计划的失败，从德国的暴政中解救出祖国的其余部分！"
 RUS_Barbarossa_Redeemed: "巴巴罗萨的救赎"
 RUS_Barbarossa_Redeemed_desc: "我们做到了。\n\n巴巴罗萨计划的失败和耻辱如今已成为逐渐消逝的记忆。在法西斯帝国的三十年压迫、奴役和流血中，已被驱逐至历史的篇章，再也不会回归。虽然我们尚未进军柏林本城，但凭借我们的胜利，德国人必定很快会自乱阵脚。\n\n无论跨越我们边界的情况如何，我们的领土完整已得以恢复。红旗再次飘扬在一个解放的欧洲之上。[ROOT.GetNameDef]的回归已经到来，为了农民和人民的利益，有一点是清楚的：\n\n我们将屹立不倒。"
 RUS_One_Once_More_tt: "国家再次统一！"
 RUS_One_Once_More: "团结起来！"
 RUS_One_Once_More_desc: "[RUSGetUniqueNamePlain]。数十年来，经历了俄罗斯历史上前所未有的斗争，我们再次统一了国家。只要我们在[ROOT.GetLeader]的旗帜下前进，就不会再有一次如此丧失尊严的陨落——然而，如果想要将社会主义的赤旗插遍全世界，仍然面临着挑战。\n\n向南，哈萨克斯坦和中亚大草原陷入混乱，等待新联盟的解放。在东边，邪恶的大日本帝国夺取了我们的东方明珠，要夺回符拉迪沃斯托克确实是一项艰巨任务。当然，西边的德国是我们最大的威胁。\n\n§x我们不会第三次失败。§!"


 RUS_Forwards_for_Russia_WAR: "前进，为了[RUSGetUniqueNameTitle]！"
 RUS_Forwards_for_Russia_WAR_desc: "在[RUSGetUniqueNamePlain]中，没有人对这场战争的严峻现实视而不见。我们正在与一支装备精良、训练有素、意志坚强的敌人作战。然而，我们的祖国在与德国的斗争中一直屹立不倒，在我们自豪的人民名义下，一个又一个目标被夺回！宣传阵线也取得了重大成功，大部分男女不仅愿意投身其中，还为我们勇敢的士兵们拼命生产急需的装备。\n\n不言而喻，我们正义的战争正朝着胜利的结局稳步前进，其中很大一部分要归功于[RUS.GetAdjective]平民，即使是我们以前的怀疑者也无法否认我们的成功。德国的末日近了！前进吧，同志们！"
 RUS_Rout_the_Bastards_WAR: "击溃那些混蛋！"
 RUS_Rout_the_Bastards_WAR_desc: "每个小时，我们在莫斯科专员辖区的辉煌胜利都在变得更加不可避免，德国军队已经开始四分五裂。德国的将军们集体向我们投降，纳粹军队继续土崩瓦解。\n\n随着我们的士兵越来越深入专员辖区和匈牙利，德国核心领土将指日可待。这不仅将在世界舞台上摧毁德意志国的荣誉与威望，更将摧毁其人民的意志，最终为多年前他们对我们祖国所做的一切复仇。"
 RUS_A_Tide_of_Iron_and_Steel_WAR: "钢铁浪潮"
 RUS_A_Tide_of_Iron_and_Steel_WAR_desc: "尽管步兵是战争中的核心要素，但仅凭此还不足以击败法西斯的威胁。\n\n如果我们要与现代的敌人进行现代的战斗，就必须拥有飞机、坦克、装甲运兵车、海军以及所有其他现代化的工具，以便战胜德国人。我们必须能够在整个战争过程中迅速生产所有这些装备。凭借人民精神的力量，我们将能够淹没纳粹的防线，使德意志在几个月内陷入瘫痪！"
 RUS_Moscow_Red_Once_More_WAR: "同志们，勇敢的前进！"
 RUS_Moscow_Red_Once_More_WAR_desc: "§R同志们，勇敢地前进，斗争中百炼成钢！我们为争取那自由，昂起头奔向前方！\n\n我们全都来自人民，来自劳动大家庭。我们的战斗口号：“团结得像一个人！”\n\n世世代代受苦受难，男女老少受饥寒。如今黑暗快要消散，只等把血债讨还！\n\n时候已到，快准备好，高举长枪和大刀。我们的队伍像洪涛，冲垮那黑暗皇朝。\n\n沙皇骑在工人头上，作威作福像豺狼。快把子弹推上枪膛，去和敌人干一场！\n\n满怀信心，高歌前进，万众一心团结紧。去为幸福英勇斗争，赶走痛苦和贫困。\n\n我们力量排山倒海，千年压迫要消灭！光辉灿烂的劳动红旗，将要插遍全世界！"
 RUS_One_Once_More_new: "团结起来！"
 RUS_One_Once_More_new_desc: "[RUSGetUniqueNamePlain]。数十年来，经历了俄罗斯历史上前所未有的斗争，我们再次统一了国家。只要我们在[ROOT.GetLeader]的旗帜下前进，就不会再有一次如此丧失尊严的陨落——然而，如果想要将社会主义的赤旗插遍全世界，仍然面临着挑战。\n\n向南，哈萨克斯坦和中亚大草原陷入混乱，等待新联盟的解放。在东边，邪恶的大日本帝国夺取了我们的东方明珠，要夺回符拉迪沃斯托克确实是一项艰巨任务。当然，西边的德国是我们最大的威胁。\n\n§x我们不会第三次失败。§!"
 rus_democratic_our_real_situation: "我们的现实处境⋯⋯"
 rus_democratic_our_real_situation_desc: "$RUS_our_real_situation_desc$"
 rus_auth_our_real_situation_desc: "$RUS_our_real_situation_desc$"
 rus_democratic_build_our_party: "重建我们的党⋯⋯"
 rus_democratic_build_our_party_desc: "经过§B党§!的成员以及总统本人之间的大量争论和计划，就如何实现他们追求的“§m务实民主§!”目标，党的总统和高级官员向国家杜马提出了一个概念，旨在回答他们如何实现这些雄心勃勃的目标。\n\n§Y联邦议会§!\n\n这是一个在中西伯利亚共和国早期时期制定的古老概念，它被重新引入政府，经过改进以更好地适应[RUS.GetName]的需求和国家民主化的目标。"
 rus_auth_build_our_party_desc: "经过§B党§!的成员以及总统本人之间的大量争论和计划，就如何实现他们追求的“§m务实民主§!”目标，党的总统和高级官员向国家杜马提出了一个概念，旨在回答他们如何实现这些雄心勃勃的目标。\n\n§Y联邦议会§!\n\n这是一个在中西伯利亚共和国早期时期制定的古老概念，它被重新引入政府，经过改进以更好地适应[RUS.GetName]的需求和国家'民主'化的目标。\n\n不过，我们不可能真正让那些民众执掌大权的，新政府将由'统一主体国民会议'选举产生，而那里都是我们的人。"
