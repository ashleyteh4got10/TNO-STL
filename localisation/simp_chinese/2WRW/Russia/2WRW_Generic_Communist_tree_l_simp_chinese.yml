 rus_democratic_One_Once_More_new: "俄罗斯重获新生！"
 rus_democratic_One_Once_More_new_desc: "[RUSGetUniqueNamePlain]、数十年来，经历了俄罗斯历史上前所未有的斗争，我们再次统一了国家。只要我们在[ROOT.GetLeader]的旗帜下前行，就永远不会再有另一个黑暗时代——但随着我们的胜利，即将迎来的挑战现在更加临近，威胁着我们媲美1917年的复兴。\n\n哈萨克斯坦和大草原对我们的存在仍然持谨慎态度，长时间以来一直被困在旧联盟之中，直到事实上的崩溃。在外东北地区，压迫仍然盛行，被机会主义的日本人夺走了。而俄罗斯最大的失败以一座毁坏的莫斯科的形式嘲笑着我们。在这一切压迫继续围绕着我们肆虐的时候，我们不会袖手旁观。\n\n§a无论如何，俄罗斯的整个领土都将自由。§!"
 RUS_our_real_situation: "我们的现实处境⋯⋯"
 RUS_our_real_situation_desc: "历史向我们揭示其本质：人类注定要面对永不停歇的斗争。从大西洋到太平洋，数十亿人民仍在难以想象的暴政下挣扎求生，他们的处境甚至比最贫苦的俄罗斯人还要悲惨千百倍。日复一日，我们在毁灭的阴云下谋生；日复一日，我们只能寄希望于冷静的头脑能够占据高地，哪怕是在那些最狂热的国度。在这种时候，我们无论付出多大努力似乎都显得微不足道。在总统办公桌上，[RUS.GetLeader]正思索着这个世界的本质，思索我们的努力能否在无边黑暗中点亮光芒，哪怕只是点点微弱的烛光。"
 RUS_build_our_party: "重建我们的党⋯⋯"
 RUS_build_our_party_desc: "全联盟共产党（布尔什维克），简称联共（布）是苏联无产阶级的先进的有组织的部队，是它的阶级组织的最高形式.列宁在革命的烈火中锻造了它，柳廷与斯大林的冲突使它再次分裂，联共（布）如同一样祖国四分五裂.现在联盟完成了统一，联共（布）是时候迎来真正的统一了！我们决定重建各地党组织，编写新的党纲，使我们的无产阶级先锋队得到重生！\n\n党领导无产阶级、劳动农民和全体劳动群众为巩固无产阶级专政、争取社会主义胜利而斗争.党领导无产阶级专政的一切机关，并保证顺利地建成社会主义社会.党是以无产阶级的、自觉的、铁的纪律结合起来的统一的战斗组织.党要求党员积极忘我地工作来实现党纲和党章、执行党和党机关的—切决议、保证党的队伍的统一、巩固苏联各民族的劳动者之间以及与全世界无产者之间的兄弟般的国际主义的关系."
 RUS_looking_the_moscow: "向着莫斯科望去⋯⋯"
 RUS_looking_the_moscow_desc: "莫斯科——我们祖国的首都。这座城市在德国人手中遭到破坏，遭到焚烧，异化。但我们不会就此善罢甘休。终有一日，我们会重新夺回莫斯科，一雪第二次世界大战和第一次西俄罗斯战争的前耻，光复我们的祖国。"
 RUS_our_country_runs_well: "国家机器运转良好！"
 RUS_our_country_runs_well_desc: "黑暗永无止尽，但光明同样长存人间。[RUS.GetName]，自由的国度，勇士的家乡，一块蕴含无尽机遇的沃土。在这块肥沃的土地上，每一个人都可以以俄罗斯梦的名义自由追逐美好。只要我们的价值观得以保留，自由之光便将永远闪耀，自由与公义的希望便永不泯灭！我们砥砺前行、让世界走向美好，哪怕面对有史以来最为黑暗恐怖的威胁也不曾退缩，人类的良知因我们的斗争而闪耀！[RUS.GetLeader]这样安慰自己，我们可以永远寄希望于俄罗斯精神引领人类走向更美好的未来。"
 RUS_build_our_faction: "建立我们的阵营⋯⋯"
 RUS_build_our_faction_desc: "作为一个新生的大国，我们很有可能在未来登上全球舞台，成为冷战的又一国际强权。事不宜迟，我们应该成立集体安全条约组织，形成自己的势力范围。\n\n§x有些事情宜早不宜迟。§!"
 RUS_prepare_our_army: "准备我们的军队⋯⋯"
 RUS_prepare_our_army_desc: "士兵们，听好了！在接下来的两年里，你们将接受最严苛的训练，我们会为你们提供最好的装备和最好的后勤条件！而你们要做的很简单：刻苦训练，直到我们的军队西进！记住我们的口号：'为了祖国母亲，前进！'"
 RUS_but_before_that: "但在那之前⋯⋯"
 RUS_but_before_that_desc: "放眼望去，我们还有什么呢？\n\n我们只有满目狼藉的工农业，残破不堪的社会，破旧的军事装备，堪忧的人员素质，虎狼环伺的外交环境。如果以这样的状态对该死的纳粹发动战争的话，我们没有胜算可言。\n\n因此，我们要改善经济，政治，外交，军事四个方面的条件，为未来的战争打下胜利的根基。"
 RUS_commie_we_have_to_look_yourself: "⋯⋯要先做好万全准备"
 RUS_commie_we_have_to_look_yourself_desc: "经济，政治，外交，军事。这四者是我们赢得第二次西俄罗斯战争的核心因素。我们将要在接下来的两年内扩军备战，实现经济现代化，社会正常化，军事先进化，外交友好化。\n\n接下来，该干活了，同志们。"
 RUS_forward: "向着莫斯科前进！"
 RUS_forward_desc: "§M黎明曙光照遍四方\n\n照着克里姆林宫城墙\n\n无边无际苏维埃大地\n\n和太阳一同起床\n\n晨风洋洋，多么凉爽\n\n大街小巷闹嚷嚷\n\n早上好啊，可爱的城市\n\n早上好，祖国的心脏！"
 RUS_the_KGB: "建立克格勃"
 RUS_the_KGB_desc: "苏联时期的'契卡'充分证明了情报战是有必要的。在安德罗波夫同志的建议下，我们将会成立克格勃作为我们的内务机构，总管一切对内对外的秘密行动。并且安德罗波夫向我们保证，克格勃绝对忠诚于党和国家，将如同契卡一样，成为保卫国家的利剑。"
 RUS_commie_protect_the_nation: "保卫联盟"
 RUS_commie_protect_the_nation_desc: "动员我们的人民，激发他们的爱国主义精神，让他们意识到，他们必须要保卫祖国，让他们意识到，如果我们输了，一切都将无可挽回。只有全社会拧成一股绳，只有人民群众自发的起来支持我们的伟大战争，我们才有可能战胜德国，我们才有可能保卫我们的联盟。\n需要特别注意的是，我国的女性权利问题一直以来进展缓慢，现在我们将大力推动平权，这同样有利于激发广大女性同胞的爱国热情。"
 RUS_commie_patriotism_and_nationalism: "苏维埃爱国主义与民族主义"
 RUS_commie_patriotism_and_nationalism_desc: "现代国家的凝聚基础就是民族主义，这一点是无可争议的。我们将鼓励爱国主义，大俄罗斯主义与民族主义，从而巩固我们的统治，确保在未来的战争中不会像上次战争一样分裂成无数军阀。"
 RUS_commie_extend_the_government: "扩展政府机构"
 RUS_commie_extend_the_government_desc: "俄罗斯再统一后，新的社会状况向我们提出了新的要求，原有的行政部门远远不够，繁多的公务让我们的政府人员苦不堪言——是时候扩大我们的政府了。\n然而，我们不能忘记从前我们还是一个小小军阀时的经验，当我们初次统一了我们所在的地区，赢得战争，当我们接收了几乎等同于我们自身领土大小的疆域，我们新建立的大量冗余且不必要的行政机构不仅加重了人民的负担，而且拖慢了我们的效率，危害我们的国家，我们不会重蹈覆辙。"
 RUS_finish_social_reform: "完成社会改革"
 RUS_finish_social_reform_desc: "我国的社会从未如此美好！在[RUS.GetLeader]的领导下，我们的人民第一次有了希望，第一次体验到了真正的福利制度。在学校，学生们正殷勤的学习着知识，教育现代化的阶段性工作已完美收官。\n在社会上，工人们终于不用为生计发愁，因为我国的社会保障制度让工人的最低工资足以供养一家三口。在医院，无数人领取着政府的医保卡，享受着近似美国一般的医疗保障服务。\n[RUS.GetName]的社会正欣欣向荣！"
 RUS_commie_we_dont_change: "⋯⋯持中守正⋯⋯"
 RUS_commie_we_dont_change_desc: "尽管我们的经济体制不可能完美无缺，根据社会条件的变化，我们可能随时需要变革，但绝对不是现在。要知道经济体制这种东西从来都是牵一发而动全身，改革的动荡势必会在一段时间内影响我们的正常生产，如果社会不能迅速适应，我们在与德国的交锋过程中也将不得安稳，国家承担不起这样的后果。"
 RUS_commie_the_yagoda_economic: "⋯⋯新新经济政策"
 RUS_commie_the_yagoda_economic_desc: "我们的[RUS.GetLeader]同志突然想到了一个绝妙的点子！我们可以以社会主义的国家宏观调控为经济基本盘，结合市场经济，让市场成为决定价格的决定性因素，实行市场经济与计划经济相结合的经济制度！\n这样一来，我国既有能力指定宏观方针，让全国上下一心，又能避免出现计划经济的滞后性问题了！"
 RUS_commie_the_socialized_economic: "社会主义社会化经济⋯⋯"
 RUS_commie_the_socialized_economic_desc: "德国的路德维希·艾哈德的点子不错，真的。\n他的'社会市场'理论能调和阶级矛盾，保护自由竞争，限制垄断，减少过于不公平的分配状况，在最大化促进增长的同时保证国家不出大乱子。我们要师夷长技以制夷，实行类似的经济制度。"
 RUS_commie_the_economic: "联盟的经济政策"
 RUS_commie_the_economic_desc: "在部分解决了我们社会上一部分问题之后，一个鲜明的问题摆在我们的面前：我们的经济体制到底应该是什么？发改委内部对此问题形成了三个派系。\n其一是保持我们政策的稳定性。毕竟我们在几年前才刚刚确定下经济制度，现在贸然改变恐怕不会有什么好处。\n其二是结合社会主义理论与市场经济，施行'新新经济政策'，这一派主张改革开放，引入外资，为我国带来市场化与计划经济相结合的体制。\n其三是学习德国的'社会市场'理论，师夷长技以制夷，主张较为激进的自由化政策，最终引导我国的经济体制走向法团主义。\n\n无论如何，这都取决于你，[RUS.GetLeader]先生。"
 RUS_commie_compulsory_education_program: "义务教育政策"
 RUS_commie_compulsory_education_program_desc: "教育是民族复兴，国家富强的根本。哪怕我们这一代的教育状况已经难以改善，我们也要为子孙后代埋下伏笔。现如今我国的文盲率一直居高不下，这直接导致了我们的社会，经济，军事制度的改革阻力重重，得不到落实。工人不知道如何操纵他们的机器，农民因为看不懂说明书而不会用拖拉机，军人因为是文盲而不会维修自己的枪械......我们要实施义务教育与扫盲政策，这既是为了我们自己，也是为了我们的子孙后代。"
 RUS_commie_the_sad_state_of_agriculture_in_our_country: "我国农业的悲惨现状"
 RUS_commie_the_sad_state_of_agriculture_in_our_country_desc: "我国的地域辽阔，农业生产本应对我国来说是有得天独厚的优势的。可自进入二十世纪以来，沙俄，苏联的一系列政策，再算上德国的入侵与第一次西俄罗斯战争与连年的军阀混战，让我国的农业生产在七十年间没有任何进步。虽然在前十年得到了一些改善，但仍然没有什么大的改变。\n既是为了争取民心，也是为了强化农业，我们必须在短时间内提高农业产值，而这又要花掉我们一大笔钱......不过财政部门总会有办法的。"
 RUS_commie_social_security_policy: "新社会保障政策"
 RUS_commie_social_security_policy_desc: "只喊爱国口号没有任何用处——人民可不会因为空洞的话而认可我们，要想要真正获取他们的支持，国家要给予他们切身的利益。社会保障是我们争取人民支持的有利工具，我们应该利用好这个增强我们合法性的机会，真正让全社会凝聚在一起，为了国家而奋斗!"
 RUS_commie_the_social_need_help: "我们的人民需要帮助"
 RUS_commie_the_social_need_help_desc: "俄罗斯大地饱受蹂躏，人民流离失所，国家动荡不安，即使祖国已经统一，拥有了和平的环境，我们也不能立刻抚平这巨大创伤，我们必须坚定采取措施，帮助我们的人民们重焕新生，首先，要从社会福利制度开始，我们要让我们的人民感受到，国家是他们的，国家会为他们提供力所能及的最好的一切。"
 RUS_commie_finish_army_modernization: "完成军事改革"
 RUS_commie_finish_army_modernization_desc: "自西俄罗斯战争的惨败以来，我们偃旗息鼓，为未来的反攻做好准备。在前十年，我们从一介小小军阀成长成为俄罗斯正统，在此期间，我们的军队在战斗中成长，积累起了数不胜数的经验。现在所有自由的俄罗斯地区都在我们手中，我们在一年前开展的军事改革业已大功告成：陆军面目一新，海军不落人后，空军脱胎换骨，是时候将目光西移了......"
 RUS_commie_naval_force_equipment_modernization: "海军现代化"
 RUS_commie_naval_force_equipment_modernization_desc: "海军对于保护我国海洋利益至关重要。我们拥有漫长的海岸线，北冰洋的资源开发和战略通道的控制对俄罗斯的未来发展具有重要意义。我国海军在该地区的存在，能够确保我们对领海的有效控制，维护国家的地缘政治利益。\n作为全球海军中的新兴力量，现代化俄罗斯海军正在形成，装备体系创新发展的强劲脉动不止，向海图强势头澎湃。"
 RUS_commie_soviet_naval_forces: "苏维埃红海军"
 RUS_commie_soviet_naval_forces_desc: "曾几何时，苏联红海军也曾是全球一只让人望而生畏的存在，即使是海权强国的美国海军都要礼让三分，而这一切都随着布哈林苏联的分崩离析化为乌有。\n如今，马加丹、勘察加、阿尔汉格尔斯克各地的海军船坞已开足马力，几乎每个月都有新的船舰下水，新生的俄罗斯海军将会是世界上又一个海上霸权。"
 RUS_commie_air_force_equipment_modernization: "新苏联空军"
 RUS_commie_air_force_equipment_modernization_desc: "西俄罗斯革命阵线的朱可夫元帅总结自己在卫国战争中获得的经验时强调：“如果一个国家无力反击敌方的空中打击，那么灾难就会降临到这个国家头上。”\n在第二次世界大战后期，德国轰炸机群对苏维埃联盟成功进行的战略轰炸给我们以极大的震撼。喜人的是，我们的新空军已经建成，德国的苍蝇们再也不能在俄罗斯空中再作威作福了。"
 RUS_commie_soviet_air_forces: "重组苏联空军"
 RUS_commie_soviet_air_forces_desc: "自西俄战争惨败后，俄罗斯的天空便沦为了德国空军的游乐场。在德国内战前的每一天，无数辆印有万字符的战机从专员辖区起飞化身满天蝗虫，肆意掠夺俄罗斯人民的性命，轻浮地留下一片废土。\n如今，我们已经从废墟中崛起。我们将重建联盟空军，重夺俄罗斯母亲的天空。"
 RUS_commie_army_equipment_modernization: "联盟的新军队"
 RUS_commie_army_equipment_modernization_desc: "四十年代，法西斯德国撕毁《苏德互不侵犯条约》，向苏联发动突然袭击。由于战前苏联对战争危机估计不足，没有充分做好迎战准备，对双方力量对比估计失当，以及战略指导失误等原因，战线一溃千里。\n如今，我们在边境陈兵百万，无数的组织严密、装备精良的战士们严守岗位，时刻等待着终战时刻的到来。"
 RUS_commie_soviet_land_forces: "苏维埃武装力量"
 RUS_commie_soviet_land_forces_desc: "与历史上出现的各个武装力量不同，苏维埃武装力量是人民的武装，是社会主义共产主义的卫队。在1917年，导师列宁带领工人苏维埃武装推翻沙皇，推翻资产阶级临时政府，并在继而的苏俄内战中发挥了关键作用。\n五十余年过去，凭借苏维埃武装，联盟再度统一俄罗斯，彰显了苏维埃武装力量的无比优越性。如今，民兵、工人纠察队已经被动员起来，势要保卫新生苏维埃。"
 RUS_commie_advanced_training_project: "先进训练计划"
 RUS_commie_advanced_training_project_desc: "新的联盟统一后，人民们的参军热情高涨，大批渴望祖国统一、痛击法西斯匪徒的志士涌入了联盟的武装部。旧的军队训练方法已经暴露出了不少的问题，不能容忍他们成为我们祖国解放的绊脚石。新时期有新的办法，军需部的改革派们已经形成了一整套新的练兵计划。经过试验，新的计划展现出了强大的活力。\n先进训练计划可以弥补曾经的征兵练兵出现的种种缺陷，无疑有利于建设一支先进的职业化的专业军队。"
 RUS_commie_specialized_army: "专业化军队"
 RUS_commie_specialized_army_desc: "俄罗斯的军阀混战已经结束，我们如今面临最大的敌人是世界一极——称霸欧陆的大日耳曼国。我们现在迫切地需要一直专业化的军队，如果我们仍然像昔日一般，靠着旧日不团结、不集中的军队作战，那么西俄战争必然重演。\n总书记已下令：新的红军必须要是一支高度专业化的职业军队。经验丰富的将领和怀揣着爱国热情的士兵现已被动员了起来，新的作战标要求层层下达。可以预见的，在不久的未来，红军将成为全世界数一数二的先进军事力量，这无疑能够保证我们祖国解放战争的胜利。"
 RUS_commie_extra_the_military: "扩大军队"
 RUS_commie_extra_the_military_desc: "祖国母亲拥有广袤的国土，充沛的人力资源，这一点尤其在我们统一俄罗斯后越发明显。我们的武装部门越发认为，如果能充分利用全俄罗斯的人力资源丰富我们的新联盟红军，这将会为我们的武装力量带来一次跃升。经过若干次的军委会议讨论，扩大军队的决议已经被提上了日程。\n我们祖国的公民忠诚且爱国，对于敌人的仇恨深重且强烈，发动他们，让他们进入军队，让纳粹们看看俄罗斯人民的伟力。"
 RUS_commie_the_professional_army: "重申党——军关系"
 RUS_commie_the_professional_army_desc: "军队需要成为一个独立的机构。事实证明，一个政治化的军队往往战斗力都很弱。我们不应该进一步让军队和党绑定，反而应该让军队独立，给予他们种种保证，强化他们的纪律，让他们知道为何而战，如何战斗，而不是成为政治的工具。"
 RUS_commie_the_politicized_army: "党的军队"
 RUS_commie_the_politicized_army_desc: "无论如何，军队的独立是非常危险的。在祖国解体之后，忠诚于各部的军队互相残杀，让[RUS.GetName]的重建阻力重重。\n在之前，虽然我们也出于必要，选择了让军队忠诚于某个人，但现在我们必须确保这个人是我们的党，或者我们的国家。并且这样做也能让我们的军队组织更加有效率。\n\n毕竟，虽然前苏联打输了卫国战争，但在战争期间他们的政委表现的可非常不错。"
 RUS_commie_the_army_need_better: "我们的军队亟需改革"
 RUS_commie_the_army_need_better_desc: "在那次毁天灭地的大战中，曾经的苏维埃联盟那傲人的坦克部队、火炮集群、空中力量，都因叶戈罗夫的虚荣沦为AA线上七零八落的废铜烂铁。随后又同反动派的战斗进一步削弱了他们军队实力，直到我们统一了俄罗斯，接过了红军褴褛的大旗。\n\n自那时起，[RUS.GetName]毋庸置疑地夺回了许多往日荣光。[RUS.GetName]在世界舞台恢复了昔日的地位，我们也因此在恢复红军不可战胜之雄风的方式上有了更多选择。我们不能对此马虎了事，团结协定的军队不会给我们喘息之机，更不会对我们手下留情。"
 RUS_commie_finish_the_economy: "完成经济现代化"
 RUS_commie_finish_the_economy_desc: "我国的经济潜力现已完全解放！统一建设联合体的成立，五年计划的实施与监管制度的现代化让我们的GDP前所未有的增长。布哈林的西伯利亚计划现已被我国政府最大化利用。\n在工厂，工人们正辛勤的在流水线上工作，在农场，农民们正辛勤劳动，为祖国母亲的解放打下胜利的根基。俄罗斯的新时代，来临了！"
 RUS_workers_gowork: "全员工作！"
 RUS_workers_gowork_desc: "令人难堪的事实就是：我们的工人效率实在是太低了。大敌当前，很多地方的机器甚至还没有完全投入生产，工人们也丝毫没有紧张的气氛。这种状况不能再持续下去了。我们要学习前苏联的'战时共产主义'制度，先苦一苦人民，让我们的工业潜力最大化的释放!\n\n不过在战争结束之后我们到底要不要恢复现在的福利制度呢？"
 RUS_commie_manning_the_factories: "火力全开的工厂"
 RUS_commie_manning_the_factories_desc: "我们的工厂比起德国人而言少的可怜，那么我们就更要竭尽全力，不放过生产线上的每一颗螺丝，每一根钢条，我们必须让我们的工厂全速运转，让祖国制造的枪炮与钢铁源源不断的汇入库存，以备需要。即使这会付出一些代价……"
 RUS_commie_military_construction: "军事工业建设"
 RUS_commie_military_construction_desc: "先有剑与盾，后有家与国，这是亘古不变的真理。更不用说战争迫在眉睫的此刻了。不仅为了收复故土，更是为了俄罗斯国家，我们必须发展军事工业能力。面对强敌，强大的军事工业是我们生存，胜利的根本。"
 RUS_commie_the_resources_is_lot: "我们的土地上有无尽的资源"
 RUS_commie_the_resources_is_lot_desc: "即使我们失去了广袤的东欧平原，我们仍然保留着西伯利亚的土地。而在这广袤的土地上，数不尽的资源正等待着我们开发。比如秋明地区广袤的油气资源，一旦我们传出一些消息，那在国际上可不愁买家。更幸运的是，现在的西伯利亚人口众多，也刚好能支撑我们的资源产业，毕竟现在，我们要榨取每一点资源的价值，更别说这些资源实际上有极大可能成为我国未来的产业支柱。"
 RUS_commie_transport_modernization: "现代化的交通网"
 RUS_commie_transport_modernization_desc: "俗话说:要致富，先修路。这句话并不毫无道理，如果我们要让祖国富裕起来，建立现代化的交通网络势在必行。我们已经有了现成的西伯利亚铁路，但是它太老太旧，难以承担重任。我们需要在原有的那点可怜公路和铁路线的基础上建设，发展，翻新，我们需要现代化!"
 RUS_commie_urban_development_initiatives: "苏联城市发展计划"
 RUS_commie_urban_development_initiatives_desc: "在我们统一了俄罗斯之后，地方委员会和个体城市学者都提出了与之相似的计划，依此来发展并建设俄罗斯的其他城市。虽然他们的大部分提案都因联盟所处现状而遭到政府否决，但当局还是谨慎地采纳了他们想法中的核心内容。\n\n这些计划主要涉及到基础设施建设，我们要让城市内部与城市之间的交通系统加更优秀便捷。联盟采纳的其他项目涉及到了教育系统，这些计划旨在改善教育设施，为联盟未来的科学事业打下基础。"
 RUS_commie_localized_accessories: "国产化外来配件"
 RUS_commie_localized_accessories_desc: "即使我们的盟友们可以给我们提供相当的支持，但是重要技术和核心技术还是自己掌握在手里比较好。此外，这同样能够节省我们的经费，允许我们来用更多的资源和力量对抗德国。\n另一方面，德国人已经占领了新地岛，一旦开战，北冰洋航道大概率将被完全封锁，要从远东万里迢迢的将装备陆运到俄罗斯前线效率太过低下，这同样要求我们国产化!"
 RUS_commie_industrial_centric_development: "重工业发展计划"
 RUS_commie_industrial_centric_development_desc: "重工业，在诸多繁杂的工业门类之中是出了名的高投入长周期低回报，巨大的代价令无数试图踏足这个领域的人望而却步——更别说本来就没有多少国家拥有这样的财力和能力了。\n可是我们必须发展重工业，若没有重工业，国家的工业发展就无从谈起。没有重工业的国家，几乎可以说是没有战争能力。\n不过我们不一定要全部让中央政府负担天价的经费（事实上，我们也没有这个能力），地方在重工业建设中可以拥有一定的自主权。"
 RUS_commie_import_industrial_machinery: "引入外来技术"
 RUS_commie_import_industrial_machinery_desc: "闭门造车没有好结果，新生的俄罗斯没有能力将所有需要的科技都研发出来，引入来自OFN与共荣圈的先进技术百利而无一害，只要能够帮助我们对抗纳粹，我们照单全收!"
 RUS_commie_the_problem_is_economy: "我们的经济问题重重"
 RUS_commie_the_problem_is_economy_desc: "连年的征战对俄罗斯的经济造成了毁灭性的打击，为了让我们的经济足以支撑我们未来的战争，我们必须将盘根错节，阻碍经济发展的问题连根拔起。经济问题的根本原因是，人民并不信任我们新生的政权:工业能力薄弱，货币可信性不足，银行失能等等，我们必须解决这些问题。"
 RUS_commie_we_have_to_look_yourself_tt: "§W将解锁一系列国策以强化我们的国家！"
 RUS_commie_the_problem_is_economy_tt: "§W我们的经济政策也许在之前是适合我们的，但现在我们必须正规一些了。\n§S将解锁五年计划决议组！§!"
 RUS_commie_transport_modernization_tt: "我们会现代化西伯利亚大铁路，铁路沿线地区的GDP将会大幅升高!"


 RUS_five_year_plans: "§m第[RUSGetPlanNumber]个五年计划"
 RUS_five_year_plans_desc: "\n\n\n\n\n\n在§e伟大的党§!和[RUS.GetName]人民的一致努力之下，我们重建了[RUS.GetName]，而§B全国的对外贸易§!也随之得到了解放。符拉迪沃斯托克将再一次成为[RUS.GetName]与外部世界沟通交流的窗口，也将成为我们解放被§I修正主义分子§!们霸占土地的重要一步。\n\n指导我们新经济目标的是由我方最优秀的经济学家组成的§V[RUS.GetName]发展和改革委员会§!。不过发改委内部存在着对未来经济发展模式的争论，其中与§e[RUS.GetLeader]主席§!相近的成员们认为联盟未来的经济模式应该在保持体制的前提下建立起二元的鸟笼经济模式，而在§C反对派§!领导下的§C党权派§!支持者们则更倾向于建立一个更加正统的经济模式。无论我们选择哪种模式，我们都需要在维持体制的前提之下恢复社会经济秩序。"
 RUS_plan_number_eight: "八"
 RUS_plan_number_nine: "九"
 RUS_plan_number_ten: "十"

