 RUS_ninth_five_year_plan: "十五计划"
 RUS_international_volunteers: "国际志愿者"
 RUS_open_and_reformed_economy: "改革开放"
 RUS_building_up_socialism: "建成社会主义"
 RUS_advance_plan_year_tt: "§Y九五计划§!取得了巨大成功。我们将进入下一个历史发展阶段，根据§Y十五计划§!的需要来调整工作重心。"
