 rus_auth_One_Once_More_new: "俄罗斯重获新生！"
 rus_auth_One_Once_More_new_desc: "[RUSGetUniqueNamePlain]。数十年来，经历了俄罗斯历史上前所未有的斗争，我们再次统一了国家。只要我们继续在[ROOT.GetLeader]的旗帜下前进，我们就不会再次跌入耻辱之中，然而，世界仍然将我们视为一个毫无贡献的国家。这必须得到纠正。\n\n草原军阀们显得软弱，几乎乞求被征服。在对1905年的扭曲再现中，肮脏的日本和满洲人抢走了我们国家曾经的战果。尽管他们口口声声谈论优等人，但经过十年的冲突后，条顿人似乎显得脆弱。现在是行动的时候，如果我们成功，[ROOT.GetLeader]将永远受人尊敬。\n\n§x现在轮到夺回我们阳光之地的时候了。§!"
