l_simp_chinese:
 RUS_WRW_Generic_Democratic_tree: "民主意识形态 - 战争国策树"
 RUS_Lets_Go: "让我们行动起来！"
 RUS_Lets_Go_tt: "将从§o大日耳曼国§!收回[RUSGetUniqueNamePlain]的§x被窃领土§!"
 RUS_Lets_Go_desc: "经过几代人的痛苦和斗争，我们铸就了一个团结而民主的俄罗斯。从一个极端政治到另一个极端政治的暴政循环终于被打破。然而，我们不能就此止步。数百万俄罗斯的儿女仍在镣铐下劳作。与此同时，罗斯之家及其文化正被占领者所玷污。\n\n是时候号召部队，备齐武器，并制定我们的战斗计划，踏上我们最后的十字军征程。我们的人民将比以往任何时候都更加壮志凌云，因为他们将为了自己的权威沙皇或虚伪的政治极端分子而战。他们将为了自己和自由而战。怀着满腔热情和一个共同目标，我们将向西前进，为一个真正自由的俄罗斯之梦而战。"
 RUS_A_War_of_Liberation: "解放之战"
 RUS_A_War_of_Liberation_desc: "随着第一声炮响的响起和伤亡报告开始传来，我们绝不能忘记我们崇高的使命：建设一个摆脱暴政和占领的俄罗斯的使命。在这场为解放所有俄罗斯人而战的战争中，我们战斗，我们为之牺牲。接下来的几个月将会艰难；家庭将会破裂，生活将永远毁坏。但自由的代价将是值得的。它必须是值得的。\n\n为了自由，我们将继续前行，直到每个俄罗斯人摆脱德国的枷锁。我们将自由和权利的火炬向西方传递，其光芒为被奴役和被监禁者带来希望。我们已经走了这么远；我们必须坚持到底。随着莫斯科在我们的视线中逐渐靠近，自由世界的目光聚焦于我们，我们不能让他们的希望和梦想落空。"
 RUS_Establish_a_Wartime_Economy: "建立战时经济"
 RUS_Establish_a_Wartime_Economy_desc: "在第二次世界大战期间，布哈林的经济计划在德国人开始突袭俄罗斯核心领土之后彻底破裂，之后再也没有恢复过来。我们不会犯同样的错误。怀着这些经验教训，并在我们积极的民众的支持下，我们的工厂将不停歇地生产为我们的解放战争提供物资。只有当自由之光最终照耀在圣瓦西里大教堂的尖顶上时，我们工厂烟囱中升腾的烟雾才会停歇。\n\n多亏了来自OFN和志同道合国家的经济支持，我们可以将煤炭投入我们的经济引擎，足够长的时间以确保取得胜利。布哈林主义的失败将会在我们取得胜利时得以弥补；这只是时间和牺牲的问题，而我们俄罗斯人对此比任何人都更加熟悉。"
 RUS_Lead_Ahead_Valiant_Sons: "勇往直前，英勇之子们！"
 RUS_Lead_Ahead_Valiant_Sons_desc: "虽然我们的开局还算不错，但我们仍然缺乏足够多的男女来持有我们正在生产的步枪。这并不难解决；即使我们的国家还没有完全统一，仍然有数以百万计的俄罗斯人在我们的影响范围之内，我们可以说服他们履行义务，为解放祖国而努力。\n\n从阿尔汉格尔斯克到马加丹，我们将派遣招募人员，并向俄罗斯所有健壮的儿女们发出征兵通知，让他们报名参加战斗。或许我们还可以说服一些在其他自由国家的朋友们鼓励移民回国，为我们的斗争提供帮助。消灭法西斯的黑暗势力将是一项艰巨的任务，但如果我们共同站在一起，为我们存在的权利而战，即使是德军在我们解放军的力量面前也将不堪一击！"
 RUS_The_Wehrmacht_Rots: "德军溃败"
 RUS_The_Wehrmacht_Rots_desc: "在我们最初的向西推进之后，我们意识到尽管最初的估计，我们的陆军在大多数地区都明显处于劣势。无论是我们过于高估了德国军队的能力，还是德国内部的不稳定正在发挥作用，面对这一新的认识，我们都不会袖手旁观。\n\n即使在现在，我们的士兵们也在吞噬着他们所遇到的任何德军抵抗，有时甚至直接要求我们再给他们第二份。持续的胜利消息不仅提高了国内外的士气，而且使我们的工厂表现更佳，招募中心外排起了更长的队伍。以一种美丽而扭曲的讽刺意味来看，似乎整个时间里德国军队只不过是一座腐朽的建筑，我们所要做的就是踢开它的大门…"
 RUS_On_the_Cusp_of_Liberty: "屹立于自由的边缘"
 RUS_On_the_Cusp_of_Liberty_desc: "到时候了。自由世界的目光聚焦在我们身上，随着战争逐渐逼近德国边境，人们屏住呼吸。敌人岌岌可危，拼凑出微弱的防线，虚弱地企图阻止我们勇敢部队的洪流。国内外的人们已经在庆祝或许即将到来的胜利，这就是为什么现在是最后一搏的时刻。最后的冲锋，将可恶的压迫者赶回他们的主人，失败笼罩着他们的精神。\n\n这是敌人的最后抵抗。当我们完成这最后的冲锋，我们就可以回家，重建被夺走的一切。几十年的争斗和屈辱将会被抹去。在几十年的德国统治后，我们将成为终于照耀东欧的光芒。只需最后一次努力，千年之梦——为俄罗斯人民带来自由与解放的梦想，将终被铭刻在历史的篇章之中！"
 SWRW_democratic_partisan_uprising_tt: "§x游击队活动§!将在[RUSGetEasternEuropeNames]展开。"
 RUS_Eastern_Europe_Breathes: "东欧重生"
 RUS_Eastern_Europe_Breathes_desc: "终于结束了。随着俄罗斯最后一场战争的落幕，我们将怀念那些为捍卫俄罗斯民主梦想而献出生命的英魂。随着中欧由于我们的胜利而陷入进一步动荡，我们将开始重建和重新巩固，现在我们可以自由地生活，不再受德国的压迫。\n\n自由的火炬现在从[RUSGetWesternmostCity]照亮到堪察加半岛。我们经受了火的洗礼，终于可以打破极权传统的轮轴。凭借这一胜利，我们向世界展示了俄罗斯可以由她的人民领导，只有她的人民。我们为了这个梦想而战斗并取得了胜利，现在我们手牵手走向俄罗斯历史上一个新而更光明的时代。第二次动乱已经结束；让我们在民主的光明指引下开始我们新的繁荣时代。"
 RUS_Freedum_tt: "国家再次统一！"
 RUS_Freedom: "团结而自由！"
 RUS_Freedom_desc: "[RUSGetUniqueNamePlain]、数十年来，经历了俄罗斯历史上前所未有的斗争，我们再次统一了国家。只要我们在[ROOT.GetLeader]的旗帜下前行，就永远不会再有另一个黑暗时代——但随着我们的胜利，即将迎来的挑战现在更加临近，威胁着我们媲美1917年的复兴。\n\n哈萨克斯坦和大草原对我们的存在仍然持谨慎态度，长时间以来一直被困在旧联盟之中，直到事实上的崩溃。在外东北地区，压迫仍然盛行，被机会主义的日本人夺走了。而俄罗斯最大的失败以一座毁坏的莫斯科的形式嘲笑着我们。在这一切压迫继续围绕着我们肆虐的时候，我们不会袖手旁观。\n\n§a无论如何，俄罗斯的整个领土都将自由。§!"