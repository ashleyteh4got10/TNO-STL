l_simp_chinese:
 RUS_kongo_emigration:0 "东北移民问题"
 RUS_Vladivostok.1.t:0 "北京条约"
 RUS_Vladivostok.1.desc:0 "随着谈判的结束，签署《北京条约》的时候到了。通过和平手段，我们实现了我们的目标，收复了被占领的远东地区。随着条约的签署，它将回归[RUS.GetNameDef]。俄罗斯各地数百万人聚集在街头庆祝，急切地等待着我们的俄罗斯兄弟姐妹重新回到我们光荣祖国的温暖怀抱。"
 RUS_Vladivostok.1.a:0 "[RUS.GetNameDef]的伟大胜利！"
 RUS_Vladivostok.2.t:0 "北京条约"
 RUS_Vladivostok.2.desc:0 "随着谈判的结束，签署《北京条约》的时候到了。通过和平手段，我们实现了我们的大部分目标，收复了被占领的远东地区。尽管我们政府中的一些人对未能夺回符拉迪沃斯托克市表示失望，但随着条约的签署，外满洲地区将回归[RUS.GetNameDef]。俄罗斯各地数百万人聚集在街头庆祝，急切地等待着我们的俄罗斯兄弟姐妹重新回到我们光荣祖国的温暖怀抱。"
 RUS_Vladivostok.2.a:0 "我们很快就将夺回她的。"
 RUS_Vladivostok.3.t:0 "北京条约"
 RUS_Vladivostok.3.desc:0 "随着谈判的结束，签署《北京条约》的时候到了。通过和平手段，我们收复了失去的比罗比詹州，随着条约的签署，它将会回归[RUS.GetNameDef]。\n\n虽然我们政府中有许多人对这一结果感到十分失望，但我们准备继续推进这项条约，欢迎我们的俄罗斯兄弟姐妹回到我们光荣的祖国。"
 RUS_Vladivostok.3.a:0 "聊胜于无。"
 RUS_Vladivostok.4.t:0 "接触共荣圈"
 RUS_Vladivostok.4.desc:0 "在外满洲地区数周的游击队骚乱和[RUS.GetNameDef]与[JAP.GetNameDef]间不断恶化的边境局势的影响下，日本人终于找到我们的政府，要求与我们在北京会面，讨论外满的未来。 我们渴望从日本人手中夺回被占领的远东地区，我们同意与他们会面，并派出我们的高级外交官与日本人谈判。"
 RUS_Vladivostok.4.a:0 "开始吧。"
 RUS_Vladivostok.5.t:0 "比罗比詹问题"
 RUS_Vladivostok.5.desc:0 "比罗比詹州一直是外满游击队运动的发源地，自四十年代末日本的非法占领以来，他们一直在与日本侵略者进行斗争。\n\n这片土地的居民以俄罗斯族为主，他们只想回到祖国温暖的怀抱。随着比罗比詹的回归，当地的俄罗斯游击队活动烈度也会大幅减弱。"
 RUS_Vladivostok.5.a:0 "我相信他们会很高兴摆脱这一切。"
 RUS_Vladivostok.6.t:0 "俄罗斯索取比罗比詹"
 RUS_Vladivostok.6.desc:0 "在第一轮谈判中，[RUS.GetNameDef]要求我们归还比罗比詹州。他们认为这个省的多数人口是俄罗斯人，而且是游击队运动的中心。\n\n归还这片土地将使我们大幅削弱外满的俄国游击队运动。俄罗斯夺回这片失去的州对我们也最有利。"
 RUS_Vladivostok.6.a:0 "把它还给俄国人。"
 RUS_Vladivostok.7.t:0 "日本同意归还比罗比詹"
 RUS_Vladivostok.7.desc:0 "正如许多人所预料的那样，日本同意和平归还比罗比詹州，并表示这样做符合日本的最大利益。比罗比詹问题现在结束了，我们又有了两个选择。我们可以在这里结束谈判，或者，我们可以试试运气，看看能否夺回哈巴罗夫斯克。"
 RUS_Vladivostok.7.a:0 "别把日本人逼得太紧。"
 RUS_Vladivostok.7.b:0 "宣称哈巴罗夫斯克。"
 RUS_Vladivostok.8.t:0 "俄国人准备签署条约"
 RUS_Vladivostok.8.desc:0 "在与俄罗斯政府进行了一些讨论之后，俄罗斯外交官已获准签署该条约。\n\n虽然我们将将把比罗比詹交给俄罗斯，但归还这片领土将解决外满洲地区的绝大多数游击队问题，从长远来看这将有利于我们的帝国。"
 RUS_Vladivostok.8.a:0 "让我们立即加以落实......"
 RUS_Vladivostok.9.t:0 "俄国人索取哈巴罗夫斯克"
 RUS_Vladivostok.9.desc:0 "随着比罗比詹问题的解决，俄国人现在正在要求哈巴罗夫斯克和外满领土的回归。我们政府内的一些外交官和部长们对这个要求感到十分愤怒，但因为俄罗斯人自从统一后变得越来越强大，我们政府中还有一些人不愿意对“第四巨头”说不。这一决定最终落在了首相的肩上。"
 RUS_Vladivostok.9.a:0 "好的。"
 RUS_Vladivostok.9.b:0 "要求妥协。"
 RUS_Vladivostok.9.c:0 "拿回比罗比詹已经足够了。"
 RUS_Vladivostok.10.t:0 "日本人同意归还哈巴罗夫斯克"
 RUS_Vladivostok.10.desc:0 "经过一些谈判，日本最终同意将哈巴罗夫斯克和外满地区归还给[RUS.GetNameDef]。我们的外交官已经在庆祝这次胜利，日本人窃据的大片土地现在将被和平地归还给俄罗斯。"
 RUS_Vladivostok.10.a:0 "马上签署条约！"
 RUS_Vladivostok.10.b:0 "现在，我们来谈谈符拉迪沃斯托克。"
 RUS_Vladivostok.11.t:0 "俄国人准备签署条约"
 RUS_Vladivostok.11.desc:0 "随着外满大部都回到了俄罗斯人的手中。现在，[RUS.GetNameDef]的外交官准备再次与我们在北京的外交官会面，批准谈判中达成的条款。"
 RUS_Vladivostok.11.a:0 "让我们立即加以落实......"
 RUS_Vladivostok.12.t:0 "日本拒绝归还哈巴罗夫斯克"
 RUS_Vladivostok.12.desc:0 "尽管我们做出了努力，日本还是拒绝交出哈巴罗夫斯克和外满，声称他们已经交给了[RUS.GetNameDef]足够的土地。我们是应该盘点一下我们获得的土地然后签署条约，还是应该问问他们是否愿意为哈巴罗夫斯克做个交易？"
 RUS_Vladivostok.12.a:0 "比罗比詹已经足够了。"
 RUS_Vladivostok.12.b:0 "给他们一个价码。"
 RUS_Vladivostok.13.t:0 "俄国人声索符拉迪沃斯托克"
 RUS_Vladivostok.13.desc:0 "现在[RUS.GetNameDef]已经成功占领了外满洲的大部分地区，但现在他们开始声索浦塩港，或者俄语的符拉迪沃斯托克。俄罗斯人看上去是认真的，但这是一个我们应该认真考虑的问题。我们真的应该把符拉迪沃斯托克还给俄罗斯人？还是说我们应该坚持我们对它的所有权吗？"
 RUS_Vladivostok.13.a:0 "当然，他们可以拿回他们宝贵的东方港口。"
 RUS_Vladivostok.13.b:0 "我们需要俄国人做出一些补偿。"
 RUS_Vladivostok.13.c:0 "不，绝对不行！"
 RUS_Vladivostok.14.t:0 "日本同意归还符拉迪沃斯托克！"
 RUS_Vladivostok.14.desc:0 "经过几天紧张的沉默之后，日本最终同意将符拉迪沃斯托克归还给[RUS.GetNameDef]。我国政府对这一消息表示祝贺，因为我国在远东的领土目标终于全面实现了。"
 RUS_Vladivostok.14.a:0 "祖国母亲的胜利！"
 RUS_Vladivostok.15.t:0 "俄罗斯人准备签署条约了"
 RUS_Vladivostok.15.desc:0 "经过数周的谈判，在从我们这里得到了他们想要的一切之后，[RUS.GetNameDef]终于准备在北京再次会面，签署条约，批准已经谈判过的条款。"
 RUS_Vladivostok.15.a:0 "为了帝国的未来……"
 RUS_Vladivostok.16.t:0 "日本人要求补偿"
 RUS_Vladivostok.16.desc:0 "与比罗比詹不同，日本并不急于归还哈巴罗夫斯克。相反，他们提出了一项协议。作为交出哈巴罗夫斯克的交换条件，他们要求保留开采外满洲资源的权利，并获得马加丹州钨矿的开采权。"
 RUS_Vladivostok.16.a:0 "这可以接受。"
 RUS_Vladivostok.16.b:0 "算了，我们只拿比罗比詹吧。"
 RUS_Vladivostok.17.t:0 "日本人要求对符拉迪沃斯托克做出补偿"
 RUS_Vladivostok.17.desc:0 "经过一番考虑，日本外交官向[RUS.GetNameDef]提出了一个他们认为合理的折中方案。日本仍然正处于一场长期以来困扰他们经济的石油危机之中。作为归还符拉迪沃斯托克的交换条件，日本要求获得西伯利亚油藏的使用权，以支撑他们的经济，并确保东北居民安全通行到满洲地区。"
 RUS_Vladivostok.17.a:0 "这可以接受。"
 RUS_Vladivostok.17.b:0 "我们没有符拉迪沃斯托克也一样活着。"
 RUS_Vladivostok.18.t:0 "日本拒绝归还符拉迪沃斯托克"
 RUS_Vladivostok.18.desc:0 "日本拒绝移交港口城市符拉迪沃斯托克，称它是帝国的重要城市，对维持他们在日本海的优势至关重要。他们不会简单地把它归还[RUS.GetNameDef]。我们是应该评估一下我们的实力然后签署条约？还是问问他们是否愿意为符拉迪沃斯托克做交易？"
 RUS_Vladivostok.18.a:0 "这已经足够了。"
 RUS_Vladivostok.18.b:0 "给他们一个价码。"
 RUS_Vladivostok.19.t:0 "远东回归"
 RUS_Vladivostok.19.desc:0 "经过多年的分离，远东地区终于准备好重新加入我们的祖国。在整个联邦，人们正在庆祝俄罗斯合法领土的回归——总统履行了他将所有俄罗斯公民从暴政的压迫中解放出来，并将我们的合法领土重新纳入俄罗斯联邦的伟大承诺。"
 RUS_Vladivostok.19.a:0 "欢迎回来。"
 RUS_Vladivostok.23.t:0 "俄罗斯请求我们的支持"
 RUS_Vladivostok.23.desc:0 "在俄罗斯统一之后，该国相对保持了沉默，直到现在。一位来自[RUS.GetName]的使节已抵达华盛顿，他们试图与日本就外满洲领土的归还进行谈判。他们认为，在我们的帮助下，他们可以对日本施加更多压力以割让该领土。\n\n这个年轻的俄罗斯国家展示了潜力，而且在我们的帮助下，他们可能会在未来更加亲近我们；然而，我们不能忘记谈判的另一方，即日本。\n\n日本作为我们的敌人，我们最希望的无疑是削弱日本，但国务院对日本是否有兴趣放弃土地表示怀疑。谈判很可能会失败，而日本人也会记住这样的侮辱。然而，拒绝也会让俄罗斯人生气。\n\n最终的选择在您手中，总统先生。"
 RUS_Vladivostok.23.a:0 "叫一个俄国人到洛杉矶来，快点！"
 RUS_Vladivostok.23.b:0 "这与我们无关。"
 RUS_Vladivostok.24.t:0 "美国拒绝"
 RUS_Vladivostok.24.desc:0 "尽管我们的外交官员做出了最大努力，美国人已经拒绝协助我们夺回符拉迪沃斯托克。我们外交部门中的一些人将此归咎于美国国务院改善与日本关系的努力，而其他人则指出我们政权之间的意识形态和政府差异。无论原因如何，我们正式被冷落在一边。\n\n报告表明，日本人将美国的不参与视为对他们立场的认可，这一断言仅仅几天的时间就在共荣圈中迅速传播开来。即使是对我们事业表示同情的国家也开始与这个问题保持距离。如果我们要夺回符拉迪沃斯托克，我们必须全力以赴，毫不妥协地运用外交手段。"
 RUS_Vladivostok.24.a:0 "谁在乎美国人的想法？"
 RUS_Vladivostok.25.t:0 "美国同意"
 RUS_Vladivostok.25.desc:0 "好消息！我们的请求已经被美利坚合众国接受。当我们与日本进行下一轮谈判时，美国国务院将在场进行调解，并巧妙地将谈判转向对我们有利的方向。我们或许有机会成功地实现这一目标。\n\n报道显示，日本将美国的介入视为接受我们主张的压力。当然，这是正确的。即使是与大东亚共荣圈关系密切的国家，也在敦促日本找到一个“光荣解决方案”来解决符拉迪沃斯托克问题，以免遭到自由国家组织的报复。尽管美国采取军事行动的可能性几乎为零，但我们不会告诉日本。让另一个太平洋战场的幽灵在他们的脑海中挥舞，而他们的想象力将做出余下的一切。"
 RUS_Vladivostok.25.a:0 "谢谢你，美国（俄语）！"
 RUS_Vladivostok.26.t:0 "比罗比詹谈判"
 RUS_Vladivostok.26.desc:0 "不可救药的[RUS.GetNameDef]蛮子竟然厚颜无耻地要求将比罗比詹地区归还给他们的政府。这些愚蠢的人相信他们那个几年前才从无政府状态中崛起的可怜国家有权与旭日之国进行谈判。更糟糕的是，世界似乎都支持他们。\n\n为了保全面子，我们必须出席这次谈判，并且必须本着诚意去做。正如日本一句古谚所言，”给敌人送盐“。然而，也有人说，”嘴是一切灾难的根源“。愿这些俄国忘恩负义之徒受此诅咒。\n\n比罗比詹地区对我们来说价值不大。这个地区人口绝大多数是俄罗斯族，是个游击队和叛乱分子的温床，我们几乎无法承担对其广泛动荡的治安维护成本。我们可以干脆放弃这个地区。对我们的预算和帝国的稳定来说，这肯定是个幸运的发展。然而，这样的行动会非常不受欢迎，尤其是在陆军中。当我们试图平衡海军和陆军的利益时，惹恼将军们可能不符合我们的利益。\n\n但还有另一种选择。我们可以将俄罗斯人请到谈判桌前，并要求交换。俄罗斯在自然资源方面非常丰富，特别是石油和贵金属。如果我们能够出售这片无用的土地，以换取我们急需燃料战争机器的石油……呃，将军们肯定不会反对这个，对吗……"
 RUS_Vladivostok.26.a:0 "没有累赘的帝国是最强大的。给他们比罗比詹。"
 RUS_Vladivostok.26.b:0 "可悲。这些人根本不懂外交，让他们几年后再来。"
 RUS_Vladivostok.26.c:0 "既然我们可以从这种轻率行为中获利，为什么还要免费放弃土地？把他们带到谈判桌上来。"
 RUS_Vladivostok.27.t:0 "日本接受提议！"
 RUS_Vladivostok.27.desc:0 "谈判桌上传来了令人振奋的消息！我们的外交人员通过强硬的坚持、适当的补偿以及该地区俄罗斯族的一些引人入胜且完全巧合的骚乱，成功拿回了比罗比詹省。我们离实现统一整个俄罗斯大陆的目标又近了一步。\n\n然而，我们的谈判工作并未结束。我们的人民，尤其是我们好战的政治家们，还有最近被我们解放的游击队员们，都希望我们能够进一步前进，争取哈巴罗夫斯克、整个滨海边疆区甚至是符拉迪沃斯托克。这需要我们持续进行谨慎的谈判，一些强硬手段，也许还需要一些外国的帮助，但我们会全力以赴，为了祖国和人民的利益而奋斗。"
 RUS_Vladivostok.27.a:0 "解决了一个问题，还剩两个。"
 RUS_Vladivostok.28.t:0 "日本退出谈判！"
 RUS_Vladivostok.28.desc:0 "致[RUS.GetName]的领导层，\n\n尽管我们意识到管理比罗比詹省的问题，但我们不能接受任何不给予我们政府进行领土割让的最低尊重的提议。因此，我们无法完成接受贵国的提议。\n\n此外，这些谈判中显示出的激烈行为让我对未来的讨论可行性产生了质疑。因此，我们将中断可见未来的讨论。\n\n如果这对你们来说是个不幸的结果，我们表示歉意，因为对我们来说也是如此。 \n\n签名，\n[JAP.GetNameDef]的西田须贺"
 RUS_Vladivostok.28.a:0 "这群蠢货去死吧！"
 RUS_Vladivostok.29.t:0 "日方还价"
 RUS_Vladivostok.29.desc:0 "日本人已经对我们就“比罗比詹”地区提出了还价。他们要求我们支付8亿美元，他们声称这是他们割让给我们的领土所必需的补偿费。我们政府内部有人质疑这个地区是否值得花这么多钱，但也有人抗议说，我们任何合法领土的价值是无法估量的。"
 RUS_Vladivostok.29.a:0 "付钱给他们。"
 RUS_Vladivostok.29.b:0 "无理的要求。"
 RUS_Vladivostok.34.t:0 "胜利就在眼前"
 RUS_Vladivostok.34.desc:0 "经过数月紧张的妥协、谈判和强硬手段，日本和我们的政府终于达成一致，让滨海边疆区和哈巴罗夫斯克重新归入我们的行政范围。\n\n我们的外交官和政府对谈判的成功感到惊讶。现在，我们正接近收复远东地区日本占领的最后一个据点——符拉迪沃斯托克市。与我们已经夺回的资源丰富的州不同，符拉迪沃斯托克十分独特。它不仅拥有大量的基础设施和充分的发展，还是外满洲唯一拥有温水港的城市。这对于推动我们的经济东进和加强贸易路线至关重要。因此，我们必须竭尽全力通过一切必要的外交手段，彻底夺回“东方之王”。\n\n然而，正如我们将全力夺回符拉迪沃斯托克一样，我们预料到日本人同样致力于保留这个港口，尤其是考虑到俄罗斯在远东地区的复兴可能给他们在朝鲜和满洲的势力带来的问题。更为重要的是，由于五十年代为“Dongbeiren”，即韩国、日本和中国人腾出空间，俄罗斯人遭到了迁移，俄罗斯游击队无法为我们所用。\n\n这场外交战斗将是我们在共荣圈的会议室和办公室中所面临的最艰难的战斗之一。很快，条约将会签署，符拉迪沃斯托克和远东地区的命运将永远封存。让我们用我们所有的智慧、技巧和金钱说服他们，并以辉煌的胜利结束！"
 RUS_Vladivostok.34.a:0 "闪耀的东方之珠已在我们眼前！"
