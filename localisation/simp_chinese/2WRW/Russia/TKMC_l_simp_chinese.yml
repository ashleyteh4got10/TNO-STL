 kmcgp.666.t:0 "你他妈是AI还是挂逼！"
 kmcgp.666.d:0 "这是因为人工智能实际上有一些海军经验来与盗版机制互动，所以你不应该阅读这个，人类。但是嘿，来吧，如果你想作弊的话，我有什么资格阻止你，是你自己做的决定。我想如果你发现了这个，你就达到了海盗的顶峰。 Yar har fiddle dee dee 成为一名海盗是可以的，做你想做的事，因为海盗是自由的。（译注：最后是You Are a Pirate的歌词）"
 kmcgp.666.a:0 "你是一个海盗！"
 kmcgp.1.t:0 "谢德林的大计划"
 kmcgp.1.d:0 "尤马舍夫坐在他的办公桌上，格里戈里·谢德林站在他面前。“在抗德战争的最后几天里，有一项计划就是让一小队潜艇从太平洋航渡到阿尔汉格尔斯克，尽一切可能试图让我军夺回战争优势，我敢肯定你还记得这事。”“我记得。”尤马舍夫好奇地答道，“当然，因为阿尔汉格尔斯克沦陷后不久联盟就解体了，这一计划永远无法实现，但是据我所知，西俄革命阵线声称他们在西俄战争期间夺回了阿尔汉格尔斯克而且……”“没门，格里戈里。”尤马舍夫坐回他的椅子上打断了谢德林的话，他原本期望有什么严肃认真的建议可以帮助舰队摆脱困境，但是事与愿违，他的希望换来了一个牵强、不可行且无济于事的计划。\n\n “你该不会建议我们应该航向阿尔汉格尔斯克吧？这顶个卵用？他们那儿的港口冻得比我们这里还结实，我们听说那里被轰炸得一片狼藉，况且就算真的要去那儿，我们的战舰连港口都开不出去还想横渡太平洋……”“没错，但是”谢德林试图插话。“……相比旧联盟，我们大部分手下对于劫掠更为热诚，如果要实现这个目标，我们就得穿过一整块他妈的冰层，要么通过美国或者日本控制的海域来实现，不用我提醒你，我们在他们俩20年的对抗中能活下来已经很不错了。”\n\n 谢德林停了片刻，“那么，这一切都是为了什么，首长？我们的每一步都跟随着您，当联盟崩溃时我们留在符拉迪沃斯托克，当主席团瓦解时我们跟随您来到这里，我们做的一切，一切困扰着我们的麻烦，都是为了保护舰队。如果我们留在这里，舰队将会慢慢分崩离析，老兵们会一个个死去，这就是结局。我们可以等待亚戈达和他的瘪三们重整旗鼓，但是我们还有多长时间？即使经历了这一切我们都还是红色舰队的水兵，我们搜寻敌人，与之交战，并赢得胜利。我们要为这最后的努力倾尽所有，一路打回家，去跟联盟最后一支还在坚持战斗的部队汇合。不论我们将成功还是失败，但是我们至少要采取行动。”"
 kmcgp.1.a:0 "“把你的计划递给我，解散。”"
 kmcgp.2.t:0 "一支舰队的阴影"
 kmcgp.2.d:0 "伊万·尤马舍夫矗立在码头上，双手深深地插进口袋，冷风刮过他的鼻子。一艘小船，改装过的渔船，奉命被派去劫掠过路船只后返回港口。停靠在老旧的十月革命号旁边，与战列舰的尺寸相形见绌。绳索扔到一旁，她被码头工人固定住，放下跳板。衣冠不整的船长走了下来，自从联盟解体以来他就一直在舰队服役了。“运气不好，格里戈洛维奇？”尤马舍夫问，想让他振作起来。“嗯，首长。”他向停在尤马舍夫身后的卡车招手，车门打开，两个人开始向渔船跑去，第三个人抱着一副担架紧随其后。“雇佣兵。就在我们准备登船的时候，一颗子弹击中了卡尔加诺夫的喉咙。” \n\n尤马舍夫表情凝重起来，又一个人逝去了。卡尔加诺夫从战时开始就在舰队服役了，当其他人为了自己的命运各奔东西，决定自己抢劫单干而不是跟舰队分享的时候，卡尔加诺夫没有被诱惑。一切的努力都是为了保护他这样的人，仍然坚信红海军传统的人，他们才是最值得保存的遗产。在这里，追随他的人，在一支生锈舰队的阴影中被从一艘小渔船上抬下来，在这世界的遥远角落，以一个贼的身份死去。他本应得到比这更好的结局。\n\n尤马舍夫将目光从他面前抬过的担架上移开后，他才注意到注意到格里戈洛维奇的目光正凝视着他，直到两人的目光交汇之时才恍惚起来。"
 kmcgp.2.a:0 "有些东西不复以往。"
 kmcgp.3.t:0 "油轮"
 kmcgp.3.d:0 "我们的一伙人带着一艘大型油轮返航了，在被领航到我们的港口并卸下货物之后这艘船已经获准返回大海。石油对于保持我们舰队的运转是非常重要的，并且到可以预见的未来我们的行动都可以继续下去了。"
 kmcgp.3.a:0 "立即将其输送给舰队!"
 kmcgp.3.b:0 "把这些油存起来。"
 kmcgp.4.t:0 "船运武器"
 kmcgp.4.d:0 "我们最近从一艘路过的货轮上抢走了一批武器。相对于运送的致命货物，船的防御却很不够格，尽管船上的雇佣兵准备负隅顽抗，但是当我们的驱逐舰向货船附近进行了数轮齐射后他们就停下了脚步。随着雇佣兵们缴械投降，我们的舰员们安全地登上了船，扛走了尽可能多的板条箱，帮他们减轻了运输的负担。"
 kmcgp.4.a:0 "成功！"
 kmcgp.5.t:0 "货轮"
 kmcgp.5.d:0 "我们的一伙船员最近从一艘路过的货轮上搞到了大量的货物，包括服装，香烟，酒，食品和电子产品，目前都被送往我们的商店进行分发，当然，旗开得胜的船员们肯定把其中很大一部分据为己有了。这肯定是令人精神大振的，除非我们选择在黑市上出售这些货物换取更“有用”的东西。"
 kmcgp.5.a:0 "成功！"
 kmcgp.6.t:0 "§R失败！§!"
 kmcgp.6.d:0 "我们派出的搜寻劫掠目标的船空手而归。船长和船员们提供了几个借口，但重要的是他们没有完成任务。现在要做的就是设法吸取教训，改善情况，然后再试一次。"
 kmcgp.6.a:0 "胜败乃兵家常事"
 kmcgp.7.t:0 "美国货轮"
 kmcgp.7.d:0 "我们的一艘船在劫掠了一艘从美国方向开来的货轮后刚刚返航了，尽管船员都是印度人，但是船上却堆满了美国制造的货物，这些货物被迅速转移到我们的仓库进行处理。这次开洋荤对于舰队是个巨大的好消息。"
 kmcgp.7.a:0 "成功！"
 kmcgp.9.t:0 "美国船运武器"
 kmcgp.9.d:0 "我们发现一艘悬挂美国国旗的船正在进入鄂霍茨克海，不出所料，她正满载武器驶向马加丹港来支援美国的法西斯傀儡。在宽阔的太平洋上，面对美国舰队的护航进行这样的袭击当然是自杀行为，但是这里距离日本领海如此之近，也为了随时向周边撇清对马加丹的支持关系，因此这艘船除了一小撮全副武装的雇佣兵之外没有其他的防御。尽管他们用轻武器持续射击并发射了几枚肩扛反坦克火箭，但当第二艘潜艇浮出水面并警告负隅顽抗就要吃鱼雷后，抵抗很快就结束了。看起来船长明白比起他陪着整条船一起下去喂鱼还是只损失一部分货物比较合算，我们也完全同意这一观点。"
 kmcgp.9.a:0 "成功！"
 kmcgp.10.t:0 "美国油轮"
 kmcgp.10.d:0 "我们在鄂霍茨克海捕获了一艘美国大型油轮。该船悬挂美国国旗并在一家美国公司注册，并且在我方登船之时不断发射轻武器和水炮抵抗，我们推测船上有大量的雇佣兵。登船队接二连三地爬上右舷甲板，但是当他们扫清了甲板并造成大量人员伤亡之后才发现这里根本没有什么预期中的雇佣兵而是一大批俄罗斯船员。看来他们是被美国人雇去的廉价苦工，但是他们这一趟航行的薪水就比多数俄罗斯人一年的收入都要多了。不幸的是，对于那些幸存下来的船员来说，因为他们的货物正在被运往我们的港口，他们可能将一无所获。他们期待发财，但是只有他们的资本主义主子才能得到真正的利润，而那么多的人为了确保自己能得到一点儿掉下来的面包渣就失去了生命。当这笔不义之财被分享给我们饥肠辘辘的舰队之后，它真正的价值才得以从资本家手中释放出来。"
 kmcgp.10.a:0 "立即将其输送给舰队!"
 kmcgp.10.b:0 "把这些油存起来。"
 kmcgp.11.t:0 "日本货轮"
 kmcgp.11.d:0 "我们的一艘船满载而归了！日本货！衣服，一些奇特的食品，一些珠宝和一些有趣的新式电子产品。行动组将得到他们应得的一份，其余部分将被出售。 "
 kmcgp.11.a:0 "成功！"
 kmcgp.12.t:0 "日本船运武器"
 kmcgp.12.d:0 "我们劫掠了一艘我们认定的普通货船，但事实证明她运载了大量日本制造的武器。我们非常困惑这艘船为何离开这一海域向东航行，不过我们决定不钻牛角尖了并庆幸于自己的好运。"
 kmcgp.12.a:0 "成功！"
 kmcgp.13.t:0 "日本油轮"
 kmcgp.13.d:0 "我们拦截了一艘刚刚从满洲出港不久的中国油轮并将其护送到了堪察加，船员们不愿意进行任何战斗，并且在我们取走了所需的石油后告诉我们，他们想要开往美国。为了回报他们对我们的事业所做的慷慨贡献，我们解决掉了他们好战的船长并把他们送上了航路。"
 kmcgp.13.a:0 "立即将其输送给舰队!"
 kmcgp.13.b:0 "把这些油存起来。"
 kmcgp.14.t:0 "坚守防线"
 kmcgp.14.d:0 "“我将授权你从森林中撤退，但是你得守住现在的阵地！”尤马舍夫海军上将对接线员说，“是，空中支援正在……指挥官……指挥官听着！我们将从海路接你撤离预设阵地。你必须不惜一切代价把阵地守住！我们付出了那么多的努力，一切的希望就寄托于你们的勇气和决心。当然，毋庸置疑，指挥官，祝你好运。”“我们应该派出十月革命号，她会狠狠教训那些狂信徒。”科列斯尼克海军上将建议道，“如果他们打算跟舰队干架，就该跟舰队正面硬杠。”“你说得对，我该派阿尔希波夫指挥她赶过去。叶戈罗夫！”一个慌里慌张的脑袋伸进了房间，“立刻把阿尔希波夫叫来。”\n\n“是，上将同志！”一声回答之后他就匆匆跑了出去。\n\n“我们这里也需要加快最终准备工作，我不知道海军步兵能够在那群暴民面前撑多久。”"
 kmcgp.14.a:0 "“安德烈耶夫！给我接谢德林！”"
 kmcgp.15.t:0 "朋友带来的礼物"
 kmcgp.15.d:0 "安德烈在堪察加彼得罗巴甫洛夫斯克市以北经营一家锯木厂。小本生意，主要为城市提供能源而且大部分生意都是跟舰队谈的，当然这并不能阻止舰队派来的税务员每月造访。尽管安德烈经常以老主顾的身份砍价想获得更优惠的税率，但这无济于事。不过事情还没那么糟糕，至少访客是古林中尉。是的，他当然是来收税的，但是也捎来了舰队从过往船只和走私网络中获得的许多油水，或者更直白的讲是古林的同伙拿到的东西，瞒着舰队偷偷转交给他出售，这样他俩都能获得可观的利润。\n\n“安德烈！过得如何？见到你真高兴，生意跟我猜的一样顺利吗？”古林向着坐在厂子外面的安德烈边走边问，\n\n“我打包票你是不是搞到了什么好东西，能少扒我两层皮？”安德烈干巴巴地回应。\n\n“哦实际上，只是给你的，跟他们没关系。”，他开始在卡车后面摸索着，翻出来两瓶伏特加。 \n\n“呃，多少钱？”当古林开始咧嘴笑着走向他时，安德烈问道。\n\n“哦，想啥呢。”古林哈哈大笑，“送你啦，听说你家上个月添了一个小子来庆祝一下，这瓶送给你，这瓶等他大一点了再送给他。”\n\n安德烈大吃一惊，“哦，嗯谢谢，尼古拉，真的假的，你不用这么客气。”\n\n“哦，废话。”古林把瓶子塞到安德烈手里，“最近我的小生意进展顺利。有福同享是应该的，特别是我忠实的合伙人。”"
 kmcgp.15.a:0 "谢谢你，尼古拉"
 kmcgp.16.t:0 "审判"
 kmcgp.16.d:0 "尼古拉·古林海军中尉瘫坐在桌子前的一把椅子上，一只眼睛肿了，挂着黑眼圈，明显没睡。坐在他面前的是两个军官和一个政委。站在他身旁担任检察官的军官继续道，“我要传唤我的下一位证人，安德烈·伊格纳捷夫。”古林心头一沉，别说下去了。\n\n“伊格纳捷夫同志，你是否向舰队军法官发誓，在本法庭实话实说？”坐在桌子中间的军官询问道。\n\n“我发誓。”安德烈一口咬定。\n\n“起诉可以继续了。”\n\n检察官转向安德烈，“伊格纳捷夫同志，你认识这个房间里的尼古拉·古林中尉吗？”安德烈缓缓点了点头。“请说出来，伊格纳捷夫同志。”检察官要求道。\n\n“我认识。”安德烈回应。\n\n“请宣读你提交给本庭的证词，伊格纳捷夫同志。”\n\n安德烈慢慢抽出一小张纸开始念，“在过去的数年中，尼古拉·古林海军中尉将大量从舰队中盗窃所得的货物转交给我出售以牟取暴利，我将把这些物品全部交还给舰队，希望获得宽大处理。”\n\n“是不是已经交出来了？”中间的军官问道。\n\n“是的，长官。”检察官指向左手边的桌子回答道，“您可以看到这里有很多物证，长官。”桌子上有一块手表，一套餐具，一些盘子和一瓶伏特加。\n\n“很好。”中间的军官说，“我想这足够了，伊格纳捷夫同志你可以离开了。”伊格纳捷夫转身离开，试图躲避古林的目光。但这其实没必要，古林头都不转只是茫然地望着远方。“古林同志，在法庭上提出的所有指控中，您均被判有罪。由于您长时间犯下这些罪行，而且您个人以损害舰队为代价而获得了可观的经济报酬，我认为这足以判处最高刑罚，死刑立即执行。”"
 kmcgp.16.a:0 "法槌落下，古林被带了出去。"
 kmcgp.17.t:0 "忠诚的代价"
 kmcgp.17.d:0 "最后一个箱子被装上了格里戈洛维奇用于劫掠的小船。他们终于取得了一定的成功。那艘中国船被他们的突袭完全惊呆了，不发一枪一弹就乖乖交出了一部分货物。“干得好，伙计们，舰队今天为你们而骄傲，科兹洛夫，带我们返航。”\n\n科兹洛夫死死站着。“我们为什么要回去？为了将我们来之不易的战利品交还给舰队，这样我们就能像卡尔加诺夫一样再一次被派出去送死了？长官，我们之间讨论过了，我认为我们最好应该沿着海岸继续前进，听说萨维茨基船长和他的船员们都已经去了那边，他有自己的渠道并且可以让我们把所有赚来的留给自己。”\n\n格里戈洛维奇停顿了一下，看样子像是兵变。他把手放在手枪枪套上，然后严厉地回应道：“科兹洛夫，少废话了，带我们返航，我保证你们能得到你们应得的那一份。”\n\n科兹洛夫纹丝不动，“长官，这是我.们.挣来的，不是尤马舍夫！为什么他们坐在岸上无所事事就能从我们的劳动里分一杯羹？”\n\n“你是红海军的水兵，科兹洛夫，你有为舰队和国家服务的责任，带我们返航。”格里戈洛维奇紧张起来，他可以感觉到放在枪套上的那只手开始发抖。\n\n科兹洛夫吐了口唾沫，“我们的努力养活了那群肥头大耳的猪，像卡尔加诺夫那样的好人都死了，尤马舍夫浪费了一切只为了让那些几年前就该沉了的破船继续漂在水上。”格里戈洛维奇听够了，他掏出手枪对准了科兹洛夫，转头看向他右手边的水兵：“西多罗夫，把科兹洛夫给我抓……”格里戈洛维奇瞪大了双眼，当他意识到发生了什么的时候已经太晚了，西多罗夫开枪了。格里戈洛维奇倒在甲板上，他的尸体被毫不客气地扔下了船，过了没一会儿，船就转头北上了。"
 kmcgp.17.a:0 "我们正在失控。"
 kmcgp.18.t:0 "小酌"
 kmcgp.18.d:0 "伊万·马斯连尼科夫海军上校正坐在昏暗的办公室里跟格里戈里·谢德林上将共享一瓶伏特加。这里无事可做，并且无论如何这两个人也没有心情干些别的。“这他妈烂透了，格里戈里。”\"马斯连尼科夫仰起头晃了晃他的玻璃杯，“尤马舍夫正走向失败，格里戈洛维奇再也回不来了。”谢德林点了点头，眼睛只是盯着面前的桌子，马斯连尼科夫继续道，“我以前说过这种情况会发生，显然是因为放弃共产主义导致了这一点，没有目标，没有动力，人们除了自己的生存之外毫无追求。没有了纪律，他们会变得更加绝望，而那些军官中腐败的秘密资本家一直在利用这种恐惧为自己牟利。”\n\n谢德林眯着眼睛，虽然马斯连尼科夫可能有点热血上脑了，但他确实言之有理。官兵们被告知“为舰队做点事”，但除非你打一开始就在这里，否则意味着收获寥寥，即使是老兵们也开始失去信心了。他们所能看到的只是他们自己的绝望处境，偶尔一次成功的劫掠带来的是逃走的门票，逃离残留的那些模糊不清的理想和生锈的军舰。\n\n谢德林知道，必须得做点什么了，除了加强纪律之外，还要打击腐败和舰员们自行其是进行的海盗活动。舰队需要让精气神回来，需要一个目标。如果舰队要继续存在，就要证明自己存在的正当性。随便哪个绝望的家伙拉上几个狐朋狗友和一艘小船都可以成为海盗，我们必须有更长远的志向。谢德林举起了他的玻璃杯，“敬不屈的苏联人民”。马斯连尼科夫的眼睛闪闪发亮，他也举起了自己酒杯。"
 kmcgp.18.a:0 "“敬不屈的苏联人民。”"
 kmcgp.19.t:0 "水天线上的船"
 kmcgp.19.d:0 "自从离开波特兰开始，佩内洛普号的船长约翰·马修斯就对这趟航海有着不好的预感。他违抗了更理智的判断，允许一个传教士登上了这艘船，这个小伙子声称他要将主的美言传播给绝望的俄罗斯人。尽管他在介绍自己时自称艾萨克，瞥了一眼摊开的护照之后，却发现小伙子的名字叫约拿——他被其他船只拒载后决定隐藏这一点。显然，这位初出茅庐的传教士的名字和他所选择的职业是个太不吉利的搭配，特别是他还希望横渡大海。清晨的赤色朝阳照耀着，然后大概上午11点34分，发现水天线上有一艘船正等待着佩内洛普号靠近。每一次改变航向后那艘船都会跟着走。随着两船越来越近视线逐渐清晰，马修斯可以辨认出一艘小型驱逐舰的轮廓，虽然是一艘很陈旧的型号，大概是上次战争中剩下来的。那不可能是日本人，不仅因为船太旧，而且除非迫近领海否则他们通常会离开独行的美国船。为了一小批货物酿成外交事件毫无必要。\n\n也许是墨西哥人或者加拿大人？但是船都快开到俄罗斯了，他们绝不会跑到这么远的地方来。会不会是中国人？他们真的有海军吗？反正不会是俄罗斯人，他以前去过马加丹，那里除了美国货轮和破烂不堪的俄国渔船外什么都没有。但是那艘神秘的驱逐舰越来越近了，不论他们是哪边的，似乎都要准备登上甲板了。马修斯广播通知他的乘客们去安全舱里躲藏，他自己将留在舰桥上，并祈祷接下来的相遇平安无事。"
 kmcgp.19.a:0 "他们是谁？"
 kmcgp.20.t:0 "改变战术"
 kmcgp.20.d:0 "当驱逐舰越来越近，他可以看见飘扬的舰旗。虽然他并不认识，但是上面的红星和镰锤暗示它属于苏联。但是他们不是很多年前就崩溃了吗，而且就他此前在马加丹四处打听到的，这一地带昔日苏联的残余势力已经被赶回遥远内陆的伊尔库茨克。尽管如此，当驱逐舰在他旁边并排航行的时候派出了一艘小艇向他的船驶来，他在舰桥上用双筒望远镜望着对面，他看到一个穿着海军制服的大胡子男人同样望着他。这些人肯定马上就要登船了，他躲在舰桥的操控台下面，门已经锁好了，他希望这些人能无视他不论在船上干点什么都行然后就走人。\n\n有谁敲了敲舰桥的门，他从操控台后面把头伸出来，正好跟那个敲门的人四目相对，他在……微笑？他又敲了敲门，带着一声瓮声瓮气的俄国口音“Hello”，他小心翼翼地走到门口，透过窗户，那个看起来像军官的男人站了起来，在他的胳膊下面夹着一个剪贴板，两侧是两名水兵，每个人都挎着冲锋枪。当马修斯打开门时，军官仍然微笑着用磕磕巴巴的英语道：“你好，先生，我叫米哈伊尔·雅孔托夫中尉，苏联海军。我在这里检查文件。”马修斯对这个人的友善个性感到安心，但是同样感到困惑。文件？苏联海军？他正在前往马加丹自由邦，苏联已经亡了几十年了。他向这个人展示了他所拥有的文件，但是这人熟练地叹了一口气。马修斯非常确定他甚至看都没看，并怀疑他压根没打算看。“对不起，先生，您没有填写正确的进口文件。必须扣押部分货物以支付进口税。”进口税？！正确的文档……哦。他们是海盗，彬彬有礼且装备精良，拿官僚机构当挡箭牌的海盗。"
 kmcgp.20.a:0 "那一定是我见过的最优秀的海盗。"
 kmcgp.21.t:0 "不速之客"
 kmcgp.21.d:0 "叶夫根尼·伊万诺夫船长走出克里斯汀的家，去码头跟他的船上的手下碰头。尽管在美国看到俄国人有些奇怪，但在阿拉斯加有一个小小的移民社区，因此他的出现并没有引起太多的注意。只要没人知道交易的具体内容，包括他打算装船运走的东西和他与克里斯汀的关系，他就会感到放心。不幸的是，叶夫根尼的乐观没有持续多久。转过一个墙角，他跟四个西装革履握着手枪的男人迎面相遇。他本能地想去掏自己的枪，但是很快想到现在把双手高举过头更为妥当。“叶夫根尼·伊万诺夫，你被捕了。跟我们走一趟吧，俄国佬。”他们中的一个说着收走了他的手枪，把他的双手铐在背后，然后将他粗鲁地推进了一辆汽车的后面。叶夫根尼一边言语攻击这些人和他们的母亲，一边试图为自己的清白抗议，但是他意识到这是徒劳的而选择保持沉默。他被指示应当这样应对，他只希望手下能够意识到出了岔子，然后扔下他开溜。“看起来你的小生意做的不错，叶夫？”说话的那个人从乘客座位上扭过头来。现在叶夫根尼意识到他们不是平常的警官。等下，他们到底是警方还是他之前得罪过的别的什么走私团伙？这些人怎么知道他的名字？那个人继续说，“何不如我们做个安排让事情回到正轨？”"
 kmcgp.21.a:0 "“苏卡不列”"
 kmcgp.22.t:0 "交易"
 kmcgp.22.d:0 "男人大笑了片刻，然后变成了死寂，直勾勾地盯了叶夫根尼几秒钟。“你在为一个与合众国为敌的组织积极工作，我们了解你的人脉关系还有你工作的对象，你代表一个从事阻挠美国航运业，抢夺美国货物，勒索美国公民的团伙，你已经被视作美利坚合众国的敌人。”叶夫根尼的嘴唇开始变得干燥，那个人继续说，“我们都知道因为你的活动，所以你的合伙人，克里斯汀·巴特勒，因窝藏和为合众国的敌人提供庇护将面临叛国罪指控，并可能被判处死刑。”叶夫根尼开始感到头晕，但是那个男人一直在说，为了让他保持足够清醒还摇了摇他， “除非我们可以达成一项协议。” \n\n叶夫根尼微微点了点头。那人再次开口，“继续这趟航行，虽然你在这里的活动是个麻烦但是最终并不重要。当你到达港口后就与我们取得联系，向我们提供你方行动性质，能力，装备库存，人员水平和方法的情报。最重要的是介绍你方过去和未来劫掠目标的详细情报。我们确信你会成为一个可靠的盟友，除非你希望巴特勒小姐为你的行为买单。”这根本不该是这样，叶夫根尼感觉遭了瘟。他根本别无选择，只好接受，他咕哝出一声虚弱的“OK”。\n\n汽车停了下来，几乎正好是在他被铐走的地方。“谢谢你，伊万诺夫先生，我打包票你将和局里长期保持密切联系。一路顺风。”伊万诺夫踉跄地回到自己的船上，他的自由和尊严用了仅仅不到十分钟就化为乌有了。"
 kmcgp.22.a:0 "希望这对我们的行动没有造成太大影响。"
 kmcgp.23.t:0 "三人同舟"
 kmcgp.23.d:0 "卡马克正指挥着一艘小型渔船，将一小批武器运往满洲北部的一个偏远村庄，出售给当地的游击组织。他和另外两个船员一样都是科里亚克人——堪察加北部的原住民。他曾经为了想摆脱长久以来的赤贫生活而在舰队服过役。他在曾经期待过的地方，或者曾被许诺过充满冒险和机遇的生活中一无所获。反之，他被原本以为是同志的人排斥，总被派去艰苦的工作和不利的岗位。当他被选去执行真正的任务时，他感到非常高兴，他终于期望有机会证明他的个人价值和对舰队的奉献精神，而到目前为止，舰队实际上并没有给他带来什么好处。他被告知将去执行此次任务，因为他会“跟满洲人或者那些他妈的什么游击队混在一起看不出来”，但是他只看到了一艘破旧的渔船，两个小伙子，还不到16岁，和那时候的他自己一样洋洋得意充满热情，令他的心里十分难受。\n\n当那艘日本驱逐舰从雾中冲出的时候他只看到他们脸上恐惧的表情，汽笛震耳欲聋，朝他们警铃大作。有声音正在从日舰的扬声器里传出，但是他听不懂在说什么。直到数发轻武器的子弹打在船舷上，他拼命掉头试图原路返回，但是这一切已经无能为力了，子弹不断袭来，直到驱逐舰的主炮射出的一发炮弹炸碎了小木船。"
 kmcgp.23.a:0 "红海军制造。"
 kmcgp.24.t:0 "呼吁美国"
 kmcgp.24.d:0 "“我一直在研究你的建议，谢德林海军中将，虽然你关于整军和反贪腐的建议有很多可圈可点之处，我们已经看到了一些好的苗头，但是你关于重新加入阵线的建议仍是个问题，因为这取决于我们的运气是不是足够好。”尤马舍夫整了整他桌上的文件，等待谢德林的回应。\n\n“当然，海军上将同志，但这是其他所有改革的关键，如果我们找到不到一条离开的航线，我们将不可避免地走回老路上去。我们手头现有的可用资源根本无法长期保持一支准备充分的专业海军。我相信斯皮里多诺夫上将交给你的那些报告已经证实了这一事实。”谢德林回答道。\n\n“如果我们的承诺无法兑现，那么我们就完蛋了，格里戈里。”尤马舍夫想了一会儿说，“期待天上掉馅饼是没用的，我将草拟命令停止针对美国航运的袭击，我们不可能一手跟他们作对另一手还能拿他们的援助。”\n\n“也许我们可以实施一些小规模的政治改革，以表明我们值得讨价还价。”\n\n尤马舍夫哂笑道：“你真以为美国人在乎跟谁打交道吗，他们给马加丹的那些杂种提供资金，我不认为讨好当地人能给我们什么好处。”\n\n“值得一试。”谢德林叹了口气，“不必太认真，只是稍微展示一下我们的善意，而且我们还需要补上很多很多的善意。”"
 kmcgp.24.a:0 "千里之行始于足下 "
 kmcgp.25.t:0 "机会"
 kmcgp.25.d:0 "检查完李可夫号的舰员之后谢德林正在回头找个暖和的地方，今天特别冷，冻得他只想缩回屋里。叶夫根尼·伊万诺夫船长跑在他的后面，“上将同志。”谢德林转向伊万诺夫，他知道他是特别高效的走私贩子，是舰队里唯一一次都没被抓包的船长，“我很抱歉打扰您，首长。”他敬礼的时候气喘吁吁，“但是我搞不好可以帮您的忙，您不是想要任何可以跟美国人搭上线的人吗？。”\n\n“啊当然啦伊万诺夫，你的航线不是经常载你去阿拉斯加吗？”谢德林记得。\n\n“是的，首长……”伊万诺夫顿了一下，想知道他接下来说的话是不是他以自由之身说的最后一句话：“我想我可以跟CIA取得联系。”\n\n谢德林停住了，他直视着伊万诺夫，如果他是个可疑分子，他已经考虑到伊万诺夫完美无瑕的走私记录可能与之存在联系，最近对美国船只的数次突袭失败也可能跟他有关。但是他决定相信这个人。"
 kmcgp.25.a:0 "“跟着我伊万诺夫，过会儿我向你解释我要你去做什么。”"
 kmcgp.26.t:0 "条款"
 kmcgp.26.d:0 "伊万·尤马舍夫，格里戈里·谢德林和埃米尔·斯皮里多诺夫三个人站在码头上等待着叶夫根尼·伊万诺夫返航。当伊万诺夫的船，夏斯特列夫契克号系泊之后，他走下舷梯。“好吧，条款都在这里。我们可以继续与美国及其盟友的互不侵犯政策，但是我们要大大增加针对日本目标的劫掠，并且他们不论在任何情况下都不会将我们视作合法政权。”\n\n尤马舍夫想了一会儿，“就这些，没别的了？”\n\n“他们说他们很乐意与我们分享关于高价值潜在目标的情报，但是没别的了，首长。”\n\n尤马舍夫叹了口气，“好吧，没什么选择的余地，我们将不得不接受他们的提议，他们有没有就允许我们通过巴拿马运河放什么风？或者允许我们在停靠他们的港口？”\n\n“我很抱歉，首长，他们让我等了两天才拿这些条款回应我，他们说未来的交易都取决于我们的诚意。”\n\n“他们就是拿我们当工具人。”斯皮里多诺夫插嘴道，“我们为啥非要为了拍美国佬的马屁让自己人火中取栗？”"
 kmcgp.26.a:0 "因为没得选啊。"
 kmcgp.27.t:0 "美国船只"
 kmcgp.27.d:0 "伊万·马斯连尼科夫怒气冲冲地闯进了谢德林的办公室。“美国国旗？！格里戈里你他妈脑子进水了吗？我们要把船送给资本家吗！你现在要把这狗日的星条旗插在布哈林号上，插在十月革命号上？！”\n\n“马斯连尼科夫，冷静点！”谢德林觉得最好不要让事态升级，他不希望军事法庭在海军中将和首席政治军官中选边站。“我们又不是把船送给美国佬，在美国进行注册只是个技术性手段。如果我们把自己包装成美国船就可以免受任何德国轰炸机的潜在威胁。你不会真的以为没有美国撑腰，德国还能让复活的苏联海军从他们在挪威的傀儡家门口经过还无动于衷吧？”\n\n“然后让美国佬耀武扬威给我们护航！你真觉得德国佬已经弱智到把这艘战列舰当艘他妈的美国货轮了？也许我们该任命大力水手当舰长然后运过去一堆他妈的菠.菜.！——”马斯连尼科夫现在面红耳赤。\n\n谢德林停了片刻，他不确定马斯连尼科夫是什么意思但是他抓到了要点，“这只是合理的推诿，德国佬要对美国船只深入其海域做出回应，他们会如计划所料地抗议，而美国佬则会否定发生过的一切，双方大张旗鼓然后世界照转不误。此外，以德国目前的状态他们只能发出象征性的反对。”\n\n“那.我.们.为.什.么.必.须……算了，毫无意义，我去找尤马舍夫。”马斯连尼科夫离开了房间。"
 kmcgp.27.a:0 "祝你好运，伊万。"
 kmcgp.28.t:0 "为舰队服役"
 kmcgp.28.d:0 "伊万·马斯连尼科夫站在第一批舰队政治军官面前，或者按照他喜欢的称呼，海军政委。“你们是从整个舰队里选拔出来的最忠诚最敬业的军官。你们将成为对抗法西斯主义和资本主义向我们海军进行渗透的堡垒。颓废和强盗本性已经在苏联人的思想中存在了很久，不论是否抬头，你们都要消除它们的影响。对那些为发财致富不惜牺牲同志的败类不要心慈手软。”\n\n他沿着队列依次检查了每一个人，他的制服，他的军姿，和他眼中的决心。真正的海军看起来就该是这样。这些人将以身作则挽回红色舰队的荣光。如果有必要的话，他们会把舰队里的每一个人，从最低级的水兵到尤马舍夫海军上将本人，拉到我们期望的标准线之上，不论是用踢的还是用吼的。"
 kmcgp.28.a:0 "光荣。"
 kmcgp.29.t:0 "好钢用在刀刃上"
 kmcgp.29.d:0 "“阿尔希波夫分队长”尤马舍夫宣布道。瓦西里·阿尔希波夫自豪地站在尤马舍夫海军上将的桌前。“你在过去几个月里表现优异，一切井井有条，你的指挥将作为整个舰队效仿的楷模。”\n\n“谢谢您，海军上将同志。\"阿尔希波夫忍着笑回答。\n\n“因此，选拔你来带队突袭这一地区最后一个重要的海盗据点，我们相信叛变的萨维茨基船长及其手下仍在乌斯季堪察斯克一带活动。尽管我们不觉得他们能有什么重火力，你仍然要展现出压倒性的实力，给他们点颜色看看。你将指挥驱逐舰热心号和布哈林号，沿着海岸航行到乌斯季堪察斯克，炮轰你发现的所有加固阵地。海军步兵将建立滩头阵地然后一路打进萨维茨基的大院。扫清你遇到的任何抵抗，最好活捉萨维茨基。然后你要在这一地区指挥抓捕任何可能在第一波突击中溜走的漏网之鱼。你要是发现任何舰队用得上的有价值的东西都给我带回来。明白了吗？”\n\n阿尔希波夫毫不迟疑地回答， “是，海军上将同志！”"
 kmcgp.29.a:0 "“非常好分队长，你去做准备吧。”"
 kmcgp.30.t:0 "突击"
 kmcgp.30.d:0 "早上6点半，太阳刚升起来炮击就开始了。经历了那么多年避战，狡猾，伪装和打了就跑战术，终于登上一艘可以对实战目标火力全开的战舰这一点令人身心愉悦。阿尔希波夫以前并不知道这点，他在上次战争末期加入舰队的时候只有16岁，老实说他对于统辖如此强大的力量感觉有些不安，他现在好奇吃炮弹的那边是什么样子。现在没空想入非非，他还有任务在身。\n\n他从面前的操控台上拿起了话筒，“塞梅诺夫舰长，按计划开始进攻。”一会儿他就看到在弹幕和头顶盘旋的两架雅克3战斗机的掩护下，从驱逐舰上放下的两艘小小的登陆艇正在向前推进。当弹幕终止后，他透过望远镜看见海军步兵展开扇形队形冲过海岸线，一边前进一边开火，机枪阵地正在架设，迫击炮弹一发发射出。当他的士兵们进入村庄，慢慢离开他的视线后，从这一刻起他就只能相信手下军官们的指挥能力了。\n\n过了一会儿，行动完成了，他把结果反馈给尤马舍夫海军上将。 尽管他没有能够活捉萨维茨基，行动还是取得了惊人的成功，抵抗被彻底消灭还没收了一大堆有价值的设备。尤马舍夫上将看起来也对结果喜出望外。"
 kmcgp.30.a:0 "“恭喜阿尔希波夫上将。”"
 kmcgp.31.t:0 "伊萨卡行动"
 kmcgp.31.d:0 "伊万·尤马舍夫撑着一张从桌子这头到那头的地图，舰队的高级指挥官在他身边站了一圈。 “同志们，这就是伊萨卡行动，我们在过去的两年中一直在为此做准备。我们所做的一切都是为了这项行动。我们的每一艘做好出航准备的船都将离开堪察加彼得罗巴甫洛夫斯克港，穿过白令海，沿着美洲西海岸向南航行。在圣迭戈短暂停留之后，我们将继续南下通过巴拿马运河，然后转向北方沿着东海岸航行。在诺福克最后停留一次。” \n\n“这一段是我们旅程中最危险的一段航线，我们将继续向北通过加拿大，到达冰岛北部，进入挪威海。一旦我们经过冰岛就将进入纳粹德国海军频繁巡逻的区域。由于德国持续的内战，我们不知道他们的当前活动状态，但在接下来的航行中，我们仍将保持高度戒备。阵线内部的美国情报官将会把我们即将到来的消息通知给他们，然后到这里，我们的领航舰将加速脱离主队，以将我们到来的具体情况通告给阵线。”"
 kmcgp.31.a:0 "然后我们就到家了。"
 kmcgp.32.t:0 "起锚"
 kmcgp.32.d:0 "好吧。过去几周里所有能带走的东西都被装上了战舰和少数几艘航程足够远的走私船。检查了库存，分配到每个人身上的职务和职责都交代完了，绘制了海图，规划了航线并安排了所有的外交环节。美国人已经捎来了话，说阵线正在期待我们的到来，但是在过去为此时此刻努力的两年中，尤马舍夫几乎没考虑过未来。谢德林是对的，这些努力已经显著地改革了舰队，它现在可以团结起来，为了一个目标而行动，但这值得吗？这些老迈的军舰对阵线有使用价值吗，带来的那些微不足道的物资能养活多出来的那么多张嘴吗？\n\n现在已经没时间深思这些事了。“起锚。”尤马舍夫发出了命令，舰队开始前进。之后的三个月里，大海将再次成为他的家，至少可以再一次像个水手一样生活了。再也不用待在安全的陆地上发出劫掠的命令，再也不用派小伙子们为了给朝鲜游击队走私几支枪就丢掉性命，当他以为自己已经将这些东西从脑海中排除出去的时候，它们又活起来开始围着他嗡嗡，这值得吗？他所做的一切都是为了保护舰队和它的水兵们，为了我们有朝一日能够重新加入为俄罗斯而战的行列。"
 kmcgp.32.a:0 "现在那一天终于到了。"
 kmcgp.598.t:0 "通向自由的伟大阶梯"
 kmcgp.598.desc:0 "尤马舍夫上将站在舰桥上，俯瞰着他的舰队前方渐行渐近的陆地。每一艘船上的水手都整齐地站在甲板上，立正行队，苏联海军旗帜在风中飘扬。当第一艘船抵达“美洲之桥”时，水手们注视着飘扬在管制塔上的巴拿马和美国国旗。水手们抬头一看，发现一群平民、士兵和工人正敬畏地凝望着他们。当舰队最终整齐地列队并航行过桥时，人群已经急剧增多，肩并肩站在布满海上航道的码头和船坞旁。整个巴拿马城似乎都来见证这一历史时刻。\n\n船只依次通过，每艘船在另一艘船之后紧随其后。停泊在港口内的美国士兵和水手们走出来向俄罗斯人致敬，为他们加油助威。水手们之间的互动让尤马舍夫上将露出了微笑。每艘船上的水手向为他们加油助威的水手和士兵们敬礼致意。目睹船只通过的民众脸上露出困惑、惊讶和欣慰的表情。尤马舍夫上将的微笑一直持续到他的船最终通过运河。\n\n当最后一艘船被降低并驶出大西洋门时，每艘船上的水手们都欢呼雀跃，庆祝他们旅程的中途里程碑终于到来。尤马舍夫上将拿起无线电对讲机，命令所有水手休息。\n\n“各位，我们的下一站是弗吉尼亚州诺福克。我们将与美国大西洋舰队并肩停泊。我期望你们都表现出最好的行为。这将是我们回家前的最后一站。”"
 kmcgp.598.a:0 "全速前进！"
 kmcgp.599.t:0 "泰坦中的锈桶"
 kmcgp.599.desc:0 "红色舰队的水手们再次站在所有舰船的甲板上，整齐地站好。这一次，舰队将在回国前停靠弗吉尼亚州的诺福克港口。等待着他们的将是美国海军第二舰队，该舰队拥有世界上最现代化的海军舰艇。海军喷气式战斗机在头顶呼啸而过，短暂地让水手们紧张起来。他们惊叹于上空飞行的飞机数量之多，对一些人来说，天空中飞来飞去的飞机似乎比云朵还多。其中一些海军战斗机组成了一条护航队列，跟随舰队航行。\n\n在舰桥内，无线电员开始报告来自美国港务局的信号，所有的内容都是用俄语说的。无线电员惊讶地看着尤马舍夫上将，向他报告：“长官，我们收到了美国港务局的呼叫。他们要求我们确认身份，并且他们说得挺好的俄语。”\n\n尤马舍夫平静地走到无线电员跟前，接过话筒，对他微微点头。\n\n\"我是苏联太平洋舰队的伊万·斯捷潘诺维奇·尤马舍夫海军上将。\" 他以礼貌的俄语自豪地说道，“我很感谢你们以俄语表示友好，但是，我在与英国同事参加一些海军活动时学了一些英语。如果你们愿意，我们可以切换到英语交流。”\n\n无线电里传来一阵静电声，然后接收机恢复了声音：“尤马舍夫上将，我是詹姆斯·格里尔上将。我得知你会说英语，是吗？”美国人问道。\n\n\"是的，上将，你能听懂我的话吗？\" 尤马舍夫用一种奇怪的苏格兰口音说道。\n\n美国人感到惊讶地回答道：“是的，先生，你有一种奇怪的口音，但我听得懂你。你可以进港了。”\n\n苏联船只驶入港口时，他们看到了一幅壮观的景象：几艘美国航空母舰停泊在一起，每艘船上都有水手站在甲板上。苏联船只接近码头时，向他们的美国同行致敬，而得到了同样坚定目光的回礼。"
 kmcgp.599.a:0 "快到家了"
 kmcgp.600.t:0 "团聚"
 kmcgp.600.d:0 "尼古拉·库兹涅佐夫望着残存的红旗太平洋舰队驶入阿尔汉格尔斯克港的时候感到不安。作为阵线的海军元帅，他要来迎接这些新来的战舰，问题是他的麾下一艘船都没有，因此面对来客感觉无所适从。战舰驶过时，水兵们在甲板上站坡列队向海岸线敬礼。\n\n耳畔亚历山德罗夫的军乐队正在岸上大声地演奏《国际歌》，入港的船只桅头红旗飘扬，多么雄壮的场景。这些人赶回来参加战斗，他不禁想知道他们在远东遭受了怎样的苦难，是否可以阵线在过去20年中经历的斗争和抵抗相提并论。毫无疑问，他想知道的很快就能得到答案。现在最重要的是，苏军的双臂汇合了。不管他们是否了解这一点，舰队都是在历史的关键时刻抵达的，当德国人再一次把炸弹倾泻在阵线的行军队列头上时，这一次我们不会再输了。俄罗斯将恢复秩序和正义，所有那些侮辱和剥削过她的人民的家伙将得到应有的报应。红军和红海军将肩并肩将强盗和土匪驱逐出去。\n\n一个库兹涅佐夫许久未见的人出现在了舷梯的顶端——尤马舍夫海军上将，步下舷梯后尤马舍夫向他敬礼，库兹涅佐夫回礼，接着两人握手并紧紧拥抱在一起。\n\n“回家真好，尼古拉。”"
 kmcgp.600.a:0 "“我们现在还没到家呢，伊万。”"
 kmcgp.34.t:0 "剧终"
 kmcgp.34.d:0 "堪察加的故事已经迎来了尾声。我希望您能喜欢！如果您愿意的话，您可以同这支焕然重生的海军一起在西俄革命阵线继续享受游戏的其他乐趣！\n\n（堪察加全部游戏内容由Sam国之雪风个人汉化）"
 kmcgp.34.a:0 "谢谢，我真的很喜欢！"
 kmcgp.34.b:0 "还可以。"
 kmcgp.34.c:0 "去你的我讨厌这些狗屁，简直浪费时间！"
