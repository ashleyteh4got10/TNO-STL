l_simp_chinese:
 KMC_THENEWORDER_DESC: "在苏联解体后的混乱中，我们发现自己是最后一支残存的苏联舰队，随着阿尔汉格尔斯克、列宁格勒和黑海所有港口都被法西斯入侵者攻陷，我们成为了自豪的苏联海军传统的唯一继承者。我们向亚戈达政权表示效忠，将其视为苏联合法的延续，我们在符拉迪沃斯托克一段时间内执行日常海上巡逻任务，并保护着越来越少的俄罗斯船只往来于我们的港口。面对由日本支持的远东地区的法西斯傀儡的入侵，我们面临着一个严峻的选择，要么战斗而死，要么保留剩余的舰队。面对日本海军压倒性的力量，没有胜利的希望，伊万·尤马舍夫上将做出了向北撤离到堪察加半岛的决定。我们以当时基本废弃的彼得罗巴甫洛夫斯克-堪察加港作为我们的基地，随着我们的存在，这座小港口逐渐发展壮大起来。在没有更大政府的支持下，即使是维持我们这么小的海军的未来变得十分困难。人口稀少，几乎没有工业，也没有外部支持，我们别无选择，只能求助于海盗和走私活动。\n\n如今，我们所谓的海军已经成为一个悲伤的事业，军舰很少出海劫掠，而更多地选择从改装的渔船或货船上行动，以避免引起怀疑；军舰经常被停泊在港口里，锈迹斑斑、慢慢散架。随着船只的衰败，人们的精神也渐渐消沉。随着时间的推移，我们的老兵中越来越多的人离世或自愿离开，他们经常带走我们的一艘船，到半岛的其他村庄独立行动，拒绝把他们的赃物交给舰队。\n\n剩下的只有一群年迈的老兵和年轻人们，他们加入舰队往往只是为了摆脱贫困，希望能靠着劫掠碰碰运气，或者偷渡到外国走私船上。然而，舰队中有些人希望改变，资深海军上将格里戈里·谢德林和虔诚的共产主义者伊凡·马斯连尼科夫船长认为，舰队必须重建其专业核心，并重新点燃作为苏维埃祖国捍卫者的精神。如果他们希望实现目标，就有必要依靠甚至加大对海盗和走私的努力，以便筹集资金。"
 KMC_paternalism_party:0 "太平洋舰队"
 KMC_paternalism_party_long:0 "苏联太平洋舰队"
 KMC_despotism_party:0 "基尔卡·尤马舍娃"
 KMC_despotism_party_long:0 "基尔卡·尤马舍娃"
 KMC_Power_Vacuum: "权力真空"
 POLITICS_KMC_POWER_VACUUM_DESC:0 "伟大的舰队已经最后一次从港口启航。曾经漂浮在堪察加港口的庞大金属物体现在正驶往阿尔汉格尔斯克。在它们离开后，这座城市因缺乏领导而陷入了无政府状态。由于大部分城市居民与海军直接相关，他们的缺席给这片土地带来了真实的空虚感，留下的人没有真正的权威人物来提供方向。看起来，这座曾经辉煌的城市现在将成为另一位领导人的荣耀…"
 POLITICS_KMC_EMIL_SMIRNOV_DESC:0 "埃米尔·斯皮里多诺夫，生于1925年9月26日，他的一生源于生活所迫。最初寻求从事土地管理职业，但伟大的卫国战争使他进入了基辅特别海军学校。在列宁格勒的海军学院就读期间，德军的围困导致了该城市的大规模疏散。当时年仅十七岁的斯皮里多诺夫被安排搭乘一艘驱逐舰与其他海军新兵一起撤离至阿尔汉格尔斯克。抵达后，斯皮里多诺夫被任命为一艘斯大林级潜艇的指挥官，主要任务是保护北部海岸，防止偶尔的德军袭击。到了1945年，苏联处于崩溃边缘。随着德军越来越深入内陆，苏联海军向东撤离的计划得到了授权。斯皮里多诺夫与其他军官一起执行了这一命令，将他的潜艇驶向堪察加港口。最初他们宣誓效忠于亚戈达将军的苏联继承者国家，但白军的起义和当局的普遍崩溃导致斯皮里多诺夫宣誓效忠堪察加的分裂国家，该国由伊万·尤马舍夫海军上将领导。由于他的能力，斯皮里多诺夫得以在尤马舍夫的核心团队中确立地位，负责与苏联小国和世界其他地区进行交易。这包括与西俄罗斯革命阵线的谈判、与雇佣兵的交易、与马加丹港口的交易，甚至与美国进行一些小规模的外交。当这个海军国家驶向不确定的未来时，斯普里多诺夫将一直坚守到最后，因为他是一个服务者，源于生活所迫。"
 POLITICS_KMC_NIKOLAY_SMIRNOV_DESC:0 "尼古拉·斯米尔诺夫，生于1917年9月22日，出生在一个贫穷的农民家庭。最初，他致力于农业学院，但在1937年加入海军，并在1939年毕业后开始了他的晋升之路。加入太平洋舰队后，斯米尔诺夫成为一名普通的潜艇指挥官，参与了与日本帝国海军的小规模冲突，但在苏联解体之前大部分时间都默默无闻。随着所有军队的领导真空出现，斯米尔诺夫成为少数能胜任的太平洋舰队指挥官之一。1947年晋升为上校后，年轻的斯米尔诺夫指挥了伊万·尤马舍夫海军上将的舰队的潜艇。在50年代中期，远东地区的局势迅速恶化，亚戈达再也无法镇压白军起义和军队叛乱。斯米尔诺夫看到了这种弱点，协助尤马舍夫夺取了对堪察加的控制权。由于这种忠诚，斯米尔诺夫被任命为海军财政负责人。这个工作虽然听起来很光荣，但主要只是为了从西俄革和其他友好势力争取更多的资金，以及私掠行动。尽管这不是一份光鲜的工作，但斯米尔诺夫，始终是一名胜任的人，很乐意履行他对海军和革命的责任。"
 KMC_sailor_state_desc: "尽管在历史上，军事政变通常由陆军主导，但堪察加半岛却是一个极端的例外。这里是共产主义的堡垒，由苏联太平洋舰队的残余力量和他们的上将伊万·尤马舍夫领导。一个拥有海军的国家是一个奇特的想法，尽管堪察加半岛较大的沿海定居点仍然保持着基本秩序，但半岛内部实际上处于无政府状态，因为红海军无法进入内陆，被迫在公海上航行，以海盗的身份维持自身生存。"
 KMC_raiders_of_the_north_sea: "太平洋掠夺者"
 KMC_raiders_of_the_north_sea_desc: "随着叛乱分子被击败，戈洛夫科的力量暂时安全，我们可以真正开始将我们的舰队用作袭击舰队。海盗似乎有损我们作为水手的尊严，但它是有利可图的，只有上帝知道在这片荒地上很难找到任何有价值的东西。"
 KMC_red_navy: "红海军"
 KMC_red_navy_desc: "尽管红海军已经转向海盗行为来维持生计，在俄罗斯不断发生的军阀时代中简单地生存下去，但他们并没有失去对共产主义和马克思、列宁原则的纯粹意识形态承诺，或许代表着俄罗斯最后一片真正的共产主义思想堡垒，甚至是被法西斯主义者和自由主义者所占据的整个太平洋！"
 KMC_free_men_on_the_sea: "海上自由人"
 KMC_free_men_on_the_sea_desc: "联邦解体后，我们失去了与西方的联系，因此，我们的补给流动也随之消失，红海军失去了大部分目的，虽然生存并不容易，但联邦的解体给了我们很大的帮助。伊万·尤马舍夫，进而红海军几乎可以完全自由地为所欲为，包括海盗行为……"
 KMC_end: ""
 set_KMC_professionalism_tt:0 "我们将能够在决议菜单中了解§Y专业水准§!的问题。"
 KMC_piracy_decisions_unlock_tt:0 "解锁允许我们进行§R海盗§!行动的决议。"
 unlock_smug_decisions_tt:0 "解锁允许我们扩展§Y走私网络§!的决议"
 poke_the_kraken_tt:0 "§G我们对日本进行的劫掠将更不容易失败。§!"
 KMC_letters_of_marque_tt:0 "§R日本人对我们海盗行为的忧虑等级将不再降低§!"
 an_opportunity_is_available:0 "有机可乘。"
 transfer_saved_ships_tt:0 "§Y我们设法让到达港口的每一艘船都得到了充分的补给，我们的海军步兵也一样。§!"
 days_navy_arrive_tt:0 "§Y我们的舰队将在大约3个月后到达阿尔汉格尔斯克§!"
 ship_interface_available_tt:0 "§Y船舶管理界面§!现在可用了，我们现在可以在这里了解到我方舰艇的§Y补给状况§!。"
 KMC_finding_an_in_trigger_tt:0 "美国人将对我们的海盗行为§G不再忧虑§! 。"
 no_more_changes:0 "§Y我们将不能在船舶管理界面中进行任何更改。§!"
 ships_locked_in:0 "§R我们将不能在船舶管理界面中进行任何更改。§!"
 your_order_to_launch:0 "§Y我们正等待着您启航的命令。§!"
 final_note_tt:0 "§R如果你现在就想看到最终事件，那么请在控制台中输入“event kmcgp.600”。如果你打算以西俄革命阵线的身份继续游戏就没必要这么做，继续正常进行游戏90天就能看到了。不论如何，感谢您进行本游戏！§!"
 time_to_go_home_now_boys:0 "§R我们将为出发前往西俄革命阵线开始进行最终准备工作§!\n§Y一项新的决议类别已经解锁。§!"
 KMC_frozen_east:0 "冰封东方"
 KMC_frozen_east_desc:0 "自从苏联的解体和西伯利亚的残余政府以来，我们就被困在了堪察加。我们尽可能地靠山吃山，但是大海只有那一点点微不足道的生机———为求生存，昔日强大和骄傲的海军已经沦为了土匪和海盗。尽管有些老家伙留了下来，但是许多舰队成员从未在昔日联盟的海军服过役，反之，加入舰队是看中了摆脱贫穷或单单为了劫掠的唯一机会。 \n\n日复一日，残余的舰队看起来不像是一支凝聚力强大的海军，而是更像一群普通的海盗，日复一日，我们的传统和方法日渐被侵蚀，我们所有的舰艇都正在慢慢朽坏，缺乏用以修复的重要零部件和相关的经验。如果我们希望重新控制舰队并铲除这种腐烂，就必须采取雷厉风行的行动。"
 KMC_we_do_what_we_must:0 "必要工作"
 KMC_we_do_what_we_must_desc:0 "走私虽然可耻，但肯定是有利可图的。在该地区的这段时间里，我们已经与几个不同的群体建立了联系，无论他们是阿拉斯加人，满洲人，中国人还是夏威夷人，每个人都有自己想要的东西，事实证明他们中的大多数人都想要彼此手里拥有的东西。无论他们是需要武器的持不同政见团体，还是希望进入日本市场的美国出口商，我们舰队里的船只（尽管已经老朽）都可以充当中介，以帮助那些希望避免美日贸易禁运或获取更多非法商品的人。我们一定要争取足够的利润才能解决我们的麻烦。"
 KMC_to_save_men:0 "保存人力"
 KMC_to_save_men_desc:0 "我们必须让传统维持下去。舰船只是我们海军的身躯，而官兵们则是我们的灵魂，我们的传承。只要老兵和新兵们之间的道路不会中断，我们就可以继续将我们的舰队冠以红海军之名。我们要做的就是让血脉传承下去，无论付出多少代价。"
 KMC_we_take_what_is_necessary:0 "必要措施"
 KMC_we_take_what_is_necessary_desc:0 "经营一支海军，维持舰艇和舰员的正常运作需要石油和而各种补给品，但是这一切在堪察加半岛上都无法生产。缺乏在当地自力更生的前景，我们只能依赖外购。不幸的是，因为缺乏工业和资源，我们没有任何可以拿来交换的东西，因此我们必须通过其他方式来才能收入囊中。幸运的是，太平洋上到处散布着满载石油、武器和其他有用物资的商船。他们通常来自日本或美国这样的富裕国家，不会介意把货物中的一部分分享给更需要它们的人。只要我们谨慎行事，我们就可以得到我们所需要的东西，而不会过多地得罪大国。"
 KMC_to_save_ships:0 "保存舰艇"
 KMC_to_save_ships_desc:0 "没有军舰的海军称不上是海军。如果现有的设施不足以造出保质保量的新船，我们就必须保存我们拥有的旧船。十艘潜艇，四艘驱逐舰，以及我们的旗舰，“十月革命号”战列舰。她们正在衰老，但还没咽气。这些船仍然漂浮着，舰员们仍在为她们服役，昔日联盟的精神依然存在。"
 KMC_secure_our_position:0 "巩固地盘"
 KMC_secure_our_position_desc:0 "尽管我们海军的实力衰微，但是我们在海上的地盘相对安全，其他任何地方势力都没有足以挑战我们的成规模的海军——除非美国日本进行干涉，那可就没希望打得赢了。尽管森林，山脉，广阔的土地和偏远的地理位置为我们提供了良好的天然保护，但是谨慎行事的话仍然要考虑北部地区的防御。尽管与昔日的辉煌时期相比处境糟糕，但我们从劫掠和走私任务中获得的物资和补给使我们在俄罗斯这一带的一亩三分地里相对阔绰。如果该地区有任何暴发户或者强盗打上门来，我们应当做好准备。\n\n由于处于有利的地形，在这方面进行工作的成本不会太高，如果我们能多动脑筋依靠自然屏障构建防御设施，那我们就能多快好省地达成目标。"
 KMC_the_plan:0 "谢德林的大计划"
 KMC_the_plan_desc:0 "格里戈里·谢德林海军中将为我们提出了一项建议。除了采取全面的措施以改善舰队的专业水准并提高其运营效率外，他的其他建议更是雄心勃勃。"
 KMC_appeal_to_america:0 "呼吁美国"
 KMC_appeal_to_america_desc:0 "如果不是机会主义，美国将一事无成。我们提出了一项建议，可以使他们在多个战线上取得胜利，当然同时也得向我们提供了我们想要的东西。他们为马加丹的法西斯叛贼逆党提供资金已经有一阵子了，我们知道，在送给他们的物资之中，已经有数量可观的一部分现在落到了我们手里。如果我们请求美国援助用以出航，保证通过巴拿马运河的安全通道，以及有机会在OFN成员国的港口停靠，我们就再也不会坏他们的事儿了，他们在马加丹的走狗也将能扩张到这个被遗忘的半岛。他们也将感谢使红军和红海军最终在阿尔汉格尔斯克团聚，以加强阵线抗衡德国的势力。毕竟，无论是法西斯主义者还是共产主义者，只要是最能痛扁德国佬的人他们都会支持，而通过我们的提议，他们看起来可以两面下注了。"
 KMC_assess_our_assets:0 "评估我们的航空资产"
 KMC_assess_our_assets_desc:0 "除了我们手里的老旧军舰，我们手里还有一小撮飞机，尽管这些飞机已经好几年都没上过天了，但是其中任何一架可以飞的看起来都会派上用场。它们将在侦察潜在目标，海岸巡逻，乃至作为走私途径等多方面大有作为。当然前提是我们要找到一些胆大的来驾驭它们。"
 KMC_deal_with_professionalism_crisis:0 "应对专业水准危机"
 KMC_deal_with_professionalism_crisis_desc:0 "我们舰队的凝聚力和专业水准已下降到令人无法接受的地步。我们的下级军官和水兵必须与红色舰队的标准和行为保持一致。兵变，贿选军官和从舰队里挖墙脚的行为都必须受到严厉打击。谢德林的计划将在寻求提高标准和改变方法上双管齐下。他声称，这一切不仅对进行伊萨卡行动是必要的，而且对于我们想要与西俄革命阵线整合以延续海军的希望来说也是必要的。"
 KMC_reintroduce_naval_commissars:0 "重新任命海军政委"
 KMC_reintroduce_naval_commissars_desc:0 "舰队里调门最高的共产主义者——伊万·马斯连尼科夫提议重新任命海军政委。他认为这一职能的日渐荒废是舰队在标准上逐渐滑坡的直接原因。他声称恢复政委可以向官兵们灌输这一伟大事业的意义，更重要的是，能够挽回一些急需的军纪。\n\n这将使舰队至少在表面上转回更为共产主义的体系，这自然使那些对当前状况满意的人感到惊讶。但是，这应该对我们来说无关紧要，因为我们正希望粉碎他们的影响。"
 KMC_the_problem_of_plunder:0 "劫掠问题"
 KMC_the_problem_of_plunder_desc:0 "我们并不缺乏掳获，但问题是确保它们能被送回舰队手里。舰队成员经常启程去突袭却一去不返，搞不好是因为抢了自己人然后逃走去过逍遥自在的日子去了。而对于我们的军官来说，为了私吞战利品，分出一小部分给船员作为封口费，让他们永远不要给舰队打小报告，这也不是闻所未闻的事情了。\n\n我们可能需要给自己人多留一点甜头。为了建立与船员的信任和忠诚，我们应该准确地安排每个人有权得到的东西，以及应该上交舰队的东西。希望要是有了一个更强力的制度，每一个为舰队坚守岗位的人都将知道必有收获。"
 KMC_investigate_the_quatermasters:0 "调查军需官"
 KMC_investigate_the_quatermasters_desc:0 "确定谁应得的原则上是一回事，确保付诸实践是另一回事。军需官在仓库里当自己的山大王，就哪些物资能分配给谁拥有最终决定权，更重要的是，要确保他们所存放物品的确切清单。我们应该让新近任命的政治军官来调查和监督军需官，清除最严重的罪犯，并掌控那些可以拉拢的人。舰队可不能有整天绊脚的官僚阶级。"
 KMC_make_our_move:0 "采取行动"
 KMC_make_our_move_desc:0 "时候到了。从我们的改革中，我们开始看到真正的变化。越来越多的船只满载抢来的货物返航，更多的掳获能够上交舰队，并且更多的掳获正在运送至最需要的地方。尽管我们尽了最大的努力，但仍然存在一些障碍，经常有一伙叛乱的前水兵，利用他们在舰队里学习的所有经验，并在偏远地区重操旧业。我们将开始计划一项行动，以消灭这些与舰队无关的海盗。任何在半岛上开展活动的其他组织都将我们的计划置于危险之中。我们必须召集我们的最好的人马突袭这些暴徒，并一劳永逸地消灭这些强盗。"
 KMC_naval_infantry:0 "海军步兵教范"
 KMC_naval_infantry_desc:0 "尽管舰队在投射力量和提供补给方面表现出色，但如果想进一步向内陆发展，舰队就必须依靠我们永远值得依赖的海军步兵。他们在训练中表现优益，我们学到了很多东西。现在是将这些课目付诸实践的时候了。"
 KMC_theory:0 "来自演习的教范"
 KMC_theory_desc:0 "我们从军事演习中学到了很多东西。现在我们该是时候花一些时间来整理这些教范，并努力更新我们目前的学说了。"
 KMC_practice:0 "海军工兵"
 KMC_practice_desc:0 "不论是破障还是架桥，我们发现海军工兵分队对海军步兵的胜利至关重要，我们应该给这些分队分配更多资源，确保他们能继续行之有效地工作。"
 KMC_tactics:0 "武器检查"
 KMC_tactics_desc:0 "演习让我们能够发现在这一地形中行之有效的方法和根本无效的方法。我们应当对目前舰队堪用的武器进行一次简短的检查以确定将来重点发展的趁手武器。"
 KMC_security_service:0 "安全机关服务"
 KMC_security_service_desc:0 "海军政委很不错，但是仍然需要小心翼翼地经营一个上不得台面的机构来监视舰队的活动。在建立情报机构时，我们将构建一个匿名告密系统，这样不论在陆上还是海上都可以密切监视自己人。要说政委的权力来自于明面上可以阻止任何明显的不忠诚行为，那么我们新机构的权力就是它的悄无声息。舰长无法知道他可以跟谁合谋藏匿战利品，军需官不能贿赂仓库工人。即使我们的船只在太平洋上航行，我们的眼线也将无处不在。"
 KMC_tighten_rules_of_engagement:0 "约束交战规则"
 KMC_tighten_rules_of_engagement_desc:0 "到目前为止，尽管舰队经常下令进行劫掠，但是就舰艇如何进行这种劫掠则几乎没有任何指导。我们已经有很长时间没有按照任何条令进行行动了。尽管有些舰长采取非暴力的方法，但一些头脑发热的指挥官却动辄炮火全开，甚至用先制雷击。这不仅常常适得其反，而且还会使得大国愈发怒火中烧，暴力手段也将迫使船舶在进一步加强自卫能力。因此，我们将奉行所有舰员必须恪守的行为规则，为了他们自身的安全，所有的劫掠必须速战速决，并杜绝任何出格的报复行为。"
 KMC_increase_training_standards:0 "提高训练标准"
 KMC_increase_training_standards_desc:0 "由于我们的困境，我们长期以来愿意接纳任何想要入伙的人。一个新来的几乎不需要任何训练就能成为水兵。如果我们要恢复我们的专业水准，就需要马上进行训练\n\n这将有两大好处，首先，训练有素的船员将更有效地执行我们的快速，非致命性劫掠的学说，其次，经过更严格的训练制度，我们可以更好地灌输要成为红海军水兵的要领。老痞子再也无法滥竽充数了，想加入的水兵们必须自己努力赢得一席之地。"
 KMC_review_the_networks:0 "重组网络"
 KMC_review_the_networks_desc:0 "在过去的几年中，尽管我们的走私网络已被证明是我们最可靠的补给来源，但正如舰队的各个方面一样，低效率和腐败困扰着网络。官兵必须采取措施，改善系统以削减无利可图的线路和不必要的风险。明智的做法是进行检查以确定哪些领域是最有利可图的，并评估是否有任何我们尚未利用的商机。我们需要抓住一切机会离开这里。"
 KMC_contacts_in_alaska:0 "阿拉斯加的联络人"
 KMC_contacts_in_alaska_desc:0 "阿拉斯加有重要的石油工业，而石油，更确切地说是燃料，正是我们迫切需要的。幸运的是，我们并不孤单，日本和她的傀儡国，虽然拥有一些石油资源，但是他们的舰队和工业却还是饥肠辘辘。尽管我们将努力自掏腰包购买石油，但如果我们扮演中间商的角色，将日本企业与愿意克服过去政治分歧的美国石油大亨联系起来，我们可以将这些石油运出美国，并希望能留下小笔资金来解决我们的麻烦。"
 KMC_contacts_in_manchuria:0 "满洲的联络人"
 KMC_contacts_in_manchuria_desc:0 "重要的工业，强大的游击队网络，广阔的疆域，满洲为扩大我们的走私网络提供了很多机会。不论他们是想出售结余资助某些活动还是急需武器，我们可以将他们与太平洋地区愿意交易的其他群体联系起来。尽管这是一项需要躲避日本安全机关对我们和他们进行围捕的危险活动，但我们可以利用一些原住民水兵冒充当地渔民，以期避免怀疑。日本人肯定不会注意到。"
 KMC_sourcing_supplies:0 "采购补给"
 KMC_sourcing_supplies_desc:0 "当然，还需要食物，电子产品，零件，衣服，工具，香烟和大量商品，才能使我们的业务持续发展。尽管我们无法从一处货源采购全部所需，但是到目前为止，我们所联系的客户因为美日间的禁运都要求我们扩大业务范围，如果他们愿意以实物方式向我们付款，我们将更愿意承担风险，将他们与潜在客户联系起来。"
 KMC_repair_efforts:0 "努力维修"
 KMC_repair_efforts_desc:0 "尽管有些人把我们老朽的舰船视作一种诅咒，但是我们的绝大部分指挥层包括他们都还抱着一线希望。尽管我们的设施可悲的缺乏设备，无力处置和修理更现代化的装备，但值得庆幸的是，我们所拥有的设施已足以满足当前的维护需求。除此之外，由于经年累月频发的问题，我们的船厂工人和工程师已经习惯了与我们的舰队合作，并且已经善于弥补各种缺陷和常见问题。就是说，我们既无能为力，他们也不是能创造奇迹的工人。如果舰船陷入严重的失修状态，对他们来说就没有希望了。"
 KMC_convert_captured_ships:0 "改装捕获的船只"
 KMC_convert_captured_ships_desc:0 "尽管我们通常的做法是取走一艘船上的一小部分货物就送他们一程，但我们偶尔还是会拥有一艘新船——这通常是由于某位舰长操之过急或是某位舰长想在手下面前充大头导致的。无论哪种方式，这些都将使一些不错的船成为我们的走私船队中的新鲜血液。通过进行一些较小的改动以加装隐藏的货舱，或将它们伪装成当地船只，毫无疑问，它们很快就会派上用场，轻轻松松把我们进行改装的工夫赚回来。此外，这里绝不会缺少走投无路的人，即使希望渺茫，重赏之下也必有勇夫。"
 KMC_administering_the_system:0 "管理系统"
 KMC_administering_the_system_desc:0 "随着我们的网络的扩张，也需要越来越多的管理人手来保持对信息掌握。我们应该将一些后勤能力更强的官员从一般职务转移到行政职务，以确保该系统继续平稳有利地运行。随着日渐熟能生巧，我们可以继续寻找新的机会和潜在的收入来源。"
 KMC_finding_a_buyer:0 "太平洋黑市"
 KMC_finding_a_buyer_desc:0 "尽管我们的走私一开始只是想努力确保基本必需品，但我们已经组建了一个较为庞大的走私网络。在太平洋上的众多港口中，我们都可以发现某位乐于助人的官员愿意睁一只眼闭一只眼，或者找到某个本地“合法商人”正欣喜地等待着我们的下一艘船。我们的船只所到之处，正常渠道获得不到的美国或日本商品也随之而来。结果，新兴的黑市开始出现，而我们正好处在这一网络的中心。虽然这不是我们有意为之，但可以提供大量的物资来源，这也是我们行动计划中急需的。希望我们走了以后他们不会太想念我们。"
 KMC_more_efficient_routes:0 "提高路线效率"
 KMC_more_efficient_routes_desc:0 "总是有些地方还可以改进的。回顾我们开始认真扩展业务的几个月以来，尽管我们已经走了很远，但仍有许多工作要做。现在，我们的规模不断扩大，我们有机会精简流程并更好地分配资源。 "
 KMC_factory:0 "采购我们自己的装备"
 KMC_factory_desc:0 "迄今为止，尽管依靠缴获的美日武器我们受益良多，但事实证明，这种路子是不靠谱的。建立一些基础产业，无论规模多么小，至少都会提供一些基本的保底。"
 KMC_dockyard:0 "港口发展"
 KMC_dockyard_desc:0 "我们应扩建船坞以匹配规模越来越大的走私船队，尽管我们的目光没有那么长远，指望扩充的船坞可以用来制造新船，新船坞的宝贵价值体现在维修和保养上，使我们的舰队不论何时都有更多的船只可以出航。"
 KMC_more_convoys:0 "征用民船"
 KMC_more_convoys_desc:0 "随着我们活动的扩大，我们拥有的船只也越来越多，应将更多此类船只加入我们的走私网络。"
 KMC_a_legitimate_state:0 "合法政权"
 KMC_a_legitimate_state_desc:0 "如果我们要对美国人抱任何指望，那就必须说服他们，我们不只是一群光荣的盗贼和走私犯。当然我们有责任证明我们是该地区的重要角色，让他们认为我们的舰队采取这些行动是迫不得已而可以原谅的。尽管我们作为红海军继续存在的合法性无可争议，但我们应该证明自己是一个合法政权，也许可以通过实施一些象征性的政治改革并在民政机构中给当地人一些小规模的代表权来实现。至于这个文职政府是否有任何权力，甚至在现实中是否存在，都只是一种形式而已。"
 KMC_safe_passage_for_americans:0 "为美国人留出安全通道"
 KMC_safe_passage_for_americans_desc:0 "不论我们向美国提出怎样的建议，我们从以前开始就一直在掠夺他们的船只都是明摆着的事情。尽管过去的事情已经无法挽回，但是我们越早停止对美国船的劫掠，过去的就离我们越远。作为结果，尤马舍夫上将将发出命令，立即停止对美国船只的所有劫掠。如发现任何船员打劫美国船只或拥有美国赃物将立即面临军事法庭的审判，法官将不会宽大处理。"
 KMC_finding_an_in:0 "寻找突破口"
 KMC_finding_an_in_desc:0 "我们打算让美国为行动提供援助的计划中仍然存在一个相当重大的问题——我们在美国政府中没有任何联系。幸运的是，我们可能有解决方案。我们的一位经常跑美国航线的走私船长声称与美国情报机构有联系。他是如何结识如此有影响力的朋友的，这一点尚不清楚，同样不清楚为什么以前没有发现这种联系，但这是我们不能忽视的线索。"
 KMC_establish_naval_attache:0 "创设“海军武官”"
 KMC_establish_naval_attache_desc:0 "伊万诺夫船长的提议似乎很成功，美国人愿意帮助我们。由于美国人希望对我们之间的合作保持机密，伊万诺夫将担任我们舰队与中央情报局之间的联络人，他将被免除其目前的职务，并担任我们在美国的非正式海军武官。他将像以前一样继续乘坐走私船前往美国，但是在港口时，他将把我们最新的情况通知给他们，并尝试劝说他们进一步支持我们的舰队。"
 KMC_letters_of_marque:0 "私掠许可"
 KMC_letters_of_marque_desc:0 "我们已经获得了美国人的默许，只要不妨碍他们的任何利益，就可以继续行动。尽管海盗问题已经解决了，走私却是个稍微棘手一点的问题。虽然这对我们是巨大的利益所在，但是对美国人来说却多少是个小麻烦，好在我们在几年内就滚蛋了，所以我们希望能够继续在美国开展业务。也许将一些日本奢饰品送到某几位情报官手里就能打通关节了。"
 KMC_poke_the_kraken:0 "招惹海妖"
 KMC_poke_the_kraken_desc:0 "美国人与我们合作的条件之一是我们加强对日本航运的袭击。尽管这是非常危险的，但他们提出要分享情报以指明潜在的利润丰厚，防御程度低的目标。当然，我们将截留这些劫掠的全部战利品。而他们似乎对日本航运中断的前景感到满意。"
 KMC_pirates_in_the_carribbean:0 "加勒比海盗"
 KMC_pirates_in_the_carribbean_desc:0 "美国人允许我们的战舰通过巴拿马运河了，尽管不是完全自由通行，但是这样就可以绕过行动的最大障碍，大大减少我们必经的航程。 "
 KMC_a_route_secured:0 "路线安全"
 KMC_a_route_secured_desc:0 "最终，美国人为我们提供了允许我们在其港口停靠的条件。一旦我们停靠了途径的第一个美国港口，我们将正式作为美国船只航行。这绕开了美国人需要承认我们的政权的问题，并为他们为什么允许“海盗”进入其港口提供了借口。虽然这无疑招致了一些我方一些对意识形态较为敏感的军官的反感，但他们不能否认这一点确保了旅程中最危险的部分之一。一旦我们经过冰岛，我们将处在德国轰炸机的攻击范围内，看到俄罗斯军舰在俄罗斯的旗帜下航行将是一个容易的目标。在美国国旗下，我们将迫使德国人三思而后行。"
 KMC_lets_go_home:0 "伊萨卡行动"
 KMC_lets_go_home_desc:0 "时候到了，我们已经在艰难中挣扎了二十年了，现在是时候重拾我们作为真正海军的骄傲了。在这次行动中，不论我们是最终得以回家并重新开始战斗，还是红色舰队最后的血脉彻底被毁灭，不论是何种结局，我们现在已经可以把所有曾经身为海盗的耻辱抛在身后。我们所希望的是，我们所做过的一切，通向此时此刻的所有过往，都是值得的。"
 KMC_professionalism_category:0 "专业水准"
 KMC_professionalism_category_desc:0 "我们舰队的凝聚力和专业水准已下降到令人无法接受的地步。我们的下级军官和水兵必须以红色舰队的标准和行为进行重整。兵变，贿选军官和从舰队里挖墙脚的行为都必须受到严厉打击。这将是一支践行战时共产主义而非海盗行为的海军，虽然从向舰队提供物资的人们看来两者没啥差别。\n\n更高级别的§Y专业水准§!意味着在我们在劫掠中将更少失手，并获得更多的§Y补给品§!，除此之外还能获得更多的每日§Y政治点数§!。 \n\n我们的§Y专业水准§!目前为 [ROOT.GetKMC_professionalism] ([?KMC_professionalism])"
 KMC_piracy_category:0 "海盗"
 KMC_piracy_category_desc:0 "尽管我们劫掠了一大堆目标，但是只有美国人和日本人是能对此做点什么的。即使他们的船载着更为贵重的货物，我们也必须要限制针对悬挂美日旗帜船只的攻击行动。明智的做法是避免太过得罪他们，也留条将来跟他们合作的后路。\n\n我们拥有[?KMC_supplies] §Y补给品§!\n\n我们拥有[?KMC_fuel_stored] §Y船运燃油§! \n\n那些§B美国人§!现已[ROOT.GetKMC_american_concern] ([?KMC_american_concern]).\n他们的忧虑每月降低§Y[?KMC_american_concern_decay]§!. \n\n那些§R日本人§!现已[GetKMC_japanese_concern] ([?KMC_japanese_concern]).\n他们的忧虑每月降低§Y[?KMC_japanese_concern_decay]§!。."
 KMC_this_will_anger_the_japanese_tt:0 "§R这将激怒日本人§!"
 KMC_this_will_anger_the_americans_tt:0 "§R这将激怒美国人§!"
 target_american_shipping:0 "劫掠§B美国§!船只"
 target_japanese_shipping:0 "劫掠§R日本§!船只"
 send_out_raiding_fleet:0 "劫掠§G中立国§!船只"
 unsanctioned_piracy_mission:0 "未经许可的海盗"
 unsanctioned_piracy_mission_tt:0 "即使没有得到舰队的许可，我们的手下也会自发进行海盗活动。尽管有些掳获最终会回到我们手里，但是这会影响到我们对这些人的权威\n\n我们的§Y补给品§!将§G增加§! §Y[?KMC_unsanctioned_tick]§! \n我们的§Y专业水准§!将§R降低§! §Y[?KMC_unsanctioned_tick]§!"
 KMC_professionalism_off_10_tt:0 "我们的§Y专业水准§!将§R降低§! §Y10§!。"
 add_fuel_to_stockpile:0 "把燃油注入库存中"
 add_fuel_to_stockpile_fuel_req_tt:0 "我们必须拥有§Y1 船运燃油§!才能储存起来，我们目前拥有§Y[?KMC_fuel_stored]§!，我们可以从劫掠中获得。"
 add_fuel_to_stockpile_tt:0 "将大约§Y5,000 燃油§!注入我们的库存，花费§Y5§!天时间。"
 KMC_fuel_supplies_not_already_full_tt:0 "我们的燃油库存已经有§Y90%§!。 我们不能再浪费燃油了。"
 KMC_not_already_targeting_shipping_tt:0 "我们尚未准备好劫掠航运。"
 stamp_out_unsanctioned_piracy_prof_req_tt:0 "我们必须有至少§Y90 专业水准§!。"
 stamp_out_unsanctioned_piracy_tt:0 "我们已准备好采取行动。"
 must_have_invested_in_this_network:0 "必须对这个网络进行投资"
