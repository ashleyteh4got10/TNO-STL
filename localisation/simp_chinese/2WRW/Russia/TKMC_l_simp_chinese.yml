 port_gui_info_button_tt:0 "任何一艘奉命开往西俄革命阵线的船只都必须得到充足的§Y补给品§!和§Y燃油§!。任何同时满足两项§G需求§!的船只将显示为§G绿色§!.当我们开始通向西俄革命阵线的§B航程§!时只有§G充分补给§!的船只可以跟我们一起上路。如果一艘船§R缺乏补给§!将无法参与§B航程§!并将被抛弃。当我们开启§B航程§!时每一艘船都应该得到充足的§Y补给品§!，多余的§Y补给品§! 将被带往西俄革命阵线并以§Y400补给品§!对§Y1 £loot_icon 战利品§!的比例进行兑换。\n\n在港口中单击某艘船，或在列表中单击该船的名称检查该船的实际状态并可以增减§Y船运燃油§!和§Y补给品§!。"
