 KMC_operation_ithaca:0 "伊萨卡行动"
 KMC_operation_ithaca_desc:0 "尤马舍夫海军上将并非一拍脑袋就给行动起了这么个名字。奥德修斯在漫漫旅途中度过了20年才终于回到了伊萨卡，而我们也的确流浪了这么久。尽管没人觉得这是真的回到故乡，但是这起码标志着舰队有了一个精神上的归宿。我们会再次加入西俄罗斯革命阵线，并且和他们并肩进行数十年的战斗。我们将会在战斗中倾其所有，为达成这一目的所做的一切而赎罪。"
 launch_operation_ithaca:0 "发起伊萨卡行动"
