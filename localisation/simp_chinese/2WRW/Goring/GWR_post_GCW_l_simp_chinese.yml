 GGR_rebuilding_germany:0 "废墟中的德国"
 GGR_rebuilding_germany_desc:0 "满目疮痍的城市废墟中，仅存的公路与铁路如同干涸的血管，再无货物与旅客穿行。码头上停泊的空船既无来货，也无出口。工厂因原料断绝而彻底沉寂，唯一尚存些许生机的，只有在地下滋长的黑市——这就是德国最黑暗的时刻。"
 GGR_rebuilding_germany2:0 "废墟中的德国"
 GGR_rebuilding_germany2_desc:0 "满目疮痍的城市废墟中，仅存的公路与铁路如同干涸的血管，再无货物与旅客穿行。码头上停泊的空船既无来货，也无出口。工厂因原料断绝而彻底沉寂，唯一尚存些许生机的，只有在地下滋长的黑市——这就是德国最黑暗的时刻。"
