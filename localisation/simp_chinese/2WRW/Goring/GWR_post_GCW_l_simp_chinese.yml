 GGR_rebuilding_germany5_desc:0 "满目疮痍的城市废墟中，仅存的公路与铁路如同干涸的血管，再无货物与旅客穿行。码头上停泊的空船既无来货，也无出口。工厂因原料断绝而彻底沉寂，唯一尚存些许生机的，只有在地下滋长的黑市——这就是德国最黑暗的时刻。"
 GER_GOR_militarized_schools:0 "学校军事化"
 GER_GOR_militarized_schools_desc:0 "在我们挚爱的元首上台前，德国的学校系统中卑鄙丛生，堕落横行，这造就了大量学生也跟着堕落，令祖国母亲饱受其苦。我们已经对学校进行了改制，鼓励每一位学生在国防军服役。"
 GER_GOR_martial_law:0 "戒严令"
 GER_GOR_martial_law_desc:0 "德国街头的无政府状态已经持续太久了。在所有觊觎元首头衔的朝敌都已被铲除的当下，恢复德国的街头秩序可以进一步加强我们的权威。我们将宣布戒严并由国防军接替治安工作，直至局势恢复正常。当十号战车的轰鸣声响彻街头巷尾之时，恐怕不会有什么人还敢造次。"
 GER_GOR_pride_in_goering:0 "以戈林为傲"
 GER_GOR_pride_in_goering_desc:0 "每一个真诚的德国人都以戈林为豪。每一个德国家庭里都悬挂着他的肖像和画像，大日耳曼国再也找不出比他更好的元首了。"
 GER_GOR_lingering_traitors:0 "叛党残余"
 GER_GOR_lingering_traitors_desc:0 "尽管我们赢得了战争，但敌人的支持者仍存，他们就像瘟疫一样困扰着德国。很快我们就会好好处理他们。"
 GER_GOR_lingering_traitors_2:0 "叛党残余"
 GER_GOR_lingering_traitors_2_desc:0 "尽管我们赢得了战争，但敌人的支持者仍存，他们就像瘟疫一样困扰着德国。很快我们就会好好处理他们。"
 GER_GOR_nationlized_banks:0 "银行国有化"
 GER_GOR_nationlized_banks_desc:0 "德国的银行在二战后的几年里越来越腐败。犹太布尔什维克再也无法直接对抗德国，于是把自己藏在他们的死敌——德国人民的鼻子底下，藏在自己的机构里。戈林元首已洞察这股腐朽势力，迅速采取果断措施，通过将这些银行并入德意志银行，彻底铲除其危害国家的能力。"
 GER_GOR_goringjugend:0 "戈林青年团"
 GER_GOR_goringjugend_desc:0 "希特勒青年团是一支由雅利安青年男女组成的队伍，他们在民族社会主义的理念中长大。这一培育计划的成果，如今体现在我国各级行政机构、军队乃至神职人员的队伍中。很可惜，由于内战，第一代希特勒青年团因为支持不同竞争者而分裂，之后几乎被摧毁。现在戈林成为了新的元首，我们可以开始采取行动，重建这个重要的组织，当然，它会被更名为“戈林青年团”。新一代德意志人将在成长过程中学会敬爱领袖，而这一次，绝不允许他们沦为内奸与叛徒。"
 GER_GOR_the_great_purge:0 "大清洗"
 GER_GOR_crack_down_on_the_bankers:0 "打击银行家"
 GER_GOR_nationalize_the_banks:0 "银行国有化"
 GER_GOR_a_bayonet_for_the_bankers:0 "给银行家的刺刀"
 GER_GOR_cage_the_students:0 "关押学生"
 GER_GOR_round_up_dissidents:0 "围捕异见者"
 GER_GOR_a_bullet_for_the_traitors:0 "给叛徒的子弹"
 GER_GOR_school_militarization:0 "学校军事化"
 GER_GOR_and_chains_for_the_thinkers:0 "以及给思想家的枷锁"
 GER_GOR_faith_in_the_gun:0 "枪炮即信仰"
 GER_GOR_pride_in_the_fuhrer:0 "以元首为傲"
 GER_GOR_prepare_the_new_germany:0 "准备新德国"
 GER_GOR_prepare_the_army:0 "准备军队"
 GER_GOR_a_new_age_of_science2:0 "科学新纪元"
 GER_GOR_war_plan_0:0 "战争计划0"
 GER_GOR_war_plan_A:0 "战争计划A"
 GER_GOR_war_plan_b:0 "战争计划B"
 GER_GOR_war_plan_c:0 "战争计划C"
 GER_GOR_war_plan_c_desc:0 "起初我们平息了分崩离析的祖国，重建了对欧罗巴的控制，再现了阿道夫·希特勒的愿景。现在我们又凯旋而归，完成了阿道夫·希特勒的真正梦想再无常变节的盟友背叛我们，亦无俄国残部侵扰我军。历经连年烽火，大戏终幕拉开：最终胜利已近在咫尺。\n\n尚且耸立的只有其他核巨人和夹缝间的蕞尔小国：勃艮第骑士团国，腐朽堕落的美国，还有日本帝国。这三国将是迄今为止我们面对过最强的敌人，但无论他们用多少核弹头与枪炮瞄准我们，都改变不了他们是劣等民族的事实。向最后的胜利进军！万岁！"
 GER_GOR_war_plan_C_new:0 "战争计划C"
 GER_GOR_war_plan_C_new_desc:0 "海因里希·希姆莱曾在五十年代妄图背叛德国；如今，他那个腐败流脓的政权将在国防军坦克履带下分崩离析。摇摇欲坠的日本“帝国”背信弃义，脱离轴心国；此刻，它们终将被海军舰队的怒涛吞噬。腐败的犹太资本主义美国人嘲讽德国是“欧洲病夫”；现在，他们将被我们光荣的空军夷为平地。\n\n现在是我们准备的时候了。最后一次，我们将改变整个世界的命运，让这颗星球臣服于雅利安民族的至高威严。武装起来，战士们！"
 GER_GOR_five_year_industrial_plan2:0 "四年工业计划"
 GER_GOR_wrangling_the_reichstag:0 "控制议会"
 GER_GOR_wrangling_the_reichstag_desc:0 "全球石油危机对德国造成了沉重打击。长期把持朝政的军国派如今已陷入全面混乱。\n\n这场危机引发的动荡，暂时剥夺了他们的大部分权力。舍尔纳及其党羽眼下掌握的权力微乎其微。\n\n机不可失！现在是让那些渴望权力的混种滚蛋的绝佳机会！戈林元帅与其盟友们现已掌握足够力量，能将政敌逐出政府！时不我待，现在是采取行动，为元首戈林彻底巩固德国大权的关键时刻！"
 GER_GOR_the_great_purge_desc:0 "曾经枪炮轰鸣、爆炸震天的战场，如今只余一片死寂。嘶喊声已然消散，硝烟尘埃落定，唯有血腥与焦灼的气息仍如遥远记忆般悬浮在空气中……但最后一个敌人尚未倒下。永恒的胜利固然甘美，却仍有毒瘤妄图败坏这滋味。这些卑劣的敌人像鼠群般遍布帝国，天真地以为内战结束便是他们的护身符。\n\n他们大错特错。从追随施佩尔谎言的自由派渣滓，到鲍曼手下那些骄奢淫逸、不思进取的硕鼠，我们的大清洗将会把他们从枝蔓丛生的系统中一一拔除，绝无宽赦。在费迪南德·舍尔纳元帅与国防军的鼎力支持下，戈林的胜利荣光必将永世长存！"
 GER_GOR_crack_down_on_the_bankers_desc:0 "银行本来就是不可信的机构——几个世纪以来，每个虔诚的基督徒都不被允许放高利贷，这等勾当向来是犹太人的营生。尽管我们已将这些闪米特祸害从金融机构中清除，但接替他们的人似乎沾染了这些恶习。许多银行家把他们的赌注都投给了鲍曼，这也注定了他们的命运。至于那些未参与叛乱的银行，在我们肃清叛徒期间最好夹紧尾巴做人——切记以儆效尤。"
 GER_GOR_nationalize_the_banks_desc:0 "银行在交易中的回旋余地实在太多了。外国人、叛徒和傻瓜都能得到他们的资金，是时候结束这种浪费了。我们会以国家之名束缚他们，以此确保他们的忠诚，又能为德国的宏伟计划提供宝贵资金来源。当然，我们无需支付报酬——剩下的银行家们正巴不得有机会表忠心呢。"
 GER_GOR_a_bayonet_for_the_bankers_desc:0 "我们沦为今天这般田地都是因为自满。我们曾对学生、对银行家、乃至党内同僚都过于纵容。但这一切必须终结。我们将确保我们对银行的控制永远不会放松，并密切关注留在那里的人。当他们再也见不到叛逆的同事时，他们一定会加倍努力——也许这种制度可以持续下去？时不时地让他们身边少点什么一定会让他们牢记自己的位置。"
 GER_GOR_cage_the_students_desc:0 "Germany's universities have been its pride for many years. Countless Nobel prize winners came from these hallowed halls, and some of the greatest technical minds of this century have been German. Time takes its toll however, and, for the past decade, the Reich's students have been nothing but a thorn in its side. They have turned to discredited ideologies such as democracy and even socialism, and with the outbreak of the Bürgerkrieg many Universities rose up as their own statelets. Most, such as Münich and Heidelberg were quickly put down, but those in Albert Speer's territory frequently survived and swore their loyalty to him. While we may have removed Speer from the board, his pawns remain.\n\nThe rubble of the universities is easily picked through. Dig out the students and throw them in a cell. They'll learn the price of their hubris soon enough."
 GER_GOR_round_up_dissidents_desc:0 "There are enemies around every corner, even if there are a few less corners after the war. The Catholic Church has ever been troublesome for us. The Reichskonkordat may have officially stabilised relations with the Vatican, but we stopped paying attention to it long ago. Catholics are everywhere in Bayern and Ostmark, and the priests there too often take it upon themselves to interfere in matters that are none of their business. They learned the value of a good speech long ago, and we must make sure they are unable to give them.\n\nBorders become a lot more porous when all the guns are pointing inwards. Smuggling has taken hold in the East and South, with businesses often turning to their counterparts across the border. We might be able to excuse this if it was a temporary measure but their greedy ways have persisted after the war's conclusion. Punishment is in order. All of these traitors will be confined to prison camps until the Wehrmacht decides whether it is worth killing them."
 GER_GOR_a_bullet_for_the_traitors_desc:0 "The war was long and hard fought, and many still are not willing to accept the proper state of things. Heydrich's SS have been dug out but Bormann and Speer's people remain, ready to resume their sabotage at a moments notice. Anyone willing to serve those who would bring the Reich to ruin is an idiot at best and should be eliminated as a hindrance or a traitor and must be eliminated with prejudice. We shall not make the mistake of letting them live."
 GER_GOR_school_militarization_desc:0 "School is where a mind is honed before it enters service. Children are the future, and Hitler was wise enough to see that. The Hitlerjügend was to be our youth's first taste of a martial life back in the thirties, and we need to inspire a thirst for that now just as much as then.\n\nA gruelling time is ahead of us, and our children need to be prepared for that. A greater focus on physical education will prepare them for the wars ahead. Reichsmarshall Schörner himself has recommended we relax grade requirements - it would be cruel to insult the men who will go on to fight on the front line by giving them failing grades, and there are much better things to educate them on. Every week our youth will perform atomic bombing drills - just in case. Duck and cover, children. "
 GER_GOR_and_chains_for_the_thinkers_desc:0 "We may have dealt with this latest round of rebellious students, but what of the next one? And the one after that? It is our duty to maintain discipline in our children. We shall have Wehrmacht guards stationed at university campuses, officers monitoring the lesson plans, and a few thousand Reichsmarks will buy us a disproportionate number of student informants. What else do students have to complain about but money?"
 GER_GOR_faith_in_the_gun_desc:0 "If things have not calmed down, they have at least stopped heating up. Arms on every street corner do a great deal for one's peace of mind, and have restored faith in the Führer's ability to keep things under control, if not his legitimacy. The rebellious voices have been silenced for now, and if we keep a lid on things they will stay that way. All we have to do is maintain faith in our soldiers, our tanks, and our guns."
 GER_GOR_pride_in_the_fuhrer_desc:0 "Führer Göring has done what seemed impossible, and vanquished all pretenders to his title. That evil administrator Bormann; Speer, the architect of the Reich's destruction; Heydrich, the Man with the Iron Heart who tortured and murdered across Europe. If Hitler's faith in him was not proof of his legitimacy then the destruction of all of his foes certainly is. We should be proud of our Führer, who has fought and commanded across Europe since the First World War, and brought victory in his wake."
 GER_GOR_prepare_the_new_germany_desc:0 "Germany proper has once again been stabilised and the traitors and pretenders destroyed. Now it is time for us to reclaim our rightful Lebensraum as we did two decades ago. Thankfully it will be somewhat easier this time, with no Soviet Union to contest our mastery of Europe. Only our former subjects exist to oppose us - the Americans and Japanese are half a world away. And once we reassert our control, we will be ready for them."
 GER_GOR_prepare_the_army_desc:0 "The Wehrmacht was shattered in the Bürgerkrieg, split into four and set against itself. While we may have gained the greatest share, more than half our officers cannot be trusted, and who knows how many enlisted men. A pruning down is required. Further still, the war proved our tactics outdated and our Heer old fashioned. It must be reformed if we are to reassert control over Europe, so that we may crush our enemies, see them driven before us, and hear the lamentations of their women."
 GER_GOR_a_new_age_of_science2_desc:0 "Never before have our generals had such an influence in policy; they did win us the war, after all. Naturally, they expect their opinions to be heard, and lately they've been clamouring for more funding. A few of the more imaginative of them have been digging up old ideas, ideas discarded as \"impractical\", and \"unfeasible\", and \"too dangerous to sanction\". These ideas may not lead anywhere, but it doesn't do any harm to let them dream. Send some funds down to our research departments to entertain them."
 GER_GOR_war_plan_0_desc:0 "Denmark, Ostland, the Netherlands, Poland and Slovakia. Every journey begins with a first step. And the path to restore the Reich's glory lies in securing its immediate and rightful sphere in Central Europe. These operations have been given the name War Plan 0. Resistance is expected to be futile and miniscule."
 GER_GOR_war_plan_A_desc:0 "Now that the Reich's control over Central Europe has been reestablished, the Wehrmacht is already looking to the Balkans, Scandinavia, the British Isles and the rest of our Reichskommissariat in the East. War Plan A will involve securing control of these vital areas through German steel. This shall not only restore the Reich's pre civil war territory, but also bring order to those nations still defying us in the Baltic and the Balkans."
 GER_GOR_war_plan_b_desc:0 "To have conquered the crumbling states surrounding the Greater German Reich was a matter of inevitability. Now the time has come to immortalise the Fatherland's standing in Europe once and for all and crush the vicious powers that seek to destroy us from without. To the east lie the teeming subhuman masses, huddled within the rotting remains of Russia; with just one final push the Slavic hordes will be crushed under the mighty boot of the advancing Wehrmacht. To the south await the scheming Italians, monkeys in suits who bicker and hoot among themselves while undesirables roam free. Only once the Reich claims victory over Iberia and Turkey can we secure a hold on the Mediterranean, and then nothing will prevent Italy from falling just as Rome had centuries ago."
 GER_GOR_five_year_industrial_plan2_desc:0 "We may talk the talk about the renewed Germany, but it's time to walk the walk. Our factories lie in ruins, our streets are paved with rubble and our fields are filled with the dead. We must rectify this before any attempt is made to restore control outside of the Reich's core.\n\nLearning from one's own mistakes is good but learning from our enemies is better. The Soviets had a good idea or two while they were around, and the Four Year Plan is one the Führer in his economic wisdom has set his sights on. Our industrial planners will draw up estimates - how fast can steel production be brought back to pre-war levels? How quickly can roads between supply centres be repaved, how quickly can chemical production be expanded? A deadline makes everyone work harder. "
 goering.13.t:0 "The Ascension"
 goering.13.d:0 "Traces of smoke still hung over Germania the day of Göring's ascension, blown in by the winds coming off the North Sea and over the burnt remnants of thousands of homes, vehicles, fields, and everything else that could catch fire. It did not deter the thousands of Germanians who flocked to the streets to see their new Führer.\n\nThe parade was endless- thousands of soldiers proudly marching through the streets, trucks upon trucks streaming through the roads, followed by hundreds of tanks. Finally, in a Mercedes convertible surrounded by soldiers of all sorts of units, the Führer rode his chariot towards his coronation. Flowers dumped down on the men, thrown from windows as the greatest city on Earth welcomed its new conqueror.\n\nAt the steps of the Volkshalle, Göring stepped from his car to the roar of the crowd. As he walked up towards the building, he stopped, turned to the parade, and waved his hand- all it took for the streets to explode with frenzied cheering. There was no doubt now- Germany would be strong again, and the whole world would know it."
 goering.13.a:0 "A new era beckons."
 goering.14.t: "A Zero-sum Game"
 goering.14.d: "Hermann Göring entered his office after another fiery speech before the crowd. Various emotions overwhelmed him: joy, pride, and... fear?\n\nThe Bürgerkrieg was over, the traitors were either killed or scattered to their hiding places. Göring's grip was now firmly established over the Reich. So why was he haunted by fear?..\n\nHermann sat down at his desk. He began to ponder the future – his own and that of the Reich. It was extremely uncertain. Before him flashed a multitude of images, of which only one was clear – Ferdinand Schörner, looking at him with his cold gaze from the shadows.\n\nGöring was not the only one, not even the main one, whose interests were advocated in this war. The Monster in Uniform and his wild band of militarists were the main force that brought Göring to victory, and now they had become the main stakeholders in Göring's Führership. Germany would now plunge into a decade, if not a century, of wars, and Göring would lead it through this decade, with Schörner and Römer hot on his heels. He had no real choice – either to follow their path, gradually gaining influence and allies in an attempt to stop them, or to die now, dooming Germany and the entire world to destruction.\n\nGöring exhaled. He had no time for idle thoughts, for with each passing second, the militarists were gaining strength. He picked up the phone from his desk and began dialing a number."
 goering.14.a: "The game is on."
 goering.15.t:0 "Rally Against The Beast"
 goering.15.d:0 "In the ruins of Germany's cities, the chants of the opposition and of the youth roared as loud as guns and bombs once did during the civil war. And from the universities and schools, what remained of the student movement emerged with a renewed defiance against the victorious lion, the promised Führer of a new Fatherland.\n\nIt was a surprise to see them still alive. Nobody really thought they would keep on with their passionate stand against the militarist forces of Göring. And yet, here they were.\n\nTheir numbers grew and their protests spread. Soldiers and policemen rushed to meet them, to keep them from accomplishing what they hoped for. Some succeeded but others were not; for every demonstration they crushed with the club or the rifle, there were two more which crushed them back with the petrol bomb or the rock.\n\nJust like the embers of a dying fire made fresh again with air and fuel, so were the students who stole weapons from the dead or fleeing security forces. Just like the rising form of a phoenix, the students, filled with rage that only comes as a second wind, denounced the victors and threatened the returning peace.\n\nThis all shook up the German people once more. They watched from their broken windows or from their dirty workplaces as these young men and women tried to fight again for what they stood for. Most of them wanted peace, for this to finally come to an end, even if Göring was the one victorious and not Speer, Heydrich nor Bormann.\n\n\"Give it up already!\" some would tell the students, \"The war is over! What's left for you to fight for?\" And in response, there was only contemptuous silence or a barrage of proclamations, all rebellious, that defied what was already set in stone. Yet, the students would keep on marching, protesting, fighting back. Even if it meant their death or a fate much worse, they didn't seem to have any other choice. To capitulate was anathema to them; to not dissent was more outrageous than it is to stand up to what's happened, even in defeat."
 goering.15.a:0 "\"They are just wasting their energy.\""
 goering.16.t:0 "The Great Purge"
 goering.16.d:0 "The great lion and the colossal wolf have won. Their most powerful enemies lie dead, their blood soaking into the earth of Germany, leaving to their mercy the countless young and foolish students who dared to stand up to them, the dissidents who roused them to action, and the bankers who funded them all. They, and everyone else who, in vain, stood or seeks to stand in their way, would all be liquidated.\n\nBy the will of the victorious Führer, Hermann Wilhelm Göring, and his most inexorable lieutenant, Ferdinand Schörner, the fates of all those who failed to stand against them shall be equal if not worse than those exterminated in the wars before.\n\nGreat numbers of students were rounded up and forced into camps to be brutally disciplined according to the standards of the Wehrmacht. No matter who they are, where they came from, and what they believed, all of them shall not be spared the rod. On pain of death, they will obey.\n\nAs for those who sought to disturb the political happiness of the Fatherland, they will be hunted down and arrested without fail. Be they brave souls who promoted socialism, democracy, reformism, or the like, their virtues shall be stomped upon by the boots of those who value the law of the land. So that they may not disturb the peace once more, their lives shall be spent behind bars else they find themselves buried in a vast unmarked grave.\n\nAnd finally, the parasites who deceive the people to steal their money shall be neutralized. Their greed will not deliver them from the accounting which the Führer seeks to employ. And their wretched hands shall not touch another coin nor bill. No. They will, like all the others, be made to bare their necks to the claws of the lion and the jaws of the wolf."
 goering.16.a:0 "No wasting mercy on the scum of the earth."
 goering.17.t:0 "Martial Law Declared"
 goering.17.d:0 "The lion of a man sighed and a tired grin appeared on his old face. He walked down the empty and fairly lit hall, the one the late Adolf Hitler walked down himself, with his fellow victor, Field Marshal Schörner, by his side. They paused short of the doors that kept them out of the office from where the father of the great Reich once worked, leading the German people.\n\nThe successor turned. \"Field Marshal, I have immense confidence in your abilities. I'd like to ask you a significant favor for our victory. Take care of the cleanup. Keep your hand in the details of the martial law we have just declared. I think you can do that by-\"\n\n\"Yes, my Führer,\" Schörner quickly interrupted with a nod, \"and those students and their arrogant allies in the banks, along with those dissident bastards from the camps will be dealt with. Strongly. I'll personally see to it.\"\n\nThe former pilot with grizzled hair blinked at him. Then he chuckled, shrugged, and said, \"Really. Very well then. I give you the liberty of doing what must be done. Just don't take too long, all right?\"\n\n\"Of course not.\" Schörner thought his new Führer a little too histrionic. Well, not a big deal. It's natural for a flyboy like him to play with army officers for favors. \"I'll see to the-\"\n\n\"Just make sure that nobody breaks the curfews and pisses us off with any tricks. The sooner those pests and their supporters are taken care of, the sooner our country can lick its wounds and get to work,\" the Führer said, all too quickly. The field marshal looked up. Then he gave a nod. Schörner saluted him. He turned away and marched off, Göring watching him disappear.\n\nThe old, great lion who won the war for Germany's conquests to be added to now twisted the knob of the door and stepped in. The door closed. And the ruthless wolf who fought that war for him, so he may spill the blood of more of the Fatherland's enemies, looked back, whispering..."
 goering.17.a:0 "I'll cauterize the wounds of Germany."
 goering.18.t:0 "学生被逮捕"
 goering.18.d:0 "他们曾是祖国的未来，却用虚妄的梦想将其摧毁；那些抱负过于崇高，又过于堕落。可叹其家族蒙羞，更可耻的是竟有人相信他们关于辉煌未来的恶心承诺。\n\n这些蠢货一到集中营就得付出代价。在那里，他们娇嫩的手将学会劳作，臃肿的头脑将算计口粮配额与负重斤两。他们将深刻领悟到把希望寄托在那个怯懦老贼身上的后果，那老东西除了保全自己和卑贱的奴仆，何曾为祖国效忠过？\n\n若真能想明白好歹，最好乖乖干活，别再抱怨什么该死的奴隶和原住民。在认清自己与同类该有的本分之前，休想重返祖国。要是榆木脑袋还不开窍，就等着喂狮狼之口吧——那些猛兽可比他们强多了。\n\n围捕这些恼人的学生及其头目易如反掌。抵抗者就地枪决，屈服者亦罪证确凿，统统发配集中营。\n\n但单惩戒那个混账建筑师栽培的暴发户还不够。那些未能劝阻天真同学造反的青年同样难辞其咎，他们的犹豫就是原罪。\n\n至少如今不必再为奢华的学府拨款了。他们敬爱的教授尽可以坐在讲台上转粉笔玩。这些人都得逮捕流放，祖国不需要也容不下那些聪明过头、自以为是的家伙。\n\n归根结底，这只是冥顽不灵者终局的开端，他们永远不懂强权即真理。"
 goering.18.a:0 "把这群小屁孩撵出去！"
 goering.19.t:0 "The Bankers Bleed"
 goering.19.d:0 "Greed is not good. And anyone who thinks they can leech off the good, strong, and bold German people shall be left with nothing, banished beyond the Fatherland's comforts and markets.\n\nThe new Führer had his eyes upon these rich parasites since the waning days of Hitlers reign. Now he reigned the Fatherland in his wake. Even if they do whatever spineless things they are perfectly capable of doing, they won't get the chance, not when he starts pressing his black boot against their necks. And that is despite his own dream of reshaping the economy of the Reich. Without them, he shall be master of the Reich's wealth, free to use it for his own purposes and the greater needs of the people.\n\nFor now, it was important to really sink the teeth of the state into their assets and their very persons. He ordered no mercy in his pronunciations against the hoard rats. He denounced them for their \"crimes against the personal wealth of each and every German citizen.\" And he insulted them as economists and monetarists who are as corrupt as the Jews. He even went so far as to accuse them of serving themselves; of being under the dirty paws of Jews - if they were not Jewish themselves.\n\nAnd naturally, they were swiftly dealt with in any manner available. From simply refusing to do business with them up to crafting unfortunate accidents that befell them, the good Führer would let these slide. As long as they help him throw those rapacious financiers out of society, he would not need to apply Germany's justice against them.\n\nAfter all, the natural enemy of the Fatherland was not those who served the Führer's interests but those who sought to be opportunistic; to squeeze them out like the thieves they are, returning their booty to those who rightfully possess it. That is how Göring and the Fatherland made new shall prevail in the absence of those goblins."
 goering.19.a:0 "Germany can live without this league of pests."
 goering.20.t:0 "Faith in the Gun"
 goering.20.d:0 "A man in his field uniform stepped into the classroom, his eyes drawn towards the students waiting in their seats, as their professor stood by his desk. The soldier didn't let his sight linger in one place, always bringing it from left to right. Entrances, exits, pathways, and obstacles; he stopped to look forward and walked to the front, then turned sharply, facing the center.\n\nHe let his left hand reach down, groping at an empty belt. The man bit his lower lip, remembering that he was not in a place that allowed for weapons. This was a school, the thought came across his mind. You'll get it back.\n\nThe professor spoke to his students, who either seemed intimidated by this visitor or, perhaps, excited. A few showed no emotion, only curiosity.\n\nThe man waited for his own chance to speak. Patiently, of course. But the way the man spoke, with its awe; its naivety; its ignorance - his voice annoyed him. His left hand groped for the empty space by his belt once more. Nothing to hold; nothing to bring up and shoulder; nothing to give him some measure of control, of safety. Just as sweat dropped down his neck.\n\nWhen the older man stopped speaking and returned to his seat, the soldier - an experienced rifleman who had served as the Fatherland saw fit for him to serve in whatever place, then serving once more to win the Fatherland for the new Führer - stiffened.\n\nThoughts raced through his head, as bullets once did by his ears. A nervousness rang as ruined bells inside his equally ruined mind. And the full measure of the past rose back up to the surface, tormenting him with the truths of war as these students seemed not to really comprehend anything at all.\n\nThis war of mine, he said to himself, reminding his conscience, is not theirs to thoroughly appreciate. He wished himself to will through and speak about his experiences as they were to him; raw, brutal, and traumatic. But the state would not permit it; war was a glorious thing, as the new Führer declared for a new Germany.\n\nHis left hand pressed against his thigh. And he began to speak, choosing to lie to them - to lull them into the dream of conquest and of power they wanted to believe. At least, in his brand new attire, he would look good as he got this over with; yet, within, his heart seemed to tug at the seams."
 goering.20.a:0 "\"Children of the Fatherland, I give you war.\""
 goering.21.t:0 "Pride in the Führer"
 goering.21.d:0 "Hermann Wilhelm Göring, the former president of the Reichstag; former minister president of Prussia; and above all, the man who, from its birth up to its greatest victories over the Allies and the vanquished Soviets, created the vast Luftwaffe. Now, he is the Führer of the Reich. Now, he is the man who has saved Germany from all their enemies, both within and without.\n\nNo longer shall the likes of Speer dare to corrupt the youth with delusions of freedom; no longer shall the ilk of Heydrich seek to bring the Reich under the influence of the traitor Himmler; and no longer shall the bastard Bormann hope to trap the people in the false bliss of the status quo. Unlike these men the great hero of a new Germany, lifting it by the dirtied hand out of the ashes of a terrible civil war launched by these jealous men.\n\nNever again shall Germany be without a hero as mighty, as bold, and as single-minded as the Führer! Therefore, it is declared that each and every building possessed by the government, that each and every structure owned by the public, shall bear his portrait. Though he may not always be with us in person, he shall always watch over us in spirit.\n\nThe radios and the televisions too shall declare what a wondrous leader he is. They shall proclaim his victories and speak of his men, who are brave enough to meet the challenge of protecting this new Germany for the people who believed that the best way forward into the future, through the drudgery of time, through the difficulties of war and the decay of peace, is only in the never-ending confidence in the strength of our armies, our fleets, and our soaring wings. Just like in the wars fought so long ago to reclaim the glory lost in the First World War, so shall our future conquests be for the good of Germany's happiness!\n\nOur faith is in our dear Führer Göring. Just as we have placed faith in Hitler, so shall we give him our deepest and most unshakable faith. Germany forever shall be victorious! And Germany alone shall live on!"
 goering.21.a:0 "Germany above all! Above all in the world!"
 goering.32.t:0 "深夜阅读"
 goering.32.d:0 "汉斯坐在卧室里，却仍警惕地环顾四周。房门紧锁，窗栓扣死，窗帘严丝合缝地垂落。这间屋子成了名副其实的黑箱，唯有那盏阅读灯投下稀薄的光晕。确认安全措施万无一失后，他拉开书桌抽屉，从凌乱的纸堆里缓缓抽出那本小书。\n\n《西线无战事》，埃里希·玛利亚·雷马克著。这本讲述一战士兵生活的小说，记录的正是祖父亲身经历过的战争，但与汉斯读过的其他战争读物截然不同——那些书总在歌颂战斗的崇高、战场的荣光，以及千篇一律的背刺论，而眼前这本却道出了截然不同的真相。战壕里的士兵与鼠患为伴，在污秽中挣扎求生，光是描写老鼠的段落就让他胃部翻腾，更别提那些可怖的死亡场景。这与学校灌输的战争叙事大相径庭，难怪此书会被列为禁书。当初赫伦教授偷偷将书交给他时，曾要他发誓绝不透露此事。虽然汉斯早就在禁书名单上见过这个标题，但直到真正读完才明白遭禁的缘由。\n\n突如其来的敲门声将他钉在原地。\n\n“汉斯，睡了吗？”\n\n他瞬间熄灯藏书，箭步窜回床上。母亲渐远的脚步声宣告危机解除。今夜只读完寥寥数页，但这无妨。纵使耗时再久，他也要将这本书啃完。"
 goering.32.a:0 "并且不能让人知道。"
 goering.36.t:0 "Göring Enters Germania"
 goering.36.d:0 "In what has been a carefully choreographed and rehearsed display of overwhelming German military grandeur, the entry of the rightful Führer into Germania begun. Field Marshal Schörner, mounted on a white horse, led the first company of officers on horseback down the Avenue of Splendours followed by a squadron of panzers; The Field Marshal bearing one of the few surviving banners from the 1935 party rally. Following the Field Marshal, Germany's loyal Generals took their place either side of a red carpet leading to a great podium erected in the Großer Platz.\n\nThe Germania philharmonic orchestra struck up Wagner's 'Die Walküre' as 100 spotlights illuminated the gathering darkness in pillars of light, recalling the 1935 party rally. At this signal, a flight of helicopters swooped over the Avenue of Splendours, with the Führer's own helicopter landing gracefully in the Großer Platz. To cries of \"Heil Göring\" the Führer made his way to the podium, receiving the salute of the assembled Generals. Retiring General Rommel then presented the Führer with the keys to Germania, formally welcoming the Führer to his rightful place in the capital.\n\nThe Führer then made his first official address to the nation. \"Germany, today we light a fire that will never be extinguished! The traitor's sickness has been cut out, Speer and Bormann have fled in disgrace and Heydrich has vanished at his master's call! Under Providence's guidance, we have proven ourselves the strongest!"
 goering.36.a:0 "A new, Greater Germany is forged in final victory! Heil Göring! Heil Göring!"
 goering.42.t:0 "首批晋升"
 goering.42.d:0 "元首身着剪裁考究的礼服，整套陆军元帅制服从半截短披风、繁复的金线滚边到胸前密不透风的勋章墙都透着摄人气魄，更不必说那根镶满宝石的权杖——自内战爆发以来，戈林已许久未能如此纵情展示威仪。此刻正是他向民众、尤其是向国防军宣示自己作为德国新主君威严的绝佳时机。\n\n按常理而言，即便擢升的是功勋卓著的将领，本也不需这般大张旗鼓。至少在希特勒时代确是如此，但戈林终究不是希特勒，这本就是人尽皆知之事。对排场与仪态的狂热追求早已深植于他的执政风格，如今大权在握，各类庆典活动自然愈发频繁奢靡。更何况，元首确有必要嘉奖那些在平叛中表现杰出的军官们。\n\n汉斯·斯派达尔手持名册朗声宣召：“约翰内斯·施泰因霍夫，上前一步。”斯派达尔的出席意义非凡——眼前这批受衔军官皆是元首为制衡舍尔纳派精心挑选的骨干，无论他们是效忠戈林抑或斯派达尔，只要非国防军最高统帅部心腹便足矣。此刻出列的将领正是元首亲自遴选的嫡系。与戈林一样，施泰因霍夫骨子里流淌着王牌飞行员的血液，元首早已将其视为股肱之臣。此番晋升既是对这位悍将的应有犒赏，亦是为已居庙堂之高的戈林遴选执掌空军的不二人选。更重要的是，这将使元首得以从繁冗军务中暂获喘息。\n\n当戈林为施泰因霍夫佩上空军上将肩章时，他脸上浮现出慈父般的微笑，轻拍新任将领后背目送其归位。新元首正以“润物细无声”的方式将国防军逐步收入囊中。斯派达尔在名册上勾去施泰因霍夫的名字，继续宣读下一位将领。"
 goering.42.a:0 "“汉斯·托伊森上校，上前一步。”"
 goering.47.t:0 "A Ring of Power"
 goering.47.d:0 "Göring carefully handed his nephew his ring, carefully depositing it into the palm of the man's hand. Heinrich studied it with intense fascination bordering on awe. The Führer smiled boyishly with delight.\n\n\"Now this one Heinrich, was made by Herr Zeitner when I became Reichsmarschall. See the insignia on the side?\"\n\nHeinrich nodded, enraptured with the spectacle of the object. Had it been anyone else, Heinrich thought silently, he would have haggled for it right then and there. But his uncle would never part with a symbol of his power and success, not even for all the gold of the Swiss.\n\nApparently Heinrich was not as unreadable as he had hoped, because his uncle seemed to have understood his inner thoughts.\n\n\"It is a marvel isn't it? Of course, you could always have one for yourself, if you wanted it.\"\n\n\"Er, but uncle, I'm not a Reichsmarschall.\"\n\n\"Heinrich, you're a Göring, and I take care of my family. I'm sure I can find something for you to manage. Give me some time and I'll get you a good position, something nice and quiet but hopefully not too boring. Besides, I may need you to take some important responsibilities soon and this ought to be a good experience for you.\""
 goering.47.a:0 "A little nepotism never hurt anyone right?"
 goering.48.t:0 "戈林青年团"
 goering.48.d:0 "阿图尔·阿克斯曼在元首书房门前驻足，以机械的动作仔细掸去制服上每一粒微尘，又一丝不苟地抚平每一道褶皱。这位前希特勒青年团领袖满意地审视过自己的仪容后，终于推开房门昂首而入。随着靴跟相碰，他行了个修改后的纳粹礼。\n\n“戈林万岁！”\n\n面前的老鹰对下属这番露骨的奉承报以玩味的笑容。“阿克斯曼部长，见到你真好。新职位还适应吗？”\n\n阿克斯曼轻咳一声，字斟句酌地答道：“总体而言我非常享受这份工作。但更重要的是，我的元首，您委以外交部长一职令我受宠若惊。”\n\n“很好，听你这么说我很欣慰。”阿克斯曼从元首语调中捕捉到某种暗示，却难以参透其中玄机。戈林向来藏不住心事，仿佛听见了部长的心声般，他接下来的话揭晓了谜底。\n\n“知道吗阿图尔，我正和莫克尔先生在青年团总部推进新项目。当然，这个组织的卓越之处，在座的没人比你更清楚了。”阿克斯曼配合地轻笑，暗自揣测着话题走向。\n\n“总之，”戈林重新掌控话题，“青年团固然出色，但它是为阿道夫服务的。如今阿道夫已成历史，我才是国家的领袖。你可懂我意思？”\n\n阿克斯曼顿时会意，忙不迭点头。戈林的笑容愈发灿烂：“很好！所有文件都已备妥，但戈林青年团的成立仪式，非由你阿图尔主持不可。要不是你身兼要职，本应让你全权负责——不过没关系！现在我授予你戈林青年团领袖的荣誉头衔。虽是虚职却尊贵十足。坐下吧，我来详细说明……”"
 goering.48.a:0 "个人崇拜推陈出新。"
 goering.49.t:0 "The New Reichsmarschall"
 goering.49.d:0 "Heinrich Theodore Göring attempted to study the faces of the officers in attendance for his formal promotion ceremony. There was Schörner, his face harsh, his lips held in a line so thin and straight it might have come from a surgeon's scalpel. He was never good at interpreting the emotions of the ruthless commander, save for when he was furious, but it seemed plain he was not enjoying the event. A few empty seats away sat Speidel, who at least lacked his rival's unnerving countenance. Still, even if he wasn't as utterly humorless as the butcher, he didn't seem all that particularly happy either.\n\nBut so what? They weren't the Führer, they weren't in charge, and they weren't being promoted. Let them sulk, Göring thought to himself as he watched his uncle ascend to the dais where he had presided as president under the late Hitler. He would show them that he too could lead armies across Europe and beyond. What could they do but sit and watch. Sure, they might play tough and kings of the hill but at the end of the day it was his uncle whose word was law of the land and it was Heinrich who could sway his uncle.\n\nHe tried not to let his smile show as his uncle invited him to stand beside him, to bask in the glory of the occasion as the assembled delegates of the party cheered and cheered. He couldn't be sure that he had been successful, but it hardly mattered. The Führer carefully christened Heinrich's finger with a ring just like his own, officially crowning his nephew as the first Reichsmarschall des militärischen Transports."
 goering.49.a:0 "A new actor enters, stage right."
 goering.50.t:0 "The New School In Session"
 goering.50.d:0 "The halls of the war academies across the Reich are filled with the sounds of young officers. These men have seen the great need their fatherland has been left in for competent leaders following the Civil War and have nobly stepped up. Many of them are veterans of the Civil War itself, having fought for the legitimate heir of Adolf Hitler, while some are young enough that they have only just come of age but were selected for the aptitude they displayed as members of the Hitler Youth.\n\nPerhaps it is due to the unique circumstances of the moment, perhaps it was always bound to happen, but whatever the reason, these newest officers seem to be a new breed apart from their peers. While most of the army's upper echelons are divided bitterly between rival cliques, most notably those of Schörner and Speidel, the \"New Guard\" as they have been nicknamed are much less factional. That is not to say they are apolitical, but it cannot be denied that most of the newcomers have chosen not to favor any one side too heavily.\n\nWhile this has been a blow to the clique leaders, always in need of more allies, it is hopefully a sign that the age of militarists leveraging immense political power may be coming to an end. At least, the Führer hopes that this is the case. In the new guard, perhaps there would be a respite from the demons that plague his dreams."
 goering.50.a:0 "Class has begun."
 goering.1703.t:0 "Between Behemoth and Leviathan"
 goering.1703.d:0 "Johannes Steinhoff entered the office to the drum of soft flesh on wood. It was the Führer of course, his thick fingers restlessly bouncing against the surface of the table over and over in an erratic rhythm. The veteran pilot noted that each digit was crowned with at least one jeweled ring. The value of the man's hands must have been worth more than an ME262. The 262; thinking about the jet had been a mistake. He felt himself once again in the cockpit, the sickening drop, the blinding flash. Then the fire, the awful flames that he could feel even now.\n\nIt took a supreme effort to regain his bearings. That was the past he reminded himself. That was the past and this is the present that must be focused on. If the corpuscular despot noticed the inner monologue, he didn't announce it. Instead, he gestured to a chair. Once the ace had seated himself comfortably, he plunged into the question that had been hanging above them this whole time.\n\n\"My Führer, while I deeply appreciate the trust you seem to place in me, I am still unsure as to why you want me specifically to lead your Luftwaffe.\"\n\nTo his surprise, Führer Göring smiled, \"Ah straight down to business, eh? I like that in a subordinate you know. Always good to get right to the important parts and leave small talk for later, yes that's just what I require.\"\n\nHe began to say something else, but stopped himself, looking to Steinhoff as if he might be nervous about something.\n\n\"The truth is General Steinhoff...\" he was quieter now, almost conspiratorial, \"the truth is that I need someone who isn't beholden to either the butcher or the pissant by my side.\"\n\nSchörner and Speidel - the realization dawned on Johannes, the Führer was apparently not fond of his top officers it seemed.\n\n\"It will be a tall task no doubt, but I offer to spare no expense for my Luftwaffe you understand. Anything you want, you'll have no questions asked. Nominally of course you'll have to report to Generalfeldmarschall Schörner at OKW really you'll be answerable to me and me alone. Just send him some paperwork every now and again and I'll keep him off you. So, what do you say?\""
 goering.1703.a:0 "\"I suppose I don't have much of a choice.\""
 goering.1704.t:0 "The Pencil Pushing Admiral"
 goering.1704.d:0 "\"So, what do you think, Admiral Puttkamer?\" The Führer studied the face of his guest, looking for a hint of the demanded decision. As usual, Puttkamer kept his poker face. Or maybe it was just indifference? In all their years together the old Reichsmarschall had never been able to parse out how much of the inscrutability Adolf's old adjutant exuded was a matter of personal policy or as simple disinterest. He briefly wondered if he had born a similar expression in those days when he had taken to the morphine needle. No, he decided after a little thought, even in the worst of his stupor he had always had the flame of ambition and the will to carry it forward. Karl-Jesko von Puttkamer was nothing like him.\n\nSo why then was he giving such a man the reins of the Kriegsmarine? Rather, what was left of the Kriegsmarine following the defections and the blow of Dönitz's mutiny anyhow. Göring could have given a dozen public-ready answers at that moment: the man had served Adolf impeccably, he had a long and distinguished career, on and on. The truth however was far simpler. The man had no ambition whatsoever. Even the humblest of clerks in the Reich's government knew that the new Führer was, to put it politely, not very interested in the functioning of the navy. That meant it was best left to someone else to manage, and better a man with little desire to abuse his authority than one hungry for more power. Never another Dönitz, that was Göring's sole criteria when he began his search, and it was the criteria he followed when he landed on Puttkamer.\n\n\"I just want to remind you,\" the heavy-set dictator said softly, noticing the lack of response to the ultimate question, \"that I do not intend to bother you on your duties. Nor will General Schörner be given free reign either. You will of course report to him, but that doesn't mean he has any more desire to manage your affairs than I do. Frankly, I'd consider it a great favor for you to remove the navy from all this factional bickering once and for all.\"\n\nPuttkamer nodded slowly, almost... thoughtfully.\n\nThat was all Göring needed, an acceptance, whether Puttkamer had realized it or not. With profuse thanks he escorted his new Grossadmiral to the door. For his part, Puttkamer put up no resistance, seemingly consigned to his new role. Good, Göring thought as he closed the door to his office, he hated when things were made difficult."
 goering.1704.a:0 "Who even needs Dönitz?"
 goering.1705.t:0 "The Hard Sell"
 goering.1705.d:0 "\"My Führer, I must again insist that I do not feel as though I would be the best candidate to assume the position, especially in light of who my superior would be.\"\n\nGöring glared at the old war hero. Hours of this damnable stalemate was making him frustrated and irritable. Not for the first time he considered directly ordering Speidel to assume control of OKH, but then that would have to be an absolute last resort. He needed the general to agree to take the position and needed him to, if not enjoy his place in the new regime, be a check against Schörner.\n\nSpeidel must have thought that ended it, he began to rise from his chair. That made Göring snap, \"Damnit general, do you not understand the stakes at play here? Do you think this is all about personal pride and pleasure? It isn't!\"\n\nSpeidel's annoyance was written across his face. He clearly resented this lecture. Göring knew he had to make an all or nothing attempt if he wanted to salvage the situation.\n\n\"Listen general, if you wish to serve the Reich and its people in the most effective way, then you must accept. Do you wish to see the entire Wehrmacht in the hands of Schörner? I certainly don't but it seems you do, if you'd simply walk away at this opportunity to limit his influence. Accept, and we can work together to make sure he isn't the only voice in my ear.\"\n\nThat got Speidel to stop. He responded slowly, thoughtfully, \"If I were to accept, and that's only an if at this point, I would need some guarantees of non-interference from Schörner if the goal is to actually be effective in my position-. Would that be possible?\"\n\nThe Führer smiled; he had Speidel hooked. \"I can't guarantee a miracle but I should be able to wring out some concessions for your autonomy.\"\n\nSpeidel sighed, nodded, \"The things we do for the Reich...\""
 goering.1705.a:0 "An unlikely alliance begins."
 goering.1706.t:0 "A Proposal at Carinhall"
 goering.1706.d:0 "Gaspard had delivered a meal as splendid as always. The Führer made a mental note to reward Carinhall's resident chef, maybe he would even give the slaves who assisted him a day or two off. He was feeling magnanimous after such a lovely dinner. But enjoying his meal, even an excellent one, was not the purpose of the night. No, the purpose was the two men who flanked Göring on either side of the table. On his right sat Albert Bormann, the loyal brother, and to his left was seated his nephew Heinz Theodore. The pair also seemed to be savoring the experience.\n\n\"Uncle, the roast beef is exquisite, I've never had it served so well before. Your cook will have to give mine the recipe one of these days.\"\n\nGöring smiled, \"Thank you Theodore, but the food can be discussed later, I think. Right now I need to ask both of you,\" he motioned for Albert to join the conversation, \"to prove your loyalty to me.\"\n\nAlbert, always trying to make up for his familial shame, was predictably quick to respond, \"Of course, my Führer, whatever it is you need we will provide. I swear we are both your devoted servants.\"\n\nTheodore lamely nodded along, never one for having much in the way of independent thought. That would actually help in this case however.\n\n\"My friends, the Reich is at a crossroads. We may have triumphed in the civil war but I must still contend with the Wehrmacht. They believe I owe my position to their efforts alone! Knowing that tenacious bastard Schörner, they will never let me forget it. That's where you two come in. I need men I can absolutely trust within the high command, men willing to keep me updated on everything the generals do. Gentlemen, can I count on your service?\""
 goering.1706.a:0 "There could only be one answer to the Führer."
 goering.1707.t:0 "King of the Abwehr"
 goering.1707.d:0 "As he strutted into Hermann Göring's office, Reinhard Gehlen noticed the Führer seemed somewhat nervous. It was a rare state to see him in, and Gehlen wondered what had occurred to induce it. He would have his men look into it. Before he could further ponder it, however, the Führer addressed him. \"Herr Gehlen. Welcome. I trust you mean to accept my offer? The Abwehr is in need of a new chief soon, and if you do not intend to take the position, I will need to begin searching for a suitable alternative immediately.\"\n\n\"There is no need for that.\" Gehlen responded, curtly. \"I intend to take the position, of course.\" He noticed the Führer's eyes wandering towards the door, so he glanced over his shoulder. There was no one there. His attention turned back to Göring, who had begun to focus rather intently on Gehlen instead. \"However, if I may ask... is there a reason this promotion was not offered to me by Feldmarschall Schörner? The Abwehr is within his purview, is it not?\"\n\nGöring looked as if Gehlen had slapped him. \"I am the goddamn fucking Führer, and I appoint who I please.\" His voice was a quiet hiss, as if he did not want any outburst to be overheard. The Führer glanced at the door once again, before continuing, more calmly. \"Schörner may cut your checks and take credit for your work, but as long as I am Führer, you report to me first. Is that understood?\" Göring's eyes bored into the spymaster, a mix of domineering and desperate. Gehlen, suddenly having gained a much clearer understanding of what was occurring, quickly nodded."
 goering.1707.a:0 "Yes, my Führer."
 goering.1708.t:0 "From the Homefront"
 goering.1708.d:0 "The air screamed with the sounds of the machinery as production line upon production line produced the weapons of conquest and death. Jon hadn't heard the Dresden factory shriek out this much for almost a decade now. Even during the civil war, the factory had been quieter. What that meant for the future, the slave shuddered to imagine. He had seen the horrors of war firsthand, as his beloved Poland was crushed under the Nazi boot all those years ago. No one deserved such a fate.\n\nThe conveyor belt sent more half-assembled grenades his way, waiting for final assembly. It was then that the idea came to him. It was a foolish, brazen idea. But Jon had always been a daredevil in his youth. It was the memories of those days in the streets of Lublin, getting into mischief with tinkering with the watches in his father's shop that drove him forward. A modification here, an adjustment there, and the grenades would detonate much sooner. With any luck, they'd take whatever Nazi bastard was throwing them to Hell.\n\nThey had made the factories to be as efficiently possible, producing as much material as they could wring out through slave labor. For the first time since being sent to the damned place, Jon was happy about that fact. He was producing the defective explosives at a truly prodigious rate. Even the foreman seemed impressed, granting him an extra hour of rest for his efforts. Jon almost laughed out loud, but kept his composure and facade of submission.\n\nJon had long ago abandoned his faith, but he prayed to God now, for the nations of the world. He prayed his contribution to their defence would be felt; one life saved was all he asked for."
 goering.1708.a:0 "A just punishment awaits."
 goering_expanded.34.t: "By Mixing a Lighter Shade of Brown..."
 goering_expanded.34.desc: "The predawn fog on the airfield runway was dissipating, making it possible to bring all the captured people to it in small groups and bring them into one line.\n\nThe convoy lined them up and counted them – they were all in place. A group of staff cars drove out from behind the opened gate, one of which slowed down and turned sideways, stopped in front of the prisoners.\n\nThe door opened smoothly, and the Führer himself got out of the car. He obviously did not enjoy being somewhere at the Luftwaffe base near Tilsit, but there was too much reason to miss such an important event or send one of the many trusted people to it. He needed neither Schörner nor Speidel here, he had to do everything himself as he saw fit.\n\nAn interesting picture appeared before Göring's eyes: an uneven formation consisting of a dozen people, some of whom presented a completely pathetic sight, and were more similar in appearance to sacks of potatoes, which were kept on their feet only by escorts from the military police, and several of the lined up looked as if they had just returned from a parade or an important reception.\n\nHe looked at the line once more and coughed expressively into his fist, said: \"What kind of look do they have?! Is this how the generals of our glorious Wehrmacht should be dressed?\"\n\n\"No, my Führer! Some officers were captured by us only a couple of days ago!\" one of the guards in the convoy replied.\n\nGöring only shook his head in displeasure. \"Bring them to me! Now! And take off their handcuffs! It disgraces the honor of the uniform\". He ordered the escort, going inside a small well-maintained building near the tower.\n\nSeveral people entered the only office in a measured manner - Fieldmarshal Walter Wenk and Generaloberst Krebs were the first. Their faces, which ten minutes ago had expressed acceptance, now expressed mild bewilderment and interest because of such attention from the Führer. They were followed by Generalleutnant Schnez, who, almost falling, entered \"by the arms\" of Generals Zadrocinski and Trettner. Krebs rubbed his wrists as he entered, and Wenk scratched his stiff neck.\n\nFinally, Göring began: \"Well, I assume that you were afraid of humiliating reprisals against you. It should be noted that my people treated you extremely inappropriately, considering you prisoners. I will definitely reprimand these idiots for such treatment of their superiors!\"\n\nSuch immodest kindness caused a mixture of bewilderment, apprehension and relief among the generals. And yet Krebs was the first to find the courage to ask. \"But why are we here?\"\n\n\"I want you to rejoin the great German army, of course! We must not allow such talents to be lost! Of course, you made a mistake in your initial choice of side, but who does not make mistakes?\"\n\nThe generals looked at each other. It was obvious to all of them that Göring was clearly sparing them not out of the kindness of his heart, but they were not up to figuring out motives with the alternative in the form of a bullet in the head looming over their heads.\n\n\"I don't think we have a choice... We agree.\" Finally, Wenk said.\n\n\"Great!\" Göring replied joyfully. In fact, neither the talents nor the old achievements of the generals bothered him. Whoever was in front of him, the future in relations with Schörner and his clique was extremely vague. He wanted to enlist the support of those who could have at least some weight in front of the Monster in Uniform and his assenting lapdogs. He hoped that Bormann's loyal and generally pragmatic generals would be able to at least slightly shift the clock in his favor."
 goering_expanded.34.a: "Schörner clearly will not be happy with new company."
 GER_GOR_Protests:0 "The Students are riled up"