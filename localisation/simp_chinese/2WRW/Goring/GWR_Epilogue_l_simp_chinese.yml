l_simp_chinese:
 GER_GOR_the_end_is_near:0 "终末将至"
 GER_GOR_the_end_is_near_desc:0 "就连世界三大强国也无法与我们抗衡——美国土崩瓦解，日本四分五裂，而那个流氓国家早已成为遥远的记忆——现在还有谁能阻止我们？必须为日耳曼民族全面主宰的终章做好最后准备。"
 GER_GOR_army_marches_on:0 "……而德意志铁骑继续挺进！"
 GER_GOR_army_marches_on_desc:0 "德意志的战士已用铁血铸就史上最强战士的威名。他们举世无双，天下无敌，铁蹄踏遍各大洲各国度，所向披靡。没有他们攻不下的城池，越不过的桥梁，碾不碎的敌寇。以德意志之名征服世界后，他们唯一的使命便是维系这既定的秩序——驯服败者，誓死捍卫属于他们的一切。从今往后射出的每一颗子弹，都将来自背后有整颗星球为后盾的战士之手，而这颗星球早已被他亲手征服。他们是新世界的英雄，也将永远被作为英雄来尊崇。"
 GER_GOR_let_the_bombs_reign:0 "德意志空军主宰天空……"
 GER_GOR_let_the_bombs_reign_desc:0 "戈林引以为傲的空中力量从未如此不可撼动。那些构成实质威胁的高射炮与地对空导弹寥寥无几，只掌握在固守旧时代的小股恐怖组织手中。敌机已彻底绝迹——即便最狡黠的游击队也无力配备双翼机，遑论超音速喷气战机。环球巡航时，地面连愤怒的注视都不会投来。当我们的精英飞行员翱翔天际时，他们确信自己近乎无敌。当然，这支力量仍需效力：凭借绝对制空权，他们可肆意向顽抗者倾泻弹雨而无后顾之忧。但除了镇压叛乱，我们的飞行员如今只需操心如何在最新航展上大放异彩。"
 GER_GOR_germania_rules_the_waves:0 "德意志海军统御波涛……"
 GER_GOR_germania_rules_the_waves_desc:0 "若无敌手，海军何用？当从最小的渔船到最庞大的航母皆飘扬同一旗帜，钢铁巨兽又有何存在意义？假若叛乱爆发、起义蔓延于征服之地，可有哪支舰队敢与我们在远洋争锋？此乃辉煌胜利后必须直面之诘问。除却打击海盗、防范劫船之虞与零星岸轰任务，现代世界已无海军用武之地——其首要职责，竟沦为护送运输船队抵御虚无之敌。然英雄岂可遗忘？于最原始之心理层面，德意志海军今之存在，只为昭告天下：寰球海域无一能逃纳粹掌控，碧波所至皆如陆空，尽属吾疆。裁军终不可免……但此刻一切仍将如常。我们的舰船或许在宣传领域比实战中更能发挥作用，但它们仍将一如既往地巡航。"
 GER_GOR_execute_order_66:0 "§R日耳曼世界§!"
 GER_GOR_execute_order_66_desc:0 "一个民族\n\n一个国家\n\n一个元首\n\n§R一个世界！§!"
 GER_GOR_all_heil_goering:0 "戈林万岁"
 GER_GOR_all_heil_goering_desc:0 "全球日耳曼帝国已然宣告成立，世界尽归雅利安种族统治。戈林的功业已超越亚历山大大帝与拿破仑，即将发表演说昭示其统治的未来宏图。此时此刻……还能有何变数？"
 goering.epilogue.1.t:0 "奥兹曼迪亚斯的遗物"
 goering.epilogue.1.d:0 "舍尔纳拖着沉重的步伐走进新办公室，年迈的身躯让他真切感受到自己七十——不，八十多岁的沧桑。这些年来他刻意回避计算具体年龄，因为每次想起都令人沮丧，可此刻这个念头却挥之不去。羸弱的躯壳里翻涌着纷乱的思绪，没有一个是令人愉快的。他明明胜利了，不是吗？美国已臣服在军靴之下，正被改造成元首梦想中的模样；日本被剥得精光，失去天皇的庇护后沦为破碎的空壳；此刻党卫队叛徒最后的负隅顽抗也正被肃清。这本该是他荣耀加冕的时刻，为何只感到……疲惫。\n\n这场征服早已失去所有荣光。就在五年前，他还能在俄罗斯冻原、意大利群山甚至非洲恶心的丛林中不知疲倦地征战。军事指挥官干裂的嘴唇间溢出一声苦涩的冷笑——亲眼目睹非洲战场时，他差点为汉斯被派往那种鬼地方感到歉疚。而此后战事却愈演愈烈。平心而论，早在战争计划B结束后，雷莫挣脱束缚发动政变时，舍尔纳就已心满意足想要收手。那个畜生！\n\n如今他只能眼睁睁看着权力从指缝流失，率领优等民族走向辉煌的宏图终成泡影，从一开始就注定失败。当再无敌手可战时，费迪南德·舍尔纳终于直面比丧失领土与威望更残酷的事实：\n\n他永远成不了元首。\n\n即便能奇迹般击败雷莫、安抚阵营中的温和派、除掉戈林那头肥猪，这样的胜利又能维持多久？一年？顶天了吧？光是落座办公桌时骨骼的哀鸣就在告诫他：不值得。若国家高层的处境如同他为戈林精心打造的那般，那么敬谢不敏。\n\n他当然会继续效忠，毕竟在这个他亲手征服的帝国里，退休者本就没有容身之处。每一桩贪污、每一次枪决、每一条针对美国民众的反人类罪行，最终都会追溯到行将就木的费迪南德·舍尔纳头上。他终将被遗忘为自己亲自打造的机器中一颗普通齿轮，直至在无人喝彩中死去，被新人取代。"
 goering.epilogue.1.a:0 "功业盖物，强者折服。"
 goering.epilogue.2.t:0 "当头棒喝"
 goering.epilogue.2.d:0 "莱娜甚至无法在地图上指出自己村庄的名字。\n\n她始终过着与世无争的生活，那个只有一条通往远方大城市的道路的小村庄就是她的整个世界。当雾霾散尽时，她偶尔能望见城市里高耸的公寓楼，还有那座象征着俄罗斯复苏时期虚荣心的摩天大楼。对莱娜而言，生活本不算糟——当俄罗斯还陷于军阀混战时，士兵们顶多来村里搜刮些微薄物资；待到统一进程开始后，新政府更是为村庄带来了全面通电和稳定的清洁水源。她的日子眼看着就要好起来。\n\n直到德国人来了。\n\n准确地说，入侵者并非德军地面部队，而是那些钢铁战鹰。国防军“仁慈”地放过了莱娜的村庄，将全部怒火倾泻在远方的城市，因此起初战火并未波及她的生活。虽然目睹摩天大楼在战火中崩塌令人心碎，但这不过是暴风雨的前奏。停战至少一年后的某个清晨，那些阴森的机群再度掠过天际，这次她的村庄未能幸免。当时她正在野外采摘制作项链的野花，归来时恰见家园在震爆闪光中化为火海。\n\n失去一切的莱娜浑浑噩噩地流浪到从未踏足过的城市，试图在这片废墟中谋生。德军的铁蹄早已碾碎了城市的灵魂：平民因微小过失就当街枪决，穿着田野灰制服的军官随心所欲地施暴，侵略者施加的种种暴行更是不堪言说。当看见同胞像牲畜般被驱赶进工厂时，莱娜终于明白：这里没有活路，只有生不如死的折磨。\n\n去他妈的。莱娜下定决心，与其在德军统治或严寒中等死，不如把命运攥在自己手里。就在这个念头闪现时，她在堆满瓦砾的废弃小巷里——那种弥漫着死亡气息的角落——发现了一张被雨水浸透的残破海报。矿工肖像依然可辨：安全帽上的头灯，参差的牙齿，煤灰覆盖的皮肤，眯缝的双眼，所有这些都衬托着他疲惫而真诚的笑容。旁边用苏联风格的字体写着“我们还没倒下！”，下方小字标注“加入科斯京游击队！”。难道还有反抗的希望？她警觉地环顾四周，与另一位憔悴的中年女子四目相对，对方正隐晦地示意她跟进暗巷。既然已无路可退，莱娜便跟着那道身影隐入了黑暗。"
 goering.epilogue.2.a:0 "俄罗斯人永不投降。"
 goering.epilogue.3.t:0 "锈蚀之船"
 goering.epilogue.3.d:0 "金特曾以身为海军的一员而自豪——当年他可是拼尽全力才登上了最先进的战舰。这艘1955年从不莱梅船坞下水的驱逐舰足以应对任何海上挑战。那种天真烂漫的豪情壮志，如今想来多么令人唏嘘。\n\n所有船员都心知肚明，这艘服役多年的战舰正在急剧朽坏。锈迹从舱壁边缘蔓延，炮塔转动迟缓甚至卡死，最骇人的是下层甲板渗水的报告。水兵们竭力维持表面光鲜，但剥落的油漆下是苟延残喘的引擎和扭曲变形的舰桥，这艘船正缓慢走向死亡的事实令人窒息。\n\n然而维修工作始终无法开展。海军后勤部门既未拨付修缮资金，也未调运维修物资，但巡逻镇压任务却必须持续。无论遭遇海盗炮火留下的弹孔，还是大洋上的狂风骤雨，他们都得突破舰体极限执行任务。起初只是私下抱怨的水兵们，如今已敢公开谈论锈蚀甲板引发的破伤风风险。他们受够了舰长将一切归咎于“海军机构臃肿”的托词。若真臃肿至此，为何资源捉襟见肘？驱逐舰的巡逻范围与日俱增，而他们只能眼睁睁放过越来越多的海上犯罪，否则根本无法完成巡逻指标。\n\n但金特清楚这困局的真正根源，他多希望自己毫不知情。尽管全世界向日耳曼尼亚俯首，这个政府却显然无力甚至不愿维系世界秩序，哪怕周遭的一切正在分崩离析。否则怎会连最紧要的舰船维修都断然拒绝？\n\n如同所有军事独裁体系，消息被严密封锁。司令部只向各舰长传达他们想让后者知道的内容，而舰长也仅透露他愿意或获准分享的信息。但这阻挡不了总参谋部腐败、贫困失控、全球叛乱四起的传闻，也阻挡不了后方官僚对此装聋作哑。看着战舰的现状，金特毫不意外，许多同僚也或明或暗地抱有同感。他心知照此发展，灭顶之灾近在眼前——就像任何船只那样，只要一个致命缺口，这艘国家巨轮就会顷刻间沉没。\n\n戈林初掌权时，当装甲部队再度横扫欧陆最终登陆英伦三岛，他还常和战友调侃政府会比这艘船先沉没。如今这个笑话再也不好笑了。"
 goering.epilogue.3.a:0 "因为它即将成为现实。"
 goering.epilogue.4.t:0 "最后的演讲"
 goering.epilogue.4.d:0 "戈林缓缓登上演讲台，衰老的身躯让这段路漫长得像马拉松。他的双腿发软，并非因为无力支撑，而是深知这将是他最后的演说。在和平谈判落幕、庆祝完德意志时代的到来之后，他就做出了这个决定——退休。当时这个念头令他恐惧万分。退休？然后把权柄交给那群军国派马屁精？那群为了挑起冲突连月球都敢入侵的疯子？他宁愿当场暴毙也不愿目睹那番景象。\n\n但渐渐地，他开始冷静下来理性思考。虽然舍尔纳派以外的人所剩无几，终究还有几个硬骨头。必要时可以扶持其中一人。可这个方案仍不能使他安心。直到某个绝妙主意闪过脑海：若宣布由他的侄子继任元首呢？这个念头立刻让他血脉偾张。\n\n没错，这招可行！那边收买几个要员，这边影响陆军势力，就能凑够支持者实现和平交接。他只需徐徐图之，确保万无一失。\n\n正沉思间，他惊觉演讲尚未开始。匆忙加快脚步登上讲台，待掌声平息后开口道：\n\n“雅利安同胞们，日耳曼子民们，以及其他民族的朋友们，我们胜利了！”欢呼声与掌声瞬间爆发。为何群众如此爱戴他时，自己却感到阵阵恶心？他继续道：“数十年来各方蛮族施加给德国的屈辱，今日终结！我们终于能在新时代——德意志时代展现雅利安种族的真正统治力！”这次掌声更甚，几乎淹没了其他声响。之所以说“几乎”，是因为他仍能听见自己震耳欲聋的心跳。上帝啊，为何这般反常？紧张与忧虑早已消散，此刻本该享受荣光。深深吸气后，他继续宣读最难启齿的部分：“但亲爱的同胞们，万物终有尽时。我服务于雅利安种族数十载，几乎奉献了整个人生。从卑微的飞行员到世界的统治者，而今日，这段传奇即将落幕。我宣布——”突然，戈林被一阵剧烈咳嗽打断。台下人群面面相觑。元首怎么了？只见他咳出鲜血，随即轰然倒地。不！他必须完成演讲，必须确保交接……"
 goering.epilogue.4.a:0 "上帝啊，快去叫医生！"
 goering.epilogue.5.t:0 "神明之死"
 goering.epilogue.5.d:0 "赫尔曼从昏睡中缓缓苏醒，茫然不知身在何处。发生了什么……对了，演讲。支离破碎的记忆碎片撞击着他的意识边缘，他猛然喘息着坐起身，扯动了插在手臂上的输液管。那位看着是医生的男人急忙跳起来监测他的心率——对于他这个年纪的人来说，跳动得实在太剧烈了，再这样下去会要了他的命，而他的挣扎随时可能让输液针头脱落。\n\n“我的元首，请您冷静！您这样挣扎我无法施救！”医生急切地劝阻。戈林逐渐恢复神智躺了回去，尽管他很想站起来证明自己仍堪大任。天啊，他太疲惫了。半梦半醒间，那些本该发表的演说词像跳针的唱片般在脑海断续回响，直到他发觉自己竟和那位老友一样忘了指定继任者。恐惧将他本就冰凉的身体彻底冻结，此刻他感到前所未有的虚弱。\n\n“医生，到底怎么回事？”他试图表现出震惊，却只发出困倦的呓语。医生沉默地做着检查，忧虑随着时间流逝在脸上加深。最终他倒抽一口冷气，说出了那个噩耗：\n\n“是败血症。我的元首……您快不行了。”\n\n戈林呆望着天花板，像被剪断提线的木偶。不可能。不该是现在，不该在他即将胜利的时刻！“……那就治疗啊！”他嘶吼道，不敢相信自己还需要下达这种命令。“我不能死这么早，我——我必须——”直到看见医生因暴怒而涨红的脸，戈林才注意到对方早已怒不可遏。\n\n“这么早？！”医生咆哮着，把元首吓得不轻。“因为您无休无止的征服，整整一代优秀的雅利安人要么战死要么在荒郊野外垂死挣扎，而您居然嫌自己死得太早？”元首真想掐死这个狂妄之徒。他怎敢这样用手指着人发表质疑！……但叔叔戈林看清了对方眼中强忍的泪水。无论戈林的统治多么耀武扬威，眼前终究是个不得不埋葬儿子的父亲，和德国乃至全世界数百万父亲一样。“抱歉，”医生颤抖着说，“失态了。有位访客坚持要见您，我无权阻拦。”\n\n舍尔纳拖着与戈林同样疲惫的步伐慢吞吞挪进房间，那种刻意为之的迟缓让戈林还没看清来人就露出嫌恶表情。但即便此刻，他敏锐的思维仍立即明白为何这位宿敌如此颓丧。“我的元首，听闻消息我立刻赶来了。想必医生已竭尽全力了？”费迪南德边说边瞪着冷汗涔涔的医师，此刻唯有恐吓他人能带来些许快意。\n\n“如果是来打听继任者，绝对他妈轮不到你，”戈林发出毒蛇般的嘶声。即便命不久矣，他也绝不会让“血腥费迪南德”接手，尤其在那家伙对德国犯下种种罪孽之后。然而舍尔纳接下来的话却让元首一愣："
 goering.epilogue.5.a:0 "“我同意。”"
 goering.epilogue.6.t:0 "神明之死"
 goering.epilogue.6.d:0 "戈林眨了两次眼，抬头望向输液瓶，怀疑药剂是否过量。“我知道时隔多年这话听起来很荒唐，”费迪南德·舍尔纳沙哑地低语，“但如果当元首意味着要被狺狺狂吠的疯子雷莫和心慈手软的自由派斯派达尔夹在中间，直到我也躺上病床……”这位衣冠禽兽的嘴角扯出苦涩的弧度。\n\n“那你为何而来？”戈林轻声问出这个显而易见的问题。“肯定不是来闲聊的……想必是打算干预我的决定。”他竭力从病榻上投去冰冷的目光，明确表达了自己属意的继任者。“我已选定海因茨。你我都清楚他是唯一人选。”\n\n尽管费迪南德不愿承认，但这老胖子说得在理。海因茨是文官，至少是如今最接近文官的人选，何况还姓戈林，能稳住民心。斯派达尔那个应声虫会乖乖服从，他麾下的温和派也能制衡雷莫。雷莫、雷莫、雷莫……想到这家伙在权力交接时暴跳如雷的模样，舍尔纳就反胃。他绝不会接受汉斯掌权，而德国经不起这种内斗。同样也经不起雷莫的肆无忌惮，因此他必须扶持海因茨·特奥多尔。\n\n“真没想到我们能达成共识，”费迪南德摇着头喃喃道，“自打……你还记得那个摄影师吗？”他陷入老年人追忆往事的习惯中。\n\n赫尔曼只是困惑地抬眼：“我该记得吗？”他厌倦地反问，光是倾听就已耗尽气力，却又孤独到……孤独到无法阻止费迪南德继续。上帝啊，他太孤独了。戈林试图回想上次与挚友畅谈是何时。施泰因霍夫算朋友吧？和他一样的王牌飞行员——这个念头在他衰老的思维中戛然而止。或许“朋友”不是好角度，那家人呢？\n\n家人……非但没能带来慰藉，短暂的清醒反而让戈林心如刀绞。他上次见女儿是什么时候？小埃达，他的亲生骨肉，难道……难道他忘了！“埃达在哪？”\n\n“埃达——哦，那姑娘啊……”费迪南德含糊应道，决定不再理会赫尔曼的悲戚。“她随时会到。”他信口撒谎，心知埃达距日耳曼尼亚还有数小时路程，且正面临堪比希特勒遇刺时的严密安检。“那我该告辞了……！”他吃力地起身，动作迟缓得令人心惊，挥手制止了欲上前搀扶的医生。“永别了，我的元首。”\n\n赫尔曼·戈林张了张嘴想挽留那道远去的身影，却发现已无话可说。在扭曲的视线里，那人影似乎转身回望，垂死的元首难以置信地呢喃：“……阿尔伯特？”随即眼中的光芒永远熄灭了。\n\n他空洞的躯壳凝视着这个国家疾驰而去的无底深渊。"
 goering.epilogue.6.a:0 "戈林已逝，举国悲恸。"
 goering.epilogue.7.t:0 "终局"
 goering.epilogue.7.d:0 "“索菲娅。”年轻男子低声呼唤睡梦中的索菲娅。“索菲娅！”他陡然厉声将她惊醒。“快来看这个。”她呻吟着从柏林旧公寓的床铺上起身，拖着步子走下日渐朽烂的楼梯。自从社会福利被削减充作军费后，她总害怕某天会踩穿这些台阶，同时竭力无视着一楼浸水的地板。\n\n莱娜和新结交的同志们围坐在从被灭口的殖民者一家手中抢来的电视机前，疑惑究竟发生了什么大事，能让德国所有媒体中断常规节目进行转播。即便在他们的藏身之处，信号仍强劲到令画面清晰无比。\n\n金特和船员们暂时摆脱了永无止境的维修任务。取而代之的，他们要全神贯注收听从日耳曼尼亚发出、经海军转播的无线电广播。这则广播覆盖了地球上每一寸土地，连这荒无人烟的南大西洋驻地也不例外。\n\n那个人出现在屏幕和电波中。费迪南德·舍尔纳——这个在德国内外（尽管这界限已模糊不清）都臭名昭著的人物，正站在人民大厅的讲台上讲话。但不同于以往，他虚弱衰老的声音令全世界涌起一阵强烈的不安。\n\n“我们无比敬爱的元首……他的功绩前无古人后无来者。在他的引领下，我们实现了最终胜利。然而，我此刻怀着最沉痛的心情向各位宣告：赫尔曼·戈林元首已离开人世，他守护着我们的国家直到最后一刻。”\n\n上帝啊。就在索菲娅以为生活终于要出现转机时，世界却在她面前第二次走向终结。当年将戈林推上权力宝座的那场斗争犹在眼前，如今又有谁能接替他的位置？全世界显然怀着同样的疑虑。金特盯着锈迹斑斑的甲板，方才的内容在他脑中回荡，他对即将到来的变故感到恐惧。莱娜和同志们同样僵在原地。他们虽然深信这个摧毁自己祖国的纳粹杂种终有一死，可此刻只觉得无比意外。\n\n“国会将在未来数周进行讨论，以决定下一步行动。在此期间，身为……临时领导人，我呼吁保持冷静，为了祖国的利益，全体纯正高贵的雅利安子民亦当如此。胜利万岁。”血腥费迪南德显然已无话可说，他迅速离开讲台，任由日耳曼尼亚陷入死寂，民众坠入惶恐。局面危如累卵，一颗小小的火星就足以让整个世界分崩离析。"
 goering.epilogue.7.a:0 "而世界以一把大火作为回应。"
 thank_for_playing_tooltip:0 "§R这是最后的演讲，也是日耳曼时代崩溃的开端。§!\n\n§B衷心感谢您体验完“戈林的狂野征途”的全部内容！我要感谢CurvingHawk创作了原版“戈林的狂野征途”，感谢“戈林的狂野征途”团队将这一切整合呈现，也要感谢TNO团队制作的杰出mod。没有这些贡献，这个submod就不可能存在。\n\n当然，还要感谢您——亲爱的玩家——完整体验了我们的创作。现在您终于可以从戈林的过山车上下来了§!，§Y至少暂时如此……§!"
 Goering_happi_tooltip:0 "§B整整十年的全面战争，无数生灵惨遭涂炭，无数文明不幸消亡，但军国派仍大权在握。胜利……万岁？§!"
 Goering_addio_tooltip:0 "§R撒旦终得消亡，但更为恐惧的邪魔已从深渊中显现§!"
 GOR_epilogue_army:0 "§B我们的军队所向披靡！荣耀归于德意志陆军！§!"
 GOR_epilogue_planes:0 "§B我们的飞机永不降落！荣耀归于德意志空军！§!"
 GOR_epilogue_navy:0 "§B我们的舰队永远破浪而行！荣耀归于德意志海军！§!"
 GER_GOR_conquered_world:0 "§B世界已尽在掌握。剩下要做的就是宣布所有权了。毕竟，还有谁能阻止我们呢？§!"