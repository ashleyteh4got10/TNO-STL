l_simp_chinese:
 goering_schorner.1.t:0 "好戏散场"
 goering_schorner.1.desc:0 "赫尔曼·戈林凝视着窗外，身躯左右摇晃。日耳曼尼亚的宏伟景象开始变得模糊起来，人民大厅的洁白大理石与漆黑天幕如油画颜料般交融晕染。电话铃声此起彼伏，嘈杂人声不绝于耳，远方枪响正步步逼近。戈林带着空洞的微笑晃动着香槟杯，一饮而尽。还有什么比世界末日更适合庆祝的呢？\n\n第一个电话来自一名情报官员。舍尔纳元帅和他忠诚的小集团正派人抢占整个日耳曼尼亚的政府大楼，清除异己并切断通讯。第二个电话是惊慌失措的威廉·施图克特打来的，他刚咆哮了几秒钟，便伴着惨叫被人拖走。\n\n铃声戛然而止。门外传来士兵的呼喝。往事如走马灯闪现：一战期间翱翔法国上空；初遇卡琳的惊艳；面对狂热群众的演说；与埃米的婚礼；埃达的出生；计划征服欧洲……埃米会怎么样？埃达又会怎么样？\n\n就让史书记载这是位战斗至死的元首吧。大门轰然洞开，一队军官列阵进入。戈林拔出他的鲁格手枪，漫无目标地射击。那些人开枪还击。剧痛在他的腹部爆发，推着他撞上书桌，最终喘息着滑落地面。鲜血浸透双手，将金婚戒染作猩红，华美制服如红酒渍般斑驳。。舍尔纳狞笑着将枪口抵住他前额。子弹撕裂了木偶的绳子，戈林毫无生气地瘫倒在地上。"
 goering_schorner.1.a:0 "戈林曾让莱茵染血；而舍尔纳会让它血流成河。"
 WORLD_REICH.305.t: "[Get_newspaper_header]舍尔纳元帅发动政变接管德国政府"
 WORLD_REICH.305.desc: "对于已故戈林元首的支持者来说，这是德国灾难性的一天——费迪南德·舍尔纳元帅全面接管了德国政权以及至关重要的战争机器。作为一个强硬的军国主义者和“总体战经济”的支持者，这位新任领袖预计将以更激进的方式延续戈林近期的军事扩张行动。在这位第三任元首眼中，战争状态正是德意志民族的至高形态，战争本身已非实现目的之手段，而成为终极目的。\n\n尽管戈林因其国防军入侵失利而政治生涯终结，舍尔纳却坚信在他的统治下德国绝不会重蹈覆辙。但国内外许多人都想知道：当德国再无国家可侵略时，又将何去何从？"
 WORLD_REICH.305.a: "全世界在恐惧中注视着……"
 goering_schorner.2.t: "一次，又一次"
 goering_schorner.2.desc: "如果说汉斯·斯派达尔一直在等待这一刻，那未免失之偏颇。预见这一刻？——确实。为此做好准备？——毫无疑问。但绝不是等待。“等待”暗示着他其实期盼着这一切，意味着德国社会的全面崩溃早就是他处心积虑的终极图谋。但他不是权力贩子，也不是叛徒——他只是一个知道该怎么做的人，而且提前做好了应急准备，以防万一。经过了这么长时间，他的远见终于得到了回报——以最糟糕的方式。\n\n这并不是他首次涉足政变——确切地说，是反政变。这位陆军元帅向来对希特勒及其政权心存芥蒂，那些近乎叛国的念头始终蛰伏在心底。腐败、愚蠢与赤裸裸的暴行令他如鲠在喉……但以胜利的名义，一切皆可宽宥。他只求将士的牺牲能真正铸就意义，为他魂牵梦萦的祖国开创更宏伟、更光明的未来。这便是他效忠希特勒的全部条件，亦是追随戈林时的唯一诉求。不管这个混蛋帝国元帅多么懦弱，只要他能拯救国家，斯派德尔就乐于扮演一个有改革意识但最终不关心政治的将军的角色。然而，这个胖子终究步了希特勒的后尘。结果，历史在重演，斯派达尔再度感到寰宇之重压于肩头。\n\n前两任元首重蹈覆辙如出一辙，这已是斯派达尔生平第三次下令部队进驻日耳曼尼亚清剿内敌。这完全是他过去经历的重复，唯一不同的是舍尔纳真的在局势逆转前击毙了目标。以一个已死之人的名义发动反政变——更何况这个死人还把帝国引向了覆灭——这般说辞显然难以说服同谋者们……所以，他换了种说法，将其描绘成强硬派与改革派之间的最终对决，是阻止“血腥费迪南德”以核爆终结一切的最后机会。归根结底，这不过是场赌运气的硬币游戏，但当太阳再次在德国升起时，胜负已然明朗。\n\n他不能否认，粉碎这场政变确实带来某种快意——签署逮捕令与处决书时，听闻舍尔纳败局已定饮弹自尽时。他也无法否认，自皇帝以来，德意志的舵柄首次握在了一位明主手中，此人既能拨乱反正，又能弥补前愆，确保祖国保持超级大国的地位。\n\n这并非说他全无顾虑。他是一名军人，不是政治家；他对经济、政策和外交一窍不通。可话说回来，那些懂行之人早已尸骨无存。斯派达尔倒要看看，国内还有谁配得上统治这颗星球上最强大的国家。当枪林弹雨停止，当德意志终于迎来治国而非救世之主时，实际上能继承元首大位的，唯剩一人而已。"
 goering_schorner.2.a: "讽刺的是，偏偏是这个从未觊觎权位的人。"
 goering_schorner.2.tt: "§B斯派达尔万岁？……§!"
 goering_schorner.4.t: "全速后退"
 goering_schorner.4.desc: "对鲁道夫来说，这是一个非常奇怪的早晨。整个驻军也是如此。\n\n一切始于拂晓响起的警报，他和战友们全副武装地站在阅兵场上。在他服役期间的第一次战斗警报，似乎也是他在这里的最后一次。\n\n指挥官紧张地宣读着柏林发来的最新命令，清了几下嗓子，最后宣布：\n\n“我们的元首赫尔曼戈林遇刺身亡。一群卖国贼企图窃取政权，为此，陆军总司令斯帕茨元帅已采取非常措施稳定局势，并在必要时期内代行国家元首职权。\n\n所有收到此命令的单位须立即携建制装备与经济物资开始撤离。\n\n完成时限：24小时。”\n\n空气中弥漫着混乱。燃烧的纸张从参谋部的窗口飘出，仓库物资正被搬上卡车。直升机群掠过天际。军官环视方阵，随机点名分配撤离任务。鲁道夫被指派把无线电台一路运到机场，这是一段7公里的路程，沿途地形并不理想。\n\n仿佛整个世界在那一刻都疯了一样，在他的身后和前面，都可以听到关于舍尔纳、斯派达尔和戈林本人的窃窃声，但他背负着沉重的负担，没有兴趣再听他的同伴讲述谁现在是柏林的主人。军令如山。\n\n宪兵军官在行军纵队间来回奔忙，试图整顿混乱的撤退。对空鸣枪声、喝骂声此起彼伏，在这群从头到脚挂满装备的士兵中全然徒劳。\n\n这绝非撤退。是永别式的溃逃——能带走的家当尽数带走。无法移动或运回国内的装备由操作组就地销毁，给养在路边堆成熊熊火堆，个别士兵却从烈焰中抢夺残存的口粮。\n\n当运输机舱门关闭，鲁道夫终于长舒一口气。这片异国的土地再次沦为弃土，在空军铁翼的阴影中渐行渐远。"
 goering_schorner.4.a: "尘归尘"
 GGR_speidel_we_are_leaving_tt: "我们将放弃所有新征服的土地。剩余的掠夺物资应该有助于稳定局势……"
 GGR_panic_evacuation: "紧急疏散"
 GGR_panic_evacuation_desc: "在德国陷入完全混乱之际，汉斯·斯派德尔决定从新征服的土地上撤回所有德国士兵和资产。\n\n这样一来，德国就不用再费心维系新的领土，还可以利用从这些土地掠夺来的资源勉强生存下去。"
