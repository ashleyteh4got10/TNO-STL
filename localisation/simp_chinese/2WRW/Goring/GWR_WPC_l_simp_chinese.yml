 GGR_operation_ikarus:0 "Unternehmen Ikarus"
 GGR_operation_hydra:0 "Fall Hydra"
 GGR_conquistador: "Unternehmen Konquistador"
 GGR_america_conquered_tooltip:0 "We have succeeded in the conquest of §Ythe United States of America§!\n"
 GGR_not_invaded_america_tooltip:0 "We have not yet started the invasion of §Ythe United States of America§!\n"
 GER_GOR_the_conquistadors_footsteps_tooltip:0 "§YWe have no surprise. The §RAmericans§! know we are coming.\nWe must move quickly.§!\n\n§BWe will recieve a penalty for this operation. But the more South American countries we conquer - the less penalty gets.§!"
 GER_GOR_operation_von_spee_tooltip:0 "§wAs part of our ongoing project to control the South American continent we will invade Argentina and turn it into a naval base against America and Japan.§!\n\n"
 GER_GOR_operation_maximillian_tooltip:0 "§wGerman blood will once again flow through the veins of the ruler of Mexico!§!"
 GER_GOR_secure_more_lebensraum_tooltip:0 "§wWe will unlock new decisions to take even more land for the German people in South Ameirca§!"
 GER_GOR_crush_central_america_tooltip:0 "§wWe shall rampage across the Central American penninsula in our dash to Mexico!§!"
 GER_GOR_the_second_battle_for_the_atlantic_tooltip:0 "§MThe §RAmerican§! cannot hope to match us at sea.§!"
 GER_GOR_prepare_for_jungle_warfare_tooltip:0 "§GSpecialized forces§! §Ywill be made available for the invasion.§!"
 GER_GOR_cut_off_their_reinforcements_tooltip:0 "§RTheir allies have all fallen, one by one.§!"
 GER_GOR_island_hopping_tooltip:0 "§MThis will strengthen our special forces.§!"
 GER_GOR_operation_hydra_tooltip:0 "§YWe must strike from every direction we can.§!\n§MThis will strengthen our special forces.§!"
 south_central_america_speedrunned_tooltip:0 "We have succeeded in the conquest of §YSouth and Central Americas and the Caribbeans§!\n"
 GER_GOR_fall_schwarz2:0 "Fall Schwarz"
 GER_GOR_fall_schwarz2_desc:0 "Across our many conquests for global domination, we have destroyed many errant subjects and traitorous former allies. This time is different however, for in this coming fight we shall be pitted against the result of the Reich's ultimate sin and failure. The black dogs of the SS believe themselves above us, they think they hold the secrets of the Aryan race to themselves and plot our destruction in the shadows of their little fiefdom. We will appease them no more, they must be crushed once and for all if the Reich is to know true peace and victory.\n\nFrom their earliest days in the Nazi party, Himmler and Göring were rivals. The Führer always knew that this scheming little snake was not one to be trusted, and his intuition is always correct. Then there was nothing he could do openly to fight back against the man whom Hitler held as close confidante but now? Now there is no Hitler to save the man of the black sun."
 GER_GOR_preparing_the_blow:0 "Preparing The Blow"
 GER_GOR_preparing_the_blow_desc:0 "While military might will of course be the cornerstone of the defeat of the traitor state, spymaster Gehlen makes a good point when he argues that Burgundy make require a more.. unique handling. Given its nature as an all knowing and completely secret police state with an intelligence capability amongst the world's best, it certainly could be worth it to attempt to break their greatest strength. Naturally this cannot be done with bullets or bombs; we must fight fire with fire. The Abwehr has begun mobilizing for actions on an unprecedented scale in the Reich's history to do their part against one of our greatest threats."
 GER_GOR_deploy_the_abwehr:0 "Deploy The Abwehr"
 GER_GOR_deploy_the_abwehr_desc:0 "Burgundy is considered an impenetrable fortress state in no small part due to the frightening prowess of their agents, many of whom were trained by one of the Reich's top wartime operatives, Otto Skorzeny. We won't be able to do real damage until we've put a dent into the army of spies that will be waiting for us in Nord-Paris. Gehlen has assembled his best men to undergo these high-risk high-reward missions that will, with any luck, put us one step closer to endsieg against these black dogs."
 GER_GOR_match_their_spies:0 "Match Their Spies"
 GER_GOR_match_their_spies_desc:0 "As this so-called \"Silent War\" begins to take shape between us and our foes in the SS we should consider how we can more tactically deploy our agents in the field. Losing too many will mean an effective concession to Burgundy and a loss in this game of chess but it would also allow us to cool tensions somewhat and regroup. On the other hand we can begin to deploy more agents but this may end up doing little more than causing more of an unwanted commotion that will cause the Burgundians to catch on to our plans. Either way, Gehlen will honor the wishes of the Führer."
 GER_GOR_blow_for_blow:0 "Blow For Blow"
 GER_GOR_blow_for_blow_desc:0 "We have begun to place our operatives in key positions to begin killing off Burgundy's spies one by one. Such operations will no doubt be quite dangerous as these spies are well trained and always on their guard but all we need is one moment where they relax, and a second where they stop their panoptic watch. In that moment, we will strike without hesitation, because the longer we wait the greater the chance of our discovery and termination. We are on the cusp of breaking the near mythic information supremacy of Burgundy. Now is the time to press home on all fronts!"
 GER_GOR_strange_bedfellows:0 "Strange Bedfellows"
 GER_GOR_strange_bedfellows_desc:0 "Dire times, they say, can make strange bedfellows of us all, and further, the enemy of my enemy is my friend. We have played our own substantial part in destroying the vestiges of resistance within France when we held total control of the region but now that we face the only foe to deal more damage to their freedom then we have, perhaps they would be willing to overlook our past actions in favor of a temporary alliance? It would be one of the strangest occurrences in a century full of them but such is our circumstances that it is at least worth looking into. We cannot guarantee success but still, just to be safe, we will have Gehlen assess the state of the resistance movements within the Ordensstaat."
 GER_GOR_meetings_in_the_night:0 "Meetings In The Night"
 GER_GOR_meetings_in_the_night_desc:0 "Following the assessments we have had carried on the state of the French and Belgian resistances, Führer Göring has given Herr Gehlen permission to conduct reach-out missions to known resistance contacts that have survived until now. We understand that these groups have likely been whittled down by years of persecution and lack of morale, but it could also be true that the Burgundians have driven an increased amount of French and Belgian men and women to fight for their survival underground.\n\nOn another note, Herr Gehlen has also put forward the prospect of entering into communication with members of the foreign SS-Divisions that make up the core of Burgundy's forces. At the same time, he has cautioned that this presents significant danger and that exposing ourselves this early on could disrupt our entire campaign before it even begins. Needless to say, the Führer will be carefully considering all options."
 GER_GOR_prepare_for_sabotage:0 "Prepare For Sabotage"
 GER_GOR_prepare_for_sabotage_desc:0 "Making new friends is all well and good but it will only get us so far. Battles and wars are not won with promises and meeting but with destruction and sabotage of the enemy. While some field agents are running around Paris looking for Pierre the freedom fighter, others will be heading to more \"solid\" targets. Railroad junctions, air-control towers, supply depots, even barracks will be targeted for covert destruction. Oh to be a fly on the wall when Himmler, that obsessively intricate freak, discovers all his plans have gone awry as his entire country explodes around him. The Führer would dearly love to see such a sight in person at least once. Perhaps once Himmler lies ready for execution Göring will be able to have his fun."
 GER_GOR_map_out_the_silos:0 "Map Out The Silos"
 GER_GOR_map_out_the_silos_desc:0 "Currently, the greatest obstacle to detecting and intercepting, nevermind countering, any of Burgundy's nukes is the fact that we simply do not know where any of them are. That will need to be rectified and quickly at that, or we could wind up all engulfed in nuclear hellfire when Remer gives the order to march in guns blazing. The Ordensstaat has used its hidden nukes as a deterring trump card for years now, and we need to deprive them of this asset before we head to war. The Luftwaffe has made several of its most high tech spy planes available for the task of finding and mapping out where these missile silos have been stationed. Once we know where they are, we can tell our bombers where to target and program our defenses to intercept them in the regrettable event of nuclear launch."
 GER_GOR_learn_their_secrets:0 "Learn Their Secrets"
 GER_GOR_learn_their_secrets_desc:0 "So far, our operatives have been forced to warily skirt around any signs of Burgundian operations, lest they be detected and killed - or worse. However, if we were able to acquire Burgundian code books and crack them - then we would be able to see all of their moves ahead of time and could then plan more efficiently around them to the point where we would hardly have to worry about detection. Needless to say securing Burgundian codebooks is no easy task, and should we be discovered, the consequences could be severe indeed. Gehlen will of course defer to Führer Göring on the matter, but he seems to believe the valuable insight we stand to gain may be worth the tremendous risk."
 GER_GOR_blind_their_eyes:0 "Blind Their Eyes"
 GER_GOR_blind_their_eyes_desc:0 "As the date for open combat operations against Burgundy draws ever closer, Gehlen has drawn up proposals to hit Burgundy's intelligence gathering stations that will be able to warn them of troop deployments and build ups ahead of the invasion. Crippling their ability to watch our movements will go a long way in giving us the initial and decisive edge in the fast approaching battle. This is not an easy mission, although the same could be said for all field operations in that damned nation, but hopefully it will be the last before we can dispense with the shadow plots and do what we do best: destroy our enemies. To the agents about to embark upon this most critical of missions, the Führer only has this to say:\n\n\"Sieg Heil!\""
 GER_GOR_information_overload:0 "Information Overload"
 GER_GOR_information_overload_desc:0 "In the world of air combat, a topic on which the Führer has kept himself remarkably well informed upon even as most other interests slip away, there is the concept of chaff. Chaff is a type of diversionary tactic where in a cloud of material is released to confuse RADAR and other detection systems to overload them with false positives. In the Führer's opinion, the method Spymaster Gehlen has proposed to overwork the Ordensstaat's intelligence services seems quite similar to this modern tool of the skies. By keeping their agents too busy through fake operations and the like, our real endeavors will no doubt see far greater success in the field."
 GER_GOR_absolute_nuclear_coverage:0 "Absolute Nuclear Coverage"
 GER_GOR_absolute_nuclear_coverage_desc:0 "As the first nation with nuclear power we have come up against in our conquests, we must be prepared to face some uncomfortable realities. Nuclear launches may be unavoidable, and we may not be able to intercept all targets sent our way. Does that mean we are to simply give up and let the traitors breath easy however? Of course not. Even if a few nukes make it past our guard we can still carry on, and we must make sure that the Burgundians understand that if they hit us with one nuke, we will hit them with five to match. The Führer has ordered an emergency massive silo build up along the border that will allow us, should it come to it, to cover every inch of Burgundy in nuclear radiation within an hour. They believe they alone hold the power of the atom as their trump card? They have been gravely mistaken."
 GER_GOR_it_is_their_turn_to_fear_the_dark:0 "It Is Their Turn To Fear The Dark"
 GER_GOR_it_is_their_turn_to_fear_the_dark_desc:0 "It is finished, the \"Silent War\" our great struggle of spies and webs of woven plots has come to an end. It was as hard fought a war as any conquest we have undertaken to date, and the true battle against Burgundy has not even arrived. We suffered casualties yes, and faced setbacks against their juggernaut of an intelligence state, but we pressed ever onward with the conviction of true National Socialism and with the Aryan blood pumping through our veins. The Burgundians know now that we can, if not destroy them on an informational plane, at least stand as a worthy foe. Hopefully the intelligence we have so painstakingly gathered will serve us well in the coming weeks of war."
 GER_GOR_a_swfit_end_to_the_madness:0 "A Swift End To The Madness"
 GER_GOR_a_swfit_end_to_the_madness_desc:0 "Given Burgundy's nuclear capability that we are, admittedly, largely in the dark about, the High Command is in universal agreement that a quick, decisive blow must be conducted to knock out the Ordensstaat before it has the chance to use its nuclear capabilities. We will be focusing on preparing multiple avenues of attack that will hopefully catch the SS off guard and overwhelmed regardless of their preparation. Our various neighboring Militärverwaltungs will have major parts to play to be used as launching grounds and multiple lines of advance. By the time Herr Himmler even knows what's going on, we will be in Nord-Paris!"
 GER_GOR_ready_the_heer:0 "Ready The Heer"
 GER_GOR_ready_the_heer_desc:0 "Two decades ago, our armies marched and drove across Eurasia, conquering all in their path. It was a feat of arms unparalleled in history, and some said it could never be matched again. Well, we have proven the ones who said that wrong, haven't we?\n\nIn only a few short years we have matched and then exceeded the success of our first conquest, bringing all but the three greatest powers and their spheres under our control. Our men are grizzled veterans of dozens of campaigns now, and could give Caesar's legions a run for their money.\n\nIn preparation for Fall Schwarz, Führer Göring has written to Feldmarschall Schörner asking for a comprehensive analysis of the Heer. It will no doubt show the peerless heights to which they have risen."
 GER_GOR_ready_the_kriegsmarine:0 "Ready The Kriegsmarine"
 GER_GOR_ready_the_kriegsmarine_desc:0 "It is hard to imagine now, but it was only a few decades ago when our navy was considered second-rate at best and a joke at worst. We lost multiple ships in the invasion of Norway alone and we even lost our advanced battleship Bismarck to the American dogs. Things have changed greatly since those days however and while the Kriegsmarine may not have been a top priority of the Reich, our fleet has served us admirably these past years in our conquests of the British Isles, of Scandinavia, of Italy, Iberia, and Turkey. Yes, our sailors have likely gained more combat experience in the past five years than in the entire history of the Kriegsmarine. A report on the status of the fleet is being finalized even now and will be on the Führer's desk for review within days."
 GER_GOR_ready_the_luftwaffe:0 "Ready The Luftwaffe"
 GER_GOR_ready_the_luftwaffe_desc:0 "Ah the Luftwaffe, the apple of Hermann Göring's eye. The numbers of those who can personally attest to the fact have begun to dwindle in recent years but all schoolchildren in the Reich are taught that Führer Göring was once a top fighter ace in the First World War. While he has not taken to the sky prepared for a scrap in quite some time, the former ace and head of the air fleet that lead the Reich to victory in the skies will always treasure the men who slip the moorings of gravity and fly like mythical dragons, breathing fire and death to the enemies of the Vaterland. Göring eagerly awaits a sit-rep on the Luftwaffe's battle readiness."
 GER_GOR_an_iron_curtain:0 "An Iron Curtain"
 GER_GOR_an_iron_curtain_desc:0 "Our large border with the Ordensstaat works as an advantage to us, allowing us to strike from multiple positions at once and overwhelm their crack troops with our superior numbers. However, this fact also works against us in one way; should the Burgundians choose to preemptively attack us before we are fully prepared, our lines could be broken.\n\nTo remedy this, Führer Göring has demanded the Reich's engineers to submit plans for possible defensive lines to prevent this possibility. We could fortify the entire snaking border across our core territory and that of our Militärverwaltungs but the cost of the project will increase in proportion to the coverage. Still, in the long run we will be able to plunder the entire world and what will a few million Marks matter then?"
 GER_GOR_ready_the_people:0 "Ready The People"
 GER_GOR_ready_the_people_desc:0 "With the continuous state of war over the past several years, there are some within the Führer's circle who fear that the German people may be growing exhausted of the constant war, the possibility of never seeing their sons, fathers, and husband, the possibility that they may be bombed or even attacked by nuclear weapons should the Reich run into something with as big a bite as they have. The Führer, and more importantly Feldmarschall Schörner and General Remer will have none of this however, and a new propaganda campaign meant to ready the Volk for war against the SS traitors has been established. They will learn just what the madman Himmler would do to them should he be allowed to succeed or even survive. They must be reminded that this is no longer the Heinrich Himmler of Hitler's heyday who stood beside the Führer, but a snake in the grass who was always waiting for the death of his supposed \"friend\" to make his moves."
 GER_GOR_we_fight_devils:0 "We Fight Devils..."
 GER_GOR_we_fight_devils_desc:0 " The men of the SS, now Himmler's personal army, are no mere normal soldiers. They are, in truth, not even the zealous enforcers of National Socialism we once knew them as. No, they have become a legion of demons, men willing to commit acts so despicable that defy the bounds of any, even normal wartime, morality. They will give us no quarter, and we must be prepared to respond in kind. They are far too gone by this point, there is no point in attempting to save this diseased wreck of an organization. They have decided that they would follow their Lucifer out of Heaven and down to Hell. They do not see us as true Germans, their madness has utterly corrupted them. Well, if our men are called on to fight the Devil's own soldiers, they will do so as quickly as they would any other foe. Bekämpfen!"
 GER_GOR_and_we_follow_the_fuhrer:0 "...And We Follow The Führer"
 GER_GOR_and_we_follow_the_fuhrer_desc:0 "In all of the many conquests Führer Göring has led us in since his ascension, he has never led us into failure. He was always a devoted servant of the Reich, and now he serves the people through his unmatched leadership. The soldiers all trust him with their lives, the nation with its victory.\n\nIn a recent parade through Germania, the Führer led the procession of some six thousand soldiers, resplendent in his full military attire, displaying dozens of medals and honors that he has earned through devotion to the Reich. At the end of the ceremonial march, the Führer stood in full view of the assembled soldiers and was hailed with the thunderous adulation that only soldiers can give.\n\n\"Sieg Heil! Sieg Heil! Heil Göring! Heil der Führer!\""
 GER_GOR_into_hell_itself:0 "Into Hell Itself"
 GER_GOR_into_hell_itself_desc:0 "What we will be marching into is no ordinary nation, filled with enemies sure, but people, shops, all the things that make a nation. What we are about to enter into can only be matched in its monstrosity by the Christain depiction of Hell. It is a place of pain and eternal torment, where the damned wish for death but always find it just out of reach until their SS masters find their usefulness is at an end or they expire from the stress. Even the most hardened of men still has a conscience that can keep him awake in the dead of night, but these SS dogs have abandoned even that much of their humanity and do not deserve the titles \"Aryan\", \"German\" or even \"human\". They are the detritus of this world, and shall be treated accordingly."
 GER_GOR_rally_the_rks:0 "Rally The MWs"
 GER_GOR_rally_the_rks_desc:0 "When we go into battle against the \"Black State\" of Burgundy, we will not be doing so alone. We will have the assistance of our many Militärverwaltungs to supplement our forces and to draw the SS' attention away from our main advances. Of course, this burden will mostly fall to those MWs that border Burgundy. This would include Militärverwaltung Großbritannien, Militärverwaltung Frankreich, and our Italian puppet. Each will be able to fulfill specific tasks that should help streamline our invasion. The Führer will be sending communiques to the Generals who have been placed in charge of these regimes soon."
 GER_GOR_alert_the_isr:0 "Alert ISR"
 GER_GOR_alert_the_isr_desc:0 "Our puppet in Italy has much of the old Italian Empire's military still intact, if a bit battered by our invasion. They border the Burgundians via the Alps, and for any other military we would hesitate to even attempt such an assault. The Italians however, more so than any other European nation, has experience in mountainous warfare dating back to their unification. Italy is our willing puppet, and we have no doubt it will jump at the chance to please us."
 GER_GOR_mountaineers_in_the_alps:0 "Mountaineers In The Alps"
 GER_GOR_mountaineers_in_the_alps_desc:0 "The last place the Burgundians would expect us to come through would be the Alps. Throughout history the crossing of mountains in warfare has been considered to carry far more risk than reward. While this is a fair statement, it neglects to account for the determination of the German spirit. It would shame all of Germany to be forced to say it could not complete a task that a general of a far lesser race was able to accomplish centuries ago.\n\nThe Gebrigsjaeger and Alpini divisions stand ready and quite frankly, eager, to attempt this colossal challenge. Entire divisions will be passing through and over multiple mountains on a timetable of only a few days. No simple thing, but if it can be done, we shall do it. Sieg Heil!"
 GER_GOR_alert_rk_britannien:0 "Alert MW Großbritannien"
 GER_GOR_alert_rk_britannien_desc:0 "Militärverwaltung Großbritannien, a sight of two triumphs and an incredibly important strategic location for our operations going forward. While most of the generals recognize it as an important staging ground for our eventual invasion of North America, some have astutely pointed out that we could also make it useful for our assault on the Ordensstaat. Indeed, the short crossing across the channel means we could quickly have marines on the beaches of Normandy and Calais and swarming down into the capital region while Burgundy's forces are concentrated on the land borders. Göring will have a word with London about preparing adequate transports for such an operation."
 GER_GOR_alert_rk_okzitanien:0 "Alert MW Frankreich"
 GER_GOR_alert_rk_okzitanien_desc:0 "Militärverwaltung Frankreich is one of our newer administrations, and we should therefore take the effort to stabilize them before dragging them into this next battle. General Guderian is well aware of our plans and has been tasked with efficiently balancing his regime's internal security needs with supplying our invasion force his fair share. With such a significant land border with Burgundy, we cannot be certain that the SS will not attempt to counter-attack and given the fragile nature of such a young government, such an even could prove disastrous.Forces drawn from the \"rear echelons\" of our army stationed in the more distant Reichskommissars will take their positions along the Frankreich-Burgundian border as well. We wish to leave as little to chance as possible, our invasion must be all but assured when we take the leap."
 GER_GOR_infantry_in_auvergne:0 "Infantry In Auvergne"
 GER_GOR_infantry_in_auvergne_desc:0 "While we will commit the mechanized and armored divisions of our army in the north of Burgundy to quickly race for Nord-Paris, we will also be deploying our slower but more numerous infantry divisions in the south. The plan is for this tidal wave of land troops to sweep away any Burgundian resistance like a broom sweeping up dust, pushing the momentum so that any SS forces that survive our spear in the north will be swallowed by this devastating tide. This force will naturally be slower than its counterpart, but it hardly needs any extra equipment when the terrain will be incredibly easy to navigate in the center of the French lands. France has seen the devastation that massed infantry and artillery could cause decades ago, and we aim to replicate that feat against these traitors."
 GER_GOR_marines_in_normandy:0 "Marines In Normandy"
 GER_GOR_marines_in_normandy_desc:0 "We have formulated an acceptable plan of amphibious attack that utilizes our bases in MW Britannien as launpads. On the orders of Generalfeldmarschall Schörner himself, a dedicated corps of soldiers with extra training in landing operations has been established and deployed to the Isles. This 'Seakorps' as it has been dubbed by the general staff would normally not be terribly effective given its relatively small size. However, this unit is not intended to carry out the war single-handedly.\n\nThe main mission that will be presented to these brave warriors is this: establish a foothold in the Normandy and Calais regions before advancing in two columns, one to secure the coastal ports and the other to advance inland. Eventually these columns will make contact with the rest of our forces, and we will have a massive pocket of the Burgundian forces ready to be liquidated."
 GER_GOR_ready_the_dutch_reichsgau:0 "Alert The Dutch Reichsgau"
 GER_GOR_ready_the_dutch_reichsgau_desc:0 "The integrated Reichsgau that were once under the administration of RK Niederlande and the Dutch nation before that will have to be quietly alerted to the coming invasion that they will soon be a key part of. For the plan to work, they will be responsible for helping to facilitate the transportation of thousands of men, tanks, and other vehicles. They must be prepared to receive the Heer as if it was a long expected guest. Roads must be repaired, civilians in border regions must be evacuated quietly, and supply depots must be established. We showed a great kindness to our Dutch kin by directly allowing them to enter into the Reich proper. It is time that they repay the favor."
 GER_GOR_panzers_in_calais:0 "Panzers In Calais"
 GER_GOR_panzers_in_calais_desc:0 "For a spear thrust to work, there must be a sufficiently deadly speartip. To follow the analogy, if our mechanized and armored forces will be the spear thrust of the upcoming Burgundy invasion, we will need to establish a vanguard force to strike quickly and decisively to open up a line of advance. After the normal bickering about who would have the honor of leading the charge against the traitorous state Generalfeldmarschal Schörner, likely tired of the arguments, proposed a solution that was agreeable to all. An ad hoc Kampfgruppe of corps size would be derived from the units of several other formations and would use its less formal structure to better make split-second decisions in the field. This proposal was generally well taken and Schörner drew up the orders for the creation of 'Korpsgruppe Kurtz' right then and there."
 GER_GOR_kick_down_the_door:0 "Kick Down The Door"
 GER_GOR_kick_down_the_door_desc:0 "The Ordensstaat may at first glance appear to be a formidable foe to defeat. Going by military power alone this thought may hold some wait, but it must always be remembered that defeating the enemy military is but one part of defeating a foe. The enemy nation itself must be destroyed before true victory can be achieved. So while we will absolutely have to do our damnedest against the SS legions, our generals predict that destroying Burgundy as a state will prove far easier. The madness that permeates its very soul makes it incredibly fragile to outside pressure, and it has only survived this long due to the fear of other nations. We need only to break down the door, and the whole rotten structure will come crashing down!"
 GER_GOR_just_like_old_times:0 "Just Like Old Times"
 GER_GOR_just_like_old_times_desc:0 "Ah 1940, those heady days when it felt as if Germany would be able to conquer the whole world in a matter of a few years! Of course, reality did not prove to be so kind as that, but it must be admitted by even the most fierce enemies of the Reich that Germany was, in this period, peerless in battle. That we should once again find ourselves fighting a fierce war of movement in France is enough to make any devoted Aryan of sufficient age nostalgic, and Führer Göring is no exception. The only difference is that this time around he is not Chief of the Luftwaffe but the Führer himself, and the enemy is not the French, but a slew of traitorous dogs.\n\nWell, what is there to be done by waiting? Sound the horn, we march to battle in France once more!"
 GER_GOR_flatten_ost_paris:0 "Flatten Nord-Paris!"
 GER_GOR_flatten_ost_paris_desc:0 "As a state, the Ordensstaat Burgund is incredibly hierarchical to the point where Himmler's existence is certainly the only thing keeping it together. We can exploit that and deliver one fell stroke to sever the head of this snake before this war becomes bogged down. We will launch a massive fleet of bombers on a scale not seen since the Blitz to totally and fully wipe the SS's lair from the map. With Himmler buried under the rubble the chain of command will disintegrate quickly and we can take the pieces at our leisure. This will also have the benefit of preventing a nuclear strike from occurring, as Himmler is likely the only figure in Burgundy with the authority to order the nukes fired."
 GER_GOR_cut_the_communication_lines:0 "Cut The Communication Lines"
 GER_GOR_cut_the_communication_lines_desc:0 "Burgundy is above all a pyramidal structure that would make even Hitler second-guess the amount of control superiors place on their subordinates. This is a strength when the leaders are competents but can easily become an Achilles heel if we disable their ability to communicate. If we do this, our advisors believe even the most basic of orders may go unissued in the absence of authority for fear of later punishment for failure to heed the last transmitted orders. The Ordensstaat's order is about to become a chaos that brings it tumbling down!"
 GER_GOR_an_answer_to_the_call:0 "An Answer To The Call?"
 GER_GOR_an_answer_to_the_call_desc:0 "We have crossed the Rubicon, and now there is no going back. Surely, those within the Ordensstaat can see that its time has come and will finally gather the courage to rise up against their mad leader. Belgian and Frenchman, Aryan and non-Aryan they will see that now, at long last, they can fight for their freedom and seize it. With any luck, this call will also entice defectors amongst the foreign SS Divisions like Charlemagne, who our spies tell us are often terrified of Himmler. Perhaps some of their generals will even cross over, grinding their war effort to a halt. The thought of Himmler vexed as everyone deserts him is enough to make the Führer laugh even during wartime. Hopefully such an image will not be confined to his mind for much longer."
 GER_GOR_mansteins_lessons:0 "Manstein's Lessons"
 GER_GOR_mansteins_lessons_desc:0 "An important lesson in life is to always choose the simplest approach out of any number of possible methods when going about something. Adhering to this principle, the Führer has ordered Remer to dig out the official campaign records of the 1940 Invasion of France and to distribute the core operational techniques to all field commanders immediately. It was in that campaign after when geniuses of the skill of Erich von Manstein and Heinz Guderian proved with amazing success the power of inter-branch coordination. Just as with our first go around, we shall have perfect cooperation between our land, air, and to a lesser extent naval branches so that Fall Schwarz is finished with a minimum of hassle."
 GER_GOR_around_their_defenses:0 "Around Their Defenses"
 GER_GOR_around_their_defenses_desc:0 "Our mobile units have been given specific and deliberate orders: do not, under any circumstances unless absolutely necessary, engage with Burgundian fortification and defenses. We simply don't have the time to waste throwing ourselves against impregnable positions while the cloud of nuclear death hangs high over our heads while we race for ultimate victory. Speed must be emphasized and promoted to the point that it is essentially more important than combat in the field. This is how we will destroy the Ordensstaat."
 GER_GOR_empty_the_rat_traps:0 "Empty The Rat Traps"
 GER_GOR_empty_the_rat_traps_desc:0 "The Burgundians think themselves safe in their many bunkers and forts, they believe that this grants them some kind of protection against the coming storm. They are sorely mistaken. Have they already forgotten the fate of the Maginot Line? All they have accomplished is to create a series of funneling points into which they will scurry in like the vermin they are; they will never be allowed to leave. Our divisions will simply maneuver around these positions and then once we have surrounded them, we shall enter into them one by one and clean the infestations."
 GER_GOR_the_black_sun_eclipsed:0 "The Black Sun Eclipsed"
 GER_GOR_the_black_sun_eclipsed_desc:0 "For twenty years, this day has been coming. Or perhaps it has been closer to fifty? The beginning of the feud hardly matters, what matters is this: after all this time, Hermann Göring has crushed the dreams of Heinrich Himmler once and for all. Never again will the Schwarze Sonne shine over Germany or anywhere else. Despite possessing nuclear weapons, such was the fury and speed of our invasion that Himmler never had a chance to deploy them. Let this be final proof that even the most intricate of plotted webs may be dashed by the thunderous beat of an eagle's wings."
 goering.schwarz.1.t:0 "Ein Schwarzer Tag"
 goering.schwarz.1.d:0 "The bunker was filled to the brim, the fans recirculating already stale air about the room. Despite the stuffy atmosphere the Führer's enthusiasm was infectious, and not a man could deny the buzz of anticipation. To his left sat Reinhard Gehlen, bizarrely still wearing mirrored sunglasses despite the fact they were a hundred feet underground. To his left was Ferdinand Schörner, surrounded by his coterie of sycophantic young officers with chests of shining medals.\n\nGöring's foot was tapping at the floor at a frenetic pace. Gehlen had instructed the Führer's staff to attempt to keep him under control, but it seemed they had been unable to keep him from maintaining a supply of amphetamines. He inwardly cursed, and hoped Schörner at least would be able to keep the military situation out of his twitching hands. Bloody Ferdinand was perhaps one of the only men capable of keeping the invasion falling to disaster.\n\nSchörner was doing his best to walk the Führer through the invasion plan, but Göring was more concerned with premature celebration than planning. \"I want Himmler alive, you know. I want to see the look on the bastard's face when he sees his domain in flames, before the bullet hits his skull.\"\n\nSchörner scowled. \"Of course, but first Fall Schwarz must be completed. If you draw your attention to sector six -\"\n\n\"You know, I haven't seen him since the West Russian War. I never liked him even before then, always knew he was scum. If only Hitler was here to see this. God, but it will be glorious.\" Gehlen did his best not to bury his head in his hands.\n\n\"Tell them to begin operations.\""
 goering.schwarz.1.a:0 "Thirty seconds to midnight."
 goering.schwarz.2.t:0 "Ready The Heer"
 goering.schwarz.2.d:0 "OFFICIAL EYES ONLY: TOP SECRET\n\nSTATUS OF THE HEER\n\nMy Führer,\n\nThe Heer is in the best shape its ever been; it is overall the best trained and most well motivated army by far in the world. Although a hardened and veteran force, our army is, to put it plainly, stretched thin; garrisons from the steppes to our Middle Eastern holdings have, for the most part, the bare minimum of men to occupy our lands. Our manpower reserves are beginning to run low; a war of attrition fought by our forces would at this point be incredibly costly, and likely not sustainable. Alternate means of raising up men should be considered if we are to continue to expand the Reich. Drawing natives from our Militärverwaltungs to throw into the worst battlefields, or garrisoning them in regions with heavy partisan activity would be prudent."
 goering.schwarz.2.a:0 "Our army is the best! But do we have enough men for future campaigns?"
 goering.schwarz.3.t:0 "Ready The Kriegsmarine"
 goering.schwarz.3.d:0 "OFFICIAL EYES ONLY: TOP SECRET\n\nSTATUS OF THE KRIEGSMARINE\n\nMy Führer,\n\nNaval rebuilding and retooling is continuing as planned. Progress is not spectacular, but our navy has more or less recovered from the many defections and losses of the Civil War. Although certainly formidable, and more than a match for any of our immediate neighbors, the American and Japanese navies could prove to be troublesome. Still, our submarine forces are not to be underestimated; we are more than capable of projecting power into the world's oceans from below. Our major bases at Kiel, Plymouth and Gibraltar continue to harbor, build, and train our naval forces.\nGrossadmiral Karl-Jesko von Puttkamer"
 goering.schwarz.3.a:0 "So, perhaps not the best, but formidable all the same."
 goering.schwarz.4.t:0 "Ready The Luftwaffe"
 goering.schwarz.4.d:0 "OFFICIAL EYES ONLY: TOP SECRET\n\nSTATUS OF THE LUFTWAFFE\n\nMy Führer,\n\nYou'll be pleased to learn that the Luftwaffe is in fantastic fighting form. Although there are minor local jet plane shortages across our holdings, all in all, we have one of, if not the largest air forces in the world. Our technology is top tier, which is reflected in the quality of our planes. Our ballistic missile stockpiles have also amassed nicely; we have over a thousand warheads currently pointed at the rogue SS state to our west. All in all, when concentrated, the Luftwaffe is second to none in the skies.\nYour faithful servant, Johannes Steinhoff, General der Fleiger"
 goering.schwarz.4.a:0 "Führer Göring will be pleased to hear that!"
 goering.schwarz.5.t:0 "Reconnaissance Over the Black State"
 goering.schwarz.5.d:0 "He shouldn't have been as terrified as he was. Matthias had flown so many sorties in spy planes and even more in combat missions during the first West Russian War. This was just another routine surveillance mission. He was so close to the German border as well. It wasn't supposed to be terrifying, but he couldn't shake the fear at being tasked with taking photos of Burgundy's nuclear silos. He dreaded hearing the \"locked-on\" sounds. He dreaded having to bail. Most of all, Matthias dreaded the inevitable endless interrogation should he ever get captured. Luckily, the images were finally coming in. He could see the Burgundian nuclear silos and there was far, far more than he expected. Surely it was a bluff. There was no conceivable way."
 goering.schwarz.5.a:0 "\"This is Matthias to Command. You have got to see this.\""
 goering.schwarz.6.t:0 "An Iron Curtain?"
 goering.schwarz.6.d:0 "Göring's eyes were rimmed with the dark lines of fatigue, sad and sunken. Körner's eyes surveyed the office within the Führerbunker where he had moved to following his internal announcement commencing \"War Plan C\". There was an empty wine bottle there at the side of the desk, a vintage old enough that Körner was shocked it wasn't in the cellars of Carinhall. That wasn't something you were supposed to just drink from for pity's sake. What was going on with the Führer? His old friend had gone clean years ago and yet, something had shaken that. Körner shuddered, afraid of what the answer was.\n\nBut back to the matter at hand. He had been called here to talk fortifications, and so on fortifications he would focus his thoughts. He quickly rescanned the proposal he had been brusquely handed as he had come in. That was quite a bit of resources the Führer wanted shifted, and in such a short amount of time.\n\nKörner looked his old comrade in the eyes, \"Hermann, what exactly are these for? I thought the plan was to push into Burgundy, no?\"\n\nGöring grimaced like a man in deep pain. For a moment he remained utterly silent and Körner felt the hair on the back of his neck stand on end. Then, with a furtive look around him as if to check to see if the two men were truly alone, the Führer bent in. His voice low and quiet, he began to speak, \"Remer has been heading up the invasion and you know he is even less interested in my commands than Schörner is. In fact he doesn't even seem interested in listening to the Field Marshall anymore either. Serves him right. But I can't guarantee what will happen when the fighting begins. These forts will be our insurance policy, our backup and our defense if the army completely falls apart. Do you understand now?\"\n\nKörner nodded soberly, \"I do, Hermann. That still leaves us with the question of where to establish this line?\""
 goering.schwarz.6.a:0 "Concentrate on the Siegfried line region only."
 goering.schwarz.6.b:0 "Extend the line all the way to the Atlantic coast!"
 goering.schwarz.6.c:0 "Expenses be damned, make it reach down to the Mittlemeer!"
 goering.schwarz.7.t:0 "ON THE STATE OF THE BURGUNDIAN RESISTANCE MOVEMENTS"
 goering.schwarz.7.d:0 "Records regarding possible dissident elements within the Burgundian Ordensstaat. Obviously the SS was never going to share their own weaknesses, given what they seem to have been planning for years now. The Ordensstaat is considered an impenetrable \"secret state\" for a reason, even at the height of our power we were never able to maintain the level of communications blackout that they have achieved. To me, this does not bode well for finding any active resistance cells. Of course, hard to find does not mean nonexistent, and the Abwehr will search every nook and cranny in order to further the goals of the Reich. We have two leads currently on French and Belgian contacts but we will need further time to verify their authenticity lest we fall into a Burgundian counterintelligence.\n\nAs for potential informants within the regime, we do at least know the names of some, but the list is from before the Bürgerkrieg and given the high rate of turnover amongst the Burgundian officials coupled with possible changes in willingness to cooperate, we cannot rely heavily on this information. We have agents in the field conducting check-ins on the names to confirm or not the status of these potential assets. As of this report, only - REDACTED - has been located and has been confirmed as deceased since 1965 during one of the apparently infamous purges carried out on Reichsführer-SS Himmler's direct orders. Our best guess is that - REDACTED - and - REDACTED - have also been terminated in the meanwhile but this cannot be confirmed at this moment.\n\nAs always my Führer, you will be updated when any new information has been discovered.\nGeneralmajor Reinhard Gehlen, Abwehr"
 goering.schwarz.7.a:0 "At least it's something..."
 goering.schwarz.8.t:0 "ON THE OPERATIONAL CAPABILITY OF THE BELGIAN PARTISAN MOVEMENT"
 goering.schwarz.8.d:0 "EXCERPTS REDACTED TO MAINTAIN AGENT ANONYMITY\nInformant count in former Belgium is estimated in the single digits due to near constant Burgundian purging process and difficulty in maintaining communications due to radio jamming and signal tracing putting remaining agents at great risk. Intelligence reports are therefore widely and irregularly distributed, and information may be at best outdated and at worst active disinformation. Report follows.\n\nInformants were alerted of the task of contacting the Belgian resistance by the usual means, a high-power narrow-band radio station broadcasting numeric code during scheduled hours. Confirmation of message reception is impossible due to aforementioned Burgundian radio jamming.\n\nContact was made by the means transmitted within the initial radio message, a Dutch fisherman by the name of -REDACTED- van -REDACTED-. Informant -REDACTED- successfully made contact with the fisherman with the collected findings of those of his network he knew yet lived, though his request for exfiltration was denied.\n\nAnalysis of the information concludes that there is no longer any Belgian Resistance worthy of the name. Burgundian purges successfully eliminated dissident movements from within the Waffen-SS several years ago, and since then has maintained an extensive suppression campaign. Leon Degrelle, formerly the most outspoken figure of Belgium nationalism, has been missing for years, presumed dead by both the Burgundian authorities and Belgian public. All evidence indicates that the Belgian resistance is dead and gone."
 goering.schwarz.8.a:0 "That rules out one option."
 goering.schwarz.9.t:0 "ON THE OPERATIONAL CAPABILITY OF THE FRENCH PARTISAN MOVEMENT"
 goering.schwarz.9.d:0 "EXCERPTS REDACTED TO MAINTAIN AGENT ANONYMITY\nInformant count in Burgundian-occupied France is estimated in the low double-digits due to near constant Burgundian purging process and difficulty in maintaining communications due to radio jamming and signal tracing putting remaining agents at great risk. Intelligence reports are therefore widely and irregularly distributed, and information may be at best outdated and at worst active disinformation. Informant count in the French State is significantly higher. Report follows.\n\nAgents in Burgundian-occupied France were alerted of the task of contacting the Belgian resistance by the usual means, a high-power narrow-band radio station broadcasting numeric code during scheduled hours. Confirmation of message reception is impossible due to aforementioned Burgundian radio jamming.\n\nContact was made via the usual means, a Breton smuggler who makes an unreasonable amount of money transporting arms \"misplaced\" by low level SS officers. Informant -REDACTED- successfully collated and delivered his comrades' reports, though allegedly had to be forced away with an oar when her request for extraction was denied.\n\nAttempts to contact the French Resistance were unsuccessful - while informants successfully reached a number of former members, any desire to resist had long since been removed from them, all desiring only to be left alone lest the SS learn of their meeting. Evidently Burgundy's method of terror is effective at removing the drive to fight from it's citizens - perhaps a subject to be studied.\n\nAttempt to contact the Resistance in the French State were more successful though equally unproductive - while many groups expressed the desire to destroy Burgundy, none could be persuaded to attempt to cross the border."
 goering.schwarz.9.a:0 "Another dead end."
 goering.schwarz.10.t:0 "ON ATTEMPTING TO CONTACT DISLOYAL BURGUNDIAN MILITARY ELEMENTS"
 goering.schwarz.10.d:0 "The number of informants within the upper ranks of the SS is estimated to be no more than five. Confirmation of this figure is impossible due to the constant scrutiny the inner SS are subject to, greater than that even of the \"civilian\" populace and lower SS ranks. Report follows.\n\nAttempt was made by -REDACTED- to strike up conversation with Obergruppenführer -REDACTED- during off hours, with the aid of a flask of smuggled brandy. Obergruppenführer -REDACTED- is known to have relatives and a former mistress in Germany, and was thought a possible ally. The attempt went well until -REDACTED- voiced his concern for his own family, at which point Obergruppenführer -REDACTED- immediately exited the conversation.\n\n-REDACTED- made his report that same night. Since no further communication has been received -REDACTED- has been presumed dead. SS internal security procedures have since increased dramatically, and other informants have also ceased contact, either laying low or already caught. Conclusion is that any further attempts to acquire disloyal SS officers would do more harm than good."
 goering.schwarz.10.a:0 "Is there anywhere Burgundy is weak?"
 goering.schwarz.11.t:0 "Every Part of Me Says Go Ahead"
 goering.schwarz.11.d:0 "Pieter stared in incredulity. \"They've turned around.\"\n\nFor the past six days he and Jonas had been stuck in this stinking, muddy hole. The only new entrant had been a grenade, frantically hurled back by his comrade in the eleventh hour. The noise had been unrelenting, and they had long since run out of ammunition with which to return fire. The previous minute they had been confused - the absence of noise seemed deafening. Pieter had been so desperate that he volunteered to peek out, resigned to his fate.\n\nThe Burgundian troops that had seemed so menacing, with their unrelenting firing and constant artillery cover, were moving backwards. While the distant boom of heavy guns was still there, the constant typewriter-drill sound of small arms had disappeared. All that remained was a blackened no-mans land of mud and scorched earth.\n\nBehind the lines the reports were confirmed, and a sigh of relief was breathed throughout Germany. This defeat was the crack in the armour they needed - proof that Burgundy wasn't the indestructible monolith they had feared. And on the front line the troops moved back, relieved they would live another day."
 goering.schwarz.11.a:0 "Looks like Himmler's dogs aren't so tough after all."
 goering.schwarz.12.t:0 "Feels Like We Only Go Backwards"
 goering.schwarz.12.d:0 "For the past six days he and Jonas had been stuck in this stinking, muddy hole. The only new entrant had been a grenade, frantically hurled back by his comrade in the eleventh hour. The noise had been unrelenting, and they had long since run out of ammunition with which to return fire. The previous minute they had been confused - the absence of noise seemed deafening. Pieter had been so desperate that he volunteered to peek out, resigned to his fate.\n\nThe German guns had fallen silent, and the haze that covered the blackened no-mans land of mud and scorched earth cleared. Pieter's view was unobstructed, revealing the spots of pitch black that spotted the muddy brown. The Burgundians were advancing.\n\n\"Jonas, we've got to run.\" Jonas stared up at him in terror, but Pieter grabbed him under the shoulder and hauled him up. The blessed silence was broken once more with the sound of gunfire.\n\nBehind the lines the reports were confirmed - while Burgundian troops maintained the border, the Reich's forces had been defeated, pushed back into flight. This was a dreaded defeat - another check mark on Himmler's apparently unblemished record."
 goering.schwarz.12.a:0 "Germany shrinks back in fear."
 goering.schwarz.13.t:0 "If It Bleeds We Can Kill It"
 goering.schwarz.13.d:0 "Gruppenführer Wagner strode through the corridors of the bunker, for once relieved. With their recent victory against the forces of the Reich, he had good news to deliver. Good news was hard to come by these days - events seemed to be progressing at such a rate that the only response was to shout at failure. Victory was always good however - no matter how much they vaunted their training and discipline, nothing was certain until it was tested in battle.\n\nHe reached the door and straightened his collar. He mentally rehearsed his message for a final time. Himmler was not a man you wanted to stutter in front of. He knocked, then opened the door.\n\n\"Reichsführer Himmler, I bring good news.\"\""
 goering.schwarz.13.a:0 "Today I will live."
 goering.schwarz.14.t:0 "Blood From A Stone"
 goering.schwarz.14.d:0 "Gruppenführer Wagner strode through the corridors of the bunker, resisting the urge to slump his shoulders. Somehow, they had failed against the forces of the Reich, those degenerate dogs that they claimed superiority over. Bad news was all too common these day, and to deliver more was dangerous. For all their vaunted discipline and training, for all their pure Aryan bloodlines, they had fallen at the most important hurdle, that of battle.\n\nHe reached the door and straightened his collar - if he was delivering bad news he would at least not look like bad news. He mentally rehearsed his message for a final time. Himmler was not a man you wanted to stutter in front of. He knocked, then opened the door.\n\n\"Reichsführer Himmler, I bring news."
 goering.schwarz.14.a:0 "Today is uncertain."
 goering.schwarz.15.t:0 "Should You Choose To Accept It"
 goering.schwarz.15.d:0 "Gehlen sat at his desk observing the map of Burgundy. It was the best one they had, and it was three years out of date. Any number of these settlements could now be military encampments, or research facilities, or just gone. He had promised the Führer results though, and he would get results.\n\nEven now, his agents were attempting to infiltrate Burgundy from all angles. Divers disembarking from submarines, parachutists performing HALO jumps, mountaineers attempting the perilous climb down the alps in secrecy. He estimated at least two thirds of them would be dead by tomorrow.\n\nLeadership is about knowing how to make the correct sacrifices though. He would sacrifice a thousand lives for a chance of bringing down Burgundy, for every one spared brought a piece of information that might save countless lives. The Abwehr would crack this country, even if he had to pile up corpses to climb over the border fence himself."
 goering.schwarz.15.a:0 "Send in the next wave."
 goering.schwarz.17.t:0 "Into The Belly Of The Beast"
 goering.schwarz.17.d:0 "Directive no. 1418\nGeneralmajor Reinhard Gehlen,\n\nPursuant to Führer Directive 237 (see attached document) the Abwher will begin conducting Covert Operations against the so-called \"Foreign SS Divisions\" of the former Ordensstaat Burgund. Target groups include SS-Divisions Charlemagne, Walloon, and Langemarck (see attached Appendix A). These missions are to be conducted in service to Fall Schwarz currently underway and are meant to sow division in the ranks of anticipated enemy combatants once combat operations begin. Propaganda is to be seeded amongst the rank-and-file of these units to drop their operational capabilities below efficient levels. This directive is eyes-only classified to be distributed to operational chiefs, disclosure of these operations is punishable by death in accordance with Führer Directive 238 (see attached, \"On Infractions Of Secrecy Regarding Fall Schwarz Covert Operations)."
 goering.schwarz.17.a:0 "Commence Operations."
 goering.schwarz.18.t:0 "Dissolved In The Stomach's Acids"
 goering.schwarz.18.d:0 "To: Führer Hermann Göring\nGeneralmajor Reinhard Gehlen,\n\nI regret to inform the Führer that recent operations to cause dissent and confusion within the ranks of the foreign SS-Divisions within the Ordensstaat Burgund were forced to be called off this morning. After two unsuccessful infiltration attempts resulting in no detection and extraction a third attempt was made that was detected and subsequently emergency aborted. The SD did not capture the deployed agent, one Hauptmann Freidrich Strum, who committed in an undisclosed area of the Ardennes Forest to avoid capture and interrogation. I understand this is regrettable, and will strive to ensure that such a failure does not occur in the future.\nHeil Göring."
 goering.schwarz.18.a:0 "Damn it Gehlen, can you bring me some good news?"
 goering.schwarz.19.t:0 "Out By The Skin Of Their Teeth"
 goering.schwarz.19.d:0 "To: Führer Hermann Göring\nGeneralmajor Reinhard Gehlen,\n\nI am pleased to inform the Führer that recent operations to cause dissent and confusion within the ranks of the foreign SS-Divisions within the Ordensstaat Burgund were successfully carried out this morning. After two unsuccessful infiltration attempts resulting in no detection and extraction a third attempt was made that was able to avoid detection while infiltrating local SS barracks. The deployed agent, one Hauptmann Freidrich Strum, estimated that several hundred soldiers will likely be exposed to our propaganda. This operation was carried out with the utmost skill and professionalism and does credit to the Abwehr.\nHeil Göring."
 goering.schwarz.19.a:0 "Finally, some good news!"
 goering.schwarz.20.t:0 "A Modest Proposal"
 goering.schwarz.20.d:0 "The Abwehr's next planned targets are key infrastructural targets scattered throughout Burgundy. Important rail junctions and stations, strategically bridges, vulnerable electrical lines, and more are going to be sabotaged. Although all low level targets, in the grand scheme of things, enough damage could really hurt the Burgundian war machine. Most of these targets will be hopefully lightly guarded, which should translate to an overall success, with a lot of skill and a bit of luck."
 goering.schwarz.20.a:0 "Lets see how this goes..."
 goering.schwarz.21.t:0 "A Modest Failure"
 goering.schwarz.21.d:0 "Our sabotage attempts to disrupt the Burgundian backlines has failed admissaly. We have lost contact with nearly all of our agents, and the precious few that managed to sneak their way back to friendly lines tell a harrowing tale.\n\nEven scattered powerlines had eyes on them, let alone rail junctions and bridges! For the few agents that managed to make it to their targets, they had no opportunity to commit any actual sabotage. The rest were captured en-route, which may explain the heightened security.\n\nOur agents' morale has taken a serious hit. If our men can't even infiltrate and sabotage low priority targets, how can we hope to do anything more ambitious in Burgundy's backyard?"
 goering.schwarz.21.a:0 "A serious critical mission failure."
 goering.schwarz.22.t:0 "A Modest Success"
 goering.schwarz.22.d:0 "Our men faced a monumental series of challenges to just make it into Burgundy's borders, let alone sabotaging dozens of targets. Yet our men rose to the task; our agents have performed nearly flawlessly!\n\nNearly all of our targets have been successfully sabotaged, and our agents have made it back to our safehouses successfully!"
 goering.schwarz.22.a:0 "All according to plan!"
 goering.schwarz.23.t:0 "To The Next Targets"
 goering.schwarz.23.d:0 "With the stunning success of our first wave of sabotage, our Abwehr agents feel confident enough to proceed with the next series of objectives.\n\nOur next series of objectives will be more difficult to infiltrate and sabotage, but also much more vital to Burgundy's war effort.\n\nIn particular, we will now be targeting communications arrays and unsecured supply depots. The stakes are certainly higher, but our agents feel confident that they can get the job done."
 goering.schwarz.23.a:0 "It's time to prepare. "
 goering.schwarz.24.t:0 "Foiled"
 goering.schwarz.24.d:0 "The SS were ready for our men; our sabotage efforts were foiled before they ever even began.\n\nSomehow, something tipped the fanatics off. Maybe it was sloppy communications, perhaps the garrisons were more on guard with the previous sabotage attempts; whatever the reason, most of our men are either dead or captured. Our safehouses were then quickly located and destroyed. Very few of our agents made it out of the country alive, and those that did are not exactly rushing to be deployed there again. That isn't accounting for the fact that Himmler's fanatics are likely tightening their security as we speak. To make matters worse, the Burgundians surely know that it was us who carried out the attempt; tensions are doubtlessly going to rise."
 goering.schwarz.24.a:0 "A disappointing failure."
 goering.schwarz.25.t:0 "A Surprise, But A Welcome One"
 goering.schwarz.25.d:0 "Once again, our men on the ground have exceeded our expectations!\n\nThe second wave of sabotage has been carried out without a hitch. All of our agents carried out their orders to the letter, and everyone made it back to their safehouses in good order.\n\nThese attacks are starting to have an effect on Burgundy; their military infrastructure is starting to take some serious damage."
 goering.schwarz.25.a:0 "Excellent work!"
 goering.schwarz.26.t:0 "To Go Even Further Beyond"
 goering.schwarz.26.d:0 "With two successful operations under their belts, the Abwehr in Burgundy is starting to feel more confident and ambitious. Our men are relaying this message; they're ready to kick things up a notch.\n\nTheir next proposed targets are critical facilities and structures that are vital to the day to day functions of Burgundy. The Abwehr is drafting up plans to sabotage army barracks, slave camps, some of the more important factories, and even SS officer quarters! Their planning may look like it borders on recklessness, but if successful, this would be a wave of sabotage that would be guaranteed to cripple the Burgundian war effort."
 goering.schwarz.26.a:0 "With great risk comes great rewards."
 goering.schwarz.27.t:0 "Tumbling Down"
 goering.schwarz.27.d:0 "The Abwehr was too ambitious, too reckless. Their schemes were just too grand; their plan to sabotage Burgundy's military infrastructure has failed miserably.\n\nAfter the last wave of destruction we wrought in the SS hellscape, it seems that their garrisons have increased their security significantly. All it took for the plan to fall apart was one agent getting caught trying to infiltrate a camp disguised as a slave. What gave him away? He looked 'too healthy.' The agent gave up his fellows after hours of brutal torture; the vast majority of his comrads were likewise captured or killed, with very few of their objects being successfully damaged.\n\nThis failure has not only cost us lives, but also given away our intentions. Himmler now knows that it was the Reich who has been meddling in his petty kingdom, and he will likely act accordingly. Tensions between us have risen to unforeseen levels as a result."
 goering.schwarz.27.a:0 "A disastrous failure!"
 goering.schwarz.28.t:0 "Even We Are Surprised"
 goering.schwarz.28.d:0 "Incredible is the only word that really fits the Abwehr's performance these last few days. Although the SS have significantly increased their security throughout the entirety of Burgundy, they managed to not only infiltrate all of their sectors as planned, but successfully carried out their sabotage tasks as well, with very few expectations.\n\nOur casutilites were zero, and their work has thrown Burgundy into a bit of chaos. Himmler has to know that some major power is responsible, but our involvement in sowing disarray is still unknown.\n\nThe Burgadian military is crippled after this latest wave of attacks. Many of their officers have been taken out of commission, their major factories are more or less shut down, and we have sown enough dissent in the slave camps to at least slow down their output significantly. Our men have certainly gone above and beyond the call of duty!"
 goering.schwarz.28.a:0 "A stunning success!"
 goering.schwarz.29.t:0 "Cracking The Enigma"
 goering.schwarz.29.d:0 "With the Burgundian administration in chaos, the Abwehr decided that now is the time to crack the secret codes the SS use for all vital communications.\n\nNormally, we would outright shoot down this kind of plan; it's not just reckless, it borders on madness. However, the Abwehr is confident that they can get the job done; with the SS in chaos at home, they argue that there is no better time than now than to launch an undercover operation to steal codebooks.\n\nThey may very well be right; there may not be another window of opportunity like this. Still, is it worth the risks?"
 goering.schwarz.29.a:0 "If they think they can do it, then we must have faith in our men."
 goering.schwarz.30.t:0 "The Code Crack has Failed"
 goering.schwarz.30.d:0 "All seemed to be going as planned; our Abwehr agents infiltrated one of the SS's command posts in Paris. As planned, our men walked right through the security checkpoints with no issues. Our men made it inside, again no problem. The issue is that...\n\nThey never came out.\n\nAbout a day after our men were last seen, nearly all of our safehouses in Burgundy were raided; most of our agents were compromised in the crackdown. It's safe to say that the operation went horribly wrong; our men probably got captured, and then likely were horribly tortured to death, but not before they gave up sensitive information, if the raids are anything to go by.\n\nWe knew the risks, and now we have to deal with the consequences. The SS likely know that it was without a doubt us who have been sabotaging their backlines. Tensions are without a doubt going to rise; it remains to be seen if they will boil over or not."
 goering.schwarz.30.a:0 "We got too ambitious for our own good."
 goering.schwarz.31.t:0 "The Code Crack has Succeeded"
 goering.schwarz.31.d:0 "Those madmen in the Abwehr did it!\n\nOur men infiltrated one of the major headquarters in Paris easily enough, but our agents were assumed KIA, or worse, after we lost contact with them for over twenty-four hours.\n\nBy day two, our agents were getting ready to abandon their safehouses when the two infiltrating agents returned home, with code books no less! It seems the men got caught up in a briefing, and had no choice but to blend in. It's a miracle they didn't get caught!\n\nAlready, we are learning valuable Burgaidan secrets. Locations of secret missile silos, their military capability, locations of major stockpiles, and more are being reviled to our men as we speak. And the best part? The SS are none the wiser."
 goering.schwarz.31.a:0 "These men deserve medals!"
 goering.schwarz.32.t:0 "The Enemy Inside"
 goering.schwarz.32.d:0 "Though it isn't an open secret, we are well aware the Burgundy has an extensive spy network in our nation. Made up of SS sympathizers, ex-SS men, and specialists that have infiltrated from Burgundy itself, Himmler has many eyes in ears all throughout the Reich. The Abwehr has been working on cracking these hidden cells, and believe they may have a lead! If they manage to find something solid and trace the bread crumb trail, we may be able to expose most of Himmler's informants!\n\nOf course, failure is a possibility. If the spy network discovers that we're on to them, they may go deeper underground, or even act against the agents attempting to smoke them out. Still, the Abwehr is confident that they can expose these rats."
 goering.schwarz.32.a:0 "It's time to lay out some rat poison..."
 goering.schwarz.33.t:0 "A Humbling Failure"
 goering.schwarz.33.d:0 "Our attempts to smoke out the SS agents lurking underground in our nation has failed miserably. Perhaps their spy network is more elaborate than we thought, or our men simply made too much noise. Whatever happened, their agents have gone dark.\n\nIt isn't just the SS men who have gone missing. Several of the men working leads on this operation have mysteriously gone missing; we only have one report of one of our men being kidnapped out of his house at night in Essen; we imagine the other dozen men have met similar fates and are likely dead already. To make matters worse, Himmler himself will have gotten word that we are focusing efforts on curbing SS influence, which will more than likely raise tensions between us."
 goering.schwarz.33.a:0 "Even in our own borders, we can't beat them."
 goering.schwarz.34.t:0 "A Blow Struck"
 goering.schwarz.34.d:0 "Even in our own borders, it felt like we were fighting an uphill battle to expose the many SS spy rings scattered throughout our country. Dead ends, cold leads, even assissation attempts! Yet the Abwehr pulled through.\n\nBy tracing shortwave FM radio frequencies, they found the first Burgundian hideout. From there, it was relatively easy to crack down on the rest of the spy ring. Although we know for a fact that SS agents and sympathisers slipped through our net, more than a hundred informants have been arrested! The Abwehr is confident that they have broken the back of the spy network; Himmler, for the foreseeable future, does not have eyes in our administration."
 goering.schwarz.34.a:0 "Fantastic work!"
 goering.schwarz.35.t:0 "The All-Seeing-State Blinks"
 goering.schwarz.35.d:0 "BERICHT: BURGUNDER INFILTRATION\n\nThe Burgundian agent codenamed \"BLACK EAGLE\" was discovered by an Orpo agent after tape was found holding door open in a local Orpo HQ in Hamburg. Upon closer inspection, the Orpo agent located a series of bugs across the local HQ, and immediately suspected foul play. The agent prepared false information for BLACK EAGLE, and upon leak of false information (and the contained ink-cartridge), BLACK EAGLE was revealed to be [REDACTED]. [REDACTED] was immediately arrested and eliminated. No personal effects were noted in possession of BLACK EAGLE at time of arrest.\n\nUpon search of an apartment inhabited by BLACK EAGLE at [REDACTED], Buxtehude, an information cache and radio-communications systemed codenamed \"EVIL EYE\". Much of EVIL EYE is deeply encoded and largely unusable without the proper knowledge of how to operate the fairly esoteric, specialized equipment (BLACK EAGLE is known to our government as the son of an SS radioman), though through careful analysis of EVIL EYE, we have managed to garner significant knowledge of the norms of Burgundian information gathering programs.\n\nWith your authorization, we shall pass the knowledge of EVIL EYE onto Wehrmacht leadership. This is an unexpected and major boon in the so-called \"Shadow War\", and would likely hugely benefit any potential direct military incursion into Burgundian land.\n\nDeutschland über alles."
 goering.schwarz.35.a:0 "Excellent news!"
 goering.schwarz.36.t:0 "Shadows Against the Wall"
 goering.schwarz.36.d:0 "BERICHT: BURGUNDER INFILTRATION\n\nThe program of infiltration into Burgundian intelligence units codenamed \"SIDEWINDER\" has utterly backfired-- a German agent codenamed \"DIREWOLF\" (real name: [REDACTED]) has recently been located, exposed, and confirmed KIA. Unfortunately, we believe that at the time of DIREWOLF's arrest, they were carrying sensitive documentation that may have exposed the operational norms of SIDEWINDER. If the Burgundians do in fact have possession over DIREWOLF's SIDEWINDER files, it is certain that they will have a massive leg up in this so-called \"Shadow War\" and any potential military operations to follow.\n\nDIREWOLF's mission was to locate and eliminate BLACK EAGLE, a known Burgundian intelligence asset that fled to Nord-Paris upon an Orpo agent locating a series of bugs in an Orpo HQ. The status of BLACK EAGLE is currently unknown, but it is suspected that DIREWOLF was captured before being able to carry out their mission. This is a major failure in German intelligence, and may ultimately jeopardize the entirety of Fall Schwarz, though that is obviously a decision to be made by Wehrmacht leadership.\n\nDeutschland über alles."
 goering.schwarz.36.a:0 "Curse them!"
 goering.schwarz.37.t:0 "Too Slow"
 goering.schwarz.37.d:0 "We knew we were gathering attention with our recent inquiries into Burgundy, but evidently we were more conspicuous than we thought. The German-Burgundian border, the most heavily fortified area in the world, is alight with gunfire. Artillery emplacements duel and rockets fly as Burgundian troops attempt to advance into the Rhineland.\n\nFor the first time in decades, Heinrich Himmler has made a public statement, blessedly short.\n\"The Reich will be purified.\"\""
 goering.schwarz.37.a:0 "This is the endgame."
 goering.schwarz.38.t:0 "Bombs Over Nord-Paris"
 goering.schwarz.38.d:0 "Considering that Nord-Paris was supposed to be the black heart of the Ordensstaat, Schmidt was pleasantly surprised that his bomber squadron had taken minimal ground-to-air missile fire. The scattered few missiles were nothing a few of the group's flares couldn't handle. Schmidt made a mental note to mention this in his report; the ballistic missiles had done fantastic work; the bombers had penetrated deep with next to no resistance. A pleasant surprise.\n\nThe smog filled skies only darkened as they got closer to the already charred city; Schmidt's wing of five bombers would be the third group to carpet bomb the city today.\n\n\"This is Gold One,\" Schmidt projected into his microphone.\"We are over the target. Commence bombing run.\""
 goering.schwarz.38.a:0 "This one's for you Himmler!"
 goering.schwarz.39.t:0 "Silence From Nord-Paris"
 goering.schwarz.39.d:0 "Heinrich Müller dialed the line for perhaps the tenth time in a row. His sparse office in his bunker was empty of people save himself, and he was glad for the privacy. The pit of dread and despair only grew in his stomach as all of his calls to Nord-Paris went unanswered; the lines were totally dead.\n\nMüller's face was drenched in sweat, the worst case scenario playing out in his mind. If the Reichsführer was dead... it was all over. No other man had Himmler's vision, his dedication, or his brilliance. If those bastard degenerates truly did kill the Reichsführer, everything was lost. The Ordensstaat was totally leaderless. He dialed the number again."
 goering.schwarz.39.a:0 "\"God, please, God, pick up the goddamn phone!\""
 goering.schwarz.40.t:0 "Reports Of His Death Were Greatly Exaggerated"
 goering.schwarz.40.d:0 "\"...pick up the goddamn phone!.\"\n\nSilence. Then, \"Müller, I'm going to ask you to repeat that line for me, I didn't quite catch that.\" Müller could feel the venom in his leader's voice even from over the phone, but for once, it didn't scare him senseless.\n\n\"Oh, um....\" Müller stuttered. He actually didn't have anything to report; his sector was all quiet; he was just calling to confirm the unthinkable for himself. But instead of hearing nothing, like he was told he'd hear from his peers, Heinrich Himmler himself was on the phone. The tone was unmistakable.\n\n\"Uh... yes. I'm sending half of my corps to reinforce the northern border as we speak, sir!\" A lie. For a spur of the moment one though, not bad. He could give the orders when he got off the phone. A moment of silence passed. How the Hell did he manage to make a few seconds of quiet feel like an hour.\n\n\"Your... initiative is commendable during these times, Müller. I'm glad to hear that. I have other matters to attend to, but expect further orders within very soon.\" The phone went dead, Himmler had hung up on him. Müller took a breath and allowed himself a sigh of relief before he wiped his tears off his face. He looked down at his phone, then punched in his adjutant's number."
 goering.schwarz.40.a:0 "\"Get the officers in my office, right now! We're being deployed!\""
 goering.schwarz.41.t:0 "The Silent State"
 goering.schwarz.41.d:0 "\"What do you mean, nothing?\" Göring's chins rippled with astonishment.\n\nThe idea had been his own, a full-blast propaganda campaign inside Burgundy's own borders. Radio transmitters amped to maximum, high altitude jets dropping bomb casings filled with leaflets, mortars firing forbidden literature across less guarded sections of the border. The people of Burgundy had surely had enough of Himmler?\n\n\"Nothing, sir.\" The Abwehr officer stared dead ahead, not making eye contact with his Führer. \"Every part of the operation was carried out as planned. Satellite and radio monitoring showed no change. One of our informants noticed the literature shellings. Apart from one unfortunate victim of the first impact, the books just... stayed there. People walked around them in the middle of the street, until the SS turned up to burn them in situ.\"\n\nGöring sank further into his seat. Just what had Himmler done to these people?"
 goering.schwarz.41.a:0 "There will be no uprising."
 goering.schwarz.42.t:0 "The Black Sun Eclipsed"
 goering.schwarz.42.d:0 "But when the night shines on all the inhabitants of Europe, the Sun always appears in the strangest form it can possess. Desperately seeking rescue, German troops entered Ost Paris today, killing every SS soldier they could encounter. During this invasion, one could see everything, German soldiers were not used to horror of this magnitude. The conquests were accompanied by general outrage, the level of which was exceeded by the Germans several times. During his arrival in the conquered territories, Hermann Göring always emphasized chivalry over the defeated and captured, but this time it was an extremely absurd request, which Hermann Göring himself did not hesitate to trample on, just to let the torturer know his destiny. . Arriving in Ost Paris, the central building from which death came as during the plague, killing one after another, Göring's troops surrounded it. 'Without mercy, whoever you see, shoot, do not show mercy to those who do not know it!' The leader of this attack spoke, and with a wave of his hand established what everyone already knew. Himmler had nowhere else to go.\n\nHermann Göring appeared alone in front of the central building, wanting to see from the foreground, and grabbed the neck of the creature that had been ordering this all along. All top SS officials were now trapped, and did not want to be tortured like all those under them. 'I want them alive, all right? Don't kill them, I want that to happen, quite easily.' Göring said, watching this attack from the street, as the platoons slowly silenced their noise. Rushing inside, room after room was vacated, until they surrounded Himmler's office, from which shots were fired. 'What's going on there? Why did the shooting suddenly stop?' Göring said nervously, looking out the windows. After a few minutes, all the soldiers came out punished, without a trace of Himmler. 'What happened?' Göring asked briefly, as they looked at him hopelessly. 'The coward decided to commit suicide a moment before we broke into the office. I don't know what else to say.' 'Nothing, soldier, nothing. It's not your fault that he was always a poor coward hiding behind a chicken farm.'\n\nIn front of the crowd, Hermann Göring stopped, telling people how happy they are today to have him on the podium, freeing them from the restraint imposed on them by the SS. Göring showed everyone the hanging bodies of all participants in the Burgundian terror, swaying like a pendulum, in a light wind that brought a slightly lighter form of freedom. The worst is over. The worst is over. Burgundy has finally fallen. Göring saved people from eternal suffering."
 goering.schwarz.42.a:0 "All according to my plan."
 WORLD_REICH.300.t: "[Get_newspaper_header]The Burgundian Invasion"
 WORLD_REICH.300.desc: "After weeks of bluster, threats, and increasingly worrying troop movements, the unthinkable has occurred - a state of war has broken out between the German Reich and the Burgundian state. Though Himmler's domain is unquestionably the most internationally loathed nation on Earth, Göring's invasion has sent a shockwave of panic through international channels - namely, that the alleged Burgundian nuclear stockpile still remains unaccounted for. Assuming that the allegations are true, this would be the first conflict between nuclear powers in human history - and could very well be the last.\n\nMore worrying is that the shadow state, in an extraordinarily rare press release, has vowed to \"smash the false Reich with whatever it takes to claim victory\" - an ominous threat for the rest of the world, which can only sit and watch as the first Heer divisions cross the Burgundian border since the German Civil War.\n"
 WORLD_REICH.300.a: "Time to crush the traitors!"
 WORLD_REICH.300.b: "The final piece falls into place."
 WORLD_REICH.300.c: "The final battle has come."
 WORLD_REICH.300.e: "Two madmen locked in a fatal struggle."
 goering_peace_events.34.t: "The Conquest of Burgundy"
 goering_peace_events.34.d: "\"We did it.'\n\nThree words that not one person in the Führer's inner circle ever expected to say. Not the Führer Hermann Göring, puppet of a puppet, forced to rubber-stamp the newly-promoted Remer's insane plan and wait for the end to come for his precious Reich. Not Feldmarschall 'Bloody' Ferdinand Schörner, OberKommanderWehr who led the death-charge into hell itself, killing every living thing that bore the twin lightning bolts of the Shutstaffel upon their uniforms, desperately scrambling to catch every last silo Burgundy had threatened to dump right into Germania lest that inhuman abomination Himmler end the world in his spite. Not 'fellow' Feldmarschall Hans Spiedel, OberKommanderHeer who found himself in charge of landings from Dover and Portsmouth, only to arrive at already-conquered shorelines, fully expecting the blinding flash of his nightmares to erupt on both sides of the Channel.\n\nBut they didn't. The men on the ground, aboard the ships, in the skies and back at the airfields were split between quiet contemplation in their last moments or hedonistic partying for the precious few minutes before their complete obliteration. The seconds ticked by, stretching into minutes. A particularly observant few soldiers quietly wondered why they couldn't hear or see any rockets yet. Fifteen minutes passed, and the confusion grew more widespread, some wondering what was taking so long, others daring to hope again. An hour passed, and not a single rocket had been fired. Comms operators frantically dialled and radioed to every unit they could to confirm this apparent miracle. A day passed, and the fear of Burgundian sleeper silos had paralysed lower command, and still there was nothing in the skies but the Luftwaffe on their next recon sweep. A week passed, and after truly exhaustive ground searches, aerial reconnaissance, Abwehr operations, and many many dead SS stragglers, Strategic Defense sounded the all-clear. Today, Germany would live. Today, the Reich had won.\n\n\"We did it!' Göring repeated in a wheeze, breathless with exhilaration as the first genuine smile in years tightened his fat jowls. His wheeze then mutated into a laugh, small at first before completely losing himself to the sheer relief. \"We actually pulled it off!' he roared, red-faced from exertion as he grabbed both Feldmarschälle by the shoulder and pulled them into him. Was- was he trying to *hug* them!? Schörner and Spiedel exchanged equally bemused faces with each other, almost forgetting to be enemies as they each shouldered one of Göring's uncomfortably sweaty arms. Schörner cracked first, unable to hold back his own snicker. The Führer was right, they had indeed done it, even when it was so certain they could not, and somehow Uncle Hermann's glee proved infectious. Whether it was SS weakness, Aryan super-soldiery, silo malfunctions, a complete bluff, even a gift from above... It didn't matter now, as Hermann, Ferdinand, and Hans huddled together, ostensibly personal enemies yet now just glad to be alive. There would doubtless be more struggle soon - a rebellion here, a rogue spy there, a squabble between two Militärverwaltungen perhaps - but for now..."
 goering_peace_events.34.a: "It is done."
