l_simp_chinese:
 goering.53.t:0 "Der Freischütz"
 goering.53.d:0 "For the first time in a long time, Führer Hermann Göring was excited. After a tortuously long week that had been dominated solely by political matters related to the newest of the Reich's occupational regimes, Göring had managed to get one blessed night to himself. How to spend it had never been in question; the Staatsoper Germania had premiered a new run of Weber's Der Freischutz, and the Führer was determined to attend the show come Hell or high water. Why, even if Schörner were to barge in and announce that they had entered into war with America or Japan, Göring would not be dissuaded. He needed this as a man in a desert needs water.\n\nBundled up in multiple layers for disguise and accompanied only by the most discrete and trusted of his personal guard, the man who ruled over all of Europe and much of Asia and Africa did not look the part. He was careful to avoid the gazes of any of the other opera goers, as even with all of his efforts to disguise he was still the most known man in the Reich, if not the world. After a few stressful encounters necessary to procure his seat, Göring was finally able to take a place in the most prestigious of the viewing boxes. Now all that was left was to relax, and immerse himself in the show.\n\nThat was his plan at any rate, but it was not destined to be. The performance, as expected of the renowned theater, was as terrific as Göring could ever remember it being; its quality was not what haunted his mind as the lines of \"O diese Sonne\" ran through his head. No, it was the dawning realization on the part of the Führer that he, for all his power and prestige, was in no better a situation than young Max. Those damned militarists, Schörner, Remer, and the rest, they were the demonic Zamiel who had given him the magic bullets that had granted him such success. When, the thought flashed into his mind, would it come time for the seventh bullet to be fired? And what would be its terrible price? He shuddered silently as unbidden images of hellfire and death presented themselves to him in an inescapable montage of doom. The magic of the night was gone, and the Führer collapsed into a deep sense of fear as he heard the chorus utter the line that had always been able to move him before, only now in quite a different sense."
 goering.53.a:0 "\"Ist unser, und unser der Sieg! Unser der Sieg! Unser der Sieg!\""
 goering.54.t:0 "Mad Dogs"
 goering.54.d:0 "Göring sat at his desk in his private office with none other than Ferdinand Schörner sitting across from him. He felt defeated; the militarists had near total control over the entirety of the administrative apparatus, and there was very little he could do to stop their madness.\n\nSchörner, Göring noted, did not have that smug smirk on his face wherever he knew that he had one-upped or outmaneuvered a rival. No words really needed to be spoken as Göring read the bill that Schörner had wordlessly dropped on his desk for the Führer's rubber stamp of approval. It was no wonder that Schörner looked dejected.\n\nThe leader of the militrist faction, that clique that now dominated the government, had lost control over rabid war-mongers. Göring skimmed over the bill. \"...in anticipation of a great struggle...\" blah, blah, blah. More of the same nonsense. What stood out, \"...Otto Ernst Remer, in reward for devoted and distinquished service, is to also be promoted to the rank of Field Marshal.\" Damn. The most wild of the mad dogs was now a top leader. No wonder Schörner looked defeated; even he had lost control over the militarists. It seemed as though war with the other superpowers of the world was now inevitable. Göring wordlessly pulled out his seal and stamped the bill, handing it back to Schörner. The only words spoken between the two were finally said by Göring. Although not shouted, his words rang throughout the otherwise empty office."
 goering.54.a:0 "Is this what you wanted?"
 GGR_plan_C:0 "War Plan C"
 GGR_plan_C_desc:0 "All of our rivals thus far have been humbled by the might of the Wehrmacht and our indomabile spirit! From the Pacifiic to Altlantic, and everywhere in between, our flag flies on every street. We have proven to the world that our might is unrivaled; all but a select few still stand against us. It is time to humble our greatest rivals.\n\nThe first of these are our ethic brothers, the fanatical SS holdout in Burgundy. Their only saving grace is that they have a stockpile of nuclear munitions that they aren't afraid to launch. Cracking the 'Ordensstaat' will be challenging, but well worth the effort. Next on our list is the Empire of the Rising Sun; the cursed and traitorous Japanese. Although their army and navy is large and strong, they are spread thin trying to maintain their stranglehold in Asia; something we may be able to exploit. Last but not least....\n\nAmerica. Land of the Free, and Home of the Brave, or so they tell themselves. In reality, their only saving grace is the two oceans that have protected them from our might for over two decades! With our capabilities now, however, focing the Americans to truely bend the knee to us is a not just a pipedream, but a totally feasible task.\n\nThe battles ahead will be fierce and deadly. Yet, we have full faith in our warriors. One last effort, and the Reich will be left standing as the sole superpower on the planet! We will come out on top, and we will bring fortunes and glory to the Reich!It's time. We will prepare to attack the big 3 (Burgundy, the USA and Japan). Germany is about to face the hardest challenge it has faced in its history... but the Heer shall pull through!"
 GER_GGR_war_plan_c_no_allies:0 "Restricted War Zones"
 GER_GGR_war_plan_c_no_allies_desc:0 "German logistics is a rather finicky thing, with a heavy focus on large scale invasions. To avoid overloading the supply chain, Göring has decreed that only the closest militaries would participate in conflicts.\n§bIn actuality though, AI Göring is dumb and calls entire world to fight small African village which causes massive lag."
 GGR_veterans_of_all_possible_wars: "Veterans of All Possible Wars"
 GER_GOR_fall_rockwell:0 "Fall Rockwell"
 GER_GOR_fall_rockwell_desc:0 "One of the greatest blunders ever committed by the Reich was its failure to once and for all destroy the decadent American pigs at the end of the last World War. The momentum was on our side and with the Japanese as our allies we could have broken them. Alas, the late Führer was convinced by defeatists and lazy incompetent toadies to sign a conditional surrender. Now it falls to Führer Göring, his successor in every sense of the word at this point, to finish the job he began.\n\nWhat makes America a unique case amongst our enemies is a complete separation from any territory within our sphere, making them quite separated from our weapons. That is why the greater plan to eliminate the Eagle will require taking the long route... across two continents in fact."
 GER_GOR_goerings_carribbean_vacation:0 "Göring's Caribbean Vacation"
 GER_GOR_goerings_carribbean_vacation_desc:0 "The Führer has never stepped foot in the Caribbean Island off the coast of the Americas, but he has heard from trusted sources that they are a land that would be excellent for building a personal Summer resort once conquered. Aside from their personal worth to the Führer, these islands would make excellent naval and air bases for the inevitable invasion of the mainland. There are even some nations amongst the numerous islands that would even be worth reaching out to, if only to make securing the region all the easier."
 GER_GOR_the_cuban_question:0 "The Cuban Question"
 GER_GOR_the_cuban_question_desc:0 "Cuba has had a troubled past recently, with its recent revolution against Batista, and the instatement of fierce anti-fascist and populist Fidel Castro, it has had its ideology shift rapidly. But, for us, it has one golden strategic advantage; a large landing pad to the US.\n\nSuch an island under our control would be a massive boon for our war effort.\nProblem is, Castro has been fiercely against German ideology for years now, and has stayed quite firmly under the American wing.\nBut everyone can be swayed with enough charisma, right? Göring shall simply message Castro himself to see if a deal where Cuba goes under our wing can be arranged. Who would ever refute the Führer?"
 GER_GOR_talks_with_haiti:0 "Talks With The Dominicans"
 GER_GOR_talks_with_haiti_desc:0 "Dominica has, the Führer has been told by his aides, a long and troubled history, which may help explain why it is now under a government that is commonly referred to as following the principles of Fascism. While some within the Reich's foreign office are hesitant to apply such a prestigious label to an island state run by lesser races, it is conceded that their government model bears similarities at least to the Reich's. Göring does not really understand nor is he interested in finding out the tenets of the Dominican leader's philosophies, but such things as ideals are trivial matters in the end. Perhaps, believes the Führer, this Rafael Trujillo will recognize us as ideological, although thankfully for us not genetic, kin."
 GER_GOR_island_hopping:0 "Island Hopping"
 GER_GOR_island_hopping_desc:0 "After the embarrassing failure to win some Caribbean states over to our side it will now fall upon the warriors of the Reich to directly take control over the Caribbean islands if we still hope to make them useful in our plans against the United States. This will involve destroying the remnants of the former West Indies Federation, which itself was a part of the OFN, island by island. Still, this should prove no challenge to our veteran marines who will no doubt be calling to tell us of their victories after only mere hours."
 GER_GOR_operation_hydra:0 "Fall Hydra"
 GER_GOR_operation_hydra_desc:0 "Given the United States' relatively competent military, we cannot afford to lay all of our eggs in one basket during our main invasion. Were we to only concentrate on one area of their coast, they could swamp us with air support and fire until we were driven back into the sea or killed. That is where Fall Hydra comes in. This ingenious solution, devised by Admiral Puttkamer, calls for a multi-pronged invasion along the entire US Eastern Coast to keep them off balance and overextended. We will also be able to capture multiple cities at once and hopefully force a surrender all the quicker."
 GER_GOR_the_second_battle_for_the_atlantic:0 "The Second Battle For The Atlantic"
 GER_GOR_the_second_battle_for_the_atlantic_desc:0 "In our first round against the Americans, the Battle for the Atlantic was one of our most potent victories, at least it was for a time. We were able to dominate their shipping lanes and with the firepower of our U-Boats and raiding ships we sent thousands of tonnes of Allied cargo to the bottom of the ocean. Unfortunately, we ended up overplaying our hand a bit too much, and the USN was able to strike back and we began to suffer significant losses, including our state of the art ship, the Bismarck. We will once again due battle above and beneath the Atlantic, but we will have learned our lessons from the past and this time, it will be our turn to decimate their naval forces."
 GER_GOR_battle_across_the_atlantic:0 "Battle Across The Atlantic"
 GER_GOR_battle_across_the_atlantic_desc:0 "Reaching America through the Atlantic Ocean will likely be a daunting task, even for our invincible Kriegsmarine. The American navy outnumbers us by all intelligence reports, and so we must compensate for what we lack in numbers with Aryan prowess and fearlessness. We shall drive into their battle lines with the strength of lions and speed around their hulks with the energy of the Cheetah. Our admirals are more than eager for a rematch, seeking to wipe the blemish of our near-defeat on the open seas from our last go around from the record of their precious navy. Of course it will also fall to the Luftwaffe to sink American ships at blinding speeds, but if it keeps the admirals happy then Göring will let them have their chance."
 GER_GOR_swarm_their_skies:0 "Swarm Their Skies"
 GER_GOR_swarm_their_skies_desc:0 "This will be the crowning glory of the Luftwaffe's history, or it will be if the Führer has any say in the matter. Helicopters, bombers both tactical and strategic, fighters and interceptors, all will be sent speeding over the Americans' skies in an effort that will make the Blitz of England look like child's play. Whenever they look up they shall see only the shadows of our planes and the scream of our engines. We have even devised speakers to play the infamous \"Stuka Scream\" from our helicopters to put fear into their hearts. The USAF will have no chance to even put up a fight before we smash their planes on their runways. Our airfleets shall blot out the sun itself until our battle has been won!"
 GER_GOR_storm_their_beaches:0 "Storm Their Beaches"
 GER_GOR_storm_their_beaches_desc:0 "The upcoming American invasion will likely prove to be the largest amphibious assault in history as we deploy every frontline division we have at our disposal against our enemy. We will overwhelm their defenses by striking their coats at multiple points and driving inland from there. This will be, for all intents and purposes, an amphibious Operation Barbarossa. Just like Barbaross, the campaign will end with total victory for the Reich thanks to the weakness of our foe and our own immense strength and resolve. The Americans believe their size can save them, ha! They shall realize just how well that worked for the slavs."
 GER_GOR_the_amerika_bomber:0 "The Amerikabomber"
 GER_GOR_the_amerika_bomber_desc:0 "Before the end of the last World War, the Luftwaffe under now-Führer Hermann Göring sought to develop strategic bombers capable of striking the American homeland from German airbases. The project had made several strides but was eventually terminated after it proved unnecessary to win the war. Now the spectre of war with the United States looms large again, and given that the American mainland is now the primary target, Führer Göring was eager to restart the long dormant project. Collecting data from the past twenty years of aviation developments and combat data, it should now be relatively simple to design a plan that can launch from an airport outside of Brandenburg, deploy a payload up to and including nuclear bombs, and return home safely. Proposed stealth bombers such as the proposed Horten H.XVIII are also being looked at for actual development under the project's mandate."
 GER_GOR_review_american_geography:0 "Review American Geography"
 GER_GOR_review_american_geography_desc:0 "Unlike with Europe, the Reich has never deployed ground forces in the United States' territory, and thus our generals are woefully lacking in the minute details of its geography. To make sure our forces are properly deployed once the direct invasion begins, we have instituted a crash course of the American terrain to make sure each officer of sufficient rank is familiarized with the lay of the land. In a fight against another nuclear power, speed is crucial, and so the faster our forces are able to take out key targets the higher the chance victory will be declared before nukes begin flying."
 GER_GOR_contact_the_amerikadeutscher_bund:0 "Contact The Amerikandeutscher Bund"
 GER_GOR_contact_the_amerikadeutscher_bund_desc:0 "In the mind of the American public, the image of the Reich is supposed to be one that is detested and feared. This is no doubt an unfortunate consequence of their bitterness in defeat, but there are some brave enough to fight back against the lies and propaganda. The Amerikaner Deutscher Bund is a group of sympathizers within the United States. They are small and lack any kind of mitigating support for the most part however, but it is always a good idea to establish connections with possible allies before rather than after the victory to ensure smooth relations and clear understanding of who stands where. That is why, despite his general lack of faith in their ability to be much help, the Führer has agreed to see several representatives of this group in Berlin. Perhaps they will end up surprising him?"
 GER_GOR_the_conquistadors_footsteps:0 "In The Conquistador's Footsteps"
 GER_GOR_the_conquistadors_footsteps_desc:0 "It was only around a few centuries ago that all of South America was ruled over by the higher European races, and it has ever since been Europe's land by right of conquest. Unfortunately though the combination of viscous native savages, weak-willed European officials, or the break up of old empires, these lands left their masters' spheres. This unfortunate travesty has reversed the work of great men like Cortez and Pizarro and has led to many degenerate governments led by men of low blood taking root and entrenching within the region. We will retrace the footsteps of the Conquistadors and explorers and bring these nations back under the rightful rulership of their superiors, only this time, the German nation shall hold their reigns and they will never be let go."
 GER_GOR_cut_off_their_reinforcements:0 "Cut Off Their Reinforcements"
 GER_GOR_cut_off_their_reinforcements_desc:0 "As we begin our glorious conquest of the South American continent we will no doubt be opposed by our rivals who will seek to attack us by proxy and possibly even directly. We must prevent them from reaching our targets long enough so that when they do come, we have our attention undivided and can meet them in full force. Our submarines will be given explicit orders to target incoming ships to the region regardless of affiliation. No guns or men will come to the aid of our enemies while the Kriegsmarine are on duty. If America or Japan complain we can always tell them that it was an accident and bank on an aversion to starting another world war to hold full scale intervention off for a time."
 GER_GOR_cape_verde_launch_pad:0 "The Cape Verde Launchpad"
 GER_GOR_cape_verde_launch_pad_desc:0 "In our invasion of the Iberian peninsula we took possession of the Cape Verde Islands off the Coast of the African continent. These islands in particular have long been used as supply and refueling stops. We can co-opt the already existing facilities and repurpose them to serve as a major launchpad for the Kriegsmarine and Luftawffe in our invasion of South Africa. With its ideal proximity to South America and already developed infrastructure it will no doubt prove to be the linchpin of our war effort in our coming campaigns."
 GER_GOR_prepare_for_jungle_warfare:0 "Prepare For Jungle Warfare"
 GER_GOR_prepare_for_jungle_warfare_desc:0 "Mountain, Desert, Arctic, all conditions in which the glorious Heer has fought and dominated in, and yet there is one biome in which we have precious little combat experience in: the Jungle. Jungles dominate a good deal of both Central and South America and to prepare campaigns in these regions we must make sure out troops are equipped and prepared to handle their terrain and climate. While we in mainland Germany never developed many techniques for dealing with such situations we do have available one source that can, albeit not with the best professionalism, teach us. Siegfried Müller, former Reichskommissar of RK Zentralafrika fled to us after Hüttig's coup and has since done little of actual value. This is his time to actually prove himself to the Reich following his failure to maintain order in Africa."
 GER_GOR_fall_amazon:0 "Unternehmen Amazon"
 GER_GOR_fall_amazon_desc:0 "Brazil is the only South American nation that has the chance of actually putting up a significant fight against an invasion, but only if it is able to mobilize. This is why we must quickly and decisively eliminate it, a victory only secured through a protracted campaign through the jungle is little better than a defeat at that point. The attrition from disease and lack of supply would likely dwarf losses in combat by a significant degree, or so Schörner has explained. Our main targets should be the region at the mouth of the mighty Amazon in the north and the states of Rio de Janeiro and São Paulo in the south to effectively wipe out the Brazilian militaries likely staging areas at once. While we ought to handle this assault with more caution than with its neighbors, we should also not become too timid, and we should remember that after all, we are the world conquering warriors of Germany. There is no nation too big to fall to our swords."
 GER_GOR_fall_venedig2:0 "Unternehmen Venedig"
 GER_GOR_fall_venedig2_desc:0 "By right of historical ownership, Colombia and Venezuela are rightful domains of the Reich. The colony of Klein-Venedig was settled in the 16th Century and could have found great success and have been a boon for the German people had it not been for the shortsighted decision by Emperor Charles V, who it must be noted was not wholly German by race. A man with only one German parent would never be given status in our Reich, so why should we heed the proclamation of one from the distant past? Klein-Venedig shall once more be in possession of Aryan hands, fixing this historical injustice once and for all."
 GER_GOR_secure_more_lebensraum:0 "Secure More Lebensraum"
 GER_GOR_secure_more_lebensraum_desc:0 "One of the most important missions of the Reich was to expand Lebensraum for the Aryan people. We must expand to all land and grow as a race as is our right. South America as a region is practically hand tailored to this dream, as it is a large continent that is relatively sparse in its habitation compared to Europe. Who better to tame the wilds of these lands than Germans without advanced intelligence and technology? In twenty years we will create a vast colony here that will allow for generations to come to expand and thrive. The only obstacle standing in our way are the existing governments but they will prove no more durable than any other foe we have faced, which is to say: not at all."
 GER_GOR_isolate_the_panama_canal:0 "Isolate The Panama Canal"
 GER_GOR_isolate_the_panama_canal_desc:0 "The Panama Canal is the true diamond in the rough amongst the malaria-ridden jungles and dense forests of South America. In fact, were we not already planning to create a land front with America through Mexico the Kriegsmarine would likely have damn-near forced us to strike at the Canal. By capturing it we can prevent the sizable US Pacific Fleet from joining its Atlantic counterpart anytime soon. To that end, we will first need to destroy the nation of Panama that proved its lack of worth in letting another nation own the great strategic position that runs through its very heart. When we finally confront America directly we will come down upon the Canal like a tidal wave and push aside any opposition no matter how fierce."
 GER_GOR_operation_von_spee:0 "Unternehmen Von Spee"
 GER_GOR_operation_von_spee_desc:0 "Of all the nations of South America, Argentina has the closest ties with the Reich from the side of culture and demographics. Many Germans live there and make up a sizable minority along with other European immigrant descendants. Of course, these lost sons have mingled for far too long with lower races to ever truly be our equals as pure Aryans but still, they are our relatives at least and one does not leave their relatives out in the cold at night. We shall seize the state and consider integrating it into the Reich once we have purged the filth and the blood traitors. It will make a marvelous new home for our veterans to start families in once this great campaign is all over. The spirit of Von Spee himself watches over us as we sail for Argentinian shores."
 GER_GOR_the_ofns_peon:0 "The OFN's Peon"
 GER_GOR_the_ofns_peon_desc:0 "Unsurprisingly given the fact that its leader is the dominant of either American continent, the OFN have their own toadies in South America: Guyana and Suriname. Luckily for us the OFN have not made much of an effort to support these small, pitifully rag-tag states over the years and it is positively ripe for the taking. The fun of breaking them will serve as an excellent warm up as we prepare for more conquests in the Americas"
 GER_GOR_crush_central_america:0 "Crush Central America"
 GER_GOR_crush_central_america_desc:0 "The Central American region is absolutely infested with small, pathetic nations that will easily be trampled under our boots and be ground to dust. In fact, Feldmarschall Remer has suggested, without hint of humor, that we could engage all of them with only one army and have enough strength remaining to blitz through Mexico. Perhaps he is just boasting, but his words do strike at the core truth of the matter. These nations are all weaklings, unfit to survive or even be recognized as true enemies by the Reich. They are merely speedbumps, and nothing more. Whether we only eliminate the bare minimum of them needed to reach our ultimate strategic target of Mexico or take our time in cleansing the region is of course up to the Führer's prerogative, but the militarists are confident in their ability to deal with any and all threats amongst this lot."
 GER_GOR_operation_maximillian:0 "Unternehmen Maximillian"
 GER_GOR_operation_maximillian_desc:0 "Despite being known for being under Spanish rule for most of its history, a German did indeed once rule over the land of Mexico: Emperor Maximilian of Mexico. Unfortunately, he only reigned a short time before the ungrateful curs overthrew him and murdered him, ending a line of German monarchs in the Americas prematurely. Oh, how differently things might have gone for us in the First World War had Mexico stood together with us. But perhaps that was for the best, for out of our defeat rose the triumph of the will of National Socialism. Still, for the best or not, we cannot overlook the insult to all Germans that was perpetrated in that dry and arid land, and we shall have our due recompense now."
 GER_GOR_operation_ikarus:0 "Unternehmen Ikarus"
 GER_GOR_operation_ikarus_desc:0 "At long last, the time has come for our major direct assault upon the United States to commence in earnest. We shall finnaly get rid of the pathetic and cowardly Dominicans and Cubans at the same time to give us even more launching pads. Feldmarschall Remer will handle field operations from here on while Field  Schörner coordinates the overall campaign from the Führerbunker. This has been a battle decades in the making, for even in the beginning Hitler knew that the United States would make an excellent partner if not for its puppeteering by the Jewish world order that sought to keep all pure nations down. Look how far it has sunk it that time with its so called \"Civil Rights movement\" and anti-fascist pawns in the White House and one can see how true the late Führer's words were. Well, one thing is for certain: the Jews will not be allowed to control that nation for much longer."
 GER_GOR_in_the_good_old_usa:0 "In The Good Old USA!"
 GER_GOR_in_the_good_old_usa_desc:0 "The United States has always had an affinity with us, whether they wish to admit so or not. Did the late Führer not take inspiration from many of their systems of racial hierarchies and seek to create a state where those systems could be applied without the Jewish influence that had corrupted the Americans? If we are the final product, then America is at least a prototype. There are some who would, even now, listen to the call of a truly pure state and work to make their own land as glorious. Particularly in the deep south-eastern region, there are many groups dedicated to fighting the influence of lesser peoples and races. We shall sound a trumpet blast and they shall rise up to defend their homes, not from us, but from their true enemies: the Jews and the Africans!"
 GER_GOR_it_will_happen_there:0 "It Will Happen There"
 GER_GOR_it_will_happen_there_desc:0 "Fascism in America is inevitable and always has been. Whether it would come through popular will or bullets was the only true question. It seems that the American people, or at least their Judeo-Bolshevik enraptured leaders have chosen the latter, but there is still time to save many racially pure lives from utter destruction. The group of sympathizers within the United States that failed in its attempt to assassinate the President was never fully caught, and they are once again offering their services. At this point, with the war having already begun, there is not much chance of a political change of heart on the American side. Still, according to these men, if they were able to eliminate a large portion of the US Congress, the government might feel the need to sue for peace. Hardly any more promising than their last proposal, but why not? We stand to lose nothing."
 GER_GOR_strangle_their_eagle:0 "Strangle Their Eagle"
 GER_GOR_strangle_their_eagle_desc:0 "As our campaign in the American mainland continues to capture resources and supplies the Americans will no doubt begin to turn to other sources to make up for their deficit, likely from any remaining allies they have in the OFN and even from the Japanese Empire possibly. We will never allow that to happen. Our subs and bombers will make short work of their convoys. The trade capital of the world will be forcibly returned to splendid isolation in short order."
 GER_GOR_their_last_best_hoped_dimmed:0 "Their Last, Best Hope Dimmed"
 GER_GOR_their_last_best_hoped_dimmed_desc:0 "It is finished. After the most intense battle the world shall ever see, the guns have fallen silent as the world wakes to the realization the New Order that was promised has been truly established. There is no more democracy, and there is no more United States of America. Their military has been crushed, their leaders executed, their lands divided into Militärverwaltungs, with unification a far away dream. The nation that once positioned itself as our greatest rival has been utterly defeated. With this victory, there is no force on Earth that can stand up to us any longer. Sieg Heil! Sieg Heil! Sieg Heil!"
 goering.558.t:0 "Fall Rockwell"
 goering.558.d:0 "Today is a day that shall cement the names of every soldier and every one of their great leaders forevermore! The formal declaration of war has by now reached the White House, and the pathetic Americans have already begun to panic on their national television and over their radio broadcasts as they realize the coming storm that shall soon sweep their degenerate culture from the face of the Reich's new world! A hundred thousand American mothers will weep when their sons go to die to our glorious legions, as the pitiful nation that believes itself invincible shall soon be swept away in the sands of time. We beat the Jewish banker led fools once, and we shall do so again.\n\nHerr Göring has given his speech today, which was solemnly short and concise for him. Germany was in awe at his brief and brave words and his clear bravery towards the upcoming struggle, and the members of his cabinet-now almost entirely made up of members of the Wehrmacht-stood behind him as he spoke his words. Many claim the Führer looked worried, and he was. He was not worried about our soon to be brief and just war, that will blitz the Americans before they can ever dare threaten us with their pitiful nuclear arsenal, but he was worried about his brave sons and daughters who will lay down their lives in this great and final struggle."
 goering.558.a:0 "We shall be home by Christmas!"
 goering.559.t:0 "A Day to Live in Infamy"
 goering.559.d:0 "The Joint Chiefs of Staff were right when they worriedly claimed the Reich was preparing to attempt an invasion overseas the other day. Already the Navy has reported German ships beginning their journey out of port as Wehrmacht units prepare for the largest naval invasion that mankind has ever seen.\n\nTheir chances, to say the least, are predicted to be slim. The Kriegsmarine has never been able to compete with the US Navy, especially after most of the German fleet found itself at the bottom of the sea on our behalf. The Luftwaffe is better off, but the Air Force has prepared for this attack for ages, and its generals are borderline filled with glee that they finally get to use all the toys they've been developing. The Army and the Marine Corps, from the National Guard, Reserves to the active duty personnel, are reporting record morale and skyrocketing enlistment numbers even just a day after the declaration.\n\nAmerica is prepared for this struggle, and if we are to fail, then our nuclear arsenal stands ready to ensure that if freedom is to be extinguished from this Earth, then so too shall the stains of tyranny that have overcome it.\n\nIf one thing has truly helped morale, it is the fact that Göring has given his most pitiful speech yet, practically pissing himself on live television as his generals glared at him from behind."
 goering.559.a:0 "Let's finish this. Once and for all."
 goering.rockwell.1.t:0 "Holiday in the Sun"
 goering.rockwell.1.d:0 "The great conference table was today covered not by a map of the Reich's eastern border, but the west. The Führer leant over the canvas, his prodigious bulk blocking out the overhead light like an eclipse over the Western Hemisphere. His finger gestured between two of the largest blocks on the map before he leaned back again with a wobble, satisfied, and took yet another sip from his glass.\n\n\"This is where we will find our allies.\"\n\nThe figure to his right stared down the bridge of his nose through his reading glasses doing his best to ignore the winestain that formed a new landmass in the Atlantic. \"Haiti and Cuba?\". Schörner's lip curled upwards into a sneer. \"Forgive me, mein Führer, but while they would provide excellent staging posts for further operations their cooperation is unnecessary - and I expect not forthcoming. To notify them of our intentions would be counterproductive in excess.\"\n\n\"Have a little faith, Ferdinand. I am told the Haitian regime has taken great inspiration from National Socialism - no doubt they will be overjoyed for assistance against America and Dominica.\"\n\nSchörner resisted the urge to remind Göring that Dominica was a completely different place to the Dominican Republic - with the amount of wine the Führer has consumed it was unlikely he would understand. \"And Castro? The man is an ardent Communist. If he chose to work with us he would either be a fool or a backstabber.\"\n\nGöring seemed to be deliberately ignoring him, and had already begun writing a letter with a wobbling hand. \"You have no head for diplomacy, Ferdinand. Certainly we could invade all of the Caribbean, but a little goodwill goes a long way.\"\n\nSchörner simmered on the inside. On some days, he was sure the Führer only played these little games to spite him and the other militarists, a way of feeling in control once again, but on other days the almost insanity of the man seemed genuine. So be it he thought, let the Führer dream of being a diplomat. He would begin drawing up the backup plans."
 goering.rockwell.1.a:0 "Why am I still taking orders from this fool?"
 goering.rockwell.2.t:0 "A Letter to Fidel Castro"
 goering.rockwell.2.d:0 "To First Secretary Fidel Castro of Cuba,\nI wish you and your nation goodwill. Cuba has remained a mostly isolated land since its revolution against the tyrant Batista, remaining under the American hegemony,hopefully against its own interests. Your leadership has brought equality and prosperity, and there exists a great admiration for the people of Cuba in Germany for their resilience against tyranny.Us Germans can relate, after all was our way of governing not a revolution in itself?\n\nI write to you to offer friendship in these hard times. Whilst Cuba is strong and proud, in the event of conflict between the Reich and the USA it risks being trampled between them. Only the Reich can offer protection in these circumstances, for it is the might of the Reich that will eventually prevail. To this end, it is my decision to offer you the honour of membership in the Einheitspakt, and all the benefits associated with it. Cuba's independence will be guaranteed under the auspices of the Reich.\n\nWhile I understand that you commonly spout anti-fascist ideals in speeches, you can surely appreciate that these troubled times are hardly fit for zealots of any belief system. As always practicality should win out against dogma.\n\nI eagerly await your response.\nBest Wishes, Führer Hermann Göring"
 goering.rockwell.2.a:0 "Surely they understand Realpolitik?"
 goering.rockwell.3.t:0 "I Find Your Bad Faith Disturbing"
 goering.rockwell.3.d:0 "To Führer Hermann Göring,\nYou are a liar and a fool if you think to gain my trust through honeyed words. As much as it pains me to say but I would rather ally Batista than even consider friendly relations with you, and I spit upon your attempts to ingratiate yourself with us. The Cuba that the German people allegedly admire does not exist, for it is viewed through the Reich's corrupt and blackened lens.\n\nYou take me for an idiot if you think I trust in your assurances for a second, and I have no doubt that as soon as a German boot steps foot on Cuba its wearer will begin the process of colonisation. We will not step back under the European thumb, for the freedom of all cubans against inequality, and fascism, in the world is our only true goal. Send your marines to Cuba and I will ensure that they drown in the ocean myself.\nI wish you an early death.\nPresident Fidel Castro"
 goering.rockwell.3.a:0 "Fucking communists!"
 goering.rockwell.4.t:0 "Rightist Unity"
 goering.rockwell.4.d:0 "To Leader [DOM.GetLeader] of Dominica,\nI wish you and your country goodwill. Your tenure as leader has seen great improvements to the suffering and poverty that has plagued the Dominicans since its great revolution against the Spanish tyrants. Dominica is a peaceful and stable part of the Island, and many in Germany admire the means by which you have applied the lessons of Fascism and dare I say, National Socialism, to the American continent.\n\nI write to offer an alliance in these dark times. The Dominican Republic is strong, but in the event of a German-American conflict it risks being trampled underfoot. The Reich's friendship is a valuable thing, one that could protect Dominica in this event. The day the Dominican Republic joins the Einheitspakt will be a day of prosperity and peace to be marked for the ages. The dogged American imperialism which has plagued your realm could finnaly be quelled, and your name praised for eternity.\n\nI eagerly await your reply.\n\nBest Wishes,\nFührer Hermann Göring"
 goering.rockwell.4.a:0 "One dictator will understand another."
 goering.rockwell.5.t:0 "The Enemy of My Enemy Is My Enemy"
 goering.rockwell.5.d:0 "You are a hypocrite, criticising Spanish imperialism while you hold dominion over half the globe. The Dominicans have learned the lesson not to deal with Imperialist powers time and time again, and for you to attempt to appeal to us by means of National Socialism shows your short-sightedness. Are you not aware that we are a proud nation of Hispanic descent? I wonder how we would fare allied to the likes of you, who destroyed our precious Iberian homeland and even razed Barcelona, all in the name of profit.\n\nWe have indeed learned lessons from National Socialism - we have learned that Imperialism and its brutality is not yet ridden from this world. I would sooner kiss the American President's heel or open up our ports to Japanese warships than let a single Nazi set foot on Hispaniola.\n\nThe greatest of you Germans will never be more than the lowest of my people so long as I am the leader.\n\nStay in Europe.\nGlorious Leader [DOM.GetLeader]"
 goering.rockwell.5.a:0 "Those ungrateful bastards!"
 goering.rockwell.6.t:0 "A Meeting with the Bund"
 goering.rockwell.6.d:0 "Yet another meeting Göring had been pressured into by Schörner and Remer, yet another excuse for the lousy Führer to sit in a comfy chair and twiddle his thumbs and only half-listen to what his guests had to say. In came a group of four men who looked far more suited in overalls and straw hats than the suits they were wearing. As soon as they laid eyes on Göring, they made the faces of children in a candy shop or of men facing their reckoning with God. Hell, they were probably resisting the temptation to kneel on the floor and grovel. Their leader, Robert Williams, said nervously, \"Mein Führer, it is the greatest honour of our lives to meet you.\"\n Göring nonchalantly flicked the cigarette ashes on his desk. He was not paying these strange men much attention. \"Oh? Oh, yes, of course. It's my pleasure.\" The two military men beside Göring give him a look that was more exasperated than angry, as they were used to and perfectly happy with their supposed leader's apathy and numbness by this point.\nRemer got straight to business. \"Gentlemen, you have certain paramilitary organizations who might be willing to support our cause against your degenerate government, correct?\"\n \"Yessir!\" Replied the second-in-command Gordon Mohr. \"The Christian Patriots Defense League is at your disposal.\"\n \"Sure... Excellent. Let us discuss some plans we have for the assassination of the US president,\" said Remer, who was effectively controlling the meeting by now. These were some of the most eccentric men any of the three Germans had ever seen, but there was no harm in getting them to do some dirty work for the Reich if they were so eager to help.\n At the end of the meeting, Mohr humbly asked, \"Mein Führer, if I may make one small request of you. I have a letter from one of our fellow sympathizers, Father Charles Coughlin that he has asked I give to you to read. It would be another wonderful honour.\"\n \"Of course,\" replied a distant Göring, almost forgetting to reach out and take the letter. \"I will gladly read it.\""
 goering.rockwell.6.a:0 "Let it be done!"
 goering.rockwell.6.b:0 "And into the trash it goes."
 goering.rockwell.7.t:0 "The Second Gunpowder Plot"
 goering.rockwell.7.d:0 "\"[GetName] was suddenly awoken from slumber when the earth trembled. For a second, everything returned quiet, and in the sleep-induced befuddlement he couldn't realize what was happening. Then, the ground trembled again, this time much stronger, and the sound coming from outside left him no doubt: this wasn't a dream, it was an explosion!\n\nBefore he could even blink, his bedroom was flooded by security personnel, who formed a protective shield around him. He could do nothing but follow his men as they brought him to the bunker deep below the House, a welter of voices only adding to the chaos.\n\n\"Defense protocols enacted! White House Under Attack!\"\n\"Call for reinforcements! We need backup!\"\n\"Armed men detected! Fire at anyone suspicious!\"\n\nFor hours, [GetName] lived as if under a spell: men came and went, data became rumours and then whispers, from an armed coup to a second civil war, even Italo-American mafia trying to take power, but at the first hours in the morning - at least if the clock was right - everything became clear, and it was much, much worse.\n\nWith livid face, the President listened as the commander of the security forces told him that a tunnel had been dug under Pennsylvania Avenue until it could reach the White House, and filled with so much gunpowder that - if everything had gone right - the entire building would have been rubble. By mere chance, however, the tunnel was fifty meters too long, and so it had blown up the façade of the Treasury Building. Even worse, however, was that several suspects had been arrested, one of which held written orders from the German Abwehr to remove the President \"through any means necessary\"\n\nSilence fell into the room. This wasn't a mere act of espionage, this was an assassination attempt on the President of the United States of America. This was an act of war, and [GetName] knew it perfectly. He knew he was making the most difficult choice in the history of his beloved country, but he couldn't afford hesitation. He took a deep breath, then spoke.\""
 goering.rockwell.7.a:0 "We are at war then. God bless America"
 goering.rockwell.7.b:0 "\"We'll have our revenge, but not through war.\""
 goering.rockwell.8.t:0 "The Second Gunpowder Plot"
 goering.rockwell.8.d:0 "\"[GetName] was suddenly awoken from slumber when the earth trembled. For a second, everything returned quiet, and in the sleep-induced befuddlement he couldn't realize what was happening. Then, the ground trembled again, this time much stronger, and the sound coming from outside left him no doubt: this wasn't a dream, it was an explosion!\n\nBefore he could even blink, his bedroom was flooded by security personnel, who formed a protective shield around him. He could do nothing but follow his men as they brought him to the bunker deep below the House, a welter of voices only adding to the chaos.\n\n\"Defense protocols enacted! White House Under Attack!\"\n\"Call for reinforcements! We need backup!\"\n\"Armed men detected! Fire at anyone suspicious!\"\n\nFor hours, [GetName] lived as if under a spell: men came and went, data became rumours and then whispers, from an armed coup to a second civil war, even Italo-American mafia trying to take power, but at the first hours in the morning - at least if the clock was right - everything became clear, and it was much, much worse.\n\nWith livid face, the President listened as the commander of the security forces told him that a tunnel had been dug under Pennsylvania Avenue until it could reach the White House, and filled with so much gunpowder that - if everything had gone right - the entire building would have been rubble. By mere chance, however, the tunnel was fifty meters too long, and so it had blown up the façade of the Treasury Building. Sadly, most of the suspects were killed in the pursuit, and nothing was found on the bodies\"\n\nMost people in the room, including [GetName], knew that the madman in Germania had something to do with it, but without proof there was nothing to be done about it. Investigations would be carried out by the CIA and all kinds of security agencies, but the President knew that he had his hands tied until something useful came out.\""
 goering.rockwell.8.a:0 "For now, a strongly-worded letter..."
 goering.rockwell.9.t:0 "A Lucky Failure"
 goering.rockwell.9.d:0 "Our plot to assassinate the American President has, unfortunately, failed due to a blunder in the execution of the plan. On the bright side, however, our involvement in the plot has not been discovered: our diplomatic attachè in London has received a strongly-worded letter from his American counterpart, but no actual measure followed. this is more than enough proof that the Amerikaner won't attempt anything against us, at least for now."
 goering.rockwell.9.a:0 "What a relief!"
 goering.rockwell.10.t:0 "The Eagle Shot Down"
 goering.rockwell.10.d:0 "Hermann Göring entered his office, ceremoniously dressed, looking for something that would resemble this event he ordered to be organized, so that he could show the German nation, as well as the whole world, that no one stronger than Germany exists, and that anyone who he dares to stand in her way will never succeed in overcoming her, because no one will be able to from this moment. From New York to Washington, from Florida to Kentucky, from the Midwest to the Washington state, and the Pacific coast, the troops remained mowed down by the strength of German steel and their will. Göring knew that no one would ever be able to burst out again, and to say, 'We will stop you, and we will not stop until we die!' and if he says, he will die trying to stop the unstoppable. The sun was shining brighter than ever, while Göring was looking forward to this day, which he had been waiting for so stressfully and for so long, that he did not want to stop looking out the window, imagining himself as the master of the whole world. But it was time. It had to be shown to the people that what had been achieved during this time in the duration of Fall Rockwell.\n\nAppearing before the people, he waved to them, while the people worshiped him as a kind of God, which he was, because he defeated the last enemy of the growing Germany. 'Dear people, my dear Germans. I have gathered you here today to point out to you the power of your fatherland, which we have been building for so long, which we have soaked and glued with blood, just so that it does not collapse before its glory, in which we are to you again. I say, succeeded.Perfidance will never be stronger than will, just as pretentiousness will never beat our steel.The United States has succumbed, unable to withstand any more of our heroic troops that have ravaged anything that could have served as a counter-attack opportunity! over the dead eagle of the so-called freedom that they present as a lie served to their people, because we are telling them now! Salvation has come to you today! With the arrival of Germany!'"
 goering.rockwell.10.a:0 "The dawn of a new era"
 goering.rockwell.11.t:0 "A Stupid Operation"
 goering.rockwell.11.d:0 "We can't possibly have expected these American nutcases to have achieved an operation as simple as frying an egg, so it's no surprise that the complex and immensely difficult task we gave them of blowing up the US Capitol and killing the president was a hilarious failure.\n The Bund agents, alongside Gordon Mohr's odd Christian Identity paramilitary group, attempted to storm the Capitol at the break of dawn, and the majority of them were gunned down during the attack. A few of them did manage to get inside and shoot some random congressmen, guards, and bureaucrats, but the president was safely evacuated from Washington D.C. the moment the attack began.\nThere is no easy end to this war like we had hoped, but we at least managed to wreak some havoc upon the American government."
 goering.rockwell.11.a:0 "It's... something."
 goering.rockwell.12.t:0 "White Knights, Rise Up!"
 goering.rockwell.12.d:0 "It is one of the most glorious and yet one of the most pathetic sights in American history. With the help of agitators on the ground and on the radio waves, Führer Göring has called upon the millions of white racists across the American South to rise up in support of an Amerika in the Führer's image: a racially purified one.\n Incredibly, tens if not hundreds of thousands of Southerners have taken up arms to fight for our cause (apparently they either wish to be crushed under our boot or do not know what they want). Across several states, bands of \"White Knights\" have seized land and begun fighting against their American overlords, and we are rapidly preparing arms shipments to be sent to these uprisings."
 goering.rockwell.12.a:0 "Fight for your race!"
 goering.rockwell.13.t:0 "Southerly Winds Bring Southernly Windfalls"
 goering.rockwell.13.d:0 "\"Not \"Columbia, mein Führer. It's the \"Free State of Colombia.\" No U's.\"\n\nHermann Göring was seeing Gehlen accompanying Axmann in his office, together as a pair, more and more often these days. If they were not so genuinely competent in their work, he would have likened the two to a vaudeville act, especially when they insisted on correcting him over the tiniest pronunciation errors. Perhaps it was his fault; no amount of diplomacy could be performed these days without a vast amount of subterfuge behind it. But then again, he doesn't summon Schörner for these sorts of meetings, does he? Even though most of their allies came about out of a simple desire to avoid being crushed by the war machine? So then, why did his head of intelligence need to meet with him with such frequency?\n\n\"Fine then, the Free State of COLOMBIA.\" The Führer replied, exaggerating his correction with an eye roll and an overpronounced tone. \"Whatever happened to the \"Second Patriotic Army?\" I quite liked the old name.\" He continued, making a small joke and opening the door for Axmann to continue his report.\n\n\"They wished to express their deepest appreciation for our part in their victory and that they are more than open to further cooperation. We also have no reason to believe that the newly crowned Caudillo, Alfonso Uribe Misas, will not be highly receptive to using Colombia as our springboard for further invasions. His ideology already seeks to ensure that the so-called \"Criollos\"-that is, his idea of Aryans-come to dominate all of North and South America alike. A simple promise of a higher spot on the caste system is all he needs to fight and die for us.\"\n\nIn other words, the perfect proxy, despite some minor disagreements on the specifics of the racial hierarchy. Göring had few reasons to be happy these days, but this news was almost enough to make him smile...before his gaze turned back to Gehlen, who still had not explained himself. Luckily, the man was quick enough to realize that his Führer was awaiting his input.\n\n\"Furthermore,\" the chief of the Abwehr continued, breaking out into something of a smug smirk of his own. \"Misas, in all his wisdom, has appointed Señor Heriberto Schwartau to head all security and intelligence efforts of the Free State of Colombia...though I suppose I should call him \"Herr\" Schwartau instead. He has been our primary contact in Colombia for over two decades and has sworn a personal oath of loyalty to you. I doubt there will be much trouble with the new regime, but if there is, he is perfectly positioned to ensure that our will is enforced.\"\n\nIn other words, it is not just a victory but total, absolute dominance: a fawning, militaristic ally on the throne and a spy as his grand vizier. It took a while, but at this news, the Führer finally broke out into that smile he had been saving."
 goering.rockwell.13.a:0 "Then let us celebrate. With a Fiesta to fit the mood!"
 goering.rockwell.14.t:0 "Too Good to be True"
 goering.rockwell.14.d:0 "\"Two months. He couldn't even last two months. This is what we get for trying to take the easy way.\"\n\nGöring didn't often like to admit that Schörner was right about much of anything, but in this case, he couldn't help but concede that they never should have gotten involved in Columbia in the first place. What was supposed to be a simple proxy conflict, a duel between the Abwehr and the CIA on South American soil, had officially escalated beyond the likes of Gehlen and Axmann. Now, it was Schörner and Speidel, and even Remer-exercising his newfound power, no doubt-who surrounded a new map of the Free State of Columbia.\n\nThe borders of that map were fluid and changing by the day, as their informants struggled to determine the exact lines of control between three factions once again duking it out in a renewed Violencia. But suppose that's just what happens when the ruler gets assassinated without a proper next-in-line to take command. Alfonso Uribe Misas was dead, and within hours, his nation was already falling apart.\n\n\"A general by the name of Diógenes Gil has seized Bogotá.\" Speidel reviewed, reading from a hastily assembled Abwehr report which had just finished being decoded, translated, and delivered. \"He is considered actively hostile to our interests. In response, our agent has rallied his forces around the cities where we enjoy the most popular support, primarily-\"\n\n\"Barranquilla. After everything we went through, we're stuck in Barranquilla once again.\" Remer interrupted, no longer awaiting his master's command to speak freely. Like a dark apprentice, he had ascended past the role of the learner, and had taken to dueling with Speidel personally. \"My Führer, we never should have gotten involved in any of this 'Violencia' nonsense in the first place, and we shouldn't involve ourselves further now. Let these Aryan wannabes figure out their own mess.\"\n\nIt was the exact kind of statement that Göring had expected to hear from Schörner, not Remer. And yet, the monster remained silent, merely offering a non-committal nod of agreement towards his protege, having resigned himself to playing second fiddle, at least for now. It was a sight he would have liked to enjoy, if the circumstances that led up to this point weren't so dire.\n\nSpeidel, of course, disagreed, no matter who was fronting the militarist cause. \"No matter how many resources we throw at this problem, it will still be less than if he just marched in there ourselves. We cannot pass up this opportunity because of a momentary setback.\"\n\nFor a moment, Göring wondered just how 'momentary' this setback was. He wondered what would happen even if he did decide to support Schwartau and his new 'National Socialist League.' Would it actually get them anything? Would the country fall into chaos again in a few more months? But after a few moments of contemplation, he realized that he was thinking about this in the wrong way. What mattered now wasn't whether it was worth it or not to involve themselves in yet another Colombian proxy war. What mattered now was whether he was going to side himself with either Speidel or Remer. In that way, it was the same choice as always, just with a different face on the other side of the coin.\n\nThey could argue with each other all they wished, but as always, he was the one who broke up the tie. After carefully considering the political aspects of both choices-and never once so much as thinking of the thousands of Colombian lives who would be affected by it-the Führer stood, and made his decree."
 goering.rockwell.14.a:0 "Schwartau will be armed with our bombs and bullets."
 goering.rockwell.14.b:0 "Schwartau will be armed with our thoughts and prayers."
 goering.rockwell.15.t:0 "A Close Call"
 goering.rockwell.15.d:0 "While it was entirely inaccurate to state that the Führer was bipolar or anything of the sort, it was nonetheless a wonder to see how quickly his mood could swing from moment to moment. Take, for instance, a day in which Schörner was making trouble even more than usual, where the economy continued to just barely survive, where his nephew required his aid in dealing with some militarist obstruction. By the time he had gotten a chance to sift through his usual litany of reports and status updates, he wasn't exactly fuming with rage, but he was nonetheless prepared to write the entire day off as being just as irritating as any other.\n\nAnd yet, good news from Colombia was all it took to perk him right back up.\n\nIt was a triumphant German victory, after all. Despite all the adversity, all the setbacks, and all the American interference, the Reich had finally secured not just an ally, but a true National Socialist stronghold in the new world. Schwartau had at last fulfilled his mission, purging both the remnant resistance movements as well as the Ersatz Aryans from that war torn hellhole, and in doing so, had fulfilled a greater service to him than either of them had perhaps realized. After all, there was limitless potential from here on out; with Colombia on her side, Germany could freely project power to neighboring nations from within, could aim its missiles directly into America's heartland, could use it as a staging ground for future 'interventions', and perhaps even more than that...\n\n...Of course, that would all take some time. Having suffered through two civil wars in a row, this country would need time to heal and rebuild before it could provide any practical use. Furthermore, it was not yet officially a member of the Einheitspakt, despite the fact that the new Caudillo-or 'Líder,' as he had taken to calling himself-was directly on his payroll as an Abwehr agent. But soon enough, such petty, insignificant hurdles would be leaped, and the world would enter a bold new age in which National Socialism could be found in every corner on Earth."
 goering.rockwell.15.a:0 "Until then, he would celebrate."
 goering.rockwell.16.t:0 "Love the Country, Hate the Man"
 goering.rockwell.16.d:0 "Carlos Echeverri Cortés had to be the most emotionally stable man Artur Axmann had ever met.\n\nIt would be inaccurate to state that he refused to bow to pressure; by contrast, he was repeatedly folding as soon as the heat was turned up even slightly. He wasn't stupid enough to fail to realize he was being extorted; he knew exactly what the envoy from the Reich was implying behind every thinly veiled insult and threat. He wasn't so utterly sycophantic that he was willing to sell out his country for his Nazi masters; instead, he was simply trying to legitimately cooperate as best he could, no matter how personally offended he may have been. He was, if nothing else, incredibly accommodating, and for the longest reason, the Reichsaußenminister simply couldn't understand why. Not until he was told, in an extremely offhand manner.\n\n\"I owe much to the German Reich.\" The ruler of New Grenada spoke, casually mentioning this essential truth as if he were simply telling an exciting story to a friend at a bar. Axmann dutifully played his part, raising his eyebrows and silently requesting elaboration. \"After La Violencia, the united front of my beloved National Fascist Party quickly crumbled. Cutthroat politics came to dominate all forms of internal debate. Then again, I'm sure your Führer is quite familiar with wrangling these sorts of political messes. A shame I can't tell this story directly to him.\" Both men smiled in response to such a statement, even though neither was happy at all; one for being snubbed out of meeting Hermann Göring in person, and the other for the implication that he wasn't good enough for this upstart Latin American wannabe dictator.\n\n\"I had to compete with bootlickers and cultists. Hardly the ideal partners for progress.\" Cortés continued, his gaze drifting off to the side as if lost in a flashback of those days only so long ago. \"Some sought to make allies with the Iberians or Italians over the Einheitspakt. Luckily, you managed to remove both as serious players in the game. That left only me, the one person who had advocated for working with you from the start, with any leg to stand on. You paved my path to power, so I simply seek to return the favor.\"\n\nA part of Axmann was tempted to tell him that the feeling was hardly mutual. That he was not their first choice for an ally in Colombia, that if they had had their way, he would be hanging from a lamppost for treason to the National Socialist cause. He was fairly certain that the bastard wouldn't even react at all and that 'negotiations' would have continued even then...but there was no need to risk his mission over something so petty. No matter how infuriatingly unflappable this man was, he still had a job to do.\n\n\"...I recognize that you sought observer status at most.\" Axmann eventually replied, almost entirely ignoring the tale he had been told. Though the mystery of Cortés' cooperation had been solved, there was still the matter of ensuring they took far more from him than he was willing to give. \"But I assure you, you need not fear any American response. Full member status will ensure that German soldiers will personally protect your country from any attack. We are willing to go so far as to strike preemptively to remove any threats to our friends...\" Artur spoke, barely disguising his intention to use New Grenada as a staging ground for further forays into South America. And yet, even now, Cortés refused to show any outright signs of defiance.\n\n\"Well, it is certainly good to have such loyal friends. Yes, I think full membership will do nicely.\" He conceded, at last standing from his seat and offering a hand to shake, all while thinking of some foul words to describe his 'friends.'"
 goering.rockwell.16.a:0 "We have our foothold!"
 goering.rockwell.17.t: "Through Our Fingers"
 goering.rockwell.17.d: "In hindsight, Göring should have known that this was inevitable. It was one thing to put down a rebellion in Africa, where German forces and their allies were already deeply entrenched. It was one thing to secure an island in the Caribbean, so poor and hopeless that the government had no choice but to bend to his whims for its own survival. It was one thing to roll over some tiny European nations half the size of the Reich, so close to home that his soldiers could read the Germania paper a day or two after Germanians themselves.\n\nIt was another thing entirely to cross the Atlantic, land in the jungles and mountains amidst hostile fire, crawl inland without any railroads, stave off partisans armed by the OFN, and try to win a civil war against an enemy that enjoyed 99% of the population’s support.\n\nGermany was a nation destroyer, not a nation builder. It had no experience in expanding the ideology of National Socialism through any other means than brutal military conquest. It could not help Schwartau stabilize his regime or calm the populace into obedience. It could not convince what few Fascists remained in the country that ‘Ariocriollismo,’ or whatever ideology they had manufactured to differentiate themselves, was a self-deluded farce. Now, those self-delusions were justified with the backing of reality; The National Socialist League was dead, scattered to the wind, beyond rescue. The Reich no longer had a presence in the New World.\n\nThat left the victors free to fight each other over the scraps they had left behind. If there was any consolation to this, it was that their suffering was far from over, that the impertinent traitors were now destined to bleed each other dry. They would bomb each other back to the stone age for who knows how much longer, and no matter who won afterwards would be beaten down so heavily that they would have no hope of survival when Germany returned.\n\nWhen Germany returned...Göring wondered if those words weren't just empty threats. That one day, if Schörner got his way, the Kriegsmarine would ferry his loyal soldiers all the way across the most turbulent ocean on Earth, just to grind a single rebellions nation into dust. It seemed like a distant fantasy, admittedly. The logistical problems alone were a nightmare, let alone the fact that landing an army in America's backyard was never going to end well. And yet, he couldn't help but wonder, and dream of what might happen if he had another chance at taking revenge against Colombia. Surely then, they would regret turning their back on him.\n\nSurely then, they would regret letting their chance at salvation slip through their fingers."
 goering.rockwell.17.a: "If I ever hear the name \"Colombia\" again, it will be too soon!"
 WORLD_REICH.301.t: "[Get_newspaper_header]The Battle for Liberty"
 WORLD_REICH.301.desc: "Once considered an impossible nightmare, perhaps the final war in human history has begun, as war has finally broken out between the German Reich and the United States of America. After years of smaller invasions of lesser neighbors, the Reich and the United States have engaged in a final, titanic struggle over the fate of the world upon Hermann Göring's order,\n\nBoth America and Germany, in preparation for such a scenario, have built up massive nuclear stockpiles - well more than enough to end human civilization, as is currently known. As the first dogfights occur over the Atlantic, millions of men report to their respective divisions, and gigantic naval fleets set out on their greatest missions yet, the situation feared by billions becomes reality.\n\nOnly one thing is certain - the end is near."
 WORLD_REICH.301.a: "We will never bow to tyrants!"
 WORLD_REICH.301.b: "The Americans shall be reminded of the taste of defeat!"
 WORLD_REICH.301.c: "The OFN stands fast!"
 WORLD_REICH.301.d: "The eagles shall battle for the last time."
 goering_peace_events.22.t:0 "The Conquest of the United States"
 goering_peace_events.22.d:0 "It is over.\n\nThe Statue of Liberty lays toppled over, destroyed in a devastating blast.\n\nMass graves lay everywhere, dozens of widows trying to find their sons and husbands in the piles. Abraham Lincoln's statue lies desecrated, its head cut off and broken, with a makeshift Hitler head held in its place. Southern towns lay in complete fear, as they can see their own countrymen join the Nazi soldiers shoulder-to-shoulder, wearing their Klan costumes. The White House is a smouldering husk, completely looted and destroyed beyond repair.\n\nThe American spirit is completely and utterly crushed. The once proud American flag, once saluted to every morning, now lays in piles on the ground, being burnt by the dozen by the occupying German soldiers.\n\nThe last, best hope of the free world layed dead, its rotting and burnt bald eagle carcass laying firmly under the claw of the ferocious and bloodied German eagle.\n\nAlready, German generals and politicians excitedly divvy up the now conquered American and remaining allies lands, jumping with joy at the chance of gaining their own fiefdom.\n\nGöring, even in his growing age, still felt great joy over such an amazing accomplishment. The United States, Germany's main rival for decades, lies utterly demolished and disintegrated, the damage so severe that even a second American revolution wouldn't make much of a dent.\n\nYet, when Göring thinks of it more, his thoughts darken. Was this how the Entente and Americans felt after the Great War? Simply just \"divvying up the spoils\" of the German and its allies empires? Millions, tens of millions of people died for god's sake! And yet, here he was, feeling happy in the same mindset. He pondered more if the roles were reversed. What if the Americans had won World War 2 instead? Would Germany have been occupied, torn apart? He shuddered at the thought, but also imagined his precious homeland being torn in 2, his people disunited. This thought made his soured mood turn to rage.\n\nOh, he'll do much more than just \"disunite\" the cursed yanks. He'll make sure the work \"American\" is a thing of the past."
 goering_peace_events.22.a:0 "It happened here."
 goering_peace_events.33.t:0 "The Conquest of Canada"
 goering_peace_events.33.d:0 "Edmonton was a fine city, and it would be a fine capital for Militärverwaltung Laurentien, or whatever it was that was left of Canada after it had been sliced to pieces. Göring certainly couldn't care less for such lands, and neither could anyone else at this point. A complete afterthought in comparison to the conquest of the United States, the last bastion of HMMLR was, all the same, even larger than its southern counterpart. That meant it had to be dealt with appropriately. And yet, for all of its size, it was still less than half as valuable as its southern counterpart. It had a fraction of the population as the US, a fraction of the industry as the US, and only a fraction of its land was actually usable, hence why so much of it had already been carved away, granted to the various other sections of German dominated North America. Really, it was such a pitiful country that it almost made the Führer feel sorry for 'Queen' Elizabeth. This was her place of exile? Her gathering ground for all 'true' sons of Britain? A worthless, frozen backwater that wore the mask of a civilised country? It was pathetic.\n\nStill, the occupation of America was already becoming even more of a headache than everyone knew it was going to be, so perhaps Canada's pathetic nature was becoming somewhat endearing; It was nice and evenly divided between English and French, and they already had a perfect puppet for the latter of the two states; Quebec was merely trading one master for another, but under the guise of independence under a man who was an open admirer of Fascism, Militärverwaltung Kübeck could take care of itself. As for the rest of the 'country,' it was sparsely populated, barren, and cold; After years of practice against the partisans of Moskowien, whatever guerrilla efforts the northerners could throw at them would be a comparative cakewalk.\n\n... Guerrilla warfare. That was the only kind of warfare left, wasn't it? With the conquest of America-and thus, the conquest of Canada as well-the Reich had run out of official enemies. There wasn't a single inch of territory on this Earth that German soldiers could not walk freely in. Anyone who dared to oppose them from now on would have to do so from internal sabotage, partisan movements, and petty banditry, rather than attritional destruction. It was a glorious thought. Let the hockey players get frostbitten in the taiga, for all he cared. For as rich in resources as Canada may have been, it was perhaps the symbolic value of seizing it that was the most valuable thing it could provide to him. Two oceans and the might of the united OFN could not save England's first colony. In claiming it for themselves, Germany had proven, once and for all..."
 goering_peace_events.33.a:0 "...That nowhere was safe."
