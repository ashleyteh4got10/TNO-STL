 GGR_burgundian_schemes:0 "Fall Schwarz Preperation"
 GGR_burgundian_schemes_desc:0 "The Burgundian spy level is [ROOT.GetBRG_silent_war_spies].\n\nOur Spy level is [ROOT.GetGER_silent_war_spies].\n\nBurgundy's alertness to our operations is currently [ROOT.GetBRG_go_hot].\n\nOur covert level is currently [ROOT.GetGGR_schwarz_covert_level].\n\nWe are currently [ROOT.Getsw_status]  the §LSilent War§.\n\nWe will be able to win the §LSilent War§! if we are able to maintain a higher Spy Level than Burgundy.\nWe must be careful not to raise Burgundy's suspicions too high or they may pre-emptively strike us!\nOur covert level determines our operatives' ability to operate in secret and keeping it high will unlock more options for our agents."
 GGR_Fall_Schwarz:0 "Fall Schwarz"
 GGR_the_silent_war_1:0 "The Silent War"
 GGR_the_silent_war_won:0 "The Silent War Won"
 GGR_the_silent_war_lost:0 "The Silent War Lost"
 GGR_the_silent_war_stalemate:0 "Silent War Stalemate"
 BRG_temporary_blindness:0 "Temporary Blindness"
 BRG_information_overload:0 "Information Overload"
 GGR_rat_traps:0 "Emptying the Rat Traps"
 GGR_rat_traps_desc:0 "The Burgundians believe that their bunkers will be their salvation. They could not be more wrong; we will let them enter their bastions and citadels, and then we will barricade the doors behind them and set the damn things on fire. They will be rats stuck in their traps, waiting to die."
 GGR_rk_alerted:0 "Alerted For Action"
 GGR_not_invaded_burgundy_tooltip:0 "We have not yet started the invasion of §YBurgundy§!\n"
 GGR_conquered_burgundy_tooltip:0 "We have succeeded in the conquest of §YBurgundy§!\n"
 GER_GOR_an_answer_to_the_call_tooltip:0 "We have sent the signal to those who might come to our aid from within §RBurgundy§!. Now we can only wait and see."
 GER_GOR_cut_the_communication_lines_tooltip:0 "§!We will break the lines of communication between Nord-Paris and her officers in the field, leaving them directionless and impotent!§!"
 GER_GOR_flatten_ost_paris_tooltip:0 "§YWe will bomb Himmler's lair into rubble until there is nothing left.\nCut off the head of the§! §Rsnake!§!"
 GER_GOR_rally_the_rks_tooltip:0 "§YIt is time to call our vassals in to do their duty against our ultimate foe!§!"
 GER_GOR_information_overload_tooltip:0 "§YJust as our jets throw up chaff to avoid missiles, so will we throw so much§! §Binformation§! §Yout into the wind that the Burgundians will have no way to know our§! §Gtrue§! §Yintentions§!"
 GER_GOR_blow_for_blow_tooltip:0 "§YThe§! §RBurgundians§! §Ycan dish it out, but can they take it?§!"
