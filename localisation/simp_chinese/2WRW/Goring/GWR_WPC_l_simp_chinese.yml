 GGR_operation_dammerung:0 "Fall Dämmerung"
 GGR_operation_dammerung_desc:0 "This is it. All of our sacrifices and years of war have led us to this moment. We are finally in a position to commence with Fall Dämmerung! Resistance fighters to this day continue to fight an unending war from the shadows as giant corporations dominate the Sphere; only interested in lining their own pockets. The Empire of the Rising Sun has fallen far since their last great victories, which gives us the opportunity to strike deep into their economic heartland; continental Asia.\n\nOur greatest challenge is establishing a land border with Japan's Sphere. We have two equally ambitious routes.\n\nThe first proposed plan is to kick down the rotten door to our east one last time and finally conquer the Rus. The terrain Siberia is inhospitable and we would need to build supporting infrastructure, but is the most direct route to Japan's holdings.\n\nAlternatively, we could surprise the world and make our approach south, through Iran and India. Though the going will be tough, to say the least, it would be completely unpredictable. Our aggression would likely catch Japan off balance, which could be decisive in the coming war.\n\nIn either scenario, we will also focus on making contact with unwilling participants in Japan's Sphere. By offering the nations chained to Japan freedom, we could gain some much needed friends and footholds in the east. With the German army at their throats, and rebels stabbing their back, Japan can not hope to hold against the might of the Reich!"
 GGR_the_southern_route:0 "The Southern Route"
 GGR_the_southern_route_desc:0 "After much deliberation, our high command has finally made its decision. The might of the German Wehrmacht will strike south!\n\nThe time to prepare for perhaps our greatest fight yet is now at hand. The army must be mobilized and moved east towards our border with Iran; slowly, so as not to alarm anyone. When the time finally comes, our army, in one fell swoop shall strike out and sweep aside all who oppose us!\n\nWe will only have one shot at this. Once the attack begins, we will commit everything towards overrunning the south and establishing our border with Japan as soon as possible in the local area. This will completely catch the world by surprise; no one will expect us to make such a daring attack, which is part of the appeal of this route.\n\nNothing can stop us. The might of the Reich is unparalleled! Endsieg is assured! Sieg Heil!"
 GGR_operation_alexander:0 "Unternehmen Alexander"
 GGR_operation_alexander_desc:0 "Operation Alexander is the name attributed to our push south to the borders of the Sphere. Like the great conqueror before us, our armies will storm south into Iran and crush any resistance in our path. Whether or not Iran joins the Pakt is of no consequence; we will march through the country one way or another. This takes us to Afghanistan, our next stop. With plenty of saturation bombing, we should be able to sweep away any resistance that would dare stand before us and blitz through the country in no time. That takes us to the gates of India, the largest challenge presented to us.\n\nHere, our panzers and mobile infantry will shine as we break out of the mountains and into the sub-continent itself. After we take several strategically important cities, their government will have no choice but to surrender. This operation MUST succeed; we can not proceed with our plans to destroy the Sphere if we can not get a direct border with the Japanese puppet states."
 GGR_clamp_down_on_arabia:0 "Clamp Down On Arabia"
 GGR_clamp_down_on_arabia_desc:0 "We have no time to waste. Saudi Arabia made its bed well before now. They once made their beds with the Italians; how can we ever trust them after that? If we offer them a place in the Pakt as equals, they are apt to stab us in the back and inform the Japanese of our plans. This will not do. We have no choice but to invade the peninsula.\n\nThe operation itself will be quick and desivie. The Arabs simply do not have the military might to stand against the vast might of the Reich! We will blitz across the peninsula and crush all who oppose us. Their oil wells will make a great addition to the Reich's conquests."
 GGR_into_the_indean_ocean:0 "Into The Indian Ocean"
 GGR_into_the_indean_ocean_desc:0 "With Saudi Arabia now under German influence, we now have access to dockyard facilities with direct access to the Indian Ocean. This is a huge strategic advantage for our forces!\n\nThe Kriegsmarine now has forward operating bases to raid the Indian Ocean with impunity. These trade links are vital to both India and Japan; being about to indirect enemy troops and their supply lines in these waters will make fighting our foes in the coming wars a much less gruelling affair. An ambitious commander could also stage amphibious landings from here, if the situation allows it."
 GGR_seperate_the_chains_of_command:0 "Separate The Chains Of Command"
 GGR_seperate_the_chains_of_command_desc:0 "Operation Alexander can not be bogged down with an ineffective chain of command. Our general staff is full of ambitious and skilled men. This leads to... disagreements, to put it mildly. Our best men all have different skill sets and approaches to combat. At this time, we can not allow any bickering within the upper echelon to impede our upcoming invasion. Therefore, we are going to split the chain of command so our top generals have total local autonomy from each other.\n\nWhile some see this as potentially catastrophic, swift victory is key to our success. The Heer will not be able to afford any lost time once the invasion starts. If anything, this will spark competitiveness between our staff, which will drive them even harder on our journey east. Giving our generals free reign will let them act to the fullest of their potential, which should see our blitz east proceed with miminual hiccups."
 GGR_iranian_military_cooperation:0 "Iranian Military Cooperation"
 GGR_iranian_military_cooperation_desc:0 "Iran's terrain is brutal. Mountain after mountain cross the war torn country, and although we are confident in victory, there could be a second, easier option available to us. Our administration still has friends in Iran, and we have cordial relations with their government. If we so choose, we could secretly begin talks with the Iranian government to negotiate their entry into the Pakt.\n\nThe benefits hardly need to be discussed. Not having to fight our way through Iran or being forced to supply and man an occupation army will allow us to use our resources and manpower where it really matters; further east."
 GGR_the_gate_to_the_subcontinent:0 "The Gate To The Subcontinent"
 GGR_the_gate_to_the_subcontinent_desc:0 "At a glance, Afghanistan is an easy country to role though. Desert tribesmen and the pitiful few \"professional\" divisions they field are no match for German valor and army. Invading Afghanistan however could take weeks, even with constant air support. Occupying such a country would prove to be yet another headache that we perhaps don't need to deal with, if we take a different approach.\n\nInstead of invading Afghanistan, rebuilding its infrastructure, then garrisoning it, we could offer them a place in the Pakt. They may be hesitant to join, but if we promise the Muslim majority providences of India in reture for their loyalty, we would be offering them a deal too good to refuse. A friendly Afghanistan would secure our roads and supply lines into India itself while saving us the effort of having to occupy a worthless mound of sand and rock."
 GGR_the_greatest_betrayal:0 "The Greatest Betrayal"
 GGR_the_greatest_betrayal_desc:0 "The invasion of India will likely be a titanic effort. The country is home to millions upon millions, and the subcontinent itself is vast. The conquest of India is an undertaking that we be the subject of legend! And rightfully so. Even still, occupying the sub-continent will be a huge undertaking, even if the initial war is won easily. Luckily for us, there is another player who may just be interested in what we have to offer...\n\nThe Azad Hind, for several decades, has sat in Bengal. Considering themselves the true heirs and liberators of India. The two's mutual hate is no secret to anyone. If we were able to convince the Azad Hind to join the Pakt and assist us with the conquest of India, we could wash our hands of having to garrison the sub-continent, leaving them to deal with occupying the country, which would save us another headache. The Azad Hind are unlikely to decline; they are desperate to act, just not able to do so. They would take help from anyone who offered it, and we're offering a deal they can't refuse..."
 GGR_flip_the_switch:0 "Flip The Switch"
 GGR_flip_the_switch_desc:0 "It is time. The Heer awaits their orders to move into Iran.\n\nThis is it. Once we launch operation Alexander, there will be no more diplomacy with the various squabbling fools in the region. We will secure the entirety of Iran, then quickly press further eastwards. Once we launch the invasion, we march until we reach Bengal or die!\n\nThis is it. There is no going back. We must secure the existence of our people and a future for Aryan children!"
 GGR_exhaust_the_supply_lines:0 "Exhaust The Supply Lines"
 GGR_exhaust_the_supply_lines_desc:0 "The amount of materials our men need is astronomical! These mountain roads are horrendous; conditions are worse than we expected, even in our worse case scenarios. We barely have enough supplies to keep our men moving forwards, let alone fight. Meanwhile, the clock is still ticking...\n\nWe can not wait to build up new infrastructure. We need to focus on pushing east. To this end, we are going to push our logistic chain to its limit. We will run food, ammo, fuel, anything and everything until we have nothing left to send. Speed is of the essence, and pushing our supply lines to the limit will give our men at the front some much needed material. Overclocking our lines is not feasible forever though. We need to hurry up and finish these wars before our logistic lines start to crack."
 GGR_frontline_emergency_reparation:0 "Emergency Reparations"
 GGR_frontline_emergency_reparation_desc:0 "Fighting is taking its toll on the already lackluster infrastructure of Central Asia and India. As a result, reinforcements are having issues making it up to the frontlines. Supplies aren't reaching our men, and our progress is beginning to slow as a result. The few rail lines that exist are in disuse and disrepair, and many bridges need urgent repairs. This is unacceptable!\n\nWe will round up any engineers we can find and deploy them throughout regions we have already secured with one task, and one task only. Fix the damn roads!"
 GGR_over_the_mountains2:0 "Over The Mountains"
 GGR_over_the_mountains2_desc:0 "The first phase of Fall Dämmerung is over; Operation Alexander has been a total success! Now that we have a land border with Japan's Sphere, we can take a breath and prepare for our next move.\n\nOur armies should prepare for the inevitable conflict with Japan. Troops will need to familiarize themselves with fighting in the jungles of Southeast Asia. Our diplomats and agents meanwhile can use this time to test the waters of the Sphere, so to speak, and to see who is really loyal to the leeches in Tokyo and who is willing to rise up against their occupiers. And as luck would have it, Japan has precious few allies left in its Sphere..."
 GGR_destabilize_the_sphere:0 "Destabilize The Sphere"
 GGR_destabilize_the_sphere_desc:0 "Japan's hold on their Sphere is shakier than we first thought. Discontent over corporate, or \"zaibatsu\" exploitation is nearly incomprehensible, they're so hated. Forced payments to Japan directly, strict military and government oversight and limitations and few prospects of economic advancement has made Japan's hold on their conquests from the Second World War fragile, to say the least.\n\nIf we extend our hands and offer the downtrodden plebs of these Asian backwaters the opportunity, many of them would jump at the chance to stab Japan in the back. All we need to do is offer some... 'incentives.''"
 GGR_allies_in_the_farthest_places:0 "Allies In The Farthest Places"
 GGR_allies_in_the_farthest_places_desc:0 "For over two decades, Indonesia has been exploited ruthlessly by the Japanese Empire. The Japanese use a heavy hand to keep partisan activity to 'acceptable' levels, and as a result the IJA has a substantial permanent garrison stationed in the region. Tensions run high, and if presented with an opportunity, even the Japanese sponsored puppet government may be swayed to turn against the Empire if given the opportunity.\n\nSending our agents to clue in the Indonesians should be a high priority. If they were to join us, a substantial portion of the Sphere's manpower could end up tied down fighting a massive insurrection."
 GGR_running_through_the_jungle:0 "Running Through The Jungle"
 GGR_running_through_the_jungle_desc:0 "Burma is the gate to China at large. It is here that our initial push will be made, and here where we could potentially have the most issue punching through. The vast peaks and dense jungles, paired with an inhospital climate makes for hellish battlefield conditions, and any fighting could potentially grind any advance we try to make to a halt.\n\nWe are fortunate, then, that we perhaps need not fight the Burmese army. New reports tell us of another displeased subject of the Japanese Empire, forced to pay into Japan's economic sphere for little to no gain. Perhaps with the right words, we could pass unimpeded through Burma's treacherous jungles."
 GGR_in_the_lion_city:0 "In The Lion City"
 GGR_in_the_lion_city_desc:0 "Once the British stronghold of Singapore, Syonan is perhaps Japan's most valuable city outside of their heartlands. Sitting at a key stragitecal junction, Syonan is the premiere naval base for the IJN in Southeast Asia.\n\nSecuring the loyalty of the local native authorities could be a massive boon for our invasion. A bottleneck in Malaya could delay Japanese reinforcements to the frontlines by weeks! Depriving the Empire of this vital region could be decisive in the coming war."
 GGR_against_all_masters:0 "Against All Masters"
 GGR_against_all_masters_desc:0 "The Abwehr has been working around the clock these last few weeks. It has taken some on the ground training, but our agents have quickly become adept at infiltrating the Sphere's various puppet and 'member' states.\n\nWorking around the Kenpeitai can be lethal work, but our agents on the field have adapted quickly. By establishing intelligence networks all throughout Asia and identifying resistance groups that would welcome our help, our agents have become much more effective at winning over rebellious nations in the Sphere. Their experience will serve us well as we continue to win over more nations to our cause against Japan."
 GGR_the_dragon_rises:0 "The Dragon Rises"
 GGR_the_dragon_rises_desc:0 "No one has suffered more from the Japanese than China. For over two brutal decades, the Chinese has had to endure Japanese occupation, taxation, government oversight, and total economic domination. And yet, the Chinese still remain unbroken.\n\nPassive resistance in the reconstruction government is still surprisingly high, even after near total oversight from the Samurai for so long. The Chinese have been biding their time and boast impressive industrial capabilities, as well as a modest army. While immediately allying them may seem like the best idea, their ideas of a \"Greater China\",like the days of their Empires, have not been forgotten. We shall have to decide between either the cliques around them or the Central Chinese government for our war against the Japanese."
 GGR_strengthen_chinese_unity:0 "Strenghten Chinese Unity"
 GGR_strengthen_chinese_unity_desc:0 "To keep the Chinese weak, the Japanese have allowed warlords to pick at the bones of rural China. To this day, all of them still have their own personal armies to encourage competition and infighting throughout the continent. All of the warlords have had to accept being a part of the Co-Prosperity Sphere, willing or not, along with the monetary payments that come with being a 'member state'.\n\nThere are a number of warlords who are hopelessly dependent on Japan, but there are an equal number that chafe under the burden that the Japanese have placed upon them. Jinsui and Guangxi, both influential and powerful warlords in their own right, have much to gain from the destruction of Japan. If we focus on sowing dissent in these regions, there is a good chance that we could convince the warlords to rise up against the Japanese Empire!"
 GGR_against_the_mad_dog:0 "Against The Mad Dog"
 GGR_against_the_mad_dog_desc:0 "The Japanese have been using warlord rivalries masterfully to keep the Chinese weak and occupied; this is a secret to no onet. Our agents in the Abwehr, ever resourceful, have found a way to use one of the local conflicts to our advantage.\n\nBy sending guns to Qinghai, one of the northern warlords with a deep seated hatred of their southern neighbor, we could potentially win them over to our anti-Japanese cause. They are like most Chinese, not thrilled to be a part of the Sphere, and could very well be tempted to fight with enough 'gifts' and promises."
 GGR_china_will_grow_larger:0 "China Will Grow Larger"
 GGR_china_will_grow_larger_desc:0 "Our newfound friends in China are an ambitious lot. Even now, they are plotting into the near future; a future out from under the Japanese boot. Normally, we wouldn't care what their plans are after our great war, but the Chinese have come to us with one condition.\n\nIf we wish to \"continue our amancial relations\" after our war with Japan, we would have to guarantee that the Chinese government would have a free hand in all current autonomous cliques. This will, however, make it all but certain that the independant cliques will be our foe in the coming war."
 GGR_freedom_for_all_peoples_of_east_asia:0 "Freedom For All The Peoples Of East Asia"
 GGR_freedom_for_all_peoples_of_east_asia_desc:0 "The lands of the many smaller Chinese Cliques are more than breathtaking; they are a deadly, partisan full near-jungle to our forces. These cliques, like many member states of the Sphere, are forced to pay into an economic system that is of no benefit to them. However, our agents in the Abwehr have discovered that these Chinese are more than willing to join our cause, with some help, in the fight to liberate Asia from the leeches in Tokyo!\n\nThere is a downside, however. Our \"friends\" in China greedily set their eyes on these cliques. Us guaranteeing their independences and allowing them all to join the Pakt will severely anger our potential ally. Relations between us and China will severely sour if we proceed, but it is well worth their displeasure for new allies!"
 GGR_from_within:0 "From Within"
 GGR_from_within_desc:0 "All of our work these last few months has led us here. For months, we have infiltrated the nations that Japan has abused, sucked dry or ignored. For months our men have trained, supplies have been stockpiled, and intricate webs of espionage weaved. The battleplans have been drawn and alliances have been negotiated. And now, it is time.\n\nIt is time for the Rising Sun to set! It is time for the Reich to achieve its destiny, once and for all! Like an unstoppable wave, we shall crash upon the entirety of Japan's so-called \"Co-Prosperity Sphere,' and they shall soon learn their fatal mistake; underestimating us.\n\nGott mit uns! Sieg! Sieg Heil!"
 GGR_the_northern_route:0 "The Northern Route"
 GGR_the_northern_route_desc:0 "Why would we invade hundreds upon hundreds of kilometers of brutal mountain ranges to get at Japan's throat when we already have a perfectly usable route to their north? There is no need to complicate our invasion by trying to make a pipe dream become reality. The northern route, though underdeveloped and currently lacking infrastructure, is a much more simple and direct route to the heart of the Japanese Empire. With a little work, Siberia can certainly be tooled to support the massive armies needed for our greatest war yet!\n\nThe Manchurian plains are the textbook definition of perfect terrain for Blitzkrieg. Once the initial mountain ranges are breached, wide open plains run straight to Beijing. With air superiority, no Japanese unit could hope to stand against the steel might of the Wehrmacht in the field!\n\nAll of our work; blood, sweat, tears, and fallen comrades, all sacrificed to get us to this point, this moment. Endsieg looms near. One more war, and the Reich shall achieve her destiny; her dominance over all those who would dare stand against us! Sieg Heil! The Führer leads us to glory!"
 GGR_through_the_steppes:0 "Through The Steppes"
 GGR_through_the_steppes_desc:0 "The infrastructure in Central Asia will be of the utmost importance for our upcoming war with Japan and its Sphere. One of our main supply routes will run throughout the entirety of MW Turkestan. To this end, our existing infrastructure will need major upgrades if this is to become a major supply route for the impending invasion.\n\nThe existing dirt roads will be the bones upon which we build new autobahns on! Rail lines shall be...there aren't any? No matter, we'll build those too!"
 GGR_into_the_mountains:0 "Into The Mountains"
 GGR_into_the_mountains_desc:0 "Our holdings in Central Asia do in fact border a sole, independent Chinese warlord state. Xinjiang is somewhat of an anomaly; only a seldom few practice independence in this part of the world. The cruel deserts and mountains have served them well; the Japanese Empire has either not bothered or not been able to bully these hardy China men into their \"Sphere.\"\n\nTheir location would serve as a fantastic staging area to launch attacks deeper into China. We shall offer Xinjiang's administration our hand in friendship. They have much to gain from a crippled Japan, and would not dare to refuse us, least they suffer the consequences."
 GGR_secure_xinjiang:0 "Secure Xinjiang"
 GGR_secure_xinjiang_desc:0 "Xinjiang's strategic value is too important to leave in the hands of a bunch of rogue desert and mountain men. We can not simply leave them to their own devices either; if the Japanese are able to get their hands on the region, it could spell disaster for our supply lines, yet we can not trust them either.\n\nOur only choice is to invade the region. The attack shall be swift and brutal. Securing this region will give us more options for our eventual invasion of Japan, and secure a vital connection to China."
 GGR_restore_mongolian_pride:0 "Restore Mongolian Pride"
 GGR_restore_mongolian_pride_desc:0 "For two decades, Mongolia has been one large battleground for fierce fighting. Russian Communists and Japanese troops continuously skirmish with each other throughout the landscape, while Mongolians are caught in the crossfire; the one Mongolian revolt crushed by fierce and decisive Japanese firepower.\n\nThis is not to say Mongolia is pacified. Thousands of nationalist hide underground, biding their time while they hoard any weapons they can find. If we were to send some of our own men to help train and arm these freedom fighters, they could prove to be a useful decoy while our armies crash upon the Japanese from Manchuria."
 GGR_block_off_mongolia:0 "Block Off Mongolia"
 GGR_block_off_mongolia_desc:0 "Our front with Japan and its Sphere is massive. We can change the face of the map, however, with some careful planning and timing.\n\nThe steppes of Mongolia are of no interest to the Reich. However, the Japanese are proud to a fault, and any insecrection would attract the attention of the IJA. While the Japanese spread themselves thin trying to hold all of their possessions, we can focus on overrunning Manchuria, which would be a huge economic blow to Japan once it falls. While the Japanese worry about maintaining the status quo in Mongolia, we'll already be halfway to Beijing!\n\nAs Frederick the Great once said, \"he who defends everything defends nothing.\"\""
 GGR_secure_the_russias:0 "Secure The Russias"
 GGR_secure_the_russias_desc:0 "Our holdings in Russia are in a sorry state, to put it mildly. Across Siberia, factories lay silent, their ruins a testament to both Germany's strength of arms and the Russian's stubbornness. Mines lay empty, their equipment stripped and stolen, while thousands of displaced people wander the vast plains. The rail lines that once crossed the great plains are totally destroyed, and even the dirt roads are in total disrepair.\n\nThe situation is abyssal. Normally, none of this would be an issue, and we would let the local administrations deal with reconstruction. With the impending war with Japan on the horizon however, we can not afford to sit and wait perhaps years for basic dirty roads to be redug. A concentrated effort towards rebuilding vital industry and infrastructure should be implemented, and the locals should be put back to work."
 GGR_partisan_suppression:0 "Partisan Suppression"
 GGR_partisan_suppression_desc:0 "For many a partisan, the war in the east has never truly ended. Hundreds of these scum hide in the vast countryside while insurgent cells multiply in the various towns and cities scattered across the plains. We can not afford resistance in our own lines when we're at war. This rot needs to be burnt out, and at once. We will intensify efforts to hunt down any Russian who would dare resist the will of the Reich."
 GGR_all_russian_military_league:0 "All Russian Military League"
 GGR_all_russian_military_league_desc:0 "Thousands of Russians idle around in the east, with nothing to do. These are bitter men with no purpose. They drink and reminisce about better days, not in any capacity furthering our goals. They harbor a lot of hate, but their hate is the perfect energy to harness for the Reich!\n\nThese dissidents chaft against our rule, and rooting out every unhappy Russian from the east will leave us with a desolate plain. Instead, we could give the Russians the eastern most portion of our conquests to set up puppet government. The east was once a hotbed for Russian Fascists, and one of those former generals, Konstantin Ageev, could manage it with our 'guidance.'"
 GGR_all_russian_military_league_tooltip:0 "§eWe must be very careful when dealing with these Russians, they may prove to be difficult to control if at all.§!"
 GGR_the_old_breed:0 "The Old Breed"
 GGR_the_old_breed_desc:0 "Locked in thousands of dark cells in Germany idile some of the Reich's most efficient, brutal killers. After the Civil War, thousands of SS men who did not fight to the death and weren't shot on sight currently waste away in cells. Their lives forfeit, the state has more or less forgotten these fanatics, content to let them rot away in prison.\n\nThe coming war will require every man we can get a hold of. Though they have sullied their nation before, we could offer them a path to redemption. We could form penal battalions made up of these men for the upcoming war with Japan. These hardened butchers could be the spearhead of our invasion, used for the most dangerous assaults, or let loose to 'pacify' local populations, as is their speciality. It would be foolish of us not to use the tools left at our disposal."
 GGR_fill_the_lines:0 "Fill The Lines"
 GGR_fill_the_lines_desc:0 "Any Russian who is deemed not a threat to the state should have the offer to join our cause against the Samurai. The benefits are much better than working in some squalid factory, and the additional manpower could very well end up being the deciding factor in us winning the war.\n\nIt is not an ideal situation; having a large amount of non-Germans fighting alongside our men, but our situation is one born out of necessity; we will need every man we can get who can hold a rifle."
 GGR_autonomy_for_service:0 "Autonomy For Service"
 GGR_autonomy_for_service_desc:0 "Even now, the Russians in our new puppet state are working hard to rebuild, and even improve factories, roads, railines, port facilities, and more. The best part is that they are doing this on their own initiative! The results have been impressive, considering what tools they have on hand.\n\nAn issue they are having, however, is organizing a standing army. With some assistance and supplies, we should be able to form a couple of new, well armed and motivated divisions that could assist us in the coming war. More men would be well worth the effort."
 GGR_manchurian_depots:0 "Manchurian Depots"
 GGR_manchurian_depots_desc:0 "Our logistic officers have identified several key junctions to set up supply depots at once our invasion is under way. The purpose is for our army to remain autonomous and on the move even in the event of our lines being cut off, however unlikely that may be.\n\nThousands upon thousands of tons of food, water, ammunition, fuel; anything and everything related to the upcoming campaign is being stockpiled for this purpose. The Führer is adamant that we leave nothing to chance; our men will fight with everything they could possibly need."
 GGR_reclaim_your_birthright:0 "Reclaim Your Birthright"
 GGR_reclaim_your_birthright_desc:0 "\"My country men! My brothers!\"\n\n\"Communists and other dissenters would have you believe that it is the German who is your enemy! They are wrong, and they are cowards! They would have you turn your rifles on our liberators, our friends! Those who cleansed the blight of Marx from these sacred lands! Those who have given us liberty in the east, and have given us new purpose! Facism spreads across Europe like blessed sunlight in the morning, but we can not idle! No friends, for us, the Russian people still have a part to play.\"\n\nTo our south, the cities of our forefathers sit occupied by degenerate Asiatic scum! The Japanese blight leeches the lifeblood of our people, those who beg to be reunited with the rightful rulers of our people shot in the streets, tortured, or enslaved. But their time is nigh! The time of reunion is fast approaching! We shall walk arm in arm with our faithful allies and return proper Russian rule to our wayward brothers! To Vladivostok! Sieg Heil!\"\""
 GGR_across_the_wastes:0 "Across The Wastes"
 GGR_across_the_wastes_desc:0 "Our final preparations are underway. Men are mobilizing across the frontiers ready for battle as our jets are loaded with munitions for the inevitable battles to come.\n\nThe mood across in the Wehrmacht is one of tense excitement. All of our work these last months is finally going to bear fruit. Our backlines are firmly secure, our supply routes well established and readied, and our army filled to capacity with eager men willing to give their lives for the glory of the Reich.\n\nWe are on the eve of our great fight yet, commander. Prepare yourself. Sieg Heil!"
 GGR_eclipse_the_rising_sun:0 "Eclipse the Rising Sun"
 GGR_eclipse_the_rising_sun_desc:0 "The time for waiting is over. Now is the time for fighting men, for warriors! The world will watch us closely, for the balance of power is about to drastically shift, permanently. The sun is about to set on the Empire of the Rising Sun, and in its place will rise the Iron Eagle of the Reich!\n\nOur panzers are itching to blitz across the Manchurian plains, and who are we to stop them? It is well time the Reich puts the Japanese in their place, once and for all.\n\nTo our German comrades, Sieg Heil! You fight for your homes, your family, and your Reich! Your people demand nothing short of Endsieg!"
 GGR_seize_the_sphere:0 "Seize the Sphere"
 GGR_seize_the_sphere_desc:0 "More than a few members of Japan's Sphere have been hesitant in assisting the Japanese. They stand by, but this will likely not be for long. Even now, the Japanese are exerting all the influence they have to marshall their subjects and get their soldiers to the front lines.\n\nWe have an excellent opportunity on our hands. If we act fast, we may be able to convince a number of these members to abandon Japan completely and join our cause, in exchange for freedom, money, weapons, or whatever else they want. "
 GGR_starve_them_out:0 "Starve them Out"
 GGR_starve_them_out_desc:0 "With Manchuko and Guangdong in our hands, Japan will be on a timer. It will be quickly apparent that without these two vital regions, the Japanese economy will grind to a halt. Without the raw materials or foodstuffs that Sphere countries on the mainland provide, Japan's war effort will simply not be able to sustain itself.\n\nOur men must hold fast! Endsieg is at hand! One last push and victory is ours! Do it for the Fatherland! For Germans everywhere! Sieg Heil!"
 GGR_burn_the_tinderboxes:0 "Burn the Tinderboxes"
 GGR_burn_the_tinderboxes_desc:0 "Our opposition is fierce, to say the least. The Japanese fight nearly as fiercely as our own men; we are paying a heavy price in blood as we make our advance. While a titanic land struggle is wagged, the Japanese home islands remain curiously untouched.\n\nIn Japan proper, the cities are kilometers upon kilometers of vast suburbs, with densely populated city centers and massive industrial parks. These buildings all have a common theme; the vast majority of the building materials used across Japan is wood. Entire homes are made out of little more than wood and paper, our intelligence tells us. This creates an environment that is especially vulnerable to strategically bombing. Their cities are literal tinderboxes, and all it would take to set them off is well placed firebombs..."
 GGR_unleash_the_SLBM:0 "Unleash the SLBM"
 GGR_unleash_the_SLBM_desc:0 "Now is not the time for restraint! We must be willing and ready to exhaust any tactics to win this war!\n\nOur U-Boats that lurk under the seas are a fearsome weapons platform. Modern U-Boats, in addition to their torpedoes, have an arsenal of ballistic missiles that specialize in hitting land based targets. The time to make use of the potent weapons is now; we shall authorize our Kriegsmarine captains to start to surface and launch their deadly payloads on important targets of opportunity across the shores of the Sphere."
 GGR_only_clouds_remain:0 "Only Clouds Remain"
 GGR_only_clouds_remain_desc:0 "Gentlemen, a moment of silence for the fallen, for without them, we would not have achieved Endsieg.\n\nObservers said we couldn't do it. The Japanese were too well entrenched in Asia, they had too many men, their positions too entrench. The Germans could never move the necessary materials that Far East. We wouldn't have the plains to control the skys, or the boats to contest the seas.\n\nAll of those fools, those naysayers were wrong! For today, the Reich stands victorious over the Japanese Empire. We have done it. The sun has set on Japan; total victory is ours. We have achieved Endsieg; Germany has humbled a country that many considered unbeatable, especially in their own backyard. This day shall go down in history as our great victory yet! Asia belongs to the Fatherland!"
 GGR_only_clouds_remain_tooltip:0 "§GSieg Heil! Sieg Heil!§!"
 GGR_germanian_cherry_blosssoms:0 "Germanian Cherry Blossoms"
 GGR_germanian_cherry_blosssoms_desc:0 "To the victors, the spoils. Japan is rich in culture and has produced a plethora of rich and beautiful pieces of art. Our Führer, ever the conoisseur, has already picked out several treasures that he would like to add to his personal collection. The pillaging of Japan shall begin in earnest. Industrial machinery, valuable metals and more shall all be brought back for the benefits of all Germans."
 GGR_repurpose_the_kenpeitai:0 "Repurpose the Kenpeitai"
 GGR_repurpose_the_kenpeitai_desc:0 "Japan is perhaps the most alien of all of our occupations yet. The culture is completely different from anything we've yet seen. There is a clear language barrier between our occupation forces and the local populations, which makes controlling the country a difficult task.\n\nWith some 'convincing,' we could use the Emperor (who is in our custody, as it so happens) to make an appeal to the Japanese military police, the Kenpeitai. These men see the Emperor's word as law; with a couple of words, we could have the entirety of that force at our beck and call, which would be a huge help in controlling the local population of Japan."
 GGR_the_korea_question:0 "The Korea Question"
 GGR_the_korea_question_desc:0 "One of the many questions that arose following our victory over the Japanese is what we should do with Korea. Korea lies in a vital area imperative for control over Asia, though we aren't the only influence who has an interest in the area.\n\nThe newly instated Japanese collaborators has respectively requested that we leave the Korean peninsula, and allow the heavily-Japanized land to stay within their borders. Generals within our administration point out that Korea is an area vital for supplying our occupation in Japan; without it, moving supplies is a more complex affair. Likewise, the Japanese retain more of their influence in the region. We simply must not allow the Orient to slip from our control"
 GGR_carve_it_up:0 "Carve it Up"
 GGR_carve_it_up_desc:0 "The German occupation of Japan has achieved its goals. We have thoroughly combed through the isles of all of its valbules. Important industrial machinery has been dismantled and sent back home, and the population has been thoroughly pacified; forced to accept our domination and total defeat. Organized resistance is almost non-existent at this point.\n\nOur mission is therefore complete. It is finally time to send our men home. In their place, we shall divide up the people, using propoganda campaigns to cause schisms in their beliefs and unity, as if they are back under a disunited Japan. The idea of rising up against us wouldnt even cross their minds."
 GGR_pacific_dominance:0 "Pacific Dominance"
 GGR_pacific_dominance_desc:0 "A new administration, the Eastern Naval Authority shall be established promptly. Similar to our Militärverwaltungs, the Authority shall be a governing body to patrol and protect our new possessions and allies in the Pacific and East Asia.\n\nThe backbone of this force shall be made up of ships we've managed to take possession of from the Japanese navy. This force shall be highly mobile to ensure the Reich has a permanent presence in our newly conquered lands. This will keep newly freed nations in the area in check as well; no one will dare act on any of our possessions or allies with a mobile army always on call."
 GGR_integrate_the_IJN:0 "Integrate the IJN"
 GGR_integrate_the_IJN_desc:0 "Even after Japan's defeat, their fleet remains massive, modern and dangerous. Japan was certainly one of the world's foremost naval powers, and even now their navy is unquestionably powerful.\n\nTheir surface fleet is exactly what we need to project power in the Pacific Ocean. We should at once send over Kriegmarine officers to take stock of our new ships, and raise crews so we can effectively man them. Adapting these new ships into our Navy's command structure will greatly increase our power on the waves."
 GGR_integrate_the_IJN_tooltip:0 "§YThe IJN may have fought against us, but it is a powerful and worthy force nevertheless. We ought to make use of what ships remain in our battles against the Americans.§!"
 GGR_japanese_bases:0 "Japanese Bases"
 GGR_japanese_bases_desc:0 "Many of Japan's dockyards and port facilities have been extensively damaged during the conflict. Many have been so thoroughly bombed that even our smaller ships have trouble docking and disembarking vital supplies. Mooring any number of warships in nearly any of our Japanese dockyards is a real headache; worse is the fact that we have nearly no capability to repair or maintain those ships.\n\nWith the Americans now eyeing our possessions in Asia, we need to concentrate on repairing our ports so we can once again project naval power from Japan. Our ships in the Pacific need the facilities to be able to independently repair and maintain their ships, especially since they are so far away from the Fatherland. Our efforts will have the added benefit of giving us the range to strike American shipping, which should keep them humble enough to leave our interests in Asia alone."
 GGR_the_eastern_naval_authority:0 "The Eastern Naval Authority"
 GGR_the_eastern_naval_authority_tooltip:0 "§YJapanese ports will make lovely bases for our fleets, able to deploy across the Pacific and our new domains across Asia towards the American enemy.§!"
 GGR_the_eastern_naval_authority_desc:0 "Führer Göring has finally come forth to the world today to announce the finalization of the Eastern Naval Authority's creation! The world shall watch in equal parts fear and awe as they grasp the extent and might of the Reich and its new conquests. Let them quake! Let them stare! German influence stretches unbroken from Japan to France, and everything in between! We have no rivals, for who even comes close to matching our might in the field?"
 GGR_break_the_unbroken_line:0 "Break the Unbroken Line"
 GGR_break_the_unbroken_line_tooltip:0 "§YThe§! §RChrysanthemum§! §Ythrone shall lie empty!§!"
 GGR_break_the_unbroken_line_desc:0 "The Japanese people still stand defiant. These proud people still passively defy our rule, even though our victory over them is total. Little head is paid to the collaboration government, and dissent against the government is high, since they see those leaders as nothing more than upstarts.\n\nIf we are going to control the Japanese people, we need to control their Emperor. Their people need to see that he is not a God; he is a simple man, and a broken one at that. We will force their Emperor to be our puppet and enforce our will in Japan. He can not refuse, for the alternative to service is death."
 goering.dammerung.1.t:0 "The Beginning of the End"
 goering.dammerung.1.desc:0 "The rally was perhaps Nuremberg's largest one yet. Not since the founding days of the party back in the 30s had such a crowd gathered in anticipation and celebration. It was hard to compare the sheer amount of people to those days though; attendance was off the charts, to Remer's pleasure. He stood in front of the podium, relishing the cheers from over a hundred-thousand of his fellow countrymen that stood in front of him, overfilling the plaza.\n\n\"My fellow Germans! My brothers! My countrymen!\" Remer began. The crowd roared back in assent; their approval shaking the ground itself. Remer stood, a large grin on his face. This, he thought, must be how Hitler felt. He scanned the massive crowd, looked upon the massive Swastika banners hanging from the buildings, then at the old man sitting to his right, with the Reich's highest ranking officers sitting around him. Göring, for his part, did look regal. His uniform neatly pressed as always, with his badges glinting in the afternoon sun. His expressiveness, however, was stoic. No emotions were expressed on his stony face. Remer knew he didn't want to be there, but what could he do? What kind of Führer would miss this occasion? The crowd's noise begin to die down.\n\n\"Today is a momentous day...\" Remer continued. \"For the Reich is about to claim what is rightfully ours! Finally, after so much time, we will finally lay low the rest of the traitors that oppose us in the old world!\" The crowd again roared their approval. Remer nodded his head in agreement.\n\n\"For too long; MUCH too long, the Japanese cowards have exploited the peoples of Asia. For decades, they work the blood of nationalist while spiting us, US! Even though, without us, there would be no Japanese Empire! The cowards have sat in their corner of the world for long enough. It is time to bring low the last of our so called friends, those that thought they could get away with using the Reich and her peoples as a means to an end!\"\n\nThe crowd went mad, and the din of so many in such a small area was deafening. Remer stepped down, motioning for Göring to take the stage. For a moment, tensions on the stage were worryingly high as the Führer glared at Remer. But, he stood up and walked to the microphone. In a booming voice,\n\n\"The time for talking is over! Now is the time for action! Sieg Heil!\""
 goering.dammerung.1.a:0 "\"Sieg Heil! Sieg Heil!\""
 goering.dammerung.2.t:0 "Divide and Rule?"
 goering.dammerung.2.desc:0 "Our current effort has managed to get a degree of influence in the Burmese government. However a better option for our interest in this area might have presented itself.\n\nThis state is full of rebels and separatist movement.\n\nThe choice is obvious:\nSupport the rebels and give up the central government. Or stay on course.\n\nThe choice is Göring's to make."
 goering.dammerung.2.a:0 "We will splinter Burma into a thousand pieces!"
 goering.dammerung.2.b:0 "We must preserve our influence in the central government."
 goering.dammerung.3.t:0 "The Art of Subversion"
 goering.dammerung.3.desc:0 "Our contacts to the Indonesia government might prove useful after all, if in a way not originally intended. By \"accidentally\" leaking our communication with Indonesia to know double agents, we can sow distrust between Japan and it's Sphere lackeys. We might even trigger a small purge. Either way our opponents won't be as united. Of course doing this would cause the Japanese to crack down on their puppets and thus end our wooing of Shonan as well."
 goering.dammerung.3.a:0 "Let's plant the seed of distrust"
 goering.dammerung.3.b:0 "No, there might still be a chance with Shonan."
 goering.dammerung.4.t:0 "Treason in the Sphere!"
 goering.dammerung.4.desc:0 "Shocking news have reached our Kenpeitai agent in Indonesia today! The German Abwehr has been secretly in contact with elements of the Indonesian military, in an attempt to influence them into supporting Göring's deranged plans.\n\nIt looks like we have to clean house in Jakarta. We must clamp down. Immediately. Army, Navy, Police all branches involved will sweep the Islands for every sign of the Reich's influence. That should hopefully shut down any further attempts by Germania to interfere in the area.\n\nFurthermore this is proof, that our worst fears might be coming true. Göring and his clique are preparing for war, despite the existence of mutually assured destruction. We can only hope it stays with undermining actions."
 goering.dammerung.4.a:0 "The clock ticks ever louder."
 goering.dammerung.5.t:0 "Tensions in Malaya?"
 goering.dammerung.5.desc:0 "Ethnic tensions between Malays and the Chinese minority have been a thing for centuries in the area now ruled by Shonan. While we are still trying to get the entire state into the Pact, this is by no means a guarantee. Hence we could instead use the influence and networks built up by the Reich's agents in a different way: Insert agents provocateurs and rile up the racial tensions to a boiling point. That should prove a useful distraction. And if Shonan refuses to join us, it shall prove a crippling tool against them."
 goering.dammerung.5.a:0 "Use our influence to light the fuse."
 goering.dammerung.5.b:0 "No, Shonan might still march alongside us."
 goering.dammerung.6.t:0 "Upgrading Subversion"
 goering.dammerung.6.desc:0 "The continuous effort of the Reich's security organizations against the despicable Co-Prosperity Sphere has gone on for quite some time. By now they have accumulated a considerable body of experience.\n\nHence we now can improve our means to gain influence even further: We can either become ever more brutal, underhanded and reckless, gaining influence quickly, but destabilising our targets in the process. Or we can increase our influence gain, by taking more long-term measures, which would of course take longer to implement. Finally we could focus on the true issue at hand: Finding allies against Japan and supporting them into capable fighters that will draw of fire against Tokyo."
 goering.dammerung.6.a:0 "Who cares about stability? We need to be effective!"
 goering.dammerung.6.b:0 "Let's take a long term view."
 goering.dammerung.6.c:0 "Our focus was and is Japan."
 goering.dammerung.7.t:0 "The Militarist and the Minister"
 goering.dammerung.7.desc:0 "Nanjing 1 AM\n\nOtto Remer slowly looked around himself as he approached the unassuming harbour warehouse. No one following, no Kenpeitai, nothing suspicious, nevertheless... \"Nöllner, you go in first, make sure it is not a trap\" One of his bodyguards nodded and went in. After a few tense moments he returned.\n\n\"Everything seems in order Herr General. They are here, including Zongwu himself.\" Remer checked his suit in one of the window reflections one last time and then motioned his entourage to follow him. What looked like just any other warehouse had been quickly remodeled: Fancy chairs and a heavy conference table had replaced cargo holds, drinks and glasses were accurately distributed, expensive carpets and handmade lamps rounded off the picture. The Chinese had certainly tried to make the place presentable.\n\nAnd there in the middle stood the man he was here for, Gao Zongwu, president of the Chinese republic. A firm handshake later and Remer could finally start, what he had been here for: Get the Chinese to fight Japan, so German blood wouldn't have to be spilled. He didn't put it that way of course, but the other side wasn't stupid. They knew Göring, Schörner and company wanted pawns not allies.\n\nStill the meeting went somewhat pragmatic, but everyone knew and could almost feel the other's revulsion. But that didn't matter. For now all that was important was dealing with Japan. That was the only thing that mattered."
 goering.dammerung.7.a:0 "Wartime makes for strange bedfellows."
 goering.dammerung.8.t:0 "Tibet Joins the Einheitspakt!"
 goering.dammerung.8.desc:0 "Despite Chinese interference, very pleasing news have been coming out of our contact with Lhasa recently. The Chinese will have to swallow their pride over this one, but Lhasa is at last requesting to join the Einheitspakt for good. And who are we to deny them? Welcome \"friends\""
 goering.dammerung.8.a:0 "From Lhasa to Limburg, the pact stands strong."
 goering.dammerung.9.t:0 "Tibet Joins the Sphere!"
 goering.dammerung.9.desc:0 "It looks like our recent actions have spooked the Tibetans a bit too much. Today the Abwehr and the foreign ministry got hold of a soon to be made official text about Lhasa becoming a member of the Co-Prosperity Sphere. It seems like the highest mountains in the world will become just another frontline in our plans against Japan now."
 goering.dammerung.9.a:0 "The Himalayas can't stop German steel."
 goering.dammerung.10.t:0 "Manchurian Depot Activated"
 goering.dammerung.10.desc:0 "The logistical dumps in Manchuria are starting to pay of. As the challenge of keeping up the war effort over such distances is significant, the stockpile in this area is ensuring our forces in the field get back supply just that much more."
 goering.dammerung.10.a:0 "A thousand miles from home, but always in good supply"
 goering.dammerung.12.t:0 "The Ageev Regime Defects!"
 goering.dammerung.12.desc:0 "Our invasion of the Co-Prosperity Sphere has run into trouble up in Siberia. The collaborator state led by Konstantine Ageev we created in the buildup to the invasion has defected wholesale to the enemy. Even worse they are already engaged in multiple attacks on Wehrmacht personnel. Looks like we will have one more enemy to fight. That fool Ageev will curse the day that he defied us."
 goering.dammerung.12.a:0 "Should we really be surprised?"
 goering.dammerung.14.t:0 "Tensions with Japan Boil Over!"
 goering.dammerung.14.desc:0 "The reports are sporadic, but the unthinkable is happening. Japan is invading. Captain Krull and his 3-man crew read the report reaching their patrol boat on the Amur over and over again. But it refused to change.\n\n\"This is really happening isn't it? This is it, it's over.\" this was Kohlner, the youngest of them. A harsher officer would have reprimanded him for uttering the words. But Krull knew that the boy had been through much at only 16 years.\n\n\"Yeah, this was only a matter of time. Skirmishes everywhere, a tension you can almost cut. Really, with the fat man this was only a matter of time\" This was Bellner a German-Hungarian, who had only recently been 'volunteered' into the Wehrmacht. \"Istvaan...\" Krull said warningly, but softly. \"I might let you get away with this, but other offi...\"\n\nHe couldn't finish the sentence as a sudden impact shook the boat. Instantly the men hit the floor.\n\n\"Shit! Jap Artillery, we have to get ou...!\"\n\nA second hit, a flash, a searing pain and the boat and crew were gone. Not the only casualty that day. The German-Japanese conflict has begun."
 goering.dammerung.14.a:0 "Midnight draws closer..."
 goering.dammerung.15.t:0 "Operation Alexander Warns the Sphere"
 goering.dammerung.15.desc:0 "Unfortunately our march through the Middle East hasn't been quite as quick as we had first hoped for. While progress is still being made, our delayed advance has given Japan and it's sphere lackeys time to prepare for the inevitable. It won't change the end result of course, for the might of the Reich is unstoppable, but the resistance we can expect once we reach the sphere will be much bigger."
 goering.dammerung.15.a:0 "Dealing with Japan won't become easier..."
 goering.dammerung.16.t:0 "The Siberian Secession"
 goering.dammerung.16.d:0 "Every day, Germany creeps closer to our borders. Once the entirety of Asia separated us from the Reich's Eastern Front, now Mongolian border patrols regularly encounter their Russian counterparts enforcing the boundaries of the All Russian Military League, the Reich's stalking horse in Siberia. The constant conquests of the Reich will inevitably reach the Co-Prosperity Sphere in a matter of months, and Russia will be the front line.\n\nThe Russians however are no more eager to take part in this conquest than we are to attempt to repel it. Whilst the All Russian Military League is nominally a collaborationist state, control over this vast area is weak and true collaborators are few and far between given Germany's reputation. The Reich considers them little more than cannon fodder at best and unworthy of life at worst. Messages have travelled across the steppe, carried by Russian and Mongolian horsemen, that suggest the League would be much happier working with Japan than Germany.\n\nTo steal Russia from under the Reich's nose would no doubt be considered an act of war, but war is all but inevitable. With Russian aid the front line would be much further from our own border, slowing the Reich's relentless advance and hopefully bogging them down in the Russian Hell once more."
 goering.dammerung.16.a:0 "Roshia Banzai!"
 goering.dammerung.16.b:0 "Send no reply."
 goering.dammerung.17.t:0 "No More Russian Heimat"
 goering.dammerung.17.d:0 "We were never stupid enough to trust the Russians but we at least hoped they would remain cowed under our rule. It was not to be, however - word has reached us of efforts by the All Russian Military League to contact the Japanese government through their shared border in Mongolia. Naturally they are forbidden from all foreign communication, so this can only be an attempt to curry favour and secede to the Co-Prosperity Sphere.\n\nNo Japanese reply was recorded - evidently the Asiatics are smart enough to see the foolishness of stealing from the Reich. Nonetheless, this treason demands punishment. These Russians really never learn."
 goering.dammerung.17.a:0 "Ready the tanks, we're going East once more."
 goering.dammerung.18.t:0 "The Setting Sun"
 goering.dammerung.18.desc:0 "Fire.\n\nThe first thing you see when you enter Tokyo is Fire.\n\nOnly a few days ago the city was one of the most prosperous metropolises in the world. And in the final days before the capture all the Japanese people living there had to worry about was the distant threat of the encroaching German soldiers. Göring took out another Cigarette as he approached the center of the city. He regretted not coming to the place before the invasion, it looked like it used to be Beautiful.\nBut that was before the Great Eastern War, one that made both Weltkriegs tiny in comparison.\nGöring's men had triumphed, but at what cost? One of the leading nations in Culture and technology, now a smoking ruin of a state.\n\nAs the Führer continued walking, he could hear cries of begging and desperate men, before gunshots and silence. The Japanese spirit to continue fighting until the end has not worked in their favor, considering the stench coming from shallow holes around the street.\nWhat has the world come to, that centers of Humanity's greatest achievements now are just glorified mass graves? All of this Göring thought as he walked through the streets with his best men. But these doubts were already disappearing. He needed to organize the entirety of Asia under German rule, and that doesn't happen in a day.\n\nAnd so, the thoughts of the death of Asian freedom went to the back of his mind, just like all the other conquests.\n\nThere wasn't time for regret, there was work to be done."
 goering.dammerung.18.a:0 "The empire that threatened the sun in power is now as dark as the Moon."
 WORLD_REICH.302.t: "[Get_newspaper_header]The Great Eastern War"
 WORLD_REICH.302.desc: "After years of the German war machine crashing over Western and Central Asia, the Reich's final target has been reached. Today, perhaps the final war in history has broken out - the Japanese Empire and the German Reich are officially at war. As this goes to press, hundreds of thousands of soldiers cross the border into Sphere territory, their final destination being Tokyo. Before them stands the Imperial Japanese Army, ready to give their life for their homeland.\n\nWith both Germany and Japan maintaining some of the largest nuclear stockpiles on Earth, a direct war between the two is almost guaranteed to lead to a nuclear exchange. As the mountains and rivers of Asia are stained red with blood, the skies over the Sphere are tattered with smoke and fighter jets, and elements of the Kriegsmarine and IJN clash in the waters of the Pacific, the question becomes: how long will it take for one side to press the button, and how many will be left to see the consequences?\n"
 WORLD_REICH.302.a: "Bring the samurai to heel!"
 WORLD_REICH.302.b: "Let them come and face their deaths!"
 WORLD_REICH.302.c: "They're going to get us all killed!"
 WORLD_REICH.302.d: "The war in Heaven has begun!"
 goering_peace_events.21.t:0 "The Conquest of Japan"
 goering_peace_events.21.d:0 "Cherry blossoms slowly fall all across Japan, as smoke and ash permeate the air. The nation is in complete ruins after a devastating campaign in the Home-Isles, with starvation, lack of housing, and a general humanitarian crisis in every nook and cranny. The one mighty Empire has completely fallen, but fallen to the German army. The Imperial Flag is taken down from Tokyo, and the Swastika rises over the land just like its sun.\n\nThe Japanese Empire, in all of its imperial glory, has fallen, a giant german boot pressed firmly against the emperor's bloodied face.\n\nAlready works have begun to prepare it for permanent occupation, and to forever secure German dominance in the Orient and Asia Proper. The former Japanese sphere, having stretched over countless nations, oceans, lands and people, is now being brutally divied up between the German high command, caring little about the people's welfare.\nGöring has been very vocal on making sure that Japan remains isolated and weak from this war, by demanding that only the main Japanese island stay under a united Japanese government, even if that is a military occupation. The islanders can starve for all Göring cares, as he never wants to risk a Japanese rebellion from stirring. The rest of the Japanese islands are planned to be given to a Naval Authority, to deal with the very large Japanese fleet.\n\nThe world is already reeling from such a massive event, as even now economies from the last remaining free nations of the world are reeling and collapsing from such an economic powerhouse being dismantled so brutally.\n\nWhile cherry blossoms may continue to fall all over japan, they all will touch down, burnt and decaying, as if in unison with the spirit of Japan."
 goering_peace_events.21.a:0 "And to the victor - the spoils."
 GGR_crack_the_sphere_category:0 "Crack the Sphere"
 GGR_crack_the_sphere_category_desc:0 "Fall Dämmerung continues apace and our plan to destory the Japanese Empire and its Sphere both in whole and in part shall commence. We shall work to subvert Japan's influence over its puppets and replace their loyalty to the Emperor with loyalty to the Führer.\n\n§GThe Japanese Empire§! [ROOT.GetGGR_japan_tension]\n§GThe Philippines§! [PHI.GetGGR_sphere_influence]\n§GIndonesia§! [INS.GetGGR_sphere_influence]\n§GBurma§! [BUR.GetGGR_sphere_influence]\n§GThailand§! [THA.GetGGR_sphere_influence]\n§GCambodia§! [CAM.GetGGR_sphere_influence]\n§GLaos§! [LAO.GetGGR_sphere_influence]\n§GVietnam§! [VIN.GetGGR_sphere_influence]\n§GMadagascar§! [MAD.GetGGR_sphere_influence]\n§GMalaya§! [SHO.GetGGR_sphere_influence]\n§GAzad Hind§! [AZH.GetGGR_sphere_influence]\n[ROOT.GetGGR_warlord_influence]"
