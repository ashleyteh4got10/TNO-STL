 GGR_operation_tannenbaum:0 "Unternehmen Tannenbaum"
 GGR_operation_tannenbaum_desc:0 "One of the first of the Führer's great invasion plans was to crack the nut of Switzerland. Those capitalist pigs in their mountains have sat on their mountains of gold, twisting and turning the world's economy like the greedy Jews they are. Our nation has been one they have targeted especially, stealing our gold and squeezing our economy. By destroying these snakes and rats, we will free the immense hoards of gold and, in doing so, give our economy a boost not seen since the Second World War!\n\nSure, they have been expecting us to attack them for decades. Sure, they have built a fortification line (with our hard earned money) that puts the old Maginot Line to shame. Sure, they have some of the best training on Earth. What does it matter? We are the Greater German Reich, damn it, and we will conquer and slaughter our way through the heights! Our racial and ideological supremacy will prove itself again, and we will set the fat bankers and decadent citizens alight with the fire of National Socialism!"
 GGR_phase_one_planning:0 "Phase One: Planning"
 GGR_phase_one_planning_desc:0 "As much as we wish to break the neck of the greedy bankers in the mountains, the fact remains that they have been preparing for an attack for decades. We must first plan to shatter their defenses before we can get to looting and burning the Swiss. Knowledge is half the battle, and knowing how to crush these fools is the best way to maximise profits and minimize German blood. After all, we'll need that blood for later campaigns. Of course, if we must attack soon, we can skip one or two of these precautions. Or, Mein Führer, we can always simply move on if you truly are anxious..."
 GGR_dust_off_the_bookshelfs:0 "Dust off the Bookshelfs"
 GGR_dust_off_the_bookshelfs_desc:0 "During our destruction of the allies many years ago, multiple plans to destroy the Swiss were drawn up, each with their own ideas, plans, and movements. Of course, we were never able to complete these plans as more urgent matters came up, and the plans were shelved in long ignored offices. It is time to reopen these plans, pick and choose the best ideas, and combine them into one glorious file for Tannenbaum."
 GGR_mountain_combat_training:0 "Mountain Combat Training"
 GGR_mountain_combat_training_desc:0 "Most of Switzerland is mountains. Most of Switzerland's defenses are in said mountains. Obviously, our men must be trained in the ways of high altitude combat, mountain scaling, and other ways to use the Alps to their advantage. The Swiss will not expect our men to be able to fight them on equal terms in the mountains, and we can use that to our advantage. It will be a tough fight to get through the Swiss, but with training and skill, victory is inevitable."
 GGR_aerial_recognition:0 "Aerial Recognition"
 GGR_aerial_recognition_desc:0 "At such high altitudes, the easiest way to perform effective reconnaissance is by air. Both we and the Swiss know this, and as such they have taken efforts to camouflage their emplacements to trick the untrained eye. How very typical of the cowards. By training our bombardiers and other scouts to recognize Swiss emplacements and guns, and showing them how to spot even the most hidden position, we will never be surprised by a bunker or machine gun again."
 GGR_centralized_military_hospitals:0 "Centralized Military Hospitals"
 GGR_centralized_military_hospitals_desc:0 "Due to the mountainous terrain of the Swiss Alps, much of our current hospital infrastructure is unsuitable to be deployed on the front lines. In order to better suit our forces, we must develop and deploy more efficient hospitals to deal with the condensed Swiss front."
 GGR_phase_two_invasion:0 "Phase Two: Invasion"
 GGR_phase_two_invasion_desc:0 "Like dragons, the Swiss bankers have sat in their mountains, hoarding their wealth and attacking any who dares to approach their territory. For years, they have swindled the people of Germany, tricking them into adding to their pile of gold before twisting them for all the money they have. According to our Führer, the pigs have been meddling with the German economy, directly causing the crash of the 50's.\n\nBut as in all stories about dragons, one day a knight in shining armor will come to the dragon's lair. Though the dragon may breathe fire and roar, inevitably the good knight slays the beast and takes the wealth. We are the knight, and we will defeat the dragon and take the wealth with steel, lead, and fire of our own. It is time to end the dragon once and for all. To war!"
 GGR_the_meat_grinder:0 "The Meat Grinder"
 GGR_the_meat_grinder_desc:0 "The Swiss defenses are heavier than previously thought. Much heavier. Even the most dire expectations of bunkers, trenches, mines, and all the other trappings of war seem like jokes in comparison to the wall of lead that seems to lock us out of Switzerland. Führer Göring, after sending his intelligence team to the nearest prison, has issued an order to conscript more men to replace our numerous losses. Lord knows we need it."
 GGR_underground_infiltration:0 "Exploit The Schwerpunkt"
 GGR_underground_infiltration_desc:0 "The Swiss, in preparation for our attack, have built one of the most comprehensive defensive lines on our border. Tank traps, trenches, and bunkers cover the landscape. These defenses, no doubt funded with the German gold they have stolen from us, are some of the best in the world. Attacking them head on in a front wide offensive only ends in slaughter.\n\nInstead, we will reuse the strategy used to annihilate the Poles and French in the Second World War. The Schwerpunkt will especially be used, as a massed charge of tanks at a vulnerable point in the line may be all it takes to shatter the line entirely. Once through, we will wreak havoc behind the Swiss lines, confusing their defense and pushing through any remnants with ease. It's simple, really."
 GGR_chop_off_the_head:0 "Chop off the Head"
 GGR_chop_off_the_head_desc:0 "As long as the Swiss army has leaders and generals, our plan to completely confuse them will never bear full fruit. With these men, they will be able to resist our attacks even after we break through. Therefore, we will use what intel we can get to kill as many leaders of their armed forces as we can. The instant a glimmer of a location is revealed, at least 10 bombers will obliterate that position. We will win!"
 GGR_no_rest:0 "No Rest"
 GGR_no_rest_desc:0 "We cannot let the Swiss regroup once we make our breakthrough, or we will simply be bogged down in another line of bunkers and guns. We must constantly attack, constantly bomb, constantly raise hell behind their lines if we wish for this war to come to a swift conclusion. These strategies should keep them confused and on the run enough for us to stomp any residual resistance."
 GGR_phase_three_breaktrough:0 "Phase Three: Breakthrough"
 GGR_phase_three_breaktrough_desc:0 "We've done it! The tanks are through, and we now have the opportunity to crack the Swiss nut and take the riches within. It is now a matter of getting as far as we can with what we have, shattering morale and not letting those god damn Swiss get into another defensive line. If we push hard and fast, we may be able to win this war soon!\n\nWe must be sure to move as fast as possible, seizing as much as we can, before the perfidious Swiss get to evacuating the cash or setting up even more defenses. The situation at home gets uglier with each day that passes with nothing but pine coffin after pine coffin as the news for the people. If we do not win soon, we may have to deal with some serious consequences. "
 GGR_one_last_push:0 "One Last Push"
 GGR_one_last_push_desc:0 "The men grow closer to the end of the war with each mile of land seized, yet the fatigue of the near constant attack and the collapse of morale with every one of the many setbacks threatens to force us to stop our push and let the enemy regroup! We must find a way to keep the men in order and pushing forth, lest we settle back into the stalemate that has plagued us."
 GGR_punish_stragglers:0 "Punish Stragglers"
 GGR_punish_stragglers_desc:0 "As we push deeper and deeper into the Swiss Alps, we occasionally capture prisoners while they retreat to the next bunker line. These prisoners, while possibly being a good source of intelligence on Swiss positions, have near unanimously refused to talk to us, defending those bankers and businessmen who oppress them. The blinded fools are beyond salvation. Instead of using them as intelligence, we will use them as morale boosts. Public executions, crowd punishments, forced confessions-whatever it takes, we will do it. These men have sown the wind with bullets and shells, and now they will reap the whirlwind of the Wehrmacht's fury."
 GGR_study_the_remains:0 "Study the Remains"
 GGR_study_the_remains_desc:0 "As we move through the fortifications the Swiss have set up, one must recognize how stubborn and resilient these positions have been. They have mowed our men down, have withstood both bombs and shells, and inflict tremendous casualties on our armor. It is clearly worth our time to study what is left of their structures. They have been doing a number on us for a reason, and recognizing what we must improve in order to effectively destroy any defenses left in the remaining territory the Swiss have. Even if no intel can be gained on the remaining Swiss positions, we can always co-opt the plans and designs for these fortifications, if we ever need them in the future."
 GGR_cameras_on_the_front:0 "Cameras on the Front"
 GGR_cameras_on_the_front_desc:0 "As we continue to smash the Swiss Menace, some Babelsburg filmmakers have proposed creating numerous propaganda films of our brave men crushing the Swiss pigs underneath their boots. With such picturesque mountains and so many ruined bunkers, who could resist? Göring has authorized this, and already many film crews have deployed to the front to get good pictures of our boys in action against the capitalist bastards. With luck, skill, and good shots, these films will distract people from thinking about the amount of coffins that keep coming home."
 GGR_phase_four_cleanup:0 "Phase Four: Cleanup"
 GGR_phase_four_cleanup_desc:0 "Finally, it is over. The dragon lies dead at our feet, and its hoard is open for the taking. Though the blood of Germany's sons runs through the passes and rivers, it is more than made up for in both gold and prestige. Already, the economy has seen a rise, and the people of Germany celebrate that their foe is vanquished.\n\nIt is now time to clean up the remnants of resistance while scrounging up any coin we can find. After all, that was the main purpose of the attack, and it would be quite the waste to lose some."
 GGR_recognizing_danger:0 "Recognizing Danger"
 GGR_recognizing_danger_desc:0 "The cowardly, treacherous Swiss are doing what they have always done to proud sons of Germany. Though they greet soldiers with smiles and greetings, behind our backs they pass around rifles and ammunition, readying to strike against our glorious rule. Some things never change, it seems.\n\nWe must train our soldiers to recognize these masks of friendliness. They will know to look for the forced smiles, the glassy eyes, the nervous tics. There will be no hiding, and there will be no surprises. We will control Switzerland, whether they like it or not."
 GGR_integration:0 "Integration"
 GGR_integration_desc:0 "The Swiss, disgusting traitors as they are, are still ethnically Germans, and therefore some of them are Aryan. These men were not inherently treasonous to the Reich, they have simply been misled by their leaders who hoped to destroy our revolution. Instead of treating them as we would treat the standard Untermensch, we will give them special status. Perhaps if they work for the Führer long and hard enough, we will formally appoint them Aryans."
 GGR_occupation:0 "Occupation"
 GGR_occupation_desc:0 "There can be no integration for these disgusting worms and rats. Though they call themselves \"Germans\", their desperate and bloody resistance to our invasion and their years of destroying our economy and squeezing our people for all they were worth shows that these rats are not true Aryans. Instead of integration, we will send Schörner and his typically brutal ways down there to deal with any resistance and extract vengeance for the war. For every dead son of Germany, there will be 10 dead Swiss. For every ounce of resistance, there will be a kilogram of pain. We will crush them thoroughly into the dirt, destroy their hope, and make them an example. The world will know what the punishment is for resisting the Reich!"
 GGR_the_southward_military_migration:0 "The Southward Military Migration"
 GGR_the_southward_military_migration_desc:0 "If there's one thing the Swiss were good at, it was bunkering down. These fortifications rival even the heaviest part of our border with Burgundy, and their effectiveness was proven in the blood of German men. Simply letting these rot would be a shameful waste when, instead of using the gold we have acquired to build more forts, we could simply move whatever salvageable parts of the bunkers that are left to the Italian border and bolster defenses there! By using trucks, cranes, and Swiss labor, we can change those bunkers from useless concrete bricks to the strongest fortification line in all of Europe!"
 goering.tannenbaum.1.t:0 "Sabotage In The Alps"
 goering.tannenbaum.1.desc:0 "An interesting plan has been proposed to the Führer. As we push into Switzerland, they will continue to retreat to new lines of forts, deeper in the alps; if we do not prevent this, then we will face fierce resistance for every metre of ground we gain, something we cannot afford.\n\nNear the Swiss-Burgundian Border lies a small complex of fortifications. We have yet to reach them, but they are strong enough that they will pose a threat once fully manned. Currently however, they are vulnerable, with most Swiss forces on the front lines. The newly proposed plan would have us sabotage these forts, rendering them useless before the Swiss have a chance to cower inside them.\n\nA small debate has emerged over how we should sabotage the forts. The Wehrmacht wants to use their special forces in a land operation, as has been done before, but the Luftwaffe are pushing for the use of their paratrooper divisions in an aerial manoeuvre. Both would likely be effective, but it is up to us to decide which forces we should utilise."
 goering.tannenbaum.1.a:0 "A ground operation."
 goering.tannenbaum.1.b:0 "Lets try again."
 goering.tannenbaum.2.t:0 "Sabotage Successful!"
 goering.tannenbaum.2.desc:0 "It seems we picked the right force for the job after all. An elite team of ground forces successfully infiltrated and subsequently destroyed key parts of the Swiss fort complex near the Burgundy border, rendering the fortifications useless. Our forces were able to exfiltrate, and the administration if very impressed with the performance of the Wehrmacht's special operation team.\n\nNow we will advance in the western Swiss theatre, as the Swiss are without concrete walls to hide behind. Our Panzers will roll over their makeshift defences, hastily constructed in a futile attempt at resistance. Let them cower in fear as Germany takes back its rightful territory!"
 goering.tannenbaum.2.a:0 "Onwards!"
 goering.tannenbaum.3.t:0 "Sabotage Fails!"
 goering.tannenbaum.3.desc:0 "The Wehrmacht has embarrassed itself. What should have been a simple infiltration operation has been botched by their incompetent ground team, who were caught by Swiss forces and subsequently revealed our plans to destroy the fort complex.\n\nThe operation's failure has left the Swiss far more prepared for our eventual assault on the areas near the Burgundy border, and they will be better prepared to hide from our forces like cowards, striking our brave soldiers down from behind concrete walls. The administration is highly disappointed in the Wehrmacht's special forces, once considered a proud symbol of German combat techniques."
 goering.tannenbaum.3.a:0 "An embarrassment."
 goering.tannenbaum.4.t:0 "Sabotage Successful!"
 goering.tannenbaum.4.desc:0 "It seems we picked the right force for the job after all. An elite team of paratroopers were successfully deployed and subsequently destroyed key parts of the Swiss fort complex near the Burgundy border, rendering the fortifications useless. Our forces were able to exfiltrate, and the administration if very impressed with the performance of the Luftwaffe's special operation team.\n\nNow we will advance in the western Swiss theatre, as the Swiss are without concrete walls to hide behind. Our Panzers will roll over their makeshift defences, hastily constructed in a futile attempt at resistance. Let them cower in fear as Germany takes back its rightful territory!"
 goering.tannenbaum.4.a:0 "Onwards!"
 goering.tannenbaum.5.t:0 "Sabotage Fails!"
 goering.tannenbaum.5.desc:0 "The Luftwaffe has embarrassed itself. What should have been a simple paratrooper operation has been botched by their incompetence, as the paratroopers were caught by Swiss forces soon after landing and subsequently revealed our plans to destroy the fort complex.\n\nThe operation's failure has left the Swiss far more prepared for our eventual assault on the areas near the Burgundy border, and they will be better prepared to hide from our forces like cowards, striking our brave soldiers down from behind concrete walls. The administration is highly disappointed in the Luftwaffe's paratroopers, once considered a proud symbol of the nation's aerial prowess."
 goering.tannenbaum.5.a:0 "An embarrassment."
 goering.tannenbaum.6.t:0 "Swiss Capital Bombed"
 goering.tannenbaum.6.desc:0 "After days of anxiously awaiting intel reports regarding the locations of the Swiss leadership, the Oberkommando der Luftwaffe finally received a call on the busy phone lines informing them of the locations of multiple high-ranking Swiss leadership officials and staff, including the Swiss president himself. Loaded with a combination of bunker-busters alongside high-explosive and incendiary bombs after being on standby for the past two weeks, Kamfgeschwader 1 was immediately dispatched to hit their primary and secondary targets within the capital city of Bern. The total annihilation of the Swiss leadership, the burning out of this nest of rats, this infestation, was now in motion. Tonight, their den burns in a cleansing inferno.\n\nAround a half-hour after their dispatch, reports of the destruction flooded in. The Swiss Federal Palace now lies in ruins with fires engulfing it along with vast amounts of the surrounding area with the flames spreading throughout Bern uncontrollably, destroying valuable infrastructure and damaging Swiss industry in the process. Later reports confirmed the safety of the Swiss President along with other High-Ranking Swiss Officials. While the rats may have escaped to a new hole to continue their futile resistance this time, their prized nest has been expunged and it will be seen that they too will be inevitably expunged alongside it later."
 goering.tannenbaum.6.a:0 "They can only hide for so long..."
 goering.tannenbaum.7.t:0 "The P.O.W. Question"
 goering.tannenbaum.7.desc:0 "As our forces further penetrated the Swiss lines, the Oberkommando der Wehrmacht has been expressing concerns over the ever increasing number of Swiss prisoners of war that have been ratted out of their forts and forced to surrender. In our intelligence reports, it appears that Swiss POWs have been nearly unanimously useless to the war effort with most of them refusing to give any form of information besides their name, rank, and serial number. The lack of utility and useful information coming from these Swiss Schweinhund has greatly frustrated many officers within the General Staff who do not want to waste space in POW camps for those who refuse to be of any use.\n\nTwo proposals, however, have been found to be quite popular among the Oberkommando. The first option would be to force the Swiss POWs to assist us in our war effort against their homeland by dispersing and enrolling them at our various slave labor camps. The second option would be to make an example out of these rats by giving them what they rightfully deserve for defying the fatherland to defend their bankers and fattened businessmen, death. Public executions of Swiss POWs will not only demoralize the Swiss people but will also show what happens to those who refuse to cooperate with the Reich."
 goering.tannenbaum.7.a:0 "Send them to the labor camps."
 goering.tannenbaum.7.b:0 "Break their will, exterminate the rats!"
 goering.tannenbaum.8.t:0 "Support for the War Plummets"
 goering.tannenbaum.8.desc:0 "The German volk have grown restless over the war in Switzerland. After the Führer's many remarks to the public about the Swiss war being one that will be swift and painless, a demonstration of Germany's greatness to the world, it has shown to be but an embarrassment. The Swiss meat grinder has taken far too many German lives than what should have been necessary and only now have the people caught wind of how terribly the war is going. With many soldiers now turning to desertion rather than face the constant artillery bombardments and engage in what seem to be suicidal assaults on Swiss fortresses, a majority of officers and military police have found it much more difficult to keep their troops in line. Something has gone terribly wrong in this war, something many have just now come to realize. The Oberkommando der Wehrmacht have expressed great concern over how truly sustainable this war is and are demanding that this conflict ends sooner rather than later, a sentiment also seen throughout the general public. At this point, any plan to truly and swiftly end this war is considered a good plan."
 goering.tannenbaum.8.a:0 "Dammit! Why won't these bastards break?"
 goering.tannenbaum.9.t:0 "The Swiss Guerilla War Ends"
 goering.tannenbaum.9.desc:0 "After many skirmishes, raids, and acts of sabotage, it appears that the Swiss Army's guerilla campaign across their former homeland has come to a close. German soldiers walking down the street without being fired upon, supply trucks refurbishing garrisons not being blown sky high, and a lack of assassinations of anybody above the rank of unteroffizier – this has been one of the calmest weeks ever seen in the new German territory. This of course did not occur by random chance.\n\nMany are declaring this apparent end of the Swiss guerilla war a success. Many in the Oberkommando say that it was their anti-guerilla training and adaptation that led to the end of the guerillas while many in the local administration over the new Swiss territories thank the efforts of welcoming and accepting the Swiss into the Reich through integration as the main cause. Either way, one thing is certain, peace may now finally dawn on Switzerland."
 goering.tannenbaum.9.a:0 "Another victory for the Reich!"
 goering.tannenbaum.10.t:0 "Schörner's Anti-Guerilla Campaign Succeeds"
 goering.tannenbaum.10.desc:0 "After being tasked with bringing an end to the Swiss guerilla war, Schörner swiftly and effectively completed his objectives, bringing further prominence to his already highly-acclaimed military record. Public executions, burning down buildings, torturing prisoners – no methods are considered too ruthless when the security of the Reich and its Volk are at stake. While certainly these tactics have shocked many Swiss and have furthered disdain for their new leaders, it has unquestionably stopped the Swiss guerillas dead in their tracks most literally.\n\nWith what appears to be the end of the Swiss guerilla war, resources may now be focused elsewhere to further project the interests of the Reich. The campaign in Switzerland has now truly come to an end as another victory for the Reich has now been cemented upon the pages of history. The eyes of Germania may now look elsewhere."
 goering.tannenbaum.10.a:0 "Traitors are shot, rats are exterminated."
 goering.tannenbaum.11.t:0 "Ostschweiz Pacified"
 goering.tannenbaum.11.desc:0 "After tying up resources and manpower for far too long, the Oberkommando has received reports from the local garrisons and police forces in Ostschweiz, home to a large population of Germans, that talk of the great success regarding the pacification efforts in their areas. Many industrialists and top military officials have been ecstatic about the wide range of potential opened up as a result of this great triumph. Many businessmen have noted the higher willingness of the Swiss in the eastern regions to work with the German businesses and investors that are moving in following the territorial acquisition. At the same time, recruitment numbers in Ostschweiz have hit record highs with reports noting some glimmer of enthusiasm for the new government.\n\nAlthough it may be but one region in Switzerland, this is a major breakthrough in the great effort to integrate the Swiss into the glorious Reich. There is still much work ahead for the further pacification of Switzerland, so let this be an encouraging glimpse of what can be hoped to be a newer, brighter future for the Reich's territories."
 goering.tannenbaum.11.a:0 "Welcome to the Reich!"
 goering.tannenbaum.12.t:0 "Central Switzerland Pacified"
 goering.tannenbaum.12.desc:0 "More exciting news has just been reported to the Oberkommando – the pacification programs in the central Switzerland have finally been declared successful by the local authorities administering the effort. As German businesses and military recruiters flock to the new territories, they are most pleased to be witnessing the success seen in the efforts to soothe tensions between the Reich and its new Swiss citizens. This milestone shows that even the heart of what once was a nest of venomous, rabidly anti-German dogs can transform under the guidance of the Reich.\n\nAs expected, the Reich can expect an influx of new Swiss recruits to join in on the future efforts to project German influence not only in Europe, but across the globe. With Bern now safely under the thumb of the Reich, surely the rest of the Swiss people will make peace with their new leaders."
 goering.tannenbaum.12.a:0 "Not even the heart of Switzerland can stand defiant!"
 goering.tannenbaum.13.t:0 "Romandie and Ticino Pacified"
 goering.tannenbaum.13.desc:0 "The Oberkommando has reported what looks to be the greatest breakthrough yet seen in the Reich's Swiss pacification efforts – the populations in the regions of Romandie and Ticino have been officially declared to be pacified following persistent endeavours to bring them under the total authority of Germania. The atmospheres of these regions appear to have been successfully tranquilized allowing new German industries to flourish. To the shock of many military experts, even some of the French and Italian residents appear to show some interest in joining the Reich's armed forces.\n\nThis grand display shows the great potential in the seeds of the Reich's future, for even the most stubborn populations cannot hold out against the will of \"Ein Volk, ein Reich, ein Führer.\" Let Switzerland be an example for the world to behold, an example of how the strongest of forts, the toughest of resolves, the most determined of institutions, all fail before the power of the Reich."
 goering.tannenbaum.13.a:0 "All shall fall before the Führer!"
 goering.tannenbaum.15.t: "Only Peace in the Alpes"
 goering.tannenbaum.15.desc: "Franz Burri never imagined himself as the leader of a new, National Socialist Switzerland, after so many years away from his homeland, but from the perspective of years, there were reasons for this.\n\nLong ago, his homeland had rejected him and the great ideas of National Socialism, remaining to rot in the shackles of Judeo-capitalist plutocracy, and he had to lead his ideological crusade from Berlin, engaging in radio broadcasts and writing hundreds of articles and leaflets.\n\nFor a very long time, he waited for the day when Germany would bring liberation to the Swiss people. His hopes were dashed first in 1945, then in the tumultuous 1950s, but now everything could be accomplished.\n\nHe had not seen this, as it seemed to him, truly cursed land for over three decades, and soon he was to become its master. What would he see there? Ruins? Thousands of destitute people? Mass graves? None of this pleased Burri, but it gave him the realization that he was being sent to Bern for a reason.\n\nHis propaganda mission was over, although the shadow of the \"Helvetic Goebbels\" would never disappear from behind him. He intended to prove to himself, to Göring, and to Switzerland that this path to the National Socialist dream had not been meaningless.\n\nAll the documents in his portfolio were certified, the cabinet of ministers was formed, and the plan of action was developed. The \"Hamburg-Bern\" train was already arriving at the station, while Burri was finishing the farewell ceremony with German diplomats on the platform, assuring everyone present that he would make every effort to justify the hopes of Führer Göring in the position of Reichskommissar.\n\nBy tomorrow morning, he would already be in Switzerland."
 goering.tannenbaum.15.a: "One less thing to worry about. Probably..."
 goering_peace_events.24.t:0 "The Conquest of Switzerland"
 goering_peace_events.24.d:0 "Ferdinand Schörner was only capable of producing two emotions, Göring eventually decided; Smug, self-satisfied pride, and utterly unyielding rage. Normally, he was gracious enough to only engage in the former whenever a new conquest was made for the Reich, but apparently, the glory of victory was not enough to cool his temper this time.\n\n\"It's ridiculous. So many German lives lost, all because those bastards refused to just roll over and give us their damn mountains!\" He shouted, going over the after action report detailing operation Tannenbaum with disgust. The entire Swiss military strategy hinged on this; On hunkering down in hills and caves, great complexes of interlocking fortifications working in tandem with guerilla tactics and scorched earth, as to ensure that nobody bothered even thinking of attacking them. It just wasn't worth it. And indeed, it hadn't been worth it. Everyone from the most brilliant field marshals of the German general staff to the common panzergrenadier, bleeding his life's blood into the snowy wastes, would agree on that.\n\n\"On both sides of things.\" Göring concurred, hoping that agreement would satiate his benefactor and prevent further outbursts; Instead, it had the opposite effect, as the Monster pointed an accusing finger towards his Führer. \"No! No, those people are NOT Germans. Or if they are, they're the worst kinds of Germans. Race-traitors. Cowards. Judeo-Bolsheviks wearing human skin!\" Quickly realising the mistake he had made, Göring attempted to backstep in an effort to save himself from Schörner's renewed wrath. \"Come now, it's only because they've been corrupted over time. They've been living among French, Italians, and Romansh for ... how long now? Degeneracy was bound to creep in eventually. They'll be restored to their true selves once those elements are removed.\" Seeing as German blood was more valuable than ever these days, Göring was searching for any excuse to save as much of it as he could.\n\nSchörner, evidently, did not see things the same way, something that was made clear with the way he  slammed his fist down on the Führer's desk. \"Bullshit. No more excuses for those parasites. You'd best give me everything I need to teach them a lesson they won't forget or there will be hell to pay!\" Anything said afterwards went unheard and ignored as Bloody Ferdinand stormed out of the room, too infuriated to continue speaking. Göring, left alone, could only sigh. Once again, he had been left with the choice of doing what was best for the Reich, or with making sure his benefactor didn't start plotting his assassination."
 goering_peace_events.24.a:0 "But he had faced the dilemma before, and he would do it again."
 SWI_no_rest:0 "No Rest"
 GGR_swiss_resistance:0 "Swiss Resistance"
 GGR_swiss_resistance2:0 "Swiss Resistance"
 GGR_swiss_resistance3:0 "Swiss Resistance"
 GGR_phase_one_trigger:0 "We have not yet executed phase two of §YOperation Tannenbaum§!\n"
 GGR_phase_two_trigger:0 "We have not yet broken through the §YSwiss§! border\n"
 GGR_phase_three_trigger:0 "We have not yet succeeded in our conquest of §YSwitzerland§!\n"
 GGR_phase_three_trigger_tooltip:0 "We have managed to break through the §YSwiss§! border\n"
 GGR_switzerland_conquered:0 "Operation §YTannenbaum§! has been executed succesfully."
 GGR_underground_infiltration_tooltip:0 "§YA Swiss fort near the Burgundian border is quite vulnerable, we will send a special ops infiltration team to exploit this.§!\n"
 GGR_chop_off_the_head_tooltip:0 "§YBy eliminating the Swiss leader we can cripple their defences, firebombing Bern is the fastest way to accomplish this.§!\n"
 GGR_no_rest_tooltip:0 "§YContinous assault will keep the Swiss army from regrouping and in time they shall shatter like glass.§!\n"
 GGR_phase_three_breaktrough_tooltip:0 "§YWe have done it! The Swiss border is in our hands and the rest of Switzerland is surely to follow.§!\n"
 GGR_one_last_push_tooltip:0 "§YCome on men, one last push to Bern!§!§R If we do not take the swiss out in time it will have consequences.§!\n"
 GGR_cameras_on_the_front_tooltip:0 "§YThe Swiss forts have come to represent Swiss defiance and now that they are in our hands are a perfect place for propoganda films.§!\n"
 GGR_integration_tooltip:0 "§YExtra effort shall be put into integrating the Swiss people into the Reich.§!\n"
 GGR_occupation_tooltip:0 "§YSchörner will take control of Switzerland to neutralise the guerrilla forces.§!\n"
 GGR_recognizing_danger_tooltip:0 "§YDanger seems to be around every corner in occupied Switzerland, our soldiers should learn to recognize hidden gun batteries.§!\n"
 GGR_recognizing_danger_blocked_tooltip:0 "§YWith the Swiss resistance dealt with, it is no longer necessary to teach our soldiers how to counter the resistance.§!\n"
 GGR_the_southward_military_migration_tooltip:0 "§YThe Swiss forts will be moved to our southern border with the Italians.§!\n"
 GGR_phase_four_cleanup_tooltip:0 "§MThis will unlock the decision to loot Switzerland.§!\n"
 GGR_switserland_unruly:0 "The Swiss are up in arms against us!"
 GGR_operation_nordlicht:0 "Unternehmen Nordlicht"
 GGR_operation_nordlicht_desc:0 "At the beginning of our Civil War, it was widely expected that Reichskommissariat Norwegen, the bulwark of the Reich against the Judeo-Bolsheviks, would remain calm and stable, ready to rejoin whoever came out as the victor. Indeed, our top military minds claim that Norwegen could and would have held out against any attackers for decades. However, traitors from inside destroyed the Reichskommissariat, and the fool Terboven handed the Reich's greatest fortress over to the people and abandoned Norway to them. Now, the Norwegians own and occupy our miles of forts and bunkers, and promise to be one of the greatest challenges to invade.\n\nHowever, this does not faze our great Führer Göring, who expects-no, demands- a victory to rival 1940. After all, the Wehrmacht was able to crush organized resistance and an Allied force in just over a month. By using those same tactics, along with some of our newest technology, we will certainly win a victory just as great, if not greater, than our first conquest."
 GGR_norways_place_in_the_reich:0 "Norway's Place in the Reich"
 GGR_norways_place_in_the_reich_desc:0 "Officially, Reichskommissariat Norwegen ceased to exist in 1963. However, it seems that the government, or perhaps the Norwegian people themselves, were not so ready to let go. Instead, they have preserved the Fascist government that was in place during Terboven's rule, and seem to have kept at least some of our own ideals.\n\nIt has been recommended to the Führer that, instead of attempting another invasion of Norway, we should instead extend an invite to this new state to rejoin the Reich and retake its rightful place as our fortress. Though many of the militarists, notably Schörner, have complained about what they see as the politicians taking their glory, it is widely agreed upon that no Germans should die over such a rock as Norway.\n\nWe can only wait and hope they accept. If they refuse, perhaps Schörner will get the glory he wants anyway."
 GGR_northern_armies:0 "Northern Armies"
 GGR_northern_armies_desc:0 "With Norway's acceptance and reunification with the Reich, action must be taken to secure their internal situation. Currently, the new Norwegen Wehrmacht suffers from many defects, as much of their new native army retreats to start new resistance. It is of the opinion of the Oberkommando that Norway, without quick assistance, may collapse and break away from us again, forcing us to invade. While there are some voices that see this as a desired outcome, a majority of the Oberkommando has decided that aid and soldiers must be sent north. We now only wait for Göring's signature."
 GGR_northern_fleets:0 "Northern Fleets"
 GGR_northern_fleets_desc:0 "With the situation in Norway being secured by the minute, it is time to reinvest into the portions of the Reichskommissariat that have fallen into disrepair- the ports and naval bases. Indeed, Norway has potential to be a major hub for the Kriegsmarine, giving us near total control over the North Sea, acting as a counter to those bases in Iceland, and allowing us to reach into the Arctic. Unfortunately, the bases have slowly wasted away, due to the relatively tight budget of the Kriegsmarine in the last 20 years and the loss of control at the start of our Civil War.\n\nTo fix this, we will send thousands of slaves and materials to fix these bases, turning them into the great harbors and naval bases to rival those in Iceland. While this will undoubtedly cost millions of marks, the potential naval dominance will certainly make up for it, and besides, when has financial cost ever stopped our projects? "
 GGR_ready_the_fleet:0 "Ready the Fleet"
 GGR_ready_the_fleet_desc:0 "To begin our operation, we must first cripple the Norwegian economy. Norway's economy is heavily based on naval trade. Therefore, an obvious solution presents itself in the form of the Kriegsmarine. The new Norway's navy is barely existent in the first place, and will stand absolutely no chance against the might of our battleships. By using our fleet to cut off major ports and blockade the coastline, we will shatter the Norwegian economy, causing economic collapse and driving the Norwegians to poverty and starvation. If the plan succeeds, the Norwegians will be too weak to lift a finger against our forces when we land.\n\nUnfortunately, this plan does have some flaws. The Kriegsmarine is underfunded and still somewhat damaged from the chaos of the civil war, and currently is not in the best shape to conduct any large scale operations such as a blockade of the long Norwegian coastline. In addition, the fortifications we built with German sweat to hold off any western invasions, complete with naval guns, are undoubtedly now in the hands of the traitorous Norwegians, and may be used against our fleet.\n\nBoth of these problems are easily fixable, of course. Pumping money into programs is one of Göring's strengths, and the sheer might of our cannons and weapons will undoubtedly be enough to obliterate whatever puny resistance the Norwegians may put up. In any case, the operation is expected to be a success."
 GGR_contact_the_hardliners:0 "Contact the Hardliners"
 GGR_contact_the_hardliners_desc:0 "Despite the traitor Terboven having left Norwegen to the natives, and abandoning it to republicans and communists, not all circles of Norwegian society were pleased with this turnout. Credible sources state that there is an underground movement of former administrators and party members, waiting for our return. While these men enjoy limited support from the populace, and have not been a sizeable threat to the current government, surely all they need is a kick in the pants and a nice FAL in their hands. By sending funds and guns to these patriots, we could possibly stage an insurrection with our invasion, causing confusion and chaos. At the end of the day, any help is appreciated, and native soldiers fighting for our cause only makes it that much easier."
 GGR_helicopters_over_the_baltic:0 "Helicopters over the Baltic"
 GGR_helicopters_over_the_baltic_desc:0 "Since our first invasion of Norway, back in 1940, technology has improved greatly in terms of military equipment. One of these many improvements came in the advent of the helicopter, which has revolutionized airborne warfare. Where once airborne troops would have to leap from bulky transport planes in limited numbers, now full squads of men can be quickly and efficiently transported in helicopters. Not only that, but helicopters can also be used as a form of close air support, supporting troops and providing quick fire on any enemies on the ground. By using this fascinating new technology, we can swarm the resisting Norwegians with a cloud of steel and lead, overwhelming their defenses and seizing ports before they can mount a defense.\n\nOf course, helicopters have their drawbacks. Their slow speed makes them susceptible to anti-aircraft attacks, and their air-to-air capabilities are limited at best. However, with the numbers we will bring, this will not matter. A swarm will engulf Norway, and from it our men will pour out and obliterate the traitors who dare resist."
 GGR_danish_missile_bases:0 "Danish Missile Bases"
 GGR_danish_missile_bases_desc:0 "In the 1940 campaign against Norway, our bombers made short work of any defense that the Norwegians put up. However, our own success with this strategy led us to dotting the mountains and fjords with flak cannons, and now the Norwegians are bound to use our own weapons against us. To combat this, we shall use an invention that the strategists of 1940 could only dream of- missiles. By building up bases in Denmark, we will be able to fire missiles of all kinds into the mountains of Norway, obliterating any bunkers and forts in a hail of rockets and bombs, without a single German man being forced to lay his life on the line.\n\nIn addition to the immediate strategic benefit of these bases, they will also be a fine addition to our defenses against any American incursion into Europe, covering the entrance into the Baltic and much of the North Sea. Indeed, some have even gotten to asking why these positions have not been built before now. While the answer to this mainly lies in the economic downturn of the 50's, this issue matters little to the current situation. For now, we can rest easy knowing that soon all of Norway will be under the reach of our missiles."
 GGR_teaching_a_lesson:0 "Teaching a Lesson"
 GGR_teaching_a_lesson_desc:0 "The time has come. The fleets are armed and ready, our rockets are primed and fueled, and our helicopters even now spin their rotors and warm up in anticipation. Our soldiers across the Reich stand at attention, ready to plunge into the mountains and fjords of Norway. The plan is simple, and has been drilled into the mind of every soldier's head. We will land on top of their positions, silence their guns, and shatter any defense the puny traitors can muster. A quick sweep is not only planned and expected, but demanded. We will take the lightning invasion of 1940 and make it seem laughable in the face of our own strike. Truly, the Norwegians will once again learn to fear us, and the world will look in awe upon the new Germany's might!"
 GGR_only_the_most_loyal_collaborators:0 "Only the Most Loyal Collaborators"
 GGR_only_the_most_loyal_collaborators_desc:0 "After our victory over the hated Norwegians, collaborators of old have come crawling out of the woodwork in support of our return. Some have the humility to plead for forgiveness for their treachery, other, more brazen ones have the gall to claim that they remained loyal to the Reich since the dissolution of Norwegen. These fools seem to think that we have not watched the Norwegian situation with a close eye ever since then.\n\nOf course, we haven't, not with all the action we've been having back in the Reich, but that does not mean we should tell the truth. After all, it will only look bad for the Reich to admit that it hasn't been paying attention to its rightful lands. Instead, our Führer has conceived a brilliant idea. We will dole out punishments to all those we deem traitors, regardless of whether they actually betrayed us or not. After all, a good German should be able to sniff out the true Aryans from the pack of wolves and liars in the first place. At the end of this purges, we should theoretically be left with a strong, sturdy, and loyal pack of politicians and generals to restart the Reichskommissariat with."
 GGR_north_sea_oil:0 "North Sea Oil"
 GGR_north_sea_oil_desc:0 "With the reconquest of Norway, we have gained access to the many natural resources lying inside of their mountains. At first glance, this would seem to be all that Norway offered the Reich. However, upon some inspections, research, and preliminary drilling, our scientists and engineers have discovered a veritable ocean of black gold underneath the waves of the North Sea. These reserves, previously untapped, are vast, giving us an impressive oil reserves of our own to rival that of the Saudis and the Italians. Not only will this new oil be enough to power our war machine for years, but there is likely to be enough surplus to even sell some overseas. Needless to say, the Führer is ecstatic over the news, and extensive drilling has been fast tracked to begin."
 GGR_isolating_the_swedes:0 "Isolating the Swedes"
 GGR_isolating_the_swedes_desc:0 "With the conquest of Norway finished, we have gained control over a major part of international seafaring- the Danish Straits. While we once controlled these before our civil war, Hitler never decided to institute a full blockade on the Swedes and Finns, allowing them to trade with the outside world. Not so with Göring. Under his direction, the Straits are to be closed off to any trade coming from or headed for Sweden or Finland. This new restriction will hopefully drive the two nations to desperation, and severely hamper their economies. By closing this lane of trade, we will slice an important part of the Baltic nation's economy apart, giving us and us alone control over imports and exports in the Baltic. Not to mention that we can charge a pretty penny in taxes on any foreign ships entering or exiting."
 goering.nordlicht.1.t:0 "Some Underhanded Work"
 goering.nordlicht.1.desc:0 "The cruel Norwegian rain was whipped and blown by the North Sea's fierce winds, cutting across Hans's face as he retreated into his raincoat's collar. The man he agreed to meet on the dock looked similarly uncomfortable- an understandable feeling, judging by how soaked he was. The two men shared a quiet code phrase with each other, both gauging to see if the other was not all they claimed to be. Evidently after safely identifying each other, the men began to speak to one another. Neither worried of any potential eavesdroppers- they were the only men out on such an ugly night.\n\n\"So. Directly here on the Führer's orders, hmm? What does he want out of us?\" The Norwegian quietly asked. Hans could not discern whether his shiver came from any fear or if it was just a byproduct of the wild conditions.\n\n\"He has two proposals for you, with the belief that you have the resources to do one of them.\"Hans replied.\n\n\"Let me hear them.\"\n\n\"The first is the simpler one. We give you some arms, some explosives, a manual or two, and you do with them what you see fit. Perhaps a factory suddenly finds its main machinery rooms a detonated mess, perhaps a railroad finds itself explosively cut.\" Hans judged the reaction on the native's face, and was rather disappointed to find none of any real note.\n\n\"The second is a bit more subtle. We give you some designs, some ideas, and a lot of paper. You make the magic happen, maybe convince the people that we Germans aren't so bad, and our lives get a lot easier. Which one do you want?\"\n\nThe man pondered silently, continuing his shiver. Hans suddenly realized that there could be a third reason to that shiver- sheer excitement."
 goering.nordlicht.1.a:0 "The pen is mightier than the sword."
 goering.nordlicht.1.b:0 "You can't go wrong with explosives and guns."
 goering.nordlicht.2.t:0 "Whispers Of A Return"
 goering.nordlicht.2.desc:0 "The dark, soaked streets lay silent and empty, save for one cargo truck parked off to the side of the road. With its headlights off and engine silent, one could only assume that its business was of the highly illegal type. One man sat in the driver's seat, cigarette twisting between his index and middle finger. He wasn't allowed to light it, they said- any light could be a possible trigger for a watchful policeman or concerned citizen to investigate.\n\nThe three shadows moving down the street made their own effort to stay out of the light, sneaking close to walls and moving only into the edges of a street lamps glow. Occasionally, they would stop, turning to the wall to paste something onto it. The man in the truck could not read what they were saying, but he knew what it was- poster after poster, detailing the benefits of restoring the German Reichskommissariat.\n\nFinally, the two men returned, their hands empty. As the driver flicked his headlights on and began to drive away, the light flashed off the multitudes of posters plastered on every building. He couldn't help but laugh at the almost comedic sight of it- this would be a hell of a thing to wake up to for the locals. Perhaps they would see the light, perhaps they wouldn't. Either way, one thing is for certain- the people would know that the Germans were coming, and that the hardliners of Norway were ready with open arms for them."
 goering.nordlicht.2.a:0 "It's a start."
 goering.nordlicht.3.t:0 "Burning Papers"
 goering.nordlicht.3.desc:0 "The truck rumbled down the darkened streets of town, lit only by the occasional streetlamp and the full moon above. Inside the cabin sat 3 men, hats pulled low and papers in hand. Those papers they jostled and bumped around were detailed and striking, depicting scenes of a benevolent German soldier watching over a group of children, each waving the flag of the Reichskommissarat that was so suddenly taken away. In the back of the truck sat another few hundred of these papers, each ready for distribution across every street and building. The people tomorrow would wake up to a city covered in pro-german propaganda, and they would know that their salvation would be at hand.\n\nOr at least, they would have, had the truck made it to its intended destination.\n\nUnfortunately, the police had been tipped off beforehand of hardliner activity in this particular area, and as such had prepared themselves for it. The truck rounded a corner, only to find its path forward blocked by a squad car. Before it could react, another squad car sped out behind it, blocking its path. Even as the driver cursed his luck, police stormed forward, dragging all three men from the vehicle and slapping cuffs around their wrists. The truck, after being searched, was impounded, and the papers taken and burnt.\n\nThe arrest of the three men was mentioned only in passing in the next day's papers."
 goering.nordlicht.3.a:0 "Damn!"
 goering.nordlicht.4.t:0 "Sabotage"
 goering.nordlicht.4.desc:0 "His fingers drummed impatiently on the wheel as he waited. The factory's outline starkly contrasted against the mountains that surrounded it, its angular, sharp corners opposing the smooth, curving slopes and peaks. Around this complex, somewhere, ran the man's comrades-in-arms, though they were certainly taking their time. In fact, the driver had been explicitly told that this whole affair would be in and out, and yet 20 minutes had passed. As the minutes continued to tick away, the dark worries that the man had suppressed the entire drive north began to gnaw away at his resolve. What if they had been caught? What if the explosives weren't working? What if this had all been a set-up, and at any minute, a hundred police would come barrelling down the road?\n\nLuckily, his friends returned right as his resolve, already weary, began to fail. With empty hands and smiling faces, they ordered a quick exit. The driver, still full of nerves from his near panic attack, was more than happy to oblige.\n\nAs the truck slowed down near an overlook of the complex, one man squeezed hard on the detonator. Almost immediately, a flash cracked across the valley, and a huge building in the center of the factory disintegrated. The shockwave and the roar of the explosion soon reached the conspirators, who couldn't resist a hearty chuckle as they sped away. The first blow in the oncoming war had been struck."
 goering.nordlicht.4.a:0 "The day draws near."
 goering.nordlicht.5.t:0 "Out Of Luck"
 goering.nordlicht.5.desc:0 "One often wonders how they end up in situations of their own making. Jilted lovers wonder what caused the sudden end of a relationship they enjoy. Exiled and disgraced politicians often ponder the causes of their sudden misfortune. In general, those who suffer a great misfortune will, at least initially, wonder what they could have done differently to avoid such a thing from happening to them.\n\nThe driver of the cargo truck, fig filled with guns and explosives that had been destined for an operation against a factory in the north of Norway, was no exception. Even in his dazed state, he pondered how he had gotten here as he slowly recovered from the hit that had sent both him and the truck flying, flipping over and over into a gorge.\n\nHe supposed it had to have started when he had joined the fascists, way back in the day. The Germans had made it so easy for him to make that choice. Of course, he was younger, and more hot headed than he was now. He had wanted any chance to bail out of the fishing village that his father, his mother, and their fathers and mothers had called home, and when an offer from the local collaborationist regime arrived, sending promises of an apartment in Oslo, a well paying job, and a chance to protect his homeland, how could he refuse? Of course, if he knew where that path would lead him, he never would have taken it.\n\nAnother place he could have changed was when the Nazi's left Norway. In the chaos, nobody would have noticed just another suddenly missing man from the rosters. But he stayed with the division he had based his career around, all the way up to when they needed a driver for a mission in the north, on a promise from the Führer himself. But there was no time left for regrets now.\n\nEven while upside down and with a swollen eye, the driver could make out a small group of partisans carrying away the equipment the Germans had graciously given to them. His eyes wandered over to the partisan crouching next to the truck, rifle in hand and pointed directly at the driver's head.\n\nThere was only enough time for the driver to let out a sigh of regret before the crack of a gunshot cut the air, and regrets that the driver had held for years disappeared in a flash."
 goering.nordlicht.5.a:0 "Some mistakes cannot be fixed."
 goering.nordlicht.6.t: "The Ultimatum"
 goering.nordlicht.6.desc: "Surrender or die.\n\nxoxo: Goering"
 goering.nordlicht.6.a: "oki"
 goering.nordlicht.6.b: "nah"
 goering.nordlicht.7.t: "Memories of Kalmar"
 goering.nordlicht.7.d: "\"Assimilation\" was a word that Gulbrand Lunde had long since come to loathe and distrust whenever a member of the Reich mentioned it. To him, it was just another way of saying 'Germanization', of flooding his beloved country with foreigners, of diluting the blood of the Vikings with the blood of barbarians. It was true that the nation of Norway owed much to Germany, but the Nazis always had some sort of impression that they were supposed to be brothers, when they had always been more of cousins to him. Distant ones, at that. He was proud to be working within the Einheitspakt, but so long as he ruled, he was certain that there would be no 'assimilation' of any kind.\n\nAnd yet, he couldn't help but make an exception, just this once.\n\nReichskomissariat Skandinavien. What a glorious concept! The Norse people united at last once more, all under the guiding light of National Socialism. They may have still been under German rule, but they were fools if they thought that this project would dilute the Nordic identity. Rather, it would only strengthen it, continuously, until it could no longer be denied. When the Vikingers stood united one day, they would at last have the power to stand on their own feet, and work with the Germans not as subjects, but as equals.\n\nThat, and he'd much rather not be executed for refusing their ultimatum. His people still needed him, after all, and he was first and foremost a man of the Norwegian people."
 goering.nordlicht.7.a: "At least someone is excited about this..."
 goering.nordlicht.8.t: "The Northern Dominon Stands Strong"
 goering.nordlicht.8.d: "\"My Führer, Lunde has yet to respond to our ultimatum for almost a week now. Many in the OKW suspect he may not comply. I recommend preparing our Marines for a potential invasion of Norway.\" Schörner urged.\n\n\"Nonsense,\" replied Göring dismissively. \"I am certain Lunde remains loyal to the Reich. There's no doubt he will come around.\"\n\n\"Nevertheless, my Führer, it would be prudent to prepare for all scenarios,\" Schörner persisted.\n\n\"Very well,\" Göring conceded after a moment. \"Deploy a specialized Marine detachment to Copenhagen. And reinforce our garrison in Nordsten.\"\n\nAt that moment, the phone rang, Göring picked up to hear Axmann's franctic voice. Casual \"Heil my Führer!\" came from the phone. When Göring replied with the greeting, speech from the phone continued. \"My Führer, Lunde has declined our ultimatum. He has defied us and our rule!\"\n\n\"I see. Thank you, Axmann.\" Suddenly, Göring burst with anger, hanging up the phone. \"That bastard Lunde!\" Göring exclaimed furiously. \"Schörner, prepare all our Marines for an amphibious invasion of Norway.\" \"Yes, my Führer,\" Schörner acknowledged, with a grin on his face, he went to notify the OKW."
 goering.nordlicht.8.a: "That damn bastard will wish he was dead."
 goering.nordlicht.9.t: "Wind from the North"
 goering.nordlicht.9.d: "Henry Rinnan held in his hands a document certified by the Führer himself and the personnel department of the OKW, on which his name was prominently displayed in the top field, written in a bold hand. His eyes glazed over, his heart skipped a beat. He was shocked by Göring's favour not only to spare his life but also to appoint him as the Reichskommissar of RK Skandinavien.\n\nHe asked himself, \"Why me?\" However, he also had reasons to consider himself worthy of such a position.\n\nWho, if not he, had been at the forefront of defending the freedom and will of the peoples of Scandinavia from the red threat in 1940? Who, if not he, had collaborated with the German liberators in the first ranks? Who, if not he, had taken on the dirtiest work – cleansing this land with fire and sword from bandit and ideological filth?\n\nRinnan had proven his dogged loyalty to National Socialism through his actions and words for too long, and now he had a final mission ahead of him – to turn the unwelcoming snowy fields and fjords into an Aryan paradise, or at least come as close to it as possible. Yes, this would require considerable resources and time, but this game was worth the candles burned. The bullets fired at partisans. The bombs dropped on their hideouts. All for the great cause.\n\nRinnan did not doubt his abilities or the wisdom of Führer Göring's choice for a moment. The stakes had already been set.\n\nHe quickly picked up the phone on the desk and contacted his secretary, informing her of his imminent departure and new appointment, ordering her to call a car to the ministry."
 goering.nordlicht.9.a: "The Reichskommissar's form is ready to go."
 goering_peace_events.11.t:0 "The Conquest of Norway"
 goering_peace_events.11.desc:0 "Nazi propaganda was always very specific in regards to the Nordic countries; As fellow Aryans, Germans and Norwegians were bound together by blood and ideology alike, and thus were more than just natural allies; They were brothers. The German Reich was the proud oldest son, the guiding hand that would lead the Aryan race to salvation against all who stood against him and his family, while Norway was the loyal younger brother, who would proudly walk in the footsteps laid out to him on the path to glory.\n\nUnfortunately, that little brother wasn't nearly as loyal as he should have been.\n\nGöring thought that any such rebellious tendencies had already been stamped out long ago during the first invasion, when Hitler decimated all who opposed him and secured the Endsieg, the Final Victory. Norway was set to be a part of that final victory, before they threw it all away with this latest flare up of resistance. And for what? Their situation was just as hopeless as it was the first time. They'd receive no outside help, just like the first time. And now, they were even weaker than they were the first time. Clearly, the winters had frozen all of their functioning brain cells.\n\nAnd so it was that the Führer casually gave the order to invade. He casually read the reports of successful landings when they occurred, casually listened through the briefings as to their continued success, and casually observed the victory celebrations when the inevitable happened. He casually assigned Heinz-Georg Lemm to be the land's new Reichskommissar, and casually put all the death, pain, and suffering he had inflicted upon his nation's 'little brother' out of mind. This time, the Germans would be here to stay. And if for some reason the Norwegians rose up against them again, then they'd casually do it all over once more, and any number of times they needed to after that.\n\nThat was the responsibility of the older brother, after all; To keep the family he cared for in line."
 goering_peace_events.11.a:0 "Second verse, same as the first."
 GGR_send_norway_an_ultimatum: "Send Lunde an Ultimatum"
 GGR_return_to_norway:0 "Integrate Norway into RK Scandinavien"
 GGR_reestablishing_the_party:0 "Reestablishing The Party"
 GGR_reestablishing_the_party_desc:0 "The Norwegian collaborators of old have proven to be unloyal and betrayed the Reich in its moment of need. We must purge the party of old and start from scratch if we ever wish Norway to keep the Norwegian people from being led astray again. Only those who are prepared to die for the aryan utopia we all desire shall be allowed to rejoin the party."
 GGR_not_invaded_norway_tooltip:0 "We have not yet started the invasion of §YNorway§!\n"
 GGR_norway_conquered_tooltip:0 "We have succeeded in the conquest of §YNorway§!\n"
 GGR_contact_the_hardliners_tooltip:0 "§YBy contacting the hardliners who desire closer relations with the Reich we can sabotage the Norwegian war effort.§!\n"
 GGR_norway_refuses:0 "§YNorway§! declines the ultimatum"
 GGR_norway_accepts: "§YNorway§! has accepted our ultimatum"
 GGR_operation_hansa:0 "Unternehmen Hansa"
 GGR_operation_hansa_desc:0 "During the last world war, when one nation after another was conquered by Reich, Sweden was lucky enough to keep their pity independence due to our mercy. However, in the last 20 years, Sweden has become a nation of weakness and corruption. It is clear that our Nordic brothers have no future under the incapable rule of those social democrats, and they have to be united with us, for the best of the Germanic race. It is a grave insult to our mighty Reich that our northern germanic brethren remain under the rule of vile semites and undesirables. However, the Swedish lion has been prowling for the last 20 years, always prepared to strike us if the moment allows it. For this reason we must not be careless, they might not look like it but the Swedes truly are our most dangerous foe yet."
 GGR_norwegian_remilitarization:0 "Norwegian Remilitarization"
 GGR_norwegian_remilitarization_desc:0 "Norway, a Nordic nation which has been ruled by the Reich for more than 20 years, was recently reclaimed by the Wehrmacht. Since they share a long border with our target Sweden, it may be helpful for us to ask for Norwegian people's assistance for the upcoming war. Though their military strength and spirit cannot be compared with ours, they can still be much useful if we send them some weapons and allow them to have a bigger army.\n\nWhen the invasion truly begins, Swedish soldiers will realise they need to face not only the German panzers but also their Nordic kinsmen's' bullets. An army of Norwegians will not do damage to those Swedes physically, but also harm them mentally."
 GGR_encourage_norwegian_divisions:0 "Encourage Norwegian Divisions"
 GGR_encourage_norwegian_divisions_desc:0 "We have sent weapons and supply to Norwegians to help them build an army, but there can be no army without enough soldiers. Even after all these years under our rule, they still don't want to fight for our cause. Therefore, recruitment propaganda must be implemented to acquire more men who are willing to join our forces.\n\nEvery Norwegian should be informed that, the Reich will bring pride and protection for all Aryan people around the world, and in return, loyal Germanic warriors have their duties for the Reich's war effort. And since they are treated by us as our Aryan brothers instead of other inferior nations, they don't and shouldn't have the right to reject our conscription orders. If they really dare to refuse that, there are some serious consequences they're going to face."
 GGR_blockade_the_north_sea:0 "Blockade the North Sea"
 GGR_blockade_the_north_sea_desc:0 "History has told us that, no army can resist the ultimate power of starvation. Though self-sufficient in many aspects, Sweden still need to import some vital resources, and most importantly, it is heavily dependent on imported foods.\n\nTherefore, the Kriegsmarine will be deployed to the Danish Straits and the North Sea to blockade all cargo carriers coming in or going out of Sweden. Any ship will be intercepted or even attacked once detected unless it is officially approved by the Reich. Without enough food imports, Sweden will lose its strength and will to fight once the war breaks out."
 GGR_lessons_from_switzerland:0 "Lessons from Switzerland"
 GGR_lessons_from_switzerland_desc:0 "Sweden is not the first so-called democratic nation who stands in the way of the Reich's glory. Switzerland, just like Sweden, was a nation controlled by corrupt politicians and illusions about people's rule. Swiss people believed that they were fighting for themselves and they had spent more than 20 years building military strength, preparing for our invasion.\n\nBut no, their confidence didn't save them. In the end, their pity state was smashed by the Wehrmacht without any mercy. During that war, we've learned how to deal with these democratic nations more efficiently, and now, it is Sweden's turn to face our relentless war machine."
 GGR_lessons_from_moskowien:0 "Lessons from Moskowien"
 GGR_lessons_from_moskowien_desc:0 "For an army at war, supply lines are no less important than blood vessels for a man. Swedish people may believe that is it impossible for us to feed a large army on their lands. But what they don't know is, that the Heer has already learned everything it needs about supply during the recent war on Russian lands.\n\nIf we could maintain our supply lines while facing damaged infrastructures around Moskowien and attacks from Russian guerrillas, then why can't we feed our soldiers on the Swedish soils? Swedes will be shocked when they realises what a large and vigorous army they need to fight against."
 GGR_lessons_from_finland:0 "Lessons from Finland"
 GGR_lessons_from_finland_desc:0 "Freezing weather is probably the most powerful weapon Sweden can wield against its invaders. Impassable roads, supply shortage, trembling soldiers...During the war against Russia, we've learned how many troubles it can cause to our armies. But luckily, the recent conquest of Finland has taught us how to fight in the cold of Scandinavia.\n\nFood, clothes, fuel... all kinds of supply the soldiers need for the winter will be fully prepared when the invasion begins. We are now confident to declare that the General Winter is nothing before the wisdom of the Führer himself."
 GGR_prepare_the_marines:0 "Prepare the Marines"
 GGR_prepare_the_marines_desc:0 "Throughout the full plan we've made for operation Hansa, Landing is perhaps the most important part. Twenty years ago, we had met some obstacles when landing in Norway and England, but eventually, we still managed to break through their defenses and occupied their nations. And most importantly, we have learned a lot from those two landing operations.\n\nNow, responsibility once again falls on the shoulders of the our fearless marines, and they need to be fully prepared when the operation starts, so that they can get a foothold on Swedish land for us as quickly as possible."
 GGR_keep_our_direction_unclear:0 "Keep Our Direction Unclear"
 GGR_keep_our_direction_unclear_desc:0 "For a landing operation, if the target location can be predicted by the opponent, then it has already failed before the beginning. Therefore, the confidentiality of our war plan will be put at the highest priority. Our intelligence officials must work as hard as they can to sort out all of Swedish and OFN spies in our nation.\n\nAnd most importantly, in the next few days, our soldiers and officials will receive several false directions about the specific location they are going to land. No one can get any information about our landing direction as long as our troops have no clue about their target themselves."
 GGR_the_brother_war:0 "The Brother War"
 GGR_the_brother_war_desc:0 "After all the preparations we've made before, now the time for the invasion has finally come. Our brave soldiers, panzers, fighters, bombers and ships will start their attacks once the order is received. Some may ask, why should we do this to a Nordic nation generally considered to our Aryan brothers?\n\nYes, we must admit that this war will be a war between brothers. But, when the little brother is deceived and misguided by their common enemies, it is the big brother's responsibility to correct the little brother's mind, even if it requires some blood to be shed. If not us, who? If not now, when? "
 GGR_scandinavian_liberation:0 "Scandinavian Liberation"
 GGR_scandinavian_liberation_desc:0 "Finally, after all the bloods, deaths, destructions and mental suffering we've endured, the whole Scandinavian Peninsula is at our hands now. Once again the Reich stands the victor at the end of a war, and every other nation is now shocked and trembling before the Wehrmacht's awesome strength.\n\nDenmark, Norway, Sweden...under the leadership of our new Führer, we've unified more aryan nations than what we've did in the last world war. Though proud for the Reich though, our people and soldiers are indeed exhausted now, and we still have to deal with local resistance. So, before the new conquest, we should take some time instructing the Swedes adapting to their new National Socialist lives and giving our people some rest. Let's enjoy our hard won peace...for now."
 GGR_aryan_divisions:0 "Aryan Divisions"
 GGR_aryan_divisions_desc:0 "While the Swedish army no longer exists now, their soldiers are still waiting for their final destinies. And since they are viewed as our racial brothers in the National Socialist theory, how to deal with them is not only about regional stability but also about our long-term ethnic and propaganda policies.\n\nDue to the fact that the Reich always needs more manpower to suppress local guerillas and conquer more lands, those Swedish soldiers will be reorganized into new divisions under our commands, just like the Norwegians before. Some may argue that those Swedes will not be willing to fight for our cause and conscription will make them more hostile to our new administration, but our carrots and sticks can make them obedient, can't they?"
 GGR_send_them_home:0 "Send Them Home"
 GGR_send_them_home_desc:0 "The government of Sweden have surrendered, however the flame of resistance in their soldiers' heart cannot extinguish easily. And because in our propaganda voices, they are our Aryan noble brothers instead of other lower races, we cannot just put them into concentration camps like how we deal with those Slavic barbarians.\n\nNow, it is clear that the only option left for us is to just dismiss them and let them return their homes, and this will definitely help us keep maintain regional stability and decrease the danger of open rebellions. After all, who's willing to die meaninglessly when his wife and children are sleeping quietly beside him."
 GGR_expand_the_northern_mines:0 "Expand the Northern Mines"
 GGR_expand_the_northern_mines_desc:0 "The most valuable help that Sweden can provide for the Reich is its abundant metal materials. In the north of Sweden, there are dozens of metal mines that used to be owned by Swedish state enterprise, and their failure in the war has proven that it would be a waste to allow them continue to control these mines themselves.\n\nTherefore, Germania has ordered that all mines in Northern Sweden will be nationalised by the Reich immediately, and will be expanded to fulfill their all potential. As for the workers, those despicable people like resistance members, non-Aryan immigrants, political prisoners and resistance members are going to be used as cheap slave labors as usual. Now, the whole world is trembling as the Swedish iron starts to serve the Reich's war machine."
 GGR_out_of_sight:0 "Out of Sight"
 GGR_out_of_sight_desc:0 "In the northern part of Sweden, our slave camps are silently expanding while more and more slaves are transported there to work for the Reich. However, everything about the enslavement will be kept as our top secret. The Swedes may be our brothers but they have yet to see the benefits of our practices.\n\nHence, the kinship and mutual respect between Germany and Sweden will be emphasized in our propaganda while the slave camps must be expanded faster and silently. Anyone who leaks anything about slavery will face great consequences for their \"careless\" behaviours. If you cannot keep your mouth shut tightly, fine, then why don't you go to camp in person and serve the Reich more devoutly and carefully?"
 goering.hansa.1.t:0 "A Successful Campaign, An Embarrassing Outcome"
 goering.hansa.1.desc:0 "Our triumph over Sweden has heralded the immediate conscription of its Aryan citizens, but these attempts have not proven to be easy. Despite our propaganda campaigns proclaiming the glory of the Reich and the racial purity of the Swedes, many young Swedish men are attempting to avoid military service by any means.\n\nThis treasonous arrogance has sparked many explanations from the Führer's advisors. Some have speculated that a hidden group of OFN spies are subverting our efforts, while others blame the weak propaganda drive of the Reich itself. During the war many Swedish soldiers were exposed to German posters and broadcasts glorifying the sacrifices of the Wehrmacht, and as such have grown to view military service to the Reich as a one-way road to hell.\n\nNow that the fearless Viking warriors have degraded into yellow-bellied cowards, our initial conscription plans must be adjusted. Conscription laws have been made harsher, and those who defy the call of duty will face dire consequences."
 goering.hansa.1.a:0 "Is there a more sickening sight than a craven Aryan?"
 goering_peace_events.8.t:0 "The Conquest of Sweden"
 goering_peace_events.8.desc:0 "It was tough work, convincing a conquered people that the invasion of their homeland, deaths of their sons, fathers, and brothers, and wholesale looting of their economy was actually a good thing. Propaganda only worked when the right message was being communicated through the right methods and to the right people, and the Swedes certainly didn't look like the right people. But maybe, just maybe, that could be changed over time. Maybe they could be convinced that this was all for the best.\n\nAfter all, it wasn't vermin and pests that the Germans now found themselves ruling over, but their own brothers. Fair haired, blue eyed, pure blooded Aryans, just speaking a different language. That was their way into their hearts, argued Generalleutnant Heinz-Georg Lemm, now the Reichskommissar of Reichskommissariat Skandinavien. He would sell his pseudo-nation not as a puppet state or a colony, but rather as the first step in realizing the destiny of the Swedish people, that destiny being to join their elder German brothers in becoming masters of the world itself.\n\nAfter all, had the Swede and the German not always been natural allies, ever since the thirty years war? Had the Swede not always been the enemy of the lesser races, ever since the Great Northern war? The German invasion was not a conquest, but a national awakening. A chance for these modern vikings to throw off the chains imposed upon them by their cowardly leaders and their Judeo-Bolshevik puppet masters. They would join their fellow Aryans not as subjects, but as equals. The likes of Gustavus Adolphus and Charles XII smiled down upon their homeland as the Swastika flew over it, knowing it was not the end, but a brave new beginning. A rebirth of the Varangians.\n\nIt was such a convincing fantasy, that even Lemm found himself believing in it from time to time. But really, it was nothing special; It was the exact same tactic they used on the Dutch, the Danes, and the Norwegians beforehand. And yet, it always worked, didn't it? No need to change what wasn't broken.\n\nPerhaps those who could still remember what once was would resist them, for however long they had left on this world. Perhaps their children, inspired by their parents, would follow suit. But the children of those children would know nothing of Sweden other than it being a core component of the Thousand Year Reich, as it shall remain for the rest of eternity. As long as he laid the groundwork for such a glorious future, he could sleep easily at night, knowing he had performed his duty."
 goering_peace_events.8.a:0 "The death of a national identity, all over some iron reserves."
 GGR_northern_slave_mines:0 "Northern Slave Mines"
 GGR_northern_slave_mines_desc:0 "Just like the Soviets of old, the German government has chosen to send its political opponents and undesirables to camps up in the north. Here the slaves will work in the mines to keep the German war machine running. Up here in the north the slaves face harsher conditions, which makes revolt more unlikely as they cannot possibly survive on their own. The only problem with this otherwise perfect plan is the Swedish resistance becoming more popular as people start to fear the idea of Sweden becoming a giant slave camp."
 GGR_fall_hansa: "Unternehmen Hansa"
 GGR_fall_hansa_desc: "$GGR_operation_hansa_desc$"
 GGR_not_invaded_sweden_tooltip:0 "We have not yet started the invasion of §YSweden§!\n"
 GGR_sweden_conquered_tooltip:0 "We have succeeded in the conquest of §YSweden§!\n"
 GGR_lessons_from_switzerland_tooltip:0 "§YDuring operation Tannenbaum we learned first hand how to deal with major defensive lines and how to spread discord in a democracy.§!\n"
 GGR_lessons_from_moskowien_tooltip:0 "§YIf anything could be taken away from operation Heinrich it is how to maintain proper supply lines, this will be handy for our campaigns in the far north.§!\n"
 GGR_lessons_from_finland_tooltip:0 "§YOperation Lapland taught us how to deal with the harsh northern weather.§!\n"
 GGR_prepare_the_marines_tooltip:0 "§YWhether or not we choose to attack Sweden via Denmark, marines will be vital in operation Hansa. We will make sure that the Berserkers are ready for anything.§!\n"
 GGR_keep_our_direction_unclear_tooltip:0 "§YThe greatest advantage we hold over the Swedes is that they do not know from where we attack, improving our encryption will make sure we keep this advantage for as long as possible.§!\n"
 GGR_operation_lapland:0 "Unternehmen Lapland"
 GGR_operation_lapland_desc:0 "Finland was once a staunch ally of the Reich. After their defeat at the hand of the Bolsheviks, they were more than happy to accept our aid and reclaim their lost territories. To that effect, they wildly succeeded with our help, seizing Karelia and Kola. However, it seems the Finns have forgotten why they were able to reclaim these territories in the first place. Ever since the 50's the Finns have drifted away from our sphere, going so far as to begin looking for trade deals from our greatest enemies. It is time we reminded them to respect those who gave them the fruits of victory.\n\nGöring has ordered preparations for a new invasion into Finland to be made, in case they are foolish enough to refuse to rejoin the Pakt. By bringing back the Finns into our alliance, we will slice off one of America's last lines into Europe, and gain nearly unparalleled access into the Arctic. While the Finns may struggle, and many may die, the unstoppable military machine of the Reich will roll over them like a tidal wave."
 GGR_a_dangerous_foe:0 "A Dangerous Foe"
 GGR_a_dangerous_foe_desc:0 "The Finns, while backwards, agricultural, and behind technologically, cannot be underestimated, They have proven their fighting prowess against the Soviets, who, by all metrics, should have smashed the Finns, and were instead bled dry against them. To take the Finnish fighting spirit lightly is a fool's error, and it will not be one we make.\n\nWhile we will not teach our soldiers to fear the Fin, we will teach them to treat them as a near-equal to them, unlike the others we have fought. By doing this, we will hopefully train the soldiers to treat their duties with seriousness and focus. Only with a focused attitude and conduct worthy of a true soldier of the Reich will we be able to roll over the Finns as the Russians should have back in the day."
 GGR_a_tactical_location:0 "A Tactical Location"
 GGR_a_tactical_location_desc:0 "Finland is nothing more than a jumping off point into further conquests, and any who says otherwise is a fool! Their economy is pathetic, their army is but a group of old men with rifles and skis, and their air force is laughable in the face of the Luftwaffe! The Russians may have paid for their invasion in gallons of blood, but we in Germania know better than the Slavs. Our equipment, our numbers, and our Aryan superiority will propel us to victory over any resistance the Finns could muster.\n\nUnfortunately, while this position may be common among the Oberkommando, it is decidedly less common with the enlisted man. Some of the weaker willed men in our army seem to fear the fighting skill of the Finn, pathetic as it may be, simply because they were able to destroy the Judeo-Bolsheviks Slavs as any good European race should! This position, while it may be silly, could prove fatal in key battles. Our men must have any fear of the Finns drilled out of their heads and replaced with the knowledge that they will obliterate the enemy. Then, and only then, will we be able to crush Finland decisively."
 GGR_naval_manoeuvring:0 "Naval Manoeuvring"
 GGR_naval_manoeuvring_desc:0 "The Finnish Navy is not something to be scoffed at. While it is vastly outnumbered by our own Kriegsmarine, it is a fact that we have never engaged in direct combat with the Finns at sea. As such, we have no idea of their capabilities, their seafaring skills, or their naval compositions. If we wish to see these strategies for ourselves, we need to find them aggressively. To do this, a group of Kriegsmarine ships will sail into Finnish waters, in the hope that the Finns will respond. From there, we can observe their strategies and, if push comes to shove, soundly destroy them and ensure they never sally out from their ports again."
 GGR_seize_aland:0 "Seize Åland"
 GGR_seize_aland_desc:0 "With the Swedes owning the inner coast of the Baltic, and Denmark being too far away to effectively launch invasions from, we must turn to other positions to launch our navies from. Luckily, the Aland islands, situated directly in the center of the Baltic, provides a perfect naval base for our fleet to launch from. With a quick storming from our brave soldiers, we will be able to secure the islands, currently in Finnish hands, for our own use.\n\nOf course, the Finns owning these islands also posts a diplomatic issue- the seizure of such a major base will not be taken lightly by the traitors in Helsinki. Indeed, such a seizure could be interpreted as a declaration of war, and to take such a risk while unprepared is a foolish measure. After all, the last thing we need to start our operation is to be surprised by the Finns, as the Russians were. We must be ready for all-out war if Finland decides to stand against us."
 GGR_maximize_air_efficiency:0 "Maximize Air Efficiency"
 GGR_maximize_air_efficiency_desc:0 "Due to the northern position that Finland occupies on the globe, daylight hours in the winter are scarce and short. As good as our planes are, their effectiveness does dramatically drop after nightfall, with crashes becoming regular occurrences and our bombers regularly missing their targets. While the inverse of this situation is true in the summer months, where the daylight hours stretches for lengthy periods of time, our pilots and crews must be trained on how to maximise time in the air, squeezing out every bit of air time we can and maximising the amount of ordinance we drop upon the enemy. Our air power is key to victory in this situation, and misuse of it may lead to a long, bloody, painful war. "
 GGR_specialized_artillery:0 "Specialized Artillery"
 GGR_specialized_artillery_desc:0 "The terrain that is common in Finland poses a unique problem for our artillery. While the standard training grounds for our big guns are on the hard plains of Central Germany, the snowy forests and thousands of lakes in Finland could not be further from those training conditions. If our big guns are not prepared for such harsh terrain, they will be quickly rendered useless in the mud and trees that are so prevalent on the Finnish mainland.\n\nTo combat this, we must train our artillerymen on how to deal with such rough conditions as found in Finland. Specialized equipment, winter clothing, and other necessities will be prioritized for our artillery crews, and the guns themselves will be outfitted and made resistant to snow, sleet, and rain. With these improvements, we will be able to destroy Finnish positions even in their deepest woods and most inhospitable wastes."
 GGR_a_new_perspective:0 "A New Perspective"
 GGR_a_new_perspective_desc:0 "The military corruption and bloat that our regime has inherited was widespread and has proven to be a massive thorn in our side. Our methods of strategy and tactics seem to be permanently stuck in the era of the 50s and the West Russian War - no, it may be even worse than that. Our military planners seem to be operating under the assumption that this is still the Second World War! It goes without saying how dangerous this mindset is when trying to conduct modern warfare. If we don't take efforts to curtail this soon who knows what kind of troubles we could find ourselves in as the scales of our operations increase. For this reason the Führer has ordered a comprehensive review of our most recent actions in reclaiming the Reich's territory. We will sift through all of our actions, adopting the methods that work, and leaving behind what no longer does. We just have to hope that Schörner and his cronies don't hamper our plans too much..."
 GGR_russian_mercenaries:0 "Russian Mercenaries"
 GGR_russian_mercenaries_desc:0 "Germans hate Russians, and Russians hate Germans. This is a way of life in today's times, and we see no reason to change it. However, Russians don't hate money or guns, and if there's one thing that we Germans have, it's money and guns. By handsomely paying some of the more cooperative Russians in the east, giving them a gun, and pointing them in the direction of Helsinki, we can hopefully use such Untermensch as cannon fodder, soaking up casualties while the Heer does the real work. Even better for us is that the Finns have seized what is considered rightful Russian territory, which only motivates those we recruit to fight even harder than normally. Instead of thousands of Aryan lives being ended prematurely, we can hopefully spend thousands of useless Russian lives instead. With the colonial divisions and the Russian mercenaries, one must wonder whether a single truly Aryan life will even be lost in this campaign."
 GGR_offer_them_a_choice:0 "Offer Them A Choice"
 GGR_offer_them_a_choice_desc:0 "With the pieces in place, the Kriegsmarine off the coast, the armies of the Reich all around the borders, and the Luftwaffe primed and ready to fly, one can only feel a pang of sympathy and mutual feeling with the Finns. After all, they did aid us in the war against the Russians, and having such fierce fighters and Nordic men on our side would only be a plus. Besides, with such a show of force along their border, they must be shaking in their boots with fear. There is no need for any German lives to be wasted over a nation which has served as our proud ally and can serve as our friend again. Our Führer himself has ordered operations to be stalled for a short period, enough to give the Finns an ultimatum. They now have a choice- Join the Pakt and cut off relations with enemy powers, effectively becoming our ally again, or be crushed under the German boot and become a Reichskommissariat. While the militarists in our government, such as Schörner, have lobbied for an immediate invasion, they have been muzzled for now.\n\nNow, there is silence in the north. With bated breath, all of Germany waits for the Finnish response. "
 GGR_rush_to_the_landing_point:0 "Rush to the Landing Point"
 GGR_rush_to_the_landing_point_desc:0 "Our boys now stomp over the sand and soil of Finland, and our support is necessary to keep them there. Our landings have been a total success so far, but we must pour more men into the beachhead or the Finns will throw us out. By diverting all sorts of boats to the landing zone, clearing the waters of any remaining obstacles, and fast-tracking forces to the necessary ports, we will be able to rush men across the Baltic and into the breach.\n\nWith a successful landing, we will be able to slide by the chokepoints and fortifications that Finland has built in the last few years, deftly evading them and rushing to Helsinki. With a failed landing, not only will we have to deal with the fallout of thousands of dead sons of the Reich, but we will have to take the less elegant strategy of ramming our heads against their fortifications. Obviously, there is a problem with that. Therefore, speed and supply is the key words here, if our victory is to be swift."
 GGR_blocker_battalions:0 "Blocker Battalions"
 GGR_blocker_battalions_desc:0 "With our assaults into the Finnish lines, we have received word of a strange, though not unexpected setback- it seems the Russian mercenaries we have hired are simply too cowardly to charge into the guns of the bunkers, and have taken up the nasty habit of running away when the going gets rough. While this may be acceptable for the average Slavic commander, it is well below par for our army. To counter this, we will borrow an old tactic from the Russians themselves. The usage of \"Blocker Battalions\"- troops specifically for the purpose of stopping retreats- will undoubtedly give the weak-willed natives more incentive to stay on the attack. After all, any reasonable man will take a chance of death at the hands of the Finns than a certain one at the hands of their own brothers in arms."
 GGR_a_chance_for_redemption:0 "A Chance for Redemption"
 GGR_a_chance_for_redemption_desc:0 "The Finns break before us, their fortifications shattering as they run for their forests with our tanks nipping at their heels. In any other case, Göring would order the pursuit and total annihilation of their army. However, Göring still feels a certain kinsmanship with our erstwhile allies, and has the mercy to offer them another deal. This deal is fairly harsher than the original offer, but perhaps they should have taken the first deal if they wished for such kind terms. The new offer is clear and concise- become a Reichskommissariat willingly or refuse and become one forcefully.\n\nThough there is some concern that giving them another option is disrespecting those who sacrificed everything for this conquest, and some more who believe that the Finns may reject these new terms out of a sense of pride and foolish bravery, there is still hope in the Oberkommando that Helsinki will see reason. Once again, all of Germany waits for the response."
 GGR_towards_sweden:0 "Towards Sweden"
 GGR_towards_sweden_desc:0 "With the Finnish lion having been laid low by the sword of the Heer, our gaze now turns to the other big cat of Scandinavia- the Swedish tiger. The Swedes have watched oue obliteration of the Finns with dread and shock, and subsequently have heavily reinforced their border, and it is only fair that we do the same. After all, they are undoubtedly to be one of our next targets.\n\nWith staging grounds, airfields, and fortifications building up on the border, we will prime ourselves for a strike directly into the heart of the tiger that has defied our rule for so long, doing something that Hitler himself could never do. "
 GGR_northern_tank_experiments:0 "Northern Tank Experiments"
 GGR_northern_tank_experiments_desc:0 "A curious, extremely frustrating and dangerous flaw has come to our attention during the invasion of Finland- our tanks, famously reliable in central and southern Europe, seem to struggle mightily with engine and heating problems in the frigid northern tundras. These problems directly led to the death of multiple brave tank crews, who had the extreme misfortune of their tanks breaking down in the middle of heated engagements. This is absolutely unacceptable, but we must also contend with the issue that this is a problem that is specific to the far north, and is needlessly expensive and useless anywhere else.\n\nTherefore, we have elected to test out a new variation of our tanks, complete with extra heating, padding, and snow camouflage. These tanks, once run through trials, promise to never have the problems our standard tanks to, and will undoubtedly save hundreds of lives in the upcoming invasion."
 GGR_towards_russia:0 "Towards Russia"
 GGR_towards_russia_desc:0 "With the Finnish lion having been laid low by the sword of the Heer, our gaze and ire turns to our constant, undying foe- the Russian Bear. The Russians have watched our conquests with growing suspicion and worry, and even now prepare their meager forces to defend themselves from our inevitable invasion. To counter this, we shall utilize our new territory to gain another angle of attack into the Russian heartland, positioning our crack troops and tanks in ways where they can do as much damage as they can. This way, the Russians will fall like a rotten house when we inevitably knock at their doors."
 GGR_extend_the_ostwall:0 "Extend the Ostwall"
 GGR_extend_the_ostwall_desc:0 "With out forces at the gates of Central Russia now, it is only prudent that we expand our fortification lines to cover the new, northern sections of our border. Preliminary reports show that a Russian attack may be launched at us if hostilities are declared, in the hopes to knock us off guard. This cannot be allowed to occur, and no Russian can be allowed to sneak through our lines. By bunkering down and holding our ground, we will shatter these waves like rocks, and push forward into the bloody tide, hacking and shooting our way through anything, Of course, the Slavs are no real threat to a good German, but one can never be too prepared."
 goering.lapland.1.t:0 "Naval Exercises Begin"
 goering.lapland.1.desc:0 "With operation Lappland now in its planning stages, the Kriegsmarine has been granted clearance to perform maneuvers in the Baltic, ostensibly to continue training. Of course, these moves are nothing more than a show of our military might to the Finns, in the hopes that they see the hopelessness of their situation and return to our side in the Einheitspakt. With our massive fleet of battleships, destroyers, and frigates roaring by, they will surely see the light and join us. Of course, however, this is not a sure thing. It is believed within the Oberkommando that, if our maneuvers are too small or too concentrated, the Finns will either ignore it or, if they are feeling foolish, attempt to counter our movements. While Göring firmly believes the Finns would never be so utterly stupid as to counter the might of the Reich, the Finnish government has always been known for its rather foolhardy streak. A confrontation in the Baltic Sea could lead to a war before we are ready.\n\nOn the other hand, running so many ships at once will cost an absolute fortune in fuel, and that's not even factoring in the Luftwaffe's attempts to be involved in these exercises. The bigger the exercise, the higher the cost, and with the shape of the economy, perhaps spending hundreds of millions of marks to threaten someone is not the best move. However, having too little of a force could lead to our moves being countered, or ignored. The choice falls to the Führer."
 goering.lapland.1.a:0 "Send everything! There can be no mistake!"
 goering.lapland.1.b:0 "Send the Fleet and the Luftwaffe, so they will cower at our might."
 goering.lapland.1.c:0 "We don't need the Luftwaffe. Send the Kriegsmarine only."
 goering.lapland.2.t:0 "They Fell For It"
 goering.lapland.2.desc:0 "Great news has been reported to us from Naval Command. It seems that the Finns have been threatened, or perhaps frightened, by the mock bombing runs the Luftwaffe has performed on their ships. In response to this, they have deployed even more of their naval assets to \"defend their coasts\". This sort of escalation, while dangerous, may be exactly what we want. PResumably, the Finnish government will be in a tense state of fear. If we bait their fleet into attacking part of our own, we will have a justifiable cause to obliterate their navy without even declaring are! Unsurprisingly, Schörner and his clique have argued mercilessly for this, though some even wish to simply attack their navy either way. The more moderate members of the Oberkommando, however, argue passionately against such a plan, as it would be a major escalation of hostilities without our armies being fully in place. The decision, once again, comes down to the Führer."
 goering.lapland.2.a:0 "No need for bloodshed. Continue as normal."
 goering.lapland.2.b:0 "See if we can bait them out."
 goering.lapland.3.t:0 "The Lion Hunt"
 goering.lapland.3.desc:0 "The admiral watched with growing concern as the ships steamed closer and closer towards his fleet. He and his ships had been sent out here, ostensibly to \"survey Finnish defenses\". His protests that the route assigned to him took him directly through Finnish waters went unheeded. Now, as the Finnish Navy grew closer and closer, he cursed the fool who had sent him on this doomed expedition.\n\nThe first shell sailed over the flagship, detonating about 500 meters behind them, and the radio began to clatter. Sirens wailed as men rushed to battle stations, and the Captain wondered what wrong he had committed to get him locked into such a suicidal posting. Indeed, even as the guns began to roar a response to the Finn's attack, the admiral knew it was a doomed effort. After all, this was the Finnish navy at nearly its full might, brought to enforce its waters and, presumable, remind Göring of who held the power. It was almost as if they were bait, or perhaps cannon fodder. The admiral could only hold onto his railing and pray for a mercifully quick end. Perhaps he would be able to take a few Finnish ships with him.\n\nSuddenly, a siren rose and stood out among the chaos. The admiral's head shot up to see a magnificent sight- the Luftwaffe's bombers, suspended in mid-air like raptors descending upon their first prey of the day. Below them, the Finns belatedly tried to dodge and weave, but their ships were too heavy and their reactions too slow, and the leading ships went up in flames. They were not the last.\n\nBy the end of the skirmish, thousands of Finns sank to their watery graves, and their boats went with them. The entire Finnish Navy, sent out to deter an attack, had been made into a graveyard by the Luftwaffe. The admiral could only giddily grin as he watched the last bombs fall on the final ships. Truly, Germany was the greatest again."
 goering.lapland.3.a:0 "An absolute slaughter!"
 goering.lapland.4.t:0 "The Finns Mobilize"
 goering.lapland.4.desc:0 "Despite our best hopes to bait the Finns into attacking us, it seems our attempts have fallen short. The Finns, though they have mobilized their fleet, have not fallen for our tricks, and have remained on the defensive. Without them attacking us, we have no way to destroy their fleet, outside of declaring war. This second option, while it is our end goal, cannot be done yet. If we are to attack their fleet while it is still in harbor, without provocation, it will drag us into a war we are not yet into position for, costing us unnecessary casualties and time. Though the militarists of our cabinet argue that this would simply be a price to pay for an easy victory, Göring himself has seemed unsure, and has refused to attack them without them starting it. Unfortunately, this seems like it will not happen. The exercise will continue, of course, and perhaps another action will drag them out of their holes, but for now, we are stuck."
 goering.lapland.4.a:0 "A shame."
 goering.lapland.5.t:0 "No Incidents Reported"
 goering.lapland.5.desc:0 "After multiple weeks of naval exercise, our ships have returned to harbor. They report stellar results, perfect time, great shooting, and all sorts of other things that, in any other case, would have led to high praise, promotions, and champagne showers all around.\n\nThat is not the case today.\n\nThe mood around the Oberkommando can best be summed up as disappointed. The exercises, which were promised to bring the Finnish government to such a fury that they would sacrifice their fleet in blind rage, have returned with absolutely nothing to that end. The Finns remained calm, cool, and collected, and refused to engage the Kriegsmarine at any point during the sailing. Even when a fleet was directed straight into Finnish waters, their fleet remained idly in harbor. Nothing thrown at them could even make them flinch.\n\nThough this failure is undoubtedly disappointing to the High Command, the fact remains that the Kriegsmarine and the Luftwaffe performed admirably in their assignments. If nothing else, at least we know that our forces are skilled, trained and ready for the upcoming task."
 goering.lapland.5.a:0 "A minor setback on the road to victory."
 goering.lapland.7.t:0 "Swastika over Aland"
 goering.lapland.7.desc:0 "Unterfeldwebel Linkwitz stepped gingerly over the shattered bunkers and positions, taking care to not lose his step. The occasional rifle shot punctuated the relative silence that had fallen over the island. From where he stood, he could see the soldiers on the beaches, moving like ants as they carried various supplies from one place to another. However, Linkwitz was not here to see the sights of the invasion. He was here for one reason only.\n\nAs he continued his slow trek up the hill, he regularly passed small lines of Finnish prisoners, who slowly marched down the hill in chains. Wehrmacht soldiers cheered and whooped as they dragged them down towards waiting boats. Linkwitz smiled, but said nothing. He was not yet at his destination.\n\nFinally, as he quickly stepped over the body of a dead soldier, Linkwitz reached his spot. The wind whipped the hill as a platoon of soldiers struggled with a flagpole. Above them, the Finnish flag waved defiantly and proudly, refusing to fall as the islands had. Finally, in a bout of frustration, one soldier stepped back and emptied a magazine into the flag. The white and blue shreds fluttered over the battle, and the now ruined flag finally came down.\n\nLinkwitz wrangled his camera into position and inserted the film as the soldiers attached the red and black of the Reich to the flagpole. When the flag began to rise up the pole, Linkwitz captured the pictures of a triumphant Reich, with another glorious conquest under its belt."
 goering.lapland.7.a:0 "One step closer to legend!"
 goering.lapland.8.t:0 "Swastika In Ruins"
 goering.lapland.8.desc:0 "Unterfeldwebel Linkwitz smiled as his landing boat grew closer and closer to the beaches of Aland. His camera clicked rapidly as he snapped photo after photo of tens of landing boats rushing towards the shores, silhouetted by flares and spotlights. The Finnish garrison, while tenacious, could not hope to put up a fight against the sheer weight of the Wehrmacht. Linkwitz's job now was to simply take as many pictures as he could, and send them home to Germania to be used in the next edition of the party newspapers. His smile grew as he imagined the pictures he would take- shattered bunkers with triumphant soldiers above them, the swastika over the islands, lines of Finnish prisoners- a propagandists dream.\n\nSuddenly, a light washed over the deck of the boat, and the side of the boat was shredded with machine gun fire. Boats erupted into flames as confused men poured over the side and into the icy waters of the Baltic. Linkwitz looked over to see a fleet of ships, each waving the Finnish flag above them, charging the near-defenseless ships. As he watched in abject horror, he didn't see the torpedo coming towards his ship until it was too late.\n\nThe boat disintegrated in the blast, and with it went every man inside. The camera slammed into the water and floated for a moment, capturing the chaos and confusion of an absolute slaughter for a last moment before sinking to the bottom."
 goering.lapland.8.a:0 "They'll pay for this one!"
 goering.lapland.9.t:0 "A Fresh Look"
 goering.lapland.9.desc:0 "With the realization that the Finns will be a tough fight comes a stellar opportunity for fixing many things with our army, Currently, even as great as our glorious Wehrmacht is, there are still multiple problems in relation to its structure, bloated bureaucracy, and poor training. These problems are not specific to the Wehrmacht, much to our chagrin. Indeed, these same issues have embedded themselves, one way or another, into each and every one of our military branches. Before Lappland, these problems were entirely unassailable, due to our constant rhetoric about how the Wehrmacht is the best on earth. Now, with the cover of \"training our men for our next conquest\", we have the perfect opportunity to remove the worst offenders from our ranks.\n\nUnfortunately for our plans, it seems the militarists have caught some wind of this scheme, and have stepped in to stop it before we got too far. Reportedly, Schörner and his clique are furious with the Reichstag and the Führer, as many Schörnerites have been caught up in this. However, we have managed to make some form of dent into the corruption that permeates our armed forces. Already, missing equipment instances and cases of lost cash deposits have dropped, giving us more to work with. As a result, our troops are already doing better in their drills, and many seem more motivated than before.\n\nThough we may never have an opportunity like this again, at least we know we have done something."
 goering.lapland.9.a:0 "If only Schörner would get out of the way."
 goering.lapland.10.t:0 "Dreschler Stonewalls Us!"
 goering.lapland.10.desc:0 "The reforms the Wehrmacht has recently undertaken have not been held exclusively for the Fatherland. Indeed, all of our current Reichskommissariats were ordered to follow our lead and root out the worst offenders in terms of corruption, allowing their troops to get the equipment they deserve. Though most of our Kommissars have followed our orders, as they are supposed to, one in particular has the gall to defy us.\n\nDreschler, the militarist buffoon and staunch Schörnerite of Ostland, has presumably taken a single look at our request, panicked, and immediately ignored it. In fact, he has all but ignored every form of communication we have sent him in relation to the anti-corruption drive.\n\nThis complex situation would normally resolve in our government immediately dismissing the man from his post. However, nothing is normal in Göring Reich, and Schörner has personally stepped in to defend the man from any attacks on his job. This ridiculous scenario, which once would have been inconceivable, now leaves us in a serious bind. We are unable to remove the insubordinate Dreschler from his post, now that Schörner has stepped in behind him, but we are also unable to simply ignore this grievance from a Reichskommissar to his superiors. For now, the relations between Ostland and Germany reach a new low, as both sides uneasily watch each other from across the border."
 goering.lapland.10.a:0 "Why is it always Dreschler?"
 goering.lapland.11.t:0 "Finland Rolls Over"
 goering.lapland.11.desc:0 "When the ultimatum was sent, every single division bordering the Finns was placed onto high alert. Thousands of planes were primed and readied, boat after boat was fueled and staffed, and hundreds of artillery pieces aimed, loaded, and readied themselves for the conflict that seemed to be inevitable. After all, the Finns had not surrendered to arguably worse odds back in 1939. Why would they surrender to the same odds today? Clearly, war was inevitable, and so the armies of the Reich prepared.\n\nEvidenltly, the Finns did not see it the same way.\n\nUnbelievably, the Finns have done the one thing we did not expect- they have given in, and offer now to join us with no questions or conditions. A stunned silence overtakes the Oberkommando, and permeates to the Führer's office. Out of all the things expected of the Finns, surrendering to us was not one of them.\n\nNow, there is an unfortunate problem on our hands. Though the Finns have, in all effect, joined us, the cost of readying for this war has been some of the highest so far. Tens of thousands of men had to be retrained, thousands of tanks had to be retrofitted, thousands of planes and ships brought north. For this to have all been for nothing is unacceptable to the militarist branch, who demands we invade anyway and take over directly.\n\nThis demand is complicated by the fact that we promised multiple benefits for the Schörnerites that would be obtained from Finland's resources, lands, and riches- all of which are now unobtainable. On the other hand, to invade a surrendering nation would undoubtedly look horrific to the outside world, and would severely hurt our odds on ever allying with anyone outside the Reich again. "
 goering.lapland.11.a:0 "Welcome to the Pakt, brothers!"
 goering.lapland.11.b:0 "Welcome to the Reich, brothers!"
 goering.lapland.11.c:0 "Damn the treaty, full speed ahead!"
 goering.lapland.12.t:0 "Finland Stands Strong"
 goering.lapland.12.desc:0 "When the ultimatum was sent, every Wehrmacht unit on the Finnish border was placed onto high alert. Thousands of planes were readied and fueled, and sailors sprinted to their posts as the ships of the Kriegsmarine slipped their moorings. All was quiet in the Baltic as hundreds of thousands awaited the inevitable.\n\nSo when the inevitable came, and the ultimatum returned with a refusal attached to it, the army of the Reich was ready. All at once, thousands of men received the notification the entire world expected. A state of war now existed between Finland and the Reich, and it was the duty of every soldier to fight for his Fatherland and continue the glory of the Reich.\n\nSome were nervous when they heard this. Some were resigned. Mostly, the men did not care. This was but a simple conquest in a line of endless conquest, one that would eventually end in a titanic struggle against the West and East alike. What good did it do to worry over this invasion in particular? After all, there would be another after it, and then another, and another.\n\nAnd so the men of Germany marched into another free nation, not for glory or fame, but for the continuation of an endless loop."
 goering.lapland.12.a:0 "It was bound to happen one day."
 goering.lapland.13.t:0 "Finland Gives Up"
 goering.lapland.13.desc:0 "To the surprise of many in our high command, it seems that the Finns have seen reason. Our second ultimatum, much harsher than the first, has been accepted by the Finnish government. All around Finland, the troops of the Finnish Army watch helplessly as our men plunder and loot the cities and towns they bled to defend. The Finnish Navy can only look on as we boar their ships, commandeering them for our own purposes. As preparations are made for our victory parade in Helsinki, it seems that the general mood of the Finnish people is one of shock.\n\nUnfortunately, even though the government has given in, it seems that some of the people will not. Even now, thousands of Finnish soldiers and civilians disappear into the forests and marshes, waiting to strike against us and disrupt our plans. Of course, these will be no trouble to defeat by our glorious Wehrmacht, but they still could pose a problem if they grow large enough.\n\nFor now though, these problems are ignored, and the people of Germany celebrate as another conquest ends in a glorious victory for the Reich."
 goering.lapland.13.a:0 "We are masters of Scandinavia!"
 goering.lapland.14.t:0 "Finland Is Stubborn"
 goering.lapland.14.desc:0 "Unbelievably, our offer of salvation to the Finns has been rejected again. Our ultimatum was returned to us with a short, sharp \"No\", with no other reason or diplomacy attached. This incredible showing of insolence to our Führer, who took the time to write and send the ultimatums himself, will not be forgotten when we inevitably succeed in our conquest.\n\nFor now, however, we are still stuck in Finland. Our armies once again prepare themselves to keep up the assault, as they have been for weeks now. It is of the utmost importance, however, that we win this war fast.\n\nAt home, the mechanisms of Germany's economy begin to grind to a halt as the steady stream of loot they run on runs dry. If the riches that Finland have are not soon seized, the collapse of the economy, and perhaps Germany as a whole, will be inevitable.\n\nPerhaps the Finns believe that they can wait long enough for our economy to fall, surviving our invasion entirely. Of course, this is a deluded fantasy. Our victory will be short, sweet, and swift. It must be. The Reich depends on it."
 goering.lapland.14.a:0 "We must move quickly!"
 goering_peace_events.10.t:0 "The Conquest of Finland"
 goering_peace_events.10.desc:0 "Just like all other aspects of Göring's Germany, the subject of the occupation of Finland was rapidly devolving into yet another chance for the various factions of the Militarists to compete with each other. Schörner and Speidel were at each other's throats once again, fighting each other harder than they fought the enemies of the Reich, much to the Führer's endless dismay. Pragmatism and dogmatism were on full display as disagreement became an argument, with only their pride and discipline preventing it from devolving into a full-on brawl.\n\n\"Those damn Mongoloids resisted us once, and they'll continue to do so for as long as the very concept of Finland still exists. Their betrayal of the Aryan people is proof of their innate genetic duplicity; they get the same treatment as the Russians.\" Schörner insisted, looming over Göring's desk, ready to pounce at the slightest sign of weakness. Speidel, for his part, hadn't moved a muscle since he took his position in the room to offer his Heil, other than crossing his arms in disgust. \"If they had accepted our demands, you would have used that as proof of their 'genetic cowardice' or some such nonsense and demanded the exact same thing from them. Mein Führer, the Finns have a proven record of hatred for our enemies. If we act quickly, we can still make loyal subjects out of them, and ensure that their martial prowess works for us rather than against us.\" The commander-in-chief countered, much to Schörner's dismay.\n\nAs his puppet master began to express just how offended he was by the very notion of Finland possessing any 'martial prowess'-conveniently forgetting that operation Lapland had produced far more casualties than projected-Göring could only sigh, resigning himself to the fact that he would have to deal with many such disagreements in the future. If it was up to him, he would have cut the Gordian Knot and just have them both killed...But suppose he could resolve for the next best thing.\n\n\"Both of you are forgetting something very important.\" The Führer declared, speaking for the first time since the disagreement began, drawing the attention of both men. \"That being that neither of you should care about this. Reichskommissar Lemm has my full confidence in governing the lands of the Finnish people. The severity or leniency of the occupation has been delegated to him and him alone.\" Both the Reichsprotektor and the Monster scoffed angrily at the idea, refusing to be denied, refusing to be dismissed, but Göring had had enough."
 goering_peace_events.10.a:0 "If you're still that concerned over it, I'm sure he would be happy to hear from the both of you."
 GGR_not_invaded_finland_tooltip:0 "We have not yet started the invasion of §YFinland§!\n"
 GGR_finland_conquered_tooltip:0 "We have succeeded in the conquest of §YFinland§!\n"
 GGR_naval_manoeuvring_tooltip:0 "§YWe will test the Finnish navy before we attempt to seize Aland, this way we can also test the Finnish resolve to fight.§!\n"
 GGR_seize_aland_tooltip:0 "§YWe will ready our navy and army to seize Aland at once. The Finnish nation is powerless before the mighty Reich.§!\n"
 GGR_a_new_perspective_tooltip:0 "§YWith all our new additions to the Reich it is time to rethink our traditional way of doing things, maybe our new subjects could be of use for this.§!\n"
 GGR_russian_mercenaries_tooltip:0 "§YWe will need more soldiers experienced in these harsh northern climates. We may not like it but hiring Russian mercenaries is our only viable choice.§!\n"
 GGR_offer_them_a_choice_tooltip:0 "§YWe will offer the Finnish people a simple choice: Join the Pakt or perish.§!\n"
 GGR_rush_to_the_landing_point_tooltip:0 "§YWe have landed on Finnish soil! We must reinforce the landing point as quickly as possible§!\n"
 GGR_a_chance_for_redemption_tooltip:0 "§YThe Finns have been beaten! We will grant them another chance to surrender and spare their people the horrors of war.§!\n"
 FIN_reichsland_long: "Nationalsozialistische Deutsche Arbeiterpartei - Finnland"
 FIN_reichsland_short: "NSDAP-F"
 GGR_operation_margarethe:0 "Unternehmen Margarethe"
 GGR_operation_margarethe_desc:0 "Operation Margarethe, the invasion of the traitor-nation of Hungary.\n\nThe invasion won't be complex, — the worthless Magyars are extremely weak, what threat would they pose to the might of the Reich? But the strategic position of the nation, nestled as it is between the Danube and the Carpathians, makes it an ideal staging point for the Reich's expansion into the Balkans.\n\nFührer Göring has made his decision, whether the traitors of the heirs of St. Stephen are plotting with the Reich's enemies is immaterial, the strategic position they offer is simply too important to let them remain outside the Reich."
 GGR_slovakian_remilitarization:0 "Slovakian Remilitarization"
 GGR_slovakian_remilitarization_desc:0 "In his infinite wisdom decades ago, our beloved Führer made the decision to liberate the Slovaks from their Bohemian overlords, yet this liberation was not total as the Hungarians demanded a share of lands that were not theirs by right or deed. In his generosity the Führer granted this request, hoping that the alliance forged would lead both the Magyars and Aryans into a glorious future.\n\nThis was a mistake.\n\nWhilst the Reich could undoubtedly crush the insect of Hungary in mere weeks there are many things to do, forces to deploy to a great number of battlefields throughout the Reich, and the assistance of the Slovaks would ease the burdens placed upon Germany by a small amount. In return for surplus tanks, rifles and ammunition from our past wars the Slovaks shall provide both a staging ground and a significant force for Fall Margarethe.\n\nIf they acquit themselves well they may even be granted a reward."
 GGR_an_efficient_invasion:0 "An Efficient Invasion"
 GGR_an_efficient_invasion_desc:0 "Whilst operation Margarethe will undoubtedly be an easy task, there is no need to take chances. Our forces will use the tried and tested blitzkrieg tactics, an armoured fist to pierce the defensive lines, followed and supported by infantry and aircraft to eliminate hardpoints. The Hungarian airforce will be destroyed on the ground if at all possible, and their communication centres too.\n\nOnce this is complete an all out drive for Budapest will take place, after it has been half razed by air attacks of course. This shall be an operation completed quickly and with minimum waste, lest vultures come to pick over the scraps."
 GGR_consider_this_a_test:0 "Consider this a Test"
 GGR_consider_this_a_test_desc:0 "Operation Margarethe will be an easy one, it will offer no challenge to our troops and no obstacle to our long term plans. Why, therefore, should we not test our wunderwaffe that will eventually be used upon the Americans and Japanese in a more... controlled environment?\n\nIt will carry no long term risk, and most assuredly it will be more difficult for our foes to piece together the secrets behind our superweapons if we use them out of sight in the Magyar homeland.\n\nAll weapons require tests, and Fall Margarethe is merely a large scale one before our ultimate victory."
 GGR_an_all_armored_assualt:0 "An All Armoured Assault"
 GGR_an_all_armored_assualt_desc:0 "The superiority of the Übermensch in undoubted, but all the same it would be a waste to lose even a thimble of German blood to the Hungarians. A great mechanised assault, mirroring our victory over the French all those years ago, is the simplest method for solving the Hungarian problem quickly and without issue.\n\nThe speed granted by not limiting ourselves with unsupported infantry will prove useful on the Pannonian Plain, and in urban combat it is often better to have a hammer ready when for when you spot a fly.\n\nVisions of grandiose assaults are what almost lost the West Russian War, we shall not make the same mistake twice."
 GGR_overwhelm_the_border:0 "Overwhelm the Border"
 GGR_overwhelm_the_border_desc:0 "German superiority is innate and unquestioned, why not use it?\n\nThe simpler a plan is the fewer points within it that can go wrong, and the plan for  Margarethe is as simple as it gets. From Karpatenukraine to Budapest, our troops shall not stop. A massive all out assault along the entire border shall sweep aside whatever paltry forces the Magyars can scramble to defend with, and without a clear front to place troops along our surprise shall allow for absolute victory.\n\nThere are those within the General Staff who question if resources could not be better spent, but how better to utilize our armies than proving the invincibility of the German Reich?"
 GGR_a_quick_war:0 "A Quick War"
 GGR_a_quick_war_desc:0 "The time has come, preparations have been made and the plan of attack decided.\n\nOur allies are ready, our troops are eager and the Führer himself has said the war will likely be over in weeks at most. The Magyar scum who betrayed the Reich in its darkest hour, despite all we had done for them, shall reap that which they sowed.\n\nLaunch operation Margarethe. Heil Göring."
 GGR_occupation_is_tiring_work:0 "Occupation is Tiring Work"
 GGR_occupation_is_tiring_work_desc:0 "With our occupation of Hungary, the local populace appears to object. Whilst not a daily occurence, in some regions such as Budapest riots have been overwhelming garrison forces sent to quell them.\n\nA solution suggested by the Führer is donating some of our more outdated equipment, especially from the Soviet War, to military police and garrison regiments, so as to ensure the efficient running of our operations in the region."
 GGR_the_grip_tightens:0 "The Grip Tightens"
 GGR_the_grip_tightens_desc:0 "Hungary was permitted self rule in a gesture of benevolence from the previous Führer, but no longer shall this be the case. As a rightful part of the Greater German Reich, Hungary shall be ruled directly from Germania as a series of military commissariats. All resources abundent to the region shall be turned in service of the Reich, and its people too shall assist the growing war machine that will propel Germany into the future."
 GGR_the_gateway_to_the_balkans:0 "The Gateway to the Balkans"
 GGR_the_gateway_to_the_balkans_desc:0 "The ultimate reasoning behind operation Margarethe was not the importance of Hungary itself, but rather its position as related to the Balkan nations and most especially Romania. A Danubian frontier allows the Reich free access to the wealth and industry a conquest of the Balkans would produce, though whether this is the path that should be embarked upon immediately is the decision of the Führer.\n\nWith the easy conquest of south-eastern Europe tantalisingly within reach, things are looking good for the Reich."
 goering_peace_events.3.t:0 "The Conquest of Hungary"
 goering_peace_events.3.desc:0 "\"I can't believe my father actually used to fight alongside these animals.\" Joachim smoked a cigarette with one hand and steadied his rifle with the other as he rode through what remained of Budapest in the back of an old Hanomag AL28. It was fifteen years outdated and more for civilian use than military, but it was still probably the most advanced piece of hardware these Huns had ever seen in their lives. Then again, it probably wasn't the truck they took issue with.\n\nMost of the Hungarians were passive, hardly noticing the presence of Joachim and his team, instead trying to dig through the rubble that was once their houses and places of work, or keeping their head down as they walked the streets in a desperate attempt to move their lives forwards despite the tragedy that had befallen their nation, or even just flat out grieving on the ground, right then and there. But of the few who weren't doing any of those things, the majority of them were staring at him with hatred and despair in their eyes. They glared accusingly, questioningly, as if to ask, 'How could you do this to us?'\n\nThey were met with nothing but cold indifference at best, and taunting grins at worst. Joachim wanted to let them know that they should enjoy the privilege while it lasted; that once they set up their Reichskommissariat, even something as simple as a dirty look might result in a death sentence. Better than they deserved, he figured.\n\n\"Come on, they're not all that bad.\" One of his squadmates, Hans, replied with a grin of his own, his gaze locked on to a young Hungarian woman as they drove by. \"The Russians fought us with Asiatic hordes, didn't they? It's good to have some Asiatic hordes of our own.\" Hans wasn't exactly a history major, but he did know what the propaganda had told him, and from it, he had drawn one conclusion. \"From what I hear, they've always been subservient to Germans when it counts. Better to be garrisoned here with them then thrown back onto the frontlines, right?"
 goering_peace_events.3.a:0 "The two soldiers laughed, as St. Stephen wept. "
 GGR_ally_with_hungary: "Ally with Hungary"
 GGR_tighten_the_leash:0 "Tighten The Leash"
 GGR_not_invaded_hungary_tooltip:0 "We have not yet started the invasion of §YHungary§!\n"
 GGR_hungary_conquered_tooltip:0 "We have succeeded in the conquest of §YHungary§!\n"
 GGR_hungary_refuses:0 "§YHungary§! declines the ultimatum"
 GGR_operation_tepes:0 "Unternehmen Tepes"
 GGR_operation_tepes_desc:0 "[ROOT.GetGGR_romania_status]Devoid of honor or goodwill, ignoring the gains they made through our blood and sacrifice in Transnistria, the Romanians are a representation of everything wrong with the eastern mindset. Now it is time to show these dogs that Germany does not forget slights made against it, and always has its due in blood."
 GGR_hungary_conquered:0 "With the Magyar threat dealt with it is time to focus our attention on the last true traitor in Europe. The Triumvirate were, for better or worse, at the least fascist if not aligned with the Reich, something that cannot be said for the Romanians.\n\n"
 GGR_unleash_the_dogs:0 "Unleash the Dogs"
 GGR_unleash_the_dogs_desc:0 "The Serbian Garrison have some of the finest battle-ready units at the disposal of the Reich. Well drilled, decently equipped and all veterans of decades of anti-partisan warfare, if they were to have sided with any particular figure in the civil war it might have made victory difficult.\n\nThey survived being all but abandoned by the callous politicians of the Reich who opposed our Führer, but now we have an opportunity to reconnect our supply lines with theirs, and send them into one final, and glorious campaign."
 GGR_go_fetch:0 "Go Fetch"
 GGR_go_fetch_desc:0 "The Romanian hostility towards the Belgrade government is something that could be used to the Reich's advantage. Whilst undeniably a pathetic army and one populated by slavs at that, the Serbians with our support could present quite the thorn in a Romanian expeditions side. Should we pass on that the Serbs are preparing an attack on Romanian soil then we might bait two of our problems into dealing with each other.\n\nAnd leave the Reich in a prime position to sweep over the remains."
 GGR_new_enemies:0 "New Enemies"
 GGR_new_enemies_desc:0 "Why should the Reich bow down to the half turkic spawn of slavs? Bulgaria is not the master of the Balkans, that title belongs to the Reich and the Reich alone. There will be no compromises, no discussions, and no mercy for our failure of a former ally.\n\nPlans for the occupation are being drawn up, along with candidates for the Garrison of the area. Regardless of their assistance in times old, now is a new age of conquest. It's just business."
 GGR_the_carpathian_fortress:0 "The Carpathian Fortress"
 GGR_the_carpathian_fortress_desc:0 "The primary military challenge in taking Romania comes not from its people, week and softened by peace as they are, but instead from its natural formations. The mighty Carpathian Mountains and the Danube River. Serving as supply depots, bunkers and chokepoints, the borders of Romania assist it in maintaining its defence.\n\nThis does not however, make the nation invincible. Mountains can be flown over, and rivers bridged across. Romania has relied on its natural borders to protect its soft heart.\n\nNo more."
 GGR_through_them:0 "Through Them"
 GGR_through_them_desc:0 "Sometimes the simplest solution is the best one. Whilst we could create a resource intensive and danger fraught plan to pass the Carpathians, it might be best if we simply took them by force.\n\nAn armoured assault, followed by copious artillery barrages on remaining strongpoints and elite Mountain troops recruited from throughout the Reich should be enough to secure at least one of the passes. In truth, we only need one to ensure our victory."
 GGR_around_them:0 "Around Them"
 GGR_around_them_desc:0 "With our recent conquest of the Ukraine, the Romanian issue has become much less pressing. The wide front along Transnistria and Bukovina will allow our armoured divisions free access into the Romanian heartland.\n\nThe Carpathian strongpoints which the Romanian defensive plans are so reliant upon shall be rendered less than useless just like the vaunted Maginot Line of France, outmaneuvered, and destroyed. That is to be the fate of Romania."
 GGR_fragile_handle_with_care:0 "Fragile, Handle With Care"
 GGR_fragile_handle_with_care_desc:0 "Oil, that most wonderful of materials. Romania has vast quantities of the substance, and strangely enough it's a highly flammable one. Incindiery weapons may not be the most practical of the wunderwaffe, but in setting the oil fields alight they will do their job.\n\nLaunch the bombers, set the targets, and light the world aflame."
 GGR_search_the_archives:0 "Search the Archives"
 GGR_search_the_archives_desc:0 " When the Carpathians were apart of the Österreich, the government had detailed maps of the various Carpathian passages. It is possible, though unlikely, that if we searched in Vienna we could discover passages to move troops through for a surprise attack on the Romanian positions.\n\nFurthermore, though they were traitors they shared defensive plans with the Reich in the war against the Soviets, Germania being spared by the war as it was, it may be possible for our men to find something of use amongst the old war papers."
 GGR_stretching_our_muscles:0 "Stretching our Muscles"
 GGR_stretching_our_muscles_desc:0 "Operation Tepes is more than a mere invasion, it is a demonstration and test of our military capabilities, offering a wide and varied selection of battlefields to test our forces upon. A meagre but present air force will prevent the Lufftwafe from going with work, and even amphibious experience through our Danubian assault.\n\nWhilst not the intended testing ground of many of our more experimental warfare concepts, better to test them in Romania and find them wanting than to do so in a much more valuable theatre of war."
 GGR_a_traitors_fate:0 "A Traitor's Fate"
 GGR_a_traitors_fate_desc:0 "Romania is a traitor nation. It betrayed us, betrayed National Socialism and betrayed its own people. Regardless of its excuses or the difficulty in ensuring its defeat it must be destroyed.\n\nIts political classes shall meet the fates of all who have betrayed the Reich, its soldiery shall serve as laborers in camps, its lands shall be opened up to settlement by a worthy people. A victorious people. A German, people.\n\nWhen our foes look upon Romania, they shall know what fate awaits them should they defy us. Send the message to our commanders, Romania shall fall."
 GGR_keep_the_momentum:0 "New Enemies"
 GGR_keep_the_momentum_desc:0 "Our demonstration was perhaps a bit too.... thorough. More than ever the Reich's enemies send forces to resistance groups operating in the Carpathian highlands and the Danube border.\n\nWe should make an example of those who would fund the destabilization of the Reich, an example that no one will ever forget. Who today after all, remembers the Poles?"
 GGR_a_german_administration:0 "A German Administration"
 GGR_a_german_administration_desc:0 "Once a terrorist organisation, always a terrorist organisation. The Iron Guard helped us its true, but they are an organisation fundamentally dedicated to their vision of Romania, which does not align with our own. Namely, our vision does not have Romania within it at all, just Germany, forever expanding as is its destiny.\n\nOrganise a meeting, kill those who attend and hunt down those who do not. We shall not have a partisan problem if we can preempt its formation."
 GGR_collaborators_in_high_places:0 "Collaborators in High Places"
 GGR_collaborators_in_high_places_desc:0 "Whilst Romania is an integral part of the Reich, there is no reason we cannot offer certain amounts of autonomy for a stable and decidedly peaceful land to rule over. The local far-rightists will make a sane administration, and perhaps more importantly they can offer legions of cannon fodder to support our war effort.\n\nThis state of affairs will not continue forever, but for now it will do."
 GGR_the_lifeblood_of_the_reich:0 "Lifeblood of the Reich"
 GGR_the_lifeblood_of_the_reich_desc:0 "Oil is the backbone of the Reich, of our Panzer fleets and Kriegsmarine. The Reich's technological superiority shall allow us to exploit the Romanian reserves to a degree the traitors could never have envisioned, allowing us to fuel our war effort no matter what embargo is set upon us by the cowards in Tokyo and Washington.\n\nAfter all, everyone needs it."
 goering.tepes.1.t:0 "Vertraulich: State of the Oil and Petroleum facilities around Ploiesti"
 goering.tepes.1.desc:0 "With the progress of Operation Tepes, our team has begun to survey the recently secured Oil and refinery installations around Ploiesti. Unfortunately heavy fighting as well as sabotage acts by holdout Romanian forces have caused considerable disruption and destruction.\n\nFirst estimates calculate the damage at XXXXX Reichsmark, while estimated reconstruction time is estimated to take XXXXX.\nFor the good of the Reich it is recommended to begin the rebuilding process immediately.\n\nHeil,Göring\n\nXXXXX, Ministry of War"
 goering.tepes.1.a:0 "You can't make an omelette without breaking some eggs."
 goering.tepes.2.t: "Ploiesti Oil Fields Resotred"
 goering.tepes.2.desc: "Yap yap yap yap"
 goering.tepes.2.a: "Yappie"
 goering_peace_events.4.t:0 "The Conquest of Romania"
 goering_peace_events.4.desc:0 "Field Marshal Ferdinand Schörner stood next to Militärbefehlshaber Leo Hepp as they both observed the ruins of Bucharest. For Hepp, his presence here was all business; he was to examine the newest territories of the Reich and his Reichskommissariat, determined to perform his duty to his country to the best of his ability. Schörner, meanwhile, was officially here to monitor progress on the occupation, but in reality, it was a naked effort to claim credit for the success of the military operation. \"I swear, the only thing of value that rests in these cursed lands are those damn oil fields.\" The Chief of the OKW declared, wearing his usual sneer.\n\n\"That and the Iron Guard.\" Hepp added, to which Schörner could not help but stare, his face growing even more disgusted in less than half a second. For most men, a glare from Bloody Ferdinand would be more than enough to make them cow, but Hepp was not so easily intimidated. \"I'm serious. They have a soldier's discipline, a barbarian's cruelty, and a dog's loyalty. They'll follow any order we give them; why not make us of that fact?\"\n\n\"They'll obey, for now.\" Schörner nodded, but his expression did not change for a moment. \"But I have no doubt in my mind that they'll betray us when it matters most. They think of Romania as highly as we think of Germany, and with less than half of the justification for it. The minute we show any weakness, they will pounce.\" The Field Marshall insisted, annoyed that this was even a conversation he was having in the first place. \"Perhaps. That is why we will not show them any weakness. Ever.\" Leo countered, remaining resolute; A strong force of collaborators was necessary for any Military Administration, much less one of the planned size of Balkanhalbinsel. Schörner, maintaining that the only ally Germany needs is Germany, could only scoff. \"Let the old man decide, then."
 goering_peace_events.4.a:0 "We'll see how fond of them you are when they hang you on their meathooks."
 GGR_repair_the_oil_fields:0 "Repair The Oil Fields"
 GGR_expand_extraction_operations:0 "Expand Extraction Operations"
 GGR_more_funding_for_Kontinentale_Ol:0 "More Funding For Kontinentale Öl"
 GGR_better_extraction_methods:0 "Improve Extraction Methods"
 GGR_improve_the_ploiesti_oil_fields_category:0 "Improve The Ploiesti Oil Fields"
 GGR_back_to_the_drawing_room:0 "Back to the Drawing Room"
 GGR_back_to_the_drawing_room2:0 "Back to the Drawing Room"
 GGR_back_to_the_drawing_room_desc:0 "The Reichstag is once again filled with a multitude of generals and their staff as the order for another invasion of yet another nation has come. The meeting rooms are filled with maps and the shouting of our great Führer can be heard several times a day. This is the calm before the storm, the storm which will soon extend above yet another nation."
 GGR_back_to_the_drawing_room2_desc:0 "The Reichstag is once again filled with a multitude of generals and their staff as the order for another invasion of yet another nation has come. The meeting rooms are filled with maps and the shouting of our great Führer can be heard several times a day. This is the calm before the storm, the storm which will soon extend above yet another nation."
 GGR_military_garbage_chute_desc:0 "Militärverwaltung Balkanhalbinsel is frankly put nothing more than a military garrison. It moves from country to country surpressing revolts and annexing new territories while living off of the old equipment left behind by the Heer, while being uncapable of producing their own equipment. For this reason the high command has taken to calling this particular MW: The military garbage chute."
 GGR_attack_dogs:0 "German Attack Dogs"
 GGR_attack_dogs_desc:0 "The garrison of old has often been called the Reich's attack dogs but when we ended their foul regime their role in the Reich dissapeared. No longer, with the new contact between Göring's Reich and Chetnik Serbia we have proven to be more than capable of fulfilling this role. While not the most honorable, it secures us a comfortable spot in the Pakt."
 RKB_reichs_fuel_tank: "Reich's Fuel Tank"
 RKB_reichs_fuel_tank_desc: "\"Fuel tank of the Reich\" is a common nickname worn by Romania many years ago, even before Germany's victory in World War II and before the formation of the RK Kaukasien.\n\nAfter two decades and the many changes that the political landscape of Europe has undergone, the need of the German colossus for fuel is again on the agenda, now for the Militärverwaltung Balkanhalbinsel.\n\nIn the shortest possible time, the existing industry on MW's territory was repurposed for the needs of the petrochemical sector, and workers began to work hard on more and more new tranches of finished fuel in the Reich.\n\nThe blood of war flows from the very heart of the Carpathians."
 RKB_reichs_fuel_tank_1_desc: "$RKB_reichs_fuel_tank_desc$"
 RKB_reichs_fuel_tank_2_desc: "$RKB_reichs_fuel_tank_desc$"
 RKB_reichs_fuel_tank_3_desc: "$RKB_reichs_fuel_tank_desc$"
 RKB_reichs_fuel_tank_4_desc: "$RKB_reichs_fuel_tank_desc$"
 GGR_not_invaded_romania_tooltip:0 "We have not yet started the invasion of §YRomania§!\n"
 GGR_romania_conquered_tooltip:0 "We have succeeded in the conquest of §YRomania§!\n"
 GGR_go_fetch_tooltip:0 "§YThe Balkan garrison wil be more than ready to tear into the Romanian border.§!\n"
 GGR_the_carpathian_fortress_tooltip:0 "§YWe will issue specialized equipment to our troops for operations in the Carpathians.§!"
 GGR_fragile_handle_with_care_tooltip:0 "§YThe Ploiesti oil installations are easily broken and the troops should be instructed to exercise extreme caution around them.§!\n"
 GGR_keep_the_momentum_tooltip:0 "§YLet us cut ties with those who assisted us during this invasion.§!\n"
 GGR_back_in_business_tooltip:0 "§MUnlock decisions to improve the Ploiesti oil fields.§!\n"
 GGR_ploiesti_destroyed:0 "The Ploiesti fields have been destroyed!"
 GGR_fragile_oil_fields:0 "Extreme Caution Instructions"
 GGR_operation_peter:0 "Unternehmen Peter"
 GGR_operation_peter_desc:0 "The current state of Serbia is increasingly problematic for our Großgermanisches Reich. For those who govern the region are no longer truly loyal to Germania, either seeking to expand the state's influence and permanently throw the shackles of National Socialist dominance or manipulating us with their false words of comfort. Regardless of who rules over the country, they must be annihilated to ensure the threat to our Fatherland is permanently eliminated. "
 GGR_check_their_strategies:0 "Check Their Strategies"
 GGR_check_their_strategies_desc:0 "Prior to the outbreak of the Bürgerkrieg, the partisans who inhabited the region had become quite a headache for the local German Garrison. Indeed, the Serbs actively fought what could be regarded as an open war against our men. Yet, their anti-Reich engagements have unwittingly weakened their own defense. Displaying all the intelligence customary to our great nation, we have kept records of their strategies and tactics from previous operations. Prior to the invasion, we shall check these records and prepare our contingency plans... "
 GGR_the_military_garbage_chute:0 "The Military Garbage Chute"
 GGR_the_military_garbage_chute_desc:0 "Unlike the Reich's previous administrations, Balkanhalbinsel can be described as having employed a unique method of governance, that being its considerable lack of official governmental and bureaucratic structures. Indeed, it's principles of rule is essentially an 'army with a state', with the Reichskommissariats' existence serving the chief and overriding purpose of allowing the Reich to mount an effective front against Italy. Thus, we shall compile all available equipment and dump it in the region. "
 GGR_helicopter_assualt:0 "Helicopter Assault"
 GGR_helicopter_assualt_desc:0 "As shown with the 'South African War', the usage of the 'helicopter' has been proven as an effective means of conducting warfare. Luckily, the Großgermanisches Reich's abundance of helicopters will allow us to test the usefulness of combat deployment of valkyries in Europe. Serbia's significant swathes of mountainous terrain are the perfect region to deploy helicopters, as their agility and terrain-capabilities will aid in our ability to bypass and advance through East Europe. "
 GGR_you_brought_this_on_yourself:0 "You Brought This On Yourself"
 GGR_you_brought_this_on_yourself_desc:0 "The time for firm military action has arrived. Indeed, Serbia's days are now numbered. Having betrayed the trust of the Großgermanisches Reich, Serbia leaves us little choice but to be brought to heel for their unacceptable treachery against their betters. Although this war shall be brutal, we all must remember that the Serbs have brought this on themselves, and deserve nothing but fire and fury! "
 GGR_the_military_fortress:0 "The Military Fortress"
 GGR_the_military_fortress_desc:0 "To benefit our performance in the impending German-Italian War, we shall turn Serbia into a military fortress. This fortress shall not be metaphorical, as Gibraltar or Singapore! We shall construct a great line of advanced and powerful fortifications to defend ourselves from a potential Italian advance. By doing as such, we will be more prepared than ever to take down our Italian compatriots. "
 GGR_like_sheep_to_the_slaughter:0 "Like Sheep To The Slaughter"
 GGR_like_sheep_to_the_slaughter_desc:0 "Although the Wehrmacht has barely set foot in Serbia, we are already seeing the true face of the majority of the Serbian citizenry. Whilst our advance continues, a new generation of Collaborators - desperate for independence - have flocked to our banner. Flying the swastika with pride, these fools have already declared their allegiance to the Großgermanisches Reich and have unwittingly planted the seeds of their own destruction. "
 goering_peace_events.6.t:0 "The Conquest of Serbia"
 goering_peace_events.6.desc:0 "Karl Göbel has been avenged at last.\" Militärbefehlshaber Leo Hepp declared, as he watched the Swastika gloriously flutter in the wind, proudly raised over the House of the National Assembly; once the seat of German power in the Balkans, it had since been reduced to a hotbed of Communists, or Chetniks, or any other kind of degenerate Serbians who dared to defy the Reich, to defy Generalmajor Göbel, the man Hepp now sought to pay his respects to. Luckily, what was rightfully German had since been reclaimed, thus allowing the dead to rest in peace.\n\nOtto Ernst Remer, standing right beside him, was not nearly so sympathetic. \"It's his own damn fault he got himself killed.\" The general insisted. He wasn't happy to be in this Slavic backwater, and it showed. Indeed, his presence here indicated just how worthless Serbia was considered in general; While Schörner had made a point of visiting the capital of every enemy nation conquered up until now, he was content with sending Remer to score the propaganda victory this time around, allowing the glory to fall into his general clique rather than claim it for himself. \"He was too soft, too weak on these vermin. Look where it got him!\"\n\nLeo knew that picking a fight with Schörner's second in command was hardly an intelligent decision, but he couldn't let such disrespect for a man of the army-a comrade!-slide so easily. \"He held out for as long as he could, and fought to the last alongside his men. In that very building!\" He pointed towards the National Assembly, doing his best to contain his rage. \"He died a hero, and he shall be treated as such in my Reichskommissariat.\"\n\nRemer stared at Hepp for a moment, before shaking his head and giving a small smile, amused by his boldness. His Reichskommissariat, was it? Perhaps. But it was beholden to Göring's Reich, which meant it was beholden to Schörner as well."
 goering_peace_events.6.a:0 "The Reich has had many such heroes as of late. Speak like that to me again, and perhaps you shall join them one day."
 goering_peace_events.7.t:0 "The Conquest of Serbia"
 goering_peace_events.7.desc:0 "Serbia had always been a sort of miniature version of Russia, in more ways than one. Suppose it made sense; slavs were slavs no matter where one found them, and likewise all carried the same flaws. Communism, Judaism, and even just the spirit of rebellion, directionless and pointless, lashing out for no reason at all, could all be found in abundance in both the land of the Rus as well as its 'little brother' in the Balkans. That being the case, Otto Ernst Remer took great delight in using the much smaller nation as a test run for the greater struggle to come, with all the brutality that came with it.\n\nThe invasion itself was swift and merciless. No one-least of all the Serbs themselves-expected anything else. Their defiance and devotion to a long dead ideology and a long dead nation was to be punished, used as an example to those who failed to get the message the first time Germans panzers rolled their way through the streets of Sarajevo. Bombs were dropped, entire villages were erased from the map, and anyone who was stupid enough to try to defeat the Reich in a war of attrition was promptly destroyed. Executed, really, for they might as well have lined up for their own death sentences, possessed and deluded as they were.\n\nOf course, that was hardly the end of it. The real struggle was still to come, and would likely continue for years, if not decades. The smart Serbians-if such a thing ever existed-had simply gone right back to doing the exact same thing as before the war, hiding out in mountains and forests, caves and long abandoned buildings. They hid in their lairs, scheming in their viper-nests on how best to destroy their betters, just as they had done for nearly twenty years now. To hunt them down would be a brutally difficult task. Though the Reich now had decades of experience in countering guerilla warfare, they also had never been spread so thin before. Most able-bodied men were needed for the next operation, and funding would now have to be split between the countless other garrisons that required just as much aid in rooting out their own pests. Furthermore, there was a significant lack of collaborators, as all the prominent ones had either been slaughtered or turned coat. It was a logistical nightmare that gave Remer a headache just by thinking about it.\n\nBut then again, that wasn't his problem. Instead, Militärbefehlshaber Leo Hepp would be the one to bear such a burden, alongside the rest of the powderkeg of Europe. Otto couldn't help but smirk at the thought, knowing that it was exactly what such a man deserved. Hepp was competent, certainly, but this was as far as he was to advance in German politics; ruling over lands so infested with vermin that he would fear for his life every time he turned the keys to his car. Such dirty work was exactly the match for his skill level. Everything else-everything above these cursed lands-was fit for better men. Men like himself.\n\nAnd so it was that Remer was reassigned, moved out of the little Russia, and on to greater things. He certainly couldn't imagine ever coming back to Militärverwaltung Balkanhalbinsel again, but if he ever did, he hoped that Leo would have done his job, and ensured that there was no more 'Serbia' ever again."
 goering_peace_events.7.a:0 "Hope the Powder Keg of Europe won't explode anymore."
 GGR_ally_with_serbia: "Ally with Serbia"
 GGR_reinvite_the_serbian_garrison:0 "Reconcile with the Serbian Garrison"
 GGR_military_garbage_chute:0 "The Military Garbage Chute"
 GGR_not_invaded_serbia_tooltip:0 "We have not yet started the invasion of §YSerbia§!\n"
 GGR_serbia_conquered_tooltip:0 "We have succeeded in the conquest of §YSerbia§!\n"
 GGR_operation_rurik:0 "Unternehmen Rurik"
 GGR_operation_rurik_desc:0 "In our pursuit of Lebensraum in eastern Europe, Ukraine, the so-called granary of Europe, was one of our most valuable gains. In the past decades, the Ukrainian land sustained the prosperity of the Reich with its abundant foods and resources. Despite of the efforts made by the Ukrainians and Russians to take this land back, the Reichskommissariat Ukraine still stands as the bedrock of our dominance in Europe.\n\nThis precious Reichskommissariat, however, was recently stolen from during the Chaos in the Fatherland. Bräutigam, a rat and a speerite, has gained control of the Reichskommissariat and carried out his malicious reform, which will cleverly lead to the natives' rule of Ukraine in the end. If we don't reverse the situation immediately, the future of the Reich's hegemony achieved by many martyrs of the German nation with their blood, will face some serious threats. In order to avoid this consequence, a military operation will be launched to recapture Ukraine with our forces as soon as possible."
 GGR_fuhrer_directive_76:0 "Führer Directive 76"
 GGR_fuhrer_directive_76_desc:0 "In the 1940s, the German nation had experienced its most glorious victory in history on the lands of Eastern Europe. It didn't take too much time before Kiew and the whole of Ukraine bowed before our unstoppable forces. In the end, the flying swastika flags and the marching panzers on the fields of Ukraine were once the undisputed proofs of our strength and will of victory. Even in the hardest time of the Reich later, it still reminded to be the sweetest memory of the entire German nation, including the Führer himself.\n\nNow decades have passed, and we just find we are going to repeat our success once again on the same land against a different enemy. Therefore, the Führer have just given a special directive to the Wehrmacht that they are required to take Kiew and Ukraine as quickly as possible. For a German Reich reborn, what can make the world realize that the invincible Wehrmacht has returned expect an even more successful campaign on the familiar land?"
 GGR_5_steps_ahead:0 "5 Steps Ahead"
 GGR_5_steps_ahead_desc:0 "In modern warfare, information technology is as vital as weapons and vehicles. Based on the news scientific success, advanced systems like military radar will help the army to trace all trends on the battlefield and make responses as soon as possible. And the best part is, our fatherland is always at the cutting edge of this field. However, we still need a chance to show our people and other nations, how mighty our devices are.\n\nTherefore, the Führer has ordered that this time, during our invasion of Ukraine, our newest and best radars will be deployed to the battlefront. Every move, every action from our enemy will be directly exposed under our watch, and the traitors and Ukrainians will find that they don't even stand a chance since we will always be five steps ahead of them."
 GGR_blitz_the_open_fields:0 "Blitz the Open Fields"
 GGR_blitz_the_open_fields_desc:0 "If you go to ask any little child about how did we crush the Soviet Union in the Second World War, he'll immediately say \"Blitz\" without thinking. Yes, it is Blitzkrieg that granted us the most brilliant victory on the Ukrainian plains that the world has ever witnessed. Time flies, and suddenly we find ourselves standing on the Ukrainian borders once again. So, it is time for the world to witness the power of the blitzkrieg for the second time.\n\nJust like decades ago, Ukraine is a nation with plenty of fields and farms, which makes it a perfect place for blitz. Our panzers, motorized infantries, fighters and bombers will sweep over this land, faster than light and fiercer than razor. Our fangs are ready, and Ukraine will be their next victim this time."
 GGR_deals_with_the_cossacks:0 "Deals With the Cossacks"
 GGR_deals_with_the_cossacks_desc:0 "For centuries, Cossacks have been living and fighting on the Ukrainian territories. Since the time of the Tsar, they are well known as the strongest soldiers for the Russian Empire. Some even say, that the lands of Cossacks are irrigated with their hot blood. Though in modern warfare, the role of cavalry is no more, strict military training has made them a powerful force that only morons will ignore.\n\nBut now, the situation in Ukraine is far more complex than outsiders think. While hating Bräutigam and his administration, they don't hold any better opinions upon us either. Thus, if we want their help in the war against those Speerite parasites, much efforts are required from us. However, with enough arms we may be able to win their trust. After all, no one would say \"no\" to guns and bullets at such a troubled time."
 GGR_anti_cossack_tactics:0 "Anti Cossack Tactics"
 GGR_anti_cossack_tactics_desc:0 "On the surface, an alliance between us and the Ukrainian Cossacks have been formed recently. However, history has told us that it would be unwise to really trust our trust in them, for their capricious and fickle allegiance. In the 20th century, different Cossack divisions have ever served the Tsar, the Whites, the Bolsheviks and even we Germans. As a result, you can never be sure if they make a contract with us just to break it in the future.\n\nIn order to prepare for such an unpleasant outcome, all divisions assigned to the operation Rurik will be required to make preparation for an inevitable conflict with the Cossacks before the invasion starts. The Cossacks may be the best calvaries in this world, but they're still mortals. With proper tactics, our troopers will secure our success and destroy the myths around them once and for all."
 GGR_guns_for_the_opressed:0 "Guns For the Opressed"
 GGR_guns_for_the_opressed_desc:0 "As part of our agreement with the Ukrainian Cossacks, we will provide them arms in exchange of their assistance in our war against Bräutigam's regime. Vehicles filled with weapons will stealthily crossed the border and move into the steppe, where delegates of Cossacks will come to receive our supplies.\n\nFor a long time since the Russian Civil War, the Cossacks have been dreaming of liberating themselves from all oppressors including the Russian Bolsheviks and previous German troopers. Now with the guns in their hands, they will finally get their chance to start a great uprising against our common enemy. Let's wait and see what they can do."
 GGR_raise_cossack_divisions:0 "Raise Cossack Divisions"
 GGR_raise_cossack_divisions_desc:0 "In recent period, we've invested a lot in the Ukrainian Cossack, hoping for their assistance in our military campaign against Bräutigam's regime. And now, it is time for us to get what we deserve. With the arms we gave to them, now they'll be encouraged to form divisions and join our forces.\n\nFor too long, the Cossack have been shedding for different rulers over Ukraine, and this time, they'll die for we true Germans yet believing they're fighting for their own freedom. And before the war ends, they will trample our enemies' bones with their horseshoes into pieces."
 GGR_ukraine_aflame:0 "Ukraine Aflame"
 GGR_ukraine_aflame_desc:0 "Now, everything is ready and the time to reclaim the Reichskommissariat Ukraine from Bräutigam's hands have finally come. No more can we stand by and let the Speerite parasites usurp and corrupt the fatherland's spoils of the last war. No more can we ignore our loyal brothers under the traitorous regime who are longing for our arrival. Yes, we're going to take action right now.\n\nFrom now on, all prepared battle forces will move across the border and march on the Ukrainian fields, just like what we did about years ago. And our allies will response to our voices and stand up for themselves against Bräutigam. Soon, the Reichskommissariat will become ours again and all its lands and resources will be us as well."
 GGR_burn_the_promises:0 "Burn the Promises"
 GGR_burn_the_promises_desc:0 "After the bloody fight, the Reichskommissariat Ukraine is finally back to our hands, and now we should deal with the remnants of different factions within its border. In order to secure a smooth victory over Bräutigam, some of them were 'allied' with us during the war, including the Ukrainian Cossacks and some Germans whose loyalties are more than suspicious, which required us to promise that we'll fulfill their dreams after our triumph.\n\nThough it is us who acted as the mainstay of the war, now the war is over and those so-called allies have come to ask us to keep our promises. Of course, their wishes will never be fulfilled as we've burned all the promises we've made, and they'll understand that who is the real master of Ukraine from now on."
 GGR_empower_the_german_minority:0 "Empower the German Minority"
 GGR_empower_the_german_minority_desc:0 "As part of the initial plan of our new world order, the Reichskommissariat Ukraine is meant to be a settlement for German people that could provide endless grains and other natural resources for the German Reich. However, our exploitation of Ukraine was disrupted by Bräutigam's preserve acts, and it's all thanks to the Führer's courage and wisdom that we can take it back. Now, it's time to make everything return to their rightful places.\n\nAll ridiculous and vicious policies made by Bräutigam, including those about native rights and racial reconciliation, will immediately be abolished, and the German people who keep loyal to their legitimate government will be granted their lost privileges. This time, the Aryan race will be the master of Ukrainian fields for more than thousands year."
 GGR_burn_the_golden_fields:0 "Burn the Golden Fields"
 GGR_burn_the_golden_fields_desc:0 "Now the war is finally over and everything in Ukraine rightfully belongs to us. Yes, we mean literally everything. As one of the most essential colony in we German nation's Lebensraum, its native people must pay for their activities under Bräutigam's rule. Our troopers will go to their villages, take all valuable things to the fatherland and burn their houses to the ground. All those who dare to resist will be executed immediately without any mercy.\n\nAside from its economic effect, this relentless move also has some further value to us. For the natives, they had hoped for their freedom, but in the end their dream only leads to such a painful outcome. Now, their last ray of hope is going to wither, and there will be nothing left except the endless elegies on Ukraine's golden field."
 GGR_operation_rurik2:0 "Unternehmen Rurik"
 GGR_operation_rurik2_desc:0 "Ukraine, once the breadbasket of the Reich, has fallen out of our control in the chaos of the Civil War. While we fought the traitors and fools who opposed us at home, the rebellious natives rose against our Reichskommissariat, toppling it and solidifying rule under a new \"Republic\". This development, while unfortunate for obvious reasons, has left the Oberkommando in an even larger state of outrage than normal. As shown by Schörner in a long winded rant, this boils down to two primary reasons-\n\n1. Ukraine, as it stands, is a nation run by the Slavs, for the Slavs. This situation is a natural want of those Slavs that still live within our borders, which means a risk of rebellion is now a serious concern.\n\n2. As previously stated, Ukraine is the breadbasket of the Reich and its territories. Without its vital fields and grain, we may be looking at a famine sooner rather than later.\n\nThese two issues have sent Schörner and his clique into near-apocalyptic fits of rage, advocating for an immediate invasion with whatever we have. In contrast, those outside Schörner's clique push for a readied, reasonable invasion- after all, Ukraine will not be a mere pushover, as other Reichskommissariats have. The decision boils down to Göring."
 GGR_act_first_think_later:0 "Act First, Think Later"
 GGR_act_first_think_later_desc:0 "The decision has been made: the Wehrmacht is going in now. The risk of a slavic uprising and a famine in the territories we still own is simply too great to spend time thinking about the details of the occupation, or perhaps collaborator schemes. No, the time to act was yesterday, and the second best time is now. As of right now, whatever forces we have on hand will be redirected straight to the Ukrainian border, ready for immediate operations, Though this attack will be disorganized, chaotic, and confused, surely the superiority of the Reich's soldiers will easily overwhelm any resistance that comes up.\n\nThis decision has been met with cheers from those in Schörner's clique, who pushed heavily for immediate actions. Those outside of Schörner's clique, however, have had mixed reactions to the move. Though they will be willing to stand aside for now, some rumors have been reported that perhaps Göring is not truly the man in charge of Germany's activities, ridiculous as that claim is. This defeatist thought will be dealt with later, though- for now, all eyes turn to Ukraine."
 GGR_emergency_germania_action_group:0 "Emergency Germania Action Group"
 GGR_emergency_germania_action_group_desc:0 "Among the many perils that come with haphazardly invading a nation as large and spacious as Ukraine comes the issue of units. With the number of units in the Wehrmacht that were either not in the correct position to operate against Ukraine, or currently being involved in another conflict or operation, our frontlines have been stretched dangerously thin on the sheer size of the Ukrainian border. This situation is unacceptable, and as such Schörner has introduced a rapid emergency plan: mass conscription.\n\nThis conscription would take men off the streets of our major cities, giving them rifles and rudimentary training, and throwing them into the front line as stopgap units. While the skill and quality of these units is guaranteed to be suspect, it's the only reasonable option for the continued success of our operations. Besides that, gaining new divisions for the next invasions we go into can't be a bad thing."
 GGR_look_to_the_RKs:0 "Look to the Reichskommissariats"
 GGR_look_to_the_RKs_desc:0 "With much of our domestic manpower expended, our eyes must now turn to our Reichskommissariats. Up until this point, the RK's have been relatively overlooked manpower-wise, having only garrison units. With our current need for men in the army, this must be changed.\n\nOnce again, Schörner has come through with a solution- by simply reusing our strategy in the Fatherland on our colonies, we could theoretically conscript thousands of native soldiers into our army, further strengthening our cause. Furthermore, Schörner has argued that, in the last few years, the Reichskommissariats have not been paying their fair dues to the Fatherland. With this plan, we would give them the chance to make up on their long-overdue debts, through men and weapons. Göring himself seems to be approving of the plan, and it is expected to be approved as soon as it hits his table."
 GGR_we_should_have_thought_this_through:0 "We Should Have Thought This Through"
 GGR_we_should_have_thought_this_through_desc:0 "Unfortunately, things have not gone as well as imagined. Our invasion has ground to a slow, bloody halt, with the Ukranians putting up stiff resistance. While we normally could simply force our way through such an obstacle, it seems our lack of planning has bitten us badly. Without reinforcements being close or ready to help with the invasion, our attack has stagnated severely. It is time for a change in course.\n\nFrom here on out, we shall plan our next moves carefully, using the scalpel instead of the sledgehammer to dissect our foes. With a bit more preparation, a few more units, and perhaps some attacks on Ukraine's internal stability, we can certainly weaken the frontlines enough to push through and reclaim the breadbasket.\n\nUnfortunately for us, despite coming up with the disaster of a plan in the first place, it seems that Schörner has managed to deflect most of the blame from himself onto numerous other generals, including our Führer! While this insubordinance would not be tolerated by any other general, Schörner wields too much power for any punishment to come to him. As such, we must grit our teeth and ride the storm of anger until this mess is solved."
 GGR_nothing_to_worry_about:0 "Nothing to Worry About"
 GGR_nothing_to_worry_about_desc:0 "Luckily for us, the many risks we took in pushing into Ukraine so quickly have paid off in full. Even now, the cowardly Slavs flee from our overwhelming might, surrendering mile after mile of grasslands and hills as we push ever onwards. With the collapse of Ukraine and the restoration of German rule so close at hand, champagne bottles are popping all around at the Oberkommando.\n\nOf course, the main mastermind of the operation, Schörner, has made no small effort in letting the public know who was the first, most dedicated adherent to the aggressive nature of the attack. As grating as this is to the Führer and to those who disagree with Schörner, we are at least able to ride the coattails of his success to boost our own popularity within the army.\n\nOf course, we could slow down our attack and plan the rest of our assault out, taking precautions to defeat the rebels through more thorough, slow means. However, with how successful this plan has so far been, overriding Schörner's plan may result in an extremely angry Wehrmacht, with no tangible upside other than checking Schörner's popularity. Perhaps, in this case, it is better to take the hands off the steering wheel."
 GGR_think_first_act_later:0 "Think First, Act Later"
 GGR_think_first_act_later_desc:0 "Only fools rush in, as they say. With the two options presented to him, Führer Göring has decided to forgo Schörner's proposal and embrace the more moderate plan, proposed by those outside Schörner's clique. This plan, in contrast to simply rushing everything we have into battle at once emphasizes a slower, more reasoned approach to a nation as dangerous and motivated as Ukraine.\n\nWhile this plan will undoubtedly be safer, it will also be much slower in recovering our main food supplies and stopping the spread of potential Slavic unrest across the Eastern Reichskommissariats. Of course, these two points are now being hammered furiously by a seething Schörner and his acolytes. While these men are undeniably furious at what they perceive as a major slight, they will need to cool their jets if we wish for this new plan to succeed. For now, we move our forces into position, and we plan for the inevitable."
 GGR_prepare_national_uprisings:0 "Prepare National Uprisings"
 GGR_prepare_national_uprisings_desc:0 "While the colonization effort in Ukraine was nowhere near as successful as in other Reichskommissariats, a substantial minority of Germans still exists, and they are not happy about native rule. Obviously, most sons and daughters of the Reich would prefer to be part of the Reich, and have been grinding their teeth at the continuation of Slavs having the audacity to rule over them. They're already practically chomping at the bit to get back against the natives- all we need to do is let them loose.\n\nBy smuggling weapons and ammo into Ukraine and distributing it among the German populace, we will undoubtedly cause quite a stir behind the front lines. One can almost picture it now- Ukranian traitors panicking and running as our men chase them, only to be mowed down from behind by our own loyal citizens. Truly, it is a picture to behold, and one we must make into a reality. Otherwise, with the amount of time we're giving the Ukrainians to prepare, we may have more trouble than we hoped."
 GGR_expose_the_cracks:0 "Expose the Cracks"
 GGR_expose_the_cracks_desc:0 "While Ukraine may be free, it faces the same issue that all weak-willed democracies do- factionalism. Unlike our united National Socialist front, impervious to attacks, the Ukranians are divided into party and ideology, making them easy to exploit. By deepening partisan divides among the populace, we can further divide the Ukranian people themselves, lowering their faith in their government and making the Slavs weak against our takeover. Who would have known that a young, unstable democracy with major flaws would be easy to break apart?\n\nWhatever the case, it is incredibly important that we further weaken the Ukranian government's influence before we move in, unless we wish for both a costly war and a costly cleanup."
 GGR_out_of_the_think_tank:0 "Out of the Think Tank"
 GGR_out_of_the_think_tank_desc:0 "The time for deliberation is over- the time for action is now. Our men are in position, the revolutionaries are ready to restore order, and the Ukranians are too busy squabbling over petty disputes to even protect themselves effectively against us. Now, the Wehrmacht waits impatiently at the border, all but throwing themselves over the line. The only thing holding them back now is the need for final preparations and a direct order from Göring himself.\n\nOf course, what would one of these military adventures be without a constantly angry Schörner, who has spent the better part of the last few weeks complaining about the slow pace of our current attack. Now, he and his clique await the results eagerly. Though externally the profess how they hope for its success, it only takes a little bit of examination before this lie falls away. The truth of the matter is that Schörner and his acolytes are all but praying this innvasion initially stalls, allowing them to implement the aggressive plan they had in the first place. It now falls to us to make sure this does not happen. After all, it would be incredibly embarrassing for the Führer to be told \"I told you so\" by his own Feldmarschall."
 GGR_we_were_right_to_worry:0 "We Were Right to Worry"
 GGR_we_were_right_to_worry_desc:0 "Humiliatingly enough, it seems that we have given the Ukranians too much time, and our offensive has entirely stalled out. The resistance we expected from our settlers has been lackluster at best, and downright non-existent at worst. Similarly, the cracks in the Ukranian machine we expected to divide them have been paved over with a united hatred of our Reich, and politicians from all over the aisle stand together against us. Indeed, it seems that even with the amount of planning and thought we poured into this attack, we still underestimated the Ukranian spirit.\n\nSchörner, after giving all of the Oberkommando an earful of insults and threats, has offered his plan once again as a way to break through the deadlock on the front. After all, time is of the essence now, as every day our food supply gets more and more strained. With the total failure of the first plan, it seems that Göring will be forced to cave to Schörner's request- a great victory for Schörner, and perhaps a way to win for the Reich, but a true humiliation for Göring and those who stand against Schörner and his group. It seems we must grin and bear it if we wish to succeed in Ukraine now."
 GGR_cool_minds_prevail:0 "Cool Minds Prevail"
 GGR_cool_minds_prevail_desc:0 "To Schörner's disappointment and our pleasure, the invasion of Ukraine has gone incredibly smoothly. Our loyal sons and daughters have struck chaos and confusion into the backs of the traitorous slavic armies while their politicians bicker and fight over minor disputes. Indeed, it seems that the Ukranian government is too involved in its own power struggles to effectively deal with our invasion, only speeding our advance.\n\nSchörner, while he externally praises the intuition and speed of our army(taking care to not mention the generals who proposed the plan), is clearly furious at what he sees as Göring ignoring his advice in favor of those that are opposed to Schörner's clique. While he grins and hides his anger for now, fearful of the backlash that may come by removing Göring while public support is so high, we must take care not to anger him too much in the future, lest he overcome that fear and remove the Führer from the office he loves so dearly."
 GGR_all_according_to_plan:0 "All According to the Plan"
 GGR_all_according_to_plan_desc:0 "As expected, Ukraine is once again under our boot. Our men now march triumphantly through streets of cheering crowds- some genuine, some forced to be there. Kiev, while somewhat of a mess at the moment, once again has the flag of the Reich proudly waving above it. The rebel slavs have either ran away with their tails between their legs, melted into the forests, or have been killed. Once again, the breadbasket of the Reich is under our thumb again, and the people of Germany sighed in relief as the risk of famine disappears.\n\nNow, the focus of our Ukranian operations turn to recovery and a restoration of the old order. The slavs will be returned to the camps and farms that they once worked on, a new Reichskommissar will ascend to lead the new Ukraine, and the food shipments will resume once again. Soon, it will be as if we never left, and all of our empire will be thankful for it."
 GGR_know_your_place:0 "Know Your Place"
 GGR_know_your_place_desc:0 "One issue with Ukraine having broke away from our grasp is that many native workers and slaves have gotten the idea of \"freedom\" and \"independence\" stuck into their heads. Surprisingly enough, it seems that these slaves would rather not return to the camps and farms that once owned them, instead electing to run and hide. This constitutes a serious problem to our recovery effort- what's the use of a thousand farms if nobody is there to harvest the grain?\n\nTo fix this, our soldiers shall sweep through villages and towns, finding and capturing any escaping workers. If not enough are found, we will simply seize some new citizens to replace them. With this strategy, all the farms shall resume their operations, and the food supply shall resume, unlimited and at a greater pace than ever before. Get to work, men."
 GGR_no_one_could_have_predicted_this:0 "No One Could Have Predicted This"
 GGR_no_one_could_have_predicted_this_desc:0 "Unfortunately, a main reason why the Ukranians revolted in the first place was the brutality practiced by the late Erich Koch. Koch, a proud Göringite, showed no mercy in his treatment of the native population, thus leading to their upheaval. Obviously, now that the same Göring that Koch revered is in control of Ukraine, the fears of the Ukranian populace has increased. Everywhere our soldiers go, there is passive resistance. Natives refuse to follow orders, insolent citizens lie to our soldiers regularly, and decrees from the Reichskommissar go unheeded. This cannot stand, but the standard strategy of brutally cracking down is so clearly a mistake in this situation that even Schörner is against it.\n\nInstead, as much as it pains us to stoop so low, we must win back the people of Ukraine through a hearts and minds campaign. By loosening our grip, imposing softer punishments, and generally being less imposing to the natives, we can hopefully convince those who are mistrustful that Koch was not the norm, but rather the exception."
 GGR_expand_the_grain_stockpiles:0 "Expand the Grain Stockpiles"
 GGR_expand_the_grain_stockpiles_desc:0 "Though the risk of famine has passed, the spectre of it still remains. One of the main reasons that immediate action was argued in Ukraine was the risk of famine, and Schörnerite generals constantly draw up plans for safeguarding the farms in the case of another uprising. The ghost of the food issue still haunts the Wehrmacht, and it must be exorcised if we wish to assuage their fears.\n\nFood from Ukraine will now be redirected into massive grain stockpiles, located within Germany proper, in order to make sure our food reserves will never be threatened again. Though the cost of these massive silos will undoubtedly be gigantic, surely the profit of never risking a food shortage again will be worth the high price. After all, such a huge stockpile can also be used in public relations, to show that the Führer cares for his people. These silos may serve more of a purpose than just calming the army."
 GGR_the_breadbasket_once_again:0 "The Breadbasket Reclaimed"
 GGR_the_breadbasket_once_again_desc:0 "Every day, reports from our patrols have nothing to say. Our grain shipments only increase in size and scale with each passing week. The Reichskommissariat has only positive things to report. As the numbers come in, it grows more and more clear- Ukraine has been stabilized once again. The Slavs toil in the fields, the Germans watch on from the cities, and the natural order restores itself with the Aryan above the Slav, as it always should have been.\n\nEach day that goes by brings a report that numbers of attacks, shootings, and casualties are returning to pre-civil war levels. Of course, such a success requires parades and celebrations all across Germany, of which both have been celebrated. Perhaps the happiest men in Germany, though, are the Führer and Schörner, who both celebrate for different reasons.\n\nSchörner celebrates because the Wehrmacht once again has a great success under its belt, and every day its standing with the people grows.\n\nGöring celebrates because, once again, the wealth of Ukraine is in his hands, and the people's adoration returns to him almost as quickly as it rains down upon the soldiers who fought for the fields of Ukraine.\n\nThe victory in Ukraine is surely one to remember, and one can only hope that such success continues to follow the Wehrmacht in its next exploits."
 goering.rurik.1.t: "A Second Chance?"
 goering.rurik.1.d: "Axmann stood beside the Führer as they eyed a map of Europe on the table before them. In most cases, generals would hurry around them, moving the soldiers and proposing plans, but today was different than most. Göring had called Axmann in while only a few officers remained, all manning radios in the other room, as the Officer in charge was likely out doing the rounds. Axmann tried to make sense of the dizzying array of model tanks, planes, missiles, and soldiers alongside various multicolor flags until his attention was intentionally pushed toward Ukraine.\n\n\"Minister, I went through your report on Ukraine; however, I wanted to hear from you in person about Leibbrandt,\" Göring said as he slumped against the table, nearly knocking over two model planes, before he caught and carefully corrected them.\n\n\"From my understanding, Leibbrandt would make a fine Reichskommissar. He has stayed within the boundaries of National Socialism, and I believe that with the correct pressures applied, we could bring any more troublesome ideals to the forefront. It should be noted he has been working more closely with the native Ukrainian population than his predecessor. However, he has also been able to increase the productivity of the once middling Reichskommissariat in quite a short and tumultuous time.\"\n\nGöring smiled at that information, but his mood quickly corrected to a more stoic look as he began speaking again. \"... You know, I was happy to be told that forces loyal to the Reich held against the partisans in Ukraine... However, Schörner and many others say he can't be trusted, that he failed to keep order once, and that we should kick him and his cabinet out and ensure proper order is brought back by force. They say there is no place in the Reich for Leibbrandt despite their victory. He is proposing Eduard Wagner, Axmann,\" Göring said while picking up one of the model tanks and inspecting it closely, admiring the details.\n\n\"I understand. However, I do think Leibbrandt would make a fine Reichskommissar. We would likely not need to spare many troops to assist in occupation duties, given he seems to have it all handled now.\""
 goering.rurik.1.a: "Leibbrandt it is, then."
 goering.rurik.1.b: "He has failed once, he will fail again. Send in Wagner."
 goering.rurik.2.t: "A Killer from SS or a Killer from Schörner?"
 goering.rurik.2.d: "Axmann and Gehlen stood opposite the Führer as they eyed a map of Europe on the table before them. In most cases, generals would hurry around them, moving the soldiers and proposing plans, but today was different than most. Göring had called both his Foreign and Intelligence Ministers in a while. Still, only a few officers remained, all manning radios in the other room, as the officer in charge was likely out doing the rounds. Axmann and Gehlen tried to make sense of the dizzying array of model tanks, planes, missiles, and soldiers alongside various multicolor flags until his attention was intentionally pushed toward Ukraine.\n\n\"Ministers, I went through both of your reports on Ukraine; however, are you sure we can work with Ohlendorf? He's an SS man, after all.\" Göring said as he raised his arms, accidentally moving several ships onto land.\n\n\"My Führer, If I may...\" Gehlen asked as he leaned over the table to correct the now wronged ships.\n\n\"Ohlendof has had no contact with Burgundy so far, and my agents can confirm a total lack of Burgundian activity within his cabinet and clique, respectively. To our understanding, he seems to act genuinely on his own accord.\"\n\nGöring's temperament seemed to calm but still filled the air as he looked toward the duo. \"You know, I was happy to be told that forces loyal to the Reich held against the partisans in Ukraine... However, I had a bad taste in my mouth when I found out who it was. Schörner and many others say he can't be trusted, and for once, I can't help but agree. He is an SS man, and you know how I feel about those maniacs, especially after the Burgerkrieg... Schörner is proposing Eduard Wagner to replace him, but you know how I feel about giving him his way.\" Göring said while picking up one of the model tanks and inspecting it closer, admiring the details.\n\n\"I understand your concerns, mein fuhrer. However, I must remind you that most of your fears are unfounded, given that it is confirmed he is not a Burgundian.\"\n\n\"If I may chime in, it also seems that Ohlendof has things handled in Ukraine; shaking up the leadership now may put unneeded strain on the administration in an already tenuous time.\"\n\nThe Führer sat pondering his minister's information as he looked over the map for a brief moment before saying:"
 goering.rurik.2.a: "Don't make me regret this."
 goering.rurik.2.b: "Wagner can't be worse than an SS Officer..."
 goering.rurik.3.t: "A Man And His Place"
 goering.rurik.3.d: "Kurt Schumacher slowly walked into the spacious office. A couple of years ago, Erich Koch worked here, followed by Georg Leibbrandt, and there might have been someone else after him. He didn't know who the last occupant of this room was before Wagner's arrival. It no longer mattered. The position of Reichskommissar of Ukraine now belonged to him.\n\nTwo decades ago, Schumacher had already completed his mission to pacify the Ukrainian land, acting under the watchful control of Ohlendorf. He achieved outstanding results as the chief of the Kyiv Gestapo and was honored with personal praise from Heinrich Müller.\n\nFor a moment, as he crossed the threshold of the room, he wondered where his chief was now. In prison? On the run? Dead in the forest, his corpse being devoured by wild animals?\n\nThese thoughts made his neck sweat. Schumacher was immensely grateful that it was being squeezed by a party tie, not a noose.\n\nIgnoring the secretary's chatter, he busily examined the numerous folders of papers lying on the desk. Evidence of the diligent work of his predecessors, now turned to dust.\n\nSuddenly, a loud ring echoed. The red government communication telephone on the left side of Schumacher began to ring and sway on its stand.\n\nHe tensely picked up the receiver, guessing who might be calling. After the customary greeting, a voice came through the receiver: \"Mr. Schumacher, I was informed that you have already arrived. Is that correct?\" Göring inquired.\n\n\"Yes, my Führer!\" the Reichskommissar replied sharply, standing straight as a string, as if Göring were in front of him.\n\n\"Excellent, then proceed with your duties. I need results. Wagner's harsh military administration has stabilized the situation, but a harsh hand cannot strangle Ukraine's throat forever. We have already seen this a few years ago. Therefore, act as you see fit. Revoke as many decrees of the previous administration as necessary,\" the voice on the other end said before the conversation ended."
 goering.rurik.3.a: "Cardes decide everything."
 goering.rurik.brautigam.1.t:0 "Onwards to Sarmatia"
 goering.rurik.brautigam.1.d:0 "Now that the dust has settled and Germany has been consolidated under our rightful rule, our gaze turns eastwards once more. Just as the power struggle consumed the Reich's heartland, it spread to our Lebensraum on the Black Sea. Alas, these conflicts are tumultuous, and the wrong contender won out. [UKR.Getleader] tragically lacked the foresight to support our claim, and now Ukraine lies under a hostile government. Before we start the panzers rolling, there are a whole host of dissidents ready to wreak havoc that we can take advantage of.\n\nThere are plenty of supporters of the rightful heir in Ukraine, sleeping beneath the surface of the traitorous regime. Many of these loyalists maintain contact with friends and relatives in Germany - it would be all too easy to establish a few ties and make a few backroom deals over the fate of the Reichskommissariat once the traitors have been dealt with. Once we upend the current administration the underbelly will take over, and everything will be business as usual."
 goering.rurik.brautigam.1.a:0 "Let the bribery commence!"
 goering.rurik.brautigam.2.t:0 "The Deluge"
 goering.rurik.brautigam.2.d:0 "When we first invaded Ukraine, it was remarkable just how many turned against the Soviet Union's red oppression. Many of these men were Cossacks, a remarkable people who despite their Slavic and Asiatic blood fought like devils against their Russian oppressors. Once the war was won however, they proved just as much a nuisance to the Reich as they had to their previous masters. They desired nothing more than freedom to roam the steppe like their ancestors, and caused enough havoc that we were willing to grant them freedom in the Don.\n\nDespite their newfound autonomy Cossack raids were the terror of the Donbass, and men and materiel went to their suppression in vain. They continue to be a plague to the region's new administration, and it would be easy to persuade them to take their raids further west with a few shipments of rifles and promises of freedom.\n\nWith Cossacks spreading terror once more and [UKR.getleader]'s government failing to stop the horde, German settlers will cry out for protection from their true leader."
 goering.rurik.brautigam.2.a:0 "Cry havoc, and let slip the dogs of war."
 goering.rurik.brautigam.3.t:0 "Just Good Business"
 goering.rurik.brautigam.3.d:0 "\"What are they waiting for, sir?\"\n\nSchörner lowered his binoculars and smirked. \"They expect us to honour our agreement.\"\n\nThe column of marching men was making its way through the valley at a leisurely pace, their rifles slung nonchalantly across their backs. Schörner's camp occupied the low hill that was the highest point for miles, providing a commanding view of the rolling Ukrainian steppe. He gave a nod to a waiting adjutant, who set off at a run to the artillery batteries.\n\n\"They really never learn, do they? You'd think after dealing with us for so long they'd start to lose faith.\" His remark had been rhetorical, but his subordinate seemed to think it demanded a response.\n\n\"It's in their blood, sir.\" The Oberleutnant scowled, and spat at the ground to punctuate his remark. Schörner gave a noncommittal nod, mildly annoyed at his subordinate's expression of disgust. He had never quite believed the racial doctrine that infested the officer corps these recent years, at least not to the extent the rest of them did. He'd seen the skill with which his Soviet counterparts had defended their homeland, taking part in the back and forth of theatre command like a pair of fencers. No, this was just common stupidity.\n\nHe picked up the radio handset. \"Fire when ready.\"\n\nThe thunder of artillery filled the air."
 goering.rurik.brautigam.3.a:0 "Another mess mopped up."
 goering.rurik.brautigam.4.t:0 "Make A Desert and Call It Peace"
 goering.rurik.brautigam.4.d:0 "Andriy stuffed his few belongings into the box. The wave of refugees had reached his village this morning, desperately fleeing east, and he had every intention of joining them. His things packed, he took one last look about his home. He would likely never see this place again. No time for reminiscing however - he opened the door. He was met with the butt of a rifle.\n\nHe fell to the ground, blood streaming from his nose. The soldier that had hit him looked nonplussed as he stepped into the house. Others followed, tossing furniture and searching for hidden riches he had never possessed. The man who had struck him was conversing with them in German - evidently he was beneath their notice, except to tear the box from his hands and toss his belongings onto the floor to be picked through. Still they were unsatisfied. A kick to the stomach was all he received as the squad exited to search the rest the rest of the village. The officer seemed to be contemplating whether he was worth shooting."
 goering.rurik.brautigam.4.a:0 "Ukrainian property is German loot."
 goering.rurik.free.1.t:0 "Dealing with Ukraine"
 goering.rurik.free.1.desc:0 "The time has finally come to put an end to the pitiful sovereignty of this so-called \"Free Ukraine\", in order to ensure their people come to respect and appreciate the generosity of the Führer. Ukraine's rolling fields of amber grain shall serve no other purpose than to feed the next generation of the German reich, and will prove to be enormously beneficial once we have properly integrated them into our domain.\n\nHowever, we must first invade Ukraine if we are to cement our rule, and with our invasion comes a decision we must make. Should we carefully plan out our methods of invasion, ensuring our forces have the most preparation? Or, as Schörner suggests, launch an immediate invasion of Ukraine? Regardless of our decision, we must reach an answer soon, as our soldiers grow restless on the front."
 goering.rurik.free.1.a:0 "Preparation is the key to success!"
 goering.rurik.free.1.b:0 "A swift invasion will lead us to victory."
 goering.rurik.free.2.t:0 "Germany Demands Arms!"
 goering.rurik.free.2.desc:0 "An unexpected telegram, straight from the Führer and the Fatherland itself, has sent shockwaves through our head offices- the Reich has demand arms for its upcoming war! Citing numerous needs for the increased weapons shipments, including upcoming campaigns, pacification efforts, and training causes, it seems that Göring wishes to squeeze us a little harder than we normally expect.\n\nWhile we would wish to hold onto the precious few guns our garrison still has, it is not like we have a choice in this matter. The Reich calls, and we must obey them, on fear of death. As such, the requested weapons have been seized, in some cases directly out of the hands of an unlucky soldier, and sent off back to Germania for repurposing. It remains to be seen what their use will be, but it's doubtful we'll be seeing those guns again."
 goering.rurik.free.2.a:0 "A frustrating setback."
 goering.rurik.free.3.t:0 "Keep Tight the Reins"
 goering.rurik.free.3.d:0 "Feldmarschall Schörner had grown rather tired of the way the Ukrainian spoke to him. At first, the man had wholeheartedly believed their promises of freedom, the sweet nothings the militarists had whispered in the Ukrainian partisan's ears. Now, after the militarists had ruled over Ukraine for some time, he seemed to expect the Germans to actually deliver on such a thing. Truly delusional, Schörner thought to himself before turning to regard the man coldly. \"I'm sorry? I'm afraid I did not hear that last part.\"\n\nThe Ukrainian practically bit off his tongue in his hurry to shriek at the German. \"Feldmarschall, we have seen none of the autonomy that your Führer promised us. We have more than held our end of the bargain, and yet your men seem to have taken no steps to even come close to honoring it!\" The man moved to speak more, but instead cleared his throat. Schörner determined he had probably come close to saying something somewhat vulgar.\n\nSchörner narrowed his eyes, before giving the answer he always gave. \"These things take time. Naturally, the Reich has every intention of honoring its commitments to our friends in the Ukraine, but we must first consolidate our hold in the region. As long as you continue to uphold the agreement, we will grant your freedoms in due time.\"\n\nIt was a boldfaced, brazen lie."
 goering.rurik.free.3.a:0 "Grasping at a sliver of hope."
 goering_peace_events.2.t:0 "The Conquest of Ukraine"
 goering_peace_events.2.desc:0 "Volodymyr stood against the wall outside his bar in Reichenaustadt, formerly Dnipropetrovsk, but that didn't matter to him. War had come and gone twice now, the Germans had left, and returned, and they did so with a vengeance. He can't recall how many people have died, everyone he knew that went to fight the Germans was gone now, friends, family, co-workers. As he reached for a cigarette from his coat pocket, lighting it to the dreary gray skies of his home, he thought back to the others, heads high and brave. They spoke how they'd crush the German invader, how they would never again live under the jackboot of the Reich, but where were they now? Six feet under, in some unmarked grave in one of the endless wheat fields, their blood seeping into the earth, nourishing it, and giving way to crops that would feed the very foe they died against. There was a cruel irony to it, he thought, as he looked at a flag pole hanging from the balcony of a building across the street, the Reichs own banner fluttered in Ukraine's wind, claiming this land for their own.\n\nDeep inside he knew he should feel insulted, that he should be angry, that he should feel some call to action. Yet, he didn't, he felt the sting of their deaths, sure. However, there was no anger, there was not even sadness, there was just existence. They had fought the Reich, so they died, he likened it to a mere man trying to wrestle with a bear, the outcome was known to all but the most deluded, what was Ukraine to do against the Juggernaut that is the Heer, what would they have done to even defeat the supposed master of Europe? To Volodymyr, to fight for an independent Ukraine was not only pointless, but self destructive. He didn't even feel a pain of guilt when he thought about how Ukraine might just be better off as a Reichskommissariat, how these pointless wars would stop and he would be free to live his life.\n\nAs he took a long drag of his cigarette, he looked off to his side to see two German soldiers approach him, asking if his establishment was still open. He simply gave a nod, dropped his cigarette to the ground and stomped out the last embers of it's fire, before leading them in and to a table."
 goering_peace_events.2.a:0 "Flames of freedom are trampled by the German jackboot. Once and for all."
 goering_peace_events.5.t: "The Conquest of Ukraine"
 goering_peace_events.5.desc: "What is there to say of RK Ukraine? She is a vast land, of wheat as far as the eye can see, the breadbasket of the Reich in the truest sense of the word. Her crop yield would feed not only herself, but Aryans from Germania herself to Moscowien. There was not a household across the Reich that did not contain a by-product of her yield. From the bosom of Ukraine, Lebensraum and Germanization flourished across Europe, as German settlers were secure in knowing they would always have something to eat, thanks to the toil of those of RK Ukraine. Time and again however, she would be threatened, weather by Bolsheviks, or rebellious children of Ukraine herself, they'd attack the farms, burn the crops, and seek to strike at the stomach of the Reich. Yet, time and again she has endured all, thanks to the brave actions of the Heer, a testament to the resolve of the German people, and their dedication to ensure the many who have in her golden fields, did not do so in vain.\n\nYet, RK Ukraine was struck a most fatal blow, not by a Bolshevik, or Banderite, but from within the ranks of the Party. Bräutigam, known Speerite, traitor, and native sympathizer, has snatched defeat from the jaws of victory. In the aftermath of our rightful governments victory in the civil war that engulfed Ukraine, a power struggle ensued, and despite attempts from multiple, and better options, this conniving liberal managed to find a way to cement himself at the top of the power structure. It matters little what lies and tricks he used to get to this point, for the war has seen justice to yet another great betrayal. With the Wheat fields now secure, we have already begun the process of getting the people back to work, sowing the seeds that will see the hungry masses of the Reich be filled for a thousand years. The Ukrainians who Bräutigam so foolishly gave power over proper Aryans are already being put to work in those same fields, as befits their kind. \n\nBräutigam of course protested all of this during his capture, decrying the supposed madness of it all, and spitting drivel on Aryan-Ukrainian cooperation, as if that very same lot, didn't just kill many of our brothers in arms. He presented documents on his self proclaimed \"Successes\" of the benefits of his liberal ways, ranting on rights for the Ukrainians and how we could do more with kindness than the jackboot. All of it was pointless, all of it was the very same lies we heard the Speerites shout during the Burgerkrieg, and much like the Burgerkrieg, the results were the same. Bräutigam would eventually realize it was far too late for forgiveness, or mercy, and with profound sadness, he would be taken out back, and put down like the sick dog he was."
 goering_peace_events.5.a: "Liberals and traitors have no place in the Reich."
 GGR_return_to_ukraine:0 "Reestablish RK Ukraine"
 GGR_emergency_invasion:0 "Emergency Invasion"
 GGR_change_of_plans:0 "Change Of Plans"
 GGR_a_carefully_planned_invasion:0 "A Carefully Planned Invasion"
 GGR_return_to_normalcy:0 "A Return to Normalcy"
 GGR_the_breadbasket_reclaimed:0 "The Breadbasket Reclaimed"
 GGR_the_breadbasket_reclaimed_desc: "$GGR_the_breadbasket_once_again_desc$"
 GGR_not_invaded_ukraine_tooltip:0 "We have not yet started the invasion of §YUkraine§!\n"
 GGR_ukraine_conquered_tooltip:0 "We have succeeded in the conquest of §YUkraine§!\n"
 GGR_fuhrer_directive_76_tooltip:0 "§YThe Führer ordered Kiew to be taken at all costs.§!\n"
 act_first:0 "We have acted first"
 plan_first:0 "We have planned first"
 GGR_emergency_germania_action_group_tooltip:0 "§YThree mechanized divisions will be assembled in Germania, though lacking in equipment and training they are loyal and able to fill in the gaps.§!\n"
 GGR_look_to_the_RKs_tooltip:0 "§YWe will demand equipment from all of our Reichskommissariats.§!\n"
 GGR_prepare_national_uprisings_tooltip:0 "§YWe will work closely with German resistance to rise up once we give the signal.§!\n"
 GGR_switch_plans_tooltip:0 "§YWe will halt the invasion to adjust to the unexpected problems we encountered.§!\n§MUnlock the other side of the focus tree.§!\n"
 GGR_cool_minds_prevail_tooltip:0 "§YThe invasion of Ukraine has gone all according to plan, we may not have won yet but at this point it is just a matter of time.§!\n"
 GGR_nothing_to_worry_about_tooltip:0 "§YThrough swift and decisive action have we managed to contain the crisis, its just a matter of time till the rest of Ukraine falls.§!\n"
 GGR_fall_henry:0 "Unternehmen Heinrich"
 GGR_fall_henry_desc:0 "Our worst fears concerning the fate of RK Moskowien have come true! The colony has collapsed without German guidance and now has become a scene of chaos that resembles the mess that is Russia currently.\n\nWarlords, both native and German revel in this bloodbath. Order must be and will be restored, one way or another. The question posed to us now is; do we dare work with the remnants of the old Moskau bureaucracy? The collapse has only proven their incompetence, and our new Reich has no place for such gross ineptitude and apathey. However, on the other hand, it would perhaps be beneficial for us to have an ally on the inside, so to speak."
 GGR_the_german_bulldozer:0 "The German Bulldozer"
 GGR_the_german_bulldozer_desc:0 "The day has come. The Wehrmacht stand ready to tame Moskowien once again. There will be no doubts, no fear; only triumph for Germany! There can be, will be no compromise. The warlords have sealed their fate by rising up against our rightful rule.\n\nRemember, gentlemen. There is to be no surrender or negotiations; there will only be triumph for Germany! As we cross into the wild frontier, every warlord must know the wraith they have incurred; they have angered the German Eagle and spat in her eyes! Now, the talons will strike into their flesh, the beak gouging out their eyes. The traitors shall serve as a lesson to those in Europe and beyond; the German Reich will not negotiate. We do not compromise with degenerates or rogue upstarts."
 GGR_dont_question_your_orders:0 "Don't Question your Orders"
 GGR_dont_question_your_orders_desc:0 "Reports have started trickling in from the Ostfront. Some of the findings are... disturbing, to say the least.\n\nOur men have been hesitant when fighting other German militias that are scattered throughout Moskowien, going as far as to hesitate while under fire! To make matters worse, some units have gone as far as disobeying orders and not engaging enemies. There are even a select few reports stating that \"Gross negligence has led to the escape of (REDACTED) prisoners.\n\nThis is not the fighting spirit we wish to instill in our soldiers! Our army is fighting for the glory of Germany and are fighting for the well-being of our nation! There is no room for empathy of any kind on the frontlines. We know that these officers and soldiers are faced with a hard reality on the fronts, which is why we will make this abundantly clear for them.\n\nFOLLOW YOUR GIVEN ORDERS, NO EXCEPTIONS."
 GGR_shoot_on_sight:0 "Shoot on Sight"
 GGR_shoot_on_sight_desc:0 "Despite our best efforts, our men are still hesitating when they face turn-coat German formations. This hesitation is a weakness that should not be seen in our soldiers. Therefore, the men will be issued new propaganda and orders; Germans living on these hellish plains, in service to the assorted warlords are failures and traitors all, no exceptions!\n\nThey have chosen to side with our enemy. Therefore, they are not German; they are traitors. Hesitation will no longer be tolerated. We will issue a new \"Shoot on Sight\" order for the soldiers. If the men do continue to hesitate, then they will be dealt with internally."
 GGR_not_one_step_back:0 "Not One Step Back"
 GGR_not_one_step_back_desc:0 "We will not take one step back! Our advance will continue, and the dagger will continue to be pushed towards the traitors' throats.\n\nThe warlords will finally meet their end at the hands of the German war machine. Our enemies are growing desperate, and attack us with increasing desperation. If they attack, then we will mow them down. If they hunker down in their hovels, we will reduce them to rubble. The hordes of barbaric natives are nothing compared to the might of the Reich! The traitor settlers? Nothing more than gnats. To surrender any land, to fall back even an inch is to admit defeat to these pathetic degenerates, and that is something we cannot tolerate.\n\nWhy are you still standing there? There's a war to win over there!"
 GGR_a_call_for_help:0 "A Call for Help"
 GGR_a_call_for_help_desc:0 "As we analyze the rapidly collapsing situation in the east, our course to take is clear. We must help our fellow German brothers now trapped in the east.\n\nThey are surrounded in the unforgiving frontiers, being constantly attacked by the degenerates of Russia. The Germans in the east cry for help, and we shall answer their pleas.\n\nRallied by [GetGGR_moskowien_leader], our brothers stand alone against a literal horde of enemies. We shall quickly organize shipments to supply the German settlers. While this is being done, we proclaim [GetGGR_moskowien_leader] the new Reichskommissar of Moskowien, since he was the one who took initiative and rallied the settlers. Hopefully, [GetGGR_moskowien_leader] will be able to succeed where Kasche failed."
 GGR_ship_them_aid:0 "Ship Them Aid"
 GGR_ship_them_aid_desc:0 "We have a semi-functioning allied warlord in the east; now we can begin a pipeline to get [GetGGR_moskowien_leader] and his men essential supplies, and this can be expanded to other warlords we see fit to send aid.\n\nWe need to act quickly and help aid the various German states and settlers. They have, more or less, called up rag-tag militias, only absorbing a pittance of the pre-war garrisons. As it stands, the German settlers and militias are in a terrible state, and are low on guns, supplies, and even food! If the settlers are to have a chance against the native uprising, they will need the basic tools of war; guns and supplies, and we have both in abundance.\n\nWe should send our brothers aid as soon as possible, lest the Russian hordes overwhelm them."
 GGR_luftwaffe_reinforcements:0 "Luftwaffe Reinforcements"
 GGR_luftwaffe_reinforcements_desc:0 "For our next care package to be sent east, we will not be content to merely send run-of-the-mill guns and supplies! We will send something much more... terrifying.\n\nThe Russians in Moskowien have revolted over trifling matters like \"slavery,\" \"no representation,\" and \"the Germans are trying to exterminate us to build an ethnostate.\" They don't know the privileges they had living under us. It is time for the pigs to learn what their brothers in the waste they call Russia learned.\n\nDeath from Above!"
 GGR_break_the_kessel:0 "Break the Kessel"
 GGR_break_the_kessel_desc:0 "Our aid to our allies in the east has been well received, but the Russian warlords still infect Moskowien like a plague. Their numbers are, quite bluntly, vast and still threaten the German remainments across the blasted plains and forests. We have few options left to us at this point.\n\nWe must get directly involved and resolve this developing embarrassment. The Germans in the Volga are CLEARLY not able to deal with the uprising, so we shall deal with it ourselves. We'll kick down the rotten door again and restore order in the region once and for all. The Heer will sweep aside the Rus yet again and bring peace, unity, and our rule back to Russia!"
 GGR_the_tamed_volga:0 "The Tamed Volga"
 GGR_the_tamed_volga_desc:0 "Germany stands victorious once more.\n\nThe costs? The costs were great. We've killed and dispersed the native warlords and their rebel men, but many German settlers have been killed, and many more that weren't have lost everything. German soldiers have died, again, to raise our flag over Moskau, but our work is not quite finished yet.\n\nWe need to rebuild a semblance of government; one headed by someone a little less apathetic and much more involved than Kasche; for the general welfare of the state and the wellbeing of the German settlers."
 GGR_scrounge_up_an_administration:0 "Scrounge Up an Administration"
 GGR_scrounge_up_an_administration_desc:0 "The civil war in Moskowien has been devastating. The local administration, or what's left of it, is scattered to the four corners of the colony. The vast majority, unfortunately, were purged during the war and need to be replaced in order to get Moskau in good running order.\n\nThis could prove to be a challenge. At a closer look, it seems that nearly the entire structure that Kasche had put together was totally defunct. Not only do we need to restaff nearly the whole administration, but we also need to restructure it from the ground up. This will take time, but will be worth it in the long term."
 goering.heinrich.1.t: "Hotline Moskowien"
 goering.heinrich.1.d: "The headquarters of the 901st Horch roared through the streets of Moskau, and finally turned sharply and drove across the pavement, stopping at the space that the locals once called \"Red Square\".\n\nKrebs got out of the car, brushing off the cement dust and brick chips that had been pouring down on him from all the ruins in the area during the trip.\n\nInserting a monocle into his right eye, he looked around – it was evening.\n\nIn the infinitely vivid rays of sunset, what had recently been the Kremlin looked like the ruins of Kitezh-grad, a mythical wandering settlement, the legends of which he had heard so long ago and so often.\n\nThe driver wanted to busily introduce him to the surroundings, but in a second he came to his senses, who was standing in front of him, reached not for the map in the tablet, but for the general's meager belongings, with a mute question whether he could help him bring things to their headquarters.\n\nLooking at this, Krebs only shook his head indifferently, and he took two suitcases in both hands, went in the direction of the open gates of the Spasskaya Tower, hearing in the wake: \"Führer ordered to report to him about the situation on the spot within a day after arrival\".\n\nThe mind of the new Reichskommissar was occupied by completely different things. Before he reached the group of guards a couple of meters away, he froze, looking just above the open doors. Once there was an icon, then a portrait of Bukharin, and after that an idiotic, almost mural depicting Siegfried Kashe, ironically commissioned by Kaminsky.\n\nSmiling bitterly, the general walked through the checkpoint, and in his head flashed: \"I'll fold myself in half, but I'll make Russians worthy citizens of the Reich.\""
 goering.heinrich.1.a: "The land of blood and suffering greets its new overlord."
 goering.heinrich.2.t: "A Worthy Successor"
 goering.heinrich.2.d: "The dawn was breaking outside the Kremlin. Bright rays penetrated the interior of Krebs's office as he sat at his desk, turned away from the door. These were the last minutes of his tenure.\n\nAll his belongings were packed into bags and suitcases, and he had already put on his coat in advance.\n\nOn the wall, almost up to the ceiling, hung a solitary portrait of Führer Göring, the man whose mercy had allowed Krebs not only to survive but also to become useful to the Reich once again.\n\nFrom somewhere outside, the sound of an engine and the subsequent screech of brakes could be heard – this was the arrival of the person Krebs himself had appointed a couple of days ago as the most worthy successor to his work.\n\nThe general removed his monocle and closed his eyes, leaning back in his chair. He recalled his entire life – from the very first moments to this very day. He had always felt the hand of fate guiding him further and further. To the East, for a great mission. And now that mission was accomplished by him.\n\nKrebs smiled bitterly and opened his eyes, feeling hot tears of happiness streaming down his cheeks. Long years of labor had finally borne fruit.\n\nSoon he would return to his native Braunschweig, where he had not been for so long, where he would meet his dear wife and two daughters, whom he had not seen for so long, and get to know his grandchildren, who would say that their grandfather was a hero of Germany. But long before that, he would leave the Kremlin, forever, and meet passersby on the street. Smiling passersby. Russians who worked for the benefit of the Reich.\n\nThe door to the office swung open, and a familiar figure appeared in the doorway:\n\n\"Good morning, Herr Krebs, the order for my appointment as Reichskommissar of Moskowien has just been approved by the Führer. It was an honor to know that you had done me such a service in my promotion! I...\"\n\nKrebs cut off his impassioned speech with a wave of his hand. Rising from his chair, he put on his cap and picked up two heavy suitcases:\n\n\"You are now in charge here, Herr Oberländer. I wish you luck and success.\" The general let his appointee into the room and, turning back one last time, added:"
 goering.heinrich.2.a: "\"Destiny is a very powerful woman. But it is pleasant to deal with her.\""
 goering_peace_events.1.t: "The Conquest of Moskowien"
 goering_peace_events.1.desc: "Moskowien is rather the most unsuccessful colony of the Reich in the east. If Ostland brought new blood to the Reich, Ukraine brought endless grain reserves, and the Caucasus brought oil, then the only thing that Moskowien brought to the Reich was headache.\n\nOnce again, the most troubled colony is in the hands of the Reich, and it's time for the Reich to choose its new owner.\n\n\"My Führer...\". Schörner's voice trembled impatiently. \"I am convinced that in this situation you are obliged to give yourself an exhaustive account of who exactly you are sending to the post of Reichskommissar of Moskowien.\"\n\nThe field marshal stood erect in front of Göring, like a stretched bowstring or string, speaking through a tightly clenched row of teeth, while the Führer calmly signed the papers he needed sitting in a luxurious armchair, slightly looking up at the newcomer.\n\n\"Yes, Ferdinand, this man will be Colonel General Hans Krebs, do you have a personal score to settle with him, or something more substantial?\"\n\nSchörner bent down, put his hands on Göring's desk and growled through his teeth: \"But my Führer, Krebs, is a hardened Bormanite with the habits of the Judo-communist degenerate Speer... Do you even know what he says about Russi-\"\n\nGöring put his pen and documents aside, silencing Schörner in mid-sentence, calmly replying: \"I am well aware of the seniority, character and views of General Krebs. Besides, I think you understand how deep the hole that Moskowien is. Krebs was our attache in Moscow a couple of decades ago, he knew almost everyone in the Kremlin and beyond, and every Russian dog knew him. He may be a naive idealist, but he knows how to handle Russians, and I believe that he will make at least a smaller hole out of Moskowien.\"\n\nSchörner, realizing that he could no longer convince the Führer, just lowered his head, exhaled and gave out ordinary: \"Yes, my Führer.\""
 goering_peace_events.1.a: "Hopefully, Moskowien will stop being a pain in the neck of the Reich."
 GGR_return_to_moskowien: "Reestablish RK Moskowien"
 GGR_operation_henry: "Unternehmen Heinrich"
 GGR_MCW_the_legacy: "The Legacy"
 GGR_MCW_the_legacy_desc: "For many years, the vast expanses of Moskowien, from St. Petersburg to Astrakhan, were shrouded in utter darkness. The only legacy of these lands was countless destruction. In the deep of night, the shadows of the past still roam the streets of Moskowien's cities, villages, and towns.\n\nAll the efforts of Odilo Globocnik failed, as did the implementation of the Ost plan, which again and again did not yield the desired results, only further disfiguring the body of Moskowien. Party kings, along with their local native cronies, were dividing the land, bandit gangs were operating on the outskirts, and the forests were filling with partisans.\n\nAs soon as the chief overseer showed weakness, and oversight from Germany disappeared, the walls of the concentration camp he had erected, like an uncontrollable flood of chaos, sent Moskowien into a temporary state of complete oblivion.\n\nAt last, German rule has returned here. Now, the new Reichskommissar Hans Krebs, together with Count von der Schulenburg and Theodor Oberländer, plan to do something incredible. If Globocnik turned Moskowien into a wasteland, they will turn it into a field of experiments.\n\nGöring is turning a blind eye to this for now, but everything has its reasonable limits...\n\n§CDestiny§! smiles for the first time in so many years."
 GGR_MCW_the_plan: "The Plan"
 GGR_MCW_the_plan_desc: "Step 1. Isolate the partisans\nStep 2. Assemble new \"Ostvolk\"\nStep 3. Form a second \"Lokot\"\nStep 4. TOP SECRET (App No. 12)\nStep 5. Centralize management\nStep 6. Accept our §CDestiny§!\n\nApproved by: Hans Krebs — signature:\n\n£krebs_signature."
 GGR_MCW_the_vision: "The Vision"
 GGR_MCW_the_vision_desc: "Hans Krebs is a fanatical, even against the background of Oberlander and Rosenberg, an idiosyncratic national-socialist, the rare one who sincerely believes in friendship between Russians and Germans, and for whom the plan \"Ost\" has become a personal tragedy.\n\nIn the past, all his attempts to normalize the situation in the Eastern Territories were strenuously torpedoed by party bosses, postponed \"until better times\".\n\nIt's different now.\n\nKrebs is the largest fish in the reservoir called Moskowien, and in his hands concentrated all the reins of government.\n\nWhat will come of it? §CDestiny§! will tell later."
 GGR_MCW_the_legacy_krebs: "The Legacy"
 GGR_MCW_the_legacy_krebs_desc: "The Reichskommissariat Moskowien has always been the most problematic colony of the Reich in the East, causing numerous headaches for the Reich's leadership over these twenty-plus years.\n\nNow, however, this is not the case. For the first time in many decades, Moskowien is finally quiet.\n\nThe population of Moskowien has rather optimistically accepted the carrot in the form of the idealistic Reichskommissar Hans Krebs. And although this carrot was not sweet, it was, at least, not stale and bitter.\n\nPartisan attacks have ceased to be the norm, and dissent has been suppressed with the carrot or, in some isolated cases, with lead.\n\nThanks to Hans Krebs, the Muscovytes have been given a glimmer of hope for a better tomorrow, because today they work not for their lives, but at least for bread, water, and a home."
 GGR_not_invaded_moskowien_tooltip:0 "We have not yet started the invasion of §YReichskommissariat Moskowien§!\n"
 GGR_moskowien_conquered_tooltip:0 "We have succeeded in the conquest of §YReichskommissariat Moskowien§!\n"
 GGR_dont_question_your_orders_tooltip:0 "§YThe 'German' nations in Moskowien cannot be trusted and shall be treated like the dogs they are.\n While some question this decision, it will ensure that the administration in Moskowien will be filled with our Militarists.§!\n"
 GGR_dont_question_your_orders2_tooltip:0 "§YThe administration in Moskowien has failed! The Russians run rampant and we must clean up the mess! Bang the Drums!§!\n"
 GGR_an_excellent_job_tooltip:0 "§YThe German Garrison did a very excellent job in collecting money and valuables for us, time to collect.§!\n"
 GER_Moskowien_Help_time:0 "§MWe shall assist the most loyal to us faction in Moskowien!§!\n§BLess but still loyal factions will receive an ultimatum to surrender.§!"
 GGR_the_black_state:0 "Unternehmen Schwarzes Gold"
 GGR_the_black_state_desc:0 "Since even before the Bürgerkrieg, the disloyal and dishonest scoundrel Josias has abused his noblesse privilege to govern the Reichskommissariat Kaukasien as his own personal fiefdom. His misrule has seen the colony adopt an independent domestic and foreign policy serving only the interests of Josias himself-not the Reich to which the Causcases rightly belong. It is time for us to end this sordid and corrupt state of affairs, and bring the proven might of the Wehrmacht down upon this farthest corner of Europe. The Princeling and all his traitors must hang before the glory of the Deutsches Reich can ever be fully restored to its rightful preeminence."
 GGR_fan_the_flames_of_nationalism:0 "Fan the Flames of Nationalism"
 GGR_fan_the_flames_of_nationalism_desc:0 "The land of Kaukasien is inhabited by a great multitude of lesser nations, long subjugated to one or another empire. These mountains and hills that mark the southern periphery of Europe have been subject to the rule of the Persians, the Greeks, the Russians... and now the Germans. The petty nations here are often locked in deadly, centuries old rivalries against each other, and are not united in language, in religion, or in race, but only in their mutual contempt for whichever empire currently possesses their country.\n\nBefore the death of the Führer, these rebellious locals were a thorn in Germany's side, refusing the Reich's dominion just as they did the empires before us. But now that the Reichskommissar of Kaukasien has proven himself a traitor to his Fatherland, we have the perverse pleasure of making these same pests our erstwhile allies, and sticking their thorns into our own mutual enemy. We will establish contact with the leaders of the resistance cells in the Caucasus, and offer them funding and equipment to arm themselves and to bolster their numbers. If Josias has his eyes turned on the inside of his fiefdom, we shall have an easier time dismantling it from the outside."
 GGR_fan_the_flames_of_nationalism_tt:0 "We will work with local nationalists when our invasion happens"
 GGR_make_empty_promises:0 "Make Empty Promises"
 GGR_make_empty_promises_desc:0 "The natives of the Caucasus will not fight with us for nothing. Their leaders have arrogantly demanded we promise each petty tribe amongst them their independence after Josias falls, sticking up their noses at the power of the Reich even as we offer to rid them of the Princeling. Thankfully, their recalcitrant demands are of little real consequence; we will gladly tell them whatever they need to hear to get them to turn their guns against our mutual foe. Then--when the Wehrmacht is marching down their streets--we will reveal what they have truly fought and died for, and allow them to beg us mercy for their present insubordination."
 GGR_make_empty_promises_tt:0 "We will promise local nationalists independence should they fight alongside us"
 GGR_planning_the_offensive:0 "Planning the Offensive"
 GGR_planning_the_offensive_desc:0 "Our General Staff is constantly formulating plans of attack against each and every one of the Reich's neighbours, and the RK Kaukasien is no exception. We have had numerous different campaign plans prepared against Josias and his fledgling state for a long time, but just as the circumstances of the war change, so must our plans to conduct it. We will refine and finalize our planned offensive into the Caucuses, that our generals and their subordinates will have the best goals in heart to earn the Reich a quick and decisive victory in Kaukasien."
 GGR_scope_out_their_positions:0 "Scope Out Their Positions"
 GGR_scope_out_their_positions_desc:0 "It behooves us not to invade one of the most treacherous landscapes in the continent both blind and deaf. Our plans are only as good as the information they were based on, and so our reconnaissance must be exactly as excellent as our plan of attack. Thankfully, the hills have eyes in the Caucuses, and this time--with our native irregulars on-side--those eyes belong to us. We shall know more about the lay of the land in the Reichskommissariat Kaukasien than the Reichskommissar knows for himself."
 GGR_prepare_for_the_cold:0 "Prepare for the Cold"
 GGR_prepare_for_the_cold_desc:0 "This will not be the first campaign where German boots trod on foreign snow, and just as before we shall not allow the impertinence of mother nature to spoil our victory. Our divisions for the coming war in the Caucuses will be thoroughly winterized and equipped with kit appropriate for the precarious mountain terrain. Not even the peaks of the Earth itself will stand in the way of the Wehrmacht."
 GGR_end_the_aristocrats_reign:0 "End the Aristocrat's Reign!"
 GGR_end_the_aristocrats_reign_desc:0 "All due preparations have been made for a war that shall be won both quickly and decisively, in spite of the preparedness of the enemy. Neither lack of men and rifle nor blight of cold and snow can pause us now. We will pursue a war in the most ill suited of places and execute it with a distinct completeness that would shame the honour of our enemies to behold it. Let all the world know that the German eagle has risen again, and that it shall reclaim all that was once its bounty.\n\nOur enemy, the Princeling Josias, is no incompetent, but he is a traitor to his Fatherland, one who turned away and enriched himself when his own country was bleeding. For this crime his corpse shall hang above the ruins of his fiefdom, alongside those of all who thought that they could exploit the calamity of the Bürgerkrieg for their own ends. Ours shall be the riches of the Caucuses, and ours shall be the pride of victory."
 GGR_race_to_the_oil_fields:0 "Race to the Oil Fields"
 GGR_race_to_the_oil_fields_desc:0 "Singular to the strategic purpose of this wayward colony was its natural bounty of petroleum. More oil can be produced here than in any two other possessions of the Reich combined. Rationally, it is this same resource that must be the focus of our conquest. Our troops will attempt to outmaneuver the Princeling's own and retake for Germany with the greatest haste the black gold that makes this stretch of rock worth conquering in the first place. Our banners shall fly high over the oil fields of Baku, and the traitors shall be surrounded in their mountains and hills."
 GGR_over_the_mountains:0 "Over the Mountains"
 GGR_over_the_mountains_desc:0 "The Reichskommissar may be able to muster forth a formidable army of good German soldiers, but his fiefdom cannot come close to competing against the aerial might of Göring's own Luftwaffe. As our bombers render the Princeling's divisions to fire and carnage, our transport planes shall airdrop the formidable Fallschirmjäger right over the Caucasus Mountains and straight into the lightly defended underbelly of the Black State, where the true treasure of the Reichskommissariat lies. Even as the traitors fight their stubborn fight on the ground, our victory will be assured by our dominance of the skies."
 GGR_CAU_one_last_push:0 "One Last Push"
 GGR_CAU_one_last_push_desc:0 "It was the legendary German tactician Helmuth von Moltke who first said that no plan survives contact with the enemy, and this dogged war continues to prove him right. Prince Josias has proved himself a satisfactory commander of men, and we shall endeavour to learn from his defense after he has been beaten and killed. In the meantime, we shall see to it that this transpires sooner rather than later. More men, more materiel, and a harder will to succeed will be enough to break the deadlock and bring Kaukasien back home to the Reich."
 GGR_back_into_the_fold:0 "Back into the Fold"
 GGR_back_into_the_fold_desc:0 "A great victory has been won, as was expected, but now is no time to dither. Just as we won the war, it now falls to us to win the peace. Both the Prince's misrule and our own efforts at reconquest have destabilized the Reichskommissariat and reduced its productivity to near nill. The factories must start churning again, the Natives must start labouring again, and the German guardsmen must start patrolling the mountains again if we are to extract the true value of the war's bounty."
 GGR_it_was_a_pleasure_doing_business:0 "It was a Pleasure doing Business..."
 GGR_it_was_a_pleasure_doing_business_desc:0 "Whilst we planned our actions against the enemy that once squatted in this protectorate, we made various assurances towards the better treatment and improved autonomy of the natives of Kaukasien. It is without need for us to elucidate on why these assurances cannot and should not be fulfilled. Our promises to the rebels will be withdrawn, and the locations of any such groups we know of will be raided and purged. The Georgians, Armenians and other pests may address any complaints about their betrayal to the nearest German rifle."
 GGR_reward_loyalty:0 "Reward Loyalty"
 GGR_reward_loyalty_desc:0 "Just as the traitors will always themselves be betrayed, those good German souls amongst the population who remained loyal to their Fatherland will have their loyalty lauded and justly rewarded. Those positions of power and prestige inside the Reichskommissariat Kukasien which were emptied by our conquest of the province will be filled again: this time by staunch loyalists to Göring. No man deserves to hold authority who does not himself offer strict obedience to Germania and its master."
 GGR_the_treachery_of_the_industrialists:0 "Unternehmen Schwarzes Gold"
 GGR_the_treachery_of_the_industrialists_desc:0 "There is a good reason why National Socialism is contemptuous not only of the Bolshevik pestilence that openly defies the natural order of the world, but also the insidious capitalist rot that corrupts it from within. The industrialist caste must be kept in check if they are to continue offering their benefits to the Reich, and those industrialists which have seized power in the Reichskommissariat Kaukasien have long defied any pretence of checks and balances to rein in their debauchery. Throwing in their lot with the traitor Bormann, these money-grubbing swine sought to secure for themselves impunity in their little patch of Europe--a landscape they could mold and use as they saw fit, and contemptuously utilize to enrich themselves at the expense of the German people.\n\nNaturally, with the defeat of Bormann's forces in the Bürgerkrieg, these dreams will come to nought. The Wehrmacht is coming to these insidious scoundrels, and there is nothing they can do with all their hoarded riches to stop it. Those who defer to Germania might be offered mercy, and allowed to continue their lapsed service to the Fatherland. Those who resist will not live to regret it for very long."
 GGR_exploit_their_disunity:0 "Exploit their Disunity"
 GGR_exploit_their_disunity_desc:0 "In truth, there is no such thing as brotherhood amongst thieves. When a ship is sinking all of the rats will happily kill and eat one another to escape and find safety, and so too with the capitalists of the Caucuses. Their alliance was always born of convenience, out of mutual contempt for a common enemy rather than any singular coherent ideological goal. Any sane men amongst them will see the writing on the wall and come over to our side, armed with unending praise for Göring and plenty of back taxes to contribute to the war effort. All we need do is tell them of the opportunity to turn tail and surrender, and most probably will. There are no riches to be made in defeat."
 GGR_this_will_be_easy:0 "This Will Be Easy"
 GGR_this_will_be_easy_desc:0 "Factory owners and businessmen do not make good military leaders. The environs of the Reichskommissariat are mostly undefended, and those soldiers that do guard them are under trained, underequipped, and paid as little as can be afforded. It is almost a shame to come across such a weak foe; there will be little pride to be found in this victory. We'll have to suffice with the material reward."
 GGR_one_last_chance:0 "One Last Chance"
 GGR_one_last_chance_desc:0 "Many have already come over to our side, but a few brave or stupid men amongst the industrialists of the Caucasus are still left opposing their own Fatherland and their own Führer. They will be granted the extraordinary mercy of one final chance to lay down their arms, surrender, and beg us for the mercy they do not deserve. Any who continue to resist us after this final plea have all but chosen to die."
 GGR_goodbye_to_the_greedy:0 "Goodbye to the Greedy"
 GGR_goodbye_to_the_greedy_desc:0 "The invasion commences. Soon, the smoggy skies of Kaukasien shall be bolstered by the smoke of thousands of tanks, trucks and planes arriving to restore German ownership of this wayward colony. Perhaps the fat cats in their expensive suits will look upon the Wehrmacht coming down on them and have time left to regret their disloyalty. Or, perhaps the first bomb dropped on their city will kill them instantly, and destroy all the riches they ever accumulated in their short, sad lives. No one will ever know what goes through those greedy men's minds in their final moments. We can only hope they all die before too much of their factory floors are torn apart--it would be good to have something left to loot."
 GGR_welcome_back_to_the_reich:0 "Welcome Back to the Reich"
 GGR_welcome_back_to_the_reich_desc:0 "Reichskommissariat Kaukasien has come back home to Germany. An interim military order is restored to the colony, and all active resistance from the former regime has been eliminated. Many of the natives will still begrudge our continued plunder of their homeland, but their discontent can be controlled by enough men with guns marching down their streets. Now is the time for us to make the important decision of how the fruits of our labour will be collected, and whether Caucasia will be a fruit to be plucked, or a garden to be cultivated."
 GGR_repurposing_their_property:0 "Repurposing their Property"
 GGR_repurposing_their_property_desc:0 "The main objective of our war was to retake control of the Baku oil fields, so it is only logical that this industry will be the main focus of our rebuilding efforts as well. The surviving engineers, technicians and labourers of the Caucasus will be put to work in Baku, restarting capped or damaged wells, fixing destroyed pipelines and generally getting the oil flowing again. The boon this will provide to our engine of war is worth restating: the petroleum industry was born in Baku for good reason. These wells have kept Germany supplied for decades, and their loss during the Bürgerkrieg was singularly responsible for more logistical issues and delays in supply than the loss of any other resource. Once the drills are drilling and the pumps pumping again at full capacity, Germany's natural resource stockpile will largely be restored to its pre-war might. Our enemies ought to shake in their boots at the thought."
 GGR_salt_and_loot:0 "Salt and Loot"
 GGR_salt_and_loot_desc:0 "All of the riches of Kaukasien are ours for the taking. The industrial equipment of their ruined factories will be disassembled and shipped to the Rhineland, the slaves that toil in their mines and oil fields will be be carted around the rest of the Reich to bolster production elsewhere, and the remaining gold in the coffers of the fallen will be sent right back to our vaults in Germania. All that was once theirs is ours again--such is our prerogative as conquerors."
 GGR_except_for_the_wells:0 "Except for the Wells"
 GGR_except_for_the_wells_desc:0 "The singular industry of substantial strategic use in Kaukasien is the petroleum industry in Baku. Their production of oil is essential for the continued war effort of the Reich, and so they shall be allowed to continue to produce their bounty mostly unimpeded. We shall have no such reservations for the rest of the Reichskommissariat; the slaves and factories are ours for the taking: the just rewards of our great victory over the traitors. If anyone objects to the expropriation of their property to the Reich, perhaps they should have thought twice about siding against us."
 GGR_an_act_of_clemency:0 "An Act of Clemency"
 GGR_an_act_of_clemency_desc:0 "It is not the application of force that properly conveys strength, but the reservation of force. Our power in the Reichskommissariat Kaukasien is absolute. If we wanted, we could have every man alive between Persia and the Sea of Azov shot. That we don't is not some artefact of weakness, but simply the recognition of the truth that it is better not to do so; that is just as it shall be with our treatment of the people of this newly reclaimed colony.\n\nThe Reich has attempted to subjugate the Caucasians by threat of force for decades now, and has had little success in preventing the frequent outbreak of revolt and sedition. This time, we ought to try a new approach, and make some small effort to improve the stand of living in the Reichskommissariat, to induce some degree of loyalty to the Reich from the native people here. Needless to say, many of our generals abhor the idea. But many others are at least willing to give it a shot."
 GGR_back_in_business:0 "Back in Business"
 GGR_back_in_business_desc:0 "The purpose of our involvement in the Caucasus has at long last been achieved. The oil fields are ours again, and their infrastructure has been repaired to pre-war conditions, sufficient to deliver hundreds of thousands of barrels a day to the thirsty planes, trains and automobiles of the Deutsches Reich. With all the equipment fixed and all the corpses buried, we can finally get back to real business in Baku: extracting sweet black gold from the Earth with maximum efficiency. May the wells never run dry and the fuel never stop pumping."
 goering.schwarzes_gold.1.t:0 "Let The Oil Flow"
 goering.schwarzes_gold.1.d:0 "\"Herr Pleiger, it is so good to see you again after all this time! I cannot express my gratitude for your support during the recent Bürgerkrieg unpleasantness. The oil you provided us was most useful - yes, very useful in the cause of securing Germany.\"\n\nGöring put his hand out to the industrialist he himself had propelled to the path of upper management in 1937, what felt like a lifetime ago now.\n\nPleiger shook the outstretched hand, but it was with a level of detached coolness that put the Führer on edge, \"Thank you for the generous words my Führer. You have read the terms of the arrangement I sent to you on our re-involvement in the Reich I trust?\"\n\nGöring was taken aback somewhat, he had expected a few more pleasantries to be exchanged before they got down to business. \"I-I looked it over yes, skimmed through a good deal of it. I had my aides review the rest of it in greater detail.\"\n\nPleiger pressed forward, \"So then you do understand what I will require. That's good, I would like to get back to work as soon as I can. You can have as much oil as we can produce, as long as I get the breathing space I need to work.\"\n\nGöring had been on the back foot, not the kind of situation he wanted to be in as the Führer. He forced his good humor to come back and tried to regain some control of the conversation, \"Of course, of course Herr Pleiger, you'll have total control of operations at your discretion I promise. Please, why don't we discuss the finer details over dinner at Carinhall? I promise the food is quite excellent.\"\n\n\"My deepest apologies but I must decline my Führer, the work around here never ceases and if we are to begin producing enough for your army once again we will need to expand even further. Please sir, I would ask that you leave me now.\"\n\n\"Oh, I see Herr Pleiger. I will leave if it disrupts your efforts.\" Göring had the horrible feeling that for all that he had, he was powerless here. What choice did he have though? Pleiger controlled the oil, and if he didn't cooperate, he'd have to risk destroying the machinery that made it possible. Cooperating was the simplest and most efficient way to get what he needed to fuel his conquests."
 goering.schwarzes_gold.1.a:0 "But that didn't mean he had to like it."
 goering.schwarzes_gold.2.t:0 "Fall Of The Rogue State"
 goering.schwarzes_gold.2.desc:0 "We have finally toppled the madman Josias from his tower as he plummets to the ground in his own ego and insanity. The rich oil fields of Kaukasia are now ours to be used - they will serve as one of the most important flows directed towards the beating heart of the Wehrmacht; the planes, the tanks, the ships, Kaukasia's black gold will reinforce our army's offenses!"
 goering.schwarzes_gold.2.a:0 "Heil Göring!"
 goering_peace_events.16.t:0 "The Conquest of Kaukasia"
 goering_peace_events.16.desc:0 "The difference between being senile and being insane was on clear display when you took a look at Reichskommissariat Kaukasia in comparison to the rest of the Reich. For as poorly as Hitler had managed the Fatherland in his later years, for how passively he allowed the factionalism which caused the civil war to grow, for how easily he allowed the economy to freefall and for the Russians to regain their strength, nothing he had done was anywhere close to the damage Josias had done to his colony.\n\nThe only roads that existed were those between resource deposits and docks, airports and government buildings, cities and military bases. Everything else hadn't just been ignored, but actively destroyed. There was no healthcare, no education, no basic standards of living . . . Most of the Reichskommissariats were run solely for profit, but these cursed lands had been inflicted with something far more sinister; It was beyond even Machiavellian in nature, for there seemed to be no purpose behind terror, no reason for the amount of cruelty our soldiers witnessed as they stormed the border. Oppression had stopped being a means to an end to ensure stability, and had become the means themselves. It was as if the man was intentionally trying to create as much misery and chaos as possible.\n\nAnd the only thing that stopped him was the fact that he tried to spread such chaos to Germania.\n\nHe dared to oppose our might, his twisted kingdom no doubt having given him a false sense of invincibility, one that the Führer was all too happy to rip away. And yet, in doing so, he had learned that he and his men were being hailed as liberators. Liberators! All when their only objective was to crush the rebels and reestablish one of the most brutal colonial systems the world had ever known. All because of the madman. All because anything was better than Josias. That was the difference between senility and insanity. It was a thought that shook Göring to his very core.\n\nBecause he knew that one day, he would have to turn west. One day, he would have to face something even worse."
 goering_peace_events.16.a:0 "If Hitler was senile and Josias was insane, then Himmler was both"
 GGR_invite_kaukasia:0 "Reestablish RK Kaukasien"
 GGR_invite_kaukasia_tooltip:0 "In the Civil War, the industrialists of Kaukasia were smart enough to know which was the winning choice and supported us with all the oil we had needed. Now that we have reestablished our position in Europe, we can pay back their kindness by integrating them into the Reich, guarantee them some autonomous control over the oil profits as well as their security."
 CAU_disuinited_army:0 "Disunited Army"
