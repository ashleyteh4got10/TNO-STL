l_simp_chinese:
 GGR_operation_locked_tooltip:0 "We can execute only one operation at a time"
 GGR_plan_A:0 "War Plan A"
 GGR_plan_A_desc:0 "With our periphery secured, it is time to look out into what used to be a part of our great empire.\n\nMany of the Reichskommissariats used the chaos of the German Civil War to break free from our grasp! Cleary, this can not, will not stand.\n\nIf we are to be taken seriously on the world stage, we need to secure what rightfully belongs to us! It is time to rally the Wehrmacht; we have work to do. "
 GGR_stabilising_regime:0 "Stabilising Regime"
 GGR_stabilising_regime_desc:0 ""
 goering.51.t:0 "War Plan A Begins"
 goering.51.d:0 "The map of Europe in front of him was large, almost comically so. Göring's mind couldn't help but wander off, considering the general staff meeting had been going on for almost six hours by this point. Endless monologues on military capabilities, strategic resources in the new set of targets and potential testing grounds for new weaponry had been long and boring enough. But now the officers kept arguing about which area to prioritize. While a welcome distraction at first, the Führer quickly found his head aching, as argument upon argument was repeated again and again.\n\n\"Not as crucial as our control over the Baltic, the last thing we need is the OFN in Scandinavia\"\n\"The longer we wait in the East, the more it will remove itself from our grip\"\n\"The strategic resources of the Balkan should have highest priority\"\n\"England or Switzerland, either of them are an insidious threat that we must deal with\"\n\"Enough!\"\n\nFinally Generalfeldmarschall Schörner intervened, bringing the discussion to an abrupt end. The moment of relief within Göring quickly faded as the Schörner's gaze shifted to him.\n\n\"The Führer will decide ... won't he?\""
 goering.51.a:0 "There are choices, but indecision isn't one."
 goering_peace_events.12.t:0 "The Conquest of Bulgaria"
 goering_peace_events.12.desc:0 "It was impossible for an Aryan to understand the inferior mind of a slav. That was what separated the two racial groups, more so than physical superiority. It was just a different way of thinking; The German was a warrior, a scientist, and an artist rolled into one. The Bulgarian, meanwhile, was...Well, soon to be nothing, once the Reich was done with them. But until that point, he was just a fool, as proven by their own actions.\n\nPerhaps in the immediate aftermath of the civil war, it was believable that Germany would never rise again. That it had destroyed itself so thoroughly that future military intervention was simply out of its reach for the time. The Dutch, the Danes, the Poles, the Slovakians . . . They could feasibly be forgiven-no, just understood-for making such a mistake. But we were all well past that point, weren't we? Surely by the time that we had blitzed our way through seventy percent of Europe, people would begin to recognize that the eagle was soaring once again. Surely by now, there wasn't a single nation so delusional as to believe that they could be the exception to the rule. Especially one who knew some of the inner workings of our military.\n\nBulgaria was a former Axis power; it was why the Führer was merciful enough to offer them a chance at negotiations, a chance to rekindle lost friendship. All they had to do was offer up enough concessions to make such a friendship worth their time, and all this tragedy and loss could have been avoided. But instead, they just had to fight, didn't they? Had to go down swinging, had to take as many good Aryan men down with them as they could. It was pathetic, pointless, and spiteful. And for such an act of defiance, they would receive no mercy.\n\nMilitärbefehlshaber Leo Hepp received the order; Bulgaria was now his domain, and his objective was twofold; Treat the people living there like any other group of slavs..."
 goering_peace_events.12.a:0 "...And turn the area into a stepping stone for the next advance."
 goering_peace_events.27.t:0 "The Conquest of Greece"
 goering_peace_events.27.d:0 "The cradle of civilization. Those who first lit the flame of western civilization. The founders of Democracy. And if you believed Himmler, Fascism as well. Sparta was his ideal society, after all; a land where all the men of the purest race were warriors, all the women of purest race were mothers, and literally everything else was delegated to the inferior. Of course, if you asked him, that race was Aryan instead of Mediterranean.\n\n'But then again,' Göring thought to himself. 'At least he doesn't get to decide the past.'\n\nEven as thoughts of the Shadow State and its ruler plagued him, the Führer tried to enjoy his state visit to Greece, to both Sparta and Athens alike. It was just good propaganda; It showed that the Germans were here to stay, of course, but it was also an honour, one that very few of the conquered nations the Wehrmacht had claimed had been privileged with. The presence of the Führer indicated that, if not the people, at least the lands they resided on were respected. Furthermore, every picture distributed of Göring reacting with fascination at the sight of a Greco-Roman statue or architectural design showed to his people and the rest of the world that he was a cultured, distinguished man, that he could appreciate history when he saw it.\n\nAnd he really could; so much so that he claimed many priceless, ancient symbols of Greek national pride for his own personal possessions. It was a compliment, really.\n\nEventually, there wasn't anything left to see, and business back home could not be delayed any longer. So he smiled for the cameras one last time, before both symbolically and literally handing control over to Leo Hepp, Militärbefehlshaber of Balkanhalbinsel. He was here to make sure the Greeks knew, once and for all, that the Italians and their 'Romans' were not welcome here, nor could the Greeks themselves and their 'Byzantine' culture be trusted with their own history. It was the true Holy Romans who would be governing these lands from now."
 goering_peace_events.27.a:0 "Prometheus stole fire. The Führer stole it back."
 GGR_invade_bulgaria:0 "Invade Bulgaria"
 GGR_invade_macedonia:0 "Invade Macedonia"
 GGR_invade_greece:0 "Invade Greece"
 GGR_invite_bulgaria:0 "Invite Bulgaria in Pakt"
 GGR_bulgaria_conquered_tooltip:0 "We have succeeded in the conquest of §YBulgaria§!\n"
 GGR_conquered_greece: "We have succeeded in the conquest of §YGreece§!"
 GGR_operationsealionii:0 "Unternehmen Seelöwe II"
 GGR_operationsealionii_desc:0 "Treacherous Albion has used our distraction in the Civil War to fall back into degeneracy and \"free\" itself. We will give them a reminder, that WE are the masters of Europe. Like in the 40's, we will land on the shores of Britannia. London has fallen once and now it will do so again. And then we will ensure more... capable hands are in power."
 GGR_readythekriegsmarine:0 "Ready The Kriegsmarine"
 GGR_readythekriegsmarine_desc:0 "There was once a time where Germans stood in awe of the might of the British fleet. Few questioned the authority the British had over the waves, and yet through Germany's ingenuity and determination we have been able to supersede Britain as a global naval power.\n\nIt is once again time for our glorious ships to ride out into battle on the high seas. Our mighty battleships shall evoke fear within the hearts of all British sailors, as our submarines lurk below the waves to deliver the finishing blow. This time, we will show Britannia who truly rules the waves!"
 GGR_fallleibwache:0 "Fall Leibwache"
 GGR_fallleibwache_desc:0 "The time has come to initiate Fall Leibwache. The infiltration of the government, institutions and very society of the Free English will not only secure us with the necessary intelligence, but also provide the ability to inflict damage and inspire chaos whenever we so desire. Caution is paramount, however: If we overstretch our admittedly limited resources, we will inevitably be caught."
 GGR_loadthetransports:0 "Load The Transports"
 GGR_loadthetransports_desc:0 "The invasion draws nearer and nearer with every passing day, and our brave troops are desperate to proclaim dominance over the treacherous English. We must begin loading up our transports with more troops for the invasion. The English are notoriously fierce fighters, but against a greater number of German troops their defeat will be inevitable."
 GGR_sendoutthewolves:0 "Send Out The Wolves"
 GGR_sendoutthewolves_desc:0 "It seems as if the cowardly British have sent various diplomatic envoys to other nations in an attempt to receive aid and military supplies. We must not allow this to take place! Our elite squadron of U-boats shall be sent out to destroy their merchant convoys, using our notorious wolfpack submarine attacks to sink any who oppose us. Let our foes feel the full wrath of our wolves!"
 GGR_convoyescortdoctrine:0 "Convoy Escort Doctrine"
 GGR_convoyescortdoctrine_desc:0 "The trip across the channel, while not a particularly lengthy one, leaves our troop convoys especially susceptible to aerial bombardment from above. In order to help prevent an enemy attack, a submarine escort along with several anti aircraft weapons shall be dispatched alongside our troop convoys in order to ensure their safety. We must do everything in our power to prevent an unexpected attack from our enemy, or else this invasion will be much shorter than expected. "
 GGR_contacttheholdouts:0 "Contact The Holdouts"
 GGR_contacttheholdouts_desc:0 "Those who have remained loyal to the Reich and the National Socialist ideal will be rewarded for their devotion in due time. Or at least, that's what we shall tell them. For now, we must initiate contact with the many disparate collaborationist groups, as well as German holdouts in Cornwall, to utilize their zeal for our own aims."
 GGR_bombsoverbigben:0 "Bombs Over Big Ben"
 GGR_bombsoverbigben_desc:0 "The invasion has begun. Göring shall hold a powerful speech about the amicable motivations for the invasion of England by the German Reich, to not only rile up the German people, but persuade the English that they must accept their inevitable defeat. All the while, our jet bombers are being utilized to annihilate all resistance in the city of London. Victory is close."
 GGR_radioblackout:0 "Radio Blackout"
 GGR_radioblackout_desc:0 "We must grant further aid to our loyal rebels, in the form of information and equipment. With the right tools, they should be able to cause a complete radio blackout throughout the entirety of England for two days at the very most. One or two days are all we shall need to grab a proper foothold on the British Isles, and by then the English will stand no chance."
 GGR_preemptiveresistence:0 "Preemptive Resistance"
 GGR_preemptiveresistence_desc:0 "Now that the various resistance cells have been united into one loyal bloc, we shall begin sending the necessary resources. The rebels shall be encouraged to wreak as much havoc as possible, no matter how brutal or how widespread. While the actual damage is likely to be minimal, such actions will not only distract the government but inflict severe psychological damage on the population at large, who will soon discover that defending their island will once against prove fruitless."
 GGR_thesecondsurrender:0 "The Second Surrender"
 GGR_thesecondsurrender_desc:0 "Britain is ours! The cowardly British people have once again fallen under the swift boot of Germany, and have surrendered their capital and munitions to superior German forces. Just as the original operation Sea Lion was a resounding success, our forces today have swiftly defeated our Anglo foe once again. Today marks a glorious victory for all the Reich, as German swastikas proudly wave across the rooftops of much of England and German men and women back home flood the streets to celebrate our victory.\n\nWith our military occupation of the British homeland, we have begun instrumental steps in asserting our authority over the greater British peripheries. Soon, not only England, but the rest of the British Isles shall bend the knee to the indomitable German spirit. Deutschland über alles!"
 GGR_backtothemills:0 "Back To The Mills"
 GGR_backtothemills_desc:0 " While much of England's material wealth has already been sufficiently exported to the mainland, it appears as if there is one commodity which we are always in need of: steel. And so, in order to remedy this issue, the men and women of Britain shall be put to work within the steel mills, in order to produce fine steel for German arms. This way, the British economy can be rebuilt while the proud people of Germany can benefit from British steel."
 GGR_aswastikaoverwindsor:0 "A Swastika Over Windsor"
 GGR_aswastikaoverwindsor_desc:0 "Hurrah! Victory is ours. The blood, sweat, and tears of the German people shall no longer be in vain. The government has been swiftly dealt with, with several members of the royal family being executed for their intolerable crimes against the Reich. No longer will the traitorous British people be allowed control over their own land. From this day forward, the proud and honorable Militärverwaltung Großbritannien shall be established in order to prevent further disloyalty against the German Reich."
 GGR_fightingonthebeaches:0 "Fighting On The Beaches"
 GGR_fightingonthebeaches_desc:0 "During the first operation Sea Lion, our men fought with great distinction to claim the shores of the English Channel. It was grewling fight, and men died by the scores to claim the beachheads that allowed us to push further into the English mainland, step by bloody step. The amphibious assault was so brutal that an entire division was broken upon the White Cliffs of Dover. We cannot allow such an attritional slog to occur in our planned invasion for Sea Lion II - we have neither the time nor the will if truth is to be told. England is not worth breaking the Reich over, which is why we must fight smarter, not harder. We will fight them on the beaches and in the streets, we will force them to surrender!"
 GGR_slowandsteady:0 "Slow And Steady"
 GGR_slowandsteady_desc:0 "As ideal as a swift invasion would be, the conquest of the British Isles must be carefully planned and executed in order to minimize German casualties in this conflict. Instead, let us continue our planning in order to ensure that our preparations are foolproof. Once we are prepared, their hastily constructed and inferior defenses will be no match for our military might. After all, the tortoise did beat the hare in the end."
 GGR_fullsteamahead:0 "Full Steam Ahead"
 GGR_fullsteamahead_desc:0 "To hell with carefully drawn out plans and invasions! Our time to strike is now! The Wehrmacht is eager to storm the beaches of England once again, destroying all who dare resist the might of the German war machine. This won't be a mere war, but rather a complete and utter annihilation of the fools in London who would deem it wise to fight the glorious might of Germany. Onwards!"
 GGR_aloyal5thcolumn:0 "A Loyal 5th Column"
 GGR_aloyal5thcolumn_desc:0 "The various factions of the English resistance must become united as one mighty pillar of strength if we are to ensure that a conquered England remains under our boot. From those scared of German reprisal, to fervent collaborationist fascists, to remaining German holdouts, the unification of these cells must be swift and efficient. Any untrustworthy resistance members shall be cut off from our precious aid. We support absolute loyalty, and absolute loyalty only."
 GGR_keepthemblind:0 "Keep Them Blind"
 GGR_keepthemblind_desc:0 "Preparations must be made for the next stage of our infiltration plan. The information network of England must become completely and utterly crippled as soon as our invasion begins. With no knowledge of our troop movements or aerial strikes, they will be completely unprepared for our eventual onslaught. To conquer the lion, we must blind it first."
 GGR_planningthereturn:0 "Planning The Return"
 GGR_planningthereturn_desc:0 "The British Isles, while geographically separated from the rest of Europe, has remained a thorn in our side for decades. They have harassed us, assaulted us, and have killed many innocent men and women of Germany. Now, they once again seek to undermine the Führer's authority and act in direct defiance to the Third Reich. How dare they! It seems as if they have forgotten when German bombers bombed their cities and German boots stormed their beaches. It is our duty to remind the English filth of their subservient position as our subject, and we will take any means necessary to do so. Plans have been drawn out to partake in the next iteration of Unternehmen Sea Lion, the successful naval invasion of Great Britain many years ago.\n\nMany in German high command have suggested that a direct and immediate invasion is the most effective means of defeating our enemy, however some suggest that a more subtle approach utilizing subversive elements and German sympathizers in Britain could more easily win us this war. While both methods could technically be implemented, time is of the essence and the Führer's patience grows thinner every minute we wait."
 GGR_disposeoftherabble:0 "Dispose Of The Rabble"
 GGR_disposeoftherabble_desc:0 "It seems as if the various insurgents and revolutionaries of Britain are not satisfied by our conquest of the isles. Apparently, they expected us to actually follow through with our promises of an \"independent England\" restored to its pre-war state. Frankly, it was their fault for believing in such preposterous notions. It is time we put these rebellious traitors back in their place."
 GGR_lootthevaults:0 "Loot The Vaults"
 GGR_lootthevaults_desc:0 "Germany once grew prosperous through the conquest of our enemies, and shall do so once again. The English homeland is home to a collection of great material wealth, something that would be of great use in fueling the German war machine. We will order our men to loot everything in sight, ordering them to bring these spoils of war back to Germany to better our Fatherland. Leave no corner untouched!"
 GGR_operationsealion2:0 "Unternehmen Seelöwe II"
 GGR_operationsealion2_desc:0 "The British Isles - first occupied by Germans in the fifth century, most recently in the twentieth. As bastardised as the British are, it is vital that they remain within the Pakt - their control of the North Sea and the Atlantic was unparalleled for the past two hundred years. We are lucky to have neutered their vaunted Royal Navy already. It will be a simple matter to hop the channel and one more subjugate them to the Reich."
 GGR_deploythemtotheborder:0 "Deploy Them To The Border"
 GGR_deploythemtotheborder_desc:0 "As our troops gather on the border between Cornwall and England, it is of the utmost importance, that no suspicion is raised in the English government, regarding their purpose. As such we will not construct any defensive works, which would be a dead giveaway. Instead it has to be ensured, that when the time comes, the Heer can dig their foxholes as fast as possible."
 GGR_outofgovernment:0 "Out Of Government..."
 GGR_outofgovernment_desc:0 "Fascist friends are few and far between in England. Oswald Mosley left for Canada when he realised we wouldn't let him have his own fiefdom, and what's left of the British Union of Fascists are more prone to side with the Resistance than us. The only group willing to cooperate these days are the National Front.\n\nThey may not be very popular these days, due to being... well, it's best not said what the English say about them. We should meet them nonetheless. They will be vital in supporting our retaking of the Isles."
 GGR_ourgreatenglishfriends:0 "Our Great English Friends"
 GGR_ourgreatenglishfriends_desc:0 "The National Front has done surprisingly well recently. A little too well. The whole point of our occupation of England was to neuter them, such that they could never threaten the Reich again. We should probably do something to fix this - they seem to believe us all but omnipotent, so it shouldn't be too hard. If we send a few conflicting reports to a few conflicting ministries, it might cause a little conflict - they are practically champing at the bit to please the Reich, and each one is eager to get a leg up on the other. All the better to eat them with."
 GGR_thebatteredgarrison:0 "Rehabilitate The Battered Garrison"
 GGR_thebatteredgarrison_desc:0 "The Cornwall Garrison was established after operation Sea Lion, to better monitor the British Isles. Their patrols quested through the South of England and Wales, searching out rebels and Communists, but they have seen better days. Since the Reich collapsed into civil war they have been starved of men and materiel, but they have performed admirably nonetheless.\n\nIt is vital that proper contact be re-established between the Garrison and the Heer and they be reintegrated into operational command.. The lessons learned on both sides will vitally inform the other, and they will be an essential beachhead when the time comes to once again set foot on the cliffs of Dover."
 GGR_refitthetroops:0 "Refit The Troops"
 GGR_refitthetroops_desc:0 "The Cornwall Garrison consisted of some of the best soldiers in the Reich when it was at its apex. Since it was left adrift in the Bürgerkrieg, it was forced to fend for itself. A hard time, but hard times breed harder men. The Garrison has bred innovative tactics in its conflict against the English, but they have been starved of the Reich's industrial might. Where previously they were forced into the inglorious Breton black market, they will now be brought to the Reichstag, who will undoubtedly see the necessity of funding the Garrison to better secure the Isles."
 GGR_expandtheinfrastructure:0 "Expand The Infrastructure"
 GGR_expandtheinfrastructure_desc:0 "Roadbuilding has taken a lesser priority on both sides of the border between Cornwall and England proper, and this will not do. The Garrison adapted well to countering the guerilla operations of the Resistance, but if we are to perform another full scale occupation it is vital the English infrastructure can take it.\n\nInvestment into the roads of Cornwall will give a jump start to any forces marching into the South of England, and it appears innocuous enough. Only a matter of time before they will be ready to bear a tank column."
 GGR_identifythetargets:0 "Identify The Targets"
 GGR_identifythetargets_desc:0 " It has been too long since we performed a proper assessment of English capabilities. Our current intelligence dates back to before the uprising, so a checkup is in order. A staff mission from Oberkommando der Wehrmacht will go and see the sights - the Welsh and Scottish borders, the great shipyards at Barrow and Liverpool, the training grounds that forged the men that put down the Resistance.\n\nOf course, this is not just a holiday. This is vital information, to be one day used when we take the British Isles once again. Every spot on this trip is a prime target when the Luftwaffe once more fly over the skies of England. This is forward reconnaissance."
 GGR_requesttheirplans:0 "Request Their Plans"
 GGR_requesttheirplans_desc:0 "The English were separated from their British Empire in the wake of our first invasion - they undoubtedly have plans to retake it. Scotland and Wales have worried about the possibility for years and drawn their own plans to counter, but we have a unique advantage - we can just ask for them. The Royal Party are anxious to prove their loyalty, and would gladly let us scope out their capabilities in exchange for a few tips."
 GGR_preemptivesabotage:0 "Preemptive Sabotage"
 GGR_preemptivesabotage_desc:0 "The advantage of making the first move is a great one - even greater if your opponent does not even know the game has begun. The English Government still believe they can placate us, but their incompetence has been proven already. Time to take steps.\n\nThe National Front will be our stalking horse - while they may not have much support in Parliament they make up a significant portion of the English security forces. They have access to warehouses, dockyards, arsenals and airfields, and they have plenty of experience fighting the Resistance. Now they shall be a new Resistance."
 GGR_the2ndsurrender:0 "The Second Surrender"
 GGR_the2ndsurrender_desc:0 "The Führer has done it once and he has done so again. London and England are once more at his mercy. With the English government formally disbanded, Militärverwaltung Großbritannien is already in the process of securing it's authority, as our \"friends\" from the National Front move in to handle the boring day-to-day business."
 GGR_butnotoutofuse:0 "But Not Out Of Use"
 GGR_butnotoutofuse_desc:0 "The National Front may expect to be gifted control of England when all is said and done - this will not happen. An inexperienced, uncultured gang of thugs should not be left in charge of a country. Thugs have their uses however - garrisoning half of Europe takes men, and the Front certainly have experience marching the streets. They will supplement our government rather than form their own, granted administration and policing roles and allowed to keep the peace. "
 GGR_letthebombsfall:0 "Let The Bombs Fall"
 GGR_letthebombsfall_desc:0 "The time has finally come, to but the Anglo under the German boot again. Using Cornwall as the springboard, we will depose the English regime and bring in our trusty lackeys. Though London might seem difficult to reach at the moment, with our extensive disruption effort the English opposition should be reduced."
 GGR_movelikelightning:0 "Move Like Lightning"
 GGR_movelikelightning_desc:0 "Our operation in England seems to have run into a few ... difficulties. However the past is the past. Right now we must find any way to reach London as fast as we can. The longer we wait, the more likely it becomes, that the traitorous Anglos recover from our attack."
 GGR_stranglethepartisans:0 "Strangle The Partisans"
 GGR_stranglethepartisans_desc:0 "Among the many issues that follow our victory on the Isles, the most pressing ones are the partisans that we have \"acquired\". Currently they are held in former prisons, barracks, makeshift camps or even barns in the countryside. Their fate has to be determined. The trials that will follow and their results will be introduction to our future rule."
 GGR_givehalderapromotion:0 "Give Halder A Promotion"
 GGR_givehalderapromotion_desc:0 "Franz Halder has performed admirably in his service to the Reich, his command of Cornwall decisive in rooting out dissidence. His forces were instrumental in both preserving order in Britain before the Bürgerkrieg and aiding in our reoccupation, and it is only fitting that he be rewarded for his continued efforts.\n\nReichsmarshall Schörner seems to take objection to Halder rising any further, though he will not say it. He has simply flooded us with his own proposals for the command, but apart from his cronies the rest of the OKW are ready to welcome another war hero into their ranks."
 GGR_orchestratedriots:0 "Orchestrated Riots"
 GGR_orchestratedriots_desc:0 "The National Front are well known for making noise in the streets of London, and indeed all the once-great industrial cities of England. We can turn this to our advantage, and maybe turn a few more Anglos to the side of the Reich. It is plain to see England has suffered from their lack of trade with Germany and its allies. Let them make a fuss ."
 GGR_neveranotheruprising:0 "Someone Lower Deserves A Chance"
 GGR_neveranotheruprising_desc:0 "Franz Halder has performed admirably in his long service to the Reich. His command of Cornwall was effective in maintaining order, and brutal in its execution of its mandate, but lately the man has been slowing down. His service has been too long.\n\nIt is time for him to rest on his laurels, perhaps write some memoirs - though not too detailed. Wouldn't do for some of the things he had ordered on the Eastern Front to be exposed. We'll provide a nice pension, and meanwhile appoint his successor. One of Schörner's cronies should do. The Führer's desk has been overfilled with suggestions, and it would be convenient to get one of the warhawks out of the capital - and the decision making process."
 GGR_raidthevaults:0 "Raid The Vaults"
 GGR_raidthevaults_desc:0 "The invasion of England is complete, and with it comes the section that follows all of our conquests- looting. England, despite its hardships in recent times, is a very wealthy nation. Its coffers are still full to bursting with gold- the perks of being a world empire for a hundred years. It is time that we requisition this wealth for our own purposes.\n\nThe business of war is quite the expensive one, and another hit of gold into our supply will continue to fund our war machine for quite a while longer. We can only thank God for saving the King long enough for him to hand his wealth over to us. We'll certainly need it."
 GGR_razethecities:0 "Raze The Cities"
 GGR_razethecities_desc:0 "All cities have rebels, but some have more rebels than others. England in particular is a rebel goldmine, and we will have to take appropriate measures. We took careful note of the English Civil War despite our own troubles, and mapped the main centres of rebel activity. These cities will be treated without mercy.\n\nCoordinated artillery strikes and heavy bombing will force them down, and if they rear their heads once the Heer start pushing in, we will simply withdraw and firebomb them."
 GGR_buytheirarsenals:0 "Buy Their Arsenals"
 GGR_buytheirarsenals_desc:0 "The English government is permanently cash-strapped, always asking for aid or arms or loans. Rejoining the Pakt to them represents both peace and prosperity - now the rebels have been put down, they see no reason not to turn swords into ploughshares. This represents a prime opportunity to disarm them. We'll rustle up a few million to buy their rifles out from under them, and when we once again set foot in London we'll ask for our money back. They'll be in no position to argue."
 GGR_case_cerdic:0 "Fall Cerdic"
 GGR_case_cerdic_desc:0 "Our custody of England was doomed to fail while the rest of Britain was outside our grasp. The Scottish allowed rebels to flow both ways through the border, the Welsh sent their coal but did little more than ask for help.\n\nIreland is a whole different kettle of fish - we may have helped them gain Ulster but former Northern Ireland is a den of terrorists and English exiles. We must root them out once and for all."
 GGR_infiltrate_scotland:0 "Infiltrate Scotland"
 GGR_infiltrate_scotland_desc:0 "The Scots have been paranoid about German infiltrators on the highest and lowest levels ever since their forced separation. Ironically enough it hasn't been remotely true, but now we might as well send in the spies. Years of jumping at shadows should have softened them up - now we'll get ready to knock them down."
 GGR_invade_scotland:0 "Invade Scotland"
 GGR_cut_off_the_dragons_tail:0 "[ROOT.GetGGR_wales_status]"
 GGR_cut_off_the_dragons_tail_desc:0 "[ROOT.GetGGR_wales_status_desc]"
 GGR_invite_wales:0 "Crush the Unionist Dream"
 GGR_invite_wales_desc:0 "Strangely enough the Welsh have adopted a government which is not only hateful to the idea of a Union with England but also friendly towards the Pakt. This nice surprise will aid us greatly in our conquest of the isles and occupation. By inviting Wales and crushing any who even dream of a union with England there we ensure a loyal country with vested interest in the continued occupation of England exists, thus should we ever find ourself in a situation where the English rise up once again the Welsh will surely be on our side ready to defend their nation against the Anglo menace."
 GGR_invade_wales:0 "Cut Off the Dragon's Tail"
 GGR_invade_wales_desc:0 "Wales was always something of an afterthought in post-war planning, hence why they sat detached from England and the Reich in a strange middle ground, sending their coal and not doing much else. If they continue to be left alone however they will become a rebel haven and an ugly spot on the map. Instruct the OKW to draw up plans for an invasion"
 GGR_incite_irish_tensions:0 "[ROOT.GetGGR_ireland_status]"
 GGR_incite_irish_tensions_desc:0 "Ireland was eager enough to jump on the British at the end of the last war, but like all the others they came running for our help when the invasion of Ulster stumbled. Twenty years later and not much has changed - the Ulstermen continue to resist their southern brethren, and the Republic asks for out help.\n\n[ROOT.GetGGR_ireland_status_desc]"
 GGR_invade_ireland:0 "Incite Irish Tensions"
 GGR_invite_ireland_desc:0 "Ireland has continued its slow drift towards the Reich, and now sits comfortably within the Einheitspakt. The rebels in Ulster still remain a thorn in their side however, one that must be dealt with if the Pakt's dominance in Britain is to be secured. Military police units will be sent to assist our Irish allies."
 GGR_invite_ireland:0 "Put down Ulster Unionists"
 GGR_invade_ireland_desc:0 "The Republic has proven a poor ally, unable to properly integrate the province they fought so much for. Ulster's pro-British militias will never willingly ally with the Reich, but they could easily be fooled to bring about its goals. False-flag bombings on both sides of the border will set them against one another, ready for us to return and clean up the mess"
 GGR_conquer_the_isles:0 "Conquer the Isles"
 GGR_conquer_the_isles_desc:0 "England was always the main challenge in Britain. Now that that speed bump has been overcome, we can deal with the scraps. The remaining nations of the Isles would likely band together if we gave them the chance - better we declare war on them all at once, to rob them of the advantage."
 GGR_the_new_cornwall_desc:0 "Now is time to divvy up the spoils. Cornwall was an excellent spot to monitor England and Wales, but what about the rest of the Isles? There is one solution that satisfies both ideology and pragmatism. The Shetland Islands.\n\nDenmark's overseas possessions were cared up by the Allies in the wake of our occupation of the mainland. Iceland and Greenland went to the Americans, but the Shetland Islands remained with Scotland after we broke the British. The Shetlands will prove an excellent air and naval base with which to keep a watchful eye on Britain."
 GGR_the_new_union:0 "The New Union"
 GGR_the_new_union_desc:0 "The British Isles have been united for the first time since 1921. Not many would have predicted it would occur this way, but not many would have predicted most of the events of this century. The British will have to get used to their new situation, and their new way of living. They should feel privileged - they have it better than most."
 GGR_operationsealionii_new:0 "Untermehmen Seelöwe II"
 GGR_operationsealionii_new_desc:0 "Treacherous Albion has used our distraction in the Civil War to fall back into degeneracy and \"free\" itself. We will give them a reminder, that WE are the masters of Europe. Like in the 40's, we will land on the shores of Britannia. London has fallen once and now it will do so again. And then we will ensure more... capable hands are in power."
 GGR_readythekriegsmarine_new:0 "Ready The Kriegsmarine"
 GGR_readythekriegsmarine_new_desc:0 "There was once a time where Germans stood in awe of the might of the British fleet. Few questioned the authority the British had over the waves, and yet through Germany's ingenuity and determination we have been able to supersede Britain as a global naval power.\n\nIt is once again time for our glorious ships to ride out into battle on the high seas. Our mighty battleships shall evoke fear within the hearts of all British sailors, as our submarines lurk below the waves to deliver the finishing blow. This time, we will show Britannia who truly rules the waves!"
 GGR_fallleibwache_new:0 "Fall Leibwache"
 GGR_fallleibwache_new_desc:0 "The time has come to initiate Fall Leibwache. The infiltration of the government, institutions and very society of the Free English will not only secure us with the necessary intelligence, but also provide the ability to inflict damage and inspire chaos whenever we so desire. Caution is paramount, however: If we overstretch our admittedly limited resources, we will inevitably be caught."
 GGR_loadthetransports_new:0 "Load The Transports"
 GGR_loadthetransports_new_desc:0 "The invasion draws nearer and nearer with every passing day, and our brave troops are desperate to proclaim dominance over the treacherous English. We must begin loading up our transports with more troops for the invasion. The English are notoriously fierce fighters, but against a greater number of German troops their defeat will be inevitable."
 GGR_sendoutthewolves_new:0 "Send Out The Wolves"
 GGR_sendoutthewolves_new_desc:0 "It seems as if the cowardly British have sent various diplomatic envoys to other nations in an attempt to receive aid and military supplies. We must not allow this to take place! Our elite squadron of U-boats shall be sent out to destroy their merchant convoys, using our notorious wolfpack submarine attacks to sink any who oppose us. Let our foes feel the full wrath of our wolves!"
 GGR_convoyescortdoctrine_new:0 "Convoy Escort Doctrine"
 GGR_convoyescortdoctrine_new_desc:0 "The trip across the channel, while not a particularly lengthy one, leaves our troop convoys especially susceptible to aerial bombardment from above. In order to help prevent an enemy attack, a submarine escort along with several anti aircraft weapons shall be dispatched alongside our troop convoys in order to ensure their safety. We must do everything in our power to prevent an unexpected attack from our enemy, or else this invasion will be much shorter than expected. "
 GGR_contacttheholdouts_new:0 "Contact The Holdouts"
 GGR_contacttheholdouts_new_desc:0 "Those who have remained loyal to the Reich and the National Socialist ideal will be rewarded for their devotion in due time. Or at least, that's what we shall tell them. For now, we must initiate contact with the many disparate collaborationist groups, as well as German holdouts, to utilize their zeal for our own aims."
 GGR_bombsoverbigben_new:0 "Bombs Over Big Ben"
 GGR_bombsoverbigben_new_desc:0 "The invasion has begun. Göring shall hold a powerful speech about the amicable motivations for the invasion of England by the German Reich, to not only rile up the German people, but persuade the English that they must accept their inevitable defeat. All the while, our jet bombers are being utilized to annihilate all resistance in the city of London. Victory is close."
 GGR_radioblackout_new:0 "Radio Blackout"
 GGR_radioblackout_new_desc:0 "We must grant further aid to our loyal rebels, in the form of information and equipment. With the right tools, they should be able to cause a complete radio blackout throughout the entirety of England for two days at the very most. One or two days are all we shall need to grab a proper foothold on the British Isles, and by then the English will stand no chance."
 GGR_preemptiveresistence_new:0 "Preemptive Resistance"
 GGR_preemptiveresistence_new_desc:0 "Now that the various resistance cells have been united into one loyal bloc, we shall begin sending the necessary resources. The rebels shall be encouraged to wreak as much havoc as possible, no matter how brutal or how widespread. While the actual damage is likely to be minimal, such actions will not only distract the government but inflict severe psychological damage on the population at large, who will soon discover that defending their island will once against prove fruitless."
 GGR_thesecondsurrender_new:0 "The Second Surrender"
 GGR_thesecondsurrender_new_desc:0 "Britain is ours! The cowardly British people have once again fallen under the swift boot of Germany, and have surrendered their capital and munitions to superior German forces. Just as the original operation Sealion was a resounding success, our forces today have swiftly defeated our Anglo foe once again. Today marks a glorious victory for all the Reich, as German swastikas proudly wave across the rooftops of much of England and German men and women back home flood the streets to celebrate our victory.\n\nWith our military occupation of the British homeland, we have begun instrumental steps in asserting our authority over the greater British peripheries. Soon, not only England, but the rest of the British Isles shall bend the knee to the indomitable German spirit. Deutschland über alles!"
 GGR_backtothemills_new:0 "Back To The Mills"
 GGR_backtothemills_new_desc:0 " While much of England's material wealth has already been sufficiently exported to the mainland, it appears as if there is one commodity which we are always in need of: steel. And so, in order to remedy this issue, the men and women of Britain shall be put to work within the steel mills, in order to produce fine steel for German arms. This way, the British economy can be rebuilt while the proud people of Germany can benefit from British steel."
 GGR_SL2_mills_new:0 "Get Back to the Mills!"
 GGR_aswastikaoverwindsor_new:0 "A Swastika Over Windsor"
 GGR_aswastikaoverwindsor_new_desc:0 "Hurrah! Victory is ours. The blood, sweat, and tears of the German people shall no longer be in vain. The government has been swiftly dealt with, with several members of the royal family being executed for their intolerable crimes against the Reich. No longer will the traitorous British people be allowed control over their own land. From this day forward, the proud and honorable Militärverwaltung Großbritannien shall be established in order to prevent further disloyalty against the German Reich."
 GGR_fightingonthebeaches_new:0 "Fighting On The Beaches"
 GGR_fightingonthebeaches_new_desc:0 "During the first operation Sealion, our men fought with great distinction to claim the shores of the English Channel. It was grewling fight, and men died by the scores to claim the beachheads that allowed us to push further into the English mainland, step by bloody step. The amphibious assault was so brutal that an entire division was broken upon the White Cliffs of Dover. We cannot allow such an attritional slog to occur in our planned invasion for Sealion II - we have neither the time nor the will if truth is to be told. England is not worth breaking the Reich over, which is why we must fight smarter, not harder. We will fight them on the beaches and in the streets, we will force them to surrender!"
 GGR_slowandsteady_new:0 "Slow And Steady"
 GGR_slowandsteady_new_desc:0 "As ideal as a swift invasion would be, the conquest of the British Isles must be carefully planned and executed in order to minimize German casualties in this conflict. Instead, let us continue our planning in order to ensure that our preparations are foolproof. Once we are prepared, their hastily constructed and inferior defenses will be no match for our military might. After all, the tortoise did beat the hare in the end."
 GGR_fullsteamahead_new:0 "Full Steam Ahead"
 GGR_fullsteamahead_new_desc:0 "To hell with carefully drawn out plans and invasions! Our time to strike is now! The Wehrmacht is eager to storm the beaches of England once again, destroying all who dare resist the might of the German war machine. This won't be a mere war, but rather a complete and utter annihilation of the fools in London who would deem it wise to fight the glorious might of Germany. Onwards!"
 GGR_aloyal5thcolumn_new:0 "A Loyal 5th Column"
 GGR_aloyal5thcolumn_new_desc:0 "The various factions of the English resistance must become united as one mighty pillar of strength if we are to ensure that a conquered England remains under our boot. From those scared of German reprisal, to fervent collaborationist fascists, to remaining German holdouts, the unification of these cells must be swift and efficient. Any untrustworthy resistance members shall be cut off from our precious aid. We support absolute loyalty, and absolute loyalty only."
 GGR_keepthemblind_new:0 "Keep Them Blind"
 GGR_keepthemblind_new_desc:0 "Preparations must be made for the next stage of our infiltration plan. The information network of England must become completely and utterly crippled as soon as our invasion begins. With no knowledge of our troop movements or aerial strikes, they will be completely unprepared for our eventual onslaught. To conquer the lion, we must blind it first."
 GGR_planningthereturn_new:0 "Planning The Return"
 GGR_planningthereturn_new_desc:0 "The British Isles, while geographically separated from the rest of Europe, has remained a thorn in our side for decades. They have harassed us, assaulted us, and have killed many innocent men and women of Germany. Now, they once again seek to undermine the Führer's authority and act in direct defiance to the Third Reich. How dare they! It seems as if they have forgotten when German bombers bombed their cities and German boots stormed their beaches. It is our duty to remind the English filth of their subservient position as our subject, and we will take any means necessary to do so. Plans have been drawn out to partake in the next iteration of operation Sealion, the successful naval invasion of Great Britain many years ago.\n\nMany in German high command have suggested that a direct and immediate invasion is the most effective means of defeating our enemy, however some suggest that a more subtle approach utilizing subversive elements and German sympathizers in Britain could more easily win us this war. While both methods could technically be implemented, time is of the essence and the Führer's patience grows thinner every minute we wait."
 GGR_disposeoftherabble_new:0 "Dispose Of The Rabble"
 GGR_disposeoftherabble_new_desc:0 "It seems as if the various insurgents and revolutionaries of Britain are not satisfied by our conquest of the isles. Apparently, they expected us to actually follow through with our promises of an \"independent England\" restored to its pre-war state. Frankly, it was their fault for believing in such preposterous notions. It is time we put these rebellious traitors back in their place."
 GGR_spacer_new:0 "spacer"
 GGR_spacer_new_desc:0 ""
 GGR_lootthevaults_new:0 "Loot The Vaults"
 GGR_lootthevaults_new_desc:0 "Germany once grew prosperous through the conquest of our enemies, and shall do so once again. The English homeland is home to a collection of great material wealth, something that would be of great use in fueling the German war machine. We will order our men to loot everything in sight, ordering them to bring these spoils of war back to Germany to better our Fatherland. Leave no corner untouched!"
 GGR_operationsealion2_new:0 "Untermehmen Seelöwe II"
 GGR_operationsealion2_new_desc:0 "The British Isles - first occupied by Germans in the fifth century, most recently in the twentieth. As bastardised as the British are, it is vital that they remain within the Pakt - their control of the North Sea and the Atlantic was unparalleled for the past two hundred years. We are lucky to have neutered their vaunted Royal Navy already. It will be a simple matter to hop the channel and one more subjugate them to the Reich."
 GGR_deploythemtotheborder_new:0 "Deploy Them To The Border"
 GGR_deploythemtotheborder_new_desc:0 "As our troops gather on the border between Cornwall and England, it is of the utmost importance, that no suspicion is raised in the English government, regarding their purpose. As such we will not construct any defensive works, which would be a dead giveaway. Instead it has to be ensured, that when the time comes, the Heer can dig their foxholes as fast as possible."
 GGR_outofgovernment_new:0 "Out Of Government..."
 GGR_outofgovernment_new_desc:0 "Fascist friends are few and far between in England. Oswald Mosley left for Canada when he realised we wouldn't let him have his own fiefdom, and what's left of the British Union of Fascists are more prone to side with the Resistance than us. The only group willing to cooperate these days are the British People's Party.\n\nThey may not be very popular these days, due to being... well, it's best not said what the English say about them. We should meet them nonetheless. They will be vital in supporting our retaking of the Isles."
 GGR_ourgreatenglishfriends_new:0 "Our Great English Friends"
 GGR_ourgreatenglishfriends_new_desc:0 "The British People's Party has done surprisingly well recently. A little too well. The whole point of our occupation of England was to neuter them, such that they could never threaten the Reich again. We should probably do something to fix this - they seem to believe us all but omnipotent, so it shouldn't be too hard. If we send a few conflicting reports to a few conflicting ministries, it might cause a little conflict - they are practically champing at the bit to please the Reich, and each one is eager to get a leg up on the other. All the better to eat them with."
 GGR_thebatteredgarrison_new:0 "Rehabilitate The Battered Garrison"
 GGR_thebatteredgarrison_new_desc:0 "The Cornwall Garrison was established after operation Sea Lion, to better monitor the British Isles. Their patrols quested through the South of England and Wales, searching out rebels and Communists, but they have seen better days. Since the Reich collapsed into civil war they have been starved of men and materiel, but they have performed admirably nonetheless.\n\nIt is vital that proper contact be re-established between the Garrison and the Heer and they be reintegrated into operational command.. The lessons learned on both sides will vitally inform the other, and they will be an essential beachhead when the time comes to once again set foot on the cliffs of Dover."
 GGR_refitthetroops_new:0 "Refit The Troops"
 GGR_refitthetroops_new_desc:0 "The Cornwall Garrison consisted of some of the best soldiers in the Reich when it was at its apex. Since it was left adrift in the Bürgerkrieg, it was forced to fend for itself. A hard time, but hard times breed harder men. The Garrison has bred innovative tactics in its conflict against the English, but they have been starved of the Reich's industrial might. Where previously they were forced into the inglorious Breton black market, they will now be brought to the Reichstag, who will undoubtedly see the necessity of funding the Garrison to better secure the Isles."
 GGR_expandtheinfrastructure_new:0 "Expand The Infrastructure"
 GGR_expandtheinfrastructure_new_desc:0 "Roadbuilding has taken a lesser priority on both sides of the border between Cornwall and England proper, and this will not do. The Garrison adapted well to countering the guerilla operations of the Resistance, but if we are to perform another full scale occupation it is vital the English infrastructure can take it.\n\nInvestment into the roads of Cornwall will give a jump start to any forces marching into the South of England, and it appears innocuous enough. Only a matter of time before they will be ready to bear a tank column."
 GGR_identifythetargets_new:0 "Identify The Targets"
 GGR_identifythetargets_new_desc:0 " It has been too long since we performed a proper assessment of English capabilities. Our current intelligence dates back to before the uprising, so a checkup is in order. A staff mission from Oberkommando der Wehrmacht will go and see the sights - the Welsh and Scottish borders, the great shipyards at Barrow and Liverpool, the training grounds that forged the men that put down the Resistance.\n\nOf course, this is not just a holiday. This is vital information, to be one day used when we take the British Isles once again. Every spot on this trip is a prime target when the Luftwaffe once more fly over the skies of England. This is forward reconnaissance."
 GGR_requesttheirplans_new:0 "Request Their Data"
 GGR_requesttheirplans_new_desc:0 "The English were separated from their British Empire in the wake of our first invasion - they undoubtedly have plans to retake it. Ireland has worried about the possibility for years and drawn their own plans to counter, but we have a unique advantage - we can just ask for them. The British People's Party are anxious to prove their loyalty, and would gladly let us scope out their capabilities in exchange for a few tips."
 GGR_preemptivesabotage_new:0 "Preemptive Sabotage"
 GGR_preemptivesabotage_new_desc:0 "The advantage of making the first move is a great one - even greater if your opponent does not even know the game has begun. The English Government still believe they can placate us, but their incompetence has been proven already. Time to take steps.\n\nThe British People's Party will be our stalking horse - while they may not have much support in Parliament they make up a significant portion of the English security forces. They have access to warehouses, dockyards, arsenals and airfields, and they have plenty of experience fighting the Resistance. Now they shall be a new Resistance."
 GGR_the2ndsurrender_new:0 "The Second Surrender"
 GGR_the2ndsurrender_new_desc:0 "The Führer has done it once and he has done so again. London and England are once more at his mercy. With the English government formally disbanded, Militärverwaltung Großbritannien is already in the process of securing it's authority, as our \"friends\" from the British People's Party move in to handle the boring day-to-day business."
 GGR_butnotoutofuse_new:0 "But Not Out Of Use"
 GGR_butnotoutofuse_new_desc:0 "The British People's Party may expect to be gifted control of England when all is said and done - this will not happen. An inexperienced, uncultured gang of thugs should not be left in charge of a country. Thugs have their uses however - garrisoning half of Europe takes men, and the Front certainly have experience marching the streets. They will supplement our government rather than form their own, granted administration and policing roles and allowed to keep the peace. "
 GGR_letthebombsfall_new:0 "Let The Bombs Fall"
 GGR_letthebombsfall_new_desc:0 "The time has finally come, to but the Anglo under the German boot again. Using Netherlands and Norway as the springboard, we will depose the English regime and bring in our trusty lackeys. Though London might seem difficult to reach at the moment, with our extensive disruption effort the English opposition should be reduced."
 GGR_movelikelightning_new:0 "Move Like Lightning"
 GGR_movelikelightning_new_desc:0 "Our operation in England seems to have run into a few ... difficulties. However the past is the past. Right now we must find any way to reach London as fast as we can. The longer we wait, the more likely it becomes, that the traitorous Anglos recover from our attack."
 GGR_stranglethepartisans_new:0 "Strangle The Partisans"
 GGR_stranglethepartisans_new_desc:0 "Among the many issues that follow our victory on the Isles, the most pressing ones are the partisans that we have \"acquired\". Currently they are held in former prisons, barracks, makeshift camps or even barns in the countryside. Their fate has to be determined. The trials that will follow and their results will be introduction to our future rule."
 GGR_givehalderapromotion_new:0 "Give Wulf A Promotion"
 GGR_givehalderapromotion_new_desc:0 "Rudolf Wulf has performed admirably in his service to the Reich, his command of Cornwall decisive in rooting out dissidence. His forces were instrumental in both preserving order in Britain before the Bürgerkrieg and aiding in our reoccupation, and it is only fitting that he be rewarded for his continued efforts.\n\nReichsmarshall Schörner seems to take objection to Halder rising any further, though he will not say it. He has simply flooded us with his own proposals for the command, but apart from his cronies the rest of the OKW are ready to welcome another war hero into their ranks."
 GGR_orchestratedriots_new:0 "Orchestrated Riots"
 GGR_orchestratedriots_new_desc:0 "The British People's Party are well known for making noise in the streets of London, and indeed all the once-great industrial cities of England. We can turn this to our advantage, and maybe turn a few more Anglos to the side of the Reich. It is plain to see England has suffered from their lack of trade with Germany and its allies. Let them make a fuss ."
 GGR_neveranotheruprising_new:0 "Someone Lower Deserves A Chance"
 GGR_neveranotheruprising_new_desc:0 "Rudolf Wuld has performed admirably in his long service to the Reich. His command of England was effective in maintaining order, and brutal in its execution of its mandate, but lately the man has been slowing down. His service has been too long.\n\nIt is time for him to rest on his laurels, perhaps write some memoirs - though not too detailed. Wouldn't do for some of the things he had ordered on the Eastern Front to be exposed. We'll provide a nice pension, and meanwhile appoint his successor. One of Schörner's cronies should do. The Führer's desk has been overfilled with suggestions, and it would be convenient to get one of the warhawks out of the capital - and the decision making process."
 GGR_raidthevaults_new:0 "Raid The Vaults"
 GGR_raidthevaults_new_desc:0 "The invasion of England is complete, and with it comes the section that follows all of our conquests- looting. England, despite its hardships in recent times, is a very wealthy nation. Its coffers are still full to bursting with gold- the perks of being a world empire for a hundred years. It is time that we requisition this wealth for our own purposes.\n\nThe business of war is quite the expensive one, and another hit of gold into our supply will continue to fund our war machine for quite a while longer. We can only thank God for saving the King long enough for him to hand his wealth over to us. We'll certainly need it."
 GGR_razethecities_new:0 "Raze The Cities"
 GGR_razethecities_new_desc:0 "All cities have rebels, but some have more rebels than others. England in particular is a rebel goldmine, and we will have to take appropriate measures. We took careful note of the English Civil War despite our own troubles, and mapped the main centres of rebel activity. These cities will be treated without mercy.\n\nCoordinated artillery strikes and heavy bombing will force them down, and if they rear their heads once the Heer start pushing in, we will simply withdraw and firebomb them."
 GGR_buytheirarsenals_new:0 "Buy Their Arsenals"
 GGR_buytheirarsenals_new_desc:0 "The English government is permanently cash-strapped, always asking for aid or arms or loans. Rejoining the Pakt to them represents both peace and prosperity - now the rebels have been put down, they see no reason not to turn swords into ploughshares. This represents a prime opportunity to disarm them. We'll rustle up a few million to buy their rifles out from under them, and when we once again set foot in London we'll ask for our money back. They'll be in no position to argue."
 GGR_case_cerdic_new:0 "Fall Cerdic"
 GGR_case_cerdic_new_desc:0 "Our custody of England was doomed to fail while the rest of Britain was outside our grasp. The Scottish allowed rebels to flow both ways through the border, the Welsh sent their coal but did little more than ask for help.\n\nIreland is a whole different kettle of fish - we may have helped them gain Ulster but former Northern Ireland is a den of terrorists and English exiles. We must root them out once and for all."
 GGR_case_cerdic_collabs: "$GGR_case_cerdic_new$"
 GGR_case_cerdic_collabs_desc: "$GGR_case_cerdic_new_desc$"
 GGR_incite_irish_tensions_new:0 "[ROOT.GetGGR_ireland_status]"
 GGR_incite_irish_tensions_new_desc:0 "Ireland was eager enough to jump on the British at the end of the last war, but like all the others they came running for our help when the invasion of Ulster stumbled. Twenty years later and not much has changed - the Ulstermen continue to resist their southern brethren, and the Republic asks for out help.\n\n[ROOT.GetGGR_ireland_status_desc]"
 GGR_invade_ireland_new:0 "Incite Irish Tensions"
 GGR_invite_ireland_new_desc:0 "Ireland has continued its slow drift towards the Reich, and now sits comfortably within the Einheitspakt. The rebels in Ulster still remain a thorn in their side however, one that must be dealt with if the Pakt's dominance in Britain is to be secured. Military police units will be sent to assist our Irish allies."
 GGR_invite_ireland_new:0 "Put down Ulster Unionists"
 GGR_invade_ireland_new_desc:0 "The Republic has proven a poor ally, unable to properly integrate the province they fought so much for. Ulster's pro-British militias will never willingly ally with the Reich, but they could easily be fooled to bring about its goals. False-flag bombings on both sides of the border will set them against one another, ready for us to return and clean up the mess"
 GGR_conquer_the_isles_new:0 "Conquer the Isles"
 GGR_conquer_the_isles_new_desc:0 "England was always the main challenge in Britain. Now that that speed bump has been overcome, we can deal with the scraps. The remaining nations of the Isles would likely band together if we gave them the chance - better we declare war on them all at once, to rob them of the advantage."
 GGR_the_new_cornwall_new:0 "The New Cornwall"
 GGR_the_new_cornwall_new_desc:0 "Now is time to divvy up the spoils. Cornwall was an excellent spot to monitor England and Wales, but what about the rest of the Isles? There is one solution that satisfies both ideology and pragmatism. The Shetland Islands.\n\nDenmark's overseas possessions were cared up by the Allies in the wake of our occupation of the mainland. Iceland and Greenland went to the Americans, but the Shetland Islands remained with Scotland after we broke the British. The Shetlands will prove an excellent air and naval base with which to keep a watchful eye on Britain."
 GGR_the_new_union_new:0 "The New Union"
 GGR_the_new_union_new_desc:0 "The British Isles have been united for the first time since 1921. Not many would have predicted it would occur this way, but not many would have predicted most of the events of this century. The British will have to get used to their new situation, and their new way of living. They should feel privileged - they have it better than most."
 FEN_SL_stealing_our_freedom:0 "Stealing Our Freedom"
 FEN_SL_mobilize_the_militias:0 "Mobilize The Militias"
 FEN_SL_stirlings_men:0 "Stirling's Men"
 FEN_SL_utilize_ofn_bases:0 "Utilize OFN Bases"
 FEN_SL_memories_of_hmmlr:0 "Memories Of HMMLR"
 FEN_SL_remobilize_the_english_air_force:0 "Remobilize the English Air Force"
 FEN_SL_cut_their_suppply:0 "Cut Their Suppply"
 FEN_SL_we_shall_fight_on_the_beaches:0 "\"We Shall Fight on the Beaches\""
 FEN_SL_we_shall_fight_in_the_fields:0 "\"We Shall Fight in the Fields\""
 FEN_SL_and_in_the_streets:0 "\"And in the Streets\""
 FEN_SL_we_shall_never_surrender:0 "\"We Shall Never Surrender\""
 FEN_SL_our_old_base:0 "Our Old Base"
 FEN_SL_repel_their_planes:0 "Repel Their Planes"
 FEN_SL_fighting_on_hills:0 "Fighting on Hills"
 FEN_SL_stall_them_in_the_north:0 "Stall Them in the North"
 FEN_SL_fight_for_our_liberty:0 "Fight for Our Liberty"
 FEN_SL_there_will_always_be_an_england:0 "There Will Always Be An England"
 FEN_SL_stealing_our_freedom_desc:0 "In 1943 the old United Kingdom was murdered. Cruelly slain for standing up for what was right and just, and it was the German Reich which committed the deed. They took our families, our wealth, our freedom, and now we have received word that they intend to do so once again.\n\nThat fat bastard in Germania Hermann Göring? He intends to do unto England the atrocities for which the word German has become synonymous. He intends not only to destroy our nation but our people too. Yet what are we if not Englishmen? Are we to go meekly into the night? Sobbing like children at the approaching nightmare? No. Our old foe knocks at the door, and behind it we wait with gun in hand, for what else is there to do?"
 FEN_SL_mobilize_the_militias_desc:0 "Even the most ardent opponents of the modern SLP have to admit that their predecessor the Left Resistance fielded the single greatest number of civilian militias of any side in the Civil War. These were vital to our victory, but Bill Alexander supported most of them disarming to keep the post war peace intact. We shall rectify this mistake.\n\nSend out the summons by radio and by car. To each town and factory from London to Carlisle we will call these men back to arms. These militias won't have the best weaponry, but what they lack in modern equipment they make up with the indomitable spirit of the working class. Once more unto the breach we go, turn ploughshares into swords gentlemen and let us remind the Germans that the spirit of 1953 is alive and well."
 FEN_SL_stirlings_men_desc:0 "David Stirling led the only rebel force to fight from the fall until the liberation without interruption. In the course of doing so he created several volunteer units which were demobilised following the end of the Civil War, men that we must now bring back into service for what could be the final battle of English civilisation.\n\nThey have their own arms, but we must find the best positions for these volunteer SAS regiments amidst our own lines so as to best utilize their particular skills. Anywhere that guerrilla warfare is necessary would be well served by even a few of these men, for their loyalty to England in unquestionable, and their spirit indomitable. Who dares wins."
 FEN_SL_utilize_ofn_bases_desc:0 "It will take time for the Americans to organise a proper response to the actions of Hermann Göring, time we cannot afford. Yet the American commanders of those units stationed on English soil are amenable to recognising a temporary state of affairs in which we assume command of their forces for the duration of this crisis.\n\nAmerican troops are some of the finest in the world, and their advanced technology will come in exceptionally valuable against the more numerous Luftwaffe and Kriegsmarine. This battle will be the final test of the English spirit against Germannic barbarism, we will need all the help we can get in this fight. We ask the American government for its permission later."
 FEN_SL_memories_of_hmmlr_desc:0 "HMMLR was always a well organised force, but what truly impressed the outside world was its ability to unite the disparate groups of communists, monarchists and everything in between under a single banner. Where the Republican Spaniards, WRRF and even China have failed we succeeded, and now we will need to bring that spirit back to life once last time.\n\nMostly we can use the memories of the Civil War to organise the same partisan groups who put aside their differences back then. Göring's men have plenty of experience cracking down on starving Russian peasants, let us see how they fare when put up against men who have more than 1920's era rifles to bring to bare."
 FEN_SL_remobilize_the_english_air_force_desc:0 "The Battle of Britain was our finest moment for good reason, and we put up enough of a showing to delay invasion by almost two years. Yet that battle and the numerous restrictions imposed upon England by the Germans and their traitor allies left us with a number of planes, but a paucity of pilots.\n\nThis time when we fight Göring's Luftwaffe we will again need to take to the skies against that overwhelming horde, and we will need every pilot we have to win. We will mobilise the civilian pilots, American \"volunteers\", even what few of our old retired veterans still live. The knights of the sky shall slay the German beast, Goerinbg's men will choke on their own confidence."
 FEN_SL_cut_their_suppply_desc:0 "Battleships and carriers did not help us overmuch in the last war. Such expensive ships would be too few in number to make a difference at this point anyhow, even if half of them weren't at the bottom of the Atlantic or in former colonies across the seas. Instead let us turn the German's own tactics against them this once.\n\nSubmarines won't do much against the Kriegsmarine proper, but then those vessels aren't the ones we shall target. Troopships, supply vessels, anything that might enable the Germans to continue the fight in England without support. Our navy will sink them one and all, let the Führer see his vaunted navy establish superiority in the surface waters. We will rule the deep and send his men there soon enough."
 FEN_SL_we_shall_fight_on_the_beaches_desc:0 "The Dover beachhead was the beginning of the end for us in the last war, and our strategy will have to reflect the reality that if we allow the Reich to gain a permanent foothold our end becomes a much more serious possibility. But is it even a war for England if she is not faced with utterly outrageous odds?\n\nWe are a nation bowed but unbroken. We threw the Germans off our isle once and we shall do it a thousand times over if that's what it takes. Failure is not an option, cowardice is not an option. Communist and capitalist, monarchist and republican, men and women all. We will fight together, we will die together, and the Germans will be driven back into the foul abyss from whence they came!"
 FEN_SL_we_shall_fight_in_the_fields_desc:0 "When they take the beaches we will meet them in the countryside. The roads will be mined, bunkers and fortifications established at key points. The Home Guard will have their orders, to hold as long as they can in time for proper forces to dispatch German offences. Every hillock, paddock and pen will be denuded of any resources the Reich might use to further their conquest. Every mine will be collapsed, every farm burned, every shelter denied to our enemy.\n\nFor this is a sacred war, a war of the righteous against the forces of darkness, of civilisation against depravity and a struggle in which we must emerge victorious not only for ourselves but for our families. Steady, men of England. We are not gone just yet."
 FEN_SL_and_in_the_streets_desc:0 "We have some experience in turning our homes into fortresses, Carlisle held for almost a week, and what parts of London were entered before the surrender cost the Reich thousands of men. Now we face the same challenge, but unlike the weak men of the first war we will never surrender meekly at the first sign of loss.\n\nBoard up the windows. Establish defensive networks along the canals and streets. Booby traps must be prepared and covert weapons stashes reestablished. Every house must be a deathtrap, every street a fight unyielding and every Englishman must be ready to do their duty. This will destroy our history, as buildings are turned to rubble and our monuments rent asunder. The past might die, but the present will live. England will prevail."
 FEN_SL_we_shall_never_surrender_desc:0 "Göring will show us no mercy. No more than Hitler did to the Russians and other peoples of Eastern Europe. Those not killed outright will be enslaved and made to create the homes for German colonists, our culture will be burnt to make room for that of the Reich, and in two hundred years the term England will be a geographical curiosity.\n\nThat is the fate which awaits us should we surrender, and it is why we will fight until the end this time. We will die together, our motley alliance of left and right. Every bullet must be spent, every German killed is just another victory. So long as even one man in England bares arms the Germans will never win. Winston Churchill was a man whose legacy was always uncertain, but he never surrendered. Neither shall we."
 FEN_SL_our_old_base_desc:0 "It is with great regret that our government has come to the conclusion that defending the entirety of England is simply not going to be a doable objective in this war with Göring's Reich. To this end, it falls upon the government to have a designated fall back area should the worst occur and significant German forces land in English territory.\n\nThe English North, stretching from Lancaster to Carlisle and Newcastle has always been the area of England most friendly to partisan forces, with HMMLR once basing itself primarily out of the region and its forming the core of our territory in the Civil War. Now that we face another, more dangerous war it might be that we can make use of the North once again. If we prepare defences, we can wait out the German tide."
 FEN_SL_repel_their_planes_desc:0 "The Luftwaffe has always been the primary focus of Hermann Göring, something we felt when it sought to level England to the ground over the course of WW2. Hence, any stratagem we employ must have some method of removing or at least relieving the pressure it will put on our forces.\n\nFortuitously, one thing we have in great supply is anti aircraft devices, both older style flak weapons for dealing with paratroopers and more modern American pieces for eliminating the threat of jet aircraft. Most of these will naturally be placed in the North where they can aid in our rebdout, and perhaps even ensure its survival. In the last war the Reich thought itself untouchable, let us see if that continues when we eliminate their airforce and kill all the pilots who bail out in time."
 FEN_SL_fighting_on_hills_desc:0 "England is not an especially hilly nation, with no great chains of mountains outside the Welsh border and few natural positions upon which a defence could be centred. Except that is, for the North. The North York Moors, the Pennines, the Lake District, all areas of rough terrain upon which we can base our defensive positions.\n\nThe Reich has little experience of fighting in the hills and valleys, their wars mostly being centred on the European plains and we might be capable of turning that to our advantage, should we take the effort to do so. Critically, we will have to ensure that there is an ample supply of weaponry and ammunition in case we lose the major factories, and perhaps leave some buried surprises for jerry as well?"
 FEN_SL_stall_them_in_the_north_desc:0 "The Manchester to Hull line, known more formally as the New Redoubt, is the plan by which if holding the south of our nation becomes untenable due to the number of German troops landed or sufficient casualties are inflicted in repelling them such that we lack adequate troops to defend the rest of the nation, we will withdraw all but a token force to defensive positions centred on and between the cities of Manchester and Hull.\n\nThe region is well fortified by both natural and artificial means, and the country is difficult for the Germans to use their armour superiority to full effectiveness. Any assault of the region should be capable of being repelled unless there is a great disparity in troop numbers. God save those outside our protection."
 FEN_SL_fight_for_our_liberty_desc:0 "The battle is nigh, the Reich assaults our island and now it is all or nothing. Gentlemen and ladies, it falls to use to win this war not just for ourselves but for the entirety of the Free World. It falls to us to avenge the horrors inflicted in Russia, Africa and France. We will make our stand and we will show that obese tyrant in Germania why it is that the sun never set on the British Empire.\n\nCome one and all, we fight not merely for ourselves but with the strength of an entire world at our backs. There is no surrender to be offered or accepted. There is no deal we will take or bargain we shall make. For liberty we fight, for justice we fight. We fight for the murdered and the oppressed, and for those uncounted millions who births never were. England will not merely be the defeat of Germany, we shall be its tomb."
 FEN_SL_there_will_always_be_an_england_desc:0 "Sometimes through great effort and struggle even the impossible can be accomplished. What else can one call a single small island rent by war and ruin fighting and defeating the old tyrant of Europe? Putting aside politics and prejudice we united against the great evil of fascism and united we struck it down to the cold seas of the Channel.\n\nTheir bodies choke our bays and our beaches, their ruined ships cover the floors of our oceans. Their ruined planes rot in our fields. Hear this o tyrants far, for should you fight against Englishmen with nought but oppression at your back you too shall meet the just fate wrought onto Germany at our hand. For there will always be an England, and forever shall it be free."
 ENG_sealion.1.t:0 "A Nightmare Realized"
 ENG_sealion.1.desc:0 "Shortly after midnight, alarms sounded amongst the RAF bases in Southern England, ordering a scramble of aircraft. A large number of German aircraft were coming over the North Sea, and they obviously meant to attack England. Once again, the aircraft of the tiny and outnumbered RAF took off to challenge this foe.\n\nOn the North Sea, a destroyer patrol noticed a submarine on its radar. Having been given the notice that they were potentially at war with the German Reich, they followed standard procedure, and dropped a sonar buoy to better pinpoint it. Then, more contacts showed up on the sonar. And they noticed that one had fired a torpedo. Once again, the undersized and outdated Royal Navy was called upon to respond to this threat.\n\nAcross England, the army was called into action. They lined the coast, manning defensive fortifications, setting up machine gun nests, and laying barbed wire across the beaches. They knew the Germans would attempt to make a landing soon. And they knew there wouldn't be much that the other branches could do to prevent this. Once again, an understrength and inexperienced force would meet the mechanized and mighty German army once again.\n\nEngland would fight valiantly. Everything they had would be put against the threat. But nobody was under any illusions as to how hard this conflict would be."
 ENG_sealion.1.a:0 "Once again, an isle alone."
 ENG_sealion.2.t:0 "The Half-Betrayal"
 ENG_sealion.2.desc:0 "\"What do you mean you're not going to help?\" asked Colonel Chester Day, the English Army attaché to Washington.\n\n\"Exactly what I said,\" General William Westmoreland, US Army, said as he stormed through the Pentagon, Colonel Day following in tow. \"You know as well as I do that if we have an armed confrontation with Germany, it's going to mean the end of all life on Earth. And nobody in the whole United States wants to die for a bunch of former collabs such as you.\"\n\n\"So, that's it then?\" Colonel Day asked as they entered Westmoreland's office. \"You are just going to leave us to die?\"\n\n\"Not really,\" said Westmoreland as he started turning the dial on his safe. \"You send us a list of what you need in equipment, and we'll send it over. That's the best we can do for you, though. Oh, and shut the door.\"\n\nColonel Day did so, then asked, exasperated, \"so I just have an expense list? What the fuck do I tell London?\"\n\n\"You tell them,\" said Westmoreland as he opened the safe, \"to read this.\" He passed Day a folder from the safe. \"It's a report on the German Economy. To put it bluntly, it's a shitshow. They cannot be on a wartime footing for any extended length of time. If you stay fighting long enough, they are going to have a massive collapse.\"\n\nDay read through the folder. \"And the CIA is sure of this?\"\n\n\"CIA, DoD, RAND Corporation, there's a ton of people putting their careers on the line on what's in this report. If you're still fighting in three months, Göring is going to shit his pants and there's not a damn thing anyone can do about it.\""
 ENG_sealion.2.a:0 "We don't need to win, only delay long enough..."
 ENG_sealion.3.t:0 "Modern Lend-Lease"
 ENG_sealion.3.desc:0 "Field Marshal Montgomery,\n\nPer request, I have discussed your needs with the President and the rest of the Joint Chiefs, and have contacted several associates in the Department of Defense to see if they may be able to help. I can tell you this has provided some extremely satisfactory results, which I will go over in detail in this letter.\n\nThe Military Aircraft Storage and Disposition Center in Tuscon, Arizona has provided a number of surplus jet aircraft, totalling 200 in number, that can be used for immediate combat action. These aircraft are of extremely good quality, and will be suitable for your defensive needs.\n\nAs for your naval request, I have very good news. The United States Navy has currently been testing, but has not accepted, ten new non-ballistic missile submarines. Owing to the tense political situation surrounding the builder's bankruptcy and union disputes, the President has decided it best to allow these submarines to be used by the Royal Navy instead.\n\nAll equipment and ships mentioned above will be sent to Iceland immediately. Once there, you will be allowed to take ownership of the items and place them at your disposal. You will be allowed a small auxiliary force from the OFN to familiarize your forces with the equipment, but all pilots and seamen in combat roles must be provided by your government.\n\nUse them well,\n\nGeneral William Westmoreland"
 ENG_sealion.3.a:0 "Oh, we will!"
 ENG_sealion.4.t:0 "The Greatest News"
 ENG_sealion.4.desc:0 "A wave reaches the shore. The body of a German soldier is pushed inland. The waves cross the sand with increasing length. And the German is pushed further and further ashore. Yet, the tide then comes out. The beach is still there, and the German is half-buried in it. And as the tide recedes, the carnage of wrecked Panzers, beached landing craft, and bodies torn by machine gun fire is plain for the world to see.\n\nTrue to the American predictions, the German economy has collapsed, and has brought Göring down with it. Germania is in absolute chaos, and so is most of the continent, for that matter. The Germans lucky enough to have made it off the beach have either surrendered, retreated home, or have been utterly annihilated. Sealion II is an objective failure by any means, and the consequences have been devastating for the Hun who flew too close to the sun.\n\nEngland is not unscathed, however. Bombing has ravaged her cities. Shelling and fighting have left ruins and shell-holes that dot the countryside. The consequences of this destruction are immediately obvious. The economic devastation will be felt for years to come.\n\nBut the buildings would be rebuilt. The shell holes would be plowed over. The pulse of life, growing stronger and stronger, would beat again in the empty streets and pour across the vacant squares. And England would rise again, stronger than before, and without any chains to bind her to the will of the Pakt. For with these three disastrous and tense months, England had purchased the right to be a nation worthy of a great power's respect once again."
 ENG_sealion.4.a:0 "Protected by a woman with the heart and stomach of a king."
 ENG_sealion.4.b:0 "Macmillan promised \"never again,\" and his word was good."
 ENG_sealion.4.c:0 "Maudling had proven himself in the toughest task."
 ENG_sealion.10.t:0 "One Hellish Report"
 ENG_sealion.10.desc:0 "The CIA's London station chief was able to enter Century House with no problems whatsoever from the security. It's when he proceeded up the elevator and strode in demanding to see the MI6 head that there were issues. The secretary tried to explain that the chief was in the middle of an important meeting. The CIA man didn't care, walking in, shutting the door behind him, and said to the MI6 head and the East Asia Section Chief \"you need to see this. Right now.\"\n\n\"Alright,\" said the MI6 chief. \"What's so important that you have to barge in on me?\"\n\n\"This dispatch from Washington,\" said the CIA man as he pulled out a dossier from his briefcase, tossing it on the desk. The chief looked it over before opening it up. What he read shocked him to the core.\n\n\"My God...\" he said in disbelief. \"And they're even calling it 'Seelöwe II'? How daft do you have to be to name it Sealion again?\"\n\n\"Göring isn't subtle,\" the CIA man said. \"He's fucking coming, but we got word about it. What you have here is the report we gave to the President, minus a few inconsequential bits to protect our sources.\"\n\nThe MI6 head looked it over before grabbing the phone, sighing, and began dialing Number 10 Downing Street. When they picked up, he said \"there's something you need to see, Prime Minister. It's urgent.\""
 ENG_sealion.10.a:0 "Half an hour later, the cabinet met."
 ENG_sealion.101.t:0 "Once More Into the Fray"
 ENG_sealion.101.desc:0 "The second a large number of unidentified radar contacts appeared on the screens of England's air defense network, well-rehearsed plans went into immediate action. All flights in and out of the country were halted with immediate effect. Any plane headed to the country was turned around and redirected to Scotland, while all departures were canceled as well. There would be free skies for England's air force, and clear runways for the fighters to take off to meet the threat.\n\nAll oceangoing operations on the East side of the isle had been halted long ago. Ships were kept in harbor or close to the coast, and any new ship was ordered to approach from the west of the country. So when a number of vessels were sighted, the English navy knew these were not any errant civilians, but enemy warships. Thus, the vessels could storm ahead to challenge the intruders.\n\nAnd when the alarm went out, the same militias and guard units that had answered the call just a short time ago once again mobilized. They took their weapons, manned their same positions, and prepared to face the inevitable once again. This time, the enemy would come, he would land, and that was inevitable. But he would be challenged at every step, be it on the sand of the beach, on the fields of England, the paved streets of her towns and cities, or on the wooded undergrowth of her forests.\n\nEngland once again prepared to face an enormous threat. Everyone knew what failure would mean, they had experienced it. They had vowed never again, and now they were determined to ensure that reality. They had defied the odds once, and they would once again."
 ENG_sealion.101.a:0 "For the fourth time this blood-soaked century."
 ENG_sealion.102.t:0 "A Stab in the Back"
 ENG_sealion.102.desc:0 "\"That's the assessment,\" said General Charles H. Bonesteel III of the US Army as he passed the folder to General Orde Wingate. \"The RAND corporation has been up all night trying to get this out. The President has read it just this morning, and cleared it for release to England.\"\n\nWingate started reading the files inside. Lots of numbers and charts, most of which dealt with German economic activity. GDP growth, foreign currency reserves, interest rates, aircraft production, there were a lot of figures that he didn't understand, nor see the relevance of. That is, until he looked more closely...\n\n\"I see,\" said Wingate. \"Göring is headed for an economic crash. If he doesn't get access to some more hard currency reserves, and soon, he'll be unable to afford something like Sealion.\"\n\n\"Correct,\" said Bonesteel, \"and that's why the CIA says you will win by running out the clock if you hold out for three months.\"\n\n\"You mentioned some more good news, General?\"\n\nBonesteel said \"the United States is giving you a blank check on this. Any equipment that you need, we will send over from our stockpiles. We are going to support you every step of the way, and the OFN is backing you up on this.\"\n\n\"Splendid! When can we receive the first US divisions?\"\n\nBonesteel's face went blank. Wingate's heart sank as he knew what it meant. \"Don't tell me...\"\n\n\"I'm sure you're well aware,\" said Bonesteel, meekly, \"of the possible consequences of a US and German confrontation...\""
 ENG_sealion.102.a:0 "Bastards!"
 ENG_sealion.103.t:0 "Britons Shall Never be Slaves"
 ENG_sealion.103.desc:0 "The Duke of Wellington had once said Napoleon's Army was like a fine leather saddle: it was nice to look at, but when something went wrong, nothing could be done to repair it. The British Army, on the other hand, was like a saddle made of rope: not as nice to observe, but when something broke, you tied a rope and got on with the job. And in a modern Waterloo, where the English faced against another Napoleon, the comparison proved apt once again. The English had suffered many troubles and misfortunes, but they were always able to tie a knot. And when the Germans suffered the foretold setback, they found themselves completely out of luck.\n\nAt an instant, the authority from Germania ceased, and the attackers flew into a panic. With nobody in charge, the invaders either gave up the fight or were wiped out. The economic disaster that befell the Third Reich had taken the place of Blücher's Prussians, and their timely arrival ensured another English vanquishing of a threat to the world.\n\nThe cost had been tremendous. Cities and towns had been burned. Fields had been trampled over. Many young Englishmen had lost their lives in the struggle for English freedom. And the civilian death toll was tremendous. The effects of this war would be felt on the English economy for the longest time. And some of the deepest scars of the past three months would never heal.\n\nBut England had survived. Once again, the people of England had rallied to her defense. They had stood up to the greatest power on earth. And when they had been written off, they had stood up once more and emerged victorious. The path to world domination had been shut by her people once again, and the tyrant behind it had been doomed to an immediate and crushing failure."
 ENG_sealion.103.a:0 "Once again, a Jellicoe stood in the gap and saved England."
 ENG_sealion.103.b:0 "And Wilson had kept the flag flying throughout it all."
 ENG_sealion.110.t:0 "One Expected Report"
 ENG_sealion.110.desc:0 "\"It's called 'Seelöwe II,' that's 'Sea Lion Two' in English,\" said the man from the CIA. \"Our agents have discovered it this past week, and the President made the decision to inform you all immediately.\n\n\"I'm sure it's no surprise to you that the Germans have been sore about your victory, and you have been expecting some sort of retaliation after the Germans had organized themselves. The CIA, as you know, had some doubts about that, feeling the Germans would concentrate on their internal political situation and not take vengeful and cost-intensive actions for the purpose of prestige. Unfortunately, that assumption was based on the mistaken belief the Germans were rational people.\n\n\"Our sources indicate aeroplanes and landing craft are already being assembled in Northern Germany. Fallschirmjäger units are preparing for operations, and regular Wehrmacht forces are undergoing naval training. They are going to launch an attack on this country, and it is only now a matter of when and where, not if.\"\n\nThe English cabinet processed this information. Then, they all turned to the Prime Minister, who was lost in thought.\n\nFinally, after a long moment, he said \"alright then. Let's get on with it.\""
 ENG_sealion.110.a:0 "Now we fight to hold what we regained."
 goering.sealion.hmmlr.1.t:0 "Find A Way to Cross the Channel"
 goering.sealion.hmmlr.1.desc:0 "Across the English Channel lurks the new independent state, which has betrayed our trust and broken away from the Einheitspakt. Its people spit upon our flag while inviting exiles from Canada to return and preach their treason. They have failed to estimate the swift recovery of the German war machine, and this will cost them dearly. The time has come to launch a second invasion of England, as we did over two decades ago. The howling winds and ferocious waves did not stop us then, and they won't stop us now.\n\nWe can approach this invasion in two seperate ways. If we plan to place all of our resources into an overwhelming naval invasion, we must also consider how to break through England's naval defenses and eliminate their land forces upon arrival. While many generals support this plan, others have condemned it as a waste of lives and resources. Instead, they propose espionage and spycraft to topple the ruling English government; by doing so, we can defeat our foes while wasting very little resources. The success of such an act would, of course, be completely up to the competency of the intelligence departments."
 goering.sealion.hmmlr.1.a:0 "Our capable agents will shoulder this responsibility."
 goering.sealion.hmmlr.1.b:0 "Enough of the nonsense. A naval invasion is the path to victory."
 goering.sealion.hmmlr.2.t:0 "Recognize Our Friends"
 goering.sealion.hmmlr.2.desc:0 "Our preparations for the invasion of England have almost reached their fruition, and the time has come to make contact with local dissidents to weaken the new English regime. This is not as easy as it sounds. We must determine who our newfound allies shall be.\n\nMany Germanophiles and National Socialists within England seek our assistance and desire to rule over a puppet state, and are the obvious choice for an alliance. However, many have argued that there is not enough \"far-right\" resistance to provide any modicum of threat to the current English government, and that we must broaden our reach. If we were to embrace those who oppose the current government while also opposing the German Reich, it may bolster the ranks of resistance enough to turn the tide. They would, however, be a potential threat in the future."
 goering.sealion.hmmlr.2.a:0 "Only our old and loyal friends can be trusted."
 goering.sealion.hmmlr.2.b:0 "All rebels will be absorbed into the resistance."
 goering.sealion.hmmlr.3.t:0 "Bargain with the English"
 goering.sealion.hmmlr.3.desc:0 "In recent days our agents have successfully made contact with the resistance holdouts in England. Hoping to gain our help in overthrowing the new English regime, they have reciprocated our offers of aid. The largest cell in particular has sent us this message:\n\n\"To our German allies and friends: as you already know, we are more than appreciative of the Reich's support, and we await the glorious future in which England returns to the Einheitspakt. As soon as the traitors in London are overthrown, we will follow your cause. However, we are hindered by many problems. Our strength is lacking, and we need more manpower and equipment if we are to succeed. We have no doubt the Reich is capable of bolstering our power.\"\n\nThis message has caused fierce debate among the General Staff and Cabinet. Several of our officers claim that HMMLR's victory has proven the untrustworthy nature of the Anglo, while Artur Axmann and the Reichsminister for Foreign Affairs have argued that the rebels have proven their loyalty to the Reich for over two decades by supporting Collaboration."
 goering.sealion.hmmlr.3.a:0 "We will accept the request of our allies."
 goering.sealion.hmmlr.3.b:0 "They will work with what they have."
 goering.sealion.hmmlr.4.t:0 "The English Discovered Everything"
 goering.sealion.hmmlr.4.desc:0 "Ever since he placed his trust in the English rebels, the Führer has been closely following their progress. While some generals have shown defiance against this strategy of subversion and terrorism over full-scale invasion, the Führer had yet to lose his optimism about its success.\n\nHowever, the recent reports from England have broken this optimism. The English Resistance has been completely dismantled by the new regime of England. Some experts have blamed the recent spike in sabotage and attacks attracting the attention of the English military and intelligence departments; as a result, the actions of our agents and these English cells were closely monitored, and their operations thwarted without restraint. Almost every agent we assigned and every resistance leader has been arrested, and our plans have completely collapsed.\n\nThe cabinet still claims that we can continue to topple the English government through subversive methods, while the General Staff continue to push for a naval invasion. The Führer's choice is clear."
 goering.sealion.hmmlr.4.a:0 "Time to draw up a plan of action."
 goering.sealion.hmmlr.5.t:0 "The Monsters Within"
 goering.sealion.hmmlr.5.desc:0 "Our sacred motherland, England, has been liberated from her oppressors for some time now. Still, unrepented and unapologetic collaborators and Germanophiles lurk underground, patiently waiting for a time to strike and return our nation back into the hands of our previous occupiers.\n\nA recent raid on one of these traitor's holdouts has revealed some unsettling documents. The underground resistance has been getting orders and weapons from the Reich! It appears that the Germans are not satisfied to leave us alone in peace; their ultimate goal, from what we've seen, is to reestablish an occupation authority over us once again! Intricate planning is still unknown to us; the few men we did manage to capture were executed by our men, who were fueled with anger when they gathered what little evidence they could find. Unfortunate, as their interrogations could have led to the discovery of vital information.\n\nRegardless, we know the Germans are eyeing Britannia once more. For now, it has been decided by our administration to keep this information known to only a few; the public outrage would be significant, and we have only just reestablished our government, we can not afford the public outcry right now. However, we can not sit idly by as the Germans plot our downfall; we must do something to discourage a German invasion.\n\nWe could double down and go on a country wide manhunt to root out all vestiges of traitorous influence within our nation, although if we proceed with that, the greater civilian population may think of us as no better than the Germans. The alternative would be to invest in our shipbuilding and begin to rebuild the Royal Navy. Although that would be a titanic and costly undertaking, it could be the morale boost our people need to wholeheartedly rally behind our administration, as well as giving the Kriegsmarine something to consider, if the Nazis ever do try to return to our island."
 goering.sealion.hmmlr.5.a:0 "We need to root out the traitors in our nation!"
 goering.sealion.hmmlr.5.b:0 "Rule Britannia! Britannia rules the waves!"
 goering.sealion.hmmlr.6.t:0 "Hunt for the Devils"
 goering.sealion.hmmlr.6.desc:0 "Ever since we restored a free and independent England, German sponsored traitors have been plotting against our administration. Acts of sabotage and murders; nothing more than acts terrorism, have carried out against us, the 'illegimate upstarts' who bled and died for freedom from the German yolk and their Pakt.\n\nThe collaborator's underground partisan movement has finally been squashed. For weeks, we have been montering known members, noting their accomplices and various safehouses scattered throughout the country. There was no hiding for the collaborators when we authorized the Coup de Gràce.\n\nLast night, our security detachments and local police raided over a dozen major safehouses and known gathering places, not counting the many houses that have been searched in connection to the traitors. The operation was an overwhelming success; over a hundred suspects have been detained, with another two dozen killed, prefering to die than to be captured. Other than two wounded on our side, our casualties were nill! Our precision strikes were a complete success, and the few uncaptured German agents are more or less powerless; it is only a matter of time before the scattered remnants are hunted down like the rats they are."
 goering.sealion.hmmlr.6.a:0 "A secure homefront is a secure nation."
 goering.sealion.hmmlr.7.t:0 "Airstrip One"
 goering.sealion.hmmlr.7.desc:0 "The helicopter had been fired on as it drifted lazily over the burned and bombed out London suburbs, low as it was to allow its passenger to survey the totality of the destruction. The shot, Remer noted, had come while they were over a neighborhood in the East End. He made a mental note to have that block liquidated. Even a potshot at a German officer, and a general no less, could not be tolerated. Any sign of weakness, he knew as a scowl formed on his lips, would only embolden the urchins to greater acts of barbarity.\n\nA few hours later, as he sat within one of the last undamaged government buildings, Remer wondered how long the resistance would last this time around. To be sure, the English had been beaten even worse than during the first Sea Lion operation, but now they had dispensed with the need for a civilian puppet. Even the former collaborators would be unwilling to serve their masters now. And what of it? The thought asserted itself in his mind. They had proven themselves as little better than subhumans, unwilling to bend to those who were their superiors in every way.\n\nThe conquest of England had heralded the end of the continental war in the Second World War, the high watermark of German military triumph. At that point it was better for the weary Reich to let England continue existing, as annoying as it often proved. This time though? This time England was just the beginning, and instead of the goal, it was merely a stepping stone to further victory.\n\nEndsieg. The word felt warm and glorious in his mind. England would have its own part to play in that Endsieg, whether it wanted to or not. The British Isles turned into one giant floating base... the thought made Remer smile.\n\nHe was hardly a man for revelries, but the general found himself singing quietly.\n\"Denn wir fahren, denn wir fahren, denn wir fahren gegen Amerika.\""
 goering.sealion.hmmlr.7.a:0 "Oranges and Lemons"
 goering.sealion.1.t:0 "Fates of English Generals in Prison"
 goering.sealion.1.desc:0 "England has fallen once again. Those who raised arms against us fought bravely, but in vain. Many English army men and officers fought to the last, killed on the battlefield or in private by themselves. The rest have been taken into custody by the Heer, awaiting our judgement.\n\nThe easiest and simplest solution is, of course, to execute the surviving officers and generals, and wash our hands of the entire affair. Of course, that would mean exterminating a group of men that, in all honesty, are quite skilled and talented.\n\nA sizable portion of our administration, including men and officers who fought against the British, are petitioning and asking to grant the captured men leniency. Their arguments are that the British were only following orders, and fought honorably. Besides the appeal to ethos, they also argue that a number of these men, if they swear allegiance to us, could be very useful in setting up a new collaboration regime. The final choice, however, is up to the Führer. Their lives are ultimately forfeit, and in his hands."
 goering.sealion.1.a:0 "There is no mercy to those who stand against us."
 goering.sealion.1.b:0 "These officers are no good to us dead; have them swear oaths to us."
 goering.sealion.2.t:0 "A Successful Infiltration"
 goering.sealion.2.desc:0 "We have been awaiting the news with bated breath. At last, the reports are flooding in. The infiltration of Scotland has heralded an astounding success! With tireless diligence and masterful finesse, our agents have successfully carried out their secret operations, thrusting Scotland into a weaker position than ever before.\n\nCivil disobedience has been triggered by the destruction of key targets, and all manner of chaos has erupted throughout the nation following the mass assassinations of Scottish politicians. While many are blaming the German Reich, more radical factions are pointing their accusations elsewhere in the world, from the Irish to the Japanese. A few have even looked inwards, turning their blame towards fellow Scotsmen for political purposes.\n\nThe celebration comes later. Case Cerdic rolls on, and we are one step closer to the eventual invasion of Scotland."
 goering.sealion.2.a:0 "An expected outcome."
 goering.sealion.3.t:0 "A Mediocre Infiltration"
 goering.sealion.3.desc:0 "We have been awaiting the news with bated breath. At last, the reports are flooding in. The infiltration of Scotland was somewhat of a success, although not everything went to plan. With attempted diligence, our agents have unfortunately failed to successfully assassinate any of our political targets.\n\nHowever, the attempted assassination attempts has unleashed chaos throughout the nation. While many are blaming the German Reich, more radical factions others are pointing their accusations elsewhere in the world, from the Irish to the Japanese. A few have even looked inwards, turning their blame towards fellow Scotsmen for political purposes.\n\nOur infiltration attempt has demoralized Scotland. Case Cerdic rolls on, and we are one step closer to the eventual invasion of Scotland."
 goering.sealion.3.a:0 "An acceptable outcome."
 goering.sealion.4.t:0 "A Failed Infiltration"
 goering.sealion.4.desc:0 "We have been awaiting the news with bated breath. At last, the reports are flooding in. The infiltration of Scotland has unfortunately failed. With masterful incompetence, our agents have been quickly discovered and captured by the Scottish authorities.\n\nThe failed assassination attempts have only riled the Scots up, and our reports suggest that their morale has spiked. While many are blaming the German Reich for this infiltration, more radical factions are suggesting it was merely a false flag planted by other world forces, from the Irish to the Japanese. A few have even looked inwards, turning their blame towards fellow Scotsmen for political purposes.\n\nNonetheless, our target remains unshaken by our actions. Case Cerdic rolls on, and we must continue planning for the eventual invasion of Scotland."
 goering.sealion.4.a:0 "A disappointing outcome."
 goering.1152.t:0 "Franz Halder Shot!"
 goering.1152.desc:0 "A shocking report from Das Militärverwaltung Großbritannien has reached the Führer's desk this morning! It seems that, under the cover of darkness, an assassin breached the mansion of Reichskommissar Franz Halder, former Chief of Staff for the OKH, and murdered him in cold blood. This latest shock has sent ripples through the already on-edge Reich and is sure to only further inflame tensions between the Führer and OKW Chief Ferdinand Schörner, a known rival of General Halder. The thought of this being a case of military fratricide is a terrifying one indeed, but it will be noted that the assassin's entrance into the Reichskommissar's mansion would seem most unlikely unless he had help from the inside. The assassin's identity has not been disclosed by the Orpo at the moment, but sources say he was a colonel in the Wehrmacht. Hopefully this brewing catastrophe will be nipped in the bud soon before something irrevocably terrible occurs."
 goering.1152.a:0 "\"Get me Ebhard Kinzel on the line at once!\""
 goering.sealion.collabs.1.t:0 "Negotiation with the Infamous "
 goering.sealion.collabs.1.desc:0 "\"So, you have come. Good, the Reich will not forget you and your loyalty\", says the German delegates. They were sent by the Reich to contact the last remaining members of the National Front.\n\n\"And we're deeply appreciated by the kindness you brings\", says an old man with a haggard face, stressed over his operations in the past few days.\n\n\"So, what may I do for you?\", the old man continues, in a worrying but still expecting voice, \"You know, we're having a bad time in recent days. In fact, we're eager to see the return of your people, but sadly, as allies of Germany, we've lost all our influence in England, and most people wish to shoot bullets directly into our skulls. I'm afraid there is not too much we can do for the Reich.\"\n\n\"Don't worry, my friend\", the German smiles. \"As you may have known, the Reich is about to return to England in a few weeks. For now, you and your people are the only ones we can trust in England. You may think there's nothing you can do, but I can assure you, the Führer does have his use for you. All you need to do is keep close contacts with us and follow our commands, and I'm sure you will earn everything back eventually.\"\n\n\"For the Anglo-German friendship!\" While most English people are in their sweet dreams, the first dark cloud since the fall of the collaborated government rises from this small church. And soon, it will consume their whole beloved motherland."
 goering.sealion.collabs.1.a:0 "We shall not forget our old pals!"
 goering.sealion.collabs.2.t:0 "Orders from the Reich"
 goering.sealion.collabs.2.desc:0 "\"Well... I mean no offence sir\", says the minister when receiving the order from his German master in the call, \"you just said the Führer is going to visit our civilian factories in Manchester and asked me to prepare for it, but I heard that my colleague was told that the Führer is about to attend the football match between our two nations in Birmingham at almost the same date. So, are you sure...\"\n\n\"Oh, yes, the Führer was about to watch the match before, but I don't trust your colleague who is responsible for it.\", replies our ambassador, \"but I think you're the most loyal and capable minister in England, so I persuade him to change his plan. I'm sure you are the only one in your government who should get the chance to impress the Führer and I have great confidence in you. So, just prepare it and I can assure you you will be promoted when this is done. Good luck, minister!\"\n\n\"Great, now I finally understands\", the minister says excitedly. \"Thanks for the chance you give to me. I promise I won't fail you, I promise!\"\n\nPutting the phone down, the ambassador gives a yawn. In recent days, he has contacted many ministers for the almost same reasons, and all of they reacted the same. In fact, everyone in their pitiful government, or maybe their pitiful nation is the same: eager to please their master, eager to leg up on the other, and too afraid to question their German masters' orders. Only this pitiful will have such a pitiful government.\n\nAnd such a pitiful government will soon cease to exist when we Germans return."
 goering.sealion.collabs.2.a:0 "Yes, do it. Hang your self to please the Führer!"
 goering.sealion.collabs.3.t:0 "An Excessively Generous Order"
 goering.sealion.collabs.3.desc:0 "The Shared market between England and Germany has been for a long time, and while it is the Germans who dominate it and profit between our relationship, sometimes we can also profit from it. And today, we just received a strange order from Germania, which caused arguments in our government.\n\nAccording to this offer, the Germans says they wish to buy up our military equipment since they've suffered high casualties in their recent military campaigns. While it is possible that their own military factories aren't enough since they've fought too much wars in these months, what makes this order strange is, their price is so high that they've never offered before.\n\nIn our government, whether should we accept this order or not has immediately become our most important topic. Most ministers think it means that we've earned trust for the Germans and they're willing to show us more respect, so why shouldn't we accept their kindness? A few however, believes the Germans cannot be so generous and they must be considering something that we'd better interfere with. According to them, we'd better make an excuse to reject them to protect ourselves."
 goering.sealion.collabs.3.a:0 "Why should we reject such an act of generous?"
 goering.sealion.collabs.3.b:0 "It's too suspicious to be trusted."
 goering.sealion.collabs.4.t:0 "A Familiar Face in the Crowd"
 goering.sealion.collabs.4.desc:0 "\"And what did dieing get us? What did our blood, sweat, tears, and loyalty buy us?\"\n\n\"Nothing!\" the crowd yelled back.\n\nThe agent stood off to the side, obscured in the shadows of the nearby ally. Over a hundred folks had made time for the small demonstration; an impressive and brave crowd, really. Foolish, but brave.\n\n\"...and you all know what we got in return! Increased taxes! Warrantless arrests! No representation! I say, we need to...\" The speaker turned his eyes, and it seemed as if for a moment, the agent and the speaker locked eyes. Was that...\n\n\"...and we shall remind them inHertfordshire, that we will not allow them to trample our ancient rights into the ground! Thank you for coming!\" The crowd gave a cheer, then quickly dispersed. The speaker himself, that oh so familiar face, blended into the dissipating crowd before disappearing himself.\n\nIt was late now, but in the early hours of the morning, he had finally found the man. Henry Greene, code named Grün. The picture was almost exact, sans the beard, he was sure of it. The agent flipped through his file. English spy turned informer. Based in Sierra Leone, came home after the war... blah blah blah. He flipped through the hefty manila folder. \"MIA, presumed KIA during the war....\" with a red INAKTIV stamped on the back page. The agent sat back. A dead ex-informer, likely someone who came out of hiding, speaking out against the government and not reporting back to M15? What did it mean? Did it mean anything?"
 goering.sealion.collabs.4.a:0 "It must be nothing, right?"
 goering.sealion.collabs.5.t:0 "Decimation or Dishonor?"
 goering.sealion.collabs.5.desc:0 "Göring sighed as the two men continued to argue, his head pounding. He cupped his head in his hands, resting both on his desk.\n\n\"Are you a moron? You can't just kill them all! You think resistance is out of control now?\" Speidel hadn't stopped pacing for the fifteen minutes he had been arguing with Otto Remer. \"We'd never be able to...\"\n\n\"Have you learned nothing?!\" Remer cut Spediel off. \"We let the Anglos off easy once already, and look at what that bought us. Disloyalty, betrayal, an inept...\"\n\n\"You're wrong! You can't line every soldier and civilian that resisted against a wall and shoot them!\"\n\n\"You watch me!\"\n\n\"ENOUGH!\" Göring yelled, raising his head and staring at both men, ending the argument. Göring sat back in chair, rubbing his temples. \"You're both right in one regard, they need to be punished. Most of the prominent government officials and officers will be tried and found guilty.\" Remer and Speidel both glanced at each other. Remer nodded his head; Spediel shrugged his shoulders. Finally, common ground. After a moment of silence, Remer spoke up again.\n\n\"So, that's decided. We still have the rest of the military POWs to discuss. I'm willing to concede and release most of the civilians. Fine, I get it. But we can't take the chances with the soldiers. They need to be rid of, otherwise we'll end up invading the isles again in another twenty years.\"\n\n\"You're out of line, Remer. We can't just kill all of them. This isn't black and white; either decimation or dishonor! We can use them! Conscript them, labor camps...\"\n\n\"And let them live so they can backstab us again in the future.\" Remer finished. Göring gave both men a look; the one that said; this conversation is over."
 goering.sealion.collabs.5.a:0 "\"Speidel is right. Killing these men creates more problems than it solves.\""
 goering.sealion.collabs.5.b:0 "\"Remer's logic is correct. We can't afford set them free.\""
 goering.sealion.collabs.6.t:0 "London's Burning"
 goering.sealion.collabs.6.desc:0 "The Collaborationist cause is a failure. Every attempt at appeasement, at negotiation, at peace has failed. German soldiers marched through London once before in the wake of Operation Sea Lion, now once more the Wehrmacht tears it's way through the streets.\n\nNelson's Column has fallen, hit by an errant shell. The Houses of Parliament have fallen, with blood spilled in the corridors of power. The Clock Tower has fallen, destroyed utterly by a Luftwaffe airstrike - Big Ben gives one sonorous, mournful chime as it crumples against the streets.\n\nLondon is only the first step - soon the Swastika will be the only flag that hangs in England."
 goering.sealion.collabs.6.a:0 "It's happening here."
 goering.sealion.5.t:0 "Göring's Ultimatum"
 goering.sealion.5.desc:0 "Whilst when Hitler was the leader of the German Reich, we enjoyed relative peace and most importatnly, our independence. Unfortunatly, Hitler is gone and in his wake, we have to deal with Göring. While initiallt receptive to us rejoining the Eineitspakt, he has now sent us an ultimatum. Either we willingly accept full integration into the reich, or it will be forced onto us."
 goering.sealion.5.a:0 "Maybe it's for the best."
 goering.sealion.5.b:0 "Ireland for the Irish."
 goering.sealion.6.t:0 "Ireland Accepts"
 goering.sealion.6.desc:0 "Good news from the emerald isle, it seems that the irish have seen that the Reich is truley the greatest thing to happen to them and have willingly accepted integration into the Reich."
 goering.sealion.6.a:0 "You made the right choice"
 goering.sealion.7.t:0 "Betrayal"
 goering.sealion.7.desc:0 "The Irish have refused our generous offer for integration, despite the amount of money and resources we have pumped into them, the have the gall to turn against us and refuse"
 goering.sealion.7.a:0 "You forced this upon yourselves."
 goering.sealion.collabs.7.t: "Easy Work"
 goering.sealion.collabs.7.desc: "While no one could deny the many practical benefits of a good intelligence agency, certain circumstances based around the current economic state of total war had left funding for the Abwehr an afterthought in the favor of more tanks, ships, and planes. Perhaps that was why no one could have predicted what was happening on the British Isles, why it took a direct message from Colin Jordan himself to at last determine what had come of the chaos.\n\n\"The British People's Party ate itself.\" Schörner surmised, unable to contain his grin at the thought of their job becoming even easier than usual. \"They created so much havoc with their petty power struggles that the British Free Corps was able to execute a coup. The current prime minister has sworn a personal oath of loyalty to Hitler and Germania, and I'm sure he'd swear one to you too if you asked nicely.\" Spiedel, it seemed, was equally pleased. It was a rare sight to see him smile, especially these days, but both men could see where this was going.\n\nGöring, for his part, was somewhat more weary. This Jordan fellow was an SS man, or at least he was before the whole thing got reorganized. Normally not a problem, but the man was very open about his more ... Spiritualistic motivations for collaboration, leading him to fear potential influence from Burgundy. And even then, what exactly was to be gained with him on top as opposed to anyone else? Sealion II was going to happen no matter who was in charge; it was arguably the most important part of War Plan A. That being the case, what did this Jordan fellow give them? No matter his ideology, he was an Englishman first. He would never roll over and let his people get conquered for a second time, collaborator or no.\n\n\"I presume we proceed as planned regardless?\" The Führer inquired, to which Bloody Ferdinand nodded slightly. \"I doubt there's a single division in Britain that's willing to follow that man into battle against us. He killed off everyone who doesn't like us more than they like him. This is going to be the quickest, simplest invasion in human history.\"\n\nIn the face of such complete confidence, who wouldn't feel a little better about the whole thing? Figuring that maybe this wouldn't be so bad after all, Göring gave the order: Within a few minutes, a message had been delivered directly to Colin Jordan's doorstep: A long list of impossible demands that no rational individual would submit to, and a time limit of less than twenty four hours to accept them. By the time he had even finished reading them, German soldiers would already be on the beaches."
 goering.sealion.collabs.7.a: "Back before teatime."
 goering.sealion.collabs.9.t: "Too Easy"
 goering.sealion.collabs.9.desc: "Military matters were handled by soldiers, and domestic matters were handled by civilians. Even in a society as utterly jingoistic as Göring's Germany, where the entire state had long since been consumed by total war, there were still some aspects of that divide which had to be respected. That was why Schörner was very angry at Artur Axmann for daring to enter the Führerbunker, for daring to interrupt their meeting on Day 1 of Sealion II, for daring to think that he had a role in what was to come: Only soldiers were supposed to be in this room, and he had long since quit being a soldier. He was even angrier with his Führer, who he knew was the only reason why he was even allowed inside in the first place. But when the bastard finally opened his mouth to explain the intrusion, he nearly rose from his seat to deliver a beat down then and there.\n\n\"Sealion II needs to be canceled immediately.\" He declared, speaking as a man who clearly had no idea how many resources had been poured into this already, as a man who didn't know how costly it was to cancel even a normal mobilization, let alone a planned naval invasion. He was red-faced and panting, with a look of fear in his eyes that made it clear that delivering that message was some sense of sworn duty for him, even if he knew that there was only one man in the entire room who was willing to listen. \"Explain. Quickly.\" Speidel demanded, having no more patience than Schörner, but recognizing a potential disaster when he saw it.\n\n\"Jordan has accepted all demands presented to him.\" The former Reichsjugendführer declared, forced to be the one to deliver news of an outcome no one even considered. Just as he feared, none of the reactions he saw were positive. Some scoffed, while others were shocked. Some refused to believe it to be true, while some were consumed with anger. Even Göring, the one man who knew why he had come in the first place, stared longingly into the concrete floor, like a guilty child, passing on all the ire that would come from this onto his subordinate.\n\n\"That's impossible.\" Bloody Ferdinand eventually declared, his utter disbelief outweighing his rage, for which Axmann thanked God himself. \"We didn't give him enough time to create a formal response.\" He insisted, not even addressing the fact that the very idea that he would accept at all was ridiculous. Abolition of the monarchy? Complete economic and military integration? Giving up his own power in favor of a Militärbefehlshaber? Absurd. \"It wasn't formal.\" Axmann countered, doing his best to explain before more lives were pointlessly lost. \"He predicted that he'd be receiving this sort of thing sooner or later. He was ready when it did. He's...he's willing to give us everything.\"\n\nEverything. For nothing. Nothing but wasted time and money, yes, but actually invading would have surely wasted even more. Even Schörner's naked bloodlust could see that taking Great Britain without firing a shot was too good to pass up, even if it was an insult to his pride. Underneath his ever-present sunglasses, the Monster's eye twitched, wondering, briefly, what kind of man Colin Jordan really was.\n\nSpiedel, on the other hand, already knew. At the end of the day, his loyalty had always been to Germania instead of London. He was the kind of man who belonged in this room with them."
 goering.sealion.collabs.9.a: "He was a soldier."
 goering.sealion.collabs.10.t: "Collins' Gambit"
 goering.sealion.collabs.10.desc: "\"It was a long shot,\" Spiedel conceded, disappointed but wholly expecting such a response.\n\"And it missed,\" Ferdinand sneered back, clearly finding the whole charade of ultimatum to be nonsense. \"Now that we're done prevaricating I trust Sea Lion II is activated effective immediately?\"\n\nThe Führer contentedly sighed before answering. \"Begin the landings, Fieldmarschalls. Britain must be brought back to heel.\" Even now Britain was among the much better off nations of the world despite their recent struggle, and without a disloyal government there was nothing to stop him carting off all their gold, their artworks, and their industry alike.\n\nAnd so the Kriegsmarine would go out into the Channel and the North Sea, the Luftwaffe would bomb every airstrip into craters and set the cities ablaze, and the glorious Wehrmacht would once again march ashore at Portsmouth, at Brighton, at Bexhill, at Folkestone and Dover and Ramsgate. In fact, why not farther? Rochester, Maldon, even London itself! Göring was so lost in his daydream of victory that he only just noticed the envelope that his fat bejewelled fingers knocked away slightly. Perhaps one of those reports? But the seal was British... Looking back up to see his top men had taken his order as dismissal from the room, he called in an aide to open and present the letter - can't be too careful after all. As Schörner said, it was a rejection, but as the Führer read more so, his gut twisted in more than dietary imbalance.\n\n\"To the magnificent Germanic Führer Hermann Göring,\n\nYour terms are just and understood well by those who truly believe in the Aryan cause and spirit. However, there are those parasites even within the walls of power here who would not only see me hung drawn and quartered for doing what is right but overturning my decision anyway and resisting your rightful rule. I would of course readily die for the Master Race, but to do so for a sacrifice that achieves nothing would surely be most wasteful.\"\n\nGöring snorted. Clearly this 'Spearhead' was too weak to rule in his name, if their leader was so afraid of following Domville. That said it's not like the man didn't understand. He too was surrounded by movers and shakers more powerful - and more bloodthirsty - than he. Was this what his position looked like from the outside? The most powerful man in the world, pulled and tugged on like a marionette!? In a fit he screwed up the letter and failing to find a bin nearby he ended up impotently slamming the wadded-up paper into his opulent wooden desk.\n\nShakily exhaling, Göring heavily slid the letter to an aide. \"Toss it, store it, burn it, I don't care just- Get this damned scribbling out of my sight.\" Naturally the gaunt fellow obeyed, quickly disappearing with it, never to be seen again. Neither of them cared to read the plea for clemency for the 'noble and loyal' Spearhead organisation."
 goering.sealion.collabs.10.a: "They shouldn've have worried."
 goering.sealion.collabs.10.b: "They shouldn't have bothered."
 goering_peace_events.14.t:0 "The Conquest of [ROOT.GGRGetEngland]"
 goering_peace_events.14.desc:0 "Today, when Londoners walk out, they notice that, the old flag over Buckingham Palace was gone, replaced by a familiar flag of the German Reich. Alongside the Thames, spots of rain keep spattering on the pavement, and the only sound can be heard is sound of German patrol's footsteps and the voice from Big Ben. In the streets, broadcast is announcing that the old regime is no more.\n\nThough most people have been familiar with changes of regime in recent decades, the atmosphere in the city is still odd since it is the first time in a thousand years that England is ruled, both in name and in fact, by a power foreign from their homeland. In some remote bars, people gather to drink for everything in their memories, and sing God Save the King together, for the last time in their lives. From now on, the history of England will walk into a new chapter.\n\nWhile the whole of England remains silent in melancholy, the Downing Street, now the headquarter of German occupation forces is now overwhelmed by cheers and laughs of victory. The second Operation of Sea Lion is seen the greatest victory after the German Civil War, and a great proof of the Wehrmacht's power. Now the officers is holding the celebration party to welcome the arrival of their new leader, and the person they're waiting for is..."
 goering_peace_events.14.a:0 "General Franz Halder"
 goering_peace_events.14.b:0 "Schörner's lackey Eberhard Kinzel"
 goering_peace_events.14.c:0 "General Rudolf Wulf"
 GGR_england: "England"
 GGR_britain: "Britain"
 goering_peace_events.15.t:0 "The Conquest of the Isles"
 goering_peace_events.15.desc:0 "If there is anything that we should regret in the Second World War, it should be that we never truly conquered the whole Great Britain due to strategic reasons, which allows small nations like Scotland and Welsh to have their independences for more than 20 years. But now, such a small flaw has been eradicated since the Heer has stormed these two countries during our reconquest of Britain. From the Scottish Highlands to Cardiff, the country used to be known as the United Kingdom is finally united again, but under the rule of the Reich this time.\n\nNew conquests, of course, lead to new problem for us to deal with. No one in this world would be willing to give their hard-won liberty away so easily, and local guerilla and anti-guerilla activities has immediately begun when we stepped on their lands. If we wish to have a peaceful Britain behind us as well as utilize local manpower and natural resources, we must think carefully about how to set up our own administrations.\n\nIn the music played by Scottish bagpipes, the Führer finally makes his decision. Scotland will be ruled by Militärverwaltung Großbritannien alongside England due to their distant geographical position. And as for the Welsh, the Führer decides that..."
 goering_peace_events.15.a:0 "A United MW Großbritannien for the former United Kingdom!"
