 national_socialism_machiavellian_nazism_subtype: "马基雅维利纳粹主义"
 national_socialism_machiavellian_nazism_subtype_desc: "乍看之下，马基雅维利主义鼓吹的绝对实用主义与要求绝对教条化的民族社会主义意识形态似乎无法调和。但话说回来，若真有人能实现这种结合，那恐怕非赫尔曼·戈林莫属。\n\n表面上看，马基雅维利纳粹主义仍遵循传统纳粹的所有信条：国家高度军事化，元首意志至高无上，种族等级制度继续靠枪杆子维持，其他既定规范也分毫未变。但这些举措并非源于对其合理性的真诚信仰，更多是为了维护民族社会主义政权的表象。在其他所有方面，实用主义才是最高准则——每项具体行动都经过精心算计，以确保对人民和国家的绝对政治支配。因此，只要目的正当，某些教条完全可以被打破。\n\n某种程度上，马基雅维利纳粹主义可视为勃艮第体制的反面：当希姆莱要求政府各部门保持绝对狂热时，戈林却从不要求任何真正的意识形态信仰。正如他所说，只要最终能实现雅利安梦想，为之效力的人自己是否相信这个梦想并不重要。于是，原本恪尽职守的纳粹官员逐渐被冷酷无情的窃国者、反社会者和犬儒主义者取代——这些人热衷犯下同样的暴行，却只为权力红利，而非出于真正的荣誉感。\n\n尽管《君主论》写道“令人畏惧胜过受人爱戴，受人爱戴又胜过遭人憎恨”，但马基雅维利纳粹主义认为：只要元首始终被忠诚的德意志人既爱戴又畏惧，他尽可从劣等种族那里汲取无限的仇恨。"
 national_socialism_machiavellian_nazism_goring_subtype: "$national_socialism_machiavellian_nazism_subtype$"
