 WR_SPLASH_TITLE:0 "§W欢迎来到戈林的狂野征途§!"
 WR_SPLASH_CREDITS:0 "§W欢迎来到戈林的狂野征途！这是一个让你心爱的军国派如闪电般归来的submod。请放松心情，§V这将会是一段漫长的旅程§!\n\n特别鸣谢整个mod团队：§G$current_goring_team$§!！\n\n当然，如果没有以下几位，这个submod就无法诞生：§YCurwingHawk_5、Avata§W以及§!Post Josef Goebbels§!！\n\n您真诚的，§RRuSKaz§!，mod开发负责人。§!"
 GGR_epilogue: "就这样，戈林的狂野征途终于戛然而止。铁轨被炸弹与履带撕得粉碎，国防军坦克里最后几滴燃油也已燃尽。列车长赫尔曼·戈林死了。一切都结束了。战争胜利了——如果这种结局也能称之为“胜利”的话。\n\n德国为延续国运将世界洗劫一空，这般赤裸裸的帝国主义行径虽能逞凶一时，可当再无可侵略之国时，战争经济终于彻底崩溃。此刻，“优等民族”比任何时候都清楚他们只能怪罪自己——他们也确实这么做了。\n\n如今，穿着制服的暴君费迪南德·舍尔纳发现自己成了元首。统领他所有部下的，是疯狗中的疯狗奥托·恩斯特·雷莫。权力更迭的讽刺意味，连垂死的舍尔纳本人都心知肚明。他不仅要应对接替自己旧职的雷莫，还得对付早有预见的宿敌汉斯·斯派达尔，以及视他为野蛮篡位者的年轻继承人海因茨·西奥多。在这似曾相识的四方权力角力之下，新旧德意志的裂痕再次浮现——城市与城市、工厂与工厂、家庭与家庭之间，甚至父子兄弟之间，都在元首死后分崩离析。\n\n战争……或许尚未真正终结……"
