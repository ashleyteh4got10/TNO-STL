 national_socialism_deep_ecology_nazism_subtype: "深度生态纳粹主义"
 national_socialism_deep_ecology_nazism_subtype_desc: "白鸽振翅，万物归于本真。自然从无慈悲与包容——它只是如此。自然讲究纪律和节俭，虽然方式特别，却也和平。人类并非单一种族，而是分布于不同地域的多样族群。万物皆起于自身独有之地，没有普遍适用的法则。生态学是研究自然分界的科学，是研究国家和祖国的科学。\n\n深度生态纳粹主义是一种源自工业战争极端化而催生的民族社会主义变体。其最早的信徒目睹了雅利安人在侵略战争中成批倒下。他们看到水银渗入土壤，看到了坦克把士兵碾入泥泞直至血肉与大地交融。战争污染了雅利安人及其生存空间。深度生态纳粹主义勾勒了一幅和平土地的愿景：雅利安人歌唱着绿意盎然的农田和高耸的山脉，那些像石制肋骨般的山脉，提醒着人们和他们祖国的关系。这种主义试图让雅利安人像祖先一样，与土地和谐相处。其追随者庄严承诺，如果必要，将用工业革命的工具捍卫这片土地。\n\n自然应该是没有外来者的状态，雅利安人的土地只属于雅利安人。在雅利安人的土地上没有奴隶制，因为低劣种族早已被自然法则所淘汰。在雅利安人的土地上没有战争，因为雅利安人已经拥有了自己的生存空间，这片土地是他们祖先的遗产。在雅利安人的土地上，有的是和谐和自由。有的是自然和民族的共生。有的是希望和乐观。"
