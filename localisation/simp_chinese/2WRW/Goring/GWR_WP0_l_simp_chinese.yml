l_simp_chinese:
 GGR_garrisons_from_germany_dummy: "驻德部队"
 GGR_garrisons_from_germany_dummy_desc: "我们之所以没有分崩离析，唯一的原因就是当地人的服从。不是同意，而是服从。德国驻军的存在很好地弥补了当地缺乏的真正有效的管理。这种情况耗尽了德国的“人力资源”，而这些人力本可以派往前线。"
 GGR_garrisons_tt: "§F(£TNO_game_rule_flag_GER §Y[GER.GetName]§!) $MODIFIER_CONSCRIPTION_TOTAL_FACTOR$: [?GGR_manpower_eating|R%1]\n$misc_costs_modifier$: [?GGR_money_eating|=R]"
 GGR_garrisons_from_germany: ""
 GGR_garrisons_from_germany_desc: "我们征服的领土之所以没有分裂，唯一的原因是当地居民的服从。不是同意，而是服从，而这种服从又是由于我们的驻军的存在所获得的。这种情况耗尽了我们的“人力资源”，而这些人力资源本可以派往前线。"
 GGR_last_legs: "捉襟见肘"
 GGR_zero_plan:0 "战争计划0"
 GGR_zero_plan_desc:0 "Now that the Führer has ousted the insidious pretenders inside Germany, we may look outwards once more. We promised war to the German people, war to make the Reich powerful and prosperous once more, war to bring us back to the glory days of the forties when the swastika flew over Moscow for the first time and the Bolshevik hordes fled over the Urals with their tails between their legs!\n\nThe military has agreed upon the first War Plan, a strike at the weak nations surrounding Germany, those who once fell to the boots of the Reich, who jumped over one another to serve their true master. Fragile governments, clinging to threads of legitimacy to try and avoid the hammer of true military power. They will make a perfect first target, and the taste of rapid victory will tantalise all those who have ever had doubts in the Führer. The world shall once again know the fire and fury of the Wehrmacht! Let the German war drum beat once more, and let all its enemies quake in fear, for today Germany is strong, and tomorrow Germany shall be triumphant!"
 GGR_plan_zero_complete_tooltip:0 "战争计划0已经完成，我们巩固了自己在欧洲的地位。"
 goering.55.t:0 "收复故土"
 goering.55.d:0 "“国防军最高统帅部总部里，形形色色的人忙作一团。在中央会议室，新生的德国武装力量的所有分支齐聚一堂，只为让这个国家重拾起曾经的辉煌。内战结束后，首要的目标是重新收回离德国最近的土地，这就是大日耳曼国中‘大’的含义：它是荣耀的象征。波西米亚和尼德兰等国是我们重要的工业中心，对我们未来的扩张计划十分重要。\n\n十几位陆军将军和海军上将围坐在一张长长的矩形桌子旁，面向两个穿着高级制服的男人。一位是元首赫尔曼·戈林，在他右手边的是陆军元帅费迪南德·舍尔纳，他俩正专心地看着面前摆放着的地图。但实际上，只有一人能看懂地图上写了什么：赫尔曼·戈林虽然是一个经验丰富的飞行员，但他从没当过将军，也看不懂地图，他更喜欢画画，他觉得这才是画布真正的用途。\n\n‘先生们，’陆军元帅开口说，把众人从沉思中唤醒。\n‘德国仍在世间，但我们的帝国已经分崩离析。要是没有前专员辖区提供给我们的资源和人力，我们的战争机器绝无完全恢复的可能。我们若想重申雅利安人统治世界的权利，就必须现在行动！’元首为元帅简短的演讲鼓掌，最高统帅部的其他人也跟着鼓掌。\n‘你们所有人应该都明白，我们首要的目标应该是这些’，他说着，指向了几个加上高光的国家——丹麦、荷兰、波希米亚、东方领、波兰和斯洛伐克。\n‘这些“国家”与德国的联系最为密切，并且还在叛乱后的混乱中苦苦挣扎，他们中的一些可能会得到拯救，但大多数还是会抵抗我们。如果他们选择抵抗，先生们，我们就会给他们我们想要的。为了大日耳曼国！’他说完了，赢得了众人的喝彩。”"
 goering.55.a:0 "“为了大日耳曼国！”"
 goering.bohemia.1.t:0 "慕尼黑的回忆"
 goering.bohemia.1.d:0 "The massive mahogany doors leading to the Führer's personal office open suddenly, making its owner raise his head from the papers occupying his engraved desk. His hopeful expression, welcoming any diversion from the neverending paperwork, quickly turns into a schooled expression of disinterest - most likely masking a frown - as Ferdinand Schörner enters the room unceremoniously. A perfunctory arm raise, and the feldmarschall is already in front of the desk.\n\n\"Mein Führer!\" he begins with his usual boisterous countenance, \"the time has come to reclaim our rightful lands to the South! The traitors in the Reichsprotektorat have refused to help us in our struggle against the other pretenders, and they must be punished, just like the Czechs in 1938: if you take a look at this map you'll-\"\n\n\"No, Feldmarschall\", Göring's tone is sharp, interrupting Schörner's tirade. As the general, now visibly incensed at being contradicted by his superior, opens his mouth to reply, the Führer closes the discussion: \"Von Krosigk has always been a loyal servant of the Reich. By proclaiming his neutrality he has saved the Bohemian industrial core from being captured by the degenerate SS, don't you agree?\"\n\n\"Yes, but-\"\n\n\"Then, if you understand, there is no need for an invasion. I won't send Aryans to die fighting other Aryans while we can achieve the same result in a civilized manner. I'll personally conduct the talks at Carinhall, and we'll see whether von Krosigk is loyal or not. Now excuse me, but I already have enough of a headache looking at all these damned papers...\"\n\nKnowing that he wouldn't win this one, the Feldmarschall salutes quickly and leaves the Führer's office in silent rage. With a sigh, Hermann Göring returns to his new personal hell: paperwork."
 goering.bohemia.1.a:0 "“又有文件要签了，真令人高兴……”"
 goering.bohemia.2.t:0 "财政部长和国家元帅"
 goering.bohemia.2.d:0 "\"The large salon usually reserved for feasts and banquets in the Führer's personal residence at Carinhall is elegantly furnished as usual, though the mahogany centerpiece capable of hosting more than a hundred people has been removed in favor of a smaller, more \"private\" round table, barely enough for ten. Seating side by side, Hermann Göring and Ludwig von Krosig, Reichsprotektor of Bohemia, enjoy a fine meal prepared by the Führer's personal chef, the ample time between the servings allowing for some reminiscing.\n\n\"How long has it been ever since we had dinner together, Ludwig?\" Göring's voice was almost nostalgic, \"you were still Finanzminister, weren't you?\"\n\n\"It must have been at least ten years, before I became Reichsprotektor\" von Krosigk had the same tinge in his tone, thinking about different times, when political enemies were still that, and didn't try to have you shot for treason, or begin a civil war.\n\n\"Indeed! How much time has passed, my friend... things have been tough, though I'm sure you too had your own enemies to fight in Bohemia... pesky SS, always trying to snivel their way in. You have been extremely competent, just as you have always been, a great resource for our even greater Reich!\"\n\nHis guest nods politely, part sincere and part calculating, as he has learned to be. He knows, however, that reminiscing isn't the only reason for his presence at Carinhall, and he isn't disappointed.\n\n\"This is why, despite Schörner's opinions, I've decided that you'll be appointed gauleiter when Bohemia is reintegrated into the Vaterland\"\n\nOf course. That was the reason for the invitation: von Krosigk has known, ever since the end of the civil war, that the Bohemian industries would be highly coveted by the resurgent Reich. While being spared the occupation is indeed a relief, he knows that it's not a benefit, but rather a policy on his loyalty. Happy or not, he knows he has no choice.\""
 goering.bohemia.2.a:0 "“谢谢您，我的元首。”"
 GGR_annex_bohemia:0 "吞并波西米亚"
 GGR_invade_denmark:0 "毛奇行动"
 GGR_invade_denmark_desc:0 "赫尔穆特·约翰内斯·路德维希·冯·毛奇是德国最伟大的将军之一。在他的指挥下，普鲁士军队踏过了丹麦、奥地利和法国，将它们一个个踩在脚下，帮助建立了德意志第二帝国。1864年的石勒苏益格-荷尔施坦因战争把德国的疆域拓展到了日德兰半岛，而希特勒则将剩余的丹麦置于我们的监管之下。现在该进行收尾工作了。上次我们只用了六小时，所以这次我们应该会更快。"
 GGR_invade_denmark_tooltip:0 "我们会准备夺回丹麦。相关决议已解锁。"
 GGR_march_on_copenhagen:0 "哥本哈根游行"
 GGR_march_on_copenhagen_desc:0 "哥本哈根再次向德国国防军投降，这自然需要庆祝。我们杰出的元首提出要以罗马人的风格取得胜利——不仅是为了他自己和他的将军们，而且是为了纪念每一位踏足丹麦的士兵。"
 GGR_work_towards_integration:0 "实现一体化"
 GGR_work_towards_integration_desc:0 "毫无疑问，丹麦应该尽快并入德国。他们几乎是完美的雅利安人，唯一不同的是他们拥有维京人的血统。他们在波罗的海入海口的位置，对我们控制波罗的海至关重要，如果要让丹麦人对现状满意，我们就得小心翼翼。丹麦将成为德国的半自治区；尽管国防军可能对把丹麦从征服名单上除名感到不满。"
 GGR_work_towards_integration_tt:0 "我们将致力于整合丹麦，这将促进我们国家的稳定，但会惹恼军国派。"
 goering.denmark.1.t:0 "丹麦的烂摊子"
 goering.denmark.1.d:0 "在一个戒备森严的小屋中，马丁森焦急地等待着。每过一秒，他腹中的翻腾便会剧烈一分。戈林终于来了，迟到了五分钟。\n\n“啊，戈林元首！见到你真高兴。”马丁森说着，努力抑制着自己的焦虑。\n\n“我也一样。现在让我们说正事吧。”戈林说。马丁森开始详细描述他对丹麦的复杂计划，这让戈林感到相当无聊。马丁森终于结束了他的演讲，戈林打了个哈欠。\n\n“呃，我的元首？”马丁森汗流浃背。戈林瘫倒在椅子上，突然意识到有人再和他说话。他站了起来。\n\n“哦。我，呃……我有个不一样的想法。”戈林回答说。马丁森只是希望事情不会向他设想的发现发展。“为啥我们不，呃……不直接吞并了丹麦呢？或者我们把它变成一个整合专员辖区。但还是吞了更好。”\n\n“哦，元首，你也明白……”\n\n“对不起，我迟到了，刚刚对付了几个游击队员。”舍尔纳终于现身了。马丁森说服戈林让丹麦独立的梦想破灭了。\n\n“啊，舍尔纳，这位，呃……同志正在向我解释为什么我们不应该吞并丹麦。”马丁森腹中的翻腾迫使他喘了口粗气。\n\n“他妈的啥？你在想啥？你也明白，靠着德国的力量，你肯定能把丹麦的事处理得更好。还是说你想给丹麦施加你的个人影响？你也清楚，靠大日耳曼国来谋求私利是堕落的表现，对吧？”舍尔纳说。马丁森腹中终于不再翻腾。听到这话，马丁森反而产生了解脱的感觉，毫无疑问，他的小心思已经完蛋了。“要不这样，我们吞并丹麦，然后我给你当地国防军部队的指挥权，怎么样？”\n\n“是，当然可以。”马丁森说，这也是他唯一能说的话。\n\n“好。”舍尔纳拍了拍马丁森的背。马丁森不会退缩，但这也不至于让他想自杀。"
 goering.denmark.1.a:0 "别了，我美丽的丹麦。"
 goering.denmark.2.t:0 "丹麦的烂摊子"
 goering.denmark.2.d:0 "在一间昏暗的小屋中，戈林、阿克斯曼和贝斯特坐在一张小桌旁。\n\n“戈林元首，我想你有——”\n\n“我不是一个喜欢开玩笑的人。我没有时间为了一个芝麻大小的国家大费周章。我就直说了——”戈林身体前倾。“我要让丹麦被德国吞并，从现在开始。”\n\n“什——我的元首，这实在办不到！”贝斯特吃了一惊。“丹麦人还没有摆脱他们堕落的天性！这片土地还需要继续净化。您也不想让劣等人和雅利安人生活在同一个国家吧。元首先生，我跟你说，只需要再给我几年，我就能——”\n\n“几年？几年？！”戈林看向阿克斯曼，哈哈大笑。阿克斯曼见状，也被迫着和他一起笑。“你已经在丹麦呆了多少年了？”\n\n“我呆了差不多二十年，但那些丹麦人还是——”\n\n“得了吧，贝斯特。你忘了自己对祖国的职责吗？丹麦现在已经得到净化了。若非如此，那只能说你没有尽到你的职责……”戈林对贝斯特露出了恶魔般的微笑，阿克斯曼没忍住，也傻笑了起来，但贝斯特看起来好像被吓坏了。\n\n“我向你保证，元首。”贝斯特倒吸了一口凉气。“我已经尽了我的全力，可这些事情着急不得！那些游击队把我们建立起的一切都推倒了！”\n\n“你觉得你在跟谁说话？我想，戈林元首轻而易举就能碾碎一切挡路的游击队。”阿克斯曼终于开腔了。戈林看起来有点生气，因为阿克斯曼抢了他的风头。“所以你为什么不把丹麦交给我们，让我们来处理呢？”贝斯特看了看坐在他面前的两个傻笑的男人。他们犯下了一个可怕的错误。"
 goering.denmark.2.a:0 "“好吧。明天我就宣布吞并。”"
 goering.denmark.3.t:0 "丹麦的烂摊子"
 goering.denmark.3.d:0 "\"I still don't understand why we have to come all the way out here.\" Göring complained. He had been dealing with incredibly mundane bureaucratic tasks all day. Now he had to go to Denmark to listen to someone blabber on about how great it would be for Denmark to be a part of the Reich then sign a paper and blabber on more and more and sign another paper. \"Doesn't Hanneken want to be a part of the Reich already? Let's just get it done with.\"\n\n\"You can demand that at the meeting. I don't know why but he wanted me and you to come all the way out here to negotiate. I'm just as unhappy as you are.\" Speidel responded. The two soon arrived at the small bunker Hanneken wanted to meet them in. Hanneken greeted them both politely and the three men sat down at a small table. Speidel and Hanneken began the usual diplomatic overtures. Göring quickly became tired of it. Two hours into the negotiations, Göring tapped on the table loudly. He then cleared his throat. He glared at a soldier guarding the door and tapped again. The soldier's eyes widened. He rapidly strode over to Göring and whispered something in his ear.\n\n\"I'm sorry, gentlemen, but there's an urgent matter I have to attend to.\" Göring said with a wide grin on his face as he leapt out of his chair. He swiftly left the negotiations."
 goering.denmark.3.a:0 "“斯派达尔，帮我处理好这一切。”"
 goering.denmark.4.t:0 "将军的疑虑"
 goering.denmark.4.d:0 "\"Now Speidel, I'm not sure about Göring's intentions with Denmark.\" Hanneken plainly stated as soon as Göring had left.\n\n\"What do you mean, Hanneken? If anything, Göring wants to integrate Denmark the most out of all of the people who could have won the civil war.\" Speidel responded.\n\n\"Well, I'm not sure about what he means when he says he wants to integrate Denmark. While it is true that not integrating the land will make the Danes harder to manage, I don't think Göring has any interest in actually managing the land.\" Hanneken cleared his throat. \"I think he just wants the land as a source of pride. He's not going to spread any Aryans there.\" The two men stared at each other for a bit. Eventually Speidel spoke up.\n\n\"Well, Göring may not, but I will. That's why you wanted me here, isn't it? To guarantee Denmark would be actually integrated and not just abandoned as soon as Göring loses interest?\" Speidel smiled. Hanneken halfheartedly returned the smile. \"If that's the case, then I think we have a deal.\" Speidel said. Hanneken let out a sigh of relief."
 goering.denmark.4.a:0 "“谢谢您，斯派达尔先生。"
 Goering_denmark_category:0 "毛奇行动"
 Goering_denmark_category_desc:0 "The chaos of the Civil War forced little Denmark to break away from the Reich. Naturally, this was only ever a temporary development, whether the Danes realize it or not..."
 GGR_negotiate_with_denmark:0 "We have attemped to negotiate with Denmark."
 GGR_negotiate_with_best:0 "Negotiate With Best"
 GGR_negotiate_with_martinsen:0 "Negotiate With Martinsen"
 GGR_negotiate_with_hanneken:0 "Negotiate With Von Hanneken"
 GGR_the_heer_is_ready_idea: "The Heer Is Ready"
 GGR_invade_denmark_flag: "We have invaded §YDenmark§!"
 GGR_denmark_conquered_tooltip:0 "We have succeeded in the conquest of §YDenmark§!\n"
 GGR_fall_augustus:0 "Unternehmen Augustus"
 GGR_fall_augustus_desc:0 "In the grim aftermath of our great civil war, we have been forced to face the inadequacies that the previous administration could not have accounted for. The Generalgouvernement, supposedly our most successful vassal, is a rotten dumpster fire of epic proportions. Biting the hand that fed them, the bastard Poles declared independence! Führer Göring will not let this stand. We must protect our own inside the region, even if it means crushing a once loyal protectorate."
 GGR_fall_augustus_tooltip:0 "We will prepare for the reconquest of Poland. Relevant decisions will be unlocked."
 GGR_eastern_tank_buildup:0 "Eastern Tank Buildup"
 GGR_eastern_tank_buildup_desc:0 "Much like the heroes of old, our invasion of Poland will be tipped by our indomitable Panzer Corps. Little more than ragtag militias, the Poles will be totally and utterly annihilated by our superior armored forces and highly trained crews. Nothing stands in our way!"
 GGR_eastern_tank_buildup_tooltip:0 "§YNew tank divisions will be deployed.§!"
 GGR_eastern_air_buildup:0 "Eastern Air Buildup"
 GGR_eastern_air_buildup_desc:0 "Although our mighty armies are undoubtedly the finest on the face of the Führer's green earth, we have since learned our lessons from the wars of old. Air support is key, and our Luftwaffe excels in battlefield support. Constructing additional airstrips along the Polish border will allow us to use our forces to maximum effect, and remind veterans of years past why they feared the sound of dive bombers..."
 GGR_fate_of_the_poles:0 "Fate of the Poles"
 GGR_fate_of_the_poles_desc:0 "Subjugated once more under the boot of our unconquerable will, the Poles will once more learn that resistance is futile. The grim acceptance we had hoped for has not yet set in among the population, and we will remind them of their place at the bottom of the pyramid.\n\nThe ones who resist will make excellent examples..."
 GGR_greater_prussia:0 "Greater Prussia"
 GGR_greater_prussia_desc:0 "The idea of a Greater Prussia has long been a dream of the party, and under Führer Göring, this dream will become reality. With the Poles dealt with and resistance obliterated under the might of the Wehrmacht, Poland is fit for total annexation into the Greater German Reich. Lebensraum, quite literally, in our own backyards."
 goering.957.t:0 "Polish Resistance!"
 goering.957.d:0 "Hit and run attacks have always been a thorn in the side of any occupying force. The veteran partisans of the Polish Underground State must truly be among the best guerrillas in Europe. One of our patrols was hit today, killing many and badly injuring many more. Before major reinforcements could arrive, the terrorists melted into the surrounding area. In reprisal, an equal number of civilians were taken from a nearby town. A warning was issued state wide, demanding the perpetrators turn themselves in to local forces immediately. None showed as the clock struck the deadline. Every last man, woman, and child we had taken was shot in the public square in accordance with our threats.\n\nWhen the vengeance-fueled counterattack eventually came, our men were ready. The resistance cell suffered heavy casualties, and will likely think twice before hitting another German-held area."
 goering.957.a:0 "They'll thank us later, but in German."
 goering.poland.1.t:0 "燃烧的臂章"
 goering.poland.1.d:0 "约瑟夫一阵干呕，将秽物吐在冰冷的路面上。那些暴徒试图夺走父亲留下的臂章时，他全身瘫软，唯独手指仍死死攥着那黄铜徽章。安娜的恸哭近在咫尺，可他连睁眼寻找她的力气都没有了。\n\n肋间突然炸开剧痛——又挨了一记猛踢。德国人烧毁了他们的国旗，侵占了他们的国土，碾碎了他们的尊严。如今连父亲用生命捍卫过的最后信物都不肯留给他吗？军靴狠狠踹上鼻梁，鲜血顿时糊了满脸。有人用德语吼叫着，可他耳中只剩轰鸣。\n\n但约瑟夫没有松手。或许他和当年的父亲一样，甘愿为波兰人民战斗到底；或许他只是受够了任人欺凌；又或许，他早已被揍得连松开手指的力气都没有了——即便这能换条活路。然而顽抗终有尽头。\n\n布料撕裂声响起，约瑟夫明白一切都完了。他拼死守护的最后纪念品被生生扯走。篝火噼啪作响间，德国人的哄笑声刺痛耳膜。他仿佛看见红白相间的臂章在焦黑的旗帜堆里燃烧，与其他抗争的象征一同化为灰烬。\n\n可此刻，当这个满身血污、泥浆与呕吐物的年轻人奄奄一息地趴在地上时，却比任何时候都更清晰地感受到：自己是个波兰人。"
 goering.poland.1.a:0 "他们的精神永存。"
 goering.poland.2.t:0 "艺术收藏"
 goering.poland.2.d:0 "弗朗茨端详着靠墙而立的那幅画作。这与他以往所见截然不同，尽管他自认对艺术并无多少慧根。“弗洛里安，过来搭把手。”那些泼洒的色块呈现出极悦目的图案，所用颜料之深邃华美，远非劣等民族所能购置——或许来路不正。\n\n弗洛里安慢吞吞地踱过来，却在看见画作时眼睛一亮。“啊，多美的杰作！”他赞叹道，“说不定元首会喜欢？我们可以谎称是在博物馆地下室发现的。”这个总爱给战利品编造传奇来历的家伙又补充道：“就说这是卡齐米日大帝临终前亲笔所绘如何？”\n\n弗朗茨心想他们已把太多掠获物都归到古代帝王名下，但仍不置可否地耸耸肩，双手扶住画框边缘。“要是元首不愿将它挂在卡琳宫，我夫人倒会乐意让卡齐米日的绝笔装点我们家的壁炉。这可是绝佳的谈资。”\n\n“我可不这么认为。”弗洛里安咧嘴笑着站到搭档对面，“你夫人唯一会提起的谈资，恐怕是但泽那个替你代笔写信的姑娘。”两人说笑间抬起画作，小心翼翼地穿过长廊。途中他们特意绕开了那位画家的遗骸。"
 goering.poland.2.a:0 "为虚荣而凋零的生命。"
 goering.poland.3.t:0 "欢迎回归祖国"
 goering.poland.3.d:0 "“大日耳曼国的同胞们！华沙的土地已重归祖国怀抱，并将永远属于她！”戈林面对如潮人群高声宣告，欢呼声浪几乎淹没他的话音。他挥动手臂作势平息人潮，民众立刻噤声肃立，迫不及待要聆听元首的下一句话。戈林暗想，要是那些政客和将军也这么好煽动就好了。\n\n“前人的致命错误，就是让那些劣等民族误以为波兰这个国家还存在。”戈林刻意用铿锵有力的声调宣布，“这片如今已彻底日耳曼化、按照德国蓝图重塑的土地，在我们移开视线陷入内耗时，曾沦为斯拉夫人的觊觎对象，承受过他们最凶残的袭击。”\n\n“我们绝不再将本应属于我们的生存空间称作波兰！从今往后，这片德意志疆域只配拥有它真正的名称！”戈林向如痴如醉的民众咆哮道，“在斯拉夫蛮人为波兰哀嚎时，雅利安种族将高歌大普鲁士！以大普鲁士为家园的德意志子民们，你们正置身于这个必将延续千年的伟大国度！”\n\n震耳欲聋的“戈林万岁”欢呼声响彻日耳曼尼亚。元首嘴角含笑，心中深知：无论世人如何诟病，他的德国终究是伟大的。"
 goering.poland.3.a:0 "荣耀归于普鲁士！"
 goering.ggn.1.t:0 "提前解决的问题"
 goering.ggn.1.d:0 "“好消息，我的元首。”\n\n戈林早已学会对这番开场白心存警惕，尤其当它出自舍尔纳之流的口中时。这所谓的好消息究竟是对所有人有利，还是仅仅对他个人有益？元首从堆积如山的战报、入侵计划与其他公文上抬起头，仅以挑眉作为回应。这次打扰最好物有所值。若又是嗜血的吹嘘之辞……\n\n“汉斯·弗兰克总督对我们的讯息作出了积极回应。他祝贺我们成功镇压叛徒，并宣誓效忠于现政权。”\n\n“那是当然。”独裁者想到此人便露出讥诮的冷笑，“这个差点败给本不该造反的寄生虫与奴隶的废物，比谁都清楚挑战我们的下场。没有政治动机，没有道德理由，更不存在逻辑依据……你专程过来就为汇报这种必然结果？”\n\n这次轮到费迪南德挑起眉毛。他操控的傀儡莫非已忘记自己的身份？如此不敬的言辞可不像忠臣所为……“无论这懦夫多么不堪，他毕竟从叛乱中保住了德国的首个战利品，维护了国家的尊严，让奥古斯都行动失去了实施必要。我们得妥善处置他和总督府。”\n\n尽管立场相左，两人对此事的厌恶却如出一辙。但他们都明白此事势在必行。“好吧。立即邀请他来日耳曼尼亚。等走完表面流程，我们再商定具体方案。”"
 goering.ggn.1.a:0 "少了一桩麻烦事。"
 goering.ggn.2.t:0 "最初和最后的高呼"
 goering.ggn.2.d:0 "游行、阅兵、凯旋颂歌——这类场景近来在日耳曼尼亚已屡见不鲜。当局正用民族主义狂热作为创可贴，试图掩盖内战留下的新鲜伤口。从收复故土到政府职位微调，任何由头都能成为军乐队出动的借口。汉斯·弗兰克心知肚明这场“胜利”的本质，却仍沉醉于这转瞬即逝的荣光。年过六旬的他明白，这无疑是自己人生的高光时刻。当勋章挂上胸前，当欢呼与乐声渐歇，他便知道余生将如残阳西坠，无可挽回地滑向命定的终局。\n\n然而终结时刻的裁决权，始终握在戈林手中。在被引入刚修缮完毕的人民大厅的那一刻，这个认知变得无比清晰。他确信自己不会被处决——若要他死，何必大费周章搞这场盛典？那么元首所图为何？他因维持现状受赏已是极限，按常理庆功宴后便该遣返华沙。此刻的召见，必有其深意。\n\n戈林挂着热络笑容将他迎入办公室，亲自道贺并邀他入座时，恐惧稍减。或许局面没那么糟？或许只是闲谈？或许——“总督一职已无需阁下担任。”费迪南德·舍尔纳就站在元首身侧，抱臂皱眉的宣言斩钉截铁，连其主君都突然对地板产生了兴趣。“镇压劣等民族的功绩固然可嘉，但叛乱本就不该发生。你未能防患未然，害无数优秀雅利安人枉送性命。”\n\n汉斯沉默以对。他无从辩驳，这些指控句句属实。本可怒斥体制腐败，申辩自己不过是随波逐流。但历经生死考验又获最高嘉奖后，他体内再榨不出一丝斗志。或许正是这份枯竭，比任何过错都更致命地注定了他的结局。\n\n“准你保留军阶头衔，带着养老金滚回庄园。在无人知晓的角落静候你应得的凄凉结局。现在，消失。”"
 goering.ggn.2.a:0 "片刻沉默后，汉斯最后一次高喊万岁，随即消失在历史书中。"
 goering.ggn.3.t:0 "Lost, Forever"
 goering.ggn.3.d:0 "\"So. What to do with Poland?\" The Führer asked the Chief of the OKW. Even under those damned sunglasses of his, Göring could tell that Schörner was rolling his eyes, before ever so helpfully offering his correction. \"You mean the Generalgouvernement.\" The Hound of War insisted, placing his hands impatiently on the map laid out before the pair, detailing the levels of devastation the uprising had caused. It was bad; Nowhere near as bad as what the Fatherland had suffered, but bad all the same.\n\n\"There are still low levels of resistance throughout these territories.\" Schörner eventually replied after a moment of consideration. Göring was surprised it took him even that long to come up with his answer; The man responded to every problem the exact same way, and as expected, his solution did not deviate from this pattern. \"The people have far more important things to worry about than some jumped up Poles. We play up the severity of the uprising and the damage it caused as much as possible, and no one will bat an eye when we put the entire region into lockdown. We go door to door, liquidating every last Pole in sight if we have to.\" In other words, genocide on a truly national scale. Not that the Führer had any particular moral qualms with such an idea, but the amount of resources it would require would be immense...Resources that could be better used elsewhere, if the war plans of the future were to be executed.\n\"No.\" The former Reichsmarschall eventually responded, something which caused a minor amount of disbelief from his second in command. It was rare to see him muster up the courage to refuse his benefactors outright. There must have been a reason for it. \"The pests knew that this was their last, best chance at breaking free from us. Any of them who were willing to fight joined in this struggle; in crushing them, we've killed off most of the troublemakers and scattered the rest. The remaining population will be compliant. They know their battle is lost.\" Göring declared, tapping his finger against the map impatiently. \"It would be a waste to throw away all that free labor. So...We do the opposite.\"\n\nFor as much personal resentment as there was between the two, Schörner realized that his Führer was more politically savvy than himself; That was the reason why he had been forced to attach himself to his name in the first place, after all. And while he would never let politics get in the way of military supremacy, if the man had an idea, why not let him air it? \"We declare that this revolt was the final, dying gasp of the Polish people. With their defeat, any risk of future insurgencies in the region have been destroyed forever. The area is now fully Germanized...And thus fit to be directly annexed into the Reich at last.\""
 goering.ggn.3.a:0 "Bloody Ferdinand smiled at the idea, just as Göring predicted he would."
 Goering_poland_category:0 "Unternehmen Augustus"
 Goering_poland_category_desc:0 "During the height of the Civil War the degenerate Poles erupted with unprovoked violence against the GGN. We must reclaim our dominion over them lest we appear weak to the rest of the world."
 GGR_destroy_poland:0 "Destroy Poland"
 GGR_new_oath_to_reich:0 "New Oath to the Reich"
 GGR_poland_conquered_tooltip:0 "We have succeeded in the conquest of §YPoland§!\n"
 GGR_operation_fruhling:0 "Unternehmen Frühling"
 GGR_operation_fruhling_desc:0 "In the dead heat of the Götterdämmerung, Reichsprotektorat Slovakia has bit the hand that fed them! The bastardly ethnic Slavs in our protectorate have overthrown the loyal aspects of our duly appointed government. Forced to face the products of their own failings at Germanization, the loyalist elements of the government have shown themselves to be cowards and fled. If you want something done right, it seems, you must do it yourself... "
 GGR_operation_fruhling_tooltip:0 "We will prepare for the reconquest of Slovakia. Relevant decisions will be unlocked."
 GGR_native_battalions:0 "Native Battalions"
 GGR_native_battalions_desc:0 "Not all is lost! According to our supreme intelligence services, there are surviving loyalist forces in the Reichsprotektorat who seek to restore order and stability. All it will take to rally them is a show of force near the border, and these loyal men will flock to our side in earnest to reclaim their homeland. Slovakia will be ours once again."
 GGR_native_battalions_effect_tooltip:0 "§YWe will gain some loyalist divisions.§!"
 GGR_the_final_ultimatum:0 "The Final Ultimatum"
 GGR_the_final_ultimatum_desc:0 "Despite our repeated attempts at coaxing, threatening, and pleading with Slovakia to rejoin the Reich, the breakaway state stubbornly refuses negotiations. This cannot be allowed to persist, lest we show weakness. The Führer's full attention has been brought to bear on the disloyal Reichsprotektorat, and should they refuse his direct order to submit, they very well know the consequences."
 GGR_march_on_bratislava:0 "March on Bratislava"
 GGR_march_on_bratislava_desc:0 "While their bravery is commendable, the Slovak state has refused all diplomatic attempts at a peaceful reunification. Führer Göring will not tolerate this insolence. The troops will be mobilized, supplies requisitioned, and targets marked. If Slovakia will not follow the example of a loyal protectorate, then Slovakia will become one. "
 GGR_internal_affairs:0 "Internal Affairs"
 GGR_internal_affairs_desc:0 "With rebellious Slovakian military forces dismantled and the treasonous government ousted, now is the time to root out dissent before it goes underground. While the partisans are small in number, the memory of revolt must be erased. The collaborator government and OKW have butted heads on how to do so. Slovakia favors the use of police in order to infiltrate potential cells and destroy them quietly, whereas OKW wants a fire and brimstone show of force. The Führer will show his diplomatic skill and strength to force a compromise!"
 goering.slovakia.1.t:0 "Göring's Ultimatum"
 goering.slovakia.1.desc:0 "At dawn today, Führer Göring issued a public radio demand to the Slovak government to once again become a Reichsprotektorate under German rule. In a grand show of force, troops were brought to the border and jets were flown overhead.\n\nQuietly, however, a communique was sent to the heads of state, outlining a deal to collaborators and rebels alike. Rejoin the Pakt, and be allowed to stay in power."
 goering.slovakia.1.a:0 "Yes, sir..."
 goering.slovakia.1.b:0 "No longer!"
 goering.slovakia.2.t:0 "Slovakia Refuses"
 goering.slovakia.2.d:0 "In an incomprehensibly foolish move, it seems that the Slovakians are unwilling to bow to our ultimatum! In a strongly worded letter today, the Bratislavan government told our Führer in no uncertain terms that \"Slovakia will never again bow to German domination\". This is by far one of the most confounding letters to ever cross Göring's desk- if we thought that nations like Poland had no chance, a nation as small and weak as Slovakia will fall within a matter of days to the German war machine.\n\nIn any case, such a response, though unexpected, was planned for. A Heer army lines the border, waiting on our word to invade and crush these rebellious upstarts for good. With the comical difference in size, training, and equipment between our army and theirs, this operation should take no longer than a week to complete. Before long, German boots will march through Bratislava, and Slovakia will learn its place- as our inferiors, nothing more."
 goering.slovakia.2.a:0 "They should thank us for keeping them around at all."
 goering.slovakia.3.t:0 "Ultimatum Response"
 goering.slovakia.3.d:0 "Whether by intimidation by the Führer or for their own interests, the Slovak government has agreed to once again relinquish its freedom and allow Germany to dominate the region. Barriers have been broken down, mines disarmed, and militias disbanded. German troops crossed the border at dawn, escorting Göring to Bratislava, where he personally signed the papers reinstating Slovakia's place in the Reich. This move has been widely publicized as an example of how Reichsprotektorats must act."
 goering.slovakia.3.a:0 "This pleases us."
 goering.slovakia.4.t:0 "The Conquest of Slovakia"
 goering.slovakia.4.d:0 "Did they really think it could end in any other way?\"\n\nHermann Göring pored over reports and photos alike detailing the predestined conclusion of operation Frühling; A decisive victory for Germany, of course. Seated opposite to him was Friedrich Foertsch, a Generalleutnant of the heer and very confused man. When he had initially been summoned to speak with the Führer in person, he had presumed the worst; That he was being dismissed, or worse, executed, the reason for which could have been completely justifiable or utterly benign on a whim. Luckily, the jovial attitude of Uncle Göring had put to rest any fears of such an outcome, but it still left him wondering what was so important as to bring him before the most powerful man in the Reich.\n\n\"Look at these pictures. Look.\" The former Reichsmarschall insisted, tossing over a few photographs to his guest. They depicted nothing short of the absolute flattening of the city of Bratislava, a monument to the consequences of defiance. \"Did they not know this was going to happen? Did they think we'd just leave them alone? Or worse, that they could actually defeat us?\" Göring smiled widely as he proposed the rhetorical questions, not an ounce of remorse in his entire body for what had happened. In his eyes, it was not Germany who was at fault for the deaths of so many Slovakians; it was their own. They had brought it upon themselves.\n\n\"I ... I could not tell you the reason, mein Führer.\" Foertsch replied, trying his best to avoid looking discomforted, and potentially be accused of treason himself. \"May ... May I ask the reason as to why I have been summoned before you?\" He ventured, desperately hoping for the best. \"Mm? Oh, yes. Well, to get down to business ...\" The Führer replied, closing the file that contained the rest of the report, before effortlessly shoving it towards Foertsch. \"This entire Slovakian situation is now your responsibility.\" The declaration was casual and quick, as if it meant nothing in the world. \"Your job as Reichskommissar is to keep them in line, and to make sure that they don't try anything like this again. It really is for their own good. You start tomorrow ... Assuming you accept the position, of course.\"\n\nFoertsch sat there in stunned silence, for just long enough to realize that he was doing so, before offering a bright smile and reaching out, accepting both the file and his new station at once."
 goering.slovakia.4.a:0 "He would remind them of their place."
 goering.slovakia.5.t:0 "Build It Back Up"
 goering.slovakia.5.d:0 "Why had the collaborationist government in Slovakia failed? The question pervaded in Göring's head, rising to the top every time he had a moment of peace, banging around in his mind like a pinball. It made no sense- decades of subservience, quiet obedience, and then suddenly they had jumped ship from Germany as fast as they could. All the way up to the Bürgerkrieg, the few reports that ever came from Slovakia were mundane- peaceful, quiet, boring reports nobody gave much mind to. Why would they?\n\nIt struck Göring like a lightning bolt. The reports were so incredibly wrong because the Slovakians had been hiding their intentions. While they had paid lip service to the Reich, they had been secretly planning their betrayal for years! It all fell into place- the sudden change in heart, the resistance to German control, all of it. As Göring figured it out, the plan began to fall into place.\n\nThe collaborationist government would be restored, as expected, but they would never again get so much autonomy. The Reich had taken its eye off the ball, and Slovakia had exploited it to the fullest. Now, the Reich's eyes would be glued to Slovakia, and the army would be ready to sweep in the instant a single piece of the puzzle tried to fall out of place. This embarrassment would never happen again- not under Göring, not under anyone after Göring, not for a thousand years."
 goering.slovakia.5.a:0 "Never again!"
 goering.slovakia.6.t:0 "Ordnungspolizei in Slovakia"
 goering.slovakia.6.d:0 "Göring looked at his new report incredulously. He looked back up at the secretary, then back down at the paper. \"Is this a joke?\"\n\n\"No, my Führer. This is all serious information.\" Göring slumped in his chair with a frustrated sigh. The Slovakians, of all nations, were giving him this much grief. It wasn't like they were any real threat to the Reich, but this festering sore on Germany's underside was taking a hundred German lives a month. What was wrong with the Slovaks? When God made them, clearly he had forgotten to put in the quit.\n\nThere was an easy way to solve this, of course- expanding Orpo operations to the Slovakian region. After all, could local forces be trusted with occupying their own nation? No, such an arrangement was begging for disaster. The Orpo would control Slovakia, and it would learn to be obedient, calm, and placid. Slovakia would learn order. Whether they learned it through gunfire or diplomacy would be up to them."
 goering.slovakia.6.a:0 "Maybe now they'll learn their place."
 goering.slovakia.7.t:0 "Under Our Thumb"
 goering.slovakia.7.d:0 "The people of Bratislava barely knew what hit them. First, the truckloads of German soldiers and tanks, rolling over any opposition directly to the city center, tearing down the Slovak flag and pulling up the swastika in its place. Then, the German soldiers left, and the people of the city managed to take one final breath before the next wave came.\n\nThe Waffen-HG- the HG standing for Hlinka Garde- was oppressive in its actions, brutal in its punishment. On what seemed like every corner and every square, a German soldier watched over the crowds with rifle in hand. The people quickly learned to fear them, and soon the streets were quiet- no more demonstrations or furious speeches, only the sounds of cars and footsteps, all watched over by the Germans.\n\nThe people hated the Waffen-HG, but what could they do about it? They had been disarmed, destroyed, and overwhelmingly crushed by a monster far, far greater than any of them. Even if, by some miracle, they succeeded in expelling the German beast, they'd just come back with their tanks again, and this time Slovakia would never get another chance.\n\nSo the Slovakian people, by and large, gave up. Their only hope now is that some bigger monster- whether external or internal- would eventually destroy their current monster. For now, however, they would have to throw in the towel."
 goering.slovakia.7.a:0 "The end of a short era."
 goering.slovakia.8.t:0 "The Hunt Resumes"
 goering.slovakia.8.d:0 "The headlights of the car sliced through the darkened streets of Bratislava as the four men looked for their target. One held a photograph to their flashlight- they knew who he was, they knew what he looked like, and they knew where he would be. A local professor, loudly anti-German, suspected ties to Slovakian communists. The quintessential academic, and one that Germany would not- could not- tolerate.\n\nThe headlights lit up a solitary man, dressed in a trenchcoat, and the men inside readied their pistols. He turned towards the car, and for a moment, all four men could see the sudden fear flashing through his eyes as he burst into a run. The driver slammed on the brakes, and the three men leapt out of their seats, chasing him into a dark alley.\n\nAs the man ran for the next road, he realized his mistake- the alley had nowhere to take cover, nothing to hide behind. The point was punctuated with three sharp cracks of gunfire lighting up the walls like a camera flash, and the man collapsed with a thud. One man rolled him over with his foot, comparing the image to the corpse, nodding to his colleagues when he confirmed the target. Silently, they dragged the body into the trunk of the car and sped away."
 goering.slovakia.8.a:0 "Order at any cost."
 goering.slovakia.9.t:0 "The Triumph of Loyalty"
 goering.slovakia.9.d:0 "For Otomar Kubala, this morning was special. Never before had a government car driven him to his place of service, nor had he been accompanied by men in plain clothes.\n\nThe car quickly gained speed and smoothly glided through the streets of Bratislava. The dignified man sitting next to him in the back seat checked his watch and cleared his throat dryly as they stopped at another traffic light.\n\nFor the first time in the quarter-hour journey, he broke the silence with a question: \"Mr. Kubala? Is that correct?\"\n\nOtomar nodded affirmatively, assuming the next stop would be a couple of streets away, at the brown house.\n\n\"Might this be a mistake?\" the collaborator asked uncertainly.\n\nHis companion's gaze shifted from tired to puzzled. \"Otomar Kubala. By order of Führer Göring, you are the Reichskommissar of Slovakia from today onward. I do not consider this a mistake. You have served your nation very long and loyally. You are a great friend of the German people,\" the German firmly replied, unbuttoning the collar of his general's greatcoat.\n\n\"Wait a second, you are Friedrich Förstch?\" a bewildered Kubala said, trying to grasp what was happening.\n\n\"Correct, Mr. Kubala. I am General Colonel Friedrich Förstch. Please forgive me; my schedule has been too tight to personally inform you of your promotion. Right now, I should already be returning to Germany,\" the German officer replied, handing him a thick folder of papers from a briefcase.\n\nHalf an hour later, Otomar Kubala was already at his destination, and the only thing that bothered him was his own foolishness. He had imagined his upcoming appointment completely differently. The deed was done, of course, but..."
 goering.slovakia.9.a:0 "...how did he not check the mailbox in the morning?"
 Goering_slovakia_category:0 "Unternehmen Frühling"
 Goering_slovakia_category_desc:0 "Our very first subject nation, the Slovak state has followed the Reich through thick and thin these past decades. However, it seems that in the wake of Joseph Tiso's death, the Slovaks have forgotten who their greatest patron is. No matter, we shall give them all the reminder they could need."
 GGR_slovakia_conquered_tooltip:0 "We have succeeded in the conquest of §YSlovakia§!\n"
 goering.ostland.1.t:0 "Baltic Germans Integrated"
 goering.ostland.1.d:0 "Naturally, the first and easiest of Ostland's territories to integrate have been those which were majority-German before we even arrived. The Baltic Germans were the most immediate and grateful beneficiaries of our rule and quickly adapted to life under the Reich. Natalist programs and family unifications, encouraged in the years following the liberation, helped greatly to expand their numbers to the point where they now comprise the majority of the population in Lithuania. With Balts reduced to a minority, the Führer has proclaimed these areas to be pacified and ready for complete integration into the Reich, further expanding the formal borders of the Reich proper into the former Reichskommissariat. \"The legacy of the Teutonic Order,\" the Führer stated in a press release, \"Has finally been fulfilled\""
 goering.ostland.1.a:0 "German today, German tomorrow, German forever!"
 goering.ostland.2.t:0 "Ost-Germans Integrated"
 goering.ostland.2.d:0 "Further afield from the coast of Ostland lies Belarus, once packed to the gills with Balts and Slavs. Though we managed to find decent support against the Soviets there, along with a sizeable number of racially acceptable natives suitable for Germanization, the east called and our colonists answered. What followed the conquest of Belarus was the emergence of a distinctly colonial German culture: fierce, strong and hardy. The Ost-Germans have brought the virility of the Aryan race to this backwater, sowing the fertile seeds of the German people in the rich farmlands and verdant forests. With plenty of colonists present, the racially acceptable natives being rapidly assimilated and the remainder pushed to the fringes of society, the Führer has seen fit to formally integrate these parts of Ostland into the Reich. \"The Ost-Germans are the truest children of the Aryan race in the east,\" he explained to a crowd of eager reporters today. \"It is long past time that their efforts in bringing the light of civilization to the frontier are recognised.\""
 goering.ostland.2.a:0 "Ost-Germans never die!"
 goering.ostland.3.t:0 "Non-German Regions of Ostland Integrated"
 goering.ostland.3.d:0 "The question of how far the current efforts to integrate Ostland should go has been a matter of great contention within the colonial authorities. Today, the Führer finally stepped in, declaring that with the majority Baltic- and Ost-German lands integrated, the Reich's grip on these formerly troublesome lands is secure enough that there is no further need to worry about the possibility of further resistance from the Balts, Slavs and Estonians who remain in the colony. Accordingly, the aggressive pursuit of Germanization can slow down to a more measured pace. The Führer's reasoning is simple: with their will to fight repeatedly broken and a strong German presence established, the natives pose no threat at this point and their assimilation or displacement is so certain that the Reich can finally afford to ease up, redirecting resources to more pressing matters. The integration of the remaining parts of Ostland, be they majority-German or native, is to commence immediately and without hesitation. Our race will win out in these areas soon enough."
 goering.ostland.3.a:0 "The march of the Aryan race cannot be stopped."
 GGR_baltic_germans_integrated:0 "The first parts of Ostland shall be integrated into the Reich forming 2 new §YReichsgaue.§!\n"
 GGR_ost_germans_integrated:0 "The Ost-Germans in Ostland rejoice as their areas are properly incorporated into the Reich, forming 2 new §YReichsgaue.§!\n"
 GGR_non_german_ostland_integrated:0 "The last parts of Ostland will be integrated into the Reich forming 11 new §YReichsgaue.§!\n"
 GGR_ostland_conquered_tooltip:0 "We have succeeded in the conquest of §YOstland§!\n"
 goering.831.t:0 "Widespread Looting in Ostland"
 goering.831.desc:0 "Our recent conquest has unleashed a chaotic maelstrom of issues in the region of Ostland. Widespread looting and pillaging by our troops has sparked an intense spike in hostility from the natives towards the Germans, and some of Göring's advisors have mentioned that instantaneous integration will result in overwhelming partisan uprising that would tear us apart. Furthermore, the last few years of bloody conflict have all but crippled Ostland and reduced it to a failed state; to bring it into the fold would only serve to drain the time, effort and precious resources of the Reich. For now, we leave Ostland as it stands."
 goering.831.a:0 "Frustrating, but necessary."
 GGR_ostland_partisans:0 "Ostland Partisans"
 GGR_ostland_partisans_desc:0 "While the invasion has taken little time we have encountered a new problem: partisans. This was not entirely unexpected but a problem nonetheless. Atleast it is nothing a bullet cannot solve."
 GGR_ostland_partisans2:0 "Ostland Partisans"
 GGR_ostland_partisans2_desc:0 "While the invasion has taken little time we have encountered a new problem: partisans. This was not entirely unexpected but a problem nonetheless. Atleast it is nothing a bullet cannot solve."
 GGR_rebuilt_ostland:0 "Rebuilding Ostland"
 GGR_operation_ostwind2:0 "Unternehmen Ostwind"
 GGR_operation_ostwind2_desc:0 "Despite our Führer's victory over the scheming liberals in the civil war and the subsequent purges, the Reich is not yet free of these effete pests; in Ostland, our model colony and one of the most heavily Germanized areas of the Greater Reich, the Speer-esque Andreas Meyer-Landrut has somehow managed to crawl his way to victory over the SS, partisans and National Socialist loyalists. The mere thought of a banker and a liberal ruling such a vital part of the Greater Reich... who knows what that Speerite has planned for it? As a representative of liberalism, secessionism and democracy, Meyer-Landrut stands for everything that is anathema to National Socialism - the army recognises this, and is chomping at the bit to have at him. The Führer would have it no other way."
 GGR_the_last_of_the_liberals:0 "The Last of the Liberals"
 GGR_the_last_of_the_liberals_desc:0 "In the final days of the war, as our triumph loomed, Speer's worms slithered their way along the forgotten roads and railways of the shattered Reich, seeking safety from the light of National Socialism. Were it not for Meyer-Landrut, they might have been caught and killed before ever finding that safety. Now, however, the Abwehr informs us that many Speerite civilians and soldiers alike are still alive and kicking in Ostland, turning to a banker of all things to save them in the absence of their false Führer. While they were no doubt welcomed at the time of their arrival, the traitorous government of Ostland will soon have reason to rue their decision, as every Speerite that fled to their lands is one more traitor to rally Germany against. This is no renewed conflict, but merely the final battle of the civil war!"
 GGR_the_worst_of_the_bankers:0 "The Worst of the Bankers"
 GGR_the_worst_of_the_bankers_desc:0 "Bankers! Is there any profession so infested with profligates, rootless foreigners and, of course, Jews? I'd wager Meyer-Landrut has some Semite blood himself! Just the sort of thing needed to get people on-side, even if the genealogical records don't support it. We can worry about that later. The fact of the matter is that National Socialism found its first converts amongst the masses thanks to the blunders and scheming of the Judeo-Bolshevik bankers and capitalists. Operating from the shadows, they stabbed the Old Reich in the back, destroyed the Weimar Republic's economy and tried to bring down the entire world through the Wall Street Crash. The common man of Germany has no love for bankers and industrialists; the propaganda effectively writes itself. Never will we have so agreeable a target as Andreas Meyer-Landrut."
 GGR_the_myth_of_the_free:0 "The Myth of the Free"
 GGR_the_myth_of_the_free_desc:0 "Those who would look to Ostland for some hope of 'reform' and 'progress' are deluded at best. Really, does Ostland look like a 'free society' to anyone? Ethnic strife, poverty, ruined infrastructure and industry, food shortages - is this what freedom looks like? It is a myth, fellow Germans. A myth perpetuated by the corrupt plutocracy that is the United States. Where did their version of freedom lead them? To weakness, to instability... and, ultimately, to defeat. Without the amassed capital of the United States, plundered from the masses, how does Meyer-Landrut propose to make his promises reality? His 'freedom' is a falsehood. It belongs where all impure, deceptive myths do: in the dustbin of history."
 GGR_build_the_border:0 "Build the Border"
 GGR_build_the_border_desc:0 "Despite the reliability of the Abwehr, we can never be too sure of the exact strength of our enemy in this instance. Cabals of bankers controlled much of the world before National Socialism ever came to be - despite their weakness, they are masters of subterfuge. Who knows how many fifth columnists wait among the crowds of refugees, just waiting for a chance to slip across the border? Perhaps the financier even intends for Ostland to serve as a staging ground for some greater hostile power... doubtless he is in talks with his hook-nosed comrades in America even as we speak! Whatever the potential threats, it would be prudent to fortify the border. Not just increased patrols, either; we need checkpoints, observation posts, AA batteries, airstrips, even forts! Whatever guarantees the security of our people near the border from bloodthirsty traitors and partisans is worth every mark!"
 GGR_now_or_never:0 "Now or Never"
 GGR_now_or_never_desc:0 "Every second that passes gives that snake, Meyer-Landrut, more time to prepare for our arrival and brings more good Aryans closer to seduction by the honeyed words of the international Jewry. To withhold from striking immediately would be nothing more than an act of weakness and a betrayal of the spontaneous, masculine nature of the Aryan warrior! If we are capable, why not attack? Our lands are occupied by a traitor, a banker and a probable Jew! True-hearted Germans cry out for liberation from their despicable masters! What good will further procrastination do us when our people are being corrupted and killed just over the border? Make haste, brave soldiers!"
 GGR_end_landrut:0 "End Landrut"
 GGR_end_landrut_desc:0 "Though the serpents cluster around their master for safety, it will avail them naught. The Reichsadler spreads its wings and soars skywards on the hunt, showing our noble pilots the way to their targets. Our men, many of them hardened and bitter veterans of the civil war, are eager to take the fight to the last holdout of liberalism in the Reich. The Kriegsmarine has the coastline mined and monitored. Further east, the harsh and brutal lands of Russia will offer no refuge to traitors. The feeble liberals, with their foolish and ephemeral ideals, will be destroyed by our factually indisputable invincibility and the cold, hard logic of superior firepower. No student militias or subhuman partisans will stop the liberation of every last corner of the Reich!"
 GGR_extinguish_the_fire:0 "Extinguish the Fire"
 GGR_extinguish_the_fire_desc:0 "Astonishingly, another complete victory of National Socialism over liberalism was evidently not enough to convince everyone of our righteousness. There are still guerrillas and holdouts - Germans no less - active in Ostland, striking at outposts, loyalist townships and patrols. What madness grips them that they would continue to fight for the interests of international bankers with their homes in ruins and their families dead or imprisoned? What have they to gain? Is this a final, bitter curse from a defeated foe, or part of some greater plan by our enemies across the Atlantic? No matter the cause, we must treat this threat as we would any other. That is, we shall stomp, stomp and stomp again. Hard and fast, without mercy, until the last of these insects is reduced to a smear on the Wehrmacht's jackboot."
 GGR_stamp_out_the_spark:0 "Stamp out the Spark"
 GGR_stamp_out_the_spark_desc:0 "With the liberals destroyed, we can move on to the less ideologically threatening foes. Baltic partisans are as much a threat as they ever were. Many are hardened soldiers who have continued their futile struggle against our rightful rule ever since Ostland's liberation in 1941. SS 'werewolves', too, are a persistent thorn in our side. Even abandoned by their master, they are just as willing to fight to the death as the partisans and know our inner workings far better than the Balts do. Finally, there are those few Bormannites who resist the necessity of change and the renewal of the German warrior spirit. No matter their cause, they will all die in the end. They are little more than gnats biting at the heels of a lion - an annoyance at worst and one we can deal with in short order."
 GGR_find_the_loyalists:0 "Find the Loyalists"
 GGR_find_the_loyalists_desc:0 "Militarism found fertile soil in Ostland with war's return, thanks in no small part to the ceaseless activity of partisans throughout the past two decades. There, many recognise the necessity of always being alert and active with weapons close at hand, watching for any emergent threat. This wise outlook on life has already netted us a warm welcome in German-majority areas and there are many who prepared for our arrival with acts of sabotage and propaganda behind the lines of the liberal forces. These are good, loyal men - loyal to Germany, loyal to National Socialism and, most important of all, loyal to Göring. With the previous bureaucracy and garrison members largely dead or in hiding, we will need these men in the days to come."
 GGR_make_some_friends:0 "Make some Friends"
 GGR_make_some_friends_desc:0 "Thankfully, with Ostland so heavily Germanised, there is no shortage of reliable men we can turn to now that the land is secure. Baltic Germans were often the first target of partisans, both before and during the civil war. Most colonists have lost someone, or know someone else who has, breeding resentment, outrage and hate - all useful assets to help reassert our control. It is not uncommon for a recruiting officer to arrive in a German town and immediately be swamped with men young and old alike clamoring for the chance to avenge the fallen. Even before our arrival, they banded together in militias and roving bands to keep their Aryan kin safe and secure from the tide of rats as it rose ever higher, threatening to engulf all they held dear. The Ostland Divisions might not turn out to be the most capable or well-equipped of our divisions, but they will certainly be fiercely loyal to their race, with high morale and a deep devotion to National Socialist principles. Their symbolic importance, as defenders of Germany who never gave up the fight regardless of the odds, will make them an example for all good German colonists to aspire to!"
 GGR_the_fate_of_ostland:0 "The Fate of Ostland"
 GGR_the_fate_of_ostland_desc:0 "Order restored, patrol casualties down, partisans pacified. With mechanised patrols on the streets of Riga and reconnaissance planes active 24 hours a day, we can safely say that Ostland is 100% rebellion-free and ready for integration. The day has been a long time coming, but with the population being majority German and our control so thoroughly established in all facets of society and the economy, we can finally bring an end to Ostland's status as a mere Reichskommissariat and welcome it into the Greater German Reich as a full-fledged province! Colonisation and Germanisation efforts will continue, of course, but that's all just busywork at this point. The Baltic populace is no longer a concern and their racially acceptable elements will be as German as the Führer himself in no time! The Reich proper expands! Welcome home, Ostland!"
 goering.ostland.landrut.1.t:0 "Abwehr Report - Andreas Meyer-Landrut and the 'liberal' Ostland"
 goering.ostland.landrut.1.desc:0 "My Führer, please find enclosed the Abwehr's best possible assessment of the traitor Andreas Meyer-Landrut, who has inexplicably defeated all opposition to emerge as the de-facto ruler of Ostland following the recent strife therein.\n\nMeyer-Landrut is an industrialist of some note and a known member of the so-called liberals recently defeated in the civil war. Surely you would know him by reputation, at least; the man is famously infatuated with the subhumans of eastern Europe in a manner that goes beyond mere academic fascination. His loyalty has been suspect for years, but the Gestapo were never able to find conclusive evidence to bring charges of treason against him. It is likely that his significant personal fortune was the means by which he evaded the law - were we to conduct a thorough investigation, we would likely turn up many a Gestapo officer with greasy palms.\n\nMeyer-Landrut is no military man, but his betrayal of Aryan ideals has wooed many Balts and Slavs, who now fight for him along with our traitor kin. More significantly, of course, he represents a serious ideological threat as the last holdout of Speerism. My Führer, it is this agency's concern that as long as this traitor to the Fatherland and National Socialism remains active, the legitimacy of the Reich is threatened. It is Field Marshal Schörner's view that immediate action against this final pocket of resistance within the Reich proper is necessary, before the poison of liberalism finds root within our society again."
 goering.ostland.landrut.1.a:0 "A mere plutocrat hopes to stop me?"
 goering.ostland.landrut.2.t:0 "Sticking the Pigs"
 goering.ostland.landrut.2.desc:0 "History will never know why so many Speerites remained in Germany instead of fleeing. Whatever the reason, it was a pleasant surprise for the Gestapo when what could have been a long and arduous search for those bankers in Meyer-Landrut's clique turned out to be simplicity itself. Those who survived the war were all too easy to find. Often accompanied by their staff - no doubt indoctrinated into obedience - many were caught and arrested in their own homes or officers, desperately burning one document after another to try and protect themselves.\n\nWith the owners of some of Germany's biggest banks and businesses apprehended, it was a simple matter to rubber-stamp the paperwork necessary to seize their assets and transfer them to the Führer's personal control. The agents who brought in the snakes each received a commendation and a hefty bonus, cut from the wealth of their quarries. Doubtless we shall need such keen minds when the time comes to pursue such foes of the Reich once more. For now, at least, we can be assured that Meyer-Landrut has lost a crucial source of funding for his treasonous activities."
 goering.ostland.landrut.2.a:0 "A pittance, but every mark helps."
 goering.ostland.landrut.3.t:0 "Familiar Foes"
 goering.ostland.landrut.3.desc:0 "Sergeant Voss sighed at the sight of the first truck of the day driving through the checkpoint, its flatbed stuffed with bodybags. \"Shit,\" he said, scratching at the grey stubble on his freshly-shaved temples. \"Here we go again.\"\n\n\"Familiar sight, sir?\" asked the private sat next to him, puffing on a cigarette. \"How often did you see that in the last war?\"\n\nVoss opened his mouth to speak, but shut it when he saw the next truck round the bend of the wooded road, carrying another load of corpses. Another followed it, another followed that one, then five more in quick succession. The private waited patiently all the while, his cigarette forgotten and left on the stone wall to burn down to ash. By Voss' estimate, there had to have been close to one hundred fallen soldiers in total. One hundred posthumous commendations, one hundred letters home, one hundred cheap coffins to fill a new cemetery. \"Too often, son.\" he finally muttered, reaching for the flask of vodka stashed inside his coat. \"Better get used to it.\""
 goering.ostland.landrut.3.a:0 "Good thing we're not out of practice."
 Goering_ostland_category_landrut:0 "Unternehmen Ostwind"
 Goering_ostland_category_landrut_desc:0 "Meyer-Landrut believes he is the saviour of the Baltic? Hah, an amusing joke, but no more. The Baltic has and always will be our land by right of blood and fire, and any who would deny this, even if they be of German descent, is either a fool or a madman. Landrut shall see just how we treat fools and lunatics in the new Reich."
 GGR_make_some_friends_tooltip:0 "§YThere are plenty in Ostland willing to fight for us.§!\n"
 GGR_MST_operation_ostwind:0 "Unternehmen Ostwind"
 GGR_MST_operation_ostwind_desc:0 "The time has come to end the rule of the degenaret Meyer Landrut, the tanks are being lined up on the border and the invasion is about to commence. The Generals have already started betting on how long it will take, a week? maybe even a month? who knows but it won't take long and that is certain."
 GGR_MST_operation_ostwind2:0 "Unternehmen Ostwind"
 GGR_MST_operation_ostwind2_desc:0 "The time has come to end the rule of the degenaret Meyer Landrut, the tanks are being lined up on the border and the invasion is about to commence. The Generals have already started betting on how long it will take, a week? maybe even a month? who knows but it won't take long and that is certain."
 GGR_MST_operation_ostwind3:0 "Unternehmen Ostwind"
 GGR_MST_operation_ostwind3_desc:0 "The time has come to end the rule of the degenaret Meyer Landrut, the tanks are being lined up on the border and the invasion is about to commence. The Generals have already started betting on how long it will take, a week? maybe even a month? who knows but it won't take long and that is certain."
 GGR_reigning_in_drechsler:0 "Unternehmen Ostwind"
 GGR_reigning_in_drechsler_desc:0 "On the surface, the triumph in Ostland of a hardcore militarist like Otto-Heinrich Drechsler would appear to be an objectively good thing for our interests. However, there is a catch: Drechsler is famously a part of Field Marshal Schörner's clique and is virtually guaranteed to act at his patron's beck and call, rather than following the Führer's directives. Knowing this, the Führer wishes to have Dreschler removed from office by any means necessary (including force), but any direct action against him would undoubtedly rouse the ire of Schörner, a key backer of our cause. Ultimately, despite his well-backed threats, the Field Marshal is unlikely to move against the Führer so early, but he will not forget such an insult..."
 GGR_make_it_work:0 "Make It Work"
 GGR_make_it_work_desc:0 "Drechsler's true loyalty is an open secret, but that doesn't mean it's too late for him. He is a militarist at heart and clearly an able commander and administrator, given his victory over the other factions during Ostland's civil war. He is admirable, brave and a true National Socialist, dedicated wholly to the ideals and values of the Aryan race. He is a loyal and true soldier, unwavering in his devotion to the Reich, its people, and, surely, the Führer. What more could Göring ask for? Perhaps Drechsler even deserves a reward or several for his efforts... large ones, on a regular basis. The Führer wishes to honour the obligations of a good leader, as he is sure Drechsler wishes to honour his obligations as a loyal and faithful subordinate."
 GGR_open_the_border:0 "Open the Border"
 GGR_open_the_border_desc:0 "With order restored to Ostland, there's no need to keep such a tight lid on the border. The colony is suffering without the goods and services provided by the Reich and desperately needs manpower and resources to help rebuild. Reactivation of its full status as a Reichskommissariat and, later, integration into the Reich proper, must begin as soon as possible. Once infrastructure is repaired and the citizenry have work again, Germanization can resume and we can go full steam ahead on integration, pending Drechsler's further co-operation."
 GGR_the_stab_in_the_back:0 "The Stab in the Back"
 GGR_the_stab_in_the_back_desc:0 "Göring might not have a degree in economics, but he knows a bad investment when he sees it. Drechsler, despite being part of a clique with a dangerous amount of influence in Göring's government, is unlikely to be anything more than an obstacle should he remain in power - which he clearly intends to. If he will not bend, then he will break, Schörner's toady or not. Even if it raises the ire of the officer corps, the Führer must show his strength and bring the hammer down on this pretender to the office of Reichskommissar!"
 GGR_enough_is_enough:0 "Enough is Enough"
 GGR_enough_is_enough_desc:0 "Predictably, Field Marshal Schörner and his cronies have already caught wind of the Führer's decision to forcibly reclaim Ostland over the corpse of Drechsler. Despite their protests and the obvious fact that the Ostland garrison is now on full alert, preparations for the invasion are proceeding as normal. There is, after all, little that even Schörner can do to stop the German war machine once it begins grinding into action at the Führer's command. War plans for the invasion, once intended for the possibility of natives or a hostile power retaking Ostland, have been dug out of old filing cabinets and put into action. The war is expected to be an easy one, but the political fallout will be another, much harder battle altogether."
 GGR_operation_ostwind:0 "Unternehmen Ostwind"
 GGR_operation_ostwind_desc:0 "The grumbling of Schörner's clique has quietened down into white-hot, seething anger. There will be a reckoning come victory over Drechsler and they cannot be relied upon to follow their orders to the letter in this campaign, but everyone from the generals down to the lowliest private has their instructions now and the first strategic airstrikes have already begun. We will not stop now merely for the sake of political security when the people of Ostland are under the thumb of an unreliable, over-ambitious fool. Here's hoping Drechsler doesn't escape to tell his side of the story..."
 OST_the_truth:0 "The Truth"
 OST_the_truth_desc:0 "You'd think that the Führer's initial answer of \"Because I command it!\" would have gone over a little better when questions started to be asked about why the Wehrmacht was ordered to commit to another fratricidal conflict. Sadly this was not the case and many civilian news outlets have begun to voice concerns about the horror of forcing good German boys to go to war with their own brothers merely due to the supposed treason of just one man - a man who seemingly saved Ostland from chaos, at that. Well, did you know that the man in question has some very suspicious links to the same individuals he supposedly fought against in Ostland? That there are cheques made out to him in Meyer-Landrut's name, a collection of SS memorabilia in his Berlin apartment and a cheery letter of friendship from none other than Abba Kovner in his private mailbox? It's true! In fact, the Führer intends to make this public knowledge immediately!"
 OST_reconciliation:0 "Reconciliation"
 OST_reconciliation_desc:0 "To say that the military as a whole is unhappy with the Führer's decision to attack Ostland would be the understatement of the century. Normally, nobody would deign to yell at the Führer himself, not even over the phone - but Schörner did. Many generals expressed their concerns in similar but less vitriolic terms, and even civilian agencies have forwarded a complaint or two. That the Führer has responded to none of these insults with the death penalty is either a sign of deep-set cowardice or a genuine desire to reconcile. One can only hope that it's the latter."
 GGR_pull_them_back:0 "Pull Them Back"
 GGR_pull_them_back_desc:0 "Drechsler's officer corps has come under scrutiny for its conduct in recent years. Each and every officer in Ostland is clearly dedicated to his superior officer, as he should be, but loyalty to the Führer comes first. It is not his wish to 'rock the boat', but there are a few individuals he would like to recall for some perfectly ordinary performance reviews as well as well-deserved R&R. Doubtless those officers will be grateful to see their homes and families again. Not to worry, Field Marshal - the Führer has some good men in mind to fill the gaps while your men are away from their posts. Will this lead to a more long-term reshuffle of positions? Perhaps, but that's a matter for another time. Our men ship out tomorrow; be sure that Drechsler and his officers know to expect them!"
 GGR_stop_ruining_everything:0 "Stop Ruining Everything"
 GGR_stop_ruining_everything_desc:0 "There are a number of officers in Ostland who are... disloyal is too harsh a word... flexible in their allegiances. These are pragmatic men who will follow the worthy rather than their superiors in name only. Drechsler is known to regularly show his appreciation for their service through regular rewards and benefits, but he only has the wealth of Ostland to make this arrangement possible. Göring, on the other hand, has the wealth of the entire Reich, its citizens and its subjects at his disposal. If these good, honest men come to appreciate him all the more thanks to better pay and more perks, such a small expenditure will be more than worthwhile."
 GGR_reconstruction_aid:0 "Reconstruction Aid"
 GGR_reconstruction_aid_desc:0 "It isn't just resources that Ostland is short of; the Reichskommissariat is nowhere near as industrialised as the rest of the Reich due to the economic crash of the 50s and the weak, ineffectual governments that once presided over its constituent lands. It's hard enough rebuilding a railway without nearby factories producing parts - try doing it without modern machinery. The Führer recognises the colony's plight and has already issued a directive ordering the relocation of currently under-utilised workers and construction machinery to Ostland. Additional funds will also be made available to hire unskilled laborers for more menial work. Both Drechsler and the people of Ostland will no doubt be immensely grateful to the Führer for such compassion and generosity."
 GGR_reconstruction_aid_1:0 "Reconstruction Aid"
 GGR_reconstruction_aid_1_desc:0 "It isn't just resources that Ostland is short of; the Reichskommissariat is nowhere near as industrialised as the rest of the Reich due to the economic crash of the 50s and the weak, ineffectual governments that once presided over its constituent lands. It's hard enough rebuilding a railway without nearby factories producing parts - try doing it without modern machinery. The Führer recognises the colony's plight and has already issued a directive ordering the relocation of currently under-utilised workers and construction machinery to Ostland. Additional funds will also be made available to hire unskilled laborers for more menial work. Both Drechsler and the people of Ostland will no doubt be immensely grateful to the Führer for such compassion and generosity."
 GGR_work_with_us_damn_it:0 "Work with us Damn It"
 GGR_work_with_us_damn_it_desc:0 "More rewards, more benefits, more perks... whatever it takes to ensure goodwill towards the Führer, right? It would appear that Drechsler has more than just officers on his list of highly appreciated and appropriately paid individuals; in fact, it seems that everyone who isn't a Göring appointee is very well-liked by the Reichskommissar. It is said that a friend of Drechsler in Ostland enjoys the finest accommodation, has access to the best tailors and cobblers in Riga, and can get whatever financial help he needs from the Reichskommissar with a single phone call. One man is even known to eat oysters for breakfast - daily!\n\nHe should be most careful. People often choke on oysters."
 GGR_looking_to_the_future:0 "Looking to the Future"
 GGR_looking_to_the_future_desc:0 "With the most pressing parts of reconstruction over and some semblance of normalcy returning to Ostland, the Führer can rest a little easier. Drechsler has not been easy to work with, but there have been no serious disruptions in the reconstruction process so far - nothing to cause internal strife or spur on talk of dissent. The Baltic and Ost-German colonists certainly seem happy with the situation, with the economy on the uptick and their homes secured against partisan and SS activity. Steady the helm, hold this course, and Ostland should be integrated in no time."
 GGR_looking_to_the_future1:0 "Looking to the Future"
 GGR_looking_to_the_future1_desc:0 "With the most pressing parts of reconstruction over and some semblance of normalcy returning to Ostland, the Führer can rest a little easier. Drechsler has not been easy to work with, but there have been no serious disruptions in the reconstruction process so far - nothing to cause internal strife or spur on talk of dissent. The Baltic and Ost-German colonists certainly seem happy with the situation, with the economy on the uptick and their homes secured against partisan and SS activity. Steady the helm, hold this course, and Ostland should be integrated in no time."
 GGR_a_leash_and_a_crown:0 "A Leash and a Crown"
 GGR_a_leash_and_a_crown_desc:0 "It has been the reality for some time now, so it may as well be formalised; the Führer has finally decided that Ostland shall continue as a full-fledged Reichskommissariat for the time being, with Otto-Heinrich Drechsler, Saviour of Ostland, acting as Reichskommissar in perpetuity. Göring will travel to Riga to personally decorate Drechsler for his service to the Reich and its brave colonists, no doubt winning the Reichskommissar's eternal appreciation. Or, at the very least, giving him reason enough to think long and hard about where his loyalty lies in the event of further internal tensions within the Reich's leadership."
 OST_the_fate_of_ostland:0 "The Fate of Ostland"
 OST_the_fate_of_ostland_desc:0 "Finally, this foolish, fratricidal errand is over with. The military is up in arms (in a bad way), the Ostland garrison are dead or imprisoned as traitors for doing their sworn duty and all of Germany stands bewildered by this turn of events. The civil war might have brought ruin to Ostland, but a full-scale invasion by the biggest military on Earth has left it little more than a bloody, corpse-strewn battlefield. With so many colonists dead or reduced to refugees, two decades of effort has been undone in the course of a few weeks. The 'model colony' is battered, burned and smashed into a thousand pieces... but at least it's ours, right?"
 goering.ostland.drechsler.1.t:0 "The Truth About Drechsler"
 goering.ostland.drechsler.1.desc:0 "\"Speak,\" said Göring, eyeing his secretary over the great oaken desk in the Führer's office. Noticing the young man's trembling hands, he chuckled. \"Erich, you aren't addressing me in front of the Field Marshal. I won't take offence from speaking your mind if you have my permission to do so.\"\n\nErich took a deep breath and slowly exhaled. \"Yes, my Führer.\" He steadied his hands and adjusted his glasses, looking down at the mock-up headlines proposed to run in 'Der Sturmer' and 'Volkischë Beobachter'. \"OTTO DRECHSLER - LANDRUT'S FINAL SURPRISE?\" read one. \"WHO BOUGHT THE GARRISON?\" said another.\n\n\"Good enough for the proles, my Führer,\" Erich said, scratching at a scab on his poorly-shaven chin. \"But if you... uh, if you don't mind my saying, I'm not sure that the enlisted men will believe it.\" He shifted his gaze to the floor, awaiting Göring's violent castigation, but it never came.\n\nInstead, he heard the Führer's leather-backed chair creak as its occupant leaned back and tapped an idle finger on the desk. \"Hmph. True enough,\" he muttered after a pause. The chair groaned as Göring sat upright with a sigh. \"I didn't think it was much good myself, personally. Burn it, then arrange a meeting with the head of the Gestapo as soon as possible. Perhaps he has some ideas for how to deal with this nuisance of a man.\"\n\n\"Yes, my Führer,\" said Erich, hastily turning and making his way out of the spacious office, heading straight for the small incinerator kept in the back of the archive room. The Gestapo would probably be a better bet, he thought. They were tremendously skilled when it came to finding dirt on people, real or imagined..."
 goering.ostland.drechsler.1.a:0 "Let's hope the Wehrmacht doesn't get wind of this."
 goering.ostland.drechsler.2.t:0 "Future Investments"
 goering.ostland.drechsler.2.desc:0 "Hermann Göring has never been a financially astute man, but any of his friends could tell you how good he is at spending money. Jewelry, ancient artifacts, tailor-made uniforms, gold-plated firearms, ceremonial weapons... and that's just the stuff that he can't eat or drink. An evening at the Führer's private residence, Carinhall, is a seemingly endless parade of the finest gourmet meats, pastries and desserts prepared by the Reich's most talented chefs. Should the Führer deign to bring up anything from his wine cellar, he could choose from thousands of bottles of the rarest vintages that Europe has to offer.\n\nToday, however, the Führer is taking less personal economic matters into consideration. Reichskommissariat Ostland has returned to the fold and its economy is recovering well, but many prominent Ostlanders have been petitioning Berlin for additional investment. A dose of cash delivered on the Führer's order would certainly help create more jobs and send a positive message to private investors, but there is another matter to consider: the loyalty of Drechsler's officer corps. A fair number have been brought on-side while nobody was watching following the civil war, but perhaps it's worth attempting to secure the loyalty of a few more. Many of them are contemptuous of Drechsler, a known coward. The more men personally loyal to Göring rather than Schörner, the more secure the current government will be against any future coup attempts.\n\nOf course, we might need those Reichsmarks for a rainy day, right?"
 goering.ostland.drechsler.2.a:0 "Acquiesce to the petitions of the colony. They need all the help they can get."
 goering.ostland.drechsler.2.b:0 "Hopefully Drechsler won't notice a few more greasy handshakes than usual."
 goering.ostland.drechsler.2.c:0 "Frugality is a virtue, after all."
 goering.ostland.drechsler.3.t:0 "Mind That Grease"
 goering.ostland.drechsler.3.desc:0 "A minor scandal broke in militarist-aligned state media today, as several senior officers of the Ostland garrison were demoted to the lowest rank possible following evidence-based accusations of bribery. Though the media has no inkling of where the money came from, the people who leaked it - namely, a number of Schörner's underlings who apparently caught wind of the Führer's attempts to buy Drechsler's men - the Wehrmacht undoubtedly does. Gestapo surveillance personnel have reported that the Reichskommissar and Field Marshal met this morning, likely to discuss a punitive response to Göring's failed attempt at turning their men against them.\n\nGöring's blunder has deeply impacted his standing with his powerful allies. This minor incident might not come to much, but it has revealed the Führer's vulnerability and lack of political acumen. He has no need to fear the possibility of a coup over something so minor as bribery, but now the Wehrmacht will be on full alert for further attempts to corrupt its men."
 goering.ostland.drechsler.3.a:0 "Our loss is Schörner's gain."
 goering.ostland.drechsler.6.t:0 "A Letter to my Friends"
 goering.ostland.drechsler.6.desc:0 "FROM THE OFFICE OF THE FÜHRER, TO ALL LOYAL OFFICERS OF THE REICH:\n\nThe recent military action against the renegades in Reichskommissariat Ostland continues to trouble the morale of the Wehrmacht. This, your Führer is more than aware of. However, he is also certain that anyone reading this memorandum is equally aware of the reasons behind the decision to invade and depose the pretender Reichskommissar. It has been proven beyond reasonable doubt that Otto-Heinrich Drechsler was corrupt and in the employ of the same nefarious forces who reduced Ostland to a state of civil war. The fact that this man was a long-serving member of our great establishment does not excuse his betrayal of the Reich and the German race. Loyalty and trust is measured by one's dedication to the Führer and the willingness to obey unquestioningly. That Drechsler refused the Führer's direct order to stand down from his unlawfully claimed post should be reason enough for all to join in condemnation of his actions and purge his memory from the rolls of the NSDAP.\n\nNonetheless, it is clear that nobody expected treason from such a widely-known and well-respected man - an ex-Gauleiter and veteran of the Sturmabteilung, no less. The Führer recognises the reality of Drechsler's popularity and wishes to ameliorate your concerns by assuring each and every one of you that he acted only out of necessity, not for any petty political gain. The Führer is above such temptations and has only the greater good of the Reich in mind when acting in his capacity as father to the nation. It is his sincerest wish that harmony and concord should reign amongst the armed forces - a wish that we can all work together to fulfil now that the dark days of civil conflict are past.\n\nHeil Göring!"
 goering.ostland.drechsler.6.a:0 "Tugs at your heartstrings, doesn't it?"
 GGR_DST_operation_ostwind:0 "Unternehmen Ostwind"
 GGR_DST_operation_ostwind_desc:0 "While Drechsler's Ostland would appear to be a perfect candidate for peaceful reintegration into the Reich, considering his and the new Führers similar goals, has the Führer decided to invade Ostland and remove the new Reichskommissar from his post. Why this decision has been reached remains a mystery, but it certainly has made its impact in the Wehrmacht."
 GGR_DST_operation_ostwind2:0 "Unternehmen Ostwind"
 GGR_DST_operation_ostwind2_desc:0 "While Drechsler's Ostland would appear to be a perfect candidate for peaceful reintegration into the Reich, considering his and the new Führers similar goals, has the Führer decided to invade Ostland and remove the new Reichskommissar from his post. Why this decision has been reached remains a mystery, but it certainly has made its impact in the Wehrmacht."
 Goering_ostland_category_drechsler:0 "Unternehmen Ostwind"
 Goering_ostland_category_drechsler_desc:0 "The chaos in Ostland seems to have subsided and as luck would have it our man Otto-Heinrich Drechsler has come out on top. This has caused a great deal of celebration in the Wehrmacht and indeed it does seem as if Ostland will rejoin the Reich sooner than expected. Still, Drechsler is the militarists' man, not necessarily the Führer's. Perhaps it would be better to incur the wrath of Schörner today in order to deprive him of a pawn in the future..."
 GGR_replace_their_officers_tooltip:0 "§YDrechslers army will be loyal to only us.§!\n"
 GGR_a_safe_ostland_tooltip:0 "§YIts time to put the rebels out of their misery.§!\n"
 GGR_alter_the_deal_tooltip:0 "§YWe will launch a coup in Ostland!§!\n"
 GGR_arm_the_loyalists_tooltip:0 "§YSeveral volunteer divisions will form.§!\n"
 GGR_looking_to_the_future_tooltip:0 "§YIt's time to end the little dance with Drechsler, it's time to make him Reichskommissar once again!§!\n"
 GGR_the_eastern_nightmare:0 "Unternehmen Ostwind"
 GGR_the_eastern_nightmare_desc:0 "The Jewish Question continues to haunt the Aryan race. The late Reichskommissar Hinrich Lohse proved incapable of dealing with the Jewish scum scurrying through the underbelly of Ostland, those terrorists plotting against the Reich and its people for the last twenty years.\n\nWith the Fatherland in flames, Abba Kovner's UPO have finally made their move. Villages were burned and pillaged while German men and women were slaughtered by Ostland's new tyrants. Now it is time for the Führer to deliver our countrymen from this living nightmare, and solve the Jewish Question once and for all."
 GGR_make_it_stop:0 "Make it Stop"
 GGR_make_it_stop_desc:0 "The UPO's disgusting crimes have gone beyond the scope of 'war'. Men, women and children alike have been butchered, from subhuman collaborators to prosperous German families. We shall test the faith of these so-called 'Chosen People' by sending the Wehrmacht to crush them into dust. The last vestiges of European Jewry will be punished for their crimes against the Aryan race, no matter the cost."
 GGR_recover_this_mess:0 "Recover this Mess"
 GGR_recover_this_mess_desc:0 "Once again the invincible Wehrmacht has protected German land from the Jewish Plague and earned our people's faith. However, the rise of the UPO has shown that a Reichskommissariat administration will always collapse into incompetence and corruption.\n\nOstland must therefore be annexed into the Reich and placed under direct rule from Germania. Once the mess is cleared up, Ostland will be a prosperous living space for all German people to live in comfort and safety, without fear of partisans or tyrants."
 goering.ostland.kovner.1.t:0 "Regarding the state of the UPO occupation in Ostland"
 goering.ostland.kovner.1.d:0 "Mein Führer,\n\nReports coming in from the remaining personnel on the ground, as well as air recon and signals intelligence suggest that the UPO has taken almost complete control of the area.\n\nHowever no signs or effort to construct a lasting state structure have so far been detected, despite the presence of Estonian, Latvian and Lithuanian separatist elements within the organization.\n\nOur sources instead indicate a continuous wave of execution, lynchings and general reprisal against the germanic settler population and the supporters, native or otherwise of the other factions during the Civil War. Furthermore evidence suggests a conversion of the industrial base to both shipping equipment and equipment geared towards partisan warfare.\n\nFurther reprisals and massacres are expected and called for in the few pamphlets distributed. Thus direct and swift action is recommended\n\nHeil, Göring"
 goering.ostland.kovner.1.a:0 "Auge für Auge, Zahn für Zahn"
 GGR_eastern_nightmare: "The Eastern Nightmare"
 Goering_ostland_category_kovner:0 "Unternehmen Ostwind"
 Goering_ostland_category_kovner_desc:0 "The worst has come to past in Ostland. Abba Kovner, the madman who leads the United Partisan Organization. Even as we hurry to plan for an invasion he works to slaughter all Germans within his reach. We must stamp out this madness before it claims our people in the Ostland!"
 GGR_a_tin_pot_for_broken_men:0 "Unternehmen Ostwind"
 GGR_a_tin_pot_for_broken_men_desc:0 "As the metropolitan Reich collapsed into war, so too did Ostland. Once the model Reichskommissarriat, with a seemingly considerable level of stability compared to the other colonial administrations, the façade fell apart after Reichskommissar Lohse's death and our reports tell us the following war had at least six factions.\n\nOur government was dismayed to hear that a native collaborator, Michel Vituska, had defeated the German contenders to become ruler of Ostland. After victory in the German Civil War, we prepared for war in the east; but Vituska shocked our diplomats when he came to them with an offer of fealty to the Reich. Many believe that in times like these, allies are the most valuable resource, and that we should not risk devastating Ostland with war. But Vituska is not German. How can we possibly create a Reich to last a thousand years if even our colonies are run by slavs?"
 GGR_an_unlikely_proposal:0 "An Unlikely Proposal"
 GGR_an_unlikely_proposal_desc:0 "The world has not been the same since the death of Führer Hitler. Germany is not what it once was, and we must accept that. Though war makes us great, we should ensure that our wars are fought against those who would defy our rule, not those who wish to serve. Although Vituska may not be German, he may well be useful to us, and though it may anger the military, the central administration is set in its decision - we will take Vituska's offer of fealty. Since we have chosen to trust him, we must now keep an eye on our puppet; if he fails to know his place in the Reich then we must ensure that the noose is already around his neck, and all it needs is the hangman's push to finish him off."
 GGR_we_arent_idiots:0 "We Aren't Idiots"
 GGR_we_arent_idiots_desc:0 "Surely Vituska's proposal is a trap. There is no way that he seriously believes the Reich will accept an untermenschen despot amongst its most powerful administrators; if he does truly believe we would accept his offer, then he is clearly insane and unfit to run any administration at all.\n\nOstland's industry lies destroyed in the wake of civil war; the native resistances that followed the butcher Kovner are scattered in the wake of their defeat. Few wish to support Vituska. Fewer still wish to fight for him. An easy conquest for the Reich!"
 GGR_the_switcheroo:0 "Bait And Switch"
 GGR_the_switcheroo_desc:0 "Whilst the military would rather be razing Ostland to the ground than working with Vituska, they are certainly willing to assist with undermining his authority and ensuring that he remains a loyal puppet. Their latest proposal involves a switch of military intelligence between our administration and Vituska's. Of course, the information we give to Vituska will be far less useful to him than the information he gives to us, and once the trade has happened, we will ensure that we exploit our knowledge of his army to the fullest extent. If Vituska should ever even consider courting a foreign power then we will release the military upon him, and they will dig their claws into all his weak points."
 GGR_return_germans_to_the_administration:0 "A Proxy Administration"
 GGR_return_germans_to_the_administration_desc:0 "Vituska's government is a mess. It is mostly made up of natives who rejected Kovner's vile cause, preferring the promises of stability and peace offered by Vituska; but there are Germans in the cabinet, primarily colonists who believe the current model is simply unsustainable. This will not do. Even the liberal and weak Italians do not allow their administrations to be lined with their colonial subjects. We will demand that Vituska removes at least a quarter of his native allies and replaces them with Germans; Germans that are not loyal to any other notion than the rule of the Reich! We have him utterly pinned by our military now, and there is no way he can defy us as we sweep away the last vestiges of true power he holds."
 GGR_a_surely_loyal_pet:0 "A Surely Loyal Pet"
 GGR_a_surely_loyal_pet_desc:0 "Reichsprotektor Vituska. The first non-German colonial administrator. A stain on the Reich in the eyes of some, a great boon for the colonies in the eyes of others. Today Führer Göring decided to take the final step in assimilating Vituska's government, naming the honorary aryan Reichsprotektor of Ostland, and restructuring his administration to better resemble the other Reichskommissariats. Many thought Vituska would free Ostland whilst abstaining from Kovner's brutality. Today they have been proven wrong as Vituska's government has very little differences to that of Heinrich Lohse, the first leader of Ostland. The militarists despise keeping Vituska as a pet, but in the eyes of most of the German government the truth is clear. There is no escape for Vituska now, and if he ever shows signs of disloyalty or ambition above his place, then the noose is already tight around his neck."
 GGR_alright_enough_jokes:0 "Enough Jokes"
 GGR_alright_enough_jokes_desc:0 "Vituska is a fool. How could he surrender his power so easily? Why would he let us strip every single defense he had? These slavs are truly as stupid as they say. He is our puppet, and now the strings will be cut. We will invade Ostland, though it will be more like a coup, with Vituska's armies and defenses utterly worthless against our raw military power. The smart men in his government will turn instantly; the foolish will be hunted down and shot. There will be no support, no friends, no winged hussars to protect the Belarussian despot! A rapid march east will show any untermenschen who thinks that they are worthy of the Reich that they are but insects to be crushed beneath the Aryan boot!"
 GGR_contact_werewolf:0 "Contact The Werewolves"
 GGR_contact_werewolf_desc:0 "It seems, though he claims absolute power, Vituska is struggling to control the territory he now rules over; we have confirmed reports that there are still German fighters in the country outside the cities. Though some Germans foolishly collaborate with Vituska's government, many more fight on in the countryside, waiting for our orders to strike. We will contact them and use them to our utmost advantage during our operations, attacking Vituska's forces where they least expect it. We will surround our enemy, and when we find those who have collaborated, we will ensure they shall never betray their country again!"
 GGR_pull_out_the_carpet:0 "Pull Out The Carpet"
 GGR_pull_out_the_carpet_desc:0 "A despot builds a house of cards based on lies. All it takes is a wind of the truth to send the whole precarious structure tumbling down. Vituska's administration is lined with those who want nothing more than power, most of them Belarussians but some of them German. These men fear the Reich's might, because they know they will lose their power - and their lives - if we turn upon them. If we were to tell them bluntly that working with Vituska will result in their eventual capture and execution, they will scatter from the mad despot. They have foolishly supported Vituska because they believe he can win our support, so it's time to break the truth to them; Vituska is a traitor, and Germany does not deal lightly with traitors!"
 GGR_kick_in_the_door:0 "Kick In The Door"
 GGR_kick_in_the_door_desc:0 "The time has come for war in Ostland once more. Some will say that we are barging through the door of Ostland, but the truth is, there is no door to barge through; Vituska is beyond weak, with flimsy support from craven who want nothing but power and connections and our armies will tear through his 'nation' as if it were wet paper. Unlike the war in which Vituska rose to power, this will be as decisive and swift as our invasion of the Bolsheviks in 1941! The German populace of Ostland longs to be liberated from Vituska's shackles. Our partisans wait in the shadows, our tanks upon the borders, and our people wait in the city streets for victory! Let Vituska dine tonight, upon German food, in a German building, with German guests, in a new German city, for tomorrow his reign of thievery from the Germanic people will be over!"
 GGR_combing_the_ashes:0 "Combing The Ashes"
 goering.ostland.vituska.1.t:0 "Vituska's Offer"
 goering.ostland.vituska.1.d:0 "The despot of Ostland. The aspiring German. An unknown quantity through and through, Michel Vituska is not a man we ever wanted to deal with. But the reality is that he rules Ostland, and instead of simply agitating for a war, he has completely shocked our diplomats by coming cap in hand to the Reich offering to be our vassal.\n\nThe nerve! An untermenschen under the Reich? That would be a stain that cannot be wiped from our nation! The reaction from the hardcore militarists are one and the same. We cannot trust him, and the only way we should be even considering dealing with Vituska is with a bullet! With the new focus of the Reich being conquest to make us great again, it seems as though this would be in keeping with the policy we promised Germany.\n\nBut another band of less hardline officers has suggested the unthinkable; accept the proposal, undermine Vituska's authority, then eventually integrate Ostland again. While this seems a wild breach of the militarist belief that won us the civil war, there is an element of reason in their plan; we can spare Ostland from a second wave of destruction that would no doubt leave the colony far behind the rest of the Reich in industrial strength and Germanisation.\n\nThe final decision rests on the shoulders of the Führer. Will we take Vituska's offer, or is war the only way of dealing with such arrogance?"
 goering.ostland.vituska.1.a:0 "War is a solution for enemies, not allies."
 goering.ostland.vituska.1.b:0 "Tell Vituska to prepare his defences."
 goering.ostland.vituska.2.t:0 "A Fair Exchange"
 goering.ostland.vituska.2.desc:0 "With our administration now set upon befriending Vituska, we are now planning an exchange of military data. Of course, this exchange will be far more useful for us than for Vituska, and his army is as much of an unknown quantity as he is so any information on their weaknesses will bevital for keeping him trustworthy.\n\nIt may seem counterintuitive to undermine the militarists, the Führer's closest allies and his backers in the civil war. But Herr Schörner is beginning to believe he holds the keys to the Reich. If we were to reduce his officers to mere diplomats to Vituska's regime, it would reduce his power in the metropole and send a message that the Führer still holds the reins. Schörner himself does not seem shaken by rumours of this proposal; perhaps he has finally learned his place!\n\nAlternatively, we could simply send neutral officers to take part in the exchange. Vituska would possibly hand over better information if this were the case, as it certainly helps to negotiate with men who aren't openly calling for your blood; but Vituska is utterly unpredictable, so who can say what he truly wants. This would leave more power in the hands of the militarists, but isn't that what we fought for?"
 goering.ostland.vituska.2.a:0 "Send Schörner's men."
 goering.ostland.vituska.2.b:0 "Send neutral officers."
 goering.ostland.vituska.3.t:0 "Cleaning the Countryside"
 goering.ostland.vituska.3.d:0 "Since the Ostland war, the eastern Reich has been chaos. Despite Vituska's victory there is no true peace outside the large cities, and partisans still stalk the countryside looking for unprepared, defenceless German families. This situation cannot continue.\n\nWe may not trust Vituska entirely, but he is working with us now. Ostland is his realm, and so he is the man who must protect it. If we sent his desperately under equipped forces weapons then we may be able to achieve true lasting stability in Ostland and root out the partisans once and for all.\n\nOf course, it isn't that simple. If we were to send Vituska as many arms as we can spare, his forces would likely be more effective and could even defend themselves against threats from Moskowien; it would also help build Vituska's trust for us. However, this is putting our arms in the hands of a dangerously unpredictable man, and perhaps it would be best if we only send enough arms to put down the partisan menace, not enough to defy our will."
 goering.ostland.vituska.3.a:0 "Send as many arms as we can spare!"
 goering.ostland.vituska.3.b:0 "Only send enough to crush the partisans."
 goering.ostland.vituska.4.t:0 "An Extension to the Exchange?"
 goering.ostland.vituska.4.desc:0 "So far, out plan to document Vituska's military has been a resounding success. The officers in Ostland have been able to expose many of his military's weaknesses to us, and they are certain that he will be able to gain little leverage with the intelligence we have disclosed. Should he ever turn against us, there is no doubt we can put him down. Along with undermining Vituska, the exchange has also been successful in cutting down militarist power, with Schörner's hardline influence notably diminished.\n\nDespite the success of our plan in undermining them both, neither Schörner nor Vituska seem to see through our plot. In fact, they are both enthusiastic about continuing the exchange, and Vituska has sent a request to keep Schörner's officers remaining in Ostland longer to supervise a new training program. This arrangement benefits us the most; but the wholehearted embracing of our plan by the people it should impact the worst has aroused suspicion amongst a few in the government."
 goering.ostland.vituska.4.a:0 "Accept Vituska's request."
 goering.ostland.vituska.4.b:0 "Recall the officers, this is a trap!"
 goering.ostland.vituska.5.t:0 "The Exchange Ends"
 goering.ostland.vituska.5.d:0 "Our plan has been a success. Though we have not gained the crucial leverage over Vituska we had hoped for, our officers were able to find out some of the weaknesses of his army which will surely be beneficial to our cause should he ever turn against his masters. The trade has also been mutually beneficial on the surface, with each of our armies now better prepared to fight together against outside threats.\n\nOur officers are returning home right now. Despite the fact we appeased them by sending neutral officers, Schörner's militarists are protesting the recall and stating that they could've retrieved more vital information and made Vituska even more vulnerable. It seems no matter what we do, they're going to protest. Perhaps it is time to stop feeding Schörner's beast, and instead start defying it?"
 goering.ostland.vituska.5.a:0 "A success for the Reich."
 goering.ostland.vituska.6.t:0 "A Play in Ostland!"
 goering.ostland.vituska.6.d:0 "It is a foolish thing to give opportunity to a man you do not trust. Nobody trusted Schörner, but we gave him opportunity anyway. Perhaps we didn't see how he could possibly manifest an opportunity out of the small amount more influence we gave him; perhaps we even thought it would cut some heads from the hydra. Whatever we thought, we were wrong. Today Schörner's officers launched a coup in Ostland, attempting to seize power from Vituska and hand it over to the hardline militarists.\n\nPerhaps it was fortunate for us that Vituska was already a few steps ahead. He was able to put down the coup with remarkable efficiency, and now all the officers we sent are dead. Of course, Schörner quickly went to cover up the coup failure, so we have little information about the planning of the coup; but this has weakened him severely, despite also showing the flaws in the intelligence of the central government."
 goering.ostland.vituska.6.a:0 "A victory for the Belarussian."
 goering.ostland.vituska.7.t:0 "Vituska Shows Off"
 goering.ostland.vituska.7.desc:0 "Vituska finally arrived for a meeting in the Council. His goals were beyond everyone's understanding, so they just let him sit in his place. When the meeting began, Vituska suggested to the people who were here today the following things, but only at the very end of the meeting, when no one even looked at first, a proposal on how it is necessary to reduce the power given to them, hitting on the very power of the militarists, who spread like a plague. Only after signing this decree, people realized what they had done. They fell into the cunning of Vituska's genius, which proved to be superior and invincible."
 goering.ostland.vituska.7.a:0 "You are a useful one."
 Goering_ostland_category_vituska:0 "Unternehmen Ostwind"
 Goering_ostland_category_vituska_desc:0 "Michał Vituška is certainly a strange case of all the contenders who fought in Ostland. While he was a seemingly loyal collaborator for decades, it remains true that he is not an Aryan and he fought against our people in Ostland. We would be best served by crushing such treason with swift brutality. On the other hand, a man willing to collaborate before might do so again..."
 BLR_returning_germans:0 "Returning Germans"
 GGR_combing_the_ashes_tooltip:0 "§YWe will finish the proper integration of Ostland into the greater German Reich.\nHeil Göring!\n§!"
 GGR_vituska_ally:0 "§YDue to our military aid to Vituska he is more than able to keep the Schörnerite officers at bay, to our benefit.§!\n"
 GGR_more_information:0 "§MNow that Vituska has shown to be competent we can properly see what kind of effect his continued support has.§!\n"
 GGR_the_switcheroo_tooltip:0 "§YSwitch military intelligence.§!\n"
 GGR_return_germans_to_the_administration_tooltip:0 "§YReturn germans to Ostland.§!\n"
 GGR_a_most_convenient_foe:0 "Unternehmen Ostwind"
 GGR_a_most_convenient_foe_desc:0 "To the horror of those living there, and to the delight of the Wehrmacht, the traitorous SS under Friedrich Jeckeln have defeated all opposition in Ostland and now effectively rule the colonial state. Terror now reigns and the black flag flies over every village, with even the majority of the Aryan populace living in abject fear. Thankfully, this situation is not without its benefits for Göring; the militarists in his cabinet have been insisting on a full-scale invasion of Ostland to restore order ever since the end of the civil war. There is now little reason to deny them their wish; Göring and Schörner are, for once, in complete agreement on the solution to this usurpation of power by Himmler's toadies."
 GGR_contact_the_loyalists:0 "Contact the Loyalists"
 GGR_contact_the_loyalists_desc:0 "Though Schörner's man in Ostland, Drechsler, was defeated and killed in Ostland's civil war, many of his supporters - by extension, supporters of Göring - have survived, taking refuge in the woods and swamplands of the frontier. Given the reportedly constant harassment of the SS by military-style raids and ambushes, they must still be heavily armed and well-organised. We should work quickly to establish contact with these brave men of the Reich before the SS can begin to organise a more decisive response. Once in contact with OKW, their operations can be coordinated with our own efforts, making our invasion that much easier."
 GGR_incite_the_partisans:0 "Incite the Partisans"
 GGR_incite_the_partisans_desc:0 "Nobody likes the SS. This fact makes finding friends amongst our former foes a lot easier; better the devil you know, after all. Our agents in Ostland report that their efforts to make contact with Bormannite, liberal and native partisans have met with success, as all recognise the greater foe. Some may yet come to appreciate National Socialism once its value is proven in this conflict, but regardless of how that pans out the Führer will not turn down help against the SS, no matter the source. No doubt some of these groups will have to be purged anyway once the SS are defeated, but for now we shall continue riling up as many Ostlanders as we can to put the hurt on Jeckeln."
 GGR_no_fly_zone:0 "No Fly Zone"
 GGR_no_fly_zone_desc:0 "The SS in Ostland possess barely any military-grade aircraft and most of the anti-aircraft weapons remain in the hands of our loyalists. Establishing a no-fly zone over Ostland will be simplicity itself with no serious opposition present. The Luftwaffe is the most effective air force in history, having crushed all opposition in the Second World War with impunity, and that was back when they were dealing with opponents who could actually fight back! With a few good strafing runs, any aircraft available to the SS can be destroyed on the ground, giving our bombers and CAS all the room they need to flatten every single building flying the black flag. Jeckeln will be able to do nothing save shout and curse at us as his bases and troop columns go up in smoke."
 GGR_complete_naval_blockade:0 "Complete Naval Blockade"
 GGR_complete_naval_blockade_desc:0 "Ostland has no navy to speak of and can, realistically, only receive supplies via the Baltic, which is entirely under our control. Just in case, however, every port and estuary in the colony will be completely hemmed in by a contingent of the Baltic Fleet. Patrol vessels will also be dispatched up rivers to provide reconnaissance support for our ground forces. Some have questioned the necessity of allocating naval resources to Fall Ostwind, given that we face no threats within the Baltic from either the SS or Burgundy. Those who ask such questions miss the point entirely: we must demonstrate to the SS that the Reich remains militarily capable in every field. Dealing with Jeckeln is only part of a greater battle against the Himmlerites."
 GGR_into_the_light:0 "Into the Light"
 GGR_into_the_light_desc:0 "The Black Sun has risen over Ostland, but it shall not endure. The Reichsadler's wings will spread the blinding light of true National Socialism and cast Himmlerism from the Reich's rightful lands. For all their fanaticism, the Ostland SS are few in number and Burgundy is unable to provide them with any assistance. With nothing to oppose us beyond their ragtag assembly of brainwashed fanatics, the Luftwaffe and Panzerkorps will run roughshod over their foes. Even the partisans could offer more resistance than these treasonous fools!"
 GGR_hunting_down_the_remnants:0 "Hunting down the Remnants"
 GGR_hunting_down_the_remnants_desc:0 "Ostland is secured and the local SS destroyed as a fighting force, but the military, bafflingly, remains unsatisfied. Despite the lack of evidence, Field Marshal Schörner insists that the SS has not been wholly defeated, but has instead scattered and melded into the populace. Even now, he alleges, they spread their poison amongst colonists and natives alike, preparing for a second strike to be launched as soon as Göring's back is turned. To this end, he has directed his forces in Ostland to systematically purge every single population center in pursuit of the SS. Collateral damage is inevitable, he says, but perhaps that's the price to pay for securing ourselves against Burgundian infiltration..."
 GGR_loyalty_tests:0 "Loyalty Tests"
 GGR_loyalty_tests_desc:0 "The SS is a forty-year-old institution and remains culturally influential in the Reich despite their effective expulsion from it following the West Russian War. Keeping an eye on people in the Reich proper to counteract this influence is relatively easy, but who knows how deep the corruption runs in Ostland, far from the watchful eyes of the Führer? The Wehrmacht is insistent that none of the officials in Ostland are above suspicion and demands the right to subject them to military justice. Knowing what the militarists' idea of 'justice' entails, this is tantamount to the Führer personally sentencing every official in Ostland to death, but the Wehrmacht will accept nothing less than full judicial authority over the colony."
 GGR_mass_incarcerations:0 "Mass Incarcerations"
 GGR_mass_incarcerations_desc:0 "Every minute that passes by gives the SS more time to grow their numbers and influence! At least, that's what the Wehrmacht claims. So far, their efforts to weed out any SS from amongst the civilian population have met with no success. They are not the Gestapo, after all. With this in mind, they have devised a more general solution wider in scope: just arrest everyone. The natives obviously need to be removed anyway, so they can be left for the troops to mop up, but the Germans will need thorough processing, which will take a long time - longer than our already-overstretched food supplies can manage..."
 GGR_locate_the_cells:0 "Locate the Cells"
 GGR_locate_the_cells_desc:0 "The Wehrmacht has turned to the tried-and-true tactic of chasing up cells of SS rather than individuals. This would be great in the right scenario, but so far their 'cells' look rather like ordinary villages, with women and children being part of them too apparently. If there are indeed cells of SS members amongst them, then it's probably working, but the amount of collateral damage from this approach has been enormous so far and increases by the day. Reich officials are unable to keep up with the Wehrmacht's roving hunter-killer units, leaving no chance for oversight or proper investigation before the officers pass their judgement on a village."
 GGR_counter_insurgency_tactics:0 "Countre Insurgency Tactics"
 GGR_counter_insurgency_tactics_desc:0 "The time that our troops have spent rooting out the SS in Ostland has apparently proven quite valuable for the Wehrmacht's tacticians. Field Marshal Schörner has proudly stated to the Führer that the conscripts have learned many valuable lessons in how to deal with their enemies, which will have many applications during the Reich's conquests to come. Every 'SS cell' destroyed gives more opportunities to harden our green troops to the realities and necessities of war, weeding out weakness and eroding civilian moral norms. Good practice, he says, for the next war."
 GGR_a_pure_ostland:0 "A Pure Ostland"
 GGR_a_pure_ostland_desc:0 "The Wehrmacht has, at long last, proclaimed Ostland to be free of all SS infiltrators and 'werewolf' guerrillas. The proof, photographed for posterity and shown off proudly to state media reporters, lies in the hundreds of mass graves and blackened ruins that litter the colony. The cleansing was deep and absolute - it had to be. Himmler's fanatics mean to doom us all and would go to any lengths to destroy the Reich, so we had to go to equal lengths to ensure that their evil was completely expunged! Ostland will take time to recover, but it shouldn't be too difficult to scrounge up a few million fresh colonists once the Reich is more stable."
 GGR_rebuilding_ostland:0 "Rebuilding Ostland"
 GGR_rebuilding_ostland_desc:0 "Both Heydrich and Jeckeln, the main men of the SS within the Reich itself, have been dealt with. The notion that the SS presence in Ostland is now anything more than a few scattered individuals is patently absurd. The Führer, wise as ever, has overruled his advisors and declared Ostland to be safe enough that no extreme measures are necessary for its defence. Instead, resources and manpower shall be directed towards rebuilding the colony's devastated infrastructure. The Wehrmacht will just have to wait until the next war for another good fight."
 GGR_rebuild_the_factories:0 "Rebuild the Factories"
 GGR_rebuild_the_factories_desc:0 "Ostland didn't have much industry to begin with, but the civil war managed to find and destroy what little there was anyway. Industry is the bedrock of the Reich's economy and the colony will never be able to recover if it remains a land of ruins and farmsteads. The Wehrmacht's engineer divisions will be put to work alongside imported labor to salvage what they can and restore damaged factories and mines to working condition. This goes beyond merely providing jobs in the future; more investment opportunities will help to build confidence in Ostland as a viable colony, bolstering it further with private capital."
 GGR_an_industrious_population:0 "And Industrious Population"
 GGR_an_industrious_population_desc:0 "Many Ostlanders were reduced to landless refugees by the civil war. Partisans and the SS were ruthless in their use of scorched earth tactics, razing farmsteads and poisoning the soil in addition to demolishing whatever industry and housing they could find. It will not be cheap, but the best solution, rather than leaving them to fend for themselves, is to directly intervene. Providing jobs and housing will encourage the refugees to return home and give them the opportunity to begin rebuilding their lives. Perhaps they will never return to that agrarian idyll from prior to the war, but Ostland can still be prosperous again."
 GGR_rebuild_the_harbours:0 "Rebuild the Harbours"
 GGR_rebuild_the_harbours_desc:0 "Ostland has only a few major harbours, with the largest being the great port of Riga. These gateways to the Baltic provide much of what the colony needs: steel from Scandinavia, coal from the Rhineland and foodstuffs from France, among other things. Being such important lifelines for the local economy, they were among the first targets to be hit in the war by those who wished to see the colony fail. Getting them up and operational again is a surefire way to speed up Ostland's recovery."
 GGR_establish_new_airfields:0 "Establish new Airfields"
 GGR_establish_new_airfields_desc:0 "Unfortunately, one of the ways in which a no-fly zone is enforced according to standard Luftwaffe practice is the rapid and systematic bombing of anything that could serve as an airfield. Ostland had few airfields to begin with, so the cost of rebuilding those will not be high. However, these few airfields won't be nearly enough to accommodate the number of aircraft, civilian and military, to establish a modern economy and Luftwaffe garrison in Ostland. Again, creating jobs is one of the main goals here, but it will also help to diversify the economy and open the country up to airborne trade, which offers opportunities not available by land or sea."
 GGR_a_rebuilt_ostland:0 "A Rebuilt Ostland"
 GGR_a_rebuilt_ostland_desc:0 "Ostland has been fully restored to its rightful place as the Reich's most successful colony. Normality is slowly returning as refugees trickle back over the border to try and rebuild their lives, there have been no reported partisan attacks recently and internal trade has started up again. The Führer can quite rightly boast that his policies have been a runaway success, but the Wehrmacht disagrees with that notion - in very imaginatively crass terms, one might add. Schörner is livid and almost frothing at the mouth in his insistence that the SS remains a threat to the colony and direct military action is necessary, but the recovery has been too successful and the opportunity for his measures to be enacted has passed. The Reich can only hope that his fury can be redirected - and soon."
 GGR_reintegrate_ostland:0 "Reintegrate Ostland"
 GGR_reintegrate_ostland_desc:0 "With Ostland fully under our control and the SS dealt with, the process of reintegration can begin. The colony is heavily Germanized and its status as a Reichskommissariat left it open to usurpation, so the Führer has decreed that it is to be directly integrated into the Greater German Reich as a province. This union would normally not happen so soon, but the Führer is confident that this step is necessary to ensure that Ostland recovers swiftly and enjoys the full benefits of being part of the Reich proper. There is little to lose politically from such a move, and the gratitude of the Ostlanders to gain. It just makes sense, really."
 goering.ostland.jeckeln.1.t:0 "Remer's Infiltration"
 goering.ostland.jeckeln.1.d:0 "Göring couldn't help but let out a sigh as he read the latest report on the new Ostland. While Germany had been busy tearing itself apart, the jackals in the SS had leapt onto the similarly stricken corpse of Ostland, and now a black tumor grew on the side of the Reich. Invasion was a no brainer- it had always been the plan to integrate Ostland into the Reich one day- but it pained Göring to need to waste German lives on a territory that was once an easy landgrab. He needed to make it easier- the less lives lost, the better.\n\nAn idea came to mind. Certainly not all Germans in Ostland were fans of Jeckeln's maniacal regime. After all, were they not just fighting him? They may not have much in common, but something that could generally unite Germans of all walks of life was their distaste for the SS. Certainly, Göring and his men could find some veterans brave enough to rally themselves for the return of order and the purge of the madness that the SS brought.\n\nThe idea crystallized in his head, and Göring smiled. Remer and his men would infiltrate the Ostland border, searching for militarist contacts. Once there, they would form their own units, ready to sew chaos behind enemy lines. These infiltrations would not only make the war a thousand times more manageable, but would shorten it drastically. Besides, Göring reasoned, even if the plan did not fully pan out, it would rid him of Remer for at least some time."
 goering.ostland.jeckeln.1.a:0 "The faster the war, the quicker it ends."
 goering.ostland.jeckeln.2.t:0 "Deadly Weapons!"
 goering.ostland.jeckeln.2.desc:0 "The outskirts of Riga were left reeling this morning by a massive explosion shortly after 9:00 AM, originating from the Bertram and Co. factory, a major local industrial business providing jobs to some 220 German workers. Shortly after the news broke in the morning papers, the Wehrmacht's press office released a statement confirming that two squads of Pioneers from the 44th Grenadier Division stormed the empty factory at approximately 5:00 AM with orders to carry out the demolition of the entire structure. The factory was, according to 'reliable sources', being used as a hideout for a large SS cell. More importantly, it allegedly produced weapons for the traitors, with the entire workforce being implicated by the Wehrmacht's informants. Accordingly, the Pioneer units placed demolition charges around the factory in the hours before the first workers arrived, only detonating them once a majority of the workforce was confirmed to be on the clock. An attempt to dig for survivors in the rubble was repelled by the timely arrival of a large Feldgendarmerie contingent, who sealed off the site and declared that more Pioneers would soon be arriving to apply further explosives in order to 'collapse any subterranean construction'.\n\n\"I don't understand,\" said a passing civilian when asked for comment. \"That place was a brick factory. There aren't even any armaments factories in the whole of Riga. I've worked in both kinds of factories and I can tell you that there's no confusing brick-making equipment for gunsmithing tools.\" Further comment was not possible, as the civilian was consequently seized and placed under arrest by a passing gendarme."
 goering.ostland.jeckeln.2.a:0 "You can throw a brick pretty hard."
 goering.ostland.jeckeln.3.t:0 "Country Bridges Falling Down"
 goering.ostland.jeckeln.3.desc:0 "\"Simas!\" came the call from down the muddy backwoods road. Simas turned and raised a hand in greeting to Dietrich Hassel, the colonist who had made his home in the game-rich woods far from Vilnius.\n\n\"Good morning, Dietrich,\" he replied in rustic, heavily-accented German. \"Your boy got back to you quickly, didn't he?\" Despite their differing cultures, Dietrich and his family had been accepted with relative warmth. So far out from the major centres of civilisation and its tracts of arable land, there had been little objection to a lone colonial family moving into an abandoned woodland home. Someone had to keep the deer in check, after all.\n\n\"He did.\" Dietrich motioned to the blasted tangle of steel and wood half-buried in the mud right in the middle of the road, where there had previously been a minor railway running through the forest. \"He couldn't say what it was you wanted me to see, but it certainly speaks for itself.\"\n\n\"Yes. I wondered, given your time in service, if you would know how this happened?\" There was a pause as the German scratched at the graying stubble on his chin and went rummaging through memories of 20 years prior. Given the thoroughly wrecked state of the rails and three-foot-deep crater, it could only have been done with military-grade demolition charges.\n\n\"Small but strong railbusting charges,\" he finally said. \"Only Pioneer units are equipped with those. The soldiers who passed through yesterday must have been scouting for vulnerable points in the railway like this crossing.\" With a sigh, he walked over and began picking up bits of planks littering the road. \"Come on, Simas. Let's get this as clear as we can so people can bring their trucks through. Hopefully those vandals won't be back to make the job any harder.\""
 goering.ostland.jeckeln.3.a:0 "Do any of the SS even know how to operate a train?"
 goering.ostland.jeckeln.4.t:0 "The Ostland Jobs Initiative"
 goering.ostland.jeckeln.4.d:0 "The Civil War and subsequent invasion of Ostland has uprooted the lives of many, leading the region into near-collapse. To help the process of rebuilding and reconstruction, and to provide the people with steady (if modest) wages, the German government has initiated a program dedicated to creating and assigning jobs. After all, it is our duty to clean up the mess left behind by the lunacy of Jeckeln and his dark acolytes."
 goering.ostland.jeckeln.4.a:0 "People of Ostland, get back to work!"
 goering.ostland.jeckeln.5.t:0 "The Civil Service Loyalty Test"
 goering.ostland.jeckeln.5.d:0 "The militarists have delivered a request to the Führer, one that he knows cannot be refused. They wish to fill the ranks of the Ostland civil service with militarist bureaucrats loyal to Schörner's Germania clique to ensure the region's absolute obedience. To ensure this transfer of power, while also punishing the existing civil service for their recent failures, strict loyalty tests will be introduced. These tests will, naturally, be impossible to pass, ensuring that the civil servants are thrown into prison to make way for the new breed of functionaries."
 goering.ostland.jeckeln.5.a:0 "It's not as if they don't deserve it..."
 goering.ostland.jeckeln.6.t:0 "Mass Arrests in Ostland"
 goering.ostland.jeckeln.6.d:0 "If Ostland falls back into the hands of the insane Schutzstaffel, all of our sacrifices in liberating the territory would have been for nothing. The last vestiges of the SS must be wiped out without a trace to deprive them of the opportunity to spread their poison. On the orders of the Führer, the triumphant Wehrmacht troops will march throughout Ostland and initiate a series of mass arrests. This procedure will naturally be indiscriminate, even messy, but we cannot afford to take any risks. All SS members and sympathizers will be detained and dealt with in due course."
 goering.ostland.jeckeln.6.a:0 "Round them up."
 goering.ostland.jeckeln.7.t:0 "Scorch the Fields"
 goering.ostland.jeckeln.7.desc:0 "Armin burst out the front door of his house, still struggling to get the heavy fur coat on over his pyjamas. A hundred metres or so from the house stood his grain silo - ablaze, with the flames stretching a dozen stories high. Milling around the front, silhouetted against the fire's radiance, were ten or so figures, all with similar helmeted outlines.\n\n\"Jesus, stop!\" Armin shouted, barely able to hear himself over the roaring inferno and the howling midnight wind that carried threatening sparks towards his home. \"Stop, dammit!\" There was no response. The soldiers continued whatever they were doing - whether they were chatting, laughing at the thought of some farmer's harvest going up in smoke or just silently observing the outcome of their grim objective, he could not tell.\n\nFinally reaching the squad, Armin reached out and grabbed at the sleeve of the closest grenadier, who jerked back and span around, raising his assault rifle. His eyes were shrouded in shadow by the pillar of flame, and its wicked light glimmered on the brass buttons of the other soldiers as they turned to look at Armin. He was panting and exhausted already, the strain of middle age and his recent cold making it difficult to inhale lungfuls of the frigid nighttime air. \"What... Christ, what have you done? My entire- I- Why the fuck would you do this?\" he screamed.\n\nThe grenadier sergeant raised a hand and snapped his fingers. The rifle pointed at Armin sounded a crack into the night, the 7.92mm round striking him in the heart. As the aging farmer toppled to the cold earth and took a final rattled breath, the shooter turned to his friends and smiled. \"Told you that would draw the black bastard out. Let's go check for his friends, shall we?\""
 goering.ostland.jeckeln.7.a:0 "But... I was a sailor..."
 goering.ostland.jeckeln.8.t:0 "Salt the Earth"
 goering.ostland.jeckeln.8.desc:0 "\"Chemical weapons?\" Göring almost yelled the question - almost, but not quite. Schörner's face was inscrutable, his jowls still as the rest of his face and his eyes hidden behind reflective orange sunglasses despite being indoors. \"You requisitioned and deployed chemical weapons without my authorization?\"\n\n\"Not chemical weapons, Hermann,\" the Field Marshal drawled. \"Defoliants. Chemicals to kill plants and sterilize farmland. They're for industrial use. I don't need permission to requisition civilian goods.\" Schörner reclined in the armchair opposite the Führer, blank-faced as any rank-and-file soldier on parade. \"Anyone who is... inconvenienced by their use should have evacuated the target area before we dropped the bombs.\"\n\nGöring felt a vein throbbing in his temple. \"Did you even issue a warning, Field Marshal?\" Schörner remained silent. \"God dammit, Schörner! This isn't Barbarossa or the Blitz; if you don't consult with me-\"\n\n\"We couldn't issue a warning. It might have given the SS time to move in and secure the crop.\" Schörner tilted his head slightly, the sunlight filtering in through the windows lighting up his sunglasses. \"I'm assured by our men in the field that this was a necessary act to deny the enemy access to food supplies. They are prodigious looters, as I'm sure you're aware.\" The Führer opened his mouth to speak, but hesitated for a moment before closing it and sinking back into his overburdened chair. \"The short-term cost will be worth it, my Führer.\""
 goering.ostland.jeckeln.8.a:0 "And what of future harvests?"
 goering.ostland.jeckeln.9.t:0 "Ostland's Integration"
 goering.ostland.jeckeln.9.d:0 "The devastation inflicted onto the population, economy and infrastructure of Ostland over the last few years rendered it pointless to integrate, lest the Reich desired to cripple itself. The Führer's order to initiate a large-scale government program dedicated to rebuilding the region has proven to be a success. According to the experts, Ostland is at last in an acceptable position to be integrated into the Reich. It has taken over two decades, but at last our borders shall expand."
 goering.ostland.jeckeln.9.a:0 "Lebensraum for the German Volk"
 Goering_ostland_category_jeckeln:0 "Unternehmen Ostwind"
 Goering_ostland_category_jeckeln_desc:0 "The SS have won in Ostland it seems, but Herr Jeckeln and his master in Burgundy will not have long to celebrate if we have any say. As far as we are concnerned, the SS, even formations outside of Germany, are part of a traitorous organization that is more loyal to the dead dog Heydrich and Himmler than to the Führer. We will not allow a redoubt of sedition to fester on our border!"
 GGR_little_stahlecker:0 "Little Stahlecker"
 GGR_little_stahlecker_desc:0 "Franz Walter Stahlecker, a dyed-in-the-wool conservative, has come out on top in the struggle for control of Ostland. Now that the Reich proper is whole again, Göring has turned his gaze east and found a much less complicated problem to deal with than he expected. Stahlecker is an avowed Bormannite, but his loyalty is to National Socialism rather than the man himself - though he was clearly an admirer of the bald bastard. Still, he might be amenable to working with Göring despite their political differences. Indeed, secretly, Göring is relieved to be dealing with a conservative rather than a militarist, as the latter would undoubtedly have been in Field Marshal Schörner's pocket. However, the military is itching for a fight, and Stahlecker looks enough like a traitor in their eyes that they will not hesitate to take Ostland by force, if they are so ordered."
 GGR_last_chances:0 "Last Chances"
 GGR_last_chances_desc:0 "Stahlecker has not shown any interest in conflict with Göring, despite their differences. True, he has ordered the garrison to the border, but who can blame a conservative for being cautious? Ostland is an integral part of the Reich and we will fight our own brothers for it if we must, but the Führer knows that a peaceful solution is possible and even preferable, despite the advice of his backers. Bringing further conflict to Ostland will surely only devastate it further and slow down colonisation; not to mention, the German people will surely be disquieted by the notion of yet another 'brother war'."
 GGR_no_second_chances:0 "No Second Chances"
 GGR_no_second_chances_desc:0 "Stahlecker's clique have a vision for Ostland that is, unfortunately, incompatible with our own. Negotiations are off the table and the three branches of the military have received orders to make ready for a full-scale conventional invasion. Ostland possesses a strong core of veterans, but lacks the numbers, equipment and industry to put up anything more than a brief - if brave - resistance. Field Marshal Schörner has already put forward a complete war plan for the invasion, apparently drawn up some time in advance. We can only hope that the German people will not object too strongly to another civil conflict."
 GGR_the_ostdeal:0 "The Ostdeal"
 GGR_the_ostdeal_desc:0 "Stahlecker's ideology is distinct enough from Göring's that clashes over the finer points of National Socialism are inevitable, but perhaps such minor problems can be smoothed over. What are personal differences in opinion compared to the integrity of the Greater German Reich? What truly matters in these trying times is the continued unity and brotherhood of all Germanic peoples, be they men of the Reich, Baltic Germans or colonials. For the sake of peace and friendship, the Führer will put aside his grievances and instead focus on establishing a functional, productive and professional relationship between the Reich and its somewhat heterodox colony."
 GGR_a_position_of_strength:0 "A Position of Strength"
 GGR_a_position_of_strength_desc:0 "The Führer is a magnanimous man, but wishes to make it clear to Stahlecker and his compatriots that ultimately Ostland is a mere colony, with the manpower and resources of a colony. The Reich itself, on the other hand, possesses the resources to start up a total war economy with the flick of a switch and an army numbering in the millions. Ostland's unique position will be respected, but Germany will not have terms dictated to it by a diminutive quasi-state with a fraction of its strength. We are the master, negotiating in good faith with our apprentice - they had best keep that in mind!"
 GGR_keep_the_calm:0 "Keep the Calm"
 GGR_keep_the_calm_desc:0 "The Führer is a man of action, but not rashness. He knows full well that taking Ostland militarily, with conscripts pitted against veterans, could be an exceptionally bloody extension of the German Civil War. That aside, the mere idea just seems so wasteful - Stahlecker is a very even-tempered man, far more loyal to the office of Führer than to himself. During the Second World War, he acted unquestioningly in his duty, never hesitating and maintaining that the sole duty of every good German was to obey the Führer. For him, there is no higher calling. Göring naturally wishes to extend to such a man the hand of friendship, not a clenched fist."
 GGR_tanks_on_the_border:0 "Tanks on the Border"
 GGR_tanks_on_the_border_desc:0 "Know what the Reich has rather a lot of that Ostland lacks? Besides manpower, food, coal, steel, industry and a multitude of other things? Tanks. We all know from Thermopylae and Operation Barbarossa that a small number of elite troops can defeat many times their own number. Stahlecker's troops are hardened veterans of their own civil war and might feel confident enough to face our own masses of relatively fresh conscripts, but panzers are another matter. No amount of courage or discipline can halt sixty tons of steel or shield infantry from their mighty guns. We don't intend to go in guns blazing, but perhaps a subtle reminder of our true strength, placed along the entire border, will remind them of the odds they would face in the event of war."
 GGR_our_airspace_not_yours:0 "Our Airspace not Yours"
 GGR_our_airspace_not_yours_desc:0 "The Reich's reach stretches high into the clouds, further than it ever did during the Second World War. The Luftwaffe, buoyed aloft by the personal patronage of the Führer, is equipped with the most advanced jet fighters, strategic bombers and helicopters in the world. With a word from Berlin, hundreds of aircraft could be scrambled to flatten everything taller than a stump in Ostland - just look at the state in which they have kept Russia and West Africa in for a decade! It would be child's play to unleash the same kind of destruction upon Stahlecker's domain. Perhaps a demonstration is in order? Routine exercises, carried out in far larger numbers than usual, might be the deterrent against rebellion necessary to keep the Ostlanders in line."
 GGR_a_final_proposal:0 "A Final Proposal"
 GGR_a_final_proposal_desc:0 "The Führer has been very reasonable up to this point. If he so wished it, Ostland could be crushed in mere hours. It would be easier than walking into one's own backyard. Stahlecker's forces are utterly outmatched numerically and technologically and he knows it - any resistance offered at this point would be suicidally brave, but also futile and would cost thousands of German lives. The Führer has no wish for further bloodshed, but should Stahlecker refuse re-integration, he is more than ready to harden his heart and unleash the full might of the Reich's armed forces against the little Reichskommissariat and its leader. Choose well, Little Stahlecker."
 GGR_negotiations_fail:0 "Negotiations Fail"
 GGR_negotiations_fail_desc:0 "So much for diplomacy. Stahlecker has refused the Führer's fair and just demands for reintegration and put his forces on high alert. There have already been exchanges of fire on the border and anti-aircraft batteries are opening up on any aircraft in range. Our troops have yet to advance into Ostland, but the Führer now has no choice but to acquiesce to the Wehrmacht's request for an all-out offensive to crush the breakaway state. Ostland, it seems, will become a battleground once more."
 GGR_negotiations_succeed:0 "Negotiations Succeed"
 GGR_negotiations_succeed_desc:0 "There were sighs of relief throughout the nation as the Führer announced on a live TV broadcast that the Reichskommissar of Ostland has formally taken an oath of office and accepted the Führer's absolute authority over him. The Ostland garrison has pulled back from the border and returned to its usual duties, while a small number of Wehrmacht troops have entered the colony to help beef up their numbers - and keep an eye on them. Schörner is fuming over this diplomatic success, but thousands of German lives have been saved and the Führer's reputation for thoughtless militarism has been tempered considerably."
 GGR_a_stab_in_the_back:0 "A Stab in the Back"
 GGR_a_stab_in_the_back_desc:0 "Stahlecker, despite his apparently good intentions, remained a Bormannite through and through. We had already purged most of his ilk within the Reich - who was to say he wouldn't prove just as untrustworthy as they were? Yet, his caution and loyalty to National Socialism proved useful in another way; in order to prevent any difficulties with the annexation of Ostland, we invited him to a meeting on neutral ground in order to eliminate him without going through the garrison first. His principles of loyalty alone were enough to break his reservations and lure him into such a trap."
 GGR_friends_and_family_all:0 "Friends and Family and All"
 GGR_friends_and_family_all_desc:0 "The German Civil War was horrifically bloody. Everybody knows someone who was killed, be they civilian or soldier. Wives and daughters, fathers and sons, brothers and sisters... why bring that kind of suffering to Ostland? Hasn't our beloved colony suffered enough at the hands of the SS and partisans? Are the countless thousands buried in the once-virgin fields of the east not enough of a toll for such a small nation to pay? Help us, Stahlecker - help your Führer. Help him rebuild the Reich as it should be, sparing its children from the senseless suffering of yet another war within its borders."
 GGR_the_brother_state:0 "The Brother State"
 GGR_the_brother_state_desc:0 "What else could Ostland be to the Reich besides its little brother? Is it not the Reich in miniature, striving to emulate its older sibling? Even now, Ostland struggles, as the Reich once did, to assert the supremacy of its Aryan people over the subhumans who seek to subvert and destroy it from within. War would only give our foes a chance to regroup and strike at us again, driving a wedge into the bonds that only sibling nations can share. Stand with us as family, little brothers, and we can begin to rebuild - together. Already there are trucks, trains and ships standing by to deliver all that the Reich can offer, with more to come. We will always have your back - just take our hand and stand with us once again. We ask nothing more."
 GGR_a_united_reich:0 "A United Reich"
 GGR_a_united_reich_desc:0 "Ostland is stable, its garrison is at ease and Stahlecker has acted in good faith so far, accepting aid and the Führer's friendly overtures. We are pleased to see that efforts at diplomacy have borne fruit, but the final test comes now. Ostland is, at the end of the day, an integral part of the Reich and the political reality should reflect that fact; its period of de facto political independence must come to an end. All that is required for this to occur - for the Baltic Germans and Ost-Germans to be true citizens of the Reich again - is for Stahlecker to publicly affirm his allegiance to the Reich and its Führer."
 GGR_prepare_the_men:0 "Prepare the Men"
 GGR_prepare_the_men_desc:0 "The Wehrmacht loyalists proved themselves capable fighters during the civil war, but their casualties were high and the vast majority of our army is now fresh conscripts with only basic training and no sense of camaraderie. Being thrown into a battle against their fellow Germans is the last thing any of them want; combined with their lack of experience, this will likely lead to a generally poor performance. However, steps can be taken to alleviate the expected problems; anti-partisan training, hardline military discipline and the distribution of National Socialist Leadership Officers among the ranks should all help to some degree."
 GGR_eastern_blitz:0 "Eastern Blitz"
 GGR_eastern_blitz_desc:0 "Ostland is the heart of our colonial empire and has remained in hostile control for long enough. The military has prepared as best they can and is raring to cut their teeth on whatever opponents they can find, German or not. Nothing Ostland can muster is enough to save them from the combined might of the Reich's armed forces or the wrath of its betrayed Führer. The disloyal men of the east will be little more than a speed bump for our forces as they set forth to reclaim the Reich's rightful lands!"
 GGR_brothers_no_more:0 "Brothers no More"
 GGR_brothers_no_more_desc:0 "Stahlecker never made a secret of his conservatism and anti-militarist sentiments. These facts alone make his clique an easy target for our propaganda. What worked against Bormann should work just as well for his pupils; 'coward', 'traitor' and 'pacifist' are all common buzzwords in state media but remain as effective as ever. With Bormannism utterly crushed within the Reich, nobody will stand up to defend their National Socialist credentials or their supposed loyalty to us. By the time we walk over the border, all of Germany should be cheering us on whether they want to or not."
 OST.59.t:0 "Göring Invites Us to Talk"
 OST.59.desc:0 "TO PROVISIONAL REICHSKOMMISSAR FRANZ WALTER STAHLECKER:\n\nIn the spirit of Germanic amity, the Führer wishes to extend his congratulations to you and your men for successfully subduing the recent civil unrest within Reichskommissariat Ostland. Your swift defeat of treasonous and secessionist elements who sought to destroy our most beloved colony is worthy of the highest praise.\n\nThe Führer now invites you, in that same spirit, to return our colony to its rightful place in the Greater German Reich. Ostland is an integral part of its territory, and proof of the value of Aryan brotherhood and solidarity in the face of a hostile world. Our colonial brothers yearn to be reunited with their family and we urge you to make haste, that this dream of peace might be realised.\n\nAs for yourself, the Führer recognises your excellent past conduct, your undying loyalty to National Socialism and your heroic resolve in securing Ostland for the Reich. You stayed strong and loyal, even when forced into conflict with your misguided fellow Aryans. More than anything, your worthiness to govern Reichskommissariat Ostland is unquestionable. To this end, the Führer formally offers you the post of Reichskommissar of Ostland, for life or until retirement. This is a great responsibility, but he has faith in your leadership capabilities and would sooner have you by his side than behind enemy lines.\n\nHeil Göring!"
 OST.59.a:0 "His words seem sincere. We should work with the new Führer."
 OST.59.b:0 "Göring is a tool of the militarists! He will lead us to ruin!"
 goering.ostland.stahlecker.1.t:0 "The Stahlecker Issue"
 goering.ostland.stahlecker.1.desc:0 "\"You haven't met Stahlecker, have you?\" The question was muffled, with Erich, Göring's secretary, rummaging through a filing cabinet for the celebratory brandy. \"The man's a dyed-in-the-wool National Socialist, loyal as they come.\" Göring didn't respond. He simply sat and stared ahead with hands folded, clearly lost in thought and oblivious to the one-sided conversation taking place. \"I'm sure you wouldn't get along with him,\" Erich continued, \"But that wouldn't matter. If you told him to jump off a cliff, he'd do it solely out of respect for your office.\"\n\nAfter a minute more of awkward silence, Erich returned to Göring's desk, grinning and holding up the 25-year-old brandy that the Führer had pocketed during a visit to Paris in 1940. Göring didn't seem to notice, continuing to stare past his secretary even as the bright-eyed young clerk poured out a glass for his boss. \"My Führer?\" he asked, noticing Göring's blank expression.\n\n\"Hmm? Oh, thank you, Erich,\" Göring muttered, closing his worn fingers around the cool, hard glass. \"No... no, I haven't met Stahlecker. He was an SS man during the war, so I never had the pleasure.\" A twinge of worry shot across his face, and he raised the glass to down his drink in a single go, savouring the memories of less complicated times that it brought up. Minutes passed, during which Erich could only stand in place, awkwardly fiddling with the bottle's cap. \"Give me another, boy,\" he finally grunted. \"The Field Marshal is coming to dispense some 'advice' soon. Let's make sure we're properly fortified for it, eh?\""
 goering.ostland.stahlecker.1.a:0 "Unfortunately, there is no ignoring Schörner's 'advice'."
 goering.ostland.stahlecker.1.b:0 "Liquid courage secures a peaceful approach to Ostland!"
 goering.ostland.stahlecker.2.t:0 "No More Civil War"
 goering.ostland.stahlecker.2.desc:0 "Göring downs the letter with a sigh of relief as he finishes reading it. Too stressed to celebrate, he can only lean back into his creaking chair and relax as the stress of the past 24 hours evaporates. Stahlecker, ever the loyalist, had accepted his offer to negotiate and allow aid into Ostland. The Führer's feelings - and the subsequent celebratory drinking - are mirrored throughout the Reich. The state media, still a muddled mess after the civil war, had been pushing contradictory headlines regarding the Ostland situation for weeks, but by the afternoon of the day in which the Führer put out a statement to the press, every paper, TV news show and radio broadcast delivered the same message: No More Civil War.\n\nHowever, far from the temporary warmth and peace to be found in Carinhall that night, OKW headquarters seethes with treasonous spite. Peace? Peace, with the great Otto-Heinrich Drechsler murdered and Ostland in the feeble grip of a Bormannite? Peace, with a man who would rather laze about and lord over idle subhumans? Peace, with a man who was by all accounts a coward, a traitor and an indolent old conservative?\n\nNot on the Field Marshal's watch."
 goering.ostland.stahlecker.2.a:0 "Peace among Aryans is the greatest victory."
 goering.ostland.stahlecker.3.t:0 "Stahlecker Remains Defiant"
 goering.ostland.stahlecker.3.desc:0 "\"No? NO? The entire armed forces of the Reich bearing down on him and he says no?\"\n\nThe Führer's shouts, equal parts anger and disbelief, were loud enough to be heard from the bottom floor of the Reich Chancellery, prompting clerks, politicians and Wehrmacht guards alike to glance upwards for a moment before returning to their business. There would, many realised, be a lot more shouting later in the day if that outburst was any indication.\n\nHours later, Field Marshal Schörner downed the phone, hooked directly to the Chancellery, with a satisfied smile. He had known, of course, about Göring's peaceful overtures towards Stahlecker. For a time, he had been concerned - it was an open secret that Göring had no interest in so-called 'pointless' wars or anything beyond enriching himself and enjoying the perks of his office. This, however, was the first step towards changing that. It would take some time, yes - but if he were to be pulled deep enough into the Field Marshal's machinations, he would soon find himself too bogged down to even think about defying the will of the armed forces again. Then, and only then, would the Reich's invincibility be ensured."
 goering.ostland.stahlecker.3.a:0 "War - it does a leader good."
 goering.ostland.stahlecker.4.t:0 "A Brief Exchange"
 goering.ostland.stahlecker.4.desc:0 "Nobody attempted to stop the pair of Panzergrenadier officers, their dress uniforms glittering with medals, as they barged past the Führer's secretary and straight into his office. The few brave enough to attempt to eavesdrop in the thirty seconds that the men spent with the Führer heard no exchange of words; no indignant shouts or threats of arrest, nor snide, practiced military snobbery. When the officers left, the only apparent change was the absence of an envelope, stamped with the mark of OKW, that had previously been carried in a worn and scarred hand.\n\nGöring had been expecting such an outrageous move in response to his decision to pursue peace with Stahlecker, however. There had been no exchange of words for precisely that reason; the Panzergrenadiers had their orders, and Göring had been informed of their arrival hours in advance. With all the pieces so clearly laid out, there was no need for words - only a silent understanding.\n\nThe letter was clear in its wording. Cold, uncaring and professional - straight from the desk of Field Marshal Schörner. \"Army High Command,\" it read, \"Is deeply concerned by recent decisions made by the Führer. As the unquestionable defenders of the Greater Germanic Reich, we wish to express our hesitance to endorse the Führer's refusal to employ a practical solution to the renegade colony of Ostland. We recommend the immediate issue of an ultimatum demanding total submission and compliance to the self-proclaimed authority therein, under threat of military intervention. We expect that the Führer will wholeheartedly endorse this measure and carry it out post-haste.\n\nSieg heil!"
 goering.ostland.stahlecker.4.a:0 "Stahlecker isn't worth a tussle with the Wehrmacht."
 goering.ostland.stahlecker.4.b:0 "Swine! I will do no such thing!"
 goering.ostland.stahlecker.5.t:0 "Stahlecker Refuses"
 goering.ostland.stahlecker.5.desc:0 "Surprising everyone, Stahlecker has rejected our ultimatum demanding submission. That such an ardently loyal National Socialist would defy a direct order from the Führer - any Führer - is an unexpected setback, but now a line has been drawn in the sand between the Reich and its rogue colony. Any action taken against Ostland, military or otherwise, will now be legally justified and much more palatable to the Reich's citizens. Now, Göring is under pressure not just from OKW, but from many civilians in his administration and cabinet. A self-proclaimed Reichskommissar has refused his orders and set his men on a belligerent stance against us - how can we possibly react with anything but swift and bloody retribution?\n\nWith rather pointed words, apparently. So claims Göring, at least. Still set on avoiding bloodshed despite Stahlecker's insult, the Führer has expressed his belief that the renegade can be brought to heel. His logic is sound, at least: Stahlecker, as a Bormannite, values Germanic unity above all else. The shedding of Aryan blood is anathema to him and it was a wonder that he even found the willpower to push through the Ostland civil war in the first place. Yet, deep down, he is no true soldier; he lacks a military awareness of war's realities. Demonstrate to him in no uncertain terms what war with the Reich would entail, and he will fold. The Führer has received a certain amount of support for this idea, even from elements of the Wehrmacht, but wonders aloud if it's worth the effort."
 goering.ostland.stahlecker.5.a:0 "To hell with it. Issue the order to invade."
 goering.ostland.stahlecker.5.b:0 "He will listen if words are backed with steel!"
 goering.ostland.stahlecker.6.t:0 "Stahlecker Submits"
 goering.ostland.stahlecker.6.desc:0 "With no small amount of readily apparent disgust, Stahlecker has accepted our ultimatum demanding his submission. The Ostland garrison has returned to barracks and our troops have entered Riga unmolested. Stahlecker has set forth (by the slowest route possible) for Germania, to meet with his new Führer and formally accept the post of Reichskommissar of Ostland. Concerns have been expressed by certain ill-educated economists that the demand for Ostland's economy to be placed in the hands of Germania's bureaucrats was a step too far and that it will have disastrous consequences for the colony, but the Führer is happy to be done with the whole messy affair. The Wehrmacht, too, has stated their gratitude to Stahlecker and the Führer for their admirable effort in overcoming ideological differences to ensure a better future for the Reich's favorite colony.\n\nAnd yet, there's a sense that we could have done better."
 goering.ostland.stahlecker.6.a:0 "Good enough is good enough, right?"
 goering.ostland.stahlecker.7.t:0 "A Harsh Announcement"
 goering.ostland.stahlecker.7.desc:0 "PEOPLE OF OSTLAND:\n\nYour self-appointed leader is guiding you down the path to destruction. He would pit you against the entirety of the Reich. You would not only be thrown into the jaws of an unwinnable battle, but also asked to take up arms against your own Aryan brothers. Even if you had not just lived through one of the most bloody and catastrophic civil wars in the history of Europe, would you be willing to do such a thing? Would you risk spilling the blood of your friends and family members from the Fatherland? Would you truly put your life on the line for a civil servant who has overstepped his legal authority?\n\nThe Führer wishes for peace, but must enforce the unity of the Greater German Reich. All he does, he does in the name of security, peace and brotherhood. If he must unleash the armed forces of the Reich upon Ostland, then he will not hesitate to do so, even if the burden weighs heavily upon his heart. You all know what this entails: the Reich's own weapons will strike you down; its war machines will grind you under its treads; its mighty guns will bring the very sky crashing down upon you.\n\nIf you would stand for anything, stand for peace and unity! Bring the will of the Ostlanders to bear against your false leader and rejoin your kin, or all your people will perish!"
 goering.ostland.stahlecker.7.a:0 "Harsh enough, my Führer?"
 goering.ostland.stahlecker.8.t:0 "Trouble on the Border"
 goering.ostland.stahlecker.8.desc:0 "It would appear that our saber-rattling has had unintended consequences. During breakfast, the Führer was interrupted by the arrival of a report from one of the staging grounds near the border with Ostland. Apparently, an entire Panzer battalion decided to conduct some 'reconnaissance' on their own initiative. They didn't report anything unusual upon returning to base, but one of our infantry patrols reported seeing smoke rising from a Lithuanian village just over the border. Recon aircraft quickly confirmed that the village of approximately 400 civilians had been razed to the ground, with no signs of life remaining besides some wandering cattle. This particular village had not previously been of any interest to us due to its lack of defenses - Schörner claims provocation by partisans and the Ostland garrison, however, stating that his men were defending themselves.\n\nThe Führer is outraged by this impropriety, but that may well have been the intended result. There is little publicly available evidence of our forces' involvement in the attack, so certain elements of the militarist cabinet are urging him to turn the incident into a propaganda offensive to aid a coup against Stahlecker which is currently in the works (which is the first that the Führer has heard of such a thing). The Führer, for his part, would rather just pretend the incident didn't happen at all, to avoid any disruption to his war of words with Stahlecker - he is certain that his plan will still bear fruit.\n\nThe army, however, makes no secret of the fact that they bear responsibility, and is pushing for the Führer to authorize a second raid to undermine Stahlecker further. Why Schörner would advocate for two different solutions at the same time is anyone's guess."
 goering.ostland.stahlecker.8.a:0 "A coup can't possibly fail at this point."
 goering.ostland.stahlecker.8.b:0 "Incident? What incident? Back to the plan."
 goering.ostland.stahlecker.8.c:0 "Well, if they think more violence will help..."
 goering.ostland.stahlecker.9.t:0 "Trouble in the Air"
 goering.ostland.stahlecker.9.desc:0 "As if the Heer's complaints weren't bad enough, now the Luftwaffe, the Führer's pride and joy, has suffered a loss too. A pair of ME-262s were conducting a standard scouting mission in our airspace near the border when they were attacked and aggressively pursued over the border by the Ostland garrison's own fighters! Our pilots fought bravely and with great skill, but were outnumbered by ten to two. A loss was inevitable, with Lieutenant Wilhelm Kurtz being shot down over hostile territory. Thankfully his wingman made it back to base, but the damage is done. Even as the Luftwaffe mourns this loss, their allies in the Heer are baying for blood, now that there is proof of Stahlecker's hostile intentions.\n\nThe Führer is now under immense pressure to issue the invasion order, as continuing with attempts to intimidate Stahlecker will now infuriate the Luftwaffe as well as the Heer. With anti-Stahlecker sentiment now becoming so much more prolific, can Göring afford to continue dragging his heels?"
 goering.ostland.stahlecker.9.a:0 "Stahlecker must answer for this. Go ahead."
 goering.ostland.stahlecker.9.b:0 "No, damn it! We can still salvage this situation!"
 goering.ostland.stahlecker.10.t:0 "Militarist Plot Revealed"
 goering.ostland.stahlecker.10.desc:0 "Many had forgotten just how great a bellower their Führer had been during the war. Today the entirety of the Reich Chancellery got a reminder, as for reasons not yet public a delegation of Heer and Luftwaffe officers was subjected to a truly blistering tirade rivalling anything Hitler ever managed. Those close to the Führer's office were able to catch enough specific words that by evening, rumors were rife throughout Germania: the Luftwaffe had destroyed one of their own aircraft in a false-flag attack intended to smear Stahlecker. How the Führer learned of the plot is unknown, but the assumption is that Stahlecker himself was involved.\n\nYet there has been no move on the Führer's part, nor a counterattack by the militarists. The officers were permitted to leave the building, thoroughly shaken but unharmed. Whatever they said to the Führer, it was enough to give him momentary pause. Could it be that he has resolved not to take action against the plotters, despite their gross insubordination and betrayal of one of their own? Or is he merely considering the options laid out before him?\n\nThe Führer alone knows the true stakes of his situation. The militarists are dangerous, yes, but their most recent plot may have gone too far even for their ambition. Should action be taken against the plotters using the Abwehr, there are unlikely to be serious consequences, and Stahlecker has proven that he acts in good faith and is deserving of fair treatment. However, the greater plan... Might that be worth all the skullduggery and deception, in the end?"
 goering.ostland.stahlecker.10.a:0 "Put the traitors in irons! I will trust Stahlecker."
 goering.ostland.stahlecker.10.b:0 "It was for the greater good."
 goering.ostland.stahlecker.11.t:0 "Sheathing the Sabers"
 goering.ostland.stahlecker.11.d:0 "RIGA, OSTLAND - following weeks of tense negotiations, saber-rattling and border skirmishes, Führer Hermann Göring and de-facto leader of Ostland, Franz Walter Stahlecker, have publicly announced that an agreement has been reached on the status of the colony following the recent civil wars in both states.\n\nStahlecker, previously a bureaucrat within the Ostland colonial administration, is to be formally appointed as Reichskommissar of Ostland, with all the responsibilities that entails. Stahlecker has promised that mutual recognition of legitimacy is all he ever sought, and that he will serve the Reich \"...faithfully, for life, and unto death.\" For his part, the Führer had this to say:\n\n\"We live in trying times. Loyalties are constantly put to the test in unexpected ways, as are one's commitments to one's ideals. The recent disagreements between the Reich and her colony are the result of unfortunate circumstances and the realities of the day. It is tragic that loss of life occurred as a consequence, but with this agreement a great deal more bloodshed has been avoided. I commend Reichskommissar Stahlecker on his commitment to establishing a lasting peace within Europe and bringing a permanent end to war between brothers. Heil!\"\n\n"
 goering.ostland.stahlecker.11.a:0 "All's well that ends well."
 goering.ostland.stahlecker.12.t:0 "Nicht Mehr Bruderkrieg!"
 goering.ostland.stahlecker.12.desc:0 "Stahlecker, having realized the untenable nature of his position, has accepted our ultimatum and issued a stand-down order to the Ostland garrison. Jubilant Wehrmacht units and reinforcements for the colonial Orpo crossed the border shortly after dawn, passing long lines of Ostlander troops marching back to their barracks or trying to hitch a ride to Riga. Piles of weapons, vacated bunkers and abandoned motor pools line every highway and no small number of garrison troops have simply vanished into the woods, either heading for home or abandoning their cause altogether. Their fate makes no difference now.\n\nStahlecker and his staff are now heading by plane for Germania, no longer employees of Reichskommissariat Ostland. Indeed, the Reichskommissariat no longer exists as of this moment; now formally dissolved as a separate entity, all Aryan Ostlanders are now full citizens of the Reich and the colony's treasury has been snatched up by the Führer's financiers. A number of economists have expressed concern at this seizure of the colony, claiming that it is 'unprepared for integration'. This is nonsense, of course - the Führer has great expertise in economic matters. There may be some teething issues, true, but give it a few days and the colony will be more prosperous than ever."
 goering.ostland.stahlecker.12.a:0 "I hope the Wehrmacht's happy."
 goering.ostland.stahlecker.13.t:0 "Ostland Enden"
 goering.ostland.stahlecker.13.desc:0 "It was perhaps too much to hope that Stahlecker would roll over and allow us to snatch Ostland away from him. Our ultimatum has been unequivocally rejected, with a note from Stahlecker stating that he expects better for the colony - but that doesn't matter anymore. After weeks of dragging his heels, Göring has achieved little more than lose the respect of conservatives for treating Stahlecker so harshly and infuriate the Wehrmacht with his preference for words over action. The invasion can no longer be stopped, despite Göring's best efforts. Any order to hold fast would likely fall on deaf ears, as Schörner is past tolerating attempts at 'peace' and 'unity' for the time being.\n\nWar returns to Ostland; it will be swift, brutal and merciless. Anyone who knows the lay of the land and the disposition of the Wehrmacht could accurately predict that tens of thousands are likely to die, innocent or otherwise. Bombs will completely destroy what little civilization remains in Ostland, while rapine, plunder and savagery will be the order of the day, as it was thousands of years ago. Aryan blood, it seems, is not quite as valuable as National Socialism claims."
 goering.ostland.stahlecker.13.a:0 "And it's all our fault."
 goering.ostland.stahlecker.14.t:0 "A Minor Inconvience"
 goering.ostland.stahlecker.14.desc:0 "Our 'diplomatic' efforts are proceeding well, but we've hit a minor snag. There is an individual in Stahlecker's cabinet who has made quite a name for himself by frequently (and loudly) railing against the Führer, decrying him as a 'puppet of madmen', 'Schörner's submissive', and other even more vulgar terms. While no doubt amusing to the rank and file, he has a surprising amount of sway; not over Stahlecker, who remains as stoic as ever, but over the people of Ostland. The last thing we want in the event of successful negotiations is for the Ostlanders to rise up against our rule and render the whole peace process completely moot.\n\nThe Abwehr has pointed out that with the chaotic situation in Ostland, it would be child's play to remove this obnoxious individual from the equation. Even better, we have a man in Riga - a survivor of Drechsler's cabinet - who has spent the past few months schmoozing with his former enemies, who are unaware of his past loyalties. By pulling a few strings, passing fistfuls of marks to the right people and disposing of the troublesome individual in question, the Abwehr is confident that we can get our man into Stahlecker's confidence and start chipping away at the resistance from within.\n\n"
 goering.ostland.stahlecker.14.a:0 "What are we waiting for?"
 goering.ostland.stahlecker.14.b:0 "This sounds too risky."
 goering.ostland.stahlecker.15.t:0 "Another Call, Another Invasion"
 goering.ostland.stahlecker.15.desc:0 "Our decision not to dispose of that noisy fellow from Ostland turned out to be a wise one, as his inane ravings have finally prompted Stahlecker to give him the boot. Now out of a job and barely distinguishable from the assortment of homeless lunatics who populate the sewers of Riga, no longer will he poison the people of Ostland against us with his gutter talk. Of course, it was apparently too little too late for the Wehrmacht, who have once again called for an invasion of Ostland. They refer to the man's anti-militarist rhetoric as 'subversive, disrespectful and indicative of the general company that Stahlecker keeps'.\n\nThe prospect of invading over insults - especially when the one responsible has been fired! - is obviously ridiculous to any level-headed individual, but the Wehrmacht is rarely a bastion of balanced, rational thought these days. They appear to be completely serious, in fact."
 goering.ostland.stahlecker.15.a:0 "What? No, you maniacs. Calm down."
 goering.ostland.stahlecker.15.b:0 "They'll take any excuse. No sense trying to stop them."
 goering.ostland.stahlecker.16.t:0 "A Return to Stability"
 goering.ostland.stahlecker.16.desc:0 "When both the Reich and Ostland collapsed into civil war, few thought that anything resembling normalcy would ever return to the streets of old Riga. Those few are now vindicated, as barring the reconstruction work going on throughout the city, Riga is more or less indistinguishable from how it was in those blissful days of peace. The same is true for the entirety of Ostland - everywhere, the garrison and Orpo are back on their routine patrols (though with fresh faces among them), farmers tend their crops and factories begin to churn out goods for sale back in the Reich. Even the non-Aryan natives seem mildly appreciative of the situation; they might be on the fringes of society, but at least they aren't being shot at by the SS or murdered by partisans for not being anti-German enough.\n\nIn his office, refurbished with new furniture from Germania befitting his now-official status, Stahlecker allowed himself to recline with a satisfied smile. This is what it was for - all the unpleasant things he did in the SS, the civil war, the tense negotiations with a Führer he had little in common with. This vision of peace and stability, so thoroughly devalued in recent years, made it all worthwhile. Perhaps Göring would drag the Reich through years of war and pointless attempts and conquest, but the Ostland Stahlecker had fought so hard for would endure. Of this, he was certain."
 goering.ostland.stahlecker.16.a:0 "Bormann would be proud."
 goering.ostland.stahlecker.17.t:0 "A Troublesome Bureaucrat"
 goering.ostland.stahlecker.17.desc:0 "For all the ideological differences involved, and for all the Wehrmacht's posturing, nothing has been more disruptive to the Ostdeal negotiations than that vulgar beast of a man in Stahlecker's cabinet who has been ranting and raving for weeks about our supposedly illegitimate regime and the folly of negotiating with us. Things escalated substantially this week as he went on a long-winded and exceptionally crass rant while being interviewed by a Swedish journalist, with a number of choice insults, vile epithets and insinuations about the sexual proclivities of the Reich's leadership all being printed word-for-word in the Stockholm evening newspapers. He has apparently escaped any kind of discipline for this.\n\nThe Führer's response to this story was little more than a world-weary sigh. He had expected a phone call from Schörner demanding retribution to avenge the insult, but it was several hours before such a call came through. On the other end of the line was Schörner's aide, who hesitantly stated that the Field Marshal \"...favors immediate military action to, uh... to avenge this insult and - what was it, sir? - uh, and the sullying of the image of the Reich's glorious leaders.\"\n\nEveryone is a little confused at this point. Schörner has called for war yet again, but with uncharacteristic hesitation. Perhaps even he recognises the inanity of going to war over some foul language?"
 goering.ostland.stahlecker.17.a:0 "Why is this even news? Just ignore him."
 goering.ostland.stahlecker.17.b:0 "Fine, fine. Start the invasion, I suppose."
 goering.ostland.stahlecker.19.t:0 "Riga Shaken"
 goering.ostland.stahlecker.19.desc:0 "The air was filled with smoke and blood. The bomb - a dirty, makeshift device - had detonated prematurely in its package while being loaded into the back of a mail van. A large but inefficient gunpowder charge packed with shrapnel and nails, it had done just enough damage to the unfortunate mailmen that both would be crippled for life. The van was mostly intact, but several passers-by were hit by flying projectiles and left screaming and writhing on the pavement. Ambulances arrived promptly, but despite the relatively low number of casualties the attack has shaken the people of Riga. At this point, natives and Germans alike yearn for peace - why strike now? Who would wish for more bloodshed at this point?\n\nGöring is concerned that Stahlecker does not have the resources to handle the threat of an active terrorist cell. Allowing him to try and handle it independently might have disastrous consequences for peace, especially if key figures in the Ostdeal become the targets of assassins. To this end, the Führer has attempted to dispatch the Abwehr, only to be rebuffed. Stahlecker claims that the Orpo and the garrison can handle the situation, and that an Abwehr presence in Riga would constitute a violation of the Ostdeal. He's obviously just being stubborn, but might this be a sign of more trouble to come?"
 goering.ostland.stahlecker.19.a:0 "Insist that the Abwehr is deployed."
 goering.ostland.stahlecker.19.b:0 "Just let them handle it."
 goering.ostland.stahlecker.20.t:0 "The Abwehr Locates Its Prey"
 goering.ostland.stahlecker.20.desc:0 "Stahlecker backed down, recognising proper authority when he sees it for once. The Abwehr had barely been in Riga a day when the culprit of the bombing was apprehended. A young Latvian, he refused to state whether he acted alone, how he acquired the bomb or who, if anyone, put him up to it. His stoicism endured even through enhanced interrogation techniques. With little more to do, the terrorist was turned over to the Ostland Orpo. The Abwehr wished to simply shoot him out of hand, but records show that he is an Aryan native, entitling him to a proper trial not too dissimilar from those enjoyed by full-blooded German citizens. A minor loss for us, but at least justice will be served.\n\nGöring is happy to have avoided conflict with Stahlecker over this, and the Abwehr is very pleased to have done their job well and without interference from the Ostland authorities, but every successful negotiation sets off another round of grousing from the Wehrmacht. The Ostdeal must conclude, and quickly."
 goering.ostland.stahlecker.20.a:0 "A job well done, at least."
 goering.ostland.stahlecker.21.t:0 "A Stubborn Bastard"
 goering.ostland.stahlecker.21.desc:0 "Stahlecker has, for whatever asinine reason, refused to allow the Abwehr to enter Ostland and do their damn jobs. Göring's response was simply to sigh, rub his temples and dismiss his secretary before taking a long, long swig of brandy. At this point, he has to wonder: does Stahlecker enjoy this? Beneath the neat spectacles and the stone-faced expression of a model Bormannite, is there some manner of Judeo-Bolshevik devil, seeking to torment and subvert the Reich at every turn? Why string the Führer along? Why make him sit through all these negotiations only to turn around and become a stick-in-the-mud over THIS of all things? Why not just let the people with the best of intentions do their jobs? Wouldn't that be better than just jerking them around and... and...\n\nGöring sighed again, downed the rest of the bottle, and awaited the angry phone call from Schörner."
 goering.ostland.stahlecker.21.a:0 "Time for some stronger words."
 goering.ostland.stahlecker.21.b:0 "I don't care anymore. Just let it go."
 Goering_ostland_category_stahlecker:0 "Unternehmen Ostwind"
 Goering_ostland_category_stahlecker_desc:0 "The winner in Ostland is Franz Walter Stahlecker, a capable man for all accounts, but unfortunately not a militarist like Dreschsler. Indeed, the Wehrmacht is postively frothing to strike at the former colony, demanding blood for the defeat of their man. However, it is not they who rule in the Reich as long as Göring is alive. Whether to work with or destroy Stahlecker, the choice is the Führer's alone."
 GGR_anarchy_in_ostland:0 "Unternehmen Ostwind"
 GGR_anarchy_in_ostland_desc:0 "The civil war in the metropolitan Reich had many far-reaching effects. Ostland, once a model colony with relative stability compared to its contemporaries and outstanding Germanisation rate, collapsed into war mirroring the civil war in central Germany as natives, SS and rival contenders rose up against Reichskommissar Stahlecker. The militaristic contender, Drechsler, is gone, his government collapsing under assault from all sides. We have no use for weak armies like his, so perhaps it is good that he has fallen. Nothing can restore an order that aligns with our plans for the east except for German might. Intervention is the only way to end this anarchy once and for all. The arms of the Reich will restore order to Ostland with unparalleled force!"
 GGR_going_in_alone:0 "Going in Alone"
 GGR_going_in_alone_desc:0 "There is nobody for us in Ostland. Stahlecker and Drechsler are too weak or gone, reduced to mere partisans in the eastern fields. Ostland has become a treacherous place brimming with Jewish Bolsheviks, SS lunatics and liberal traitors. We must sweep through all the factions, overwhelming each government at once with a simultaneous push through their weak, unprofessional armies. Once they are gone, we will install a regime of our liking, one that is not tainted by the weakness of the previous administration. After our army sweep through Ostland, destroying traitors and pretenders on all sides, we will build it anew and turn it into the jewel of the Reich's crown once more!"
 GGR_intensive_bombing_campaign:0 "Intensive Bombing"
 GGR_intensive_bombing_campaign_desc:0 "The Führer was once a pilot. He has said in the past that he finds it to be the strongest position a man can be in. Flying thousands of feet above the Earth, watching ground forces battle like toy soldiers beneath you. A true testament to man's technological expertise, and in particular German expertise, as we were the ones who exploited the aircraft to its greatest potential in the Second World War. The pretenders in Ostland have pitiful air forces, consisting of old biplanes and rusty soviet designs. We will send our mighty Luftwaffe to the skies with the iron spirit of a nation, raining terror with utter impunity from above, like impervious steel gods amongst men of weak flesh. The partisans will scatter to the gutters like rats in the face of our bombardment!"
 GGR_friends_on_the_inside:0 "Friends on the Inside"
 GGR_friends_on_the_inside_desc:0 "Not all is lost in Ostland. The second Reichskommissar, Stahlecker, still fights for the Reich and has no treacherous ideas of liberalism or Himmler's depraved ideology lurking around him. When he succeeded Lohse, his domain fell apart around him, and now he controls meagre stretches of territory as he is overpowered by traitors and bloodthirsty partisans. Though Stahlecker failed to control Ostland once, he is still a German fighting for Germany, and we are obligated to give him our overwhelming support. There is no doubt his administration will need drastic reshuffling and may necessitate a purge, but these are matters for when the fighting is done. Today, we fight for Germany, and for all Germans!"
 GGR_back_to_the_fold:0 "Back to the Fold"
 GGR_back_to_the_fold_desc:0 "The Germans in Ostland are tired. The fight has been long and taken a huge toll on the land they have only recently been able to call their own. From all sides, degenerate partisans and insane SS cultists have assaulted their way of life and torn their newly built, prosperous farms and cities to the ground. And the fight continues, with their forces ever dwindling in the face of their enemies. This sorry state of affairs will not continue! New arms, new men, new officers. Stahlecker's army will no longer fight on its last legs. The war to make Ostland stable and German will be renewed with vigour thanks to our aid!"
 GGR_reestablish_the_garrison:0 "Reestablish the Garrison"
 GGR_reestablish_the_garrison_desc:0 "A garrison is a necessary force for a colonial state. For every budding native terrorist, every dissenter shouting at the street corner, every partisan in the countryside, we must have a German soldier to put them down. Bolsheviks and Jews will try to halt our progress towards a great Germanic state at every turn and we must prepare for their schemes before they even hatch them. Germans in the area long for order and stability, so there is no doubt they will flock to the banners of the garrison and give it all the support they can. By recruiting those loyal to the Reich in Ostland we can control the area, and with new training schemes coming through a new generation of technology and officers the garrison will be far more effective at rooting out saboteurs than ever before!"
 GGR_end_the_madness:0 "End the Madness"
 GGR_end_the_madness_desc:0 "Despite our restoration of the garrison, it is not enough. Our men are simply too thinly spread, competing against legions of underground partisans that melt into the general population. They use tactics of fear to fight us. We will do the same. Public executions, as brutal and extended as possible, advertised to whole villages. Anyone who even makes contact with partisans will hang before their friends and family. The disease that plagues Ostland seems incurable to many soft-minded individuals of our government, but we will prove them wrong as we attack the partisan menace at its core and drill deep into those organisations that would see Ostland, and the entire Reich, burn!"
 GGR_rebuild_the_factories2:0 "Rebuild the Factories"
 GGR_rebuild_the_factories2_desc:0 "Perhaps the worst casualty of the Ostland war was the economy of the area. No longer do the eastern cities produce the weapons and equipment for the Reich like they once did, instead the cities are a constant drain on our resources and will continue to leech off the Reich until we take action. We must fix this. By investing in local factories we can attract blue collar workers from the metropole, boosting Germanisation and thus stability. Our slaves can run the other factories, as we pump resources from Ostland and turn it into a net boon once again. These strong industrial cities will centralise the power of Ostland further and weaken the partisans that hide in the rolling fields of the eastern Reich."
 GGR_one_last_fight:0 "One Last Fight"
 GGR_one_last_fight_desc:0 "Disloyalty is not something our Reich can afford. When Hitler let disloyalty grow, it resulted in the rise of the SS and the eventual civil strife that has wracked our nation, resulting in the creation of the despicable state of Burgundy. We must not make the same mistakes as our predecessors. Wherever a trace disloyalty can be found, it must be purged. And there is no way Stahlecker is loyal. He declared support for the pretender Bormann's cause during the Reich's war, he fought against the patriot Drechsler and caused his downfall. Along with these traitorous actions his weakness was shown before the war as he failed to keep Kovner, Vituska, the liberals and the SS from rising up against him. We will march on Riga and crush Stahlecker's regime, which is a hollow shell of a force after the civil war, with no remorse for those who stand in our way. We will achieve the greatest Reich possible, whatever the cost!"
 GGR_an_ally_in_the_east:0 "An ally in the East"
 GGR_an_ally_in_the_east_desc:0 "If we are to continue our offensive across the Earth towards all the upstart nation's that defy the night of the Reich, we must ensure stability. War with other Germans is not the way to stability. We cannot afford to attack Stahlecker when he is perfectly loyal to the German cause, if not necessarily the Führer's cause. By keeping Stahlecker in power we can ensure unity and stability within the Reich. Though the military may not like having a potential threat under our noses, they will no doubt benefit from the stability that Stahlecker's Ostland will have and the increased eastern production that will come from it. Let our internal disputes be resolved, for tomorrow we look out again towards those who must be removed!"
 goering.ostland.stahlecker.22.t:0 "A Riga Street"
 goering.ostland.stahlecker.22.d:0 "A small stream ran down the Riga street. The rain fell in trickles, bouncing off the metal Stahlhelms of the soldiers and soaking into their uniforms. There was nobody else on the street. The buildings were boarded up, with all the extravagant reds and whites that once made this German street so vibrant blurred by dust and scratching.\n\nThe young Grenadier had not stopped complaining since the patrol began. A constant stream of curses towards his superiors, the weather, and Ostland itself. Every other member of the group was silent. It was a dull patrol, and though the Gemeiner would inevitably suffer some harsh consequences for his words, they somewhat enjoyed hearing his anger. Schörner had ears everywhere however, as the Gemeiner would no doubt learn in the coming days.\n\nAs they turned the corner, the Gemeiner was grumbling over the uselessness of patrolling Riga. He had just called it the safest city in the Reich when a group of masked men materialised from open doorways and side alleys. The German soldiers couldn't even raise their rifles. Gunshots echoed from the hollow buildings, rising in violent cacophony and then falling silent. In a few seconds, the soldiers were all dead in the street, their blood soaking through their clothes and running into the rainwater stream. The partisans vanished as promptly as they appeared. "
 goering.ostland.stahlecker.22.a:0 "A dozen more widows."
 Goering_ostland_category_anarchy:0 "Unternehmen Ostwind"
 Goering_ostland_category_anarchy_desc:0 "The Ostland Civil War has continued to rage on even as the fires of our own conflict have faded. Unfortunately the militarists' man Drechsler fell before we could intervene, meaning we have to choose whether to support the conservative but possibly workable Stahlecker or to simply clear the board entirely."
 befriend_stahlecker:0 "We are on good terms with Kommandant Franz Walter Stahlecker"
 GGR_the_ostdeal_tooltip:0 "§YWe will work with Stahlecker to create a deal for the benefit of the Reich.§!\n"
 GER_ostdeal_fail:0 "Stahlecker has refused to rejoin the Reich."
 GER_ostdeal_backstab:0 "Stahlecker has been put down like the dog he is."
 GER_ostdeal_succes:0 "The Brother state has rejoined the mighty Reich."
 GGR_end_the_madness_tooltip:0 "§YIt's time to destroy the remaining partisans.§!\n"
 GGR_reestablish_the_garrison_tooltip:0 "§YThe garrison in Ostland is weak. We will replace it with our own loyal men.§!\n"
 GGR_ostland_order_restored_tooltip:0 "§YOrder has been restored in the east.§!\n"
 GGR_anarchy_in_ostland2:0 "Unternehmen Ostwind"
 GGR_anarchy_in_ostland2_desc:0 "The situation in our Reichskomissariat Ostland is catastrophic. The chaos triggered by the civil war has also spread to our eastern territories. Several factions have been engaged in a bloody struggle for supremacy there for some time. In addition to the former deputy Reichskommisar Stahlecker and the commander of the Generalbezirk Lettland, Otto-Heinrich Drechsler, Belarusian partisans have also seized the initiative and have withdrawn from our sphere of influence. This brazenness is now coming to an end. The Führer has given the order to attack the territories. German tanks will soon be rolling across the Baltic and Belarusian plains again, as they did in 1941. And, just like before, these territories will once again be placed under the Greater German sphere of influence. The fact that Drechsler is a supporter of Schörner and under his protection naturally complicates the situation somewhat. But in the current situation, we don't have to take personal sensitivities into consideration. These traitors to the German people must be brought to justice, whether Schörner likes it or not..."
 GGR_a_second_chance:0 "A Second Chance"
 GGR_a_second_chance_desc:0 "Otto Heinrich Drechsler. A friend of the Reich, and a friend of Göring. A true patriot. Whilst Ostland crushes itself in war, it seems only sensible that we should support Drechsler's military government, and intervene on his behalf. Yet Drechsler has failed to control the former Reichskmmisariat as he should have. Due to the failures of his army, the butcher Kovner roamed unchecked slaughtering the Germans of the eastern with impunity, and treacherous SS lunatics and traitorous liberals have controlled large stretches of Ostland. Whilst we will intervene on his behalf, and bring him to the Pakt, we must do so with caution, for there is no room for weakness in the new Reich especially when that weakness is so close to the heartland."
 GGR_replace_their_officers:0 "Replace his Officers"
 GGR_replace_their_officers_desc:0 "The officers of Ostland failed. What should have been an easy war win by superior German soldiers and arms has instead become a lengthy slog as they failed to win the war quickly and led their soldiers with inferior, outdated tactics. These donkeys must be removed if Ostland is to become a part of the Reich. We will ensure that the new officers are loyal to Germany first, and Drechsler second, so there will be no questions asked if Drechsler needs to be removed. The military will surely delight at the opportunity to expand their influence in the new Ostland, and with our officers training Ostland's soldiers they will be better prepared to march onwards after the war has been won, and to return German control not only to Ostland but to the entire eastern Reich!"
 GGR_a_safe_ostland:0 "A Safe Ostland"
 GGR_a_safe_ostland_desc:0 "Once, Ostland was the most stable colony in the Reich. German settlers looking for a new life in the picturesque eastern countryside always looked to Ostland first, with the threat of partisans and terrorists far less prevalent than in some of the more far-flung colonies. This is no longer the case. Since the civil war SS fanatics have holed up in Ostland's southern forts, liberal manifestos and preachers are abundant throughout the centre of the colony, and Kovner's Bolshevik partisans stalk the north. But with the civil war over, we can finally end this resistance! Let our men stalk the countryside for these partisans, let the liberals hang and their books burn, let the SS starve in their rabbit holes; Ostland will be safe, German, and whole once more!"
 GGR_rebuild_their_homes:0 "Rebuild their Homes"
 GGR_rebuild_their_homes_desc:0 "Imagine a farmstead in western Ostland. Imagine the German family who inhabit it; a father who made this his work in the '50s after retiring from the army, a mother who serves her family as dutifully as she serves her country, three children who dream of serving in the army under the Führer. There are those who would see this family killed. There are those who would burn the quiet farmstead to the ground, leave it a smouldering ruin in a foreign country. When the German people lose their homes, Germany is lost with them. We must build more farmsteads and more modern city houses, for once we have homes across Ostland then it can truly be integrated into the Reich!"
 GGR_our_eastern_friend:0 "Our Eastern Friend"
 GGR_our_eastern_friend_desc:0 "The new Reich is built on militarism, and there is no doubt Otto-Heinrich Drechsler is a military man. Through we have swept away his old officer corps, lined his cabinet with our own supporters and rebuilt his domain in the image of the metropolitan Reich his loyalty has remained unwavering. Yes, he has failed in the past. But his loyalty to the Führer and to the Reich's cause cannot be doubted. Drechsler is the favourite of the Wehrmacht, and by keeping him in power we can further secure the loyalty of our generals, who will no doubt keep Drechsler under tight control as repayment for the favour. As we give Drechsler a second chance to be Ostland's saviour, so to do we give Ostland a second chance to be peaceful, prosperous and German."
 GGR_alter_the_deal:0 "Alter the Deal"
 GGR_alter_the_deal_desc:0 "Drechsler is a failure. It is that simple. He lined his officer corps with incompetents, failed to stop the madness of civil war from consuming Ostland, and had to rely on the Reich to secure his victory. There is no room for weakness in the Reich. If we are to show the world what conquest is, and make them fear the war drum of the Reic), then we must be efficient and strong. Drechsler has failed in obtaining both these attributes. The Führer will send the order to Drechsler's new officers, who aren't loyal to him, commanding them to remove Drechsler and hand direct control to the central government. The military will surely not approve, but perhaps this will help them learn their place; no matter who you are, if you are weak, you will not succeed in the new Reich."
 GGR_no_redemption:0 "No Redemption"
 GGR_no_redemption_desc:0 "Ostland has been consumed by anarchy. Everything within the borders of the state has been corrupted; tainted by exposure to liberalism, SS fanaticism, Kovnerist degeneracy and Bolshevism. We cannot trust anyone in that mess, even the contender who fights in the name of military strength, Otto-Heinrich Drechsler. He has failed to control Ostland, and so we cannot help him. Instead we will sweep through Ostland, using the great industrial strength of the Reich, crushing every single faction that resists us, executing every German or native that doesn't salute our forces! War is what made us great, not dealing with incompetents and failed aspiring despots. We will show Drechsler and all the other mainics that have torn Ostland apart what true, professional warfare looks like!"
 GGR_exploit_the_madness:0 "Exploit the Madness"
 GGR_exploit_the_madness_desc:0 "According to our intelligence, there have been at least six factions fighting in Ostland, with their commands in various states of chaos. The fighting is not uniform, and all sides have resorted to all forms of dishonourable covert warfare to smite their opponents. To win with ease in Ostland, we must do the same. Let us push the natives to fight one another, the Jews against the pretenders, the liberals against the SS. Our forces will exploit the chaos to the greatest effectiveness possible, with our intelligence agencies sabotaging communication lines to create confusion amongst our enemies. We will not target merely one foe, instead coordinating our assault across all the factions. From Riga to Minsk, we will crush our foes indiscriminately!"
 GGR_arm_the_loyalists:0 "Arm the Loyalists"
 GGR_arm_the_loyalists_desc:0 "There are still those who fight for the Reich in Ostland. Though many Germans fight in the name of pretenders, liberals and traitors there are still many more who would take up arms to fight for the return of the Reich. They flock to our banners when we march through the lands that were once so peaceful, begging for the opportunity to fight the savage natives and traitors that plague their lands. So we must give them arms to fight with. By sending weapons to those who volunteer to fight as we reach German villages and cities, we can reinforce our army quickly with fresh manpower without losing forward momentum. Our officers will quickly train those with the enthusiasm to fight, and once we are done in Ostland, the new soldiers will be experienced in war and ready to fight for whatever wars come next for the Reich."
 GGR_fix_the_factories:0 "Fix the Factories"
 GGR_fix_the_factories_desc:0 "The cities of Ostland lie in ashes, smouldering husks of the proud industrial centres they once were. The brutality of the civil war has devastated the productivity of Ostland which was once so profitable to the Reich. Ostland's armies are under equipped as they survive only on exports from the metropolitan Reich; this is a drain on our resources and cannot continue. Whilst the cities remain unproductive, the countryside will remain anarchic with a lack of equipment to crack down on the remaining partisans. By returning industry to Ostland we can also spur a new wave of blue-collar colonialism from the metropolitan Reich, further pushing Germanisation in the native-infested industrial areas of the colony. We must invest into the factories, return military industry to Ostland, and ensure that the colony is self-sufficient and prepared for the next conquests to the east!"
 GGR_pacify_the_countryside:0 "Pacify the Countryside"
 GGR_pacify_the_countryside_desc:0 "Kovner. Vituska. Meyer-Landrut. Jeckeln. All feeling or dead. We have won victory in Ostland, yet the soldiers of these broken armies fight on. Still they stalk the countryside, old soviet rifles in hand. Still they harass German farms. Still they attack random German-made cars on the country roads. Though we have regained control of the cities, our control of the countryside is far more sporadic; this must change if we are to properly integrate Ostland. Send troops to the fields, bomb out the makeshift HQs, root out and kill the leaders! A grim task which may risk the lives of many German soldiers and settlers, but once we're done Ostland's rolling countryside will finally be safe and stable once more."
 GGR_order_restored:0 "Order Restored"
 GGR_order_restored_desc:0 "We have achieved the impossible. From a collapse into an anarchic civil war to a safe, stable colony once more. No longer does the German farmer in the homestead fear the partisans torching his livelihood overnight. No longer does the Riga bureaucrat fear the darker city streets. No longer does the vacationing Stuttgart family fear the horrors that stalk Ostland country roads. Every partisan leader has been executed, every bit of anti-German propaganda burned, every rebellious native pacified. Now that Ostland is stable once more, we can profit off the colony once again, and the garrison can lend it's troops to the Wehrmacht as Germany marches on to it's next conquests!"
 GGR_integrate_ostland_desc:0 "The Reichskommissariats are a temporary solution to the colonisation problem. They are merely interim governments that administer the native populace's before integration, and it is a great achievement for all in the Reichskommissariat administrations when the Reichskommissariat ceases to exist. There is no doubt that Ostland has finally reached the point where we can destroy the RK and integrate it as core German territory once and for all. We will split it up into new Reichsgaue, and the remnants of the slavs in Ostland will be swept eastwards out into Moskowien and beyond where they will obstruct the dream of a German Europa no more. Ostland is German, now and forevermore!"
 GGR_integrate_ostland2_desc:0 "The Reichskommissariats are a temporary solution to the colonisation problem. They are merely interim governments that administer the native populace's before integration, and it is a great achievement for all in the Reichskommissariat administrations when the Reichskommissariat ceases to exist. There is no doubt that Ostland has finally reached the point where we can destroy the RK and integrate it as core German territory once and for all. We will split it up into new Reichsgaue, and the remnants of the slavs in Ostland will be swept eastwards out into Moskowien and beyond where they will obstruct the dream of a German Europa no more. Ostland is German, now and forevermore!"
 goering.ostland.drechsler.4.t:0 "Subverted in Ostland!"
 goering.ostland.drechsler.4.d:0 "Incompetence! Our administration is a failure! Drechsler was isolated, weakened and vulnerable after the civil war and we still failed in a simple plot to remove him from power. It seems the Führer lost his influence inside the Reich; how can he ever hope to rule the world if this is the case?\n\nOur officers were stopped before they could even come close to arresting Drechsler. It seems Schörner has more ears than we may have thought. He was five steps ahead once again, his men waiting for the radio call to take out our own officers like a well-rehearsed symphony. They then wiped the world clean of evidence of this crime, and the Führer was astounded to get the call that all the plotters had simply disappeared, vanished without a trace.\n\nThe anti-militarist inner circle speaks in more hushed tones now, but the messages from their lips are one and the same. The monster under the bed that keeps them awake at night comes not from America, not from Japan, not even from Russia. It comes from Germany."
 goering.ostland.drechsler.4.a:0 "If it is spoken, he hears it."
 goering.ostland.drechsler.5.t:0 "Woes of a Partisan"
 goering.ostland.drechsler.5.d:0 "Hans was a patriot. He had fought for Germany in the war against the Bolsheviks, and was able to settle his family on a farmstead in the east as a reward for his service. It was never a question to him if he'd fight again. When Ostland fell into chaos, he was amongst the first to sign up, serving his country under Otto Heinrich Drechsler.\n\nDrechsler was gone now. It wasn't even the anti-German partisans that struck the final blow, although they certainly helped in the destruction of Drechsler's command. It was his own country. The new Führer, Göring, had marched over those loyal to the Reich with as little mercy as he had with those disloyal to the Reich.\n\nNow Hans fought for the wrong side. They had taken his farmstead and his family. They had taken his patriotism. He wasn't a soldier of the Reich anymore. He was a partisan. A measly partisan fighting his own homeland. A farmstead no longer awaited him at the end of the fighting. Only death at the hands of those he once called brothers-in-arms awaited him."
 goering.ostland.drechsler.5.a:0 "A story of Germany's failures."
 goering.ostland.drechsler.7.t:0 "Order Restored to Ostland"
 goering.ostland.drechsler.7.d:0 "Tonight, a German family in the Ostland countryside sleeps well knowing that they will not wake up looking down the barrel of a partisan's gun. Führer Göring announced today that order had once again been restored to Ostland, and that German soldiers and officers assisting the garrison would soon be returning to Germania to assist with the next conflict the Reich will be involved in as our quest to pacify the world, as we have finally done in Ostland, continues.\n\nBut with every victory comes a consequence. The men we had posted in Ostland were bloodthirsty militarists; they do not wish for a reasonable approach to conquest, merely a thrilling ransacking of countries that brings them fame and glory. We must now keep them in check once again, and ensure their anger remains pointed at the enemies of the Reich."
 goering.ostland.drechsler.7.a:0 "Peace in the east at last."
 Goering_ostland_category_anarchy2:0 "Unternehmen Ostwind"
 Goering_ostland_category_anarchy2_desc:0 "The Ostland Civil War has continued to rage on even as the fires of our own conflict have faded. Fortunately, Herr Drechsler still survives amidst the chaos, giving us an ally to support against the others. It is clear that we must ride to our ally's aid, but what to do after that remains up in the air."
 GGR_reigning_in_drechsler_tooltip:0 "§YStart to look into the situation in Ostland.§!\n"
 GGR_wayward_sons:0 "Unternehmen Sichelschnitt"
 GGR_wayward_sons_desc:0 "The Netherlands, in their foolishness, mistook the Reich's internal squabbling for a moment of weakness. They have broken free from our embrace, and it falls upon us to bring them back into the fold. Like a sickle we shall cut through the Lowlands - their lack of natural barriers only helped us last time, and even their vaunted water line did not stop us. Why should it now? This will be as easy as cutting the head from a tulip."
 GGR_wayward_sons_tooltip:0 "We will prepare for the reconquest of the Netherlands. Relevant decisions will be unlocked."
 GGR_ready_the_paratroopers:0 "Ready the Paratroopers"
 GGR_ready_the_paratroopers_desc:0 "Our first invasion of the Netherlands was one our Führer took great pride in, for it was his vaunted Luftwaffe that delivered our paratroopers from the sky to Dutch soil in a most dramatic fashion. This innovation overcame the Dutch attempts to flood their own country and cut off Holland, and paved the way for the invasion of Belgium and the fall of France. Once more, our paratroopers shall prepare to fall upon Rotterdam and Den Haag to prepare the way for our ground forces - except this time, Führer Göring shall have the glory. "
 GGR_contact_the_volk:0 "Contact the Volk"
 GGR_contact_the_volk_desc:0 "The Dutch are as close to Germans as they come. Aryan blood flows through their veins, and our propaganda has been doing its best to convince them of this since they first joined us. Our efforts have paid off, with Germans largely welcomed and a not inconsiderable portion of the Dutch considering themselves part of the Volk. We should reestablish communications with these loyal citizens of the Reich, that we may more easily reassert control when the time comes."
 GGR_the_final_ultimatum_Netherlands:0 "The Final Ultimatum"
 GGR_the_final_ultimatum_Netherlands_desc:0 "The Dutch \"government\" had to know this was coming. As soon as they tried to slip free, a countdown started to the moment we would return. We are merciful, so we will give them an ultimatum. Slip back under the Germania's thumb once and for all, and all transgressions will be forgiven. The price for resisting need not be stated. "
 GGR_return_of_the_NSNAP:0 "Return of the NSB"
 GGR_return_of_the_NSNAP_desc:0 "The 'Nationaal-Socialistische Beweging' were viewed by many in the Netherlands as... well, as bootlickers. It was because of this they were not chosen as our preferred intermediaries for controlling the country in the first place. The NSB, or National Socialist Movement in the Netherlands were instead the only legal party outside our own. Times change however, and the NSB have proven untrustworthy - it turns out nationalist movements like staying their own nation. Who knew? The NSB will serve for now at least. It is important they at least feel some kind of freedom, even as our grip tightens around them."
 GGR_Purify_the_blood:0 "Purify the Blood"
 GGR_Purify_the_blood_desc:0 "The Dutch are so close to German it hurts - only the Scandinavians have more rarified Aryan blood. Still, they have stubbornly resisted our efforts at further integration. No longer. It is time for further purification, a removal of dissident elements, of any nationalism other than our own. Any tainted blood from their former empire in Asia or anyone who thought they could rest easy under a lighter hand will be taken care of."
 GGR_an_integral_part_of_the_reich:0 "An Integral Part of the Reich"
 GGR_an_integral_part_of_the_reich_desc:0 "Once more, German troops marched through the fields of the Netherlands, and once more the swastika flies over Amsterdam. The Westmark has been restored to the Reich, and is already being divvied up into Reichsgau for loyal party members to squabble over. A victory parade has been organised and medals drawn up for the veterans of operation Sichelschnitt - not to mention for our illustrious Führer. Our conquests proceed apace."
 goering.830.t:0 "Widespread Looting in the Netherlands"
 goering.830.desc:0 "The Dutch were once seen as brothers to the Germans. Every German invading the Netherlands were reluctant to cause harm and kill what they saw as their countrymen. That all changed one day, when German soldiers ransacked house to house, when art was stolen out of museums, bakeries, robbed of bread, and son taken from mother, screaming. Now, as Germany continues to press the Dutch to integrate, it only infuriates and invigorates independence. They will never see eye to eye again. They shoot dirty looks into the eyes of patrolling German soldiers, and unintelligible swear words are muttered under the breath of passing civilians. The Dutch will probably never forgive, nor forget what happened."
 goering.830.a:0 "At least we got cash."
 goering.netherlands.1.t:0 "It Was Inevitable"
 goering.netherlands.1.desc:0 "The inevitable has happened, and the Reich has come to claim its due. They demand that we submit immediately and unconditionally, that we surrender our leaders to Führer Göring's mercy, that we lay down our arms and become good citizens of the Reich. Needless to say, there is only one answer. "
 goering.netherlands.1.a:0 "Rage against the dying of the light"
 goering.netherlands.2.t: "The Netherlands Accepts Our Ultimatum"
 goering.netherlands.2.d: "Cornelis van Geelkerken stands at the center of the Grand Hall, flanked by Dutch officials and military leaders. Opposite him is Friedrich Müller accompanied by his guards. The tension in the room is palpable as the final terms of the ultimatum are read aloud.\n\n\"By accepting the terms laid out by Führer Göring, the Netherlands agrees to a full and unconditional surrender,\" Müller announces, his voice echoing through the hall. \"All resistance must cease immediately, and the nation's resources and infrastructure will be placed under Reich control \"\n\nVan Geelkerken, his face etched with resignation, steps forward to sign the official documents. The weight of the moment is felt by all present, a somber acknowledgment of the nation's loss of sovereignty.\n\nWith the signature of Geelkerken, Müller smiles as he packs up his documents before looking at Geelkerken one last time. His defeated look proves that no one can defy the German Giant. The two men handshake as Müller exits the room."
 goering.netherlands.2.a: "My Führer, the Netherlands is secured."
 goering.netherlands.3.t:0 "The Dutch Refuse"
 goering.netherlands.3.desc:0 "\"What?\"\n\n\"I don't understand it either, my Führer.\"\n\nGöring looked on for a moment, thoughts racing through his head. Most of them revolved around one thing- what did the Dutch think they were doing? He couldn't understand it.\n\n\"You're serious that they refused?\"\n\n\"Yes, my Führer. They made it quite clear.\"\n\n\"What the hell do they think they're going to do to us? Kick us with their clogs? This is ridiculous. I've seen some poor decisions in my time, Axmann, and I think this one might be one of the worst yet.\"\n\n\"What are your orders, my Führer?\"\n\n\"Well, I didn't think we'd need to, but greenlight the invasion plan. We start as soon as possible.\"\n\nThe minister nodded and left the room quickly, leaving Göring alone with a vein popping out of his temple. What a waste of lives! Their own Germanic brothers, loyal subjects of the Reich, now turning their arms against their homeland in a futile, worthless attempt at honor. A total waste."
 goering.netherlands.3.a:0 "Disappointing."
 goering.netherlands.4.t:0 "Return of the NSB"
 goering.netherlands.4.desc:0 "With the Netherlands once again in the Reich's sphere of influence, so too came the return of the NSB - the Dutch wing of the Nazi party. Once the lone power in Holland, the NSB, through incompetence and general failings, had lost control of their nation, forced to retreat into Germany. Now, with the Germans behind them, the NSB resumed control.\n\nOffices once held by NSB officials were restocked with staunch hardliners, government policy was replaced with the old ways, and the focus of the Dutch government once again shifted back to their original task- quick, seamless integration with the Greater Reich. Though Germanization progress was certainly dealt a setback in the last years, the new government is wasting no time in recovering their progress and marching onwards. With luck, we may even see the Netherlands integrated as a part of Germany proper within the next few years."
 goering.netherlands.4.a:0 "Europe gets closer to its salvation."
 goering_peace_events.9.t:0 "The Conquest of the Netherlands!"
 goering_peace_events.9.desc:0 "There wasn't a single German soldier who was eager to invade the Netherlands. No one was chomping at the bit to get into the battlefield, to put down the rebels, to slaughter the resistance. No general looked over their maps, charts, and battleplans before smiling to themselves at the thought of the prestige they would win for the victory. Even the officers, charged with delivering impassioned speeches to prepare men to fight, kill, and die for the glory of the Reich, were only putting in half-effort.\n\nThis was partially due to all of the propaganda that was suddenly being turned against those who had employed it; Years of education and conditioning to convince the average German that the Dutch were their racial cousins was meant to foster unity, but now fostered a sense of supreme melancholy in having to do battle with their blood relatives. Then, there was how pointless all of this was; The Netherlands were being given an opportunity to join the greatest empire history itself had ever known, and they responded to such an offer by spitting in the Führer's face. Then, on top of all of that, came just how pathetic the resistance actually was; There was no great 'Free Dutch Army' that had risen up to throw off the shackles of German oppression, no organization of partisans that were well trained, well equipped, and well motivated. There were just makeshift barriers that Panzers easily rolled over, small gangs of unorganized rebels, and Heer garrison traitors who had suicidally pledged loyalty to their preferred leader, leftovers from the civil war. Needless to say, morale was low as the panzergrenadiers smashed its way into the Netherlands, with soldiers acting with an unprofessional levels of dejection and casual disregard for the battle they were walking into, hoping it would end quickly and easily.\n\nThen they started to die.\n\nThose untrained, suicidal, needlessly rebelling men were putting up a fight. They were exploiting the carelessness of their enemies. Exploiting their mercy. They struck hard and fast, and with far greater ferocity than anyone could have guessed. To those loyal sons of Germania, it was the last straw. Twice, they had rejected German kindness; The first in refusing to reintegrate into the Reich, and second for daring to actually think they were fighting a war. Daring to think they actually stood a chance.\n\nSoon enough, the carelessness disappeared, replaced with an unspeakable level of rage towards their cousins. The Wehrmacht unleashed its full fury against the misguided Dutch and their few German allies. Cities were destroyed. Opposition was annihilated. No quarter was given, not until the Swastika flew over Amsterdam once again."
 goering_peace_events.9.a:0 "Aryan ferocity is not reserved for Untermenschen."
 GGR_annex_the_netherlands:0 "Annex the Netherlands"
 GGR_invade_the_netherlands: "Invade The Netherlands"
 Goering_netherlands_category:0 "Unternehmen Sichelschnitt"
 Goering_netherlands_category_desc:0 "Our lowland cousins have gone mad, surely they must have, for that can be the only explanation of such treachery. We have given them so much since we took them under our wing: safety, security, prosperity, and we even promised them eventual integration into the glorious Reich. It was not enough for them it seems, or perhaps they were led astray by the Judeo-Bolsheviks that still fester in the dark. We shall shine a light that will burn them out with its intensity."
 GER_final_ultimatum_HOL_start:0 "We will demand that the Dutch reintegrate into the Reich, or be crushed by the mighty hand of the Wehrmacht!\n"
 GER_integral_part:0 "The Dutch shall finally join their Germanic brethren in the Greater German Reich, forming five new §YReichsgaue,§! earning us cores in the formerly Dutch lands!\n"
 GGR_the_netherlands_conquered_tooltip:0 "We have succeeded in the conquest of §YThe Netherlands§!\n"