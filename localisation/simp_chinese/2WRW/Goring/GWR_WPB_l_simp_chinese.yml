 GGR_close_the_dam:0 "Block The Strait"
 GGR_our_great_spanish_friends: "Our Great Spanish Friends"
 GGR_our_great_spanish_friends_desc: "At the first look on Iberian vasts, amongst chaos and unending uprisings, it's very difficult to find those who can act as our ally in the future.\n\nHowever we could find a needle in a haystack - the Blue Front. A large armed formation of real Spanish patriots who see us as their friends, and separated from the pathetic falangists, is now gaining strength every day.\n\nIn the shortest terms we must supply them with everything we could. The fate of the whole of Iberia is at stake."
 GGR_send_them_guns: "Send Them Our Guns"
 GGR_send_them_guns_desc: "Be that as it may, our new Iberian colleagues are now on the verge of a logistical crisis, fully relying on the few reserves of Falangists under their control.\n\nFortunately, we do not experience such problems, and therefore we will begin to ship all the necessary types of weapons to the units of the Blue Front, from infantry equipment to machine guns and MANPADS.\n\nSufficient equipment with weapons is always the first step to victory."
 GGR_send_them_men: "Send Them Our Men"
 GGR_send_them_men_desc: "Although the Blue Front is an organization of the brightest and most loyal patriots, it is not so large in quantitative terms, which certainly complicates the already difficult fighting.\n\nBefore the front completely collapses, we will send our people to them. The Wehrmacht divisions will finally be sent to Iberia for support.\n\nThe start of the transfer of volunteers is scheduled for today."
 GGR_send_them_congratulations: "Send Them Our Congratulations"
 GGR_send_them_congratulations_desc: "In recent days, the Blue Front formations have eliminated all other contenders for leadership over Spain.\n\nFrom now on and forever, Spain will be presented to the world in the light of national-socialism, which is good news.\n\nWe still have the capture of the remnants of the Iberian Union ahead of us, but at the moment our embassy has officially opened in Madrid, and an invitation to join the Pact has been handed over to the new authorities of the Front."
 GGR_fall_blau3_desc:0 "After the fall of France, there's only Iberia stands to the west of the Reich. Like the Italians, the Iberian nations were once our allies during the World War II, and quickly became our opponents after the establishment of the New Order. To ensure the secure of our western border when the war with Italy begins, Iberia must be brought knee as soon as possible.\n\nMeanwhile, in Iberia, to prevent their inevitable falling into our hands, a desperate attempt was taken by Franco and Salazar-to merge their two nations into one Iberian Union. And after all these years of jealousies and disagreements, the Union manages to survive against all odds. But despite of how strong the fort Spanish and Portuguese have built is, they're naïve to believe that it can resist the power of the German Reich. Soon we'll be enjoying the blue ocean and golden sunshine of Atlantic on the western beach of the Iberian Peninsula and cheering at the success of Fall Blau."
 GGR_securing_france_desc:0 "As our plans for securing domination of the Iberian peninsula develop, it is time we turn our attention to a secondary matter, but one that is pressing nonetheless. The French State was able to wriggle free of our grasp in the chaos of the civil war, and it just so happens that they have the only land border with the Iberian Union that we could hope to exploit. Attempting amphibious assaults across the coast of Iberia is possible but significantly more risky than storming across the Pyrenees.\n\nThe French are of course far too weak to oppose us, even if they are independent now, so we will crush them easily. With our old puppet restored we'll be able to much more directly apply force to Iberia, and then to Italy and even Burgundy when their times come."
 GGR_a_multi_front_invasion_desc:0 "The military power Iberian Union holds is much weaker than any great power, and it's due to the tough terrain and forts in the hills that they believe they can resist our forces. And it's clear that direct frontal assault will be a idea that only fools would have a try. To prevent the unnecessary loss of the Heer, special forces will be tasked with the vital part of this campaign.\n\nWhen the war breaks out, our specials forces will immediately set out and breakthrough the enemy's front. Our paratroops will land from the air like eagles, our marines will appear from the sea like sharks, and our mountain infantries will sneak in and destroy their forts in hill like ghosts. Those Iberians have no point what modern warfare looks like, and this time we will show them about how huge the gap between their military forces and ours is."
 GGR_the_burgundian_method_desc:0 "For decades, terrorist groups all over the world have been receiving funding from Himmler and his slaves in the shadow state, which has caught great troubles us, and all he wants is to create as much chaos as he can so that he will be able to implement his secret evil plan. Of course, the Reich and his noble guardians will never become some filthy bastards like the Burgundians, yet we have to admit that sometimes the Burgundian ways are quite useful for us.\n\nTo ensure our current war plan against the Iberian Union, the Führer and his generals have decided that we will start to fund those terrorist groups in Iberia like the Eta, hoping to cause the stir in Iberia. And when Iberia was in havoc, the Union will have to scatter their forces in the whole peninsula. It may be seen a shame by some as we need to learn from those Burgundians, but it will be disgraceful if we cannot achieve a quick victory against the Iberian Union."
 GGR_fight_for_your_freedom_desc:0 "The first batch of founding and equipment has been sent into the terrorist organizations in Iberia, and they've started to cause more troubles to the Iberian century government. However, for now their activities are not enough to shaken the rule of the Iberian Union. Therefore, more assistance will be continuously provided to them and the flames in Iberia will burn even brighter.\n\nAnd you, my fearless freedom fighter who bravely stand up against the oppression of the Union, please allow the Reich to show our respect with our assistance. Yours is a restless life, and never shall you know peace, until you've freed your kinsmen from the iron cage made by the rulers in Madrid. Take comfort in the fact that, though you seem to be standing alone at present, the German Reich is always your faithful friend in any case."
 GGR_let_the_abwehr_run_wild_desc:0 "In recent days, more assistance has been sent to the Iberian terrorists, however their delegates are still asking for more regardless of how much they have received. Such greed has angered many officials in our government, and even the Führer himself has doubt about whether should we continue to fund those organizations, for they are planned to be eliminated as well once the conquest ends, and excessive fund may make them strong enough to fight against us.\n\nHowever, the officer of our Abwehr has persuaded the Führer to continue fund those terrorists, promising that everything is under their control, because no matter how strong they can become, they won't have any chance stand our invincible military forces. Convinced by their points, the Führer has grant the Abwehr full authority over our negotiation with those organizations. After all, some disorderly terrorists are much easier to deal with than Iberian regular army, and they are a far more distant threat to consider. For now, the Iberian Union is all we need to think about."
 GGR_thinking_ahead_desc:0 "In recent days, more assistance has been sent to the Iberian terrorists, however their delegates are still asking for more regardless of how much they have received. Some militarists, especially those in the Abwehr of the Wehrmacht, suggest that we can agree on their terms, since no matter how strong they can become, they won't bother the our military forces in the end, and for now the war against Iberian regular army is all we need to think about. However, the Führer has much cooler head than those officials, and he has made a more cautious decision.\n\nAccording to the Führer's command, we need to keep our funds to those terrorists at the minimum level instead of meet their needs. Every one need to learn that the Reich isn't their babysitter and they don't have rights to make demands on us. And more importantly, we only need them to distract the Iberian forces, and when the conquest of Iberia finish, they will be much easier for us to deal with if they have only received little help from us. Only an arrogant fool would help his potential enemies strengthen themselves, and we can never be allowed to commit such tomfoolery."
 GGR_north_african_connections_desc:0 "For thousands of years, North Africa has always been closely connected with Southern Europe, including the Iberian Peninsula. Considering this, our recent acquisition of Algeria and its neighboring land may make a great convenience for us in our planned conquest of the Iberian Union. And now, the chance has been offered to the Wehrmacht.\n\nUnder the governance of the Iberian Union, a lot of Portuguese who faced oppressed by the Union have expressed their willingness to help our war cause. We could use them to subvert the local government of the Iberian Union, and by doing this, we shall be able to weaken the resistance we're going to face when the war breaks out. The only problem is, however, there's no free help in this world, and their price is not low at all."
 GGR_the_best_training_man_can_find_desc:0 "The Iberian Peninsula has the most complex terrain in West Europe, and the Iberian people believes they can never be conquered by foreign powers under its protection. However, after years of conquest, the German Reich is big enough to own all kinds of terrains in this globe. From lush forest to steep mountains, from frozen land to muddy swamps, every kind of terrain made by the earth has been conquered by us, and the Iberian Union won't become a insuperable barrier to our forces.\n\nTo easily root out the resistance, our special troops will receive specific training designed for the landform of the Iberian Peninsula. And with the incomparable military power, the Reich will provide our courageous soldiers the highest standard of training in this world. When our special forces show up before their eyes, the Iberian soldiers will realize that the strength of the Wehrmacht is much far beyond their imagination."
 GGR_from_paris_to_madrid_desc:0 "Aside from weapons, vehicles, intelligence and strategy, infrastructure is also an essential factor in modern military operation. Though rapid progress in technology has been achieved by human since the 19th century, without smooth roads we may still reach into the same dilemma that consumed Napoleon Bonaparte's invincible army more than one hundred years ago. And the bad news is, decades of chaos have doomed the infrastructures in France, and the Iberian governments is also incapable of constructing a few modern roads. If we wish to invade Iberia from France, we're going to face the problem of slow marching speed and shortage of supplies.\n\nSuch a situation is obviously not what we wish to face, yet the Reich still needs to get it at any cost. Unlike those incompetent nations, the national socialist doctrine has given us unimaginable power to concentrate our nation's strength on the major tasks we're going to face. Time is running out for us, but no matter how impossible it seems, we'll build broad and unblocked highways and railroads from Paris to the heart of Iberia, and that's why the Third Reich is the unchallengeable hegemony of the world."
 GGR_from_alger_to_marrakech_desc:0 "With Algers under our authority the General Staff has been able to begin plans for the opening of a new front in the Iberian campaign. While out forces strike into the mainland of the Union, we can now deploy forces to the deserts of North Africa to capture the Iberian territories of Morocco. New air bases will be built on our little beachhead to facilitate troop and supply movement, along with a steady stream of combat aircraft to provide cover for our advancing forces. Our objective will be to seal off Iberian North Africa as a potential fallback point for our foes. We have seen with our own eyes the damage that soldiers from Iberian can do when operating out of their colonial possessions. Were we not the ones who helped bring Franco to Spain during their own civil war? We will not make the mistakes of the Second Spanish Republic."
 GGR_the_final_straw_desc:0 "Citizens of the Iberian Union, now military forces of the German Reich is ready to invade your pitiful country and there's no hope to resist against the strongest army on this planet. Your government has failed you, and your army is too corrupted to organize any real defenses against us. Your cities will be razed, villages will be pillaged, industries will be seized and everyone of you will be forced to work for the Reich whether you like it or not. In a nutshell, you and the Iberian Union, are doomed.\n\nHowever, there's still one opportunity for you to take. All we wish to destroy is the Iberian government and its loyalists, and anyone wish shares the same enemy with us can become our allies. We German people are benevolent and we'd like to show you mercy as long as you're feeling oppressed by the Iberian government and willing to fight against it. People of Basque, Catalonia and Portugal, please don't let this once-in-a-lifetime chance slip through your fingers! Stand up, join the German side! Together we can overthrow the bureaucrats in Madrid and rule the Iberian Peninsula as close allies."
 GGR_call_to_the_basques_desc:0 "Our initial plan about the total civil war failed, but it doesn't mean that all our efforts were in vain. The Basques have been oppressed by Madrid for a very long time, and their hatred towards Spain is getting ever stronger in these days. If we can get their support via some propaganda and diplomatic methods, their struggle in the north will do us a great favor in our war against the Iberian Union. To achieve this, a propaganda article haven been drafted by our diplomats.\n\n\"People of Basque, please hear our voice. You are one of the bravest nations in this world, and a close kin of we Germans ethnically. But for years, you've been humiliated, tortured and oppressed by the Spanish bastards. We do admire your unyielding determination to fight against it, but you cannot win this war on your own. Now please answer to our call of friendship and join this holy war against the Iberian Union. You will win your rightful place in our New Order once we succeed.\""
 GGR_call_to_the_catalans_desc:0 "Our initial plan about the total civil war didn't go well, but we can still reach out to those who had already been hostile toward the government of the Iberian Union before our propaganda. At the west of the Iberian Peninsula, the Catalans have been oppressed by Madrid for a long period, and they're willing to do anything for their independence. Though they've been polluted by decayed values and will be enslaved by us according to our post-war plan, we can still make a temporary alliance with them before the fall of the Iberian Union. To achieve this, a propaganda article haven been drafted by our diplomats.\n\n\"People of Catalonia, we know you may not like us, but it doesn't matter right now. Please think about it, is there any benefits for you to reject our proposal of alliance and friendship. Accept our invitation, fight alongside the German Reich against your enemies in Madrid, and you'll have the freedom you've craved for decades. As the most sagacious nation in Southern Europe, you won't forsake such a precious chance, will you?\""
 GGR_call_to_the_portugese_desc:0 "Unlike the fools of Basque and Catalonia, our agents in Portugal have brought us good news after our ultimate. There are a number Portuguese who hate the Iberian Union as much as us have expressed their wills about cooperation, and according to the Abwehr, this number could even be higher if we continue to make propaganda towards them. With the Portuguese on our side, the Iberian Union will collapse To achieve this, a propaganda article haven been drafted by our diplomats.\n\n\"People of Portugal, twenty years ago, the Spanish lied to you, cajoled you into the so-called 'Iberian Union'. But twenty years have passed, we know that you have through their true ambitions under the name of it. Are you an equal partner of the Spain, or a low servant in their eyes? You must have already gotten the right answer in your head, and now, the German Reich has come to give you a hand. Twenty years ago, that lie started with the fear of a fabricated 'German invasion', and now, after twenty years, you can end it with a real German invasion of Spain. Fortune is smiling on you, and please take this chance to correct your mistakes in the past, for you won't have a better one more.\""
 GGR_but_no_one_answered_desc:0 "Hearing our call of friendship, many Iberians contact us and expressed their expectation for an alliance with the Reich. The Reich, of course, appreciates their good intentions, but it is a shame that the luck doesn't stand on their side even though they made the right choice. Considering the current situation in Iberia, they're not needed anymore. And since they're definitely not racial brothers of the Reich, there is no reason that they could enjoy any privilege that other Iberian people shouldn't have. Any promises we made before will be defined as fabricated and invalid, and they will be treated like all other dissenters and the Iberian scums. All must understand that no one can bargain with the German Reich, and total submission is only way he can take.\n\nAnd after dealing with those bastards, all memories of our promises will disappear with them. No one is going to know what happened during our conquest of Iberia, and all Iberians will live equally in fear from this time on."
 GGR_demand_absolute_loyalty_desc:0 "Dissenters never disappeared in the Iberian Peninsula: in this past, they keep criticizing the rule of Franco and Salazar, saying their authoritarian regime is an oppression of everyone in their nation; and now, we know that many is hostile toward our governance and secretly cursing our soldiers, generals and officials. They won't be able to do this anymore. The former rulers of Iberia didn't succeed in suppressing those dissidents, and their failure has leaded to their final collapse before our forces. We, with our advanced experience of purging those insects in other places, cannot repeat their foolishness.\n\nFrom this day on, all Iberians must be totally loyal towards the German Reich. Every move they make, every word they speak and every mood they expressed will be closely watched by our agents, and any sign of disobedience will lead to imprisonment or even execution. They can have no doubts, no hesitations and even no free thoughts, for all they need to know is to follow our orders. They used to think they cannot stand anymore under the 'oppression' of the Caudillos, but now they will understand what true oppression really means."
 GGR_no_more_games_desc:0 "The ghost of terrorism has been haunting around Iberia since the conclusion of the Spanish Civil War, as different organizations directly fighting against the government all over the peninsula. And the Iberian government, due to their inefficiency and corruption, never really suppressed those terrorists. Consequently, the strength of those organizations kept growing and caused more and more troubles every day. Eventually, the prosperity and stability of the Iberian Union was doomed in constant violence and riots.\n\nBut now, we could tell those terrorists that, their good old days are gone. Failing to pacify its own realm is a shame for a nation, and we cannot act like those Latin scums. There will be no more stupid childlike games between police and terrorists, for now the real anti-terrorist campaign is going to start."
 GGR_raze_barcelona_desc:0 "Barcelona, the capital Catalonia, has degenerate into the source of terrorism, political violence, separatist organizations and leftist activities. All devils in Iberian has made their home here, and set out to poison the whole Europe from Catalonia. Such a polluted city is absolutely incompatible with our national socialist doctrine, and it will be totally razed to the ground to cleanse its sins.\n\nNow, Catalans, take one last sight of your corrupted home. Adéu, Sagrada Família, sadly you didn't get your people redeemed; Adéu, Hospital de Sant Pau, it's shame you can save your people's lives but not their souls; Adéu, Palau de la Música Catalana, from now on there will be only German military music can be heard in Catalonia. Adéu, the heart of old Catalonia, the Sodom in our age, may all the evils can die with you in our holy flame of cleanse."
 GGR_contain_the_terrorists_desc:0 "Iberia is large, and any attempts to govern the Iberians with one single political body may lead to low efficiency and failure to maintain local stability, as the Iberian Union has showed us. Luckily for us, from the beginning of our conquest we've noticed this problem and set up 6 different MWs in total with each one dealing with one specific region in the peninsula. Divide, conquer and rule over, such a strategy is as old as time itself, and we shall implement it here.\n\nIn addition, to avoid the possible risk of communication and cooperation between different ethnic groups in Iberia, we need to divide those people with enough caution. Population for each MW must be carefully designed so that each MW may be able to handle their own realm on their own without needs to worry about a total uprising. Through the scientific administration the Reich can gain as much as resources and maintain the peace and stability of the Iberian Peninsula."
 GGR_always_vigilant_desc:0 "The conquest of Iberia is indeed a great victory for the Reich, and we did have reasons to celebrate for it. Yet it would be foolish to ignore the threat of other powers in the world that still seek any opportunity to weaken our fatherland, especially the OFN and its American master. Each German victory in Europe is a warning of them, and scared of the mighty military power we hold, their subversive activities is getting more and more frequent. And thus, our soldiers must stay vigilant enough at any time.\n\nFor the US, Iberian Peninsula is westernmost part of Europe and therefore has great strategic values. Our agents reported that secret ships and OFN spies have been sent from their ports to Iberia. Due its distance between Germania and Iberia, we may not be able to deal with the sudden case there and as the result, we can only rely on the sense of responsibility of our local occupied forces. All ships that move near our coastline must be cautiously checked and make sure no one can sneak into the Reich. The security of Europe is in our troops' hands."
 GGR_close_the_dam_desc:0 "In history, Gibraltar, as the gateway of the Mediterranean Sea is the key of global trade for Mediterranean nations, which includes many of our former and future enemies. Considering this, one reason of our Iberian conquest is to control the lifeline of Italian international transportation and trade so that we can weaken their economy a lot and even make it collapse without a military campaign. And now, as the whole Iberian Peninsula has been firmly controlled by the Reich, we are able to cut the throat of the Italians and destroy their ability to sustain themselves.\n\nToday, according to a direct order from Germania, several ships from the Kriegsmarine shall block entrance and exit for all non-German ships, with orders to shoot unless all Mediterranean nations surrender to Germany, either willingly or by force. While the official reason for this is \"to protect German people, sea vessels and goods from aggressive and barbaric actions from the Italian sphere\", its clear to see that it's a thinly veiled strategic manoeuvre from Germany to cut off Italian trade from the Atlantic, and hoping it will cause their economy to plateau. While this will definitely be the death of Italo-German relations, Göring simply laughs at the matter, as he plans to be visiting the new German city of Rome by the end of the year."
 IBR.90.t:0 "Göring Wins The German Civil War!"
 IBR.90.d:0 "The whole political world of Iberia was in chaotic uproar, entire ministries in utter pandemonium, with civil servants rushing from meeting to meeting, each more depressing than the last in its tone and content.\n\nThe disastrous news that had reached them this morning from Germany had awakened an ice cold terror in many a strong man. Göring, the proud, fat oaf, who had had the immense backing of most Wehrmacht personnel, was now the new Führer of the destroyed Reich, now but an army with a half functioning state. He had vanquished his opponents in hellfire, carving a deep scar into Germany, one that was unlikely to heal soon if ever. The unwavering militarist was likely already crafting extensive plans for foreign policy escapades with his hawkish advisors, while all around him ordinary people were suffering abject poverty and devastation.\n\nAn emergency council meeting had been called when the official declaration of victory had come from Germania, both Caudillos fearful of the danger that may soon face Europe and Iberia. Salazar seemingly had first been surprisingly joyous that it was not Heydrich who had climbed the iron throne of the Reich, but he also shared his Spanish counterparts apprehension of what an openly militaristic Germany could symbolise for their future. Their only hope was that the Reich still needed time to repair and prepare its offensive forces. If we act quickly we might be able to hold off the Germanic horde when it comes."
 IBR.90.a:0 "We must prepare, fast!"
 IBR.91.t:0 "The Pyrenees Line"
 IBR.91.d:0 "The emergency council meeting concluded with a series of intense measures that were to be undertaken with immediate effect, one of these was the reactivation and expansion of the Pyrenees defensive line. The mobile Germans had proven themselves expert in defeating, or rather avoiding, strong defensive positions in their last European conquest to encircle troop contingents and rush strategic targets.\n\nHowever, times have radically changed. More effective and efficient defensive installations have been invented to compliment that are able to compliment the natural fortification that the Pyrenees Mountains gives our great Peninsula. Even more importantly military analysts have also concluded that the German hordes had enjoyed a great deal of luck in the conquests of France and the lowlands, something we will not allow them to have if they dare knock on our doors. However, some of our high command, especially those who advocate for increased special force use, have warned of naval invasions to try to take key strategic ports or possibly even the vulnerable Gibraltar dam itself. Although not an impossibility we still have deemed the Germans under Göring will prioritize a direct approach."
 IBR.91.a:0 "Hopefully it can hold them."
 IBR.93.t:0 "Fortify Equatorial Africa"
 IBR.93.d:0 "Just a decade ago, the fat Reichsmarschall had had the brilliant idea of seizing the Portuguese colonies in southern Africa, a bold move to consolidate German control in the region during the formation of the vast African Reichskommissariats. One that fit in well with Hitler's intense megalomania. It was what had driven the pragmatically opposed Caudillos in each other's arms in the first place, the starting shot of Iberian unification which Salazar had initially opposed based on sovereignty issues. With the loss of his treasured African colonies however, he had no other choice but to accept Franco's proposals for a united front against the reviled Germans.\n\nNow, the German Civil War was over, and the hated Göring stood victorious over his defeated foes. The expansionist, the military man. In time he would certainly bring the African Reichskommissars back under his jackboot and look to Equatorial Africa as another target. It was a simple assumption to make; therefore one Göring was likely to take into consideration.\n\nDespite the region originally having been a Spanish colony, Salazar was ecstatically pursuing plans to fortify the last Iberian stronghold below the Sahara. For once, for the usually collected Caudillo, this had become a matter of pride and prestige; Franco also not eager to lose what formally was just his colony, did not sit idly by either. Extensive plans for strong fortification lines and subsequent guerilla warfare, once the lines would be breached, were drafted, military high command eager to follow the lead of their Caudillos as they saw the strong strategic use of drawing away more German forces from the European theater. The Nazis would have to fight hard and suffer bitterly for our land in the sun."
 IBR.93.a:0 "Spare no expense."
 IBR.96.t:0 "Ensuring Iberian Unity"
 IBR.96.d:0 "In an unprecedented move of unity both Caudillos announced during a recent council meeting that in the face of the immense external danger Göring's Germany was currently posing to Iberia's survival and integrity, that both wanted to deepen the solidarity that the Iberian peoples felt towards one another. Therefore propaganda tools during the upcoming weeks should be focusing on painting a beautiful picture of a splendid union of equals, united in diversity against the painful conflict and conquest that Göring would bring upon Iberia, reminiscent of the horror of the Spanish Civil War.\n\nThe terrified council members left the conference room in a dreamlike state, both eager to impart the Caudillos message into public policy but also happily shocked by the unprecedented cooperation between both Caudillos. On this matter the two old men had finally come to full agreement, both were too fearful of the danger that was strengthening just beyond the horizon, a bond reforged that first had been set in place by the same man they now again may have to confront. Salazar even agreed with Franco to push total Iberian unity for the sake of a better prepared union. He also eventually caved to Franco's s suggestion to deal harshly but quietly with any resisting elements to the state, again a move towards better stability and unity. Everything and anything would need to be done to prepare for a dark tomorrow."
 IBR.96.a:0 "We're all Iberians, right now."
 goering.blau.1.t: "President Sidos Visits Germania"
 goering.blau.1.desc: "Schneider's staff surrounded around the office television. The pale smell of cigarette smoke wafted into the spinning ceiling fan, and Schneider rarely felt so happy. To know the Führer was meeting with the leader of France and that Schneider was just about singlehandedly responsible was more than uplifting. To know they might join the Reich once more was gratifying beyond recognition, even with the best diplomats bureaucracy could breed notwithstanding. Tobias took another drag from his cigarette.\n\n\"You not smoking Schneider? Even in the presence of the great jewellery shop himself?\" A small crowd behind Tobias chuckled, half of them with eyes fixated on the screen. \"Jesus, look at him,\" Tobias pointed at the image of Göring walking with Sidos down the halls of one of the countless buildings in Germania.\n\n\"Looks like encrusted with diamonds balloon,\" one accountant said. \"More like a heart attack with legs,\" said another. A few chuckles broke out across the cramped office, some more confident than others. The room went quiet, as focus readjusted on the pair walking down the halls. The room focused on the hum and narration of the television again, listening for the conversation.\n\n\"...and a special announcement comes with it! With a series of agreements, France's reintegration into the Reich has been confirmed! Already...\"\n\nA series of contained hurrahs and \"hey-heys!\" broke out, and died down after a dozen or so seconds of celebration. Walking to the front of the office, Schneider raised his hands to the small crowd assembled.\n\n\"Now, everyone, listen up. I just want to say good job all-\" A round of applause broke out \"-but we need to straighten out. Now. No more of this 'Balloon Göring' shit. We do that again, we'll have Schörner to answer to."
 goering.blau.1.a: "Understood, Herr ambassador."
 goering.blau.divorce.1.t:0 "The OFN and the Portuguese blockade"
 goering.blau.divorce.1.desc:0 "Fall Blau is now solidly underway. The division of what remains of Spain and Portugal is being implemented, and as a measure to put an end to future resistance it is imperative that sea access be monitored and controlled. Particularly, Portugal's immense water border and extensive overseas contacts and trade mean that this is an acutely porous section of our naval control, and it must be rectified. The Kriegsmarine has already put forward a number of monitor and blockade vessels, but it is clear the fleets will need to be buttressed in size if we are to be successful. The only question then is to determine the requisite size of the task force needed, and a proposal has been put forward...\n\nBy redirecting a handful of other vessels from patrols in the North Sea and the Atlantic we could possibly achieve an operational blockade. However, the admiralty has stressed in no uncertain terms that this 'pittance' of ships will not stop a determined foreign power from penetrating the naval cordon. They request - insist, in truth - that the deployment of the fleets in the region be redirected to create a floating wall that will ensure an absolute blockade of Portugal.\n\nYet, such a massive fleet concentration in a global flashpoint runs the risk of engaging the globe's naval powers; a challenge by America's Navy could arise and would have the potential to spiral into something far worse."
 goering.blau.divorce.1.a:0 "Send the fleets, nothing gets in or out."
 goering.blau.divorce.1.b:0 "They shall make due with what they can spare."
 goering.blau.divorce.2.t:0 "A 'dissapointing' result"
 goering.blau.divorce.2.desc:0 "'Lieutenant, report.' The Captain maintained his straight-laced and rigid pose as he barked over his shoulder.\n\n'Nothing, sir. ESM, Radar, and visuals are all negative.' The younger man replied as crisply as his Captain demanded, but the demeanour of the young officer - of all the crew, by this point - was slipping. Readiness was maintained at all hours, patrols stretched into days, and the Captain was certain that the foreign enemy would come precisely when the crew least expected it. It was beginning to wear on the men.\n\n'Sonar.' It was a command, not a question. A furtive moment passed before the young officer looked up from his display and slipped the headset off of his ears. 'Biological contacts, bearing 273.' The man rubbed his eyes. 'Whales, sir.'\n\nThe Captain looked out to the horizon, perhaps in an effort to spy an enemy himself where the ship's sensors could not. The man was genuinely disappointed. His superiors in the Admiralty pushed for more ships to be deployed to secure the blockade, true, but they sincerely hoped the Americans would be drawn out by their challenge. He knew they would cower in the face of their naval dominance, but to not send any response at all? Not a single task force, or even a single blockade runner? The Captain's mood began to match that of the crew. Perhaps if Göring - that fool - used his head and sent the battleships, or another fleet altogether, then surely the Americans would have responded."
 goering.blau.divorce.2.a:0 "'Helm, change course. Bearing 273.'"
 goering.blau.divorce.3.t:0 "A Bitter Medicine"
 goering.blau.divorce.3.desc:0 "Ferdinand Schörner reads the orders one by one, his hands trembling and his jaw clenched so tightly his teeth almost crack. \"That bastard!\" he screams as he looks at the confirmation of what he had been suspecting for a while: even though the documents on his desk are no statement of intents, or explicit declaration, a seasoned general such as him can quickly grasp the subtleties of such an intricate web of orders and dispatches.\n\nOne by one, officers loyal to him have been sent to extremely dangerous areas with barely enough forces and supplies to prevail at high cost. While some had indeed won, others - many others - had perished \"like true heroes of the German people\" as Göring never tired to proclaim to the masses, only to be replaced by officers who swore their allegiance to the idiot.\n\nThe desk trembles as the general slams his fist on it, but soon burning rage turns into cold need for revenge. A smirk makes its way on the man's aged face: \"Oh Hermann, you shouldn't have done that...\" he muses as he collects the documents, then he calls for his attendant. \"Karl, make several copies of these documents and have them sent to the members of the Oberkommando: they are important reports on enemy activities, and all should study them with utmost attention\"\n\nAs the man salutes and leaves, Schörner chuckles, already tasting the results of his move. While none of the papers directly accuse the bastard of having killed German officers loyal to the militarists, they will be enough to paint him as a poor commander who makes very poor choices, and the German military is no place for incompetents..."
 goering.blau.divorce.3.a:0 "He'll pay for that, in due time..."
 goering.blau.divorce.4.t:0 "Inveniam Viam Aut Faciam"
 goering.blau.divorce.4.desc:0 "With the annexation of the Iberian peninsula completed, it's now time to set up a functional administration of the conquered lands. The first issue plaguing our newly-established Militärverwaltungs is logistics: months of bombings and fighting have left the Iberian infrastructure - not the most developed one to begin with - in a pitiful state. Roads and railroads are filled with holes and craters, bridges were demolished by the retreating Iberian forces, and the docking facilities were abandoned after we enacted our embargo.\n\nWith this sorry state of affairs, our garrisons lament delays in supplies, while partisans and rebels strike from forests and hills to steal weapons from our convoys. Should this keep going, we might face worse problems than a couple terrorist attacks, therefore a comprehensive initiative must be taken in order to improve the state of Iberian infrastructure.\n\nWe have several choices, each with its caveats. On one hand, we can concentrate on Militärverwaltung Kastilien and make it the infrastructural hub of Iberia: with its central position, encompassing the former capital of Madrid, it would be a cheap solution with great potential results, but Reichskommissar Hitzfeld is known for supporting Speidel, which could further aggravate the infighting among the Iberian subdivisions. On the other, we can equally spread the development efforts between all administrative units: this would be more costly and less efficient, but no one would complain about lack of funds. Finally, we can simply forego land infrastructure and have everything delivered from Germany by ship, by improving the Northern Iberian port facilities: this would be the safest choice, but also the most expensive, and our finances aren't exactly looking good at the moment..."
 goering.blau.divorce.4.a:0 "Focus on Kastilien!"
 goering.blau.divorce.4.b:0 "Equally spread the costs and benefits!"
 goering.blau.divorce.4.c:0 "Doing by ourselves is much better!"
 goering.blau.divorce.5.t:0 "Widespread Looting In Iberia!"
 goering.blau.divorce.5.desc:0 "Ever since the first garrisons were installed, reports of conscripts \"integrating\" their pay with small bribes and petty theft were a regular occurrence, if a minor one. In the last weeks, however, reports have grown more and more worrying: from refusing to pay for their beers or taking a chicken from a grumbling farmer, reports speak of stolen artworks from museums, nightly incursions into rich households and even rape and murder!\n\nThe population is protesting against this situation, and despite our efforts to crack down on the dissenters they defy our authority! If we don't quickly find a solution terrorist will find fertile soil for new recruit, and we'll have to face a much more powerful enemy...\n\nSeveral among the Oberkommando have reacted harshly at the news. They request an immediate suppression of such shameful conduct, and the reinstatement of what they call \"true Prussian discipline\" in the Iberian garrisons: while the most sensible solution, this would also anger the local garrisons, whose pay is quite low already. A halfway solution would be limiting the looting to the Militärverwaltungs of Portugal, Galizien and Andalusien: since they are much more controllable, it would be easier to repress any revolt there and keep the garrisons there happy.\n\nFinally, we could also refrain from taking any action, and let the looting continue. While a barbarian measure, looting ensures our soldiers stationed there don't complain about their salaries: this might further enrage the Iberian population, but our coffers will surely thank us for that..."
 goering.blau.divorce.5.a:0 "Punish these criminals!"
 goering.blau.divorce.5.b:0 "Limit the looting to manageable zones!"
 goering.blau.divorce.5.c:0 "Pecunia non olet..."
 goering.blau.iberian_wars.1.t:0 "The Iberian Union in Flame"
 goering.blau.iberian_wars.1.desc:0 "In this world of turbulence and tension, just a single spark can ignite great disasters and consume nations. To the joy of Schörner and his men, Iberia has exploded into warring factions; ethnic separatists rise up, ideologies clash and brother fights brother in the streets. Yet another civil war has broken out in Europe, and as the Führer well knows, there is nothing more devastating to the national psyche of a nation. For now, the Reich shall wait with eager anticipation as the Iberian Wars rage on and the Militarists celebrate Göring's success."
 goering.blau.iberian_wars.1.a:0 "A toast to the flame in Iberia!"
 goering.blau.iberian_wars.2.t:0 "An Offer For Keen Ears"
 goering.blau.iberian_wars.2.desc:0 "The war goes on, and our victory is near! As our troops advance, however, we must not forget the future: once Iberia is in our hands, we'll need to establish an administration to ensure tributes are paid, and a garrison to protect said administration from terrorists and partisans.\n\nIn order to reduce our reliance on German soldiers, we can enact a \"recruitment campaign\" aimed at Iberian soldiers and bureaucrats. Surely some of them share our views, and many more must have realized by now that the war is going to end soon, in our favor: all those we convince to switch sides now will form the foundation of a collaborator movement to bolster our occupation forces!\n\nHowever, the Iberian counterintelligence will surely try to hinder our recruiting efforts, which means we have to concentrate on a single front. Either we try to sway the bureaucrats, in order to have people who know where to look for money, or the soldiers, in order to increase our loyal garrisons once the war is over. What should we give priority to?"
 goering.blau.iberian_wars.2.a:0 "We need loyal bureaucrats!"
 goering.blau.iberian_wars.2.b:0 "We need to bolster the garrisons!"
 goering.blau.iberian_wars.3.t:0 "Spanish Collaborators Infighting!"
 goering.blau.iberian_wars.3.desc:0 "Dire news from the frontline! After our efforts in recruiting several Spanish deserters to bolster our ranks, they have come to clash with our allies of the Frente Azul, who consider them traitors two times: the first time, for siding with the enemies of the Frente, the second for betraying their oaths and switching side, even if in our favor.\n\nUntil a few weeks ago, the infighting was mostly limited to insults and recriminations, but recently things have escalated. First the soldiers of the Frente Azul refused to fight alongside the collaborators, then came the brawls, then knife fights, and finally the two sides started shooting at each other: yesterday, a German officer who tried to broker an armistice got caught in the fire and died!\n\nWith several German witnesses present to the murder scene, it's evident that all the fault is to be blamed on the Frente. They started the hostilities, and even refuse to apologize for the officer's death, saying it was the collaborators' fault! Such a conduct requires punishment, and many among the High Command request we sever any tie with the Frente, though some argue that we do need their help in the war... What should we do?"
 goering.blau.iberian_wars.3.a:0 "The Frente Azul is no ally of the Reich!"
 goering.blau.iberian_wars.3.b:0 "We still need them though..."
 goering.blau.iberian_wars.4.t:0 "Protecting The New Order"
 goering.blau.iberian_wars.4.desc:0 "Now that Iberia is fully under our control, we need to establish an agency tasked with keeping order and fighting terrorists and partisans from the shadows. While the garrison protects our assets and administration from direct attacks, the Agentur zur Seperatistenbekämpfung - ASB for shorts - will hinder terrorist recruitment and propaganda and try to locate and severe weapon supplies and funds.\n\nSince we don't have an abundance of resources to dedicate to the new agency, we have to choose our priority. In order to try and save funds for other campaigns, we could employ collaborators, mostly the soldiers who deserted from the enemy after our recruitment efforts: they would be much cheaper to employ, and would be more efficient in infiltrating the partisan organizations, though their loyalty isn't certain.\n\nOn the other hand, we could play safe and rely on our own operatives to run the agency. Their loyalty and professionality are unquestionable, but it would be much more expensive to pay their salaries, and they would meet obvious difficulties in trying to mingle with the locals. What should we do?"
 goering.blau.iberian_wars.4.a:0 "Recruit the Spanish collaborators!"
 goering.blau.iberian_wars.4.b:0 "We can't trust turncoats!"
 goering.blau.iberian_wars.5.t:0 "Terrorist Attack in Barcelona!"
 goering.blau.iberian_wars.5.desc:0 "Terrible news today! This morning, a car bomb was detonated in front of an important barrack - formerly a police station near the Sagrada Familia - used by the German garrison in the city, killing the sentinels stationed outside; immediately after, more than two dozen terrorists stormed the building, slaughtering the entire detachment of twenty Heer soldiers before they could retreat to the fortified bunker. Not content with the wanton destruction they had caused, the bastards stole all equipment they could take and then disappeared in the sewers!\n\nNow, the ASB faces harsh criticism from the High Command in Germania for their inability to predict and thwart such a large partisan operation. Whether this failure is to be blamed on inefficiency, lack of funds, or other, darker truths, remains to be seen, but one thing is certain: as Feldmarschall Ferdinand Schörner said right after announcing a thorough investigation on the matter, \"there will be consequences\""
 goering.blau.iberian_wars.5.a:0 "Damn partisans!"
 goering.blau.iberian_wars.6.t:0 "Traitors In The ASB!"
 goering.blau.iberian_wars.6.desc:0 "After a thorough investigation by the Orpo and the Abwehr, German authorities have discovered why the terrorists managed to launch such a large attack against the occupation garrison. The results of the inquiry are unquestionable, and extremely serious: several prominent collaborators, former Iberian deserters employed in the Agentur zur Seperatistenbekämpfung after the end of the war, were in truth double agents!\n\nUnder the cover of \"infiltrating terrorist organizations\" or \"launching secret operations\" they acted as liaisons between the ASB and the partisans, relaying information to let them escape from potential police operations or know the exact location of valuable supply convoys.\n\nthe last attack, however, backfired on the traitors: the magnitude of the operation, and the inefficiencies showed by the Agentur after it, were such that the Orpo immediately suspected the involvement of some agents within the ABS itself, but not even they could imagine such widespread corruption and treachery!\n\nThe consequences promised by Ferdinand Schörner materialized overnight, with an entire Heer division storming offices of the Agentur all throughout Iberia, massacring the collaborators without even waiting for a proper trial. Now, his troops are conducting \"anti-partisan operations\" in all Militärverwaltungs, showing a degree of brutality unheard of even during the war: Spanish and Portuguese citizens are being executed in the hundreds with even the slightest hint of having contacted a partisan, be it as a family member, former friend, or even the baker who sold them a loaf of bread! This will surely exacerbate tensions in Iberia..."
 goering.blau.iberian_wars.6.a:0 "Someone stop Schörner!"
 goering.blau.iberian_wars.7.t:0 "Schörner takes over the ASB!"
 goering.blau.iberian_wars.7.desc:0 "After a thorough investigation by the Orpo and the Abwehr, German authorities have discovered why the terrorists managed to launch such a large attack against the occupation garrison. While no traitors were found in the Agentur zur Seperatistenbekämpfung, the investigators unveiled several grave deficiencies in the orgaization: lack of funds, nepotism, lack of spirit and general incompetence ensured that the ASB utterly failed to curtail partisan and terrorist activities in Iberia! Slowly but steadily, the Iberian nationalists grew bolder, launching daring operations, until the last attack in Barcelona.\n\nThe operation, however, backfired on the terrorists, as the scope of the raid prompted the swift reaction of the German military: after receiving the results, Feldmarschall Schörner has acted swiftly and decisively, de facto disbanding the Agentur, with several commanding officers either discharged with dishonor from the army or outright imprisoned for crimes against the Reich, and replaced it with an entire Heer division utterly loyal to him.\n\nnThe consequences promised by Ferdinand Schörner materialized overnight. Now, his troops are conducting \"anti-partisan operations\" in all Militärverwaltungs, showing a degree of brutality unheard of even during the war: Spanish and Portuguese citizens are being executed in the hundreds with even the slightest hint of having contacted a partisan, be it as a family member, former friend, or even the baker who sold them a loaf of bread! This will surely exacerbate tensions in Iberia..."
 goering.blau.iberian_wars.7.a:0 "Someone stop Schörner!"
 goering.blau.iberian_wars.9.t:0 "Catalonian Terrorists Under Control!"
 goering.blau.iberian_wars.9.desc:0 "After several months of open skirmishes and underground war, the Agentur zur Seperatistenbekämpfung reports that the CNT and the other partisans operating in Barcelona have become more than a nuisance than an actual threat to German control of Catalonia. While no one expects to ever be able to solve the issue, losses in both personnel and equipment have dropped significantly, and this is already a progress. With our increased control over the region, we can now fully exploit its industrial basin without fear of large attacks or uprisings."
 goering.blau.iberian_wars.9.a:0 "Sehr Gut!"
 goering.blau.iberian_wars.10.t:0 "A Strongly-Worded Complain"
 goering.blau.iberian_wars.10.desc:0 "To Hermann Göring, Führer of the German People.\n\nWorrying reports have come to my attention from the Agentur zur Seperatistenbekämpfung. They state that \"it is considered as proven that troop movements and general directives from the Reich\" have had the effect of \"cornering the partisans until they were forced to a general retreat into Militärverwaltung Andalusien\" but, strangely, \"no final offensive followed\"\n\nThis has been interpreted by some in the Oberkommando der Heer as a deliberate move to seclude the Iberian partisans in Andalusien, with a few even daring to presume that this was a way to \"punish\" Reichskommissar von Hirschfeld for being supposedly \"close\" with me. While I consider such thoughts borderline treasonous, and have taken utmost care to ensure that no one dares to put their Führer's dedication to the final victory of the Reich over its enemies, this doesn't remove my worries.\n\nIn order to ease the worries of these prominent members of the Oberkommando, and prove to them that, indeed, their leader listens to their thoughts and desires, I humbly demand that an investigation is launched and, should it be proved that someone indeed plotted to endanger von Hirschfeld's tenure or even his life, that all those involved in such a heinous plan are punished in an exemplary way. I'm confident that you will realize my sincere desire to serve the Reich, and see justice triumph over treachery and envy.\n\nHeil Göring! \n-Ferdinand Schörner."
 goering.blau.iberian_wars.10.a:0 "This is not good..."
 goering.blau.iberian_wars.11.t:0 "Victory in Gibraltar"
 goering.blau.iberian_wars.11.desc:0 "Once more we have secured victory over our foes. Our troops on the ground broke through Gibraltar's defenses with fire support from our planes and ships, and it was not long before the Swastika flew over the strait in all its glory.\n\nThough stemming from a small conflict, our victory has ensured German control over the Iberian Peninsula as we now hold the gateway of the Mediterranean Sea. How the enemy will react to our triumph, however, is a mystery. Will they accept defeat, or escalate the conflict? Not even victory can bring relief to our sleepless Führer."
 goering.blau.iberian_wars.11.a:0 "How long can this victory last?"
 goering.blau.iberian_wars.12.t: "The Blue within Red"
 goering.blau.iberian_wars.12.d: "The fact that the Iberian Union fell apart was of no surprise to the Reich or even the rest of the world; an artificial state created solely for the purpose of defending against potential German invasion was doomed to fail, and it was only a matter of time before Spain and Portugal divorced. What no one could anticipate was just how spectacular that divorce ended up being, how the children were now scrambling and murdering each other over the inheritance. Perhaps it was fitting to watch it implode in such a spectacular fashion, serving as a perfect example of what happens to those who openly defy the will of the Führer. Now that the magic talisman that was their union had shattered, there was nothing left to ward off the Wehrmacht, currently assembling and plotting how best to bring them to their knees.\n\nAnd yet, in the midst of chaos, there was also opportunity. Not for the Spanish or the Portuguese, mind you; their very existence was soon to be erased from the map. Rather, something even better was in store for Fall Blau, beyond the fact that their enemies were now killing each other in droves and destroying their own ability to effectively wage war.\n\n\"Is there any faction which could be considered friendly to our interests?\" Göring asked, trying his best to make out the mess of the map before him which currently depicted the situation on the Iberian peninsula. Between secession movements, civil wars, and the so-called 'legitimate' Iberian government still kicking around, it was impossible to get a good grasp on just about anything. \"Not at the moment.\" Speidel replied, as he leaned in to point towards the Northeastern part of the country. \"The Falangists are the closest thing to it. A small but significant portion of their population and officers have German sympathies, but the overall leadership remains hostile. I've already given orders to Gehlen to start positioning the Abwehr to exploit those sympathies. If all goes well, they can force a changing of the guard, or at least give us a horse in the race. We can avoid a full-scale intervention in favor of a proxy conflict.\" An appealing prospect, no doubt, but not according to the ringleader of the militarists. As if on cue, Schörner was there once again, objecting to Spiedel with the same consistency as a call-and-response duet.\n\n\"That's the most important part, isn't it? 'If all goes well.' What he means by that is 'with enough resources.' We need not make the same mistakes of the past. Hitler won the last Iberian War in Franco's name, and within the decade, he had already begun plotting against him. If we feed this lazy, deceitful monster further, they will surely do the same!\"\n\nGöring wasn't sure if Schörner's objections could be considered legitimate or not, but what he was certain of was that indulging in Speidel's plan would take time. Enough time to cause complete economic collapse in the Reich? Probably not, but without a steady stream of plunder, the situation would continue to decline. Allowing the war machine to delay now might mean allowing it to grind to a screeching halt later on. A direct assault would be more costly, but would also allow him to reap the spoils without hesitation. A compliant ally, by contrast, was a safer bet, but a less profitable one. Not to mention the possibility of failure, which would send them back to the drawing board with nothing to show for it. Ultimately, the only question was whether or not yet another puppet regime was worth the wait. As the eyes of his two field marshals and the many other generals of the room bore into the Führer, he knew that he couldn't delay this decision. After a moment of consideration, he leaned forwards and spoke."
 goering.blau.iberian_wars.12.a: "Time is money, and we have little of either. We march."
 goering.blau.iberian_wars.12.b: "You can't put a price on loyalty. Tell Gehlen to get to work."
 goering.blau.iberian_wars.13.t: "Plus Ultra"
 goering.blau.iberian_wars.13.d: "The \"Blue Division\" was a name that brought back memories of better times. Simpler times, when Göring had no strings and no daggers pressed to his back. When he was of lesser rank but much greater happiness, and all the struggles were worth it, for they at least had a proper goal, a realistic, planned  outcome. Intervention in Spain, for one; the mission was to ensure that Francisco Franco won his civil war, thus spreading Fascism to an additional country and securing another ally against Communism. As it turns out, Realpolitik trumped ideological unity in the mind of the Spanish dictator, and thirty years later, the second Führer was attempting to topple the very same dictator that the first had propped up. The irony would have been amusing if it wasn't so infuriating, if the bastard had displayed an ounce of gratitude for once in his life.\n\nThat being said, there was still some very minor cooperation with the Francoist regime after the first Spanish civil war, just not to the same extent as Germany would have liked. During the Second Weltkrieg, he had been gracious enough to send a division of volunteers over to the Eastern front; a legion of strong, honorable Spaniards who sought to return the favor to the nation that had rescued them from leftist tyranny. They were not particularly notable, nor were they elite in any manner, but they did their job and had a fondness for the Reich, which was all that they needed in those desperate days where every single man was required to ensure victory.\n\nAnd yet, those very unremarkable men would now be the ones who would change history itself.\n\nA new faction had risen up in the Iberian Wars, brought about from dissatisfaction with the existing Phalangists and their inability to secure victory. Some of them were direct veterans from the Eastern Front, now officers and politicians who had led the coup against their less Germanophile comrades; some were their children, following the cause that their fathers had championed and now fighting on the front lines to secure a better future. Some had no connection to the Blue Division at all, and simply sought them out purely out of personal loyalty to their beliefs, inspired by their words and actions of both past and present. All the same, their combined efforts had created far more than just a single division. Instead, they formed an entire front, hellbent on dominating all of Iberia.\n\nObviously, the existence of this Frente Azul has complicated our plans for Fall Blau. The Schörnerites continued to insist that their efforts changed nothing, and that all they had accomplished was weakening Spain and Portugal even further, making the peninsula even more ripe for conquest. By contrast, the moderates had been somewhat swept up in the romantic nature of their revolution, claiming that their complete loyalty to the Nazi ideal should be justly rewarded. But for Göring, it wasn't a matter of ideology, it was one of practicality. Officially recognizing and supporting the Blue Front would mean less direct involvement, but therefore less control over Spain once the war was over. Likewise, continuing Fall Blau without compromise would be one more costly military operation, but would ensure complete German dominance, preferably forevermore. It was a simple risk-reward calculation to be made, no matter how his nostalgia wished to influence his decision.\n\nUltimately, when the next meeting of the militarists began, the Führer announced the official stance of the German Reich on the subject of the Frente Azul, which was that..."
 goering.blau.iberian_wars.13.a: "...loyalty and trust are two different things. We put them down like all the rest."
 goering.blau.iberian_wars.13.b: "...it would be unwise to slaughter the few decent men remaining in that hellhole."
 goering.blau.iberian_wars.14.t: "The Fall of the Frente"
 goering.blau.iberian_wars.14.d: "Despite all the grandstanding and the propaganda, failure was something that was at times unavoidable, even for the Führer. Göring had done his best to skillfully evade it for some time now-albeit in a manner that could be described more as 'not losing' than truly 'winning'-but even his luck had to run out at some point. In that case, he'd prefer it to run out over something minor. Such as Spain, for example.\n\nSchörner and his sycophants were, of course, outwardly furious that their efforts of propping up the Frente Azul had gone to waste, that time, money, equipment, manpower, and influence had all gone down the drain now that their Germanophilic friends had bit the dust. But the old Reichsmarschall wasn't stupid nor senile, not yet. He could see that, beneath his contemptible façade of supposed righteous indignation, there was an aura of smug satisfaction in the Monster's voice and mannerisms.\n\nAfter all, this was, in a way, the best outcome for him, even if it wasn't the best for the Reich; Göring had taken Speidel's side in offering his support to this Blue Front, and now that they had failed, they both looked like fools. Schörner was supposedly right all along, and the rest of the militarists lacked the credibility to object. It worked better for him than if they had listened to him from the start and simply acquired one more Militärverwaltung for the collection, for the humiliation of his rivals was far sweeter than earning more prestige for himself. This display of incompetence weakened the Führer's position, reinforced his constant claims that everyone else was too weak to get the job done, and instantly cast a shade of doubt upon any future opportunities of winning conflict through proxies rather than direct invasion. As a result, Göring would have to make more concessions, trade more favors, and cut more deals to retain the unity of his supposed underlings.\n\nAnd indeed, there was a difference between 'unity' and 'loyalty.' The Schörnerites and Speidel may have been at least nominally united under him, but loyalty would only be gained through the constant, uninterrupted delivery of victory after victory. This setback, no matter how small, had interrupted that rhythm. He would have to restore it quickly or risk losing everything. A swift, merciless invasion of Iberia was in order to regain a small part of their lost honor, but this stain would not be forgotten so easily.\n\nBut there was no need to worry. Not yet, at least. A defeat of this small a magnitude was not enough to send shockwaves strong enough to destroy everything he had built. But it was nonetheless a very painful reminder that his power only existed so long as the illusion of it existed as well."
 goering.blau.iberian_wars.14.a: "Maybe we can still recruit some as collaborators...?"
 goering.blau.iberian_wars.15.t: "A Revolution for Submission"
 goering.blau.iberian_wars.15.d: "The idea of the 'radical splinter faction', while existing for a reason, wasn't generally something that was common or expected, no matter how many sides existed in any one civil war. It simply wasn't pragmatic enough to be realistic; no matter how a minority of one group disagreed with the leadership, methods, or philosophy of the larger whole, separating entirely from them was rarely a proper solution. It weakens both sides to the point where they become easy prey for their more hated rivals, and stalls out the overall cause that they both pursue, regardless of any petty differences they may suffer in the meantime. Often, it's literally not even possible to pull it off in the first place, with any attempted coup or revolt being too under-funded, under-supported, and under-equipped to have even a remote chance of success.\n\nLuckily for the Frente Azul, the German Reich was generous, and placed no limits on the amount of funds, personnel, and technology they were willing to provide to secure a favorable outcome.\n\nThe greater Falangist movement was doubtlessly aware of the growing discontent among their ranks over their failure to secure a swift victory in the Iberian Wars, but they either drastically underestimated its scale or drastically overestimated how much time they had to deal with it. Within mere days, what little pieces of territory they still held were immediately cut in half as their garrisons swore oaths to a new, better cause. Loyalists were shot, captured, converted, or at best, were forced to retreat from German arms in Spanish hands. Their numbers were small, but their equipment easily outclassed the average Spanish militiaman who had to scrounge for guns, ammunition, and at times, even basic necessities. Combined with surgical precision on a tactical, operational, and strategic level, these soldiers carved out a foothold to establish something different from the Falangists. Something worse.\n\nOf course, none of this would have been possible without their puppet masters. Most would have had the tact to prevent themselves from openly declaring that they were acting on orders from a foreign power, but the Frente Azul was different. Their rebellion was ignited not out of a sense of national pride, but national shame. In their eyes, Spain had abused the good will the Third Reich had granted it for far too long. It had squandered every opportunity to create true progress, to eliminate those that sought to do it harm, and to follow the path to true glory laid out by the cause of National Socialism. They held common cause with the Falangists only because they were marginally better than Franco, the former being comparable to a rotting corpse as opposed to the fossilized husk that was the Iberian Union; even if one was fresher, they were both still long dead, and direly needed to get with the times. Now, they with the help of those they had always championed, they had broken free from all restraints, all efforts to shackle their radical Germanophilic insanity.\n\nThe war was not yet won, however. What remained of their previous allies would roar for revenge, while the Jews, Communists, and traitors would soon circle like vultures, detecting weakness from this infighting among Spanish Fascists. But they would all be crushed in the end, for they had the blessing of both God and Führer on their side.\n\nAll for the best, Göring figured. Their failure would not be tolerated, not after so much had been invested in ensuring the success of their little revolt. It would be fabulous if they won, and if they lost, the rest of Iberia would be happy to execute them, thus saving him the time and effort of doing it himself."
 goering.blau.iberian_wars.15.a: "Victoria o muerte! Sieg oder tod!"
 goering.blau.united.1.t:0 "The Looming Darkness from Within and Without"
 goering.blau.united.1.desc:0 "The German wolf has long roamed the continent in search of land, and now its gluttonous eyes have finally turned to the Iberian Union. Though we have tried to maintain a stable and united land, the Reich is trying to strike our Achilles Heel by stoking tensions between ethnic groups and funding brutal terrorist attacks. Rumors have even spread of the Führer's desire to establish different Militärverwaltungs for each ethnic group in the Union, which has proven popular with many separatist figures who would bow to the Germans in return for a sliver of 'autonomy'.\n\nOur homeland will soon be consumed by the fire of war, whether it is brought by the separatists or the Wehrmacht. Preparations must be made. If such a fate has been arranged for us, let it come."
 goering.blau.united.1.a:0 "We will fight for the Iberian Union."
 goering.blau.united.2.t:0 "The Basque Matter"
 goering.blau.united.2.desc:0 "With our offensive in Iberia officially underway, we have a first major issue to take into consideration. The Basques, an important minority in Spain concentrated in the North-East of the country, are Aryans who have toiled under foreign domination for centuries: with their oppressor at war against a superior power, they have taken the opportunity and declared an open rebellion against their masters.\n\nWhile this is indeed a boon for our offensive, as it distracts our enemy, the Basques have so far refused to ally with us, and have already moved to oppose any movement from Heer troops near their mountainous home. As things are, we are forced to defeat their rebellion before we can claim total victory in iberia.\n\nWe can choose, however, how to deal with them after we have defeated their army. On one hand, we can limit ourselves to crush their puny attempt at independence without further retaliations on the population: this would be respectful of their Aryan birthright, but it might be seen as too lenient. On the other, we can proceed to systematic retaliations on their civilian population, to show that anyone revolting against the Reich, Aryan or not, will be suitably punished."
 goering.blau.united.2.a:0 "Don't use any unnecessary violence!"
 goering.blau.united.2.b:0 "Show those fools the price of arrogance!"
 goering.blau.united.3.t:0 "The Battle Of Bilbao"
 goering.blau.united.3.desc:0 "When we decided to crush the Basque revolt harshly, we couldn't predict the small minority would have put up such a fight. Despite lacking a professional army, the militias knew their mountains well, and fought like furies: with the difficult terrain impeding our tanks, and the tall mountain preventing the Luftwaffe from properly supporting our ground forces, the Heer was forced to fight alone, and the advance was a bloodbath. Even after defeating their army, the people kept fighting our occupation, requiring draconian measures to prevent a full-scale uprising from happening. However, the efforts of the garrisons were for nothing, as a large revolt happened in Bilbao a few days ago.\n\nElements of the Basque militias who had been hiding in the mountains descended on the city and slaughtered the garrison before they could evacuate. Of course, the answer was immediate, and the uprising crushed in blood, but this doesn't change the horrors that happened there. Our soldiers were forced to advance house by house, razing the city to the ground and killing almost everyone they met, as there was no way to differentiate between civilians and military: men and women, old and young, fought to the death amidst the ruins of their city.\n\nEven though order has been restored, morale in the army has fallen very low, as they can't understand why would fellow Aryans fight so fiercely against their liberators."
 goering.blau.united.3.a:0 "This is a disaster!"
 goering.blau.united.4.t:0 "Basque Volunteers Join Us!"
 goering.blau.united.4.desc:0 "It seems that the Abwehr played their cards right, as after defeating the Basque uprising, and with the help of a strong propaganda campaign, a large number of Basque volunteers have joined the war against their former Iberian masters! Despite their revolt, great efforts were made to reconcile with the minority, and it seems that, in the end, they understood the righteousness of our cause.\n\nFeldmarschall Ferdinand Schörner has overseen the training of the Basque volunteers, who have been given German equipment and organized into semi-regular divisions, ready to fight alongside the Heer. Our soldiers rejoice at the opportunity to fight alongside fellow Aryans who have been freed from their oppression and willingly joined our crusade against the decadent powers of Earth!"
 goering.blau.united.4.a:0 "Hurrah for our new comrades!"
 goering.blau.united.5.t:0 "Victory Parade Foiled By Terrorists!"
 goering.blau.united.5.desc:0 "Today was supposed to be a day of celebration throughout the Reich. After the final surrender of the Iberian authorities, a victory parade was scheduled to happen today at the presence of the Führer: Hermann Göring himself saluted the victorious soldiers from the former Royal Palace, and then the motorcade led by Feldmarschall Ferdinand Schörner paraded along the streets of Madrid. One of the said streets was Calle de Serrano, where the American embassy was located, in order to show our adversaries the glory of the German nation, but tragedy struck along the way.\n\nA mere few meters before reaching the embassy, in front of the Church of San Francisco de Borja, the ground itself exploded. A tremendous detonation enveloped the vehicle leading the motorcade, the force of the blast throwing it against a building more than twenty meters from the road, and it was only by pure chance that Feldmarschall Schörner survived: his car had passed in second position after its engine had a small problem, and despite being involved in the explosion, it was spared the brunt of the detonation, the general himself only suffering flesh wounds from glass shards as the window broke from the shockwave.\n\nPreliminary investigations report that a partisan cell dug a tunnel under the road from a small apartment they had rented weeks before the parade. The landlord, interrogated by the Abwehr, showed them documents provided by the partisans: they had presented themselves as \"art students\" and justified the amount of rubble coming from their basement as part of a sculpture they were working on. Whether what he says is true or not, one thing is certain: our victory has been marred today, and many in the Oberkommando fear this is but a glimpse of what will happen from now on..."
 goering.blau.united.5.a:0 "Why did the bastard surv- ehm, we are happy he survived!"
 goering.blau.united.6.t:0 "A Concerned Friend's Call"
 goering.blau.united.6.desc:0 "Feldmarschall Ferdinand Schörner sat comfortably in his office, a telephone receiver attached to his ear and a friendly, if somewhat practiced smile on his lips. \"Herr Hitzfeld? It's a pleasure talking to you! I'm sure you've heard about our glorious Führer's proclamation, didn't you?\" a small wait, then \"Yes, I completely agree with you. Surely removing all terrorist and partisan activities within three years is a most auspicable policy, but I'm afraid our great leader has... overlooked some details... yes... of course...\" he nods a couple times as he writes something on a piece of paper.\n\n\"Indeed, this will surely exacerbate the already difficult situation in Militärverwaltung Kastilien and many others... yes... yes... I couldn't put it better mein kameraad. Perhaps I could be able to explain your point of view to the Führer... yes... of course... I'll be sure to remind him of that in our next meeting... yes, the request for supplies too... of course, I'd never let a fellow German soldier such as you fight those terrorists without more than enough men! Thank you for the conversation, mein freund, but urgent matters await me, I'm sure you understand... yes... yes... thank you very much. Heil Göring!\"\n\nAs soon as the receiver was down, the general smirked. Everything was going according to plan: now, the next call, there were still some to do before going to bed. He raised the receiver to his ear once more, and composed the number, the smile returned to his friendly, practiced shade."
 goering.blau.united.6.a:0 "Militärbefehlshaber von dem Bussche? Hello!"
 goering.blau.united.7.t:0 "Germany Retakes The Iberian Strait!"
 goering.blau.united.7.desc:0 "With our former allies in Iberia conquered by the Reich, German soldiers have occupied the Iberian Straits. Despite the disasters it brought to our nation, it still allowed to trade with other countries through its sluices. Now, its new - or perhaps old? - owners have denied us right of passage through the strait, utterly blocking the flow of trade to and from the Atlantic ocean.\n\nThe ripples of this action can already be seen as trade struggles to keep up with the new logistical difficulties. Now, our trade convoys need to pass through the Cape of Good Hope, effectively returning to the old practice of circumnavigating Africa, increasing transport times and costs tenfold, with obvious consequences for our economy. If we don't overturn this course of events, our economy will come crashing down just the way it did twenty years ago when the strait was first built!"
 goering.blau.united.7.a:0 "Damn Germans! We'll have our revenge one day!"
 goering_peace_events.6.t: "The \"Liberation\" of Iberia"
 goeirng_peace_events.6.desc: "It had been a very long time since good Aryan men had laid down their lives in service of a cause that was not their own. Not since the days of the invasion of Greece, executed in order to prop up their ineffective Italian allies, had German soldiers fought and killed in order to secure land for a country other than the Reich itself. To the more bloodthirsty members of the militarists, such an idea was an insult. Not merely a waste of time, but a fundamental contradiction to what they were trying to achieve; a reminder of the days of the first Weltkrieg, when the Heer continued to fight and defend useless allies who gave them nothing in return. But to Göring, such holdouts merely needed to get with the times. After all, did it really matter that it was Spaniards who continued to rule over Iberia, when their sole political aim was to take orders from Germania?\n\nAdmittedly, it would have been nice if they had managed to unite their own continent through their own strength, but the Frente Azul was nonetheless the best thing that could have ever happened for the Reich. Every member of the front, from the lowliest soldier to the Líder himself-for the title of Caudillo had long since been abolished, in favor of further emulating their glorious model-was fanatic in their loyalty, and solely dedicated to crushing what little resistance remained in both Spain and Portugal alike, all in the name of National Socialism. Their bond was cemented via an official state visit to Madrid, where the same man who had visited the first Führer giddily greeted the second, with all the enthusiasm of a man meeting his childhood hero.\n\nThere were still some minor concerns, of course. With José Luis de Arrese's ascension to the role of national ruler, he seemed to gain the odd impression that he was somehow Göring's equal, despite the fact that his nation still relied on Germany for essentially everything. He still continued to protest the treatment of Catholics in the Reich, and didn't quite seem to grasp that further support for the war plans only had one logical conclusion. But such shortcomings were all forgivable, for he offered absolute loyalty at minimal cost, and not even Schörner could argue that such devotion was not invaluable.\n\nAnd perhaps, if the Americans were kind enough, they'd only launch their missiles at Germania instead of Madrid. In that case, Göring had secured himself a nice little vacation spot, if nothing else."
 goering_peace_events.6.a: "The legacy of Charles V, restored!"
 goering_peace_events.17.t:0 "The Conquest of Iberia"
 goering_peace_events.17.desc:0 "\"This matter does not concern you in the slightest.\" Bloody Ferdinand insisted with an enraged scowl, staring down Militärbefehlshaber Leo Hepp with absolute fury. He had flown to Germania out of Sofia to meet with the Führer, and for what? To criticize their plans for Iberia, of all places? Hardly something he should concern him with. \"What made you of all people come to such a conclusion?\" Göring asked, equally skeptical as to Hepp's intentions and arguments. \"Militärverwaltung Balkanhalbinsel has been a success under your guidance. You yourself proved that a single administration encompassing the entirety of Iberia would no doubt be similarly fruitful, would it not?\" That prior success was the only reason why this ridiculous meeting was being entertained in the first place. It better have been worth it, or a demotion-or worse-may be in order.\n\n\"It is not my intention to offend, mein Führer. Rather, I wish to impart to you some of the wisdom I have accumulated during my time as Militärbefehlshaber.\" Leo replied, doing his best to swallow back his fear. \"My Militärverwaltung has been a success due to the fact that the people of the Balkans ...simply put, hate each other.\" The statement earned the smallest of snorts from Schörner and a half-second long smile from Göring, easing the tension slightly. \"We've been effectively channeling that hatred to make them too busy with each other to rally together. Iberia, meanwhile, is ...Well, there is no shortage of ethnic conflicts, true. But the two largest groups-the Spaniards and the Portuguese-united their nations in hopes of opposing us. For as flawed as the Iberian union may have been, our invasion retroactively justified its existence, thus uniting the two groups inseparably. By creating one Militärverwaltung Iberien for both peoples, we are acknowledging that union, and cementing their bonds against us.\"\n\nGöring and Schörner both looked at each other, as if to silently consider the idea. The Monster, for his part, had no interest in the area either way; So long as the Germans were on top, what did it matter how many lines on a map they drew? With no input from his so-called 'ally', Göring looked back towards Hepp, leaning forwards in his seat as he did so."
 goering_peace_events.17.a:0 "What exactly would you propose instead, then?"
 goering_peace_events.25.t:0 "The Conquest of Spain"
 goering_peace_events.25.d:0 "General der Infanterie Otto Hitzfeld, recently promoted Militärbefehlshaber for Militärverwaltung Kastillien, smoked together on a balcony with his friend and colleague, Generalleutnant Harald von Hirschfeld, also recently promoted to become the Militärbefehlshaber for Militärverwaltung Andalusien. They were observing the devastation that had come in the wake of their invasion, bearing witness to the direct results of their orders; Bombed out buildings, destroyed families, corpses on the streets.\n\nNeither of them felt any remorse for any of it.\n\n\"It would have been worse if we hadn't arrived when we did.\" Otto offered, to which the younger general nodded vigorously in agreement. \"They'd have been ripped apart by the terrorists. They should be grateful that we're here to set things right.\" Hitzfeld couldn't help but laugh at the idea as he leaned over the railing, watching his soldiers scurry about like ants. \"Spaniards showing gratitude? Unlikely. If they knew the meaning of the word, Franco would have joined us when he had the chance.\" A point that Hirschfeld felt he had no choice but to concede, offering a shrug of admission. The man spoke Spanish, which was the only reason why he had been assigned to Fall Blau in the first place, and was the only reason why he now found himself running one of the broken shards of Spain at all. He resented the position quite heavily; young and hungry, he wanted more, to rise up the ranks, to make his Fatherland proud. But that Fatherland was demanding that he serve here instead, and he was nothing if not loyal. Hitzfeld, by contrast, was a decade older and a decade wiser, and realised he had reached the end of his abilities. This position was his retirement, his gold watch, and he intended to enjoy it, and to make sure his comrade enjoyed it as well.\n\n\"We should meet up with the others from time to time.\" He offered, trying his best to cheer up his brother in arms. \"Molinari, Bussche, Pöschl. We need to properly celebrate, after all.\" Hirschfeld merely tossed his cigarette off the balcony with a sigh."
 goering_peace_events.25.a:0 "The División Azul was back, and here to stay."
 goering_peace_events.26.t:0 "The Conquest of Portugal"
 goering_peace_events.26.d:0 "Most men of Alfred Zerbel's standing would have considered a 'promotion' to Militärbefehlshaber either an insult or a reward, depending on how lucrative the country in question was. Militärverwaltung Portugal was, needless to say, very much an afterthought after the carefully divided sections of Spain. And yet, the man himself was happy to be gone from Germany proper.\n\nDespite being a Generalleutnant, Fall Blau had been about the most prestigious military operation he had taken part in during his career. The rest of his time was spent as Inspekteur des Heeres; supposedly a prestigious position, it was in reality little more than a fabricated on-the-spot role that Spiedel had created as an excuse to keep an eye on his rivals. He was supposed to ensure that on a material and personnel level, the Heer was up to standards at all times. And he had tried to do it, he really had! But every time he found even the smallest of flaws, the Schörnerites would pounce. Denying everything, claiming he had no authority to judge them, deflecting blame ...\n\nWell, he didn't need any of it. If being sent off to Portugal was their excuse to get rid of him, he would take it. Here, he could serve his country in a much more tangible, effective manner; Rooting out dissidents, securing the territory for the Fatherland, ensuring that the resources continued to flow out of these lands and into the hands of those who deserved them better. Yes, this was a much better use for his talents.\n\nThere were some concerns that came with the role, of course; Napoleon himself had a very rough time stabilising the area after his conquest, after all. But that was more because of all of the trouble in Spain that was going on at the same time; If history was to repeat itself, that would be the problem of his fellow Militärbefehlshabers, not him. As long as he did his duty and kept the peace, he could enjoy his extended holiday for the rest of his life, content in the knowledge that he had fulfilled his purpose. He was set to rule over a country he knew little of and cared nothing for."
 goering_peace_events.26.a:0 "In this way, the Portuguese would come to argue, he was much like God."
 goering_peace_events.28.t:0 "The Conquest of France"
 goering_peace_events.28.d:0 "Göring was never a man to believe in platitudes and spurious wisdom like the so-called 'cycle of revenge.' After all, he didn't leave anyone alive to take their revenge, nor anyone who might be motivated to do so on someone else's behalf. But that was in regards to internal politics and petty rivalries; When it came to international diplomacy, he was starting to get the feeling that France and Germany were destined to this forever.\n\nNapoleon invades Prussia, so Prussia invades right back. Bismarck captures their Emperor, so the French respond with Versailles. Hitler crushes them easily, then they throw us right back out within thirty years. And now he was here, in Paris, recreating the photo Adolf took of himself in front of the Eiffel Tower, a stark reminder to both sides of the conflict that nothing had changed.\n\nWell, perhaps one thing had; Göring actually made sure to rise to the top of the tower as well, elevator or not.\n\nIt was on top of that tower that he set out to ensure that this cycle would be broken at last. Not just for the rest of his life, however long that may be. Not just for however long he was in power. Not just until the next Führer after him was crowned. No, this was his chance to do something for Germany that truly would last a thousand years; He would remove France's ability to oppose them, permanently.\n\nOf course, it wouldn't be nearly as easy to cripple the French as it was to cripple the Russians. They were well developed, well connected, urbanised, rich with manpower and resources, and most importantly, not untermenschen, no matter how much they acted like them. He couldn't just visit the same level of cruelty to them as he could for the Slavs, just from a pragmatic standpoint. So he resolved for something different. Something better.\n\nFrom atop the Eiffel Tower, Göring felt as though he could see the entire city of Paris. A city that had been divided, cut in half as a result of Himmler's invasion. It inspired him. If their capital could be split apart, why not the rest of the country as well?"
 goering_peace_events.28.a:0 "France will never bring harm to Germany if there is no France."
 goering_peace_events.36.t: "The Conquest of Morrocco"
 goering_peace_events.36.d: "Very few people realised that, roughly speaking, Morocco was where it all began. It hardly mattered now, decades after the former Entente powers had been beaten, broken, and dominated by Aryan might, but all the same, this was where they took their first stand against Germany. The Tangier Crisis was when French and British interests aligned together in opposition to the Second Reich, where the first domino in the long, complicated chain leading to the first World War was placed. History ripples on forevermore as a result: The rise of Communism, the second, renewed conflict meant to avenge the shame of the first, the age of the Atom ... The Kaiser could not have possibly known that this was what he had wrought upon the world, merely by supporting the independence of this worthless mess of sand and subhumans. It made Friedrich August Feiherr von der Heydte reflect on his place in history; What awaited Germany in the next century, long after he had passed on? What awaited the world? There was no way of knowing, nor was there any way of knowing what could trigger the next catastrophe. Such seemingly meaningless things could have such dire consequences...\n\nIt took him a few minutes of stewing in such thoughts to finally snap out of it, a sudden revelation waking him from his train of thought. In comparison to ripples, what the Führer was doing now was nothing short of tidal waves. This is why Germany fought on, he realised. Why it always found a new enemy, why it would not stop until the work was complete: To prevent such unforeseen consequences. If they succeeded today, here and now, then Germany would not need to fear what might happen in a hundred years. In a thousand years, even. The concept of war itself could be vanquished, and the world united under the Master Race. An eternal Pax Germanica, without any Entente interference or Judeo-Bolshevism to stop them. It was a glorious thought.\n\nBut it would only come to be if they continued to claim victory, time after time, without fail. Even the smallest of setbacks could destroy the dream. Everything had to run smoothly, each cog in the grand machine doing its part to perfection in order to ensure continued success on the battlefield. Even if he loathed his particular position in such a machine, the Militärbefehlshaber's newfound comprehension of his place in the world and role in the history books granted him renewed vigour. He would perform his duties to the best of his abilities, for the sake of his country and the world. He would allow nothing to derail the future he envisioned."
 goering_peace_events.36.a: "Least not Morroccans, of all people."
 WORLD_REICH.311.t: "[Get_newspaper_header]German Invasion of Iberia"
 WORLD_REICH.311.desc.a: "Today began with reports of numerous airstrikes on Iberian lands, marking the beginning of a new campaign by the German army to the west of Europe, with the goal of conquering the entire Iberian Peninsula.\n\nThe federal government, led by [IBR.GetLeader], addressed the citizens of the Iberian Union with a statement about the \"Unwavering readiness to stand to the death in the face of the rampaging German aggressor\" and the \"necessity for all nations of the union to unite against the common enemy in this dark hour.\"\n\nReactions from Germany, apart from a brief communiqué about the strategy of the latest military campaign, have not followed.\n\nThe international community is frozen in stupor, not having recovered from the past grand successes of German arms, although voices from the free world demanding help for Iberia can still be heard.\n"
 WORLD_REICH.311.desc.b: "Today started with reports of numerous airstrikes on Madrid, Lisbon, and Barcelona, marking the beginning of a new campaign by the German army to the west of Europe, with the goal of conquering the entire Iberian Peninsula.\n\nPlunged into the chaos of a civil war, the Iberian Union now presents a sorry sight – around a dozen different factions are still engaged in fierce battles for dominance over the peninsula, openly or in the shadows. But now all their efforts have gone to waste, although among the many groups there are a few contenders for establishing contact with the Reich.\n\nOn the radio, various slogans can be heard in fragments – some calling for a ceasefire between the sides, others making strange statements about their readiness to cooperate with the Wehrmacht, or even panicked calls to evacuate as far as possible.\n\nReactions from Germany, apart from a brief communiqué about the strategy of the latest military campaign, have not followed.\n\nThe international community is frozen in stupor, not having recovered from the past grand successes of German arms, and harboring no illusions about the imminent victory of the Wehrmacht."
 WORLD_REICH.311.a: "We will bring the order to these savages!"
 WORLD_REICH.311.b: "We were united exactly for this cause!"
 WORLD_REICH.311.c: "Nothing good for Caudillo's fortress."
 WORLD_REICH.311.d: "The last nail to Iberian coffin."
