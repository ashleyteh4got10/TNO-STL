 goering.gaiseric.34.t:0 "Bomben auf Ostia"
 goering.gaiseric.34.desc:0 "1800 - Approach to Ostia STOP No sign of enemy resistance STOP\n\n1830 - Arrival to Ostia STOP Minor Anti-air fire STOP\n\n1900 - First bombing run on port facilities STOP Anti-air Fire slowly intensifying STOP\n\n1930 - Second Bombing run STOP First squadron of Italian Interceptors emerge STOP\n\n2000 - Escorts engage Enemy aircraft STOP Second Bombing run concluded STOP\n\n2100 - Escorts managed to keep Italian aircraft away from the Bomber squadrons STOP\n\n2400 - Auftrag erfüllt STOP Damage to Ostia significant STOP"
 goering.gaiseric.34.a:0 "Today Ostia burns..."
 goering.gaiseric.35.t: "Too Hot to Handle"
 goering.gaiseric.35.desc: "The Aryan was not a creature made for the desert. Suppose it made sense; they were the masters over all other forms of life, but one could hardly find life among the arid sands, barring the occasional scorpion that was easily crushed underfoot like any other form of pest. Much better suited to the forests, mountains, and weather of the frigid north, there was simply no place for the German amongst the endless wastes. No, such regions were better suited to their lessers. That was the conclusion that Schörner proposed, that Speidel reluctantly agreed to, and that Göring approved, all without a trace of irony. Just as one could not occupy the entirety of Siberia lesson that even the most rabid of militarists was slowly being forced to admit-occupying the entirety of the Sahara was utterly unfeasible. So with a stroke of a pen, it was decided that they simply...wouldn't.\n\nOfficially, the Sahara desert still belonged to the Third Reich, just like all the other colonial territories Germany had gained through the conquest of Italy. The maps all labeled it as part of either von der Heydte's domain or Heinz Kessler's, with arbitrary lines dividing the two just as artificially as the British and French had done years prior. But to look closer than a satellite's view would reveal the reality of the situation, as the mass exodus of Wehrmacht soldiers and Italian colonial police officers could attest. Their duties and obligations to the overglorified sandbox had ended, and much to their immense delight, they were to be re-assigned, set to attend what few cities and resource deposits that were deemed worthy of the time and effort it took to garrison them. Everything else was to be condemned, cut off, abandoned. There was no need for any form of defenses to be erected around this 'forbidden zone,' other than the simplest of barriers; chain-link, barbed wire, and the occasional \"Kein Einlass!\" sign. After all, anyone who was still on the other side by the time the fences went up were more than welcome to get sunburnt, to starve and waste away among the dunes, dutifully quarantined from the new masters of the continent.\n\nThere would be no way for them to acquire food and water, let alone weapons with which they could use to threaten the new order. Any guerilla, partisan, or otherwise lawless troublemaker who had thought to escape into the dunes would be free to expire at their own, natural pace. With no need to guard against danger, soldiers who otherwise would have been assigned to keep an eye on a completely barren dust bowl were free to occupy other regions, or more helpfully, to fight, kill, and die on the frontlines. In the titanic struggle for the fate of the world itself, every last drop of blood was needed, and not one more was to be dripped onto this pointless, irritating collection of rock particles. Perhaps one day, when final victory had been achieved, when the technology had become advanced enough, when the Aryan paradise extended across the entire planet rather than a single nation, man would return to these cursed lands, bringing with them vehicles and tools and the expertise needed to exploit all that had been abandoned through this rash act of detachment. But until that day came, the only residents of a region nearly the size of Europe itself would continue to be the scorpions, now with no one left to crush them."
