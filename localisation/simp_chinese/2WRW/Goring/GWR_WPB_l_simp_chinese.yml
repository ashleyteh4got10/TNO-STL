l_simp_chinese:
 GGR_plan_B:0 "War Plan B"
 GGR_plan_B_desc:0 "Although we are loath to admit it, our armed forces are not yet ready for an invasion of Italy. We have no way of occupying their colonies, and the Alps are a formidable barrier that we aren't ready to cross.... Yet.\n\nWhile we are strengthening our position, three targets have presented themselves to us The first of these is Iberia, which stands on a much coveted strategical position. The second is Turkey, which is famed for its vital chromium mines and dominance of the Bosphorus strait, as well as a land border with the Italians, which could prove to be most useful in the future. Last is the cursed Slavs to our east; the Siberian plains are rich in resources and enemies alike. We shouldn't neglect these flies, they must be crushed if we are to secure our eastern borders once and for all.\n\nOnce we have crushed and secured all of the aforementioned foes, we should be more than ready to tackle our rivals to our south! "
 goering.52.t:0 "War Plan B Begins"
 goering.52.desc:0 "Boots cracking on linoleum floors, steeled eyes shifting through cigarette smoke, the dancing of numbers upon an unending series of maps and diagrams; the song of the Office of the General Staff dances fast, and can kill those who do not sway to its tune.\n\nAn unending torrent of incoming data threatens to bury an analyst at his station even as he tries to glance at the wider picture the figures tell. Recovered assets and conglomerated capital from the excursions of War Plan A buttressed the budget, but the increases in Heer expenses alone swallowed any windfall gained from the seized banks. He fears to even wonder what may happen if the windfalls stop.\n\nIn another room the colonels and other staff officers eye the projection on the wall. The general presents to them the summarized findings and assessments for War Plan B, the culling of those petty fiefdoms on the Pakt's doorstep. The former Triumvirate represents the greatest industrial and military rival to Germany on the continent, yet their weakness is known. Iberia is unstable and Turkey is weak; though these nations are mountainous they will fold in the face of the energized Wehrmacht. Italy, however, is different. Modern equipment, defensive positioning, and large resources mean ultimate victory will be slow, and therefore strangling their operational capacity in a national siege will bring victory in time. All the while, the Slavic Bolsheviks are rising in the east; to ensure a successful invasion of the Mediterranean, the Eastern Front will be - must be - secured once and for all."
 goering.52.a:0 "The crescendo before the finale."
 goering_peace_events.29.t:0 "The Conquest of Micronations"
 goering_peace_events.29.d:0 "Like a string of pearls, each and every one of the micronations of Europe had been collected at last. Liechtenstein had been seized long ago, and now the rest had been claimed as well; Andorra during Fall Blau, Vatican City and San Marino during Operation Geiserich, and now, finally, Monaco had been conquered alongside France. It was a triumphant moment. And what better way to celebrate the defeat of virtually completely helpless city-states than partaking in the local economy as a sign of good faith?\n\nIn truth, Göring needed this. Heavy was the head that wore the crown, as they say; As a man of culture, he needed to find a high-class way of blowing off some steam. What could possibly be higher class than gambling away exorbitant amounts of money? It was a shame that he had done away with all the bankers and corrupt businessmen; they made for good friends. Now, the only people rich enough to be invited to this little outing of his were the new elite; The top generals of Germany and their associates. Military men didn't tend to be the best drinking buddies, but damn if it all wasn't coming together somehow. They laughed, they played, they had a good time. It was exactly what he was hoping for.\n\nThere was only one person who wasn't enjoying himself, and nobody had any doubts as to who it was exactly.\n\n\"This behaviour is beneath the station of the Führer.\" Ferdinand Schörner declared, unable to stand for this degeneracy a moment longer. He had stormed over to the roulette tables utterly infuriated, a cowed Otto Ernst Remer by his side. Evidently, he had chewed out his subordinate before taking on his supposed 'superior,' hoping a number's game would convince him to give all of this up. \"Don't be such a killjoy, Ferdinand. This is Monte-Carlo for God's sake! Take this as a chance to enjoy yourself.\" It was perhaps the only time Göring had ever possessed the willpower to directly defy his puppet master out in public. \"You don't like the games? Find some pretty girls, then! They love a man in a uniform.\" He insisted, before placing his bet; All in on black. \"Girls are temporary. The glory of the Reich is eternal.\" The Monster scoffed, refusing to back down.\n\nThe only thing that could have ruined the mood more than Schörner was the outcome of the game; Red. In an instant, the Führer's jovial attitude dropped into a deep scowl. The concept of money had more or less become meaningless to him at this point; he had become free to indulge in any expense he desired long ago, let alone now. And yet, that fact didn't stop him from storming out of his seat in a fit of rage. An entire night's winnings, gone.\n\n\"Fine. If that's all you really care about, then have your own brand of fun.\" He declared to Schörner, who had eagerly followed him out, glad the ordeal was over. \"Come back tomorrow, and seize everything of value this place has. Bring me back my rightful winnings, and claim the rest for the Werhmacht. Or yourself. Doesn't matter. Kill the owner. And security. And anyone who complains. Then demolish the place. With artillery, if you'd like.\"\n\n\"...Must I wait a whole day to get started?\""
 goering_peace_events.29.a:0 "An act of wrath destroys a den of greed."
 GGR_fall_vorbeck: "Fall Vorbeck"
 GGR_fall_vorbeck_desc: "With the end of the Second World War, Germany took colonies from the other European powers, reorganizing them into three colonial states. They worked hard exploiting the continent to their heart's content and taking the wealth of Africa to Europe. This is how it likely would have kept on if not for the chaotic South African War. The war would engulf Africa, and drive the Reichskommissar of Ostafrika, Hans Hüttig, to madness, seeing him coup the other two Reichskommissars, and take all German Africa for himself.\n\nTime passed by and Africa freed itself from the hands of the mad Ostafrikan. Years of progress have been lost, but, luckily, not forever. We are now in the position to return our precious African colonies.\n\nWehrmacht returns to Africa. Heia Safari!"
 GGR_fall_vorbeck_ofn_win: "Afrika, the Dark Continent. Lost to us in our defeat in the South African War, and a blemish on the record of our glorious Heer. The sting of the loss of not just the prized colonies, but the humiliation of the militarist, to have lost a war so soon after reunification is felt by most Aryans across the Reich. To have been defeated by the OFN and their lackeys in what should have been a reminder of Aryan dominance has been the topic of many arguments in both the Volkshalle, and over the many planning tables of high command. Things would only get worse with subsequent de-gemanization campaigns of the OFN and the forging their own protectorates out of the corpses of our colonies, resulting in an unacceptable dagger pointed at the belly of the Reich. An OFN stronghold in Africa, is something that can not be allowed. As such, strategic necessity, coupled with a desire for revenge has seen that the Heer must strive to remove this pest from our rightful lands, and return German dominance to Afrika."
 GGR_fall_vorbeck_ofn_win_failed: "Afrika, the Dark Continent. Lost to us in the aftermath of the South African War, and a blemish on every map across the Reich. We had underestimated the OFN's tenacity to fight for their lackey South Africa, and it had cost us dearly. Hundreds of thousands of Aryans lie buried in the African dirt, yet, so too could be said for the OFN however. For while they had taken our colonies from us, they failed to understand how to rule Africa properly. Now their OFN protectorates have collapsed in on themselves, and with the exception of South Africa, the OFN too was forced to flee the dark continent, leaving behind third world countries and warlords. It is as if none can tame Afrika but proper Aryans, so let us return and bring light to this dark land once more!"
 GGR_fall_vorbeck_pakt_win: "Africa, the Dark continent, once three great Reichskommissariats stood there as beacons of Aryan light amidst its steaming jungles and vast veldts. Hundreds of thousands of colonists lived within them, toiling hard, and bringing civilization to the Dark continent. Great cities sprouted up in Windhoek, Stanleyville, and Quelimane, as sections of railroads and haphazard airfields stretched across the continent, connecting even the most remote of towns and villages. In time the natural resources of Africa began to flood into the Reich, from strategic goods like Congolese Rubber, and Uranium, to Angolan Oil, and crops. This is to say nothing of the various luxury goods, from Coffee to Ivory, as well as the luxurious resorts found across ZentralAfrika, most notably the Hitlerstadt. Yet fate is a fickle mistress, and with the Burgerkrieg came the South African War. Despite our efforts, one by one the three great Reichskommissariat fell to the OFN, and a black mark on the Reichs record, not seen since the attempted SS coup stung us to our core.\n\nHundreds of thousands of soldiers and settlers were lost to both the fires of the South African War, and the various native rebellions that followed. Millions upon millions of Reichsmarks wasted in that damned war, in both material and munitions. That is to say nothing of the OFN's De-Germanization campaigns, undoing years of work and progress. However, if there is some solace in all of it, the OFN too had failed to tame the dark continent, forced to leave with their tail between their legs, and abandoning Africa to her fate. Now all that remains are various warlords, and chieftains playing at nation building. Small countries and generals, warring against one another as they always had, while disease and famine once more run rampant. While then, we had to simply be content to sit within Europe and watch the horror unfold, things have changed now, the Reich is no longer in the exhausted and weak state that it was at the end of the Burgerkrieg, our armies have grown, our technology advanced, our means for war refined and turned to a great blade of damocles that hangs above the world.\n\nWe will return to the Dark Continent, bringing the light of National Socialism and the Aryan race to Africa once more! From the Jungles of the Congo, to the Bush of Rhodesia, we shall return, putting the warlords and petty kings to the torch! Let the world know Africa is, and always will be a German Colony, HEIA SAFARI!"
 GGR_fall_vorbeck_huttig_alive: "The South African War should have been one of our greatest victories, yet thanks to that bastard Hüttig, it is not so cut and dry. While we had routed the OFN and their Judeo-Masonic lackeys from our rightful claims in the dark continent, we had failed to see the madness of Hüttig, who many suspect was actually one of Himmler's agents that stayed over after the SS purge of the 50s. Much like Himmler, the Führer tasked him in some far off colony, thinking if he was out of sight, he would be out of mind. Much like Himmler, he has caused untold suffering to his fellow Aryans, as he dragged the Reich into one of the most catastrophic wars since the West Russian War, and even after our victory, betrayed the Reich. He is a mad dog that needs to be put down if we are to restore our hold on Africa."
 GGR_fall_vorbeck_stalemate: "The continent of Africa may be an underdeveloped, subhuman-infested, backwater wasteland of desert and jungle, but it is ours all the same, no matter how many may have forgotten this fact. With the old colonial system dead, we have no choice but to reassert our control through military means. In honor of the Lion of Africa, the Dark Continent shall be reclaimed!"
 GGR_blitz_though_the_deserts: "Blitz Through The Deserts"
 GGR_blitz_though_the_deserts_desc: "It is a simple fact that even the most ideal Afrika-Korps super soldier is simply not equipped to fight for prolonged periods in the wildly fluctuating temperatures of Africa's deserts, let alone the average conscript. While combat in this sort of terrain is unavoidable, we can mitigate the logistical issues we face by focusing on speed; if our soldiers wish to escape the heat, all they must do is fight their way out onto the other side!"
 GGR_raze_through_the_jungles: "Raze Through The Jungles"
 GGR_raze_through_the_jungles_desc: "Fighting in rainforests is like fighting in normal forests, only worse; they are hotter, wetter, filled with deadly diseases and hostile fauna, and have nigh-infinite potential for guerilla warfare. The problem we have is fighting through the jungles; therefore, no jungle, no problem. Liberal use of napalm will be both approved and encouraged during the Fall Vorbeck."
 GGR_so_many_directions_to_strike: "Where To Begin..."
 GGR_so_many_directions_to_strike_desc: "Military conquest of an entire continent is not easy work, especially when every region of that continent is no more or less developed than any other. While we will eventually march from one end to the other, we must first decide which region shall have the honor of falling first, as to serve as the forward operating base from which we will proceed inwards. There is no obvious starting point, so we must thoroughly weigh the pros and cons of each option. The first step is the most crucial, so we must be careful to choose wisely..."
 GGR_west_falls_first: "West Falls First"
 GGR_west_falls_first_desc: "Western Africa has been thoroughly bombed into the stone age already, but it seems as though the parasites have crawled out of their mud-huts the moment we disappeared from their skies. They continue to squabble against each other over petty matters, utterly dismissive of the thought that we might return to finish the job while under the backing of the so-called 'superpowers.' Their overconfidence and vulnerability make them the most appetizing target, especially since neither advantage will last forever; If we seek to exploit their weakness, we must do so quickly!"
 GGR_center_falls_first: "Center Falls First"
 GGR_center_falls_first_desc: "Zentralafrika was once our most profitable colony on the continent, containing the majority of German investment, resources, and even settlers, most (if not all) of which have been despoiled and destroyed by native savagery. The Congo Lake and its surrounding territories make the ideal location for a first strike, not only to avenge what was lost, but to reclaim it as well. For all intents and purposes, it shall serve as our new gateway to Africa, from which the rest of the dominoes shall fall one by one."
 GGR_southwest_falls_first: "Southwest Falls First"
 GGR_southwest_falls_first_desc: "For as much of a wasteland as it is, the Namibian deserts at least made for some decent airfields. Those very same airfields will be invaluable to us moving forwards, as they will provide the means by which we may both airlift supplies to our advancing troops as well as launch missions to forcibly tame both terrain and savage alike. While old Südwestafrika may have been a den of treason and weakness, it shall easily be reforged into our greatest stronghold, so long as we have the courage to seize it!"
 GGR_east_falls_first: "East Falls First"
 GGR_east_falls_first_desc: "The heart of darkness is a cruel and savage land. As Hüttig's seat of power, it is safe to say that such a region is now entirely populated by only the most militant and brutal resistance groups, as only the strongest were fit to survive his terror. This resistance will only grow stronger as time passes, meaning we must cut them down to size before they reach their full potential. They may have survived the madman, but we'll see how they fare against the Führer!"
 GGR_strike_from_morocco: "Strike From Morocco"
 GGR_strike_from_morocco_desc: "Our recent subjugation of the lands of Iberia have come with an additional prize, that being the useless strip of desert known as Morocco. The Spaniards held on to this Arabian hellhole primarily out of desperation and unwillingness to abandon their last great colony, meaning that it isn't exactly developed in a manner that is conducive for further military expeditions. Nonetheless, it remains our best starting point to finally bring an end to the French traitors and the mudslingers they surrounded themselves with."
 GGR_strike_from_the_center: "Strike From The Congo"
 GGR_strike_from_the_center_desc: "Reichskomissariat Zentralafrika, even despite the horrors of war, remains our most stable and profitable colony on the continent, furthermore containing the highest ratio of European settlers to local natives than anywhere else in Africa. Being the shining example of German rule that it is, it is the obvious location to begin the reclamation based on propaganda value alone. Not only that, but its centralized position allows us to move in any direction we please and still find an enemy to conquer. As soon as our soldiers move past the 'official borders,' their only orders will be to kill everything that moves. It is simplicity itself."
 GGR_strike_from_the_south: "Strike From The South"
 GGR_strike_from_the_south_desc: "Our support for the Boers during their revolt against South Afrika may have been a naked act of imperialism, but it was one which has evidently paid off. Though Huttig managed to nearly torpedo our relations with the Afrikaners beyond repair, the fact remains that they would much prefer a German colonial administration as their neighbor instead of a jumped up group of foreign-backed natives. They will be happy to support our excursions on the continent, and we will be more than happy to mend our ties."
 GGR_strike_from_madagascar: "Strike From Madagascar"
 GGR_strike_from_madagascar_desc: "Erhard Milch's hard work in securing Madagascar had paid off, and Stoph's efforts of improving its military capabilities have proven successful. While naval invasions are never easy business, being able to launch them from a well supplied, well fortified island base-against enemies who will never see it coming, no less-makes them far easier than they otherwise would, and presents us with an opportunity that we cannot afford to ignore. The once French and forever German colony shall be the home base for our redemption of Africa!"
 GGR_strike_from_wherever_else_we_can: "Strike From Wherever Else We Can"
 GGR_strike_from_wherever_else_we_can_desc: "Now that we have secured a proper foothold on our positions, it is time to make our intentions clear. We shall accept nothing short of absolute domination from coast to coast, just as we once possessed and will continue to possess forevermore. There is not one band of rebels, not one resistance movement, and not one 'developing nation' which shall survive our coming wrath. Their treasonous temper-tantrums shall be punished, and rightful rule restored."
 GGR_full_speed_ahead: "Full Speed Ahead"
 GGR_full_speed_ahead_desc: "Barring the foreign-backed puppets of Africa, there are no professional standing armies to block our way as we blitz through these savage lands. There are no enemy tanks to duel against our own, and no enemy aircraft to launch strikes against our ground troops. Our only opposition is a collection of subhuman rabble armed with whatever scraps they can salvage from their masters. There is no need to fear our caution in our elite soldiers from such a pathetic enemy; their only directive will be to win this war and win it quickly."
 GGR_anti_partisan_tactics: "Anti-Partisan Tactitcs"
 GGR_anti_partisan_tactics_desc: "The location may change, but the tactics remain the same. The Wehrmacht has specialized in anti-partisan activities since the fall of Poland, let alone Africa. The guerillas hope to wear us down, to strike where we least expect it and utilize hit-and-runs to destroy our determination. They hope that sabotaging our supply lines and ambushing our garrisons will be enough to discourage us. They do not seek to defeat us, only to make our efforts to neutralize them so impossibly costly that we will bow our heads in shame and admit defeat.\n\nSuch strategies may work on the Americans and Japanese, but we have no such weaknesses."
 GGR_establish_supply_lines: "Redraw The Maps"
 GGR_establish_supply_lines_desc: "When our continent colonies are re-established, they will have to avoid the mistakes of the past to ensure that another rebellion does not spring up in another decade. One of these mistakes will be our wild misinterpretation of the lay of the land, especially given our extensive anti-partisan efforts; entire villages have been destroyed, forests have been razed, and the physical geography radically altered. Our maps-and all future ones-must be updated accordingly to best fit reality."
 GGR_fortify_our_holdings: "Forfity Our Holdings"
 GGR_fortify_our_holdings_desc: "The first part of \"Fall Vorbeck\" is, at last, complete. We have established our rule over the desired part of the continent; however, it is absolutely not prepared for the continuous expansions that is about to commence. We shall fortify our newly reacquired lands to correspond with the needs of the army to proceed with our plan."
 GGR_and_get_the_rest: "And Get The Rest"
 GGR_and_get_the_rest_desc: "With our foothold seized, established, and developed, we now have free reign to strike wherever we please on the Dark Continent from a suitable base of operations. It is from this foothold that all the rest shall be conquered once again, and it is from this foothold that we shall forever shatter the illusion of independence the natives continue to dream despite it all. Heia Safari!"
 goering.vorbeck.1.t: "A Place for Traitors' Traitors?"
 goering.vorbeck.1.desc: "\"My Führer, our invasion of Central Africa will begin soon. Preparations are going according to the plan, but there is one thing I would like to clarify with you.\" Gehlen reported to the Führer.\n\nGöring looked at Gehlen questioningly.\n\n\"There are still remnants of German garrison in Central Africa, Otto Förschner and his Abwehrfront.\"\n\n\"Remnants of Hüttig's Reichsstaat?\"\n\n\"Yes, but according to our data, they're more willing to work with us. Because of our minimal intervention in Reichsstaat's business, they took power into their own hands, topping down Hans Hüttig themselves, but by doing that they only brought closer the end of this pariah state.\" Gehlen laid down the information to Göring. \"Amongst them, there are some people loyal exactly to us, like von Hassel. The most logical decision would be to make contact with them, recognize them, and call them for fighting in the invasion.\"\n\nWell, Göring was not against it. Additional troops would not be excess for sure, and they definitely have experience of war in Africa and anti-partisan operations.\n\nFührer shrugged his shoulders. \"Why not? Trained and motivated people will surely not be excess. If they personally toppled Hüttig, then, I think, we will get along just fine.\""
 goering.vorbeck.1.a: "The outcasts will serve the Fatherland again."
 goering.vorbeck.2.t: "An Accident in Afrique-Occidentale"
 goering.vorbeck.2.desc: "\"Did you know that Julius Caesar once said that the Britons were the most savage and backwards people he had ever conquered? Even after he had already destroyed the Gauls?\"\n\nArtur Axmann was polite enough to suppress his urge to roll his eyes in response to Schörner's seemingly irrelevant anecdote. Göring was not. In fact, he found such a statement to be rather rude. Most people would have reacted differently to Axmann's report. Most people would have displayed some level of tact at the knowledge that all their enemies in West Africa had managed to point their guns away from each other for once, and wheeled to face the Heer instead. By contrast, the wide grin on the Monster's face-the sheer delight he displayed at the thought of further slaughter of his enemies no matter how many banded together-told the Führer two things; that he was apparently unconcerned with this development, and that he had much more to say.\n\n\"So in this analogy, we are the Romans? And the blacks are the Celts?\" Göring predicted, his mind already wandering to how they might have to adjust their plans to fit this new region-wide ceasefire. Axmann, still present but no longer of any importance, simply remained seated in silence, knowing better than to risk offending either of his superiors with unneeded input.\n\n\"The blacks and the French, specifically. The actual Gauls fled to Britain, in a pointless effort to escape their own extinction. Likewise, De Gaulle fled to Africa to meet the same fate. I thought you could appreciate the irony.\" The words themselves were filled with disdain, but Schörner's tone remained gleeful as ever at the thought of finally ending the Free French, something which should have happened decades ago. Göring, apparently, was not as receptive to his poetry as Schörner would have liked. \"My point is that Boudicca managed to assemble an army that outnumbered the Romans thirteen to one, and still ended up slaughtered. Something similar will undoubtedly unfold in a few short months. The FMA, the PLF, the WAA…A bunch of tribals forming a ‘ceasefire' means nothing when they die just as easily as the Britons did.\"\n\n\"Except the Britons didn't have the backing of the Americans and Japanese.\" The Führer anachronistically pointed out, evidently lacking Schörner's level of confidence. \"Meaning we will have to strike quickly, before the amount of aid they receive mounts to something actually dangerous.\" In short, they needed a fast decapitation strike to prevent further arms shipments, before encircling and destroying their enemies one by one.\n\nIn other words, what the Germans did best."
 goering.vorbeck.2.a: "Not the first Blitzkrieg. Won't be the last."
 goering_peace_events.37.t: "The Conquest of West Africa"
 goering_peace_events.37.d: "West Africa was once a land largely untouched by the Reich. It had long been home to the so-called \"Free France\" government and a myriad of other African nations, remaining free from the yoke of Italy and Germany well into the 1960s. However, even this region was not entirely immune to the influence of the Reich. For years, Germany conducted a relentless terror bombing campaign across Sub-Saharan West Africa, ensuring that no major settlements could flourish and that the threat posed by these lands to German colonies remained minimal. Only with the Reich's descent into chaos during the Burgerkrieg and the eventual cessation of Luftwaffe bombing did West Africa find an opportunity to prosper.\n\nYet, the region's peace was fleeting. French, Pan-Africanist, and other political movements began to vie for control, leading to heightened tensions and inevitable conflict. War ravaged the region, as it had in many other parts of Africa, while the OFN and the Sphere also sought influence in the area, providing military and financial support to local factions. However, all of these struggles proved futile when the Reich once again rose to dominance and turned its gaze toward West Africa.\n\nFrench, Cameroonian, Malian, Liberian, and many other West African forces were forced to fight side by side, alongside OFN and Sphere-backed troops and advisors. But even this newfound unity was no match for the Reich's war machine. German tanks and planes blitzed across the Sahara, smashing through any resistance. Entire divisions were swiftly overwhelmed, as chaos spread across the battlefield. Both French and African forces were routed, and civilians fled to the ports, desperately trying to escape their doomed homelands.\n\nAs German forces reached the shores of the Gulf of Guinea, another chapter in the region's history came to a bitter close. The last remnants of the French state were destroyed, and with them, the dream of a free France. The Pan-African vision lay crushed beneath the jackboots of the invaders, just as their ancestors had suffered under colonial rule. Millions of hopes and dreams were shattered in the debris and gunsmoke of battle, as the borders of the Reich expanded further."
 goering_peace_events.37.a: "All of Africa will be a German colony."
 goering_peace_events.38.t: "The Conquest of East Africa"
 goering_peace_events.38.d: "East Africa... Few places outside of Burgundy inspire such fear and loathing. It is difficult to discuss Ostafrika without mentioning its last ruler, Hans Hüttig, for over time the region became a twisted reflection of its Reichskommissar. Before the South African War, Ostafrika was like any other Reichskommissariat: it carried out Germanization, sent resources to the Reich, and prepared land for settlers. In many ways, it was an unremarkable colony, especially when compared to Sudwestafrika and Zentralafrika. Aside from its sizable Kolonialgarrison and a relatively developed industrial base, it quickly faded from memory. However, it was Hans Hüttig who dragged it into the Reich's spotlight, transforming it into what it became.\n\nDuring the South African War, Ostafrika bore the brunt of both leadership and the fighting under the Afrikaschild. Yet as the war dragged on, the already oppressive atmosphere in Ostafrika grew even darker. Increasing numbers of slaves were forced into factories, never to return. SS patrols terrorized rural towns and villages, while chemical weapons were tested on the native population. These atrocities were just a glimpse of the horrors that would come. When Hüttig declared his personal African fiefdom and betrayed the Reich, he unleashed his most nightmarish visions. Ostafrika became a land of death and suffering, a horrifying manifestation of National Socialism at its most extreme—rivaling even Burgundy in its brutality. When his regime finally collapsed, and the Reich returned, the true extent of Hüttig's madness was revealed.\n\nReich soldiers discovered entire cities made of concrete and rebar, abandoned in the wilderness, devoid of life. In regions near the Congo, wildfires burned uncontrollably, remnants of Hüttig's slash-and-burn tactics used to root out rural guerrillas. Intelligence reports noted a myriad of other strange and disturbing remnants from his reign. The fighting itself was chaotic, as numerous groups rose up in the regime's collapse. Though the Heer managed to contain the situation, the guerrillas had endured far worse under Hüttig's genocidal campaign. Only the most resilient resistance cells remained after years of terror.\n\nNow that Ostafrika has returned to Reich control, much work remains to bring the region back in line with the standards of a proper Reichskommissariat. The Kolonialgarrison is struggling to manage the remnants of Hüttig's brutal regime, and the demining of key infrastructure in the south is expected to take years to complete."
 goering_peace_events.38.a: "What a mess..."
 goering_peace_events.39.t: "The Conquest of Central Africa"
 goering_peace_events.39.d: "The German Congo was once one of the Reich's most prosperous colonies. The staggering wealth of Central Africa—rubber, uranium, and other resources—poured into the coffers of Germany, making the burgeoning colony a vital asset for years. Had it not been for the South African War, Zentralafrika could have grown into the largest and most affluent colony outside of Europe. However, the war's aftermath marked the end of Germany's African venture and necessitated a new plan to reclaim the continent after Hans Hüttig's betrayal. Enter Von-Hassel, a collaborator within Hüttig's regime, who was chosen to organize resistance against Hüttig and pave the way for the Reich's return to the Congo.\n\nWhen the Reichsstaat collapsed and anarchy swept across Africa, Von-Hassel led the Anti-Hüttig cabal in a bold uprising throughout the Congo. In the early days, they secured key areas such as Elizabethville and much of Southern Congo, but as they pushed deeper into the jungle, the resistance intensified. The situation improved, however, as support from the Reich started to arrive, bringing with it German weapons, reinforcements, and leadership to aid in the reclamation of Zentralafrika. Slowly but steadily, the land was reclaimed meter by meter, as German forces and Von-Hassel's troops rooted out native resistance fighters and die-hard Hüttig loyalists. The fighting was brutal, and even experienced veterans from Europe found themselves learning from the local soldiers they were supposed to lead.\n\nAs the final strongholds of native resistance were obliterated, the war shifted into a more protracted, guerrilla-style conflict. Resistance fighters resorted to ambushing supply convoys and attacking isolated settlements. Despite this, the Reich declared its mission accomplished with the end of major organized resistance. Kolonialgarrison forces were raised, patrol routes were established, and search-and-destroy operations were launched. In time, the wealth of Zentralafrika would, once again, begin to flow out in abundance, enriching the Reich as it had before."
 goering_peace_events.39.a: "Heia Safari!"
 goering_peace_events.40.t: "The Conquest of Southwest Africa"
 goering_peace_events.40.d: "Südwestafrika had always held a personal connection to the Führer. It was where his father had once reigned as the first Governor-General of German South West Africa. This, along with the colony's strategic use as Africa's \"airstrip,\" made it a major objective for the Führer. In his mind, everything and everyone in that colony owed their existence and prosperity to his father and the Luftwaffe—by extension, to himself. So when Hans Hüttig seized these lands after the South African War and executed Reichskommissar Schenck, it became deeply personal for Göring. Beyond the personal affront, the loss of Südwestafrika's resources and its burgeoning Aryan population at the time of its fall was a significant blow.\n\nThe Reich's offensive to retake the colony was brutal. In the power vacuum created by Hüttig's collapse, factions that had risen in his wake—such as UNITA and the MPLA—had been locked in conflict. But when the Heer returned, these forces were ill-prepared for what followed. The rolling plains of Southwest Africa proved ideal for tank warfare. Armored lines surged across the savannah like the big cats their tanks were named after, hunting down enemy forces. Above, helicopters leaped across the horizon like grasshoppers, swiftly transporting infantry companies across the plains. And high above all, the Luftwaffe, determined to reclaim their African home, dominated the skies. Jets streaked through the air like great martial eagles, unleashing devastating airstrikes day and night on their enemies.\n\nUNITA and the MPLA were decimated in open battle, reduced once again to guerrilla warfare against the Reich. For the native Africans, it was a dreaded return to the oppressive rule they had hoped to escape, but resistance would have to continue for the foreseeable future. As for the Aryan settlers who had remained, the return of Reich authority, after enduring the chaos and anarchy on their own, was a welcome relief. Security had finally returned to Südwestafrika, under the iron grip of the Reich."
 goering_peace_events.40.a: "A return to normalcy."
 goering_peace_events.41.t: "The Conquest of South Africa"
 goering_peace_events.41.d.base: "South Africa has endured a series of devastating events in recent years, from the Cape Town massacre to the South African War. Tensions among the various groups in the region — the Boers, Native Africans, and British settlers — have steadily worsened over time. When the Reich pushed its forces southward, these groups were forced to unite, albeit uneasily, against the advancing German war machine.\n\nAlthough the South African government had anticipated the possibility of renewed conflict, it was unprepared for the sheer scale of this new war, which quickly plunged the nation into chaos. Reports from the frontlines painted a grim yet familiar picture: German tanks cutting through entire divisions, Boers loyal to the Reich rising in insurgency, seizing supply depots and strategic junctions, and the Luftwaffe raining destruction from above. The scars of the previous war were still fresh, and the population, already weary, faced the dread of another conflict. The fall of Cape Town became less a matter of \"if\" and more a question of \"when.\" In the final days of the war, desperate citizens fled aboard ships departing from Cape Town and East London, in scenes reminiscent of the evacuations from Scotland at the end of the Second World War.\n\nOnce defiant, South Africa had been brought to its knees. Its cities lay in ruins, its military was shattered, and its spirit broken. Now, towns and cities across the country are draped with the Reichsadler, while the imposing figures of Wehrmacht MPs patrol the streets. The South African government has been dismantled, with ministers, generals, and judges either captured or forced into hiding. A new Reichskommissariat is being established to bring South Africa under the strict control of the Reich's colonial administration. In time, the diamond mines will be reopened, and new ones will be constructed to exploit the strategic resources found beneath South African soil."
 goering_peace_events.41.d.boers: "When the South African War ended, it did so with a ceasefire, not the decisive victory either side had anticipated. The conflict had dragged on far too long, costing both the OFN and the Reich countless lives and machines, now scattered across the veldt. Despite the stalemate, one clear victor emerged: the Boers. Their movement had successfully liberated the Orange Free State, allowing it to finally break free from Cape Town. For the first time in a long while, the Boers could determine their own destiny, and they chose to align themselves with the Reich. However, even with the ceasefire in place, tensions between the newly independent Boers and an increasingly anxious South Africa quickly became routine.\n\nCross-border skirmishes and mortar exchanges became the norm along the South African-Boer border. A predictable rhythm developed, and for a time, it seemed this state of affairs might continue indefinitely. But the Heer's High Command had other plans. To them, the ceasefire was not worth the paper it was written on, and preparations were quietly made to resolve the South African issue once and for all. The Heer knew that the OFN wouldn't stand idly by as their new ally, South Africa, came under attack. So the operation was planned in close collaboration with the Boers, who provided the Heer with local intelligence and, most notably, infiltrated Boer guerrilla forces. Combined with the Heer's superior armored and airborne capabilities, South Africa's defenses quickly crumbled.\n\nSouth African forces found themselves overwhelmed by Heer armor in large-scale battles or annihilated in ambushes deep within their own territory. The hybrid threat of conventional and irregular warfare, perfected since the previous war, proved devastating. Although the OFN had intended to defend South Africa, they were unable to react in time. The Reich's lightning-fast offensive rendered their efforts futile, leaving South Africa isolated in its hour of need. The OFN could only watch in stunned silence as the last stronghold of freedom in Africa was crushed, shattering the hopes they had nurtured since the conclusion of the previous South African War."
 goering_peace_events.41.a: "Now onto to nationalizing the De Beers company."
 goering_peace_events.41.b: "The OFN humbled, once again."
