 GGR_fall_blau:0 "Fall Blau"
 GGR_fall_blau_desc:0 "After the fall of France, there's only Iberia stands to the west of the Reich. Like the Italians, the Iberian nations were once our allies during the World War II, and quickly became our opponents after the establishment of the New Order. To ensure the secure of our western border when the war with Italy begins, Iberia must be brought knee as soon as possible.\n\nMeanwhile, in Iberia, the Iberian Union has ceased to exist not too long ago, leaving two vulnerable nations to face our military forces alone. Therefore, this new military operation named Fall Blau will consist two parts with each part dealing with one nation. Soon we'll be enjoying the blue ocean and golden sunshine of Atlantic on the western beach of the Iberian Peninsula and cheering at the success of Fall Blau."
 GGR_operation_antonio:0 "Unternehmen Antonio"
 GGR_operation_antonio_desc:0 "In history, Portugal was never a friend of we German people and with their existence at the westernmost part of Europe, we can never make our attacks on other nations without worrying about our back. Thus, a military operation against Portugal is a significant part of the Fall Blau and will have far reaching influence on our future strategic deployment.\n\n400 years before, during the Portuguese succession crisis, António, Prior of Crato was crowned as the King of Portugal and lead their people against the Spanish intruders, but was defeated and forced to exile in the end, which made the Spaniard overlord of Portugal. After 400 years later, the operation named after him will bring them to our keens as well. And our march won't stop for a while until we reach the western coast of the Iberian Peninsula."
 GGR_keep_the_ofn_at_bay:0 "Keep the OFN at Bay"
 GGR_keep_the_ofn_at_bay_desc:0 "Ever since over victory in the civil war, the Americans have been watching and plotting against the Reich. Due to their ties with South American countries and Portugal itself, they're likely to make intervention in our planned war against Portugal.\n\nTo avoid that situation, some radicals in the Wehrmacht and the government have proposed that we should send the Kriegsmarine to Atlantic to warn the OFN about the consequences of intervention. Though such a proposal seems too risky at current situation, rejecting it may enrage the militarists in the Reich. We can only hope that by doing this the Americans don't want to take a risk of clash with our forces and withdraw their influence from Europe."
 GGR_agitate_anti_spanish_sentiment:0 "[ROOT.GetGGR_agitate_anti_spanish_sentiment_title]"
 GGR_agitate_anti_spanish_sentiment_desc:0 "[ROOT.GetGGR_agitate_anti_spanish_sentiment_desc]"
 GGR_agitate_anti_spanish_sentiment_title:0 "Agitate Anti-Spanish Sentiment"
 GGR_agitate_anti_spanish_sentiment_desc2:0 "Being the only two remaining Iberian nations, Portugal and Spain share a long and complicated history between them. However, in recent years they've been on better terms with each other than ever before, especially in recent days after World War II.\n\nDespite of such close ties, the so-called Iberian Divorce that happened not long ago has proven that there still exists some kind of distrust between them, which gives us opportunity to provoke their hostile toward the other. We can remind the Portuguese of their misery under the Spanish rule hundreds of years ago. May their hatred will never be forgotten and continue pricking their proud hearts."
 GGR_your_brothers_did_not_fare_much_better:0 "Your brothers did not fare much better"
 GGR_your_brothers_did_not_fare_much_better_desc:0 "Being the only two remaining Iberian nations, Portugal and Spain share a long and complicated history between them. However, in recent years they've been on better terms with each other than ever before, especially in recent days after World War II.\n\nFor us, considering the recent fall of Spain, their close ties also give us an opportunity to launch a propaganda campaign against the Portuguese. By reminding them of their position that surrounded by the Reich with no allies to hope for, we can extinguish their will to resist and gain great advantages when the war breaks out."
 GGR_making_an_entrance:0 "[ROOT.GetGGR_SPA_making_an_entrance]"
 GGR_making_an_entrance_desc:0 "[ROOT.GetGGR_SPA_making_an_entrance_desc]"
 GGR_making_an_entrance_title:0 "Making an Entrance"
 GGR_making_an_entrance_desc2:0 "After all the preparations done before, now the time to make an Entrance to Iberia has come. Being the lesser one, Portugal will be the first target of our campaign. Without any help from American as well as Spain, this little nation won't have any chance to fight against us.\n\nNow, the landing ships is proceeding to the Atlantic waters accomplished by the Kriegsmarine and Luftwaffe. The Portuguese will pay for their betrayal of the Reich before, and Lisbon will take damage equal to that famous earthquake in their history. And the most important part is, with the success of Fall Antonio, we'll be able to launch our attack upon Spain from two sides when the Fall Philip begins."
 GGR_finishing_the_job_title:0 "Finishing the Job"
 GGR_finishing_the_job_desc:0 "After all the preparations done before, now the time to finish our military campaigns in Iberia has come. Being the only remaining nation in Iberia, the conquest of Portugal will be a great finishing point of our war on the Western Front. With the fall of Spain, Portugal will have to face our full-scale offense alone.\n\nBy both the sea and the land, the troops of Wehrmacht have are now moving to our border between us and Portugal. The Portuguese will pay for their betrayal of the Reich before, and Lisbon will take damage equal to that famous earthquake in their history. The Fall Blau is going to have a splendid ending show when we hold our victory parade before their famous Mosteiro dos Jerónimos."
 GGR_reorganize_france:0 "Invade France"
 GGR_reorganize_france_desc:0 "A former enemy of the German nation, France may be the most failed nation in Western Europe after the World War II. Caught in its never-ending dilemma, every aspects of France seems to be in complete chaos due to its inefficient government, the Resistance and the SS behind the shadow, which makes them continue to losing territories and stops them from doing anything useful in the pakt.\n\nConsidering our need to conquer and rule over Iberia, the current position of France in the Reich must be totally abolished. We'll invade France to finish off a pitiful French statehood and establish Militärverwaltung Frankreich in its place."
 GGR_hubschrausser_stosstrup_kompanie:0 "Hubschrausser Stosstrup Kompanie"
 GGR_hubschrausser_stosstrup_kompanie_desc:0 "Some in the army has questioned our military plan about Iberia and say even Napoleon was defeated in the Iberian Peninsula. What they failed to understand is that, technology is one of the most important factors of war and an advanced technology will help us avoid such humiliation that Napoleon suffered-the helicopters.\n\nBeing able to transfer and deploy troops to almost anywhere on the battlefield swiftly, our research in them has made great breakthroughs in recent years. During the Fall Blau, our most advanced helicopters will be organized as the hubschrauber stosstrupp kompanies and lead our forces right into the peninsula. Our enemies are going to be freaked out when they witness our crows of death suddenly appear above their heads and drop our soldiers down."
 GGR_marine_stosstrup_kompanie_tooltip:0 "§BWe shall prepare Marines to assault the Iberian Beaches!§!"
 GGR_marine_stosstrup_kompanie:0 "Marine Stosstrup Kompanie"
 GGR_marine_stosstrup_kompanie_desc:0 "Some in the army has questioned our military plan about Iberia and say even Napoleon was defeated in the hills on Iberian Peninsula. What they failed to understand is that, strategy is one of the most important factors of war and with proper strategy there will be no need for the Heer to face those strong forts directly. Instead, another kind of corps will help us break into Iberia-the marine corps.\n\nJust like the way we conquered France, the best way to deal with enemy's defense is to bypass it, but this time we will do it by sea rather than the land. Just let the Iberians sleep well in their mountain fortifications! When they wake up, they'll be shocked behind them their defenseless nations have been swept by our Marine stosstrupp kompanie."
 GGR_operation_philip:0 "Unternehmen Philip"
 GGR_operation_philip_desc:0 "30 years ago, Spain was just like us before, consumed by the flames of Civil war. Thanks to our assistance, they finally managed to get rid of the Communist ghost. But those ungrateful Spaniards quickly betrayed our trust, making their alliance with other traitors in Europe.\n\nBut now, as we finally recovered from the German Civil War and start our grand conquest of Europe, Spain will meet their punishment as well. Named after the famous King Philip of Spain, a military operation has been drafted to help us conquer that nation. The end of Spain will be the beginning of a new stage of the New Order reborn."
 GGR_agitate_anti_portugese_sentiment:0 "[ROOT.GetGGR_agitate_anti_portugese_sentiment_title]"
 GGR_agitate_anti_portugese_sentiment_desc:0 "[ROOT.GetGGR_agitate_anti_portugese_sentiment_desc]"
 GGR_agitate_anti_portugese_sentiment_title:0 "Agitate Anti-Portuguese Sentiment"
 GGR_agitate_anti_portugese_sentiment_desc2:0 "Being the only two remaining Iberian nations, Spain and Portugal share a long and complicated history between them. However, in recent years they've been on better terms with each other than ever before, especially in recent days after World War II.\n\nDespite of such close ties, the so-called Iberian Divorce that happened not long ago has proven that there still exists some kind of distrust between them, which gives us opportunity to provoke their hostile toward the other. We can spread fake messages about how the Portuguese betrayed the Spaniards' plan of a united Iberia and subverted the Union. With agitated nationalist sentiment the cooperation between these two nations can be perfectly avoided."
 GGR_make_them_regret_title:0 "Make Them Regret"
 GGR_make_them_regret_desc:0 "Being the only two remaining Iberian nations, Portugal and Spain share a long and complicated history between them. However, in recent years they've been on better terms with each other than ever before, and even established a political union after the World War II.\n\nBut lucky for us, this union only last for a short while before Spain decided to break away with Portugal, leaving the later easily conquered by us only. Now, the Spanish must face our attack from both west and east. With proper propaganda, we can make them tremble in their pity trenches, regretting their decision to end the Union, and as people always say, it's no use crying over spilt milk."
 GGR_rebuild_the_gustav:0 "Rebuild the Gustav"
 GGR_rebuild_the_gustav_desc:0 "The Spanish people believe that their impregnable forts in mountains will grant them safety and protection from our troops, but they seem to forget that there was a destructive super weapon in our army. Aimed for the Maginot Line, the Schwerer Gustav built by Krupp is capable of destroying any forts in the world.\n\nThough during the fall of France that railway artillery didn't come in handy due to strategic reasons, its power had never become obsolete. By rebuilding such a mighty beast, there'll be no obstacles between us and Madrid for the Heer. The Spanish defenders are going to die in desperation when their shelters which are thought to be indestructible are blown into pieces and dust."
 GGR_finishing_the_job:0 "[ROOT.GetGGR_POR_making_an_entrance]"
 GGR_SPA_making_an_entrance_desc:0 "After all the preparations done before, now the time to make an Entrance to Iberia has come. Close to our border, Spain will be the first target of our campaign. Without overwhelm firepower on our side, this little nation won't have any chance to fight against us.\n\nNow, our garrisons have reached the border, and Kriegsmarine and Luftwaffen. Spain will pay for their betrayal of the Reich before, and Madrid will be conquered for the first time since the fall of Napoleon's empire. And this time, with advanced technology and national socialist doctrine on our side, we won't be easily defeated like that famous French emperor."
 GGR_SPA_finishing_the_job_desc:0 "After all the preparations done before, now the time to finish our military campaigns in Iberia has come. Being the only remaining nation in Iberia, the conquest of Spain will be a great finishing point of our war on the Western Front. With the fall of Portugal, Portugal will have to face our attack from all directions.\n\nNow, our garrisons have reached the border, and Kriegsmarine and Luftwaffen. Spain will pay for their betrayal of the Reich before, and Madrid will be conquered for the first time since the fall of Napoleon's empire. And this time, with advanced technology and national socialist doctrine on our side, we won't be easily defeated like that famous French emperor."
 GGR_missing_ships:0 "Missing Ships"
 GGR_missing_ships_desc:0 "Schörner's influence over our government and army has been a serious problem for a very long time. Though trigging direct conflict with him will be unwise, war has brought us several chances to limit his power. Since his influence has reached too high at present, the invasion of Iberia will be an optimal chance for actions.\n\nAccording to our military plan, many of our officers including Schörner's loyalists will be transported by ships. By proper arrangement, we can make some ship be filled with Schörner's men and then just disappear on sea. Sea monsters, Iberian infiltrations, American spies...people may blame this accident on different names, and a horrific legend will be a perfect story for us."
 GGR_give_schorner_a_taste_of_his_own_medicine:0 "Give Schörner a taste of his own Medicine"
 GGR_give_schorner_a_taste_of_his_own_medicine_desc:0 "For a long time, while other generals try their best to reduce casualties during battle, Schörner has been for his fanaticism about mass assault doctrines, even when his men are facing enemies' fortifications. There is a widely whispered explanation of his paranoia that he just wants to get rid of those whose loyalty toward him are suspected. Though such a story sounds hard to confirm, the Führer himself still appreciate Schörner's genius in the story regardless of their personal relationship.\n\nAnd now, during the invasion of Iberia, reports about the fortifications in the hills caught the Führer's attention. Those forts are surely hard to attack and occupy, so why don't we make Schörner's loyalists deal with them? No matter what their plan is, our orders will be simple and clear: keep charging until those forts are occupied or destroyed. And the greatest part of this plan is, Schörner will have no reasons to reject our orders. Thinking of that point, a little smile creeps across the Führer's mouth."
 GGR_restoring_the_union:0 "The Peninsula Reunited"
 GGR_restoring_the_union_desc:0 "A divided Iberia has caused too much instability and turbulence in Europe. Franco and Salazar were wise to create a united Iberia to avoid such endless conflicts, but without proper guidance, chaos quickly stroke back and consumed these two caudillos' success. And only thanks to the Reich's quick move, order has been restored on the Iberian Peninsula.\n\nAs a result of such a history, the Reich has made the decision that the Iberian Union will be restored by us. Being the protector of Europe, we'll take the responsibility to maintain peace and order in Iberia. Guarded by the Wehrmacht, this time the Union will last as long as the Reich itself."
 GGR_recruit_remaining_partisans:0 "Recruit Remaining Partisans"
 GGR_recruit_remaining_partisans_desc:0 "For decades, several partisan organizations have been active in Iberia and caused many troubles to the governments, and even the caudillos cannot pacify those guerrillas in their land. Though their activity has dropped a lot after the Divorce, they could still be a serious problem for our rule in Iberia if we don't find a proper way to deal with them.\n\nThough many has suggested that those partisans are dangerous to our rule and need to be eliminated, the Führer believes such ideas are too unrealistic and naïve, since even local governments cannot achieve that. Instead, he believes that we can use some partisan organizations who aren't hostile to the Reich to fight more dangerous enemies and keep peace across the peninsula. It's obvious that his genius will grant us stability of Iberia."
 GGR_communication_blackout:0 "Communications Blackout"
 GGR_communication_blackout_desc:0 "When the Iberian Union still exists, the relationship between ordinary Spanish and Portuguese people had never become as close as their propaganda works depict. And now, after the Iberian Divorce and our conquest of these two nations, their opinions toward each other are even more complicit than before.\n\nA failed marriage is always a tragedy for people inside and outside the family, and the Reich is willing to do them a little favor. If you find each other hard to get along with, then fine, you don't need to see or hear them now, for the Reich will cut all connections between you and your former partner. From now on, the Spanish and Portuguese will be living in the harmony provided by the Reich and no longer hear the disturbing words from the other part of Iberia."
 GGR_allies_in_the_north:0 "Allies in the North"
 GGR_allies_in_the_north_desc:0 "In the north part of Iberia lives the nation of Basque, who has been oppressed by the regime in Madrid for a very, very long time. And just like we Germans, they never relinquished their dreams about a united, powerful and independent nation state, even it means the sacrifice of their bloods and lives. Therefore, the Wehrmacht and the German people respect the Basques for their unyielding spirits, and are willing to help them achieve their dreams.\n\nWhile an independent Basque nation may be too unrealistic now, we can liberate them from the Spanish and grant them some kind of autonomy, in exchange of their help in our local policing and war efforts. In addition, we will absorb more Basques into our battle units and describe our treatment of them as a proof of the Reich's benevolence. The loyalty of Basque will be shield of our rule in the peninsula."
 GGR_loot_the_east:0 "Loot the East"
 GGR_loot_the_east_desc:0 "In the east of the peninsula, the Catalans have been shouting for their independence for many years. In German People's eyes, they aren't as noble and brave as the Basques, since all they've done is complaining about the oppression from Madrid and they don't even have the courage to form their own resistance organization like the Eta.\n\nAs a result, while the Basques are receiving favored treatment from the Reich, the Catalans will face harsh rule from us. Their industries and resources will be nationalized by Germany, and every move they take will be closely watched. If they dare to do anything without the permission from us, they're going to face some serious consequences. In the past, they said they don' t like to be oppressed by Spain, but only from now on, they're going to realize what real oppression means."
 GGR_go_west:0 "Work in the West"
 GGR_go_west_desc:0 "Beyond the mountains, the western part of the Iberian Peninsula is the furthest part of western Europe, which means rebels there will be much hard to track and crack down. Believing the long-distance from Berlin can stop us from efficiently governance, some resistance groups have risen and taken up arms to fight against us.\n\nBut for the Reich, every inch of land with the border is precious and must be watched and ruled seriously. We will never keep a close eye due to the long distance, but on the contrary, even more efforts will be taken to make our control of the peninsula can be controlled as solid as other parts in Europe. No one can get away from the Reich's fist, even if they live in the remotest corner of the earth."
 GGR_enemies_in_the_south:0 "Enemies in the South"
 GGR_enemies_in_the_south_desc:0 "At the southernmost tip of the Iberian Peninsula, fishermen have seen the rise and fall of great empires on the two continents, until now all the dusts of history settle as the Reich has seized the peninsula as well as the strait. Meanwhile, with the fall of the Iberian nations, the desert of Morocco is now a land without owner, and all we need to do is to take whatever still lies there.\n\nIn addition, the fall of Gibraltar also means the lifeline of Mediterranean nations is now in the grasp of us. The block of the strait will greatly weaken our potential enemies in that area such as Turkey and Italy and make our conquest of Europe much easier. Once upon a time, the great power who controls the whole Mediterranean was seen the greatest empire in the world. And from today, the golden road of glory and greatness has lied before us."
 GGR_fall_blau2:0 "Fall Blau"
 GGR_into_the_abyss:0 "Into The Abyss"
 GGR_the_smugglers:0 "The Smugglers"
 GGR_pakt_wide_crack_down:0 "Pakt Wide Crack Down"
 GGR_the_misguided:0 "The Misguided"
 GGR_setting_up_shop:0 "Setting Up Shop"
 GGR_the_masters:0 "The Masters"
 GGR_shatter_their_dreams_like_glass:0 "Shatter Their Dreams Like Glass"
 GGR_a_new_kind_of_union:0 "A New Kind Of Union"
 GGR_guns_for_the_rightful:0 "Guns For The Righteous"
 GGR_the_rebels:0 "The Rebels"
 GGR_targeting_the_source:0 "Targeting The Source"
 GGR_the_traitors:0 "The Traitors"
 GGR_divide_the_discontent:0 "Divide The Discontent"
 GGR_the_conquered:0 "The Conquered"
 GGR_the_hub_of_iberia:0 "The Hub Of Iberia"
 GGR_securing_loyalty:0 "Securing Loyalty"
 GGR_the_admiral:0 "The Admiral"
 GGR_securing_africa:0 "Securing Africa"
 GGR_forming_the_asb:0 "Forming The ASB"
 GGR_divert_their_attention:0 "Divert Their Attention"
 GGR_friends_in_the_weirdest_places_title:0 "Friends in the Weirdest Places"
 GGR_fall_blau2_desc:0 "After the fall of France, there's only Iberia stands to the west of the Reich. Like the Italians, the Iberian nations were once our allies during the World War II, and quickly became our opponents after the establishment of the New Order. To ensure the secure of our western border when the war with Italy begins, Iberia must be brought knee as soon as possible.\n\nAccording to the Führer's command, this new military operation named Fall Blau will be tasked to wipe those factions out in one single invasion and restore stability on the peninsula. Soon we'll be enjoying the blue ocean and golden sunshine of Atlantic, as well as local people's cheers for peace on the western beach of the Iberian Peninsula and cheering at the success of Fall Blau."
 GGR_into_the_abyss_desc:0 "Iberia was once a wealthy land of Europe, with the Spanish Empire rising from the horizon and establishing the first so-called \"the empire on which the sun never sets\". Time flies, and the empire has long gone into dust, leaving nothing but total trash behind it. Some wise men like Franco and Salazar had tried to hold the last ray of their former glory, but even their efforts were in vain at the end. At this moment, the peninsula is consumed in the flame of bloody conflicts, with different factions fighting endlessly with each other, hoping to find their own place in this chaotic abyss.\n\nBut only we know that, soon this brutal drama will meet its end, as the Reich's iron fist has prepared to smash on the peninsula. It won't take long until we bring true peace and stability on this land of misery and restore a united Iberia what they have forsaken before."
 GGR_the_smugglers_desc:0 "When the whole world collapses, there will always by someone who thinks they're smart enough to gain profits from their brothers' miseries. In Iberia, when all other states were fighting against each other for their own causes, the Galicians on the northeast part of the peninsula are greedily collecting coins by smuggling weapons to all other warring states.\n\nFrom the National Socialist point of view, such an avaricious nation is a shame of human kind and a natural enemy of German people. The Wehrmacht will be tasked to eliminate this dirty deed quickly and precisely, and annihilate all those blood-sucking insects from the earth, rekindling the flame of morality on the peninsula with our National Socialist holy flames."
 GGR_pakt_wide_crack_down_desc:0 "Though we have put many efforts on the development of European nations, not all members in the Pakt appreciate our kindness. In fact, betrayals and other dirty deeds are nothing new in our so-called allies. And at this moment, when the Reich is focused on the conquest of Galicia in the remote corner of Iberia, those parasites in the Pakt have found their opportunities to weaken the Reich by smuggling weapons to the enemies of the Reich.\n\nTo prevent their crimes from damaging the Reich's cause, we must take inspections on these nations and crack down all suspected moves we can find. A new Pakt free from the harassment of inspects will serve the European nation much better than before."
 GGR_the_misguided_desc:0 "Not all ethnic groups in Iberia are inferiors in our National Socialist racial theory. The Basques, for instance, is viewed as fellow Aryans in our eyes. Though long oppressed by the Spanish in history, the Basques have never given up their struggle for national liberation and their rightful place in the world. Such courage, resolve and unyielding will is just the proof of their noble origins, and are always respected by the German people.\n\nHowever, even the most noble child could still fall into a wrong and dark path without rightful guidance. Trapped in the Iberian quagmire, the Basque people have forgotten their blood and degenerate into barbarism and ignorance. Luckily, as the natural leader of all Aryan people in this world, the Reich has more than enough patience toward its little brothers. Now, we're going to shoulder the responsibility of the Basque nation's education and guide them back to the shining road that they're born to take."
 GGR_setting_up_shop_desc:0 "The Iberia Peninsula is distant from Germania, and the situation there can be very complex to deal with. Consequently, it will be a necessity to set up local headquarter for the Wehrmacht if we wish to push further into the hearts of the Iberian nations. And with the conquest of Basque people's homeland, we've found the ideal position for this headquarter.\n\nLocated on the north part of Iberia, the Militärverwaltung Baskenland will be tasked to maintain local order, collect industries, and most importantly, serve as the command center of our forces on the Iberian battlefield. Each unit is an organ, and the HQ will be the brain to coordinate their moves and make actions as quickly as possible."
 GGR_the_masters_desc:0 "At the center of the peninsula lives the Spanish nation. For a very long time they'd been the master of Iberia and ruling over all other nations, until the recent collapse of the Iberian Union. Though they've lost almost everything they'd conquest in hundreds of years, their old memories about being the master of Iberia and even a world empire has never faded in their heart.\n\nHowever, as the Reich has made them the next target of our conquest, even the most idealistic Spanish people must face the fact that the hope has extinguished in this cursed land. Old days are always good, but no matter how beautiful they look, all old good days have gone forever. The fall of Spain has come."
 GGR_shatter_their_dreams_like_glass_desc:0 "The glory of Spain has gone a long time ago, but in the south the dreams of a Spanish republic still burn brightly, and attract many people under their banner. Though just being daydreams right now, they may leak into reality one day if we don't treat them seriously. Such dreams cannot be allowed to live and actions must be taken quickly.\n\nSome people may say, that the power of dream is the most overwhelming one in this world, but we wish to have test, that can dreams stand against the power of artilleries and bombs. In the end, the Spanish people must be wakened from their sweet dreams and face the brutal fact that they're nothing but a failed nation to be dominated by the German Reich."
 GGR_a_new_kind_of_union_desc:0 "The Iberian Union has dead a long time ago, but its corpse still remains and dreams of returning to the living world once again. For those faceless bureaucrats, they will work to the end as long as the Union still exists in name rather than simply committing their failures. To merely maintain the illusion of their old lives, they'll be willing to work with anything or anyone which they can find hope from. And the good news is, we've decided to give them a hand.\n\nBy giving them a little financial and material assistance, they will be asked to cooperate with us in administration and policing. With someone both loyal to us and familiar with local situation, our rule in the peninsula will be much more solid."
 GGR_guns_for_the_rightful_desc:0 "While most Spanish people have forgotten how much assistance the Reich had given to them, a small group called the Frente Azul has shown their willingness to cooperate with the Reich. Found by the veterans from the famous División Azul, their belief in our National Socialist doctrine has stood the test of battle and time. And now, as the Reich is looking for collaborators in the Iberian campaign, a helping hand from them is worthy of consideration.\n\nFor now, the Führer has authorized the shipment of guns and ammunitions to the fighters in the Frente Azul. Some may holds doubts about such a decision, for the Frente Azul has been known for their brutality and insane activities, but we know that political interests is the only thing that the Reich should consider, and we'll never stop here for some stupid moral reasons."
 GGR_the_rebels_desc:0 "Catalonia, the nest of devils in Iberia, is the first place where the fire of rebellion starts to consume the old order that the Caudillos built. Though their rebellion gives us the opportunity to launch an attack into the peninsula, such treachery has angered our honest soldiers greatly, and many have been looking forward to destroy them since the Iberian Civil War breaks out.\n\nFor the Reich, however, the invasion of Catalonia also has its strategic significance. Catalonia is at the borders of our sphere, and it will be a breaking point of our military campaigns in the peninsula. Meanwhile, the destruction of Catalonian rebels will be a great strike for those who hope to see the end of our new order, especially those cunning leftists. Be aware, you filthy rebel scums, the Reich is prepared to strike back right now."
 GGR_targeting_the_source_desc:0 "Barcelona, the heart of Catalonia, is the gate of hell in Iberia where all the devils come from. For decades, communists, anarchists, separatists and all other kinds of terrorists have born here and spread those viruses to this world, which eventually leads to the current flames in Iberia. Some has to stand against such evil, and that warrior would be no one but the German Reich.\n\nFrom the famous Sagrada Família to the sunny beaches, each brick of this city is polluted by the sins of the Catalans. This city cannot be allowed to exist in this world anymore, for it will only produce nothing but more madness and chaos. The German artilleries will raze its buildings and streets to the ground, and when all sounds become silent, purity will be restored in this wasteland."
 GGR_the_traitors_desc:0 "For a very long time, the Portuguese had been the master of Iberia alongside the Spanish. When Franco and Salazar decided to unite their two nations, they thought it could ensure the unity and stability of their beloved homeland. But in the end, the Portuguese betrayed such a noble plan, leading to the downfall of the Union and the following catastrophe.\n\nThough Portugal is the most distant nation in Western Europe, their despicable deeds has angered all brave Aryan warriors, for loyalty is the most precious virtue in our culture. The Portuguese will pay the penalties for their stupid decisions before, and the Reich's realm will reach the westernmost coast of the European Continent."
 GGR_divide_the_discontent_desc:0 "A traitor will never stay loyal to anything, even their own kinsmen. After the fall of the Iberian Union, the Portuguese quickly turned on each other, consumed in their endless in-fighting in the name of ideology or political ideals. Therefor the new government of Portugal's fate has destined that it will continue to collapse into pieces even though they've just gained their precious independence.\n\nHowever, the weakness of our enemy will bring opportunity to us. By simply spreading rumors about their current government, those Portuguese who share different ideology with its leader will gladly betray it and eventually crashed it down, stopping them from organizing resistance towards us. Pity nations like the Portuguese will never understand the power hidden in the words of \"unity\" and \"loyalty\"."
 GGR_the_conquered_desc:0 "After such a long and complicated campaign, the battle of Iberia has finally end with another total victory of the Reich. Spain, Catalonia, Basque, Portugal, Galicia... many names have fought for this realm, but in the end, they are all swept by the Wehrmacht, kenning before our boots, trembling and begging softly for our mercy.\n\nThough all those names have become nothing but a page in our history books, the work is still far from being finished. There's still lots of unrests spreading over the peninsula, and many is watching in the darkness, watching to destabilize our rule that has just been set up. But for this moment, let us all rejoice for another glorious triumph of our great fatherland! Sieg Heil!"
 GGR_the_hub_of_iberia_desc:0 "In history, Spain is always the hub of Iberia, both geographically and politically. As a results, those who control Madrid controls the whole peninsula, and if we wish to secure our dominance of Iberia, Spain must become the heart of our governance.\n\nHowever, since the decline of Spain as a world power, its industries have been known for being backward, and its infrastructures are even worse. To ensure our rule over Spain, a huge construction program must be made to improve the infrastructure levels to a standard that can at least be tolerated in our eyes. We acknowledge it won't be easy to finish such a grand work in a short time, but the Reich is always capable of making miracles, right?"
 GGR_securing_loyalty_desc:0 "The nations of Iberia have been wiped out, and now there exists six different MWs in the Iberian Peninsula in total. We know that relationship between central and local governments is always a serious problem for all regimes in Iberia, and the fall of the Iberian Union has shown us what could happen if we cannot find a proper solution about it.\n\nHowever, the Reich is different from all previous and corrupt regimes. All those RKs will be observed closely by our agents, and every move they take cannot avoid our attention. The failures of the Iberian Union can never be repeated, and every local Reichskommissar will keep it in his heart that Germania always has an eye watching at him."
 GGR_the_admiral_desc:0 "Though we've eliminated all states in Iberia, there's still a little spot in the peninsula that are not in our hands. During the chaotic time, the strait was seized by Admiral Fernando from Portugal for his own, and as an ambitious bastard he decided to use it as his own political capital in international political circles. If the strait continues to be under control of such an unreliable person, the Third Reich's Europe is always under threat.\n\nTo alter such an awkward situation, the Führer has ordered to advance and occupy the strait regardless of its defender's warning. As an Admiral without a fatherland to sustain him, there's no way that they can survive our fires. The total unification of Iberia under the Reich is finally about to come."
 GGR_securing_africa_desc:0 "At the southernmost tip of the Iberian peninsula, fishermen have seen the rise and fall of great empires on the two continents, until now all the dusts of history settle as the Reich has seized the peninsula as well as the strait made by ourselves. Meanwhile, after the fall of the Iberian nations, the desert of Morocco still exists as an independent state and waiting for us to take.\n\nAcross the strait, they must have heard our names and tales about how the Wehrmacht swept the peninsula. Therefore an ultimatum will be given to them with an option, surrender to the Reich or face our invincible troops, and it won't be a difficult question for them to answer, will it?"
 GGR_forming_the_asb_desc:0 "Iberia has been conquered, the civil war has ended, but the peninsula is far from pacification. Nationalists, monarchists, liberalist, socialists, anarchists and even communists must be plotting against their new master, and the terrorist organizations that founded long before our conquest still exists and will always threaten our regime like haunting ghosts if we don't deal with them. Action must be taken immediately if we wish to have a stable Iberia at our back.\n\nThat action, as our trusted generals have seen, is not difficulty to find. In the past, the Iberian Union had the Axencia Anti-Separatista to fight against the terrorists, and we will create a similar department called \"Agentur zur Seperatistenbekämpfung\", or ASB in short. Some may say learning from the AAS will be a mistake, for they had totally failed their duties in past, but how the hell could the German agents act as poorly as those Latin trash? A peaceful and stable Iberia will be created by the ASB swiftly and effectively."
 GGR_divert_their_attention_desc:0 "The fall of the Iberian nations has taught us a simple truth: a united Iberia may be powerful enough to challenge our hegemony over their land, but a divided Iberia will be easy to conquest and rule. If we could make them busy fighting with each other, they will never have opportunity and ability to stage an uprising against our MWs above their heads just like how they defeated Napoleon's forces in the 19th century.\n\nTo fan the flames of ethical conflict, we will spread provocative rumors and give them enough space to argue with other ethnic groups. Thousands of years has planted seeds of hatred toward neighbors in their hearts, and all we need to do is to provide a little water, so that flowers of conflict and blood will blossom on every corner of Iberia."
 GGR_friends_in_the_weirdest_places:0 "Friends In The Weirdest Places"
 GGR_friends_in_the_weirdest_places_desc:0 "In Iberia, there has been several different groups of terrorists who hate each other as much as the central government in Madrid. While many thought they are just enemies of the Reich that need to be eliminated, some intelligent generals have persuaded the Führer that by proper words and price some of those terrorists will be willing to serve the Reich since we may have the same targets with them.\n\nWith those 'allies' on our side, a lot of manpower and equipment will be saved on the villages and mountains of Iberia, and the threats that our RKs face will be much easier to deal with. They may not be the best friends we can make, and it is understandable such some may think the places we choose to make friends are too weird, but no one can deny that they will be useful friends to us. And if someone is foolish enough to question our decision, well, they'll be 'convinced' after all."
