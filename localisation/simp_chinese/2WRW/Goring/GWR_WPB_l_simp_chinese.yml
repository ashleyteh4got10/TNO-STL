 goering.gaiseric.35.a: "Silence spanning a continent."
 WORLD_REICH.307.t: "[Get_newspaper_header]German Invasion of Italy"
 WORLD_REICH.307.desc: "Many analysts, including Italian ones, had predicted such an outcome. Having rid of two former allies of Italy in the face of Iberia and Turkey, and also having gained control of the rich resources of Russia and Africa, the Reich was fully prepared for the final battle for Europe. Italy remained the last state in Europe capable of standing up to the full might of the Wehrmacht, so it was ready for this predictable but devastating war.\n\nToday, the Reich has crossed the border into Italy. Huge concentrations of German infantry and armor attacked the border of the Italian sphere and the Unity-Pakt on all fronts: in the Alps, in the Balkans, and in Africa. Tens of thousands of Luftwaffe aircraft entered into battle with the Italian Air Force, and hundreds of ships clashed in the Mediterranean Sea.\n\nThe Japanese Empire and the United States of America categorically condemned Germany's invasion of Italy and began to produce supplies of military and humanitarian aid to Italy, hoping that this would help the latter stop the advance of the Reich.\n"
 WORLD_REICH.307.a: "We will be the masters of Europe!"
 WORLD_REICH.307.b: "Let them in."
 WORLD_REICH.307.c: "We wish them good luck in this horrific battle."
 WORLD_REICH.307.d: "Dear God..."
 goering_peace_events.19.t:0 "The Conquest of Italy"
 goering_peace_events.19.d:0 "Our invincible Wehrmacht has finally managed to return Rome to the bosom of Germany. The place where in 476 the great Ostrogothic leader Odoacer deposed the weak Western Roman Emperor Romulus Augustus. The place that became the true capital of the First Reich. Rome has always been part of our glorious Reich. However, to our great regret, it has long been under the control of a bunch of cowardly degenerates who have betrayed the Reich for millennia for their questionable ambitions. Although we have taken control of Italy and destroyed its insignificant leaders, the question of its post-war structure remains in force.\n\nAlthough Italy is teeming with idiots, there are those who are ready to accept our rule and become loyal allies of the Greater German Reich. Recently, the leader of the ultra-right NFP faction, Roberto Farinacci, contacted us. He offers his help in forming an Italian government loyal to us, to which we will transfer the main functions of managing the Italian territories. Thus, we will be able to ease the already stretched garrisons, however, we will have much less opportunity for looting the rich Italian territories.\n\nThe militarists, of course, will protest against this. They offer a fairly simple solution - to completely destroy Italian statehood, establishing a military occupation regime similar to Kleinasia. In their opinion, giving the Italians even a minimal bit of power will be fraught with consequences. We still remember well how the Italians \"helped\" us in the First World War, where instead of help we received a stab in the back and the occupation of originally German territories. After the Second World War, the Italians also did not distinguish themselves by loyalty - on far-fetched pretexts, they abandoned us, creating an unstable Triumvirate against us with Turkey and Iberia, directed against our empire. Schörner believes that after such treacherous actions against us, the Italians deserve only enslavement, and in a much worse form than it was for the French after the Second World War.\n\nNevertheless, military occupation will cost us much more. It is not only about maintaining a huge garrison, but also about the possibility of facing fierce Italian resistance.\n\nHowever, one way or another, the final word remains with the Führer."
 goering_peace_events.19.a:0 "Contact Farinacci, tell him that we agree to cooperate."
 goering_peace_events.19.b:0 "Italians have proven themselves unworthy of self determination."
 goering_peace_events.30.t:0 "The Conquest of North Africa"
 goering_peace_events.30.d:0 "Sand. It was coarse, rough, irritating, and in the lands of northern Africa, it was absolutely everywhere. From Algeria to Tunisia, Libya to Egypt, there was sand. If it was up to Generalmajor Friedrich August Feiherr von der Heydte, he'd deem the entire region worthless. He knew the area well, after all; He had fought here during the Second World War, which was probably the only reason the higher ups had decided to dump the entire place onto him, of all people. Prior experience did not mean that he had a high opinion of the place; quite the opposite, in fact. It was nothing but endless dunes, inhabited entirely by Frenchmen, Iberiens, Italians, and natives. Of them, the few which could be counted on as collaborators were far and few between, scattered about and disconnected by-of course-more sand. Why did Germans have to waste their time and money here as well, then?\n\nThe answer was not the sand itself, but what lay beneath the sand; Oil. Iron. Lead. Natural resources which could be used to further fuel the war effort. Used to seize territory far more valuable than one massive wasteland. As such, securing those resources was something that simply had to be done. And to do it, extracting operations, infrastructure, and protective garrisons all had to be built and maintained, organised and overseen by exactly one person; Himself.\n\nHe should have considered it to be an insult, in all honesty. He was in the Luftwaffe, damnit! Göring's own creation! He didn't want favouritism, but being told to govern over a gigantic box of American kitty litter felt like he was the victim of bias. The only thing-and he really did mean the ONLY thing-that gave him comfort about this situation were his memories. The battles he had fought, the camaraderie he had been a part of, the experiences which shaped him into the man he was today ...\n\nHe didn't have to like the idea, but maybe, just maybe, he really was the best man for this job in particular. He was used to the blistering heat during the day and the bitter cold at night, used to applying sunscreen as part of his daily routine. If he could survive the marches, the paradrops, and the gunfire from these cursed lands, surely he could handle running them from a cushy, air-conditioned office. In comparison to what his men would have to suffer from on the ground, the Militärbefehlshaber himself had no right to complain. For them, he would execute his duties to the best of his abilities. For them, he would give Reichskolonie Nordafrika his all."
 goering_peace_events.30.a:0 "The legacy of Rommel lived on in him."
