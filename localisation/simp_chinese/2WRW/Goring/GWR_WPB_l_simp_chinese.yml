 GGR_the_end_of_the_rus:0 "The End Of The Rus"
 GGR_fall_rot_desc:0 "The time has come to finish what the predecessor of our glorious leader begun. When Hitler defeated the corrupt and decadent imperialist and Bolshevik powers, he did not see fit to install a truly German administration to rule over the entirety of Russia: despite his incredible wisdom, this was a mistake, and cost us dearly during the subsequent war with the Western Russian Front.\n\nOur new leader, however, has vowed to put an end to this sorry state of affairs! Like an avalanche, we shall crush the last pitiful remnant of the Soviet Union, and integrate it into our ever-growing domain! The eternal snows of desolate Siberia shall be melted by the fire burning in our hearts! Heil Göring!"
 GGR_reinforce_the_garrison_desc:0 "For more than a decade, Reichskommissariat Moskowien has been the first line of defence against the Russian chaos. Now, however it will become the bridgehead from which we shall launch our unstoppable offensive!\n\nIn order to prepare for the inevitable beginning of the hostilities, we need to ensure that Moskowien is properly defended against any threat coming from the East. To this end, the German garrison will be bolstered by fresh troops, while we muster our army for the invasion."
 GGR_enlist_the_locals_desc:0 "In order to prepare for the offensive, we need as many men as possible, and the Russians of Moskowien are perfect to bolster our numbers. Though their valor and skill are far inferior to what we can expect from our fellow Aryans, they are loyal enough to prevent the risk of rebellion.\n\nAlso, their numbers are already a great advantage, and being Russian themselves they shall make perfect occupation garrisons for when we start to consolidate our control over the conquered steppes."
 GGR_mercenary_army_desc:0 "Due to the relative scarcity of true Germans, dozens of mercenary bands operate throughout the border regions of Moskowien, paid by both authorities and privates to protect villages and industries from both raiders and terrorists.\n\nIf we want to further increase our numbers, we can enlist these armed groups into the army with the promise of a nice payment at the end of the war. While these men are completely disloyal, they'll make fine meat for the meatgrinder, and we won't even have to pay them after..."
 GGR_proud_sons_of_germania_desc:0 "Grossraum Germania is the largest metropolis in the world! Even though such a notion brings pride to every true German around the world, it does have its downsides: after the first economic collapse, and even more with the upheaval that followed the Bürgerkrieg, the amount of poor and unemployed Aryans has reached staggering numbers.\n\nHowever, we can now solve two problems with one, intelligent solution. By conscripting the unemployed masses, we shall both grant people a honorable way to earn a salary, and increase our army for the coming war. Our homeland has so much untapped potential, and we shall exploit it all for the good of the Reich!"
 GGR_cornwalls_finest_desc:0 "The Cornwall Garrison is an elite unit made up of decorated veterans and extremely capable officers. By enlisting their aid for the coming war, we'll be able to not only make use of them in a suitably difficult environment where they'll be sure to shine, but also increase the morale of the entire army, as the common soldiers will be honored to fight alongside such a legendary formation."
 GGR_the_chicken_neck_desc:0 "Murmansk and Karelia are the closest regions belonging to our enemy. By starting a low-intensity conflict, we'll be able to test their willingness and readiness to fight. Should they prove weak, we may be able to win this war before it even starts!\n\nRussia is like a poor, defenceless chicken running in the farmyard, and we shall be the ones to wring its neck, ready to be served for dinner!"
 GGR_undoing_their_efforts_desc:0 "Despite twenty years of constant internal strife, it seems the Russians are still as adept at the art of war as they were under their Bolshevik predecessor. This only proves that the Slavs are nothing more than capable slaves, only good to be bled dry for the glory of the Aryan race.\n\nWith our victory in the border war, we can safely integrate the regions of Murmansk and Karelia into our ever-growing Reich, and use them as staging ground for the true invasion! The Russians must be already trembling at the prospect of facing our full might..."
 GGR_the_finnish_return_desc:0 "Despite Murmansk and Karelia being owned by the Russians, their population is Finnish in majority. As such, simply integrating it into Reichskommissariat Moskowien would only bring problem, as it would encourage the Finnish to revolt.\n\nWith this in mind, it's much more convenient to include the regions into a land inhabited by their brothers. Not only would the local population be much happier about it, but it would also cement our relationship with our comrades-in-arms."
 GGR_expanding_moskowien_desc:0 "Murmansk and Karelia may be inhabited mostly by Finnish, but the territory is clearly part of Russia, and integrating them into another territorial entity would only create logistical problems. Therefore, it's much more convenient to simply integrate it into Reichskommissariat Moskowien, and let the larger administration oversee its pacification."
 GGR_our_efforts_undone_desc:0 "Impossible! How could we lose such an easy battle! This can't be, there MUST be something, someone, behind our defeat against the Russian rabble! We need to do something about this, and quick, or we'll risk endangering the entire offensive!\n\nOn one hand, we can blame the entire débacle on the general who led the contingent: he won't be happy about it, and it will cause frictions between officers and troops, but we would save face. On the other, we can try to learn from our mistakes: we'll face a humiliating backlash at home, but we'll improve our situation and ensure we can win in the long run, or at least that's what we hope..."
 GGR_save_face_desc:0 "It's evident that this humiliating defeat is to be entirely blamed on the commanding officer! He displayed utter incompetence, and made several blunders, both tactical and strategic, that resulted in the defeat of our troops! For this reason, he shall be relieved from all command roles within the army until we find a suitable deployment for such a wretch!\n\nNot only that, but we'll make a propaganda enemy out of him! Not enough to start a conflict with the High Command and the militarists, but still enough to prevent him from ever reaching important positions within the army."
 GGR_learn_from_our_mistakes_desc:0 "While it would be so much easier to simply blame everything on the officer in command of the operation, we can't ignore the fact that the initial offensive was marred by several blunders in both logistical and tactical organization.\n\nSeveral of our units were under equipped, and they didn't receive their orders due to delays in the radio stations, which were overwhelmed by the sheer number of ongoing transmissions and failed to properly connect each call to the right unit.\n\nIf we want to win this war, we need to learn from our mistakes, and return there stronger than ever before!"
 GGR_remember_the_winter_war_desc:0 "With Finland in control of Murmansk and Karelia, and the Russian warlords still divided, this war is already over before even beginning! However, we can't be rash: in order to avoid unnecessary casualties, we need to approach our enemy carefully and have our backs covered.\n\nTo address this, we have two solutions: on one hand, we can reach an agreement with the Finnish, and have them grant us military access to their railways and port facilities, greatly helping our logistical situation. On the other, we can strengthen Reichskommissariat Moskowien and ensure that the Russians already under our authority don't stab us in the back at the first chance..."
 GGR_keep_your_friends_close_desc:0 "Our allies in the North are our best bet against the Russians. By sending them guns and other smaller concessions, we can make sure they won't ever protest if we use their land as a staging ground for the invasion.\n\nThis time, we'll be the ones striking from the frozen North, and the Russians will flee in terror! How's that, General Winter?"
 GGR_masters_of_the_arctic_desc:0 "Now that we have secured our access to the port of Murmansk, we can improve it to house a warfleet and the convoys needed for a naval invasion! While we don't necessarily have to follow this route - and indeed, the waters will most likely be frozen, preventing any actual landing from ever happening - it will be a threat nonetheless, and the foolish Russians will be forced to divert several units to protect hundreds of miles of useless, frozen nothing!\n\nWith their forces divided, we can take our time and choose the most effective way to crush these vermins!"
 GGR_and_your_enemies_closer_desc:0 "In the end, our best bet against the Russians is Reichskommissariat Moskowien. Not only is it the logistical crossroad for the entire operations - which means that a revolt would make Fall Rot collapse on itself immediately - but most of the Russian levies we have deployed come from there.\n\nIt is imperative, therefore, that we strengthen the Reichskommissariat, and ensure the local authorities have enough men and guns to keep everything under control. With our backs covered, we can launch our offensive without having to worry about our rear!"
 GGR_ensure_russian_loyalty_desc:0 "The Russians employed within our army are more numerous than they are loyal. With several fighting units, and a large part of the logistical machine being Russian, a native revolt in Moskowien due to racial conflicts, or dissatisfaction with the treatment they receive while under our command, would cripple the war effort with disastrous consequences.\n\nAs much as we loathe to even think about it, we might need to increase their pay and living conditions so that they have at least some reason to remain loyal to us. Of course, we can always let them understand what happens to those who betray the master race, with the help of a generous number of summary executions..."
 GGR_the_army_is_ready_desc:0 "After extensive preparations and a renewed recruitment drive, the Wehrmacht is ready to launch the offensive! Our panzerdivisionen are eager to trample the Russians under their threads once more, and both regular soldiers and mercenaries have been extensively trained and equipped for the coming war.\n\nThe time to blow the horns is almost here! As soon as our agents are done with their operation, and the Russian morale has been sufficiently lowered, we shall bear the eagle and the swastika to the Slavs, to rule as their masters for a thousand years and more!"
 GGR_renew_terror_bombings_desc:0 "As long as the Luftwaffe fulfilled its admirable duty in bombing the Russian desolation, the warlords were kept in submission. With the end of the bombings due to the Bürgerkrieg, the warlords began building up their strength once again, and eventually began unifying through means either peaceful or violent, giving birth to the monster we are now facing.\n\nIn order to counter the Bolshevik menace, and let these savages understand that the sky is OUR domain, and ours only, we shall resume the terror bombings over the entirety of Russia. By dynamite or by napalm, the Slavs will bend to their master, one way or the other."
 GGR_send_in_the_firebrands_desc:0 "Among the Russians living in Moskowien are many who support our ideology. Like Count Vlad of Transylvania, who sent Turkish prisoners infected with the plague back to their masters to spread disease and panic among the invaders, we shall plant agitators, firebrands and terrorists in the territories belonging to our enemies, ready to turn the unsuspecting populace to our cause, or sabotage their war effort.\n\nThose Russians are so foolish to think that all of their kin are on their side, or cruelly oppressed. While they might indeed be true on the latter, the former is still very much up for discussion, and our generous gift will surely be a VERY convincing argument..."
 GGR_coordinated_rebellion_desc:0 "Russia has been divided for more than two decades, and many of those warlords had - or still have - deeply conflicting political ideologies. This means that there's lots of fertile ground to seed dissent and foment rebellion: by coordinating the agents we have sent there and having them infiltrate already-existing opposition movements, it will be easy to set up well-timed uprisings and other disturbances.\n\nEfen in the case that they don't manage to completely topple the enemy government, they'll still provide a useful source of distraction, forcing them to divert troops to guard supply lines and sensitive targets from terrorist attacks or raids."
 GGR_fear_campaign_desc:0 "We can't limit ourselves to destroy their infrastructure and industry. If we want to prevail quickly and easily, we need to destroy their very hopes and dreams of resisting our advance!\n\nTo address this, our bombers will drop not only their explosive payload, but also leaflets written in Russian where the common folk will be able to know with exact precision the fate awaiting them should they resist.\n\nOf course, they will all share the same fate of servitude whether they fight or not, but they don't need to know it, do they?"
 GGR_total_demoralization_desc:0 "Our propaganda campaign is already showing its first results, but we can't rest on our laurels now! We need to increase our pressure on the Russian home front, and for this we shall send even more airplanes, with dozens of different payloads: be it with gunpowder or paper, we shall strike directly at the heart of the Bolshevik fools!"
 GGR_their_people_are_weak_desc:0 "Finally, our efforts have paid, and the Russian people is weaker than ever. The wretches live in terror of the next bombing run, just after they thought they would never have to endure such torture any longer: they run and hide like rats, and spend their restless nights in abject fear, for they know what awaits them at the end of the war.\n\nThe time has come to reap the fruits of our hard labor! As soon as the army is ready, we shall plunge deep into the Russian heartland, just as we did twenty years ago!"
 GGR_across_the_east_and_far_away_desc:0 "To the pitiful warlords of the Russian wastes! The hour of reckoning has come! The Reich of a Thousand Years shall take its place at the top of the world, as it was before, and as it forever shall be!\n\nSurrender and be spared, to live your lives in the servitude as all inferior races deserve, or fight and die to the last! There will be no quarter, no armistice, no mercy! The Wehrmacht shall be unleashed, and snow shall tinge red with blood!\n\nWir ziehen in den Krieg bis zum Sieg!"
 GGR_the_first_domino_desc:0 "Even though we won twice against the Russians in the last two decades, the harsh weather - especially winter - reaped many victims among our forces both times. With modern technologies and synthetic materials, we can easily provide proper winter clothing for all our forces at a fraction of the cost it would have taken during the last war.\n\nBy supplying our men with warm, comfortable war attire, we shall deny the Russian rabble their only advantage, and prove, once and for all, that not even General Winter can hope to defeat the Reich!"
 GGR_winter_clothing_drive_desc:0 "Fighting in the snow isn't just a matter of keeping yourself warm. Ice, snow and low temperatures provide a wide array of logistical, tactical and strategic challenges that, if not properly addressed, will result in a humiliating defeat.\n\nBy training our troops in winter warfare and the use of weapons in extreme conditions, and teaching our mechanics and pilots how to keep their vehicles in optimal state even when the fuel in their tanks freezes, we shall prevail as we did in the past!"
 GGR_ice_training_desc:0 "Our invasion of Russia is like a great game of domino. All the pieces have been painstakingly set into place, but for this reason it is imperative that the first piece falls in the proper way.\n\nWestern Russia is the first domino, and our invasion won't be able to proceed to the next stage until all of it has been secured. To this end, we need to occupy the entirety of the territories belonging to the Western warlords: our men need to understand the difficulty of the task, and feel pride for being the ones who will ensure the swastika rises from Moskau to the Pacific Ocean!"
 GGR_loot_the_factories_desc:0 "After what now is Reichskommissariat Moskowien, the \"free\" Western Russia is highly industrialized area. Such a wealth of industrial power can't be wasted, and should be properly exploited for our invasion!\n\nIn order to ensure our troops receive all the supplies they need, we shall seize as many factories as we can before the Bolshevik rabble can evacuate or sabotage them, and divert production towards the war effort. If this can't be done, we'll simply tear the entire building apart and bring everything to Germany!"
 GGR_expand_the_reichskommissariat_desc:0 "As the Russians West of the Urals share a mostly uniform culture, it would be most advantageous to integrate the newly-conquered territories into Reichskommissariat Moskowien, whose experienced officials are best suited for such a task.\n\nWith their tried methods to properly rule over the Russian rabble, they won't have problems overseeing the pacification and subsequent integration of Western Russia into the larger Reich, ensuring all meet their production quota, and partisans don't hinder the war effort."
 GGR_fight_the_insurgency_desc:0 "As expected, civilian partisans, deserters from the Russian armies and even bandits have started striking against occupation garrisons and unprotected supply lines. While the occupied territories are still under direct military control and waiting for integration into Reichskommissariat Moskowien, we need to act to crush the rebels before they can hinder the war effort.\n\nBy deploying special troops to the most troublesome regions, and showing the wretches that we aren't above retaliating against the civilian population, even their families and loved ones - no, ESPECIALLY their families and loved ones - we should be able to keep them under control until proper police forces come to patrol the roads and cities."
 GGR_find_some_friends_desc:0 "Of course, brute force won't suffice by itself in keeping these insolent inferiors in their place. Our agents have already started to look for potential... allies in this struggle, and they report satisfying results: as we advance, they will spin a thick web of ideological deserters, paid sycophants, traitorous politicians, informers and many, many others.\n\nWhen we leave for our next target, these native collaborators will ensure the resistance is kept under control, by both offering the common people an acceptable face to our iron-fisted rule, and selling their comrades in the opposition to the Orpo before they can put any of their plans into action!"
 GGR_searching_in_perm_desc:0 "Despite being Slavs, the Aryan Brotherhood was mainly comprised of ardent supporters of National Socialism. By looking among their ranks for potential recruits, we can set up a loyal - or at least, partially so - paramilitary force entirely made up of Russians at a fraction of the cost required to form a proper police force!\n\nAlso, should they fail in their duty towards the master race, or prove a disappointment in other ways, we can always send them into the slave camps and replace them with professionals... Waste not, want not!"
 GGR_reestablish_the_roa_desc:0 "The Russkaja Osvoboditel'naja Armija (ROA), or \"Russian Liberation Army\", was a commendable effort to sow division and strife among the Russians, by providing deserters and collaborators a banner to flock to. In the end, however, it proved useless, and Vlasov betrayed us to establish his own petty realm to rule as a warlord.\n\nSince the experiment was still promising, we shall re-establish the ROA, but under a new management. We'll only choose loyal officers from Moskowien, and they shall be properly kept under control by the Abwehr to ensure they don't start having strange thoughts as their predecessors did..."
 GGR_rush_to_the_urals_desc:0 "With Western Russia under total control, we now need to strike at the warlords in control of the Urals. It will be a tough battle, as the wretches not only had the time to prepare for war while we were crushing their brothers, but they also enjoy the protection of the Urals themselves: tall, impervious and heavily fortified, these mountains will prove a difficult challenge even for our best units.\n\nThe Oberkommando has devised two possible solutions to this problem. The first is to send in more fresh troops from the Vaterland to storm the mountain fortresses, a costly but effective solution. The second is to establish Russian penal battalions and force them to attack the fortifications or face execution: while much cheaper in both money and German lives wasted, this solution is also riskier as there is a higher chance of desertion or even revolt..."
 GGR_do_it_ourselves_desc:0 "The Russians have proved time and again their mettle, and for this reason we can't trust them any longer. We'll break the Urals with German strength and blood, no one can stand against us!\n\nBy initiating a new conscription campaign at home, we'll surely be able to fill any manpower need we might have."
 GGR_all_russian_penal_battalions_desc:0 "Spilling German blood amidst the Ural peaks is a total waste, especially when we can achieve the same result by spilling Russian blood. As the last wars taught us, there's always too much Russian blood left to spill: there must be, if they can repopulate so quickly after suffering such losses twice in two decades...\n\nIn order to take the mountain forts, we shall form Russian penal battalions by conscripting wretches taken from prisons and slave camps. They'll have a simple choice: almost certain death at the hands of their own kin up in the snowy Urals, or certain death at our hands if they refuse. If they survive, there's always another fort to take, or another minefield we can't spare deminers for...\n\nAfter all, we are just copying their own tactics: as Zhukov said, \"If there is a minefield, the infantry will advance as if there wasn't a minefield"
 GGR_redevelop_the_roads_desc:0 "Advancing towards Siberia is a difficult task for our logistical department. Russian infrastructure is already underdeveloped enough, but the situation has worsened after the bombing campaign and the fighting: now, most railroads are fully unusable, and the majority of the roads are covered in craters, almost all bridges cut to prevent us from advancing.\n\nIf we want to ensure our troops receive all the supplies they need for the coming campaign, then a concerted effort is needed to bring the infrastructure back to working order. We shall pave our own way to the final victory!"
 GGR_take_the_people_desc:0 "With the occupation of Western Russia now completed, we can start establishing a proper exploitation structure. All those who fought against us, and the ones who refused to submit even though they remained neutral, shall be enslaved to the master race and put into camps where they'll spend the rest of their lives toiling for the Reich and understanding the depth of their mistake.\n\nWith the new extraction and production facilities, our war machine will be unstoppable! The inferiors should find comfort in the fact that their sacrifice will serve to elevate the Reich to even higher reaches of power and might!"
 GGR_rebuild_the_aa_line_desc:0 "The Arkhangelsk-Astrakhan Line was the original target of Unternehmen Barbarossa. A line cutting Russia from North to South along the Volga river, it was to be extensively fortified and serve as a buffer against any attempt at either invading or bombing Germany from the East. However, due to the economy collapse in the Fifties, it was left almost undefended and subsequently lost to the Second Russian War. Even though we managed to repel the offensive, the border was redrawn nearer to Moskowien.\n\nWith our offensive triumphant, we can now reverse this shame! The A-A Line shall be rebuilt, a stalwart sentinel forever guarding Germania from her enemies! The first step is to rebuild the forts and trenches, a sufficient measure for now as the Russians don't possess the means to properly threaten complex fortification systems. In due time, we shall complete the work, and the line will stand for a thousand years!"
 GGR_eyes_to_the_steppes_desc:0 "The steppes of Central Asia are a potential source of problems. With their bandits and revanchist warlords, any Reichskommissariat we establish in Russia will suffer incursions and raids: the best solution is, of course, crushing these degenerates before they can pose any actual threat!\n\nBy relenting our offensive against Eastern Russia, and concentrating our efforts on the Central Asian warlords, we'll be able to resume our offensive without any hindrance coming from our exposed flank."
 GGR_man_vs_machine_desc:0 "Most of the steppe bandits rely on hit-and-run tactics, where cavalry forces, supported by few motorized units, strike at the enemy from the flanks or the rear, steal any useful loot, and then retreat before the foe can retaliate. This will prove to be a hindrance, and requires an adequate response.\n\nBy bolstering our mechanized corps, even our basic infantry will be far superior to anything they can throw at us! The nomads of the steppes have no mechanized forces, and even should they have any, they'll probably be a small percentage of their total army, which means they'll be mercilessly crushed by our technologically and numerically superior regiments!"
 GGR_dont_look_back_desc:0 "Central Asia is mostly worthless in the larger picture. Bereft of any meaningful industrial base or even resource wealth, it would be useless to waste men and reichsmarks to establish a proper garrison and administration.\n\nHowever, what we can do is to strip this useless land of anything worth reusing and relocating the machinery near Moskowien, where we'll be able to properly exploit it without the need for constant watch...\n\nWith our duty done here, we can leave Central Asia without looking back. When the rest of Russia is properly dealt with, we'll return and establish a proper Reichskommissariat, but for now this land is best left on its own.\n\nIf we're lucky, the wretches will even kill each other on their own without any outside help! This would considerably speed up our plans to integrate the region..."
 GGR_finish_them_off_desc:0 "With most of Russia under our control, we can now launch the final offensive against the Siberian warlords! We need to be careful about the extreme weather and the logistics, but once we have prepared, our enemy will crumble easily.\n\nAfter all, Siberia is a depopulated region without any meaningful industrial development. Their army will melt like snow in front of the Wehrmacht, and their hopes will be crushed like brittle glass by the hammer of the Reich!"
 GGR_sow_the_seeds_desc:0 "With most of Russia under our control, the few, pitiful remnant are cowering in fear of our war machine, like the cowards they are! It's time to launch the last propaganda initiative, where we'll try to convince as many as possible to desert and either join our cause, or simply stand idle as the last vestiges of Bolshevism are utterly crushed.\n\nEven if they don't revolt against their commanders, every deserter is one less Russian to fight! Not that there are still many left ready to fight..."
 GGR_national_socialism_stands_triumphant_desc:0 "Siberia was home to several movement sympathizing with National Socialism. By defeating the last remnants of the Soviet Union, we have undoubtedly proved the superiority of our ideology compared to the corrupt scions of Marx and Engels!\n\nIf we play our cards right, we can motivate several such movements to join our cause. While they'll never be proper Aryans, they'll make fine collaborators when we integrate these lands into the great Reich..."
 GGR_drive_them_into_the_sea_desc:0 "The time for the final push has come! Our Panzerdivisionen shall rout the pitiful leftovers of the Russian warlords towards the ocean, where they won't have anywhere else to retreat! Let's see how many will be ready to jump into the sea and commit the ultimate sacrifice for their ideology!\n\nI have the suspicion that very, very few will. After all, Bolsheviks are known for their cowardice..."
 GGR_threaten_the_japanese_desc:0 "With our recent expansion, we have come to border the Japanese in the east. Our former allies might protest, and ask for their former possession back - after all, when they ceded it to the Russians they didn't expect us to conquer it - but now it's too late to ask for its return!\n\nAll of Russia has been conquered by the German might, and no one will stand against it! Perhaps stationing a couple nuclear missiles near the border will keep the Japanese in check, so that they don't go ahead of themselves, won't it?"
 GGR_the_end_of_the_rus_desc:0 "Victory at last! With the complete conquest of Russia, the German Reich proves once more its might against those who once dared to stand defiant before the glory of the eagle and the swastika! The Russian people is no more, either assimilated, enslaved or driven into the wilderness to fight like the rats they are!\n\nA grand triumph shall be held in Germania! All the military leaders shall be present alongside the Führer for this momentous occasion, where the power of the Reich shall be exposed for all to see! Heil das Reich! Heil Germania! Heil Göring!"
 GGR_our_old_trusted_enemies: "Our Old Trusted Enemies"
 GGR_our_old_trusted_enemies_desc: "Little has changed since twenty or even forty years ago. Through the instrument of the West Russian Revolutionary Front, what little remains of the Russian state persists as a nexus for all the evils this world has to offer; Slavs, Communism, and Judaism. And yet, a faithful enemy is far better than a disloyal ally, and an age old rival is one that all will be eager to finally put to rest. Every soldier of the Werhmacht will march into this coming battle with full morale, determined to finish the fight of their fathers and grandfathers!"
 GGR_our_old_trusted_strategies: "Our Old Trusted Strategies"
 GGR_our_old_trusted_strategies_desc: "Plans for the invasion of the Russian rump state have existed for decades now, made in preparation for when the bombing raids finally stopped being a viable means of keeping the Slavs in check. Cracking them open now reveals that they are frighteningly similar to Operation Barbarossa. There is little need to fix what isn't broken; just like last time, they are stuck in the past, and we will force the future upon them through the medium of the Blitzkrieg. The only thing that has changed is that we won't stop at the AA line - only at the pacific!"
 GGR_our_old_trusted_generals: "Our Old Trusted Generals"
 GGR_our_old_trusted_generals_desc: "The WRRF may have caught us off guard once, but there is little doubt that they have failed to use their second chance to evolve in any meaningful way since the West Russian War. This predictability can be exploited by assigning our most experienced generals of the Eastern Front to take command during Fall Rot. Men who have decades of experience in fighting the reds on land and in the sky shall be paired with those who are ruthless in their ability to root out partisan activity, thus nullifying any threat the Russians may pose to us. With their knowledge at the helm, this military invasion will be more like a military reenactment."
 GGR_planning_speed_increase_15_percent:0 "§MOur planning speed will be increased by §!§G15%§!§M!§!\n"
 GGR_their_new_trusted_weapons: "Their New Trusted Weapons"
 GGR_their_new_trusted_weapons_desc: "The only thing that has changed since the West Russian War is the fact that the WRRF has discarded what little traces of morality they once possessed. Their stockpiles of chemical weapons are their greatest asset, and they doubtlessly intend to use it heavily against us as needed. Luckily, their sword of wrath is double-edged; there's hardly a lack of gas masks on our end, and a significant supply of our own WMDs as well. If they wish to sink down to chemical warfare, we'll gladly beat them with our experience."
 GGR_gas_effect_weaken: "§MEffects from Russian gas will be §Gdecreased§!!§!"
 GGR_dishonorable_aryans: "Dishonorable \"Aryans\""
 GGR_dishonorable_aryans_desc: "A rather confused statelet 'the Aryan Brotherhood', reigning over the Western Russia, is practically begging to fold into the Reich. So far, we have completely ignored this mania, but with the Wehrmacht turning its forces against the sad remnants of our second most hated foe, this absurd anomaly must one way or another be resolved.\n\nWe can easily shut down this nonsense, grinding these mentally-defective subhumans beneath our panzers as we eventually will all others, refusing to even acknowledge them as anything more than bizzare cultists.[GetABRulerBasedDesc]"
 GGR_dishonorable_aryans_vagner_alive: "\n\nAlternatively, we can actually bother to listen to them. Needless to say we'd keep these loons at arm's length, but having Russians kill Russians on our behalf - even with certain 'hiccoughs' - has worked wonders twice already.\n\nAs they say, third time's the charm."
 GGR_an_unthinkable_opportunity: "An Unthinkable Opportunity"
 GGR_an_unthinkable_opportunity_desc: "\"In the midst of chaos, there is also an opportunity\".\n\nWhile Russian warlords struggle and grapple in a desperate flurry to unite their diaspora, some present an interesting solution. This \"Aryan Brotherhood\" have desperately tried to contact us several times already and we find it likely that they will accept any offer we send them.\n\nAlthough they possess none of their claimed \"aryanness\" and have absolutely no real knowledge of German or its culture whatsoever, they could be a capable pawn in the upcoming war with Russians. After all, a loyal force behind lines led by easily fanatic lackeys could prove useful to logistics and particularly occupation. However, practically everyone else in the government highly resists trusting the Russians, especially those. We certainly do have more capable leaders but whether it is worth the lives of the Germans garrisoning the vastness of Russia, is up to the Führer."
 GGR_isolate_them: "Isolate Them"
 GGR_isolate_them_desc: "Now that we have earned the loyalty of these 'Deytsch' speakers, we can initiate the next phase of our plan; ensuring that they remain quarantined and detached, as to prevent morale loss from our soldiers. Like the uncanny valley, something that is so close to Aryan but simply isn't is inherently disturbing, and should thus be avoided as much as possible. We shall transport our armies through their lands, claim their resources, and perhaps assist them in securing their regime if the need arises, and nothing more. Anything else would ...upset the natural order of things."
 GGR_enough_jokes: "Enough Jokes"
 GGR_enough_jokes_desc: "Honestly, this whole endeavour was rather silly. These wretches are Russians, no matter how hard they enslave and exterminate their own putrid kin, no matter how many hakenkreuz they fly, no matter how horrifically they mangle our language.\n\nAnd they will die like Russians, naturally.\n\nStandard operating procedures will continue without interruption; the Wehrmacht will mow down this 'Brotherhood' as they would any other foe, on land and in the sky alike. Perhaps the White Sea would be open enough for limited naval manoeuvres, but it's unlikely. The rotten farce in Perm won't know this just yet, thinking we are coming to 'liberate' them from their inferiority, and for now it's best we keep it this way. In the meantime, Herr Gehlen has come forward with an interesting proposal to turn their mimicry of Führerprinzip and worship of our perfect nation against them. By inviting their pissant 'Fyurer' into our territory alongside a delegation of most of his inner circle, we have the opportunity to wipe them out without issue, something that only this uniquely psychotic caricature is outright stupid enough to do."
 GGR_you_are_not_aryans: "You Are §RNOT§! Aryans"
 GGR_you_are_not_aryans_desc: ""
 GGR_our_old_trusted_traitors: "Our Old Trusted Traitors"
 GGR_our_old_trusted_traitors_desc: "The Committee for the Liberation of the Peoples of Russia was created, fanciful name and all, in order to deceive the Russians into fighting other Russians. How they managed to survive, let alone beat out their competition after official ties were cut, remains a historical anomaly. Nonetheless, their ascension provides us with some unique opportunities that would otherwise be inaccessible if any other warlord was in power. It would be foolish to refrain from exploiting them, just as we always have."
 GGR_contact_the_loyalists_SAM: "Contact The Loyalists"
 GGR_contact_the_loyalists_SAM_desc: "Even after being betrayed, cut off, and routinely bombed into oblivion, there remains a small yet fanatic group of Russians within the KONR that remain faithful disciples of the Third Reich. They are about as good as a Slav can possibly get; zealously anti-communist, obedient to a fault, and most importantly, capable of recognizing their superiors. These men should not only be spared, but rewarded, for few others will be fit to govern the ashes that were once Russia by the time we are finished."
 GGR_resistance_target_decrease_10_percent:0 "§MResistance growth speed will be decreased by §!§G10%§!§M!§!\n"
 GGR_and_burn_the_rest: "And Burn The Rest"
 GGR_and_burn_the_rest_desc: "Unfortunately, Russians are still Russians, and even those who once fought for our cause are easily lured away, self-deluding themselves into believing that they are fit to be more than our servants. Though treason can hardly be considered a surprising act coming from a Slav, the vast majority of the Russian Liberation Army still broke a sworn oath even as others remained true, and must face due punishment as a result. As our beloved Führer once declared, mutinies are to be crushed in accordance with eternal and unchanging iron laws-though in this case, there will be far less crushing and far more ignition."
 GGR_darkness_and_hatred_from_the_east: "Darkness And Hatred From The East"
 GGR_darkness_and_hatred_from_the_east_desc: "You would be hard pressed to find a single Russian who has a positive opinion of the Third Reich, but even so, the level of contempt that the ruling Black League has for our beloved fatherland exceeds that of even the most fanatic Red Army partisans. 'Total War' does not accurately describe the way in which this coming conflict will be fought, for this will not be a war; it will be mutual extermination. We must prepare accordingly."
 GGR_a_considerable_enemy: "A Considerable Enemy"
 GGR_a_considerable_enemy_desc: "In their mad quest for revenge, the Omsk-led lunatics have maximized the ability of their state to wage war, for all else is secondary. Unlike the desperate conscripted masses we have faced in the past, the Black League's soldiers are well-equipped, well-trained, backed by modern weaponry and a population that is willing to self-destruct so long they catch a few more Germans in the blast. This will without question be our toughest fight yet. We cannot afford even trace amounts of the overconfidence we have fallen victim to in the past."
 GGR_the_great_trial_is_on_the_way: "The Great Trial Is On The Way"
 GGR_the_great_trial_is_on_the_way_desc: "The Black League is utterly obsessed with their concept of the so-called 'Great Trial,' the final war they shall wage against our glorious Reich. It is their own version of the Endsieg, their final vengeance and final victory against their most hated foe. They exist solely to pursue this goal, foregoing nation-building, ideological concerns, or even worldly needs in place of this proposed murder-suicide pact. Unfortunately for them, we refuse to simply stare at them idly as they prepare to slaughter our children. The Great Trial shall come, but it shall be on our own terms; if they seek death and glory, they will find only the former."
 GGR_the_mad_regent_of_russia: "The Mad Regent Of Russia"
 GGR_the_mad_regent_of_russia_desc: "There is a rather long list of character flaws and personality defects that we are willing to overlook in the name of finding loyal collaborators, but genuine insanity simply is not on it. Taboritsky might be the most pro-German Russian to ever walk the Earth, but he also trusts the voices in his head far more than anything we'd ever tell him. Any attempt at working with him would only result in partnership for as long as it takes for his next psychotic break, which, if the rumors are to be believed, won't take very long, given his Jewish heritage. As such, we must put down his mad regency in an act of mercy; he shall be dealt with like any other Aktion T4 patient."
 GGR_and_his_most_beloved_weapon: "And His Most Beloved Weapon"
 GGR_and_his_most_beloved_weapon_desc: "It seems that the Mad Regent has deep passion with chemical weapons. It is such deep, in fact, that he feels free to use it on his own people.\n\nThis will be noted.\n\nThough Russians on their own don't represenet serious threat, ignoring regent's passion with chemical weapons will be unsmart.\n\nEvery soldier will be instructed on how to deal with this nuisance, every solder will be given a gas mask and every soldier will be told with one simple thing:\n\"No mercy for subhumans\"."
 GGR_into_hell_itself: "Into Hell Itself"
 GGR_into_hell_itself_desc: "The horror stories are impossible to ignore. Never before in history has there been a mass exodus of Russians fleeing into Reichskommissariat Moskowien, preferring our ...admittedly harsh rule over their self-made Tartarus. The level of chaos our reports describe are akin only to the sort of deep, black abyss that comes about when men such as Josias or Himmler take the helm. The Russians have employed Scorched-Earth tactics against us in the past, but never before the war has even begun. We must strike hard and fast, for remaining in these cursed lands for any longer than necessary will doubtlessly take its toll on even our most loyal soldiers."
 GGR_resistance_target_decrease_50_percent:0 "§MResistance growth speed will be decreased by §!§G50%§!§M!§!\n"
 goering.rot.1.t:0 "Yet Another Nightmare"
 goering.rot.1.desc:0 "The Luftwaffe terror bombings ended years ago. Not since the Germans turned on one another have the Nazi birds plagued Russian skies. Yet Yegor could never escape the nightmares. And this nightmare had been particularly horrific.\n\nYegor had just returned home from tending to the pigs when he heard the dreadful growl of distant jet aircraft. You could often hear them coming before you could see those murderous metallic birds. Without a thought, Yegor ran outside to see the aircraft with his own eyes. He wasn't sure why, but he always did when these dreams came. Surely enough, just as every nightmare went, he saw the aircraft marked with the black swastika coming right for his village. His heart began to race, but just as it did, he realized he was just dreaming once again. This was all just a dream. He told himself this repeatedly as he ran back into his home and sat upon his bed.\n\nAttempting to wake himself from this recurring nightmare, Yegor pulled at his skin. This sometimes worked. Oddly enough, this dream felt nearly lifelike, and he could not convince his mind to wake. He realized that he would once again have to endure this nightmare until it's end.\n\nThe roar of the engines quickly grew louder as seconds went by, until the roar became nearly deafening. Until the auditory assault felt as if it were coming from right inside his modest home. Seconds later, the ground shook violently as the earth rumbled with apocalyptic force. This is where the nightmares usually ended. With a mighty explosion. Yegor frightfully awaited his startling jolt back into reality. Another explosion sounded off, and yet another that made his head ring like an impossibly loud bell. Finally it came, a mighty explosion that swept him away with impossible force.\n\nHowever only this time, it wasn't a dream."
 goering.rot.1.a:0 "Prepare the defences. We must pluck these birds out of the sky"
 goering.rot.1.b:0 "We shall bring the fight to Moskowien whilst time is still on our side!"
 goering.rot.2.t:0 "The Aerial Shield"
 goering.rot.2.desc:0 "When Mother Russia lay wounded and fragmented, her sons at one another's throats, there was little that could be done when the Luftwaffe began their very first terror bombings, all those dreadful years ago. The people of Russia were terrorized for years, and only the necessity to turn their aircraft upon one another would steer the Nazis away from our skies.\n\nYet as tensions rose between the resurgent strength of the motherland and the Germans who sought to impose a new set of imperial ambition, it was inevitable that they would return. They would attempt to break the Russian spirit once again, just as they attempted to do years ago. Their aircraft infested our skies with a renewed purpose. Yet this time, they were not left to roam long.\n\nThe German Eagles have been forced to tangle with another bird of prey. Through the theft of the Nazi designs as well as the endless ingenuity of our people, we have forged our own defensive air forces. Furthermore, we have been able to learn invaluable lessons from the German air attacks, as our surface to air defensive capabilities stand strong where our brave pilots cannot.\n\nWith each passing day, the Luftwaffe terror bombings become ever slightly less terrible. The people of Russia once again hold hope for a future of quiet skies."
 goering.rot.2.a:0 "Heroes in the sky!"
 goering.rot.3.t:0 "Our Stalwart Guardians"
 goering.rot.3.desc:0 "For every incursion the Germans made into our airspace, they were met with fierce resistance. Whether it be our brave soldiers manning anti aircraft defences upon the ground, or our heroic pilots challenging the Luftwaffe in our skies, the Nazis have found their air war to bear little fruit.\n\nWhat few flames that the Germans did manage to ignite in our lands are swiftly extinguished by the resilient people of Russia. It would appear that the Luftwaffe had acknowledged the limited effectiveness of their renewed terror bombing campaign against us, for the number of incursions into our airspace have been decreasing daily.\n\nIt is anticipated that within a matter of weeks, the Luftwaffe will all but have halted their foolish campaign of attempted terror in its entirety."
 goering.rot.3.a:0 "It was inevitable that we would send them running"
 goering.rot.4.t:0 "Undercover Firebrands"
 goering.rot.4.desc:0 "Over the past months, several plans have been concocted to send loyal National Socialist firebrands into western Russia, with the intent of causing disruption within Russian society and organizations.\n\nWhilst the pieces are already in place, the reality remains that we do not have the capacity to disrupt all areas of Ivan's society, thus a decision must be made between one of the three most effective plans.\n\nFirstly, we may utilize these firebrands to sew discontent and chaos within Russian cities through organized civil disobedience, acts of sabotage, and steering Russian citizens towards sympathy for our cause. Secondly, we may send them to infiltrate the Russian army. This should allow us to sabotage their operational capabilities and may allow us to stir disobedience amongst their unruly troops. Finally, we direct our men to become industrial saboteurs, where they will be ordered to conduct bombings upon Russian industry and disrupt vital infrastructure, in attempt to slow and sever the processes of Russian industrialization."
 goering.rot.4.a:0 "Direct them to the cities"
 goering.rot.4.b:0 "Get them inside the Russian army"
 goering.rot.4.c:0 "Burn their industries to the ground"
 goering.rot.6.t:0 "Black sheep in the flock"
 goering.rot.6.desc:0 "In the past decades, we've fought the Russians several times, and the past experiences have told us that fighting a war in such a distant land requires the help of some locals who are willing to cooperate with the Reich. Thus, we thought of f the Russian Liberation Army, or commonly known as ROA, who help us during the World War II and West Russian War. While the old ROA have betrayed us, a new unit was formed under that name, with the same duty to help us maintain stability in the occupied zone and suppress the local resistance. But now, we realized that it may be a mistake.\n\nReading the reports from the frontline, the Führer's face is dark with worries. It says that some agents found that many officers in the new ROA was just former members of the old one under Vlasov, who betrayed our trust and committed treason not too long ago. The Führer understands that those one cannot be totally trusted, for they've been working with that traitor for too long, and may have some not so welcome opinions about the Reich. And any risk in Russia could leads to a total failure there, which is the last thing he want right now.\n\nSo what should he do right now? Of course he can purge those officers, but is that enough? What if there are more suspect ones in the ROA than what we've found, and what if the entire ROA have been already poisoned by them? But on the other hand, if we just purge the ROA, where can we find other locals who can assist our war cause? So, maybe we can just pretend we didn't found any secrets about them and hope they can stay loyal to us.\n\n"
 goering.rot.6.a:0 "The ROA is a failed plan. Purge them all!"
 goering.rot.6.b:0 "Just purge those susceptible officers and leave others alone."
 goering.rot.6.c:0 "It doesn't matter"
 goering.rot.7.t:0 "Aftermath of the Purge"
 goering.rot.7.desc:0 "Today in Germania, the Führer didn't speak a single word in his office. The war in Russia have worn him out in recent days, and today a report about his decision to purge the officers in ROA really destroyed his mood. There's only one question in his mind: how the hell could this happen?\n\nThe report from Russia states that, after arresting and executing those officers who are former members of Vlasov's old ROA which betrayed the Reich, the entire ROA was in great shock. No one could be sure about why did we purge those who came to our side during the war, and neither could they be sure about their own fates. Fearing they could be our next targets, a bunch more officers fled from our barracks. And the worst part is, most of them just went to the Russian States and joined our enemies' side with all equipment and information they hold. In one word, we screwed everything up.\n\nBut the Führer understands that there is not enough time for him to regret. He must find a proper solution for current situation as soon as possible. Those who defected to the Russians are just some officers, and the left soldiers are still in our sides, waiting for our more orders. And more importantly, the war is still going on, and if we can win this war in the end, no one will remember some defecting officers, right?\n\n"
 goering.rot.7.a:0 "Goddamn Traitors!"
 goering.rot.8.t:0 "Build That Wall"
 goering.rot.8.desc:0 "Once again, the Führer found himself in the unenviable position of hearing out the demands of Ferdinand Schörner. A great map of Russia lay on the table, dug out from the archives all the way back from Operation Barbarossa for the purposes of illustrating some point. The map was of course hopelessly outdated, but Göring thought he could see the direction the conversation was being steered.\n\n\"-and the conclusion of the whole operation, uncompleted until now, the Arkhangelsk-Astrakhan Line, to complete the separation of Russia from Europe and ensure Germany has enough Lebensraum for centuries to come.\"\n\n\"And let me guess, you want to refortify the A-A Line.\" Göring maintained a neutral expression, lacing his fingers together.\" He tried to quantify the manpower and resources required to finish the project but gave up rapidly. Schörner was unfazed by his plan's predictability, and ploughed on.\n\n\"Indeed, my Führer, the plan is self-evident in its value. Had we completed the fortifications rather than resting on our laurels prematurely, the Soviets would never have been able to regroup and push us back, and Himmler's failed coup would have never even begun. Late as we are, completing the line is the only way to ensure the Russians never have a chance to retake Moskau.\"\n\nThe Führer thought that Schörner's concern had little to do with the ideology or national security, and much more to do with the influence he would gain with the troops on the eastern frontier. The line may have some strategic value, but it would likely be outweighed by the colossal cost of building a wall across a whole continent. Not to mention the cost of refusal - he could see the spiteful look in Schörner's eye even on the best of days, and had no desire to annoy him further."
 goering.rot.8.a:0 "Fine, take your money."
 goering.rot.8.b:0 "No extra funding will be authorized."
 goering.rot.9.t:0 "Second Rate"
 goering.rot.9.desc:0 "\"Have you seen these numbers, my Führer?\" Stuckart waved a folder like it was the only thing that mattered in the world.\n\n\"Of course I've seen them, Wilhelm. Have you spoken to Schörner?\"\n\n\"You know I do my best to avoid that man at all costs.\"\n\n\"Then you know that this is a necessary sacrifice, to prevent that ugly bastard from getting any uglier.\" Göring shared a pointed glance with the Reichsminister.\n\n\"That I understand, but there are steps that can be taken to mitigate the damage he does. If he seriously thinks this wall is a good investment, he's even stupider than I thought.\" Stuckart's folder flopped to his side, limply.\n\n\"He is nothing of the sort, and you would be a fool to let him hear you say that.\" Göring's glance turned into a glare. Stuckart held up his hands in resignation.\n\n\"All I am saying is, we could stand to save a great deal on materials. Do we really need to waste high quality concrete and steel on a wall the Russians will never reach? We could stand to dilute what Schörner's boys get, they'll never be in a position to notice the difference.\"\n\nPerhaps Stuckart did have a point - while Schörner himself would almost certainly make note of the change in the supply situation, and he'd have to have that conversation with the bastard, the chances of the Russians pulling together enough to pose a true threat to the A-A Line, pure concrete or aggregated, were miniscule. Every penny counted considering the amount he was already spending on the oversized Wehrmacht."
 goering.rot.9.a:0 "Make the changes."
 goering.rot.9.b:0 "Only the best for our boys."
 goering.rot.10.t:0 "Where There's A Whip There's A Way"
 goering.rot.10.desc:0 "Vadim's shoulders burned as he swung his mattock. The icy Russian soil refused to give in easily - the constant movement of cart wheels and caterpillar tracks had churned up thick, wet mud, that over repeated cycles of freezing and thawing had created half a dozen layers of frozen ground that was closer to rock than dirt. A little extra strength would be appreciated, preferably that of a jackhammer or one of those excavators he'd seen on the back of the German trucks, but those were too valuable to be risked in the unskilled hands of a conscript such as himself.\n\nVadim allowed himself a brief moment to catch his breath and wipe the sweat from his brow, which had gathered there despite the cloud his breath produced in the cold. As he breathed, he surveyed the horizon. From his section of the would-be trench, half sunk into the earth, he could see but a small segment of the fortifications extent. He had never seen anything like it. He'd heard tales of distant China, where a great wall separated the civilised world from the barbarians to the north. This was the only comparison he could even consider relevant. For as far as the eye could see, and from what he'd heard a thousand times further and yet more, Russians like him laboured digging trenches, cutting down forests, draining swamps, hanging barbed wire, installing bunkers, fortifying choke points - building a wall the likes of which the world had never seen.\n\n\"What's the holdup, Russkie?\" His reverie was interrupted by a bark in German - outside the trench, the soldier supervising his group was looking down at him and idly playing with the action of his rifle.\n\n\"Just catching my breath, sir,\" he replied in rudimentary German. Vadim swallowed as the soldier walked to the lip of the trench. Seeing his discomfort, the German chuckled and spat into the trench, narrowly missing Vadim.\n\n\"Back to work. No unsanctioned breaks.\" Vadim nodded, relieved he had avoided a beating."
 goering.rot.10.a:0 "Vadim's shoulders burned as he swung his mattock."
 goering.rot.11.t:0 "Work From Home"
 goering.rot.11.desc:0 "Vadim had not left the trench for weeks. He and the other conscripts had been thrown a tarpaulin and were expected to make do - the dribble of rain pushing its way through the gaps in the sheeting draped over the squalid hole had turned the freshly excavated dirt straight back into mud, and most of his comrades had taken to sleeping upright to avoid drowning in mud, propped up by their tools. Well, it was mostly mud - the digging of latrines had been deemed a secondary priority compared to the main fortifications, and there were few Russians willing to leave the trench at night, when a trigger-happy German might take a simple toilet break for an escape attempt. If Vadim poked his head out from under their tarpaulin, he could see the corpse pile. He could smell it no matter where he was.\n\nThe Germans kept separate from the Russians in their tents, but Vadim had been able to overhear a few words while on duty - most of the soldiers assumed the Russians were incapable of understanding their language, despite the fact around half the conscripts were Muscovite, and many of the others had picked up smatterings of the trade language that had built up around what used to be the border between Moskowien and Russia. Despite the brutal punishments that were being dealt with increasing regularity to the \"lazy\" workers, work was apparently proceeding according to schedule. Once the work was done, Russia would be split in two, with a border not nearly so porous as that that preceded it. What would become of him then? Shipped out to another conflict, to dig holes and live in his own shit, or just disposed of, another face in the corpse pile? There must be some way out, some path between the sentries that would take him away. They wouldn't bother searching for him once he was out, he was all but worthless - that much was clear. But which way? Back west into Moskowien, and hope to remain unnoticed by the authorities? Or east into Russia, where who knows what awaited him? He'd heard the Soviet Union was restored in the far east, but then he'd also heard of bandits masquerading as Germans who would slaughter anyone they deemed too Russian.\n\nThe crack of a distant gunshot reached the trench, and a few of the others shifted in their sleep. Vadim's grip tightened around his mattock, and he dreamed of freedom."
 goering.rot.11.a:0 "Today you, tomorrow me."
 goering.rot.12.t:0 "Call for Celebration"
 goering.rot.12.desc:0 "The Germans were drunk as hell, high on the accomplishments of others. For the first time in what felt like weeks, Vadim had been allowed a break, for there was no more work to do. He and his Russian comrades, for all their hard work, had been awarded respite, a chance to lean on their shovels and gaze at the miles of trenches they had dug by hand. Vadim could have done with one of the beers the soldiers were passing round, but for now he was just grateful to have good, clean water. The radio was blaring out some patriotic German song, immediately following a speech by Führer Göring congratulating the troops and labourers - the German labourers, of course - on the completion of what he referred to as \"Eighth Wonder of the World\", the Arkhangelsk-Astrakhan Line.\n\nThe division of Germany and Russia was now a sharp line on the map rather than the blur it had once been, in what many other young Russians considered a small golden age of enterprise compared to the Union and Reich that sandwiched them. The only enterprise getting done these days certainly wasn't sending the profits his way. He sipped his water, for the moment content. His shoulders no longer ached. He surveyed the wilderness expanse to the east, nothing but fields as far as the eye could see - no cover. Nothing but easy shooting should some young asshole look up from his drinking and back to his duties. But still, there was no time left, they'd be moving out soon. The best thing he could see was a gully, a few hundred metres away leading southeast. If he could reach there in a couple of hours, when drinking and darkness had dulled their senses, he might be able to crawl out of sight.\n\nThe rumble of a truck interrupted his thoughts, and he turned. The truck was backing up to the trench, where his comrades were enjoying their rest. Soldiers, their rifles shouldered and looking much more sober than their drunken friends were accompanying it.\n\n\"Russkies, in the truck! Next project.\" Vadim gazed into the back of the truck like it was a gaping pit. He was out of time."
 goering.rot.12.a:0 "I wonder what I'll be when they open the door."
 goering.rot.13.t:0 "A Thermodynamic Miracle"
 goering.rot.13.desc:0 "\"My Führer, news has come in from the Eastern Front.\" Axmann was holding some report at arms length, as though it was a small bomb. Göring cast aside the array of paperwork littering his desk - he had the sense this would be more interesting. He gestured for Axmann to speak.\n\n\"It's the Russians. Our men on the front lines report that they've stopped fighting each other in the wake of our invasion. Communists, liberals, even those freaks who think they're German. Until victory or defeat, all beats are off. Prisoners say they're fighting for the cause of,\" Axmann glanced at the report, \"the All-Russian Congress.\"\n\nGöring blinked. He looked at Axmann, who seemed to be serious. He laughed, a deep belly laugh. Axmann blinked in confusion. The Führer was slapping the table like he'd just heard the best joke of his life. When he finally stopped laughing, reduced to a mere occasional, involuntary chuckle, he wiped his eyes of tears and sat straight.\n\n\"All this time, we've been saying 'Ridiculous! Russia could never work together, never follow the same cause, Slavic barbarians this, Asiatic hordes that, and the thing that does it, that proves us wrong, is us!'\" Göring continued to chuckle, and Axmann relaxed - this evidently would be a less difficult meeting than he'd expected.\n\n\"Very amusing indeed. What are your orders, my Führer?\"\n\nGöring looked perplexed. \"Fight them, of course. I don't see how this changes anything, we were going to have to get at them all eventually. Tell the generals to do as they see fit.\"\n\nAxmann extended his arm in salute, and exited. Göring let out one final chuckle, and took a sip of brandy."
 goering.rot.13.a:0 "All Russia against all the Reich makes for a better story."
 goering.rot.14.t: "The Bear Trap"
 goering.rot.14.d: "The German is an arrogant beast. For years, he has clung to past glories, growing fat off of the riches he has stolen from the Russian people. He has become stagnant from the lie of invincibility it has convinced itself of for so long, even after his weakness was shown to the world in the West Russian War. Such moral failings, while disgusting, were ultimately a great advantage for the Black League; While the Germans were neglectful, the Russians became diligent. As the Reich waned, the League waxed, growing and expanding to consume all who would oppose them, adding their strength to their own. The Russian state was once again becoming a united nation, growing more powerful than ever while the enemy remained divided, impotently bickering amongst themselves, ignorant to the swift justice that would soon be enacted upon them.\n\nThat is, until recently. Only now have they begun to awaken from their drunken stupor. Only now have they begun to properly prepare. The thought was admittedly bittersweet to the Glavkoverkh; the fact that the Teutons had finally recognized them as a threat proved that they had finally begun to fear them, as they always should have. And yet, such fear came with caution, caution which would make them a stronger opponent during the Great Trial. Furthermore, it would be by their will, not Yazov's, that the Great Trial will begin; They were taking preventive measures to delay their inevitable end. They were clearly determined to invade, to destroy the Black League before they could reach their full potential. To strike before the Russian spirit had truly been renewed, before their armies had become invincible enough to march to Germania and beyond.\n\nGood.\n\nLet them come, Yazov thought. All the better. The Nazis would attack, and they would die. Here, in the snowy wastes of their homeland, they would freeze. Here, stretched far beyond their supply lines, they would starve. The German was indeed an arrogant beast, and all beasts needed were traps and the right bait; They would march into Siberia with dreams of conquest and heads held high, only to be surrounded, ambushed, crushed, stalled. Behind every line of fortifications, another, even stronger defense would be prepared. Behind every tree, a squad of partisans would await to bring death upon the invaders. The avalanche would crush each and every one of them until they were broken and beaten, forced to retreat with their tails tucked between their legs.\n\nAnd the League would follow them, all the way home. A preemptive invasion was not to Germany's benefit, It was to his own. They will waste their blood, their equipment, their treasure, on this pointless offensive. Sapped of strength and will, they will be powerless to prevent the counterattack. When the League reached Germania, they would slaughter every German woman and child they could find."
 goering.rot.14.a: "But they would not find men, for they would all be dead already."
 goering.rot.15.t: "Memories Do Not Come in Color"
 goering.rot.15.d: "Reinhard Gehlen's meetings with the Führer were becoming more and more frequent as time went on and the need for proper intelligence only grew. Though the man himself was more comfortable as a soldier than a spy, he was still just as insightful as any other clandestine agent. In fact, some would argue that his powers of observation, of perception, were far greater than his powers of infiltration and exploitation. Whether that was the case or not, his skills did grant him the intuition to arrive at a single conclusion; namely, that this office did not belong to Göring. Or at least, not solely to Göring.\n\n\"The WRRF has made a resurgence.\" Gehlen outlined, highlighting specific pages in the four separate copies of the intelligence briefing he had compiled, one for himself, and three for the hydra that stood before him. Göring, Schörner, and Spiedel, all so clearly filled with hate for each other, did little more than shoot each other some glances as Gehler continued. \"Though they have notably shifted their overall strategy to one of consolidation. From our understanding, they seek to challenge us only after reuniting what remains of Russia. They believe victory cannot be achieved while infighting exists.\"\n\n\"Hardly a concern. They couldn't get the job done when they controlled everything from Lviv to the Pacific ocean.\" Though the Führer was getting rather sick of Ferdinand's snide dismissal of genuine problems, he could not help but agree with him, just this once. He was there when the invincible Wehrmacht marched into Moscow, when they starved Leningrad out and reduced Stalingrad to rubble. When the first Führer, his mentor, his friend, was still capable and relentless. When the weight of war existed solely as a burden of sending thousands of Aryan sons to die, instead of being coupled with the additional fear of nuclear annihilation. It was a time of triumph and glory, and the sight of the hammer and sickle being raised over Russia yet again did little more than fill him with a sense of nostalgia. Who were they to deny Ivan's desire to see history repeat itself?\n\n\"They didn't need half as much territory as they control now to push us to the brink in the West Russian War.\" Speidel countered, ever the voice of reason, or at least, as reasonable as things could get in Göring's regime. \"And unlike last time, we will have no collaborators to bail us out. They are a significant threat and we need to treat them as such.\" He was right, of course, but neither Schörner nor the Führer wanted to admit it. The former did so out of a deluded ideal of invincibility, but for Göring, he simply didn't want to remember how the bad times had long outweighed the good by now. The WRRF was what finally broke Hitler down. Their suicidal act of defiance reignited the hope of those who should have long since learned their place. It was because of them that the shadow state continued to stain the map. Everything started to go downhill when they dared to defy Germania.\n\nKilling them now would do little to turn back the clock, but it would make him feel a bit better.\n\nGehlen, detecting that his presence was no longer required, did not so much as ask for permission to leave the room. He simply stood, offered a silent heil, and made his exit, content to let the Hydra react to the information he had presented it however it pleased."
 goering.rot.15.a: "Threat or not, the WRRF is not permitted to live for even a second longer."
 goering.rot.16.t: "The Perfect Aryan is..."
 goering.rot.16.d: "Reinhard Gehlen remembered back when the Führer used to smile.\n\nNot personally, mind you. He was never so connected as to be able to call the man his friend, or even acquaintance. His only exposure to him was all pre-approved propaganda or elaborate performances designed to control public perception. But even knowing this, he had still always thought of him as 'Uncle Göring,' Hitler's jovial right-hand-man and the heart and soul of the Reich. It was a far cry from the man whose desk he now sat across from. The 'real' Göring who wasn't pretending anymore; a man filled with ambition but chained to reality, competent but vengeful, professional but always bitter. Getting to know this 'real Göring' now that he was working directly under him was slightly disappointing, if expected. No one was who they made themselves out to be, and most importantly, no one could ever possibly be that happy, always.\n\nAnd yet, Gehlen was forced to conclude that perhaps the Führer had merely allowed the stress of his promotion to get the better of him recently. Because when he was informed of this 'Aryan Brotherhood' which had taken over large swathes of western Russia, he broke out into a grin worthy of any photoshoot, one that was perfectly natural and genuine.\n\n\"We're going to burn them to the ground.\" Ferdinand Schörner declared, standing-as he often was, even when seats were readily available-to the right of Göring, arms crossed and with a perpetual scowl. He, evidently, made no effort to pretend to be something he wasn't. \"And then salt the Earth when we're done. No one must know that this mistake was allowed to exist.\" In contrast to the smirk of Göring and the frown of Schörner, Speidel remained entirely stone-faced throughout the briefing, neutral and silent the entire time. Perhaps he was simply mentally preparing for the inevitable argument that was bound to happen as soon as Bloody Ferdinand stated his opinion.\n\nGehlen fidgeted in his seat slightly in anticipation of said argument, knowing that it was hardly his position to be making policy decisions, especially in regards to the war plans. That being said, his position did include ensuring that those who did make policy were working with the most recent and accurate information possible. \"If I may...they have actually attempted to make contact with us in the past.\" The head of the Abwehr spoke, bringing attention to page 24 of his compiled report on the subject. \"These communications were dismissed at the time, but have later been verified to be legitimate. These Russians are...very eager to work with us.\" The spymaster cleared his throat as he finished, knowing his role in this was more or less over. \"You mean serve us.\" Speidel corrected, turning his gaze to both his rival and the man who was his de jure superior. \"We can't just slaughter them all. A willing, entrenched class of well-armed collaborators is everything we could ask for, militarily. Culturally as well. Perhaps other nations could learn a thing or two from them.\"\n\nWith that, the reformer and the hardliner began their back and forth once again, but Göring was hardly paying attention. The final decision was ultimately his-the only decisions he was allowed to make these days were tiebreakers between the two, after all-but more than that, he had more or less zoned out entirely as soon as he heard that this so-called Brotherhood was even real. The fact these slavs, these sub-humans, were so desperately trying to become something they weren't, was greatly amusing to him. For all their efforts to become Germans, their fate rested entirely in his hands...and that was, in all likelihood, the greatest similarity they had with the actual Aryans."
 goering.rot.16.a: "...Slim like Göring, blond like Speidel, and handsome like Schörner."
 goering.rot.17.t: "Black Roaring Death"
 goering.rot.17.d: "The Reich had always struggled when it was on the defensive. Ever since the days of Bismarck, the Prussian spirit had granted lightning speed and surging strength to their offensive operations, a combination of tactical brilliance and sound doctrine allowing the Heer to quickly and efficiently destroy any foe. But like a glass cannon, the German armed forces were vulnerable to counterattacks; it was why they lost in the first Weltkrieg, with their numerous enemies bogging them down and neutralizing their greatest strength. It was why the West Russian War was nearly a disaster, averted only through luck. Now, shades of a similar catastrophe were coming out of the wastes that were once the Soviet Union once again, and no one was interested in risking a repeat.\n\nNo one except the Monster, of course. \"Their population is bombed out, starved out, freezing, and barely literate. Do they seriously think they can put up a fight?\" Schörner, as usual, dismissed the very notion that Germania could be in danger, especially now that he had whipped it back in to shape with his own two hands, now that he had cut out the filth that was weakening it for so long. His words were an echo of the past, a repeat of the overconfidence that allowed the communists to push the Wehrmacht to the brink barely a couple decades ago. They were, of course, legitimate criticisms of the Russian ability to conduct a war from a strictly professional perspective. The only problem was that the only people who didn't seem to realize that were the Russians themselves.\n\n\"It doesn't matter how poor their position is.\" Speidel countered, amazed that he actually had to spell it out for the man. \"The reality of the situation is that the Black League is mobilizing, no matter how hopeless their struggle is.\" The intel gathered by the Abwehr and the aerial photography was undeniable evidence of that. Defensive fortifications were rapidly being constructed, but on top of that, entire legions worth of troops were being pushed near the border, ready to march, to bring thunder and death at a moment's notice. Both hoping for the best and preparing for the worst.\n\nGöring knew why, of course. He knew, but he could never understand. He was a National Socialist and a proud one, as any Führer should have been, but even he had his ideological limits, a hard cap on how much hatred he could muster for the enemy. It was why he regretted attaching himself to Bloody Ferdinand to this day, and why he still worried about the Dark Lord of Burgundy even now. Their fanaticism and thirst for blood was truly something to behold, to fear. And now, he was going to face an enemy who shared that exact same level of hatred. The same amount of zealous devotion to a cause that could convince desperate, starving peasants to throw themselves at the machine guns time and time again. The Black League could present any image it wanted to the world, but any state who would risk it all to fight a superpower without even having a fully functioning electrical grid was a formidable one indeed. It carried with it the same spirit that brought the Reich to victory in the second world war; The triumph of the will over the coldness of reality.\n\n\"I'm telling you they need to be dealt with before they're fully prepared.\" Speidel insisted, already mentally drawing up a rudimentary battle plan for a renewed Blitzkrieg. \"And I'm telling you that we're in no state to launch an offensive, not yet. Let them rattle their sabers. All they'll accomplish is impaling themselves on our spears.\" Göring had to look up from his desk, in utter disbelief of what he was hearing. For once, Speidel was the one who insisted on an attack before they were fully prepared? For once, it was Ferdinand who urged patience and restraint? The Black League may have lacked an actual nation, but it was clear that their military might was powerful enough to generate its own gravity, one strong enough to turn his own world upside down. The Führer never could have guessed that his two puppet masters would ever trade lines in the sand, even if they were both correct, in their own ways; The Black League was far greater of a threat than Schörner believed them to be, but at the same time, Speidel was vastly overestimating their ability to wage war among the Siberian wastes. They'd need another half year of planning to get a working operation running at least...but then again, how strong would Yazov and his fanatics become by then? Could they, as the titan, waste time licking their wounds, after the WRRF had already proven they could bleed? As usual, he was the one forced to break the tie. And as usual, he would rather have been in any other position."
 goering.rot.17.a: "Speidel is right, for the wrong reasons."
 goering.rot.17.b: "Schörner is right, for the wrong reasons."
 goering.rot.18.t: "Liberation of Hell"
 goering.rot.18.d: "Fritz stood atop his tank as the Battalion continued its road march east, deeper into the Holy Russian Empire. The deeper they went, the more it felt they were entering a nightmare. The land itself was mired like nothing they've seen in Moscowien, the very plants were wilted and dying, the stench of death permeated the air and could even be smelt through the filters of gasmask and the tanks NBC scrubbers. Everywhere he looked, he saw it was not just the plants dying, but the Slavs themselves, as occasionally they'd pass a particular tree, still dying mind you, but covered in half rotted hanging bodies and gibbets filled with their unfortunate victims. It was like something out of a nightmare, and as the Battalion approached a town as sung hung drearily amid an now ever present haze, he could see movement to and fro the buildings.\n\n\"Keep your guard up, I got something ahead, did the scouts not clear this shithole?\"\n\n\"Negative, stand down, scouts confirm ahead is clear, just civilians.\"\n\n\"Civilians?\" Fritz scoffed, given everything that's happened you'd think no one was left alive to even be considered a civilian, but as they approached he saw all to well the supposed survivors of the Holy Russian Empire. As the convoy slowed, maneuvering between destroyed cars and craters, he got a good look at true horror. Emancipated people, wearing rags stood in alleys, staring at them, their eyes looking at them blankly. Out of the corner of his eye in a building, behind rotten planks boarding the windows of a crumbling home he saw several pairs of eyes dart to and from, one second there, one second gone, like ghost. Fritz began to sweat and shiver in the sun as slights like this became all to common. Most shocking of all was as they passed what he thought was a school, a man walking out toward the convoy, only a few steps before falling to his knees and making a cross with his hands as him and several others behind began to weep before turning into a furious chorus wailing in agony, their hoarse vocal chords straining under the lack of sustenance and producing a sound more akin to wheezing than screaming or crying.\n\nAs the Battalion exited the town he dared not look back at the horror he had just witnessed, as already he began to scrub his mind of their visage, like an automated defense mechanism of his mind, to protect itself, from going mad."
 goering.rot.18.a: "The horror... The horror..."
 goering.rot.19.t: "Burdened Air & Churning Ash"
 goering.rot.19.d: "Of the four men who were currently present within Göring's office, only Hans Speidel had a Ph.D in history, or indeed, had studied history at all. Even then, his knowledge of specifically Russian history was limited, even before it was removed from most every curriculum in the Third Reich. As such, he was only just about capable of pointing out the parallels between the current state of the former Soviet Union and the continuous trends of time; just as there was a regency crisis in the past-the 'Time of Troubles,' as it were-so too now was there a second Smuta, or at least there had been until very recently. Just as Peter III and Catherine the Great, two Germans, had ruled over these lands in the past, so too did a German sympathizer rule them now.\n\nAnd just as a deep, paranoid madness grasped the heart of Ivan the Terrible, so too did it grasp the heart of Sergei Taboritsky.\n\n\"The man is dangerous.\" Reinhard Gehlen declared, speaking in a soft manner even for a spy, as if fearful of what would happen if his words were heard by others. \"He's not a liberal or a communist. He's not even a dictator or a fascist. He's a fanatic. A zealous lunatic. Unstable and unpredictable. How he even came to power in the first place is beyond our understanding.\" The Führer so desperately wished to be able to enjoy Ferdinand Schörner's silence right now. It was a rare, pleasant thing, but one that was utterly impossible to savor. He wasn't sure if the Monster had finally been confronted with something capable of stunning him into silence, but he knew for certain that he himself definitely had.\n\n'Autogenocide.' It was the only word that could describe what was happening in Russia right now. There was plenty of normal genocide as well, mind you; turks and other natives were being shot, stabbed, burned and gassed. But so were their own people. A part of him wanted to try to rationalize it, to try to convince himself that he had faced this same abyss before. What could Taboritsky possibly be, if not the Russian Himmler? And yet, even this half-hearted attempt could not begin to comprehend what was truly happening. The difference between Himmler and Taboritsky was as large and wide as the difference between a gas chamber and a gas bombardment. The Shadow State may have been a nightmare factory, but at least it never resorted to chemical attacks on its own land. Why would they? Why would they waste the slave labor? Why would they poison their own territory, permanently creating black spots of lifeless despair, unable to be exploited or tilled? No amount of dead dissidents could justify such a harsh overreaction, not in the eyes of sane men.\n\nTabortisky, obviously, was not a sane man.\n\n\"For what it's worth,\" Gehlen continued, clearing his throat and noting the silence, only going on because all others had refused to speak. \"His devotion towards the Reich is unquestionable. He would welcome our soldiers by the time they marched into his country.\" The Triumvirate took a moment to look at one another, wordlessly analyzing expressions and body language, unspoken words being shot back and forth in search of disagreements.\n\nThere were none. For the first, and quite possibly last time, all three men were in unanimous harmony.\n\n\"They will march.\" Hermann Göring declared, turning his focus back to Gehlen. \"March into his capital. And then further, until they reach the Pacific. And they will erase every trace of this monstrosity ever existing as they do so. This 'Holy Russian Empire' will die.\""
 goering.rot.19.a: "And ideally, be buried in an unmarked grave."
 goering.rot.20.t: "Subordination In The Plans"
 goering.rot.20.d.krebs: "Slides with photographs alternated with each other as Göring desperately tried to understand what these untermensch had sunk to, who, having seized power in the Russian anarchy, were now kneeling before them.\n\nhe ashes of villages, lines of slaves and improvised concentration camps – all this was painfully reminiscent of a stupid farce, the pathetic attempts of some subhumans to stand out among others in front of real Aryans.\n\nThe thought flashed through Göring's head: \"Did we really decide to interact with them?\" He was pulled out of his thoughts, oddly enough, by the deathly silence that hung in the room after the next words of the secretary standing next to the projector.\n\nCatching the attention of those present, but not having time to ask again on his own, Göring heard a question addressed to him for the second time: \"My Führer, you have already ordered to establish contacts with this group of sectarians, which, as I repeat, agrees to cooperate. However, you have not specified the list of diplomats to be sent there. Perhaps you should go to their capital yourself, thus showing them our favor?\"\n\nGöring was taken aback. For him, flying into these unknown wilds, into the clutches of degenerates, was like death under any pretext, and he searched the audience for some kind of support or confidence, but noticed only complete indifference and even a clear fear.\n\nFinally, he pointed his finger at Axmann: \"Herr Axmann!..\" Axmann twitched slightly. \"You are the Reich Minister of Foreign Affairs, and visiting foreign countries is your direct responsibility. Don't worry, Reichskommissar Krebs will be with you. He knows the Russians better than you do.\"\n\nAxmann, realizing the horror of the situation, sits, almost shaking, wanting to dig in. Silently cursing everyone and getting involved with them. But his answer was only a short:"
 goering.rot.20.d.oberlander: "Slides with photographs alternated with each other as Göring desperately tried to understand what these untermensch had sunk to, who, having seized power in the Russian anarchy, were now kneeling before them.\n\nhe ashes of villages, lines of slaves and improvised concentration camps – all this was painfully reminiscent of a stupid farce, the pathetic attempts of some subhumans to stand out among others in front of real Aryans.\n\nThe thought flashed through Göring's head: \"Did we really decide to interact with them?\" He was pulled out of his thoughts, oddly enough, by the deathly silence that hung in the room after the next words of the secretary standing next to the projector.\n\nCatching the attention of those present, but not having time to ask again on his own, Göring heard a question addressed to him for the second time: \"My Führer, you have already ordered to establish contacts with this group of sectarians, which, as I repeat, agrees to cooperate. However, you have not specified the list of diplomats to be sent there. Perhaps you should go to their capital yourself, thus showing them our favor?\"\n\nGöring was taken aback. For him, flying into these unknown wilds, into the clutches of degenerates, was like death under any pretext, and he searched the audience for some kind of support or confidence, but noticed only complete indifference and even a clear fear.\n\nFinally, he pointed his finger at Axmann: \"Herr Axmann!..\" Axmann twitched slightly. \"You are the Reich Minister of Foreign Affairs, and visiting foreign countries is your direct responsibility. Don't worry, General Krebs will be with you. He knows the Russians better than you do.\"\n\nAxmann, realizing the horror of the situation, sits, almost shaking, wanting to dig in. Silently cursing everyone and getting involved with them. But his answer was only a short:"
 goering.rot.20.a: "\"Yes, my Führer\"."
 goering.rot.21.t: "Important Clarification"
 goering.rot.21.d: "... \"So... preparations for the execution of plan \"Rot\" is in full swing, my Führer.\" Field Marshal Schörner reported.\n\n\"Great! Was this the only thing you wanted to report to me, Field Marshal?\" Göring asked suggestingly.\n\n\"No... Did you order to \"negotiate\" with those Untermenschen fanatics?\" Schörner asked, yet hiding his discontent.\n\n\"Yes, I did.\"\n\n\"You're not going to take them seriously, aren't you, my Führer?\"\n\nGöring thought for a moment. And then, he smirked.\n\n\"...No. No-no-no-no-no-no, of course not,\" Führer responded, almost laughing. \"After the war is over, we will just keep those kids playing in their Russian playground, not letting them out of it. We'll have them occupy Russia for us while we get all the benefits from it.\"\n\nThese words seemed to calm the Field Marshal, but only a little.\n\n\"But they are just fanatics that mock our culture, my Führer!\" Schnorer continued to argue.\n\n\"They work as perfect collaborators. They do mock our culture, but that is unless we can teach them! Just imagine, Russians, learning the German language willingly!\" Göring tried to convince Schörner, though, seemingly in vain.\n\nGöring exhaled. \"Look. We'll keep those lunatics at arm's length. If they stop serving us or bringing us any usefulness, we'll just get rid of them.\"\n\nSchörner acceptingly exhaled."
 goering.rot.21.a: "\"Yes... Of course, my Führer.\""
 goering.rot.22.t: "Wilkomen aus Permhaim"
 goering.rot.22.d: "Hans Krebs, Arthur Axmann, along with Gutrum Vagner, rode through the streets of Permheim, examining and inspecting them. On their way they met dilapidated buildings hung with flags of the Reich and the Aryan Brotherhood, lines of slaves going somewhere under the supervision of their \"Aryan\" masters and inscriptions in broken German, which they proudly called \"Deytsch\".\n\nKrebs found it all painfully familiar, but at the same time extremely twisted. It reminded him of his trip to Moskau, when he had just been appointed to the post of Reichskommissar of Moskowien. However, this version seemed to him more bizarre and inferior.\n\nVagner tried to interest his \"guests\" by telling them about the glorious city of Permheim, about the \"deeds\" of its people and about the power of the \"Aryan\" race. Axmann confusedly nodded and agreed, while Krebs looked thoughtfully at the streets. When he imagined the \"Russian Aryans\", that was not what he imagined at all. When he first heard about the Aryan Brotherhood and the upcoming trip, he hoped that, perhaps, against the background of the Reich's harsh racial policies regarding the Slavs, the Aryan Brotherhood would become a kind of refuge for him, where his dream of peaceful coexistence of Russians and Germans would come true. However, after briefings and a personal trip, he realized the futility of these hopes and how perverted Vagner's concepts of Aryan races were.\n\nThe thought popped into his head: \"They don't want to be Aryans, they want to be Germans.\"\n\nThe car stopped and knocked Krebs out of his thoughts. Finally, they arrived at the main government building for status negotiations between the Great German Reich and the Aryan Brotherhood. Axmann was glad because of the fact that he would no longer have to listen to barely connected nonsense, and hurried out of the car, while Krebs only exhaled in disappointment, and, following Axmann, began to get out of the car.\n\nLooking at the government building festooned with swastika flags, Krebs thought:"
 goering.rot.22.a: "\"This is definitely not the Russia I know.\""
 goering.rot.23.t: "Fixed On Paper"
 goering.rot.23.d: "A spacious, modestly furnished room in a building, apparently a couple of decades ago, which was the office of the county administration, became the place of conclusion of the last agreements between the Reich and the new \"Russian\" state In the center of the room, hung with swastikas and bizarre eagles, Krebs and Axman, a couple of their aides-de-camp, and finally Vagner himself sat down at the table in turn, both sides facing each other, and finally Vagner himself with a pair of civilly and neatly dressed civilians, who were rare by local standards.\n\nThe surrounding setting was painfully reminiscent of Hitler's office, either parodying or imitating it in their interiors. General Krebs opened a briefcase full of papers, laying out in front of all present a small map on which Göring's signature was emblazoned, and several forms already prepared, he said: \"Herr Führer of the Russian people, at the end of our wonderful meeting, today, I and the Reich foreign minister, Herr Axmann, were authorized to conclude the following with your country arrangements...\"\n\nHe handed the papers along with the map into the hands of Vagner, who was looking at them with greed and interest. Among the many formal agreements, one, the most important point stood out: \"The territories from the current borders of the Reichskommissariat of Moskowien to the Arkhangelsk-Astrakhan line will be transferred to the possession of the aforementioned Reichskommissariat. In return, Russian Reich enters into Einheitspakt on the rights of a companion and ward, gets international recognition and gets all Russian lands beyond AA line.\"\n\nVagner's face, at first frowning a little, expressed the mask of reverence already familiar to Krebs, while the Russian Führer himself said: \"It is a great honor for us. Please, just a second.\"\n\nTaking a fountain pen, he put a huge signature on both documents and, for some reason, the map, handing everything after first to one assistant, then to the second. This was followed by the signature of Krebs, Axman, a handshake, the click of the camera, and a hasty farewell ceremony before departure."
 goering.rot.23.a: "The job is done."
 goering.rot.25.t: "On A Silver Platter"
 goering.rot.25.a: "Be afraid of the Danaians, the gifts bringers."
 goering.rot.26.t: "Battle at Sector 9, Defense Grid 274-35B"
 goering.rot.26.d: "The situation of partisan activity across the front was reaching critical levels, convoys and trains were being harassed day and night, as Garrisons behind the front were under increasing attack and pressure. Despite these setbacks, the AA line remained a decisive factor, keeping the worst of the partisan activity on the other side of its Concrete defenses. However, as the Partisans increased their attacks, they were able to infiltrate the slaves who worked the AA lines, and after establishing communications, a plan was made. One particularly dreary day, the slaves would rise up and attack one of the munition depots within the AA lines, stealing nearly all its explosives. By the time anyone realized what was going on, the plan was set in motion.\n\nThe first thing many would notice was the rising of the earth, and a deep rumble from the ground. Then a large section of the line erupted in a blast, creating a massive crater where once a large concrete bunker stood. Dust and dirt filled the sky as concrete, broken parts of weapons, machines and even men fell across the blasted land. As Heer forces across the line stumbled in the chaos, confused and unsure what had happened, they were blind to the true dangers. Slaves had begun to go on a frenzy, rising up with their tools and striking down small isolated pockets of soldiers, only to be halted either by still manned choke points, or disciplined counter attacks. But just as the situation was looking to stabilize, Russian chants and fast approaching vehicles could be heard as through the smoke, trucks tried to blitz through the now open gap, only to be stuck in the now soft, overturned ground, and the unexpectedly deep crater. Unable to breakthrough as intended, the troops sought to fight for the breach and hold it until engineering assets could be brought up to clear a lane.\n\nMomentum favored the Russians as they washed over the initial defenders like a wave, only slowing down to stab each and every defender with their bayonet. Weapons teams from outside would pour fire on the few remaining bunker that still had a line of sight on the breach, as more troops pushed deeper into the AA line. The situation seemed hopeless for the German defenders, until a young officer rallied his company, and fought their way across the lines, regrouping with scattered remnants, attempting to form some semblance of cohesion amid the chaos. The once certain breakthrough began to get bogged down in drawn out fights within concrete hallways, as seconds turned to minutes and those minutes turned to hours.\n\nEventually, reinforcements from a nearby Garrison would arrive, securing the other side of crater, funneling fire into the breach and halting all Russian reinforcements into the AA line. Emboldened by the arrival of help, the soldiers of the AA line surged forth with new fervor, overrunning any Russians who refused to withdraw. By nightfall, the breach had been retaken, but the action itself had already started an uproar back in Germania, where questioned were called up as to how this could have even happened."
 goering.rot.26.a: "My Führer... the casualty reports, if you'd like?"
 goering.rot.27.t: "Sprechen Deutsch!"
 goering.rot.27.d: "The letters formed into words, and those, in turn, into whole sentences, in places completely unclear to Gutrum himself, who compared what was printed with what he had written himself. Already a quarter of an hour later, an absolutely frightening and at the same time breakthrough thought reached him, for a moment he was speechless, his breath caught in the realization of the importance of what was happening, when he finally realized that all these many years the German language that he and his faithful people used turned out to be incorrect.\n\nHis hand reached for a pen and a stack of papers on the table, but soon, after the initial sketches, he took up the typewriter, which stood alone right on the windowsill, but it did not spend long on his desk, being pushed aside.\n\nGutrum Vagner was taken aback, realizing how much work had to be done in the process of changing the state language, but overcoming the newly arisen stupor, he left his office, waving the spread of the dictionary like a new holy scripture, when he came to the end of the corridor and declared to all those present: \"Gentlemen! We are to learn real German!\""
 goering.rot.27.a: "The invention of the bicycle is also an achievement."
 WORLD_REICH.306.t: "[Get_newspaper_header]German Invasion of Russia"
 WORLD_REICH.306.desc: "Today, at exactly four a.m., the renovated war machine of the Großgermanisches Reich crossed the Rubicon in the face of the Russian border for the third time. The German boot once again stepped on Russian soil, trampling more and more the hope of Russians for a peaceful and free life into the mud.\n\nFührer of the Großgermanisches Reich Hermann Göring stated: \"Just as it was in '41, we will only kick down the door, and the whole rotten structure will collapse!\"\n\nForeign powers have promised to aid Russia, though many doubt if it will arrive in time, if at all. The Russian states expressed gratitude and in a unified statement declared: \"Russians never surrender!\"\n\nIn response to the aggression of the Reich, Japan has massively reinforced the Sphere's northern frontier bordering with Russian territories.\n\nTruly, this war is a war for the fate of Russia.\n"
 WORLD_REICH.306.a: "Wir ziehen in den Krieg bis zum Sieg!"
 WORLD_REICH.306.b: "Russians never surrender!"
 WORLD_REICH.306.c: "How difficult it is to be a Russian in this century..."
 WORLD_REICH.315.desc: "It is said that hatred of the invader is a sacred feeling, but it is born of such torment of the soul that God forbid anyone experience it twice. Today, the Russian National Reclamation Government intends to demonstrate why upon the invading Greater Germanic Reich.\n\nUnconfirmed reports indicate that both sides have immediately resorted to unthinkable cruelty, nightmares of chemical, biological, and even radiological hatred unleashed without second thought. Glavkoverkh Dimitry Yazov has publicly sworn to 'avenge' Russia and exterminate the 'Teutonic parasite', no matter the cost.\n\nThe United States and Japan have made no official comments thus far, but many worldwide fear this may just be mankind's last war."
 WORLD_REICH.315.a: "Our battle will be legendary!"
 WORLD_REICH.315.b: "Parasites! EXTERMINATE THEM!"
 WORLD_REICH.315.c: "Dear God."
 WORLD_REICH.316.desc: "History never repeats, but it often rhymes. Today it rhymes in Russia, where the Greater Germanic Reich has crossed into the lands of the West Russian Revolutionary Front in an invasion millions strong.\n\nFührer Göring has already declared his intent to shatter Communism forever, but spokespersons of the Front remain confident they can stop the Teutonic tide, claiming that they need only hold until the Reich's economy burns out and collapses from the strain.\n\nThe United States and Japan have both expressed vested interest in the failure of 'Fall Rot', though what aid they supply - if any - remains unknown."
 WORLD_REICH.316.a: "Third time's the charm."
 WORLD_REICH.316.b: "Moscow is ahead of us!"
 WORLD_REICH.316.c: "May the cold consume them."
 WORLD_REICH.317.desc: "Despite appeals by the KONR, the Greater Germanic Reich has seen fit to crush its old lapdogs who dared to slip their leashes, as millions of solders cross into the Provisional Commissariat.\n\nFührer Göring justified the invasion in a speech yesterday, stating the Germanic race has no patience for traitors, and a long memory. Reportedly the former collaborators struggle to convince their population that they intend to resist, their role in collapsing the Front decades prior still felt today.\n\nAs the United States and Japan debate intervention, now is perhaps the KONR's only chance to prove what they preach."
 WORLD_REICH.317.a: "Time to put these dogs down."
 WORLD_REICH.317.b: "We stop them here or die trying!"
 WORLD_REICH.317.c: "...I've got to get out of here."
 WORLD_REICH.317.d: "Like feeding a crocodile..."
 WORLD_REICH.318.desc: "Today, the German war machine continued its expansion. This time — eastward, into the state known as [KOM.GetName].\n\nAs the war progresses, more and more facts from the front, now watched by the entire world, are coming to light. Reports indicate the massive use of chemical weapons by both sides.\n\nAdditionally, more facts are emerging about the Empire itself and its regent, Sergei Taboritsky. An increasing number of sources report mass chemical bombardments and terror of its own population, against which reports of no resistance in German-occupied territories do not seem senseless.\n\nThe United States and Japan have refused to send any aid, believing that there is no better side in this war.\n"
 WORLD_REICH.318.a: "We shall bring an end to their misery."
 WORLD_REICH.318.b: "Alexey must be in Germania!"
 WORLD_REICH.318.c: "The more of them die - the better."
 WORLD_REICH.319.desc: "To the surprise of nobody save perhaps the Aryan Brotherhood itself, The Greater Germanic Reich has crossed their unofficial border and invaded the warlord state earlier today.nGerman representatives have universally decried the 'complete bastardisation of National Socialist thought' by the statelet and promised 'a swift end to the madness'. The Brotherhood's government could not be reached for comment, but owing to their fanatical beliefs resistance will likely be fierce.\n\nThe United States and Japan have been reluctant at best to aid such a regime, but are likely to investigate alternative statelets to bolster in the region."
 WORLD_REICH.319.a: "Slavs playing dress-up, nothing more."
 WORLD_REICH.319.b: "A test of our Aryan will, surely!"
 WORLD_REICH.319.c: "It's almost like Nazism is self-destructive."
 WORLD_REICH.320.desc: "With the removal of perhaps Germany's only possible ally in the region, the Greater Germanic Reich has instead crossed the porous border into the lands now ruled by High Priest Velimir.\n\nThe High Priest has publicly announced that Perun will see the 'true Aryans' to victory, going on to denounce the Reich as puppets of the 'world Jewry' - a claim openly mocked by German representatives, who described it as 'sick-headedness' that should never have left the hospital.\n\nThe United States and Japan have expressed shock at these claims, and no aid appears to be forthcoming. Unless another contender appeals to them, Russia stands alone."
 WORLD_REICH.320.a: "They think WE'RE the Jews!?"
 WORLD_REICH.320.b: "We will break the Jewish puppets!"
 WORLD_REICH.320.c: "We might need to just sit this one out.."
 WORLD_REICH.321.desc: "With the collapse of the Holy Russian Empire back into warlordism and misery, it was only a matter of time before the Reich turned on the nation's bleached, poisoned carcass.\n\nThere is no war here, as panzers and helicopters sweep across the tortured forests and steppes, any more than there is war between a cabal of hunters and a mutilated baby seal. Reports indicate that much like such a seal some settlements openly welcome the Germans, knowing full well their intentions and finding it preferable to the utter psychosis of the Regency.\n\nNo aid is expected to be forthcoming, and the Co-Prosperity Sphere in particular braces for a tidal wave of refugees fleeing the Reich's war in the East."
 WORLD_REICH.321.a: "This... isn't right."
 WORLD_REICH.321.b: "..."
 WORLD_REICH.321.c: "Dark is the night.."
 WORLD_REICH.309.t: "[Get_newspaper_header]The Reich Triumphant"
 WORLD_REICH.309.desc: "Horror, shock, revulsion and more wrack Russians worldwide, as perhaps the worst possible fate for the Rodina has come to pass. Expected to fail at every turn, Gutrum Vagner's 'Russiky Reikh' has not only consolidated control over what was left of the nation, but has done so under the shadow of the German Adler.\n\nNow this twisted parody has chained itself irrevocably to the real thing, and with Germania's support and apparent blessing, the Fyurer has already begun extending his mad quest for racial supremacy into even the coldest reaches of Siberia - a goal now alarmingly within reach."
 WORLD_REICH.309.a: "May they all wipe themselves out."
 WORLD_REICH.309.b: "God save Russia, for who else can?"
 WORLD_REICH.310.t: "[Get_newspaper_header]Russia Reclaimed - Germany Falls Into Chaos"
 WORLD_REICH.310.desc: "In what international observers are already referring to as an outright miracle, the All-Russian Congress has declared total victory in their war against the Third Reich, having reclaimed all Russian territory in Europe from their enemy.\n\nThe German invasion of the alliance of Russian warlord states-referred to as \"Fall Rot\" by the Führer-initially made deep progress which mirrored Operation Barbarossa, before ultimately stalling out due to economic depression followed by complete economic collapse in the Fatherland. German soldiers were soon ordered to hold position, and eventually retreat back to the homeland itself in an attempt to stabilize the crumbling German state, allowing Russian soldiers and partisans to rapidly reverse their previous defeats until reaching the internationally recognized border. Despite many calls for a campaign of national vengeance, the Congress' leader, [ARC_leader.GetLeader], has refused to order his troops to enter German territory itself, citing fears of overextension and a potential nuclear response from what remains of the German government.\n"
 WORLD_REICH.310.a: "We WILL be back."
 WORLD_REICH.310.b: "The entire world has changed forever, yet again."
 goering_peace_events.13.t:0 "The Conquest of Russia"
 goering_peace_events.13.desc:0 "There were traditions to be upheld with every new conquest of the Reich, both officially and unofficially. Every war won required appropriate amounts of victory marches, medals being distributed, and promotions rewarded to those who made it happen. Likewise, every war won also required appropriate amounts of alcohol consumed, games played, and women bedded. But it wasn't until this specific victory that the Führer ever felt like joining in the festivities himself, out of true, genuine desire to celebrate, rather than a need to maintain appearances.\n\nHe had accomplished the impossible, after all. That which Napoleon could not. That which the Kaiser could not. That which even Hitler could not. That last thought specifically was equally exhilarating as it was, in its own way, frightening. Adolf's vision for Russia had always been limited; destroying it as a bastion for communism, removing its ability to ever directly threaten the Fatherland again, acquiring living space ... Those things, he had managed to accomplish, despite the troubles of the West Russian War. Now, Göring had far exceeded such limits. Did that mean that he himself had exceeded his old friend as a ruler? Had the second Führer proven himself superior to the first? The glory that came from such a feat was very much desired, but the responsibility that came with it was becoming terrifying. He was writing both history and the story of his legend with every order given, and yet, he could only see a few ways in which such a story ended.\n\nBut to the average German, the concerns of their beloved leader were irrelevant in the face of their greatest achievement yet; The land of the Rus was now fully in the hands of the Reich, brought low by the courage of their soldiers and the might of their machines. They had braved the harshest winters, hostile mountains and forests, and an enemy prepared to die for every last inch of what was once the largest nation on Earth, and had triumphed. It was a miracle even from a logistical viewpoint, much less a military one. A long last, the Slav had been fully put down by the Aryan, once and for all."
 goering_peace_events.13.a:0 "So the celebrations went on, with or without Göring."
 goering_peace_events.31.t:0 "The Conquest of Central Asia"
 goering_peace_events.31.d:0 "Reichskomissariat Turkestan, as it turned out, was not a new concept. It was difficult to dig up records on such an obscure subject after the civil war had intentionally or unintentionally destroyed much of the Nazi's history, but it was there; Clear proposals from Alfred Rosenberg to unite all central Asian nations into one single state, a massive suzerainty to the Third Reich. The inability to advance beyond the A-A line laid rest to any such schemes, even for a man as ambitious as Hitler, but for those who had exceeded the first Führer, a means of occupying these ethnically and linguistically diverse lands had to be devised. In that case, why fix what wasn't broken?\n\nThere were some alterations to be made in order to better reflect modern realities, but the essence of what Rosenberg had thought of all those years ago remained more or less intact; Anyone who could be counted on as a collaborator would immediately be contacted and more or less drafted into security positions for the new state, serving as auxiliary units, translators, and peacekeepers alongside the German garrisons. Propaganda would focus almost entirely on religious unity between the vastly different peoples of the several different 'Stans', hoping to use faith to inspire loyalty among differing nationalities. Other than some minor notes about cooperation with existing and future fellow puppet states, there really wasn't that much that needed to be changed.\n\nThe only thing that was important enough to receive Göring's direct attention was the fact that there would be no 'Reichskommissariat.' Such a title was bestowed only to the sections of Europe that were not yet German, but would be privileged with becoming so eventually; Central Asia would not be a recipient of said honour, meaning that administration of the region would have to be more of a permanent military occupation than anything else. Thus, Reichskommissariat Turkestan became Militärverwaltung Turkestan, and as a result, a suitable Militärbefehlshaber would have to be found. The only question left was who that would be.\n\n\"Brigadegeneral Eckart Afheldt.\" Göring eventually decided, penning the signature that made the man the most powerful man in the region since Genghis Khan without so much as a second thought. In truth, the Führer knew next to nothing about Afheldt, only that he was alive and of high enough rank to justify such a position. The fact that he still drew breath meant that he had chosen the winning side in the civil war and had survived Schörner's purges on top of that, meaning that he would have no objections from anyone over his appointment, which was all the qualifications he needed. With such bigger fish to fry on the horizon, one less headache was always welcome."
 goering_peace_events.31.a:0 "A conqueror more terrible than Tamerlane has come."
 GGR_fall_rot_decisions:0 "Fall Rot"
 GGR_fall_rot_decisions_desc:0 "The final invasion of Russia, Fall Rot has started. Across the Reich young boys have been sent to the east to fight against the always present Russian menace. But this invasion is unlike any other, Russia is big and its people are many and scattered. Combine this with the abosulete plethora of weapons and these conditions form the ideal situation for partisan warfare and yet the majority of Russian people grew tired of the war and stay in their homes. But should we be too intrusive into their daily lives they will start fighting our regime, it is ideal if this could be prevented.\n\n§PPartisan activity§! [ROOT.GetGGR_russian_population_anger]§!"
 GGR_invade_western_russia:0 "Attack [FROM.GetName]"
 GGR_invade_western_siberia:0 "Attack [FROM.GetName]"
 GGR_invade_kazachstan:0 "Attack [FROM.GetName]"
 GGR_invade_southern_urals:0 "Attack [FROM.GetName]"
 GGR_calm_the_russians:0 "Calm the Russians"
 GGR_crack_down_on_the_russians:0 "Crack Down on Partisans"
 GGR_finish_the_partisans: "Finish The Partisans"
 GGR_fall_rot_partisan_update: "Rising Partisan Activity"
 GGR_expand_russian_garrisons: "Expand Garrisons In Russia"
 GGR_send_orpo_in_russia: "Send OrPo In Russia"
 GGR_recruit_more_collaborators: "Recruit Collaborators"
 GGR_OMS_kill_germany: "Initiate §VThe Great Trial§!"
 GGR_strengthening_the_garrison:0 "Strengthening The Garrison"
 GGR_strengthening_the_garrison_desc:0 "Ever since the West Russian War has the garrison in Moskowien remained pitiful and weak. Recently however the politicians in Germania have ordered for man and material to immediately move to the Reichskommissariat. This has come as a big surprise to the RK's officials who have been scrambling to find the reason why, a change of administration? another Russian revolt? But deep down they already know. Fall Rot, the final invasion of Russia, is about to commence."
 GGR_strengthening_the_garrison2:0 "Strengthening The Garrison"
 GGR_strengthening_the_garrison2_desc:0 "Ever since the West Russian War has the garrison in Moskowien remained pitiful and weak. Recently however the politicians in Germania have ordered for man and material to immediately move to the Reichskommissariat. This has come as a big surprise to the RK's officials who have been scrambling to find the reason why, a change of administration? another Russian revolt? But deep down they already know. Fall Rot, the final invasion of Russia, is about to commence."
 GGR_no_mercy_for_traitors_idea: "No Mercy For Traitors"
 GGR_renewed_terror_bombing:0 "Renewed Terror Bombings"
 GGR_renewed_terror_bombing2:0 "Renewed Terror Bombings"
 GGR_renewed_terror_bombing3:0 "Renewed Terror Bombings"
 GGR_renewed_terror_bombing_desc:0 "The Luftwaffe has returned once again to Russian air dropping their bombs mercelessly on any sign of civilization. To the surprise off the Führer the Russians have started fighting back and harder than the last time. Anti Air Flak cannons are firing from the ground, modern planes are shooting fighters down and new factories are being built far away from each other. Fall Rot will be a war like no other."
 GGR_renewed_terror_bombing2_desc:0 "The Luftwaffe has returned once again to Russian air dropping their bombs mercelessly on any sign of civilization. To the surprise off the Führer the Russians have started fighting back and harder than the last time. Anti Air Flak cannons are firing from the ground, modern planes are shooting fighters down and new factories are being built far away from each other. Fall Rot will be a war like no other."
 GGR_renewed_terror_bombing3_desc:0 "The Luftwaffe has returned once again to Russian air dropping their bombs mercelessly on any sign of civilization. To the surprise off the Führer the Russians have started fighting back and harder than the last time. Anti Air Flak cannons are firing from the ground, modern planes are shooting fighters down and new factories are being built far away from each other. Fall Rot will be a war like no other."
 GGR_hindered_war_effort:0 "Hindered War Effort"
 GGR_hindered_war_effort_desc:0 "This warlord has had major problems in restarting its war effort to prepare against the germans, whether this is due to a pacifist population or german interference is unclear but regardless this warlord stands little chance of surviving the storm to come."
 GGR_total_collapse:0 "Total Collapse"
 GGR_total_collapse_desc:0 "The worst has come to pass, this warlords life is over. Its government has collapsed under extreme external pressure, its people have lost trust in the system and all have scattered to the wind. The leader sits alone, ruling the previous capital in peace. It no longer has any chance to reunite Russia none the less survive the upcoming german invasion."
 GGR_weak_people:0 "Weakened People"
 GGR_weak_people_desc:0 "Due to the German propoganda machine the people of this state have lost faith in their government and lost hope for the upcoming war. While the amount of people who would rather surrender than fight on are a minority, they cannot be ignored. This states fight shall not be against the external german threat but against its own people."
 GGR_integrating_new_lands:0 "Integrating New Lands"
 GGR_integrating_new_lands_desc:0 "Due to our succesfull campaigns in Russia we have annexed sweethes of new land. While the war is far from over we must ensure that these new territories are properly incorporated so we can continue the rest of the invasion in peace."
 GGR_finishing_western_russia2:0 "Finishing Western Russia"
 GGR_finishing_western_russia2_desc:0 "The warlords of the west have been beaten, their forces are scrambled and their commanders are dead or have fled. It is time to finish them off so we can focus on getting through to the Ural mountain range."
 GGR_total_chaos:0 "Total Chaos"
 GGR_total_chaos_desc:0 "The German dogs organised a resistance against our government under our noses and the results are showing now! No matter, even if we cant predict where the Germans will land we will just kick them off the island like we have done before!"
 GGR_total_chaos2:0 "Total Chaos"
 GGR_total_chaos2_desc:0 "The German dogs organised a resistance against our government under our noses and the results are showing now! No matter, even if we cant predict where the Germans will land we will just kick them off the island like we have done before!"
 RKU_bastion_against_slavs:0 "The Barrier of Western Civilization"
 GGR_The_AA_line:0 "Building a New AA Line"
 GGR_continued_resistance:0 "Continued Resistance"
 GGR_RKS_wastes_of_siberia:0 "Wastes of Siberia"
 GGR_anti_gas_measures_OMS: "Preparations Against Chemical Warfare"
 GGR_anti_gas_measures_desc_OMS: "It seems that Russians decided to experiment with chemical weapons. Deadly, dangerous... but also easily avoidable. Every solider will get his own gas mask, every division will be taught to deal with such desperate and pitiful act of defense."
 GGR_anti_gas_measures_KOM: "Preparations Against Chemical Warfare"
 GGR_anti_gas_measures_desc_KOM: "It seems that Russians decided to experiment with chemical weapons. Deadly, dangerous... but also easily avoidable. Every solider will get his own gas mask, every division will be taught to deal with such desperate and pitiful act of defense."
