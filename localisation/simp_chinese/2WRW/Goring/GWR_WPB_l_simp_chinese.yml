 goering.gaiseric.18.t:0 "Valetta Burns"
 goering.gaiseric.18.desc:0 "As our troops begin the brutal street-to-street and house-to-house fighting in the Battle of Valetta, our logistics teams have recently noticed greater difficulties in getting supplies to the front. It seems that the Italian troops are destroying any and all infrastructure in the vicinity of Rome in a major scorched earth campaign, leaving nothing intact.\nOur previously strong advance is starting to grind down to a slow and brutal one as out troop movements become more and more restricted, but both we and the Italians know they are only delaying the inevitable."
 goering.gaiseric.18.a:0 "Intact or not, Italy will be ours!"
 goering.gaiseric.19.t:0 "Tearing Apart the Countryside"
 goering.gaiseric.19.desc:0 "The scars of war continue to show that they will not leave one corner of the world untouched. Units of the Heer are actively scouring the Italian countryside, destroying everything in their path in search of anything remotely valuable. Raw materials, jewelry, gold, cash, and anything that can be used to get a quick buck is taken.\nMany of the picturesque mountain towns that put Italy on the map have been reduced to piles of rubble, despite existing nearly uninterrupted for centuries. It is truly unfortunate and heartbreaking to see so much beautiful history and architecture destroyed and so many innocent families torn apart, but it is necessary to keep the soldiers happy and the ballooning war machine financed."
 goering.gaiseric.19.a:0 "Those people and towns you looted had names."
 goering.gaiseric.20.t:0 "Central Italy Sabotaged"
 goering.gaiseric.20.desc:0 "Our capture of the Italain industral heartland has been a success! We can now cripple Italian factories in the region."
 goering.gaiseric.20.a:0 "A Job Well Done"
 goering.gaiseric.22.t:0 "Southern Italy Razer"
 goering.gaiseric.22.desc:0 "The Capture of Italian agricultural centers has allowed us to raze their main source of food."
 goering.gaiseric.22.a:0 "Their armies march on empty stomachs."
 goering.gaiseric.25.t:0 "The Italian East Africa Plundered"
 goering.gaiseric.25.desc:0 "Our men have secured one of Italy's major colonies! This is great news for us; our cut of the spoils of war, vast amounts of precious metals and other currencies and valbules has already been loaded up and shipped to Germania. This large influx of valbules will net us a tidy sum of cash, which we can put right into our economy."
 goering.gaiseric.25.a:0 "War feeds our war machine."
 goering.gaiseric.26.t:0 "The Levant Plundered"
 goering.gaiseric.26.desc:0 "Our men have secured one of Italy's major colonies! This is great news for us; our cut of the spoils of war, vast amounts of precious metals and other currencies and valbules has already been loaded up and shipped to Germania. This large influx of valbules will net us a tidy sum of cash, which we can put right into our economy."
