 GGR_northern_unrest:0 "Northern Unrest"
 GGR_not_invaded_iberia_tooltip:0 "We have not yet started the invasion of §YIberia§!\n"
 GGR_iberia_conquered_tooltip:0 "We have succeeded in the conquest of §YIberia§!\n"
