 GGR_italy_conquered_tooltip:0 "We have succeeded in the conquest of §YItaly§!\n"
 GGR_operation_gaiseric_tooltip:0 "Preparations to invade Italy and her Client States will commence..."
 GGR_operation_gaiseric_trigger_tooltip:0 "§YThe Rest of the War Plan B has been completed§!.\nItaly is in an interesting position... the Alps and surrounding Mediterranean make the Italians a tough nut to crack.\nWe shall invade §YFrance, Iberia and Turkey§! to give us a better strategic position to conduct operations in the Mediterranean. Furthermore, we shall subdue §YRussia§! in order to gain an edge in resources for our upcoming campaign."
 GGR_no_room_for_cowardice_tooltip:0 "The German people will put their cowardice aside to make sure we deliver a swift defeat to the Italians!"
 GGR_no_room_for_caution_tooltip:0 "We will gain a bonus to the attack of our troops"
 GGR_no_room_for_hunger_tooltip:0 "Our troops will put aside their hunger to fight more efficiently in the Alps"
 GGR_arranging_our_conquests:0 "We will rearrange our newly conquered territory into new states"
 GGR_choosing_a_plan_tooltip:0 "We will decide upon a plan as to how we will handle our invasion of Italy..."
 GGR_the_stealthy_approach_tooltip:0 "§MWe will get a small bonus to the§! §Yattack and defense§! §Mof our U boats§!\n"
 GGR_naval_hit_and_run_tooltip:0 "§MWe will get a small bonus to the§! §Yspeed§! §Mof our naval forces§!\n"
 GGR_preserving_our_power_tooltip:0 "We will focus on preserving our navy and making sure we don't lose any of our ever so important ships\n"
 GGR_no_one_to_help_them_tooltip:0 "The Italians have been surrounded and we have the Mediterranean on lockdown, now nobody can help them..."
 GGR_infiltration_tactics_tooltip:0 "§MWe will get a small bonus to the§! §oout of supply factor§! §Mof our troops§!\n"
 GGR_the_knife_strikes_1:0 "Our invasion of Italy will commence!"
 GGR_the_knife_strikes_2:0 "Our invasion of Italy will commence with a strike on their ports!"
 GGR_a_war_on_3_fronts_desc:0 "We shall persue a war on three fronts against the Itallians, through land, sea and air, they wont be able to stop us."
 GGR_TOOLTIP_sever_the_artery:0 "We shall use our marines to §Ycapture key locations around the mediterranean securing better points to invade Italy from§!.\nHowever, diverting supplies to these efforts will mean our troops will §Yhave their heat attrition increase by §R15%§!§!."
 GGR_TOOLTIP_sink_the_ships:0 "Diverting resources to the kriegsmarine shall §YImprove the Kriegsmarine's hit chance and sortie efficiency by §G10%§!§!"
 GGR_TOOLTIP_GGR_precious_holdings:0 "The targets in the mediterranean are chosen: §YSardinia, Crete and Rhodes§! shall serve as great bases to launch our invasion from. Drilling our marines for this task shall increase our §Ynaval invasion speed by §G10%§!§!."
 GGR_TOOLTIP_GGR_make_a_tempting_lure:0 "Once §YSardinia, Crete and Cyprus§! are captured we shall ambush the Italian fleets stationed on them §Rdamaging many of the ports in the process but ensuring the Italian navy is crippled§!."
 GGR_TOOLTIP_GGR_perfect_staging_grounds:0 "Once §YSardinia, Crete and Cyprus§! are captured we shall keep the ports intact §Ggiving us more bonuses to the effectiveness of our naval invasions§!"
 GGR_TOOLTIP_GGR_from_the_isles:0 "Moving our staging facilities to the islands surrounding Italy will shorten our supply lines §Yreducing our out of supply factor by §G5%§! and our supply consumption factor by §G10%§!§!."
 GGR_TOOLTIP_GGR_from_the_kanal:0 "Moving our staging facilities to the captrued §YSuez Canal§! shall allow us to use its plentiful infrastructure §Yincreasing the attack and defense factor of our marines by §G10%§!§!."
 GGR_TOOLTIP_GGR_and_no_one_to_help_them:0 "Our capture of the §YSuez§! and our ownership of §YGibraltar§! shall mean that §RItaly will be cut off from any further foreign support§!."
 GGR_ITL_torch_the_crops:0 "We shall land troops to capture §YSicily and Calabria §Gcutting Italy off from its major agricultural regions, hindering the effectiveness of its army§!§!."
 GGR_ITL_smolder_the_factories:0 "Landing troops in §YRome and Campania §Gshall deprive Italy of much needed industrial capacity§!§!."
 GGR_TOOLTIP_GGR_who_shall_light_the_match:0 "§YAs we capture Italian provinces §Rwe shall burn them down, destroying as much infrastructure as possible§!§!"
