l_simp_chinese:
 GER_GOR_loot_occupied_territories:0 "Loot Occupied Territories"
 GER_GOR_support_afrikaschild:0 "Der Krieg im Süden"
 GER_GOR_support_afrikaschild_desc:0 "The South African War rages on seemingly unending yet the Reich cannot afford to let the decadent forces of the West score such a large victory against our friends on the African continent. Aid is necessary and while the ruins of the German Civil War are still smoldering our generals are fired up and ready for the next conflict against the forces of Western capitalism. The most skilled of our German boys will be the first to step foot on the ground of Africa, advisors and small divisions of soldiers will reinforce the lines of our colonies. To the public, this will be shown as an aid mission and news of divisions being sent into the heart of darkness are to be suppressed as to avoid the volatile youth from having more reason to resist our rule."
 GER_GOR_full_scale_intervention:0 "Full Scale Intervention"
 GER_GOR_full_scale_intervention_desc:0 "It's high time we put in our full effort into securing Africa. The divisions that we have sent thus far seem to be inadequate so far when it comes to winning this war. The incompetence of the Afrika-Schild this far to win this war has proven a fact many of our generals have been saying since the civil war started, the only total commitment will be able to win this war. Our tanks will roll over the great savannas of Africa as our brave boys stalk the jungles the Americans will have no idea what they are facing. The full might of the Greater German Reich will be brought down like a hammer on the South Africans and their American allies, no longer shall we put up with their meddling. The first wave of divisions will be rapidly sent to the dark continent as more are prepped for their great battle. They shall be promised a celebration in Cape Town once this is all over."
 GER_GOR_riefenstahls_triumphant_return_to_film_making:0 "Riefenstahl's Triumphant Return To Film Making"
 GER_GOR_riefenstahls_triumphant_return_to_film_making_desc:0 "Leni Riefenstahl, one of our most skilled and famous filmmakers, known for movies like Triumph of Will and The Victory of Faith, is once again to be called up for work this time in Africa. The populace is still weary over the Calamity brought by the German Civil War and faith in the German's ability to win the South African War is at an all-time low among our populace. Thus we need something to whip our populace into a patriotic and what better way to do that than the art of film. Riefenstahl will be sent to Africa to film the beauty of this continent the vast jungles and rolling savannahs, any German would be lucky to see this beauty! Luckily any young man can! As long as he signs up to join the Afrika Korps! German soldiers will be shown off smiling and well fed, their uniforms a symbol of glory and honor. The proud sons of the Reich will be shown off to the world and Germany's glory will shine eternally through our films."
 GER_GOR_a_german_commander_on_the_ground:0 "A German Commander On The Ground"
 GER_GOR_a_german_commander_on_the_ground_desc:0 "Speidel is a nuisance here in Germany, constantly undermining our plans for a Greater Germany, one unshackled by the pacifism and bloat of the 50's German Reich. However, He is also a very skilled general and his acts in the Second World War and the West Russian War prove this to be the case. So why not kill two birds with one stone? Speidel can be sent to Africa and will oversee the forces of our Afrika Korps and hopefully pull off a decisive victory and this will get him off our back as domestically we continue to transform Germany into the image of glory and war."
 GER_GOR_army_group_afrika:0 "Armeegruppe Afrika"
 GER_GOR_army_group_afrika_desc:0 "As troops are readied and sent to the great continent of Africa the organization of special African divisions will be created, these units will be specially trained to fight and survive in the harsh climates of Africa and just like Rommel's Afrika Corp before them, will be elite and highly skilled. In addition the current forces of the Africa Schild need to be centralized with our Arrican divisions, they are after all our colonies. This will be done to ensure a strong and unified force that will be able to crush the American forces and secure South Africa. "
 GER_GOR_against_the_USAF:0 "Against The USAF"
 GER_GOR_against_the_USAF_desc:0 "Göring is a veteran of the Luftwaffe. He had flown above the trenches of France in the First World War and had led the Luftwaffe to victory in numerous battles during the Second World War, so if anyone understands the importance of the war in the air, it's Göring. In Africa the skies are a battle, the soaring jets and thundering of anti-aircraft guns are all that is heard by the Soldiers as they march south. Smoke and fire constantly reign down and butcher our divisions this needs to end, we must turn the battle in the sky around and make the Americans fear the power of the Luftwaffe once more! Planes and Pilots will be sent en mass to Südwestafrika, they should hopefully be able to deal crushing blows to the United States Airforce from the bases in Südwestafrika."
 GER_GOR_boots_on_the_ground:0 "Boots On The Ground"
 GER_GOR_boots_on_the_ground_desc:0 "More! MORE! The flames of war continue to consume the Dark Continent and our boys fight bravely but clearly, it is not enough. The United States continues to funnel their men into Africa and this war is still not over even after all we have done to support the Schild's war effort. The only solution to keep escalating this. More tanks, the more men, the more aircraft the more Americans killed the better. We will crush their spirits we will ride unto the glimmering lights of cape town shine and the Americans have been kicked back to their hemisphere their tails beneath their legs. Mess with the Soaring Eagle you get the Talons."
 GER_GOR_panzer_against_tank:0 "Panzer Against Tank"
 GER_GOR_panzer_against_tank_desc:0 "American tanks, hundreds of them roam the battlefields of Africa devastating our lines and crushing our resistance, their tanks are but a pest that can easily be dealt with in time. All we need to do is send our own Panzers into the fighting and watch as the American tanks collapse. So now the great German war machine roars again! The factories continually pour out tanks upon tanks that would make any American or Japanese or Russian tremble in fear of its steel might. Production will be doubled and we must ensure that all these panzers produced will be of the highest quality so that are colonies in Africa will only get the greatest the German military has to offer!"
 GER_GOR_arm_the_schild:0 "Arm The Schild"
 GER_GOR_arm_the_schild_desc:0 "It's become clear that to win this war we have to count on our colonies, no matter how incompetent they have proved at winning this war thus far. Our forces are strong, well trained, and well equipped but they are still low in numbers and cannot handle the overwhelmingly large OFN forces alone. Thus arms like modern artillery, tanks, and guns will be sent to our loyal colonies since as of now there are rumors going around that some Schild forces fight with guns from World War 1! These weapons straight off the presses of our factories will hopefully serve the Schild well and give us a formidable army to serve alongside our Afrika Korps."
 GER_GOR_the_enemy_of_my_enemy:0 "The Enemy Of My Enemy"
 GER_GOR_the_enemy_of_my_enemy_desc:0 "The Boers are on the front line of this conflict, they are the focal point. Their self-determination for the independence of their people is what caused this war and so we should perhaps commit ourselves to their independence and continued existence. While the Boers are not German per se they are essential to winning this war. Their continued guerilla war against the South Africans is extremely useful in crushing the spirits of the American and South African forces. Therefore to ensure that their guerilla war goes on indefinitely by supplying the Boer freedom fighters with only the most well made German weaponry."
 GER_GOR_the_enemy_of_my_enemy_effect_tooltip:0 "§YArms the Boers with some extra divisions.§!"
 GER_GOR_enforce_a_naval_quarantine:0 "Enforce A Naval Quarantine"
 GER_GOR_enforce_a_naval_quarantine_desc:0 "Let us revel in the glory of the Kriegsmarine, the great navy of the Reich that crushed the British and surpassed the Americans! One of the greatest parts of the great Kriegsmarine was the U-Boats, they ruled, deep beneath the mid-Atlantic range terrorizing American and British sailors and destroying their trade routes. With the war in South Africa rages on like an unkempt wildfire we must revive the spirit of the U-Boat and strike a demoralizing blow to the United States. Our best and brightest naval engineers and workers will be sent to the Schild to oversee the construction of their own U-Boat fleet that will be sent deep into the Atlantic Ocean to make sure no new Americans supplies or soldiers reach the coast of South Africa ever again."
 GER_GOR_enforce_a_naval_quarantine_tt:0 "We will deploy a flottilla of U-Boats to Zentralafrika"
 GER_GOR_negotiate_only_in_pretoria:0 "Negotiate Only In Pretoria"
 GER_GOR_negotiate_only_in_pretoria_desc:0 "The people may be tired of this war, the natives of Africa, restless but alas this war is still not over and it will not be over until we say so. The gears of this war will turn unending until we are victorious. So this is our prerogative we will only negotiate on our terms and the Schild should know this, they do not have the option of going to Cape Town and begging for the Americans to spare them. No, the only peace treaty they will be signing is one where the Americans crawl to the major city of Pretoria and beg us for an end to this war. So rally the men to sound the drums of war and make sure they all know. NEGOTIATE ONLY IN PRETORIA!"
 GER_Goring_SAF_War_category:0 "§ODer Krieg im Süden§!"
 GER_Goring_SAF_War_category_desc:0 "§YINVOLVEMENT:§! [GetGGRSAWInvolvement] ([?GGR_SAW_involvement|Y1]§Y%§!)  §MPROTEST:§! [GetGGRSAWProtest] ([?GGR_SAW_civilian_protest|Y1]§Y%§!)\n\nOur strategy is currently [getGGRSAWStrategy].\n\nThe §RSouth African War§! was not instigated or even intended by the §YFührer§!, but we can nonetheless profit from it. Whether we push the §RUnited States§! out of Africa or §Gwithdraw§! will have repercussions.\n\nIn spite of all this, the §Mcivilian population§! is protesting our involvement in this war already. We must carefully balance their demands and our plans, or §Rbe forced to withdraw§!."
 GER_GGR_offensive_strat_SAW:0 "Fighting to Win"
 GER_GGR_drugs_SAW:0 "Combat Drugs"
 GER_GGR_drugs_SAW_desc:0 "From Speed to Pervitin and beyond, drugs allegedly enhancing combat performance have found their way into the hands of German soldiers."
 GER_Goring_SAF_withdraw_from_the_war:0 "§YWithdraw from the War§!"
 GER_Goring_SAF_withdraw_from_the_war_desc:0 ""
 GER_Goring_SAF_increase_volunteers:0 "§RReinforce the War Effort§!"
 GER_Goring_SAF_increase_volunteers_desc:0 "We will send more volunteers into the South African War."
 GER_Goring_SAF_decrease_volunteers:0 "§MReduce the War Effort§!"
 GER_Goring_SAF_decrease_volunteers_desc:0 "We will draw back volunteers from the South African War."
 GER_Goring_SAF_decrease_volunteers_tt:0 "§YWar Involvement§! must be at least §Y10%§! or higher."
 GGR_SAW_war_report:0 "War Report"
 GGR_SAW_war_report_desc:0 "Every month, the nation receives the newest report on the South African War by the Oberkommando der Wehrmacht. Despite best censorship efforts, information will always end up trickling through - and the truth of this senseless war in Africa does not make the German people happy."
 GER_Goring_SAF_war_effort_failure:0 "§xLooming Failure§!"
 GER_Goring_SAF_war_effort_failure_desc:0 "Due to mounting pressure from the §Mpublic§!, the §gReich's§! valiant war effort in South Africa may soon have to grind to a halt. A truly shameful result for such a noble, and profitable, cause..."
 GGR_SAW_Fight_For_The_Reich:0 "§RFight for the Reich§!"
 GER_Goring_SAF_propaganda_open:0 "Show §TPropaganda Decisions§!"
 GER_Goring_SAF_propaganda_open_desc:0 "Click to show §TPropaganda Decisions§!."
 GER_Goring_SAF_propaganda_small:0 "Small Propaganda Effort"
 GER_Goring_SAF_propaganda_small_desc:0 "We will focus some resources on a small propaganda campaign aimed to calm down the protestors."
 GER_Goring_SAF_propaganda_med:0 "Medium Propaganda Effort"
 GER_Goring_SAF_propaganda_med_desc:0 "We will focus resources on a propaganda campaign aimed to evoke a feeling of national unity within the protestors."
 GER_Goring_SAF_propaganda_big:0 "Large Propaganda Effort"
 GER_Goring_SAF_propaganda_big_desc:0 "We will focus our resources on a truly grand propaganda campaign, aimed to recreate the flame of patriotism in our errant youth."
 GER_Goring_SAF_propaganda_close:0 "Hide §TPropaganda Decisions§!"
 GER_Goring_SAF_propaganda_close_desc:0 "Click to hide §TPropaganda Decisions§!."
 GER_Goring_SAF_equipment_open:0 "Show §OEquipment Decisions§!"
 GER_Goring_SAF_equipment_open_desc:0 "Click to show §OEquipment Decisions§!."
 GER_Goring_SAF_equipment_guns:0 "Gun Shipments"
 GER_Goring_SAF_equipment_guns_desc:0 "What equipment we can spare will be sent to the African RKs."
 GER_Goring_SAF_equipment_antitank:0 "Anti-Tank and Artillery Shipments"
 GER_Goring_SAF_equipment_antitank_desc:0 "What equipment we can spare will be sent to the African RKs."
 GER_Goring_SAF_equipment_helicopters:0 "Attack Helicopter Shipments"
 GER_Goring_SAF_equipment_helicopters_desc:0 "What equipment we can spare will be sent to the African RKs."
 GER_Goring_SAF_equipment_close:0 "Hide §OEquipment Decisions§!"
 GER_Goring_SAF_equipment_close_desc:0 "Click to hide §OEquipment Decisions§!."
 GER_Goring_SAF_reinforcements_open:0 "Show §RReinforcements Decisions§!"
 GER_Goring_SAF_reinforcements_open_desc:0 "Click to show §RReinforcements Decisions§!."
 GER_Goring_SAF_reinforcements:0 "Send Volunteer Reinforcements"
 GER_Goring_SAF_reinforcements_desc:0 "The brave patriots who have signed up for victory in South Africa will be sent to it."
 GER_Goring_SAF_drugs:0 "Combat Drugs Shipments"
 GER_Goring_SAF_drugs_desc:0 "Although it is a disgrace, the enemy has forced our hands..."
 GER_Goring_SAF_reinforcements_close:0 "Hide §RReinforcements Decisions§!"
 GER_Goring_SAF_reinforcements_close_desc:0 "Click to hide §RReinforcements Decisions§!."
 GER_Goring_Deploy_Speidelite_Officers:0 "Dispatch Speidelite Officers to the Front"
 GER_Goring_Deploy_Schornerite_Officers:0 "Dispatch Schörnerite Officers to the Front"
 GER_Goring_Deploy_Schornerite_Officers_desc:0 "Deploying some members of Schörner's clique to the front line will be an easy way to decrease his influence in the Wehrmacht."
 GGR_SAW_war_report_predic_tt:0 "§WWe predict an increase of §MCivilian Upheaval§! of [?GGR_SAW_civilian_protest_growth_base|Y]§Y%§! for the next month.§!"
 GGR_SAW_increase_volunteers_tt:0 "§YWar Involvement§! must be at least [?GGR_SAW_involvement_check|Y]§Y%§! or higher."
 huttig_collapsed_tt:0 "Hüttig's Reich has collapsed.\n"
 GGR_GRO_infil:0 "Hopefully there are enough sane men left in Africa to topple the mad king..."
 GER_GOR_SAF_public_support_increase:0 "\nThe §Ypublic support§! for the South African war §Ggrows!§!\n"
 GER_GOR_SAF_public_support_decrease:0 "\nThe §Ypublic support§! for the South African war §Rshrinks!§!\n"
 GER_GOR_SAF_military_support_increase:0 "\nThe military §Gapproves§! of our actions in the South African war!\n"
 GER_GOR_SAF_military_support_decrease:0 "\nThe military §Rdissapproves§! of our actions in the South African war!\n"
 GER_COG_speidel:0 "§DSpeidel§! §Ywas sent to manage the war effort in Afrika§!"
 GGR_huttigs_betrayal:0 "§eHüttig§! went rogue and took over Africa for himself!"
 speidel_scorned:0 "§YOur relationship with§! §DSpeidel§! §Yis abysmal due to our scapegoating of him following the§! §WSouth African War§!"
 huttig_scorned:0 "§eHüttig§! §Yhas been executed for his failure in Africa. As a consequence, his Werewolves will not take any of our orders. They have chosen to follow their master it seems.§!"
 SAF_Schild_Victory:0 "The Afrika-Schild has come out victorious in the war"
 GER_GGR_student_protests_new:0 "Civilian Protests"
 GER_GGR_student_protests_new_desc:0 "Political Power Gain Factor: [?GGR_protests_severity_pp|0+%]\nWeekly Stability: [?GGR_protests_severity_stab|1+%]\n--------------\nGone are the days of near-unanimous support for the war effort in the Reich. The public, predominately the students, are up in arms about Germany's involvement in a war they view as senseless and monstrous. The longer their Führer fights it, the more they will resist it."
 GER_GOR_scorched_administration:0 "Scorched Administration"
 GER_GOR_scorched_administration_desc:0 "The Reich did not take kindly to what they have perceived as our \"betrayal\". In fact, they seem to have shown their displeasure by ransacking as much of our tools of administration, records, and files as they could get their hands on before evacuating from Africa. Our mission here is one of cleansing, not bookkeeping, but unfortunately for us the former will be far less efficient without the latter. The damage done is significant, but at least not irreversible. We will have to put substantial resources into documentation if we have any hope of making up the gap at any rate."
 GGR_evacuating_loyalists:0 "Evacuating Loyalists"
 RK_negiotiate_in_pretoria:0 "Negotiate Only In Pretoria"
 RK_army_group_afrika:0 "Armeegruppe Afrika"
 RK_army_group_afrika_desc:0 "Führer Decree 862: By this order, the Führer of the German Reich hereby authorizes the creation of the theater level command headquarters unit \"Armeegruppe Afrika\" for the purpose of achieving victory in the war for the African continent. This command will supersede all other Wehrmacht commands on the African continent.\nFührer Decree 863: In pursuant to Führer Directive 862, the Führer hereby orders General Hans Speidel to assume immediate command of Armeegruppe Afrika, where he will direct its actions from whatever location the Reich sees fit."
 RK_speidel_in_africa:0 "Speidel in Africa"
 RK_speidel_in_africa_desc:0 "General Hans Speidel, hero of the West Russian War, has been deployed to the African continent. The Reich has seen fit to deploy one of its most effective commanders to oversee the conduct of the Reichskommissariats in the South African War. His expertise will be quite useful to our officer corps."
 goering.saw.0.t:0 "The Bush War Begins"
 goering.saw.0.d:0 "Field Marshal Speidel has left for Africa, leaving Schörner almost total control over the Wehrmacht in Germany. Speidel's absence has provided Schörner an ample opportunity to extend his influence throughout the Wehrmacht- already he has begun courting key officers within the army, hoping to grow the power of his militarist faction.\n\nBut no matter Schörner's efforts, all is dependent on Speidel's performance in the South African War. Speidel returning home as a hero or a disgrace will determine Schörner's success or failure in the growth of his clique."
 goering.saw.0.a:0 "Only time will tell."
 goering.saw.1.t:0 "Riefenstahl Out of Retirement"
 goering.saw.1.d:0 "After over 20 years of retirement, the famous director Leni Riefenstahl has announced the creation of her latest film: The Last Domino. Known for her iconic propaganda films of early party rallies, The Last Domino focuses on the current conflict in South Africa. Having spent several months with a Wehrmacht unit in the bush, Riefenstahl's endless footage of firefights and airstrikes have been an instant box office success in Germany, with critics praising Riefenstahl for her illustrious return to cinema.\n\nThe release of the film has also had a substantial morale boost on our troops at the front. Though progress may be slow, any kind of encouragement is helpful."
 goering.saw.1.a:0 "An instant classic."
 goering.saw.2.t:0 "Additional Manpower Proposals "
 goering.saw.2.d:0 "Despite some successes on the African Front, the grueling battles have had a significant drain on our manpower in the area. As a result, two different proposals have been put forward by local commanders: the conscription of Germans, or the conscription of native Africans. Naturally we would prefer the Untermenschen to be the ones at the front lines taking all of the bullets rather than the sons of the Reich, but certain officers are insisting we need qualified, and trustworthy soldiers in the field."
 goering.saw.2.a:0 "No need for conscription, we're winning!"
 goering.saw.2.b:0 "Conscript German forces."
 goering.saw.2.c:0 "Conscript native African forces."
 goering.saw.3.t:0 "Defeat in Africa "
 goering.saw.3.d:0 "The South African War was supposed to be our chance to reassert Germany on the world stage following the Civil War. Instead it has become the greatest embarrassment the Reich has faced since the West Russian War nearly saw it toppled. Damage control will need to be applied quickly domestically and the troops we deployed to the African continent will need to be withdrawn immediately before the advancing OFN forces. Once these tasks have been completed, then and only then can we think about our next steps to reclaim what is rightfully ours."
 goering.saw.3.a:0 "We have to find someone to blame and quick!"
 goering.saw.4.t:0 "Ceasefire in Africa"
 goering.saw.4.d:0 "The war has ended in a ceasefire, and the Afrika-Schild has been preserved. Though the Reich has not made any significant territorial or economic gains, the retention of our foothold in Africa has been enough to cause a surge in popularity of Speidel, with him being awarded a hero's welcome in his return to Germania. The militarists have been mostly silent about the whole affair, issuing cold, conciliatory remarks, insincerely congratulating Speidel for his successes. Speidel's partial successes has caused Schörner's influence to wane, giving Speidel an opportunity to limit the power of the militarists."
 goering.saw.4.a:0 "Stalemate is better than defeat."
 goering.saw.4.b:0 "Back to the beginning."
 goering.saw.4.c:0 "Better than a full route."
 goering.saw.5.t:0 "The Hero Returns"
 goering.saw.5.d:0 "Speidel stared out of the window of the plane. He stared and saw below an industrial mess below, with factories stretching as far as the eye could see. He supposed this was necessary to keep the Reich's war machine running, but it was still an eyesore. Smog billowed out of chimneys, polluting the once blue sky with a sea of gray and black. Was this really what Speidel had spent his time fighting for?\n\nHe was almost powerless now. In his assignment to Afrika Schörner had been able to act unopposed in his schemes at taking control of the Reich for himself. Speidel didn't understand why he needed to gain this much control. He was a militarist, after all, and the militarists had won the war. It was an enigma. It was an enigma that was now Speidel's superior. The thought of Schörner as his superior made Speidel want to vomit.\n\nAnd there was Göring, too. That petulant bastard. He barely knew how to command anything, much less a Reich. He had saved the Reich in Afrika and this was his reward? Going back to two idiots who didn't know how an economy is supposed to function? If Speidel just hopped on a plane to America on a \"foreign military mission\" he could-\n\nSpeidel stopped himself. He had a duty to the Fatherland, after all. He couldn't desert now. Not like this. The plane landed. Speidel was back in the Reich."
 goering.saw.5.a:0 "Welcome Home!"
 goering.saw.6.t:0 "The Officers' War"
 goering.saw.6.d:0 "For our nation that is still recovering from the wounds made by the all too recent Civil War, the failure of the Afrika-Schild is a terrible blow to our newly secured government. Though all media outlets have been ordered to keep a careful tongue about the situation, the news about our humiliating rout is still spreading like a wildfire in the streets and barracks.\n\nWhile the rumors spreading outside our direct control are cause for concern, the cause for alarm is coming from inside our own government. Speidel's clique has been dealt a heavy blow with the apparent failure by their leader to secure a victory on the ground and this has given Schörner's clique an opportunity to pounce. A bloodless battle has broken out amongst the officer corps as the various factions begin to maneuver in the wake of this disgrace. Luckily enough officers have expressed a commitment to inter-factional neutrality that Schörner's crew is unable to do much more than gloat but the dangers of Speidel's failure are readily apparent. Reigning Bloody Ferdinand in has just become quite a bit harder."
 goering.saw.6.a:0 "Ahh, Speidel, why did you have to dissapoint me!"
 goering.saw.7.t:0 "An Ordinary, Peaceful Day in the Reich"
 goering.saw.7.d:0 "For a nation which is still recovering from the wounds made by the German Civil War, the ceasefire of Africa is nothing but a distant news that most don't care at all. Though we used to hope we can boost their enthusiasm through a great victory in Africa, we have to accept the not so welcoming result in the end. The media still tries to describe the ceasefire as a decisive triumph of the Reich over the Americans, but everyone knows clearly that no one is going to believe or even read such recovers.\n\nFor the military, much like the civilians, the morale of our army is not even affected by this event at all. While the militarists' faith in the Führer didn't grow stronger as we hoped, they are not very unhappy about it neither, which is at least acceptable for our current situation. Indeed, there is still someone murmuring about our performance during the war in darkness, but most soldiers aren't buying it.\n\nEventually, in the everywhere of the Reich, life continues as usual. Fathers are considering where they can have a better payment, and cheering for their favorite football club; mothers are worrying about their children's grades in school and preparing for the dinner that their husbands are about to have; children are still running over the streets, talking about how to make excuse for their late returns. Tonight is just like every quiet night that our people enjoy after the civil war, and a distant war in Africa seems to be never existed in their world."
 goering.saw.7.a:0 "An unpleasant, but acceptable result in the end."
 goering.saw.7.b:0 "What was the point of the war then?"
 goering.saw.7.c:0 "Unfortunate, but it could have been worse."
 goering.saw.8.t:0 "A Total Victory and its Aftermath"
 goering.saw.8.d:0 "For a nation which is still recovering from the wounds made by the German Civil War, our victory in the South African War has increased our standing with the people more than even our wildest expectations. Everyday the newspapers, televisions and radios are filled with reports about how great our success is and interview with soldiers from the Afrika Korps that just returned from the battlefield, and spontaneous celebrations can be seen at every city of the Reich.\n\nTo our people. many has remembered the old days when we conquered Paris, destroyed the Soviets and defeated the Russian remnants. While such an victory cannot be compared with those great victories we achieved before, the first victory against the western powers after the civil war has still made people passionate about what we're going to achieve in the future. Retired old put on their old medals, and tells stories about their performance in the past; younglings are gathering in the conscription stations, wishing to win their own glory in such an unstable but exciting age. The Reich is now a sea of joy, and all doubts about our newly secured government have disappeared in the dust.\n\nHowever, there are still some troubling consequences coming alongside the good ones. Those militarists, who didn't like us from the beginning, has gained more popularity and prestige by this victory. They openly declared that the Reich need directly take out her enemies, so that we can become the ruler of the world through blood and fire. Though for now the situation is still under our control, we still need keep a close eye over those detestable and ignorant beasts."
 goering.saw.8.a:0 "Rejoice, but remember to keep calm, my friend!"
 goering.saw.9.t:0 "The Shadow Hangs Long and Dark"
 goering.saw.9.d:0 "The man was so disheveled that he seemed to be the reverse image of Hans Hüttig, but he was the former Reichskommissar of Ostafrika all the same. His face was a dusky red, bordering on an unhealthy purple as every vein in his forehead protruded grotesquely. It was, however, the man's eyes that most stood out to witnesses. They were orbs, cracked with deep red lines and filled with an unnatural fire, some kind of primordial fury that threatened to burn the man who bore them inside out. Hüttig was not facing his approaching demise with anything close to dignity, but perhaps that was only fair.\n\nHe had been pulled after all, half conscious, from a makeshift brig in one of the Reich's ships that had fled the lost continent Africa. The continent that had been lost by him, or so the Reich had claimed, thus explaining his treatment. Still, if they had hoped to pacify the former colonial governor, they had made a massive mistake. The confinement had only given the man more time to reflect inward into his own dark, distrubed mind. For the days and nights he had spent at sea, only eating the meager rations his former allies had allowed him, he drifted further and further into a black abyss of madness. Every layer of mental safeguard, every justification for serving the Reich, every ideal he had devoted his brutish life to, each was stripped away in painful turn.\n\nAnd so at last when he found himself once more under the white hot light of the yellow sun, it was as a malignant husk of his former self. Capable only of hatred for his betrayers and the degenerates he imagined were surrounding him even now, coherent conversation was nearly impossible. Only the rantings and ravings of a man who had stared deep into the abyss, and had seen the abyss stare back."
 goering.saw.9.a:0 "Dies irae, dies illa."
 goering.saw.10.d:0 "Führer Hermann Göring watched as the jet-black helicopter came in low and loud as it approached the landing pad built for VIP visitors to the Reichskanzlei. It was not one of those marvelous and expensive machines the Luftwaffe had been toying with nor was it even as sleek as any of the private crafts the corporate big-wigs were so fond of. No, this was an older, but also far more durable model that had been built for use in the African Reichskommissars. This was the personal vehicle of Siegfried Müller.\n\nThe craft's landing was... not graceful by any stretch, bumping twice and skidding half a foot. Göring fleetingly wondered if the pilot was drunk. He hoped the former Reichskommissar was unharmed. Still, he reminded himself, if the man could survive the South African War and a run from the OFN for the past several months, a little jostling wouldn't be the end of him. He was brought out from his thoughts by the sound of the 330 Puma's cockpit door opening. From the pilot's seat hopped a man in the dress of a common mercenary, a Sturmgewehr 45 slung over one shoulder; it was Siegfried Müller himself! Only moments before the Führer had been annoyed by the mediocre landing, but that was all forgotten now. The Führer gave a non-formal salute that Müller did not even bother returning, but Göring didn't seem to mind at all.\n\n\"Herr Müller, it is so good to finally see you in person again! I had no idea you had taught yourself to fly helicopters during your time in Africa. It was most impressive to watch you in the sky if I may say.\"\n\nMüller flashed the smile that had won him adoring fans all across the Reich, \"Why thank you my Führer. Yes, I did pick up some skills in my time, mostly for the purpose of getting to hunting spots you see, but I am thrilled to have impressed the great Reichsmarschall himself.\"\n\n\"Hunting, yes I did know you were quite an exceptional marksman. We ought to hunt together at Schorfheide. You will come to Carinhall and stay a while to rest won't you?\"\n\n\"If it's you asking me then I would be delighted sir.\""
 goering.saw.10.t:0 "The Return of the Afrikajäger"
 goering.saw.10.a:0 "\"Marvelous, and we can discuss your future with me then.\""
 goering.saw.11.t:0 "Where to Visit?"
 goering.saw.11.d:0 "With the South African War finally over, Führer Göring has made the decision to tour the re-established dominions of the Reich. Such a move will serve both as a reminder for the three mainland Reichskommissars that they have an ultimate loyalty to the Führer even if that position may have changed hands, but at the same time will make an excellent snub to those pathetic nations that were utterly embarrassed in their efforts to back South Africa.\n\nThe question now is where Führer Göring should head. Siegfried Müller in Zentralafrika would no doubt be able to regale the leader of the Reich with tales of exotic hunts and daring mercenary adventures. Schenck's shared experience in the sky with Göring will surely make for many enjoyable evenings spent in nostalgia. Hans Hüttig of Ostafrika may not be much of a conversationalist or host, but he did do the most to achieve this latest victory for the German people and deserves proper congratulations. As always, the final decision is up to Führer Göring."
 goering.saw.11.a:0 "Time to meet with a fellow ace!"
 goering.saw.11.b:0 "Hüttig is the hero of the Reich and deserves the honor!"
 goering.saw.11.c:0 "Müller was always a fun dinner guest."
 goering.saw.11.e:0 "It is time to return home."
 goering.saw.12.t:0 "Nostalgia in Südwestafrika"
 goering.saw.12.d:0 "Göring chuckled as Reichskommissar Schenck described, in hilarious detail, the antics he had gotten himself up to as a young pilot. The Führer reflected upon the fact that his host, who had been quite sullen and quiet up until this point, had almost seemed to come back alive when the topic of flying was mentioned. Göring had never considered himself a clairvoyant in matters of the heart, but even he was adept enough to recognize that the man was clearly more at home amongst the clouds than in an office. Perhaps, the Führer thought inwardly, he could have been such a man if things had gone differently.\n\n\"So I've been told you were born here in Südwestafrika under the old Imperial colony?\"\n\n\"Yes my Führer, in Windhoek.\"\n\n\"I see, I see. Did you know that my late father was the first colonial commissioner here? I suppose we both have our connections to one another, both in the lands we are tied to and the professions we have chosen.\"\n\n\"You are no doubt right my Führer, but I must confess I believe I share nothing of your ability to lead others, much less a nation.\"\n\n\"Perhaps,\" Göring mused, clearly appreciating the flattery, \"but we cannot all be Führer material can we? We all must have our part to play in the hierarchy of life just and just as there is an apex predator in every food chain, I was simply destined to serve the German people as their leader.\" Schenck said nothing to the self-adulation billowing forth from his leader's mouth in a cloak of faux-modesty.\n\n\"Er, my Führer,\" Schecnk seemed somewhat reluctant to speak, \"perhaps some time soon we could discuss a possible change in my position? I must admit that I do not truly feel up to this most important of tasks any longer...\"\n\nGöring nodded, but his attention was fixed on the trays of food being brought in by the native servants."
 goering.saw.12.a:0 "If a man screams and no one listens, does he still make a sound?"
 goering.saw.13.t:0 "Fear and Loathing in Ostafrika"
 goering.saw.13.d:0 "The Führer was trying his hardest to make conversation with the almost uncomfortably taciturn Reichskommissar. \"You know, my father was a colonial governor much as you are now Herr Hüttig. Yes, he was in charge of the Imperial colony of Südwestafrika and much like you he had the burden of bringing civilization to this poor excuse for a continent.\"\n\nNothing. Not even an acknowledgement that he had heard Göring speak. If the man had not been responsible for the recent victory in the war the Führer would seriously consider having him removed and sent to wallow behind a desk deep in the Wolfsschanze. So far, Göring thought, the only thing that had made this visit even semi-bearable was the excellent cognac that Hüttig had provided. It was frankly astonishing to the former Reichsmarschall that a man with such an unpleasantly austere personality would keep such a collection. He made a mental note to carry off as much as he could upon his return to Germania.\n\nJust as the Führer was beginning to lose all hope of ever getting his \"companion\" to engage in any sort of discussion, the Ostafrikan Reichskommissar seemed to burst into a frenzy of animated movement and speech like a jack-in-the-box springing out.\n\n\"My Führer! My Führer it is good to finally be able to talk to you in person!\" Göring was about to return the compliment but Hüttig did not let up, \"We must talk about the others... I have very important information regarding them... very important information!\" His words came in staccato bursts like the fire from a Sturmgewehr. Göring was completely taken aback.\n\n\"Herr Hüttig, please, settle down. If you have something so serious to discuss, I am sure we can talk it over at some other time in a more official capacity.\"\n\nThe words seemed to snap Hüttig back to reality, or so Göring believed when the man stopped his infernal shouting. As the Führer handed his host a glass of the cognac and began to attempt to entertain him with old war stories, he did not notice the dark, almost glassy look that had now settled on the disturbed zealot. He similarly failed to notice the twitching of the man's eyes, or the curling of the man's fists."
 goering.saw.13.a:0 "No, the master of the Reich was just as clueless as ever."
 goering.saw.14.t:0 "A Vacation in Zentralafrika"
 goering.saw.14.d:0 "\"And this one,\" Reichskommissar Müller gestured at the stuffed head of a lion adorning the mantelpiece of the dining hall of the Hitlerstadt retreat, \"now this one was quite a hunt. He had me on for two days before I managed to bring him to ground off of Lake Viktoria.\"\n\nGöring started admiringly at the trophy before letting out a slow whistle, \"What a mighty beast indeed Herr Müller, it shows the mark of a true Aryan to have the skill and courage to take its life.\"\n\nMüller seemed disinterested in that particular compliment and began to point out the other prominent trophies hanging upon the walls, basking in the praise delivered to him by the Führer as he shared his many adventures.\n\nNaturally, the victorious Reichskommissar and the still freshly anointed Führer were the centerpiece of the dinner, but they were hardly alone. While the two bon-vivants were carousing, General Wilhelm von Thoma took the chance to converse with his former superior, the now retired Generalfeldmarschall Rommel.\n\n\"You know,\" von Thoma offered, his voice noticeably charged with emotion, \"I never forgot what you taught us in North Africa sir, and I never let my men forget it either.\"\n\nThe words of praise clearly affected the old warrior. \"Herr Thoma, it means more to me than you could guess to hear that I had some value to the future soldiers of my Fatherland. It brings me some comfort in my twilight years.\"\n\n\"Herr Rommel! Herr von Thoma!\" The loud voice of the Führer interrupted the tender moment, \"You should both get some sleep. Remember that we are to have a hunt with the Reichskommissar tomorrow and he promises it will be an exciting one!\""
 goering.saw.14.a:0 "The two battle-weary men sighed, but dutifully obeyed."
 goering.saw.15.t:0 "Time For A Break?"
 goering.saw.15.d:0 "Göring sat at his desk, a stack of unexamined papers, reports, and memorandum regarding the recently won South African War sitting to the side. The Führer of the German Reich was, in a word, bored. He was desperately searching for something interesting to do, his mind racing from idea to idea without settling on any single one for very long. Inspect the tanks again? No, he had done that too many times since the Civil War had ended and it was getting stale. Head to the opera? He liked that one but Schörner would be too furious to make it worth it. Design a new wing for Carinhall? Now that sounded enjoyable but what if...?\n\nHe sprang from his seat in a flash of inspiration and snatched up one of the many phones for the numerous important connections he had to call into on a daily basis. This particular phone was marked 'OKW Headquarters'.\n\n\"Yes this is Führer Göring. Yes, yes, Sieg Heil. Is Rommel still there? Good, good, put him on quick.\"\n\nQuiet blanketed the room for a few minutes while the heavyset dictator waited with barely contained excitement. Then, a new voice came through the other end of the line.\n\n\"My Führer,\" Rommel's voice was still professional as ever, even in retirement, \"how can I be of assistance to you?\"\n\nGöring's face pulled into an almost impish grin, \"Herr Rommel, pack your things, I'm going on a tour of our African lands and I want you to join me.\"\n\n\"I - I suppose I couldn't refuse such a request from my Führer, now could I?\"\n\nGöring's mask of geniality collapsed for a moment. \"No, you absolutely could not Erwin.\""
 goering.saw.15.a:0 "\"How foolish of me my Führer. Please, forgive me.\""
 goering.saw.16.t:0 "The Madman's Betrayal"
 goering.saw.16.d:0 "The situation room of the Führerbunker was a buzz of staff officers discussing emergency operation plans, aides carrying foldes of minute details and party cronies jockeying for attention and influence as they always did. Into this frenzy of action and inaction stepped Johannes Steinhoff, who had hurried from the Reichsluftfahrtministerium as fast as his staff car would carry him. Moving to the center of activity, occasionally giving a hurried \"Heil Göring!\" to a passing officer, Steinhoff advanced to where he knew the Führer would be.\n\nHe found him, his face a dark red, in a state more furious and terrible than he had observed since the close of the Civil War. He was on the phone, and he was shouting, almost screaming down the line.\n\n\"Tell Puttkamer I want a cordon established around their ports by the end of the week! Nothing gets in and nothing comes out without our approval and knowledge, do you understand me?\" Without waiting for a reply, the dictator slammed the receiver down, hanging up.\n\nSteinhoff adjusted his sunglasses back to position nervously, \"So, I take it that the rumors are true then?\"\n\nGöring almost snarled at his air chief, \"They are! That fucking bastard Hüttig has betrayed us! He has killed Schenck and has driven Müller underground. That's not what's important right now though Johannes. What's important is that we destroy him, we turn his ridiculous fucking 'Reichsstaat' into dust and ashes. That's where you'll come in - I want bombers over Quelimane today!\"\n\nSteinhoff said nothing, just blinked. His words carefully chosen, the former pilot answered, \"My Führer, if we really have lost the continent then it is improbable to strike any of his assets.\"\n\nGöring's face went purple, and for a moment Steinhoff had the half-humorous, half-grotesque mental image of the man popping like a balloon. Göring did not pop however, but after a tense moment he did seem to almost deflate back into his chair from which he had half-risen.\n\n\"Fine then,\" he whispered sullenly, but as Steinhoff turned to leave he spoke up, \"but tell Marshall Schörner to see me at once. I wish to have his advice on this matter.\""
 goering.saw.16.a:0 "\"Of course, my Führer.\""
 goering.saw.17.t:0 "An Unfortunate Setback"
 goering.saw.17.d:0 "\"How the fuck could our forces be stuck?\" Göring roared, pacing around a grand map table with his foreign secretary, Artur Axmann, standing timidly to the side. \"We have made every necessary arrangement so that the Reich would triumph in this war. They have the men, they have the equipment, and by god I made sure they had the leaders. How have they not produced any form of victory?\"\n\nAxmann did not reply.\n\n\"I do not expect our flag to fly over Cape Town tomorrow. I do not expect the United States to concede defeat next week. But I did expect that our forces would be advancing!\"\n\nAxmann continued his silence.\n\n\"Even the Americans cannot match the commitments I have made, damnit. The South Africans should be swimming in a shower of our artillery, and routing in response. I fail to understand why this war bleeds on so inconclusively. Why do you think we have failed to produce a victory, Axmann?\" the Führer finished, looking towards his thus far silent Reichsminister.\n\nThe minister's stomach sank, for he had hoped to avoid engaging with the Führer's ire."
 goering.saw.17.a:0 "\"Perhaps our victory is just a delayed matter of time?\""
 goering.saw.18.t:0 "Saving Face"
 goering.saw.18.d:0 "\"People of Germany, I stand before you today to tell you of what happened in Africa!\" Göring bellowed to the waiting crowd. Now that the proper scapegoat had been burdened with the public guilt for the less than ideal outcome, he could make his official statement.\n\n\"As you no doubt have heard, our combat operations in the continent have ceased, and an official armistice between our Reichskommissariats and the OFN has been concluded. I wish that I could stand before you today and say that the war ended with all of our noble aims fulfilled.\n\nI cannot say that however, because that would be false, and I have vowed to never speak an untrue word to the German people so long as I remain Führer. It is true, our battle has ended indecisively, without clear victory for our people. However, this does not mean we can simply give up now! Quite the opposite, we must redouble our efforts to the spread and preservation of our people and National Socialism across the world. Our outposts in Africa have been battered, but they still remain intact, our dreams shall not die until the last Aryan has perished from the earth.\n\nRest assured that those who have failed the Reich will be given their just deserts, and let this serve as an example to all those who serve the German nation: this is what happens when you fail! Even in failure however, we gain strength, just as we gained inner strength from the travesty of Versailles to embrace the truth of National Socialism, it is my belief that this momentary setback will be looked back upon in similar fashion. When future historians chronicle us, they will write of this as the moment a reborn German people, still scarred from the flames of civil strife, recommitted themselves to taking their rightful place. The OFN dogs have not beaten us, but merely won themselves a reprieve. We will show them our true might soon enough.\""
 goering.saw.18.a:0 "\"Sieg Heil! Sieg Heil!\""
 goering.saw.19.t:0 "The Ostafrikan Failure"
 goering.saw.19.d:0 "INTERNAL MEMO 1259\n\nThe main cause for the failure of the Afrika-Schild in the South African War was Reichskommissar Hans Hüttig's incompetence in directing the war effort. He should be especially reprimanded for his failure to coordinate the other two Afrikan Reichskommissariats, as he was their de facto leader. Hüttig himself should be publicly reprimanded, though he will not be removed from his position as Reichskommissar of Ostafrika at the present time.\n\nExpunge all documents that contain conflicting information."
 goering.saw.19.a:0 "Compliance with Internal Memo 1259 is mandatory."
 goering.saw.20.t:0 "An Ally Betrayed"
 goering.saw.20.d:0 "INTERNAL MEMO 1259\n\nThe main cause for the failure of the Afrika-Schild in the South African War was Generalfeldmarschall Hans Speidel's restraint in deploying our resources across the continent. While Hüttig was not a particularly gifted field commander, he made the best with what he had, and he had little of it. General Speidel's attempts at saving the lives of Aryans by using restraint in combat is admirable, but it does not win wars.\n\nExpunge all documents that contain conflicting information."
 goering.saw.20.a:0 "Compliance with Internal Memo 1259 is mandatory."
 goering.saw.21.t:0 "The Last Straw"
 goering.saw.21.d:0 "Hüttig stared at the memo in his hands. They shook with rage.\n\n\"He's blaming me? He's blaming fucking me of all people? Out of everyone incompetent he chooses the one goddamn useful person and pins all the failures on him?\" Hüttig began pacing around his office.\n\n\"Müller, Shenck, hell, even some of his own men, that fucking bastard Führer could've blamed anyone else, but me? He fucking blamed me?\" Hüttig sat down at his desk once more. He tried to calm himself down by doing paperwork, yet the thought remained in his mind like a parasite, growing and growing. He became angrier and angrier, barely able to contain it.\n\n\"Fucking dammit! If that son of a bitch called the Führer wants to goddamn blame it on me then I'll fucking give him a reason!\" Hüttig began writing and scribbling on a sheet of paper. He had a plan."
 goering.saw.21.a:0 "\"This'll show that bastard...\""
 goering.saw.22.t:0 "The Scapegoat"
 goering.saw.22.d:0 "Göring didn't move when Stuckart entered his office, instead he simply gestured to an open chair and offered his chief minister a glass of champagne. The President of the Reichstag declined, he had a long day ahead of him.\n\n\"So,\" The Führer began, \"Has Albert taken stock of the militarists in the Reichstag?\"\n\nStuckart nodded, \"Yes my Führer, Herr Bor-\", he quickly caught himself, saying that name was a good way to drive the Führer's mood south.\n\n\"Herr Albert has completed a tally of militarists willing to let Reichskommissar Hüttig take all the blame for the South African burnout.\"\n\n\"Very good, very good.\" [GetGGR_blame_speidel_text]"
 goering.saw.22.a:0 "A business of knives in backs."
 GetGGR_blame_speidel_text_yes:0 "Göring looked pleased, but then a look of confusion crossed his large face, \"So, if everything is ready, why not simply call? Why did you need to come in person?\"\n\n\"Ah, about that my Führer...\" Stuckart paused for a moment to collect himself, \"Apparently General Schörner and his clique are pushing for us to censure General Speidel for his failure to secure a decisive victory in the war.\"\n\nThe Führer's eyelids shot up at this. From under his breath, a quiet \"Damn you Schörner\" slipped out almost without thought. \"The bastard wants to use me to do his dirty business.\"\n\nGöring's teeth were gritted now, his face turning a dusky pink in the room's low light."
 goering.saw.23.t:0 "My Enemy's Enemy Is Not A Friend"
 goering.saw.23.d:0 "\"My Führer,\" Speidel said politely as he stepped into Göring's office. \"I have to disagree with the recent memo sent out. I merely sent what was necessary, as you commanded. Hüttig had more than enough to work with.\" Göring looked up from his paperwork and stared at Speidel.\n\n\"Sorry, what was that?\" the distracted Führer asked. Speidel boiled with rage.\n\n\"I'm resigning. Obviously you don't tolerate professionalism in the Reich anymore.\" he snapped.\n\n\"Wha- you can't be serious!\" Göring was taken aback by this sudden statement. \"You can't just do that!\"\n\n\"I can, and I'm doing it right now.\"\n\n\"Speidel, think this through. Do you know-\" Göring looked around his office, half-expecting Schörner to be hiding behind a potted plant. \"What that crazy bastard will do with you gone? I know that you're more... professional than him and won't make a massive fuss out of this. Come on, Speidel.\" Speidel hadn't thought of that. He swallowed his pride and spoke again."
 goering.saw.23.a:0 "\"I suppose I retract my resignation.\""
 goering.saw.24.t:0 "The Pretorian Triumph"
 goering.saw.24.d:0 "Führer Göring has visited Pretoria for a joint military parade between the triumphant Afrika-Schild and newly formed Boer Republic. The event was reported to have been massive, blocking most of the roads of the city in an extravagant display of military strength. Führer Göring has reportedly been very impressed with the Schild's troops, commenting that \"they might have to train ours instead of us training them\". After the parade, Göring congratulated multiple politicians from the victorious countries on their military strength, especially Ostafrika. The small number of Ostafrikan officials present received these comments well before hurrying off. While praise was primarily directed at Ostafrika, the other nations seemed to like the Führer's comments as well, and many speculate that the colonies and the Reich proper may grow closer soon."
 goering.saw.24.a:0 "I think Africa's going to be fine."
 goering.saw.25.t:0 "The Birds Have Flown The Coop"
 goering.saw.25.d:0 "TRANSCRIPT OF DOCUMENT RECEIVED AT [GetDateText]\nTOP SECRET\nFOR STATTHALTER HANS HÜTTIG\n\nMy Statthalter, I regret to inform you of the unfortunate report I have just received concerning the troops Führer Göring deployed to secure the continent. As per your orders, a band of our Werewolves was deployed to arrest their garrison at Hitlerstadt. Unfortunately, something or someone must have tipped them off, because they were ready for the attempt. Without even giving our soldiers a warning, they opened fire and killed three of our men in the first volley. I am told that they then commenced a running gun battle to Lake Viktoria where they captured some of our transports and made west for the coast.\n\nAfter tending to the wounded and taking some time to receive nearby reinforcements, the Werewolf unit attempted to head the fleeing Wehrmacht soldiers off at locations around the Dam, Brazzaville, and Léopoldville. Unfortunately, the unit proved unsuccessful at sinking any of the transports and inflicting more than superficial casualties while losing several men in the process. It seems that a major, fatal blow to the effort was struck when the Werewolf unit leader Hauptmann Friedrich von Tannenburg was killed in a skirmish at the Dam.\n\nUpon reaching the coast the small river transports headed north and we may yet catch them at one of the docks as they search for ocean-going vessels but I fear they have eluded us. I am aware of my failure in this important mission and greatly regret it.\n\n\nHEIL HÜTTIG!\n-KOLONIALWALVERWALTER OTTO FÖRSCHNER"
 goering.saw.25.a:0 "A grave failure indeed."
 goering.saw.26.t:0 "A Toy Set Adrift"
 goering.saw.26.d:0 "Friedrich Schultz wiped off the sweat that had collected on his face. His bare arms were now slick with perspiration, as much of it their own as from his face. Serving on a submarine, Schultz reflected not for the first time, was not a physically pleasant assignment. And for what? He sure as hell couldn't discern a point in their present mission. Patrol the African coast and prevent anyone from leaving or entering the Grossafrikaner Reichsstaat? Who would want to get into that hellhole? It wasn't like anyone was trying to do business with the madman in Quelimane. That much at least was certain; the crew of U-3122 hadn't seen even the outline of a foreign convoy yet.\n\nSchultz had gone to the captain with his questions, but the skipper hadn't been any more in the know than his crew. He had told Friedrich that the order had come directly from Grossadmiral Puttkammer himself. Well, Schultz wasn't an officer, but he wasn't stupid either. If the order was coming from that high up on the chain then it must have originated with the Führer. That still didn't get him any closer to the truth unfortunately, and it seemed like the mystery was going to remain as such.\n\nSchultz wiped the sweat from his brow again. Politicians were always playing their inscrutable games he supposed. As a soldier of the Reich, he didn't have much right to complain, but still it irked him all the same."
 goering.saw.26.a:0 "\"Christ what a dull job this is.\""
 goering.saw.27.t:0 "The Pissant Führer"
 goering.saw.27.d:0 "In times like these, the Führer often wished he still had the easy relief that his injections had brought him. Instead of the company of his needle, however, he found himself with the less pleasant company of Reinhard Gehlen, who eagerly awaited the Führer's commands. \"Hüttig's gone mad.\" Göring began, sharply, though he was certain Gehlen already knew of the situation. \"If he believes his 'Greater African Reich' can keep the savages in line without our help, he's more than welcome to try. Though he'll have a difficult time at it, if I have anything to say about it. This insult to National Socialism should not be permitted to stand, not for a moment longer than it has to.\" Göring continued. When he had first heard the news, Göring's mind had immediately flown to ousting the upstart and overtaking the dark continent with German boots. Surely, that was the route some of the militarists would have preferred, but Göring knew that at this stage, it was too early, preparations were still taking time. \"Make the phone calls and payments you must, Gehlen. I wish to be sure that Hüttig knows what it means to make an enemy in Germania.\" Though he spoke calmly, it was easy to see the rage behind Göring's eyes.\n\nIn contrast, one could see nothing behind Gehlen's sunglasses as he curtly nodded towards the most powerful man in Europe. \"Right away, my Führer.\" It would be a simple task, to capitalize on the many problems that already existed in German Africa. It would not be difficult for a man of Gehlen's talents to bring Hüttig's abomination to the ground. After making sure Göring had nothing else to share with him, Gehlen turned, moving to leave the room. Before the door closed, the Führer gave one last order to the man."
 goering.saw.27.a:0 "\"Make the bastard hurt.\""
 goering.saw.28.t:0 "A Rendezvous in Libreville"
 goering.saw.28.d:0 "Kai-Uwe von Hassel arrived at the meeting point early. The Abwehr man arrived at exactly the agreed upon time. Von Hassel figured that he wanted as little chance of being spotted as possible, and subconsciously wondered if he should have taken the same precaution. Nevertheless, it was too late to fret upon the matter. Von Hassel straightened his back, and gave the code phrase that they had agreed upon beforehand. \"Good morning, Herr. Is your mother in today?\"\n\nThe man, in a quiet and non-committal manner, responded flatly. \"No, she is away tending her poppy garden.\" The agent watched as von Hassel deflated a bit, now more at ease now that the man's identity was confirmed. The Abwehr agent continued, undeterred. \"Let us not mince words, Herr. What precisely do you require from my employer? Guns? Bombs?\"\n\nVon Hassel paused for a moment. He had spoken with several Zentralafrikan generals, most unhappy with the SS's coup over Africa. Few had been willing to commit to anything solid, however. Von Hassel's career in the Abwehr meant little to soldiers, who were committed to following the orders of their fellows. The Belgian industrialists in the area, however, would prove much more tractable as an ally. Hüttig's authoritarian, strictly national style of rule had chafed them and hurt their bottom line. It would be a strong alliance, if von Hassel could bring them to his side."
 goering.saw.28.a:0 "\"Let us start with Reichsmarks.\""
 goering.saw.29.t:0 "A Friend in the Congo"
 goering.saw.29.d:0 "The Führer read over the paper three times. He knew that he ought to be pleased with the report, but he caught himself wondering if it was all that could be done. Göring would have appreciated something he could point at in the meantime, to prove that Hüttig had not been permitted to carve out his little domain without resistance from Germania. He supposed he could endure the utter humiliation of it for a few months more, if it meant that the empire Hüttig had stolen was razed entirely to the ground.\n\nHis thoughts gathered, Göring listened as Gehlen spoke. \"A group of men loyal to Germania, led by a particular Herr von Hassel, will work to subvert Hüttig at every moment.\" Gehlen did not smile, but the Führer imagined he was very satisfied with his own work. \"Eventually, they will make a move against the government. Either we will have Africa in our hands once more, or the resulting chaos will lead to a total collapse of Hüttig's regime in the area.\"\n\nGöring was keen enough to pick up the implication that it would likely be the latter of the two possibilities. \"Let him keep the ruins of his hell-state, if he's so damn attached to it.\" The Führer declared, though he was not so happy about the potential loss as he attempted to seem. \"You've done well, Herr Gehlen.\" He waved his hand, silently dismissing the Abwehr man as if he were a trained hound. He had much to think about."
 goering.saw.29.a:0 "The dogs of war pick Africa dry."
 goering.saw.30.t:0 "Auf Wiedersehen, My Afrika"
 goering.saw.30.d:0 "It was another mandatory meeting of the war cabinet, which to Gerhard Barkhorn meant trouble. And yet, even as he had the thought while following General Steinhoff into the conference room, he could not help but notice that Führer Göring seemed surprisingly placid. Good spirited, even. Something was certainly up, although the Luftwaffe staff officer couldn't begin to fathom what would cause the Führer to appear as such. It hadn't even been a few months since the last meeting when he had been red with rage, his eyes burning with venom for the traitor Hüttig and the loss of Africa.\n\nIt was only when Gerhard moved in close enough to see the map halfway between the Führer and Feldmarschall Schörner that he understood what was going on. It was a battleplan map, with lines crossing every which way but all ending in bloody arrows stabbing into the heart of the continent. Gerhard suppressed a gasp. This was impossible, insanity. He wished he had possessed his superior's dark sunglasses to hide the doubt in his eyes, but with any luck he would just be ignored as usual as long as he kept silent.\n\nSteinhoff unfortunately had no such luxury. The air chief meandered over to his leader and with his usual slight rasp questioned, \"My Führer, do my eyes deceive me, or is that a plan of attack against the so called Reichsstaat sitting on the table? I was under the impression that we had decided against any such effort.\"\n\nHe spoke to the Führer, but Gerhard could just make out the shadows of his lidless eyes turn towards the OKW chief.\n\n\"That's just the thing Steinhoff!\" Göring almost bellowed, exuberant, \"After discussing the matter with Schörner, I have decided to put any attempts at reclamation on hold, for now. In return, the Generalfeldmarcshall has so considerately drawn up these plans for me. Aren't they grand?\"\n\nGerhard attempted to feign disinterest, but he had the uncomfortable feeling that Remer could sense the deception from across the table. He shivered as he turned his gaze back from the butcher's protege and to his superior.\n\n\"I... yes I agree my Führer, these plans are quite exceptional\""
 goering.saw.30.a:0 "This can't be good for one's blood pressure."
 goering.saw.31.t:0 "Out With a Whimper"
 goering.saw.31.d:0 "\"So that's it?\" Göring fumed, \"The war's over already!?\" there was no one to respond, no one to talk to, no one to make excuses. Göring wanted to yell at someone, but the only people he could blame for this disappointing display were down in Africa. This would've been the perfect opportunity to showcase a renewed German might following the pain of the Bürgerkrieg, and that idiot had Hüttig botched it. He had thrown thousands of German soldiers, precious resources in their own right, into the meat grinder. And this was what he had to show for it? Unacceptable! Göring paced around his office.\n\nThis was an international relations disaster. Thanks to Hüttig, would the OFN simply strike at the weakened Reich? Would it extend its Judeo-Bolshevik tendrils further into Europe? Africa had been lost; what was next: Italy? Sweden? Finland? His mind raced with nightmares of a surrounded Reich unable to reassert its power.\n\nWith slow, deliberate breaths, the Führer calmed himself. This was a temporary setback, nothing more. The OFN had won the battle, but not the Cold War. This was all explainable by the Reich's still fragile position thanks to the traitors, no need to overthink it. Just like any setback in his career, the Führer reassured himself, he would come back and on top at that."
 goering.saw.31.a:0 "Gottverdammt, what a disaster! Someone will have to pay."
 goering.saw.32.t:0 "The Execution"
 goering.saw.32.d:0 "Göring watched dispassionately as the soldiers hauled the broken man that was Hans Hüttig, SS butcher, Reichskommissar, failure. The heavy rings around his eyes suggested that he hadn't had sleep for several days at least, and his complexion was worn and unhealthy. And yet, for all that, his eyes still burned with the same disturbing light that they always had.\n\n\"What was that?\" came from one of the prisoner's guards, his rifle to the ground but always angled so that in an instant he could put a round into Hüttig if needed.\n\n\"I said,\" Hüttig began, his voice icy with contempt, \"that you are all degenerates. Every last one of you who would treat a man who has devoted his entire life to the cause of the Aryan people like this.\"\n\nThe guard looked inquiringly at Göring, asking for permission to simply end the madman's ravings. The Führer shook his head, \"Let him say what he wants Franz. It's not like he can do anything anyways.\" A slight smile crept across the Führer's face as he spoke the last line, sure of his absolute power.\n\nHüttig continued to rant as he was led towards the courtyard's wall, \"You are the traitors here, not me. I served the Reich, the ideals of National Socialism, what do you serve Herr Göring? Whatever the generals want? Whatever fills your pockets? How can the Aryan people have fallen so low as to follow such scum? The Reich does not deserve to survive with you degenerates at its head!\"\n\nGöring grunted, the man simply would not shut up. \"Franz,\" he motioned lazily to the guard, \"finish this embarrassment off please.\"\n\nWith an enthusiastic nod, Franz raised his rifle and fired off a quick series of shots. Hüttig groaned and started to sway, but managed to right himself from falling. The holes in his chest pulsed angry and red, fatal shots, but the man's sheer rage pushed him on.\n\n\"Incompetent degenerates! The Reich is doomed to die with you and your masters in the Wehrmacht at the helm! It deserves whatever end you bring it, I'd rather see it burn then with such degeneracy in control. I would've... I would've...\"\n\nHis voice weakened, his words trailed off, his legs gave way. It was over, Hans Hüttig was dead."
 goering.saw.32.a:0 "Judicanti responsura."
 goering.saw.33.t:0 "What the Moon Brings"
 goering.saw.33.d:0 "Johann peered at the village through his night vision goggles. He had been left behind in Afrika, but that didn't mean he couldn't serve the Reich. The order was to destroy the water purifier in the village. That would kill a lot of its population and some of the Americans within. The leader gave the hand signal, and the pack moved in for the kill.\n\nJohann heard gunshots ring out as he approached his position. The plan was going along well. The others would distract the American dogs as he destroyed their water purifier. The village would be empty after that; even after the death of the Reichskommissariat it would be devoured by the Wolves.\n\n\"The hell is going on? Why are there still Krauts around? The war's over, isn't it?\" Johann heard a voice from the direction of the water purifier.\n\n\"I sure hope the others are ok.\" Two voices. American voices. Johann hid behind a building, waiting for the Americans to leave. It seemed as if days passed as he waited, listening to their speech.\n\n\"I'm gonna take a piss, you hold down the fort for me, okay?\" Johann heard one of them stepping towards him. He readied his gun and-\n\n\"What the hell was that? Earl? Are you okay?\" Johann stood over the American's dead corpse, waiting for the other to come investigate. As Johann expected, he did. \"Earl?\" was all the other American had time to say before a bullet pierced his chest. Johann smiled as he destroyed the water tank, dooming the village. The Werewolves retreated, their hunt successful."
 goering.saw.33.a:0 "Howling at the Moon"
 goering.saw.34.t:0 "I'll Met By Moonlight"
 goering.saw.34.d:0 "Johann peered at the village through his night vision goggles. He had been left behind in Afrika, but that didn't mean he couldn't serve the Reich. The order was to destroy the water purifier in the village. That would kill a lot of its population and some of the Americans within. The leader gave the hand signal, and the pack moved in for the kill.\n\nJohann heard gunshots ring out as he approached his position. The plan was going along well. The others would distract the American dogs as he destroyed their water purifier. The village would be empty after that; even after the death of the Reichskommissariat it would be devoured by the Wolves.\n\n\"The hell is going on? Why are there still Krauts around? The war's over, isn't it?\" Johann heard a voice from the direction of the water purifier.\n\n\"I sure hope the others are ok.\" Two voices. American voices. \"Our orders are to guard this thing so they don't destroy it.\" One of the Americans yawned.\n\n\"I heard it's pretty important.\"\n\nJohann hid behind a building, listening to the Americans' conversation. He waited for them to leave, but they showed no signs of doing that. Then, the worst happened. A villager came out of the house behind him. Johann turned and fired his gun, silencing the panicked villager for good.\n\n\"What the hell was that?\" one of the Americans asked. He looked around the corner, saw a German, and fired."
 goering.saw.34.a:0 "All 142 Werewolves dead. A disaster."
 goering.saw.35.t:0 "Azazel"
 goering.saw.35.d:0 "\"My Führer,\" Stuckart was going at it again, \"I still believe that passing the blame for the African Disaster onto Reichskommissar Hüttig is the best option we have right now.\"\n\nGoring grunted, they had been going at this for hours now, debating over how to handle the fallout from losing decisively to the OFN. Stuckart was so adamant in blaming the former SS commandant that the Führer wondered if there was some personal vendetta at play.\n\n\"Listen WIlhelm,\" Axmann interjected, \"Hüttig may be at fault here but he has resources we could still use on the board. Those \"Werewolves\" I think he called them, they sound useful if we want to make the OFN suffer for their victory. Doing anything to the man now would remove that card from our deck and we're starting with so few as it is.\"\n\nKörner broke in, \"A good point Artur, but who do you substitute instead of our Herr Hüttig.\"\n\nAxmann looked annoyed, \"I was just about to get to that, if you would have let me finish. As I was about to say: why not just blame Himmler?\" The room went dead silent at the mention of that name but Axmann continued, \"We know the Burgundians are always playing their little games, we can just announce that they were secretly supporting the OFN. It blames someone and gets people fired up against those traitors.\" Göring rubbed his chin, considering his options.\n\n[GetGGR_blame_speidel2_text]"
 goering.saw.35.a:0 "Leviticus 16:6-10"
 GetGGR_blame_speidel2_text_yes:0 "\"You're all forgetting someone.\" A quiet voice, an unpleasant voice, Remer's voice. \"It was General Speidel who was in field command during our operations. Shouldn't he take the blame here?\"\n\nGöring was aghast, \"You want me to throw my own Army chief under the bus over this? Why would I ever do that?\"\n\n\"Because,\" Remer icily replied, \"It would assure Feldmarschall Schörner that you are willing to make hard choices for the greater good. That was why he supported you, after all.\"\n\nThe threat did not need to be further spelled out."
 goering.saw.36.t:0 "By the Dawn's Early Light"
 goering.saw.36.d:0 "Morning came slowly to Hitlerstadt, the sun lazily emerging from behind the horizon, beginning its slow arc across the pale sky. Inside the temporary barracks of the 12. Infanterie-Divisionstab however, the air was heavy with tension. The battalion's worth of men lined the inner walls, their eyes trained out of the windows and towards the jungle hazy with morning mist. Marksmen had situated themselves in the old colonial mansion's attic and machine gunner teams had occupied the main entrance ways. Private Otto Gantz figured the building could hold out against an artillery-less siege for two weeks. A siege with artillery they could withstand maybe half the time. Not bad all things considered.\n\nThe news had come in the middle of the night when all but the most insomniac of the soldiers had long since passed out. A little spook from the Abwehr Kolonialbüro. He hadn't given his name, only told them that Reichskommissar Hüttig had gone off his marbles and was planning to arrest all German soldiers on the continent. Well, they had all decided, they wouldn't be rounding them up without a fight.\n\nIt was still early, early enough that Hüttig's goons must have expected the Germans to still be asleep. They came from the jungle in groups of twos and threes, camouflage in dark greens and blacks. The Werewolves, Gantz remembered, that's what they were called. They sure moved like wolves on the hunt at any rate. They were going to die like wolves too. They might be formidable in a pack, sure, but when had man ever allowed mere curs to dominate him? Gantz raised his rifle up to his shoulder, picking the closest interloper to train his aim on.\n\n\"Not today.\""
 goering.saw.36.a:0 "Iacta alea est."
 GER_GOR_ofn_humiliated:0 "The OFN Humiliated"
 GER_GOR_ofn_humiliated_desc:0 "Once again, German arms have carried the day against the decadent capitalists and their Judeo-Bolshevik overlords! The South Africans and their patrons in the OFN believed that in the wake of the civil disturbances taking place in the Fatherland that they had finally found their chance to assault our settlements in Africa. What they did not account for was the personal ingenuity and courage of our loyal Reichskommissars. The names Siegfried Müller, Hans Hüttig, and Wolfgang Schenck will forever live on in the annals of the thousand-year Reich as the embodiment of what it means to be a true Aryan and warrior. The anguish in Washington can almost be felt here in Germania, but such is the price of their own failure. Our righteousness and their cowardice has been proven in blood and fire as in the old days."
 GER_GOR_support_the_boers:0 "Support The Boers"
 GER_GOR_support_the_boers_desc:0 "The Boer people have proven themselves capable and worthy allies during the war in South Africa. They were quick to realize that their British overlords were only puppets of Jews and communists, and as their own Germanic stock was naturally repelled to such degeneracy, it lit in them the fire of independence. As a reward for their service we have opted to give to them the land of their former oppressors in the Cape along with their own ancestral land. As further token of goodwill, the Führer has personally signed off on the deployment of two divisions of good German soldiers to garrison these regions against native and South African terrorists looking to trouble their new masters. To a long and happy friendship with the Boers!"
 GER_GOR_first_among_equals_in_afrika:0 "First Among Equals In Afrika"
 GER_GOR_first_among_equals_in_afrika_desc:0 "While our friends the Boers and our sons in the Reichskommissariat may have shouldered the brunt of battle, it is important for them to remember that they would not be in a position to even be in Africa were it not for the far-sighted policies of the Fatherland that established the colonial outposts of civilization in the depths of such a savage continent. It seems only fair to us in Germania therefore that we reap the harvest that we sewed at the end of the last war. So if we skim some cream off the top, there's nothing unfair or wrong about it at all. It should merely be thought of as a finder's fee for setting our glorious triumph in motion."
 GER_GOR_pretorian_triumph:0 "Pretorian Triumph"
 GER_GOR_pretorian_triumph_desc:0 "The triumph of National Socialism in the African continent calls for a grand parade the likes of which has never been seen in that untamed land. The victorious and battle hardened Reichskommissariat and Boer forces deserve their chance in the spotlight, their faces and arms broadcast to every household in the Reich to watch with awe and pride; Doctor Goebbels himself could not script a better propaganda victory.\n\nAt the same time this display will be motivating our people back home, it will also serve to rub the noses of the OFN dogs in their failure, destroying their citizens' faith in their weak and ineffective leaders. Hopefully it will cause enough resentment to occupy them for the time being and keep them from further interfering with our rightful sphere of influence."
 GER_GOR_beat_out_bush_fires:0 "Beat Out The Bush Fires"
 GER_GOR_beat_out_bush_fires_desc:0 "Despite our total and utter victory it seems that certain nusiasances have determined themselves to continue to act as a thorn in our side as long as they can. Natives, former South African military units, even OFN stay behind partisans have all been harassing our supply lines and outposts in the weeks following our triumph. We cannot allow this, to do so would be to embarrass ourselves on the world stage. What kind of power is unable to control its own territory? If these fools wish to be dragged out kicking and screaming then so be it. The Führer has given Reichskommissar Hüttig full leeway to eliminate these stains in any manner he sees fit with as much of our stockpiles as he might require."
 GER_GOR_the_afrikareich:0 "The Afrikareich"
 GER_GOR_the_afrikareich_desc:0 "The ultimate culmination of our victory in South Africa is at hand! With the entire continent essentially secured against future OFN incursions, we can begin the process of reintegrating the Schild into the Pakt. While having our African colonies back is already a great triumph, it is compounded by the addition of our new Boer allies who will be worthy inheritors of the southern tip of the Dark Continent. All of this was, of course, thanks to the genius statecraft of the Führer. His inspiring vision and passionate devotion to the German people has made the revitalization of the Reich a reality even so soon after the Civil War."
 GER_GOR_stalemate_in_afrika:0 "Stalemate In Afrika"
 GER_GOR_stalemate_in_afrika_desc:0 "The war in South Africa has ended with a whimper and not a bang. Both the South Africans and the Reichskommissarriats have been forced to sign a ceasefire that will likely remain in place for the time being. While not a disastrous defeat, it is also not the overwhelming victory which we had been hoping for. Still, the German foothold in Afrika remains, if somewhat battered and bloody. The bruising of South Africa also makes an attack by the OFN unlikely in the near future, which is a small blessing.\n\nThe greatest problem is how to deal with the question of blame. The people were promised a victory, and a victory they have not received. We must think towards plactating them and beginning to cut our losses in the Dark Continent."
 GER_GOR_find_someone_to_blame:0 "Find Someone To Blame"
 GER_GOR_find_someone_to_blame_desc:0 "The embarrassing stalemate in Afrika has forced us to scramble to find someone to take the blame. Luckily, the Führer is an old hand at this sort of game of intrigue as much as Bormann ever was. The only question is who will play the part of Röhm, the stupid bastard who never saw what was coming until it was upon him and there was nowhere to run. Things don't seem to require such drastic action as in '34 of course, but perhaps some security preparations should be made, just in case the recipient of our schemes takes it a little too personally..."
 GER_GOR_speidels_fault:0 "It's Speidel's Fault!"
 GER_GOR_speidels_fault_desc:0 "There's no easy way to say it, but the militarists of Schörner's clique want Speidel to be the fall man for our South African boondoggle. It's true that Field Marshall Speidel was on the ground coordinating our efforts with those of the Reichskommissariats but any rational observer would be unable to fault him for the stagnation war effort. But this has never been about rationality has it? Schörner despises Speidel, and whether this demand is moved out of personal vindication or genuine scheming or some combination of the two is beyond even the Führer at this point. Whichever the truth is, the fact remains that Schörner wants Speidel tarnished. Complying would alienate a potentially needed ally, but to refuse the militarists so early into his regime seems dangerous."
 GER_GOR_huttigs_fault:0 "It's Hüttig's Fault!"
 GER_GOR_huttigs_fault_desc:0 "The blame for the middling results in South Africa lies squarely at the feet of Ostafrikan Reichskommissar Hans Hüttig. A known associate of Himmler, Hüttig's loyalties have always been questioned by those loyal to the Reich, but the outbreak of the Civil War prevented action from being taken before it was too late. Unfortunately due to the machinations of the traitors, Hüttig managed to stay in his position long enough to botch the war effort against the OFN. No doubt this was part of Himmler's plan all along.\n\nLuckily for us we are so far out of Hüttig's reach and his strength is so sapped that we can destroy his image at home and he will have no way to retaliate, supposing he is even able to learn about what we've said. The uptight bastard is simply the perfect scapegoat for everyone involved."
 GER_GOR_leave_the_rks_to_it:0 "Leave The RKs To It"
 GER_GOR_leave_the_rks_to_it_desc:0 "The recent failure to secure full domination in Afrika has us rethinking our priorities somewhat. We had planned on fully supporting the manpower-intensive effort to police any new territories the RKs might have managed to pull from South Africa, but it more and more seems like a waste of resources. For once, Schörner and Speidel agree on something: that our men would be better used elsewhere. Speidel has pointed out that reclaiming the Reich will take every available soldier and Schörner's designs on the rest of Europe will require even more than that. The Führer has notified Reichskommissar Hüttig that our forces will soon begin to pull out of his territory."
 GER_GOR_wind_down_wehrmacht_involvement:0 "Wind Down Wehrmacht Involvement"
 GER_GOR_wind_down_wehrmacht_involvement_desc:0 "With the chance for a possible OFN surprise attack having effectively passed the OKW has ramped up its calls for the removal of all Wehrmacht forces on the African continent. Puttkamer, Steinhoff, Speidel, and Schörner have all submitted recommendations enumerating their reasons. We may never again see them all in unison. The fact that they are each on board with this withdrawal means that we have no real choice. The Reichskommissars may groan and curse us, but they simply aren't worth our time anymore."
 GER_GOR_save_face_publicly:0 "Save Face Publicly"
 GER_GOR_save_face_publicly_desc:0 "Now that we have arranged for a suitable fall man for the failure to secure a triumph in South Africa, we must move quickly to make sure the Führer is not caught up in any of the blame. A public appearance in which Göring can use his popularity and personal charm to his advantage is just what we need to reorient the populace towards a victorious future. The Führer was always a good performer, perhaps not as good as Hitler was, but certainly better than the others who thought themselves worthy of Adolf's throne."
 GER_GOR_the_schild_broken:0 "The Schild Broken"
 GER_GOR_the_schild_broken_desc:0 "Our South African adventure has ended in utter disaster! To think, the might of the Reich being driven entirely of the continent! This is unacceptable and unbearable. We must quickly move to handle the fallout or there will be Hell to pay, both strategically and publicly. We have two main objectives now. First: evacuate as many assets both material and personnel as possible before the OFN forces sweep through and second: find a scapegoat. The public was expecting a victory and they have been given an utter defeat. To prevent popular anger, we must offer up a sacrifice. This is a grim chapter in the history of the Reich, but we shall overcome it as we overcame the tumult of the 50's and rise to even greater heights!"
 GER_GOR_shift_the_blame:0 "Shift The Blame"
 GER_GOR_shift_the_blame_desc:0 "Someone's going to need to face the music for the disaster in Afrika, and it won't be the Führer. What a fiasco! Our chance to re-assert German superiority so soon after the world had written us off during the Civil War came and we have lost everything on the table to the OFN dogs. The most natural choice would be to push the blame onto someone who was directly involved in the ground operations, but that could potentially carry problems if we choose the wrong commander to blame. On the other hand, we could go for the much safer option of blaming Himmler and Burgundy, which would be acceptable to just about everyone, but at the same time carry no real benefits for us as we have no real way to enforce our condemnation."
 GER_GOR_blame_huttig:0 "Blame Hüttig!"
 GER_GOR_blame_huttig_desc:0 "That damned Hüttig! Of course it is his fault that the Schild has collapsed! The bastard was always an incompetent, and his sympathies were clearly with Himmler even if he could not express so publicly. He may have even been purposely mismanaging the war on behalf of his master in Nord-Paris. Regardless of his reasons, Hüttig is clearly the most culpable. He is also the easiest to throw under the bus for this disaster. Somehow, we did not provide the transport, the man has had the nerve to come crawling back to the Reich. He will find just how the high the price of his incompetence will be."
 GER_GOR_blame_speidel:0 "Blame Speidel!"
 GER_GOR_blame_speidel_desc:0 "There's no easy way to say it, but the militarists of Schörner's clique want Speidel to be the fall man for our South African boondoggle. It's true that Field Marshall Speidel was on the ground coordinating our efforts with those of the Reichskommissariats but any rational observer would be unable to fault him for the stagnation war effort. But this has never been about rationality has it? Schörner despises Speidel, and whether this demand is moved out of personal vindication or genuine scheming or some combination of the two is beyond even the Führer at this point. Whichever the truth is, the fact remains that Schörner wants Speidel tarnished. Complying would alienate a potentially needed ally, but to refuse the militarists so early into his regime seems dangerous."
 GER_GOR_blame_burgundy:0 "Blame Burgundy!"
 GER_GOR_blame_burgundy_desc:0 "The obvious culprit for the failure of the Schild while we were preoccupied with the Civil War is Burgundy. The madman Himmler has always had nothing less than the failure of the Reich as his one goal. What Adolf ever saw in such a rat is beyond our understanding, but it seems clear that it would have better had he been put down the second he attempted his little putsch during the West Russian War. Of course, there is little we can do about it, practically speaking, as we do not fully know Burgundy's nuclear strike capabilities, and thus a full assault would be unwise in the extreme. Still, we can look into other ways of disrupting this rogue state."
 GER_GOR_evacuate_the_loyalists:0 "Evacuate The Loyalists"
 GER_GOR_evacuate_the_loyalists_desc:0 "The remaining Schild personnel has become stranded in a hostile land, with enemies quickly closing in from all sides. We have a duty to save them, if we can. They are German men and we do not abandon our men to the slaves of capitalists and Jews.\n\nThat is the official explanation anyways.\n\nThe hard truth is that if we hope to achieve victory in the massive wars being dreamed of by Schörner and Remer, we will need as many experienced men as we can lay our hands on. They will be invaluable in preparing our military, largely untested since the West Russian War, in the realities of modern conflict."
 GER_GOR_ensure_muller_and_schnecks_safety:0 "Ensure Müller's Safety"
 GER_GOR_ensure_muller_and_schnecks_safety_desc:0 "Of the three Afrikan Reichskommissars, Siegfried Müller was always the most amicable to Göring's sensibilities. The man had none of the ennui of Schenck or the stiffness of Hüttig, and was always skilled at handling the German press and public. The Afrikan front may be lost but the man might still be saved provided we act quickly. Our best special forces will be deployed to infiltrate the rapidly dissolving German controlled territory where Müller has fled to and exfiltrate him before the OFN can capture him. Speidel and Schörner were content to let the man fend more himself but Göring has been resolute on this. He knows that Müller's natural lack of ambition and the debt that he will owe the Führer will combine to make him a very useful tool indeed. "
 GER_GOR_huttigs_werewolves:0 "Hüttig's Werewolves"
 GER_GOR_huttigs_werewolves_tooltips:0 "§YWe will deploy§! §eHüttig's§! §Ystay-behind §e\"Werewolves\"§! §Yto make the OFN occupation of our African colonies as painful as possible§!"
 GER_GOR_huttigs_werewolves_desc:0 "Whatever else his deficiencies, Reichskommissar Hüttig is adept at asymmetrical strategy. Before the situation in Afrika fully collapsed, the wiley bastard managed to deploy dozens of SS \"Werewolf\" units to prepare for stay-behind operations against the incoming OFN pacification troops. These men are fanatics, and SS fanatics to boot, but given their potential use the Führer has agreed to ignore the bans on the SS for now. After all, these men are not technically part of the Reich anyways, making it all the better for us.\n\nWhile the Werewolves have been given what effectively is a suicide mission, Hüttig assures us they will carry out any operations against OFN and native forces we give them. Perhaps the SS is good for something after all?"
 GER_GOR_scorched_earth_on_a_grand_scale:0 "Scorched Earth On A Grand Scale"
 GER_GOR_scorched_earth_on_a_grand_scale_desc:0 "The OFN has won Afrika, but so what? Do they think we will leave it to them intact? Of course not! They can have the continent - as a heap of ash. Our stay behind units will carry our specific destructions of critical infrastructure, roads, government buildings, and the like. At the same time, we will use what bombers and airfields we still control in the region to rain down Hell indiscriminately. Let them know that the price of victory is steep indeed. Orders to remaining Wehrmacht forces will be to hold the airfields at all costs until the planes can no longer make the runs. The fire of our bitter loss will scorch their tongues as they attempt to savor their triumph."
 GER_GOR_huttigs_betrayal:0 "Hüttig's Betrayal"
 GER_GOR_huttigs_betrayal_desc:0 "A devastating blow! That such a traitor was under our very noses this entire time is maddening. Hüttig has killed or driven to ground the loyal Reichskommissars and any still within his grasp are either his allies or too scared to go against him. After such a brief window of glorious victory, we have once more been confronted with the sting of defeat. We have no time to sit in our misery however! A crisis of this magnitude must be met with all the energy of the Führer and the nation. We shall seek to assess and stabilize our position and once that has been achieved we will begin the dirty work of punishing our little rogue Reichskommissar."
 GER_GOR_fighting_withdrawal:0 "A Fighting Withdrawal"
 GER_GOR_fighting_withdrawal_tooltip:0 "§YWe will begin to withdraw the forces we sent to reinforce our colonies from the continent§!"
 GER_GOR_fighting_withdrawal_desc:0 "Hüttig may claim the continent, but loyal men of the Wehrmacht, both from the colonial garrisons and our own advisory forces are still active in the region. We will make the traitor pay and retrieve our men at the same time through a fighting withdrawal. No doubt the usurper of Afrika has already planned to have his own loyalists round up those who still fight for their fatherland. Our soldiers will be ready for them. Once the initial attempts have been swatted down we will coordinate the disparate groups to converge on ports where they can hijack transportation. At the same time, any airstrips still under own control will be used to cover the retreat and bomb any advancing columns for as long as can be arranged. This will not be an easy fight, but will we have our victory all the same."
 GER_GOR_leave_him_nothing:0 "Leave Him Nothing"
 GER_GOR_leave_him_nothing_desc:0 "If that damned traitor Hüttig believes he will have any access to the resources we deployed to the continent to aid the rightful Reichskommissars, then he is further gone than we initially believed. Of course he will get none of it, we will make absolutely certain. Weapons, ammunition, logistical supplies, even pencils and paper for reporting will all be either carried off on the earliest plane, or, should that option be lost, blown up for all we care. The Abwher of course was always doing its due diligence, and Gehlen has admitted to the Führer that as a precaution much of the shipments we sent over were secretly wired with remote explosives. The Führer is willing to overlook Gehlen's lack of transparency on this matter in recognition of his prescient thinking."
 GER_GOR_save_as_many_loyalists_as_possible:0 "Save As Many Loyalists As Possible"
 GER_GOR_save_as_many_loyalists_as_possible_desc:0 "Herr Schenck may have been murdered by the treacherous snake Hüttig but the other Afrikan Reichskommissar can still be saved. Our sources tell us he has gone to ground however, which means we will need to find him quickly before either Hüttig or the OFN do. Our investigations into his commanders have revealed that von Thoma is dead and Rolf Steiner has fully disappeared into the Congo, too far off the grid to be saved. Gehlen has begun a massive campaign to save the hunter and return him to his Fatherland. A potent propaganda tool and unambitious stooge in his own right, the Führer has plans for the Reichskommissar of Zentralafrika."
 GER_GOR_blockade_afrika:0 "Blockade Afrika"
 GER_GOR_blockade_afrika_desc:0 "If the traitor Hüttig wishes to have his little kingdom in Afrika rivaling our empire then let us show him what a proper blockade looks like. His state will not survive however without his complete surrender, we will make quite sure of that. Using the loyal ships and aircraft that have fled the continent to rejoin the Reich we will establish a cordon around our former colonies. Nothing will enter or leave the fiefdom without our approval. We will even extend our searches to Iberian and Italian vessels and if their governments protest, too bad. We will not have an affront to the very people of Germany survive thanks to the incompetence or scheming of our former allies."
 GER_GOR_undermine_the_traitor:0 "Undermine The Traitor"
 GER_GOR_undermine_the_traitor_desc:0 "While all of the bureaucrats and officials who have survived Hüttig's betrayal have bent their knee to the new mad king of Afrika, this by no means indicates any sort of love for the man. Indeed, his erratic behavior and growing instability means that any one of these officials might soon find their head on the chopping block one of these days. Naturally, they will look for any attempt to undermine their new master when they think they can get away with it. We will provide that \"when\" and even throw in a helping dose of possible \"hows\" to destroy the Reichsstaat from the inside. Herr Gehlen is a devious fox indeed, and no doubt has dozens of schemes on his mind."
 GER_GOR_undermine_the_traitor_tooltip:0 "§YWhile we wait for invasion plans to be created, we can still hope in the meantime to pull it down upon itself§!"
 GER_GOR_cut_our_loses:0 "Steal Their Resources"
 GER_GOR_cut_our_loses_desc:0 "While the situation seems hopeless, our best men have already been finding solutions. Hüttigs decaying state is heavily reliant on its abundent supply of rare resources, mainly being extracted through our equipment and sites, which costed us millions of Reichsmark and thousands of slaves. While it sounds bad, our men have found out that since we made the sites, we still have the info on them. We know exactly how much it was producing, where it was, and most importantly, how much money it could make us. We shall send in our best men to extract as much of the resources as they can, before shutting them down and getting out of there. And even if it isnt worth the effort, the look on that sick bastards face when he hears the news will make it all worth it."
 GER_GOR_the_lost_continent:0 "The Lost Continent"
 GER_GOR_the_lost_continent_desc:0 "For all our effort, for all of our blood and sweat, it seems we have been denied an entire continent thanks to the madness of just one man. For all of their posturing as the shield against our advance, the OFN has never come close to dealing us such a blow as Hüttig has managed in just a few weeks. To think that we, lords of Eurasia and rightful masters of the world could face such a setback, and from one of our own, is disturbing to say the least.\n\nBut enough sulking! Regret and sorrow did not win us our empire and it will not reclaim it for us. We have bigger concerns than the kingdom of some lunatic. Let Hüttig's empire shatter to the winds while we resume our hegemony across our own continents. By the time we return once more to Afrika, it will be as unstoppable conquerors once more."
 GGR_a_new_opportunity: "A New Opportunity"
 GGR_a_new_opportunity_desc: "That bastard Hüttig's betrayal has gone on long enough. The Führer has decreed that our nuclear arsenal is to be used to turn both the traitorous Reichskommissar and his capital into nothing but ash and shadows. This decision has not been taken lightly, and it is with a heavy heart that things have come to this. However the ultimate betrayal deserves an ultimate response, so once more we must steel our hearts and do what must be done for the Reich. For not since the Second World War have such weapons been used, and fate willing, they never will again..."
 GGR_develop_mauritius_and_reunion: "Develop Mauritius and Reunion"
 GGR_develop_mauritius_and_reunion_desc: "Our new course in Africa dictates the need to deploy a number of nuclear weapons in striking distance of the continent. As such, Heer engineers and surveyors have identified the twin islands of Mauritius and Reunion as prime candidates for hosting both a Heer garrison and the silos needed to strike at Hüttig and his traitorous ilk, it is also noted it may prove a useful asset in the future for dominance in the Indian Ocean, primarily against the Japanese. Regardless, it will take some time, but the Reich has much experience in taming and repurposing foreign lands, this will be no different."
 GGR_prepare_von_hassel: "Prepare von Hassel"
 GGR_prepare_von_hassel_desc: "Destroying Hüttig remains our primary objective in Africa; however, the Reich's coffers are not bottomless, and Africa is a vast and rich continent. Simply destroying Hüttig won’t suffice. We need to gain something from this to counteract the resources we are expending on this traitor.\n\nWe have an asset in Africa—Kai-Uwe von Hassel—whom we could utilize not only to prepare strongholds within Africa but also to extract as much value out of the area as possible before we slash and burn it. It’s about time he earned the trust we so graciously placed in him before."
 GGR_a_mushroom_cloud_over_bouhlerstadt: "A Mushroom Cloud Over Bouhlerstadt"
 GGR_a_mushroom_cloud_over_bouhlerstadt_desc: "This is it gentlemen, the moment we have all been waiting for. The South African War, the Bürgerkrieg, our reconstruction, all of it has led to this day, this moment. We stand here united in our purpose, in our service to the Reich and all Aryans, for this day the Reich strikes a blow against the greatest traitor of our time, Hans Hüttig.\n\nThe betrayal of that vermin will be put to rest, the injustice done to all Aryans who fell in defense of our African holds will be avenged, the souls of the dead cry out for vengeance even louder than we do, who are we to deny them this?! He thinks he is strong, that he's untouchable, but today we will bring the light of truth to his dark continent at the point of a missile! We will burn away his lies, his betrayal, even his very existence! Until nothing remains but the smoldering ruins of the empire of lies he has built around him! This is for every mother whose son never returned from this cursed continent, this is for those still trapped within Hüttig's cursed regime and beg for release, this is for the Führer, whose trust was betrayed on the precipice of victory!\n\nLaunch the missile, vaporize the bastard!"
 GGR_mauritius_and_reunion_developed: "We have prepared §YMauritius§! and §YReunion§! for our plans"
 WORLD_REICH.308.t: "[Get_newspaper_header]Nuclear Explosion in Bouhlerstadt"
 WORLD_REICH.308.desc: "The world is in shock, as today marks the second time in human history an atomic bomb has been used against an enemy power. Governments of both the United States and Japan are in an uproar, and demanding answers from the Greater German Reich, as word of a nuclear blast in the depths of the Mozambique are being reported. The Führer of the Greater German Reich, Hermann Göring responded to all demands by saying: \"We are cleaning up our mess, plain and simple.\"\n\nThis answer has done little to calm the global community, especially given the now rapidly deteriorating situation in Sub-Saharan Africa. The sudden collapse of the Hüttig regime has led to numerous warlords and independence groups rising up against the remnants of his government and the German colonial settlers, leading to perhaps the greatest humanitarian disaster in human history. However due to the nature of the situation, the world can only watch and pray for those trapped within the now collapsing continent.\n"
 WORLD_REICH.308.a: "We're just clearing up our backyard, don't worry!"
 WORLD_REICH.308.b: "What do these madmen think they're doing?"
 WORLD_REICH.308.c: "Wait wha-"
 goering_huttig.1.t: "The Ultimate Punishment"
 goering_huttig.1.d: "Göring sat in his office, doing his routine paperwork with his secretary, as he glanced at the map of the world that was hanging on the wall. His attention was drawn to Africa, specifically its central part. A dark spot marked its place: Hüttig's Reichsstaat.\n\nNow that the Reich had completely given up on direct attempts to reclaim the continent, the Führer could only dream about punishing Hüttig.\n\nGöring tiredly exhaled, put his pen on the desk, and leaned back in his chair. He tilted his head back and began considering all the methods and possibilities to punish Hüttig.\n\nFiring squad, hanging, torture? As he thought back to his usual options, he realized they all had one major issue: they required the victim to be taken alive, and Hüttig was no ordinary target. He was an SS fanatic and paranoid. There could be no guarantee such a bastard could be taken alive. This left him with more direct actions, namely, assassination. Sniper attacks, car bombs, and even targeted special forces raids all crossed his mind, but all would require a wide resistance network inside of Hüttig's Reichsstaat, which von Hassel's Cabal couldn't provide.\n\nHe tapped his fingers on the armrest, looking around the office in search of a solution. Suddenly, a document on his table drew his attention. It was a basic report on the status of the Reich's nuclear silos.\n\nOf course! A nuclear warhead. A trustworthy method of getting rid of someone, taking all his henchmen with him. This idea lifted Göring's mood until he thought about the consequences. The OFN and Japan's Sphere of Exploitation would definitely not be pleased with that. And not just them. Besides, Bouhlerstadt was a long-developed colonial city, where many profits lay and innocent Aryans still lived. But what was the alternative anyway? All would still be lost either to African partisans or Hüttig's madness.\n\n\"Did something happen, my Führer?\" the Führer's secretary finally asked.\n\n\"Hm?\" The secretary's question brought Göring back to reality. \"Ah, no, everything's fine,\" the Führer calmed his secretary. Göring pointed at him and snapped his fingers. \"Organize a meeting with my deputy, Stuckart, and my Field Marshals – Schörner and Speidel. We have a traitor to discuss.\"\n\nHis secretary raised his eyebrows in surprise for a moment."
 goering_huttig.1.a: "\"Hm. Of course, my Führer. It will be done.\""
 goering_huttig.2.t: "A Risk, a Reward, And an Atom"
 goering_huttig.2.d: "Two Field Marshals, Schörner and Speidel, entered the Führer's office. As they saluted their Führer, they noticed Wilhelm Stuckart sitting in a chair near Göring's desk, leaning on his right arm and exhaustedly staring at the floor.\n\n\"Ah, gentlemen, you've finally arrived!\" Göring greeted both Field Marshals.\n\n\"Yes, my Führer,\" began Schörner. \"Your secretary told us that you wanted to see us. That it was connected with some kind of \"traitor.\"\"\n\n\"Yes, yes. I invited you here to discuss our further plan of action regarding that bastard Hüttig.\"\n\nThe Field Marshals exchanged glances.\n\n\"I thought we had already closed this topic,\" noted Speidel.\n\n\"Well, yes, but recently an interesting idea came to my mind...\" Göring started.\n\nStuckart closed his eyes and exhaled.\n\n\"How about we... conduct a nuclear strike on Bouhlerstadt?\" Göring carefully asked.\n\nSpeidel was shocked by this idea. Schörner, on the other hand, was shocked too, but not because of the idea itself, but because it was Göring, of all people, who proposed it.\n\n\"With all due respect, that is a horrible idea, my Führer,\" Speidel finally assessed.\n\nStuckart looked at Speidel. \"That's what I told him,\" Speidel continued. \"A nuclear strike on such a city would require a lot of preparations. Besides, no country will be pleased with Germany throwing around their weapons of mass destruction! And what about-\"\n\n\"Why do we even care about their opinion?\" Schörner interrupted Speidel. \"This would be a perfect demonstration of Germany's might! We'll show the entire world that Germany doesn't forgive betrayal!\"\n\n\"Yes, but don't you think it's too much?\" Speidel objected."
 goering_huttig.2.a: "Göring tried to convince Speidel..."
 goering_huttig.3.t: "A Risk, a Reward, And an Atom"
 goering_huttig.3.d: "Göring tried to convince Speidel. \"Hans... I understand the risks and costs of that decision. The blow will be very destructive, yes. But what is the alternative? All our efforts will be swept away anyway, either by mad Africans or mad Hüttig. That way, we will at least respond to this betrayal!\"\n\nSuddenly, Stuckart intervened, still leaning on his right hand. \"But my Führer, we already have von Hassel's cabal. Wouldn't it be wiser to give them a boost and let them get rid of Hüttig?\"\n\n\"That also is part of my plan,\" Göring responded. \"You see, I plan to boost the Cabal and tell them to focus their forces in Central Africa. That way, when the strike is performed, von Hassel's men will take over the Congo Basin for us.\"\n\nStuckart looked back down at the floor. \"That sounds more reasonable, I guess...\"\n\nGöring was cheered by the fact he was able to convince his right hand. But those words seemed to not affect Speidel.\n\n\"I still highly recommend NOT performing this operation. We will still have the opportunity to return our colonies in Africa, my Führer. The Cabal is still operating. I insist on letting them collapse Hüttig's Reichsstaat without our direct intervention.\" Speidel's tone became more insistent.\n\n\"And I highly recommend PERFORMING this operation!\" Schörner perked up. \"All traitors must receive their due!\"\n\nStuckart gave his word last: \"I just don't think it's that worth it, Hermann.\"\n\nGöring slowly exhaled and thoughtfully looked at his subordinates. At last, he finally made a decision"
 goering_huttig.3.a: "All traitors must recieve their punishment. Ready the nukes."
 goering_huttig.3.b: "Alright, I guess it's not worth it after all."
 goering_huttig.4.t: "Hell of a Paradise"
 goering_huttig.4.d: "Johann stood at the edge of his boat, alongside several other engineers of the Reich. Their mission had been simple and straightforward. To prepare two islands for Lebensraum, and more importantly, to militarize them for the stationing of strategic nuclear weapons. During the journey he had read the dossier he was given by his gruppenführer, and had been expecting some inhospitable hellhole, like Madagascar, or perhaps more similar to the Congo. Given they had to navigate around the aptly named \"Greater African Reichstaat\" they had to fight off pirates who tried to board them from what was previously friendly territory in Dar-Es-Salaam. However, as they cleared the East African waters and the boat approached the island, they saw what looked like a variable paradise. Beautiful scenic beaches punctuated by atolls of lush vibrant green islands dotting the bays and coastline.\n\nHe had thought how this land in another time would have been a glorious part of Lebensraum, how the picturesque beauty of the land would be maintained so Aryans and their children could frolic these beaches, and jungles as an exotic getaway, or retreat. Yet, that was not reality, the Judeo-Masonic united states, and barbaric Japanese still threatened Aryans at every turn. Despite the Heer's continued success in Europe, the lands beyond were still rife with hostile nations seeking to undermine what was rightfully theirs. That is not to mention how close they were to the mad regime of the traitor, Hans Hüttig. As Johann sighed he thought as to how all this would have to come to naught in the face of historic necessity. The struggle continues against the enemies of the Reich, and these lands would be no exception.\n\nThese beautiful beaches would give way to mass docks, the jungle interior cut down and replaced by gray concrete structures. The unspoiled dirt and soil, dug up to be replaced by massive silos for nuclear weapons that could bring about Ragnarok at a moment's notice. The march of the global conflict reached even this remote, untouched land."
 goering_huttig.4.a: "Paradise, a victim of hatred."
 goering_huttig.5.t: "Gambit Preparation"
 goering_huttig.5.d: "This time Kai-Uwe von Hassel decided to play safe and arrived at the meeting point at exactly the agreed-upon time. Seconds later, he noticed a person just a couple of meters away from him heading in his direction. Was it the Abwehr man? There was only one way to find out:\n\n\"Good evening, Herr. How's the weather today?\" Kai-Uwe asked an anonymous person.\n\n\"It's sunny, with an expectation of a mushroom rain.\" The Abwehr agent confirmed his affiliation. \"I'm here with orders from the Führer himself. Germany prepares a response. Bouhlerstadt will face a nuclear strike. Be ready.\"\n\n\"A nuclear strike?\" Von Hassel asked quietly, yet shocked. Suddenly, he understood the weird choice of a confirmation phrase.\n\n\"Yes. You are ordered to focus on holding as many Congolese territories as possible and evacuating all valuable assets into held territory. If any of those tasks require more supplies - they will be granted. Is that clear?\" The Abwehr agent asked von Hassel.\n\n\"Y-yes.\" Von Hassel answered, still shocked by the news. \"How much time do we have?\"\n\n\"Not known for sure, but you have at least two weeks. The preparations are in full swing. You will get a signal when the operation will begin.\"\n\n\"Understood.\"\n\n\"Have a nice evening, Herr.\" The Abwehr agent bid farewell and headed from the plotter.\n\nVon Hassel also headed from the meeting place. Many thoughts passed through his head. A nuclear strike? Was there really no other way to get rid of Hüttig? And if there really wasn't, is a nuclear strike worth it? Kai-Uwe shook his head. There was no time to doubt Führer's decision. He needed to prepare his men for the inevitable."
 goering_huttig.5.a: "We'll knock the carpet out from under Hüttig's feet."
 goering_huttig.6.t: "The Final Launch"
 goering_huttig.6.d: "Göring sat alongside Schörner deep within the earth, inside the missile command center on Reunion island. All around him were whirling computers, and vacuum tubes connecting the various machines together. While Schörner admired the technology and industry it took to make such a marvel of engineering in so little time, the Führer could only think back to the scenic beaches they saw on their approach. In a way, he had hoped they'd be here for a bit longer, and perhaps thought that after all this Hüttig business was done, he could have the engineers construct some facilities for recreation, and a few restauraunts. The beaches he saw and the tropical beauty they could see from their ship were outstanding, however strategic necessity demanded that this island be used for other purposes. On parts of the island, one could see the march of the Reich on full display, as pristine beaches give way to large docks and wharfs, and forests of palm trees are cut down and replaced by military barracks, radar stations and warehouses.\n\nGoring thought of what could have been before his arrival, probably some tropical paradise, equivalent to the ones he had heard about in the Carribeans, perhaps the Reich could have its own resorts here, but that bastard Hüttig stopped all that. As the focus of his mind changed from the island to Hüttig, reality revealed itself once more with the heat and noise of computers all around, as men rushed to their stations in anticipation of this auspicious event.\n\n\"My Führer, the missile has been plotted, the warhead armed and the systems checked, all that is required now is for you to do the honors.\" Schörner said, with a wide grin, as he motioned to a large red button at the central console.\n\nGoring strode up to the button as it was his moment of triumph, all around him there were cheers from the silo crew and officers, as they joked and laughed like Hyenas. As Göring stood before the launch button, he felt a strange unease flow over him. He had a moment of clarity, he thought to all the German colonists still in Afrika, those specifically still in Bouhlerstadt, he thought of the damage done during the burgerkrieg and the shame of Aryan fighting Aryan. For a moment, he began to think that perhaps this was not the right answer, that perhaps he had been far too rash. Yet, just as he was about to think of a way out of this, he remembered Hüttig, he remember how that bastard took the Reichs largest colony away, and how he claimed superiority over the Führer himself, after all Göring did to save them in the South African War. For that, and that alone, there could be no recompense, there could be no sacrifice too great to put that stupid bastard into the ground. If these people must die to rid the Reich of this rat, so be it."
 goering_huttig.6.a: "And so the button was pushed."
 goering_huttig.7.t: "Checkmate"
 goering_huttig.7.d: "Hüttig sat at his desk, hands clasped together staring at the door. The clock on his wall clicked with each second as he sat there motionlessly. Hüttig sat in relative silence, reflecting on all his work, of his victory over the twin traitors of Schenck and Müller, though he rued the fact Müller managed to escape. He thought to the Reich, how they had become soft, and weak, how despite their efforts and those of the natives, the Reich he had built had not fallen, but now like petulant children they are flipping the table.\n\nThe Only Nazi in Africa had received word on increased Kriegsmarine traffic passing by the East African coast. He had dispatched what remains of his own flotilla to harass them, to no avail, and that was only the beginning of his latest woes. His ships were first lacking fuel as shipments and convoys from Angola dried up. Then his shells and bullets depleted as both the mines and the factories slowed to a halt or went dark entirely. Then the men themselves disappeared, steady streams towards Kongo, towards Leopoldville, while too many of his remaining men were tied down handling native uprisings and OFN stay-behinds to act on it. The play was clearly threatening to unravel now.\n\nHe had known of a possible plot in the Reich to dispose of him, but he had wondered what or how they would do it. That was until he received word of a missile launch from somewhere in the Indian Ocean, with said missile moving at incredible speed toward Bouhlerstadt. Pathetic. What could one single rocket do, sink a slave barracks? Hüttig refused to share the information with anyone. It would show weakness at a time where they needed to show strength to their enemy. Civilians would not be evacuated, soldiers were to remain at their post, and for all but Hüttig it was business as usual. His Greater African Reich would finally be able to bloody the nose of the traitors in Europe, and prove the superiority of Spartan-\n\nHüttig's eyes seemingly melted in their sockets as the flash seared his eyes blind in an instant. He heard the shockwave as he collapsed in pain, uttering a curse as he clutched at his eyes, but he refused to break now of all times. Soon the ground began to tremble like an earthquake as he thought to himself of the tenets of National Socialism and the Aryan spirit. He tried to rise back up, but it was too late for his dignity now. As he felt the weight of the world lift from him, and nuclear hellfire began to engulf and sprout from his body, he could only mutter one last phrase - the only words that meant anything to him anymore:"
 goering_huttig.7.a: "...H-heil Hitl-"
 goering_huttig.9.t: "Report From Leopoldville"
 goering_huttig.9.desc.good: "FROM: KAI-UWE VON HASSEL, REICHSPROTEKTOR VON KONGO\n\nTO: FÜHRER HERMANN GÖRING\n\nSUBJECT: STATUS OF ZENTRALAFRIKA\n\nThe complete obliteration of Bouhlerstadt has caused the Reichstaat to collapse more quickly and spectacularly than the Anti-Hüttig Cabal could have anticipated, with mixed results for the Reich. While the abject chaos has cut off significant portions of assets that would have required a protracted collapse to extract, the sheer shock and awe of the strike has cowed a good deal of former SS personnel and fence-sitters into joining our cause without a fight, more than compensating any losses.\n\nIn fact, thanks to the combined efforts of our own operatives and generous assistance from the Abwehr, almost every single unit within reach of the Cabal has been turned to our cause through combining the threat of Germania's retribution, promises of amnesty, treating sick and wounded personnel, and monetary bribes. With this unprecedented windfall of fighting men it has proven possible to exceed our own expectations and secure the entirety of the old Reichskommisariat Zentralafrika. Barring disorganised partisan cells in the north, the entire Kongo Basin can be safely assumed as secured.\n\nOf note, however, is the significant alarm the destruction of Bouhlerstadt has caused within the Cabal, with many in both the civilian and military command structures shaken by the decision. Rest assured however that regardless of the fate of the rest of Afrika the Leopoldville Verwaltung remains utterly loyal to the Fatherland, the Führer, and the race.\n\nHeil Göring."
 goering_huttig.9.desc.normal: "FROM: KAI-UWE VON HASSEL, REICHSPROTEKTOR VON KONGO\n\nTO: FÜHRER HERMANN GÖRING\n\nSUBJECT: STATUS OF ZENTRALAFRIKA\n\nThe complete obliteration of Bouhlerstadt has caused the Reichstaat to collapse more quickly and spectacularly than the Anti-Hüttig Cabal could have anticipated, with mixed results for the Reich. While the abject chaos has cut off significant portions of assets that would have required a protracted collapse to extract, the sheer shock and awe of the strike has cowed a good deal of former SS personnel and fence-sitters into joining our cause without a fight, more than compensating any losses.\n\nThanks to this windfall bolstering our strength and the ongoing support of the Abwehr, the Cabal has been able to achieve all objectives set out in our more optimistic territorial and economic estimates. Though the northernmost reaches have been effectively overrun with native partisans forcing a withdrawal, loyal forces largely comprising Müller's SS and sympathetic Belgian remnants have maintained control over both the old Free State and Gabon, and the rest of the former Reichskommisariat can be safely assumed as secured.\n\nOf note, however, is the significant alarm the destruction of Bouhlerstadt has caused within the Cabal, with many in both the civilian and military command structures shaken by the decision. Rest assured however that regardless of the fate of the rest of Afrika the Leopoldville Verwaltung remains utterly loyal to the Fatherland, the Führer, and the race.\n\nHeil Göring."
 goering_huttig.9.desc.will_do: "FROM: KAI-UWE VON HASSEL, REICHSPROTEKTOR VON KONGO\n\nTO: FÜHRER HERMANN GÖRING\n\nSUBJECT: STATUS OF ZENTRALAFRIKA\n\nThe complete obliteration of Bouhlerstadt has caused the Reichstaat to collapse more quickly and spectacularly than the Anti-Hüttig Cabal could have anticipated, with mixed results for the Reich. While the abject chaos has cut off significant portions of assets that would have required a protracted collapse to extract, the sheer shock and awe of the strike has cowed a good deal of former SS personnel and fence-sitters into joining our cause without a fight, more than compensating any losses.\n\nThis windfall in our favour in tandem with Abwehr support has allowed the Cabal to secure much of the Zentralafrikan coastline, at the cost of evacuating the rest of the Kongo and its resources. While unfortunate, the mineral wealth of Katanga and prestige of the Hitlerstadt were deemed secondary to the territorial integrity of the provisional government, and as such we have at least been able to claim a significant buffer zone protecting Leopoldville, at least to the north.\n\nOf note, however, is the significant alarm the destruction of Bouhlerstadt has caused within the Cabal, with many in both the civilian and military command structures shaken by the decision. Rest assured however that regardless of the fate of the rest of Afrika the Leopoldville Verwaltung remains utterly loyal to the Fatherland, the Führer, and the race.\n\nHeil Göring."
 goering_huttig.9.desc.bad: "FROM: KAI-UWE VON HASSEL, REICHSPROTEKTOR VON KONGO\n\nTO: FÜHRER HERMANN GÖRING\n\nSUBJECT: STATUS OF ZENTRALAFRIKA\n\nThe complete obliteration of Bouhlerstadt has caused the Reichstaat to collapse more quickly and spectacularly than the Anti-Hüttig Cabal could have anticipated, with mixed results for the Reich. While the abject chaos has cut off significant portions of assets that would have required a protracted collapse to extract, the sheer shock and awe of the strike has cowed a good deal of former SS personnel and fence-sitters into joining our cause without a fight, more than compensating any losses.\n\nUnfortunately our resources and connections have found themselves spread so thin that nearly all objectives could not be met, our men only able to secure Leopoldville and a relatively small patch of jungle around it as a buffer. Any offensive moves against the nascent statelets on our borders are impossible as all available manpower is tied up holding our few remaining ports in Boma and Cabinda as well as the routes between them and Leopoldville itself. That said, the situation is stable and partisan activity is nominal in controlled territory.\n\nOf note, however, is the significant alarm the destruction of Bouhlerstadt has caused within the Cabal, with many in both the civilian and military command structures shaken by the decision. Rest assured however that regardless of the fate of the rest of Afrika the Leopoldville Verwaltung remains utterly loyal to the Fatherland, the Führer, and the race.\n\nHeil Göring."
 goering_huttig.9.a: "Could've not expected better!"
 goering_huttig.9.b: "Excellent."
 goering_huttig.9.c: "Good enough is good enough."
 goering_huttig.9.d: "Still, better than nothing?.."
 goering_huttig.10.t: "What Is Done in the Dark"
 goering_huttig.10.d: "In a dimly lit room deep within the Volkshalle, a team of Heer engineers meticulously sifted through piles of papers and documents. Among these, they discovered a sealed cache of correspondence addressed to the Reich but never opened. The papers were hurriedly gathered and reported, eventually landing on the desk of Reinhard Gehlen, the head of the Abwehr.\n\nGehlen's eyes narrowed as he read through the papers. The discoveries were shocking, to say the least. The documents contained evidence of treason at the highest levels: Reichskommissar Müller had been clandestinely allowing American companies to exploit the Congo's vast resources, engaging in trade with the enemies of the Reich. Even more astonishing, Reichskommissar Schenk had been covertly supporting independence movements, undermining German control in Africa. Gehlen knew this information was explosive. He gathered the documents and made his way to the Reich Chancellery. The Führer had to be informed immediately.\n\nGöring sat behind an imposing oak desk, the room filled with the weight of historical significance. The Führer looked up as Gehlen entered, his expression one of curiosity mixed with impatience.\n\n\"Reinhard, what is so urgent that it couldn't wait?\" Göring's voice was a low growl, his eyes fixed on the man before him.\n\nGehlen placed the documents on the desk. \"My Führer, we have uncovered something that may interest you, namely about Hüttig's mad ramblings. These documents were meant to be reviewed but never made it to our desk before the Bürgerkrieg. They contain evidence of high treason...\"\n\nGöring's eyebrows shot up in surprise. \"Treason? By whom?\"\n\n\"Reichskommissar Müller and Reichskommissar Schenk,\" Gehlen replied gravely. \"Müller has been allowing American companies to exploit the Congo, trading with them behind our backs. Schenk, on the other hand, has been secretly supporting independence movements in Africa.\"\n\nGöring scoffed at the statement; Schenk had been a former Luftwaffe member, so any thought of treachery he took as a personal offense. As for Müller, he was a celebrated hero of the Reich, appearing on more posters and videos calling for more colonists and explorers to the African continent than any other. Yet, as he looked over the dossier, the evidence was there. Hell, it even had photographic evidence and stolen original files. Evidence of American companies operating in the Congo, against the Reich's orders. There was even evidence of Schenk and his plans to free Angola from the Reich, only interrupted by the South African War. As he read the document further, the evidence mounted against the two former Reichskommissars, and even the Führer struggled to process it.\n\n\"My Führer, we can act on this information and imprison Müller. He still resides in the Reich and has no idea that we now know about his previous dealings,\" Gehlen said, leaning forward to retrieve some of the documents that Göring had finished reading. As he neatly placed them in his briefcase, Göring spoke.\n\n\"No, burn these... no one must know...\" Göring said, turning away from the evidence in disgust.\n\n\"My Führer?\" Gehlen asked, puzzled.\n\n\"This goes to the grave with us both. We've already dropped the bomb on Hüttig, and upturning the legacy of Müller and Schenk alongside possibly lionizing Hüttig would be a fucking disaster,\" Göring said, leaning back in his chair and giving out a big sigh, as he thought of what else had been hidden by Africa all this time."
 goering_huttig.10.a: "How did no one see this?!"
 goering_huttig.11.t: "The Nuking of the Führer's Mailbox"
 goering_huttig.11.d: "\"The following is a joint statement delivered on behalf of Australia, Belgium, Canada, Czechoslovakia, Denmark, Estonia, the Republic of the Faroe Islands, France, Guyana, Haiti, Honduras, Iceland, Latvia, Liberia, Lithuania, Luxembourg, the Netherlands, New Zealand, Norway, Poland, Suriname, the United Kingdom, the United States, Uruguay, Venezuela, the West Indies Federation, Yugoslavia, and all other peace loving peoples of Earth...\"\n\nSuch a long and meaningless preamble. Half of those nations didn't even exist anymore, and the other half wouldn't exist either by the time he was done.\n\n\"...we henceforth call upon all members of the international community, including the German Reich, to take appropriate measures in light of this atrocity...\"\n\nWhat the hell was that even supposed to mean? Was he supposed to condemn himself? Place sanctions on his own economy? And for what, giving a traitor all that he was owed?\n\n\"...continues to display shameless contempt for the ideals upheld by the Greater East Asia Co-Prosperity Sphere, and thus has earned no quarter in regards to future...\"\n\nThat one got a laugh out of him. What ideals? As if the Japs wouldn't have dropped the bomb on Beijing the very second their slaves got a bit too uppity. No, they were just upset that he had beaten them to the punch and taken all the shock factor out of it, that's all.\n\n\"...condemns in the strongest possible terms the senseless slaughter of thousands of innocents in the name of enacting vengeance upon a single criminal, who was not permitted a fair and unbiased trial as mandated under international law...\"\nAll of those messages were little more than bad jokes drawn out for far too long, but that last one was what got Göring fuming more than anything else. The American bastards were heaving sympathy on Hüttig-Hüttig, of all people!-simply because they still had some bad memories about Pearl Harbour and thus some sympathy for anyone who was unlucky enough to receive the same treatment. It was outright lunacy to pretend like he was anywhere near as bad as that monster. Hell, they should have been thanking him for ending his little passion project to Himmler so soon, and in the clearest possible terms! But no, instead, they had all gotten so very hung up, all because of the specific method he had chosen to do it. Madness.\n\n\"...As you can see, my Führer...\" Artur Axmann spoke up with a small cough, having noticed Goring's rage grow with every word he had read from each and every letter that now sat on his desk, all of which were condemnations from alliances, or individual nations, or even warlords dressing up as real leaders, all decrying him to be worse than Satan himself over this ridiculous Bouhlerstadt issue. \"A certain amount of diplomatic backlash was of course expected, but this is...\"\n\nFor the eleventh time in what hadn't even been fifteen minutes, Göring's office phone rang out again, no doubt calling to inform him of the exact same thing which he already knew. It took every ounce of self-control he had to prevent himself from ripping the chord out of the damn wall. Axmann winced as his Führer lifted up the handset and slammed it back down with enough force to send some of the papers blowing off his desk, all in an effort to earn himself just a few more seconds of quiet concentration. Gulping down his fear, his Minister of Foreign affairs continued."
 goering_huttig.11.a: "...Not even half of everything we've received in regards to this incident."
 goering_huttig.12.t: "King in Check"
 goering_huttig.12.d: "\"Good evening, Herr. Is your mother well?\"\n\"Yes, but she is sleeping now.\"\n\nSo went the confirmation, altered slightly in a bid to throw off Hüttig's spooks. What Kai-Uwe didn't expect was for his contact, again different from last time, to reach into his travel bag and pull out what appeared to be a bar of chocolate. The contact winced as his fingers visibly distorted the wrapper. Clearly whoever sent him with it did not understand how quickly it would melt in the Afrikan heat. \"Perhaps you can make use of this present instead then,\" the contact finished, reciting from a script of course but holding together enough to sound at least somewhat natural. \"The day is old, Herr. I must be going,\" the man announced, turning to leave before anyone grew too suspicious or nosy. \"Good evening.\"\n\nVon Hassel returned inside, not having much choice in taking the former bar with him to unfold and pry meaning from. He got as far as slipping the paper wrap from the film before catching some glyphs inside it. Writing that should not be there, likely in code. Sorting through his collection of cyphers, he sat down and got to work, slowly but surely piecing together the mercifully short message until despite some smears the meaning became clear.\n\nTENNI—N GAMBIT IN PLA—\nCREATE B—GIAN OPENING TO SHO—S\nEVAC—E ALL WORTHY P—CES\nH—GÖRING\n\n\nThough spotty, von Hassel was a canny man. It was clear that the time to leave Bouhlerstadt forever was imminent, and given the chocolate stains smudging the order as well as ‘H- -oring' it was clear this was coming from the top. Come the morning he would have to leave for Leopoldville no doubt, being the only city that made sense for an ‘opening' like that. Tonight though he would have to alert his co-conspirators to the received orders, and thus knowing radio and telegram alike were constantly monitored he reached for pen and paper and began to write."
 goering_huttig.12.a: "When Hüttig next set to work, half his government was gone."
 TNO_anarchy_GRO_nuclear_bombing_tt: "§EDie Großafrikanische Anarchie§!"
 TNO_anarchy_GRO_nuclear_bombing_tt_delayed: "Africa has often been known as the \"Dark Continent\", but never yet has that moniker been able to be applied so literally.\n\nWith the end of the Second World War, Germany took colonies from the other European powers, reorganizing them into three colonial states. They worked hard exploiting the continent to their heart's content and taking the wealth of Africa to Europe. This is how it likely would have kept on if not for the chaotic South African War. The war would engulf Africa, and drive the Reichskommissar of Ostafrika, Hans Hüttig, to madness, seeing him coup the other two Reichskommissars, and take all German Africa for himself.\n\nHaving betrayed Germany's mission, he became a pariah, one that Germany would not simply begrudgingly tolerate like Himmler. Hüttig had cut Germany off from the riches of Africa, from hundreds of thousands of Aryan colonists, and ruined the strategic plans of the Wehrmacht for decades to come. Yet Reich's hands could not reach the Reichstaat for the moment, so Hans Hüttig got full carte-blanche on former Reichskommissariats territories, resources and people.\n\nBut the Reich could not forgive such act of betrayal, and their rage only grew with time, so when the moment came to do something about the traitor, the most brutal of responses was chosen.\n\n§yThe nuclear one.§!\n\nAnd so, when the nuclear needle hit Bouhlerstadt, the Großafrikanisher Bouncy Castle popped.\n\nAfter the loudest blow, Africa is silent. But for how long?"