l_simp_chinese:
 goering_anti.0.t: "对外界的求救"
 goering_anti.1.t:0 "支援[FROM.GetName]？"
 goering_anti.1.desc:0 "德国的战争机器再度肆虐欧洲，[FROM.GetName]成为了德国征服欧洲的下一个目标。装甲师已经冲进了[FROM.GetName]，战斗迅速爆发，[FROM.GetName]正在顽强抵抗德国的进攻。\n\n[FROM.GetName]的希望似乎渺茫。无论其军力多么强大，他们面对的可能是世界上最强大的军队。也许只有超级大国才能在与另一个超级大国的战斗中幸存——至少在不考虑核武器的情况下。但即使如此，德国也很可能比任何对手都更容易赢得地面战争，毕竟他们拥有现代世界前所未见的庞大军队以及相应的技术。\n\n这使得[event nation]的处境极为不利。即使[FROM.GetName]沦陷，战争恐怕也不会就此停下。在这种情况下，我们应该为即将到来的袭击做好准备。但也有人认为，我们应该尽最大努力避免战争蔓延到我们这里。政府中支持这种策略的人建议向[FROM.GetName]派遣人员、武器和战斗培训，以尽我们的一份力量，在战争冲击我们之前先挡住它。"
 goering_anti.1.a:0 "派出士兵和物资！"
 goering_anti.1.b:0 "派出物资！"
 goering_anti.1.c:0 "我们还是专注本土防御吧。"
 goering_anti.2.t:0 "[FROM.GetName]向[FROM.FROM.GetName]提供援助！"
 goering_anti.2.desc:0 "尽管我们日益凋零的外交团队已经唇枪舌剑、火力全开，[FROM.GetName]仍然向我们的敌人[FROM.FROM.GetName]提供了援助。这一口气我们早晚得出，他们迟早会尝到我们的怒火，但目前我们无能为力。倘若对他们的运输线发动袭击，将引发另一场战争，而此时此刻我们承受不起，毕竟[FROM.FROM.GetName]还是一个威胁。\n\n不过可以肯定的是，他们很快就会见识到德国战争机器的厉害。"
 goering_anti.2.a:0 "他们会付出代价的。"
 goering_anti.2.b:0 "愚者之举，不足为虑！"
 goering_anti.3.t:0 "[FROM.GetName]支持我们的斗争！"
 goering_anti.3.desc:0 "我们正为自由而战。虽说敌军看上去似乎不可阻挡，然而希望之光犹存——英雄般的盟友已然伸出援手，无论是旧友还是宿敌，此刻都与我们并肩而立，誓要终结这场疯狂。尽管我们的男女战士成百上千地为抵御德国的进攻而牺牲，但我们新盟友[FROM.GetName]正在尽全力支持我们。补给与援兵已在后方基地集结，每份增援都让我们多一分抵挡这场浩劫的希望。\n\n唯有团结一致，我们的国家才有机会终结这场闹剧。"
 goering_anti.3.a:0 "雪中送炭，‌感激不尽！"
 goering_anti.3.b:0 "还是交给将军们定夺吧。"
 goering_anti.4.t:0 "援助[FROM.GetName]？"
 goering_anti.4.desc:0 "海外，自由正在消亡。德国的军队继续推进，所到之处，万物凋零。戈林已对[FROM.GetName]宣战，尽管参谋长们正在向总统提议，[FROM.GetName]已深陷战火之中。新闻上到处都是德国战争机器的残暴和对当地人的暴行，还有该国为了自由而绝望的斗争。\n\n尽管许多美国人仍未从非洲的泥潭中恢复过来，我军已整装待发，迫切渴望能在家门口痛击德国。政府中的许多人提议向[FROM.GetName]提供物资援助，正如国际社会中的许多国家已经在做的那样，以帮助他们的军队。但不少将领主张更直接的干预——他们提出不仅运送枪支，还要派遣“顾问”组成的远征军，以协助遏制德国的进攻，就像我们在非洲所做的那样。"
 goering_anti.4.a:0 "自由的呐喊响彻云霄！天佑美利坚！"
 goering_anti.4.b:0 "我们必须以坚定而谨慎的手段开展外交。给他们枪就行了。"
 goering_anti.4.c:0 "我们不想卷入无意义的外国冲突。"
 goering_anti.5.t:0 "洋基佬再次反对我们"
 goering_anti.5.desc:0 "愚蠢的美国佬，毫无疑问是在其犹太复国主义傀儡主子的指使下，派出了飞机和舰船，为[FROM.FROM.GetName]提供援助。尽管我们已向他们发出了严厉的外交谴责，但不得不对这微不足道的援助暂时置若罔闻，因为直接对抗可能会引发与堕落的美国人的战争，而我们尚未做好万全的准备。戈林元首在得知此事时，显得尤为焦虑，低声询问他的将领们，这是否意味着更大规模的战争将至。舍尔纳将军提议，如果空军迅速出击，在对其航运发动闪电打击后震慑美国屈服，就不会引发战争。\n\n然而，在其他几位顾问勉强的支持下，戈林元首最终搁置了这一提议，我们只能眼睁睁地看着这些美国蠢货自由行动。"
 goering_anti.5.a:0 "他们会付出代价的。"
 goering_anti.5.b:0 "愚者之举，不足为虑！"
 goering_anti.6.t:0 "美国支持我们的斗争！"
 goering_anti.6.desc:0 "在我们对德国人展开全面抗战之际，喜讯从海外传来。美国人向我们伸出了援助之手，大量武器正源源不断地从世界各地运抵我们的仓库。\n\n美国总统发表声明，称这场对我们的战争是“对全人类的威胁”，而我们也已开始从西方的支持中收获成效。\n\n在自由世界的坚定支持下，我们必能迎来一线生机。"
 goering_anti.6.a:0 "雪中送炭，‌感激不尽！"
 goering_anti.6.b:0 "还是交给将军们定夺吧。"
 goering_anti.7.t:0 "[ROOT.GetAdjective]支持[FROM.GetName]？"
 goering_anti.7.desc:0 "随着德国人在[FROM.GetName]肆意横行，我们再次陷入困境，美国的束缚如同紧勒在我们喉间的绳索。虽然我们绝不希望任何国家被迫生活在德国的暴政之下，但我们国内的许多人也不愿意看到我们英勇的士兵夹在[FROM.GetName]与德国战争机器的全面冲击之间。\n\n然而，美国已经率先跳入了这场冲突，定下了事态的发展基调。美国那与在南非如出一辙的援助，已经迅速在[FROM.GetName]扩散，使德国处境更加不利。\n\n这一先例已经确立。毫无疑问，美国将希望我们在这场战争中提供援助，许多人声称，作为OFN成员国，以及自由的支持者，我们有责任伸出援手。"
 goering_anti.7.a:0 "为[FROM.GetName]提供人员和武器！"
 goering_anti.7.b:0 "我们会送去武器支援他们的抗争。"
 goering_anti.7.c:0 "不管美国怎么说，这场战争和我们无关。"
 goering_anti.8.t:0 "[ROOT.GetAdjective]支持[FROM.GetName]？"
 goering_anti.8.desc:0 "在戈林的统治下，德国人对[FROM.GetName]的人民展开了一场有计划的掠夺、毁灭与暴行。数千人已经死去，媒体展现了母亲怀抱中垂死的孩子，成百上千的难民逃离燃烧的家园，以及德国士兵对那些被他们判定为“应死”之人的残忍行径。这一幕幕，仿佛几十年前的重演，那时我们未能从源头上终结他们的疯狂。\n\n然而，美国依旧沉默，没有援军或武器从他们的船只上送来。我们政府中许多人对此长舒一口气，视之为躲过了又一次被美国牵引进入冒险的命运。然而，也有声音对这种沉默表示愤慨，要求我们在美国保持中立的情况下仍然伸出援手。然而，若没有美国的支持，我们的援助是否只会化为徒劳呢？"
 goering_anti.8.a:0 "为[FROM.GetName]提供人员和武器！"
 goering_anti.8.b:0 "我们会送去武器支援他们的抗争。"
 goering_anti.8.c:0 "美国人说得对，这不关我们的事。"
 goering_anti.9.t:0 "OFN与[FROM.FROM.GetName]并肩作战"
 goering_anti.9.desc:0 "毫无疑问，在美国的犹太复国主义傀儡主子的强硬推动下，[FROM.GetName]那些软弱阴柔的领导人已决定与我们在[FROM.FROM.GetName]的敌人同流合污，并送出支援对抗我们。虽然尚未正式宣战，且双方都不敢袭击对方补给线以免引发更大规模战争，但这些蠢货已将自己牢牢定位为我们光荣国家的敌人。戈林元首已告诫将领们保持谨慎，否决了对该国宣战的提案，并主张这些国家可在未来的作战计划中予以解决。\n\n然而，这番侮辱显而易见，他们终将尝到我们的怒火。"
 goering_anti.9.a:0 "他们会付出代价的。"
 goering_anti.9.b:0 "愚者之举，不足为虑！"
 goering_anti.10.t:0 "OFN与[FROM.GetName]并肩作战"
 goering_anti.10.desc:0 "更多来自国际社会的援助抵达了。OFN的盟友[FROM.GetName]，最近向我们在对抗德国战争机器的斗争提供了支持。\n\n随着伤亡不断增加，我们的人民逐渐意识到德国人强加于我们国家和人民的残酷与暴行是何等可怕，无论来自国外的援助数量多么微薄，我们都应将其视为最宝贵的礼物。\n\n无论我们曾与[FROM.GetName]是朋友还是敌人，抑或从未真正交往过，如今我们必须视其为真正的朋友。正因为他们伸出援手，我们才可能在面对德国强敌时拥有一线生机。"
 goering_anti.10.a:0 "雪中送炭，‌感激不尽！"
 goering_anti.10.b:0 "还是交给将军们定夺吧。"
 goering_anti.11.t:0 "西边的麻烦"
 goering_anti.11.desc:0 "虽然旭日帝国对德国及其盟友的荒谬计划不感兴趣，但来自外界的消息仍然让天皇和他的朝臣感到担忧。德国再次向[FROM.GetName]进军，局势似乎不容乐观。就像几十年前一样，燃烧着怒火的德军不断进攻，希望迅速摧毁和消灭他们称之为敌人的国家和人民。\n\n陆军的提议非常明确：应该派遣士兵去“指导”更为弱小的[FROM.GetName]军队，并对地面上远不如他们的德国士兵进行残酷打击。海军也建议从根本上打击德国战争机器，但不那么明目张胆。他们建议我们只送出武器而不是志愿军，用我们的武器实现我们的目标。\n\n不过，有些人担心这种行动的成本以及因此激怒德国人带来的后果。最终的决定权在于首相。"
 goering_anti.11.a:0 "陆军的计划是正确的。立即派遣人员和物资。"
 goering_anti.11.b:0 "海军的谨慎是明智之举。只运送武器。"
 goering_anti.11.c:0 "天皇陛下和他的帝国并不关心外人的纠纷。"
 goering_anti.12.t:0 "日本的愚蠢行径"
 goering_anti.12.desc:0 "日本那些令人厌恶的下等人愚蠢地决定冒着激怒我们的风险，向同样堕落的[FROM.FROM.GetName]人提供援助。舍尔纳将军认为，现在是展示我们对抗日本暴发户实力的最佳时机，并指出可悲的日本军队——与我们不同，他们支离破碎、臃肿不堪——无法有效应对针对他们船只的突然袭击。\n\n然而，戈林元首不同意该计划，相反，他认为我们应当着眼于目前的地面战事。在日本支持[FROM.FROM.GetName]的情况下赢得战争能让祖国显得更强大。然而，我们绝不会轻易忘记日本的蔑视，只有无情地羞辱日本人，让他们为自己可悲的小动作血债血偿，我们才会满意。"
 goering_anti.12.a:0 "他们会付出代价的。"
 goering_anti.12.b:0 "愚者之举，不足为虑！"
 goering_anti.13.t:0 "来自远方的援助"
 goering_anti.13.desc:0 "尽管我们的政府中还存在一些质疑的声音，但今天日本人确实证明了他们是我们反德斗争中意想不到的盟友。\n\n旭日帝国通常奉行孤立主义，除非他找到了什么能让天皇陛下感兴趣的事情。而他们那些已抵达的援助确实已经给前线带来了巨大的帮助。虽说其技术不如德国或美国的技术那样尖端，但对于一个自称超级大国的国家来说，这已经算正常了。而且毫无疑问，在将来的日子里它们将大有裨益。\n\n在帝国的帮助之下，我们可能将有更多机会驱逐这些入侵我们家园的杂种。"
 goering_anti.13.a:0 "雪中送炭，‌感激不尽！"
 goering_anti.13.b:0 "还是交给将军们定夺吧。"
 goering_anti.14.t:0 "支援[FROM.GetName]？"
 goering_anti.14.desc:0 "[FROM.GetName]的人民正面临德国战争机器的强大压力。这个国家的劣等民族在雅利安军队面前几乎毫无胜算，毫无疑问，蠢货戈林终将吞并该国。\n\n希姆莱阁下对此表示不满，希望延长双方之间的斗争。冲突持续越久，德国人最终与美国和日本发生冲突的可能性就越大，或者他们会采取某些我们可加以利用的仓促行动。"
 goering_anti.14.a:0 "那帮劣等人将会得到武器来进行斗争。"
 goering_anti.14.b:0 "希姆莱阁下对这场争斗不感兴趣。"
 goering_anti.15.t:0 "勃艮第再次妨碍了我们。"
 goering_anti.15.desc:0 "虽然勃艮第叛徒没有正式消息，但德国地面部队报告了令人震惊的发现。印有卐字符的板条箱、说德语的敌方顾问，还有[defending nation]的士兵拿着我们自己设计的枪。\n\n罪魁祸首显而易见。希姆莱和他的同伙再次违背了德国的最大利益，再次背叛了我们。这一消息在将军的参谋部引发了轩然大波，而戈林元首勉强压下了这场风波。他声称，此刻进攻勃艮第正中希姆莱下怀。趁我们转身对付勃艮第的时候，他就能趁机对德国发起偷袭，并试图夺取他长期以来一直渴望的权力。勃艮第必须被消灭，但只有在德国做好更充分准备并制定详尽计划之后才能进行。\n\n尽管如此，舍尔纳尤其愤怒，他声称一旦有机会，他将亲自驾驶第一架轰炸机飞抵巴黎。"
 goering_anti.15.a:0 "他们会付出代价的。"
 goering_anti.15.b:0 "愚者之举，不足为虑！"
 goering_anti.16.t:0 "来自最意想不到之处的援助"
 goering_anti.16.desc:0 "难以置信……援助竟会以这种形式降临到我们身上。勃艮第的希姆莱出于至今不明的原因，主动提出要援助我们对抗他在德国的所谓同胞们。令人惊叹的先进武器和“顾问”已经抵达，协助我们对抗德国，而在这个危难时刻，我们实在无法拒绝这样的援助。\n\n不过，这种支持实在……蹊跷。即便我们饥不择食地接受他们的馈赠，也必须与这些勃艮第人保持距离。"
 goering_anti.16.a:0 "为新朋友干杯？"
 goering_anti.16.b:0 "还是交给将军们定夺吧。"
 GGR_anti_goering_preparation:0 "未雨绸缪"
 anti_goering_preparation_desc:0 "德国的战争机器已经将目光对准了我们的祖国，坦克正驶向边境，暴君大声疾呼我们的灭亡，士兵又一次装上了子弹。尽管德国军队规模庞大，但他们缺乏一个重要的资源：时间。德国的经济每一秒都在走向僵化，我们所要做的就是尽可能长时间地拖延。我们将为此做好准备，他们的坦克将被我们的堡垒击退，他们的领导人将不再能安然入睡，他们的士兵将面对我们国家的统一意志，我们将团结在一个共同的目标下：生存。"
 anti_goering_initial_preparations:0 "初步准备"
 anti_goering_emergency_conscription:0 "紧急征兵"
 anti_goering_produce_guns:0 "生产枪支"
 anti_goering_produce_propoganda:0 "宣传运动"
 anti_goering_build_border_forts:0 "修筑边境要塞"
 anti_goering_fortify_the_capital:0 "加强首都防御"
 anti_goering_build_coastal_forts:0 "修筑海岸要塞"
 anti_goering_wartime_manpower:0 "战时征兵"
 anti_goering_wartime_equipment:0 "战时枪械生产"
 anti_goering_wartime_tactics:0 "重审战略"
 GGR_against_the_german_giant:0 "对抗德国巨人"
 GGR_against_the_german_giant_desc:0 "我们的国家面临过许多斗争，有些是内部斗争，有些是外部斗争。但我们的国家从未面临过如此巨大的威胁，德国巨人再次苏醒，打算粉碎一切阻碍它前进的东西。面对如此压倒性的劣势，我们无法保证胜利，但我们可以保证一件事：我们将让该死的德国佬为每一英里付出代价。"
 GGR_against_the_german_giant_hard:0 "对抗德国巨人"
 GGR_against_the_german_giant_hard_desc:0 "我们的国家面临过许多斗争，有些是内部斗争，有些是外部斗争。但我们的国家从未面临过如此巨大的威胁，德国巨人再次苏醒，打算粉碎一切阻碍它前进的东西。面对如此压倒性的劣势，我们无法保证胜利，但我们可以保证一件事：我们将让该死的德国佬为每一英里付出代价。"
 GGR_anti_goering_1:0 "强化防御"
 GGR_anti_goering_1_desc:0 ""
 GGR_anti_goering_2:0 "强化防御"
 GGR_anti_goering_2_desc:0 ""
 GGR_anti_goering_3:0 "强化防御"
 GGR_anti_goering_3_desc:0 ""
 GGR_anti_goering_4:0 "强化防御"
 GGR_anti_goering_4_desc:0 ""
 GGR_anti_goering_5:0 "强化防御"
 GGR_anti_goering_5_desc:0 ""
 GGR_on_our_own:0 "独立自主"
 GGR_on_our_own_desc:0 "我们的盟友承诺提供支援和保护，但目前看来，他们还没有做好为我们这样一个小国引爆核战争的准备。至少现在如此。\n如果我们能证明自己的力量和坚韧，就能让盟友们明白，我们值得他们一战。"
 GGR_declare_war_on: "§Y团结协定§!向§Y[THIS.GetName]§!宣战。"
