 GGR_military_demands_category_desc:0 "戈林元首在内战中击溃了敢于违抗其命令的叛徒，取得了最终胜利。现在就让我们的国防军再次发动冒险与征服，建立千年之国吧！\n\n然而，国防军中的军国派影响力很大，对于如何使用我国的军事力量，他们有自己的一套想法。军国派期望祖国的征服可以尽快实施，每当德国铁骑碾过又一个国家时，他们就会§G感到满意§!。\n\n但要注意，如果军国派认为元首缺乏充分执行他们计划的意志力，§R意想不到的后果§!可能随之而来。"
