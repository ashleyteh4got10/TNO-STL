l_simp_chinese:
 GGR_burgerkreig:0 "内战"
 GGR_burgerkreig_desc:0 "二十世纪以来，武装冲突首次降临德国街头。教堂被改建成野战指挥部，大学变成临时医院，运动场化作万人冢。但在我们伟大元首的领导下，必将肃清那些企图破坏国家自然秩序的自由派、无能蠢材与狂徒。戈林万岁！"
 GGR_rally_the_workers:0 "动员工人"
 GGR_rally_the_workers_desc:0 "当我们的士兵为重建统一强大德意志的梦想而战时，工厂里的奴隶们更渴望从束缚中解脱的自由。通过混杂些许含糊承诺、善意谎言与象征性姿态，我们将设法培育这样一种观念：若奴隶们付出百分之一百一十的努力，他们的梦想或许就能实现。"
 GGR_guns_of_the_patriots:0 "爱国者之枪"
 GGR_guns_of_the_patriots_desc:0 "允许奴隶生产我们的制服、收音机、卡车和绷带是一回事，但允许他们制造我们的枪支则完全是另一回事。值得庆幸的是，这场战争正激发出许多无法亲自服役却愿为战争贡献力量的平民最好的一面。通过让他们在我们的军工厂工作，我们可以自豪地确保我们的士兵手中握着坚固可靠的德国制造枪支。"
 GGR_equipment_exploitation:0 "设备极致利用"
 GGR_equipment_exploitation_desc:0 "这场战争正日益升级，而我们的生产已无法满足需求。让安全规章和备用零件见鬼去吧。我们将让所有机器全天候运转，直到它们化作焦黑的碎片。反正到那时战争肯定早已结束。"
 GGR_production_pipeline:0 "流水线生产"
 GGR_production_pipeline_desc:0 "现实是，我们并没有德国那样令人望而生畏的战争工业，我们仅仅控制了其中的一部分。如果想要充分利用余下的工业，我们就要使用流水线生产。在德国再次统一之前，我们会减少装备的衍生型数量，也会砍掉冗余设计，以确保我们可以源源不断地供给前线。"
 GGR_run_to_exhaustion:0 "干到虚脱"
 GGR_run_to_exhaustion_desc:0 "你们知道谁会拿到最多的领土吗？那些最先宣称的人！在这场肮脏的内战开始时，我们的动作不够快，没能保护德国的城镇。但这一切不会再发生了。我们会先于敌人实现全部的目标。我们会在敌人还没读完地图时就去占领每座山、每座桥、每个工厂与每座城。在这一切结束后，我们的人才可以休息一段时间。"
 GGR_underground_production:0 "地下生产"
 GGR_underground_production_desc:0 "无论发生什么，我们的工业都不能停转，这是元首的命令。如果我们的工厂被炸毁了，我们就会重建它们。如果它们再被炸毁，我们就会在别的地方建造它们。我们将在杂货店、图书馆、家中建造工厂。如果有必要，甚至可以在街上建。正如我们的军队永远不会被打败一样，我们的工业也永远不会被打败。"
 GGR_rally_the_troops:0 "集结部队"
 GGR_rally_the_troops_desc:0 "大学里的那些怪人总是喜欢问：人生下来是要做什么。但是元首知道，德国人生来就是要战斗的！德意志国创造了历史上最伟大的战争机器，迫使世界上最强大的国家屈服。战斗流淌在德国人的血液中，没有什么比今天在这里进行的战斗更伟大的了。这是为了德国的未来而战！"
 GGR_military_encouragement:0 "激励军队"
 GGR_military_encouragement_desc:0 "当元首对军队发出呼吁时，最优秀、最聪明的国防军指挥官迅速倒向了我们这一边。然而他们发现，击毙俄国人和英国人是一回事，在自己的土地上与自己的同胞作战完完全全是另一回事。我们必须提醒我们的指挥官，那些和我们战斗的人不过是叛徒和外国间谍。他们必须知道他们不是在给德国放血，而是在解放德国。"
 GGR_for_the_glory:0 "为了荣耀"
 GGR_for_the_glory_desc:0 "A generation of youths in Germany have grown up hearing the stories of their fathers who faught in the war. Cold evenings and garden parties spent being told of the storming of the English beaches, the conquest of Voroshilovgrad and the history they made. Now we can offer these youths the chance to earn their own glory, to cement their own place in history and gain their stories of victory to tell their own children one day."
 GGR_all_brave_sons:0 "All Brave Sons"
 GGR_all_brave_sons_desc:0 "Whilst our soldiers find comradery among their own kind, sustaining them in the short term, they must also know that they too have the love, support and admiration of those at home and in government. Every man fighting in our name is a hero, and with a shiny medal on his chest and a perfume scented letter from home he will know his sacrifices are never forgotten."
 GGR_plowshares_to_swords:0 "Plowshares to Swords"
 GGR_plowshares_to_swords_desc:0 "The Wehrmacht is filled with loyal patriots who have rallied to our cause to save their homeland from the evils which threaten it. Yet so too are our lands filled with citizens who are all too happy to sit out the war and let others do the fighting. Such selfishness and disloyalty needs to come to an end. Be it from the fields or the offices, the people will fight!"
 GGR_emergency_conversion:0 "Emergency Conversion"
 GGR_emergency_conversion_desc:0 "Across Germany there are factories dedicated to making toasters, fridges, television sets and other things completely useless to the war effort. If people want their luxury goods they can wait until our streets are not drenched in blood. We will sieze all of these factories and dedicate them to producing bullets, planes and helmets instead."
 GGR_fight_damn_it:0 "Fight Damn It!"
 GGR_fight_damn_it_desc:0 "Our commanders are continuing to report that whilst our men can talk the talk, there is widespread displeasure and reluctance when battle is actually met to kill their fellow German. Mercy is too widespread and is costing us the decisive results we need to bring this war to an end. We need to make sure that our men properly understand that if they do not shoot the enemy, then the enemy will shoot them. There can only be one winner in war."
 GGR_tractor_tanks:0 "Tractor Tanks"
 GGR_tractor_tanks_desc:0 "Is there any word in the world that puts more fear in a man than 'Panzer'? Panzer's were a key reason we won the war two decades ago, and the Wehrmacht hungrily lusts after the armor which will help them finally end this war. The only issue is that the production and material requirements to produce proper armored units are currently beyond our means. But we will not be defeated! Take some tractors and trucks, slap on a machine gun or anti-tank gun and some armor plates and you've basically got a tank, right?"
 GGR_the_warriors_breakfast:0 "The Warriors Breakfast"
 GGR_the_warriors_breakfast_desc:0 "An army marches on its stomach, ask any commander from Mark Antony to Ferdinand Schörner and they'll tell you the same. Our boys cannot fight if they don't have bullets in their guns, but they will not fight if they have no food in their stomach. If we can ensure each morning our boys have meat, bread and coffee we can ask the impossible of them. And if by feeding our troops better than the enemy feeds theirs, boosting our morale and combat ability in the process, well that's just a happy accident."
 GGR_the_situation_is_becoming_convoluted:0 "The Situation is Becoming Convoluted"
 GGR_the_situation_is_becoming_convoluted_desc:0 "This war is going on far beyond the timeframe we expected at the start of the war or even this time last year. Our manpower and supply demands are spiraling out of control, the slave situation is coming closer and closer to imploding, enemy agents and partisans are hindering us at every turn and the people demand peace. This war needs to end, and end soon. Else who knows what could happen..."
 GGR_the_situation_is_becoming_convoluted_tt:0 "We must not allow the present deadlock to go on for much longer. If we do not win decisvely soon, the situation may collapse entirely."
 GGR_homebrewing:0 "Homebrewing"
 GGR_homebrewing_desc:0 "Our supply demands are starting to get out of hand as the war drags on, and so every household must contribute to the war effort. Housewives will make bandages, alcohol will be distilled and donated in stills and bathtubs. Wallpaper will be torn from the walls to write orders on. Herb gardens and fields will be decimated. We are fighting for the security of every household, they must play their part now."
 GGR_endless_working:0 "Endless Working"
 GGR_endless_working_desc:0 "Work harder you miserable wretches! Our boys at the front might each one be irreplacable, but our slaves very much are. The working hours of the past must be scrapped if we are to win this. Every slave will work until they drop, and then we will replace them with another as easy as chambering a fresh round in our rifles. Let it be motivation for them to help us get this war ended as soon as possible."
 GGR_soldiers_in_spirit:0 "Soldiers in Spirit"
 GGR_soldiers_in_spirit_desc:0 "We need more men, more men than we can properly train and even equip in some cases. But as we have said before, the German was created to fight! As we press fresh waves of men into service, we will prove even a poorly trained and supplied German conscript can fight with the heart and soul of a warrior!"
 GGR_the_commissariat:0 "The Commissariat"
 GGR_the_commissariat_desc:0 "There is far too much waste going on in the Wehrmacht. Too many supplies are being left in the field, too many men are dodging the drafts, too many opportunities are being missed. We will send Commissars to the front to ensure proper mobalization, recruitment and records of supply and manpower uses and demands. Let their presence assure our commanders in the field that the Führer is watching."
 goering.civil_war.1.t:0 "Führer Göring Speaks!"
 goering.civil_war.1.d:0 "Today our new and rightful Führer Hermann Göring spoke out from the Hamburger Rathaus to an adoring crowd of civilians and soldiers thronging the Rathausmarkt. Many more crammed Hamburg's streets, striving to hear the new Führer's first address to the public.\n\n\"We will go down in history as the rightful successors of the German Reich; after all, it was I that our late Führer Adolf Hitler placed his trust in to protect Germany from these traitors, communists, and weaklings! We have forgotten the true path that made Germany strong. Germany did not become powerful by licking the boots of the Jewish vipers in the west while feeding the slavs in the east out of our own pockets, No, no, no! Germany became strong by Conquest! Germany became strong by bayonet and bullet! We threw off the chains of Versailles and crushed the mongrel empires of France, Britain and Russia, the German people have remade themselves in blood and iron! Today, we retake Germany from those who would prostitute her glory like the traitors of Weimar my comrades!. We will destroy the bootlicker Bormann, the puppet Heydrich, and Speer, the accursed liberal!\"\n\nTop Militarists generals led the crowd in saluting the new Führer, including Ferdinand Schörner, new Field Marshal of the Militarist German faction."
 goering.civil_war.1.a:0 "Germany's destiny belongs to those strong enough to take it! Heil Göring!"
 goering.civil_war.2.t:0 "Fabrikbataillons To The Front!"
 goering.civil_war.2.d:0 "As the German Civil War intensifies Führer Göring has once again decreed that more and more able bodied men cannot be wasted at the rear labouring on such indignities as weapons production and ammunition supply. To these humble exemplars of German industry, our beloved Führer has decreed the honour of serving in 'Fabrikbataillons' - Factory Battalions. An entire Fabrikgrenadier Division will be raised! They will complete the orders for their own weapons and then march into battle bearing their own creations and thus will be extra motivated. After all what is finer than going to war with a weapon you yourself created with your own two hands!\n\nThis surge in manpower will surely overcome the brief, only temporary shortfalls in production as new crews (Comprised of the elderly, the sick, the infirm and women.) are trained to replace them. Our beloved Führer has received promises that the various factories will not only meet targets, but will exceed them thanks to the inspiration provided by these brave men."
 goering.civil_war.2.a:0 "A salute to the brave men of Fabrikgrenadier Division Alberich!"
 goering.civil_war.3.t:0 "Relaxing Regulations on Soldiers"
 goering.civil_war.3.d:0 "Without the incessant prattle of civilians to tell us how best to run the Wehrmacht, we have relaxed a few bothersome regulations on the soldiers. Keeping our soldiers happy is the most important thing as we will ask them to go to the death for our beloved Führer on the morrow.\n\nSo what if a panzerkompanie has lost a third of its vehicles because they have been driven drunkenly into ditches or houses. These men shoulder a burden for the Reich and if they wish to have a drink, then they should be able to have one!\n\nAlthough we should probably look into the morphine shortage affecting many frontline medical units. Clearly this means not enough morphia is reaching the men! We shall redouble the rations of it, and increase the supply of Pervitin! Doubling the men's Pervitin ration shall help us ensure final victory over the SS, liberals, and conservatives!\n\nSome enterprising units have even begun to supply themselves with combat stimulants. Cooking batches of the drugs in portable labs operating just behind the frontline. The Führer has even gone so far as to praise these men, calling them \"(...) a credit to the self-reliance of the German grenadier.\"."
 goering.civil_war.3.a:0 "If it keeps them fighting, then they can smoke it, drink it, eat it, or inject it for all I care."
 goering.civil_war.4.t:0 "Feldgendarmerie Presence Expanded"
 goering.civil_war.4.d:0 "As the German Civil War continues to rage, it is important to remember that this not just a leadership struggle, it is a war for the very soul of Germany!We must not allow our ideological purity to be compromised by the triple spectres of liberalism, ultranationalism, and conservatism! Führer Göring was appointed by Hitler himself to lead the nation after his death, his oldest, most trusted companion! Soldiers are inclined to grumble and complain, it is their lot after all, but sedition must be torn out root and stem.\n\nTo this end the Führer has enacted Führer Decree 267, the expansion of the Feldgendarmerie into the ungentlemanly aspect of political officer. The Feldgendarmerie will now directly attach teams to frontline units, monitoring the men's morale and ensuring that the threat of sedition is held at bay. \nNightly lectures on Mein Kampf! Weekly showings of Triumph of the Will! (The edited version of course) \nThe unsavoury rumours of flying court-martials, are just that: rumours. As is the idea that the Feldgendarmerie have been empowered to shoot suspected seditionists on their own authority...."
 goering.civil_war.4.a:0 "The traitor must clearly understand one thing at once, he must get out!"
 goering.civil_war.5.t:0 "Tractor Tanks"
 goering.civil_war.5.d:0 "The Volkspanzer initiative was unveiled today before a select group of industrialists, generals and prominent dignitaries. Field Marshal Schörner spoke about the need for such panzers to replace the ones already lost at the front, noting that with such tanks, final victory would be within the Führer's grasp soon.\n\nThe concept of the Volkspanzer is that the armoured shells of the panzers would be distributed to sites likely to be attacked by the enemy, where local crews could easily attach the hulls to standard farm tractors without complicated tools, presenting an iron wall to the enemy where ever he attacks!\n\nThe Volkspanzers are built of recycled steel normally unsuited for armour plating. They are armed with six spare MG34s rather than MG3s and crewed by eight men. The most modern armament is the mounting for a recoilless rifle on top of the vehicle to provide the Volkspanzer with an anti-panzer punch!\n\nSome vile, seditious wretches have suggested that the resulting 30 tonne, 20 kph vehicle is not really the vehicle that we need to win the war, and that we should be focusing on proven weapons of war. They are wrong! This is a total war and we must be ready to mobilise the entire population at once!"
 goering.civil_war.5.a:0 "With these new Terror Tanks we will be able to crush all resistance! Onwards to Germania!"
 goering.civil_war.6.t:0 "Volkspanzers Engage The Enemy"
 goering.civil_war.6.d:0 "Today the first of the Volkspanzers engaged the enemy! Acting decisively a Volkspanzer squadron assembled their vehicles and rushed forwards to engage the enemy. At first the attack seemed to go well, their recoilless rifles claimed two enemy panzers.\n\nThen it went horribly wrong. \nA Volkspanzer rolled over on the uneven ground, another broke down as it's engine failed to cope with the strain of the added weight, and the rest were crushed by the enemy's guns. High velocity shells ripping the vehicles to pieces. Their crews attempted to abandon them, but were trapped inside of the burning tanks owing to the cramped design. Around 10 of the 36 men managed to escape back to our lines."
 goering.civil_war.6.a:0 "We may want to rethink this idea..."
 goering.civil_war.7.t:0 "The Silent Cites"
 goering.civil_war.7.d:0 "As the German Civil War continues to rage, more and more men are being pulled from the cities, towns and farms. In some parts of Hamburg the streets are empty, devoid of any people. \nWhole apartment buildings are unoccupied, their residents at the front, fighting to protect sacred Germany. Factories that aren't given over to arms production fall silent, if it does not produce for the war effort, then it does not produce at all. Farms are entirely given over to nothing, abandoned by all workers and now lost to infestations of weeds. The Baltic fishing industry has ground to a complete standstill, their sailors and fishermen gone to the Kriegsmarine. Their vessels rusting at anchor or pressed into service as minesweepers. All non-essential shipyards turned over to the control of the navy. \nAway from the front, an eerie calm has descended over North-West Germany. The whole country is simply becoming, empty."
 goering.civil_war.7.a:0 "Germany will be made great again, these sacrifices are necessary to achieve final victory..."
 goering.civil_war.8.t:0 "A Letter from Katharinastadt"
 goering.civil_war.8.d:0 "Führer Göring,\n\nIt is with a heavy heart that I write this. Civil war has broken out thoughout our great Fatherland in an attempt to oust the one and only true Führer, you.\n\nA surprising number of our countrymen do not share our vision that the only way for the Reich to return to greatness is through military might and economic restructuring. But we, your allies in Kaukasien, know that the only way for Germany to triumph once again is through your leadership.\n\nTo help the true sons of Germany in this trying time, we shall ensure that your supply of fuel and oil is undisturbed to help your war effort. Hopefully, this will help bring about a quick and decisive victory in your favor.\n\nYour loyal servant,\nProvisional Reichskommissar Paul Pleiger"
 goering.civil_war.8.a:0 "The oil barons stand behind Göring!"
 GGR_Militarist_ethos:0 "Militarist Ethos"
 GGR_Militarist_ethos_desc:0 "Göring and his loyal adherents are staunch proponents of the military above all else. As such his followers in the civil war are ready to fight and die on the battlefeild, sometimes at the cost of the other facets of the war. "
 GGR_Production_pipeline:0 "Production Pipelines"
 GGR_Production_pipeline_desc:0 "With a streamlined production pipeline our factories are capable of producing equipment at a faster pace than before. However, pushing the workers any further may have unintended ramifications."
 GGR_Run_to_exhaustion:0 "干到虚脱"
 GGR_Run_to_exhaustion_desc:0 "Our workers need to make some sacrifices to ensure our ultimate victory against the traitors. Complaints about long hours without rest are ignored, we must end this war fast."
 GGR_work_for_your_life:0 "Work for your life"
 GGR_work_for_your_life_desc:0 "There are two options present for the slaves of Germany, work or die."
 GGR_endless_work:0 "Endless Work"
 GGR_endless_work_desc:0 "The workers may complain, but the fact of the matter is that we need more equipment. No matter how harsh the conditions or how dangerous the task, they will work."
 GGR_Fight_damm_it:0 "Heightened Morale"
 GGR_Fight_damm_it_desc:0 "Our troops have recived some encouragement to fight, and are thus highly motivated. This sense of enthusiasm will not last long during this war though, and we should use it while we can."
 GGR_homebrewed_recreation:0 "Homebrewed Recreation"
 GGR_homebrewed_recreation_desc:0 "While the discipline of our troops might have dropped by a small ammount ever since we lifted the ban on the usage of chemical stimulants, the boost in morale has more than made up for it."
 GGR_frontline_commisars:0 "Frontline Commisars"
 GGR_frontline_commisars_desc:0 "Our frontline commisars have managed to whip our troops into a true frenzy, and have ensured utter loyalty to Göring amongst the soldiers."
 GGR_warriors_breakfast:0 "Warriors Breakfast"
 GGR_warriors_breakfast_desc:0 "Our troops are well fed, and are thus more willing to charge into enemy lines."
 GGR_factory_battalions:0 "Factory Battalions"
 GGR_factory_battalions_desc:0 "Workers from the factories are now flooding the frontlines, ready to fight and die for Göring . This cannot be kept up for long, as empty factories produce little. We must end this war soon. "
 GGR_reliability_issues:0 "Reliability Issues"
 GGR_reliability_issues_desc:0 "We have started to cut some corners when it comes to our equipment, the gains in production will hopefully make up for this."