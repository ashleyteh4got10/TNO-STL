 GGR_wunderwaffe_projects_desc:0 "\n\n\n\n£decision_image_GGR_GRWI \n\n\n\n\n\n\nThe Großdeutscher Reichsrat für wissenschaftliche Innovation, the future of science in the Reich for some but for the Führer simply another useless organisation set up with the end goal of destroying militarist power and influence. Because of this sinister end goal we will have to spend a sum every month equal to the corruption divided by twenty times the yearly budget of the GRWI. But the GRWI does not work in a vacuum and should either the concern of the military or the civilian population reach 100% because of several failed projects we shall be forced to shut down the whole operation.\n§GSpending§!: [?GGRCSI_spending]M\n§RCorruption§!: [?GGRCSI_corruption|%0]\n§YPublic Concern§!: [?GGRCSI_public_concern|%0]\n§eMilitary Concern§!: [?GGRCSI_military_concern|%0]\n[ROOT.GetGGR_nuclear_info_description]"
