l_simp_chinese:
 GER_GOR_a_new_age_of_science:0 "科学新纪元"
 GER_GOR_a_new_age_of_science_desc:0 "即使在内战的前一年，德国依旧是人类历史上最先进的现代科学技术宝库。我们征服了星空，并把人类送上了月球。在此之前，我们掌握了原子，并向美利坚释放了怒火，结束了第二次世界大战。上世纪人类智库的两次飞跃都是出自德国人之手，举世皆知。然而，尽管取得如此成就，次等民族依旧与我们争夺桂冠，不幸的是，他们快要接近我们了。现在结束了。戈林元首绝不允许德国在任何方面被超越，为此他准备了一场从农业到装甲武器，涵盖各个方面的知识振兴运动。"
 GER_GOR_founding_the_GGRCSI:0 "大德意志国家科学创新委员会"
 GER_GOR_founding_the_GGRCSI_desc:0 "德国的技术官僚长期以来一直在寻求创建一个统一科学创新与研究的机构。最终，元首戈林似乎听从了他们的话。大德意志国家科学创新委员会（GRWI）就是为此服务的。它让我们成功集中德国所有最有才华的人才，以便他们能够从事戈林乃至全国最迫切需求的项目。"
 GER_GOR_purge_the_academia:0 "清洗学术界"
 GER_GOR_purge_the_academia_desc:0 "德国学术界对元首戈林的支持以及关系一直存在一些……争议。那些书呆子们蔑视我们在内战中的斗争，有些人甚至在走进我们的办公室时仍然保留着这种仇恨。事实上，如果允许某些人成为大德意志国家科学创新委员会的一部分，我们可能会无意中毁掉德国的科学发展，因为这些颠覆分子会暗中破坏、减缓进步。为了防止这种情况发生，我们应该“摆脱”学术界中那些比较麻烦的分子，以及那些不认同戈林愿景的人。"
 GER_GOR_Militarwissenschaft:0 "军事科学"
 GER_GOR_Militarwissenschaft_desc:0 "如果德国希望维持希特勒承诺的千年霸权，就必须保持战争工具的优势。自1940年我们的装甲部队击败波兰人、法国人和俄罗斯人以来，很多事情都发生了变化；现在，主战坦克和直升机是战场厮杀的主角，如果我们希望超越我们的敌人，就必须与传统枪械一起快速发展它们。\n\n当然，国防军的各个部门都小心翼翼地保守着他们的小秘密，不愿让军队中的对手占上风，从而获得更多资金。元首虽然是国家的主人，但即使是他，在应付这些顽固的蠢货时也会犯难。"
 GER_GOR_lets_get_down_to_work:0 "让我们开始干正事吧"
 GER_GOR_lets_get_down_to_work_desc:0 "With the completion of all formal administrative tasks required to establish the GRWI - 'Großdeutscher Reichsrat für wissenschaftliche Innovation' - it's time we, as the saying goes, \"get down to business\". Thus, with the support of Führer Göring himself, let the process of research and development commence, as our funding and top quality manpower shall produce the finest military science that history has ever seen! German science, as they say, is the best in the world - and we shall lead it to glory!"
 GER_GOR_weapons_of_the_fourth_weltkrieg:0 "Weapons of the Third Weltkrieg"
 GER_GOR_weapons_of_the_fourth_weltkrieg_desc:0 "The decision to determine the armament focus priority is quite possibly the most influential decision of our decade. Through the invention of new weapons of warfare and destruction we will more effectively subdue and destroy the enemies of the Großgermanisches Reich (whose numbers increase by the day). Yet, when determining the future of warfare, a quote from the dissident Jewish scientist Albert Einstein comes to mind; \"I know not with what weapons World War III will be fought, but World War IV will be fought with sticks and stones\". "
 GER_GOR_guns_of_the_future:0 "Guns of the Future"
 GER_GOR_guns_of_the_future_desc:0 "The Mauser C96, the Gewehr 43, the Sturmgewehr 44: all these and more were products of German genius, and they carried sons of the Fatherland to victory after victory in their many battles. These weapons were the tools of the first and second World Wars, but the battles of the Third seems closer than ever. When that time comes, the men of the Reich cannot be sent into battle with anything less than the perfection afforded only by Aryan science. Herr Osenberg has been given permission to fund as much research and development as is necessary to design state-of-the-art personal equipment for our brave soldiers."
 GER_GOR_away_with_feltgrau:0 "Away With the Feldgrau?"
 GER_GOR_away_with_feltgrau_desc:0 "The question of potential Wehrmacht uniform innovation troubles our military planners at night, for some God-known reason: it's best that our government establish its position on the matter with haste. Indeed, in what has been referred to as the \"Away with Feldgrau\" row, certain officials within the Wehrmacht have recently argued against the continuation of 'Feldgrau'; conservative figures within the organization continue to have confidence in the grey, pushing against what they see as excessive and unnecessary interference from stuffed-suits. Of course, this falls to the decision of Führer Göring (although we are unsure if bringing such a minor decision to him is not itself a demonstration of ineptitude)."
 GER_GOR_redevelop_the_arsenal:0 "Redevelop the Arsenal"
 GER_GOR_redevelop_the_arsenal_desc:0 "At the height of the Second World War, the Reich was producing thousands of rifles per week, millions of bullets, and hundreds of heavier munitions. The crash of the 50's put an end to all that however, as factories emptied and were shuttered and the production lines went silent. That is all about to change however, as the Führer has announced a conference of the top arms manufacturers to take place in Zossen. There, the greatest military industrialists of the age will convene to return the workers to the factories, and the factories to their war footing. Every soldier will have enough material to eliminate ten enemies, and each gun produced will be worth dozens of theirs. The world will soon remember why it feared the sound of German guns."
 GER_GOR_flying_machines:0 "Flying Machines"
 GER_GOR_flying_machines_desc:0 "The latest trend in aviation warfare is the helicopter. Relatively small and able to fulfill a variety of design purposes, it seems to serve admirably in militaries across the globe. Prior to the civil war, the Reich had not been able to invest in airborne assets as some had hoped, largely due to mounting budgetary concerns. Now that much of the fat in the accounts has been paired down however, Osenberg has been given a free hand to establish more dedicated R&D sites across Germany to further elucidate where the helicopter can best serve the Reich's armies."
 GER_GOR_a_new_tool_for_the_infantry:0 "A New Tool For the Infantry"
 GER_GOR_a_new_tool_for_the_infantry_desc:0 "The concept of 'air assault' through the employment of helicopters is an admittedly recent innovation of warfare, yet a necessary one for the achievement of a swift, overwhelming tactical victory, particularly in inaccessible and difficult terrain. Indeed, the increased usage and employment of helicopters in warfare may prove useful and assist in the effectiveness of ground-troop operations. Furthermore, by choosing to pioneer helicopters, we shall cement ourselves as the most efficient and technologically advanced Armed Forces on this planet, assisting us during this 'Cold War'. "
 GER_GOR_to_carry:0 "To Carry Is Your Duty..."
 GER_GOR_to_carry_desc:0 "Given the Führer's prescient decision to invest in the production of attack helicopters, it's best we also invest in some more mechanical contemporaries. Through investment of resources into the research, development & introduction of new transport helicopter designs we will improve the efficiency of the Luftwaffe's fleet when attempting to transport materials and men to the battlefield and beyond, due to their greater capacity. The helicopter shall be the mechanized truck of a new age!"
 GER_GOR_to_fight:0 "...And To Fight Is Your Command!"
 GER_GOR_to_fight_desc:0 "Given the Führer's intuitive decision to invest in the production of transport helicopters, it's best we also invest in some more mechanical contemporaries. Indeed, through investment of resources into the research, development & introduction of new attack helicopter designs we will improve the efficiency of the Luftwaffe's fleet when we attempt to annihilate our enemies from the skies in warfare, accelerating our inevitable success. Let the blood of our enemies rain - FROM THE SKY!"
 GER_GOR_bigger_better_stronger:0 "A Bigger, Better And Stronger Panzer"
 GER_GOR_bigger_better_stronger_desc:0 "The Panzerkampfwagen is the backbone of the Blitzkrieg tactic, a machine so powerful that we cannot afford a so-called 'phasing out' of this valuable arm. It would also be remarkably expensive to draw down usage of the machine, a truth we have chosen to downplay for the papers. Rather, Führer Göring has decreed that we shall develop a, and we quote, \"Bigger, better and stronger Panzer\" that shall be deployed in \"future conflict\". Thus, the time has come to once again innovate the ancient Aryan-steel superweapon. From the German Axe to the Panzer, German steel has shattered and shall shatter all arrayed against it!"
 GER_GOR_the_engine:0 "Ein Neuer Motor?"
 GER_GOR_the_engine_desc:0 "The first thing any good tank needs is an engine. Simple enough, right? Maybe not, as it turns out. The largest tank engines we have, for the Maus and Tiger II are not nearly strong enough to power on the scale of the Liger. Osenberg won't be able to get the damn thing to move an inch unless significant resources are brought to bear to develop a state of the art motor. Of course, that would significantly increase the production cost per unit, and with all the other expenditures that will need to be added to the project, this could well start right out of the gate as a massive boondoggle. Still, maybe we could work with the old designs a bit, make them compatible just enough so that the behemoth can head into battle, and then hope for the best."
 GER_GOR_the_armor:0 "Eine Härtere Panzerung?"
 GER_GOR_the_armor_desc:0 "The Liger's armor will need to be top notch given how large of a target it will be. Everything from handheld anti-tank munitions to artillery and bombers will be coming after it in an attempt to remove our queen from the board. Hell, they might even try using naval guns if they have a chance. Given all that we're going to be putting into this project we can't have the units just crumpling under heavy fire. They ought to be able to withstand the fury of Hell according to Führer Göring, and he wants no expenses spared for developing new polymers and composite metals in pursuit of this. Herr Osenberg has been given quite the task, but maybe, just for the sake of efficiency, he could just a few corners here and there?"
 GER_GOR_the_gun:0 "Eine Stärkere Kanone?"
 GER_GOR_the_gun_desc:0 "As befitting of the new benchmark in military technology, the Liger must have an armament capable of destroying any target it comes across in the open battlefield.In order to maximize its destructive potential therefore, the engineers have devised a most peculiar solution: installing two 105mm guns at the front of the behemoth's chassis. Of course, this firepower comes at the cost of the ability to rotate the canons via traditional turret, giving the Liger more in common with a tank destroyer than an MBT in some respects. This however is of little consequence as we will only need one shot in order to make a kill - no adjusting for aim will be necessary once the first shots have been fired. The only question left for Herr Osenberg is how much he should expend into the designing of the guns themselves."
 GER_GOR_are_we_missing_something:0 "Are We Missing Something?"
 GER_GOR_are_we_missing_something_desc:0 "The Panzerkampfwagen 'MBT' improvement project has thankfully come to its completion, having run its course smoothly and without difficulty. However, this has caused worry amongst a few military circles who doubt the project's seeming success. Yet, despite our misgivings, it's best we don't inform the Führer and Schörner about it - as we're quite sure that there is totally nothing wrong with the Panzer! We will take the additional measure of making our designers sign non-disclosure agreements for the good of the Reich, to prevent morale losses from any potential leakers. It's for the best, really."
 GER_GOR_das_liger:0 "Das Liger"
 GER_GOR_das_liger_desc:0 "Führer Göring has officially decreed the most recent 'MBT' design & project shall be classified as the 'Das Liger' Panzer. With this declaration, those who manufacture Panzerkampfwagen have since become emboldened and encouraged in their work, thereby increasing the development & research capacity for future designs. The next fat stacks of research money and grant funding are well on the way - and given the efficiency of the German scientific machine, we are certain this will not incentivise corruption or budgetary bloat in any way. Utterly foolproof!"
 GER_GOR_Volkswissenschaft:0 "Volkswissenschaft"
 GER_GOR_Volkswissenschaft_desc:0 "Everyone always likes to think about the military applications of technology, but far too few (including the Führer it seems) often consider the civilian benefits of new knowledge. Chemicals are great at causing chaos and death amongst enemies, but can they not also improve our crops? The atom can be split to destroy entire cities, but can it not also power them? Herr Osenberg is smart enough to realize that putting all his technological eggs in one basket is a foolish idea. At the same time however, he realizes that given the martial bent of the current regime, he will have to carefully tailor the applications of his ideas so that they might also serve more military-minded purposes, if only to get the projects approved."
 GER_GOR_the_power_of_the_atom:0 "The Power of the Atom"
 GER_GOR_the_power_of_the_atom_desc:0 "The atomic bomb, the weapon which won the war. Proof of the superiority of the Aryan race, the Gods had aided us in our quest for world domination decades prior through the gift of heavenly power. Yet, in the decades following the end of the Second World War, our opponents have regrettably achieved this God-like power. Thus, Führer Göring has decreed that research & development shall commence on the construction of an Atomic bomb with far greater destructive power. Some have called the hypothetical prototype the Führer-Bombe - (CONTENT REDACTED FOR SECURITY PURPOSES)"
 GER_GOR_infrastructure_planning:0 "Infrastructure Planning"
 GER_GOR_infrastructure_planning_desc:0 "Improving the Reich's infrastructure is vital to our ability to further innovate and conquer. From Frankfurt to East Prussia, our largely destroyed infrastructure network must be consolidated and outright rebuilt we are to successfully achieve our rightful place on the global stage. Thus, it's best we begin planning for a new generation of roads, railways and powerlines, so that the Großgermanisches Reich may hopefully commence construction of new & improved nuclear power plants. "
 GER_GOR_railroad_plan:0 "Breitspurbahn"
 GER_GOR_railroad_plan_desc:0 "The 'Breitspurbahn', a concept proposed prior to the outbreak of the Bürgerkrieg, was the idea of embarking upon an ambitious network of modern railroads to link up the Großgermanisches Reich's key infrastructure centres. These railroads would be capable of fitting large-scale passenger traffic - but they would also be built to the specifications of our rail-based troop-carriers. With Führer Göring's intentions of conflict and war, coupled with the stable state in which the Reich finds itself, the time has come to connect the Fatherland through the strengthened steel of the railway lines. "
 GER_GOR_ostgermania:0 "East German Rail Expansion"
 GER_GOR_ostgermania_desc:0 "In order to truly connect the Reich, we must first focus efforts on the railway (ignoring the protests of the automobile manufacturers). While of course air travel is a preferable alternative (at least in the mind of Führer Göring), the rail lines have always been the primary method with which the Reich was able to function. Needless to say, it is also far easier to reroute train traffic for military ends than it is to corral trucks, lorries and cars off crowded roads. Thus, it is preferable that we rebuild and expand already existing rail lines to better suit the Führer's ultimate desires of war and conquest. "
 GER_GOR_westgermania:0 "West German Rail Expansion"
 GER_GOR_westgermania_desc:0 ""
 GER_GOR_germany_to_europe:0 "Hamburg to Wien Express"
 GER_GOR_germany_to_europe_desc:0 ""
 GER_GOR_electronics_research:0 "Electronics Research"
 GER_GOR_electronics_research_desc:0 "When we began our domination of Europe all those years ago the development of what we call \"electronics\" was still very young. There were radios and very primitive TVs of course but nothing like what we have access to now. Even with all of our own achievements however we often find ourselves lagging in this area when compared to the Japanese and Americans. So much of the research into electronics was put into the Space Race during the 50s that we have fallen behind in practical and everyday uses of these systems. The Führer hopes to remedy this and as an opening salvo has ordered a significant budget increase for the GRWI dedicated to R&D of new military and civilian applications of electronics. Germany shall remind the world that it was once a dominant technological powerhouse and with a little greasing of the wheels it will regain its rightful place."
 GER_GOR_atomic_planning:0 "Atomic Planning"
 GER_GOR_atomic_planning_desc:0 "The computer is a machine or device that performs processes, calculations and operations based on instructions provided by a software or hardware program. In the context of atomic development & planning, we have already seen preliminary studies that demonstrate the efficacy of computer-based programmes in testing and refining our projections. GRWI has come to conclude that we must digitalize our efforts if we are to achieve relative success. Thus, we shall design & upgrade nuclear plants with a computer instead of relying on ballpark estimates, thereby improving the construction process. "
 GER_GOR_make_them_grow_like_mushrooms:0 "Make Them Grow Like Mushrooms"
 GER_GOR_make_them_grow_like_mushrooms_desc:0 "The concept of 'Atomic Planning' has largely, up until this point, regrettably found itself constrained by largely environmentalist and conservationist concerns. However, the Führer has chosen to disregard his previous ethos of actually choosing to 'enjoy' or 'protect' the environment, which is useless to waging effective warfare. Instead, with the Führer's blessing, we shall improve the Reich's nuclear programme through the construction of dozens of new plants all across the Fatherland, irrespective of population density or environmental beauty. This will speed up the Großgermanisches Reich's fledgling programme of nuclear development & advancement. It will also bring those who care about the so-called 'environment' and 'health' of the German nation out into the open, where we can trade their placards for long-deserved jail sentences."
 GER_GOR_biology_in_application:0 "Biology in Application"
 GER_GOR_biology_in_application_desc:0 "The field of biology has been progressing ever so rapidly in the two decades since the Second World War. While we may not have always prioritized the biological fields during that time, we were able to learn enough ourselves and steal from our rivals enough to develop increasingly sophisticated pesticides, hormones, and even new synthetic chemicals.\n\nDespite some objections within the GRWI due to the still unclear side effects of many of these substances, the Führer has issued several directives related to their use. The farmers will be given batches of the experimental pesticides and GMOs for practical testing. There are some uncertainties here, but science cannot move forward without the bravery to venture into the unknown."
 GER_GOR_for_the_plants:0 "For the Plants..."
 GER_GOR_for_the_plants_desc:0 "Out with conservation, in with innovation; it's nothing but scientific progress for the Großgermanisches Reich! So, why should the Reich's produce and plants be exempt from progress? To truly allow the Aryan race to triumph over our inferior contemporaries, we must ensure that every plant in the Reich is stamped with a swastika. Thus, as mentioned, it's best we put 'genetically modified organisms (GMOs) in all of the Reich's plants! We shall eat, and fight, for the future! (This report was not sponsored by agricultural concerns in any way. Allegations of corruption, mismanagement of funds or bribery constitute slander and will be investigated accordingly.)"
 GER_GOR_and_the_troops:0 "...And the Troops"
 GER_GOR_and_the_troops_desc:0 "Hm... much like our employment of 'Pervitin' in the 1940 'Fall Gelb' operation guaranteed a lightning victory against the Reich's various opponents, perhaps the mass consumption of performance enhancing drugs and substances will prove to better the standing and battle readiness of the German Wehrmacht? Thus, it's best we explore this concept by testing supposed performance enhancing drugs on our already competent soldiers. This will surely make them competent in even greater measure, granting them combat strength and focusing their abilities to superhuman extents. What could possibly go wrong?"
 GER_GOR_what_about_the_water:0 "What About the Water?"
 GER_GOR_what_about_the_water_desc:0 "Regrettably, the liquid of life doesn't exactly do much in the way of battle... let's change that, shall we? Indeed, the time has come to wonder 'what about the water?' and make it useful in our success as a nation. It is therefore necessary, with the formal recommendation of the GRWI, that the government begins to pump 'Fluorine' (the most electronegative element) into the Reich's water supply. We have undertaken this despite considerable protests from our nation's private sector, who claim it will destroy the toothpaste industry - we have assured Führer Göring that fluorine will deliver improved health and, more importantly, keep the population docile. (And also prevent tooth decay.)"
 GER_GOR_perfection:0 "Perfection"
 GER_GOR_perfection_desc:0 "We have furthered the cause of science, yes we have! The GRWI's scientific recommendations have served to assist the Großgermanisches Reich in achieving considerable scientific process. As our surveys suggest (and will continue to suggest, unless the Board of Statistics wishes to bring a corporate lawsuit on their collective heads) our decisions have made the public far stronger and the Aryan man even more Aryan as a result of our experimentation. Our researchers report a 15 percent increase in the luminosity of smiles received by the general public! Needless to say, the Reich's future is bright! We have achieved complete and utter perfection... "
 GER_GOR_greater_projects_ahead:0 "Greater Projects Ahead!"
 GER_GOR_greater_projects_ahead_desc:0 "With our achievement of true Aryanism, it's best we move onto the far greater and increasingly grandeur projects ahead of us. We shall begin our ascent into eternity by pouring a considerable amount of Reichsmarks into such megaprojects, about $200 billion, into the fantastic godlike concept of the 'Sun-Gun', which the Führer has long believed will secure German security once and for all. Once built, the Großgermanisches Reich and its Führer shall control the rays of life itself! We shall be as gods, and nothing will be restrained from us - which we have imagined to do. (Don't tell the Church about that last part.)"
 GER_GOR_master_of_death:0 "Masters of Death"
 GER_GOR_master_of_death_desc:0 "Given our abundance of missile and rocket technological blueprints, it's best we look at our prior designs when contemplating how to best launch the 'Sun-Gun' into orbit. We must balance ambition and prudence: how large will the orbital mirror be, and how fine-tuned its albedo, without running the risk of design failure? Yet, without indulging our ambition we shall not achieve godlike status, and so it's best we hurtle like joyful, martial children into the final development of the 'Sun-Gun'. The future awaits! "
 GER_GOR_master_of_light:0 "Masters of Light"
 GER_GOR_master_of_light_desc:0 "Of course, the 'Sun-Gun' name is quite self-explanatory. It is a planetary atmospheric laser gun which, of course, requires a power source... Also self-explanatory, we will use the power of the sun itself to annihilate our ideological opponents. The foundational technologies of solar and focused-energy technology are known to us; what is needed is a massive increase in scale. To this end, we shall invest considerable resources into laser and solar technology research & development to ensure the success of the 'Sun-Gun'. (We will also pump up the threatening rhetoric - never let it be said that we neglect the stick for the carrot...)"
 GER_GOR_the_sun_gun:0 "The Sun Gun"
 GER_GOR_the_sun_gun_desc:0 "The time has come, and like Icarus before him Deutschland shall ascend into the heavens! After a considerable time of continued research, attempts & failures (and multiple failures and brushed-off instabilities), we will finally achieve the goals of Führer Hermann Göring and propel the Großgermanisches Reich into an unstoppable military force whilst also achieving superpower status once more in the eyes of the world. Indeed, the time has come for the Aryan race to claim its rightful position as the highest race on this Earth.\n\nPrepare the main panel network, Herr Doktor. Single-network ignition.\n\nYou may fire when ready."
 GER_GOR_Sonnengewehr_directive:0 "Sonnengewehr Führer Directive-02"
 GER_GOR_Sonnengewehr_directive_desc:0 "How in the hell could this have occurred? We failed, the Großgermanisches Reich was unsuccessful in its attempts to successfully launch & commence formal 'Sun-Gun' operations. A true tragedy for the German nation. Führer Göring is, understandably, deeply dissatisfied with the GRWI lack of foresight with regard to the now-obvious impracticality of the 'Sun-Gun'. He has ordered that all files & departments associated with the failed 'Sun-Gun' be figuratively 'burnt', with all men stationed being 'repositioned' elsewhere within the GRWI to work on less intellectually challenging projects for the Reich. Of course, this was the fault of the GRWI, not of the Führer's leadership - and anyone who dares suggest otherwise WILL BE DEALT WITH SEVERELY."
 WORLD_REICH.303.t: "[Get_newspaper_header]Führer Göring Announces Sweeping New R&D Program"
 WORLD_REICH.303.desc: "In a fiery speech today at Heidelberg University, the Führer announced a new approach towards the Reich's factionalistic research and development programs.\n\n\"We have already proven the justness and the certainty of our cause. None will ever again think of moving against the rightful Führer!\" Göring declared, \"We have rooted out the traitors wherever they may have hid, and now all we have to concern us are the mongrel states of the Americans and the Japanese. But we lack the tools and the weapons to oppose them, we have allowed ourselves to fall behind in the technological arms race! We became complacent and decadent! We were the first to the bomb, we were the first to the Moon, and now we have squandered that advantage! We will resume our rightful place as the masters of all technology, not just in Europe, but the entire world!\""
 WORLD_REICH.303.a: "Never again will Germany lag behind the rest of the world!"
 WORLD_REICH.303.b: "We might need to start investing some more ourselves..."
 WORLD_REICH.303.c: "Who cares?"
 WORLD.603.t:0 "[Get_newspaper_header]Nuclear Incident In Frankfurt"
 WORLD.603.desc:0 "Today the German City of Frankfurt was rocked by a large explosion, believed to have originated within the newly commissioned and built Nuclear Power Station. The Associated Press believes that it was the result of a Meltdown and Explosion within the station's Number Four Reactor according to an exclusive source from within the German Reich.\n\nWhile catastrophic damage has been inflicted to the southern portion of Frankfurt, the radiation cloud may drift over parts of Burgundy, France and Switzerland if the wind changes direction within the next 48 hours. The death toll from the incident is alleged to be reaching the thousands, and millions are displaced from the city. The German Reich is denying any such incident, and blames the work of \"Anti-German Rebels\" for the destruction of the power plant."
 WORLD.603.a:0 "And now for the weather, Jimmy, are we doomed?"
 goering.science.1.t:0 "Founding of the GRWI"
 goering.science.1.desc:0 "The banquet hall was packed with dignitaries from all over the Reich. Scientists from Frankfurt, engineers from Danzig, physicists from Germania, and many others. The food was good and the conversations riveting, but all eyes were focused on the stage and the podium that stood upon it. After all, the man speaking tonight- the Führer himself - was the main attraction. So when the Führer, clad in his finest uniform, stepped up to the podium, he did so to thunderous applause.\n\nHe began, \"My fellow Germans, it's an honor and a pleasure to see so many of you here today. I look around this room, and I see the best and brightest of Germany- those who both advance our Reich's technology- both military and civilian- while staying true to our ideals. However, for years, our progress on the scientific front has slowed. The Reichsforschungsrat, which I know you all love-\" A ripple of laughter rolls through the audience. \"-has been bogged down for years under an endless weight of political obstructionism, corruption, and the creeping tide of unchecked Judeo-Bolshevik influence.\"\n\n\"No more! The age of progress has returned to German science. With this new, centralized ministry that we have created to replace the bloated corpse of the Reichsforschungsrat, led by the watchful gaze of my esteemed colleague and good friend, Werner Osenberg-\"\n\nOsenberg walked on stage, to loud applause. He waved to the crowd as he took his spot next to the Führer, who's smile spread across his face. \"-Germany shall once again be at the forefront of technology! Drink well tonight, friends, for today we celebrate the founding of the GRWI!\"\n\nThe room shook with cheers and applause as Osenburg and Göring shook hands, making sure to smile for the cameras."
 goering.science.1.a:0 "A brilliant step forward!"
 goering.science.2.t:0 "Centralized Civilian Research"
 goering.science.2.desc:0 "The field of civilian research isn't as interesting or as supported as the various military branches of the Großdeutscher Reichsrat für wissenschaftliche Innovation, but the general secretary is treating as they would a real problem. Some of the civilian research divisions are still holding out though, refusing to share their design work with the rest of the GRWI.\n\nThe General Secretary wishes this situation to be resolved, but involving the Führer would result in a maximum force solution, and someone would likely be arrested or shot."
 goering.science.2.a:0 "Get Göring on the telophone, he will break them!"
 goering.science.3.t:0 "The Feldgrau Debate"
 goering.science.3.desc:0 "Remer stared across the table towards Osenberg. In between them, the members of the committee shifted nervously in their seats. It had only been a few weeks since the founding of the committee, and already its two heads seemed to be in direct opposition to each other. Nobody was really surprised by this development, but for it to have happened this quickly? Not a good sign for the future.\n\n\"Generalleutnant Remer, I don't see why the Feltgrau we currently used must have such a sweeping overhaul. It has proven capable in the field. Such a motion seems like a simple waste of time to me.\" Mumbles of agreement rippled through the civilian side of the table, as Osenberg leaned back in his chair. Remer scowled and leaned into the table.\n\n\"Do you not understand that we must advance in all fields, Herr Osenberg? The Reich must lead the world on all fronts, not just weaponry. If our men are not hidden, what use is their weaponry, or their machinery? No, we must forge ahead, no matter the cost. You look too much at the Reichsmarks and not enough at the materials, Osenberg. I know many of our highest ranking military men would approve of such a change, and they know the art of war more than you, if I may say so.\" Chuckles and clapping from the generals. Osenberg did not move.\n\n\"Generalleutnant, I just don't see the point of it. Nobody except for the OKH and yourself is clamoring for a change. This will cost millions to research.\"\n\n\"Well, why don't we put it to a vote then? See what this committee thinks. That is the point of it, is it not?\" Remer smiled."
 goering.science.3.a:0 "The project is passed!"
 goering.science.3.b:0 "The project is struck down!"
 goering.science.4.t:0 "Centralizing The Military"
 goering.science.4.desc:0 "Every day, dozens of letters and papers would pile upon the Führer's desk. Every day, he went through them, glancing over each small complaint. However, there were two letters in particular that Göring was waiting on- a letter from the OKH, located in Germania, and a letter from the Kriegsmarine, located in Theoderichshafen . When the two came in one day, Göring sidelined all other priorities to read them.\n\nIt had been quite the pain to wrestle the two high commands into handing over their R&D departments. While Schörner's followers seemed more than eager to get started on their projects, Schörner himself was uncharacteristically cautious on the matter, attempting to convince his followers to not dive headlong into their projects. Göring sighed at the thought of it- it seemed Schörner had at least seen that there was something going on behind the scenes. Hopefully, thought Göring, his heart will win out over his brain.\n\nSimilarly, much of the Speidelite faction seemed happy enough to gain more control over research efforts, but Speidel seemed to be suspicious of such a blatant move to placate the military. Göring had to give credit where credit was due- Speidel was no slouch when it came to brains, and he could tell that Göring was not showing his full hand.\n\nIn any case, both branches had been quite evenly split on their support or opposition to the GRWI. Perhaps it was why these letters had taken so long to arrive. In any case, Göring hoped for the best as he tore the first one open. For once, he'd be doing the trickery, and not the other way around."
 goering.science.4.a:0 "Let's hope all goes well."
 goering.science.5.t:0 "The Heer Declines"
 goering.science.5.desc:0 "To the glorious Führer, Hermann Göring,\n\nWe here in the OKH have given serious thought to your request. We would like to point out that our Research and Development Department is one of the best in all of Germany, and does not need additional oversight from the civilian government. Despite Herr Osenberg's arguments, we do not believe that we need to give up our Research and Development Department for increased efficiency when it is already such an efficient and organized part of the Heer. As such, we are afraid that we must decline your request to us to transfer our research department to you. I would personally like to point out that-\n\nGöring snorted and slid the paper to the side. The Heers research department, efficient and organized. What a joke. Göring knew that was a lie, Schörner knew that was a lie, but apparently the rest of the Heer's heads did not. Whatever Schörner had said to get his point across, it clearly had worked on those fools. This was no fatal blow- Göring had the time, patience, and money to get what he wished for, even through somewhat extralegal measures, but it would certainly put a dent in military research. The Führer sighed before turning to the next letter, hoping it would be more positive than the last."
 goering.science.5.a:0 "Let's hope this is good."
 goering.science.6.t:0 "The Heer Agrees"
 goering.science.6.desc:0 "To the glorious Führer, Hermann Göring,\n\nWe here in the OKH have given serious thought to your request. We would like to point out that our Research and Development Department is one of the best in all of Germany, and does not need additional oversight from the civilian government. However, Herr Osenberg has argued his point strongly, and it appears that our heads have elected to hand over our Research and Development Department to the GRWI. Herr Osenberg has promised that our projects will be high priority for this new department, and we trust that you will follow through on your subordinate's claims. I would personally like to caution you on-\n\nGöring tossed the letter to the side in triumph. He didn't need to read the rest- undoubtedly a tirade from Schörner himself, angry that Göring had outmaneuvered him and not the other way around. It did not matter, and Göring did not need to trouble himself with such negativity. Instead, he moved his hand to the next letter- the one from Theoderichshafen - and opened it. Hopefully, he thought, it would be as positive as the last."
 goering.science.6.a:0 "One of them sees reason, at least."
 goering.science.7.t:0 "The Kriegsmarine Declines"
 goering.science.7.desc:0 "To the glorious Führer, Hermann Göring,\n\nThe Kriegsmarine has taken your request with the seriousness that it deserves. After all, such a major change to our Research department would require much work, bureaucratic change, and a lot of money spent on organization. There is also some consternation at your true reasons for this change- some of our admirals seem to believe this is but an attempt to placate the military. Despite Herr Osenberg's arguments to the contrary, we in the High Command of the Kriegsmarine have decided to decline your request unless Admiral Horst von Schroeter is allowed to oversee all naval research, on the basis that this maneuver seems to bring no tangible benefit and would only cost more to us than benefit-\n\nGöring sighed again as he threw the second letter to the side. Speidel's clique had seen through the disguise, at least partially. Without the Kriegsmarine on board, Göring's opportunities to play the militarists would be limited. A temporary setback, for sure- Admiral Schroeter is no political mastermind, and can easily be subverted- but one that was frustrating and would slow the plan's progress, nonetheless. Göring decided to get his drink alone today- Werner would have to work to make up for his failure to deliver."
 goering.science.7.a:0 "How unfortunate."
 goering.science.8.t:0 "The Kriegsmarine Accepts"
 goering.science.8.desc:0 "To the glorious Führer, Hermann Göring,\n\nThe Kriegsmarine has taken your request with the seriousness that it deserves. After all, such a major change to our Research department would require much work, bureaucratic change, and a lot of money spent on organization. There is also some consternation at your true reasons for this change- some of our admirals seem to believe this is but an attempt to placate the military. However, Herr Osenberg's arguments have resonated throughout our highest officers. As such, we have decided to acquiesce to your request, and the Kriegsmarine's research facilities will be transferred into the GRWI's administration. We would like to note that-\n\nGöring tossed this letter to the side to join its Heer counterpart and smiled. The pieces were all coming together. Soon, the Kriegsmarine's resources would join the GRWI's, and then the plan could truly begin. As he rose to get his overcoat, he decided that it was a good day to find Werner and get another drink together. The man deserved it for his efforts."
 goering.science.8.a:0 "Brilliant!"
 goering.science.9.t:0 "The Zossen Arms Conference"
 goering.science.9.desc:0 "Today the Heer met at the proving ground outside of Zossen along with the Führer and select members of the Großdeutscher Reichsrat für wissenschaftliche Innovation to discuss weapon innovations. Select weapons manufacturers are also demonstrating their new designs.\n\nRheinmetall-Borsig demonstrated an improvement on a design being worked on during the war, the High-Low Pressure System which has allowed them to create a 40mm projectile that can be fired by an infantryman. In conjunction with Mauser they have also demonstrated a grenade machine gun capable of halting an infantry assault dead in its tracks and inflicting serious damage to trench lines.\n\nHugo Schneider AG have demonstrated a design of a wire guided anti-tank missile launcher light enough to be moved by infantry forces. The new missile is accurate out to one and a half kilometres and capable of destroying any decadent capitalist tank on a clean hit."
 goering.science.9.a:0 "Rheinmetall and Mauser have the right Idea!"
 goering.science.9.b:0 "Hugo Schneider's missile design is what we need!"
 goering.science.9.c:0 "Every time I hear the word 'Finance' I reach for the Luger, adopt both designs immediately!"
 goering.science.10.t:0 "委员会的首次会议"
 goering.science.10.desc:0 "“欢迎各位参加装备评估委员会的首次会议。”室内响起礼节性掌声。围坐在长桌旁的科学家、将领与官僚们凝神聆听奥森贝格的发言。掌声渐息时他嘴角含笑，德国的科学事业终于要按他的构想步入正轨了。“请以同样热烈的掌声欢迎共同主席兼我的同事，奥托·雷莫中将。”雷莫起身时获得的掌声规模相当，但明显集中在将领席。奥森贝格维持着微笑，细看却能察觉几分勉强——这位舍尔纳安插的眼线注定会成为科研事业的绊脚石。世间安得双全法，他暗自叹息。\n\n待掌声平息，奥森贝格继续道：“首个议题是关于制式步枪。问题不在于现有枪械质量，而在于列装数量。前线仍有大量士兵配备旧式步枪，甚至有报告称部分部队还在使用G43半自动步枪。这种状况必须改变，但解决路径有待商榷。我建议抽调驻防部队武器填补缺口，同时投产新枪，用新型号逐步替换旧型号。虽不能彻底解决问题，却是最经济的方案。赞成的请表态。”\n\n四周泛起低声议论。奥森贝格冷眼旁观，他本就不指望提案能获全票通过。但当雷莫起身时，他仍忍不住轻叹。\n\n“恕我直言，奥森贝格先生。”雷莫咧着嘴反驳，“我国的荣耀之师岂能继续使用次等装备？我们必须以压倒性火力优势碾压敌军！我提议不惜代价调集资源，为全体士兵换装最精良的武器。绝不能让小伙子们端着栓动步枪送死！”\n\n全场掌声雷动。待声浪平息后，委员会进行了首次表决，这场没有硝烟的战争即将见分晓。"
 goering.science.10.a:0 "雷莫胜出！"
 goering.science.10.b:0 "双方达成妥协。"
 goering.science.10.c:0 "奥森贝格胜出！"
 goering.liger.1.t:0 "狮虎坦克研发启动"
 goering.liger.1.desc:0 "首席工程师忐忑不安地注视着德国科学界两位最具权势的人物审阅他团队的设计方案。两人的目光始终没有与他交汇，而是紧盯着铺在桌上的蓝图，仔细检视构成这辆坦克的每道线条与参数。奥森贝格的目光突然钉在那个名字上——狮虎坦克。\n\n“根据团队评估，我的元首，这将是辆理想的坦克。”一位科学家结结巴巴地说，“它兼具卓越的机动性、惊人的速度，以及足以摧毁一切美日坦克的火力。若项目获批，我保证这将极大增强我军实力。”戈林没有回应这些溢美之词，转而看向始终沉默的奥森贝格。\n\n“奥森贝格先生，你对此设计有何高见？”戈林问道。\n\n“糟透了。”奥森贝格从鼻腔里哼出一声。\n\n“具体说说？”戈林追问。\n\n“见鬼，赫尔曼，你睁眼看看这破玩意儿。双主炮？脆弱的装甲？超标的重量？体型比虎式还庞大，实用性却连虎式一半都不到。根本一无是处。”\n\n科学家刚要辩解，戈林便挥手打断：“不不不，维尔纳，你显然没看出其中的潜力。这不过是蓝图阶段，连原型车都不是吧？”没等对方回答，戈林继续道：“缺陷固然存在，但我看到了无限可能。想象一下美国人被七十公里时速的双炮重型坦克碾过时的表情？”他首次在会议中直接对工程师发话：“让你的人立即着手狮虎坦克的研发。我对你们充满信心，陆军正翘首以盼。”\n\n工程师挤出“遵命，我的元首”时，奥森贝格泄出一声几不可闻的叹息。"
 goering.liger.1.a:0 "未来就在眼前！"
 goering.liger.2.t:0 "发动机问题"
 goering.liger.2.desc:0 "一名工程师捧着一摞文件走进奥森贝格的办公室。奥森贝格示意他放下那些文件时，后者径直地把它们往办公桌上一扔。维尔纳叹了口气，手指插进发间梳理——他敢打赌这些烦心事让自己本就稀疏的头发掉得更快了。“出什么问题了？”他问道。\n\n“我们在改进狮虎坦克原型时遇到了小麻烦。发动机是改进过了，功率更大，速度更快，能让坦克行进速度提升。”\n\n“代价呢？”奥森贝格追问。他其实已经猜到了答案，但还是想听对方亲口说出来。\n\n“生产这种新型发动机需要更多时间和资金。您要是拒绝，我们会尽力简化旧款发动机的生产流程，但坦克速度恐怕会……打点折扣。”\n\n奥森贝格再度叹息。他仿佛已经看到未来：狮虎坦克沦为烧钱的无底洞，而所有骂名都由他来背负，哪怕他一开始就反对这个项目也没用——戈林那家伙再跟他称兄道弟也绝不会替他背锅。当然，如果能投入足够资金持续研发，或许狮虎坦克的根本缺陷还有修正余地，至少能有所改善。谁知道呢，说不定真能捣鼓出个像样的东西。申请追加预算和延期的过程肯定令人头疼，但若能挽救整个项目，或许值得一试。\n\n奥森贝格转向来人，心中已拿定主意。就在他开口的瞬间，他意识到这绝不会是最后一次接到此类请求。"
 goering.liger.2.a:0 "“我会提供资金的，去干活吧。”"
 goering.liger.2.b:0 "“继续用旧的可以吧？”"
 goering.liger.3.t:0 "装甲问题"
 goering.liger.3.desc:0 "工程师又捧着一摞文件回到了奥森贝格的办公室。正喝着今日第二杯酒的奥森贝格用冰冷的目光扫了他一眼，将酒杯重重搁在桌上。“又出什么幺蛾子了？”他瓮声瓮气地问。\n\n“我们遇到了新的技术瓶颈，奥森贝格先生。针对您提出的装甲问题，我们研发出了新型复合装甲方案。”工程师用排练过般的平稳语调回答，“采用这种装甲后，您担忧的防御短板将得到显著改善。”奥森贝格暗自揣度，这人究竟是提前演练过说辞，还是天生就带着这种机械般的腔调——搞技术的大概都这德性。\n\n“让我猜猜。”奥森贝格整个人陷进皮椅里，“要量产这种新装甲又得追加预算和工期，然后我又得去元首跟前摇尾乞怜讨要马克？”\n\n工程师的节奏被打乱了，结巴起来：“呃，差、差不多是这个意思。如果经费不到位，我们只能在现有条件下尽力而为，但装甲的防护效能——”\n\n“会大打折扣，是是是，这还用说？”奥森贝格烦躁地揉着太阳穴，“说真的，号称终极坦克设计却要反复返工，你们不觉得讽刺吗？”\n\n“可当初是您签批的方案，长官。”\n\n奥森贝格懒得再解释这场闹剧的来龙去脉。"
 goering.liger.3.a:0 "“知道了，回去继续鼓捣新装甲吧。”"
 goering.liger.3.b:0 "“钱投得够多了，活用现有的。”"
 goering.liger.4.t:0 "火炮问题"
 goering.liger.4.desc:0 "奥森贝格将工程师递来的文件重重摔回桌上，仰头灌尽杯中残存的威士忌——天知道他此刻多需要这口烈酒。“所以现在连火炮都出问题了？这该死的铁疙瘩还有哪处是完好的？”他朝工程师喷吐着毒液，对方的瞳孔瞪得如餐盘般大。\n\n“火、火炮目前基本功能正常——”工程师结结巴巴地回答，从未见过素来冷静的奥森贝格如此暴怒。\n\n“那你他妈来这儿干什么？！”奥森贝格咆哮着将报告揉成纸团砸向对方，纸团掠过工程师头顶无力地坠落。\n\n“容我解释，奥森贝格先生。现有火炮无法击穿敌军最重型坦克的装甲。若能升级改造，我们的火力将不逊于美日任何现役装备。”工程师语速飞快地灭火，这番说辞总算奏效，奥森贝格深吸一口气坐回椅中。\n\n“刚才失态了，见谅。所以你是来申请新火炮研发资金的？”他嗓音仍带着几分不快。\n\n“正是，奥森贝格先生。旧火炮当然可以继续使用，既不额外耗费预算也不耽误工期。但新型火炮能让狮虎真正所向披靡。”\n\n奥森贝格强压住笑意，方才的勃然大怒已够难堪，现在再突然转喜怕要被当成疯子。况且新火炮或许真能拯救这个烂摊子。他沉思片刻终于开口："
 goering.liger.4.a:0 "“行，好好干。”"
 goering.liger.4.b:0 "“别一天到晚瞎折腾了。”"
 goering.liger.4.c:0 "“行，好好干。”"
 goering.liger.4.d:0 "“别一天到晚瞎折腾了。”"
 goering.liger.4.e:0 "“行，好好干。”"
 goering.liger.4.f:0 "“别一天到晚瞎折腾了。”"
 goering.liger.4.g:0 "“行，好好干。”"
 goering.liger.4.h:0 "“别一天到晚瞎折腾了。”"
 goering.liger.5.t:0 "狮虎的首次测试"
 goering.liger.5.desc:0 "“这就是传说中的的狮虎坦克？”\n\n“是的，我的元首。”\n\n戈林像观察真正的猛兽般审视着这只钢铁巨兽，目光在车体、乘员组以及前部并列的两门105毫米火炮间游移。他的视线在炮管上停留最久，仿佛已看见它们将美军坦克撕成碎片的场景。三位负责原型车测试的成员紧盯着元首，只见他绕着坦克缓缓踱步，不放过任何细节。最终元首向副官打了个手势，官员们便集体移步至附近的山丘，那里将成为观摩试车的观礼台。\n\n引擎轰鸣，坦克在测试场疾驰。戈林举着望远镜全神贯注地追踪每个细节，时而对身旁的工程师低声赞叹坦克的迅捷，时而评价其威猛的外形。但随着测试推进，这些溢美之词逐渐消失了。\n\n看似威猛的狮虎坦克在后续测试中尽显疲态。尽管配备两门主炮，其射击效率却勉强与豹式持平。先前还咆哮着冲锋的引擎开始喷吐黑烟。致命一击来自最后的射击测试——第一门火炮开火时，整个炮架直接被后坐力掀飞，翻转的炮管瞬间撕裂车顶，最终砸进泥沼。随之而来的爆炸将驾驶舱与三名倒霉的乘员彻底吞噬。\n\n首席工程师本能地望向元首。戈林此刻的眼神已冷若冰霜，那目光仿佛能穿透灵魂。他未发一言便率众离去，只留下工程师们收拾这场物理和事业双重意义上的残局。"
 goering.liger.5.a:0 "没事，只是原型车……"
 goering.liger.6.t:0 "简短会面"
 goering.liger.6.desc:0 "“我早说过这行不通，赫尔曼。我他妈警告过你。而你却置若罔闻。”奥森贝格又啜饮了一口酒，重重放下酒杯。元首本人坐在办公桌后批阅文件，始终回避他的目光。“这简直是场灾难。那坦克根本就是废铁。”\n\n“我知道，维尔纳。但现在不是追责的时候。”赫尔曼的回应比预想中平静，这种语调让奥森贝格愈发恼火——难道他还没意识到事态严重性？\n\n“你说得轻巧！这可是要掉脑袋的事，赫尔曼！”奥森贝格仰头灌尽杯中残酒。赫尔曼突然陷入沉默，目光涣散得像是猝死了般。令人窒息的停顿后，那双眼睛才重新聚焦：“听着，整台坦克都是按照舍尔纳和雷莫的构想……”\n\n奥森贝格发出嗤笑。果然又要推诿责任。直到看见戈林骤然冷厉的眼神，他才噤声。“下周阅兵式公开展示狮虎坦克。让舍尔纳和雷莫发表演说，把他们和项目深度绑定。等坦克故障百出的消息传开，我们就指出这是他们的主意，是他们的心头好。届时他们出丑，我们全身而退。皆大欢喜，如何？”\n\n沉默再度蔓延。奥森贝格用不满掩饰着震惊，他没想到戈林竟然有如此急智。“行，就这么办。但下次他们再出什么天才点子时，你最好记住今天的话。”抓起大衣转身离去时，他脑内翻涌着愤怒的漩涡。"
 goering.liger.6.a:0 "切不可外传。"
 goering.liger.7.t:0 "进击的狮虎"
 goering.liger.7.desc:0 "“现在，有请我敬爱的上级、德国人民的英雄，费迪南德·舍尔纳元帅！”\n\n雷莫将舍尔纳迎上主席台时，人群爆发出震耳欲聋的欢呼，奥森贝格也随众人一同鼓掌。他的座位紧邻讲台右侧，能清晰看见元帅的一举一动。他表面维持着微笑佯装聆听演讲，内心却早已被恐慌撕得粉碎。\n\n迄今为止，他与戈林精心策划的方案看似进展顺利，但任何一个环节都可能崩盘。倘若舍尔纳察觉真相，后果将不堪设想；若计划泄露，更会让戈林政府颜面扫地。即便一切按部就班，若舍尔纳与雷莫成功嫁祸于人呢？责任终将追究到科创委甚至他本人头上，届时又将陷入新的泥潭。更何况，向军方隐瞒狮虎坦克的缺陷已让国家付出多少代价？收买众多知情者耗费巨资，谁又能保证没人告密？\n\n奥森贝格突然察觉周围目光聚焦在自己身上，猛然从思绪中惊醒。掌声与舍尔纳的演讲声交织中，他看见元帅正指向自己——想必是在褒奖他的功绩。他迅速重拾笑容向舍尔纳挥手致意。四目相对的刹那，奥森贝格在元帅眼中捕捉到超越礼节性赞许的深意。或许只是多疑，但那目光仿佛洞悉了一切。"
 goering.liger.7.a:0 "计划继续。"
 goering.science.11.t:0 "Performance Enhancing Drug Program Begins"
 goering.science.11.desc:0 "The first deployment of the Staatsplan 15.24 began today at a classified location with men of the elite Fallschirmjäger. The program consists of a number of serial injections of highly classified drugs containing multiple types of hormones such as Steroids. The men will be observed over the next week to ensure that they are coping with the administration of the drugs, before the next batch of soldiers undergoes the same process. Already in performance tests the doped soldiers are running faster and lasting longer than the control group!\n\nSome members of the Wehrmacht have expressed their doubts about the program, citing health risks to the soldiers. The Führer has ignored these complaints and ordered the program to continue."
 goering.science.11.a:0 "The German Grenadier will be able to take on any amount of Subhuman Soldiers single handedly with these new stimulants!"
 goering.science.12.t:0 "Side Effects"
 goering.science.12.desc:0 "Doctors observing the Staatsplan 15.24 deployment are reporting a number of side effects both physical and mental in soldiers undergoing the experimental treatment. Test subjects are reporting withdrawal like symptoms when the drug injections are delayed, others are becoming violent and irrational with at least two soldiers forcibly removed from the program for treatment at a nearby asylum.\n\nThe Großdeutscher Reichsrat für wissenschaftliche Innovation has advised that the program be halted immediately, citing the risk to German soldiers. While a small group of researchers believe that if the program is not terminated, a more stable version of the drugs could be found and implemented. The Führer is attending an emergency meeting with the GRWI, after which a decision will be handed down."
 goering.science.12.a:0 "Terminate the program, it is not worth the risk!"
 goering.science.12.b:0 "Damn it, cover these accidents up and keep going!"
 goering.science.13.t:0 "Chemicals In The Water"
 goering.science.13.desc:0 "\"You can't be serious about this.\" Osenberg slammed the report down on Göring's desk. The Führer himself looked particularly unimpressed with the show. \"Putting drugs in the water? Are you kidding? The people will go mad, and not because of the drugs- they'll come for your head!\"\n\n\"Herr Osenberg, please remember that this is a military idea. I simply see potential in it. You know as well as I that these drugs worked wonders on our soldiers-\" Göring began, his voice remaining steady. Osenberg cut him off forcefully, raising his voice.\n\n\"Giving a couple soldiers injections of drugs and pouring drugs into the water supply are completely different things, Hermann! Christ, you aren't dumb enough to really think this will have an effect, are you?\"\n\nBy now, Osenberg was yelling, and anger flashed across the Führer's face as he motioned for silence. \"You don't understand, Werner. This is a military idea. Now, we could use it to help pacify the eastern RK's, as is theorized, but we could also use this in military areas- urban, industrial areas, perhaps- to help with productivity, maybe get the army to help with that. Of course, if this happened to leak to the press, it would be a total disaster for Schörner and his men, and we should take every step we can to prevent that. Are you following me?\"\n\nOsenberg stared incredulously at his friend, and the subtle rift that had grown between the two cracked open a little wider. \"Hermann, do you even believe what you're saying yourself?\"\n\n\"I'm not asking for your opinion on me, I'm asking for your opinion on this. Pacify the east or, ah, 'increase production'?\" Hermann responded. The two men stared each other down before Osenberg replied."
 goering.science.13.a:0 "Focus on the RKs"
 goering.science.13.b:0 "Cause a scandal."
 goering.science.14.t:0 "A Slight Increase"
 goering.science.14.desc:0 "Osenberg entered the office with his face drawn and a single piece of paper in his hands- unusual for him. Göring was poring over a document of his own, pen in hand- also unusual. The two regarded each other with a hint of contempt before Osenberg began.\n\n\"I have the resistance reports from Ukraine, my Führer.\" Osenberg stated, his voice cool and collected. Göring looked up and met Osenberg's eyes, the two staring each other down. \"There was a slight increase in partisan attacks in the last weeks.\"\n\nThe words hung in the air like a vulture as Göring looked away from Osenberg and out the window. There was a silence between the two- something becoming all too common these days. Finally, Göring spoke up, still facing the window. \"Is there a correlation between the drugs and the attacks?\"\n\nOsenberg rolled his eyes. \"No, it's within the normal ups and downs of attacks. The issue is that the numbers haven't dropped. There's been no effect. We've spent millions on this for no reason, and now we just look like fools. I've heard some worries from the military about our spending habits. The military is worried about our spending! Can you believe it?\"\n\nGöring waited a moment to respond. \"Can you remind them that this whole operation was their idea?\" He replied. \"In any case, stop the project. We'll refocus elsewhere.\"\n\n\"Yes, my Führer.\""
 goering.science.14.a:0 "We all make mistakes."
 goering.science.15.t:0 "Whispers In The Barracks"
 goering.science.15.desc:0 "It started out as just a rumor from one friend to the next- one that even the friend receiving passed off as ridiculous. Chemicals in the water? That was some conspiracy-level nonsense, on par with believing in lizard-people and thinking aliens are mind controlling our leaders. At first, the rumor died out in the chain, and got no further than a small circle of skeptical friends.\n\nAnd then it cropped up in a different unit, and then another, and then another. Soon enough, these circles began to run into each other, and the theories only grew wilder from there as each realized that, no, they weren't alone. The whispers tore through divisions like wildfire, the theories as to what the drugs were doing growing more and more outlandish by the day. Suddenly, it was thought that Göring was trying to poison his enemies, that Osenberg was setting up for a coup, that Schörner was planning an execution of those who disliked him, that the Jews had infiltrated the highest ranks of the Reich and were planning a mass mind control campaign to destroy Nazism. All of these theories ran almost purely on conjecture and hypothesis, but that was all it took to buffett the conspiracy to even higher levels.\n\nWhen the first reports of the controversy hit Göring's desk, it was already far too late to stop the rumors. Nothing he could say would end the spiraling theories- if anything, they would only make them worse. Worst of all, Schörner undoubtedly had gotten wind of this as well, and had certainly made a plan to blow it all up in the Führer's face. Now, all Göring could do was wait for Schörner's move and deal with the fallout later."
 goering.science.15.a:0 "How did it get out?"
 goering.science.16.t:0 "斯派达尔介入"
 goering.science.16.desc:0 "“他人呢！我要亲自跟他谈！”\n\n斯派达尔怒不可遏的吼声隔着门板都清晰可闻。戈林放下文件绷紧神经——这个决定相当明智，因为下一秒斯派达尔就踹门而入，眼里几乎要喷出火来。这位将军连坐都懒得坐，直接俯身将手指戳到戈林鼻尖前，逼得后者不得不后仰躲避。\n\n“往饮用水里掺兴奋剂是怎么回事，赫尔曼？我亲自带人检测了输水管道，结果发现了安非他命！是安非他命啊赫尔曼！你想让全军士兵都染上毒瘾吗？”斯派达尔的咆哮震得窗玻璃嗡嗡作响。戈林沉默以对，他知道对方早已知晓答案。“连舍尔纳都为此联系了我！你居然能让我和舍尔纳联手，赫尔曼。是那个舍尔纳啊！我和那狗娘养的互相恨之入骨！你知不知道要让舍尔纳和我达成共识有多难？”\n\n“是，我深有体会。”赫尔曼低声嘟囔，视线死死黏在办公桌上一份突然变得异常有趣的公文上。斯派达尔仍在咆哮，但戈林已经充耳不闻——他满脑子都在盘算自己捅了多大的娄子。这已经不是搬起石头砸自己的脚，简直是往脚上扔了颗原子弹。如今斯派达尔和舍尔纳两派联合发难，军队里还有谁愿意相信自己？\n\n办公室门被摔得震天响，独留原地的戈林终于想起奥森贝格当初的警告。他攥紧拳头砸向桌面，恨不得穿越回去掐死那个刚愎自用的自己。"
 goering.science.16.a:0 "事后诸葛亮。"
 goering.science.17.t:0 "Issues With New Frankfurtatomkraftwerk"
 goering.science.17.desc:0 "As part of our new Atomic Energy Initiative, a new nuclear power station was established near Frankfurt. The reactor now supplies nearly 85% of the city's total energy needs, almost completely supplanting former coal fired power stations and hydro-electric power stations!\n\nThe small problem is that radiation emission levels are, ever so slightly too high above what the Großdeutscher Reichsrat für wissenschaftliche Innovation has deemed safe for a reactor of this size. The head of the Atomic Research Department is making some overblown demands that the Reich immediately spend several hundred million Reichsmarks in \"Urgent Repairs\". The Führer however is aware of how the Eggheads operate, and believes that if the money is granted, it will simply vanish into a New Zealand Bank Account, never to be seen again. A decision must be made quickly either way..."
 goering.science.17.a:0 "Maybe for once the Scientists have a point. Authorise the Repairs"
 goering.science.17.b:0 "Bah, Scientists what do they know? Some additional concrete will keep them quiet."
 goering.science.17.c:0 "This budget is far too overblown, give them half and tell them to make do."
 goering.science.18.t:0 "Issues Continue With Frankfurtatomkraftwerk"
 goering.science.18.desc:0 "Once again the Eggheads bleat about \"Toxic Emissions into the Ground Water\" and \"Unacceptable leaks over 125% of what is allowed.\". They are predictably asking for more money for more \"Urgent Repairs\", insisting that if we do not authorise this money then the entire city of Frankfurt is in serious danger. More concerningly is the number of Wehrmacht officers now parroting the same lines as the GRWI. The Führer is being asked to make a decision in a special crisis meeting at the Volkshalle...\" goering.science.18.a:0 \"Shut down the Reactor, clearly the entire plant needs a redesign."
 goering.science.18.b:0 "Authorise some token repairs, if only to make them shut up."
 goering.science.18.c:0 "Authorise the full overhaul, and berate them for half-assing the work the first time."
 goering.science.19.t:0 "Disaster Imminent At Frankfurtatomkraftwerk"
 goering.science.19.desc:0 "According to urgent reports flooding in from the Nuclear Power Plant outside of Frankfurt, the Number Four Reactor is in immediate danger of melting down! The experts at the plant are struggling to contain the situation and prevent a catastrophic explosion that would catapult irradiated debris over the entire city, and produce a cloud of radiation that would spread over most of the German Reich!\n\nThe Mayor of Frankfurt is requesting permission to perform a general evacuation of the city, which will cost millions of Reichsmarks in lost work hours and create havoc and confusion for months. Hardliners of the Greater German Reich On Scientific Innovation have proposed an alternative plan, that a specially chosen team could be sent into the number four reactor to shut down a series of key valves, which would delay the melt down long enough for some emergency repairs to be carried out. With the reactor stabilised, it could be safely offlined for redevelopment."
 goering.science.19.a:0 "Evacuate Frankfurt and prepare for the worst..."
 goering.science.19.b:0 "We cannot allow this disruption, send in the team..."
 goering.science.20.t:0 "The Frankfurt Meltdown"
 goering.science.20.desc:0 "Ealier today, a catastrophic chain of events has lead to a major leak at the Number Four Reactor. Early reports indicate that the reactor is completely destroyed, and containment systems are at roughly 95%, however damage to the roof of the Number Four Reactor was so extreme that some Radiation in the form of contaminated steam has escaped from the Radiation Shields before a team could bring in a helicopter to affect a quick repair. Large parts of southern Frankfurt are being quarantined and the damage is expected to cost 10 billion Reichsmarks to clean over the course of at least twenty five years.\n\nThe Großdeutscher Reichsrat für wissenschaftliche Innovation has at least found a silver lining to the entire incident. Aside from the damage caused to the roof of Reactor Housing Four, the radiation shields worked exactly as intended, and much of the station can be salvaged and repurposed in new reactors elsewhere in Germany."
 goering.science.20.a:0 "Mein Gott..."
 goering.science.20.b:0 "Well, at least we tried..."
 goering.science.21.t:0 "Nothing to Worry About?"
 goering.science.21.desc:0 "FROM REDACTED, RK UKR.\n\nTO GERMANIA, GER.\n\nFOR THOSE WITH LEVEL 5-A ACCESS OR HIGHER. CONTACT YOUR SUPERIOR IMMEDIATELY FOR FURTHER ADVICE.\n\nAt 2300 hours, a commando unit of Ukrainian partisans managed to infiltrate the [REDACTED] Nuclear Power Plant. It is unknown what the overall strategic goals of the mission was, in regards to the plans of the Partisans. It has been suggested that it was some variant of a suicide mission, where a commando unit was to disable or damage the safety system in order to cause a chain reaction within the power plant. This would cause a type of reaction that would expel enormous amounts of radioactive energy into the atmosphere, leaving the surrounding area virtually uninhabitable. In the worst case scenario, these irradiated particles could reach Germania, in less than three months.\n\nThe more likely scenario is that the commando units were simply trying to disable the Power Plant as a whole, to cripple the energy supply of the Reichskommissariat. Whatever the case, the workers of the power plant managed to activate the safety systems, before a critical error could occur. The partisan group did not manage to defeat the reinforcements to the Plant's security, however they could not be captured for interrogation. The current casualty count is six partisan commandos, three security units and fourteen workers. No men from the reinforcements were hurt in the fighting.\n\nWorkers of the Power Plant have reported that the safety systems did not perform to their recommended timescale, and were significantly behind the expected time schedule. Workers have previously  complained of the outdated equipment to their superiors, however nothing was done. One junior worker even reported witnessing 'bits of graphene' across the outside, after the incident (referring to the graphene rods that control the reaction of energy). A thorough investigation was conducted, but no fragments of the rods were located. The junior worker has been taken to the infirmary, to be psychologically evaluated.\n\nHEIL GORING."
 goering.science.21.a:0 "How close were we to a Nuclear Apocalypse?"
 goering.science.22.t:0 "Riding A Dying Stallion"
 goering.science.22.desc:0 "Joseph had always loved the Führer, ever since he had come to visit his classroom as a youth. Hitler had been a great man, of course, but Hermann Göring had always been the man Joseph admired most. His strength and bravery were unmatched, even amongst a nation of Aryans. It was this admiration that had led Joseph to join the Luftwaffe in the first place. And it was this admiration that had led Joseph to perform the gambit he was currently engaged in.\n\nWhen he had passed his stop, they had tried to radio him for half an hour before the calls stopped coming in. There had only been enough fuel to make half of the trip, they told him. Joseph had gauged differently, however. How much glory would it bring him, were he to make the journey himself, against all the odds? To take this equipment to the front lines, just barely performing this important mission before the fuel ran out. Finally, the brave young Joseph would be a hero.\n\nJoseph pictured the Führer, smiling and shaking his hand. A golden medal rested on the imaginary Joseph's chest, as reporters flashed their cameras and asked probing questions about the two. Joseph was perhaps a bit flustered, but Göring was able to answer every one with a laugh and a clap on Joseph's back. His new friend, the Führer said, was one of the greatest Aryans he had ever known."
 goering.science.22.a:0 "The fuel gauge began to beep."
 goering.science.23.t:0 "End Of The GRWI"
 goering.science.23.desc:0 "Göring sat in his office and steamed as the crowd outside continued their incessant shouting. They had been out there for most of the day, ever since that damned report leaked to the press. Göring had tried to suppress the story or force the paper not to print it but the effort was fruitless as word spread first between reporters, then between regular citizens; the Government was spending millions on secret projects to find new weapons of war and had made little progress. In front of him the leader of the GRWI project stood, sweating nervously as he awaited his fate. \n\n'How did this happen?' Göring asked as calmly as possible.\n\n'I don't know, my Führer.' the man said in response, trying but failing to look Göring in the eyes. \n\nGöring stood and turned to the window behind his desk overlooking the plaza now filled with protesters waving signs and making noise, sometimes he wished he could just have them all shot. After a moment of thought he spoke again 'Exactly how much was leaked. What does the public know that they need not to?' he asked without turning around. \n\nThe scientist was quiet for a moment before speaking again 'They know about most things, even the Sun Gun and Liger, including the failures.' he said. 'Damnit.' Göring muttered under his breath 'Fine, i'm pulling the funding. Looks like you just really fucked up. If I were you I'd be lucky to work in a middle school chemistry lab after this. Get out of here. I have work to do.'"
 goering.science.23.a:0 "And so it must go."
 goering.science.24.t:0 "End Of The GRWI"
 goering.science.24.desc:0 "'And in conclusion, I must ask you to close the program -Ferdinand Schorner'\n\nGöring raged as he crumpled the paper and threw it across the room. Somehow that snivelling little rat Schorner had found out about the secret projects Göring had been working on. He also no doubt knew of their many failures. The letter was just a polite way of him telling Göring to shut the program down or face the consequences. Göring could only guess what the implied consequences would be but none of his guesses were particularly cherry. No doubt he would want all the newly freed funds to be shuffled into the army and more than likely his own pockets. For a brief moment Göring entertained defying him, exposing his treachery to the world and then having him hung from meathooks in Dresden but the moment quickly passed and Göring came back to reality. If Schorner took over the Reich then the world was doomed. His projects could wait a bit longer, it's not like science was going anywhere."
 goering.science.24.a:0 "And so it must go."
 goering.science.25.t:0 "Atomic Freak Power at the Circus-Circus"
 goering.science.25.desc:0 "\"You don't 'do' Nazi stories? Who the hell are you, Barry goddamn Goldwater? I don't know how to tell you this, but counter-cultural music focused magazines don't usually get invited to tour German nuclear power plants! I don't know which poor sod in Germania got Rolling Stone confused with the New York Times, but I'm not about to call jolly old Hermann and ask him to revoke our press passes to what very well might be the story of the decade! This magazine is less than a decade old, you know that! We don't have a bigshot Walter Cronkite to send! I know inspecting subatomic particles in Hamburg isn't the same as dropping acid in dead-end mining towns and shouting about Bobby Kennedy, but Fear and Loathing in Duluth made both Hunter S. Thompson and Rolling Stone household names! We need you Hunter!\" Ralph Gleason, founder and editor of the perpetually erudite Rolling Stone magazine swam as an amorphous yellow flesh-being beyond the colored aviators that tightly hung to the face of Hunter Thompson, firearms enthusiast and would-be sheriff of Pitkin County, Colorado. \n\n\"Ralphie, see it my way. I write about biker gangs, freak power, the death of the American dream. I'm not a journalist, I'm a... pseudo-moralist. You don't want me to go to Hamburg, you want to throw me at the NPP primaries. Ship me off to go face-to-face with Herr Doktor Physicist, and I'll say the wrong thing to the wrong person. Poof: there goes America's most dearly beloved iconoclast. Don't send the dopefiend Mark Twain, send Bill Hearst.\"\n\n\"I don't know how many other ways to say it! We don't have a Hearst! We have you, Hunter! Didn't you say that the Michigan International Speedway was 'what the whole hep world would be doing Saturday night if the Allies had won the war'? Well prove it! Go to Germania, please. Do this for me and Rolling Stone will furnish one story of your choosing, no holds barred.\" No holds barred? That could mean a great deal of things. A return to Aspen, perhaps? Special access to the White House? It was a tempting offer."
 goering.science.25.a:0 "\"Damn it Ralph, buy me a Lufthansa ticket.\""
 goering.science.26.t:0 "Keeping Time"
 goering.science.26.desc:0 "Relief. That was the word for this feeling.\n\nHermann Göring released a huge sigh as he put the copy of today's Das Reich down on his rich mahogany table taken from some minor European noble. The first stories about German nuclear power had hit the pages of all of the newspapers that had been invited to tour the new nuclear power facilities. Though a menagerie of language and grammar, they all expressed similar ideas-- the new generation of nuclear plants were safe, efficient, and expertly run.\n\nIt was unsurprising that Das Reich would report favorably on this new initiative - Göring would have had the editor shot and the reporters conscripted if they hadn't - but Das Reich was no longer good enough for much of the young, educated, liberal (Göring shuddered at the word) population. Through means unknown to him, the New York Times was the paper of choice for university students across the Reich, and seeing their precious judeo-bolshevik rag report favorably on one of the government's key new projects has convinced many of them that, yes, perhaps the Führer didn't just fall into his position by blind luck.\n\nIt was a shame that an American publication held this much sway over the German people-- the idea that public opinion (and thus Göring himself) would be beholden to a newspaper from New York City of all places disgusted Göring. The only way it could be worse is if Pravda replaced Völkischer Beobachter. Even still, he couldn't be too angry at the Times. After all, they had said exactly what he had hoped they would; the way had been paved for even more nuclear power."
 goering.science.26.a:0 "The printing press is perhaps more powerful than the atom."
 goering.science.27.t:0 "Fear and Loathing in the Adolf Hitler Power Plant"
 goering.science.27.desc:0 "German Nuclear Power is Decadent and Depraved: Nuclear physics is not as hard as the eggheads make it out to be. There is no process involved that an amature cannot and should not figure out on their own as part of an enjoyable weekend hobby. The fact of the matter is that the scientists in Vienna are just the same as the scientists in Albuquerque-- they're mousey-faced geeks who compensate for a lifetime of bullying by obscuring their work behind terms that you have to pay MIT to learn. This is why I have always argued that Americans must come together and deport all of our geeks, eggheads, scientists, nerds, and savants to the heart of fascist Europe where they may be more at home with their anti-democratic ways.n\nThis may be unfair to the scientists however. After touring the German nuclear power facilities, I am of the opinion that perhaps nuclear power is best kept to the hobbyists in the first place. The heartless fascists uncovered and confiscated my stash of freedom, liberty, and psychoactive substances at the border, and thus I was woefully sober as we were marched through the newest and most cutting-edge power plants the Germans had. The concrete, recently and improperly set, already was webbed by cracks. Nearly every control room had visibly exposed and arcing wiring. One lead technician at the Adolf Hitler Nuclear Power Plant expressed to me in excited, broken English that he had been hired directly out of the army with no previous experience. Notably to me, his last name was Remer. I was assured there was no relation. I am doubtful.\" Hermann Göring slammed the glossy magazine down in disgust.n\n\"Just who the hell is 'Hunter Thompson' anyway? Which block headed fool in the foreign ministry invited a judeo-bolshevik to tour our plants?\" At the least, it was unlikely the average German read the Rolling Stone. And after Thompson's little flight of fancy, any German that did read it would be arrested and shot! In his heart, however, Göring knew the damage was done. Nearly every single publication that published a piece after visiting the new plants said the same things. \"Unsafe\". \"Ecological damage\". \"Severe risk\". \"Meltdown\". They could ban the Rolling Stone, but information will always seep in. It's harder to block a story when everyone from the Washington Post to the Daily Mail to Nihon Keizai Shimbun are all saying the same things. Public outcry was building, and all the Führer could do was hope that the protests didn't turn into riots."
 goering.science.27.a:0 "I hate to advocate nuclear power, but it worked for the people of Pearl Harbor."
 goering.science.28.t:0 "Walking off the Job"
 goering.science.28.desc:0 "When Göring had conceptualized the Conference for Nuclear Power, he had imagined a triumphant showing of the ingenuity and skill of German science - one which would put to rest any fears there were of nuclear energy, as well as show to the world that German science was not to be underestimated. \n\nA goal which had backfired in such a spectacular way that he was almost in awe.\n\nHe had a nagging feeling that if he hadn't personally gone to the conference, then he'd be reading reports of a disaster in the facility. It was only thanks to a few of the workers who'd actually stayed that the reactor hadn't overheated and potentially melted down. A disaster had been averted, but the fallout was very real. \n\nThe chaos, the shoddy facility, the rebellious workers, and culmination in the evacuation had killed any opportunity to calm the fears workers, soldiers, and civilians had of nuclear power.\n\nAfterwards, he'd ordered an explanation for what had happened. The aides had been reluctant to share, and now he knew why, with the context before him. He was partially amazed that there hadn't been other incidents before now. All of the scientists and staff had been complaining of low wages, bad equipment, and the reactor itself being poorly funded, to the point where the people at the facility wanted no part in the stunt. \n\nThey would be dealt with, of course, but Göring could not help but think he had a very particular problem on his hands. One that put the entire future of the nuclear program in question."
 goering.science.28.a:0 "This was very bad."
