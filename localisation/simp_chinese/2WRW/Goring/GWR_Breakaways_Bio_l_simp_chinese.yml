 POLITICS_DENNIS_SKINNER_DESC:0 "伦敦有很多人担心，德国的政变会引发英国的第二次内战。尽管HMMLR的残余势力如许多人所料再次崛起，但合作政府对此几乎没有任何抵抗。在亚瑟·哈里斯的带领下，新抵抗运动进军伦敦，发动了一场几乎不流血的政变，推翻了德意志帝国的傀儡政府，建立了自主政权。\n\n全国矿工工会主席丹尼斯·斯金纳被选为首相。斯金纳是英国普通民众的代言人，也是比尔·亚历山大心照不传的支持者，他的知名度和能力足以被视为英格兰抵抗运动的理想象征。然而，斯金纳拒绝与他认为的保皇派组织联系在一起。经过激烈争论后，最终斯金纳同意领导一个共和制的英国。\n\n斯金纳试图通过大刀阔斧的改革与重建来拯救衰败的英国，尤其努力帮助那些因德国入侵和后来的撤离而失去家园或工作的人但这些努力遭遇阻力——无论选举产生还是抵抗组织直接任命的议会成员，大多认为他的提案过于激进。许多苏格兰人和威尔士人认为，大不列颠统一的时代早已过去。“博尔索弗的野兽”领导的新英国究竟能否抵御这场危机，抑或重蹈前人覆辙，唯有时间能给出答案。"
 POLITICS_DRAGOSLAV_RACIC_DESC:0 "切特尼克组织的领导人之一——德拉戈斯拉夫・拉契奇上校无法忍受看到塞尔维亚再次被占领。德国的入侵促使拉契奇加入切特尼克组织，他组建了多个连队，抗击侵略者及其克罗地亚傀儡——乌斯塔沙政权。尽管拉契奇并不喜欢共产主义，但他多次与南斯拉夫游击队并肩作战，被游击队称为 “善良的切特尼克”。\n\n在祖国遭受纳粹铁蹄践踏之时，德拉戈斯拉夫・拉契奇从未停歇，他率领部队与内迪奇傀儡政权及其德国主子进行了多年消耗战与游击战。希特勒死后，德国枪声四起，拉契奇的切特尼克武装在击败塞尔维亚德国驻军的过程中发挥了关键作用，让祖国重获自由。然而，这种解放并未持续太久——很快戈林的大军就杀了过来，疯狂地吞噬塞尔维亚，再次将切特尼克和游击队逼入地下。\n\n如同之前的占领一样，这次也无法长久。戈林及其追随者如今正在自相残杀，打起了新的内战，而德拉戈斯拉夫・拉契奇和他勇敢的切特尼克战士们再度崛起。他控制了塞尔维亚部分地区，并誓言要与德意志帝国抗争到底，彻底消除德国在巴尔干的影响，建立一个全新的、自由的塞尔维亚。"
 POLITICS_VIOLETA_YAKOVA_IVANKA_DESC:0 "维奥莱塔・约瑟夫芙娜・雅科娃是一位出生于两次世界大战间保加利亚的犹太女性，她一生历经磨难。一战后，保加利亚经济形势恶化，她的家人为了寻求更好的生活，从家乡杜普尼察搬到了首都索菲亚。在那里，维奥莱塔成为一名裁缝学徒，并首次接触到左翼思想和犹太复国主义组织，最终因保加利亚与德国结盟而激进化，加入了保加利亚共产党。\n\n1942年，保加利亚王国正式加入轴心国，年轻的维奥莱塔加入了地下抵抗组织，并采用“伊万卡”作为自己的化名。她参与了许多反对亲法西斯沙皇政权的活动，尤其以破坏德军制服生产工厂著称。她领导的行动小组成功刺杀了保加利亚警察局长阿塔纳斯・潘捷夫和陆军中将赫里斯托・卢科夫。战争结束时德国获胜，维奥莱塔・伊万卡和她的同志们转入潜伏状态，一边默默地与法西斯主义和反犹主义作斗争，一边保护自己。\n\n当德国铁蹄践踏保加利亚王国，旧秩序土崩瓦解。如今，维奥莱塔・伊万卡和她的抵抗组织将矛头对准了戈林政权，成为了德国的眼中钉。随着元首政权的崩溃，这位女战士终于能够带领保加利亚走向新生，为人民赢得真正的自由。"
 POLITICS_KOCI_XOXE_DESC:0 "被许多人视为阿尔巴尼亚共产主义幕后智囊的科奇·佐泽，其早年生活至今仍笼罩在迷雾中。生于奥斯曼帝国晚期，佐泽青年时期便投身共产主义运动，在此期间结识了恩维尔・霍查、法迪利·霍查以及塞伊弗拉·马利绍瓦等其他领导人。\n\n自意大利入侵后，佐泽与共产主义组织的其他领导人便在山区活动，他们与铁托领导的南斯拉夫游击队并肩作战，共同开展抵抗法西斯的行动，并将该政党改组为为民族解放运动。\n\n随着法迪尔·霍查在德军入侵阿尔巴尼亚时牺牲，佐泽接过了游击队指挥权。如今德国人因内斗而统治动摇，民族解放运动抓住这一契机，带领阿尔巴尼亚人民掀起反抗德国压迫者的革命浪潮。"
 POLITICS_HENRY_RINNAN_DESC:0 "尽管祖国已然沦陷，挪威仍在坚守。林南是一名党卫军成员，被戈林留用，在新设立的“斯堪的纳维亚专员辖区”中负责挪威事务。事实上，林南并不怎么认同勃艮第体制，他更愿意效忠“正统元首”——只不过德国人得先搞清楚谁才是正统。\n\n林南的父母都是挪威民族主义者，如今也成了忠诚的纳粹分子。林南起初加入了挪威军队，1940年6月被盖世太保招募。从那时起，他便投身于追捕游击队员的行当。仅在战争期间，他和战友们就成功瓦解了数百个游击队组织，战后更在德军支援下捕获无数反抗者。政变期间，林南保持中立，宣称自己只忠诚于日耳曼尼亚。他继续尽职地抓捕游击队员，直到第一次德国内战爆发才逃往瑞典避难，以免死于游击队或德国人之手。当德国重新控制“挪威专员辖区”后，林南立即返回。听闻德国计划征服整个斯堪的纳维亚时，他兴奋不已。即便其他北欧国家相继沦陷，林南依然只专注于挪威事务。他像往常一样履行职责，直到德国因政局动荡再次崩溃。\n\n这次，林南决定自行掌控局面。他迅速召集了一群忠诚的军官，冲击了挪威地方政府，宣称在德国恢复稳定并能再次管理挪威之前，挪威将由他保护。坦率地说，到目前为止，林南的统治一片混乱。尽管他厌恶勃艮第体制，但不得不承认，该体制在处决异己方面效率极高，于是林南在统治挪威的过程中，多少采用了一些勃艮第的手段。不幸的是，把异见者赶进深山任其自生自灭，并不能真正解决问题。如今林南面临着离心离德的民众、占据山区的武装游击队，以及近乎崩溃的后台靠山。尽管林南宣称要让挪威继续处于德国的控制之下，但在没有德国支持的情况下，这个傀儡政权还能苟延残喘多久呢？"
 POLITICS_OLOF_PALME_DESC:0 "在塔格·埃兰德担任瑞典首相期间，奥洛夫·帕尔梅被视为他最杰出的政治门生和天然的接班人。这位从国会议员开启政治生涯的政坛新秀，在德国入侵前已晋升为教育部长。值得注意的是，帕尔梅曾是瑞典社会民主党内部批评埃兰德亲德政策的主要人物之一。\n\n当占领瑞典的德国军队撤离后，瑞典人民迅速采取行动，重新任命埃兰德为合法民选首相。然而埃兰德断然拒绝，沉痛地为瑞典面对德国侵略时的软弱承担全部责任。他转而敦促党代会选择帕尔梅完成剩余任期——这个提议几乎获得全票通过，瑞典王国由此浴火重生，重回民主轨道。\n\n尽管帕尔梅政府延续了当年使瑞典并入德意志帝国的执政党血脉，他却获得了民众压倒性的支持。当瑞典为挣脱德国铁蹄而奋战时，连人民党都同意与帕尔梅政府紧密合作直至危机解除。似乎瑞典人民仍然憧憬着“自由”和“人民之家”，而帕尔梅正是他们实现这两者的唯一希望。"
 POLITICS_SULO_NYKANEN_DESC:0 "苏洛·尼凯宁，一个足以让任何芬兰共产主义者毛骨悚然的名字。尼凯宁被称为“贾拉的刽子手”，因种种被世人视为“针对共产党人的极端手段”而恶名昭彰。芬兰内战中，他签署了无数红色分子的死刑令，向世界宣告：共产主义者永远别想踏足芬兰半步。\n\n内战结束后，尼凯宁成为芬兰派驻苏联的间谍。在冬季战争和继续战争期间，他不仅向祖国提供关键情报，更向德军告发游击队，协助占领波罗的海地区。他铲除共产党的极端手段引起了德国人注意。在战争结束前，德国人和尼凯宁一起处决了数百名俄国游击队员。随后他回到挚爱的芬兰，期待在这个没有共产党的国度安享晚年。当德国人入侵时，尼凯宁欣然接受了他们的统治。对他来说，被奴役也好过被赤化。这个退休老人竟主动复出，狂热地协助德军镇压芬兰抵抗运动。\n\n然后，德国崩溃了。芬兰也陷入一片混乱。尼凯宁集结了芬兰伪军的残余力量宣布独立。垂暮之年的他执掌着摇摇欲坠的政权，领导着一个民族主义者联盟，对抗德国混乱时期芬兰可能出现的任何共产主义威胁。这位铁腕统治者正以雷霆手段确保其统治——尽管他心知肚明，这统治恐怕持续不了太久。"
 POLITICS_EFREM_CATTELAN_DESC:0 "在某些人眼中，瑞士已经投降了——但卡特兰绝不认同。对他和忠诚的部下而言，投降的只是个空壳，是瑞士精神羸弱的仿制品。唯有卡特兰和他的军队才是瑞士真正的领导者，因为他们代表着这个国家不屈的战斗意志。\n\n卡特兰早料到会有此局面。他曾力劝瑞士政府在全国修筑防御工事，将整个国家打造成一座坚不可摧的堡垒。北面和西面是德国人，南面是意大利人，东面则是可怕的勃艮第——瑞士人很快接受了这个提议。当全国要塞化完成时，所有人都以为做好了万全准备。可德军铁蹄袭来时，政府还是垮了。\n\n投降消息传来时，卡泰兰震惊不已。本能驱使他想要缴械投降。但他最终发出的却是面向残余部队的檄文：“不计代价，血战到底！”于是这支军队继续战斗着。碉堡接连陷落，法西斯恶犬逐渐占领山隘。多年来，抵抗力量为了生存殊死搏斗。这原本是与时间的赛跑——而瑞士人终究赢得了胜利。德国人已溃败，卡特兰宣布瑞士独立。他和战士们将不惜一切代价，让祖国摆脱侵略者的铁蹄。"
 POLITICS_HERBERTS_CUKURS_DESC:0 "愤怒的火焰在赫柏茨·希库尔斯胸中燃烧。那些德国恶狗蹂躏了他的祖国——而他想要的不过是清洗犹太人。可德国人对他的全力协助报以什么呢？杀害拉脱维亚人，再用德国人取而代之！当然，希库尔斯依旧在屠杀犹太人，他绝不能容忍这群人再次染指他的国家。他声称自己在“合作”期间始终暗中反抗德国，但那些年的亲历者对此嗤之以鼻——只是没人敢公开质疑，毕竟谁都害怕这位有着……过度暴力倾向的刽子手。\n\n希库尔斯曾是一位声名远扬的航空先驱，他飞遍全球，屡创新纪录。后来，就在拉脱维亚刚刚独立之时，苏联那些混蛋就入侵了他引以为傲的祖国。德国人一入侵，希库尔斯便立刻投身其阵营，满心欢喜地组织对拉脱维亚犹太人的大屠杀。战争结束后，他本以为自己能在独立的拉脱维亚安度晚年。\n\n但事实并非如此。德国人占领了这个国家，并将其并入东方专员辖区。随后戈林掌权，彻底吞并了这片土地，掐灭了拉脱维亚独立的最后希望。随后德国崩溃。希库尔斯在拉脱维亚掌权，他甚至连北方邻国那种“维持地区稳定”的遮羞布都懒得用。他要让拉脱维亚摆脱犹太布尔什维克的威胁，为此，无论要杀戮或残害多少人，他都在所不惜。"
 POLITICS_VLADIMIR_KSYANEVICH_DESC:0 "抵抗运动的元老克谢涅维奇再度执掌白俄罗斯。德国人获胜后，他曾以为白俄罗斯会安然无恙，自己也永远不必再拿起武器。他高估了德国人，轻信他们不会毁掉自己深爱的国家。他早该明白，不能把白俄罗斯托付给外国人。\n\n战争期间，克谢涅维奇是一名游击队员。他为白俄罗斯摆脱苏联控制而战，曾是当时右翼抵抗组织“绿橡树”的领袖。他协助纳粹征服这片土地，白俄罗斯因而“获得了解放”。\n\n嗯，这得看你对“解放”的定义。克谢涅维奇清除祖国仍处于外国的统治之下，但他厌倦了战斗。他无奈地接受了在这个新白俄罗斯平静生活的现实，只想着若白俄罗斯再次陷入危险，他才会重新拿起武器。而如今，白俄罗斯确实身处险境。德国占领者因自己国家的重压而分崩离析。当地游击队员接管了白俄罗斯，并推选克谢涅维奇为他们的领袖。克西亚涅维奇如今年事已高，无法战斗，也不擅长治理国家。但作为新白俄罗斯的“元老”，他是游击队员们团结的核心力量。他竭尽全力履行职责，时刻准备着德国人再次入侵的那一天。这一次，白俄罗斯不会再被奴役。"