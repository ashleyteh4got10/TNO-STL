 GGR_economy:0 "The German Economy"
 GGR_economy_desc:0 "The German economy should be the envy of the entire world, and for a long time, it truly was. Fueled by our conquests of the lesser nations of Europe, Germany grew strong and prosperous. It is no coincidence that our beloved Führer Herman Göring had a large amount of influence on the economy during those years, his economic genius saving the nation from ruin countless times.\n\nBut as a new decade dawned, we had forgotten how to properly manage our financials. The steady flow of plunder and loot rightfully earned by the Reich through its glorious conquests was stopped in the name of stability, and this act proved itself to be disastrous, as the economy itself ground to a halt soon after.\n\nThe mistakes of the past will not be repeated, and under the guidance of our new Führer, a true economic prodigy, we shall restore Germany to its proper place as the foremost economy of the entire world."
 GGR_total_economic_collapse:0 "§eTotal Economic Collapse§!"
 GGR_defund_the_kriegsmarine_tooltip:0 "§MOur dockyard production will decrease by §!§R25%§!\n"
 GGR_increase_worker_participation_small_tooltip:0 "\n§YGerman Worker Participation§! will §Gincrease§! with a small amount.\n"
