 GGR_the_militarists_dummy_desc: "基于无限扩张的理念，他们笃定德国的命运在于持续征服，并将自身意志强加给世界。在他们心中，毫无妥协与和平的空间。他们的野心突破现有边界，要求戈林发动新的战争，不断强化军事力量。随着内战的终结，军国派占据了德国军事与政治的关键位置，演变为隐匿于阴影中的特权阶级，对德国的制度产生重大影响。随着时间的流逝，他们给德国投下的阴影愈发浓重。戈林深知：若在实施他们计划的问题上拖延太久，后果必将接踵而至。\n$GGR_the_militarists_dummy_effects$"
