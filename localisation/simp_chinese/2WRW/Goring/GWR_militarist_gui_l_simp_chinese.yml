 GER_MILITARIST_MECHANIC_DESCRIPTION_HEADER: "§b军国派§!"
 GER_MILITARIST_MECHANIC_DESCRIPTION: "£gorings_sign §F§j民族社会主义§!是一种催生极端更极端的意识形态：威权主义孕育极权主义，民族迫害演变为种族灭绝。对于那些残暴程度甚至超过§j希特勒§!的人而言，£militarists_sign §b军国派§!正在从沙文主义转变成彻底的战争贩子。\n\n£militarists_sign §b军国派§!只吸引§V虐待狂§!、§b铁石心肠者§!或§u无能之辈§!，由一群国防军军官和残暴政客组成。他们主张恢复“§x总体战§! ”，认为德国面临的每一个问题不过是§G小问题§!，都可以通过§x军事力量§!轻松解决。失业？去当兵吧。缺钱？敌人屯粮我屯枪！在§j德国§!眼中，二战的辉煌才是高光时刻。在£militarists_sign §b军国派§! 看来，只要照搬过去的成功就能搞定未来。\n\n这种“强权即公理”的哲学，如果没有£gorings_sign §o赫尔曼·戈林§! 的支持，根本不可能被当成德国的未来道路。戈林作为派系的代表人物，他的支持至关重要。不过，领导和真正的控制可不是一回事。更糟糕的是，除了£gorings_sign §o戈林§! 和£militarists_sign §b舍尔纳§!之间不断的权力平衡外，还有更黑暗的东西在暗流涌动——£remers_sign §q激进派中的激进派§!已然出现，对他们而言战争不是手段，而是§V终极目的§!本身……§!"
 militarists: "£militarists_sign §b军国派§!"
 remers_militarists: "£remers_sign §q军国派§!"
 GER_HAWKISHNESS_DESC: "§F§S鹰派倾向§!体现了£militarists_sign §b军国派§!圈内的§V激进程度§!。他们的极端主张对德国政策的影响力有时甚至不亚于§o元首§!本人。§S鹰派倾向§!越高，戈林的失败对其§K忠诚度§!的打击就越致命。§!"
 GER_POWER_DESC: "§F§V权力§!衡量着£militarists_sign §b军国派§!对§j德国§!内部机构的§r掌控力度§!。此数值越高，£militarists_sign §b军国派§!享有的自主权就越大。虽然有时让这群人掌握§n绝对权力§!或许§G有利§!，但过度膨胀的权力终将导致§x失控的危险§!——当£militarists_sign §b军国派§!感知到自身愈发自由强大时，他们就会更积极地挑战§o元首§!的权威。§!"
 GER_LOYALTY_DESC: "§F§K忠诚度§!对于§o元首§!来说是不言自明的，虽然£militarists_sign §b军国派§!在表面上对§o元首§!宣誓效忠。但实际上，他们只服从于他们的直接领导人——£militarists_sign §b军国派§!在本国的领袖，与他们频发§V冲突§!可能会带来§x严重后果§!。§!"
