l_simp_chinese:
 GGR_operationsealion2_new: "第二次海狮行动"
 GGR_a_formal_invitation: "一封正式邀请"
 GGR_a_forman_invitation_desc: "看来我们在英格兰内战前的种种谋划已经开花结果。随着英国内战的终结，胜利的天平最终倒向了我们忠诚的合作者，这令人欣慰。尽管有些人终于松了一口气，但我们仍有大量工作亟待完成。首要任务便是与我们的英国同胞重新建立联系，并正式邀请他们重返德意志的怀抱。重申德国在海峡对岸的主导地位，将能杜绝自由国家组织任何进一步的企图，并确保我们在大西洋与北海这一侧的统治地位不受动摇。"
 GGR_flood_britain_with_garrisons: "向英国派遣大量驻军"
 GGR_flood_britain_with_garrisons_desc: "尽管我们的支持者在内战中取得了胜利，但公开的对抗刚刚结束，抵抗组织便在阴影中卷土重来，瘟疫般地困扰着我们。在整个英格兰，巡逻队遭到伏击，汽车炸弹杀害政府雇员，雅利安人在小巷中遇袭。驻军的兵力实在太少，不足以有效控制不列颠，内战已经证明了这一点。对于德意志国家而言，这是断然无法接受的状况。换做别人当政，此事或许不了了之，但戈林绝不容忍。陆军将被派遣过去，高效地收拾内战的残局。\n\n我们会揪着那群HMMLR杂种的头发，把他们从床上拖下来，让他们回想起我们是谁。我们会让他们回想起，我们军靴踏在他们喉咙上的感觉。届时，他们别无选择——要么屈服，要么死亡！"
 GGR_let_them_be: "顺其自然"
 GGR_let_them_be_desc: "历经内战及其余波，不列颠已经证明了自身在维持秩序方面的能力，及其为德国效力的忠诚。元首已同意，允许不列颠保留其作为“同盟战友”的特殊地位，将联合王国的事务交由英格兰人自己处理。虽然政府内部有人主张在联合王国派驻更多德国力量，但我们能信任不列颠自我管理、无需我们插手，这个事实意味着我们可以将部队和物资用于更紧要的前线。"
 GGR_establish_the_militarverwaltung: "设立军事管辖区"
 GGR_establish_the_militarverwaltung_desc: "尽管我们的盟友在对抗HMMLR的战斗中取得了胜利，但国家内部的许多人，特别是费迪南德·舍尔纳，都认为当前的英格兰政府已经失职过一次，未能维持秩序，将来也必然会重蹈覆辙。若要确保雅利安人的绝对统治，就决不能将欧洲领土的安全寄托于侥幸，任其陷入内战的风险之中。建立一个军事管辖区，是我们确保不列颠群岛稳定的唯一选择。"
 GGR_order_in_britain_restored: "不列颠秩序重建"
 GGR_order_in_britain_restored_desc: "随着不列颠群岛再度为国家所掌控，我们的海军如今可以以此为基地，开始在大西洋和北海执行巡逻任务。自由国家组织在欧洲建立桥头堡的梦想已然粉碎——女王陛下最忠诚的抵抗组织失败时已是如此，现在随着不列颠被提升至同盟的地位，这一梦想更是被彻底断绝。自由国家组织当然会在别处再次尝试，但就目前而言，他们将不得不接受这样一个现实：德意志之鹰将继续盘踞在不列颠灰暗的天空下。"
 goering.1800.t: "百万声齐呼“胜利”"
 goering.1800.d: "奥托-恩斯特·雷莫将军站在检阅台上，肃穆注视着整齐划一的步兵列队缓缓通过。这可能是他人生中见证的第一百场阅兵了，但每一次，心中仍会泛起一丝由衷的激动。\n\n士兵们富有节奏的步伐声很快被坦克引擎可怕的轰鸣所取代——由古德里安一手缔造的装甲部队，仅凭其存在本身便能唤起无上的敬畏。一个又一个营的部队走过了为元首诞辰举行的盛大阅兵式，一切看起来不过又是一个平平无奇的寻常假日。\n\n浮夸的演讲声此起彼伏，谄媚的欢呼不绝于耳，玻璃杯碰撞的叮当声在空中回荡。就在雷莫准备走下观礼台时，他的目光忽然捕捉到一个身影，正冲破秩序警察的封锁线，闯入人群之中。\n\n一名年轻女子——也许是个学生——快步走向他。雷莫一时愣住，出于习惯伸出手，以为对方是来致意的。\n\n取而代之的，却是一道刺眼的白光，紧随其后的，是一声惊天动地的爆炸。\n\n黑暗吞噬了雷莫的视野。周遭的声音混成一片难以分辨的噪音，伴随着教堂洪钟般的耳鸣。时间被痛苦地拉长。过了多久？几秒？一分钟？还是一小时？雷莫开始觉得自己已经死了。他的身体仿佛浸在冰水之中，对那从头顶蔓延至脚底的剧痛完全麻木。\n\n忽然，光再次浮现在他眼前。\n\n“将军，您还活着！”一位军医喊道，手中拿着几只空掉的注射器与一摞染血的绷带。\n\n但将军没有回答。他内心的某种东西，在那一天死去了。最后仅存的一丝怀疑与怜悯，从奥托-恩斯特·雷莫的头脑和灵魂中被彻底抽干。"
 goering.1800.a: "于他而言，这乃是一场新生。"
 goering.1801.t: "一声回应“万岁”"
 goering.1801.d: "自奥托-恩斯特·雷莫的人生发生改变——再度发生改变——的那天起，已经过去了两年多。\n\n无数场战斗、片片焦土与具具残躯在他记忆中重现。但现在，每当他回忆起这些，心中涌起的不再是焦虑或绝望，而是烦躁与排斥。\n\n他从未停止质问，为何德国迈向新秩序的步伐如此缓慢而痛苦，而不是一举砸碎所有锁链。他又质问，为何德国在“最终胜利”后所得甚少？\n\n除了“牺牲得还远远不够”，他找不到别的答案。\n\n他周围有太多人，把他们那卑微的生命看得太重，炫耀着他们藏在公寓里的那点可怜家当——那些通过公然偷窃得来的东西。他周围有太多人，只在乎对那些与他们夜夜同床的人应尽的义务。\n\n当德意志民族的一部分与他并肩，在无尽的战壕中匍匐——从马奇诺防线到勒热夫——而另一部分，那些通常被称作“后方”的人，却在德国各地的酒馆里纵情狂饮，无所禁忌。\n\n雷莫越来越频繁地回忆起他与希特勒最后的一次谈话。\n\n“在这场我们被迫进行的战争中，没有平民。”前任元首曾如此告诉他。\n\n难道舍尔纳真的不明白这点吗？他为什么对雷莫的担忧不屑一顾，还满不在乎地对所有人说，“雷莫不再是个理想主义者了…”？又或者，难道连他也…\n\n雷莫选择不去回答自己这最后一个问题。他转而心满意足地审阅起那些企图刺杀他的施佩尔派人渣的处决照片。他们的人数比他原先想象的要多得多。十九个败类，像屠宰场的牲口一样被吊死。何等壮观的景象。\n\n德国的净化，就将从他们的尸骸之上开始。"
 goering.1801.a: "太阳再度升起于日耳曼尼亚。"
 GGR_new_power_emerges_tt: "§R一股新势力正在[GetMilitarists]内部崛起。§!"
 goering.1802.t:0 "新星升起，亦或流星陨落"
 goering.1802.d:0 "“您怎么看，雷莫阁下？”\n\n或许费迪南德·舍尔纳真的老眼昏花了。毕竟，他都七十好几了。也许他的记忆开始出问题了，或者干脆患上了什么病。这是他能得出的唯一合理解释，用以说明为何自己的记性越来越差。毕竟，据他所知，他才是军国派的领袖。是他将每一位军官团结在自己的旗帜下，并将他们牢牢地嵌入德国政坛。是他赢得了内战，是他领导国防军在随后的每一次军事行动中高奏凯歌。是他，在幕后操纵着元首的提线，在阴影中统治着整个国家。\n\n那么，他妈的为什么所有人都这么在乎奥托·恩斯特·雷莫，偏偏是这个人的看法？为什么无论他走到哪里，都总能听到这句话，或是它大同小异的变体？\n\n他也不确定是从什么时候开始注意到这点的。对于外行而言，这一切的发生都难以察觉；难以看到在参谋会议上，本该全神贯注的军官们却向他的门生投去侧目；难以留意到在讨论与雷莫无关的事务时，却频频提及他的名字；难以察觉到一种趋势——他的作战计划总能得到近乎一致的批准，他的部队总能得到最荣耀的角色，他本人也总能获得越来越多的勋章。\n\n舍尔纳善良些的本性告诉他，这或许并不值得过度担忧。那人忠诚如犬，无论他结交了多少“朋友”，军国派依旧信任他，而非其他任何人，去抗衡斯派德尔的影响。他自己的特务和忠诚者网络也一次又一次地消除了他的恐惧：雷莫没有在策划政变，没有行为出格，甚至没有任何可疑之举。他只是在做好他的本职工作，并且做得非常出色，因此声望日隆。\n\n可为什么，他就是无法摆脱那丝不祥的预感？\n\n他有多不想承认，这感觉就有多像是赤裸裸的嫉妒。雷莫比“血腥费迪南德”更年轻，更大胆。论魅力，更是毫无疑问地胜过他。论嗜血，雷莫也毫不逊色，而且他从不害怕让所有人知道，那股血腥的欲望在他内心深处究竟有多么强烈。或许他应该为雷莫的成就感到自豪，而不是嫉妒；毕竟是费迪南德将他收于麾下，授予他在军事派中仅次于自己的地位。他本该充满骄傲，而非怨恨。\n\n他明白这些。但他内心深处，依然充满了怨恨。"
 goering.1802.a:0 "得盯紧那家伙…"
 goering.1803.t: "为未来的墓坑准备铁锹"
 goering.1803.d: "明亮的霓虹灯照亮了巨大的会堂，摄影师们四处奔忙，相机的闪光灯从各个角度捕捉着在场众多军官的威严身姿——标志着国防军最高统帅部“新战役开端”的仪式，已于几分钟前开始。\n\n在讲台上，奥托-恩斯特·雷莫元帅被授予了至高无上的荣誉，甚至能在元首本人之前率先发言。他被一排排国家旗帜环绕，面对着几十位来自陆军、空军的将军以及海军的将领们。他站姿僵硬，反映出此刻的庄重与紧张。\n\n“先生们！我亲爱的战友们！今日，我们齐聚于此，所为之事远不止庆祝我们即将到来的胜利！”队列中的骚动停止了，交谈声沉寂下来——所有人的目光都聚焦在开始演讲的雷莫身上。“正如全世界现在所知——意大利注定灭亡。但这并非终结……”元帅俯身凑向麦克风，双手紧紧抓住讲台。他那伤痕累累的脸上，浮现出一抹真正意义上讥讽的微笑。“我们的许多敌人，无论内外，仍然抱着我们迟早会停手的幻想。他们用雅利安精神亦有极限、一切终将再次终结的想法来安慰自己可悲的心灵。他们错了。他们所有人都错了！在南方，是我们大陆上犹太-财阀瘟疫的最后堡垒，一个叫做‘意大利’的地方——一个罪恶的溃烂脓疮，一片堕落的滋生之地，全欧洲的污秽池。它必将被毁灭！就在今日，或在明日！我们的伟大任务必将完成！罗马之后，东京与华盛顿也将被投入地狱之火！东巴黎也将化为废墟——我的士兵们从不在乎他们的旗帜将插在何处！因为今天，便是我们晋升之日。是全世界终将认识到雅利安精神永不停止的一天！\n\n永不！因为我们会将他们埋葬在核子灰烬之中！就在今日！或在明日！一个不留！德意志必将再度伟大！”\n\n当人群爆发出狂热的欢呼与敬礼，几乎像是被集体癫痫攫住一般时，舍尔纳站在一旁，观察着这一幕。\n\n他被眼前正在发生的一切所惊醒，第一次感到彻底的茫然与疏离。他所能对他身边的副官说出的，只有一句话："
 goering.1803.a: "“这下可不是开玩笑了…一切都完了。”"