 GGR_tighten_atomic_security:0 "Tighten Atomic Security"
 GGR_new_silos:0 "New Silos"
 GGR_new_missile_designs:0 "New Missile Designs"
 GGR_safeguard_the_volk:0 "Safeguard the Volk"
 GGR_grenadiers_desc:0 "There is a sentiment among many German generals now that we need some behemoth of an army, but it should be realized that this is just not logistically feasible! The German Military should be what it always has been and what it always should have been: an elite, deadly force of a few honorable, well-equipped divisions, ready to set out and die for their nation. If we bloat our army with borderline undesirables, then we will end up with a disaster on our hands. It has become clear that a Prussian Army cannot be corrupted by weakness, and so only the fittest should be allowed to fight for the valor of the Fatherland. "
 GGR_germanies_finest_desc:0 "There were many among the military during the civil war who's acts of strength were not recognized by us at the time and that is truly a shame. Yes, many Germans did fight valiantly to defeat those who wished to corrode the Reich but many did truly extraordinary things. We need to find such Übermenschen and give them the rewards they deserve, like perhaps promotions, so that our Army will be led by the greatest men Germany has to offer. When we succeed the army will be a true and glorious Prussian army that even the great Fredrick would tremble over! "
 GGR_intensive_training_regimen_desc:0 "Strength and Power are what is in the hearts of every German man; however, some inherently have it more than others. Thus, we need to weed out the weak and elevate the strong. Our training will be harsh, it will be grueling, but it will be necessary. Those who cannot deal with this will be tossed aside, as they shall be a better fit for the factories. However, those who will struggle on will be warriors like those of Sparta, so full of valor and fire that no nation shall dare challenge us ever again. Now is the Era of Strength, and those who do not adapt will be trampled underfoot! "
 GGR_mobile_support_weapons_desc:0 "Tanks and mechanized units have been a great help to us, but we cannot allow these simple tools to get in front of what is truly important. The great infantryman who has shown valor and strength throughout all of the time and to choose these tools of them would make use just as degenerate as the Americans! Mechanized units have proven time and time again to be a strain on our economy and the lack of oil in our homeland means we are dependent on the control of our colonies. Tanks and other mechanized units should primarily act as support to the strength of our infantry, and not overshadow them. "
 GGR_knights_of_the_panzerkorps_desc:0 "The distinguished and renown Panzerkorps must be continuously reviewed and modernized if we are to truly succeed in creating a modern blitzkrieg. We will outfit our Panzerkorps division with the finest warriors in all of the German Reich, to ensure our campaigns against the degenerates of the world are successful. These prestigious knights shall be at the forefront of German propaganda, and shall be given various honors commending their bravery and heroics."
 GGR_armor_every_grenadier_desc:0 "In order to restore the image of a proper grenadier division, we must see to it that our tanks shall be fitted with proper armor from now on. While our grenadiers may prove to be great propaganda tools in the eyes of Germany, our efforts will be in vain if they are without proper equipment. To the factories!"
 GGR_legacy_of_the_ghost_division_desc:0 "First in the line of fire, first into hostile land, the elite Panzer division known as the Ghost Division has gained incredible fame through their oppressive offensive blitzkrieg during the last war. The Ghost Division has proven the strategic ability of tanks on the battlefield, and we must never forget this if we are to create flexible and dependable armored units. Leaders of the Panzerkorps will be given extended logistical support as well as more freedom to move independently on the battlefield. This way, our tanks shall strike at the enemy with a ferocity and surprise never seen before."
 GGR_volksgrenadiers_desc:0 "In the past few years, it has become apparent to German High Command that simply having superior fire power is not enough to overwhelm and annihilate our foes. We must, in addition to having superior tactics, be able to overrun and crush the enemy with our superior numbers. We shall have reserve divisions for every fighting squadron, so that should a German soldier tire or falter, another proud German patriot will take their place on the battlefield."
 GGR_quality_of_quantity_desc:0 "No matter how many guns we make, we will need a man behind every gun to actually fire them. The wars of the past have proven to us that manpower is a far greater tool than that of superior firepower. By utilizing a larger and more organized army, our forces will be able to tactically overwhelm our foe and achieve our goals much easier."
 GGR_gun_in_every_hand_desc:0 "While our conscription efforts for the army have paid off, it seems as if our armaments production has not quite met its increased demand. We must not allow our soldiers to go onto the battlefield unarmed, and as such decisive action must be taken. Engineers and industrialists from all across Germany shall be convened to determine how to deal with this sharp increase in firearm demand."
 GGR_citizenship_through_service_desc:0 "Our war machine is vast, but it needs more fuel! We can have all the oil, guns, tanks, planes, and food in the world, but all of our material is simply of no use if we don't have the men to utilize it. Fortunately for us, there are ways to \"encourage\" the population to get them to offer their services to the army without implementing conscription.\n\nWe have decided that the only way foreigners can obtain full citizenship is for them to put in their time in the Wehrmacht. Only real patriots, who serve the Fatherland are deserving of becoming full citizens of the Reich!"
 GGR_shock_and_awe_desc:0 "Artillery is the queen of war. She brings great effect to the field, shattering enemy resistance and removing any obstacle that stands in the way of our advance. And should we defend ourselves, it is a remarkable shield that keeps them at bay.\n\nTo preserve the lives of our young men, it is our priority to improve our artillery pieces and to secure better methods at using them. Further work on this branch should aid our army."
 GGR_gun_for_every_meter_desc:0 "A wise Japanese officer once made a comment about the Americans. And he stated that \"there would be a rifle behind every blade of grass,\" should they attempt an invasion.\n\nWhile this demonstrated to us that our former allies in the East considered the American threat with due respect, this must mean one thing to us. If we apply that idea to our homeland, it would be possible. But for every meter of our land, there will be more than just rifles; there shall be stores of ammunition and supplies. And our troops will make any enemy pay with their life."
 GGR_grenadier_panzer_operations_desc:0 "The mighty power of the Reich's Panzer divisions have led us to great victories over the years, but these steel behemoths cannot handle all foes by themselves. Infantry units will work with these divisions in the battlefield to destroy anti-tank forces and ensure that our Panzers sweep unharmed through our enemies' heartland with unstoppable momentum. These new divisions shall be christened the 'Panzergrenadiers'."
 GGR_restore_the_armies_grandeur_desc:0 "A long time ago, before the unification of the Fatherland, Prussia was called 'an army with a state'. This army soon unified the German Reich and became one of the strongest military forces in the history of the world.\n\nDespite this, the Wehrmacht was never granted the true power it deserved, even in the Reich's glory days. Our troops have defended Germany through the centuries, and they will continue to do so in glory and grandeur for a Thousand Years!"
 GGR_rebuild_the_prussian_staff_college_desc:0 "To serve the Reich as a general of the Wehrmacht is the dream of every brave boy in the nation, but being an officer requires outstanding abilities only a few will ever possess. To help our youth achieve such a dream, we shall restore the old Prussian Staff College to provide aspiring officers with proper education and training. As well as being imbued with the necessary skills, becoming a graduate will provide the youth with great prestige and fame."
 GGR_cuff_titles_and_new_uniforms_desc:0 "The decline of militarism in the Reich has many deep causes, but one important reason is the growing lack of respect towards the officer class. To destroy such rude attitudes, the German people will be reminded of the differences between the average citizen and the brave generals who protect the Reich.\n\nIn the Napoleonic age, generals adorned themselves with gorgeous uniforms which manifested their nobility and dignity; now we shall return to that old tradition by hiring the best designers. Our own Reich has had a fruitful relationship with the Hugo Boss company, and we shall look to them to create our new trappings of rank and office."
 GGR_end_political_interfearance_desc:0 "For too long, the cretinous and selfish bureaucrats of the NSDAP have poisoned the Reich from within; meanwhile, the ingenious officers of the Wehrmacht plan together to save the nation from destruction. No longer shall we be disrupted by the fools in government. The Wehrmacht will be granted absolute independence from the influence of all departments in the Reich, answering only to the Feldmarschall. And the Führer, of course."
 GGR_masters_of_the_world_desc:0 "The internal corruption and decadence of the Party prevent the Reich from reaching its true glory, but now that the Wehrmacht has been baptized by the flame of civil war, the Aryan people are destined to become masters of the world. Free from petty political interference in the Reichstag, the army will fulfil its purpose without friction to lead us into greatness.\n\nAll hail the Wehrmacht, the sword of the German nation! All hail Germany, master of the world!"
 GGR_pride_of_the_reich_desc:0 "While we praise the Heer and the Kriegsmarine for their bravery and loyalty, the German people must be reminded that the Luftwaffe is the pride of the Reich and the trusted guardians of the sky. They shall also be reminded that the glory of the air force exists only due to the genius of the Führer, a former ace who defended the Second Reich during the First World War. The pride of the Reich will continue to lead us into conquests unimaginable!"
 GGR_strike_like_lightning_desc:0 "Fast as the wind and as swift as a soaring eagle, our close air support shall strike at the hearts of our enemies with fear and desperation. Before a counterattack can be arranged, our planes will swoop in and out leaving tremendous damage in their path. Our enemies will never feel a moment of peace, as they will constantly have to worry about an impending aerial assault from our fighter pilots. "
 GGR_higher_faster_better_desc:0 "While our pilots are already considered elite and highly trained, their combat abilities could be further enhanced with better fighters. German engineers must be put to the task of developing faster and more agile fighters in order to better suit our pilots. With the power of German innovation and ingenuity, our enemies will be torn to shreds while we fly higher than we ever have before."
 GGR_destruction_of_nations_desc:0 "Our successful bombing campaigns in Africa and Russia has proved to us one thing: the complete and utter ability for our bombers to rain destruction upon our enemies. They have been left crippled and weak, crawling about like cockroaches too scared to fight. It is pivotal that we continue to develop our bombers in order to ensure our enemies can never fully recover from the destruction left in our wake."
 GGR_barons_children_desc:0 "The Red Baron is considered by many to be the greatest pilot of all time, and as such he has had a tremendous impact on the legacy of the Luftwaffe. Perhaps we could use this influence as a means of recruiting new pilots and help train the next generation of the Luftwaffe. We will implement a program known as \"Baron's Children\" in order to locate distinguished fighter pilots and allow them to recognize their full potential on the battlefield."
 GGR_fighters_without_equal_desc:0 "Time and time again, the Luftwaffe have proven themselves to be the utmost elite fighting force in the skies. Our fighter pilots outclass even the most veteran of our adversaries, showing the world that our pilots are a force to be reckoned with. The Luftwaffe has created some of the greatest pilots in history, and they should be recognized and commended accordingly."
 GGR_knights_of_the_sky_desc:0 "Even the greatest of pilots can have humble beginnings, and by making this clear to the people we can usher in a new era of elite German aces. The German people will no longer see the path to becoming a pilot as unattainable or impossible, but rather as an honorable and worthy position given out to the best and the brightest Germans who are willing to give their all."
 GGR_fallschrimjaeger_ascendant_desc:0 "The German paratroopers are some of our most highly trained, highly specialized soldiers. They are a credit to their nation, to their race, and to the Führer. Much of their job is, of course, done in the air. That is why they are members of the Luftwaffe, of course. But the paratroopers also maintain the ability to put up a fight on the ground. Not being members of the Heer, these men are furthermore much more willing to do their duty and follow the orders of the Führer above even Schörner.\n\nNaturally, such talented and loyal individuals deserve nothing less than the best from their nation. Göring has arranged for the paratroopers to receive only the best equipment and training, even when such things would not be beneficial to the regular mission of a paratrooper. Despite the blatant favoritism being shown, it is clear to the Führer that this is a necessary measure. If the Heer's loyalty to Göring falls into question, there will be friendly boots on the ground and in the skies of Germania."
 GGR_new_gunships_desc:0 "It has been years since one could field a proper Air Force using only planes, but that is the assumption that the Reich seems to have been making. As technology has adapted and grown, the Luftwaffe has remained rather stagnant in terms of new advances, with the bureaucrats in Germania unwilling to devote the time, funds, and energy to make Germania rule the skies once more.\n\nThis lethargy, of course, has ended as soon as Göring has assumed the title of Führer. With a truly experienced and knowledgeable man in command of the Reich, the German people will begin crafting and implementing helicopters, gunships, and other more effective means of air combat into our engines of warfare. With a fully updated, outfitted, and upgraded Luftwaffe, there is not a chance that the German Reich can lose to the degenerates who would combat our supremacy. Heil Göring!"
 GGR_Assume_spec_ops_burden_desc:0 "Naturally, those Germans who work in Special Operations divisions are the best, most talented soldiers that Germany can field, having a degree of boldness and patriotism that impresses even the Führer. However, these talented individuals have wasted away under the mismanagement of the Heer and Kriegsmarine. Not enough funding is given to them, nor do the military and naval officers seem to understand the burden that Special Operations soldiers carry. Truly, if the Reich's best and brightest are to continue their missions, a change must be made.\n\nOur magnificent Führer, however, has come up with a solution. All existing Spec Ops divisions within the Wehrmacht are to be folded into the administration of the Luftwaffe. After all, it is the Reich's Air Force that truly recognizes skill and dedication required to succeed at such specialized tasks. Additionally, because of Göring's service, he knows the officer core of the Luftwaffe best, and can easily vouch for their competence and incorruptibility. Truly, the Führer has come up with the ideal solution to this problem!"
 GGR_walkurentruppen_desc:0 "The development of the helicopter transport has proven to be immensely beneficial to our troops on the ground, allowing the rapid relocation of both soldiers and supplies. Perhaps we should further pursue developing this technology, in order to create rapid response assault divisions to further mobilize the German war machine."
 GGR_the_parachute_is_obsolete_desc:0 "As of late, it has become increasingly clear to German high command that the implementation of the parachute on the battlefield is dysfunctional and obsolete. Parachute runs have proven to be far more dangerous than they are worth, and we simply cannot risk wasting German lives on the battlefield. Instead, air assault divisions shall be utilized in order to transport our troops on the ground and to provide tactical support to the Wehrmacht."
 GGR_over_any_ground_break_any_foe_desc:0 "From the dense African jungle to the sprawling fields of Russia, our Luftwaffe shall reign supreme. Regardless of terrain, our fighter pilots will maneuver through the skies to annihilate all those who stand in opposition of Germany."
 GGR_reichsalders_desc:0 "Sworn protectors of the sky, our Reichsalders will watch over us with an undying loyalty to the Reich. Our intensive labor towards improving our air force has finally bore fruit, and our grand air force will guide the German people for generations to come. Our foes may try to retaliate and break our spirit, but they will never snuff out the indomitable light of the Luftwaffe!"
 GGR_deutsches_auslandisches_freikorps_desc:0 "While we have seen the passing of many great military minds in Germany, it is time we begin to encourage those in the Reich who wish to further develop our airforce and refine our flight programs. After all, we cannot properly secure the fatherland without the contribution of every German citizen working towards our cause."
 GGR_strategic_defence_desc:0 "War in the age of nuclear weapons in many ways differs from pure conventional war. If we are to ensure that the Reich's defensive capabilities are up to the task, then we have to concentrate the existing expertise. Let's found a council dealing with strategic defense. The Nuklearstrategische Rat shall serve us well."
 GGR_repair_the_reichs_defences_desc:0 "While the Reich is littered with bunkers and underground installations from the World War and the 50's, many of them are either outdated or in varying states of decay or disrepair. If we want to sufficiently protect our people from nuclear attacks and their aftermath, then we will have to restore and modernise as much of these legacy shelters as possible."
 GGR_modernise_the_seigfreid_line_desc:0 "One especially large bunker complex left to rot in recent times are the fortresses of the Siegfried Line. Built originally to ward of any potential French attacks on the heart of the Reich, now the line could prove useful once again. With some engineering tricks it can be refurbished to both protect the populations of Elsass, Baden and Pfalz if a nuclear shelter is needed, but also serve as an additional safeguard against the Burgundians."
 GGR_modernise_the_fuhrerbunker_desc:0 "The Führerbunker was a contingency bunker for use by the Führer himself, should the situation of the Reich ever become desperate enough. Thankfully, it so far has not been needed. This means, however, that the bunker is just as outdated, as the rest of the Reich's shelters. For a man of Führer Göring's stature, such a meagre housing is of course wholly insufficient. It's time for a modernisation project."
 GGR_crisis_response_teams_desc:0 "To survive any crisis means to be properly organised. And since a nuclear war is the ultimate crisis imaginable, it will need an organisation that can handle this crisis. The Führer has thus decreed the creation of so called Crisis Response Teams that will prepare and help the German people to survive anything our enemies can throw at us."
 GGR_duck_and_cover_desc:0 "The insidious powers that stand against us would like nothing more than to destroy our very way of life and our future. Thus, every school in the Reich is instructed to hold multiple \"Duck and Cover\" drills every year. Even our youth will then know how to protect itself from the evil attempts by the Reich's enemies to destroy us with their nuclear arsenal."
 GGR_tighten_atomic_security_desc:0 "The nuclear missile silos are the heart piece of our nuclear strategy. However in the past the silos' staff and commanders were a cauldron of Speerites, Bormannites or even the SS. This is not a mistake the Führer will repeat. Only the most loyal men handpicked by Göring and Schörner themselves shall oversee such a vital task."
 GGR_new_silos_desc:0 "While our current nuclear silos are sufficient in keeping up the threat of MAD, they are still too concentrated in certain locations and, thus, we risk being wiped out in a decapitation strike before we can retaliate. Thus, building up new and, more importantly, spread out silo installations in all corners are vital to the defense of the Reich."
 GGR_new_missile_designs_desc:0 "The nuclear arms race means a constant effort to improve, to overcome and to adapt. Obviously our missiles are no exception to this. A fresh investment into new and improved missile designs will ensure our silos can't be taken out before the missiles leave for the counterstrike."
 GGR_safeguard_the_volk_desc:0 "With our recent efforts the security of our Volk from nuclear annihilation has been, if not ended, then at least mitigated. Our grand investment into both technology and concrete has ensured. The German people rejoice for such a caring Führer, that has taken it upon him to spare them the horrors of nuclear war."
 GGR_review_the_fleet:0 "Review the Fleet"
 GGR_review_the_fleet_desc:0 "Once upon a time, before Hitler had even joined the National Socialist movement, the Kaiserliche Marine was the pride of Germany, and the envy of the world. Indeed, it was so powerful that the weak, pitiful west forced us to dismantle it after the shame of the Great War, for fear of us returning to greatness. Of course, this did not stop us from rebuilding our fleet in the glory days of the Reich, restoring the Kriegsmarine to heights unseen by even the Empire. By the end of the Second World War, the German fleet was among the strongest on earth, with the masses of U-Boat wolfpacks becoming the bane of our enemies and the surface fleet, backed by the power of our battleships, spreading fear across those who opposed us. For a time, it seemed, the old imperial dream of naval dominance could be achieved.\n\nHowever, as of late, the Kriegsmarine has been, if not treading water, sliding backwards in its ability. The ships and submarines rust in their harbors, underfunded and undercrewed. The Kriegsmarine in general has become the black sheep of the Heer, constantly overlooked in favor of the Luftwaffe and the Wehrmacht's needs. Nowadays, the Kriegsmarine is in a state of disrepair, slowly decaying. This cannot stand, especially with some of the Führer's more grandiose plans requiring a strong navy to succeed.\n\nTwo schools of thought have emerged in the Admiralty, each butting against each other in a constant battle. The first school emphasizes the need for battleships in the modern age, arguing that with simple renovations and fixes, the sheer power a battleship brings would dominate both the American and Japanese fleets. The second school pushes heavily to scrap our old battleships, instead pivoting into the new world of carrier-based doctrine.\n\nThe decision falls to Göring now, who must decide- shall the old, tried and tested battleship prevail, or will it fall to the modern competition of the aircraft carrier?"
 GGR_gut_the_hulks:0 "Gut the Hulks"
 GGR_gut_the_hulks_desc:0 "The decision is made, the paper is signed- the Kriegsmarine is to evolve into a brand new force, based around the aircraft carrier. While this choice is certainly a controversial one among the old guard of the Kriegsmarine, it is certainly a necessary one- what use is a battleship if it can't even see its target?\n\nThe restructuring of the Kriegsmarine is set to begin immediately, starting with the renovation of the battleships. The process to gut the old kings of the sea, painful as it is, must be begun now. That way, with both the weight of maintenance and the profits of the scrap, we can begin production on our new line of carriers, and make a tidy profit in the end. Though this process will strike deep at the heart of any true German patriot, it must be begun now, or else we will find ourselves unready and unable to fight when the time comes."
 GGR_mass_conversion_to_aircraft_carriers:0 "Mass Conversion to Aircraft Carriers"
 GGR_mass_conversion_to_aircraft_carriers_desc:0 "Though many of our old battleships are being scrapped, an interesting movement has arisen from the Admiralty, culminating in the submission of a new plan to the Führer. While this plan does not try to save the battleships in their current forms, what it proposes is almost as shocking and daring as the original change.\n\nThe plan, obviously refined and rewritten multiple times, details the potential opportunity we currently have to refit our battleships into carriers, instead of scrapping the old hulks and building new ships. While the process of converting our battleships into carriers is certainly a costly one, the plan emphasizes both the practical and overall benefits of such a change. Practically, the plan will allow us to keep some of the old hulls around as bases to new carriers, instead of being forced to fully scrap each of our relics. Overall, these retrofits would give us the necessary experience needed to build full carriers.\n\nWhile scrapping the battleships is certainly the more economical choice, the possibility of repurposing our old prides of the fleet into a modern day wonder of Germany has captivated the Führer. With the flick of his pen and a word to his advisors, the plan has changed, and those battleships that once seemed to be reaching the end of the line have been granted a new lease on life."
 GGR_recycle_the_steel:0 "Recycle the Steel"
 GGR_recycle_the_steel_desc:0 "Even with the new conversion plan coming into effect, a new problem has arisen. Some of our battleships are so old and decrepit that, if the engineer's warning is to be believed, the ships could quite possibly break under the strain of the conversion. In such a situation, it seems the risk is just too great.\n\nTherefore, as painful as it is, we will have to dismantle and scrap some of the Kriegsmarine's greatest ships. Though we have tried to save and restore them, it seems that the years of neglect and disrepair have taken their toll. Even now, scrapping ships take the first sections of these kings of the sea apart, tearing old traditions away piece by piece.\n\nEvery cloud has a silver lining, however, and the silver lining in this particular cloud is quite comforting. The steel we scrap from the oldest battleships can be remade into the hulls and sections of our new carriers. In effect, the legacy and history of the battleships of old will live on in a new, modern form. Isn't that a sweet thought?"
 GGR_revive_plan_z:0 "Revive Plan Z"
 GGR_revive_plan_z_desc:0 "Plan Z- a plan spoken about in equal parts reverence and disgust within the Kriegsmarine. To its supporters, Plan Z was a well-intended, if poorly timed, attempt to create a true surface fleet for Germany that would have obliterated the British if given the time and chance. To its detractors, Plan Z sucked away resources from the U-Boat program, forcing Dönitz and his crews to work with less than what they should have and extending the war pointlessly. Whatever one's opinion is on the plan in the Kriegsmarine, the only important opinion on the matter is the Führer's, and he is firmly in favor.\n\nAs Göring bluntly states, the only way to defeat such superpowers as America and Japan is to defeat their navies on the open seas, and a modern Plan Z would give the Kriegsmarine the ability to do just that. As Hitler worked so tirelessly to defeat the Royal Navy, so shall we work tirelessly to defeat the Americans and Japanese. With the new Plan Z, we shall break the IJN and USN over our knees, leaving the door to total conquest wide open."
 GGR_modernise_the_fleet:0 "Modernise the Fleet"
 GGR_modernise_the_fleet_desc:0 "While the prospect of brand new, German carriers is tempting enough, the fact remains that the Kriegsmarine- indeed, Germany as a whole- is woefully underexperienced with the tactics and strategy needed to use an aircraft carrier. If we try to switch to a navy based around aircraft carriers, we will be needlessly outclassed by both America and Japan, who have both a head start in carriers and in experience.\n\nInstead, the Führer has taken the sensible option. The Kriegsmarine, instead of throwing money into the pit of a full fleet retrofit, shall stay the course of the Fleet in Being. Instead, our fleet shall renovate our battleships into the modern age, adding the improvements of the modern age to our behemoths. If the Americans and Japanese think that the age of the battleship is past, they're in for a real surprise. We shall make our battleships into the envy of the world, as they once were. Once again, the battleship shall rule the seas, and those weaker than us will tremble in despair as their pitiful collections of cruisers and carriers shatter under the might of our cannons!"
 GGR_no_such_thing_as_obsolete:0 "No Such Thing as Obsolete"
 GGR_no_such_thing_as_obsolete_desc:0 "Though our battleships have seen limited use since the end of the Second World War, there are still numerous admirals in the Kriegsmarine that are left over from those times. These masters of the waves ran rings around the British back in the day, slowly destroying the English Navy with their skill and intellect. Indeed, the fact that we have barely utilized them since those days is almost criminal, and must be changed at once.\n\nBy coming to these experienced admirals, we shall get the insight we need to repair and refit our battleships to become the new masters of the waves. With their experience, no flaw shall be overlooked, no opportunity to improve will be missed. We shall use those that dominated the Second World War to get the Kriegsmarine into tip-top shape for the Third, and soon everyone from Norfolk to Tokyo will tremble at our behemoths!"
 GGR_atlantic_veterans:0 "Atlantic Veterans"
 GGR_atlantic_veterans_desc:0 "Our attempts to renovate our battleships are reported to be a resounding success so far, thanks to the experience and insight of those who commanded them decades ago. However, though these admirals have been invaluable in their help, the fact remains that some of them have become simply too old for active service. Those of the younger class of admirals, though eager to command the Kriegsmarine, have little experience in the field- the Kriegsmarine has not been in any major actions since the Second World War, after all- and their inexperience shows. If no solution is found, then we will be sending rookies into battle against our enemies, who have great experience in the art of naval warfare. Such a situation would be asking for disaster.\n\nLuckily, the solution is right in front of our eyes. By using our experienced admirals as teachers for the young blood entering the pool, we shall train them to fill the shoes that our old leaders will leave. Every officer shall know the ins and outs of our naval doctrine, and we shall rest easily with the knowledge that, when the old guard inevitably bows out, our young faces shall take over with grace and ease, and lead us to a victory as great as that in the 40's."
 GGR_challenge_the_USN_and_the_IJN:0 "Challenge the USN and the IJN"
 GGR_challenge_the_USN_and_the_IJN_desc:0 "Despite the clear improvements made in our naval power over the course of the past few months, it seems that the message has not yet made it to those in Norfolk and Tokyo. Our rivals, as cocky and foolish as ever, seem to believe that the Kriegsmarine is the sick man of the sea. While this may have held some weight back in the day, one only needs to take a look around the hustle and bustle of Theoderichshafen  to know these allegations are false. It now falls upon us to prove our strength to those imbeciles to our east and west.\n\nSoon, exercises on a scale never seen before shall rock the Black Sea. Our opponents shall see this and be silenced by a tide of fear and terror, and they shall know that the Kriegsmarine is no sick man. No, the Kriegsmarine is a tide of steel and gunpowder, ready to crush whichever nation is unlucky enough to stand in our way. We shall teach these upstart admirals why their nations surrendered or allied us so quickly. We shall teach them fear, and they shall know that the Kriegsmarine owns the waves."
 GGR_match_them:0 "Match Them!"
 GGR_match_them_desc:0 "Another unfortunate roadblock has gotten into the way of our great plans for naval dominance- size. Though money is being poured into the Kriegsmarine at an astonishing rate, the fact remains that we are playing from behind here. Hitler, glorious as he was, made a serious error in ignoring the Kriegsmarine, and now our navy is seriously outnumbered by both the Americans and Japanese, who have spent much of the last 20 years building their fleets to enormous sizes. By now, it will take an incredible amount of resources to be able to catch up in numbers.\n\nHowever, where we lack in numbers, we shall excel in strength and skill. Each of our ships must be perfect killing machines, crewed by only the best and brightest. While they flounder about with mediocre designs and average crews, the guided hand of our restoration, paired with our own stellar crews, will shatter them. As the average Panther was equivalent to 10 T-34s, so too will our ships be equivalent to a hundred of theirs!"
 GGR_carrier_for_carrier:0 "Carrier for Carrier!"
 GGR_carrier_for_carrier_desc:0 "The age of the carrier is just beginning. After years of dawdling, the Kriegsmarine has finally, through a herculean effort, caught up to the modern world. Our first carriers take their maiden voyages as we speak, and thousands of citizens watch as planes soar from their decks.\n\nHowever, though our effort so far has been both taxing and expensive, we are still not equal with the Americans and Japanese. These two decadent states learned both the tactical importance of the carrier and how to use them when they squared off against each other, leaving them both with an inherent advantage over us. We cannot let this stand.\n\nThe finest captains and crews shall soak up knowledge of the new way to naval combat like sponges, and they shall become the greatest carrier crews in the world. Our enemies laughs will quickly turn to screams when wave after wave of planes swoop down upon their pitiful fleets, devastating their navy and shattering their resolve. While we may never catch up numerically to the power of the Americans and Japanese, we will certainly beat them in skill, and if the land wars we have fought over the last decades mean anything on the waves, skill is everything."
 GGR_battleship_for_battleship:0 "Battleship for Battleship!"
 GGR_battleship_for_battleship_desc:0 "Our Fatherland deserves a better navy, one fitted with a vast number of ships capable of delivering firepower against our enemies at sea and on land. What our Fatherland needs is the creation of more battleships; for every one that our foes shall have, so shall we.\n\nFührer Göring's plans for the Fatherland shall be instrumental to the fulfillment of this desire. Once we have accomplished this, we shall have the power to bring our might against any state that dares to oppose us."
 GGR_cruiser_for_cruiser:0 "Cruiser for Cruiser!"
 GGR_cruiser_for_cruiser_desc:0 "Though the attention of both the media and the government may be focused on our capital ships, the humble contribution of the simple cruiser cannot be understated. Without them, our battleships would be sitting ducks for flanking attacks from nimble, agile ships. A perfect blend of firepower, agility, and speed, the cruiser's impact on naval warfare cannot possibly be overstated.\n\nTherefore, we must make sure not to overlook the importance of these humble machines, even as we focus on the showstoppers. Our cruisers will get the attention and love that they deserve, and they shall be crewed by some of our finest crews and captains. While the capital ships may be those that carry us to victory when the time comes, it will undoubtedly be with the help of the cruiser in warding off the danger of the flanking force that success is guaranteed."
 GGR_the_german_armada:0 "The German Armada"
 GGR_the_german_armada_desc:0 "Our navy, once the laughingstock of the world, is now truly among the best of the best. Through a campaign of incredible renovations and rebuilding, backed by a mind-boggling amount of money, our navy can now proudly compete in international waters against both the IJN and USN. All across the Reich, crowds watch and cheer as the Kriegsmarine, which has festered in obscurity and devay for so long, triumphantly returns to ports across Europe, standards flapping in the wind. The journalists have made sure to get many pictures of the crowds, the ships, and most importantly, the Führer himself, who watches ship after ship sail by with a smile spread across his face.\n\nIn Norfolk and Tokyo, the mood is much more somber. Indeed, one could even call it panicked. Our intel reports that the decadent admirals of both America and Japan, which have rested safely on their laurels for so long, now scramble for answers and solutions to our newest weapon. They will find none. Our fleet is the greatest in the world, manned by the greatest crews in the world. We shall control every ocean, from the Pacific to the Atlantic. The enemy will tremble when they speak of the Kriegsmarine, for they will know that death and destruction is bearing down on them. Germany is the greatest on the land, in the air, and on the sea!"
 GGR_the_ringhorn_doctrine:0 "The Ringhorn Doctrine"
 GGR_the_ringhorn_doctrine_desc:0 "Our fleet may be the greatest on Earth, but there is always room to improve. Even now, the bastards in America and Japan race to build their fleets back up, attempting to take back the title of masters of the sea from us. If we simply sit back and rest on our laurels, as they did when we caught up to them, we will once again find ourselves outclassed, outgunned, and outmanned. Innovative thought is required.\n\nLuckily, we have the greatest source of innovative thought on Earth, and his name is Hermann Göring. Our Führer, in another brilliant display of his intellect, has proposed a new plan to keep the Kriegsmarine one step ahead of the American and Japanese dogs- The Ringhorn Doctrine.\n\nEssentially, the Ringhorn Doctrine is running with the concept of \"Bigger is Better\". What better way to outclass those that challenge us than with the largest, biggest ships on Earth? Not only will we save on manpower- one captain on a super battleship can possibly put out as much fire as three on normal battleships- but we shall truly have prides of the fleet to look proudly upon. Our ships will block out the sun, and the enemy shall submit to our will or be crushed underneath our keel.\n\nFor now, however, our ambitions must be more humble. Our harbors, great as they are, are simply not able to take on the raw tonnage of these gigantic hulks. We must upgrade our facilities to the highest standard if we wish to accommodate the raw power of this new class of ship."
 GGR_supercarriers:0 "Supercarriers"
 GGR_supercarriers_desc:0 "Your average carrier can launch dozens of planes at a time, sending them far and wide to find and destroy the enemy. Such pathetic output will be spit upon by our new design- the Supercarrier. According to the blueprints, these gigantic boats will have the room and capabilities to not only store, but launch hundreds of planes. If our enemies think that simply one or two dozen planes is enough to get by in the new world of naval warfare, they've ought to think twice. They'll pay for their insolence when hundreds of bombers come swooping down, obliterating their puny ships.\n\nThe cost of these gigantic carriers is, as one would expect, enormous. After all, they're a hell of a project to build. However, all will be worth it. The look on the President's face when he sees wave after wave of bombers tearing apart his grand fleet will be worth a billion Reichsmarks alone! The age of the supercarrier is here, and Germany is once again at the forefront of technological revolution!"
 GGR_superheavy_battleships:0 "Superheavy Battleships"
 GGR_superheavy_battleships_desc:0 "The average battleship is the king of the sea, a gigantic creation of steel and fire that can crush enemies from miles away. The Kriegsmarine already has many of these behemoths, but the Ringhorn Doctrine calls for a creation that dwarfs even these monsters- the Super Heavy Battleship.\n\nOutfitted with the largest guns that the Reich has, covered in the thickest armor belts we can create, these giants shall be the crowning piece of the new Kriegsmarine. The average battleship, as glorious and valiant as they are, have their own drawbacks, such as poor accuracy at range and a susceptibility to torpedo attacks. With new advancements in gunnery, combined with the strongest armor on Earth, both of these problems shall no longer be a concern. The Superheavy Battleship will make an average battleship look like a mere cruiser, and our opponents will stare in awe at the sheer capabilities of the Kriegsmarine as our shells rain down upon them from miles away."
 GGR_their_battleships_are_our_cruisers:0 "Their Battleships Are Our Cruisers"
 GGR_German_leviathans:0 "German Leviathans"
 GGR_German_leviathans_desc:0 "The word is out about the brand-new Kriegsmarine, and a wave of terror has swept through our enemies. Our spies report hurried, panicked meetings between admirals in Norfolk and Tokyo, exactly as we expected. One can't blame them for their panic- we certainly would not be any less uneasy as they if Japan or America had rolled out such powerful ships as we have.\n\nThey are right to huddle in terror, of course. Our fleets are nearly impenetrable. Our cruisers can shatter any skirmishing force, our capital ships can single handedly level fleets and cities alike, and our crews are the best in the world. With such power at our disposal, one has to wonder what a nation could do to resist such an overwhelming force. Indeed, it seems at this point, only a nuclear strike could destroy our ships.\n\nWhatever the Japanese and Americans decide on doing, it's clear that the Kriegsmarine is the new king of the seas. Our people cheer and shout as our ships sail by, knowing that the Reich is the greatest nation on Earth."
 goering.military.1.t:0 "The Purple Scare"
 goering.military.1.desc:0 "Göring's smile spread wide over his face as he looked down upon the crowd that chanted his name. There were no longer any bombers to worry about, nor fighters that would strafe buildings, or tank shells, bullets, and whatever else enemy forces could muster. Instead there was a strange sensation of peace, broken strong and fast by the entrance of the new Führer. Looking over the disheveled and lost people, Göring knew they needed something to hate- and he would give it to them.\n\n\"Sons and daughters of the Greater Germanic Reich!\" He began, sweeping an arm across and catching the interest of all present. \"Now that this war has concluded, we may return to peace, as brief and fleeting of a stint as it may be. However, not one of you shall be fooled into thinking that this 'peace' is nothing more than an excuse for the enemies of the Reich to gather in secrecy and organize resistance against us. The illegitimate heirs of Adolf Hitler have been cast into shadow, but another insidious organization remains.\"\n\nSlamming his hands on the podium in front of him, he leaned forward and felt a rush of excitement flow through him, and he let lips part for a grin. \"The Black State of Europe, the rogue break-away of Burgundy - is nothing more than a mortal enemy, and all of its constituents, including the Schutzstaffel, are traitors, enemies, and bloodthirsty dogs howling towards insanity!\" A spark of awe amongst the crowd that spread rapidly, and a sense of brewing hatred. Göring led them like a shepherd. \"As of today, all former members of the SS shall be questioned, all who served shall be trialled, and all elements of the SS are to be destroyed, burned, and shattered!"
 goering.military.1.a:0 "Heil to the new Germany!"
 goering.military.2.t:0 "The Castles Burn"
 goering.military.2.desc:0 "\"Krössinsee, Vogelsang, Sonthofen...\" The bomber pilot, Leopold, muttered under his breath, looking over a map with several targets across Germany marked. The rest of his skeleton crew worked in the background, getting ready to pilot the plane for the fourth time this weekend, their target being Ordensburg Marienburg. Leopold simply sighed as he trailed a finger from marked building to marked building. As ruthless as they were at exterminating what was left of the Schutzstaffel's legacy, Leopold held no sympathy for them. Ordensburg Marienburg, at this point, was nothing but cinders and rubble- and yet still him and his crew were asked to bomb it a fourth time, a fifth time, even.\n\nAn amused smile came over him as he backed away from the map and turned around, mental images forming in his head of how he had flown over Marienburg the first time, and one of his comrades informed him that there were piles of loot to be found in it. Gold, jewels, relics, art, everything stolen from Germany itself to whatever poor minority found itself at the hands of the SS, and everything carted back to these places, now being carted out to be repurposed back to the German people... and with some not-so-subtle rumors floating around that most of it would go to a certain pompous Führer.\n\nWith a grin, Leopold stretched out his arms above his head and then snapped his fingers, cracking the air open with a loud whistle and catching the rest of his crew's attention, some carrying boxes, some polishing up the plane. With an elated tone befitting a bomber serving the Reich proudly, he spoke."
 goering.military.2.a:0 "\"Let's start another firestorm in Marienburg, and leave the fifth round to the rats!\""
 goering.military.3.t:0 "Dimming the Black Sun"
 goering.military.3.desc:0 "\"Good morning, citizens of the Reich. This is Reichssender Germania, and with both the blessing and permission from Führer Hermann Göring, we have been allowed to broadcast the results of the trials against the black stain known as the Schutzstaffel that has been plaguing Germany. With the united effort of the Wehrmacht, Ordnungspolizei and all of the Reich's legal institutions, vast structures containing thousands of supporters of Heinrich Himmler, Reinhard Heydrich, and other associated high-rank SS members.\"\n\n\"One Scharführer Schorsch Alexander has admitted to taking extensive funding from the Organization of Free Nations funneled through the territory of the Bahamas. Others were forced to admit to having ties to the radical Judeo-Bolshevik organization known as 'Nakam', as well as contact with Japanese agents located in Brittany. In light of these discoveries, Judge Ernst Lautz proclaimed in his final statement: \"One death is not enough for these men, for their treason and destruction against the Reich, they should die one thousand times.\"\n\nWith fifteen thousand death sentences thus declared and carried out via hanging, the Reich has been made a safer place for all of us by the Führer himself. In his generosity he has also declared that all former Schutzstaffel possessions shall be converted for service to the Reich. It is the hope that, eventually, all traces of the Schutzstaffel will henceforth be obliterated, once and for all separating National Socialism from the plans of the rogue state known as Burgundy.\n\nIn further news, one Otto Günsche..\""
 goering.military.3.a:0 "And I looked and behold, a pale horse."
 goering.military.4.t:0 "Führer Directive 353"
 goering.military.4.desc:0 "1. In light of their continuous treason against the Reich, all non-loyal personnel of the Allgemeine-SS, Waffen-SS, RSHA, SS-Sonderkommando, SS Medical Corps, Ahnenerbe, SS-Frauenkorps, Auxiliary-SS as well the SS-Foreign Legions shall be stripped of their military and financial honors.\n\n2. Hereafter, \"non-loyal\" are defined those who refused to join the rightful successor to Adolf Hitler in their battle against the treasonous force, thus prolonging the suffering of the German people in a brother war.\n\n3. All non-loyal former personnel of the above organisations both alive and deceased, shall likewise be stripped of all honors.\n\n4. Exceptions to the above can only be made at the Führer's discretion.\nSigned, Führer of the German Reich,\nHermann Wilhelm Göring"
 goering.military.4.a:0 "No loyalty means no honor."
 goering.military.5.t:0 "The Triumph of the Field Marshall"
 goering.military.5.desc:0 "The morning in Germania was a cacophony of noises. Not only serving as one of the biggest capitals of the world, on [GetDateText] the magnificent city shook under the weight of the Wehrmacht, a parade unmatched by the rest of the world. Thousands of soldiers, razor-sharp in discipline and armed with select rifles that remained standing after the fires of the Civil War calmed. Tanks, trucks, armored personnel carriers and other types of vehicles rolled throughout the wide and narrow streets alike, treads and wheels and the turning of engines making it clear to all of the superiority of Führer Hermann Göring... and his most valuable Feldmarschall, Ferdinand Schörner.\n\nFinding himself comfortable sitting upon one of the most modern tanks in possession of the Heer, Schörner sweeped his glasses-worn eyes over the masses that gathered and watched, and pride tingled through his fingertips as he reached for the electric megaphone near him. With a satisfying click, he took a deep breath and brought it to his mouth, and the voice of one of the Reich's most powerful men came out at the end as he thrust a fist into the air.\n\n\"Soldiers! We are whole once more! The traitors within and without are extinguished. The Reich in all its glory has returned, never to falter again. Our enemies sought to destroy us, but they have only made us stronger. The time has come to strike back, to rise from the ashes of the civil War! The time has come to show all those who oppose us what the Wehrmacht is capable of, as all the world will see our might, and tremble in perpetuity!\""
 goering.military.5.a:0 "The sound of boots never stops."
 goering.military.6.t:0 "Who Sits The Chairman's Chair?"
 goering.military.6.desc:0 "Göring poked at the pork dinner that had been brought to him in his office at the Reichskanzlei, his mind somewhere else. Heinz noticed his uncle's absent expression and cut in, \"Still thinking about the Defense Committee Chairmanship? It seems like such a small thing to let distract you - to me at least.\"\n\nGöring shook his head side to side, \"I wish it was just that simple. I wonder if this is what drove Adolf to his grave so early.\"\n\nHis nephew swished his port cooly, \"So what is going on then, if I might ask.\"\n\nGöring grunted sardonically, \"It's what's always going on: the battle for power. I've played the game for decades now, but it's never been so grating. The chairmanship is just one piece of the larger puzzle. Schörner would have me place General Tolsdorff in the position.\"\n\nHeinz raised an eyebrow as he finished his glass, \"I've met him before I believe, at the war cabinet meetings. He seems competent enough.\"\n\n\"Competence isn't the issue,\" Göring grumbled, \"he's fully committed to Schörner and I can't just let them think they can run the Reich under my nose. I ought to put you in charge you know, only they'd throw a fit.\"\n\n\"Well,\" Heinz was plainly paying close attention now, \"I wouldn't reject such a position, but I can't say I really want 'Bloody Ferdinand' to have a grudge against me.\"\n\n\"No,\" Göring agreed emphatically, \"No you don't Heinz.\" His fingers began to drum on the table, \"What if we put Bormann in? He owes everything to me sure, but everyone knows how committed he is to the militarists. He'd be a good compromise candidate.\"\n\nThe Führer turned to his nephew, \"What do you think Heinz?\""
 goering.military.6.a:0 "\"Conceding on this can't hurt, right?\""
 goering.military.6.b:0 "\"I think I will take the job after all.\""
 goering.military.6.c:0 "\"Best to go with Bormann.\""
 goering.military.7.t:0 "Restore the Old Fortifications?"
 goering.military.7.desc:0 "The Ostwall, the Siegfried Line, air shelters, remnants of the Maginot Line as well as various Czech, Austrian and Polish built installations. The list of old bunkers and fortifications that dot the landscape of the Reich is long, far longer than one expects it to be.\n\nThe National Defense Committee has recently brought to attention the pitiful state of many of these buildings. As the Reich's defense network is vast, the funding needed to rebuild everything necessary to properly defend in case of a full invasion would be very expensive, and some in the Committee have proposed a scaled-back version of either working on the air defenses, with some citing reasons that air power is vastly more important than ground forces, and with some arguing to restore the bunkers, retorting that a lack of defense in case of the Reich's invasion would lead to it quickly getting occupied. Alternatively, we could simply attempt to maintain what's left, which may leave the Committee disgruntled, while the economy would be practically unimpacted."
 goering.military.7.a:0 "We need to restore everything!"
 goering.military.7.b:0 "The air defenses need some work"
 goering.military.7.c:0 "Get the bunkers back in shape"
 goering.military.7.d:0 "Some limited repairs are sufficient"
 goering.military.8.t:0 "Modernisation of the Führerbunker"
 goering.military.8.desc_militarists_man:0 "With a General Tolsdorff in charge of the Führerbunker, the modernisation of the facility has quickly taken a radical turn. Gone are the special rooms for cooks, barbers and other servants of leisure, replaced by dedicated rooms for communication, weapons storage, military courts and many more. The oil paintings and wooden furniture from the past era of Adolf Hitler's architectural designs will have to go as well, leaving only maximum efficiency in mind. Soon the Führerbunker will be transformed into the OKWs epicenter to conduct and direct combat everywhere in the world, and Germany will rebuild its status as an unmatched military force."
 goering.military.8.desc_goering_man:0 "With Führer Göring's nephew Heinz Theodore in charge of the Führerbunker a most grand rework of the place has begun. The stuffy and old-fashioned design of what Adolf Hitler had left behind would have to be moved out of the way, making way for Göring's own lavish tastes. Decorated with the finest examples carried out from Carinhall, the Führerbunker will be nothing if not a paramount testament to Germany's endless wealth."
 goering.military.8.desc_apolitical_man:0 "With Albert Bormann in charge of the Führerbunker, the facility has seen remarkably little change in its basic setup. With the past furniture and artwork hailing from when Adolf Hitler was still Führer remaining, only minor renovations remain to make the Führerbunker up to par with the rest of the world, requiring a refurbishing of the communications and electronics network."
 goering.military.8.a:0 "The Bunker will be a grand room of war!"
 goering.military.8.b:0 "A small Carinhall below Germania"
 goering.military.8.c:0 "Some new paint here, some modern telephones there..."
 goering.military.9.t:0 "New Nuclear Silos"
 goering.military.9.desc:0 "Although we are loath to admit it, we need to address the state of our nuclear silos.\n\nIn essence, many of our underground storage facilities have begun to decay. While the situation isn't critical, a substantial amount of work needs to be done to get our many launch sites in acceptable working order. Foundations need to be checked, missiles need to be maintained, supplies and stockpiles need to be replenished, as well as many other minor details.\n\nWe can be satisfied with repairing our many silos, but a select few officers have approached us with a more unconventional solution; building and rebuilding our stockpile of nuclear missiles into an armaments force that could be launched anywhere at any time?\n\nIt is indeed something our engineers toyed with in the past, but in the end, the Reich decided that storing all of our nuclear armaments in silos was the best solution. However, with the stabilization of Germany and the Einheitspakt, as well as the sudden influx of massive funding into the military, we can now, after decades of stagnation, consider affording a project to give our nuclear capacity the ability to strike from any part of German territory."
 goering.military.9.a:0 "Our missile silos are more than adequate."
 goering.military.9.b:0 "Mobility will give us an extra edge over our enemies!"
 goering.military.10.t:0 "A New Generation of Missiles?"
 goering.military.10.desc:0 "That the Reich's missile technology could use an upgrade and new designs is not a question in the Council. It is a unanimous certainty. Nevertheless the process itself has turned into a squabble of conflicting viewpoints.\n\nA significant portion of the Council believes that, although improving our outdated missiles would be a boon, and, in fact, a necessity in order to remain in parity with the U.S and Japan, rushing ahead to update all of them would only lead to a waste of funds in the future as missile technology advances rapidly. Yet another part of the Council thinks that having a stockpile of long-range weapons fall behind in terms of capability would lead to the other two superpowers preying on a supposed weakness to project power across the globe, and that a rapid modernization attempt now would prevent any future opportunities for the Reich's enemies to pounce on them.\n\nIn the end, the bitter divide in the Council has reached Führer Göring's ears, and the Council has asked him to make the final decision."
 goering.military.10.a:0 "Every moment we waste is a danger, and so the missiles must be upgraded quickly."
 goering.military.10.a.tt:0 "§OThe results of our research will become available in roughly §G10 months§!.§!"
 goering.military.10.b:0 "Slow and steady wins the nuclear race."
 goering.military.10.b.tt:0 "§OThe results of our research will become available in roughly §R18 months§!.§!"
 goering.military.11.t:0 "The New Missile Designs are Finished!"
 goering.military.11.desc:0 "Göring tapped twice against the thick glass pane, the trail of smoke coming from his cigar bouncing up and off it as he turned his head to look at two men, both wearing sharp business suits, and both serving the Reich in their own, specific ways. Taking the cigar out of his mouth, he splayed the hand that took it towards the launch facility currently in the process of launching a missile. The man to the left, shorter, brown-haired and blue-eyed, spoke up, knowing that Göring wanted him to.\n\n\"If you're asking about the chances of the missile striking the marked Soviet bunker, my Führer, the chances are higher than eighty-percent.\" He spoke, letting an anxious but confident smile take to him. Göring, however, seemed uninterested, rolling his eyes as he looked back to the facility, enjoying the lights show.\n\n\"The Reich only accepts a hundred percent, but fine. I'll take it.\" The scientist felt his heart drop a little. \"Still-\" Göring took a slight pause, closing his eyes and taking in another puff of his cigar, the crisp stinging his lungs lightly, and he let out an exhale as he looked back to the other man who had yet to speak up. \"-Rupert, was it?\" Of similar height to the scientist next to him, though looked more openly assured.\n\n\"Yes, my Führer, all members of the Einheitspakt have accepted the purchase of these missiles, and...\" Göring's eyes narrowed. \"... of course, I've also made sure they will receive 120% of what they ordered, and will be, under law of the Einheitspakt, forced to pay for those as well.\"\n\nA graceful smile came over Göring's lips, and he felt positively sly. \"I'm satisfied, then. They may complain all they want about us overcharging them,\" he said, waving his cigar around lightly, letting the smoke strike the two men in front of him, \"but in the end, it will be all for their security. Isn't that right, gentlemen?\" Silently, the men nodded."
 goering.military.11.a:0 "I assure you, they are well worth the buck for their bang."
 goering.military.12.t:0 "Cordon Sanitaire"
 goering.military.12.d:0 "The Oberbefehlshaber had fought hard to get this meeting - the Führer had been spending most of his days with the OKW and his precious Luftwaffe. Finally however, he sat in Göring's office, though the man had drunk far too much wine for his preference.\n\nHe chose his words carefully. \"Mein Führer, the Ringhorn plan is proceeding well, though there are some complications. To effectively maintain a cordon about Burgundy, a more effective network of bases is required. To rely solely on ports in Germany increases our ships' transit times to unacceptable levels. The ports of the Jade Bight and Denmark, while excellent, are simply too few, and many of our vessels must return to the Baltic to resupply. This creates gaps in our blockade, that -\"\n\nGöring leaned forward in his chair, putting down his glass. \"Gaps? My God man, this is unacceptable! You must rectify this at once!\"\n\nThe Oberbefehlshaber was momentarily taken aback, but recovered quickly. \"Indeed mein Führer. I believe that by requisitioning the British ports, we could half the amount of time ships spend outside the cordon.\"\n\n\"Then do so immediately. Damnation, it's like I have to decide everything here. Whatever it takes to bring down Burgundy, do it!\" He excused him with a flick of his hand, and returned to his glass.\n\nNonplussed, he rose and left the room. He wasn't sure whether to be pleased or not."
 goering.military.12.a:0 "I suppose I got what I wanted."
 goering.military.12.b:0 "It could've been better."
 goering.military.13.t: "A Concrete Coffin for Four Hundred People"
 goering.military.13.d: "The street was filled with people – residents who were carefully watching the briefing taking place. A solid man in a pale green uniform was busily walking along the makeshift podium.\n\n\"And now, pay attention here!\"\n\nHe pointed at a drawing attached to the board, which schematically depicted the communications of a concrete shelter.\n\n\"Now, in front of you is a plan of a typical bunker, which is currently being built near your house. Our great Führer Göring has exactly the same one. It can comfortably accommodate more than four hundred people at a time while being completely protected from any kind of effects of weapons of mass destruction. In case our enemies finally show their true colors and use chemical or bacteriological weapons, the bunker has a filter system in ventilation and a supply of oxygen in cylinders. And if the enemy decides to use the nuclear option, you will be protected by concrete walls – two meters thick!\" – the officer stood with his foot on a nearby cinder block, demonstrating its thickness.\n\nA shout was heard from somewhere in the crowd: \"We will have a paradise even underground, and our enemies will just die!\"\n\nThe crowd, like a grenade without a receipt, detonated in glee, watching as numerous construction equipment and RAD fighters began a new shift in the construction of the hundredth bunker in this city.\n\nA little further away, two veterans who had been commissioned from the front were sitting on a bench, clearly annoyed and frightened by the state of affairs.\n\n\"What do you think?\" said a frowning soldier with an eye patch to his friend.\n\n\"They are preparing us for the totaliest war. The end is near. At least it's much closer than everyone thinks. I hope the Führer knows what he's doing.\"  The other replied, stubbing out his cigarette and nodding his head towards the cheering people."
 goering.military.13.a: "The end is nearing. The crowd is cheering."
