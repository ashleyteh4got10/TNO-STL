 PRM_CHAIR_DESCRIPTION: "一切都结束了。\n\n无谓幻想的果实，如今已消融在背叛、愚蠢与闹剧的汪洋中。\n\n曾自诩为“俄罗斯人民元首”的阿列克谢·亚历山德罗维奇·多布罗沃洛斯基，化名古特鲁姆·瓦格纳，彻底与现实脱节，最终如他这般模仿者的宿命——倒在了偶像手中。他寥寥无几的追随者也随他一同湮没于黑暗，让俄罗斯民族在本世纪内第一百次站在命运的十字路口，而这一次，似乎连微茫的光明前景都已荡然无存。\n\n凛冽的战争之风正从西方袭来，提醒着俄罗斯：力量的考验将至。\n\n大动乱时代，再次降临。"
