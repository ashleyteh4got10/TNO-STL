 ARC_All_Russian_Congress: "全俄罗斯大会"
 GER_Lutz_Heck: "卢茨·赫克"
 POLITICS_GGR_HANS_KREBS_DESC: "汉斯·克雷布斯出身于不伦瑞克的一个普通音乐教师家庭，却自幼怀揣军旅梦想。这个少年恐怕从未料到，自己将经历怎样的时代洪流。\n\n16岁时他志愿参军，投身一战前线，历经四年堑壕战与两次负伤，但这些都未削弱这位年轻人报效祖国的热忱。《凡尔赛条约》签订后，他仍以优秀军官身份获准继续服役。\n\n§C命运§!不断将他引向东方，引向俄罗斯。30年代初，在总参谋学院进修期间，克雷布斯多次被派往苏联执行任务，包括远东地区。他首次目睹了这个充满矛盾的国度。\n\n然而武官助理的任期未满五年，“巴巴罗萨”行动便骤然启动。他因编制冗余被调往预备司令部。直至1942年5月，才与克斯特林一同被召回组建伪军——即“俄罗斯解放军”和“俄罗斯人民解放委员会”。\n\n此后近十年，他的军旅生涯充斥着对仆从国无意义的巡查、文书工作与演习检阅。直到红军突袭莫斯科维恩，才打破这一潭死水。\n\n当战线濒临崩溃之际，正是克雷布斯力主启用俄籍伪军稳定局势，并不断向柏林谏言放宽已名存实亡的“东方总计划”。可惜时值党卫军叛乱，无人理会他的主张。\n\n虽然共产党因内讧瓦解，但A-A线终究未能收复。\n\n这位将军本打算考虑卸甲归田。§C命运§!却另有安排。\n\n或许在内战中他确实站错了队，但凭借新元首戈林的赏识，他再次披挂上阵，以国家专员的身份重返莫斯科。\n\n汉斯·克雷布斯——这位忠于路线与国家的理想主义者坚信：要赢得俄罗斯人的忠诚，蜜糖比鞭子更有效。\n§C命运§!正对他微笑。"
