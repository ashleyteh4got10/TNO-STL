 goering_song_tt:0 "§8“难道你听不见良知风暴的呼喊，\n那曾向你耳边咆哮的声音？\n是的，向着太阳冉冉升起，新时代与我们同行！”§!"
 GGR_blank:0 ""
 POLITICS_HERMANN_GORING_DESC:0 "赫尔曼·戈林此人背负着沉重的包袱。他只比希特勒年轻一点，而这一点点的差距，不过是把关于他年龄和寿命的诘问，稍稍延后罢了。他腐败而颓废，通过侵吞财富和收受回扣，积累了巨额的个人资产。他曾是一个吗啡瘾君子——而据他那众多的敌人所言，现在依然是。\n\n然而，他也是早在继承危机达到顶峰之前，第一个被指定为希特勒继承人的人。\n\n他的个人魅力与能力毋庸置疑，更毋庸置疑的是，他比任何人都更有资格获得今日的头衔。从王牌飞行员，到荣耀的国家元帅，再到如今无可争议的元首，戈林的生涯从一开始就由军国主义所主导。在终于牢牢掌握了权力缰绳之后，他开始着手监督德国的转型——将其重塑为那个曾经、且本该一直存在的战士国度。\n\n至少，官方的叙事是这么说的。事实上，戈林真正的野心，远不止于统治一支徒有国家空壳的军队，以及其身后留下的尸山血海。诚然，是他的签名命令着整个国家备战，但毫不夸张地说，落下这笔的，实则是他人之手。戈林只是在迎合他那些军国派盟友的奇思妙想，因为他已无其他可依仗的伙伴；他的影响力早已不复当年，从四十年代的巅峰大幅衰落。本该是政治上的绝对主导，如今却变成了一种相互依存的关系——无论他还是他的“朋友”，都承受不起抛弃对方的代价。\n\n至少，目前是如此。最终，德国的战争机器要么将燃油耗尽，要么将再无敌人可战，届时舍尔纳的事业便会分崩离析。而当那一刻来临时，元首将终于可以放手一搏，自行其是。他会同时展现出自己作为狡猾政客的本色，和他那备受爱戴的“戈林叔叔”形象，最终让他的统治变得无可置疑。届时，也唯有届时，戈林才能将这个国家从自我毁灭中拯救出来。\n\n§V但愿如此。§!"
 POLITICS_FERDINAND_SCHORNER_DESC:0 "Not so long ago, Ferdinand Schörner had serious doubts about whether Göring could achieve the true militarist dream. The true... Endsieg.\n\nAfter the completion of War Plan B and the capture of Italy, Schörner believed that this was the end. All of Europe was under the German boot. He understood that by venturing into distant lands, Germany would inevitably step on a nuclear mine, so he opposed further German advancement. However, his opinion no longer mattered to anyone.\n\nSchörner was ousted from the pedestal of militarist radicalism by his most devoted comrade, Otto-Ernst Remer. The bloody knife slipped from Ferdinand's hand, and this knife now pointed swiftly to the East and across the Atlantic, demanding blood.\n\nThe institutions that Schörner had long subordinated to himself and the militarist cause, intoxicated by Germany's victories, were now in Remer's hands and working towards a new goal – to finish off the eternal enemies of the Reich, the USA and Japan. At any cost.\n\nThe war began. Schörner counted the minutes until the end, but... the end did not come. Japan fell, the USA fell, Burgundy fell. No one dared to press the big red button and end the suffering of this world. Endsieg was declared. Hermann Göring died shortly after. Ferdinand Schörner took his place in every sense: as Führer, master of the world, and the new puppet of the militarists, finding the latter terrifying and incredibly ironic.\n\nToday, Ferdinand Schörner holds the Earth in his hands, burning from a decade of wars, and it is unknown whether he will be able to extinguish the globe or if he will burn with it."
 POLITICS_FERDINAND_SCHORNER_COUP_DESC:0 "\"The path of man lies in death, for only in death does service end.\"\n\nThe son of a policeman, he began his ascent to triumph in October 1911, serving a year as a volunteer in the Leib Infantry Regiment of the Bavarian Army, which he left as a non-commissioned officer. He then studied philosophy and Italian in Munich as a student. In those distant years, it seemed that Ferdinand Schörner would become a teacher in one of the schools of Bavaria.\n\nBut the First World War set everything in its place. The wind of time grew stronger, and under its pressure, the old monarchical Germany, along with the Weimar democracy, was swept away. National Socialism secured its rights to the land and glory of the German people.\n\nSchörner failed to achieve the power and glory he sought during the establishment of the new order during the Second World War. He failed to crush the Russians and fill the power vacuum left by the SS in Berlin in the 1950s, and he could not take control of the Wehrmacht after years of planning when Speidel ruined his career.\n\nHowever, Schörner always had a plan. He followed Göring for as long as necessary to one day rise to an even higher Olympus than he had previously occupied.\n\nAnd it happened.\n\nSchörner no longer cares that his throne is built from bones and skulls; it is enough for him that he can now finish what he started. What was started a very long time ago. And if someone does not accept his actions, wants to argue, or sabotages – in the end, they will simply be dead. And he will complete what he started. No matter the cost.\n\nFor Schörner, the Reich is the perfect blank canvas, and he, as the artist, has a large brush and an ever-replenishing bucket of blood, and very soon he will begin painting his best masterpiece without a second thought.\n\n§VGermany shall be supreme, or it shall not be at all.§!"
 POLITICS_ALBERT_BORMANN_DESC:0 "In a regime as prone to nepotism and corruption as the Reich's, one would naturally expect the brother of one of the top party officials to rise high in his own right regardless of competence. Albert Bormann would disagree. Despite being the brother of the head of the Parteikanzlei and one of the most powerful men in the Reich, Albert's chilly relationship with his elder sibling has ensured his lack of continued mobility into the upper ranks of the government. Still, the industrious former attaché to the Führer is not without his own allies. Naturally, the man he once served as a go-between for the Heer, Adolf Hitler, was always fond of him, and it was really only with the late Führer's patronage that Albert escaped being sent off to rot in one of the farther-flung Reichskommissariats by his estranged brother.\n\nThe Führer's death threatened to upend all that. It would have, that is, had not the victor been the other main protector within the halls of the Reich's power; Hermann Göring, the darling of the militarists. It was this militarism that drew the official to the Reichsmarshall, along with the man's own considerable charm, something that Martin never really had. Now, Göring has found in the brother of one of his greatest foes a competent administrator, willing to carry out his orders without hesitation or mercy."
 POLITICS_THEODOR_OBERLANDER_DESC:0 "National Socialism is not perfect – a harsh reality that one can stubbornly ignore or try to accept and resolve it.\n\nUnlike the sycophants of Bormann who are stuck in the past or the excessively liberal lackeys of Speer, Theodor Oberländer had long identified his not-so-numerous supporters with those for whom the ideas of Adolf Hitler were not just a way of life or thoughts, but building material intended to realize the dream of the Aryan race and its living space, for that was its destiny.\n\nOberländer watched with dismay as the Aryan East turned into a pen for slave cattle, but all his efforts to prevent this were in vain – behind his back, everything he said was considered the ravings of a mad marginal, and his reputation was maintained only by renegades in the party who did not want to deal with Speer.\n\nHis persistence and careerism allowed him to remain at the top of the NSDAP for a sufficiently long time to consolidate around his person all those who disagreed with the Reich's eastern policy.\n\nBeing in formal exile in the Reichskommissariat Ukraine, Oberländer found like-minded people – Georg Leibbrandt, and with him the aging Alfred Rosenberg.\n\nGradually, their closed club began to be joined by completely unexpected persons, such as General Hans Krebs, who was known for the extreme strangeness of his beliefs about Russo-German friendship. Oberländer warmly welcomed the talkative Braunschweiger, seeing in him a useful ally from the ranks of Bormann.\n\nA decade later, fate would bring them together again here, in the expanses of Moskowien, to pass the baton of maintaining the greatness of the Reich in the East. Krebs had done his job and could retire with honor to his homeland, while Oberländer would have to maintain all the achievements of his colleague, preventing Moskowien from falling back into the abyss of hell.\n\nOnly §CDestiny§! knows whether this task will be the last in Theodor Oberländer's life..."
 GER_Otto_Ernst_Remer_army_chief:0 "§YIf Schörner is the butcher, Otto Ernst Remer is his bloody knife. As a young officer coming of age just before the rise of the Nazis, Remer devoted himself body and soul to the National Socialist cause. Remer served with distinction in the campaigns against Poland, the Balkans, and during Operation Barbarossa, eventually rising to a battalion command in the Grossdeutschland Division. Remer's crowning glory came when he was personally awarded Oak leaves to his Knight's Cross by no less than the Führer, Adolf Hitler, himself. Remer's unit served in the thickest fighting of the war, from the deep heart of Russia where the Union was finally broken to the hills of North England where war finally came to its close.\n\nIn the long years since then, Remer has steadily grown in his influence within the Wehrmacht, rapidly rising to become Field Marshal Ferdinand Schörner's right hand man, and as a consequence, the second most powerful man in the militarist faction of the officer corps. While Remer does have a strong degree of respect for his fellow warmonger and direct superior, his loyalty truly lies only with whoever he believes furthers the cause of the ultimate global victory of National Socialism, and whomever he thinks can best support that goal with action.§!"
 GENERAL_FERDINAND_SCHORNER_DESC:0 "§LBorn; 1892\nAge; 70\nBranch; Heer\nRank; Generalfeldmarschal\nThey call him \"Butcher\", \"Bloody Ferdinand\", \"Hound of War\" and many other brutal sobriquets. He is content with the title of Generalfeldmarshcall. He is skilled in large scale operations involving hundreds of thousands of men, and he cares nothing for their individual lives. Ferdinand Schörner is a man loved by none and feared by all. In the West Russian War it was said, the chances of being hanged as a deserter was greater than the chance of death in combat. His sway in the military was more than proven when, following a brief coup attempt at the end of that war, Schörner found his prospects for power actually rising.\n\nA veteran of the First World War, Ferdinand would end up as one of the Führer's favorite commanders in the Second. In more recent times he has also cultivated a mutually beneficial partnership with Reichsmarschall Göring, the old ace lending his political capital to Schörner's requests in exchange for the loyalty of the militarist faction.\n\nStill, the old devil of the Eastern Front has his own designs for the future, ones that may or may not require any politician to be his master. His rivalry with the other star of the Wehrmacht, Hans Speidel, is one of the largest obstacles he has yet to be encountered. Only time will tell if he has finally met his match, or, as some fear, he is only a step away from achieving his own ambitions.§!"
 GENERAL_JOHANNES_STEINHOFF_DESC:0 "§LAmong the heroes of the Luftwaffe, there is one pilot who stands head and shoulders above almost all others; Johannes Steinhoff. One of the most experienced aces of all time, Steinhoff was one of the very few pilots on either side of the Second World War to survive from the war's start to its end, flying combat missions throughout. Even after suffering horrific burns following a disastrous accident while test piloting the ME262 jet prototype, Steinhoff was back in the skies as soon as the doctors cleared him. Not wanting to lose such a valuable asset, Hermann Göring assigned Steinhoff to the Luftwaffe's pilot academy, where he served as head instructor for several years. Steinhoff would fly again during the West Russian War, and when that conflict too had passed he had hoped to live out the rest of his days peacefully as a teacher. It was not to be however, as the Bürgerkrieg enveloped Germany, the ace was faced with a hard choice. Eventually, he chose to follow Hermann Göring, the appointed successor to the late Führer. This time, the Reichsmarshall had more than just an instructor's billet in mind for Steinhoff, and shortly after Göring's victory the old veteran found himself as the new Oberbefehlshaber der Luftwaffe.§!"
 GER_Artur_Axmann_for_desc:0 "§YReichsminister des Auswärtigen und Reichsjugendführer\nMachiavellian Nazism§!\n------------\n§LArtur Axmann is considered one of the first politicians wholly of the Nazi generation. Artur first joined the NSDAP in secondary school, becoming an exemplary member of the Hitler Youth. After his graduation from the youth ranks of the organization, Artur became Reichsjugendführer, and fully took upon his shoulders the responsibility of teaching the German youth of the greatness of National Socialism and of the German Reich. Notably, he was also responsible for conscripting members of the Hitler Youth into the German army.\n\nAlways a patriot, Axmann also gave service to his country during the Second World War. He fought with the Wehrmacht on the Eastern Front, though was sadly forced to retire from this duty when he lost his arm in combat. Artur has known no life but that of a loyal Nazi since he was a child, and as such, remains totally and absolutely dedicated to the cause he has been brought up upon. As such, he is a clear symbol of the intelligence and dedication of the German children.§!"
 GER_Ferdinand_Schorner_sec_desc:0 "§YChef des Oberkommandos der Wehrmacht\nStratocratic Nazism§!\n--------------\n§LThey call him \"Butcher\", \"Bloody Ferdinand\", \"Hound of War\" and many other brutal sobriquets. He is content with the title of Generalfeldmarshcall. He is skilled in large scale operations involving hundreds of thousands of men, and he cares nothing for their individual lives. Ferdinand Schörner is a man loved by none and feared by all. In the West Russian War it was said, the chances of being hanged as a deserter was greater than the chance of death in combat. His sway in the military was more than proven when, following a brief coup attempt at the end of that war, Schörner found his prospects for power actually rising.\n\nA veteran of the First World War, Ferdinand would end up as one of the Führer's favorite commanders in the Second. In more recent times he has also cultivated a mutually beneficial partnership with Reichsmarschall Göring, the old ace lending his political capital to Schörner's requests in exchange for the loyalty of the militarist faction.\n\nStill, the old devil of the Eastern Front has his own designs for the future, ones that may or may not require any politician to be his master. His rivalry with the other star of the Wehrmacht, Hans Speidel, is one of the largest obstacles he has yet to encounter. Only time will tell if he has finally met his match, or, as some fear, he is only a step away from achieving his own ambitions.§!"
 GER_Wilhelm_Stuckart_hog_desc:0 "§YParteiminister\nMachiavellian Nazism§!\n------------\n§LWilhelm Stuckart was a judge before the rise of the NSDAP, and this brought him under the wing of Hermann Göring, who was Ministerprasident of Prussia at the time. Through his own legal expertise, as well as his growing friendship with the man, Stuckart quickly emerged as Göring's number two man, being partially responsible for much of the Prussian administration during that period, also participating in the theft of numerous cultural artifacts for the administration.\n\nWith the NSDAP's rise to power, Stuckart joined the Ministry of the Interior, eventually becoming a co-author of the Nuremberg Laws. He furthermore was responsible for signing a decree obligating the report of any newborns with deformities. It was later under this very same decree that Stuckart's own one-year-old son was euthanized for being born with Trisomy Twenty-One.\n\nThough he pledges himself to the party and the militarist cause, Stuckart is truthfully only loyal to the advancement of his own career and to his old friend Göring. Much of Stuckart's power has come from pure favoritism, though in these positions, he has proven himself one of the Reich's foremost legal experts. Most importantly however, he is a man whom Göring can trust.§!"
 GER_Rudolf_Diels_sec_desc:0 "§YChef der Geheime Staatspolizei\nMachiavellian Nazism§!\n--------------\n§LBefore there was Hangman Heydrich, before there was Gestapo Müller, there was Rudolf Diels. Diels is another of the long-time Göring cronies who have seen their fortunes rise dramatically thanks to their patron's ascent to Führership. Diels and Göring first met in 1933 when the latter was given the position as Minister-President of Prussia where Diels served as the head of the Preußische Geheimpolizei, the state's secret police. Thanks to his work, Diels had an encyclopedic knowledge of prominent political figures, including members of the Nazi party, and some of their dirtiest secrets. Seeing the potential benefit of having Diels' knowledge at his beck and call, Göring established what would soon become the Gestapo and placed Diels in charge of it. Diels tenure as Gestapo director would only last a year however as Heinrich Himmler and Reinhard Heydrich would work to undercut him within the government. Their maneuvering paid off and in 1934 Diels's tenure came to an end with Reinhard Heydrich succeeding him as the head of the Gestapo.\n\nDiels has kept largely to himself for the past two decades, although his connection to the Reichsmarschall has only deepened - he is even married to Ilse Göring, cousin of the Führer. Now that the accursed Heydrich is gone however, Diels can regain control of the organization that was always rightfully his and a new era of the Gestapo's dominance within the Reich is about to commence.§!"
 GGR_Artur_Axmann_for_desc:0 "§YReichsminister des Auswärtigen und Reichsjugendführer\nMachiavellian Nazism§!\n------------\n§LArtur Axmann is considered one of the first politicians wholly of the Nazi generation. Artur first joined the NSDAP in secondary school, becoming an exemplary member of the Hitler Youth. After his graduation from the youth ranks of the organization, Artur became Reichsjugendführer, and fully took upon his shoulders the responsibility of teaching the German youth of the greatness of National Socialism and of the German Reich. Notably, he was also responsible for conscripting members of the Hitler Youth into the German army.\n\nAlways a patriot, Axmann also gave service to his country during the Second World War. He fought with the Wehrmacht on the Eastern Front, though was sadly forced to retire from this duty when he lost his arm in combat. Artur has known no life but that of a loyal Nazi since he was a child, and as such, remains totally and absolutely dedicated to the cause he has been brought up upon. As such, he is a clear symbol of the intelligence and dedication of the German children.§!"
