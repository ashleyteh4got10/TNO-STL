 GGR_Wilhelm_Stuckart_hog_desc:0 "§YParteiminister\nMachiavellian Nazism§!\n------------\n§LWilhelm Stuckart was a judge before the rise of the NSDAP, and this brought him under the wing of Hermann Göring, who was Ministerprasident of Prussia at the time. Through his own legal expertise, as well as his growing friendship with the man, Stuckart quickly emerged as Göring's number two man, being partially responsible for much of the Prussian administration during that period, also participating in the theft of numerous cultural artifacts for the administration.\n\nWith the NSDAP's rise to power, Stuckart joined the Ministry of the Interior, eventually becoming a co-author of the Nuremberg Laws. He furthermore was responsible for signing a decree obligating the report of any newborns with deformities. It was later under this very same decree that Stuckart's own one-year-old son was euthanized for being born with Trisomy Twenty-One.\n\nThough he pledges himself to the party and the militarist cause, Stuckart is truthfully only loyal to the advancement of his own career and to his old friend Göring. Much of Stuckart's power has come from pure favoritism, though in these positions, he has proven himself one of the Reich's foremost legal experts. Most importantly however, he is a man whom Göring can trust.§!"
 GGR_Rudolf_Diels_sec_desc:0 "§YChef der Geheime Staatspolizei\nMachiavellian Nazism§!\n--------------\nbio"
 GER_Paul_Korner_eco_desc:0 "§YReichswirtschaftsminister\nMachiavellian Nazism§!\n------------\n§LPaul Körner, while serving as an artillery officer in the First World War, formed a long and lasting friendship with Herman Göring. He would later go on to join the NSDAP and the SS, rising rather quickly as an early member of both. Notably, Körner was present alongside Göring and Hitler during the negotiations for the NSDAP's coalition with Hindenburg, an agreement that led to Hitler's appointment as Chancellor and laid the path for his later rise to rule over Germany.\n\nAfter the NSDAP took full power, Körner found himself appointed as Göring's secretary for the Four-Year Plan, also holding a seat for the NSDAP in the Reichstag. At one time, Körner also served as Chairman of the Board of Directors of the Reichswerke, a company founded by his old friend. Though Körner is cunning and talented in his own right, his career has undoubtedly been mostly shaped and aided by his friendship with the Reich's uncle, and that does not seem likely to change.§!"
 GENERAL_EDUARD_WAGNER:0 "§LQuartermaster General of the Heer, Eduard Wagner has earned infamy for his brutality towards civilians. A devoted Nazi, Wagner crafted the regulations for the Wehrmacht and SS to cooperate in the killings of Jews and Slavs on the Eastern Front of the Second World War. He managed the task of supplying the Wehrmacht with winter clothes and fuel successfully during said war, and gained respect from many other generals for his efforts. During the West Russian War he reallocated supplies away from Himmler and towards the main front, aiding in holding the line while leaving the SS out to dry when they made their move. Since then Wagner has become ingratiated with the militarists, becoming a close ally of Ferdinand Schörner.§!"
 GER_Eduard_Wagner_desc:0 "------------\n§LQuartermaster General of the Heer, Eduard Wagner has earned infamy for his brutality towards civilians. A devoted Nazi, Wagner crafted the regulations for the Wehrmacht and SS to cooperate in the killings of Jews and Slavs on the Eastern Front of the Second World War. He managed the task of supplying the Wehrmacht with winter clothes and fuel successfully during said war, and gained respect from many other generals for his efforts. During the West Russian War he reallocated supplies away from Himmler and towards the main front, aiding in holding the line while leaving the SS out to dry when they made their move. Since then Wagner has become ingratiated with the militarists, becoming a close ally of Ferdinand Schörner.\n\nWagner sided with the militarists in the first German Civil War, and he's sided with the militarists again in the second. Wagner is determined to supply Schörner's forces with all the equipment they can get their hands on, and help Schörner purge degeneracy from the Earth once and for all.§!"
 ADMIRAL_KARL_JESKO_VON_PUTTKAMER:0 "§LKarl-Jesko von Puttkamer is a man of unmatched loyalty and willpower. Always on a fast track to greatness from his noble blood, von Puttkamer has been a man loyal to the Reich and the Reich alone. Hitler's naval adjutant during the war and afterwards, von Puttkamer was very close to the late Führer. Hitler once visited von Puttkamer in the hospital after he was wounded during Himmler's failed coup, proceeding to award von Puttkamer with the Wound Badge. Von Puttkamer currently professes loyalty to only the Führer and the Reich, though he publicly supports Göring and the Militarists.§!"
