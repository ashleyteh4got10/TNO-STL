 GER_GOR_protesters_cowed_desc:0 "The foolish students that were allowed to march through the streets of Germany uttering their ridiculous demands have finally been show how the Reich deals with traitors. While there are some remaining that attempt to organize protests, the vast majority has realized their folly."
 GGR_world_war_three:0 "World War Three"
 reich.601.t:0 "The Gilded Reichsmarschall"
 reich.601.desc:0 "If one were to look upon Hermann Göring, the infamous Reichsmarschall, founder of the Gestapo, and uncle of the Reich, it would be impossible to ignore the countless medals pinned to his chest. They jingle against each other with his every movement, packed so tightly together onto his uniform that some are covering others, making it impossible to discern one accomplishment from another. If it were any other soldier bearing them, they would each represent a great victory, a battle won, or an act of personal bravery; instead, they serve as little more than cheap decorations meant to enhance stolen valor and false legitimacy, borderline deceptive set-dressing to enhance his political image and nothing else.\n\nDespite how universal that political image is in German politics, it is hard to pin down what the man actually believes in beyond ruthless pragmatism. His clear desire to preserve Hitler's Reich the way it was intended lends himself towards the conservatives, while some of his political theories are more in line with Reformist beliefs on how Germany can be saved. Some theorized that it was entirely feasible that he may join one or the other, but those who had a better grasp on his character knew that both had the exact same problem, in his eyes;\n\nThe fact that he would not be the one in charge if he did join them.\n\nGöring was once the undisputed successor to Adolf Hitler, before years of complacency and believing his own hype made him unable to sense his position weakening until it was far too late. His arrogance allowed Speer and Bormann to begin to catch up, all while Heydrich insidiously slipped through the cracks of their conflict. As of today, he is not all powerful, but simply yet another contender, and at that, the one contender who lacked a personal power-base of ideologically similar allies to draw upon. Thus, desperate times called for desperate measures. The ‘Militarist' faction is composed of some of the most distasteful men the Reich has ever produced, but no matter their intentions, they possess the political power that Göring hopelessly wishes to reclaim for himself, leaving him with few other options. Their clashing visions for Germany are borderline incompatible, making their relationship not truly equal, but transactional; his role, in their eyes, is to be a popular figurehead for their cause and nothing more.\n\nGöring knows that any victory they deliver him will be mutilated, that becoming a puppet-Führer is no true triumph. But he also knows that if he does not take on the role of the Militarists public face, a lesser man will, and he will be left in the dustbin of history as a result. Thus, no matter the vile and venom, he will allow himself to be carried to the peak of German politics through their machinations. Only time will tell what his next step could be once he reaches that peak."
 reich.601.a:0 "Shoot first and inquire afterwards. If you make mistakes, I will protect you."
 goering.1.t:0 "A Surprise Military Coup d'état!"
 goering.1.d:0 "In a surprising, or perhaps unsurprising, and disastrous turn of events, it seems as though the military have turned against us! The military have not taken kindly to the rule of Hermann Göring due to the state of anarchy that German is currently in and have decided to exercise their power by couping the current government.\n\nGöring has been seen by many, not only within the military, as a largely ineffective leader who has been unable to manage the ever changing German political scene and assert dominance over the already teetering Reich.\n\nInternational observers watch on, stunned by the chaotic events that have engulfed the Reich, and the hold their breath, not knowing what is yet to come..."
 goering.1.a:0 "The coup is largely bloodless."
 goering.1.b:0 "We shall not surrender power!"
 goering.2.t:0 "Göring is Victorious"
 goering.2.desc:0 "Newspapers and televisions around the world broadcasted today Göring touring through Germania, greeted by crowds cheering his victory, with the Horst Wessel Lied being played by his bands and various banners of Göring's forces flying from windows and buildings. Surrounded by armed youth and loyal Heer soldiers, Göring delivered a firey speech to a mass of thousands proclaiming 'the dawn of a new Reich'.\n\nIn his oral manifesto, Göring promised a Germany 'that would set the world afire once more for the glory of the German people', and threatened his enemies with 'swift destruction under the Reich's iron boot', all with the imposing, cracked Volkshalle in the background setting the tone.\n\nThe international response has been telling. With the mobilization of military assets being announced by the United States and Japan, it seems that the three superpowers are beginning to prepare for what can be seen as another World War, looming in the distance."
 goering.2.a:0 "Finally, the Fatherland will be restored!"
 goering.3.t:0 "The Final Step"
 goering.3.desc:0 "The endless battle that has plagued Germany is now no more. Even as foolish holdouts attempt their romantic last stands, we claim victory for the Fatherland. The armies of the degenerate traitors have been cut down, and the German spirit for war reinvigorated. Now, Göring sets his sights on the last barricade to unifying the Reich - Speidel, his former commander Erwin Rommel, and armed units dedicated to defending Germania. Somehow, our Welthauptstadt has remained relatively unharmed in the civil war, and citizens of Speidel's territory has hailed the militarymen as heroes for saving the city.\n\nTo finish this conflict and bring about a new order in the world, we must ask Speidel and his men to stand down and let us enter. This decision is his, however, and we must wait to see the reply."
 goering.3.a:0 "The Reich will rise once more!"
 goering.4.t:0 "Germania Surrenders to Göring"
 goering.4.desc:0 "Since the moment we submitted our request to Speidel, the German nation has been unified in worry for fear of Speidel's response. This tension, however, has dissipated following the announcement, made by Rommel in front of international cameras, that Speidel would surrender Germania to Göring's forces peacefully and issued an order for all military forces of the city to lay down arms, an order most welcomed by the weary guards of Germania. Following the announcement, Germany erupted in joy and relief as nationwide, beer halls and pubs were flooded with crowds of citizens and off-duty soldiers desperate for a drink. Although supply was short in everywhere but Germania, it appears that peace has finally arrived to a battered Reich that needs it. For now."
 goering.4.a:0 "A toast to our power!"
 goering.5.t:0 "Germania Refuses to Stand Down!"
 goering.5.desc:0 "The German nation, scarred by its own blood and overworked by its own soil, has awaited with unabated tension over Speidel's answer to our requests for his forces to stand down. It seems, however, Germany is not at peace just yet, as the damned fool has announced that he will not lay down weapons, and instead called up Germanians to fight against our armies. Such an announcement has troubled our citizens, and we must take steps to correct this grave error as soon as possible. Although this battle is one we can win, it will be costly, and will destroy the Welthauptstadt we have worked so hard to build."
 goering.5.a:0 "Those damned foxes will see the real might of Göring!"
 goering.8.t:0 "The Anti-Heydrich Pact"
 goering.8.d:0 "Unexpected news has reached us from Northern Germany today. It seems that the reformist liberals, led by the traitor Albert Speer, have approached us with an offer of ceasefire. Unfortunately, this is not because they wish to join our cause- rather, it is because a threat greater in their eyes than our faction has popped up.\n\nReinhard Heydrich, unquestionably one of the worst men in all of the Reich, has been steadily gaining power and influence while the other factions have fought with each other. He is now powerful enough to be a recognizable threat, on par with Bormann and Speer. This has worried the Speerites, who are now approaching us with an offer to put aside our differences and destroy the common threat- that of the SS and their foul Burgundian System.\n\nOf course, it's a common belief among our soldiers that we could easily deal with SS rabble without the help of some student militias, but the freed up soldiers would certainly be quite the help in crushing this menace once and for all. It is our decision to make."
 goering.8.a:0 "A ceasefire will work for now."
 goering.8.b:0 "We don't need his aid."
 goering.9.t:0 "The Anti-Heydrich Pact"
 goering.9.d:0 "Unexpected news has reached us from Southern Germany today. It seems that the Reich's conservatives, led by the traitorous Martin Bormann, have approached us with an offer of ceasefire. Unfortunately, this is not because they wish to join the cause- rather, it is because a threat greater to them than we are has approached.\n\nReinhard Heydrich, unquestionably one of the worst men in all of the Reich, has been steadily gaining power and influence while the other factions have fought with each other. He is now powerful enough to be a recognizable threat, on par with Bormann and Speer. This has worried the Bormannites, who are now approaching us with an offer to put aside our differences and destroy the common threat- that of the SS and their foul Burgundian System.\n\nOf course, it's a common belief among our soldiers that we could easily deal with SS rabble without the help of some student militias, but the freed up soldiers would certainly be quite the help in crushing this menace once and for all. It is our decision to make."
 goering.9.a:0 "A ceasefire will work for now."
 goering.9.b:0 "We don't need his aid."
 goering.23.t:0 "Regime Stabilization in [FROM.GetName]"
 goering.23.d:0 "According to recent reports and messages, the stabilization process in [FROM.GetName] has ended.\n\nPartisan activity has gone down to a minimum, local collaborationists are filling our lines and the garrison duty of the Wehrmacht stops being as expensive as earlier.\n\nHowever, the situation in the region is still quite tense, and we have no guarantees that the current state of affairs is nothing but a \"calm before the storm\".\n\nThus, we have two options for further action:\n\nWe can withdraw a military administration from the Reichskommissariat, replacing it with a more efficient in perspective civilian one.\n\nOr, as Field Marshal Schorner suggests, we postpone this question until better times or remove it from the table for good, leaving the current military appointee in the Reichskommissar position."
 goering.23.a:0 "A civilian rule will be more preferable."
 goering.23.b:0 "[FROM.GetLeader] will stay in his position."
 goering.56.t: "Erhard Milch Returns From Madagascar"
 goering.56.d: "It was a rainy evening in Germania. Thick rain clouds had gathered over the city all day, but what was pouring down now was the heaviest yet. \"What rotten weather,\" Schörner muttered quietly to himself, but loud enough for Göring to hear. They were standing at one of the showpieces of German infrastructure, Tempelhof Airport. \"I really hope it's worth waiting here in the rain,\" Schörner said, addressing Göring. \"The decision to bring Milch back from that godforsaken shithole Madagascar is a brave one, I must admit, my Führer,\" he added with a mischievous smile.\n\nGöring knew what Schörner was hinting at and understood that Milch's return entailed certain risks. The rumors about Milch's unclear parentage and his efforts to conceal it were not widely known, but people like Schörner definitely knew and would exploit it if given the chance. \"Well, I only see advantages for us in his return,\" Göring replied, trying to sound as confident as possible. \"Erhard has done his fatherland a great service by securing that island for us, and his expertise in aviation technology is much better placed in the Luftwaffe than in a stuffy office in the jungle. I'm sure you see it the way I do, right?\" Göring added.\n\n\"Of course, my Führer, I would never question your decisions or authority,\" Schörner responded. Göring knew this statement wasn't entirely true, but he didn't let it show. There was no reason to offend Schörner at that moment. They both turned towards the tarmac, where the plane had come to a standstill. After a short time, the doors opened, and Erhard Milch and his entourage descended the stairs and re-entered German soil. A flurry of flashes from the journalists' cameras lit up the scene as Milch walked towards Göring.\n\n\"Heil Göring,\" Milch shouted proudly, followed by a slight smile. Göring also smiled slightly. \"Field Marshal Milch, it is a great pleasure to welcome you back into our ranks,\" Göring began his greeting. \"The pleasure is all mine, my Führer,\" replied Milch. \"It's good to be back in civilization.\" \"I'm sure of that,\" Göring replied. \"You have served the German fatherland well overseas. Defeating that rebel scum and restoring German order to that anarchic place was an excellent performance. I am sure you will perform just as well in your new position in the Luftwaffe.\""
 goering.56.a: "At least he sincerely hoped so, for Milch's sake and his own."
 goering.57.t: "Up to Date on the Updates"
 goering.57.d: "\"News from the Dominican Republic, my Führer.\" Artur Axmann spoke as soon as he was welcomed into the office of Hermann Göring, lacking the usual fear behind his eyes whenever he arrived. Most likely due to the much welcomed absence of Schörner, or maybe just because he had brought a friend along with him this time. It was a rare sight to see the Chief of the Abwehr as well as the Reichsaußenminister delivering a message personally; it prompted Göring to set down his pen and pay them both a proper amount of attention. \"It seems that Rafael Trujillo has passed away. I have already expressed our condolences.\"\n\nThe Führer nodded, recognizing the need for such things. He had never met the man in person, but still felt a genuine melancholy, mild as it may have been, to hear that he was gone. After all, he had effectively served as the Reich's gateway into the Americas, partly out of unity between Fascists, partly because he was stupid enough to let his government be infiltrated from top to bottom by spies, despite his best efforts of keeping them at arm's length. That was most likely the reason why Gehlen was also here to speak with him. \"A sad day. How does this affect our position in the Caribbean?\" Göring asked, sparing little more than a single sentence for a supposed a friend of Germany.\n\n\"Officially? It doesn't.\" Axmann continued, already expecting such a question. \"He is to be succeeded by Rafael Trujillo-junior, that is-who has continued to parrot the same sentiment as his father: public neutrality, privately warm but not allied.\" Neutral news at best, if it hadn't been preceded by that need to clarify.\n\n\"Unofficially...\" Gehlen continued, as the conversation had finally wandered into his domain. \"Ramfis has no real power. He's far too busy indulging his hedonism to effectively lead a country. Such responsibilities have been delegated to his Chief of Security, a man by the name of Johnny Abbes Garcia. For all intents and purposes, we should treat him as the true ruler of the nation.\"\n\nGöring nodded again, already sensing the opportunity presented to him. \"So it's the security service which now governs. The service which we have already fully penetrated.\" Any sadness that may have come about from Trujillo's death was already washed away, replaced with an eager grin. \"Is it safe to say that he doesn't know the extent of our infiltration? Surely he would have done something about it if he did.\"\n\n\"Presuming he even cares.\" Gehlen nodded, his expression unreadable as always, but his tone clearly revealing a certain level of satisfaction. \"He has already requested the aid of our own intelligence services in rooting out American spies and any resistance movements who seek to take advantage of the death of Rafael, with promises of returning the favor in the future as payment. In short, he is shaping up to be even friendlier to us than Rafael ever was.\""
 goering.57.a: "In that case, perhaps a sn official state visit is in order..."
 goering.5000.t:0 "Italian Steel"
 goering.5000.desc:0 "Despite our best efforts, we have been thrown back by Italian Steel. The Hungarians, with their Italian allies made a stand that we could not break. The Heer has been badly bloodied and any hope of another offensive was dash across the rocks. We will have to lick our wounds and find another way."
 goering.5000.a:0 "Damn Italians."
 goering.5001.t:0 "Italian Steel"
 goering.5001.desc:0 "Despite our best efforts, we have been thrown back by Italian Steel. The Romanians, with their Italian allies made a stand that we could not break. The Heer has been badly bloodied and any hope of another offensive was dash across the rocks. We will have to lick our wounds and find another way."
 goering.5001.a:0 "Damn Italians."
 goering.5002.t:0 "Italian Steel"
 goering.5002.desc:0 "Despite our best efforts, we have been thrown back by Italian Steel. The Serbians, with their Italian allies made a stand that we could not break. The Heer has been badly bloodied and any hope of another offensive was dash across the rocks. We will have to lick our wounds and find another way."
 goering.5002.a:0 "Damn Italians."
 goering_peace_events.32.t:0 "The Conquest of the Holy Land"
 goering_peace_events.32.d:0 "If Schörner had been a sane, rational individual instead of the berserker disguised as a Field Marshall that he was, and had decided to limit his territorial conquests to an extent that would have perhaps been expected and accepted of the new Germany, the Levant would have been the one area he would have sought out over anywhere else. The strategic value the area represented was enormous; Not only did seizing it dash any hopes of Italy reasserting colonial control over the region, but it also vastly swung the world's oil economy in Germany's favour. Even without the rest of Arabia-which would come next, thanks to the springboard that this conquest had provided for them-these otherwise worthless deserts would ensure that every war machine of the Reich would be fully fueled and with ample reserves to boot for the rest of their efforts. On top of all of that, the rest of the Middle East was not the only target that was officially in their sights now that the likes of Syria and Palestine had been seized; Now, the Heer was a single country's march away from the likes of India. If Turkey had been the first step towards confronting the Co-Prosperity Sphere, this had been the second step. Indeed, the area represented a massive victory for Germany.\n\nNot a single one of those factors mattered in the least for that victory.\n\nInstead, when the champagne bottles were popped and the medals were distributed, the cause for all the joy was that the Nationalsozialistische Deutsche Arbeiterpartei had obtained the final victory against their oldest and most hated enemy. A second Endsieg if such a thing ever existed. Whether they had claimed it for themselves or had once again been conquered by another, the fact remained that Israel was the Jewish homeland. The last stronghold, the final nest of sin, had been seized. Every soldier of the Heer who had set foot in these lands could feel what was coming next in their bones. Every single German on this Earth could feel it in their hearts.\n\nEveryone except Speidel, of course. He had argued that the city of Jerusalem had historical value. That these lands were not just Holy for the Jews, but also the Christians and Muslims. That any significant destruction would annihilate any last trace of international prestige they once possessed, and furthermore vastly increase the resistance they would face when they pressed further into the Middle East.\n\nHis objections were 'politely' discarded, for nothing could prevent the work of Hadrian from finally being finished."
 goering_peace_events.32.a:0 "The last Holocaust.(Are we sure it's safe to write this????)"
 goering_successor.1.t:0 "The Successor Speaks"
 goering_successor.1.desc:0 "The Reichsmarschall swaggered to the front of the crowd with confidence, his trademark grin stretching from ear to ear. Today he was adorned in his blue Luftwaffe uniform, its medals clanking as he took his position behind the podium. Behind him stood his most loyal advisors: the bespectacled Ferdinand Schörner, the sneering Otto Ernst Remer, the smartly suited Wilhelm Stuckart.\n\n\"Members of the Reichstag,\" Göring spoke after a few moments of silence, gripping the podium tightly with his jewelled fingers. \"I have humbly accepted the Führer's offer to become his official successor. Many of you will know that such a proposition has been enshrined in our law since 1938. I am proud to say that the strength of our relationship has only grown in this time.\" His eyes, blue and narrow, dragged themselves across the brown masses of the Reichstag. \"The Reich, however, has only weakened! As your Führer, I promise to drag us from the marshy swamp of our own making and into a glorious new era!\" His voice grew slightly strained as he continued the speech. \"I shall deliver us into an age of absolute military domination over our foes. Make no mistake. The Führer's vision for Europe must be completed!\"\n\nA sporadic wave of applause swept through the crowd, emanating largely from the militarists and Wehrmacht officers, but also from a few conservatives. Göring gave an uneasy smile and glanced behind him, where Schörner was watching on eagerly.\n\n\"To strengthen our beautiful Vaterland,\" Göring continued, \"we must save our economy from the clutches of those who wish to exploit it for their own selfish purposes. You know who I'm talking about!\" Göring's voice grew more energetic, and he puffed out his chest in excitement. \"I'm talking about the parasitic German bankers! I'm talking about the Swiss! Let us revitalize our economy, let us re-energize the German workforce, let us abolish wasteful spending on useless projects that plague the Reich!\""
 goering_successor.1.a:0 "A wonderful speech, Herr Göring!"
 goering_successor.2.t:0 "One Bad Photo..."
 goering_successor.2.desc:0 "\"Let's try one with a far-off look,\" Göring instructed the young photographer. He looked dramatically to the side, brow furrowed in stern thought. The camera clicked multiple times. He was wearing his personalized dove-gray uniform, complete with medals. He turned back to the photographer. \"Bernhard, was it? Ah, Bertold. My apologies. Show me yesterday's photograph. The one with the blue Luftwaffe uniform.\" Bertold brought the printed photo over. \"Hmm... I want that one destroyed. This is going in the newspapers, remember. I must look my best.\"\n\nSchörner arrived in the doorway with a small document tucked under his arm. Göring beckoned him over and examined the papers. The Feldmarschall had drafted a plan to violently suppress the student protests that had broken out since his appointment as successor. Bertold was prowling around the room, experimenting with different angles and muttering to himself. The young photographer had probably been a student himself, not so long ago. Göring gave a heavy sigh. He handed the document back and nodded his approval. Oh well. The students had been growing more and more unruly. It was time they were taught a lesson.\n\n\"Reichsmarschall Göring,\" the photographer whispered in a shaking voice, drawing Göring from his thoughts. \"I took a photograph of your plan. The one ordering Heer troops to use brutal force against the peaceful student protests. I will leak this photo unless you cancel this order immediately. Is that understood?\"\n\nGöring stared at the young man in shock, but said nothing. He simply rose to his feet, thanked him for his time, and walked over to the waiting Schörner. The officer noticed his glum expression, and looked over at Bertold with suspicion."
 goering_successor.2.a:0 "That photographer is a threat, Ferdinand. Eliminate him."
 goering_successor.2.b:0 "Make sure that young man knows how unhappy I am!"
 goering_successor.3.t:0 "A Bad Fall"
 goering_successor.3.desc:0 "\"Here is the photograph, Reichsmarschall,\" Schörner said smugly, sliding the brown envelope across the dinner table. Göring looked up from his hearty meal with a chuckle, shaking the contents of the envelope onto the table. Wilhelm Stuckart lowered his fork and frowned in confusion.\n\n\"No need to worry yourself, Wilhelm,\" Göring grinned as he inspected the photo. The image was of Göring sitting down on a chair and inspecting a document. One of the papers was hanging loosely in full view of the camera, detailing much of Schörner's plans against the student protests. \"We'll get back to matters of policy in a second.\"\n\n\"I regret to inform you that our good friend Bertold took a nasty fall from his apartment window,\" Schörner shook his head in mock grief. \"He was quite high up, I'm afraid.\"\n\n\"He must have been taking photos of the sky!\" Göring roared with laughter, slamming the table in his hand. He wiped a tear from his eye and turned to Stuckart. \"You haven't got a lighter, have you?\" He plucked the lighter from his advisor's palm and lit it underneath the image with glee. The bright yellow flames licked across the photograph, contorting the image as it folded and blackened. Göring watched on with satisfaction, the flames reflected in his pale blue eyes."
 goering_successor.3.a:0 "Curiosity has killed the cat..."
 goering_successor.4.t:0 "A Fatal Leak"
 goering_successor.4.desc:0 "\"Could you... could you portray a calmer expression, perhaps?\" Johann asked politely to the Reichsmarschall, who was posing with one foot on a stool and a hand clasped around his Luftwaffe baton. His cloak was blowing magnificently behind him, thanks to the chilly gusts of wind from the open window.\n\n\"I'll give you calm!\" Göring yelled, breaking his pose and kicking the stool over. Naturally, Göring had hired a new photographer. Someone more professional. Someone older. Someone less likely to support Speer. That didn't stop him from getting on his nerves.\n\nSchörner arrived at the doorway. Göring strode over him with a thunderous expression and swung his baton, hitting the Feldmarschall in the side of the arm. The officer looked more shocked than hurt.\n\n\"You useless fucking idiot! I told you to exterminate that little rat Bertold! Why the fuck is he still alive to leak photos of our plan? The protests have tripled in size!\" Göring was about to throw his baton to the floor in fury but stopped himself at the last moment. It was too precious to risk breaking. \"That agent you sent to deal with Bertold? The one who got fucking caught? I want him liquidated immediately.\"\n\n\"Is that necessary, Hermann?\" Schörner responded with gritted teeth, rubbing his sore arm. Any other day, he would have exploded with fury. \"Does it matter what the students think? They weren't going to support you anyway.\"\n\n\"Have. Him. Liquidated. I won't ask again. And don't you dare call me Hermann!\" He felt a wave of smugness as Schörner nodded in compliance. It wasn't often he had such power over the officer. The smugness swiftly faded, however, as images of violent student riots exploded in his head."
 goering_successor.4.a:0 "We don't have any time for failure right now."
 goering_successor.4.b:0 "Maybe it won't be so bad?"
 goering_successor.5.t:0 "The Rat Speaks Out!"
 goering_successor.5.desc:0 "\"Could you... could you portray a calmer expression, perhaps?\" Johann asked politely to the Reichsmarschall, who was posing with one foot on a stool and a hand clasped around his Luftwaffe baton. His cloak was blowing magnificently behind him, thanks to the chilly gusts of wind from the open window.\n\n\"I'll give you calm!\" Göring yelled, breaking his pose and kicking the stool over. Naturally, Göring had hired a new photographer. Someone more professional. Someone older. Someone less likely to support Speer. That didn't stop him from getting on his nerves.\n\nSchörner arrived at the doorway. Göring strode over him with a thunderous expression and swung his baton, hitting the Feldmarschall in the side of the arm. The officer looked more shocked than hurt.\n\n\"You useless fucking idiot! I told you to deal with that little rat Bertold! I told you to intimidate him! Why the fuck did he leak photos of our plan? The protests have tripled in size!\"\n\n\"My apologies, Hermann\" Schörner responded with gritted teeth, rubbing his sore arm. Any other day, he would have exploded with fury. \"Does it matter what the students think?\"\n\n\"Of course it bloody matters!\" Göring exclaimed. \"And don't you dare call me Hermann!\""
 goering_successor.5.a:0 "All over a damn photo!"
 goering_successor.6.t:0 "The Army Marches On"
 goering_successor.6.desc:0 "Claus winced at the screeches that drilled into his ears. Masses of students bustled before him, waving placards and bricks alike, screaming at the armed soldiers like banshees. A large papier-mâché head was floating above the crowd with thin evil eyes and a feline grin, mockingly painted in makeup. There were several chants, disparate and sporadic, but the loudest without question was: \"Down with Göring!\"\n\nClaus gripped his rifle tightly and looked towards his comrades for assurance. He was 18 years old and fresh out of training. He had imagined being sent to the beautiful expanses of the snowy eastern front, or down in the exotic jungles of Afrika. He did not expect to be facing down fellow Germans for his first assignment.\n\nSoldiers were pushing forwards, screaming at the protestors to disperse. The closest cluster backed away instantly, apart from one girl who thrust her anti-Göring sign forwards and screamed back. One of the soldiers walked up and smashed her in the face with the butt of his rifle.\n\n\"Disperse!\" Claus yelled. His voice cracked. He raised his rifle at the students, who dropped their signs and darted. He saw a group of soldiers tackling a pair of brick-throwers to the ground and smashing them to a bloody pulp with their boots. Another comrade fired a shot into the papier-mâché head, which exploded as the crowd nearby broke apart with a cry. Claus did not let the fear overtake him. He was a soldier of the Reich. Sure, these were fellow Germans... students, around his age... but they were protesting against the next Führer, against the Reich. Anyone who protests against the Reich protests against the German people. One of the demonstrators lobbed a brick towards him, missing the young soldier by a few inches. Claus brought his rifle up and fired into the student's legs, forcing him to the ground. \"I SAID, DISPERSE!\""
 goering_successor.6.a:0 "Sacrifices must be made by all for the glory of the Reich."
 goering_successor.7.t:0 "Triumph In Germania"
 goering_successor.7.desc:0 "Hermann Göring looked down at the grandiose display before him. He gripped onto the ledge of the balcony with one hand and waved his jewel-encrusted baton with the other. To enrapture the German people, he thought to himself with a smile, one must appeal to their base instincts: War, military, and grandeur. He had ordered a display of power on a grand scale not seen since the glorious celebrations following the triumph of the Second Welktkrieg. It had been expensive, of course, but his revitalization of the economy following the Führer's inevitable demise would more than make up for it.\n\nA sense of pride surged through him as the Hermann Göring Division marched onwards to lead the procession. The splendor of those uniforms, the synchronization of their steps, and sheer beauty of those mechanicals creatures rolling forward... it was almost too much to handle. He was enraptured by his own propaganda! Göring chuckled softly. Perhaps he would build a statue of himself in Germania? One for Hitler too, of course, but maybe ever so slightly smaller than his...\n\n\"Stop prattling, Feldmarschall!\" Göring laughed as he turned towards Ferdinand Schörner, who was conferring intensely with Otto Ernst Remer and Johann von Kielmansegg. \"You're missing the parade!\""
 goering_successor.7.a:0 "Ah Ferdinand, did you see that Maus? Amazing!"
 goering_successor.8.t:0 "A Matter of Shooting First"
 goering_successor.8.desc:0 "\"Heydrich must die.\" Göring folded his arms and prowled around the table, deep in thought. \"He and his lackeys must be purged. We'll use the failed 50s coup as our explanation.\" Göring could feel a surge of energy spiking through him as he reeled off his list of foes. He hadn't felt this alive since 1934. \"I still haven't decided on Heinrich Müller. He's a Bormannite, yes, but many of them will flock to my cause when I'm declared Führer.\"\n\n\"He stays on the list. He's too much of a risk.\" Schörner was strumming his fingers against the table. \"As for Speer's supporters, we should start with his merry band of Bolsheviks. Kiesinger, Schmidt, that loathsome Erhard, Treskow... they should all be hanged as traitors.\"\n\n\"Not Treskow,\" Göring corrected. \"He is a military man. He must be shot.\" The Night of the Long Knives had not been this complicated. Purging the SA leadership, a few conservatives, Party rivals - nothing compared to the political quagmire Göring had to navigate.\n\n\"There are many rising officers that must be taken care of as well,\" Schörner continued. \"Shot, if you insist.\"\n\n\"Show me the list.\" Göring ran his eyes over the names with a frown. \"Are these men even political?\"\n\n\"Perhaps not, but I certainly am,\" Schörner said with an unblinking stare. \"If I weren't, you would not be in such a high standing with the Militarists.\"\n\n\"If you think these deaths are necessary, then so be it,\" Göring muttered, understanding the threat. Was this how Hitler had felt all those years ago, as Göring nudged him into purging his own personal rivals?"
 goering_successor.8.a:0 "What we need is a Reich free of traitors and threats."
 goering_successor.9.t:0 "What's In A Name?"
 goering_successor.9.desc:0 "\"Ah... excellent!\" Göring threw the newspaper back onto the table and plucked up the next document. He scanned it intensely and shook his head with a tut. \"This extract shows the Führer praising Goebbels, not me.\"\n\n\"My apologies, Reichsmarschall,\" Herr Fischer said hastily. \"My men have been scouring for weeks -\"\n\n\"Apologies are not necessary!\" Göring laughed. \"Just replace 'Joseph Goebbels' with 'Hermann Göring'. He's not going to complain from the grave, is he?\" He picked up a transcript dated from September 1st 1939. It was one of Hitler's many speeches to the Reichstag. \"Ahem. 'Should something happen to me in this battle, my first successor will be party member Göring'. Make sure this one is released first.\"\n\nNewspaper and speech extracts. Quotes by esteemed Party members. Newsreel footage of Hitler and Göring shaking hands, or standing side by side on the Reichstag balcony, or deliberating over war plans. Audio recordings of Hitler praising Göring. The successor had ordered his men to comb through all of it, compiling everything for detailed inspection. Once they had received his blessing, they would all be sent to the Ministry for Propaganda and Public Enlightenment and spread to the German people. The public had to be certain of the future Führer's legitimacy, and so he was presenting himself as the natural progression of leadership. For the average German, continuity means safety."
 goering_successor.9.a:0 "Hermann and Hitler, a pair for the history books!"
 goering_successor.10.t:0 "Dig Out the Supply Cashes"
 goering_successor.10.desc:0 "Hauptmann Joseph Graf sucked on his cigarette as his men dug furiously, spraying soil in all directions. Some of the caches had been locked up in abandoned bunkers. Others had been placed in wooden boxes, hidden in storage facilities and falsely labelled. The Hauptmann, in all his boundless luck, had been instructed to uncover the ones buried underground.\n\nAs the Reich's political stage began to crumble alongside Hitler's health, Göring and Schörner had soon realized the inevitability of the impending civil war. A swift operation was initiated, in which weapons and other supplies were secretly diverted to hidden depots throughout the Reich. Now that the bloodshed had begun, it was time to unleash the concealed weaponry.\n\nThere was a loud clunk of a shovel hitting metal. One of the soldiers looked up at the officer with a grin. Hauptmann Graf stomped out his cigarette and spread his arms open."
 goering_successor.10.a:0 "Clean them all out boys!"
 goering_successor.11.t:0 "The Power of Money"
 goering_successor.11.desc:0 "\"Heil Göring!\" Schörner announced with a salute as he entered the war room. Despite the cruel fate that had befallen the Reich, Göring could not stop his chest swelling with pride when he heard such phrases. He saluted in response and beckoned the Feldmarschall in.\n\n\"Come, come. We are discussing a push into Bormann's territory.\" Göring looked back down at the map and stroked his chin in thought. \"Do you have anything to report?\"\n\n\"Yes, my Führer,\" Schörner responded smugly. He joined Remer and von Kielmansegg at the map. \"Many of the Waffen-SS troops we bribed have followed through on their promises. They have arrived at our territory, and are ready to fight, as per your commands.\"\n\n\"Excellent!\" Göring slapped the table in excitement. \"Heydrich will be furious! I want you to officially add this new unit into our army. Their skill set will be useful for very specific operations.\"\n\n\"I shall begin planning immediately, my Führer,\" Schörner responded curtly, giving another salute and marching towards the door.\n\n\"One more thing, Feldmarschal!\" Göring called out. \"This new division to be officially commissioned as the 'Waffen-SS Hermann Göring'. Understood?\""
 goering_successor.11.a:0 "The Waffen-SS is loyal to the true Führer!"
 goering_successor.12.t:0 "A Wild Ace Appears"
 goering_successor.12.desc:0 "The recent Bürgerkrieg that has consumed the German Reich has so far been an almost exclusively ground affair, fought on the boots of infantrymen, the wheels of trucks, and the treads of tanks. That was, until this morning. Residents and soldiers alike of Reichsmarschall Göring's territory looked up to the sky just in time to see a bolt of lighting arc through the skies and towards the enemy lines.\n\nThe pilot of this craft? Johannes 'Macky' Steinhoff, top ace of the loyal Luftwaffe and a veteran of both the Second World War and the West Russian War. Steinhoff distinguished himself as the first operational pilot of the Luftwaffe's crowning joy during the Second World War, Me 262 jet. Tragically, Steinhoff was significantly burned across much of his body in a horrific crash during one of his take offs. At the outbreak of the Civil War, Steinhoff was one of the leading Luftwaffe instructors, but his desire to support his beloved Luftwaffe was so great that he immediately resigned his position and volunteered to fly once more.\n\nGöring, former Reichsmarschall des Luftwaffe of the German Reich, has personally congratulated Steinhoff, and offered him a promotion once the war for Germany has been won."
 goering_successor.12.a:0 "Like a blazing comet across the sky!"
 goering_successor.13.t:0 "A Meeting in the Beer Hall"
 goering_successor.13.d:0 "Reichsmarshall Göring sat in his normal chair the Bürgerbräukeller Beer Hall, the one he had occupied since his time as a would-be revolutionary all those years ago with Adolf and the others. It was not the past he was here to meet however, but the future. That was why he was constantly checking his custom-made, lavishly expensive watch while he sipped from the establishment's trademark brew. His guest was running late, but given the enormous stakes for which the appointed successor of the Führer was playing, a few minutes give or take were mere trivialities. For the past month he had been on a blitz to wine and dine the upper crust of the Reich's society, using every bit of charisma and charm to win over the elites who would be able to bring considerable resources to bear in the event he needed it.\n\nAs Göring waited he continued to drink, and as he drank he allowed his mind to wander back to the past. Meeting Adolf, hosting the Alter Kampfer at Carin's insistence. The names of his old comrades flashed through his mind: Hitler, Rosenberg, Hess, even Röhm. Fucking Röhm. The degenerate pervert had gotten what was coming to him. That was long in the past however, and only was worth remembering as a testament to how fickle one's grip on authority and power could be. Whatever else might happen, Göring promised himself in that moment, he would never allow himself to end up as Röhm had. He would sooner drink a mug of poison then be humiliated in such a manner.\n\nThe slam of a door brought him out of his memories. He looked over to see the man he had been waiting for all night. He stood up to properly greet his guest and with a jovial smile he bellowed out:"
 goering_successor.13.a:0 "\"Ah, Herr Bormann, how glad I am to see you!\""
 goering_successor.14.t:0 "The Defector"
 goering_successor.14.d:0 "Nothing would ever be normal in the Reich again, the erupting Civil War had seen to that as sure as the sunrise. Still, even for the often ludicrous chaos that was now all too common across the globe, this was something else. Hermann Göring watched as the small military transport plane came in for a landing at the Kiel airport. Fighters and interceptors circled lazily in the sky, keeping the way safe for the small craft even in the capital of the provisional government that Göring had proclaimed following the death of Adolf Hitler. This VIP was too valuable to take any chances with.\n\nIt was Bormann. Not Martin of course; the conniving bastard was no doubt in Wien right now, hearing news of what Göring had pulled, shaking his fist impotently. No, this was Albert Bormann, the brother, who apparently had gotten any sense the family line had ever possessed. He had always displayed far more sense than Martin in supporting Göring's economic and military ambitions, and when Hitler had named Göring as his rightful successor, Albert had offered his services.\n\nHaving the brother of the man who was the biggest threat to his rule firmly within his camp was an utter coup, and the propaganda value was not lost on the would-be dictator. Even as he stood expectantly as the plane came to a smooth halt, the printers in every loyal city were churning out posters of Albert endorsing the rightful leader of the German people by the thousands. Göring smiled as he played out dozens of scenes of Martin's rage and consternation over and over again in his mind."
 goering_successor.14.a:0 "Can't manipulate your way out of this one you bastard."
 BOOKMARK_TFL_NEW_GORING: "§LDAS GROßGERMANISCHES REICH§!\n\n"
 BOOKMARK_TFL_NEW_GORING_DELAYED: "§GNEW IN THE FALL QUALITÄT PT. 2:§!\n§Y- §OFALL VORBECK§! CONTENT\n- MORE FLAVOR EVENTS\n- EXPANSION OF §bTHE MILITARISTS§! MECHANIC§!\n§W--------------\n\n\n£texticon_bookmark_GGR\n\n\n\n\n§FThe Greater German Reich, the undisputed master of Europe, sits in a precarious position. Long gone are the years of their miraculous economic recovery in the aftermath of WWI and the victories of the 1940s, as Adolf Hitler led Germany forward down the path of National Socialism.\n\nThe 1950s brought forth the triple crises of the West Russian War, an SS coup, and a debilitating economic crash. The fruits of victory in the Second World War have begun to rot in Germany's grasp, and if nothing is done, the thousand year Reich may last less than a hundred.\n\nIt is in these days that the Reich looks toward its heroes of the past. One of these is Hermann Göring. An ace of the First World War, president of the Reichstag, plenipotentiary of the Four-Year Plan, and Reichsmarschall, he led the Luftwaffe during the Second World War, where he proudly proclaimed that not a single Allied bomber would strike the Ruhr, a promise he kept. It was his bombers that pounded the British and Soviets into submission, and his planes that kept the cities of the Reich free from harm. These and many more feats have built up the legend and clout of the Reichsmarschall.\n\nIn the aftermath of the war, Göring continued to command the full might of the German Luftwaffe. This, alongside his legacy from the Second World War and the Reich's penchant for militarism, has led him to become the man he is today. He uses this influence well, as he now leads the militarist camp within the Reich's political arena, pushing for a rebirth of the Reich's militarist culture and claiming all these issues can be fixed with the power of the gun.\n\nHowever, the time may soon come for a new Führer to be chosen. Adolf Hitler has grown old and weary, and the Reich will soon need someone else to take the reins. If Göring does manage to seize the opportunity, the militarists will undoubtedly push Germany into an unending series of military conquests. Only God knows where they will stop and what will happen if they don't.§!"
 BOOKMARK_INFO_GORING: "§LDAS GROßGERMANISCHES REICH§!"
 BOOKMARK_INFO_GORING_DELAYED: "§MFUTURE CONTENT IN §GGÖRINGNOMICS§!:§!\n§Y- COMPLETE OVERHAUL OF §OGÖRING'S ECONOMY§!§!\n- REWORK OF THE §SIMPENDING ECONOMIC COLLAPSE§!\n- MORE COMPLEX §GLOOTING§! MECHANIC§!"