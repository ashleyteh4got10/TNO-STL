 TNO_Kamchatka_Krai_name_tt:0 "§Y堪察加边疆区§!\n\n堪察加边疆区位于俄罗斯远东地区的堪察加半岛上，它是全俄罗斯最大的半岛，面积约为27万平方公里。\n\n堪察加的大多数人口是占堪察加农村地区主导地位的§Y楚科奇§!人，大多数讲俄语的人主要居住在§Y彼得罗巴甫洛夫斯克-堪察加斯克§!市。\n\n堪察加边疆区最受欢迎的政党是§B俄罗斯农工党§!"
 TNO_Chukotka_Okrug_name_tt:0 "§Y楚科奇自治区§!\n\n楚科奇位于俄罗斯太平洋的北部深处，就在美国阿拉斯加州的西部，是一个§Y自治区§!，是居住在西伯利亚东北部的§Y楚科奇人§!的故乡。\n\n楚科奇是联邦中人口最少的联邦主体，首都是沿海城市§Y阿纳德尔§!。\n\n楚科奇自治区最受欢迎的政党是§E俄罗斯社会民主党§!"
 TNO_Amur_Oblast_name_tt:0 "§Y阿穆尔州§!\n\n尽管这块土地还在从罗扎耶夫斯基和俄罗斯法西斯党的统治伤痕中愈合，但阿穆尔州是远东地区人口最多的分区之一，仅次于西部的伊尔库茨克州。阿穆尔州以其广阔的森林和众多的河流，以及地表下的大量黄金矿藏而闻名。\n\n阿穆尔州是俄罗斯联邦的一个§Y州§!，俄罗斯人口占多数，在该州最大的城市和行政中心§Y布拉戈维申斯克§!居住着大量作为少数民族的满族。\n\n阿穆尔州最受欢迎的政党是§s全俄罗斯爱国党§!"
 TNO_Magadan_Oblast_name_tt:0 "§Y马加丹州§!\n\n马加丹州是远东太平洋沿岸的主要地区，在伟大的卫国战争之后，马加丹州的重要性迅速增加，因为与它同名的港口城市是鄂霍次克海的冰冷水域联通西伯利亚的大门。\n\n马加丹是联邦的一个§Y州§!。大部分人口是俄罗斯后裔，人口较多的少数民族是雅库特和楚科奇人。马加丹州的行政首都是港口城市§Y马加丹§!。\n\n马加丹州最受欢迎的党派是§s全俄罗斯爱国党§!"
