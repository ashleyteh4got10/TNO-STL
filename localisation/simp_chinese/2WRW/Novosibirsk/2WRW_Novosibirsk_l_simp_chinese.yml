 NOV_assassinate_werewolf_leadership_desc:0 "安全局在追踪地下恐怖组织的领导层并从内部摧毁他们方面最为有效。这一点已经在20世纪60年代初联邦面对民粹派的威胁时得到了证明。我们可以派最优秀的特工渗透到他们的队伍中，从内部消灭他们的领导层，破坏他们的组织，瓦解他们的抵抗意志。"
