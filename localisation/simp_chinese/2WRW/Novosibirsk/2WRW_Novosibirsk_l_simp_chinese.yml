 NOV_reunification.1.t:0 "总统的演讲"
 NOV_reunification.1.desc:0 "舒克申总统站在一大群支持者面前，他们从远在阿尔汉格尔斯克的地方聚集起来听他们的总统讲话。当他在新西伯利亚为民主而战时，他声音中的紧张早已不复存在，他已经成长为俄罗斯民主的捍卫者——希望是他们的解放者。\n\n“俄罗斯已重获统一！”总统将这句话昭告天下。\n\n随即，人群中爆发出庆祝的欢呼声。这几乎让人难以置信。一个曾经在军阀混战时代如此卑躬屈膝、四分五裂的民族，现在却对未来的日子充满了自豪和希望。很快，当总统再次发言时，人群又陷入了沉默。\n\n“但并非所有俄罗斯人都与我们同在。数以百万计的俄罗斯人民生活在外国的占领之下。他们的人权被剥夺，在自己的土地上沦为二等公民。那些不幸生活在这种条件下的人们啊，请听我说：”\n\n舒克申停顿了片刻，脸上浮现出自豪的笑容，他凝视着面前成千上万的人群，全世界的几十亿双眼睛同时也在看着他。\n\n“你们的解放即将到来！”\n\n当舒克申仰望天空，沐浴在阳光和凉爽的空气中时，人群疯狂地欢呼起来。他感觉到了，午后微风中变化的风。现在情况不同了，怀疑的世界会向他们证明这一点。"
 NOV_reunification.1.a: "为了俄罗斯人民的解放！"
 NOV_reunification.5.t:0 "猎鹰环伺"
 NOV_reunification.5.desc:0 "舒克申不耐烦地在桌子上敲打着手指，等待着波克雷什金的到来。随着俄罗斯联邦的改革并为艰难的前进做好准备，瓦西里感到国家终于准备好处理符拉迪沃斯托克的问题了。这座由俄罗斯人建造、由大日本帝国以武力夺取并居住着俄罗斯人的城市。他能做到吗？他能与一个超级大国谈判成功吗？如果他们能够夺回远东领土，他的声望将会飙升，但如果他在这次努力中失败了……这位越来越焦虑的总统用手在头发间来回抚摸，思索着脑海中的各种可能性。\n\n就在这时，波克雷什金准时走进了他的办公室。作家点头示意对方的到来，示意波克雷什金坐在空椅子上。“你知道我为什么叫你来，亚历山大。我们不能忽视符拉迪沃斯托克。”\n\n猎鹰点点头，将几份文件放在瓦西里的桌子上。“我已经与一些同事进行了交谈，我们提出了几项应对日本人的方案。”舒克申拿起其中一个文件夹并打开。“我们大部分的解决方案涉及与日本签订一项持续数年的倾向日本的经济条约。我们可以允许他们的财阀在赤塔和马加丹设立业务，用于资源；我们可以从他们那里获得投资，帮助开发远东，并夺回符拉迪沃斯托克。或者，我们可以通过当前的石油危机为他们提供支持。”\n\n猎鹰笑着指着第二个文件夹。“这个方案给了他们一个他们无法拒绝的交易。在外界看来，日本将会跪地求我们提供石油。”"
 NOV_reunification.5.a:0 "我们将夺回符拉迪沃斯托克。"
 NOV_reunification.6.t:0 "新的曙光"
 NOV_reunification.6.desc:0 "尼古拉已经很久没有微笑了。自从苏联时代以来，他除了绝望什么也感受不到。他的生活一直是持续的苦难；他失去了父亲，他的母亲和小弟弟死于饥饿，而他的姐姐在佩尔姆的工厂里为那些纳粹爱好者制造子弹而被逼死，而他自己凭借野外生存勉强活下来。西俄罗斯最终统一，有了一些好处——但他仍然在一家工厂工作，仍然艰难地生活。当[WSR.GetNameDef]被西伯利亚联邦打败时，尼古拉同样感到悲观。由企业和他们的西罗维基独裁统治，哈！只是一连串其他独裁者中的又一个而已。\n\n但舒克申总统是不同的。企业仍然很可恶，他的工资仍然微薄，但情况有所改善——他能买更多东西，薪水稍微高了些，并且他在报纸上看到有人因腐败被捕。尼古拉知道舒克申并非天使——在他看来，西罗维基仍然拥有过多的权力，但他在舒克申身上看到一个在乎他人的人，一个真正关心普通人的人——而不是虚伪的共产主义者，他们在工作中工作你到死，却大谈无产阶级革命。他是一个改进，这对尼古拉来说已经是积极的。但真正让他开始怀疑事情是否能变得更好的是，舒克申总统宣布将进行定期选举，所有人都可以投票，而不仅仅是富人。他第一次感到，作为一个名为俄罗斯的国家的居民，可能会有好事发生。他第一次能够梦想一个更美好的生活。"
 NOV_reunification.6.a:0 "梦想一个更美好的俄罗斯。"
 NOV_reunification.10.t:0 "东进序曲"
 NOV_reunification.10.desc:0 "他们肩并肩，骄傲地行进着，将脸朝向总统府，乐队响起了赞美军队和祖国的歌曲。一排排的步兵举着他们的武器向前踏步，靴子以完美的队形同步敲击着地面。一排排的卡车载着爱国的士兵立正站好，他们的身体就像他们身后的钢铁巨兽一样僵硬。最新一批俄制坦克隆隆驶过，其装甲在阳光下闪闪发光。数不清的大炮紧挨着拖着他们的人，一个骑兵师奔驰而过，将马刀举向天空。\n\n舒克申从阳台上凝视着这股由士兵组成的永不停息的浪潮，感到心底有几种情绪在牵动他的心弦。首先是自豪。他对他一手建立的新联邦感到自豪，现在它是这个被上帝抛弃的世界的希望之光。也许还带着一点自信？参与这次阅兵的部队只是联邦实际军队的一小部分，全俄罗斯军已经成为一支能够与德国和日本军队抗衡的部队。但凌驾在所有这些情绪之上的，是不确定性。对未来的不确定性。与日本的谈判会失败吗？他们能打退德国人吗？如果他们不能解放莫斯科怎么办？如果他们......？\n\n一只手被放在了舒克申的背上，让他从思绪中惊醒。他侧过头去，看到的不仅是他的内阁成员，还有波克雷什金的脸，他的眉毛挑了起来，眼里流露出关切的神情。\n\n“看下面，瓦西里！他们都在为你游行，而你却沉浸在自己的沮丧中？我们都走了这么远了，难道你害怕在这最后关头失败吗？这应该是你一生中最自豪的时刻之一，所以给我高兴点！”这位强人几乎是在对他吼叫。舒克申慢慢转过身，点了点头。“我想你是对的，只是……”\n\n波克雷什金用响亮而洪亮的声音打断了他。“你必须对我们的国家有信心。对自己有信心，我的朋友。你还记得多年前我们所许下的誓言吗？你忘记了我们离开中西伯利亚共和国的那一天所发过的誓言吗？无论前途多么坎坷，无论我们要面对多少敌人……”"
 NOV_reunification.10.a:0 "“……我们都将解放我们的人民，不惜一切代价！”"
 NOV_reunification.14.t:0 "残影"
 NOV_reunification.14.desc:0 "当约瑟夫的特遣队靠近那间狭小的小屋时，他放慢了呼吸。每小心前进一步都像打枪一样响亮。每一根脚趾都要谨慎落地，以免惊动目标。从远处看，那个破旧的小屋可能只是一座废弃的别墅，但训练有素的眼睛可以看到变形的烟囱上有新的暗灰色煤灰。\n\n他们摸到小屋的门口。约瑟夫给手下打信号。“听我命令。三、二、一，行动！”二等兵德拉古诺夫撞开那扇旧门，就像撕毁湿纸一样将其砸碎。约瑟夫持手枪紧跟着冲进小屋。“举起手来！”他大喊道。“遵照舒克申总统命令，你被捕了。”但当尘埃消散时，约瑟夫看到的只是一位坐在摇椅上的老人。\n\n曾是尼古拉·布哈林的那个人的躯壳正在欣赏一张旧照片。那双悲伤、疲惫的眼睛已经不再是曾经燃烧着意识形态烈焰的眼睛了。他破碎的步态不再是约瑟夫多年前所服侍的领导者的自豪步伐。老兵情不自禁地眨眼以甩去泪滴，只因他看到了年轻时所崇拜英雄变成现在的样子。曾几何时，他认为布哈林是谋杀犯，是把他的兄弟们送上高加索战线地狱的屠夫。现在，他只看到了一个坏掉的人，一个和所有俄罗斯人一样失去了一切的失败者。\n\n约瑟夫感到手枪从手中滑落。他的手指突然麻木，就像浸在雪中一样。他的喉咙卡住了，热泪从他的眼中流下。“尼古拉·布哈林，”他哽咽着说道，“你因为擅离职守和叛国被捕了。”他的手下站在他身边，步枪对准了苏联前总理。如果他试图逃跑，这废墟将成为他最终的安息之地。\n\n他没跑。\n\n布哈林缓缓起身，准备面对他毁灭俄罗斯的审判。他拿起那张装裱的照片，最后一次凝视着它，擦去了积攒在他昔日朋友与敌人身上的尘埃。他蹒跚走向约瑟夫，悲伤的眼神中透露出一种无奈。当约瑟夫准备好一副钢质手铐时，尼古拉·布哈林，这个注定了三代人命运的人只说了两个字。"
 NOV_reunification.14.a:0 "“抱歉。”"
 NOV_reunification.17.t:0 "终焉之刻"
 NOV_reunification.17.desc:0 "舒克申抓起最新的一批地图，把它们放在他的桌子上。他的军队什么都缺，后勤是一场噩梦，甚至没有足够的人去把编制填满。舒克申把他的拳头砸在桌子上，发出痛苦的呼声。这场灾难是无法挽救的。他曾希望带领年轻的联邦走向繁荣，但现在她却被扼杀在摇篮里，而这一切都是他的错。他将作为第三个试图阻止德国人的人被载入史册，他是第三个失败的人，第三个让他的国家再次陷入困境的人。这就是布哈林在红军崩溃时的感受吗？当他身后的游击队员摧毁了苏沃洛夫成功的任何剩余机会时，这就是叶戈罗夫的感受吗？\n\n高跟鞋在地板上疯狂敲击的声音朝他的方向传来，把他从思绪中惊醒。当他的秘书进入房间时，他无力地转过身来面对着门。“先生，德国人要求我们投降！最高统帅部已经开始考虑要全面撤退，他们要您在15分钟内出席会议！” 就这样，她迅速离开了，大概是为了让总统有时间准备。舒克申突然感到自己双腿发软，头晕目眩。\n\n当他抓着桌子想重新站起来时，一股恶心的感觉笼罩了他。终于站起来了，他用一只手抓住桌子，同时试图用另一只手稳住自己。他感到冷汗珠从他的脖子上流下来，他平日里胸口的轻微不适在此时化为了一根刺入他胸膛的冰锥。他感到胸闷气短，就像一头大象压在他的胸口。他让眼里涌出的泪水顺着脸颊肆意流淌，他紧紧抓住自己的胸口，试图找到缓解疼痛的方法。尽管他看到了凶兆，但他不会放弃。还有一个国家等着他领导，他不能放弃……\n\n然而，舒克申只能眼睁睁地看着他周围的一切似乎都慢了下来。他呆呆地站在那里，无法动弹，因为他的双腿再次失去了力量。他先是两膝跪地，然后又倒在了地板上。他聚集了他剩下的力量，抬头看着被他带入毁灭的国家的旗帜，在最后一次闭上眼睛之前，他发出了最后一声痛苦的呼喊。"
 NOV_reunification.17.a:0 "俄罗斯注定失败吗？"
 NOV_reunification.18.t:0 "总理与总统"
 NOV_reunification.18.desc:0 "当通往舒克申办公室的唯一门打开时，他的保镖护送尼古拉·布哈林坐到他旁边的座位上。这人变了。这位列宁继承人曾充满希望的脸庞——昵称“金童”，一个在苏联各地海报上示范性的形象，如今变得忧郁而破败，满是皱纹和羞愧。\n\n当前总理与他的目光交汇时，舒克申叹了口气。老人只敢看他一秒，就又低头看着自己肮脏的鞋底。他真的那么害怕吗？\n\n“我不会反对你枪毙我，”老人低声说道。\n\n总统停顿了一下，感到惊讶。“我把你带到这里来并不是要杀你，”舒克申说道，“真说起来，我认为独自在废墟中生活已经是足够的惩罚。但联邦委员会一旦发现你还活着，我别无选择，只能遵守他们的逮捕令。”\n\n他起身看向办公室窗外。今天真好。阳光明媚，微风拂过翡翠般的叶子；孩子们正在街上踢足球，他们刚下课、或者是翘课的。这不是定人罪的日子。\n\n“联邦将成为一个法治国家，”舒克申说道。“我不能凭自己的意愿让你自由。总统必须始终受制于俄罗斯法律，而不像布尔什维克们曾经那样凌驾其上那样。你将在法庭受审。”\n\n布哈林点了点头。“我明白。”\n\n但即使如此，舒克申知道这位前总理永远也不会得到公正。俄罗斯人民知道他有罪、即使事实并非如此。他们将会审判他，而这位已经惩罚自己的老人将在监牢中度过余下短暂且不健康的生命。难道那就是他的遗产？把布哈林交给群众法庭？让他的人民满足复仇的欲望？还是会给予一个暴君、无政府的始作俑者、和舒克申毫无差别、把罪人们投入古拉格的怪物，一个特殊地位？\n\n他会为了怜悯而违反自己创立的法律吗？"
 NOV_reunification.18.a:0 "法律面前人人平等。"
 NOV_reunification.18.a_tt:0 "这将让§G民众§!满意！"
 NOV_reunification.18.b:0 "暴民正义不是正义。我们可以另辟蹊径。"
 NOV_reunification.18.b_tt:0 "§R人民不会因为布哈林被轻判而感到高兴……§!"
 NOV_reunification.24.t:0 "会议"
 NOV_reunification.24.desc:0 "一个清晨，新西伯利亚空气宜人。鸟儿在叽叽喳喳地唱着歌，天气也美极了。舒克申甚至他的高级将领们又在一间阴沉的会议室里开着另一场战争规划会议。虽然舒克申对这些会议并不厌倦——如果这些会议能帮助解放俄罗斯，他愿意再开上千场，但他开始对他的员工感到...沮丧。\n\n“各位先生，不好意思，我可能越界了，但我已经听到了同样的争论两次了。你们都收到了明确的指示——清晰明确的指示——要为我们这场战争的总体战略提供论证。请给出你们的战略的清晰简明解释，并诚实地谈谈它的潜在弊端。这是我们国家近期历史上最重要的战争——我们在这里的失败可能会注定俄罗斯的命运，所以请保持谦虚和谦卑，如果可以的话。”\n\n亚历山大·波克雷什金，西伯利亚的猎鹰，首先站了起来，一个投影仪在屏幕上显示出塑料纸张。“正如你们所见，德军阵线的弱点将在时间推移中得到加强。如果我们能趁着他们的政治动荡，出其不意地发动进攻，我们就能抢占先机，迅速取得轻松的胜利。我们将利用联合作战，充分发挥空军的优势，与德国空军相抗衡，甚至有可能战胜他们。”\n\n亚历山大·诺维科夫谨慎地站了起来，因为他比波克雷什金年长。“总统先生，我毫不客气地说，我无法支持这种战略。这与革命前线的愚蠢思维相同，认为胜利将是必然的。历史告诉我们，德国人是顽强的，他们愿意发起精心策划的法西斯游击行动来与我们作战。我们不应该傲慢到相信我们能一举消灭一个世界强国。相反，我提议采取一种谨慎的策略，慢慢前进，并设置足够多的后备线，以防他们的装甲部队冲过我们的部队。\"\n\n一番争论之后，幸运的是，舒克申举起手来结束了争吵。\n\n\"让我们把两者结合起来，\"他说道。\"先进行一次有力的推进，并得到游击队的支持，然后进行巩固。为了胜利！\""
 NOV_reunification.24.a:0 "策略和计划是胜利的关键。"
 NOV_reunification.25.t:0 "寄往德国的一封信"
 NOV_reunification.25.desc:0 "至大日耳曼国和全世界，\n\n你们这个所谓“伟大”的国家，是建立在那么多无辜者的鲜血和数以百万计人民的奴役上的，真是对人类文明的耻辱。世界长久以来容忍着你们残忍的存在，已经太久了。你们的国家，所谓的光明灯塔，为一个不存在的优等种族而建，实际上不过是一个肮脏的国际象棋棋盘。它只是奴隶主、屠夫和操纵者巩固权力的又一个战场，而普通德国人每天都在辛劳努力。一个被创建出来为“优等种族”提供乌托邦的国家，怎么连基本的经济需求都无法满足呢？简直就是个笑话。\n\n俄罗斯人民没有忘记过去三十年里我们所遭受的许多不公正待遇。你们野蛮地侵略俄罗斯，造成了大量的死亡、种族灭绝和痛苦。它没有实现你们的任何目标，只带来了恶意。我们现在准备报复这些不公正待遇。不久，你们将面临期待已久的后果，为你们所创造的丑恶行为负责。东欧受折磨者们呼唤正义，正义将会到来。愿自由世界摆脱自满的枷锁，与我们一起投身于自由的十字军征程。\n\n不爱你们的俄罗斯联邦总统，\n瓦西里·舒克申"
 NOV_reunification.25.a:0 "强硬的措辞"
 NOV_reunification.26.t:0 "一封信"
 NOV_reunification.26.desc:0 "波格丹·别利亚耶夫穿过被大雪笼罩的树林，行进在回他家的路上。他父亲的温彻斯特枪挂在他饱受摧残的肩膀上，一对松鼠的尸体在他疲惫的手中晃动着。如果爸爸能看到他现在的样子就好了。他一定会为他唯一的儿子感到骄傲，也一定会喜欢妈妈今晚做的炖菜的。啊，多美好的时代啊。波格丹的脸颊上扯出一个微笑。七年以来，每一天他都生活在挣扎之中。但当波格丹想到爸爸时，他知道他的父亲会以他为荣，他将为他的儿子成长为这样的人而感到高兴。\n\n当波格丹发现自己站在母亲小屋的门前时，他把靴子上的雪剁碎，把爸爸的步枪放在了门口。但当他走进令人陶醉的厨房，急于向母亲展示他抓到的松鼠时，他听到了哭泣声。他的母亲站在那里，痛苦地蜷缩着身子，泪水顺着脸颊涌入水槽的铜盆中。\n\n“妈妈，怎么了？”波格丹问道。\n\n她什么也没说。相反，叶卡捷琳娜·别利亚耶娃猛烈地摇了摇头，递给她儿子一个沾满泪水的信封。它的正面用简单的字体写着联邦国防部。波格丹用颤抖的手打开了信。\n\n亲爱的俄罗斯联邦公民，信中写道，我在此特此命令你加入全俄罗斯军。你必须在此信寄出两周内到坎斯克入伍中心报到。\n\n等等，什么？\n\n“这是什么时候寄过来的？”波格丹问道。\n\n“十天以前。即使格奥尔基愿意把他的车借给我们一用，也得两天时间才能开到坎斯克。”妈妈啜泣着说。\n\n“那在出发之前，我还有多长时间？”\n\n“不！”叶卡捷琳娜喊道。“你不能去坎斯克！你知道舒克申总统想要什么--他要对德国发动另一场战争。他们会杀了你，会把你送到集中营，让你挨饿！” 她倒在地板上，哭了起来。“你不能这么离我而去，我的宝贝儿子…”\n\n波格丹在他最后幸存的家人身边跪了下来。"
 NOV_reunification.26.a:0 "对联邦的责任召唤着波格丹。"
 NOV_reunification.27.t:0 "父与女"
 NOV_reunification.27.desc:0 "布哈林静静坐在牢房里，低头看着混凝土地面，老人开始回想过去几个星期的事情。当俄罗斯全俄军队的士兵将他拘留时，他独自一人在小屋里。然后，他见到了俄罗斯联邦总统瓦西里·舒克申。俄罗斯...再次统一。布哈林不知道舒克申是否能够领导俄罗斯走向健康，但或许任何事情都比他的领导力要好。\n\n牢房的门传来敲击声。布哈林抬头看到舒克申总统站在那里。布哈林站起来表示尊敬，“总统先生？”\n\n舒克申四下看了看，似乎在寻找某人，然后开口说道。“尼古拉·布哈林，你被宣布离开这个牢房，”布哈林的眼睛亮了起来——他们要处决他了，“受到医疗监督的软禁，因为你年事已高。”舒克申解释道。布哈林停顿了一会儿，恐慌变成了震惊。“...你只是让我走？就这样？”舒克申点了点头。“布哈林，你不值得自由。在你逃离你的人民之后，你所做的事情，但我不认为一个老人应该死在牢房里。你应该和你的家人在一起，至少。”\n\n说着，他退后一步，露出了斯韦特兰娜·布哈里娜，她脸上带着温柔的微笑走了进来。“我的斯韦特兰娜！”布哈林喊道，眼泪开始在他眼中涌动。布哈里娜点了点头，泪水流过她的脸颊，然后奔向父亲，跳进他的怀抱。“当你离开我时，我非常担心。”布哈林咕哝道，他紧紧抱着自己唯一的幸存家人。“现在我在这里了，父亲。只要休息，一切都会好起来的。”布哈里娜说道。尼古拉瞥了一眼微笑的舒克申，眼中带着钦佩的神色向他点了点头，紧紧地搂住女儿。感受到这份优雅的目光，这份对那份他们都明白布哈林并不应得的怜悯的感激之情，舒克申将这对父女交给了他们的安慰，并走进了那些充满对这两个灵魂的仇恨的人群中。\n\n这是正确的决定，尽管人们对此感到沮丧。一个公正的联邦也必须是一个富有怜悯心的联邦，不是对尼古拉·布哈林，而是对一个破碎的老人和他的女儿。"
 NOV_reunification.27.a:0 "尽管人的一时残忍。"
 NOV_reunification.32.t:0 "归家"
 NOV_reunification.32.desc:0 "自从成为联邦总统以来，瓦西里要么被困在新西伯利亚，要么在从马加丹到下诺夫哥罗德的全国范围内旅行，这意味着他无法像他想的那样经常去巴尔瑙尔。他离开自己的家乡城市的时间使他对返回巴尔瑙尔的感觉更加美好。当他的车子驶过巴尔瑙尔朴素的街道时，他的心中充满了怀旧之情，这让他想起了自己担任巴尔瑙尔市市长的时光。小企业、慢悠悠地散步的人们，按照自己的步调。与诺沃西比尔斯克这个工业城市不同，巴尔瑙尔是阿尔泰附近的一个朴素的城市，是曾经小小的联邦的农业中心。曾经，这个小镇是他对统治地位的西罗维基的竞选活动的基地，而现在，他站在这里，得意洋洋地回来了。他已经成为了总统。\n\n尽管他离开这座城市的时间很长，但他受到巴尔瑙尔市民的接待绝对没有改变，成千上万的人站在路边迎接他们心爱的总统。顺着他的安全车队，舒克申向他们挥手致意，他坐在总统座驾上，脸上带着微笑。俄罗斯的许多人都对他寄予了信任，希望他能为他们做出正确的选择。在维护传统和稳健的同时，履行他对所有俄罗斯人自由和民主的承诺。\n\n他的目标是实现这一承诺。\n\n很快，瓦西里发现自己被带离了思绪，站在一个舞台上；之前的人群已经准备好听他讲话了。舒克申微笑着清了清嗓子，看着多年前支持他的人们。"
 NOV_reunification.32.a:0 "“你们好，巴尔瑙尔的人民！回家的感觉真好！”"
 NOV_reunification.33.t:0 "触手可及的梦想"
 NOV_reunification.33.desc:0 "多年来，鲍里斯一直在工厂里辛勤工作，作为凤凰公司里制造炸弹的一个齿轮。他讨厌这份工作，它抽取他的灵魂，伤害他的骨头和关节，背离了他的价值观。谢天谢地，他不再被困在那里了。是的，鲍里斯正在注视着他的新店铺——坎斯克理发店，一个位于城镇中心的小小店铺，配有一根红白相间的柱子。\n\n终于，他成为了一个企业主。一个自力更生的人！曾几何时，鲍里斯认为这是不可能的。多年来，大公司和军阀控制着几乎一切。每个工厂和商店要么属于西罗维基，要么归无政府主义者共同管理。\n\n通过精心储蓄和由舒克申总统签署的中小企业补助法案，他终于能够租下这栋建筑并购买必要的设备。像他这样的人终于可以实现自己的价值。他不再被迫在工厂里长时间工作以度日，只为自己辛勤劳动得到一些微薄的报酬。现在，他可以过上自己的生活，实现自己的梦想，过上体面的生活——前提是他付出努力并具备相关技能。\n\n总有一天，这栋建筑将成为一个繁荣的理发店。一个充满活力的社区聚集地：人们可以互相交流故事，感到舒适！他终于能够实现成为理发师的梦想。他在旧工作中的一些朋友经常取笑他的抱负，但现在看看他吧。他必须比在凤凰公司时更加努力地工作，让这一切变得成功。失败将意味着回到工厂，但他绝不会让那种事发生。\n\n但不同之处在于，他有了机会，而有时候，机会就是所需要的。"
 NOV_reunification.33.a:0 "曾经如此遥远的梦想，终于可以实现了。"
 NOV_reunification.34.t:0 "朋友之间的小酌"
 NOV_reunification.34.desc:0 "瓦西里微笑着凝视着联邦新宪法的最终稿件。经过数周的争论、妥协和幕后交易，他取得了胜利。他的愿景现在已成为法律。\n\n门外传来敲门声。“我可以进来吗？”亚历山大·波克雷什金说着。他一手拿着两个玻璃杯，另一只手拿着一瓶上好的伏特加。\n\n舒克申皱起了眉头。“你来找我有什么事？我以为你会在策划下一轮的新闻文章，抨击政府。”\n\n“今晚不是。再和我们媒体部的那帮白痴争吵一秒，我的脑袋就要爆炸了。”波克雷什金把玻璃杯放在瓦西里的桌子上，然后给两杯酒倒了一大杯。“不，今晚是关于你的。你改变了俄罗斯的历史进程。”\n\n瓦西里拿起杯子，杯沿上有裂纹，可能是掉落或者粗心处理导致的。“我本以为你反对新宪法。”\n\n亚历山大笑了起来，他的胸膛随之摇晃，脸上露出了微笑。“我从未说过你把宪法改得更好了！”这位老飞行员坐在舒克申桌子的角落，拿起他的杯子。他低头看着酒，用娴熟的手指在杯沿上转动。“不，今晚是关于你的胜利。俄罗斯需要强大的人，而不是完美的领导者。而且……”波克雷什金停顿了一会，“我关心的是俄罗斯。不仅仅是我们的党派争吵。你赢得了这个宪法，现在是时候确保它发挥作用了。”\n\n“明天，瓦西里，我将继续反对宪法的过度，我将试图通过修正案，我将反对你与该死的社会主义者和和平主义自由派合作的其他尝试，并让全国知道我们对这些想法持不同意见。但是，瓦西里，我们这样做是因为我们关心这个国家，而不是因为我讨厌它或者想要致富。所以，为了俄罗斯，为了我们美丽的祖国。”\n\n舒克申微笑着，与亚历山大的目光对视。"
 NOV_reunification.34.a:0 "“我会为此干杯的，我的朋友。”"
 NOV_reunification.36.t:0 "政治环境发生了变化……"
 NOV_reunification.36.desc:0 "亚历山大·别洛夫，凤凰步兵装备公司的首席执行官，怒火中烧。\n\n\"我们建立了这个该死的联邦，正是我们的资金和商业头脑使他们重新统一俄罗斯，他们是怎么对待我们的？！按比例代表，公众选举运作，他们疯了吗？！接下来你会告诉我他们禁止企业实体捐款给竞选活动了！\"他咆哮道。他备受煎熬的助手举手示意：“呃，先生... 他们确实这样做了。”\n\n别洛夫沮丧地呻吟着，一口气喝下一杯苏格兰波旁威士忌，几乎坐倒在他的镶皮椅上。\n\n\"该死。这让事情变得更困难了，\"他开始说。他把头放在双手之间，喃喃自语道：\"公司会杀了我的……到底是谁没跟舒克申谈谈平息他的情绪...\" 但在考虑了一段时间后，他咧嘴一笑，\"困难，但不是不可能。乔治！给我打字。\"他的助手忠实地赶到打字机旁开始打字。\n\n事实是，这些限制确实限制了企业的影响力，但肯定没有终结。\"我们掌握着媒体的话语权，作为个人我们还能捐款，对吧，乔治？\"在打字机发出叮铃声后，乔治点了点头，随后听到打字机移动部件的声音，将打字机调至下一行。“还有其他事吗，先生？我想明天就可以发送这份备忘录了。”\n\n\"嗯...你可以回家了，孩子。也许我还会在纸上写几个点子。这些混蛋们以为他们可以阻止我们将俄罗斯引导进繁荣，但我们即使要硬生生地把他们拽进现代时代，也绝不会放过他们。该死的赤匪和他们自由派的蠢货。”\n\n乔治走出办公室，让这位高管独自度过了他的晚上。噢，是的，俄罗斯农工党或许给企业造成了打击，但他们并没有赢得这场战争。只要赢得一次良好的选举，也许让那个老家伙普里马科夫上台，他们就会重新夺回俄罗斯，而且永远不会放弃。就让他们动摇吧。"
 NOV_reunification.36.a:0 "权力不是那么容易受到阻碍的。"
 NOV_reunification.37.t:0 "我们有出色的领导班子"
 NOV_reunification.37.desc:0 "瓦迪姆坐在工厂车间摆放的一排长长的灰色折叠椅上。“纳塔莎，这次开会到底是关于什么的？”\n\n“我不确定。听说有些关于工厂的变动的传闻，但没人确定。”纳塔莎的目光一直盯着讲台，他们的老板正在准备讲话。“我觉得不会是好事。”\n\n他们的老板瓦迪姆·阿加波夫手里拿着一份文件走上了讲台。“大家下午好。董事会要我介绍一些关于我们工作场所管理的事项。”\n\n纳塔莎用手肘轻推了瓦迪姆一下。“我们的工作场所？”瓦迪姆只是耸了耸肩。\n\n“首先，我们宣布全面提高工资！”阿加波夫说道。瓦迪姆的同事们欢呼起来，有些甚至扔掉帽子高呼。“另外，我们将很快引入新的安全主管。但在继续之前，我想讨论一下一些流言。”阿加波夫清了清嗓子。“管理层得知所谓的民主社会主义者成员进入了本机构范围内分发传单。我们想提醒大家，任何这样的干扰都构成了擅自进入。请向我们的安保团队报告，以便我们维持我们的五星级安全记录。”\n\n瓦迪姆右边的邻居伊凡用肘部轻推了他一下，并递给他一本小册子，没有说话。封面上用蓝色粗体字写着“工会：骗局还是计划？”\n\n“民主社会党分发的传单充斥着彻头彻尾的谎言。如果你愿意，可以阅读一下。我知道我需要一些上厕所时可以享受的东西。”阿加波夫笑着说道。“但请自己进行调查。西比尔创造了这些小册子，以便让你了解自己的权利和加入工会的成本。我们任何人都不希望工资被工会会费扣除。”"
 NOV_reunification.37.a:0 "“我们这里是一家人，不需要外人干涉……”"
 NOV_reunification.38.t:0 "路障"
 NOV_reunification.38.desc:0 "“你们在卡通河开发的请求被撤销了，”埃夫多基莫夫州长递给西比尔肥料公司首席执行官的秘书叶卡捷琳娜时说道。\n\n“你说撤销？几个月前我们已经获得了开发土地的批准，一切都已经准备就绪，人员已经招聘，合同已经签署。”\n\n“西比尔在波克雷什金掌管期间获得了开发批准。舒克申总统推出了一项新的环保倡议，其中一部分涉及阻止直接靠近主要河流系统的工业项目的开发。其中就包括了斯洛斯特基河。真的很抱歉，叶卡捷琳娜——我知道你的老板会大发雷霆，但我不能违反法律，冒着被政治追捕的风险。”埃夫多基莫夫整理了一下袖口扣子。“而且，坦率地说，我们都受够了水污染。在自己家里连杯水都喝不了，总得摄入西比尔的废水。”\n\n叶卡捷琳娜沮丧地叹了口气，把文件放在州长的办公桌上。“我们不能达成交易，做个妥协吗？伊尔特什河呢？我理解舒克申总统想保持自己的家乡州干净，但我们需要在这里做生意。”\n\n“法律是明确的，我的手被束缚住了。”\n\n叶卡捷琳娜清了清嗓子。她把公文包放在州长的办公桌上，打开了它。里面是堆积如山的干净、整洁的钞票，等待有力的手来抚摸。“有什么办法能改变你的想法吗？”\n\n埃夫多基莫夫州长注视着钱很长时间，仔细考虑着这位秘书。“也许——我说也许。”他打断了叶卡捷琳娜的话，已经准备好就交易握手。\n\n“听着，我可以试着搞点什么让伊尔特什河不被认为是主要河流，但如果西比尔不能控制废水，那是行不通的。请告诉你们老板，如果他们提交申请的话，我会尽力让事情办成，但实际上他们需要保持数字的准确性，并且保持在较低水平，”州长解释道。叶卡捷琳娜做了几个笔记，然后将公文包推了过去。\n\n“那么我们达成协议。我会处理我的老板，别担心。如果我们需要对应申请进行编辑，请给我打电话。”"
 NOV_reunification.38.a:0 "企业找到了方法。"
 NOV_reunification.39.t:0 "森林中的战友"
 NOV_reunification.39.desc:0 "迪米特里慢慢靠近一个偏僻的小屋，它坐落在比罗比詹深处的森林里，就在同名城市的北边。经过一番调查和......深入询问后，他得知前抵抗组织领导者现在过着平静的生活。\n\n“停！不要再往前走！”一把陈旧的声音从树林中传来。\n\n迪米特里四处搜索着森林，直到他的目光落在一个老人身上，老人坐在一根坚实的树枝上，手中握着一支步枪。\n\n“你就是那个到处骚扰人、想找到我的人？”老人问道。\n\n“没错。我叫迪米特里·伊万诺夫。俄罗斯联邦安全局，代表瓦西里·舒克申总统前来。我来见你，彼得。”迪米特里回答道，举起双手以示他无恶意。\n\n彼得眼睛狐疑地盯着迪米特里，放下了手中的步枪。\n\n“联邦安全局，嗯？我听说过你们这些家伙。你们为什么要打扰像我这样的老人？”彼得一边问，一边迪米特里慢慢走近他。\n\n“舒克申总统希望你能号召你的老战友们。动员人民，给这些日本鬼子制造麻烦。总统的目标是夺回比罗比詹，他相信重新组建抵抗组织会让日本人更愿意与联邦进行谈判。”迪米特里解释道，最后放下了双手。\n\n“舒克申总统？他最近对莫斯科如此执念，没想到这家伙还关心我们在满洲的事情，”彼得自言自语地想着。\n\n他背过身去，静静地思考了一会儿。在俄罗斯分崩离析时，他的抵抗军和其他俄罗斯游击队成员不得不自力更生，直到关东军最终在哈巴罗夫斯克将他们击败。现在，他祖国的总统要他再次加入战斗。但事情并不那么容易。经过这么长时间，人们变得自满，抵抗组织也变得微不足道而失败。彼得在将阿穆尔盆地从日本人统治下解放出来的不可能完成的任务中失去了他的许多兄弟姐妹，这毫无意义。但那是因为没有强大的俄罗斯来支持他们。或许，这一次，终于有成功的机会了。也许他有机会完成他的使命：解放他的俄罗斯同胞。彼得转身面对迪米特里，叹了口气。"
 NOV_reunification.39.a:0 "“我们可能会为此而死，但我们会做到的。”"
 NOV_reunification.40.t:0 "行动开始"
 NOV_reunification.40.desc:0 "致\"鹰\"特工\n\n正如你所知，俄罗斯联邦与日本帝国之间的谈判即将开始。在这关键时刻，日本在做出决策时会考虑许多变数。作为俄罗斯的本土人，我们期望你们履行职责，激发我们在该地区的人民精神，使日本人在满洲地区重新考虑他们的立场。如果此信被截获，你们需要在没有具体指示的情况下在解读这一命令时保持创造性。\n\n注意\n\n尽管这个动荡时期可能会激发你们的队伍中出现大胆的态度和行为，但必须强调攻击平民的行为，即使是日本人，对俄罗斯人民会产生负面影响。我们正处在微妙的时刻，请不要犯下会导致外交人员提出不值得和不真实的指责的错误。\n\n你们的恩人。"
 NOV_reunification.40.a:0 "唤醒他们的精神。"
 NOV_reunification.41.t:0 "飞行员的飞行之旅"
 NOV_reunification.41.desc:0 "波克雷什金悠闲地走向光滑的飞行器，阳光照在它抛过光的金属翅膀上，脸上露出得意的笑容。“瓦西里，你怎么看？她真漂亮啊，不是吗？”飞行员问道。“这肯定不是巨型企业制造的！”总统开玩笑地说，他紧紧地跟在这位经验丰富的飞行员后面。联邦最近制造了一批新的战斗机，波克雷什金将是第一批试用它们的人之一。\n\n亚历山大在联邦最新一代喷气式战斗机翱翔天空时咧着嘴笑。米格-23，这架飞机有足够的速度和火力在空中对抗德国空军。\n\n“天气如何？”舒克申通过波克雷什金的耳机问道。\n\n“万里无云，瓦西里。啊，我离开天空太久了！”亚历山大一边俯冲一边喊道，他在向后拉之前做了几次桶滚。\n\n“你觉得怎么样，老朋友？它的速度能快到让我们占领整片天空吗？”\n\n“瓦西里，有了这样的飞机，只要我们想，我们就可以占领世界！”波克雷什金回答说，他望着云层下面广阔的平原和家乡的无数河流。\n\n完成这个小动作后，他打算让瓦西里笑得像个白痴。 波克雷什金将引擎推得更远、更快，直到它发出震天动地的巨响。"
 NOV_reunification.41.a:0 "音爆轰隆！"
 NOV_reunification.42.t:0 "参军热潮"
 NOV_reunification.42.desc:0 "弗拉季米尔看着新兵们肩并肩站着，他默默地打量着他们。他并不期待这批新兵能多出色，但考虑到全俄罗斯军放宽了征召标准，这也可以理解。\n\n弗拉季米尔明白为什么要这样做。舒克申总统已下令让联邦进入战备状态，他的目光聚焦于旧首都莫斯科，如果联邦想要击退东欧的纳粹国防军，她需要召集尽可能多的军队。但这并不意味着他必须在接下来的几年里喜欢上训练下一代俄罗斯士兵的工作。\n\n“我叫弗拉季米尔·奥尔洛夫。你可以叫我萨金特·奥尔洛夫或者就叫我萨金特。在训练中，你们将学习如何使用各种武器开火，如何在地面上作为一个战斗单位一起行动，以及如何在战场上生存。无论如何，你们不仅要服从我的命令，还要服从你在军队里所有上级的命令。我讲明白了吗？”\n\n“是的，中士！”新兵们异口同声地回答。\n\n弗拉基米尔点点头，然后转向一张长桌，桌上摆满了标准的AV-50步枪。\n\n“现在，我命令你们每个人从桌子上拿一支步枪到靶场去，我想看看你们的准头咋样。别因为抢枪而打起来，人人都有份，每一把枪都是完全一样的。”弗拉季米尔命令道，新兵们遵守命令，拿起步枪，按照指示向靶场前进。\n\n弗拉季米尔看着他们摆弄了一会儿步枪，然后暗暗叹了口气。"
 NOV_reunification.42.a:0 "该死的绿党。"
 NOV_reunification.43.t:0 "托木斯克国立大学"
 NOV_reunification.43.desc:0 "托木斯克国立大学！\n\n你曾经想过用破碎的烧瓶进行滴定吗？托木斯克国立大学！\n\n再来试试对蛙进行三次解剖的生物实验？托木斯克国立大学！\n\n虽然娜塔丽娅很想继续取笑她的学校，但与她第一年相比，她的第二年进展要好得多，如果这次解剖是个暗示的话。\n\n“好了，同学们。现在我们开始这个实验的第二部分。我知道大家都对这些新的显微镜感到兴奋，”一位年长的生物学教授从教室前方的位置说道，一个塑料透明幕布投影机显示着一张棕色和黑色显微镜细胞观察指导的说明。 “但请不要弄坏这些崭新的设备。天知道它们对我们来说太新了，我们还没开始就破坏了 - 我不认为政府会那么慷慨。好了。现在，我们可以看到，鄂毕河的水相当污染。你们能看到这里的颗粒吗？细菌是正常的 - 尽管相当有趣。是的，阿列克谢？”他指着举手的男生问道。\n\n“老师，我找到了一种像盘片一样的东西。”\n\n“来吧，阿列克谢，你应该经常阅读课本。这是一种美妙的原生生物，被称为藻盘藻，一种底栖硅藻。它们相当美丽，不是吗？有人愿意给班上讲讲关于藻盘藻的知识，下次考试可以加分。”\n\n娜塔丽娅立刻举手，“它们有硅化的细胞壁？”\n\n“嗯，娜塔丽娅，我还没点到你，但是是的，它们确实有硅化的细胞壁。现在，让我在这里找找看 - 这些漂亮的幕布真好玩…”\n\n是的，课程变得更加有趣 - 也更有用。没有设备，娜塔丽娅不确定她的生物学学位是否有任何价值。没有亲身实践的教育算是什么样的教育？而要进行亲身实践，你需要什么？崭新的设备。"
 NOV_reunification.43.a:0 "进展迅速！"
 NOV_reunification.44.t:0 "账单"
 NOV_reunification.44.desc:0 "过去几年对马格纳来说都是一场斗争。四年前，他的妻子在一起工业事故中去世。坦率地说，似乎没有人在乎。几乎没有人参加她的葬礼——只有教区神父、他的女儿以及她们的核心家庭。他曾起诉凤凰步兵公司，但法官指责他提起了一起“荒谬的诉讼”。这是他的话。他不得不独自抚养两个小女孩，每天晚上都听着她们在梦中哭泣妈妈。现在，他手里拿着一封来自赤塔税务局的信。\n\n事实上，他支付账单很吃力。马格纳的工作根本无法支付他必须支付的一切。大女儿的教育、汽车、食物、保险、水费和燃气费……事实上，他已经开始不吃饭，只为了保持灯亮着。\n\n“爸爸？你还好吗？”\n\n马格纳回头看着，小雅娜站在那里，脸上带着担忧的表情。他知道她是在寻找他手中的威士忌瓶。“我没事，小老鼠。你为什么不回去外面和伊丽莎白一起玩呢？”马格纳勉强笑了笑，指向那扇破旧的纱门。\n\n她走出门去了。他屏住呼吸，把注意力重新集中到那封信上。实际上，那是一份执行令，而不是账单。他颤抖的双手打开了它，使劲儿地控制住自己，展开了那张乳白色的纸。它闻起来有墨水和眼泪的味道。\n\n“亲爱的莱贝杰夫先生，”他读道，“鉴于您的财务困境，财政部决定您有权获得以下所述的退税。”\n\n等等，什么？\n\n马格纳震惊地把信掉在地上。他望着窗外，看着女儿们在树叶中嬉戏片刻。然后，他穿上外套，打开后院的门。"
 NOV_reunification.44.a:0 "“姑娘们，收拾东西，我们出去吃饭！”"
 NOV_reunification.45.t:0 "崭新的萨马拉"
 NOV_reunification.45.desc:0 "尼基塔一生都生活在萨马拉。这座城市曾经有过许多名称，被沙皇、苏维埃和合作者们统治过。在伟大的卫国战争之前，萨马拉是伏尔加河流域的经济中心，拥有数百家冒着烟的工厂。然而，德国空军结束了那些日子。即使在西方统一之后，这座城市也从未恢复往日的辉煌。萨马拉的黄金时代似乎已经结束了。\n\n但是当联邦接管这座城市时，一切都发生了变化。各大企业进驻了这座城市，西比尔集团、泰坦公司、凤凰等等。尼基塔在一家重新开业的工厂找到了一份更好的工作，用多余的钱送孩子上了一所好学校。来自马加丹的企业家们跋涉到他的家乡，开设新的企业，翻修无法居住的公寓。新的就业机会和更好的住房使无家可归的人口减少了一半。\n\n城市各地进行了地方选举。尼基塔没有去投票；他仍然记得军阀混战时代，将你的名字写错在选票上是一个危险的错误。但是他的邻居们投票反对全俄爱国党，第二天他们还在那里。然后是下周，接着是下个月。尼基塔停止了数日子，意识到舒克申总统是真诚的。\n\n六个月后，萨马拉被邀请选举一名杜马议员。尼基塔多年来第一次满怀笑容地投下了他的选票。在之后的日子里，他密切关注选票计数，当他支持的候选人获胜时，他欢呼雀跃。他在午休时间去公园读报纸，一边咀嚼着三明治，一边了解联邦政府的情况。不同的政党，主要的政治人物。亚历山大·波克雷什金，飞行王牌，和瓦西里·舒克申，农民出身的总统。一个月里，他们为在喀山的工业项目争吵不休。下一个月，他们一起赞助一项退伍军人援助法案。新西伯利亚政治的复杂性几乎是不可能理解的。但尼基塔看到了真正的辩论，真正的分歧，并且知道这是一个他可以引以为豪的政府。"
 NOV_reunification.45.a:0 "微风拂过他的脸庞，他笑了。"
 NOV_reunification.46.t:0 "工业士兵"
 NOV_reunification.46.desc:0 "作为叶卡捷琳堡本地人，瓦迪姆早已习惯了从康斯坦丁·罗科索夫斯基统治时期开始定义这座城市的军国主义文化。当联邦接管这座城市时，新西伯利亚以商业为中心的文化突然引起了他巨大的冲击。企业家和经理的急剧涌入几乎在一夜之间改变了叶卡捷琳堡。不久之后，地方选举举行，鲍里斯·叶利钦当选州长。他们经历了无数的变革，但最近几周，变革又一次出现在地平线上。\n\n自从舒克申总统的讲话以来，整个联邦似乎都在向莫斯科进军，坚定地踏上了征途。\n\n“瓦迪姆，你在想什么？”他的班组长阿尔捷姆问道。他们站在生产线上，被机器的咔嗒声包围着。\n\n瓦迪姆叹了口气，盯着长长的螺旋线装满的装配线。“这座城市感觉就像40年代一样。当时有紧张气氛，那个……”瓦迪姆说到一半，脑海中闪现出坦克和尖叫声。“舒克申为什么再次挑衅德国？他是在试图谴责俄罗斯吗？我们已经两次输给了德国人，这一次为什么会不同？”他揉着眼睛说道。\n\n阿尔捷姆把手放在他的肩膀上，面上带着一丝严肃。\n\n“我不知道，瓦迪姆。但我们的工作不是去质疑为什么。我们不是民粹主义者的叛徒，我们的国家选择了这个人。现在，我们再次为俄罗斯而战。”他紧紧抓住瓦迪姆的肩膀，“阿尔捷姆，你有两个选择。你可以在这个工厂工作，为俄罗斯做好你的工作，或者你可以背叛她，再次将她推向毁灭。回去继续工作吧。”他走开了，留下阿尔捷姆一个人沉思，而生产线不断向前推进。"
 NOV_reunification.46.a:0 "未来摇摆不定。"
 NOV_reunification.48.t:0 "撤退命令"
 NOV_reunification.48.desc:0 "“我告诉你，专员辖区撑不了多久了，我们需要——”一名德国行政人员在会议室讨论时，一名国防军军官费力地打开了门。\n\n“根据元首的命令，这座大楼内的所有官员都将被转移到德国本土。这座大楼需要立即疏散。安全漏洞和游击队活动使这个地方太危险了，”这位年轻军官要求道。与会者纷纷起身，向门口走去，眼中满是恐惧。 “他妈的快点，齐格弗里德，你这个胖子，在我把你留在这里让某个斯拉夫杂种把你的脑袋打烂之前！”国防军军官下令，用拳头敲打着墙壁。 “对……抱歉。”齐格弗里德站了起来，但在他站起来之前，一颗子弹划破了空气。\n\n这名军官倒在地板上的血泊中，一个弹孔直接穿过他的后脑勺。一个衣衫褴褛、手臂上戴着俄罗斯三色旗的游击队员大摇大摆地走进房间，手里拿着一把托卡列夫。门咔嗒一声，被外面另一名游击队员的手锁上了。德米特里举起手枪，声音洪亮，脸上带着笑意，“好了，该说正事了！”德米特里大喊，朝天花板开火，然后用枪指着一名德国官僚，在两眼之间开了一个洞。西装革履的男人惊恐地看着他们的厄运。德米特里缓缓靠近其中一个，“你-你这个劣等人怪物，别碰我！我不会死在斯拉夫蛮子的手上……” 一声枪声响起。 “下一个是谁，嗯？”德米特里问，脸上洋洋得意。一名德国人在他的鲜血沾满门把手之前疯狂地拉动锁着的门。慢慢地，房间被漆成了红色，房间里只剩下德米特里还活着。\n\n他看着窗外，从口袋里拿出一支烟，打开了房间的窗户。他试着掸掉衣服上的血迹。“你把血弄到我的衣服上了，德国佬。”德米特里对地上的一具尸体说。“啊…莫斯科…”德米特里看了看风景，“总有一天，这一切将再次成为俄罗斯。”他向空中喷出一团烟雾。"
 NOV_reunification.48.a:0 "暴君的命运就该是这样。"
 NOV_reunification.49.t:0 "云上战争"
 NOV_reunification.49.desc:0 "“喂，星光，你可以降落了。接近跑道，千万别撞上去。那玩意儿昨天才装好的，不要这么快搞砸了。”一个嘶哑的声音从对讲机中传来。鲍里斯·帕夫连科，在苏联空军中担任星光的飞行员，自信地按下拇指上的按钮打开了麦克风。\n\n“收到，指挥官。星光帕夫连科，开始降落。预计平稳着陆在奥涅加238空军基地。降落完毕。” \n\n他们的新喷气式战斗机和CAS系统以及这些重要的空军基地让这位老军官感觉像百万富翁一样。他以前从未以如此快的速度旅行过，从未突破音速，而在过去的几年里，他们的科学发展飞速前进。这架飞机给他以现代感，感觉上可以真正与德国舰队匹敌。现在，他们只需要培训和起飞点。Pavlenko的降落很平稳，美妙地停在地面上。在完成停机系统的操作后，他打开舱门准备下机。他的指挥官正等着他。\n\n“太他妈棒了，星光。如果所有飞行员都能像你一样降落和起飞，我们就准备好对付德国佬了。你觉得新跑道怎么样，嗯？”他拍了拍帕夫连科的背，笑容满面。\n\n帕夫连科摘下护目镜，检查着这座完美无暇的设施。“在我看来，我们或许有一线胜机会击败法西斯。只要这地方不在两分钟内被炸毁。”\n\n没有任何数量的防空系统能够阻挡德国空军，只有一支相当的俄罗斯空军才能做到。然而，通过一些审慎的开支和大量的紧迫时间......也许可以扭转战局。"
 NOV_reunification.49.a:0 "战争的胜负并不只由地面部队决定。"
 NOV_reunification.50.t:0 "追随着他的脚步"
 NOV_reunification.50.desc:0 "安德烈小心地走在一排闪闪发光的T-72坦克前面，仔细检查每辆坦克。它们的状态良好，准备就绪。\"设计这些的人真是个天才，\"他微笑着喃喃道。他听到一阵脚步声，也许是动物？他转身看到一位身穿苏联武装部队制服的年长男子，他用好奇的眼神注视着坦克，手里拄着一根拐杖。安德烈观察了他片刻，然后放下笔记本，走向这位老人。\n\n\"对不起，先生。我想我以前没见过您。您有权限来这里吗？\"年轻的军官问道。\n\n老人转身对安德烈嘲笑着说道：\"哦，一位老战士不能看看我年轻的同志们将用来解放西方的工具吗？\"他的胸前，苏联英雄的金星自豪地闪耀着。\n\n安德烈结结巴巴地说道：\"对不起，我不知道......\"\n\n老兵用拐杖敲击了一辆坦克，并露出了笑容：\"如果我们在卫国战争期间有这些坦克，我们一周内就能到达柏林。\"\n\n安德烈笑了笑：\"我们一直在为即将到来的战斗做准备。我向您保证，我们很快就会回到莫斯科！\"\n\n老兵微笑着把手放在安德烈的肩膀上。"
 NOV_reunification.50.a:0 "“我不怀疑，年轻人。”"
 NOV_reunification.52.t:0 "计划"
 NOV_reunification.52.desc:0 "当纳粹国防军入侵法国，后来又入侵俄罗斯时，他们用自己的革命性的战术思想永远地改变了战争。这个战术思想的名字足以让所有人，甚至意志最坚定的老兵都感到恐惧。它就是闪电战。我们的目标很简单，那就是尽快深入敌占区。坦克和其他装甲车组成的装甲部队会在战争开始的几个小时内冲过边境，随后我们的空军将对基础设施和军事目标进行空袭，最后就是让步兵部队冲进去清理混乱了。”诺维科夫将军一边看着战争地图一边解释道。\n\n“我们的工业怎么办？他们能满足我们的需求吗？”舒克申看着克尔琴科问道。\n\n“近年来，我们的工业产能大幅增长。我和凤凰和西比尔的领导层联系过了。他们告诉我，他们的工业实力能够胜任这项任务。”\n\n瓦西里向波克里什金瞥了一眼。飞行员沉思着，保持沉默。“你有什么要补充的吗，亚历山大？”舒克申转向他的朋友问道。\n\n“这一切终于要开始了。”他嘟囔着，走向战略地图。“瓦西里，我为我们的未来担心。我不确定这一切会导向什么结果，但我学会了信任你。当然，我也不怀疑诺维科夫和克尔琴科的能力。我喜欢这种胜券在握的感觉，瓦西里。我想这次我们有机会了。”亚历山大转身对房间里的三个人吐露了心扉。\n\n舒克申带着柔和的微笑，把手放在波克雷什金紧张的肩膀上。"
 NOV_reunification.52.a:0 "“我们会赢得胜利的，老朋友。”"
 NOV_reunification.53.t:0 "又一个深夜"
 NOV_reunification.53.desc:0 "“真他妈累啊，”基拉咕哝着。“想来一杯咖啡吗？我不知道这有没有二十种不同的糖，但我可以数一下。”“滚犊子。”约翰在回答之前疲倦地笑了笑。“让我们再试一种排列。然后我去看看乔治能不能给我们弄点吃的来。”\n\n“在美国的时候，他们也净给你吃这些东西吗？”基拉问道。在约翰忙着打字的时候，她在他旁边的一张老椅子上坐了下来，\n\n他嗤笑了几声。\n\n“不，CIA的人从没想过一天三顿都吃土豆。谁知道它们能这么养颜，”约翰说道。“我想尝试一下埃利斯方法的另一种变体。这次我要用马克西姆上周教给我们的新方向来编程，让计算机执行选定的密文德尔塔。”“马克西姆懂个几把啊，操蛋的汤姆斯基，”基拉抱怨道。“要是没个人扶着他，他连自己的脚都找不着。”\n\n“礼貌点，基拉。至少马克西姆知道如何投票，”约翰说道。“你想想，在革命阵线统治下的俄罗斯经历了那些糟糕的事情之后，像你这样的人应该不会再投票给康米了。”他在呼呼作响的电脑上输入完命令，按下了回车键。“不管怎样，咱等一会吧。”\n\n“再来一局扑克？”基拉问道。“也许斯韦特兰娜可以借给你一些钱。”“你以为我在企业上班的时候他们没教过我怎么虚张声势吗？”\n\n三个半小时无聊地过去了。基拉又赢了一局牌，还赢了约翰的午饭钱，这时电脑嗡嗡作响地停了下来。“妈的，终于完事了，”基拉说道。“让我康康……”她一瘸一拐地走到电脑显示器前，以为截获的德国信息会像往常一样乱成一团。\n\n“卧槽。”她惊讶地说道。\n\n“啥啊？”\n\n“这是豪普特曼·魏格纳的命令，”她的声音开始颤抖。“107战斗机联队将在17:00之前重新被部署到纳夫加德机场。”"
 NOV_reunification.53.a:0 "“等会，所以说我们他妈的把它给破解了？”"
 NOV_reunification.54.t:0 "老人与海"
 NOV_reunification.54.desc:0 "“我他妈的不敢相信，”二等兵谢尔盖·科罗尔科夫说道。“我从阿列克谢耶夫卡一路来到这里，就是为了看这一条他妈的大海。”\n\n中士巴里卡德·克利莫夫冷哼了一声。这位老人坐着，吃着他的三明治，几乎没有给二等兵科罗尔科夫任何关注。\n\n“你知道，如果德国人从海上入侵，我们俩都会被杀掉，”科罗尔科夫说道。\n\n“我们的任务是在他们登陆前逃跑，小伙子。”\n\n“我不是小孩子！我是个男人，是联邦军队的士兵。如果那些法西斯狗敢踏上我祖国的土地，我就会把这帮混蛋射倒在他们停留的地方。”\n\n克利莫夫摇了摇头。“你自愿入伍的时候撒了谎。”\n\n“不，我没有。”\n\n“那告诉我，”巴里卡德问道，“在联邦入侵之前，哪个军阀控制着西俄罗斯？”\n\n“嗯，乔治·马列托夫？”\n\n克利莫夫摇了摇头。“你真是满嘴胡话，我都能从你的口臭中闻到。”克利莫夫转过身来，面对二等兵科罗尔科夫，三明治上的番茄汁滴在稀疏的草地上。“当我为西西伯利亚人民共和国作战时，我驻扎在兹拉托乌斯特。这帮家伙，雅利安兄弟会，占领了彼尔姆。几个月后，他们开始试探我们的边境。这里袭击一次，那里虚张声势，再加上一次刺杀。我被调到了利斯瓦。当我到达时，雅利安人已经控制了这座城市。你知道他们做了什么吗？”\n\n二等兵科罗尔科夫摇了摇头。“他们在城里走来走去，把每个人都关起来，然后砍掉他们的手。然后让他们挨饿。你见过一个两岁的孩子没了他妈的双手，哭着找父母吗？”\n\n谢尔盖什么也没说。他的胃已经翻了个底朝天。 “德国人的表现比卫国战争期间还要糟糕，”巴里卡德中士说。"
 NOV_reunification.54.a:0 "“感谢你不必在梦中看到这样的事情。”"
 NOV_reunification.55.t:0 "联邦向战争迈进"
 NOV_reunification.55.desc:0 "在整个西伯利亚，在乌拉尔山脉两侧，在碧蓝的伏尔加河两岸，联邦正在觉醒。就像一个从千年沉睡中醒来的巨人一样，她不安地搅动着，以排山倒海的力量站起来。\n\n在高尔基、车里雅宾斯克、萨马拉和叶卡捷琳堡，俄罗斯的希望和梦想被重新点燃，这些大熔炉变得火热起来。这些城市的人们夜以继日地工作，生产出成百上千辆坦克准备向大日耳曼国的土地冲锋。\n\n在伊尔库茨克和鄂木斯克，年轻人与他们的情人或妻子吻别。他们奉献自己的青春和生命，以履行对国家和亲人的责任，创造一个他们的家庭可以自由生活的世界。\n\n在秋明和新西伯利亚，参加过空战的老兵们都飞上了天空，在西伯利亚白雪覆盖的平原上进行飞行练习。从天上向下看去，一切都显得那么渺小。\n\n在堪察加和阿尔汉格尔斯克，红海军的退伍军人抛开政治，为数百万人的解放而战。他们唯一的愿望就是能在布哈林的领导下获胜。他们为那些在第二次世界大战中死去的灵魂哭泣，为自那些黑暗的日子开始以来被奴隶制之火烧死的每个男人、女人和孩子而哭泣。\n\n在上乌金斯克和喀山，少数民族纷纷准备拿起武器。在未来的几十年里，他们的牺牲将被铭记为最伟大的牺牲。\n\n在乌克兰和高加索，老人们挖出埋藏已久的步枪。他们的军队一次又一次地被击溃，他们的兄弟一个又一个地被杀死。这些老人不希望活到第二次西俄战争结束，但他们反抗的吼声会撼动阿特拉斯疲惫的双臂。\n\n在总统府，舒克申总统耐心地等待着，他的眼睛望向西方。很快，联邦将再次开战人民将准备迎接未来的斗争。"
 NOV_reunification.55.a:0 "我们不能带着恐惧的话语进入阿尔达古特的大厅。"
 NOV_reunification.56.t:0 "末日预言"
 NOV_reunification.56.desc:0 "当丹尼洛从连续劳累工作的麻木中缓过来的时候，他正在浇筑混凝土，准备建造一个小型通讯掩体的地基。天空万里无云，阳光明媚。德国战斗机的完美飞行条件。他清楚地知道，联邦空军已经强大到能将德国空军拒之门外。但每次他一转身，他就能感觉到子弹穿过他的皮肤。等等，那是飞机俯冲时的呜呜声吗？轻轻的微风使他感到不安。丹尼洛的手开始颤抖，他感到恶心，虚弱，他就像一星期没吃东西的人被迫跑一场马拉松。他的心砰砰直跳，呼吸困难。他为什么不能呼吸?\n\n丹尼洛弯下腰，喘着粗气。汗水从他的额头滴进了浓密的胡子里。他伸出一只手稳住自己，随即倒在泥里。\n\n“兄弟，兄弟，你能听到我吗？”有人在拍打着他。\n\n多么奇怪。\n\n“你，叫救护车！快！”“你是谁…？”丹尼洛用嘶哑的声音说道。\n\n“我是德米特里·帕宁神父，”这个陌生人说道。“你还好吗，我的孩子？你能呼吸吗？”\n\n丹尼洛摇了摇头表示否定。他的声音微小到几乎紧贴着才能听见。“我……我不能。天空……”他的声音渐渐消失了。\n\n帕宁神父皱起了眉头。“我明白，我的孩子。德国空军对盖尼的人并不比对你们家的人好，”他说道。“我在你身上看到了所有俄罗斯人都有的那种恐惧。但不要绝望--基督与你同在，他不会让他的羊群受到伤害。”\n\n丹尼洛的眼睛里充满了泪水。“恐怕我做不到，神父。”\n\n帕宁神父只是点了点头。“我知道。我也害怕。让我为你祈祷吧。”他把右手放在丹尼洛的额头上，擦去他头上的汗水和污垢。“万能的圣父，愿上帝保佑这个为保护他人而努力的人。救他脱离撒旦的网罗和试探，又护他的背脱离一切的伤痕和罪孽。你要使他知道你的同在，使他因你的慈爱得安慰。”远处，救护车的呜呜声越来越响。\n\n“圣丁芬纳，在每一个苦难心灵中创造伟大奇迹的创造者，我谦卑地恳求你通过玛丽亚为耶稣代祷，在这个人需要的时候。请不要离开他的身边！”远处，救护车的呜呜声越来越近。"
 NOV_reunification.56.a:0 "因为你是我们的圣洁……"
 NOV_war.1.t:0 "战争的恐怖"
 NOV_war.1.desc:0 "安德烈在被占领的小镇里漫步。这个小镇里到处都是俄罗斯士兵，因为它已经脱离了德国的统治，归于俄罗斯联邦的管辖之下。安德烈看着小镇居民兴奋地抹除德国人存在过的痕迹，但当他转过街角时，他听到了一声令人毛骨悚然的尖叫，这是他无法忽视的。他循着尖叫声传来的方向走去，最终停在了一座房前。当他走近它的时候，他听到紧闭着的门后传来剧烈的噪声。\n\n安德烈将脚抬到空中，把靴子重重地踩在门上，随着轰隆一声，门被踹开了。“这里发生了啥事？” 安德烈边看边问道。但下一秒，他就看到了一个残忍的场面：一名俄罗斯士兵挥舞着刀子，刺向一名哭泣的妇女的胸部。当他环顾房间时，他看到了德国人的名字，德国人的装饰品和照片里金发碧眼的人。毫无疑问，这是德国定居者的家。即便德国人如此可恨，但这种行为仍然不可原谅。\n\n安德烈像挥舞球棒一样挥舞着他的枪，枪托猛烈地砸在那个俄罗斯士兵的脸上，这一击直接把他从女人身上打飞了出去。“住手，你个混账东西！” 他对着那个士兵大喊道。“舒克申总统难道没有告诉过你吗？”安德烈对他的俄罗斯同胞问道。那名士兵痛苦地踉跄了一下。“你……你在试图保护德国佬？你在和这些狗娘养的玩意共情？你不明白吗，你不杀了德国人，德国人就会来杀你！” 这名士兵火冒三丈地回应道。安德烈揪起那个士兵的衣领子，让他的脸直面着那个仍在流血的女人。\n\n“看看你都干了些什么！？你认为这很人道吗？” 安德烈对着那个士兵的脸大喊道。“舒克申总统对每一个士兵都说过，不能对德国定居者施以暴力！”汗水从那个士兵的脸上滚落下来。“好吧…我会……”还没等他说完，他就被扔到了地上。“看看你做的一切吧，你刚才试图杀死的那个女人已经停止了呼吸。”安德烈最后朝着那个德国女人的毫无生气的眼睛瞥了一眼，随后缓慢地关上了门。"
 NOV_war.1.a:0 "战争让人疯狂……"
 NOV_war.2.t:0 "最后一战"
 NOV_war.2.desc:0 "瓦西里久久地凝视着他面前的一排树。他内心有种原始的冲动，想直接冲进去，单枪匹马地夺回俄罗斯，尽管他没有见过这样的俄罗斯。他的父母也没有见过。但是，他想要确保下一代人不会在西伯利亚的某个与世隔绝的小镇里长大。他想拯救俄罗斯和她的人民，并夺回被法西斯匪帮偷走的东西。\n\n生活在新西伯利亚的他想到了新生的技术官僚政府。它最开始只不过是个小军阀，随后它控制了其周边地带的无政府地区，之后又征服了远东，现在，它成为了俄罗斯的统一者。空气中弥漫着紧张的气氛，压得人喘不过气来，一滴雨点从他靴子上滑落，化为了草地上的一颗露珠。\n\n这条“国界”本身并不雄伟，甚至很可悲。在远处，人们可以用望远镜看到一些小哨所，但除此之外就没有什么边防设施，难怪这么多人可以如此轻松地进出。瓦西里曾有过如同孩子般天真的想要越过边境的想法，但这一念头很快就被他脑海里更强烈的声音粉碎了。\n\n他靠在一棵树上，低头看了看自己的手表 ，14时56分。快到点了，俄罗斯的命运紧紧地系在他身上。无论他们成功或是失败，给俄罗斯世世代代人民带来的利益和损失都将不可计量。历史将被改写，大日耳曼国，这一欧洲霸权即将土崩瓦解。"
 NOV_war.2.a:0 "不成功便成仁"
 NOV_postwar.1.t:0 "高加索的未来"
 NOV_postwar.1.desc:0 "重建工作即将完成，关于高加索重建区的未来已经在联邦议会中引发了激烈争论。一些人支持完全独立，另一些人则坚决主张吞并，还有很多人处于中间地带，提出了自己的解决方案。政府似乎陷入了僵局。瓦西里·舒克申的联盟网络遍及各方，而他的魅力将足以吸引足够多的民众支持他对高加索未来的愿景。该地区应该采取何种行动？"
 NOV_postwar.1.a:0 "将这一地区纳入联邦。"
 NOV_postwar.1.b:0 "给予格鲁吉亚人和阿塞拜疆人独立。"
 NOV_postwar.1.c:0 "在南高加索地区创造一个高加索共和国。"
 NOV_postwar.1.d:0 "将该地区统一为高加索联邦。"
 NOV_postwar.2.t:0 "波罗的海三国的未来"
 NOV_postwar.2.desc:0 "随着波罗的海国家的重建工作结束，该地区的三种文化现已重生，现在是决定波罗的海国家在未来几十年的命运的时候了。虽然许多政府成员呼吁完全吞并波罗的海重建区，但有些人认为独立的波罗的海三国对我们会更有利。这一论点内部也分出了两个派系，一些人支持波罗的海联邦，而另一些人则支持三国解决方案。现在看来，波罗的海国家的未来落在了舒克申总统的肩上。"
 NOV_postwar.2.a:0 "整合他们并给予他们在联邦内部的自治共和国地位。"
 NOV_postwar.2.b:0 "建立波罗的海联邦。"
 NOV_postwar.2.c:0 "三国方案才是最好的。"
 NOV_postwar.3.t:0 "白俄罗斯的未来"
 NOV_postwar.3.desc:0 "白俄罗斯的重建工作终于结束了，我们现在需要决定白俄罗斯的未来。虽然我们可以很容易地将白俄罗斯重新纳入俄罗斯，但也有人主张白俄罗斯应当独立，他们指出直接管理土地对联邦来说成本太高，拥有一个盟友将更有利于联邦在欧洲的利益。经过政府高层的多次讨论，最终做出了一个决定……"
 NOV_postwar.3.a:0 "白俄罗斯将作为一个自治共和国被整合。"
 NOV_postwar.3.b:0 "白俄罗斯将走向独立。"
 NOV_postwar.4.t:0 "一个新的彼得格勒？"
 NOV_postwar.4.desc:0 "瓦西里有生以来第一次对接下来的事情感到不确定，虽然他和他的同胞们已经赶走了德国人。瓦西里已经学习过了如何建造战壕、地堡和反坦克壕沟。很多他所持有的专业知识似乎已经没有用了。战争结束几周后，他终于得到了第一份命令。他和他所在营队的其他人被运到了彼得格勒。\n\n瓦西里在门上画了一个白色的X，当他开始走下短小的楼梯时，一个人用带着他听过的最浓厚的德国口音的蹩脚俄语叫住了他。\n\n“同志，你是--”\n\n“我不是共产主义者，你不能留下，就这么简单。”\n\n瓦西里陷入了对这个德国人的深深厌恶之中，他对俄罗斯人了解甚少，以至于认为他们都是共产党员，他对他的知识之匮乏感到同情。尽管如此，他对这种情况早有准备。\n\n瓦西里递给德国人一本小册子，希望德国人能听从其中的建议。“我直截了当地说，如果你想保住自己的性命，你的选择很有限。这所房子已经被标记为拆除对象，拆迁人员将在下周内到达。”\n\n这位“同志”几乎没有注意到，德国人已经开始哭了。有那么一瞬间，瓦西里有一种想要安慰这个人的冲动。他可能没有参与纳粹对这一地区的恐怖镇压。他可能只是一个工人，就像其他数百万人一样。但这种冲动很快就被他多年来听到的成千上万的故事、恐惧和焦虑所击退，这些故事都是由于纳粹的威胁而产生的。\n\n瓦西里很快就从那个哭泣的德国人身边走过，他还有活要干。"
 NOV_postwar.4.a:0 "也许终有一天，我们会像对待兄弟一样对待彼此。"
 NOV_postwar.5.t:0 "乌克兰的未来"
 NOV_postwar.5.desc:0 "乌克兰的重建工作已接近尾声，随之而来的是，我们需要确定乌克兰在这个崭新东欧的地位。有很多人主张乌克兰应保持独立，因为该地区几十年来一直拥有尽管非常有限的自治，而整合乌克兰只会破坏现状。乌克兰的未来现在完全取决于舒克申总统本人的意愿。"
 NOV_postwar.5.a:0 "将乌克兰整合为一个自治共和国。"
 NOV_postwar.5.b:0 "乌克兰将保持独立。"
 NOV_postwar.6.t:0 "世界在转动"
 NOV_postwar.6.desc:0 "在整个美国，在整个OFN，一张熟悉的面孔正面对着数以百万计的客厅发出信号。\n\n“晚上好，我是沃尔特·克朗凯特，”这位新闻工作者说道。“我身后的这些废墟位于巴库，阿塞拜疆的前首都。它们被之前发生在这里的战斗所摧毁，数百人因此死亡。”\n\n “在这些废墟中可以看到第三帝国对欧洲人民的占领和殖民化的实物证据。但这些废墟的意义却远没有那么具体。就像这片被烧毁的、被炸毁的和疲惫的土地上的其他东西一样，它们意味着生存或灭绝，生命或死亡。这取决于你与谁交谈。” \n\n镜头切换到一个身着灰色西装和领带的阿塞拜疆人身上。他作为高加索重建区的代表发言。\n\n“我认为，”他用口音浓厚的英语说道，“人们必须认识到我们作为一个民族所遭受的苦难，然后我们才能被治愈。当时我们毫无安全感可言。甚至当你在家待着，或者在城中心漫步的时候也没有。党卫军可以来到你的门前，敲你的门……” "
 NOV_postwar.6.a:0 "“…然后他们肆无忌惮地草菅人命。”"
 NOV_postwar.7.t:0 "世界在转动"
 NOV_postwar.7.desc:0 "镜头切回到克朗凯特身上。他站在一条尘土飞扬的街道上，旁边是一辆被炸毁的汽车。\n\n“人们对灾难本身发生的确切尺度存在疑问。死了多少人，造成了多少损失，都还只是近似值。尽管有德国方面提供的“官方”数字，但俄罗斯官员估计整个高加索地区的死亡人数达数百万，也许更多。任何在这些废墟中徘徊过的人都知道，准确的统计是不可能的。为什么，就在不久前，一个小老头来告诉我们，有两个孩子刚被埋在街区尽头的一个匆忙挖掘的坟墓里。那么这些废墟呢？他们是否翻遍了所有的废墟，寻找被埋的平民和士兵？我们在邮局后面的院子里发现的十四个阿泽里人呢？他们被统计过吗？无论如何，他们肯定没有被埋葬。”\n\n镜头转到外面。在克朗凯特身后，一栋公寓楼里浓烟滚滚。至少，它是一栋公寓楼。现在，它看起来更像是一座被沮丧的幼儿推倒的积木塔。\n\n“我们来到这里，来到高加索，以确定这一切对我们世界的未来意味着什么。自珍珠港被炸以来，民族社会主义思想的野蛮和邪恶从未对地球上的人们如此清晰。大日耳曼国方面的说法，即俄罗斯人正在以某种方式对德国人民进行种族清洗或种族战争，并没有得到确凿证据的证实。事实上，是俄罗斯联邦以人类有史以来最为人道的方式参与了这场战争，作为一个光荣的民族，他们履行了捍卫民主的承诺，并尽了最大努力。”"
 NOV_postwar.7.a:0 "“高加索的情况就是这样，感谢各位收看。”"
 NOV_postwar.8.t:0 "莫斯科，我们的家"
 NOV_postwar.8.desc:0 "在德国人踏遍莫斯科之前，舒克申从未亲眼见过莫斯科。自从战胜法西斯威胁后，他每个月都去这座城市，有时甚至每隔一周去一次。在他第一次去那里时，这座城市大部分是废墟，剩下的建筑物是面目全非的嘲弄。显然施佩尔的孩子们在他们征服的核心中发挥了作用。这是不可接受的；祖国的首都比毁容的纳粹建筑和废墟王冠更值得。\n\n在正式解放后的一天内，工人、工程师和设计师开始着手修复这座城市，清理被炸毁的墙壁和开裂的地基。在一年的大部分时间里，超过70%的莫斯科进行了重建。除了房屋、公寓、道路、医院、学校和机场外，工人们还在几位前十二月党人的注视下安装了艺术品、雕像和植物，并重建了历史建筑。博物馆、艺术画廊、两类剧院和众多体育场馆在每个街角如雨后春笋般涌现。著名的红色克里姆林宫得到了修复和扩建，目的是让它成为联邦总统和立法机构的大本营。其他政府大楼以俄罗斯新古典主义风格建造。粗野主义，以及围绕着它的恶毒毒气，永远被逐出了莫斯科的边界。\n\n长期被废弃的莫斯科地铁系统计划通过现代技术和工程技术得以重振。最终，凤凰以微弱优势击败了泰坦。莫斯科将拥有一个令东京和纽约的对手脸红的地铁系统。到本世纪末，莫斯科将成为一座新城市——一个工程和文化的奇迹，与它的根源相连，但又不畏惧展望未来。"
 NOV_postwar.8.a:0 "世界上没有哪座城市能比得上莫斯科的美丽。"
 NOV_postwar.9.t:0 "疯狂山脉"
 NOV_postwar.9.desc:0 "约西亚斯·祖·皮尔蒙特、爱德华·德森霍夫、保罗·普利格、汉斯·克尔、卡尔·海因茨·比尔格。这些都是罪犯的名字，而不是英雄的名字。这些都是野蛮人的名字，而不是文明人的名字。这些名字根本不值得被记住。\n\n在整个高加索地区，这些僭主把自己塑造成了神。法西斯的破坏者们以混凝土浇筑庙宇，锻造钢铁的大寺，并以自己的名字命名它们。他们要求用赤红的血来祭祀，如同过去的希腊神灵。在希腊，古老的神灵要求在午夜将春天出生的母羊扔进毒气弥漫的峡谷；在高加索专员辖区，这些寄生虫和暴君则更是渴望着人的鲜血。但正如文明之光将狰狞的赫卡忒从希腊的群山中驱逐出去一样，民主和自由的火焰也将烧掉这些伪神的污秽遗迹。\n\n这些山脉与峡谷，这些被血与泪浸泡过的土地将重新得到净化，纳粹的污点将被抹去。标志着“雅利安人智慧”的纪念碑将被砸碎，宫殿和种植园将被烧成灰烬，他们的孩子，如果还活着，将被遣返回德国。在这片土地上所创造的扭曲不堪的绘画、雕像和其他宣传品将像垃圾一样被扔进泥土。城市将按照人民的意愿被重新命名。企业将被征用，并卖给高加索公民。这张臃肿的恐怖和苦难之网将被俄罗斯人民的意志撕成两半。\n\n当我们完成这一切后，没有人会记得约西亚斯·祖·皮尔蒙特这个名字。他的遗毒将被烧成灰烬，就像他臃肿的尸体。他将从历史中被抹去。"
 NOV_postwar.9.a:0 "有些伤疤永远无法愈合。"
 NOV_postwar.10.t:0 "米宁和波扎尔斯基"
 NOV_postwar.10.desc:0 "瓦西里·舒克申与亚历山大·诺维科夫一起静静地站在红场上，几个月前，这里曾举行过胜利日游行，庆祝俄罗斯对德国的伟大胜利。舒克申仰望着米宁和波扎尔斯基纪念碑，现在正由联邦最优秀的雕塑家全面修复。\n\n该纪念碑建立于19世纪初的沙皇时代。在1941年的莫斯科战役中，米宁的脸被一枚射向圣巴西尔大教堂的流弹炸开了。在伟大的卫国战争之后，这座纪念碑被德国国防军作为射击靶，以训练他们的新兵发射武器。瓦西里还记得，当他看到纪念碑上布满的弹孔时是多么的惊恐。瓦西里微笑着看着一些俄罗斯最优秀的人的雕像，被占领的疤痕在它们身上完全消失了。\n\n瓦西里看了看雕像后面的大教堂，它被脚手架覆盖着，俄罗斯建筑工人继续不知疲倦地工作，以恢复这座标志性建筑昔日的辉煌。“告诉我，亚历山大。”舒克申说话了，引起了将军的注意。“你有没有想过事情会不会恢复到战争和混乱开始之前那样？德国人和俄罗斯人还会像兄弟一样互相问候吗？” 舒克申问道，他将一只手放在纪念碑光滑的石头上。\n\n诺维科夫沉默了片刻，他对总统的问题进行了深入思考。他们终于打败了德国人，现在，祖国正走在漫长的复兴之路上，但俄罗斯能真正从德国人对她所做的事情中走出来吗？战争的伤痕能否真正愈合？亚历山大深吸了一口气，看向他一向耐心的总统。"
 NOV_postwar.10.a:0 "“也许，有那么一天会的。”"
 NOV_postwar.11.t:0 "[195.GetName]的命运"
 NOV_postwar.11.desc:0 "彼得格勒曾经是俄罗斯帝国的首都，它以俄罗斯最伟大的沙皇的名字命名。在苏联时期，它因革命之乡而闻名，十月革命就发生在这里。然而，这些年来，它是一个主要由德国定居者居住的城市。他们在列宁格勒围城战后城市被攻占并摧毁，最后由奴隶重建后搬到那里。\n\n我们应该如何处理这座城市呢？我们是应该允许德国殖民者继续生活在彼得格勒，还是应该尝试让这个曾经的伟大城市再次俄罗斯化？"
 NOV_postwar.11.a:0 "成立一个合作政府。"
 NOV_postwar.11.b:0 "彼得格勒将重归俄罗斯。"
 NOV_postwar.13.t:0 "敖德萨问题"
 NOV_postwar.13.desc:0 "阿梅特汗叹了口气，用苍白的指尖揉了揉黑眼圈。他合上一直在看的马尼拉文件夹，把它放在舒克申总统的办公桌上。 “瓦西里，你愿意告诉我为什么我们要从罗马尼亚人那里要求敖德萨吗？我们仍在重建乌克兰，为什么我们要挑衅另一个国家？”\n\n舒克申交叉着手指。 “这不是冲突，我的朋友。这是为了向乌克兰人民表明我们关心他们，联邦正在为他们的利益而战。乌克兰多年来一直在鼓动夺回敖德萨。但是，在德国人的统治下，他们不能”不要对他们被困在任意边界的兄弟做任何事情。这是获得他们信任的绝佳机会。如果我们能为他们夺回敖德萨，这将使与乌克兰人的合作变得非常非常容易。”\n\n阿梅特汗双臂交叉，深吸一口气。 “所以。这是为了安抚乌克兰人。”\n\n“这是为了向他们展示我们正在照顾他们的利益，是的。”\n\n“如果没有另一场战争，我们就不能那样做吗？”苏丹部长摇了摇头。 “瓦西里，人终会死去。好人。我了解与纳粹的斗争，但你我都知道，现任罗马尼亚政府远非比嗜血的民族社会主义者恶劣。当然，必须有更好的方法——”\n\n舒克申用拳头猛击桌子。 “你认为我们可以信任罗马尼亚人吗？他们把命运投向了德国人，屠杀我们的人民，谋杀婴儿和老妇人！乌克兰人是我们的人民，只要他们处于这些暴徒的统治下，他们就永远不会安全规则。”\n\n“瓦西里，你自己告诉我你必须利用你的总统任期来树立先例。这次入侵会给未来留下什么样的遗产？”\n\n舒克申深吸一口气，在桌子底下握紧拳头。 “世界将看到民主是强大的。我们不会翻身，不会让我们的人民受到压迫。”"
 NOV_postwar.13.a:0 "“如果你不同意，我会找人同意。”"
 NOV_postwar.14.t: "来自莫斯科的特使"
 NOV_postwar.14.desc:0 ""
 NOV_postwar.14.a:0 "把外德涅斯特河沿岸还给他们。"
 NOV_postwar.14.b:0 "我们绝不对[RUS.GetName]让步！"
 NOV_postwar.15.t: "罗马尼亚同意归还外德涅斯特河沿岸"
 NOV_postwar.15.desc: "致：俄罗斯联邦总统 瓦西里·舒克申\n\n寄信方：罗马尼亚政府\n\n事由：关于德涅斯特河沿岸问题\n\n摘要：罗马尼亚政府听取了俄罗斯联邦提出的将德涅斯特河沿岸归还乌克兰的请求。已经由政府代理成员[NOVGetOdessaStatusNegotiation]进行投票表决。"
 NOV_postwar.15.a: "同意交易"
 NOV_postwar.16.t:0 "罗马尼亚拒绝了我们的要求"
 NOV_postwar.16.desc:0 "致：俄罗斯联邦总统 瓦西里·舒克申\n\n寄信方：罗马尼亚政府\n\n事由：关于敖德萨问题\n\n摘要：我们最初提出的让出外德涅斯特河沿岸的提议是我们罗马尼亚政府愿意让给乌克兰国的最大限度。俄罗斯联邦做出的任何其他领土让步都将被拒绝，因为在1969年的德涅斯特河沿岸全民公决中，人民选择继续与罗马尼亚政府在一起。在我们最初的提议之外提出的任何进一步要求都将被视为侵略行为，并将以武力予以回应。请接受我们最初的提议，以避免任何不必要的进一步升级，因为我们不希望在该地区制造另一场冲突，除非我们别无选择，捍卫我们正当合法的东西。"
 NOV_postwar.16.a:0 "让步吧，我们不需要更多的流血冲突了。"
 NOV_postwar.16.b:0 "向他们施压。"
 NOV_postwar.17.t:0 "[RUS.GetName]要求我们投降"
 NOV_postwar.17.desc:0 "尽管我们在前线的勇敢的小伙子们做出了最大的努力，但不可避免的事情还是发生了。[RUS.GetAdjective]军队已经占领了敖德萨，并要求我们归还乌克兰人口占多数的地区。尽管我们不愿意承认，但我们的政府在这件事上没有选择。现在是结束冲突，向[RUS.GetName]投降的时候了。"
 NOV_postwar.17.a:0 "我们投降！"
 NOV_postwar.18.t:0 "[ROM.GetName]投降了"
 NOV_postwar.18.desc:0 "在击退了罗马尼亚的军队并占领了我们所宣称的敖德萨的领土后，罗马尼亚政府最终决定向[RUS.GetName]交出这些土地，以换取[RUS.GetAdjective]军队从罗马尼亚撤出。经历多年来这么多场冲突，我们的军队和人民都希望结束战斗。[RUS.GetLeader]急于接受投降的条件，以回到重建东欧的事务中。"
 NOV_postwar.18.a:0 "这场冲突本不应该发生。"
 NOV_postwar.18.b:0 "让他们付出代价！"
 NOV_postwar.19.t:0 "最后一击"
 NOV_postwar.19.desc:0 "汉斯擦了擦额头上的汗水，他低头看了看在斯拉夫大军一路向西爬回，摧毁希特勒的遗产之前的东欧地图。自《里加条约》签订以来，狼人游击队一直在抵抗敌人，但似乎尽管他们尽了最大努力，劣等人最终还是取得了胜利。\n\n外面的枪声停止了，响亮的俄语喊声响起。看来汉斯是他的兄弟们中最后一个活着的了。他的呼吸变得越来越急促，他伸手拿起他的HK4，瞄准了门。在一只漆黑的靴子将门踢开之前，门把手抖动了一下。汉斯吓得大叫起来，一个俄罗斯人冲了进来，用手枪射击，汉斯吓得扔掉了枪。他倒在地上，背靠着墙，抬头看向站在他面前的俄罗斯士兵。\n\n“啊，汉斯。很高兴终于见到你了，想找到你可真不容易。我相信你知道我是谁，对吧？”士兵一边问，一边走近蜷缩的德国人。\n\n“迪米特里·伊万诺夫。是的，我知道你。是你杀了我们很多兄弟，你就是那个刺客，骇人俄兽”汉斯回答道。\n\n“我有我的命令，汉斯。舒克申总统希望我们不惜一切代价把你们赶出他的地盘，我不想让总统失望。你是最后一个了，汉斯。狼人游击队将和你一起归西。”\n\n汉斯抬头看着这个让他的数百名兄弟夜不能寐的人，他们曾整夜祈祷骇人俄兽不会来拜访他们。当他盯着枪管的时候，他能感觉到自己的手在颤抖。抵抗已经结束，欧洲的雅利安人为之奋斗的一切都被推翻了。俄罗斯人已经赢了。\n\n“我......看来，在经历了一切之后，你们这些犹太-布尔什维克的傀儡终于赢了，我们输了。快把我杀了吧。让这份耻辱结束吧。”汉斯边说边闭上眼睛。\n\n迪米特里扣动了扳机，汉斯倒在了地上。狼人游击队终于完蛋了。东欧终于可以痊愈了。一个名叫波格丹·别利亚耶夫的士兵手拿AV-72步枪走进房间。\n\n“长官，我们的命令是什么？”士兵问道。"
 NOV_postwar.19.a:0 "“把尸体扔这儿，把这地方烧了。”"
 NOV_postwar.20.t:0 "工厂被破坏"
 NOV_postwar.20.desc:0 "在夜色的掩护下，一支狼人游击队潜入了联邦的边界，炸毁了我们一个城市的工厂。一些工作人员和保安在他们行动的过程中被杀害，工厂已经化为灰烬。狼人需要在他们造成更多破坏之前被消灭。"
 NOV_postwar.20.a:0 "纳粹杂种！"
 NOV_postwar.21.t:0 "连环炸弹恐怖袭击！"
 NOV_postwar.21.desc:0 "尽管这是纯粹的懦夫行为，狼人游击队开始在东欧各地进行一系列恐怖爆炸袭击。数以千计的人死于这些爆炸，包括一些全俄罗斯军的士兵。我们决不能让这些灵魂白白死去，我们越早结束狼人的威胁越好。"
 NOV_postwar.21.a:0 "这些懦夫！"
 NOV_postwar.22.t:0 "一名将军被害！"
 NOV_postwar.22.desc:0 "最近有消息证实，一个狼人游击队员不知怎么潜入了联邦最优秀的人之一的办公室，并谋杀了我们国家最伟大的英雄之一。该刺客已被拘留，目前正面对俄罗斯怪兽的审讯。我们必须尽快阻止狼人游击队以免更多的英雄的生命被这些怪物夺走。"
 NOV_postwar.22.a:0 "举国致哀"
 NOV_postwar.23.t:0 "伏尔加国的命运"
 NOV_postwar.23.desc:0 "与东欧其他德国人占多数的地区情况不同，伏尔加地区虽然也曾经有大量定居者涌入，但他们大多还是沙皇时代应邀来此定居的德国人的后代。\n\n不管怎么说，伏尔加地区在德国统治下受纳粹意识形态的影响达数十年之久，尽管比德国本土要好很多，但当地仍有成千上万的纳粹支持者。\n\n这就提出了一个问题。联邦是应该尊重俄罗斯前沙皇的意愿，允许伏尔加河流域的德意志人留在原地，建立一个友好的政府，还是应该把他们送到德国，让这些纳粹匪帮滚回自己的家乡，不再给我们带来麻烦。"
 NOV_postwar.23.a:0 "成立一个合作政府。"
 NOV_postwar.23.b:0 "将伏尔加整合进联邦"
 NOV_postwar.23.c:0 "伏尔加将重归联邦"
 NOV_postwar.24.t:0 "哥滕兰的命运"
 NOV_postwar.24.desc:0 "哥滕兰是整个东欧第二大的德国移民集中地，他们坐拥整个东欧最重要的河流流域之一，第聂伯河流经包括俄罗斯本土在内的多个国家。\n\n这样一个由德国人定居的具有战略意义的地区，我们应该在该地区建立一个友好的政府，还是应该让乌克兰人收回自古以来的领土？"
 NOV_postwar.24.a:0 "建立一个合作政府。"
 NOV_postwar.24.b:0 "哥滕兰必须重归乌克兰。"
 NOV_postwar.25.t:0 "克里米亚的命运"
 NOV_postwar.25.desc:0 "克里米亚是黑海的大门。从罗马人到奥斯曼人再到俄罗斯人，这个半岛因此历经大规模征战数个世纪。它的地利使其具有极高的战略价值，控制克里米亚便可以确保完全控制黑海。我们应当斟酌，克里米亚半岛未来的命运究竟如何？"
 NOV_postwar.25.a:0 "建立自治区。"
 NOV_postwar.25.b:0 "克里米亚属于联邦。"
 NOV_postwar.25.c:0 "克里米亚是乌克兰的。"
 NOV_postwar.26.t:0 "赫尔松的一天"
 NOV_postwar.26.desc:0 "格奥尔基坐在被盐侵蚀的码头上，黑海温暖的水流过他酸痛的双脚。空气中弥漫着咸味，夹杂着腐烂鱼的气息。那天很暖和，但并不过分炎热，宜人而不灼人。他将一台相机放在膝上，黑色的，几周前从坦波夫的一家商店购买而来。本来，他想带父亲的相机来，但它在德国的轰炸中损坏了。这台相机只能勉强应付。\n\n格奥尔基记得多年前与妹妹在这个海滩上奔跑的情景。或许这只是记忆的记忆？有时，他回想起那些日子的画面更像是闪烁的影子，仿佛是模仿，而不是真实的事物。尽管如此，他依然能记起一些片段：咸水的味道、她奔跑时发飘的长发、被撕裂的脚趾甲的疼痛。啊，那些美好的日子。\n\n这位头发稀疏的男子打开了他的相册。它已经破裂，书脊几乎被频繁使用摧毁了。格奥尔基翻阅着有指纹污迹的页面。首先，是他在德国占领乌克兰时躲藏的难民营。那些被岁月和尘土侵蚀的老奶奶们，现在早已离世，恐惧的表情依然凝视着他。然后，是喀山的一座清真寺，外面响起了民族主义集会的怒吼。他拍摄了他们的愤怒。燃烧的垃圾桶和举起的拳头几乎要直接打击观看者。\n\n他翻过几页。那里有他留宿的部队，微笑着，一个肌肉发达的士兵用头锁住另一个士兵。照片旁边是他在宣传部的上司，嘴里咬着雪茄，眼镜在鼻梁上微微下垂，他对着相机皱着眉头。而在那之后，是尼科波尔的一张照片。被打得伤痕累累的男人和女人欢呼雀跃，一个由乌克兰人和俄罗斯人混合编成的部队，将纳粹卐字旗从镇中心的旗杆上摘下。\n\n太阳开始下山了。格奥尔基艰难地站起身，看着橙色的天空，抓住那一刻永恒的时刻。如果只有她也在这里和他一起看就好了。"
 NOV_postwar.26.a:0 "我们会想你的，萨沙。"
 NOV_postwar.27.t:0 "哈尔科夫蓝调"
 NOV_postwar.27.desc:0 "“操他妈的！”\n\n一阵咒骂声响起，在废墟中的男男女女转过身来，看到一个男人被建筑物的残骸吞噬了。仅仅几秒钟后，一个女人跃过废墟，试图让这个男人平静下来。几分钟过去了，那人从废墟中被解救出来，转身感谢救了他的英雄。\n\n“啊，谢谢...你叫什么名字？”\n\n那个女人用他很清楚的俄罗斯口音回答说：“我叫艾琳娜，你没事就好。”那个男人微笑着说：“嗯，谢谢你，埃琳娜，我是阿尔乔姆，我住在这里，而且......”“额，我想你没法继续住在这了。”\n\n阿尔乔姆吃了一惊；他对她的行为感到惊讶，但还是继续说道：“哈，非常正确。但正如我之前所说的，我很高兴你们都在这里帮忙；你们都是从哪里来的？”\n\n“我们大多数人来自别尔哥罗德，我们提前完成了清理损失的工作，因此，有人问我们是否可以在这里伸出援手。”阿尔乔姆眼里已经有了微微的窃喜，他们两个人在今天剩下的时间里开始工作，清理哈尔科夫市街道上的瓦砾。当他们完成当天的工作时，阿尔乔姆准备说再见，但他又一次被吓了一跳。\n\n“在我们住的地方，他们正在播放一部最近制作的关于明斯克战役的电影。你想过来和我一起看吗？”"
 NOV_postwar.27.a:0 "“愿意之至。”"
 NOV_postwar.28.t:0 "第聂伯河组织"
 NOV_postwar.28.desc:0 "敲门声响起时，费迪尔·科瓦连科正在享用一杯下午茶。老人拖着脚步走到门口时，膝盖酸痛。 “来了！”他摸索着锁，低声咒骂，直到他终于强行打开了门。费迪尔的眼睛惊讶地亮了起来。 “卡西亚！”他踉跄着上前拥抱他的老学生。 “我已经……八年没见过你了！你长大了！”\n\n卡西亚，现在是一个留着红色条纹胡子的二十出头的男人，笑了。 “我想你了，老师。我希望你不要介意，但我带了一个人来见你。这位是崔智友。”\n\n费迪尔越过年轻人的肩膀看了看，怀疑地眯起眼睛。他的另一位访客也很老，也许六十出头，胡子刮得干干净净，显然不是乌克兰人。 “我想你在这里有什么事，崔先生？”费迪尔说。\n\n智友鞠了一躬，礼貌地笑了笑。 “恐怕我是应您的学生的要求来到这里的，科瓦连科先生。”\n\n“崔大师是朝鲜语的学者，”卡西亚说，“就像你精通乌克兰语一样。”他笑了，他的眼睛看了一会儿太阳。 “当你教我说我的母语时，它改变了我的整个世界。我第一次觉得我与我们失去的人有某种联系。对我的母亲。”他咽了咽口水。 “我希望能够为其他人做到这一点。以某种有组织、系统的方式尝试重建乌克兰的文化。我称之为第聂伯河组织。”\n\n费迪尔扬起一边眉毛。“继续。”\n\n“我正在努力招募愿意向年轻人教授东欧语言和我们古老方式的男男女女。不仅是乌克兰语，还有白俄罗斯语、波兰语、斯洛伐克语——任何受到攻击的文化。法西斯主义者。我们需要鼓励联合文化事业，了解我们语言的起源，追求斯拉夫语言的保护和复兴——”\n\n费迪尔举起手打断了年轻人。 “你招募了多少人？”\n\n智友笑了。 “到目前为止，只有我。”\n\n科瓦连科笑着摇了摇头。 “我真的更愿意平静地喝杯茶结束我的一天。但如果这些老骨头能帮上忙，算我一个。”"
 NOV_postwar.28.a:0 "自此，步入正轨。"
 NOV_postwar.29.t:0 "开学第一天"
 NOV_postwar.29.desc:0 "黎明时分，安德烈在父亲的声音中醒来。 “安德烈，过来！”农夫喊道。 “我有样东西要给你看！”男孩蹒跚着下床，走进狭小的厨房，木板在他脚下吱吱作响。当他这样做的时候，他可以看到他的父亲非常兴奋，在他身后拿着一个东西。“爸爸，你拿着什么？”\n\n“你很快就会看到的。现在来，和我一起吃早餐。”\n\n安德烈在他父母身边坐下，第一缕阳光从地平线掠过。妈妈准备了三碗热气腾腾的卡沙，浇上蜂蜜和牛奶。她的脸颊通红，眼眶湿润。他皱起眉头：“一切都好吗，妈妈？”\n\n她笑了笑，挥手让他离开。 “当然，小家伙。现在吃你的早餐吧。接下来的一天会很忙。”\n\n安德烈把一勺卡莎塞进嘴里。 “爸爸，你今天要我做什么家务？”一点点食物从他嘴里流了出来。\n\n“别满嘴说话，孩子。”他父亲吸了一口气。 “有，啊，有很重要的事情要告诉你，今天你不用做家务。”他握住妈妈的手。 “从今天开始，你要上学了。”\n\n“学校？那农场呢？”\n\n“你妈妈和我会解决的。但是你需要结识新朋友，学习阅读和写作，提升自己。你不能像我一样在一个小屋里度过一生，耕种田地。”\n\n他笑了。 “我有东西给你。”他从背后掏出一个做工精良的背包，明显是美国人设计的。它甚至有一个标志！ “我们能够说服一位新店主让我们为你买一个。给你，你拿着它。”\n\n安德烈 的手滑过皮带时倒吸一口凉气。这是他接触过的最昂贵的物品之一。里面放着几本笔记本和几支铅笔，锋利的，随时准备记下需要写的东西。他笑了，拥抱了他的父母。 “谢谢，谢谢！我保证不会让你失望的！”"
 NOV_postwar.29.a:0 "“我们知道你会尽力而为，孩子。”"
 NOV_postwar.30.t:0 "俄罗斯和她的人民"
 NOV_postwar.30.desc:0 "库兹马发现自己很难对老师讲课的内容集中注意力，他握紧了拳头，在早上喝了一点母亲熬的咖啡，并努力注意听讲。然而，每次他的目光都会从他们的临时小帐篷转移到附近的建筑物上，那将会是他们真正的学校。这所学校离完工还有几个月，但当他的家人听说新政府将教授乌克兰语时，家长们要求他们的孩子在方便的时候尽早去上学。另一方面，库兹马希望在承担“上学”这样的责任之前，至少再花几周时间消遣消遣。\n\n他记得他的父母说，“当你完成第一年的学习后，你身上不会留下一丝德国佬的痕迹。”所以现在，他被困在学校里，看着刚刷好的火车头为镇上的第一所学校放置巨大的砖块，而他的老师在讲台后讲课。库兹马沉浸在思考中，他甚至没有注意到老师把话题从数学转向了地方历史。\n\n“无论你属于哪一个民族，所有东欧国家都有一个共同点，那就是决定帝国命运的大规模战役。就在那边，就在那片土地上，是波尔塔瓦战役发生的地方。俄罗斯沙皇，彼得大帝，惊人地击败了瑞典军队，并在此后不久开启了历史学家所称的俄罗斯黄金时代。”\n\n“也就是说，这不是人们第一次不得不把整个城镇重建一遍……”库兹马想道，尽管如此，这一次他真的听完了整节课。到了放学时间，库兹马还没来得及离开就被老师叫了起来。“库兹马，我注意到你今天在历史课上特别认真。你觉得这种事情有意思吗？” 库兹马迅速点了点头，然后老师把手伸到他的临时讲台下面，拿出了一本书。“给你这个，库兹马，这是一本关于我们国家历史的书，是这个国家新近印刷的第一批书籍之一，如果你有兴趣读一读，你可以比别人抢先一步。”\n\n库兹马瞪大了眼睛，他对这本书有些着迷，这本书的标题是“俄罗斯及其人民的历史”，它有一个纯蓝色的封面，上面有一只黑色的巨熊图案。他翻开书，立即开始费力地阅读那些较大的字，但他一看到这些字，就知道他必须学习书中的内容。库兹马向老师表达了谢意，然后飞快的跑回家，甚至在路上忘了理会向他招手的安德烈和安娜，就坐在他家门口的那棵树下。"
 NOV_postwar.30.a:0 "许多民族，一个国家。"
 NOV_postwar.31.t:0 "胜利日"
 NOV_postwar.31.desc:0 "舒克申从阳台上俯视着队伍无尽的行列。一系列情绪牵动着他的心弦。\n\n自豪。对自己的自豪。对自己引领国家走出黑暗的自豪。对那些看到他们的复仇、为了使联邦的胜利成为可能而牺牲的无数失落的灵魂的自豪。这场阅兵式比之前的规模大十倍、盛况更盛。他们每迈出一步，向全世界炫耀：这就是全俄军队，打败了不可战胜的德国国防军，解放了数百万人，把一个超级大国摧毁于掌心之中。这只是他的总统任期给俄罗斯带来的奇迹之一。\n\n恐惧。就在几个小时前，阿梅特汗向他汇报了武装部队显然无法遏制亲纳粹恐怖主义的崛起。狼人、叛乱分子和被德军撤退留下的激进殖民者武装自己，炸毁聚会，谋杀平民和任何放松警惕的人。据称，甚至还计划刺杀他。\n\n希望。终于，对未来的希望。莫斯科和远方的土地已经成为一片被轰炸摧毁的废墟，被奴役数十年。但是它们可以重建。狼人可以被清除，城市可以重生，死去的文化可以复兴。这将不是一项容易的任务。但是凭借一点血、汗和眼泪，东欧可以在太阳下占据一席之地。\n\n他向左边看去。阿梅特汗和波克雷什金站在那里微笑着，向阅兵队致意。波克雷什金俯身在舒克申总统的耳边大声喊道。"
 NOV_postwar.31.a:0 "“无论现在发生什么，你已经拯救了数百万人的生命。干得好！”"
 NOV_postwar.32.t:0 "里加宣言"
 NOV_postwar.32.desc:0 "以下内容摘自《波罗的海时报》第3页……“我们不能为波罗的海各主要民族建立完全独立的共和国。但我们也不能认为，我们应该简单地加入俄罗斯人的‘联邦’中。即使假设俄罗斯人是出于最大的诚意，由于他们的经济和人口的绝对规模，我们的国家也不过会成为他们的另一个‘州’。虽然他们也许不会做纳粹侵略者在过去对我们做的事情，但波罗的海人民将在一百年内被迫学习俄语，这不是因为联邦的邪恶或公然的帝国主义，而只是由于他们的经济规模。从维尔纽斯到塔林的人们将学会说俄语，按莫斯科时间作息，并分散到联邦各地，这只是现实的情况，许多人将称之为繁荣。”\n\n“然而，这并不意味着我赞同为每个民族都建立一个独立的共和国，这没有意义。相信我，我理解真正独立和摆脱所有国家约束的强烈愿望的诱人，但请考虑一下这意味着什么。每个共和国将不得不依赖自己来维持国家的基本运转。我们的经济复苏会放缓，我们会比联邦更穷，德国统治的伤痕会持续更久。”\n\n“虽然没有人主张退出我们与俄罗斯的安全条约，但对他国的依赖意味着主权国家的死亡。因此，我提出一个妥协的立场。”\n\n“......我们三个共和国，爱沙尼亚、拉脱维亚和立陶宛，有很多共同点。我们经历了无数入侵和统治的风暴，现在，在经历了可以说是世界历史上最反人类的罪行之后，我们仍屹立于此。我们拥有这么多黑暗的记忆和恐怖的故事，在面对这样的灾难时，一个共同的纽带让我们万众一心，那就是团结。我们共同的道路将我们联系在一起，如果有一样东西能让我们带入我们的未来，那么就让它成为我们共同的遗产。让我们建起我们的联邦，她不以莫斯科为指导，而以我们人民之间的合作为指导。我们可以共同建设我们的道路、学校和自由。让我们踏上我所建议的波罗的海之路!”"
 NOV_postwar.32.a:0 "波罗的海正在觉醒！"
 NOV_postwar.33.t:0 "塔林宣言"
 NOV_postwar.33.desc:0 "“为什么我们要屈服于成为俄罗斯联邦的“自治共和国”？难道我们忘记了克里姆林宫曾经是我们最大的压迫者吗？我们可以对他们的解放心怀感激，但并不需要向外国联邦屈服。我们已经维持了必要的安全安排，以防止另一次德国入侵，我们可以自力更生地摆脱德国的阴影。”\n\n“我们坐拥波罗的海，最近的检查表明德国人还没有把它堵住，这意味着我们可以进入全球贸易路线。我们不需要成为俄罗斯的附庸国才能摆脱贫困。我们的人民必须重新发现如何成为一个主权民族，这种复兴是不可能实现的，如果我们每次想通过一项法律都必须向莫斯科屈膝的话。我们怎么能指望俄罗斯人帮助我们发展我们的语言、音乐和文化呢？”\n\n“对这些问题的答案很简单：我们必须恢复旧的边界，让我们的人民自由独立地发展，摆脱外国的影响。我们要关闭边境，阻止潜在的俄罗斯移民，这样我们才能真正发展属于我们自己的民族国家。一个致力于爱沙尼亚理想、拉脱维亚理想和立陶宛理想的国家！”"
 NOV_postwar.33.a:0 "你可能是我们的盟友，但你不能主宰我们。"
 NOV_postwar.34.t:0 "考纳斯宣言"
 NOV_postwar.34.desc:0 "在维尔纽斯电台的一次广播辩论中，林格达斯·松盖拉极力为加入联邦辩护，他提出了以下论点。\n\n\"像许多人一样，我热爱我们的民族，要热爱一个民族，你必须希望它取得成功。许多反对加入的人担心俄罗斯对我们的干涉，其他人希望依赖三个共和国来保护我们的利益。坦率地说，这两种观点的辩护者都是误导的。俄罗斯人不需要进军里加就能确保他们的胜利。成千上万的人为我们的民族牺牲和流血。他们愿意战斗表明，踏上我们土地的俄罗斯人远非嗜血的暴君。他们对我们的自由感兴趣，我们不仅可以从他们为我们而战的意愿中看出这一点。看看西伯利亚各个自治共和国。雅库特人和布里亚特人在融入俄罗斯联邦后有变得更差吗？在自治共和国体制完善后，他们获得了教授本族语言的资金，他们的城市恢复了本土名称，并被平等对待。我们可以看到，他们已成为联邦的积极成员；许多雅库特人和布里亚特人来到我们的国家，是为了赶走德国的威胁。\n\n\"在立陶宛，我们可以亲眼目睹这个过程。俄罗斯人来了，他们并没有强迫每个人学习俄语，而是在教我们的孩子母语！此外，我们与俄罗斯官员进行了交流，他们打算赋予我们更多对教育、法律、预算甚至政府的控制权！我们可以投票选举我们共和国的总统，通过联邦在我们的本土之外施加更大的权力。这听起来像是压迫吗？\""
 NOV_postwar.34.a:0 "孤立的自由有什么价值？"
 NOV_postwar.35.t:0 "我们真正的名字"
 NOV_postwar.35.desc:0 "利伯特仔细听着他面前的每一个学生大声读着他们的立陶宛名字。即使汉斯也已经不再是汉斯了，他现在是多维达斯，没有人，包括利伯特，会怀疑他声音中夹杂的信念。现在，明亮的阳光透过窗户打在他身上，名字一个接一个地被说出来。\n\n\"保利努斯！\"\n\"塔瓦斯！\"\n\"加列提！\"\n\"莉娜！\"\n\"阿尔多纳！\" \n\"加比雅！\" \n\n“你呢？”老师问道，利伯特突然得到了一种巨大的羞耻感。他感到喉咙里有东西在往上涌，挣扎着吞下即将呕吐出的羞耻。\n\n“我……我的父母没有机会给我取一个立陶宛名字，他们在战斗中过世了，我的哥哥也没有。”老师的神情让利伯特想起了他母亲从他们家的窗户望出去时的样子。老师稍作停顿，说道：“没关系，这意味着你可以挑选一个，如果你有兴趣，你可以在课后待一会，我们可以聊一聊。”利伯特觉得身体晕乎乎的，但他还是努力听着老师上课所讲的内容。在他的第一堂立陶宛语书面课结束时，老师发表了一次精彩的演讲。\n\n“如果你今天没有听懂今天我讲的所有内容也没关系，你们都已经在我们立陶宛文化重生的事业中迈出了第一步。终有一天，这份重担将落在你们所有人的肩上，在今后，我们的未来可以变得比今天更加光明。”\n\n利伯特和老师聊了起来，他表示老师简短的讲话让他感同身受，于是老师又提出了一个建议。\n\n“既然你似乎很重视我们的语言，那么也许你的名字可以是“乔纳斯”？乔纳斯·雅布隆斯基是创造我们的语言的重要人物，有了像你这样的学生，你可以继承他的遗产。”"
 NOV_postwar.35.a:0 "而在那天，“利伯特”被乔纳斯遗忘了"
 NOV_postwar.36.t:0 "里加，波罗的海的珍珠"
 NOV_postwar.36.desc:0 "埃德加眺望着大海，连续几个小时望着地平线，尽管他确切地知道货物何时会到。日薄西山的时候，埃德加看到了它，那艘来自斯德哥尔摩的船。侧面贴着被阴影笼罩但仍然是白色的油漆，上面简单地写着“阿斯特里德”。埃德加一看到它，就带着近乎孩子般的喜悦在码头上走来走去，准备好他能说出的最流利的瑞典语。 \n\n当这艘船进港时，埃德加想见见瑞典商人的船员，并与里加第一艘不属于德国人的船只的船长握手。很快，他的机会出现了，一个满脸胡须的瑞典老人从船上走下来，与拉脱维亚人和周围的几个俄国人见面。“这艘船上载着几吨粮食，一些机械化拖拉机，以及收音机，甚至还有几台电视。”\n\n埃德加对电视的最后记忆是德国人撤退的时候，当俄国人开始挨家挨户寻找德国逃兵时，德国佬把所有有价值的东西都洗劫一空。瑞典人又开口了，“每隔一天应该会有另一艘船运来货物。我们甚至还带来了一些船员，帮助培训当地人，并为贸易修理港口。据我所知，美国人很快也回来，对吗？”埃德加点了点头，“是的，是的，我们有很多工作要做，以使我们摆脱过去三十年的恐怖，但除此之外，我们还想说一些我们都想说的话。”港口工人们都准备发言，几乎就像他们计划好了接下来要发生的事情一样，随着一声自豪的怒吼，一切都尽在不言中了。"
 NOV_postwar.36.a:0 "“欢迎来到拉脱维亚！”"
 NOV_postwar.37.t:0 "铁路上的一天"
 NOV_postwar.37.desc:0 "爱沙尼亚森林深处，一座帐篷亮堂堂地坐落其中。里面，二十四名爱沙尼亚人和几名俄罗斯人站在一张桌子旁。俄罗斯人弗拉基米尔看着地图，开口说道：“这里和这里是激烈战斗的地区。我们需要排雷队清理该地区的任何未爆炸物，待处理完毕后，我们可以开始修复通往纳尔瓦的铁路。另外，由于许多人没有维护和建设铁路的经验，我们将分配一些资历较老的人员来教育和指导大家。明白吗？\"\n\n在每个小组内，介绍开始了，每个人分享着自己独特但熟悉的故事。“几年前，我的房子被炸毁了，\"一个人说道。“每天，我都不得不假装成另一个人，\"另一个人说道。\n\n\"每个月，一个德国人都会来看望我的母亲。\"当一天开始时，他们都是陌生人，而到了最后，他们因为渴望重建自己的大陆而结下了深厚的情谊。\n\n于是，爱沙尼亚人和俄罗斯人在那个夜晚开始工作，重建了这座在过去十年里第二次被炸毁的铁路，为一个终于充满希望的未来而努力。"
 NOV_postwar.37.a:0 "兄弟情谊和共同的奋斗，快速结交了朋友。"
 NOV_postwar.38.t:0 "复兴之日"
 NOV_postwar.38.desc:0 "“我们现在得走了，否则就要来不及了！”伊维塔正拼命地把脚放进他父母给她买的新鞋子里，而克里斯廷则在梳理她那乱糟糟的头发。尤里斯在门边等着，怂恿他的两个朋友。当三人穿上他们多年来得到的最好的衣服后，他们开始向道加瓦河边走去。\n\n三人以最快的速度跑过被炸毁的街道、布满炸弹的废墟和冒烟的弹坑，一路上充满了欢声笑语。十几分钟后，三人来到了河边。“看，我告诉过你我们赶得上；他们甚至还没有转弯呢，”克里斯汀说道。伊维塔和尤里斯笑着翻了个白眼。“如果我们每次都听你的，我们就会比正常情况到的更晚一些！”伊维塔说道。三人笑了笑，靠在河边的栏杆上。\n\n随着夜幕降临，尤里斯密切注视着船只，但克里斯廷和伊维塔一直在交换眼神和低声说话。尤里斯对此并不太在意；他急切地想看到庆祝拉脱维亚历史时刻的船只驶过。夜幕降临时，三人看着烟花射向黑暗的天空，灿烂的火焰以重生的拉脱维亚国旗的颜色结束。现在，他们已经摆脱了德国的压迫。三人感到自由在他们的灵魂中激荡。希望之火在他们心中重燃，他们知道，无论接下来会发生什么，他们的人民和他们的祖国都已经把过去的黑暗抛在了身后。因此，当克里斯汀和伊维塔开始牵手时，尤里斯心里只想着他们所有人面前的光明未来。"
 NOV_postwar.38.a:0 "“挣脱压迫的自由意味着爱的自由。”"
 NOV_postwar.39.t:0 "劝导者"
 NOV_postwar.39.desc:0 "米卡拉伊神父跪在雪地上，在烧毁的大教堂的灰烬中祈祷。“我们在天上的父，愿人都尊你的名为圣……”他喃喃自语，凭着记忆叨念着这段祷文。“你的国度…操！”\n\n他把他的光头埋进雪里。“天父，我不明白。我们一直活到现在，而你却让纳粹在从白俄罗斯撤退时烧毁我们的村庄？为什么？为什么？你为什么不保护你的羊群？”他连问道。\n\n冰冷的风在击打着他的脸庞，米卡拉伊沉默地坐在那里。几十分钟过去了。也许他会在曾经是他家的荒地上冻死。\n\n就在这时，一丝光亮吸引了米卡拉伊的目光。他在雪地上爬行，目不转睛地看着，直到他的手碰到了一个硬物。他挖开地上的雪，发现了一块红色的玻璃板。他刮掉了覆盖在曾经是彩色玻璃窗上的冰霜。首先，他揭开了圣母的面纱；然后是赤身裸体的基督儿童，依偎在他母亲慈爱的怀抱中。就像老神父兹米尔曾告诉他的那样，他们一直生活在天父的慈爱中。\n\n但是，随着雪被拨开，一把刀的黑边在玛利亚的背后露出来。不，不是刀子--是粗糙的、墨黑的、沾满血迹的纳粹标志的边缘。它笼罩着圣母和她的儿子，在他们身后散发着撒旦的不洁之光。\n\n“但是，天父，我…我不得不这样做，他们会……”米卡拉伊低声说道。哦，上帝。他错了。\n\n“哦，主啊，原谅我。原谅我，天父，原谅我。”他低声说。“我错了。请原谅我。”\n\n他挣扎着站了起来，向地平线望去。但无论他望得多远，他也看不到日耳曼尼亚的灯光。他双手合十。“主啊，请保护白俄罗斯的人民，让我们回到你的光明中去，”他开始说道。“保护你的长子，以色列的孩子。拯救他们免受诱惑和痛苦。”他吸了口气。他需要为......他们祈祷吗？\n\n“主啊，”他喃喃自语，犹豫不决，“请保佑德国的人民。我祈求他们改邪归正，请怜悯他们的灵魂。”"
 NOV_postwar.39.a:0 "只是我告诉你们，要爱你们的仇敌，为那逼迫你们的祷告。"
 NOV_postwar.40.t:0 "明斯克的重塑"
 NOV_postwar.40.desc:0 "一群人聚集在明斯克市中心的一组混凝土碉堡周围。人们终于能够在不担心被枪杀的情况下仔细观察德军的碉堡了，而回到那场幸好已经成为过去的战斗现场似乎也是理所当然的。在俄罗斯士兵清除了所有枪支和爆炸物后，人们现在被允许进去参观。虽然有不少居民希望地堡消失，但对于工程师和建筑工人来说，这并不是一个优先事项，他们已经被一长串的工作压得喘不过气来，这意味着地堡将不得不再保留一段时间。\n\n这时，一对年轻人走上前去，每个人都拿着沉重的箱子，把它们在地堡外面摆好。他们把箱子打开，露出里面装着的大桶的油漆和几把刷子。两个人中的一个，一个留着小胡子的年轻人，开始在地堡的一侧画鸽子。另一个人画了一个坐在木头上面的拉扎维克。一个接一个的人开始加入进来，在明斯克市中心的巨大画布上画起飞机、联邦的旗帜、船只和森林。\n\n当工程师们计划拆除地堡的时候，它已经成为一个有活力的艺术项目，成千上万的人参与其中。艺术家们认为不应该破坏现在已成为白俄罗斯历史纪念碑的东西。工程师们在离开时还想到了其他地点。就这样，地堡从德国统治的象征转变为了白俄罗斯新文化的一部分。"
 NOV_postwar.40.a:0 "白俄罗斯重生了"
 NOV_postwar.41.t:0 "佐里亚"
 NOV_postwar.41.desc:0 "舒克申打开桌上的文件夹，开始头晕目眩。有无数的图表、数字和数字；从字面上看，数百张纸都在引起他的注意。一个描述了西西伯利亚中部和西伯利亚的石油产量；另一位指出贵金属短缺，并主张将资源从军方转移到一个未指明的项目。另一个假设了联邦与自由国家组织之间长期合作的可能性。但最引起他注意的是封面：一幅简单的凤凰图案，上面写着 “佐里亚计划”。\n\n舒克申总统说：“先生们，我无法弄清这件事的正反面。”他把文件夹推向来访者。 “给我执行摘要。你有五分钟时间。”\n\n“看，这就是我如此喜欢他的原因，”泰坦集团首席财务官安纳托利·亚洪托夫对他干瘪的同伴说。 “混蛋知道他想要什么。”他转身面对舒克申总统，他的门牙闪着推销员般的微笑。 “我们提议贵国政府与我们最新的子公司泰坦航空建立公私合作伙伴关系。我们需要投资资金，考虑到纳粹造成的破坏程度，我们认为你们希望在大莫斯科地区创造就业机会， “ 他说。\n\n“我在听，”舒克申说。 “你在暗示什么——客运飞机？喷气式战斗机？你是要瞄准国内市场，还是要销往国外？”\n\n“以上都不是，”亚洪托夫笑得更灿烂了。 “我们想帮助启动联邦太空计划。”\n\n惊喜像一道闪电击中了舒克申总统。 “太空计划？亚洪托夫先生，我们仍在重建莫斯科，更不用说我们的其他领土收益了。我怎么可能说服议会资助这个项目？”\n\n“很简单，”他说。 “我们有来自德国和美国的数据。为面向太空的研发项目提供资金的总体GDP收益远远超过成本。”他靠在舒克申的办公桌上，他的领带悬在共和国的印章上。 “但老实说。我们正在谈论在十年内将宇航员送上月球。谁会拒绝创造历史的机会呢？”"
 NOV_postwar.41.a:0 "太阳的宫殿将会开启，从它的大门放射出荣耀……"
 NOV_postwar.42.t:0 "锤子与钉子"
 NOV_postwar.42.desc:0 "“再读一遍，爸爸！就一遍！”小安东喊道。他深邃的棕色眼睛期待地仰望着他的父亲，剪短的刘海落在额头上，像天使翅膀上的羽毛。\n\n“好了，现在是你的睡觉时间，”马克西姆笑着说。天哪，他的背已经开始痛了。“但就因为我这么爱你，我们再读一遍。然后直接上床睡觉。”说实话，他已经厌倦了谈论火车。在工作中，它是关于铺设铁轨和时间表的无休止的争论，在家里，他还得担心铁轨会不会裂开，以及当斯摩棱斯克和明斯克之间的铁路建设完成后他们会做什么。\n\n安东笑了，瞬间融化了马克西姆的心。“好吧，再来一遍！”小男孩说。但是，马克西姆认为，这是值得的。\n\n马克西姆举起那本亮蓝色的儿童书，翻开封面。一列深蓝色、以煤为动力的火车在新铺设的轨道上飞驰，金色的西里尔字母用白俄罗斯语写着“砰！砰！火车来了！”。马克西姆和安东一起读了标题，然后马克西姆开始阅读故事。\n\n“献给叶卡捷琳娜，愿你的火车永远滚滚向前，”马克西姆念道。“作者：爱德华·尼古拉耶维奇·乌斯宾斯基。在俄罗斯联邦托木斯克市印刷，由西比尔出版公司出版。” 他翻开了这一页。\n\n“砰！砰！砰砰砰！”他喊道。\n“友谊的火车开动啦！”\n“咔嚓！咔嚓！嘎吱嘎吱！”\n勤劳的锤子毫不松懈。\n“哎哟！哎哟！哎哎哟！”\n懒惰的钉子脱离了床铺。\n“刷！刷！刷刷刷！”\n强大的锯子许了个愿。\n“耶！耶！耶耶耶！”\n这就是车上的人们所说的。\n他们喜欢他们的火车，他们喜欢这趟旅程。\n火车载着他们滚滚向前，一路上左右摇摆。\n他们拥抱着锤子，亲吻着锯子。\n无视了懒惰的钉子。“结束了！”\n\n“我喜欢火车，”小安东说。“等我长大了，我也想帮忙建设火车轨道，就像你，爸爸一样。”\n马克西姆笑了。“不，铺设铁轨没什么意思。你应该成为一名列车长或火车工程师。那会很有趣。”\n\n“如果我再梦到火车，你想听听我的梦吗？”安东问道。"
 NOV_postwar.42.a:0 "“当然，我的儿子，”马克西姆说。“为你做什么都可以。”"
 NOV_postwar.43.t:0 "彼得格勒的一天"
 NOV_postwar.43.desc:0 "舒克申站在彼得格勒港口的遗迹中。他从未想过自己能站在波罗的海的大门口，然而，他现在就站在这里。波罗的海水的缓缓流动相当平静，帮助紧张的总统放松了一会儿。\n\n舒克申向他的身后看去，看到一群德国定居者正盯着他，有的带着好奇，有的带着憎恨，有的是两者都有。唯一阻止他们的是一堵由俄罗斯士兵、当地警察和头顶上不断巡逻的直升飞机组成的墙。\n\n身处彼得格勒感觉很奇怪。瓦西里不习惯待在身边没有俄罗斯同胞或是鞑靼人、雅库特人而是德国人的土地上。这些人几十年前就入侵了他的祖国，而俄罗斯最终在联邦的旗帜下击败了这些人。\n\n波克雷什金极力反对他来彼得格勒，他认为这个城市不会像莫斯科或斯摩棱斯克那样热情接待他。瓦西里当然没有理会他。他需要亲自去看看波罗的海。他需要看到所发生的一切的后果，看到占领的后果。他必须亲自看看德国对东欧做了什么。\n\n瓦西里叹了口气，听说总统到来后陪同他的叶夫谢夫将军走了过来。\n\n“舒克申总统，我建议我们在这群人中一些比较……激进的人开始有任何想法之前离开。”将军建议道。\n\n舒克申看过去，看到几个定居者挥舞着印有纳粹标志的红色旗帜。看到这些人带着仇恨的象征，他的心几乎要碎了，但他不得不提醒自己，这些人和他的人民一样，都是希特勒设想的受害者。他们被纳粹所洗脑，养成了仇恨的习惯。瓦西里只能希望，随着时间的推移，希特勒的遗产最终能够被抹除。\n\n瓦西里最后点了点头，年长的将军护送他到车上。"
 NOV_postwar.43.a:0 "“时间可以治愈所有的悲伤。”"
 NOV_postwar.44.t:0 "欧罗巴的新面貌"
 NOV_postwar.44.desc:0 "舒克申安静地坐在椅子上，低头看着重新绘制的东欧地图。他揉了揉自己的眼睛。他对与西部的德国定居者的关系做出了正确的决定吗？他看了看他正身处的办公室。他不习惯克里姆林宫，不习惯莫斯科。它不像新西伯利亚。这里没有他在家乡西伯利亚的广阔平原上习惯的那种气氛。舒克申伸手去拿桌上的那瓶伏特加，但瓶子被关心他的波克雷什金抢走了。\n\n“谢谢你，亚历山大，”舒克申靠在椅子上喃喃自语道。\n\n“瓦西里，你看起来脸色太差了。你最后一次睡觉是什么时候？”飞行员一边问，一边把瓶子放在一个柜子上面，不让舒克申碰到。\n\n“我已经好几个星期没有好好休息过了。”舒克申嘟囔着，他再次盯着地图。\n\n波克雷什金叹了口气，抓起地图，把它卷起来，放在一边。\n\n“沉浸在你自己的决定中对人民没有好处。你做得很好，我的朋友。东欧自由了，这才是最重要的。我知道你是总统，但作为你的朋友，我命令你去睡一会。因为有你，联邦比以往任何时候都要强大。我相信她可以承受你休息几个小时的代价。”\n\n舒克申沉默了一会儿，微笑着站了起来。\n\n“好吧，亚历山大。我会去休息一会的。如果一个愤怒的CEO来敲门，麻烦转告他我去瑟克特夫卡尔了！”总统边说笑边走出门去。\n\n波克雷什金摇了摇头，脸上露出了笑容。"
 NOV_postwar.44.a:0 "为了一个充满希望的未来。"
 NOV_postwar.49.t:0 "还都莫斯科！"
 NOV_postwar.49.desc:0 "“这个地方是个垃圾场，瓦西里。为什么我们不能用推土机推倒一切，重新开始？”\n\n舒克申停下脚步，转向他的老友，阿梅特汗·苏丹，苏联的英雄，一个熟练的飞行员，在他好友以竞走的速度移动的时候停了下来，微微颤抖。舒克申短暂地低头看了看他脚下的瓦砾。\n\n“我们不能随便拆毁几个世纪的历史，阿梅特。莫斯科是我们打仗和赢得这场战争的全部原因。这是我们动员人民的方式，也是我们如何安慰那些牺牲者的寡妇和哭泣的母亲的方式。这是我们的战斗意志，为了夺回莫斯科，我们可以付出一切代价。我们不能因为现在看起来不尽人意，就放弃我们对所有在这一路上死去的人的责任。重建需要时间。”舒克申委婉地回答。\n\n两人继续走着，看到街上的乞丐和受困的市民拿着杂物蹒跚而行。苏丹再次开口了。“为什么我们不能建造一些崭新的，令人兴奋的东西？你见过那些美国城市吗？他们到处都有高大的办公大楼，可以支持现代经济。”\n\n“有足够多的城市可以实施这样的计划。但莫斯科的想法，更重要的是莫斯科的人民，应该得到比那些城市能提供的更好的东西。想想看，如果我们让开发商进来，买下所有的土地来做办公场所，会有多少人被迫离开他们的家园。不，莫斯科的威望需要保持，它的人民需要被放在第一位，”舒克申总统回答说。\n\n“我想你是对的。我很高兴你能考虑到目前居住于莫斯科的居民，瓦西里。俄罗斯应该是一个各种背景的人都能和谐相处的地方。”苏丹热情地说。\n\n两人绕过拐角进入红场。在远处，脚手架覆盖着圣巴西尔大教堂的穹顶。该建筑将被恢复到被占领前的样子。它将成为莫斯科天际线的中心，并将向世界表明，俄罗斯终于回来了。"
 NOV_postwar.49.a:0 "我们将重建这里。"
 NOV_postwar.50.t:0 "第一天的工作"
 NOV_postwar.50.desc:0 "在沃罗涅日，这是一个寒冷的早晨，但在阿丽娜·沃龙科娃的生活中，这是一个与众不同的早晨。在第二次西俄战争中作为狙击手服役结束时，国家再次召集她履行职责。但这一次，她不会在莫辛望远镜后面，而是在老师的桌子后面。\n\n在准备离开公寓时，阿丽娜只能想起她在托木斯克的童年。她记得无数个日子，在家门外的雪堆中奔跑，怀揣着一首歌在上学的路上疾驰。在她会拼写之前，她就爱上了教学的想法。但随之而来的是战争、混乱和苦难。事实上，当他们与共和国作战时，她最终站在了西罗维基视线的错误一边。只是填海战争开始前那段绝望的日子，才让她选择了离开街头。\n\n阿丽娜走出简陋的公寓时浑身发抖。一声担忧的叹息从她的唇间逸出。有可能吗？第二次机会……似乎几乎不可能。\n\n小学门口的梯子上站着一个身材魁梧的男人，手里拿着画笔，正在用西里尔文重写校名。爱丽娜忍不住对这座帝王风范的蒲公英黄建筑赞叹不已。这是旧体育馆的微不足道的复制品——但功能先于辉煌，尤其是在这样的时代。 “沃龙科娃上校！”画家冲上去迎接她时，差点从梯子上跳下来。 “真是太幸运了！几个月来我一直要求政府给我们派一位真正的老师。孩子们，保佑他们，几乎不知道如何用俄语要饼干。我试过了，天哪，我试过了，但是——”\n\n“长官。阿丽娜打断了他的话，挺直了腰，开始了游行休息。 “没时间歇斯底里了。带我进去。”\n\n校长领阿丽娜到教室。学生们跑到他们的座位上，许多人的脸上都沾满了鼻涕或蜡笔，并犹豫地向她打招呼：“Guten morgen，Frau Lehrerin！（德语：早安，老师！）”\n\n安雅笑了。 “早上好，小家伙们。我叫上校——对不起，沃龙科娃小姐。”"
 NOV_postwar.50.a:0 "“我认为我们将从彼此身上学到很多东西。”"
 NOV_postwar.52.t:0 "群星"
 NOV_postwar.52.desc:0 "总统在安全的控制室里满怀期待地看着倒计时的开始。在他身边站着的波克雷什金既好奇又敬畏地看着数字慢慢开始倒数。\n\n三。\n二。\n一。\n\n发动机轰鸣着，它下面的地面变得白热化，火焰推动着火箭离开地面，留下了一串烟雾，它向着晶莹的蓝色地平线外的星辰飞奔而去。\n\n舒克申眼花缭乱地回顾了联邦所走过的不可思议的旅程，从中西伯利亚共和国的一个挣扎求生的军阀国家，到统一俄罗斯的佼佼者，再到为1941的耻辱报仇雪恨的人，历史上唯一战胜过德国国防军的国家，以及为苍穹中的明天奠定基础的人。\n\n当科学家们告诉总统，航天器已经成功地进行了入轨，并准备在月球上着陆时，舒克申只是点了点头。他笑了笑，无言以对，此时，整个联邦都将目光投向了浩瀚星辰，因为曾经看起来不可能的事情现在已经成为了现实，似乎有无穷无尽的新的可能性和梦想现在已经触手可及。"
 NOV_postwar.52.a:0 "不再是梦。"
 NOV_postwar.53.t:0 "德米特洛夫"
 NOV_postwar.53.desc:0 "德米特洛夫镇很古老。该村位于莫斯科郊区，村民对现代农业方法一无所知，也无法使用。他们生活在肮脏的环境中，被德国至上主义和数十年的战争所迫。\n\n一个大雾弥漫的早晨，年长的农民和他们的孩子被引擎的隆隆声吵醒了。满载各种补给品的庞大车队在小镇尘土飞扬的道路上疾驰而过。一队身着西装的男子停在历史中心外。他们的助手搭起了帐篷，打开了大量的文件。\n\n没过多久，小乔吉就走了过来。当然，他的绰号是个玩笑。他快四十五岁了，肌肉发达，已经秃顶，双手长满老茧，皮肤晒成黑褐色，这是多年在田间劳作的结果。他一直是那种好奇的人，尽管他的父母竭尽全力劝阻他。他绕到其中一名助理，一个不超过19岁的女孩，清了清嗓子。 “啊，小姐，这是怎么回事？”\n\n她跳到他面前，口中的泡泡糖啪啪作响。 “嘿那里！我不得不说，我只是喜欢你的小镇。它太可爱了！”她伸出手，“玛格丽塔·科兹洛娃，从鄂木斯克国立农业大学来访。Go Owls！”\n\n年轻的乔吉从未听说过这所学校。他握住她的手。 “听着，小姐——”\n\n“玛格丽塔。”\n\n“玛格丽塔。很高兴见到你，小姐，但我真的很想知道卡车的事——”\n\n“哦，那个！”玛格丽塔拍了拍她的头。 “呃！好吧，我的教授正在与农业部合作。进行一项实验。我们买了一些新拖拉机——拉拉队为它收集了整个系列，我们烤了饼干，它非常酷——我们假设如果我们教你们如何使用它们，再加上使用更好的肥料，你们的作物产量将增加一倍左右。我知道我把数字留在了这里的某个地方……”\n\n德米特洛夫的本地人交叉着双臂。 “小姐，我一辈子都在务农，我爸，我爸，我爸的父亲的父亲，我们都在这里种地。带着你那些花哨的玩意儿来这里，连问都不问，就教我们干活……这有点粗鲁。”\n\n她把头歪向一边。 “好吧，这是一个自愿的实验。我们会付钱给你——”"
 NOV_postwar.53.a:0 "“小姐，你是个差劲的推销员，我该在哪里签字？”"
 NOV_postwar.54.t:0 "白色的夜，红色的帆"
 NOV_postwar.54.desc:0 "白夜降临到圣彼得堡的夏天。学生们投身于无尽的庆祝活动中，烛光和烈酒充斥整个城市。诗歌比赛、建筑展览和传统美食填满他们的肚子和思绪。人们一点一点地埋葬着那被毁损的圣彼得堡的记忆。\n\n蒂莫菲·安东诺夫和维多利亚·劳森巴赫走过堤岸，欣赏太阳悬挂在夜空中，吸收着巴拉莱卡的旋律和传统舞蹈。微弱的黄光照亮了维多利亚柔美的面容。\n\n\"你不喜欢这里吗？\"蒂莫菲说道：\"音乐，灯光。我们文化的复兴。\"\n\n\"我们的文化？蒂莫菲...\"\n\n\"俄罗斯文化，我的意思。就在几年前，这一切都是非法的。天知道有多少人会消失不见。\"\n\n维多利亚抱紧了她的外套，望着大海。\"什么是'俄罗斯文化'呢？这里很美，但是...我在其中的定位是什么？我这个德国母亲和爱沙尼亚父亲的女儿应该属于哪里？\"\n\n蒂莫菲把手放在伴侣的肩膀上。\"俄罗斯的文化就是我们。我们是她的奇迹，她的历史，她的传统。她是哥萨克、鞑靼人、俄罗斯人、车臣人、白俄罗斯人、布里亚特人、卡尔梅克人...甚至还有日耳曼人。她是我们鞋子上的泥浆和我们留下的废墟。她是冰雪、森林和泥泞，教堂和宫殿，冰冻的海洋和积雪的平原，蚊蝇满布的苔原和风沙弥漫的沙漠。她是勇敢和知识，力量和同情。她流淌着，像顿河一样平静，又像西伯利亚的冬天一样严酷。她与我们同在，却是我们安家立命的土地。\"\n\n蒂莫菲将她的双手握在自己手中，拉她靠近。在海湾的对岸，一艘披着猩红帆的斯坦达特号护卫舰平稳地穿越涅瓦河。\"俄罗斯是人民所相信的一切。没有你，没有像你这样的人，对我来说，俄罗斯毫无意义。\""
 NOV_postwar.54.a:0 "因此，文化和帝国崩溃，为新的形态腾出空间。"
 NOV_postwar.55.t:0 "莼鲈之思"
 NOV_postwar.55.desc:0 "“桑德拉，嘿，桑德拉，醒醒！”\n\n当她的父亲轻轻摇晃她的肩膀时，她醒了过来。\n\n“看！我们到了！”\n\n她感觉自己陷入沉睡还是一分钟前的事；从车窗外看去，她可以看到一栋大楼上面画着一个非常熟悉的符号。\n\n巨大的钩形十字，和她在伏尔加，她的家看到的一样。\n\n她在那里生活了一辈子；她还记得和朋友们在街上玩的游戏，以及城镇广场上举办的节日活动。\n\n当桑德拉听说她和她的家人不得不离开伏尔加时，她感到很惊讶，俄罗斯人并没有多么残酷的对待他们，但她一生都生活在那里，那里是她的一部分。\n\n这感觉就像她留下了自己的一部分。\n\n桑德拉感到困惑；她的父母告诉她德国也是她的家，尽管她出生在伏尔加。\n\n从那些灰色的建筑和在街上游行的灰衣人来看，她没有一点家的感觉。\n\n桑德拉向后靠了靠，闭上了眼睛；她希望她对家的记忆能留下来。"
 NOV_postwar.55.a:0 "前方的路很孤独。"
 NOV_postwar.56.t:0 "看向未来"
 NOV_postwar.56.desc:0 "阿列克谢在帐篷外听到了一片喧闹声，于是醒了过来。他探出头去看，发现一大群人聚集在一个新立起的布告板前。一个熟悉的声音从人群中传来：“阿列克谢！我有件事要给你看！”\n\n这个年轻人勉强睁开了双眼。在裸露的土地上铺了几张破烂的布当床，远不能算是真正的床，但他知道不该抱怨。临时居住地的生活已经比德国统治下的生活要好得多了。\n\n当他的眼睛终于睁开时，他的朋友奥列格正拿着一张纸，手腕垂在他的面前。“我先看到了。”奥列格说。“这是一套未来职业道路的发展计划。”\n\n阿列克谢用瞌睡的声音念出了纸上的内容。“计算机科学？教授新的标准化计算机编程课程，将俄罗斯转变为全球科技产业中心。通过编程，你可以创造未来的程序。由新千年计划联合……微软赞助？”阿列克谢抬起头。“没听说过他们。”\n\n“我也没听说过。但这肯定比在混凝土厂里操劳要好。”\n\n阿列克谢摇了摇头。“我不知道。你知道我没上过学，这个好像很复杂……”\n\n奥列格狠狠地打了他一巴掌。“你这个蠢货！难道你看不出来，这比学校还要好！这是我们能成就一番事业的机会。就像舒克申总统说的一样——未来掌握在我们手中！”\n\n“如果你错了呢？”"
 NOV_postwar.56.a:0 "“安全起见，从来没有人发过财。现在来吧，职业办公室已经开放了！”"
 NOV_postwar.57.t:0 "心脏再次跳动"
 NOV_postwar.57.desc:0 "诺维科夫元帅环顾重建后的红场。经过数周的重建，强大的克里姆林宫及其内部一切已经恢复如初，整个城市也如此。当亚历山大第一次来到莫斯科时，那里是一片废墟，满目疮痍的建筑和农民，都覆盖着灰尘和灰烬。克里姆林宫本身几乎快要倒塌了。有一段时间，诺维科夫相信这座城市永远无法重建。然而，当他环顾充满生机的克里姆林宫，本地的莫斯科人在大门前摆姿势拍照时，他对于自己的错误感到万分高兴。\n\n当然，莫斯科只是联邦重建努力的第一步。西部俄罗斯的许多伟大城市，包括斯摩棱斯克、特维尔、图拉、梁赞、沃洛涅日等等，仍在艰难地从几十年的破坏中恢复过来。在他的指挥下，有些人认为试图恢复西部俄罗斯所剩下的东西是徒劳无功的。他们认为，摧毁这些俄罗斯的成就，从头开始重建更容易。\n\n也许以前，诺维科夫会同意这种观点。但在看到他们在莫斯科所取得的成就之后，他不禁对这个想法嗤之以鼻。如果伟大的莫斯科都能够重现昔日的荣光，那么整个西部俄罗斯也可以轻松做到！\n\n西部俄罗斯将再次迎来它的黄金时代，他想。很快，过去的辉煌记忆将会重现当下。几十年的恐怖将在一瞬间被抹去，黄金的黎明将在西方升起！\n\n诺维科夫笑了笑，抬头看着圣瓦西里大教堂的尖顶。他何时变得如此理想主义了呢？也许是受到了舒克申的影响。"
 NOV_postwar.57.a:0 "或者，也许，他终于长大到不能玩世不恭了。"
 NOV_postwar.63.t:0 "新的开始"
 NOV_postwar.63.desc:0 "德米特里瘫倒在客厅的椅子上。老实说，终于摆脱德国人的兴奋已经消退了。而且，老实说，他很沮丧。他觉得没用。战争期间，他在游击队和逼近的联邦军之间进行通信。之后，他作为翻译帮助重建，但很快就枯竭了。现在，他大部分时间都坐在家里，边看曲棍球边喝酒。他的肚子变得很大，左手边堆积了一堆香烟。\n\n在第三个进球附近——他并没有注意——一声雷鸣般的敲门声震动了他的前门。 “德米特里！”谢尔盖·伊万诺维奇的声音响起：“我有一个为我们两个人准备的提议！”\n\n德米特里翻了个白眼，打开了门。 “进来吧，谢尔盖。但是请不要脱鞋。”\n\n“别着急，就一分钟。”谢尔盖走进入口通道，手里拿着帽子。 “我和一个大政党的当地官员谈过。他们不像俄罗斯农工党或舒克申那么受欢迎，但他们有真正的潜力。你仍然会波兰语，对吧？”\n\n“肯定比我的乌兹别克语好。怎么了？”\n\n“他们正在寻找一名翻译来帮助他们用少数民族语言印刷传单。你知道，乌拉尔斯克有很多侨民，更不用说萨马拉和伏尔加格勒了。”\n\n德米特里哼了一声，想了一会儿。 “我好多年没去过伏尔加格勒了。这是什么党派？”\n\n“这是一个非常有趣的团体。左倾得足以留住一些苏联时代的老人，但又不太左倾到让那些瞧不起旧联盟的人感到气馁。我们将以推动政治和职场民主、扩大福利、增强工会力量以及大规模扩张主权财富基金以实现对大型企业的国有化为竞选口号。我们将从底层开始使国家实现民主化！”\n\n“谢尔盖，这个党他妈的叫什么名字？”\n\n“俄罗斯民主社会党。”\n\n德米特里吸了一口烟，然后把它扔出了门。它在光秃秃的混凝土人行道上烧毁了。 “我需要离开这该死的房子。好吧，算我一个。我们什么时候开始？”"
 NOV_postwar.63.a:0 "“现在就开始，老朋友。”"
 NOV_postwar.65.t:0 "商店里的一天"
 NOV_postwar.65.desc:0 "安娜在雪地里艰难地走到新建成的市场。上一个市场在战斗中被炸毁后，她所在的亚拉斯洛夫区被指定为优先重建区。因此，当新市场开门大吉时，她并不感到惊讶。令她惊讶的是，喧闹的旧市场被一个真正的建筑所取代。它的外墙装饰着联邦国旗颜色的明亮灯光，她一跨进门槛，就立即感觉到热量席卷了全身。在体验了连在自己家都很难获得的温暖之后，她看了看过道两边货架上的食品和货物。她一时不知自己是该对这些商品的质量还是这些商品的价格感到震惊。\n\n她的清单上首先是鱼子酱，其次是格瓦斯，然后是其他无数的食品。结账时她发现，这些商品的总价格要比以前便宜得多。当她掏出现金付账时，收银台后面穿着西比尔制服的女士开始了交谈。\n\n“小姐，我有义务让你知道，我们正在招人，我们更有经验的员工经常从不同的地方调来帮助启动整个解放区的各种商店。”\n\n安娜思索着，如果能在冬天在一个温暖的地方待着就好了，而且工资也意味着她的家庭开支不需要依赖她父母来维持。“我很愿意。你希望我在什么时候来面试，甚至是培训？”\n\n安娜写下了她的名字和她能来的时间，然后以销售助理的身份离开了西比尔商店。"
 NOV_postwar.65.a:0 "也许她现在可以给她的姐妹们买些好东西了。"
 NOV_postwar.66.t:0 "伏尔加河奇迹"
 NOV_postwar.66.desc:0 "在一个经常被认为处于极度贫困中的国家，俄罗斯开始经历真正的命运转变。在许多经济学家称呼的“伏尔加河奇迹”中，俄罗斯经济因诸多因素而开始蓬勃发展。一方面，俄罗斯企业重新获得了进入俄罗斯核心地区的机会，这意味着更多的客户和扩张的机会。另一方面，俄罗斯联邦在战后将为武装部队储备的数十亿美元投入经济增长，以发展和鼓励新老工业、推动大量基础设施建设。一个表明俄罗斯正决心发展成为真正的超级大国的具体例子是其对先进技术的投资。\n\n这个例子就是新千禧年计划，该计划旨在将俄罗斯联邦变成电子领域发展的巨头。目前，该计划旨在开发标准化系统，到 1980年，在计算机科学发展的各个方面教授多达100万人。新千禧年只是计划中的一个，而其他计划针对汽车、重型机械和消费品。这些计划与积极的基础设施发展计划相结合，使货物运输比欧亚历史上的其他任何时期都更容易。\n\n除了新兴产业之外，俄罗斯联邦还采取了积极的措施，将重点放在全球经济缺乏的发展中经济领域，而不是广泛发展所有部门的产业。使这一政策成为可能的原因是舒克申总统领导下的俄罗斯政府、俄罗斯主要公司和快速增长的“中产阶级”之间的协调。经济部引用这一点的原因是俄罗斯现在处于关键位置有足够的资源来发展重要的经济部门，并与共荣圈和OFN保持友好的关系。此外，随着德国的失败，欧洲其他地区急于开始与俄罗斯巨人进行贸易并摆脱德国的影响。这一状态的结果是，一个能够参与世界大多数主要市场，从每个市场中汲取精华，并利用这些知识和机会建立一种超越大多数俄罗斯人十年前能想到的最好的生活状态的强大力量已在东方崛起。"
 NOV_postwar.66.a:0 "无论未来如何，都将是光明的。"
 NOV_postwar.67.t:0 "祖国"
 NOV_postwar.67.desc:0 "在深夜里，斯摩棱斯克附近一家伐木厂的工人们分享故事、喝酒，并庆祝他们新获得的自由。伐木厂建于德国占领时期，通常是一个安静、寒冷的地方，直到战争期间第一批俄罗斯军队扫荡了这座建筑。首先改变的是国旗，现在联邦的明亮、欢快的颜色装饰着坐在外面的杆子。现在，工人们不仅不怕看他们头顶飘扬着的旗帜，也不怕看他们头上悬挂的星星。\n\n在贝洛戈德的夏日阳光下，一群年轻的学生拿着他们的津贴来到一个新建成的商业区。他们想买几件新衣服，甚至一些化妆品。在欢笑和庆祝退去后，他们才意识到他们花了太多钱，第二天有几个人不得不给家里打电话要生活费。尽管要给家里打电话，但没有人担心他们是否能再次见到家人。\n\n在莫斯科第一座重建的犹太教堂内，举行了公开的成人礼，一年前里面的人都不会相信这种情况会再次发生。那一刻，他们不仅忘记了对整个文化被消灭的恐惧，而且第一次对未来感到高兴。在随后的泪水和笑声中，他们一直跳到深夜，知道这不过是许多夜晚中的第一个。\n\n在整个庞大的祖国，人们庆祝，跳舞，并唱着许多人认为已经失传的歌曲。在一个通常被认为是冷酷无情的地方，联邦人民在他们现在拥有的自由激情中找到了温暖。"
 NOV_postwar.67.a:0 "自由的火炬照亮着祖国大地。"
 NOV_postwar.68.t:0 "放眼世界"
 NOV_postwar.68.desc:0 "“给你，斯捷潘，一定要在明天之前完成这个任务！”\n\n斯捷潘从他的办公桌上抬起头来，嘴里还存留着咖啡的味道。他的一个同事把一叠文件放在他的电脑后面，他礼貌地对斯捷潘点了点头。“别担心，你会喜欢这个的。”\n\n斯捷潘微笑着伸手去拿他的咖啡杯，拿起第一份文件。他惊讶地差点把杯子摔了。“波兰家乡军？抵抗组织的联系人？武器运输？”\n\n斯捷潘无法相信他所看到的内容，似乎俄罗斯有更大的野心。解放波兰似乎是一个不可能完成的任务，但德国的任何失败最终都会成为自由世界的胜利。他从书堆里抓起另一份文件，打开了它。\n\n马家军？他以为他们是在日本人的控制之下，但看来情况并非如此，另一个中华民国？这注定是个麻烦，但中国和俄罗斯如果有合适的人，比如斯捷潘的领导，都可以走得更远。\n\n他继续阅读更多的文件，蒙古起义与和乌兰巴托的游牧民合作，他们会很乐意接受俄罗斯的帮助。斯捷潘确实想知道共荣圈对此会有什么反应，但考虑到联邦对德国显示了其强大的实力，他们可能会退缩。\n\n亚美尼亚？这个名字他已经很久没有听说过了，这个国家甚至可能比俄罗斯遭受的损失更大。\n\n还有一些叛乱团体的火仍在燃烧，俄罗斯会提供他们需要的燃料。\n\n当然，土耳其也不会介意。\n\n斯捷潘看着这堆东西，笑了，他知道一个人治愈了俄罗斯民族，现在瓦西里·舒克申将治愈其他国家。\n\n他在自己的杯子壁上抿了一口，才发现自己的杯子里空空如也。"
 NOV_postwar.68.a:0 "这一天将会非常漫长。"
 NOV_postwar.69.t:0 "俄罗斯之春"
 NOV_postwar.69.desc:0 "东方的地平线上迎来了黎明，天空中满是淡粉色的迷人霞光。瓦列里刚刚醒来，他把自己的那件黑大衣裹得更紧，来驱散早晨的寒意。他那双破旧的鞋子在人行道上笨拙地鼓动着，他能感觉到寒冷已经渗入皮革。然而，他只是笑了笑。他怎么能不笑呢？空气中弥漫着熟悉的甜美花香，新鲜的绿叶散发着宝石般的光芒。俄罗斯的万物又一次盛开了，瓦列里欣喜若狂，因为他活到了现在。\n\n不久前，任何结束占领的梦想似乎都是遥远而脆弱的。瓦列里现在所品尝到的生活乐趣，曾被锁在铁制的货运列车里，被驱逐到大日耳曼国的黑色心脏。当联邦展开翅膀，越过帝国的边界时，瓦列里和其他许多人在黑暗中畏缩不前，不敢加入他们的东方兄弟，因为害怕德国人在再次击败俄罗斯军队后对俄罗斯联邦的报复。\n\n然而，联邦的失败并没有到来。在整个俄罗斯西部，类似的狂喜场面像花儿一样爆发出来。从普斯科夫的森林到奥廖尔的宽阔平原，至少有成千上万个像他这样的“瓦列里”跃跃欲试，协助重建。\n\n瓦列里在提起一桶湿混凝土时感到他的老关节在吱吱作响。当他匆匆忙忙地去帮忙时，他感到自己的脚被轻微地拖住了。但是，当他和其他十二名俄罗斯人拉着绳子，把斯摩棱斯克市政厅上方的纳粹标志扯下来时，他感到了久违的情感的回归：自豪。这条漫漫长路，也许他无法看着祖国走完，但他知道，有朝一日，俄罗斯的光芒终会盖过夜空中的繁星。"
 NOV_postwar.69.a:0 "墓地将重新开满鲜花。"
 NOV_postwar.70.t:0 "死从天降"
 NOV_postwar.70.desc:0 "安娜在天空中飞翔，享受着米格-27飞机在云层中翱翔时发出的轻柔嗡嗡声。安娜喜欢呆在这里。它很平静。天空中没有人打扰她，没有地面上的混沌，也没有水面上的波澜。但她今天在天空中不是为了享乐。与德国的战争可能已经结束，但仍留在俄罗斯联邦境内的德国人似乎仍在继续抵抗。\n\n“他们为什么要继续战斗？难道他们看不出自己已经输了吗？”安娜一边问自己，一边下降，在接近目标时飞得很低。\n\n自称“狼人游击队”的纳粹恐怖组织占领了一个农场，杀死了农场主，并将这里变成了一个堡垒。她的任务是轰炸这个地方，削弱防御，以便伊万诺夫和小伙子们能够收拾残局。几分钟后，农场终于出现在眼前。她拨动了一个开关，在激活通讯器的同时让自己平静下来。\n\n“伊万诺夫上校，我是安娜上尉。我现在正在接近。告诉孩子们把他们的玩具准备好。”\n\n“收到，上尉。准备好了就行动。”德米特里·伊万诺夫回答。\n\n安娜向农场急速俯冲，按下了投弹开关。当她看着火焰升上天空时，她侧过身子。农舍和谷仓被撕成了碎片。当她再次飞上天空时，她叹了口气。为什么德国人要强迫他们这样做？她再次启动通讯器，与地面上的突击队联系。"
 NOV_postwar.70.a:0 "“击中目标，伊万诺夫上校。狩猎愉快。”"
 NOV_postwar.71.t:0 "这不是演习"
 NOV_postwar.71.desc:0 "舒克申总统坐在收音机前，汗水从他的额头上滴落下来。他说道：“我简直不敢相信我要这么做。我们为之奋斗的一切，我们所作出的牺牲。难道真的变成了这个样子吗？”\n\n阿梅特汗·苏丹轻轻地把手放在他朋友的肩膀上说：“瓦西里·马卡罗维奇，我理解你的忧虑。在任何重要时刻之前，我们都感到恐惧。期待往往比现实更糟糕。请花点时间让你的紧张情绪平静下来。”\n\n舒克申点了点头，让他的手放在凉爽的松木桌上。在他们身后，一个时钟滴答着倒计时。滴答，滴答。一分钟过去了，然后是两分钟。最终，舒克申拿起收音机。他开始说道：“俄罗斯联邦的公民们，我是你们的总统。由于当前紧急情况的严重性，我不得不直接向你们发表讲话。莫斯科地区的局势已经到了崩溃的边缘。第三帝国武装了解放区域内的叛乱分子和恐怖组织。他们正在袭击平民，抢劫、强奸、掠夺，破坏我们为了保护而奋斗的一切。”\n\n舒克申喘了口气，擦掉额头上的汗水。他说道：“这次紧急情况的严重性无法言过其实。我不想引起恐慌或惊吓你们，但我必须坦率。这些‘狼人’对莫斯科地区的和平与繁荣构成了存在上的威胁。”他再次深吸一口气，决心改变俄罗斯联邦的历史。他说道：\n\n“从今天起，经联邦议会同意，我正式宣布在莫斯科地区实行戒严。这种状态将持续到这些恐怖分子被根除，法律和秩序被恢复为止。我向你们保证，”\n\n他说道，“这是一项临时措施，以击败留在我们领土上的反俄分子。这种状态不会扩展到莫斯科地区以外，也不会永久保持。我们只是要求你们信任和合作，直到紧急情况结束。我们是来给你们自由的--让我们一起为它而努力。谢谢你们。”\n\n舒克申总统用颤抖的手将接收器放回了支架。也许是他一生中最重要的一次广播结束了。\n\n“做得好，瓦西里。”阿梅特·汗说道。“现在我们只需要在余波中生存。”\n\n“不，”舒克申回应道。“我们需要祈祷没有暴君利用这个先例来破坏联邦的民主。”"
 NOV_postwar.71.a:0 "“公民们，这只是一个临时的解决方案，请不要大声喧哗…”"
 NOV_postwar.73.t:0 "黄金史"
 NOV_postwar.73.desc:0 "“先生们，感谢你们加入我的行列。请在你们右边的蓝色文件夹中找到你们的简报资料，”格奥尔基·兰格马克将军说道。\n\n凤凰控股公司的散发着杏仁香气的会议室里坐满了各种类型的商人。企业家、经理和西罗维基党员在红木会议桌前肩并肩地坐着--但不是所有的人都是凤凰的雇员。这其中有亚历山大·贝洛夫，凤凰步兵装备公司的首席执行官。坐在一旁的是凤凰拖拉机和机械供应公司的丹尼斯卡·巴拉丁，他脸上挂着愚蠢的笑容。桌子对面坐着泰坦研发公司的首席运营官罗曼·列维茨基，以及西比尔社区贷款公司的首席运营官谢尔盖·帕夫利舍夫。他们每个人都只是机器上的一个齿轮。但他们的存在代表了更多的东西：巨型企业在利润这一关键问题上的一致性。\n\n“如果你翻到第三页，我们就可以开始讨论凤凰采掘公司的调查结果，”兰格马克说道。“采掘公司的勘探人员得出的数据表明，整个蒙古境内埋藏有大量的金、铀、石油和萤石矿藏。由于蒙疆政府的无能，以及社会主义民兵和游牧部落成员的大规模抵抗，这些项目几乎普遍没有被开发。”\n\n“我怀疑蒙古人不会让我们大摇大摆的走进他们的国境并带走它们，”贝洛夫说道。“是的，你说的没错。”兰格马克说道。“在第八页，我们已经详细说明了拟议中的蒙古共和国的安全行动的可能长期成本。”列维茨基皱起了眉头。“拟议中的蒙古共和国？我没有听说过这件事。”他看样子很疑惑。\n\n“鉴于联邦不打算与共荣圈打交道，凤凰已经制定了一项战略，以进入蒙古市场，并通过它进入广泛的东亚消费群体，”兰格马克说道。“我们打算利用蒙疆地区的不稳定，增强反叛的自由主义分子以及不安分的部落群体的力量。通过武装和供应反对派，联邦将发现自己处于最佳的谈判地位，在一个与邻国隔绝的新生国家获得有利的贸易协定。”“那你打算如何说服舒克申总统和他在联邦委员会的走狗？”列维茨基问道。兰格马克只是笑了笑。“舒克申有一颗火热的心。你没听说过他解放亚美尼亚和波兰的计划吗？几乎不需要我们说服，他就会乐意的为受压迫的少数民族带来民主和自由。”"
 NOV_postwar.73.a:0 "现在，这里是提议的开采地点···"
 NOV_postwar.74.t:0 "富有成效的商讨工作"
 NOV_postwar.74.desc:0 "在乌兰巴托的街头，一辆汽车正在燃烧。几十个年轻人，不管是部落居民还是城市居民，都在用球棒、轮胎铁棍和垃圾--他们能得到的任何东西--来打这匹铁马。他们一生都生活在可怕的贫困中。他们的许多父母在起义中被杀。更多的人看着日本人和中国人在泛亚梦想的战利品上发财，而他们的国家，他们的家园，却只剩下了荒芜。他们的愤怒就像倒入茶杯的海啸一样溢出来。\n\n纳察金·巴嘎班迪从附近一栋办公楼的窗口，看着他的同龄人释放他们的愤怒。叛乱期间，他也只是个孩子。在人民革命委员会和蒙疆的暴徒之间无休止的战斗中，他的家乡扎夫汗被烧成了焦土。但与他在街上的兄弟姐妹们不同，他一直保持着愤怒。它在他身边等待着，随时准备释放而出。\n\n他的朋友恩赫赛汗说道：“抗议活动正在蔓延。我认为政府控制不了乌兰巴托多久了。”\n\n“我同意。问题是，当亲王的部队撤退时，谁将控制这个城市？”纳察金道。“我们都知道布尔什维克在阴影中等待，引诱我们的人民走向毁灭。但我不会允许我的人民成为煽动者的牺牲品。”纳察金从窗口转过身来，面对敏赛哈尼和十几个蒙古族小政治家和企业家。每个人都在等待，仔细地打量着他。这个年轻人会是他们得救的关键吗？还是说他是另一个无用的奉承者？\n\n“蒙古正处于危机之中，”纳察金说道。“一方面，有那些向东京屈服的专制者和懦夫。另一方面，我们作为蒙古自由的最大力量成为了一种失败意识形态的遗迹。我们需要的是第三条道路，一种既能吸引共产主义者，又能保持我们在摆脱这一困境后所需要的具有竞争力的经济和民主体制的东西。”\n\n“我们的救赎不会在各种保守主义和专制主义中找到，但这并不意味着社会主义已经结束——它只会以一种新的、协作的形式出现，前提是我们能够赢得它。”"
 NOV_postwar.74.a:0 "民主、善治和公民社会。"
 NOV_postwar.75.t:0 "忽里勒台大会"
 NOV_postwar.75.desc:0 "在图尔河畔，远离被烟雾和灰烬笼罩的城市，一个蓝色的蒙古包正欢迎着许许多多的游客。\n\n“欢迎，托尔古特的兄弟，”甘巴特尔·巴图汗说道。“哦，这是对你的老叔叔巴赛汗的什么问候？”甘巴特尔·巴赛汗问道。\n\n“为什么，我记得你还是小巴图汗的时候，总是搞恶作剧！来，抱抱我！”老人用饱经风霜的褐色手臂紧紧抱住他的侄子，脸上露出了一丝微笑。\n\n“哦，但我不再那么年轻了！”巴塞汗感叹道。“有了这样的肌肉，女孩们会在你身上爬来爬去的！”“叔叔，现在不行！”巴图汗笑着说。“我们必须专注于更重要的事情。来，进来吧。”巴图汗和巴赛汗一起走进蒙古包。里面有七个饱经风霜的橡木人坐在那里，等待着他们的东道主。\n\n“巴楚汗叔叔，这些是我们家的客人。西伦·吉奥罗·阿扬，达乌尔族人。阿尔坦格尔·蒙克巴特，来自西北，达·巴特贾尔·提米钦，康苏人。甘祖里格·乌拉干，东南的。还有他的长子乌拉干·巴特尔、楚伦和艾森。”巴察汗叔叔只是点了点头。“加上我和巴图汗，我们共有九个。一个吉祥的数字，侄儿。”“我们需要任何能得到的好运，”甘巴特尔·巴图汗说道。\n\n“我已经通过信件和你们每个人谈过了。我们都知道，徳穆楚克栋鲁普亲王的继承人正在失败。问题是，我们该怎么做？我家里的一些人要求我支持政府。其他人要求我支持共产党。但作为我父亲的家主，选择权落在我身上。”老人们齐齐点头。"
 NOV_postwar.75.a:0 "“我们将听从你的意见。”"
 NOV_postwar.76.t:0 "团结一致，要么彻底不团结。"
 NOV_postwar.76.desc:0 "“俄罗斯总统已经和我联系过了。他们想成立一个新的蒙古共和国，在那里没有共产党员和独裁者，”巴图汗说道。一阵异议的杂音从蒙古包的一面墙传到另一面墙。“外国人总是想剥削我们，不管他们是来自中原还是北方，”阿扬说。“我同意，”提米辛说。“而且他们会偏袒城市居民。”\n\n“我赞成你们俩的意见，”巴图汗说。“但今天只有两方：支持日本人的，和反对日本人的。我们都是反对日本人的，不是吗？”\n\n“如果我们是为了争夺菊花宝座，我们就不会在这了，”蒙克巴特说。“我以前和俄国人打过交道。有几个人对我们带着敬意。”\n\n“我提出一个计划。我们与城市居民合作，逼出日本的走狗。而当俄国人采取行动建立他们的傀儡政权时，我们将利用我们对农村的控制来要求他们保护我们的人民，”巴图汗说道。\n\n“结束强制搬迁？”阿扬问道。“至少，”巴图汗说。\"如果我们作为成吉思汗的子孙战斗，那么我们可以要求的比这还要多。\"\n\n“而假设他们拒绝了我们。我们要和我们的同胞作战吗？即使他们是城市居民，我也不想流蒙古人的血。”提米钦说道。\n\n“我的侄子也不想，”巴特尔汗叔叔说。“但是，当成吉思汗将我们的部落联合成第一个伟大的帝国时，他不是杀了王汗和他的仆人吗？当然，徳穆楚克栋鲁普的仆人所杀害的蒙古人比俄罗斯人和日本人想象中的还要多。我们的责任是对我们的家庭和亲属负责。如果这意味着我们必须挥舞刀剑，那就这样吧。”\n\n“谢谢你，叔叔，”巴图汗说道。“这也是我的立场。但我不相信事情会发展到那一步。我相信仅凭我们的力量就能说服俄国人接受我们的要求。他们不会想在与德国人的战争结束后这么快就与一个迅捷的敌人打一场游击战。”\n\n七位客人犹豫了一下。但他们一个接一个地站起来，向甘巴特尔·巴图汗表示支持。"
 NOV_postwar.76.a:0 "黑色旗帜再次扬起。"
 NOV_postwar.77.t:0 "今日头条"
 NOV_postwar.77.desc:0 "走进空荡荡的店铺，年轻人的目光从他原本打算买的香烟上移开，转而落在报刊架上，那里新鲜出炉的最新报纸已经到货。他自言自语地哼着曲子，靠近一些以便更好地观察。\n\n\"[RUS.GetLeader]将数千名俄罗斯人送上死亡的西藏山脉——拯救我们的儿子！\"\"舒克申支持疯子！\"\"总统的妄想及为何你应该投票支持反对派！\"\n\n那个年轻人嗤之以鼻，抓起报纸，在付钱买香烟时浏览了一下封面。他一开始就知道！[RUS.GetLeader]，那个卑鄙的家伙，毕竟不是天使！\"先生，还要点别的吗？\"收银员在那个人付钱买香烟后问道。\"啊，是的，\"年轻人回答道，把报纸放在柜台上说道：\"请给我这个。\"\n\n\"一共15卢布。\"女人说。他把卢布放在柜台上，迅速离开，坐在一张长椅上，然后从刚买的烟盒里拿出一支烟，插在嘴里。\n\n报纸像一个担心的母亲，极度害怕她的儿子会在西藏山脉中丧生。报纸写道，俄罗斯人无法承受中国的崎岖地形，俄罗斯联邦对干预的后勤考虑不足势必会导致灾难的发生。他的愤怒升腾，他站起来，紧紧合上了报纸。总统做了一个可怕的决定！那时他意识到他必须做些什么。\n\n这是一个民主国家。他不必为[RUS.GetRulingParty]投票，他也不会。他发誓，在下一次选举中，他将尽一切努力将这位无能的总统赶下台。他不想被送去西藏送死！\n\n他从椅子上站起来，把烟丢进垃圾箱，低声嘟囔着去寻找另一个可以支持的政党。只有那些真正能代表俄罗斯青年的政党才能得到他的选票。"
 NOV_postwar.77.a:0 "[RUS.GetLeader]声誉大为受损。"
 NOV_postwar.78.t:0 "克拉斯诺达尔的街道"
 NOV_postwar.78.desc:0 "在曾经是高加索专员辖区的解放区，又是一个阳光明媚的下午。米哈伊尔·巴加诺夫将军决定花一天的时间城中心的街道上溜达。他的心在看到高加索人如何与彼此交流时感到痛苦。在家乡，街道上总是充满了音乐和热烈的交谈。而克拉斯诺达尔的人们似乎彼此疏远。他们把自己孤立起来，以免引起别人的注意。\n\n德国人到底把这些人折磨得多惨？联邦是否能胜任将希望带回这些破碎的土地的任务？\n\n他能吗？\n\n当总统亲自要求他领导新的高加索政府时，巴加诺夫认为他可以胜任这项任务。联邦已经成功地把地球上最大的国家统一，重建一个较小的地区会有多难？在看到前德属高加索的土地是多么的破碎之后，他意识到他对这里情况的了解是多么的少。\n\n高加索并不像俄罗斯。田地、城镇和城市并不是唯一需要修复的东西。人民需要治愈，精神需要修补，社会障碍需要打破，文化需要重振。德国人已经统治了这么久，修复会是一场灾难吗？\n\n巴加诺夫摇了摇头，自言自语地叹了口气。所有人都曾认为统一俄罗斯是不可能的，然而俄罗斯现在却屹立于大地之上。每个人都认为德国会再次轻松获胜，然而俄罗斯却把他们打的一败涂地。这位年迈的将军看着周围的人，眼神中充满了坚定。对联邦来说，没有什么挑战是不可通过的。他将帮助这些人，无论要付出多少代价。"
 NOV_postwar.78.a:0 "没有什么人是无法帮助的。"
 NOV_postwar.79.t:0 "格鲁吉亚人与阿塞拜疆人"
 NOV_postwar.79.desc:0 "在曾经被德国人称为黑森施塔特的格鲁吉亚小镇马茨米，有两位老人坐在一个老式门廊前。他们看着来自各种地方的工人匆匆忙忙。其中有俄罗斯人、阿塞拜疆人、格鲁吉亚人和切尔克斯人，甚至不久前还有一个鞑靼人经过。\n\n“自从苏联人撤出这里后，我还没在街上看到过这么多活人！” 乔治对他的老朋友优素福感叹道。他是从阿塞拜疆边境那边的马哈马尔来的。\n\n“太阳打西边出来了，这些俄罗斯人竟然良心发现了要来帮我们，我还以为这些共产党跟德国人没什么两样呢，看到外国人关心我们的感觉真是奇怪。”优素福说道。\n\n“不，不，俄罗斯人不是共产主义者，至少现在不是了！他们现在更像美国人。为自由而战！为民主而战！为了所有俄罗斯人的解放！”乔治有力地强调了俄罗斯总统的口头禅，赢得了优素福的一声冷笑。\n\n“啊，这就对了！但我们不是俄罗斯人，我的朋友。你怎么知道我们能信任这些人？如果他们只是在试图让我们放下戒备心，好温水煮青蛙似的让我们不知不觉间再次被他们奴役呢？”阿塞拜疆人问道。\n\n“我不太确定，我的朋友。我想这次我们只能相信俄国人了。毕竟，不管怎么说，俄罗斯人接下来无论想做什么事都肯定比党卫军要强上一百万倍。”乔治说道。在远处，一个满脸雀斑的年轻女孩面带微笑地挥舞着俄罗斯三色旗。\n\n优素福坐回椅子上，思考着他朋友的话。"
 NOV_postwar.79.a:0 "“确实，他们不会比德国人更缺德。”"
 NOV_postwar.80.t:0 "黑熊"
 NOV_postwar.80.desc:0 "“你能相信我们又回到了同一个该死的油田吗？” 优素福说。\n\n侯赛因只是耸了耸肩。“我妻子需要吃饭，”他说。“我等不了联邦慢吞吞的重建了。”\n\n“太糟糕了，重建工作咋就这么慢，”优素福说。“穆罕默德告诉我，他们雇了几个人去重建旧的文法学校。”\n\n“有多少人？”“就三个。”“操。”\n\n两人一起走到油田的行政办公室。砾石在脚下嘎嘎作响，远处的机器轰鸣。办公室旁边骄傲的旗杆上不再飘扬纳粹的旗帜，雕刻的万字符已经从入口处上方的支架上被扯下。但地基和灰色的石墙自胡赛因用枪指着它们的那天起就没有改变过。\n\n两人走进办公室，把工作靴上的泥土踩得砰砰响。在大楼的中庭，一位年轻的俄罗斯妇女坐在一条横幅下面打字，横幅上面写着“欢迎，凤凰采掘公司的新员工！”\n\n侯赛因走到桌子前，清了清嗓子。“对不起，小姐？我的名字是侯赛因·阿巴索夫。我和我的朋友在这里开始我们的第一班工作。”\n\n那位年轻女子转过身来，对着这两人笑了笑。“你好！我的名字叫叶卡捷琳娜·波波娃。阿巴索夫，很高兴认识你。你有员工证吗？”\n\n优素福咒骂着。“她不会说他妈的阿塞拜疆语，”“凤凰那帮子操蛋玩意儿给我们送来了一个文盲。”\n\n侯赛因只是吸了一口气。“小姐，我们听不懂你的话。你会说土耳其语吗？”\n\n她摇了摇头，表示不会。\n\n“阿拉伯语？”她又摇了摇头。\n\n他叹了口气。“你会说德语吗？”\n\n她笑着点了点头。“会的，会的！我是叶卡捷琳娜·波波娃，我可以为你做些什么？”"
 NOV_postwar.80.a:0 "欢迎来到高加索。"
 NOV_postwar.81.t:0 "山中秃鹫"
 NOV_postwar.81.desc:0 "两个入口处都有警卫值守，他们都拿着全自动步枪。从里面的高度戒备和军官数量来看，一个中央指挥中心位于主干道附近。停车位上有两辆装甲运兵车，进入时要注意这些。有一个地堡门，戒备森严。那肯定是关押叛军的地方。\n\n德米特里放下望远镜，在记事本上记下可观察到的细节，然后揉揉眼睛，擦擦额头上的汗水。他不习惯这里的高温，但他会处理好的。这名特工靠着他栖息地后面的岩石坐了下来，为漫长的等待安顿好自己。\n\n土耳其鬼子在伏击了一些亚美尼亚叛军的行动基地后俘虏了他们。他们感兴趣的目标是古尔根·达利巴塔扬。他必须潜入大院，在不被土耳其军队看到的情况下把叛军，特别是古尔根救出来。看起来很简单，但与狼人游击队不同的是，这些土耳其灰狼装备精良，协调性强。与在国内时不同，俄罗斯的怪兽没有俄罗斯的资源可供支配。如果他要成功地重建亚美尼亚抵抗运动的领导层，就必须小心翼翼。\n\n德米特里叹了口气，至少在这次任务中，他不是孤身一人。抵抗军给了他一个向导，让他陪同执行任务。他对离开基地充满了热情。据其他抵抗军成员说，他是那种喜欢探索的人，留在原地对他没有好处。他可以充当翻译，因为德米特里不懂一丁点亚美尼亚语，而他是目前亚美尼亚最好的将军之一。有一个翻译会使在亚美尼亚的工作更加顺利。说到亚美尼亚，德米特里开始怀疑他的向导到底跑到哪里去了？"
 NOV_postwar.81.a:0 "又是一天的工作"
 NOV_postwar.82.t:0 "一切开始的地方"
 NOV_postwar.82.desc:0 "当联邦来到新波兰时，波兰人欣然接受了成为自治共和国的提议。对于共和国的波兰人来说，许多人觉得只要他们的文化自治得到保证，就没有什么可抱怨的，尤其是在经历了多年的无政府状态之后。然后舒克申开始向新波兰共和国投放大量的发展资金，因此到第二次西俄战争开始时，该共和国充当了自治共和国的典范。当联邦西进时，哈萨克斯坦的波兰人作为示范，说服东欧各族人民协助反对德国压迫的战争。\n\n当战争向西推进时，联邦内的波兰人竭尽所能，出色地完成了任务，毕竟，谁比波兰人民更了解德国人失败的代价？当新闻报道显示前线离祖国越来越近时，波兰人民认为也许噩梦终于要结束了。最后，当联邦的军队站在他们古老的祖国的门口时，街道上充满了期待和自豪。也许联邦会解放他们的祖国，他们想道，许多人希望去探望他们的亲戚，或者去他们的老家旅行，波兰人民可以重新团聚，也许维斯瓦河畔的另一个奇迹会到来。\n\n然后德俄之间宣布停火了。\n\n与联邦其他地区和解放区不同，哈萨克斯坦的波兰人的庆祝活动相对安静。他们也同样为打败了德国人而高兴，但这并没有减轻他们的痛苦。尽管如此，联邦总统舒克申和新波兰自治共和国总统斯坦尼斯瓦夫·斯卡尔斯基一直坚持要最终将波兰从德国的压迫下解放出来。因此，联邦的波兰人回归了他们的日常生活中，在联邦内继续叙说着波兰的故事，知道有一天，解放他们祖国的机会会出现。\n\n他们不知道，这将从波兰军团被重新部署到乌克兰西部开始。"
 NOV_postwar.82.a:0 "只要还有人存留着关于她的记忆，波兰就没有灭亡。"
 NOV_postwar.83.t:0 "波兰的英勇之子"
 NOV_postwar.83.desc:0 "在第二次西俄战争期间，科瓦尔斯基在波兰军团中自豪地服役。他并不关心联邦给他所在的新波兰带来了什么样的繁荣，只关心他们会与德国人作战。科瓦尔斯基记得自己在伏尔加格勒、罗斯托夫、哈尔科夫、基辅等城市都打过仗，他的最后一战在布列斯特。尽管取得了许多胜利，但他永远都不会对矗立于新边界对面的旧波兰有什么好感。战后他仍留在波兰部队中，但他的灵魂已经离开了，他在战争期间的激情已经消失了。\n\n当一批命令要求他的部队转移到乌克兰西部时，他并没有多想。只有当他的上级命令他们不能再向外界写信或打电话时，科瓦尔斯基才开始怀疑到底发生了什么。当他们到达波兰边境附近的军事设施时，他对那些穿着相当朴素的人的数量感到惊讶。\n\n官方说法是，他们是波兰难民，试图逃离战争中的暴力，现在被困在联邦境内。非官方的说法是，他们是波兰家乡军的残余，他们将被训练和武装，以发动第二次波兰起义。当时机成熟时，他们将偷偷越过边界，造成必要的混乱，让波兰军团越过边界，以“自愿”对抗德国的威胁。\n\n科瓦尔斯基无法相信这一点。以前，俄国人似乎只是把波兰人留在身边，因为他们需要所有人来对抗德国的威胁，但这次不同。波兰要被解放了。"
 NOV_postwar.83.a:0 "第二次机会。"
 NOV_postwar.84.t:0 "你可听到人民在歌唱？"
 NOV_postwar.84.desc:0 "赫尔穆特的眼睛扫视着行程表，仔细清点每一件物品，最后却发现又少了几十件物品。\n\n“我们缺少步枪、医疗用品和手榴弹。这些东西都没有搜出来，上次检查这些物资是在战争的最后几天。”\n\n作为他的长官的那个人，和他基本是同龄人，发出了一声疲惫的叹息。“我……我想你记错了。还有，当我们能联系到柯尼斯堡的将军们时，我们会让他们知道的，这段时间以来，通讯线路一直很不稳定。” \n\n“你认为上一个营卖给他们的是口粮吗？”\n\n“不，我不认为，赫尔穆特，现在开始把我们的东西放到卡车上。我们要尽快出发去普鲁士。”\n\n在把最后几把博物馆里的老式毛瑟枪搬上卡车的时候，一群人开始聚集起来。波兰人似乎没有对他们做出任何暴力的姿态，但他们的行为与他上次在波兰时有很大不同。其一，他们的背脊站得笔直，只要他们愿意看，眼睛就会锁定德国士兵，现在他们的眼睛，不管是什么年龄，似乎都充满了激情。\n\n“司机，我们没有时间去对付那些劣等了。你能载我们离开这里吗？”\n\n坐在前座的人甚至懒得搭理他，他只是开始启动卡车，其他司机也跟着做了同样的事。三辆卡车咆哮着慢慢启动，喷出有毒的黑烟，驶出了尘土飞扬的旧仓库。\n\n当卡车开走时，赫尔穆特坐在他的“长官”对面，审视着他那垂头丧气的斑驳黑胡子。他最终鼓起勇气问道，为什么波兰人会有这样的表现。\n\n“他们不再害怕了。”"
 NOV_postwar.84.a:0 "每个帝国的最后一口气通常都是呜咽。"
 NOV_postwar.87.t:0 "劫掠"
 NOV_postwar.87.desc:0 "莫罗佐夫队长是天生的反恐精英。他有一种天生的能力，可以把恐怖分子、游击队、土匪和介于两者之间的一切都抽出来。他多年前在民粹派的叛乱中赢得了他的地位，那时联邦还只是一个城邦而已。当他的部队被任命为处理莫斯科的 \"狼人 \"问题时，他知道该怎么做。他的许多上级反对他的方法，即试图找到团伙头目，而不是分解小的细胞，但莫罗佐夫相信，砍掉蛇头比砍掉蛇尾更有效。\n\n而他的方法最终取得了成果。经过一段时间的监听，从线人那里收集信息和一些 \"强化 \"的审讯过程，特种部队终于找到了莫斯科分部的头目。他们跟踪该领导人到该市郊区的一个不起眼的房子，该房子属于某个叫 \"鲍里斯·伊格纳季耶夫\"的家伙，他的 \"狼人 \"盟友称之为 \"加姆尔\"。半夜里，莫罗佐夫和他的手下冲进了这所孤独的房子，决心要把 \"加姆尔 \"击毙或活捉。对他们来说，不幸的是，这所房子似乎被遗弃了，直到一名特种部队成员发现了书柜后面的一扇暗门。这扇门被匆匆打开，门外有一个楼梯，通向一个秘密的地下室。这支部队下到地下室，发现了一个临时的行动室，里面充满了地图、文件和武器。特种部队发现一个人正试图用无线电发送德语信息，可能是为了警告他的狼人盟友，他已经被发现了。一个讲俄语的声音喊他停下来，举起双手慢慢转过身来。这个人没有服从，而是试图用枪指着特种部队；几秒钟之内，\"加姆尔 \"就死了。\n\n特种部队和俄罗斯情报人员对发现的文件进行了梳理，发现他们偶然发现了宝藏。他们杀死的人并不叫 \"加姆尔 \"或 \"鲍里斯\"，而是叫 \"卢茨·霍夫曼\"，他是德国国防部的一名特工，负责组织狼人组织的莫斯科分部。通过在霍夫曼的总部收集的情报，俄国人发现了每一个细胞、每一个安全屋、每一条供应路线和每一次计划的攻击。在接下来的几周里，发生了一场史诗般的镇压。数百名德国狼人死亡，数千名狼人被俘。他们像多米诺骨牌一样倒下，莫斯科州终于摆脱了他们的恐怖。"
 NOV_postwar.87.a:0 "莫斯科再无德匪。"
 NOV_postwar.88.t:0 "需要治疗的人民"
 NOV_postwar.88.desc:0 "仅仅用语言是无法描述高加索人民在纳粹统治期间所承受的难以言喻的恐怖的。在勃艮第制度下，在约西亚斯·祖·瓦尔德克和皮尔蒙特的铁腕控制下，生活的恐怖是难以言表的。即使在他的统治结束后，无论他的继任者的控制有多么松散，伤害也已经造成了。一个奴役和压迫人民的时代给他们留下了心理上严重的创伤。当全俄罗斯军冲进高加索地区时，他们得到的只有赞美和庆祝。在经历了所有的苦难和辛劳之后，当人们开始重新寻找自我的漫长旅程时，希望已经照亮了他们。\n\n从文化复兴计划到简单的食物和水分配，人们的精神和能量正在复苏。残暴的纳粹建筑正在被拆毁，取而代之的是所有在十年漫长的占领期间牺牲的人的纪念碑。在每个城市，新的公寓楼正在建造，超市几乎从地里冒了出来--甚至有人说美国食品连锁店将在斯塔夫罗波尔开业。俄罗斯国旗在该地区每座行政大楼的旗杆上骄傲地飘扬着，伴随着的还有当地人民各自的旗帜。\n\n尽管这些土地因德国的行径而永远留下了伤痕，但高加索人民对俄罗斯人民为把他们从暴政中解放出来而作出的牺牲表示敬意。在整个高加索，年轻人和老年人，男人和女人，都再次望向天空。"
 NOV_postwar.88.a:0 "每个人都望向更美好的明天。"
 NOV_postwar.89.t:0 "一座老城里的新的一天"
 NOV_postwar.89.desc:0 "安东从托木斯克走了很远的路，他想道。这么长时间以来，他一直在行军，而且他的付出终于得到了回报。他站在那里，站在曾经的伟大城市明斯克的一条现在无名的街道中间，当他和军队的战友来到这里时，明斯克已经化为灰烬。现在，他和其他人一起驻扎在受到战争打击最严重的白俄罗斯的心脏。\n\n从建筑到标志，特别是该地区的定居者，到处都能看到德国人的影响。这让他感到不安，想到在他们出现之前这个地方是多么可怕。尽管如此，他还是从一些驻扎在其他街区的士兵那里听到了一些故事，它们是关于很多白俄罗斯人并不喜欢自己的房子被炸毁的。但他只是个二等兵，他想，所以安东并不太担心会发生这样的事情。他可以把他们引向他的上级，然后看着这场闹剧的发生。当这个想法在他脑海中闪过时，一个狡猾的笑容在他脸上绽放。\n\n他穿过这座城市，一天的巡逻结束了，但他仍然穿着军装，带着步枪。随着重建的进行，他必须随时像指挥官说的那样保持警惕。安东认为这个城市做得很好，特别是考虑到人们对德国人被赶走似乎很高兴。当他想到这些的时候，一股香味从他身边飘过，那是一种温暖的、令人难以置信的舒适的东西。他立即循着香味走到街上，检查了每个角落和小巷，路过几个士兵，他们正用大碗吃着他渴望的东西。他的肚子开始咕咕叫；不管他刚才是否饿，现在肯定饿了。\n\n最后，他来到一个看起来很简陋的摊位前，摊位上有一个可能是六七十岁的老人和一个年轻女人。摊位周围坐着许多士兵，也享受着安东一直在寻找的美味。他毫不犹豫地走近摊位，注意到那些巨大的锅碗瓢盆，里面煮着美味的炖菜。"
 NOV_postwar.89.a:0 "“比我奶奶做的要好。”"
 NOV_postwar.91.t:0 "会晤马家军"
 NOV_postwar.91.desc:0 "几个人站在翻修后的克里姆林宫中的翻新总统办公桌周围。这张桌子相当古怪，与总统在新西伯利亚使用的桌子相去甚远，但他的顾问们连日来发誓，这张桌子需要与俄罗斯联邦总统拥有的新威望相匹配。他不需要这样，有行动支持的声明才是在全球范围内恢复俄罗斯精神和力量的最快方式。俄罗斯回到了世界舞台上，而且她不会浪费时间来证明这一点。因此，那张桌子上的第一个对话自然是如何处理中国的问题。\n\n“如你所知，马家军是中国西北地区的一个政治派别，他们在日本的压力下坚持了几十年，并怀有推翻日本人的兴趣。此外，他们的意识形态多种多样，但对任何特定的信仰都不严格。马家军是典型的国民党信徒，尤其是现任领导人马继援。理论上来说，他们想要民主制度和发展中国，这意味着我们向他们提出的要求或建议不会在他们的考虑范围之外。简而言之，他们对我们的利益和需求具有可塑性，我们可以相信他们会愿意与我们合作。如果我们给他们足够的支持，整个中国西部就会处于他们的控制之下。”当情报部门负责人说完后，他看向其他人，最后停在舒克申身上，等着看总统是否有任何问题要问。\n\n总统懒洋洋地坐在椅子上，以疲惫的语气说出了这句话。“嗯，很明显，我们要和他们见面，但除此之外，我们能期待什么？”\n\n“中国西部是一片荒无人烟的地方，即使它重获统一，也不太可能推翻共荣圈的统治。尽管如此，它可以作为一根刺，如果有合适的资源和合适的机会，他们可以向东进军，建立他们的政权。即使他们不会很快解放中国其他地区，在我们和共荣圈之间有一个与我们结盟的国家，将对我们有很大的帮助。我们可以发掘另一个我们的企业可以发展的市场，提升我们在全球的形象，加强我们的安全，并尽可能地建立一个长期的伙伴关系。简而言之，帮助他们发展并占领该地区是一个有益无害的想法，特别是如果我们打算与共荣圈进行长期对抗的话。”\n\n舒克申开始固定他的坐姿，说出了他想说的所有话。“既然如此，那么你就可以和国民党展开合作，派出特使，开始发送物资以及顾问和支持。马家军需要多长时间才能把整个中国西部纳入自己的统治下？”"
 NOV_postwar.91.a:0 "几个星期就够了。"
 NOV_postwar.92.t:0 "东游记"
 NOV_postwar.92.desc:0 "鲁斯塔姆带着一小队卫兵和支援外交官走了一个多星期，终于在远处看到了古老而褪色的国民党。在旗帜下，站着几个风尘仆仆但穿着较新制服的人。起初，中国士兵做好了最糟糕的准备，将他们的老式步枪瞄准了装甲车队。只有在鲁斯塔姆命令士兵拔出俄罗斯国旗时，中国人才放下了武器。\n\n当俄国人终于走到中国士兵站着的路口时，双方简明扼要地交换了眼神，只是被鲁斯塔姆的汉语打断了，据说这是联邦提供的最好的东西。中国士兵尝试回话后明白鞑靼人和其他俄罗斯人的目的是什么：他们要去见马继援。\n\n当地的中国军官提出要亲自带他们去见马继援，并加入了俄国人的行程。鲁斯图姆利用这位军官来学习当地的普通话，并对中文单词的发音的鼻音大吃一惊。两人很快就成了朋友，这对司机来说很不利，他在剩下的行程中一直在听两人分享关于中国语言的细节和信息。两人甚至没有注意到，他们已经到达了马家军的中心地带。"
 NOV_postwar.92.a:0 "语言之美，无远弗届。"
 NOV_postwar.93.t:0 "中国的最后希望"
 NOV_postwar.93.desc:0 "鲁斯塔姆试图尽量擦掉旅途中沾染的灰尘和褶皱。他一到这里，就和他的中国新朋友分开，被带到了他认为是政府大楼的地方。一个当地人让鲁斯塔姆在其中一个房间里等一下，他很高兴地答应了；经过长途旅行，他已经累得不行了，需要休息一下，重新集中注意力。\n\n这个房间本身有点平淡无奇。它有一扇窗，一张床，一张桌子，几把椅子，墙上挂着一幅描绘山坡的中国古典绘画。有那么一瞬间，鲁斯塔姆很失望，但失望很快就转变为了对自己良心的谴责。毕竟就在几年前，俄罗斯也是这幅鬼样子，但尽管如此，联邦不仅振作了起来，还与德国人开战，并取得了胜利。他相信中国人也能做到这一点，特别是在得到适当的援助之后。\n\n几分钟过去了，一个衣着整齐的军官出现在他的门外，宣布马继援终于要和这位俄罗斯特使见面了。令鲁斯塔姆惊讶的是，马继援比他想象的要长得更像飞机。他自豪地穿着他的军装，上面装饰有明亮而干净的国民党标志。但他的眼睛既显露了他的悲伤，也流露了他的力量。马继援打仗的时间比大多数俄罗斯人都要长；很明显，对他来说，战争从未结束。他说出的第一句话不是大胆的承诺，而是一个道歉。\n\n“很抱歉没有为您的到来做充分的准备，但我们对您何时到来或从哪个方向到来一无所知；因此，我们没有准备食物或任何适合贵国代表的礼节。”\n\n鲁斯塔姆很快肯定了这位将军，“请您不必担心。我是在被德国佬狂轰滥炸的俄罗斯废土上长大的。我完全理解你的处境和困难，所以你不需要道歉。我可以毫无疑问地告诉你的是，我们理解你为什么要坚持不懈地斗争，这就是为什么我们要来帮助你。我将成为俄罗斯联邦驻贵国政府的常驻代表。此外，我在这里通知你，将有无数的物资和支持来协助你和你的政府收复全中国，当然，首先得从西部开始。”\n\n当鲁斯塔姆承诺将提供援助时，马继援似乎如释重负。这可能是莫斯科的冷酷算计，也可能他们真的对重建中国产生了某种兴趣，但这是他第一次感到，也许中国会有一个真正的朋友。"
 NOV_postwar.93.a:0 "为反抗压迫而建立的纽带。"
 NOV_postwar.94.t:0 "在山魔王的宫殿里"
 NOV_postwar.94.desc:0 "阿里被护送到位于亚美尼亚深山里、土耳其人无法触及的叛军总部。他身旁有两名卫兵，每人都有联邦提供的AV-72步枪。在房间的中央，亚美尼亚抵抗组织的领导人古尔根·扎尼詹俯视着一张标有各种十字和圆圈的亚美尼亚大地图。阿里清了清嗓子，引起了亚美尼亚人的注意。古尔根把目光从地图上移开，盯着那人的眼睛看了一会儿。\n\n\"你好，我是古尔根·扎尼詹。我是抵抗组织的实际负责人。我想你是俄罗斯情报部门的人吧？\"亚美尼亚人边问，边和阿里握手。\"阿里·加西莫夫，我是安全部门的。\"阿里回答，看着他的眼睛。\n\n\"一个阿塞拜疆人？我必须承认，我没想到俄国人会派......嗯，你们来联络我们。\"古尔根一边说，一边在桌前坐下来。房间里的紧张气氛是可想而知的。尽管他们与世隔绝，但已经持续了几个世纪的民族矛盾似乎随时都会爆发。阿里叹了口气，看向墙上骄傲地挂着的亚美尼亚国旗。\n\n\"说实话，古尔根。我并不想来这里。\"阿里开始说。\"当他们让我来这里谈判亚美尼亚和联邦之间的联盟时，我想拒绝，但是......\" 阿里停顿了一会儿。他想知道他的祖先会怎么看他？\n\n现在这些都不重要了。还有比这更重要的事情。不管他对亚美尼亚的看法如何，有一件事是肯定的。它不应该只因为土耳其鬼子的疯狂行径而被屠杀并焚烧殆尽。他确实是阿塞拜疆的儿子，但他拒绝站在一边，坐视这种对亚美尼亚人的暴政继续下去。\n\n\"有比我们两个民族之间的矛盾更重要的事情，我们都忍受了帝国主义的罪恶。值得庆幸的是，阿塞拜疆已经从那些试图消灭我们民族的人手中获得了解放，就像土耳其人希望对你们做的那样。如果我们想让我们的人民度过这段困难时期，我们就必须抛开我们的分歧，共同努力。\"阿里解释说，他转过身去，不看国旗，回头看椅子上的那个人。房间里安静了一会儿，然后古尔根慢慢开始点头。\n\n\"你是对的。有比我们民族之间的矛盾更重要的事情。为了自由，我愿意把它放在一边。我相信我们有事情要讨论。请坐吧。\"古尔根笑着说，指了指空椅子。阿里回以微笑，坐到了自己的位置上，准备开始商谈协议。"
 NOV_postwar.94.a:0 "放下过去，为的是更美好的明天。"
 NOV_postwar.96.t:0 "留下一个记号"
 NOV_postwar.96.desc:0 "“爸爸在哪里？”李静对她妈妈问道。\n\n“他今天一大早就去了工厂，我的宝贝，”妈妈说道。“你早餐想吃什么？”他们吃了粥，到外面去玩。\n\n“爸爸在哪里？”李静问道。\n\n“他不能回家吃午饭了，亲爱的。”妈妈说道。于是他们吃着面条，谈论着他们在外面看到的黑白条纹相间的蝴蝶。\n\n“爸爸在哪里？”李静问道。\n\n\"他再过几个小时才会回家，我的小宝贝。你准备好去洗澡了吗？\" 妈妈说。李静让妈妈给她洗头和扎辫子，但没有爸爸就没意思了。\n\n\"爸爸在哪里？\" 李静问道。\n\n“他还没有下班，小家伙。来和我一起读，”妈妈说道。当然，李静对所有的故事都烂熟于心。但爸爸不在，情况可就不一样了。\n\n“爸爸在哪里？”李静问道。\n\n\"他今晚不能给你盖被子，我的心肝。但他留给我一个吻，让我放在你的额头上，\"妈妈说道。李静悲伤地笑了笑，然后躺下睡觉。\n\n午夜时分，李静听到了前门关闭的声音。“爸爸，是你吗？”她问道。\n\n爸爸笑了。“是的，是的！”他说道。“我想你了，宝贝女儿。”\n\n“我也想你。但你为什么离开家这么久？”她问道。“爸爸必须去工作，”他说道。“我们需要钱付房租。但不要紧，看我给你准备了什么！” \n\n他从口袋里掏出一个布娃娃。它只有一个孩子的手那么大，由柔软的布料制成，眼睛用纽扣缝制，心脏有一小块红绸。\n\n李静接过布娃娃，微笑着说：“我喜欢它，爸爸！谢谢你！”\n\n她父亲半跪下来，亲吻着她的脸颊。\"我爱你，我的女儿。\""
 NOV_postwar.96.a:0 "想理解父母之爱，必先成为父母。"
 NOV_postwar.97.t:0 "勿忘我"
 NOV_postwar.97.desc:0 "毛瑟枪轻轻地靠在戴维茨的肩旁，枪托依偎在迪里扬的黑土地上。头顶上的夜空将这片土地笼罩在黑暗之中，火苗噼啪噼啪地作响，节奏飘忽不定。他的手中抓着一个来自过去的遗物。对戴维茨来说，这又是一个不眠之夜……他那双布满老茧和伤痕的手紧紧地握住照片的边缘，闪烁的火焰照亮了面前布满灰尘与污秽的黑白照片，它上面记录着的人模糊不清。\n\n他的目光悄悄地扫过前方，眼睛看着照片上的人物。他也许已经经历过无数次这样的夜晚了--在经过几天的战斗后，他一次又一次地坐在这个篝火旁。他的拇指沿着照片的一侧划过，轻轻地拨弄着它肮脏的白色边缘。他偶尔还能记起他们的声音。即使之前的处境很艰难，他仍然记得他们的笑容。他们的青春就在一个又一个这样的日子里度过。也许，他们也曾坐在这里，坐在他的身边。也许，他不会是唯一的幸存者--也许他们人民的未来还有一些希望。他们称自己为“牺牲者”是有其原因的。但对他来说，情况并非如此。\n\n阿努什、蒂格兰、阿拉克斯……无一例外，都不在人世了。\n\n到现在为止，他已经战斗了这么久，从他还是个小男孩开始。他就为亚美尼亚而战，然而，他还没有为亚美尼亚而死。他失去了他的朋友，他的家人……他失去了所有生命中珍贵的东西。他的牙齿在乱糟糟的胡须下紧紧地咬着。他简直无法描述他内心的感受，他感到痛苦与愤怒在心中交融。这就是他的命运吗？为了一个永远感受不到自由之喜悦的民族而永远战斗下去?\n\n他要么战死，要么孤独终老，要么完成他的使命，要么用某种方法--杀戮、杀戮、不停的杀戮，直到最后他独自一人站在尸山血海之上。但他最终得到了什么？这一切值得吗？\n\n戴维茨的脸上满是灰尘和煤烟，顺着滚烫的眼泪一同流下。他已经无力控制住它了。他想念他们，想念他的家人。他诅咒所有神灵，诅咒土耳其人。这些都无法缓解他的痛苦，也无法结束这个恶性循环。\n\n在那片夜空下，亚美尼亚之子正轻声啜泣着……"
 NOV_postwar.97.a:0 "他知道他无法看到自己的战争结束的那一天。"
 NOV_failure.3.t:0 "新十月革命"
 NOV_failure.3.desc:0 "“德米特里！贝加尔湖附近的频道都连接不上了，伊尔库茨克和布里亚特都不行……赶紧告诉我，发生啥事了！？”一位无线电指挥官要求道。\n\n“我也不知道，似乎发生了某种革命。一群社会主义者占领了警戒号，长官，这激起了一群民粹派的混蛋扮演列宁！请尽快向这边派遣部队。”德米特里回应道。无线电指挥官打电话给克孜勒的一个军事基地，这是他能找到的李离伊尔库茨克最近的地方。“有紧急情况发生，我们需要立即在伊尔库茨克地区部署军事力量。”他命令道。\n\n士兵们试图依照命令开进伊尔库茨克，但就在伊尔库茨克州的边境上，子弹如同暴风雨般向他们落了下来。武装的男男女女宣布该地区为禁区，社会主义革命者击退了联邦军队一个营的士兵。对于这个已经饱受战争蹂躏的国家来说，这是一场艰苦的战斗。联邦方面没有精力抽调出另一支部队。很快，整个远东地区变得寂静无声。从伊尔库茨克到阿穆尔，革命者占领了各地。\n\n贝加尔湖畔，市民们看着崔可夫在贝加尔湖的湖面上讲话，他站在警戒号上对着扩音器大喊。“亚历山大·波克雷什金是个叛徒、罪犯，他自愿镇压人民，压制人民的声音，抛弃舒克申建立的民主的假象，但我们的力量，群众的力量排山倒海，他能阻止我们吗？”崔可夫在船上喊道。“不能！”群众回应道。“那么我宣布，我们必须站起来，剑斩蛇头，创造一个真正的社会主义天堂！拿起武器战斗吧！为了新的未来，我们必须成为勇敢、坚强的战士！”\n\n消息传遍了整个西伯利亚。他的话鼓舞了许多人脱离联邦，参加社会主义革命。在远东，一座又一座城市被占领，所有通往该地区的通道都被那些对国家机器充满愤怒与怨恨的人封锁了，他们全副武装，进行了艰苦的战斗。在远东地区，俄罗斯的三色旗被掀翻，取而代之的是新宣布成立的远东苏维埃共和国的国旗。"
 NOV_failure.3.a:0 "革命精神不息！"
 NOV_failure.4.t:0 "梦想的复兴"
 NOV_failure.4.desc:0 "有些人可能会认为舒克申的遗产被波克雷什金所践踏并付之一炬，但民主精神永远不会消亡。来自叶卡捷琳堡的民主党人鲍里斯·叶利钦填补了许多人心中的空缺，成为那些仍然相信民主梦想的人的领袖人物。但是抗议一个接一个，即使全国人民都要求改革，波克雷什金的国家机器仍然不肯做出任何让步。这使叶利钦理解了一切。\n\n西伯利亚猎鹰是永远不会改变主意的。温和的方法肯定不行，人民必须诉诸另一种方法：举起拳头，宣布造反。叶利钦知道这是民主的未来所必需的一切。在召集了许多人支持他之后，他搬回到了乌拉尔的家乡，开始了一场反对联邦政权——这个政权扼杀着人民的意愿——的斗争。他发动了叛乱。成千上万灰心丧气的俄罗斯儿女端着步枪准备给予阻挡他们前进的压迫者予以痛击。\n\n很快，叛乱席卷了大片土地。然后，在叶卡捷琳堡城的中心，鲍里斯·叶利钦正式宣读了《乌拉尔共和国宣言》，一个新的共和国现在诞生了，她将恢复舒克申时代的民主与繁荣，摆脱波克雷什金的寡头统治。现在，乌拉尔共和国境内的每一个俄罗斯人都有机会再次投票，叶利钦想。\n\n但前面还有很长的路要走。俄罗斯又一次崩溃了。叶利钦知道前行的道路将会异常崎岖。"
 NOV_failure.4.a:0 "舒克申的遗产。"
 NOV_failure.5.t:0 "基尔皮奇尼科夫的归来"
 NOV_failure.5.desc:0 "令人担忧的报道从西方传来。自从我们在莫斯科被德国人打败后西俄罗斯就发生了一场又一场的暴乱，现在这个不稳定地区的紧张局势最终达到了顶峰。由弗拉基米尔·基尔皮奇尼科夫领导的叛军控制了西俄罗斯的重要城市和堡垒。这位叛国者此前是奥涅加反共志愿军的领导人，他似乎已经从阴影中走出来，在我们的西部地区发动大规模叛乱，并建立了一个中立的俄罗斯国家。在全俄罗斯军士气空前低落的情况下，仍忠于我们的军队一触即溃，迅速退回到了乌拉尔山以东，几乎没有抵抗，只与叛军发生了短暂的冲突。在不到一个星期的时间里，我们几乎完全失去了对西俄罗斯的控制，他们在我们剩下的欧洲领土上宣告了“西俄罗斯共和国”的成立。\n\n当这个消息像野火一样在愤怒的俄罗斯民众中蔓延时，游击队开始在联邦的几乎每一个角落涌现，他们利用这种极度的尴尬，再次点燃革命的火焰。不管我们如何看待这一事实，联邦已经完全被逐出欧洲，并被限制在了西伯利亚的广阔平原上。"
 NOV_failure.5.a:0 "英雄。"
 NOV_failure.6.t:0 "国家之殇"
 NOV_failure.6.desc:0 "亚历山大冲进医院，当他走近医生时，脸上露出恐慌的表情。“舒克申怎么了?!”波克雷什金问道，汗流满面。“舒克申总统因承受巨大压力而突发心脏衰竭，我们正尽最大努力让他清醒过来，但似乎没什么效果。”医生回答。“我们保证——”医生想加一句，但波克雷什金打断了医生的话。“马上回去工作！”波克雷什金喊道，然后走进了一间候诊室。当医生走近波克雷什金时，他正在候诊室里焦急不安地坐着。\n\n“瓦西里·舒克申…于下午3点45分宣布死亡。”医生说道。波克雷什金低下了头，一种悲伤的感觉像暴风雨一样席卷着他，他皱起了眉头。这条消息会冲击整个俄罗斯，或者说，俄罗斯剩下的部分。人们会哀悼死去的总统。很多人会哭泣，很多人会感到失望。但也有一些人会感到开心。但是，根据联邦章程，总统职位将由政府首脑亚历山大·波克雷什金担任。\n\n波克雷什金走进一间空无一人的总统办公室。没有在舒克申常坐着的地方看到他让他感到很奇怪，但他还是坐了下来。现在他最好的朋友已经不在人世了，他怎么能占他的座呢？那已经不重要了。俄罗斯需要他。是时候谈正事了。"
 NOV_failure.6.a:0 "在最糟糕的时刻，他离我们远去。"
 NOV_failure.7.t:0 "狂怒之日"
 NOV_failure.7.desc:0 "街上越来越热闹。成千上万的人拿着各种标语和牌子在街上游行。他们给波克雷什金起了一系列绰号，从暴君到杀人犯，从民主的杀手到卑鄙的布尔乔亚。被激怒的民众冲向政府大楼，要求变革，要求立即剥夺波克雷什金的紧急权力，要求赋予人民权力，要求恢复民主制度。\n\n一开始，只有一辆卡车前来。几个全副武装的士兵下了车，阻止抗议者继续前进。人们不服气，向武装士兵的脸上吐口水，大喊脏话。又有几辆卡车驶来，士兵们开始攻击，抗议者们也进行了还击--从向士兵们扔回催泪瓦斯到赤手空拳地抵挡警棍。情况从此开始走下坡路。\n\n然后，一道命令被下达给士兵们。他们纷纷掏出了自己的突击步枪，一声巨响就足以驱散整片人群。空中的闪光伴随着持续不断的火力，以及喷洒在地上的鲜血和不幸中弹者的尖叫声。许多人被卷入交火中，当晚有更多人丧生，但士兵们被要求清理尸体，并像什么也没发生过一样继续前进。\n\n但联邦政府没法完全压制住消息。在联邦的首都发生了一场大屠杀？这个故事像瘟疫一样传遍了俄罗斯。许多人，从舒克申派到社会主义者都被激怒了。一些人过于害怕波克雷什金而打算躲起来或逃跑。然而，留下来的人萌生了一个信念：为了让俄罗斯摆脱暴政，他们需要采取暴力措施。"
 NOV_failure.7.a:0 "一个寂静的夜晚。"
 NOV_failure.8.t:0 "行动时刻"
 NOV_failure.8.desc:0 "纳粹的旗帜高高飘扬在一个离阿尔汉格尔斯克只有几英里远的村庄上。这个村庄在第一次西俄罗斯战争失败后的黑暗岁月里，曾是红军的前哨基地。多么象征意义啊，这个村庄在第二次西俄罗斯战争中被占领了。舒克申的部队无法守住这个地区。康斯坦丁曾希望救星快要到来。他日夜祈祷上帝，祈求联邦能够获胜，解放这个村庄，那些俄罗斯士兵将会在街上行进，高呼胜利的口号，带领那些被拯救的人们。然而，占领持续了数天、数周，最后数月。最终，宣布联邦战败。康斯坦丁彻底失去了所有的希望。\n\n这种失落困扰着他。他从不想向法西斯屈服。他的父亲在五十年代的第一次失败战争中支持过红军士兵。当康斯坦丁将“瓦西里·舒克申”投进选票箱时，他看到了一个为未来而战的强者，一个能够解放残存地区并为阵亡者复仇的人。这是他最关心的事情。他无法忍受为了生存而舔纳粹行政官的靴子。因此，他正收拾行囊，把能装进去的东西都塞进去：衣物、钱财、食物，一切必要的生存物资。他不打算留下来。他拒绝向法西斯低头。\n\n他把所有的物资都装上了一辆卡车，最后一次回望着自己的家。他在这里生活了一辈子。他记得小时候母亲怎样抱他，父亲怎样扶着他。他记得与女友共度夜晚后偷偷回家，以及父亲隔天早晨给他的严厉训斥。一滴眼泪顺着他的眼角滑落，但过去就是过去。如果为了逃离这些法西斯混蛋，他们一定会理解他的决定的。他把卡车装好，踩下油门朝边境驶去。\n\n他已经学会足够的德语，能够与边境警卫交流，并在包里塞满了足够的现金，足以贿赂甚至最忠诚的警卫。几乎没有任何障碍能阻挡他前往西伯利亚广袤而残存的俄罗斯。"
 NOV_failure.8.a:0 "是时候找到一个新家了。"
 NOV_failure.9.t:0 "草原步入黑暗"
 NOV_failure.9.desc:0 "在夜最深的时候，月光明亮地照耀着中亚广袤的大草原。夜间潜伏者在路边高高的草丛中穿行，一切都很安静——直到靴子和卡车的声音开始靠近。路上开始停满了装满补给品、士兵和武器的卡车，他们从越来越响的声音中慌忙逃开。他们似乎在准备着什么。\n\n这一幕在哈萨克境内的每一条公路上重演。一个补给和部队调动的网络已经开始；波克雷什金完全没有意识到的计划已经就位。这些行动的真正意图很明显：准备将哈萨克从俄国人的严密控制下解放出来。他们将不惜一切代价争取独立，摆脱这个将他们推向法西斯野兽战争的摇摇欲坠的国家。\n\n几位哈萨克将军对祖国日益增长的不满情绪深表同情，他们选择秘密叛逃，不再为联邦效力。相反，他们转而投靠了一个多年前就已经失败的旧国家，一个希望和梦想在不久前被联邦的崛起彻底击碎的国家，一个谁也不会想到会在如此短的时间内重新崛起的国家：哈萨克斯坦社会主义共和国。\n\n现在，到了他们罢工的时候了。供应线被切断，俄罗斯进入哈萨克斯坦的通道被封锁，由朱马别克·塔申耶夫领导的哈萨克斯坦社会主义共和国宣告成立！哈萨克人民打破了枷锁，建立了独立的哈萨克民族。所有通往哈萨克斯坦的道路都被士兵和参加运动的志愿者封锁。从城市到中亚草原的田野，哈萨克人民现在享受着脱离联邦的独立。"
 NOV_failure.9.a:0 "阿拉木图没有信号。"
 NOV_failure.10.t:0 "中亚宣布脱离联邦！"
 NOV_failure.10.desc:0 "当哈萨克人摆脱破碎的俄罗斯联邦之时，似乎中亚其他地区的剩余部分也不可避免地会效仿。随着新成立的哈萨克斯坦共和国阻止联邦进入其中亚领土，该地区的民族群体宣布独立已成为必然。\n\n对于中亚正在发展的局势，我们目前无法做太多事情，因为在西部俄罗斯，不安和抵抗不断上升，该地区似乎准备随时与剩下的俄罗斯联邦分道扬镳。"
 NOV_failure.10.a:0 "分裂衰落"
 NOV_failure.11.t:0 "支离破碎的联邦"
 NOV_failure.11.desc:0 "波克雷什金静静地坐在办公室里，思考着最近发生的事情。在过去几周里，俄罗斯第三次输给了德国，他最好的朋友去世了，而且由于那个朋友的行动，他导致了俄罗斯联邦的崩溃。这一切到底是怎么错了呢？是在舒克申最初接管联邦时出了问题，还是更早之前？然而他也告诉自己，这已经不重要了。不论有没有犯错，他们都必须承担后果，并尽力修复他们能修复的一切。\n\n亚历山大从办公桌前站起来，走到他已故朋友的总统肖像前。他脸上挂着那个独特的微笑，他还记得早上他曾经跟舒克申开玩笑说他看起来像电影明星。现在，他再也见不到他朋友真人的笑容了。\n\n“没有你在我耳边，我该怎么办，瓦西里？”亚历山大开玩笑地说道，脸上露出一丝微笑，他不禁发现这整个局面是多么荒谬可笑。然而笑容很快消失了。波克雷什金知道他的几个朋友最近都担心他的心理健康。瓦西里的死以及那些看似无休止的指责，指责他破坏了战争努力，并谋杀了总统，都对他产生了不小的压力。他背叛了自己最亲密的朋友。\n\n“至少你逃脱了这一切，瓦西里。我宁愿承担一切的责任，也不愿你在死后的遗产被玷污。”波克雷什金喃喃自语，慢慢地走到窗前，窗外是新西伯利亚的景色，这个城市自败北以来，每个星期看起来都越来越灰暗和悲伤。这将是他和瓦西里辛苦建设的一切的全部吗？“这不可能是结局，”亚历山大低声说道。“我会让一切重归正轨，瓦西里，”他对着肖像宣布道，他的朋友向他微笑着。"
 NOV_failure.11.a:0 "“我将以你的名义拯救俄罗斯人民。”"
 NOV_failure.12.t:0 "物资匮乏"
 NOV_failure.12.desc:0 "格里戈里将一袋杂货放在厨房台上，他的妻子和孩子们聚集在一起，想看看父亲带回了什么。那是一条面包和一些配料，如火腿、奶酪等等。“小心地切这条面包，”格里戈里仔细解释道。“这应该能够撑到我下次发工资，大概还有一周。”孩子们显得失望，而他的妻子只是愁眉苦脸。\n\n“那么...我们又要过这种日子了？”娜塔莉娅说着，拉开袋子自己看了看。她听到格里戈里叹了口气，感到一丝温暖从体内蔓延开来，他的手在她的头发后面摩擦着。\n\n“是的。这不会像多年前那样糟糕，但是...仍然很糟糕。”格里戈里回答道。他俯下身来，在妻子的头上亲了一下，然后继续说道。“娜塔莉娅，我希望我们能让这些孩子过上正常的生活。看起来前景很有希望，不是吗？”格里戈里说。\n\n娜塔莉娅低下了头。“是的。我以为舒克申总统会带来...某种正义，”娜塔莉娅说道。“但他做的只是失败。”\n\n“情况只会变得更糟。我从工作中得到的报酬越来越少。我不知道我们该如何养活孩子们，”格里戈里说着，心中涌起一种空洞的感觉。两个孩子只能吃很薄的面包片。他们会整天抱怨饥饿，但父母们却无能为力，因为他们不想浪费一周的口粮。\n\n夜幕降临时，整个家庭关掉了灯，他们的胃开始咕噜作响，渴望食物，但他们不能浪费它。那些食物应该撑过这一周。"
 NOV_failure.12.a:0 "贫穷降临。"
 NOV_failure.14.t:0 "提线木偶之痛"
 NOV_failure.14.desc:0 "亚历山大望着窗外，看着新西伯利亚，自从舒克申被逮捕以来，这里变得越来越无聊。现在，他已经沦为了什么？党所谓的领导者，只不过是个傀儡吗？但这并不是亚历山大现在最让他痛苦的事情。波克雷什金的思绪回到了舒克申身上，他仍然在某个鬼地方腐烂。\n\n波克雷什金甚至被禁止见到那个人，格林卡威胁说如果他敢尝试，他会亲自枪杀舒克申。他无法想象他的老朋友现在正在经历什么。被困在潮湿的牢房里，看着你建立的一切在眼前分崩离析。看着你辛辛苦苦建设的国家崩溃，却无能为力阻止这一切的发生。\n\n波克雷什金坐在桌前，双手托着头。他讨厌这种感觉。他憎恶被迫为了保住他最好的朋友而屈从于自己党派的命令。亚历山大记得他和舒克申为联邦的未来争吵了多少次。无论发生了什么争论，这两个人最后都会共饮一杯。\n\n亚历山大紧握拳头，指关节因愤怒而变白，脸色也变得通红。他怎么能让党派成员对他施加如此大的压力？他不会允许这种情况继续下去。他不会让他的朋友腐烂，他不能。他会战胜西罗维基，并重新掌控自己的生活。他这样做不是为了自己，而是为了俄罗斯和她的人民。为了他朋友的梦想。为了整个俄罗斯。"
 NOV_failure.14.a:0 "“也是为了舒克申。”"
 NOV_failure.15.t:0 "更美好日子的回忆"
 NOV_failure.15.desc:0 "波克雷什金独自走进他的旧总统办公室。就在刚才，他刚刚第二次就职为联邦总统。亚历山大走到他的办公桌前，但当他看到椅子时停了下来。他凝视着瓦西里·舒克申曾经坐过的位置。这一切都感觉不对劲。这本不应该以这种方式发生。\n\n他闭上眼睛，回想起他和舒克申一起喝酒、观看俄罗斯和加拿大之间的冰球比赛直播的时光。这是俄罗斯数十年来首次参加海外体育赛事。俄罗斯队的胜利使那个夜晚成为一个令人难忘的夜晚。当一名加拿大选手射偏时，办公室里充满了笑声，紧接着俄罗斯队将冰球带过冰场并将其直接射入球网时，欢呼声此起彼伏。这是更美好时光的一个美好回忆。\n\n现在，他一无所有。舒克申已经不在了。俄罗斯队在与德国人的第三次战争中输了，这也许是他们最后一次将法西斯主义者赶出自己土地的机会。解放俄罗斯和建立联邦的梦想在纳粹的靴子下土崩瓦解，希望荡然无存。他知道这个房间不是俄罗斯唯一一个充满对未来绝望焦虑的房间。但他可以改变这一切。\n\n亚历山大睁开眼睛，最终坐下来。他必须继续前进。他现在是总统，而联邦似乎正处于崩溃的边缘。波克雷什金叹了口气，望着窗外展现出的新西伯利亚广袤城市景观。联邦需要一位总统引领它度过这个艰难时期，而亚历山大是唯一能够做到这一点的人。"
 NOV_failure.15.a:0 "“我们有工作要做。”"
 NOV_failure.17.t:0 "一位老朋友"
 NOV_failure.17.desc:0 "楚尔科夫的顾问进了房间，手里拿着一大堆文件，他迅速把它们放在他老板的桌子上。\"这是您要求的我们目前状况的更新报告，\"顾问开始说道，\"坦率地说，情况不妙，总书记。\"\n\n\"看上去可能不妙，但这些都是我们可以应对的问题，同志。\"楚尔科夫说着，他拿起一个文件仔细查看。他的眼角瞥见顾问四处张望，特别对一个照片框架感兴趣。照片上展现着一个年轻的男子，不超过30岁，身着一身白色海军制服，头戴军帽，上面骄傲地印着锤子和镰刀。他脸上洋溢着纯粹的自信微笑。\n\n顾问指着照片框架问道：\"他是谁？\"然后转回身看向他的老板。\n\n楚尔科夫微微一笑地看着他说：\"啊，我的朋友。他是人民的英雄，\"楚尔科夫解释道，\"多年前我曾在他的指挥下工作。他是我个人的偶像！他领导着布里亚特经历了最艰难的时刻。\"\n\n顾问转过头，感到困惑：\"听起来像个伟大的人，\"他问道，\"为什么他今天不在这里？\"他立刻注意到楚尔科夫的脸色转为沮丧，顾问的眼睛也瞪大了，察觉到他的低落情绪。\n\n\"嗯，\"楚尔科夫回答道，\"他现在在六英尺的地下。我就只能告诉你这些了。但是，\"楚尔科夫说着，他把手放在顾问的肩膀上，\"我相信他会以光荣的革命为豪地俯视我们！现在，我们必须立即开始为实现我们在远东的工人天堂而努力，并且有朝一日逐个夺回俄罗斯！\"\n\n尽管外表自信，楚尔科夫无法摆脱深深扎根在他内心深处的强烈怀疑感。他有时认为自己是软弱的。他害怕自己的遗产，也害怕未来。当俄罗斯日渐衰落时，他会被视为叛徒吗？还是视为革命英雄？"
 NOV_failure.17.a:0 "时间会给出答案。"
 NOV_bill.1.t: "《代表选举法案》通过了！"
 NOV_bill.1.desc: "民主建立在人民的意愿之上，这一点不能仅通过行政机构来表达。为了生存，民主必须引导政府，并且不能受到未经选举的决策者的阻碍，而这正是我们的新政府所实现的。\n\n在杜马进行的一次具有里程碑意义的投票中，自舒克申总统执政以来的第一项重要立法已经轻松通过了政府。随着联邦议会不再由国家指定的代表组成，自联邦成立以来，西罗维基对我国的掌控力首次得到基本限制。我们的杜马已经彻底改变，现在由人民选举产生，并以人民的利益为先进行运作。当然，不能说这项法案结束了我们消除武装人员影响的工作，但它确保了总统的工作不会在即将到来的选举中轻易被颠覆。\n\n由于我们的胜利，联邦已经开始见证几十年来罕见的政治表达的复苏。新的政党和团体已经充满了各种意识形态的政府大厅。一个一党专政和受控制的反对派的时代将永远不会回来，因为它的位置上站立着一个多元和自由的政治体系，塑造着国家的未来。"
 NOV_bill.1.a: "一项法案通过了，后面还有更多的。"
 NOV_bill.2.t: "《选举权法案》通过了！"
 NOV_bill.2.desc: "兴高采烈的庆祝和低调的抗议在整个联邦蔓延，瓦西里·舒克申再次推动他越来越理想主义的俄罗斯民主愿景。\n\n《选举权法案》旨在针对自中西伯利亚共和国解散以来被西罗维基强制执行的选举限制措施，这是向解开前总统推行的企业国家的目标迈进的又一步。投票站将在当地管理，不再受到武装力量的“必要保护”。少数民族、社会主义者和其他在反民粹派法下被认定为“安全风险”的人将被列入白名单，除已经被判有罪的重罪犯和罪犯外，所有人都将享有参与投票的天然权利。\n\n全俄爱国党可能会在“选举权过度扩展”和“危害选举诚信”等方面对我们提出质疑，但不会有大逆转。瓦西里·舒克申已动笔，他的下一章才刚刚开始。"
 NOV_bill.2.a: "只要这位作家掌握着钥匙，俄罗斯的凤凰就会燃烧得更加明亮。"
 NOV_bill_2_tt: "§R全俄爱国党将继续激进化！§!"
 NOV_bill.3.t: "争取民权的斗争胜利了！"
 NOV_bill.3.desc: "一个国家无法充分发挥其潜力，当古老的社会规范束缚并限制了其中一半的人口时，尤其如此。今天，我们的联邦已经开始摆脱这种社会束缚的进程，俄罗斯的女性终于可以开始自由呼吸了。\n\n我们最近通过了旨在结束对女性不平等待遇的立法，得益于我们的联合努力，该法案已经牢牢确立并成为法律。新的计划和规定将在联邦范围内迅速实施，以结束学校、职场和政府办公室中的歧视。社会规范的这种转变不会一夜之间发生，但通过对新法律的严格执行，有望在未来几个月内出现重大变化，使联邦朝着更加平等对待其人民的道路前进。\n\n当然，这可能会在俄罗斯的保守选民中引起一些不太顺利的反应，但我们的成功为总统在更具进步思想的人中，尤其是联邦的女性中，提供了重要的支持。不论好坏，国家的方向已经坚定地朝着更大的公平性发展，没有停下的迹象。"
 NOV_bill.3.a: "进步的福音！"
 NOV_bill.4.t: "《环境保护法案》通过了！"
 NOV_bill.4.desc: "俄罗斯的自然美超越了其他任何地方，从郁郁葱葱的针叶林到积雪覆盖的山峰和流动的河流；然而，自从联邦的大型企业获得权力以来，雾霾和污染已经对环境造成了严重破坏。杜马终于对这种不公正采取了行动，并迈出了重要的一步来终结这一情况。\n\n经过数周的谈判和舒克申总统亲自推动这个问题，《环境保护法案》终于签署成为法律。对工业废物、空气污染和清洁水源的强力监管将终于遏制企业对全联邦自然环境的破坏。拯救联邦自然美仍然有很多工作要做，但对该国和总统来说，这是一次重大胜利，因为总统从政府成立之初就是环境监管的坚定支持者。\n\n环境保护局已经得到公众的一致赞同，甚至包括更保守的选民在内，这为我们的政府严格执行法规提供了强有力的授权。虽然全俄爱国党对该法律所施加的严厉限制表示不满，但由于如此强大的公众支持，西罗维基一直比平常更为沉默。总而言之，随着联邦再次自由呼吸，取得了巨大的成功。"
 NOV_bill.4.a: "愿鄂毕河的水再次闪闪发光，亘古长存。"
 NOV_bill.5.t: "《环境保护法案》被废除了！"
 NOV_bill.5.desc: "理想的自由主义在俄罗斯的内心深处找不到立足之地。这个教训必须小心地逐步传达。瓦西里·舒克申的暴力反公司化运动和对联邦“自然美”的“保护”，严重影响了我们的利润率，也影响了我们在整个社会中的形象。\n\n全俄爱国党只考虑俄罗斯的最佳利益。年轻人易受影响，他们被腐败、虚伪的宣传所塑造，旨在摧毁波克雷什金先生在职期间所取得的一切成就。\n\n《环境保护法案》只是试图通过僵化的官僚机构来限制我们无情的野心，而在强者之地，是没有容忍这样束缚性、有害和反企业的措施的空间的。虽然成千上万的人已经走上街头进行毫无意义的“抗议”，但我们不会成为恐吓的受害者。普里马科夫总统将逐步清除联邦中的自由主义腐败，无论俄罗斯是否同意。"
 NOV_bill.5.a: "监管的枷锁将在适当的时候被打破。"
 NOV_bill_5_tt: "§R通往卢比孔河的道路始于足下§!"
 NOV_bill.6.t: "《企业限制法案》通过了！"
 NOV_bill.6.desc: "联邦的巨型企业自从波克雷什金总统上台以来，就紧紧控制着经济，妨碍了自由企业。它们为了贪婪和权力不择手段地腐蚀我们的政府，控制我们的人民。然而，今天，那个时代已经过去了。联邦已经面对了其经济的监狱长官，并做出了坚决的决定：不再如此。\n\n在我们联盟的全力帮助下，联邦议会通过了《企业限制法案》，将其变为法律，并发布了一项广泛而全面的监管措施，针对垄断和企业过度扩张。该法案对凤凰和泰坦直接实施了几项限制措施，对西比尔则实施了相对温和的限制，旨在使市场解放，让企业在企业圈外有机会繁荣成长，而不会受到不公平的排挤。\n\n我们选民基础中的绝大多数人都热情洋溢地庆祝了这项法案，尤其是俄罗斯的小商业主和那些最强烈反对企业控制的人。当然，全俄爱国党表达了他们的不满，但是由于这项法案得到了超过党派支持，其通过注定是不可避免的。今天标志着俄罗斯历史的转折点，过去的寡头统治被取而代之，取而代之的是一个自由而繁荣的经济。"
 NOV_bill.6.a: "为秩序干杯！"
 NOV_bill.7.t: "《工人权益保障法》通过了！"
 NOV_bill.7.desc: "波克雷什金政府最大的弊病无疑是对普通劳工的冷漠和不人道待遇。长时间工作和恶劣的工作环境司空见惯，一切都是为了追求企业利润。它对人类的影响几乎无法估量，尤其是在民粹派的极端主义和暴力下，这种情况只会加剧。这些旨在维护联邦强大的法律除了让国家蒙受苦难外一无所获，但如今总统已经开始治愈这个国家所受的伤痕。\n\n经过漫长的投票程序，联邦议会通过了《工人权益保障法》，对俄罗斯全境的工作场所进行了全面而重大的改革。增加了更高的最低工资标准，保护工会权益，并改善了工作场所的安全，这是自舒克申总统执政以来最重要的立法之一。\n\n俄罗斯陷入了庆祝和对该法案的赞誉之中，全国各地的人士无党派支持该法案。与此同时，执政联盟在法案通过之际分享了一次罕见的真正团结和共同的胜利，而全俄爱国党几乎保持沉默，因为他们不敢激怒如此庞大的选民基础。工人取得了伟大的胜利，但这绝不是最后的胜利。"
 NOV_bill.7.a: "普通人得到很好的保护，而我们是他们的盾牌。"
 NOV_bill.8.t: "《全民医保法案修正案》通过了！"
 NOV_bill.8.desc: "人民的健康是一件善变的事情，特别是在那些想要从他们的口袋中挤取最后一分钱的人们手中，他们在寻求援助的同时也在呼喊。联邦的企业主导的医保系统几十年来一直伤害着人民，但今天这个遗留问题不再污染我们的政府。\n\n在与全俄爱国党的寡头进行了一系列紧张的讨论后，联邦议会通过了我们共同起草的宪法修正案。新规定的政策包括一个强大而健全的国家医保系统，用于治疗最紧迫和严重的疾病和疾病，但在这种情况之外维持了一个受监管的私人系统。一个新的公共部门已经开始建立，同时现有的私人系统也在适应其新的受控领域。\n\n对这项立法的反应在一定程度上存在分歧，支持民主社会党的人称修正案远远不足以修复联邦之前破碎的医疗保健系统，而全俄爱国党中的一些人则对此表示过于极端。公众普遍赞同这项修正案，尤其是保守派，因为预算与民主社会党的提案相比仍然处于一个更为合理的位置。像任何妥协一样，没有人完全满意，但联邦无疑处于一个更加安全和健康的状态。"
 NOV_bill.8.a: "众口难调"
 NOV_bill.9.t: "《全民医保法案修正案》通过了！"
 NOV_bill.9.desc: "人民的健康是一件善变的事情，特别是在那些想要从他们的口袋中挤取最后一分钱的人们手中，他们在寻求援助的同时也在呼喊。联邦的企业主导的医保系统几十年来一直伤害着人民，但今天这个遗留问题不再污染我们的政府。\n\n经过我们联盟内的一系列妥协和谈判，我们与列昂尼德·康托罗维奇的民主社会主义者共同提出的宪法修正案终于被联邦议会通过。随着修正案的通过，一个强大的国家医疗保健体系，摆脱企业影响和贪婪的束缚，已经成为联邦最高法律的规定。私人保险和任何企业对国民福祉的控制几乎已经废除，因为医疗费用的覆盖面已经扩大到绝大多数人。\n\n我们的选民基础中有很大一部分人为这项立法的成功而欢呼，还有俄罗斯民主社会党的支持者，但该修正案在俄罗斯更保守派的人中间引发了争议。这种广泛覆盖的系统的成本无疑是高昂的，但修正案对预算的完全影响可能需要一段时间才能看到。然而，金钱的代价无法超过对不作为所付出的人道代价，而且随着新体系的好处向公众展现，联邦将认识到这一点。"
 NOV_bill.9.a: "人的生命是无价的。"
 NOV_bill.10.t: "《联邦保障法案》通过了！"
 NOV_bill.10.desc: "在舒克申总统第一任期的早期，农工党达成一项协议，通过了一项全面的宪法修正案，建立了一个国家医保系统；然而，多年来，尽管这项立法对联邦人民非常重要且深具益处，但显然并不足够。许多俄罗斯人仍然未能获得足够的医疗援助，特别是在缺乏支持基础设施的地区，但今天这一情况已经开始得到纠正。\n\n联邦议会一致通过了总统的新《联邦保险法案》，为俄罗斯公共医疗保健部门提供了更新的预算，并增加了对牙科和眼科等被忽视地区的覆盖范围。农村医疗基础设施也得到了大力提升，有助于增加对现有援助的获取，并改善联邦中最被忽视的病患和贫困人口的生活。\n\n公众和杜马内的反对派普遍赞同这项法案，虽然比我们之前的立法更为低调，但农村地区的反响更为积极。虽然并非革命性的改变，但联邦的医保系统中的一个重大缺陷已得到纠正，国家继续繁荣发展。"
 NOV_bill.10.a: "修补过去的疏忽。"
 NOV_bill.11.t: "摇摇欲坠的梦想"
 NOV_bill.11.desc: "尽管我们竭尽全力为舒克申总统最新的立法活动争取支持，但我们似乎严重低估了对立面的反对势力。\n\n在选举的僵局中困顿了几周，我们未能在议院中获得足够的支持来确保我们法案的通过。尽管试图与较小的独立团体和组织协调一致，但杜马两极的激烈抵抗形成了一道墙，一票一票地削弱了我们的联盟，阻碍了通过残酷而有效的立法策略获得明确多数的希望。\n\n这次挫折大大降低了人民对俄罗斯农工党宏伟梦想的信心，使支持力量向政治两极的反对党倾斜。虽然这对舒克申总统的政府来说不是致命的打击，但恢复俄罗斯对他对未来愿景的信任将需要巨大的努力。"
 NOV_bill.11.a: "在这样的时候，我希望我能求助于波克雷什金。"
 NOV_bill.12.t: "力量在衰弱"
 NOV_bill.12.desc: "随着叶夫根尼·普里马科夫和全俄爱国党当选执政，数百万人担心波克雷什金的“西罗维基之国”将重现在联邦国家中。冷酷、计算和尤其是漠不关心的强者之地将再次从历史的页码中崛起，将俄罗斯恢复到其应有的状态：一个充满无情、未被驯服的野心的国家。\n\n然而，尽管我们竭尽全力在我们的有利方向上施加压力，舒克申的政治机器已经成长为一个自成帝国。我们未能通过民主手段废除环境保护法案是一种无以言表的尴尬，自从瓦西里当选以来就没有出现过。\n\n高管们很生气，我们的支持基础正在减弱，成千上万令人厌恶的骚乱分子如今在街头游行，要求将普里马科夫免职。如果我们无法通过其他非法手段扭转命运，总统对于一个强大国家的愿景可能会像波克雷什金的愚蠢一样成为历史。"
 NOV_bill.12.a: "有人需要卷铺盖滚蛋！"
 NOV_bill_12_tt: "§R巨企们在暗中密谋……§!"
