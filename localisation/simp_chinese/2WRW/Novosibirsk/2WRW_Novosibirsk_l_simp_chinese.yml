 NOV_postwar.15.b: "在德涅斯特河沿岸问题上施压。"
 NOV_postwar.15.c: "在敖德萨问题上施压。"
 NOV_postwar_15_odessa: "我们已达成一项协议，允许将该州移交给乌克兰共和国，据此，罗马尼亚对该地区的所有要求都将被搁置和终止。至于是否按照安排完成这一交易，现在应由俄罗斯联邦来决定是否接受这一提议。"
 NOV_postwar_15_no_odessa: "我们经过表决，决定拒绝俄罗斯联邦提出的这一要求，并提出一个还价。外德涅斯特河地区将立即移交给乌克兰共和国，但港口城市敖德萨和德涅斯特河地区的其他地方仍将归罗马尼亚所有。罗马尼亚对外德涅斯特河沿岸的所有要求都将终止，以防止今后局势出现任何进一步的升级。"
