 NOV_postwar.100.t:0 "亚美尼亚的未来"
 NOV_postwar.100.desc:0 "随着山地战争的结束，联邦内部和总统办公室内部爆发了关于新解放的亚美尼亚将走向何方的争论。许多人，尤其是亚美尼亚人民自己，呼吁该地区保持独立国家的地位，而一些人则呼吁将其纳入联邦的整体，作为一个自治共和国。无论总统作出何种决定，亚美尼亚的未来都掌握在他的手中。"
 NOV_postwar.100.a:0 "将亚美尼亚纳入高加索联邦。"
 NOV_postwar.100.b:0 "将亚美尼亚吞并为联邦内的一个自治共和国。"
 NOV_postwar.100.c:0 "亚美尼亚被征服的时间太长了。他们应保持独立。"
 NOV_postwar.103.t:0 "蓝色湖泊，红色草地"
 NOV_postwar.103.desc:0 "议会大厅在舒克申带领着一队外国记者和地区行政官员的随行下变得热闹起来，他迈步走进阿梅特汗的办公室。每个官员都抱着一摞文件紧紧地抵在胸前，他们忙碌的动作几乎让路人入迷，但随着总统自信地走进部长的办公室，房间的氛围与门外的疯狂形成了鲜明的对比。\n\n“瓦西里，你好吗？我们有一些紧急的事情要讨论。” 阿梅特汗的语气似乎缓和了拥挤的室内紧张氛围，然而他的目光只专注于舒克申那变得更加冷漠的目光。总统坐在外交部长面前，在总统面前打开一个小香草色的文件夹，将情报文件呈现在他面前。\n\n“自德国崩溃以来，匈牙利陷入了内战。匈牙利的纳粹分子夺取了布达佩斯的首都，导致该地区所有正式行政机构在短时间内迅速瓦解。”\n\n总统缓慢地浏览着文件的内容，他急速转动的思绪试图为这个令人担忧的局势制定出解决方案。\n\n“匈牙利红军已经利用目前的权力真空，而一个民主的农民联盟已经向我们的情报机构求助，恳请我们的援助。侦察飞机拍摄的最新照片显示，德国士兵正在匈牙利边境逐渐集结。虽然德国似乎正在陷入内部混乱，但纳粹的外部干预似乎并非不可能，总统先生。”\n\n舒克申沉入椅子，忍不住发出一声痛苦的叹息，将文件向着他的老朋友推了回去。\"德国人虚弱无力，我们最近的胜利已经证明了这一点。虽然鉴于虚弱的德国的不稳定性，直接的救援行动是不可能的，但我们不能袖手旁观，让法西斯分子壮大。如果民主社会党想要倾销我们的过剩物资，那好！我们将把它送往匈牙利。和你们这些'农民'的领袖通个电话，让他们的梦想成真吧。\""
 NOV_postwar.103.a:0 "“如您所愿，总统先生。”"
 NOV_ask_them_nicely_reconstruction:0 "重建敖德萨"
 NOV_ask_them_nicely_reconstruction_desc:0 "德国人从罗马尼亚政府手中夺取德涅斯特河沿的控制权后，由于民族社会主义成为主流意识形态，当地经济多年来一直处于被忽视和停滞状态。根据《里加条约》，该州暂时由我们控制，这意味着我们的任务是铲除民族社会主义残余势力，重建该州，使其达到可接受的稳定水平。\n\n我们议程上的第一件事就是建立一支安全部队，以保护和协助向有需要的人分发援助物资。一旦我们确保了该地区的安全，我们就必须制定一个全面的经济计划，以便在开始重建过程中为之努力。如果一切顺利，我们将有机会要求将敖德萨划归我们在乌克兰的姊妹共和国，这才是它应有的合法归属。"
 NOV_ask_them_nicely_demand:0 "索取敖德萨"
 NOV_ask_them_nicely_demand_desc:0 "第二次世界大战期间，乌克兰的敖德萨和德涅斯特河沿岸被罗马尼亚吞并。虽然他们被从自己的祖国分割出去，但生活在那里的人们还是满足于在罗马尼亚的统治下生活，因为罗马尼亚人比灭绝种族的德国人要好得多。\n\n然而，随着乌克兰从德国统治下解放出来，生活在这片土地上的乌克兰人现在希望重新加入他们的祖国。夺回这些土地将有助于提高我们在乌克兰的声望，使乌克兰人民更容易接受联邦。"
