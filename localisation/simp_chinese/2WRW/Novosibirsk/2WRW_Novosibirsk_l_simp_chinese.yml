l_simp_chinese:
 NOV_meet_with_pokryshkin:0 "和总司令的会议"
 NOV_meet_with_pokryshkin_desc:0 "总统已经召集了波克雷什金和全联邦的军事领导人返回新西伯利亚，聚集在战争室内，为联邦在即将到来的对抗大日耳曼国的战争中制定战略。在这里，我们不仅会审查我们制定的进攻计划，还会确定俄罗斯全军在我们开始解放东欧免于纳粹暴政之前需要做哪些后勤准备工作。"
 NOV_send_in_the_spies:0 "派遣联邦安全局"
 NOV_send_in_the_spies_desc:0 "波克雷什金向总统明确表示，想要将我们神圣的莫斯科从纳粹占领者的铁靴下解放出来，并把德国人驱逐出我们国土的最好方法就是向敌后派遣安全局特工以收集情报和动摇[MCW.GetNameDef]的统治。\n\n我们不仅会收集信息，而且可以开始为敌人阵线后方的潜在反抗活动打下基础。我们也可以向我们的共产主义前辈们学习。"
 NOV_weaken_their_administration:0 "扰乱行政"
 NOV_weaken_their_administration_desc:0 "[MCW.GetNameDefCap]对其领土的控制充其量只能说是脆弱的，他们经常不得不与全国各地，主要是临近我国边境的游击队和叛军作战。一旦我们的特工射杀了某个重要人物，或是哪个重要人物神秘失踪了，他们的统治都将在顷刻间土崩瓦解。我们将粉碎他们试图控制西俄罗斯土地的任何企图。当时机成熟时，我们将利用这一点。"
 NOV_sabotage_factories:0 "破坏工厂"
 NOV_sabotage_factories_desc:0 "为了迅速击败德国，我们必须尽快摧毁他们的工业设施。这将阻碍他们为军队提供补给，并给我们创造一个能让我们充分利用优势的的机会。全俄罗斯军将粉碎一切敌人。"
 NOV_break_their_encryption:0 "破解密码"
 NOV_break_their_encryption_desc:0 "破解[MCW.GetAdjective]的密码将使全俄罗斯军有能力得知纳粹的补给线、作战战术和部队调动情况。在即将到来的与[GER.GetFactionName]的冲突中，我们拥有情报上的绝对优势。"
 NOV_they_are_broken:0 "斩断蛇头"
 NOV_they_are_broken_desc:0 "安全局的最终目标是[MCW.GetAdjective]的军官团。对他们最经验丰富、有进取心的将军的暗杀将使他们群龙无首，士气低迷，轻易地被全俄罗斯军碾碎。"
 NOV_prepare_western_defences:0 "准备西部防线"
 NOV_prepare_western_defences_desc:0 "诺维科夫明确表示，不为即将到来的战争做好任何防御准备是愚蠢的。我们的西部边境很容易受到德军的攻击，因为在边境线上没有必要的防御工事来阻止德军开进我们的领土。我们必须开始动员全国，为不幸但非常真实的战争进展不如预期的可能性做好准备。"
 NOV_build_up_airbases:0 "建立空军"
 NOV_build_up_airbases_desc:0 "如果我们缺乏必要的空军基地和现代装备来部署我们庞大的飞机队，那么联邦生产了多少老式的米格-17和雅克-15来面对德国空军都无关紧要。波克雷什金建议我们尽快扩建俄罗斯现有的空军基地，并生产新的米格-23。\n\n“如果我们丢掉了空中战场，我们就会输掉这场战争，并且输的很快。” - 伯纳德·L·蒙哥马利"
 NOV_fortify_frontline_cities:0 "要塞化西部边境"
 NOV_fortify_frontline_cities_desc:0 "如果德国人能把我们的士兵逼回边界线上，那么等着他们的将是由地堡，战壕和炮兵阵地组成的坚不可摧的防线。\n\n我们称之为“祖国之墙”。\n\n这条巨大的防线将保护联邦免受德国人对我们中心地带的反攻并确保边境附近所有公民的安全。"
 NOV_watch_the_barents_sea:0 "保卫我们的北方"
 NOV_watch_the_barents_sea_desc:0 "当我们为即将到来的对德战争做防御准备时，我们的顾问指出了联邦的一大弱点。\n\n那就是巴伦支海。\n\n毫无疑问，德国人将在整场战争中拥有海上优势，并可能利用这一优势来利用我们北方的弱点，攻破我们北方的海岸线。我们必须采取必要的措施来增援北俄，确保德国人无力踏上阿尔汉格尔斯克的寒冷海岸。"
 NOV_lessons_of_barbarossa:0 "巴巴罗萨的教训"
 NOV_lessons_of_barbarossa_desc:0 "我们从巴巴罗萨行动中所犯的错误中吸取了教训。与之相比，自西俄战争以来，纳粹国防军的发展近乎停滞。我们知道会发生什么，更重要的是，知道如何阻止他们。我们不会被德国人打个措手不及了。\n\n§R我们不会再犯第二次错。§!"
 NOV_condemn_the_reich:0 "谴责德国侵略者"
 NOV_condemn_the_reich_desc:0 "现在是联邦直接与德国对话的时候了。世界决不能忘记40年来他们对俄罗斯和欧洲人民犯下的不可原谅的罪行。我们将永远谴责大日耳曼国，永远不会原谅那些奴役德国人民、迫使德国人民屈服并将其残酷愿景强加于欧洲的纳粹分子。"
 NOV_mobilise_the_federation:0 "联邦总动员令"
 NOV_mobilise_the_federation_desc:0 "为了彻底击败纳粹，我们必须将联邦的经济体制暂时转变为军事经济。工厂和关键工业部门将被国有化，生产线将被重组，以对抗德国这个世界霸权。俄罗斯工业生产的重点将从简单的工具和产品转变为为全面战争准备的武器。这对解放莫斯科人民的正义斗争来说是必要的。"
 NOV_a_blitzkrieg_of_our_own:0 "俄罗斯的闪电战"
 NOV_a_blitzkrieg_of_our_own_desc:0 "当德国人在1941年入侵苏联时，他们用坦克、飞机和机械化部队的大规模攻势击溃了毫无准备的红军，用闪电战横扫了白俄罗斯和乌克兰，占领了我们神圣的莫斯科。\n\n他们让我们措手不及。\n\n但这一次不会了。\n\n这一次，全俄罗斯军将以迅速而凶残的攻势向西进军，我们将让纳粹国防军在混乱与恐惧中逃往西方。风水轮流转，这一次轮到德国佬尝尝闪电战的厉害了。"
 NOV_no_turning_back_now:0 "沒有退路"
 NOV_no_turning_back_now_desc:0 "这一刻终究还是来了。从我们脱离中西伯利亚共和国的统治，到实现俄罗斯的再统一，我们所做出的一切努力都是为了今天。\n\n§R我们现在正与德国交战。§!\n\n道路将是艰辛曲折的，许多人将失去生命，但最终，我们将实现舒克申总统从上任之初就追求的目标。\n\n§B那就是将俄罗斯人民从暴政下解放。§!\n\n这很可能是俄罗斯的最后一战。在这场即将到来的冲突中，我们冒着失去一切的风险。是时候与老宿敌一决高下了，我们将让他们刻骨铭心地记得这场战争。"
 NOV_to_liberate_russia:0 "前进，俄罗斯！"
 NOV_to_liberate_russia_desc:0 "最优秀的战争机器轰轰烈烈地进入德军阵地，准备解放莫斯科。在西俄罗斯各地的机场，一架又一架的飞机起飞，准备牺牲自己的生命来保卫那些徒步与威胁作战的勇士。在阿尔汉格尔斯克，俄罗斯舰队起航，准备保卫我们来之不易的北极地区。数百万人严格精确地行进，步枪瞄准前方，杀死所有挡在我们面前的人。\n\n当然，每辆坦克都需要它的燃料。这就是为什么扩大征兵是唯一的选择，如果我们想在我们庞大的军队中保持足够的人员。更多有能力的人将服役，全俄罗斯军将变得更加强大！\n\n勇往直前！"
 NOV_brave_sons_of_russia:0 "俄罗斯的英雄儿女"
 NOV_brave_sons_of_russia_desc:0 "尽管全俄罗斯军已经足够强大，但我们不能忘记，德国国防军的人数比我们更多。因此，对抗纳粹政权庞大军队的唯一办法是征召更多勇敢的年轻人加入全俄罗斯军的行列。\n\n他们每打倒一个勇敢的祖国之子，那些混蛋就会发现还有一百个复仇的人在等着他们，他们的双眼之间就是他们的步枪！\"。"
 NOV_plead_to_europe:0 "自由欧罗巴宣言"
 NOV_plead_to_europe_desc:0 "亲爱的欧洲兄弟姐妹们，为解放我们神圣的领土而进行的斗争就在眼前。随着全俄军队勇往直前，迎战德国国防军，我们呼吁欧洲所有自由的人民以各种方式支持我们对抗大日耳曼国的伟大斗争。\n\n只有当自由的欧洲团结一心，我们才能从纳粹的镇压中解放我们的大陆，并确保这片古老土地的未来充满自由和繁荣，不仅为我们的子孙后代，也为世世代代。"
 NOV_spread_war_propaganda:0 "号召人民"
 NOV_spread_war_propaganda_desc:0 "我们必须提醒我们的人民，我们为谁而战。\n\n我们为莫斯科人而战，他们被迫离开家园，为了给定居者腾地方，他们在自己的土地上被当作亚人对待。\n\n我们为高加索人而战，他们长期以来忍受着帝国的隔离和压迫，帝国试图把他们美丽的土地变成一个大型油田。\n\n我们为乌克兰人而战，他们的土地只剩下农田供帝国开垦。\n\n我们为白俄罗斯和波罗的海地区的土著人而战，他们无助地看着自己的家园被压迫者殖民。\n\n我们为东欧的解放而战，无论代价如何！"
 NOV_onwards_to_moscow:0 "巴格拉季昂行动"
 NOV_onwards_to_moscow_desc:0 "同志们!\n\n我们解放俄国的进展迅速而果断，高加索的油井和圣彼得堡和莫斯科的圣城已经理所当然地归还给我们。\n\n然而，现在不是放慢脚步和巩固地位的时候。相反，我们应该反其道而行之! 是时候发动一场全新的攻势了，这场攻势将撕碎德国残余的国防军，解放德国人手中残余的领土。\n\n§R是时候了... ... \"巴格拉季昂行动\"!§!"
 NOV_recruit_the_slaves:0 "与俄族游击队并肩作战"
 NOV_recruit_the_slaves_desc:0 "在整个战争期间，深入德国被占领土地的游击队频频阻碍纳粹的战争机器。联邦必须与这些义军中最重要的团体合作，对德国国防军造成最大的伤害。\n\n解放区内的游击队员将被征召加入全俄罗斯军，并与联邦一起将我们的祖国从德国的暴政中解放出来。"
 NOV_remember_whats_at_stake:0 "记住关键在于什么！"
 NOV_remember_whats_at_stake_desc:0 "\"我们的一些将军担心德军可能的反击。\n\n我说，让他们来吧！\n\n我们的部队并不惧怕德国国防军！普通的德国士兵，在没有他的金属盾牌的情况下，缓慢而虚弱，是无法与强大的全俄罗斯军相比的！无论他们试图进攻哪里，都会遭到枪林弹雨的袭击，一排排的俄罗斯爱国青年，随时准备好武器，都愿意为联邦的利益献出自己的生命！\n\n全俄罗斯军将勇往直前，不屈不挠！\"\n\n亚历山大·波克雷什金"
 NOV_deal_with_america:0 "呼吁OFN支援"
 NOV_deal_with_america_desc:0 "在我们与德国的斗争中，OFN是我们的天然盟友。虽然要求他们直接参与冲突是过分的要求，只会把全球推向核战争，但他们仍然可以做很多事情来协助我们与德国的斗争，比如向我们出售他们的武器，并呼吁美国、加拿大和澳大利亚的志愿者加入前线，协助我们与纳粹的斗争。"
 NOV_invade_the_reich:0 "为了俄罗斯人民的解放！"
 NOV_invade_the_reich_desc:0 "经历了多年在大日耳曼国手中的苦难和羞辱后，联邦已经准备向西迈进，解放那些被这个帝国主义国家统治下的占领土地。是时候践行我们向人民承诺过的承诺了。\n\n§B为了所有俄罗斯人的解放！§!"
 NOV_a_federation_reborn:0 "联邦重生"
 NOV_a_federation_reborn_desc:0 "几十年的屈辱之后，俄罗斯终于战胜了阴险的德国人。莫斯科这座神圣的城市和数百万俄罗斯人从德国占领中解放出来。\n\n为了庆祝这一值得纪念的时刻，舒克申总统在莫斯科红场组织了一场活动。这是一次盛大的军事阅兵，旨在回顾俄罗斯历经的所有战争，并庆祝国家的胜利。\n\n这一天他称之为§B胜利日§!。"
 NOV_declare_martial_law:0 "宣布军事戒严"
 NOV_declare_martial_law_desc:0 "尽管我们在取得惊人的胜利后感到欣喜若狂，但战后的现实却是严峻的。新解放的西部地区一片混乱。纳粹游击队猖獗，骚扰我们的部队并在街头袭击我们被解放的同胞。\n\n在我们开始新领域的重建工作之前，我们必须首先消灭这些好战的游击队员，并尽快将这些狂热的纳粹殖民者打败。"
 NOV_expand_intelligence_presence:0 "扩大情报网络"
 NOV_expand_intelligence_presence_desc:0 "多年来，联邦安全局一直是联邦沉默而致命的黑手。他们曾在铲除民粹派等恐怖分子时积累不少了经验，借此经验，他们将在铲除纳粹游击队的行动中大展身手。纳粹的“孤魂野鬼”仍在整个前专员辖区与我们的部队作战，并阻止联邦对这些土地进行任何有意义的重建。"
 NOV_deploy_special_forces:0 "部署特种部队"
 NOV_deploy_special_forces_desc:0 "俄罗斯特种部队是一支精英部队，负责处理威胁俄罗斯人民的危险的国内情况，如恐怖袭击、炸弹威胁和人质绑架。随着西方陷入混乱，是时候把最好的精英派往西方，协助全俄罗斯军一劳永逸地打倒俄罗斯的纳粹威胁。"
 NOV_airforce_patrols:0 "侦察空袭"
 NOV_airforce_patrols_desc:0 "自20世纪50年代初联邦成立以来，我们一直以我们的航空能力为荣。通过我们空军的力量，我们已经能够战胜从莫斯科到马加丹的敌人。\n\n现在，德国空军已经被击败，并被赶出俄罗斯的天空，我们现在可以把我们的空中能力转为对付游击队。有了对付这些匪徒的空军，我们就能找出这些蟑螂的藏身之处，把它们炸成灰烬。"
 NOV_strike_the_nazi_partisans:0 "最后一击"
 NOV_strike_the_nazi_partisans_desc:0 "在整个西部地区，我们的部队已经找到了继续骚扰我们部队的纳粹匪帮的基地和领导人。随着西部局势的稳定和我们军队的到位，终于到了对这些匪徒发动最后一击的时候了，并彻底结束他们对无辜者的威胁！"
 NOV_empower_military_governments:0 "授予军政府权力"
 NOV_empower_military_governments_desc:0 "尽管总统不希望在重建区赋予军方太多权力，但如果要迅速有效地应对游击队威胁，总统似乎别无选择，只能这样做。\n\n通过允许军事长官暂时废除人身保护令和被监禁或遭到嫌疑的人的其他权利，我们可以最好地利用我们的平叛行动人员为饱受战争蹂躏的地区带来最终和平。一旦做到这一点，和平与稳定可能最终会恢复，重建可能会正式开始。"
 NOV_send_humanitarian_aid:0 "提供人道主义援助"
 NOV_send_humanitarian_aid_desc:0 "在新解放的西部地区，数以百万计的人无家可归，忍饥挨饿。几十年来德国的管理不善和国防军在整个战争期间对东欧无辜人民犯下的暴行已经摧毁了人民。\n\n联邦必须通过提供紧急住所和食物，迅速帮助我们的西方兄弟姐妹度过我们历史上的这个困难时期。我们不会允许更多的兄弟因为纳粹——或我们自己——的粗心而死。"
 NOV_picking_up_pieces:0 "收拾残局"
 NOV_picking_up_pieces_desc:0 "现在西方已经解放，秩序已经恢复，现在是重建我们在这艰难的几十年中失去的一切的时候了。\n\n东欧可能因德国占领和第二次西俄战争而支离破碎，但现在俄罗斯完全统一和自由，我们可以作为一个国家团结起来，开始重建我们广阔祖国的漫长疗愈过程。"
 NOV_rebuilding_moscow:0 "重建莫斯科"
 NOV_rebuilding_moscow_desc:0 "几十年来，我们神圣的莫斯科在德国的统治下饱受折磨，它的许多伟大的纪念碑被遗弃，而曾经充满活力的俄罗斯社区则沦为单纯的贫民区。\n\n现在情况不再是这样了。\n\n俄罗斯回来了，而且比以前更强大。我们心中充满了希望，我们在战争中取得的胜利使我们的地位越来越高，是时候重建第三罗马，创造世界上有史以来最辉煌的城市了。"
 NOV_expand_monument_reconstruction_efforts:0 "重建历史地标"
 NOV_expand_monument_reconstruction_efforts_desc:0 "莫斯科的纪念碑和地标使我们光荣的首都熠熠生辉。无数美丽的景点都曾是我们国家的国力强盛、人们的聪明才智的体现。\n\n现在，它们躺在废墟中，渐渐崩坏或被德国国防军做成练习靶。俄罗斯数百年的成就被摧毁，或被篡改成 “日耳曼 ”式碍眼的垃圾。克里姆林宫，莫斯科的心脏，变成了国防军的一个军事基地。这是不可以接受的。我们需要尽快恢复我们失去的历史，无论代价如何。\n\n它们是我们人民的无价之宝。而它们背后的教训，尽管可能黑暗不堪，但以史为鉴，它们的价值依旧不可估量。"
 NOV_modernise_construction_equipment:0 "现代化建造设备"
 NOV_modernise_construction_equipment_desc:0 "西俄罗斯重建区的施工设备相对于联邦的设备来说有些过时，因为他们目前主要使用军队的库存。许多建筑项目需要更多的时间才能完成，因为没有俄罗斯联邦工人目前所使用的更现代化的工具。\n\n如果我们希望尽快重建莫斯科的行政中心，支持他们的重建工作并向西俄罗斯重建区派遣一些联邦的施工设备将是非常相关的。"
 NOV_the_heart_of_russia:0 "俄罗斯的心脏"
 NOV_the_heart_of_russia_desc:0 "我们神圣的莫斯科，俄罗斯的心脏，已经恢复了它昔日的荣耀。有了这个象征俄罗斯力量和毅力的标志物的恢复，我们可以将注意力转向伟大城市以外的更广阔的西部俄罗斯重建区，解决困扰着这个伤痕累累地区的众多问题。"
 NOV_begin_local_elections:0 "开始地方选举"
 NOV_begin_local_elections_desc:0 "人们已经填饱了肚子，他们有了遮盖的屋顶，摆脱了法西斯游击队的威胁，俄罗斯欧洲部分的人们终于可以呼吸自由的空气。政府几十年的工作在俄罗斯得到了传译和传播，给予了我们行政的能力，使我们能够及时地在莫斯科地区举行第一次地方选举。人们热切期待我们联邦的承诺能够兑现，我们的士兵报告说，市民们询问何时能够投票选举他们的领导人。\n\n几十年来，莫斯科人被剥夺了在自己的土地上做出选择的权利。他们无法选举任何人代表他们参与任何形式的政府，被迫成为被压迫的主体。\n\n他们对民主的热情是令人鼓舞的，也表明西部俄罗斯越来越愿意重新加入祖国，拥抱自由和民主的价值观。"
 NOV_encourage_foreign_investment:0 "鼓励外国投资"
 NOV_encourage_foreign_investment_desc:0 "俄罗斯西部城市的重建正在帮助该地区在基本层面上恢复，但如果没有任何外国投资，俄罗斯西部将无法像西伯利亚中部或伏尔加河那样具有经济竞争力和创新能力。\n\n我们应该鼓励美国和日本的投资者在俄罗斯西部新解放的土地上设立或投资，以帮助动荡的地区恢复。凭借可以想象到的最低价格和几乎未开发的市场，这些企业将做得很好，做得很好，帮助我们陷入困境的地区经济繁荣，同时让国内的股东大赚一笔。"
 NOV_rebuild_western_cities:0 "重建西部城市"
 NOV_rebuild_western_cities_desc:0 "随着全俄军队向西进军，许多莫斯科城市成为战场，我们勇敢的子民们与德国国防军进行了激战。\n\n因此，大多数城市遭受了破坏，许多莫斯科居民失去了家园。尽管我们的紧急援助能够提供临时住所，但生活条件仍然相当艰苦，主要是帐篷和军用口粮。我们无法在如此基本的条件下重建国家，也无法袖手旁观，眼看我们的历史土地遭受痛苦。\n\n我们将全力展开重建工作，凭借来自联邦内地和驻扎在莫斯科地区的大批工人和士兵，逐砖重建我们的城市。这项工作将是漫长的，但当我们完成时，我们的人民将再次拥有一个可以称之为家的地方。"
 NOV_support_rural_muscovites:0 "支援乡村地区"
 NOV_support_rural_muscovites_desc:0 "几十年来，莫斯科西部一直被世界视为欧洲的一潭死水，德国的一个贫穷的农村主体，对奴隶劳动有好处，仅此而已。在我们向莫斯科推进的过程中，在这些土地的城市化和工业化方面取得的任何进展都很快付诸东流。\n\n莫斯科西部牢牢掌握在我们手中，我们的第一步应该是尽快将这些土地重新工业化，首先是使西部的农业产业现代化，让农民摆脱贫困，使该地区与其他地区相提并论联邦尽快。这样一来，许多农民将不再需要，可能会搬到城市，为新兴工业基地提供大量劳动力。"
 NOV_create_new_oppertunities:0 "创造新的机遇"
 NOV_create_new_oppertunities_desc:0 "尽管莫斯科农业的现代化是发展这些荒芜土地的重要第一步，但正是通过工业化的强有力拳头，我们将把这个东欧后乡变成俄罗斯联邦的经济和工业中心。\n\n目前，已有数家俄罗斯公司请求在这些充满机遇的土地上建设新工厂。许多在旧联盟时期存在的废弃工厂可以在几周内轻松重建，并为数百万在战争后失业的莫斯科人以及在家庭农场日常运营中变得多余的农民提供就业机会，他们将寻求新的赚钱机会。\n\n莫斯科人民需要就业机会来加快经济发展，而俄罗斯联邦将提供这些机会。"
 NOV_reintroduce_russian:0 "引入俄罗斯概念"
 NOV_reintroduce_russian_desc:0 "几十年来，莫斯科人一直被迫学习和使用前压迫者的语言。其结果是明显的语言障碍，在莫斯科地区和俄罗斯联邦之间造成了巨大的分歧。虽然年长的人会说话，而且许多人能读一口流利的俄语，但年轻人是文盲。尽管俄语作为一种窃贼的行径被保留下来，但无法用西里尔字母书写是非常麻烦的。\n\n我们预计不会很快克服这一巨大的语言障碍，但通过正式将俄语重新引入该地区的官方语言，我们可以慢慢开始治愈德国人造成的文化和语言损害。"
 NOV_promote_russian_culture:0 "引入俄罗斯文化"
 NOV_promote_russian_culture_desc:0 "如果我们想让莫斯科的人民完全重拾他们的俄罗斯传统，我们必须在整个莫斯科推广俄罗斯传统和文化的各个方面，包括新的和旧的。\n\n无论是在电视上看到的，在广播中听到的，还是在他们走过的街道上围绕的，莫斯科人都会记住他们的根。只要有时间，莫斯科将得到文化重生的祝福，并与生活在联邦内的任何其他俄罗斯公民一样成为俄罗斯人。"
 NOV_economic_miracle:0 "俄罗斯经济奇迹"
 NOV_economic_miracle_desc:0 "联邦在帮助西俄重建区重建和工业化以及美利坚合众国外国投资者的共同努力下，创造了莫斯科的经济奇迹。经济开始繁荣，达到几十年来未见的历史新高。\n\n随着新工作和商业机会的日新月异，数百万人已经摆脱了贫困。随着该地区终于克服了因征服而带来的经济停滞，莫斯科地区正迅速接近重新融入我们光荣的祖国！"
 NOV_prepare_integration:0 "俄罗斯的统一"
 NOV_prepare_integration_desc:0 "从波罗的海到鄂霍次克海，我们光荣的祖国曾经在强大的俄罗斯母亲的旗帜下团结和强大，准备面对世界上的任何事情。莫斯科是俄罗斯的故事真正开始的地方，东斯拉夫人在这里从小王国崛起为一个全球超级大国。\n\n现在是时候把莫斯科人带回俄罗斯的爱的怀抱，并使俄罗斯人民在俄罗斯联邦的自豪旗帜下真正统一起来。\n\n永远在一起！团结和自由！"
 NOV_the_phoenix_rises:0 "俄罗斯凤凰"
 NOV_the_phoenix_rises_desc:0 "就像一只涅槃的凤凰，俄罗斯从伟大的卫国战争的灰烬中站了起来，再次成为一支不可忽视的力量。\n\n带着沙皇、前联盟和军阀时代的教训，联邦将满载荣耀回到莫斯科城，带领我们的祖国进入一个繁荣、自由和希望的新的辉煌时代。\n\n§B莫斯科与我们同在！§!"
 NOV_the_german_question:0 "毋忘国耻"
 NOV_the_german_question_desc:0 "几十年来，德国人不仅戕害和压迫我们的人民，而且还试图对我们的土地进行殖民。虽然 \"东方总计划 \"在东方并不完全成功，但东欧的几个地区现在都有德国人占多数。\n\n我们没有忘记这些定居者来自哪里，他们是如何到达东方的，或者谁曾经生活在他们所占领的土地上。现在是决定东欧德国定居者命运的时候了。"
 NOV_the_great_exodus:0 "移民遣还"
 NOV_the_great_exodus_desc:0 "至少可以说，东欧本土人不喜欢德国人。从彼得格勒到伏尔加格勒一直到黑海，关于私刑暴徒和针对德国定居者的谋杀的可怕消息传到了总统的耳朵里。\n\n尽管联邦在与德国的战争中取得了胜利，但我们仍在努力阻止杀戮和骚扰。如果我们想确保这些定居者的安全免受我们新解放人民的愤怒，我们应该考虑将定居者送回德国以确保他们的人身安全。"
 NOV_a_new_europe:0 "欧洲黎明"
 NOV_a_new_europe_desc:0 "欧洲大陆在过去十年间发生了变化。\n\n虽然德国曾经遭受挫折，但它仍然是一个超级大国，通过海军、经济和核武库在大陆和全球具有影响力。\n\n向东，俄罗斯联邦以新的希望之姿崛起。来自西伯利亚广袤平原的联邦已经统一了整个俄罗斯，并成功解放了东欧人民，使其摆脱对以往主人的奴役。\n\n随着东欧地图的重新绘制，我们现在可以向前迈进，将目光投向真正的东欧。欧洲人民渴望自由，而联邦将尽一切努力确保这个大陆摆脱暴君的统治。"
 NOV_coexistance:0 "处理民族关系"
 NOV_coexistance_desc:0 "尽管联邦和定居者之间的沟通情况仍是困难的，但联邦存在着充分的机会。这些地区的许多德国人已经开始与主持德国人占多数的地区的各种军事管理部门合作，协助维持秩序，防止定居者的叛乱。\n\n虽然我们有相当一部分人只想看到定居者被杀或被送回德国，但合作者建议我们建立合作者政府，以确保稳定并满足联邦的需要。\n\n对这些建议存在一些重大的反对意见，但也许建立这些友好的政府比将数百万定居者驱逐回德国更有效"
 NOV_redefining_our_relationship:0 "开始重建"
 NOV_redefining_our_relationship_desc:0 "我们来到乌克兰，并非像之前的俄罗斯政府那样试图俄罗斯化这个地区而以失败告终，而是为了解放我们的人民。我们带来了自由的承诺，并计划重新定义与乌克兰的关系。我们并非新的殖民主义者，而是乌克兰人民的朋友。\n\n我们并不指望通过单纯的话语来赢得每个乌克兰人的心。行动远胜于话语，帮助他们重建城市和乡村是一个很好的开始。随着俄罗斯人和乌克兰人并肩努力重建乌克兰，我们两个民族之间可以建立新的兄弟情谊。\n\n这份情谊将万古不灭。"
 NOV_rebuild_the_roads:0 "重建道路"
 NOV_rebuild_the_roads_desc:0 "在我们向基辅挺进的过程中，乌克兰的大部分基础设施已被全俄罗斯军和德国特工摧毁。\n\n正如人们所预料的那样，交通是一场噩梦，大部分铁路完全无法使用，迫使我们有限的机动交通工具不得不全力以赴。这让格林卡将军在管理这个疏离的领土上感到沮丧。他已要求联邦协助重建乌克兰的关键公路和铁路系统，以便重建和管理变得更加迅速高效。"
 NOV_the_ukrainian_language:0 "重建语言"
 NOV_the_ukrainian_language_desc:0 "就像在西俄罗斯一样，乌克兰人在纳粹帝国的统治下经历了对其国家的德意志化的尝试。\n\n由于其更西部的位置，该地区的整个地区都被德国移民所统治，尤其是克里米亚半岛。我们努力教育乌克兰同胞学习自己的语言所需的工作将比我们之前在莫斯科地区所做的工作更多，但我们必须坚持不懈。我们不会让德国殖民者得意洋洋，也不会让乌克兰人民因懒惰而失去他们的文化和语言。"
 NOV_to_the_history_books:0 "重编历史书"
 NOV_to_the_history_books_desc:0 "在大日耳曼国的统治下，乌克兰是一个充满对比的土地。从德国政府、乌克兰的合作者到改革派工业家，许多团体争夺对前帝国总督区的权力和影响。他们的争斗以所有人为代价，甚至是定居者，因为乌克兰成为一个完全依赖农业的单一商品国家。\n\n几十年的政治冲突的遗产仍然对乌克兰的心灵和经济产生影响。然而，随着这些团体中的成员已经死亡或者他们的权力显著减弱，我们可以开始建立一个乌克兰人民终于能够信任并将过去的动荡扔进历史书籍中的政府。"
 NOV_ask_them_nicely:0 "[NOVGetAskThemNicelyTitle]"
 NOV_ask_them_nicely_desc:0 "[NOVGetAskThemNicelyDesc]"
 NOV_the_future_of_ukraine:0 "乌克兰的未来"
 NOV_the_future_of_ukraine_desc:0 "在联邦的持续援助下，乌克兰正顺利走向复苏。随之而来的，是他们在战后东欧的地位问题。\n\n乌克兰被视为欧洲的粮仓，战略上非常宝贵。我们的语言相似，历史上我们的人民曾经共同承受其他政权的压迫。作为斯拉夫同胞，难道乌克兰不应该成为俄罗斯联邦的联邦成员，以实现我们的共同保护吗？\n\n另一方面，过去的俄罗斯政府压迫了乌克兰，并试图\"俄罗斯化\"乌克兰。乌克兰难道不应该自由决定自己的命运，成为一个独立的国家吗？"
 NOV_restore_ukrainian_identity:0 "重构乌克兰民族认同"
 NOV_restore_ukrainian_identity_desc:0 "乌克兰的身份认同遭受了严重的动摇，至少可以这样说。几个世纪的苛刻沙皇统治，几十年的管理不善的苏联统治，接着又是三十年的灾难性法西斯种族灭绝，给留下了不易愈合的伤痕。\n\n幸运的是，我们并不是为了将乌克兰俄罗斯化，也不是为了殖民他们的土地。我们与乌克兰人民建立一种新的关系，不是主人与臣民的关系，而是两个东欧兄弟的关系。\n\n让我们帮助我们的斯拉夫兄弟重新与他们的文化和传统根源相连，通过政府赞助的项目和夜校来帮助人民找到真正的乌克兰人的意义。"
 NOV_rebuilding_caucasia:0 "重建高加索"
 NOV_rebuilding_caucasia_desc:0 "高加索遭受了几十年的占领和剥削政策的摧残，最终由一个疯狂的希姆莱主义者所统治。随着和平重返东欧，现在是时候开始重建这个地区，将这片骄傲而多元的土地恢复到它过去的辉煌时期了。"
 NOV_construct_a_new_administration:0 "建设新行政机构"
 NOV_construct_a_new_administration_desc:0 "随着全俄罗斯军在北高加索平原的推进，高加索的行政机构遭到了破坏。虽然米哈伊尔·巴加诺夫将军领导的重建政府设法维持其权威，但很明显，在侵扰高加索的地方军阀变得过于强大到我们的军队无法对付之前，我们需要从头开始建立一个新的政府。"
 NOV_legacy_of_the_burgundian_system:0 "摧毁希姆莱主义者"
 NOV_legacy_of_the_burgundian_system_desc:0 "邪恶的希姆莱主义者约西亚斯·祖·瓦尔德克和皮尔蒙特企图将多彩的高加索土地变成痛苦和绝望之地，压迫人民，为他在日耳曼尼亚的纳粹主人剥削土地。\n\n绝不能让这样的邪恶再次兴起。在整个高加索地区，我们将传播他所犯下的暴行的真相，向人民展示他的罪行。然而，我们必须再进一步。\n\n我们必须彻底肃清希姆莱主义者的所有残余势力，确保没有任何人留下，必要时采取武力。他在历史上留下的阴暗污点将被所有提及他的人以厌恶和憎恶的心情铭记，而他的所有支持者将会被彻底清除，就像他们本意要对待他们所谓的“劣等人”一样。"
 NOV_repair_oil_fields:0 "恢复油田"
 NOV_repair_oil_fields_desc:0 "自发现以来，高加索地区的巨大油田一直是该地区的经济基石。在我们的战争和纳粹撤离该地区期间，数以千计的油井和炼油厂被摧毁。如果高加索重建区的经济要以任何有意义的方式恢复，我们就必须重建油田，并开始缓慢地恢复这个受惊的地区的经济。"
 NOV_show_their_crimes:0 "昭告他们的罪行"
 NOV_show_their_crimes_desc:0 "高加索深受纳粹长达数十年的占领之苦。从格鲁吉亚人到阿塞拜疆人，数百万高加索本地居民遭到屠杀、折磨和纳粹政府的隔离，而这些行动一直对帝国边境之外的人保密。一旦他们的罪行被揭露给全世界，国际社会将不会对法西斯分子表达任何同情之情。"
 NOV_rebuild_caucasian_cities:0 "重建高加索城市"
 NOV_rebuild_caucasian_cities_desc:0 "在我们向高加索专员辖区的领土大举进军的过程中，不幸的是，许多城市，如格罗兹尼、斯塔夫罗波尔和克拉斯诺达尔被严重破坏，许多无辜的当地人的家园在战斗中被摧毁。现在是时候重建这些破碎的城市，给这些被打得遍体鳞伤的人一个可以称之为家的安全地方。"
 NOV_free_the_people:0 "解放高加索人民"
 NOV_free_the_people_desc:0 "长久以来，高加索地区被殖民政府按照种族等级划分。寥寥无几的德国殖民者位居顶端，而绝大多数人被迫在矿山和油田中辛勤劳作，同时还面临各种任意设立的等级制度，旨在让人民相互争斗，而非对抗统治者德国人。是时候完全解体那些将人们分离数十年的勃艮第政策的残余，而是将他们团结在一个共同的事物之下：\n\n§B自由§!。"
 NOV_future_of_caucasia:0 "高加索的未来"
 NOV_future_of_caucasia_desc:0 "随着我们联邦的重建努力逐渐引领高加索地区走向复苏，现在是时候决定多元的高加索地区的未来了。\n\n这片土地资源丰富，尤其是石油，直接控制它将是有益的。此外，与以往的政府相比，俄罗斯联邦的统治将比过去一百年中的任何一个都更加自治和仁慈，能够防止内斗。\n\n另一方面，阿塞拜疆、格鲁吉亚和亚美尼亚的人民并非俄罗斯人，而是拥有自己独特文化的人们。难道我们不应该让他们作为独立国家决定自己的命运吗？"
 NOV_rebuilding_the_baltic_states:0 "重建波罗的海"
 NOV_rebuilding_the_baltic_states_desc:0 "波罗的海民族比东欧其他地区的任何民族都受到了更严重的打击。他们的土地遭到了严重的殖民，许多定居点成为德国人的大多数，因为当地人被迫被驱赶到农村贫民区，为即将取而代之并摧毁他们文化的人们卖命。波罗的海地区的身份和文化几乎被抹去，成为历史的一页。\n\n然而，这并不是上帝为波罗的海地区安排的命运，因为我们伟大的俄罗斯军队的勇士们冲破了东方专员辖区卫兵的防线，夺取了里加城。通过里加条约，人为创造的“东方专员辖区”被摧毁。几十年来，殖民者再也无法恐吓波罗的海地区。\n\n我们在俄罗斯西部的努力证明，拯救东欧本土文化并非为时已晚。我们可以帮助波罗的海人民恢复他们的文化，让他们重建辉煌的根基。"
 NOV_rebuilding_lithuania:0 "重建立陶宛"
 NOV_rebuilding_lithuania_desc:0 "立陶宛是旧苏联第一个陷入于德国铁蹄下的地区，导致这片土地满目疮痍。东方领内战加剧了这一情况。\n\n当以德裔居民为主的城镇和居民区已经完全恢复，大量的立陶宛人城镇依旧破旧不堪，处于废墟当中。不像大日耳曼国，联邦关心处于悲惨境遇当中的立陶宛人民遭受的可怕条件。缓慢但是坚定不移的是，我们将帮助当地人重建这一地区并帮助人民拥有一个和联邦主体更相近的生活水平。"
 NOV_reopen_the_schaulen_mines:0 "重开希奥利艾矿山"
 NOV_reopen_the_schaulen_mines_desc:0 "在德国统治期间，索韦利矿场，或者德国人称之为沙乌雷矿场，是东方专员辖区矿业的重要组成部分，出口矿产和其他原材料来支持帝国总督区和帝国本身。\n\n然而，工作条件却令人发指，被奴役的立陶宛人被迫使用粗糙、低效的工具和危险的机械来开采土地资源。\n\n我们将重新开放这些矿场，以帮助立陶宛经济复苏，但故事将完全不同。工人们将不再为资源而冒生命危险。我们将确保为工人提供现代化的工具和机械，合理安排工作时间，并确保他们得到足够的工资报酬。"
 NOV_combat_german_influence:0 "对抗德国文化影响"
 NOV_combat_german_influence_desc:0 "立陶宛虽然没有因为德国的殖民而彻底消失，但是它已经是一个德国人占据多数的土地了。在德国体系下，德国文化在该地区的政治和文化上具有巨大的影响力，这里的文化呈现出一副两种文化相同的模样，使立陶宛人看上去和德国人几乎没什么区别。\n\n几乎。\n\n如果有足够的时间，我们可以简单地用在西俄罗斯相似的方法消除德国人的文化影响，并让立陶宛恢复活力。"
 NOV_rebuilding_latvia:0 "重建拉脱维亚"
 NOV_rebuilding_latvia_desc:0 "在德国的压迫下，拉脱维亚和他们的南部邻国立陶宛一样，经历了几十年的殖民化和文化压制。虽然拉脱维亚人的文化存续了下来，但他们比其他波罗的海国家接收了更多的定居者，在德国的殖民统治下失去了整个库尔兰。\n\n随着东方专员辖区内战的爆发，拉脱维亚人本就不高的生活品质进一步恶化。成千上万的拉脱维亚人流离失所，许多人失去了他们的家园。在拉脱维亚，无家可归的人仍然是一个重要问题。虽然我们不能在一天之内解决拉脱维亚的所有问题，但我们可以支援该地区的经济复苏，投资新的工业项目，使人们能够找到工作，摆脱贫困。"
 NOV_the_heart_of_the_baltic:0 "波罗的海明珠"
 NOV_the_heart_of_the_baltic_desc:0 "拉脱维亚首都里加是前东方专员辖区的最大城市和行政中心，也是目前波罗的海重建区军事管理部门的所在地。\n\n这并不意味着里加是波罗的海三国最好的城市。在德国殖民统治期间，居住在该市的拉脱维亚本地人被贬到贫民区，任其自生自灭，而德国区则繁荣昌盛。东方领内战并没有使事情变得更好。\n\n但里加可以变得更好。\n\n只要有足够的时间和投资，联邦可以帮助里加市重建并从德国殖民统治的遗产中恢复过来，使其波罗的海之珠的名号变得更加响亮。"
 NOV_latvian_cultural_renaissance:0 "拉脱维亚文化复兴"
 NOV_latvian_cultural_renaissance_desc:0 "随着德国人的离去和他们的土地获得自由的祝福，拉脱维亚人现在比以往任何时候都更愿意表达他们的文化。\n\n在街上，人们自发地举办政府赞助的文化节庆。在里加，新的市场已经建立起来，出售着曾经是拉脱维亚文化、传统和身份的重要食物。人们已经自发地开始恢复他们自己的地标，就像我们在莫斯科所做的那样。\n\n拉脱维亚的新黄金时代已经来临，他们将在辉煌的文化复兴中得到我们联邦的支持！"
 NOV_rebuilding_estonia:0 "重建爱沙尼亚"
 NOV_rebuilding_estonia_desc:0 "爱沙尼亚人没有像立陶宛和拉脱维亚人那样忍受殖民统治的程度，但爱沙尼亚仍然在东方专员辖区的统治下受苦。他们的人民被迫离开最好的农田，他们的文化受到压制，他们的城市被分隔为德国人的繁荣区和爱沙尼亚人的贫民区。不平等的不公正进一步加剧了东方专员辖区内战的不平等，我们必须扫清德国人。\n\n联邦不是爱沙尼亚人民的敌人。我们必须支持他们的重建努力，向这些人表明新的俄罗斯确实是一个更好的俄罗斯，摆脱了前帝国和苏联的沙文主义。通过适当的投资和工业援助，爱沙尼亚应该能够比波罗的海兄弟国家更快地实现工业化和复苏。"
 NOV_sponser_infrastructure_projects:0 "资助基建项目"
 NOV_sponser_infrastructure_projects_desc:0 "爱沙尼亚的大部分地区都被茂密的森林和闷热的沼泽所覆盖。因此，它不像俄罗斯广袤的平原那么容易开发。这使得连接爱沙尼亚的各个小定居点相当令人沮丧，阻碍了我们的区域重建工作。\n\n爱沙尼亚军政府的负责人伊万·塔拉索夫将军要求我们专门投资爱沙尼亚的铁路和公路项目，以更好地连接爱沙尼亚的土地，使我们在土地上的努力更快、更容易。"
 NOV_estonian_lingustic_classes:0 "复兴爱沙尼亚语"
 NOV_estonian_lingustic_classes_desc:0 "虽然大多数爱沙尼亚人会听说读写爱沙尼亚语，但相当多的爱沙尼亚年轻人并不能流利地运用他们的母语。\n\n通过在塔林和塔尔图等主要定居点建立新的学校，我们可以帮助爱沙尼亚年轻人与他们的文化和语言重新联系起来。德国殖民统治的遗产正在迅速消退，留下的伤口正在愈合，爱沙尼亚人民正在再次崛起。"
 NOV_the_future_of_the_baltic_states:0 "波罗的海的未来"
 NOV_the_future_of_the_baltic_states_desc:0 "波罗的海国家的经济、工业和身份正在迅速恢复。这一点尤其令人欣慰，因为再过一代，这些地区，尤其是立陶宛和拉脱维亚，可能会完全被德国化，被时间所遗忘。鉴于这一点，现在是时候确定波罗的海在联邦中的地位，并为未来几十年重新绘制波罗的海地区的地图了。\n\n虽然将波罗的海国家整合为联邦州可能具有战略地位和温水港的优势，但一些人认为波罗的海民族应该有机会最终自主统治，无论是作为一个波罗的海联盟还是分为各自的国家。\n\n波罗的海国家的未来会是怎样的？"
 NOV_rebuilding_belarus:0 "重建白俄罗斯"
 NOV_rebuilding_belarus_desc:0 "明斯克是前苏联首个沦陷的城市，甚至比里加还要早。白俄罗斯人民在纳粹的压迫下受苦时间比前苏联其他地区的人民更长。他们失去了领土，布列斯特被完全殖民，他们引以为傲的白俄罗斯合作者以其残酷性闻名，甚至对自己的人民也毫不留情。\n\n白俄罗斯的当地人民遭受了严重的压迫，数百万人在不人道的工作条件和定额下被处决。尽管“东部总计划”失败了，白俄罗斯人民仍然不得不忍受作为人民的权利的丧失，并在自己的国家中经历种族隔离和企图屠杀的苦难。东方领内战和第二次西俄罗斯战争使白俄罗斯的情况变得更糟，因为土地争夺的冲突日益激烈，平民不可避免地（或故意地）卷入了交火之中。\n\n白俄罗斯的情况已经发生了变化，变得更好了。战胜第三帝国的俄罗斯联邦已经来到这里，以纠正一切。人民再也不必畏惧盖世太保了。他们不再被视为次人，而是作为俄罗斯的三个姐妹之一，与我们的乌克兰兄弟姐妹一起。"
 NOV_the_city_of_minsk:0 "白俄罗斯的心脏"
 NOV_the_city_of_minsk_desc:0 "明斯克对白俄罗斯就如同莫斯科对俄罗斯一样。明斯克市是白俄罗斯民族的心脏，使其能够发挥其文化、政治和经济的力量。\n\n最近，这座城市已经成为一片废墟。即使在东方领内战之前，这座城市已经变成了它曾经的残骸。明斯克最新、最好的社区都为众多的德国殖民者所保留。紧挨着他们的是一群新兴的法西斯主义合作者，他们背叛了自己的人民。与此同时，无辜的白俄罗斯人被排斥到犯罪和疾病滋生的贫民区中。\n\n这种情况不能容忍！\n\n通过适当的时间和资本投入明斯克的重建工作，我们可以将这个充满对比的令人沮丧的城市变成白俄罗斯以及整个东欧人民的新希望。"
 NOV_rebuild_the_schools:0 "重建学校"
 NOV_rebuild_the_schools_desc:0 "自从1942年苏联战败以来，由于学校遭到轰炸，再加上很大一部分人口沦为德国的奴隶，白俄罗斯人变得越来越文盲。\n\n在东方领的统治下，现存的学校只保留给德国移民的孩子，以确保下一代白俄罗斯人与他们的文化相隔绝，这样他们就不会敢于反抗德国人的统治。\n\n白俄罗斯的孩子应该得到他们应得的教育。现在是时候向白俄罗斯的所有儿童开放学校，并为急需学校的地区建造新学校了。总有一天，白俄罗斯会成为一个知识与学者之国。"
 NOV_religous_rebirth:0 "复兴东正教"
 NOV_religous_rebirth_desc:0 "当人造的东方领统治着白俄罗斯人民时，国家强制的新教几乎摧毁了白俄罗斯的东正教。\n\n随着白俄罗斯从德国的统治下解放出来，东正教残余在白俄罗斯大举回归。随着破碎的人们在主里找到安慰和希望，各地的教堂和大教堂都在重建。我们可能是一个世俗国家，但宗教重生就在我们眼前，我们应该做德国人拒绝做的事情，并在政府援助下尊重他们的信仰。"
 NOV_dreams_of_freedom:0 "自由之梦"
 NOV_dreams_of_freedom_desc:0 "即使在长时间遭受来自立陶宛、波兰，最后是德国的压迫和劳累之前，白俄罗斯人民一直渴望摆脱压迫者的束缚。在那些痛苦而受苦的年头之后，最终希望终于来临。\n\n白俄罗斯人民应当在自己的国家里自由，不必害怕因为表达自己或被迫离开家人而沦为奴隶。自从瓦西里·舒克申就任联邦总统以来，他承诺自由高于一切，他会履行诺言。\n\n白俄罗斯人民应当得到更好的，比德国更好，比国王更好，比苏联更好，比沙皇更好。\n\n东欧应当得到更好的。"
 NOV_belarusian_industrialism:0 "白俄罗斯工业"
 NOV_belarusian_industrialism_desc:0 "白俄罗斯人民向来是坚韧的一族，然而他们的土地在数百年间一直是农业区域，受到冷漠的波兰和立陶宛国王的统治，随后俄罗斯沙皇们也无视了这片土地。苏联试图工业化该地区，但德国的征服结束了这些努力，白俄罗斯不得不沦为农业开发和以奴隶制为基础的小型工业基地。\n\n如今，白俄罗斯人民面临着少有的机会，更不用说相较于联邦其他地区，该地区的发展落后。\n\n我们可以改变这一切。通过适当的工业和经济援助，白俄罗斯人民终将能够重返工作岗位，摆脱被专员辖区强制推行的贫困，这是他们长期以来所经历的。"
 NOV_transnational_railway:0 "白俄罗斯铁路"
 NOV_transnational_railway_desc:0 "白俄罗斯地方军事长官鲍里斯·富利克向总统提出了一项新的建议，旨在帮助白俄罗斯经济复苏，并使这个困扰国家的地区摆脱贫困。\n\n他认为通过重建和扩展白俄罗斯的铁路系统，并将国家所有主要定居点连接成一个高效的铁路网络，与俄罗斯和其他联邦国家建立联系，城市将能够更好地协调重建工作，并更轻松地移动重要资源。\n\n总统渴望能在该地区帮助重建并实现长期经济发展，因此接受了这个提议。现在我们要做的就是实施它，并将我们的努力投入到建设白俄罗斯铁路的事业中！"
 NOV_future_of_belarus:0 "白俄罗斯的未来"
 NOV_future_of_belarus_desc:0 "对白俄罗斯来说，这是一条漫长而艰难的道路，但经过多年的苦难，白俄罗斯人民终于找到了自由。\n\n随之而来的是他们在联邦中的地位问题。\n\n白俄罗斯几乎从未有过自己的独立运动，并且非常认同俄罗斯。尽管语言略有不同，但我们的人民可以相互理解。消除这些武断的障碍并成为一个俄罗斯人难道没有意义吗？\n\n尽管如此，其他人仍认为我们应该释放这些从未有过自己国家的人。\n\n此外，我们需要考虑这与波罗的海地区和乌克兰的关系。如果我们决定将波罗的海三国直接纳入我们的联邦，那么白俄罗斯的主权问题就变得更加重要，以避免出现不匹配的边界。"
 NOV_the_return_of_the_falcon:0 "猎鹰归来"
 NOV_the_return_of_the_falcon_desc:0 "民主已经失败，波克雷什金总统再次掌权以保护我们战败的国家。尽管显然需要一位强有力的领导人，但每个主要城市的人民都在反抗，我们已经听到了潜在起义和叛逃者的消息。我们可能做什么？"
 NOV_declare_a_state_of_emergency:0 "宣布紧急状态"
 NOV_declare_a_state_of_emergency_desc:0 "为了稳定联邦，波克雷什金全俄罗斯联邦进入紧急状态，采取一系列措施，包括暂停民主和实行戒严，直到俄罗斯的秩序得到恢复。鉴于波克雷什金作为一个威权主义领导人的历史，数百万俄罗斯人肯定会对这一举动表示愤怒，认为这是波克雷什金撕毁舒克申总统遗产并重新巩固自己统治的借口。\n\n这些傻瓜！他们看不见他的朋友失败了吗？俄罗斯失败了吗？现在唯一剩下的是确保混乱得到遏制，为一个繁荣的俄罗斯创造任何希望，即使永久与莫斯科分离。\n\n但人们并不在乎，他们不相信波克雷什金，他们将为了自由而行军——但他们却走向了俄罗斯的毁灭！"
 NOV_russia_in_chaos:0 "混乱"
 NOV_russia_in_chaos_desc:0 "全国各地发生的骚乱的后果导致多次叛乱爆发。\n\n在远东，布尔什维克的残余分子正在推翻地方长官并宣布成立新的苏联。在整个中亚，各个大城市都爆发了民族叛乱，叶利钦那个喝醉了的傻瓜还号召建立西西伯利亚共和国。\n\n尽管我们做了一切，但我们无法阻止历史重演。我们注定要失败吗？"
 NOV_all_that_remains:0 "回到原点"
 NOV_all_that_remains_desc:0 "尽管联邦为此付出了一切努力，但俄罗斯最近的政治和社会混乱，再加上波克雷什金暂停联邦的民主，导致俄罗斯再次分崩离析。从东方到西方，我们的两侧都是鄙视波克雷什金及其政权的敌人。\n\n舒克申对一个统​​一、自由的俄罗斯的梦想现在破灭了。剩下的就是中西伯利亚联邦。强者败北之地。"
 NOV_our_next_challenge:0 "我们的下一个挑战"
 NOV_our_next_challenge_desc:0 "随着我们在世界上的地位已经确定，现在是俄罗斯联邦再次走上国际舞台的时候了。联邦必须建立自己的文化、经济和军事势力范围，并确保我们祖国的边界安全。\n\n俄罗斯绝不能再容易受到企图征服俄罗斯人民的外国敌对势力的入侵。\n\n§R绝不。§!"
 NOV_our_eyes_to_the_east:0 "放眼东方"
 NOV_our_eyes_to_the_east_desc:0 "向东方，大日本帝国以铁腕统治着中国大地。然而，最近，随着中国各地传出反抗日本压迫、追求自由的声音越来越多，大日本帝国的掌控力正在逐渐松动。\n\n无论这些传闻是否属实，不可否认的是，大日本帝国近年来的地位已经跌落。鉴此，联邦应该利用日本的弱点，在东亚建立立足点，为即将到来的大战做准备。"
 NOV_an_alliance_with_the_clique:0 "与青海军阀结盟"
 NOV_an_alliance_with_the_clique_desc:0 "几十年来，中国大地一直处于分裂状态，中国东部大部分地区被日本统治。中国西部的情况也不容乐观。尽管该地区大部分摆脱了日本的影响，但其政府主要由专制的军阀组成，唯一的例外是[QIN.GetNameDef]。\n\n[Qin.GetNameDefCap]是国共合作前曾统治中华民国的国民党的遗民之地，也是中国共产党的大本营。虽然多年来他们一直在中国坚持下去，但他们的实力已大为削弱，目前看来注定要成为流亡政府，管理中国生产力最低的地区。\n\n国民党可能无法在不久的将来夺回整个中国，但在我们的帮助下，他们可以稳固自己在该地区的地位，并为一个黄金机遇做好准备。"
 NOV_industrial_investment:0 "中国西部的工业投资"
 NOV_industrial_investment_desc:0 "中国西部的工业潜力可能不如东部，但在西宁和格尔木等主要定居点建设新的工业设施将加强它们的经济，并使它们摆脱自中日战争以来困扰该地区的经济陈规，给予他们对他们目前的敌人有决定性的推动作用。一旦中国西部统一，我们对他们的援助不仅可以确保我们南翼有一个稳定民主的政权，还可以让我们在东亚投射力量。前进，为了民主！"
 NOV_send_modern_military_equipment:0 "支援俄制军事设备"
 NOV_send_modern_military_equipment_desc:0 "简单来说，青海政府拥有的绝大多数军事装备都已经过时了。坦率地说，其中大部分不适合该领域。如果他们有希望打败他们在中国西部的军阀敌人，更不用说解放中国了，我们必须尽快帮助他们纠正这种情况。\n\n俄罗斯联邦不乏武器装备，尤其是在与德国开战之后，我们完全有能力为他们的军队提供我们所能提供的最好的军事装备！"
 NOV_establish_the_west_chinese_republic:0 "承认西部共和国"
 NOV_establish_the_west_chinese_republic_desc:0 "国民党已经忍受了几十年的屈辱，他们先是被军阀统治，然后又被日本帝国统治。他们被逐出南京，被迫在青海省进行斗争。\n\n多年的耻辱终于要结束了。\n\n现在，国民党已经全副武装，准备统一中国西部的土地。国民党不会再忍受战败的耻辱。在俄罗斯联邦的支持下，在已故的孙中山先生的愿景下，他们将击败军阀敌人，在实现中国统一的漫长征程中迈出重要的第一步。"
 NOV_our_brothers_in_mongolia:0 "我们的蒙古兄弟"
 NOV_our_brothers_in_mongolia_desc:0 "多年来，蒙古人民一直是俄罗斯可靠的盟友，但他们却成了没有祖国的民族。虽然我们控制着北部的图瓦小省，但蒙古国土仍处于傀儡政权的占领之下，傀儡政权被一个来自大洋彼岸的帝国粗心地操纵着。\n\n我们的蒙古兄弟渴望自由，我们的总统也同情他们的愿望。我们不能释放图瓦作为一个临时共和国，但我们可以让这个省份成为蒙古人民：\n\n§R我们将创建一个统一和自由的新蒙古！§!"
 NOV_rally_the_nomads:0 "接触游牧民"
 NOV_rally_the_nomads_desc:0 "尽管[MEN.GetName]的强盗国家名义上是独立的，但日本仍对整个蒙古的许多事物保持完全控制，但游牧民不是其中之一。人民的精神，骄傲和渴望一个真正的国家称他们自己，而不仅仅是关东军的一条狗，可以被他们的前苏联同志唤醒。对[MEN.GetLeader]的抵抗将是激烈而广泛的，尽管出于军事战略的考虑，我们将把它集中在西部地区。我们的盟友不会是自由民主派，因为该地区几乎没有自由民主派，但我们的目标不是强加于人，而是帮助人民获得自由。"
 NOV_friends_in_ulaanbaatar:0 "乌兰巴托的朋友"
 NOV_friends_in_ulaanbaatar_desc:0 "尽管乌兰巴托牢牢地处于伪装者[MEN.GetLeader]的统治之下，但我们的总统在这座城市中有朋友，有权有势的朋友可以团结被压迫的蒙古人民并带领他们走向胜利。\n\n我们应该联系该地区的民主社会主义者那楚克·巴嘎班迪，告诉他我们的使命是将蒙古从日本及其傀儡国家蒙疆的帝国统治下解放出来。在他的帮助下，布尔什维克残余分子可以被唤醒来支持我们的事业——前提是我们向他们保证在新民主主义中有公平的机会。\n\n我们将为一个自由的蒙古共和国而战，让所有人都能表达自己的信仰，并免于经济剥削！"
 NOV_the_mongolian_rebellion:0 "蒙古起义"
 NOV_the_mongolian_rebellion_desc:0 "日本帝国压迫蒙古已经够久了。 任何国家都不应再忍受如此可怕的痛苦——那种俄罗斯非常了解的痛苦。 随着东方的旭日帝国被他们日益不服从的中国傀儡分散了注意力，现在是时候呼吁那楚克将中蒙古人民团结在他身后，开始对东方占领者的反抗。\n\n在游牧民族的共同努力和俄罗斯联邦的支持下，一个自由的蒙古国终于触手可及！"
 NOV_our_eyes_to_the_west:0 "放眼西方"
 NOV_our_eyes_to_the_west_desc:0 "尽管被打败了，德国人仍然在经济和军事上牢牢控制着欧洲许多民族。由于德国在第二次西俄战争中战败而陷入混乱，联邦有机会将其影响力扩展到西方并为欧洲受压迫的人们带来自由。我们将使人民摆脱德国统治，一次一个国家！"
 NOV_memories_of_poland:0 "波兰的旧时回忆"
 NOV_memories_of_poland_desc:0 "尽管我们长期以来一直是竞争对手，波兰人一直被视为俄罗斯人的表亲，尤其是近年来如此。和我们一样，波兰曾被德国人征服。他们被背刺，数百万人被杀害，土地被殖民。像我们一样，波兰民族抵抗了德国人，但与俄罗斯不同，波兰很快又被纳粹德国击败。\n\n每一天，波兰的记忆渐渐消失在默默无闻中，波兰人的力量不断削弱，而德国人继续殖民波兰的残余领土。然而，随着纳粹德国的失败，新的机会出现了。\n\n在得到适当的俄罗斯援助下，我们可以帮助重建波兰的国内军队，帮助该国摆脱德国的统治，而“欧洲霸主”自身却一直受到国内问题的困扰。很快，我们斯拉夫兄弟将再次与俄罗斯站在一起，最终摆脱长期统治其土地的纳粹威胁。"
 NOV_rebuild_the_home_army:0 "重建家乡军"
 NOV_rebuild_the_home_army_desc:0 "尽管在60年代他们的国家再次落入纳粹军队之手后已经分裂和破碎，但波兰本土军队是我们能够以任何合法性方式解放波兰的唯一希望。\n\n他们现在可能没有力量解放自己的家园，但通过俄罗斯的物质支持和军事顾问的每一步协助，家乡军将再次崛起并最终能够击退纳粹九头蛇。\n\n§R这将是最后一次。§!"
 NOV_destablise_the_general_gouvernement:0 "渗透德国机构"
 NOV_destablise_the_general_gouvernement_desc:0 "无论德国人如何称呼它，无论是总督府还是专员辖区，波兰人民一直备受压迫，他们的语言和文化在多年的劳役、可预防的疾病和肮脏环境中逐渐消失。他们被迫离开自己的家园、母语和尊严。然而，这并非没有后果。\n\n德国人制造了一个广泛的怨恨和愤怒的幽灵，我们可以利用它来造成动荡不安。通过我们的情报机构和与波兰抵抗分子的联系，我们可以破坏政府，为我们最终的干预做准备。然而，在接近最后阶段时，我们需要有人来带领人民团结起来。\n\n§R幸运的是，我们有合适的人选。§!"
 NOV_the_krakow_uprising:0 "克拉科夫起义"
 NOV_the_krakow_uprising_desc:0 "克拉科夫的人民，波兰的同胞们！家乡军仍然顽强地矗立着！纳粹国防军四分五裂，德国人已经虚弱不堪！你们摆脱纳粹暴政的机会终于来了！拿起你们的武器，召集你们的战友，准备好殊死搏斗吧！\n\n§R起义吧，克拉科夫！§!"
 NOV_remnants_of_armenia:0 "亚美尼亚的残余"
 NOV_remnants_of_armenia_desc:0 "曾经属于俄罗斯帝国，后来成为苏联的一部分，亚美尼亚经历了由土耳其的灰狼组织主导的恐怖统治。即使在第一次世界大战后试图对亚美尼亚人进行种族灭绝之后，第五检查总局仍将数百万亚美尼亚人驱逐到干旱的黎凡特地区，并引发了一场被血腥镇压的大起义。\n\n尽管土耳其过去失败了，但如果不采取措施拯救亚美尼亚人民免受土耳其的压迫，灰狼组织有一天可能成功消灭亚美尼亚人民。\n\n这是不可接受的，我们不能袖手旁观这明显的种族灭绝！联邦不能坐视我们的人民遭受亚美尼亚人所受的待遇。我们必须尽力解放亚美尼亚人民，确保亚美尼亚的古老身份和文化得以延续。"
 NOV_send_in_russias_monster:0 "派遣我们的特工"
 NOV_send_in_russias_monster_desc:0 "我们在[TUR.GetNameDef]中有几个深入潜伏的情报特工。凭借他们的帮助，我们可以深入了解该国的状况、军队、弱点等等。更重要的是，我们可以与剩余的游击队和自由斗士联系起来。我们将不会与极端民族主义者或类似人士合作，但我们最近的成功为帮助争取亚美尼亚解放的民主运动创造了很多机会。如果我们承诺他们在新政府下会被人道地对待，这一运动将更有成功地赢得犹豫不决的人们的支持，甚至包括该地区的一些土耳其人。\n\n通过在信息和舆论战中占据上风，我们可以抵消土耳其人通常拥有的优势，并为再次引发亚美尼亚起义奠定基础。"
 NOV_fund_the_rebels:0 "资助叛军"
 NOV_fund_the_rebels_desc:0 "就像克罗地亚的游击队一样，剩余的亚美尼亚叛军在山区幸存下来。然而，随着亚美尼亚人民开始对抵抗失去信心，被迫逃亡或成为同类中的最后一人，他们的力量和人数正在步履蹒跚。对叛军来说幸运的是，他们现在可以使用俄罗斯联邦的大量资源——前提是他们遵守某些标准。\n\n亚美尼亚人致力于民主并配备了我们所能提供的最好的装备，他们可以扭转局势并击退土耳其军队，为亚美尼亚从土耳其暴政中解放出来的崇高事业带来新的希望。"
 NOV_the_armenian_revolution:0 "亚美尼亚起义"
 NOV_the_armenian_revolution_desc:0 "凭借我们的慷慨资助、我们的情报人员和我们的谨慎监督，亚美尼亚叛军正在迅速壮大。由于土耳其比以往任何时候都更加孤立，亚美尼亚领导人已与我国政府接洽，要求联邦支持他们对土耳其政府进行全面的民主革命。由于德国仍处于混乱之中，现在是打击土耳其帝国残余并解放亚美尼亚人民的最佳时机。\n\n§Y让革命开始吧！§!"
 NOV_the_cosmonaut:0 "宇航员"
 NOV_the_cosmonaut_desc:0 "谁会行走在与我们自己的世界如此不同的遥远世界？ 谁将成为游历无限宇宙的星辰传奇？ 会是美国宇航员吗？ 还是德国人？不，群星间的旅行者将成为我们祖国的象征。\n\n§B勇敢的宇航员！§!\n\n凭借着旨在保护穿着者免受太空危险同时确保最高机动性的新一代太空服，俄罗斯宇航员将成为星际探索的代言人，因为联邦将人类推向未来。"
