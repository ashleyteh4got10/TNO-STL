 NOV_rebuilding_ukraine:0 "重建乌克兰"
 NOV_rebuilding_ukraine_desc:0 "乌克兰，欧洲的面包篮，被折磨得满目疮痍，其大部分基础设施和农田都被毁坏。在德米特里·格林卡的领导下，乌克兰的局势得以保持相对稳定，但如果没有俄罗斯联邦的援助，该地区的重建将步履维艰。\n\n欧洲各地数以百万计的人依靠乌克兰的收成来填饱肚子。我们必须尽快使乌克兰的农业生产恢复运作，否则整个东欧都将可能爆发一场饥荒。"
 NOV_load_vrpp_tree:0 "加载§Y全俄爱国党国策树§!"