 NOV_german_autonomous_zone_desc: "这一地区以德国人为主，他们几乎完全控制着自己的事务，享有自己的议会，并被允许制定自己的法律。\n\n虽然这让当地的俄罗斯人不高兴，也造成了大量的花费，但时间会告诉我们，这是否是更好的选择。"
 NOV_volga_german_autonomous_zone: "伏尔加沿岸自治区"
 NOV_volga_german_autonomous_zone_desc: "这个地区在历史上有着众多的德国族裔人口，如今已被授予几乎完全控制自己事务的权利。他们有自己的议会，可以制定自己的法律，并且允许使用他们现在受保护的德语方言。\n\n虽然这使得当地的俄罗斯人以及邻近的州内的俄罗斯人感到不满，但我们认为这是较小的恶。\n\n如果我们降低自己的道德水平，驱逐那些在这里生活了几个世纪的人，那我们岂不是和他们一样恶劣？"
