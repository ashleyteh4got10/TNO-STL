l_simp_chinese:
 NOV_koryagin_peace_is_possible:0 "和平是可能的"
 NOV_koryagin_peace_is_possible_desc:0 "新上任的科里亚金总统有很多反对者。有人说他对和平与繁荣的愿景只是一个傻瓜的任务，只是一个毫无根据的理想，以此吸引易受欺骗的民众的支持。这些愤世嫉俗者可能出于保护联邦免受无意义和破坏性政策的意图，但这并不能减轻他们的误导。\n\n科里亚金总统已经提出了一套全面的政策，旨在带来一个新时代的和平。在国内，减少军事开支、增加社会开支以及分散经济和国家的权力将成为国内政策的关键点，而国际合作和深化与OFN的关系将成为外交事务的基础。总统可能面临艰巨的任务，但他已经准备好坚持下去。"
 NOV_koryagin_prepare_our_diplomats:0 "准备好我们的外交官"
 NOV_koryagin_prepare_our_diplomats_desc:0 "随着我们设定目标并明确意图，是时候迈出完全将联邦纳入自由世界的第一步了。\n\n科里亚金总统和科瓦列夫外交部长将前往民主世界各地，巩固我们对国际合作和和平的承诺，而在国内，我们的政治家将为了保护我们的议程而进行殊死搏斗，抵御£GFX_NOV_DSPR_Icon §P社会主义§!鼓动者和£NOV_VRPP_Icon §g保守势力§!的反扑。£NOV_RSLP_Icon §M社会自由党§!始终以俄罗斯的最大利益为出发点，即使需要一些……说服工作来使人们接受，我们也必须提醒我们的人民。"
 NOV_to_golmud:0 "前往格尔木"
 NOV_to_golmud_desc:0 "中国的西部地区数十年来一直是中国自由的最后堡垒。然而，在努力恢复国家自由的同时，他们在外交上一直处于孤立状态，并与世界隔绝，只得到了来自OFN的少量承认和援助。这种状况不能再继续下去了。\n\n科里亚金总统将对中国自由之都格尔木进行国事访问。发送这样的和平之礼必将使联邦在亚洲获得更强大的外交影响力，并迫使东方的太阳和它的傀儡重新考虑他们在该地区所谓霸权的状况。也许，我们甚至可以让OFN在除了提供少量武器之外，进一步援助他们。如果我们对亚洲的和平追求要扩展开来，就必须从这里开始。"
 NOV_to_washington:0 "前往华盛顿"
 NOV_to_washington_desc:0 "自从第二次世界大战结束以来，美国毫无疑问一直是自由世界的领袖。\n\n我们对纳粹暴政力量的惊人胜利铸就了我们联邦的民主理念，为未来多年奠定了基础，实现了几十年前美国无法做到的事情。在科里亚金的外交专长和我们几乎无穷的国际善意的支持下，我们将派遣我们的总统前往自由之地，促进我们伟大的联邦与美利坚合众国之间的新平等伙伴关系的建立。"
 NOV_to_delhi:0 "前往德里"
 NOV_to_delhi_desc:0 "印度共和国在所谓的“文明西方”的统治下遭受了许多苦难。从残酷的殖民镇压到大规模的致命饥荒，印度次大陆见证了欧洲帝国主义最严重的过度行为。\n\n俄罗斯曾被冠以“帝国”的称号，但如今已经在“联邦”的名义下重生，迈入了新时代的民主之门。过去所谓的“大博弈”的日子早已远去，我们必须与德里站在平等的基础上前进，因为东方的一个民主盟友可能成为对抗日本帝国主义的关键时刻。"
 NOV_brothers_through_suffering:0 "患难兄弟"
 NOV_brothers_through_suffering_desc:0 "同盟国的故事是一部苦难、挑战和最重要的是信念的故事。数以百万计的人仍然记得纳粹卐字旗飘过红场的那一天，或者英伦群岛的疏散，这成为他们对第二次世界大战的定义形象。纵使英勇而终究无望的联军抵抗，面对着无法阻挡的法西斯主义统治。\n\n不容否认，自那时以来，俄罗斯承受了纳粹种族灭绝帝国主义的沉重打击，数百万人因德国的\"生存空间\"而丧生。然而，如果没有自由国家组织的坚定抵抗作为我们抵御死敌的统一灯塔，那又将有什么阻挡轴心国实现全球霸权？\n\n我们的当前崛起在很大程度上要归功于华盛顿的顽强抵抗，正如华盛顿要归功于我们持续的奋斗而推翻帝国的霸权。联军如今以目标和力量团结一致，比以往任何时候都更加强大。我们不仅因意识形态的决心而团结一致，更因那些长眠在我们土地下的士兵而共同奋斗。"
 NOV_partners_through_circumstance:0 "经济合作伙伴"
 NOV_partners_through_circumstance_desc:0 "虽然我们与大洋彼岸的美国同行之间存在着强烈的意识形态纽带，但最终是我们的经济和军事地位使我们的关系保持平等。\n\n在军阀时代，西罗维基主张增加与OFN的贸易联系，希望提升主宰我们经济的诺沃西比尔斯克企业集团的实力和认可，直到第二次西俄战争。\n\n如今，我们的联邦在欧洲屹立不倒，而OFN并不急于放弃潜在的利润。在科里亚金总统的领导下，我们将推动经济关系达到新的高度，共同壮大美元和卢布。"
 NOV_our_place_in_the_free_world:0 "我们在自由世界中的地位"
 NOV_our_place_in_the_free_world_desc:0 "我们的时代已经到来。科里亚金总统，曾经被认为只是一个天真的理想主义者，不适合管理一个像联邦这样人口众多、国土辽阔的国家，如今不仅赢得了自己人民的支持，还赢得了整个民主世界的支持。\n\n从新西伯利亚联邦议会大厅直播的消息显示，我们将加入自由国家组织，这将在不仅仅是俄罗斯，还有美国的每个电视屏幕上广为传播。我们的政治家们将与美国的对应人士握手，而街道上的欢呼声和摄像机的滚动镜头将实时展示我们对自由和繁荣的国际事业的承诺，正如我们在总统任期初所承诺的一样。"
 NOV_koryagin_scale_back_military_spending:0 "缩减军费开支"
 NOV_koryagin_scale_back_military_spending_desc:0 "俄罗斯全军是联邦的骄傲之师，对抗一切意欲摧毁联邦的敌人，以及解放俄罗斯免于纳粹之暴政，历经历史而存在。然而，随着变革的风潮不断席卷整个联邦，全军坚定的职责变得越来越不必要。\n\n军费开支已经变成了一个无底洞，成为亿万稀缺卢布的倾泻之地。继续如此草率地浪费这些资金将是一种不负责任的行为。军事预算将被大幅削减，并流向其他计划。虽然这会激怒全俄爱国党和更强硬派的农工党，但这是未来之路所必需的先决条件。"
 NOV_koryagin_promote_decentralisation:0 "促进权力下放"
 NOV_koryagin_promote_decentralisation_desc:0 "伟大的联邦自成立以来一直在与权力和控制的集中化斗争。在波克雷什金的领导下，大型企业和精英阶层主导了经济的方方面面，虽然舒克申采取了许多措施来削弱企业的影响力，但它们对我们国家的经济运作仍然过于重要。\n\n尽管工业巨头有其存在的价值，但它们并不应该成为整个国家经济的主导力量。工业和商业应该被分散和经济上下放到小公司和企业中。我们国家将不再被企业主导和过多的政府监管所拖累，这些监管旨在支持它们的盟友。市场将至高无上地自由运转。"
 NOV_koryagin_no_price_too_high:0 "压低物价"
 NOV_koryagin_no_price_too_high_desc:0 "我们人民的繁荣始终是科里亚金总统国内政策的首要目标。在追求和平世界的过程中，不能忘记俄罗斯公民，这必须在联邦的经济和社会福利中得到体现。\n\n保护我们人民免受贫困困扰的政府计划对于国家而言是绝对必要的，必须大规模扩展。这些计划将不可避免地产生成本，但可以通过重新分配其他政府部门（如军事部门）的预算来弥补部分成本。无法承诺这些成本能够完全弥补，但联邦的人民必须优先考虑，而不是一些微不足道的卢布。"
 NOV_koryagin_no_challenge_too_great:0 "迎难而上"
 NOV_koryagin_no_challenge_too_great_desc:0 "和平之路上没有可以忽视的手段。全球合作必须超越外交，涉及文化、经济，尤其是科学领域。如果全人类进步的全球努力要取得成功，必须得到全世界各国的支持。\n\n我们应当积极与那些开拓科学发展的国家展开国际合作。研究的协调和科技成果的共享将推动科学进步速度空前提升。人类将共同展望未来，追求所有梦想美好明天的人们的福祉，我们团结一致，定能成功。"
 NOV_shukshins_heart:0 "舒克申之心"
 NOV_shukshins_heart_desc:0 "瓦西里·舒克申无疑是我们联邦中最受欢迎的人物。在他的领导下，俄罗斯成功地证明了无人能想象的事实，摧毁了民族社会主义巨人，并解放了那些生活在殖民地国家的被奴役人民。\n\n虽然他与科里亚金总统的“盲目理想主义”立场相对立，但这位前作家对我们追求和平的事业表达了同情之情。考虑到他目前并无明确竞选意向，将他庞大的支持基础利用于我们的利益可能是明智之举。"
 NOV_kantorovichs_mind:0 "康托罗维奇之脑"
 NOV_kantorovichs_mind_desc:0 "在所有组成舒克申初始联盟的政党中，没有哪个政党与康托罗维奇的£GFX_NOV_DSPR_Icon §P民主社会党§!联系更为脆弱！他们笨拙的经济策略和过度热衷的开支使他们成为了舒克申政策的坚决反对派，称这些政策远远不够。然而，科里亚金总统认为有妥协的余地，特别是与£NOV_RAPP_Icon §B农工党§!相比，我们更偏左。\n\n如果我们的政策要成功，我们必须团结所有反对£GFX_NOV_VRPP_Icon §g全俄爱国党§!和新生民主的人的支持。£NOV_RSLP_Icon §M社会自由党§!在杜马中仍然是一个不起眼的政党，所以即使犹豫不决，我们也必须追求£GFX_NOV_DSPR_Icon §P民主社会党§!的支持。我们必须找到共同点，为和平和普通人民而努力。"
 NOV_expand_the_republics:0 "扩大共和国"
 NOV_expand_the_republics_desc:0 "在俄罗斯联邦的早期时期，新西伯利亚和巴尔瑙尔采用了我们国家建立之初的联邦治理模式，作为一种在战争时期简化管理的务实方法。然而，如今它有了不同的目的。俄罗斯的众多少数民族和人民呼吁实现自决自由，而我们有责任将其给予他们。\n\n波克雷什金提出的仅仅是实际管理分割的愿景必须真正地彻底被抛弃。我们伟大联邦中的共和国和其他自治省份将最终获得他们应有的自治权，并被赋予选择自己命运的权利。虽然他们将在我们的联邦体制下遵守最重要的国家法律，但这些自治共和国将最终摆脱中央过度干涉。作为自由公民，他们享有自主管理的权利，就像其他人一样。"
 NOV_a_trip_to_barnaul:0 "巴尔瑙尔之旅"
 NOV_a_trip_to_barnaul_desc:0 "巴尔瑙尔是构成联邦初始领土的双子之一，虽然如此，它在我们伟大政府的传统中并不是不重要。这座城市保存着大量政府历史和文件，可能对科里亚金总统的政策议程有所帮助。\n\n如今，总统最初和最紧迫的政策已经开始实施，他将回到舒克申反对西罗维基开始的地方。联邦继续展望未来，但我们必须尊重它的起源，而巴尔瑙尔是最好的选择。"
 NOV_amending_our_wrongs:0 "修正我们的错误"
 NOV_amending_our_wrongs_desc:0 "我们的联邦并不是没有缺陷的国家。为了统一俄罗斯，我们犯下了许多可怕的罪行，其中大部分是在波克雷什金和他那暴虐的统治下发生的。最明显的例子发生在20世纪60年代初，当时社会主义民粹派运动被采取了残酷而无意义的镇压手段，完全忽视了人民的需求。\n\n科里亚金总统决定不能忘记或不予赎罪这种令人恶心的罪行。对于这次打压行动的受害者，将立即给予追赠赦免和正式道歉。这可能不会得到联邦的§g反动派们§!的好评，但这是道义上的必要。我们也许永远无法从我们的失败中抹去污点，但我们可以尝试寻求宽恕。"
 NOV_opportunity_for_all:0 "机会均等"
 NOV_opportunity_for_all_desc:0 "一个国家的自由程度最好的衡量标准莫过于其公民所拥有的机会。给予自由人公平成功的机会是所有人的权利，然而联邦在向人民提供这种权利方面一直未能达到要求。\n\n新的公共工程项目和其他帮助那些在我们街头挣扎的人的手段将在接下来的几周内推出。对于那些为自己和家人提供食物而苦苦挣扎的人们，尤其是那些在和平到来后失业的退伍军人，将提供经过最大效益测试的援助。如果联邦要发挥其最大潜力，当然必须合理地给予所有人一个机会。"
 NOV_koryagin_the_quest_for_peace:0 "寻求和平"
 NOV_koryagin_the_quest_for_peace_desc:0 "科里亚金总统在为实现世界和平的斗争中取得了令人难以置信的进展。联邦如今真正成为自由世界的一部分，其经济和管理比以往任何时候都更加摆脱了不必要的控制和规定。俄罗斯在成为一个更加自由、更加繁荣的国家方面取得了巨大的进步，远超以往。\n\n有些人称总统的议程是无法实现的，只是一个永远无法实现的理想，但这些唱衰者已经被证明是错误的。联邦已经达到了比以往任何时候更高的高度，而没有流血、冲突或不必要的痛苦。科里亚金总统继续为一个真正和平的国家和世界而努力，但有一件事变得清楚起来：\n\n§M他只是刚刚开始而已。§!"
 NOV_the_koryagin_presidency:0 "科里亚金任期"
 NOV_the_koryagin_presidency_desc:0 "£NOV_RSLP_Icon §M俄罗斯社会自由党§!主席安纳托利·科里亚金在俄罗斯大选中获胜，被宣布为俄罗斯联邦总统！在经历了数十年的国内外战争之后，新的和平时代即将到来，现在是总统向人民发表讲话并向俄罗斯和世界概述其议程的时候了。"