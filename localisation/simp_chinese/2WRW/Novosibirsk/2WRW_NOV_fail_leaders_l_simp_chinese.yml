l_simp_chinese:
 NOV_Koyanto:0 "科扬托"
 POLITICS_NOV_Koyanto_DESC:0 "科扬托（原名弗拉基米尔·弗拉基米罗维奇·科西金）远离了俄罗斯政府的所有目光。他看着新西伯利亚的政府举行了关于总统的彩带游行，并在他自己的人民挨饿和枯萎时实施了大规模的土地改革。在这段时间里，科扬托成为科瑞亚克人民的拥护者，希望让人们知道他的人民的困境。\n\n随着他的倡导和艺术成为聋子的耳朵，科扬托变得更加愤怒。他在堪察加的一个俄罗斯海军基地与村里的人们一起举行了大规模示威活动，鼓动数千名同胞采取行动。在抗议活动中取得胜利后，当地官员与科扬托达成协议，向他们提供医疗用品和食物，以帮助他们度过严寒的冬季。科瑞亚克人民为这场反抗冷漠无情的联邦的胜利而欢庆，甚至为军队西进对抗大日耳曼国而欢呼。他的人民在联邦停滞不前时屏住了呼吸，在联邦垮台时痛哭流涕。"
 NOV_Rytgev_Rytkheu:0 "瑞特盖夫·瑞特舍乌"
 POLITICS_NOV_Rytgev_Rytkheu_DESC:0 "瑞特盖夫·瑞特舍乌，俄罗斯当局称其为尤里·谢尔盖耶维奇·瑞特舍乌，1930年出生于楚科奇的血统之中，他的家族是位于乌伦边远地区的捕兽者和猎人，正处于俄罗斯边界和阿拉斯加边界交汇之处。瑞特舍乌渴望成为一名作家，并希望在列宁格勒学习，但在贫困和不幸的第二次世界大战中，他被迫应对德国人在远东引发的混乱局面。\n\n随着统一的俄罗斯，俄罗斯的权威重新回到了该地区，并为瑞特舍乌带来了机会。他想成为作家的梦想从未离开过他，舒克申推动少数民族文化的新教育举措为他提供了丰富的机会，他可以用自己的语言写作，甚至将俄罗斯的文化作品翻译成楚科奇语。瑞特舍乌在实现自己的梦想的同时，也在俄罗斯境内传播了自己的语言和文化。\n\n随着舒克申在对德国的战败后垮台，楚科奇人民再次陷入混乱的边缘。作为一个被遗忘的民族，瑞特盖夫·瑞特舍乌被迫确保他的人民的自由，这一次是永久性的。他不再只是苟延残喘和失望的书籍销售，而是追求拥有一个独立于俄罗斯影响的家园。"
 NOV_Vladimir_Kibardin:0 "弗拉基米尔·基巴尔丁"
 POLITICS_NOV_Vladimir_Kibardin_DESC:0 "要激发人们的信仰，就必须有一个值得为之奋斗的事业。\n\n对于弗拉基米尔·基巴尔丁来说，那个事业就是拯救俄罗斯。在残酷的动乱期间，他与沃兹德一起在马加丹战斗，坚定地坚持着反对德国人的RFP派别所倡导的传统而务实的法西斯主义信仰。作为马特科夫斯基的忠实仆人，基巴尔丁认为他创新的政治头脑和个人魅力足以引领俄罗斯走向一个新时代。然而他错了。\n\n沃兹德在改革派和寄生虫的压力下屈服于自己的内心魔鬼，他们扭曲和颠覆了他的权力。马加丹沦陷了，俄罗斯人民的任何拯救希望也随之破灭。舒克申政府的软弱以及随之而来的民主使垂死的俄罗斯熊再次四分五裂，正如基巴尔丁所预见的那样。他等待着，在阴影中等待时机，召集俄罗斯最后的真正之子，最后一次拼命抓住命运。\n\n俄罗斯的命运是要强大起来，让她的敌人乞求拯救与宽恕。只有在基巴尔丁的领导下，才有这个未来的希望。如今，他扎根于马加丹的RFP新领袖位置，他曾经崇拜的那个人正在恳求美国人和雇佣兵的帮助，而他将会统治。他将不会偏离这条道路。他将成为俄罗斯的指引之光。在他走过的地方，马加丹将会紧随其后。"
 NOV_Matvey_Innokentevich_Amagaev:0 "马特维·伊诺肯捷维奇·阿马盖夫"
 POLITICS_NOV_Matvey_Innokentevich_Amagaev_DESC:0 "有时候，生活就是关于在正确的时间出现在合适的地方。\n\n对于马特维·伊诺肯捷维奇·阿马盖夫来说，在1921年被选为布里亚特委员会副主席纯属偶然。作为布里亚特民族的一员以及师范学院的成员，他的背景使得他的候选人地位受益匪浅。他致力于改善苏联与布里亚特人民之间的关系，同时制定农业和行政计划。随着苏联的兴衰，正是马特维卓越的才智和非传统的政治方法使他始终处于布里亚特地区政策及其在联盟中的地位的前沿。即使在苏联解体时期，马特维在政府中的角色依然存在，他竭尽所能在战争和饥荒之中改善普通人的生活。当联邦从苏联的废墟中崛起时，人们对一个更美好的俄罗斯充满了希望。\n\n然而，这样的希望是错误的。\n\n如今，分裂和破败，联邦已经沉入战败和混乱的尘埃中，没有人能够保护布里亚特人民。尽管他进入政治的方式出人意料，混乱的炉火可以将一个人锻造成他必须成为的样子。布里亚特人民时至今日首次需要一位领袖。马特维·伊诺肯捷维奇·阿马盖夫必须成为那个领袖，否则他的命运将与古老的俄罗斯一样。"
 POLITICS_NOV_Anatoly_Marchenko_DESC:0 "马尔琴科出生在卑微的家庭。他是一位文盲火车司机和火车站看守的儿子，在诺沃西比尔斯克州的童年时光中，他不得不忍受第二次世界大战的恐怖。随着他逐渐成长，俄罗斯分崩离析、四分五裂的艰辛局面正逐渐安定下来。随着人们变得愈发绝望，食物变得稀缺。在这段时间里，马尔琴科成了油田的奴隶。一切都将在舒克申重新统一国家时发生改变。\n\n舒克申带来了希望，随着那一丝火花，马尔琴科试图与压迫他和他的同胞的寡头们抗争。他毅然投身于联邦的政治舞台，马尔琴科拿起笔，成为新统一联邦中不公正条件的激烈批评者，最终当选为杜马议员。尽管这让他招致了严重的敌人，但马尔琴科过上了一个符合目标、没有良心负担的生活。\n\n联邦的失败是一个毁灭性的打击。马尔琴科一生都在以某种方式进行斗争。首先是为了生存，然后是对抗可恶的寡头。随着他的所有盟友死去、被监禁，或即将成为这两者之一，马尔琴科与杜马的其他成员一同逃往汤姆斯克，带着俄罗斯民主的最后残余。他将他所能塞进公文包的一点点东西，继续着他的斗争。"
 NOV_Georgiy_Basharin:0 "乔治·巴沙林"
 POLITICS_NOV_Georgiy_Basharin_DESC:0 "苏联解体后，乔治·巴沙林成为雅库特人民的代表，代表着他们为独立和在寒冷、昏暗的土地上生活而进行的斗争和坚韧。俄罗斯的混乱没有使他屈服，也没有打破雅库特人民的精神。寡头们的贪婪也没有如瘟疫般笼罩着这片土地，渗入矿井和寒冷，寻找超出他们最狂野梦想的钻石和珍宝。在某段时间里，乔治感到自己迷失在一个战争领主横行的世界中，他们梦想统一，压制，数量相当，在俄罗斯的冻土上漫游。\n\n联邦成立后，他愉快地开始与他们合作，为了所有人民的福祉，而不仅仅是雅库特人。但就像苏联时代一样，黑暗笼罩着这片土地。它粉碎了希望，打破了人们的精神，并将更美好未来的梦想送入了遗忘之中。现在，巴沙林再次发现自己独自领导他的人民，但很多事情已经改变。新的面孔，新的公司，以及对他的土地产生的新兴趣，已经从这位年长的男子身上汲取了越来越多的力量。曾经是一束光的他和雅库特人现在只剩下一颗余烬。然而，即使是一颗余烬也能点燃一团火焰，雅库特人寄希望于有一天，西伯利亚人民能够迎来一个更美好的世界，并实现曾经向他们承诺过的梦想。"
 POLITICS_NOV_Amet_khan_Sultan_DESC:0 "1920年，阿梅特汗诞生于吞噬南克里米亚的革命之火中，他天生就属于苍天。在伟大的卫国战争期间，他以简洁的方式被称为“撞击大师”，因为他驾驶他的Yak-7B战机撞毁了一架德国侦察轰炸机。在一次又一次的失败之后，阿梅特汗被迫离开家园，深入寒冷的远东冻原。\n\n在这里，他与一位战友一同来到了俄罗斯联邦的新西伯利亚城。然而，当他充分了解到那些将其利爪深深插入俄罗斯人民的深层企业利益时，苏丹决定加入舒克申领导下的反对派。这位飞行员和作家在更自由和反企业的理念中找到了安慰。两人都希望拯救俄罗斯免受新型独裁的威胁，创建一个真正平等的自由联邦。当全俄人民党赢得1971年的选举时，一股希望和惊奇的浪潮席卷整个国家，人们对未来的美好充满了真挚的渴望。\n\n但战争失败后，一切都崩溃了。苏丹希望保持真正民主俄罗斯的风范，但现在许多人争夺着像半个十年前曾经争夺过的残羹剩饭，希望渐行渐远。阿梅特汗将带领他的信徒走向民主的未来，不论是用甜言蜜语还是用强硬手段，俄罗斯要么崛起到巅峰，要么陷入绝望之坑。"
 NOV_Ogdo_Aksyonova:0 "奥格多·阿克瑟诺娃"
 POLITICS_NOV_Ogdo_Aksyonova_DESC:0 "西伯利亚常被视为一个荒凉、无形的地方，对于那些对俄罗斯秘密一无所知的人来说，那里充满了雪和无尽的冬天。生活在那里蓬勃发展，尽管面临种种困难，却始终坚韧生存。奥格多·阿克瑟诺娃在这个偏远地区出生，成长为一名驯鹿牧民，并接受父母的教导。然而，她真正的激情是书写文字、诗歌和政治。\n\n当联邦来到西伯利亚时，奥格多抓住机会前往西部，了解新地方和新人，并传播她的家园及其美丽的事物。她在联邦发现的完全不同于她对世界的理解，一个充满热爱和激情的新兴土地，关怀着人民。受到启发，她将西伯利亚寒冷的冬天融入她的诗歌、演讲中，点燃了那些愿意倾听的人心中的火焰：一个温暖家园的火焰。\n\n然而，这一切并未持续下去。随着德军粉碎了一个精心构建的梦想，她回到了她的家乡塔伊密里亚，在那里她得知，留下的人们的生活几乎没有改变。她决心不让几乎改变了俄罗斯存在的梦想消失，奥格多承担起了她的家园的领导职责，心中怀抱着为所有人创造更美好未来的希望。即使不是为了俄罗斯，也要为塔伊密里亚。"
 NOV_Alitet_Nemtushkin:0 "阿利埃特·涅姆图什金"
 POLITICS_NOV_Alitet_Nemtushkin_DESC:0 "常有人说诗人是那些用微笑掩饰情感的人，因为他们已见证了所有故事的结局。\n\n阿利埃特·涅姆图什金怀着梦想和激情来到联邦，因为他是一个充满爱和知识的人。作为一个既关心人民又承担责任的政治家，艾文尼克族希望在诺沃西比尔斯克的大厅里看到自己得到代表和关心。当他为那些无法为自己发声的人而演讲和斗争时，越来越多的目光投向了这个奇异而令人愉悦的人。有一段时间，似乎他的工作和行动主义足以创造他梦寐以求的未来，将大地上的另一种弊病消除。但这个未来不会实现，因为从西方来了一种与黑暗一样凶猛可怕的黑暗，就像儿童在黑暗中讲述的怪物故事。随着黑暗的降临，光明慢慢而确定地消失了，变成了一页上的记忆。\n\n但艾文尼克族的命运会怎样？在另一个无尽的夜晚里，他们的未来会是什么？阿利埃特·涅姆图什金不确定，但作为为他们的权利而斗争、捍卫他们的信仰并将他们的梦想写在笔尖和文字中的人，为什么不是他呢？他可能已经看到了联邦的终结，目睹了它的伟大和愚蠢，但他自己种族的故事尚未结束。\n\n它还没有被完全书写。"
 NOV_Valery_Chaptynov:0 "瓦列里·恰普蒂诺夫"
 POLITICS_NOV_Valery_Chaptynov_DESC:0 "1945年出生，只知道一个被德国人蹂躏和摧毁的俄罗斯，瓦列里·伊万诺维奇·恰普蒂诺夫只有一个愿望：为阿尔泰人民寻找一个家园。在先是被俄罗斯帝国，后是苏联遗忘的情况下，恰普蒂诺夫奋斗，以免联邦成为第三个忽视阿尔泰人声音的俄罗斯政府，第三个对他们寻求自治和自治权的呼声视而不见的政府。通过努力和毅力，瓦列里攀登至杜马，成为新宣布的联邦下阿尔泰人民唯一的代表。在那里，他为生活在阿尔泰土地上的人民的意愿和未来辩护，也为自己的同族辩护。\n\n在杜马的短暂生涯中，瓦列里为阿尔泰争取更多的权利和自治权，但这样的抱负落空了，就在鸟儿甚至还没有升空之前就被击落了。德国的浪潮席卷了联邦，让俄罗斯再次陷入了衰败和黑暗的状态，所有的希望都破灭了。但对于阿尔泰和瓦列里来说，有一个越发明亮的光芒：自由和自决的光芒。现在，轮到瓦列里为他的人民铸造一个新的命运，不再是外国政府的代表，而是在动荡时期他人民的领袖。因为如果他失败了，阿尔泰将没有未来，他自己也将如此。"
 NOV_Megacorporation_Troika:0 "三大巨企"
 POLITICS_NOV_Megacorporation_Troika_DESC:0 "战争爆发之前，新西伯利亚的三家巨企曾是世界上最受重视的公司之一。当舒克申上台时，他尽一切可能限制这些在俄罗斯经济中具有重大影响力的人物的权力，以至于他们唯一能有效做的就是顺从总统的要求，甚至更糟的是，将他们辛苦赚来的利润交给政府纳税。对于那些努力奋斗取得成就的人来说，这是一个不公平的交易。\n\n随着战争的爆发，巨企遵从舒克申的命令，建立了庞大的工厂和物流中心网络。新西伯利亚这座城市在凤凰、西比尔和泰坦的巨额财富之前只不过是一个不起眼的地方，而这三家巨企的财富使这座城市成为工业化的中心。当德国人击溃了最后的俄罗斯军队时，新西伯利亚相对完好无损，为这些巨企再次伸出他们的利爪创造了条件。\n\n现在，战争以俄罗斯的失败而告终。舒克申已经离世，他带走了所有所谓的“人权”。三家巨企已确立其为剩余新西伯利亚地区的合法统治者。民主在俄罗斯再次失败，如今由新西伯利亚的企业来为人民带来他们迫切渴望的秩序与稳定。顺带一提，也为了自己的腰包添些东西。"
 POLITICS_NOV_Alexander_Novikov_DESC:0 "在另一个时代，亚历山大·诺维科夫本可以作为解放者和英雄走过莫斯科的街头；一个值得铭记的人。然而现在，他只在寒冷中前行，手持一面已逝意识形态和逝去未来的旗帜。曾经，他是俄罗斯全军著名的元帅，是一个从虚无中建立起自己的国家的代表，是俄罗斯在与最伟大敌人的最终斗争中的领袖。\n\n然而，所有这一切都化为乌有。德国的洪流冲破了俄罗斯人民的意志，或许是永远地。一个幽灵仍在困扰着欧洲，但最糟糕的是，它也困扰着俄罗斯。他的祖国将被限制在一个幽灵、死去的梦想和信仰的国度，其影响只会在记忆中被思考，永远不会显现。联邦崩溃时，诺维科夫带领他的军队向东前进，前往西伯利亚，以尽可能远离德国前线，却只找到了支离破碎的土地和混乱，最终在定居并建立了一个军事政府。作为联邦及其梦想的少数继承者之一，亚历山大·诺维科夫并非愚蠢之人。他看到了地平线上的风暴：第二个充满死去儿子和永无止境的黑夜的时代，另一个充满了匆忙的平民和强盗行为的生活，又一个充满死亡与黄昏的时代。现在，亚历山大·诺维科夫现在必须经历另一场风暴——另一个破碎的俄罗斯——被两个夭折未来的幽灵所困扰。"
 NOV_Leonid_Vasilievich_Laptsui:0 "列昂尼德·瓦西里耶维奇·拉普楚伊"
 POLITICS_NOV_Leonid_Vasilievich_Laptsui_DESC:0 "一个人如何走到领导一段破碎梦想的境地？对于列昂尼德·瓦西里耶维奇·拉普楚伊来说，一切始于一个编辑室，他在那里为俄罗斯北部涅涅茨和亚马尔人的普通人创办报纸。当联邦到来时，他以怀疑的目光看着这些俄罗斯人；他又怎能不这样呢？他们曾承诺照顾每个人，代表每个人，作为他们民主的一部分，作为平等的联邦。西伯利亚不同的民族和族群长久以来一直过着二等公民的生活，从旧俄罗斯帝国时代到苏联时代。如果联邦愿意倾听，列昂尼德将带给他们需要听到的一切。\n\n大学毕业后，他成为该地区一家报纸的成功作者和编辑，凭借显赫的声望当选为政府职务，使他能够直接改善人民的生活。有一段时间，俄罗斯和涅涅茨-亚马尔人民的未来似乎变得光明，但即使是最明亮的太阳也必须落下。联邦被黑暗吞噬，将俄罗斯摧毁到十年前的状态。但对于列昂尼德和涅涅茨人来说，联邦的垮台意味着不同的东西：有能力铸造自己的命运。不再受俄罗斯意志的束缚，一个新的民主将从旧时代的余烬中崛起，为那些被祖国俄罗斯遗弃的人民而建。"
 NOV_Alexander_Vasilyevich_Filipenko:0 "亚历山大·瓦西里耶维奇·菲利彭科"
 POLITICS_NOV_Alexander_Vasilyevich_Filipenko_DESC:0 "建筑对亚历山大来说是生活中少数的乐趣之一。尽管那是他的工作，但自从他孩童时拿起锤子后，他就对建筑产生了兴趣。高中毕业后，他立刻投入工作，获得了工业部门的一个职位。尽管他只是一个建筑工人，但他协助在创纪录的时间内修建了许多横跨奥布河的桥梁，不仅赢得了众多国家奖项，还得到了当之无愧的晋升，从成千上万的人中脱颖而出，成为汉特-曼西地区的秘书。\n\n然而，这个职位不会持续太久，因为联邦陷入了混乱之中。不久之后，俄罗斯在第二次西俄战争中遭受了有生以来的第二次耻辱，惨败而归。他自行承担起保卫他曾经服务过的土地的责任，宣布自己为汉特-曼西地区的临时领袖。尽管联邦因其自身的沉重而崩溃，亚历山大将永远确保他所控制的任何土地不会遭受同样的命运。\n\n他这样做并不是因为他想被铭记为伟大的领袖或拯救俄罗斯的人。他这样做是因为那是他一直以来的信念。无论需要多长时间将其完全重建，他都会逐一恢复他深爱的国家。"
 NOV_Anatoly_Ivanovich_Saltykov:0 "安纳托利·伊万诺维奇·萨尔蒂科夫"
 POLITICS_NOV_Anatoly_Ivanovich_Saltykov_DESC:0 "纵观历史长河，世界见证了许多年迈之人在权力的掌控中逐渐消磨殆尽，直至最苦涩的终点。然而，安纳托利将会与众不同；他将为俄罗斯带来新鲜血液。安纳托利未曾亲眼见证苏联的失败，也未被迫承受随之而来的灾难性毁灭之痛楚。他毕业于汤姆斯克会计大学，随后加入俄罗斯武装力量，参与了反对大日耳曼国的战争努力，这一举动改变了他的一生。\n\n在与帝国的可耻失败后，他集结了尽可能多的乌德穆尔特人，并开始在俄罗斯土地上展开自己的逃亡，以将他们从野蛮的德军中拯救出来，最终将他们带到了别洛雷茨克城。整个旅途中，乌德穆尔特人对安纳托利产生了尊敬和钦佩，到达安全之地时，他被尊为总统。安纳托利谦卑地接受了这一角色，并承诺运用他的军事知识来确保他们的安全，并以他的教育为他们带来繁荣。\n\n如今，借助伊德尔乌拉尔地区所拥有的所有资源，他开始容纳尽可能多的难民，同时尽其所能地与领土内不同的各方进行谈判，希望有朝一日俄罗斯能够再次从废墟中崛起；这不是出于仇恨，而是出于对人民的热爱。"
 NOV_Mongush_Kenin_Lopsan:0 "蒙古什·肯尼恩-洛普桑"
 POLITICS_NOV_Mongush_Kenin_Lopsan_DESC:0 "虽然蒙古什的童年与他的同胞一样平凡，但他数十年的成年生活成为了抵抗的一段传奇。他是图瓦语言和文化上重要的萨满教的教师，而苏联曾试图将这种文化从存在中抹去，因为他们害怕它最终会演变成有组织的宗教。尽管这样的实践会导致在西伯利亚劳改营服刑，但蒙古什是极少数能够成功躲避克格勃窥视的人之一。在这个专制国家的大部分时间里，他都在写反共文学，这并不仅仅因为他认为共产主义是一种失败的意识形态，更是因为它对他的家庭造成了什么样的影响。\n\n在苏联解体后，蒙古什将再次过上平凡的图瓦生活，抚养着一个小家庭，并过着他谦逊的生活。然而，尽管图瓦在很大程度上未受到新联邦的影响，但其崩溃使得俄罗斯广袤土地上出现了许多权力真空。其中一个权力真空将出现在图瓦的草原之间。\n\n这将促使图瓦人宣布独立，试图成为不仅仅是一个简单的省份；一个独特的国家，一个将永远保持独立的国家。在图瓦人民的投票中，蒙古什被选为他们的领袖。现在，他必须确保他的人民经得起时间的考验，就像他们以往一样。"
 NOV_Viktor_Orlov:0 "维克托·奥尔洛夫"
 POLITICS_NOV_Viktor_Orlov_DESC:0 "维克托·彼得罗维奇·奥尔洛夫亲眼目睹了两个俄罗斯巨人的崩溃，都被西方的日耳曼巨人所击败。他第一次见证了崩溃时还很年轻，他的家庭被迫在俄罗斯无政府状态的黑暗阴影下苦苦挣扎。稍大一些时，他决定搬到新西伯利亚，希望能找到工作来养活家人。\n\n在那里，他在一家当地工厂工作，工人们的工作条件极差，这都是大企业造成的。然而，维克托·奥尔洛夫毫不气馁，他开始组织工人成立工会，以保护他们的利益。尽管大企业成功地遏制了他的努力，但他开始以温和社会主义者的身份声名鹊起，并设法在联邦的农业部获得了一份工作，不知疲倦地努力推动农民的利益。然而，当一场大火席卷西方时，他的所有努力都轰然倒塌。\n\n在联邦四分五裂之际，维克托返回卡卡西亚与家人团聚。在他一生中第二次目睹俄罗斯国家内部崩溃的时刻，他明白为了他的人民能够找到他们迫切寻求的和平，他们需要脱离俄罗斯。如今，维克托已经准备好为卡卡西亚开创自己的道路，摆脱俄罗斯的失败和企业的影响，走向繁荣的未来。"