 CSTO_siberian_railway_project_desc_tt:0 "西伯利亚大铁路是一条广阔的铁路网，曾经从莫斯科延伸至符拉迪沃斯托克，成为西伯利亚的重要动脉。苏联解体后，这条铁路对俄罗斯的剩余地区变得至关重要。\n\n俄罗斯联邦提出了一个建议，即对现有铁路进行翻新，并将铁路线延伸至哈萨克斯坦，以扩大俄罗斯与中亚地区之间的贸易。"
