 NOV_eurasias_power_plant_idea:0 "核能经济"
 NOV_RAPP_space_category:0 "太空探索"
 NOV_RAPP_space_category_desc:0 "一个国家的真正实力不在于它的士兵和坦克，而是在于它的历史成就。尽管许多俄罗斯火箭理论家在灾难性的20世纪40年代幸存下来，但他们的梦想直到现在才能实现。舒克申总统已经拨款支持这项事业，作为一个国家，我们必须完成库尔恰托夫和科罗廖夫开始的事业！ \n\n§Y当前阶段我们已经完成§!§G[?RAPP_Progress]%的进度§!。§Y每个月，我们将花费[?RAPP_Space_Monthly_Cost]M美元§!，这将使我们在§Y每个月度的基础上§!§G增加[?RAPP_Space_Monthly]%的进度§!。\n\n§W你可以在国家总览界面来了解当前的情况！§!"
 NOV_RAPP_Stages:0 "[NOVgetRAPPStage]"
 NOVgetRAPPStage_1:0 "§W阶段一：拜科努尔§!"
 NOVgetRAPPStage_2:0 "§W阶段二：火箭§!"
 NOVgetRAPPStage_3:0 "§W阶段三：发射§!"
 NOV_RAPP_Open_Button_tt:0 "总统将访问“拜科努尔”。"
 Launch_Progressbar_tt:0 "[NOVgetRAPPProgressbar]"
 NOVgetRAPPProgressbar_1:0 "§Y阶段一 - 基地建设§!\n\n经过慎重考虑，我们选择了§Y锡尔河§!岸边附近的一处地点来建造§B航天发射场§!，这个航天站将成为一个致力于§W俄§!§B联§!§R邦§!太空探索项目的研究与发射的综合体。在开工之前，我们需要大量的人力、资金和专业知识。当我们的设计局完成火箭设计时，§R航天发射场也必须建造完成§!。\n\n§Y我们目前投资了[?RAPP_total_investment]M美元，§!§G进度是[?RAPP_Progress]%§!。"
 NOVgetRAPPProgressbar_2:0 "§Y阶段二 - 火箭§!\n\n我们的设计局已经为载人航天飞行提出了可行的设计方案。然而，我们还没有将它们变成现实。这个方案意味着要在发射前对火箭进行组装、运输和维护。此外，§Y旧苏联时代的基础设施必须得到升级和改善§!，这样才能为我们的人员提供充足的食物、水和燃料。\n\n§R一旦完成，即可升空§!。\n\n§Y我们目前投资了[?RAPP_total_investment]M美元，§!§G进度是[?RAPP_Progress]%§!。"
 NOV_RAPP_Baikonur_1_tt:0 "§Y点击进入拜科努尔航天发射场。我们将在那里进入第二阶段，即火箭的组装和运输§!。"
 NOV_RAPP_Baikonur_2_tt:0 "§R当前尚无法访问拜科努尔§!！"
 NOV_RAPP_build_additional_infrastructure:0 "建造额外基础设施"
 NOV_RAPP_build_additional_infrastructure_desc:0 "尽管拜科努尔是作为航天发射场的理想地点，但苏联时代的基础设施却存在问题，并阻碍了我们联通这一地区。当然，我们不能把全国的火车和卡车都拉到基地，因此，为了解决问题，我们必须修建新的铁路和公路，加快物资和人员的运输。"
 NOV_RAPP_ensure_stream_of_supplies:0 "确保供应流"
 NOV_RAPP_ensure_stream_of_supplies_desc:0 "因为哈萨克斯坦中部的气候恶劣，食物和设施的匮乏，许多人才不愿赴任。但这些琐碎的事情绝不能拦下航天发射场！此外，帮助他们发展当地经济也许从长远看并无坏处，而且我们还要在那里待上好一阵子。"
 NOV_RAPP_invite_american_experts:0 "邀请美国专家"
 NOV_RAPP_invite_american_experts_desc:0 "美国在太空探索领域取得了许多成功。事实上，我们必须向参与美国航天发射中心建设的人们学习，以了解从无到有建立一个进步的堡垒所需的真正努力。"
 NOV_RAPP_develop_site_procedures:0 "制定员工学习课程"
 NOV_RAPP_develop_site_procedures_desc:0 "由于我们对建设此类事物毫无经验，我们的许多经理和工人面对先进的电子设备都如无头苍蝇。为了避免现场发生意外，我们必须花时间在信息课程上，确保他们不会把任何重要事情搞砸。除此之外，也许我们可以在这些课程里加入一些爱国主义宣传……"
 NOV_RAPP_conscript_military_personnel:0 "招募军人"
 NOV_RAPP_conscript_military_personnel_desc:0 "军队拥有许多年轻人非常适合这份工作。随着我们的联邦在世界强国中确立了自己的地位，我们预计未来几十年将相对和平。如果军队没有真正的敌人可与之搏斗，他们将与哈萨克斯坦炽热的阳光一同翩翩起舞！"
 NOV_RAPP_develop_local_manufactories:0 "发展当地工厂"
 NOV_RAPP_develop_local_manufactories_desc:0 "显然，从遥远的俄罗斯城市运来建筑材料和电子产品毫无效率。如果我们能够直接从哈萨克斯坦获得一些高质量的材料，那成本将大幅削减。我们应该利用这一机会投资当地的市政当局，如克孜勒-奥尔达和杰兹卡兹甘。这或许同样有助于减少失业并促进这些地区的城市化！"
 NOV_RAPP_fuck_you_castamir:0 "让兹韦兹多格勒“消失”"
 NOV_RAPP_fuck_you_castamir_desc:0 "众多工人称之为\"星城\"的拜科努尔市已经相当具有迷惑性了。然而，我们政府中的一些人正在争论是否需要增加安全措施。这些官员声称，最好将拜科努尔市从地图上抹去，以避免欧洲的敌对势力潜在的破坏，并让该地方的目的清晰地传达给市民。说实话，这个想法听起来并不那么糟糕……"
 NOV_RAPP_Monthly_Change_tt_1:0 "我们将在太空项目上§R减少§!§Y[?temp_display]M美元§!的月投入"
 NOV_RAPP_Monthly_Change_tt_2:0 "我们将在太空项目上§G增加§!§Y[?temp_monthly]M美元§!的月投入"
