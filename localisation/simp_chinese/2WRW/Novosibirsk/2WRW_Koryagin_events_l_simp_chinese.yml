l_simp_chinese:
 Koryagin.1.t:0 "胜利终将到来"
 Koryagin.1.desc:0 "伊万·库拉托夫凝视着鄂毕河畔。当他微笑着注视着日出时，眼中泪水涌动。小桥那边，新时代正在开始；希望和自由不再是神话。\n\n安纳托利·科里亚金迈上了他发表就职演讲的讲台。他的脑袋被汗水浸透，他迅速擦去，双手稳定地握住。他迅速低头，聚焦在新西伯利亚的天际线上；日出恰好标志着他担任总统的时刻的来临。然后他低头看着人们。他们不是封建封地或军阀政权的居民，不。他们是俄罗斯人。趁机抿了抿嘴唇，咽了口水，他坚定了信心，开始演讲。\n\n“俄罗斯这片土地上的兄弟姐妹们。几个月前，我向你们承诺繁荣、和平和俄罗斯幸福的第二个时代，只要你们慷慨地将你们的信任交给我，并委以我们所有人珍视的职务：联邦总统。现在，我可以说。我们取得了胜利，我不会忘记这些承诺。”\n\n下方聚集的人群爆发出震耳欢呼声。条幅和旗帜成群地升起，从科里亚金的位置看来，一片白、蓝和红的海洋涌上来迎接他。\n\n“俄罗斯长期以来都在一个又一个霸主的压制下受苦。他们曾在我们的意识中燃烧和发酵。我们都在骨子里感受到了它。战争撕裂了我们的家庭，摧毁了我们的家园、我们的生计、我们的文化和信仰。我们都不得不为我们的繁荣做出牺牲。但是，我们已经走出了黑暗的尽头，我将我们过去的斗争视为未来的指南。战争撕裂了我们，现在我们必须治愈起来。为此，我们必须摒弃武器和仇恨。我们必须抛弃强权至上的伪装。我们必须拥抱外交和乐观的未来！我们的海外邻居和国内邻居不是当前的敌人，尤其是在俄罗斯人仍然承受贫困和不公正的束缚之际。我们还有很长的路要走。”\n\n人群掌声雷动，然后他举起一拳高高扬起，说出的话将永远在俄罗斯历史上回荡。"
 Koryagin.1.a:0 "“太阳已经升起。胜利终将到来。”"
 Koryagin.2.t:0 "妥协的混乱"
 Koryagin.2.desc:0 "科里亚金品了一口咖啡。它源自土耳其，加入了浓郁的牛奶和微微的糖。正如他所喜欢的那样。他再次用手指在前往“自由世界之首”美国和其他OFN成员国的计划路线上划了划。“让我理解清楚，”他开始说。“我们要去美国举办一次可能改变地缘政治未来的峰会。我们在这里所做的事情将要么巩固我们的遗产，要么摧毁它，而你想让我浪费时间去参观一家餐厅？”\n\n谢尔盖·科瓦列夫耸了耸肩。“这叫快餐，总统先生，这会让你受到美国人的喜爱。”\n\n“他们认为吃在两片面包中间夹着被汽车撞死的动物很讨人喜欢吗？”\n\n“是的！它会让你看起来像一个普通人，一个亲民的人。”科瓦列夫把眼镜推到鼻梁上。“只是一顿饭，安纳托利。”\n\n科里亚金深深地叹了口气。“然后呢？”\n\n“在美国总统之前，我们安排了几场新闻发布会。没有什么重要的，会提供一名翻译。”\n\n“你觉得我需要翻译？”\n\n“你觉得自己需要翻译吗？”\n\n“……我指派给你一名翻译。”\n\n科里亚金把拳头握在身旁。“好吧。”\n\n谢尔盖翻到行程单的下一页。“峰会之前，你将接受几所美国大学颁发的名誉心理学学位。斯坦福、哈佛和麻省理工。”\n\n“我感到荣幸，但是……谢尔盖，这真的有必要吗？把这次旅行变成一场表演。用胡闹来讨好公众。”\n\n“是的！”科瓦列夫把铅笔重重地放在桌子上。“美国人很好奇！他们想看到东欧的和平缔造者，那个在根本层面上改变俄罗斯的人。你告诉我你想参与其中，改变世界。那么，为了做到这一点，你需要他们的关注。所以，让我们引起他们的注意！”"
 Koryagin.2.a:0 "政治就是马戏团。"
 Koryagin.3.t:0 "宿敌之间的恳求"
 Koryagin.3.desc:0 "康托罗维奇为自己和客人安纳托利·科里亚金倒了一杯酒。也许他们曾经是合作伙伴，但最终，安纳托利只不过是公司垄断的另一只手臂，与工人阶级合作的人，竟然胆敢寻求与人民的仆人妥协。\n\n然而，科里亚金试图请求他：“康托罗维奇，请你听我说。我知道你和你的党派对我怎么看，但我不会像某条富人的走狗那样向公司低头。我们不能实行这些政策——国有化泰坦，列昂尼德？我可不是什么公司的爪牙，但我们不能仅仅国有化每家公司！我为和平而战，是为了繁荣，不是为了领薪水，如果你肯让我，我愿意与像你这样光荣的人一起努力实现它。”\n\n康托罗维奇嗤之以鼻：“你对你的选民讲的那一套‘和平’，但是尽管你滔滔不绝地谈论理想和共同利益，你却反对为繁荣所必需的东西，也就是普通人的进步。”\n\n“不，你误解了我的意思——”\n\n“不，安纳托利，我很清楚。恐怕我们无法达成协议。”科里亚金停顿了一会儿，保持沉默，然后叹了口气，试图重新加入谈话。\n\n“列昂尼德，我知道我们意见不合，但请你想一想。你难道愿意看到普里马科夫和他的手下因为我们不够左翼而摧毁我们所做的一切吗？”\n\n康托罗维奇差点要回嘴，但他停住了。普里马科夫是与他身边这个人截然不同的情况。科里亚金是对公司利益迁就的人，而普里马科夫是西罗维基的捍卫者！拒绝支持科里亚金将使西罗维基在政府中占上风。社会自由派并不完美，但如果帮助他们意味着阻止工人权益的破坏，哪怕只是减少进一步的伤害，也许，也许……\n\n康托罗维奇转向科里亚金：“安纳托利，我可能认为你的政策软弱无力，但我不希望看到我们曾经为之艰苦对抗的联邦回归。如果你能阻止普里马科夫，那么民主社会党将全力支持你。”"
 Koryagin.3.a:0 "“但是，我们还需要进一步讨论。”"
 Koryagin.4.t:0 "帮助骄傲的人和大多数人"
 Koryagin.4.desc:0 "“乌拉！”伊万高举酒杯与他所在第八营的战友们欢呼。作为战友们解放欧洲的岁月已经过去多年，但他们之间的纽带至今依然牢不可破，在这次酒聚中更是如此。身边的每个人仍然带着战争的伤痕，有的是明显可见的，有的则不那么明显。他的许多战友仍然在艰难地维持生计，即使已经是和平时期的许多年后，饭桌上的食物还是不够。\n\n士兵们的欢呼声戛然而止，大家的注意力被房间角落的电视吸引了过去。科里亚金总统正在召开新闻发布会，虽然房间里的嘈杂声几乎淹没了他的声音。伊万不屑一顾，开始继续喝他的酒，因为对于总统所说的和平，他从来没有看到对那些为之奋斗的人给予过一点点的尊重。然而，科里亚金的话引起了他和其他战友们的注意。\n\n\"从今天开始，我将推行一项新的公共工程计划，将在我们伟大的联邦境内实施，优先为为国家自由而战并为之受苦的我们勇敢的俄罗斯儿子提供就业机会和公平工资。那些为全国做出巨大牺牲的人，他们需要工作和公平的薪酬，我们不能否认这一点，我们...\"\n\n总统继续讲下去，但短暂的寂静被欢呼声和喊叫声打破。许多仍在艰难生活的退伍军人欢呼，有些人甚至举起酒杯对着屏幕大声说道：“干杯！”然而，也有很多人对宣布的工资只表示嘲讽。\n\n坚定地站在康托洛维奇的民主社会党一边的安纳托利开口了。“他们怎么能付给我们奴隶水平的工资？这还不到我们在服役期间所得的一半！”。房间里许多人都附和着抱怨，但并非每个人都对所提供的薪水感到不满。很多人都在寻找摆脱贫困的出路，无论如何，科里亚金刚刚给了他们希望。也许这并不完美，但对那些最需要工作的士兵来说，这几乎无关紧要。伊凡决定他必须等待并看看结果如何，但目前呢？继续喝酒！"
 Koryagin.4.a:0 "算不上什么祝福，但对他们来说呢？足够了。"
 Koryagin.5.t:0 "缅怀"
 Koryagin.5.desc:0 "总结起来，这五个年轻人，他们的一生都还在前方，却被残忍而无意义地处决了，理由仅仅是他们选择在一个慵懒的下午进入的咖啡馆。我们永远不会知道他们是否意识到这个地方被用作社会主义煽动者的秘密会面地点，因为他们被剥夺了生存权利，就像被剥夺了辩护权利一样。他们被送上表面的假审并由一群中毒的陪审团判处死刑。现在他们的案件已经尘埃落定，或许现在作为一个国家，我们的伤口可以开始痊愈了。\n\n科里亚金完成演讲后，他俯视着庞大的观众群。他对反应感到满意，他从人群中找出几位著名记者和温和左派的政治活动家。他看到人群中有很多满怀希望的面孔。也许波克雷什金的大屠杀之伤终将会痊愈。\n\n但第二天早上，科里亚金的希望之情烟消云散，因为他不幸地醒来时发现一摞报纸被丢在他的桌子上。他随意拿起一份，没有完全认出标题，但由特工控制的小报往往有一种可辨识的外观。\"科里亚金总统赦免了前民粹派恐怖分子！与加兰斯科夫私通？\"\n\n他叹了口气，把报纸扔到桌子上。他不能说这是出乎意料的。总统没有对修复联邦破碎的政治局势抱有任何错觉，这从来都不是一帆风顺的事情。他看着堆在一起的报纸中的另一份，希望重新燃起。这是一个更温和的右翼声音，他们的新闻报道肯定会更加平衡。\"全俄爱国党领导层谴责对卡拉坎森林五人事件的事后赦免，理由是——\"\n\n科里亚金弯下腰，双手托着头，沉思着自己的决策可能带来的深远影响，这时接待室的传呼声响起。他勉强拿起电话回答道：“先生，从昨天开始我们一直在收到全国各地零散抗议的报告。初步报告似乎显示社会主义者和西罗维基支持者之间发生了冲突。”"
 Koryagin.5.a:0 "一片死寂，接着是一声深深的叹息。"
 Koryagin.6.t:0 "猎鹰的余烬"
 Koryagin.6.desc:0 "二等兵基巴尔科夫思考着，莫斯科街头的抗议活动确实是一幅奇特的景象。在收复战争之后，他曾以为煽动者和动荡将最终平息，联邦的纷争将会减轻，但显然这个未来永远不会到来。\n\n围绕科里亚金对民粹派的偏爱的抗议已经达到了一个临界点。一个由十二名老兵组织并发起的适当的示威活动，据说他们在希特勒与布哈林交恶以来的每一次武装冲突中都服役过。\n\n基巴尔科夫的目光漫游到街道的另一端，那里正在进行对抗抗议活动。当然，民主社会党（以及社革党和俄联共）的支持者非常热切地反对这种公开行动，因为那些该死的共产主义者当然会这样做。他所能看到的，不管是哪个方向，都是一片愤怒的面孔，与标语和口号混为一体，大声呐喊。唯一将两组人隔开的只有他的朋友和同事，他们从头到脚都穿着防暴装备。\n\n时间过去了几个小时，但对于二等兵来说，感觉像过去了几天。指挥链不允许采取任何暴力驱散方法，除非受到挑衅，所以唯一能做的就是守住阵线，假装整个城市的秩序没有崩溃的危险。外面寒冷刺骨，但他能感到汗水从背上流下，眼睛左右扫视。肾上腺素在他的血管中涌动，但他只能等待，并希望这一天不会以血腥收场。\n\n突然，仿佛上帝亲自眷顾莫斯科的这一天，天空洞开，寒冷的雨和冰雹倾泻而下。这简直就是一场圣经般的暴风雨，比高尔夫球还要大的冰雹击打着大地和抗议者，尽管他们固执地抗议，最终还是被恶劣的天气所驱散。\n\n对于基巴尔科夫来说，这是他生命中最漫长的十七个小时，阵线得以守住，避免了一场骚乱。多亏了偶然的机会，政治暴力得以避免。"
 Koryagin.6.a:0 "这一天，和平在俄罗斯得以延续。"
 Koryagin.7.t:0 "米盐之乡"
 Koryagin.7.desc:0 "喷气机开始下降，当飞机接近时，曾经遥远的山脉变得更大了。这些土地与祖国的恶劣地形大相径庭，它们展现了一种不同类型的美丽，宁静而非严酷。它们掩盖了这个地区和人民在过去一个世纪所遭受的创伤。\n\n科里亚金与科瓦列夫一起下了喷气机，受到了一群村民和国民党士兵的欢迎。在人群形成之前，他们的随从迅速带领他们走向附近的村庄。\n\n这些房屋由木材和石头建成，与俄罗斯的混凝土森林形成鲜明对比。尽管环境看似严苛，但它们仍然让人感到温馨。不久，科里亚金的随从们进入了一座古雅的房屋，坐在一张用简单桌布覆盖的圆桌旁。中国总参谋部的成员们随后加入了他们。菜肴被端上一张大圆桌，每个人都可以品尝，散发出令人陶醉的热气。这些食物简单而丰盛。当他们边挑选边品尝时，他们的交流开始认真起来。\n\n\"科里亚金总统，您能够与我们这个小国合作，我们感到非常荣幸。我们的两个国家都曾被法西斯主义摧毁，但您的国家已经重新崛起，为俄罗斯人民展现了前所未有的辉煌。但中国却被日本鬼子打得四分五裂，束缚和分割成碎片。我们将竭尽全力为解放我们的人民而战，但如果没有外部支持，即使对我们中最乐观的人来说，似乎也不太可能。\"\n\n科里亚金用理解的眼神看着他说道：\"于将军，我们没有忘记我们与纳粹作斗争的历程，以及我们曾面临的绝望，考虑到我们必须克服的压倒性困难。我们如今取得了胜利，我们不会轻易忘记。我们同样面临着日本这个共同敌人，以及法西斯主义险恶的阴影。我们不会让中国最后的希望熄灭。我们将全力支持你，豪章。”"
 Koryagin.7.a:0 "“谢谢你，科里亚金总统。中国感谢你。”"
 Koryagin.8.t:0 "走向东方"
 Koryagin.8.desc:0 "科里亚金和科瓦列夫走下飞机，踏上了他们一生中第一次来到印度的土地。那是一个让人感到压抑潮湿的日子，天空阴云密布，炎热得难以忍受。刚踏出飞机，科里亚金就感觉到自己的衬衫因空气中的潮湿而变湿，仿佛在呼吸着水。\n\n“下午好，科里亚金总统，科瓦列夫先生。”一个穿着西装的深肤色男子从一辆朴素的越野车中走出来，车子高质量但不招摇。他说道：“我是拉梅什·帕特尔，有幸成为您在印度和德里的翻译和向导。欢迎您！”他示意两位先生上车，“如果你们愿意的话。”两位男子皱了皱眉，他们在其他国家通常没有这样的待遇，尤其是在一个拥有数亿人口的国家里。但是，他们抑制住了指出这一点的冲动，顺从地跟着这位天真的向导。\n\n车子颠簸行驶着，直到他们和保镖们一起坐进车里，他们的重兵车队穿过贫困的德里街头，科里亚金才注意到周围的贫困现象。尽管印度经济庞大，人口比俄罗斯多得多，但人民却饥饿。贫穷、饥饿、乞讨或卖货、穿着破烂在街上玩耍的人们。学校在哪里？\n\n“帕特尔先生，请原谅我的无知，印度的大部分地区都遭受这样的贫困吗？”\n\n帕特尔沉默片刻后转过身来，“科里亚金总统，情况并不容易。这片土地需要大量的农业劳动力，但人民既没有土地也没有机器。如果我可以坦率地告诉您，我们的国家存在腐败问题，但更严重的是，我们受到日本及其傀儡的威胁，经历了一个世纪的殖民统治导致我们贫困。这不是一件容易克服的问题，”他郑重地说道。\n\n车子静静地行驶着，在几个街区之外绝望的景象形成了鲜明的对比，最后停在一个宏伟的宫殿前，其精美的穆斯林圆顶别具一格。\n\n在一间精致而豪华的金色会议室里，一个佩戴过多奖章的男人注视着他。\"科里亚金总统，非常荣幸能够接待您。但我们迫切需要您的帮助来对抗日本的法西斯威胁和他们的阿富汗傀儡。没有您的合作，我们自身无法发展。\" 科里亚金的嘴唇挤成了一条细线。"
 Koryagin.8.a:0 "“当然可以，但光靠枪支还不足以赢得这场战争。”"
 IND_green_revolution_tt:0 "§K绿色革命将永远改变印度§!"
 Koryagin.9.t:0 "心与灵"
 Koryagin.9.desc:0 "当科里亚金进入办公室时，他眼前浮现出过去的种种景象。一份《选举权法案》的副本悬挂在一张照片旁边，照片上有两位男子，科里亚金认出他们是联邦的两位前总统，在一架喷气机旁边开怀大笑。那个头发被风吹起的男子看起来比现在坐在科里亚金面前的总统舒克申要年轻得多，不过舒克申依然眼中闪烁着同样的乐观光芒。\n\n“瓦西里，很高兴见到你身体健康，但我恐怕我们必须省略寒暄了。你肯定知道半数杜马成员都在试图在我们刚刚起步时将我的政府推向万劫不复之地，现在僵局已经无法打破，除非有更多的政治支持。我来找你是为了寻求你的支持。”\n\n舒克申倚在椅子上叹了口气，他礼貌的微笑短暂地失色了一下。“安纳托利，你的理想主义从来就不适合政治。如果不是太蠢了，我会佩服你的坚持。从我在你的位置上待过的时间里，我学到的是不可能讨好每个人。你需要有些骨气，否则你的前途堪忧。”\n\n“瓦西里，请——”\n\n“和平主义，免除兵役，这不现实，安纳托利。选民们不会容忍这样做。你需要更务实——”\n\n科里亚金反驳道，声音渐高。“务实？如果我们只追随务实，那个人，”他伸指指向墙上的波克里申的照片，“还会坐在那个位子上！瓦西里，是你把我们从无政府状态和肮脏中拯救出来，与一个全球超级大国打了一场战斗，并赢得了胜利！正是理想主义让我们走到了今天这一步！你有影响力，你有人脉，该死的！如果我们想要阻止普里马科夫和他的流氓们破坏你的工作，我需要你的帮助！”\n\n舒克申沉默了很长一段时间，权衡着科里亚金的新决心。你并不一定错。我可能低估了你，科里亚金。”他笑了起来。“我和普里马科夫以及他的公司寄生虫一样，不喜欢。如果你的举措可以制止他们，我将会帮助你。你或许天真，但并非懦弱，正因如此，我对你表示尊敬。你将获得农工党的支持，组建一个温和的民主联盟。”"
 Koryagin.9.a:0 "火炬的传递。"
 Koryagin.10.t:0 "国家的未来在于军队"
 Koryagin.10.desc:0 "“安纳托利，这完全是不能接受的。”叶夫根尼·普里马科夫在总统办公室里来回踱步。“这是对我们国家安全的政变。全俄爱国党不会容忍这种事情发生！”\n\n安纳托利·科里亚金对他报以怜悯的微笑。“叶夫根尼，请恕我直言，你的党派在这个问题上发言权很小。我已经定了方向。如果我们要引领世界走向和平，我们必须先树立榜样。我们无法在整个国家受困于庞大的军工复合体时做到这一点。”\n\n爱国党领导人疲惫地叹了口气，最终倒在椅子上。“你疯了吗？”他擦掉额头上的汗水。“这太荒谬了。这甚至不仅仅是关乎我们在领域内行使权力的能力，这关乎到我们人民的基本长期安全。我们难道希望像希特勒那样的疯子上台并试图屠杀我们毫无防备的人民吗？你试图削弱的这些公司，你知道它们雇佣了多少人吗？它们为俄罗斯做出了多大贡献？你不能简单地希望它们消失。”\n\n科里亚金耸了耸肩。“那是短视的，叶夫根尼。这些公司可能雇佣了人员，但那种军事实力并不是消费型经济的基础。我们国家可能会有很多枪支，但没有裤子，没有电视机，人民在没有民用经济的情况下无法生存或取得进步。”\n\n“消费型经济在这个世界上无法存活！”普里马科夫一拳砸在桌子上。“看看亚洲，看看中东，看看整个欧洲的局势！你认为其他超级大国会愚蠢到让自己解除武装，并训练他们的人民不去追求地缘政治利益吗？你逼着俄罗斯变成一只羔羊，一只将被那些不听你的傲慢胡言乱语的人宰割的羔羊！”\n\n“我只是打算通过一些同理心来训练社会。以人们自己的视角去感知他人。人类不应该因为我们任意的“地缘政治利益”的愚蠢观念而承受战争的恐惧。这也是个明智的商业观念，叶夫根尼。当一个国家的人民创造更多的价值时，其他国家也会跟上的。”\n\n普里马科夫站了起来。“我不能阻止你。我只希望你的乌托邦不会因为微风而翻船，为了我们大家的利益。”"
 Koryagin.10.a:0 "作为一个人，让我们从他们手中夺取未来。"
 Koryagin.11.t:0 "沙文主义的终结"
 Koryagin.11.desc:0 "辩论已经结束，他的内阁成员们已经散去。安纳托利·伊万诺维奇·科里亚金总统站起来，默默地凝视着世界地图。官僚、外交官和智囊团度过了又一天，共同追求一个简单的目标：从每一本字典中删除“战争”。为了永恒、繁荣的和平。当他凝视着二十世纪末的各个国家时，他感受到了等待他和他的追随者的巨大任务的沉重负担。\n\n一个人如何教导东亚社会相互尊重，共同努力，以求解决几十年来寄生于他们经济之上的虚假统一？一个人如何接触非洲，她的土地被残暴对待，她的人民受伤，甚至像水这样基本的商品也稀缺并引发争夺？一个人如何践踏和扼杀从那令人发指的“统一契约”之尸体的灰烬中崛起的扭曲的欧洲民族主义？是否可能引导中东的泛阿拉伯倾向走向地区稳定？如何控制并阻止其他超级大国对世界事务的侵略干预？\n\n而最重要的是，如何在不派遣一名士兵出国的情况下应对这一切呢？"
 Koryagin.11.a:0 "乌托邦不能建在尸山血海之上。"
 Koryagin.12.t:0 "患难兄弟"
 Koryagin.12.desc:0 "阳光明媚地洒落在莫斯科广袤蓝天上，构成了一个完美的背景，揭开了新建纪念碑的面纱。数百人围绕着高耸的俄罗斯士兵雕像聚集，他自豪地挺立着，高举着心爱的俄罗斯国旗。在他身边站着一名美国士兵，同样坚定地行礼致敬，高举着美国国旗，与联邦的旗帜并肩飘扬。\n\n这是一幅令人动容的画面，大多数路人都这样认为。走过的行人中有笑声，有泪水，有静默缅怀的时刻，但其中也有更多尖刻的言辞从人群后方传来。愤怒的老兵们对美国\"懦夫\"与那些真正解放俄罗斯的人相提并论感到愤怒。人群中，他们的愤怒是可以理解的，但没有人敢打断他们的呼声或给予他们安慰。\n\n随着时间的流逝，抗议声逐渐消散，取而代之的不再是蔑视或愤怒，而是寂静。无声地承认了所有凝视纪念碑的人心中共同的情感，一种被许多人认为已经失去的情感：和平。在寂静中，人们的目光被转向纪念碑旁边的讲台，一群身着西装和领带的人们走向讲台中央，科里亚金总统走上前来发表纪念演讲。\n\n\"在我们迈入繁荣和自由的新时代时，我将用一位来自大洋彼岸的伟人的话告诫大家：'我们唯一需要害怕的就是恐惧本身。' 谢谢大家。\" 人群恭敬地鼓掌以示纪念，尽管一些人在庆祝鼓掌时更加激动。与此同时，人群中的老兵们咬紧牙关，默默表达着内心的愤怒，但在这一刻，他们静静地忍住声音，向那些希望庆祝的人致以短暂的敬意，因为这是一个连他们也无法否认重要性的时刻。\n\n午后不久，来自自由世界各个角落的大使们一起握手，并聚集在纪念碑前合影。民主战胜了纳粹的恐怖。通过鲜血、汗水和眼泪，他们战胜了邪恶，一起高唱胜利的歌曲。"
 Koryagin.12.a:0 "我们时代的和平？"
 Koryagin.13.t:0 "和家不一样"
 Koryagin.13.desc:0 "爆裂声。\n\n建筑入口处的尖锐声响引起了下士马修的全部注意力，他望向门口。\"这他妈比杰克·弗罗斯特的尸体还要冷啊，\"他听到他的下士罗恩抱怨着，他一脚踢门关上，足够用力，使铰链都在震动。\n\n马修笑了起来，\"这？不，伙计，我来自蒙大拿。这种天气，先生，对我来说是正常的十二月天气。\"马修喜欢和这些加利福尼亚嬉皮士开玩笑，他们总是在抱怨。马修是个虔诚的蒙大拿人，他能应对这种天气。\n\n\"如果没那么糟，你怎么不脱下外套绕兵营跑两圈呢，\"下士回嗓子。马修的讥讽笑容消失了，他急忙从罗恩的目光中撤回眼睛，重新看向那天早些时候他母亲寄来的信，那封信放在桌子上。罗恩迈向一把附近的椅子，连外套也没费力气脱下，疲惫不堪地坐进座位。他点燃一支香烟，绝望地试图通过烟火回温，弥补他所失去的体温。\n\n门的一声爆裂再次引起了两人的注意，他们的目光转向那位结束了他们短暂休息的人。阿依达走进来，穿着一件短袖T恤。\"朋友们，怎么了？你们里面穿着外套，但是有暖气，对吗？\"此刻，阿依达带着令人恼火的嘲弄微笑，眼睛在两人之间来回扫视，他们露出了相同的困惑、败北的表情。阿依达热情地笑了笑，讥笑道：\"来吧，朋友们，我们15分钟后要进行操练，就在外面！\"他愉快地嘲笑着他的两个同事脸红得发紫，拍了拍军曹的肩膀。\"嘿，没必要感到这么尴尬，好吗？至少你们不是澳大利亚人！\"阿依达指着从行军归来的澳大利亚小队，他们晒黑的脸上带着失败的表情，仿佛半冻僵的人。\n\n马修和罗恩感受到下一次训练的压力，当阿依达挥手告别，轻轻地把门打开了更长的一段时间，让两人再次感到寒冷，仿佛随时可能得冻疮。"
 Koryagin.13.a:0 "“我们可以回家了吗？”"
 Koryagin.14.t:0 "一个遥远而迅捷的国度"
 Koryagin.14.desc:0 "艾扬朝着他小心翼翼地在桌子上整理一堆木板的儿子微笑着说道：\"奥图伊，你又把锤子放错地方了。希望你没有把它留在外面。\"这位青少年的雅库特人吓了一跳，眼睛睁得大大的，开始在工作室里疯狂地搜寻。艾扬笑了几分钟，眼睛闪闪发光，然后指着铁砧说：\"在那儿呢。你把它们挂在边缘上了。\"\n\n奥图伊笑得青春洋溢：\"谢天谢地！我们最后一件事情就是再去杂货店买东西了。\"\n\n\"我们？\"艾扬轻轻地在儿子的胳膊上打了一拳。\"我想你应该是指你自己吧。我这把骨头太老了，懒得去那趟。\"\n\n奥图伊拿起锤子和一把钉子：\"上次我在奥莫隆听到一些人在谈论。关于莫斯科和选举的事情。\"\n\n\"别理会他们。\"\n\n\"但乔科恩说-\"\n\n\"那个孩子不应该向别人炫耀他的观点。我不关心农工党、全俄爱国党或者电视上其他的全俄派政党。那是他们的政治，他们决定给了我们自己的选择。我将投票支持地方解决方案，而不是理念。\"这位木匠解释说：\"每个人都觉得他们家的冬天最严寒。在某种程度上，他们总是对的。如果我去他们的家乡过冬，要求在他们一生都生活在森林中的地方安全地攀登山获得春水，那我很可能在前几年就失败了。我的一些求生方法可能会有所帮助，但是他们能够从湖中切割冰块来确保有水吗？\"\n\n\"我相信他们会的，只要给他们时间。\"奥图伊回答道。\n\n\"是的，如果他们来到这里生活。莫斯科离这里有四千多公里。而且它是由俄罗斯人居住和统治的。他们没有给我们制定自己的法律的自由，只是为了照搬他们的例子。奥图伊，夏天将会来临，你应该带上旅途所需的所有食物，步行旅行数月之久。你只会看到萨哈人，而且大部分时间都会接触到我们自己人。这种生活方式是我们自己来管理的，这片土地是我们自己来呵护的……\""
 Koryagin.14.a:0 "......而我有责任只投票给那些热爱这种生活方式和我们土地的人。"
 Koryagin.15.t:0 "文化冲击"
 Koryagin.15.desc:0 "科里亚金和科瓦列夫一上车，他不禁再次思考着接下来的日子。与OFN代表团成员、美国参议员、国会议员等的会议。那些寄予美好愿望但往往落空的西装和领带。\n\n当车子穿越华盛顿特区时，他忍不住注意到一件事：人们似乎如此放松，步行时仿佛毫无烦忧。但科里亚金记得，美国近年来并没有像俄罗斯那样真正威胁其存在的问题。美国与敌人之间有两片广阔的海洋，它所面临的最近威胁是60年代的导弹危机，即使那也是遥远的世界，对其构成的威胁也是抽象的。像这样的放松对俄罗斯人来说是一种奢侈，尤其是在1941年之后。这就是为什么许多俄罗斯人日渐不喜欢美国和OFN的原因。\n\n但科里亚金并没有感到愤怒，他也没有感到悲伤、背叛或失望。他觉得这是一种和平，是他要努力追求的，超越了纳粹留下的伤痕。这次会议的目的不是一种冷嘲热讽的地缘政治策略，而是通过联盟和友谊来实现和平，而不仅仅是靠武器和钢铁。"
 Koryagin.15.a:0 "或者至少，钢铁在盟友之间传播。"
 Koryagin.16.t:0 "文化冲击"
 Koryagin.16.desc:0 "当科里亚金和科瓦列夫走进车内时，他不禁再次回顾了即将到来的日子。与OFN代表团成员、美国参议员、国会议员等的会议。那些怀着最好意图但常常无法实现的西装和领带。\n\n在车驶入华盛顿特区时，科里亚金思考着美国的生活。看起来和平，尽管围绕着新总统格斯·霍尔，一个公开的共产主义者，空气中有些紧张。科里亚金感到忧虑，但最终认为在见到他之前不应该过多地下结论。共产主义在俄罗斯失败了，但也许它更适合发达的美国。此外，美国仍然拥有其民主制度。这只是一届总统，一个非常左翼的政府，其决策可以在以后被推翻。\n\n当他走出车子时，科里亚金碰巧看向前方的道路，看到一群棕衫军。宾夕法尼亚大道上有一群人直向白宫行进。科里亚金的保镖开始催促他离开，但他想看看他们在示威什么。尽管科里亚金除了寒暄之外无法理解英语，但他能认出抗议者。标语牌上写着类似于“赶走白宫的共产佬”、“美国不是苏联”、“约基是对的”的口号。\n\n当两辆面包车驶入人群前方，防暴警察从车里涌了出来时，科里亚金开始往后退。经过一些犹豫，警察开始向人群推进，用盾牌敲打那些靠近他们的人。与此同时，美国特勤局成员走近了他们。\n\n“科里亚金先生，对吗？”一名翻译说道，“这些人将带我们去与霍尔总统的会面。”科里亚金无精打采地点了点头。\n\n尽管美国首都的建筑美丽壮观，即使他们走过大理石建筑和大厅，科里亚金只能对接下来可能发生在美国的事情感到担忧。一个如此分裂的人口无法保持团结，俄罗斯人比任何人都了解这一点。他回想起亚伯拉罕·林肯的一句名言："
 Koryagin.16.a:0 "“一栋裂开的房子是站立不住的。”"
 Koryagin.17.t:0 "文化冲击"
 Koryagin.17.desc:0 "当科里亚金和科瓦列夫上了车，他不禁再次回想起他前方的日子。与OFN代表团成员、美国参议员、国会议员等的会议。虽然穿着西装领带，这些人出于最好的意图，但通常效果不佳。\n\n当车子穿过华盛顿特区时，科里亚金注意到了一些奇怪的事情。街道上空无一人，整个国家似乎都藏起来了。科里亚金听说过围绕美国总统弗朗西斯·约基的争议，但他没想到情况会这么糟糕。他没有听说发生了什么事情吗？\n\n他下了车，停在宾夕法尼亚大道附近，就在白宫旁边。环顾四周，他意识到这里的城市也一片死寂。没有人在街上徘徊，商店已经关门，没有车辆行驶。就像一部恐怖电影中的场景。他朝着白宫走去，当他惊讶地看到有人的时候，随即意识到那只是一名警察。\n\n但当他走近时，他意识到这名警察的制服不对，这不像是一名警察，看上去更像是一名棕衫军。科里亚金示意他的翻译过来，然后问道：“人们都去哪了？”这名民兵看起来很困惑，解释道：“城市目前正在搜捕叛逆分子，到目前为止，已经发现数千人怀有犹太-布尔什维克的情绪。”此时，科里亚金才真正意识到美国发生了什么。他离开了那名民兵，然后平静地向科瓦列夫解释说他要取消所有的会议。美国已经死了，剩下的只是它蹒跚行走的尸体将会做些什么而已。"
 Koryagin.17.a:0 "这就是所谓的自由之地，勇者之乡？"
 Koryagin.18.t:0 "巴尔瑙尔之旅"
 Koryagin.18.desc:0 "安纳托利·科里亚金从衬衫口袋里慢慢取出一张皱巴巴的小纸条，在月光照耀下勉强辨认出上面的内容。\n\n“舒克申住所——18号房间。房间……19号？不对，是18号。我们都是从某个破烂地方起家的，我想。”\n\n他小心翼翼地将生锈的钥匙插进公寓门上，踏入黑暗中，心里没底。当然没想到，他刚一进门，立刻被十几个箱子压倒了。\n\n“天啊，真差点把我压死！到底是怎么回事，他为什么把这些垃圾都留在这里？他总是这样住吗？”\n\n打开几乎无法运作的电灯开关，科里亚金很快明白了为什么会有这么多“垃圾”。这间公寓实际上只有一个房间。左边是一个破旧的简陋床，右边是一张老旧的木桌，几乎没有存放空间。更别提现在散落在狭小的地板上的成百上千封信件了。\n\n“嗯，看来是有道理的。从这堆乱七八糟的东西中找到一份报告可能要花上几个小时了。我早知道应该趁机会派我的秘书过来。”科里亚金嘟囔着，在一堆堆布满灰尘的文件中漫无目的地翻找。\n\n好奇地，科里亚金随手拿起一封信封，看看里面是什么。一张小小的手写便条，旁边画着一个简单的人物，应该是舒克申，他站在一个同样简单的三口之家旁边。\n\n“亲爱的舒克申，妈妈说爸爸喜欢你。我再也没有见过他了。但是如果他喜欢你，那我也喜欢你。”科里亚金默默地凝视着这张带着孩子气错误的便条。\n\n把信放回盒子里，他注意到信封里还有一张小纸条。一张回信，笔迹更清晰。"
 Koryagin.18.a:0 "“谢谢你，米夏。”"
 Koryagin_News.1.t:0 "[Get_newspaper_header]俄罗斯联邦加入自由国家组织！"
 Koryagin_News.1.desc:0 "科里亚金总统在华盛顿的白宫和俄罗斯新西伯利亚的联邦议会同时发布的广播中正式宣布：俄罗斯加入自由国家组织。\n\n随着第二次西俄战争的结束，联邦重新建立了自由选举制度，使得由黑马候选人安纳托利·科里亚金领导的俄罗斯社会自由党能够执掌政府。该党承诺增加国际合作，减少军事开支，并努力与其他“民主堡垒”接触，通过贸易扩大地区承诺和经济联系。\n\n尽管有人将这一宣布视为华盛顿对自由世界掌控的再次确认，但毫无疑问，俄罗斯加入该组织将大幅增强其在全球范围内的存在。随着德国的燃烧和日本势力范围内抵抗力的不断增强，这一举动只是进一步巩固了未来多年的新全球秩序。"
 Koryagin_News.1.a:0 "为了一个光明繁荣的联盟！"
 Koryagin_News.1.b:0 "自由世界逐渐壮大。"