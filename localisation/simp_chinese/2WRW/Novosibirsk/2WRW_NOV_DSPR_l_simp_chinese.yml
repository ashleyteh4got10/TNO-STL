l_simp_chinese:
 NOV_Leonid_Kantorovich:0 "列昂尼德·康托罗维奇"
 POLITICS_LEONID_KANTOROVICH_DESC:0 "列昂尼德·康托罗维奇一直是一个擅长数字的人。他在1939年有效地发明了线性规划，这一成就备受美国人的争议。然而，他最伟大的成就和最大的失败都发生在纳粹入侵之后。\n\n他亲眼目睹了列宁格勒的情景，看到母亲们为了喂养孩子而被饥饿至死，只能给他们吃面包屑和发霉的水果皮。康托罗维奇走过生命之路，在那里他运用数学知识计算卡车运送食物和难民穿过贫瘠的冰面的最佳路线。他挽救了无数条生命免遭野蛮种族灭绝。然而，仅在列宁格勒就有数以百万计的死亡人数。\n\n当列宁格勒沦陷后，他撤离到斯维尔特拉市，加入了新生的沃兹涅辛斯基内阁。但这个政府没有持久，被§x左派§!、§8右派§!和§e北方势力§!攻击而倒台。之后，联邦党在俄罗斯西部掌权。康托罗维奇加入了半合法的§x民粹派§!运动，却发现其中也滋生着那些科米共产党的疯子们。他在革命者身上看到了那种点燃谢罗夫眼中火焰的激情，看到了苏斯洛夫在妻子葬礼后返回党营的疯狂愤怒。因此，他直言不讳、理性地谈论了继续试图推翻联邦政府的疯狂行为。一些人倾听并跟随他的话语。\n\n尽管民粹派运动如今分裂成了§P康托罗维奇-右翼改良派§!和§x加兰斯科夫-左翼革命派§!，但联邦仍然占据着曾经属于苏联的土地。两代坚定的共产主义者并不准备向§g巨企们§!和资产阶级低头，无论他们多么§B光荣§!。不，现在是改变的时候，要在§e杀人的布尔什维克§!和§g剥削的资本家§!之间划清界限！是时候建立一个平等的联邦，一个无产阶级的联邦，§P一个正义与繁荣的联邦了！§!"
 NOV_the_kantorovich_presidency:0 "康托罗维奇任期"
 NOV_the_kantorovich_presidency_desc:0 "尽管瓦西里·舒克申或许迈出了击败那些寄生于我们伟大祖国的£GFX_NOV_VRPP_Icon §g反动寄生虫§!的第一步，但很明显，他并没有完成这项任务的意图。\n\n请欢迎£GFX_NOV_DSPR_Icon §P俄罗斯民主社会党§!的总统列昂尼德·康托罗维奇！\n\n虽然康托罗维奇可能没有§x列宁§!或§e马克思§!那种革命热情，但他发誓要致力于俄罗斯工人阶级的福祉事业。在§g资本巨头§!的对立面和§g军事鹰派§!的夹击下，道路并不容易。然而，如果有任何政党可以真诚地做到这一点，那就是£GFX_NOV_DSPR_Icon §P俄罗斯民主社会党§!！"
 NOV_the_root_of_all_evil:0 "邪恶之根"
 NOV_the_root_of_all_evil_desc:0 "人类历史上，没有比贪婪、懒惰和愤怒更大的敌人来阻碍人类的进步。\n\n尽管§g西比尔、泰坦和凤凰§!的高管和股东现在可以安心休息，但俄罗斯的劳动人民将把战斗带到他们舒适的办公室，并彻底推翻建立在劳动人民苦难之上的象牙塔。\n\n§x过去的民粹派§!失败了，但康托罗维奇和格里戈连科将完成他们所开始的事业。为了俄罗斯！"
 NOV_greed:0 "贪婪"
 NOV_greed_desc:0 "无论是在食物、财富还是物质财产方面，掌控我们的银行和经营我们工厂的资本主义寄生虫最关心的就是用掠夺来的财富填满自己的腰包。我们再也不能对吸干我们祖国和人民的鲜血的吸血鬼视而不见。\n\n西比尔是贪婪的最典型体现。通过财团投资和无情扩张，这只腐败的熊继续啃食着工人阶级所能紧抓的微薄自由。在总统康托罗维奇和£GFX_NOV_DSPR_Icon §P民主社会党§!的帮助下，我们将最终击败这只膨胀的野兽，阻止它的饥饿大口无法抵挡的势头。"
 NOV_plots_upon_plots:0 "计中计"
 NOV_plots_upon_plots_desc:0 "如果我们不能以心灵和思想击败那些腐败的熊，那么我们就以他们扭曲的游戏来战胜他们。敲诈勒索。\n\n虽然关于爱戴的£NOV_RAPP_Icon §B俄罗斯农工党§!总统瓦西里·舒克申被企图暗杀的官方说法将责任归咎于一名疯狂的疯子，但我们的私人调查员发现了该\"疯狂的疯子\"与叛逆的£GFX_NOV_VRPP_Icon §g全俄爱国党§!之间的某些联系，而这些联系得到了与西比尔高管直接相关的神秘现金的支持。\n\n通过\"提醒\"某些£GFX_NOV_VRPP_Icon §g全俄爱国党§!官员他们所属政党的叛国行为，我们可以获得对立方的政治支持，同时也可以在我们决定公开这些信息时把一把断头台悬挂在西比尔的头上。"
 NOV_dissuade_the_opposition:0 "揭发反对派"
 NOV_dissuade_the_opposition_desc:0 "虽然以这种方式对待为资本主义精英服务的人并不理想，但如果我们要推动我们的法案生效，我们迫切需要在高层拥有盟友。\n\n尽管£GFX_NOV_VRPP_Icon §g全俄爱国党§!和西比尔公司的许多人视我们为“肮脏的共产主义者”，但我们公司内部的联系人已经发现了一些潜在支持我们事业的人。\n\n我们将通过可信度存疑的合法手段“说服”这些联系人站在工人阶级的一边，但目的将证明手段的合理性——至少我们不会轰炸任何人。"
 NOV_poke_the_sleeping_bear:0 "撅一撅睡着的熊"
 NOV_poke_the_sleeping_bear_desc:0 "西比尔公司不仅对劳动者的自由构成威胁，也对整个俄罗斯联邦构成威胁。我们必须确保人民清楚地意识到这个粮食巨头的威胁有多么危险，无论是否夸大其词。\n\n为了为西比尔公司的完全拆除铺平道路，我们必须首先说服公众这种激进行动是必要的。我们将展开一项大规模的宣传行动，以实现这一目标。号召真正的俄罗斯爱国者行动起来，那些为了国家进步而在矿山和工厂劳动的人们。我们团结在目标和行动上，以和平和民主的方式向资本家们发起斗争，就像我们的前辈们曾经大胆挑战一样。"
 NOV_carving_the_beast:0 "雕刻野兽"
 NOV_carving_the_beast_desc:0 "随着西比尔的参与揭示出对§B前总统§!的暗杀企图以及向£GFX_NOV_VRPP_Icon §g全俄爱国党§!账户进行的各种资金交易，他们的股价已经自暴跌至未曾见过的水平，可与大动乱时代相提并论。\n\n股东们已经看透了大势，他们同意通过慷慨的政府救助——或者说是买断来出售他们的股份。然而，我们并不准备完全将西比尔国有化，尽管我们会保留一部分股权。相反，相反，我们将以极低的价格将这些公司资产拍卖给新成立并§P支持民主社会党的西比尔工业联合会§!。通过和平而巧妙的手段，我们真正实现了从这家嗜血的巨企社会化生产资料的目标！"
 NOV_sloth:0 "懶惰"
 NOV_sloth_desc:0 "泰坦公司在外部看起来是联邦技术创新的前沿，但一旦深入公司办公室，情况却完全不同。随着第二次西俄战争的结束以及德国在欧洲霸权的终结，不再需要新的尖端战争武器。因此，利润率急剧下降，在公司总部内可以看到一幅绝望的画面。\n\n尽管如此，泰坦公司仍然疯狂地紧抓校园和学术圈的垄断地位。我们绝大多数杰出的校友都被泰坦公司吸引进来，被承诺着“有前途的机会”和“上升空间”。在我们彻底打垮他们之前，我们必须用无情的侵略夺走他们唯一的优势，否则我们的联邦只会变成一个巨大的智囊团。"
 NOV_discredit_the_think_tanks:0 "抹黑智库"
 NOV_discredit_the_think_tanks_desc:0 "虽然我们无法直接买下泰坦的力量，但我们肯定可以发表我们自己的看法。自第二次西俄罗斯战争结束以来，军国主义情绪已经大大降低，我们将利用这个事实来贬低泰坦及其研究。\n\n毕竟，为什么要设计新的坦克或炸弹，当你可以设计新型的先进拖拉机！军事装备已经脱离了现代俄罗斯的需求，我们将公开表明我们的立场。"
 NOV_free_the_universities:0 "解放各大学"
 NOV_free_the_universities_desc:0 "通过近二十年的不断战争，我们充满希望的学生们被派往科技前线，设计并投入生产了一些迄今为止世界上最先进且廉价的军事装备。\n\n虽然泰坦可能在击败德国方面发挥了关键作用，但他们对我们大学毕业生的控制以及拒绝进军民用经济领域的局面必须结束。联邦政府将不再提供国防方面的合同，而是发放在其他被忽视的科学领域中的有前途的奖学金和学者金，为好奇的年轻毕业生提供无法拒绝的机会。这在短期内可能会对我们的钱包造成伤害，但对工人阶级而言，创新所带来的收益远远超过国家作为商业实体的资产阶级观念。"
 NOV_balance_the_academia:0 "平衡学术界"
 NOV_balance_the_academia_desc:0 "学术研究长期以来一直只关注如何寻找新的方式来杀害其他人类。这种情况在我们的科学领域中不能再持续下去。\n\n我们将会平衡我们的研究，着眼于计算机编程、农业工程和建筑领域的创新。通过剥夺泰坦的新概念，我们将剥夺他们未来可能的利润。"
 NOV_knowledge_unchained:0 "知识不受束缚"
 NOV_knowledge_unchained_desc:0 "我们的努力卓有成效，剥夺了泰坦唯一的王牌。联邦的研究领域不再以战争和破坏性潜力为主导。俄罗斯的大学不再受制于杀伤性武器的发展。我们已将我们的子孙后代从这种命运中解放出来。\n\n通过康托罗维奇总统和£GFX_NOV_DSPR_Icon §P民主社会党§!努力，我们从企业垄断的魔掌中拯救了我们最聪明的头脑。有了这个毁灭性的打击，泰坦将慢慢变得无关紧要，并最终被卖给出价最高的人——没有比我们的政府更高的出价者了，他们可以利用他们现有的基础设施来实现更大的目的。高管们的悲惨命运，但恰好与我们既定的目标一致。"
 NOV_wrath:0 "愤怒"
 NOV_wrath_desc:0 "凡人存在于这个地球上的时间里，我们一直在战斗。从用石头、矛、弓箭和火枪，到现在的飞机和机关枪。我们总是制造出新的战争武器来互相残杀。凤凰是这个不幸事实的血腥象征。他们是愤怒的仲裁者。\n\n尽管泰坦是联邦军事体系的智囊，但凤凰才是力量的源泉。他们在俄罗斯及其领土上的数千家工厂中生产出数百辆坦克、导弹和飞机。如果我们要结束他们在武器生产上的垄断——毫无疑问，这被用来支持不必要的外国战争——我们必须切断他们血液中流动的钱。他们不仅得到了数百名股东的支持，还得到了我们自己政府的支持。几十年来，他们已经获得了数十亿的资金来保持我们的战争机器运转。\n\n康托罗维奇总统和£GFX_NOV_DSPR_Icon §P民主社会党§!已经提出大幅削减军事预算采购，将这些资金重定向到急需的民用部门。我们不打算真正降低军事预算本身——我们并不是§M和平主义者§!，而是让士兵们用他们的力量从土地上带来食物，而不是尸体。"
 NOV_boil_away_the_fat:0 "煮掉脂肪"
 NOV_boil_away_the_fat_desc:0 "凤凰虽然是联邦最重要的国防承包商，但却是一个臃肿的烂摊子——它甚至被称为凤凰控股公司！包括从莫斯科到马加丹的制造工厂，它们的卷须从一个海域蔓延到另一个海域。我们必须通过无情的政府破坏信任和收购来慢慢煮掉使俄罗斯皮肤膨胀的脂肪。\n\n俄罗斯的盾牌将不再由企业诉讼的寡头集团挥舞。无论他们喜不喜欢，我们都会亲自采取行动——但这并不容易。 凤凰令人讨厌，但违法购买几小块馅饼是不值得的。我们将开始我们的努力，但我们需要找到一些大的东西，一个真正能够击垮凤凰的大借口。"
 NOV_expose_their_skeletons:0 "暴露他们的骨架"
 NOV_expose_their_skeletons_desc:0 "关于凤凰公司总部内发生的某些……不当行为的谣言一直在当前内阁中传播。\n\n由于拟议的重组我们的国防开支的法案遇到了比预期更多的反对，如果我们要顺利通过立法，£GFX_NOV_DSPR_Icon §P民主社会党§!需要在凤凰公司壁橱里徘徊的不仅仅是一些骨架。幸运的是，我们有相当多的调查员同情我们的事业，或者只是鲁莽的声望猎人。无论哪种方式，我们都可以利用它们来发现我们知道这些大公司正在犯下的恶行。他们的罪孽将被公之于众，从而被根除！"
 NOV_melt_the_slush:0 "融化雪泥"
 NOV_melt_the_slush_desc:0 "在凤凰的各个地点，每天都生产着各种经政府批准的军事装备。虽然这些合同无疑大大加强了我们的军队，但是我们应该考虑其他承包商来满足我们军队的需求。\n\n我们将逐渐消减我们现有的资金义务，并让那些不能简单削减的义务在到期后不再续签。如果没有持续的政府资金注入，凤凰将逐渐失去其主要收入来源，进一步增加他们未来面对挑战的脆弱性。但是他们没有权利抱怨，毕竟这是一个自由市场！我们只是在寻找替代选择，如果您愿意的话。"
 NOV_ashes_to_ashes:0 "尘归尘"
 NOV_ashes_to_ashes_desc:0 "我们在与凤凰的斗争中最大的王牌尚未打出：他们与£GFX_NOV_VRPP_Icon §g全俄爱国党§!有联系。\n\n据发现，党内某些高级官员参与了枪支走私行动，其中包括几名凤凰高管的支持。\n\n俄罗斯制造的枪支正进入北满洲平原，并出现在反对共荣圈的游击队手中。这不仅严重无视联邦政府的权威，还将俄罗斯卷入一场已经取得圆满结局的冲突。\n\n我们将使用此信息对凤凰及其在£GFX_NOV_VRPP_Icon §g全俄爱国党§!中的盟友发起协同攻击，严重损害他们在公众中的声誉，并为以破坏信任为目的的全面解体提供了理由——而且其剩余的许多股份可以……重新用于政府经营的工资收入基金。那些责任人将在£GFX_NOV_DSPR_Icon §P民主社会党§!的合法眼睛下被绳之以法，在这只愤怒的鸟对我们的祖国造成更多伤害之前干掉它。"
 NOV_death:0 "末日"
 NOV_death_desc:0 "我们胜利了！\n\n嗯，至少在很大程度上是这样。我们在遏制企业影响力方面的努力取得了成功，但在公众中引起了争议。关于西比尔阴谋和凤凰与背叛的£GFX_NOV_VRPP_Icon §g全俄爱国党§!之间的腐败的揭露严重损害了他们的公众声誉，但街头上仍有许多误导的反动分子将他们视为自己的恩人。\n\n在我们的运动面临其他紧迫问题时，我们无法永远专注于这些诽谤攻击。联邦的工人和青年仍然需要我们，必须在康托罗维奇离职前采取行动，因为我们深知，凭借我们的有争议政策，我们能够持续一段时间，而不是很长时间。"
 NOV_raise_class_consciousness:0 "提高阶级意识"
 NOV_raise_class_consciousness_desc:0 "如果说现在有一个阻碍工人阶级成功的障碍，那就是企业力量。但就在这之下是阶级意识。\n\n苦苦挣扎的欧洲人民一直是无休止的暴行、剥削和奴役的受害者。我们必须提醒他们这个问题的根源在哪里：资产阶级剥削。\n\n虽然康托罗维奇不是列宁或马克思，但他是俄罗斯创造一个没有无尽流血的真正平等社会的唯一机会。帮助我们的民众意识到这是实现这一目标的重要的第一步。"
 NOV_through_our_labor:0 "……通过我们的劳工"
 NOV_through_our_labor_desc:0 "数百万人在联邦及其关联国家中，以微薄的工资在几乎无法生存的条件下辛勤劳作，往往连基本生活必需品都难以支付。\n\n我们必须关注工人的斗争，给予他们应得的报酬，而不仅仅通过可以随时被取消或在观众面前摇摆的政府计划来实现，而是通过他们自己的力量。我们将为即时卡检、以及在30天内要求达成合同的要求而战，这是一项被一些人称为《自动工会化法案》的广泛劳工权益法案。\n\n尽管企业家和脆弱的强人们可能会尖叫并敲打他们的桌子，但他们无法阻止进步。随着£GFX_NOV_DSPR_Icon §P民主社会党§!的掌权，§P民主社会主义§!的事业在继续前进。无论是否得到资产阶级的同意。"
 NOV_blood_and_tears:0 "鲜血与眼泪"
 NOV_blood_and_tears_desc:0 "我们没有忘记§x民粹派§!的遗产！\n\n在中西伯利亚共和国的历史上，以及他们分裂成零散的州之后，远在舒克申上台之前，§x民粹派§!就已成为在新西伯利亚内一股有影响力的变革力量，尽管他们对无政府主义破坏和肆意破坏的呼吁是极其误导的。\n\n§g猎鹰§!毫不留情地利用一切手段残酷地铲除了他的企业游乐场中的抵抗力量。从那时起，西比尔、泰坦和凤凰只是继续剥削那些接触到它们的人，社会主义事业在联邦内从未真正恢复。\n\n直到现在。\n\n普通人对他们的苦难毫不知情。对他们的事业也毫不了解。我们将通过£GFX_NOV_DSPR_Icon §P民主社会党§!的声音让他们意识到。\n\n§x民粹派§!的过去之火将重新点燃，当然要非常谨慎。在宣传海报、社会主义教科书和我们的内心中。最大的声音是普通俄罗斯人的声音，通过我们的辞令赢得他们的支持，我们赢得了联邦未来的战斗。当然，这些高涨的期望不会对我们产生反噬！"
 NOV_sweat_and_sorrow:0 "汗水与悲伤"
 NOV_sweat_and_sorrow_desc:0 "我们工人的工作条件糟糕透了。\n\n无论是在火山炼制厂的封闭空间内、危险的煤矿中还是日夜繁忙的医院里，我们的工人一直在工作场所中遭受痛苦。\n\n我们将在我们激进盟友中展开运动，为工人的权益而战，通过由£GFX_NOV_DSPR_Icon §P民主社会党§!提出的《自动工会化法案》。\n\n尽管在§B农工党§!政府后出台了《工人权益保障法》，但它们是脆弱的且难以执行。作为社会主义者，我们明白，对工人来说，最强大的斗士就是他们自己。通过解除工会化的障碍，允许任何提议单位中超过50%的团体立即工会化，并要求企业所有者立即进行谈判，我们可以为工人武装提供足够的工具，为争取自己的权益而战。\n\n那些强人和小暴君会大声叫嚷这会让企业变得不可行，但让他们叫吧。毕竟，如果劳工和安全对他们来说太昂贵，而工人阶级能够为自己辩护，那么他们的经营就是不道德的，应该被制止。"
 NOV_shield_of_the_common_man:0 "平民之盾"
 NOV_shield_of_the_common_man_desc:0 "在一个以资本为基础的社会中，统治阶级总是会努力压制工人阶级——这只是基本的马克思主义。尽管《自动工会化法案》在我们激进工人联系人中获得了广泛支持，但议会对立派别的£GFX_NOV_VRPP_Icon §g反动分子§!、甚至是我们以前在£NOV_RAPP_Icon §B农工党§!里的盟友都表达了他们的观点，明确而响亮。\n\n然而，我们的工人联系人现在已经领导了许多新生工会组织斗争，赢得了更广泛的工人阶级层面的有机尊重。我们可以向这些联系人传递信息，告诉他们£GFX_NOV_DSPR_Icon §P民主社会党§!是他们对抗资本主义剥削力量的银盾。我们是他们在危险工作条件、微薄薪水和劣质休假方面的盟友。让工人阶级团结起来，走上街头，通过为一个真正的无产阶级政党而战，获得阶级意识！在我们总统的每次演讲、每次讲话和每天的红场活动中，让工人阶级及其为组织权而战的斗争成为焦点！"
 NOV_through_our_teachings:0 "……通过我们的教育"
 NOV_through_our_teachings_desc:0 "我们年轻一代的思想是一种可塑的物质，受到我们前辈们的操控和塑造。\n\n过去十年里，我们的孩子被教导要欣赏§g企业§!和§g精英§!，为了少数人的利益而过上他们的生活。这是一种不容忍的耻辱。\n\n我们将重新设计我们的课程，以欣赏工人智慧和劳动的价值。下一代将被教育重视他们自己的工作，不是过度个人主义的方式，而是强调集体合作的力量。\n\n我们联邦的教师们将在这个项目中提供帮助。毕竟，多亏了我们党的努力，教师们大部分都加入了工会。即使是我们联盟内的成员，那些西装革履的人也可以对教育课程提出抱怨！但他们不能阻止工会领导和各种激进分子（当然与£GFX_NOV_DSPR_Icon §P民主社会党§!无关）更加强调某些概念。让他们试着解雇每一位表达自己谦虚意见的教师吧！"
 NOV_aching_stomachs:0 "胃痛"
 NOV_aching_stomachs_desc:0 "数千名儿童饥饿地躺在床上。营养不良是一种可怕的疾病，它对人生产生长期影响，如智力下降、肌肉减弱和社交技能变差，而除了造成人类的痛苦之外，它还带来了更多的痛苦。康托罗维奇总统深知饥饿的可怕，深知在严寒中挨饿的痛苦。\n\n我们不能容忍这种状况的存在。康托罗维奇总统和£GFX_NOV_DSPR_Icon §P民主社会党§!将从我们臃肿的军事预算采购支出中重新分配更多资金，并利用这些资金启动全国范围的食品运动。菲尼克斯和西伯尔的资产也将被变卖以支持我们的努力。这让我们的竞争对手£GFX_NOV_VRPP_Icon §g全俄爱国党§!甚至£NOV_RAPP_Icon §B农工党§!感到沮丧。\n\n§g反动派§!和§B保守派§!可能会为\"削弱我们的军队\"而大声抗议，但在康托罗维奇执政下，他们的声音变得微不足道。我们公平竞选成功了，让他们想怎么抱怨就怎么抱怨吧！"
 NOV_empty_bookshelves:0 "空书架"
 NOV_empty_bookshelves_desc:0 "我们的学校状况可谓堪忧。\n\n自俄罗斯在我们的旗帜下重新统一以来，学校的质量基本保持不变。随着第二次西俄战争和随后军费大幅增加，情况只会变得更糟。\n\n我们的书架空荡荡的，所以我们必须填满它们。数百万资金将用于彻底改革我们的教育系统，而政策将由我们自己的教师制定，以帮助我们引领方向。在联邦境内，任何孩子进入我们的学校都将有公平的机会。"
 NOV_guardians_of_the_next_generation:0 "下一代的守护者"
 NOV_guardians_of_the_next_generation_desc:0 "我们，£GFX_NOV_DSPR_Icon §P民主社会党§!是下一代的先驱者。我们的年轻人将通过教科书而非子弹学会欣赏社会主义的价值观——团队合作、善意和辛勤工作，通过康托罗维奇和普柳希提出的新指令，以满足他们的饥饿感。\n\n其他政党要想扭转我们的好处将会很困难，但我们将资金从枪炮和坦克转移的举措已经引起了右翼退伍军人和愤世嫉俗的企业家们的强烈反对声。\n\n幸运的是，我们掌握着总统权力。我们可以进行广播，广泛传播我们的信息，以及与我们自己几乎称霸的有组织劳工内部的联系人进行交流，向他们的谈判单位传达我们£GFX_NOV_DSPR_Icon §P民主社会党§!所通过的伟大政策。\n\n马克思主张建立一个工人阶级的政党。让我们确保工人们明白到底是§P哪个党派§!。"
 NOV_the_next_day:0 "第二天"
 NOV_the_next_day_desc:0 "我们已经尽力而为，甚至超出预期，然而，战斗似乎才刚刚开始。\n\n虽然我们已经打败了那些“无法失败的巨兽”，并大幅增加了工会化的劳动力，显著改善了工人阶级和学生们的日常生活，但似乎我们所能做的一切都无法阻止一贯存在的右翼反对我们崇高目标的势力——甚至包括一些保守而误导的工人！\n\n就算我们的双手有些脏了又怎样呢？如果他们知道了普里马科夫掌权后生活会是怎样的，那么民主将会真正被摧毁，取而代之的将是企业的贪婪和再次长达十二小时的工作日。然而，一些老兵们似乎并不在意，被媒体中残存的企业影响所蒙蔽。\n\n无论他们接受与否，§P民主社会主义§!已经给俄罗斯注入了新的活力，联邦国家迈入了一个崭新的时代。我们仍然有很多工作要做，通过和平手段来消除剥削，创造一个更美好的世界，但我们已经迈出了第一步，并以坚定的一击开始了。\n\n§P剩下的事情将由工人阶级在时间的推移中完成。§!"
