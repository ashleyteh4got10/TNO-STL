 NOV_Petro_Grigorenko:0 "佩特罗·格里戈连科"
 NOV_Leonid_Plyushch_hog_desc:0 "§Y俄罗斯联邦副总统§!\n£NOV_DSPR_Icon §P俄罗斯民主社会党§!\n--------------\n列昂尼德·伊万诺维奇·普柳希生于1938年4月26日，出生地为吉尔吉斯苏维埃社会主义共和国。他的童年充满了悲伤，8岁时患上了肺结核，而他的父亲在卫国战争中献出了生命。在中亚陷入无政府状态时，他的母亲带他前往中部西伯利亚。他在新西伯利亚获得了数学学位，但当工作变得稀缺时，他开始发表关于人类生物学的论文。\n\n在此期间，他参与了旨在结束西罗维基政权的异见网络，但最终被关押起来。尽管在西罗维基监狱度过了一段时间，他的决心从未动摇，很快他引起了康托罗维奇的注意，并被他收入麾下。现在，他终于有机会帮助普通人，并将他的数学学位发挥到实际。"
 NOV_Alexander_Lavut_for_desc:0 "§Y外交部长§!\n£NOV_DSPR_Icon §P俄罗斯民主社会党§!\n--------------\n亚历山大·帕夫洛维奇·拉乌特于1929年7月4日出生，他父亲是企业家帕维尔·伊里奇·拉乌特，他是20年代苏联文化中热情洋溢的人物。 拉乌特将在教育事业和大动乱时代的麻烦之间取得平衡，写作反对西罗维基政权，并倡导经济管理和工作条件改革。\n\n今天，随着舒克申的改革，他和他的同伴加入了俄罗斯民主社会党。在被康托罗维奇本人注意到之前，拉乌特会迅速晋升。最后，这位贫困教师可以无条件回馈社会。"
 NOV_Petro_Grigorenko_sec_desc:0 "§Y国防部长§!\n£NOV_DSPR_Icon §P俄罗斯民主社会党§!\n--------------\n佩特罗·格里戈连科出生于1907年10月16日，使他成为康托罗维奇最年长的工作人员之一。他毕业于库依比舍夫军事工程学院，并很快加入苏联军队，在诸多战役中参与了卡尔金高勒战斗。在卓越的战斗中，他奋勇作战，但在叶戈罗夫元帅的指挥下被迫撤退。\n\n他很快逃往科米，与其社会民主党人结盟，之前他曾经历政治委员干预士兵工作的混乱，但由于俄罗斯政局的不断变化，很快变得无足轻重。这种情况因康托罗维奇总统的个人召唤而发生改变，现在他再次履行职责，保卫自己的祖国。"
 DSPR.1.t:0 "一个简单的等式"
 DSPR.1.desc:0 "“我的思维方式非常简单。”新就职的总统康托罗维奇吸了一口烟，电视摄像机对准了他。“社会可以被优化。生活可以被优化。人类福祉可以最大化，而且非常简单。”\n\n他挥动着香烟，将烟灰洒落在沾满咖啡渍的工作室地毯上。“我们俄罗斯人并没有那么不同。我们希望过上美好的生活。有家人可以照顾，并且能够照顾他们。一份能够赋予我们尊严的工作，以及诚实的劳动。民主，让我们能够对我们国家的管理有所发言。现在，兄弟姐妹们，我不是一个激进派。我一直反对暴力以及政治鸿沟两边极端分子使用的革命言论。但我简单地认为，没有理由不将民主延伸到职场。”\n\n主持人列夫·伊布拉莫维奇是一位穿着廉价西装的中年男子。他眯起了眼睛。“康托罗维奇总统，我无法看出这与布哈林主义有何不同。您可能赢得了选民的支持，但您的经济政策在我看来只会带来灾难。”\n\n康托罗维奇清了清嗓子。“你犯了一个非常基本的错误，我的朋友，”他说。“请让我简化一下。当我们谈论社会主义时，我们指的是与布尔什维克对经济的理解非常不同。我们的提议是追求社会化，而不是国有化。”\n\n他轻轻吸了一口烟。“在布哈林时期，工业被国有化了。它是由政府拥有和经营，以谋求政府的利润。我们的经济政策是社会化——也就是说，企业应该归那些在其中工作的人所有，并为他们的利益而运营。我们从早期实验中发现的数据是清楚的。消除剥削性的企业所有者，将民主下放到地方层面，改善教育、医疗和安全——这些是获得更美好生活的关键。”"
 DSPR.1.a:0 "“我们将帮助俄罗斯掌握它们。”"
 DSPR.2.t:0 "过往幽灵"
 DSPR.2.desc:0 "佩特罗·格里戈连科，前将军，靠在别墅窗户上叹了口气。外面下着雨，轻柔的滴答声拍打在玻璃上，滴在泥土上形成水珠。灰色的云遮蔽了阳光。他并不总是有这种感觉——孤独、无用，只是坐在那里等待时间过去，直到再次入睡。曾经有一段时间，他为了某个目标而奋斗，他坚守自己的理想，尽力让俄罗斯变得更好。\n\n当西俄罗斯革命阵线解体，合作者夺取了李可夫和萨马拉之间的地区时，他与沃兹涅先斯基一起留在科米共和国宣布独立。他和奥佩尔津将军尽力将微弱的民兵组织转变为一支真正的战斗力量，至少能够抵挡住南方的土匪和反动势力。但即使那时，科米共和国也在腐败。\n\n当年，格里戈连科将军并没有太多选择。苏斯洛夫和他的狂热分子们疯狂地谋杀人们，将他们控制的社区变成了监视国家。然后还有布哈里娜，她为了社会主义而如此渴望，以至于要将其强加给工人阶级。至于赫丹诺夫……一旦你深入研究他的理论，就会发现它们是超越常理的。疯狂，不亚于此。\n\n所以他与科米社会民主党合作了。但他们几乎好不了多少——他们执着于民主，是的，但为了与资本的微不足道的联盟而牺牲了社会主义。他们没有那么残忍，但同样残暴。而且很快，他们允许纳粹同情者和疯子们组建帮派。为什么？为什么不在他们破坏城市之前将纳粹同情者和疯子们驱逐出去？第一次私刑行动仅仅在几周后发生。即便如此，人们仍然在窃窃私语中称沃兹涅先斯基对待科米人民的态度并不友好。\n\n所以他黯然离去。科米共和国覆灭了，他躲了起来。他在那里躲藏了多年，未被发现，沉浸在自己的痛苦和屈辱之中。因此，当他收到康托罗维奇总统的正式信函，请求他担任安全部长的职务时，他感到非常惊讶。"
 DSPR.2.a:0 "抛开苦难是很难的。更难的是，要再次产生希望。"
 DSPR.3.t:0 "用减法做加法"
 DSPR.3.desc:0 "“必须有一种方法来进行客观评估，”康托罗维奇总统争辩道。 “以数学方式确定先杀死哪只巨企的某种方式。”\n\n“恐怕不行，”杜马议员列昂尼德·普柳希回答道，“有太多因素无法进行真正客观的决策。不管好坏，我们只能相信直觉。”\n\n康托罗维奇摇了摇头。“多么令人沮丧，”他叹了口气，翻了翻白眼。“好吧，我不会让我们陷入决策瘫痪的困境。摆出选择。”\n\n康托罗维奇将两个明信片大小的文件夹放在桌子上。“由于泰坦公司是政治活动最少的大型企业，党已决定不首先打破他们的垄断地位。这就只剩下西比尔和凤凰供我们选择了。”\n\n“西比尔或许是最危险的大型企业。由于他们控制着银行业，他们有能力大力资助右翼反对势力，并有可能成为资产阶级统治努力的焦点。由于他们基本垄断了我们的粮食供应，如果他们背叛我们的政府，后果可能会很糟糕。此外，有传言称他们与瓦西里·舒克申的关系已经破裂，以至于农工党及其官员之间私下里产生了争执。”\n\n“另一个选择是针对凤凰进行解体。他们公开支持全俄爱国党和许多次要的右翼政党，其中包括我们认为是新法西斯主义的政党。更不用说他们雇佣了数十个私人工会打手。”普柳希打开文件夹，翻到第三页。“但更重要的是，我们有证据表明凤凰正试图寻找支持，以实施一系列旨在降低贸易壁垒并允许他们剥削中国、巴尔干和其他较小国家工人的国际‘干预’行动。如果我们现在不解体他们，不同的政党最终会夺取总统职位，他们肯定会利用自己的影响力开始无休止的帝国主义战争。”\n\n“决策权在您手中，总统先生。”"
 DSPR.3.a:0 "鉴于西比尔对我国粮食供应的控制，我们将先对付他们。"
 DSPR.3.b:0 "考虑到全俄爱国党对俄罗斯民主的威胁，我们将先对付凤凰。"
 DSPR.4.t:0 "指数级增长"
 DSPR.4.desc:0 "康托罗维奇总统站在联邦杜马前，精心准备的演讲在他脑海中流转。他的指关节在讲台上紧紧握紧，在炽热的聚光灯下闪白。他深吸了一口气，然后开始讲话。\n\n\"我记得列宁格勒，\"他说道。议院陷入了寂静。\"我每天都走在生命之路上，测量温度，衡量冰的厚度。所有这一切都是为了确保我的朋友们在战斗中存活下来。\"当他的脑海中不由自主地浮现出冻伤和炮火声时，列昂尼德的声音变得颤抖起来。\"我曾以为自己有良好的意图，我是无私的。但是当我想起我在计算中度过的时间，我在冰上度过的日子，我想知道这是一种慈善行为，还是一种对饥饿的转移注意力的方式。\"\n\n康托罗维奇摘下眼镜，开始揉着额头。\"我并不是列宁格勒围城的唯一幸存者。还有其他人能够比我更好地讲述那段历史，分享那些记忆。但我们所有人都会告诉你，最糟糕的部分是饥饿。\"\n\n\"为了留点口粮，你得克制自己，以便有足够的食物度过下一天。在下水道里捕猎老鼠。看着你所爱的人消瘦苍白，看着他们的头发脱落，指甲松动和破裂。不，轰炸并不是最糟糕的部分——那段时间最可怕、最深刻的回忆是饥饿。\"\n\n\"支持这项法案有客观的理由。正如普柳希先生向您所介绍的那样，经济利益是明显的。社会和文化效益是可以计算的重要因素。我喜欢把自己看作一个理性的人。或许我甚至已经证明了这一点。但是，各位代表，当我决定协助起草这项法案时，我的思考并不是统计数据和抽象利益。我所思考的是列宁格勒围城战，我看到蹒跚学步的孩子脸上刻骨铭心的痛苦，以及我将如何做任何事情来阻止这种情况再次发生。我的人民绝不能受苦。绝对不行！”"
 DSPR.4.a:0 "文明的前提是填饱肚子。"
 DSPR.5.t:0 "递盐"
 DSPR.5.desc:0 "勒夫·莫罗佐夫像个外科医生在给自己的母亲做手术一样处理着自己的牛排。他的锯齿刀顺利地切过涂有大蒜黄油的肥肉，将一小块无比薄的肉片从骨头上切下。他拿起那一块，像珠宝匠检查新切割的钻石一样欣赏着优雅的纹理，然后放入口中。勒夫微笑着吞咽下去。“我喜欢这家餐厅。为什么我们不经常来呢，列昂尼德·伊万诺维奇？\"\n\n普柳希连龙虾都没有动。\"生活中有比无谓的奢侈更重要的事情。\"\n\n\"奢侈？我的朋友，食物不是奢侈品。它是必需品。为什么不热爱你的必需品呢？\"勒夫再次咬了一口牛排。\"我很高兴你来了。虽然我怀疑你不是为了享受我的陪伴而来的。\"\n\n\"不，恐怕不是这样。\"普柳希双手交叉放在桌上。“勒夫，民主社会党没有足够的选票单独通过这项法案。我们需要其他政党的支持。\"\n\n\"你想要农工党的支持吗？在你击败舒克申之后？我认为我们中很少有人对你有兴趣听你说什么。\"\n\n\"但是你应该对我们感兴趣。光是出于我们的友谊。\"\n\n勒夫停下了切割牛排的动作。煮熟的血液和脂肪混合物在刀刃上聚集，滴落在瓷盘上。\"好吧。但只因为你陪我共进晚餐。\"\n\n\"通过这项法案对你最有利，\"普柳希说道。“你是个理性的人，勒夫。这就是你当初决定支持舒克申的原因。听着——这项由康托罗维奇提出的法案？它是给独立食品杂货店和小农户提供的巨额补贴。看看我们添加的一些税收激励措施。如果你加入我们这一边，你在巴什科尔托斯坦的选民将会比以往任何时候都更加富裕、快乐和满足。我们提出了我们的一个政策主张，你看起来像一个愿意妥协的理性人——每个人都是赢家。\"\n\n勒夫又咬了一口牛排。\"听起来太好了，难以置信。”他用餐巾纸擦拭嘴唇。“我想给巴什科尔托斯坦和鞑靼斯坦的农民额外减税。只要满足这个条件，你就会得到我的选票。\""
 DSPR.5.a:0 "“成交。”"
 DSPR.6.t:0 "我们劳动果实"
 DSPR.6.desc:0 "克里斯蒂娜感到寒冷和疲倦。她徘徊在坎斯克的街头，痛苦、肮脏和油腻。她迷失了方向，没有家，没有目标。常常她想死去。但最糟糕的是她肚子里的咀嚼感。\n\n如果你没有经历过饥饿，很难形容它。它不是持续存在的，而是间歇性的，而且每个人都受到不同的影响。首先，你失去了情绪的控制。你在难以置信的悲伤和无理的愤怒之间摇摆，毫无理由可言。然后，你的胃像一团缠结的结，咕咕地发出声响，为了寻找食物而不断撕裂自己。你感觉就像一把刀在你的肠子里扭动。然后是一种精疲力竭——身体上的、心理上的、精神上的疲惫，一种深入骨髓的疲惫，你感觉仿佛可能会在原地昏倒。你的大脑麻木了，你的高级思维被扼杀。但最糟糕的是，这并非持续存在。它像潮水一样波浪般涌来，淹没你，让你的肺部充满。然后它退去，你有时间思考自己的缓慢死亡，然后症状再次出现。\n\n克里斯蒂娜深深地了解这一切。自从被赶出家门以来，饥饿就成为她生活的一部分。被遗弃后，她在垃圾中搜寻食物，做些零工，或者乞求生存所需。虽然她并不想这样做，但没有家可以洗澡或领取工资，她就找不到工作，也找不到住处。她不确定为什么要继续过着生活的样子。也许是她的脑袋里的本能反射，迫使她保持身体这个令人厌恶的装置活着，作为某种不幸的进化阴谋的一部分。无论原因如何，她还活着。但她真的很孤单。没有人——甚至包括那些创造了她的人——在乎她是否活下来。\n\n所以当一个政府工作人员在街上拦住她的时候，她感到非常惊讶。“对不起，夫人？”那个年轻人说。天哪，他只是个孩子——如果她没看错，才刚刚十七岁。“我们正在城里发放食品券。您可以在任何一家杂货店兑换它们。这些应该足够您维持一个月左右——”\n\n她猛地从工作人员手中抢过那一捆食品券。“是吗？可是你们有什么企图？”"
 DSPR.6.a:0 "“没有什么企图。下个月我会带着更多的食品券回来。”"
 DSPR.7.t:0 "见附件中的证据H"
 DSPR.7.desc:0 "尊敬的康托罗维奇先生，\n\n您并不认识我，我也不是您的朋友。然而，我们有一个共同的敌人：那些剥削和奴役俄罗斯人民的人。敌人有三个头，正如您所知。它还采用了各种各样的战术，您会发现这些战术非常有趣。下面，我附上了几张照片、发票和通信记录。请首先查看附件A——这是迄今为止收集的证据摘要。无论如何，您会发现它非常引人入胜。\n\n附件A：总体时间线\n\n1）西比尔谷物和农业供应公司首席执行官基拉·阿尔谢涅夫受董事会之命，在瓦西里·舒克申出人意料的击败亚历山大·波克雷什金赢得选举后对政治对手采取行动。一个月过去了。\n\n2）阿尔谢涅夫夫人开始与该地区的已知刺客进行接触，这些刺客可以处理高风险、高价值的目标。她成功地与一名名声卓著的车臣刺客马胡木·巴拉特达成交易。交易在月底达成。\n\n3）巴拉特先生等到选举后的车队行进时机，距离选举结束后两个月。\n\n4）上午9:41 - 舒克申先生的车队开始晚了11分钟。它平稳通过，没有发生任何事件。\n\n5）上午9:55 - 巴拉特先生进入一座废弃建筑的顶层，距离车队行进的地点一英里，尽可能晚一些，以避免被发现。（见证据F）\n\n6）上午10:00 - 当舒克申先生走向人群挥手时，巴拉特先生开枪射击，但由于远距离的突然风加速，子弹偏离了目标，击中了他的手臂。他向保镖和汽车开火。总共开了四枪。\n\n7）上午10:01 - 巴拉特先生拆卸武器并逃离现场。（见证据G）\n\n8）上午10:15 - 巴拉特先生向阿尔谢涅夫夫人报告行动失败的情况。\n\n考虑到您对剥夺这些人的权力有兴趣，我相信我们有共同的利益。如果这些事情曝光出去，对阿尔谢涅夫夫人和西比尔都将是奇耻大辱。"
 DSPR.7.a:0 "署名：您敌人的敌人，亚历山大·波克雷什金。"
 DSPR.8.t:0 "行动、反应、后果"
 DSPR.8.desc:0 "早上七点。太阳刚升起，扬醒来时，他的圣彼得堡公寓显得狭小破旧，他打开电视观看早间新闻，并给自己做了早餐。当他的新烤面包机开始工作时，电视突然传来爆炸性新闻。\n\n\"刚刚传来消息，\"新闻播音员说道，\"我们获悉西比尔第三大子公司的首席执行官基拉·阿尔谢涅夫夫人现在被通缉，悬赏金额为25万卢布。此前的报道称，几年前，前总统舒克申在与亚历山大·波克雷什金的选举中意外获胜后，有一起暗杀阴谋被揭发。现在我们连线新西伯利亚市警察局长现场直播。\n\n画面切换到市中心一座官方建筑。一个庄重肃穆的大个子站在麦克风和闪光灯前，就像一个面对行刑队的囚犯。扬看着面包开始烧焦，他的目光停留在电视上。\"我们可以宣布，我们已经将大部分董事会成员作为前总统舒克申暗杀未遂案的嫌疑人羁押起来。目前我们无法对其他事情发表评论。\"屏幕底部的滚动字幕显示今日股市的报告。西比尔股价下跌了20%，其子公司更是跌幅更大。市场本身濒临崩盘。\n\n\"新西伯利亚市警察做得很迅速，\"新闻播音员说道，\"而且据新任检察长表示，新任总检察长宣称，不会允许保释，因为存在显著的逃跑风险。刚刚传来消息——康托罗维奇总统正在召开新闻发布会，就此事发表讲话。我们切过去看看。\"\n\n\"先生！\"一个记者在激烈的新闻发布会上喊道。在闪烁的灯光和围绕讲台的记者群中，几乎看不清康托罗维奇的身影。\"总统先生！您对您的首席检察官的激进策略有何评论？\"\n\n康托罗维奇看着镜头，紧紧抓住他的讲台。"
 DSPR.8.a:0 "“我们将在法律的最大程度内起诉这一罪行的肇事者。”"
 DSPR.9.t:0 "普柳希-康托罗维奇计划"
 DSPR.9.desc:0 "黑色文件-不得公开发布\n\n普柳希-坎托罗维奇计划，又被称为工资收入基金，是我们通过和平手段将工人阶级置于经济控制之下的计划。简而言之，这是我们在俄罗斯实现生产工具社会化的计划。\n\n基本思想很简单：在适当的政治条件下，我们将通过一项法案对大公司的收入征税，并将其转入工资收入基金。该基金将从该公司购买股份，并将其转交给独立工会的所有权。数十年后，工会将拥有足够的股份来拥有该公司，并自主管理。这是真正实现经济指挥高地社会化，由工人运营的计划。\n\n鉴于西比尔最近的混乱局势，我们将与新成立的工会进行一次试购。工会目前还不具备独立管理这些资金的能力，政治氛围也未准备好完全采取这种社会主义政策。我们预计通过某些自由债务使用，我们将能够代表西比尔工业联合会（SIUF）购买约20％的公开股份。在这个混乱的集团中，SIUF的领导地位使其成为董事会的有影响力成员，并能够在现在更为分散的股权分配下左右投票。\n\n我们相信，如果SIUF能够增长并确保其谈判单位，同时广泛经济中的工会密度和其他工人组织也能够增加，政治局势将开始向我们有利的方向转变。\n\n我们设定的基准是，工会组织的一般工业工会密度达到40％时，才能进行法律游说。当工会密度达到60％时，我们相信法律将能够通过，前提是工会能够有效动员。目前，整个西比尔集团的全面工会化使工会密度从7％增加到28％，增长了21％。未来可能会发生扩张，如果情况出现，可能会涉及到泰坦或凤凰。"
 DSPR.9.a:0 "要砍倒一棵树，首先要用力一击。"
 DSPR.10.t:0 "炸弹……"
 DSPR.10.desc:0 "“你知道炮火对房屋的毁坏力吗？炸弹会造成什么样的破坏？想象一下你的家，你曾在那里与父母一起玩耍，与所爱之人共度美好时光，进食过饭菜，然后...消失了。彻底被摧毁了。你听到一声呼啸，然后一切都不见了，连同你的妈妈、爸爸。在座的有多少人曾经有过这样的经历？失去了所爱之人？”\n\n杜马内，众人沉默了下来，因为每个人都经历过失去。俄罗斯的混乱导致了无数的破坏，以至于在这个房间里的每个人在连续三十年的战争和恐怖中都面临过可怕的事情。\n\n“在科米乡下，共和国倒台后，我看到一个小女孩在街上走着，她的小鞋子沾满了泥巴，腿上沾满了泥浆。当我走近她的时候，你知道她告诉我什么吗？她告诉我她没有地方可去，她必须去上学，老师们也许会给她一些饼干。她要走五英里，穿过泥泞和未爆炸物，前一周那里就有一个孩子被炸死了。她迷失在世界中，蹒跚前行。当她抬起细细的手臂时，我看到了一个弹坑，曾经有一个孩子在那里。你能想象你的女儿或儿子十岁的时候，为了一些饼干而像那样辛苦地走到可能不存在的学校吗？”\n\n“俄罗斯的善良士兵希望帮助自己的同胞，让他们不再孤单地承受如此可怕的损失。让他们帮助修建道路和房屋，安抚那些需要住所和食物的孩子们。让他们再次建造避难所和粮仓！”\n\n康托罗维奇的话语如潮水般涌出，即使是干燥的经济论点也变成了自己的言辞战争，或者说是一场关于锤子和犁头的战争。他举起双手，戏剧性地竖起一根手指开始他的下一个观点。\n\n\"第一点！我们的政府计算了将士兵用于基础设施建设在短期和长期内将带来的经济和社会效益，结果极其积极。第二点！我们的军事领导报告称，我们可以在不大幅削减战斗力的情况下维持这一举措——我们并非和平主义者。第三点！作为一个社会，我们不能容忍无尽的贫困。如果我们要迈向新时代，我们必须建设一个新的俄罗斯，而不是一个新的军队！\""
 DSPR.10.a:0 "他们需要锻剑为犁，铸枪为镰……"
 DSPR.11.t:0 "锻剑为犁"
 DSPR.11.desc:0 "早上七点。太阳刚刚升起，一个男人在他狭窄破旧的彼得格勒公寓里醒来，打开电视收看早间新闻，然后为自己准备了早餐。主播像往常一样开心愉快，尽管他并没有太在意。他把一些鸡蛋打进锅里，然而，它们嘶嘶作响的声音掩盖不住电视中传来的一个清晰、响亮的声音，那是一个民主社会党代表的声音。\n\n\"...想想那些战后生活在困境中的人们。既然我们已经取得了胜利，他们还需要子弹做什么呢？我们已经确保了边境的安全，我们的地位是无可争议的。简单地说，这项法案将帮助西部数以百万计受战争影响的人们，相比之下，又有什么用处呢？更多的枪支？我相信那些仍然在废墟中露宿的人们会得到帮助吗？是时候让军队放下武器，拿起锤子了。\"\n\n主持人插话，他的声音一如既往地客气：“我明白了。根据我们听到的消息，看起来这项法案受到了农工党和全俄爱国党的强烈反对。前总统舒克申对该法案表示不满，称其为‘极端’和‘不必要’。您有何评论？\"\n\n\"他成为我们的前总统是有原因的。民主社会党以一项议程赢得了选举，我们将努力实现它，就像舒克申实现了他自己的目标一样。农工党和全俄爱国党可以随便抱怨，但没有人能够反对照顾我们自己的人，任何不同意这一点的人在我看来都不是真正的爱国者。\"\n\n这个男人把炒鸡蛋从锅里端出来，舀了一口，配着涂了黄油的面包吃了起来；他心里只有那位致力于改善他生活的坚定政治家的声音。他环顾着公寓，那些满是灰尘、渐渐脱落的石膏墙。"
 DSPR.11.a:0 "“这个地方需要修理一下。”"
 DSPR.12.t:0 "给和平一次机会！"
 DSPR.12.desc:0 "在莫斯科克里姆林宫的办公室里，有一间不起眼的会议室，里面摆放着一张长长的红木桌子。这是康托罗维奇和他的部长们计划、计算和理论推敲的地方。充满活力且受过良好教育的政治讨论声在房间里回荡，俄罗斯最聪明和社会观念最强的人们在这里为国家的未来制定路线。至少，这是最初的设想。但此刻，所有的目光都忧虑地看着电视。\n\n屏幕上显示着一群群普通的人群，他们身穿黑色连帽衫，挥舞着红旗，染着漂白头发，还有其他年轻人和激进主义者的明显特征。这并不新鲜，甚至在新闻中看到这样的画面都有些奇怪。然而，当他们读到屏幕下方的字幕时，立刻明白了为什么会播放这个内容：“左翼主义者、和平主义者支持《‘锻剑为犁’法案》”。负责该法案的康托罗维奇的部长，一个身材矮胖、智力敏锐且嗓音洪亮的人，紧张地咬着指甲盯着屏幕。\n\n“现在我们正在现场采访其中一位示威者，”一名记者站在一位男子面前的公园里，“你可以看到他手持一块写着‘给和平一个机会’的牌子。你能告诉我们你的意思是什么吗？”\n\n这位年轻的示威者是个身材瘦长、卷曲的长发男子，他微笑着回答：“嗯，我们支持世界和平主义。很简单。”\n\n“现在康托罗维奇总统表示，该法案不会显著减少军事开支，也不会削弱军队。你如何将这与你的和平主义价值观调和起来？”\n\n“这只是第一步！”那人大声喊道，几个身着共产主义和无政府主义标志的年轻人从旁边经过。“这是朝着解除国家武装和结束帝国主义战争迈出的第一步。先是这个小小的减少，然后就是其他一切！”\n\n“内容就是这样。下面交回给你，斯韦特兰娜。”\n\n康托罗维奇双手抱头。等式变得更加复杂。"
 DSPR.12.a:0 "光学，人民，光学！"
 DSPR.13.t:0 "反射性反应"
 DSPR.13.desc:0 "萨沙以前从未参加过抗议活动。当然，有叛乱和起义，还有战争要在硝烟弥漫中进行和获胜。和平抗议这种无害的事情从未真正出现在他的脑海中。直到最近他才开始真正关注政治。在舒克申的医保政策下，他再也不必为自己的残疾腿而工作了。好吧，他失去的那双腿。\n\n几个星期前，当有关削减军费的法案的议论开始传开时，他加入了莫斯科退伍军人协会。萨沙并不是一个疯狂的人。他一点也不喜欢战争，而且他比任何人都更清楚战争的代价。然而，他已经看到足够多，知道这整个和平主义事情已经走得太远。这就是他为什么在一个星期六的早晨滚过了大剧院桥。\n\n萨沙从未见过这么庞大的人群。他们在桥上行走、滚动或用拐杖慢慢走着。许多人高喊着莫斯科退伍军人协会组织者记下并分发的口号。他们从扩音器中喊道：“倾听我们的声音！保卫我们的家园！”等一些民族主义口号。人群的喧嚣让萨沙兴奋不已，他们回应着这些口号。\n\n当团队到达扎尔达列公园时，游行变成了一个集会，几个演讲者站出来反对《‘锻剑为犁’法案》。显然，之前有一场支持该法案的活动，人群中等等地涌了出来。新闻摄像组四处闲逛，他们的相机就像武器一样对准演讲者。\n\n一个全俄爱国党成员站在人群前面，对着麦克风大声喊道：“我们绝不会允许这些社会主义者毁掉我们的俄罗斯，剥夺我们的武装，将我们引入灭亡！他们说军队将会留下来，可西伯利亚修建一条公路花费的钱从何而来？他们保卫我们所需的武器！没有枪支的士兵有何用处？！这正说明这些不爱国的混蛋共产主义者策划了一个阴谋！”从讲台上传来的声音通过巨大的扩音器传播出去，威力强大地在人群中回响了一英里，完美地传达了他的恐惧。"
 DSPR.13.a:0 "人民不会这么容易被愚弄。"
 DSPR.14.t:0 "替代方式"
 DSPR.14.desc:0 "根据内部民意调查，这项法案的支持率大约为24%。在民主社会党会议室里，一位粗壮的部长下令道：“在这个时候，我们政府坚决不能追求这项法案，这是完全站不住脚的。”所有人的目光都转向康托罗维奇，他深思熟虑地捂住了嘴。\n\n\"是的，这项法案确实不受欢迎，\"康托罗维奇说道，“但那是因为宣传的缘故，而不是真相。受欢迎程度是多变的，来了又去。我们可以忽略它，或者转移人们的注意力。”他站起身来。“同志们，我不打算因为媒体狂热而放弃一项重大政策。电视台和广播电台都是由巨型企业拥有，而这些企业又是由资产阶级所有。他们的阶级利益与我们相对立。只要它们作为私营实体存在，它们就会抹黑我们和我们的目标。”\n\n康托罗维奇从外套口袋里取出一支香烟。“我们会减缓这项运动，但不会放弃。把教育经费法案推到聚光灯下。”他打开打火机，点燃了香烟。“我们已经看到企业过去是如何违反联邦法律的。指示检察总长调查凤凰公司。我们将彻底调查他们的银行账户、纳税申报、海关巡逻，全部调查个遍！一旦我们发现一个错误，一个多写的零，一个夸大的扣除，那么整个腐败行为将会被揭开。”\n\n一股烟雾从坎托罗维奇的嘴里升腾。“在公众分心的时候，我们和社会自由党商量商量，通过该法案。等到那些公司走狗和保守势力意识到我们已经做了什么时，这已经是旧闻了。”"
 DSPR.14.a:0 "需要采取一些更有力的措施来平衡这个等式。"
 DSPR.15.t:0 "结雅之犬"
 DSPR.15.desc:0 "在所有肮脏的工作中，偏偏给了我这个。查清楚那些狡猾的老胖猫在凤凰里搞什么鬼，找到他们和某些腐败案件之间的联系。所以他们派谁去呢？万尼亚？娜佳？不对，是派我：基里尔·达维多维奇·巴拉诺夫。我负责棘手的案子，肮脏的案子，以及那些悬而未决的案子。\n\n那是一个闷热潮湿的夜晚，我走上了结雅的街头。是这样的，被调到距离克拉斯诺亚尔斯克数百英里之遥，去追踪一条通往日本边境的线索。一道微弱的闪烁的灯光吸引了我，就像飞蛾扑火般，引向一座古老的办公楼，一个会计事务所：“结雅会计解决方案”。\n\n好吧，更准确地说，我有许可证来调查一些可疑数字，别为此纠缠不休。\n\n我走进去敲门的时候，眼角的余光里传来低声交谈的声音。我迅速藏身在一些灌木丛后面，发挥我的顶级调查员技能，用敏锐而训练有素的耳朵倾听他们的阴谋诡计。\n\n“老板，我告诉你，这些钱真不赖！那么，你什么时候让你的全俄爱国党来帮助我们？”一个滑头日本人开始说道。我能听出他是个日本人，因为他说话怪怪的。\n\n一股带着叶卡捷琳堡口音的坚定而浓郁的西伯利亚声音在风中传来。“我不知道，我怎么知道你不是在骗我？我想要的是你同意每晚按次数付款给我们。你付款，我们就工作，满洲国就有自己的火箭筒。成交吗？”幸运的是，我给这两个人拍了些照片。然后第二天，我装作一个税务审计员去，他们交给我了虚假档案，但他们忘了让我交出钥匙！\n\n现在，听着，第二天晚上，我等到他们都回家了，戴上手套，冲进去拿起文件。这地方没装摄像头，离得太远，如果我们能拿到录像带，风险也太大。滑雪面具，一些与警报器的擦肩而过，现在我就在这里！\n\n这就是这位大胆的英雄如何为您拿到这些真实文件的方式，就在此刻！那么老板，你感觉如何？”"
 DSPR.15.a:0 "他是个傲慢的白痴，但他完成了工作。"
 DSPR.16.t:0 "取缔垄断"
 DSPR.16.desc:0 "作为首席运营官，虽然不像首席执行官那样引人注目，但对于任何一家公司来说，这都是一个至关重要的职位。首席运营官，又被称为\"那个能把事情办成的混蛋\"。当凤凰董事会要求盈利时，他们告诉首席执行官，而当那个人提出一个计划时，约瑟夫就会把它变成现实。这就是他的工作。无论是把枪支送到满洲，还是付钱给新闻主播来考虑他们的言论倾向，甚至是清除一个不受欢迎的害虫，他只问应该跳多高。\n\n但是现在，就像下水道里的一只蟑螂，他躲在自己的浴室之一的一个秘密隔间里。这是一个没有光线的小房间，狭小而潮湿。楼上传来重重的脚步声，整个家里都回荡着灰尘。\n\n\"约瑟夫·阿达莫维奇！你因叛国罪、非法商业活动、阴谋以及其他二十四项罪行而被逮捕！在我们拆掉地板之前，快出来！\"\n\n那些白痴一遍又一遍地喊着。让他们来试试！谁在乎反托拉斯诉讼，或者一些红色暴徒试图逮捕他！他拥有资源和关系；凤凰建设了俄罗斯，该死的！在布哈林那场糟糕的政府之后，红色暴徒必须以更高明的方式接管，但如果他们成功了，结果将是一样的：人类精神的死亡！他们也将失败，就像每一次尝试共产主义一样。\n\n然而，随着时间的流逝，他的思绪变得更加暗淡。即使这些人走了，外面还有更多的人。脚步声持续不断地在整个房子里回荡。所有的报纸都说他被通缉了。没有逃脱的办法。\n\n他口渴、饥饿，迫切需要上厕所。陷入了痛苦之中，在他狭小的藏身之处拉屎，他们会发现他吗？他不可能在持续的监视下悄悄溜过去，从新西伯利亚到满洲，同时避免被察觉。于是，不情愿地，约瑟夫解开了通向他主卫生间水槽后宽敞区域的舱口。他迷迷糊糊地走出来，眼睛有些发花，正好踩在一条铁链上，发出回响，犹如爆炸声穿过空荡荡的房子。片刻后，脚步声急速靠近，约瑟夫的脸迎向了瓷砖地板。"
 DSPR.16.a:0 "“约瑟夫·阿达莫维奇，你被捕了！你有权保持沉默，你有权请律师……”"
 DSPR.17.t:0 "蜜罐"
 DSPR.17.desc:0 "没有什么比床上有个漂亮女孩的感觉更棒了。抱歉，亲爱的，爸爸因为工作太忙今晚不能回家，为了真正的爱国者而努力。这话有点实话。那晚他确实加班了一会儿，尤其是最后一个小时，如果你明白我的意思。\n\n哦，他的卡蒂亚，解救了他从与他那个腐烂的胖妻子和爱唠叨的孩子度日的无聊生活。她比他以前的女人都要年轻，二十多岁，有着弹性...的头发和曼妙的身材。她的表现如何，哦，天哪。像一个演员。像他梦寐以求的一切。为了和她在一起，他所要做的就是保持他那迷人的个性并买些礼物给她——昂贵的礼物，但在仔细核算一下后他完全负担得起。当你的情妇要求手表、电视、日本制造的新电脑和戒指时，你就得这样做。天啊，这个女孩要的珠宝，简直把他的银行账户给毁了！\n\n她柔软的声音挠痒了他的耳朵。“哦，伊凡，你今晚真的很辛苦，对吧？要不要在睡觉前聊一会儿？”伊凡伸出手臂更方便地扶着她的腰。\n\n“当然，我的公主。你想...”电话机在他的床头开始响起。真是倒霉。伊凡咽下一句咒骂，抓起听筒。“现在不是时候。”他咆哮道。\n\n他的副手在电话里尖叫。“长官，你需要走了！新闻台的一个人发现了资金的问题。我们需要采取应急措施！”\n\n“该死，甚至连一个晚上都不能好好享受...”伊凡从床上滚下来，开始穿回他的裤子。“找我们的宣传人。告诉他关闭新闻台，动用人情，尽一切办法。真是倒霉，就在我难得休息的一天...”\n\n沉重的敲门声打断了政客的抱怨。“伊凡·彼得罗维奇·莫罗佐夫！我知道你在里面！是在加班还是在和那个婊子上床？”哦天哪，外面是他的妻子。"
 DSPR.17.a:0 "他冲到门口，裤子拉链还没拉好。"
 DSPR.18.t:0 "陆军师"
 DSPR.18.desc:0 "\"加兰斯科夫先生！在西方的工会组织工作进展如何？\" 康托罗维奇总统坐在办公桌后，手里拿着一本诗集。太阳正在下山，透过他身后的窗户洒下琥珀色和桃红色的光线。\n\n社会革命党的尤里·加兰斯科夫——以前被称为民粹派左翼——站在总统的办公桌前，脸上带着忧郁的表情。 \"康托罗维奇总统，我想您知道我为什么来这里。\"\n\n\"又是一场荒谬的意识形态运动，我敢肯定。好吧，开口说吧。我可没那么多时间。\"\n\n尤里深吸一口气。“康托罗维奇总统，当民粹派决定开始我们的选举工作时，您告诉我您将尽一切努力支持左派的努力。自您上任以来，您所做的一切都是发表演讲，在电视上露面，起草法案。没有行政行动。没有改善工人阶级物质条件的措施。\"\n\n康托罗维奇把书放在桌子上。\"继续说。\"\n\n\"列昂尼德·维塔利耶维奇，我们是一个为工人阶级服务的组织。但是如果我们的同志们不了解阶级斗争的本质，我们就无法建设一个社会主义国家。我们的总统任期有限。最终，全俄爱国党或是农工党将再次掌权。也许他们会保留您的福利计划的一部分。但是它们会逐渐消磨殆尽，一寸寸地，直到我们的境况变得比以前更糟。我们必须利用我们所剩无几的时间，为工人阶级准备与压迫阶级进行斗争。我们必须为革命做好准备！\"\n\n\"而这正是我厌恶您的原因，\"康托罗维奇说着，挥动着手指。他从办公桌前站起身来。\"我的首要任务只有一个，那就是改善人民的生活。你觉得俄罗斯需要另一场革命吗？在我们度过了那个噩梦般的世纪之后？我们提出的政策将在根本层面上改变这个国家，而不会像你的计划那样带来流血和痛苦。\"\n\n总统透过窗户望出去。“我们不需要摧毁资产阶级，只需使他们平静下来。俄罗斯将成为无产阶级的国家，而且没有人会有任何想法。”"
 DSPR.18.a:0 "“我们的会面结束了，从我的办公室滚出去。”"
 DSPR.19.t:0 "目的"
 DSPR.19.desc:0 "“为这个我没打仗。” 叶夫根尼·瓦西里耶夫喝了一口啤酒，然后把杯子放回油腻的吧台上。 “一个再次由共产主义者统治的国家。我们有机会摆脱那些布尔什维克，然后我们又选他们？这一切的意义何在？” 他重重地拍了一下桌子。“必须有所行动。”\n\n叶夫根尼的朋友丹尼尔吸了一口气。“你说这种话的时候，你吓到我了。”\n\n“我应该怎么办？眼睁睁地让一帮胆小无能的野蛮人以'平等'的名义撕裂我的国家？我不能袖手旁观！”\n\n“叶夫根尼·德米特洛维奇，这就是民主的运作方式。有时你赢，有时你输。你需要妥协、争论，寻找前进的方法。难道你真的相信农工党会永远控制着俄罗斯吗？”\n\n“也许我不想要民主。”\n\n丹尼尔扬起了一只眉毛。“叶夫根尼，你在说什么？”\n\n“一个允许堕落和反俄思想传播的政府不值得我们去捍卫。” 叶夫根尼咽下剩下的啤酒。“这些懦夫不是俄罗斯人。他们是外来者，占领我们为解放而战的土地，并腐蚀我们的国家来服务于他们自己。这不是我为之奋斗的目标。我为了一个代表俄罗斯人、为俄罗斯人流血牺牲、除了服务俄罗斯人之外把一切都放在一边的俄罗斯而战。这些蠕虫在我们的国家没有立足之地。”\n\n他用袖子背擦了一下嘴，然后站起来。“如果他们不给我属于我的俄罗斯……”"
 DSPR.19.a:0 "“那我就将用武力来夺取。”"
 DSPR.20.t:0 "力量倍增"
 DSPR.20.desc:0 "列夫的经理是一个四十多岁长着痘疤的男人，他挑起一边眉毛说：“对不起？”。一张粉红色的解雇通知在他手中枯萎。“你也想要一个，婊子？”\n\n列夫挺直脊梁说：“伊凡的妻子怀孕了。我不管老板说什么，你不能解雇他。”\n\n伊凡急忙说：“列夫，请了，没事……”\n\n“没错，他说没事。”经理迈出一步，用手指戳着列夫的锁骨。“现在赶紧回到该死的生产线上，否则我会开除你。”\n\n“不，我不会！”列夫的声音在嘈杂的工厂中回荡。周围的工人放下手中的工具，注视着经理脸色变红。“你没有权利这样做。我们为你们破产，而你们却将我们当作泥土！你们看到我的手了吗？”列夫举起右手，第三和第四根手指缺失，多年前被扯掉。“我在这个工厂失去了它们，制造着没有人需要的垃圾。你们逼迫我们，逼迫我们，却从不指望我们反抗。但是当我们反抗时会发生什么呢？”\n\n列夫的同事们一瘸一拐地靠近，有些勇敢，有些畏缩。但只需要几个人采取行动，整条生产线的人都围了过来，注视着，等待着。他们有几十个人，强壮而年轻，对抗的只是几个肥胖的经理。然后，只剩下两个老板。\n\n“我——我会报警！”经理颤抖地叫道。\n\n“你觉得警察能及时赶到吗？”列夫问道，“你愿意赌一把吗？”\n\n群体挪动着，有几个人紧张地站稳脚跟。列夫的经理咽了口气。“我——我可以重新审查这个决定。”\n\n列夫微笑着说：“确保你这么做。我们这就回去工作。”"
 DSPR.20.a:0 "一群工人的力量很强大。"
 DSPR.21.t:0 "下一世代"
 DSPR.21.desc:0 "阿丽娜喜欢学校。在她上小学的时候，学校是一个陈旧的地方，摇摇晃晃的椅子上，她不得不在旧教科书和纸上学习艰深的数学公式。老师们很刻薄，很严厉，食堂里也没有食物。阿丽娜记得很多孩子饥肠辘辘地坐在那里，痛苦地度过他们的三十分钟，请求其他孩子分给他们一些食物。\n\n现在不一样了。现在，学校变得有趣了。当然，也许没有玩球或者约会那么有趣，但学校变得令人愉快了。老师们似乎友善得多，教室也干净整洁。椅子不再是由易碎木材制成，而是由光滑的金属制成，座椅上还有小凹槽可以放铅笔。阿丽娜的第一堂课是俄罗斯历史课。虽然她不像数学那样喜欢它，但只要你读过书，它并不太难。\n\n坐在她课桌旁的是彼得洛夫小姐。彼得洛夫小姐总是手里拿着一杯咖啡。当你有问题时，她是很亲切的，但就像现在这样，当人们不回答她的问题时，她会变得恼火。\n\n\"同学们，如果我们要一起学习，我需要你们的配合。我希望每个人都能集中注意力，这样回答问题的人可以给大家普及知识。在座的谁知道布哈林的共产主义政府在经济方面存在哪些问题？\"她第三次提问。那些聪明的孩子们，因为彼得洛夫小姐希望其他人参与进来，所以她没有点到他们，他们翻了个白眼。\n\n最后，阿丽娜紧张地举起了手，立刻被点名回答。她结结巴巴地说道：\"嗯，嗯，经济应该属于工人，对吧？但政府却拥有一切。没有工会，真正的工会，官僚们告诉每个人要生产什么？\"\n\n彼得洛夫小姐对她微笑着说：“这是个很好的答案，我们记下来，‘工人们不能控制工作场所’。比如说，我是教师工会的一员。我们开会讨论我们的工资和福利，如果州政府对我们不好，我们可能会罢工，或者不工作，以确保我们有必要的工具和时间来教导大家。但是在布哈林的时代，如果没有得到允许就这样做，我们会有大麻烦。还有其他人有什么想法吗？”"
 DSPR.21.a:0 "孩子们正在学习。"
 DSPR.22.t:0 "二十八支蜡烛"
 DSPR.22.desc:0 "烘焙很难。这就是为什么加尔桑并不感到意外，真的，当他用最后两个小时制作的蛋糕从烤箱中取出时，成了一块黑炭。错误非常低级——他在关上烤箱门时不小心碰到了燃气灶的旋钮，使温度提高了约七十度。蛋糕烤得过头，上面硬，下面焦。毁了。\n\n加尔桑把头埋在双手之间。“现在妈的该怎么办？”他喃喃自语。然后，灵感一闪而过。\n\n他赶到杂货店时已经没有多少时间了。加尔桑冲进店里，推开一对聊天的老太太。他跑过收银台，跑过肉铺柜台，直到来到店后面的糕点部。“我要一个蛋糕！”他用手砰地拍在柜台上，喘着气说。“我要一个蛋糕，请您帮帮忙！”\n\n掌柜的年轻女子挑了挑眉。“对不起，您之前是否已经预定了一件商品？有一个清单——”\n\n“没有，我现在就需要一个。”加尔桑指着柜台上的一个新鲜香草蛋糕。“那个怎么样？”\n\n“那个蛋糕已经卖掉了，先生。”\n\n“该死。”他从后袋里掏出一叠湿漉漉的钞票。“听着，今天是我妻子的生日。我可以给你五十……”他的声音渐渐低下来，看着她面无表情。“七十？”她摇了摇头。“一百五十。拜托了，这非常重要——”\n\n她从他手中抢过钞票，塞进了口袋里。"
 DSPR.22.a:0 "“走吧，在我改变主意之前。”"
 DSPR.23.t:0 "慷慨的果实"
 DSPR.23.desc:0 "乌云逐渐加重，随之而来的是雨水。但这并不足以阻止康托罗维奇继续进行他每天的晨间散步。事实上，雨水的有规律的节奏只会在如此困扰和压力重重的时期使心灵安定下来。\n\n许多事情困扰着他的思绪，每一件事情都有其不同的重要性。他是否能真正实现自己的目标？他是否能够推翻企业的权力？他是否终将为那些长期以来缺乏任何繁荣的人民带来繁荣？\n\n康托罗维奇陷入沉思，转过了另一个街角，却被两位同胞认出。他们急忙走过来向他打招呼，脸上露出自胜日以来最灿烂的笑容。\n\n“康托罗维奇总统！我还没有亲自见过您，但我必须感谢您最近在医疗保健方面所做的努力，一旦您的法案通过，我和我的妻子终于可以去看医生了，谢谢您！”\n\n康托罗维奇看着他们两个，微笑着说道：“感谢你们的感激之情，朋友，但我们还有很多工作要做。我希望不会让你们失望。”\n\n“嗯，能握一下您的手并亲自见到您，总统先生，真是太好了。再次感谢您。对于一切。”\n\n这对夫妻走过他身边，将康托罗维奇再次留在了寂静与沉思中。\n\n此刻，怀疑的思绪被雄心勃勃的想法所取代。他想知道自己将会帮助多少人，以及已经受到帮助的许多其他人。前方的道路似乎不再那么遥远，他与许多人共同梦寐以求的梦想似乎变得更加可实现了一些。\n\n总统脸上露出了灿烂的笑容，他转身向克里姆林宫走去。对于敏锐的眼睛来说，似乎天空中的云朵已经稍稍散开了一些……"
 DSPR.23.a:0 "……通过它们，光线充满了天空。"
 DSPR.24.t:0 "一种新的变化"
 DSPR.24.desc:0 "众人聚集在杜马议会大厅，佐诺夫不禁开始冒汗。一旦他大声朗读这份法案提案，他清楚接下来会发生什么。对许多人来说，无论这是否是合乎逻辑的事情，总会有人反对。这就是政治的世界。\n\n佐诺夫的思绪被同伴的推搡打断，他站了起来，咳嗽了一声，为即将到来的嘲笑做准备。\n\n\"经过一番讨论，民主社会党注意到目前俄罗斯联邦各个军事部门的资金远远超过我们的民用部门，特别是教育领域。鉴于此，我们提议通过《重定向法案》，对我们目前的财政支出进行一系列可执行的改变，以极大地提升普通公民的生活质量，主要通过让我们的士兵修建基础设施改善全国各地的小学，同时保持预算与以前相同。\"\n\n片刻之间，民主社会党和社会自由党的成员们跳起来，提出反对意见。偶尔会听到一些“懦夫”或“和平主义者”的提及，但总是会有其他党派官员积极回应，指责那些被怀疑直接收受凤凰贿赂的少数杜马成员。\n\n最终，民主社会党和社会自由党的绝大多数成员支持了这项法案。杜马中的理性成员们明白，他们无法永远为庞大的军事力量提供资金，他们必须朝着将这笔钱用于新时代的小步前进。一支受过教育的劳动力比几颗炸弹更加可怕。佐诺夫只希望其他人也能意识到这一点。"
 DSPR.24.a:0 "一个人不能生活在恐惧中才会取得进步。"
 DSPR.25.t:0 "熟悉但又不同"
 DSPR.25.desc:0 "当佐诺夫用手掌支撑着脸庞时，他不禁感觉到底下的纸张似乎在嘲弄他。尽管他曾是战争期间联邦最有才华的宣传家之一，但他觉得自己的技能对这个任务来说根本无用。他从来没有想过自己在写作和设计儿童图书方面会遇到这么多困难。\n\n佐诺夫有一种能力，用几句话和一些巧妙的形象勾勒出一个人内心最深处的情感，他的旧宣传作品点燃了同胞们的爱国精神。但是，一本儿童图书既要教育，又要把现实的本质掩饰起来，这对佐诺夫来说是个巨大的挑战，他一直在努力适应。\n\n他叹了口气，记起这本书本来是要教授有关俄罗斯荒野动物的知识的。虽然他没有计划什么，但佐诺夫放弃了，只是拿起笔，希望思绪会随着他的写作而流淌。而且，如果需要的话，明天他还可以继续。\n\n佐诺夫的笔一页页地畅行。他没想到自己能够如此迅速地取得进展，但事实证明，他勾勒情感的能力正好是传达出版商期望的信息的完美催化剂。一个小时内，他基本上完成了整本书，内心充满了骄傲和惊讶。\n\n他微笑着，花了一会儿时间欣赏他努力的成果。这并不完美——他确信专门为儿童写作的作家会做得更好——但这不重要。他完成了自己的任务，孩子们将会学到关于动物和对美丽祖国的自豪。也许他的未来不会被创作军事材料所定义，而是剑可以转变成为后代创作的画笔。"
 DSPR.25.a:0 "从过去的冲突中萌生出未来的种子。"
 DSPR.26.t:0 "一个聪明的头脑不受束缚"
 DSPR.26.desc:0 "卢多米尔刚刚完成了高中学业，一直想要进入声名显赫的新西伯利亚物理技术学院。这是一条漫长而艰难的道路，历经多年的努力，他提交了一份非常出色的大学申请——他的成绩很高，课外活动也非常丰富。当他坐在床上稍作休息时，听到有人敲门。好奇地，他透过猫眼往外看，看到一个年长、穿着昂贵西装的绅士。他唯一能认出来的就是大学的校徽。他停顿了一下。来自大学的人！\n\n他匆忙回到房间，迅速穿上最好的衣服，整理房子，然后又跳着回到门口，几乎在打开门的时候摔了出去，把老人吓了一跳，卢多米尔连连道歉。“没关系，没关系。我猜你是卢多米尔·维塔列维奇吧？”老人轻声问道。“是的，先生，我就是。”\n\n卢多米尔一边整理领带，一边迅速回答道。老人开始讲话，向卢多米尔介绍学院及其历史。尽管卢多米尔尽力保持专注，但他开始走神，略显心不在焉。\n\n“年轻人，你被学院录取了，还获得了全额奖学金。”卢多米尔像石化一样站在那里，被惊醒了，不确定自己听到的是否正确。然后，他拿到了奖学金！纸张和墨水占据了卢多米尔的思绪。这就是他一直为之努力的目标，为了这张纸，他度过了无数个不眠之夜。他不断地向老人道谢和道歉，然后祝他度过愉快的一天，并关上了门。\n\n卢多米尔无法抑制自己的兴奋，在房间里大声喊叫，跳来跳去。他做到了！这些日子和月份的努力终于得到了回报。从在昏暗的灯光下熬夜学习到在清晨艰难地保持清醒，他真的做到了！他坐下来，不敢相信自己的兴奋减弱成了自豪的微笑。这所大学摆脱了泰坦的影响，享有盛誉。除了学业，他什么都不用操心。黎明变成了早晨，卢多米尔准备步行去他的大学物理与技术研究所。"
 DSPR.26.a:0 "向上和向前，在追求知识的过程中。"
 DSPR.27.t:0 "不良引文"
 DSPR.27.desc:0 "大多数人早上喝着咖啡读新闻，但科拉布林一家则选择在晚上工作了一整天后看新闻。他所在的工会曾经谈判成功，将工作时间缩短至每天仅八小时，但他仍然固守着自己的旧习惯。他美丽的妻子给他们做了一份热腾腾的红菜头汤和帕姆普什卡，他不喜欢在工作一整天后吃冷食物。给妻子叶卡捷琳娜亲了一下脸颊后，他打开了晚间电视，调到了他喜欢的第一频道主持人的节目。\n\n“是的，斯韦特拉娜，现在我们请到了莫斯科现场的弗拉德！根据副总统普柳希的说法，杜马对泰坦公司的调查发现了关于抄袭的报告。他们声称泰坦在接受了大量政府津贴和资助的同时，抄袭了新西伯利亚研究院的新型雷达技术。如果这是真的，那意味着这笔钱基本上白白浪费了，总数高达数亿美元。让我们听一下副总统普柳希本人的讲话。”\n\n屏幕上显示出杜马那朴实无华的米色，而站在那里的副总统目视前方。叶卡捷琳娜喃喃自语道：“天啊，科拉布林，他们当我们是傻子吗……”科拉布林放下勺子，专注地看着电视。\n\n“作为一名数学家，我对这种不诚实感到厌恶。我们为这些公司支付费用，以便他们为我们的国家开展研究，结果他们竟然从我们自己的公立大学偷了东西。这种情况不能再继续下去了！”杜马很快陷入了混乱，爱国者党员争论不休，而社会党则回击不已。屏幕再次转到那位新闻记者弗拉德米尔的身上。\n\n“泰坦公司的发言人声称这只是个案，而民主社会党则以此为借口，企图推动国有化经济的政策。回到你那里，斯韦特拉娜。”屏幕再次转回整洁的新闻室。“谢谢，弗拉基米尔，我们绝对会密切关注更多信息，真是个丑闻……”记者转到其他话题时，夫妻和他们的孩子互相对视。\n\n突然，电话响了。科拉布林拿起电话听到了他的工会主席彼得·约瑟福维奇的声音。\n\n“科拉布林，工厂外举行一天的罢工。”科拉布林坚定地点了点头。他们不会坐视不理。"
 DSPR.27.a:0 "普通人不可能永远被欺骗。"
 DSPR.28.t:0 "交易的艺术"
 DSPR.28.desc:0 "维托米尔匆忙整理好他的服装，走出办公室来到会议室，那里有些访客。会议室里坐着两个温和的年轻政府官员，手里拿着一份文件。另一边坐着他的同事们，他们凌乱不堪，试图理清过去几个月发生的事情。维托米尔坐下，与这两个年轻人客套寒暄了几句。\"那么这是什么意思？发生了什么事？\" 维托米尔平静地问道。\n\n两位官员中较年长的人将一个文件夹放在桌子上。\"我们要收购你们。泰坦公司无法继续下去了，俄罗斯联邦的军方和政府机构愿意买下你们所有的实验室和员工，包括你们作为研究人员和团队负责人的身份。不需要改变什么，只是职位和薪水会稍微降低，但你们不会陷入贫困。政府需要你们的实验室，维托米尔先生。\"\n\n这是个慷慨的交易，维托米尔明白。但维托米尔并不傻，他知道在他的同事中，包括他自己在内，有很多人都有不可告人的秘密。如果有一则传闻传出去，他的新工作就会消失，他的声誉也会受损。高管们要求休息片刻，十五分钟后回来提出一个条件：特赦。是的，他们需要来自潜在调查的特赦，也需要摆脱竞业限制。\n\n维托米尔焦虑与自信交织，大胆地说道：\"我们要特赦。我们愿意加入你们军方的研究计划，但我们不想坐牢。明白了吗？\" 这对官员用一种维托米尔自年轻时以来都没有过的自信进行了一个快速的交流后达成了一致。维托米尔露出了笑容，对这个民主社会主义政府出人意料的温和感到宽慰：\"那么，我迫不及待地期待为我们美妙的联邦工作。我们会在星期一早上去实验室。\""
 DSPR.28.a:0 "互惠互利的安排。"
 DSPR.29.t:0 "效率的成本"
 DSPR.29.desc:0 "康托罗维奇走进工厂，两名保镖紧随其后。这是一个可怕的景象。工人们正在休息。乍一看，大多数人似乎没什么问题，但仔细观察后，可以清楚地看到有些人缺少手指、手和甚至眼睛。一些人有着污秽绷带包扎的新伤口，而其他人则有着疤痕残断的残肢和长时间失踪的指节。\n\n康托罗维奇走到前方的工人跟前，他的助手告诉他这个工人叫瓦西里。他的手臂上裹着一块明显需要更换的绷带。“为什么这些伤口没有得到处理，瓦西里？它们远非轻伤。”\n\n“康托罗维奇先生，我们中的许多人担心寻求治疗会导致失业，因为我们将无法工作数天，甚至数周，如果需要手术的话。即使有了医疗改革，我们在请假时也没有薪水。我们不介意在不工作的日子里没有薪水，但我们不想因为去看医生而冒失业的风险。”\n\n“这必须改变，瓦西里。我会调查此事。你将能够看医生，我将尽我所能确保如此。”\n\n康托罗维奇在返回办公室的路上思考着。解决方案很简单——实施法律保护工人免受任意解雇的权益，并增加对更健全的医疗系统的资金支持，使其更全面、更负担得起，同时不会对其质量有重大妥协。\n\n主要问题在于资金。当然，联邦的金库目前相当丰富，但这并不仅仅是一项刺激计划。它将需要大量的政治讨价还价和持续的资金流以维持和改进俄罗斯的医疗基础设施，并执行任何禁止任意解雇的法律。\n\n他可以与关键代表和自己的派系达成协议，肯定能够通过所需的立法。但同样的问题仍然没有解决——谁或什么将为这笔巨额支出提供资金？\n\n也许他可以提高企业税？现在已经相当高了，尽管康托罗维奇并不特别为这些公司感到难过，但如果税率过高，这些公司只会选择搬迁。不过，通过一些关于资本外逃的整套法律......"
 DSPR.29.a:0 "一步一步来。"
 DSPR.30.t:0 "塔西佗如是说"
 DSPR.30.desc:0 "锈迹斑斑的电梯嘎吱作响，伊里奇下降到矿井的深处。他紧握着扶手，只有在手掌上发现了令人恶心的尘土后才松开，匆忙擦拭干净。最后一次剧烈的晃动表明电梯已经到达目的地，伊里奇走出电梯，来到一个弥漫着烟雾的发霉洞穴里。他咳嗽着，绝望地捂住嘴巴，清理肺部的烟雾，然后开始在矿井里徘徊。\n\n他很快找到了打卡机，开始检查时间卡。他看到的情景并不令人愉快，因为每张卡上的工作时间都更长，没有少于十二个小时。他带着厌恶把它们还回去，并在报告上做了标记。当他继续深入矿井时，汗水的气味和煤炭的味道变得越来越浓，几乎让伊里奇呕吐。最终，他来到了一个正在工作休息的区域。工人们看起来几乎死气沉沉，衣服也在接缝处破烂不堪。伊里奇咳嗽的声音引起了他们的注意，尽管还在上班的很多人几乎没有注意到他，他们继续敲击着洞穴的墙壁。\n\n\"哦，看看那个穿着花哨西装的公司人！来得更凶狠点吗？\"一个人嘲笑道，其他人也加入进来。\n\n伊里奇试图保持正式地回答道：\"同志们，请你们不必担心。知道我代表着你们的最大利益。我是作为康托罗维奇总统的代表来到你们的工作地点，我来这里是为了-\"\n\n另一名矿工嗤之以鼻：\"那不就是那些拥有这该死矿井的家伙们说的那套废话吗？我投了康托罗维奇的票，我们可一点好处都没看到，我们的工时怎么样了？我们的休息时间多了吗？我们能呼吸到干净的空气了吗？\"\n\n“没人想听你的借口！如果你想帮我们，为什么不拿起铲子呢？”矿井里传来越来越多的咆哮声。伊里奇放弃了请求，开始离开，更多的侮辱和嘲讽声跟随着他。一些人在他经过时吐痰或扔泥土，而其他人只是空洞地盯着他，然后回到了自己的工作。伊里奇在结束报告之前写下了总结性的评论，然后拍拍身上的灰尘，匆匆从深处返回。"
 DSPR.30.a:0 "行动——但法律不是魔法。"
 DSPR.31.t:0 "坚决反对"
 DSPR.31.desc:0 "康托罗维奇一边品尝咖啡，一边浏览面前的文件。经过几分钟的仔细观察每一个词，他站起身走进杜马。他在讲台上安排好了他的几份文件，然后开始演讲。在他的演讲过程中，他注视着几位参议员，他们似乎对每一个说出的字眼都越来越愤怒。\n\n“通过这个饥饿问题特别工作组，我们打算消除城乡之间的食物不平等。没有理由让一个社区在他们的‘上级’暴饮暴食的同时，另一个社区袖手旁观。我再次强调这个政府机构的重要性，不仅仅是为了养活我们的人民，而且因为这是一项良好的政策，我已经提到了通过减少营养不良而提高效率的所有增加。”当康托罗维奇结束演讲时，一位全俄爱国党成员站起身来，要求：“那么这个‘特别工作组’的资金从哪里来？”\n\n知情地，康托罗维奇凝视着这位官僚，回答道：“民主社会党计划从已经清算的公司资产中获得资金——”还没等康托罗维奇说完，同一个参议员打断他喊道：“为什么不从你们其他的社会主义小项目中削减资金？你们难道想要摧毁企业？”康托罗维奇感到有趣，问道：“你有什么理由要求我不使用这些已清算的资产？”在参议员发言之前，一位农工党成员插话道：“我认为他的意思是为什么不能从其他渠道筹集资金，比如众多现有的社会项目？”\n\n随着争论的延续，康托罗维奇对农工党和全俄爱国党成员不停地喋喋不休感到越来越愤怒。尽管他尽力插话，但通过这个基本法案，甚至是社会支出的这一小幅增加都是不可能的，因为有农工党和全俄爱国党。记者们会像豺狼一样抓住这个机会，但他别无选择。他们会依靠他们经过考验的策略：让社会自由党和左翼党派在法案上依次投票。"
 DSPR.31.a:0 "资产阶级民主意识的局限性"
 DSPR.32.t:0 "对粗心者的呼唤"
 DSPR.32.desc:0 "电视的声音断断续续，有节奏地被电磁干扰打断，叶夫根尼和安德烈不断换台，调到播放两人最喜爱的冰球队季后赛的频道。虽然俄罗斯直播小型但引人入胜的赛事还是最近才开始，这让他们对这些比赛更加期待。两个青少年继续切换频道时，他们听到了一直困扰着电视屏幕的单调政治谈话，但他们对其中的内容几乎没怎么在意。\n\n\"告诉你，西伯利亚猎鹰队会在季后赛中占据主导地位的，\"叶夫根尼吹嘘道，他们继续换台。\n\n安德烈嗤之以鼻地说：\"看他们最近的表现就知道，每场比赛他们只是以一两分的优势取胜。不，乌拉尔十字军队将在决赛中粉碎他们。\"\n\n他们的争论被一个共同的欢呼声打断，随着冰球场的嗡嗡声，他们找到了转播频道，然而转播很快被一个他们勉强认出的声音中断了。\n\n\"晚上好，各位。我是我们伟大联邦的总统列昂尼德·康托罗维奇。我为打断大家的观赛准备表示道歉，但当数百万人正准备观看我们国家最伟大的运动员比赛时，我觉得现在是时候对那些急切期待这场比赛的人们发表讲话了。\n\n\"当我演讲的时候，一代新的俄罗斯人正在为推动国家前进做准备。在不久的将来，你们将有责任引领我们的国家走向未来，而这一未来的成功离不开你们。我们的联邦并不完美，需要你们致力于修复其中的缺陷。凭借你们的坚持和意志，我坚信你们将是引领俄罗斯走向更高峰和未来荣耀的人。在那之前，再见，尽情享受比赛吧。\"\n\n屏幕很快又切回体育场的报道，但他们对此毫不关心，而是陷入了对总统的讲话的思考中。也许，他们决定重新打开长期忽视的频道，真正倾听其中的言辞。他们的爱国热情激发了对祖国的短暂祝酒，然后他们将注意力重新转向比赛。"
 DSPR.32.a:0 "变革的种子开始开花，尽管速度很慢。"
 DSPR.33.t:0 "新的一天"
 DSPR.33.desc:0 "列昂尼德·康托罗维奇缓慢地从椅子上站起来，推开窗帘，观察着议会外面逐渐聚集的民众。\n\n\"打倒共匪！打倒叛徒！\"\n\n\"我们什么也没见到，我们的工作在哪里？\"\n\n\"总统想要摧毁俄罗斯的军队！我们不会让他得逞！\"\n\n数百个横幅上印着各种类似的信息，在拥挤的街道上挥舞着，与俄罗斯民主社会党总部所在的错综复杂的房间和宿舍形成平行。一群全俄爱国者与一支薄弱的议会卫兵队形成冲突。随着时间的推移，他们最终会散去，但现在暴徒们牢牢地站在原地。不断喊叫，不断要求。\n\n格里戈连科将手放在康托罗维奇的肩膀上，坐在这位年迈数学家旁边，焦虑地注视着人群。\n\n\"他们还在外面，呀？从中午过去了几个小时了。我想知道他们的斗志还能持续多久。\"\n\n总统转过身，疲惫地看着他的部长。\n\n\"我不明白，彼得。为了俄罗斯，我做了什么让他们认为那些全俄爱国党的叛徒会比我更好？这不合理，他们的计算都错了。\"\n\n格里戈连科从他们之间的小桌子上拿起一杯，一口气将其喝下。\n\n\"我们太天真了，列昂尼德。试图太快地强行推进这一切。你知道普里马科夫和他的基地不会在一夜之间消失，即使有西比尔宣言和那些走私者的揭露。自从那些动荡的西伯利亚时期以来，猎鹰和他的企业走狗就已经将触角伸入我们的祖国。给它一些时间，总统先生。毕竟，这是我们能做的唯一事情。\"\n\n随着太阳在联邦的上空逐渐落下，首都上方的天空再次变得寂静，列昂尼德·康托罗维奇举起自己的酒杯。"
 DSPR.33.a:0 "只要有耐心，他们也会解出这个等式。"
 DSPR.34.t:0 "所有体制中最糟糕的"
 DSPR.34.desc:0 "舒克申的肘部感到疼痛，一块灰色的崎岖石头从他的手中滑出，越过盛开的树木，掉进噼啪作响的灌木丛中，发出沉闷的砰声。\n\n阿梅特汗微笑着，一拳击中他的肩膀。“你是瞄准在康托罗维奇还是松鼠的？”\n\n“两者都不是。”舒克申皱了皱眉。“他赢得了选举。他赢得了选票。他应该成为总统。”\n\n阿梅特汗挑了挑眉。“但是？”\n\n“但是他的提议很危险。你知道我不是社会主义者，我的朋友。康托罗维奇和他的政党是激进分子，他们想要撕毁这个联邦建立的一切。他们中有一半甚至没有放弃六十年代他们犯下的恐怖主义行为！”他举起一根手指，制止了阿梅特汗的回答。“我知道波克雷什金的回应是错误的。而且是非法的。但是两个错误并不能成为正确。我们不能回到苏联。”\n\n“如果人民就是想要那样呢？”\n\n舒克申皱着眉头，肘部的疼痛一阵阵袭来。年岁对他来说并不友善，尤其是在战争的恐惧和恐怖之中。“民主不是一场暴民运动。多数人决定，但必须尊重少数人的权利。这也意味着财产权。我们不能合法化偷窃。我们不能合法化暴行。”\n\n远处，一只鸟开始唱歌。两位朋友在森林小径上走着，停下脚步聆听。他们的保镖保持着恭敬的距离。\n\n阿梅特汗微笑着，鸟儿的合唱在空中盘旋。\"很抱歉你输掉了选举，瓦西里。我希望我能做些什么。\"\n\n\"没关系。已经结束了。\"舒克申闭上眼睛，沉思着。他回忆起多年前坐在鄂毕河边，仅仅是巴尔瑙市市长，看着垃圾和人类废物流淌在祖国的中心。他转向反对西罗维基体制的那一刻。\"还会有另一次选举的。我相信康托罗维奇会办到的。如果我们赢了，那很好。如果没有，\"他叹了口气，悲伤地微笑着，\"那我可以在这个美丽的国家里退休。为我为我的人民所做的一切感到自豪。\""
 DSPR.34.a:0 "“晚安，辛辛纳图斯。”"
 NOV_Anatoly_Marchenko_eco_desc:0 "§Y经济部长§!\n£NOV_DSPR_Icon §P俄罗斯民主社会党§!\n--------------\n安纳托利·蒂霍诺维奇·马尔琴科生于1938年1月23日，出生在新西伯利亚郊外的小镇巴拉宾斯克。他的父母是工人阶级，没有受过教育，生活贫困。马尔琴科提前两年离开学校，很快加入了共青团。他后来成为当地一家石油钻探公司的雇员。\n\n尽管作为一个前共产主义者，他对西罗维基持有蔑视态度，但他仍然保持沉默，直到转向成为反对者的斗士。马尔琴科因为波克雷什金打击民粹派而被监禁，但两年后他逃脱，并向公众详细描述了西罗维基监狱系统的状况。\n\n尽管马尔琴科始终忠于工人事业，但联邦的全面胜利改变了他的观点，因为他看到市场的一些方面取得了成功，但仍然清楚地意识到了其人性的失败。因此，他加入了俄罗斯民主社会党的民粹派右翼运动。不久，马尔琴科引起了康托罗维奇的注意，后者选择他来领导所有经济事务。现在，这位出身低微的农民之子准备捍卫人的权利。"