 NOV_federalassembly.100.t:0 "[?global.year]年总统选举"
 NOV_federalassembly.100.desc:0 "伊万·库拉托夫曾经伤痕累累。沃尔库塔劳改营的无数人也像他一样因长期苦劳，极劣条件，以及冰冷气候而患上一身疾病，无论是囚犯还是看守，只要他傻到在那里安家，那总免不了遭罪一番。直到今日，他还带着当年的伤痕，手掌僵硬。他一度以为这小小封地日复一日的生活永无终日。即使NKVD后来倒了台，他也还是被控在另一个对他福祉毫不关心的政府之下。但现在，时代变了。\n\n库拉托夫搬到了巴尔瑙尔市，他在那里第一次见到了舒克申总统，那时他的心怦怦直跳，他感受到了某些从未体验过的全新事物。是欢腾。是希望。是一种发自真心的理想主义锐气。是一种永远昂扬的梦想，可以感染无数人，他对未来真正感到了一种无拘无束的幸福。他傻笑着，脸上的阳光似乎更加明亮。\n\n现在战争结束了，改革也告一段落，他的生活也翻天覆地，他以为奇迹这就到头了。但他错了。那天早上，他醒来时听到了一个惊人的消息：大选。舒克申总统已经让权民主，且正在安排大选。现在，横幅、海报、口号、政治选战、辩论和他新买的电视上的新闻淹没了他的生活。他真的看到了俄罗斯的另一次奇迹，这一次远比伏尔加河或顿河上的，第二次西俄战争的那次更加伟大。\n\n在回家的路上，他被《新报》拦下做民意调查。他面带笑容，手里拿着生活用品，自信地说道："
 NOV_federalassembly.100.a:0 "我会投舒克申总统。"
 NOV_federalassembly.100.b:0 "叶夫根尼·普里马科夫会让俄罗斯更强大。"
 NOV_federalassembly.100.c:0 "列昂尼德·康托罗维奇在为人民谋福利。"
 NOV_federalassembly.100.d:0 "安纳托利·科里亚金将给俄罗斯带来繁荣。"
 NOV_federalassembly.100.a_tt:0 "§Y我们将作为£GFX_NOV_RAPP_Icon §B俄罗斯农工党§!进行竞选§!"
 NOV_federalassembly.100.b_tt:0 "§Y我们将作为£GFX_NOV_VRPP_Icon §g全俄罗斯爱国党§!进行竞选§!"
 NOV_federalassembly.100.c_tt:0 "§Y我们将作为£GFX_NOV_DSPR_Icon §P俄罗斯民主社会党§!进行竞选§!"
 NOV_federalassembly.100.d_tt:0 "§Y我们将作为£GFX_NOV_RSLP_Icon §M俄罗斯社会自由党§!进行竞选§!"
 NOV_federalassembly.101.t:0 "大选日"
 NOV_federalassembly.101.desc:0 "俄罗斯各地的人群聚集在无论哪里能找到收音机和电视的地方。有些人在自己家中专注地盯着屏幕。其他人则挤在公共休息室或酒吧里一台又旧又尘土飞扬的收音机旁。然而，他们的注意力都集中在一次广播上。俄罗斯各个新闻台都开始了直播，他们嘴里的话是：“俄罗斯联邦公民们，在这个时刻，即[?global.date.GetDateStringNoHourLong]，我们将宣布今年总统选举的获胜者。你们俄罗斯联邦的下一任总统是……”"
 NOV_federalassembly.101.a:0 "俄罗斯农工党的领袖，瓦西里·舒克申！"
 NOV_federalassembly.101.b:0 "全俄爱国党的领袖，叶夫根尼·普里马科夫！"
 NOV_federalassembly.101.c:0 "俄罗斯民主社会党的领袖，列昂尼德·康托罗维奇！"
 NOV_federalassembly.101.d:0 "俄罗斯社会自由党的领袖，安纳托利·科里亚金！"
 NOV_federalassembly.102.t:0 "组建政府"
 NOV_federalassembly.102.desc:0 "目前，我国政府在杜马的席位还不到一半。虽然我们可以组建一个少数党政府，但有些人呼吁我们邀请其他政党加入，这样我们就不会受困于人。我们是否应该照做？"
 NOV_federalassembly.102.a:0 "我们不需要外人帮忙。"
 NOV_federalassembly.102.a_tt:0 "§R我们将建立一个可能不稳的少数党政府！§!"
 NOV_federalassembly.102.b:0 "或许舒克申先生想要发言……？"
 NOV_federalassembly.102.b_tt:0 "我们将设法与保守派£GFX_NOV_RAPP_Icon §B农工党§!组建一个联合政府"
 NOV_federalassembly.102.c:0 "让西罗维基参与可能至关重要。"
 NOV_federalassembly.102.c_tt:0 "我们将尝试与法团派的£GFX_NOV_VRPP_Icon §g全俄爱国党§!组建联合政府"
 NOV_federalassembly.102.d:0 "安抚工人总能奏效。"
 NOV_federalassembly.102.d_tt:0 "我们将尝试与民主社会派的£GFX_NOV_DSPR_Icon §P民主社会党§!组建联合政府"
 NOV_federalassembly.102.e:0 "和平主义可能还有用。"
 NOV_federalassembly.102.e_tt:0 "我们将尝试与自由派的£GFX_NOV_RSLP_Icon §M社会自由党§!组建联合政府"
 NOV_federalassembly.102.f:0 "农民也应在杜马发言！"
 NOV_federalassembly.102.f_tt:0 "我们将尝试与温和派的£NOV_NFM_Icon §K国家农民运动§!组建联合政府"
 NOV_federalassembly.102.g:0 "或许我们应该让一些君主主义者回归……"
 NOV_federalassembly.102.g_tt:0 "我们将尝试与专制派的£NOV_RIRM_Icon §w帝国复兴运动§!组建联合政府"
 NOV_federalassembly.102.h:0 "让俄联共参与进来可能会阻止进一步的激进化。"
 NOV_federalassembly.102.h_tt:0 "我们将尝试与共产派的£NOV_CPRF_Icon §e俄罗斯联邦共产党§!组建联合政府"
 NOV_federalassembly.102.i:0 "只有当社会革命党参与体制建设时，他们才可控"
 NOV_federalassembly.102.i_tt:0 "我们将尝试与工团派的£NOV_SRP_Icon §x社会革命党§!组建联合政府"
 NOV_federalassembly.102.j:0 "我们得找其他出路！"
 NOV_federalassembly.102.j_tt:0 "我们将以政治上的权宜之计为代价寻找其他解决方案。这将使用新选项重新加载事件。"
 NOV_Election_Time_Bar_tt:0 "§Y距离得出选举结果还有剩下[?NOV_Election_Time_Left]天§!"
