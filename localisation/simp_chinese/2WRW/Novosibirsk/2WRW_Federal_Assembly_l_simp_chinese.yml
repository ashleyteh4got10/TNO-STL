 NOV_bill_representation_act: "§B代表选举法案§!"
 NOV_bill_representation_act_desc: "在中西伯利亚联邦建立之初，宪法明文规定联邦委员会席位由政府指派而非人民选举产生。此项法律主要由西罗维基及其对我们联邦的政治影响下而提出。\n\n经历了广泛游说与对舒克申总统的未遂谋杀，现在是时候让我们削弱西罗维基与其影响力了。我们要确保，一旦他们掌权，其对联邦委员会的控制不是绝对的。"
 NOV_bill_voting_rights_act:0 "§Q选举权法案§!"
 NOV_bill_voting_rights_act_desc:0 "尽管我们的联邦明面上是俄罗斯的民主灯塔，但国民的投票权并未被写入法律。虽曾是波克雷什金为安抚那些呼吁更多民主的群众而引入的权宜之计，但现在我们必须将其完全纳入我们基础管理制度。\n\n此法案采取了一定措施以减少选举中的外部影响，并且完善了收集与统计国民选票的程序。"
 NOV_bill_women_rights_act: "§B俄罗斯民法典修正案§!"
 NOV_bill_women_rights_act_desc: "既然我们已经确保我们民主的核心组成部分已到位，那可以将视线转向长久对我们国家造成的畸轻畸重。长期以来，俄罗斯妇女一直被剥夺了通过政治影响国家未来的权利，我们终于可以向她们敞开这扇大门了。\n\n我们离俄国梦越来越近，联邦旗下的平等不久就要变为现实……"
 NOV_bill_environmental_protection_act: "§B环境保护法案§!"
 NOV_bill_environmental_protection_act_desc: "我们祖国地大物博的疆域坐拥地球上最令人惊叹的景观，从西伯利亚的针叶林到广袤的大草原，野生动物在草原上自由漫步。但是，各大企业的腐败作风已经侵蚀了我们美丽的祖国。\n\n整片整片的森林被肆意砍伐成木材，规模庞大的矿井深入我们曾经风光秀丽的山脉，油井架把从前肥沃的平原变成了贫瘠的荒地。如果我们还希望保护自己的土地，我们必须在为时已晚之前抑制住西罗维基贪婪的触角。"
 NOV_bill_environmental_protection_act_repeal: "§g废除环境保护法案§!"
 NOV_bill_environmental_protection_act_repeal_desc: "我们祖国的子女正在破坏几百年来养育我们民族与人民的土地，尽管这非常令人遗憾，但目前的状态不容改变。前方障碍重重，我们不能因这种原因就放任西方和东方的敌手赶超我国！\n\n旧世界将在工业之火中熊熊燃烧，只有这样，俄罗斯才能富裕起来！"
 NOV_bill_corporation_limitation_act: "§B企业限制法案§!"
 NOV_bill_corporation_limitation_act_desc: "挥舞铁腕的企业国安人员即£GFX_NOV_VRPP_Icon §g西罗维基§!用贪婪且野心勃勃的强大力量为祸普通人民已久，但在我们实施旨在建立一个真正公平的社会的改革方案以来，他们的力量已大不如前。现在，我们终于要拿起一把无形大锤，砸向那些被削弱的巨企集团，迫使它们为舒克申总统的愿景做出总让步。\n\n最终，我们的梦想将扫清不公不义，我们的人民将体会到逝去已久的繁荣。"
 NOV_bill_workers_protection_act: "§B工人权益保障法案§!"
 NOV_bill_workers_protection_act_desc: "我们都清楚，劳动者在高危的工厂里拼死拼活，付出了巨大的代价，而企业领导却对工人在危险的工厂里为不足温饱的薪水所受的苦难熟视无睹。\n\n那些日子一去不复返了。\n\n在我们的管理下，工人们将得到公平的对待、合理的工资，并能够在安全的条件下工作。虽然我们不是§x社会主义者§!，但我们也同情工人的斗争，且会确保他们得到公平待遇。"
 NOV_bill_healthcare_act_dspr: "§P宪法第41条§!"
 NOV_bill_healthcare_act_dspr_desc: "我们是人民的联邦，不是企业的联邦。虽然我们的国家曾经严重依赖企业的支持，但现在，掌管俄罗斯的是人民而非新西伯利亚时期的西罗维基。\n\n因此，我们打算将医疗保健体系国有化，为联邦的全体人民提供公平优质的医疗保健服务。这无疑是项昂贵的举措，但联邦也以此设法改善了人民的生活，毕竟国家之基不就是她的人民吗？"
 NOV_bill_none: "§Y没有主要议案正在讨论§!"
 NOV_bill_none_desc: "杜马并不总是空闲着的，总的来说，所有俄罗斯人与外国人都信任民主在联邦内的发展。然而，有时渐进的改变并不足够。通过某些决议，我们的成文法可能会发生重大变化，从而确定20世纪及以后的发展方向。"
 NOV_bill_federal_insurance_act:0 "§B[?global.year]年国民保障法§!"
 NOV_bill_federal_insurance_act_desc:0 "尽管此前我们做足了努力，但俄罗斯的高质量全民医疗保健仍然不足。俄罗斯人要么害怕得病，要么对基本的现代卫生一无所知。验光和牙科仍然不在我们的保险范围内，农村地区的医生也人手不足。舒克申总统明白，扩大医保改革将为更多人提供更多的医疗服务，惠及那些多年未求医的人。"
