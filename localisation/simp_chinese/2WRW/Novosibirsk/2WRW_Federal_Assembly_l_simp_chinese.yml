 NOV_bill_healthcare_act_vrpp_desc: "虽然不可否认，联邦人民应该得到适当的医疗保健，但我们不应该让预算紧张并陷入不可持续的赤字。俄罗斯的重建将对我们的资源造成巨大且必要的消耗。\n\n因此，为了财政稳定，我们与£GFX_NOV_VRPP_Icon §g全俄爱国党§!达成妥协，减少国家在医疗保健上的原始支出，并保留私人保险系统，以换取 £GFX_NOV_VRPP_Icon §g全俄爱国党§!的支持和提高市场效率，从而让企业分得一杯羹。"
 NOV_bill_healthcare_act_vrpp_effect:0 "政治点数：§G+25§!。\n这将使我们的§M流动准备金§!§G增加§!§Y$0.5B§!。\n我们的§KGDP增长率§!将§G增加§!§Y0.50%§!。\n我们的§V通货膨胀§!将§R增加§!§Y0.30%§!。\n§G提高§!§Y医疗§!政策效率。"
