 NOV_slander_tt: "这将§R降低§!该地区最有影响力的政党§R1%§!的§Y势头§!"
 NOV_assembly_info_tt: "联邦议会\n\n\n俄罗斯联邦议会是一个两院制的系统，联邦委员会负责决定应该制定哪些法律，之后火炬传递到国家杜马，议员们在那里辩论是否应该实施该法律。"
 NOV_parties_info_tt:0 "自从我们放宽党派组建的限制以来，出现了大量的政治派别，吸引走了一部分£NOV_RAPP_Icon §B农工党§!和£GFX_NOV_VRPP_Icon §g西罗维基§!的支持基础。然而，在这些新组织中，只有少数对权力产生重大影响或有潜力上台。"
 NOV_government_info_tt:0 "就大部分而言，一个政府由多个政党组成。虽然这加强了国家整体的稳定性和信任度，但也不可避免地需要分享权力。尽管选举大多数情况下是公开、透明和和平的，但各个政党除非必要，否则不会将其他政党纳入政府。\n\n联合政府会影响联合内部成员对政府的意见。"
 NOV_bills_info_tt:0 "主要立法是在杜马里讨论和通过的。"
 NOV_parties_interaction_tt:0 "点击与[NOVgetPartyName]互动"
 NOV_party_interaction_bribe_officials_tt:0 "虽然被看不起，但有时我们渴望的进步只能通过传统方式难以实现。为了赢得那场不可能的战斗，我们必须适应变化。\n\n以§R花费§!§Y700M美元§!的高昂贿赂款为代价，§G提高5点声望§!。"
 NOV_party_interaction_token_concessions_tt:0 "虽然各个党派在社会、经济和政治问题上可能存在分歧，但是在一些基本原则上，特别是某些派别对我们的事业可能更加同情。让我们接纳他们最好的观点，以显示我们持续合作的意愿。\n\n政治点数：§R-50§!。\n\n§G获得15点声望§!。\n\n§G这一举措对你的联盟成员更有效§!。\n\n§R联盟的其他成员宁愿我们坚守信仰，而不是坚守虚假的团结感§!。"
 NOV_party_interaction_sit_down_tt:0 "有时，双方之间的直接会议，无论是正式的还是非正式的，对于维护我们的盟友关系和寻找新的盟友至关重要。我们致力于团结人民，而不是分裂他们！\n\n政治点数：§R-75§!\n\n§G获得7.5点声望§!"
 NOV_party_interaction_accuse_tt:0 "尽管我们支持社会运动，但近年来一些政治家越来越将自己打造成“人民先锋”的形象。他们在全国范围内发表慷慨激昂的演讲，对某种国家针对人民的阴谋进行荒谬的声称，并表示他们正在与之抗争。由于我们政治教育和素养的不足，许多公民都上了这些低劣把戏的当。在狂热民粹主义伤害我们国家之前，我们必须阻止他们！\n\n§R减少10点声望§!\n\n§G我们的联盟会喜欢这一举措§!"
