l_simp_chinese:
 NOV_the_primakov_presidency:0 "普里马科夫任期"
 NOV_the_primakov_presidency_desc:0 "尽管§B舒克申§!和他的§B理想主义者团伙§!看法不同，尽管§M激进青年§!和§M学生§!在街头大声异议，尽管可能再度出现的§x民粹派§!恐怖分子，但他们无法改变事实：俄罗斯的繁荣、主权和自由归功于企业。没有西比尔的小麦、凤凰的枪支或泰坦的创新，德国的脚跟将永远碾压我们伟大的国家。\n\n幸运的是，勤劳的俄罗斯沉默大多数明白这一事实。现在，他们已经授权叶夫根尼·普里马科夫和他的全俄爱国党来统治，他们将不再保持沉默。通过全面拥抱自由市场，简化俄罗斯臃肿的官僚机构，并防止危险的激进分子破坏我们的资本主义制度，曾经使我们的国家伟大的旧秩序将会重现。\n\n只有俄罗斯的敌人才会有任何理由抱怨。"
 NOV_getting_our_hands_dirty:0 "弄脏我们的手"
 NOV_getting_our_hands_dirty_desc:0 "在最近选举的余波中，£GFX_NOV_ARPP_Icon §g全俄爱国党§!现在处于一个使我们能够追求我们最深层目标的位置。有了普里马科夫领导，我们可以开始迈出第一步，为俄罗斯联邦铸造一个新的、更加美好的命运，一个以超级企业的力量和繁荣为支撑，由国家的绝对权力控制。\n\n前方的道路是清晰的，现在甚至已经迈出了第一步。杜马将屈服，法院将顺从，人民将通过一个被设计用于“负责任”和“真实性”的国家媒体得到正确的信息。当我们完成时，我们将以骄傲的目光审视我们的工作，因为我们将最终巩固我们的权力，抵御一切内部反对力量，拯救俄罗斯免于内部的分裂。"
 NOV_our_generous_benefactors:0 "慷慨的捐助者"
 NOV_our_generous_benefactors_desc:0 "经过多年的动荡，联邦总是有一个团体引导我们度过每一场风暴的最糟时刻：§g西罗维基§!这些庞大的企业为俄罗斯做出了巨大的牺牲，却遭到了§B舒克申§!及其愚蠢伙伴们的攻击，他们试图摧毁联邦最伟大的英雄，以提升普通人的财富。\n\n这是一种绝对不可饶恕的行为，因为如果有人应该享有俄罗斯的巨大财富和资源，那就是那些为了国家的防御而冒一切风险的人。我们的第一步将是提升他们的权力，以回报他们为俄罗斯的进步所做出的慷慨贡献，同时在这个过程中建立一个强大的盟友，他们将在我们推进改革的过程中保持忠诚。"
 NOV_lucrative_business_opportunities:0 "有利可图的商机"
 NOV_lucrative_business_opportunities_desc:0 "确保像那些巨型企业这样强大的实体忠诚于我们，需要提供一些非常诱人的让步，而我们将正是这样做的。联邦广袤的领土蕴藏着丰富的自然资源和未开发的消费市场，为塞洛维基提供了无尽的机会，只要我们确保小型企业停止提供任何类似竞争的东西。\n\n为这些巨型企业提供如此利润丰厚的机会将进一步增加他们的忠诚度，同时也增加了我们自己的财富。人们可能会抗议，特别是那些拥有私人企业的人。但我们必须将他们搁置一边，以确保我们的现代化得以实现。"
 NOV_tax_breaks:0 "税收优惠"
 NOV_tax_breaks_desc:0 "那些反对实力派的人使用的主要武器之一就是将他们税得赤字累累。然而，在为联邦做出如此巨大牺牲之后，有谁能声称他们应该承受这种不应得的严厉限制呢？现在是我们来撤销我们前任的暴政行为的时候了。\n\n我们不仅将取消现有的税收，而且还将免除大部分正常税收。通过这样做，我们可以开始进一步提升大型企业的财富，同时逐渐改善我们合作的利益，以实现持续的经济增长。"
 NOV_repealing_the_environmental_protection_act:0 "废除环境保护法案"
 NOV_repealing_the_environmental_protection_act_desc:0 "四年来，俄罗斯的潜力一直被那些宣扬所谓的污染威胁的人所限制，许多人不幸地支持这种观点。前一届政府或许不愿意推动我们的工业能力的极限，但我们不会胆敢对追求繁荣加以限制。\n\n我们将需要废除这些法规和法律，同时压制那些对我们事业的真相视而不见的激进团体。通过此举，我们的企业合作伙伴将比以往更加忠诚，因为他们将不再被无知平民的哭喊所束缚。"
 NOV_controlling_the_media:0 "控制媒体"
 NOV_controlling_the_media_desc:0 "在我们规划未来的同时，已经变得明显，我们将面临的最大障碍是舆论战场。这个战场被所谓的“自由媒体”的毒蛇所主导，无知的恶棍们传播他们自己的真理之消息。如果我们想要稳固我们的地位，我们必须确保将这些国家的敌人铲除。\n\n取而代之，我们将创办一家传媒机构，它将传播唯一负责任的真相版本。它将让世界了解我们在经济增长和稳定方面的使命，使我们国家的公民在我们的实践和方法中支持我们。通过它，我们将确保多年的舒适支持，这是稳定的完美配方。毕竟，每个人都渴望和平安宁，不是吗？"
 NOV_steal_from_the_states:0 "偷美国的钱"
 NOV_steal_from_the_states_desc:0 "虽然我们目前可能无法完全掌握俄罗斯媒体，但同时也存在着大量的利润机会。更具体地说，我们可以与一些“靠谱”的朋友联系，以从更有经验和盈利能力的美国娱乐产业中获得收益。\n\n如果我们成功利用这个新资源，好处将不胜枚举。简而言之，我们将能够一石二鸟，既提供廉价娱乐，同时又利用利润来满足我们自己的需求。俄罗斯人民将从我们的努力中获益，从长远来看。"
 NOV_pinch_from_the_past:0 "保守的文化娱乐"
 NOV_pinch_from_the_past_desc:0 "如果我们真正要从发展本土俄罗斯娱乐产业中受益，就不能让不符合我们文化和价值观的外部影响侵蚀它。尽管成本可能很高，但我们掌控下的巨大利润行业的可能性太大了，不容错过。\n\n目前，我们已经开始了第一批投资和计划。数百个频道涵盖各种主题，重点关注本国的方方面面、历史和政府。当然，我们将保留在这些主题的出版和展示上最后决定权，因为我们不希望传播任何虚假信息。"
 NOV_cant_protest_the_unknown:0 "无法抗议未知"
 NOV_cant_protest_the_unknown_desc:0 "我们努力施加影响力，巩固我们对俄罗斯媒体的控制已经开始见效。甚至在现阶段，我们的网络已成为该国最受欢迎的之一。甚至在邻国，我们的广播开始获得关注。然而，主要目标并不仅仅是让人民满足于面包和马戏团，而是创建一个将公民与国家隔离的面纱。\n\n在这个追求中，我们已经开始取得进展。已经有迹象显示，普里马科夫总统的支持率开始改善。无论我们的信息在短期内有多准确，我们都继续前行，因为我们知道人民无法理解我们真正的目标。"
 NOV_securing_our_hold:0 "保卫我们的堡垒"
 NOV_securing_our_hold_desc:0 "经过数月的斗争和秘密交易，我们现在发现自己比以往任何时候都更加安全。在有着国家安全官员的支持以及对信息流向民众的直接控制下，我们现在可以开始追求我们最终的目标：对联邦国家的绝对权力。\n\n这一天已经历时很久，所有怀疑我们的人现在都对我们新获得的权力感到惊叹。不久之后，杜马和法院将不再成为我们野心的阻碍，俄罗斯的命运将取决于普里马科夫的意志。一个辉煌的新时代，经济增长、社会稳定和军事实力并存的俄罗斯，即将到来！"
 NOV_securing_the_courts:0 "控制法院"
 NOV_securing_the_courts_desc:0 "在我们面临的仅存威胁中，几乎没有什么比最高法院和那些年迈的愚人这样的庞大法律实体更威胁我们的政治统治。虽然最初看起来似乎无法解决这样的问题，但是一些巧妙安排的贿赂和威胁勒索可以轻松确保其持续的“客观性”。\n\n随着又一块棋子转向我们一方，我们终将越过无可回头之点。普里马科夫和£GFX_NOV_ARPP_Icon §g全俄爱国党§!离控制下的新民主主义目标越来越近，而我们的对手将被迫看着我们将他们的努力全部抹去。从灰烬中，普里马科夫将创建一个真正强大的国家。"
 NOV_bribe_those_who_cooperate:0 "贿赂合作者……"
 NOV_bribe_those_who_cooperate_desc:0 "许多人认为最高法院的人是有道德的人，免受大多数人谴责为“腐败”和“贿赂”。虽然肯定有一些人坚持坚守自己的美德，希望保持良好的公众形象，但更多的人不禁对进一步填满自己的口袋产生垂涎欲滴的想法。\n\n已经积攒了一大笔钱来实现这一目标。有几个候选人排好队，他们的支持将使我们最后的挑战者逐渐崩溃，为最终目标铺平道路。"
 NOV_blackmail_those_who_do_not:0 "……勒索抗议者"
 NOV_blackmail_those_who_do_not_desc:0 "虽然绝大多数人的忠诚是可以购买的，但不幸的是，仍然存在一群坚决抵制我们慷慨馈赠的人。幸运的是，这个群体远非无懈可击。我们的特工已经整理了一长串我们对手可能犯下的毁灭性罪行。\n\n尽管其中一些指控并不完全属实，但至少我们可以保证几乎所有剩余的反对声音将不再如此坚决地反对我们的改革。那些依旧坚守立场的人将会陷入尴尬境地，因为他们的声音将被我们团结一致的声音所淹没，从广播到印刷媒体，无所不包。"
 NOV_the_cards_are_stacked:0 "纸牌屋已叠起"
 NOV_the_cards_are_stacked_desc:0 "终于，我们正走向尽头。我们的企业盟友比以往任何时候都更强大，国家媒体让人民满足并传播他们需要知道的唯一真相。随着最高法院屈从于我们的意愿，现在£GFX_NOV_ARPP_Icon §g全俄爱国党§!内的许多人提议我们最终完成棋盘上的最后一步。\n\n现在必须实现两个最终目标。首先，普里马科夫指出£NOV_RAPP_Icon §B农工党§!的潜力，如果他们能倾向于我们的方向。最后，我们需要赢得人民真正的善意，以便我们可以清除任何剩余的不满。"
 NOV_friends_in_the_rapp:0 "农工党里的朋友"
 NOV_friends_in_the_rapp_desc:0 "尽管杜马中有许多人在我们的掌控之下，但我们拥有的优势远远不如可能或应该的大。审视我们的潜在目标，最脆弱的是那些£NOV_RAPP_Icon §B农工党§!的人，他们可能愿意改变立场，加入我们的事业。\n\n凭借相等数量的利刃和卢布，以及我们在正确的压力点上的一些来自企业和媒体盟友的攻击，这将足以确保我们在杜马中再次取得政治胜利。"
 NOV_convince_them:0 "说服他们"
 NOV_convince_them_desc:0 "就像最高法院一样，有很多人愿意只凭一箱满满的现金改变他们的立场。虽然有些人的代价可能比其他人更高，但这个代价肯定值得为了给舒克申这个不可靠的民主制度钉上象征性的棺材钉。\n\n随着反对势力的最后墙壁崩溃，普里马科夫和£GFX_NOV_ARPP_Icon §g全俄爱国党§!的长期目标离现实越来越近。不久之后，这个笨拙民主制度将会转变为联邦急需的强有力的权威机构。"
 NOV_threaten_them:0 "威胁他们"
 NOV_threaten_them_desc:0 "尽管金钱确实是一种非常诱人的东西，但它远非最有效的激励因素。在所有人类情感中，恐惧无疑是最强大的。凭借我们的影响力和力量，恐惧正是我们将要传播的内容，我们将让他们知道，如果他们拒绝我们慷慨的供品，将会发生什么。\n\n就像我们过去曾\"影响\"政治对手一样，对于那些与£GFX_NOV_ARPP_Icon §g全俄爱国党§!的政治观点不一致的人来说，时刻存在着可疑的死亡或失踪的危险，这将使我们的新朋友们保持顺从。"
 NOV_if_you_stay_in_line_your_good:0 "只要你听话，就不会有事"
 NOV_if_you_stay_in_line_your_good_desc:0 "随着杜马有效地受控于我们，现在是时候确保这种控制变得完全。我们的力量近来增长如此之大，以至于我们现在可以确保所有的对手要么顺从，要么被从棋局中清除。\n\n人们所称之为民主的梦想即将结束。随着政府的其余机构纷纷顺从普里马科夫的权威，以及将世界与我们隔离的幕布越来越紧，我们的成功几乎可以预见。"
 NOV_friends_of_the_common_folk:0 "平民之友"
 NOV_friends_of_the_common_folk_desc:0 "虽然我们可能在国家的政治职能上取得主导地位，但国家是由底层民众支撑的。换句话说，没有一个群体来验证它，权力是毫无意义的。普里马科夫总统已经意识到这一点，现在他的优先事项将不得不从政治的大游戏转向说服俄罗斯的伟大人民，让他们相信他的良好意图和对他们的喜爱。\n\n通过媒体露面，塑造他为一个人民的代表，通过调整税收和社会项目，让人民对£GFX_NOV_ARPP_Icon §g全俄爱国党§!有最正面的印象，人民将学会爱戴和尊重我们。如果他们不愿意...我们会确保他们不会制造麻烦。"
 NOV_token_tax_reforms:0 "代币税改革"
 NOV_token_tax_reforms_desc:0 "通过出乎意料的少量努力，我们可以赢得人民的好感。虽然有几件事情我们可以做，普里马科夫坚持要充分利用少量的努力。毕竟，我们不想为了基本的安抚而过多地使用国家资金。\n\n解决方案是什么？给工薪阶层进行温和的减税。当然，这样的税收负面影响不会影响到£GFX_NOV_ARPP_Icon §g全俄爱国党§!的成员或我们的盟友，我们也不会因此损失太多资金。然而，较低和中等阶层的人会对这样的“改革”表示欢迎，并且我们将从中获得一些期望已久的感激之情。"
 NOV_cut_unnecessary_social_spending:0 "削减不必要的社会开支"
 NOV_cut_unnecessary_social_spending_desc:0 "一份新提案已经呈到普里马科夫总统的办公桌上，详细描述了一个赢得公众认可的新选择。该提案描述了一个可能的计划，不仅能取得成功的公共关系胜利，还能在此过程中填满我们的口袋。\n\n我们将大幅削减政府在社会计划上的开支，同时公开宣布这些削减将\"终结福利欺诈\"。凭借我们对媒体的控制，他们将庆祝这些所谓骗子的终结，而我们将在不必要的救济金上节省数亿卢布。"
 NOV_the_people_pacified:0 "已安抚民众"
 NOV_the_people_pacified_desc:0 "虽然知识分子和进步人士会不断抨击政府的琐事，如“缺乏透明度”或“新威权主义”，但这些思想家所声称的并不能弥补他们的无能。除了爱国党，还有谁能将俄罗斯推向如此高度？除了£GFX_NOV_ARPP_Icon §g全俄爱国党§!还有谁能更好地将俄罗斯人民从贫困中解救出来？只要人们（或大部分人）从这种安排中获益，他们并不在乎政权背后发生了什么。给予人们实实在在的利益将削弱£GFX_NOV_DSPR_Icon §P民主社会党§!和£NOV_RAPP_Icon §B农工党§!的支持基础。让我们拭目以待，看看他们的下次集会会有多少人参加！"
 NOV_a_perfectly_broken_system:0 "一个完美的破碎体制"
 NOV_a_perfectly_broken_system_desc:0 "终于，£GFX_NOV_ARPP_Icon §g全俄爱国党§!的梦想实现了。西罗维基以前从未如此忠诚，他们在波克雷什金时代从未如此。普京的时代，普通俄罗斯人只知道他们需要了解的事情，因为我们的媒体机构向所有人传播普里马科夫总统的好消息。人们对我们的繁荣感到满意。国家的官僚机构屈从于我们的意志，抵抗的残余正在逐渐消失。\n\n最后，我们的权力无可置疑。世界谴责我们的行动是专制和充满腐败的，然而他们永远不会理解，普里马科夫是唯一愿意确保命运并真正领导现代俄罗斯的人。"
 NOV_Yevgeny_Primakov: "叶夫根尼·普里马科夫"
 POLITICS_YEVGENY_PRIMAKOV_DESC:0 "叶夫根尼·普里马科夫相信权力。\n\n他不是纳粹，不是疯狂的疯子，也不是吹牛大王，但他明白在伟大的政治游戏中，权力至关重要。枪支的力量，金钱的力量，生产的力量，指挥工业和民众这些巨兽随心所欲。那就是权力。\n\n权力决定了人们的诞生和死亡。作为一个犹太人，他感受到纳粹的铁蹄将他迫到东方，他们在基辅杀害了他的家人。斯大林主义官僚机构的意志无法控制各个军队派系，结果导致了灾难。与叶利钦在叶卡捷琳堡的时候，稍微高效的战略统治仍然无法使俄罗斯团结起来。普里马科夫看到了背后的推手；力量和工业的资本寡头，即§g西罗维基§!。在新西伯利亚，权力得到了完善。军队、科学家、农业工作者和工业家，都掌握着权力，并为了从人民和土地中提取最高效率、最多产出而争斗。\n\n这就是胜利所需的。尽管瓦西里·舒克申的政府能够击退俄罗斯人并遏制西罗维基的过度行为，但那些过度行为现在已经过去了。在充满不确定性、充斥着定居纳粹的危险重建时代，需要重新关注俄罗斯人及其权益。而普里马科夫，摆脱了亚历山大丑闻的阴影，成为引领£GFX_NOV_ARPP_Icon §g全俄爱国党§!和俄罗斯的新面孔。\n\n如今，他坐在§g三头利维坦§!的掌舵之位上，那巨大的野兽§x人民§!咬向他的脸，他们呼吁自残或自焚，他们渴望撕裂俄罗斯。这将不会轻松，他们会试图摧毁他。但他将获胜。\n\n如果他最终比任何之前的俄罗斯人都更富有、更强大，谁能责怪他呢？"
 NOV_Yuri_Zubakov: "尤里·祖巴科夫"
 POLITICS_YURI_ZUBAKOV_DESC:0 "尤里·祖巴科夫于1943年11月27日出生在车达，正值苏联完全崩溃之际。随着纳粹从西方扫荡而来，日本人和他们的法西斯暴徒也从东方席卷而来，带着一群法西斯分子和军事强人占领了车达。因此，祖巴科夫从未体验过民主的感觉，只懂得权力与枪杆之下的生活，尽管这一切都带着虚伪的面纱。哦，祖巴科夫深知枪支的威力。在车达，他成为了军方情报机构的特工，不是为了恐吓人民，而是为了处理国家事务。作为一个高级官僚，掌握着许多人的生死，祖巴科夫知道如何运用国家的工具来达到自己的目的。\n\n当新西伯利亚的鹰在远东奔腾时，他了解到这些所谓的§g西罗维基§!有多么强大。巨型企业的力量让他们能够推动俄罗斯国家摧毁其对手，为俄罗斯带来祝福的稳定。当舒克申的§B俄罗斯农工党§!赢得选举时，他知道他们提出的改革只是煽动性的空话。人民？他们对什么都一无所知，只懂得愚蠢的懒散。自然而然地，他加入了新的§g全俄罗斯爱国党§!，以对抗这些颠覆进展的企图。即使是该党的新面孔普里马科夫也缺乏能力。他试图控制一个系统，但问题从来不是它有多余之处，而是波克雷什金拒绝正面对抗民粹主义的威胁！\n\n可怜的普里马科夫从未料到这一点，或许他明白但太愚蠢而无法阻止他。现在，尽管他非常年轻，但西罗维基最虔诚的信徒已经掌握了职位。\n\n让这些傻瓜们试图阻止进步和繁荣吧。"
