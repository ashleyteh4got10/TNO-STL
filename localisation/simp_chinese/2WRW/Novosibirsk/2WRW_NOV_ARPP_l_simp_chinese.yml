 NOV_ARPP_invest_into_the_nmg:0 "投资§WN§!§BM§!§RG§!"
 NOV_ARPP_invest_into_the_nmg_desc:0 "从国家中拨出一些资金投入媒体领域，或许可以帮助NMG解决困境。在外界，我们会以促进俄罗斯文化、电影和娱乐的普及为理由来解释此举。毕竟，在所有收入都流入我们手中的情况下，这种说法也算是某种程度上的真实。"
 NOV_ARPP_conduct_customer_survey:0 "进行客户调查"
 NOV_ARPP_conduct_customer_survey_desc:0 "为了成为一家成功的公司，我们仍然需要倾听我们的受众真正想要的内容。我们将调动一些子公司开展全国范围的大规模调查。由于每个地区都有其独特的偏好，根据他们的口味量身定制节目是非常关键的。"
 NOV_ARPP_copy_american_game_shows:0 "引入美式综艺节目"
 NOV_ARPP_copy_american_game_shows_desc:0 "美国公民享受着一些最复杂和富有创意的电视节目，这些节目极大地提高了美国人的生活满意度。虽然£GFX_NOV_ARPP_Icon §g全俄爱国党§!并不是一家受欢迎的组织，但这并不意味着我们必须让生活变得如此无聊。通过模仿或授权，我们将向俄罗斯人播放一些美国风格的节目。"
 NOV_ARPP_copy_american_cartoons:0 "引入美式动画片"
 NOV_ARPP_copy_american_cartoons_desc:0 "在战乱不断的1950年代和1960年代，对于俄罗斯的孩子们来说，有时候唯一的快乐来源就是走私进来的美国卡通录像带，这在年轻的俄罗斯人中留下了深刻的印象，他们现在已经成为职场人士并且开始组建自己的家庭。NMG将寻求战略性地购买一些版权，尤其是那些相对较便宜的“经典”作品，这些作品比最近的动画片要便宜得多。"
 NOV_ARPP_copy_japanese_game_shows:0 "引入日式综艺节目"
 NOV_ARPP_copy_japanese_game_shows_desc:0 "日本庞大的人口给媒体产业带来了许多机遇，在这片地球上，竞争最激烈的地方之一。这为我们提供了大量的机会，去创作一些模仿他们的节目，并在此过程中避免他们的错误。"
 NOV_ARPP_copy_japanese_cartoons:0 "引入日式动画片"
 NOV_ARPP_copy_japanese_cartoons_desc:0 "最近，日本动画片在亚洲和俄罗斯的年轻人中引起了轰动。这些所谓的“动漫”经常以虚构的幻想背景和在西方手绘动画电影中罕见的先进摄影技术为特色。如果我们能够确保对其中一些作品的独家权利，NMG将会获得巨大的利益。"
 NOV_ARPP_produce_a_war_movie:0 "制作一部战争片"
 NOV_ARPP_produce_a_war_movie_desc:0 "战争片自大战以来一直是最受欢迎的类型之一，而俄罗斯处于一个独特的位置。在第二次西俄战争之后，我们留下了大量退役老兵和大量缴获的德国物资。也许我们可以利用这些东西做点什么……"
 NOV_Ivan_Silayev:0 "伊万·西拉耶夫"
 NOV_Vladimir_Vinogradov:0 "弗拉基米尔·维诺格拉多夫"
 NOV_Rem_Viakhirev:0 "雷姆·维亚希列夫"
 NOV_Pyotr_Deynekin:0 "彼得·德伊内金"
 NOV_Ivan_Silayev_hog_desc:0 "§Y俄罗斯联邦副总统§!\n£NOV_ARPP_Icon §g全俄罗斯爱国党§!\n--------------\n如果普里马科夫代表着£NOV_ARPP_Icon §g全俄爱国党§!治理下新俄罗斯的面孔，那么伊万·西拉耶夫则是它的智慧之脑。西拉耶夫于1930年出生在下诺夫哥罗德州，在航空工业领域度过了他的成长岁月。作为一名工程师，西拉耶夫很快加入了£NOV_ARPP_Icon §g全俄爱国党§!，并通过逐级晋升的方式跻身其中，他对世界的机械化观点与党的理念高度契合。\n\n西拉耶夫认为，一个国家要繁荣发展，必须像经营企业一样运作。就像满意的顾客能创造丰厚的利润一样，成功的经济能带来满意，从而让民众顺从。为此，他将效率看得比一切都重要，并且乐于剔除可能阻碍效率的一切。毕竟，如果机器中的一个齿轮停止工作，明智的工匠会将其更换。"
 NOV_Vladimir_Vinogradov_for_desc:0 "§Y外交部长§!\n£NOV_ARPP_Icon §g全俄罗斯爱国党§!\n--------------\n一个聪明的国际象棋大师会诱使对手走入自己的圈套，在对手意识到之前出其不意地战胜他们。弗拉基米尔·维诺格拉多夫正打算使用这个策略，只不过比在国际象棋棋盘上要大得多。\n\n作为一名具备外交才能的前工程师，维诺格拉多夫加入了£NOV_ARPP_Icon §g全俄爱国党§!，他相信俄罗斯在全球舞台上仍然具备作为“第四强国”的潜力。为了实现这一目标，他认为最佳策略是迎合美国和日本帝国的利益，这样俄罗斯既能从两者中获益，又不必与任何一方结盟。这是否是一个万无一失的策略，尚有待观察。"
 NOV_Rem_Viakhirev_eco_desc:0 "§Y经济部长§!\n£NOV_ARPP_Icon §g全俄罗斯爱国党§!\n--------------\n俄罗斯新经济的掌舵者，其决策受到大亨的指引，对他们和他们的利益来说，正是时候。雷姆·维亚希列夫是前与泰坦有关联的石油大亨，被普里马科夫亲自挑选，担任财政部的首脑职位，这很可能是因为他们在金融方面有共同信念。\n\n维亚希列夫是一个心狠手辣、脾气暴躁的商人，他希望将经济掌控在一小群专家手中，而不是交给一帮几乎不知道如何投票的乡巴佬。如果这些专家恰好与前任“力量机关”有关系，那也只是巧合罢了。"
 NOV_Pyotr_Deynekin_sec_desc:0 "§Y国防部长§!\n£NOV_ARPP_Icon §g全俄罗斯爱国党§!\n--------------\n将统一俄罗斯的战争是由像彼得·德伊内金这样的人战斗并取得胜利的。德伊内金担任将军近十年，他具备典型的冷静、稳健的特质，普里马科夫可以信任他来负责俄罗斯的安全。\n\n与£NOV_ARPP_Icon §g全俄爱国党§!的许多其他成员相反，德伊内金非常清楚政府内部的腐败和不团结实际上是一个问题。然而，按照典型的军事作风，他只是听从命令并保持满足感，只要腐败不蔓延到他的领域。"
 ARPP.1.t:0 "我们想要电波"
 ARPP.1.desc:0 "\"再给我解释一遍，西拉耶夫，\"普里马科夫说着，他目视着桌上摊开的一堆表格和图表。\"这么多的文件工作需要迅速处理…还是一个电视台？\"\n\n西拉耶夫立即回答道，被普里马科夫的犹豫激起了兴趣。\"没错，就是这样，\"他猛地在桌子上敲了一下，\"迅速地。公众对我们政府的抗议声越来越激烈，每天、每分钟都在增加。你也看到这些独立新闻频道播出的内容了吧，它们给公众灌输了一些想法。我们必须在媒体引发一场该死的起义之前控制住它！\"他的声音很低沉，不过充满活力。\"如果泰坦上一个季度告诉我们什么，那就是他们需要一些多元化的投资。我们成立一个子公司，收购竞争对手，那些羊就会回到放牧的状态中。\"\n\n普里马科夫默默地沉思了片刻，考虑着他的话语。媒体仍然是这个国家少数几个未被他们掌控的领域之一，但如此迅速地采取行动只会让异议的火花更加明亮。\n\n普里马科夫有节奏地在桌子上轻拍着手指，思考着。\"西拉耶夫，你要明白，如果我们这样做，必须小心翼翼。我们不能仅仅假设人民会自动重新顺从。你打算如何防范错误？\"\n\n\"不会有任何错误。一切都已准备就绪，如同钟表般精确地运转。\"西拉耶夫更详细地介绍了电视台的框架。普里马科夫不得不承认，它有潜力。如果做得正确，他们面前的最大阻碍将会彻底消失。然而，计划再好也有可能出岔子……\n\n\"有一件事你没有告诉我，伊万。谁将会在这个项目中扮演关键角色？\"\n\n西拉耶夫咧嘴一笑。\"你正在看着这个项目的新任首席执行官。\"\n\n普里马科夫笑了起来。\"伊万，你总是让我刮目相看。你的项目得到批准。尽量给我们其他人留一些利润吧。\"西拉耶夫狡黠地笑了笑，两人为他们的新事业喝了一杯。"
 ARPP.1.a:0 "朋友生意还是展示生意？"
 ARPP.2.t:0 "鸭子们"
 ARPP.2.desc:0 "爆米花的香气弥漫了房间，安德烈拿着碗装满了这些小黄色的零食，走进起居室，迎接着他儿子和女儿热切的接住动作。他的妻子尤丽娅已经在沙发的远端找到了一个舒适的姿势。\n\n“亲爱的，快点过来，否则我们会错过节目！”\n\n安德烈坐在妻子旁边，用毯子盖住孩子们，伸手拿起新电视的遥控器。按下一个按钮，各种画面在他眼前闪烁，直到他找到他要找的内容；一个滑稽的小鸭子节目，每只鸭子都是明显的暴君历史人物的代表，不过变成了可笑的儿童卡通角色。\n\n当片头音乐响起时，他回想起自己年轻时的黑暗日子，那时这种奢侈品在他曾经称之为家的偏僻村庄几乎是不存在的。这让他真正思考起自己的国家是如何走过来的，从那些他为了躲避不断存在的炸弹威胁而匆忙进入废弃的酒窖的黑暗日子……\n\n如今，他唯一需要担心的是琐碎的政治和长达六至四点的工作时间——虽然长时间，但是很值得。他听说过公司计划降低工资并延长工作时间，但他根本没有看到任何媒体对这些荒谬计划的报道……\n\n安德烈的思绪又回到了眼前的屏幕上，德国显然是昔日元首的鸭子被其他角色电击了，其中还包括联邦自己的米哈伊尔·巴甘诺夫。\n\n孩子们开心地笑了起来，他不禁跟着笑出声。毕竟，生活是美好的，在政治的混乱领域里，没必要去找麻烦。"
 ARPP.2.a:0 "无法对抗你不知道的东西。"
 ARPP.3.t:0 "异议"
 ARPP.3.desc:0 "瓦迪姆·巴甫洛夫和彼得·尼古拉耶夫走进西伯尔工厂里拥挤的休息室。这是他们的午餐时间，西比尔和全俄爱国党都没有勇气剥夺这个国家劳动者的权利。毕竟，他们承受着工业的嘈杂声，忍受着制造农机所产生的烟雾和火花的万花筒。对于一些人来说，午餐休息是吸入廉价焦油和尼古丁的时间。对于这两个人来说，这是他们闲聊的时间。\n\n\"又是一天，又是一份糟糕的工作。你没听经理说吗？为了提高生产力，他们要加强定额执行，\"彼得抱怨道，\"接下来是什么，派武装警卫逼迫我们在枪口下工作吗？\"\n\n\"冷静点，彼得。只是检查员，对吧？\"瓦迪姆说道，\"事情不会那么糟。我们是工人，是真正为这个企业创造价值的人。毕竟，工资并不是从大地里冒出来的。\"\n\n彼得变得更加焦躁不安。\"我们为了摧毁德国的法西斯主义而战，现在却逐渐向法西斯企业主义屈服。你难道不觉得我们有比让寡头践踏我们更好的选择吗？\"他的脸开始变红，\"舒克申是一个反工会分子和一个企业的爪牙；他没有勇气承认联邦一直都是一个独裁政权。\"\n\n\"一个独裁政权？\"瓦迪姆问彼得。\n\n\"占有阶级的独裁政权。\"\n\n瓦迪姆揉了揉眼睛。\"但是全俄爱国党并没有做错什么！经济发展得比以往任何时候都好，没有他们，我们就没有这些工作来养活和安置我们的人民。彼得，你不能对我说这些胡言乱语，特别是在你依赖的工厂里。\"\n\n\"我可以，并且我会确保这个工厂的掌权寄生虫们知道他的雇员对他的'政策变动'有何看法。我们的兄弟们没有为了让寡头再次获胜而牺牲！\"彼得气呼呼地走向他老板的办公室，而其他工人则像鱼离水一样盯着他冲出休息室。"
 ARPP.3.a:0 "义愤填膺，拙劣谋略。"
 ARPP.4.t:0 "莫斯科大选之夜"
 ARPP.4.desc:0 "那是莫斯科一个寒冷的夜晚，选举结果揭晓给全国人民带来了震撼：全俄爱国党以微弱优势获胜。紧接着，当地酒馆传来一片喧嚣声，有人为胜利而庆祝，有人则沮丧不已。\n\n微醺的德米特里终于说出了一个连贯的句子：“你知道吗，普里马科夫实际上是最好的领导人……他会通过扩大企业的规模给我们每个人提供工作和金钱！”酒馆内再次掀起一片骚动，人们对德米特里投以嘲讽和赞扬的声音。然而，安纳托利告诉众人：“社会主义者会给我们更多的工作机会和更好的薪水，而企业将剥削我们并掠夺我们的金钱！甚至可能杀害我们！还记得波克雷什金的日子吗？！”\n\n作为回应，德米特里对安纳托利大喊大骂，疯狂地向他宣扬普里马科夫和全俄爱国党将如何拯救俄罗斯人民免于贫困，提醒他们每个人都在波克雷什金时代有一份工作，即使有些职业并不理想。他的支持者开始与安纳托利的支持者争斗，那些试图平息事态的人都未能成功。\n\n最终，安纳托利设法在喧嚣声中大喊：“没有从奴役中获得幸福的人！他们只是伪装在人类外衣的财产！你……你不能说这……这就是正义！不！这是不可能的！”\n\n酒馆里，包括老板在内，开始打斗，拳头向所有不同意的人扔去，混乱笼罩整个建筑。在人群喧嚣中，数百声嘶喊和斗殴让人们的饮料撒落在地上，然而发起这场争斗的两个人，德米特里和阿纳托利，仍然设法保持他们的对话。\n\n“这就是正义！人们能够找到工作……有钱，这怎么了，怎么不算正义呢，'同志'！”在酒馆里的骚动声中，几乎无法听清，斗殴现在已经完全卷入这个小房间，有些人被打倒在地，流血不止。\n\n不久后，警察将人们从酒馆中疏散出来，这场骚动终于被迫结束。然而，尽管这一切已经结束，安纳托利无法不感到这是未来的一个预兆 - 俄罗斯内部出现了一道无法弥合的裂痕，有可能撕裂整个国家。"
 ARPP.4.a:0 "一场风暴笼罩在地平线上。"
 ARPP.5.t:0 "彼得·尼古拉耶夫在哪里？"
 ARPP.5.desc:0 "瓦迪姆·巴甫洛夫调整了一下安全帽，看着下一台引擎缓慢地移入车辆框架上。转眼之间，他的团队将开始工作，确保引擎安装得合适，然后将其送到制造线的下一部分。然而，整个工厂回荡着一阵刺耳的嗡嗡声，他的表情也随之沮丧下来。\n\n公共广播系统在整个制造设施中响起。“瓦迪姆·米凯洛维奇·巴甫洛夫，请求您前往经理办公室。”\n\n瓦迪姆缓慢地朝办公室走去，远离自己的岗位。整个情况本来就很奇怪，他是一个高产的工人，被老板称赞为勤奋忠诚，那么为什么要通过公共广播来通知他呢？\n\n他打开办公室的门，身体因恐惧而颤抖。那位他从未见过的年迈肥胖的经理站在两名穿制服的士兵旁边，用鹰一般的目光盯着他。这不是晋升，也不是加薪。这是一次审讯。\n\n他的经理从不锈钢水壶里喝了一口。“瓦迪姆·米哈伊洛维奇，坐下。这两位先生是来自联邦安全局的。”\n\n瓦迪姆缓慢地坐下，额头上渗出汗珠。“为什么是我？”他问道。“我忠诚。我为西比尔工作了一辈子，在每次全俄爱国党集会上都出席，参加了解放战争。我不是叛徒。我不是持不同政见者。天哪，我是一个爱国者！”\n\n“也许是的，”其中一名联邦安全局特工说道。他翻开笔记本。“在彼得·约西佛维奇·尼古拉耶夫被解雇前两周，你与他有何关系？”"
 ARPP.5.a:0 "在威权主义体制下，总有受害者。"
 ARPP.6.t:0 "面包与马戏"
 ARPP.6.desc:0 "雪茄的烟雾充满了房间，灯光的嗡嗡声和时钟的滴答声依旧保持着韵律。在这一切的中央，一张华丽雕刻的桌子后面坐着总统普里马科夫，整理着一堆文件，同时伸手去拿一支这个小时的第三支雪茄。\n\n毕竟，今天又是一个工作日。一些公司高管派了几个代表与总统举行会议，这对他来说是“至关重要和关切的”会议。事情需要被整理、有序，并准备好迎接他们的到来——\n\n普里马科夫的办公室的门突然被推开了，整齐打扮但面无表情的企业官员们在他的桌子前各就各位。在这群人中间，有维诺格拉多夫，他主持了讨论。\n\n\"普里马科夫，别用无意义的介绍来混淆这次会议的目的。我们来这里是为了行动，不是空谈。\"\n\n他把一个文件夹推给普里马科夫，后者投来怀疑的眼神。经过进一步检查文件夹的内容，很明显可以理解为什么维诺格拉多夫如此坚决地避免寒暄。详细的计划包括废除过去的改革、减税和进一步的政治内幕交易，每一页每行都有。\n\n维诺格拉多夫可以看出普里马科夫读完了，然后再次开口。\n\n\"正如你所见，我们的目标相当……宏伟。然而，如果其全部内容对公众揭示，我们将在几天内就会毁于一旦。这就是你的用武之地，普里马科夫。\"\n\n普里马科夫皱起了眉头，“我真的看不出来我如何能保护你和你的团队不受攻击。肯定有我没有理解的地方。”\n\n维诺格拉多夫只是微笑着。\n\n\"很简单。你必须拉上窗帘，以此分散公众的注意力，同时我们推动目标中更具争议性的方面。\"\n\n总统站起身来，叹了口气，并调整了他的西装扣子。\n\n\"一个分散注意力的手段？你有什么想法？\"\n\n\"嗯，为什么不点燃一场小小的战争呢？或者至少，让我们的媒体关注这种类型的事情？\""
 ARPP.6.a:0 "你这想法可以。"
 ARPP.7.t:0 "一个糟糕的农工党"
 ARPP.7.desc:0 "谢尔盖已经被手铐锁在办公桌上坐了好一会儿。此时，他几乎可以确定逮捕他的人并不是真正的警察，他可以听到自己的狗马克斯在建筑物的另一端嚎叫。混蛋们在他早晨散步的时候抓住了他。他希望他最好的朋友能够得到一些尊严和尊重。\n\n突然，两个人走进房间，他们熨烫整齐的西装上闪烁着全俄爱国党徽章。当他们关上门并锁紧时，谢尔盖开始对发生的事情有一些想法。\n\n“我猜你能够认出我们是谁，以及我们为谁工作，谢尔盖，”两人中的年长者嘲笑道。他的口气中充满了廉价伏特加和香肠的臭味。\n\n谢尔盖使劲地摇晃着手铐。“我想你可以这么说。你这些跟班们想要什么？这一切的意义何在？”他拼命试图不表现出来，但谢尔盖已经听说过全俄爱国党中那些粗俗的成员。他担心会受到殴打，或者更糟。\n\n“我们只需要你的合作，谢尔盖。”那个暴徒将一个文件丢在谢尔盖面前的桌子上。“去看看吧。”\n\n里面是谢尔盖做出猥亵行为的照片：招妓、购买毒品、虐待他的狗。但谢尔盖从未做过这样的事情。他爱他的妻子和他的狗，并且自青少年时期以来就没有碰过任何非法物品。他慢慢意识到了一些事情。\n\n“我感觉我们都明白了，谢尔盖，但让我给你详细说明一下。你在即将到来的法案上投我们一票，我们将把这些照片保密，好吗？”他冲谢尔盖眨了眨眼，嘴角挂着一丝沾满烟草的笑容。他的朋友在钥匙链上摆弄着，解开了谢尔盖的手铐。“现在呢？你可以走了。”\n\n谢尔盖摸索着站了起来，一直凝视着他的老朋友。“但...天哪，为什么是我？！”\n\n“这不是针对个人的，我的朋友。”"
 ARPP.7.a:0 "“这只是生意而已。”"
 ARPP.8.t:0 "撬开嘴"
 ARPP.8.desc:0 "当德米特里在享用沙拉时，他注视着全俄爱国党的党副主席坐在桌子的对面。“听着，就在你和我之间，伊万，我并不是特别忠诚。但我们一直做得不错，知道吗？没必要逆流而上，费力不讨好。”\n\n伊万谨慎地选择着措辞。他不能把友善的舒克申逼得太紧，至少现在还不行。“看，没有人可以否认你们在农工党那边做了很多好事，那是肯定的。但你真的想让事情永远保持这样吗？俄罗斯总是可以变得更好。更强大。昂首挺胸。”\n\n“说实话？是的。现在的情况挺好的，伊万，我不明白你们为什么这么激动。更不用说，我对你们那些寡头有些保留意见。”\n\n伊万打断了他。“最后一次，他们不是我们的核心。我们和你一样，是政治家。支持我们的人出于自愿，我们没有理由拒绝他们的大力支持。”\n\n“只是……”德米特里叹了口气。“我现在既没有精力也没有信念来争论这个问题，伊万。拜托，我们吃饭吧。”\n\n午餐过程中，他们相对安静地吃完了。伊万站起身，手里拿着一个信封，将其安全地放入德米特里的外套口袋。“带着它。回家后再打开。”\n\n“这是什么？”德米特里检查着那个不起眼的包裹。\n\n“一些可能改变你想法的东西。”\n\n那天下午，德米特里带着额外的3000卢布回到了家，同时也暗示着更多的会按时到来……如果他做出他们期望他做的事。"
 ARPP.8.a:0 "面包师的面团。"
 ARPP.8_tt:0 "§Y改变普通人生活的钱对国家来说只是微不足道的。§!"
 ARPP.9.t:0 "革新与守旧"
 ARPP.9.desc:0 "通常，党的会议是展示个人最佳一面的场所。党员和代表们会穿上最好的衣服，佩戴上最好的手表，以期给别人留下深刻印象。今晚就是其中之一，晚上从一个租下的当地酒店开始。人群中只有一个人显得格格不入，而且原因很糟糕。\n\n瓦西里·克洛波夫穿着一件满是污垢的风衣，最明显的是他左眼青了。他没有在酒店大堂和任何人说话，径直走向酒吧为自己点了一杯饮料。他的目光茫然地朝前看，没有真正专注于任何事情，陷入了自己关于之前发生的事情的思考中。\n\n他的同事、全俄爱国党代表团的蒂莫费·马卡罗维奇坐在他旁边。与瓦西里不同，他完美地融入了人群，穿着一套从海外进口的全新西装。“瓦西里，”他打招呼道。\n\n瓦西里用一种专注的眼神瞥了一眼旁边，然后继续喝酒。“真荒谬。我和你们所有人一样，对全俄爱国党代表团都非常忠诚，但当我想要帮助的时候，却得到这样的回报。”他指了指自己的眼睛。\n\n蒂莫费叹了口气，“有时候，朋友，你只需要遵循党的路线。有等级制度是有原因的，你知道的，一旦你越界了，就会引发这样的反应。如果你想看到自己的想法实现，你只需要放下它，通过适当的方式晋升到更高的职位。”\n\n“那我们是什么呢？一群大男人，发号施令，根本不想听别人如何做得更好？”瓦西里咕哝道。“你知道因为这些自命不凡的领导者而失去了多少潜力吗？我相信有一个古老的俄罗斯词来形容这样的人。”他喝完酒，将杯子放回吧台，转身准备离开。“贵族们。”"
 ARPP.9.a:0 "古老的俄罗斯原则，涂上一层新漆。"
 ARPP.10.t:0 "旋转门"
 ARPP.10.desc:0 "艾瓦尔走过西比尔公司办公大楼的大理石走廊，鞋子嘎吱作响。这里的景象与这个寡头堡垒内发生和即将发生的邪恶行为极度矛盾。今天，他被召见与几位高级主管进行私下会议。然而，他并不是一名建筑师或技术人员。他是这两者的血淋淋结合体，他只从事一种业务：杀人。\n\n他并不总是从事谋杀的生意，而且肯定不是他喜欢的事情，但金钱的诱惑是他无法忽视的。每一份合同都意味着又可以有一个月的饭食。这就是他对自己生活方式的辩解。毕竟，他对生活的一个领悟是：要么杀人，要么被杀。\n\n他转过一个拐角，来到一扇漆黑的钢门前。门的一侧有一个小插槽，上面写着“请插入门禁卡”。艾瓦尔拿出一张薄薄的塑料矩形卡片，这是当他第一次接受合同时给予他的，然后将它插入插槽。他面前的门滑开了。\n\n坐在桌子远端的一个男人首先开口说道：“啊，艾瓦尔，你好。我希望你今天心情很好，我的朋友，因为今天我们将为我们的国家制定一个新的、更好的道路。”\n\n艾瓦尔迅速环顾四周，看到了一些地点和车辆的照片和图表。但他立刻认出了那辆豪华轿车，以及坐在里面的尊贵乘客。\n\n普里马科夫总统。\n\n“先生，您计划的是我所想的吗？”\n\n那人皱了皱眉头，坐得更挺了一些。“很明显，我们心爱的总统对俄罗斯和她的人民来说…已经变得太麻烦了。我们把你带到这里是为了清除我们道路上的障碍。”\n\n他要杀害总统。多年来，艾瓦尔做过许多事情，但他拒绝参与其中。“先生，我拒绝参与这件事。你得找别人-”\n\n这个人在桌子上打开了一个公文包，里面装满了艾瓦尔以前从未见过的卢布。\n\n他叹了口气，问道：“我们什么时候开始？”\n\n这个人微笑着，向附近的一个白板示意。\n\n“明天。”\n\n“哦，还能问问你叫什么名字吗？”"
 ARPP.10.a:0 "“你可以叫我维诺格拉多夫。”"
 ARPP.11.t:0 "致死都是推销员"
 ARPP.11.desc:0 "叶夫根尼·普里马科夫费力地从床上爬起来，走进浴室穿衣服。当他整理领带时，听到厨房传来一阵小小的骚动声。他恼怒地咕哝着，带着松垮的领带走到厨房。助手伊琳娜惊恐地喊道：“普里马科夫先生！对不起，我不是故意吵醒您的。” 普里马科夫明显不悦，厉声说道：“这是什么声音？这里是一座别墅，不是工厂，你最好知道这一点，否则我会找另一个女仆。”\n\n伊琳娜的脸比雪还要苍白，“是的，普里马科夫先生。再一次，我道歉，只是有人给您送了一份礼物。”伊琳娜低头看着地板，喃喃地说。\n\n他感到担忧和好奇，便从她手中抢过盒子打开。他惊讶地看到里面只有一张简单的纸条。恼怒之下，他戴上眼镜开始阅读。在大盒子里，有一条简短的留言：“再见，叶夫根尼。”\n\n突然充满恐惧，他朝伊琳娜大喊，希望相信这张纸条只是一个残酷的玩笑，但她只是哭着逃走。普里马科夫冲回卧室，打开保险箱，抓起所有能找到的卢布，塞进公文包里。当他打开门冲下楼梯时，被一名持枪歹徒迎头猛撞。普里马科夫尖声尖叫，但他的呼救声被袭击者手中枪柄重重地砸在他头上而戛然而止。\n\n普里马科夫醒来时，听到那个无名男子说：“他们让我们怎么做来着？制造一个自杀案？”另一个人手里拿着一瓶香槟踉踉跄跄地走进房间。“我觉得他们不在乎，兄弟，直接杀了他。噢，看，这只猪醒了。”那人用枪管有节奏地戳着普里马科夫的头，嘲弄他。“为什么！我做错了什么！？我给了那些高管他们想要的一切，请！你们想要什么？我，我有钱！我有——”持枪者微笑着，用手枪一击打断了普里马科夫的鼻子。“你他妈的闭嘴，让这事对我们俩都简单点。”普里马科夫继续嚎叫，他的话对持枪者来说无法理解，他扳下手枪的击锤，嚎叫声被一声枪响打断，回荡在空荡荡的房屋中。"
 ARPP.11.a:0 "“天哪，那头猪话真多。”"
 ARPP.12.t:0 "合理的推诿"
 ARPP.12.desc:0 "\"萨文先生！萨文先生！\"一只手从满满的新闻人士中伸出。\"我们的观众要求知道您与已故总统普里马科夫的关系本质。您与其他最有影响力的公司领导人在我们总统去世前几天开了一次会议，这是真的吗？\"\n\nCEO在讲台上笑了笑，\"这是在暗示我们与此有关吗？普里马科夫总统确实是我们的亲密伙伴。为什么不呢？我们对未来有着共同的愿景：一个稳定繁荣的俄罗斯，一个商业可以蓬勃发展、你们每个人可以回到一个充满食物的温馨家庭的俄罗斯。他做得很好，我们都为他和我们共同建设的俄罗斯感到骄傲。至于那次会议，是的，我们确实开了一次会。我们每隔几个月组织一次会议，了解我们的投资方向，讨论公司之间的项目机会和其他业务事项，仅此而已。普里马科夫是我亲爱的朋友，我对你的暗示感到愤怒。\"\n\n人群中又有一只手举起来，\"安纳托利·伊万诺维奇·萨文先生，您难道不认为这次会议在总统惨死之前如此短暂，而经过几个月的政策制定，专家们称这些政策对您的业务产生了负面影响，这不让人怀疑吗？\"\n\n\"每当一项法案不符合我们的利益，我们不会对其发动报复战。我们首先是商人。如果环境变了，我们会适应并蓬勃发展。如果你在寻找普里马科夫总统悲惨而野蛮的死因，那就看看那些行进在红星下的极左翼极端分子和恐怖分子吧。你应该质问那些从联邦初期就给你灌输社会主义宣传，试图颠覆波克雷什金、舒克申和普里马科夫总统的遗产的人。那些为自由市场的消亡而进行犯罪和不道德行为的人。\""
 ARPP.12.a:0 "暴风雨正在逼近。"
 ARPP.13.t:0 "要民主，不要寡头！"
 ARPP.13.desc:0 "上校安德烈·格里戈列夫从未想过会发生这种情况，尤其是在杜马里。自从在坎斯克进行的行动以来，他忠诚地服役了二十多年。那时他还是一名中尉，战后与德国人交战后他晋升为上校。一切都看起来很好。他们应该为爱国者投票，对吧？为了俄罗斯的发展，为了一切的进步，为了让企业带来财富并为伟大的国家注入力量。然后俄罗斯总统就像狗一样被杀死在自己的家里。\n\n现在，游行队伍在首都中向杜马进发，人群的低沉吼声响彻耳际。安德烈的无线电发出嗡嗡声。他想知道，如果一切能如此迅速地堕落为暴民的暴力和谋杀，那这一切又有什么意义呢？\n\n他上级的声音在无线电中回响。“格里戈列夫上校，我们不想在门外开火，将让他们进来。如果他们威胁到杜马的安全，你有命令开火。”\n\n“明白。各位，做好准备！”安德烈大喊道。他的声音没有他应有的力量，他们的回应也是柔软、不稳定、不确定。\n\n呐喊声渗透进内部大厅。安德烈开始听到它们时，他感到颤抖。“要民主，不要寡头！要民主，不要寡头！”人群咆哮着。声音比他们预期的要大得多。新闻报道了一次小规模的抗议活动。这不是他妈的小规模。人群很庞大，足以填满眼前的街道。该死，即使他们开火，他不确定他们是否有足够的弹药来驱散他们。\n\n令安德烈惊讶的是，瓦西里·舒克申站在人群的前方，对着扩音器大声喊道。“我们不会接受这场闹剧！他们杀死了普里马科夫，他们自己人，现在他们也想将我们束缚起来！我们说什么？！”\n\n“绝不！”人群回应道。当第一批人群进入大楼时，舒克申紧随其后，是时候做出选择了。他们可以开枪镇压这次叛乱，履行对国家的责任，或者他们可以加入群众，履行对人民的责任。"
 ARPP.13.a:0 "“准备向暴民开火，伙计们！我们不会让杜马垮台！”"
 ARPP.13.b:0 "“我不会这样做，我们不会向俄罗斯百姓开火！”"
 ARPP.14.t:0 "希望之末"
 ARPP.14.desc:0 "大厅里的喊叫声越来越大，他们的叫喊在安德烈的脑海中回响。他知道自己的任务。他必须保护杜马。这些人是他的同胞，站在联邦最珍视的人身边。人民已经选择了改变，他们投票支持全俄爱国党，他将捍卫法治。当他看到一个抗议者离士兵越来越近时，他大声下令。\n\n\"开火！\"他的呼喊声在大厅里回荡，很可能能在杜马议会大厅内听到。而他的士兵们，像所有优秀的军人一样，遵循他们的命令。他们把武器指向抗议者，并开火。子弹像浪潮一样飞进人群，轻易地穿透第一排。大多数人被击中身体，子弹穿过人群时溅出血液和碎肉。有些人被击中头部，头骨破碎，空气中弥漫着灰色物质和碎骨片。士兵们继续开火，没有特定目标，只是对着逼近他们的浪潮射击，将杜马大厅的石头染成红色。\n\n恐慌笼罩着后方的人群，他们迅速向后退，试图逃离这场枪击。数百人在逃离子弹的踩踏中被踩死，那些或许还能幸存的人躺在地上，被践踏得面目全非。子弹击中墙壁弹开，飞向各个方向，其中一颗子弹击中士兵的肩膀，他的惨叫与伤者的呻吟混杂在一起，所有人都发出绝望的嚎叫，希望能得到一些拯救。\n\n几分钟后，射击停止了。大厅里，从杜马的大厅到下面的台阶，是一片屠杀而非战场的景象。一眼望去，至少有五十人死亡，数百人受伤。安德烈目睹了这一切，他惊骇地愣住了，但最让他心底颤抖的是大厅中央的那具尸体。瓦西里·舒克申，前联邦总统，用空洞的眼神望着他，他的脖子被割开，喉咙中弹，全身沾满了自己的鲜血。安德烈履行了他的职责，保护了杜马。"
 ARPP.14.a:0 "演员离开了舞台。"
 ARPP.15.t:0 "人民的胜利"
 ARPP.15.desc:0 "大厅里的喧嚣声越来越大，他们的喊叫声在安德烈的脑海中回荡。他知道自己的任务。他必须保护杜马。但这些人是他的同胞，他们站在联邦最受珍爱的人身边。思绪飞速流转之间，他看到一名抗议者危险地靠近一名士兵，后者吓得抬起武器。\n\n\"停下！放下武器！放下武器！\"格里戈列夫上校从士兵们的身后喊道。他的话像是释放了大厅中紧张气氛的压力，一种奇怪的沉默笼罩着他们。士兵们本来是要保护杜马的，但此刻他们放下了枪支，示威者也安静下来。俄罗斯人相互注视着，彼此心领神会。此刻，他们都渴望恢复曾经在全俄爱国党实施之前所拥有的安全感。他们希望看到舒克申重返。\n\n上校朝着房间的另一边看去，目光落在这些年来他已经熟悉得无需再熟悉的前总统脸上。上校并不满足于只让抗议者通过，他知道他的部下也不会满足。他深吸一口气，大喊道：\"民主！\"\n\n人群中回荡着上校的呼喊声。士兵们也加入了喊声。新的力量流动在抗议者中间。在人群中，选择走上街头的小小恐惧仿佛消失殆尽。他们怀抱着一种坚定的决心，相信他们现在有机会重塑联邦。\n\n上校转向通往杜马会议厅的大门，他猛地推开大门。抗议者涌入，舒克申被前杜马警卫保护在中央位置。吃惊的杜马议员们纷纷站起，上校带着舒克申走向俯瞰会议厅的讲台。他推开正在发言的全俄爱国党成员，将他震惊的脸推到一边，让他的手下将他带走。\n\n现在可以发言了，舒克申走上讲台，深吸一口气。"
 ARPP.15.a:0 "要民主，不要寡头！"
 ARPP.16.t:0 "最后的祝酒"
 ARPP.16.desc:0 "西伯利亚的寒风刺骨。尽管穿着厚重的外套，亚历山大·波克雷什金仍然感到寒意从厚重的皮革和毛皮中侵袭，冰冷的利爪划过他的皮肤。即使不是如此寒冷，他也知道他会发抖。波克雷什金脚下是一块石头，放在一堆土的前面，下面躺着前俄罗斯联邦总统瓦西里·舒克申，他最亲密的朋友。\n\n他的手指紧紧地扭在瓶子上，几乎已经空空如也，只剩下最后一口酒。这是他和舒克申多年前共享的瓶子，当时俄罗斯终于在他们伟大的联邦下统一起来。舒克申并不知道，他把这个瓶子保留下来，作为他们共同奋斗的象征，为了给俄罗斯带来和平。然而，一切都如此迅速地崩溃了。\n\n舒克申不应该死去。如果那该死的上校能保持冷静，也许情况会平息下来。舒克申一直在说关于这些巨型企业的事情。他们先是赶走了波克雷什金，然后杀死了他的继任者，最后又谋杀了联邦最受人爱戴的人，将他的梦想粉碎成尘埃。他在为保护他花了很长时间才建立起来的民主而死去。\n\n\"对不起，瓦西里，\"亚历山大终于对他面前的坟墓说道。\"我应该更加努力。如果我有更坚强的品格，如果我们更强大，你就不会......\"他的声音打断了。内疚充满了波克雷什金，他的心被折磨着。他在很多事情上都和舒克申意见不合，甚至曾经梦想能够掌握他的权力，但他从未想过自己会站在他的坟前。他们的联邦变成了什么？\n\n答案是西罗维基。很明显，他们已经渗透到俄罗斯社会的方方面面，并把瓦西里和亚历山大当作傻瓜玩弄。“我不会忍受的，”波克雷什金宣称，他的眼睛直勾勾地盯着深深铭刻在石头上的他倒下战友的名字。 “我不会罢休，直到他们为你付出代价。你会得到报复的，我最亲爱的朋友。”他小心地取下瓶子的盖子，把剩下的酒倒在下面的雪地上。"
 ARPP.16.a:0 "暮色降临，寒风席卷西伯利亚。"
 ARPP.17.t:0 "第二次机会"
 ARPP.17.desc:0 "杜马大厦里的总统办公桌自上次舒克申多年前见到它以来一点都没有改变。也许它有一些磨损，就像他一样，但它仍然位于同一个俯瞰鄂毕河的办公室，被夕阳照亮着。他被宣布为临时总统还不过几天，这个国家还在震荡之中。也许这就是吸引他回到联邦的首都的原因。在莫斯科发生的一切之后，他需要回味一下家的味道。\n\n莫斯科、普里马科夫和祖巴科夫，全俄军队冲击杜马的景象，这一切都让他恶心。联邦，他的联邦，差点滑入他冒一切风险夺回来的企业之手。输给普里马科夫是他最大的失败，毫无疑问。他辜负了自己的联合，辜负了自己的国家，辜负了自己的人民，辜负了自己。波克雷什金虽然有他的缺点，但他所做的一切都是出于自己认为最好的考虑。企业只是一种工具，并不是以牺牲周围所有人为代价的薪水。最后，他对他们的每一个要求的顺从都没有起到任何作用。他被换下来，变得跟他卖给主人的人们一样可以牺牲。\n\n舒克申在抽屉里翻找，找到了他第一稿的《环境保护法案》，几乎保存得完好无损。这只是他遗留下来的又一个破碎的遗产。现在无法说祖巴科夫能走多远，但有一件事是清楚的：随着舒克申的总统任期结束，俄罗斯梦也随之破灭。\n\n舒克申望着鄂毕河。它的水已经再次被污垢和废物弄浑了。不再如此。普里马科夫对他的家园的亵渎永远不能再次发生。无论付出何种代价，他都不会允许。军队会确保像祖巴科夫这样的人再也无法获得杜马席位，更别说总统职位了。在他们目睹普里马科夫总统的统治之后，人们绝不会再允许这种情况再次发生。不，这一次会不同。这是必须的。\n\n舒克申曾以为他将因为新的执政授权而倍感振奋，满怀决心来纠正普里马科夫犯下的错误。但他现在明白这是多么愚蠢的想法。在他凝视着鄂毕河倒映出的阳光时，他心中已经没有了意志、愤怒、怨恨或复仇。"
 ARPP.17.a:0 "剩下的只有空虚。"
 ARPP.18.t:0 "完美的独裁"
 ARPP.18.desc:0 "叶夫根尼·普里马科夫独自坐在他豪华红木办公桌前，低着头揉着太阳穴。这场派对和其他与大型企业头目们的派对一样：令人筋疲力尽。又是一个日子，又是一场权衡，维持一个既能赋予企业无前例的增长，又能将其控制在恰到好处以防止自身毁灭的系统。那些居住在金钱和枪炮之堡垒中的人们，他们并不了解这个经济所需的——不，这个国家所需的是什么。\n\n只有叶夫根尼·普里马科夫和他最亲近的顾问们真正理解这个庞大的机器的范围，媒体联系人，精心构建的壳公司，以及敲诈和贿赂。\n\n普里马科夫伸手拿起进口琴酒和一支土耳其雪茄。他颤抖着吸了一口雪茄，然后喝下一口烈酒，让口中的味道交融成烟雾和火焰的拥抱。\n\n只有叶夫根尼·普里马科夫理解这个机器，只有他能够掌控它。如果他死了会发生什么？崩溃？无政府状态？再次德国入侵？这使他压力山大。他拥有世界上所有的权力，但在他头上悬挂着一个巨大的达摩克利斯之剑。悬挂在他头顶的金属由一个复杂的鲁滨逊机器人支撑着，一个普通人无法理解，只有一个个体可以。\n\n普里马科夫凝视着他办公室天花板上一个凹陷处镶嵌的苍白光芒。但愿它的光芒能将他带往接近天堂的地方。然而这里没有天堂。\n\n俄罗斯，如此接近进步，如此遥远于上帝。"
 ARPP.18.a:0 "华丽的纸牌屋。"
 ARPP.19.t:0 "调节开关"
 ARPP.19.desc:0 "亚历山大·波波夫用那只沾满污垢、戴着戒指的手搓了搓自己的秃顶。一块灰烬从他的巨大雪茄上掉落，在别住在他臭汗斑斑的衬衫上别了一下，然后在廉价的面料上闷熄了。\"听我说说这个事情，\"这位肥胖的编辑说道：\"你是在告诉我，我们的总统叶夫根尼·普里马科夫在那个无政府状态时期与一群杀人狂有关联？\"\n\n\"不只是一般的杀人狂，先生，\"苏尔玛·巴德玛耶娃回答道。她是布里亚特族的后裔，一个看起来似乎更愿意躲在角落里，而不是在餐馆里点杯咖啡的腼腆年轻女人。这种看似脆弱的形象在亚历山大的小报上，作为一名新晋记者，给她带来了好处。\"而是奥木斯克的黑色联盟！我找到了他们的一位前领导，尤里·德罗兹多夫将军。显然，普里马科夫的参与相当重要。\"\n\n\"我明白了。\"波波夫抽了一口雪茄，他抽着抽着，生命的最后日子一天天流逝，他的肝斑皱了起来。\"除了德罗兹多夫的回忆，你还有其他证据吗？\"\n\n她咬紧牙关。\"大多数联盟的记录都在奥木斯克陷落时被销毁了。他们曾经有一个计划要夺回西伯利亚，整个行动都有详细布置-\"波波夫清了清嗓子：\"对不起。重要的是，他们不想让他们的人员一个一个被消灭。工资、晋升、奖励，一切都不复存在了。\"\n\n\"那我们什么都没有了。\"\n\n\"我们有一个线索。如果您允许，我可以从办公室找几个人，再问一些问题——\"\n\n亚历山大重重地拍了一下桌子：\"听着！你是在谈论指控一位现任总统……什么，谋杀？战争罪行？如果我们指责他，整个联邦的眼睛都会盯着我们。我们会被起诉，我们必须在法庭上证明我们的指控。我不能这样树敌。可以他妈的讲故事吗。\""
 ARPP.19.a:0 "“污秽又回到黑暗中。”"
 ARPP_News.1.t:0 "[Get_newspaper_header]总统叶夫根尼·普里马科夫被杀"
 ARPP_News.1.desc:0 "今早，俄罗斯联邦总统叶夫根尼·普里马科夫被发现死于他的别墅。他的死因被官方认定为恐怖袭击，然而很少有观察人士相信这些报告是真实的。许多人表示普里马科夫的死是联邦的巨企所为，他曾与这些巨企密切合作，最近对他的政府表达了不满。\n\n消息传到杜马门口后，曾在凤凰控股集团工作的前情报官员尤里·祖巴科夫以压倒性票数被任命为临时总统。由所有反对祖巴科夫就职的广泛联盟领导，全国范围内的抗议活动已经开始。当整个国家屏息以待时，只有时间能揭示俄罗斯的未来。"
 ARPP_News.1.a:0 "我们获得自由的最后机会"
 ARPP_News.1.b:0 "俄罗斯的民主处在悬崖边上。"
 ARPP_News.1.c:0 "他们的至暗时刻。"
 ARPP_News.1.d:0 "又一场革命？"
 ARPP_News.1.e:0 "动荡中的民主。"
 ARPP_News.2.t:0 "[Get_newspaper_header]前总统瓦西里·舒克申在骚乱中死亡！"
 ARPP_News.2.desc:0 "今晚，在莫斯科杜马议会发生的抗议活动，或者说骚乱，演变成了一场悲剧。据称，抗议者反对寡头统治俄罗斯，并在进入杜马议会大厦时遭到枪击。其中一名抗议者瓦西里·舒克申在混乱中不幸丧生。\n\n虽然全国上下都为俄罗斯的现代英雄哀悼，但临时总统尤里·祖巴科夫在一次电视新闻发布会上回应道：“在法律和全俄军队面前，人人平等。在一个正常运作的民主国家，骚乱和起义是不能容忍的，即使参与骚乱的人是英雄。”\n\n随着俄罗斯陷入政治动荡，专家们担心这个新生的民主国家将再次崩溃为威权主义的企业统治。"
 ARPP_News.2.a:0 "一场不必要的悲剧"
 ARPP_News.2.b:0 "民主的光芒消退了。"
 ARPP_News.2.c:0 "愚者的混乱。"
 ARPP_News.2.d:0 "俄罗斯再次陷入混乱。"
 ARPP_News.2.e:0 "骚乱和起义，嗯？"
 ARPP_News.3.t:0 "[Get_newspaper_header]全俄军队复职舒克申总统"
 ARPP_News.3.desc:0 "在叶夫根尼·普里马科夫总统遇刺后，笼罩俄罗斯联邦的混乱局面似乎在今天结束了。全俄军队拒绝了临时总统尤里·祖巴科夫下令对杜马的抗议者开火的命令。祖巴科夫是在他的政党全俄爱国党的意愿下上台的，该党据其反对派称是受到联邦经济霸主巨型企业的操控。\n\n此事件中，前总统瓦西里·舒克申领导了对新政府的抗议。与祖巴科夫的命令相悖的反对军官们背弃了命令，团结在舒克申周围，并迅速恢复其作为代总统的地位。俄罗斯似乎再次成功摆脱了它曾为之奋斗过的巨企控制。"
 ARPP_News.3.a:0 "俄罗斯梦傲然屹立……对吧？"
 ARPP_News.3.b:0 "俄罗斯的民主完整性摇摆不定。"
 ARPP_News.3.c:0 "真是一团糟！"
 ARPP_News.3.d:0 "军队和政治，没有更好的组合了。"
 ARPP_News.3.e:0 "人民总统的回归"
