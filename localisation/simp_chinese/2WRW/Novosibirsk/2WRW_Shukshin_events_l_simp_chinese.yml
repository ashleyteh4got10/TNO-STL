 RAPP.3.a:0 "因为没有什么能比多愁善感更快地停滞和扼杀生意了。"
 RAPP.4.t:0 "改变心意"
 RAPP.4.desc:0 "在新西伯利亚的一家小酒吧，以霓虹品红色调照亮，吸引年轻人，变为了当地新西伯利亚大学（俗称U of N）学生的电台。或许听起来有些奇怪，但就像《花花公子》杂志有令人惊讶的引人入胜的采访一样，这家当地电台因在城市中播放来自世界各地的多样化音乐，并偶尔邀请俄罗斯境内一些名人进行访谈而在该市有一定的知名度，这远超过了一所学校电台的范畴。U of N最新的主持人不是别人，正是前总统亚历山大·波克雷什金。在整个酒吧里，通常喧嚣热闹的氛围被良好地控制住，安静地聆听着学生们和这位前强人的对话。\n\n“波克雷什金先生，”一位年轻女子透过收音机发出沙哑的声音说道，“尽管在选举期间您一直坚定地说您在大动乱时代团结了俄罗斯，但您的总统任期受到了很多批评。您是否仍然相信您当时的话？是西罗维基和您与他们的合作使俄罗斯重新团结起来的原因吗？”\n\n片刻的寂静被一位年长男子的哼声打破，然后他更清晰地回答道：“的确，在我们在新西伯利亚经营的资本主义政府中，得益于西罗维基的支持，我们能够为我们的人民带来投资和现代化，我坚持这一点。” 酒保叹了口气，然后波克雷什金扭曲的声音再次传来：“但是，资本主义民主与资本主义寡头政治是有区别的。资本主义是好的，但当它阻止民主，当它停止对其自身过度行为的制约时，问题就会产生。”\n\n“那么，”女子再次发言，“您听起来很像舒克申总统，您是否认同他？您会加入农工党吗？”\n\n波克雷什金笑道：“不，我不会加入农工党。但我确实认为舒克申提出了一些被证明是正确的好论点。但是，我要警告大家，虽然民主很好，但我们不能支持共产主义，甚至不能支持这种‘民主社会主义’。这将破坏我们的经济，并扼杀就业机会。任何形式的社会主义都会让我们走向毁灭，伴随着不受约束的权力。”"
 RAPP.4.a:0 "“改革，而不是革命，才是关键。”"
 RAPP.5.t:0 "机遇之地"
 RAPP.5.desc:0 "叶夫根尼的妻子拉里萨只穿着一件睡袍站在他书房的门口。“亲爱的，这么晚了。你写了几个小时了。来睡觉吧，明天早上再继续。”\n\n叶夫根尼迷迷糊糊地抬起头，透过疲惫的眼睛看了看钟。已经是凌晨一点半了，她当然是对的！但他还有很多工作要做。他离完成计划只差一步之遥，这个计划将使他摆脱在码头的工作。他和亲密的朋友维塔利已经存了足够的钱来开始一家新生意。这是一家进出口公司，但他们仍然需要解决一些细节——\n\n“叶夫根尼，你在听我说吗？明天你还得工作，现在的睡眠时间已经不多了。”她双臂交叉等待他的回应。\n\n“对不起亲爱的，”他嘟囔着。“我就快完成了。让我写完这个最后的草稿吧。”尽管他看着妻子，但他的眼皮却因为疲惫而沉重。拉里萨叹了口气，带着爱意，脸上露出微笑。她点了点头，离开了书房。\n\n回到工作中，叶夫根尼开始着手最后的计划草稿。他打算经营美国的服装和珠宝，以及俄罗斯的电子零件。公司将在马加丹、符拉迪沃斯托克、洛杉矶和旧金山的港口运营。总部将设在离符拉迪沃斯托克码头仅几个街区的一栋建筑中。维塔利已经与房东谈过了，他给出了一个合理的价格。现在，他们所要做的就是从银行获得贷款并提供抵押品。\n\n叶夫根尼将笔小心地放在完成的公司大纲旁边，然后看着昨天的报纸。头条写着“美国从俄罗斯进口创历史新高”。他的胸膛充满了希望。二十年前，没有一个俄罗斯人能够梦想到他们如今建立的国家。然而，叶夫根尼却坐在这里，准备乘着俄罗斯繁荣的顺风车为自己发家致富。他已经看到了：他开着他新的美国制造的凯迪拉克，和他的妻子戴着澳大利亚开采的珠宝，开去他们新买的海边别墅……"
 RAPP.5.a:0 "而且一旦富裕，我的美德就是笑贫不笑娼。"
 RAPP.6.t:0 "依法治国"
 RAPP.6.desc:0 "“这太疯狂了，安纳托利！”一个蓬头垢面的工人大喊道，“该死的喷雾正在喷洒到我们身上，机器还冒火花。如果你不修好它，我们就会被烧死！”\n\n在车里雅宾斯克市的地下工厂中，曾经由斯大林主义国家管理的地下工厂中，一群工人站在一个高台周围，他们的神秘和睿智的主管安纳托利在上面监督着他们。这个地狱般的军工厂是为了制造最新的战争机器而建立的，其中包括使用特殊喷雾和易燃金属废料制造的坦克，而这种金属废料在远处发出刺耳的摩擦声时，可能会产生火花。\n\n安纳托利调整了一下领带和护目镜，他脸上露出沮丧的纹路。“你们都是男人吗？这是正常现象。以前你从未抱怨过，伊万。”他从扩音器中嘶哑地说道。聚集在一起的工人开始窃窃私语，而安纳托利的表情在短暂的瞬间有些软化，对于一群人可能做出的事情，他感到了一丝恐惧，回想起那些年的民粹派运动。但接着，发生了一件奇怪的事情。领导这群人的伊万拿出了一张纸条。\n\n“在我看来，安纳托利，你有两个选择。你可以让我们继续工作，然后明天，假设我们没有在事故中丧生，我们所有人都会去安全局报告这个恶臭的违规行为。说实在的，法律除了像这样的事件之外，一文不值，但是当你的老板看到工厂被罚款时，他们是不会高兴的，都是你的失误。或者，你可以让我们今天休息一天，并让某人清理空气中的灰尘。”随着机器的嘶叫声响彻四周，安纳托利的手开始因为沮丧而颤抖。“你们以为你们在跟谁说话？你以为那些罚款有什么用？你们以为他们会做出除了给我寄封愤怒的信之外的事情吗？！”他开始尖叫。“你们什么都不懂！这位新总统让你们都想了很多废话，我经营这家工厂，我管理生产多年，而你们整天坐在那里做同样的事情。我受过教育！”他的咆哮以中风的尖叫结束。\n\n然后工人们做了一件真正让主管害怕的事情。他们每人抓起一只备用手套，用金属屑填满。证据。可以在案件中使用的实际证据。颤抖着，他拿起麦克风："
 RAPP.6.a:0 "“行吧，都回家去！”"
 RAPP.7.t:0 "一个古老的故事"
 RAPP.7.desc:0 "雨点敲击窗户，舒克申坐在桌前，感到它们带来的舒适。多年来，他为解放俄罗斯、实现真正的民主而奋斗，如今他取得了胜利。巨型企业不再统治他们，受他们贿赂的腐败官员统治的时代也已经过去。人民终于能够繁荣起来，包容性民主的原则得以体现。他的思绪被昔日的对手、如今再度成为亲密盟友的亚历山大·波克雷什金打断了，波克雷什金手持一瓶伏特加走进他闷热的办公室。他兴高采烈地说道：“喝一杯吗，瓦西里？”\n\n当波克雷什金给他们每人倒了一大杯伏特加时，舒克申再次凝视着窗外的阴雨午后，漫不经心地做着一些笔记。“怎么了，瓦西里？”波克雷什金问道。舒克申清了清嗓子，放下笔看着他说：“亚历山大，你曾经想过我们能打败西罗维基吗？真正打破他们对权力的掌控？”波克雷什金发出了短暂的笑声，友好地回答道：“瓦西里，这不可能持续太久。我们曾经有过属于我们的时代。现在是年轻人接替这位老人的时候了。你对联邦的梦想已经实现，俄罗斯的公民们可以安心了。”\n\n波克雷什金认真地指着舒克申说：“这也包括你。你已经工作得快要累死了。如果今晚还有未完成的事情，你可以明天处理，不会有任何问题。”\n\n舒克申听着，但仍然心不在焉地记着纸上的东西。波克雷什金推了推舒克申，催促他喝掉几乎满满的酒杯。当舒克申终于长长地喝了一口伏特加时，波克雷什金嘀咕道：“你在写什么？又是一首诗吗？”这次轮到舒克申笑了，他略微重重地把杯子放下。\n\n“这是一部电影。 叶尔莫拉伊·沃耶沃丁搬到了莫斯科，但他渴望回到他的西伯利亚村庄。但不幸的是，他的家庭一点一点地破碎了。”空军元帅不解地挑了挑眉毛。 舒克申笑了笑，简单地说：“我不知道，我只是想写。”\n\n两人交谈之际，风暴渐渐散去。阳光穿过云层映入舒克申的视线。 舒克申见状喃喃自语，“也许你的这个美丽新世界是可能的。”"
 RAPP.7.a:0 "敬未来！"
 RAPP.8.t:0 "佐里亚"
 RAPP.8.desc:0 "舒克申打开了他桌上的文件夹，他的头开始变得晕乎乎的。文件夹里有着无数的图表、数据、报告和数字。简直有数百张纸同时在争夺他的注意力。其中一张描述了中西伯利亚的石油产量，另一张指出了贵金属的短缺，并主张将资源从军队引向一个未指定的项目。另一份报告提出了联邦和OFN之间长期合作的可能性。但最吸引他注意力的是封面：一幅简单的凤凰图案，上面写着 “佐里亚计划”。\n\n“先生们，我看不懂这些玩意儿，”舒克申总统说道。他把文件夹推给他的访客们。“请给我一份执行摘要。你们有五分钟时间。”\n\n“看，这就是我为什么这么喜欢他，”泰坦集团首席财务官阿纳托利·亚洪托夫对他干瘪的同伴说。“这个混蛋知道自己想要什么。”他回头看了看舒克申总统，门牙闪烁着推销员般的的微笑。“我们提议在贵国政府和我们最新的子公司泰坦航空之间建立公私合作关系。我们需要投资资金，而且我们认为你愿意在莫斯科地区创造就业机会，考虑到纳粹造成的损失有多大，”他停顿了一下。\n\n“我在听，”舒克申说道。“你要造些什么——客运飞机？喷气式战斗机？你是要针对国内市场，还是卖到国外？\"\n\n“以上都不是。”亚洪托夫说道，他笑得更开心了。“我们想帮助联邦启动太空计划。”\n\n惊讶像一道闪电击中了舒克申总统。“太空计划？亚洪托夫先生，我们还在重建莫斯科，更不用说我们的其他领土。我怎么可能说服参议院为这个项目提供资金？”\n\n“很简单，”他说。 “我们有来自德国和美国的数据。为面向太空的研发计划提供资金的总体GDP收益远远超过成本。”他靠在舒克申的办公桌上，他的领带悬在共和国的印章上。 “但老实说。我们正在谈论在十年内将宇航员送上月球。谁会拒绝创造历史的机会？”"
 RAPP.8.a:0 "太阳的宫殿将会开启，从它的大门放射出荣耀……"
 RAPP.9.t:0 "循此苦旅"
 RAPP.9.desc:0 "马特维·波波夫上校通过一面单向镜观看了一百多名俄罗斯飞行员的训练。在他身边，泰坦航空的马克西姆·尼基丁在一张破旧的黄纸上痴痴地写着笔记。这两人像孩子们盯着蚂蚁一样俯视着这些飞行员。然后，像所有的孩子一样，他们开始碾压这些昆虫。\n\n“给我讲讲A-8候选人的背景，”波波夫说道。“王牌战斗机飞行员。在进攻莫斯科期间击落了四架德国轰炸机，”尼基丁说。“纪律记录显示有一项不服从命令的指控，在A-8因英勇行为被授勋后被撤销。”\n\n“几乎可以肯定是因为受贿。淘汰A-8。”波波夫回答。\"D-4怎么样？\"\n\n“D-4在芬兰受伤了。他的腿还在愈合。”\n\n“没时间了，”波波夫说。“淘汰D-4。”\n\n“在我们淘汰D-4之前，我们应该考虑公关，”尼基丁说。“我们至少需要一个哈萨克人，要不然是塔吉克人，或者巴什基尔人。D-4已经光荣地服役了，而且会成为一个出色的太空任务摄影师。”\n\n波波夫哼了一声。“我们没有时间让他的伤口愈合。这是一个军事项目。向舒克申总统说一句话，你的老板就会损失几十亿。所以，”他微笑着说道，“在你再次提起公关问题之前，花点时间考虑一下。”\n\n“好的，淘汰D-4。”“我以为你会以我的方式看待它，”波波夫说。“当这些训练结束时，我希望你淘汰表现最差的40%的人。”\n\n“全部的40%？”“剩下的。”“上帝啊！”\n\n“我希望你相信他，”波波夫说。“我希望你相信我们能去我们要去的地方，我们会需要所有能得到的帮助。F-9刚从跑步机上下来。”\n\n“已经被淘汰了。”\n\n“给他们提供奖金，让他们从跑步机上下来。”\n\n“不好意思？” 尼基丁问道。\n\n“给前五名离开跑步机的人提供一万块。尼基丁先生，这个项目是你我一生中做的最大、最重要的事情。也许比莫斯科还要重要。佐里亚计划需要的是能把眼光放得比钱包更远的人。”\n\n“比莫斯科更重要？你不会是认真的吧，波波夫将军。”\n\n“我是认真的。”波波夫说道。“莫斯科是我们遗产的象征。莫斯科是过去。这个项目将定义每一代俄罗斯人，从现在开始直到时间的尽头。”"
 RAPP.9.a:0 "“如果你敢把这句话写进新闻稿，我就踢你的屁股。”"
 RAPP.10.t:0 "雕琢巨人"
 RAPP.10.desc:0 "就像所有建筑一样，它始于一个地基。几十个人花了几十天时间在选定的地点挖了一条大沟。就这样，孕育着俄罗斯智慧结晶的子宫出现了。一块巨大的混凝土板被浇筑起来，并为其遮风挡雨，就像任何父亲为其唯一的女儿遮风挡雨一样。在这个月的第七天的午夜，当混凝土晾干时，一个孤独的灵魂悄悄地走进了这个安全状况不佳的建筑工地。弗莱德里克·米勒，韦利米尔大帝的最后一个子孙，向佩伦祈祷，并将他的断指压入干燥的混凝土中。为了俄罗斯人民的力量，这是个值得的牺牲。\n\n然后是骨头。巨大的钢梁，从山的肉体上雕刻下来，躺在由人的工具扫过的平原上。一个月过去了，伟大的纪念碑的精神被其父辈们勾勒出来。两个月后，巨兽成形。三个月后，骨头结成了一副骨架。迈勒再次潜入发射场，在神圣的大梁上画下了自己的血祭。这次的牺牲是为了所有俄罗斯人民的希望。\n\n接下来，野兽的血管出现了。从萨马拉的工厂进口的管子，与化脓的心脏纠缠在一起。脆弱的铝制大管道，笨拙地压在一起，形成泰坦的肺。在阿穆尔州铺设的电线穿过俄罗斯的广袤土地，成为一个神经系统。到现在，政府已经在这个半生不熟的创造物周围竖起了安全围栏。缪勒挖开栅栏，进入设施，将他的气息、他的痰液和他的胆汁涂抹在赤裸裸的电气系统上。一个牺牲-这句话应该在天堂上说。\n\n最后，这栋建筑完工了。一层玻璃纤维和砖头的皮肤延伸到了野兽身上，覆盖了它受祝福的器官，造化出了正常人的外表。尤里，也就是他的工作团队所知道的弗莱德里克，静静地站在那里，看着一个东正教牧师在巴尔瑙尔航天中心外假惺惺地祈福。他那刺鼻的香火和毫无意义的话语在为完成该中心而努力工作的每一个灵魂的聚会上飘荡。但这是无用的。对佩伦来说，任何神圣的东西都不能从他那里拿走；地球不能，人类不能，人类的造物也不能。所有这些都属于他。因此，为了佩伦的荣耀，也为了许珀耳珀瑞亚的子民们的荣耀，俄罗斯将毫无阻力地进入太空。"
 RAPP.10.a:0 "在黑暗中念出的祷告，在天堂之上仍能听到。"
 RAPP.11.t:0 "军事方面"
 RAPP.11.desc:0 "明亮的阳光透过马特维·波波夫上将办公室的窗户照射进来，穿过他手中那支雪茄的浓烟。他审视着工程师们设计的新火箭推进系统的设计图纸。据说，这将把一名俄罗斯人送上太空。马特维不满地咕哝了一声，然后移动手臂将雪茄敲在烟灰缸上。强大到足以把俄罗斯人送上太空的火箭应该瞄准敌人，而不是星星。但舒克申总统下令他确保火箭的可行性，他从不违抗总统的命令。\n\n上将听到门上敲了一下。终于来了，那个设计这该死的发动机的工程师！“进来，进来！”马特维对着门大喊，并挥动着手中的雪茄，好像那样能加快打开门的过程。弗拉基米尔·科皮洛夫走了进来，一个个子矮小、胡子看起来像老鼠尾巴的家伙。“坐下，小子，坐下。”上将前倾着身子坐在桌子前，导致他胸前的勋章互相碰撞发出叮当声。“这个发动机……告诉我一下。”\n\n“嗯，长官，”弗拉基米尔坐在马特维对面，开始说道，“它类似于德国人用来送他们的人上月球的火箭。我们一直在研究他们在第二次西俄战争期间使用的火箭设计。”他从胸口口袋里拿出一支钢笔，在桌上的图表上画圈。“我们在理解他们如何储存足够数量的液态氧来产生所需的燃烧，并将火箭送入轨道以及在轨道上进行机动方面取得了重大进展。这就是这个发动机的作用。它足够强大，可以将人送入轨道，并将其带回我们需要的地方。”\n\n一枚能在轨道上改变轨迹的火箭？马特维的思绪涌现出了无尽的可能性。有了这个，俄罗斯将能够打击全球的任何地方。没有任何国家能够威胁到她的安全，因为他们都可能随时被俄罗斯的火箭击中。如果工程师对其精确性的评论是准确的，他们甚至可以不用派遣人员进入目标国家就能打击军事目标。也许舒克申总统在这个太空计划上有些眼光。\n\n"
 RAPP.11.a:0 "继续说，科皮洛夫先生。"
 RAPP.12.t:0 "通信问题"
 RAPP.12.desc:0 "\"...好，现在测试28.470兆赫。李可夫，收到请回答？\"\n\n一个被扩音器模糊了的声音通过一层层的静电扭曲着。“收到，中央，立即切换频率。”该死！拉夫罗几乎一拳砸在桌子上。航天飞船上的通讯系统出了问题。不，不仅仅是问题——尽管他们付出了所有的努力，一半的频率都无法使用，另一半几乎也是如此。而且没有人知道是设备的哪个部分出了故障-\n\n嘟嘟！他面前的控制台响了起来。一个白色的灯光闪烁，但扩音器没有回应。拉夫罗俯身靠近麦克风。“李可夫，你听得见我吗？”嘟嘟！灯光再次闪烁。回应来了，但不是正确的形式。李可夫正在接收，但拉夫罗听不到他的回答！工程师揉了揉疲惫的眼睛。“怎么回事？我今天早上刚校准过这该死的系统...”他再次按下了扩音器按钮。“李可夫，我听不到你的回答。回到之前的频率。”\n\n嘟嘟！“这是李可夫，中央……%#*^$(&%$^”\n\n拉夫罗狠狠按下了扩音器按钮。“李可夫，该死的，现在都是杂音。我放弃了。回到我们的例行程序开始的地方。我们需要一个稳定的频率。”他摆弄着调谐旋钮，自言自语地嘟囔道。“我本应该成为一个该死的火箭科学家。不会被困在这里像扎针一样调频，管理层逼得我喘不过气来...”他找到了原始频率。\n\n嘟嘟！“这是李可夫。拉夫罗，你不觉得他们会因此而解雇我们吧？”\n\n“其他人会为我们受苦的，朋友。”工程师咬紧牙关，笑了笑。“我怀疑是天线的问题。我们应该把它送回研发部，而不是不断试图打补丁。这样更容易。”\n\n在无线电的另一端，李可夫叹了口气。“我猜这只是又一堆要解释的数字。真等不及要向上级解释这个了。老实说，我已经准备好了结束这一切。”\n\n“听着，我也很沮丧。”拉夫罗眯起眼睛，深吸一口气。 “但我们已经为此付出了很多努力。我们现在不能放弃。”"
 RAPP.12.a:0 "我们现在就做出牺牲，这样未来的白痴就会安心地称我们的方式原始。"
 RAPP.13.t:0 "通过债务，我们将加速向星空迈进！"
 RAPP.13.desc:0 "“科尔托索夫，你的愤世嫉俗已经越界了。”舒克申总统品尝了一口茶，注意到担心的农工党代表在办公室里焦虑地踱步。“我们的资金从长远来看是没问题的。我们提议只是一次性支出；之后，企业将承担这个负担。”这两位政治家已经在个人辩论的僵局中困顿了一个多小时了，情况变得荒谬可笑。想想看，一个如此微不足道的请求居然已经搁浅，如此宝贵的时间被浪费，而其他工作亟待完成。舒克申的耐心在逐渐地消磨殆尽，沮丧的沙子慢慢地填满了他的杯子。瓦西里喝了一口茶，他忘记加糖了。\n\n科尔托索夫代表仍在踱步。“高加索地区的贫困统计数据令人震惊。我们难道不应该将纳税人的钱转移用于帮助我们联邦的盟友吗？这个太空计划从一开始就预算过高了。现在你却向我们伸手求助，要求更多的资金。这到底是为了什么疯狂的事情？我们统治着地球上最大的国家，拥有足够的财富，足以满足我们未来一个世纪的需要，还有足够的空间供人们定居。访问月球对普通人有什么用？”\n\n“因为我们需要将梦想变成现实，我的朋友。这是我们当选的原因，也是我们维系选民的原因。如果没有这个，我们无法进行农业改革，也无法约束企业。这将是对人民和世界的一种宣示，我们正在攀登新的高峰，结束自满情绪，重新站立起来，与任何强国平起平坐。”\n\n“还有兴致花钱在无用的科技项目上。”\n\n“我们已经决定这样做了。”\n\n科尔托索夫笑了笑。“党决定了。你决定了。而我和我代表的人没有决定。”他停止了踱步，站在门槛上。“如果我不是从我们在巴尔瑙尔蜷缩时就加入这个党派，我会走的。我的阵营里的其他人也会走。但我们已经走了太远。”他失望地摇了摇头。 “当你在做白日梦时，我会试图强迫泰坦公司对我们的小太空计划采取更加私有化的方式。但是，舒克申总统，请理解这一点。我们不会接受另一次超支。"
 RAPP.13.a:0 "梦想的天空被怀疑的乌云所遮蔽。"
 RAPP.14.t:0 "工程秘密"
 RAPP.14.desc:0 "阿梅特汗讨厌华盛顿。他坐在距离国家广场只有一个街区的咖啡馆里，对他知道的这些墙壁之外的事情感到厌恶。美国人喜欢把自己看作是地球上最文明的人民，但他们并不比其他人更好。他们的首都建得让人想起罗马共和国，这似乎很合适。美国政府几乎和古代的共和国一样腐败。身处这个破败的沼泽地的好处是，阿梅特汗可以利用这种腐败来谋取自己的利益。\n\n当一个憔悴的人影走向他时，他的目光转向了门口。根据阿梅特汗的档案，他叫柯蒂斯·里德。一个俄罗斯特工进行了最初的接触，但最终要靠阿梅特汗来达成交易。柯蒂斯穿着一套看起来匆忙穿上的西装，领带松松地系在脖子上。从他在扫视房间时调整领带的方式来看，阿梅特汗知道他是因为焦虑而松松地系着。与一个性情焦虑的人打交道并不理想。不过，金钱会说话的。阿梅特汗与这个人对视，美国人开始朝他走过来。\n\n“我想没有人跟踪我。”柯蒂斯靠近桌子后低声说道。他坐下来，双手握在膝盖间，汗水明显从他的太阳穴上流下。他说这话可能既是为了他自己，也是为了安慰阿梅特汗的。业余人士。\n\n阿梅特汗开始用甜言蜜语来哄骗这个不满的工人，“所以……德国人登月之后，NASA的资金被削减了。资金削减意味着工资减少，所以你得不到你应得的报酬。”然后，他发起了致命一击。“听着，如果你能够获取NASA火箭系统的蓝图，我可以给你的薪水加倍。现在先支付五分之一，其余部分在交付后支付。你觉得怎么样？”\n\n他看到柯蒂斯几乎立即点了点头。不足为奇，他想。根据他们的记录，他有一个妻子和三个孩子，虽然他并不贫穷，但他们一定在为过往的生活方式而苦苦挣扎。 阿梅特汗伸手抓住一个手提箱，把它从桌子上移到柯蒂斯面前。 “拿着它，”他说，“今晚8点前把设计图送到这里。不要迟到。"
 RAPP.14.a:0 "为了科学，对吧？"
 RAPP.15.t:0 "补习班"
 RAPP.15.desc:0 "“先生们，这是一个微处理器，”马格努斯·安沃德教授说道。“我从乌普萨拉大学远道而来，就是为了演示它的工作原理。”他走下讲台，穿过被乱糟糟的杂物占据的办公桌的缝隙，手里拿着一个看起来比指甲盖厚一点的墨黑色的小金属块。当他说话时，几十个俄罗斯科学家、商人和官员都目不转睛地盯着。\n\n“具体来说，这是一个四相系统Al1 8位片式芯片。1969年由李·博瑟尔设计。到1973年3月，这种芯片被纳入全美三百七十四个主要工业基地，原因很简单，它比服用类固醇的马跑得更快。到1973年11月，该设计被国防部购买，四相系统被锁定在一个永久性的独家合同中。到74年1月，芯片设计被泄露给了德国的间谍。同年5月，德国政府雇用我和其他三名瑞典人研究如何将微处理器技术纳入帝国未来的航空航天事业，包括潜在的火星任务。”\n\n他笑了笑，并与最近的警卫对视。“考虑到他们打仗打得一败涂地，我不认为他们在短时间内会登上火星。”安沃德回头看了看他的听众，被自己讲的笑话逗乐了。\n\n“据我了解，联邦目前主要通过集成电路技术来操作其计算机系统，”他说。“微处理器属于集成电路家族，就像智人属于人形家族一样。我的团队预计，将微处理器技术完全整合到你们目前的电子信息系统中，将使佐里亚计划的效率提高百分之四十到四十五。你看——啊，对了，后面的那位先生，请讲。”\n\n一个戴着角质边框眼镜的留着厚重的大胡子男人放下了他的手。“是的，这很吸引人，谢谢你。实际上，几年前我在科米共和国也做过一个类似的项目，但涉及到脑物质而不是金属电路。你看，我们假设——”\n\n“好的，谢谢你，我的朋友，在我完成演讲后，我们有足够的时间讨论过去的实验，”安沃德教授回答道。“现在，关于微处理器的结构......”"
 RAPP.15.a:0 "“不要向外行人解释计算机。向一个处女解释性要简单得多。”"
 RAPP.16.t:0 "直抵群星"
 RAPP.16.desc:0 "当马克西姆·尼基丁在几十名记者面前大摇大摆地走过时，照相机闪闪发光，话筒嗡嗡作响。在这群人的中心，是全俄中央广播集团的德米特里·莫罗佐夫——他的广播公司最近刚从西伯利亚中央广播公司更名而来。他是众所周知的保守派、民族主义者和爱国者。与莫罗佐夫相抗衡的是叶卡捷琳娜·巴拉巴诺夫，她是《莫斯科先驱报》的一名用双语写作的左翼分子。除了这两个俄罗斯人之外，还有来自各个国家的记者：《旧金山时报》的两个美国人，《朝日新闻》和《产经新闻》的代表们，英国《新闻报》的一名高级编辑，甚至还有巴西《环球报》的一名同僚。\n\n对尼基丁来说，这就是天堂。\n\n“我们新生的太空计划已经取得了极大的成功，”尼基丁说道。“我们预计，科研开发和基础设施建设的初始阶段将比计划提前两个月完成。” 在他身后，一个五十米深的水池闪耀着危险而蔚蓝的美丽。\n\n“我们的意图是通过与两个项目的前成员合作，推进德国和美国的设计。你知道吗，德国宇航服设计团队中最资深的成员投奔了我们联邦？原来他的妻子是波兰人，”他说。一群记者气冲冲地记下了每一个细节。波兰人——那是一个他们可以利用的故事。\n\n“今天，我们在测试两件事。第一，最新的宇航服模型的完整性和敏捷性。第二，团队成员在与微重力相当的条件下的表现，”他边说边把手伸进口袋，掏出一个手持式无线电。“先生们，请开始测试。”\n\n在巨大水池的远处，八个身着制服的男女潜入海水深处。每人身上系着一根缆绳，使他们不至于永远掉到人造海的底部。\n\n“我是任务负责人扎伊采夫，”无线电发出噼啪声。“我们开始潜入，时间是14:23。”\n\n当记者们靠向收音机，努力听着扎伊采夫的讲话时，尼基丁笑了。\n\n“正常进行中……一切都很好。等等，有情况，”扎伊采夫说道。\n\n“任务负责人，确认问题。”波波夫将军在无线电中匆匆说道。\n\n“长官，瓦伦蒂娜的防护服刚刚在左肩关节处发生了泄漏。她的衣服开始进水了。请求允许中止模拟。”"
 RAPP.16.a:0 "重头再来吧。"
 RAPP.17.t:0 "准时"
 RAPP.17.desc:0 "伊戈尔从口袋里拿钱时手忙脚乱，硬币撒在电话亭的地板上。他沮丧地把头靠在电话亭的玻璃墙上，给自己一个休息的片刻。他太疲惫了，几乎就要在玻璃上睡着，只被主管喊叫着让工人们几分钟后返回工作的声音唤醒。他急忙捡起地上的硬币，塞进电话亭里，拨通了家里。几秒钟后，他的妻子接起电话。\n\n“喂，这里是纳戈维辛家。迪娜在讲话。”电话连接不太好，伊戈尔不得不把听筒按在耳朵上才能听清她说的话。\n\n“迪娜，我今晚又要晚回家了。不，别说话。我没多少时间，他们已经在喊我们回去了。我知道你对我生气，我能听出来。是的，我知道你让我跟主管谈谈这个问题。但你知道这些混蛋希望按照他们的计划完成航天飞机，他们会逼死我们。我无能为力。见鬼，其中一个负责焊接航天飞机下壳的家伙差点睡着了。谢天谢地，有人在事情变糟之前把他叫醒。”\n\n伊戈尔停下来揉揉眼睛，希望能让它们在整个班次里保持睁开，这样迪娜就能说几句话了。“也许你应该抗议一下，”她建议道。“让媒体介入。我相信有人会听你们关于工作条件的声音。见鬼，如果那行不通，你不能和其他工人组织起来吗？你甚至可以给民主社会党的代表打个电话。他们也许能帮上忙。”\n\n“亲爱的……这个项目与该死的政治和‘国家威望’有关。人们根本不在乎我们被过度劳累，他们会说我们不爱国，几乎是叛徒。成立工会？没人在乎我们的想法，而且在那艘航天飞机上天之前，这都不会改变。”"
 RAPP.17.a:0 "给火箭偷工减料？那不是很危险吗？"
 RAPP.18.t:0 "加班"
 RAPP.18.desc:0 "马克西姆·尼基廷意识到项目开始变得不妙的时候，第三个工人在生产车间中直接倒地晕倒。他是来自马格尼托哥尔斯克的一名装配工人，不是很重要的人物；但他连续工作了20个小时，只有两次半小时的进餐休息，结果因为缺乏睡眠而晕倒。当现场的医护人员赶到他身边时，马克西姆意识到必须采取一些行动，并径直走进了波波夫将军的办公室。他没有敲门就进去了。\n\n马克西姆走进房间时，波波夫将军正在审阅一些文件。“尼基廷，你到底想干什么？我很忙。”\n\n“我认为我们需要缩短工时，”马克西姆说道，“又有一个人晕倒了。如果这事传出去，公关问题——”\n\n“你认为我在乎公关吗？见鬼，你认为有人在乎公关吗？”波波夫说，“尼基廷先生，一旦这艘航天飞船起飞，没人会关心整个过程。现在我不打算邀请任何记者进来，但是如果有消息走漏，又怎样？公众一个月后就会忘记。”\n\n尼基廷站在波波夫将军办公桌对面的椅子后面。他双手放在椅背上，开始用力握紧。“将军，如果你让这些优秀的人过度工作，会增加事故发生的可能性。对泰坦航天来说，这是无法接受的。你和我们一样，都需要这次发射顺利进行。我们最不希望的就是航天员丧命在我们手上。”\n\n波波夫将军站起身来。突然间，房间变得非常狭小。“你已经知道我们将在发射前对航天飞船的每个系统进行三次检查。不，我们有一个截止日期。我将会按时完成任务。如果有些人无法满足总统设定的期望，我们会找到可以胜任的人。”"
 RAPP.18.a:0 "“现在滚出我的办公室。”"
 RAPP.19.t:0 "闪光"
 RAPP.19.desc:0 "瓦西里·舒克申走进机库，他的呼吸停滞了。在他面前，一位沉睡的巨人躺着，一个白色和蓝色的野兽，将实现三代人的梦想。它巨大无比——超过一百英尺长，高如十个人，高得令人仰视时会头晕。机翼犹如雄鹰的翅膀，每一个曲线都经过精巧的设计。航天飞船的顶部鳍上鲜明地展示着联邦的旗帜，崭新的白色，深海蓝色和日落红色的大胆条纹。外壳本身明亮而完美，每一寸都比建筑物的骨骼更坚固。她是不朽的、不可阻挡的，一种他们召唤出来为了将自己的国家送上月球的精神或女神，而不是任何一种人造物。\n\n瓦西里颤抖着伸手触摸了航天飞船的机翼。“这一切都超出了我的期望，”他说。“我——我曾经梦想过，但我从未真正想过我会亲眼见到它。”他再向前迈出一步。“这是我为之奋斗的一切的总结。”\n\n舒克申喘着气微笑着，转身面对跟随在他脚步后的一群人。“波波夫将军，如果没有您的监督，这个项目不会成功。感谢您的辛勤工作。”\n\n将军行了个军礼，脸上表情严肃。“为了俄罗斯，我愿意。”\n\n安纳托利·亚洪托夫在人群中清了清嗓子。舒克申的微笑稍稍黯淡了。“是的，亚洪托夫先生，我们没有忘记泰坦对这个事业的贡献。尼基廷先生，感谢您的辛勤工作。”\n\n马克西姆·尼基廷结结巴巴地道了声谢，但被他的老板打断了。“当您准备好开始下一艘航天飞船的工作时，请给我们来电，总统先生，”亚洪托夫说。\n\n“当然，”舒克申说道。他用手沿着航天飞机的光滑、冰冷的外壳轻轻划过。“多漂亮啊。亚历山大，还有多长时间她就要计划发射了？”\n\n波克雷什金挤过人群，手持剪贴板。“只剩几天了，瓦西里。我们只需将她运送至发射场，加注燃料，然后让宇航员登船即可。”\n\n“那就是了，”舒克申说着，仰头大笑。“经历了这一切，就这样了。”"
 RAPP.19.a:0 "“我们赢了。”"
 RAPP.20.t:0 "明日之人"
 RAPP.20.desc:0 "他放学后立刻回到家里，冲到客厅里打开电视。他把背包扔在附近的沙发上，然后跳到离屏幕只有一英尺的地方。一个国家新闻播音员的标志亮起来了。\n\n他妈妈从厨房里嘟哝了些什么。“好的，妈妈！”他往后挪了一英寸，终于看到了他期待已久的景象：尤里·罗曼廷科和弗拉基米尔·捷尔诺夫，将要乘坐航天飞船进入太空的两名宇航员。格里戈里兴奋地蹦动着双腿。\n\n随后，一位名叫娜塔莉娅的女记者出现了，开始采访。“先生们，你们将成为首批进入太空的俄罗斯人。感觉如何？”\n\n镜头切换到宇航员身上。尤里先说道：“这是一项巨大的责任。我在西部长大，德国空军的轰炸一直延续到60年代。我的家人和朋友中有许多人正确地对天空感到恐惧。但我认为，如果我们继续害怕天空，那就是让德国人赢了。因此，我也觉得我们必须向世界展示纳粹的恐怖活动失败了。我们俄罗斯人坚持下来了。”\n\n镜头现在切换到捷尔诺夫。记者问了另一个问题。“十年前，你能想象自己会成为第一批看到地球的俄罗斯人吗？如果看到自己站在这里，你会有多么惊讶？”\n\n“我肯定会吓到！”捷尔诺夫笑着回答道。“当初我学习工程或者飞行，并不是因为我想去看星星。我是因为我想在战争中给德国人一个难堪。但现在我很高兴我获得了这样的教育，因为现在我可以将它用于一项崇高的事业。而下一代的飞行员和工程师将不再需要为战争而飞行。因为有了我们，他们可以飞向星辰大海。”"
 RAPP.20.a:0 "未来从此处开启。"
 Shukshin_News.1.t:0 "[Get_newspaper_header]俄罗斯启动首次载人航天任务"
 Shukshin_News.1.desc:0 "今天，俄罗斯联邦的街头洋溢着庆祝的喜悦，因为瓦西里·舒克申总统宣布了该国首次载人太空探险的成功。舒克申总统自从连任成功以来，将为俄罗斯初生的太空计划——俄罗斯航天局提供资金成为重中之重，而这个计划似乎终于见到了成果。\n\n国际反应总体上非常积极，美国驻联邦代表称这次任务是一次“胜利”，并祝贺俄罗斯取得了成功。舒克申总统表示，俄罗斯在太空探索中的角色只会不断增加，因为它的国际合作持续进行，并且有关正在开发中的大规模卫星计划的传闻继续流传。随着第四大强国进入星空，俄罗斯的雄心壮志将迈向更高的高度。"
 Shukshin_News.1.a:0 "第一步就是一大步。"
 Shukshin_News.1.b:0 "群星竞争者还是盟友？"
 Shukshin_News.1.c:0 "我们必须做点什么！"
 Shukshin_News.1.d:0 "新边疆的新对手。"
 Shukshin_News.1.e:0 "俄罗斯在群星舞台上占据了一席之地。"
 NOV_flavor.1.t:0 "平民脱离运动"
 NOV_flavor.1.desc:0 "\"别指望我们继续工作，沃尔科夫先生。”\n\n亚历山大·伊万诺维奇·沃尔科夫从办公桌上抬起头，看着他珍视的一杯冒着热气的午后咖啡。一瓶空的威士忌在他从一把病态的绿色办公椅上站起来时发出咔嗒声，他脚肿得厉害。“你说什么玩意，尼古拉耶夫？我付钱给你们这些混蛋是让你们炼铁，而不是抱怨。回到工作岗位上去。”\n\n“不，你不明白，”尼古拉耶夫说。“我们已经连续加班工作了三个星期了。我已经四天没回家了。我有些朋友，我和他们一起工作了多年，已经一周没见到自己的家人了。”他迈进了沃尔科夫的办公室，从硬化混凝土工作区穿过到铺着地毯的工厂主的办公室。“我明白与联邦的合同很重要。我们都需要业务做得好！但我们不能一直一周八十、九十、一百个小时地工作。”\n\n“仔细听我说，”沃尔科夫说。“如果我们不能在本月底完成这份合同，我们每个人都会他妈的失业。联邦，那帮该死的西罗维基，将永远不再和我们合作。这意味着没有供应商，没有买家，什么都没有！你想让你的家人挨饿吗？”\n\n“操你妈，该死的暴君！”尼古拉耶夫喷了一口口水。“我知道！该死的合同。这几个月来我们只听到这个。伊凡的新生儿怎么样了？彼得的妻子呢？难道你没听说她的诊断是晚期吗？你需要雇更多的人！”\n\n沃尔科夫一拳砸在桌子上。一杯破旧的白色马克杯里的咖啡洒出来，弄脏了地毯。“我没有那该死的钱！”他尖叫道。"
 NOV_flavor.1.a:0 "“那就找新员工吧，你这混蛋。我们要罢工了。”"
 NOV_flavor.2.t:0 "友谊是美丽的"
 NOV_flavor.2.desc:0 "亚历山大·伊万诺维奇·沃尔科夫拿起他新手机上的听筒。他意识到自己是个深感不幸的人。伊万诺夫铁厂，他父亲的遗产，那个他亲手一砖一瓦建造起来的工厂，寂静无声。寂静得像该死的陵墓。他用肥胖的手指沿着手机灰色塑料外壳轻抚。为什么人们不能更像机器呢？假如他需要汽车，它就会开动。假如零件坏了，他会请人来更换。当他开车远道探望爷爷或妻子的家人时，锈迹斑斑的化油器不会发出任何怨言。他的员工都是失败者和懦夫。要是那些无用的混蛋们有他父亲的职业道德，那么铁厂每周就能生产出一座山的价值。\n\n但是他们背叛了他。\n\n亚历山大拨通了某个号码。电话响了两声后，对方接通了电话。“马克西姆·尤里耶维奇！我是亚历山大·伊万诺维奇。我们在托木斯克见过面，在那次商业会议上。是的，那是战后的事了。小亚历克斯怎么样？”沃尔科夫伸手进办公桌抽屉，盲目地摸索着找雪茄和打火机。“是的，他们成长得如此快！”他说着，手指摸到了打火机的冰冷金属。“你应该感到骄傲。”\n\n“听着，我是打电话来谈合同的。是的，就是那份和凤凰公司的合同。不，我们已经延误一个多月了。要是我那帮该死的员工不全都罢工了，我们会好得多。这些共产主义混蛋根本不知道我为了保住他们的工作付出了多少牺牲。”亚历山大说。他停下来点燃打火机，将金色火焰按在雪茄上。“每一个人。该死的每个人。”\n\n“听着，我有个主意。”亚历山大说。“你还记得西比尔住房解决方案分公司的那个年轻人吗？伊涅莎？是的，伊涅莎·尼科拉耶芙娜。”他抽了一口雪茄。烟雾弥漫在他的肺里，就像美酒溅入水晶瓶中。它美丽而舒缓，就像海浪拍打在沙滩上。 “你能帮我一个忙吗？”亚历山大说。"
 NOV_flavor.2.a:0 "为朋友做什么都可以。"
 NOV_flavor.3.t:0 "非多米诺骨牌"
 NOV_flavor.3.desc:0 "尼古拉耶夫坐在肮脏的沙发上，听着妻子的愤怒。他的挚爱，克谢尼娅·丹尼洛夫娜，在他们这个破旧如老鼠洞般大小的公寓里来回踱步。“你怎么能如此不负责任，我的心肝？你本该来找我！你本该在你把我们的未来毁掉之前告诉我你计划这样的噱头！”\n\n尼古拉耶夫努力不让自己翻白眼。“我亲爱的，我没有毁掉我们的未来。可能会有一两个星期账单紧一点。但是一旦沃尔科夫意识到他需要我们，我就能重返工作岗位，如果上天允许的话，他会给我们正常人类的轮班。你知道伊万已经六天没见到他的新生儿了吗？”他说。\n\n克谢尼娅停下来。“我们应该给他们送点酪饼。可怜的卡特琳娜一定筋疲力尽。”\n\n“独自照顾那个小魔鬼一个星期后？这几天她都睡不了八个小时，我怀疑。”\n\n“别这样，尼克。他得了肠绞痛不是他的错。”\n\n“我知道，”尼古拉耶夫说。“我知道。对不起，我没告诉你关于罢工的事。我想再见到你，和你共度时光。我也为其他人感到难过。似乎无论我们做什么，总有人要求我们更多。”\n\n克谢尼娅微笑着坐到丈夫旁边。“我知道，我亲爱的。做一个男人很难，照顾他人并肩负起照顾他们的责任。但我为你感到骄傲，我非常爱你。我们会一起度过这个难关的。”\n\n尼古拉耶夫微笑着。“我们会度过的。”一个可怕而雷鸣般的敲门声打断了他的话。一封信从门和地板之间的尘土缝隙中滑进来。尼克颤抖着双手拿起了那封信并打开阅读。\n\n“亲爱的租户，”它写道，“西比尔住房解决方案已被告知您目前没有从事有意义的工作。租户必须保持足够的收入来支付合同中规定的每月租金。如果您在接下来的十四天内没有获得有酬工作，西比尔住房解决方案将被迫将您搬离。 伊涅莎·伊万诺夫，客户服务区域经理。”"
 NOV_flavor.3.a:0 "尼古拉耶夫哭了。"
 NOV_flavor.4.t:0 "逻辑谬误"
 NOV_flavor.4.desc:0 "亚历山大·沃尔科夫微笑着。终于，一切都按计划进行。钢铁厂喷出火焰和灰尘，将矿石消化成纯净的精炼铁。这种铁将拯救他们的国家。这种铁将为俄罗斯的未来铺平道路。是的，这种铁也将让他的钱袋鼓鼓囊囊。\n\n创始人的儿子几乎被喜悦弄得要吐了，他跳跃着从一个工位到另一个工位，俯瞰着数十个为他工作的劳动者的肩膀。为了他！他的父亲伊万·沃尔科夫曾经是商业界的巨人。人们几乎本能地追随他，就像一群狼追随它们的首领。他曾经是新经济政策的巅峰代表，一个忠诚的党员和一个好父亲。但是，现在一切都化为乌有了，只有钢铁厂还存在。钢铁厂是他父亲的遗产。现在，它们成为了他的。\n\n亚历山大无法像他父亲一样得到尊重，但那也没关系。如果他不能用胡萝卜来引导，那就用棍子来引导。只要能保持铁的流动，什么都可以。只要能让工厂像一头愤怒的野兽一样怒吼，用灰烟和烟尘灼烧天空。从某种角度来说，那是美丽的，他绝不会让这样的美丽挨饿。不，野兽要被喂养。钢铁厂将被数百名强壮的俄罗斯男子哺育，他们为了国家和野兽奉献自己。每一次推进、每一次肌肉的紧绷、每一次燃烧和每一滴汗水都是出于他的意愿。\n\n他看到了这个工业，它是美好的。"
 NOV_flavor.4.a:0 "殷勤人的手必掌权，懒惰的人必服苦。"
 NOV_flavor.5.t:0 "人民公仆"
 NOV_flavor.5.desc:0 "杰拉图斯特的街道上充满了泪水。那些咸咸的空气散发着疲惫和恐惧的气息。这并不是子弹伤口或刺痛的痛苦，而是对一个悲惨未来的深深、有力的认知。这座城市的孩子们记得叶夫根尼·德拉古诺夫摆脱了斯大林主义者的束缚，并承诺给他们带来繁荣和自由的未来。他们怀抱希望，祈祷，并为那个未来而战。像发明家代达罗斯一样，他们凭借武力和智慧逃离了无政府状态的恐惧，建设起一座痛苦与末日中的乌托邦。\n\n但是，杰拉图斯特被征服了。她的梦想在笔和子弹的追逐下被扼杀。她的人民失去了家园，失去了自由。他们失去了一切。在被推迟的梦想的废墟中，三只豺狼出现了：西比尔、凤凰和泰坦。这些巨头企业将城市夹在钻石般的臼齿之间，将好人和好女人赶出家门，把业主变成雇员。企业家和商人沦为销售员、收银员或乞丐。\n\n自由杰拉图斯特的梦想已经死去。但人民依然存在，而人民必须受到保护。当舒克申总统呼吁成立新党，以抵制巨企的统治时，阿列克谢·诺维科夫响应了这一号召。“但我不能独自做到，”阿列克谢对陶醉的人群说。“杰拉图斯特需要一个发声者。我们不仅仅是新西伯利亚的附属物。我们不是企业产品的倾倒场所。我们的母城古老而庄严，富丽而自豪，她应该在联邦层面被倾听，”他说。\n\n阿列克谢用拳头猛击着讲台。“我的对手，诺维科夫先生，不过是凤凰公司的工具。那些寄生虫！他们将会购买这座城市的每一家工厂和企业，直到他们拥有一切。在座的有多少人是小企业主？”大约四分之一的人举起了手。其中只有三个是安插的。“凤凰和诺维科夫想要从你们手中偷走你们的财产。他们想要拥有你们。他们想要拥有你们的家人。我们难道要让那些混蛋奴役我们的城市吗？\n\n人群齐声大喊道："
 NOV_flavor.5.a:0 "“绝不！”"
 NOV_flavor.6.t:0 "一个商人，做生意的人"
 NOV_flavor.6.desc:0 "阿列克谢·诺维科夫坐在莫卢斯卡餐厅的餐桌上，背挺得笔直。餐厅里弥漫着新鲜花朵和葡萄酒的香味，但他几乎没有注意到。他的西装腰部太紧，当他坐下来时，裤腿可能稍微高了四分之一英寸。毫无疑问，阿列克谢需要请裁缝。当然是扎洛乌斯特。\n\n“比利时青口贝糟糕透了。如今要找到好吃的比利时巧克力太难了。想想看，那个白痴竟然把它浪费在巧克力覆盖的青口贝上。”老人摇了摇头。\n\n阿列克谢瞥了一眼菜单。什么样的餐厅只提供青口贝？“那么，你有什么推荐？”他问道。\n\n“什么都没有。我在莫卢斯卡已经吃过八次了。五次晚餐，两次午餐，还有一次带回办公室的外卖。食物糟透了，服务一般，葡萄酒价格过高。”老人伸出手，横过桌子。“但首席市场官的女婿拥有这个地方。我是泰坦集团的首席财务官，安纳托利·亚洪托夫。”\n\n“谢谢你，亚洪托夫先生。我带来了一份我们应该讨论的政策和建议清单。当然，按照您的方便来。”阿列克谢说。“我们的数据显示这些法规将使乌拉尔地区的生产力提高百分之十五——”\n\n亚洪托夫挥了挥手，打断了他的话。“我不关心。”他向后靠着椅子伸了个懒腰，几乎把一个女服务员手中的一盘青口贝弄掉。“诺维科夫先生，我们不关心你的政策。我们需要在杜马建立关系。给我一个泰坦集团支持你的理由。”他抿了一口珍珠白葡萄酒。“你能为我们做什么？”\n\n“我的竞选基于将繁荣与自由带回西伯利亚西部。我支持爱国主义、亲商的政策，这将帮助我们重建并最终夺回莫斯科，”阿列克谢说道。\n\n亚洪托夫翻了翻白眼。“诺维科夫先生，我非常重视诚实。我没有时间听你实习生为你写的电梯演讲。告诉我你想要什么，否则我就自己享受午餐了。”\n\n“好吧，”他说道。阿列克谢直视亚洪托夫的眼睛。“我希望凤凰从兹拉托乌斯特撤出。他们迫使我的邻居和我的家人陷入生计困境。你想要把西伯利亚西部最优质的工业资源和人力资源垄断给你最大的竞争对手吗？”"
 NOV_flavor.6.a:0 "“或者你想做一笔交易？”"
 NOV_flavor.7.t:0 "首席执行官的一封信"
 NOV_flavor.7.desc:0 "亲爱的泰坦焊接公司全体员工，\n\n将我们的团队统一、巩固和整合在西伯利亚，以最大程度地发挥公司的协同效应并发挥各个团队的核心竞争力，对我个人和泰坦集团来说是一个激动人心的机会和特权。随着我们团队的壮大，我见证了你们每个人的成长。我为你们每个人感到骄傲。\n\n然而，随着西伯利亚的商业环境的发展，公司的领导层对我们的成本收入比例越来越担忧。作为泰坦集团的全资子公司，我们的首要任务是实现盈利，并最大程度地提高母公司的投资回报。\n\n公司领导层将密切关注西伯利亚选举的发展情况。我们非常关注地区的活力，并致力于在我们的新家打造一个机遇和生产力的文化。当我投票时，我会寻找一个能够将繁荣和自由带回西伯利亚的候选人。我将投票给支持爱国主义和亲商政策的候选人，这将帮助俄罗斯联邦重建和夺回莫斯科。\n\n让我们作为一个团队共同努力，选举一个支持你们公司和你们工作的候选人。请记住，选举日是公司放假日。\n\n谨代表泰坦焊接公司致以诚挚的问候。\n\n丹·范·戴克，首席执行官"
 NOV_flavor.7.a:0 "回去工作。"
 NOV_flavor.8.t:0 "制造商的同意书"
 NOV_flavor.8.desc:0 "尼古拉·奥尔洛夫一边走在去上班的路上一边吃着完美的鸡蛋三明治，它由两片来自他妻子花园的新鲜西红柿，两块烤过的黄油面包，还有一个用黄油煎过的溏心蛋组成，用盐、胡椒粉和大蒜粉调味。这简直就是天堂般的美味--他在无政府状态下永远也吃不到这样的三明治。舒克申和联邦对他做了不少好事。当尼古拉走在破旧的乡间小路上时，他携带的便携式收音机开始嘀咕起来。\n\n“西西伯利亚的兄弟姐妹们，”广告开始了，“当你们在这个选举日去投票时，请为繁荣、爱国主义和重建我们家园所需要的亲商政策投票。请投给阿列克谢·诺维科夫！”\n\n尼古拉对着他的三明治笑了笑，继续走在上班的路上。\n\n当尼古拉来到泰坦实验室设备公司的大门口时，他的手指上已经涂满了番茄汁和半熟的蛋黄。离开工时间还有七分钟，他蹑手蹑脚地走到男厕所，在路上停下来，向他的好朋友尼内尔快速道了声早安。这个人很古怪，但很善良。当尼古拉在一股凉水下冲洗他长满老茧的双手时，几十张印有联邦国旗的海报在他身后晃动。“投给诺维科夫就是投给莫斯科！”一张海报上写着。“繁荣，爱国与自由，请投给诺维科夫！”另一张海报上如此写道。\n\n当他进入工作车间时，几十台机器已经在他面前嗡嗡作响，切割玻璃，给塑料塑形，弹出残次品。他笑了笑。看来在夜班的时候一切都还好，尼古拉大步走到他的工作站，戴上他的安全护目镜，开始他的工作。五分钟后，他的主管维诺格拉多夫先生路过他的工作站。\n\n“尼古拉，希望你一切顺利。你的老姑娘怎么样了？”他问道。\n\n尼古拉向他的经理投去一个微笑。“她现在比牛还壮哪，先生。我想我们今天会完成配额。”他说。\n\n维诺格拉多夫点了点头。“好，我会记下来的。顺便说一句，公司让我转告你，选举日那天公司会放假。你打算投给谁？”\n\n尼古拉挠着下巴，想了一会儿，然后找到了答案。"
 NOV_flavor.8.a:0 "“我想我会投给诺维科夫的，先生。”"
 NOV_flavor.9.t:0 "你想让我做什么？"
 NOV_flavor.9.desc:0 "阿列克谢·诺维科夫像个疯子一样用手指敲打着他新办公桌的橡木。他耳边的塑料电话听筒像午夜的霜一样冰冷，他的脊柱像被人打了一下一样疼。\n\n“这是你第一次和我直接通信吧，”阿纳托利·亚洪托夫说道。“舒克申总统没有对我们的利益要求作出回应。我建议你投靠到西罗维基这边来。”\n\n“不，不，我不能那样做。也不会那样做，”阿列克谢急忙地回复。“我掀起这场运动是为了帮助兹拉托乌斯特和我的家人。而波克雷什金的党派和凤凰同流合污！他们会把我的家乡撕成碎片的。”\n\n“他们和我们也是一伙的，我的朋友。”\n\n“好吧，但我不为泰坦工作。”\n\n“你当然是他们的人。”亚洪托夫说道，“我们给了你被选举权，我们给你的员工发工资，我们拥有你在新西伯利亚的公寓的契约——稍等一下。” 阿列克谢隐隐约约听到亚洪托夫在喊什么。\n\n“对不起，有一份开支报告我必须看一下。”他继续说道，“我不希望你把注意力放在这件事的负面因素上。有了你的投票，我们就能在兹拉托乌斯特乃至整个西伯利亚地区进行重大投资。我桌上有一份重建西伯利亚大铁路的提案，如果该提案在杜马获得通过，我们可以优先雇用兹拉托乌斯特的企业承包当地工程。我们可以一起努力，让凤凰公司不会在你的家乡垄断一切。但是，如果你坚持站在舒克申那边，那就不好说了。”\n\n阿列克谢暗暗发了个誓。“你让我很为难啊，亚洪托夫先生。”他说道。\n\n“我也不想这样。但还是请你在明天中午前给我回应，我希望你能做出正确的决定，诺维科夫先生。”随着一声道别，阿列克谢所谓的主人挂断了电话。"
 NOV_flavor.9.a:0 "兹拉托乌斯特需要泰坦来抵御凤凰。"
 NOV_flavor.9.b:0 "兹拉托乌斯特需要自力更生，而不是一个更仁慈的主子。"
 NOV_flavor.10.t:0 "务实主义、爱国主义与繁荣"
 NOV_flavor.10.desc:0 "阿列克谢·诺维科夫调整了他的袖扣，微笑着露出瓷器般洁白的牙齿。“大使，真高兴终于见到你了，”他自言自语道。“一如既往地迷人啊，斯韦特兰娜。谢谢你加入我的行列，”他对着空气喊道。几十个重要的立法者和知名人士在脑海中围着他转，而他却完全是孤身一人。\n\n“阿列克谢！”一个无名氏说道。“真高兴能见到你！”\n\n“也很高兴见到你，我的朋友，”阿列克谢说道。那是谁？他看起来一点也不面熟，但阿列克谢肯定以前见过他一次。也许是在巴尔瑙尔？或者伊尔库茨克？有这么多的面孔，有这么多的个性需要记住，但没有一个人存在。当他向他们伸出手时，他们就像雾一样蒸发了。\n\n主席台上响起了一阵轻柔的钟声。当一个50岁出头的西装革履的男人走上舞台时，在场几十个男男女女都安静了下来。\n\n“女士们，先生们，”他说道，“感谢你们参加我们今天晚上的庆祝活动。能够与你们交谈是一种特权和荣幸。”他喝了一口水，开始了他的演讲。“繁荣，这是我们亲爱的朋友，阿列克谢·诺维科夫参议员经常听到的一个词。”房间里响起一阵掌声，它的声音让人想到忘记关掉的煤气灶。“但繁荣是什么意思？当然，它涉及利润，以及我们企业的发展。但当我想到繁荣时，我想到了我的家庭。我的儿子，鲍里斯，已经7岁了。他需要一所学校。他需要友谊，需要一个社区。即使我不得不拽着他的耳朵出门，他将来也需要找到一份工作！”\n\n众人不约而同地笑了起来。阿列克谢发现他的嘴角弯成了一个月牙，但他的心却像灌了铅。\n\n“因此，”发言人继续说，“当我想到繁荣时，我想到了我们的家庭。我们的社区。我想到的是努力实现一个值得我们为之奋斗的未来。我相信，繁荣将来自阿列克谢·诺维科夫在联邦议会的成功。”他举起酒杯，一饮而尽。\n\n“祝贺你，阿列克谢。凤凰公司期待着与你和泰坦集团合作，以重建兹拉托乌斯特。”"
 NOV_flavor.10.a:0 "每个人都应根据自己的能力和性格在社会中找到自己的位置。"
 NOV_flavor.11.t:0 "心中理想"
 NOV_flavor.11.desc:0 "“诺维科夫议员，看来我欠你太多了。”舒克申总统笑着说道。他握了握阿列克谢的手，向他的办公椅做了个手势。“坐吧。”\n\n阿列克谢在舒克申总统办公室的一张巨大的手工雕刻的桌子旁坐了下来。它如同山一般雄伟，用俄罗斯最好的木材雕刻而成，上面装饰着俄罗斯过去和未来的象征。在右边，留里克三叉戟和圣安德烈斜十字像古代的哨兵一样站岗。在左边，诺夫哥罗德共和国的徽章提供了庇护，俄罗斯第一共和国的双头鹰展翅高飞。在中间，在新西伯利亚和巴尔瑙尔的版图之上，联邦的第一面旗帜自由地飘扬着。\n\n“谢谢你。”阿列克谢说道。“这个月过得很艰难。泰坦停发了他们的工资后，我所有的员工都离开了工作岗位。我还失去了我的公寓。”\n\n“你现在住在哪里？”舒克申关切地询问。\n\n“我的表弟在新西伯利亚东城区有一套房子，”阿列克谢回答道。“但我不知道他有五个孩子。”\n\n舒克申皱起了眉头。“那就好。没有什么比家庭更重要，我的朋友。”他笑了。“阿列克谢，我知道你现在很难过。对整个国家来说，这是一个艰难的时期。但你做出了正确的选择，你挣脱了泰坦的束缚；如果你不这么做，他们会把你关在笼子里度过余生的。”\n\n“谢谢你，总统先生，”阿列克谢说道。“不幸的是，泰坦和凤凰已经在暗中破坏我了。他们散播广告、在群众中间捣乱、搞不利于我的宣传--距离西罗维基正式和我撕破脸皮就差捅破一层窗户纸了。”\n\n“下一次选举将是你一生中最艰难的一次，”舒克申说道。“我们会尽力的。但你在西罗维基对你发起的挑战中幸存下来的唯一方法就是让兹拉托乌斯特的人民知道你是在为他们而战。说到这个，我有一份议案想请你考虑一下……”"
 NOV_flavor.11.a:0 "在一个民主国家，个人享有最终权力，也需负担最终责任。"
 NOV_flavor.12.t:0 "不只是工具"
 NOV_flavor.12.desc:0 "“听我说，西伯利亚的工人们……” 列昂尼德·康托罗维奇开始他的演讲，注视着一群或许将成为俄罗斯社会主义未来的男男女女。 “我们的家园，俄罗斯，已经成为资本主义和法西斯主义阴险影响的受害者。这些人把你们视为不过是为他们谋利的工具。然而，希望并没有丧失。你们，俄罗斯的工人们，有力量将事情变得更好。你们是这个伟大社会的建设者，改变这个社会的力量就在你们手中。帮助我提升这个伟大国家的工人们，并为我们所有人带来繁荣。”\n\n一个咳嗽声。从眼角的余光中，康托罗维奇能看到人群中有几个人窃笑。大多数人以为演出结束了，开始离开这个几乎没有填满的公园，而康托罗维奇曾希望这里会是俄罗斯革命史上下一个伟大火花的发源地。他举起一只手，想叫回人群，但停了下来。没关系，他们不会听他的。至少现在还不会。\n\n他知道恐惧紧紧抓住了他们的心。有些人不想让自己的家因为有“民粹派同情者”而受到突袭。还有更多人认为，在苏联崩溃时社会主义已经失败，永远不会是拯救俄罗斯免受德国威胁的意识形态。康托罗维奇更清楚。但他如何能让人们认识到他们的错误呢？\n\n康托罗维奇走下他搭建得匆忙的讲台，凝视着他能看到的新西伯利亚的一角。这不是一个准备好迎接革命的城市。这是一个渴望和平的城市。繁荣。新西伯利亚自言自语地笑了笑，想起自己在苏联时只是一个简单的数学家时曾不得不解决的所有数学问题。那才是真正的巨人。他所需要做的就是找到正确的方程式，正确的变量和条件的组合，他就能把社会主义从崩溃的边缘带回。"
 NOV_flavor.12.a:0 "社会主义没有让我们失望；它只是没有找到合适的领导者。"
 NOV_flavor.13.t:0 "向着更伟大前进"
 NOV_flavor.13.desc:0 "战争是人类创造出的最大罪恶。至少，这是安纳托利·科里亚金坐在一辆正行驶在杂乱建造的苏联时代道路上的卡车后部所思考的。这是清晨，天空仍然呈现出那种沉闷的灰蓝色调，即使没有困意，人们也想揉揉眼睛。汽车经过一个城镇，或者更确切地说是一个城镇的残骸。这里曾经居住过的生命只剩下被德国空军炸成灰尘的冒烟废墟。\n\n\"你觉得那里住了多少人？\" 安纳托利问他的其中一个同伴，后者加入了他的这次远足。\n\n\"啥？\" 其中一名男子回答道，扭头朝安纳托利望去的方向看了一眼。\"哦。我不知道。可能有几百人吧。谁在乎呢？他们都没了。\"\n\n\"我在乎，\" 安纳托利回应道，但没有多说什么，让卡车的后部重新陷入阴郁的寂静。然而，他的思维齿轮仍在不停转动。他会在乎。他不会再袖手旁观，任由战争的蹂躏扼杀他的同胞的生命。这种毁灭和暴力的循环必须在某个地方结束。\n\n然而，这么想是不是天真？安纳托利将目光投向正在渐渐消失在灰色远方的废墟之镇。那个城镇的人们可能只想把每天在西部俄罗斯倾泻下来的火焰重新烧向德国人，向他们展示心中燃烧的仇恨。也许人类注定要在这个无尽的暴力循环中毁灭自己，永远无法超越野蛮。\n\n安纳托利对这个想法摇了摇头。胡言乱语。还有希望。希望永远存在。他背过头，望向卡车离开的方向，看向卡车前进的方向。他能看到东方逐渐升起的暗红色轮廓。在西伯利亚，他可以重新开始。在西伯利亚，他可以努力产生影响。在西伯利亚，未来只是等待诞生。"
 NOV_flavor.13.a:0 "在西伯利亚的荒原上，一个人梦想着更美好的明天。"
 NOV_flavor.14.t:0 "崇高的真理"
 NOV_flavor.14.desc:0 "叶夫根尼·普里马科夫并非与斗争为伍的陌生人。从食用锯末面包为餐到在阴暗的妓院和俱乐部当看守，普里马科夫淬炼于冷酷、不动摇的环境之中。通过背叛朋友和敌人，他慢慢攀升在食物链之上，而在此过程中他领悟了一个至关重要的真理：人是自私的。为了在强者的土地上立足，任何人都会不惜一切。在新西伯利亚的街头，这是一个赢者通吃的社会，而普里马科夫不是输家。尽管巴尔瑙尔的天真自由主义者或乡村中卑劣的社会主义者自欺地否认，理想而光荣的未来是不存在的。只有冷酷、不动摇的社会真相。\n\n普里马科夫脸上浮现出一丝疲惫的微笑。也许有一天，他可以纵情享受生活的奢华和快乐。然而，这些冒入的思绪在更响的敲门声面前迅速止住了。叶夫根尼紧张地从他的皮椅上站起，扭动把手，露出一个令人惊讶的场景。\n\n“下午好，普里马科夫先生。我是来处理我们之前讨论过的交易的。”维肯蒂冷淡地通知脸色苍白的叶夫根尼，他在走进普里马科夫办公室狭小的空间时掠过淡淡的微笑。这位商人一直保持着坚毅的皱眉，毫不动容地走过高大的西尔沃基，没有给予任何认可。\n\n“为了让你达到今天的地位，我们付出了很多钱。我的雇主对你的困难表示不满。我想你一定很忙，对吗，普里马科夫？”维肯蒂示意他坐下，他犹豫地坐了下来。\n\n“是的，呃……”叶夫根尼结结巴巴地说道，未能与对方那种企业、冷漠的眼神对视。“那个，站在门旁边的是谁？”\n\n“那位是索科洛夫先生。普里马科夫先生，我们并非朋友，而可以说是合作伙伴。我需要你帮我办点事情，代表我们的上级。我们会提供适当的报酬给你，而你需要确保一切运转正常。”维肯蒂向前倾身，把手稳稳地放在叶夫根尼的肩膀上。"
 NOV_flavor.14.a:0 "那天，普里马科夫明白了第三个真理。上级永远存在。"