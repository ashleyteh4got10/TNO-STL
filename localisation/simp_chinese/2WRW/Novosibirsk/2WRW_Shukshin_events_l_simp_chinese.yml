l_simp_chinese:
 Shukshin_unification.1.t:0 "新的曙光"
 Shukshin_unification.1.desc:0 "瓦西里·舒克申坐在他的办公桌前。新西伯利亚比巴尔瑙尔要冷得多。但它更大，更嘈杂，也更繁忙。这似乎与他目前作为联邦总统的地位相符。每时每刻，他左耳听着西罗维基的咒骂，右耳听着巨型企业们的抱怨。全天，每时每刻。瓦西里并不喜欢这份工作。事实上，他鄙视它。有时，他希望自己能回到巴尔瑙尔，挑战波克雷什金并支持小规模改革。对舒克申来说，这比他目前的情况要容易处理得多。\n\n尽管他最近作出了努力，但仍有许多事情要做。该死的，如果联邦要成为一个真正自由和民主的国家，就必须对整个系统进行彻底的大修和改革。西罗维基处处进行着激烈的抵抗，尽一切可能阻止改革，甚至试图推翻新成立的联邦议会。\n\n几十年来，自从脱离中西伯利亚共和国后，波克雷什金领导的西罗维基一直在掌权。他们使联邦变成了现在这样。在这片土地上，“强人”完全统治着人民，他们将现金收入囊中，却无视他们所造成的损害。然而，他治下的联邦将完全不同。它不会拥有失败的中西伯利亚共和国不合时宜的理想主义，也不会像波克雷什金的联邦那样愤世嫉俗。这将是一个崭新的联邦。"
 Shukshin_unification.1.a:0 "为了光明而充满希望的未来！"
 Shukshin_unification.2.t:0 "务实主义和民主"
 Shukshin_unification.2.desc:0 "瓦西里坐在桌首。在他面前坐着他的总统内阁。他的外交部长弗拉基米尔·索博列夫、他的经济部长米哈伊尔·克琴科、他的安全部长兼老朋友阿梅特汗·苏丹以及副总统兼反对党领袖亚历山大·波克雷什金。瓦西里清了清嗓子，然后伸手去拿桌上的一套文件。\n\n“先生们。很高兴今天见到你们。我知道你们都很忙，所以我会保持简短。如你们所知，联邦不再只包括西伯利亚中部，而是包括整个自由俄罗斯。鉴于这个新现实，我认为是时候对政府进行改革，使其更加务实，以满足联邦的需求”，总统解释道。\n\n他得到了三个点头表示同意，但当然，他的副总统很快就表示反对。 “总统先生，你不是认真的吧！这只是你又一次颠覆西罗维基的企图，你他妈的很清楚！”\n\n阿梅特试图提出抗议，但瓦西里举起手阻止了他这样做。\n\n“我理解你对此持保留意见，亚历山大，但即使你必须承认，目前的系统已经过度扩张，迫切需要改变。”\n\n亚历山大张嘴想说话，但停住了，向后靠在椅子上。\n\n“西罗维基不会喜欢这样，瓦西里。”猎鹰提醒他的老朋友。\n\n“我不希望他们这样做，亚历山大，但必须这样做。为了联邦的利益，对吧？”瓦西里回答。\n\n亚历山大叹了口气，摇摇头，然后回头看着总统。"
 Shukshin_unification.2.a:0 "“好吧，老朋友。为了联邦好。”"
 Shukshin_unification.3.t:0 "纸牌开始掉落"
 Shukshin_unification.3.desc:0 "自从联邦在他的指挥下结束大动乱时代仅仅几周时间，舒克申已经在他的办公桌前焦躁不安地动了几个小时，因为他无法找到通往他真正自由的俄罗斯梦想的道路。虽然波克雷什金联邦在理论上已经实行民主，但这充其量只是一个平淡无奇的借口。立法机关没有真正的权力，被受制于无穷无尽的神秘法规和武断的总统演讲的抄本所束缚。由于波克雷什金的狂妄自大，他勉强在这个系统中领导联邦，但是现在是他的工作，而且是他一个人的工作来修复它，尽管他知道这并不容易。\n\n几个小时以来，舒克申一直在苦苦思索如何修补这个腐朽的系统，但都没有成功，直到他终于有了新的认识。他终于从恍惚中清醒过来，终于意识到他如何最终修复摆在他面前的破碎系统，他如何将波克雷什金和西罗维基的失败抛在脑后，联邦系统中的系统性腐败如何能够被废除——但不是按照惯例。不，他们必须建立一部新宪法，一个多元化的联盟体系。有了新的顿悟，舒克申煞费苦心地准备了他的工作和建议，以最终揭开面纱，并让俄罗斯过去的强盗大亨最终落在他们身后。\n\n舒克申从办公室赶到杜马大楼，立即召开紧急会议。国家重振希望，无所不能。对总统的突然召见而愤怒的代表们入座后，舒克申开始向杜马和全国宣布他的消息。\n\n“今天，我特此宣布，新的政党将再次并永远被允许建立起来。 波克雷什金所允许的陈旧和封建的‘民主’制度将不再存在。联邦的行政部门将不再是全能的独裁者，其权力将受到真正宪法和改革后的联邦立法机构的限制。“整个俄罗斯都看到了他的意向宣言，即使是西罗维基也无法阻止有整个国家支持的运动。"
 Shukshin_unification.3.a:0 "致电我们的西罗维基联系人，为新运动争取一些支持。"
 Shukshin_unification.3.b:0 "向新成立的反对派伸出援手，我们不能重蹈覆辙。"
 Shukshin_unification.4.t:0 "保证"
 Shukshin_unification.4.desc:0 "弗拉基米尔·索博列夫低头看了看手表。他即将会见的西罗维基，米哈伊尔·德维亚塔耶夫，自然迟到了5分钟。弗拉基米尔考虑着找到他，然后抓着他的耳朵拖进会议室，就在这时门开了，米哈伊尔走了进来。\n\n“你迟到了够久的，”弗拉基米尔自言自语地说着，走过去和他握手。\n\n“抱歉。波克雷什金拖住了我。他想和我谈谈这次会议的性质，”寡头解释道，坐在索博列夫桌子对面的座位上。弗拉基米尔也坐了下来。\n\n“没关系。只是几分钟而已。现在，我听说你对联邦议会的想法持开放态度。”\n\n“我愿意讨论这个问题，”米哈伊尔提醒外交部长。\n\n“好吧。我了解你们中的许多人对联邦议会持有…保留态度。总统想知道我们能做些什么来缓解他们的担忧，”弗拉基米尔问道。\n\n“我们组织中的温和成员需要保证。他们将联邦议会视为舒克申的一次权力掌握。许多人担心，随着新政府的建立，他们会失去工作和影响力。如果你们想要西罗维基的帮助，我们希望确保不会失去我们的权力。毕竟，这个联邦议会的目的是使政府更高效，对吗？”\n\n索博列夫靠在椅子上，思考着米哈伊尔的话。总统不会满意在政府中保持西罗维基的权力，毕竟，这个想法是为了实现民主，而不是保持现状。弗拉基米尔叹了口气。不管喜欢与否，如果他们想要进行改革，西罗维基将是必需的，即使这意味着在理念上做出妥协。"
 Shukshin_unification.4.a:0 "让我看看我能做点什么。"
 Shukshin_unification.5.t:0 "梦想的微光"
 Shukshin_unification.5.desc:0 "三方代表坐在会议厅中，几乎陷入了寂静。虽然党派领导和一长串助手已经进入房间数小时，但除了敷衍的回应外，没有人说过话。康托罗维奇和科里亚金，民主社会主义者和社会自由派的领导人，面对面坐着。前者愤怒地写着笔记，后者似乎在对某次演讲默默排练。舒克申默默地盯着他们，心怀忧虑。每个人都知道这次会议的重要性，但没有人愿意迈出第一步。\n\n关于共同纲领的谈判进行得缓慢而艰难，三方都不愿意达成协议。每次妥协的尝试只加深了彼此立场迥异的感觉。直到普里马科夫成为讨论焦点时，对话的氛围才发生改变。\n\n随着西罗维基越来越成为对话的中心，合作的意愿也越来越强。没有人需要被提醒如果对手取得成功会有什么后果，而联盟伙伴之间的争斗相比之下变得微不足道。讨论的重点从如何在各方分歧上寻求共识转变为如何利用这些分歧来对付共同的敌人。\n\n随着时间的推移，会议室里的讨论变得活力十足。每一方的党派代表一个接一个地兴奋地站起身来，热情如火。每个代表，甚至包括最年轻的秘书，都在完美协同地协调政策计划。每一个战略、每一个漏洞，都是为了削弱企业势力和西罗维基的控制，并将其扩大，直到变得无懈可击，准备实施到最大效果——如果相关法案能够通过。\n\n讨论持续到深夜的最后时刻。每个人离开房间时，带走了一种变革的氛围。务实联盟已经演变成一项神圣的盟约，为了保护每个人最看重的东西，每一个人都愿意不惜一切去实现这个目标。他们不再是同事或合作伙伴，而是民主火炬的守护者。"
 Shukshin_unification.5.a:0 "事情太多了，时间太少了。"
 Shukshin_unification.6.t:0 "追求和平"
 Shukshin_unification.6.desc:0 "安纳托利·科里亚金顺着阶梯走上前，手中握着几页文件，迅速整理了一下领带。他沿着曲线楼梯继续向台上行进，不禁惊叹于他的政党取得的快速进展。短短几年前，他的政治运动几乎被波克雷什金和他的暴徒们取缔，但现在他站在这里，准备让他的政党走上聚光灯下，成千上万的人从党代会的座位上观看。\n\n为了达到这一刻，他进行了艰苦的斗争。他仍然记得自己在布哈林的统治下的早年生活，以及帕斯捷尔纳克宣布共和国成立时他所见到的彻底变化。他永远不会忘记那些挥舞作家的旗帜的人们穿过他位于坎斯克的家门口的情景。当旗帜升起在首都大楼上空的时候，整个城市没有流一滴鲜血。当然，时光会改变，当战争之后的黑军匪徒席卷他的城市时，他作为一个十几岁的少年逃往了新西伯利亚，而中西伯利亚共和国则在他身旁崩溃。\n\n过去的帕斯捷尔纳克时期和大动乱时代之间的对比将永远不会离开他的脑海。战争和冲突无端地毁坏了数百万人的生活，却毫无意义。在追求精神病学事业的过程中，他的信念从未动摇。当他的家乡城市处于联邦控制之下时，他已经成为政治知识界的领袖。随着舒克申的权力和改革逐渐增长，民众的支持也在与之齐头并进，而现在，他站在自己努力的最边缘，走近演讲台并开始演讲。\n\n“亲爱的党员们，我站在你们面前，作为一场斗争的领导者。这场斗争不是为了战争或破坏，而是为了和平与繁荣，为了世界上所有国家之间的斗争。有了我手中的这份文件，俄罗斯社会自由党在俄罗斯联邦正式注册了，走向一个没有灾难的世界的进程终于可以开始了。谢谢你们。”\n\n人群中爆发出热烈的欢呼声和掌声。科里亚金看着镜头微笑。当凤凰看到他的报道时，他们要气炸了。"
 Shukshin_unification.6.a:0 "当他向记者挥手时，人群从他的脑海中消失了。"
 Shukshin_unification.7.t:0 "总统的演讲"
 Shukshin_unification.7.desc:0 "舒克申总统站在一大群支持者面前，他们从远至阿尔汉格尔斯克的地方聚集在一起，听这位自由斗士的讲话。舒克申微笑着走到麦克风前，现在全世界的目光都集中在他身上。\n\n“俄罗斯已重获统一！”总统将这句话昭告天下。\n\n随即，人群中爆发出庆祝的欢呼声。这几乎让人难以置信。一个曾经在军阀混战时代卑躬屈膝、四分五裂的民族，现在却对未来的日子充满了自豪和希望。很快，当总统再次发言时，人群又陷入了沉默。\n\n“但并非所有俄罗斯人都与我们同在。数以百万计的俄罗斯人民生活在外国的占领之下。他们的人权被剥夺，在自己的土地上沦为二等公民。那些不幸生活在这种条件下的人们啊，请听我说：”\n\n舒克申停顿了片刻，脸上浮现出笑容，他凝视着面前成千上万的人群，全世界的几十亿双眼睛同时也在看着他。\n\n“你们的解放即将到来！”\n\n当舒克申望向天空，沐浴在阳光和凉爽的空气中时，人群疯狂地欢呼起来。他感到变革之风吹拂着脸庞。时代变了，全世界都知道这一点。"
 Shukshin_unification.7.a:0 "为了俄罗斯人民的解放！"
 Shukshin_unification.8.t:0 "来自阴影"
 Shukshin_unification.8.desc:0 "奥列格走过走廊，朝着自己的办公室走去。马加丹代表在今天的国家杜马会议上代表凤凰反对俄罗斯农工党对政府的提议。辩论持续了很长时间，总统及其圈子正在追捕“腐败的西罗维基寡头”的传闻并没有缓解他的烦心。\n\n他走近办公室的门口，手里拿着钥匙，当他注意到门已经打开时，慢慢地推门进入，当他看到有人坐在桌子上，左手拿着文件夹，右手拿着手枪时，他愣住了。\n\n“迪米特里？你...你在这里做什么？”奥列格问道，他在关上门后说。\n\n德米特里·伊万诺夫站起身，将文件夹塞进奥列格的手中。\n\n“为什么不告诉我，代表？”他问道，语气中立，表情不变。\n\n奥列格慢慢地打开文件夹，里面装着几份文件、收据和照片，所有这些都是他与凤凰公司勾结的证据，以及自从总统就职以来他收受的贿赂。代表合上文件夹，目光直视这位隐居的特工。\n\n“你是来逮捕我的？”奥列格问道。\n\n“幸运的是，这不是我的命令，但舒克申总统将不再容忍腐败。你必须与凤凰和其他你有交往的组织切断关系。如果你想保持你的声誉完好，我建议你递交辞职信。你的行为是叛国行为。代表沃尔科夫，我认为这是一种仁慈的行为。”迪米特里解释道，他收起手枪走向门口。\n\n“当然，如果你在这里提及我们的会面，总统将是你最不用担心的事情。”\n\n奥列格静静地点了点头，迪米特里离开房间。他轻叹一口气，将文件夹放在桌子上，坐了下来。片刻后，他伸手拿起笔，开始写他的辞职信。"
 Shukshin_unification.8.a:0 "以毒攻毒？"
 Shukshin_unification.9.t:0 "关上门"
 Shukshin_unification.9.desc:0 "照常，瓦迪姆准时拿着一个信封抵达克拉斯诺亚尔斯克。他走到城郊的一座大房子门前，敲了三下门。片刻后，门打开了，城市代表弗拉基米尔走了出来，他是国家杜马的代表。\n\n\"你他妈在这儿干什么？！\" 弗拉基米尔注视着面前的年轻人，愤怒地质问道。\n\n\"是西比尔，先生。坦白说，他们对政府提出的变革不满意，他们希望您帮忙阻止这一切发生。\" 瓦迪姆解释道，他准备将信封递给代表。\n\n弗拉基米尔把信封推了回去。\n\n\"你们是疯了吗？！我不能带着你们的钱被抓住。舒克申已经派特工在每个有记录的寡头家门口敲门。我的职位岌岌可危！对不起，但我不能再接受你们的钱了。\" 弗拉基米尔解释道，目光扫过年轻人的肩膀。\n\n\"那么对于政府变革的提案呢？\" 瓦迪姆缓慢地问道，把信封收入口袋。\n\n弗拉基米尔叹了口气。\"我必须接受。近几周，我的声望急剧下滑，如果我拒绝这个提案...对不起，信任我还是不信任，如今人民的意愿真的很重要，如果我想明年再次回到我的职位上，我必须顺从。\"\n\n弗拉基米尔迅速把门砰地关上，让一个非常吃惊的年轻人在寒冷中站着。他叹了口气，离开了那座房子，想着该如何向上级解释这个烂摊子。"
 Shukshin_unification.9.a:0 "又一枚棋子被吃掉。"
 Shukshin_unification.10.t:0 "第一步"
 Shukshin_unification.10.desc:0 "舒克申自言自语地喃喃读着自己的演讲稿，一遍又一遍地，声调单调。这是他作为俄罗斯联邦总统的第一次演讲，为俄罗斯民主的新时代揭开了一角。这一刻的重压使他感到肩上沉甸甸的，他走进了杜马。当他注视着国家自由选举产生的官员们时，从他右边到遥远的左边，他对自己的人民、对自己的国家感到自豪，充满了能量和新的自信。\n\n“我感谢杜马成员在今天与我会面。这对于自由世界和联邦来说都是一个重大时刻。民主之风为俄罗斯及其人民注入了新的生机，现在我们必须承担起传递给我们的火炬，保持其理想的活力。我们将开始从混乱中重建俄罗斯，尽管这条道路将是艰难的。人民没有医疗保健，他们死于几十年前已经有疫苗的常见疾病。我们的人民相信自己被邪恶的威胁所击败。对此，我要说，我们必须让我们的国家重新充满自豪感，让它成为一个值得我们自豪的国家！”\n\n杜马中的人们带着兴趣注视着。即使是最右翼和最左翼的激进分子，也都能同意这些基本理念。舒克申继续说到演讲中更具争议性的部分。\n\n“但我们也必须建设一个真正自由、真正民主的国家，为子孙后代！不能让这次选举成为溺毙的威权主义中民主的最后挣扎。我们只是踟蹰地拥抱民主，而一心只顾自身利益的寡头企业的重压束缚着我们。曾经帮助建立我们国家的西洛维基寡头，如今却寻求主宰和控制属于俄罗斯人民的一切。这是不能容忍的！我们不能让人民苦苦挣扎。如果我们真正希望拥有一个每个人都能为之自豪的国家，它必须为人民提供教育，照顾他们的健康，使他们爱国并为之奉献。”\n\n随即，农工党的代表们开始大声鼓掌和欢呼，但房间里的其他人却安静多了。然后，代表自由派的社会自由党开始恭敬地鼓掌，随后是代表左翼的民主社会党。很快，如火如荼，绝大多数代表开始鼓掌，甚至起立。舒克申对一个新的、多元化的俄罗斯充满自豪和希望。"
 Shukshin_unification.10.a:0 "谢谢大家，你们的信任不会错！"
 Shukshin_unification.11.t:0 "繁荣的世界"
 Shukshin_unification.11.desc:0 "自由主义理想是什么？这是安纳托利·科里亚金经常被问到的问题。左派问道，他们的政党与主张改革却反对广泛变革的农工党有何不同？右派问道，他们与民主社会党中的社会主义者有何不同？难道仅仅是政策的气质吗？仅仅是为专业人士和教授们在任何政策上犹豫不决的折衷方案吗？\n\n不是！这是自由主义的理想，一个梦想！自由主义梦想是一种精英政治，所有的男人和女人生而平等，任何人都可以成功，但所有人都会得到照顾。它不像社会主义者那样憎恶商业，也不渴望某种理想化的集体管理。它也不像裙带资本家那样神化等级制度。自由主义者认为竞争和合作是相互关联的，创造出新的比较优势，从而推动创新的巨大飞跃！\n\n但自由主义者也相信，所有人都应该有生存的权利，如果他们有勇气、毅力，他们就能迈向成功！这才是真正的精英政治，真正的民主社会！任何人都可以真正成功。俄罗斯社会自由党将建立一个温和而有竞争力的社会，开启一个新时代。在共产主义和各种专制主义导致灾难的地方，多元和资本主义社会将引领俄罗斯迈向新的时代！"
 Shukshin_unification.11.a:0 "激进的希望"
 Shukshin_unification.12.t:0 "向劳工的遗产致敬"
 Shukshin_unification.12.desc:0 "列昂尼德·康托罗维奇独自坐在办公室里，他的办公桌上堆满了文件和文件，他驼背着身子检查着一份预算提案。随着新宣布的政党注册和正式的政治纲领，作为民粹派右翼领袖，他的责任变得更加重大。单单对党派的新兴兴趣就产生了足够多的文书工作，使他的工作空间变得一团糟，就像他的头脑一样。当然，这是他早已习惯的感觉。\n\n他初涉政治界的经历仿佛已经过去了几辈子。他首次在科米共和国的执政联盟公共部门找到了一个位置，凭借自己的数学背景证明了自己对保护瑟克特夫卡尔微薄经济繁荣非常重要。他对政策中的数字和数据的偏好为他提供了一套强大的技能，可以将DSNP的理念适应共和国的现实。\n\n他工作的同时，乌拉尔地区的消息稀少，但这并没有阻止工人起义和民粹派镇压的传闻传到康托罗维奇的耳朵里。当联邦吞并西部的事实变得不可避免时，他准备迎接最坏的情况，但随着再统一的最后几个月的来临，变化也随之而来。\n\n也许总统对西比尔太过友好，对扼杀国家的企业暴徒过于容忍，但康托罗维奇欣赏他所为之战斗的事业。正是舒克申的政策使民粹派从毁灭的边缘回到了正轨，远离了他们背地里的极端倾向。取而代之的是一个真正的政治运动，即俄罗斯民主社会党，为康托罗维奇提供了一个重新参与政治的机会。\n\n在解决国家困境的过程中，有一个密码需要破解。为了人民的生存，不能让金钱在企业贪婪的深渊中再燃烧了。只需要恰到好处的触动和正确的解决方案，联邦就能为每个人服务。\n\n康托罗维奇继续整理文件。在国家如此急切地需要解决困境的时候，他不能休息。共和国失败了。以前的民粹派失败了。布哈林失败了。他不能再让俄罗斯失望了。"
 Shukshin_unification.12.a:0 "再一次机会。"
 Shukshin_unification.13.t:0 "剥去翅膀的猎鹰"
 Shukshin_unification.13.desc:0 "位于新西伯利亚市中心，突入天空的现代玻璃幕墙建筑无疑是新成立的全俄爱国党的总部。大厦的墙壁上摆放着调谐到当地新闻台的电视机，贝塔玛磁带播放着党的口号音频：“就业、增长和国家”。\n\n在光鲜亮丽的大堂之外，有几个大型会议室，中央讲台被一排排带有椅子的桌子所环绕，座位上坐满了过去的部长和领导人，都是来自西罗维基行政部门的。C级高管和来自凤凰的代表们观察着会议，党的官僚准备站到讲台上讲话。\n\n“我们第一次党代表大会的结果已经出来了，毫无疑问地做出了决定。亚历山大·波克雷什金，你在对抗瓦西里·舒克申的选举中失败，这已经对联邦及其领导人的利益构成了无法容忍的威胁。今天聚集在这里的人以2比1的投票结果决定选举一位新的领导人，将党引导离开你的失败。”屋子里充满了窃窃私语和一些倒抽气的声音，前总统不屑地盯着眼前。一个戴着眼镜、身材魁梧的男人站起来走到房间前面，波克雷什金气愤地离开。他匆忙拿起麦克风，向人群致辞。\n\n“朋友们，感谢你们给我领导这个杰出团体的机会。我将简短地说，过去我们所使用的控制人民的残酷方法在如今不会再行之有效。不，我们需要不同的方式，一种能够在我们的监督之外让人民生活和繁荣的方式，由士兵保护，由我们指导，对股东来说也是安全的。”掌声响彻整个房间，伴随着一个名字的窃窃私语：叶夫根尼·普里马科夫。\n\n波克雷什金离开了他现在已经不再属于他的党派办公室。他们认为剥夺他的权力和影响力会很容易，这些阴险的混蛋，但他仍然是副总统，他认识一位老朋友，他会很高兴看到这样一位受人尊敬的人物在他身边并支持他平台，如果从更务实的角度来看的话。"
 Shukshin_unification.13.a:0 "新型爱国者。"
 Shukshin_unification.14.t:0 "偶像主义"
 Shukshin_unification.14.desc:0 "尼科靠在办公桌上，全神贯注地听着他从已故父亲那里继承下来的收音机。他的父亲曾是一名红军士兵，在西俄罗斯战争期间曾在叶戈罗夫的麾下服役。他是一位坚定的共产主义者，在西俄罗斯统一战争中牺牲。而尼科则崇拜起俄罗斯联邦总统瓦西里·舒克申。\n\n自从阿尔汉格尔斯克沦陷以来，尼科开始支持这位为所有俄罗斯人民自由而战、在联邦议会大厅与力量机构斗争，并挑战西方德国人的人。他永远不会忘记总统在俄罗斯联邦宣言后发表的讲话。\n\n“俄罗斯已重获统一！”这是这个年轻男孩永远铭记的话。\n\n很快，播放在他父亲旧收音机上的歌曲渐渐消失，广播员开始发言。\n\n“希望你们喜欢刚才由俄罗斯新星爱德华·阿尔捷米耶夫演唱的另一首精彩歌曲。现在，来自他位于新西伯利亚的家中，舒克申总统将就一项拟议中的法案发表讲话，该法案将改革联邦工人的权益。”阿尔汉格尔斯克广播的声音宣布道。\n\n尼科微笑着更加贴近收音机，总统的声音从扬声器中传出。"
 Shukshin_unification.14.a:0 "总统讲话。"
 Shukshin_unification.15.t:0 "死亡与疾病"
 Shukshin_unification.15.desc:0 "啧"
 Shukshin_unification.15.a:0 "医保不应该以盈利为目的。"
 Shukshin_unification.15.b:0 "“这是可以改革的。”"
 Shukshin_unification.16.t:0 "医保国策"
 Shukshin_unification.16.desc:0 "“shukshincare”（舒克申医保），也称为“负担得起的医保法案”"
 Shukshin_unification.16.a:0 "你开玩笑呢？"
 Shukshin_unification.17.t:0 "控制药品价格"
 Shukshin_unification.17.desc:0 "行吧，得确保那些药企不会把你骨灰给扬了"
 Shukshin_unification.17.a:0 "好吧，再也不会那么糟了"
 Shukshin_unification.18.t:0 "我提议一项全民健康服务系统"
 Shukshin_unification.18.desc:0 "如果我们根本就没有保险呢？"
 Shukshin_unification.18.a:0 "这很像克莱门特·艾德礼的国民健康服务"
 Shukshin_unification.19.t:0 "我们要更多医保！"
 Shukshin_unification.19.desc:0 "你知道吗？如果你给服务业投入更多的资金，他们会做得更好。"
 Shukshin_unification.19.a:0 "紧缩政策很糟糕，哈哈"
 Shukshin_unification.20.t:0 "值得铭记的夜晚"
 Shukshin_unification.20.desc:0 "米哈伊尔紧紧抓住母亲的手臂，凝视着被冬日雪花覆盖的城市。多年前，他经常呆在室内，通过房间的窗户与他的家乡彼尔姆市隔离开来。他没有任何朋友，他的唯一伴侣是他的父母和他的书籍收藏。当联邦最终解放了彼尔姆，他在那些年间感受到的焦虑消散了。\n\n今天是个特殊的日子。他和父母在队伍中等待，小男孩随着时间的推移越来越困惑。他看到许多其他成年人，他们都为某个建筑物感到兴奋不已。几分钟后，米哈伊尔终于鼓起勇气问他的母亲他们在这里做什么。\n\n“我们要去参加一个文化节，对我们来说非常重要。我保证你会玩得开心。那里会有非常美味的食物和有趣的音乐供你欣赏，所以振作起来，好吗，米莎？”他的母亲回答道。\n\n在等待了更漫长几分钟后，他们走进了一个名为“彼尔姆火鸟”的建筑物。里面散落着无数桌子，上面铺着美丽的桌布，摆放着银器和瓷盘。他们是在某种宫殿里用餐吗？一个友善的人把他们一家带到了一个桌子旁边，然后，一个头发斑白、手中拿着三角吉他的老人登上舞台。\n\n“在这美好的夜晚，我们的第一首歌是经典老歌《卡琳卡》！”他的父母和火鸟里的其他人一起欢呼。吉他弹奏着每一个音符，随着欢快的曲调上下跳跃，米哈伊尔想站起来跳舞！但他想了想，决定加入其他人的鼓掌声。\n\n最后，米哈伊尔看着桌子上的一张纸牌菜单，但坦率地说，他无法理解这些菜品。“布林尼？这是什么，妈妈？”米哈伊尔的父母一度露出失望的表情，然后他的父亲开口说道：“这是一种食物，就像某种蛋糕。我们以前一直吃它，米莎——在那些纳粹出现之前。”\n\n他的母亲握着他的手，“是的，现在我们终于可以平静地生活，可以出去了，米莎。随着我们周围的和平，你父亲和我有一件非常令人兴奋的事情要告诉你……”"
 Shukshin_unification.20.a:0 "“你要当哥哥了！”"
 Shukshin_unification.21.t:0 "缺失的一环"
 Shukshin_unification.21.desc:0 "舒克申叹了口气，翻阅着来自各个州的选举报告。尽管他们以相当大的优势赢得了胜利，但无可否认，双方都利用了如选区划分不当等策略，在某些州获得了不公平的优势。本应是对全俄爱国党的一次彻底胜利，却变成了一次相当可观但仍不稳固的胜利。更不用说西罗维基注入了多少资金到媒体中。\n\n随着头痛的加剧，他的眼睛越来越疲惫，艰难地阅读着一份又一份报告。与波克雷什金的会议以及他们鲁莽的决定让舒克申喝下了许多许多瓶酒，让他带着剧烈头痛醉了一次。这种头痛只会因为改革选举制度的困难而更加严重，而任何改革都将面临反对，甚至来自自己的党派！一旦掌握了权力，他们就相信自己永远不会离开。舒克申担心这种态度会影响到他的盟友。\n\n头痛不已的总统将手插进外套口袋，摇摇晃晃地走到窗前呼吸新鲜空气。巴尔瑙尔的景色一如既往地美丽而矛盾。森林和田野一直延伸到地平线的尽头，而混凝土和钢铁的丛林则在另一边。\n\n舒克申冷静下来，翻阅着桌上一叠信件，直到一封引起他注意。这是一份关于迈向普选的提案，考虑到俄罗斯的传统社会，这是一个相当大胆的提案。但传统曾经多次辜负了俄罗斯，激进的改变也一样。舒克申思考着，并开始起草一项法案的雏形，一个将确保俄罗斯的每个人平等地发表意见的法案。"
 Shukshin_unification.21.a:0 "“啥时候开始写呢？”"
 Shukshin_unification.22.t:0 "逻辑与理性"
 Shukshin_unification.22.desc:0 "一些新想法"
 Shukshin_unification.22.a:0 "呃，实际上..."
 Shukshin_unification.23.t:0 "科学至上！"
 Shukshin_unification.23.desc:0 "比尔！比尔·奈！那个科学家！"
 Shukshin_unification.23.a:0 "比尔·奈，那个科学家"
 Shukshin_unification.24.t:0 "布里亚特的新景点"
 Shukshin_unification.24.desc:0 "吹过阿尔汗艾山的微风是一阵暖风，使得气温适宜散步。在一年前，布彦更喜欢这样的天气，因为那意味着可以走到纳洛哈佐德，听着树下的鸟儿叽叽喳喳，然后进行漫长的冥想，以此在这个混乱的世界中获得内心的平静。然而，自从整个地区成为国家公园之后，暖和的天气意味着游客蜂拥而至，想要一睹他们完全不了解的习俗。\n\n“这里……”布彦对带领上了石阶的二十多人解释道，“是通往纳洛哈佐德的寺庙之门。”他指着一块形成粗糙圆形的岩石结构，朝那里朝圣者会通过。“当你穿过这个门，你进入了守护神阿尔汗诺夫·登珠的世界，一个治愈和冥想的地方。”解释完后，布彦小心地把手放在背后，将注意力重新转向游客。“有什么问题吗？”他们大多没有在认真听他说话。他们拿出相机，拍摄门和门后的神龛。有些人还带来了零食。在门的对面，有一个人正在神龛周围绕圈走动，引起一些人咯咯的笑声。看到这一幕，布彦的心里充满了愤怒，看到这群人对待他们的神圣传统如同对待嘉年华一样。然而，他无能为力。他选择为国家公园工作，希望能够保持他们的传统受到尊重，他将尽力确保这一点。\n\n“请确保以尊重和崇敬的态度对待这片区域，”布彦解释道，尽管只有一半的人在听他说话。“这片土地是一个神圣的地方，每年有许多朝圣者来此参观。现在，请随意探索这片区域，但请确保不要打扰正在进行仪式的人。”\n\n这群人急切地想多看看神庙，他们中的大多数人想都没想就冲进了大门。布彦看着一个男人把一袋坚果的包装纸扔到下面的石头上，完全无视了他旁边的“禁止乱扔垃圾”标志。"
 Shukshin_unification.24.a:0 "登珠的心情很沉重。"
 Shukshin_unification.25.t:0 "庆祝和准备"
 Shukshin_unification.25.desc:0 "阳光透过会议室的天窗洒下来，联邦执政联盟成员聚集在这里，就像许多天前一样。房间里洋溢着微笑和热情的握手，与过去的尴尬形成了鲜明对比。舒克申热情地欢迎他的战友，微笑着迎接科里亚金和康托罗维奇，尽管这两个人并不那么热衷于见面。各个政党的代表们相互之间已经非常熟悉，甚至可以直呼其名，党派之间的分歧几乎只是一种形式上的存在。\n\n会议的轻松氛围变得更加明显，社会自由党官员拿出了一杯香槟。许多人，特别是民主社会党的成员，对此表示抗议，但很快房间里的所有人都同意举杯祝酒。联盟毫无疑问取得了许多伟大的胜利。在如此短的时间内，多年乃至几十年来的西罗维基压迫已经开始淡化。选举权得到了彻底改革，医保水平达到了俄罗斯历史上前所未有的水平，联邦的劳动力和土地终于开始从巨企造成的伤痕中恢复过来。房间里的许多人都不敢相信他们会走到这一步，更不用说如此迅速地达到这一步了。\n\n随着欢呼和庆祝活动的逐渐结束，讨论治理事务取而代之，房间里渐渐安静下来。\"我们的胜利当然不能被低估，但普里马科夫和他的手下继续在每一个转折点上削弱我们的力量。\"科里亚金的一席话引起了一片赞同的咕哝声和窃窃私语。\"我们可能已经赢得了这场战斗，但战争还在继续。\"\n\n\"你有什么建议？孤立存在于杜马中的西罗维基盟友只会让我们的斗争更加艰难。\"舒克申回答道。\n\n\"不，不，问题不在西罗维基身上。\"康托罗维奇的话引起了惊讶和抬起的眉毛。\"如果不是凤凰的‘捐赠’源源不断地涌入，他们就不会阻挠我们的立法。我们不能绕过企业的权力，也不能阻碍它所能影响的事情。不，如果我们要战胜他们的贪婪，必须直接攻击。\"\n\n大厅里陷入了沉默。\"给我们解释一下吧，\"舒克申说，秘书们开始听写记录。"
 Shukshin_unification.25.a:0 "划时代的法案。"
 Shukshin_unification.26.t:0 "睁大眼睛，张开耳朵"
 Shukshin_unification.26.desc:0 "塔蒂亚娜优雅地走进她丈夫的书房，脸上挂着一抹瓷般的微笑。她手中端着一盘滴着香草汁的烤肉，油脂在木盘上滴落，搭配着黄油土豆和美酒，就像珍珠在新娘的脖子上跳动一样。然而，当她穿过缠绕的雪茄烟雾时，丈夫几乎没有给她一瞥。\n\n康斯坦丁，她的丈夫。真是个笑话。他只关心两件事：他作为托木斯克市警察局长的职位，以及他对农工党的\"不法行为\"的痴迷。所以，就像每个晚上一样，今晚也是如此。\n\n德米特里·米哈伊洛夫上校是塔蒂亚娜家经常光顾的客人，此刻他已经酒醉得摇摇晃晃了。\" - 现在他们正在审计我的别墅。他们说我贪污公款，真是胡说八道！\"这位年长的男人的第二下巴垂到了胸口，他将雪茄烟头敲在烟灰缸里。\"以前从来没有这种问题！而且，难道农工党的人从来没有为了维持战备状态多拿一点？从来没有在授权书上漏签字？那些伪君子们——\"\n\n塔蒂亚娜的丈夫举起手打断了他的话。\"没必要生气，我的朋友。来吃点东西吧。\"康斯坦丁示意妻子将盘子放在最近的桌子上。然而，他一直与朋友保持眼神交流。\"我会让塔蒂亚娜为我们做些甜点。至于调查，不用担心。我会找我的朋友在档案部门帮忙。只要你需要让舒克申的手下别纠缠你，你都会得到帮助的。\"他微笑着说道。\"亲爱的，你为迪姆卡做个派吧？还剩有一点接骨木果，对吧？\"康斯坦丁挥手示意妻子离开，并没有等她回答。\n\n塔蒂亚娜咽下喉咙里的哽咽，点点头，然后离开了客厅。但当她重新进入厨房时，修剪整齐的指甲已经点燃了炉子里的煤气，她从眼角余光注意到了什么。电话已经有点泛黄，放在她最喜欢的砧板正上方的支架上。因此，当她在板上撒面粉并开始从无到有地变出馅饼皮时，她将听筒夹在肩膀和耳朵之间，然后拨通了电话。"
 Shukshin_unification.26.a:0 "请问，这是内政部吗？我想报案。"
 Shukshin_Lidiya.1.t:0 "深夜"
 Shukshin_Lidiya.1.desc:0 "月亮升到了新西伯利亚城上空。夜晚还很年轻，但瓦西里·舒克申在他的办公室里却辛勤工作着。他筛选各种文件，仔细阅读并签署文件。总统看上去疲惫不堪。最近他睡眠不足，而最近几周文件似乎堆积得更多了。他的糟糕睡眠时间表也没有逃过工作人员的注意。就连波克雷什金也开始纠缠他休个晚上。\n\n门开了，秘书斯维特兰娜手持公文包走了进来。\n\n\"舒克申总统，在我下班之前有什么需要您的吗？\" 年轻的秘书问道。\n\n\"没事，斯维特兰娜，\" 瓦西里从一堆乱糟糟的桌子上抬起头，看着这位年轻女子。她似乎相当焦虑。\n\n\"一切都好吗？\" 瓦西里问道。\n\n\"哦，我没事，总统先生。我只是期待今晚。我和我的伴侣要一起出去看一部美国电影！我想它叫做《人猿星球》。这个名字很傻，但很令人兴奋！\" 她充满热情地回答道。\n\n\"那好，祝你晚安。代我向彼得问好。\"\n\n\"好的，谢谢。请您努力休息一下，瓦西里。大家都很担心您的健康。亚历山大和阿梅特经常问我这个问题。\"\n\n斯维特兰娜离开办公室时，瓦西里沉默不语。总统低头看着自己的文件，但只凝视了几分钟后叹了口气并转过身去。他望着窗外，看到秘书奔向她的伴侣彼得的怀抱。作家微笑了一会儿，然后又看向办公室。对大多数人来说，他的办公室看起来很豪华，很有总统气派。\n\n对瓦西里来说，它却……空荡荡的。"
 Shukshin_Lidiya.1.a:0 "又是一个寂寞的夜晚"
 Shukshin_foreignpolicy.1.t:0 "世界是个舞台"
 Shukshin_foreignpolicy.1.desc:0 "瓦西里从摩天大楼的阳台上俯瞰着新西伯利亚的辽阔壮丽景色。他微笑着，抿了一口手中的伏特加。天啊，它有多辣！但它燃烧得像新西伯利亚一样，充满活力、温暖、恨意与爱意、自豪，它让你感到活着，并迫使你与它共存。这是一种能够改变你的饮料，这也是一座能够改变你的城市。\n\n波克雷什金敲了敲阳台门，走了出去。“你在想什么？”\n\n舒克申对他的老朋友微笑着。“俄罗斯之外的世界。”他靠在阳台的玻璃栏杆上。“我们不能一个人俯冲到纳粹群中。俄罗斯需要盟友，我们能够信任、进行贸易和共同生活的人。”\n\n亚历山大摇了摇头。“盟友是一回事。但我经常想到...一个势力圈。”他喝了一口自己的伏特加。“一个我们可以进行贸易的地区，是的。但它要听我们的指挥。要把我们当作领导者。不是美国人，不是日本人。是我们自己。我们自己的OFN。”\n\n“在某种程度上，是的。”舒克申叹了口气，低头看着玻璃杯。“毫无疑问，世界正在变化。当我们夺回莫斯科时，我们对华盛顿还有用吗？东京还会允许我们在公平的市场上与他们竞争吗？他们还会让我们的人民繁荣吗？这些思考一直在我脑海中。”\n\n波克雷什金拍了拍总统的肩膀。“我同意，老朋友。你并不是俄罗斯唯一一个意识到这个事实的人。见鬼，除了和平主义者之外，每个人都意识到全球就像一个市场——只有强者才能生存下来，变得富有，并继续战斗。一个经济体中只能有一个顶级掠食者。”他望着新西伯利亚闪烁的灯光。“那么，我们下一步的目光将会投向哪里？”\n\n舒克申咧嘴一笑。“我们祖国的老邻居。联邦应该看向南方了。”"
 Shukshin_foreignpolicy.1.a:0 "“是时候夺回哈萨克斯坦了。”"
 Shukshin_foreignpolicy.2.t:0 "地区报告：哈萨克内战"
 Shukshin_foreignpolicy.2.desc:0 "俄罗斯联邦国防部\n发布日期：[GetDateText]\n\n简报：\n尽管哈萨克苏维埃社会主义共和国在第二次世界大战中完好无损地幸存了下来，但它一直受到严重的社会和政治不稳定的困扰，这主要是由于定居的俄罗斯少数民族与土生土长的哈萨克多数民族之间的紧张关系。最近，这些紧张局势爆发为全面内战，迫使我们不得不采取措施，因为越来越多的难民涌入我国边境。\n\n新生的哈萨克国防军由萨加达特·努尔曼加别托夫领导。初步报告显示，只要哈萨克人民的自决权得到承认和尊重，努尔曼加别托夫愿意与俄罗斯联邦谈判。反对他的是以米哈伊尔·索洛门采夫为首的苏维埃共和国残余势力。外交部坚信，苏维埃的胜利虽然有利于俄罗斯少数民族，但不仅会威胁到联邦的稳定，而且会威胁到整个中亚地区的稳定，损害我们在该地区的重建和维和努力。\n\n结论：\n国防部强烈建议迅速、果断地向俄罗斯提供军事和民事援助，以确保俄罗斯在该地区的利益。一旦努尔曼加别托夫和他的部队取得胜利，我们将利用我们的外援谈判一个有利的解决方案，将联邦的理想带到哈萨克斯坦，同时仍然确保努尔曼加别托夫独立哈萨克斯坦的愿望不受侵犯。"
 Shukshin_foreignpolicy.2.a:0 "明白了"
 Shukshin_foreignpolicy.3.t:0 "地区报告：哈萨克内战"
 Shukshin_foreignpolicy.3.desc:0 "俄罗斯联邦国防部\n发布日期：[GetDateText]\n\n简介\n尽管哈萨克苏维埃社会主义共和国在第二次世界大战中完好无损地幸存了下来，但它一直饱受严重的社会和政治不稳定的困扰，这主要是由于定居的俄罗斯少数民族与土生土长的哈萨克多数民族之间的紧张关系造成的。最近，这些紧张局势爆发为全面内战，迫使我们不得不采取行动，因为越来越多的难民涌入我国边境。\n\n苏维埃共和国的残余势力目前由“保护苏联组织”领导，领导人是尼古拉·谢洛科夫，尽管他对苏维埃忠心耿耿，但人们发现他对自己的意识形态忠诚度有些淡漠，怀疑他愿意与任何形式的非法西斯政府谈判。与他对立的是由哈萨克民族主义者和共产主义者联合领导的哈萨克社会主义共和国。外交部坚信，哈萨克的胜利不仅会威胁到联邦的稳定，还会威胁到其在中亚地区的持续利益。\n\n结论：\n国防部强烈建议提供迅速、果断的军事和民事援助，以确保俄罗斯在该地区的利益。一旦谢洛科夫和他的部队取得胜利，我们就可以利用这些支持建立并巩固对中亚地区的全面控制。最有可能的结果是将哈萨克斯坦完全并入联邦。虽然这肯定会保证游击队的继续存在，但坚持哈萨克自治会疏远我们与谢洛科夫和北方俄罗斯少数民族的关系。"
 Shukshin_foreignpolicy.3.a:0 "明白了"
 Shukshin_foreignpolicy.4.t:0 "地区报告：哈萨克内战"
 Shukshin_foreignpolicy.4.desc:0 "俄罗斯联邦国防部\n发布日期：[GetDateText]\n\n简报：\n尽管哈萨克苏维埃社会主义共和国在第二次世界大战中完好无损地幸存了下来，但它一直受到严重的社会和政治不稳定的困扰，这主要是由于定居的俄罗斯少数民族与土生土长的哈萨克多数民族之间的紧张关系造成的。最近，这些紧张局势爆发为全面内战，迫使我们不得不采取行动，因为越来越多的难民涌入我国边境。\n\n苏维埃共和国的残余势力由米哈伊尔·索洛门采夫领导，他是一名强硬的共产主义者和亲俄政治家。由于这些见解，该部坚信，苏维埃的胜利将威胁到联邦及其所在地区的稳定，使哈萨克斯坦人民继续遭受专制和社会主义统治。反对他的是哈萨克社会主义共和国，由哈萨克共产党人朱马别克·塔沙涅夫领导。该部还认为，哈萨克斯坦的胜利将使俄罗斯北部少数民族进一步遭受报复性暴力和迫害。\n\n结论：\n国防部认为，为了确保哈萨克斯坦乃至整个中亚地区的长期繁荣，有必要采取全面的军事行动。由于内战仍在继续，预计武装干预的阻力很小。不过，适当的计划和执行对于防止不必要的人员和物资消耗还是至关重要的。本文件附有一份关于苏联和哈萨克斯坦军队的规模、人数和弱点的完整报告，以及拟议的联邦部队调动情况。"
 Shukshin_foreignpolicy.4.a:0 "明白了"
 Shukshin_foreignpolicy.5.t:0 "地区报告：哈萨克斯坦共和国"
 Shukshin_foreignpolicy.5.desc:0 "俄罗斯联邦国防部\n发布日期：[GetDateText]\n\n简报：\n苏联解体后，哈萨克斯坦（正式名称为哈萨克苏维埃社会主义共和国）在丁穆哈梅德·库纳耶夫的领导下保持事实上的独立。NKVD首领帕维尔·菲廷上台后的内部斗争极大地加剧了俄哈民族矛盾，菲廷去世后，这些紧张局势演变成萨加达特·努尔马甘别托夫领导的哈萨克军队与米哈伊尔·索洛门采夫领导的俄罗斯军队之间的武装冲突，前者成功击溃了后者，建立了哈萨克斯坦共和国。\n\n这个新政权在执政的头几年面临着许多问题。土匪、饥荒和日益叛乱的俄罗斯少数民族都困扰着哈萨克斯坦共和国。目前，努尔马甘别托夫在人民中拥有绝对的权力，由于他是哈萨克族的战争英雄，因此受到人民的崇拜。阿拉木图和克孜勒奥尔达等主要城市中心充斥着犯罪和贫困，而北部农村则仍然是反政府民兵和匪帮聚集和袭击的天堂。哈萨克军方一直无法有效镇压这些武装力量，只能依靠过时的装备和战术来有效保护其国土安全。\n\n结论：\n军事干预被认为是不必要的，因为哈萨克政府目前对联邦不构成威胁。虽然干预肯定会解放生活在哈萨克斯坦北部地区的受压迫俄罗斯人，但我们的计划人员预计，如果我们进行干预，亲哈萨克部队将面临一场旷日持久的游击战。此外，虽然努尔马甘别托夫及其反俄言论确实在外交上疏远了我国，但在努尔马甘别托夫接受俄罗斯维和部队进驻哈萨克斯坦共和国的前提下，现阶段不应排除可能达成“防御性协议”的可能性。"
 Shukshin_foreignpolicy.5.a:0 "明白了"
 Shukshin_foreignpolicy.6.t:0 "地区报告：哈萨克社会主义共和国"
 Shukshin_foreignpolicy.6.desc:0 "俄罗斯联邦国防部\n发布日期：[GetDateText]\n\n简介：\n尽管哈萨克苏维埃社会主义共和国在第二次世界大战中完好无损地存活了下来，但却一直饱受严重的社会和政治不稳定的困扰，这主要源于定居的俄罗斯少数民族与土生土长的哈萨克多数民族之间的紧张关系。随着长期担任共产党主席的丁穆哈梅德·库纳耶夫下台，国内各民族之间爆发了全面内战。在这场冲突中，哈萨克本土派似乎取得了胜利，宣布建立一个真正的“哈萨克社会主义共和国”，以永远对抗俄罗斯的“侵略”。\n\n目前，该共和国的领导人是第一书记朱马别克·塔沙涅夫，他是一名强硬派共产主义者和哈萨克民族主义者。他的政权对俄罗斯在该地区的利益构成威胁，只要联邦希望确保这些利益，就不能允许其存在。此外，塔沙涅夫刚刚摆脱冲突，预计其抵御潜在武装干预的能力微乎其微。\n\n结论：\n国防部认为，为了确保我国在哈萨克斯坦的长期利益以及中亚地区的持续稳定，有必要采取全面的军事行动。应立即开始秘密行动，建立一个有组织的俄罗斯抵抗网络，以保证行动尽快开展。本文件附有一份关于哈萨克斯坦军队的人数、规模和弱点的完整报告，以及拟议的联邦部队调动情况。"
 Shukshin_foreignpolicy.6.a:0 "明白了"
 Shukshin_foreignpolicy.7.t:0 "地区报告：阿拉木图自治政府"
 Shukshin_foreignpolicy.7.desc:0 "俄罗斯联邦国防部\n发布日期：[GetDateText]\n\n简报：\n苏联解体后，哈萨克斯坦（正式名称为哈萨克苏维埃社会主义共和国）在丁穆哈梅德·库纳耶夫的领导下事实上独立。虽然库纳耶夫掌握着名义上的权力，但党内却存在分裂，主要原因是北哈萨克斯坦的俄罗斯人与占多数的南方哈萨克人之间的民族矛盾。党内分裂使得尼古拉·谢洛科夫领导的俄罗斯裔民兵联合会“俄罗斯近卫军”的部队在北哈萨克斯坦煽动叛乱，反对新当选的哈萨克族主席朱马别克·塔申耶夫，随着谢洛科夫巩固其在哈萨克斯坦草原的地位，建立阿拉木图自治区，塔舍涅夫的部队最终投降。\n\n尼古拉·谢洛科夫的治理方式很特别，唤起了人们对苏联的怀念和俄罗斯民族主义。这种文化在主要国家机构中根深蒂固，并体现在执政党“保护苏联组织”的名称中。对什切洛科夫的个人崇拜十分普遍，尤其是在俄罗斯民众中，他们将其视为富有魅力的强人。我们的情报显示，谢洛科夫的亲密顾问认为，谢洛科夫无意将国家作为一个正统国家来管理，而是愿意服从任何务实或中立的俄罗斯政府。\n\n结论：\n由于谢洛科夫似乎已经对加入联邦本土感兴趣，我们最好的选择是与该小国进行谈判。在任何可能的谈判中，都应提议逐步吞并该领土。"
 Shukshin_foreignpolicy.7.a:0 "明白了"
 Shukshin_foreignpolicy.8.t:0 "地区报告：哈萨克苏维埃社会主义共和国"
 Shukshin_foreignpolicy.8.desc:0 "俄罗斯联邦国防部\n发布日期：[GetDateText]\n\n简报：\n尽管哈萨克苏维埃社会主义共和国在第二次世界大战中完好无损地存活了下来，但却一直饱受严重的社会和政治不稳定的困扰，这主要源于定居的俄罗斯少数民族与哈萨克本土多数民族之间的紧张关系。随着长期担任共产党主席的丁穆哈梅德·库纳耶夫下台，国内各民族之间爆发了全面内战。俄罗斯马克思列宁主义者似乎在这场冲突中取得了胜利，宣布恢复“哈萨克苏维埃社会主义共和国”作为苏维埃在中亚的继承国。\n\n目前，该共和国的领导人是第一书记米哈伊尔·索洛门采夫，他是一名强硬派共产主义者和亲俄政治家。他的政权对联邦在该地区的利益构成威胁，只要俄罗斯希望确保这些利益，就不能允许其存在。此外，索洛门采夫刚刚摆脱内战，预计其抵御潜在武装干预的能力微乎其微。\n\n结论：\n国防部认为，为了确保哈萨克斯坦人民的长期繁荣和中亚地区的持续稳定，有必要采取全面的军事行动。应立即开始秘密行动，加强哈萨克在南部的抵抗，以保证行动尽快开展。本文件附有一份关于哈萨克军队的规模、人数和弱点的全面报告，以及拟议的联 邦部队调动情况。"
 Shukshin_foreignpolicy.8.a:0 "明白了"
 Shukshin_foreignpolicy.9.t:0 "地区报告：中亚"
 Shukshin_foreignpolicy.9.desc:0 "俄罗斯联邦国防部\n发布日期：[GetDateText]\n\n简报：\n中亚地区，像前苏联的大多数其他地区一样，陷入了几乎三十年的混乱无序状态。然而，最近一系列事件的连锁反应使得曾经杂乱无章的草原部落再次统一，宣誓效忠自由国家组织。\n\n尽管有人可能认为这意味着我们对中亚的野心必须暂时搁置，但军方高层成员指出，自由国家组织的其他成员无法进入该地区，更别提对我们的主张构成重大威胁了。\n\n结论：\n只需进行精心计划和执行的打击行动，就能再次恢复我们的南方边界。鉴于我们与华盛顿特区的友好关系已经极大降低了自由国家组织直接干预的可能性，升级的可能性几乎为零。"
 Shukshin_foreignpolicy.9.a:0 "我们做我们必须做的事"
 Shukshin_foreignpolicy.10.t:0 "地区报告：中亚"
 Shukshin_foreignpolicy.10.desc:0 "俄罗斯联邦国防部\n发布日期：[GetDateText]\n\n简报：\n中亚各部落曾经在同一旗帜下共存。德国战争机器对这面旗帜进行了践踏和焚烧，犹如德国国防军的剑刺破了曾经团结的亚洲边缘的每一个角落。\n\n因此，让人感到最讽刺的是，正是这个毁灭的工具再次将曾经被它所摧垮的人民团结在一起。我们南方与极权主义一体化的国家成功实现了其残酷征服的野心，现在我们寻求扑灭民族社会主义之火，彻底恢复秩序。\n\n关于这个叛逆国家与德国势力圈之间的关系的初步担忧立即被高级军官驳回，他们指出近年来德国不仅饱受持续不安和经济崩溃之苦，而且其军事无法迅速建立起有意义的存在，无法适时进行干预。\n\n结论：\n只需精心策划并成功实施一次打击行动，我们就能再次恢复南方边境的稳定。面对西方敌人在核心领土上遇到的更加巨大的问题，我们的高级指挥部有信心能够迅速打击并永久削弱这个肿瘤般的德国势力影响，而不需要进一步升级。"
 Shukshin_foreignpolicy.10.a:0 "俄罗斯凤凰的翅膀越来越亮。"
 Shukshin_foreignpolicy.11.t:0 "地区报告：中亚"
 Shukshin_foreignpolicy.11.desc:0 "俄罗斯联邦国防部\n发布日期：[GetDateText]\n\n简报：\n中亚地区像前苏联的其他地区一样，在20世纪50年代解体成为各个军阀。然而，随后出现的这些小国家由于[AFG.GetName]和共荣圈的严重干涉而陷入了无法辨认的无政府状态。\n\n公共服务的状况如此糟糕，以至于我们很容易成为解救人民摆脱正在生活中遭受的盗匪统治的力量。我们的声称尊重他们的人民并带来民主的说法实际上是真实的，不像布尔什维克或干涉的[AFG.GetAdjective]。\n\n结论：\n只需经过适当计划和精心执行的行动，我们就能够再次恢复我们的南部边境。我们很可能根本不会遇到任何抵抗，即使有抵抗，也将极其局部，并且在现代军队面前势单力薄。我们敦促您迅速行动，以免其他势力抢先一步。"
 Shukshin_foreignpolicy.11.a:0 "人民最渴望的是安全。"
 Shukshin_War.1.t:0 "如同俄罗斯一般古老"
 Shukshin_War.1.desc:0 "科斯特罗马从一开始就屹立于此。科斯特罗马在俄罗斯建国之前就已经存在。它经受过动乱时期和火灾的肆虐。它经历了革命的红色热潮和占领的恐怖。从一个军阀国家到俄罗斯的前线，科斯特罗马为今后的任务做好了准备。\n\n谢尔盖·博尔沙科夫站在市政厅的台阶上，观察着成千上万的人在为科斯特罗马“神圣”步兵旅的士兵纵队欢呼。曾经，他是一个被推翻的军阀。现在，他作为通过合法选举上台的科斯特罗马市市长，与他的朋友尼基福尔并肩站在一起。在他们的注视下，俄罗斯之子骄傲地穿过他们家乡城市的街道，每一步都使他们越来越接近第三帝国的边境。\n\n“你知道吗，似乎就在昨天，为了保持和平，我们会不惜一切代价。现在我们在欢呼，因为我们把我们的孩子送回了绞肉机。你怎么能这样，谢尔盖？”他的安全部长不得不问道。\n\n“对未来要有一点信心，”谢尔盖说。“我们的孩子们不是在去送死。他们是在前线为自由而战。如果我们不能向他们表示最诚挚的谢意，你怎么能指望他们打这样的仗？他们准备做出巨大的牺牲，如果没有家人的支持，你怎么能指望他们有意愿去面对这个巨大的挑战？”\n\n博尔沙科夫转身注视着最近的连队前面的旗手。一个人举着科斯特罗马的市旗—— 但在他面前，连队中最强壮的士兵将联邦的三色旗高高举起。风抓住并撕扯着旗帜，威胁着要把它从它的栖息地上扔下来，但薄薄的布料依然坚挺地挂在旗杆上面。\n\n“我明白。但是，谢尔盖，在经历了旧苏联垮台后的一切之后，俄罗斯已经不像以前那样强大了。”尼基弗解释说，试图把他的观点说出来。\n\n“你是对的，”科斯特罗马市市长说话了，当他转过身来面对他的老朋友时，脸上露出了喜悦的笑容。“我们不像以前那样强大了。”"
 Shukshin_War.1.a:0 "“我们比以前更强。”"
 Shukshin_War.3.t:0 "党派协议"
 Shukshin_War.3.desc:0 "“同志们！欢迎来到被占领的莫斯科地区第三次联合工人代表大会，”波贝达·西多罗夫微笑着宣布。他高高地站在比沙森林中间的一个断掉的树桩上。他的听众将近四百名，有游击队员，有士兵，也有起义者，但他们一个月来没有一个人洗澡。就像他喜欢的那样。\n\n“我们要处理的第一件事是——”\n\n“等会！”一个女人喊道。天啊，是艾德亚。“我们的首要任务，实际上也是唯一的任务，应该是让这次代表大会中的修正主义分子重新融入人民解放军。”\n\n西多罗夫无奈地叹了口气，“艾德亚·弗拉基米罗夫娜·戈卢别娃，我们每次讲话，你都坚持试图就修正主义展开斗争。我们就不能把注意力放在德国人身上吗？”\n\n“不，我们不能，”戈卢别娃说道。“如果不首先建立无产阶级的社会平台，我们怎么能解放莫斯科人民？如果不为莫斯科人民提供一条通往自由的道路、全面的社会战略和建设社会主义的计划，我们怎么能宣称解放了他们呢？”\n\n“很好，”西多罗夫说道。\n\n“让我们投票表决吧。你们中有多少人认为布哈林是修正主义者？”三分之一的人举起了手。“有多少人认为自己是布哈林主义者？”西多罗夫问道。聚集的男女中有一百五十人举手。“你们中有多少人认为自己是无政府主义者？”八十只手飞向空中。“有多少托派？”五十只手。“斯大林主义者多少？”四十四人。“卢森堡主义者多少？”三十三人，还有一个不确定。“毛派有多少？”七十六个。“多少工团主义者？”二十二人，几乎都是无政府主义者。“有多少人，”西多罗夫说，“想看到那些该死的法西斯分子滚出我们的国家？”森林里的每一只手都像纪念碑一样挺立着，为他们的战友们提供团结和支持。\n\n“谢谢你们，同志。在民主集中制的基础上，这次大会的第一项工作，就是消灭纳粹武装力量在该地区的势力，长期目标是开垦无产阶级革命的中心地带。戈卢别娃同志，你有什么建议吗？”"
 Shukshin_War.3.a:0 "“让我们言归正传吧！”"
 Shukshin_War.4.t:0 "踏入火海"
 Shukshin_War.4.desc:0 "“女士们，你们还在等什么？圣诞节吗？”车尔尼雪夫少校尖叫道：“我们冲吧！上，上，上！”尼古拉疯狂地试图跟上部队的其他人。火炮的咆哮遮住了太阳，轰隆隆地落在地上。泥泞的泥土在他靴子下打滑，在他周围，无数坦克凶猛地冲锋着。尼古拉迅速举起步枪，砰的一声把另一个德国人送上西天。“科亚！”少校在前面咆哮道，“有你这磨磨唧唧的功夫从勘察加来的人都能跑到莫斯科去了！就不能把屁股动得快点吗？！”尼古拉栽了个跟头，爬起来继续向前冲去，又看见一排来势汹汹的装甲部队，敌人的步兵像蚂蚁一样在愤怒的阴影中爬行。当他们走近时，尼古拉的内脏翻腾着尖叫起来，但他没有时间呕吐。他的战友们在反坦克班装填武器时，都已经趴下了。正当他跌跌撞撞地要向前走时，一只手抓住尼古拉的胳膊，把他拖到地上。“科亚，”他的朋友嘶嘶地说道，“趴下。难道你看不见德国人吗？”\n\n“米沙,我--”\n\n尼古拉的话音被旁边一辆坦克突然发出的轰隆声打断了，那辆坦克似乎是从地底下冒出来的。尼古拉尖叫着翻了个身，徒劳地摸索着他的步枪。直到他看到画在炮塔的双头鹰，听到米沙的笑声，他才意识到这是他们的。“起来,小伙子！”车尔尼雪夫少校跳了起来，俄罗斯坦克从他两边轰隆隆地开过来，“我们去杀一些德国人吧！前进！”尼古拉的血热得像火一样，他和他的同伴们一边跑一边尖叫。\n\n“乌拉！乌拉！乌拉！”\n\n在他的头顶上，喷气机战斗机呼啸着划过，俄罗斯猎鹰在隆隆作响的德国轰炸机群之间穿梭。成排的坦克像波浪一样相互撞击，烟雾和火焰从炮口中跃出。当德国蚂蚁开始从笨重的坦克后面现身时，俄罗斯人的枪林弹雨爆发了。一切都从尼古拉的脑海中消失了，他唯一能集中精力应对的事就是确保他自己能多活一秒。这场战斗可能会持续一个小时，也可能会持续到永远，他不知道这些。"
 Shukshin_War.4.a:0 "但他知道，他每前进一步，俄罗斯就离莫斯科又进一步。"
 Shukshin_War.5.t:0 "残存的一切"
 Shukshin_War.5.desc:0 "格奥尔基在萨金特周围的碎石堆中漫步。在他的时代，他经历过很多冲突，他参加过统一战争，击退过入侵者，但这次战争……相当不同。\n\n毁灭。\n暴行。\n愤怒。\n\n格奥尔基看着周围的尸体。有些是士兵，大部分是平民。有些是德国人，有些是俄国人。反正都死了。士兵紧闭双眼，愤怒地握紧拳头，他试图不去想自己在漫长的战争中犯下的许多罪行的可怕画面。德国士兵躺在地上，乞求饶命。移民们逃离家园，试图逃离破坏。整座满是德国人的城镇都被烧了。他的使命是把他的人民从德国的暴政中解放出来，但他已经变成了曾经他最憎恨的德国人的样子。\n\n总统说的是实话吗？这场冲突是否如他所听说的那样是非黑即白，或者，德国人和俄国人之间并没有太大的不同？总统是一只披着羊皮的狼吗？不，不……他不可能是，对吧？\n\n就在那一刻，格奥尔基跪倒在地。他对策划这场战争的人感到愤怒。他憎恨纳粹，因为它操纵德国人民去仇恨他人。他对自己的政府感到愤怒，因为政府又把他们送回了战场。这不是解放，这是战争。年轻又单纯的孩子们被一群老头子送上战场自相残杀！\n\n格奥尔基叹了口气，双手软了下来。上面的人可能是罪魁祸首，但他才是傻瓜。他愚蠢、狂热，任由他们拿他的缺点当武器，把他送上战场。他被舒克申说服，他以为自己是在为自由而战，然而他现在却被废墟和死去的灵魂所包围。\n\n现在再生气已经太晚了。他在这个世界上剩下的只有悲伤。"
 Shukshin_War.5.a:0 "他们只是一群被游戏玩的傻瓜"
 Shukshin_War.6.t: "自由国家的援助"
 Shukshin_War.6.desc:0 "一艘船在马加丹港口外大声宣布了它的到来。一面旗帜在风中飘扬：六颗白色星星，一条黄色和绿色的条纹，还有一个巨大的蓝色图案。那是悉尼的旗帜，地下的明珠。一个扩音器在空中响起。“嗨，伙计们！这批枪支从澳大利亚来，帮你们打趴那些德国佬！”\n\n伊万虽然懂一些英语，但完全听不懂那个人在说什么。他看起来困惑不解。“这是...一批货物，对吗？”\n\n“你是聋子吗？我就是这么说的，伙计！”\n\n“好的，好的。请给我们这些枪支。”船员们解开了一箱又一箱的步枪和弹药，供俄罗斯人使用。\n\n一名澳大利亚船员在路上停下来和伊万交谈。“你们俄国人保证要把那些德国傻瓜赶回他们来时的地方吗？”伊万默默点了点头。“血誓，伙计！”澳大利亚人狠狠地和伊万握了握手。\n\n“快点回去工作！”一个澳大利亚人命令道，拍了另一个人的背。当他们走回船上时，伊万只能想到一件事："
 Shukshin_War.6.a:0 "他从来没有听过这么奇特的口音。"
 Shukshin_War.7.t:0 "雄关漫道坎斯克"
 Shukshin_War.7.desc:0 "波格丹注视着下面的街道，紧握着他父亲的老式步枪，他观察着在街上狂欢的莫斯科人，他们为莫斯科的黑夜带来了活力。人们似乎并不关心仍在进行的战争，也不关心欧罗巴仍悬于一线的命运。经过几十年的压迫，他们只是为终于摆脱多年来忍受的所有痛苦而高兴。他们不必再忍受奴役和害怕迫害。在他们的生命中，他们第一次品尝到了自由的滋味。\n\n波格丹从未真正感受过压迫。他生长于西伯利亚的寒冷森林，在西伯利亚黑军的统治下生活。在大多数情况下，他一直不受政府的统治。即使当波克雷什金领导的联邦控制了坎斯克时，他和他家人的生活也从未被打扰。他被全俄罗斯军征召去作战，和他的同胞们向西进军，只是为了看看压迫的含义。他看到了。他看到了一片没有自由的土地，一片被种族灭绝政权所征服的土地。这让波格丹感到恶心。\n\n波格丹在莫斯科的时候一直在想他的父亲。他想知道他的父亲是否会以他背井离乡，相应祖国的号召，与德国侵略者作战为荣。波格丹叹了口气，对母亲的思念逐渐消失在他的脑海中。他无法想象她现在的感受。她现在在为自己的儿子的平安祈祷吗？她在为自己的儿子与一个试图把他们的、和舒克申的自由之梦踩碎的凶残敌人交战而感到恐惧吗？\n\n在街上，他看到两个孩子。他们起初很安静，似乎在测试着他们能做什么的界限。随着时间的推移，他们开始玩简单的游戏，当他们知道没有人会试图阻止他们时，他们才变得更加热情。他们开始大笑，在街道上跳来跳去。这些孩子，就像前线的数百万人一样，终于体验到了真正的自由。他们将学会珍惜他们的余生。\n\n这一切都值得为之奋斗，波格丹想到，他的脸上浮现出了一抹笑容。"
 Shukshin_War.7.a:0 "为自由而战是最光荣的事情。"
 Shukshin_postwar.2.t:0 "在联邦中获利"
 Shukshin_postwar.2.desc:0 "柳芭望着教室外面。每走过一张面孔，她心中的忧虑就加重一分。西比尔女巫的职业——一个为她所创造的化名——就是塑造她面前的这些愚蠢之人，使其变成可以驾驭自由市场混乱变化的股市准备人员。今晚的听众中有一些不确定因素。有几个男人，几个女人，他们可能成为有价值的企业家。目前，他们还不够成熟，无法做出正确的判断。她的任务就是改变这一点。\n\n咔嚓一声。她启动了投影仪。第一张幻灯片跃然而出——上面是卡车、货柜和仓库的图示。“今晚的主题是物流。”她说，“也许有些人会担心我们跳过了与服务行业相关的问题。但我向你们保证，物流适用于各个服务领域。物流并不只是手段，而是一种高效的思维方式。”\n\n“让我们从一项思维训练开始。暂且设想你想要开办一家家具生意。你筹集了你的舒克申基金，购买了房产，并建立了一个仓库，用来存放你商店里最好的西伯利亚松木。现在，问题来了。你可以选择本地的供应商，也可以选择距离更远的大型企业供应商，距离约四十公里。你会选择哪一个？”\n\n一个穿着西装的金发男子举起了手。“当然是选择本地的供应商。”\n\n“为什么？”\n\n“因为他们是我认识的人，他们的财富直接影响着我周围每个人的生活质量。”\n\n“那你如何确保他们的业务会与你的业务同步增长，以满足需求？当地的林业法规又如何影响这种扩张？还有其他选择吗？为什么不能与两个供应商同时达成交易？”\n\n“你说那两个选择——”\n\n“这是一种思维方式，朋友。你应该自己挖掘并提出问题，直到拥有一个计划。”"
 Shukshin_postwar.2.a:0 ""
 RAPP.1.t:0 "军心不和"
 RAPP.1.desc:0 "海水在码头下翻滚，永不停息，将海盐和自由的迷人气息洒遍马加丹。两名联邦武装部队的军官互相传递着一瓶廉价伏特加。酒精在两人间流动，他们的良知也随之荡然无存。\n\n陆军官员拍了一下他的临时朋友的背。“你知道吗，我有些好消息。农工党在沃洛格达选举中取得了胜利。”\n\n空军军官翻了个白眼。“瓦西里·伊万诺维奇，有时候我真想把你脸上那个傻笑打掉。”\n\n“你不喜欢舒克申总统吗，尼古拉？”\n\n“不，我不喜欢，”尼古拉说道。他从夹克里掏出一支走私的香烟，点燃后吸了一口。“选举时我投了波克雷什金的票。我一直支持爱国党。”\n\n“为什么呢？”\n\n尼古拉挑了挑眉。“为什么？没有波克雷什金，我们只会成为另一个国家的某个省份。我觉得我有义务回报一下，对吧？”\n\n瓦西里发出一声刺耳的笑声。“当然了。这肯定与西罗维基青睐空军无关。”\n\n“不，不是这样，”尼古拉说。“与陆军不同，我们凭已有之力应付一切。我们不会向政客哀求额外的支持。”\n\n瓦西里摇了摇头。他喝了一口伏特加，看着海洋，将头靠在破旧的木栏杆上。“我觉得你不应该投票给全俄爱国党，”他喃喃自语道。“即使波克雷什金过去做得很好。西罗维基唯一关心的就是填满自己的腰包。”\n\n“不，你不明白，”尼古拉说。“如果没有持续增长的经济，我们将无法拥有高品质的生活。我们需要让企业蓬勃发展。舒克申所进行的每项改革都试图扼杀凤凰公司，屠戮西比尔公司。也许你愿意生活在一个落后的地方，但是我的孩子们应该有一个比你所投票支持的烂民主更美好的未来。”他把香烟扔进了大海。“我受够这里了。回头见，瓦西里·伊万诺维奇。”"
 RAPP.1.a:0 "意见就像混蛋。每个人都有一个，你的朋友不想看到你的。"
 RAPP.2.t:0 "公民选举"
 RAPP.2.desc:0 "“如果西比尔的肥料质量让您不满意，叶戈罗维奇先生，那么我强烈鼓励您去研究一下配方，找个化学家或一头奶牛来合成它，然后开始向您的邻居出售。创业精神永远是答案。”舞台前面的农民们开始嘟囔，有些人表示认同，而其他人则冷笑着摇头。舒克申总统继续他的抱怨。“再说一遍，如果有关西比尔的不法行为的证据，农工党将乐意进行调查，并在合适的情况下执行法律法规。但如果没有证据，我们束手无策。”\n\n一个农民举手示意，在坐的人群中引起了注意。“总统先生，如果我可以插嘴的话。”舒克申向他点了点头。“我感谢您的倾听，但这些声明是站不住脚的。您不是农民，不了解一种合适的肥料应该是怎样的。您的政党充斥着律师、教授和官僚。我不明白你们中的任何人如何能理解我们的需求。”\n\n舒克申点了点头。“我同意。你们中有人试图改变这一点吗？”\n\n“我们试图通过选择您来解决这个问题，总统先生。”\n\n“朋友，你的这一举动非常友善，但我只是一个人，我的政党中充斥着律师、教授和官僚。那些不希望依赖那些他们认为在这些问题上不称职的人的专业知识的人，就必须自己担任职务。我必须说，我同意你所说的一切。我不具备就肥料、降雨或拖拉机维护等问题发表意见的能力。联邦需要像你这样的人来代表你们的生活方式。我们需要来自各个领域的人们尽力参与，以便更好地为公民服务。”"
 RAPP.2.a:0 "联邦将充满不和谐的声音，每个人都在为自己的进步而高呼。"
 RAPP.3.t:0 "在联邦中获利"
