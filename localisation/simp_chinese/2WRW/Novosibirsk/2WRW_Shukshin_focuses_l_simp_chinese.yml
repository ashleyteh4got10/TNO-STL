l_simp_chinese:
 NOV_shukshin_federation_of_hope:0 "希望之联邦"
 NOV_shukshin_federation_of_hope_desc:0 "在几十年的混乱、分裂和绝望之后，新的希望以俄罗斯联邦的形式出现在俄罗斯曾经支离破碎的土地上。 然而，在全国各地，无论是在解放区还是在敌占区，我们的人民都无法断定他们祖国的未来。  \n \n许多人担心，俄罗斯联邦只是自1547年大权独揽的大公首次加冕沙皇后的又一个独裁政权。还有人则认为，联邦只不过是失败的中西伯利亚共和国的秽土转生。 更有甚者错误地将我们的治安措施与NKVD的相提并论。\n\n我们不是昔日恐怖和过去失败的复刻或延续。 我们是俄罗斯联邦，我们祖国至善至美的唯一希望，我们必须在这个黑暗世界中静待良机。"
 NOV_shukshin_laying_the_groundwork:0 "奠定基础"
 NOV_shukshin_laying_the_groundwork_desc:0 "总统的首要任务，以及俄罗斯农工党的任务，是将边缘化的国家杜马完全转变为一个真正代表俄罗斯人民的、完全发挥功能的民主政府。\n\n显然，由于我们希望彻底改革当前的政治机构，遇到了来自西罗维基和俄罗斯公众的反对。\n\n如果我们要继续俄罗斯联邦的民主化进程，我们需要向公众保证，并与其他人共同努力，以实现总统本人所创造的一个术语：\n\n§m务实民主§!"
 NOV_shukshin_introduce_the_concept:0 "引入概念"
 NOV_shukshin_introduce_the_concept_desc:0 "经过§B俄罗斯农工党§!的成员以及总统本人之间的大量争论和计划，就如何实现他们追求的“§m务实民主§!”目标，俄罗斯农工党的总统和高级官员向国家杜马提出了一个概念，旨在回答他们如何实现这些雄心勃勃的目标。\n\n§Y联邦议会§!\n\n这是一个在中西伯利亚共和国早期时期制定的古老概念，它被重新引入政府，经过改进以更好地适应俄罗斯联邦的需求和国家民主化的目标。"
 NOV_shukshin_work_with_the_siloviki:0 "与西罗维基合作"
 NOV_shukshin_work_with_the_siloviki_desc:0 "尽管西罗维基无疑是我们的对手，但他们是俄罗斯第二大具有巨大政治影响力的组织，对整个国家和杜马都有着重大的政治影响力。\n\n如果我们要将杜马改革成符合总统对“§m务实民主§!”的愿景的政府，我们应该与西罗维基的温和派成员接触，以达成妥协，以便让这个新政府能够起步。\n\n§Y即使这意味着让他们在改革后的政治体系中获得更多影响力，我们也要这样做。§!"
 NOV_shukshin_a_deal_with_the_new_parties:0 "与新政党签约"
 NOV_shukshin_a_deal_with_the_new_parties_desc:0 "自从西俄罗斯并入联邦以来，新的政治组织和政党在我们的政府中迅速获得影响力，有些甚至进入了国家杜马。这群人中最强大的政党是和平主义的俄罗斯社会自由党和民主社会主义的俄罗斯民主社会党。\n\n如果我们的目标是建立一个新的、包容的多党政府，以满足“§m务实民主§!”的需要，那么明智的做法是接触这些政党并与他们合作，以组建一个多元民主的联合政府。\n\n§Y即使这意味着在联邦改革后的政治体系中放弃我们自己的一些政治影响力。§!"
 NOV_shukshin_establish_the_party_registry:0 "推广政党登记"
 NOV_shukshin_establish_the_party_registry_desc:0 "除了俄罗斯农工党之外，除了一堆特殊利益集团、松散的政治联盟和军人之外，联邦内部不存在任何合适的政党。 “§m务实民主§!”形成的重要组成部分保持整个体制简洁，同时既高效又民主。\n\n如果我们想让俄罗斯政府的事情相对简单，我们应该为任何希望加入政府的政党制定一套规则和指导方针，以确保联邦在联邦议会中有适当界定的、代表人民的政党。"
 NOV_shukshin_assure_the_nation:0 "向全国致辞"
 NOV_shukshin_assure_the_nation_desc:0 "自从俄罗斯在联邦的旗帜下重新统一以来，除了在竞选期间做出的改革、环保主义和反法团主义的模糊承诺外，俄罗斯大部分地区乃至全世界都不确定舒克申总统的执政意图。\n\n现在是总统在国家和世界面前在新西伯利亚表明立场并向所有人准确揭示重新统一的俄罗斯国家将向前推进的目标的时候了。"
 NOV_shukshin_root_out_corruption:0 "根除腐败"
 NOV_shukshin_root_out_corruption_desc:0 "腐败是一种癌症，一直在慢慢侵蚀联邦的政治和社会结构。在西罗维基统治期间，腐败曾肆意横行，正是腐败使他们能够维持权力统治。\n\n随着他们的退出，是时候开始采取措施应对腐败这一政治病毒了。为此，总统已命令联邦安全局开始对政府进行秘密的内部调查，以铲除政府中最腐败的人，并向那些试图破坏俄罗斯民主的人发出信息：\n\n§Y腐败是不可容忍的。§!"
 NOV_shukshin_restrict_lobbying:0 "限制游说"
 NOV_shukshin_restrict_lobbying_desc:0 "自50年代初联邦成立以来，§Y泰坦§!、§G西比尔§!和§P凤凰§!三大巨企已经利用他们庞大的货币资源来影响国家杜马的官员和政客。\n\n虽然这在亚历山大·波克雷什金的统治下可能是可以接受的，但随着我们对“务实民主”的承诺正在进行中，这种情况不能再继续下去了。\n\n俄罗斯农工党可能没有办法阻止所有企业对俄罗斯人民代表的影响，但我们有办法限制游说并减少他们在政府中的影响力。"
 NOV_shukshin_the_federal_assembly:0 "联邦议会"
 NOV_shukshin_the_federal_assembly_desc:0 "舒克申就任总统已经过去了很长时间，终于，他和农工党终于取得了祖国统一以来的第一个重大胜利。\n\n§Y联邦议会正式成立§!\n\n它是实现“§m务实民主§!”任务的第一个主要部分，旨在代表俄罗斯人民的意愿并确保在联邦内部维护民主原则。\n\n随着第一个主要障碍的解决，我们现在可以开始将注意力转移到联邦中需要政府关注的其他重要问题上，并为俄罗斯人民带来一个更好的俄罗斯。"
 NOV_shukshin_an_equal_federation:0 "平等之联邦"
 NOV_shukshin_an_equal_federation_desc:0 "我们称自己为俄罗斯人民的国家——但数十万人甚至无法获得基本的生活必需品。我们怎么能称自己为“人民的国家”呢？ 舒克申必须恢复联邦内部平等的理想，以免我们变得比联邦的敌人更虚伪。\n\n舒克申提出了一项法案，他必须选择支持他的一方，民主社会党或社会自由党，但从现在起，这一切都必须放在一边。因为联邦中的所有人都将享有普遍的平等、选举权和自由！"
 NOV_shukshin_reach_out_to_the_dspr:0 "联系俄罗斯民主社会党"
 NOV_shukshin_reach_out_to_the_dspr_desc:0 "我们一直都知道，建立真正的民主并不容易。但我们从大型企业及其资助者那里收到的阻力尤其强烈。\n\n对我们来说幸运的是，我们新发现的多元主义的成果正在带来回报，我们民主社会党的同事们渴望支持我们争取选举权的努力。尽管我们绝不是天然的盟友，但当每个俄罗斯人高尚的声音悬而未决时，我们的骄傲就毫无意义了。"
 NOV_shukshin_a_common_ideal:0 "共同理想"
 NOV_shukshin_a_common_ideal_desc:0 "事实证明，《妇女权利法案》成为反对全俄爱国党的真正统一的努力。社会自由党对该法案的理想表示了强烈支持，因此我们很自然地应与他们的党接触，努力获得通过妇女选举权这一革命性步骤所需的选票。\n\n当然，这并非没有后果。通过与他们结盟，我们一定会提高他们在人民心目中的合法性，并进一步增强他们的政治势头。这可能不是一个可怕的后果，但它仍然是一个需要考虑的因素，特别是在其他反对派的问题上。尽管如此，我们还是会为联邦的女性做我们必须做的事情。"
 NOV_shukshin_the_first_of_many:0 "始于足下"
 NOV_shukshin_the_first_of_many_desc:0 "终于成功了！我们已经设法在杜马获得足够的支持，以通过《选举权法案》。这是联邦选举权的第一个出色胜利，但不会是最后一个。值得庆幸的是，该法案现在已经通过了政府官僚机构的审批，并将为未来几年的新改革和新法律奠定基础。\n\n最后，我们将能够期待我们的未来，因为我们知道人民最普遍的权利现在受到保护，我们对自由平等联邦的梦想越来越近。人民自由和公平地选举政府的权利将永远不会再受到破坏。"
 NOV_shukshin_cut_the_red_tape:0 "删繁就简"
 NOV_shukshin_cut_the_red_tape_desc:0 "在西罗维基下，联邦建立了一座名副其实的繁文缛节，用作对付任何和所有反对派的武器，以确保他们对权力的绝对控制。这造成的最重要问题之一是试图组建新政党时出现的官僚主义问题，这使得它在实践中几乎不可能。\n\n一些人会认为试图解开阻碍政府官僚主义的混乱局面是一项毫无意义的任务，但联邦及其主席无意让这阻止他们。我们将削减政府官僚作风，这样我们就可以一点一点地为真正多元化的俄罗斯铺平道路。"
 NOV_shukshin_establish_the_electoral_committee:0 "建立选举委员会"
 NOV_shukshin_establish_the_electoral_committee_desc:0 "在西罗维基引发的所有腐败和贫困中，选举制度最为明显。在波克雷什金的领导下，不公正地划分选区和政治恐吓成为常态，导致西罗维基的敌人们的民意调查数字下降，而他们的走狗的民调数字上升。这些可悲的普遍做法阻碍了政府各部门的工作并使其失去合法性，但我们将不再允许这种情况发生。\n\n我们将成立一个独立的选举委员会，以确保人民在政府中始终有发言权。当我们驱逐西罗维基的残余分子时，人民联邦的梦想离现实越来越近了。"
 NOV_shukshin_expand_the_bill:0 "扩展法案？"
 NOV_shukshin_expand_the_bill_desc:0 "在政府大厅听到的众多声音中，有一个群体的呼声尚未得到回应：联邦的妇女。如果我们无视如此大范围的选民，我们的努力就毫无意义，这就是为什么我们最近扩大投票权的措施必须包括他们。毕竟，如果我们不像其他人所看到的那样支持妇女选举权，我们真的能实现平等吗？\n\n当然，要为这项措施赢得支持并不容易，但当我们无视自己的数百万人民时，我们不能声称代表人民行事。"
 NOV_shukshin_rally_the_coalition:0 "团结联盟"
 NOV_shukshin_rally_the_coalition_desc:0 "为了使《选举权法案》获得通过，我们必须与我们的联盟合作。我们将进一步与他们联系，共同努力实现我们的共同抱负。虽然这会阻碍我们在整个政府中的选举主导地位，但这是一个必要的妥协。"
 NOV_shukshin_gather_independent_party_support:0 "争取独立党派支持"
 NOV_shukshin_gather_independent_party_support_desc:0 "幸运的是，对于我们努力通过我们的《选举权法案》成为法律，杜马内部的独立和小党派已经帮助我们集会反对全俄爱国党。我们将讨好这些通常不起眼的政府成员，以便我们能够为了人民的利益通过这项法案。\n\n虽然在正常情况下我们不会喜欢这些激进分子，但我们必须开展统一斗争，为我们的联邦而战，反对那些认为民主已死的人。虽然这会给他们更多的力量并鼓励独立的政府成员，但这总比让我们为这项具有里程碑意义的法案所做的努力付诸东流要好。"
 NOV_shukshin_womens_rights_act:0 "[GetYear]年妇女权利法案"
 NOV_shukshin_womens_rights_act_desc:0 "终于，经过数月的不懈斗争，《妇女权利法案》终于通过了杜马，以便立即进行表决。有些人认为这一天永远不会到来，认为公司和他们的傀儡会推翻它，但我们已经成功地实现了为所有在我们的土地上呼吁自由的人带来普选权的努力。\n\n无论收入、政治观点或性别如何，联邦中的所有人都将很快能够投票选举其政府中的代表。在我们所有的胜利中，这可能是我们迄今为止最伟大的胜利。我们终于在曾经反对群众的制度中取得了真正的进步和平等，现在将按照他们的要求工作。"
 NOV_shukshin_your_right_to_unite:0 "你的权利是团结"
 NOV_shukshin_ode_to_the_people:0 "人民之歌"
 NOV_shukshin_ode_to_the_people_desc:0 "“如果没有联邦人民，舒克申总统永远不可能取得他的成就。我们政府的每一次胜利都归功于人民，因为没有他们，就永远不可能从公司和西罗维基手中夺取对国家的控制权。\n\n相应地，提拔总统上任的人将成为政策中首要考虑的对象。联邦正在迅速变化，在我们的心中和思想中，向着一个更自由的国家迈进的每一步都将与普通人一起进行，而不是寡头。当我们建立一个新的联邦时，我们将向那些使之成为可能的群众致敬。”"
 NOV_shukshin_our_nations_health:0 "我们国家的健康"
 NOV_shukshin_our_nations_health_desc:0 "“俄罗斯历史上最令人震惊的疏忽之一可能是其人民的健康。自沙皇时代以来，该国的医保系统一直资金不足，并被该国领导人忽视。但这不会再继续下去了。\n\n我们必须以与我们的任何目标相同的活力来追求建立一个更健康、没有疾病的联邦的努力。为了人们的繁荣和健康，必须对联邦的医保进行大量投资，以纠正过去的错误。如果我们的人民继续因我们的忽视而遭受苦难，我们的努力就毫无意义。”"
 NOV_shukshin_a_pragmatic_solution:0 "务实的解决方案"
 NOV_shukshin_a_pragmatic_solution_desc:0 "正如对任何政府的期望一样，我们必须为我们的公民提供足够的医保。截至目前，国家的医保由大公司及其冷嘲热讽的领导人控制，他们抓住任何机会获得权力，这在医疗领域与其他领域没有什么不同。\n\n全俄爱国党认为我们应该在合理范围内改革医疗体系。他们建议，由于联邦目前的预算不足，进行小规模改革以充分利用当前系统比采取更严厉的措施更可取。公司可能仍然掌握着他们的权力，但在我们的财务状况得到改善之前，这只是一个开始。"
 NOV_shukshin_pact_with_the_rslp:0 "与社会自由党签约"
 NOV_shukshin_the_DSPRs_conscious:0 "民主社会党的觉醒"
 NOV_shukshin_the_DSPRs_conscious_desc:0 "新出现的民主社会主义者向总统提出了一个建议：联邦医保系统的完全国有化。在他们和我们的共同努力下，我们将努力将人民的健康从富人手中夺走。\n\n这一行动并非轻率采取，而是作为民主社会党认为道德上的必要性而采取的行动。公司和他们的贪婪将少一种控制手段，我们的人民和他们的健康可能因此受益。然而，这项工作并非没有代价。我们政府的规模和支出可能需要大幅增加，但这对我们的首要任务是必要的：人民。"
 NOV_shukshin_expand_healthcare_funding:0 "扩大医保资金"
 NOV_shukshin_expand_healthcare_funding_desc:0 "我们联邦成立的基础是努力在最黑暗的时刻保护新西伯利亚人民，但即使在今天，我们也未能为所有俄罗斯人实现这一目标。通过私人医保，为了大公司及其钱包的利益而失去了无数生命。只有富人才能得到服务，而他们以下的人会腐烂。\n\n为了开始解决这个国家的瘟疫，我们将重新分配开支并增加国家预算，以大量收入充斥我们微不足道的医保系统。我们只能希望医保系统最终能够发挥其真正的作用，以免我们的人民损失更多。"
 NOV_shukshin_drug_pricing_controls:0 "药品价格控制"
 NOV_shukshin_drug_pricing_controls_desc:0 "鉴于我们国家的医保状况不佳，我们必须密切关注主导该行业的公司。就像在他们之上运作的大型公司一样，他们将那些他们视为利润来源的人视为该领域的严重扭曲的人。为了努力控制他们的金钱欲望，我们将对药物设置价格上限。\n\n虽然这肯定会削弱联邦的预算，但这对人们来说是必需的，这样他们就可以最终生活而不必担心他们的积蓄会因为一次简单的药剂师之旅而被耗尽。通过这项立法，我们致力于建立一个真正适用于所有人的医保系统，而不仅仅是富人。"
 NOV_shukshin_propose_universal_coverage:0 "提出全民医保法案"
 NOV_shukshin_propose_universal_coverage_desc:0 "民主社会党内部的官员起草了《全民医保法案》，如果获得通过，该法案可能会成为杜马有史以来最伟大的法案之一。通过一项法案，所有医保服务都将直接置于联邦的控制之下，而不受大型企业的控制。\n\n如果它通过，我们将对大公司造成巨大打击，并极大地改善我们公民的生活。毫无疑问，这些公司会试图报复，但为了联邦及其人民的利益，我们将不惜一切代价准备好反对他们的努力。"
 NOV_shukshin_russian_cultural_rebirth:0 "俄罗斯文化的重生"
 NOV_shukshin_russian_cultural_rebirth_desc:0 "几十年来，俄罗斯文化在大动乱时代的混乱中被一扫而光，因为人们更加关注自己的生存，而不是传统或艺术。我们的许多文化作品和成就已经开始淡出历史，但这将不再存在。俄罗斯要重振雄风，首先要振兴其文化。\n\n俄罗斯对艺术和文化贡献的缓慢衰退必须结束。无论老少，俄罗斯人民都将能够记住他们从一个更简单的时代开始的伟大传统，那时人们关注的是幸福而不是恐惧。"
 NOV_shukshin_pride_and_patriotism:0 "自豪与爱国"
 NOV_shukshin_pride_and_patriotism_desc:0 "由于我们国家内部存在如此多的痛苦和悲伤，人们不愿相信我们可以承担留给我们的斗篷作为俄罗斯最后的自由之光。人民需要一个值得信赖的联邦，一个能够保护她的孩子免遭侵略者和占领者侵害的强大国家，一个在战争和疾病中陪伴在她孩子身边的充满爱心的俄罗斯。\n\n人民将受到鼓舞，无论是今天还是明天，他们都会重拾对自己国家的信心。我们只能希望俄罗斯再次成为一个让我们的人民引以为豪的强国，而不是一片充满苦难和纷争的国度。"
 NOV_shukshin_encourage_new_thought:0 "鼓励新思想"
 NOV_shukshin_encourage_new_thought_desc:0 "随着俄罗斯最近在俄罗斯联邦的领导下重新统一，舒克申正处于十字路口。随着全俄爱国党提出“爱国主义”和“自豪”口号，民主社会党和社会自由党向他提出了建议。\n\n俄罗斯不会鼓励自豪和爱国主义高于一切 - 俄罗斯将成为一个哲学的国家，一个自由和自由的国家，一个人民的国家。一个文化的民族，一个人人都可以自由思考或自由发言的民族。我们将拥抱我们真正的使命，繁荣、智慧的使命，最重要的是——俄罗斯。"
 NOV_shukshin_subsidise_scientific_endeavours:0 "资助科学事业"
 NOV_shukshin_subsidise_scientific_endeavours_desc:0 "“如果说世界强国有一个共同点，那就是他们对科学最新进展的不懈努力。如果我们要效仿他们的成功，就必须效仿他们在科学研究方面取得的进步。\n\n俄罗斯要想在全球舞台上处于平等地位，就必须将加倍投入我们的实验室和研究设施的资金和注意力作为重中之重。必须在更广泛的层面上以及在对我们州当前和未来的每一位科学天才进行适当教育方面，对人类知识的进步进行强有力的制度关注。俄罗斯的进步将从实验室开始。”"
 NOV_shukshin_revolutionise_school_equipment:0 "革新教学设备"
 NOV_shukshin_revolutionise_school_equipment_desc:0 "“如果科学只需要将学位塞到一个人的手中并将其塞进研究机构的实验室外套中，那将是对科学的损害。知识的进步既是一种社会努力，也是一种社会努力。物质，我们对它的追求必须从每个公民开始，最重要的是年轻人。\n\n必须从头开始更新学校的科学研究经费和设备。每个显微镜，每个烧杯，都必须达到创造一代人所需的标准，以准备好继续和进一步发展科学，超越他们之前的任何人。投入这项最神圣的努力的每一卢布都将保证联邦在未来几十年的繁荣。”"
 NOV_shukshin_expand_the_central_design_bureau:0 "扩大中央设计局"
 NOV_shukshin_expand_the_central_design_bureau_desc:0 "“中央设计局是联邦科学技术研发的中心和最重要的中心。它是我们科学进步的协调和指导的中心，一个人的能力只有在它的大脑允许的情况下才能发挥作用，尤其是在科学中。\n\n如果我们要真正彻底改变我们国家的知识进步，就必须从中央设计局开始。联邦的强大和繁荣取决于它的成功。只需要一点点火花就可以形成一连串的知识，而这始于国家研究的中心。我们所要做的就是先发制人。”"
 NOV_shukshin_the_peoples_president:0 "人民的总统"
 NOV_shukshin_the_peoples_president_desc:0 "“舒克申总统在各方面都与他的前任完全不同。他的执政授权不是来自枪弹或富人的钱包，而是来自他自己的人民。这一点从未被遗忘，通过每一项法案和法案，人民和他们的幸福一直是最重要的。\n\n总统的努力使他真正赢得了人民总统的称号。俄罗斯公民理应得到真诚的领导，而这正是总统赋予他们的。不是用空洞的姿态，不是用虚假的承诺，而是做他认为最好的事情，巨企和他们的贿赂都去死吧。”"
 NOV_shukshin_cross_the_aisle:0 "跨越过道"
 NOV_shukshin_cross_the_aisle_desc:0 "在我们与企业霸权的伟大斗争中，我们必须开始获得盟友。那么，还有什么比那些以赋予俄罗斯工人权力为唯一目的的盟友更好的盟友呢？ 民主社会党的成员是我们有效削弱企业权力的最佳人选，他们中的许多人已经等了很多年才等到这样的法案出台。\n\n凭借舒克申总统的魅力以及民主社会党的热情和声望，我们最终将拆除实现真正平等联邦的最后障碍之一。很快，曾经只存在于舒克申脑海中的梦想就要实现了。"
 NOV_shukshin_economic_liberation:0 "经济解放"
 NOV_shukshin_economic_liberation_desc:0 "为了让我们的联邦真正自由，需要的不仅仅是简单的投票箱。人们呼唤另一种基本的解放：经济解放。我们将重新努力为人们带来更自由的工作场所，这样他们的工资就不会被扣留，生活不再只是一成不变的肮脏。\n\n人们将不再被不知名的企业霸主所挟持，而是在工作场所拥有自由和选择权，这是一个曾经被认为在联邦无法实现的梦想。他们的生活将不再仅仅是为了满足当权者的腰包，而是为了寻求自己的命运。"
 NOV_shukshin_a_helping_hand:0 "援助之手"
 NOV_shukshin_a_helping_hand_desc:0 "随着俄罗斯废土多年的无政府状态，我们联邦中的数百万人仍处于贫困线以下，甚至没有能力负担任何水或食物——更不用说舒克申联邦提供的奢侈品了。这站不住脚。\n\n在联邦其他政党的帮助下，舒克申提出了一项法案，以支持那些社会上不太富裕的人。被前军阀遗弃的人民将重振雄风，我们将把俄罗斯重塑成曾经的样子，一个拥有数百万人、团结和繁荣的国家。"
 NOV_shukshin_with_strength:0 "带着力量"
 NOV_shukshin_with_strength_desc:0 "随着法案的提出，我们决定采取非正统的选择，与全俄爱国党合作开展我们的贫困计划，与新西伯利亚的前独裁者接触，与我们合作支持我们的公民。\n\n通过全俄爱国党与巨企寡头的联系，他们可以轻松地与他们建立交易以增加支付给工人的金额和雇用的工人数量，这主要是由于给予他们一些“自由”以允许他们继续……较少的民事行为，并为那些似乎以祖国为荣的人提供有针对性的福利；我们的人民既要在爱国主义中重新焕发活力，又要从贫困中解脱出来。"
 NOV_shukshin_with_hope:0 "带着希望"
 NOV_shukshin_with_hope_desc:0 "随着舒克申的扶贫法案被提出，他亲自与社会自由党达成协议，以确保它在双方的支持下获得通过。通过社会自由党温和的民粹主义战略，国家可以通过一种简单而有效的方式使我们的公民摆脱贫困。\n\n有了社会自由党的计划，数百个福利计划将在整个联邦制定，让那些以前陷入破产或债务困境的人终于有办法恢复他们的财富，并且在国家对小企业的支持下，那些以前会放弃了作为企业主的职位，现在将有机会最终在他们的竞争中占据一席之地。"
 NOV_shukshin_with_sympathy:0 "带着同情"
 NOV_shukshin_with_sympathy_desc:0 "随着舒克申的法案被提出，我们决定获得民主社会党中社会主义者的支持，这是对该法案最激进的立场——他们认为它在甚至过于温和。然而，有了他们的妥协，我们自己的人民就不会付出任何代价。\n\n在民主社会党的支持下，工会在公司内部的权利将得到极大加强，让那些被系统滥用的人继续留在他们的位置上，并且不会被不公平地从他们的工作场所取代——最终导致不可避免的破产。工人的权利也将得到加强，这样我们才能最终将贫困作为过去的怪物之一加以限制！"
 NOV_shukshin_support_small_business:0 "支持中小企业"
 NOV_shukshin_support_small_business_desc:0 "过去的联邦一直把自己当作中小企业的敌人。在波克雷什金总统的领导下，我们用繁文缛节把他们串起来，偏袒政府的企业支持者，而不是工人的需求。现在，我们就要整顿这个困扰联邦几十年的问题。繁文缛节将不再吞没中小企业，我们的经济将不再阻碍他们。\n\n将向有前途的商店提供特殊规定，以便它们可以在我们的经济中生存和发展。从今天开始，我们让西罗维基联邦和昨天的记忆更进一步，让一个充满希望和梦想的新联邦更近一步。"
 NOV_shukshin_provisions_against_famine:0 "防治饥荒的规定"
 NOV_shukshin_provisions_against_famine_desc:0 "在舒克申总统担任巴尔瑙尔市市长期间，他开始深入了解补给线在养活联邦人民方面的重要性。据此，我们将重建整个俄罗斯的供应线，以便所有人民都能获得稳定的食品供应。如果我们要真正重建联邦及其土地，我们绝不能再生活在饥荒的恐惧中。\n\n俄罗斯的农业中心和基础设施将实现彻底的现代化，以实现我们建立无饥荒俄罗斯的目标。有了这个大胆的新计划，即使是最偏远的村庄也能在必要时通过烈火获得粮食。"
 NOV_shukshin_the_workers_protections_act:0 "工人权益保障法"
 NOV_shukshin_the_workers_protections_act_desc:0 "我们工作场所的现状非常悲惨。如果我们自称是发达国家，就不能再这样下去了。我们远远落后于其他国家为其工人提供的许多便利设施和资源。\n\n从糟糕的安全状况和工人几乎没有福利和权利来看，有了我们的《工人权益保障法案》，这将不再存在。现在，我们的工人将在他们的工作环境中感到安全。"
 NOV_shukshin_fend_off_the_corporations:0 "抵御企业的冲击"
 NOV_shukshin_fend_off_the_corporations_desc:0 "该死的联邦巨企以其对权力的贪婪和欲望腐蚀和毁坏了俄罗斯的每一个人和每一寸土地。从我们国家在大动乱时代的最初几天到现在，他们控制着我们政府和国家的方方面面。\n\n我们为改善国家所做的所有工作都有可能被这些公司诉讼及其亲信的一时兴起所亵渎和毁坏。我们必须减少他们的规模，以免他们试图看到我们对更美好明天的希望在实现之前破灭。正如我们自舒克申总统就职以来所做的那样，我们将继续削减他们，直到他们一无所有。"
 NOV_shukshin_implement_tax_reform:0 "落实企业税"
 NOV_shukshin_implement_tax_reform_desc:0 "当联邦公民为了国家的更大利益而缴纳他们应缴纳的税款时，一小撮西装革履的公司却被允许逃避他们的公民义务，除了对他们自己的腰包之外，别无其他好处。这绝对是人民和政府的耻辱，允许他们逃避法律的唯一依据就是贪婪。\n\n为了解决这个问题，我们已经开始征收广泛的公司税，以榨取他们最基本的收入来源。纠正我们土地上的公司瘟疫的真正有效的开始就是从这项立法开始的。"
 NOV_shukshin_subsidise_family_farms:0 "补贴家庭农场"
 NOV_shukshin_subsidise_family_farms_desc:0 "在我们与巨企的战争中，有许多战线经常被忽视，其中之一就是农业。很少有农民不被迫在富人的企业脚跟下经营。我们必须结束这种做法。\n\n我们将尝试通过对独立的家庭经营农场的广泛补贴来对抗巨企对农业的主导地位。通过分散行业，我们为消除我国最基本的需求奠定了基础：大众的食物。"
 NOV_shukshin_in_line_with_the_rose:0 "与玫瑰相伴"
 NOV_shukshin_in_line_with_the_rose_desc:0 "很快，舒克申总统将开始实施一项他梦寐以求已久的法案《环境保护法案》。有了它，我们这片广阔的美丽土地终于可以再次开始闪耀。\n\n然而，值得注意的是，这样的提议可以用来进一步拉拢新的盟友。在民主社会党的协助下，我们将能够确保这项立法真正反映我们人民的意愿，同时在政治舞台上赢得一些新朋友。很快，舒克申总统的愿景就会实现，这片土地最终将开始愈合的过程。"
 NOV_shukshin_go_with_the_torch:0 "与火炬同行"
 NOV_shukshin_go_with_the_torch_desc:0 "舒克申总统已经开始实施他对联邦未来愿景的第一阶段，其中一个核心部分是一项名为《环境保护法案》的立法，该法案最终将扭转多年的环境破坏我们的祖国已经忍受了。\n\n然而，我们绝不能擅自篡改这样一个计划中已经很脆弱的部分。与其他各方结盟将不可避免地给本已岌岌可危的提议带来新的和不必要的复杂情况。简而言之，我们必须确保我们各方的纯粹愿景得以实现。"
 NOV_shukshin_the_environmental_protection_act:0 "环境保护法案"
 NOV_shukshin_the_environmental_protection_act_desc:0 "很少有事情像环境一样对总统来说是私人的。进一步保护地球是他整个总统任期内一直大力推动的事情，随着《环境保护法案》的通过，他个人追求一个没有污染的清洁联邦的运动终于取得了成果。\n\n国家人民将不再被迫眼睁睁地看着它的自然美景以利益的名义被破坏。确实，这一法案取得了巨大的胜利。我们的土地将像天空一样清澈，企业的贪婪无法阻止它。"
 NOV_shukshin_open_alkhanai_national_park:0 "开放阿尔卡奈国家公园"
 NOV_shukshin_open_alkhanai_national_park_desc:0 "我们美丽的国家拥有许多自然景观和奇观，是我们尚未保护的不可替代的地标。从最深的湖泊到最高的山脉，不安全的阴影笼罩着这个国家的野生动植物，因为它们正等待以企业利益的名义被摧毁。\n\n为了纠正这种不可持续的状况，我们将开放阿尔卡奈国家公园，这是通往清洁、受保护的自然环境的众多道路中的第一个。人民将看到祖国山水的生机勃勃，无惧烟尘。"
 NOV_shukshin_prepare_our_masterpiece:0 "准备杰作"
 NOV_shukshin_prepare_our_masterpiece_desc:0 "在我们继续解决我们在通往更自由、统一的联邦的道路上所面临的问题时，我们现在只剩下一个紧迫的目标。从我们国家成立之初，我们领土上的巨企就以他们认为合适的方式自由运作，扭曲和腐蚀我们的国家。他们的贪婪影响了无数人的生活，并且长期以来将政府作为他们自己的权力工具。\n\n现在是巨企就位的时候了。在舒克申联盟的全力支持下，将开始起草全面、宏大的立法，以完全束缚巨企对俄罗斯的支配地位。"
 NOV_shukshin_concessions_to_trade_unions:0 "向工会让步"
 NOV_shukshin_concessions_to_trade_unions_desc:0 "在打倒巨企这一巨人的斗争中，我们必须意识到，在这场斗争中我们需要更强大的盟友。奇怪的是，我们可以在我们的宿敌变成朋友中，那就是联邦的工会和工人组织。\n\n在这些团体中，对控制他们的公司的强烈不满情绪正在升温，我们只需要点燃星星之火，就能获得他们对即将出台的法案的全力支持。通过一些让步，我们将确保我们国家最有价值的部分：工人阶级的支持。"
 NOV_shukshin_befriend_the_pacifists:0 "与和平主义者交朋友"
 NOV_shukshin_befriend_the_pacifists_desc:0 "我们现在已准备好开始迈向永久削弱巨企力量的第一步，但我们必须为这样的努力召集合适的盟友。幸运的是，我们在 RSLP 的朋友们和我们一样仇恨侵扰我们州的肿瘤，也许在某种程度上什至比我们自己的更强烈。\n\n在这一点上，他们是我们天然的盟友，将热切地配合我们的斗争。很快，我们的共同努力将为长期在巨企压迫的阴影下苦苦挣扎的人民带来又一次胜利。"
 NOV_shukshin_allow_draft_exemptions:0 "允许兵役豁免"
 NOV_shukshin_allow_draft_exemptions_desc:0 "在统一战争期间，我们的军队需要保持稳定的后备储备，以确保全面发挥作用。现在，随着常态和稳定感回归这片土地，越来越多的公民表达了他们对现行征兵法的担忧，不想眼睁睁地看着自己的儿女被送上战场。\n\n舒克申总统也有同样的看法，并开始倡导更轻的征兵政策和更短的服役期限。然而，我们生活的不幸事实要求必须有某种形式的征兵，直到日耳曼人的威胁被消除。\n\n但如果我们能够确保至少有几个家庭能够重新拥抱他们的亲人，那将是值得的。"
 NOV_shukshin_limit_corporate_influence:0 "限制垄断企业影响"
 NOV_shukshin_limit_corporate_influence_desc:0 "随着我们全面的反企业法案通过政府机制，巨企已经开始打出他们持有的最后一张牌来阻止它。他们袖手旁观的每一个肮脏伎俩和他们剩下的政治捐助者都徒劳无功地阻止了这项具有里程碑意义的立法。\n\n与国家的巨企窃贼不同，我们不需要诉诸贿赂和廉价手段。公司必须服从，并了解到他们曾经拥有绝对统治权的政府不再是他们的玩物。为了人民的利益，我们必须根除影响我们政府的巨企毒瘤，保护我们初生的民主。"
 NOV_shukshin_the_russian_dream:0 "俄罗斯梦"
 NOV_shukshin_the_russian_dream_desc:0 "十年前，我们的国家只有一小块土地，处于无政府状态的混乱之中，这种混乱已经蔓延到前联邦的每一个角落。数以百万计的家庭面临着曾经难以想象的威胁，炸弹从天而降，每一天都只是为了生存而战。但是，命运之风开始吹向新的方向。\n\n现在，俄罗斯联邦已经完成了不可能的事情。曾经被毁的古老城市现在比以往任何时候都高，因为普通俄罗斯人现在过着曾经被认为无法实现的生活。经济再上新台阶，我们携手共创美好新生活。\n\n俄罗斯梦现在在第四大国面前破晓。"
 NOV_shukshin_looking_beyond:0 "展望远方"
 NOV_shukshin_looking_beyond_desc:0 "随着俄罗斯再次统一在一个统一的旗帜下，俄罗斯人民是时候再次放眼世界了。在联邦的边界之外存在着许多国家和帝国，它们在一场伟大的全球象棋比赛中争夺权力，这场比赛是主要在三个主要大国之间肆虐的冷战。\n\n美利坚合众国，自由世界的领袖。大日本帝国，东亚的霸主。大日耳曼国，欧洲的主人和我们最大的敌人。\n\n目前，尽管近年来取得了规模和众多成就，但联邦的全球地位可与英格兰相媲美。其土地而非区域的主人，永远受到附近力量的破坏和威胁。俄罗斯在地缘政治上弱于意大利是一个屈辱的现实，也是联邦不愿意遵守的现实。与我们在英国和法国的老朋友不同，俄罗斯联邦可以将其影响力投射到欧亚大陆的相当大一部分，并再次在国际舞台上重申自己作为全球参与者的地位。\n\n俄罗斯要重新获得大国地位需要时间和努力，这在不久的将来不容易实现。然而，我们可以回到中亚的大草原，再一次重申我们自己是§B欧亚大陆的守护者§!。"
 NOV_the_issue_of_vladivostok:0 "符拉迪沃斯托克问题"
 NOV_the_issue_of_vladivostok_desc:0 "前苏联土崩瓦解之时，大日本帝国迅速从四分五裂的苏联政府手中夺取了符拉迪沃斯托克和远东的部分地区。当时，俄罗斯人民无力阻止帝国陆军开进他们的土地。对大多数俄罗斯人，符拉迪沃斯托克的回归似乎永远遥不可及。\n\n§R直到现在。§!\n\n随着俄罗斯联邦比以往任何时候都更加团结和强大，总统认为是时候将国家的注意力转向东方，并解决被日本占领的远东地区的问题了。"
 NOV_contact_the_partisans:0 "联络俄族游击队"
 NOV_contact_the_partisans_desc:0 "几十年来，在外满洲，特别是比罗比詹的俄罗斯游击队，一直在为争取自由而英勇不懈地反抗日本压迫者。随着俄罗斯的再次统一，他们的士气只会越来越高涨，因为他们现在正在为重新回到祖国怀抱而战斗。\n\n联邦现在的目标是夺回被占领的城市符拉迪沃斯托克，也许现在是向这些游击队组织伸出援手，更好地协调和支援他们在该地区对抗满洲和日本当局的斗争的最佳时机。"
 NOV_military_march_in_novosibirsk:0 "新西伯利亚阅兵"
 NOV_military_march_in_novosibirsk_desc:0 "虽然我们不谋求同大日本帝国发生冲突，但联邦必须向他们和全世界表明，俄罗斯不再是往日的那个虚弱的苏联了。我们是一个快速现代化的军事强国，有能力与全球最大的超级大国针锋相对。\n\n德米特里·格林卡将军建议，为了进一步恐吓日本人，我们应该让全俄罗斯军沿着新西伯利亚的街道游行，就像曾经在莫斯科红场举行的游行一样。"
 NOV_raise_hell_in_manchuria:0 "让他们说去吧"
 NOV_raise_hell_in_manchuria_desc:0 "外满洲的游击队已经在俄罗斯联邦的号召下开始集结，准备为回归他们的祖国而进行艰苦的战斗。在哈巴罗夫斯克和符拉迪沃斯托克，叛乱者在我们的特务斯鲁日巴·贝泽帕斯诺斯蒂的指导下，随时准备袭击日本军事设施。万事俱备，舒克申也准备好下命令了。\n\n“小伙子们，让他们下地狱去吧！”"
 NOV_approach_the_sphere:0 "接触共荣圈"
 NOV_approach_the_sphere_desc:0 "随着外满洲地区爆发无法控制的混乱，以及联邦和共荣圈之间在领土争议问题上的紧张关系的加剧，也许现在是时候与日本人言归于好，探讨符拉迪沃斯托克和远东的命运了。"
 NOV_shukshin_our_southern_neighbour:0 "我们的南方邻居"
 NOV_shukshin_our_southern_neighbour_desc:0 "由于联邦的目标是建立自己的势力圈，以使俄罗斯重新获得其作为全球竞争者的应有地位，我们第一个也是最自然地加入俄罗斯势力圈的国家是哈萨克斯坦。\n\n尽管该国因肆虐草原的哈萨克内战仍处于动荡之中，但这片土地自然资源丰富，其地理位置是进入中亚其他地区、中国西部和里海的天然跳板。\n\n在我们探索俄罗斯重返哈萨克斯坦的丰富多样的可能性之前，我们必须首先将该国带回我们的势力范围。"
 NOV_shukshin_prepare_the_troops:0 "集结军队"
 NOV_shukshin_prepare_the_troops_desc:0 "有必要再次准备入侵哈萨克草原。\n\n正如我们的祖先在一个世纪前所做的那样，我们将使用我们压倒性的优势火力通过任何对我们政府的潜在反对来获得权力。虽然这种蛮力令人遗憾，但无论他们愿意与否，他们都会逐渐意识到来自联邦成员的特权。"
 NOV_shukshin_operation_perovsky:0 "佩罗夫斯基行动"
 NOV_shukshin_operation_perovsky_desc:0 "回到19世纪，在沙皇统治时期，是瓦西里·佩罗夫斯基将军将俄罗斯帝国南下，进入了中亚广袤的土地。随着俄罗斯在这些土地上站稳脚跟，它撕毁了在该地区猖獗的野蛮制度。它把分离的部落聚集在一起，将它们转变为功能性的行政机构，这将成为现代国家的基础。\n\n这一成功全归功于瓦西里·佩罗夫斯基伯爵的领导。\n\n今天，哈萨克斯坦人民发现自己生活在专制政权下，通过压迫手段进行统治，就像古代的中亚汗国一样。再一次，在联邦的旗帜下团结起来的俄罗斯有责任像佩罗夫斯基很久以前所做的那样，将哈萨克斯坦人民从束缚他们的锁链中解放出来。"
 NOV_shukshin_extend_an_olive_branch:0 "伸出橄榄枝"
 NOV_shukshin_extend_an_olive_branch_desc:0 "在我们的历史进程中，我们与哈萨克斯坦人民的关系一直不太好。入侵、征服、剥削。俄罗斯在中亚的遗产以残忍和暴力为标志。\n\n随着我们国家最近重新统一为一个单一的人民联邦，一个独特的机会出现了，我们可以纠正过去的错误，让过去成为过去。我们将在新的基础上与哈萨克斯坦接触。一种平等，而不是奴役。"
 NOV_shukshin_invest_in_kazakhstan:0 "投资哈萨克斯坦"
 NOV_shukshin_invest_in_kazakhstan_desc:0 "哈萨克斯坦居住的土地虽然表面贫瘠，但在我们的领域内蕴藏着巨大的增长潜力。\n\n投资当地经济将是正确地将我们的关系从友好伙伴关系转移到共同繁荣的新领域的良好开端。"
 NOV_shukshin_treaty_of_novosibirsk:0 "新西伯利亚条约"
 NOV_shukshin_treaty_of_novosibirsk_desc:0 "这一天到了！\n\n我们的外交官已经为我们两国人民的正式统一准备了最终草案。自沙皇统治时代以来，哈萨克斯坦的土地就一直与我们联系在一起，但它一直处于剥削的范围内。\n\n有了新西伯利亚条约，我们不再以敌人的身份前进，而是以兄弟的身份前进。为未来几代民主国家树立榜样。"
 NOV_shukshin_the_wild_steppe:0 "野生草原"
 NOV_shukshin_the_wild_steppe_desc:0 "当联邦的旗帜飘扬在哈萨克人的土地上时，一个新的同时熟悉的战线已经在我们新的南部边境展开。中亚地区自三十年前联盟解体以来一直处于分崩离析和混乱之中，现在轮到我们来恢复这些地区的秩序了。\n\n很快，我们就可以迎来草原众多民族所向往的繁荣，也将在未来等待联邦的诸多奋斗中并肩前行。"
 NOV_shukshin_a_central_foothold:0 "中亚立足点"
 NOV_shukshin_a_central_foothold_desc:0 "当我们的部队向河中进军时，我们的官员不能简单地复制在哈萨克斯坦发生的事情。由于苏联解体，费尔干纳河谷从未得到应有的开发。因此，该地区的城市化程度很低，主要城市以外的基础设施建设很少，现代行政管理困难重重。类似于我们恢复诺里尔斯克和西布格勒冰冻城市的方式，铁路将为从新西伯利亚到塔什干和撒马尔罕铺平道路！"
 NOV_shukshin_develop_tashkent:0 "开发塔什干"
 NOV_shukshin_develop_tashkent_desc:0 "塔什干曾经是中亚的灯塔，它的辉煌折射着中亚人民的骄傲。在纸面上，它甚至被认为是该地区的“首都”，大部分基础设施直接通往草原大都市。然而，这不是故意的。\n\n当联盟垮台时，俄罗斯的心脏地带并不是唯一受苦的地方。无政府状态和混乱的卷须深入中亚及其北部邻国的每一块土地，塔什干已沦为昔日奇迹的一小部分。但是现在，是时候解决这个问题了。\n\n将启动新的发展计划，旨在恢复该地区的经济潜力，并在草原上饱受折磨的人民心中建立我们自己的地位。"
 NOV_shukshin_the_graveyard_of_empires:0 "帝国墓地"
 NOV_shukshin_the_graveyard_of_empires_desc:0 "随着我们进一步向南推进，我们在该地区遇到了一个不太热衷于南下的俄罗斯靴子的老挑战者。然而，在我们目前的情况下，对像阿富汗这样臭名昭著的游击战国家发动战争是根本不可能的，现在是我们把他们带到谈判桌上的时候了。\n\n如果我们希望防止进一步的冲突，我们就必须找到一种方法来补偿阿富汗人，他们的中亚野心一如既往地强烈。无论这将我们带到哪个方向，我们都准备好面对他们，并向他们表明我们不惧怕保护无辜者免受暴君的侵袭。"
 NOV_shukshin_must_we_fight:0 "必须打一仗吗？"
 NOV_shukshin_must_we_fight_desc:0 "通过我们统一俄罗斯的运动和我们对德国人的战争，我们已经在战争的浪潮中失去了许多人。战争鹰派已经大声疾呼要与阿富汗开战，并希望我们用一波装甲和喷气式飞机推动，用凝固汽油弹和弹坑覆盖山区，但这没有现实依据。\n\n我们真正需要的是与阿富汗政府进行更多外交形式的沟通。地形虽然因我们入侵中亚而摇摇欲坠，但仍有谈判的基础。我们将派遣一个代表团前往与“帝国墓地”达成某种协议，这将以更和平的方式保护我们的边界。有了这个，我们就可以在新成立的联邦领导下，在联邦解体之前争夺我们大部分的旧势力范围。"
 NOV_shukshin_sunshine_in_central_asia:0 "中亚阳光普照"
 NOV_shukshin_sunshine_in_central_asia_desc:0 "日耳曼人入侵给东方带来毁灭和混乱几十年后，太阳开始从地平线上升起，照耀着草原上的居民。俄罗斯的旗帜和部落的旗帜齐声飘扬，曾经焦土开始愈合，城市从头开始重建。\n\n我们给这片土地带来了曾经不可思议的繁荣，这一切都是因为我们的友好合作和力量。很快，当我们发起俄罗斯历史上的最后攻势时，我们新结交的兄弟们将站在我们这一边。当我们取得胜利时，当我们焦急地展望历史的地平线时，这将是我们人民团结力量的最好例证。"
 NOV_look_to_the_west:0 "放眼西方"
 NOV_look_to_the_west_desc:0 "在对北部、东部和南部边界进行必要的扩张和加固之后，最后一个方向出现了：西方。到目前为止，我们伟大的联邦已经走过了苔原和大火，再次站在了反对暴政的伟大而崇高的十字军东征的悬崖边上。\n\n我们的斯拉夫同胞在德国人的马靴下辛劳、受苦和挨饿，在这片被疯子奴役和夷为平地的土地上。经过多年的准备，我们终于准备好向西看一场不可避免但神圣而正义的战争，对抗所有寻求自由的人的敌人，所有生活在希望一个更美好、更正义的世界中的人：大日耳曼国。"
 NOV_shukshin_operation_bagration:0 "巴格拉季昂行动"
 NOV_shukshin_operation_bagration_desc:0 "时间终于到了。从我们从中西伯利亚共和国分离到俄罗斯统一的卑微开端，都导致了这一刻。\n\n§R我们现在正与德国交战。§!\n\n前进的道路将是代价高昂的，许多人将失去生命，但最终，我们将实现舒克申总统上任以来所追求的目标。\n\n§B把所有俄罗斯人从暴政中解放出来。§!\n\n这很可能是俄罗斯的最后一场战争。在这场即将到来的冲突中，我们冒着我们心中珍视的一切风险。让我们最后一次与我们的宿敌战斗，给他们一场他们会记住的战斗。"
 NOV_shukshin_moscow_in_our_sights:0 "莫斯科就在眼前"
 NOV_shukshin_moscow_in_our_sights_desc:0 "我们对付帝国的主要目标是我们的祖都莫斯科。\n\n被德国占领军反复蹂躏，定居者和执政的纳粹寡头过着奢侈的生活，而俄罗斯居民被驱逐出市中心，流放到郊区，被迫在帝国奴隶工厂的不人道条件下工作。\n\n俄罗斯联邦必须尽快解放首都，不惜一切代价将纳粹赶出我们的西部本土。"
 NOV_shukshin_rally_the_partisans:0 "召集游击队"
 NOV_shukshin_rally_the_partisans_desc:0 "在整个战争期间，深入德国占领区的游击队势力处处阻碍着纳粹战争机器。联邦必须与这些反叛组织中最重要的组织合作，并对国防军造成最大的破坏。\n\n被解放土地上的游击队员将被征召入伍，加入联邦，将我们的祖国从德国的暴政中解放出来。"
 NOV_shukshin_inspire_the_muscovite_people:0 "激励莫斯科民众"
 NOV_shukshin_inspire_the_muscovite_people_desc:0 "莫斯科的俄罗斯人们！你知道我们是谁，我们来这里是为了什么。长期以来，数百万俄罗斯西部人一直梦想着祖国欢迎他们回到她温暖、充满爱意的怀抱中的那一天，而这一天现在就在眼前！\n\n俄罗斯民族的兄弟姐妹们，是时候终于摆脱束缚你们的枷锁，为你们的自由权利而战了！你的生存权！您有权成为一名自豪的俄罗斯公民！"
 NOV_shukshin_moscow_is_behind_us:0 "莫斯科已在身后！"
 NOV_shukshin_moscow_is_behind_us_desc:0 "经过这么多年的流血与泪水，莫斯科这座伟大的城市现在又回到了人民手中。几十年来，数百万人梦想着这一天，为我们祖先的家园的解放祈祷。那一天终于来了。\n\n我们伟大的首都再也不会落入敌人手中，外国军队也不会再亵渎这些街道。\n\n§V莫斯科将永远留在我们身后！§!"
 NOV_shukshin_retrofit_old_soviet_equipment:0 "改造旧苏联装备"
 NOV_shukshin_retrofit_old_soviet_equipment_desc:0 "毫无疑问，对德战争需要联邦利用任何和所有军事装备、有用的技术和战争材料，这些都可以在对德作战中发挥作用。虽然我们更愿意确保我们的部队配备联邦的标准装备，但如果联邦在未来忍受现代装备短缺，使用改装的军阀和苏联时代装备可能对我们的军事行动至关重要。"
 NOV_shukshin_deploy_pontoon_bridges:0 "部署浮桥"
 NOV_shukshin_deploy_pontoon_bridges_desc:0 "东欧的地理主要由广袤的平原、大片森林和众多河流组成。虽然我们的部队可以攻克平原和森林，但河流有时会让全俄军队头疼不已，因为他们一直在努力越过河流，尤其是当敌人在对岸设防时。\n\n虽然浮桥的部署不会消除这个问题，但它肯定会使我们的部队穿越伏尔加河和顿河等大河的努力变得不那么艰巨。"
 NOV_shukshin_wartime_conscription:0 "战时征兵"
 NOV_shukshin_wartime_conscription_desc:0 "尽管全俄军队已证明自己有能力在战斗中与德国人匹敌，但我们不能忘记德国国防军在许多指标上都超过我们。因此，对抗纳粹帝国庞大军队的唯一方法是修改我们的征兵法，让更多的俄罗斯子弟加入全俄军队。\n\n虽然这个决定对很多人来说可能是不受欢迎的，尤其是那些社会自由党中的傻瓜，但它是联邦要求其人民确保战胜我们最大敌人的必要之恶。"
 NOV_shukshin_wartime_propaganda:0 "战时宣传"
 NOV_shukshin_wartime_propaganda_desc:0 "我们必须向人民表明，我们在为谁而战。\n\n我们为那些被鸠占鹊巢、遭受冷眼歧视的莫斯科人而战！\n\n我们为在德寇统治下长期忍受隔离压迫的高加索人而战！\n\n我们为那些国土沦丧、良田被夺的乌克兰人而战！\n\n我们为眼见家园德化、饱受压迫却无能为力的“东方领”本地人而战！\n\n我们将为东欧的解放而战——不惜一切代价!"
 NOV_shukshin_invest_in_feniks:0 "投资凤凰"
 NOV_shukshin_invest_in_feniks_desc:0 "战争爆发后，政府和巨企同意搁置政治分歧，以巩固联邦的巨大资源和经济财富来对抗大日耳曼国。然而，与德国人的战争正在将我们的主要军事产品生产商凤凰推向极限。\n\n战争对物质的高需求已迫使许多凤凰工厂超出产能，导致该公司与总统接洽并正式请求政府提供财政援助以扩大现有工厂以满足他们的需求。虽然政府内部的许多人担心这种行动的潜在后果，但很明显，为了统一战线反对帝国的利益，政府目前必须支持巨企。"
 NOV_shukshin_purchase_american_submarines:0 "购买美国潜艇"
 NOV_shukshin_purchase_american_submarines_desc:0 "虽然对德战争主要在陆地和空中进行，但自伟大的卫国战争以来，海军的作用无疑发挥了更大的作用。在俄罗斯对抗德国之后，纳粹建立了一支规模庞大的海军力量，旨在挑战美国等超级大国在大西洋的主导地位，这意味着德国完全有能力派遣他们的舰队袭击我们在诸如美国等地区的沿海定居点。巴伦特。\n\n幸运的是，多年来一直支持我们的美利坚合众国提出向我们出售一支潜艇特遣部队，以支持俄罗斯海军保卫阿尔汉格尔斯克和摩尔曼斯克等城市免受德国炮击的努力。随着德国国防军入侵沿海的威胁变得越来越有可能，我们拒绝这样的提议将是愚蠢的。"
 NOV_shukshin_contact_free_europe:0 "联系自由欧罗巴"
 NOV_shukshin_contact_free_europe_desc:0 "欧洲的兄弟姐妹们，解放我们神圣领土的斗争已经到来。随着全俄军队勇敢地向西行军，面对德国国防军，我们必须呼吁所有自由的欧洲人以他们所能做到的一切支持我们反抗德国及其团结协定傀儡的伟大斗争。\n\n只有当自由的欧洲团结一致时，我们才能将我们的大陆从纳粹的压迫中解放出来，确保这片古老土地的未来将是自由和繁荣的，不仅是我们的子孙，还有我们子孙的子孙。"
 NOV_shukshin_the_italian_connection:0 "联系意大利"
 NOV_shukshin_the_italian_connection_desc:0 "随着纳粹德国和俄罗斯联邦军队之间战争的继续，意大利王国发现自己处于一个独特的位置。虽然我们在第二次世界大战期间曾经是敌人，但从那以后的漫长岁月里，情况发生了很大变化。自第二次世界大战结束以来，德国和意大利的关系每况愈下。\n\n考虑到这一事实，就有可能说服意大利政府资助俄罗斯对大日耳曼国的战争努力，并协助一劳永逸地消除来自欧洲的纳粹威胁。"
 NOV_shukshin_forward_russia:0 "前进，俄罗斯！"
 NOV_shukshin_forward_russia_desc:0 "俄罗斯联邦的人民，我们的胜利越来越近了！在全俄罗斯军不可阻挡的威力面前，德国国防军崩溃了！让我们开始对国防军进行最后的大举进攻，粉碎剩下的一点点抵抗。让我们开始对德国国防军进行最后的大进军，粉碎剩下的一点抵抗。\n\n我们将迫使他们走上谈判桌，如果他们还愚蠢地认为可以挑战强大的俄国人，我们将深入德国的心脏，把日耳曼尼亚烧成灰烬，在人民大厅的废墟上高举联邦的旗帜！\n\n前进，俄罗斯！"
 NOV_shukshin_a_federation_reborn:0 "联邦重生"
 NOV_shukshin_no_time_left_to_waste:0 "不能浪费时间了！"
 NOV_shukshin_promise_them_peace:0 "承诺和平！"
 NOV_shukshin_promise_them_strength:0 "承诺实力！"
 NOV_shukshin_promise_them_equality:0 "承诺平等！"
 NOV_shukshin_the_oryol_comittee:0 "奥廖尔委员会"
 NOV_shukshin_see_to_the_northern_front:0 "看向北方战线"
 NOV_shukshin_see_to_the_northern_front_desc:0 "在巴巴罗萨行动期间，我们不得不与被称为民族社会主义的九头蛇的许多首领作战。一场血腥的斗争，当芬兰人利用我们处于最低点的虚弱状态入侵我们的北部腹地时，我们受到了致命的打击。\n\n现在，我们回来了。很久以前从我们这里被错误夺走的土地现在呼唤解放，因为芬兰人忽视了我们现在拥有的力量。及时，我们将释放俄罗斯熊的全面报复，并消除我们国家过去的一大污点。"
 NOV_shukshin_develop_the_ongea_airfield:0 "开发奥涅加机场"
 NOV_shukshin_develop_the_ongea_airfield_desc:0 "当联邦的士兵在无政府状态的广袤土地上作战时，一个关于现代战争真相的奇异真相浮出水面。这个事实是在执行任何军事行动时都需要全面的制空权，否则肯定会失败。我们必须确保我们在芬兰的努力中不会对此毫无准备。\n\n舒克申总统已被军方最高指挥部说服，在奥涅加启动另一系列建设工程，主要目的是维护和扩建现有机场和飞机设施。虽然这主要是为了我们与芬兰的战争，但它也可能对我们即将到来的与德国的战斗有好处……"
 NOV_shukshin_provide_winter_gear:0 "提供冬季装备"
 NOV_shukshin_provide_winter_gear_desc:0 "也许在这样的土地上战斗最明显的部分是必须进行适当的规划和后勤行动，以确保必要的军事装备在北方严酷的土地上源源不断。当然，我们从过去的错误中吸取了教训。\n\n我们一直在为这个确切的问题做计划，军事人员已经推出所有必要的设备并将其分发给前线的士兵。通过创新和战术掌握，我们将使芬兰在联邦的强大面前畏缩。"
 NOV_shukshin_operation_nystad:0 "尼斯塔德行动"
 NOV_shukshin_operation_nystad_desc:0 "解放的时刻越来越近，步兵集结，机械化军集结，飞机开始从结冰的跑道起飞。舒克申总统已授权执行俄罗斯的杰作；尼斯塔德行动。\n\n我们的准备工作和技术优势将使我们能够在短短几个月内横扫芬兰，我们的现代战争形式会打破我们可能遇到的任何潜在抵抗。很快，我们将一雪第一次冬季战争的耻辱。"
 NOV_develop_the_murmansk_railway:0 "开发摩尔曼斯克铁路"
 NOV_develop_the_murmansk_railway_desc:0 "在他们的芬兰霸主统治下多年之后，卡累利阿共和国和摩尔曼斯克州的土地已经解放。然而，这不会是卡累利阿斗争的结束，因为我们现在必须将该地区与它已经分离了几十年的政府联系起来。\n\n我们将改造现有的摩尔曼斯克铁路并为其提供资金，不仅将新州与现有基础设施连接起来，而且为协调我们国家寒冷、人烟稀少的地区的供应提供了一种集中方式。虽然这只是一个开始，但它为卡累利阿未来的基础设施建设奠定了基础，使该地区跟上我们联邦其他地区的步伐。"
 NOV_four_more_years:0 "再干四年！"
 NOV_four_more_years_desc:0 "我们联邦敬爱的总统瓦西里·舒克申单枪匹马将俄罗斯从西罗维基的锁链中解放出来，是俄罗斯的统一者，也是东欧从德国长靴中解放出来的人，他再次从人民手中获得了进行统治的授权。\n\n舒克申总统不满足于将他的第二个任期仅仅视为一场胜利。一项大胆的新议程已经制定，旨在将联邦的伟大提升到新的高度：寄希望于俄罗斯经济进一步加强其对欧亚大陆的主导地位，并仰望星空，为俄罗斯提供自己的太空计划。"
 NOV_continue_the_dream:0 "继续梦想"
 NOV_continue_the_dream_desc:0 "从新西伯利亚战后的第一场雪开始，我们就高举了民主的火炬。我们从那里扩展到西伯利亚中部，然后重新统一了俄罗斯寒冷的东部荒原。这是西罗维基冰冷的挂毯首先开始崩溃的地方，总统舒克申在竞争中脱颖而出。经过伟大而长期的斗争，我们联邦的人越过了乌拉尔山脉，最终在§W白§!、§M蓝§!和§R红§!的旗帜下统一了俄罗斯。\n\n现在我们必须继续这个梦想，继续将民主的火炬高举过寡头和腐败的头顶。我们将扩大这个联邦的便利设施和自由，让人们真正实现前所未有的繁荣。"
 NOV_continue_the_dream_tt:0 "£GFX_NOV_DSPR_Icon §P俄罗斯民主社会党§!和£GFX_NOV_RSLP_Icon §m俄罗斯社会自由党§!将§G支持§!额外的改革。"
 NOV_encourage_small_business:0 "鼓励中小企业"
 NOV_encourage_small_business_desc:0 "现在扼杀俄罗斯繁荣的寡头政治终于被消灭了，我们的公民被赋予了在真正的自由市场中独立行动的自由，尽管他们中的许多人都被劝阻尝试，或者在许多大型公司的拇指下这样做。我们现在必须迎来一个中小企业的新时代。\n\n各地的俄罗斯人将能够通过政府对他们的补贴和财政援助来创造自己的经济蛋糕。人民将不仅拥有独立于公司监督的成功企业，而且将拥有良性竞争，并将能够以前所未有的方式直接刺激经济。"
 NOV_federal_insurance_act:0 "联邦保障法案"
 NOV_federal_insurance_act_desc:0 "我们将制定一项法案，为俄罗斯人民的福祉提供一般保险。医疗保健的私有化只会导致剥削我们自己公民的福祉以牟利，并以牺牲大公司为代价使他们受益。当然，这确实会大大增加我们的预算，并可能给经济带来更大的压力。\n\n牙科工作、年度检查和验光等医疗费用以及其他形式的基本护理将被纳入我们旗下所有公民的基本权利。人们要求改变和采取行动来改善他们的生活质量，我们将给予他们。"
 NOV_university_of_moscow:0 "莫斯科大学"
 NOV_university_of_moscow_desc:0 "莫斯科，尽管我们努力恢复它曾经拥有的荣耀，但仍在为在世界和俄罗斯国内的相关性而斗争。它的许多著名机构在德国几十年的占领下完全被摧毁，如果我们要扭转这些错误，我们必须从头开始。\n\n一所明亮、崭新的莫斯科大学将建在城市的正中心。不仅为莫斯科带来了新的声望，它的建设还将有利于联邦青年的教育，并有助于吸引年轻的俄罗斯人来到这座城市。联邦和莫斯科的未来始于其建设。"
 NOV_working_mans_paradise:0 "劳动者的乐园"
 NOV_working_mans_paradise_desc:0 "在沙皇时代，工人被压迫、殴打、贬低，被奴役为农奴。然而，随着变革之风席卷我们的联邦，我们将带领我们的国家成为劳动者的天堂。工人将得到强有力的、严格执行的保护，这是欧亚大陆上任何其他国家都无法比拟的。\n\n由于我们的政策，我们可以预期到俄罗斯的移民会激增。我们的国家将成为工人的乌托邦，因为成千上万的人涌入我们的城市中心，在需要劳动者努力的各个部门寻找工作。我们的经济受益于人民，受益于人民。十年前，俄罗斯的未来似乎暗淡无光，但今天我们的联邦比以往任何时候都闪耀着光芒。"
 NOV_metropolitan_moscow:0 "莫斯科大都会"
 NOV_metropolitan_moscow_desc:0 "我们联邦的首都莫斯科是世界上最著名的城市之一。它在冲突、瘟疫、鲜血和眼泪中幸存下来，尽管有人会看到它们被拆毁，但克里姆林宫神圣的大厅仍然屹立不倒。\n\n既然我们已经从德国长靴下遭受的暴行和不公正中恢复了我们心爱的城市的荣耀，我们将使莫斯科成为它本应成为的闪闪发光的大都市。俄罗斯的第一王座将随着彻底的现代化再次闪耀光芒，并使联邦所有人民更容易接近。"
 NOV_energy_export_prospects:0 "能源出口前景"
 NOV_energy_export_prospects_desc:0 "俄罗斯拥有天然丰富的天然气、石油和其他能源资源，它们构成了我们出口经济的核心。是时候充分利用这些资源的经济潜力了。\n\n我们将跨经济集团达成贸易协议，将我们的天然气和石油出口到全球市场。在石油危机之后，世界各国的市场需求仍然很高，尤其是美国，我们可以利用它来加强我们的国际关系，刺激我们的国内市场和我们贸易伙伴的市场。"
 NOV_develop_the_west:0 "开发西部"
 NOV_develop_the_west_desc:0 "虽然过去几年对俄罗斯并不友好，但没有比西方更糟糕的了。几十年来，留在一个不认为居民是人类的政府中，被征服，挨饿和被杀害而无人问津。上次战争后，西俄罗斯几乎完全被摧毁，但现在随着生活恢复正常，我们必须及时推动国家前进，摆脱纳粹主义的阴影。这可能并不容易，但为了所有俄罗斯人的利益，摆在我们面前的挑战是一项必须完成的挑战。"
 NOV_second_siberian_plan:0 "第二个西伯利亚计划"
 NOV_second_siberian_plan_desc:0 "自从在16世纪首次被俄罗斯控制以来，西伯利亚一直被忽视，直到布哈林在苏联担任总理期间，才开始实施他的 “西伯利亚计划”。计划旨在改造该地区并使其摆脱无足轻重的地位，并取得了一些成功，直到巴巴罗萨行动的开始戛然而止。\n\n在随后的混乱中，西伯利亚资源匮乏，注定要再被遗忘几十年。我们的东部地区拥有大量未开发的自然资源和不容忽视的工业潜力。我们将加倍努力利用这片土地，使西伯利亚成为与我们西部领土平等的伟大伙伴。"
 NOV_russian_free_trade_zone:0 "俄罗斯自由贸易区"
 NOV_russian_free_trade_zone_desc:0 "为了将其他国家纳入我们的势力范围，我们必须使用多种多样的手段来增强我们的经济实力。其中一个途径是让各国加入俄罗斯领导的自由贸易区。很少有国家拥有像我们这样丰富的自然资源，而我们广袤的土地完全可以满足他们的需求。\n\n因此，我们将建立俄罗斯自由贸易区，并尝试在整个欧亚大陆获得其他国家的外交支持，以促进经济利益并形成平等国家之间的积极关系。通过这样做，俄罗斯之鹰将扩大其势力圈和盟友，并将在世界舞台上变得更加强大。"
 NOV_center_of_eurasia:0 "欧亚中心"
 NOV_center_of_eurasia_desc:0 "我们是欧亚大陆无可争议的主人。该地区没有其他国家拥有与俄罗斯一样多的原始自然资源、人力和工业实力。我们与从中亚国家到中东国家的许多国家接壤，现在我们统一了，我们将着手重建我们自己的势力范围，以与团结协定和共荣圈相媲美。\n\n为此，我们将秘密资助这些国家中有利于我们的派系，并给予他们合理的激励，让他们站在我们这边，而不是纳粹或日本。我们将一点一滴地为我们未来成为全球超级大国奠定基础。但首先，我们必须保护我们自己的后院。"
 NOV_establish_roscosmos:0 "成立俄罗斯航天国家集团"
 NOV_establish_roscosmos_desc:0 "如果十年前有人告诉我们的同胞这个想法是可能的，你会被视为疯子。但是随着我们在西方取得的胜利，我们现在可能可以向世界展示俄罗斯已经成为最新的超级大国。在日本、德国和美国之外，还没有太空计划，我们还有很长的路要走。但几个世纪以来，俄罗斯一直怀着好奇、惊奇和活力仰望星空。从罗蒙诺索夫时代开始，在沙皇时代，甚至在布哈林误入歧途的年代。每一段旅程都始于足下，而这将是第一步。"
 NOV_titan_scholarship_program:0 "泰坦奖学金项目"
 NOV_titan_scholarship_program_desc:0 "俄罗斯不仅仅是它存在的土地，它也是它的人民。如果我们的人民不能产生将世界带入原子时代的那种思维方式，我们如何成为超级大国？因此，我们与泰坦达成了一项协议，资助那些在学术界展示自己才华的学生，让他们在金钱可以买到的最好的大学继续深造。\n\n泰坦还将为这些学生提供使用欧洲一些最尖端研究设施的机会，以进一步加速我们学术基础的发展。当然，泰坦也不愿意仅仅为了俄罗斯的利益而这么做。我们已决定降低泰坦的公司税率，并为他们提供更优惠的政府合同，以增加对他们的交易的吸引力。"
 NOV_baikonur_cosmodrome:0 "拜科努尔航天发射场"
 NOV_baikonur_cosmodrome_desc:0 "所有伟大的旅程都必须从某个地方开始，我们的新太空计划也不例外。在进行任何进一步的努力之前，必须最终确定为联邦的恒星远足创建一个出发点，我们拥有完美的位置。\n\n我们将在哈萨克斯坦南部的中心建立拜科努尔航天发射场，这是我们的第一个也是唯一的太空港。它将成为我们所有进一步星际冒险的总部，作为额外的好处，我们与哈萨克斯坦人民的联系更加紧密。在此基础上，我们将建立一个征服宇宙的太空计划。"
 NOV_meet_with_ultravisionaries:0 "会见远视主义者"
 NOV_meet_with_ultravisionaries_desc:0 "为了为我们的太空计划培养最优秀的工程师和研究人员，我们必须利用俄罗斯所能提供的所有最优秀的人才。在曾经的科米共和国，居住着一群致力于进步崇拜的科学家，曾被称为“远视社会主义运动”。\n\n有人说，由于他们奇怪的政治观点，听取这些人的意见是浪费时间。邀请他们为我们的研究和技术开发委员会提供建议将是一场政治赌博，因为我们还没有看到他们的理论取得成果，但如果不能与他们合作，我们就会失去我们可以利用的重要资源：知识。"
 NOV_keep_the_funds_flowing:0 "保持资金流动"
 NOV_keep_the_funds_flowing_desc:0 "为了让我们能够让这个项目继续下去并触及天堂，我们必须保持稳定、持续的资金。通过将资金投入这些项目，它确保我们能够及时有效地看到项目参与竞争。我们已经向其他项目和社会服务提供了如此多的资金，那么为什么还要犹豫将这些资金扩展到太空计划呢？\n\n虽然这可能被我们的批评者视为一个虚荣心的项目，但对其他人来说，这将把俄罗斯带回世界舞台。为了让我们真正重新获得“第四大国”的称号，我们必须做很少有国家做过的事情。我们必须触摸星星，我们需要资金才能到达那里。"
 NOV_develop_the_facilities:0 "发展设施"
 NOV_develop_the_facilities_desc:0 "为了让我们抵达群星，我们当然有必要建造我们的恒星旅行可以从中发射和运行的空间站。这对我们来说可能是一笔昂贵的账单，但这将是我们联邦必须承担的必要成本，以实现我们的梦想，即进一步超越我们世界的范围。\n\n通过建造适当的设施使这样的冒险更容易和触手可及，它减少了将设备运输到许多分散的设施集而不是几个靠近的集中位置的时间。确实，这是让俄罗斯进入现代化的道路。"
 NOV_the_photon_rocket:0 "质子号火箭"
 NOV_the_photon_rocket_desc:0 "我们首次涉足宇宙的最后准备工作之一是研制火箭，将第一个俄罗斯人送上星空。如果我们要确保火箭选定的宇航员安全、干净地升空离开大气层，那么最终设计必须尽可能接近完美。\n\n我们将采用最先进的质子推进系统与其他更传统的火箭技术相结合。当然，这项技术壮举并非没有代价，但安全起飞的代价不能太高。随着我们将俄罗斯送入太空的方法的完成，我们离载人太空旅行又近了一步。"
 NOV_borrow_american_designs:0 "借鉴美国设计"
 NOV_borrow_american_designs_desc:0 "美国已经通过其在NASA中备受推崇的太空计划将人员送入太空。由于我们缺乏美国人所拥有的经验或设计，以及我们与美国的友好关系，只有在寻求两只鹰之间进一步合作的过程中，他们才会借给我们太空旅行所需的蓝图。\n\n这绝不是联邦方面承认失败。这使我们有更好的机会在设计阶段开发其他领域，以及真正的、经过现场测试的设计确保成功。确实，它象征着我们新结交的朋友和在全球舞台上的地位。"
 NOV_eclipse_the_usa:0 "美式标准"
 NOV_eclipse_the_usa_desc:0 "曾经，第三帝国推行的太空计划被认为是人类努力触及群星的典范，但随着时代的变迁和帝国阴燃的废墟导致其中止，世界排名第一的太空计划已成为美国和NASA。\n\n如果俄罗斯的太空计划要变得真正伟大，就必须像对待德国人那样对待美国人的伟大事业：在规模和成功方面达到他们的标准。探索星空的闪亮新范式将不会是纳粹党徽或星条旗，而是联邦的三色旗。"
 NOV_stellaris:0 "群星"
 NOV_stellaris_desc:0 "经过漫长、艰苦和艰巨的一系列准备工作，联邦已经达到了其不懈努力奠定的基础成果的悬崖峭壁：载人宇宙之旅。\n\n自从太空计划开始以来，俄罗斯许多人、科学家和舒克申总统本人都在焦急地等待着这一刻。通过这一步，俄罗斯作为一个国家已经伸手去摘星，并将它们牢牢地掌握在自己的手中，因为联邦的野心是将平流层留在星际层中。地球上没有人能够否认我们的壮举，因为联邦不仅成为同行，而且成为国际社会的领导者。"
 NOV_the_fourth_power:0 "第四大国"
 NOV_the_fourth_power_desc:0 "自第二次世界大战后，三个国家共同主导新秩序几乎成为常识。然而，随着俄罗斯凤凰从第二次西俄战争的废墟中浴火重生，联邦及其盟友比以往任何时候都更加挑战现状。\n\n现在我国有了核能力，进行了太空探索，享有了前所未有的主权、自由和平等，我们终于可以把祖国列为第四大国了。尽管它可能是最年轻的，但我们将成为引领21世纪美丽新世界的人！"
 NOV_shukshin_discredit_the_vrpp:0 "抹黑全俄爱国党"
 NOV_shukshin_discredit_the_vrpp_desc:0 "在杜马的大厅里，存在着一个令人不安和恶心的事实。我们自己的一个政党，那些以人民为重的政党，一直在接受各大巨头的“慷慨捐赠”。他们现在试图掩盖这个秘密，并向公众隐瞒，同时批评我们自己的治理。这种情况不能再继续下去了。\n\n我们必须向世界展示他们的狡猾行为，进一步说服人民不要相信那些在公众面前表现出友好面孔以掩盖自私的人。他们将不再能够反对我们推翻大公司暴政的措施，我们的联邦将变得更加光明。"