 NOV_Anatoly_Koryagin:0 "安纳托利·科里亚金"
 POLITICS_ANATOLY_KORYAGIN_DESC:0 "安纳托利·科里亚金出生于1938年，从小就目睹了俄罗斯陷入内战和混乱的景象。在西伯利亚战火连连的岁月里，科里亚金看到了战争给平民和退伍军人带来的心理创伤和精神损伤。战争的恐怖带来了弹震症、焦虑和自杀性抑郁等问题。\n\n在西伯利亚短暂的繁荣时期，科里亚金成为了备受赞誉的精神科医生，克服了战乱时期俄罗斯的恶劣条件，为中西伯利亚的伤员们恢复免于战争的生活尽了一份力。\n\n统一战争期间，科里亚金的工作量越来越大，他接触到了更多为战争之痛所苦的人们。他迅速得出结论，要结束这种疯狂，带来和平，唯一的方法就是通过俄罗斯联邦的最高职位。科里亚金与残存的现代党人、科米青年改革者联盟和军队中志同道合的人合作，创立了俄罗斯社会自由党。\n\n随着第二次西俄罗斯战争已经结束，俄罗斯人民获得胜利；社会自由党在选举中获胜，时机终于成熟，让俄罗斯数十年来从未拥有过的东西实现吧。\n\n§M和平。§!"
 NOV_koryagin_a_chance_for_all_of_us_tt:0 "§Y雷克雅未克会议即将开始。§!"
