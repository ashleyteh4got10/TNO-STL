 NOV_RSLP_showcase_russian_culture:0 "展示俄罗斯文化"
 NOV_RSLP_showcase_russian_culture_desc:0 "到目前为止，自由国家组织几乎完全由传统上被视为西方一部分的国家组成。由于苏联解体后，境内至今几十年的混乱局势，美国及其盟友直到最近才开始关注俄罗斯。因此，在自由世界的人民中存在着一种有偏见的世界主义观念，这些成见阻碍了我们加入他们的努力。如果我们要与美国人平起平坐，我们必须突破这种潜在的、潜意识的东方主义。"
 NOV_RSLP_visit_ofn_military_bases:0 "参观自由国家组织军事基地"
 NOV_RSLP_visit_ofn_military_bases_desc:0 "自由国家组织对外国势力一直保持着最为封闭的态度，而他们有充分的理由这样做。然而，科里亚金总统作为一个和平缔造者的声誉早已传扬开来，他的追随者们也如此。虽然我们钟爱和平，但£NOV_RSLP_Icon §M社会自由党§!依然明白，保卫自由免受法西斯的困扰是必要的。访问自由国家组织军事基地将表明俄罗斯已准备好学习并在军事合作方面进一步合作了。"
 NOV_RSLP_tour_free_world:0 "遨游自由世界"
 NOV_RSLP_tour_free_world_desc:0 "纵观历史，极少数俄罗斯统治者选择冒险离开我们的祖国边界。确实，我们手头的工作太多，但我们不应忘记，在舒克申之前，另一位伟大的俄罗斯领袖拥抱了他的西方盟友，并与他们一起战胜了共同的敌人。科里亚金将踏着彼得大帝的脚步，走向西方自由的堡垒！"
 NOV_RSLP_expand_trade_links:0 "扩大贸易联系"
 NOV_RSLP_expand_trade_links_desc:0 "在第二次西俄战争之前，俄美贸易的主要枢纽是马加丹。尽管经过多次扩建而成为一个宏伟的港口，但它与主要人口中心之间的巨大距离使其效果不佳。然而，现在我们在俄罗斯西部的统治已经得到巩固，更多的海上贸易路线正在开放，如摩尔曼斯克和圣彼得堡。通过对我们的关税和政策稍作调整，一批源源不断的俄罗斯货船和水手将比我们的任何外交官都更有分量。"
 NOV_RSLP_apply_for_ofn:0 "申请自由国家组织成员资格"
 NOV_RSLP_apply_for_ofn_desc:0 "俄罗斯曾被视为东方的体现：一个狂野、狂躁的大草原，孕育着西方文明的永恒敌人。人们认为俄罗斯联邦将成为与大日耳曼国一样对美国及其盟友构成强大威胁的敌人。科里亚金总统打破了那些愤世嫉俗的国际政治分析家怀有的刻板印象。俄罗斯人与西方世界的关系并非竞争，而是作为民主的朋友日益走近。\n\n§Y随着我们加入§!§B自由国家组织，§!§Y法西斯主义将会被彻底铲除§!。"
 NOV_RSLP_meet_with_veterans:0 "会见老兵"
 NOV_RSLP_meet_with_veterans_desc:0 "许多经历过大动乱时代和随后的第二次西俄战争的退伍军人选择反对£NOV_RSLP_Icon §M社会自由党§!加入§B自由国家组织§!的努力，主要是因为他们对我们加入该联盟后俄罗斯主权的担忧。他们和普通民众必须明白，俄罗斯有能力且将与美国站在平等的地位上。"
 NOV_RSLP_reassure_moderates:0 "安抚温和派"
 NOV_RSLP_reassure_moderates_desc:0 "一些£NOV_VRPP_Icon §g全俄罗斯爱国党§!的温和派成员对俄罗斯经济可能造成的潜在损害表示关切。他们明白俄罗斯肯定会选择融入全球西方市场，但担心全球化可能导致的就业机会减少。我们将明确表示，虽然我们尊重我们的朋友，但即使是美国人也不能伤害我们的国家发展！"
 NOV_RSLP_endorse_pro_ofn_propaganda:0 "支持亲自由国家组织的宣传"
 NOV_RSLP_endorse_pro_ofn_propaganda_desc:0 "我们将利用国内外的政治宣传来对抗我们的反对派。尽管£NOV_VRPP_Icon §g全俄爱国党§!可能会指责我们的党派“出卖国家”，但我们必须强调美国在我们的斗争中给予了我们多大的帮助。制作突出我们两国兄弟情谊的电影和纪录片将能影响一些不太关注国家事务的民族主义者。"
 NOV_RSLP_appease_corporate_executives:0 "安抚企业高管"
 NOV_RSLP_appease_corporate_executives_desc:0 "很多商人之所以在俄罗斯站稳脚跟，纯粹是因为他们照搬了美国的模式，所以他们担心一旦他们的美国竞争对手开始向俄罗斯市场倾斜资源，将会发生什么事情。虽然这是不可取的，但我们必须与这些领先的公司达成妥协，特别是在保护俄罗斯企业方面，以免它们成为£NOV_VRPP_Icon §g全俄爱国党§!的代言人。"
 NOV_RSLP_talk_with_shukshin:0 "和舒克申谈话"
 NOV_RSLP_talk_with_shukshin_desc:0 "尽管瓦西里·舒克申是民主和自由的朋友，但他同样认为俄罗斯主权至关重要。作为一个一直倡导建立一个由俄罗斯领导的欧亚联盟的人，他作为国家解放者的身份极大地影响了£NOV_RAPP_Icon §B农工党§!对§B自由国家组织§!的看法。我们应该提醒他国际合作的好处，以及如果他不与我们合作，£NOV_VRPP_Icon §g全俄爱国党§!可能会利用我们潜在的失败。毫无疑问，舒克申宁愿支持自由派，也不会选择贪婪的寡头。"
 NOV_RSLP_promise_worker_concessions:0 "承诺工人让步"
 NOV_RSLP_promise_worker_concessions_desc:0 "安抚俄罗斯本土企业的工人和新兴工会至关重要。虽然我们支持全球化贸易，长期来看会给所有人带来繁荣，但我们不能假装全球化不会伤害那些支持我们的劳动者。我们可以承诺提供一些保护，但我们必须强调，在我们即将加入全球最大贸易集团之际，我们不能动摇！"
 NOV_RSLP_reach_out_to_the_disenfranchised:0 "接触被剥夺权利的人"
 NOV_RSLP_reach_out_to_the_disenfranchised_desc:0 "尽管美国的政治言论纷争不断，但它一直是一个模范的民主国家，俄罗斯至今仍在向其学习。£NOV_DSPR_Icon §P民主社会党§!的大部分支持者要么属于少数民族群体，要么是那些觉得政府在扩大自由和自治方面做得不够的人。为了削弱§P民主社会主义者§!的支持，我们将利用政府和党的媒体来暗示 £NOV_RSLP_Icon §M社会自由党§!愿意采用西方联邦模式和其他民主机构。"
 NOV_RSLP_discredit_radical_communists:0 "抹黑激进共产主义者"
 NOV_RSLP_discredit_radical_communists_desc:0 "§R俄罗斯联邦共产党§!、§e社会革命党§!以及£NOV_DSPR_Icon §P民主社会党§!里某些不怎么讨喜的威权派一直在攻击£NOV_RSLP_Icon §M社会自由党§!政权，指责其准备将“美国的苦难和混乱引入俄罗斯联邦”。然而，他们很快就会发现科里亚金的计划中并没有包含任何剥削性质的事物，总统一直在更加积极地推动国际友爱，这一点甚至超过了共产主义者所做的。让我们向人民澄清这一点。"
 NOV_RSLP_acknowledge_past_mistakes:0 "承认过去的错误"
 NOV_RSLP_acknowledge_past_mistakes_desc:0 "以前，£NOV_VRPP_Icon §g西罗维基§!迫害了£NOV_DSPR_Icon §P民主社会党§!的前身。过去的政权严重压迫了§x民粹派§!，导致了许多本可以避免的悲剧。现在，一个更加人道的政党正掌握权力，我们应该努力工作，代表£NOV_VRPP_Icon §g西罗维基§!进行赔偿和向受害者道歉。尽管£NOV_DSPR_Icon §P民主社会党§!、§x社会革命党§!和§e俄罗斯联邦共产党§!会对这一举动表示赞赏，但£NOV_VRPP_Icon §g全俄爱国党§!会因为我们宽恕“§x工团主义恐怖分子§!”而不喜欢我们。"
 NOV_RSLP_talk_with_kantorovich:0 "和康托罗维奇谈话"
 NOV_RSLP_talk_with_kantorovich_desc:0 "列昂尼德·康托罗维奇是俄罗斯主流左派的化身，他们仍然对我们通过加入§B自由国家组织§!支持全球化抱有顾虑。与§g普里马科夫§!相比，如果我们能够在保护工人免受过度贸易协议的承诺方面提供一些有意义的保证，我们应该能够从他那里获得更多支持。如果我们与£NOV_DSPR_Icon §P民主社会党§!合作，并修改我们的目标以考虑俄罗斯工人的声音，与科里亚金总统共进几顿午餐应该能消除他的所有顾虑。"
 NOV_RSLP_dspr_campaign:0 "£NOV_DSPR_Icon  §P民主社会党§!正在组织反对§B自由国家组织§!的活动！"
 rslp_fopo_tt:0 "科里亚金总统计划了他的自由世界之旅。"
 rslp_ofn_tt:0 "已经准备完成。"
 rslp_shukshin_talk_tt:0 "我们在舒克申的追随者中积累了足够多的支持，我们已经能够与他本人交谈了。"
 rslp_shukshin_tt:0 "£NOV_RAPP_Icon §B农工党§!和£NOV_VRPP_Icon §g全俄爱国党§!仍在积极反对我们。"
 rslp_conservative_100_tt:0 "我们得到了来自£NOV_RAPP_Icon §B农工党§!近乎完全的支持以及来自£NOV_VRPP_Icon §g全俄爱国党§!的大部分支持。"
 rslp_kantorovich_talk_tt:0 "科里亚金是时候亲自与康托罗维奇谈谈这件事了……"
 rslp_kantorovich_tt:0 "£NOV_DSPR_Icon §P民主社会党§!仍在试图组织俄罗斯加入§B自由国家组织§!"
 rslp_socialist_100_tt:0 "我们得到了来自£NOV_DSPR_Icon §P民主社会党§!近乎完全的支持。"
 NOV_koryagin_prepare_our_diplomats_tt:0 "£NOV_RSLP_Icon §M社会自由党§!将推动其最终议程：加入§B自由国家组织§!。"
 NOV_kantorovichs_mind_tt:0 "§P我们将输出团结，不仅是政治家的团结，还有劳动人民的团结！§!"
 NOV_shukshins_heart_tt:0 "§B希望他能听进去。§!"
 NOV_RSLP_autonomous_republics:0 "联邦自治共和国"
 NOV_Felix_Serebrov:0 "费利克斯·塞列布罗夫"
 NOV_Sergei_Kovalev:0 "谢尔盖·科瓦列夫"
 NOV_Naum_Meiman:0 "瑙姆·梅曼"
 NOV_Vyacheslav_Bakhmin:0 "维亚切斯拉夫·巴赫敏"
 NOV_Felix_Serebrov_hog_desc:0 "§Y俄罗斯联邦副总统§!\n£NOV_RSLP_Icon §M俄罗斯社会自由党§!\n--------------\n费利克斯·阿尔卡季耶维奇·塞列布罗夫生于1930年。他的父亲成为苏联镇压的受害者，从小让费利克斯对威权主义产生了本能的蔑视。在苏联的监禁期间，他得以重新进入工程学院，但不久后因胃溃疡而不得不中断学业。\n\n正是在疗养期间，塞列布罗夫作为一个创始成员加入了一个地下反对西罗维基的异议运动，与安纳托利·科里亚金等人一起。他们对联邦企业的镇压感到厌恶和不满，并致力于通过和平手段来结束这一现象。\n\n经过多年的奋斗，塞列布罗夫终于获得了副总统的职位，与他长期的朋友科里亚金一起决心为欧亚大陆带来新的、和平的时代。"
 NOV_Sergei_Kovalev_for_desc:0 "§Y外交部长§!\n£NOV_RSLP_Icon §M俄罗斯社会自由党§!\n--------------\n过去几十年来，俄罗斯一直不是一个宜居的地方，这种环境并不会培养出善良的态度。谢尔盖·科瓦列夫是一个罕见的例外——他是一位学者，曾与托木斯克的沙龙有过合作，后来专攻外交艺术。作为§M社会自由党§!的一名活动家，他最终被选为俄罗斯对外发声的新声音。\n\n科瓦列夫撰写了近60部生物物理学作品，他明白——不管纳粹和其他类似政权怎么说——地球上没有人天生高人一等或低人一筹。科瓦列夫希望将这种理念传播到国外，促进和平、善良和国家间的理解。"
 NOV_Naum_Meiman_eco_desc:0 "§Y经济部长§!\n£NOV_RSLP_Icon §M俄罗斯社会自由党§!\n--------------\n在整个大动乱时期开始后的历史上，联邦的经济主要由权贵、恶棍和走狗运作。这些冷酷、不合逻辑的资本家将个人利益置于一切之上，而不妥协的社会主义者则呼吁采取暴力破坏行为，导致支出将经济推向极限。瑙姆·梅曼代表着这一趋势的改变——他是一位科学家和数学家。\n\n作为俄罗斯犹太人，梅曼逃离了追随他的猖獗反犹太主义，在托木斯克找到了庇护；只有在£NOV_RSLP_Icon §M社会自由党§!组织形成之后梅曼才真正开始从事政治活动。现在作为经济部长，梅曼希望为一个温和而繁荣的资本主义带来秩序，而不再是一片冷酷、以自我为动力的混乱之海。"
 NOV_Vyacheslav_Bakhmin_sec_desc:0 "§M俄罗斯人权理事会主席§!\n£NOV_RSLP_Icon §M俄罗斯社会自由党§!\n--------------\n人类创造了许多奇迹和无尽的喜悦，但同时在其自毁无益的追求中也制造了无数的恐惧。虽然其他国家可能会毫无目的地建立军事力量以应对可能出现的冲突，但这不是社会自由党追求的无意义的信条。事实上，维亚切斯拉夫·巴赫敏也不会如此。\n\n作为一个鼓动群众的连环惹事者，巴赫敏通过一系列共同的熟人与民粹派有着间接的联系。作为一个坚定的和平主义者，他的目标是将俄罗斯人民引领进一个被剥夺了太久的人权黄金时代。"
 NOV_RSLP_vrpp:0 "§W-§!§B-§!§R-§! §s动摇 £NOV_VRPP_Icon 反动派§! §R-§!§B-§!§W-§!"
 NOV_RSLP_vrpp_campaign:0 "£NOV_VRPP_Icon §g全俄爱国党§!正在组织反对§B自由国家组织§!的活动！"