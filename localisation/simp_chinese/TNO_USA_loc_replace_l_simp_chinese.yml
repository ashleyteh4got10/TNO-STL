 POLITICS_GLN_DESC: "约翰·格伦异军突起，一跃登上总统宝座，令许多观察家十分吃惊，毕竟共民党一贯谨慎而保守。格伦告别太空生涯，踏入政治舞台不过短短六年，但摆在这位新总统面前的可能性却是之前任何一位总统都不敢想象的。在德国和日本还在拼命地维持自己的霸权时，格伦已经放眼群星。\n\n和预期一样，格伦政府的主要目标是航天事业，并征服这最后边疆。作为第一位完成太空飞行的人类以及第一位从政的宇航员，格伦会继续加大对航空航天领域的投资力度，正如他担任俄亥俄州州长时做的那样。美国的导弹和火箭科技日新月异，登陆月球将不再是遥不可及的梦想，而一旦征服了月球，NASA的下一步又会是什么呢？\n\n但格伦能当选总统，并非仅凭自己的名望，更是凭借他在俄亥俄州大获成功的福利改革计划——这帮格伦争取来了老年群体和贫困选民的投票，打消了那些质疑他只想着满天繁星的反对声音。\n\n虽然格伦不会因为太空梦而弃美国于不顾，但只有那些和他熟悉的人才知道他真正想要什么。格伦谈论克尔纳登月时总是很有节制，念着事先准备好的讲稿，给公众一种冷静的感觉，但他申请的第一笔预算已经让一切不言而喻：格伦领导的美国会重返太空。这一次，只准成功，不准失败。"
 WORLD.7120.t: "[Get_newspaper_header]约翰·格伦就任美国总统"
 WORLD.7120.desc: "今日的民主党人欢欣鼓舞，庆祝前宇航员约翰·格伦击败共和党的总统候选人，赢得总统大选。格伦在就职演说中赞扬了美国人民的独特精神，鼓励全体美国人敢于梦想，为崇高事业而奋斗。\n\n作为第一个完成轨道飞行的美国人，格伦先生虽然身在地球，心灵却似乎从未离开过浩瀚的星河。他宣誓要让美国在太空竞赛中拔得头筹，承诺向NASA提供大笔资金，并详细阐述了代价高昂的飞行计划，希望一劳永逸地在上述领域赶超法西斯国家。有评论称他为空想家，只会热血上头制定烧钱的计划；但也有许多评论对他的大胆愿景持高度赞扬的态度，希望他能推动美国乃至世界进入科学的新纪元。"
 WORLD.7120.a: "呸！太空是属于德国的！"
 WORLD.7120.b: "狂野的太空冒险，说不定够美国人忙一阵子了。"
 WORLD.7120.c: "美利坚向星辰进发。"
 WORLD.7120.d: "愿他们勇敢地航向前人所未至的领域。"
 WORLD.7620.t: "[Get_newspaper_header]约翰·格伦拿下第二任期"
 WORLD.7620.desc: "约翰·格伦宣誓要飞向月球，而现在，他已着地。在成功的第一任期后，太空飞行的壮举和广受欢迎的国内政策为这位前宇航员赢下了第二任期。\n\n格伦对太空探索的追求没有丝毫放缓的意思，更为宏大的任务已经提上日程，而NASA则资金充沛、蓄势待发。批评者认为总统太过沉迷这些“面子工程”，而共民党人则寄希望于进一步的国内发展和社会保障网建设，他们认为这能争取来美国人的支持。"
 NPP_collapse.31.f: "约翰·格伦,循此苦旅，直抵群星！"
 USA_elec_prim.17.i: "约翰·格伦当选总统！"
 WORLD.7620.a: "这实在是太离谱了！"
 WORLD.7620.b: "飞往红色行星？"
 WORLD.7620.c: "冲向火星！"
 RULE_OPTION_USA_DEM_PRIMARIES_1976_GLENN: "£GFX_rd_d_texticon §B约翰·格伦§!"
 RULE_OPTION_USA_DEM_PRIMARIES_1976_GLENN_DESC: "\n\n§R需要:§!\n§M£GFX_npp_texticon 国家进步公约赢得§!£TNO_game_rule_flag_USA  §Y1972年美国总统选举§!\n§R注意：如果共民联盟候选人赢得1972年大选，则此游戏规则不会生效§!。\n\n或\n\n巴里·戈德华特 或 菲利普·哈特 赢得1972年大选"
 USA_presidental_candidate_john_glenn:0 "约翰·H·格伦"
 USA.GLN_flavor.1.t:0 "群星一梦"
 USA.GLN_flavor.1.desc:0 "他坐着火箭飞船在地球上空翱翔。当他透过太空舱的窗口凝视下面那片四处伸展的绿色大陆时，他开始意识到人类其实是这样渺小。他突然想起，如果每个人都有机会看到他所看到的——很明显，他们也会意识到所有的斗争、战争和仇恨是多么微不足道——世界也许就能终于学会和平的真谛。一个人人都能为促进科学、繁荣和——\n\n突然的铃声将他从飞船上拉回地球，他从往日的旧梦惊醒。他从那张可怜兮兮的，立于地面上的小床上懒洋洋地坐了起来，摸索着找到了放在床头柜上的电话，他把听筒拉到耳边。”这里是约翰·格伦，请说——顺带一提，你知道现在几点钟吗？”\n\n顺着线路传来一道痛苦的声音，“约翰，这里是詹姆斯。你听说新闻了吗？”\n\n格伦一下睡意全无，他回答道：“詹姆斯·埃德温·韦伯，我现在还没起床。请简要点说。”\n\n“他们要从NASA撤资！”\n\n拿着一杯匆忙煮好的咖啡，他疯狂地翻了一会儿晨报，约翰·格伦只感到肠子里一阵无来由的剧痛，他为之奋斗终身的前景似乎马上要化为泡影。”可那又怎样，德国人确实先到了月球，这就意味着太空竞赛结束了？我们能做点什么？他们不能就这样放弃未来！”\n\n“尼克松已经下定决心了。他想把钱转到军队和其他‘更务实的项目’上。”听到电话那边的太空人愤怒的呼气声，韦伯顿了一下。“我已经无能为力了，没人能阻止他。对不起，约翰。”\n\n格伦觉得自己又回到了那冲向太空前的紧张时刻。政府绝不能让人类追寻的群星之梦变成一场幻梦。美国必须活下来，见识群星的壮景。“没人能阻止他？我们走着瞧。”"
 USA.GLN_flavor.1.a:0 "仍有人心怀梦想。"
 USA.GLN_flavor.2.t:0 "捍卫群星"
 USA.GLN_flavor.2.desc:0 "约翰·格伦面前站着一众科学家、工程师、科学爱好者和记者。在此之前，格伦已经和其中一些人聊了聊NASA的窘境以及做宇航员的感受，还给一些人签了名。而现在，格伦要开始搞大新闻了。\n\n“那天我正在做一个甜蜜的梦，梦见了我的最后一次任务，直到我的朋友詹姆斯·韦伯叫醒我，让我看看新闻。当我看到政府打算放弃未来的航空计划时，说客气点，我挺糟心。一定程度上是因为想到自己再也不能去太空了而痛心，但这并非唯一的原因。”\n\n“尼克松总统已经放弃了我们的太空竞赛。他接受了经济停滞和衰退，把星星拱手让给了法西斯。他说，我们输掉了太空竞赛，但只要繁星还在闪烁，我们就还没有失败。我恳求总统慎重考虑他的决定。美国的未来，乃至整个人类的未来，就在我们的头顶上。”\n\n大约二十分钟后，格伦作了结语，台下掌声雷动。这场演讲达到了应有的效果，格伦感到很满意，现场有那么多记者，明天的报纸可有看头了。然而他很快又被挫败感包裹。一个人的声音可救不了NASA。\n\n如果美国的太空航行想要有个未来，那就必须有人代表它在权力的殿堂发出自己的声音。约翰·格伦从来就不热衷于政治，但当他仔细斟酌利弊后，他意识到从政才是实现他梦想的最好途径。在开车回家的路上，他想起几个月后俄亥俄州的州长选举就要开始了。这是一个足以称作疯狂的想法，但是……"
 USA.GLN_flavor.2.a:0 "执政的宇航员？"
 USA.GLN_flavor.3.t:0 "约翰·格伦赢得俄亥俄州州长竞选！"
 USA.GLN_flavor.3.desc:0 "在这场紧追不舍、得票率只差不足百分之一的竞选中，新秀政治家约翰·格伦以共和党党员身份当选俄亥俄州州长。格伦深受美国心脏地带居民的欢迎，他还是事业成功的宇航员，更因此而家喻户晓。格伦曾发表演讲怒斥尼克松削减NASA经费的决定，这场胜利自然为他的政治雄心铺平了道路。\n\n现在，格伦在州议会规划着下一步策略，思索着未来几十年的目标。他本就支持广泛，现在更是凭借当选州长巩固了自己的地位，几乎没有什么障碍能阻挡他实现自己的野心。他已经开始幻想自己坐镇白宫，下令开展他的宇宙计划，永远地改变美国的命运，即便现在看来，这个梦想有些遥不可及。\n\n电话铃响起，他接起电话，深知那头便是尼克松本人，他也准备宽宏大量地接受尼克松干瘪的祝贺。格伦知道尼克松之流不是他的对手，谁都阻止不了他坐上总统宝座。"
 USA.GLN_flavor.3.a:0 "格伦的一大步。"
