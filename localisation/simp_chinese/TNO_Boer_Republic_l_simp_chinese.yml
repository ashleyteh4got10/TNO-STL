 POLITICS_ALBERT_HERTZOG_DESC: "Judas. Quisling. Benedict Arnold. Albert Herzog has been called many things by his Anglo opponents, but now all they can call him is Prime Minister of the Afrikaner Volksstaat. He himself sees his actions not as betrayal for he never held any loyalty to a government forever dominated by the Anglo. Having orchestrated the botched coup attempt against the United Party government of Prime Minister Smuts Herzog nevertheless managed to secure the homefront in the South African war and secure independence for the Afrikaner people after 60 years of subjugation, first by London and then by Cape Town.\n\nThe new Prime Minister is a contradiction. A gentleman who used to play tennis with De Villiers Graaff on a weekly basis and remains married to an English woman, yet he was one of the key figures to kick off the South African war to break Anglo domination. The memory of his ill mother, forever scarred by British Concentration camps from the Second Boer War was one of the formative memories of Albert’s life. After having studied law, he joined the National Party in the controversial election in 1948, getting elected in the eastern Transvaal. Growing more and more in renown by both his allies and his enemies, Herzog became leader of the opposition in 1958 when he began to plan a different kind of opposition than just merely parliamentary.\n\nThe new Prime Minister has consolidated political power under him with the backing of the National Party and segments of the Ossewabrandwag where the construction of a new South Africa can begin. Tempering the fervor of the OBW somewhat, Herzog is now free to work without even a semblance of opposition. But his first act as Prime Minister will remain the most iconic. After all those years of opposing the television, now finally Prime Minister Herzog can get the television banned nationwide and along with it banish out the unwanted hostile influences that have affected the Afrikaner people."
 POLITICS_JOHANNES_VAN_RENSBURG_DESC: "Long had Johannes van Rensburg waited for his chance to see his ideals through, and when the South African War erupted, he unleashed the opportunity that had finally come to realise National Socialist ideas on the Cape, ending the pathetic attempts to move towards a more equal nation with an everlasting iron fist.\n\nA student of both the German language and law, he traveled to Germany in the early 1930s to meet with Adolf Hitler and Hermann Göring. During these meetings, Johannes became increasingly convinced of Afrikaner supremacy over other races. Upon his return, he grew more involved with the Afrikaner extreme right, eventually leading to his election as the leader of the national socialist Ossewabrandwag organization in 1941. Under his leadership, the group carried out acts of sabotage and established a significant counter-current to Anglo leadership. Initially, the invasion of Great Britain and its subsequent collapse seemed to demonstrate the superiority of both the Germans and Afrikaners over the British. However, this ultimately led to the marginalization of the Ossewabrandwag. Waves of British exiles arrived on South African shores, easily outvoting the Boers and establishing a long period of dominance for the United Party in elections.\n\nThe final chance for the “freedom” of the Afrikaners, under wise German leadership, is here, and Johannes stands ready to lead his people to war with heavy German backing, to once and for all shatter the Anglo dominance of South Africa and liberate the Afrikaners from the yoke forced upon them since 1902."
 POLITICS_JOHN_VOSTER_DESC: "Long has he been in exile, and now John Vorster has seen his patience of twenty years rewarded. One of the Ossewabrandwag’s hardliners, John is dedicated not so much to the cause of National Socialism as much as a furious opposition to Great Britain and the continued Anglo dominance of lands that should rightfully belong to the Afrikaner,s for it was them who settled them first. Being interned for sabotage actions in the Second World War, Vorster was just one of many of the OBW who were exiled to Namibia where they helped set up the new German colony of RK Sudwest, training in paramilitary affairs under the Germans.\n\nWith victory in the South African war, it was near inevitable that the OBW would secure power in the Volksstaat and as van Rensburg’s most devoted follower John Vorster was a shoe in for the position of Prime Minister, as the National Party has become subjugated to the will of the Ossewabrandwag.  Now he can get to work on building the perfect state for the Afrikaner people, free of Anglo influences and with the Native majority firmly subjugated and segregated under rigid guidelines that go far beyond anything that the United Party had enforced. Apartheid is the law of the land, and it shall be enforced with an iron fist upon the unruly peoples who are unworthy of being full citizens of the new Afrikaner Volksstaat."