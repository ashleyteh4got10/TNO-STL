 POLITICS_ALBERT_HERTZOG_DESC: "犹大。吉斯林。本尼迪克特·阿诺德。阿尔伯特·赫尔佐格被他的英裔政敌冠以诸多骂名，但如今他们所能称呼他的只有一个——阿非利卡人民国总理。他本人并不认为自己的行为是背叛，因为他从未对一个永远由英裔主导的政府抱有任何忠诚。赫尔佐格策划了针对扬·史末资总理领导的统一党政府的未遂政变，尽管如此，他仍在南非战争中稳固了后方，并在历经伦敦与开普敦长达六十年的双重奴役之后，为阿非利卡人民赢得了独立。\n\n这位新任总理是一个矛盾体。一位曾与德维利尔斯·格拉夫每周打网球的绅士，一位至今仍与英裔女子保持婚姻关系的男人，然而他却是引爆南非战争、打破英裔统治的关键人物之一。阿尔伯特一生中最深刻的记忆之一，便是他那体弱多病的母亲——她在第二次布尔战争中被关入英军集中营，留下了永远的创伤。在修完法律学业后，他于1948年那场充满争议的选举中加入了国民党，并在德兰士瓦东部当选议员。随着他在盟友与敌人中的声望日益高涨，赫尔佐格于1958年成为反对党领袖，从那时起，他便开始筹划一种不同于单纯议会斗争的反对方式。\n\n这位新任总理在国民党与部分牛车哨兵组织的支持下巩固了政治权力，一个崭新的南非即将在他的手中奠基。赫尔佐格稍稍压制了牛车哨兵的狂热情绪，如今他可以在没有任何反对迹象的情况下自由施政。但他作为总理的第一项行动将永远最为世人铭记。毕竟，在反对了电视这么多年之后，赫尔佐格总理现在终于可以在全国范围内禁止电视，并借此驱逐那些长期侵蚀阿非利卡人民的有害外来影响。"
 POLITICS_JOHANNES_VAN_RENSBURG_DESC: "约翰内斯·范·伦斯堡早已等待多时，期盼着将自己的理想付诸实践的机会；当南非战争爆发之际，他终于等到了这一良机，在好望角地区推行国家社会主义理念，以永恒的铁拳终结那个 pathetic nation 迈向更为平等国家的可悲尝试。\n\n作为一名德语与法律专业的学生，他于1930年代初前往德国，与阿道夫·希特勒及赫尔曼·戈林会面。在这些会晤中，约翰内斯愈发坚信阿非利卡人相对于其他种族的优越性。归国之后，他愈发深入地投身于阿非利卡极端右翼运动，最终于1941年当选为民族社会主义组织牛车哨兵的领导人。在他的领导下，该组织实施了多次破坏活动，并对英裔统治形成了有力的对抗。起初，大不列颠的入侵及其随后的崩溃似乎印证了日耳曼人与阿非利卡人相对于英国人的优越性。然而，这最终却导致了牛车哨兵的边缘化。一波又一波的英国流亡者涌上南非海岸，轻而易举地在选票上压倒了布尔人，使统一党在选举中长期占据主导地位。\n\n阿非利卡人"自由"的最终机会，在睿智的德国领导之下，已然降临；约翰内斯已做好准备，在德国的鼎力支持下率领他的人民投入战争，一劳永逸地粉碎英裔对南非的统治，将阿非利卡人从1902年以来强加于他们身上的枷锁中解放出来。"
 POLITICS_JOHN_VOSTER_DESC: "他已流亡多年，如今约翰·沃斯特二十年的耐心终于得到了回报。作为牛车哨兵的强硬派之一，约翰所热衷的并非国家社会主义本身，而是对大不列颠及持续英裔统治的狂怒反对——那些土地理应属于阿非利卡人，因为他们才是最先定居于此的人。因在第二次世界大战期间从事破坏活动而被拘禁，沃斯特只是众多被流放至纳米比亚的牛车哨兵成员之一，他们在那里协助建立了新的德国殖民地西南非总督辖区，并在德国人手下接受准军事训练。\n\n随着南非战争的胜利，牛车哨兵掌控阿非利卡人民国政权几乎已成定局；作为范·伦斯堡最忠实的追随者，约翰·沃斯特出任总理一职可谓水到渠成，因为国民党已经屈从于牛车哨兵的意志。如今他可以着手为阿非利卡人民建设一个完美的国家——一个没有英裔影响的国家，原住民多数群体在远超统一党所执行的严苛规定之下被牢牢压制与隔离。种族隔离是这片土地的法律，它将以铁拳强制施行于那些不配成为新阿非利卡人民国正式公民的桀骜不驯之民。"