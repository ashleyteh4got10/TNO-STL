 POLITICS_CHARLES_FRASER_DESC: "After four hundred years of being a colony and ten years or so under German occupation, Mozambique is “free” as a puppet state under construction. The new South African administration is a lighter shade of gray compared to the previous one but not many people in Mozambique are cheering for the temporary authority figure that is Charles “Pop”  Fraser. Sent to Lourenco Marques with a mission to quickly build up a local security force of collaborators that can stand firm against the ever growing threat of the Pan Africanists.\n\nSigning up as a proud volunteer when the Second War Kicked off, Charles Fraser served with distinction in the Cape Field Artillery, part of the 6th field regiment of the South African Artillery. Launched into command with the death of his commander Lieutenant-Colonel Kay died in battle, Fraser proved a deft commander as well as a skilled leader with a silver tongue. With the war’s end he continued to climb the ranks serving as coordinator of the cooperation between the Army and the South African Air Force. After proving his worth once again in the South African War, Pop Fraser now races against time to make something of the abused, neglected colony before it all falls apart. A new order rises in Africa, and Fraser is determined to try and shape the newborn nation according to the whims of Cape Town."
 POLITICS_KAREL_POTT_DESC: "Long has Karel Mojardin Pott been in exile, far away from his homeland of Maputo in Mozambique having spent his days as a lawyer in Durban. Born in 1904, he managed to represent Portugal in the 1924 Olympics, afterwards becoming a lawyer. Being of mixed race with a Dutch father and a Native mother he had long became active in activism against the segregationist nature of Mozambique as well as take action against the many different casinos that operated within the region but had to quickly leave when Germany invaded and seized the colony by force.\n\nWith the liberation of Mozambique he returned home and began to organize once again, being allowed to run in the elections as a way of legitimizing them with real opposition while South Africa’s favourite candidate got their full support. Yet the educated people of Mozambique voted for Pott nevertheless, and now the new President finds himself stuck between two fires. In the South, South Africa looks with great apprehension towards the charismatic reformer with their own candidate reduced to opposition. Cape Town still holds many of the cards, and may replace Pott if he goes too far. In the north, and deep inside the countryside FRELIMO has denounced him as a collaborator and vowed to overthrow him and his Mozambique Democratic Party./n/nIn the middle stands Pott, eager to try and facilitate an actual future for Mozambique under the watchful eye of the Cape. Yet for the first time in a long while, more and more people in the country are starting to feel cautiously optimistic about their future which was a feeling that had seemingly long ago left the shores of Mozambique"
 POLITICS_MANUEL_DOS_SANTOS_DESC: "Portugal no longer holds any real chance nor influence in Mozambique yet a group of people of Portuguese descent still hold power there, even after its newfound  independence. Manuel Perereira Pimentel Dos Santos represents the interests of the wealthy Portuguese elite that has dominated Mozambique for the last four hundred years representing the oligarchic interests of major companies and land owners returning now that Huttig’s pointless tyranny has ended./n/nA Portuguese civil engineer and technocrat who got to work building on the infrastructure of Mozambique in general, the occupation of the colony left him without much new work while South Africa offered plenty of opportunities to continue development. One of the leading figures of the Portuguese who left Mozambique after its occupation, it was an easy choice for him to lead the charge as South Africa’s preferred candidate in the Mozambican elections held after the war’s end and managed to win them without relative ease.\n\nThe public promises made by Dos Santos are vast. Reconstruction, safety, security and a new beginning for Mozambique under a capitalist framework, and a strong pushback against the dangerous communists of FRELIMO. All the while, Dos Santos has made no comment on really improving things for the common man more than is needed to stabilize control over Mozambique. Only time will tell if he can build up a technocratic system that will last, or if the people of Mozambique will throw it off its yoke like they did to the German occupiers."
 GAZ_devastated: "Mozambique Devastated"
 GAZ_devastated_desc: ""
 GAZ_rebirth_under_iron_fist: "Rebirth Under the Iron Fist"
 GAZ_rebirth_under_iron_fist_desc: "In the wake of relentless conflict, Mozambique finds itself gripped by the unyielding authority of Lieutenant General Charles Alan Fraser. The country is forced to function as a tightly controlled military administration, with local institutions serving as extensions of Pretoria's will. Dissent is ruthlessly suppressed, and any hope for immediate self-determination is sacrificed in the name of order.\n\nYet even under this oppressive regime, a spirit of reconstruction has begun to emerge. Ambitious nation-building projects are underway, massive infrastructure programs, industrial revitalization, and sweeping educational reforms signal a determined effort to rebuild Mozambique from its shattered past.\n\nHowever, let there be no illusions: every road paved, every factory built, and every school established is designed not to benefit the local populace, but solely to serve South Africa's industrial and geopolitical ambitions. In this grim status quo, Mozambique's reborn prosperity is merely a means to bolster its colonial master's economic might."
 GAZ_scorched_earth_broken_dreams: "Scorched Earth, Broken Dreams"
 GAZ_scorched_earth_broken_dreams_desc: "Mozambique's economic destiny has been predetermined by centuries of exploitation. First a Portuguese colony, then subjugated under German control, the country has long been reduced to a repository of raw materials for the benefit of external powers. Today, as a de facto South African colony, Mozambique's economy exists solely as a source of extraction. Its fertile lands, mineral wealth, and labor are relentlessly exploited to fuel South Africa's industrial ambitions, leaving the local economy solely committed to resource extraction."
 GAZ_from_the_ground_up: "From the Ground Up"
 GAZ_from_the_ground_up_desc: "Mozambique had never been allowed to form a proper military of its own, being first a Portuguese colony and then a German colony.. Now, under the determined oversight of SAF Governor Lieutenant General Charles Alan Fraser, ambitious efforts are underway to build a brand-new force from the ground up. This effort is driven by the urgent need to create a reliable, modern army of locals that can secure Mozambique and serve as a bulwark against the rising Pan-African threat.\n\nAlthough this nascent force is still battered and disorganized, the current strategy emphasizes rapid modernization, streamlined command structures, and intensive training programs directly imported from the South African military model.\n\nGovernor Fraser is focused on creating an officer corps and cracking down on local corruption and establishing a proper Mozambican military. The vision is clear: to transform the loose force of collaborators into a highly effective anti-Pan-African force capable of maintaining security, quelling internal dissent, and defending Mozambique's borders. With sustained investment and a clear mandate, this new military force is poised to become the cornerstone of regional stability, even if it must first overcome significant initial hurdles."
 GAZ_from_the_shadows: "From the Shadows"
 GAZ_from_the_shadows_desc: "Beneath Mozambique's imposed order, a revolutionary fervor is stirring. Under the charismatic leadership of Samora Machel, a pan-African movement is galvanizing discontent among the oppressed masses. Widespread calls for real freedom and an end to colonial exploitation now coalesce into an insurgency that threatens to upend the temporary puppet regime. This rising tide of resistance challenges not only the occupation's legitimacy but also the extraction-based model that has defined Mozambique's fate for centuries."
 USA_can_send_aid_mozambique_troops: "We will be able to send aid and volunteers to [GZO.GetNameWithFlag] in their fight against Japan!\n§RMondlane is devoted to minimizing foreign influence over Mozambique. In case he emerges victorious, we would gain little.§!\n"
 USA_wild_card_bitches: "With our backing Uria Simango will rise up in the §YNampula and Pemba.§! While weak he will be aligned with our interests in case of victory.\n"
 JAP_can_send_aid_mozambique_troops: "We can now send aid and volunteers to [GAZ.GetNameWithFlag].\n"
