 GAZ.2.t: "关于莫桑比克近期暴力活动的报告"
 GAZ.2.desc: "局势报告：莫桑比克武装冲突。\n\n看来并非整个非洲都已厌倦暴力。在莫桑比克地区，新近建立的国家已陷入内战状态，据我们所知，目前存在两大阵营。第一个阵营由萨莫拉·马谢尔领导，他是一位地方社会主义领袖，据称在莫桑比克选举中战胜了他的非社会主义对手。这一主张遭到了其反对派的质疑，由此引发的地区动荡已演变为一场武装冲突。日本人自然站在了马谢尔一边，其他几个周边政府也予以支持，无疑是期望他的政府在回报他们的支持时给予优惠。\n\n美国在莫桑比克乃至整个非洲利益的未来，取决于我们能否击垮马谢尔政权。然而，此案中的反对派并不一定理想。爱德华多·蒙德拉纳说得委婉些，算是个极端人物，他的想法并不完全有利于莫桑比克民主的未来。更甚的是，蒙德拉纳是坚定的孤立主义者，反对外国势力进一步干涉莫桑比克。即使我们能推翻马谢尔政权，美国也无法在贸易或外交方面直接从蒙德拉纳的胜利中获益。\n\n当然，还有第二个选择需要考虑。在蒙德拉纳阵营中，还有另一个人物可能更乐于在未来与美国合作。乌里亚·西曼戈是蒙德拉纳党内的温和派，是政府中的理想主义者及我们民众更乐于支持的那种人。更为关键的是，由西曼戈领导的政权将在未来对建立经济和外交关系持更开放的态度。然而，西曼戈打消了在没有我们支持的情况下采取行动的念头，而如果我们援助他，蒙德拉纳也不会袖手旁观，任由西曼戈占据主导。蒙德拉纳和西曼戈若能结成统一战线，将更加强大，我们在做出决定前需要权衡轻重。"
 GAZ.2.a: "只要能把日本赶出非洲，就是美国的胜利。"
 GAZ.2.b: "若没有最终回报，我们不能投入其中。"
 GAZ.3.t: "海岸硝烟"
 GAZ.3.desc: "萨莫拉·马谢尔坐在海港上方的一座矮丘上，抽着雪茄。这是在经历了无数个小时的枪击殖民者、与对手密谋周旋以及管束青少年新兵之后，一次难得的喘息。当他手下在他身后筹备着欢迎队伍时，马谢尔眺望着大海。天空布满飞鸟，而非硝烟；水中游弋着鱼群，而非血水；照亮这一切的只有热带的骄阳，而非燃烧村庄的火光。这便是未来的莫桑比克：洁净、美丽，最重要的是和平。\n\n但如今的莫桑比克依旧支离破碎，被饥馑掏空，仍散发着德国人遗留下的腐尸恶臭。无论是西曼戈天真的热情，还是蒙德拉纳愤世嫉俗的孤傲，都无法成为这个国家的救赎，因为没有人能遗世独立。没有一个国家，尤其是莫桑比克，能够完全独立于其邻国。当民主在微小的危机中破碎，或是仅仅禁运的威胁就能将傀儡的绳索套在莫桑比克的脖子上时，崇高的理想便毫无意义。若愤世嫉俗的封闭主义扼杀了发展的希望，或让莫桑比克在面对外部势力时毫无防备，那它便毫无意义。不，当前的斗争已不再是致力于解放莫桑比克，它已蜕变成一场意识形态的圣战，服务于那些狂热强人的自负，而非建设一个令人自豪的国家。\n\n马谢尔对殖民者毫无好感，与他们并肩作战这一事实本身就让他充满厌恶。但只有借助殖民者的援助，莫桑比克才可能强大到足以生存下去。他的士兵们很快就注意到了地平线上那灰色的轮廓，并加快了准备工作。日本驳船向天空喷吐着烟雾，为这片土地带来了统一的工具，也带来了那些企图从中渔利的代理人。马谢尔将雪茄丢在地上，正了正帽子，走向了港口。"
 GAZ.3.a: "莫桑比克欲获自由，必先求得统一。"
 GAZ.4.t: "里里外外"
 GAZ.4.desc: "随着黎明临近，夜色正转为灰白。在克利马内外的原野上，最后一支美国军事顾问部队正等待着离开这个国家。对于这支部队而言，事情来得突然，他们有幸成为在战胜社会主义者和日本人之后，最后一批撤离该国的人。美酒与欢乐在莫桑比克首都的街头流淌了整整一夜。随后，命令传达下来，清楚明了。蒙德拉纳已控制国家，美国士兵得到感谢，并被要求在五日内离境。事情就此告终。\n\n“护卫”这些美国人的是一支莫桑比克武装部队的分队，在不久之前他们还曾并肩作战。这个国家怎能在一夜之间从感恩戴德变得冷漠且充满疑心？那些在他们击溃赤色分子及其朋友时，曾与其交换故事和香烟的士兵，此刻一路上都沉默得像石头一样。\n\n当莫桑比克部队发出第一声声响时，所有人都转过头去。那是一首歌，带着浓重的口音，却令人印象深刻，毕竟这支部队里只有一小部分人真正会说英语。\n\n“在那里！”莫桑比克士兵们队形不乱，肩膀甚至没有一丝松懈，便模仿着那首熟悉的老歌高唱起来。“在那里！传话过去，传话过去，在那里！”\n\n当听到他们的朋友和昔日盟友对他们唱起这首歌时，美国士兵们爆发出的阵阵笑声被歌声淹没了。当那被改动的歌词变得清晰可闻时，笑声也随之升高，仿佛要与歌声一较高下。“扬基佬要走了！扬基佬要走了！他们的鼓声咚咚传不到这儿来！”\n\n远方传来了直升机旋翼的声音，于是莫桑比克士兵们不得不提高了自己的音量：“那就准备好，做个祈祷！传话过去，传话过去，向他们道声别！他们会越过大海，他们要走了，既然一切已结束，他们要回家去了！”\n\n即便在最后那些决定性的军靴声踏上直升机时，笑声也未曾停止，反而蔓延到了莫桑比克士兵中间，他们最后一次向自己并肩作战的战友挥手告别。"
 GAZ.4.a: "我们在莫桑比克的故事就此落幕。"
 GAZ.5.t: "铩羽归乡"
 GAZ.5.desc: "“我们还有三小时！所有人装船！”\n\n当日本军方完成从莫桑比克的最后撤离时，港口到处是人。力也一边和战友们一起将最后一批板条箱、武器和装备装载到船上，准备以败军之姿返回祖国，一边忍不住感到苦涩。\n\n蒙德拉纳要赢了。现在每个人都清楚这一点，因此撤军的决定也就此做出。为一个注定失败的事业牺牲更多生命已毫无意义，但做出结束这场解放战役的决定，他和他的朋友们都感到不是滋味。然而，他们有命令在身。\n\n全都是因为美国人。该死的美国人。\n\n每一次，他们都忍不住把手伸进他们能利用的每一场小冲突中。只要有一丝可能干涉日本，他们就会做，无论是在非洲，还是在日本的后院。力也确信，要不是蒙德拉纳背后有他的美国主子撑腰，他们本可以轻松取胜。\n\n不幸的是，他们现在什么也做不了。\n\n“打起精神，”他的朋友千三说着，将一个箱子搬上船。“我们给了他们一顿好打。下次我们会收拾他们的。再说，我觉得蒙德拉纳很快就会后悔与魔鬼做交易的。”\n\n力也咕哝了一声，但还是在他朋友身边加入了最后的登船队伍。随着最后一批日本部队登上船只，他望着莫桑比克海岸从视野中消失，摇了摇头，转过身去。如果莫桑比克想成为美国的傀儡，那就随它去吧。他们迟早会后悔的。"
 GAZ.5.a: "他们向来如此。"
 GAZ.6.t: "后见之明"
 GAZ.6.desc: "战争是件奇妙的事，它混合了启示、后见之明与悔恨，这些又反哺到下一轮的战略和决策制定中。\n\n没有任何计划能在与敌人接触后幸存，这句话既适用于战场，也同样适用于战略。在决定支持某些冲突中的哪一方时，影响决策的种种因素——包括士气、经济、领导力和政策——可能具有欺骗性。\n\n有时，那些被认为最强的人，在考验面前却土崩瓦解，而那些被认为胜算极微的人，却出人意料地成功了。马修上尉觉得这一点在今天尤为中肯。他并未负责决定美国在这场冲突中支持谁——但基于最初的评估，西曼戈在当时是正确的人选。\n\n他们怎么能知道，蒙德拉纳会比任何人预想的都要坚韧和高效呢？\n\n诚然，曾有过通往胜利的潜在路径，但他并不真的责怪当初放弃蒙德拉纳的决定。美国不能仅凭心血来潮就去碰运气，尽管在这个案子上，很明显他们本该如此。\n\n显然，有了后见之明，马修觉得他们当初在支持蒙德拉纳的问题上应该更果敢一些，但现在想这些意义不大。他们在这里输了，但至少日本人也输了。打个平手是他可以接受的结果，至于莫桑比克的未来……\n\n他不知道，那是国务院要处理的事。当他看着最后一批美国士兵装载完毕，准备永远离开这个国家时，他确实希望蒙德拉纳能为他的人民谋福祉。他赢了，现在他必须去领导。"
 GAZ.6.a: "而他们很快就会看到他会取得多大的成功。"
 GAZ.7.t: "可接受的失败"
 GAZ.7.desc: "崎山军官将失败分类为几类：可接受的、损害性的和灾难性的。\n\n值得庆幸的是，他尚未参与过任何灾难性的行动——尽管他确实有过几次失败的经历。对一次失败来说，关键在于减轻损失，让敌人付出沉重代价，并限制对日本的地缘政治影响。\n\n就莫桑比克战役而言，他倾向于将其归入“可接受”的类别。这当然不理想，也毫无疑问是一场失败——但考虑到所有因素，情况本可能更糟。当初几乎无人相信蒙德拉纳能以那样的方式取得成功。\n\n在美国拒绝支持他时，人们普遍预计他早该落败。然而，他不仅超出了日本的预料，也几乎肯定超出了美国人的预料。崎山想知道美国人是否如他们所说，会后悔“押错了宝”，但他很高兴他们确实押错了。\n\n虽然莫桑比克不会成为盟友，但美国人也同样被剥夺了从这一结果中收获的战利品。因此，日本的地缘政治地位基本未变，这已是在此情况下所能期盼的最好结果。莫桑比克境内仅存的少数日本士兵终于开始装载，他们将在数小时内撤离。\n\n也许日本会找到与蒙德拉纳共事的途径，但那是别人要解决的问题了。他手头还有一场撤退要完成，当他们回到本土岛屿时，他们将等待被部署到下一个前线。\n\n工作永无止境，他期待着他们接下来的战役能取得胜利。"
 GAZ.7.a: "因为失败绝不能成为常态。"
 GAZ.8.t: "我们在此地"
 GAZ.8.desc: "克利马内的黎明时分，所有报纸都在报道这个消息。马谢尔和蒙德拉纳都已出局，莫桑比克最后一批反对派据点已被美军及忠于西曼戈的部队肃清。结束了，一切都结束了。莫桑比克重获自由与统一。重建工作很快就能开始，但首先，庆祝活动必须完成，而且势必完成。在克利马内、马托拉和马普托的街头，美国大兵和莫桑比克士兵沉浸在各种狂欢之中。随着消息传向南北东西，烈酒、舞蹈与其他喜悦之情流淌在每一条街道上。\n\n对马克斯和他的部队来说，狂欢却得等一等。他听说了那些流传了二三手的、近乎癫狂的庆祝故事，但对他和他的部下而言，现在是守卫边境的时候。他们与一队莫桑比克士兵一起驻扎，后者无疑也听到了那些驻守城市的士兵们流传的关于美酒与爱情的相同故事。但他们却发现自己正隔着边境，凝视着邻国坦噶尼喀，这个社会主义邻国在战争期间曾支持马谢尔政权。\n\n“你觉得他们有多在乎？”哈姆扎问道，一边凝视着边境线，一边将他的老式步枪搂在肩上。确切地说，是理论上的边境线那边。毕竟，自从德国佬垮台后，这些事情还没有完全确定下来。\n\n“我不会在乎。”马克斯嘬着香烟咕哝道，脸上挂着一丝浅笑。“无意冒犯，但就国家而言，它不值得让人失眠。”他用胳膊肘碰了碰朋友，引得两人都笑了起来。\n\n“啊，你这么说……”哈姆扎笨拙地点燃自己的香烟，“但说到底它是家。而且话说回来……”他向马克斯投去一个心照不宣的、狡黠的眼神。“你又是从多远的地方跑来为它而战的？”\n\n“唉……”马克斯叹了口气，一手撑地向后靠去，自己的枪则横放在腿上。“太远了。也太久了。而且据中士说，还得过一阵子我们才能离开。”\n\n“我想这倒也好。无论如何，西曼戈肯定知道自己在做什么。”哈姆扎耸耸肩，露出一个大大的笑容望向太阳。“再说，那意味着我们会有更多时间来捉弄你们这些扬基佬了。”"
 GAZ.8.a: "我们来了，就不走了。"
 GAZ.9.t: "莫桑比克内战结果"
 GAZ.9.desc: "西曼戈与美国获胜，日本失败"
 GAZ.9.a: "确定"
 GAZ.10.t: "非洲之门"
 GAZ.10.desc: "日本代表团在深夜抵达克利马内——这座曾被称为布勒施塔特的城市。坦率地讲，他们完全不清楚在这个时间点，战争撕裂的莫桑比克首都会是怎样一番景象。消息爆出还不到二十四小时，当他们踏上城市街道时，庆祝活动显然还方兴未艾。酒水和醉汉在街头自由流淌，街道两侧房屋的窗户上，莫桑比克国旗与各色红旗并肩飘扬。很明显，他们听到叛乱分子最终失败的消息，几乎与日本人自己听到的一样快，甚至可能更早。\n\n代表团预定在一小时内与莫桑比克的领导人——如今已是唯一的领导人——萨莫拉·马谢尔会面。他们本想在他之前到达会面地点，但当他们的车辆停在那栋作为政府行政办公室的、明显修缮不足的小楼前时，他们看到了门口两侧卫兵那绝不会认错的形象。看来他们得提前开始了。\n\n尽管外表破败，建筑内部却相当完好。墙壁上排列着莫桑比克国旗以及日本国旗——这是个不错的点缀，即便明显是一种奉承。在自己以及莫桑比克保镖的簇拥下，这个总共只有三名成员的代表团以恰到好处的速度穿过走廊，走向后面最大的办公室。与外面装饰过的走廊相比，这间办公室显得颇为简朴。代表团向坐在桌后的男子恭敬鞠躬，后者也站起来以礼相待。此人便是莫桑比克毋庸置疑的统治者，萨莫拉·马谢尔。\n\n他伸出双手，笑容爽朗而真诚，示意来人在他对面坐下。“先生们，”他开口道，目光扫向他的日本同行，“我们该创造历史了。”"
 GAZ.10.a: "我们期待与您合作。"
 GAZ.11.t: "失败的刺痛"
 GAZ.11.desc: "杰克在陆军服役快十年了，但他从未料到会发现自己身在莫桑比克打仗。他入伍是为国效力，但他从未想过这意味着会被派往异国他乡，去打一场不属于自己的战争。在莫桑比克待了三个月，目睹了他从未想过会见到的事情，如今他却不得不离开这个国家。对杰克来说，才来了几个月就要离开，这事真的很突然。显然，美国支持的领导人输了，现在这个国家被某个叫萨莫拉·马谢尔的将军统治着，尽管杰克并不关心这场战争中的领导人的名字。在他短暂的部署期间，他几乎没见过一个莫桑比克士兵，他所做的就是朝日本兵开枪。他对这个国家一无所知，离开时也不会比来时多了解些什么。\n\n即便如此，当他和朋友们一起将最后一批板条箱、武器和装备装载到飞机上时，杰克还是忍不住感受到失败的刺痛。是的，也许从他落地的那一刻起，莫桑比克就已是一个败局，但我们至少本可以尝试去赢。高层本可以发挥他们的影响力，派遣更多装备，或投放更多地面部队。然而相反，杰克失去了朋友和战友，他们为了自己信仰的事业献出了生命。\n\n最后一批要装上飞机的货物，是几口覆盖着星条旗的棺材。里面躺着杰克那些再也看不到战争结束的朋友们。将军们和政客们，全都向他们许诺过胜利和成功，结果就是这样。等待杰克返回美国的，只有破碎的家庭，以及美国再次辜负其人民的认识。"
 GAZ.11.a: "又一次非洲军事冒险以惨淡收场。"
 GAZ.13.t: "莫桑比克英雄"
 GAZ.13.desc: "上尉差点错过了前方的“跑道”。那不过是一条未铺砌的小路，四周除了沙土和尘埃几乎别无他物。飞机在不平的地面上颠簸着降落，停在一座被炸毁的德国酒店残骸旁。大使威拉德·德普雷举手遮住炙热的阳光，走下了舷梯，看着一辆锈迹斑斑的卡车越驶越近，直到停在离他不到十英尺的地方。从车里出来的，是莫桑比克解放阵线的主席，一个名字在所有莫桑比克城市都等同于自由的人——爱德华多·蒙德拉纳。他那近乎慈父的外表——一个身材魁梧、微微谢顶的中年男子，穿着一身定制西装——与他的举止并不相称。德普雷迎上的是几乎毫无感情的、冷淡的目光。蒙德拉纳的问候简短而疏远。“欢迎来到赛赛，大使先生。”\n\n“很高兴来到这里，总统先生。”\n\n“您带了多少燃油来？”\n\n“800加仑柴油，外加100加仑煤油，按您的要求。”\n\n“军火呢？”\n\n“五千支步枪，每支配一百二十发子弹。钢盔和军靴数量相同。”\n\n“医疗物资？”\n\n会面只持续了几分钟，内容仅限于核实交付的物资和交换机密文件。今天不会有任何谈判。德普雷只能希望，今天的合作能有助于建立两国间的友好关系，或者至少能让德国非洲事务部远离非洲。在这一点上，他和蒙德拉纳能够达成共识。"
 GAZ.13.a: "莫桑比克的英雄对帝国主义阴谋可没什么耐心。"
 GAZ.14.t: "理想主义者的梦"
 GAZ.14.desc: "乌里亚·西曼戈坐在办公桌前，翻阅着一份安全报告。又有六支步枪失踪，据推测已被偷运出去在黑市上出售。幸运的是，蒙德拉纳的人仍未察觉。在他的地板条下，正藏着一个日渐增长的武器、弹药、药品和各式装备的储藏点，若运气好的话，这里将成为自由民主的莫桑比克的军械库的起点。\n\n电话响了，他几乎是跳起来接的。“我是乌里亚·西曼戈！”\n\n“西曼戈先生，我是开普矿业公司的道格拉斯·费舍尔。您收到我们的预确认函了吗？”\n\n“是-是的先生，收到了！”西曼戈努力保持镇定。兴奋之情听起来会显得可疑。“呃，关于那批货物……”\n\n“您订购的包裹将于明早当地时间四点至六点之间抵达。感谢您的惠顾……”\n\n“不好意思，我——”\n\n“若您有任何其他疑问，请联系我们的办公室。” *咔哒*\n\n西曼戈不禁怀疑，这一切的保密措施是否真有必要。蒙德拉难道连监听他谈话的手段都有了吗？可是……天哪，要是他真能监听到，那会发生什么？谁能保证美国人自己不会也来窃听他的办公室呢？西曼戈开始感到头晕目眩，这才意识到自己的双手抖得有多厉害。"
 GAZ.14.a: "是爱国者，还是叛徒？"
 GAZ.20.t: "恐佈"
 GAZ.20.desc: "在莫桑比克内战中英勇奋战、协助萨莫拉·马谢尔战士的又一个胜利之日过后，一支由一名本地向导陪同的日军大队开始了一次例行巡逻。在此之前，他们花了几个小时社交，向向导学习当地语言，并教会他一些有用的日语词汇，如“どうぞ”、“ありがとう”和“こんばんは”。他们中没有人料到会在那天看到他们即将见到的东西。\n\n突然，他们偶遇了田野中一座被毁坏的建筑。向导和一名中士上前侦察；不到二十分钟，他们便半跑着回来了，脸色苍白，吓得浑身发抖。当被问及出了什么事时，两人拼命摇头，拒绝说任何话。最终，指挥官命令部队进入该建筑，他和他手下的士兵都被眼前的景象吓坏了。各种残破的酷刑器具散落一地。斑斑血迹将墙壁染成污秽的棕褐色。\n\n向导终于开口了，结结巴巴地说这队人偶然撞见了许蒂希灭绝营的废墟之一。当向导揭露这可怕的真相时，士兵们从低声咕哝着“ちくしょう”和“くそ”，转而公开向阿弥陀佛和这片土地的神明祈求慈悲。正是在这种极度的恐惧与痛苦中，指挥官、他的士兵和向导一路狂奔，逃回了营房。\n\n此事件通过常规渠道上报，地图上该区域被画上了一个大叉，并附注：“若想保住理智，切勿靠近。”一段时间后，一颗流弹将废墟炸上了天。"
 GAZ.20.a: "但这不足以抹去那些士兵心中的创伤。"