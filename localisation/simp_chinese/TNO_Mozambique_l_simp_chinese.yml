 POLITICS_CHARLES_FRASER_DESC: "历经四百年的殖民地岁月，又在德国占领下度过了大约十年，莫桑比克如今作为一个正在构建中的傀儡国获得了“自由”。新的南非行政当局比起前任來，不过是五十步笑百步，但在莫桑比克，并没有多少人为那位临时掌权者查尔斯·“老爹”·弗雷泽欢呼雀跃。他被派往洛伦索-马贵斯，肩负着一项使命：迅速组建一支由合作者组成的本地安全部队，使其能够坚强抵御泛非主义者日益增长的威胁。\n\n第二次世界大战爆发时，查尔斯·弗雷泽以一名自豪的志愿兵身份入伍，在好望角野战炮兵部队表现出色，该部队隶属于南非炮兵第6野战团。在他的指挥官凯中校阵亡后，弗雷泽被推上指挥岗位，他证明了自己不仅是一位灵巧的指挥官，也是一位有着三寸不烂之舌的干练领袖。战争结束后，他继续平步青云，担任了陆军与南非空军之间合作的协调员。在南非战争中再次证明自己的价值后，老爹弗雷泽如今正与时间赛跑，试图在这片备受蹂躏、无人问津的殖民地分崩离析之前，将其塑造成型。非洲的新秩序正在崛起，而弗雷泽决心按照开普敦的意愿，努力塑造这个新生的国家。"
 POLITICS_KAREL_POTT_DESC: "卡雷尔·莫贾尔丁·波特长期流亡在外，远离他位于莫桑比克马普托的家乡，在德班以律师为业度过时光。他生于1904年，曾代表葡萄牙参加1924年奥运会，之后成为一名律师。有着荷兰父亲和土著母亲的混血出身，他长期活跃于反对莫桑比克种族隔离性质的行动主义，并针对该地区运营的众多赌场采取行动，但在德国入侵并强行夺取该殖民地后，他不得不迅速离开。\n\n随着莫桑比克获得解放，他回到家乡，再次开始组织活动。他被允许参加选举，以此作为让选举因存在真正反对派而合法化的一种手段，而南非青睐的候选人则得到了他们的全力支持。然而，受过教育的莫桑比克人还是投票给了波特，如今这位新总统发现自己陷入了两面夹击的境地。在南方，南非怀着极大的疑虑注视着这位富有魅力的改革者，而他们自己的候选人已被降格为反对派。开普敦仍然手握许多牌，如果波特走得太远，他们可能会将其换掉。在北方以及乡村深处，莫桑比克解放阵线谴责他是合作者，并誓言要推翻他和他的莫桑比克民主党。\n\n波特夹在中间，急于在开普敦警惕的目光下，努力为莫桑比克铺就一个真正的未来。然而，长久以来第一次，这个国家里越来越多的人开始对他们的未来感到谨慎乐观，而那种感觉似乎早已离开了莫桑比克的海岸。"
 POLITICS_MANUEL_DOS_SANTOS_DESC: "葡萄牙在莫桑比克已不再拥有任何真正的机会或影响力，然而一群葡萄牙后裔在其新获独立后，仍然在此地掌握着权力。曼努埃尔·佩雷拉·皮门特尔·多斯桑托斯代表了富有的葡萄牙精英阶层的利益，这一阶层在过去四百年里一直统治着莫桑比克，如今，随着许蒂希毫无意义的暴政终结，那些大型公司和地主们的寡头利益正在回流。\n\n作为一名葡萄牙土木工程师和技术官僚，多斯桑托斯曾致力于莫桑比克的基础设施建设。殖民地的沦陷让他失去了太多新工作，而南非则提供了大量继续发展的机会。他是莫桑比克沦陷后离开的葡萄牙人中的领军人物之一，自然而然地成为了南非在战后莫桑比克选举中首推的候选人，并相对轻松地赢得了选举。\n\n多斯桑托斯公开做出的承诺十分宏大：重建、安全、保障，以及在资本主义框架下为莫桑比克带来一个新的开端，并强力反击危险的莫桑比克解放阵线共产党人。与此同时，对于改善普通民众的生活，多斯桑托斯除了为稳定对莫桑比克的控制所必需的举措外，并未作出任何表态。唯有时间能证明他是否能建立起一个持久的专家治国体系，抑或莫桑比克人民会像推翻德国占领者那样，摆脱他的桎梏。"
 GAZ_devastated: "满目疮痍的莫桑比克"
 GAZ_devastated_desc: ""
 GAZ_rebirth_under_iron_fist: "铁拳下的重生"
 GAZ_rebirth_under_iron_fist_desc: "在无情的冲突过后，莫桑比克发现自己正被查尔斯·艾伦·弗雷泽中将的专横权威所牢牢掌控。这个国家被迫作为一个严密控制的军政府运转，地方机构则充当比勒陀利亚意志的延伸。异议遭到残酷镇压，任何对即刻自决的期望都被牺牲在秩序的祭坛之上。\n\n然而，即便在这种压迫性的政权下，重建的精神也开始显现。雄心勃勃的国家建设项目正在推进，大规模的基础设施计划、工业振兴以及全面的教育改革，都预示着一种坚定的努力，要将莫桑比克从破碎的过去中重建起来。\n\n但是，不要抱有任何幻想：每一条铺设的道路，每一座建成的工厂，每一所建立的学校，都不是为了造福当地民众，而仅仅是为南非的工业与地缘政治野心服务。在这种严峻的现状下，莫桑比克重生的繁荣，不过是一种增强其殖民主子经济实力的手段。"
 GAZ_scorched_earth_broken_dreams: "焦土之上，残梦难圆"
 GAZ_scorched_earth_broken_dreams_desc: "莫桑比克的经济命运，早已被几个世纪的剥削所注定。先是葡萄牙殖民地，接着又臣服于德国控制之下，这个国家长期以来一直被贬低为外部强权的原材料仓库。如今，作为事实上的南非殖民地，莫桑比克的经济仅作为榨取之源而存在。其肥沃的土地、矿产财富和劳动力被无情地开采，以助推南非的工业野心，致使地方经济只能一心扑在资源开采上。"
 GAZ_from_the_ground_up: "平地而起"
 GAZ_from_the_ground_up_desc: "莫桑比克从未被允许组建一支属于自己的正式军队，它先是葡萄牙殖民地，随后又成了德国殖民地。如今，在南非武装部队总督查尔斯·艾伦·弗雷泽中将的坚定监督下，正着手进行一项雄心勃勃的努力，旨在从零开始建立一支全新的武装力量。此举的驱动力源于一个紧迫的需求：创建一支由本地人组成的、可靠的现代军队，既能保卫莫桑比克，又能充当抵御日益增长的泛非威胁的壁垒。\n\n尽管这支新生力量仍支离破碎、组织混乱，但当前的战略强调快速现代化、精简指挥结构，以及直接从南非军事模式引入的密集训练项目。\n\n弗雷泽总督专注于打造一支军官队伍，打击地方腐败，并建立起一支正规的莫桑比克军队。其愿景十分清晰：将这松散的民兵合作者力量转变为一支高效的反泛非主义部队，能够维护安全、平息内部异见并保卫莫桑比克边境。凭借持续投入和明确授权，这支新军队有望成为地区稳定的基石，即便它首先必须克服起步阶段的重大障碍。"
 GAZ_from_the_shadows: "自暗影中现身"
 GAZ_from_the_shadows_desc: "在莫桑比克强加的秩序之下，一股革命热情正在涌动。在富有魅力的萨莫拉·马谢尔领导下，一场泛非运动正在激发受压迫大众的不满情绪。要求真正自由、终结殖民剥削的广泛呼声，如今汇聚成一场叛乱，有可能颠覆这个临时的傀儡政权。这股日益高涨的抵抗浪潮，不仅挑战着占领的合法性，也撼动了几个世纪以来定义了莫桑比克命运的榨取模式。"
 USA_can_send_aid_mozambique_troops: "我们将能够向[GZO.GetNameWithFlag]派遣援助与志愿军，助其抗击日本！\n§R蒙德拉纳一心要尽量减少外国对莫桑比克的影响。若他最终获胜，我们将获益甚微。§!\n"
 USA_wild_card_bitches: "在我们的支持下，乌里亚·西曼戈将在§Y楠普拉和彭巴§!起事。虽然力量薄弱，但一旦获胜，他将与我们的利益保持一致。\n"
 JAP_can_send_aid_mozambique_troops: "我们现在可以向[GAZ.GetNameWithFlag]派遣援助与志愿军了。\n"
