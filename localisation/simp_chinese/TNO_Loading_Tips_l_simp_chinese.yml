l_simp_chinese:
 LOADING_TIP_0:0 "§TSouth Africa belongs to all who live in it, black and white.\n- Thabo Mbeki, 1970"
 LOADING_TIP_1:0 "§TThe first duty of a leader is optimism. How does your subordinate feel after meeting you?\nDoes he feel uplifted? If not, you are not a leader.\n- Bernard Law Montgomery, 1954"
 LOADING_TIP_2:0 "§TDiscipline strengthens the mind so it becomes impervious to the corroding influence of fear.\n- Bernard Law Montgomery, 1942"
 LOADING_TIP_3:0 "§TIf there be a God, I think he would like me to paint Africa British-Red as possible.\n- Cecil Rhodes, 1902"
 LOADING_TIP_4:0 "§TIf there was to be equal manhood suffrage the whites would be swamped all over South Africa by the natives and the whole position for which whites have striven for 200 years or more would be given up.\n- Jan Smuts, 1934"
 LOADING_TIP_5:0 "§TPerhaps it is God's will to lead the people of South Africa through defeat and humiliation\nto a better future and a brighter day. - Jan Smuts, 1945"
 LOADING_TIP_6:0 "§TDo not judge me by my successes, judge me by how many times I fell down and got back up again.\n- Nelson Mandela, 1965"
 LOADING_TIP_7:0 "§TThe fight for freedom must go on until it is won; until our country is free and happy and peaceful as part of the community of man, we cannot rest.\n- Olivier Tambo, 1960"
 LOADING_TIP_8:0 "§TI knew South Africa was going to change; you can't keep people down forever.\nIt's unnatural. Somehow something had to crack, and it did.\n- Letta Mbulu, 1965"
 LOADING_TIP_9:0 "§TAsk any man what nationality he would prefer to be, and ninety nine out of a hundred\nwill tell you that they would prefer to be Englishmen.\n- Cecil Rhodes, 1898"
 LOADING_TIP_10:0 "§TWhat is the true and original root of Dutch aversion to British rule? It is the abiding fear and hatred of the movement that seeks to place the native on a level with the white man.\n- Wiston Churchill, 1900"
 LOADING_TIP_11:0 "§TThere is no place for the Natives in the European community above the level of certain forms of labour. What is the use of teaching the Native child mathematics when it cannot use it in practice? That is quite absurd.\n- Hendrik Verwoerd, 1960"
 LOADING_TIP_12:0 "§TI have always thought that the rapid economic development of South Africa would in the long run prove to be incompatible with the government's racial policies, and recent events have tended to confirm my opinion.\n- Harry Oppenheimer, 1962"
 LOADING_TIP_13:0 "§TSometimes, if you wear suits for too long, it changes your ideology.\n- Joe Slovo, 1971"
 LOADING_TIP_14:0 "§TAt thy call we shall not falter, firm and steadfast we shall stand.\nAt thy will to live or perish, o South Africa dear land!\n- Cornelius Langenhoven, 1918"
 LOADING_TIP_15:0 "§TThis land is very attractive and well situated; and we saw many cattle wandering about on the land here; and the further we advanced the better did the land become and the higher the groves of trees.\n- Avaro Velho, 1497"
 LOADING_TIP_16:0 "§TSouth Africa is not a jellyfish and is in many respects a swordfish.\n- P.W. Botha, 1981"
 LOADING_TIP_17:0 "§TFaithless is he that says farewell when the road darkens.\n- J.R.R Tolkien, 1954"
 LOADING_TIP_18:0 "§TFrom the ashes a fire shall be woken, a light from the shadows shall spring;\nRenewed shall be blade that was broken, the crownless again shall be king.\n- J.R.R Tolkien, 1954"
 LOADING_TIP_19:0 "§TThe television is a profoundly negative influence on society that must be contained at all costs. The effect of wrong pictures on children and the lesser developed races can be very destructive.\n- Albert Hertzog, 1958"
 LOADING_TIP_20:0 "§TEvery human being makes mistakes.\n- Ian Smith, 1979"
 LOADING_TIP_21:0 "§TNo price is too high to pay for the privilege of owning yourself.\n- Rudyard Kipling, 1901"
 LOADING_TIP_22:0 "§TProgress in South Africa depends on the maintenance of standards and I believe we owe it to the vast mass of as yet uneducated black Africans for whom we are trustees, to see that the existing standards in South Africa are not debased.\n- Sir Patrick Wall MP, 1960"
 LOADING_TIP_23:0 "§TWe do not subscribe to the doctrinaire dictum that all men are \"equal\", but we do hold that every citizen is entitled to equal respect for his dignity.\n- Progressive Party Flyer, 1967"
 LOADING_TIP_24:0 "§TI knew very well what I was going to do in the SS.\n- Hans Huttig, 1964"
 LOADING_TIP_25:0 "§TThe leadership of mercenary troops by force of personality alone demands a hardness of character and a conviction in one’s own invicibility which I did not possess. I was obliged to assume those qualities then and there. It was a case-hardening I did not regret.\n- Mike Hoare, 1969"
 LOADING_TIP_26:0 "§TThe military qualities of the Boers were useful but not showy. They came by instinct and not by acquisition, and they cannot be sufficiently accounted for as the outcome of experience.\n- A Handbook on the Boer War, 1910"
 LOADING_TIP_27:0 "§TDemocracy, like a little plant, does not grow or develop on its own. It must be believed in and practiced if it is to be appreciated. And it must be fought for and defended if it is to survive.\n- Seretse Khama, 1978"
 LOADING_TIP_28:0 "§TColonies are necessary to Germany. We shall get them through negotiation if possible;\n but if not, we shall take them.\n- Hjalmar Schacht, 1943"
 LOADING_TIP_29:0 "§TThis has been the struggle since 1910: a republic as opposed to the monarchical connection...\nWe stand unequivocally and clearly for the establishment of the republic in the correct manner and at the appropriate time.\n- Hendrik Verwoerd, 1958"
 LOADING_TIP_30:0 "§TWhy should you fear the exercise of franchise? I would rather meet the Native at a town hall voting for his representative, than in the wilds with his gun upon his shoulder.\n- William Porter, 1854"
 LOADING_TIP_31:0 "§TThese are the lights of democracy – let them be a source of comfort to the people of this country whatever their language, race, or colour. They convey a message to the people of South Africa in the name of those who fought and lived and in the name of those who fought and died.\n- Adolph \"Sailor\" Malan, 1951"
 LOADING_TIP_32:0 "§TNo matter what vision one has of South Africa, the first thing that must be done is to destroy racism.\n- Joe Slovo, 1969"
 LOADING_TIP_34:0 "§TI would annex the planets if I could; I often think of that.\nIt makes me sad to see them so clear and yet so far.\n- Cecil Rhodes, 1888"
 LOADING_TIP_33:0 "§TTo those who say derogatory things about colonialism, I would say colonialism is a wonderful thing. It spread civilisation to Africa. Before it they had no written language, no wheel as we know it, no schools, no hospitals, not even normal clothing.\n- Ian Smith, 1974"
 LOADING_TIP_35:0 "§THollanders are not a nation to rob another of its property, but desire to live in friendship with all people, and trade with them.\n- Jan van Riebeek, 1657"
 LOADING_TIP_36:0 "§TOur movement is based on the Führer-principle, fighting against the Empire, the capitalists, the communists, the Jews, the party and the system of parliamentarism on the base of national-socialism as laid out by the Greater Germarnic Reich.\n Johannes van Rensburg, 1944"
 LOADING_TIP_37:0 "§TWe have not yet the whole, we have not yet a really unified South Africa, we have not yet attained to the unity which is our ideal. There is still too much of the old division and separation in our national elements, but still the effort has been made.\n- Jan Smuts, 1940"
 LOADING_TIP_38:0 "§TThe idea that the Natives must all be removed and confined in their own kraals is in my opinion the greatest nonsense I have ever heard.\n- Jan Smuts, 1947"
 LOADING_TIP_39:0 "§TWe, whose names are underwritten, men and women of Natal, loyal subjects of Her Gracious Majesty Queen Elizabeth the Second, do hereby pledge ourselves in solemn covenant, to stand by one another, throughout this time of threatened calamity, in defending the Crown.\n- The Natal Covenant, 1962"
 LOADING_TIP_40:0 "§TThe monarchy has this great advantage that it provides us with a symbol to which we can all look at as the visible embodiment of the unity of our peoples and form of society — a head which is at the same time separate from the centre of real political power.\n- A.L. Rowse, 1944"
 LOADING_TIP_41:0 "§TThe destiny of South Africa depends on this essential point. If the principle of permanent residence for the black man in the area of the white is accepted then it is the beginning of the end of civilisation as we know it in this country.\n- P.W. Botha, 1974"
 LOADING_TIP_42:0 "§THistory, like beauty, depends largely on the beholder, so when you read that, for example, David Livingstone discovered the Victoria Falls, you might be forgiven for thinking that there was nobody around the Falls until Livingstone arrived on the scene.\n- Desmond Tutu, 1981"
 LOADING_TIP_43:0 "§TI am not interested in picking up crumbs of compassion thrown from the table of someone who considers himself my master. I want the full menu of rights.\n- Desmond Tutu, 1973"
 LOADING_TIP_44:0 "§TIf you are neutral in situations of injustice, you have chosen the side of the oppressor.\n- Desmond Tutu, 1973"
 LOADING_TIP_45:0 "§TThere is only one element that can break the Afrikaner … and that is the Afrikaner himself.\n- P.W. Botha, 1984"
 LOADING_TIP_46:0 "§THere at Blood River you stand on holy ground. Here was made the great decision about the future of South Africa, about Christian civilization in our land, and about the continued existence and responsible power of the White race.\n- D.F. Malan, 1938"
 LOADING_TIP_47:0 "§TWe must insure that future generations talk about us as heroes and patriots and not as cowards who gave away our inheritance without a fight. We must endure until the bitter end. I shall do so.\n- Martinus Steyn, 1901"
 LOADING_TIP_48:0 "§TThe government will not be intimidated. Orders have been given to maintain order at all costs.\n- Balthazar Vorster, 18th of June 1976"
 LOADING_TIP_49:0 "§TAs we study the destiny of the British Empire, we are bound to think of it less as a human achievement than as an instrument of Divine Providence for the promotion of the progress of mankind.\n- Stanley Baldwin, 1929"
 LOADING_TIP_50:0 "§TThe native is to be treated as a child and denied franchise. We must adopt a system of despotism, such as works in India, in our relations with the barbarism of South Africa.\n- Cecil Rhodes, 1900"
 LOADING_TIP_51:0 "§TThe Ossewabrandwag is of the opinion that a German victory is an obvious condition for an Afrikaner people's republic to come into existence. Liberation can happen only as a result of a German victory in Europe.\n- Die Vaderland, 8 August 1942"
 LOADING_TIP_52:0 "§TAn attempt is being made by a number of jokers to reduce the \"plat Hollands\" of the street to a written language and perpetuate it. They have a newspaper, have published a history of the colony, and to crown the joke — a grammar.\n- Cape Town Press,  1876"
 LOADING_TIP_53:0 "§TThese are my final words that I shall put in writing. Be loyal unto death to your traditions, to your religion, to your language and to your people. God be with you until we meet again.\n- Joseph Fourie, 20th of December 1914"