 USA_GLN_NASA_Ares_Landing_Mission_desc:0 "阿瑞斯四号正在广袤无垠的太空中疾速飞行，这艘飞船和上面的船员吸引着全国乃至全世界的目光，他们肩负前往火星这颗红色星球的任务，科幻小说家和航天爱好者曾经遥不可及的梦想似乎终于要实现了。\n\n前往火星这个地球遥远表亲的任务艰巨而繁重，乘员和机器都已经达到了极限，但他们身上承载着整整一代人的希望与梦想，他们渴望着看到曾经一度遥远的希望终获实现。\n\n循此苦旅，直抵群星。"
