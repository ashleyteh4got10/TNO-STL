 USA_GLN_Eros_Buff_5:0 "畏惧我们的力量"
 USA_GLN_Eros_Buff_desc_5:0 "美国空军正迅速成长为一支无可匹敌的力量。我们的轰炸机与其护航战斗机可以在任何时间出现于任何地点；我们的盟友确信，来自美军飞行员的空中支援可以随时到达。这为自由的敌人带来了各式各样的战略难题。"
 USA_Glenn_Ready_for_Anything:0 "一小步"
 USA_Glenn_Ready_for_Anything_desc:0 "格伦政府已将我们的宇宙之旅列为国家重大优先事项。巨大的花费、训练和科学上的努力，才成就了这一刻。现在，整个国家都在屏息等待我们勇敢的宇航员征服这最后的边疆。"
 USA_GLN_Moon_Conquered_Mother_Fucker:0 "星空属于我们"
 USA_GLN_Moon_Conquered_Mother_Fucker_desc:0 "美国，最后的自由堡垒，承载着世界的希望，我国成功登陆月球向各地的极权主义者发出了一道讯息，早年对太空竞赛的失望正在被国家进入宇宙的新愿景所取代。美国回来了，那个强大、团结的美国又回来了。"
 USA_GLN_Mars_Conquered_Mother_Fucker:0 "已征服的边疆"
 USA_GLN_Mars_Conquered_Mother_Fucker_desc:0 "成功登陆火星终于让美国团结一心，一股狂喜之情席卷全国。美国人纷纷涌上街头庆祝这一时刻，无数烟火飞上天空，与群星一起闪耀。这无疑会作为最伟大成就之一，载入我们伟大国家的史册。"
 USA_Glenn_reduced_american_commitment:0 "美国减少承诺"
 USA_Glenn_reduced_american_commitment_desc:0 "随着美国开始逐渐缩减其国际承诺，他们支援我国军队的武器和资金已经开始减少。当下，我们面临着严峻的威胁，必须要想办法填上军事开支中的这个新窟窿。"
 USA_LBJ_voting_rights_enforcement_boost:0 "加强民权执法"
 USA_LBJ_voting_rights_enforcement_boost_desc:0 "长久以来，非裔美国人都被剥夺了神圣的选举权。自南北战争后的重建时期结束以来，南方各州政府可谓是无所不用其极，将选举权和投票权限制在其一小部分人口之中，数百万人因此而无法行使宪法赋予他们的权利。\n\n然而，民权在近来取得的突破扭转了这一状况。《1962年民权法案》和《投票权法案》赋予了联邦政府前所未有的权力，中央得以借此彻底禁止投票过程中的种族歧视行为。政府职员和联邦探员已经前往南方各地，为成千上万的新选民进行身份登记。\n\n这项工作无疑还需要一段时间才能告一段落，但在重建时期结束八十余年后，美国终于兑现了宪法第十四修正案中做出的承诺。"
