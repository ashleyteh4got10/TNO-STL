 USA_Glenn_Nuclear_Power:0 "核能发展计划"
 USA_Glenn_Nuclear_Power_desc:0 "许多美国人将我们在大战中的失利归咎于未能像敌人那样在核领域取得迅速发展。我们不会重蹈覆辙，必须不惜一切代价将我国核实力提高至标准水平。这将涉及大幅提高采购以及提炼裂变材料的能力，以及培训合格和经过审查的相关工作人员。"
 USA_Glenn_Nuclear_Power_2:0 "扩大的核能发展计划"
 USA_Glenn_Nuclear_Power_2_desc:0 "许多美国人将我们在大战中的失利归咎于未能像敌人那样在核领域取得迅速发展。我们不会重蹈覆辙，必须不惜一切代价将我国核实力提高至标准水平。这将涉及大幅提高采购以及提炼裂变材料的能力，以及培训合格和经过审查的相关工作人员。"
 USA_Glenn_Upgraded_Rocket_Sites_1:0 "现代发射井"
 USA_Glenn_Upgraded_Rocket_Sites_1_desc:0 "在对手面前，我国的核弹发射井在可靠性和先进性方面仍然相当逊色。这种情况不会再继续下去，我们将以精密而先进的核防御体系保护世界上自由的人民。我国的发射井将牢不可摧、安全可靠，成为一切专制统治者心中的梦魇。"
 USA_GLN_anti_corruption_meassures:0 "反腐行动"
 USA_GLN_anti_corruption_meassures_desc:0 "美国的大部分商业活动都运作于软腐败的基础之上，这就是可悲的事实。遏制它无疑十分痛苦，但却是必要之举。我们将结束私下里见不得人的交易、公平地执行法律法规、密切地关注游说团体，以此重建公众的信任。迈向更为公平的竞争环境的每一步，都会令美国梦更加触手可及。"
 USA_Glenn_Minerva_Buff_1:0 "太空之眼"
 USA_Glenn_Minerva_Buff_desc_1:0 "密涅瓦计划称得上是史无前例的技术突破，除了为武装部队和情报部门提供绝佳的监控手段外，我们的卫星网络还能提高通信能力。密涅瓦特别适合监视外国军事发展情况，足以让我们在军备竞赛中永远先人一步。"
