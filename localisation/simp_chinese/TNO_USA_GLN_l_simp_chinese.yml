 USA_discontinue_buildup_programs:0 "终止发展项目"
 USA_bet_on_dove:0 "押注鸽派"
 USA_reassess_oceanian_commitments:0 "大洋洲承诺再评估"
 USA_rebuke_jingoists:0 "斥责侵略主义"
 USA_peaceful_party:0 "和平之党"
 USA_23_55:0 "23时55分"
 USA_maintain_commitments:0 "维持承诺"
 USA_reassure_allies:0 "安抚盟友"
 USA_drump_up_enthusiaism:0 "激发民众热情"
 USA_united_in_freedom:0 "团结在自由之下"
 USA_23_59_desc:0 "我们玩过火了……这很严重。我国一直处于战争的边缘，还遭受了羞辱，政府已然失去了盟友和人民的信任。现在，我们正处于损害控制模式之中，而时钟已经非常接近于午夜。必须要安排紧急会议，安抚各国大使，而最重要的是，必须要找到办法，摆脱我们搞出来的这副烂摊子。"
 USA_discontinue_buildup_programs_desc:0 "近来的危机重新定义了政府的优先事项。我们通过战略核主导地位推行核裁军的战略显然已经失败，而原先的发展项目现在不过只是极其昂贵的死物，除了能满足将军们的自负心理之外没有任何作用。无论在未来采取什么措施，显然，当下的首要任务就是结束这些昂贵而无用的计划。"
 USA_bet_on_dove_desc:0 "从太空中俯瞰地球时，你就会意识到我们身处的这个小蓝点是多么地脆弱。格伦总统看到过这幅景象，他也看到了核毁灭的威胁。但幸运的是，总统是一位爱好和平的人。局势降温不仅仅只是个一时的噱头，它将是我们的政策！即使OFN盟友们可能不喜欢它，但我们也必须向美国公众保证，格伦总统不会是扣下扳机的那个人。"
 USA_reassess_oceanian_commitments_desc:0 "长期以来，美国一直在澳大利亚和新西兰维持着一支相当规模的部队。如果想向美国公众保证，我们将认真对待和平政策，那现在就应该重新考虑在该地区军事存在的范围，也许是该带小伙子们回家了。由于这将削弱澳新军团的实力，OFN盟友不太可能会欣赏如此举措，但其中还包含着更大的利益。通过缩减在该地区的驻军，我们将向美国公众和世界发出明确的信号：美国在这里不是为了发动战争，而是为了实现和平。"
 USA_rebuke_jingoists_desc:0 "如果说这场危机让我们明白了些什么，那就是鹰派外交政策的危险。但与此同时，NPP那群不知悔改的战争狂似乎还对现实一无所知，即使是现在，他们还在呼吁着进行更多的无理挑衅，让末日时钟越来越接近午夜。如果他们成功，那我们就得在他们的爆炸言论之下离世界末日越来越近。必须要在任何可能的地方挑战他们：国会、电视、无线电台、报纸。格伦总统将表明立场，揭露他们的真面目：永远不应该允许这帮狂人与核密码之间的距离小于100英里。"
 USA_peaceful_party_desc:0 "长期以来，我党一直奉行与NPP强硬战争主义相抗衡的明智举措，这赢得了美国人民的信任。告诉公众，我们仍然是和平的党！格伦总统已经表明，他能够驾驭危机，缓和紧张局势。虽然这件事本身很不幸，但它还是证明了一个众所周知的事实：我们的党是和平的党。在格伦总统的领导下，战争将会远离美国的海岸。"
 USA_23_55_desc:0 "现在看来，最糟糕的情况已经过去了。我们经受住了暴风雨的考验，度过了这场危机，虽说遍体鳞伤，但还没有倒下。末日时钟已经倒退了几分钟。虽然最近的这场危机将在未来几十年内深深地铭刻在美国的集体意识之中，但治理国家的工作不等人，现在我们必须回到政府工作中去，考虑立法、修改法案、确定职务任命。我们将把这一切都留给未来的历史学家去反思。\n\n毕竟，美国可不会自己管理自己。"
 USA_maintain_commitments_desc:0 "无论民意如何，美国都要遵守承诺。我们必须向OFN盟友表明，我们不是不能共患难的朋友，也不仅仅只是一时兴起的爱国者。正是在这样的时刻，我们展示了美国真正的实力与我党真正的立场。因此，我们决不会在对朋友的承诺上退缩。即使最坏的情况发生，我们也将和过去一样，与他们共济风雨。"
 USA_reassure_allies_desc:0 "我们对盟友的支持必须是明确的，特别是在当下这样的时刻。必须要安抚在澳新军团中的朋友，保证我们时时刻刻都与他们风雨同舟。因此，我们将公开重申美国的政策，即对他们的任何攻击都将被视为对美国的攻击。如果日本想要把手伸到那里，我们就将在那里发起反击。如此这般的声明将受到许多民众的强烈反对，他们只渴望国内的和平，但我们决不能允许自由之火在大洋洲熄灭。"
 USA_drump_up_enthusiaism_desc:0 "尽管我们曾经危险地接近深渊的悬崖边，但我们成功设法避开了最坏的情况，合众国仍然强大！我们必须保持防备、保持警惕，时刻准备着捍卫自由！让我们一如既往地向星条旗致敬，坚定不移地为山姆大叔而战。格伦总统将提醒美国公众，我们还不能推卸防御法西斯主义的职责，从此岸到彼岸，所有当兵的好小伙子都将知道，美国仍然与他们同在！"
 USA_united_in_freedom_desc:0 "让我们把话说明白，和平与战争之间不存在任何争论，但是，屈服于法西斯主义的和平绝不在选择范围之内！美国将一以贯之地致力于全球解放和自由的事业，无论潮起潮落。自由国家组织中的盟友明白这一点，将我们团结在自由树荫下的纽带仍旧坚强而牢固。专制统治者、暴君和法西斯分子依然在其他地方张牙舞爪，但美国和OFN将继续坚守阵地，抵挡汹涌的浪潮，一如既往，直到永远。"
