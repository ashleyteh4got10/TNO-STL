 USA_GLN_Mission_Control_desc:0 "欢迎来到发射任务控制界面。\n\n我们当前的计划是[USA_GLN_Mission_Selector]，准备度为§O[?USA_GLN_NASA_Mission_Prep]%§!。\n我们对该计划投资了§w[?USA_GLN_NASA_Mission_Investment_Display]M§!（总预算§w[?USA_GLN_NASA_Funding_Display]M§!）。\n\n我们可以通过增加§w投资§!来提高任务§O准备度§!，进行升级改造，确保任务尽可能的安全。成功发射会提高公众支持率，而失败则可能扼杀整个计划。"
