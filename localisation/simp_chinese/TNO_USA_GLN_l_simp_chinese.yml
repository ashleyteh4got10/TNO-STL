 glenn.125.a:0 "向敌舰开火还击。"
 glenn.125.b:0 "既往不咎，彻底让步！"
 glenn.126.t:0 "美方还击！"
 glenn.126.desc.germany:0 "“美国人终于还击了，我的元首。派去的舰船遭受了一定波及，我们在这次针对护航船队的袭击中阵亡10人，另有15人受伤。但这次突袭无疑取得了成功，我们带回了一部分铀矿，美国人的大部分铀矿供应也已经沉入大西洋底。接下来要怎么对付美国人？”\n\n[GER.GetLeader]已经越来越厌倦美国人对他的国家所做的一切。没有人能够忘记，在最初，几个工人在铀矿场爆炸中丧生，然后又是一次、又是一次。我们抓住了破坏者，发现了他们与美国政府之间的联系，但即使有如此确凿的证据证明总统犯下了罪行，他也拒绝为此承担责任。不光如此，总统还得到了全美国的支持，美国公众认为，我们是在企图别有用心地抹黑他，忽视那些可靠的证据。而现在，格伦亲自下令攻击我国舰船、杀害我国公民，他们再也无法回到自己的祖国。事态已经很清楚了，美国人在戏耍我们，而我们决不会成为他们万恶的“民主”理念的傀儡。\n\n[GER.GetLeader]曾经时常思考爆发世界性全面战争的可能性，但现在，那个时刻终于降临了。格伦打响了第一枪，必须要迅速展开报复性打击：“我们别无选择，下令全体军队人员立即进入待命状态，必须要打垮美国人。”"
 glenn.126.desc.japan:0 "“美国人终于还击了，我的元首。派去的舰船遭受了一定波及，我们在这次针对护航船队的袭击中阵亡10人，另有15人受伤。但这次突袭无疑取得了成功，我们带回了一部分铀矿，美国人的大部分铀矿供应也已经沉入太平洋底。接下来要怎么对付美国人？”\n\n[JAP.GetLeader]已经越来越厌倦美国人对他的国家所做的一切。没有人能够忘记，在最初，几个工人在铀矿场爆炸中丧生，然后又是一次、又是一次。我们抓住了破坏者，发现了他们与美国政府之间的联系，但即使有如此确凿的证据证明总统犯下了罪行，他也拒绝为此承担责任。不光如此，总统还得到了全美国的支持，美国公众认为，我们是在企图别有用心地抹黑他，忽视那些可靠的证据。而现在，格伦亲自下令攻击我国舰船、杀害我国公民，他们再也无法回到帝国。事态已经很清楚了，美国人在戏耍我们，而我们决不会成为他们万恶的“民主”理念的傀儡。\n\n[JAP.GetLeader]曾经时常思考爆发世界性全面战争的可能性，但现在，那个时刻终于降临了。格伦打响了第一枪，必须要迅速展开报复性打击：“我们别无选择，下令全体军队人员立即进入待命状态，必须要打垮美国人。”"
 glenn.126.a:0 "第三次世界大战就要开始了。"
 glenn.127.t:0 "三战开幕"
 glenn.127.desc.germany:0 "一个浑身发抖的人挤进了总统办公室，极度震惊地大喊道：“总统先生！日耳曼尼亚来电：纳粹已向我国宣战！这可能是我们的末日，但我们必须动员起来，尽可能给予反击！”\n\n格伦秘书的话让他愣住了，他曾以为事态不会发展到如今地步。他愤怒地握紧了拳头，同时拨通了五角大楼的电话，他命令军队各部门保持高度警惕，以防德国入侵。总统很快冷静了下来，他意识到了自己现在所处的窘境，遗憾地叹了口气，滚成雪球的每一片雪花都是他亲手洒下。这是在公众支持和数百万人丧命之间的取舍，万分不幸，他选择了后者。在格伦看来，那次行动的全部意义就在于促进三个超级大国坐下来进行核裁军，但德国人没有意识到这一点。曾几何时，核战争的可能性似乎将要一去不返，不过现在看来，这已然不可避免。\n\n格伦望向窗外，首都街道上人心惶惶。大街上挤满了着急回家的人，更确切地说，是着急逃难的人。“用不了多久，公众就会知道消息。”格伦想着，最终，如此场景在美国的每一座城市中上演，人们把自己关在家里，听着战机在他们头顶上空盘旋呼啸。每个人都指望美军能击退德国侵略者，每个人都向上帝祈祷核武器不会投入战争。只有时间才能揭示，这场战争将对全人类带来怎样的冲击。"
 glenn.127.desc.japan:0 "一个浑身发抖的人挤进了总统办公室，极度震惊地大喊道：“总统先生！东京来电：日本已向我国宣战！这可能是我们的末日，但我们必须动员起来，尽可能给予反击！”\n\n格伦秘书的话让他愣住了，他曾以为事态不会发展到如今地步。他愤怒地握紧了拳头，同时拨通了五角大楼的电话，他命令军队各部门保持高度警惕，以防日本入侵。总统很快冷静了下来，他意识到了自己现在所处的窘境，遗憾地叹了口气，滚成雪球的每一片雪花都是他亲手洒下。这是在公众支持和数百万人丧命之间的取舍，万分不幸，他选择了后者。在格伦看来，那次行动的全部意义就在于促进三个超级大国坐下来进行核裁军，但日本人没有意识到这一点。曾几何时，核战争的可能性似乎将要一去不返，不过现在看来，这已然不可避免。\n\n格伦望向窗外，首都街道上人心惶惶。大街上挤满了着急回家的人，更确切地说，是着急逃难的人。“用不了多久，公众就会知道消息。”格伦想着，最终，如此场景在美国的每一座城市中上演，人们把自己关在家里，听着战机在他们头顶上空盘旋呼啸。每个人都指望美军能击退日本侵略者，每个人都向上帝祈祷核武器不会投入战争。只有时间才能揭示，这场战争将对全人类带来怎样的冲击。"
 glenn.127.a:0 "远处的喇叭声响彻天空。"
 glenn.128.t:0 "格伦退让"
 glenn.128.desc.germany:0 "美国总统站在讲台上，面对着聚集在华盛顿特区的广大群众，他正准备着即将发表的演讲，汗水顺着脸庞流淌而下，德国危机的真相将在今天最终揭开它的面纱。[GER.GetLeader]与几位官员一起观看着演讲的实况直播，他觉得自己仿佛置身现场十万观众的人群中，沉浸在这个时刻。\n\n“美国同胞们，我想和你们谈谈当下日益激化的危机，它已经大大破坏了美德之间的关系。简而言之，我是要对发生在波兰和俄罗斯的破坏行为负责的人。德国的指控的确是真实的，政府其他成员对发生的任何事件都不知情，责任完全在我。当下，美德关系摇摇欲坠，我们正处于战争的悬崖边上，这是能够让我们的星球逃脱不可避免的灭亡命运的唯一方法。随着德国海军返回本土，我也已经命令美国海军撤出。各位，危机已经结束了。”\n\n在格伦总统发布上述宣言之后，日耳曼尼亚陷入了狂喜的海洋，民众在街头巷尾高举啤酒大肆庆祝，德国人的爱国自豪感蓬勃而起；全国各地，公民们都在激烈地宣泄着的反美情绪，以焚烧美国书籍和国旗的方式庆贺着这次外交胜利；许多德国民族主义者梦想着能有一座千斤顶，将美国精神碾作碎片——没错，甚至就连他们也沉浸在胜利的荣耀之中；政治家们也在享受对美国的胜利。自第二次世界大战以来，这还此人们第一次见到美国遭受彻头彻尾的失败，在未来几周内，德国都会雄踞世界之巅。"
 glenn.128.desc.japan:0 "美国总统站在讲台上，面对着聚集在华盛顿特区的广大群众，他正准备着即将发表的演讲，汗水顺着脸庞流淌而下，日本危机的真相将在今天最终揭开它的面纱。[JAP.GetLeader]与几位官员一起观看着演讲的实况直播，他觉得自己仿佛置身现场十万观众的人群中，沉浸在这个时刻。\n\n“美国同胞们，我想和你们谈谈当下日益激化的危机，它已经大大破坏了美日之间的关系。简而言之，我是要对发生在中国的破坏行为负责的人。日本的指控的确是真实的，政府其他成员对发生的任何事件都不知情，责任完全在我。当下，美日关系摇摇欲坠，我们正处于战争的悬崖边上，这是能够让我们的星球逃脱不可避免的灭亡命运的唯一方法。随着日本海军返回本土，我也已经命令美国海军撤出。各位，危机已经结束了。”\n\n在格伦总统发布上述宣言之后，东京陷入了狂喜的海洋，民众在街头巷尾高举酒瓶大肆庆祝，日本人的爱国自豪感蓬勃而起；全国各地，公民们都在激烈地宣泄着的反美情绪，以焚烧美国书籍和国旗的方式庆贺着这次外交胜利；许多日本民族主义者梦想着能有一座千斤顶，将美国精神碾作碎片——没错，甚至就连他们也沉浸在胜利的荣耀之中；政治家们也在享受对美国的胜利。自第二次世界大战以来，这还此人们第一次见到美国遭受彻头彻尾的失败，在未来几周内，日本都会雄踞世界之巅。"
 glenn.128.a:0 "美国鹰终于退让了。"
 glenn.129.t:0 "美国精神，破灭了……"
 glenn.129.desc.germany:0 "没过多久，美国公众就把总统的演讲拼凑在了一起。\n\n美国人曾经支持着格伦，与他共度难关；可现在，无论走到哪里，他们都在咒骂着格伦的名字。大多数从前的支持者对总统怎么能如此干脆利落地发表这样的声明出卖祖国而感到愤怒。一部分支持者拒绝相信总统的话，依然在继续声谴德国。但尽管如此，随着广大民众沉浸在无望之中，格伦总统的声望骤然下跌到前所未有的水平。\n\n没过多久，NPP就利用了这次共民党自两党合并以来犯下的最大失误。选民开始承诺支持他们，进步派报纸的销量节节攀升，让共民党望尘莫及。甚至就连格伦自己党内的党员也开始写文章谴责总统，称他“可鄙”、“背叛他的国家”。格伦拔剑四顾，他在这个世界上已经没什么朋友了。\n\n总体而言，全美国的爱国主义精神都大为消退：“U——S——A——！”的呼声少了，在前院草坪上飘扬着的星条旗少了。美国公民为自己身为美国人而感到羞耻，这是一段国家民族精神的黑暗时期。所有残存下来的爱国主义情绪要么缄默不语，要么就转变成了针对德国的愤怒。"
 glenn.129.desc.japan:0 "没过多久，美国公众就把总统的演讲拼凑在了一起。\n\n美国人曾经支持着格伦，与他共度难关；可现在，无论走到哪里，他们都在咒骂着格伦的名字。大多数从前的支持者对总统怎么能如此干脆利落地发表这样的声明出卖祖国而感到愤怒。一部分支持者拒绝相信总统的话，依然在继续声谴日本。但尽管如此，随着广大民众沉浸在无望之中，格伦总统的声望骤然下跌到前所未有的水平。\n\n没过多久，NPP就利用了这次共民党自两党合并以来犯下的最大失误。选民开始承诺支持他们，进步派报纸的销量节节攀升，让共民党望尘莫及。甚至就连格伦自己党内的党员也开始写文章谴责总统，称他“可鄙”、“背叛他的国家”。格伦拔剑四顾，他在这个世界上已经没什么朋友了。\n\n总体而言，全美国的爱国主义精神都大为消退：“U——S——A——！”的呼声少了，在前院草坪上飘扬着的星条旗少了。美国公民为自己身为美国人而感到羞耻，这是一段国家民族精神的黑暗时期。所有残存下来的爱国主义情绪要么缄默不语，要么就转变成了针对日本帝国的愤怒。"
 glenn.129.a:0 "美国精神正走向灭亡……"
 glenn.130.t:0 "格伦的外交胜利"
 glenn.130.desc.germany:0 "德国终于在危机中退让了，美国取得了外交胜利。格伦总统成功地回避了所有针对他“虚假”指控，美国度过了这场危机，没有遭受任何耻辱、没有付出任何赔偿。\n\n日耳曼尼亚的消息一经传出，从东海岸到西海岸的美国群众就开始举行游行集会，庆祝格伦总统在与德国外交战场上的凯旋。在全国各地，美国国旗高高地飘扬在旗杆顶端；在农村乡镇，家家户户的门廊前都悬挂着星条旗。格伦的支持度在短短一夜之间攀升了一倍之多，与此同时，反德宣传也出现了类似的增长。美国公众有充分的理由相信，德国是一个由卑劣的告密者和企图击垮美国的腐败政客组成的国家。在这场外交风波中，美国人笑到了最后。\n\n共民党在危机过后赢得了巨大的支持，甚至有一些专家认为，格伦单枪匹马地拯救了这个合并而来的政党。共民党变得比以前更加团结，但恰恰相反的是，NPP的支持率正在迅速消退，这个弗兰肯斯坦式的缝合政党走向分裂的可能性越来越大。只有时间才能告诉我们，NPP还能坚持多久。\n\n在这个骄傲的国家之中，仍然有一部分美国人对格伦总统抱有怀疑的态度，但民众普遍的共识十分明确：格伦没有参与任何德国势力范围内的破坏活动。似乎，美国公众不太可能真正了解白宫中究竟发生了些什么……"
 glenn.130.desc.japan:0 "日本终于在危机中退让了，美国取得了外交胜利。格伦总统成功地回避了所有针对他“虚假”指控，美国度过了这场危机，没有遭受任何耻辱、没有付出任何赔偿。\n\n东京的消息一经传出，从东海岸到西海岸的美国群众就开始举行游行集会，庆祝格伦总统在与日本外交战场上的凯旋。在全国各地，美国国旗高高地飘扬在旗杆顶端；在农村乡镇，家家户户的门廊前都悬挂着星条旗。格伦的支持度在短短一夜之间攀升了一倍之多，与此同时，反日宣传也出现了类似的增长。美国公众有充分的理由相信，日本是一个由卑劣的告密者和企图击垮美国的腐败政客组成的国家。在这场外交风波中，美国人笑到了最后。\n\n共民党在危机过后赢得了巨大的支持，甚至有一些专家认为，格伦单枪匹马地拯救了这个合并而来的政党。共民党变得比以前更加团结，但恰恰相反的是，NPP的支持率正在迅速消退，这个弗兰肯斯坦式的缝合政党走向分裂的可能性越来越大。只有时间才能告诉我们，NPP还能坚持多久。\n\n在这个骄傲的国家之中，仍然有一部分美国人对格伦总统抱有怀疑的态度，但民众普遍的共识十分明确：格伦没有参与任何日本势力范围内的破坏活动。似乎，美国公众不太可能真正了解白宫中究竟发生了些什么……"
 glenn.130.a:0 "格伦逃过一劫。"
 glenn.145.t:0 "未来的曙光"
 glenn.145.desc:0 "致美利坚合众国总统办公室：\n\n我们政府已经自豪地迎接到了美国更安稳的未来的第一缕晨曦，而我们期盼它的到来已久。据华盛顿报道，美国核安全计划已于今日通过，该计划旨在研究和发展核技术，并开发大量富有革命性的新式核武器。科研团队已经被调动起来，准备好在将来为了让美利坚更强大的愿望而投入到工作中。总统先生，愿万字旗与旭日旗倾颓，星条旗高高飘扬。\n\n国家安全顾问，塞勒斯·万斯。"
 glenn.145.a:0 "筚路蓝缕，以创基业。"
 glenn.146.t:0 "只要功夫深，铁杵磨成针"
 glenn.146.desc:0 "致美利坚合众国总统办公室：\n\n格伦总统，我真希望你收到这封信的时候能够欢呼雀跃，因为美国核安全计划初出茅庐就已为保卫伟大祖国的事业结出了累累硕果。一支庞大的科研团队在核装料研究上取得了重大进展，美国现在拥有了前所未有的核威慑能力！除此之外，为了合众国的屹立不倒，在这一项目的预算和投入不断扩大的过程中，这一项目的未来远景也收获了热议。为了所有美国人的安危，让我们共同期待未来他们再创佳绩吧。\n\n国家安全顾问，塞勒斯·万斯。"
 glenn.146.a:0 "这是美国又一次振奋人心的胜利！"
 glenn.147.t:0 "坚不可摧"
 glenn.147.desc:0 "致美利坚合众国总统办公室：\n\n最新报告表明，美国核安全计划取得的进步可谓日新月异，发展前景一片大好！几项报告指出，归功于这一计划，我们的导弹无论是在数量、质量还是力量上都正在突飞猛进。此外，来自CIA的最新报告说，看上去我们取得了一个大成果：就在此刻，如果我们的项目继续高歌猛进的话，美国的核武库储备将超过大日本帝国和大日耳曼国的总和！总统先生，为了让国家长久安宁，我们急需把核安全计划顺利进行到底！\n\n国家安全顾问，塞勒斯·万斯。"
 glenn.147.a:0 "保护国家与人民的坚实后盾。"
 glenn.148.t:0 "捍卫民主"
 glenn.148.desc:0 "致美利坚合众国总统办公室：\n\n格伦总统！美国核安全计划正在继续为合众国提供前所未有的安全保障。我们批准为实验设施设立新分布，并计划将来招募更多的爱国志士，以从目前尚存的各种巨大威胁之下捍卫我们的国家。因此，我们迫切需要把计划进行下去，进一步增强我们的导弹武装系统，以应对来自西方和东方的各种危险。总统先生，感谢您做出的贡献，我保证，国家为此付出的时间和奉献决不会付之东流。\n\n国家安全顾问，塞勒斯·万斯。"
 glenn.148.a:0 "捍卫所有美利坚人民！"
 glenn.149.t:0 "使自由与正义免受压迫"
 glenn.149.desc:0 "致美利坚合众国总统办公室：\n\n美国核安全计划的最新成果已经引起国家安全援助机构的注意——我们已经通过该计划确保了在当今世界国防领域的强大话语权：美国的核武库储备已经比大日本帝国和大日耳曼国的领先百分之七十五还要多，也就是说，我们的核武储备几乎达到了其中任意一个的两倍！这足以威慑住任何敢于挑战我们伟大国家的对手。总统先生，为了我们的切实利益，我们必须站在冷战第一线，对抗我们的敌人，而目前我们在此成果卓著！\n\n国家安全顾问，塞勒斯·万斯。"
 glenn.149.a:0 "核安全计划会再次保护我们的！"
 glenn.150.t:0 "美国核安全计划前程似锦"
 glenn.150.desc:0 "致美利坚合众国总统办公室：\n\n总统约翰·格伦先生，美国核安全计划现在终于证明了它的前途是多么光明。我们已经把核导弹的威力提升到一年前的核试验都难以望其项背的水平，不仅如此，它的威力还在以指数级的速度快速发展！这意味着我们即将成为世界上核威力最强大的国家。不单单是质量，我们已经设法建造了规模远超我们的两个对手的核武库，并致力于发展核打击能力，使我们的核弹头数量达到德国或日本的近两倍！格伦总统，我很荣幸告知您，核安全计划已经为我国的安保作出了可观的贡献，并为作为合众国总统的您带来了荣耀。先生，衷心感谢您付出的一切，我们将在法西斯的黑暗中永远屹立不倒。\n\n国家安全顾问，塞勒斯·万斯。"
 glenn.150.a:0 "万斯部长，你也是不可或缺的。"
 glenn.151.t:0 "一次全球广播"
 glenn.151.desc:0 "“现在，格伦总统已经准备好在新闻发布会上对我国以及全世界宣告美国核安全计划取得的进展及其我们的国家的影响了。广播即将开始。倒计时三……二……一……”\n\n“首先，我要对美利坚合众国伟大的民众，和全世界追求着一个更美好的时代——一个打破压迫与暴政的时代——的人民，道一声：晚上好。有人说，只有当所有国家放下武器、为自由而精诚合作时，世界才会平息。但是，从东方到西方，世界的每个角落都还面临着威胁，而确保合众国赖以存在的自由与独立得以免受任何因素威胁，就是我们的职责所在。”\n\n“这就是我们国家安全顾问塞勒斯·万斯起草了《美国核安全计划》的原因。通过从质量和数量上扩展合众国的核武库，他为美国建立起了又一道对抗法西斯主义的恐怖威胁的防线。现在，经过确认，该计划已经将我们的核弹头数量提升至五万，这些核弹头时刻准备好被部署在任何需要的地方。因此，我们表明，对将来任何威胁我们的狂风骤雨，我们都丝毫不惧。这是为了国家的安定，为了全世界民主的安全。上帝保佑美国。另外，向美国道晚安。”\n\n从一个个美国家庭的长椅旁到德国元首的办公室中，再到日本首相的座椅前，这场广播出现在全世界的荧幕之上。每个人都或如释重负，或提心吊胆，或紧张万分，“核外交”这个话题已经充斥了大街小巷。"
 glenn.151.a:0 "塑造一个更安全的世界。"
 glenn.152.t:0 "肯尼迪的遗产"
 glenn.152.desc:0 "约翰·格伦不知道历史会如何评价他的前任。数十年来的第三位肯尼迪。他不会像他父亲那样作为输掉第二次世界大战的失败者被人们铭记。他也不会是像他的兄长——“肯尼迪王朝”失去的希望。那时他的兄长恍若一个闪亮的明星，只可惜刺客的一发子弹就将其熄灭了。他会是那个拿起他哥哥的火炬，却在面对杰克未竟的事业时犹豫不决的人吗？一个三次执掌美国政府的政治王朝，最后的失败又是什么？\n\n第39任总统对罗伯特·肯尼迪的遗产没有答案，但他确实有他的火炬。自第二次世界大战结束以来，三位总统和每一届国会都未能通过民权法案。他不会，也不可能是第四个。他面前的民权法案没有人会感到高兴。那些在南方闷热的夏天游行、奋战和抗议的活动家不会，南方的民众也不会，那些辛劳、尖叫，誓要阻挠法案通过的迪克西派们更加不会。自由主义者认为这还不够自由；温和派认为这不够温和，而保守派则在抱怨州权——政府的行为明显已经越界了。\n\n格伦没有参加民权运动。他没有洛奇或洛克菲勒的信誉，甚至还不如罗姆尼这样的人可靠。格伦是一匹黑马，在初选和大会上脱颖而出。他赢得了支持社会保障、改革劳动法、面包和黄油问题，以及他的公众信誉。然而，美国的罪孽不可能没有一个答案。\n\n他拿起电话，“梅岑鲍姆，给我接戈尔、约翰逊和德克森。哪些参议员还在犹豫不决，给我一份他们的名单。”"
 glenn.152.a:0 "“南方不会给另一位总统下跪。”"
 glenn.153.t:0 "迟来的凯旋"
 glenn.153.desc:0 "快门闪动。\n\n笔尖飞舞。\n\n总统自豪地在[GetYear]年民权法案上签下了代表胜利的署名。\n\n疲倦的笑容和掩饰的假笑让格伦明白，站在他身边的人没有几个心满意足。民权立法的执行机制遭到了削除，以动摇南方温和派的选票，自由派对此感到不满；法案也没有删除将私营企业包括在立法范围内的条款，温和派也并不买账；当然，民权领袖们也是如此，他们知道，将法案规定落到实处还需要在联邦法院提起更多的法律诉讼、进行更多的抗议示威、展开更多的组织活动。\n\n庆祝活动相当克制，总统的讲话也很平静。总统知道这种感觉，在德国人击败NASA登上月球后，他自己也有这种感觉。在那之后，“太空第一人”的奖赏和安慰似乎并不那么甜美。格伦知道，如果美国社会中这个巨大的错误真的能够得以纠正，还需要更多的行动和更多的立法举措。\n\n然而，首先，他的议程需要通过国会。对美国老人的照顾、劳工改革、然后……"
 glenn.153.a:0 "群星在召唤。"
 glenn.154.t:0 "失败的阴云"
 glenn.154.desc:0 "在[GetYear]年民权法案失败后，几乎没有人去关注格伦总统的公开讲话。\n\n“我对法案遭到参议院否决深感失望……”\n\n从哈勒姆到南区，从亚特兰大到辛辛那提，美国各大城市的贫民区，事态已成鼎沸之势。这一切都源于恶劣的居住条件条、失业、贫困、政策的滥用、种族主义、拒绝与之斗争的政府、还有温和化的失败。\n\n“我们将继续努力，改善我国非裔美国人的权利……”\n\n事实证明，对南方的奉承没能带来任何好处。伊斯特兰和瑟蒙德反过来称赞着参议院的同僚，因为他们“拒绝向与黑人暴力激进主义势力勾结的白宫屈膝下跪”；华莱士和马多克斯热情似火地谴责着北方和傲慢的非裔美国人，观众们都感到很兴奋。\n\n“.……谢谢各位，天佑美利坚。”\n\n民众选择了这位来自俄亥俄州的宇航员来超越美国社会中痛苦的分歧，但他却只是进一步加深了这道鸿沟。"
 glenn.154.a:0 "要是我们连自己国家的马路都过不去，又怎么能登上群星？"
 glenn.space.1.t:0 "意外挫折"
 glenn.space.1.desc:0 "在通向群星的征途中，失败是不可避免的。今天，我们最新的无人任务遭受了灾难性的完全失败。发射起初看起来非常完美，起飞时读数一切正常。大概三分钟后，火箭发生了一次意外的引擎故障。随后它便缓慢地滚落下来，坠毁在发射场几英里外。还好坠落地区一个人也没有，没有造成人员伤亡，这次失利仍然意味着项目损失了几百万美元。\n\n这次失败对团队是个不小的打击，眼睁睁地看着几个月的辛勤工作化作一缕浓烟让团队整体士气低落。现在，我们的工程师正对数据进行分析，试图弄清楚哪里出了差错，哪里没做好准备。我们只能希望用这次的经验教训尽力改进下次任务，避免类似的灾难再次发生。\n\n如预料的一样，公众对此并不高兴。每个新闻记者都在质疑NASA的方法，指责它是个资金黑洞。如果我们想让公众继续站在我们这边，类似的事故绝不能再发生。"
 glenn.space.1.a:0 "我们得要做得更好。"
 glenn.space.2.t:0 "系统一切正常"
 glenn.space.2.desc:0 "总部传来捷报：最新的无人任务已经成功完成发射。NASA工程师为此付出了大量汗水，而看起来这些付出得到了回报。全国人民要么在现场观摩，要么在家通过电视观看发射。\n\n而在NASA，我们则急切地等待着这次任务的关键数据传回。谁知道我们会有什么新发现呢？\n\n火箭升空的那一刻，欢呼声响彻全国。火箭毫无差错地飞越了地平线，所有系统均报告正常运转。我们很快就能看到任务的成果，目前看来，情况非常乐观！"
 glenn.space.2.a:0 "更高更远！"
 glenn.space.3.t:0 "任务成果"
 glenn.space.3.desc:0 "啊哈，我们刚刚回收了上次无人任务的全部数据！工程师们已经开始仔细研究了，总部所有人都对这些结果十分满意。研发部的小伙子们也有关于如何利用这些数据的想法，能让火箭项目的发展再上一层楼！\n\n任务成功也获得了公众支持，越来越多的公民将太空计划视作国家的未来。人民正在想象着我们接下来还会做些什么，任务的持续成功将继续巩固计划的公众信心。\n\n从这次§S无人§!任务中，我们得到了§M[?USA_GLN_Mission_Science_Points_Reward]§!研究点数，和[?USA_GLN_Mission_Public_Support_Reward]公众支持。"
 glenn.space.3.a:0 "任务完成！"
 glenn.space.4.t:0 "危机解除？"
 glenn.space.4.desc:0 "今天差点儿发生了一场全国性的悲剧。在最新一次载人发射任务中，矗立在发射台上的火箭发生了猛烈的爆炸，观看发射的人群惊恐地目睹发射台变成了熊熊燃烧的火球。\n\n万幸的是，安全系统发挥了它的作用，宇航员只受了一点轻伤，但真的险之又险，要是没这么幸运，英雄们就得马革裹尸了。我们必须要重新认真审视准备工作，确保这种情况不会再次发生。\n\n尽管没有人员伤亡，但这次失败在公众中引起了很大的不满。必须让他们明白，我们非常重视宇航员的安全，绝不能再发生类似的事故。"
 glenn.space.4.a:0 "准备一下演讲和新闻发布会吧……"
 glenn.space.5.t:0 "不赀之损"
 glenn.space.5.desc:0 "今天，我们蒙受了可怕的损失，最新一次载人航天任务以悲剧告终，乘组全数牺牲。我们仍然无法确定确切的细节，火箭发射时还很顺利，热心群众在远处为它欢呼喝彩，但在离开发射台仅仅几分钟后，引擎的某个关键故障引爆了火箭燃料箱，执行任务的所有乘组人员当场死亡。碎片落下时，发射场外的人群都已前往避难处，因此没有平民伤亡的报道。\n\n在总部，情况很糟糕，士气低落到了无以复加的地步，NASA正在哀悼着朋友和家人们的逝去。我们需要一段时间才能完全恢复之前的状态。\n\n似乎所有的新闻广播都在讨论这场灾难，声称我们主动忽略了安全风险；公众对NASA的信心已经被打破，可能都永远无法恢复。总而言之，这场灾难让人们对NASA的未来、甚至对总统都产生了怀疑。我们需要重铸公众信心，立刻、马上。"
 glenn.space.5.a:0 "他们都是英雄，每个都是。"
 glenn.space.6.t:0 "星河欲转千帆舞"
 glenn.space.6.desc:0 "最新发射的火箭已经成功突破了平流层，勇敢的宇航员在今天摆脱了地球的束缚。来自四面八方的人们聚集在一起，目送小伙子们出征，在火箭升空、飞向天际时欢呼喝彩。\n\n任务控制中心正在不断监测情况。截至目前，一切都在按计划进行，宇航员乘组正在为下一个阶段的旅程做准备，在任务较为关键的阶段保持频繁的联络。离任务完成还有一段时间，但前景是光明的。\n\n几乎所有国内外的新闻频道都开辟了专栏节目来报道这次任务，全世界都高兴地目睹着太空探索的前沿一步一步地向前迈进。"
 glenn.space.6.a:0 "向天穹前进。"
 glenn.space.7.t:0 "任务成果"
 glenn.space.7.desc:0 "最新一次载人任务的返回舱已经成功着陆，美国的英雄们今天回家了。当下，我们正在对宇航员进行一系列身体测试，确保他们能迅速从艰苦的太空旅行中恢复过来。\n\n对任务中获得数据的分析也已经开始，这将是宝贵的研发资料，希望这些数据能让宇航员们在接下来的载人任务中更加安全。\n\n全国各地都对英雄凯旋举行了盛大的庆祝活动。只要宇航员们一恢复身体状态，就会进行电视采访、游行庆祝还有更多的活动。这群勇士将在史册上留下深深的烙印，他们将成为美国宏大目标的纪念。宇航员们已经收到了许多信件，表明了来自全国各个角落的支持！\n\n从这次§Y载人§!任务中，我们得到了§M[?USA_GLN_Mission_Science_Points_Reward]§!研究点数，和[?USA_GLN_Mission_Public_Support_Reward]公众支持。"
 glenn.space.7.a:0 "美利坚之心与宇航员们同在。"
 glenn.space.9.t:0 "得分"
 glenn.space.9.desc:0 "就在阿姆斯特朗确认登月舱着陆的几分钟之后，世界各地数百万台各种品牌和型号的电视机和收音机都调到了同一个频道，每块电视屏幕上都显示着NASA控制中心的景象。奥尔德林、迈克尔和任务控制中心正在进行系统检查，时不时进行几句交流。全世界都屏息凝神，等待着美国对德国登月迟来的回应。终于，仿佛等待了一辈子之后，人们看到了。\n\n二十万英里外，传回了安装在止战号基座上的摄像头拍摄的现场画面，月面在着陆器的背面舒展开来，坑坑洼洼的灰色原野一望无际。此时，一道孤独的身影出现在镜头中，从登月舱中走了下来：迈克尔·柯林斯，第一位登上月球的美国人，踏上了月面细碎的砾石，发出了他的宣言：“随着这第一步，美国终于确保了她在太空中的地位。”\n\n狄安娜3号成功的消息让公众欣喜若狂，甚至就连参议院内对格伦最为吹毛求疵的批评者都在美国的胜利面前缄口不言。在几场庆祝活动之后，格伦总统准备在白宫前的草坪上向全国发表电视讲话。\n\n“今天，我不仅要向美国公民讲话，还要向全世界讲话。经过多年的努力，我们终于将美国人送上了月球，这代表着才华横溢的NASA团队多年来的辛勤工作。如果没有这群工程师、天体物理学家、还有无数其他具有远见的人，这一切就都不可能实现。阿波罗计划的失败不会再束缚我们，我们仍然身处这场伟大的竞赛之中。最后，我想向所有听众重申，这并不代表着漫长的星空之旅会就此画上句号……”"
 glenn.space.9.a:0 "不，这只是个开始。"
 glenn.space.91.t:0 "白佬上月球"
 glenn.space.91.desc:0 "白佬在月球上瞎闹腾。\n\n鞋子是拿银勺子做的。\n\n他告诉所有朋友，\n\n他们应该也来快活快活。\n\n\n\n在下面的世界。\n\n流浪汉们在他的亚特兰大庄园门口聚堆。\n\n请他施舍点面包面团。\n\n但在平流层之上，他可啥也听不见。\n\n\n\n白佬在月球上待腻歪了。\n\n他要回家了。\n\n乘着火焰和季风。\n\n他寻思着。\n\n我真他妈喜欢上月球。"
 glenn.space.91.a:0 "作者：吉尔·斯科特·海伦"
 glenn.space.10.t:0 "阿瑞斯4号发射"
 glenn.space.10.desc:0 "今天是NASA下一个黄金时代开启的一天。\n\n从倒计时三十分钟开始，每一个美国公民都守坐在电视机前收看阿瑞斯4号的发射。作为NASA有史以来规模最大的项目之一，只要火箭能进入平流层，就有降落火星的希望。在距发射还有十五分钟时，每个公民都不禁屏住呼吸，没人知道接下来能否成功。火箭上的宇航员在等待最后的倒计时，只有时间才能回答一切。5，4，3，2，1……\n\n顷刻间，火箭助推器点火。在数百万美国民众的关注下，阿瑞斯4号从发射台上起飞，最终隐入黑暗的宇宙之中。发射取得了圆满的成功，全美都为NASA这历史性的成就而欢欣鼓舞。尽管NASA官员认为阿瑞斯4号要在270天后才能降落火星，但美国人的爱国热情依旧十分高涨，现在他们在太空探索竞赛中拥有了属于自己的利器。\n\n格伦总统与NASA成员一起在白宫举行了盛大的庆祝活动，但寂静的天空吸引着他走向屋外。夜幕降临，格伦心满意足地仰望星空，沉思着这次成功的发射。他独自一人仰望火星，微笑着举起香槟酒杯，仿佛在邀请星空与他共进晚餐。任务完成！"
 glenn.space.10.a:0 "要是我能看到这一幕就好了……"
 glenn.space.11.t:0 "NASA值得花钱吗？"
 glenn.space.11.desc:0 "“各位观众晚上好。在今晚的CBS电视台晚间新闻，我们将深入探讨最近NASA预算的变化。NASA的资金在最近几年有所增加，这并不奇怪，格伦总统已经相当清楚地表明，他计划要资助更新颖、更大胆的太空任务。然而我们发现，拨付NASA的资金呈现指数级的增长，甚至能够与军事预算并驾齐驱。有一些批评称，这些资金用错了地方，是经济上的浪费。现在，如果看一下这个图表，你就能清楚地明白……”\n\n总统先生，看来国会已经决定削减预算资金，许多国会议员已经注意到，公众支持正在减退，并且认为拨付给NASA的预算最好还是用在其他地方。今天上午，这项预算削减凭借温和的支持在国会获得通过，现在我们必须要开始审视哪些项目可以暂时予以推迟。\n\n如果想要维持NASA目前的预算，我们就得在公众认可上下功夫。任务成功以及规避灾难将向民众展示NASA的能力，只要拥有国民的支持，即使是最愚蠢的国会议员也不会再胆敢撤回拨付NASA的资金。"
 glenn.space.11.a:0 "该死！飞向群星的事业值得为之付出一切！"
 glenn.space.12.t:0 "付之东流"
 glenn.space.12.desc:0 "“先是南非，现在又来了格伦的火箭，我们根本花不起这些钱！”\n“……那您认为我们应该把钱花到哪呢？”\n“把我们操蛋的路修修！你真应该看看我每天得跑啥样的路才能开到……”“谢谢您，刚才是科罗拉多的米歇尔。如果你想分享你对NASA预算支出的看法，请别犹豫，拨打哥伦比亚广播公司热线吧。”\n\n“下面是简的电话，他来自西雅图。简，你好吗？”“还可以，谢谢！”\n“那么，简，您对目前NASA的开支有什么看法呢？”\n“我觉得吧，我理解航天事业是国家的骄傲，但是咱们总得有点收获吧。我就是感觉我们什么也没搞成。”\n“谢谢您发表感受，简。下面让我们休息片刻，今晚稍后时候我们就会回来收听更多来电。”\n\n总统先生，我们有麻烦了。国会那些格局小的傻子们希望进一步裁撤NASA资金，他们声称有半打的军事项目等着用这笔钱。只要我们继续失去民心，我们的预算就会进一步流失。要想让任何项目继续进行下去，我们就得重振民众的信心。"
 glenn.space.12.a:0 "接公关部，马上！"
 glenn.space.13.t:0 "听证会"
 glenn.space.13.desc:0 "戴维斯在听证会上如坐针毡，脸上的汗水清晰可见。他微微咳嗽了一声，靠近了话筒：“对不起，您能重复一下之前的问题吗？”\n议员叹了口气，说道：“戴维斯先生，我刚刚问您，一开始给您的项目划拨的5亿美元去哪了。”戴维斯随后回答道：“呃，我们的有效载荷需要对火箭低级进行改良，而且——”\n“那另外5亿美元呢？就是在之前的火箭化为乌有之后，用于开发另一枚火箭的那部分资金？”戴维斯顿了一下，拿起手边的杯子开始喝水，良久之后，他开口说道：“议员先生，我也希望我能说每一次发射任务都可以取得圆满成功，但是——”\n议员在座位上倾身向前：“不，这还不够好！你的预算可不是天上掉下来的，每当你的工程师炸飞火箭的时候，你都是在浪费纳税人的数百万美元。”戴维斯挣扎着，试图想出如何回应，他往后一倒，靠在座位上，只要能逃离这里，让他去什么地方都行。\n\n“这只是参议院关于NASA预算问题听证会的第一部分。如果您刚刚才开始观看我们的节目，威廉·戴维斯是NASA的一名管理人员，他在今天被传召到参议院发言，我们将继续关注听证会的情况。这里是CBS晚间新闻，今晚还有更多内容。”\n\n总统先生，公众舆论正在继续恶化。国会不断将我们的失败公之于众，几乎所有的新闻台都在报道这些事情，甚至就连我们自己的党派都在建议对NASA进行更大规模的裁减，公民们认为NASA在浪费钱财，这是我们无法承受的重压。必须要迅速着手扭转公众舆论，否则，宇航员们将会无处可去。"
 glenn.space.13.a:0 "该死。"
 glenn.space.14.t:0 "想象力的缺乏"
 glenn.space.14.desc:0 "“随着全国针对NASA行事方式的质疑，公众的呼声仍在继续。地处华盛顿特区NASA总部外，抗议活动愈演愈烈，人群打出了‘这里浪费了更多的钱’、‘我们不想资助你们的失败’之类的标语口号。格伦总统是否会注意到这些抗议活动还有待观察，但国会议员已经确认，会着手计划将更多的NASA的预算转移到其他项目之上。这里是今日的CBS晚间新闻，更多内容，稍后继续。”\n\n“总统先生，我们不能再像这样继续下去了。街上的那些混蛋目光短浅，他们确信我们正在把他们成堆的钞票拿去烧火，国会的反对派当然也在利用这一切。要不了多久，NASA就会因预算削减而陷入瘫痪。如果我们想要赢的下一个任期，就需要说服国家，让他们相信所有这些资金都是有价值的。我们再也承受不起失败了。”"
 glenn.space.14.a:0 "是这样吗？"
 glenn.space.15.t:0 "格伦总统的非法投资？"
 glenn.space.15.desc:0 "近来，NASA取得了一连串的成功，但某些国会议员却提出要求进行调查，审查我们的财政情况。许多NPP乃至我党政治家都认为在太空项目上的投资太过庞大，而其他事务却没有得到应有的拨款。这些指责声称，有大量投资都是违宪的，甚至可能会遭到弹劾。\n\n太空计划是格伦总统任期内的重中之重，这些指控让他担惊受怕。总统开始联系宪法律师，证明他对NASA投资的合理性，对他可能会失去迄今为止在新项目上取得的所有进展而忧心忡忡。虽然这可能会对格伦的总统任期产生不利影响，但我们能做的只有密切关注事态的新发展。"
 glenn.space.15.a:0 "格伦会栽在预算使用的问题上吗？"
 glenn.space.16.t:0 "触手可及"
 glenn.space.16.desc:0 "“……坦率地说，我认为格伦的福利计划完全是本末倒置。当然，社会必须要照顾最弱势的群体，但社会保障却在许多方面都搞错了重点，而这是则是另一个迹象……”\n\n吱。\n\n随着声响，电视关上了，屏幕上的图像瞬间消失，变成一块黑色的屏幕，仿佛它们根本就从未存在过。查尔斯想着，这就是典型的政治——与物质完全脱离的无关紧要而又抽象的玩意儿，与现实世界毫无关联而又的虚无缥缈的幻象。政客们喋喋不休，撒谎、承诺、威胁，但最终，当事情涉及到他和他居住的西弗吉尼亚州某个不受重视的社区时，这些都毫无意义。\n\n然而，格伦却带来了一些并不虚幻的事物。社会保障支票是个实实在在的东西，不会受到形而上学概念或是什么浮华修辞的影响。它表明，高居华盛顿象牙塔之中的人实际上可以为他做一些事情，前提是他愿意——查尔斯已经在这片大地上度过了七十年的光阴，而这是那群人做的为数不多的几桩实事之一。\n\n或许会有人说，那个人太注重NASA之类的事情，但那又怎样？格伦是很长时间以来第一位给他发钱的政治家，理论上的批判不过只是空洞的海市蜃楼，在这个事实面前不堪一击，一触即碎。要是他想，尽管让他去登陆月球、登陆火星、登陆木卫二、甚至登上太阳，谁在乎这些呢？那些西装革履、一直都将太空计划斥作“毫无意义的政府资金浪费”的家伙可从来没有尝试过补贴他的退休金，这就是事实。\n\n为什么所有的政治家都不能像这个格伦一样？对查尔斯的生活来说，这张小小的支票起到的作用比被扔进南非还有印尼无底洞里的数十亿美元都要大。查尔斯想道，美国能够照顾社会中的弱势群体——只要她愿意。"
 glenn.space.16.a:0 "艰辛的旅程。"
 glenn.space.17.t:0 "一次演讲"
 glenn.space.17.desc:0 "这一切是多么美好！\n\n约翰·格伦站在讲台上，台下的万众尽收眼底。无数的民众！如雷的掌声！狂热的激情！几个月来，约翰几乎快要被重压击垮，但像这样激动人心的时刻提醒着他，这一切都付出都值得，他的付出是为了一个远大的理想！\n\n他静待了一两分钟，狂热的波澜才逐渐平息。他向前走了一步，然后开始了演讲。他花了约10分钟说了各种客套话、按照常规感谢他的听众并表达很荣幸来到佛罗里达，这些就足以深深刻印进他与会的支持者的记忆中了。然而，这次演讲的重中之重——无数的冥思苦想汇聚出的灵感和言辞——则足以使这演讲永载史册。他的所有其他壮举，无论是社会福利还是其他成就都极其伟大，但百年之后，人类将永远铭记的，是这次演讲。\n\n“在太空，那里没有竞争，没有偏见，也没有国家冲突。太空的艰险也对我们一视同仁。它值得全人类尽最大的力量去征服，而和平合作的机会可能永远不会重来。但有人会问，为什么要登火？为什么选择登上火星作为我们的目标？那他们也许也会问，为什么我们要登上最高的山巅？为什么，我们要在五十年前飞跃大西洋？\n\n我们选择登火。我们选择在这十年间登上火星并实现更多梦想，并非因为它们轻而易举，而正是因为它们困难重重。因为这个目标将激励我们组织、测试我们最顶尖的能力、技术，因为这个挑战我们乐于接受，因为这个挑战我们不愿推迟，因为正如其他挑战一样，这个挑战，我们势在必得。正是出于这些理由，我把我去年发展航天计划的决定视作我在本届总统任期内最重要的决定之一。”\n\n一片鸦雀无声。然后，排山倒海，掌声雷动。约翰露出了欣慰的笑容。是啊，德国人已然摘得了首次登月的桂冠，但宇宙无穷无尽，而美利坚的人民将永远同他在一起，决定将知识的步伐踏入浩瀚的未知。"
 glenn.space.17.a:0 "循此苦旅，直抵群星。"
 glenn.space.18.t:0 "梦想成真"
 glenn.space.18.desc:0 "一场历经数月的艰辛历程，将在最后八分钟迎来旅途的终点。方才还人声鼎沸的任务控制中心一片寂静，所有人都做好了他们的本分，接下来就看宇航员的表现了。最后的八分钟，将向全世界证明阿瑞斯四号计划会大获成功，还是成为航天史上的一次悲剧。\n\n有时，人生最重要的时刻，不过几分钟的长短。阿瑞斯四号的指令长尼尔·阿姆斯特朗很清楚，接下来的瞬间就是他人生中的巅峰时刻。“打开降落伞。”大卫·克罗斯继续监视着着陆器的高度，阿姆斯特朗颤抖地启动了坚定号的制动火箭，准备最后的着陆。舱体剧烈地摇晃着，但两人还是望向窗外，欣赏起外面的景色。米拉斯峡谷有着某种静谧之美，一道道深沟遍布大地，放眼望去尽是红砂。“我们真的到了，是吧？”克罗斯依然紧紧抓着眼前的控制台。“没错，我们成功了！”阿姆斯特朗握紧操纵杆向下拉动，又用力一推。\n\n尼尔·阿姆斯特朗从着陆器中跳了出来，他是第一个踏上新世界的人：“自先祖诞生之初，人类就仰望着星空，梦想某一天能在群星之间遨游。今天，这个梦想实现了。”街道上的人群难抑发自内心的喜悦，兴高采烈地庆祝起来，交通被欢庆的人群淹没，空中的焰火也不愿停歇。登月计划的成功确保了美国在太空竞赛中的领先地位，登陆火星更是重振了美国人的精神，合众国的未来必定光芒万丈。\n\n此时，约翰·格伦也伫立在NASA的任务控制中心，登陆成功后，所有人都欢呼起来。格伦望着那位屹立在火星上的人，他微笑着，落下激动的泪水……\n\n重新坐到办公桌后的格伦总统努力平抑着自己的情绪，面带微笑向世界发表演讲：“全世界人民，还有我的美国同胞们，就在今日，我们实现了不可能的事业……”"
 glenn.space.18.a:0 "人类的一小步……"
 glenn.space.100.t:0 "探员与宇航员"
 glenn.space.100.desc:0 "对总统来说，这次夜间会议的时间不同寻常地晚。幕僚长亲自组织了这次低调的会议，许多实习生和白宫西翼的工作人员根本无从知晓究竟发生了什么事情，可话又说回来，总统也希望他自己也是其中一员。约翰·格伦非常清楚，为什么审计总署的探员会坐在坚决桌对面，探员身着细条纹西装，两腿交叉，皮箱和帽子整齐地放在腿上。格伦如坐针毡，但对面这个脸色苍白的人却似乎毫无兴趣，只是自我介绍为“审计总署的安德森探员”，然后死死地盯着总统的脸。\n\n“得知你要求在这个时候见面，我很惊讶。”格伦竭尽所能地用中性语调说道，“为什么不直接让埃尔默明天过来？”\n\n探员轻轻地敲打着手提箱，回答道：“斯塔茨先生担心……总审计长对白宫的不定期访问会在国会引起不必要的猜测。请您放心，审计长只为总统和国家的最大利益着想，但是……”\n\n探员的眼睛盯着格伦的眼睛，突然间，总统觉得自己就像是一只直面恶狼的小鹿。“有时候，总统先生，某些事情……可能不会那么天衣无缝，这就是我来这里的目的。上周，总审计长办公室接到了忧心忡忡的五角大楼打来的电话，空军的年度预算似乎与国会去年通过的预算案并不完全一致，其中可能存在……NASA方向的挪用行为。具体地说，大约8.4亿美元。我已经与麦克卢卡斯副部长谈过了，他是最后一位审查预算案的人，他也表明在当时确实注意到了这一不正常的现象，并将之报告给了白宫西翼。如此看来，这种……奇特之处似乎是源于白宫内部的某个人。斯塔茨先生认为您可能会有些头绪，总统先生，您对这件事情有什么要说的吗？”\n\n格伦吞吞吐吐地说道：“我……我……”"
 glenn.space.100.a:0 "“……我和你一样震惊，这真是骇人听闻。”"
 glenn.space.100.b:0 "“……我很抱歉，这都是为了未来。”"
 glenn.space.101.t:0 "水星"
 glenn.space.101.desc:0 "总审计长埃尔默·博伊德·斯塔茨看完了安德森探员的报告，其中有些内容令他非常不安，因此，他决定在今晚拿上钢笔和笔记本再重新细读一遍。“再次感谢你，安德森。在审计总署，能够直面大人物而不退缩的人并不多。我本来还担心我得亲自到宾夕法尼亚大道走一趟，从格伦那儿打探一些消息。真可惜，他不愿意交出扰乱预算的家伙。我注意到，你也试着向司机打探过了，有什么收获吗？”\n\n身着细条纹西装的探员点了点头，可他却显得心不在焉：“是的，先生，报告第13页上有一份完整的名单。所有的军方副部长和海军部长都否认对此事知情，而陆军部长则指责空军部长，但他也只是声称听到了一些传言。虽然……可能……”探员的话音戛然而止，平素刚强坚毅的神态也第一次皱起眉头，显得犹豫不决，斯塔茨立刻意识到了探员在思考什么。\n\n“不，绝对不会，安德森。约翰是国家的英雄，有多年的政治经验，他绝不会试图在预算上做手脚，我了解他，他是个好人。把你的调查重点放在部长们身上吧。”"
 glenn.space.101.a:0 "“是的，长官。”"
 glenn.space.102.t:0 "金星"
 glenn.space.102.desc:0 "格伦总统觉得，这位年轻女士非常漂亮。有那么一瞬间，他担心这件事情是一个陷阱，本能地藏到了立柱后面，躲避楼下那位女士的视线，但在大楼梯的底部见到他的幕僚长显然已经清楚地说明了这次会面的受益者是谁。格伦默默地回到总统办公室，几分钟后，会面成果就被带到了他的面前，他不由得忐忑不安，心生恐惧。真是万幸，总审计长喜欢要求对所有审计总署的报告进行复制存档，更幸运的则是，通常负责报告复制工作的秘书罗莎琳德·沃伊尼克曾经是国务卿的私人秘书，并且两家之间还是亲密的好友。也许有点儿太幸运了？格伦怀着极大的怀疑浏览着报告，他愈发恐惧起来。安德森那条鲨鱼显然是嗅到了水里的血腥味，仅仅只在等待会面的短短数个小时里，安德森就已经与不少于七名副部长和三位军方部长聊过天了。如果报告可信，斯塔茨放出猎犬，咬上白宫也就是这几天的事情了，问题只是在于，他们会撕开谁的喉咙。格伦拿起了椅子旁边茶几上的电话，他决定给……"
 glenn.space.102.a:0 "“给我接罗杰·斯通，告诉他派修理工来这儿。”"
 glenn.space.102.b:0 "“埃尔默？我是约翰。我……我必须要为我的行为做出忏悔。”"
 glenn.space.102.c:0 "“接幕僚长，让他立刻过来，参加危机会议。”"
 glenn.space.103.t:0 "地球"
 glenn.space.103.desc:0 "国防部长走出一条穿过灌木丛的羊肠小径时，斯塔茨和安德森正在他的车子旁等待着他的到来。斯塔茨饶有兴趣地注意到与国防部长同行的空军部长似乎显得十分紧张，他温和地笑了笑：“希望我们没有打扰到五角大楼的重要事务。”\n\n国防部长看着恭候多时的总审计长，心头略感不安，但很快，他的脸上就绽放出令人不虞有他的欢快笑容：“埃尔默！当然没有！是苏珊让你上来的？”\n\n“的确是这样，我们实际上是在找西曼斯部长，但是……”\n\n神情紧张的空军部长迅速地挺直了自己的腰杆，差点儿甩掉自己鼻梁上厚厚的眼镜：“我、我不是已经通过我的办公室给你们做过笔录了吗？”\n\n“我们只是还有些其他问题，您的办公室告诉我们，说您来找国防部长了，而部长那位靓丽可爱的秘书告诉我们，二位正在这里的小山上散步。顺便说一句，她的车不错，是新买的吗？”\n\n“我得说，那真是辆非常非常好的车，”安德森接过话茬，说道，“价钱可能不便宜啊。”\n\n两位内阁部长面色苍白，随后，国防部长的脸色出于恼怒抑或羞愧而泛起红光：“你这是在暗示什么吗？”"
 glenn.space.103.a:0 "“没有，先生，只是问点儿问题。”"
 glenn.space.104.t:0 "火星"
 glenn.space.104.desc:0 "在五角大楼这台第二大军事机器永无止境的喧嚣之中，大楼中心的花园却是一片奇特而静谧的绿洲。此时正值清晨，国防部长和他担忧的神色是唯一能够让人们注意到此地重要性的因素。尽管格伦总统的处境并不算妙，但他也感到一阵怪异的平静：“你确定西曼斯真的撑不住吗？”\n\n部长紧张地点点头：“肯定撑不住。你知道的，他是搞科学的人，要是被拖到国会面前，他几乎立刻就会崩溃。我们现在必须做些什么来转嫁责任，总审计长知道我们为了让那些文件不翼而飞而付给苏珊的封口费。你现在仍然受到保护，这都是麦克卢卡斯副部长的安排，他也不知道你牵涉其中。如果我们把这统统都归咎于他……”\n\n国防部长沉默了，总统无意识地盯着花园的景象，他真的能就这么抛弃自己的政府成员吗？"
 glenn.space.104.a:0 "“为了国家的利益，麦克卢卡斯必须要走。”"
 glenn.space.104.b:0 "“给埃尔默打个电话吧，这个坑不能越挖越深了。”"
 glenn.space.104.c:0 "“不，我们必须得保护自已，找几个职员来背黑锅吧。”"
 glenn.space.105.t:0 "木星"
 glenn.space.105.desc:0 "尽管美国空军部副部长约翰·麦克卢卡斯看起来像是一名政治家，但他拥有令人惊讶的安静和专业素养。他一生中的大部分时间都在从事军队工作，对高级内阁职位牵涉到的阴谋诡计也无甚兴趣。然而……即使是他，在过去几周里也察觉到了一些不对劲。他的上司罗伯特·西曼斯平素都是一位安静的学者型人物，可他最近却变得越来越紧张健忘，并且还留下纸条，要求他去各个地方做些奇怪的差事，与不同的人交换着公文包和密封条。而现在，总统，这位很少与他直接往来的遥远人物也给他寄来一封亲笔信，要求他提供一些带有特定数字编码的文件。这些个编码他一辈子都记不住，但似乎都放在他办公室的档案柜里。当他在其中最后一份文件上签字时，副部长下定决心，要在不久的将来亲自着手调查此事。"
 glenn.space.105.a:0 "这事儿真是越来越怪了……"
 glenn.space.106.t:0 "土星"
 glenn.space.106.desc:0 "“总统先生，您真该早点儿给我打电话，而不是想着让梅岑鲍姆那个白痴四处乱跑去策划一个犯罪阴谋！”\n\n一听到这个词，格伦就抖了一下了：“拜托，杰布，我现在不是来给你打电话了吗？”\n\n“就这么点儿时间，他还得去考试，他甚至现在都不在我身边！你指望我亲自拿着马尼拉信封在特区里到处跑吗？”\n\n总统哼了一声，很是恼火：“可别提斯通了，你也没资格拖着某个大学生四处逛荡。我们会给你找个中间人，只是你得确保信封送到正确的记者手里，行吗？”\n\n“只要您下令，总统先生。是邮报还是时报？”"
 glenn.space.106.a:0 "”《华盛顿邮报》的读者是可能参与其中的调查人员。“"
 glenn.space.106.b:0 "”《纽约时报》相当受欢迎，离这事儿也足够远。“"
 glenn.space.107.t:0 "天王星"
 glenn.space.107.desc:0 "格伦坐在白宫办公室的椅子上，看着最后一批能够证明他与NASA资金丑闻有关联的文件在壁炉里化为一缕青烟。他又扫了一眼头版头条，然后把当天的《纽约时报》也扔了进去。他知道，这个故事不久就会成为全国上下最大的新闻。披露出的“NASA文件”证明了空军部副部长约翰·麦克卢卡斯在西曼斯空军部长病休时负责执行国会授权的军事预算，但他不小心犯了一个计算错误，后来又惊慌失措，试图掩盖他的失职。某些文件甚至还暗示他可能贿赂了五角大楼的秘书，以此换取他们销毁文件。不必多说，西曼斯和麦克卢卡斯的政治生涯都结束了，前者会回到了麻省理工学院，避开了即将到来的内部行政部门和国会对麦克卢卡斯的调查。格伦觉得，他应该为这一切大功告成而长舒一口气，然而在内心深处，他感到异常难过。就在刚刚，为了人类在星空中的未来，他做了正确的事，然而他却被迫像罪犯一样躲藏在这里？还有可怜的麦克卢卡斯？可我们就是不得不生活在这样一个不公而没有梦想的世界里。"
 glenn.space.107.a:0 "上天注定……"
 glenn.space.111.t:0 "旅行者号"
 glenn.space.111.desc:0 "“你……是你做的？”安德森探员根本无法相信他刚刚从办公桌对面的年轻人口中听到了些什么。\n\n“是的，先生，”那位年轻的五角大楼职员说道，“我犯了一些数学错误。我很乐意给您看我的笔记和事情的全过程，我的失误导致数百万美元流向了错误的地方。我知道接下来会发生什么。如果我不得不因此而进监狱，我也没有怨言，但请您记住，我向您坦白了。”\n\n“我……我会的，谢谢你，你可以暂时离开了，但是请不要离开环行路，我得跟总审计长谈谈。”\n\n在他的职业生涯中，安德森第一次感到了真正的无语。他一直坚信，这桩有关于NASA的错误绝对是人为故意的，而且是某个内阁成员亲自操作的手笔，然而……也许斯塔茨总审计长相信格伦政府的观点是正确的？毕竟……"
 glenn.space.111.a:0 "真的感觉相当不对劲……"
 glenn.space.112.t:0 "维京号"
 glenn.space.112.desc:0 "格伦总统正在与明尼苏达州州长通电话，此时，幕僚长梅岑鲍姆走进椭圆形办公室，打开了放在角落茶几上的电视机。当总统意识到屏幕上正在发生的事情时，他忍住了大喊大叫的冲动，迅速地挂断了手上的电话。格伦与梅岑鲍姆默默地看了几分钟电视，总统真希望他不认识屏幕上的那张脸，希望他没有在几天之前感谢那张脸的主人，感谢他即将为国家做出的牺牲。这名年轻的工作人员怕了，或者也有可能只是想向媒体兜售他的故事，但不管原因如何，他声称内阁对他进行了贿赂，以此换取由他来为发生在空军预算资金上的事情承担责任。\n\n当总统再次拿起电话时，他并没有回电给明尼苏达州州长。"
 glenn.space.112.a:0 "“请给我接总审计长办公室。”"
 glenn.space.113.t:0 "阿波罗号"
 glenn.space.113.desc:0 "参议院的质询持续了大约十个小时，但在质询结束时，格伦感到长松一口气。参议员们似乎已经相信了他，最初的资金问题只是一次意外，而试图掩盖的原因则在于白宫对于丢面子的恐惧。当然，妨碍司法公正还是会让他受到国会的谴责，但只要摆脱挪用政府资金的指控，他就能安然度过难关。质询结束后，他在国会山圆形大厅遇到了作为证人出席的埃尔默·斯塔茨和安德森探员。总统的好心情瞬间消失了，他注意到，安德森仍然和之前一样渴求着找出问题，只不过现在他的情绪里又夹杂了一丝恼怒；而另一位证人则不同，斯塔茨总审计长万分歉意地与总统握手：“为了国家的利益，这是必须的，总统先生。没有人可以凌驾于法律之上，我很抱歉。”"
 glenn.space.113.a:0 "“我才是该说抱歉的那个人。”"
 glenn.space.116.t:0 "挑战者号"
 glenn.space.116.desc:0 "安德森探员将一张体形瘦削的年轻人的照片钉在了审计总署办公室的软木板上。“先生们，这位名叫罗杰·斯通，最近刚刚从大学辍学，成了总统再选委员会中最年轻的成员。昨天，他因为身份识别的问题被五角大楼的安保人员抓了起来，发现他的公文包里有三万多美元的现金。我想，这就是我们一直在被拖后腿的原因。更重要的是，斯通只是……大鱼中间的一个小虾米而已。”\n\n安德森将另一张戴着线框眼镜、没有什么明显特征的人的照片钉上了木板。“这个不起眼的家伙就是杰布·斯图尔特·马格鲁德，也被称作‘修理工’。他是一条滑不溜秋的鳗鱼，我们手头的文件显示，他在过去十年的大部分时间里都一直在给共民党办脏活儿，但始终都没能拿到确切的证据。而这一次，我们终于有了抓住他马脚的机会。我提议，立即对他最近经手的事务开展调查，有谁不同意？”"
 glenn.space.116.a:0 "把这件事儿交给斯塔茨决定吧。"
 glenn.space.117.t:0 "双子星座号"
 glenn.space.117.desc:0 "形状如同手提箱一般的改进型移动电话系统播放着录音，传出了夹杂着电流噼啪声响的话语，格伦总统艰难地辨识出了马格鲁德的声音，其中的恐慌清晰可闻：“他们……我的部下……审计总署抓住了我的……传票厚得就像小说一样……安德森……会尝试……只要我……你们得……总统，梅茨！”\n\n幕僚长梅岑鲍姆按下了结束播放录音的按钮，说道：“坦率地讲，先生，要是马格鲁德真栽在审计总署手里，那他们就有十二种办法在今天半夜之前查到我们头上来。我建议，在还有回旋余地的时候实施B计划。我已经在五角大楼找到了一个值得信赖的职员，只要我们保证他能从现在起过上舒适的生活，他就可以把责任揽过去。总统先生，这可能是我们最后的机会了，要我打电话吗？”"
 glenn.space.117.a:0 "“就这么做吧，也许我们还能撇清关系。”"
 glenn.space.117.b:0 "“已经太迟了，让我们扛起自己的责任吧。”"
 glenn.space.121.t:0 "幻灭的梦想"
 glenn.space.121.desc:0 "“美国同胞们，我今天在这里向你们讲话，承认我严重的错误行为和误判。几个月前，我收到了国会的年度预算。而落实预算分配时，我注意到空军部长在分配资金时犯了一个错误，意外地给NASA分配了太多的资金。这就是我辜负大家的地方，我没有履行宪法规定的职责去调整这个错误，而是被我个人对人类在星空中的未来的信念蒙蔽了双眼，下令这位优秀的部长容许这个错误的存在。我没有忠实地履行我的职责，因此，美国同胞们，我在此将我的命运交给合法选出的国会，并由你们来评判我的行为。谢谢各位，愿上帝保佑美国。”"
 glenn.space.121.a:0 "简单但又必要的诚实。"
 glenn.space.122.t:0 "破碎的梦想"
 glenn.space.122.desc:0 "“……以及，像往常一样，让我们连线弗兰克·布莱尔，看看他那儿有什么新闻。我听说他今天有非常劲爆的消息，弗兰克？”\n\n“谢谢你，休，事情的发展确实相当有趣。今天，令人震惊的消息泄露在华盛顿特区引起了大地震，《华盛顿邮报》的一篇长篇披露文章显示，总统再选委员会的一名成员据信参与了一个阴谋，意图陷害空军部副部长约翰·麦克卢卡斯，其原因则是空军部长罗伯特·西曼斯在执行其部门预算时犯下了严重的会计错误，导致有数亿美元的资金被错误地拨付给了NASA。据称，再选委员会的高级成员杰布·马格鲁德试图通过中间人，将涉及麦克卢卡斯的泄密文件传递给罗布·弗里德曼，也就是之后《邮报》上那篇文章的作者。但是，马格鲁德没有意识到弗里德曼和麦克卢卡斯副部长在私下里是熟人，于是他们两人很快就发现了马格鲁德的参与。白宫否认对这一事件知情，但承诺将对西曼斯部长的行为展开全面的内部调查。总统的老对手，缅因州参议员玛格丽特·蔡斯·史密斯则向邮报指出，西曼斯部长和总统本人都拥有NASA背景，在向NASA挪用国防经费方面存在既得利益。同样，在一份联合声明中，阿拉巴马州的议员们也已经……”"
 glenn.space.122.a:0 "但是，伊卡洛斯飞得离太阳太近了……"
 glenn.space.123.t:0 "被遗忘的梦想"
 glenn.space.123.desc:0 "白宫后院草坪，格伦正坐在一张椅子上，感受着照射在肌肤上的温暖阳光。在这一刻，他可以忘记白宫新闻办公室中正在上演的混乱、忘记坚决桌上越积越多的谈及白宫贿赂丑闻的报纸。那一天早上，国防部长给格伦打来电话，自愿承担起了保护总统的责任；梅岑鲍姆则向他保证，所有与他们有关的文件都已经被销毁。在这里，在阳光下，格伦终于可以自由地放松自己。然而，某些念头却始终萦绕不去，困扰着他的头脑：即使他个人设法躲过了这一事件最严重的影响，人民还会再相信他吗？国会呢？他只是希望能够确保NASA拥有所需的资金，帮助人类迈向更美好、更博学的未来。突然，草坪上传来一阵脚步声，将格伦从思绪中惊醒。他转过头，面无表情的安德森探员正向他走来。"
 glenn.space.123.a:0 "饿狼仍然在追踪着他的猎物……"
 glenn.space.124.t:0 "海王星之梦"
 glenn.space.124.desc:0 "“总统先生？您来这里做什么？”\n\n“我是来向你道歉的，约翰。正如我妻子说的一样，约翰给约翰道歉。”\n\n“您？这是您干的？为什么？您为什么要这样做？”\n\n“我有一个梦想，约翰。”\n\n“一个梦想？梦想？这是我的职业生涯！我可能得因此去坐牢！”\n\n“你不会进监狱的，我已经安排好了。只要你继续否认，无论如何都不要谈及这次会面，你就能过上舒适的退休生活，或者走上任何你想要的政府承包商中的工作岗位。我不是怪物，但为了国家的利益，我不得不让你来承受这一切。”\n\n“恕我直言，我……不知道我是该祝福您还是诅咒您，总统先生。”\n\n“其实，我也不知道。”"
 glenn.space.124.a:0 "即使是星星，也终有燃尽的时候。"
 glenn.nuclear.1.t:0 "核裁军谈判"
 glenn.nuclear.1.desc:0 "在人类第一次击碎原子以来的几十年里，世界大国一直在积累核弹头库存。这些弹头足以将全世界毁灭好几轮，但现在它们还闲置在导弹发射井、飞机机库和潜艇里。随着反弹道导弹技术日新月异，将核弹库存现代化并跟上新发展的开销也在成倍增加。格伦总统知道，我们别无选择，要么永享和平，要么灰飞烟灭，要么就因为核武库不断增长而走向破产。他当然明白自己该选哪条路，但如果德日不同意，他说话就不算数。\n\n让我们决定一个时间和地点，让三个超级大国坐下来讨论裁军问题，悬崖勒马，寄希望于德国和日本会理智地做出思考。会谈面临不少干扰因素，比如威慑理论、对意大利与印度核野心的担忧、共荣圈与俄罗斯前线安全问题、还有日本人对美国成功入侵的担忧。我们要想一劳永逸地结束这个僵局，就必须准备好应对这些不安因素。"
 glenn.nuclear.1.a:0 "接下来，选择一个场地。"
 glenn.nuclear.2.t:0 "选择时间到"
 glenn.nuclear.2.desc:0 "不用说，会谈的地点肯定得定在一个中立地区，意大利、印度这样崛起中的强权显然也要排除在外。谈判团队已经将待选地点缩小到三个选项：布宜诺斯艾利斯、伊斯坦布尔和拉萨。\n\n布宜诺斯艾利斯离美国最近，那是一个阳光明媚、热情好客的城市。它有着拉美最高的生活水平、美丽的建筑和生机勃勃的文化，是能令各方都感到悠闲放松的休闲目的地。而且，据说阿根廷牛肉几乎毫不逊色于神户牛肉！\n\n伊斯坦布尔离德国最近，它实在是一个历史悠久的城市。圣索菲亚大教堂举世瞩目，而人们能透过博斯普鲁斯海峡领会一千五百年的沧桑，一杯上好的土耳其咖啡或许也能让与会者的心稍稍放松一些。\n\n拉萨离日本最近，这里是西藏古老的都城，也是地球上海拔最高的城市之一，端庄地坐落于念青唐古拉山脉之中。布达拉宫可能是会谈的理想场所，当地僧侣的超尘脱俗能让与会者走向和平之路。\n\n我们该在哪个城市进行谈判？"
 glenn.nuclear.2.a:0 "伊斯坦布尔"
 glenn.nuclear.2.b:0 "布宜诺斯艾利斯"
 glenn.nuclear.2.c:0 "拉萨"
 glenn.nuclear.3.t:0 "出乎意料的邀请"
 glenn.nuclear.3.desc:0 "冷战对手向我们发出了一个令人震惊的提议，邀请我们坐下来进行核裁军谈判。虽然我们知道格伦总统在外交政策上会比他的前任更加柔和，但我们可没想到他会直接建议进行核裁军！\n\n出于本能反应，我们本想拒绝这个提议。毕竟，核武器帮助日本在大东亚战争中获得胜利，同时也是应对共荣圈内部不听话的政府的有力筹码，我们为什么要接受将其拆除的提议？\n\n但也许，这个提议也能带来好处。我们从未有过动用核武库的意图，但却在为此而花费大笔大笔的财富，本可以支撑起东亚的资金统统都被核武库抽干了。更令人担忧的是，我国的核武库分属于帝国陆军和帝国海军掌控，要是军种之间的争斗失去控制，这可能会导致灾难性的后果。或许相互裁军正是提振日本经济所需的动力。\n\n我们要去参加谈判吗？"
 glenn.nuclear.3.a:0 "去。"
 glenn.nuclear.3.b:0 "不去。"
 glenn.nuclear.4.t:0 "残忍的拒绝"
 glenn.nuclear.4.desc:0 "现在格伦满脸尴尬。他们甚至还没有就位，谈判就被日本人搞黄了。真不幸，能省下的钱本来能用在NASA身上的！"
 glenn.nuclear.4.a:0 "真操蛋！"
 glenn.nuclear.5.t:0 "出乎意料的邀请"
 glenn.nuclear.5.desc:0 "冷战对手向我们发出了一个令人震惊的提议，邀请我们坐下来进行核裁军谈判。虽然我们知道格伦总统在外交政策上会比他的前任更加柔和，但我们可没想到他会直接建议进行核裁军！\n\n出于本能反应，我们本想拒绝这个提议。毕竟，在日本拖后腿的时候，是核武器拯救了轴心国；要是俄罗斯得以统一，核武器也会是最后一道防线。我们为什么要接受将其拆除的提议？\n\n但也许，这个提议也能带来好处。我们从未有过动用核武库的意图，但却在为此而花费大笔大笔的财富，本可以支撑起德国和各专员辖区的资金统统都被吸进了核武库。更令人担忧的是，我国的一部分核武库还掌握在东方殖民地的各个军队领导人手中，如果政府和军方之间关系失和，这可能会导致灾难性的后果。或许相互裁军能够拯救德国。\n\n我们要去参加谈判吗？"
 glenn.nuclear.5.a:0 "去。"
 glenn.nuclear.5.b:0 "不去。"
 glenn.nuclear.6.t:0 "该死的拒绝"
 glenn.nuclear.6.desc:0 "现在格伦满脸尴尬。他们甚至还没有就位，谈判就被德国人搞黄了。真不幸，能省下的钱本来能用在NASA身上的！"
 glenn.nuclear.6.a:0 "真操蛋！"
 glenn.nuclear.7.t:0 "创造历史"
 glenn.nuclear.7.desc:0 "德国人和日本人看来很是识大体、顾大局！他们的代表团已经在去[USA.GetNuclearPickedCity]的路上，而我们的人也在打点行李了。这给接下来的谈判开了个好头，而鉴于我们坐拥最大的核库存，我们准备在谈判中发挥重要领导作用。\n\n现在箭已在我们的弦上，一旦到了[USA.GetNuclearPickedCity]的谈判桌上，那就不得不发了。"
 glenn.nuclear.7.a:0 "前往[USA.GetNuclearPickedCity]！"
 glenn.nuclear.8.t:0 "[Get_newspaper_header]史无前例"
 glenn.nuclear.8.desc:0 "事态的发展震撼了全世界，来自德国、日本和美国的代表团已经启程前往[USA.GetNuclearPickedCity]，开始就限制核武库规模、拆除多余核弹头的条约展开谈判。\n\n虽然这是格伦总统执政期间的长远目标之一，但几乎没人想到德日也做出了积极的回应。也许是多年以来美国核武库的迅速扩张刺激了其他大国前来参加谈判，但无论如何，历史的车轮已经开始滚动，向着一份史无前例的裁军条约前进。\n\n谈判结果还有待观察，但许多人都希望，这能够成为世界走向和平的第一步。"
 glenn.nuclear.8.a:0 "愿上帝保佑！"
 glenn.nuclear.8.b:0 "我们会小心观察事态发展。"
 glenn.nuclear.9.t:0 "提出我方论点"
 glenn.nuclear.9.desc:0 "所有人都已经抵达[USA.GetNuclearPickedCity]。德国人看起来挺精神，准备好了应对一切；日本人则显得犹豫不决，有些捉摸不住我方的意图。但至少他们都可以放心，美国作为核武库最为庞大的一方，将会在会谈中做出最大的牺牲。在向这两个前轴心国提出核裁军的开场论点方面，我们有两个主要的选择。\n\n第一个论点出于纯粹的实用主义。核武库储备正在使所有国家都陷入困境，如果我们都承认没人想要发动一次打击，那么削减维持核武库的费用就应该不费吹灰之力。这一论点将优先考虑削减反弹道导弹系统，并且限制各国的洲际弹道导弹库存。这是更为现实的目标，将会保持我国在导弹领域的优势，但只能实现非常有限的开支削减和裁军。\n\n第二个论点则更加道德、更加理想主义。我们会直截了当地告诉与会各方，决不能让国家间的战争终结人类文明。世界正处于毁灭的边缘，为了全人类的利益，我们都需要各退一步。如果成功，这将会带来大规模的裁军和同样大规模的储蓄资金；而如果失败，那就很可能会一无所获。尤其是日本，他们特别担心如果失去了核威慑，那么要怎样抵挡美国可能发动的入侵。\n\n当然，两种选择都有妥协的机会。我们应该选哪个？"
 glenn.nuclear.9.a:0 "道德的方案。"
 glenn.nuclear.9.b:0 "务实的方案。"
 glenn.nuclear.20.t:0 "美国提议全面裁军"
 glenn.nuclear.20.desc:0 "格伦总统以一个非凡的提议开启了谈判：近乎彻底的核裁军。他告诉我们，冷战的阴谋已经让全人类都置身危险之中，因此，我们需要对核战略进行彻底的修改，以此防止全球灾难的发生。如果现在不铸剑为犁，那将来的某一天，我们的子孙后代可能就会在一场核灾难中丧生。\n\n虽然如此高调的表态可能只是在跟我们讨价还价，但它也为谈判定下了十分乐观的基调。这个提议令人震惊，但同时也很诱人。如果进行裁军，那我们就能省下一大笔钱，而且还能与美国平起平坐；但另一方面，我们也会因此而失去阻止OFN部队攻击我国领土的倚仗。\n\n当然，这只是一个提议，而不是最后通牒，还有达成更有利交易的谈判余地，我们应该谨慎地决定如何回应。"
 glenn.nuclear.20.a:0 "我们再考虑一下。"
 glenn.nuclear.21.t:0 "美国提议削减核武库"
 glenn.nuclear.21.desc:0 "格伦总统以相当有分寸的提议开启了谈判：削减各国核武库。他告诉我们，在导弹方面的竞赛对所有参与者来说都是难以承受的财政压力，如果各方都缩减导弹储备，并且停止出资开发反弹道导弹技术，那我们都能将更多的资金投入到社会发展之中。\n\n虽然这只是一个温和的建议，但也存在明显的缺点。如果所有国家都缩减同样的规模的核武库，那么美国在导弹方面的差距仍然远超我国；此外，取消反弹道导弹研究也将让我们无法有效威慑其庞大的核武库。短期来看，这会带来节约和盈余，但也可能会因此而出卖长远的胜利。\n\n当然，这只是一个提议，而不是最后通牒，还有达成更有利交易的谈判余地，我们应该谨慎地决定如何回应。"
 glenn.nuclear.21.a:0 "我们再考虑一下。"
 glenn.nuclear.100.t:0 "反弹道导弹限制"
 glenn.nuclear.100.desc:0 "反弹道导弹是指在来袭的核弹头击中目标之前将其拦截并摧毁的地空导弹。它们有可能会使核导弹过时，但其维护成本也非同一般：据估计，敌人每花1美元用于核进攻，我们就得花上20美元用于核防御。宙斯、斯巴达和哨兵这些反弹道导弹系统已经花了我们一大笔钱，而像分导式多弹头这样的新兴技术还有可能会让成本成倍增加。德日两国同样也在这些方面花了很多钱，但如果能说服大家共同放弃反弹道导弹，那么我们就能将这笔雄厚的资金转而拨付到NASA预算中。\n\n我们有两个选择：提议直接禁止反弹道导弹系统，或者提出一份限制其数量的妥协协议。第一种选择需要说服德国和日本，让他们相信相较于反弹道导弹带来的那一丁点好处来说，它们的价格实在是太昂贵了。因此，签署一项反弹道导弹禁令可以立竿见影地带来巨大的财政节约，但是，对于印度和意大利等正在崛起的核大国的担忧可能会让这两个前轴心国不喜欢这桩协议。我们最好还是只提出限制反弹道导弹库存量的妥协方案，在这上面成功达成协议几乎可以说是板上钉钉。然而，若是提出这一倡议，我们仍将在反弹道导弹上花费大量的资金。\n\n我们应该提出什么样的方案？"
 glenn.nuclear.100.a:0 "反弹道导弹的价格过于高昂，提议禁用。"
 glenn.nuclear.100.b:0 "别太过火了，提议限制反弹道导弹库存就好。"
 glenn.nuclear.101.t:0 "美国提议禁用反弹道导弹"
 glenn.nuclear.101.desc:0 "格伦总统提出了惊人的倡议：完全禁止反弹道导弹系统。格伦以其成倍增长的成本和有限的实际效用为由，声称我们没有任何其他符合现实的选择，唯有在反弹道导弹技术让所有国家都破产之前将其扼杀在摇篮之中。\n\n当然，他是对的。我国每一位经济学家都同意，反弹道导弹计划就是财政的噩梦；但与此同时，将军和提督们也对这个极端的提议感到十分震惊。他们指出，有关德里政权“微笑佛陀”项目的报告显示，他们很快就会成为一个拥核国家。如果我们没有任何反弹道导弹设施，那么在印度发起核攻击时，东京就完全没有防御的能力。军方敦促我们考虑只接受有限的反弹道导弹削减，保留印度边境附近的设施。\n\n印度发动先发制人的打击无疑是极端假设的情况，但如果民族主义者真的控制了政权，他们或许有可能做出这样疯狂的事情。是要接受格伦的条件，还是提出抗议？"
 glenn.nuclear.101.a:0 "同意禁用反弹道导弹……但不适用于印度！"
 glenn.nuclear.101.b:0 "同意禁用反弹道导弹。"
 glenn.nuclear.102.t:0 "次大陆上的恐惧"
 glenn.nuclear.102.desc:0 "日本谈判代表团对我方提议的反弹道导弹禁令提出了异议。虽然他们同意反弹道导弹是财政噩梦，但他们坚持认为，为了保持对拥核印度的威慑，有必要保留一部分反弹道导弹设施。\n\n就个人而言，我们认为这样的担心有些夸张了，然而我们也不能否认，印度确实有一些行事鲁莽的家伙试图攫取德里的权力。如果这些印度教主义者真的得逞，那谁也说不准他们会为了实现“统一印度”的梦想而做出什么事情，我国情报机构一直在担心的这个“微笑佛陀”项目可能正是实现这一梦想的关键。\n\n不过，也许德国会在这个问题上支持我们？他们是欧洲的主人，在这件事情上又没什么好担心的。"
 glenn.nuclear.102.a:0 "令人担忧。"
 glenn.nuclear.103.t:0 "犹豫不决的伙伴"
 glenn.nuclear.103.desc:0 "日本谈判代表团对格伦总统提议的反弹道导弹禁令提出了异议。虽然他们同意反弹道导弹是财政噩梦，但他们坚持认为，为了保持对拥核印度的威慑，有必要保留一部分反弹道导弹设施。\n\n元首原本希望日本人不会有什么意见，因为崭新的德国经济正迫切地需要财政紧缩。然而，这份报告使军国派紧张不已。他们说，几乎可以肯定，意大利的“阿尔法”计划即将取得突破，很快就会有几十枚核弹头对准柏林。他们坚持认为，拆除我国的反弹道导弹设施就相当于牺牲全体德国人民的生命，是对德国的叛国罪。\n\n我们也许可以达成妥协，保留我国在意大利边境部署的反弹道导弹设施，但我们绝无可能在全盘支持格伦提议的同时稳住政府。这是该死的耻辱，因为我们迫切地需要削减军事预算。我们别无选择，只能支持日本对反弹道导弹禁令的妥协要求。"
 glenn.nuclear.103.a:0 "同意禁用反弹道导弹……但不适用于意大利！"
 glenn.nuclear.104.t:0 "众多的抱怨"
 glenn.nuclear.104.desc:0 "“该死！”格伦阅读着代表团发回的报告，不由得骂出了声，“我以为那些德国佬里终归还是有人会对这个问题有点儿该死的认识！”\n\n十分不幸，德国拒绝支持我国提出的反弹道导弹禁令。德国谈判代表声称，和日本一样，他们也对自己边境上正在崛起的拥核国家感到担忧。他们对削减反弹道导弹设施的妥协协议持开放态度，但坚持要保留有限的反弹道导弹储备，以便在攻击发生时用于对付意大利。我们认为，意大利入侵德国的想法无疑是荒谬的，但也许纳粹的军工业复合体仍然在左右着元首的行动。\n\n无论如何，除非我们同意妥协，否则这个提议显然就是死路一条。这并不是世界末日，我们仍然会限制反弹道导弹，但节省下来的费用会比我们希望中要少得多。"
 glenn.nuclear.104.a:0 "哦，好吧。"
 glenn.nuclear.105.t:0 "协议达成"
 glenn.nuclear.105.desc1:0 "由于德日双方的异议，希望中全面禁止反弹道导弹的目标未能达成，我们不得不签署一项妥协协议，限制但不拆除各国的反弹道导弹库存。值得庆幸的是，我们至少能够通过这次妥协在财政上赢得一定的喘息空间，但这远远低于原先的期望值。更糟糕的是，从最初的建议中退缩让我们丢了不少面子，这可能会导致更难说服其他大国进行洲际弹道导弹和潜射弹道导弹的削减。尽管如此，会谈已经促成了一项协议的签署，我们希望能取得更多的成果。"
 glenn.nuclear.105.desc2:0 "我们巧妙的谈判策略顺利带来了反弹道导弹协议上的妥协。它们可能很昂贵，但完全禁止从来都不是现实的选择。我们已经获得了德日对反弹道导弹限制条约的支持，希望随着会议继续，我们还能签署更多削减开销的协议。"
 glenn.nuclear.105.a:0 "会议继续。"
 glenn.nuclear.106.t:0 "笔尖飞舞"
 glenn.nuclear.106.desc:0 "我方谈判代表团已经接受并签署了格伦提出的反弹道导弹限制条约，这一妥协是会议的重要里程碑，为我们节省了适量的开支。\n\n这份妥协方案责成所有与会各方大幅削减其反弹道导弹储备，但允许德日分别保留其针对意大利和印度的反弹道导弹防御系统。这能够节约一些资金，同时安抚我国内部的鹰派人士：不多，但有用。\n\n预计美国还会在接下来提出关于洲际弹道导弹和潜射弹道导弹的条约，我们应该准备谨慎地应对美方提出的所有倡议。"
 glenn.nuclear.106.a:0 "会议继续。"
 glenn.nuclear.107.t:0 "再进一步"
 glenn.nuclear.107.desc:0 "格伦总统在[USA.GetNuclearPickedCity]会议中取得了令人震惊的重大胜利：全面禁止反弹道导弹及其研究。这令人难以置信，但白纸黑字的条约证明着它的真实性，从今天起，反弹道导弹将成为历史。\n\n通过禁止反弹道导弹，我们将节省下来大量的资金，它们可以很好地投入到NASA、或者医疗保健、或者NASA、或者学校、还有NASA中去。预算将会因此大为缓解，我们不仅节省了当下的开支，而且还节省了在未来用于反弹道导弹技术开发的资金。\n\n新闻界已经将其描述为一项重大成就，我们对会议的未来持乐观态度。"
 glenn.nuclear.107.a:0 "干得好，总统先生。"
 glenn.nuclear.108.t:0 "再进一步"
 glenn.nuclear.108.desc:0 "我国在[USA.GetNuclearPickedCity]会议中取得了令人震惊的重大胜利：全面禁止反弹道导弹及其研究。虽然倡议来自格伦，但我方在任何军国派提出反对意见之前迅速接受倡议无疑也是明智之举。鹰派可能会发牢骚，但大局已定，从今天起，反弹道导弹将成为历史。\n\n通过禁止反弹道导弹，我们将节省下来大量的资金。预算将会因此大为缓解，我们不仅节省了当下的开支，而且还节省了在未来用于反弹道导弹技术开发的资金，这可能是我国经济迫切需要的拯救的开端。\n\n新闻界已经将其描述为一项重大成就，我们对会议的未来持乐观态度。"
 glenn.nuclear.108.a:0 "干得好，各位谈判代表。"
 glenn.nuclear.109.t:0 "洲际弹道导弹限制条约"
 glenn.nuclear.109.desc:0 "既然反弹道导弹协议已经签署，那么现在就是时候来讨论本次会议的主要内容了：洲际弹道导弹。它是三位一体核打击能力中最重要的组成部分，现代洲际导弹能够在三十分钟内摧毁地球上任意一座城市。正如哈普·阿诺德将军在1943年的警告一样，他说：“它可能会在某一天、从某个并不太遥远的地方飞来——我们听不到它的降临，它太快了——对于这种能够爆炸的小弹头来说，一颗就能彻底毁灭华盛顿这座城市。”如果想要节省下来NASA所需的资金，我们就必须限制洲际弹道导弹，但前轴心国可不会轻易放弃。\n\n我方代表团为洲际弹道导弹协议提出了两个建议：同意报废除役一定数量的洲际弹道导弹，或者建议将其中一部分转换为花费更少的潜射弹道导弹。将其报废是最具成本效益的措施，也是干净利落地解决洲际弹道导弹军备竞赛的办法；但另一方面，如果不做出妥协，其他大国可能会对如此大规模裁军望而却步，断然拒绝我方的提议。将其转换为潜射弹道导弹的妥协方案有更大的机会获得通过，但无法像直接的裁军那样节省那么多资金。我方应该提出哪个倡议？"
 glenn.nuclear.109.a:0 "将它们改造为潜射弹道导弹！"
 glenn.nuclear.109.b:0 "销毁洲际弹道导弹！"
 glenn.nuclear.110.t:0 "改造问题"
 glenn.nuclear.110.desc:0 "既然我们已经决定提出潜射弹道导弹转换方案，那就必须决定要对多少枚洲际弹道导弹进行改造。较为合理的建议是300、200或100枚洲际弹道导弹，但我们必须记住，如果德国需要因此而新建造过多的潜艇，它们就很可能会拒绝。自从公海舰队失败后，德国海军的潜艇就一直采用后发制人的战略，他们没有足够的造船能力来维持一支庞大的潜艇舰队。如果面对不可能的提议，德国就将不得不拒绝。因此，在谈判改装洲际弹道导弹的比例时，最好牢记这一点。我们应该提出什么样的建议？"
 glenn.nuclear.110.a:0 "100枚洲际弹道导弹。"
 glenn.nuclear.110.b:0 "200枚洲际弹道导弹。"
 glenn.nuclear.110.c:0 "300枚洲际弹道导弹。"
 glenn.nuclear.111.t:0 "黄金比率"
 glenn.nuclear.111.desc:0 "在将洲际弹道导弹转换为潜射弹道导弹的提议中，我们有机会提出低于1:1的转换比率，同时要求将剩余的弹头报废除役。这将会带来一笔可观的额外资金，但我们应该谨慎行事。要求太过分可能会让日本人感到震惊，他们可能因此而拒绝过于广泛的核武库削减措施。\n\n作为旁观者，日方已经提出了一份核冻结条约。这将阻止建造新的核武器，从而将各国的核武库锁定在限制条约签署后状态。这将会结束军备竞赛，对我们来说无疑是巨大的福音，然而这也提醒着我们，要谨慎地提出导弹转换比率。我们应该倡议多少的转换比？"
 glenn.nuclear.111.a:0 "3:1。"
 glenn.nuclear.111.b:0 "2:1。"
 glenn.nuclear.111.c:0 "1:1。"
 glenn.nuclear.112.t:0 "美国提议将洲际弹道导弹转换为潜射弹道导弹"
 glenn.nuclear.112.desc:0 "美国提出了一项限制全球洲际弹道导弹武库的协议。他们的建议是，[USA.GetNumberOfConversion]要按照[USA.GetRatioOfConversion]的比例转换为潜射弹道导弹；日本人还提议进行核冻结，禁止再建造新的核武器。\n\n我们应该确保德国拥有足够的海军生产能力以适应转换所需的潜艇数量。从现实角度看，我们只能生产并维护100艘核潜艇，在同意格伦的条件之前，我们应该注意到这一点。"
 glenn.nuclear.112.a:0 "听起来还不错，我们接受！"
 glenn.nuclear.112.b:0 "我们无法建造足够的潜艇来维持我国的核武库！我们要求削减数量！"
 glenn.nuclear.113.t:0 "美国提议将洲际弹道导弹转换为潜射弹道导弹"
 glenn.nuclear.113.desc:0 "美国提出了一项限制全球洲际弹道导弹武库的协议。他们的建议是，[USA.GetNumberOfConversion]要按照[USA.GetRatioOfConversion]的比例转换为潜射弹道导弹；我方也提议进行核冻结，禁止再建造新的核武器。\n\n我们应该确保该协议签署后，我国还能留下足够的核武器，以阻止任何超级大国在未来侵略行为。如果由于协议而报废了过多的核武器，那么一旦冷战进入白热化阶段，我们就得坐以待毙。考虑到这种情况，我们应该要求1:1的转换比例，维持我国的战略威慑。"
 glenn.nuclear.113.a:0 "听起来还不错，我们接受！"
 glenn.nuclear.113.b:0 "[USA.GetRatioOfConversion]！？！格伦是在企图削弱我们，然后发动侵略！要求1:1的转换比例！"
 glenn.nuclear.114.t:0 "最后一步"
 glenn.nuclear.114.desc:0 "不幸的是，德国拒绝了现有的转换协议。他们声称，德国无法弥补为了容纳新潜射弹道导弹而所需潜艇的生产赤字，他们因此要求将转换数量减少到仅仅100枚洲际弹道导弹。由于转换比率和核冻结协议没有收到任何异议，拒绝德国的妥协无疑是疯狂的行为。我们别无选择，只能同意他们的要求，将洲际弹道导弹的转换数量限制在100枚，我们节省下来的资金也因此而大大减少。\n\n尽管如此，[USA.GetNuclearPickedCity]会议依然取得了积极的成果。我们都可以回家了，世界可以安下心来，军备竞赛终于结束了，我们希望这将能让核大国之间的关系进一步缓和，并为NASA提供更多的预算。"
 glenn.nuclear.114.a:0 "至少我们做出了努力。"
 glenn.nuclear.115.t:0 "最终结论"
 glenn.nuclear.115.descGER:0 "格伦总统明智地同意了我们减少洲际弹道导弹改装数量的要求。他为此而遗憾不已，但也相当理解我们的立场。核武库就此冻结，潜射弹道导弹转换协议的签署也令我们感到满意。\n\n德国的高级外交官们在[USA.GetNuclearPickedCity]会议中取得了关键的胜利。我们成功地削减了核武库、节省资金开支，同时还保留了威慑能力，真可以说是二者得兼。元首将对我们的努力感到非常满意，当代表团回国时，最可口的德国香槟酒正在宴会上等待着他们的到来。让我们为了世界和平、为了德国的善良，干杯！"
 glenn.nuclear.115.descJAP:0 "格伦总统已经同意了德国要求减少洲际弹道导弹改装数量的要求。我们曾试图通过改装以及报废更多的洲际弹道导弹来节约一些额外的资金，但德国坚持认为，他们无法弥补为了容纳新潜射弹道导弹而所需潜艇的生产赤字。因此，随着我方提议的核冻结生效，潜射弹道导弹转换协议已经签署，各方都很满意。\n\n帝国的高级外交官在[USA.GetNuclearPickedCity]会议中的表现令人钦佩。我们通过达成的协议节省了大量的资金，有效地结束了军备竞赛。我们期待着超级大国之间的关系能够在未来有所缓和，这将允许我们能够在可预见的未来里专注于维持共荣圈。"
 glenn.nuclear.115.a:0 "干杯，同志们！"
 glenn.nuclear.115.b:0 "干得漂亮。"
 glenn.nuclear.116.t:0 "最后一步"
 glenn.nuclear.116.desc:0 "不幸的是，日本拒绝了现有的转换协议。他们声称，报废洲际弹道导弹的比例将完全抵消其核武库，并消除日本在大国战争中的威慑力。他们要求彻底更改转换比例，支持将洲际弹道导弹1:1地转换为潜射弹道导弹。由于转换数量和核冻结协议没有收到任何异议，拒绝日本的妥协无疑是疯狂的行为。我们别无选择，只能同意他们的要求，将洲际弹道导弹对潜射弹道导弹的转换比例设定为1:1，我们节省下来的资金也因此而大大减少。\n\n尽管如此，[USA.GetNuclearPickedCity]会议依然取得了积极的成果。世界可以安下心来，军备竞赛终于结束了，我们希望这将能让核大国之间的关系进一步缓和，并为NASA提供更多的预算。"
 glenn.nuclear.116.a:0 "至少我们做出了努力。"
 glenn.nuclear.117.t:0 "最终结论"
 glenn.nuclear.117.desc:0 "这证明了我方的谈判能力，德日对我方提出的潜射导弹转换协议没有提出任何反对意见，毫不犹豫地签署了条约。\n\n这是[USA.GetNuclearPickedCity]会议取得的一场胜利。世界可以安下心来，军备竞赛终于结束了，我们希望这将能让核大国之间的关系进一步缓和，并为NASA提供更多的预算。"
 glenn.nuclear.117.a:0 "干得好，总统先生！"
 glenn.nuclear.118.t:0 "协议签署"
 glenn.nuclear.118.descGER:0 "格伦总统已经同意了日本提出的对洲际弹道导弹转换比例的调整要求。我们曾试图通过报废这些洲际弹道导弹来节约一些额外的资金，但日本坚持认为，除非执行1:1的转换比例，其他任何协议都会破坏其威慑外国侵略的能力。因此，随着的核冻结协议生效，潜射弹道导弹转换协议已经签署，各方都很满意。\n\n德国高级外交官们在[USA.GetNuclearPickedCity]会谈中的表现令人钦佩。我们通过达成的协议节省了大量的资金，有效地结束了军备竞赛。我们期待着超级大国之间的关系能够在未来有所缓和，这将允许我们专注于塑造新德国的工作。"
 glenn.nuclear.118.descJAP:0 "格伦总统明智地同意了我们调整洲际弹道导弹改装比例的要求。他为此而遗憾不已，但也相当理解我们的立场。核武库就此冻结，潜射弹道导弹转换协议的签署也令我们感到满意。\n\n帝国高级外交官们在[USA.GetNuclearPickedCity]会议中取得了关键的胜利。我们成功地削减了核武库、节省资金开支，同时还保留了威慑能力，真可以说是二者得兼。天皇将对我们的努力感到非常满意，当代表团回国时，最上品的清酒正在宴会上等待着他们的到来。让我们为了世界和平、为了天皇陛下的善意，干杯！"
 glenn.nuclear.118.a:0 "干得漂亮。"
 glenn.nuclear.118.b:0 "干杯，外交官们！"
 glenn.nuclear.119.t:0 "协议签署"
 glenn.nuclear.119.descGER:0 "我方和日本都没有反对格伦总统提出的转换数量和比例，潜射导弹协议已经顺利签署。伴随着核冻结落地，潜射弹道导弹的转换交易签署，各方都很满意。\n\n德国高级外交官们在[USA.GetNuclearPickedCity]会谈中的表现令人钦佩。我们通过达成的协议节省了大量的资金，并有效地结束了军备竞赛。我们期待着超级大国之间的关系能够在未来有所缓和，这将允许我们专注于塑造新德国的工作。"
 glenn.nuclear.119.descJAP:0 "我方和德国都没有反对格伦总统提出的转换数量和比例，潜射导弹协议已经顺利签署。伴随着核冻结落地，潜射弹道导弹的转换交易签署，各方都很满意。\n\n帝国高级外交官们在[USA.GetNuclearPickedCity]会谈中的表现令人钦佩。我们通过达成的协议节省了大量的资金，并有效地结束了军备竞赛。我们期待着超级大国之间的关系能够在未来有所缓和，这将允许我们能够在可预见的未来里专注于维持共荣圈。"
 glenn.nuclear.119.a:0 "手到擒来！"
 glenn.nuclear.119.b:0 "手到擒来！"
 glenn.nuclear.120.t:0 "确定拆解指标"
 glenn.nuclear.120.desc:0 "在决定销毁被除役的洲际弹道导弹之后，我们现在必须要决定销毁的数量，并为洲际弹道导弹的库存量设定硬性上限。我国分析师建议，每个国家的洲际弹道导弹上限应当定为500枚或1000枚。\n\n500枚显然是最理想的情况，由此削减库存而节省下来的资金将是一笔天文数字，我们能用这些钱资助所有NASA的探索任务；然而，对于前轴心国那些偏执的领导人来说，可能会很难说服他们。不可否认，如果将导弹数目上限设定为1000枚，那么达成协议的可能性会更大，但省下来的钱也会少得多。\n\n选择权在您的手中，我们应该提出哪个方案？"
 glenn.nuclear.120.a:0 "1000枚洲际弹道导弹。"
 glenn.nuclear.120.b:0 "500枚洲际弹道导弹。"
 glenn.nuclear.121.t:0 "中程导弹改装问题"
 glenn.nuclear.121.desc:0 "我方团队的一些成员提议，允许将这些洲际弹道导弹改装成为中程导弹，而不是直接将其报废除役。\n\n这似乎与核裁军的理想完全背道而驰，我们希望世界上的核弹头变得更少，而不是更多。更重要的是，如果保留而非报废这些核弹头，省来的钱就会少很多。但是，这也可能会让我方提出的协议不那么受其他各方的反对，我们也无疑希望迅速地结束会谈。\n\n我们是否要允许改装？"
 glenn.nuclear.121.a:0 "可以。"
 glenn.nuclear.121.b:0 "不行。"
 glenn.nuclear.122.t:0 "美国关于洲际弹道导弹的提议"
 glenn.nuclear.122.desc:0 "美国提议将各方的洲际弹道导弹库存限制在只有[USA.GetNumberICBMScrap]弹头。[USA.GetCanReduceRange]。\n\n这是一项诱人的提议，因为它将迅速结束谈判，并确保我国预算得到急需的喘息空间；另一方面，如果我国洲际弹道导弹遭到削减，那么我们可能会处于危险的境地之中。军国派会对一切库存削减大发牢骚，所以我们必须要仔细评估是否接受美国人的提议。"
 glenn.nuclear.122.a:0 "让我们考虑一下。"
 glenn.nuclear.123.t:0 "美国关于洲际弹道导弹的提议"
 glenn.nuclear.123.desc:0 "美国提议将各方的洲际弹道导弹库存限制在只有[USA.GetNumberICBMScrap]弹头。[USA.GetCanReduceRange]。\n\n这是一项诱人的提议，因为它将迅速结束谈判，并确保我国预算得到急需的喘息空间；另一方面，如果我国洲际弹道导弹遭到削减，那么我们可能会处于危险的境地之中。军国派会对一切库存削减大发牢骚，所以我们必须要仔细评估是否接受美国人的提议。"
 glenn.nuclear.123.a:0 "让我们考虑一下。"
 glenn.nuclear.124.t:0 "洲际弹道导弹协议签署"
 glenn.nuclear.124.desc:0 "真是奇迹！德日都同意了我方提出的洲际弹道导弹限制提案，团队提交了一份完整的表单，与会各方都已经签署，这是[USA.GetNuclearPickedCity]会议的惊人胜利。\n\n随着会谈的成功结束，格伦总统以英雄的姿态回到美国。他高超的外交手段让世界变得更加安全，NASA的资金偿付能力大大增强。超级大国表明，和平确实在我们的掌握之中，世界各国人民都因此而长舒了一口气。\n\n当[USA.GetNuclearPickedCity]的太阳落山时，全人类都将迎来更光明的一天，和平的钟声响彻大地。"
 glenn.nuclear.124.descOthers:0 "在没有任何反对意见的情况下，各方都同意了美国提出的洲际弹道导弹限制条约。今天上午，该条约得以签署，全世界都认为这是[USA.GetNuclearPickedCity]会议取得的惊人胜利。\n\n随着会谈成功结束，我国外交官们将以英雄的姿态回到祖国。他们高超的外交手段让世界变得更加安全，并且节省下来浪费在军工复合体上的关键资金。世界各国人民都松了一口气，因为我们各个超级大国表明，和平确实在我们的掌握之中。\n\n当[USA.GetNuclearPickedCity]的太阳落山时，全人类都将迎来更光明的一天，和平的钟声响彻大地。"
 glenn.nuclear.124.a:0 "我们做到了！"
 glenn.nuclear.124.b:0 "干得漂亮。"
 glenn.nuclear.125.t:0 "洲际弹道导弹条约达成妥协"
 glenn.nuclear.125.desc:0 "可惜，各方就洲际弹道导弹限制条约未能达成一致，致使条约最初未能通过。幸好，格伦总统得以提出妥协方案，满足了各方的需求，挽救了这份条约。今早，各方签署了洲际弹道导弹限制条约，[USA.GetNuclearPickedCity]会议在友好的氛围中闭幕。\n\n格伦总统欣慰地回到美国，毕竟这次谈判至少取得了一些成果。我们虽未能达成期望的裁军目标，但这也不失为小小的胜利。现在，总统可以专注于国内的重要事宜，比如说把人塞进火箭里，送他们离开地球之类的。\n\n"
 glenn.nuclear.125.descOthers:0 "我们的谈判员没有接受美方最初的提案。幸好，格伦总统还算讲理，答应了我方要求。就这样，我们成功签署了洲际弹道导弹限制条约，为[USA.GetNuclearPickedCity]谈判画上了句号。\n\n也许从经济角度考虑，我们应该接受更为严格的限制条款，但军方绝不会容忍这种行为，达成这份可操控性更强的协议实在是明智之举。我们出类拔萃的外交官再一次为祖国争得了荣光。"
 glenn.nuclear.125.a:0 "明智之举。"
 glenn.nuclear.125.b:0 "明智之举。"
 glenn.nuclear.126.t:0 "愿望破灭"
 glenn.nuclear.126.desc:0 "可悲的是，我方提出的洲际弹道导弹限制提案遭到了彻底的拒绝。德日都已退出会谈，全世界都认为会议已经以失败告终。\n\n格伦总统带着失败回到了国内。尽管他在反弹道导弹条约上取得了成功，但我们却仍然无法处理威胁到全人类的洲际弹道导弹这个大麻烦。雪上加霜的是，NASA依然在向我们哭诉，要求提供更多的资金，总统不得不寻求其他替代的资金来源，拯救这个他心爱的机构。\n\n随着时钟越来越接近午夜，全世界都发出了绝望的叹息。在这个令人遗憾的日子里，我们让所有人都失望了。"
 glenn.nuclear.126.descOthers:0 "傲慢的美国人这次玩过火了，格伦总统的提议过于极端，我们别无选择，只能完全退出，[USA.GetNuclearPickedCity]会议因此而草草收场。\n\n尽管格伦总统因此而狼狈不堪，但我们却止不住地感到仿佛失去了一次真正的机会。国家需要节省开支，要是我们能为和平取得重大成就，那就更好了。唉，就让美国佬来毁掉这一切吧。\n\n随着时钟越来越接近午夜，全世界都发出了绝望的叹息。在这个令人遗憾的日子里，格伦总统让所有人都失望了。"
 glenn.nuclear.126.a:0 "真难堪。"
 glenn.nuclear.126.b:0 "真难堪。"
 glenn.nuclear.200.t:0 "裁军问题"
 glenn.nuclear.200.desc:0 "我们以近乎全面裁军的提议为会谈设定了极高的目标，现在是时候谈谈具体细节了：洲际弹道导弹在军队的未来会如何？\n\n如果格伦总统如愿以偿，那它们就不会有任何未来可言。如果洲际弹道导弹的发射钮被按下，那么建造它们的目的就已经失败了。没有任何一个国家会想着在战争中使用洲际弹道导弹，所以现在是时候禁止其生产并限制库存了。格伦总统将倡议，禁止所有洲际弹道导弹的生产，并限制每个国家拥有的洲际弹道导弹数目都不超过25枚。对于一个象征性的核武库来说，这已经足够了，就算它们全部都发射出去，也远远无法让人类就此灭亡。\n\n我们将把这份详细的提议发送给其他各方，等待他们的回应。"
 glenn.nuclear.200.a:0 "目标得定得高些，奖赏才足够丰厚。"
 glenn.nuclear.201.t:0 "美国提议裁军"
 glenn.nuclear.201.desc:0 "美方给我们送来了一份惊人的提议，他们希望将每个国家的洲际弹道导弹数量都被限定在25枚以内，数目少得令人震惊。他们说，这会使全世界的洲际弹道导弹总库存量降至仅仅75枚，足以在第三次世界大战爆发时避免全球灾难的发生。\n\n这份提议对我们来说可能相当危险。如果我们接受，就将会失去最大的军事力量之一，帝国陆军和帝国海军也会感到恐慌。这会是美国入侵的借口吗？他们从未原谅过我们夺取夏威夷和条约港的行为，至今仍然坚持对这些土地的声索。他们可能只是在削弱我们，在我们最没有准备的时候发动攻击！\n\n另一方面，美国拥有最大规模的核武库，因此，他们在其中遭受的损失比我们要大得多。自第二次世界大战结束以来，他们也一直都在回避直接战争。或许这能为我国经济带来迫切需要的节流，我们要如何应对？"
 glenn.nuclear.201.a:0 "听起来是个公平的提议。"
 glenn.nuclear.201.b:0 "你就是想发动侵略！我们要求妥协！"
 glenn.nuclear.202.t:0 "美国提议裁军"
 glenn.nuclear.202.desc:0 "美方给我们送来了一份惊人的提议，他们希望将每个国家的洲际弹道导弹数量都被限定在25枚以内，数目少得令人震惊。他们说，这会使全世界的洲际弹道导弹总库存量降至仅仅75枚，足以在第三次世界大战爆发时避免全球灾难的发生。\n\n这份提议对我们来说可能相当危险。如果我们接受，就将会失去最大的军事力量之一，舍尔纳将会大喊大叫，说这是血淋淋的谋杀。这可能是美国入侵的借口吗？不太可能，但更重要的是，这会让我们失去针对俄罗斯侵略的重大威慑能力。如果俄罗斯前线的局势变得无法维持，25枚核弹头可完全不足以阻止他们的入侵。\n\n另一方面，我国军队仍然是欧洲最强大的军队，我们过去曾经在没有动用核武器的前提下赢得过两场对俄罗斯人的战争，那我们当然也能再次击败俄国人，是吧？话又说回来，美国拥有最大规模的核武库，因此，他们在其中遭受的损失比我们要大得多。或许这能为我国经济带来迫切需要的节流，我们要如何应对？"
 glenn.nuclear.202.a:0 "我们击败过俄国佬两次，没什么好怕的！"
 glenn.nuclear.202.b:0 "这太冒险了，要求妥协。"
 glenn.nuclear.203.t:0 "不合理的恐惧"
 glenn.nuclear.203.desc:0 "在听取完我们的意见后，日方对洲际弹道导弹限制提出了异议。他们断言，如此大幅度的军备削减只是美国入侵的借口，将会终结他们对我国前太平洋领土的主权，因此，日方要求增加100枚洲际弹道导弹的限制，否则就退出协议。\n\n日本这种含沙射影让我们又笑又怒。我们正是要防止世界大战的爆发！我们为什么还要打仗？就为了夺回那些甚至都不靠近赤道的岛屿？难道NASA还要在那儿那里发射火箭？真是荒唐。\n\n话虽如此，可我们或许也应该默许他们的要求。尽管日本的说法很荒谬，但我们需要让这份协议取得成功。哪怕没法像希望之中省下来那么多钱，但省下来的每一点都能派上用场。我们可以尝试向日本保证美国不会入侵，但也许接受日方的提议是更好的解决办法。"
 glenn.nuclear.203.a:0 "向日本保证，我们不会入侵。"
 glenn.nuclear.203.b:0 "同意他们的要求。"
 glenn.nuclear.204.t:0 "俄罗斯的“威胁”"
 glenn.nuclear.204.desc:0 "德国对我们提出的洲际弹道导弹限制提案提出了异议。虽然对限制其库存持开放态度，但他们认为，25枚的数字对他们的防御需求来说实在是太少了。德国声称，他们需要更大的核武库，以阻止俄罗斯复仇主义者的侵略，因此，他们希望得到保留100枚洲际弹道导弹的许可，否则就不谈了。\n\n虽然我们私下里认为，对俄罗斯人更有力的威慑就是停止压迫、离开莫斯科，但我们很难把这样的观点当面告诉德国人。如果同意的话，对他们的限制就将比我们希望中要小得多，世界仍然会处于危险之中；此外，同意给他们开特例肯定也会让日本有样学样，要求特殊对待。但是如果我们拒绝，那么协议就会全盘失败。或许应该接受，挽回我们能取得的成果？"
 glenn.nuclear.204.a:0 "给德国开个特例。"
 glenn.nuclear.204.b:0 "坚持我们的立场。"
 glenn.nuclear.205.t:0 "特例"
 glenn.nuclear.205.desc:0 "那些狡猾的德国佬设法说服格伦在洲际弹道导弹限制上给予了他们一定的豁免，表面原因是为了让德国对俄罗斯人维持威慑能力。这对我们来说似乎不太公平，共荣圈也与古老的俄罗斯土地接壤，而且我们也害怕美国可能的复仇。美国佬很可能只是在利用这个提议来削弱我们，以便对夏威夷和条约港发动攻击！\n\n如果德国得到了特殊对待，那我们也要有。日本也将提出要求，保留拥有100枚洲际弹道导弹的权利，以此保护我们免受边境上的强盗和美国人的侵害。如果美国拒绝，那我们就打道回府。格伦别无选择，只能接受。"
 glenn.nuclear.205.a:0 "我们要主张自己的权利！"
 glenn.nuclear.206.t:0 "直截了当的拒绝"
 glenn.nuclear.206.desc:0 "日本对我们的倡议提出了异议。鉴于我们为德国开了特例，增加其核武库限额，日本也因此而要求为他们也增加限额。日本声称，他们需要更多的核弹来防范共荣圈边界的强盗，并且确保夏威夷和条约港的“完整性”。\n\n既然我们已经同意了对德国的豁免，那么拒绝这个要求就是不可接受而荒谬的。我们没有选择，只能同意他们的要求。"
 glenn.nuclear.206.a:0 "见鬼。"
 glenn.nuclear.207.t:0 "全面洲际弹道导弹裁军达成"
 glenn.nuclear.207.desc:0 "如同奇迹一般，我们设法说服了各个超级大国同意近乎全面的洲际弹道导弹裁军协议。在该条约签署实施后，全世界将只剩下75枚洲际弹道导弹弹头，远远不足以导致人类的毁灭！\n\n我们今天赢得了令人难以置信的胜利，全世界都对此感到震惊，没人预料到我们会取得如此丰硕的成果。世界上的核武库存将急剧下降，“超级大国相互保证毁灭”的理论即将成为历史的注脚。最重要的是，省下来的钱能够用来资助NASA，送他们直上天际！在这之后，格伦会成为全世界的英雄！\n\n议程上的最后一项就是关于限制潜射弹道导弹条约的倡议，让我们希望它也能同样地顺利。"
 glenn.nuclear.207.a:0 "时钟背朝午夜，疾驰而去。"
 glenn.nuclear.208.t:0 "全面洲际弹道导弹裁军达成"
 glenn.nuclear.208.desc:0 "美国人似乎和我们一样，对各方都想裁军而感到惊讶。不知何故，我们都同意这是最好的解决办法。在条约签署实施之后，世界上将只剩下75枚洲际弹道导弹弹头，这远远不足以摧毁人类。\n\n我们今天赢得了令人难以置信的胜利，全世界都对此感到震惊，没人预料到我们会取得如此丰硕的成果。世界上的核武库存将急剧下降，“超级大国相互保证毁灭”的理论即将成为历史的注脚。我国的核武库存相较最初而言将会少得多得多，节省下来的资金将极大促进我国经济的发展。\n\n我们正急切地等待着美方的下一项提议。"
 glenn.nuclear.208.a:0 "时钟背朝午夜，疾驰而去。"
 glenn.nuclear.209.t:0 "小规模洲际弹道导弹裁军达成"
 glenn.nuclear.209.desc:0 "由于德日的异议，我们不得在洲际弹道导弹限制协议上接受妥协。可尽管如此，我们还是成功地签署了一项洲际弹道导弹限制条约，将所有国家的洲际弹道导弹数目上限定为100枚。\n\n这结束了[USA.GetNuclearPickedCity]会议的一个重要阶段。我们向全世界表明，虽说道阻且长，但通向和平的道路依旧存在。尽管达成的限制数目比我们希望中要高不少，但至少现在还是建立起了一个限制标准。裁军工作将为我们节省下来一小笔资金，也许可以用来资助几次NASA的任务。\n\n议程上的最后一项是关于限制潜射弹道导弹条约的倡议，让我们希望它能更顺利一些。"
 glenn.nuclear.209.a:0 "末日时钟离午夜远了一格。"
 glenn.nuclear.210.t:0 "小规模洲际弹道导弹裁军达成"
 glenn.nuclear.210.desc:0 "我们在[USA.GetNuclearPickedCity]会议中取得了令人瞩目的胜利。通过艰难的谈判，我方设法裁减了洲际弹道导弹库存，同时还保留了足够的威慑能力。洲际弹道导弹限制条约已经成功签署，其中规定所有国家的洲际弹道导弹数目上限为100枚。\n\n这结束了[USA.GetNuclearPickedCity]会谈的一个重要阶段。我们向全世界表明，虽说道阻且长，但通向和平的道路依旧存在。此外，我们还彰显了自己是谈判桌上不可忽视的力量，美国人必须要退一步，满足我们的要求。\n\n我们急切地等待着美方的下一项提议。"
 glenn.nuclear.210.a:0 "末日时钟离午夜远了一格。"
 glenn.nuclear.211.t:0 "沉重的打击"
 glenn.nuclear.211.desc:0 "看来，我们在大幅度限制洲际弹道导弹上的赌博彻底失败了。各方无法达成妥协，德日双双谈判，会议一无所获。\n\n这将作为格伦政府的最大的失败之一载入史册，他灰头土脸地回到了华盛顿。NASA哭喊着要求更多的资金，而他却无法回应NASA这绝望的请求。世界和平的事业仿佛比以往任何时候都要遥远，末日时钟正离午夜越来越近。\n\n希望NASA预算里还能拿出足够的钱来造一枚火箭，带着格伦离开这个被诅咒的世界。"
 glenn.nuclear.211.a:0 "真可惜。"
 glenn.nuclear.212.t:0 "沉重的打击"
 glenn.nuclear.212.desc:0 "看来，格伦在大幅度限制洲际弹道导弹上的赌博彻底失败了。他无力达成妥协，我方因此退出谈判，而他则一无所获。\n\n这真是彻头彻尾的浪费时间，我们带着开放的心态和走向和平的意愿前来参加[USA.GetNuclearPickedCity]会议，但美国人似乎并非如此。伟大的机遇已与我们所有人擦肩而过，末日时钟正离午夜越来越近。\n\n我国的军工业复合体只会愈发壮大。"
 glenn.nuclear.212.a:0 "真可惜。"
 glenn.nuclear.220.t:0 "潜射弹道导弹问题"
 glenn.nuclear.220.desc:0 "在洲际弹道导弹限制条约成功签署之后，是时候开始最后一项议程了：潜射弹道导弹。虽然潜射弹道导弹的维护费用比洲际弹道导弹便宜，但它们依然很危险，是昂贵的大麻烦。因此，需要对这些导弹采取一些措施。\n\n我方谈判团队已经提出了两个建议：将核潜艇改装成常规潜艇，或者将核潜艇和核弹头一起除役。第二种方案能够省下更多的资金，但其他大国接受第一种方案的可能性更大一些。最好还是不要太得寸进尺，如果在潜艇报废除役问题上遭遇阻力，我们不妨做出一些妥协。\n\n我们应该作何选择？"
 glenn.nuclear.220.a:0 "销毁弹头。"
 glenn.nuclear.220.b:0 "销毁弹头，并且将潜艇报废除役。"
 glenn.nuclear.223.t:0 "最初的拒绝"
 glenn.nuclear.223.desc:0 "日本代表团对我方提出限制潜射弹道导弹的方案反应相当冷淡，他们反对的主要原因是除役如此多的核潜艇将削弱其海军力量，因此，他们要求我方也反过来，将数量相当的驱逐舰报废除役，以实现海军力量的均衡。\n\n接受他们的反对意见会使我国海军遭受重大损失，并在国内激起一些争论。但话又说回来了，我们真的不希望打仗，也许这样的妥协也能算是某种变相的好事？减少花费在驱逐舰上的资金意味着有能有更多的钱花在NASA上面！如果同意妥协，我们或许会掉些面子，但这也可能是让日本继续坐下来谈判的唯一途径。\n\n要怎么选？"
 glenn.nuclear.223.a:0 "想得美！"
 glenn.nuclear.223.b:0 "行吧，我们可以裁撤几艘驱逐舰。"
 glenn.nuclear.221.t:0 "发射失败"
 glenn.nuclear.221.desc:0 "在我方拒绝报废一部分驱逐舰之后，日本说到做到，退出了[USA.GetNuclearPickedCity]会议。而由于日本的退出，德国也认为没有理由继续留在谈判之中，同样决定就此退出。会议已经结束，我们只达成了洲际弹道导弹限制条约。\n\n虽说取得了一定的进展，但我们仍然错过了这次机会。潜射弹道导弹依旧是对人类的严重威胁，即使是洲际弹道导弹的削减也不足以彻底消除核灾难的威胁。我们必须最大化地利用得到的成果，但成果并不丰硕，希望至少NASA能用上省下来的这笔钱。"
 glenn.nuclear.221.a:0 "喜忧参半。"
 glenn.nuclear.222.t:0 "发射失败"
 glenn.nuclear.222.desc:0 "美国人把日本逼得太狠了，谈判以糟糕的方式画上了句号。美国否决了日本合理的要求，拒绝将其一部分驱逐舰报废除役以换取对潜射弹道导弹的限制，这要求对美国佬来说似乎太过分了。在日本离开后，德国也随之离开了，[USA.GetNuclearPickedCity]会议就此结束，我们只达成了洲际弹道导弹限制条约。\n\n虽说美国人确实取得了一些进展，但这仍然让我们所有人都感到失望。潜射弹道导弹依旧是对人类的严重威胁，即使是洲际弹道导弹的削减也不足以彻底消除核灾难的威胁。唉，看来美国人从来都不会放过任何一个错失机会的机会。"
 glenn.nuclear.222.a:0 "典型的美式不义。"
 glenn.nuclear.225.t:0 "弹头的命运"
 glenn.nuclear.225.desc:0 "德国与日本都同意削减潜射弹道导弹，但是应该如何处理退役的弹头呢？有两个方案摆在我们面前：既然它们的射程太短因而不足以对三个超级大国构成严重威胁，我们可以考虑将这些弹头转入预备役状态；若是秉持真诚的裁军精神，我们也可以彻底销毁这些弹头。\n\n各方更倾向于销毁它们，因为这样做较为公平，采取该方案将更有利于削减开支、缓和世界紧张度。但如果我们对于中程弹道导弹有所需求，也可以尝试着推动各方将其保留——当然，这个提议在与会的其他强权看来可能并无意义，我们需要谨慎行事。"
 glenn.nuclear.225.a:0 "保留弹头。"
 glenn.nuclear.225.b:0 "销毁弹头。"
 glenn.nuclear.226.t:0 "德国还价"
 glenn.nuclear.226.desc:0 "非常不幸，德国人拒绝了我们关于潜射弹道导弹的提议。他们坚持认为，我们在一方面为了拯救全人类而提出核裁军，另一方面却允许保留中程弹道导弹的做法是不公平的。德国人声称，将弹头与军舰一并报废才是公平且经济的选择。\n\n事已至此，拒绝这个合理的要求将显得十分愚蠢——既然如此，我们为什么不在一开始就提出这个方案呢？如果我们这样做，NASA甚至还能因此获得更多的资金！其中的道理再简单不过了。"
 glenn.nuclear.226.a:0 "我们接受你们的提议。"
 glenn.nuclear.227.t:0 "日本还价"
 glenn.nuclear.227.desc:0 "非常不幸，日本人拒绝了我们关于潜射弹道导弹的提议。他们坚持认为，我们在一方面为了拯救全人类而提出核裁军，另一方面却允许保留中程弹道导弹的做法是不公平的。日本人声称，将弹头与军舰一并报废才是公平且经济的选择。\n\n事已至此，拒绝这个合理的要求将显得十分愚蠢——既然如此，我们为什么不在一开始就提出这个方案呢？如果我们这样做，NASA甚至还能因此获得更多的资金！其中的道理再简单不过了。"
 glenn.nuclear.227.a:0 "我们接受你们的提议。"
 glenn.nuclear.228.t:0 "美国人对潜射弹道导弹问题如何答复？"
 glenn.nuclear.228.desc:0 "美国提议销毁所有潜射弹道导弹及其弹头。该提议将带来与我们之前签署的协议类似的效果，但规模相对较小，原因在于潜射弹道导弹在我国核武库中所占比例较低。既然之前已经同意了那样的协议，那我们就没有理由拒绝这一份。我们将会从中受益匪浅，现在退缩可能会招致其他两大国的国际反击。"
 glenn.nuclear.228.descObject:0 "美国提议允许所有国家在除役核潜艇后保留其潜射弹道导弹弹头，这将允许我们在削减海军能力后保留中程弹道导弹储备。\n\n虽然这些弹头能够在各自的势力范围内作为对小规模威胁的威慑，但维护这些弹头将相当昂贵。美国人可能声称要把人类从核毁灭中拯救出来，这是个崇高的目标，但我们也必须节省自己的预算。他们想保留核弹头，将其变成中程弹道导弹，这可真是虚伪。或许为了公平和财政节流，我们应该要求把弹头也销毁掉。彻底除役潜射弹道导弹将减少我国的核武库库存，并且降低其维护成本，但同时销毁弹头能够在这两个方面发挥更大的作用。"
 glenn.nuclear.228.a:0 "听起来很公平。"
 glenn.nuclear.228.b:0 "把弹头也销毁掉！"
 glenn.nuclear.231.t:0 "成功起飞"
 glenn.nuclear.231.desc:0 "经过漫长的谈判，德日双方都同意了我方提出的潜射弹道导弹倡议。就在今天，[USA.GetNuclearPickedCity]会议签署了的第二份、也是最后一份主要条约，我们终于可以自信地说，会议已经成功圆满结束。\n\n随着会议结束，我们终于能够带着成功载誉归国。NASA将因得到大笔拨款而欢欣鼓舞，世界也会长舒一口气，对超级大国之间爆发战争的恐惧已经大为减退。格伦总统作为英雄回到美国，媒体对他的外交手腕大加赞赏。\n\n意大利以及勃艮第这样正在崛起的核大国仍然值得担心，但至少现在，三巨头走上了和平的道路。"
 glenn.nuclear.231.a:0 "对全世界都堪称伟大的一天。"
 glenn.nuclear.232.t:0 "成功起飞"
 glenn.nuclear.232.desc:0 "经过漫长的谈判，与会各方都同意了美国提出的潜射弹道导弹倡议。就在今天，[USA.GetNuclearPickedCity]会议签署了的第二份、也是最后一份主要条约，我们终于可以自信地说，会议已经成功圆满结束。\n\n随着会议结束，我们终于能够带着成功载誉归国。省下的开支将会使我国的经济增长从中受益，世界也会长舒一口气，对超级大国之间爆发战争的恐惧已经大为减退。国内媒体对我国政府的赞誉不绝于耳，这次感觉是真心实意的。\n\n意大利以及勃艮第这样正在崛起的核大国仍然值得担心，但至少现在，三巨头走上了和平的道路。"
 glenn.nuclear.232.a:0 "条约签署，我们离午夜渐行渐远。"
 glenn.nuclear.300.t:0 "“山谷”紧急计划"
 glenn.nuclear.300.desc:0 "党卫军全国领袖对今日简报会中的一份报告深感震惊。虽然曾认为[USA.GetNuclearPickedCity]会议注定要以失败告终，但我们惊讶地接到消息，三大国已经达成了初步的核裁军妥协协议。与我们之前的所有评估恰恰相反，各个超级大国似乎正在远离悬崖，而不是一步步走向深渊。无论这是出于真诚但又可悲的对和平的人道主义渴望，还是由于对其核武库的吝啬和资本主义算计，末日时钟已经开始远离午夜，逆向而行。\n\n党卫军全国领袖几乎无法抑制他对事态发展的愤怒。\n\n党卫军全国领袖迅速离开简报会、回到他的办公室，短短五分钟之后，他再次来到了会场，宣布展开代号“山谷”的紧急计划：这是一次特殊的紧急行动，意在影响[USA.GetNuclearPickedCity]会议的结果。我们将派遣一名用毕即弃的特工，以德国记者的身份作为掩护前往会议现场。他将会拿到一把枪身短小、可隐蔽携带的.22LR子弹手枪，尝试刺杀格伦总统。但我们没有告诉他的是，只要他在接受审讯前吞下氰化物胶囊，那么刺杀成功与否都不重要。我们只需要扰乱会谈，让核裁军的设想失去信誉，而一个持有德国证件的德国人试图暗杀总统这件事应该就足以达到目的。\n\n党卫军全国领袖命令所有人员在48小时内让特工部署到位，我们得开始工作了。"
 glenn.nuclear.300.a:0 "准备一架飞机，前往[USA.GetNuclearPickedCity]。"
 glenn.nuclear.301.t:0 "刺客袭击了总统！"
 glenn.nuclear.301.desc:0 "今天清晨，当格伦总统在向媒体介绍谈判进展时，一名身着灰色大衣的小个子男人从记者人群中冲出，挥舞着一把小手枪向总统开火。神奇的是，子弹仅仅擦过了格伦的外套，袭击者随即被旁边的记者迅速抓住，然后被特勤局带走审讯，总统则迅速前往安全地点，大楼也已被封锁。\n\n被羁押的男子承诺将立即写出整个阴谋的供词，他要求使用他随身的钢笔，再给他一张纸。可不幸的是，当我们在搜身后把钢笔给他时，他立刻咬住了笔尖，在身体跌落到地面之前就已经停止了呼吸。显然，这是服用氰化物自杀。\n\n该男子的身份已经得到确认，他名叫恩斯特·戈特利布，德国人。虽然他持有记者证，但他的随身文件表明他是德国国防军中的一名情报军官。\n\n我们已向德国发出紧急照会，要求其对此作出解释，在做出决定之前，会议进程已经冻结。"
 glenn.nuclear.301.a:0 "这他妈的到底是怎么回事！？！"
 glenn.nuclear.302.t:0 "刺客袭击了格伦总统！"
 glenn.nuclear.302.desc:0 "今天清晨，驻扎在[USA.GetNuclearPickedCity]会议现场的美国特勤局特工封锁了大楼，据报告称，有一名刺客企图刺杀美国总统格伦。\n\n我们还不确定发生了什么，但我们被告知，格伦总统没有受伤，并且袭击者似乎是德国人，还是德国军事情报部门的一名军官，他似乎还在审讯处吞下了预先偷偷藏在钢笔里的氰化物自杀了。\n\n与会各方都对发生的事情感到震惊，会议已经陷入僵局，直到德国给出解释。"
 glenn.nuclear.302.a:0 "棋子皆已就位。"
 glenn.nuclear.302.b:0 "究竟发生什么了！？！"
 glenn.nuclear.302.c:0 "这显然是勃艮第叛匪的阴谋，我们是无辜的！"
 glenn.nuclear.303.t:0 "德国指责勃艮第！"
 glenn.nuclear.303.desc:0 "一个小时后，德国回应了我方的最终通牒。德方宣称戈特利布的军事文件是精心伪造的，并以不向外界透露为条件，告诉我们这名刺客几乎可以肯定就是海因里希·希姆莱的勃艮第党卫军成员，其目的正是破坏[USA.GetNuclearPickedCity]谈判。\n\n德方还说，勃艮第虽然法理上是德国的一部分，但自德国内战以降，勃艮第实际上就是独立国家了。他们直言，在政变企图失败后，希姆莱就一直是德国的叛徒，被元首视做最危险的敌人。虽然他们尚不清楚为什么勃艮第想要破坏裁军谈判，但他们怀疑勃艮第想借这次伪旗攻击败坏德国的国际声誉，并在德国政府内部散播混乱，期望爆发第二次希姆莱派政变。\n\n这套关于勃艮第的说辞和阴谋论没什么两样，但除了纳粹的言语，我们也没有什么别的证据。毕竟德国行刺总统的动机说不通：三国能聚在一起谈判本身就说明德国对裁军有兴趣。而且比起希姆莱破坏论，相信德国既同意部分裁军，又想刺杀总统岂不是更可笑？\n\n决定权在您手中，总统先生。我们是应该信任德国，继续谈判，还是现在就撤出，避免更糟糕的事情发生？"
 glenn.nuclear.303.a:0 "谈判太重要了，不能放弃，继续议程吧。"
 glenn.nuclear.303.b:0 "纳粹想让我们信这些鬼话？咱们回家了！"
 glenn.nuclear.304.t:0 "德国指责勃艮第！"
 glenn.nuclear.304.desc:0 "德国对美国要求解释的照会作出了回应。他们声称，刺客随身携带的军队文件只是巧妙的伪造品，此人与合法的德国政府没有任何联系。双方均对德国称该男子效力于哪一方守口如瓶，但我国情报分析人员怀疑，德国很可能是将责任推给了希姆莱在事实上的独立王国——勃艮第党卫军骑士团国。据报道，格伦总统已经接受了德国的解释，认为其合情合理。\n\n美国人可能相信德国是清白的，但我们呢？格伦总统如此轻易地接受德国的说法令人震惊，但他也可能再次从会谈中获取最大的利益。要是再深入地想一想，我国军事顾问担心，美国领导人可能并不是首要目标。如果未来的暗杀企图针对我方，而这正是对手在我国政府内部制造混乱的阴谋呢？\n\n不过，这种说法似乎有点牵强，我方代表团中没有人报告有被当作目标的感觉。虽然我们怀疑德国人既不够聪明也不够愚蠢，会在签署最初的核裁军协议之后企图通过暗杀我国领导人的方式来破坏我国稳定。我们可以把这套理论归结为我国军方高层那臭名昭著的偏执，但违背他们的建议很可能会让他们不甚高兴……该怎么办呢？"
 glenn.nuclear.304.a:0 "如果格伦接受这个答案，那我们也接受，继续留在谈判中。"
 glenn.nuclear.304.b:0 "好啊，德国佬。我们要退出谈判！"
 glenn.nuclear.305.t:0 "[USA.GetNuclearPickedCity]会谈在混乱中结束！"
 glenn.nuclear.305.desc:0 "今天，在针对格伦总统的一次未遂刺杀的骚动之中，美国突然单方面取消了三方裁军谈判，全世界都发出了失望的叹息。格伦总统拒绝相信德国那套刺客与他们无关的说辞，已经动身返回华盛顿，德日双方也已返回柏林以及东京。\n\n虽然与会各方仍然同意遵守在会议中达成的初步协议，但这一连串事件已经破坏了未来裁军谈判的一切可能。这无疑让所有参与者感到失望，德美关系陷入了绝对的低谷。"
 glenn.nuclear.305.a:0 "末日时钟离午夜再近一格。"
 glenn.nuclear.305.b:0 "一切都在按照计划进行。"
 glenn.nuclear.306.t:0 "[USA.GetNuclearPickedCity]会谈在混乱中结束！"
 glenn.nuclear.306.desc:0 "今天，在日本退出会议的情况下，格伦总统无奈地终止了三方裁军谈判，全世界都发出了失望的叹息。日本拒绝相信德国那套刺客与他们无关的说辞，外交官已经动身返回东京，德美双方也已返回柏林以及华盛顿。\n\n虽然与会各方仍然同意遵守在会议中达成的初步协议，但这一连串事件已经破坏了未来裁军谈判的一切可能。这无疑让所有参与者感到失望，超级大国之间的关系陷入了绝对的低谷。"
 glenn.nuclear.306.a:0 "末日时钟离午夜再近一格。"
 glenn.nuclear.306.b:0 "我们的计划在最后一刻得救了。"
 glenn.nuclear.307.t:0 "[USA.GetNuclearPickedCity]谈判继续！"
 glenn.nuclear.307.desc:0 "格伦总统宣誓，任何外部破坏都不会阻碍和平进程，他宣布[USA.GetNuclearPickedCity]谈判继续进行，并且警备力量会得到增强。格伦总统坚信德国和针对他自己的未遂刺杀事件无关，同时日德也表达了继续参加裁军谈判的意愿。\n\n刺杀事件的紧张氛围终于烟消云散，让全世界松了一口气。虽然官方还未正式指控幕后真凶，但匿名消息渠道称，情报部门正在密切监控勃艮第骑士团国的活动。不论如何，即便遭受了最严重的挫折，和平也依然胜出。"
 glenn.nuclear.307.a:0 "末日时钟又从午夜退了一格。"
 glenn.nuclear.307.b:0 "党卫军全国领袖不会喜欢这样的……"
 USA_GLN_mistrusted_gov_1: "失信的政府"
