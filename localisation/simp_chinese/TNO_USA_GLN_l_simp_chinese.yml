 USA_68_Glenn_Presidency_desc:0 "在约翰·格伦的大胆领导下，共民党已从1964年的惨败中恢复过来，准备带领美国走向新时代——一个繁荣、平等、进步的时代！庆祝业已告毕，我们要任命内阁成员，为漫漫长路做好准备：为了实现目标，我们必须教导美国人太空计划的重要性，谨慎地协调资源，确保我们的地外优势。\n\n实验室和工程师已经准备就绪，准备让美国的科技优势重新凌驾于德、日两国之上。载人宇航飞行中心已经收到命令，新的发射任务已经提上日程，再过不久，美国就会重返太空，历经艰难终成大业！"
 USA_Glenn_Time_to_Clean_House_desc:0 "民众的意愿把NPP赶出了决策层，但他们的影响力尚存。NPP任命的人就像墙洞里的老鼠一样到处都是，虽然他们本意可能是好的，但对本届政府却毫无裨益。这些人要么是青涩稚嫩的年轻活动家，要么是早就该退休的老古董。\n\n首先，我们要把那些对我们事业没有兴趣的人踢出去——在我们的目标里没有他们的位置。极端派会被扫地出门，我们会恢复政府的稳定和理性，接下来，我们就可以启动总统的计划了……"
 USA_Glenn_Appease_the_Party_desc:0 "支持太空计划听上去很美妙，但执行的时候我们就得现实一些了。许多支持者怀疑我们关于NASA的计划，而且不管航空航天企业给地方带来多少就业岗位，我们都回避不了巨额开支的问题。现在的情况是，NPP中间派提倡昂贵的社会项目，NPP极右派则希望增加国防预算，我们这的民主党人建议削减预算——我们不得不拼尽全力为项目争取资金。我们应该先从提携盟友开始，把他们的人选安排上岗，这不是什么好事，但施些恩惠将来也是有回报的，民主党人也会暂时安静下来。"
 USA_Glenn_Bring_in_the_Technocrats_desc:0 "我们会尽力引入最聪慧的头脑：科学家、工程师、数学家还有各行各业的专家。他们的确没有政治关联，可这重要吗？任人唯亲和腐败可正是尼克松上台的原因，甚至差点毁了共民党。国会也许会抱怨，但安抚他们不是什么麻烦事，而我们最终也会得到全心全意支持我们的团队。对我们来说，知道怎么把事情搞定的官僚才是好官僚，而不是和地方议员眉来眼去的官僚。我们在登月竞赛上已经落后了，可不能让一些政治琐事拦住去路。"
 USA_Glenn_Crossing_The_New_Frontier_desc:0 "美国是探险者建立的国家，但却因时艰迷失了方向。为了击败罪恶的法西斯主义，我们必须向世人宣告，民主才是未来的道路——在民主制度的坚固基石上，人类才有机会触及繁星。\n\n我们的旅途不会轻松，但这便是探索的魅力所在。直到获得西班牙资助前，哥伦布的理论都无人相信，更不要提他完全不擅长航海。我们也会遇到无数质疑声音，但我们可掌握着全世界最伟大国家的聪明才智和富饶资源。格伦总统会领导美国，领导全人类，走向美丽新世界。"
 USA_Glenn_Dream_Never_Died_desc:0 "现在NASA不过是一具可悲的空壳而已，过去在太空竞赛中取得的辉煌早已不再，资金因为常年忽视十分短缺，许多设施也早已破旧不堪。德国的胜利虽然摧毁了政府继续太空竞赛的信心，但对NASA来说，一切还远没结束。那些仍在工作的雇员坚守本心，准备拼尽全力让NASA重现往日光辉。\n\n我们还没忘记纳粹是如何在62年用万字旗玷污月球的，我们也不会忘却未竟的登月梦想。是时候再次吹响追逐群星的号角了。"
 USA_Glenn_Pathway_to_the_Sky_desc:0 "要进入太空，最大的障碍不是高度，而是达到高度所需的速度。要到达更高的轨道，譬如月球轨道，需要更快的速度、更多的推进剂。无论是加速还是加推进剂，我们都要继续发展火箭技术，以恢复我们超级大国的实力与地位。太空舱是宇航员生活的中心，航电设备是引导火箭的关键，但推进系统才是那个能让火箭飞上蓝天的、最重要的部位。为了那遥远的目标，我们需要巨大的力量；要想更进一步，我们就得继续改进我们的策略与方法。"
 USA_Glenn_Stick_What_Worked_desc:0 "为了进一步推进太空事业，我们必须想尽办法确保英勇宇航员们的安全。探索者计划的开展使得我们在无人探测领域取得长足进步。在近地轨道上运行无人探测器让我们深入了解大气层外如何操作远程操作和控制飞行器，并让NASA成员能够性命无虞地测试未经验证的新型发射系统。"
 USA_Glenn_Smaller_Payloads_desc:0 "在冰冷、真空的太空中，没有犯错的余地。操作航天器的计算结果需要精确、快速地算出。即便是最微小的差错也可能导致着昂贵的火箭的损失，或者更糟的事情——任务人员的牺牲。\n\n幸运的是，我们最优秀的数学家正在开发具有开拓性的计算机来控制无人探测器，这能提高我们收集科学数据的能力，从而进一步确保我们载人任务的安全。每一个潜在的错误都必须被杜绝和消除，以使我们的计划尽可能地安全。"
 USA_Glenn_The_Boosters_desc:0 "随着我们的火箭项目持续发展，在进入下一阶段前，我们必须考虑一个最重要的问题。工作重点应放在哪种类型的推进器？是久经考验的固体燃料？还是潜力令人兴奋的液体燃料？"
 USA_Glenn_In_With_New_desc:0 "我们的计算机能以几十年前无法想象的速度进行运算，但它们有一个基本的缺陷，那就是性能再好，也要由人来操作。航天器也是如此，操纵这些复杂的机器需要对其如何运作拥有全面深入的了解。从韦伯主任到操作飞船的宇航员、再到进行地面控制的支持团队，NASA的所有人都必须要对在团队中扮演的角色熟稔于心，随时准备着完成他们的工作。机器固然能优秀地服务于我们的目的，但只有在人的指引下，它们才能抵达其他世界。"
 USA_Bigger_Is_Better_desc:0 "自1962年以来，美国人没有进入过太空，当时太空计划的资金在时任总统的抗议下被削减。无人驾驶项目的实现让我们的向最终目标进了一大步，但为了向美国人民和全人类证明自己，我们必须返回近地轨道。\n\n在埃伯哈德·克尔纳在1962年1月登上月球后，代达罗斯计划将把第一个人类进入近地轨道；这不但可以研究太空航行及其对人体对影响，而且向全世界表明，美利坚合众国已经回到了跨越最后疆域的竞赛中。"
 USA_Glenn_Solid_Fuel_desc:0 "航天是复杂的；我们引入的潜在故障点越多，故障发生的可能性就越大。固体燃料火箭的优势是可靠，好吧，固体。从中世纪出现原始固体燃料火箭以来，它一直都应用于战争。但在格伦总统的领导下，我们将把它们变成一种探索工具。这些经过时间检验的火箭拥有高度的可靠性和简易性--当你坐在一个巨大的燃料容器上，以每小时数百英里的速度飞行时，你一定会希望它尽可能地可靠。"
 USA_Glenn_Liquid_Fuel_desc:0 "液体燃料火箭完全是美国的发明——虽然纳粹的V2计划也选用了液体燃料火箭，但其发明者却是美国人罗伯特·戈达德博士，比众所周知的冯·布劳恩还要早二十年!\n\n抛开爱国情感，德国人用液体燃料火箭十分合理——因为液体具备可压缩性，其效率比固体燃料高得多，也可减轻火箭的质量。我们会用法西斯自己的办法打败他们，在液体推进剂的烈焰中飞向星空！"
 USA_Dust_Off_Plans_desc:0 "政客们不愿意投资人类的未来，这十分令人震惊：大多数人不愿为未来的潜在收益付账，宁愿为了安全而停滞不前。然而，我们的总统知道科学进步的价值，愿意在未知的领域进行大胆的跨越——并且以相应的预算为此提供支持。\n\n我们的旧基地里仍然还有各个项目的旧计划还有提案——其中就包括我国自己的登月计划以及其他雄心勃勃的项目。让工程师们去自由发挥吧，看看他们能想出来什么办法。"
 USA_Saturn_V_desc:0 "我国最优秀的科学家和工程师们重新从故纸堆里翻出了一份过去的计划，对其进行了重大修改。这枚强大的火箭是将是我们有史以来建造的最庞大的火箭，与之相配的则是高昂的价格。在太空计划结束前，美国曾经设计了土星一号IV型火箭，意图为我国的登月计划做准备；而现在，我们的新设计将带领美国宇航员前往月球和其他地方。在投产之前肯定还需要进一步的修改，但NASA往日的工作会让旅程更加轻松。"
 USA_New_NASA_desc:0 "在“输”掉了太空竞赛之后，目光短浅的前任政府将NASA的资金和人力调往了其他领域，这让它漫无目的地漂泊了数年。但我们只输了第一仗，而不是整场战争。群星中有如此多的事物等着我们去发现，去探索。我们更不应该理所应当地屈居人后。有了新预算的大笔经费，我们能够重启太空计划，突破所有界限！让我们去到那些无人踏足的地方吧！"
 USA_Siphon_Funding_desc:0 "五角大楼拥有巨大的预算，它是联邦开支中最庞大的单项。虽说时至今日，这项开支中的大部分都被用于支付士兵的工资以及维护坦克、军舰和飞机，但某些地方总是存在着一些实际上并不能在当下捍卫美国安全的东西：受到偏爱的项目、臃肿膨胀的国防合同、还有几年甚至几十年后才能实现的理论研究。如果把一部分属于这些项目资金转移给NASA，那我们就能更快地进入太空。要是有几个穿着军服、肩膀上顶着将星、可脑子里却没有足够想象力的家伙因此而大呼小叫的话，那就随他们去吧。"
 USA_Best_Brightest_desc:0 "曾几何时，申请加入NASA的人数能超出工作岗位数额足足五分之一，全美国最优秀、最聪明的人们都会兴奋地投身于太空计划之中。可现在，填补所有的岗位空缺变得相当困难，私营部门里那些个金融分析和汽车设计之类的无聊工作能赚得更多的金钱和声望。如果我们想要重回太空竞赛的行列，那就需要让他们回来。更优厚的薪水只是计划的一部分：我们要让他们乐意来到这里，带来崭新的想法、崭新的观点。他们需要明白，探索宇宙会让世界变得更加美好。"
 USA_Upgrade_Testing_Range_desc:0 "喷气推进实验室是美国太空项目这顶皇冠上的明珠。然而，由于过去几年中的预算削减和人员短缺，这里已经陷入了组织失序、士气低落的境地，但这并非是几百万美元、占地一个房间大小的全新计算机还有再涂上一层新油漆不能解决的事情。很快，年轻人们梦想着要建造未来的宇宙飞船去探索太阳系，他们想看一看，真相是否就在那里……"
 USA_Money_Never_Stops_desc:0 "NASA现在已经重回正轨，制定了一系列宏大的计划：探索太阳系中所有其他行星的探测器、火星车、地球轨道上闪闪发光的新空间站、可重复使用的航天飞机、甚至还有月面基地，而所有这些都要由更庞大、更强劲的火箭送上太空。这些项目花费不菲，预计开支高达数百亿美元。但是，为了进一步了解太空、宇宙和我们在其中的位置，并以一切可能的方式击败德国人，这只能算是小小的代价而已。或许的确是他们首先登上了月球，但美国将飞向无垠的深空、飞向更远的地方！"
 USA_Surviving_The_Cosmos_desc:0 "曾经许多次，美利坚合众国冒险越过她星球上的辽阔大地、赢得成功。然而，我们最近的旅行计划不仅仅是要穿越我们自己的世界，而是要踏足其他星球，这是美国太空计划从未面临过的挑战与艰巨困难。从未有宇航员涉足比近地轨道更高的地方，因此，我们对宇航员们在太空环境中生数天所需要面对的危险和困难还准备不足。在开始着手于飞往月球乃至火星的真正工作之前，我们必须要首先克服这些挑战，确保勇敢的太阳水手们在真正到达星空中的目的地时，还能活着。"
 USA_Board_Diagnostics_desc:0 "只有极少数人能够被选拔成为候选宇航员，而真正成为宇航员则是更为罕见、更为稀有的荣誉。简而言之，这需要卓越的天赋，同样也需要海量的训练。但随着时间推移，宇航员选拔机制的水平逐渐下降，培训已无法匹配现代太空飞行的实际需求。为了纠正这个问题，我们必须对候选宇航员实施新的培训，确保他们能够跟上NASA当下的现实需要。此外，我们也将抽调美国军队中最优秀的一批飞行员，作为下一届的NASA候选宇航员。"
 USA_Rework_Capsule_desc:0 "在美国太空旅行的新时代，摆在我国工程师们面前的是从未预料到以及计划之外的危险与挑战。目前，我国绝大多数的乘员舱都是在50年代末、60年代初设计的，因此，我们应对近地轨道之外的飞行危险的设备严重不足。例如，大多数乘员舱上都没有对接口，这意味着，如果将其用于阿波罗计划的实施，宇航员在前往月面时就不得不带着所有燃料着陆，他们在返回地球也不得不因此消耗更多的火箭推进剂。此外，目前的舱室都无法搭载超过两名宇航员，并且几乎没有装载货物的空间看，对月球登陆器来说，这是无法接受的缺陷。\n\n为了解决这些问题，必须设计全新的现代化乘员舱。这种太空舱将比之前宽敞得多，可以容纳三或四名宇航员。此外，由于前往月球或者近地轨道以外的其他地方的任务需要数天乃至数周的时间，舱室中还将包含微小但足够使用的生活区域。总的来说，虽然设计建造这种新太空舱花费不菲，但这可能就是月球之旅中最重要的那一部分。"
 USA_Pinpoint_Thrusters_desc:0 "在目前的阿波罗登月计划中，乘员舱的主体模块将会在绕月轨道上运行，由一名宇航员留守，另一个专门的着陆器则带着另外两名乘员下降到月面。月面活动结束后，登月人员将搭乘着陆器返回绕月轨道，与主体模块对接。如果NASA决定采用这个方法，那着陆器和乘员舱都需要配备更加先进的反作用力控制系统，也就是常说的“精确推进器”。\n\n在此之前，美国航天器所使用的精确推进器基本只能控制旋转运动以及微调姿态。如果要实现当下的阿波罗计划，在两个航天器之间进行对接的技术能力就是必需的，而NASA在过去执行对接任务的次数少之又少。因此，新设计的阿波罗飞船的乘员舱以及着陆器需要更先进、更精确的反作用力控制系统，其不仅应能实现航向的调整与旋转，而且还要具备遂行短距离机动以及小幅推进的能力。"
 USA_Rework_Suit_desc:0 "美国目前的航天服设计的思路基于在近地轨道零重力环境中的短途旅行，因此，它根本无法适应长途太空旅行的要求，更不用提在月面上行走了。如果我们想把宇航员送上绕月轨道，而且还要让他在那里着陆，那就必须设计两种全新的航天服。首先，我们需要一种更现代、更高效的通用航天服，供宇航员在太空中穿着。它需要相对轻便灵活，能够保障宇航员在低气压和较为温和的环境中的生存。\n\n另一种航天服就是更困难的工程挑战了，那就是舱外航天服，宇航员将凭借它执行从基本维修所需的短时太空行走、到持续数小时之久的月面漫步等等各种各样的任务。它既不能太沉重，也不能太笨拙，宇航员们必须要能够执行行走这样的基本任务，以及操纵专业工具之类的精确工作。这种舱外服将是未来美国太空探索的基石之一，没有它，我们将寸步难行。"
 USA_Improve_Insulation_desc:0 "漫无边际的太空充斥着极端的环境，其中最恶劣的莫过于温度。毕竟，真空中可没有大气层的防护，温差往往大的惊人。我们的航天器一旦暴露在阳光下，温度可能高达200华氏度，而在没有阳光的地方，温度又可能低至零下300华氏度。在前些年，我们的宇航员在太空中只需穿上厚重的增压服，而我们未来对外天空的探索需要一个新的解决方案。不能指望宇航员连续几天或几周都穿着如此笨重的设备。为了解决这个问题，我们的乘员舱必须配备现有的最佳隔热材料，这样他们就可以温差极大的外太空中存活下去。"
 USA_Glenn_The_Great_Unknown_desc:0 "谁知道这渺小的地球之外会有什么，谁知道这浩瀚的星海、无尽的太空中存在什么危险，谁知道我们踏入太空后会遭遇什么险境。如果美国太空计划中包含登月甚至登陆火星的项目，我们就必须增强系统以备不时之需。我们必须为每一种可能发生的情况做好准备，从通讯故障，到太阳耀斑，再到辐射或是舱体着火。所有潜在的问题，包括且不仅限于这些，都必须得有应对措施，所有系统都得做好备份，每个可能发生的灾难都必须有应对草案。"
 USA_Glenn_Improved_Fuel_Lines_desc:0 "燃料罐是个很简单的东西，它可能是所有太空飞行器上最简单的部件。显而易见，没有燃料，火箭就飞不起来，而为了抵达月球还有火星，火箭需要非常多的燃料。因此，我们有必要退一步，重新审视当下的燃料罐设计，调整其中某些部分，尽可能创造出优化最佳的设计。例如，先进的合金材料能使结构更加坚固，为电气元件加装鞘套和绝缘设备会让火箭更加安全。然而，最重要的依旧是重量，将一磅的有效载荷发射入轨的成本可能高达一千美元，这一点必须要纳入考量。为了保证能花更少的钱发射更多的载荷，研究用以生产燃料罐的轻便材料或许也会是值得的。"
 USA_Glenn_Upgraded_Radio_desc:0 "纵观历史，人类做出的一切伟大成就从来都不是在沉默中完成的。人类的所有创造，从吉萨大金字塔、到中国长城、再到召唤大众奔向自由的女神巨像高擎着的火炬，都是人类凭借着独一无二的交流沟通能力做出的成就。登月足以与这些由我们人类建造的恢弘壮丽的奇观相提并论，因此在沟通交流上也没有什么不同，尤其是任务进行中的通讯联系方面。为了确保在接下来的星际航行中能够时刻与宇航员保持联系，我们将会对大多数的地面信号发射站进行升级，并为乘员舱开发新式通讯系统。没有地面控制部门的帮助，宇航员什么都做不到；毕竟，从最高远的星辰到最深邃的深渊，相伴而行的旅人才能抵达最遥远的地方。"
 USA_upgrading_the_infrastructure_desc:0 "我国目前在航天方面取得的成就高于绝大多数其他国家，但我们不能因此沾沾自喜而停步不前，是时候飞得更高了。为了做到这点，我们需要进一步升级基础设施，以更好地支持NASA。更宽敞的跑道能够为安全运输火箭关键零件的专用飞机提供起降能力、经过改进的研究设施能更便捷地测试更强大的火箭引擎、提高部件制造的精度，克服迄今为止仍将我们束缚在地球之上的工程难题。"
 USA_Human_Stress_test_desc:0 "对人体来说，太空环境无疑是严苛的：零重力、高强度辐射、更不用说还有可怕的孤独感，这些都会让宇航员疲惫不堪。但抵达太空的压力甚至比这更大，发射和再入大气层期间极高的重力载荷有可能使宇航员失去知觉，导致任务彻底失败。为了抵消这些潜在影响，我们可以将高重力离心机、隔离舱室以及零重力模拟纳入训练计划，磨炼预备宇航员的能力。"
 USA_Ready_For_Anything_desc:0 "归功于新方案的实践，美利坚合众国与她的太空计划已经为远赴无垠太空的冒险做足了充分的准备。随着科技、航天器设计以及程序等诸多方面的巨大进步，似乎再也没有什么星际灾难危险重重、再也没有哪段航程遥不可及。美国、她的宇航员还有她的太空计划都清晰地明白摆在面前的巨大困难，但现在他们不需要害怕恐惧。休斯敦，请放心：不会有麻烦的。"
 USA_Stars_Beckon_desc:0 "预算削减、国会议员的质疑、纳粹登月的耻辱——我们挺过了这一切，重新夺回了太空探索领头羊的位置。NASA的辛勤工作取得了一个接一个的成功，我们必须凭借当下高涨的热情，乘着这股浪头更进一步。政府中迸发着多年来未曾有过的蓬勃活力，我们正在走向伟大的道路上砥砺前行：因为我们正伸出自己的手，去触摸那高悬苍穹的星辰宇宙。"
 USA_Lessons_of_Gemini_desc:0 "双子星座计划是我国最伟大的成功之一，它带来了首次载人航天的实践经验，格伦总统也正是搭乘着它，第一次品尝到了遨游星海的滋味。虽然这次机遇或许已经被白白浪费，但如果想要继续前进，我们就不能忘记双子星座计划的经验。在过去，我们凭借着这份计划取得了伟大的成就；而现在，我们将会百尺竿头，更进一步。"
 USA_Heartbreak_Apollo_desc:0 "约翰·格伦生命中最灰暗的一天就是德国人登月那一天。那一天带来了痛苦、折磨、还有漫长的悲伤与沮丧，这一切都让他下定决心，在星空之中争夺荣耀的竞赛里，美国绝对不会再掉队。我们不能被过去的失败所束缚——恰恰相反，我们必须从失败中汲取教训，将其化作前进的动力。"
 USA_Project_Viking_desc:0 "无人探测器不夺人眼球、不能自主思考、也不能为太空计划装点门面。然而，它具有其他数个长处，其中最重要的就是可以通过它来测试我们的系统，而不必用宇航员的生命去冒险。我们正在策划史上最为雄心勃勃的探索项目，至少得开展几次试运行，我们才能踏上这段伟大的旅程，否则就愚蠢至极。向探测器部门划拨更多资金将允许我们获得所需的数据，让着陆尽可能地安全。"
 USA_Project_Pathfinder_desc:0 "无人探测器不夺人眼球、不能自主思考、也不能为太空计划装点门面。然而，它具有其他数个长处，其中最重要的就是可以通过它来测试我们的系统，而不必用宇航员的生命去冒险。我们正在策划史上最为雄心勃勃的探索项目，至少得开展几次试运行，我们才能踏上这段伟大的旅程，否则就愚蠢至极。向探测器部门划拨更多资金将允许我们获得所需的数据，让着陆尽可能地安全。"
 USA_Project_Mariner_desc:0 "当勇敢的探险者们踏上一生的旅程时，他们绝不孤单：美国人民愤愤不平、意志消沉的时间已经太久了。格伦总统将向全国讲话，让民众知道国家需要他们。科学与进步的英雄将激励全国，人民的精神将与火箭一起，在前所未有的高度上自由翱翔。"
 USA_Project_Ares_desc:0 "时机已至。美国太空计划的王冠、人类科学技术的巅峰——阿瑞斯计划的发射已经就绪。宇航员乘组将带着所有美国人的祈祷出发，全世界的目光都聚焦于他们。我们过去已经证明了，美国能够与德国在太空探索中并驾齐驱；而现在，美利坚之鹰必将在更高更远的地方振翅翱翔。\n\n技术员、工程师、发射人员，他们倾尽自己的职业生涯为这项任务进行着计划筹备。红色星球就在我们的掌中，决不能放任它从指尖上溜走。美国的星条旗将在距离地球数百万英里的火星上高傲地飘扬，再次确立我国作为世界上最伟大的国家的地位！\n\n先生们，一路平安。倒计时开始。"
 USA_Eagle_has_Landed_desc:0 "我们成就了不可能之事，在NASA和格伦政府的不懈努力下，我们做到了。人类踏足天外世界，又成功返回地球，这在历史上还是第一次。全国陷入狂欢之中，纽约市也为阿瑞斯四号的宇航员举行了盛大的游行仪式。世界各国纷纷发来贺电，有OFN各成员国，也有日本首相。乘组人员认为自己是地球上最幸福的人，而只有白宫才知道，此时最幸福的人就坐在总统办公室，正毫不在意地听着德国元首对美国伟大世纪成就生硬的恭贺。"
 USA_Glenn_Power_of_the_Atom_desc:0 "珍珠港之殇固然惨痛，但若是因此谈“核”色变，更是因噎废食。只要加以利用，它就能在燃料断供或大断电时仍为数以百万计的美国人提供无限能源。是时候利用好原子中蕴藏的威力了，让我们尽己所能，使这把双刃剑同时惠及百姓、震慑强敌。"
 USA_Glenn_We_shall_have_it_all_desc:0 "总的来说，核技术最核心的需求就是一种自然资源：铀。这意味着要在核竞赛上胜过我们对手一筹，首先就得把遍及四海的铀矿统统夺取或收购。要是有些我们没能得到，我们的敌人也休想拿到一根毛。"
 USA_Glenn_Corner_The_Market_desc:0 "只通过限制我们的对手获取铀的途径远不足以把那些超级大国从核业务中踢出去。建造核反应堆和核武器都需要五花八门的机器和各种中间投入，这些都能在市场上买到，而且日日夜夜参与着错综复杂、变化多端的跨国贸易网络。只要我们负担得起，垄断这些市场既可以削弱敌人，又能增强我们自己的力量。"
 USA_Glenn_Yeld_Must_Grow_desc:0 "在战场上打赢敌人不足以取得战争的胜利。如果我国要想在核军备方面彻底战胜德国和日本，那么我们的核科技必须跟紧甚至超过它们。开发更强大的核武器需要我们对科学和工业基础砸入一笔更可观的投资，且这笔投资一定划算。"
 USA_Glenn_New_Delivery_System_desc:0 "建立一套研发与制造核武器的工业只是开端，我们必须不断投资与完善核武器投送系统。如果我们计划打赢一场核战争，核武库的精确度、产量与抗打击能力是存活下来的箴言。好在五角大楼已经构想出一款满足以上所有标准的新一代导弹——厄洛斯系统。"
 USA_Glenn_Increase_Payload_desc:0 "我国的核武库的有效威慑能力取决于对敌国投射原子弹的多种途径，即陆基、海基以及空基。继续发展核武器的三位一体能力将有助于说服我们的敌人，让他们对赢得同美国的核冲突不报任何希冀。同时也令他们意识到最佳的出路就是和我们上谈判桌，遵照我们提出议案。"
 USA_Glenn_Upgrade_the_Targeting_desc:0 "可能存在的圆概率偏差是一切弹道瞄准的潜在困扰。虽然有人认为，当某种武器的爆炸当量需要以兆吨级别的TNT来衡量时，精确度的重要性被高估了，但精确度始终都是评估武器系统成熟性的关键指标。能够准确命中目标的导弹越多，我们一举终结冲突的信心就越强烈。NASA已经开始利用超级计算机来计算火箭的飞行轨迹，这项工作可以被相当轻易地重新用于核战争之上。"
 USA_Glenn_Federal_Pilot_Reactors_desc:0 "尽管政治家和科学家们再三宣传核能的好处，对原子能项目的疑虑仍旧遍及全美，毕竟珍珠港核爆留下的阴影让民众良心备受煎熬。赢得人民的信心以让他们站在进步的一方需要时间和耐心，而我们将发起一个项目，在散布于全国各地的几个城市，建设由联邦投资的中试反应堆，以此来展现核能的安全性和优越性。"
 USA_Glenn_Pay_for_Conversation_desc:0 "核能带来的好处是无穷无尽的，但核能建设的起步费用同样是个天文数字。美国各州县并非都有能力负担安全、稳定的核电供应所需的开支。不过好在联邦政府可以介入其中以填补真空，这样做既能确保核领域对专业人才的稳定需求，还能顺便赢得一些选民的青睐……"
 USA_Glenn_Recruit_Disney_desc:0 "尽管我们努力试图向平民们简单地科普核能科学，但至今收效甚微。大多数美国人并不读《科学美国人》，而观众看到电视上那些搞科普的牛马的时候肯定会打着哈欠换台。手头的事实摆在那里，要在人民面前宣传一项政府工程，总是得借助有亲和力的图像。那么，在美国平民心中，还有什么事物要比米老鼠更亲切呢？"
 USA_Glenn_We_Control_The_Power_desc:0 "有人说，核武库和威慑力的价值始于国家的存续，也终于国家的存续，仅仅只意味着拥有按下一个按钮就能将全世界蒸发一百次的能力罢了。可格伦总统不这么想，原子并不是什么寻仇的可怕神明，它只是工具而已——它拥有许多的用途，比如，可以在与德国的日本的谈判中派上用场。"
 USA_Early_Warning_Station_Reykjavic_desc:0 "我们应当大胆地将核力量作为美国战略的核心，以此保护自己，防止德日解除我国核武库的图谋。早期预警和可能情况下的外科手术式打击必须是部署的核心，冰岛则是距离欧洲大陆最近的OFN领土，地理位置优越，足以建造实现这一目标所需的基地设施。我们将着手制定计划，在冰岛建立新的超视距雷达和更强大的空军基地，将这里变成针对团结协定和德国威胁的矛头。"
 USA_Nuclear_Iceland_desc:0 "夏威夷导弹危机证明了一个事实：任何大国都有可能因为直接的核威胁而坐上谈判桌。如果某个国家认为自己的后花园里冒出了新的威胁，那他们就会尽量避免末日核爆，寻求问题的解决方法。而幸运的是，美国手里正好有一个能建立这种威胁的地方——冰岛。\n\n当然，在冰岛美军部队驻扎的群岛之上，美国已经在那里部署了大量拥有核打击能力的B-58和B-52飞机枕戈待旦，但为我国的中程弹道导弹和洲际弹道导弹建造新发射井将会发出不同的讯号：轰炸机和飞行员来来去去，但发射井则是永备的。这将会提醒日耳曼尼亚，美国有能力快速、强力地展开攻击行动。这样的起手式无疑会逼迫他们坐上谈判桌，制止德国的疯狂行径。\n\n要是他们真有什么企图，那美德之间的距离将会比以往任何时候都要更接近。"
 USA_Land_Down_Under_desc:0 "澳大利亚，西太平洋最后的自由绿洲，二十多年来无时无刻不处于日本入侵的威胁之下。为了我们澳大利亚盟友的安全，是时候动真格地扩张OFN的核保护伞了。为他们修建空军基地、提供战术导弹，将使其面对强大得多的日本敌手时更占优势。"
 USA_Nuclear_Sub_Dev_desc:0 "太平洋辽阔无垠，广袤幽深——这为全新的弹道导弹潜艇提供了完美的掩护，在大洋之中默默等待着对日本进行核报复的讯息。但是，日军在从夏威夷到东印度群岛之间的水域之中巡弋，毫无疑问，他们一定会对我们无声舰队的一切入侵都保持着警惕。海面之下的军备竞赛正如火如荼，我们必须要为了胜利设计全新的潜艇……"
 USA_Speaking_Softly_desc:0 "德国和日本必须要明白，美国并没有躲藏在大西洋和太平洋的后面。美国的潜艇隐匿于在广阔的大洋之中，将核子毁灭送上敌人的家门口；如果他们设法扫清了海洋，那就会发现美国的轰炸机和导弹在他们宝贝海军的射程之外等待着发动打击；要是他们企图扭转局面，先下手为强，那美国就会知晓，将他们打得落花流水。\n\n美国能够、并且将会赢得核战争。日本和德国越早意识到这一点，就能越早意识到继续展开军备竞赛的愚蠢，走到谈判桌前寻求新的妥协。"
 USA_The_Sanctity_Of_The_OFN_desc:0 "即使是在超级大国之间的谈判中，美国也会因为OFN盟友的支持而更加强大。他们是合作伙伴——美国可不是德国那样的封建领主或者日本那种殖民暴发户——即便其他OFN国家没法坐上谈判桌，我们也应该向他们征求意见，告诉他们美国将要带领OFN前往何方，以此实现我国核外交的终极目标：如果无法实现我们时代的和平，那至少也要倚仗强大的力量实现和平。"
 USA_Readying_The_Big_Stick_desc:0 "为了防止德日误以为美国目前所有的军事态势和发展只是作秀而已，我们展开一次军演，亮出美国最新锐、最强大的军事发明以及装备，让全世界都见识见识。当然，如果这些武器真的投入了实战，那无疑会是可怕的浪费，我们希望德日和我们一样明白这个道理。"
 USA_Seven_Second_Detection_desc:0 "所有战略中都必须要囊括冗余和应急计划。要是敌人出其不意地攻克了澳大利亚和冰岛的前沿预警基站，那该怎么办？美国决不能因为依赖远方海岸上的预警系统而疏于防备。我们将在加拿大和阿拉斯加设置最后一道早期预警雷达防线；如果美国最终不得不依赖这些系统，那么展开报复性打击的行动窗口将会小之又小，但我们依旧拥有机会。"
 USA_A_Fragile_Peace_desc:0 "现在，美国拥有将敌人摧毁一千次的手段，足以摧毁他们武器库中的所有核弹头——甚至更多。我国核武库在数量以及质量上都拥有显而易见的优势，敌人要是想挑战的话，那他们绝对会自食其果。\n\n核优势在美国公众中已然成为某种信仰，因此，我们当然能展示出自己的宽宏大量。美国将会倡议召开限制战略武器谈判，希望以此说服超级大国在毁灭的悬崖边上各退一步。我们并不想要德日的吹捧与奉承，而只是希望两国代表能作为知晓事理的人坐到谈判桌前，向世界承诺：明天，太阳还是会升起来的。"
 USA_Glenn_Closing_Empathy_Deficit_desc:0 "尽管本届政府着眼于群星，但我们始终不能忘记基层社会治理的职责——我们的另一只眼应该关注美国的社会福利现状。一直以来，美国都忽视了最贫穷、最底层人民的需求。因此，我们必须迅速采取行动重振美国工人和退伍军人曾经备受打击的信心，以保障政权稳定与社会关怀。此外，既然我们能在经济安全工作上让美国公民满意，他们肯定会更愿意支持我们给NASA的投资的，对吧？\n\n尽全力改革我国养老金政策是第一要务。退休老人们曾付出的辛勤汗水常常得不到相应的回报，但政府将努力改善他们的境遇，让他们免遭亏待。"
 USA_Glenn_THe_Neediest_desc:0 "在为国家起草养老金改革法案时，政府讨论了扩大立法的可能性。我们尤其注意到美国政府及人民刚刚忽视了一大群善良却遭受折磨的人们——残疾公民。一直以来，美国残疾人都缺乏关照，以至于他们只得自己克服万难以养家糊口。政府决定通过提高残疾人及其亲属的养老金以消灭这种不公，还他们一个光明美好的生活。此外，对因保家卫国而受重伤的退伍老兵，尤其是服役于二战期间的军人们，我们也会提供额外帮扶，让他们的家庭也能得以安居乐业。对了，要是安妮看到这些，一定也会很欣慰吧？"
 USA_Glenn_THe_Downtrodden_desc:0 "内阁正应我们的要求积极地投入工作，制定这一法案，旨在弥合美国的同情心之上的每一道裂痕。随着工作的进行，社会中一直以来被历任总统所忽视的最为潦倒的民众也受到了广泛的关注。此时此刻，我们注视着饥寒交迫的人们，他们生来就一贫如洗，而无辜的他们被迫背负着这与生俱来的窘境，直到他们入土为安。出于深切的同情与尊重，我们提出的法案将呼吁扩展财政安全网络、向为贫困所苦的美国人拨款。我们将以此为武器，对日益增长的贫困问题发起一场伟大的战争，为穷人们开辟打破现状枷锁的康庄大道。"
 USA_Glenn_Pension_Security_Bill_desc:0 "在敲定对立法的修正案后，我们的政府将把投票递交给国会。虽然我们国家很多人一定会把这种议案当作是“对国库的敲诈”，我们仍会尽己所能来确保这一保障最潦倒的人民的议案顺利通过。我们是美国人，我们曾经承诺过一个自由、公正、繁荣、进步的国度，我们这项议案只愿一个伟大而宽容的社会早日到来。老人、残疾人和潦倒者和其他人别无二致，都是美国人。因此，他们理应享有一个更公平的社会；因此，他们要为自己付出的更多血汗同等地享受更多的帮扶。尽管众议院和参议院的家伙们坚信，这一议案代价过于高昂，且“总统耽于太空的痴人说梦而变得不理政事”，我们仍然要为祖国鞠躬尽瘁，死而后已。"
 USA_Glenn_Beat_Big_Pharma_desc:0 "随着医疗健康研究顺利展开，对疾病的研究已经惠及普通美国公民，使他们能在患病后得以享受简单有效的护理。然而，他们还得忍受尖端医药公司开出的高昂药价，这足以压得让已身患数疾的普通公民喘不过气来。几个公司暗中玩弄经济策略，危害着广大美国公民。不能再容忍他们为非作歹下去了！政府必须为大药厂划定严格的红线，坚决打击他们对医疗健康产业的垄断。毕竟，为了从病痛中挽救生命而生的产业，不仅负有经济上的责任，更要恪守道德。"
 USA_Glenn_Secure_Workplace_desc:0 "工人对美国经济稳定的影响力不可小觑，但在历史上大多数时候，工人们都处在水深火热中。纵观当代历史，工人在职场中一直都经受着严重的不平等。虽然工会就是为解决这种问题而生的，工作权利法却允许不参加工会的工人也可以被雇来工作。该法导致有些工人不为工会作贡献却能吃到工会带来的好处，这简直就是抱薪救火。为了解决这个问题，我们必须提出一项议案以废除罪魁祸首——工作权利法。这样一来，工人将必须加入工会，而前述问题就得以解决了。而我国工人将得以在公平、公正的职场中生活、工作，逐渐重获自信，而社会将得以继续迈向团结与繁荣。"
 USA_Glenn_Unkept_Promisse_desc:0 "在数个养老金项目改革上展开不断的斗争之后，本届政府已经在美国社会福利方面完成了强而有力的跨越。然而到目前为止的所有项目都只是针对某一个特定的群体而制定，现在是时候放宽眼界、为每一位美国公民制定社会保障计划了。这一创举的开端将始于为普通的男男女女们提供新的谋生手段，在财政恐惧和不稳定的时代中迎来崭新的信心与繁荣的浪潮。新的措施将保障美国人免遭财务失败，并且在经济衰退时提供救济，借此，许多美国人对进步的恐惧将得以平息，美国经济也将得到前所未有的扩张。是的，尽管代价是政府资金，但本届政府首先要着眼的正是关心人民、关爱人民，在艰难困苦中为他们带来幸福，难道不是吗？"
 USA_Glenn_Rally_the_Republicans_desc:0 "社会保障计划已经进入起草阶段，我们也已经针对美国公民在财务状况方面的恐惧方面取得了成功。本届政府必须要继续坚定不移地支持法案，将其中的理念传递予全体美国人民。因此，我们必须在各州凝聚支持，确保法案的成功。共民党在北部以及中西部的共和党支部对这些社会保障措施得以落地的庆祝尤为强烈，我们必须要对其加以利用，提高公众对政府的认可、表明美国人民对这个存在争议的计划抱有的信心。本党能够借此重组、巩固并扩大，为政府带来可观的民众支持，继续带领美国向着成功迈进。"
 USA_Glenn_Beat_Down_the_Dems_desc:0 "《社会保障法案》的起草过程中已经取得了相当的成功，美国人对经济和财务稳定建立起了新的信心，我国也因此能够倚仗普通公民的工作而持续发展。然而，尽管迄今为止取得的成功以及美国人民对该法案的信心令我们欣喜若狂，但许多国民仍然对联邦政府为了通过这样一项法案而支出的巨额资金感到恐惧。我们不能放任这样的恐惧与焦虑困扰美国社会，免得社会保障计划在确立成为法律之前惨遭夭折。因此，当务之急是压制共民党中的民主党一派，他们已经在南方以及其他地区表达了强烈的反对。这样做能够将美国人的恐惧扼杀在萌芽之中，本届政府亦能借此继续向美国公民伸出援手、为未来创造进步。"
 USA_Glenn_Friends_Center_desc:0 "虽然全国各地的美国人仍然在许多问题上存在分歧，通过两党共同努力赢得成功的可能性也微乎其微，但机遇仍然存在。现在是伸出双手的时候了：NPP中间派一直坚定不移地希望援助美国公民并且赋予美国工人以权力。随着《社会保障法案》的立法工作不断深入，我们必须与NPP中间派的朋友们携手合作。这不仅能够让法案的支持度更上一层楼，而且还可以打消许多美国人的恐惧，他们将见证分裂美国政治体制的两党之间展开合作，政府也将因此获得巨大的支持。本党以及NPP内部对该法案的反对声浪仍然很大，如果想要真正实现美国工人的权力，我们就必须团结起来！"
 USA_Glenn_Hammer_the_Language_desc:0 "虽然我们已经成功为《社会保障法案》组织起了相当的支持基础，但现在需要开始着手处理起草过程中下一个最为重要的部分：法案本身的条款内容。显然，该法案是美国历史上涵盖面最广泛的社会项目之一，但我们需要在其措辞和侧重点方面仔细推敲，免得它因为效率低下以及官僚主义而无法落地。法案的每个段落都必须由政府与专家共同审查，确保万无一失。此外，自该法案酝酿以来就已经引起了许多争议，特别是在NPP的右翼派别之中，因此，我们必须考虑法案真正的对手是谁、以及如何将其制定得既成功又可行。美国人长期以来因为国家而遭受着艰难困苦，我们早就该制定方案，回报他们为祖国付出的一切。"
 USA_Glenn_Stop_Southern_desc:0 "政府中的许多人都对《社会保障法案》的基本理念持支持态度；然而，恐惧仍然在公众以及政府中蔓延。说到这里，有一个十分显眼的群体可以被指认为在恐惧中推波助澜的嫌疑人：共民党内的南方民主党人仍然强烈反对该法案，甚至还放言声称其“脱离实际且支出高昂”。得给他们提个醒，共民党必须团结一致，就像共和党愿意听从民主党的要求一样，他们也得听我的们的话。因此，我们将惩罚那群试图搞垮我党成功的南方民主党人，就算他们离开会助长NPP极端派别的势力也在所不惜。美国人民正在呼唤帮助，即使民主党对这个问题颇多怨言，但伸出援手也将为共民党带来如今所需要的民众认可。"
 USA_Glenn_Social_Security_Act_desc:0 "经过政府、内阁、各领域的专家以及社会各界人士的开会讨论，《社会保障法案》的修正案终于定稿。广大的美国人因缺乏财务信心而蒙受着疾苦，唯有果断采取行动才能扭转这一局势。经过几个月的调研，格伦政府认为现在是时候将法案提交予国会表决了。美国政府的各个派别已经选边站队，决定了对该法案的态度。希望国会愿意接受这份《社会保障法案》，我们需要在失去各方支持前迅速行动。只要美国公民们因政府取得如此巨大的成功而感到自豪，我们也就能着手推动更多相关的计划，并且继续为NASA筹措资金。"
 USA_Glenn_Clean_Gov_Best_Gov_desc:0 "虽然我们已经在社会改革方面取得了长足的进步，但政府又有了新的担忧，公众对政府的意见因为它的存在而不断降低：无处不在的可耻腐败！这就是我国的政府。自尼克松以来，美国人民一直为可能爆发的公众丑闻而忧心忡忡，比如尼克松的错误所暴露出的腐败现象。雪上加霜的是，他的行为不仅波及整个联邦政府，甚至还侵蚀着共民党的稳定！美国政府中没有失败的选项，现在是时候扫清失败的阴霾了，我们要一挖到底，刨除一切残存于政府内部的腐朽。在经历国家层面的混乱之前，我们必须要努力赢得公民的信任与尊重，让人民明白，我们并不是旧时自私自利的政客，我们做的都是为了他们好。"
 USA_Glenn_Crack_Down_On_Corruption_desc:0 "尽管本届政府在为美国人民的谋福祉上已经取得了丰硕的成果，但劳动人民的成功却暴露了现行立法中完全缺乏对腐败的束缚。广大民众对政府源源不断的抱怨揭示着市场垄断的关键细节：现行立法中的税收优惠政策允许巨型企业继续壮大，最终建立起不公平的商业惯例。本届政府的目标正是消除商业中的不公竞争、摧毁国家机器中的腐败分子，毫无疑问，这种税收政策必须要废除，巨大市场中的财富统统都落进了为他们担保的两院议员的口袋里。为了美国的公正和平等，我们必须要承担起这份社会责任。"
 USA_Glenn_Empower_Senate_Ethics_Committee_desc:0 "合众国政府长久以来一直都依照人民的善意行事，但不幸的是，其内部却存在着不光荣的腐败。虽然行政部门一直都是腐败的重灾区，但我们也必须注意立法部门。美国立法机构中居然潜藏着如此肮脏的罪行，我们必须重塑其地基，确保国会中的一切腐败都能得到清理。言及于此，政府有权授权组建参议院道德委员会，这个政治机构将监督政府，处理在参众两院中发现的任何污点。贿赂和恐吓将不再会玷污我们宪政共和国的立法进程；相反，美国将继续作为强大、坚定、道德的政府施政行事，一切为美国公民着想。"
 USA_Glenn_Fight_Off_Big_Buisness_desc:0 "尽管我们已经成功找到了在未来应对美国政客腐败行径的办法，但要是就此声称这样令人厌恶的不公正已然在政府中绝迹，那也并非诚实的说法。美国人民已经对政府在过去的腐败感到厌倦，我们有责任向这群疲惫的灵魂伸出援手，为他们带来希望。因此，我们将对政府中可能出现的一切腐败迹象展开全面的调查，无论是一个、还是一百个，确保清扫每一个污点都是我们的职责所在。美国领导人过去犯下的严重过失让无数公民在腐败的重压之下受苦受难，沉溺于低级趣味的宵小飞黄腾达，诚实的众生却倒地不起，这样的不公绝不能再在我们繁荣的民主国度中重演。"
 USA_Glenn_Ban_Lobbying_desc:0 "终于，政府的铁拳砸在了游说团体的身上。万分不幸，这些个游说团体在很久以前就掌握了美国的统治权。内阁的付出了大量的工作与努力，美国领导层已经借此摆脱了束缚，能够按照自己的想法、而非游说团的意愿发号施令。现在，游说团已处于被动的防御之中，而我们已经等待了足够久的时间，将要着手开始针对他们的最后行动：彻底在美国禁止政治游说。这些游说团给美国人民带去了不公不义，腐败已经在世界上的民主国家中蔓延横行得太过分了，想想吧，它是多么地令人厌恶。我们必须要踏出最后一步，禁止游说团体将让我国领导层远离任何可能会影响施政措施的腐败行径。美国将成为更公正的社会，任何游说团体的败类都无法阻止我们。"
 USA_Glenn_Just_Restrict_Lobbying_desc:0 "立法者在过去并未对游说加以限制，他们的口袋里早已装满了希望继续扩大这种行为的政治团体的钞票。因此，本届政府不可相信任何类似的团体，正是他们，把属于美国的财富扔给了屈膝服从他们的政客。相反，我们必须开始推进立法工作，加强对政治游说的控制、限制这些团体的规模、并且取缔他们向美国领导层的政治献金。毫无疑问，为数众多的两院议员已经融入了这个过程并且从中获利，因此许多人都会基于他们的评判标准，认为我们的努力“太过于理想化”。但是，我们生活在自由民主的美国，这样的政治团体决不能玷污我国的领导层，为了他们的一己私利而篡改法律。"
 USA_Glenn_A_City_On_A_Hill_desc:0 "朗朗晴空，云淡风轻，民殷国富，政通人和。请放心吧，我们已经尽己所能，让每一位美国政治家得偿所愿，带领国家走上了康庄大道。现在，在我们的帮助下，领导人不再仰说客之鼻息，百姓也终能安居乐业。我们的社会改革已是民心所向，在我们的同力协契下，已得广厦千万间，大庇天下寒士俱欢颜。放眼寰宇，民主已被独裁与腐败所玷污，鞠躬尽瘁之后，美国依旧屹立为世间之灯塔。美国依旧美丽，美国人依旧值得我们关心。春光明媚放眼亮，策马扬鞭自奋蹄，继往开来，展望天堂。"
 glenn.1.t:0 "新名单"
 glenn.1.desc:0 "“亨特、雅各布森、杰思罗、约翰逊、贾德……”戈尔继续念道。\n\n格伦费力地听着副总统念的这一大长串名单，每个名字都是白宫西翼的一位人物，每个人都有自己的抱负和目标，有些彼此矛盾，有些甚至和我们的目标有冲突。宣誓就职没过几天，格伦就已经感受到了联邦政府工作的繁重。\n\n“拉蒙特、莱恩、朗——”戈尔继续道。\n\n“阿尔，歇歇吧，你非得累死自己不可。咱们停下来想一想，你现在才读完前十二个字母，你没明白点什么吗？”格伦问道。\n\n“我们把大部分资金都浪费在白宫补贴上了？”戈尔笑着说道。\n\n“嗯，不全错，戈尔。想一想：我们有我们自己的竞选承诺，但这些人都是上届总统任命的，要是他们继续我行我素，那肯定于咱们的目标无益。我们废了这么大劲走到这一步，可不能让这些小小障碍阻拦去路。美国人还在受苦受难，他们想要进步，阿尔，什么亨特、贾德、拉蒙特都不会助我们一臂之力的。”\n\n副总统点点头：“那你希望我怎么做，约翰？”戈尔问道。\n\n“首先，我一看见那份名单就头疼，最好把它扔了。然后，我们应该起草一份新名单，上面要有与我们梦想一致的人，希望事情有所起色的人，希望国家飞得更高的人。阿尔，我们为美国而战，要找来那些志同道合的人才行。”\n\n戈尔面露微笑，和总统握握手，然后走出房间，处理格伦的要求。"
 glenn.1.a:0 "这是我们的使命。"
 glenn.2.t:0 "格伦望向深空？"
 glenn.2.desc:0 "在竞选时，格伦总统向美国人提出了一份合理而全面的治国纲领。他许诺要团结饱受分裂之苦的国家，要拉进公民彼此的联系，要帮扶那些最需要帮助的人，要带领国家走向未来，到达全新的高度。在就任总统，治理国家相当长一段时间后，格伦总统证明了自己的能力，报告也显示本届政府正在有条不紊地推进计划，但他们是否忘记了竞选时的其他承诺呢？\n\n虽然并无官方声明，但多份白宫报告表明，政府正在持续加大对国家航空航天局的投入，最近白宫西翼的决定更是将NASA的人员扩充了近一倍，计划的资金也显著增加了。此外，不少分析家表示，国会方面也在持续关注此类事宜，近乎半数的参议院会议和听证会都和航空工业以及探索太空有关。但人们也注意到格伦政府并未向公众宣传近期活动，只有总统幕僚长霍华德·梅岑鲍姆愿意发表声明，表示：“总统许诺，他要以前所未有的策略带领美国人实现增长与繁荣，政府也在积极地为这个目标而不懈努力着。”报业正准备深入了解情况，调查事态发展。"
 glenn.2.a:0 "他们难道没有看到我们的努力吗？"
 glenn.3.t:0 "永不再败"
 glenn.3.desc:0 "一阵雷鸣般的风暴笼罩了马里兰州的夜空。巨大的闪电和隆隆的雷鸣炮涂还在肆虐，白宫上方的乌云被它占据了一席之地，而阵雨笼罩着街道，淹没了国家首都的绿植。在那儿，约翰·格伦总统睡得很香，在他整个总统任期内被称为家的黑暗房间里，被床罩和他的爱人安娜所温暖。\n\n“宇航员一号、二号和三号正在着陆。”克尔纳报告说，飞船在灰色的荒原上着陆，它们身后漂浮着那颗巨大的深蓝带绿的球体。带着由他领导的荣誉，克尔纳成了登月第一人。就这样，这个自豪的德国人轻轻飘上月球表面，他转身从登陆舱里拿出几件东西，然后向前走了几步“为了日耳曼尼亚，向着星辰与彼方。”他一边说，一边插上了装饰着黑色万字符的旗帜，它永远回望向他的母星。在那里，祖国各地数以百万计的德国人参与了记念祖国荣耀、奇迹和威严之国力的庆典。然而在大洋彼岸，在过去的几小时里，身居首都的美国人无不为这则消息所崩溃。各路男女推推搡搡，依偎在彼此的臂膀里哭泣。项目负责人们咒骂踢打，恼羞成怒，甚至要炒掉他们的工作岗位。度日如年，随着时间推移，他们的惨败带来的影响越发明显：项目被搁在黑暗房间的架子上，工人们的下班时间比他们预定的要早得多，每过一个小时就有新的预算削减的报告。泪水染脏了这个昔日辉煌的组织的傲气。\n\n“约——约——约翰，你还好吗？”安娜边说边摇晃着他的丈夫。总统从床上坐了起来，冷汗顺着他的额头流下来，灼伤了他的眼睛。他一边看着妻子担忧的表情，一边擦拭着汗水，回想着梦中所见。总统意识到发生了什么，马上做了在他心头浮上的唯一靠谱的事：他给了爱妻一个大大的拥抱。"
 glenn.3.a:0 "“我们绝不会重蹈覆辙，安妮。”"
 glenn.4.t:0 "四面皆敌"
 glenn.4.desc:0 "“先生，我们的特工指出，在太平洋的对面，日本帝国最可能部署核武器的地方是威克岛、中途岛这样的太平洋岛屿；如果在本土部署，则很可能是在钏路或者八户。”纳尔逊·洛克菲勒对格伦总统说道，后者满腹的担忧已溢于言表。“至于德国人呢，先生，他们很可能把核武器分散在国境四周以应对强敌环伺的局面。然而，我们最担忧的还是他们把核武器部署在法国傀儡境内，甚至北海边的威廉港，这样他们的打击范围就能覆盖到大西洋，还能进行海上核打击。”\n\n格伦对核竞争对手能力的忧虑一点也没有被国务卿的报告打消。多年的冷战局面并未如总统所愿，丝毫未让敌国长进哪怕一点的和平意识和“大局气概”。不过，格伦的飞行员生涯让格伦对两条经验心知肚明：第一，如果遇到危机时惊慌失措，结果只有机毁人亡；第二，枪杆子硬才是制胜法则。为使核打击这把“枪杆子”硬起来，我们已用NASA资金充分提升了所需的航空航天科技，也就是说，万事俱备，只欠核材料本身了。格伦拿起座机讲道：“女士，你好，请问能转接贾维茨吗？”\n\n那边答道：“当然，先生。我们占用的国防预算已经超出了研究项目的允许限度，不过我们绝对通融通融，把导弹供应加紧。然后说道核能……报告上说项目的预估支持力度是‘非常大’，也就是说您似乎在亲自推动这个项目。总统先生，我们该怎么走？”"
 glenn.4.a:0 "向着和平前进，秘书先生。"
 glenn.5.t:0 "庞然大物"
 glenn.5.desc:0 "“然后，总统先生，你可以在那看见一大批员工正在操作蒸汽涡轮，它的原理是吸收堆芯附近产生的蒸汽并把它转化为能源。”装置的设计师堆约翰·格伦总统说道，后者向前望去，露出了赞叹的笑容。\n\n格伦总统正欣赏着他身边的一切，美国科技的进步是多么壮美啊！这里有光彩夺目的焊接机，而那拥有不属于这个时代般的宏伟设计的汽轮机更是让总统浮想联翩。岁月如梭，格伦不禁回想起他纯真的童年时代，那是1928年，他第一次乘飞机时，他和爸爸向外俯瞰俄亥俄州秀丽的风光，他栖身力量无穷的机器之上，头顶广阔的天空触手可及，感觉自己仿佛站在小丘上极目远眺。\n\n“现在呢，就像我之前说的那样，总统先生，全德累斯顿发电站以及我本人——弗格森执行董事——衷心感谢您来访反应堆并批准它的建立，因为我们殷切期盼能为伊利诺伊州的伟大公民服务！”执行董事的话把总统从对往事的怀念中惊醒。\n\n“哦，对了，说到这个，我想提个问题：这个反应堆能够为多少人供能？”总统问道。\n\n“呃，总统先生，设施的全部潜能还有待估量；但是，我们确信，在投入使用之初，该设施能够为莫里斯的全部居民和芝加哥的大部分居民供能，也就是说，目前来看估计能达到150万户家庭！”\n\n总统被董事的陈述震撼了。归功于核能，150万户啊，150万户家庭得以安居乐业，150万户家庭得以在温暖和幸福中度日！很快，总统呆立着陷入了遐想，政府不仅提供了一种健康幸福的能源，更让全国的千家万户得以享受一种全新的生活方式，让美国向宽广的前路和进步、光荣的未来迈出新的一步，得以傲立于全球之巅，迈进新纪元的门前。\n\n“呃，总统先生，你没事吧？”弗格森董事向总统问候道——而后者正伫立窗前，沉醉地欣赏着电厂设施。"
 glenn.5.a:0 "“弗格森先生，我们还没谈过增加拨款的事吧？”"
 glenn.6.t:0 "芝加哥的闪亮明星"
 glenn.6.desc:0 "在总统办公室里，洛克菲勒和梅岑鲍姆坐在格伦总统对面，目不转睛地盯着电视机屏幕。屏幕上，则是德累斯顿发电站前熙熙攘攘的人群，他们欢呼雀跃着，挥舞着欢庆核电站落成的条幅。\n\n先前一言不发地凝视着电视机的总统突然拿起遥控器，关掉了电视，然后转过头，注视着两位下属。本来振奋人心的电视节目却被总统关掉，这一不安举动令梅岑鲍姆和洛克菲勒心惊胆战。似乎总统对节目感到惴惴不安。\n\n“总统先生，情况还好吗？”梅岑鲍姆的话终于打破了屋里可怕的宁静。\n\n格伦立即吼着回应道：“你们两个，跟我来。立刻！”\n\n两人快步跟着格伦，琢磨着为什么原本兴高采烈的总统被这么振奋人心的新闻气成这样。最终，总统领着这两人上了一辆不起眼的小车，坐上驾驶座，向马里兰州的夜晚疾驰而去。整个行程中，三人一言不发。终于，格伦把车停在了一座小山前。虽然此处伸手不见五指，但在山上远眺白宫和华盛顿的几处地表，却别有一番风味。\n\n“下车。”总统命令道。\n\n两人迅速遵命，跟着格伦上了一辆卡车。总统掀开后备箱门，一个冰柜出现在两人的眼前，总统打开冰柜，然后转向两人。\n\n“我很遗憾，”总统说，“要是我能和这一切的头号功臣你们俩一块喝酒该多好啊。可惜飞行训练让酒精对我来说味同嚼蜡。”\n\n格伦一改之前严肃的表情，露出了灿烂的笑容。本来面面相觑、担惊受怕的两个人，和格伦一起，突然爆发出震耳欲聋的笑声，为美好的夜晚欢呼、干杯。在他们头顶，是月明星稀的夜空；在他们眼前，是如梦似幻的祖国。"
 glenn.6.a:0 "“谢谢二位所做的一切。”"
 glenn.8.t:0 "原子之伟力"
 glenn.8.desc:0 "核，这是个美国政治中人人都不愿触及的字眼。一般的美国人对科学事务一窍不通，这也让政治舞台笼罩在阴云之下。珍珠港核爆和夏威夷导弹危机让人们谈核色变，在当前的环境下，我们的核计划完全就是政治自杀。\n\n但幸运的是，证据在我们这边，我们可以以自己的方式向公众展现。一名顾问正在和华特迪士尼公司商谈，希望能开始制作宣传资料，让人们了解事实真相。我们会让科学家和公关专家参与其中，尽可能确保材料的严谨性和教育性，让无论年幼还是年长的美国人都能明白我们的信息。\n\n首先我们应该决定重点是什么。我们应该瞄准鹰派，强调我们的核武库，还是谈论核能的前景？"
 glenn.8.a:0 "核威慑就是我们的第一道防线。"
 glenn.8.b:0 "核能就是未来！"
 glenn.9.t:0 "指导导演"
 glenn.9.desc:0 "“但是你看，总统先生，这正是我们所要的、能让你心满意足的东西，你看！先生，我们需要的不是大明星；大的，呃，大的影响才是我们想要的，先生！”内森·朱兰解释着，而格伦总统坐在桌后，强忍着倾听这位外国导演神经兮兮的话。“给我迪士尼那么高的预算，我们就能成就，呃，电影魔法！”朱兰说道。“不不不，很抱歉，总统先生，但朱兰先生只考虑了艺术方面，老实说，如果你想看到它大获成功，这部电影需要的可远不止几个操蛋的视觉特效，先生！”说话是斯坦利·库布里克，他坐在总统对面。\n\n两位导演还继续来来回回争论，格伦总统无奈地在椅子上往后靠来靠去，以至于椅子已经不自然了。简直是度日如年。现在的事远不同于为美国武装部队做出杀伐果断的决定——不，现在格伦要做的是在这两个白痴里挑一个人来搞关于核的电影以赢取美国人的支持。一边是朱兰，虽然他在电影情节方面并不被看好，但是既然他的电影是为了吓唬美国人以让他们相信我们需要核导弹，剧情真的重要吗？这家伙可以在电影里想出格伦闻所未闻的恐怖场面。另一边则是库布里克——这个老混账非常有名，这位导演似乎立志要做出贝多芬的《命运交响曲》那种级别的作品。他值得称道的一点是，他能拍出一部甚至能让格伦拍手叫好的精彩战争片。\n\n现在，在两人争论不休之时，是时候做出决定了——是开足马力，让朱兰吓坏美国人，还是让库布里克来打动他们？"
 glenn.9.a:0 "来，让朱兰来吧，咱们走惊悚路线。"
 glenn.9.b:0 "库布里克，给我打造一部杰作。"
 glenn.10.t:0 "原子之怖"
 glenn.10.desc:0 "“以上的描述是对未来可能发生的事情的设想。如果美国不用势均力敌的力量威慑住她的敌人的话，在你的有生之年，这样的现实可能就会降临到你面前。”\n\n“你们他妈犯什么病给我孩子放这玩意？这吓人玩意把我六岁小孩和可怜的老婆给吓哭了！谁给你们的胆子把这种狗屁给我的家人看？我要把这事捅给国会议员！”\n\n这个项目居然能得到批准，这就已经够莫名其妙了。教给小孩美国拥有强大核武装的重要性是一回事，而向他们展示他们的家园毁于一旦、核辐射与残暴的入侵者杀害他们的至亲之人的场面，则明显是另外一回事了。这部片子为什么就这么被送到试映观众面前，我们已经不得而知，但为这场重大失误，迪士尼已经解雇了好几个相关人员。\n\n至于我们的看法呢？满屋屁滚尿流的孩子和怒不可遏的家长可不好看，让这个不幸的项目尽快关门大吉恐怕才是上策。迪士尼公司已经主动提出，我们的合作已经不符合他们的最高利益，而我们的顾问也表示赞同。毕竟看了这部电影后，孩子们反倒不想让我们自己建立核武库了。"
 glenn.10.a:0 "当初是谁觉得这主意挺好的来着？"
 glenn.11.t:0 "原子之辉"
 glenn.11.desc:0 "“大家好。我是约翰·格伦，我在此是要向你们介绍我们伟大国家的核武力量，并讲讲为什么核武器是帮助我们伟大国家对抗敌人的最佳防御手段。每个爱国的美国人都应该充分了解我们军队里的这个重中之重，并明白我们如何通过维持核武器计划，带领我们的世界和全体人民迈入更光明的未来。关于这些武器，大街小巷流传着许多流言蜚语，而我则找来了一些保卫我们国家的精英人士，让这些人给你们讲讲，它们究竟是什么、它们是怎么奏效的。”\n\n我们用跟随式镜头，抓拍核轰炸机飞行、白沙试射场上的试射与潜艇在大洋中航线的画面。我们借助着迪士尼专精的技术，成功为美国威武雄壮的军队拍了一部电影，格伦总统的私人报告表明，电影刚刚上映，票就已经供不应求。在全国各地，无论是二战老兵，还是把父母兴冲冲拽来的孩子，抑或是一群群将信将疑的青年们，形形色色的人们都涌入电影院，期待着这部由美国政府亲自制作的电影的上映。随着电影胶卷滚动不休，观众的掌声和欢呼声响彻全国。\n\n电影一鸣惊人，而格伦总统也一举登上报纸头条。诚然，仍然有少数人声称电影为“军产复合体”助纣为虐，但这些反对的声音很快就被支持政府的爱国人士的滔天巨浪淹没了。"
 glenn.11.a:0 "的确又是美好的一天啊。"
 glenn.12.t:0 "吸引眼球"
 glenn.12.desc:0 "随着新能源核能的流行，我们需要教育大众核能的重要性，毕竟，接下来五十年大多数美国城市都将由核电站供电。糟糕的是，大多数人仍死死抱着化石燃料和水电不放。燃煤只会进一步损害已经十分稀薄的臭氧层，但如果我们转向核能，那对环保自然是非常有利。核能的未来光明与否就取决于我们的启动措施。\n\n产业界决定针对儿童群体开展宣传，他们可是前程似锦的一代。我们需要决定宣传的重点，保证孩子们能学到东西。比如拍摄核反应堆的影片时，我们不能拍得太无聊，让他们昏昏欲睡，但也不能只有动作，没有信息，那样就失去了教育的意义。我们是应该着重趣味性，吸引孩子的眼球，还是着重教育性，把我们的信息传达到位？"
 glenn.12.a:0 "我们需要侧重教育，让他们学到东西。"
 glenn.12.b:0 "未来题材的电影肯定精彩刺激！"
 glenn.13.t:0 "《比利与原子》失败了！"
 glenn.13.desc:0 "显然我们关于核能前景的教育电影对受众来说……有些太具“教育性”了。讲述者太过注重裂变、铀富集等过程背后的科学原理——这些东西远不是小学生能掌握理解的。结果，电影还没播完，观影者就都睡着了。\n\n不过令人惊讶的是，孩子的父母们却挺喜欢这部影片的。他们赞许地说，电影既帮他们的孩子入睡，还详细地向他们介绍了科学原理和美国能源的未来。即便我们没能向目标受众传达信息，但我们却意外地收获了一群可能会支持我们核反应堆项目的新观众。"
 glenn.13.a:0 "成年动画片，哈……"
 glenn.14.t:0 "娱乐胜过教育"
 glenn.14.desc:0 "“今夜，我们继续罗杰·卡西迪的冒险，这位勇敢的陆军大兵，在接受了秘密政府实验后，转变成了全美超级战士。卡西迪掌握放射能的伟力，他正是我们在原子时代渴望的英雄：核子队长！今晚，我们无畏的英雄会直面他的死对头沃尔夫冈·阿特玛（Atomar，德语：原子），邪恶裂变元首的阴谋诡计！”\n\n谁不喜欢爱国英雄呢？核子队长深受孩子追捧，迪士尼已经准备把影片搬到全国各地的银幕上。\n\n可惜的是，家长们对此并不买账，这部片子确实不太适合作为宣传影片。这些不满也并非毫无道理，即便是孩子们也知道，核子队长的高端政府道具和炫酷放射能力和现实一点关系没有——虽说这点让家长欣慰，但仍有许多家长抱怨影片缺乏教育意义。\n\n我们就倒霉了，孩子们可没法投票，而他们的父母对我们的态度也是不冷不热——我们不过是在帮迪士尼发大财而已。虽然迪士尼和孩子会对我们青睐有加，但却对推动核能事业毫无帮助。核子队长也许挫败了阿特玛和他破坏中子堡的邪恶法西斯阴谋，但他却拯救不了我们。"
 glenn.14.a:0 "至少赚了迪士尼的人情……对吧？"
 glenn.15.t:0 "澳大利亚的导弹发射井成功了？"
 glenn.15.desc:0 "过去几周，美国政府在澳大利亚部署核武器的事情逐渐曝光，特别是在北领地和西澳地区。与美国公众预期相反的是，澳大利亚人非常支持这次行动，澳大利亚总理称这“会促进北美和澳大利亚的安全。”大批澳大利亚少数族裔却走上街头抗议，认为在他们的土地上部署美国核导弹，只会让他们的家园变成靶子。\n\n把视角转回美国，民众的反响就没那么热情了。在全国多个主要城市，上千名抗议者呼吁撤走部署在澳大利亚的核武器。兰黛尔·弗斯伯格，一名迅速崛起的反核运动领袖说：“我不觉得部署核武器能让任何人感到安全，澳洲人不会，联邦政府不会，我们也不会。这一切不过是把我们推向新一轮的夏威夷导弹危机而已。”\n\n国防部长克拉克·克利福德和原子能委员会主席格伦·西博格驳斥了此类言论，但没有进一步解释原因。目前为止，总统也没有发表评论。在这种情况下，人们不禁会问：部署核导弹怎么就能让普通美国人感到更安心呢？"
 glenn.15.a:0 "妈的嬉皮士。"
 glenn.16.t:0 "言简意赅的政策"
 glenn.16.desc:0 "约翰·格伦在总统办公室伫立着，凝视着轻薄的玻璃窗外澄澈的蓝天，望眼欲穿。这时，传来一声敲门声。“进来吧”，格伦说。\n\n两个身穿灰衣的人踏进了椭圆办公室，一位是国防部长克拉克·克利福德，另一位则是原子能委员会主席格伦·西博格。\n\n“先生们，”总统说道，“请问有何贵干？”\n\n西博格先开口道：“我们想私下里跟您会个面，总统先生。我们觉得这场谈话最好秘密进行。”\n\n“当您刚刚登上总统宝座时，”克利福德说道，“您给了我们一个言简意赅的核武政策——继续扩张核武库，继续垄断全球铀供应，并继续破坏日德两国的核武库。”\n\n格伦抓了抓下巴：“……然后呢？”\n\n“然后，尽管斥资巨大，我们的铀采购计划进展顺利。”西博格把一个文件袋放在总统的桌子上并说道，“但是，纸毕竟包不住火嘛。”\n\n格伦在办公桌前坐下。“天价开销的计划、面临被发现的风险，还有热核灭世的微小可能……”"
 glenn.16.b:0 "“……还有什么可磨蹭的？”"
 glenn.17.t:0 "红龙行动，呈交予参谋长联席会议及总统。绝密。"
 glenn.17.desc:0 "目前，夺取非洲铀矿控制权的红龙行动已获批准，该行动制定了两项可能的执行方案。\n\n1.出动一支小规模、半伪装的部队，美国军队能以此撇清责任。参与行动的部队将主要从特种部队以及精英单位中抽调。行动小队不会悬挂美国国旗，也不会使用美军的制式武器。他们将以雇佣军的名义夺取大型铀矿，进行开采并出口，将原料运回美国。然而，如果我们的介入被暴露在公众的视线之下，这很可能会成为难以估量的丑闻。因此，不建议采取该方案。\n2.美国以恢复前OFN保护国的法律与秩序为名，正式出兵干预非洲。虽然行动会在一开始引起争议，但对中间人和保密工作的要求也更低，从长远来看，可能会更有利于我。\n\n——美国非洲司令部，诺曼·施瓦茨科普夫上将"
 glenn.17.a:0 "尽可能别闹出动静。"
 glenn.17.b:0 "保密的要求被高估了，把重炮派出去。"
 glenn.17.c:0 "南非确实应该在其中发挥自己的作用。"
 glenn.18.t:0 "红龙行动：报告节略本。绝密。"
 glenn.18.desc:0 "过去数周中，美国军队通过秘密途径以及其他渠道悄悄潜入了刚果盆地的丛林之中，占领了数处已知的铀矿藏、以及其他出产高价值矿物和资源的地区。归功于直升机以及侦察机的大量投入战斗，美军在一天之内就夺取了大多数的目标，设防更牢固的地点以及偏远地区预计也将在一周内失守。目前，美国已对欣科洛布韦（又名赫尔曼维尔）矿区建立了强固的掌控，对周边加丹加地区的控制则尚且较为松散。目前，资源开采工作正在启动，通往南非的铁路线也已开始施工，以将资源运回美国。\n\n海军陆战队第1师和第101空降师的部队将该地区的矿井作为首要目标展开了攻击行动，他们在那里遭遇了火力攻击，事后证明，作出还击的是一群德国党卫军士兵，可能是因非洲各专员辖区崩溃而留下的残部。一些军官猜测，德国人正在将铀从这处矿场运向到欧洲，但美国非洲司令部的大多数专家则持不同的意见。乘炮艇抵达的海军陆战队员以猛烈的火力打击德国人，空降兵则搭乘直升机迂回包抄，许多德国残军或死或逃。就目前掌握的情报来看，这次初步打击中，美军伤亡共40人，德军的阵亡数则超过了300人。\n\n在成功展开对欣科洛布韦的攻击后，海军陆战队在丛林中分散开来，追击撤退的党卫军人员，但没能追上他们。与此同时，101师在美国海军侦察机的协助下袭击了周围的几处村镇，其中规模最大的是利卡西（又名雅多特施塔特）。随后一周中，美军遭遇了当地军阀以及德国残余势力微不足道的反扑。截至报告发出时，美军共有104人负伤，27人阵亡；军阀和德国人的伤亡情况不详，但据推测会较先前大幅增加。\n\n美国非洲司令部，诺曼·施瓦茨科普夫上将"
 glenn.18.a:0 "好极了。"
 glenn.19.t:0 "撤离欣科洛布韦：报告节略本。机密。"
 glenn.19.desc:0 "上周，驻守于刚果盆地加丹加地区的美军出乎意料地遭受了当地军阀与前德国党卫军联合发动的攻击，联军由一个名为纳撒尼尔·姆本巴的当地叛军领袖、以及前党卫军上级突击队大队领袖（中校）海因茨·巴斯领导。这两个看似对立的团体意识到了美军确保该地区安全的计划，异常迅速地制定了应对措施，并且还结成了临时的联盟。\n\n他们集结了一支超过4000人的攻击力量，意图攻击美军位于利卡西的据点，同时对周边村镇以及至关重要的欣科洛布韦矿场展开小规模袭击。10日晚，他们开始执行进攻计划。前德国党卫军部队动用了被遗弃以及重新整修的德制轻型装甲车穿过潘达村，从南侧发动袭击；与此同时，刚果军阀以及革命分子则从东北两侧发动攻击，人手不足、毫无防备的美军阵地蒙受了猛烈的炮火。\n\n由于误判了态势的严峻程度，查尔斯·E·威尔海姆少校指挥的海军陆战第4团第2营认为他们的人数与进攻的非洲人大致相当，但双方的人数比例在实际上几乎达到了5比1。他们被包围在村镇中央，无法获得装甲以及重武器的支援。该部未能与其他各部建立无线电联系，在空中撤离无望的情况下，威尔海姆少校决定率领一个连抵挡大多数进攻部队，其余人则向河流突围，乘船撤退到下游的一处前沿作战基地。这个策略似乎奏效了，但少校和他的连队则在被俘之后遭到处决。周边各村镇中驻扎的排级部队没有上报任何情况，据推测已经失踪。总的来说，美军在这次交战中至少伤亡了400人、甚至600人。\n\n美军遭受了重大损失，我们已经不可能再继续向美国公众隐瞒这次行动。在参谋长联席会议以及总统的批准下，我强烈建议全面撤出加丹加地区以及整个刚果盆地。\n\n美国非洲司令部，诺曼·施瓦茨科普夫上将"
 glenn.19.a:0 "该死的，他说对了。下令从该地区全面撤军。"
 glenn.19.b:0 "他疯了吗？他妈的，派一整个师过去！"
 glenn.20.t:0 "重燃火焰行动：报告节略本。绝密。"
 glenn.20.desc:0 "昨日，针对几乎迫使美军放弃加丹加地区的德军以及非洲军阀，美军展开了备受期待的反击行动，夺回了利卡西城以及重要的欣科洛布韦矿场。参战部队中包括海军陆战队第1师的大部，第101空降师和美国海军第六舰队航空队提供了支援。这次攻击彻底粉碎了军阀、革命分子和海因茨·巴斯领导的党卫军之间的脆弱联盟，他们遭受了巨大伤亡，撤退回了丛林之中。\n\n攻击行动以利卡西南部的潘达村为中心，美军在近距空中支援中动用了凝固汽油弹和白磷弹，将党卫军部队赶出了其固守的阵地。而他们一被驱赶出来，第101空降师的直升机就包围并摧毁了跑路的德军部队，为陆战1师麾下各旅渡过潘达河、从南侧和西南侧向利卡西进军扫清了道路；与此同时，陆战4团第2营的余部则在第1营的增援和近空支援的协助下，从东侧向利卡西推进。非洲人似乎明白党卫军带来的破坏，仅仅只抵挡了几分钟就散开队形，向北撤退而去。\n\n尽管美军遭受了一时的挫折，但看起来许多运来的采矿设备仍然完好无损。在执行了数次搜索歼灭任务，追歼最后一群躲过潘达轰炸的党卫军之后，矿区将会准备就绪，将铀矿运回美国。\n\n美国非洲司令部，诺曼·施瓦茨科普夫上将"
 glenn.20.b:0 "逃吧，混蛋们！你山姆大叔来了！"
 glenn.21.t:0 "重燃火焰行动：报告节略本。绝密。"
 glenn.21.desc:0 "昨日，针对几乎迫使美军放弃加丹加地区的德军以及非洲军阀，美军展开了备受期待的反击行动。美军在最初夺回了似乎已被遗弃的利卡西城，但随后又在激烈的拉锯战中被反推回了丛林里。尽管陆战1师近一半的兵力都投入了进攻之中，但非洲人再次用游击战术把他们打得措手不及，装备着高效德制武器的党卫军残部也阻碍了海军陆战队的行动。\n\n事实证明，最初的攻击计划根本就没有必要，侦察显示，利卡西城已被放弃。到达这里后，海军陆战队只能见到熊熊燃烧的建筑物和埋葬着美国军人的乱葬岗。美军对此感到相当不安，而非洲人的胆子却大了起来，人数也比前一次进攻时更多。他们派出小股士兵引诱陆战队交战，陆战队则在上钩之后一路追赶着非洲人进入了丛林。在那里，他们发觉自己很快就被非洲人的数量优势所分割包围。此外，前党卫军头子海因茨·巴斯也派出了几辆装甲运兵车，陆战队几乎尽全力才将其摧毁。由于严峻的战场形势，陆战队呼叫了空中支援，但由于丛林树冠导致的低能见度，有数枚炸弹落到了美军阵地上，多人伤亡。\n\n总的来说，这次行动是彻底的失败。尽管由于缺乏信息来源，国内的反应显得有些迟钝，但仍然可以说是极端。由于预计会出现全国性的抗议和骚乱，国土安全部建议全面撤军，我也倾向于同意这一意见。美国非洲司令部军官们都很清楚无法继续在刚果获利，那里的敌人数量众多、装备精良、而且信念坚定，因此，继续在那里的展开军事行动已不再符合美国的利益。\n\n美国非洲司令部，诺曼·施瓦茨科普夫将军"
 glenn.21.a:0 "我们已经失去太多了。撤出吧。"
 glenn.22.t:0 "撤离卡波洛韦：战后报告。秘密。"
 glenn.22.desc:0 "本周，在利卡西郊外约10英里处的卡波洛韦村外，海军陆战队的一支战斗工兵连在搭建桥梁以及军事营地时遭到了某个不知名当地小军阀部队的袭击。美军认为大部分当地抵抗力量已经被摧毁，因此陆战队员在前往卡波洛韦的途中没有携带任何除了枪支之外的主战装备。\n\n刚果人倚仗着一辆缴获的德制装甲运兵车发动了攻击。由于没有携带重武器，陆战队员无法将其摧毁。这辆装甲运兵车还有几百名装备简陋的非洲民兵将陆战队赶进入了村旁茂密的丛林里，直到近空支援的抵达才阻挡了他们的前进，驱散了这群刚果人。总体而言，敌军损失了37人，工兵连则阵亡25人，另有39人受伤。\n\n虽然这不是什么大失败，伤亡也相当微小，但陆战队完全被打了个措手不及，这也是自利卡西陷落，美军在该地区的遭受的最为重大的损失。耻辱性撤退的消息已经传回了本土媒体，截至目前，公众的反应并不积极。\n\n美国非洲司令部，诺曼·施瓦茨科普夫上将"
 glenn.22.a:0 "真不走运。"
 glenn.23.t:0 "诸神之力"
 glenn.23.desc:0 "格伦总统沿着环绕新导弹发射井主体的宽阔螺旋形楼梯踏步前行。这个走廊纯粹是为了检查导弹所设，要是有人在发射时在这里，那就只能祈求上帝保佑了。无论如何，除非全面核战争爆发，否则今天是不会发射导弹的。\n\n格伦站在那里，欣赏着这个巨大无朋、由铝和钢铁制作的圆柱形弹体，其中包裹着一颗钚做成的心脏。它无疑令人敬畏，属于神明的力量就摆在他的面前，拥有彻底重塑地球面貌的伟力。然而，除非被逼到绝境，否则美国绝不会首先开火。这些导弹当然只是为了防御，是以防最坏情况发生的保险。他转过头，看向威廉·鲍夫曼——这处新设施的主管，问道：\n\n“这枚导弹的射程有多远？”\n\n“民兵三号的预计射程约为13000公里，”鲍夫曼回答道，“大概8000英里，比世界上任何其他在役的导弹都更远。”\n\n“难以置信，”总统感叹道，“而且他们甚至还不知道我们有这个。要是德国佬和小日本知道我们做的一切，他们肯定瑟瑟发抖。美国需要强大的核防御体系，我很高兴本届政府能够向它给予帮助。”"
 glenn.23.a:0 "温言在口，大棒在手。"
 glenn.24.t:0 "遮天蔽日"
 glenn.24.desc:0 "杰克坐在沙发上，拿着一瓶冰凉的苏打水，准备看上一两个小时的电视享受享受，然后再接着去屋外整理庭院。他打开电视，小小的天线捕捉着空中最强的电波。显示屏慢慢亮起，显示出了黑白的电视图像：看起来，约翰·格伦总统正在检查某个型号的轰炸机。有几架飞机在总统头顶上飞过，而他本人则正在欣赏着一架还停留在地面上的飞机。随后，总统和他的随行人员移步到了跑道的另一侧。\n\n约翰·格伦转过身来，面对着一位稍稍有点出框的记者。“那么，总统先生，您为什么认为这种新型轰炸机具有如此巨大的革命性呢？”记者用他们惯常的那种有点儿居高临下而怪异的语调提问道。\n\n“嗯，首先，它是世界上最快的轰炸机，B-1‘枪骑兵’的最高速度可以达到1.25马赫以上。你知道的，有很多人问过我，为什么我们不干脆彻底用导弹取代轰炸机。最重要的原因是，假设我们做出了错误的预警，然后派出轰炸机，那它还能再飞回来；但一旦导弹发射，它就再也没法子回来了。飞行员也拥有判断的能力，他们能够衡量目标的价值：它是否是威胁、它是否值得打击。简而言之，我认为新的B-1‘枪骑兵’将显著强化我国的三位一体核打击能力，它的确是一款优秀的新式飞机。现在让试飞员来给我们做个小表演，如何？”\n\n总统一边说着，一边转过身去，向他刚才检查的那一架轰炸机的飞行员竖起了大拇指。这架巨大喷气式飞机的引擎轰然发动，激起的气浪甚至让总统的屁股和大地来了个亲密接触，像犰狳一样向后翻着身。总统的随行人员们也差不多，他们急忙跑过去帮忙，但也都摔得人仰马翻。\n\n“嚯，好家伙，”杰克嘀咕着，“能让总统摔这么大屁股墩儿的飞机，一定他娘的很厉害。”"
 glenn.24.a:0 "别告诉我这是现场直播。"
 glenn.25.t:0 "仰望星空"
 glenn.25.desc:0 "约翰·格伦总统走进了位于得州休斯敦修葺一新的载人航天中心。在几名黑衣特勤局特工的陪同下，他走过闪闪发光的玻璃门。在那里，一位老朋友欢迎着这位曾经的宇航员、现如今的总统——这位老友正是詹姆斯·韦伯，现任NASA局长。“你好啊，詹姆斯。”总统微笑着向他打了声招呼。\n\n局长同样以微笑回应。“你真是给我们建了一个不错的好地方啊，约翰，”他说道，“而且，上帝啊，它还会为我们开辟出一条康庄大道。让我来带你参观一下，已经有好几个新项目上马了。”\n\n总统和随行的保镖跟着韦伯局长穿过休斯敦新设施的宏伟大厅，沿途听取着新项目的介绍：“在这里是我们负责未来计划和科技的规划室，也就是猎户座计划、狄安娜计划以及整体发射及再入飞行器。”\n\n总统耸了耸肩，说道：“这段时间我对最新消息可不怎么了解啊，詹姆斯。为什么不好好跟我讲讲呢？”\n\n“好吧。狄安娜计划的目标是再次尝试登陆月球，理论上说，我们可以找出阿波罗号的失误，并将这些知识活用于未来的任务；再入飞行器项目，也就是ILRV，是与可多次重复利用的航天飞机相关的计划，这能允许我们以较低的成本将飞行器送上轨道，比如说监视德国佬还有小日本的卫星；猎户座计划则是……嗯……我们正在设想由核武器提供推动力，将重型载荷送进太空。”\n\n“如果你不介意的话，我想问这一切都是为了什么。”\n\n局长笑了笑，转身走向大厅远处一扇不起眼的门，说道：“我就猜到你会这么问的。”\n\n走到那扇没有标记的大门前，局长推门而入，走了进去，格伦总统紧随其后。房间里一片昏暗，但到处都是笨重的电脑和办公桌，忙碌的男男女女们正在旁边努力工作。墙壁上，红色星球的照明地图散发着光芒，上面标注着潜在登陆点的地形地貌：乌托邦平原、水手号峡谷、埃律西昂平原以及其他一些地方。\n\n“我们已经在计划了？”\n\n“别这样，约翰。”韦伯回答道，“我们都计划好久了，问题只是资金而已。”\n\n格伦总统深吸了口气，收敛起思绪。“好吧，”他开口说道，“你们要多少就有多少，甚至还会更多。”"
 glenn.25.a:0 "红色星球在等待。"
 glenn.26.t:0 "欢迎来到NASA"
 glenn.26.desc:0 "“你也是新来的？”在NASA的介绍会上，坐在丹尼尔旁那位书卷气的年轻人问道。\n\n“对，”他回答说，“他们把我从洛克希德公司给挖了过来。这可是NASA啊，我怎么会说不呢？”\n\n“哈，你说得对。”年轻人语毕，伸出了他的手，“布伦特·凯利，航空航天工程师，刚从北美航空过来，很高兴能与各位在休斯敦共事。”\n\n“丹尼尔·盖尔泽，也是搞航空航天的，也许接下来我们还会一起工作呢。”\n\n“当然——等等，韦伯上台了，我们该安静了。”\n\n当声名卓著的NASA局长走上讲台时，礼堂里一阵寂静。他整理了一下文件，略微调整了一下麦克风，开始说道：“女士们，先生们，我们这个组织、我们国家即将开启一段伟大的征程，这将是穿越环绕着我们这个脆弱世界的茫茫虚空的奥德赛，而诸位将要投身于研究开发这段征程所需的科学技术。尽管诸位来自全国各地，有着不同的肤色与信仰，但大家的目标是一致的，那就是引领我们走向未知的发现。因此，我十分荣幸地欢迎你们所有人，加入这个杰出的组织之中。欢迎来到NASA。”"
 glenn.26.b:0 "很高兴来到这里。"
 glenn.27.t:0 "航天之道"
 glenn.27.desc:0 "“呃，约翰，这也是我给你打电话的原因之一。毕竟你从前是个宇航员，对火箭有一定程度的了解，开发的火箭的钱也是你出的，所以我还是想听听你的意见，你认为我们应该走哪条路？”\n\n“啊哈，”格伦总统回应道，电话听筒压在他的脸颊上面，“那么，我们有哪些选择呢？”\n\n“我们制定的某些登月计划涉及大量的在轨建造，因此会需要大量廉价火箭，这样就能向太空中发射大量小型飞船，将它们共同建造成更庞大的航天器；或者说，我们也可以仅仅只建造一枚巨型火箭，但其运载能力足以抵达月球并且再度返回。”\n\n格伦靠在椅子上，摸了摸下巴：“嗯……为什么不两个都要呢？”\n\n电话另一边传来一阵短促的笑声，紧接着又是一阵停顿：“……你是认真的？嗯，呃，我们也许能做到，但这会花很多钱的，约翰。”\n\n“嗯……”，格伦说道，“我会考虑一下，之后再给你回电话。”"
 glenn.27.a:0 "便宜路线总是更好的。"
 glenn.27.b:0 "塔式发动机和推进剂是唯一的出路。"
 glenn.27.c:0 "都试一试，看看哪种方案可行！"
 glenn.28.t:0 "迷雾重重的投资人"
 glenn.28.desc:0 "约翰·格伦正坐在椭圆形办公室里，翻阅签署着摊在办公桌上的文件。此时，白宫的通话器中传出总统助理的声音，打断了他的工作。\n\n“总统先生，”她温顺而小声地说道，“詹姆斯·韦伯正在线上，就是NASA局——”\n\n“我知道他是谁，谢谢你，弗朗辛。”他带着一丝被打断的愠怒回答道，随后拿起电话，向他的NASA局长问好：“嗨，詹姆斯。”\n\n“嗨，约翰。”韦伯回答道，“听着，我们可能给狄安娜计划找到了一个富有的投资人。”\n\n“有多富？”\n\n“非常富。据他所言，他能承担整个计划十分之一的成本，以此换取定期更新的进展情况报告。不过有个问题：他的财富似乎很可疑。在我们接受他的钱之前，我想让国税局查查这家伙。”\n\n“可以，不过这可能会把他给吓跑。他叫什么？”\n\n“道格拉斯·德维尔。”\n\n“我会考虑的，一两天之后给你回电话。”"
 glenn.28.a:0 "只要能助力我们进军太空，谁管那钱是哪儿来的！"
 glenn.28.b:0 "身怀巨资的可疑人士、想要狄安娜计划的私人更新报告？还是算了。"
 glenn.28.c:0 "也许应该把他引向我们的研发部门？"
 glenn.29.t:0 "新一天的黎明"
 glenn.29.desc:0 "约翰·格伦已经习惯了频繁来往于华盛顿和休斯敦之间。这些天，新的NASA总部经常请求批准各种重大决策，而总统一直都很乐意前来帮忙。毕竟，美国正处太空探索新时代的伊始。然而，今天，这些频繁来往将画上句号——总统不再需要亲临商讨；现在只需一通电话和一金库的金子就可以把这些事情安排妥帖。今天，总统将与NASA局长詹姆斯·韦伯会晤，为NASA的未来制定详尽的规划。\n\n格伦走进会议室，然后注意到这里除了韦伯之外只有一个实习生之类的陌生人。“你好啊，詹姆斯！”格伦开口道，“听说你已经敲定了你最中意的方案？不管怎样，我一直都很乐意帮助你的。”\n\n局长也坐在椅子上露出欣慰的笑容：“好吧，约翰，你的确可以这么说。坐下吧，我会一五一十告诉你的。”\n\n总统在韦伯对面坐下。“好啊”，他说道，“简单说说吧。”\n\n“现在NASA正在同时推进如此多的项目、同时朝如此多的方向前进，这根本就不实际，而且我们出资的每个项目都要过你的办公桌才行。每个项目都有不同的预期回报，但也都有相应的成本。依我所见——我们也都看到了——我们承担不起所有有前景的项目，一是因为它们斥资庞大，二是因为这会激起民怨。人们会感到太空计划不是必需的，而是不切实际的猎奇行为。如果我们开销太大，美国就会对失去对宇宙星辰的热情。”\n\n“所以，当我在确保政府对其他领域的发展给予足够重视时，”格伦答道，“你要做的就是安排好所有这些太空项目。我们不能让国家因此破产。”\n\n“对。”"
 glenn.29.a:0 "“那还等什么呢？”"
 glenn.30.t:0 "美国航天的新纪元"
 glenn.30.desc:0 "“美国公民们，我身后矗立着一座新时代的灯塔；我身后是一支熊熊燃烧的火炬，象征着崭新的星际航行的开始；我身后代表着美国航空航天局的希望；我身后是一个火箭的原型，有朝一日将会载着美国人进入太空：它就是土星1B火箭。这是一个巨大的造物，但它蕴含着更重要、更伟大的内涵：美利坚将主宰苍穹！”\n\n“一些人也许会问我，为何要如此煞费苦心；既然德国人早已宣称在太空中取得了胜利，为什么我们还要试图在太空中赢得荣誉；为什么我们仍然要奋战，去打赢一场早已结束的竞赛。对我而言，这从来都不是竞赛，而是对知识的追求。它是一个需要克服的挑战、是一座高耸的山峰，而山巅之上是广阔无垠的远方、是人类光辉的未来。我们即将再次踏上征程，为了国家，为了科学，也为了人类自己。”\n\n“我向你们坦白：这重获新生的探索中不可能没有困难。将来会有挫折、会有弯路，甚至也可能会有悲剧上演。然而，这并不能成为放弃崇高目标的理由。我恳请诸位想一想：华盛顿被困福吉谷的时候，他轻言放弃了吗？林肯面对南方发难时，他轻言放弃了吗？莱特兄弟被告知不可能制造飞机时，他们轻言放弃了吗？不，他们都没有！美利坚拥有不屈不挠的意志，而我们将共同向世界展示这种意志，一起开创美国太空航行的新篇章。“"
 glenn.30.a:0 "点火！"
 glenn.31.t:0 "招募新血液"
 glenn.31.desc:0 "休斯敦，得克萨斯州，早上9点。\n\n美国总统走下专机，来到了美国翻新重建后的宇航员训练中心。在他进入中心的那一刻，怀旧之情涌上了这位前宇航员的心头。似乎不久前，这里还是他的第二家园。即使这里到处都是新鲜的小玩意，熟悉的感觉却依旧挥之不去。格伦总统高兴地看着高科技的重力室、拟真的飞行模拟器以及操纵着这些仪器的未来太空陆战队。总统对此十分高兴，科学技术取得了长足的进步，NASA也仍然初心未泯。\n\n到了和新人们共进午餐的时间了。在几分钟的交谈过后，总统发现这些小伙子们并不像他过去那样对未知的宇宙空间感到紧张。他们身上表现出的紧张只是出于和总统的交谈而已，短短一个小时之后，紧张的气氛就烟消云散。格伦久久地回忆自己过去的经历，对最新的训练方法赞叹不已。\n\n时光飞逝，总统不得不与他的新朋友告别。当总统坐上飞往华盛顿的专机时，他对由自己掌舵的NASA的未来感到欣喜若狂。但与此同时，恐惧也悄然爬上他的心头：要是真的发生了什么悲剧，他也要背负全部的责任。如果某次火箭发射事故葬送了美国小伙子们的性命，他将不得不肩负起所有责任。格伦思索着，这种恐惧感或许会令他彻夜难眠。"
 glenn.31.a:0 "太空探索的未来虽然光明，但也充满了风险。"
 glenn.32.t:0 "愤怒的象党"
 glenn.32.desc:0 "自从我们决定向NASA投入更多资金后，就有一小撮共和党议员一直在抱怨。他们中的大多数认为我们投入太空项目中的资金太多了，它们本可以用在我国的其他部门上。一些共和党人甚至坚信，我们应该彻底削减NASA的预算，以支撑其他的重要业务。最近的民调显示，这些参议员得到了来自他们各州选民的声援。\n\n党内的这种分裂不可理喻。在格伦政府的领导下，我们应该让美国人民们考虑即将来到的未来。看在上帝的份上，我们迫切需要火星上的宜居基地。世界正处于核崩溃的边缘，因此没有什么比探索太空更重要了。我们必须把所有的资金都投入到星际探索上，上帝保佑，我们一定能做到！"
 glenn.32.a:0 "NASA需要所有可以提供的资金。"
 glenn.33.t:0 "未知在呼唤"
 glenn.33.desc:0 "探索推动着人类社会发展。自从人类第一次大迁徙以来，好奇心一直驱使着人类探索每一寸土地，寻求促进自我的思想，满足自身的冒险感。\n\n随着社会的进步，兵强马壮的罗马人英勇无畏地征服了一片片外国领土。他们在寻找一个家，一个能让他们战后定居的处所。同时，我们可以看到征服者们在旧世界和新世界间搭建桥梁。克里斯托弗·哥伦布这样的探险家发现了现在我们生活的美洲大陆，其他探险者也在全世界范围内传播他们的所见所闻，整个人类文明得以第一次相互联系形成整体，而正是人民的昭昭天命将我国塑造成了当今的超级大国。即便如此，世界上也还有大片海洋未曾探索。\n\n但现在是时候将心思转移到星空之上了。地球被核摧毁的风险越来越近，我们对伟大宇宙的知识却少之又少。现在，只要我们仍驻足于地球上，那么我们的探索欲就永远无法得到满足。每一名美国人都必须团结起来，迎接即将到来的挑战，昂首挺胸地向星空阔步前行，免得在失败后落入地球毁灭的火海。"
 glenn.33.a:0 "太空中闪烁着希望。"
 glenn.34.t:0 "土星火箭助推器的问题"
 glenn.34.desc:0 "白宫的又一天将要过去，而格伦总统仍然把NASA放在工作首位。他如今专注于太空，以至于他都在怀疑自己是不是适合当个总统。可现在看来，这个问题已经不重要了，在格伦的目光中，从前遥远的未来已然近在眼前。带领祖国迈过他前任在太空事业上设置的门槛，才是他唯一的使命。办公桌上的电话响起之时，他正啜饮着咖啡，思索着美国太空事业的未来。令他惊讶的是，来电者是NASA的一名官员。\n\n“总统先生，我们一直在审查土星计划，您要求的重型运载火箭已接近完成。但工程师们一直都在争论，助推器是应该使用液体火箭燃料还是固态火箭燃料。我们想问问您怎么看，毕竟NASA的预算已经一天比一天紧张了。”\n\n土星计划！这枚火箭将成为点燃美国对太空兴趣的火花，总统需要迅速决断。格伦知道，液推相当昂贵，如果他选择这个方案，那么从现在开始，NASA的所有任务开支都会增加。这固然有助于进一步确保任务的成功，但由于成本增长，公众也会越来越不满。要是他仍然选择固推，那么任务成本将会较少，但基础任务的准备程度也会相应降低。"
 glenn.34.a:0 "这确实是个有趣的问题。"
 glenn.35.t:0 "重塑同情"
 glenn.35.desc:0 "“我的美国同胞们。我今天站在你们面前，不仅仅是因为我有一个梦想，更是因为我清醒地认识到我们数百万同胞仍在面临着的不公。我听说，人们认为我是一个太空的梦想家，一个为了逐梦而抛开地球上的一切的梦想家。但请你们相信，这与现实相去甚远。诚然，我和绝大多的政府官员依然坚信，人类的未来必将奔向群星，但我更不会、也从没有对这样一个事实视而不见——美国，必须尽其所能，以最大程度上发挥人类的潜能。”\n\n“面对贫病交加的美国人民，合众国可谓道阻且长。关注过我竞选的人们可能还记得我的承诺——为真正的美国人而进行的真正的改革。因为真正的美国人从来不是那些坐在金碧辉煌的豪宅里却仍想着招权纳贿的官僚们，也不是那些只因与别人的外表或信仰不同就禁止他们做自家孩子的同学的妇人们。真正的美国人，是即使是最后一分钱也要把它捐给饥肠辘辘的儿童的老妇们，是在家乡义务巡逻、抓捕罪犯的志愿者们，是尽心尽力于伟大的美国社会的人们！这个国家鲜有对底层人民的同情，唯有上述社会观念，才是这种缺乏的解药！”\n\n“在此，我的政府自豪地宣布，我们正致力于实现我们的一项重要承诺——真正的养老金改革！老人们再也不会饥寒交迫，他们的孩子再也不会颠沛流离，再也不会了……”"
 glenn.35.a:0 "一场盛大的演讲！"
 glenn.36.t:0 "遗落之人"
 glenn.36.desc:0 "尽管格伦总统本周早些时候的演讲激起了全党的热情，裂痕依旧如常地出现了。年轻的进步议员已经联系我们并询问政府能否利用其影响力来修订养老金保障议案。说得具体些，就是说他们提议，要对后天残疾者也提供更丰厚的养老金补助。\n\n政府此前已开始商榷是否提高对先天残疾者的补助，但如果在议案中加上后天残疾者，总统将陷入一个两难的境地：如果我们对残疾人区别对待，激进派会被激怒；但党内保守派和商人院外集团也对议案起着至关重要的作用，如果他们觉得我们“会造就糟糕的就业环境”或“不懂得摸着石头过河”，肯定不会乐意支持的。\n\n众议院的多数党领袖提出了一个折衷方案，其中一项提议是提高退伍军人养老金，这得到了NPP的支持。如果我们把残疾退伍军人纳入后天残疾者养老金修正案，我们就很可能得到NPP足够的支持，甚至从我党变节过去的那些人也会支持。如此，我们就足以通过议案了。然而，这也会严重激怒保守派。我们该怎么做？"
 glenn.36.a:0 "为了残疾人，我们必须支持！"
 glenn.36.b:0 "不。对先天残疾者，我们无能为力。"
 glenn.37.t:0 "劳瘁贫贱的流民"
 glenn.37.desc:0 "贫困的存在已经成为了养老金保障法案的潜在问题。在低收入下，他们根本给这个项目交不起足够的钱来提升他们的退休后生活水准。虽然议案增加了一项以确保低收入家庭享受免养老税津贴，但这却会使他们本已很糟糕的境况变得更加复杂，只会叫他们退休后面临更严峻的环境。\n\n众议院的激进派给议案搬出了一大堆修正案和提议以解决这个棘手的问题。修正案将授权政府用福利基金给低收入退休人员发养老金，而那些提议则要求扩大社会安全网络、失业救济金和社会援助项目。\n\n毋庸置疑，把这些玩意塞进议案肯定是一个……勇气可嘉的决定。一旦社会福利通过这些提议被成功扩大，保守派和商业大亨组成的院外集团甚至可能大肆斥之为“血腥的谋杀”（或者至少是“布哈林主义潮”）。但是和残疾人保障的提议一样，我们也有希望转而取得NPP变节者的支持，以保障议案仍能被通过。我们能冒这个险吗？"
 glenn.37.a:0 "为了真正的美国人，赴汤蹈火，在所不辞。"
 glenn.37.b:0 "我们不能为此拿整个议案冒险。"
 glenn.38.t:0 "养老金保障法案通过！"
 glenn.38.desc:0 "尽管我党陷入了内讧，但我们还是做到了！众议院已经通过了这一议案，而在参议院中我们也可谓稳操胜券。我们终于向一个更公平正义的美利坚迈出了一小步，也是让老年人得以安度晚年的一大步！"
 glenn.38.a:0 "有人想在佛罗里达来把宾果吗？"
 glenn.39.t:0 "养老金保障法案未获通过"
 glenn.39.desc:0 "我们做不到。让议案过众议院这一关实在太难了。多数党领袖刚刚告知我们，议案的得票少得可怜。现在议案被扼杀的结局已经尘埃落定了。一旦报纸得知我们对中老年人的燃眉之急束手无策，他们对我们的支持的滑坡也是迟早的事。或许，未来哪一届政府会通过一项公正的养老金法，这样至少我们自己还能不那么穷，但是就连这种希望也很渺茫了。"
 glenn.39.a:0 "还是关了新闻吧，别叫奶奶听见。"
 glenn.40.t:0 "药品买卖"
 glenn.40.desc:0 "在打击剥削人民的垄断药商大获全胜后，备受鼓舞的格伦总统称将再接再厉，着手对绝大多数非处方药店施行价格管控，尤其针对心脏病药物等慢性病药物。\n\n令人悲伤的是，党内又在为此事吵得不可开交。迪克西派和加利福尼亚共和党人对制裁自由企业嗤之以鼻，更别说他们在老家靠着垄断大药商提供的就职机会、税收和竞选支持捞了多少钱了。然而，在格伦总统的选票基本盘——东北部地区，该提议得到了鼎力支持。限制药价本来可以算是很明智的政治行动，但在目前的危局下，我们仍然远不足以让该提议在国会通过。\n\n因此，我们只得用行政令了。这不仅会激怒以州权民主党为首的党内反对派，还会让我们不能在事后把锅甩给国会。所以我们必须权衡是否要冒着党内分裂的风险一意孤行。可能稍温和的价格管制才是中庸善道？"
 glenn.40.a:0 "不启动所有推进器，火箭就入不了轨！"
 glenn.40.b:0 "我们还是施行有限的药价控制吧。"
 glenn.41.t:0 "权衡之策"
 glenn.41.desc:0 "出于担心过度降低药价会促成药物成瘾，尤其是阿片类镇痛药上瘾，我们的政府否决了党内激进派的提案，并宣布只划定以非处方药为主的药品的价格上限。\n\n正如我们所愿，我们在进步派和中立派中的支持率正节节高升；西海岸大药商由于并没有受到他们预期那么大的损害，也开始欢欣鼓舞。\n\n然而，东北部地区开始对此抱怨起来，国会中总统最忠实的支持者也开始担心，他们在下次国会选举的初选阶段可能被更激进的候选人击败。"
 glenn.41.a:0 "格伦式的折衷方案！"
 glenn.42.t:0 "我们必须得谋划一下！"
 glenn.42.desc:0 "如果还能出上一份力，那就不能妥协！通过一项行政命令，我们将一劳永逸地打击大药厂。病人将不再遭到贪婪的垄断企业剥削！\n\n我们的支持率正全面飙升，但党内亲近商业势力的派系却对如此仓促行事而愤怒不已，特别是在西部各州，他们的收入因此而损失巨大。党正在慢慢瓦解，可能过不了多久，我们就会在国会面临有关这个麻烦的公然抵制。\n\n好吧，就像阿巴拉契亚的老话一样，有时候得把让炖菜煨熟，这样才能享用菜肴。我们需要让这份提案在媒体上发酵一下，看看公众和国会的反应，然后再力推法律施行。"
 glenn.42.a:0 "做好准备！"
 glenn.43.t:0 "鸦片战争"
 glenn.43.desc:0 "约翰·格伦总统沮丧地咬着牙，一支笔在他的指间转来转去，似乎是在试图催眠那些关注他默不作声的怒火的工作人员。面前的坚定桌上摆放着半打文件，格伦在阅读时几乎要忍不住要把它们撕碎的冲动，纸张的边缘都已经磨破了。\n\n在宣布价格管制的时候，我们预料到了党内一部分人的反应，但没想到抵制会如此强烈。众议院多数党领袖的信冗长而华丽地表达了对党的国会代表完整性的关注，但即使是对没有长期政治经验的人来说，隐藏在字里行间的威胁也显而易见。\n\n媒体上的公开抗议；企业资助者收回竞选资金；也许他们还会企图破坏保险市场的经济，以此削弱党在西海岸的势力；甚至还有威胁声称，要是总统不对他策划的药品价格上限措施加以限制，那他就会在国会遭到自己党派的谴责。\n\n“先生？”幕僚长颤抖着说道，“您——您决定好对策了吗？”"
 glenn.43.a:0 "“把这些个碍眼的玩意儿从我桌子上清走，我们要坚持下去！”"
 glenn.43.b:0 "“他妈的……行吧，只对处方药进行价格管控。”"
 glenn.44.t:0 "一视同仁"
 glenn.44.desc:0 "格伦拒绝向西海岸的企业骗子和南方的反动派低头，政府正陶醉在党内进步派的胜利之中！我们的支持率不仅在东北部基本盘中急速上升，而且在广大公众中也是如此。\n\n自然，西海岸的议员和州长们相当愤怒，党正因内部分裂而摇摇欲坠，最近几天股市也明显受挫，但这不过是将格伦主义巩固为未来的进步思想而付出的小小代价罢了，无论是在群星之间、还是在这地球之上。"
 glenn.44.a:0 "人们说，我们不关心脚踏实地的生活……"
 glenn.45.t:0 "犹豫不决的白宫"
 glenn.45.desc:0 "格伦总统做出了相当有魄力的决定，撤回强有力的药品价格上限政策，转而采取更温和的措施，公开分裂似乎随之在党内销声匿迹，取而代之的则是温和的小小抱怨。\n\n虽然华盛顿已经恢复了平静，而且我们在确实在药品价格上限问题上寻求到了一群支持者，但基本盘中的进步人士仍对总统未能兑现他早先的宏愿承诺而感到不满。在西海岸、南方、东北、甚至中西部，民众都很恼火，党的实力肯定比一个月前削弱了一些，总体支持率也有所下降。\n\n一位来自新罕布什尔州的众议员指责格伦总统在政策上“犹豫不决”，全国的政治讽刺作家和漫画家从中汲取了灵感，欢快地将白宫戏称为“华夫宫”。"
 glenn.45.a:0 "不过，所有人都喜欢华夫饼。"
 glenn.48.t:0 "圣路易斯的演讲"
 glenn.48.desc:0 "“总统先生，他们已经为您准备好了。”勤勉尽职的特工对坐在后台，正在为今天的重要演讲做准备的格伦总统说道。\n\n格伦想到了愿意来参加公开演讲的人群、有关于政府中巨大腐败的演讲主题、还有他将怎样助力人们的生活变得更加美好。这位俄亥俄人的脸上渐渐露出了笑容。\n\n“现在，女士们，先生们，让我们欢迎美国总统、约翰·格伦。”密苏里州州长说道，随后，在人群爆发出的热烈欢呼声中，格伦总统走上了演讲台，脸庞上浮现出灿烂的笑容，向他面前越聚越多的人群挥手致意。\n\n走上讲台后，格伦开始了他的演讲：“早上好，美国同胞们！在开始之前，请允许我对贵州辛勤工作的州长邀请我在今天来到这里表示深深的感谢。”\n\n人群在笑声和喜悦中欢呼着他的名字。格伦注视着为这次活动制作的几块海报看板，其中有一块上面写着“向星星射击！”的标语，旁边画着一艘火箭宇宙飞船还有一颗星星，这让总统笑得很开心。\n\n“我知道，现在大家对本届政府的新计划很是焦虑，所以请允许我解释一下。亲爱的美国同胞们，向每名公民心中灌输责任感和同情心一直都是我的职责所在，虽然我们已经在这个目标上取得了长足的进展，但道路上仍然有一个巨大的障碍：腐败。政府官员为了牟取更多的利益而卑躬屈膝、自甘堕落，并且放任这种行为的后果进入联邦程序之中。这不正确，这也不公平，我们不能允许它继续存在下去。无论在立法部门还是行政部门，本届政府都时刻准备着，打击企图继续困扰国家的一切形式的腐败。”\n\n台下前来参加公开演讲的北方人和中西部人敬畏地面对着总统，但随着他的讲话，人群中很快就响起阵阵欢呼。"
 glenn.48.a:0 "为了所有人的自由与正义。"
 glenn.49.t:0 "一步一步"
 glenn.49.desc:0 "在华盛顿特区的凌晨时分，总统发出了一阵发自内心的笑声。\n\n“你是在和我开玩笑，对吧？”他问梅岑鲍姆，后者的笑容也和格伦一样灿烂。\n\n“一点儿也不，总统先生。当那个参议员听到了一些正在起草的反腐败措施、并且还要将其纳入现行联邦程序予以执行的时候，他看起来就像一个偷吃饼干结果被抓了个正着的孩子一样。不用多说，我觉得大约只过了十分钟吧，他就夹起尾巴，灰溜溜地逃出了晚宴。”\n\n总统和他的幕僚长再次同时笑出了声。\n\n“梅岑鲍姆先生，现在我很遗憾地通知你，今天的某个时候还是要工作的，所以谈谈正事儿吧。我们仍然需要研究那些有关新政成效的报告，你能给我些什么东西？”\n\n梅岑鲍姆翻开了一个马尼拉文件夹，里面装着各种文件，然后把它递给了总统。\n\n“先生，直截了当地说吧，政府制定并付诸实施的措施，嗯，显出了成效。政府中的各级官员已经取消了他们与信誉不良的组织以及企业达成的交易，而且有报告称，某些委员会中政府程序的推进速度加快了105%之多。”\n\n总统虽然对这个消息显得信心满满而且期待不已，但更多流露出的则是自豪——当然有为他自己的自豪，但他也为他的政府感到自豪、为付出的努力工作感到自豪、为他们取得的进展感到自豪、甚至还为那些转而洗白自己的官员感到自豪。政府只是美国社会中的一个方面，它与现代社会之间的差距需要被缩小弥补，而他们已经在遏制看似无穷无尽的反垄断和的欺诈行为上赢得了一定的成功。"
 glenn.49.a:0 "“霍华德，你想不想抽些时间，回去看看你的家人？”"
 glenn.50.t:0 "世界之都"
 glenn.50.desc:0 "约翰·格伦总统又一次从他的一天中匀出了一些时间，欣赏着椭圆形办公室窗帘之外的光景。阳光穿过城市上空的云层，格伦面带微笑，深深地吸了一口气。这位俄亥俄人知道，他以后很难再看到像如此时这般美丽的景色了。但现在，没有对未来的忧虑扰乱着他的头脑，他任凭鸟儿的歌声盈满双耳、温暖的夕阳拂过脸庞。正如全国许多人称赞他在整个总统任期内的举措一样，总统本人也十分快乐幸福。\n\n现在，格伦知道，美国已经准备好了在世界范围内展开下一步的行动。他的政府不会永远延续下去，虽然美国社会中仍有问题需要处理，但他知道，他们已经做了能做到的一切。经过这么多年的努力，长年以来在悲哀的美国社会中存在的同情心的鸿沟已经得到了弥补；弱势群体、需要帮扶、饱尝压迫的人们终于得到了他们需要的工作，奋力爬出悲伤与痛苦的深渊；美国人民，无论是健全者还是残疾人，都拥有了经济保障，引领他们迈向更健康、更幸福、更光明的未来生活；仅此一次，美国人民看到政府真正挣脱了腐败的枷锁，尽管只是最小限度的挣脱。美国人民经历了如此漫长的苦难，可格伦知道，在他八年任期的引领之下，公民心中已然树立起了坚定不移的希望。\n\n随着希望与伟大的图景在总统的脑海中涌动，他的思绪也扩展开来，并非世界上所有的人都拥有这样属于成功与进步的故事。欧洲各地蒙受压迫的男女老幼在与邪恶压迫者的不断斗争中蒙受着长久的痛苦；同样，在美国，复仇的音符未曾止息，太平洋仍然陷于冲突，人与人之间的对抗遍布大海上的各个岛屿。然而，变化已经悄然发生：他们拥有了寻找希望的地方。美国就是一个范例、一个熠熠生辉的榜样，指引着他们可以成为什么、他们应该成为什么、还有未来的美好前景——假如他们能像美利坚合众国一样繁荣昌盛。\n\n格伦没有对身后传来的开门声作出回应。\n\n“总统先生，您还好吗？”梅岑鲍姆问道。"
 glenn.50.a:0 "“霍华德，你听到画眉鸟的歌声了吗？”"
 glenn.56.t:0 "团结一心，共赴繁荣"
 glenn.56.desc:0 "“嗯……是的，我明白了。”格伦总统一边含糊地说着，一边从口袋里取出了一个小本子，迅速记下了一些潦草的笔记，另一只手则拿着椭圆形办公室的电话听筒，“完全理解，我们会将你的想法全盘纳入考量。可别忘了，我们为美国工人服务！如果还有任何其他我们能做到的，务必联系我们！好的，谢谢你，乔治。”格伦总统在挂断电话前微笑一声，说道。\n\n“好吧，总统先生，请问那是哪位？”梅岑鲍姆问道，他被叫到椭圆形办公室的时候，格伦总统正在打电话。\n\n“梅岑鲍姆先生，我想向你征求一些建议，我们已经开始着手敲定废除工作权利法的所有细节。现在，我们面前有一些更加深彻的提案。”总统回答道。\n\n梅岑鲍姆始终无法彻底摆脱格伦每时每刻都抱持着的真诚同情心给他带来的震撼：“呃，总统先生，大公司已经对政府如此支持工会表示了反对，但您有什么想法？”\n\n总统沉默地坐着，仔细思索着这个问题。“梅岑鲍姆先生，我刚刚和一位与几个团体共事的同僚讨论了一下在某些立法工作上展开合作的想法。他告诉我，全美的工会都表示，希望能全面执行八小时工作制。”格伦一边说着，一边观察着梅岑鲍姆脸上典型的震惊神色。\n\n“总统先生、先生，我明白必须要关心美国工人，但如果我们一下子走得那么远，企业就会对本党发难。商务部也已经确定了，如果我们对工会的支持太过，经济可能会出现困难的。”幕僚长指出了自己的观点。\n\n“我明白，霍华德，但如果连我们都不打算走到那一步，那还有谁会呢？”格伦尊重地对自己的幕僚长说道，他的震惊无可厚非。\n\n美国的劳动大军长久以来都勤奋能干、挣扎谋生，如此这般的好儿女们难道不应该在辛勤工作的同时享受自由的生活吗？或者说，他们是对的，我们都会为此而付出代价；甚至更糟，这份法案可能会在做出任何改变之前就惨遭扼杀？"
 glenn.56.a:0 "“致电商务部，我们要更进一步。”"
 glenn.56.b:0 "“别太担心了，霍华德，我们不会干得那么出格的。”"
 glenn.58.t:0 "国会通过废除工作权利法的议案"
 glenn.58.desc:0 "经历了白宫几个月的拉锯后，废除工作权利法的议案已在众议院与参议院成功通过。这一议案已被写入法律，约翰·格伦总统称之为“美国工人公民的重大胜利，以及终结职场不平等与企业家压榨工人现象的关键一步”。该议案的争议中，格伦政府并不是孤军奋战，比如商务部中很多人大力支持总统为消除美国工人阶级困难而做的努力。\n\n工作权利法授予了美国工人不参加工会的权利，因此在平民中广为诟病。一个弗吉尼亚煤矿工人今天声援格伦总统道：“很多人以为总统是在试图剥夺工人权力。但是我得说，很多不加入工会的人对工会毫无付出，却也能享受工会带来的好处。我觉得格伦总统真是一片好心呐！”一想到他们的工作更有保障了，许多血汗工人为这一议案的成功立法奔走相告、彻夜狂欢。\n\n然而，并不是所有人都支持格伦政府废除该法。很多商业大亨在媒体上以批评回应了议案的通过。“我们这些企业家发现，这议案正在给我们扣‘剥削’阶级的帽子！我们是做生意的，我们做的可是公平公正的正经生意，不然我当初凭什么要雇人干活？！格伦总统正在把美国经济往火坑里推！”\n\n现在的情况可谓是几家欢喜几家愁，而只有时间能告诉我们，格伦政府的工作将会对美国工作环境产生怎样的影响。"
 glenn.58.a:0 "为美国工人的团结与自由！"
 glenn.59.t:0 "国会否决废除工作权利法的议案"
 glenn.59.desc:0 "今晚，美国企业主与格伦政府之间就废除工作权利法议案的拉锯战达到了高潮。最终，企业主一方取得了胜利。国会之中的战斗已然尘埃落定，许多大企业的高层随后都献上了欢呼与祝福，他们成功地对员工建立了更牢固的掌控。一位企业高层人员就站在国会大厦的台阶上，宣称：“美国的经济的自由屹立不摇，永远不会遭到政府的干涉！”\n\n战场的另一端，联邦雇员、立法部门和总统政府内部的许多其他工作人员的面庞依旧庄重而又坚强。格伦总统对议案遭遇否决发表了自己的看法，他说：“我们作为政府，一直在为全美雇员的权利、安全和公平的生活而不断奋斗。或许我们今晚在国会中遭受了失败，但尽管如此，我们依然要将斗争再次继续下去。为了所有在窃据工会利益的硕鼠之下蒙受委屈的美国劳动者，我们不会停下步伐，今天不会、明天也不会。”\n\n在美国公民眼中，这份议案的前景无疑引起了分歧。肯塔基州一家大企业的老板对议案在今晚被否决表达了喜悦的情绪，他说：“总统的这份议案充其量只能算是假设，要是以最坏的恶意去揣测，那总统这就是偏见。我企业里的美国人根本不用加入任何形式的工会，他们就能过上幸福的生活。”一位来自康涅狄格州的码头工人则安慰了政府的努力，他认为：“我已经见识过许多工友在不支付任何形式会费的情况下侵吞着工会的福利，我认为这是不对的。议案没能通过，我不得不在没有总统撑腰的情况下重回岗位，这让我感到十分难受。可尽管如此，我们仍会继续与您共进退，总统先生。”"
 glenn.59.a:0 "我们仍然与您共进退。"
 glenn.60.t:0 "补贴，还是不补贴"
 glenn.60.desc:0 "在格伦总统的竞选过程里，社会保障的理念一直贯穿其中。这个想法最初曾在老肯尼迪执政期间得以萌芽，但又迅速遭到了否决。近来数周内，总统一直都在推动他的竞选承诺，试图将这个概念重新引入现实。在最近的一次新闻发布会上，他宣布，他和国会中的盟友“目前正在起草新的社会保障法案”。\n\n目前还不清楚这项新的福利法案究竟会有多大的力度，但假若总统在竞选期间发表的言论观点并非无根之萍，那它很可能会相当全面而广泛，至少会涵盖所有65岁以上的美国人和因残疾而无法工作的群体。但共和党与民主党之间似乎就福利措施的力度存在一些争论：共民党内以民主党人为主体、相对保守的国会议员们表示，该计划中的退休金的来源应该只包括退休人员在工作期间缴纳的税收以及信托基金；以共和党人为核心、较为自由的派系则不然，他们虽然承认社会保障信托基金必不可少，但也认为它根本无法满足大多数美国人的晚年需求，因此必须要调整联邦预算，由政府直接出资补贴信托基金。在这个计划中，申请社会保障的美国人将会收到比他们在就业时投入金钱更多的福利。\n\n如果总统追求更全面、由政府补贴的社会保障，那么该法案预计将失去大量民主党人的支持，并且遭到NPP极右派的断然拒绝。然而，法案尚未起草完毕，问题依旧存在：格伦总统会走多远？"
 glenn.60.a:0 "坚持到底；针对社会保障的补贴是必需的。"
 glenn.60.b:0 "我们必须得让民主党同意这份法案！"
 glenn.61.t:0 "有关覆盖面的难题"
 glenn.61.desc:0 "格伦的社会保障法案即将草拟完成，但在敲定细节的过程中，围绕该项目的医疗援助部分——即所谓的医疗保险——到底应该走得多远，出现了强烈的反对声浪。总统本人已明确表示，他主张建立一个强有力的医疗系统，为所有65岁以上或身患残疾的人全额支付医疗费用。政府可能需为此增加社会保障投入，甚至面对国会中的那些保守派“暴徒”更为猛烈的怒火。\n\n不出所料，民主党人提出了一个更加温和但仍不失全面的方案。根据该方案，医疗保险仅为符合条件者支付30%-50%的医疗费用。公认的民主党参议院领袖华莱士·F·本内特已宣布，他绝不会支持一个如此挥霍预算的医疗保险计划——把资金浪费在普通退休者根本无所需求的项目上。一些NPP极右派参议员对民主党的提议表达了些许善意，但他们明也确指出，总统的立场完全不可接受。缺少了保守派的支持，该项议案能否获得通过恐怕将会成为悬念。因此，总统与共和党必须二者舍其一：要么是格伦寄托于医疗保险项目的全额医保之梦，要么是他对共民党团结以及法案的跨党派支持之需求。"
 glenn.61.a:0 "见鬼的民主党——必须要全面覆盖！"
 glenn.61.b:0 "政治就是妥协，还是部分覆盖吧。"
 glenn.63.t:0 "社会得以保障"
 glenn.63.desc:0 "今天，华盛顿传来了激动人心的消息，约翰·格伦总统的《社会保障法案》正式通过了国会，预计总统本人将于本周内签署该法案，将其确立为法律。该法案主要以老肯尼迪政府的提案为基础，在与NPP极右派的激烈交锋之下，法案以微弱优势得以通过。虽然较为保守的民主党人最初对通过开支如此庞大的法案犹豫不决，但当他们明白总统可以做出妥协时，他们很快就平静了下来。\n\n根据这项新鲜出炉的福利计划，所有65岁以上的美国公民和生活严重不便的残疾人均可向美国政府申请月度发放的财政补助，金额则依据申请者在劳动期间的纳税百分比因人而异。"
 glenn.63.a:0 "美国人民能稍缓一口气了。"
 glenn.64.t:0 "格伦的社会保障法案未获通过！"
 glenn.64.desc:0 "今天，华盛顿传来了不幸的消息，约翰·格伦总统的《社会保障法案》在国会以微弱的票数差异遭到了否决。看起来，总统和他的进步派支持者低估了保守派对法案的反对，也低估了他们自己团结一致、作为一个党派投票的能力。某些共和党人跳到了另一边，与他们的政治对手共同投票反对该法案。\n\n总的来说，该法案的大败亏输、以及随后在立法机构中的失败很大程度上都要被归咎于总统和他的盟友，以及他们不愿意在关键问题上与更保守的国会议员达成妥协的行为。此外，该法案也让共民党更加分裂，这样一份全面而激进的法案似乎又一次挑动了党内的紧张关系，党离解体又近了一步。\n\n至于普通美国人，生活还将继续下去，虽然他们可能在晚年没什么生活来源，但以前也从来没有过。很多人都对《社会保障法案》的失败耿耿于怀，这样的情绪可能会延续很久。有一件事是肯定的：这绝不会是社会保障的最后一次努力。"
 glenn.64.a:0 "这会大大损害我们的支持率。"
 glenn.65.t:0 "跨越鸿沟"
 glenn.65.desc:0 "“国会：联邦政府的立法部门、美利坚合众国的立法机构、政治机器中最重要的部件之一。但是，”格伦总统思考着，“尽管他们十分地重要，但我们也必须深入到他们的工作程序之中，确保任何腐败都无法左右国会的工作。”格伦在办公室中一边踱步思索，一边看着堆积在办公桌上的文件。\n\n“参议院道德委员会将改变目前的立法过程，确保没有参议员会在不考虑更大利益的情况下行事，但现在，我们还得担心委员会领导的问题：民主党、或是共和党。”格伦坐下来，环顾着四周，摆在桌上的电话引起了他的兴致，随后，他拿起了一沓社会改革法案，在其中筛选起来。“提拔一名共和党人能够对国会建立强有力的控制，我们也能借此让以共和党为中心的计划和法案更容易地通过既有程序，向比以往任何时候都更需要帮助的所有美国穷苦人伸出援手。”他把文件放回桌面上，按摩着自己的眼睛。\n\n“但是，民主党可能会大发雷霆。毕竟，照他们的说法，清除政府内部的腐败不应该只局限于党派努力，他们是对的。更何况，按照对他们的了解，要是不指派一名民主党人担任委员会的领导，他们很可能会指责我们把腐败的责任全都推到了民主党身上。”格伦甚至没有注意到，这个艰难的决定让他无意识地用鞋底敲打着地板，声音回响在平时宁静的办公室之中。"
 glenn.65.a:0 "腐败不是一党一派的问题。"
 glenn.65.b:0 "我们需要尽快地通过这些法案。"
 glenn.66.t:0 "民主党的抵制"
 glenn.66.desc:0 "总统经历了漫长的一天，起草法案、指挥打击腐败的新方案和程序的制定，以及作为美国总统的其他职责。可当他刚刚闭上眼睛、上床休息时，一连串急促的敲门声就立马将这位俄亥俄人从休憩中惊醒。打开门，总统的首席政治顾问正站在门口：“先生，您会想要看看这个的。”\n\n总统来到办公室，看到了引起所有恐慌的源头：他的办公室收到了一位得克萨斯州民主党参议员发来的传真。他仔细阅读着这封信件：“您遴选参议院道德委员会负责人的决定带有政治色彩、不公平。”总统捏了捏鼻梁，就算这不会阻碍工作的进展，也能让他为此头痛好一阵子了。“因此，我们要求您撤回之前的决定，这将使国会团结一致、维持我们政党中的平等、避免出现共和党或民主党压过对方一头的情况。我们联盟中的某些成员甚至表示，如果您不能满足我们在被腐败和不公所浸染的国会中伸张正义与平等的愿望，那就会去投奔NPP。总统先生，我们这样做都是为了美国，因为我们的职责正是全心为选民工作、公平地工作。”\n\n“要是我顺了他们的意，共和党非得把我嚼得连骨头渣子都不剩。”格伦说着，他意识到了在党内努力实现团结的风险。\n\n“现在，总统先生，我知道这看起来很糟，但请听我说：如果我们坚持继续下去，维持当下的路线，也许他们就会退缩，意识到您才代表着党的领导，并且您身为总统的权力足以压倒他们的愿望。如果您愿意，不妨戳破他们的虚张声势？”"
 glenn.66.a:0 "我不能在这时候分裂党派啊。"
 glenn.66.b:0 "让公民们为收获而受苦，这是不对的。"
 glenn.67.t:0 "反对派的溃败"
 glenn.67.desc:0 "这几个小时仿佛就像好几天一样漫长。政府完成了所有的工作、越过了所有的障碍、将所有人渣都清扫出了联邦政府，可现在，这帮气势汹汹的民主党人组成的联盟居然成了最有力的反对者，企图在时间的考验中抹消总统的工作。这一切带来的焦虑让格伦的心情沉重不已，他足足踱来踱去好几个小时之后才坐了下来，疲惫地自问道：“我们已经经历了这么多，难道就是这样的结果？”\n\n“晚上好，总统先生。”梅岑鲍姆在进来时敲了敲门，“我相信您会想看看这个。”他说着，将一张纸递给了总统。\n\n另一封信，是那帮公然抵抗的参议员们寄来的。“致格伦总统，”格伦默默地浏览着信件的内容，面部表情在短短的时间里飞快地变换着，“他们真的退缩了？”总统说着，仍然没有摆脱震惊的情绪。\n\n“看起来是的，总统先生。”他的幕僚长回应道，“没发生什么投奔NPP的大新闻，参议院对您委任的道德委员会负责人表示顺从。干得非常漂亮，总统先生。”\n\n格伦仍然坐在那里，“总统”这个词语依旧在他的脑海中回响着，办公室里的时间似乎都变慢了。“不可能啊。那些参议员强烈反对政府的选择，他们不可能这么快就退缩，不是吗？”格伦一边想着，一边看着房间，梅岑鲍姆的脸上挂着得意的笑容，他不由因此而放松了脑海中冒出的这个念头。“当然，也许我想的是对的，这不会是终点。我们已经走到了这一步，虽说民主党可能会对这次失败而感到愤怒，但至少我们还站在权力的顶峰之上。离战争结束还很久很久，但现在……”"
 glenn.67.a:0 "“这场仗打赢了，梅岑鲍姆先生。”"
 glenn.69.t:0 "佛罗里达发射场的演讲"
 glenn.69.desc:0 "“各位参议员、众议员、科学家、工程师，尊敬的客人们，女士们、先生们：”\n\n“在当选之前，我谈论过许多话题，但其中最重要的是，我谈到了美国需要不断地抬头仰望。我们是探险家、先驱者、移民的后代，展望未来是我们的天性。我曾说过，追逐天际线、不断向前进军就是我们的使命，而你们中有许多人都同意我的观点，我们共同迈出了第一步，再次将目光投向天际，美国又一次走向了太空。”\n\n“自那时起，我们又做了许多许多。NASA得到了加强，被重塑为这个国家乃至全世界科学和探索的一盏明灯。我们招募了最优秀的科学家、最聪慧的工程师、培养了首屈一指的宇航员队伍，我们还划拨了足够的资金供他们开展工作。这孕育出了成果，许多步骤已经准备就绪，我们比以往任何时候都更加接近星空。”\n\n“是时候为阿波罗复仇了，我们要夺回作为太阳系先驱和探索者的应有地位。阿尔忒弥斯计划已经向着这个目标迈出了一大步，我们将会飞得比以往更远。现在，我可以满怀信心地说，美国很快就会将宇航员送上月球。虽然我们不会是第一个登上月球的国家，但对地球天然卫星的征服将会昭示美国再次展望明天的愿望。”\n\n“我们将是先驱者、我们将成为太阳系的探索者、我们将征服月球，而一旦我们到达那里……”\n\n“我们仍将放眼苍穹。”"
 glenn.69.a:0 "“这就是我们的使命。”"
 glenn.70.t:0 "阿波罗的幽灵"
 glenn.70.desc:0 "“我还是忘不了啊。”\n\n今晚，这两位工程师已经在军官餐厅吹了三瓶啤酒了。\n\n“别误会，我喜欢回来的感觉。没什么能和在太空任务中工作相提并论，但我还是提心吊胆的。”\n\n“什么提心吊胆的，伙计？我有点儿跟不上啊。”\n\n“我一直都记不住，你不是因为阿波罗计划来NASA的。好吧，好吧，我试着解释一下。上次试着干这事儿的时候，我们输了。很简单，我们开始得太慢了，进度没法儿和德国人争。我们尽力了，但还是失败了。很多人都很痛苦，包括我在内。”\n“更糟的是，整个项目似乎都在那一刻失去了它的重要性。自克尔纳踏上月球的那一刻，发射就开始被推迟，然后遭到取消；资金几乎在一夜之间就全都没了。我们不是什么先驱者，而是失败者。”\n“这还让人明白了一个令人十分不舒服的事实，阿波罗计划从来都无关乎什么科学或者人类成就，那不过是与纳粹竞赛的小小点缀罢了。不然，怎么才能解释在德国成为第一之后，白宫就突然失去了兴趣？”\n\n“我明白，那是段艰难的时期，但现在可是我们的人坐在那张大椅子上，格伦对这些都是认真的。”\n\n“我知道，我知道，我只是没法儿彻底忘了它。”"
 glenn.70.a:0 "“这次我们绝不会搞砸。”"
 glenn.73.t:0 "爱荷华州，比肯斯菲尔德"
 glenn.73.desc:0 "佩吉·惠特森一直都是个小野孩子。基思和贝丝两口子一直都觉得住在农场里很是幸运，他们的女儿有足够大的空间能尽情地四处跑来跑去。可今晚，她却乖乖地坐在家里的老黑白电视机前，完全被画面迷住了。\n\n“这些图像之前从未对公众公开，它们揭示了在宇航员的视角中月球的样子。”破旧的扬声器中传出了夹杂着电波噼啪声的旁白，“地球这颗坑坑洼洼的天然卫星上完全没有生命迹象，也不适合人类居住。然而，人类并非未曾踏足其上。1962年，埃伯哈德·克尔纳成为了第一位登陆月球的人类，在那里插上了德国的国旗。但是，它不会在那里孤单太久！拍摄下这些图像的阿尔忒弥斯计划很快也会将美国宇航员送上月球，在它的旁边插下一面星条旗。”\n\n节目彻底结束之后，佩吉才动了起来。她慢慢站起身，转过身来对着父母，说道：“妈妈，爸爸，我长大后要成为一名宇航员。”她非常自信，仿佛只是在陈述简单的事实，而非一个愿望。\n\n“宝贝儿，你当然会的，可今晚你该上床睡觉了。”基思回答道，把她抱上床，花了点儿时间哄她安生下来。然后，他下楼回到客厅里，说道：“我跟你说，我可从来没见过像太空这样，能让她这么着迷的东西。”\n\n“我也是啊。你知道，珍珠港核爆的时候，我也差不多是她这个年纪。当时，我的世界被彻底摧毁了；时至今日，我也不觉得我彻底摆脱了那种感觉。我在想，这对她来说会不会也是那样的时刻，也许她的人生会与我有所不同。”\n\n“希望别太不一样，”基思微笑着说，“我可不想让她反过来学她爸。”\n\n“唉，你个榆木脑袋，不是那个意思，我是说她会怀抱着更多的希望去看待这个世界。谁知道呢，或许她有朝一日真的会成为一名宇航员。”"
 glenn.73.a:0 "也许她会的……"
 glenn.68.t:0 "力量越大，反抗越大"
 glenn.68.desc:0 "格伦总统坐在椭圆形办公室里，浏览着各种立法文件、白宫西翼的官方报告、共民党官员的信件和消息……等等等等。自从决定委任一名共和党人为参议院道德委员会主席、还有那些个南方民主党参议员那封随之而来的该死信件之后，格伦的脑海中就充斥着思考与疑问：“我应该这么做吗？在我们做了这么多之后，他们真的会投奔NPP吗？”此时，一声巨响将格伦从思绪中拉了出来，他抬头看了看拥挤的办公室门口，梅岑鲍姆正站在那里，身后跟着几位顾问。\n\n“总统先生，我想您得看看这个。”\n\n椭圆形办公室中的一排电视亮起，播放着抗议和演讲的画面。在全国各地、尤其是在南方，都有党员在宣泄由共和党人掌舵参议院道德委员会的愤怒。多位民主党参议员在其选区内发表演讲，号召选民支持，抗议“不公平的党派关系”以及“在腐败调查中针对民主党人的、令人厌恶的行径”；甚至还有一些人当着现场观众的面，宣布正式退出共民党并加入NPP，人群随后爆发出欢呼与疯狂的声浪。媒体已循着气味而来，扑上了这场血流不止的危机，还针对共和党在政府中滥用掌控力严重指控，发布了共和党支持率骤降的民调统计数据。\n\n在房间四周，脚步声不绝于耳，顾问们满头大汗地踱着步子，应付着面前的重压。而以在立法过程中创造奇迹闻名的梅岑鲍姆则呆呆地站着，汗水滑过他的额头。漫长的几分钟之后，他转身询问道：“总统先生，我们该怎么应对这个麻烦？”"
 glenn.68.a:0 "“愿上帝保佑我们，霍华德。”"
 glenn.74.t:0 "军方反对国家核委员会"
 glenn.74.desc:0 "约翰·格伦总统搞国家核委员会的初衷在于兼顾军事与民事需求，毕竟，军队需要强大的武器来从劲敌手中保卫美国，而便宜的原子能可以减少美国对石油进口的依赖并提振经济。按理说，这对所有人来说都是双赢。\n\n然而，显而易见的是，给核委员会的大部分拨款都被投入到了民用领域之中，全国各地都在建造大型反应堆，为家庭和工厂供电。这对公民来说无疑是好事儿，他们看到纳税人的钱得到了良好的利用，帮助他们降低电费，还减少了煤炭以及石油发电厂带来的污染。然而，只有一小部分资金拨付给了军方，用于研究、更新和生产新武器，构建保护美国安全的“核保护伞”。陆海军将领们的抱怨和愤怒在五角大楼中不绝于耳，战略空军司令部更是难愤懑之情。越来越多的人向报纸透露，军方认为他们正在从导弹、潜艇再到战略轰炸机的各个方面日趋落后，美国与德日的军备水平之间很快就会出现巨大的鸿沟。\n\n在这个斥资庞大而饱受争议的项目上疏远军方确实不是个好消息。国会中总统的反对者和各大媒体已经吵着要缩减核委员会的规模，搞清楚规划的轻重缓急，甚至将其全数取消。格伦总统必须着手处理此事，不然他最伟大的项目之一就要泡汤了。"
 glenn.74.a:0 "我们手中的核弹足以毁灭世界，为什么还要更多呢？"
 glenn.75.t:0 "民间反对国家核委员会"
 glenn.75.desc:0 "约翰·格伦总统搞国家核委员会的初衷在于兼顾军事与民事需求，毕竟，军队需要强大的武器来从劲敌手中保卫美国，而便宜的原子能可以减少美国对石油进口的依赖并提振经济。按理说，这对所有人来说都是双赢。\n\n然而，显而易见的是，给核委员会的大部分拨款都被用来发展军事了。武器更新换代、新型炸弹设计、导弹部署、轰炸机生产和潜艇下水等事务花掉了大量资金，而纳税的平民却发现，本来被认为是经济发展的“灵丹妙药”的核委员会，根本就满足不了人们降低电费、减少燃油以及燃煤发电厂污染的需求。从写给各报纸编辑的信到充斥国会大厦总机的投诉，反对的声音越来越大。民意调查表明，国家核委员会越来越不得民心了。\n\n为这个本就斥资庞大而饱受争议的项目跟平民与纳税人过不去实在不是好事。国会中总统的反对者和各大媒体已经吵着要缩减核委员会的规模，搞清楚规划的轻重缓急，甚至将其全数取消。格伦总统必须着手处理此事，不然他最伟大的项目之一就要泡汤了。"
 glenn.75.a:0 "众口难调的道理亘古不变，不是吗？"
 glenn.76.t:0 "油核大战"
 glenn.76.desc:0 "一个半世纪以来，整个世界都依赖着唯一一种能源——石油。即使是在今天，石油也如此重要：石油是经济的关键一环；没有石油，全国的汽车、船只、火车和飞机都要停摆；石油是药品、塑料、合成橡胶的化工原料；火力发电厂用石油为世间万民供电；石油还和天然气一同为人们供暖。可以说，石油工业，就是现代社会的基石。\n\n但是现在，格伦总统大肆施行他的计划，通过国家核委员会把核反应堆建得到处都是，利用核能给全国供电。这已经成为埃森、德士古、美孚、加州标准石油等石油公司的大亨们的心头之患。如果美国不再完全依赖石油供暖、供电，那么市场将在一夜之间蒸发大半，而富豪们的亿万财富将面临灭顶之灾。\n\n分析师们曾预测，核能至少得等几年甚至几十年才可能有实际应用价值，石油公司一直指望着这一天晚些来到。事情本来毫无差错，然后格伦来了，他资助核反应堆建设，于是核能花费大幅地下跌。很快，与继续勘探油井并把油运到发电厂发电相比下，建造巨大的反应堆并在最低限度进行维护，反而显得不费吹灰之力。这简直是挖了他们的命根子。\n\n当然，石油公司可不会说这威胁到了他们的命根子。他们只会宣扬辐射和核裂变的风险，并对比道得州储藏的石油是多么安全；或者他们会说政府应该把钱用到支持私营市场上去。石油大亨将通过空壳公司资助格伦的对手，比如NPP，至少他们不会遍地造核反应堆。\n\n无论如何，一定要挽救这个本世纪以来一直在为美国乃至世界供能的产业。"
 glenn.76.a:0 "石油必须流动！"
 glenn.77.t:0 "别建在我家后院！"
 glenn.77.desc:0 "国家核委员会认定，建造核电站的最佳地点是小城镇、农田及主要城市外缘的那些地区：这些土地更为便宜，更方便获得，也可以为需要工作的地区提供新的就业机会。不过，这些未开发的地区也恰好靠近美国中部的那些标志性的小城镇，还有自从战争后重新定义了美国人生活的广泛郊区，那里居住着许多受过良好教育的美国白人中产阶级。\n\n而在美国的小镇和郊区，很多人真的对他们现在要居住在一个有着冷却塔和巨型反应堆的丑陋而庞大的混凝土建筑旁边感到不快。\n\n他们的忧虑各式各样：丑陋的建筑、降低的土地价值、辐射的威胁、熔毁的风险、核废料的危险、对进一步开发的阻碍、让人不满的现在开发、还有建筑工程的嘈杂声。反对建造新反应堆的策略也是多种多样：在县民或镇民大会抗议、在建筑工地举牌抗议、对施工机器的破坏、在报纸上发表信件、向州议员和当地国会议员施压要求行动。对国家核能委员会的反对正在合并成一个新的运动，它被称为“别建在我家后院”，或称“邻避”(NIMBY)。\n\n虽然新的邻避运动大多是草根和地方组织，也有外部势力正在为这些团体提供资金和支持的谣言存在。媒体的调查通过无数的人和空壳公司的线索来追踪这些资金，最终找到了源头：美国的大石油和天然气公司。但这些往往被埋没，导致那些记者被调任或被解雇的发现丝毫没有影响运动的发展。"
 glenn.77.a:0 "这些人简直是原始人——体规画“圆”，颐指气“使”！"
 glenn.78.t:0 "或许建在我家后院也可以？"
 glenn.78.desc:0 "南希曾经是第一批站出来反对的人，现在她则是最后的反对者。她仍然在大型核电站的门口，举着破旧的牌子，上面写着“对核说不！”的标语前来抗议。自从几年前有关镇子附近将会建造两座核反应堆的消息首次传出以来，抗议人群的数目已经减少了很多。在那时，半个镇子上的好几百号人都会聚集在河边的规划工地上，挥舞标语牌、签署请愿书、还会向他们在国会的代表议员们写信。南希在其中是带头的，她的房子就在规划建造核电站机组的旁边，她也最不希望自己的孩子变异成眼睛凸出、长着三条胳膊的怪胎！\n\n抗议者们强调着自己的担忧，他们也得到了承诺。安保人员让人群远离道路，在一个特别划定的抗议区里活动。尽管呼声和喧闹从未停止，但随着时间的推移，混凝土冷却塔拔地而起，花俏的计算机和电子设备投入安装使用。抗议者的人数开始越来越少：反正这事儿肯定会继续办下去，那又何必继续费心阻挠呢？但南希还有其他几十个人拒绝放弃，可以建起来的东西就可以拆掉。\n\n可是，数周之前的盛大的开放活动成了钉死棺材板的最后一枚钉子：工厂导览、对核电站安全特性的解释在很大程度上抚平了居民的担忧，对当地人的雇用以及新家庭的到来也大幅促进了当地经济的发展，还使当地的学校得以继续维持下去。南希的丈夫很快就拒绝和她一起出来抗议这桩“已成定局的事情”，越来越多的人推脱说他们还有其他事情要做。但南希和她的朋友玛丽拒绝就此屈服。\n\n但约定时间已经过了半个小时了，玛丽依然没有出现。也许她生病了？也许她的儿子有额外的家庭作业要做？也许、也许她也终于放弃了？\n\n南希叹了口气，任凭手中的标语牌砸落在地上，冷却塔顶飘出了一朵无害的废气云。她拎起打包好的午餐，走回了家中。"
 glenn.78.a:0 "一开始我觉得这玩意儿看着直冒傻气儿，但现在我开始喜欢上它了。"
 glenn.79.t:0 "还得花多少钱？"
 glenn.79.desc:0 "“这些个厂子烧的是他妈什么玩意？你在烧百元大钞吗？你的机子都是金子做的吗？为什么这些操蛋的核反应堆这么他妈贵？”满脸气得通红的民主党参议员怒吼道。\n\n“它们这么他妈贵，因为它们本来就是这样。”格伦总统努力保持着冷静并回复道。事实证明，他之所以在生活中能够保持冷静，起了很大作用的正是他驾驶战斗机的经历和宇航员生涯。而作为总统时，面对因国家核委员会开销而发狂的大批民主党人的经历，一定也有着相同的作用。“如果我们不花钱确保它们安全可靠，我们到时候就得花更多钱来修复它们……情况可能还要更糟。”\n\n“这操蛋的核计划就是个吸预算的无底洞，”另一个参议员说道，“总统先生，我们不能一直为了你这些个指望天上掉馅饼的项目借钱。”\n\n“这些核电厂在工作寿命内肯定会回本。花三四十年，”格伦答道，“换来更少的能源消耗、更小的污染、更健康的人民。到时候我们不用花钱买阿拉伯或者伊朗的石油，而且我们的军队也会更强大，美国也会更强大。”\n\n“你说的都不错，总统先生，”第二个参议员说道，“但是咱们得为钱操操心了，为了建这些个厂子，我们现在还得借更多钱，欠一屁股债，丢给子孙来还，而这些就为了建成几个花哨的发电厂。”\n\n总统倒吸了一口凉气：“我非常理解你们的担忧，先生们，我会牢记这些的。谢谢你们的批评建议。”\n\n民主党参议员们互相使了个眼色，纷纷走出总统办公室。确实，总统听到了这些意见……但他真的听进去了吗？"
 glenn.79.a:0 "未来可能会亏钱，但毕竟能建成花哨的核反应堆嘛。"
 glenn.80.t:0 "来自参谋长联席会议的一封信"
 glenn.80.desc:0 "“总统先生，我今天收到了参谋长联席会议的一封信。呃……还是请您自己看吧。”国防部长塞勒斯·万斯说道，将一封长达数页的信件递给了约翰·格伦。\n\n格伦接过信件，在阅读的时候不由皱起了眉：“所以他们对政府专注于核弹感到很生气？但这正是他们想要的啊！”\n\n“但他们对五角大楼大发脾气，因为我们没在其他方面上也花这么多的钱：坦克、飞机、航母，基本上都是跟核不沾边的东西。”万斯部长叹了口气，“似乎永远都没办法让那些肩上扛着将星的老小孩们舒心满意。给他们核弹，他们就要坦克；给他们坦克，他们又要直升机，总之就是一直都吵个不停。”\n\n“是啊，他们都有自己的想法，什么东西能赢得下一场战争、什么又不能，他们的观点还都各不相同。”格伦说着，放下手中的信件，揉了揉自己的额头，“所以他们什么东西都想要一些。”\n\n万斯部长点了点头：“但我们不能这么做。要是继续找国会老爷要钱，他们肯定会大发雷霆。除非从国家核委员会那儿弄钱，但这也会减缓新反应堆的建设。”\n\n格伦转动自己的大椅子，看向窗外的玫瑰园，在脑海中思索着选择。要求国会为军队提供更多资金，他们肯定不会因此而高兴；转移核委员会的资金，但这会拖慢新反应堆还有核项目的建设和发展；或者就干脆跟参联会说实话，可这也会让他们比现在还要暴脾气。\n\n这样的日子里，格伦真的很希望他仍然还是一名宇航员。"
 glenn.80.a:0 "军方的经费已经足够多了。"
 glenn.80.b:0 "我认为可以稍微裁去一些核计划。"
 glenn.80.c:0 "国会决不会拒绝花钱的机会。"
 glenn.81.t:0 "五角大楼的喧闹"
 glenn.81.desc:0 "五角大楼里，消息传播得很快。足足两万多人在这座世界最大的办公楼中工作，新闻、流言、八卦小道总是不胫而走。但是，政府由于国家核委员会项目的开支而不向国防部划拨额外资金的消息正在像野火一样蔓延开来。各位上将一想到他们钟爱的那些个项目、那些肯定会在美国未来面临的任何战斗中带来胜利的计划，仍然没有得到需要的资金，就感到异常愤怒。与之相反，他们得到的只有更多的核弹头、搭载核弹头的导弹、投掷核弹头的轰炸机、还有水下携带核弹头的潜艇。核弹的问题在于，它是拥有强大破坏力的重锤，但有时你需要的只是苍蝇拍而已。一些人议论说，格伦总统，这位战斗机飞行员出身的战争英雄、勇敢无畏的宇航员，已经忘记了自己的出身，他身居白宫之中，忘记了什么才是在保卫美国中真正重要的东西。\n\n然而，大楼里的每个人，从处理征兵文件的办公文员到参谋长联席会议主席，他们都知道不能对没有得到更多资金透露出不满情绪。他们要是想拿到这笔钱，国会肯定会在委员会会议上把他们活活架在火上烤，公众也不会太热衷于为更多的实验项目纳税买单。\n\n因此，虽然他们脾气仍然很大，五角大楼中依然只传出了一丝小小的波澜，但这并不意味着三军将士们就开心了。甚至国防部长和总统本人也明白，对军队的奖励有些滞后了，士气正因此越来越低落。当然，目前的预算固然很不错，士兵们仍然拥有最尖端的装备，比世界上任何其他国家的武器都要更优秀……但它总归还是能更上一层楼。"
 glenn.81.a:0 "我猜，双炮管悬浮坦克的计划又要延期了。"
 glenn.82.t:0 "调整优先级"
 glenn.82.desc:0 "有传言称，军方对划拨予国家核委员会花在核武器及其运载系统上的额外资金不甚满意。原因在于，所有用在核反应堆以及研究的额外资金都会削弱美国在常规武器上的优势：也就是用于小规模战争的坦克、飞机和舰船。\n\n如果的确如此，那么今天发布的简短新闻应该会让怀揣着类似担忧的将军们感到高兴：一部分原先预定用于建造核反应堆以及核能研究的资金被认为“在当下不会带来什么利益”，因而转移到了其他数个“有前景的常规武器系统之上，以此保持我国军力的强大”。\n\n国家核委员会仍将在未来继续开展工作，但一部分原本用于规划设计尚未开始动工建设的核反应堆以及项目的资金将遭到截留，转移到国防采购项目上面。正在建设中的核反应堆及设施将继续推进，但较新的建设则会在未来放缓。\n\n消息传出后，五角大楼中的气氛平静了许多，也轻松了许多。显然，总统并不打算背弃在这个动荡的世界里保卫美国的人们。从列兵到上将，最高统帅的支持激励了全体官兵的士气，他将保卫美国放在职责的首位，而不是其他。"
 glenn.82.a:0 "美国今天是强大的，她将会一直强大下去，直到永远！"
 glenn.83.t:0 "他现在想花多、少、钱？"
 glenn.83.desc:0 "椭圆形办公室外的电话铃铃作响，即使工作人员已经竭尽全力去应付，但白宫总机依然在超负荷运转。电报信件纷至沓来，抓狂而焦躁的官员们正在尽力阅读并总结摘要其中的内容。总的来说，格伦总统提出的开支法案、也就是[GetYear]年的《扩大国防法案》、旨在为军队划拨更多军费，但它并未得到良好的反响。\n\n众议员们在国会会场中集结起来反对总统，各位参议员则要求面对面开会以陈述他们的不满。国会中为数不多的鹰派几乎完全被边缘化，民主党、NPP中间派以及其他对手正在共同努力，试图控制住这位似乎已经脱缰的总统。\n\n“总统正在要求纳税人继续把他们辛苦赚来的血汗钱扔进他那些个虚荣项目的无底洞里。对遥远星球的太空探索、为每个家庭提供核反应堆、现在又要求我们给每个士兵都发一辆凯迪拉克！”一位众议员在会场中大声疾呼道，“我们要怎么才能付清这些钱？纳税人已经被榨干、我们已经借了比合理借债还要多得多的款项。我们当然能开动印钞机，但这将会导致恶性的通货膨胀。所以，唯一的答案就是，停下来！”\n\n“我赞成为士兵们提供保护美国的装备，我也赞成我国要建设基础设施、推动前沿知识的发展。”一位支持格伦的议员在《纽约时报》的专栏文章中撰文称，“但最终，我们必须要脚踏实地，不能为了完成这些事情而让国家破产。”\n\n民调显示，总统的支持率正在动摇，共民两党之间一贯微妙而脆弱的联盟正趋于破裂。这项新法案若是想要在国会获得通过，那就需要付出巨大的努力。"
 glenn.83.a:0 "对政府来说，债务只是个数字罢了，不对吗？"
 glenn.85.t:0 "扩大国防法案通过！"
 glenn.85.desc:0 "投票结果很接近、接近得令人难以置信。格伦总统的《扩大国防法案》在各方的激烈反对下得以通过的，这将成为今后几代政治学学生研究如何通过国会立法的经典一课。\n\n该法案承诺划拨数亿美元的资金用于不同项目之中，一些是需要几十年才能显现成果的尖端科技研究，一些计划对现有载具车辆进行改装翻新、使其达到更高的标准，更多的则是要重建全美各地军事基地的营房以及训练设施。\n\n然而，该法案的成本远远高于上述美元的价值。为了这份法案能够获得通过，其中塞进了大量政治分肥以吸引某些国会议员。毕竟，要是一份庞大的预算法案里恰好能有资金为他们的选区建造崭新的桥梁、医院或者高速公路，又有谁会投票反对呢？国会中的共和党人似乎毫无节制，兴高采烈地将数十亿美元投入总统想要以及需要的一切。民主党人正在脱党，总统在全国的支持率正在走低；NPP则利用这一良机，大肆宣扬着总统的支出将会怎样破坏经济，像欧洲的独裁者一样，为了他自我的满足感建造巨大而又荒唐的奇观。\n\n这一天结束的时候，虽说支持率下降、债务飙升、各路政客对他炮轰不止，但格伦总统至少还能感到一丝满足，因为他知道，至少还有军方真诚地感谢他的支持与资助。"
 glenn.85.a:0 "我真心希望你喜欢你的新玩具，将军……"
 glenn.86.t:0 "扩大国防法案未获通过！"
 glenn.86.desc:0 "现在回想起来，这似乎不可避免。来自选民和国会的反对意见太过强烈，《扩大国防法案》在国会毫无胜算。参议院的冗长演说阻挠持续了好几天，参议员们轮流站上讲台，并且还拒绝停下，滔滔不绝地大谈特谈。甚至就连总统最坚定的支持者中都有人更关心在下次选举中保住自己的席位，因此选择了弃权乃至投票反对。\n\n但是，对于所有其他支持格伦总统雄心勃勃的议程、让他成功当选的选民们来说，这也有些太过分了。他已经在NASA、国家核委员会还有所有他赞成的计划和项目上花了好几十亿美元，人们不愿意再花更多的钱了：更高的税收、更多的债务以及账面上不断攀升的赤字带来的恐惧已太过沉重。\n\n但对总统来说，最大的损失还是他在军队中的地位。法案失败已经在军事部门中引起了巨大的冲击：美国怎么才能在纳粹的新锐飞机、日本的先进战舰面前保家卫国？美国怎么才能计划在不引爆核战争的前提下打赢下一场战争？愤怒聚焦在总统身上，而非锱铢必较的国会。这是格伦的错，他把时间和精力都集中在核电站和轰炸机上，而不是陆海空三军的实际需要。他向军队承诺过那么多，要为他们提供更精良的装备、更科学的训练和更好的住宿条件。然而，他却失败了。"
 glenn.86.a:0 "我要把自己发射进太空里，至少没人会在那儿对我大喊大叫。"
 glenn.87.t:0 "赤字"
 glenn.87.desc:0 "《华尔街日报》在头版头条上大肆报道着：“五角大楼宣布数十亿美元铀矿大单；赤字进一步修正”。格伦总统在电视上看到，财政委员会中的共民党参议员们的脸色苍白，NPP抨击着政府缺乏财政节制的行为，还引用了坊间人尽皆知的说法：“格伦的火箭飞船，屁用没有。”\n\n“不是火箭飞船，”格伦嘀咕着，“是核动力火箭飞船。”\n\n财政部长雅各布·贾维茨咳嗽着举起了手：“他们说得很有道理，总统先生。在上财年里，我们已经对预算估计进行了三次修正，华盛顿的红墨水都要不够用了——”\n\n格伦总统捏了捏鼻梁：“别说了，这个问题已经讨论过了，我们不会削减核项目。看在上帝的份上，我正在努力打赢冷战，要是在原子弹储备上落后，我们就赢不了。”\n\n贾维茨脸上的青筋抽动了一下，副总统戈尔当起了和事佬：“说句实话，约翰，你真的还想向参议院解释另一项预算修正吗？NPP绝对会利用这个大好机会的。”\n\n格伦用手指敲打着桌面，在脑海中盘算着数字。科研费用永无止境；军备开支可以削减，但只能随时间慢慢减少；那么，剩下的就只有……"
 glenn.87.a:0 "我们得在铀矿上想办法！"
 glenn.88.t:0 "老鹰抓小鸡"
 glenn.88.desc:0 "“这可不是上周谈成的价格，你个王八蛋！”格伦对着话筒大吼道。“你告诉我为什么一磅铀的要价一晚上涨了快一倍！”\n\n“总统先生，不要不讲道理啊。”电话那头圆滑的声音慵懒地回答道，“这可是生意，我现在告诉你吧：你要求的降价一时半会内做不到。”\n\n“你一直解释不了为什么价格在上涨，别顾左右而言他。”格伦怒斥道。\n\n“好啊，如果你想让我们试图降低成本，那我们就需要更大的矿山和更多的现代化提纯设备。”对面的声音丝毫不带感情地冷笑着，“而鉴于你搞出来的那些财政赤字，我们不认为你会对联邦合资公司予以支持。”\n\n“所以说你一点也不想着解决问题，而是在向政府敲诈。我真谢谢你啊。”格伦恶狠狠答道。\n\n那边的声音变得强硬了起来。“总统先生，你依赖着我们。你在逆天行道，而我们掌控着北美所有的铀生产商。你败局已定，别做无谓的尝试了。”"
 glenn.88.a:0 "你现在归我了！"
 glenn.88.b:0 "……好吧，我们来谈谈。"
 glenn.89.t:0 "现实的苦药"
 glenn.89.desc:0 "纽约电——大宗商品市场长舒一口气，格伦政府明确否认了最近有关将为政府核能项目而夺取铀矿控制权的流言。各大矿业公司的预期收入达到了创纪录的高度，股票因此大涨，国债收益率则由于预期中的又一轮预算修正而飙升。\n\n分析师们对矿业巨头与政府之间的谈判濒临破裂之时达成的最新决断看法不一。虽然经济学家对联邦政府没有出手干预商品市场表示欢迎，但政治分析师则警告，这带来的影响将会反映在预算数额的增加之中，即使格伦政府仍在努力向国会解释其财政政策，税率也必定会提高。\n\nNPP领导层对此作出了迅速的反应，其评论称：“尽管共民党不断标榜自己是负责任的治国政党，但格伦政府花掉的美元数额无疑异常令人震惊，尤其是它们还被花费在未经证实、未经测试的毫无价值的事务之上。”"
 glenn.89.a:0 "好事得恶果。"
 glenn.90.t:0 "格伦夺取铀矿！"
 glenn.90.desc:0 "“……考虑到核项目在国家安全上的压倒性地位、以及某些私营铀生产商的行为完全不符合公共利益，因此我决定，根据《国防生产法案》的授权，联邦政府将会把某些铀的生产和提炼置于公共部门管理之下，即刻生效……”\n\n尽管这一声明的措辞平淡无奇，但却不啻于一声枪响，回荡在华盛顿和纽约的上空。有消息称，格伦政府很快就将发布行政指导意见，没收全国各地铀矿的所有权——即便和平时期也是如此，道琼斯指数因而跳水式下跌。到了下午，国会大厅中吵闹喧嚣，商业游说团体冲进见客的国会议员办公室里，要求对格伦总统的“社会主义疯狂”做出解释。\n\n矿业公司的反应各不相同，他们很快就收到了政府告知新管理层人选的通知。有几家公司在一天以内就脱离了大队伍，寻求与格伦政府达成妥协，至少还能保住他们管理层的职位。然而，到了晚上时，大多数受到影响的公司都召集法务顾问在纽约召开了新闻发布会，谴责政府的行为，发誓决不会不战而降。"
 glenn.90.a:0 "他们不会悄无声息地离去……"
 glenn.91.t:0 "采访中的焦虑不安"
 glenn.91.desc:0 "华盛顿电——共和-民主党内的两院议员对格伦总统宣布在全国范围内将铀矿收归联邦政府所有一事尚未达成统一立场，同时，政府正在努力为其迅速发展的核项目提供资金。在国会中，我们能听到对政府决定感到困惑、或是公开对此予以批评的共民党参议员们的声音。\n\n一位拒绝透露姓名的参议员称：“当我听说总统要扣押私有财产的时候，我和你们所有人都一样惊讶。在这个国家里，如果你想要什么，那就得付钱。但这么做？这可不是美国人的做派。”\n\n“总统一直都是一位梦想家。有时候，这带领着他向着星星前进——但有时候，他也会因此踢开自己脚下的梯子，然后重重地摔到地上，屁股落地。”一位众议院委员会主席给出了这样的评论。\n\n还有一位共民党高级助理则不无感叹地说：“我不明白，格伦总统究竟想要由此走到哪一步？他将不得不在法庭上为自己的行为做出辩护，可就算他能在最高法院赢得胜利，美国的工业界又怎么会继续相信他呢？这很可悲，真的。”\n\n尽管共民党领导层对总统出于“国家安全”利益而对美国企业进行前所未有的干预保持着沉默，但党内的声音应该会让总统明白，党正因他的所作所为而日益紧张不安。"
 glenn.91.a:0 "他们没有看到未来！"
 glenn.92.t:0 "矿业公司提起诉讼！"
 glenn.92.desc:0 "“我们强烈抗议政府在私营企业问题上采取的史无前例的行动，并且明确表示，原告认为政府的行为严重超越了宪法赋予其的权力，必须立即由法院予以解决……”矿业公司的首席法务顾问在热切的记者们面前公开与格伦政府宣战，他们都期待着华盛顿即将到来的公开回应。\n\n“尽管让他们来吧。”格伦总统喃喃自语，目光从椭圆形办公室的电视屏幕上移向了聚集在一起的内阁成员。房间里的人都没有动摇：在格伦决定将铀矿收归联邦政府的那一刻，他们就已经对一场激烈法律斗争将会来临的可能性达成了共识。\n\n戈尔副总统环视了一下房间，说道：“约翰，不成功便成仁。他们有足够的法律火力展开激烈的斗争，而且这已经引起了最高法院的兴趣。可能几天内就会进行口头辩论。”\n\n格伦点了点头，现在已经没有退路了。他们必须与律师们一起熬夜，努力赶上大公司手中掌握的资源，更何况现在最高法院也参与进来了，全国的目光都聚焦于他们。"
 glenn.92.a:0 "“别太有压力。”"
 glenn.93.t:0 "铀矿案——过为已甚"
 glenn.93.desc:0 "初级股票经纪人杰罗姆·布什威尔正在休息室里喝咖啡，电视上播放着当天的重要新闻。\n\n“……政府和铀矿公司双方都在为案件做准备，本案无疑将决定，联邦政府出于国家安全利益原因而对工业拥有的权力能达到哪一步……”\n\n“我可不知道你还关心矿业政治啊，布什威尔。”他的上司、资深交易员亚伯拉罕·阿布尔沃斯此时侧身走进了休息室，布什威尔差点就吓得跳了起来。\n\n“是啊，我本来还打算在之后涉足金属产业领域的，您知道吗？”布什威尔说道，紧接着又叹了一口气，“说实话，我真的不知道政府到底在想什么，要拿这些公司开刀。”\n\n阿布尔沃斯点了点头：“没错，这也是客户们整天都在问我的问题。反驳他们的观点很是困难，因为明天他们可能就会变成案板上任人宰割的鱼肉。”\n\n“如果总统认为他能绕过国会和宪法、毫无理由地剥夺私有财产，那他可就打错算盘了。”布什威尔说道，“我觉得从前的革命就是为了干掉这样的狗屎玩意儿。”\n\n阿布尔沃斯笑着回应道：“是的，但好吧，不要把希望寄托在革命重演上。我不认为会有人对总统为了虚荣心而公开扣押私有财产的先例感到高兴。”"
 glenn.93.a:0 "骄兵必败……"
 glenn.94.t:0 "铀矿案——矿业的吸血鬼"
 glenn.94.desc:0 "初级股票经纪人杰罗姆·布什威尔正在休息室里喝咖啡，电视上播放着当天的重要新闻。\n\n“……政府和铀矿公司双方都在为案件做准备，本案无疑将决定，联邦政府出于国家安全利益原因而对工业拥有的权力能达到哪一步……”\n\n“我可不知道你还关心矿业政治啊，布什威尔。”他的上司、资深交易员亚伯拉罕·阿布尔沃斯此时侧身走进了休息室，布什威尔差点就吓得跳了起来。\n\n“是——是的，我本来还打算在之后涉足金属产业领域的，您知道吗？”布什威尔不安地笑了笑，“可老板，政府还是有这个权利的。”\n\n阿布尔沃斯仔细地打量了一会儿布什威尔的神色，然后叹了口气：“撇开我个人的感受不谈，国有化对企业并不是有利的事情。”\n\n“呃，是的，但政府是想以此让核业务成功落地推进，凭借它打败德国人和日本人，对吧？但这些公司却还在威胁着漫天要价，我可想不出来会有多少人站在公司一边。”布什威尔大胆地说道，“老板，您说的是——公司的路线吗？”\n\n阿布尔沃斯小心翼翼地维持着中立的表情，因为此时电视里的画面已经换成了格伦总统。“是啊，这就是官方的路线。”阿布尔沃斯给自己倒了一杯咖啡，在杰罗姆对面坐了下来，“不过就我个人而言，我一点儿都不相信这套说辞。”"
 glenn.94.a:0 "“舍不得孩子套不得狼。”"
 glenn.95.t:0 "铀矿案——半斤八两"
 glenn.95.desc:0 "初级股票经纪人杰罗姆·布什威尔正在休息室里喝咖啡，电视上播放着当天的重要新闻。\n\n“……政府和铀矿公司双方都在为案件做准备，本案无疑将决定，联邦政府出于国家安全利益原因而对工业拥有的权力能达到哪一步……”\n\n“我可不知道你还关心矿业政治啊，布什威尔。”他的上司、资深交易员亚伯拉罕·阿布尔沃斯此时侧身走进了休息室，布什威尔差点就吓得跳了起来。\n\n“是——是的，我本来还打算在之后涉足金属产业领域的，您知道吗？”布什威尔不安地笑了笑，“可老板，政府还是有这个权利的。”\n\n“哦？”阿布尔沃斯仔细打量着布什威尔。“国有化对企业或投资者来说可不算什么好事。”\n\n“当然，但到底是谁在买铀呢？”布什威尔壮着胆子说道。“政府的核计划是唯一需要这么多铀的项目，这些公司就像卡特尔一样哄抬价格。国家安全的理由已经坐实了。”\n\n“嗯。”此时电视里的画面已经换成了格伦总统，阿布尔沃斯面露难色，“我信不过格伦。他会为他的登月计划做任何事，而且建造导弹和核反应堆需要的远不止铀。记住我的话，他会在此之前把市场榨的一干二净，而忠实的美国人将为此受苦。”"
 glenn.95.a:0 "“可就算如此，这些铀矿公司也太过分了。”"
 glenn.95.b:0 "“我觉得本应有更好的解决办法。”"
 glenn.96.t:0 "口头审理"
 glenn.96.desc:0 "大法官们入庭时，美国最高法院的法庭中一片肃静，空气中只能听到双方在最后关头翻阅己方文件时发出的沙沙声响。庭审不允许记者拍照，大法官们在庄严肃穆的宁静中各自入座。\n\n大法官首先示意司法部副部长代表政府作陈述：“各位大法官，从革命战争时期的对农产品的征用、到上次世界大战中对重要产业的控制，我们必须坚持认为，政府拥有干预私营企业的惯例权力，以明确服务于国家安全以及当前的冷战危险……”\n\n在对历史先例进行广泛总结之后，司法部副部长回到了座位上。大法官们简短地商议了一下，然后示意原告方做开场陈述。原告代表轻轻咳嗽了一声，说道：“政府称，它有权力为了国家安全而扣押私有财产，但您一定能够认识到，这就是一种滑坡谬误。政府是否要辩称，在尚未大规模动员部队以及武器装备的情况之下，国家在当下面临着类似上次战争中的严峻危险？先例不足以佐证如此重大、如此激烈的行动；在没有可援引先例的情况下，我还必须要强调，没有任何授权的成文法令……”"
 glenn.96.a:0 "我们拭目以待……"
 glenn.97.t:0 "扫清障碍"
 glenn.97.desc:0 "最高法院已经下达了判决，现在，艰苦的工作要开始了。\n\n数十位联邦政府官员匆忙聚集在华盛顿重新调整了用途的办公室里，准备接受命令，前去派驻全美各地惨遭失败的矿业公司的总部以及分公司。联邦政府终于如愿以偿，获准授权组织管理全美的铀生产，这是自第二次世界大战结束以来，国家安全权力前所未有的扩张。\n\n商业媒体自然叫苦不迭，《华尔街日报》的社论版上刊登了他们董事会言辞激烈的警告：“总统权力的扩大是最新一次对美国自由的放弃。”\n\n“这可真是他们琢磨出的新闻标题里第二好的，仅次于’格伦赢得总统任期‘。”格伦打趣着说道。\n\n“我还是不敢相信，我们真的成功了。”财政部长贾维茨满脸笑容，几个月之前，政府财政还摇摇欲坠，他在那时很少能笑得出来，“现在，矿业公司将不得不服从命令。他们可能会试图阻挠，但法律的力量在我们这边……”\n\n格伦轻松地笑了，他把盖洛普咨询公司的最新民调递给了贾维茨——支持率稳步上涨五个百分点：“有了这些数据，他们就不会再反抗了！要是他们现在还认为违法能有用，那就得做好最坏的打算。”"
 glenn.97.a:0 "要么跟上时代，要么遭到抛弃！"
 glenn.98.t:0 "进步的代价"
 glenn.98.desc:0 "最高法院已经下达了判决，白宫中萦绕着沉闷的阴霾。\n\n大法官不顾在国家安全事务上对总统权力的传统尊重，选择坚决支持矿业公司。他们认为，将铀矿收归联邦没有合理的法律依据——夺取私营企业供国家使用是背离自由、走向暴政的第一步。\n\n“法院今天唯一保护的自由，就是垄断者敲诈政府的自由。”格伦酸溜溜地说着。矿业公司在法庭上赢得胜利之后几乎没浪费任何时间，他们向政府提交了新的铀矿合同——价钱已经涨了三倍。\n\n戈尔副总统揉了揉自己的眼睛，他为最高法院的庭审做了好几天的准备，眼珠子都要陷进眼窝里去了：“我希望这就是最后的坏消息，但盖洛普咨询公司给我们提供了最新的民调数据。”他把一沓文件递给了格伦，后者在翻阅时的脸色逐渐阴沉下去。\n\n“公众对政府执行政策的能力缺乏信心、经济学家对财政恶化表示担忧、专家对司法部无力在争端中取胜感到焦虑不安……”格伦带着难以置信的情绪阅读着这份摘要，然后把它扔进了垃圾桶，“有时候，我真觉得我们高估了普通美国选民的智商。”"
 glenn.98.a:0 "总统先生，可千万别让他们听到你说这话！"
 glenn.99.t:0 "白宫危机"
 glenn.99.desc:0 "大事不妙。\n\n先不说别的，就白宫一开始的那个计划——建立我们自己的核武库，破坏我们对手的核武库。\n\n但并不意味着这个计划是完美的。\n\n很明显，现在政府对这项计划如何发挥作用过于乐观。白宫西翼的电话铃响得厉害，仿佛随时要着火一般。各级官员匆匆忙忙地开了一个又一个会议，向所有人保证，虽然眼下的形式很紧张，但政府正在竭尽全力确保美国的安全。政府官员们好似跌入了水中，但他们不是优雅的天鹅，而是要尽力挣扎才能不让水面没过头顶。或者说，其实他们更像是一条条刚被扔到陆地上的鱼，惊慌失措地扑打着，但却不知如何是好。\n\n这就是坐在椭圆形办公室的办公桌后，格伦总统的感受。还好，最糟糕的危机已经过去。尽管如此，他仍然坐在办公桌后面，而不是躲在五角大楼的某个地下室里。因此，在某种程度上，进展还是有的：起码今天没有爆发核战。\n\n但这也意味着总统必须考虑后果。\n\n格伦的办公桌前，站着一位国务院里西装革履的官员。这位外交官告诉总统，在世界各地，美国大使馆都被关于到底发生了什么以及为什么的询问淹没了。于是他问格伦：\n\n“总统先生，我们应该如何向大家解释？”"
 glenn.99.a:0 "“可恶，告诉他们，我们正在想办法解决。”"
 glenn.100.t:0 "结束核建设"
 glenn.100.desc:0 "椭圆形办公室里，行政命令正摆在格伦总统的办公桌上，等待着他的签署：下令终止各个核建设项目。政府也许曾经乐观地尝试过，站在实力的立场上强制进行核裁军：实现战略优势，并以此为倚仗实现全球范围内的裁军。可现在，事态峰回路转，这个战略再次变成了它曾经的模样：一个想法、不切实际的想法。国际和国内的局势都处于紧张之中，非常地紧张。\n\n格伦回顾着这个适得其反的策略，他觉得自己就像是牌桌上的一个赌徒，亮出了自己的牌，却发现对家手里一直都捏着一副皇家同花顺。也许真相没有那么富有戏剧性，他并非自一开始就误判的局势，只是运气不好罢了；或者，总统的策略注定要失败，因为它建立在摇摇欲坠的基石之上；又或者，也许这个想法合情合理，但只是执行上出了偏差。但现在，这些都不重要了，它们只是供未来的历史学家们思索研究的材料而已。\n\n总统的笔尖刷刷抖动，木已成舟，格伦总统设想中扩大美国战略核武库的计划就此宣告结束。随着这一篇章的终结，另一个崭新的篇章拉开了帷幕：这不是格伦期待之中的未来。\n\n收拾这个烂摊子。"
 glenn.100.a:0 "痛苦却必要的一步。"
 glenn.101.t:0 "向盟友许诺"
 glenn.101.desc:0 "“总统先生，你这是在用人命玩火！”这位共和党众议员怒吼道，他是今天第三位得以与总统短暂面对面会谈的人。格伦总统坐在办公桌后耐心地听着，然后对自己的立场做出解释，并且礼貌地提醒他的客人，总统还有其他事情要做——尤其是在这样的危机时刻。这已经是总统在一天里第三次运用这套说辞了。\n\n所有到访的参众议员前来的目的都是为了表达他们对政府外交政策的关切。格伦之前在刀尖上跳舞，冒着将世界带进核末日的风险，可他并没有从最近的危机中学到任何东西。\n\n格伦之前就听说过这些。\n\n然而，总统还是不得不在椭圆形办公室接待他们，这只是为了向政党表明他认真考虑了党内的担忧与关切。他对此心知肚明，毕竟，最近的危机让白宫陷入了混乱，政府在那时曾经考虑过做出鸽派的反应。现在，有好几十桩自己党内的要求需要他来协调。\n\n格伦总统倾听并耐心解释着为什么他认为这是最佳的行动方针：我们必须坚持信念，不能让对和平的热爱嬗变成对行动的恐惧。某些人听进去了这番话语，一小部分人得以被说服。但到了最后，总统清晰地意识到，至少在政治方面，他的政策付出了沉重的代价，党内的分歧正越来越大。"
 glenn.101.a:0 "做正确的事情并不容易。"
 glenn.102.t:0 "终于，走出困境"
 glenn.102.desc:0 "白宫西翼大厅中，交谈声依旧不绝于耳，但有些事情已经发生了变化。电话不再像几天前那样不停地轰鸣，也不再有愤怒的参议员要求与总统一对一会面交谈。当然，这并不是说再也没有电话打进来，实习生和助手们仍然在各个办公室之间来回穿梭；然而，来电正在一天一天地减少。渐渐地，大家意识到政府正在重回正常的工作程序。一周之前，白宫还处于俗话说的“红色警戒”之中；现在，警戒无疑已经略微放松：或许已经变成了橙色？\n\n经过几周的损害控制和危机公关之后，身心俱疲的白宫官员们终于松了口气，他们可算是能睡个好觉了。总统也是如此，在一场接着一场的危机内阁会议之后，他也慢慢重新适应了和平时期总统日常工作的节奏，回归到了相对舒适的政府常规工作之中。\n\n公众不会很快就淡忘发生过的一切。我们已经站在了悬崖边上，比长久以来的任何时间都要更接近危险，但现在还不是休息的时候。所有政治家都知道，政治只是从一个危机来到另一个危机，相对而言的平静连缀其间。这场危机已经过去了，但我们必须在下一场危机来临时做好准备。或许更重要的是，随着重回正轨，现在是时候该重新着手治理国家了。\n\n格伦还有一个国家要去治理。"
 glenn.102.a:0 "而国家可不会自己管理自己。"
 glenn.103.t:0 "不幸的事故"
 glenn.103.desc:0 "首相，我们刚刚收到了中国发来的报告。今天凌晨发生了数起不幸的事故，警察部队随后进入了高度警戒。我国在中国大陆上的三处铀矿遭受了重大损失，没有抓捕到任何犯罪分子，他们在当地警方作出反应之前就逃离了现场。雪上加霜的是，另一处也位于中国的铀矿被彻底摧毁，数名工人当场死亡；一支负责从中国向本岛运输铀的车队也遭到了袭击。\n\n现在唯一的线索就是，所有的破坏都发生在短短数分钟之中；显然，它们之间存在着联系。我们怀疑中国日益增长的动乱是其中的罪魁祸首，但我们仍将对可疑活动展开进一步调查。虽说遭到破坏的铀供给可以恢复，但工作无疑需要一段时间。就在我们交谈的时候，工人们已经开始修复被破坏的铀矿，但我国核武库仍需时日才能恢复全盛期的实力。"
 glenn.103.a:0 "真是不幸。"
 glenn.104.t:0 "麻烦接踵而至"
 glenn.104.desc:0 "首相，很遗憾告知您，我国位于中国的数处铀矿在发生在东亚的一系列破坏性袭击中遭受了重大损失。据报告，三处矿井受到了“相当大的破坏，但尚可修复”，第四处矿井则已“完全被毁”。不幸的是，破坏分子在当地警察抵达现场之前就已逃之夭夭；然而，鉴于这些袭击均在前后短短几分钟之内相继发生，有充分理由认为它们之间存在联系。\n\n我国外交官对全球各地的铀矿中发生的一些奇怪事件进行了长期调查。据报告，许多铀矿都发生了事故，铀的贸易路线已暂时停滞。但直到我国的铀来源在今早突然遭到袭击，共荣圈内才发生了类似这些事件的报道。总体而言，铀的流通量似乎正在减少；这消息来得不是时候，我国正需要比之前更多的铀矿以维持核武库。\n\n高级军事顾问请求对今早发生的犯罪行为展开进一步调查，并逮捕犯罪分子。然而，这可能会迟滞矿场的修复工作；虽然这需要一些时间，但我国仍能重新获得铀矿供给。当然，我们也可以选择无视这些破坏，专注于铀矿场的重建。"
 glenn.104.a:0 "立即进行调查。"
 glenn.104.b:0 "我们可以暂时无视这个情况。"
 glenn.105.t:0 "惩妖除魔"
 glenn.105.desc:0 "过去几周里，我们一直在监控某些涉及我国铀供应的奇怪事件。就在昨晚，一场大爆炸严重破坏了一处铀矿场，不少工人因此死亡。对爆炸事件的调查表明，这并不是意外：几名渗透者远程操控爆炸，炸毁了该矿场。我国最优秀的调查员竭尽所能找到了一个可能的嫌疑人，但调查没能得到任何结果。高层政治家和领导人对缺乏证据感到愤怒，我国在世界舞台上的声誉正蒙受着攻击。某些外国官员开始相信，我们无法完全掌控自己国家——必须得尽快将这些恶毒的破坏者绳之以法。\n\n就目前而言，由于我国铀供应遭受了相当大的冲击，核武库储备必将因此而受到影响。这是个艰难的决定，但也许我们可以在等待国内情报部门完成任务的同时，投资其他的军事资源。警察部队已经得到命令，矿区周边的安保已大大加强。\n\n我们需要更加留心目前尚存的铀矿供给，保证核武库不会遭到更大的损失。"
 glenn.105.a:0 "让那些破坏者见鬼去吧！"
 glenn.106.t:0 "惯犯"
 glenn.106.desc:0 "如果您前几周就一直在关注我们的报道，那您肯定知道我国在当地的铀矿受到了一伙神秘人的攻击，他们显然是要蓄意破坏我国的核武库。自从这些攻击发生以来，我国最优秀的调查员一直在寻找线索；最终，他们查明了这伙丧心病狂的破坏分子的身份。\n\n没错，要对这一令人发指的行径负责的不是别人，正是威胁要推翻政府的美国阴谋家！昨天深夜，这群美国人正准备开始对位于西部的矿区展开另一次攻击时，几位警官把他们抓了个现行，打晕之后送给了调查组以确定其身份。\n\n“这是美国政府犯下的严重外交错误，我们保证他们会为其犯下的国际罪行付出代价。”一位国内官员在第一次听闻这条消息时如此说道。\n\n有二十名工人在对矿区的袭击中遇害，另有一百人受重伤。另一位官员在接受本台采访时表示称：“美国人不仅犯下了毫无意义的罪行，而且，这很可能还是针对我国民众的战争行为。”\n\n一旦得到关于更多有关美国侵略者的消息，我们将会继续跟进。"
 glenn.106.a:0 "美国佬的手上沾满了鲜血……"
 glenn.107.t:0 "令人担忧的趋势"
 glenn.107.desc:0 "自从铀成为一种大有用途的资源以来，我国的经济学家就一直在观察铀市场的起起落落。现在他们告诉我们，世界市场上的铀矿数量发生了暴跌，这无疑将阻碍我国不断扩大的核武库的发展。由于我国的铀供应在很大程度上都是从外国进口的，我们只能遗憾地告知您，我们对市场上铀矿数量的减少非常缺乏准备。这将损害我国的核能力，而我们现在唯一能做的就是尝试着减轻其有害影响。"
 glenn.107.a:0 "也许市场还会反弹……"
 glenn.108.t:0 "静悄悄的清晨"
 glenn.108.desc:0 "当地时间凌晨4点。\n\n在全中国，叛乱团体都认为凌晨4点是袭击日本供应链的最佳时间，甚至就连日本军官都意识到了凌晨4点的意义，但他们永远都没办法及时阻止这样针对性的攻击，保护下足够多的资源。破坏者们以神秘而完美的方式展开着行动，几分钟内，一艘货船就遭到了严重破坏，上面装在的铀矿资源随之石沉大海。\n\n上周，中国各地发生了多起类似的事件，而日本官员们连一个犯罪分子都抓不到，袭击者们的身份就此消逝在时间之中。然而，北海道发生的一桩案件吸引了我国官员的目光。\n\n一艘未受到护航的货船突然之间被彻底摧毁，二十二名船员和乘客活活烧死，船只沉入海底，其上装载的大量铀矿资源以及船上的所有人员都失去了踪迹。这次针对我国货船的单独袭击让铀供应陷于瘫痪，核武器生产因而暂时陷入停滞。最糟糕的则是，警察部队甚至连一个嫌疑人都找不到，调查进程十分缓慢。"
 glenn.108.a:0 "这些个破坏分子到底是什么来头？"
 glenn.109.t:0 "野火蔓延"
 glenn.109.desc:0 "首相，我们又收到了另一处铀矿场遭到破坏的报告，尽管还不知晓具体地点，但我们可以肯定的是，它必定与近期在欧亚各地的叛乱存在关联。\n\n近日，我国的驻外情报部门一直都在密切关注着德国势力范围之内的叛乱和破坏事件；国家警察部队也在同一时间紧密监视着我国势力范围内部持异见的中国人。\n\n我们已经在尽力避免破坏事件发生在我国的势力范围之内，但这些叛乱非常有组织性，行动迅速有力，并且还针对性地打击着我国的铀矿供应。在全球，牵涉到铀矿供应的破坏事件已显著增多，但是，帝国官员认为它们只是“小小的意外”。有两个选择摆在我们的面前：继续深入调查，或者无视这些事件。"
 glenn.109.a:0 "我们必须找到导致铀供应紧张的原因。"
 glenn.109.b:0 "暂时先别管了。"
 glenn.110.t:0 "黑云压城"
 glenn.110.desc:0 "新一天的工作开始时，波兰的天空中阴云密布。雷鸣般的汽笛声惊醒了波兰和斯拉夫奴工，德国管理人员十分钟爱用这种传世经典一般的方式叫他们起床上工。上一拨劳工刚刚结束艰苦的夜班工作，冒着大雨，在德国人的大声叫喊声蹒跚而行，没有一个人说过哪怕一句话。这群男人还有男孩宛如行尸走肉，看起来就像是把自己的灵魂都丢在了矿井里一样，但生意依旧照常。“奴隶们，”矿场主喊道，“上工！”\n\n就这样，奴工们的新一天又开始了。下至七岁孩童、上至六十高龄的男人们执行着对所有人都一样致命的任务，处理铀原矿的工作条件已经能算是最好的了。虽然劳动十分艰难，但至少，每个人都怀揣着某个继续苟活下去的理由。\n\n突然，所有人耳边都响起了吕迪格先生的震耳欲聋的咆哮声。一名十二岁的可怜男孩站在主人面前，承认了每个奴工都已经发现的情况：“这里没有铀了！我们所有人都没找到！”\n\n老矿主哼了一声，握紧拳头，准备动手把面前这个小男孩打得血肉模糊。这时，电话突然铃铃作响，吕迪格拿起听筒，仔细地听着来电者的话语，他的眼睛睁得大大的：“在俄罗斯的一个矿场突然空了！我们一直在检查各处矿场是否遭受了更多的损失。您那边情况如何，吕迪格先生？”\n\n老人放下电话，难以置信地盯着矿场。他亲自去察看了矿井，却什么都没看到。他不由得慌了起来，还有配额要交啊！德国的核机器危在旦夕！无论其他什么时候都行，可现在这个节骨眼上绝对不能允许铀矿出现短缺啊！"
 glenn.110.a:0 "我们的核武库要难以为继了……"
 glenn.111.t:0 "致命的错误"
 glenn.111.desc:0 "数天之前，三处储量相当丰富的铀矿遭到了破坏。第二天，许多在凌晨工作的奴隶都被带去受审，其中看起来比较可疑的家伙立刻就被枪杀处决，警察则继续寻找着下一个潜在的嫌疑人。然而到目前为止，我们还没能在调查中找到哪怕一条线索。领袖对我们处理危机的方式越来越不耐烦，要是没法子尽快找到破坏者，我们就得跟着一块儿掉脑袋。\n\n这是件大麻烦，我国的核武库因此而受到威胁，决不能让日本人或者美国人在这个领域超过我们。一些调查人员正在将铀矿遭到突袭矛头指向日本间谍或美国特工，但这些猜想也尚未得到证实。罪犯很可能只是一小撮奴隶，他们在前一天晚上进行了“独立思考”，然后决定在袭击成功后试试自己的运气。简而言之，我们拿不到足够的证据做出明确的结论。\n\n好消息是，我们仍然能够重建铀矿供给，核武库将在一段时间后重新恢复增长。我们现在可以选择继续深入调查，希望能找到什么重要的线索；或者，这件事也可以就此束之高阁，我们还要专注于其他问题。毕竟在过去的几天里，还没有发生另一起针对铀矿的袭击。"
 glenn.111.a:0 "立刻继续着手调查。"
 glenn.111.b:0 "暂时搁置调查吧。"
 glenn.112.t:0 "第一次指控"
 glenn.112.desc.germany:0 "哦豁，德国人抓住你了，希望这不会引爆三战。"
 glenn.112.desc.japan:0 "哦豁，日本人抓住你了，希望这不会引爆三战。"
 glenn.112.a:0 "公开承认是我们搞的破坏。"
 glenn.113.t:0 "美国精神，破灭了……"
 glenn.113.desc.germany:0 "没过多久，美国公众就把总统的演讲拼凑在了一起。\n\n美国人曾经支持着格伦，与他共度难关；可现在，无论走到哪里，他们都在咒骂着格伦的名字。大多数从前的支持者对总统怎么能如此干脆利落地发表这样的声明出卖祖国而感到愤怒。一部分支持者拒绝相信总统的话，依然在继续声谴德国。但尽管如此，随着广大民众沉浸在无望之中，格伦总统的声望骤然下跌到前所未有的水平。\n\n没过多久，NPP就利用了这次共民党自两党合并以来犯下的最大失误。选民开始承诺支持他们，进步派报纸的销量节节攀升，让共民党望尘莫及。甚至就连格伦自己党内的党员也开始写文章谴责总统，称他“可鄙”、“背叛他的国家”。格伦拔剑四顾，他在这个世界上已经没什么朋友了。\n\n总体而言，全美国的爱国主义精神都大为消退：“U——S——A——！”的呼声少了，在前院草坪上飘扬着的星条旗少了。美国公民为自己身为美国人而感到羞耻，这是一段国家民族精神的黑暗时期。所有残存下来的爱国主义情绪要么缄默不语，要么就转变成了针对德国的愤怒。"
 glenn.113.desc.japan:0 "没过多久，美国公众就把总统的演讲拼凑在了一起。\n\n美国人曾经支持着格伦，与他共度难关；可现在，无论走到哪里，他们都在咒骂着格伦的名字。大多数从前的支持者对总统怎么能如此干脆利落地发表这样的声明出卖祖国而感到愤怒。一部分支持者拒绝相信总统的话，依然在继续声谴日本。但尽管如此，随着广大民众沉浸在无望之中，格伦总统的声望骤然下跌到前所未有的水平。\n\n没过多久，NPP就利用了这次共民党自两党合并以来犯下的最大失误。选民开始承诺支持他们，进步派报纸的销量节节攀升，让共民党望尘莫及。甚至就连格伦自己党内的党员也开始写文章谴责总统，称他“可鄙”、“背叛他的国家”。格伦拔剑四顾，他在这个世界上已经没什么朋友了。\n\n总体而言，全美国的爱国主义精神都大为消退：“U——S——A——！”的呼声少了，在前院草坪上飘扬着的星条旗少了。美国公民为自己身为美国人而感到羞耻，这是一段国家民族精神的黑暗时期。所有残存下来的爱国主义情绪要么缄默不语，要么就转变成了针对日本帝国的愤怒。"
 glenn.113.a:0 "美国精神正走向灭亡……"
 glenn.114.t:0 "美国阴谋败露"
 glenn.114.desc.germany:0 "看来是美国在破坏我们的核材料，另一个超级大国发现了。紧张局势骤然而起，三战可能会由此爆发，但至少我们已经确保了原材料供给：占位符"
 glenn.114.desc.japan:0 "看来是美国在破坏我们的核材料，另一个超级大国发现了。紧张局势骤然而起，三战可能会由此爆发，但至少我们已经确保了原材料供给：占位符"
 glenn.114.a:0 "哎唷"
 glenn.115.t:0 "老对手支持我们！"
 glenn.115.desc.germany:0 "自从对美国破坏我国铀供应方面展开第一轮外交攻击以来，唇枪舌剑就没有一刻停歇。我国外交官一直在敲打格伦总统和他的内阁，而我们可以看到，他正在慢慢走向崩溃。他居然企图用作弊的手段在核竞赛中取得领先地位，他活该！在德国国会中，没有一个人表现出一丝一毫的同情，甚至就连公众也在给予我们以难以置信的支持。德国民众对所有的报道、以及美国人干涉我国的证据而感到愤怒。\n\n随后，日本也发现了他们铀短缺背后的罪魁祸首，无巧不成书，同样也是美国。和我国一样，日本也在对美国的展开疾风骤雨式的指控，白宫的每个人肯定都压力很大。我国驻东京的外交官打电话给我们，要求与大日本帝国建立临时的外交联盟，我们认为这再好不过。美国佬对我们两国都做了错事，我们将一起确保美国永远不会再干涉任何外国的事务。\n\n要想彻底打倒美国白头鹰还需要很多工作，但与日本的新联盟将使复仇更加甜蜜。"
 glenn.115.desc.japan:0 "自从对美国破坏我国铀供应方面展开第一轮外交攻击以来，唇枪舌剑就没有一刻停歇。我国外交官一直在敲打格伦总统和他的内阁，而我们可以看到，他正在慢慢走向崩溃。他居然企图用作弊的手段在核竞赛中取得领先地位，他活该！在皇居中，没有一个人表现出一丝一毫的同情，甚至就连公众也在给予我们以难以置信的支持。日本民众对所有的报道、以及美国人干涉我国的证据而感到愤怒。\n\n随后，德国也发现了他们铀短缺背后的罪魁祸首，无巧不成书，同样也是美国。和我国一样，德国也在对美国的展开疾风骤雨式的指控，白宫的每个人肯定都压力很大。我国驻日耳曼尼亚的外交官打电话给我们，要求与德意志国建立临时的外交联盟，我们认为这再好不过。美国佬对我们两国都做了错事，我们将一起确保美国永远不会再干涉任何外国的事务。\n\n要想彻底打倒美国白头鹰还需要很多工作，但与德国的新联盟将使复仇更加甜蜜。"
 glenn.115.a:0 "美国佬要怎么才能翻身？"
 glenn.116.t:0 "格伦总统的忏悔"
 glenn.116.desc.germany:0 "“我必须向我的美国同胞们承认，对白宫、对我国政府的指控……都是真的，我是在德国势力范围内发生的事件的唯一责任者。在最初的指控提出之前，内阁其他成员对这些破坏活动都一概不知。这是个艰难的决定，但我必须承认我的错误行为，希望我能得到德国公众的原谅，也能得到我自己国家的原谅……”\n\n这是格伦总统在昨天上午的新闻发布会上说的一段话。许多高层政治家都对他真诚的道歉意犹未尽，一直在观看发布会的回放，等待着台下美国人集体沉默的那一瞬间。毫无疑问，我们的发现已经粉碎了美国精神。\n\n我们的快速行动在美国的声誉上刻下了一道深深的伤痕，但我们总是能更进一步。所有人都能从格伦总统在讲话时的神情表现之中看出他是多么地遗憾与抱歉，他话语声中的痛苦情感凸显着他对破坏活动没能按照他的计划进行而感到多么无地自容。我们可以选择到此为止，接受格伦的道歉；或者，我们也可以向美国人要求赔偿，以进一步教育他们不要来招惹我们。格伦的企图已经对我国核武库带来了损害，我们应该得到应有的赔偿。"
 glenn.116.desc.japan:0 "“我必须向我的美国同胞们承认，对白宫、对我国政府的指控……都是真的，我是在日本势力范围内发生的事件的唯一责任者。在最初的指控提出之前，内阁其他成员对这些破坏活动都一概不知。这是个艰难的决定，但我必须承认我的错误行为，希望我能得到日本公众的原谅，也能得到我自己国家的原谅……”\n\n这是格伦总统在昨天上午的新闻发布会上说的一段话。许多高层政治家都对他真诚的道歉意犹未尽，一直在观看发布会的回放，等待着台下美国人集体沉默的那一瞬间。毫无疑问，我们的发现已经粉碎了美国精神。\n\n我们的快速行动在美国的声誉上刻下了一道深深的伤痕，但我们总是能更进一步。所有人都能从格伦总统在讲话时的神情表现之中看出他是多么地遗憾与抱歉，他话语声中的痛苦情感凸显着他对破坏活动没能按照他的计划进行而感到多么地无地自容。我们可以选择到此为止，接受格伦的道歉；或者，我们也可以向美国人要求赔偿，以进一步教育他们不要来招惹我们。格伦的企图已经对我国核武库带来了损害，我们应该得到应有的赔偿。"
 glenn.116.a:0 "暂且放美国佬一马。"
 glenn.116.b:0 "我们要为遭受的损失要求赔偿。"
 glenn.117.t:0 "我们的仇敌要求赔偿"
 glenn.117.desc.germany:0 "格伦总统已经休了好几天的假，尝试他从对德国的“失败尝试”中理清思路。他搬到了离特区不远的弗吉尼亚海岸，以备突然被召唤去履行总统职责的可能。总统在弗吉尼亚海滩上消磨了大段大段的时光，看着大西洋的波涛来来回回，在阳光之下显出波光粼粼的景象。他在寻找一条合适的出路，一个对他讨厌的对手以及美国都大有裨益的办法。只是，他能说些什么来让德国人原谅他，并且重建美国堕落的威信呢？他似乎一直都在思考这个问题……\n\n就在这时，格伦的秘书跑到海滩上，告知总统：“德国人要讨论一些事情。”平静时光被打断让格伦总统感到有些恼火，他决定接听这通来自日耳曼尼亚的电话。\n\n来电的是德国外交部长，他要求对美国袭击德国铀矿的行为进行重罚，总统则将在明天之前作出答复。外交部长一挂断电话，格伦就开始考虑摆在他面前的选择，羞辱已经让这位疲惫的总统付出了代价，但追加赔偿的要求让事态紧张了十倍不止。如果他接受在德国的失败行动的代价，公众对他的谴责将愈发猛烈；但是如果支付赔偿，也能使美国与这个超级大国和平相处。同时，格伦也注意到了一个支离破碎的美国精神的重新粘合在一起的机会：他可以站稳脚跟，拒绝赔款，民众的力量无疑将会站在他这一边，但如此行事会让德国的态度变得更加咄咄逼人。格伦需要做出重要的决定。"
 glenn.117.desc.japan:0 "格伦总统已经休了好几天的假，尝试他从对日本的“失败尝试”中理清思路。他搬到了离特区不远的弗吉尼亚海岸，以备突然被召唤去履行总统职责的可能。总统在弗吉尼亚海滩上消磨了大段大段的时光，看着大西洋的波涛来来回回，在阳光之下显出波光粼粼的景象。他在寻找一条合适的出路，一个对他讨厌的对手以及美国都大有裨益的办法。只是，他能说些什么来让日本人原谅他，并且重建美国堕落的威信呢？他似乎一直都在思考这个问题……\n\n就在这时，格伦的秘书跑到海滩上，告知总统：“日本人要讨论一些事情。”平静时光被打断让格伦总统感到有些恼火，他决定接听这通来自东京的电话。\n\n来电的是日本外务大臣，他要求对美国袭击日本铀矿的行为进行重罚，总统则将在明天之前作出答复。外务大臣一挂断电话，格伦就开始考虑摆在他面前的选择，羞辱已经让这位疲惫的总统付出了代价，但追加赔偿的要求让事态紧张了十倍不止。如果他接受在日本的失败行动的代价，公众对他的谴责将愈发猛烈；但是如果支付赔偿，也能使美国与这个超级大国和平相处。同时，格伦也注意到了一个支离破碎的美国精神的重新粘合在一起的机会：他可以站稳脚跟，拒绝赔款，民众的力量无疑将会站在他这一边，但如此行事会让日本的态度变得更加咄咄逼人。格伦需要做出重要的决定。"
 glenn.117.a:0 "支付巨额赔偿，给这段羞辱画上句号。"
 glenn.117.b:0 "强硬反对，拒绝赔偿。"
 glenn.118.t:0 "美国支付赔偿"
 glenn.118.desc.germany:0 "自从德国外交部长打电话给格伦总统，要求他为其对德意志国犯下的罪行支付赔偿以来，已经过去了整整一天。外交部长坐在椅子上，不住地敲打着自己的指关节，急切地等待着总统的答复。他已经把格伦逼到了墙角，拒绝赔偿损失的行为没有任何意义，无论在这个时候对德国采取怎样的行动，都会让这位谦卑的领导人陷入更大的难堪。当他第一次发现美国人的伎俩时，他就誓言要让美国将付出沉重的代价，而现在就是付出代价的时候。\n\n“我国将接受向德意志国支付赔偿的条件。”\n\n这只是短短一句话，但所有德国公民都将在今天听到这句话。宣传机器正在超负荷运转，通过报纸以及现场的途径报道着此事，股票因此大幅上涨，美国政府曾持有的股票则在猛烈下跌，民众正在以各种可能的方式给美国难堪，德国各个大都市中都有庞大的人群烧毁美国国旗，肆意破坏着格伦总统的照片，甚至就连日本都有人在庆祝对美国鹰的胜利。\n\n至少在当下，世界的光芒已经离开了美国，将这个老男孩留在了阴影之中。"
 glenn.118.desc.japan:0 "自从日本外相打电话给格伦总统，要求他为其对大日本帝国犯下的罪行支付赔偿以来，已经过去了整整一天。外相坐在椅子上，不住地敲打着自己的指关节，急切地等待着总统的答复。他已经把格伦逼到了墙角，拒绝赔偿损失的行为没有任何意义，无论在这个时候对日本采取怎样的行动，都会让这位谦卑的领导人陷入更大的难堪。当他第一次发现美国人的伎俩时，他就誓言要让美国将付出沉重的代价，而现在就是付出代价的时候。\n\n“我国将接受向日本帝国支付赔偿的条件。”\n\n这只是短短一句话，但所有日本公民都将在今天听到这句话。宣传机器正在超负荷运转，通过报纸以及现场的途径报道着此事，股票因此大幅上涨，美国政府曾持有的股票则在猛烈下跌，民众正在以各种可能的方式给美国难堪，日本各个大都市中都有庞大的人群烧毁美国国旗，肆意破坏着格伦总统的照片，甚至就连德国都有人在庆祝对美国鹰的胜利。\n\n至少在当下，世界的光芒已经离开了美国，将这个老男孩留在了阴影之中。"
 glenn.118.a:0 "现在的党就像是1945年那时候一样！"
 glenn.119.t:0 "美国拒绝赔偿"
 glenn.119.desc.germany:0 "德国外交部长正在办公室里休息，急切地等待着美国总统的答复。德国国会大厦中的每个人都在翘首以待，等着美国承认外交失败、支付数额适当的赔偿款项，甚至就连普通的德国公民都在关注美国是否会向祖国屈膝。随着时间一分一秒地过去，政府大楼周围陷入一片不祥的寂静之中，就像是足球比赛的最后几分钟一样，每个人都在期待着胜利，每个人都在等待着这通即将决定美利坚合众国声誉的电话！\n\n外交部长的私人电话机叮叮作响，他一听到铃声就扑向了电话，他知道对方是谁，也知道他要做什么，问题只在于对方会给出怎样的答复。\n\n“不管你怎么逼迫我们，美国都不会支付赔偿！我的美国同胞和我……我们拒绝服从你们的要求！”\n\n外交部长感到，自己的血液仿佛在一瞬间冻住了。他听着总统的话语，彻底陷入了震惊之中，他怀疑是不是自己的耳朵出了问题。他对美国如何回应的设想过于乐观了，根本就不可能成为现实，外交部长一边考虑着怎样反驳总统顽固的表态，一边在心里想着：“这些鼠辈，永远都不知道什么时候该认输……”"
 glenn.119.desc.japan:0 "日本外相正在办公室里休息，急切地等待着美国总统的答复。皇居中的每个人都在翘首以待，等着美国承认外交失败、支付数额适当的赔偿款项，甚至就连普通的日本公民都在关注美国是否会向旭日屈膝。随着时间一分一秒地过去，政府大楼周围陷入一片不祥的寂静之中，就像是足球比赛的最后几分钟一样，每个人都在期待着胜利，每个人都在等待着这通即将决定美利坚合众国声誉的电话！\n\n外相的私人电话机叮叮作响，他一听到铃声就扑向了电话，他知道对方是谁，也知道他要做什么，问题只在于对方会给出怎样的答复。\n\n“不管你怎么逼迫我们，美国都不会支付赔偿！我的美国同胞和我……我们拒绝服从你们的要求！”\n\n外相感到，自己血液仿佛在一瞬间冻住了。他听着总统的话语，彻底陷入了震惊之中，他怀疑是不是自己的耳朵出了问题。他对美国如何回应的设想过于乐观了，根本就不可能成为现实，外相一边考虑着怎样反驳总统顽固的表态，一边在心里想着：“这些鼠辈，永远都不知道什么时候该认输……”"
 glenn.119.a:0 "好吧……但下次，我们可不会就这么轻易地放过你们。"
 glenn.119.b:0 "你们必须要为对我国造成的所有损失支付赔偿！"
 glenn.120.t:0 "答复"
 glenn.120.desc.germany:0 "当格伦总统第一次接到德国最高外交官的电话时，他花了整整一个晚上的时间，仔细斟酌要如何回应，因此而辗转反侧，夜不能寐。他首先想到的是美国公众：在当下，美国人民应该得到什么？格伦在天光放亮时得出了结论：他将竭尽全力，把美国四分五裂的声誉重新粘合起来。于是，他在向德国外交部长的答复中拒绝支付任何形式的赔偿，意图用自己坚定的立场引导所有美国人的支持，反抗德国的要求。格伦总统屏住呼吸，等待着将会在几分钟后到来的反驳。\n\n“好吧，我们不会强迫你们支付赔款，毕竟还有更重要的问题要处理。但是，别太得意了，总统先生，下次我们可不会就这么轻易地放过你，最好还是多留几个心眼吧。”\n\n这正是格伦希望的反应，甚至还要更出乎他的预料，这是一步险棋，但也给他带来了收获。他派遣人手潜入德国实施破坏活动，动摇了德国的核原料供应，事态也正在平息。然而，这桩外交风波带来的羞辱和尴尬不会就此消弭，而会撕开他的肉体，直刺他诚实的内心，这次失败甚至必将在他与世长辞之后成为他留下的遗产之上不可抹消的污点。虽然美国取得了小小的胜利，但格伦现在必须想办法带领美国重回世界舞台，弥补这段时间以来的声望损失需要几个月甚至几年的时间，但至少现在，美国安全了。"
 glenn.120.desc.japan:0 "当格伦总统第一次接到日本最高外交官的电话时，他花了整整一个晚上的时间，仔细斟酌要如何回应，因此而辗转反侧，夜不能寐。他首先想到的是美国公众：在当下，美国人民应该得到什么？格伦在天光放亮时得出了结论：他将竭尽全力，把美国四分五裂的声誉重新粘合起来。于是，他在向日本外相的答复中拒绝支付任何形式的赔偿，意图用自己坚定的立场引导所有美国人的支持，反抗日本的要求。格伦总统屏住呼吸，等待着将会在几分钟后到来的反驳。\n\n“好吧，我们不会强迫你们支付赔款，毕竟还有更重要的问题要处理。但是，别太得意了，总统先生，下次我们可不会就这么轻易地放过你，最好还是多留几个心眼吧。”\n\n这正是格伦希望的反应，甚至还要更出乎他的预料，这是一步险棋，但也给他带来了收获。他派遣人手潜入日本实施破坏活动，动摇了日本的核原料供应，事态也正在平息。然而，这桩外交风波带来的羞辱和尴尬不会就此消弭，而会撕开他的肉体，直刺他诚实的内心，这次失败甚至必将在他与世长辞之后成为他留下的遗产之上不可抹消的污点。虽然美国取得了小小的胜利，但格伦现在必须想办法带领美国重回世界舞台，弥补这段时间以来的声望损失需要几个月甚至几年的时间，但至少现在，美国安全了。"
 glenn.120.a:0 "这次真是侥幸被放了一马。"
 glenn.121.t:0 "格伦的外交失败"
 glenn.121.desc.germany:0 "格伦一直在与德国外交官就破坏核原料供应的问题来回斡旋，当证据公之于众后，德国外交部长开始强硬地要求美国支付赔偿。在对手面前，格伦的立场十分坚定，不无挑衅地全盘拒绝了德方的要求，美国政府不会浪费哪怕一分钱去给德意志国付赔款。\n\n德国有什么理由不拒绝格伦如此大胆的提议？全世界都看到了美国插手的证据，如果世界是一所大法庭，那它极有可能会作出有利于德国的判决。格伦这番挑衅性质回应无疑是对德国的宣传机器火上浇油，现在，美国的答复已经传遍了世界上每一个角角落落。多年来，美国领导人第一次感觉到，他们成为了全世界除了美国人之外的所有人的众矢之的。\n\n德国继续要求赔款，格伦则不断反击。国会与格伦总统在私下里举行了一场会议，迫使他放弃让国家一无所获的英雄主义态度。无奈之下，格伦又安排了一次与德国外交部长之间的通话，服从了德国的要求。这次外交风波终于偃旗息鼓，格伦的大部分民众支持也随之烟消云散。即使这是对全人类来说唯一的好结果，但美国公众永远都不会原谅格伦向敌人屈膝下跪的行为。"
 glenn.121.desc.japan:0 "格伦一直在与日本外交官就破坏核原料供应的问题来回斡旋，当证据公之于众后，日本外相开始强硬地要求美国支付赔偿。在对手面前，格伦的立场十分坚定，不无挑衅地全盘拒绝了日方的要求，美国政府不会浪费哪怕一分钱去给日本帝国付赔款。\n\n日本有什么理由不拒绝格伦如此大胆的提议？全世界都看到了美国插手的证据，如果世界是一所大法庭，那它极有可能会作出有利于日本的判决。格伦这番挑衅性质回应无疑是对日本的宣传机器火上浇油，现在，美国的答复已经传遍了世界上每一个角角落落。多年来，美国领导人第一次感觉到，他们成为了全世界除了美国人之外的所有人的众矢之的。\n\n日本继续要求赔款，格伦则不断反击。国会与格伦总统在私下里举行了一场会议，迫使他放弃让国家一无所获的英雄主义态度。无奈之下，格伦又安排了一次与日本外相之间的通话，服从了日本的要求。这次外交风波终于偃旗息鼓，格伦的大部分民众支持也随之烟消云散。即使这是对全人类来说唯一的好结果，但美国公众永远都不会原谅格伦向敌人屈膝下跪的行为。"
 glenn.121.a:0 "格伦最终还是栽在了自己犯下的错误上。"
 glenn.122.t:0 "针对美国的进一步行动？"
 glenn.122.desc.germany:0 "弗朗茨和海因里希两位将军相约在日耳曼尼亚的一家餐馆喝杯咖啡，此时，电视屏幕上正播放着格伦总统近来与美国公众会面的画面。在超过9万名观众面前，总统嘲讽了德国对破坏行为的指控。当他站在讲台上对自己的国民撒谎时，他确实显得很是自豪，反正众所周知，美国人都是天生的骗子。\n\n“你看看，这都是些什么胡说八道？”海因里希一边看着电视上的集会场面，一边对身边的朋友说道，“这几天，格伦一直都在矢口否认，就像是他不会因此而尝到苦头一样。”\n\n弗朗茨神情严肃地看了好友几秒钟，组织着自己的语言：“我们想了个办法，可以让格伦认清现实，闭上他的嘴。上级正在考虑对美国铀矿运输进行突袭的可能性，照他们的说法，‘这就像是我们曾经在41年时在大西洋上把他们撕成碎片的美好时光一样。’但我不是很确定，这样的计划要如何施行。”\n\n海因里希回以好奇的眼神，他很快就回想起了当年的画面，德国的战列舰和隐蔽的潜艇掌控着大西洋沿岸，任何胆敢靠近的美国船只几乎在一瞬间就会化作漫天纷飞的碎片。但当他仔细思考时，这些想法就离开了他的脑海：“这么做在现在看来还是太危险了。如果把事态搞得太过火，我们手头上的问题就会变得更复杂。但确实应该收拾收拾美国人，毕竟他们给我们找了这么大的麻烦……”\n\n在德国国会中，同样的谈话正如野火一般在高官之间蔓延……"
 glenn.122.desc.japan:0 "宏太和翔平两位将军相约在东京市中心的一家小酒馆喝杯茶，此时，电视屏幕上正播放着格伦总统近来与美国公众会面的画面。在超过9万名观众面前，总统嘲讽了日本对破坏行为的指控。当他站在讲台上对自己的国民撒谎时，他确实显得很是自豪，反正众所周知，美国人都是天生的骗子。\n\n“你看看，这都是些什么胡说八道？”翔平一边看着电视上的集会场面，一边对身边的朋友说道，“这几天，格伦一直都在矢口否认，就像是他不会因此而尝到苦头一样。”\n\n宏太神情严肃地看了好友几秒钟，组织着自己的语言：“我们想了个办法，可以让格伦认清现实，闭上他的嘴。上级正在考虑对美国铀矿运输进行突袭的可能性，照他们的说法，‘这就像是我们曾经在42年时在太平洋上把他们撕成碎片的美好时光一样。’但我不是很确定，这样的计划要如何施行。”\n\n翔平回以好奇的眼神，他很快就回想起了当年的画面，日本的战列舰和零式舰载机掌控着太平洋沿岸，任何胆敢靠近的美国船只几乎在一瞬间就会化作漫天纷飞的碎片。但当他仔细思考时，这些想法就离开了他的脑海：“这么做在现在看来还是太危险了。如果把事态搞得太过火，我们手头上的问题就会变得更复杂。但确实应该收拾收拾美国人，毕竟他们给我们找了这么大的麻烦……”\n\n在政府大楼里，同样的谈话正如野火一般在高官之间蔓延……"
 glenn.122.a:0 "他们给我们搞破坏，为什么不以牙还牙？"
 glenn.122.b:0 "不要再激化矛盾了……"
 glenn.123.t:0 "偷袭"
 glenn.123.desc.germany:0 "“总统先生！总统先生！一处位于加勒比的哨所收到了非常紧急的消息！德国舰船正在攻击运输铀矿的美国船队！”\n\n格伦已经准备好了如何应对这种情况，但事到临头之时，所有预先的心理准备都一扫而空，德国发动袭击的消息就像夏天的飓风一样灌进他的耳朵，冲昏了他的头脑，把他的思想搅得乱七八糟。至于那位可怜的信使，他差点儿就因为震惊而昏厥过去了。\n\n“等等，告诉沿海地区的部队做好准备，我必须得直接给日耳曼尼亚打电话。”总统一边下令，一边迅速地坐在椅子上，拿起电话。他应该要怎么做，才能确保事态得到迅速而有效的解决？\n\n他真的不相信德国人居然会采取这么直截了当的行动，但木已成舟，他不得不妥善应对敌人突如其来的不宣而战，末日时钟离午夜只有不到一小格了。格伦拨通号码，在话筒传来的忙音中焦急等待着元首本人的接听。"
 glenn.123.desc.japan:0 "“总统先生！总统先生！一处位于西海岸的哨所收到了非常紧急的消息！日本舰船正在攻击运输铀矿的美国船队！”\n\n格伦已经准备好了如何应对这种情况，但事到临头之时，所有预先的心理准备都一扫而空，日本发动袭击的消息就像夏天的飓风一样灌进他的耳朵，冲昏了他的头脑，把他的思想搅得乱七八糟。至于那位可怜的信使，他差点儿就因为震惊而昏厥过去了。\n\n“等等，告诉沿海地区的部队做好准备，我必须得直接给东京打电话。”总统一边下令，一边迅速地坐在椅子上，拿起电话。他应该要怎么做，才能确保事态得到迅速而有效的解决？\n\n他真的不相信日本人居然会采取这么直截了当的行动，但木已成舟，他不得不妥善应对敌人突如其来的不宣而战，末日时钟离午夜只有不到一小格了。格伦拨通号码，在话筒传来的忙音中焦急等待着首相本人的接听。"
 glenn.123.a:0 "如果你们的军舰胆敢再靠近我国船队一步，我们就会开火。"
 glenn.123.b:0 "我承认，所有破坏都是我搞的！"
 glenn.124.t:0 "美国要求我方撤退"
 glenn.124.desc.germany:0 "事态似乎已经紧张到了极点，美国人已经决定，如果我们向其船队开火，那他们就也会动用海军力量与我国舰船交战。我们已经确定计划，做好了突袭这批船队的准备，但我们仍然可以选择取消这次任务。我的元首，如果继续这样下去，我们可能会引爆一场根本无法承受的残酷冲突。若是事态继续激化，全世界的人们都会因我们的行动而蒙受灾难。与此同时，美国也有可能会退让，双方都因为核武库的发展而承担着相同的风险。但如果我们就此退缩，可能会鼓励美国人，让他们自以为我国可以忍受其犯下的罪行，美国的侵略行为也会继续下去；或许，如果我们设法在美国人做出行动之前先下手为强，那就能够赢得这场“威望之战”，逼迫他们坐下来好好谈谈。\n\n当然，我们也可以表现得更谦和一些，在事态有可能演化为核冲突之前就此放弃。如此一来，德意志种族就能在未来得以存续，与此相比，美国搞破坏的问题就显得不算什么了。\n\n现在要怎么做，我的元首？是要继续袭击铀矿运输船队？还是放弃行动，将舰船开回港口？"
 glenn.124.desc.japan:0 "事态似乎已经紧张到了极点，美国人已经决定，如果我们向其船队开火，那他们就也会动用海军力量与我国舰船交战。我们已经确定计划，做好了突袭这批船队的准备，但我们仍然可以选择取消这次任务。天皇陛下，如果继续这样下去，我们可能会引爆一场根本无法承受的残酷冲突。若是事态继续激化，全世界的人们都会因我们的行动而蒙受灾难。与此同时，美国也有可能会退让，双方都因为核武库的发展而承担着相同的风险。但如果我们就此退缩，可能会鼓励美国人，让他们自以为我国可以忍受其犯下的罪行，美国的侵略行为也会继续下去；或许，如果我们设法在美国人做出行动之前先下手为强，那就能够赢得这场“威望之战”，逼迫他们坐下来好好谈谈。\n\n当然，我们也可以表现得更谦和一些，在事态有可能演化为核冲突之前就此放弃。如此一来，日本种族就能在未来得以存续，与此相比，美国搞破坏的问题就显得不算什么了。\n\n现在要怎么做，陛下？是要继续袭击铀矿运输船队？还是放弃行动，将舰船开回港口？"
 glenn.124.a:0 "我们必须要实现自己的意图，继续前进！"
 glenn.124.b:0 "为了国家和民族，我们必须要退让……"
 glenn.125.t:0 "敌人夺取了货物"
 glenn.125.desc.germany:0 "要说白宫对今天早上出现的事情感到恐慌，那完全是低估了事实。\n\n这种事情大多数美国人都读到过，像是在科幻小说里的情节。但现在，威胁已真实可感：火箭，足以毁灭地球的火箭已精准地朝向自由世界的心脏。德国人对格伦总统的警告置之若罔，并击沉了护送铀的舰队，海军还没有得到还击的许可，但留给他们的时间越来越少了。\n\n全美都已濒临疯狂，全国食物和个人用品在进入商店货架后几分钟内就消失得无影无踪。防空洞如此完备，看得出，如果这些居民真的度过大灾难，幸存下来，那人类文明就得以保存。父亲们在外放哨，准备听到第一声炸弹警报就遁入地下。母亲们和孩子们坐在一起，每一双眼睛都紧盯电视，里面新闻播报员正在实时播报危机的最新情况。\n\n格伦和他的内阁面临着迄今为止最艰难的决定，美国的生命已经被敌夺去，对德的一切恳求都是徒劳，难道几条人命就足以拉开人类末日的序幕吗？要是格伦现在选择退缩，那么经过那些街头游行后，他将失去拥有的一切。到了现在这种情况，要么夺走他的生命，要么夺走所有人的生命。他的决定将拉上美国公众，真正成为全有或全无的最后一次豪赌。\n\n墙上的数字时钟显示时间：11:59:58。"
