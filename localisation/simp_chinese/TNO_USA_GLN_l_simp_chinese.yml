 POLITICS_GLN_DESC:0 "约翰·格伦异军突起，一跃登上总统宝座，令许多观察家十分吃惊，毕竟共民党一贯谨慎而保守。格伦告别太空生涯，踏入政治舞台不过短短六年，但摆在这位新总统面前的可能性却是之前任何一位总统都不敢想象的。在德国和日本还在拼命地维持自己的霸权时，格伦已经放眼群星。\n\n和预期一样，格伦政府的主要目标是航天事业，并征服这最后边疆。作为第一位完成太空飞行的人类以及第一位从政的宇航员，格伦会继续加大对航空航天领域的投资力度，正如他担任俄亥俄州州长时做的那样。美国的导弹和火箭科技日新月异，登陆月球将不再是遥不可及的梦想，而一旦征服了月球，NASA的下一步又会是什么呢？\n\n但格伦能当选总统，并非仅凭自己的名望，更是凭借他在俄亥俄州大获成功的福利改革计划——这帮格伦争取来了老年群体和贫困选民的投票，打消了那些质疑他只想着满天繁星的反对声音。\n\n虽然格伦不会因为太空梦而弃美国于不顾，但只有那些和他熟悉的人才知道他真正想要什么。格伦谈论克尔纳登月时总是很有节制，念着事先准备好的讲稿，给公众一种冷静的感觉，但他申请的第一笔预算已经让一切不言而喻：格伦领导的美国会重返太空。这一次，只准成功，不准失败。"
