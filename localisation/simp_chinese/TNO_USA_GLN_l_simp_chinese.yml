 USA_GLN_Eros_Buff_1:0 "一分钟人项目"
 USA_GLN_Eros_Buff_desc_1:0 "厄洛斯计划取得了重大成功。现在，我国的军用以及科学火箭都比以前更可靠、更有效、射程更远，卫星、弹道以及核应用都得到了极大的改善，他们能够触及的范围正在向敌人和天际延伸而去。"
