 USA_GLN_Nuclear_Commission_desc:0 "格伦总统组建核委员会的目的是确保美国在全球对手面前拥有战略主导地位。只有从实力的角度出发，我们才能迫使地缘政治对手屈尊前来谈判。我们将从被动的威慑转而开始主动出击，削弱对手的核能力。在扩大我国核武库的同时破坏德日两国的核武库，我们能够由此而确保美国文明在世界上居于首位，委员会已经准备好了几份不同的提案。"
