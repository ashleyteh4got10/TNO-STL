CPC_NWB_entry_tt: "点击打开£CPC_texticon §R中国共产党-中央西北局§!GUI"
TER_NWB_generic_info: "£CPC_texticon §R中国共产党-中央西北局§!\n\n§Y六大任务§!\n-£CPC_texticon §R中央西北局§!辖区主要为§Y甘肃、宁夏、青海§!等地区，1961年以来，§e封建军阀反动派马继援§!的挑拨致使西北各族关系降至§e冰点§!，给党和阵线的抗日生产工作带来了巨大的§e损失§!，因此，£CPC_texticon §R中央西北局§!在未来一个长时期的主要任务便是恢复生产，团结西北汉回蒙藏维各族关系。\n-鉴于生产生活和民族团结的实际需要，£CPC_texticon §R中央西北局§!的工作可被划分为§Y六大任务§!，在£CPC_texticon §R中国共产党-中央西北局§!GUI的右侧上方交互区域即可完成§Y六大任务§!，每一任务分为§Y3级§!，满级后可增加§Y1级地区团结度§!。\n-§Y六大任务§!及§Y地区团结度§!的具体增益可在交互区域的§Y六边形§!中查看。\n\n§Y革命摇篮§!\n-陕甘宁青是[CPC.GetFlag]§m国防§!§V阵线§!的核心地带，出身西北的£CPC_texticon §G我党中基层干部§!更是组成当前各根据地£CPGAC_texture_loc §G人民政府§!的重要基石，因此，我们必须特别重视西北的£CPC_texticon §G革命干部§!培养工作。\n-£CPC_texticon §R我党§!在§Y各地方局§!的工作需要大量£CPC_texticon §G中基层干部§!的支持和配合，若分配给§Y某一地方局§!的党员数量§Y不足§!，则§Y该地方局§!的§Y实际增益§!将§R低于§!其§Y理论值§!，§G反之则反§!。\n-请谨慎决定各地方局之间的§Y党员分配§!及§Y每年年初决定的党费预算§!，以满足阵线发展的§Y长期利益§!。\n-§Y各地方局§!的详细需求情况可在交互区域中查看。"
NWB_LD_L_tittle_1: "§Y[?NWB_acted_state.GetName]§!"
NWB_LD_L_tittle_2: "地区团结度：[?NWB_acted_state:NWB_unity_level|0Y]级\n该地区党员数目：§Y[?NWB_acted_state:NCCPC_current_party_pop_in_state|2Y]K§!\n我党在册党员总数：§Y[?NCCPC_current_party_pop|2Y]K§!"
NCCPC_current_party_pop_from_shaanxi_tt: "§Y陕西§!为中央西北局的§G核心辖区§!，§Y党员数目§!占地区总人口的§Y0.5%§!\n\n该地区党员数目：§Y[?CPC.NCCPC_current_party_pop_from_shaanxi|2Y]K§!"
NWB_task_business_tt: "任务：§j恢复商贸§!\n----------\n§G满级§!时，该地块§G增长§!§Y7.5%§!地区GDP，该地区§G增长§!1级团结度。\n点击进行该任务，每提升一级需§Y15天§!。"
NWB_task_agriculture_tt: "任务：§n农业生产§!\n----------\n§G满级§!时，阵线§Y农业社会发展度§!§n增长§!5点，该地区§G增长§!1级团结度。\n点击进行该任务，每提升一级需§Y15天§!。"
NWB_task_infrastructure_tt: "任务：§Y基建建设§!\n----------\n§G满级§!时，该地块§G获得§!§Y1级§!基础设施，该地区§G增长§!1级团结度。\n点击进行该任务，每提升一级需§Y15天§!。"
NWB_task_unity_tt: "总任务：§G团结人民§!\n----------\n§G2级§!时，§G我们将获得该地区核心的核心宣称§!，§G并获得§!§Y1座§!行政大楼；\n§G4级§!时，该地块§G获得§!§Y15%§!地区动员速度；\n§G满级§!时，该地区§Y党员数目§!将由原来的占地区总人口的§Y0.15%§!增长至§G0.3%§!。\n该任务由其他任务推动完成，无需操作。"
NWB_task_education_tt: "任务：§O文化教育§!\n----------\n§G满级§!时，该地块§G获得§!§Y1座§!学校，该地区§G增长§!1级团结度。\n点击进行该任务，每提升一级需§Y15天§!。"
NWB_task_healthcare_tt: "任务：§m医疗卫生§!\n----------\n§G满级§!时，该地块§G获得§!§Y1座§!医院，该地区§G增长§!1级团结度。\n点击进行该任务，每提升一级需§Y15天§!。"
NWB_task_security_tt: "任务：§l维持治安§!\n----------\n§G满级§!时，该地块§G获得§!§Y1座§!监狱，该地区§G增长§!1级团结度。\n点击进行该任务，每提升一级需§Y15天§!。"
