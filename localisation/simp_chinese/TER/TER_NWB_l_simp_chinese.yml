TER_NWB_modifier_0: "中央西北局-核心区"
TER_NWB_modifier_0_desc: "国防阵线近70%的国民支柱产业尽皆汇聚于陕西；同样，在陕西深耕发展多年的中国共产党也将陕西视为培养下一代干部群体的最大基地。\n\n毫不夸张地说，陕西就是未来§m“自由中国§!§x最后希望”§!的§Y腹心之地§!，而手握中央西北局行政任免大权者，必将在未来的汹涌大潮中为§x中国革命之舟§!掌控舵向。"
TER_NWB_modifier_1: "中央西北局-辖区"
TER_NWB_modifier_1_desc: "中央西北局的主要辖区为主要为§Y甘肃、宁夏、青海§!等。在中国传统语境中，甘青宁乃汉家疆域西北边关之地，千年来饱受各族不睦之苦，及至今日战火连绵人烟荒凉——乃实实在在的一桩悲剧。\n\n如今既已平定青马叛乱，当务之急便是恢复生产，稳定民族关系，切莫§R节外生枝§!。\n\n§x若再要挑起西北诸族之怨怒，中国革命之前途命运恐将就此葬送。§!"
TER_NWB_modifier_2: "中央西北局-辖区"
TER_NWB_modifier_2_desc: "中央西北局的主要辖区为主要为§Y甘肃、宁夏、青海§!等。在中国传统语境中，甘青宁乃汉家疆域西北边关之地，千年来饱受各族不睦之苦，及至今日战火连绵人烟荒凉——乃实实在在的一桩悲剧。\n\n如今既已平定青马叛乱，当务之急便是恢复生产，稳定民族关系，切莫§R节外生枝§!。\n\n§x若再要挑起西北诸族之怨怒，中国革命之前途命运恐将就此葬送。§!"
TER_NWB_modifier_3: "中央西北局-辖区"
TER_NWB_modifier_3_desc: "中央西北局的主要辖区为主要为§Y甘肃、宁夏、青海§!等。在中国传统语境中，甘青宁乃汉家疆域西北边关之地，千年来饱受各族不睦之苦，及至今日战火连绵人烟荒凉——乃实实在在的一桩悲剧。\n\n如今既已平定青马叛乱，当务之急便是恢复生产，稳定民族关系，切莫§R节外生枝§!。\n\n§x若再要挑起西北诸族之怨怒，中国革命之前途命运恐将就此葬送。§!"
