CPC_TRCW.599.t: "末班车"
CPC_TRCW.599.d: "马久良对着车窗拍平乱发，整洁的西装之上，他俊朗的国字脸重叠在走马灯般逝去的城区夜景中，作线略过的彩灯掩盖了他的双眼，只能听见嘴中反复念诵着颇为流利的日文敬语。像赏析文章一样，他默默思考着这构图的含义。\n“铃——！！！”\n急促的下车铃打断了马久良的思路，他捏着眉心摇摇头。工作养成的习惯让他不自觉保持内敛。也只有说日语才能助他暂时忘记自己卑劣的身份，达到平静。\n\n“妈的，志村你这个混账……”\n\n马久良咬着牙暗自痛恨自己的无能，他还是让那件事扰乱了他的心绪。自己在苏村的工作明明非常出色，近一半人愿意和平转移，这都是他一个人的功劳，为什么志村的态度比平时还轻蔑？他明明就和自己一样只是一个懂两门语言的说客，甚至他的中文还不怎么好，他有什么资格嘲笑别人？就因为他和军队走得近？……他妈的，全都是些花架子！他们应该在会议上赞颂我的名字，而不是那泡虚荣心泛滥的狗屎！\n即使没有说出口，马还是为自己不经大脑的粗鲁想法感到失落和懊悔。但想到此时的志村已经高卧于京都豪华套房内同陪酒女郎调情，他又恨不得用牙齿把那王八蛋撕个粉碎。\n车终于停了，空荡的车厢内，孤独的思想在躯体外流浪。藉着昨晚那份报纸，似乎已经能够感受到北方大地因百鬼疾行而颤动。\n\n算了，都他妈不重要了。桂林“解放”了，真棒，再也不用跟那群穷鬼扯皮了。只不过遗憾的是，自己那十年是彻底白忙活了……\n\n笑死，还在想学校的时光？自己下辈子已经没了！这么多年没有打过农夫骂过农夫，只是和和气气把他们的处境说清楚，自己犯什么罪了？是，自己确实是在给日本人工作，自己也确实瞧不起那群愚民。但如果不是他，那些屁都不关心只想搞钱的同行会怎么处理？那些混蛋军人会怎么处理？那些拿鸡毛当令箭可能从来都没出过办公室半步的地方官员又会怎么处理？那自己呢？鞠躬尽瘁十年的奖励是什么？汉奸！枪毙！现在自己是通缉犯了，真他妈的棒！完美结局！\n\n凝视着窗外尚在沉睡中的钢铁之城，他不可收拾地大笑起来。在疯狂完全吞噬他的理性前，在皮包里的枪对准他的太阳穴前，在那一阵刺耳悲鸣带来无边死寂前，他猛然想起上一次发自真心的大笑是在什么时候。"
CPC_TRCW.599.o: "1943年，他在村里追逐嬉戏。"
CPC_TRCW.813.t: "日出东方…"
CPC_TRCW.813.d: "几乎无人能否定上海这座城市对于近代中国的重要性，无论是作为长江口经济中心的繁华都市，还是作为帝国主义在大陆肆虐的残酷注脚。对于共产党人而言，解放这座城市的意义并不仅是停留在军事层面的一场重大捷报——更代表着一场跨别几近半个世纪的回归。\n\n伪改组政府的要员早已在解放军入城前几日便出逃至了北方，日本侨民也纷纷卷起自己所能带走的一切，灰溜溜离开这个曾经供他们纸醉金迷生活的地方。在市民复杂且惊讶的目光之下，解放军以整齐的队伍步入城区，在严明的纪律之下进行着财产接管与保护城市方面的工作，以迅速恢复城市的秩序。但笼罩城市阴霾仍未完全从中散去：东海上的帝国海军虎视眈眈，伺机动身为帝国夺回这共荣圈的一大明珠。\n\n但就今日而言，暴政的旭日已然落于东海，而曾经的不夜城也将沐浴在新生的光芒之下。"
CPC_TRCW.813.o: "…照耀吾之初心。"
CPC_TRCW.607.t: "东入洛水，家国如海"
CPC_TRCW.607.d: "炮火轰鸣于中原腹地，再次震撼到这片土地上的人民。彼时距离那个过去的中华动荡时代已有十数年，如同重锤敲在每个身处此地的心脏。\n\n日本帝国陆军位于潼关的数条防线被解放军以成建制的部队的奋勇牺牲而成功包围打碎，那些在铁路上驻扎的国军都因各种原因不去驰援，反而尽力向洛阳靠拢。\n\n在洛阳通向郑州的铁路被游击纵队成功切断后，解放军形成了对于洛阳城内敌军的包围。通过数次针对性的对东门瓮城的突击后，洛阳宣告解放。\n\n当第一批结束了战斗的几名突击队员见到一个老乡在远远的望着他们的时侯，他们把武器放到身边，用着相差千里的口音招呼着对方说：“解放军来了！中国要解放了！”\n\n在大部队进入城中后，政工干部们迅速把部分士兵组织成宣传队，开始尽可能的让这里的群众认识解放军是什么，共产党是什么，解放战争又是什么。可是，故国人民有所思，中华人民不仅仅只是中原人，解放军还将要面对天之涯，地之角，茫茫如海的非解放区与人民群众。\n\n在洛阳城内秩序与驻防事项安排好后，其他解放军官兵都将目光望向了战略图上的遥遥东方，人民亦如此。"
CPC_TRCW.607.o: "我们万众一心，冒着敌人的炮火\n前进，前进，前进进"
CPC_TRCW.596.t: "歌舞已休"
CPC_TRCW.596.d: "军靴沉默地踏过坚实的土地。淹没这片土地的鲜血从三十年前人民的殷红血液换成了叛徒和侵略者的污血。刚刚占领杭州市区的解放军来不及做过多修整，就再次集结列队，整装出发。衣衫不整的人们从断壁残垣后探出头来，无声地凝望着这些行军在残破不堪的道路上的军人。有的人眼中带着惊恐，有的人激动地想要冲上前去加入他们的队伍，但是更多的是麻木。从人间天堂陡然坠入人间地狱，任何人都需要时间去适应。\n\n解放军踏着沉重的步伐绕过西湖。昔日美丽的江南明珠，如今只剩烧焦的枯木和坍圮的建筑，以及浑浊灰暗的湖水。那些需要好多人合围的古树，如今只剩下焦黑的树桩；苏轼主持修建的苏堤中的六桥都成了断桥；三潭印月也只剩下了一座破破烂烂的石塔；文澜阁更是早早被日寇付之一炬，其中的古籍文物早就被高宗武派人弄到台北去了，恐怕接下来就要转送到日本吧。\n\n解放军的目标只有一个，那就是消灭盘踞在灵隐寺的日伪军队。直到解放军在飞来峰前喊话时，窝在药师殿里幻想援军前来拯救自己的日伪军官才如梦初醒，慌慌忙忙地组织防御。他们心知肚明，投降只有死路一条。见喊话无效，解放军指战员马上开始执行预订的作战计划。为了防止损毁古迹，他们并没有携带重型火力，仅仅携带了重型机关枪。他们静悄悄地摸到大门口，比着手势，一同冲入天王殿。\n\n枪口的火光和纷飞的血液充斥在佛教圣地，弥勒佛的笑脸与肚皮上溅满了暗红的血液。此起彼伏的哀嚎声中，有解放军的呻吟，但更多的是敌寇的惨叫。这些敌人战前每日在杭州花天酒地，载歌载舞，久疏战阵，早已不是身经百战的解放军的对手，有的敌人甚至有了浑圆硕大的肚腩。\n\n战斗很快就结束了。解放军冲入了华严殿，控制了意图放火的顽固分子。随后，各级指战员立刻开始清点人数，救治伤员，并把俘虏悉数押离灵隐寺。等待他们的不可能是歌舞，只有人民意志的审判。"
CPC_TRCW.596.o: "杭州不可能再是汴州了，但是可以是他们的酆都。"
