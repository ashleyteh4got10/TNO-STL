CPC_TRCW.1.t: "军委秘会（1）"
CPC_TRCW.1.d: "夜幕无声地降临，星辰依稀可数，不管人间怎样风云涌动，古老辽阔的关中大地仿佛依然维持着十年如一日的宁静与和平，但是人们呼吸的空气显然已变得格外紧张。\n\n西安城已经实施了夜间灯火管制，宵禁时间拉长，城内外不断增多的警戒员与流动岗哨片刻不停地逡巡于阡陌之间，只有偶尔几束探照灯的强光穿破夜色，这座自1947年后被共产党人改造成战备要塞的都市正在为重新转入战争状态积极地准备着。\n\n在军委所属的某栋会议楼内，一间宽敞的作战室灯火通明，周围摆满了军事用图与战术推演道具，正中间的会议桌上，各位军事大员们正襟危坐：粟裕，许世友，韩先楚，秦基伟，杨得志，吴法宪等新晋或仍活跃于一线的主要将领分列两侧，从左到右一字排开。林彪端坐首席闭目养神，坐在副席的则是现在军委的二号当家徐向前。\n\n“既然人都到齐了，好，现在开会。”林彪摆正姿势，宣布这次特殊的战略座谈会议开幕。\n\n“这个会议是毛主席委托我代理，跟大家讨论讨论阵线下一步战争方向，我们可能很快就要与南京当局正面对抗，通报大家也看过了，高宗武正进一步扩大伪军的规模与质量，准备组建更多的精锐部队，并得到了它的日本主子的支持，因为日本帝国主义者们在亚革盟成立后愈发恐慌东亚局势失控，所以他们不仅放松了对高伪的控制，还在积极推动对阵线采取先发制人的进攻。可以说就算我们不行动，敌人也会在准备好后主动进攻我们……”\n\n顿了顿，林彪开了个不大不小的玩笑：“主席说我们就像刚过门的媳妇一样，知道要生孩子但是不知道什么时候生，所以现在很需要跟各位婆婆讨论一下怎么把这个孩子生出来。”大家笑了起来，但气氛依旧沉闷。\n\n粟裕第一个开口道：“现在要打仗，那就必须在以和日伪全面冲突的前提下做准备，我们目前的战备工作进展顺利，相信很快就能完成前期准备工作，这样我们就会有先手优势。”\n许世友接到：“要打无非就是上中下三路，北上就得取道塞外，去打伪蒙；中路就是跨过黄河，东征山西；南下那就要在云贵高原上和卢汉集团碰硬的。”\n\n杨得志：“可是这三者都各有风险，我们军队虽然这几年打了几仗，但是有没有打全面战争的资格还有待考验，必须将风险限制在一定程度上才能不至于让阵线的战略和士气严重受挫。”\n\n“你们说的都很对，所以需要想一个计划，让我们找到最脆弱的突破口。”说完，林彪用眼神示意徐向前。"
CPC_TRCW.1.o: "徐向前点点头，站起身来。"
CPC_TRCW.2.t: "军委秘会（2）"
CPC_TRCW.2.d: "“我建议，目前就以山西为阵线的突破口。”早有准备的徐向前站了起来，与会者都意识到真正的主角终于上台了。\n抑制住心中那有些汹涌的兴奋感，徐向前向所有人展示了凝聚了他多年心血的杰作——一幅标注密密麻麻的山西作战计划图，上面用不同的符号标志出了敌军的驻地，集结地，经济与军事重地，尤其是西部山区上那些星星点点的“堡垒群”引人注目。\n\n“山西是目前最合适的方向，其要点在于：一，自傅作义死后，晋系人心离散，纷争不休，太原对于周遭据点的控制也在削弱，我们已经得到了一些留守在老根据地的同志要求恢复联络的消息；二，山西是南京当局的必争之地，无论是矿产还是能源，都在伪府经济版图上占据重要位置，从这里进攻可以打乱并重挫南京的战争准备；三，战后冈村宁次主持修建的黄河沿岸堡垒体系，根据我们掌握的情况现在已经年久失修，阵线目前装备的野战火炮正是专门针对且克制此类型的堡垒。”\n\n“以山岳军的特种山地部队为先锋，渗透入晋西山地，撕开口子，因为依赖要塞，敌军主力多集中于大同或者中条山一线，黄河东岸的山地堡垒之间只有点与点的联系，易于分割，在老根据地的协助下，重点突击几处薄弱点就能形成穿插和包围，从而裂开整个防御网络，瓦解山西的堡垒体系，在敌方的堡垒防御全面瓦解后，黄河军将武装泅渡，迅速占领黄河东岸，扫清障碍并建立前进据点。”\n\n“我们的行动必然引起南京乃至日本的高度关注，所以要控制计划的推进，采取逐步升级的方式，在一个对于阵线有利的时机来到时，才是全面进攻的开始，届时解放军将在先头部队的帮助下，强渡黄河，解放山西。”\n语毕，大家才从整个计划中恍然觉醒，随之一阵热烈的掌声响起。其实这个方案徐向前早在会前就跟中央领导人讨论过，并且得到了赞许，薄一波等人还提供了很多有关情报与资料。这场会议的目的，更多还是为了说服这些一线的指挥官们。\n\n林彪也鼓起掌来，停手后开口道：“看来大家都赞同徐向前同志的建议，那好，就把这个方案当作会议的结论。”"
CPC_TRCW.2.o: "“回去后要向团级以上干部传达会议精神，就这样，解散。”"
CPC_TRCW.3.t: "久别重逢"
CPC_TRCW.3.d: "“想不到你们居然可以把工作做到敌人的碉堡里来……”\n“哈哈，那还得多亏梁化之梁大长官了。”\n\n已经快六十岁的董天知今天焕发出不亚于年轻人的活力，依稀可见斑白的胡须也兴奋得不断上扬——已经快二十多年没见过来自中央的同志了，而且这次来的还是他以前在决死纵队的老搭档戎子和。\n\n领着老搭档漫步在这处扼守着晋西北门户通道的原晋军哨所，董天知喋喋不休地介绍道：“…在前几年，我们的同志就渗透进入此处展开革命工作，但是直到前几天才有把握发起兵变，因为太原那群人现在日子不好过，不仅内讧还缺钱，对这些士兵也是刮骨敲髓，居然连续近五个月没有发军饷，全靠一丁点掺沙的劣粮糊弄人，这里主事的长官也是坏种，动不动就吸兵血还虐待士兵，在我们根据地同意供给粮食后一些原本倾向于我们的中下层军官就配合在这里的同志，在那天长官又一次打人的时候发起军事哗变，现在是我们的参谋长蔡铁根同志在主持这里的局面。”\n\n自告奋勇重返山西做联络工作的戎子和听到这里也忍不住微笑起来：“这么多年了，老董你们的政治工作还是这般犀利，果真宝刀未老啊！现在太原方面知道这里情况吗？你们的人数，游击队和党员有多大比例？”\n\n“太原完全不知道，我们现在封锁消息，伪装作一切正常，但是游击队已经和起义士兵进行了混编，共产党员干部作为政治指导员分派到各层级，总人数大概有两千多号人。具体的情况，待会这里的同志再跟你详细介绍。”\n“嗯，掌握了此处要道，届时我们的部队进军晋西北就有了一个很好的保障，我也会详细汇报给中央的。”\n\n戎子和四处张望着，发现有不少年纪颇大的战士在营地内走动，他们面带风霜，明显是转战多年的老游击队，与普遍更年轻的国民党士兵形成了鲜明对比，顿生一股心酸之感，转头对着董天知说到：“你们不容易，留守敌后还做出这等成绩，这么多年辛苦了。”\n\n头发与胡子已经发白的董天知话茬一下子沉默了，多年的经历一瞬间如走马灯闪烁在脑中：阎锡山投敌后自己带着游击队扎根敌后，与晋绥晋察冀存留的同志会师，在群山之中重建党组织与根据地，顶着鬼子汉奸的枪林弹雨辗转于晋西北土地上…多少同志怀着满腔热血与不甘在自己面前倒下？他活着坚持到现在，不就是为了能有一天打回去替他们报仇吗？\n\n良久，他才回答："
CPC_TRCW.3.o: "“只要我们还有一口气，再打多少年都可以。”"
CPC_TRCW.4.t: "人生歧路（1）"
CPC_TRCW.4.d: "人的一生该怎样度过？这是贯穿在王卫国不长的人生中，他始终在思考的一个问题。\n\n二十余年前的那个牛年，一个男娃降生在了这块贫瘠之地，降生在了这一孔陕北寻常可见的窑洞。当这个娃娃睁开眼睛看世界时，首先呼吸到的是窑洞内黄土的气息。随后映入眼帘的只有生父母王玉宽夫妇默不作声却又苦中带乐的表情。从此他有了自己的名字：王卫国。\n\n陕北是一块贫瘠的土地，也是一块神圣的土地——它是中国共产党至今依旧战斗着的地方。这块有着三十多年斗争历史的革命圣地，光荣而崇高，壮丽而辉煌，进而闻名世界，却依然是贫瘠的，堪称穷山恶水的地方。陕北百姓苦焦的一生穷苦而艰辛，无论战争年代还是现在短暂的和平，维持生计始终是老百姓生活的基本主调：生儿育女，种粮打田，谋划生机，面对黄沙干旱，迎接风吹日晒。一代又一代人不间断地重复这种生活，亘古不变。\n王卫国永远不会忘记7岁那年，他的生父带着他一路乞讨去清涧大伯家那里，用他身上最后一分钱买下了一碗油茶给他喝，一碗油茶囫囵下肚，他看着父亲问：“爸爸，为什么你不喝？”“我不渴。”那怎么可能呢？他们一路走了近百里山路，跨过几座大山，他怎么会不渴？王卫国知道，父亲在撒谎，因为他一定是把手心沾满汗水的最后一张票子留给了他。\n\n送到大伯家那天清晨，迎着朝阳露水，父亲像个小偷一样悄悄的走了，而他也偷溜到村口的榆树后面远远地望着远去的背影，他知道父亲没法再养自己，要把自己绑在这里，当时他可以大哭着追上去，但是他选择了静静地目送父亲的离去，因为只有这里能养他继续活下去。"
CPC_TRCW.4.o: "从那时起，无尽的忧愁便萦绕着他。"
CPC_TRCW.5.t: "人生歧路（2）"
CPC_TRCW.5.d: "养父母无疑是爱王卫国的，虽然他们也很穷，但是总是竭尽所能供养他生活，还让他读书上学，尽管读书时衣不蔽体，食不果腹，但是他很快乐，学习成绩也一直很好，直到小学毕业要考中学时，养父脸上开始面露难色了，家里也没钱了。王卫国知道家里难处，但他还是倔强的说“哪怕不能读书，我也要证明自己能考上！”结果就是，他从那仅有的几十个名额中脱颖而出。那天父亲叫他上山砍柴，他把斧子扔掉在地上大哭：“爸，我想上学，我想上学…”养父心里并不乐意，但是又不忍孩子伤心欲绝的样子，最后还是主动找上公社大队的老朋友来帮忙，又从邻居亲戚那里东拼西凑，于是王卫国就这么吃着百家饭走进了中学。\n\n中学简直是一片新天地，这里不仅有教科书，还有各类书籍，报纸，图书馆更是包罗万象，什么资料都可以找到，也是那时候他才模模糊糊地知道了陕北之外的世界：德国和日本盘踞整个欧洲与亚洲，中国在日伪汉奸的压迫下血泪遍野，美国组织了自由国家联盟与法西斯帝国主义激烈对抗，曾经被人仰望的苏联红星已经化为俄罗斯大地上四散的碎片，但仍有无数革命者顽强抵抗，继续战斗在世界的每一寸角落，也包括我们中国。\n\n现在他已经二十一岁了，正面临着毕业后的人生选择，本来想去生产队继续打点杂工，但是近来报纸上传达的信息，让对政治风向十分敏感的他已经逐渐察觉，国防阵线和鬼子汉奸的决战可能就快要到了。"
CPC_TRCW.5.o: "也许，机会来了。"
CPC_TRCW.6.t: "人生歧路（3）"
CPC_TRCW.6.d: "昨天，王卫国的发小找上门，说自己已经去征兵处报名准备上前线了，问他有什么打算。\n\n“我也想上去，可是我家里的难处你也是知道的。我爸妈那关我不知道该怎么过。”\n“好吧，就算去不成也没关系，毕竟前线还是太危险了，你在后方缝缝衣服，运运粮食什么的也可以为我们这些打仗的做贡献嘛，嘿嘿……”\n\n发小的话犹在耳畔环绕，强烈的不甘与冲动感充斥着内心，他想去前线，但是想起父母哀伤的眼神却连开口的勇气都没有。父母需要照顾，上战场可能会牺牲，但是对面那又是一片热血的新天地，他又怎么可以无动于衷？留下，还是出去？他该如何抉择？\n\n杂乱的思绪渐渐退去，想起今天还有木头要去砍的王卫国拾起斧头，坐在木墩上就准备处理院里满堆的柴火。\n\n突然，一架飞机从云雾中穿出，发出轰隆隆的噪声，他抬头望去发现这架飞机是从黄河对岸那里过来的，尾翼上的徽章也从国民党的狗牙徽变成了旭日环——那是日本人的飞机！随后从黄河东岸的晋西群山之中传来了一阵又一阵密集的炮响声，这种奇特的现象已经持续几天了。\n\n轰鸣的飞机声与隆隆的火炮声在远方刺激着青年王卫国的心脏，他一瞬间察觉到，那声音……"
CPC_TRCW.6.o: "……是在召唤他的号角。"
CPC_TRCW.7.t: "山西战役政治动员令"
CPC_TRCW.7.d: "英勇的全体指战员们同志们：\n解放山西的战斗就要开始了。\n我们必须全部彻底干净地歼灭穷凶极恶的晋系军阀——这颗盘踞在山西人民身上吸血榨髓的毒瘤。我们必须拔掉这个日伪在华北针对阵线最大的反动据点，以便继续前进，解放山西，挺进华北，解放全中国。我们必须将山西这个中国最重要的煤炭能源基地从日伪手中夺回，以便造福人民。我们为执行这场伟大的战役而感到无上光荣。\n我们不仅必须解放山西，我们也有把握解放山西，第一：傅匪死后山西军阀人心离散，彼此之间争斗不休，人民更是苦不堪言，已经有很多老根据地的同志和我们恢复了联系，随时可以协助我们的行动。第二，以山岳军和黄河军为先锋的先头部队已经渗透进入晋西之中，他们发起了密集的游击战与运动战，已经成功捣毁了冈村宁次建立的所谓“山地堡垒要塞防御体系”并且在黄河东岸建立了前进基地，随时准备接应我们过去。第三，石油危机爆发后，从太原到南京经济已经陷入一片混乱之中，敌军士兵缺粮少弹，连兵晌都已经很久未拿到了，士气与装备水平都在下滑，同时山西人民在反动政府压迫下斗争也越来越激烈，对我们采取了更大的欢迎支持态度，迫切希望我们去解放他们。\n最后，大家也要清楚山西军阀经营多年，构筑了很多坚墙壁垒还有大量反动武装，现在还有来自南京的增援以及日本的武器支持，他们幻想负隅顽抗，可见接下来将面临的是一场艰苦的战斗，切不可掉以轻心。我们必须力求以最低代价消灭敌人，既要勇敢也要运用智慧，每战都需充分准备，人人要善于运用技术与政治攻势去打败敌人。同时要坚守政治纪律，与人民形成良好关系，不拿群众一针一线，保护重要工业与文化设施，将一个完整的山西送回人民手中。\n指挥员同志们！你们必须以坚决奋勇，精心计划来完成这一光荣任务！政治工作同志们！你们必须以深刻的教育，鼓动工作及自己的模范作用来完成这一光荣任务！后勤工作同志们！你们必须以高度的责任心，克服一切困难，保证前方不缺粮弹，伤员能得到及时的救护来完成这一光荣任务！步兵同志们！你们必须以勇敢、顽强加技术来完成这一光荣的任务！炮兵同志们！你们必须以猛烈的火力，精确的技术来完成这一光荣的任务！通讯员同志们！你们必须以高度的责任心，保持畅顺的通讯联络来完成这一光荣的任务！\n共产党员们！你们必须在战场上，工作中起模范和带头作用，要真正不愧是一个人民的，解放军的优秀战士！\n亲爱的同志们，让我们团结同心，一齐高呼：\n解放山西，解放全中国！\n\n中国人民解放军北上军团司令员 徐向前"
CPC_TRCW.7.o: "跨过黄河，解放山西！"
CPC_TRCW.8.t: "广播开始"
CPC_TRCW.8.d: "在自己的播音生涯中，何平已经很久没有像今天这样紧张与兴奋了——上一次有类似体验的时候，还是他第一次正式坐在广播室内，向千万西北人民念读新闻稿的日子。自那以后，从继续抗战的誓词到大跃进的旗号，从讨伐马家军的声明到解放四川的宣言——他用抑扬顿挫，清晰醒人的嗓音将那些慷慨激昂的文字化作号角，一遍遍地回响在西北大地上，传诵在西北人民的耳中。\n\n而今天他手中握着的这份文件，内容与意义远远超出了他过去念过的所有稿件；它不仅将改变西北的命运，还可能改变整个中国，整个世界的命运。稿纸虽轻，但是在他掌心却有如千斤之重。\n\n对着播音器麦克风，认真地看着手中的稿件，他抑制住内心的波涛，努力将状态调节至最佳，清楚地明白此时无数人正翘首以盼着这个重大的时刻，开始冷静地念道：“这里是西北人民广播电台——”"
CPC_TRCW.8.o: "现在播报《国防阵线告全国人民书》"
CPC_TRCW.9.t: "两种命运的决战"
CPC_TRCW.9.d: "“中国西北国防阵线中央政府，中国共产党中央委员会，中央军事委员会向全国人民庄严宣告：”\n“自1947年抗日战争进入长期抗争阶段，国防阵线始终高举民族解放战争的伟大旗帜，与日本侵略者以及汉奸傀儡政权势不两立，二十四年以来，我们从未放弃过解放全中国的目标，我们在西北亿万人民的支持下击退了帝国主义，汉奸军阀的反动攻势；并夺取了社会主义事业的伟大胜利。尤其是近十年以来根据地的经济与军事都得到了巨大的飞跃，现在的我们已经有足够的力量来兑现给全中国人民的承诺了。”\n“如今，在石油危机的冲击下，沦陷区同胞正在奋起反抗，日本帝国主义与南京高宗武汉奸伪政权为了挽救他们的反动统治，采取了残酷措施镇压这些人民起义，就如同当初的广西与北平一样，但是这次有着西北人民的支持，以及强大的人民解放军的支援，全中国人民将一齐拿起武器来推翻压迫者们所谓的泛亚秩序。”\n\n“我们相信，中国是中国人民的，不是反动派的。中国古代有个寓言，叫做‘愚公移山’。说的是古代有一位名叫北山愚公的老人。他的家门南面有两座大山挡住他家的出路，愚公下决心率领他的儿子们要用锄头挖去这两座大山。有个老头子名叫智叟的看了发笑，说是你们这样干未免太愚蠢了，你们父子数人要挖掉这样两座大山是完全不可能的。愚公回答说：我死了以后有我的儿子，儿子死了，又有孙子，子子孙孙是没有穷尽的。这两座山虽然很高，却不会再增高了，挖一点就会少一点，为什么挖不平呢？愚公批驳了智叟的错误思想，毫不动摇，每天挖山不止。这件事感动了上帝，他就派了两个神仙下凡，把两座山背走了。现在也有两座压在中国人民头上的大山，一座叫做帝国主义，一座叫做封建主义。中国共产党早就下了决心，要挖掉这两座山。我们一定要坚持下去，一定要不断地工作，我们也会感动上帝的。这个上帝不是别人，就是全中国的人民大众。全国人民大众一齐起来和我们一道挖这两座山，有什么挖不平呢？”\n\n“全国同胞们，现在中国正面临着两种不同的命运：一个要消灭共产党和中国民主势力，把中国引向黑暗；一个要打倒日本帝国主义和它的走狗势力，把中国引向光明。这是两种命运的决战，我们坚决相信，只要万众一心，团结一致，我们必定能够战胜日本侵略者，推翻共荣圈的殖民压迫，建立一个真正属于全体中国人民的民主平等，统一独立的新中国。”\n\n“这场战争不仅仅是抗日战争的延续，它也是中国人民将自己的命运重新掌握在手中的解放战争，让我们联合起来！动员起来！组织起来！拿起武器，准备斗争！”" 
CPC_TRCW.9.o: "“我们失去的只是枷锁，而得到的是一个崭新的世界。”"
CPC_TRCW_FINALLY_BEGINS: "§x百年耻辱，今日昭雪！§!\n东出潼关，再无退路，§V伟大的亚洲人民解放战争§!开始了。\n--------------------\n随着§V亚洲人民解放战争§!的爆发，新的§x解放战争GUI§!及国策树将解锁。\n\n由于已经进入§R全面战争状态§!，§Y所有地方局机制§!将§R不再可用§!；§Y党代会§!将§R锁定§!大部分功能，仅§Y每年党务经费§!需要中央政府核算通过；\n\n政府仍处于运转状态，£CPGAC_texture_loc §G中央人民政务委员会§!仍可推出和实施§Y日常政策§!；\n\n由于战争影响，国防研究院下辖§o核武项目§!将放缓研究进展，核计划§Y每月进度变化§!减少§R1%§!。"
CPC_TRCW.10.t: "震动世界"
CPC_TRCW.10.d: "国防阵线对日伪宣战的广播，通过大功率转播站信号从西安发出，每隔数十里就会有西北的信号塔接收，最大限度地向外传播。层层传递，如同一座座点燃的烽火台将广播的内容传递出整个中国，整个世界。\n\n南京，国民政府宣布全国进入紧急战争状态，各地将实行戒严制度。国防部宣布国军现在开始戡乱总动员，将用精悍武力回击赤匪的入侵，并表示会尽快扩大征召范围。《中华日报》等伪政府报纸开始连篇累牍地发表支持总统府戡乱救国的决定，抵抗赤祸朝全中国蔓延的文章；据一些地下报纸报道，国安局正在奉高宗武总统“攘外安内”之命加紧镇压目前各城市蜂蛹的群众运动。\n\n东京，永田町拒绝评论此事，但所有人都能嗅出东京弥漫的火药味——内阁大臣已经动身前往皇居参加御前会议，陆军和海军亦已提前作出动作：在华的日本陆上驻军已经进入一级战斗准备，海军宣布封锁西太平洋至南海一带的海域，舰队驶入中国领海，空军战机正在各大机场频繁调动。\n\n新京、广州，越演越烈的石油危机与人民起义让当地官方已经很难提前作出任何决定，只能保持死寂般的沉默。\n\n纽约，柏林。德美两国几乎所有主要媒体都翻译转送了《国防阵线告全国人民书》的全文，从政治评论家到普通群众都在热烈地探讨着这场中国内战以及可能的第三次中日战争走向，很多人对中共与亚革盟这股新兴势力产生浓厚兴趣，大学生中的自由左翼组织纷纷走上大街游行支持中国革命，但是与民间的热烈相比，两个超级大国官方却表现得十分谨慎，没有作出明确的表态。\n\n从西北到沦陷区，所有公开或者偷偷收听广播的人们交头接耳，议论纷纷。有的低声议论，有的欢呼雀跃；有人正在秘密筹划，也有人直接采取行动拥抱革命；有人惴惴难安，也有人终于下定决心…\n\n但这一切，正处在前线的解放军战士并不能听到。他们扛着枪和炮，渡过黄河，跨过山脉，匍匐穿梭于密林之中，朝着敌军目标缓缓逼进…\n\n夕阳西沉，迷离绚烂的虹光正贯穿天际。" 
CPC_TRCW.10.o: "白日落，东方红。"
CPC_TRCW.11.t: "新中国的国号与国旗"
CPC_TRCW.11.d: "当国民党政府在我军打击下彻底覆灭后，在国防阵线的政治制度基础上组建全国性的中央政权就需要尽快提上日程了。这样做不仅向全国人民宣告我们是中国的唯一合法政府，也同样能够巩固新解放区的统治基础，为我们向全中国进军提供有利条件。现在，我们首先要决定新中国的正式国名与国旗。"
CPC_TRCW.11.o: "我们需要做出选择。"
CPC_TRCW.12.t: "定都方案"
CPC_TRCW.12.d: "在决定了国号与国旗后，还要确定新中国的首都来作为中央政府的驻地。政务委员会的各人民代表目前大部分建议北平作为新中国的首都，在各种方面上看北平都是上佳之选，但是这座城池目前就处在平津前线上，如果定都北平，就需要在全国解放后才能进行迁都工作；也有人提议首都建立在南京或者西安，这样不仅可以尽快开展迁都工作，而且各种政府设施都可以直接利用，我们当作何选择？"
CPC_TRCW.12.o1: "北平"
CPC_we_choose_beijing: "在§x亚洲人民解放战争§!胜利结束后，我们将迁都至§Y北平§!。"
CPC_TRCW.12.o2: "南京"
CPC_TRCW.12.o3: "西安"
CPC_TRCW.13.t: "中央人民政府公告"
CPC_TRCW.13.d: "自南京国民党反动政府背叛祖国，投降日本帝国主义，并发起反革命战争以来，全国人民处于水深火热的情况之中。幸赖我人民解放军在全国人民的援助之下，为保卫祖国的领土主权，为保卫人民的生命财产，为解除人民的痛苦和争取人民的权利，奋不顾身，英勇作战，得以消灭反动军队，推翻国民党政府的反动统治。\n\n现在人民解放战争业已取得初步的胜利，全国大多数人民业已获得解放。在此基础之上，由全国各民主党派、各人民团体、人民解放军、各地区、各民族、国外华侨及其他爱国民主分子的代表们所组成的中国人民代表业已集会，代表全国人民的意志，宣告中国中央人民政府的成立。本政府，为代表全体中国人民的唯一合法政府。凡愿遵守平等、互利及互相尊重领土主权等项原则的任何外国政府，本政府均愿与之建立外交关系。\n\n特此公告。"
CPC_TRCW.13.o: "新中国成立了！"
CPC_TRCW.14.t: "时间的长度"
CPC_TRCW.14.d: "生命有时很复杂，复杂到洋洋万言也不能写尽；生命有时又很简单，简单到几条波动线条就能概括。陪伴毛泽东半生，令他挥斥方遒的神力已悄然离去，徒留一具苍老的躯壳仰躺在病床上。戴上了呼吸面罩，连上了心电图，打上了点滴，乱七八糟的管线全都接在毛泽东身上，紧紧地拽住他，因为稍有不慎，这个垂死的老人便会转身离开这个世界，永远不再回来。\n\n病房的白色窗帘严严地拉着，却挡不住星星点点的闪光，为庆祝新中国成立而燃放的烟花已把汉中的夜空照得亮如白昼。\n\n“外面……好亮堂……”\n\n一个沙哑虚弱到几乎听不见的声音轻轻响起。守在病床前的护士第一个扑过去，随即跟在后面身着白大褂的邓小平也围了上来。所有人都没有想到，已经深度昏迷的毛泽东竟又能恢复意识，而且开口说话了。\n\n“首长，毛主席他——”\n\n“告诉毛主席吧。”邓小平垂手而立，面容肃穆，“主席现在醒过来，想必是放心不下。说也好，不说也好，都不一定撑得过今晚了。”\n\n于是，护士俯下身，把脸贴在了毛泽东的耳边。\n\n“主席，是新中国成立了，群众在放烟花呢。”\n\n“噢……新中国……新……中国。”\n\n毛泽东像是咀嚼一颗话梅似的，慢慢把这个词念了两遍。他的脸被氧气面罩包裹着，看不清表情，但在某一个瞬间，在场的每一个人都看见，毛泽东的嘴角似乎扬了扬。\n\n“主席……主席他刚刚不是笑了？”一时恍神的邓小平不由脱口而出。\n“首长，现在不是说这个的时候！”护士急得要哭喊出来了，“主席他的心跳停止了啊！”\n“主席！毛主席！！！”\n\n心电仪凄厉的报警声响彻病房——而在这座防空工事之上，汉中市热情洋溢，一枚今夜最大的烟花正嘶嘶啸鸣着直升天空，在夜幕里开出了一朵最灿烂的花。"
CPC_TRCW.14.o: "主席！您醒醒！主席！！！"
CPC_TRCW.15.t: "日本密信"
CPC_TRCW.15.d: "“中国国防阵线主席暨中国共产党中央委员会诸位敬启：\n\n迄今为止，日本帝国一直在与其承认的中华民国政府为了泛亚和平而并肩作战。然而，无论是中国国内激烈的战局还是汹涌的民意都已发展至不一定对日本有利的境地，为此我国政府现将以最大的诚意倾听中国民众的心声，尊重中国人民的自主选择，首相本人在这封信中表达了他的善意，并希望国防阵线的诸位能够考虑他慷慨的提议。\n\n帝国重申希望根据泛亚团结理念、在亚洲实现和平的愿望。如果贵方同意，停火谈判可以立即进行。但我们不得不提醒，如果贵方想要谋求和平，那么就必须维持中国现有法定疆域；并承认满洲、蒙疆等国的独立地位，日军愿意全面撤出中国境内，归还主权，尊重中国新政府的独立自主。\n\n此外，我方得知贵方在长江入海口击毁了我方战列舰“雾岛”号，雾岛号误闯长江入海口一事系我方海军部分军官激愤独走所为，非大日本帝国政府之官方态度，我们愿意就此事不作进一步追究，但我们仍然希望贵方立刻交还贵方扣押的舰上作战人员。他们均为大日本帝国公民，若贵方执意扣押，则帝国政府将不得不认为这是实质对抗举措，我方将立即取消所有后续外交谈判议程，并视为与贵方进入全面战争状态。\n\n为全东亚长治久安，为全东亚人民福祉计，我们希望，贵我双方能够在这个问题上达成一致，就像过去的时代一样。日本政府已经作出慷慨让步，希望我们的和平愿望能够得到中共诸君的尊重。”\n\n——大日本帝国，[JAP.GetLeader]，谨代天皇陛下敬奉"
CPC_TRCW.15.o: "痴人说梦，不可理喻。"
CPC_TRCW.16.t: "时间的终点"
CPC_TRCW.16.d: "薄一波、江青、习仲勋、韩光、谢静宜、关锋，他们一起站在急救室外，静待着一个最终时刻降临。急救室的灯灭了，邓小平夹着白大褂从里面慢慢走出，回身带上了门。江青一蹦来到跟前询问主席都和他说了什么，之所以如此急躁，是因为直到今日她所掌握的权力全都来自于她的主席。她害怕自己根基不牢，主席一旦去世就立刻被其他人踢出领导层。\n\n事实上，病房内的毛泽东同样有这层考虑，即使听到新中国宣告成立的消息，他在心里也放不下这名政治上乳臭未干的学生。面对约谈的邓小平他亲口说：“你的泼里特（political）比她强，她没有你强。”言下之意，是邓小平必须保证江青的党内地位。如果他敢清算主席的遗孀，有人会找他算账。但是这些话，毛泽东都不允许邓小平告诉江青，不然会助长她的幼稚病。\n\n邓小平做好了被江青盘问的准备，与此同时，悲伤和恐惧冲昏了江青的头脑，她已经想不出办法让周围人快速承认自己的地位了。\n\n“我问主席要怎么处理他的遗体。主席说，要火化。”\n“还有什么？”\n“我问主席要不要像列宁那样永久保存。主席说，他不想折腾了。”\n“还有什么。”\n“主席说要保密，现在仗还没打完，之后等全国解放再说。”\n“还有什么！”\n“没了……”\n“没了？！”\n\n江青红了眼，发狠扒开邓小平闯了进去，倾身扑倒在病床一把鼻涕一把泪地哭诉：“主席……主席……你还有什么要和我说的……你可不能这么扔下我不管……你是不是还有什么指示没给我……主席……主席……”\n\n说着说着，江青的手在毛泽东身上蛮横地搜索起来，企图找到那根本不存在的指示。很快跟上来的医生拦住了失去理智的江青，关锋和习仲勋将她架了出去。在医生的指示下，薄一波、邓小平、韩光、关锋、谢静宜鱼贯而入，向这位病危的伟大领袖做临终告别。\n\n午夜0时9分，毛泽东心跳彻底停止跳动，他的灵魂坠入永恒的时空之中。他的指示将被同志贯彻，他的思想将被后人临摹，他的事迹将被载入史册。"
CPC_TRCW.16.o: "时间，停滞在了那一刻。"
CPC_TRCW.17.t: "三百九二阶"
CPC_TRCW.17.d: "幽静的紫金山对于那些疲乏于斗争的政客来说是个周末的好去处，假使就此被幽禁于此近三十年呢？宋庆龄便是这样被伪政府幽禁于这个公馆——倘若换了他人，想必早日已经精神崩溃了，但她早已经走出被幽禁的抑郁。伪政府虽禁止她与外来人等交流，也禁止她阅读时事相关的内容，但她得以转投诗词创作以消解幽禁的烦闷。 \n\n她清楚，亡党亡国之恨从未离开过她的心头，她多么希望，有一天，中国人民将会自由地屹立于寰球民族之林。\n\n乌飞兔走，时光荏苒。\n\n远处城内的炮火声逐渐平息，原本负责守卫她的伪政府警卫也早已不知所踪，随着一车队的解放军驶入公馆，她也就此获得了自由身。而宋庆龄在获得自由身后的第一件事并非是去拜访解放军的领导人，而是对她身边的护卫说，她想去看看孙先生。幸而公馆与中山陵的距离并不遥远，首长也就同意了这个请求。\n\n一步，又一步，她逐渐靠近她所爱之人安眠处。一步，又一步，长期的幽禁让她身体虚弱，在最后几阶，她濒临摔倒，却又被旁人搀扶。一步，又一步，蹒跚的宋庆龄终于与孙中山团圆，满目疮痍的南京终于回到了中国的怀抱中。"
CPC_TRCW.17.o: "“逸仙，我回来了……”"
CPC_TRCW.18.t: "最后协议"
CPC_TRCW.18.d: "中国中央人民政府主席 敬启：\n\n战争形势在东亚的发展已经远远超出日本的预期，共荣圈内成千上万无辜的黎民百姓被卷入战火，其中也包括日本在外的侨民、企业、工作人员以及为了保护国民生命安全的帝国军将士。帝国政府不忍看到国民葬身于异国他乡的土地上，现真诚地给出以下诸项提案，以求两国停止战事恢复和平状态：\n\n一、驻扎在中国境内之日本军队停止一切军事行动，并分批完全撤离。\n二、放弃对于满洲、蒙疆、广东等国之承认，由该地人民自主决定命运。\n三、贵方应妥善保障未及撤离的日本在华企业之财产安全，等候讨论未来前途。\n四、日本侨民应尽量得到保护，由双方协商遣送回国。\n五、中日两国沿鸭绿江为界设置停战线，未得允许双方皆不能擅自越线。\n六、即日起中日两国恢复回战争前的和平状态。\n\n这是最后的协议，希望诸位认真考虑帝国作出的真诚建议，否则我方将不计后果，采取最后报复手段。\n\n大日本帝国政府\n\n在此照会。"
CPC_TRCW.18.o1: "现在，该坐下来谈谈了。"
CPC_TRCW.18.o2: "不，我们不会善罢甘休。"
CPC_TRCW_GO_FUCK_JAP_IMPERIALISTS_tt: "§x只要公道得胜，哪怕世界灭亡。§!"
CPC_TRCW.19.t: "终焉"
CPC_TRCW.19.d: "圣经上说，上帝用火与硫磺毁灭了索多玛，报复了这座不义之城。\n\n赵德志并没有看过圣经，他是坚定的无神论者，他是西北国防阵线的人民——曾是。\n\n他记得他只是跑，偷了一匹马，从呼和浩特跑，一开始身后有骑警追，但他头也不回，他不记得跑了多远，直到身后没有骑警们的叫骂，直到鞍下的马重重地摔在地上四腿乱蹬口吐血沫。\n\n他仍然拖着一条伤腿一瘸一拐地往东走，偶尔能听见身后传来雷声隆隆，但他仍然头也不回，只是走，走到星月满天，太阳全然消失在地平线上之时——\n\n圣经上说，罗得之妻回头顾看火海中的索多玛，于是瞬间化为一根盐柱。\n\n赵德志并没有看过圣经，他也并不是个什么心肠慈软的妇人——但他再也走不动了，他瘫坐在内蒙的草原上，望着他来时的方向。\n\n星月满天，他看到了远处时不时燃起的火光，明明在眼中只如黄豆大小，但仍然红得刺眼——\n\n他想起上个月发放的民兵防核手册，他试着举起了手——火光与惨剧被翘起的大拇指严严盖住，仿佛那里还是抗日的最后堡垒，是自由中国的最后希望，而不是火海中的“索多玛”，不是“终将毁灭的亚洲公敌”。\n\n手扶着犁向后看的，不配进神的国——耶稣似乎曾经这么说过。\n\n赵德志并不知道耶稣说过这些，他大概也不会再有机会知道了——高居于太阳威严之上的并非上帝，而是高天原诸神与祂们的子嗣，神明的子嗣行走在人间，用火与硫磺毁灭了犹太布尔什维克主义在东亚的最后巢穴，毁灭了“索多玛”。\n\n劫后余生的庆幸终有一日会化为怒火，从索多玛出逃的不义者们也许仍将在高天原诸神的应许之地下行不义之事——"
CPC_TRCW.19.o: "——但到此为止，不义者们的故事暂告一段落。"
CPC_TRCW.20.t: "华南局急电"
CPC_TRCW.20.d: "党中央、中委、军委：\n\n中央决意抗战的讯息已传遍整个东亚，现特向中央汇报广东现状，并提出敌后斗争计划。\n\n受石油危机冲击，广东地区形势正急速恶化：大批普通工人失业、待遇骤降；不断有失业游民上街闹事；大量工厂因石油及电力短缺关停歇业；财阀焦头烂额于挽救溃烂的经济形势；立法会内部倾轧争执不断。\n\n华南局在广工联及华工委发展的工友华胞们已经准备好掀起足以瘫痪全广东的暴乱，我们将尽可能破坏敌伪行政系统，扰乱敌伪的行政工作，将广东彻底变作帝国主义者的泥潭，伏望中央尽快就广东事态予以答复！\n\n华南局叶肖卢马\n驻越军事代表韦国清"
CPC_TRCW.20.o: "同意你们的请求。"
CPC_TRCW_GNG_RIOTS_BEGINS: "随着§V广东暴乱§!爆发，我们将可通过£CPC_texticon §G华南局§!三十年来在£GFX_GNG_Guangdong_texticon §S广东§!布下的§Y复杂情报网络§!得知此地区的详细情况。\n\n将§Y解锁新的决议和国策§!以控制§V广东暴乱§!的进程。"
CPC_TRCW.21.t: "归乡之路 - 终"
CPC_TRCW.21.d: "杨盈喜死死地盯着正在发出沙沙白噪的收音机——以往它并不这样，以往收音机里会传来铿锵有力的呼号，会传来振奋人心的革命歌曲和前线战报——哪怕头上偶尔有炸弹落下，电波依然把抗战的信心和凯歌送到格尔木来，送到杨盈喜的耳边来——\n\n费尽千辛万苦的人民解放战争只差临门一脚，明明解放全中国的大业近在咫尺，明明连毛主席都已经安然合眼将最后的未竟之事交给身后的继业者们了，可为什么？为什么祖国在历经千辛万苦之后仍然赢不了日本侵略者？\n\n她不明白，她开始烦躁起来，姐姐上次打电话给自己时她还能听见前线炮火，可那也已经是好久之前了——她双手挤头，死死抿住嘴唇，将头发一绺绺攥在手心，仿佛要将自己的头皮扯下。外面似乎响起了惨叫声——鬼子这么快就打进格尔木了吗？杨盈喜五内如焚，她跌跌撞撞地走向一个檀木大箱——那是老苗族留给自己的遗产，她翻出了一把很有历史的左轮手枪——以及最后一颗子弹。\n\n“我杨盈喜死都不会让你们日本人糟蹋，我死都不会让你们糟蹋，我死都……”她的声音发抖，几次都没能抓稳左轮手枪，但她终于还是将枪管捅进了自己的嘴里。\n\n死亡的巨大恐惧萦绕在杨盈喜全身，她拼命呼吸，瞳孔震颤，脑海里画面一幕幕闪回——最终定格在二十五年前她骑着马，抱着姐姐在滇中的苍翠山道中前行的悠闲时光。\n\n她仍然大张着嘴，任由黑洞洞的枪口顶在上颚，但却终于平静了下来。\n\n“姐，我来了。”"
CPC_TRCW.21.o: "她们的故事死了——连带着中国一起。"
CPC_TRCW.22.t: "易水悲歌"
CPC_TRCW.22.d: "年已六旬儿孙绕膝的马仲英怎么都没想到，自己居然还有再次披挂上马指挥战斗的一天：几个卫戍骑兵旅，建制散乱的解放军残部，以及赛福鼎勉强从北疆拉来的几支民兵旅——这就是他手里有的全部力量，而这次，戎马半生的马仲英即将直面前所未有的强敌——日本陆军正向格尔木集结兵力，不日便要入侵新疆。\n\n“如果当年我们姓马的不在大西北造那么多孽，比如啊，我年轻时候不在甘肃青海屠城，我那狗日的大侄子马继援十年前不在阵线搞破坏——你说，中国的结局会不会不一样？”他试探性地问了问同样已经身着戎装的赛福鼎。\n\n赛福鼎苦笑一声，但眼神并未看着马仲英，而是直勾勾地看着眼前的黄沙和远处的大山：“老古人讲万方有罪，罪在朕躬。马将军这是自比皇帝吗？”\n\n“嗐，我没心情跟你开玩笑……”马仲英附和着干笑两声，“当初我们姓马的干那些事，说实在的回来以后我挺后悔的，也挺内疚的。”\n\n“那你觉得跟着阵线干革命这些年，对得起新疆人民吗？”赛福鼎转过头来。\n\n“……我不晓得，我只晓得，三十年前国家正是打仗艰难的时候我跑到了苏联去，没有尽到抗日的义务；一年前我说要上前线，中央却请我接着留守后方安定新疆军民；当初留我学马克思的苏联不在了，现在中央也不在了，在我马仲英前面护着我们保着我们的人一个个都倒下了，如果我再苟活下去，我还配让你们叫我一声马将军不？”\n\n赛福鼎未再发言，只是赞许地点点头，两人视线相对良久，互相露出了释怀的笑容。\n\n“……上路吧。”"
CPC_TRCW.22.o: "于是，他们抽出马刀，向新秩序发起最后的冲锋。"
CPC_TRCW.23.t: "南京密信"
CPC_TRCW.23.d: "毛泽东已经不能抽烟了，他只是安静地侧坐在病床旁，看着屋内的通风风扇，若有所思——他身旁的床头柜上，则摆着南京政府通过特殊渠道秘密向中央递送的停火协议。\n\n门外脚步声响起，薄一波很快来到了他的床前：“主席，您找我吗？”\n\n毛泽东颤颤巍巍地拿起那份协议：“国民党的和约，你拿给刘少奇看了没，他的意见是什么？”\n\n薄一波心中一凛，明白了毛主席的意思：“已经给刘主席看过了……”\n\n毛泽东打断薄一波的话：“其实也不消问你们的态度，这张纸完全就是废纸，[CHI.GetLeader]要输了就想停战，居然还想保留他们的什么华北自治政府……”\n\n“是，刘主席也是这个意思，他也说这完全是痴人说梦，不可接受。”\n\n沉默半晌，毛泽东开口了：“我写不动字，就在这里用嘴讲，你和小平他们去办。要公开揭露这份‘停火协议’有多不可理喻，要让全中国人民晓得伪政府死到临头了还心存幻想，还想跟我们划黄河而治，一定要揭露法西斯阵营内部的，蝇营狗苟。”说到最后四个字，毛泽东加重语调——但随之而来的却是剧烈的咳嗽。\n\n薄一波连忙上前轻拍他的背，直到毛泽东呼吸平缓，薄一波才直起身来。"
CPC_TRCW.23.o: "“这就去办。”"
CPC_TRCW.24.t: "《彻底揭露日本帝国主义狼子野心》（节选）"
CPC_TRCW.24.d: "……为了保存中国反动势力与日本在华侵略政权，日帝走狗政府在即将被人民解放军消灭前夕宣称“希望国内局势尽快恢复稳定，为了万民之幸福安危，国共双方应该走上谈判桌和平解决政治问题，不要为了一己之私置整个东亚人民于战火之中。”这份所谓“和约”意味着伪政府妄想要求我军停止脚步，这让全中国人民都为之感到可笑——因为当初正是日本帝国主义为了自己的军国主义利益将侵略战火与殖民统治强加给了中国人。\n\n伪政府走狗还与日本帝国主义还串通一气，阴谋策划在华北重建那个臭名昭著，双手沾满鲜血的“维新自治政府”；与此同时在东北与广东都增派了大量的军队，其舰队公开闯入中国领海并向沿海地区发起炮击，杀害众多无辜群众，他们宣称为了“保卫整个共荣圈的集体安全与亚洲共产大军不惜一战”，这不会吓倒中国人民，只会让中国人民更加坚定决心彻底驱逐日本侵略者。\n\n中国革命的怒潮正在整个东亚掀起，现在摆在中国人民、各民主势力、各人民团体面前的问题，是将革命进行到底呢，还是使革命半途而废呢？如果要使革命进行到底，那就是用革命的方法，坚决彻底干净全部地消灭一切反动势力，不动摇地坚持打倒帝国主义。侵略者的傀儡高宗武匪帮用轰炸机、战斗机、大炮、坦克、火箭筒、自动步枪、汽油弹、毒气弹等等杀人武器屠杀了成百万的男女老少，而日本帝国主义则依靠他们掠夺中国的领土权、领海权、领空权、内河航行权、商业特权、内政外交特权，直至打死人、压死人、强奸妇女而不受任何处罚的特权。难道被迫进行了如此长期血战的中国人民，还应该对于这些穷凶极恶的敌人表示亲爱温柔，而不加以彻底的消灭和驱逐吗？只有彻底地消灭了中国反动派，驱逐了日本帝国主义的侵略势力出中国，中国才能有独立，才能有民主，才能有和平。\n\n中国人民解放军将继续前进，直到日本帝国主义彻底退出其侵略之中国国土，直到全国得到解放，直到人民解放战争得到完全的胜利为止！"
CPC_TRCW.24.o: "战争继续。"
CPC_TRCW.25.t: "天知否（一）"
CPC_TRCW.25.d: "“——目前几大军团在前线的进展很快，北上军团已经攻克山西主要据点，南下军团在朝云贵高原的纵深进军，东进军团正在往武汉穿插，相信很快能突破敌军中南防线，将主力插入南京的心脏……我们后面开会决定，部分中央领导同志和疗养的老同志要疏散到汉中去——主席您的意思呢？”因为怕主席听不清，邓小平不得不拿着小板凳坐在床沿，用不大不小的声音汇报工作，仿佛一如往日。同时，江青，刘澜涛，高岗等人也守在屋内等候：这已经是第二次病危了，好在主席还是逐渐从抢救中恢复过来，他将脑袋偏在一旁，眼睛朝向窗外——那里树木青翠欲滴，绿叶在微风中轻曳。\n\n“可以了，军委的事情就军委定——武汉和广东要尽快拿下来，这两个地方拿下了，军工就有保障。撤汉中的事情，我走不动路，要烦请你们把我抬走了。”他干笑两声，把眼睛转回众人身上，只是简短吩咐了一句，但是他仍有话想说。疲惫的眼神如同燃尽的枯木，从在场四人身上一一扫过，良久后毛泽东才决定把一些在过去犹如骨鲠的心里话套出来：“你们这样围着反而让我想起我被人搀着去病房看恩来的时候，那时候他床前没什么人，只有邓颖超陪着。还有孙中山先生，胡志明同志——都是革命尚未成功就撒手人寰的可怜人，如今恐怕也要轮到我毛泽东了，我倒还希望我能再熬个一两年，至少看到新中国成立……这几天心里也老攒着些话，不说不开心，既然你们几个都在这里，也都是跟着中央斗了几十年的可靠同志，那就让我这个半死的人在去见马克思前最后说几句话。”"
CPC_TRCW.25.o: "（下一页）"
CPC_TRCW.26.t: "天知否（二）"
CPC_TRCW.26.d: "“我今年七十九了，按照虚岁算就是八十整，已是耄耋之年了。我年轻的时候什么都信过：什么改良派、自由派、甚至无政府，省宪自治……把脑子搞成一锅大杂烩，但是都没有坚持很久，直到我第一次接触共产主义，马克思列宁主义以后，我的信仰就再也没有改变过。为什么？因为我相信这个主义是真理。”\n“真理两个字很重要，为什么我们今天能一起坐在这里？因为我们都是相信共产主义这个真理，都相信只有走社会主义道路才能救中国。我们可能对于某些问题的看法，包括某些具体事情的做法都不一样，但是根本目标是一致的，都要把这个社会主义事业继续下去。”\n“几十年坚持不容易啊，多少人白头，多少人离去，他们本不必选择这条路，却义无反顾地把这条长征路走了下去，一走就是几十年，有的人甚至再也无法与我们并肩了。”\n“我们这个党是多灾多难的，从陈独秀、李立三到张国焘、王明，几次把我们党拉入几乎灭亡的边缘；我们都是跟他们斗争后才找到了一条符合中国革命实际的道路，正确的道路并不掌握在几个人手里，而在人民群众的实践之中，只要我们党能够用自己的心去回应他们的心，这天下又有什么事是我们可怕的？”\n“党的路线，我说过很多次了，我们争来夺去无非就两个问题：一个是革命，肯不肯吃苦，肯不肯出血，抛家舍业干革命；一个是恒心，不管杀这个，夺那个，明争暗斗，战火纷飞，都是为了坚守革命道路。老话讲始善者众，终善者寡。你们又有几个还记得自己当初为什么选择共产党这条路？又有几个能保住我说的恒心，保证以后这个党不会逐渐异化出各种各样的怪胎，骑在人民头上作威作福？这些问题，我以前就想跟你们里的一些人讲了，但一大个日本还挂在东边等着我们去打倒，实在也不好开口——到了现在也是懵懵懂懂的，也没机会想了。”望着在座四人：江青眉头微绉，面带不屑；刘澜涛表情僵硬，显得格外紧张；高岗低头垂眉，神色哀伤；邓小平面无表情，神态沉稳。毛泽东默默叹气，用手指着四人，说出了留给这些继业者们的最后一句箴言：“至于你们怎么办……”"
CPC_TRCW.26.o: "“恐怕也只有天知道了。”"
CPC_TRCW.27.t: "时间的宽度"
CPC_TRCW.27.d: "留守西安的邓小平已经很久没来找过他汇报工作了，这让毛泽东有些沮丧。自共产党建军以来，他从没有错过任何重大事件，这一直是他引以为傲的经历。可统治的中心早已离开他，作为千百万普通老人中的一员，或许现在的工作本来就没必要向他汇报。\n\n除信使谢静宜和医生外，毛泽东时常能见到的人只有转移到汉中的薄一波和韩光，他们定期来探望这位健在的老主席，把处理好的文件连同最新的报纸杂志送给他阅读。可长期寓居在汉中防空工事里，毛泽东已经失去了时间的概念。水泥盒子牢牢禁锢了他的思绪，文件上标注了明明白白的日期，可日出日落的印象已然模糊。浩如烟海的战报更像是在播出一场输赢不定的篮球赛，消磨了他的耐心和寿命。\n\n“见不到阳光，脑子要僵住了。”毛泽东敲敲自己的脑壳，向谢静宜哀叹道。\n\n谢静宜的任务除了给毛泽东汇报一切外界消息之外，还负责与远在西安的江青单独联络，定期汇报毛泽东的身体状况，这是邓小平都不具有的权力。显然江青进入中央政治局后，毛泽东把所有希望寄托在这位好妻子身上，允许开通这条通道。\n\n这天早上，一个毛泽东所不知的早上，南京解放的战报传进了防空洞。自战争开始后，毛泽东浮肿的脸上难得挤出一丝笑容——八十年革命生涯只为这一封喜讯而存。现在他获得了永远的宁静，仿佛扑倒在漫无边际又无比舒适的黑暗之中。在医生们的注视下，毛泽东陷入深度昏迷。\n\n西安收到了毛泽东病势沉重的电报，冒着敌机轰炸的危险，一辆专列开到汉中站，车厢里走下了泪眼婆娑的江青。她披着红色的头巾，穿着淡蓝色的外套，马不停蹄向毛泽东的住所奔去。"
CPC_TRCW.27.o: "我还能看到明天的太阳吗？"
CPC_TRCW.28.t: "雾锁长江"
CPC_TRCW.28.d: "“这就是长江吗，怎么看上去咋这么浑呢？还不如咱们打马家军时路过的青海湖蓝呢。”\n冷冽的江风中，侦察连的前哨战士吴小川背着67式，伸直腰板努力地往前瞄，试图用肉眼捕捉到更多的画面：自小都听大人说长江是中国的第二大水系，是非常壮丽秀美的，但现在长江给他的初印象却是混浊压抑的。灰蒙蒙的江面上，一层又一层地弥漫着的浓厚雾气像无数根绳子一样缠绕着。日落的余晖穿透江雾，斜照在长期用来当工业废水排放处的江口，漂浮着各色污染物的水面波光粼粼，给人莫名生动的窒塞感。\n再往东，就是波涛汹涌的大海，侵华日军的战舰也是从那里耀武扬威地进入长江的。\n自南京解放后，解放军高度警惕长江流域来自日本方面的军事动作，这才有了侦查连现在的任务：在扬子江东段侦查一切可疑的日军动态。\n\n“还不都是高汉奸为了他那狗屁现代化干的好事，祸祸完老百姓不够，还把祖宗留给我们的大好河山给污染了。”同为侦察连的战士杨秀山比较关注时事，一语道破了自己同志的疑惑。\n\n“原来是这样！这些国民党反动派真不是东西，将来咱们的共产党坐了天下可不能学他们，必须要好好保护自家的人民和土地……”\n话音未落，一声炮响从远处响起，吓得两人立刻中断对话，赶忙拿出望远镜观察：一艘艘炮艇肆意地往岸上喷射火舌，但比那更令人生畏的是从水平面上缓缓浮现出的庞然大物，正悬挂着旭日旗径直朝南京的方向驶来。\n\n“他奶奶的，小鬼子的舰队来了——”"
CPC_TRCW.28.o: "“立即向南京前委汇报！”"
CPC_TRCW.29.t: "江雾退散"
CPC_TRCW.29.d: "“大日本帝国海军，依法行驶在长江流域航行权力”（旗语）\n南京长江，那艘庞大的钢铁巨兽——日本“雾岛”号巡洋舰。平稳地行驶在江面的中心之处，航速缓慢，铃木船长放下望远镜，心绪十分不安：是否该奉上级命令进入长江，以保护侨民的名义再复刻一次对南京的炮击事件。而岸上的解放军炮兵则同样焦虑，那漂浮在江面上的巨兽远远望去是那么渺小，为了减少误差，两岸所有阵地都被拉到了离江尽可能近的地方——也都在敌方舰炮的攻击范围内。但无论如何，那高悬太阳旗的巨兽开始加速了。\n\n“长江是中国领水，请你方军舰立即离开，否则将无法保证你方安全”（旗语）\n炮手张维看到后方在舰炮射程之外的重炮开始轰击船的周边作警告，那是在警告船上的人长江已经不再是他们的地盘，也是在警告沿江的分散的各炮兵组作好战斗准备。但警告的作用微乎其微，敌人的舰炮转动,抬高，随后以几声无人的防区中响起的爆炸作为回应，并且因为数轮后方炮火未命中，更加嚣张的行动了起来。\n\n“全炮准备！瞄准日舰！”\n哨兵向计算员传达方位，而方位又在计算员的笔下被转化为角度传递给其他人，其他人开始迅速地转动起略有锈蚀的高低机转盘、炮弹、炸药包被分别推入炮中，而爆炸声与轻微的耳鸣紧随其后。\n\n“打中了吗！”，“没，就两个中了！咱提前量大了！再校正一次！”，张维又重新将炮口校准回目标上，然而刚才的开火的火光让不少阵地暴露了，敌舰开始还击并且已经损失了一个阵地，但目前敌舰的一座舰炮也已受损。\n“方向向左零零一，高低加五。”\n“校正诸元！三号装药！单发弹——放！”，不断有新的阵地迎着敌舰的炮火开始攻击，炮弹炸塌了指挥室上的瞭望塔，舰船中部的火焰迅速蔓延到了指挥室之中，浓烟从当中不断排出，而原本对岸友军埋伏着的炮火也开始了急促射，很快便让舰船后部的舰炮发生了大爆炸，敌舰停止了机动，如同靶子一般靠惯性行进着，向搁浅区驶去。"
CPC_TRCW.29.o: "虎踞龙盘今胜昔, 天翻地覆慨而慷。"
CPC_TRCW.30.t: "归乡之路 - 终"
CPC_TRCW.30.d: "杨盈喜死死地盯着正在发出沙沙白噪的收音机——以往它并不这样，以往收音机里会传来铿锵有力的呼号，会传来振奋人心的革命歌曲和前线战报——哪怕头上偶尔有炸弹落下，电波依然把抗战的信心和凯歌送到格尔木来，送到杨盈喜的耳边来——\n\n费尽千辛万苦的人民解放战争终究没能达成使命：战线溃退、死伤惨重，明明根据地经过了十年淬火已然获得重生，明明前线已经聚集起百万人民解放军精锐！可为什么？为什么祖国在历经千辛万苦之后仍然赢不了日本侵略者的哪怕一只走狗？\n\n她不明白，她开始烦躁起来，姐姐上次打电话给自己时她还能听见前线炮火，可那也已经是好久之前了——她双手挤头，死死抿住嘴唇，将头发一绺绺攥在手心，仿佛要将自己的头皮扯下。外面似乎响起了惨叫声——国民党狗汉奸这么快就打进格尔木了吗？杨盈喜五内如焚，她跌跌撞撞地走向一个檀木大箱——那是老苗族留给自己的遗产，她翻出了一把很有历史的左轮手枪——以及最后一颗子弹。\n\n“我杨盈喜死都不会让你们糟蹋，我死都不会让你们糟蹋，我死都……”她的声音发抖，几次都没能抓稳左轮手枪，但她终于还是将枪管捅进了自己的嘴里。\n\n死亡的巨大恐惧萦绕在杨盈喜全身，她拼命呼吸，瞳孔震颤，脑海里画面一幕幕闪回——最终定格在二十五年前她骑着马，抱着姐姐在滇中的苍翠山道中前行的悠闲时光。\n\n她仍然大张着嘴，任由黑洞洞的枪口顶在上颚，但却终于平静了下来。\n\n“姐，我来了。”"
CPC_TRCW.30.o: "她们的故事死了——连带着解放之梦一起。"

CPC_TRCW_NANJING_1.t: "人生末路"
CPC_TRCW_NANJING_1.d: "夜色的南京迷失在狂乱中——包括灯火辉煌的总统府，共产党刚刚举兵不满半年，怎么就能冲破重重防线直达南京城下？共军的部队是列装了他妈的美国人的大脚怪越野车了还是嗑了他妈的德国人的肾上腺素了？\n\n高宗武的大脑被这种纷繁杂乱的念头占满，颓然在总统办公桌前空转。助手周隆庠如同风一般闯进办公室。他疲惫的脸上满是沉重，“高先生，共匪已抵达南京城下，我们赶紧转移吧。”他短促而富有感情的声音打破了室内的静谧。总统先确认了妻女的安全，然后他们二人匆忙启程，逃向机场。\n\n然而，他们的逃亡并不顺利。空气中弥漫着不安和迷茫，他们不知道飞往哪一个地方才能保证自己的安全。高宗武本就杂乱的心绪此刻更加忐忑不安——半年不到几乎全民国就沦陷了，日本人断不会收留如此无能的流亡领导人，那美国呢？德国呢？\n\n犹豫就会败北，在机舱内举棋不定的高宗武终于听到了解放军踹烂舱门的声音——他明白自己也无处可逃了，逮捕，收监，审判：一切都进行得顺畅无比，连行刑的日子都早已定好。\n\n不过高宗武还有最后一份奢望：他同临时接任的南京市委书记纪登奎达成了一份协议，他将在等待行刑的两个月里撰写一篇自述，这份自述将详细揭示伪民国所有汉奸高官和日本人的罪恶内幕，以协助共产党后续的逮捕及审判工作，而作为交换，共产党要保证他妻女的安全，确保他们还能隐姓埋名安全无虞地活在这片土地上。\n\n行刑日即将到来，毫无疑问是公开枪决，高宗武自然了无牵挂，但他终究还是会在余下这两个月中做起一些不切实际的梦——如果这场抗日战争的主角是自己又会如何？一大桩未竟之事藏在自己心头便要饮恨而终……他叹了口气。"
CPC_TRCW_NANJING_1.o: "也许下辈子我也会是个英雄。"
CPC_TRCW_NANJING_2.t: "洛杉矶之旅"
CPC_TRCW_NANJING_2.d: "总统高宗武正在办公室里收拾最后的私人物品，他拿起藏在层层文件最深处的一堆印着不同头像的印尼护照，哭笑不得。此时的他暗自庆幸：幸好共匪和美国交流不算太深，尚有美国可去，如果是留在东亚，日本人肯定不会放过他。\n\n很快他就带着他的家眷来到了早已等候多时的飞机旁，高宗武环顾四周，没有发现任何奇怪的动静，他悄悄随着人群上了飞机，在不安中和乘客们一起谈论今后的去处。是的，这并不是他的专机，这只是南京里千百架逃难飞机中的一架。飞机犹如一只压抑的猛兽，等待着恢复自由和威力的一刻。随着引擎轰鸣，飞机经过短暂滑翔后振翅高飞，迅速消失在早晨的迷雾中。\n\n在上海降落后，高宗武一行人立刻化身成普通的市民，谨慎地混入人群。他们脱下精心缝制的中山装，换上油腻的西服，头上戴着破旧的礼帽，就像那座城市里的其他人一样——原汁原味的上海白领。\n\n“娘额起来，阿屙卵，勿想走就滚！”身后传来叫嚷，他刚想回嘴，便立刻想起自己现在只是一个“上海白领”——于是他并未理会，只是往前走去。\n\n不知过了多少个日日夜夜，船只终于顺利抵达西海岸，高宗武拿出了准备已久的印尼护照，他们将以印尼华侨的身份开始新生活——说了无牵挂是假的，他终究还是会在自由火炬下做起一些不切实际的梦——如果这场抗日战争的主角是自己又会如何？一大桩未竟之事藏在自己心头便要郁郁而终……但他终究还是叹了口气。"
CPC_TRCW_NANJING_2.o: "也许下辈子我也会是个英雄。"
CPC_TRCW_TAIYUAN_1.t: "攻坚克难"
CPC_TRCW_TAIYUAN_1.d: "太原城前的堡垒层层叠叠，敌人躲在暗哨，对负责攻坚的解放军战士不断袭击。营政委雷锋走在战壕里，安抚着攻坚不成下来休整的士兵。战士们眼中流露出疲惫的神色——数次攻坚已经让他们伤亡过半，身心俱疲。雷锋用潜望镜对着战壕外观察，发现百米外的暗处有一个时不时喷发火舌的豁口。应该是个暗堡，雷锋想道。\n\n看着攻坚先锋们零零散散的遗体，雷锋心里万分焦急：同志们一个个倒下，身为政委怎么能袖手旁观？他将余下的营队聚拢，在地图上画出形势，说道：“两点钟方向有一个机枪暗堡，如果我们不把这个暗堡端掉，会有更多的同志牺牲前进的道路上。”，他让战斗员确认还有多少的火箭筒和迫击炮弹药，决定对碉堡声东击西，将其摧毁。\n\n“雷政委，只剩两发迫击炮弹和一发火箭弹！”清点弹药的三连连长向雷锋报告道。“只剩这一点了？”雷锋咬牙，“二连三连剩余的战士负责对碉堡火力压制，一连战士和我带着火箭弹抵近射击！”确定任务规划后，二连三连便分为两组，向着碉堡的射击孔进行压制，两发迫击炮先后落在碉堡周边，流弹和冲击波暂时干扰了敌人的射击，为一连创造了时机。\n\n雷锋和一连战士抵近到距离碉堡的40米处，可正当反坦克手瞄准碉堡准备射击时，飞来的机枪子弹将他的臂膀撕裂。反坦克手应声倒地，痛苦嚎叫，随之而来的更多子弹更是将战士们压得抬不起头。有的战士想要拿起火箭筒接力瞄准，但也被机关枪的扫射给阻止。二三连的战士仍在徒劳地压制着碉堡，但起不到丝毫作用。\n\n“小张，对着碉堡扔一发手榴弹！”雷锋忽然对一连的投弹冠军说道。小张卧倒在弹坑内，拔出保险销并果断地朝碉堡扔出手榴弹，手榴弹精准落在碉堡前，破片和冲击又一次干扰了机枪的射击。趁此时机，雷锋扛起火箭筒一跃而出，屏气凝神瞄准目标，多年艰苦训练的成果在此刻迸发而出。“咔哒！”扳机带动点火器，引燃了火箭弹的引信，火箭弹精准的射入射击口，并在碉堡内引爆。敌人的机枪哑了火，雷锋挥手对后方的战士说道："
CPC_TRCW_TAIYUAN_1.o: "暗堡已摧毁，我们继续前进！"
CPC_TRCW_TAIYUAN_2.t: "向我开炮"
CPC_TRCW_TAIYUAN_2.d: "太原城前的堡垒层层叠叠，敌人躲在暗哨，对负责攻坚的解放军战士不断袭击。营政委雷锋走在战壕里，安抚着攻坚不成下来休整的士兵。战士们眼中流露出疲惫的神色——数次攻坚已经让他们伤亡过半，身心俱疲。雷锋用潜望镜对着战壕外观察，发现百米外的暗处有一个时不时喷发火舌的豁口。应该是个暗堡，雷锋想道。\n\n看着攻坚先锋们零零散散的遗体，雷锋心里万分焦急：同志们一个个倒下，身为政委怎么能袖手旁观？他将余下的营队聚拢，在地图上画出形势，说道：“两点钟方向有一个机枪暗堡，如果我们不把这个暗堡端掉，会有更多的同志牺牲前进的道路上。”，他让战斗员确认还有多少的火箭筒和迫击炮弹药，决定对碉堡声东击西，将其摧毁。\n\n“雷政委，只剩两发迫击炮弹和一发火箭弹！”清点弹药的三连连长向雷锋报告道。“只剩这一点了？”雷锋咬牙，“二连三连剩余的战士负责对碉堡火力压制，一连战士和我带着火箭弹抵近射击！”确定任务规划后，二连三连便分为两组，向着碉堡的射击孔进行压制，但步枪终究是压制不过机枪，抵近的战士一个接着一个倒在血泊中，到达碉堡20米处的弹坑时，只剩下了七八人了。\n\n雷锋拿过燃烧弹，正要向前冲锋，几个战士拉住他：“政委你留下，你要接着领导部队打入太原！”，雷锋将战士们推开，说道：“我是党员，这种危险的任务应当我来，你们还没有资格冲锋！”战士们眼中噙着热泪——用燃烧弹抵近照明，自然无生还可能。雷锋继续说道：“未来还有很多城市等待解放，你们要好好活着，代替我解放太原、解放南京、解放全中国！”说着，雷锋拿起燃烧弹向碉堡冲去，子弹打断了他的腿，他便用手一点一点地爬到墙根。\n\n血液不断从伤口涌出，失血过多已经让雷锋精神恍惚，明明是黑夜，却感觉天空有彩云闪烁，死亡的黑暗逐渐吞噬着雷锋，但他还是用尽最后力气，点燃燃烧弹的引信，烈焰灼烧着他的棉衣，让他逐渐冰冷的身体感到异样的温暖。在浑身浴火的弥留之际，雷锋望着逐渐逼近的黑点——那是飞来支援的炮弹，高声呐喊："
CPC_TRCW_TAIYUAN_2.o: "“同志们，为了新中国，向我开炮！”"
CPC_TRCW_TAIYUAN_3.t: "囚与兵"
CPC_TRCW_TAIYUAN_3.d: "明月之下，佝偻的小小黑影在麦田中漫步。这个渺小的灵魂扒开一丛又一丛麦枝，一时竟错以为脚下随风起伏的褐色海洋永无止境，自己恰如溺失其中的水手。\n约五个小时前，张知音的部队遭到了夜袭。约三个半小时前，掩护大部队撤退的他发现自己和小队走散。紧接着，他发现自己的枪和水壶不见了，肩上只有一条断裂的皮条。直到现在为止，他一直在沿着原路找枪。\n\n张知音不是白痴，只是当他意识到自己原本来得及弃枪逃走时已经过去太久，赤手空拳逃走实在太冒险。但他能够找到武器的话，也许还有还击的余地(如果他的运气足够好)。\n“张！跑！黑狗追上了！”\n黑狗？\n张有些不解，战友们喊的不应该是“共狗”吗？是自己的记忆出现了差错？但为什么会错的这么自然？那粗犷的声音也异常清晰。\n\n“别他妈捡了！走！”\n没错，不是今天，但是五年前类似的夜色也曾出现在他眼前，那天他也像今天一样紧绷着神经横穿麦田，那天他也像今天一样是被追杀的，那天他也在冒险寻找着某些东西。\n不同的是，今天他是自由的、也是孤独的。\n\n为了能让儿子抬起头做人，他选择改头换面入伍，但是为什么如今他还是和当初那个越狱的囚犯一样在麦田中抱头鼠窜？为什么同样是军人，自己就得这么狼狈？这是否为天的罪罚，令他为逃避付出代价？又或是天的启示，预示他道的方向？\n\n那天他放弃了一袋银币，选择了自由。也许今天他也应该聆听天的劝诫，放弃那杆破枪，再次奔向远方的自由。\n\n当张再次抬起头的时候，他发现东方的地平线上赫然出现了一堵黑色的巨墻，在初阳的照耀下，漫步行军于金色大地之上。\n缠绕着两层绷带的枪支已经回到他手中，一个慷慨赴死光宗耀祖的热血男儿自然地出现在他脑中，但在他坚定决心令那高大的身躯化作现实之前，他的腿已经开始向着反方向狂奔，臭屁的老婆和不肖的孩子变得前所未有的可爱。"
CPC_TRCW_TAIYUAN_3.o: "“报告首长！敌人已完全撤出太原！”"
CPC_TRCW_JINZHOU_1.t: "百战铁流"
CPC_TRCW_JINZHOU_1.d: "日本正式向新中国宣战后，雷锋所在的装甲合成师连续攻克山海关和兴城，兵锋直抵锦州城下——这座自九一八事变起，日本便一直经营的堡垒城市。\n\n锦州城外，满洲国军和日本陆军早已坚守阵地，严阵以待。装甲车、坦克、各式反坦克武器你方唱罢我登场，不断击毁对方的战车。作为师参谋部中最年轻的参谋，雷锋正细细研究如何攻克锦州，他站起身来，指着地图上标注的各色防线，说道：“不能再拖下去，否则夜长梦多，要一鼓作气撕裂敌人的防线！先让炮兵清除敌方制高点和道路障碍，接着让坦克团和机械化步兵团正面强攻，突破敌防线薄弱处，进入市区后，擒贼擒王，直奔市政府大厦。同时让其他步兵团清剿街道和建筑内的敌方火力点，压缩敌军活动空间。联络友军部队在城外围三缺一，让敌人有侥幸心理，允许他们弃城逃跑，并在城外将他们全歼。全程要尽力保证市民和公共财产的安全，将一个完整的锦州交还人民！”\n\n清晨，守城的日军正紧张且疲惫地观察解放军动向。忽然间，炮火齐鸣，精确计算的炮弹砸中日军的各个防御阵地，紧接着，一辆、两辆、四辆，乃至越来越多涂有八一军徽的坦克从晨雾中杀出，机关枪的火舌撕裂了日军的身躯，随后的装甲运兵车载着大批步兵冲入城中。雷锋和参谋们蜷缩在临时构建的防空洞内，昏暗的灯光照亮着地图，各色铅笔在地图上画来画去。雷锋一只手托着耳麦，另一只手则在地图上盘查进攻的重点，炮弹如雨点般落到防空洞外，将洞内众人震得头昏。敌人发现参谋部位置了！雷锋心想。此时，前线也传来敌方炮兵阵地的位置，雷锋果断切换电台，呼叫己方炮兵轰击对方。\n\n随着一阵沉闷的爆炸声，防空洞外的震动也一同平息下来，参谋部的众人叹了一口气，但雷锋却等不及庆祝，继续拿着耳麦确认前线情况。“滴滴——”，耳麦传来一条讯息，“再说一遍，确认信息！”雷锋眼睛忽然睁大，并在地图的中心——锦州市政府画上一个红叉。他如释重负，向同志们宣布道："
CPC_TRCW_JINZHOU_1.o: "“同志们，锦州解放了！”"
CPC_TRCW_JINZHOU_2.t: "尽职尽责"
CPC_TRCW_JINZHOU_2.d: "日本正式向新中国宣战后，雷锋所在的装甲合成师连续攻克山海关和兴城，兵锋直抵锦州城下——这座自九一八事变起，日本便一直经营的堡垒城市。\n\n锦州城外，满洲国军和日本陆军早已坚守阵地，严阵以待。装甲车、坦克、各式反坦克武器你方唱罢我登场，不断击毁对方的战车。作为师参谋部中最年轻的参谋，雷锋正细细研究如何攻克锦州，他站起身来，指着地图上标注的各色防线，说道：“不能再拖下去，否则夜长梦多，要一鼓作气撕裂敌人的防线！先让炮兵清除敌方制高点和道路障碍，接着让坦克团和机械化步兵团正面强攻，突破敌防线薄弱处，进入市区后，擒贼擒王，直奔市政府大厦。同时让其他步兵团清剿街道和建筑内的敌方火力点，压缩敌军活动空间。联络友军部队在城外围三缺一，让敌人有侥幸心理，允许他们弃城逃跑，并在城外将他们全歼。全程要尽力保证市民和公共财产的安全，将一个完整的锦州交还人民！”\n\n清晨，守城的日军正紧张且疲惫地观察解放军动向。忽然间，炮火齐鸣，炮弹砸中日军的防御阵地，大量涂有八一军徽的坦克从晨雾中杀出，幸存日军击毁了几辆冲锋的坦克，但无济于事，机枪火舌撕裂了他们的身躯。随后的装甲运兵车碾过日军的尸体，载着大批步兵冲入城中。雷锋和参谋们蜷缩在临时构建的防空洞内，昏暗的灯光照亮着地图，各色铅笔在地图上画来画去。炮弹如雨点般落到防空洞外，将洞内众人震得头昏。雷锋切换电台频道，想要获知敌方火炮的位置，但频道内除了沙沙声外一无所有——通讯天线被炮弹炸断了。\n\n可恶！雷锋暗想，并找出备用的天线，不顾危险冲出防空洞，想要恢复通讯。雷锋弯着身子，将新天线重新布置，但又是一阵炮火，听着愈发接近的呼啸声，雷锋果断将天线插入土中，向防空洞大喊联系前线，并用身体死死抱住天线，防止它再次断裂。“雷锋！”同僚话音刚落，炮弹便掀起尘土，掩盖住雷锋的身影。战事当前，其他参谋也只得先和前线恢复联系。确认摧毁敌方炮兵阵地，部队持续向市中心挺进后，参谋们急忙到防空洞外寻找雷锋。只见雷锋紧紧抱住天线，身上满是弹片，早已没了气息。"
CPC_TRCW_JINZHOU_2.o: "他就矗立于此，犹如一座丰碑"

CPC_TRCW.328.t: "生僻词"
CPC_TRCW.328.d: "外面战火喧天的街道和冰冷的工厂是两个世界，就算没有工头的催促，工人们还是自觉地站到流水线前，整整齐齐开始一天的工作，秩序在肌肉记忆下自然运转。这也是老高正要做的，一如既往，作为一个齿轮加入这台精密的人肉机器当中：早晨，工作，枪声变得零散；中午，工作，街道变得寂静；下午，工作，军爷们的脚步声重新回到街上，虽然无论频率还是整齐度都与平常不同，但这些双眼无神的工人们没有注意到——或说也并不在乎这种区别。虽然工头已经失踪了一整天，但硬指标可不会跟着跑，工人们的注意力没有分散的余地。\n\n终于到了晚上，本来也该工作的，但老高的身体被人群在军人的簇拥下硬挤着推厂外，他不清楚这是要干什么，工头明天回来要是骂他们耽误生产可了不得——他只希望工头回来后能把耽误生产的事怪在军爷头上，或者军爷这边能快事快办，好让自己和同事回到岗位上加班加点赶上月底指标。\n\n军爷们让老高他们在大院里原地坐下，一个穿着朴素的军官站到人群面前，用他硬朗的腔调简短说了几句，就指示大家解散离开。\n\n老高懒得去听懂他那奇奇怪怪的南方口音，所以随着人群返回车间的时候，他完全搞不懂现在的状况——还得是问问一旁的老李。\n\n老李说，总结起来也就三句话——工头不回来了，军爷们会进厂帮忙干活，白天有休息时间了。\n\n老高听罢略感意外，开始有些后悔没仔细听那军爷的演说，不过这种情绪很快就在忙碌中淡忘了。\n\n要说军官的演说老高一个字没听进去，其实也不尽然。有一个发音通用的生僻词被他无心记住，这词前面还跟着一个陌生又熟悉的名字。虽然从未接触过这词，但是一旦想起那个名字为什么耳熟，他就立刻搞懂了后者的意思。可惜生产机器还在照常运行，他难得的独立思想也随着冰冷的流水线走入终点，在习惯的驱动下自然遁入了麻木。"
CPC_TRCW.328.o: "长春……解放……"
