CPC_TRCW_Revolt.1.t: "集会"
CPC_TRCW_Revolt.1.d: "张志新时常觉得，北平是一座活吃人的牢笼，身处中满的夹缝中——哪怕前赴后继出过许多仁人志士：远有李大钊、吉鸿昌，近有储安平、遇罗克，北平还是没能挣脱日本侵略者的钳制，只是哀嚎着，流血着，走向一个腐烂发臭的未来。\n\n市民公会被满洲骑兵师团勒令解散后，仍有一小部分未被逮捕的活动家们秘密建立了民主同志会，而这部分“幸运儿”里显然便有张志新。\n\n回想六十年代种种屈辱过往，她就会忍不住要跑到西直门或者什么地方去公开演讲一番，但总会遭到其他同志会成员的阻拦——毕竟，张志新没有钢铁之躯，而满洲国军的子弹可不长眼。\n\n如此折磨反复了五年，直到六九年年底，一些奇怪的风闻开始在市民中间流传开来：一开始，有人说共产党现在已经秘密渗透入北平准备赶走满洲驻军；接下来，又有传言说骑兵师团司令部已经从八里庄搬到了承德，北平街道上也很久不见飞扬跋扈的骑警了；再接下来，又有人说失踪的遇罗克其实没死，他入了共产党——消息越越传越玄乎，北平的民心也越来越骚动。\n\n作为民主同志会事实上的领袖，年轻的张志新却掌握着许多一般市民不知道的秘密：共产党在北平确实有个叫“城工部”的秘密准军事组织，他们会不定期联系民主同志会送来物资和马列毛革命著作；骑兵师团司令部也确实撤到了承德——那是因为满洲在收缩防务，要集中精力对付外满的抗联和苏联红军残部；而遇罗克——遇罗克确实已经遭难了，同储安平被公开处决不同，他被秘密枪决于永定河畔，随后被日本人装袋投河，若不是几个侥幸逃过逮捕的前辈不顾一切守在卢沟桥，只怕遇罗克的下落将成为永远的悬案。\n\n时值1970年开年，张志新又一次站在了卢沟桥头。"
CPC_TRCW_Revolt.1.o: "这一次，我们必须要夺回自由。"
CPC_TRCW_Revolt.11.t: "古城新生"
CPC_TRCW_Revolt.11.d: "灰云密布，阴雨连绵。\n来自城外响彻许久的轰鸣炮火，固然已经为这被日寇侵略者所再三粉饰的昔日中国首都震散了许多虚伪的腐朽伪装，生活在这座古老城池之中的当地居民终于能够不再受密不透风的日夜监视与打压了——\n——但现实仍然惨淡，诸多百年民房被炮火摧毁，大量百姓流离失所只能在大街上过夜，街上甚至出现了成群要饭的叫花子，这些是新进城不久的共产党干部们急需解决的头号问题。\n\n而在正阳门下布告栏愁容满面的张志新同样也有自己的担忧，她立刻闯进了北平临时治安管理委员会的四合院里，找到了刚到此地不久正焦头烂额于北平重建的刘建勋。\n“需要军队维持治安保卫北平不被满洲侵略这点我们可以理解，但我们不赞成你们以维护北平稳定的名义管控新闻自由和商业自由，这套说辞我们可太熟了，当初满洲侵略者军管北平的时候也是这么说的。”\n“请学一学美国，学一学我们地球上自由民主的灯塔之国，他们就不会限制人民的呼声，也不会学日本帝国主义用冠冕堂皇的借口来监视和控制他们的人民——我们相信共产党不是那种听不进公民意见的人。”\n\n被一串连珠炮式质疑搞得晕头转向的刘建勋只能无助地摆动双手试图安抚她：“现在的首要任务是安稳秩序恢复生产，您说的这些我们……”\n“……你们要如何？不要打哈哈，不要搁置我们的诉求，北平人忍了四十年了，我们忍不了这样含糊不清、不诉诸公议就贸然实施的所谓战时管制。”张志新不依不饶。\n被逼问得如此狼狈的刘建勋心头火起：你是忍我忍了四十年？脾气发我身上干嘛？你又能代表全北平了？我忙着搭粥棚的时候你没看见？现在又什么都是美国好了？\n\n最后两人没有吵架，刘建勋压下怒火给予了一个含糊的答复，只说“我们在颁布政令时会广泛征求市民意见。”\n被请出门的张志新同样怒气未消——原来共产党终究不过只是大河之上奔来的又一个内向文明的产物，尽管它可能还喊着民主解放的口号，但一股熟悉的戒备心理再次追上了张志新的内心。"
CPC_TRCW_Revolt.11.o: "同床异梦。"
CPC_TRCW_Revolt.12.t: "天日昭昭"
CPC_TRCW_Revolt.12.d: "这是七十年代的初开之日，清华、北大、辅仁等学校的年轻学生以及相当大一部分北平市民跟随着半个月前散布的秘密传单的指引来到了卢沟桥，只看见一个年近四十的妇人站在桥边的临时讲台上，手拿着白色大喇叭。\n\n“市民朋友们，民主同志们！这是一九七零年的第一日清晨，我站在这里要为我们北平征得不受压迫不受荼毒的未来！”\n\n“各位应该会记得，七年前我们北平为了民主自由的抗争作出了巨大的牺牲——被无辜逮捕的北平市民超过了三千人，而被随意处决者竟占其中的三分之一，这里面包括我们市民公会的老前辈储安平先生，也包括，迄今为止杳无音信的遇罗克先生！”\n\n“没错！被民国警队、满洲国军一并发布布告‘通缉’了七年的遇罗克，他就是死在这里，就死在这条永定河！”\n\n会场一片哗然。\n\n“就是在卢沟桥旁，我们民主同志会的几位前辈冒着违反宵禁被捕的巨大危险，在这里将遇罗克烈士的遗体打捞上岸，就地安葬的。”张志新的声音渐转哀伤，“遇罗克烈士的死状十分惨烈，我不忍再做描述——但他的死真切地给我们所有人都上了一课。”\n\n张志新深吸一口气：“侵略者用他们的子弹制造鲜血，却用我们的鲜血浇灌他们的野心！”\n\n会场爆发出一阵又一阵呼号，但张志新仍然顶着呼号用更大功率的喇叭高声疾呼：“市民朋友们，日本人用四十日元的时薪将我们锁在镣铐中已有四十年了！日本走狗满洲国军的司令部已经撤退到热河，我们难道还有任何理由继续服从他们所谓的军管吗？”\n\n眼见会场已经热血躁动，张志新高举右拳：“打倒日本帝国主义！赶走满洲侵略者！还我自由北平！”"
CPC_TRCW_Revolt.12.o: "“还我自由北平！”"
CPC_TRCW_Revolt.2.t: "D小调第九交响曲，Op. 125"
CPC_TRCW_Revolt.2.d: "陆洪恩走进汉口中华全国总工会旧址的时候，感觉自己好像回到了三十多年前的上海。那时候的自己虽然不能说是意气风发，但是至少比现在这副蓬头垢面的样子好上太多了。那时的自己一多半的时间在各个场所弹奏着钢琴，勉勉强强混的一口饭吃；写过剧本，写过乐评，也曾排过几个戏剧，担当过指挥的职位。虽然他已经很久很久没有拿起纤细又重达千钧的指挥棒了，但是陆洪恩觉得，今天的自己又一次拿起了指挥棒。只不过，这次排演的曲目并不由音符组成。\n\n第一乐章是不太快的略呈庄严的快板，严峻有力。同志们默默拾起从西北来的武器，在出发前做着最后的整修。气氛并不是很欢快。在这些年的地下斗争中，有许许多多的身影毫无意义地、像一条狗一样地消失了。在静默中，同志们的整修逐渐接近尾声。细碎的磕碰、小声的交谈，悲凉与紧张的搏斗，在斗争中逐渐趋向光明。\n\n第二乐章是极活泼的快板。由于西北共产党威胁，南京伪政府的兵力早已抽调大半前去防御。在武汉市政府的守卫更是寥寥无几。同志们静悄悄地接近守卫，随着指挥员的号令一同涌入。冲锋与呐喊共同交织出了定音鼓与弦乐柔和的谐谑曲。跳跃的枪声，明朗的高呼，似乎让人们在阴云密布的战场上见到了东方的鱼肚白。\n\n第三乐章便是如歌的柔板。短暂战斗后，胜利的一方便要擦去自己身上的灰尘，清洗裂开的伤口。陆洪恩一刻也不停地在伤员周围巡视着。他兀得质疑起自己来。也许这是一次错误的革命？也许自己的决定浪费了更多的生命？也许，时机尚未成熟，队伍仍然需要沉淀蛰伏？但是形势永远不可能给他细细思考的时间，在浪漫主义的深思下，第四乐章马上要到来了。\n\n第四乐章就是整部作品的精髓，急板。在同志们共同的努力下，伪政府的抵抗逐渐被平息。天空也在逐渐停歇的枪声中匆忙又缓慢地撕下自己黑暗的面纱，露出光亮的皮肤。陆洪恩在话筒前激动又庄严地宣告着人民正义联盟的胜利，武汉的解放，以及对自由的许诺。"
CPC_TRCW_Revolt.2.o: "这是人民的合唱。"
CPC_TRCW_Revolt.21.t: "滚滚长江东逝水"
CPC_TRCW_Revolt.21.d: "正是武汉的清晨。红白的太阳穿过长江上层层的雾霭，将绵延不绝的层积云下的天空染成赤红。长江静静地流过，中华民族的母亲河永不停歇。陆洪恩与千千万万的武汉市民们彻夜未眠，屏息凝神，听着城外越来越近的炮声。隆隆的炮声让陆洪恩兀得想起还在上海时在乐团中听到的定音鼓。在震天撼地的战鼓声中，武汉要么再次卑躬屈膝，要么骄傲地赢得站立的资格，抖去身上的灰尘，显露出中华革命第一城的底色来。\n\n到了上午，炮声就渐渐停息了下来。中午的时候，解放军就进了城。一排排灰绿色的人，脸上还蒙着灰尘与血迹，沉默又好奇地打量着这座九州通衢。真到自己和其他同志们的努力开花结果的时候，走在江边的陆洪恩却有些恍惚。他想起了家人信仰的天主，也许真有这样全知全能而又慈悲的主来拯救中国了？\n\n“是人民正义联盟的陆洪恩同志吗？”一声问候打断了陆洪恩的思绪。打招呼的是一名解放军军官。满脸蒙灰的他整了整因连日战火而凌乱的军帽，拍拍身上的军服，笔直向陆洪恩敬了一个礼。“党中央非常感谢你在武汉的工作，正因为有你和人民正义联盟的诸位同志，解放军才能以最小的损失接收武汉。有了武汉人民的支援，我们一定能更快地解放全中国！“\n\n“解放中国……固然很好，你们打算如何处理武汉目前的局势？我们武汉市民已经抵抗许久，虽说高伪政府压榨出的民脂民膏已归人民所有，但是你自己也看到了吧。”说着，陆洪恩望向城市，“还有许多人流离失所，还有许多的人无法吃饱穿暖，还有许多的人需要乞讨才能生活……你们打算怎么办？”\n\n解放军军官望向陆洪恩的手。那是一双钢琴家的手，纤细，修长，却在战火中磨出了茧子来。“共产党的宗旨始终是为人民服务。我们会尽一切努力保证武汉人民的正常生活。但是还有一件要紧的事，不知汉阳兵工厂的生产状况如何？如果停工了，能否快速复工以支援前线？”\n\n陆洪恩哽住了。他敏锐地捕捉到了一丝不和谐音，从而没有继续抛出有关工人民主、民主选举、自由言论和自由艺术表达的问题来。他怀念起三十多年前在洋人的冒险家乐园表演时的生活。那时的自己没有如今的顾虑与重担，只有音乐和下一顿饭的着落困扰着自己。也许等到中国解放了，自己就能回到上海，重新弹起钢琴吧。"
CPC_TRCW_Revolt.21.o: "……都付笑谈中"
CPC_TRCW_Revolt.3.t: "琼崖纵队密报"
CPC_TRCW_Revolt.3.d: "党中央、军委：\n\n我纵队自1968年以来根据华南局方面指示积极向湛江、雷州等地进行渗透和接触，经过长期观察，我们与雷州当地的工人地下互助团体“反迫害斗争委员会”取得了联系，其社团领导人为苏守忠。\n\n苏守忠，又名苏祐世，1941年生于广州，先后信奉天主教及佛教，于1959年进入富士通香港工厂，因1963年李纯如自杀事件在香港中环参与游行和绝食抗议活动而被富士通解雇，辗转来到雷州，在长期受日帝企业压迫后思想逐渐转变为革命派，秘密组建了反斗委地下团体。\n\n因近日北平、武汉等地生变，苏守忠为“响应义举”而自行组织了抗议游行，我纵队自主决策决定协助其扩大起义范围，目前反斗委已经控制了湛江市政府大楼，并宣布雷州半岛自治。\n\n现在起义进入相持阶段，请求中央协调东南亚盟国给予物质援助和思想指导。\n\n琼崖纵队第一书记 冯白驹"
CPC_TRCW_Revolt.3.o: "同意行动。"
CPC_TRCW_Revolt.31.t: "天高海阔"
CPC_TRCW_Revolt.31.d: "阳光洒在海面上，波光粼粼，仿佛溅起了千颗银星。远处，蔚蓝的海水与天空融为一体，让人分不清哪里是海，哪里是天。海鸥在空中自由翱翔，礁石正经受着浪的拍打、风的吹拂。\n\n自南海而来的风也正吹拂在他满是灰尘的脸上，它带着咸味，含着苦涩，吹开了他紧皱着的眉头，也唤起了这个久居内陆的人心底复杂的情感。\n\n“首长，”见他没有反应，苏守忠不得不提高了音调，“首长！”\n\n“诶，”他仿佛从梦境中惊醒，“苏守忠同志，幸会幸会。多亏了你们，我们才得以兵不血刃地光复湛江，党和人民会铭记你们的功绩……”\n\n“我们已经悉数收缴了敌军未能撤走的枪械，同时筹好了粮食，准备为一路出生入死的战士们接风洗尘，军工厂近期也将尽快复工，还请您作出下一步指示。”\n\n“不必如此大费周章，就近日我的观察来看，本地居民流离失所、食不果腹者甚多。解放军是人民的军队，我们怎能坐享人民的口粮？当务之急，是先……”\n\n“首长，您知道吗？打我记事起，这里就被日本人侵占着，多少小伙子挨了枪子！多少大姑娘被糟蹋了！等我稍大点，经常看到伪警察踢人屁股、踏他们的脚趾，极尽侮辱之能事，气氛简直令人窒息，竟有一种此地非吾土、非吾民的感觉。后来夏将军起事，我本想追随其一道为中华民族背水一战，谁承想我一堂堂正正的中国男儿，竟屈服于倭寇的钢枪，被逼进工厂，造起对付中国人的东西了！所幸咱们部队来了，解放军才是湛江真正的解放者，作为一个中国人，我又岂能看曾经的悲剧重演？只要能解放中国，复兴我中华民族，我们的这点小损失，又算得了什么！”\n\n他看着海，想着苏守忠的话语，那些侵略者从海上来，又从海上去，无论如何，今后此地——"
CPC_TRCW_Revolt.31.o: "——气象一新！"
CPC_TRCW_Revolt.4.t: "东部起义浪潮爆发！"
CPC_TRCW_Revolt.4.d: "敌占区北平、武汉、雷州等地相继爆发大规模民主抗暴斗争，大有燎原之势，我们之前在这些地区恢复的地下党组织目前已经投入运转，这是我们渗透和动摇敌后，壮大敌后民主爱国力量的绝佳机会！\n\n中央已经批准对东部民主爱国势力的援助计划，并提出了邀请东部民主代表来到西安参与召开全国政治协商民主会议的愿景，罗青长同志已经动员情报部门全力投入工作。我们必须把握住这次千载难逢的机会！"
CPC_TRCW_Revolt.4.o: "时刻准备着。"

CPC_rural_dem.1.t: "润物细无声"
CPC_rural_dem.1.d: "季节未见交替，人们身上的衣物也不见增减，但改变还是在悄悄地发生。前书记罗雨来因为交代不清他的历史错误而被免职了，现在充其量只是一个普通队员，每日垂头丧气地跟着乐呵呵的梁家宝下地干活。至于他空出来的职务，五个生产队连吵三天，最终把最贫困的一个大队干部梁贵生选了上去。除了罗雨来，每个人都享受着这份奇妙的愉悦心情——就好像直到此时此刻，他们才真正感受到自己是国家的主人似的！\n\n虽然当了书记，梁贵生的生活和以往并没什么太大变化；大队里的重要事务都要经过队员的评议，除了组织生活外，他能实际管到的已经很少了。这天下午，梁贵生牵着队里的几头耕牛到溪边割草，才割了半晌，远远就听到吵闹的声音。只见罗雨来媳妇和李寡妇相互撕扯着头发，哭骂着踉踉跄跄地向他走来。\n\n“梁书记！我家雨来又偷偷摸摸往这小婊子家里钻了，你怎也开个评议会，让雨来和这狐狸讲个清楚呀！”\n\n雨来媳妇边哭边骂，李寡妇披头散发地只是哭，半边脸都被扇得红肿了，罗雨来则一脸尴尬地跟在后面。梁贵生看着三个人滑稽的样子忍不住要笑：本来是打算让罗雨来“将功赎过”，代表大队去慰问生活困难的家庭，结果又变成了搞破鞋的新证据，真是好心办坏事……民主评议会也不是用来处理感情纠纷的！然而，就这样把他们挡回去，似乎也不好。\n\n“你说李同志偷汉子，你可有什么证据？没有证据，大家不好给你做主。”\n\n“我要什么证据！我亲眼见雨来钻进这贱人屋里！”\n\n“对同志戾气不要这样大嘛！下周的评议会上，你们各自把证据备好，用一刻钟时间把这事儿在大家面前说清楚，成不成？这一回说开了，以后再不许为这事相骂相打！”"
CPC_rural_dem.1.o: "路漫漫其修远兮……\n……吾将上下而求索。"
CPC_rural_dem.2.t: "一地鸡毛"
CPC_rural_dem.2.d: "“狗娘养的凭什么选他？去年交公粮过秤时我分明看到他做了手脚，让自己少交，这分明就是犯了籽，籽……”\n“资本主义错误！”\n“对！资本主义错误！这就是埋伏在我们大队里预备走资本主义道路的狗崽子！”\n“你放屁！你说你看到了，还有哪个看到了？哪个？！”\n\n评议会不出意料地又吵作一团。在声嘶力竭的人群中，只有罗雨来一声不吭地坐着。他乐得看这出闹剧呢，为什么要说话？罢免他一个罗雨来，现在选不出新的书记，督导组还想让他出来收拾烂摊子，你们全他妈活该，该！想到这一层，他狠狠地啐了一口，感觉痛快极了。\n\n“我也看到了！”“我！”\n\n成为众矢之的的那个庄稼汉脸色一霎变得铁青，转而又变得通红。“你们他妈的一个二个全都昧着良心说话，我，我……”气得说不出话，愤怒的情绪也不容许他思考下去，索性换一种表达方式吧！\n\n“拿来！”\n\n罗雨来还没弄清发生了什么就摔了个屁股墩，他的小凳子被抽走了！为了选出这个书记已经连吵了一个星期，任谁也忍耐不下去了，气急败坏的队员们嘴上继续谩骂，用凳子或拳头毫不留情地相互打砸。不知是哪个不长眼的把自家娃娃也带来开会，这会儿更是放开声嚎哭起来。罗雨来摸索了一阵才从这可怕的暴力中逃出，扭头一看，督导组的几个干部也伏在地上，正面面相觑。"
CPC_rural_dem.2.o: "这下可好，全他妈完了。"
CPC_rural_dem.3.t: "他们的沉默，震耳欲聋"
CPC_rural_dem.3.d: "“……总而言之，大家有什么想说的，都畅所欲言吧！”\n\n沉默。话音落下许久，评议会的会场里只有一片死寂的沉默，连平日发言最积极的梁家宝也抿着嘴一语不发。\n\n“怎，怎么了，是我们大队的民主建设已经好到解决了所有问题了吗？哈哈！”\n\n不能让这沉默再持续下去，督导组的一个干部勉强又说了两句，但一点也没把气氛炒热，那两声干笑瘪得像是暴晒后的西葫芦，任谁听了都不痛快。于是，尴尬的空气反而更厚重了，堵着队员们的嘴，让他们不敢开口。\n\n梁家宝左看右看，除了他就没有一个人抬着头，但嘴唇都在蠕动着，好像想要说些什么。是呀，他们怎不想说呢？督导组刚来时，叫他们“广开言路”，畅所欲言，人人都愿意吐一吐自己的怨气。可不管他们说了什么，总是“不完善”，“太过激”。要知道，这些怨气里头，很大一部分都是冲着罗雨来去的。督导组归根到底不是村里的人，督导组一走，谁知道罗雨来会不会捏着这些话头，落井下石？甚至，往远了说，督导组一走，他们的这个评议会，还能开得起来吗？\n\n时间在尴尬与缄默中度过，队员们也跟着一齐受煎熬，终于不得不宣布散会。当梁家宝拖着脚步走出大门时，听到两个曾经站出来痛骂罗雨来的庄稼汉正蹲在一起窃窃私语。\n\n“我说呀，明天要不背一袋高粱去给罗书记赔个罪吧，他怎样也是个官咧。”\n\n“就怕人家嫌弃，不要咧。”"
CPC_rural_dem.3.o: "唉……"

CPC_rural_dem.4.t: "新老书记"
CPC_rural_dem.4.d: "几个星期过去了。晌午时分，罗雨来如往常一样在田里吃完了窝头配凉水，抄着手沿着田埂慢慢地踱步。他的胶鞋踩在土上，发出沙沙的响声，三三两两坐在陇上的队员只是茫然地抬头目送他走过，一句话也不说。\n\n罗雨来已不是大队书记。他仍姑且算是个干部，但再不能得到如以往的那般尊敬。从前，罗雨来说了算；现在，督导组和新的领导班子说了算。谁说了算，谁就得到与权力相符合的尊敬，对于人们而言，这似乎是颠扑不破的道理。\n\n“雨来同志，你最近可好？”\n\n迎面走来的罗贵娃向罗雨来打着招呼。这个老实木讷的中年干部因为从来不提反对意见，稀里糊涂地变成了新的大队书记。看起来他似乎本急着赶路，但还是停下来向老书记问好。\n\n“都如意。你的工作如何了？”\n\n“没啥别的，就是会议多。三天一小开，五天一大开，开完之后还要向同志们传达精神，不容易咧！”\n\n“督导组怎不自己去传达？老派你做力气活！”\n\n“说是开会，其实我也就坐在一边听着……”罗贵娃擦了擦脸上的汗，“县里又新下来几个干部，昨天开会时的那个神气劲，和你以前真怪像，但讲得真有道理！把大队一年的事儿都安排明了，我这一阵子多跑跑，后头就得闲啦。”\n\n罗雨来心里不知为什么，很不是滋味儿。他挥了挥手，让这个旁听书记去忙自己的事情。\n\n“你先回吧。东头的田里有一畦麦生了杂草，也不知道草种是哪里吹来的……腰也不中用，估计拔不完了。你替我和督导组说一声，下午我要带着组员除草，那个民主会，我请假。”"
CPC_rural_dem.4.o: "多做实事，少作议论。党来决策，群众执行。"
CPC_rural_dem.5.t: "双头鸟"
CPC_rural_dem.5.d: "不知怎地，罗雨来最近总觉得不畅快。督导组没撤他的职，没削他的权，像是落地生根了一样始终呆在村里，让他搞不清究竟还有什么事在等着他。有时候，事无巨细他都要向督导组汇报；也有时候，督导组又把一些奇怪的工作推给他处理，让他去发扬“民主”。就连队员们也犯迷糊：有事儿了，到底是敲大队书记室的门呢，还是督导组的门呢？罗雨来想不通，睡不好，他又要去找张会计聊聊了。\n\n张会计，没解放前是村里的半仙，解放后把他打了一顿，看在他会写字算数的份儿上，叫他当会计来为人民服务。张会计被打了也不老实，偷偷地开展他算命的老本行，有些迷信的队员仍然找他卜问吉凶。罗雨来刚进他家的大门，张会计就神神秘秘地凑上来。\n\n“罗书记，你的心病我搞明白啦，答案就在这天书里。”\n\n他扬了扬手里的书。罗雨来定睛一看，这哪里是什么天书，分明是高等中学的历史课本，正翻在了介绍俄罗斯帝国的一页。\n\n“你看。”张会计手指着油印出来的双头鹰标志，“这个，是你罗书记；这个，是他们。”\n\n他顺手往远处督导组的办公室指了指。其实他不打手势，罗雨来也知道“他们”是什么意思，这已经是大队里人尽皆知的暗语了，但是——\n\n“我没懂，你今天怎么疯疯癫癫的？”\n\n“俄国鬼子瞎画的东西不重要。我就是想告诉你，一只鸟不应该有两个头。你的心病，就在这里。”"
CPC_rural_dem.5.o: "你他妈的在胡说些什……"
CPC_rural_dem.6.t: "爆发"
CPC_rural_dem.6.d: "“书记同志，我来……我来开介绍信。”\n\n罗雨来正阖目休息，一个紧张而不和谐的声音却突然扰了他的安宁。门口“书记室”的牌子一早就被移走了，还是总有些人不长眼睛，门也不敲就往里钻。他连眼睛都懒得睁开：\n“这介绍信不归我开。”\n\n“哎呦，书记同志……我家外甥女要结婚了，我要是不去，岂不是……”\n\n见罗雨来还是默不作声，这个一心琢磨着吃喜酒的庄稼汉就继续磕磕巴巴地解释着给他开介绍信的必要性。他完全没注意到罗雨来的面皮正越绷越紧，像是暴雨前轰鸣的云层，怒气马上就要爆发出来了。\n\n“我说了这事儿不归我管！我不是书记了，再也不是了，你懂不懂？！”\n\n突然的吼叫声足以吓人一大跳，但罗雨来还不满足。他重重捶打着桌面，发疯般拽着抽屉。一、二、三、四，所有的抽屉都被他拽出来掼在地上，每一只都是空空如也。\n\n“文书也收走了，公章也收走了，连自来水笔也没给我留下，你要我怎么给你开介绍信？我用什么写字？我用什么盖章？”\n\n罗雨来每吼一声就捶打一下桌子，喊到最后，他几乎要哭了出来：\n\n“把什么都收走了，又不许我做回农民，我犯什么错了？我对党，对毛主席犯下什么罪过了？”\n\n庄稼汉被吓得走也走不动，他从没想过那个神气活现的罗书记现在居然像个小孩子一样，一把鼻涕一把泪地哭闹。"
CPC_rural_dem.6.o: "……那，那我先出去了。"

CPC_rural_dem.101.t: "作风会"
CPC_rural_dem.101.d: "都说民主民主，大队书记罗雨来现在是结结实实领会到什么叫人民当家做主了。他窘迫地站在大队队员中间，手也不知道该往哪里放。穿着便装的中央干部就站在队员们中间，他无视了罗雨来求助的眼神，示意会议可以开始了。\n\n“你说！去年遭旱，旁人的麦子枯了一大片，你自己的生产组，田里麦子都是又绿又壮！你有没有私心偏袒，你说！”\n\n一个素来和他不睦的队员抢先跳起来，指着罗雨来的鼻子就开骂了。\n\n“我……去年明明是抽签决定的嘛，怎能怪我哩？”\n\n罗雨来张着嘴，半天才说出这一小句话。他很没底气，因为抽签是他提出的，谁知道狗娘养的自己运气这么好……今天他可完啦！\n\n“你还有脸说！本来大家议出来是均分，你说平均主义要不得，这才抽签的！”\n\n“他这人最无道德。”一个中年女人的声音响起来，“也不在灌溉这一件事上。他事事无道德，和李家寡妇搞破鞋……”\n\n“你放屁！”这是李家寡妇的声音。\n\n“我怎是放屁？罗雨来偷偷摸摸进你家里，我亲眼看到！”\n\n“你连你自家汉子都管不住，还管我！他三天两头往村东头罗秀梅家里钻，你怎不管了？”\n\n“我掐死你个小泼妇！”\n\n本来是批灌溉问题与罗雨来作风的民主会，不知怎地变成了村里破鞋故事的大揭露会。这下不光是罗雨来，连中央干部的头上也不住渗出了汗，要再不叫停，会场里就真的要撕打起来了。"
CPC_rural_dem.101.o1: "不管怎么说，揭露了问题，就是有意义的。"
CPC_rural_dem.101.o2: "好好的会开成这样，实在是……"
CPC_rural_dem.102.t: "生产队新面貌"
CPC_rural_dem.102.d: "收工的号子才吹完了三遍，有几个生产队已拾掇好农具往村里赶了。五队队长梁家宝扛着锄把儿走在最前头，头上裹着灰色的毛巾——他就只有这一条毛巾，昨天向罗雨来讨了一块洋胰子，还是没能洗干净。不白就不白，梁家宝不在意这点次要矛盾，这个消瘦的汉子骄傲地挺起肋骨条条分明的胸脯，大踏步地向前走。今天是他们五队扬眉吐气的日子，他的腰板儿终于能挺直啦！\n\n原先，村里头只有四个生产队，四个队长都向书记抱怨人多不好管，这才各自拨出几人，另组了个五队。不消说，拨来的都是老弱，分的地无不贫瘠，还散在各个地方，梁家宝连人都点不齐。到年底一算工分，总是五队垫底，他早忘了自己为此写了多少检讨，队员们作了多少保证。而今可不同，上面来的干部一到村里，就鼓励他们自己起来闹。梁家宝大着胆子，带着五队全体队员把这问题闹了上去，果然替他们做了主：今天收工后就把五个生产队打散重组，责任田也重画，大家一律公平，看谁还能压他们五队一头！\n\n梁家宝美得好像三伏天里喝了冰水，哼着信天游从陇上走过去了。田里还在收拾东西的人看着他得意地走过，忍不住交头接耳议论纷纷。\n\n“你看把他给能的！”\n\n“小人得志……”\n\n“他会闹，偏我不会闹？下次我也去闹他，看他怎么办！”"
CPC_rural_dem.102.o1: "这种事儿总是要有理有据有节嘛……"
CPC_rural_dem.102.o2: "贫下中农就得是天不怕地不怕！"
CPC_rural_dem.103.t: "布告栏下二三事"
CPC_rural_dem.103.d: "大队书记要改选啦！震撼人心的消息一顿饭的功夫就从村头传到了村尾，所有人都在细细咀嚼其中的含义。他们以前不是没有见过罗雨来受罚，做检讨也是常有的，但从来没说要把他撤掉。如今……如今可真是大不同了！\n\n世界虽大，风云变幻却与小村中的人们无关，只有这些真正与生活联系的事才能在他们的心湖里荡起涟漪。田间歇息时的议论一天天多起来，生产队队员们已摆脱了最初的眩晕感，他们口中讨论得更多的是怎么让罗雨来老老实实地下台，以及罗雨来下台之后，又要让谁来当这个书记。\n\n“依我看，咱要不推出个人来选这个书记，罗雨来还要继续赖着哩！”\n“谁不知道这道理？现在就等谁来放这第一炮呀！”\n\n隔天，村口的板报栏上就贴出来一张竞选声明。字是请大队张会计写的，里头先“揭露”了罗雨来历年的工作失误，接着又条陈了一些简单的就职承诺。在声明的最后用自来水笔歪歪扭扭地签着竞选人的大名：“梁家宝”。\n\n傍晚吹号收工的时候，人们把张会计找来，请他再把这竞选声明念一遍。他念几句，人群就议论一阵子，连晚饭都几乎忘了吃。\n“这次又让他出风头了。”\n“我歪好也是个党员，他敢选我怎不敢选？我明天就写个东西出来参选！”\n\n没过几天，板报栏上的声明越贴越多，梁家宝的那几张纸要掀开别的声明才能找得到了。抄得晕头转向的张会计终于把自己的自来水笔藏了起来，别人要问起，他就摇着手露出一副苦笑的模样：“都说要民主，我也有权发言，让我的手腕子先歇个两天吧！”"
CPC_rural_dem.103.o1: "好！要选，要大选特选！"
CPC_rural_dem.103.o2: "兹事体大，还是先请示一下……"

CPC_rural_dem.201.t: "检讨"
CPC_rural_dem.201.d: "大队书记罗雨来的眼前黑一阵白一阵，他的“罪状”就摊在面前的桌上，铅印的汉字个个变得斗大，喊叫着向他打杀过来。虽然罗雨来自己都搞不清这些罪状几分是真几分是假，但面对白纸黑字，他能做的也只有忏悔、检讨，再忏悔、再检讨。\n\n“1958年，你明知道全村只有满工分劳力23人，仍然向县里申请提高摊派主粮生产指标。”督导队的干部平静地“帮助”罗雨来回忆他的工作过失，“生产队队长和几个队员提醒你完不成指标，你没有听从，结果倒欠玉蜀黍三千零六市斤。”\n\n“同年，你又要求大队拦溪蓄水，下游两个生产队无水灌溉，只能再把土坝掘开。在下游找来之前，你没有和大队里任何人商议过拦溪的可行性。”\n\n怎能怪我哩？罗雨来一万个想不明白。嘴上做着检讨，潜意识里他从没觉得自己是个蛮横专断的书记。从懂事起他就跟着党闹革命，党说啥他做啥，大家一致拥护。天天坐在一起“讨论”，那还怎么“跃进”？\n\n想说的话到了嘴边，到底咽了回去。\n\n“是，我承认我的工作有很大的过错。我会再作一份检讨交来的。”\n\n天已快黑，人们看见罗雨来萎靡不振地走出了督导组的屋子。高大的书记佝偻着腰，捏着一卷子罪状，摇摇晃晃地朝家走去。"
CPC_rural_dem.201.o1: "光有干劲没用，这问题他必须想明白。" 
CPC_rural_dem.201.o2: "到此为止吧——群众的气泄下去，我们也倒霉。"
CPC_rural_dem.202.t: "丧权书记"
CPC_rural_dem.202.d: "大队书记罗雨来郁闷地在外屋踱来踱去。木门的隔音效果太差，他把里屋的谈话声听得一清二楚——妈的！叫他写那么多检讨，现在还要关起门来开会，就连今年村里要杀几头牲口过年，他们也要啰嗦半天！\n\n按理说，他和其他的大队干部一样，本也有与会的权利，但督导组批评他检讨问题不深刻，于是就只有他暂时不能参加了。罗雨来听不懂、也不想听的话语一股脑地往他耳朵里钻，什么春灌秋灌，什么保墒……主席说要发扬民主，这是哪儿门子的民主？尽用大话压人，这是派了一群管事儿的县太爷给他了！\n\n罗雨来自己正生着闷气，里屋的门突然响了一声，会议已经结束了。督导组干部们鱼贯而出，几个还有旁听资格的大队干部也跟在后面，从里屋走了出来。\n\n“这是下个月的灌溉计划。”\n\n打头的人递给罗雨来一摞纸。他劈手夺过来，同时狠狠钉了对面一眼。\n\n“雨来同志，你的对抗情绪很有问题……咱们村去年的灌溉就是混乱的，七嘴八舌议到最后谁也不得罪，把水白白浪费了，粮食也没有多打。咱如果还想进步，这一点非得改善不可。”"
CPC_rural_dem.202.o1: "……按讨论出来的结果办。"
CPC_rural_dem.202.o2: "狗屁进步，你多打一千斤粮食又如何？"
CPC_rural_dem.203.t: "少说多做"
CPC_rural_dem.203.d: "大清早，督导组就指挥着几个人提着浆糊，在村口的告示栏上贴起一张大纸，上头用恭楷写着几个大字：干部工作时不许拉谈家常。对于大队的干部们而言，这可不是件小事：他们虽然也朦朦胧胧地感觉到自己是个“官”，但还保留着一点农民的稚气，摆不起官架子，常常是在嬉笑闲聊中把工作办妥了。如今突然禁止，想必他们还要花很长时间来适应这样的新情况……\n\n约莫下午光景，五队队长梁家宝走进了大队书记室，他是来向副书记罗贵娃报告五队冬麦麦种的保存情况的。梁家宝队上的责任田分散在各处，罗贵娃已经几天没有看见过他了，此时一见顿感亲切，突然很想问问梁家宝的近况如何。\n\n罗贵娃刚想开口，突然感到背后一道锐利的目光射来——不好！罗雨来虽然出去了，督导组的干部还没走呢，这是工作时间，不许拉谈家常。心念电转，还没来得及浮现的笑容僵在了半空，涌上嘴边的话语默默咽了回去。\n\n“……都敛足了吗？”\n\n罗贵娃古怪的表情与不自然的说话让梁家宝也摸不着头脑，只好僵硬地一问一答。\n\n“……都足了，还有些富余。”\n\n“那我马上让大车过去，把麦种先入库。”\n\n三言两语之间，梁家宝已办完了他一天中最重要的一件事。他站在书记室门外直发愣：贵娃同志什么时候话变得这么少了？换了往日，不和他拉半个点钟的家常可没法抽身。"
CPC_rural_dem.203.o1: "这才叫紧凑朝气！"
CPC_rural_dem.203.o2: "这简直就是脱离群众！"

CPC_rural_dem.301.t: "关于组织原则的讲话"
CPC_rural_dem.301.d: "当前特别需要强调社会主义民主，我们党是千百万人的共同事业，应允许千百万人的发言，鼓励群众去参与革命工作。人民群众讲话难免会有错，也难免会过头，只要是有利于我们社会主义革命事业发展的，无论好坏话我们都需要听，兼听则明，偏信则暗。只有这样才能集思广益，才能生动活泼，热气腾腾。\n\n一个革命政党，就怕听不到人民的声音，最可怕的是鸦雀无声。一定要相信群众的大多数会珍惜自己的民主权利，有了这个根本立场，民主生活才能活跃起来，才能进一步把广大人民群众的积极性调动起来，为社会主义现代化事业而奋斗。共产党的机关，共产党的干部怎么能怕老百姓，对老百姓没有感情？那能叫共产党的干部吗？这样的干部在封建社会都不算好官！\n\n如何区分是非黑白，言论自由的界限，以及批评的范围，这就需要我们在法律与纪律的原则上建立，倘若民主变成无组织的民意盲动，那就意味着失败……\n——习仲勋"
CPC_rural_dem.301.o1: "目前的问题不是无组织，\n而是人民群众太拘谨。"
CPC_rural_dem.301.o2: "坚持组织原则，反对盲动主义。"
CPC_rural_dem.302.t: "关于民主原则的谈话"
CPC_rural_dem.302.d: "我们共产党员，尤其是基层的干部，即是为老百姓服务，就应该站在老百姓中间，而不能站在老百姓头上。中国这个社会，老百姓是一怕官，二怕管，那些旧社会的官老爷们也喜欢老百姓害怕他们，服从他们。要是在我们这里，基层的干部也学那些官老爷一样，仍然是板着脸，在衙门“坐堂”“拍升堂木”，“判官司，做父母官”，那就是完全不对的。我们应该让敌人害怕，而不是让群众害怕，不能让干部包揽一切，要有耐心的倾听，对方有意见说的，我们要仔细的听完，等到他讲完了，再根据实际情况，慢慢地向他解释，采取合适的方法。\n\n如果不发挥人民的力量，孤独地依靠我们基层组织与干部的影响，那就会让民主改革形式化，我们不要以为自己比老百姓高明，其实不然，这次农村涌现出了一批民间积极分子，他们的作风方法都很值得我们基层干部学习。\n\n民主的新创造要从实践中挖掘。农村现在有民间自办的“意见箱”，这个方法很好，在各公社大队都值得推广一下试试看，但必须是“民办公助”，只能让群众自发来搞，官方组织自己办的必须予以取消，避免不良影响。\n\n总而言之，组织不能代替群众说话，要让群众自发的起来参与，我们的改革才有成功的希望。\n——习仲勋"
CPC_rural_dem.302.o1: "坚持民主原则，反对包办替代。"
CPC_rural_dem.302.o2: "党组织要起到统领表率作用。"
CPC_rural_dem.303.t: "信件"
CPC_rural_dem.303.d: "中央：\n农村民主改革工作现在推进很快，但是随着改革的推进，种种问题也逐渐浮现，其中既有左倾也有右倾的错误：一，群众运动扩大化，打击面过广。二，形式主义抬头，搞表演式的民主斗争。三，基层干部不满，群众亦有担忧。\n\n解放山西计划即将展开，为了不影响即将来临的战争，农村民主改革应该在取得阶段性成果后逐渐收尾，这样我们才能集中精力到备战工作上面，并且更有效的动员群众参与解放战争，希望中央同意。\n仲勋"
CPC_rural_dem.303.o1: "同意，一段时期有一段时期的任务。"
CPC_rural_dem.303.o2: "运动可再延长一段时间。"

