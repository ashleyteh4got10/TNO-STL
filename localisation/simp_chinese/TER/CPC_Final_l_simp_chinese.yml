CPC_WINS_TRCW: "盘桓在中国人心中已有一甲子的§x独立自由之梦§!，终于§x实现§!！"

CPC_TRCW_end.1.t: "天涯海角共相望（一）"
CPC_TRCW_end.1.d: "苏庆黎调整着收音机的频段，试图能从一片沙沙白噪中找到一些有用的信息，随着喇叭里的声音越来越清楚，她捏着旋钮的手也逐渐慢了下来——“现在播报由台湾共产主义战士苏新同志撰写的《论台湾解放》……”\n听到“苏新”二字，苏庆黎扶着天线的手突然颤了颤，白噪音随即胜过了人声，重新霸占了她的耳朵。\n\n翌日，苏庆黎拿着誊抄的《论台湾解放》全文敲开了陈明忠家的大门，正好此时陈映真等台湾地下左翼朋友也在，苏庆黎便兴奋地朗读了这篇文章。\n\n“苏新前辈的这篇文章真是振聋发聩，如今大陆已经完全实现了独立自由，真是令人精神为之一振！”听完苏庆黎的朗读，陈映真激动地鼓掌道，“但反观我们台湾……”\n“不要灰心，革命不是一蹴而就的，我想我们几个应该响应大陆的号召，成立一个我们台湾自己的革命团体。”陈明忠一席话语点醒了在场的朋友同道们，众人彼此对望一眼，默契地点点头。\n\n回到自宅的苏庆黎仍然觉得心中团团烈火未得熄灭，父亲还活着对她而言是莫大的鼓舞，她连忙抽出信纸找出钢笔，要写一封交给——不知交给谁，但总有一天那封信会被送到父亲手里。\n她这么想着，笔走如龙，开始倾诉衷肠。"
CPC_TRCW_end.1.o: "“亲爱的父亲苏新同志……”"
CPC_TRCW_end.2.t: "天涯海角共相望（二）"
CPC_TRCW_end.2.d: "成立革命团体论坛的第一次秘密会议是在雪山峰举行的。大会持续了一天，确定了革命论坛的章程和组织形式，等到代表们从会场里鱼贯而出，已是傍晚时分。\n\n用过晚餐，大家在山顶散步，会当凌绝顶一览众山小的豪情在陈映真胸中喷薄而出，他开口发问：“大家，从这里可以看到大陆吗？”\n顺着他的手指，众人齐刷刷望向西北方向——可除了浓密的海雾外什么也没发现。\n\n陈明忠见气氛有些僵硬，拿出望远镜：“不试试怎么知道？”他拿着望远镜反复拨弄，但是镜头总是一片迷雾缭绕。\n\n“雾太大了，恐怕不行。”苏庆黎摇摇头，“也许我们明天再上雪山峰来看看？”\n\n没人回应她的提议——革命可不总能等到第二天的太阳，眼前这团浓雾就仿佛是台湾革命的前景——迷茫而令人忧心。\n\n突然，落日的霞光霎时间冲破了云雾。海峡彼岸隐隐约约的轮廓出现在众人视野中。所有人的脚步都僵住了，陈映真转回身来，凭空伸出手，试图去抚摸自己想象中的祖国，口里轻轻唱出了那句流传已有百年的歌词。"
CPC_TRCW_end.2.o: "“起来，饥寒交迫的奴隶……”"
CPC_TRCW_end.3.t: "天涯海角共相望（三）"
CPC_TRCW_end.3.d: "东南局书记韩先楚要给在福州的同志们一个惊喜，带着党政军要员们以视察海防战备工作为由来到了平潭岛，在例行视察结束之际，有一支新组建的部队早已枕戈以待——“解放军海军陆战第一团”，这是中央军委批准设立的第一支实验性海军陆战队——带着视察团参观结束后，韩先楚在团部临时搭建的露天会场上发表了讲话：“这次带大家过来不是来这里吃喝玩乐的，我知道，我们有些同志以为到了福建，就意味着全国已经解放了，可以高枕无忧享受太平日子了，这种想法是错误的，全中国还没有完全解放，因为日本帝国主义依然盘踞在我国的台湾虎视眈眈，他们有着强大的海空军力量，有着远超我们的高新武器，还有威力巨大的原子弹，他们不会轻易承认自己在中国大陆的失败，随时可能卷土重来，到时我们脚下的这片土地就是战争的最前线，而且我们不仅仅是要防御，还要进攻！”\n\n顿了一顿，韩先楚指着身后的大海说：“你们从这里能看到什么？我看到了四个字：万里海疆，中国的万里海疆！我们怎么能将它拱手相让？日本人有强大的海空军，我们也会有强大的海空军，十年不行就二十年，二十年不行就再二十年，我们终有一天能将祖国的蓝天与大海完全握在自己的手中，不再让任何人肆虐霸占它。”\n\n话头再转：“最近，苏新同志那里收到了一封信，是他女儿通过在日本的同志转交到我们这里的，她在信中说她会继承父亲的事业，为了台湾的解放与民族的统一而战，连这么孤身无援的一个女娃娃都有这样的觉悟，我们这些大老爷们又怎么可以落于人后？主席还在的时候曾跟我说，他已经很多年没看见大海了，如果有机会希望我代他去看看祖国的天涯海角，那时候我刚接到南下兵团的调令准备去四川——我又怎么会想到有朝一日我真能来到平潭岛看见我们的台湾海峡呢？但是我们真的一步一步的走过来了，今后我们依然会继续向前，不断向前，最终冲出帝国主义的包围圈，走遍祖国的每一寸山河！”\n\n热烈的掌声响起，但韩先楚却越过攒动的人头看向残阳落照下的海面，台湾岛屿的轮廓在海平面上若隐若现，他知道这时候肯定也会有人这么望向这边，正如他们现在一样。"
CPC_TRCW_end.3.o: "总有一天，你我终会相见。"
CPC_TRCW_end.4.t: "三千里江山"
CPC_TRCW_end.4.d: "在中共暗中资助下，朝鲜北部根据地成立了，因为年轻左翼作家身份得到中国方面扶植的黄皙暎，决定利用工作之余的时间开展一次面向学生的公开演讲，根据地内不多的学生（包括小学，中学以及大学生甚至还有夜校工人）齐聚某所前日资高中广场，聆听黄皙暎的发言。他当着数千人的面拿出一块黑板，连续写下几个词“爸爸”“妈妈”“家庭”让底下学生谈谈这几个词是什么意思，底下七嘴八舌气氛热烈，通通回答了出来，他满意地笑笑，又写了一个词“祖国”，顿时，学生们懵懂的目光齐刷刷射向了他，有人想要说话但是却不知道该怎么说，欲言又止。于是，黄皙暎便开始解释这个词：“所谓的祖国，就是我们所有人的爸爸妈妈，我们所有人共同的家。那么我们的祖国又叫什么名字？”\n\n他奋笔疾书写下两个字：朝鲜。\n同时，身边工作人员将一幅大比例的朝鲜半岛地图展开，上面用红色部分标注出了根据地。\n黄皙暎用手指着地图娓娓道来，谈到朝鲜古国的千年历史，谈到李舜臣与安重根，谈到平壤，汉城，釜山，济州，谈到朝鲜的三千里江山领土。\n正当所有人如醉如痴，陶醉在三千里江山的故事中时，他话锋一转，指着地图上的红色根据地说：“我们现在只有这么一点地方。同学们，你们愿意我们的家只有这么一点吗？你们愿意爸爸妈妈被人砍掉身躯只剩一个头吗？”\n底下仍是一片沉默，但不同的是，这次的沉默蕴含着一股朴素的愤怒——\n\n黄皙暎深吸一口气，用十分激昂的语调吼道：“这！是我教给大家的第一课！我是朝鲜人！我的祖国是朝鲜！我深深地爱着祖国母亲！我决不允许有任何人继续侵犯欺侮它！我和我的祖国一刻也不能分离！”"
CPC_TRCW_end.4.o: "“祖国万岁！”"
CPC_TRCW_end.5.t: "新星"
CPC_TRCW_end.5.d: "“老纪，我这可是等你等得好苦哇。”眼见纪登奎推开自己的办公室房门，刘建勋笑着长出一口气，“南京的接收改造工作还顺利不？”\n\n纪登奎苦笑着摇摇手：“快别提了，要真有下辈子我可不当这个南京市委书记的职了，你是不知道江淮这些地下民主社团有多刺儿头，开政协会的时候可费了我不少口舌。”\n\n“北平也一样。”刘建勋摊摊手，“第一届全国人大就要开选了，现在全国政治形势很复杂，这些年我们跟华中华东这些新解放区毫无疑问是有代沟的，他们想的跟我们想的不可能完全一致。”\n\n“不过，”刘建勋话锋一转，“唉，其实，人大选出来不符合我们的预期也正常，它本来就代表人民的立场——主席不是常说一句话嘛：‘党外无党，帝王思想；党内无派，千奇百怪’，不仅党外难，党内反对我们的人也不会少的。”纪登奎点点头：“其实我想，我们是要搞一个新中国，就不能再走国民党的老路，要是我们听不进去人民的呼声和反对意见，麻烦就会一波接一波地来——以后我们要做的只有一个事，要维护人大，让它能代表人民的意志，不要被野心家……”\n\n“不必多说，我清楚你我在原则性问题上都不会让步。”刘建勋从抽屉里翻出一张皱巴巴的白纸，上面歪歪扭扭地写着些字——看来是一位老人家风烛残年时的手笔：“解放后尽快开十大，把刘、纪叫到中央参会。”\n\n“主席的意思么？”纪登奎凑上前来。\n\n“听邓书记讲，是主席临走前几天交托给他的。”刘建勋面色凝重，“邓书记警告过，党内不少老干部觉得我们年轻，资历浅，觉得我们还没有资格参加政治局的会……”\n\n“混账话，干革命还分老少了，好不容易有个正常退休制度了，这帮人转眼忘得一干二净了是不。”纪登奎发了句牢骚，“今后这几年我们非干出点成绩让他们闭嘴不可。”\n刘建勋不再说话，只是默默点点头。\n\n门咚咚地响了，刘建勋抬起头：“请进！”\n\n进来的不是别人，却是卓琳，她娴雅地向刘纪二人微微颔首：“正好纪登奎同志也到了，小平同志让你们两位安顿下来之后到他那里去，讨论一下十大的筹备工作。”\n\n两人对视一眼，站起身来。"
CPC_TRCW_end.5.o: "“知道了，卓琳同志。”"
CPC_TRCW_end.6.t: "通告"
CPC_TRCW_end.6.d: "为了适应全国解放后即将开始的大规模建设与恢复工作，中央人民政府各项工作与机构应进行重新的分配与重组，应在社会主义制度的基础上建立新中国的统一中央政权；同时，拟在新解放区建立各级人民政府与军事机构。\n\n现做以下决定：\n\n一，政务委员会重新改组，建立代表中央人民政府统一管理全国事务的国务院。\n二，在新解放区建立大区人民政府，大区人民政府直属中央人民政府管辖，大区人民政府是代表中央人民政府在各该地区进行领导与监督地方政府的机关。\n三，在新解放区建立各大军区，与大区人民政府并行，服从中央军事委员会命令，由中央直接调动。\n\n以上命令，将在全国解放后进行。"
CPC_TRCW_end.6.o: "中央人民政府今天成立了！"
CPC_TRCW_end.7.t: "宴会悲音"
CPC_TRCW_end.7.d: "西安宴会厅举办庆功宴，共同欢庆全中国的解放。这里有中央领导，有地方干部，有职业代表，有普通群众。\n\n狂欢之中，只有王光美注意到大厅内消失了一个人——她的丈夫刘少奇。由于巡桌敬酒活动，起初她还以为自己和丈夫错过了时机，去到了不同的地方。可是左等不来，右等也不来，十几分钟过去了，刘少奇依然没有出现在眼前。少奇是不是被哪桌留下喝酒了？带着疑惑和不安，王光美与同桌女同志道歉后，离席踏上寻找刘少奇的道路。\n\n今天是不须拘束礼节的一天，随着宴饮逐渐深入，宴会场面越发凌乱。王光美花了好大力气，才从人群中挤出到守备兵团这桌。\n“肖劲光，你看见少奇同志了吗？”\n肖劲光喝得有些发懵，嘴里歪歪斜斜说刘少奇在这喝完之后又去别桌喝，早就不在这了。\n“他挺高兴的。”肖劲光还补充道。\n\n王光美又走到了产业工人这桌，询问刘少奇的下落。一位五金工人告诉她，刘主席敬完酒就去老领导那桌了。说完，他还斟满一杯酒敬王光美：“我们全体工人祝刘主席身体健康！”\n王光美道了谢，喝了酒，工人的老领导，肯定是赵明新那桌，那桌坐的全是刘少奇的老战友。\n一到地方，王光美大惊失色，这一桌的人全都喝得又哭又笑，而刘少奇就面色惨白地瘫坐在椅子上一动不动。王光美气不打一处来，怎么能这么喝？她拉了刘少奇的胳膊一把，发现拉不动。\n“好……好像僵住了……”\n\n刘少奇因过度激动，在酒精作用下突发脑溢血，瘫痪在宴席上。为了不破坏宴会的气氛，王光美让服务员以喝醉为名悄悄从侧门把刘少奇抬出去，随后乘上救护车一路狂奔。但时间还是太晚了，路途中不幸病逝。"
CPC_TRCW_end.7.o: "至少他曾被欢愉包裹。"
CPC_TRCW_end.8.t: "新中国宣言"
CPC_TRCW_end.8.d: "春日的晨曦温柔地洒在首都的每一个角落，何平身着整洁的中山装，站在那熟悉而又庄严的播音室内，手中紧握着那份承载着无数希望与梦想的稿子。他，现在是第一位中央播音主持人，肩负着向全国人民宣告新纪元到来的神圣使命。他的眼神中闪烁着对未来的憧憬，以及对过往的深刻铭记。这一刻，时间仿佛凝固，所有正收听着广播的人民都聚神于他即将宣读的时代之声。\n\n“亲爱的全国同胞们，历经沧桑、饱受战火洗礼之后，我们终于迎来了和平的曙光……”何平的声音，如同春风拂过心田，温暖而有力，每一个字都蕴含着无尽的深情与希望。他的话语，不仅是对战争的告别，更是对新生活的热烈向往。\n“为了解放，为了自由，我们牺牲了很多同志战友，很多亲人朋友，很多很多我们爱的与爱我们的人……”\n在他的讲述中，人们仿佛看到了那些在战火中不屈不挠、勇敢前行的身影：他们在河洛平原，在山西群脉，在华北大地，在秦淮河畔，在云贵高原，在光怪陆离的广东，在冰天雪地的东北……他们有解放军战士，有工人，有学生，有农民，有知名的，有不知名的人。何平用那富有感染力的声音勾勒出一幅幅历史与希望交织的画卷，那些英雄的人们一群又一群的从中走出，他们的脚步踏遍了整个中国大地，他们的鲜血染红了万里河山。\n“最终我们胜利了！这是全中国人民的胜利，也是全世界人民的胜利。”\n“中国的革命是全民族人民大众的革命，我们有一个广大的和巩固的革命统一战线。这个统一战线是如此广大，它包含了工人阶级、农民阶级、城市小资产阶级和民族资产阶级。这个统一战线是如此巩固，它具备了战胜任何敌人和克服任何困难的坚强的意志和源源不竭的能力。可以说，不论帝国主义侵略者还要如何继续反对中国人民，中国人民总是有办法取得最后胜利的。”\n那一刻，何平的声音，不仅传遍了千山万水，更深深烙印在了每一个中国人的心中，成为了一段不可磨灭的历史记忆。\n“同时，我们向全世界庄严宣告：我们所反对的只是不断侵略压迫其他国家的帝国主义秩序，这种所谓的法西斯新秩序是压迫在全世界革命人民身上的囚笼，也必然被全世界的革命人民所撕毁，我们现在所处在的就是一个这样的法西斯帝国主义制度走向全部崩溃的时代。”\n\n“中国人民和全世界人民都将会看见，中国的命运一经操在人民自己的手里，中国就将如太阳升起在东方那样，以自己的辉煌的光焰普照大地，迅速地荡涤反动政府留下来的污泥浊水，治好战争的创伤，建设起一个崭新的强盛的名副其实的——”"
CPC_TRCW_end.8.o: "新中国！"

CPC_Lin_Coup.0.t: "后方密报"
CPC_Lin_Coup.0.d: "一封来自西安林办的绝密电报被送到了平津前线正在布防的林彪手中，上以密语标示说“大树已倒，鸟兽不惊。”\n\n他的脑子嗡的一声，当即明白了叶群的意思：主席去世了——但现在林彪来不及悲伤，平津前线的诡异和平不会维持多久，很可能用不了一周，甚至三天，前线的寂静必然要被打破——而他还需要指挥好解放东北的战役部署工作。\n\n但他又回想起了在根据地的那些日子：政务委员会里充斥着扯皮反复和举棋不定，周恩来也好邓小平也罢，为了那几个野心家的意图四处奔走——要么病倒要么受处分……\n……是了，周恩来去世后薄一波这帮人就开始加紧在政府里撤换军代表，明显便是要让我这个军委副主席靠边站……\n\n……但主席也说过党指挥枪，不是反过来……\n\n……不对，我也是中央，回去开个政治局会议看谁能量大，何必苦跌塔——他们要撤我的权，我为什么不能撤了他们的权……\n\n越想越烦躁的他摸摸好些日子没剃过胡须的下巴，抬起头看了看东北地形图，眼神里透着一股冷冽——但很快，那股冷冽转化为一种无奈和疲倦，他抬头看见了更高处挂着的毛主席像，深吸一口气冷静了下来。\n\n“一切以战事为重……”他喃喃自语，一把捏碎手中的花生米，“……若我出关回来你们还是那副样子……”"
CPC_Lin_Coup.0.o: "“……那就别怪我不客气了。”"
CPC_Lin_Coup.1.t: "新星？"
CPC_Lin_Coup.1.d: "“老纪，好久没见了。”眼见纪登奎推开自己的办公室房门，刘建勋面色凝重，“南京的接收改造工作还顺利不？”\n\n纪登奎板着脸摇摇手：“快别提了。”两人沉默对视，互相明白了彼此的意思。\n\n“……中央的情况怎么样了。”纪登奎率先打破僵局，问出这个自己早已心知肚明的问题。\n\n刘建勋四处望望，压低了声音：“林总就在西安——刘主席刚去世，西安就说要开一次中央的临时会，我没被叫去——应该是邓书记的意思，但听万里同志说薄一波刘澜涛他们都被叫去了。”\n\n两人正交换着情报时，门被推开——习仲勋径自走了进来。\n\n“非常时期，多的话不讲了。”未及寒暄，习仲勋便关上门，凑到两人中间，“中央警卫团上星期一一大早把薄一波刘澜涛他们锁在西安的住处不得出入了，肖劲光带的队，邓书记都被拦着，只说没有林总手令谁都不准见他们。”\n\n刘纪二人心中一凛，豆大的冷汗便从背后渗出浸湿了衬衫，多年的工作经验让政治嗅觉敏锐的二人觉出了一丝不祥的意味——也许什么重大的变故将从中央开始……\n\n“主席临终前交托说，要你二位结束完地方工作就回中央开十大——我不晓得主席打的什么主意，但他点名要的人暂时没人会动；林总在想什么我们现在也不清楚，邓书记交代我说走一步看一步，保证党内稳定再图后计。”\n\n纪登奎这才明白，在他们丝毫未觉的时候，党这艘大船已走到了浪急风高的关键节点。“那我们在南京做的那些工作，我跟他们下了保证书的呀……”他不甘心自己在南京的工作就这样失败。“都得推了，现在的局面你们应该都看得出来，不是讨论这些的时候。”习仲勋语气严肃不容置疑。\n\n“明天你二位吃过早饭以后，立刻到邓书记和江青同志那里听安排，我到时候也会跟你们一起去。”\n\n说罢，习仲勋急匆匆起身，却被刘建勋拦住，三人的手紧紧握在一起。"
CPC_Lin_Coup.1.o: "“谢谢你，仲勋同志。”"
CPC_Lin_Coup.2.t: "公章"
CPC_Lin_Coup.2.d: "林彪的办公桌上还摆着一枚从薄一波家中搜出的公章，上面刻着穗环，当中一个篆体的“政”字尤其显眼——现在这枚公章在自己手里，那就意味着，自己有了指挥中央人民政府的权力。\n\n他把玩着这枚公章，脑海里立刻浮现出那些故人的身影：毛泽东、周恩来、陈毅、康生……再往前还有彭真、任弼时、左权……再再往前，他的思维停在了四十年前提笔向毛泽东写出那封贺年信的时候。\n\n至少对毛泽东这样真正经历过大风大浪的人来说，自己那时太幼稚了，幼稚得连毛泽东都不忍心太过批评自己，而是写了封言辞恳切的回信。数多年来，他常常会回想起自己那句足以载入党史的刻骨铭心的提问：红旗到底能打多久？\n\n毛泽东的回信显然应验了，红旗真的打到了今天——哪怕最开始扛旗的那些人一个个都闭眼了，今天的中国共产党还是成功拿下了足有一千两百万平方公里之巨的中华大地。\n\n可是，打到今天的还是红旗么——以往的林彪并未过多顾及政务，他只是对屡次破坏制度要请自己出山强行施政，而九大过后便立刻要把自己踢开的那群坏人官僚感到不爽。他明白那不是共产党该干的事，所以在全国解放的这个当口，他出手将红旗抢到了自己手中——但更大的问题已经摆在面前，他要怎么干才能让红旗屹立不倒呢？红旗要想不倒，政治必须可靠……可是主席身后这些人谁又能心甘情愿听自己指挥？除了自己人还有谁可靠？\n\n“……我怎么知道……”他把公章丢在桌上，思索良久，那个令人生厌的精明矮子又闯进了他的脑海——\n\n他似乎下定决心，拿起了电话：“给我接书记处……”"
CPC_Lin_Coup.2.o: "“……要邓小平。”"
CPC_Lin_Coup.3.t: "军人与书记"
CPC_Lin_Coup.3.d: "“我想在十大上当中央委员会主席。”林彪办公室只有一个座位——由他专享，而眼前的邓小平则只能恭恭敬敬立在办公桌后，“我知道我这么做难免有人要骂我是万世不易的贼。”\n\n邓小平身子前倾，试探地说道：“建国马上开十大不是不行，主席他老人家临终前也是说建国以后要尽快开十大整顿全国党组织，确定新的中央工作路线。”他话锋一转，“但是至少应该先写好立国宪法，组织好新中国的政治结构我们才好开……”\n\n“……夜长梦多，修正主义分子的问题要尽快在十大上处理了，他们在地方的那些根根须须也要一起铲除。”林彪揉揉太阳穴，“过去党内的坏人出得太多，为首的就是薄一波、刘澜涛、林枫、周扬这些人，还有那个死掉的刘少奇，不走毛主席的革命路线，要去走修正主义路线，过去几年你就在政府，你也看到了，这些人一直阻挠主席的决策和行动。”\n\n邓小平并未发话。\n\n“开十大的文件要过书记处看，我现在把你这个书记处书记叫过来，你把字签了。”\n\n“政治局会议都不开？”邓小平的手心有些出汗。\n\n“党内坏人多，非常时期行非常举措，请你理解，邓小平同志。”“同志”二字刚脱口，邓小平便听见门口卫兵子弹上膛的声音——眼前这秃顶老头竟敢下如此狠手？"
CPC_Lin_Coup.3.o: "“为了革命，请你理解。”\n林彪又重复了一遍。"
CPC_Lin_Coups_tt: "§L林彪同志§!现已荣任§R中共中央委员会主席、中央军事委员会主席、[CPC.GetName]国家主席§!，党内§R走资本主义道路的当权派已被迅速控制§!，§x他们将得到应有的审判§!。"
CPC_Lin_Coup.4.t: "两份张贴布告"
CPC_Lin_Coup.4.d: "（左）\n坚决打倒党内走资本主义道路的当权派薄一波、刘澜涛、林枫、周扬！\n坚决消灭叛徒在各地省委的代理人韩光、任白戈、于光远、胡绩伟、龚育之、白栋才、任仲夷、赵明新、李力果等叛徒！\n坚决消灭叛徒在人民军队的代理人萧华、张爱萍等叛徒！\n坚决消灭人民政府中的资产阶级梁漱溟、吴景超、谢婉莹、许烺光等敌人！\n全国人民团结起来，打倒走资本主义道路的当权派！保卫毛主席葬礼的安全！为主席站好最后一班岗！\n全国人民动员起来，团结在以林彪主席为核心的党中央周围，保卫革命胜利果实！\n全国人民武装起来，保卫红色江山永固，保卫国家领土主权，打倒日本帝国主义！\n\n（右）\n汉中党委连同卫戍部队近日破获重大反革命集团案，以原汉中市人民医院副院长徐林为首的资产阶级反革命医生集团经查明，在工作中传播资产阶级反革命思想，诋毁毛主席林主席的革命路线与主张，罪犯徐林及其党羽共77人供认不讳，已移交汉中革命法庭处理。\n自林彪主席提出在全党全军全国开展保卫革命胜利果实斗争以来，人民解放军各级官兵积极响应，在全国各地区建立军革委，据南京军革委主任许世友同志介绍，解放全国后南京革命形势喜人，他指出：“南京肯定有反革命，不但有，而且有一窝窝，一串串。”仅在高伪民国原“国立中央大学”就揪出了三千五百多名反革命分子，成功拔除了隐藏在南京的反党反社会主义的大毒瘤。\n全国各地形势大好，革命进程迅猛如雷，全国人民团结起来，在英明领袖林主席指引下，必能大步跃进奔向社会主义美好明天！"
CPC_Lin_Coup.4.o: "叛徒及敌人名字均被倒写画叉。"
CPC_Lin_Coup.5.t: "通告"
CPC_Lin_Coup.5.d: "为了适应全国解放后即将开始的大规模建设与恢复工作，中央人民政府各项工作与机构应进行重新的分配与重组，全党全军全国各族人民应始终不渝地遵循马克思列宁主义毛泽东思想的革命道路，坚决拥护英明领袖林主席的伟大部署，在社会主义制度上建立新中国的统一中央政权；同时，拟在新解放区建立各级人民政府与军事机构。\n\n现做以下决定：\n\n一，鉴于原“中央人民政务委员会”在党和国家历史上未能正常履行其职责，被一小撮走资本主义道路的当权派把持，妨害了党和国家的社会主义道路，宣布予以废除，将另择日期公布中央人民政府之构成。\n二，在新解放区建立大区人民政府，大区人民政府直属中央人民政府管辖，大区人民政府是代表中央人民政府在各该地区进行领导与监督地方政府的机关。\n三，在新解放区建立各大军区，与大区人民政府并行，服从中央军事委员会命令，由中央直接调动。\n\n以上命令，将在全国解放后进行。"
CPC_Lin_Coup.5.o: "人民政府，一纸空谈。"

