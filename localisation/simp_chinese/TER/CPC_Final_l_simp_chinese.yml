CPC_TRCW_GNG.1.t: "大梦初醒"
CPC_TRCW_GNG.1.d: "火红的夕阳在十五层楼高的房间里投下琥珀色的光芒，尽管如此，他们依然能听见政府大楼外的警笛声。又是一个混乱之夜要来了，车辆被掀翻，店铺被焚烧，街头陷入混乱，这无形的混乱似乎要在阳光明媚的房间里投下一片看不见的阴影，而这阴影似乎就是从盛田那佝偻的身躯下投射出来。\n\n在李嘉诚、何鸿燊、大森宽的注视下，盛田将一份文件摆在了桌面上，那是中共发来的勒令广东无条件投降的通牒，所有人都清楚这意味着什么。\n\n“没办法斡旋么。”李嘉诚问出了这个他早已知道答案的问题。大森宽很快摇了摇头：“这是日中战争的反噬，以我的了解，他们的目标自始至终只有一个——中广满蒙甚至台湾桦太全部收回囊中，不达目的誓不罢休。”\n\n办公室再度再度陷入死寂，何鸿燊突然发话，不甘败落的声音回荡在办公室里：“我这就去把汕头潮州那些地方的三合会组织起来，我不信他们能有多强的战斗力。”\n\n盛田摇了摇头：“不要这么冲动，我们的目标没变过，如果把广东交出去能保护这片土地和上面的人们，我想……”"
CPC_TRCW_GNG.1.o: "“……也许可以和他们谈谈。”"
CPC_TRCW_GNG.2.t: "踌躇不决"
CPC_TRCW_GNG.2.d: "松下的办公室杂乱无章，还充斥着一股让人隐约感到燥热的浊气，像是要吞噬掉屋内所有的人。\n\n作为外务秘书，现在又到了盛田对松下进行每周简报的时候了，但也许是头一次，他恨不得草草说上几句就溜之大吉。饶是如此，这份报告他却也不得不做——因为中国共产党刚刚把勒令广东无条件投降的通牒送到了他的手上。\n\n“现在中国内战打成了绞肉机，两边死了几十万上百万的人，大军已经压到我们的西部边境了。”盛田努力控制着自己的声音，“报纸上都写着呢。《九州周刊》说‘中共兵锋直指广州’，《广州日报》说‘日本侨民正撤回本岛’，就连中国的《中华日报》都有闲着没事干的社评员说‘广东国恐难以抵挡国共两军战火’……现在的情况咱们都清楚了，我不知道共产党使了什么手段，总之我们现在已经联络不上日本了——我看到有报道说广东边境在排长队，进关要花三小时，出关要六小时。如果我们再不行动——”\n\n\n\n松下伸手抄起共产党的最后通牒，狠狠摔在地上。他挂着臃肿的眼袋转过身来看向部长，“你说的我全知道，但我现在已经焦头烂额了，请给我几个小时让我静一静，拜托了！”\n\n盛田看向松下的目光里不无悲悯，他转回身去推开房门。"
CPC_TRCW_GNG.2.o: "“负责人是你，你做决定。”"
CPC_TRCW_GNG.3.t: "天翻地覆"
CPC_TRCW_GNG.3.d: "血液和咖啡在井深的血管中争先恐后地流动，他迫使自己那摇摆不定的双眼看完了中共勒令广东无条件投降的通牒——又是一份坏消息。经济线条已经直线下坠，地图上的战线划分也预示着广东国即将面临生命中不可承受之重。命令一道接着一道地从行政长官办公室中投出，何时停止只取决于井深何时短暂地睡下，或不自觉地进入梦乡。然而，事态仍然没有什么实质性的改变，仍在稳步地走向毁灭。\n\n井深全身上下都觉得很糟。无处不在的头痛自然不用多说，他的脑子被困在了疲劳与咖啡因之间的无人区。他明白自己的身体已经出现了问题，每度过一秒钟他都感觉是在生死之线上挣扎。谁知道呢，也许他确实大限将至。要是无法解决这个问题，井深所建立的一切都将走向死亡，可能也包括他自己。若是日本还残留着一丝旧日的力量，也许东条英机手下那群老畜生最终会如愿以偿，把广东变成一座庞大的驻军区；也许南京能赶在一切都还来得及之前把中国西北的共产党摁死在黄土高原；也许共产党确实可以为民众带来他们所期许的美好未来。\n\n……不，这些可能性从一开始就不存在。前方只有成功，一旦失败就将万劫不复。考虑失败就是承认失败。他的愿景是现实的，他的事业是正义的。带来未来就是他的责任，所以没有什么能够阻止。这些问题都会被解决，如果不行他就继续在这熬着。再熬一个星期的通宵，再熬一个月，直到太阳把地球烧成焦炭。不能容忍任何失败。他手下的任何人都不行。当然，他也不能。"
CPC_TRCW_GNG.3.o: "手扶着犁向后看的，不配进上帝的国。"
CPC_TRCW_GNG.4.t: "不屑一顾？"
CPC_TRCW_GNG.4.d: "昏暗的办公室中，驹井健一郎正焦虑地踱来踱去。木桌上洒满烟灰，摆在桌面上的是中共发来的勒令广东无条件投降的通牒——苍白的纸张、无休止的电话闹铃、还有街面上的火光冲天，无一不在牵动着驹井的心绪。他和日立公司就像是坐在从珠江上游顺流而下的船上，而他清楚，片叶孤舟在即将掀翻广东的海啸面前毫无作用。尽管驹井清楚这一点，尽管日立的利润已经如自由落体般从高空坠下，尽管他已经心乱如麻，但在从情报室接过这份通牒时，他仍然保持得不屑一顾——好像他永远是高居于皇座上睥睨众生的广东皇帝，只有极细心的人才能发现他接过文件的枯槁苍黄的手正在微微发颤。\n\n犹豫再三，驹井接起了电话，电话那头是他有生以来未曾听过的冷酷语调。\n\n“你们搞砸了，中国最近的事态……我就这么说吧，已经超出了我们所有人的预估。”电话那头并非日立的执行总裁，而是日产的“傀儡师”。\n\n“请您相信，先生，我还有——”驹井插嘴，但立刻被堵住了。\n\n“我们已经做好了最坏的打算，你也该为自己的前途考虑考虑，如果你那么想留在广东，你就必须自己努力，我们不会给你更多的支持了。”\n\n驹井无力反驳，只得表示同意，并挂了电话，随后瘫倒在椅子上，一脸败相。\n\n但他还没有放弃。他的大脑开始飞速运转，他重新拿起了电话听筒，拨通了另一个本地号码。"
CPC_TRCW_GNG.4.o: "“是永野茂门将军吗……”"
CPC_TRCW_GNG.5.t: "立法会闹剧"
CPC_TRCW_GNG.5.d: "犹豫许久，[GNG.GetLeader]最终还是走进了立法会大楼，人群的喧闹嘈杂因他沉重的步伐而逐渐消停下来——所有人都明白，国共战火越烧越旺的今天，广东国已经走到了生死存亡的边缘，或许现在就是广东国立法会的最后一次全体会议了。\n\n“今天把大家召集来这里，是为了讨论对共防务和内部治安问题的……我方已经提出了一项法案，现在开始讨论投票。”\n\n当真正看到法案内容时，连最温和的索尼派议员都愕然了——“解散广警及宪兵队条例”几个大字赫然映入眼帘。\n\n会场立刻陷入骚乱，议员们不知道的是，这是叶剑英向[GNG.GetLeader]承诺和平接收广东的最低条件。井深大和驹井健一郎立刻站起来用平生所知最肮脏的词汇围攻行政长官，他却一反往日针锋相对的意气风发，待富士通和日立议员们的声浪渐渐低下来，他终于开口了：“就算保留广警和宪兵队也没法抵抗共产党大军压境，我方举措完全是出于避免劳动力浪费在战场上的目的，并非所谓叛徒，我们的防务可以移交日本负责。”\n\n井深大怒火中烧，他指着[GNG.GetLeader]的鼻子痛骂：“你他妈是故意为之，谁不知道我们现在联系不上本土？”驹井更是已经将面前的条例文件撕得粉碎：“背弃共荣圈的叛徒，早晚你会被宪兵队押着游街！”\n\n众人再度叫骂甚至厮打起来，徒留[GNG.GetLeader]无助地站在台上，像个考试没及格正在挨骂的孩子。"
CPC_TRCW_GNG.5.o: "我就不该接行政长官的烂摊子。"
CPC_TRCW_GNG.6.t: "解放广东政治动员令"
CPC_TRCW_GNG.6.d: "全体指战员们同志们：\n\n解放广东的战斗就要开始了。\n\n广东是我国民革命肇始之地，我们必须将革命圣地从日伪手中夺回，我们为终于能驱逐日寇二十年在广之压榨殖民行径而感到无上光荣！我们必须全部彻底干净地歼灭穷凶极恶的伪广政府及垄断财阀，以便继续前进，解放全中国。\n\n解放广东是一场正义之战，也是一场必胜之战，第一：广东工农各阶级人民已经奋起自发反抗殖民侵略暴行，敌伪军疲于镇压人民起义，已无能力应对我们的进军；第二：潜伏敌后经营多年的华南局同志为我们提供了充足的情报，我们对广东了如指掌；第三：广东本地多是警察部队，战斗力孱弱，战斗意志低下。这将是我们解放广东的有利条件。\n\n但伪广政府并非待宰羔羊，他们随时有可能召唤日本侵略者送来支援，可见接下来将面临的是一场艰苦的战斗。我们必须力求以最低代价消灭敌人，既要勇敢也要运用智慧，每战都需充分准备，人人要善于运用技术与政治攻势去打败敌人。同时要坚守政治纪律，与人民形成良好关系，不拿群众一针一线，保护重要工业与科技设施，将一个完整的广东送回人民手中。\n\n全体解放军指战员要勠力同心、军纪严明、荣辱与共、团结奋进，以枕戈待旦、兵不解甲的战斗姿态，以担当作为、不胜不休的战斗作风，为打赢这场解放广东的战斗作出不懈努力！\n\n同志们，让我们团结同心，一齐高呼：\n赶走侵略者，解放广港澳！\n\n中国人民解放军南下总前委主席 林彪"
CPC_TRCW_GNG.6.o: "赶走侵略者，解放广港澳！"
#永野茂门，我操你妈，你他妈一个破军逼出身，凭什么在这耀武扬威啊
CPC_TRCW_GNG.7.t: "谁家高楼今复在"
CPC_TRCW_GNG.7.d: "仅仅两个月以前，这帮暴民看见皇军的战车还会作鸟兽散，可现在在外面的是什么？机枪大炮手榴弹掷弹筒，这群赤匪是要把这栋楼炸塌了给我立坟吗？当初就不该来什么广东国，要是当初我去的是西北，保准把那群残兵败将宰得一个不留！\n\n——困守宪兵队指挥部的永野茂门一时间心绪杂乱，但眼下战况已容不得他脑海里生出的十万个“当初”了，炮弹带着尖锐的鸣响，直冲大楼而来。永野慌忙趴在了水泥地上。随后便是有如闷雷爆响，大楼阵阵摇晃，碎屑灰尘扑簌簌地落在他已经被硝烟熏黑的将官服上。平静下来后，永野起身四顾，部下们的狼狈惨相刺痛了他骄傲的内心，他终于爆发了。\n\n“为什么我总是在跟一群懦夫废物共事？！广东的财阀企业只会四处炫耀财富，根本没人忧心帝国社稷！天天想着什么狗屁警务改革，暴乱一开始就该把我们派出去碾了那群暴民，哪儿会落到今天这步田地！”屋里的其他人呆滞地盯着状若疯癫的中将阁下，不敢言语，而永野茫然未觉。\n\n“宪兵队也是一群他妈的酒囊饭袋，关键时刻没有一点作用！”怒火并未随着宣泄而消散，反而愈发高涨，“还有那头蠢猪高宗武！他不也在跟赤匪打仗吗，友邦有难怎么不见这废物派兵过来？”恍惚之间，荒唐过往宛如电影胶片掠过眼前：马来亚燃烧的丛林、哥伦比亚高耸的山峦……是了，脑满肠肥的本岛官僚们也丝毫不关心广东驻屯军的生死，他们只在乎广东送来的滚滚金流，自己和麾下士兵只不过是牌桌上随意摆弄的小小筹码，不值一哂。\n\n大门在手雷的爆炸中四分五裂，一排黑洞洞的机枪口直挺挺地对着楼内最后的残军。永野已来不及思考，他焦躁地抽出指挥刀，颤巍巍地举在身旁，凄厉喊着“九段花下再见，万岁——”便往交叉火力网中扑去。在被呼啸而来的子弹射流打穿脑袋的一瞬，他倏忽闪过一个念头——当年，在淞沪、在南京，敌人也曾是如此地绝望吗？"
CPC_TRCW_GNG.7.o: "已有之事，后必再有；\n已行之事，后必再行。"
CPC_TRCW_GNG.8.t: "此去经年"
CPC_TRCW_GNG.8.d: "共产党对原广警部队的处理意外地非常宽大——原广东国民族识别为珠人的，一律根据其原籍识别为汉人、壮族或其他民族，对于有意愿参与协助广东治安的，在经严格思想政治教育后给予临时军警身份，听从临委会治安办公室指挥。这给了林巧川莫大的宽慰，横亘在他内心数十年之久的巨大民族鸿沟终得弥合——然而还有一件悬而未决的事。\n\n“现在感谢党和人民政府给我改过自新的机会，让我可以重新做人回到人民群众的队伍中来，我将用我的后半生努力忏悔，为广东人民奉献自己。”在写完思想汇报后，林巧川搁笔看向窗外。广东的难民疏散工作已经接近尾声，这也意味着作为红十字会志愿者的安川良子即将完成她的工作——她要回国了么？\n\n正是千般愁绪涌上心头的时候，宿舍门吱呀一声被推开，同为临时军警的舍友李骏攥着一份信件走进来，两人寒暄了一番，李骏把信封递到他的面前：“听说是红十字会你的一个老朋友送来的，我路过传达室顺手给你捎了……不读一下吗，老林？”他看着林巧川坐在台灯下看着信封发愣。\n\n林巧川收起了信封：“不忙在这一时，你家还好吗，广州时不时还会挨炸，记得提醒家里人不要外出活动。”\n\n“刚打过电话，都好着呢，我弟弟都进临委会当日语翻译了。”李骏自豪地笑起来，“桌上是你这周的思想汇报？”\n\n“嗯……我以前当广警的时候没写过这种东西……还挺别扭的。你不是在华工委听过党课吗，帮我看看写得对不对劲。”林巧川挠挠头，不好意思地笑笑。李骏看看他手里攥着的信封，又看看桌上的文件，恍然大悟，他故弄玄虚地摸摸下巴的胡茬：“成，外面灯亮我拿去外面看。”\n\n望着被李骏虚掩的房门，林巧川在心里不断对他竖起大拇指，随后打开了信封，借着台灯灯光看到了那熟悉娟秀，但还稍显幼稚的中文字体。"
CPC_TRCW_GNG.8.o: "“敬启、林巧川先生”"
CPC_TRCW_GNG.9.t: "信"
CPC_TRCW_GNG.9.d: "敬启、林巧川先生\n\n红十字会的工作十分繁忙，直到今天我才有空提起笔——这好像是我第一次提笔给您写信，希望不会是最后一次。一想到要给同自己朝夕相处过这么久的林警官写这样一封告别信，心中一股酸楚便涌上来，令我不能自拔。\n\n说起来我们第一次相遇好像并不顺利，父亲去世后不久，我作为《广东妇人公论》的新人记者在市场上和人吵架，您维持治安时一脸凶狠的样子在年轻女孩子心里很减分喔——话虽如此，我们还是那样相识了，现在想来，林警官恐怕也觉得那时的我无比幼稚吧，半句粤语不会说就上街采访和人吵架，后面还要麻烦自己从本职工作里抽身保护新人记者的安全……什么的，总觉得给林警官添了很多麻烦，真是十分抱歉。\n……\n接下来的日子里，我们一起在广港澳穿行，您教给我广东社会中所必需的人情世故，教给我粤语的读写技能，也教会了我怎样正确地帮助那些把广东视作家的可怜人们——这一切的一切，都赖您所赐。\n\n还记得我看到你巡逻在广州的街头，满心欢喜地朝你招手炫耀我刚学会的“你好”，但突然又想起我浪费了采访的时间，等你走近，看到的却是一个双手抱胸气鼓鼓的安川良子——我想这大概就是少女飘忽的心绪吧。\n……\n离登机只剩一个小时了，我却还有好多好多的回忆想同你分享，但时间不够了……我会先到曼谷，等一切安定下来再回到本州，老实说我根本不想回本州，我的人生已经被广东彻底改变了，广东才是我的家，我的家里有你，有《广东妇人公论》的大家，还有我采访过的帮助过的可爱的人们……\n\n我曾听说有个叫马丁·路德·金的民权运动家说过，“我梦想有一天，山谷弥合，高山夷平，歧路化坦途，曲径通衢”，我想，我们中日之间也会有那一天的，到了那一天，我就会再回到广东，回到我心中的家乡，再来找你。\n\n随信附着的是我们最后一次分别的时候我偷偷保存起来的警徽，现在还给您。\n\n安川良子、敬具"
CPC_TRCW_GNG.9.o: "离别悄无声息，但足以令他热泪盈眶。"
CPC_TRCW_GNG.10.t: "风轻云淡"
CPC_TRCW_GNG.10.d: "共产党对原广警部队的处理意外地非常宽大——原广东国民族识别为珠人的，一律根据其原籍识别为汉人、壮族或其他民族，对于有意愿参与协助广东治安的，在经严格思想政治教育后给予临时军警身份，听从临委会治安办公室指挥。这给了林巧川莫大的宽慰，横亘在他内心数十年之久的巨大民族鸿沟终得弥合。\n“现在感谢党和人民政府给我改过自新的机会，让我可以重新做人回到人民群众的队伍中来，我将用我的后半生努力忏悔，为广东人民奉献自己。”在写完思想汇报后，林巧川搁笔看向窗外。这种宽松但严肃的生活令他飘忽不定的心绪慢慢安定下来——或许这就是他们所说的解放？\n宿舍门吱呀一声被推开，同为临时军警的舍友李骏走进来，两人寒暄了一番，林巧川转回头唠起家常：“你家还好吗，广州时不时还会挨炸，记得提醒家里人不要外出活动。”\n“刚打过电话，都好着呢，我弟弟都进临委会当日语翻译了。”李骏自豪地笑起来，“你刚写完这周的思想汇报？”\n“嗯……我以前当广警的时候没写过这种东西……还挺别扭的。你不是在华工委听过党课吗，帮我看看写得对不对劲。”林巧川挠挠头，不好意思地笑笑。李骏满意地点点头，大摇大摆走到书桌前摇头晃脑朗读起来，惹得林巧川一阵脸红。\n\n坐在飞往曼谷的红十字会难民专机上，安川良子手撑额头，回想着自己的过去十年——《广东妇人公论》的故事已经结束了，但却在她前三十年人生中留下浓墨重彩的一笔，她想起了刚来广东时见到的那些人：铃木贞一、被解雇的家仆、自己的责任编辑、第一次采访时吵架的老板……还有那时赶来维持治安的林警官，尽管只见过寥寥几面，但这些人里她最有好感的非林警官莫属——这么想着，良子的思绪越飘越远，仿佛还活在六十年代广东的瞬息万变中——那时的他们处在硅晶风暴的中心，稍有扰动也许就会改变历史……但人生只有一次机会，她释然地笑了，心里涌出一股热流，沿着南海向珠江流去。"
CPC_TRCW_GNG.10.o: "“没好好认识他，还蛮遗憾的。”"
CPC_TRCW_GNG_ends_tt: "§Y广东§!的§S“珠人”§!伪文化及§j日本§!文化遗毒将被肃清。\n---------------\n§C致瞬息万变之物，及亘古不变之物。§!\n£GFX_GNG_Guangdong_texticon §S广东§!的故事结束了，但是他们的§S漫漫人生路§!仍在§m继续§!。"
CPC_TRCW_GNG.11.t: "镇压报告"
CPC_TRCW_GNG.11.d: "华南局叶肖：\n我们在韶关、潮州等地的起义行动遇到严重挫折。\n在敌伪核心人物何鸿燊授意下，三合会对我在韶关、潮州等地的华工委联络站发起武装突袭，打死打伤多名华人珠人工友，卢绍武同志于掩护韶关联络员撤离途中受伤，现被秘密送往澳门马万祺处医治。\n根据港澳联络员密报，我们确信何鸿燊接下来将对广州、云浮等地的华工委联络站发动冲击，盼望华南局尽早予以答复。\n韶关华工委-中共联络员：（名字抹去）\n\n批示：三合会黑帮团体是彻底的反动组织，不要畏惧于与之斗争，华南局已联络中央及海南支部，下一批军援将在中央完全控制广西后通过陆路运往粤西、粤北，你部须坚持游击战策略，无论如何要首先确保自身安全，再作抗暴斗争。\n华南局叶剑英\n\n——叶剑英放下笔，左手撑颌拄在桌上深深叹口气：“何鸿燊到底一个黑帮出身，至多不过是盛田李嘉诚等人的打手……”他捻了捻自己布满胡茬的下巴。办公室一旁坐着的马万祺也摇摇头：“心术不正，屠刀居然对准了自己的华人兄弟，叶兄，打算怎么处置他？”\n\n叶剑英摘下眼镜开始揉太阳穴：“死硬分子要么就地击毙，要么活捉收监等待公审。”\n\n马万祺想了想，提出了自己的想法。"
CPC_TRCW_GNG.11.o: "“不如我使一个请君入瓮的计？”"
CPC_TRCW_GNG.12.t: "苦苦哀求"
CPC_TRCW_GNG.12.d: "“……算我求你，哪怕咱们去泰国呢？你非要坐在这里看着我们的心血被共产党糟蹋么，昭夫？”李嘉诚焦急地在盛田昭夫的办公室里来回踱步。\n\n“我不觉得他们会‘糟蹋’。”盛田叹口气，“嘉诚，这十年我们是为广东付出了心血的，我们一直在阻止富士通、松下压榨劳工，我们给穷人盖了房子，我们甚至还……”\n\n“还什么？还要当共产党的俘虏么？”李嘉诚打断他的话，“共产党眼里你就是个资本家，知道以前的苏联怎么对付资本家的么？一颗枪子打进你的脑袋，你有多少申诉留着到阴间去跟你死掉的同僚讲要不要？”\n\n“……我有信心保护广东不被战乱波及，这也是我的责任，我从十五年前流落来广东的时候就发过誓的，嘉诚，我已经无处可去了，我在日本会被立即判处绞刑，是广东给了我一条命，除了广东我哪也不去！”盛田花白的头发一颤一颤，这位手艺人的内心显然也摇摆不定。\n\n李嘉诚已经说不出话来了，他神色复杂地看着这位昔日密友，突然觉得他是如此陌生——也许他们从来就不是一类人，盛田发过誓，要把广东打造为理想主义的热土，但没想到这男人居然愚蠢地甘愿要同广东一块陪葬。\n\n“……恕不奉陪！”咬牙切齿了好一阵，李嘉诚夺门而出，留下了仍然坐在那里微微发抖的盛田昭夫。"
CPC_TRCW_GNG.12.o: "昔日旧友，分道扬镳。"
CPC_TRCW_GNG.13.t: "坐下来谈谈"
CPC_TRCW_GNG.13.d: "“我以为你会请李嘉诚和何鸿燊来的。”盛田推了推自己的玳瑁框眼镜，神色低落地坐在华南局为他准备的秘密会客室里。\n\n“我可没有李嘉诚的消息，前天，他的私宅被华工委冲击，等起义工人们砸开大门后却发现早已人去楼空——那之后我们的人就再没发现过他的踪迹，兴许是跑了。”叶剑英抿了口粗茶，“至于何鸿燊嘛——他入不了我的法眼，有另外的人能治他。”\n\n“所以，”叶剑英似笑非笑地看着盛田昭夫，“盛田先生，你既然能来，就说明你接受我们的条件咯？”\n\n“如果这能让广东复归和平，不受战乱之苦的话。”盛田点点头，“如果我同意投降，你们可不可以……”\n\n叶剑英脸色一沉，打断了他的话：“我记得我们递过来的通牒写明了，是‘无条件投降’。”他刻意加重了最后五个字，“我现在不是在跟你讨价还价，我是在对你发布最后通牒：要么无条件投降，我们和平接收广东，兴许你和其他情系广东的日侨还能获得宽大处理；要么负隅顽抗，我们大军开进广东，你我下次在军事法庭上相见。”\n\n“……即使我已经为广东付出了这么多？”盛田昭夫仍不死心，发出了最后一问。\n\n叶剑英放下茶杯站起身来，居高临下地俯视着盛田——足足十五秒过后，他冷冷地说道："
CPC_TRCW_GNG.13.o: "“付出最多，牺牲最大的是广东人民。\n谈付出，你还不够格，盛田先生。”"
CPC_TRCW_GNG.14.t: "末路狂飙"
CPC_TRCW_GNG.14.d: "泰国，曼谷机场\n李嘉诚从没觉得这么轻松过，哪怕他一度在共荣圈财富最集中的“机遇之地”几乎平步青云将要和行政长官平起平坐，他也从没觉得自己如今天一般踏实。\n广东国曾是李嘉诚的家，他在这里拥有一切，名誉、金钱……可是共产党颠覆了一切。暴乱给李嘉诚带来的只有摧残，他的公司在大火中化为灰烬，住宅遭到暴徒袭击，若不是他早早为妻儿做好打算，只怕骨肉至亲也将阴阳两隔……但他还是放不下那个固执地留在广东试图谈判的旧友。\n“李总，在曼谷的宅子已经腾好了，太太少爷他们已经先过去了。”助手来到他身边，短短一席话语将他从无谓的烦恼中拉出，他点点头，提着手提箱朝专车走去。\n也许李嘉诚在之后的无数个日夜仍会从广东的噩梦中惊醒，但至少此刻，他可以尽情享受曼谷温柔的阳光了。\n\n广东，澳门马万祺私宅\n“不知万叔在此万难之际召唤阿燊前来何事？”何鸿燊隐隐有些不安，他察觉到马万祺在这个节骨眼上叫他来澳门估计没安好心。\n“我以前就在这房子里，请你和嘉诚、昭夫他们吃饭的时候我说但凡你们有困难，只要不是杀人放火的勾当，万叔我不会吐一个‘不’字。”马万祺的声音非常冷淡，“十年过去了，我没想到你，阿燊，你怎么敢向华人同胞举起屠刀？”\n“万叔，事情不是这样的，您……”“住口，澳门的规矩你应该还记得，何鸿燊到澳门，人人能取他性命。”马万祺的声音越来越严厉，“命”字甫一脱口，小屋内赫然闯入一队荷枪实弹的解放军士兵。\n望着黑洞洞的枪口，何鸿燊终于明白自己脱逃无望，仰起头凄然一笑：“……您说的对，阿燊知错了。”"
CPC_TRCW_GNG.14.o: "尘埃落定。"
CPC_TRCW_GNG.15.t: "往事如烟"
CPC_TRCW_GNG.15.d: "解放军的战线越推越远，这就意味着香港这座城市已经暂时远离了前线的血腥厮杀，重新变得安宁祥和起来，盛田昭夫坐在原索尼中环大楼的十五层——他曾经的办公室里，看着恬静温柔的阳光打在地板上，怅然若失——明天这座大厦就要被香港临时委员会征用了，而他本人也被临委会“征用”为特聘顾问，留在香港辅助共产党的接收工作。\n\n门被轻轻推开，盛田看到一个不算特别熟悉的面孔——临委会主任肖向荣，跟在他背后的则是一个年轻男孩。\n“这孩子叫李晞，很聪明，还懂日语，所以我把他找来当当咱俩的翻译——”肖向荣笑了笑朝身后指了指，李晞点点头，正准备开口翻译。\n“没事，我会讲粤语，中国的北方官话我也听得懂。”盛田用纯正的粤语回答道，“肖主任是来视察自己明天的办公室长什么样子么？”\n\n“没，单纯找你聊聊天，一想你指定在这，这不就来了吗——叶剑英同志他们已经被军委调去前线指挥战斗了，我看解放全中国的日子不远啦。”听到“同志”“解放”等字眼的盛田神色有些窘迫：“我还是没理解，你们所说的解放和中国——我说的是中华民国——所说的光复到底有什么区别，在我看来不过都是夺取政权，收复失地……”\n\n“是有这个意思，不过也许还有另外一层意思，您不妨问问这孩子。”肖向荣微笑着指了指一旁端坐的李晞，“李晞，你说，在盛田行政长官的统治下你的生活如何？”\n\n李晞扭捏了半天，怯生生答道：“和其他财阀比起来，索尼的行政长官也许……确实更在乎我们广东的民生……”盛田笑起来：“看来过去十年我的努力没白费。”\n\n“……但是！”李晞的声音大了一些，仿佛要否决这位现任临委会顾问的断言，“您别怪罪，老实说，我觉得没有财阀的广东，我能活得更自由，更有尊严些。”\n\n盛田的笑容僵在了脸上，他呆呆地看着肖向荣和李晞，良久，露出释怀的苦笑。"
CPC_TRCW_GNG.15.o: "大梦终究一场空。"

CPC_TRCW_GNG.21.t: "旁敲侧击"
CPC_TRCW_GNG.21.d: "“中国总领馆的会面请求？”焦头烂额的松下正治此刻正穿行在松下总部大楼的走廊中，赶往下一场警务协调会议，“你告诉宋之光，能不能排到明天……”\n“宋领事说了，他就在会客室等您，您不来他不走。”秘书跟在他后面一路小跑着。松下暗自翻了个白眼，长吁一口气。\n\n糟透了，无论什么地方都糟透了，广东里面被暴民闹了个底朝天，广东外面——见鬼，外面国共大战死了不计其数的人，伤亡数字甚至快能赶上松下在广州的每月营业额了。\n\n夤夜时分，刚从会议室逃出来的松下试探地按下了通往会客室所在楼层的电梯按钮，随着楼层数字的跳动，他开始祈祷宋之光能识趣离开——这样至少自己能毫无心理负担地回家睡个觉。电梯门打开的那一刻，他的希望还是破灭了，会客室灯火通明。\n\n“宋先生，实在不好意思，警务会议开太久了，让您等到这么晚……”他满脸堆着笑走进屋内，而宋之光看来精神焕发，身板笔直地坐在客座沙发上。\n\n“不，这个时候正好，我也是实在有要紧事才甘愿等这么久的。”宋之光回以礼貌的微笑：“长话短说吧，你我都知道现在广东内忧外患——总统刚刚给总领馆下达了撤回高级别使官的命令，中国战事吃紧，共产党接连攻城略地，现在甚至已经将大军压在广东边境了。”松下点点头：“我理解，这是没办法的事……”\n\n宋之光话锋一转：“我是能走的，广东待不住我还能回南京——那您呢，作为广东的行政长官，您能一走了之么？”松下摇摇头：“我相信帝国不会弃我们于不顾……”\n\n“是帝国的松下公司不会弃您不顾。”宋之光冷冷地讽刺道，“多为自己的前途考虑一下吧，松下先生，不要惹来杀身之祸，广东经受不起第二次毁灭了。”\n\n“您的意思是，我应该向共产党投降？”\n\n“我可没这么说，我只是出于多年共事的情谊对你提出一点忠告，那么，告辞。”宋之光拿起外套起身鞠了个躬。"
CPC_TRCW_GNG.21.o: "松下颓然坐在沙发上，思考着宋之光的暗示。"
CPC_TRCW_GNG.22.t: "枕边呢喃"
CPC_TRCW_GNG.22.d: "松下正治久违地回到了自己的宅邸——之所以说是久违，实在是因为这样一个特殊时期，回一趟家要过一遍刀山滚一遍火海，幸子见到自己的丈夫推门进来也吓了一跳，连忙小跑过来替他褪下外套：“街上还安全么，你就这么回来，定期给家里打电话就好了呀。”\n\n“我算是开了眼了，华工委背后绝对有共产党：简易路障、燃烧瓶，你猜猜他们还搞来了什么——”松下正治狠狠朝妻子抱怨，“——他们居然还有我们的实验步枪，鬼知道他们怎么得知军械库位置的。”幸子叹口气，将他搀进卧室：“多的就别说了，先洗个澡然后休息一晚吧。”\n……\n洗完澡的松下显得特别疲惫，任由自己沉重的身躯砸在弹簧床上，然后翻个身长吁短叹。\n\n幸子温暖的手掌抚上他的脊背：“很累吧。”松下沉默不语。\n\n“我其实一直觉得，行政长官的位置由你来做太累了，广东本来就不是一个单纯做生意的地方。”幸子的呢喃仍然萦绕在耳边，“就算我一直在家里料理你的内务，你们在外面干过什么事我多少还是知道一点的……老公，我不喜欢政治，我去和老爸说让我们……”\n\n松下烦躁地摆摆手：“幸子，我很累，让我休息吧。”\n\n闻听此言，松下幸子也不再言语，拍拍丈夫的后背。"
CPC_TRCW_GNG.22.o: "“晚安，正治。”"
CPC_TRCW_GNG.23.t: "雨夜闻铃"
CPC_TRCW_GNG.23.d: "又是一个午夜，闪电带着瓢泼大雨砸在广州城上，仿佛要给这座已经火光冲天的城市降降温。松下正治仍然坐在桌案背后审阅着暴徒的袭击报告，突然一道炸雷劈下，电话铃狂乱作响。\n\n“喂？”正治不耐烦接起了电话，尽管信号奇差，但他还是一耳朵听出来了对方的身份。\n\n“父上大人？您怎么……您不是在大阪吗？本岛现在不是联系不上广东吗？”听见老丈人声音的正治开始慌乱起来。\n“本来我要直接来广东见你和幸子，但所有人都劝我最好不要踏出本岛一步，我想了很久，我的女儿女婿还在广东，我不能不管，所以我借着转移松下资产的事现在到了台湾，再待两天就走——幸子在家里还好么？”\n“很好，广警和宪兵队都在我们的住处重点巡逻，但我很难回去，只好每天往家里打电话……”\n“她好就好。”电话那头的幸之助听上去松了一口气，“……回大阪吧，正治，广东的事情已经不是你一个人，或者我们松下一家会社能解决的问题了。”\n“那松下在广东的资产……”“扔在那不要了，正治，总动员时期你也已经是一个青年了，对那时候是有印象的，这场仗绝不会是国内那些媒体粉饰太平的什么国共内部骚乱，它一定会变成日中战争的延续。”幸之助苍老的声音竟已微微发颤，“松下不只有广东一处利润来源，但我的义子正治和我的女儿幸子却只有一条命。”\n\n“……我明白了，父上大人，但至少在最后，我想为广东尽一点最后的责任。”沉默良久，正治终于在心中做出了自己的选择。\n\n同样沉默良久，电话那头传来幸之助的声音。"
CPC_TRCW_GNG.23.o: "“……都依你，注意安全。”"
CPC_TRCW_GNG.24.t: "别了，松下正治"
CPC_TRCW_GNG.24.d: "这应该是松下正治待在广东的最后一天，他坐在红十字会特别搭建的帐篷里，身旁则是他三十年来的结发妻子——松下幸子，尽管衣衫褴褛，但松下从未觉得自己这样切实地活着。他攥着妻子温润但也已日渐沧桑的手：“开战第一天就提前把墩子她们送回了大阪，现在看来这个决定真是太明智了，不然咱俩这副样子可见不得人……”\n\n幸子报以莞尔一笑：“说什么俏皮话呢……”她撇眼看见了一个陌生男人掀开帐篷帘子走了进来，身后跟着一个年轻女子，“良子小姐！”同是广东贵妇人小圈子里的幸子一眼认出了安川良子，这位年轻的男爵之女戴着白底红十字的臂章。松下正治循声望去，却说出了另一个名字：“叶剑英先生？”\n\n“安川良子现在是广东红十字会的日本籍临时志愿者，我请她来担任我和你们的翻译。”叶剑英边说边比划，“感谢您过去一段时间为拖延日本政府和协助我们和平解放广东做出的努力，松下先生，我今天来是向您道别的——当然，您归国的行程要稍微独特一些，就由良子小姐代我传达吧。”\n\n良子点点头，蹲在松下夫妇面前：“红十字会进入广东协助疏散难民后，每三天会有一架泰航的专机把日侨难民转送到曼谷。”松下看了看叶剑英：“所以说，我们要去曼谷然后等红十字会协调么？”\n\n“不不不，松下先生你们不用那么麻烦。”安川良子急忙摆摆手，“松下幸之助老先生已经在曼谷等候两日了，到达曼谷后，您和夫人明天会立刻坐松下的专机返回本岛。”\n\n幸子投以感激的目光：“那你呢？”\n\n安川良子挠挠头，羞赧地笑笑。"
CPC_TRCW_GNG.24.o: "“我和最后一批难民一块回去。”"

CPC_TRCW_GNG.31.t: "银瓶乍破"
CPC_TRCW_GNG.31.d: "下午五点，时至黄昏。夕阳将广州城上空的乌云染成了凄惨的苍黄。世界万籁俱寂，等待着夜的审判。街道上的喧嚣渐渐消退，暮色无声地诉说着城的污秽与肮脏。\n\n我厌恶黄昏，畏惧黄昏。黄昏是太阳的垂死挣扎，是走上末路时的悲歌。在地平线吞噬太阳之前，城的万丈高楼便吞噬了它的遗言，投下巨大的阴影，遮掩一切，沉默一切。一切朽坏的、陈腐的根基欢快地嚼食着黑暗的养分。黄昏是白昼生命的结束，是积聚了一切悲伤与绝望，银瓶乍破之际不堪的爆发，它唤道：“人们，看哪，你称颂的光天化日，又有几分用呢？你既造楼阁遮掩它，夜亦将它取代。”荒凉而冷漠的城市舞台上，人之丑态便尽显了，欲逃避却无处，欲挽回则不得。\n\n我恐惧我不能例外于人，我使人镇压人，使人围捕人，使人杀害人，却不能使人超脱人，不能使人——使我，使“他们”，各得其所。深植于广东的腐朽是人，是富士通，是我，广东行政长官井深大。\n\n我取出钢笔，在失败的、耻辱的印记上，涂上了自己的符号。\n\n落地窗外蓦地下起了瓢泼的大雨，那一瞬，象牙白和宝石蓝的霓虹灯照亮了广东的心脏。"
CPC_TRCW_GNG.31.o: "警务报告：镇压行动失败\n行政长官签名：井深大"
CPC_TRCW_GNG.32.t: "迷途之问"
CPC_TRCW_GNG.32.d: "雨过天晴，遍地经风吹雨打的纷纷落叶，总算见到了一缕阳光。高岛益郎伫立在广州神社静谧的庭院中，呼吸着浸润过雨水、没有工业烟雾的清新空气。高岛是广东神社唯一的常客。此地本就极少有人光顾，自从广东暴乱以来，更是人迹罕至。据他所知，只有一两位被石油危机坏了生意的中小企业主，灰头土脸地来参拜过——这是神社的神主说的，现在他也携同家眷逃回本岛了。\n\n但这对他而言并无什么影响。神社无人打扫，那他这位闲人便代劳好了。库房的门锁不知被什么人拆了去，其中空空荡荡，好在一条既不值钱也不方便携带的长扫把，尚未得到谁的青睐。高岛顺手拿起扫把，仔细扫起庭院边角的叶片。扫把从容而轻盈地拂过雨水未干的地面，沾起了几片落叶，但更多的落叶听话地随扫把的摆动聚拢成堆。不知过了多久，他舒一口气，把扫把放回库房。晴朗的阳光中，无人的本殿在澄澈的天空下，平添了几分庄严的气息。\n\n背后的脚步声清晰可辨，可高岛并不需要确认来者的身份——他的心里早已有了答案。\n\n“井深行政长官，”觉察到缓慢沉重的脚步声越来越近，他缓缓开口道，“既然踏进了这座衰败中的神社，我想你的来意已经不言自明了。但我想问你，”高岛仰面叹息道，“你的归宿在哪里呢？换句话说，你的传道之旅，终点在哪里呢？”\n\n井深大望着高岛益郎的背影，握紧了口袋中的十字架——话刚到嘴边，却又说不出口。他想起了远在本岛、被一场高烧夺去智慧的多惠子，启示他以广东这片卓异之地启蒙人间。他一手塑造了这座工程师乐园，为众生揭示通往启蒙的道路。他愿借贝希摩斯之力，净化他哺育的丑陋的、扭曲的利维坦。\n\n“不必回答了。寻求神道的慰藉，的确需要拜托来自本岛的神主们。但这里的神社已经被广州的东道主们掏了个空，终点究竟定在何处，决定权已经不在我们手上了。”高岛转身走来，与井深擦肩而过。在越过倒塌的鸟居，消失在远处之前，他留下了最后一句话："
CPC_TRCW_GNG.32.o: "“珍惜追寻答案的时间吧。”"
CPC_TRCW_GNG.33.t: "救命稻草"
CPC_TRCW_GNG.33.d: "发生了什么？\n到底他妈发生了什么？\n\n帝国陆军中将、广东驻军司令永野茂门很不高兴，一点都不高兴。那帮无法无天的蠢货，华人和“珠人”沆瀣一气，趁共党死灰复燃之际在广东各地发动暴乱。又一份关于华人反政府暴乱的报告摆到了他的案头，永野勃然大怒，决定亲自过问坐在行政长官办公室里的那个榆木脑袋。\n\n电话那头传来了机械的自动回复声。\n“感谢您致电广东行政长官阁下的办公室，很抱歉，行政长官暂时无法接受您的——”挂断，拨号，再次拨打。\n“感谢您致电广东行政长官阁下的办公室，很抱歉——”挂断，拨号，再次拨打。\n“感谢您致电——”挂断，拨号，再次拨打。\n“感谢您致电广东行政长官阁下——”\n\n永野砰地把电话往桌子上一摔，又把帽子扔到了墙上。就这样了，不仅失去了和本岛的联系，就连那混蛋也死性不改，宁愿自欺欺人地一躲了之，也不敢面对自己留下的烂摊子——\n\n电话铃声大作。永野回过头来，不可思议地盯着桌上的电话——难道是本岛终于设法和他取得联系了？他不无期待地拿起了电话，倾盆的暴雨敲打着广东驻军司令的玻璃窗，与电话的杂音凑成了一段奇异的白噪音交响乐。“我是永野中将。”"
CPC_TRCW_GNG.33.o: "我是井深，希望和驻军方面商讨军事管制事宜。"
CPC_TRCW_GNG.34.t: "审判日"
CPC_TRCW_GNG.34.d: "“……现在本法庭允许被告人做最后陈述。”赵廷枫冷冷看着穿着囚服的井深大，而后者此刻却举起了右手在胸前比划着十字：“曾经我想创造一个地方，一个人们为他们无法想象之物奋斗努力的地方，我希望我能为这片土地上的人民做出更多贡献，我希望他们能用毅力、智慧和决心建设未来，而那正是我试图培养，而自己却没有展现的，但现实终究没有给我这个机会，我的故事已经完结了，只等诸位宣判我这迷途之人最后的命运。”\n“你的陈述已经完毕了么？”\n“是的，请宣判吧，法官先生。”\n\n赵廷枫点点头，百感交集——十年前他在呼和浩特审判蒙疆战俘，如今他在广州审判广东财阀，真是恍如隔世——他深吸一口气，思绪重新落回现实。\n\n“全体起立，现在宣读判决。”赵廷枫庄严的声音回荡在这间临时法庭中。\n\n“本法庭认为，被告人井深大犯罪事实清楚，证据确凿充分，依据《国防阵线军事法庭宪章》管辖权与总则部分第三、第四、第七条之规定，现在宣读判决如下：\n\n一、罪犯井深大犯战争罪、反人道罪、危害和平罪，数罪并罚，决定判处死刑，缓期两年执行，剥夺政治权利终身。根据《国防阵线军事法庭宪章》刑诉部分第四条之规定，罪犯井深大不得减刑、假释。\n二、收缴日本富士通公司在广东所有产业，收缴被告人井深大任伪‘广东国行政长官’期间非法盈利所得所有利润。\n\n如不服本判决，可在接到判决书的第二日起十四日内，通过本法庭或者直接向国防阵线临时最高人民法院提出上诉。”"
CPC_TRCW_GNG.34.o: "井深大低垂着头，一语不发。"

CPC_TRCW_GNG.41.t: "港岛阴谋"
CPC_TRCW_GNG.41.d: "平日里，比起去面见本岛的代表，驹井健一郎更喜欢留在自己的办公室。只需要一瓶清酒，他就能在行政长官办公室闲坐一天。如今暴乱四起，他更是有充分理由闭门不出了——因祸得福，由于广东对外联系渠道被基本切断，他反而在行政事务上有了充分的决断权。他抿一口清甜的酒液，拿起平日里给他过种种压力的电话，拨通了一个号码。\n\n“永野茂门中将，我是驹井。你们那边情况如何？”\n\n“军人的意见非常大，暴乱的新闻一天比一天严重，媒体上刊载的混乱场面激起了许多人的愤慨。”\n\n愤慨吗？是谁在愤慨？驹井自然清楚永野想要什么。愤慨一词，与其说是对于暴乱，毋宁说是由广东企业统制的现状而生。将帝国军队交给一众企业支使的，是本岛的大东亚省和大本营，而高岛益郎只是他们的传声筒而已。如今广东已和本岛失去联系，军部显然不会配合行政长官太长时间。\n\n他思忖片刻，决定趁永野尚且愿意和自己这位行政长官配合行动的现在，满足他一个愿望。他相信自己的智慧足以把握这名年轻的将官，在他行为出格之前设法让他收手，以免覆水难收。"
CPC_TRCW_GNG.41.o: "“中将，我希望请军部镇压暴乱。”"
CPC_TRCW_GNG.42.t: "密令"
CPC_TRCW_GNG.42.d: "华南局特派员宋之光同志：\n\n近日广港澳形势严峻，伪广行政长官驹井健一郎已经授权日帝驻广陆军武官中将永野茂门指挥其师团镇压广港澳三地起义，白区地下党同志已破获大量密电证实，日本驻广陆军正在推动对民国驻广“总领馆”之调查，由于你身份特殊随时有可能暴露，中央特令你立即在华南局华工委相关同志协助下转移至四川后方。\n\n不必担心家属安全问题，华南局前日已经将你的家属成功护送至贵州，预计两日后即可到达成都。\n\n敌人调查进展极快，三日内请务必销毁包括本信件在内的所有敏感资料，将有一辆日产汽车于三日后停靠在总领馆南门左起第三根灯柱处，太阳落山时华南局将组织华工委、广工联起义工人围攻总领馆，届时我方特派员将伪装成工作人员与你接触并护送你秘密离开，你的问询口令是：外面的华工委怎么样了。我方特派员的回答口令是：不甚乐观，请立即撤离。请确认口令后再听从指引，若对接者口令不符且执意要带您离开，请坚持留在总领馆，否则有可能陷入敌人圈套！"
CPC_TRCW_GNG.42.o: "中央军委，[?global.date.GetDateStringNoHourLong]"
CPC_TRCW_GNG.43.t: "粤西作战日记"
CPC_TRCW_GNG.43.d: "[?global.date.GetDateStringNoHourLong]，阴\n广东敌军的补给日益困难，在主要海运港口被封锁的情况下，日帝改用空投作为主要补给手段，但从空中向广东前线投放物资并非易事。粤西多山多雾，能见度差，合适的空投场极小，由于我军高炮已在粤西上空组成拦阻火网，敌机不敢低飞，无法精确投下物资，高空投掷的物资甚至有一部分降落到我军阵地上。投到敌军阵地的物资，在我华南局联合华工委、广工联调度下，大部被我炮火摧毁。据情报部门测算，每日空投运抵粤西的补给品只相当于过去正常条件下补给量的5.5%，日伪只能躲在坑道碉堡中靠储备品度日。据华南局报告，敌指挥官永野茂门等视华工委、广工联等起义轻步兵队伍为眼中钉肉中刺，欲必除之而后快，每日入夜后，均有小股敌步兵不顾我炮火拦阻，决意与我华工委内应队伍发生激战，目前华工委粤西地区各武装分队汇报伤亡共411人，根据情报，敌在我炮火打击和情报配合下已有超过3000人伤亡。"
CPC_TRCW_GNG.43.o: "前线炮火，激战正酣。"
CPC_TRCW_GNG.44.t: "火光冲天"
CPC_TRCW_GNG.44.d: "哪怕已经身着崭新的七一式军装，手持从仓库缴获的各类公司实验武器在街头巡逻，李骏仍然对这样的新生活感到梦幻——驹井的罪恶帝国毁灭了，而且是被那个共产党毁灭的？他至今不敢相信这一事实，他的灵魂已经快在驹井的血汗地狱中糜烂了，直到华工委带着他走出工厂；然后是共产党的华南局，他看到了那个宪兵队张贴了十五年通缉令也没能抓住的叶剑英本尊，他和共产党的其他人开始教华工委怎么组织工人武装起义，怎么对抗强权；再然后解放军来了，他作为华工委广东积极分子被特招入解放军驻广部队，参与广东的善后处理工作……\n\n广州的军管还未结束，巡逻队转过街角，眼尖的侦查哨兵已经发现一辆其貌不扬的日产汽车正歪歪扭扭在一片狼藉的街道上向他们奔来——或许是司机也看清楚了这路上居然有巡逻队，那辆日产急刹甩尾，在离巡逻队五十米的地方撞上了消防栓。\n\n李骏大手一挥，所有人立即进入战斗状态，所有人凝神屏息等待着车门打开——一个七十来岁的老头跌跌撞撞从车中滚出，“是驹井！”眼尖的哨兵立刻大声吼道。\n\n听见“驹井”二字，李骏仿佛失了神一样：他十年的悲惨生活皆因广东国，皆因驹井健一郎和他的满洲企业而起，原本山清水秀的广东也因日立的到来而变得枯萎糜烂……\n\n所有人都惊讶地看着李骏一跃而起抢过身边人手中的日立实验火箭筒，单膝跪地瞄准了望着他愣神的驹井健一郎。"
CPC_TRCW_GNG.44.o: "愿那无明业火灼烧他的罪恶灵魂，直至地狱毁灭。"

