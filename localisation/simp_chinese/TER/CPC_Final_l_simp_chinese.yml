l_simp_chinese:
CPC_have_an_anchor_to_windward: "未雨绸缪"
CPC_have_an_anchor_to_windward_desc: "九大上周总理突然病倒犹如一记警钟震撼了党内所有老同志——似乎时间已不再眷顾他们，衰老和疾病正如凶潮般向这个已建立快五十年的共产党袭来。\n\n各大办公室已经开足马力运转起来，准备迎接即将到来的政治风暴。"
CPC_visit_the_patient: "探望病号"
CPC_visit_the_patient_desc: "值此敏感时期，书记处书记邓小平同志应邀前往探望周总理。"
CPC_large_scale_retirement: "大清退"
CPC_large_scale_retirement_desc: "党内的老一代革命家可能已不再适合继续承担重大的工作任务，周恩来同志提出，要为党内高层制定一个清晰的领导交接和退休机制，确保在需要时能够平稳地完成权力交接，避免因老一代领导身体原因导致的突发事件给党和阵线带来动荡。"
CPC_empty_monarch_in_the_party: "党内“虚君”"
CPC_empty_monarch_in_the_party_desc: "退休运动中的焦点无疑是阵线主席的人选——这次，毛泽东同志与刘少奇同志将双双卸下国家领导人职务，不再参与阵线主席竞选。鉴于二人在革命中的特殊功绩及全党共同愿望，毛泽东同志和刘少奇同志将继续保留党内职务。"
CPC_the_abler_the_busier: "能者多劳"
CPC_the_abler_the_busier_desc: "为了确保党的领导班子能够持续稳定地进行更新，必须加强对年轻领导人才的培养。这涉及到选拔、培训和考察，确保他们具备领导国家的能力和素质。而随着新的领导班子的形成，党内可能会出现不同的派系和观点。如何处理这些内部矛盾，确保党的团结和稳定，是非常关键的。"
CPC_veteran_retirement: "老将卸甲"
CPC_veteran_retirement_desc: "解放军作为中国共产党的武装部队，面临的问题也同样重要。指挥系统中如彭德怀、贺龙等老将都已年逾古稀。如何平稳地进行权力交接、如何确保军队的战斗力和忠诚度，都是必须面对和解决的问题。"
CPC_not_to_be_made_a_precedent: "下不为例"
CPC_not_to_be_made_a_precedent_desc: "解放军还肩负着解放全中国的远大任务，在我军战略指挥层面，要达成这一任务所需的精力及脑力已非几位老将力所能及，必须确保我军的大脑年富力强而不至于老迈昏聩；不过，在战术指挥层面，我们可以同时保留一些资历较老的中低层指挥官，并加强对年轻领导人才的培养，这对保持军队战斗力大有裨益。"
CPC_not_to_be_made_a_precedent_tt: "为响应中央号召，年龄过大的高级军事指挥官将会§Y退役§!，我们的指挥系统将迎来§Y新的指战员§!。\n遵从§m刘少奇§!同志意见，名单预定人员§Y全部退役§!。"
CPC_back_door_deal: "开个后门"
CPC_back_door_deal_desc: "过快清退老将对于平滑交接权力不利，在此时期，有必要考虑平稳地进行权力的交接。平稳的权力交接可以确保军队指挥链的连续性，避免突然的政策转变给军队战斗力带来冲击。"
CPC_back_door_deal_tt: "为响应中央号召，年龄过大的高级军事指挥官将§Y退役§!，我们的指挥系统将迎来§Y新的指战员§!。\n遵从§G林彪§!同志指示，指挥系统将保留部分老将以§Y完成平滑交接§!。"
CPC_new_blood: "新鲜血液"
CPC_new_blood_desc: "培养年轻领导力量要从整个社会的大背景入手，从最基层的学校、企业、社区开始，鼓励年轻人参与社会服务、志愿活动和公共事务管理，使他们在实际环境中锻炼领导能力。这样的经历不仅可以培养他们的组织、协调和决策能力，还可以增强他们对社会的责任感和对公共利益的关心。\n\n同时，年轻领导的培养也需要在党和阵线的各个级别和部门中进行。这涉及到为他们提供更多的机会，让他们参与重大项目的决策和执行，或者让他们负责某一领域的工作。在这一过程中，他们可以在实际工作中积累经验、面对挑战和解决问题。"
CPC_expand_party_school: "扩大党校招生"
CPC_expand_party_school_desc: "作为党培训其干部和领导力量的主要机构，党校是年轻干部学习马克思列宁主义毛泽东思想的最佳基地。扩大党校招生可以为党和阵线培养更多的年轻干部，确保他们具备党的基本理论知识、实践经验和阶级觉悟，为党和阵线的长远发展做出贡献。"
CPC_choose_a_principal: "选个校长"
CPC_choose_a_principal_desc: "党校扩招的政策收到了社会各界的广泛好评，但扩大的党校组织必然意味着领导班子的全面更换。\n\n现在亟需挑选一位政治可靠，对党忠诚，组织才干出众的同志出任中央党校校长一职。"
CPC_where_to_go: "毕业去向"
CPC_where_to_go_desc: "毕业安置问题是一个需要综合考虑的问题，涉及到党和阵线的整体人才战略、各级部门的需求和能力、以及毕业生的期望和兴趣。恰当的政策和机制有助于确保党校毕业生得到合适的岗位，为党和阵线的发展做出贡献。"
CPC_rural_democracy: "农村民主改革"
CPC_rural_democracy_desc: "周扬同志在九大上作的讲话指出，阵线建设时期遗留下来的中基层干部专擅弄权的作风愈发严重，广大劳动群众的意见反馈渠道被故意堵塞，许多大队书记“地头蛇”思维严重，不仅对人民群众冷漠无情，甚至暗中贿赂、有的甚至对抗监视中央派到基层的调研员。\n\n周扬同志报告建议，要立即刹住这股“专制”风，坚持以马克思列宁主义毛泽东思想为指导，发扬无产阶级民主精神，开展农村基层民主改革运动。"
CPC_Zhang_plan: "张春桥计划"
CPC_Zhang_plan_desc: "我们的人民早已不是愚昧无知的模样。三十年革命风浪的锤炼使人民空前地成熟起来，他们完全有自我管理的能力与欲望，根本不需要谁来当教书先生。我们要做的就是除去人民思想上的枷锁，让他们把自己最真实的想法说出来。 "
CPC_liberate_poor_people: "解放穷队"
CPC_liberate_poor_people_desc: "在过去，党的工作依赖贫下农开展；今天，我们的民主改革工作依然要依赖他们。阶级分化每时每刻都在发生，在同一个大队里也会有最困难的一两个生产队，所谓穷则思变，他们必然有些真知灼见。"
CPC_disclosure_conference: "揭发大会"
CPC_disclosure_conference_desc: "一两个坏分子不可能永远蒙蔽所有人，群众把种种劣迹看在眼里，记在心里，只要有第一个人敢站出来揭发，不愁挖不了坏分子的黑老底。土地革命与反右运动中群众揭发活动的胜利珠玉在前，我们应当立刻发动揭发大会。"
CPC_able_to_act: "敢说敢上"
CPC_able_to_act_desc: "革命斗争只靠上下嘴皮子碰一碰，是不能够取得胜利的。被坏分子欺压的群众不仅要站起来揭发，更要行动起来，把这些坏分子彻底打倒，取缔他们的公职，把他们送去劳动改造，并由群众自己的意志建立起新的领导班子。"
CPC_Han_plan: "韩光计划"
CPC_Han_plan_desc: "一个负责任的家长不会强迫自己的婴儿奔跑。中国的社会受封建专制荼毒太深，民主制度没有一蹴而就的可能，在我们的人民具备相应的能力之前，党必须小心地牵着他们的手往前走，以免这些懵懂的新生儿被突然的风雨摧折。"
CPC_clean_the_grass_roots: "整肃基层"
CPC_clean_the_grass_roots_desc: "不完善的述职问责机制迄今已造成了很多恶果，有时闹到群众上访、专员巡视的地步，才能摸清深藏不露的恶政。这种头痛医头，脚痛医脚的怠惰态度很不应该，我们要立刻行动起来，强制基层干部向督导组述职，并对工作不力者问责。"
CPC_audience_and_guidance: "旁听与指导"
CPC_audience_and_guidance_desc: "一部分干部有种不正确的认识，觉得自己在干校、党校里已经把一辈子的课都上完了，从此以后再也毋须学习——真是大错特错。共产党员自我磨砺的脚步是永远不能停下的，补习的第一课就是坐在督导组的身边，看看别人怎样处理好他们的日常工作。 "
CPC_high_quality_decisions: "高质量决策"
CPC_high_quality_decisions_desc: "要明确一个认识：我们的农业地区发展得不好，并不是受到任何客观条件的制约，而是治理的问题。自由散漫是基层行政队伍的通病，推诿扯皮，能拖则拖，把生产队的决策会议开成了联欢闲聊，这种情况应被抑制，而以高质量的决策活动取代之。"
CPC_master_of_balance: "端水大师"
CPC_master_of_balance_desc: "基层民主改革从来不单单只是基层的事情，作为基层民主改革的倡议者，党在这场运动中固然不是所谓“超然”的裁判者，但也必须以极高的政治智慧平衡和引导民主改革运动的良性发展，使之真正达到目标。"
CPC_principal_of_democracy: "民主原则"
CPC_principal_of_democracy_desc: "不用多说，基层民主改革运动的关键词就是民主，要充分发挥党内党外民主，充分发动群众，广增言路，集思广益。最好能让某些作风强硬的干部红红脸、出出汗——提升治理水平，第一要务便是尊重人民意愿。"
CPC_principal_of_organization: "组织原则"
CPC_principal_of_organization_desc: "如何区分是非黑白，言论自由的界限，以及批评的范围，这就需要我们在法律与纪律的原则上建立，倘若民主变成无组织的民意盲动，那就意味着失败——"
CPC_more_important_thing: "更重要的事"
CPC_more_important_thing_desc: "农村民主改革已在制度和动员两个方面取得了较为显著的成果，现在应当逐渐将这场有意发起的运动转变为常态存在的制度，全党全阵线的工作重心要尽快从基层民主改革转移到备战备荒，准备解放山西的工作上来。"
CPC_all_honor_to_you: "“多亏了我”"
CPC_all_honor_to_you_desc: "农村民主改革运动是马克思列宁主义毛泽东思想的最新实践成果，以极大的政治智慧与极大的政治决心丰富了毛泽东思想的精神内涵，通过本次运动，相信全党全军全国各族人民将更加紧密团结在毛主席党中央周围，奋力朝社会主义民主的远大目标跃进！"
CPC_all_honor_to_us: "“大家的功劳”"
CPC_all_honor_to_us_desc: "社会主义民主的远大目标绝非仅凭主观热情就可达成的，在实践过程中，我们要时刻牢记“从人民中来，到人民中去”的谆谆教诲，只有群众和我们党心连心，只有群众敢于且善于对党和政府的工作提出意见建议，这场运动才算为社会主义民主的远大目标夯实了基础。"
CPC_shanxi_liberate_plan: "山西计划"
CPC_shanxi_liberate_plan_desc: "亚革盟的成立迫使日本帝国主义与南京伪政权加快了对西北的干涉脚步，我们与敌人的全面战争已经近在咫尺；目前阵线内部问题已经告一段落，必须在决战来临前夕研究我方下一步的行动计划了。"
CPC_covert_contact: "暗中接洽"
CPC_covert_contact_desc: "抗战末期我们于撤军途中在山西留下了很多根据地的火种，现在这些根据地的老同志借助混乱的局势逐渐恢复与我们的联络，我们将派遣干部建立与他们的联系渠道，在即将展开的山西计划中发挥重大作用。"
CPC_new_special_force: "新概念：特种部队"
CPC_new_special_force_desc: "在军改过程中，我军逐渐接触和了解了特种部队的概念，其队员素质要求高，肩负任务重大，我们将立即推进全军特种部队训练与组建任务，为解放山西、解放全国做好准备。"
CPC_Yellow_river_army: "黄河军"
CPC_Yellow_river_army_desc: "黄河军，是阵线特种作战部队体系的一部分，他们擅长进行跨河作战，在山西计划中他们将负责武装泅渡，迅速占领黄河东岸，扫清障碍并建立前进据点。"
CPC_Yellow_river_army_tt: "§Y军事改革§!追加效果：\n特种攻击§G+15%§!"
CPC_increase_conscription: "加额加量"
CPC_increase_conscription_desc: "仅靠现有的特种部队是不足的，我们需要更多，更优质的军人加入来保障计划的顺利推进。"
CPC_increase_conscription_tt: "§Y军事改革§!追加效果：\n特种部队营上限§G+25§!"
CPC_mountain_special_army: "山岳军"
CPC_mountain_special_army_desc: "山岳军，是阵线特种作战部队体系的一部分，他们擅长进行渗透作战，在山西计划中他们将负责作为先锋潜入晋西山地，瓦解山西的堡垒体系。"
CPC_mountain_special_army_tt: "§Y军事改革§!追加效果：\n特种防御§G+15%§!"
CPC_TRCW_phase_2_left_1_tt: "§Y军事改革§!追加效果：\n陆军组织度恢复§G+5%§!"
CPC_TRCW_phase_2_left_2_tt: "§Y军事改革§!追加效果：\n陆军组织度§G+5%§!"
CPC_force_to_go_through_the_Yellow_river: "强渡黄河"
CPC_force_to_go_through_the_Yellow_river_desc: "对山西的前期渗透对抗行动已经展开，务必在国民党反动派觉察之前尽速扫清黄河东岸的碉堡阻拦，为后续大部队进攻创造有利条件！"
CPC_force_to_go_through_the_Yellow_river_tt: "当完成§G本国策§!的所有§Y前置国策§!，且已进入§Y1970年下半年§!时，军委将自行采取§Y进一步行动§!，§R您无需操作。§!"
CPC_the_time_has_come: "国际国内时机§Y一旦成熟§!，军委将自行采取§Y进一步行动§!。\n§R您无需操作。§!"
CPC_Yu_Gong_move_the_mountain: "§x愚公移山§!"
CPC_Yu_Gong_move_the_mountain_desc: "愚公移山的故事家喻户晓，现在也有两座压在中国人民头上的大山，一座叫做帝国主义，一座叫做封建主义。中国共产党早就下了决心，要挖掉这两座山。我们一定要坚持下去，一定要不断地工作，我们也会感动上帝的。这个上帝不是别人，就是全中国的人民大众。全国人民大众一齐起来和我们一道挖这两座山，有什么挖不平呢？"
CPC_fragile_silicon_dream: "硅晶易碎"
CPC_fragile_silicon_dream_desc: "广东国，这一丑陋的殖民地，所谓的“共荣圈附属企业国”，终于迎来了它自诞生之日起就未曾得见的风暴——亚洲人民解放战争。\n我们的态度则很明确，广东伪政府只有一条道路——无条件投降。"
CPC_press_the_button: "按下按钮"
CPC_press_the_button_desc: "我们已经策动华南局在广东发动了几乎瘫痪其行政机构的工人暴动，从华南局传回的情报看，伪广政府正疲于维持治安和镇压工人起义——当然，我们不介意再给这革命的烈火添一把油。"
CPC_go_fuck_GNG: "单刀直入"
CPC_go_fuck_GNG_desc: "根据华南局传回的情报及建议，最好不要对目前广东的政府高层抱有任何幻想，必须做好和平解放广东愿景破裂的准备，华南局将继续通过情报网络监视伪广政府动向，一旦形势有变，解放军必须即刻入境作战控制广港澳。"
CPC_go_fuck_GNG_tt: "£CPC_texticon §G中国共产党华南局§!将发挥敌后作用，暂时破坏敌人同£GNG_japanese_frustration_texticon §j日本陆军§!的通讯，除§Y广港澳§!外其余地区将转为§R非军事化地区§!。\n\n但敌人很快会发现我们的破坏行动并召唤£GNG_japanese_frustration_texticon §j日本陆军§!登陆，一旦如此，我们将直面§R远比广警部队难缠的对手§!。"
CPC_talk_with_GNG: "刚柔并济"
CPC_talk_with_GNG_desc: "根据华南局传回的情报及建议，我们发现广东政府高层的抵抗意愿并不高——与其为了追随日本而把广东付于一炬，他们似乎更倾向于保护广东的完整与和平——无论是出于慈悲心或单纯只是为了保护公司资产，这种倾向与我们和平解放广东的愿景不谋而合。\n但我们仍应当做好和谈与武力统一的两手准备，压境大军同样能给他们造成心理压力。"
CPC_talk_with_GNG_tt: "£CPC_texticon §G中国共产党华南局§!将发挥敌后作用，暂时破坏敌人同£GNG_japanese_frustration_texticon §j日本§!的通讯，并派出地下党同志作为谈判代表同§Y行政长官及其智囊团§!斡旋，除§Y广港澳§!外其余地区将转为§R非军事化地区§!。\n\n£GNG_japanese_frustration_texticon §j日本驻广陆军§!正全力尝试恢复同本岛联络，一旦他们成功召唤£GNG_japanese_frustration_texticon §j日本陆军§!登陆，我们将不得不放弃之前的一切努力，并直面§R远比广警部队难缠的对手§!。"
CPC_SONY_our_dream: "我们的梦"
CPC_SONY_our_dream_desc: "从华南局提供的情报来看，广东经济政治大权目前掌握在盛田昭夫的索尼与李嘉诚的长江实业手中，与其他只知肆意压榨广东工人的财阀不同，索尼长实治理广东本地的方式似乎还较为“人道”，是可以接触和谈的对象——当然，我们的要求不会有任何变化，广东伪政府只有一条道路：无条件投降。"
CPC_Matsushita_folly_to_be_wise: "难得糊涂"
CPC_Matsushita_folly_to_be_wise_desc: "从华南局提供的情报来看，广东经济政治大权目前掌握在松下正治的松下手中，这家电器公司展现了最经典的资本主义社会商业公司的本性：自私与逐利。\n不过这种自私并非坏事，至少这种商业公司不会愿意为了日本所谓的“大东亚圣战”就高举战旗纵入火海，故此，松下可以是我们的接触和谈对象——当然，我们的要求不会有任何变化，广东伪政府只有一条道路：无条件投降。"
CPC_Fujitsu_world_of_glass: "琉璃世界"
CPC_Fujitsu_world_of_glass_desc: "从华南局提供的情报来看，广东经济政治大权目前掌握在井深大的富士通手中，井深大并非是个单纯的资本家，他还试图用硅晶芯片与社会达尔文主义改造广东，且手腕强硬固执。\n我们可以派出代表接触井深大，但或许会打草惊蛇，因此，必须做好武力解放广东的准备。"
CPC_Hitachi_forest_of_steel: "钢铁森林"
CPC_Hitachi_forest_of_steel_desc: "从华南局提供的情报来看，广东经济政治大权目前掌握在驹井健一郎的日立手中，驹井对广东犯下的罪行罄竹难书，将广东变成了和满洲相差无几的血汗地狱，且同日本军队的法西斯军国主义者们过从甚密，我们必须放弃和平解放广东的幻想，抓紧战备，尽快解放广东。"
CPC_make_a_fuss_in_LegCo: "大闹立法会"
CPC_make_a_fuss_in_LegCo_desc: "按照约定，行政长官已经将我们的解散广警部队、要求广东无条件投降的文书递交至立法会，可以预见这份要求将激起立法会的滔天巨浪——但这与我们无关，这份要求对广东而言并非什么需要审议的条例法案，而是我们解放广东的通知。"
CPC_turn_hostility_into_friendship: "干戈玉帛"
CPC_turn_hostility_into_friendship_desc: "华南局已经协助广东政府依照约定解散了其所有军警部队，但此举已经完全激怒了日本驻广陆军，军委指示，必须以最快速度接管广东，做好岸防工作防止日本援军登陆，并集中优势兵力彻底歼灭日帝驻广“凰”机械化师团。"
CPC_life_is_not_satisfactory: "人生不如意"
CPC_life_is_not_satisfactory_desc: "大军压境的恐慌已经蔓延到全广东，从华南局的情报看，各大财阀已纷纷向日本国内或共荣圈其他国家转移资产，日本驻广陆军已经获得东京授权开始指挥部队在前线修筑工事——我们必须尽快组织部队准备解放广东，以免造成更多人员伤亡与经济损失。"
CPC_good_bye_silicon_dream: "后会无期"
CPC_good_bye_silicon_dream_desc: "全体解放军战士们，解放广东的战斗即将打响，资本家财阀趴在广东人民头上敲骨吸髓已有二十年之久，广东人民渴望解放和自由！我们必须以文明之师威武之师的姿态向广州、香港、澳门进发！彻底消灭日本帝国主义在广东的余孽！"
CPC_TRCW_phase_1: "国防总动员令"
CPC_TRCW_phase_1_desc: "解放山西的战斗终于引起了国民党反动派的全面反扑，第三次国内革命战争事实上已全面爆发，现在我们必须立刻动员全国人民乃至全亚革盟人民，一起起来抵抗日本帝国主义及其傀儡的暴行！"
CPC_TRCW_phase_1_1: "军事机构改组条例"
CPC_TRCW_phase_1_1_desc: "为应对全面战争需要，军委将立即改组成立以林彪同志为书记的南下前敌委员会，和以徐向前同志为书记的北上前敌委员会，总揽南北两方面作战事宜。同时，邓小平、薄一波、习仲勋、王任重、任仲夷、李先念、罗青长等同志将组成中央前敌委员会，邓小平任书记，以统筹兼顾各个战线的指挥行动。"
CPC_TRCW_phase_1_left: "经济管制条例"
CPC_TRCW_phase_1_left_desc: "战争已经爆发，根据地必须尽快转轨经济体制以适应战争需求。"
CPC_TRCW_phase_1_left_1: "供养战争"
CPC_TRCW_phase_1_left_1_desc: "前线军事物资需求缺口庞大，必须尽快责令根据地工厂改产军服子弹枪械等前线急缺物资，暂时牺牲后方消费需求。"
CPC_TRCW_phase_1_left_2: "杜绝饥饿"
CPC_TRCW_phase_1_left_2_desc: "再苦再难，不要把根据地的老百姓当做牺牲品，十年前根据地遭受饥荒的教训犹在眼前，我们不应也不能再重蹈覆辙。"
CPC_TRCW_phase_1_medium: "紧急征兵条例"
CPC_TRCW_phase_1_medium_desc: "前线战况激烈，很多部队已经开始出现战斗减员、战力减弱的问题，必须立即制订相关征兵条例以确保后备兵源充足，以免拖累解放进程。"
CPC_TRCW_phase_1_medium_1: "排满名单"
CPC_TRCW_phase_1_medium_1_desc: "我们的后备人力远远不如东部伪民国政府，但我们在动员后方方面有巨大先发优势，必须打好这一时间差，多快好省地完成既定扩充征兵的任务，在伪民国扩充军备完成前先一步解放人口稠密的华中华南地区。"
CPC_TRCW_phase_1_medium_2: "执行缓征"
CPC_TRCW_phase_1_medium_2_desc: "我们是一个已经拥有一亿人口的革命政权，后备人力充足，无需过分强调征兵困难，保持学生缓征的政策不会变，在校学生是我们未来继续进行革命建设工作的新鲜血液，不到万不得已不应强行扩征。"
CPC_TRCW_phase_1_right: "亚洲集体防卫协定"
CPC_TRCW_phase_1_right_desc: "亚革盟《河内宣言》以宪章形式规定：当亚洲发生了任何一国或国家集团对缔约国的武装进攻，所有缔约国应实行单独或集体的自卫反击权力，以一切它可以采用的合理形式（包括派遣武装）对受攻击国进行全力支援。现在，我们可以通过亚革盟的集体防卫机制召集亚革盟的其他成员国为我们的战争提供支援。"
CPC_bookmarks_fake_1: "亚洲集体防卫协定"
CPC_bookmarks_fake_1_desc: "亚革盟《河内宣言》以宪章形式规定：当亚洲发生了任何一国或国家集团对缔约国的武装进攻，所有缔约国应实行单独或集体的自卫反击权力，以一切它可以采用的合理形式（包括派遣武装）对受攻击国进行全力支援。现在，我们可以通过亚革盟的集体防卫机制召集亚革盟的其他成员国为我们的战争提供支援。"
CPC_TRCW_phase_1_right_1: "中国优先"
CPC_TRCW_phase_1_right_1_desc: "自二战结束，经过几十年的建设，我们已然成为了世界上最大的社会主义国家，如今中国毫无疑问是已经是国际共产主义的核心。亚革盟的光荣职责便是保卫这个国际共产主义心脏，必要时需千方百计地援助中国，使其免受帝国主义国家的侵害。\n\n今后亚革盟的任务就是“组织各国对日斗争和支援中国”，保卫来之不易的共产主义希望。"
CPC_TRCW_phase_1_right_2: "共同进退"
CPC_TRCW_phase_1_right_2_desc: "“武装保卫苏联”这曾是三四十年代最主要的国际共产主义运动口号，这样的老子党作风给各国共产党带来了很严重的阻碍，我党曾经也深受其害，而如今的我们不能把这种作风强加给别人，只有平等对待亚革盟各国，共同进行反日反法西斯的战争，才能最大限度达成革命目标。\n\n亚革盟将“组织各成员国共同防卫日本”，联合起来打倒帝国主义。"
CPC_TRCW_phase_2: "艰难时刻"
CPC_TRCW_phase_2_desc: "敌我战争态势逐渐进入白热化阶段，许多问题开始在前方后方暴露出来：指挥链不畅、战俘难以管理、医疗压力过大等等，这场战争最艰难的时候已经来临——\n毛主席教导我们：下定决心，不怕牺牲，排除万难，去争取胜利。我们应当抱持必胜的信念去度过这战争的艰难时刻。"
CPC_TRCW_phase_2_left: "战争事务管理方案"
CPC_TRCW_phase_2_left_desc: "随着战线的深入，前线与中央指挥部门已经拉开了一段不小的地理距离，指挥链沟通不畅的问题日益严重，我们必须立即作出抉择——是放权给前线指挥官同志自主指挥，还是投入更多资源强化中央传达命令的信道？"
CPC_TRCW_phase_2_left_1: "国防部监督"
CPC_TRCW_phase_2_left_1_desc: "政权从枪杆子里来，枪杆子也应永远听政府指挥，这关系到党的执政地位，关系到我军性质宗旨，关系到部队战斗力。因此，我们必须站在全局的战略高度，认识到惟有全面加强国防部对前线战事的监督，方能确保解放战争的胜利。"
CPC_TRCW_phase_2_left_2: "前敌自主"
CPC_TRCW_phase_2_left_2_desc: "将在外，君命有所不受。为了提高决策效率和行动效率，确保作战资源的合理分配和利用以及适应多变的战场环境，我们应加强军委前委对前线战事的自主决策权，提高作战效率，以每一个作战任务的顺利完成换取最终的胜利。"
CPC_TRCW_phase_2_medium: "战俘管理条例"
CPC_TRCW_phase_2_medium_desc: "随着战争的升级，战俘的数量和复杂性不断增加，管理和安置战俘成为一项重要的任务。我们不仅需要让他们得到人道待遇，更需要定夺他们在这场战争中的去与留。因此，我们必须尽快拟定相关条例，采取有效的措施来管理和安置战俘。"
CPC_TRCW_phase_2_medium_1: "运往后方"
CPC_TRCW_phase_2_medium_1_desc: "为缓解后方繁重的重建工作导致的劳动力的不足，同时避免整编战俘可能会带来的哗变问题，中央人民政府及中央军委鉴于当前的战争形势，特发布此《条例》。即日起，全部战俘应被送往后方，从事工业生产，接受劳动改造，出于人道主义原则，地方政府应供给其生活必需品，为前线的胜利贡献坚实的后方。"
CPC_TRCW_phase_2_medium_2: "就地整编"
CPC_TRCW_phase_2_medium_2_desc: "为补充前线有经验的兵员的牺牲，以及缓解后方物资供给的压力，中央人民政府及中央军委鉴于当前的战争形势，特发布此《条例》。即日起，全体战俘应结合自己的实际情况，依照自愿原则，选择接受盘缠，返回家乡；或接受整编，就地投入战斗，为民族解放事业贡献力量。"
CPC_TRCW_phase_2_right: "医务工作方案"
CPC_TRCW_phase_2_right_desc: "自从百年前的提灯天使开创了战地医生这一伟大职业以来，医疗卫生工作便在战场上变得不可或缺了，我们经历的各种冲突也不例外。\n\n解放战争已然打响，这场大规模战争还用上了少见的生化武器，后方医疗人员们承接的任务比以往我们所参与的地方冲突中要多得多。现在几乎是每天都有数万伤员和地方生化战受害者被运往大西北的各大医院，几乎人人都成了南丁格尔。\n\n问题在于我们的医务人员数量是有限的，以至于大量的护士在加班加点的工作中都出现了不少伤员。在这没日没夜的救治工作中已然有些许怨言传到了医院党委的耳中，而敌人的生化武器库存仍不见减少了多少。"
CPC_TRCW_phase_2_right_1: "极限工作"
CPC_TRCW_phase_2_right_1_desc: "治病救人乃医者天职，阵线目前当急的任务是保护各大区免受敌军大规模生化战的影响，这势必要让医务团队的工作任务再增加一大头，但也没有比这更好的解决方案了。\n\n在过去的生化战案例中，最著名的便是意大利入侵埃塞俄比亚，意大利侵略者的毒气杀死了五十多万埃塞俄比亚人。而造成如此规模的感染潮究其因之一便是医疗条件的缺失。此事若在大西北大规模扩散的话那么其结果必然是灾难性的。\n\n而现在医护人员们将要保持全天候的战备状态，今天的加班加点换来的是大西北亿万同胞的生命财产安全，保卫阵线后方的责任担负在他们的肩上。尽管苦一点累一点，但阵线绝不可成为第二个埃塞俄比亚。"
CPC_TRCW_phase_2_right_2: "简化治疗"
CPC_TRCW_phase_2_right_2_desc: "医生也是人，人都需要休息，不然就会出问题。自战争开始以来，超负荷工作的医疗战线中就已经出现了不少伤员，这是不可接受的。每减少一个护士，责任就会交到另一个护士身上，如此一来只会造成更多的减员，继续透支下去只能恶性循环。\n\n为了避免这一恶性结果，阵线将缩短并简化部分消杀程序。轻微的污染区多配备漂白剂并做掩埋处理即可，其他程度的污染区视情况而定，对受染人员加以治疗。这样处理消杀强度固然会下降，但这也是保证医务负担稳定的一种战略。"
CPC_TRCW_phase_3: "终局之战"
CPC_TRCW_phase_3_desc: "随着国民党反动派势力被肃清，第三次国内革命战争取得了阶段性胜利。然而，东方的旭日正对我们虎视眈眈，中国民族解放战争的新阶段即将到来，全国人民应该加强团结，为夺取最后胜利而斗争。"

CPC_FUCK_JAPANESE_trait: "太阿贯日"
CPC_Lin_TRCW_FINAL: "西安之§L秋§!"
CPC_Lin_TRCW_FINAL_desc: "常言道，“过而不改，是谓过矣。”\n\n受党内的右倾现代修正主义与“左”倾机会主义分子的影响，中央在重大战略问题上，一而再，再而三的犯下了重大失误。若非林彪同志的当机立断，中国革命事业几乎要毁于一旦。"
CPC_Lin_TRCW_I_dominate: "§L太阿§!在握"
CPC_Lin_TRCW_I_dominate_desc: "林彪同志一贯高举毛泽东思想伟大红旗，最忠诚、最坚定地执行和捍卫毛泽东同志的无产阶级革命路线。林彪同志是毛泽东同志的亲密战友和接班人。"
CPC_Lin_TRCW_Revolution_Court: "§L革命§!法庭"
CPC_Lin_TRCW_Revolution_Court_desc: "敌人是不会自行消灭的。无论是中国的反动派，或是日本帝国主义在中国的侵略势力，都不会自行退出历史舞台。\n\n因此，我们有必要对他们的罪行进行审判。"
CPC_Lin_TRCW_committee: "§L军政§!委员会"
CPC_Lin_TRCW_committee_desc: "人民军队来自于人民，护佑着人民，反映着人民群众的集体意志。\n\n值此党和国家非常时期，建立军政委员会，方可使党作出符合人民利益，顺应历史潮流的正确决断。"
CPC_Lin_TRCW_FUCK_THOSE_MANCHURIAN_AND_KANTONESE: "§L清洗满广§!余孽"
CPC_Lin_TRCW_FUCK_THOSE_MANCHURIAN_AND_KANTONESE_desc: "日侨，不穿军服的侵略者；珠人，见利忘义的无耻之徒；满人，分裂华夏的帮凶。\n\n清洗余孽，不仅是人民群众的期望之举，也是革命事业的必要之措。"
CPC_Lin_TRCW_FUCK_THOSE_JAPANESE: "§L打倒日本§!帝国主义"
CPC_Lin_TRCW_FUCK_THOSE_JAPANESE_desc: "日本，东亚罪恶的根源，贪心不足的无耻之辈，脱亚入欧的宵小之徒。\n\n中国共产党要打倒以日本为首的帝国主义，打倒各国反动派，为在东亚内消灭人剥削人的制度，使整个东亚都得到解放而共同奋斗。"
CPC_Lin_TRCW_FUCK_THOSE_TRAITORS: "§L搜捕汉奸§!"
CPC_Lin_TRCW_FUCK_THOSE_TRAITORS_desc: "汉奸，侵略者的帮凶，无恶不作，罪行罄竹难书。敌人就在我们眼皮子底下，为了伟大的革命事业，我们宁可错杀一千，也不放过一个。"
CPC_Lin_TRCW_FUCK_THOSE_ENEMIES: "§L审判战犯§!"
CPC_Lin_TRCW_FUCK_THOSE_ENEMIES_desc: "战犯，反动集团的代表，人民的敌人。对反革命的敌人战犯，唯有诛杀，不容任何私情。唯有彻底审判犯下战争罪行的敌人战犯，我们才能清除干净日本帝国主义在国内的残留根须！"
BACK_TO_ETERNAL: "§x革命§!§L永生§!"
BACK_TO_ETERNAL_desc: "中国的革命道路，始终存在着阶级、阶级矛盾和阶级斗争，存在着社会主义同资本主义两条道路的斗争，存在着资本主义复辟的危险性，存在着帝国主义和现代修正主义进行颠覆和侵略的威胁。这些矛盾，只能靠不断革命和实践来解决。\n\n全党全军全国各族人民，应紧密团结在以林彪同志为核心的党中央周围，千秋万代，高举毛泽东旗帜，前进！"

CPC_TRCW_FINAL: "新中国宣言"
CPC_TRCW_FINAL_desc: "三年以来，\n在§Y人民解放战争和人民革命§!中，\n牺牲的人民英雄们§Y永垂不朽§!！\n\n三十年以来，\n在§R人民解放战争和人民革命§!中，\n牺牲的人民英雄们§R永垂不朽§!！\n\n由此上溯到一千八百四十年，\n从那时起，为了反对内外敌人；\n争取§x民族独立§!和§x人民自由幸福§!，\n在历次斗争中牺牲的人民英雄们§x永垂不朽§!！"
CPC_TRCW_phase_3_left: "新政府组织方案"
CPC_TRCW_phase_3_left_desc: "战争的阴霾就要散去，解放的曙光即将到来，随着争取民族独立和人民解放的历史任务的完成，组织新的政府形式已然成为当务之急，这对于国家的恢复和未来的发展都将有着至关重要的意义。"
CPC_TRCW_phase_3_left_1: "民主协商"
CPC_TRCW_phase_3_left_1_desc: "外有强敌环伺，内有残垣待兴，在这危急存亡之时，我们将代表全国各族人民的根本利益，提出和平、民主、团结的方针，积极争取实现国内和平民主，组织最广泛的人民民主统一战线，团结各被压迫阶级、各人民团体、各民主党派、各少数民族、各地华侨和其他爱国分子，筹备召开新政协，建立新中国。"
CPC_TRCW_phase_3_left_2: "制度专政"
CPC_TRCW_phase_3_left_2_desc: "没有共产党就没有新中国。正是在党的领导下，中国人民才得以从日寇与国民党反动派的暴政之中解放出来。作为中国新民主主义革命的主心骨，党有权利也有义务挑起新中国建设的大梁，决定今后的政府形式，将社会主义革命进行到底。"
CPC_TRCW_phase_3_medium: "后方恢复重建通知"
CPC_TRCW_phase_3_medium_desc: "随着战线的不断推进，后方恢复重建工作已提上日程。为了尽快恢复后方秩序，提高民众生活质量，确保胜利成果，各地方应因地制宜，逐步恢复基础设施重建与人员安置，切实履行职责，共同推进工作进展。"
CPC_TRCW_phase_3_medium_1: "抄没敌伪财产"
CPC_TRCW_phase_3_medium_1_desc: "中国共产党及其军队承担着抗击敌对势力与惩治叛国汉奸的使命。作为惩奸的方式之一，对敌伪资产处置的意义不仅在于惩治邪恶与保持民族气节，亦关系到树立威信、发动群众、打击敌人。各地应依照处置法令和办法，抄没敌伪资产，断绝其东山再起的经济基础，为抗战胜利提供有力支撑，亦为战后打开局面奠定基础。"
CPC_TRCW_phase_3_right: "战后对日关系讨论"
CPC_TRCW_phase_3_right_desc: "随着侵略者仓皇逃离中华大地，古国即将迎来她的解放与新生。对曾经的侵略者，我们又应当采取何种态度呢？过去的血海深仇，今天的制度差异，似乎在两国间筑起了天堑；然而，邻邦的一衣带水，信仰的阶级叙事，又要求邦交的正常化与人道的措施。抉择似乎难以定夺……"
CPC_TRCW_phase_3_right_1: "难民遣返"
CPC_TRCW_phase_3_right_1_desc: "同志们！我们没有时间再去斤斤计较谁的父亲杀死了谁的儿子，谁的儿子杀死了谁的丈夫；这不过是民族主义给予我们的仇恨陷阱，让我们这些阶级兄弟们，一样被被资产阶级与帝国主义压迫的无产阶级们无法团结起来给予他们最后一击。\n\n完成我们伟大理想，团结世界人民的第一步，就是放下仇恨，一些人也许难以接受，但政委们随时欢迎给予他们正确的阶级视角论的解答。\n\n对日本难民的最终方案是进行身份筛查，安全遣送出境，对于确实出于自愿想留在中国参与社会主义建设的，我们应当欢迎。"
CPC_TRCW_phase_3_right_2: "除恶务尽"
CPC_TRCW_phase_3_right_2_desc: "仇恨难以一时停歇，至少我们没必要再次上演满城的悲剧，毕竟在褪去一切身份后，我们依然是阶级兄弟，一些被欺骗者与被压迫者罢了——\n\n不。我们没法无视曾经的血海深仇，至少被屠戮的民众是这样，那些在战场上抛洒鲜血的战士是这样。如果我们要在民众的怒火与人道主义原则中取舍，只有一个折中办法——严格筛查身份，为恶者务必揪出全部清算，余下的强制驱逐出境。"
CPC_TRCW_phase_3_medium_2: "满广遗留问题"
CPC_TRCW_phase_3_medium_2_desc: "满洲的开拓团，广东的“珠人”和“日侨”，这些殖民时代的残影仍旧挥之不去。\n\n尽管经济可能受到不利影响，但取得解放的中国人民绝不会因噎废食而放弃解决这些遗毒。"
CPC_TRCW_Border_Strategy: "边疆战略"
CPC_TRCW_Border_Strategy_desc: "解放战争告一段落，但日本帝国主义依旧贼心不死。\n\n为彻底解放中国乃至全东亚人民，中央决定，针对日本殖民体系的薄弱点，拟定边疆战略。"
CPC_TRCW_Border_Strategy_tt: "£TER_texticon_PLA §Y中国人民解放军§!的§S使命§!尚未圆满，£GNG_japanese_frustration_texticon §j日本帝国主义§!仍然盘踞在我国的§Y台湾§!地区、盘踞在§Y鸭绿江§!停火线以南不断练兵备战。\n\n£TER_texticon_PLA §Y我军§!必须面向§m现代化§!的全新议题进行§G深化改革§!，方能在未来承担起§G解放台湾、解放朝鲜§!、§S解放全东亚§!乃至§C解放全人类§!的神圣使命！"
CPC_TRCW_Border_Taiwan: "台湾"
CPC_TRCW_Border_Taiwan_desc: "台湾，不沉的航空母舰，第一岛链的关键，殖民统治的实验场。\n\n人民军队正枕戈以待，台湾人民正翘首以盼，一定要把胜利的旗帜插到台湾。"
CPC_TRCW_Border_Chosen: "朝鲜"
CPC_TRCW_Border_Chosen_desc: "朝鲜，受日光鲜之地，“合邦请愿”的战果，奴化教育的推行地。\n\n人民军队正厉兵秣马，朝鲜人民正奋起反抗，一定要让自由的声音跨过鸭绿江。"
CPC_10th_congress_preparation: "十大准备工作"
CPC_10th_congress_preparation_desc: "解放战争业已胜利，而解放大业才刚刚开始。怎样恢复和发展国民经济、巩固新生人民政权、完成社会主义革命、确立社会主义基本制度、推进社会主义建设……诸多的问题仍有待我们作答。\n\n值此时机，中央准备召开十大，对建国后的若干问题展开商讨。"
CPC_Central_People_Government_reform: "中央人民政府改组"
CPC_Central_People_Government_reform_desc: "随着新中国的成立，原中央人民政府应进行改组，完成从国防政府向人民民主专政政府的转变，为中国人民的新未来奠基。"
CPC_Central_People_Government_reform_tt: "将§S重组§!全国§Y地方行政区划§!。"
THE_EAST_IS_RED: "§x东方红§!"
THE_EAST_IS_RED_desc: "§x共产党§!，像§Y太阳§!，照到哪里哪里亮\n哪里有了§x共产党§!，呼儿嗨哟，哪里§S人民§!得解放\n\n——歌曲《东方红》，1944年"

#东部起义
CPC_dem_riot_gui: "东部民主起义"
CPC_dem_riot_gui_desc: "在我们潜心§G发展韬光养晦§!之时，东部苦难深重的中国人民并未坐以待毙——自§Y安田危机§!以来，§Y广西、北平§!等地就陆续爆发了抗击帝国主义的§C民主爱国运动§!，尽管招致了§x残酷镇压§!，但零星的抗议活动仍在§Y持续§!，并随最近国际国内局势动荡而§G越发壮大§!起来——以§Y北平、武汉、雷州§!三地为代表的§C东部民主起义运动§!正在蓬勃发展，我们有责任有义务为他们送去§Y支援§!。"
CPC_dem_riot_gui_tt: "-§R实力§!\n---------------\n每个§C起义地区§!都有其§R实力§!，代表了他们§Y抗击伪政府镇压§!的能力，其实力将随时间推移§R缓慢下降§!，若某一地区的实力§R低于§!§Y30%§!，§R伪政府§!将§R直接展开镇压行动§!。\n我们将通过一系列行动支援§C民主起义者§!，保持他们的§R实力§!。\n\n一旦三个地区被§x全部镇压§!，§Y失望的东部人民§!极有可能将对我们的§x解放行动§!持§R冷漠态度§!。\n\n-§G激进度§!\n---------------\n每个§C起义地区§!都有其§G激进度§!，代表了他们§Y民主诉求§!的激进程度，尽管我们可以通过§Y敌占区情报网络§!来§G保证§!这些地区的§R实力§!，但相应地也会§Y助长§!他们的§G激进度§!，若三地§R平均激进度§!大于§Y50%§!，他们将自行其是，在上海召开§m中华民国国是会议§!，而§R不再配合§!我们在西安召开§G全国人民政治协商会议§!的民主提议。\n\n——尽管对§R革命事业§!而言，§Y两个会议§!都会成为中国人民取得阶段性胜利的§G里程碑§!，但对§x我们党§!而言，§G政协会议§!能为我们的§R战争事业§!带来较大帮助。"
CHI_liberty_front: "中国自由阵线"
CPC_dem_riot_failure: "失败的民主浪潮"
CPC_dem_riot_failure_desc: "我们没有抓住这个机会，由于我们的不作为，东部的民主爱国实力全部沦亡于伪政府匪帮铁蹄之下。\n\n现在，东部人民对我们丧失了耐心，不再愿意配合我们的其他行动——未来我们在东部的解放和改造很有可能将遭遇重重阻力。"
