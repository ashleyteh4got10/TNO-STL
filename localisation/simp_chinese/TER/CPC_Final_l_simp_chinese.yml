CPC_TRCW_end.101.t: "他在丛中笑"
CPC_TRCW_end.101.d: "黄土高原上的寒意逐渐被煦风吹散，西安的春天悄然而至。淡黄的阳光轻洒在李讷身上，像是亲人的抚摸，让她僵硬疲惫的身体有了一丝暖意。轻手推开已经封闭许久的家门，她走进了阔别已久的家：这是她的家，也是那个伟大的男人——她的父亲毛泽东的家。作为党和国家的最高领袖，父亲的起居却是异常简单：除去前厅、天井、盥洗室、餐厅，属于他的起居室内只有一张檀木书桌，一张木板床，以及几大厢摆满中外典籍的书柜，还有叠成堆在床头床尾随意放置的古册。房间的摆设仍与离开那天一样，但是房间的主人却再也不会回到这里了。\n\n不愿意继续触景生情，李讷对同行而来的秘书小隋吩咐到：“这就是主席的书房了，小隋你就负责书桌那块，我去看看杂物柜，记住要小心轻放，这都是重要的革命遗物。”“我明白了，那我过去了。”\n打开尘封的长方形储物箱，各种说不上名目的零杂物件摆满箱子。有用一半坏掉的铅笔，有小孩子的涂鸦，还有刺得歪歪扭扭的绣巾，她一眼就认出这些都是她小时候的物件。她第一次写字用断的铅笔、她开始学习美术时送给爸爸的蜡笔画、以及那张刺得歪歪扭扭的绣巾，上面有两颗大大的寿桃：那是父亲60岁生日，她特意手工制作，一针一针地缝制的，因为没有女红经验，所以最终成品其实很不好看。但是她清楚地记得，接到手帕时父亲那高兴得爱不释手的表情。爸爸不喜欢过生日，因为总会让他想起那些死去和离散天边的亲人：杨开慧、毛泽覃、毛泽民、贺子珍、毛岸英、毛岸青、李敏…他的身边只剩下自己一个孩子了。\n眼眶又开始盈润，李讷心中被压抑的情感正一点点的抬头，父亲再也不在自己身边了，自己再也看不到那个会手把手教她写字识字的和蔼老人了。\n\n“李讷同志，你快过来看看这个东西。”\n听到小隋的呼叫，李讷赶忙走到书桌前，书桌上是一张中央委员会专用的稿纸，上面用已经有些歪歪斜斜却依旧飘逸灵动的笔迹写了一首诗。\n像捧起圣物一样捧起诗稿，明媚的阳光从窗外照亮了纸上的字迹，李讷看一眼就清楚，这是一个为了革命燃烧一生的老人在人生路的尽头，留给世间最后的背影。\n\n\n\n\n\n\n£GFX_CPC_Mao_end \n\n\n\n"
CPC_TRCW_end.101.o: "她明白，父亲的心愿已了。"
CPC_TRCW_end.102.t: "漫长的告别"
CPC_TRCW_end.102.d: "在中国实现完全统一（除台湾及沿海个别岛屿）后，一个巨大的背影慢慢沉入了地平线的尽头——中共中央毛泽东治丧委员会决议，主席的葬礼将克日举行。\n\n三十万人排队走过安放毛泽东骨灰的灵台作告别。追悼流程为外国的外交人员保留了瞻仰的时间，为共产党的意识形态盟友安排了单独的时段，他们中有朝鲜人、蒙古人、越南人、缅甸人、柬埔寨人……在社会各界送别的花圈之中，有一个上面写着：“深切悼念敬爱的伟大导师毛泽东主席，您的学生和亲密战友江青……”\n\n百万人来到西安人民广场，参加毛主席哀悼周结束时举行的追悼会。下午三点整，整个中国停工三分钟。八亿人（无疑会有一些例外）安静地站立，为那素未谋面的领袖默哀，为在战争中牺牲的烈士默哀，为自日本入侵以来死难的中国同胞默哀。中国所有的汽笛（火车上的、工厂里的、轮船上的）都在那三分钟里拉响了。\n\n背离逻辑常常使仪式成为谎言，在全中国人面前，共产党尚未完成自己的亮相。正是这样，共产党的所有主要领导都走上葬礼的台前。邓小平主持追悼会；薄一波致悼词，以他审慎的话语赞颂毛泽东的伟大；江青大谈特谈中国走上社会主义道路的必然性，小心帝国主义的腐蚀。这时，孙中山的遗孀就站在习仲勋的旁边。\n\n会议结束时，在场的人（跟全中国观看或倾听的亿万人一起）对着广场前面的毛泽东巨幅肖像庄严地三鞠躬。随后，一个五百人的乐队奏出响亮的赞歌《东方红》，其最后一句歌词称毛泽东是“人民大救星”。\n\n下午四点，人群散去。自行车潮开始像往常一样涌过人民广场，碾在追悼会留下的印有大会程序的废纸屑上。中国，一个积贫积弱、四分五裂的时代结束了，一个共产党领导下的崭新时代即将诞生。"
CPC_TRCW_end.102.o: "中国万岁，人民万岁！"
CPC_TRCW_end.103.t: "老树发新芽"
CPC_TRCW_end.103.d: "鉴于西安基础设施保存尚且完好，稍早前的全国政协会议决议仍在西安召开第一届全国人大主席团的选举工作。\n\n作为赴陕参与选举的南京代表团团长及全国政协名誉主席，宋庆龄对建立了这个新中国的共产党，对这个“现在的”共产党是既熟悉又陌生：多么熟悉的名字，半个世纪以前，她的丈夫和战友们都对这个政党抱有莫大的好感；多么陌生的人们，她记忆里的那些年轻面孔：周恩来、毛泽东……都已先于她长辞人间。\n\n在西安的全国政协临时大会堂，她被人们簇拥着走上台阶，走进会堂，她看到了一群素未谋面却活力四射的年轻人——她不由想起数十年前，自己和这些孩子一样年轻的时候：那时候她的身旁是孙中山、廖仲恺、周恩来、鲁迅、蔡元培……脑海中慢慢浮现这些人的音容笑貌，竟同眼前的孩子们重叠起来……\n\n流程十分顺利，很快便到了她该发言的时候。“接下来，有请宋庆龄先生宣布选举程序开始。”大会主持人是她在南京曾见过的纪登奎——都是年轻一代，都是有想法的一代。\n\n宋庆龄点点头，接过话筒：“我腿脚不方便站立发言，就只能借一个话筒坐在你们中间发言了，请会场诸君见谅。像我这样一个非共产党员，能够列席这次具有历史意义的大会，这是我毕生中感到最光荣和最愉快的事。”\n“我同时看到，不只是我，我们的会场中有着许多我未曾谋面的年轻面孔，这些面孔来自全国各个地方和团体，这代表着一件事，我们这个已陷于分裂落后困顿之苦有百年之久的中国终于重新凝聚在了一起。”\n“现在，这个民主的、革命的、独立的新中国正在尝试一条从未有过的道路，一条包括孙中山先生在内的老一代民主革命家们没有走过的道路，一条国民党反动派、日本帝国主义畏惧的道路。而走上这个道路的办法，就在今天，就在我手中的这张选票里。”\n\n宋庆龄终于拄拐站起，在无穷尽的掌声和热泪中，迈着缓慢但坚定的步伐走到会台中央的投票箱前。\n\n“我宣布，[CPC.GetName]第一届全国人民代表大会主席团选举大会，现在开始！”"
CPC_TRCW_end.103.o: "属于新中国的第一票已被投下。"

