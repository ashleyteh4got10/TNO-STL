CPC_TRCW_end.302.t: "漫长的告别"
CPC_TRCW_end.302.d: "在中国实现完全统一（除台湾及沿海个别岛屿）后，一个巨大的背影慢慢沉入了地平线的尽头——中共中央毛泽东治丧委员会决议，主席的葬礼将克日举行。\n\n三十万人排队走过安放毛泽东骨灰的灵台作告别。追悼流程为外国的外交人员保留了瞻仰的时间，为共产党的意识形态盟友安排了单独的时段，他们中有朝鲜人、蒙古人、越南人、缅甸人、柬埔寨人……在社会各界送别的花圈之中，有一个上面写着：“深切悼念敬爱的伟大导师毛泽东主席，您的学生和亲密战友江青……”\n\n百万人来到西安人民广场，参加毛主席哀悼周结束时举行的追悼会。下午三点整，整个中国停工三分钟。八亿人（无疑会有一些例外）安静地站立，为那素未谋面的领袖默哀，为在战争中牺牲的烈士默哀，为自日本入侵以来死难的中国同胞默哀。中国所有的汽笛（火车上的、工厂里的、轮船上的）都在那三分钟里拉响了。\n\n背离逻辑常常使仪式成为谎言，在全中国人面前，共产党尚未完成自己的亮相。正是这样，共产党的所有主要领导都走上葬礼的台前。邓小平主持追悼会；薄一波致悼词，以他审慎的话语赞颂毛泽东的伟大；江青大谈特谈中国走上社会主义道路的必然性，小心帝国主义的腐蚀。这时，孙中山的遗孀就站在习仲勋的旁边。\n\n会议结束时，在场的人（跟全中国观看或倾听的亿万人一起）对着广场前面的毛泽东巨幅肖像庄严地三鞠躬。随后，一个五百人的乐队奏出响亮的赞歌《东方红》，其最后一句歌词称毛泽东是“人民大救星”。\n\n下午四点，人群散去。自行车潮开始像往常一样涌过人民广场，碾在追悼会留下的印有大会程序的废纸屑上。中国，一个积贫积弱、四分五裂的时代结束了，一个共产党领导下的崭新时代即将诞生。"
CPC_TRCW_end.302.o: "中国万岁，人民万岁！"

CPC_TRCW_end.401.t: "漫长的告别"
CPC_TRCW_end.401.d: "在中国实现完全统一（除台湾及沿海个别岛屿）后，一个巨大的背影慢慢沉入了地平线的尽头——中共中央毛泽东治丧委员会决议，主席的葬礼将克日举行。\n\n三十万人排队走过安放毛泽东骨灰的灵台作告别。追悼流程为外国的外交人员保留了瞻仰的时间，为共产党的意识形态盟友安排了单独的时段，他们中有朝鲜人、蒙古人、越南人、缅甸人、柬埔寨人……在社会各界送别的花圈之中，有一个上面写着：“深切悼念敬爱的伟大导师毛泽东主席，您的学生和亲密战友江青……”\n\n百万人来到西安人民广场，参加毛主席哀悼周结束时举行的追悼会。下午三点整，整个中国停工三分钟。八亿人（无疑会有一些例外）安静地站立，为那素未谋面的领袖默哀，为在战争中牺牲的烈士默哀，为自日本入侵以来死难的中国同胞默哀。中国所有的汽笛（火车上的、工厂里的、轮船上的）都在那三分钟里拉响了。\n\n背离逻辑常常使仪式成为谎言，共产党在建国前的首次亮相未免令国人过于惊愕。正是这样，共产党所有的主要领导都走上葬礼的台前。叶群主持追悼会；林彪致悼词，以他无比热忱的话语赞颂毛泽东的伟大；吴法宪大谈特谈中国走上社会主义道路的必然性，小心帝国主义的腐蚀。这时，孙中山的遗孀就站在邓小平的旁边。\n\n会议结束时，在场的人（跟全中国观看或倾听的亿万人一起）对着广场前面的毛泽东巨幅肖像庄严地三鞠躬。随后，一个五百人的乐队奏出响亮的赞歌《东方红》，其最后一句歌词称毛泽东是“人民大救星”。\n\n下午四点，人群散去。自行车潮开始像往常一样涌过人民广场，碾在追悼会留下的印有大会程序的废纸屑上。中国，一个积贫积弱、四分五裂的时代结束了，一个共产党领导下的崭新时代即将诞生。"
CPC_TRCW_end.401.o: "中国万岁。"
CPC_TRCW_end.402.t: "疑雾"
CPC_TRCW_end.402.d: "偶尔，华北的清晨会弥漫着阴冷的雾气，混同火车喷出的烟雾一块，冷热交缠，阴晴不定。\n月台上每隔数十步便是全副武装帽挂红星的军警，他们端着钢枪站得笔挺，目不斜视，只为迎接某位大人物的到来。而如果再把目光往月台的末端，往铁路延伸的方向投去，在华北疑雾升腾的清晨里，便有一盏高瓦数的列车灯将雾气刺穿，把白炽光投射到火车站——这便是[CPC.GetName]国家主席、中国共产党中央委员会主席、中央军事委员会主席林彪的专列了。\n\n列车到站，没有鲜花团簇，也没有人头攒动，有的只是闪烁着精钢冷光的钢枪，以及早已在月台等候多时的人民解放军海军司令员李作鹏。\n林彪主席着一身军绿色大衣从机车喷出的白汽中现身，李作鹏也便立刻迎了上去，林彪只是简单点了点头致意，低声说了句什么，便独自一人朝着出口走去。\n白雾中走下另一道身影——那是叶群——她一路小跑追了上去，仿佛要汇报什么更重要的事情，然而不过在林彪身边作陪数秒也旋即折返，在汽笛轰鸣中，他们的对话就这样完成了保密——没有任何历史记录会记下这天清晨，林彪同李作鹏说了什么，同叶群又说了什么。\n\n或许这正是林彪需要的效果，他的身影缓缓隐没在华北的疑雾中——"
CPC_TRCW_end.402.o: "所留下的只有那道阴冷却茫然的眼神。"

JAP_fallen_empire: "旭日陨落"
JAP_Chozen_Naikaku: "超然内阁"
JAP_Chozen_Naikaku_desc: "第三次中日战争的彻底溃败令日本颜面扫地，并成为了全球冷战的头号输家——共荣圈支离破碎，连带着日本过去三十年向国民和东亚承诺的“泛亚共荣”也一并变成了本世纪最大的谎言。\n\n现在，被中国人民之怒火从高天原神座上掀翻在地的旭日帝国即将面对一个濒临崩溃的七十年代，愤怒的日本民众与渴望变革的自由派地下政客们正在恣意撕开帝国国体，将自己的诉求灌注其中——但日本帝国并非输光了所有筹码：它还牢牢掌控着桦太-朝鲜-冲绳-台湾-北婆罗洲的“第一岛链”以及庞大的西太平洋群岛；它还拥有世界前二的海军力量和世界前三的核武储备，所有这一切都指向了一个残酷黑暗的未来：从海兰泡到北婆罗洲，从帕米尔高原到马里亚纳海沟，一道中日冷战的铁幕已经降下，而这次——日本将潜身蛰伏，饲机再次亮出毒牙。"

