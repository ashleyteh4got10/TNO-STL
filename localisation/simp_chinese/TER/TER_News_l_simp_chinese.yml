l_simp_chinese:
WORLD_TER.1.t: "[Get_newspaper_header]蒙古内战结束"
WORLD_TER.1.desc: "内外蒙古领导人已择日派出使者与蒙疆领导人就停火条件进行谈判，这标志着亚洲草原上的枪声暂告停歇。取得胜利的乌兰巴托市民自发走上街头，争相庆祝蒙古的自由解放。\n\n面对本国革命者的攻势，蒙疆没表现出强有力的镇压态势，反而失去对北方的控制，作为日本的盟友让人始料未及。"
WORLD_TER.1.a: "东亚的新局面。"
WORLD_TER.2.t: "[Get_newspaper_header]昆明血案"
WORLD_TER.2.desc: "在一条少有行人的偏僻小巷里，一名居民发现了民主活动家闻一多倒在血泊中的尸体，并向当地警察局报案。死者生前曾在公开场合激烈批评高宗武给中国带来巨大的主权沦陷。\n\n经法医鉴定，尸体背后中三枪，头部中一枪，子弹来自两个不同方向，凶器为勃朗宁手枪。最终导致被害人丧命的是头上枪伤，这一枪是被人抵住后脑勺才开火的。\n\n昆明血案的残忍程度令世人震惊，广西首脑夏威称此事“骇人听闻”，南京方面已责成专案组抵达云南调查，以期尽快侦破此案。"
WORLD_TER.2.a: "太残暴了。"
WORLD_TER.3.t: "[Get_newspaper_header]高宗武抵达横滨港"
WORLD_TER.3.desc: "在形势不断恶化的气氛中，中华民国总统高宗武放下西部动荡的局势，亲自飞抵日本洽谈国商开放事宜。高宗武在机场表示此行访问目的在于加深与日本友邻的合作关系，共同抵御经济下行压力。\n\n一番紧锣密鼓的谈判后，中日达成以《中日友好通商新约》为核心的一揽子条约。中国向日本提供各项政策优惠，吸引日本企业来华投资。解决中方目前的财政困境与日方的企业利润逐年下降\n\n日方代表大平正芳表示，中国需要创造更加稳定的环境，才能担负起共荣圈发展的义务。"
WORLD_TER.3.a: "混乱的开始，亦或是终结？"
WORLD_TER.4.t: "[Get_newspaper_header]中日重新定位合作关系"
WORLD_TER.4.desc: "乐观气氛还没洋溢多久。中方回国后，《商约》的详细文本却被本国记者泄露在报纸上。\n\n《商约》规定中日双方国民皆有彼方“领土全境内”居住、旅行与从事商业、工业、文化教育、宗教等各种职业的权利，及采勘和开发矿产资源、租赁和保有土地的权利；并且在经济上享受国民待遇；双方的商品都享有平等的税率；双方船只可以在对方口岸、领水内自由航行；双方飞机可以在对方机场、领空内自由飞行。\n\n条约表面上双方享有对等权利，而实际上由于中日国力相差悬殊、中国单方面生产落后，根本无法与日本平等地实现其中规定的权利，条约实质上出卖中国的领空权与领海权，因此全中国领土均向日本开放。"
WORLD_TER.4.a: "公平的契约，不公平的交易。"
#李纯如为虚构角色
WORLD_TER.5.t: "[Get_newspaper_header]李纯如自杀身亡"
WORLD_TER.5.desc: "今晨，青年记者李纯如的尸体在其公寓中被家人被发现，在她的书桌上摆着一瓶吃掉一多半的安眠药和一封遗书，遗书内容由广东警方封存未获公开。\n\n李纯如长期居住香港，以独立记者的身份调查日占广东时期各地发生的恶性凶案，李纯如为了让华人重新燃起改善生存环境的希望，自愿担任民间意见领袖，为提高华人待遇奔走呼号，但中日双方均对他们的诉求置若罔闻，还对其进行过死亡威胁。\n\n经济危机爆发后，李纯如用家中政府高官的人脉关系，参与揭露了《中日商约》的具体条文，被南京所针对。因此，许多人猜测李纯如的自杀动机源于沉重的民众寄托以及对精神的极度摧折。"
WORLD_TER.5.a: "愿她下辈子投生个好地方。"
WORLD_TER.6.t: "[Get_newspaper_header]西南战争"
WORLD_TER.6.desc: "广西地方军队与日本海军陆战队在广西南部爆发大规模武装冲突。高宗武希望广西立刻停止抵抗，接受中央领导。\n\n日本已增派海军舰队支援广西战事，并称平叛行动正在稳步进行，战火将不日平息。\n\n与此同时，何应钦向全国发布抗滇声明，声明中指出卢汉正在动员军队入侵贵州，谴责卢汉破坏和平局势，但南京方面未做回应。\n\n另有消息称，四川省与西康省发生边境冲突，四川省主席黄隐发表公开声明：唯念祖国统一，剿灭叛匪。\n\n国际评论普遍认为，中国西南军阀的混战是东亚自安田危机后最严重的军事冲突，而南京方面试图浑水摸鱼。"
WORLD_TER.6.a: "有野心的家伙们。"
WORLD_TER.7.t: "[Get_newspaper_header]华北地区爆发大规模游行示威"
WORLD_TER.7.desc: "自日本入侵广西开始，北平、天津、济南、青岛、唐山等城市就陆续出现反对国民党的游行示威运动。\n\n市民们公开悼念业已身亡的闻一多与李纯如，支持广西的抗日行动，高调抗议南京政府与日方达成的合作协定，并提出“高宗武下台”、“拒绝签字”等民众诉求，并且公开决议脱离南京政府的统治。\n\n面对民情汹汹的北方，南京政府对外宣称这是一场由少数西方帝国主义走狗、赤化反动分子蛊惑、煽动的叛乱。"
WORLD_TER.7.a: "华北还能否放得下一张平静的书桌？"
WORLD_TER.8.t: "[Get_newspaper_header]北京事件冲突升级"
WORLD_TER.8.desc: "国民政府在北京的统治已经几乎宣告瘫痪，市民包围了当地政府并争取辖区军警倒转枪口，越来越多不满日本占领的人共同加入反抗行列。\n\n市民内部对是否接受高宗武的谈判产生不同意见，但天津传来一则消息：原华北行政委员长王荫泰要求河北省对示威分子一律严惩，随即就有大批市民被便衣毒打抓进监狱，然后音讯全无。这导致市民公会中坚决反对谈判的激进人士得到大多数人支持，一位名叫遇罗克的青年教师成为抗议运动的领袖，他号召抗议者们准备内战，逼迫高宗武承认华北自治。\n\n南京方面对不接受谈判的事实深感遗憾，并封锁了北京的所有消息。"
WORLD_TER.8.a: "我找不到政府雇便衣打人的新闻，你呢？"
WORLD_TER.9.t: "[Get_newspaper_header]华北方面军宣布介入北京事件"
WORLD_TER.9.desc: "日本外务省发言人称愈演愈烈的京津唐暴动已经对共荣圈的稳定构成威胁，在取得南京政府的许可后，华北方面军司令部发表镇暴声明，天津地区的日本驻华军队已于稍早时候拔营西进，兵锋直指北京城。\n\n由于南京方面的严密封锁，目前无法得知京津唐的市民们对此事的反应，亦无法得知京津唐等地区的平民伤亡情况。"
WORLD_TER.9.a: "惨剧在华北再度上演。"

WORLD_TER.10.t: "[Get_newspaper_header]日本宣布控制广西全境"
WORLD_TER.10.desc: "稍早前受共荣圈瞩目的广西战事落下帷幕，由贺阳宫恒宪王率领的远征军第一三零师团已经完全控制广西全境，亲王本人已经作为战争英雄返回日本，并准备出席由裕仁天皇主持的授勋典礼。\n\n国民政府已经计划开始着手重组广西政府，有消息称贺阳宫恒宪王本人愿意担任广西的地方长官，但日本方面回应无此提议。"
WORLD_TER.10.a: "毕竟已经有广东了。"
WORLD_TER.11.t: "[Get_newspaper_header]广西省主席人选出炉"
WORLD_TER.11.desc: "经过南京国民政府半个月的紧张磋商，新一任广西省主席的人选终于露出眉目，出身云南的段希文将军将接受南京政府的任命，至广西桂林宣誓就职。"
WORLD_TER.11.a: "这就是高宗武给卢汉的好处。"

WORLD_TER.12.t: "[Get_newspaper_header]夏威主持召开西南经济峰会"
WORLD_TER.12.desc: "为了稳定安田危机带来的社会动荡，由广西省主席夏威牵头在柳州举办了桂、赣、川、滇四省经济联合会议。云南省主席卢汉，四川省主席黄隐和贵州省主席何应钦分别应邀与会。\n\n四方分别就省内经济开始互助谈判，统合控制珠江中上游加强四省互相固结以自重，形成磷、煤矿等西南自然资源对外商贸统一维护西南之共同利害。\n\n南京方面认为此举是意图组成“西南联防政府”以反对中央。但夏威对西南四省之间的合作前景持乐观态度，对外他再次强调西南经济困局不需要日本企业的干预。"
WORLD_TER.12.a: "联防之先声？"
WORLD_TER.13.t: "[Get_newspaper_header]西南峰会突然中止！"
WORLD_TER.13.desc: "在高宗武的特使到达昆明后，外界普遍猜测南京方面是用金圆攻势让卢汉便抛下其他人退出联会，与卢汉相约退场的还有四川黄隐，他们在同一天各自坐上了返程的飞机。而何应钦因为贵州内部发生政治动乱早已回到贵阳\n\n高宗武盛赞卢汉“维护统一”的举动，并指责夏威独自召开会议，是“破坏国家安定繁荣”的罪魁祸首，严令其尽早放弃幻想。夏威对高宗武的指责表现得十分愤怒，要求高宗武为破坏西南的经济发展付出代价。广西与南京的关系降至冰点。\n\n广西的激进军官偷袭了位于钦州的日军基地。面对广西的武力挑衅，高宗武对外公布了戡乱平叛的消息，引发共荣圈内更大的震动。"
WORLD_TER.13.a: "让我们看看谁更爱国。"

#西藏部分事件
WORLD_TER.15.t: "[Get_newspaper_header]日本特使到访拉萨"
WORLD_TER.15.desc: "日本西本愿寺僧人使团以宗教交流的名义，经自由印度进入达旺地区，于昨日抵达拉萨。西藏佛教界为此举行了盛大的礼佛仪式，并向日本僧人奉上可口的热茶。\n\n在双方会谈中，日方多次提到三十年代安钦活佛亲手缔造的日藏友谊，并希望日本能够与西藏开展更加密切的合作。西藏领导人丹增嘉措表示部分认同，西藏与日本应该继续保持和平友好的关系。\n\n西藏表现出摆脱中立的姿态，开始采取带有倾向的外交，外界对此普遍感到困惑。"
WORLD_TER.15.a: "不即不离，无缚无脱，做不到了。"
WORLD_TER.16.t: "[Get_newspaper_header]高原上的战争"
WORLD_TER.16.desc: "西藏军队对原国民党将领刘文辉控制的康巴地区发起进攻，这是一场令西康猝不及防的突然袭击。\n\n在噶厦的开战声明中，政府首脑、宗教领袖丹增嘉措将这场东亚高原上的冲突描述成收复故土、保卫家园的战争，他宣称：“中国或其他任何国家都不能染指藏人的土地。”\n\n中华民国未对这场冲突做出任何评价，并且对任何有关战争形势的话题都保持沉默。"
WORLD_TER.16.a: "日本能说动佛陀开杀戒。"
WORLD_TER.17.t: "[Get_newspaper_header]丹增嘉措活佛到访加尔各答"
WORLD_TER.17.desc: "西藏领袖丹增嘉措刚刚赢得对内战争，为了答谢自由印度在战争中的帮助，他亲自带领使团出访加尔各答，对自由印度领导人钱德拉·鲍斯做出新的外交承诺，其中包括无条件支持自由印度的国际地位，还有对尼赫鲁多方面的敌对行为。\n\n据悉，双方还将就《藏印1950年边界备忘录》的未尽事宜进行进一步磋商，并将“通力协作”以将这一日本主导的备忘录升级为正式的外交协定。\n\n自丹增嘉措出访以来，与其同为宗教领袖的确吉坚赞对西藏近期发展表达了自己的反对意见，他认为西藏在国际关系中应该采取绝对中立的策略，并且直接声称达赖“把自己变成了异乡人的祭品”。"
WORLD_TER.17.a: "一切“祭品”都是相对而言。"
WORLD_TER.18.t: "[Get_newspaper_header]西藏再次重申达旺-墨拉萨丁地区主权"
WORLD_TER.18.desc: "加尔各答有关《藏印1950年边界备忘录》的会谈不甚顺利，丹增嘉措政府目前已经命令西藏军队全面进驻达旺-墨拉萨丁地区，宣示西藏对英帝国主义遗留问题的不妥协态度，而自由印度方面尚无外交方面的官方确认。这引发了印度总理尼赫鲁的强烈抗议，他认为印度内部沟通的桥梁被军事强人鲍斯置之不顾，同时批评丹增嘉措擅自破坏南亚地区局势的轻率举动。\n\n面对外交批评，西藏开始着手调整边防巩固新领土，向边境派遣更多部队防止未来可能发生的军事冲突。与此同时，印度边防哨所关于武装袭击的报告与日俱增。"
WORLD_TER.18.a: "达赖显然还想要更多。"
WORLD_TER.19.t: "[Get_newspaper_header]印藏边境冲突"
WORLD_TER.19.desc: "在西藏与印度西段边境上，印度边防军遭遇西藏军队肢体挑衅，最终发展至双方互相炮击。西藏领导人丹增嘉措以保护边境人民的名义命令藏军进入拉达克地区。\n\n印度共和国总理尼赫鲁在冲突当天发表全国讲话，号召全印度团结一致应对西藏入侵，同时向前线输送更多军事增援。\n\n西藏内部对于新的冲突也传出不同的声音，班禅·确吉坚赞呼吁各方保持冷静，采取任何除战争以外的手段化解冲突。印度军方认为，这是藏军试探性进攻受挫后释放的迷惑性消息，印军不会因确吉坚赞的言论掉以轻心。"
WORLD_TER.19.a: "战争不会轻易结束。"
WORLD_TER.20.t: "[Get_newspaper_header]西藏单方面撤军"
WORLD_TER.20.desc: "西藏在拉达克没有取得战场优势，自身经济形势反而迅速恶化，有大量难民从西藏各地逃往中国内地和印度。军事行动的消耗超过西藏政治高层的预期，这引发了内部争议。确吉坚赞单方面宣布“停止无意义的军事活动”，向印度共和国主动求和，不再支持丹增嘉措的侵略行为。\n\n在确吉坚赞发出声明后，西藏前线军队发生分裂，一些厌战部队主动脱离战斗向后方撤退。印军趁势收复了藏军推进的地区，将占领线维持在冲突发生前，南亚恢复和平。自由印度亦趁藏军内部不稳采取秘密措施，鼓动不丹夺下墨拉萨丁地区控制权，双方在仰光签订《备忘录》结下的旧仇得以部分清算。\n\n面对内部变局，丹增嘉措认为班禅要为失败负主要责任，他禁止确吉坚赞离开日喀则，取缔其参政、朝圣的权利。目前暂无渠道得知确吉坚赞本人的态度。"
WORLD_TER.20.a: "苦海难渡，谁作舟楫？"

#一阵强劲的音乐响起#
WORLD_TER.21.t: "[Get_newspaper_header]中国内战"
WORLD_TER.21.desc: "盘踞于中国西部的国防阵线政权今日发表了《国防阵线告全国人民书》，以此宣言为标志，剑拔弩张的东亚局势终于一发不可收拾。\n\n几乎在同时，中华民国总统府发布了戡乱救国的总动员令，大军正在向山西、河南、湖北等地区进动。\n\n日本已召开紧急御前会议，其驻华陆海军亦已进入一级战备状态；受石油危机冲击，德、美、意等多国官方目前均对东亚局势保持缄默。\n\n前线冲突爆发的零星消息正不断传出，据信，国共两军先头部队已在河南、湖北、山西等地爆发激烈战斗。"
WORLD_TER.21.a: "此即两种命运之决战。"
WORLD_TER.22.t: "[Get_newspaper_header]新中国成立"
WORLD_TER.22.desc: "中国内战正式落幕，刚刚赢得第三次国内革命战争的国防阵线政权今日在古城[CPC.Capital.GetName]举行隆重集会，庆贺新生的[CPC.GetName]正式成立。\n\n与[CPC.Capital.GetName]热情洋溢的氛围相反，世界各地尚深陷石油危机泥潭之中，响应新中国政权成立者寥寥；部分国际观察家指出，第三次国内革命战争只是亚革盟官方所称“亚洲人民解放战争”的一个部分，在彻底将日本驱逐出大陆之前，亚革盟绝不会善罢甘休。\n\n东京再度召开紧急御前会议，会议内容未获披露，但有消息称，关东军、满洲国军等已在各自前线修筑工事，大量战略物资已分别送至广东、平津停火线附近。"
WORLD_TER.22.a: "东方欲晓。"
WORLD_TER.23.t: "[Get_newspaper_header]第三次中日战争爆发"
WORLD_TER.23.desc: "当地时间今晨，平津地区中日两军前线爆发武装冲突，冲突爆发三小时后，日本内阁联合军部、外务省召开紧急新闻发布会，[JAP.GetLeader]在发布会上称：“很遗憾，目前看来，日本争取东亚和平与共荣的努力被共产党无情摧毁，中日已进入全面战争状态，我们必将竭尽全力保卫广满友邦的安全，泛亚共荣理想不容践踏。”\n\n冲突爆发五小时后，[CPC.GetName]中央政府及中共中央军事委员会向全国广播了《继续伟大的抗日战争事业宣言》，《宣言》以强烈言辞抨击了日本殖民主义给东亚造成的深重苦难，誓言“要将日本帝国主义彻底赶出大陆”。"
WORLD_TER.23.a: "这是四十年前那场大战的终曲吗？"
WORLD_TER.24.t: "[Get_newspaper_header]亚洲人民解放战争结束"
WORLD_TER.24.desc: "和平的消息从东亚传来，第三次中日战争——[CPC.GetName]官方所称的“亚洲人民解放战争”的一系列战争行为中最主要的一场战争——以中国在大陆地区的彻底胜利而结束，[CPC.GetName]与日本各自派出了高级军事代表在鸭绿江前线签订了停火协议，协议内容未获两国官方披露，但双方目前已经停止了所有敌对行动。根据此前战争进程来看，中国对东亚大陆地区已基本实现完全控制，日本默认了其大陆势力的覆灭。\n\n大部分观察家认为，日本已成为全球冷战的第一个输家，未来亚革盟与共荣圈之间将围绕库页、朝鲜、台湾等地区展开地区冷战，争夺相关海域主权。\n\n尽管中日冷战阴云密布，但热情洋溢的庆典氛围仍然席卷了全中国乃至全世界，西安、南京、武汉等地纷纷举行了官方或非官方的群众庆祝游行活动，世界各地一些民间左翼组织也纷纷走上街头庆祝“反法西斯事业在东亚的成功”。"
WORLD_TER.24.a: "东方破晓。"
WORLD_TER.25.t: "[Get_newspaper_header]东亚乱局“平息”"
WORLD_TER.25.desc: "令世人震惊的消息从日本传来，裕仁天皇签署了一份命令，该命令允许日本对尚处于战争状态的中国战场无限制使用任何武器。\n\n据可靠消息，命令签署当日即有约350枚核弹头及超过1000公升生化武器被投放到中国西北地区。日本政府对此命令造成的后果保持完全缄默，有观察家指出为确保不留后患，日本对西北地区的轰炸与生化武器投放很可能将成为常态，甚至会更甚于希特勒时代德国空军对西非、俄罗斯地区的无限制轰炸。\n\n环境专家估算，由于生化武器及核辐射双重作用，中国西北事实上已成为无人区，且包括中亚、蒙古、中国东部在内的其他邻近地区在未来极长一段时间内都将面临极其严重的次生灾害威胁。美国宣布将就“应对日本在东亚暴行”紧急召开OFN安理会峰会；德国宣布将在印度洋尽快部署弹道导弹。世界局势因中国西北的毁灭而再次剑拔弩张。"
WORLD_TER.25.a: "迟早，我们都会葬身地狱。"
WORLD_TER.26.t: "[Get_newspaper_header]东亚乱局平息"
WORLD_TER.26.desc: "随着日军铁蹄开进西安、重庆等共产党政权控制的战略要地，第三次中日战争以中国抵抗势力的彻底覆灭而告终。\n\n根据日本军方透露的后续计划，原中国地区将被分割成数个军政管区“以更好服务于泛亚理想与东亚人民福祉”，大批在战争中表现出众的日本陆海军将领被提拔为军政管区首脑。\n\n其他超级大国对东亚事变的终局看法不置可否，但却都不约而同地加快了在地缘冲突前线部署弹道导弹的进程，世界局势因中国抵抗势力的毁灭而再次剑拔弩张。"
WORLD_TER.26.a: "中央之国，四分五裂。"
WORLD_TER.251.t: "故事的终结"
WORLD_TER.251.desc: "或许，故事到这里也就讲完了，我们算不准这个世界未来究竟会发生什么，在希望和热忱倒下之后，剩下的唯有冰冷的算计和肮脏的权谋。\n\n也许废土之上还会有英雄出现；也许废土会在未来孕育出毁灭全世界的疯子；也许废土只是一块废土，寂静地随着核子元素的半衰期，随着生化病毒的寿命耗尽而缓慢恢复。\n\n无论这块曾经被称作“大西北”的废土最后变为什么模样，都和屏幕后的我们无关了——说书人已经合手收摊，听书人已经起身散场，于是，意义在此终结，时间在此凝固。\n\n或许按下键盘上的ESC键退出这个荒唐的世界才是最优解，这样就不必慨叹这条世界线的世态炎凉，而我们在这里丢失的意义或许也可以在这个世界以外的世界中找回……"
WORLD_TER.251.a: "世界末日快乐，我们下个存档见。"

WORLD_TER.27.t: "[Get_newspaper_header]中国东部爆发大规模抗议"
WORLD_TER.27.desc: "近日，北京、武汉等地爆发大规模抗议活动，与会者表达了对国民政府“永久训政”和“高压恐怖统治”的不满，并开始组织游行活动。\n\n据悉，抗议活动还伴随着对六十年代以来中国各地亡故的民主运动家的纪念：诸如闻一多、储安平、遇罗克、李纯如、夏威等人的肖像开始频繁出现在游行队伍中。\n\n中华民国政府目前对抗议活动仍然保持克制和呼吁，但不排除他们的铁骑仍将开进充满异见者的街头——一如七年前他们在广西、北京的暴行一般。"
WORLD_TER.27.a: "这是1963年危机的再演。"
WORLD_TER.28.t: "[Get_newspaper_header]上海召开中华民国国是大会"
WORLD_TER.28.desc: "愈演愈烈的中国东部民主起义运动于近日达到高潮：民主运动家代表齐聚上海，召开了“中华民国国是大会”。\n\n据悉，国是大会达成了如下系列共识：宣告自治城市联盟“中国自由阵线”的成立；反对中华民国政府的白色恐怖行径；反对日本的殖民主义和霸权主义侵略；支持中国人民寻求民主自由的抗争活动；对其他民主革命势力保持友好等。\n\n大部分国际观察认为，国是大会共识中所提及的“其他民主革命势力”或为西部的共产党政权及亚洲民族革命联盟。有观察家推测，共产党及亚革盟极有可能在暗中支持和援助东部民主势力，并给予了某种形式的独立保证。"
WORLD_TER.28.a: "中国革命的曙光。"
WORLD_TER.29.t: "[Get_newspaper_header]西安召开全国政协会议"
WORLD_TER.29.desc: "盘踞中国西部的共产党政权近日在西安召开了其“全国政治协商会议”，并邀请到了多位东部民主起义代表参与会谈。\n\n在中共与东部民主人士的共同推动下，政治协商会议达成了一系列共识：东部民主代表将以独立身份加入亚革盟顾问委员会；反对中华民国政府的白色恐怖行径；反对日本的殖民主义和霸权主义侵略；支持中国人民寻求民主自由的抗争活动等。\n\n大部分国际观察认为，政治协商会议的召开表明东部民主势力选择接受亚洲民族革命联盟的武装保护。在步入七十年代，国共冲突愈演愈烈的大背景下，东部民主势力的这一选择似乎证明，中国人民已丧失了对中华民国政府的耐心。"
WORLD_TER.29.a: "中国革命的曙光。"
WORLD_TER.30.t: "[Get_newspaper_header]预料中的失败"
WORLD_TER.30.desc: "随着中华民国政府下达全面镇压命令，一度声势浩大的中国东部民主起义以彻底失败告终，截至民国政府发布最后一份镇暴令为止，北京、武汉和雷州三地共有超过七万人被逮捕，且被捕人数仍在持续增长。\n\n盘踞西部的共产党政权举行集会，公开斥责了高宗武政府“反民主反和平”的暴行，并号召东部人民同共产党一同反对“汉奸卖国政权”。\n\n然而面对共产党的号召，东部民间响应者寥寥——自1963年北京、广西起义被镇压以来，大规模的镇压与白色恐怖又一次在中华大地上占据上风，失望情绪和政治冷感正在中国东部民间快速蔓延，中国人民以这种近乎自绝于政治的姿态表达了自己的失望和对西部共产党政权的冷漠。"
WORLD_TER.30.a: "预料之中。"
WORLD_TER.31.t: "[Get_newspaper_header]共产主义者在印度东北起义"
WORLD_TER.31.desc: "虽然取得了国家统一，但近日印度态势并没有向大多数人所希望的方向发展：近日，一支号称“全印联合解放阵线”的组织在印度东北部的农村地区发动大规模起义，很快便控制了该地多个邦的政权。\n\n其领导人查鲁·马宗达表示，本次起义是为了终结资本主义和地方封建势力百年以来对印度人民的无情压迫。对于此次突发事件，印度政府很快便宣布表示这不过是共产主义者妄图分裂国家的企图所导致的又一次无谓的叛乱，并称政府已经集中力量做好防备，很快便将恢复东北地区的秩序。而多数观察家则表示，印共的大规模起义无疑证明印度当局落后的土地政策已经导致全国陷入严重的阶层分裂，因而导致了这场必然发生的起义，但不论其结果如何，印度的未来仍在未知之中。"
WORLD_TER.31.a: "南亚巨象再度跌入泥淖。"
WORLD_TER.32.t: "[Get_newspaper_header]刘文辉统一四川"
WORLD_TER.32.desc: "西康军阀刘文辉成为四川内战中的一匹黑马，在前期极度劣势的情况下赢得最终胜利，将成都和重庆收入囊中。自康藏战争爆发以来，中国西南地区终于回归和平。胜利者驱逐了境内所有国民党机构，如同广西军阀夏威，反日倾向不言自明。\n\n富士通公司公布了其重庆测试小组的部分交战记录，以及产自西北地区的枪支。证明西安当局是刘文辉的重要盟友，且与后者保持着密切联系。此种变故令中国政府始料未及，行政院批准追加新一批国防预算，发言人表示任何分裂、背叛国家的敌对势力都将受到惩罚。"
WORLD_TER.32.a1: "欢迎新朋友！"
WORLD_TER.32.a2: "共匪真难缠！"
WORLD_TER.32.a3: "听命于共产党的军阀……"
WORLD_TER.33.t: "[Get_newspaper_header]刘少奇担任国防阵线领导"
WORLD_TER.33.desc: "中国西北内陆传出一则消息，坚持抵抗日本的国防阵线政府，随着共产党大会闭幕完成领导人换届，中国共产党的二号人物刘少奇开始了他的任期。\n\n前任领导毛泽东使境内恢复秩序，扩大统治地区，担任四川内战的操盘手，而刘少奇因倾向民生的经济主张获得更多人的支持。研究中共问题的情报专家认为，更换政府首脑不代表权力变动，毛泽东允许政府对自己的政策做出某些改变，但他始终掌握最终否决权。刘少奇要用执政成果，向毛泽东证明自己的执政能力，才能维持自己的领导地位。\n\n根据目前观察，经历换届的国防阵线对东部地区没有表现出侵略性的姿态，共产党会更专注于内部事务，不过这并不意味着共荣圈能松下一口气。"
WORLD_TER.33.a1: "团结、胜利的大会！"
WORLD_TER.33.a2: "必须有所准备了。"
WORLD_TER.33.a3: "真是一则趣闻。"
WORLD_TER.34.t: "[Get_newspaper_header]毛泽东继续领导国防阵线"
WORLD_TER.34.desc: "中国西北内陆传出一则消息，坚持抵抗日本的国防阵线政府，随着共产党大会闭幕确定了新一任领导人，中国共产党的一号人物毛泽东继续连任。\n\n毛泽东使境内恢复秩序，扩大统治地区，担任四川内战的操盘手，凭借高超的执政能力化解了党内外针对他的政治攻势，他不允许政府对自己的政治方针做出任何南辕北辙的改变。研究中共问题的情报专家认为，毛泽东十分注重阵线内部对自己的忠诚，他同样希望这份忠诚能够传播到共产党统治之外的地区。\n\n根据目前观察，经历换届的国防阵线对东部地区没有表现出侵略性的姿态，共产党会更专注于内部事务，不过这并不意味着共荣圈能松下一口气。"
WORLD_TER.34.a1: "团结、胜利的大会！"
WORLD_TER.34.a2: "必须有所准备了。"
WORLD_TER.34.a3: "学不来的经验。"
WORLD_TER.35.t: "[Get_newspaper_header]日本内阁倒台"
WORLD_TER.35.desc: "今日，东京方面传出令人震惊而但又在意料之中的消息：由于对华战争惨败导致大陆易手，宫内已要求日本首相率领内阁宣布总辞。根据法律，天皇将驾临内阁，暂时领导政府，直到宫内另行指定的新内阁就职。皇居发言人称天皇未就时局发表评论，仅希望全国团结一致，抵御赤色威胁。由贵族院紧急任命的强硬派总督已经启程前往台湾。\n\n分析人士认为，东亚巨变发生之后，没有国家愿意充当日本与亚洲新生国家之间的调解人，它只能独自面对这对棘手局面。日本失去战后赖以生存的大陆，其宣称的泛亚秩序已经消亡，只剩长期孤立和萧条在等待着收割这个濒死的帝国。"
WORLD_TER.35.a: "日升之地，逢魔之时。"
WORLD_TER.36.t: "[Get_newspaper_header]东亚乱局平息"
WORLD_TER.36.desc: "和平的消息从南京传来：中华民国现已戡定内乱，盘踞中国西部数十年的共产主义政权已经覆灭。\n\n截至目前，国民政府正在迅速向原共产党控制地区增派军警与官僚，以期完全吞并西北、新疆等地并消化共产党遗留的工业资产；由于共产势力的覆灭，东亚防共协定已经完成其任务，国民政府已于稍早前宣布解散东亚防共协定，并以巨大威望成功从各省收回军政大权。\n\n据悉，日本已正式照会中国政府，邀请中国军政首脑前往台北召开裁军商讨会。一些激进评论认为，在戡定内乱军力正盛的当下，中华民国政府在对日谈判桌上已经为自己挣得了一定筹码，这场裁军商讨会很可能不会如日方所料那般顺利。"
WORLD_TER.36.a: "请看今日之域中，竟是谁家之天下。"
WORLD_TER.361.t: "密信"
WORLD_TER.361.desc: "驻台北领事馆：\n新近戡定内乱，各省军政大权亦悉数改组归正，值此胜利之际，首先预祝领事馆诸君工作顺利。\n日本已于前日邀请中央前往台湾商谈国军裁撤一事，现特告知领事馆，并派以下几项任务：\n其一，将有情报人员同你处进行对接，请务必协助情报人员在台北工作之顺利进行。\n其二，请你处即刻草拟总统讲稿，按惯例撰文即可。\n其三，你处可能于近期收到日本特务机关清剿台共的命令，务必严格执行。\n其四，请你处于三个月内协调民船运力与土地资源，我方已经正式决定协防台湾，联合防共，首批将有约12000名士兵及随行装备登岛驻扎。\n\n发信：中华民国总统府办公室"
WORLD_TER.361.a: "信后附有贺卡\n经特殊光源照射后显现了其他情报"

WORLD_TER.666.t: "[Get_newspaper_header]日本公布在南极的科考发现" #丧尸这一块
WORLD_TER.666.desc: "近日，日本科学技术审议会下属技术院（Gijutsuin）在新闻发布会上宣布，其在南极地区的科考团队发现了一种新型微生物，部门发言人宣称该发现在世界生物学史上具备划时代的意义，标志着日本帝国对德美等超级大国的科技超越，但世界其他地方对该发现反应寥寥。\n\n据科考队披露细节，该类微生物被封存在大正天皇海岸的冰盖中，尚不清楚其具体构造，目前已经将样本冷冻化后运往日本本土。技术院有关官员同时透露，对此类新型微生物的下一步研究将由大日本帝国及大满洲帝国科研部门联合开展，希图通过“科学研究的泛亚共荣”实现微生物学科的“繁荣与发展”。"
WORLD_TER.666.a: "新闻不大，脸皮不小。"
WORLD_TER.666.tt: "不过最好希望他们别捅出什么§e见鬼的篓子§!，§x不然……§!\n--------------\n你或许应该在控制台输入“ZOMBIE”——试试看，会发生什么？"

CPC_Zombie_Pre.1.t: "封锁线之内"
CPC_Zombie_Pre.1.d: "深秋，一列从本土驶来的火车在哈尔滨站缓缓停靠。宫泽裹紧了他的大衣，走下站台时呼出的白气迅速凝结。作为内阁调查室的事故调查官，宫泽被一纸密令派来处理一桩被官方定义为“高级别研究事故”的烂摊子。哈尔滨的空气里混杂着煤烟和一种他从未闻过的、刺鼻的化学品气味，让他很不舒服。一辆黑色的军用轿车早已等在站外，沉默的司机和他熨帖的西服上挂着的菊花纹章，都说明了这次任务的敏感性。\n\n车辆颠簸着驶向郊外，最终在一道由铁丝网和荷枪实弹的士兵构成的封锁线前停下。这里是地图上不存在的地方。宫泽下车时，看到入口哨所旁一面斑驳的水泥墙上，用红色油漆涂写的巨大编号早已剥落殆尽，只剩下一个饱经风霜的“七”字，在阴沉的天空下显得格外突兀。一名军官核对了宫泽的证件，眼神里充满了对文职人员的不屑与怀疑。“宫泽先生，欢迎来到第七号临时设施，”他生硬地说道，“石川博士的研究，连同他本人，都出了些……意外。所长在里面等您。”\n\n研究所的主建筑是一座巨大的堪称“野兽派”风格的堡垒，粗野、压抑，墙体上布满了深色的水渍。所长是个眼神锐利的老军人，他的办公室里闻不到任何药味，只有浓烈的茶香和陈年皮革的味道。他将一份薄薄的档案推到宫泽面前。“石川博士，帝国最优秀的大脑之一，”所长用不带任何感情的语调说，“他太投入了，精神过度紧张，上周已经由军方护送回国接受长期疗养。”宫泽没有碰那份档案，他知道里面写的每一个字都是谎言。“我需要查看他的实验室，以及他最后经手的所有资料，特别是关于‘冰核计划’的。”他平静地回应。所长的嘴角抽动了一下，最终还是点了点头：“奉东京的命令，我们会配合你。但宫泽先生，你要明白，有些地方，即便是调查官，也不该把鼻子伸得太长。”"
CPC_Zombie_Pre.1.o: "宫泽知道，他要找的真相，就在石川那间被贴上封条的实验室里。"
CPC_Zombie_Pre.2.t: "沉寂的病房"
CPC_Zombie_Pre.2.d: "士兵用一根撬棍砸开门上生锈的锁扣，随着“吱嘎”一声刺耳的呻吟，石川博士的实验室展现在宫泽面前。一股浓烈的、混合着福尔马林与陈年铁锈的气味扑面而来，但他面不改色，只是用审视的目光扫视着房间。这里的布局本身就是一封自白书：一侧是帝国最精密的分析仪器，另一侧则是一面巨大的单向观察窗，冰冷地凝视着房间中央那张空无一物的金属手术台。手术台正下方的地面上，一道异常宽大的排水格栅，像一道丑陋的伤疤，无声地证明着这里曾有大量的有机废弃物被匆忙冲刷过。宫泽的目光在角落里一排排贴着模糊不清标签的玻璃罐上短暂停留，里面浸泡着早已失去原型、令人不安的组织标本。\n\n石川的工作台被清理得异常干净，仿佛有人想刻意抹去他存在的痕迹。但在一个上锁的抽屉里，宫泽找到了一本厚厚的硬皮日志。他翻开日志，石川那工整而克制的笔迹立刻映入眼帘。日志的前半部分充满了对“样本7-B”的挫败感。“……它对所有已知的催化剂、培养基都毫无反应。其细胞壁结构坚固得匪夷所思。我感觉我简直是在和一块冥顽不灵的石头打交道……” 宫泽快速地翻阅着这些失败的记录，直到日志的后半部分，一个词的出现让他停下了手指。“10月17日。三号‘素材’在隔壁房间因‘急性排异反应’而被处分时，样本的内部能量波动出现了剧烈的、前所未有的峰值。” 宫泽的指尖在“素材”这个词上轻轻敲了敲。他找到了那个被所长和官方报告刻意忽略的关键变量。石川接下来的记录证实了他的判断，但其内容远超他的预想：“7B需要一个能够产生强烈神经电信号的复杂生物体来激活它的真正形态。当宿主承受极端的痛苦或恐惧时，7B会苏醒，它会从宿主的痛苦中释放一串完全固定的电信号，然后……宿主的细胞就会开始极速增殖。”\n\n宫泽感到一阵寒意。他放下日志，目光投向实验室最深处一个独立的低温培养箱。上面贴着石川亲笔书写的警告：“绝对隔离-7B次级衍生物”。他戴上厚重的防护手套，打开了培养箱。里面只有一个培养皿，皿中的景象让他这位见惯了尸体的调查官也感到了胃部的一阵抽搐。那是一团暗红色的、仿佛还在微微脉动的肉块，但真正让他瞳孔收缩的，是从肉块中刺出的、数十根如同黑色金属丝线般的菌丝。这些菌丝以一种缓慢但不可阻挡的姿态，缠绕并侵入了培养皿的玻璃壁。在菌丝与玻璃接触的地方，界限变得模糊，仿佛玻璃正在被同化，变成了菌丝结构的一部分。宫泽用镊子轻轻触碰了一根探出皿外的菌丝，触感坚硬而冰冷，完全不像任何有机物，反而更像是某种柔韧的合金。"
CPC_Zombie_Pre.2.o: "这他妈是什么……"
CPC_Zombie_Pre.3.t: "“麒麟”的低语"
CPC_Zombie_Pre.3.d: "宫泽合上了石川的日志，那团在培养皿中缓缓蠕动的血肉与金属的混合物，在他脑海中挥之不去。他很清楚，石川在失踪前，必然已经意识到了自己创造出了何等恐怖的东西。但他为何没有销毁它？又或者，他想从中探寻什么更深层的秘密？宫泽重新翻开日志，仔细查阅石川最后的几篇记录。他发现石川的研究重心，从次级衍生物本身，转移到了它的源头——那个被“样本7-B”散发的、由极端痛苦所引发的神秘“信号”。石川在日志中反复提及一台设备：“麒麟”。这台机器是研究所从一家濒临破产的西方公司收购来又花了大力气改造一番的实验性产品，其设计理念堪称异想天开，用途是将电信号加工为文字讯息，又以某种加密编码形式转化为可视化的彩色光信号。\n\n宫泽在实验室布满灰尘的角落里找到了这台落满灰尘的机器。它像一个笨重的铁柜，连接着一个圆形的、如同潜水艇舷窗般的示波器屏幕。按照石川留下的复杂操作步骤，宫泽费力地将机器启动。在一阵低沉的嗡鸣声后，示波器的屏幕亮了起来。屏幕上没有出现任何可被理解的波形或数据，而是一片深邃的、不断变化的、由无数彩色光点组成的动态“星云”。那景象诡异而美丽，像是有人将一整个银河系揉碎了，装进了这个小小的屏幕里。宫泽明白了石川面临的困境。这根本不是能用常规方式记录的信号。信息本身，就存在于每一个光点的色彩、位置和明暗变化之中，所有这些元素共同构成了一个整体。任何试图将其简化为线性数据的做法都会导致关键信息丢失。石川在日志的最后写道：“线性转换是无用的。这就像试图写下一个梦。整张图片本身，才是信息。我必须找到一种方法，将这张‘图片’本身，原封不动地保存下来。”"
CPC_Zombie_Pre.3.o: "他知道，石川一定把图片藏了起来。"
CPC_Zombie_Pre.4.t: "械灵协奏"
CPC_Zombie_Pre.4.d: "宫泽离开了石川的实验室，径直走向了这座设施的神经中枢——“麒麟”中央处理机所在的主机房。一打开沉重的铅制大门，刺耳的嗡鸣声与冷却风扇的呼啸便扑面而来，空气中充满了滚烫的电路板和臭氧的味道。一排排顶到天花板的金属机柜如同沉默的哨兵，机柜上一排排高速旋转的磁带卷和无数闪烁的指示灯，让整个房间看起来像一头正在沉睡的钢铁巨兽的内脏。这里是帝国最顶尖技术的结晶，也是石川最后进行他疯狂实验的场所。\n\n宫泽的目标很明确。如果石川试图保存那段来自“麒麟”的加密信号，那么输出设备一定会留下痕迹。他在一台电传打字机旁找到了证据：一箱装得满满的穿孔纸带，纸带上布满了毫无规律的孔洞，像一封被彻底搅乱的密码信。这显然是石川最初的、也是最失败的尝试。他试图将那片彩色的“星云”翻译成线性的文字或二进制代码，结果只得到了一堆无意义的垃圾。这证明了宫泽的猜想，也证明了石川已经走入了死胡同。\n\n就在宫泽准备放弃这条线索时，他的脚踢到了一个被丢弃在机柜下的金属废纸篓。里面除了一堆揉成一团的草稿纸外，还有一张被撕掉一半的绘图纸。他捡起那半张纸，上面是石川用铅笔写下的、仿佛在与自己争辩的潦草字迹：“……线性输出是死路一条。这信号不是一句话，或一段文字。它是一幅画。必须将整个屏幕……每一个光点，每一种颜色，每一个明暗的瞬间……作为一个整体来‘拍照’，用数据的方式。不是翻译，是复写。必须欺骗‘麒麟’，让它以为自己在进行一次完整的内存转储……” 宫泽的瞳孔猛地一缩。他明白了。石川放弃了“翻译”，转而选择了“复制”。他要将那整个动态的、充满信息的彩色噪点图像，伪装成一次普通的系统数据备份，完整地保存下来。他立刻开始在主机房庞大的磁带库中寻找，最终，他的目光锁定在一个不起眼的架子上。那里有一个被石川做了手脚的磁带卷，官方标签被撕掉了，上面用白色油漆潦草地手写着一行字：“系统诊断程序备份-10月28日”。"
CPC_Zombie_Pre.4.o: "他拿起了那卷磁带，现在，他需要找到一台能够读取它的“眼睛”。"
CPC_Zombie_Pre.5.t: "三色信经"
CPC_Zombie_Pre.5.d: "宫泽拿着那卷冰冷的磁带，回到了石川的实验室。主机房里的那些通用设备，无法解读石川用疯狂的智慧加密过的数据。他很清楚，石川一定是在他自己的这片领地里，用某台特殊的、经过改造的机器，完成了最后一步。他的目光最终锁定在角落里那台实验性的彩色监视器上。这台机器孤零零地立在那里，屏幕像一只紧闭的眼睛。这就是石川用来观察“梦境”的窗口，也必然是重新打开它的唯一途径。\n\n直接播放磁带是行不通的。那无异于让一个不懂乐理的人去阅读一份交响乐的总谱，只能看到一堆杂乱无章的音符。宫泽需要的是石川的“语法书”，是他为这个疯狂的数据交响乐制定的规则。他开始对石川留下的所有私人物品进行第二次、更加细致的搜查。在一个被遗忘的档案柜深处，他找到了一个属于石川的私人箱子。箱子里没有机密文件，只有一堆看似毫无关联的学术资料，以及几本厚厚的笔记。\n\n在第一本笔记的夹层中，他找到了那张熟悉的、半透明的绘图纸。纸上用红、绿、蓝三色铅笔精心绘制着三个交错的正弦波。旁边有一行注解：“第一步：将画布展开——那些色彩可以被数字分解，把它们逐个噪点地拉伸成一根数字组成的琴弦。”\n\n在第二本笔记中，他发现了一张被剪下的电传打字机通用字符集参照表。石川用红笔在旁边写道：“第二步：转写。原始的‘旋律’是机器的呓语，必须将其转写为一种通用的、标准化的‘文字’。转录后的文本本身没有意义，它只是一个容器。”\n\n最关键的发现来自最后一本笔记。里面夹着一张被反复折叠的穿孔卡片。卡片上密密麻麻的孔洞，像一种神秘的象形文字。笔记的最后一页，是石川近乎癫狂的笔迹：“第三步：重构。绝对不要试图去‘阅读’那些转录后的文字！那些文字是新的蓝图。真正的讯息，隐藏在最终构成的那个‘图案’里。它不是用来读的，是用来‘看’的。一个新的符号，一个需要用机器之眼才能识别的锁孔。”"
CPC_Zombie_Pre.5.o: "像是俄罗斯套娃一般。"
CPC_Zombie_Pre.6.t: "图例7-B"
CPC_Zombie_Pre.6.d: "宫泽拿着那卷冰冷的磁带，回到了石川的实验室。这一次，他的目标明确而唯一：那台孤零零地立在角落里的实验性彩色监视器。他将那卷伪装成“系统诊断程序备份”的磁带装入驱动器，然后小心翼翼地绕过了电传打字机的输出线路，将信号直接接入了彩色监视器的端口。他深吸了一口气，按下了“麒麟”主机上那枚沉重的启动按钮。机房的灯光为之一暗，巨大的风扇开始咆哮，仿佛一头钢铁巨兽从沉睡中被惊醒。\n\n在一阵高亢的电流声后，监视器的屏幕闪烁了几下，慢慢预热。最终，一片深邃的、由无数彩色光点组成的静态图像稳定地显示出来。它就是石川的“梦境”，被凝固在时间中的那一瞬间的疯狂与美丽。这片彩色的噪点与他之前在示波器上看到的动态景象几乎一模一样，但此刻它失去了生命，变成了一具徒有其表的华丽尸体，静静地等待着被解剖。宫泽知道，这就是石川留下的最终信息，一封用色彩和光芒书写的、无法用言语阅读的密信。\n\n他的目光在监视器机身上搜寻，很快，他在设备下方找到了一张官方的金属铭牌。上面刻着一行整齐的日文。他又从旁边的文件架上抽出一本厚厚的设备维护手册，翻到附录页。手册上的图例编号，与铭牌上的文字完全一致：“图例7-B：示波器校准噪点样本”。宫泽的嘴角露出了一丝冷笑。他终于看到了石川那近乎完美的伪装。在任何一次例行检查中，这幅图像都会被当作无意义的技术参考图而被忽略。石川成功地将他最危险的秘密藏在了最众目睽睽的地方。\n\n“石川博士，你也会有犯错误的时候么，还是说，你想宣示什么？”宫泽的视线下移，看到了这一页最底下石川用铅笔写下的字迹，露出了一丝疑惑。"
CPC_Zombie_Pre.6.o: "“我已经随心所欲，你们也随心所欲吧。”\n（私は好きにした、君らも好きにしろ）"
CPC_Zombie_Pre.7.t: "报告归档"
CPC_Zombie_Pre.7.d: "宫泽没有在主机房久留，操作手册上没有留下那幅图例——纵然有，他也不可能冒着破坏证物的风险撕下照片带走。于是，宫泽利用“麒麟”连接的一台照片打印机，将屏幕上那幅“图例7-B”以最高分辨率输出到一张厚实的相纸上。他回到石川的实验室，将那本关键的日志和三份写满解密思路的笔记一同收入自己的公文包。他最后看了一眼那个独立的低温培养箱，里面那团畸形的血肉依旧在缓缓脉动。他没有更多动作，只是在箱子上重新贴了一张新的、写着“样本污染，待焚烧销毁”的封条。这东西本身，连同整个设施，都将成为他向上级报告的、完美的烟幕弹。\n\n当他走出这座被剥夺了名字的设施时，阳光有些刺眼。他向面无表情的所长提交了一份初步报告，将一切归咎于石川博士在重压之下的精神错乱，以及由此引发的实验规程混乱。他声称所有高风险研究资料均已销毁，建议将设施进行永久性物理封存。所长没有多问，只是点了点头，对他来说，一个可以写入档案的结论比真相重要得多。\n\n黑色的军用轿车在身后扬起一片尘土，将那个刻着“七”字的墙壁彻底淹没。宫泽靠在后座上，闭上了眼睛，手中紧紧攥着那张打印出来的、充满彩色噪点的照片。"
CPC_Zombie_Pre.7.o: "现在，这片彩色的混沌只属于他一个人了。"
CPC_Zombie_Pre.7.o.tt: "§F图例已存档至一个特定目录。\n\n制作组注：\n进入本模组文件夹，您将看到一个名为Folder-7B的文件夹，故事中最关键的“图例7B”及其所蕴藏的谜题便在于此。\n欢迎解密，并将您的成果报告到我们的工坊评论、Discord社区或频道讨论区，我们将在下次丧尸模式版本§e怨咒残响§!的版本介绍中特别鸣谢成功解密的各位玩家，并为该版本增加§G真结局路线§!。\n\n本次解谜活动同时是即将发布的TNO子模组§m《远星之召》§!的预热活动，成功解密后，§m《远星之召》§!亦会解锁额外的剧情情报供玩家探索！§!"