###DESC
Mao_Zedong_DESC: "自三十年代中期毛泽东取得中共最高领导权后，他就像一位妙手回春的神医，屡屡给病患开出超出常理的药方，比如与视若仇雠的国民党建立统一战线，共同抵御日本入侵；同时坚持与国民党的联盟内独立自主的地位，在抗日战争的大潮中不断壮大共产党在国内的实力与影响。这几乎同时惹怒党的左右两翼，引发他们喋喋不休的指责。但毛泽东依旧故我，而世事发展往往能够印证他的方法之正确，正因如此在无数党员干部崇拜的目光中，他一步步登上政治顶峰，成为全中国的共产主义领袖。在美国记者斯诺的采访中，他不无感慨地坦言中国的革命领导是“山中无老虎，猴子当大王”。\n\n当国军在中条山惨败的噩耗传到延安时，毛泽东情绪失控了，他扯碎战报，大骂蒋介石成事不足败事有余，让中国丢尽战场优势。一个月后苏德战争中苏联的惨败更使中国抗战前途愈发渺茫，毛泽东眼中的光芒黯淡了。1947年重庆与南京在日本监督下宣布“宁渝合流”的那天，是毛泽东革命生涯中的至暗时刻。\n\n窑洞中，毛泽东缓缓铺开地图——中国彻底破碎了，她重归一统的那一天在日渐衰老的毛泽东看来正变得遥遥无期。枯涩的眼中垂下一滴浑浊的泪，毛泽东挥手抄下一首中国唐代的古诗：\n茂陵刘郎秋风客，夜闻马嘶晓无迹。\n画栏桂树悬秋香，三十六宫土花碧。\n魏官牵车指千里，东关酸风射眸子。\n空将汉月出宫门，忆君清泪如铅水。\n衰兰送客咸阳道，天若有情天亦老。\n携盘独出月荒凉，渭城已远波声小。\n\n尽管败于日本之手，但革命的红旗仍迎风飘扬在西北的大地上，象征着全中国仅剩的一片自由净土。时间无情地走进五十年代，在制定经济计划的过程中，毛泽东变得越来越急躁，似乎中国再不拽住“社会主义”这根稻草，就要彻底灭亡在日本的铁蹄之下。这几乎变成毛泽东的执念，也使他极度焦虑地催促同志们执行愈发天马行空的想法，最终造成难以逆转的损失。梦想朝毛泽东挥一挥手，飞奔远去，只留下稀疏的背影，中国革命的前途也因他心性浮沉而变得飘忽不定……"
Liu_Shaoqi_DESC: "刘少奇始终思考着这样一个问题：共产党代表什么力量，又要依靠谁去取得胜利？\n\n早年风起云涌的工人运动，使他在实践中淬炼成长。一次次组织罢工、谈判与动员，让他深刻体会到，只有把分散的力量凝聚成有纪律、有方向的队伍，工人阶级才能真正站起来。日复一日的组织工作也让他逐渐形成了自己的认识：中国革命需要一支有理想、有组织、有牺牲精神的先锋队，引导广大劳动群众为自身解放而斗争，直至胜利。\n\n延安岁月里，即便主要从事城市工作，刘少奇也积极投身根据地建设。他并不把城市与乡村对立起来，在他看来，共产党要团结和组织的是最广大的劳动者，无论身处工厂还是田野，关键在于把群众发动起来、组织起来。\n\n整风运动中，他在理论阐述和组织推进上付出大量心力，使全党在思想上逐步趋于统一。由于这些工作，他多次被委以重任。党内一度流传“合党必毛，分工有刘”的说法，既反映了分工协作的格局，也体现出他在组织体系中的重要位置。随着革命形势的发展，他承担起更多统筹城市工作的责任，这既是组织安排，也是对他能力的信任。\n\n五十年代的曲折岁月中，刘少奇更加注重制度建设和经济恢复，希望通过扎实稳妥的措施，使国家秩序尽快稳定下来，让人民生活逐步改善。他在一些具体政策和节奏把握上与毛泽东存在分歧，但这些讨论大多围绕如何更好地推进社会主义建设展开。凭借务实的作风和对工作的投入，他赢得了不少同志的认可。面对繁重复杂的中央事务，他有时会坦率表达不同意见。在他看来，党内开展批评与自我批评，是共产党人应有的政治品格，也是为了共同的事业更加稳固前行。"
CPC_THENEWORDER_DESC: "曾经共产党与国民党同仇敌忾，为民族自由抛头颅洒热血。往事历历在目，神圣的抗日大业一度凝聚起中国西部决心继续抵抗的人，他们与投降的汉奸政权没有任何妥协可言。\n\n中国共产党如愿以偿成为“全中国”的领导者，可相比于苏联共产党，她的统治既青涩又草率。突然膨胀的政府就像一团乱麻，政治协商中的争吵往往被共产党视为阻碍并采取直接手段，而党外人士对共产党独断专行的作风也失去了耐心。\n\n当日本的威胁略一退潮，阵线内共产主义者与保守派之间的分歧便显得尤为尖锐，他们为是否推进革命吵得不可开交。旧日恩怨重新浮出水面，深陷囚徒困境的阵线各方，心甘情愿背叛了彼此。现在，国防阵线只剩共产党，她更加激进地褫夺了分裂者存在的权利，孑然一身独自面对布满荆棘的前程。"

