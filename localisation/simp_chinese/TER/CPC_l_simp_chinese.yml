 ###新闻头图
TNO_newspaper_header_CPC: "\n£custom_header_CPC\n\n\n\n"
BOOKMARK_CPC_INFO: "§x西北国防阵线§!"
BOOKMARK_CPC_INFO_DELAYED: "§F归属§x新秩序：东方红§!开发团队\n§L关山月§!版本，新鲜出炉：\n§Y-翻新了§x九大§!前的大量内容\n-重做增补了部分剧情\n-优化了大量机制§!\n§W--------------\n\n£GFX_texticon_bookmark_CPC\n\n\n\n\n§!§F仰箭射空力尽，依然坠地何言。\n虚空拶破强参禅。肯把金丹烧炼。\n——夏元鼎《西江月》\n\n十三年前，国防阵线用一场堪称悲壮的保卫战向全世界证明，中国革命的未来不会被自东而来的豺狼虎豹吞噬。这巨大的胜利为她带来了无以复加的声望，然而，反抗命运所获得的奖励却很快变成了魔咒：德高望重，带来的便是香火鼎盛，香客们各怀异心前往大西北敬主朝礼，便要在暗处生出许多因果纠缠——及至最后焦头烂额，昏招频出，倒也难免。\n\n该版本中，玩家将获悉国防阵线建立十三年以来的所有历史，了解西北危机肆虐的缘由，并要从中拼杀出一条求生之道，为中华民族受压迫百姓之解放，为亚洲穷苦人民之解放留下最后的火种。\n\n投身这段历史吧，我们会在没有黑暗的地方再会。§!"
BOOKMARK_FBM_BLOCKER: "§L新疆省§!"
BOOKMARK_FBM_BLOCKER_DELAYED: "§F归属§V新秩序：疆外火炬§!开发团队\n纪念§m新秩序：美丽新世界§!亚洲团队\n将在§V疆外火炬§!版本中发布\n-将发布§L独立工坊Demo§!\n-同时将成为§x新秩序：东方红§!的§Y平行世界剧本§!§!\n§W--------------\n\n£GFX_texticon_bookmark_XIN\n\n\n\n\n§!§F如果，新秩序以更猛烈的风暴摧毁了中华大地上的几乎一切抵抗者……\n如果，世界线变动的涟漪始于四川会理的山雨之中……\n\n时值1962年，尽管早已退居幕后，行将就木的盛世才仍以尖利的目光逡巡着迪化的每一寸土地，扫视着天山的每一座险峰，企图牢牢抓住新疆的权柄——历史已经多次证明，他是这片土地真正的王，是带领新疆屹立于中亚的智者：一开始，他和斯大林眉来眼去，通过哈萨克的陆路恣意地汲取秋明政府的援助；西西伯利亚崩溃后，他又立刻合乎时宜地掀起了收回利权运动，收回取利之权，断绝了同秋明的联系，向仍在政府中的共产党人举起了屠刀——\n\n——但，要论这位王者唯一的心病，还是非共产党莫属：陈潭秋、阿巴索夫、阿合买提江这些人仗着新疆地广人稀，如狡猾的脱兔般从反帝会逃走，两年的清洗运动竟只有一个俞秀松落网，他的人生中还未有过如此挫败！\n\n暴怒逐渐转化为无奈，继而幽幽萦绕在心头成为一块触之即痛的瘢痕，盛世才逐渐老迈的脑子里生出了一个新的点子——或许是时候该和日本通通电话了……\n\n然而，这次他还能如愿吗？§!"
BOOKMARK_LMC_BLOCKER: "§O朝鲜总督府§!"
BOOKMARK_LMC_BLOCKER_DELAYED: "§F归属§O新秩序：晨曦之地§!开发团队\n纪念§m新秩序：美丽新世界§!-§O太阳的季节§!开发团队\n将在§O晨曦之地§!版本中发布可玩内容\n§O朝鲜总督府§!内容属于§x新秩序：东方红§!世界线§!\n§W--------------\n\n£GFX_texticon_bookmark_GGC\n\n\n\n\n§!§F对日本这样一个志在称霸亚洲的现代帝国而言，朝鲜半岛是它殖民帝国霸业上的第一环扣。半岛南距九州岛仅250公里，向北穿过长白山就是东北亚大陆：那里是白山黑水，是万顷黑土，是帝国最值得骄傲的工业基地——这样优越的地域桥梁枢纽带给了帝国的继业者们一个美丽诱人的构想。\n\n时值1962年，对马海峡隧道的完工昭示着这一划时代的构想即将成为现实：从此以后，大陆输入的工业原料将可以通过陆运手段送回日本本岛；而帝国臣民们可以快捷地通过列车前往大陆，不必受水路的跌宕漂摇和空路的担惊受怕——\n\n换言之，“内鲜一体”，似乎马上就要从美好构想变为现实了。\n\n水晶杯中盛着猩红的酒液，朝鲜半岛在觥筹交错中迎来了她的新主人，这位新主人乏善可陈，和他的所有前任一样残忍、狡黠、忠于帝国——千人一面，令人生厌，只会重复泛亚共荣的呼号，也只会加强本就残酷的殖民控制，这一切都似乎向世人控诉着一个惨痛的事实：朝鲜从未存在过，这片土地上从过去到现在到未来都只有天皇陛下的忠诚臣民们生活。\n\n但朝鲜真的死了吗？\n\n坦率地说，或许我们从一开始就不能从日本的角度切入朝鲜的故事——不妨把目光投向汉城的街巷、全罗的田野、长白的雪林，那里或许有坚忍刚毅之人能承载朝鲜民族最后的精气神。§!"
