CPC_diplomacy_front: "对外战线"
CPC_diplomacy_front_desc: "依据党的八大精神，我们全面重启了对外工作，将目光投向国防阵线以外，甚至中国以外的其他地方。\n这其中既有地下战线的同志在为革命事业奔走，也有外交战线的同志活跃在亚洲各国的使馆中，务必审时度势，制定合适的外交策略，方能为亚洲革命事业提供助力。\n\n制作组注：我们将于§Y1.2版本：雾隐孤鸿§!扩充本决议组，以形成完备的国防阵线§Y外务及地下战线§!机制及剧情，敬请期待。"
CPC_trip_to_Shanxi: "==决议组：§Y山西§!=="
CPC_trip_to_Shanxi_o1: "旧事重提"
CPC_trip_to_Shanxi_o1_desc: "白区地下党要活跃起来，重建情报组织，并派专人联络傅冬菊同志，向她了解山西的地下活动程度。"
CPC_trip_to_Shanxi_o2: "晋北夜话"
CPC_trip_to_Shanxi_o2_desc: "傅作义已经生命垂危，傅冬菊向党中央保证在两周之内联络山西内部的抗日爱国人士，以高层元老会议的名义从中取事。"
CPC_trip_to_Shanxi_o3: "强渡黄河"
CPC_trip_to_Shanxi_o3_desc: "傅作义提前死亡使山西形势更加紧迫复杂，为了给傅冬菊同志争取更多的时间和底牌，中央决定筹划一次佯攻任务，派遣特工进入吕梁山区发动群众，造成“共匪猖獗”的假象。"
CPC_trip_to_Shanxi_o4: "放虎归山"
CPC_trip_to_Shanxi_o4_desc: "傅冬菊同志联络到高树勋和黄樵松两位与我党曾进行深度合作的爱国将领，他们会借山西边界不稳的势头率领军队集体出走晋北大同，在那里建立抗日民主政权公开对抗晋系军阀。"
CPC_trip_to_Shanxi_o5: "兵戎相见"
CPC_trip_to_Shanxi_o5_desc: "梁敦厚不会纵容地方叛乱，现在已经动员军队入侵晋北民主政权，我们要继续动员山西地区的人民群众，从农村到城市全面破坏梁敦厚的备战计划。"
CPC_trip_to_Shanxi_o6: "干戈玉帛"
CPC_trip_to_Shanxi_o6_desc: "在人民政权的不懈努力下，军阀梁敦厚终于愿意坐在谈判桌上和我们好好谈一谈大同的政治地位，我们绝不会放弃任何一个朋友。"
CPC_DAT_rebuild_army_tt: "将整编§Y晋北国防阵线§!编制为§Y解放军§!编制。"
CPC_trip_to_Shanxi_o7: "建立煤炭运输通道"
CPC_trip_to_Shanxi_o8: "办理大同技术培训快速班"
CPC_trip_to_Shanxi_o9: "建立大同国营分厂"
CPC_trip_to_India: "==决议组：§Y印度§!=="
CPC_trip_to_India_o1: "联络印共（马列）"
CPC_trip_to_India_o1_desc: "我们将派遣代表同印共（马列）的同志接触，向他们传达我党的意见和建议。"
CPC_trip_to_India_o2: "巩固印共（马列）北方邦根据地"
CPC_trip_to_India_o2_desc: "印度同志在印度的数个北方邦拥有合法执政的外围掩护组织，他们以这种手段为依托秘密经营根据地。我们可以通过巩固他们在这些地方的根据地提高他们在印度政坛的话语权，同时也能通过北方边境派遣代表团自陆路入境，避免空路航运遭到日本袭击。"
CPC_trip_to_India_o3: "访问加尔各答"
CPC_trip_to_India_o3_desc: "我们自东北部边境入境，第一站便是印度在东方的最大城市——加尔各答，这里是自由印度时期的政府驻地，集结了大批主张激进的共产主义者和民族主义者，我们可以在这里进行一次宣传造势活动。"
CPC_trip_to_India_o4: "达成初步共识"
CPC_trip_to_India_o4_desc: "表面上，印度谈判人员对我方提出的中印同为日本侵略受害者的观点不置可否，但他们仍然明里暗里表露出赞同的内心独白。既然已经摸清了对方政府态度，就让我方人员坦率地提出条件，乘胜追击。"
CPC_trip_to_India_o5: "转访德里"
CPC_trip_to_India_o5_desc: "本次外交访问的最终目的地仍然是德里，我们的外交人员将做好一切准备，为国防阵线赢得自南亚而来的支持和援助。"
CPC_trip_to_India_o6: "达成外交协议"
CPC_trip_to_India_o6_desc: "我们关于合作共谋发展机遇的提议在印度政府高层内获得了广泛认可与共鸣，趁此机会，代表团将通过美国驻印大使向美国提出目前根据地遭遇的困难，以及表明西北国防阵线对美国的亚太战略的巨大益处。"
CPC_trip_to_India_o71: "接收美国技术专员"
CPC_trip_to_India_o72: "接收美军代表团"
CPC_trip_to_India_o73: "建设中印陆上口岸"

CPC_Hanzhong_construction: "建设汉中"
TER_HZ_desc: "\n在§G三面红旗§!的指引下，根据地人民用十二年时间将§W西安§!建设成为一座§G坚不可摧的堡垒§!。但是还远远不够，西北仍处于§R核战争§!的阴影之下。\n\n我们不惮以最坏的想法预设未来的战争走向：国民党反动政权勾结日本侵略者使用§R原子弹§!轰炸根据地。§W西安§!作为根据地最大的城市，将首当其冲成为被轰炸目标。为了应对§R最终情况§!，党中央决定开启§W汉中堡垒计划§!：在六至七年内，将汉中市建设成为根据地第二座中心城市。\n\n一旦§W西安§!在§R核打击§!中灰飞烟灭，根据地必须在§W“第二中心”§!的指挥下运转如常。中国人民不会向日本帝国主义的原子弹低头！"
TER_HZ_info_detail: "§W按照五十年代末的总体规划，除去已经建成的老城区外，汉中将拥有§!§Y6个功能各异的市区§!，但由于经济凋敝等客观原因，建设汉中的项目迟迟未得开展，如今根据地战事稍平，我们将调动一切可用的建筑资源援建汉中。\n\n在完成§Y宝汉公路、西汉铁路修缮§!的工程后，我们将有条件开始§Y修建市区§!，每个市区的修建时长均为§Y300天§!，每个§Y市区§!的功能侧重点并不一致，请做好规划。根据总体规划目标，每§Y2个市区§!建成将为当地新增§Y1级防空火炮及雷达站§!。\n\n图例：\n§Y黄色图样§!为农田\n§R红色图样§!为主干道\n§G绿色图样§!为辅路\n§F灰色图样§!为铁路\n§D青色图样§!为建筑物"
CPC_HZ_1_dec: "修缮宝汉公路、西汉铁路"
CPC_HZ_1_dec_desc: "我们需要在西兰铁路的基础上修建一条新的西汉铁路，并重新修缮民国时期业已建成的宝汉公路，扩大运力，以便后续向汉中运输工程机械建筑材料等重要物资。"
CPC_HZ_unlock: "随着公路铁路修缮完成，§Y汉中新市区§!的建设将正式启动。"
CPC_HZ_E1_dec: "建设§Y东南城区§!"
CPC_HZ_E1_dec_desc: "在规划案中，§Y东南城区§!将承担汉中的§Y政府职能§!。"
TER_HZ_E1_fin: "§Y东南城区§!建成"
CPC_HZ_E2_dec: "建设§Y东北城区§!"
CPC_HZ_E2_dec_desc: "在规划案中，§Y东北城区§!将承担汉中的§Y工业职能§!。"
TER_HZ_E2_fin: "§Y东北城区§!建成"
CPC_HZ_W1_dec: "建设§Y西内城区§!"
CPC_HZ_W1_dec_desc: "在规划案中，§Y西内城区§!将承担汉中的§Y市民服务职能§!。"
TER_HZ_W1_fin: "§Y西内城区§!建成"
