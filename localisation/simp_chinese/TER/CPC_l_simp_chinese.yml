CPC_funni.3.t: "别冒充"
CPC_funni.3.d: "人力车驮着夏田牟人来到国立美术馆。下车后，夏田用不熟练的汉语和车夫咋咋呼呼地讨价还价，把车夫打发走后，他带着从教育部买来的受聘书，得意洋洋地走进国立美术馆，任职客座教授。\n\n在校方安排下，柯璘德莫名其妙的成为夏田牟人的助理，为夏田打杂。半年后，夏田牟人未经柯璘德同意，将他要截至交稿的一幅公益油画拿去发表。柯璘德同他理论，夏田却振振有词：“年轻人，要有匠心，你想想看，今天你帮我获奖，等我跻身上流圈子后自然会提携你的。”无耻之尤！柯璘德心里骂道。二人争执逐渐升温，闹到法院。开庭前两天，一个陌生人登门拜访，冷不丁威胁道：“把诉状撤掉，夏田先生是中日友好的模范代表，你的做法不利于亲善。”柯璘德又气又笑，但还没等柯璘德开口，陌生人一记闷棍将他打晕，带至别处。\n\n第二天，一份画押的撤诉书和一份道歉信被分别送至法院和夏田牟人的宅邸。法院照常受理，取消了诉讼，而夏田也展示了“大度”，劝诫助理不要再次犯错。夏田牟人着实狂妄，每次和朋友喝酒的时候，都要拿这次“敲打想要‘冒充’他作品的学生”来炫耀他的手腕，他描述得绘声绘色，似乎真有这么一位学生在“冒充”他的作品。而真正的受害者柯璘德，现在正躺在家里养伤。两个月痊愈后，他发现，除了“展现大度”的夏田牟人之外，其他的导师都对他避之不及，生怕惹上什么事。他只好不情不愿的重新成为夏田牟人的助理，默默忍耐着剥削。\n\n但事情很快便出现转机，国府路事件后，国军开始全城戒严。但扬汤止沸，暗潮汹涌。地下记者林壹捌带着他拍的照片找到柯璘德，恳请他画一幅爱国抗日的宣传画，一同张贴宣传。饱受压迫的柯璘德一口答应。两天后，一张照片和一幅宣传画便被张贴在大街小巷：照片是国军正在镇压驱赶抗议的爱国学生；宣传画则是一个壮硕的男人弯弓射日，同时题字道“团结一致，共同对外”。\n\n大街小巷上，吃早饭的人，做体力活的人，纷纷议论着照片与油画，并对国民党媚日卖国的行径表示不耻与愤慨。夏田牟人如往常般乘着人力车到美术馆上班，当他想和往常一般讨价还价的时候，车夫拿出一张宣传画在夏田面前晃了晃，并用异样的眼光看着他。夏田感到脊背发凉，不再还价，快步离去。"
CPC_funni.3.o: "早晚戳穿你的画皮。"
