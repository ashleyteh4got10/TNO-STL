#黑色行动：冷战
TER_RGOC_black_ops_prelude.1.t: "夜袭"
TER_RGOC_black_ops_prelude.1.d: "夜半，吴树宾确认已无人再会来， 便彻底上好门板，打烊收摊。回到里屋，翻开那一叠厚厚的账本，又开始了繁杂的查账工作。笔在账本上纷飞勾勒，吴树宾的嘴角也微微翘起。\n\n这时，外面传来大型汽车路过的声音，他收起笔和账本，向门口探去，刚想重新坐下，门口突然想起了急促的敲门声。吴树宾下意识摸住腰间的配枪，朝外喊：“谁呀，这么晚我打烊了不知道吗？”。外面一会儿后回道：“我、杨柳青，送货来了”。发现是联络人，吴树宾松了一口气，但还是疑惑，“这么晚了，你来干嘛？”。门外又传出声音“事情有变，高先生对你有新命令”。听罢这一套解释，吴树宾彻底放下心来。松开按住配枪的手，便将门板卸下来，准备放“接头人”进来。\n\n突然，“杨柳青”背后冲出几个彪形大汉，把吴树宾压在身下。“重庆市公安局政保队，不许动！”。他这才反应过来，自己被联络人出卖了。吴树宾忿恨地望着“杨柳青”。后者却一脸无所谓，摊摊手：“老哥，我也只不过是为了活命罢了。”\n\n吴树宾戴上手铐往外走，到地方抬头一看，竟是一辆车，车上则押着四位“同事”。周围还站着一位持枪实弹的士兵，原来先前的汽车声是这里来的。被押到车上，吴树宾是越想越气。突然不知怎么，吴树宾打开了手铐，向旁边的警察开了一枪，跳下车去，又朝不远处的“杨柳青”又开一枪，向安全处奔去。\n\n“想跑？”边上的战士正想开枪，带队的警察叫道:“老张，上面要活的！”\n\n“砰！砰！”两枪过去，老张打中了吴树宾的左腿，吴树宾顿时倒在地上。一群警察立马冲上去，死死摁住他，并紧急将伤者送往医院。"
TER_RGOC_black_ops_prelude.1.o: "带回去严加看管。"
TER_RGOC_black_ops_prelude.2.t: "交代材料"
TER_RGOC_black_ops_prelude.2.d: "四川省公安厅：\n\n此次行动，本局因提前控制住了伪民国国安局重庆地区联络人“杨柳青”（原名为陶一铭），在其指认下，成功摧毁重庆地区的特务网，并抓获主要人物吴树宾（原名陈绍宗，“吴树宾”为其妻子姓名）。\n\n陶一铭是因上月将我党一叛徒错认为西南局高层领导同志杀害后，用镪水池“化骨灭尸”时，一部分镪水泄露被周围村民发现并举报，本局才成功抓获。据他交代，在重庆使用电台容易被发现，情报传递皆以“联络人”传递，本局才顺藤摸瓜成功摧毁了重庆的特务系统。\n\n陈绍宗则是国安局在重庆各项行动的主要负责人，在沙坪坝有一家名为“八仙楼”的茶馆。这间茶馆由于得到特务机关的津贴，资金雄厚，在当地生意最为兴隆。又因为同意赊账，因此口碑特别好，各种消息非常易于收集。联络人则以“送货”和“买饭票”的方式将物资和指示藏在其中带给陈绍宗，陈用“找钱”的形式传出情报。\n\n陈绍宗原是临澧特训班的学生，毕业后便一直在戴笠手下的军统工作，但戴笠因为“蒋匪遇刺案” 而自杀后，军统几乎濒临崩溃， 陈被踢出军统，后投奔高伪政府，在四川解放前便早已在重庆地区展开工作。本局已经着手开始审问。\n\n重庆市公安局政保大队队长胡希亮"
TER_RGOC_black_ops_prelude.2.o: "情报充分，意义重大。"
TER_RGOC_black_ops_prelude.3.t: "交代材料"
TER_RGOC_black_ops_prelude.3.d: "姓名吴树宾，目前单身，是重庆本地人。为庆大学生，毕业后因能力出众受邀留校任教，期间被戴笠发掘，任务为监视学生。后为了扩大行动范围，军统便拨款让我沙坪坝开家茶馆，同时运用学校人脉以收集情报。\n\n后蒋介石遇刺身亡，本身背靠蒋介石的戴笠又因为“保卫领袖不力”被作为背锅人推出，收到党国大多数同僚围攻，我们军统为了保卫抗战胜利出了那么多力，为了打击日本人牺牲了那么多同志，蒋介石死亡难道中统就无责任吗？为什么让我们军统一家承受？还逼死了戴先生！军统也被解散了！国民党真是让人心寒！\n\n但幸好党国里还是有欣赏人才的人存在。茶馆因为本身生意兴隆，我们生活不算特别拮据，但也是扳着指头过日子。53年左右，军统的同僚陶一铭找到了早已是在存亡边缘的我，问我有没有意愿跟着高先生干活。我本是拒绝的，中国人怎能在汉奸手下干事呢？中国人怎能干残害同胞的事呢？而后他说是仅仅是眼线，也只是在重庆收集情报，并不会为了日本人残害中国人，又多次恳求与我，我才勉强同意。\n\n我后也仅仅是在重庆买情报而已，主要负责各项行动的是联络人“杨柳青”，他无恶不作，真是丝毫没有人性，我当时也真是看走眼了，后悔莫及，愧对中国人民。\n\n\n\n\n\n\n £GFX_CPC_black_ops_Report\n\n\n\n\n"
TER_RGOC_black_ops_prelude.3.o: "没有一句真话，一定要严厉审问。"
TER_RGOC_black_ops_prelude.4.t: "交代材料（2）"
TER_RGOC_black_ops_prelude.4.d: "尊敬的毛主席和人民：\n\n我本名陈绍宗，浙江人，以贱内“吴树宾”为化名，育有一女。为临训班第一批学生，主任戴笠。毕业后被安插在重庆大学里做军事教官，监视学生同时也通过学生收集情报，后被拨款要求开一家茶馆以进一步收集情报。后来发生的我之前也说过了，蒋匪因倒行逆施遇刺，军统解散，我因不善经营导致茶馆几乎是在倒闭边缘，后发现曾经的同僚陶一铭生活富足，在其诱导下鬼迷心窍加入了国安局，我对不起中国人民，我已经认识到我的错误。\n\n重庆解放后，我被高匪要求收集川渝地区首长的资料，计划趁机刺杀，企图破坏革命，我便收集各警卫员人员制成名单想以此入手，不曾想我接触过的目标皆有非常高的底线，威逼利诱之下竟未动摇一分。后高匪又丧心病狂地试图向解放区投放病毒瘟疫，要打“细菌战”；还投放有毒化学物质，喷过的动植物马上死亡，喷过的地以后也会寸草不生，而我的任务就是调查瘟疫毒药的传播情况，确认各个批次的目标是否达成。\n\n我是看在眼里，痛在心里。是没想到他们如此没有人性。\n\n我已认识到我的错误，我长期残害人民，破坏革命，危害党和人民的生命安全，堕落为了蒋匪、高匪的法西斯主义走狗。如果我没有被抓获，受到人民教育，说不定会造成更大危害，我愿意从此提供所有我所知的高伪政府资料，做更大贡献以赎罪。"
TER_RGOC_black_ops_prelude.4.o: "此次材料有重大意义，建议立马上报中央。"
TER_RGOC_black_ops_begin: "公安部门已经建立§Y侦查预防敌特的相关机构§!，§R伪政府的破坏行动频率§!将随着我方§Y军事职业度§!的§G升高而降低§!。"
