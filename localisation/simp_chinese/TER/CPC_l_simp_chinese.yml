CPC_presidium_of_the_NPC: "全国人大主席团"
CPC_presidium_of_the_NPC_desc: "稍老一些的人们在第一次面对全国人大主席团选举程序时，可能会想起三十年前那首著名的抗战歌曲《团结就是力量》中的一句歌词：“向着法西斯蒂开火，让一切不民主的制度死亡。”\n\n对社会主义而言，“民主”意义非凡：实行社会主义民主是社会主义社会的本质要求，民主意味着人民当家作主，而社会主义社会就应该是人民当家作主的社会，因此，民主与社会主义社会的本质具有根本的一致性和不可分割的联系。\n\n而对于中国而言，“民主”则更是六十载流血漂橹不死不休所追求的终极目标：从云南的护国战争、广东的护法运动，到高举“德先生”“赛先生”旗帜而闻名遐迩的五四运动；从北京武汉的市民运动、雷州的反迫害斗争，到西北的统一战线与亚洲人民解放战争，数以百万千万计的革命者用鲜血铺就了一条通往人民当家作主光明未来的崎岖道路……吗？\n\n当六十载人民革命终于取得完全胜利之时，同共产党携手共进的中国人民面前赫然出现了这样一个问题：民主究竟是什么？人民当家作主究竟要如何实现？他们叩问苍茫大地，却得不到半点回应。如果细致考察中国革命历程，不难发现一个事实：中国革命自始至终同民族救亡运动深刻地绑定在一起，中国人民用六十年的血泪证明了民主平等、独立自由之梦的珍稀，但却几乎未得机会亲自实践过何为民主平等独立自由——民主与科学本是一体两面，困厄的过往成为中国实践人民民主最大的障碍：若仅凭一腔热血而毫无科学设计调研，则民主制度必将难以运转；若人民大众未得到正常政治生活的训练与熏陶，则民主制度必将成为摆设。\n\n但，雄心勃勃的中国人民绝不会坐以待毙，他们已经下定决心从人大选举集体领导开始一场人民民主的伟大实验，而全世界都在屏息凝神注视着这场堪比十月革命的“全球共产主义运动的复兴”——它将要开辟一条通往无产阶级民主光明未来的道路吗？还是将重蹈布尔什维克内斗激化亡党亡国的覆辙？\n\n——惟有中国人民的意志有资格在这份问卷上写下答案。"
