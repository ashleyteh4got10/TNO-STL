###敌特破坏-剧情###
TER_RGOC_black_ops.1.t: "非友即敌"
TER_RGOC_black_ops.1.d: "汗流满面的栓子抓紧枪杆努力控制着自己愈发急促的呼吸，并尽可能地把胳膊抵在肺部的伤口上。他不知道刚才那几颗子弹换了对面几个人，但从满山回荡的枪声和粤语叫骂声来看，至少是打伤了一个。\n\n五分钟前，栓子、王志和陈俊三人在山脚下迎面撞见了另外三个巡逻兵，都操着一口南方口音。按照惯例，王志向他们比了手势口令。但奇怪的是，那三人一点反应也没有，为此栓子还一本正经地重复了一遍。对面一个小白脸尴尬地捏了捏军帽，他的手指拧来拧去也没做出对应口令。\n\n下一秒，双方恍然大悟，子弹瞬间在树林中疾速呼啸。\n\n栓子拖着流血的身躯探向树外，吃力地搜索着战友的尸体。刚才一同往回跑的时候他听到了子弹击碎骨头的酥脆声，但他不知道是谁在哪里倒下了，也不知道另外一个人是不是还活着。\n\n在他因失血过多逐渐漆黑的意识里，只有一件事是肯定的……"
TER_RGOC_black_ops.1.o: "他们渗透到边境了！"
TER_RGOC_black_ops_flag_1: "现已查明，§R伪政府§!将不定期以§R武装小队渗透方式§!对我展开§R破坏行动§!。"
TER_RGOC_black_ops.2.t: "作战日记"
TER_RGOC_black_ops.2.d: "[?global.date.GetDateStringNoHourLong]，阴\n\n昨凌晨我侦查岗哨发现东岸敌31号、35号碉堡群及32A号高地位置发出红色信号弹，十五分钟后敌炮群对我多处战略要点进行大规模炮击。我侦察部队于前日观测发现前述阵地开始修筑临时工事并及时将消息传回，有效协助我军疏散转移人民群众，因而此轮炮击造成人员伤亡不大，但仍严重破坏了我基础设施及交通要道。\n\n事态骤变已不及向军委汇报，我军区立即调动受击地50公里内炮兵部队转运展开反击行动，敌我大规模炮战共持续85分钟，军区参谋部指示未来七十二小时内应在我各炮位设置值班火炮给予针对性回击，并根据敌此次炮击行动规律及时更新炮兵部队射击诸元。"
TER_RGOC_black_ops.2.o: "受炮击损失亟待清查。"
TER_RGOC_black_ops_flag_2: "现已查明，§R伪政府§!将不定期以§f炮击前线阵地方式§!对我展开§R破坏行动§!。"
TER_RGOC_black_ops.3.t: "反动传单"
TER_RGOC_black_ops.3.d: "\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n£GFX_event_CPC_black_ops_Most_Wanted\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n"
TER_RGOC_black_ops.3.o: "此传单贴在敌机投放的午餐肉罐头包装上。"
TER_RGOC_black_ops_flag_3: "现已查明，§R伪政府§!将不定期以§Y投放传单物资方式§!对我展开§R破坏行动§!。"
TER_RGOC_black_ops.4.t: "死从天降？"
TER_RGOC_black_ops.4.d: "夜幕低垂，这本应是平静的一晚——如果忽略正在跑道上准备起飞的国军战机。宋彦民的耳机里传来指令：“一号编队允许起飞。”\n“收到。”\n\n共匪治下的成都防空管制并非十全十美，活跃的市区争先恐后迎着高空发出光芒，识别轰炸目标不是什么难事。护航机呼啸着掠过天空划出一道残忍的弧线，朝轰炸机亮起猩红色的指示灯，宋彦民收到了信号。\n\n“报告，编队进入成都市区上空。”他看着面前的按钮，脑海里只有一个念头：只需轻轻按一下按钮数以万计的人就会被他亲手杀死。几万条人命压在他的手上，让他全身紧绷，几乎无法喘息。但他终究还是一名军人，他的天职是服从命令，命令的对错与他无关，这也不是他应该想的问题。\n“报告，编队正在抵近目标。”最后，他还是一咬牙，屏着呼吸把手放在按钮上狠狠地按了下去。\n\n借着成都的灯火，他看到几个黑点从轰炸舱中缓缓飘落，在预定时间内到达地面，可是没有火光，没有爆炸，引擎声轰鸣依旧。他仔细回想自己飞机上挂载的炸弹种类，但绞尽脑汁也没找到答案。\n\n“报告，已经完成轰炸任务。”\n“准许返航。”\n“报告，在投下弹药后我没有听到爆炸声。”\n“请你马上返航，完毕。”\n\n“也许只是一些传单。”宋彦民驾驶着飞机摆了摆尾巴，再次拉出一条柔顺的弧线，向归途飞去。"
TER_RGOC_black_ops.4.o: "刚刚投放的到底是什么？"
TER_RGOC_black_ops_flag_4: "成都报告：市区一带发现不明原因疫病流行，经侦查确认系国民党反动派为破坏党中央在四川开展的工作而投放的生化武器。已逮捕24名与本次投毒事件有关的国民党敌特分子。\n----------\n现已查明，§R伪政府§!将不定期以§n细菌武器投送方式§!对我展开§R破坏行动§!。"
TER_RGOC_black_ops.5.t: "医生下乡"
TER_RGOC_black_ops.5.d: "杨盈彩还是没搞明白，自己一个外科医生为啥会跟着一票农学研究员甚至兽医一块来到剑阁的田里调研。\n\n汉中到剑阁的公路只到剑阁县城，而他们的目标村落却还要翻至少四座山头。一行人翻过两座大山便已花了五个小时，眼见周围苍翠巍峨，杨盈彩不由得想起李白的《蜀道难》来，“看来是怕他们摔了没人能帮忙处理伤口才把我叫上的。”她一面气喘吁吁爬山一面想着。\n\n太阳已隐有西斜之势，好在总算到了最后的山头，众人决定就地休息半小时。随行一个在西南农学院教书的年轻教员把手往下一指：“那儿就是咱们的目的地，好像跟别处有点不一样。”\n\n顺着袁隆平黝黑的手臂往山下的小小村庄望去，杨盈彩倒吸一口凉气。同正常农田里苍翠碧绿或是金黄膏腴的景色不同，别说农田，就是村庄周围的小树林也呈现出一种毫无生机的蔫黄，她下意识地开口了：“这也不是收稻谷的时令，这地方的田怎么如此蔫黄？”\n\n袁隆平挠挠头：“说是遭伪军的飞机洒毒药，类似遭灾的村子还有好几个，这次来主要是要让我们取标本回去研究，还有就是如果老百姓养的牲口也遭瘟了，兽医同志也要帮忙看看——301医院的人说杨老师你以前来过四川，会讲四川话也懂些生物化学，所以推荐你来陪我们参加这次调研的。”\n\n杨盈彩深吸一口气，郑重地点点头，她的思绪又飘回到十年前——她也曾踏足一个寸草不生的地方，也曾照顾过一群无家可归的孩子。"
TER_RGOC_black_ops.5.o: "“能帮的地方，我一定尽力！”"
TER_RGOC_black_ops_flag_5: "现已查明，§R伪政府§!将不定期以§n投送毒剂毁坏农田方式§!对我展开§R破坏行动§!。"

###敌特破坏-重复###
TER_RGOC_black_ops.11.t: "敌伪武装小队袭扰！"
TER_RGOC_black_ops.11.d: "公安部门报告：\n\n上月在我阵线内多处发现可疑活动迹象：粮仓发生意外火灾，银行库金失踪，甚至军械库失窃等，在我侦查人员努力下，现已确定该类事件系敌伪武装小队渗透破坏所致，我部门顺藤摸瓜，与敌伪小队发生激烈交火，已将敌伪武装小队全部击毙或俘虏。\n\n详细行动报告见附件。"
TER_RGOC_black_ops.11.o: "严审俘虏，清点损失。"
TER_RGOC_black_ops.12.t: "敌伪武装小队袭扰！"
TER_RGOC_black_ops.12.d: "公安部门报告：\n\n上月在我阵线内多处发现可疑活动迹象：粮仓发生意外火灾，银行库金失踪，甚至军械库失窃等，在我侦查人员努力下，现已确定该类事件系敌伪武装小队渗透破坏所致，但我部门没有追踪到敌伪小队，似已达成目的返回白区。\n\n详细报告见附件。"
TER_RGOC_black_ops.12.o: "总结教训，清点损失。"
TER_RGOC_black_ops.21.t: "敌伪炮击我根据地！"
TER_RGOC_black_ops.21.d: "前线部队报告：\n\n敌伪上月悍然对我根据地重要基础设施及农田、工厂等发动炮击，给根据地人民生命财产安全造成了较大损失。\n\n我军指挥同志当机立断立刻下令回击，双方炮战共持续数小时，我军按照原定预案打击了敌方数个战略要点，根据附近国统区地下党同志传回的情报，我军回击基本达成预期效果，有效震慑了敌伪的嚣张气焰。\n\n详细行动及损失报告见附件。"
TER_RGOC_black_ops.21.o: "再接再厉。"
TER_RGOC_black_ops.22.t: "敌伪炮击我根据地！"
TER_RGOC_black_ops.22.d: "前线部队报告：\n\n敌伪上月悍然对我根据地重要基础设施及农田、工厂等发动炮击，给根据地人民生命财产安全造成了严重损失。\n\n由于我军在敌伪目标区域布防不够严密，因而未能形成有效反击，敌伪的炮击持续了数日。\n\n详细损失报告见附件。"
TER_RGOC_black_ops.22.o: "总结教训。"
TER_RGOC_black_ops.31.t: "敌伪投放宣传单及食品物资！"
TER_RGOC_black_ops.31.d: "公安部门报告：\n\n敌伪上月在我多个主要城市郊区空投气球传单罐头弹药枪支等物品，并引起居民骚动，在部分投放地附近发生哄抢事件，公安已派出警力维持秩序并对涉及地区清场。\n\n详细报告见附件。"
TER_RGOC_black_ops.31.o: "立即集中回收销毁传单；\n按户上门收缴弹药枪支。"
TER_RGOC_black_ops.41.t: "敌伪投放细菌病毒武器！"
TER_RGOC_black_ops.41.d: "卫生部门报告：\n\n近期在边境一带主要城镇发现不明原因瘟疫小规模爆发现象，经调查怀疑是由国民党反动派为破坏党和阵线工作而投放的生化武器。为免扰乱军心以及人民群众陷入恐慌，此事暂时保密不对外公开情况，望党中央进一步指示。\n\n详细损失报告见附件。"
TER_RGOC_black_ops.41.o: "准备组织医疗队前往防疫。"
TER_RGOC_black_ops.51.t: "敌伪向农田播撒化学药剂！"
TER_RGOC_black_ops.51.d: "农业部门报告：\n\n近期在陕川渝多个村庄发现农作物大面积倒伏枯萎现象，部分地区受灾极其严重，经调查怀疑是由国民党反动派为破坏党和阵线工作而投放的剧毒药剂。为免扰乱军心以及人民群众陷入恐慌，此事暂时保密不对外公开情况，望党中央进一步指示。\n\n详细损失报告见附件。"
TER_RGOC_black_ops.51.o: "待歉收时从各地粮库筹调物资赈济受灾区域。"

###国策####
CPC_end_of_the_very_beginning: "西风烈"
CPC_end_of_the_very_beginning_desc: "战鼓滚滚，阴云密布，这是国防阵线建立十三年以来最危险的时刻——粮食歉收、工业减产叠加青海社会主义改造失败，马继援国民党反动派对我们亮出了屠刀，再也藏不住反动意图。\n\n但我们仍会前进，十三年前冈村宁次没有令国防阵线屈服，六年前的甘肃宁夏马家没有令国防阵线屈服，马继援国民党反动派也不会令我们屈服！"
CPC_northwest_crisis: "西北危机"
CPC_northwest_crisis_desc: "大跃进中部分干部的“左倾”机会主义被以马继援为首的西北国民党匪军利用，他们纠集起来悍然谋杀彭真同志等我党派遣到地方督理社会主义改造的高级干部，对党和阵线的建设事业进行肆意破坏，最终在个人野心的驱使下公然背叛抗日阵营。马匪军叛变让阵线的抗日事业陷入危急存亡之刻。向南，与川康失联；向北，蒙疆伪军来势汹汹；向西，不仅青海反叛阵线，陇北也乘机脱离控制，企图成为一方诸侯。\n\n我们的抗日口号讲联合一切抗日同志，但不意味着我们会向反革命让步寸分。为了民族的解放，唯有将诸马势力一一扫平。"
CPC_conspiracy_resurfaces: "阴谋浮现"
CPC_conspiracy_resurfaces_desc: "机会不等人，危机也是。一帆风顺时万事万物皆既然有序，然困苦一到，诸多问题便接踵而来。马匪军的叛乱让我们焦头烂额，新疆的多年混战更是一团乱麻，如今我们无暇旁顾，新疆诸多势力也开始在暗地里骚动起来。内战在可预见的未来就会再次爆发，此时各方必定会互相串联打探，尤其以马虎山，盛世才等新疆老军阀最为可疑。"
CPC_track_what_they_are_doing: "追踪动向"
CPC_track_what_they_are_doing_desc: "和阗马家果然也有阴谋野心家在暗中谋划，新疆局已传来消息，马虎山不满其姐夫马仲英的进步行为，意图有所行动。或许是政变，又或许是架空马仲英，甚至可能是马仲英早已被其说服，只是在等待时机。然而真相到底如何我们都无从得知，但我们只知道一件事，那就是必须要彻查到底，绝对不能让新疆出现第二个马继援。"
CPC_track_what_they_are_doing_tt: "电令§G新疆局§!密切注意§l马虎山§!及§l马将军会§!动向。"
CPC_recover_north_long: "夺回陇北"
CPC_recover_north_long_desc: "陇北地段至关重要，不仅能让阵线迂回打击马匪军，更是河西走廊的尾端，通向新疆的至关要道。马匪军的叛乱，让马步康野心急剧膨胀，竟在马匪叛乱时作壁上观。\n\n有鉴于陇北特区军政首脑马步康在马继援叛乱中始终以各种理由搪塞和推诿镇压义务，中央审议决定将马步康收捕入狱，由马光援暂时代管河州。"
CPC_restore_from_the_disaster: "恢复工作"
CPC_restore_from_the_disaster_desc: "战事已平，阵线周边形势也有较可观的改善，不用再为存亡问题而发愁。在解决完反动派叛乱之后，工作重心也将回到社会主义建设上来，我们不仅仅要在青海甘肃重建省份和清剿残匪，更是要解决西北长期以来困顿穷苦的现状，实现大踏步发展，为抗日进入反攻阶段打好基础。"
CPC_everything_in_northwest_is_settled_tt: "£GNG_chinese_nation_texticon §m叛乱§!已被平定，£CPC_texticon §x党§!的§Y日常工作§!得以恢复。\n将解锁£CPC_texticon §G中央西北局§!机制。\n将解锁£CPC_texticon §G西南局§!机制。"
CPC_stability_first: "稳字当先"
CPC_stability_first_desc: "西北脆弱的经济基础不能经受罔顾经济发展需求的纯政治运动。为了避免冒进带来的民生损失，我们应保存富农经济，不动中农土地，限制没收地主财产范围，对新解放区进行稳中求进的土地改革。"
CPC_Strong_intervention: "强势介入"
CPC_Strong_intervention_desc: "土地制度的彻底改革，是新民主主义革命的主要内容之一。我们应以土地改革为中心开展群众运动，依靠雇农、贫农，联合中农，限制富农，保护中小工商业者，消灭地主阶级，变封建半封建的土地所有制为农民的土地所有制。"
CPC_ease_the_relationship: "缓和关系"
CPC_ease_the_relationship_desc: "阵线地处西北，民族关系错综复杂。针对当下局面，我们应采取安抚政策，促进各民族间的相互理解和尊重，减少误解和冲突，从而汇聚各族力量进行建设。"
CPC_confirm_main_position: "确定主体"
CPC_confirm_main_position_desc: "叛乱的教训仍在眼前，南疆的沉疴还需猛药。我们应在党内外干部群众中进行大鸣大放大讨论和思想教育，批判地方民族主义，坚持社会主义道路，并且适当进行反右派的斗争与党内整风，从而在各少数民族地区贯彻党的领导。"
CPC_long_live_the_unity: "团结万岁"
CPC_long_live_the_unity_desc: "随着新解放区的重建与政治工作进入尾声，昔日统战的破碎局面已然不复存在。各边区政府紧密团结在中央政府的领导下，既意味着我们在战略反攻上的大胜，又为接下来的进一步建设打下了基础。"
CPC_long_live_the_unity_trigger_tooltip: "§R新疆的阴霾§!已经消散，§Y川康的战火§!已经平息。"
CPC_rebuild_trade: "恢复外贸"
CPC_rebuild_trade_desc: "为了渡过经济封锁的难关，我们应及时调整贸易政策，主动拓展内外商贸交流，恢复物资局，由其负责统一管理阵线出入口贸易、物资、物价，从而实现经济突围。"
CPC_oil_in_Lanzhou: "兰州石化"
CPC_oil_in_Lanzhou_desc: "为了缓解阵线成品油生产能力的不足，填补石油化工领域的技术空白，中央决定开发西北石油，并在兰州建设炼油厂。"
CPC_eighth_national_congress: "第八次全国代表大会"
CPC_eighth_national_congress_desc: "根据地这一时期稳健务实的经济工作取得了喜人成效，随着马家军、蒙古、新疆、四川等诸多地区问题的依次平定，我们总可以说，党没有沉湎在过去的失败中无法自拔，党组织和阵线依旧保持着革命的热情与活力，党的八大将是总结我们过去失误和成就的一次大会，也将是我们开启未来壮阔波澜解放全中国征程的一个起点！"
CPC_reorganize_army: "换装整训"
CPC_reorganize_army_desc: "自西安保卫战后，军队便已长期脱离实际战争，也致使装备与日常训练日渐脱离实战需要。这日渐松懈的武备便在对马匪军的战争里被狠狠地揭露出来了：草绿色军装与黄色西北格外不合，作战时太显眼；新装备为了保养不允许使用，作战时太生疏等等。目前我们必须对症下药，以解决燃眉之急"
CPC_no_robbing: "军规铁律"
CPC_no_robbing_desc: "经更深入的军队调研，发现我们部队纪律的松懈与废弛已相当严重，作战命令耍滑头，赏罚不严明，侵犯群众利益，对党的明知故犯、不老实甚至有的虚报假报等等。中央决定在全军中进行整纪律、整制度、整作风。保持与发扬我们的优良作风，使我们全军的战斗力能提高一步，这是大兵团作战的需要，更是我们取胜的需要。"
CPC_catpture_return_to_the_public: "缴获归公"
CPC_catpture_return_to_the_public_desc: "严格登记士兵手中的战利品，给记录名册中填上细致的缴获地点、时间以及担保人。如果是捡来的无主物品，需单独列表，核定价格，若之后有失主来认领就按价赔付。"
CPC_kill_one_as_warning: "杀一儆百"
CPC_kill_one_as_warning_desc: "中央三令五申必须严明军纪，但我们的队伍中还是出现了公然藐视三大纪律八项注意的士兵。\n\n军令已经下达：个人犯法，严惩个人；集体犯禁，严办集体！"
CPC_training_cavalry: "对敌要领"
CPC_training_cavalry_desc: "马匪骑兵是马家军最大的本钱，也是我们最大的威胁。因此我们要组织轮训各级、各种干部，召开各次战斗的检讨会，总结经验，进行演习。在连、排中开办三至五天的各种轮训班，总结对付马家军骑马专门克制的战术打法，力争让其失去骑兵优势。"
CPC_outflank_fight: "包抄作战"
CPC_outflank_fight_desc: "作为不可多得的机动兵种，骑兵虽非主流，但如果运用得当也可出奇制胜。"
CPC_cyclone_company: "旋风连"
CPC_cyclone_company_desc: "通过一次次筛选，我们终于锻炼出一支尚可一战的骑兵部队，但这特殊时期的做法不能延续，还得另外从长计议。"
CPC_kill_for_award: "杀敌奖励"
CPC_kill_for_award_desc: "一味望梅止渴，只会拖垮了军心军纪。因此要抛开虚伪的承诺，把士兵视作需要养家糊口的普通人，将军队奖惩制度执行彻底。凡击毙敌一人，可按编制集中上报，领取数额不等的奖励。"
CPC_charge_for_award: "冲锋奖励"
CPC_charge_for_award_desc: "凡是敢当先冲锋的，也要加以表彰，当然需要有人在旁证明。"
CPC_avant_garde_company: "先锋连"
CPC_avant_garde_company_desc: "我们把久经沙场的老兵集中编在一个连，或一个排内，变成刺向敌军的一把尖刀，撕开敌人的防线。"
CPC_build_guns: "临阵造枪"
CPC_build_guns_desc: "燃起锅炉，烧红炭火，根据地兵工厂又要开工了。"
CPC_material_control: "物资管制"
CPC_material_control_desc: "切断与青海与根据地的一切物资往来。青海地方贫瘠，缺少我们物资供应，看他们能撑多久。"
CPC_catch_up_with_work_and_time: "赶工赶时"
CPC_catch_up_with_work_and_time_desc: "突如其来的战争让我们一时难以应付如此大量的订单需求，请务必要求工人加班加点完成生产指标。"
CPC_demand_quantity_but_not_quality: "求量不求质"
CPC_demand_quantity_but_not_quality_desc: "目前军械生产只要求保证数量，品质只能退而求其次，这是无奈之举。"
CPC_stable_rear: "稳定后方"
CPC_stable_rear_desc: "是时候打破战时体制似有似无的现状，紧张起来，团结起来，让人们相信与马家军的战争是撬动中国局势的第一步，只有胜利才能换取根据地的未来。"
CPC_send_more_sentries: "加派巡哨"
CPC_send_more_sentries_desc: "各村，各公社需提防马家军奸细的反动宣传和破坏活动，加紧防查，遇到可疑人员立刻报告。"
CPC_village_joint_insurance: "村寨联保"
CPC_village_joint_insurance_desc: "各村，各公社按人头比例出丁，编入武装部，组建巡逻队按时按点各处巡视，填补后方安保力量。"
CPC_shot_the_first_bird: "枪打出头鸟"
CPC_shot_the_first_bird_desc: "各村，各公社可以就地成立审判处，在公安人员未到达前审讯可疑人员，获取情报，震慑其余破坏分子。"
CPC_sik_mon_over: "我们已度过最艰难的时期！"
CPC_open_market_in_Bao_Tou: "包头互市"
CPC_open_market_in_Bao_Tou_desc: "包头是边塞重要的交通枢纽，也是关塞内外往来商旅的留驻地，财货物资不可胜数。但近几十年受战火阻隔，商路几绝。现今我们打通外蒙道路，下一步应当重新恢复包头互市，鼓励商人往来贸易，丰富根据地的财政收入。"
CPC_military_factory_in_Tian_Shui: "天水军械所"
CPC_military_factory_in_Tian_Shui_desc: "随着川中的解放，为了确保后勤供应，中央决定迁移青海宁夏等地军工厂至甘肃天水，并扩建当地的军械所和仓库。"
CPC_quilt_factory_in_Xian_Yang: "咸阳被服厂"
CPC_quilt_factory_in_Xian_Yang_desc: "新疆天山南北两麓，水草丰茂，既适合种植棉花，又可以放羊，产出的棉花和羊毛都是纺织业的重要原料，正可以收购来织成衣帽。扩建被服厂，于己于彼都是有利的。"
CPC_factories_in_Tong_Guan: "潼关机造"
CPC_factories_in_Tong_Guan_desc: "西安作为国防政府占据的第一座大城市，经济富庶，工业发达，四周崇山雄关易守难攻，又距离内地最近。因此在局势稳定后，中央将陕西各处零散军工厂迁往西安，集中安置并扩建。"
CPC_Xian_university: "西安大学"
CPC_Xian_university_desc: "中央各负责同志广泛听取教育界人士的建议后，决定在西安建立一座新的大学，培养高素质人才，整合科研力量。"
CPC_field_investigation_movement: "查田运动"
CPC_field_investigation_movement_desc: "自五十年代的大混乱后，我们已经许久没来得及更新经济数据了，尤其是各县各村的农田占有情况。这里面有集体化失败后停滞不前的，有土改后土地又集中的，还有尚未接受改造的，多重所有形式一团乱麻，难以推行统一政策，更造成资源浪费，不利于发展。必须在三个月内查清田产情况，以免耽误生产。"
CPC_dig_canals: "穿洮引湟"
CPC_dig_canals_desc: "洮河与湟水是黄河上游的两条重要支流，湟水位于青海境内，而洮河流经青海甘肃两省，两条河在历史上长期担当着灌溉水源的重任，可惜马家军在时不能治理修浚，将两处水源白白放跑。现在，根据地接管了这一地区，治水重任自然就落到我们肩上，应当动员当地群众，在我党带领下整修河道，消灾去难，发展生产。"
CPC_seed_improvement: "种子改良"
CPC_seed_improvement_desc: "麦，黍，高粱，玉米，红薯，这些都是我们重要的粮食作物，而现在，农民的精耕细作已经不足以为粮食增产，急需科学的力量加入。正好我们有苏联专家，将其中的农学家单独划出成立研究所，与我们的研究员一起改良作物。"
CPC_experiment_in_bend_of_Yellow_river: "河套实验"
CPC_experiment_in_bend_of_Yellow_river_desc: "黄河百害，唯富一套，蜿蜒的黄河绕过陕西，自宁夏猛然向北流去内蒙，构成一个“几”字形河川，也孕育出两面河水包绕的河套平原。源源不断的河流泥沙和优越的灌溉条件使之成为千顷良田，是根据地的重点农垦区。现在，农研所来到河套选取实验田，用以改良种子，幼苗已经栽下，只等开花结果。"
CPC_say_goodbye_to_poor_base: "告别落后"
CPC_say_goodbye_to_poor_base_desc: "我们的根据地虽然幅员不算辽阔，可是情况极为复杂。在新解放区，因为解放的时间还只有几个月、半年、或者一年，当地的土地问题并未得到有效解决，工商业没有得到合理调整。不过，我们已经渡过最艰难的时光，安定了几乎四分之一个中国。我们相信党仍然焕发着活力，中国革命没有被反动势力终结。"
CPC_revisit_old_friends: "旧友重逢"
CPC_revisit_old_friends_desc: "我们同刘文辉的西南政府有深厚的缘分，双方互为第三次国共合作中的亲密战友，之前因马继援叛乱带来的沟通隔阂也已完全消除。既然我们已帮助刘文辉取得统一四川的巨大胜利，那么现在正是他兑现革命承诺的时候。\n\n成都的大部分反动头领都被西康军俘获，重庆的国民党窝点逃往内地。刘文辉的官员率先接管地方，然后四川和西康的政府会在接下来半年中合并重组，废除军阀的反动统治，还给四川人民一个光明的未来。"
CPC_push_collectivization: "推行集体化"
CPC_push_collectivization_desc: "我们的干部已经开始与四川各县政府进行先期接触，只是苦于南下人手不足，只能在有限范围内影响当地治理。好在我们有另一个革命组织可以收用，那就是我党的老朋友黄琪翔（已去世）创立的农工社。农工社成员全体决议，愿以双重党员身份到各地支持我们党的工作，改造农村，实现耕者有其田。\n\n但是也有一部分人对西北的政策予以完全否定，他们手里掌握着国民党反动派的宣传材料，恶毒攻击我们党和毛主席乃至一切。西北已经将四川视作新解放区，这场政治对抗我们没有理由失败。"
CPC_contact_with_PFS: "联络惟民社"
CPC_contact_with_PFS_desc: "唯民社成立自1941年，最初是刘文辉成立的文化社团，由众多知识界翘楚运作，用来应对蒋介石的舆论攻伐。45年曾有望与民盟合并，但是47年停战之后，民盟撤退到西安，组织关系断绝。\n\n这十几年时间里，唯民社在川康各地招募会员，发展地下组织，俨然成为刘文辉手下第一大党。他们中有许多人对共产党抱有同情的态度，应当发展与他们的关系。这种做法对当下来说有利于推广西北的政策，从长远来看助益于合并西南。"
CPC_stablish_market: "稳定市场"
CPC_stablish_market_desc: "随着长江下游水道封锁，四川商人再也没法去下游经商，这使他们经营的信心遭受严重打击，再加上以往西北对工商业改造的强硬态度，使得他们纷纷关门停业，又或者携款出逃。供货减少造成当地物价飞涨，用军队强行敲开商店的大门已经不见成效，为了避免更多财富流失，我们应该慢慢建立陕西与四川之间的货物通道，开放两地贸易，稳定市面各取所需。"
CPC_evacuate_cities: "疏解城市"
CPC_evacuate_cities_desc: "四川在国民党统治期间由于长期行政分裂，没有对省内大城市进行良好规划，导致功能缺失，市容混乱，交通塞绝。统一省政后，四川各处城市的规划权必须交给西北的代表做决定。\n\n同时为了防止日本和国民党的报复空袭，我们建议刘文辉立刻将城市防空建设提上日程，不要让惨剧再次发生。"
CPC_expand_Cheng_Yu_railway: "沟通天堑"
CPC_expand_Cheng_Yu_railway_desc: "1903年，清政府提出修建川汉铁路意向，其西段为成渝铁路；1936年，国民政府成立成渝铁路工程局，次年开始修筑；1937年7月，因抗日战争爆发而停工，仅完成工程量的14%，一寸钢轨未铺。抗日战争后，四川军阀虽然完成了这段铁路的修建，但也疏于管理和维护，长期以来处于堪堪可用的状态。在前不久的战争中，这条铁路便暴露出了诸多问题，给敌人添了不少麻烦。现在我们控制了这条铁路，显然不能重蹈覆辙，扩建成渝铁路便成为了重工业建设的重要任务。"
CPC_say_goodbye_to_Vasilevsky: "随着§Y蒙古§!革命成功，§Y华西列夫斯基元帅与他的红军将士们§!将离开西蒙，取道§Y北疆及哈萨克§!前往§S秋明§!，在§R支离破碎的俄罗斯地区§!继续他们的战斗——而俄罗斯今后的命运，就与我们无关了。"
CPC_MRC_issue_1: "中蒙同盟"
CPC_MRC_issue_1_desc: "经中央政务委员会讨论，联系蒙古人民革命党同志后决定，中蒙两党将在包头市召开和平统一大会，在会上我们将就中蒙和平统一的各项议题展开大讨论——第一步，就是对蒙古地区地位的讨论。"
CPC_MRC_issue_begin_tt: "§G中蒙和平统一会谈§!将开始新一轮§Y和谈议题§!。"
CPC_MRC_issue_1_left: "走访草原"
CPC_MRC_issue_1_left_desc: "除去会谈外，中央另组成以万里、于光远等同志为代表的调查团在蒙古党代表同志的陪同下远赴乌兰巴托展开蒙古地区战后情况调研，以确认当地经济民生情况，帮助中蒙恢复经济。"
CPC_MRC_issue_1_right: "迎接英雄"
CPC_MRC_issue_1_right_desc: "大功告成，蒙古人民终于迎来了自己的解放，这少不了东亚各爱好和平的民族的支援，这些援蒙干部们都是真正的英雄，身经百战的斗士。如今他们荣归阵线，我们要为他们欢呼，为他们喝彩。\n\n在蒙古内战里，他们与日本人辛苦卓绝的作斗争，也在蒙古和俄罗斯见到了一些我们从未见过的事物，可谓收获颇多，这些英雄对阵线今后的发展将有很大的帮助。"
CPC_MRC_issue_2: "组织问题"
CPC_MRC_issue_2_desc: "中蒙两党共同以马克思列宁主义为基本政治纲领，尽管蒙古人民革命党的成立有其历史原因，我们相信，中蒙革命，合则两利，分则两害；应积极推动中蒙在政治上保持行动一致。"
CPC_MRC_issue_2_left: "互换花名册"
CPC_MRC_issue_2_left_desc: "由于五十年代河套地区革命形势复杂，中共、蒙人党、内人党三党之间的成员从属及组织关系较为混乱，为辗转革命需要，不少蒙族汉族干部同时持有多个党籍，现在蒙古革命成功，应当及时清查党员关系，避免行政混乱。"
CPC_MRC_issue_2_right: "整顿思想"
CPC_MRC_issue_2_right_desc: "长期的民族革命战争渐渐使得民族主义情绪流毒——无论是大汉族主义还是蒙古分裂主义——在蒙汉干部中蔓延；中央决定在党内开展整肃，要让一些产生误解的干部深刻认识到，汉蒙回维等亚洲民族均是帝国主义剥削链条上的受害者，兄弟民族之间不分高低贵贱。"
CPC_MRC_issue_3: "军队问题"
CPC_MRC_issue_3_desc: "蒙古人民军长期接受革命战争的试炼，在草原作战方面可称是经验丰富；我们希望蒙古人民军与中国人民解放军能携手并进，共同筑牢革命防线，保卫革命政权的安全。"
CPC_MRC_issue_3_left: "伪军"
CPC_MRC_issue_3_left_desc: "近二十年来，服务伪蒙疆政权的汉奸蒙奸集团互为连理，纵横交错，织成一张大网，骑在蒙汉各族人民的头上敲骨吸髓，罪行罄竹难书。\n\n经由我党提议，中蒙成立联合审判庭，共同审判伪蒙疆政权的战争罪犯。"
CPC_MRC_issue_3_right: "俄军"
CPC_MRC_issue_3_right_desc: "随着蒙古革命成功，苏联红军华西列夫斯基所部蒙古军官开始纷纷要求回到蒙古，蒙古人民革命党同志已经派遣代表前往克孜勒展开交涉。\n\n而我们，乐见其成。"
CPC_MRC_issue_4: "内蒙古问题"
CPC_MRC_issue_4_desc: "内蒙古自清朝时起就归服内地，接受满清贵族的统治，哪怕到了中华民国也没有变化。为了明确这一点，我们应在会谈上强调内蒙古对于我们的特殊意义。"
CPC_MRC_issue_4_left: "询问乌兰夫"
CPC_MRC_issue_4_left_desc: "内蒙古人民革命党自成立之初便与中蒙双方关系颇深，随着和谈议题的推进，内人党的历史任务已经完成。\n\n在经慎重考虑后，中央决定询问内人党总书记乌兰夫同志的意见，以最终确定内人党的去留问题。"
CPC_MRC_issue_4_right: "边界协防"
CPC_MRC_issue_4_right_desc: "战后，伪蒙疆势力缩回察哈尔，与呼和浩特地区直接接壤，在可以预见的未来，我们仍可能受到敌特小股势力渗透、骚扰及破坏，因此中央决定强化呼和浩特地区的战备建设工作。"
CPC_MRC_issue_5: "重建问题"
CPC_MRC_issue_5_desc: "我们很清楚，中蒙和平统一很大程度上是“以利合者，利尽而散”，在西北根据地经济同样凋敝的今天，我们很难说能提供给乌兰巴托什么实质性援助——就像两头伤痕累累的草原狼，中蒙双方目前能做的，只有互相舔舐伤口，互相扶持走出经济困境……"
CPC_MRC_end: "团结的大会"
CPC_MRC_end_desc: "北至乌兰巴托，南到汉中，中蒙和平统一的消息传遍了根据地大街小巷，人们自发走出家门开始上街庆祝，国防阵线自马家军叛乱以来第一次看到了革命胜利的曙光！汉蒙两族人民必将团结在马克思列宁主义的旗帜下，必将团结在毛泽东思想的旗帜下，向着社会主义高潮进发！"
CPC_everything_in_northwest_is_settled: "尘埃落定"
CPC_everything_in_northwest_is_settled_desc: "叛乱被平定，让我们稍作休整，细心认真地决定政策方向，开展下一步行动。\n希望这次叛乱能够让我们得到一些教训。"
CPC_General_Ma: "马大将军"
CPC_General_Ma_desc: "漠北的冰雪已然消释，西域的阴谋刚刚败露。值此良机，我们应知会马将军进军迪化，进行彻底解放新疆的行动。"
CPC_unite_ROS_1: "联合北疆"
CPC_unite_ROS_1_desc: "我们的维吾尔兄弟所实控的北疆，与和阗马家一道对盛世才形成包夹之势。鉴于解放新疆任务的重要性，中央决定下书伊犁，让国民党反动派陷入新疆人民的天罗地网。"
CPC_add_our_chips: "加注，加注"
CPC_add_our_chips_desc: "新疆的战事正如火如荼地进行，兵员和枪械也日渐捉襟见肘。\n\n中央决定，筹备一批物资，并派出一定数量的兵员，以支援革命同志。"
CPC_support_xinjiang_brigade_1: "援疆纵队"
CPC_support_xinjiang_brigade_1_desc: "尽管阵线刚刚匡乱反正，但支援新疆依旧是我们不容推卸的责任。如今的盛世才伸出了“拳头”，露出了“胸膛”，我们的战略就是把他的拳头紧紧拖住，对准他的胸膛插上一刀。"
CPC_unify_xinjiang: "统一新疆"
CPC_unify_xinjiang_desc: "随着残余的反动势力被彻底逐出新疆，南疆与北疆将在新疆局同志们的指导下整合为统一的边区政府，从而更好的进行恢复与建设工作。"
CPC_setting_old_scores_1: "清算旧账"
CPC_setting_old_scores_1_desc: "盛家恶贯满盈，马家殷鉴不远。在审判反动派罪行的同时，我们也应敲打和阗马家，并指导新疆局进行群众工作，从而使新疆真正处于红旗之下。"
CPC_letter_to_Hetian: "下书和阗"
CPC_letter_to_Hetian_desc: "漠北的冰雪已然消释，西域的阴谋刚刚败露。值此良机，我们应知会马将军进军迪化，进行彻底解放新疆的行动。"
CPC_unite_ROS_2: "联合北疆"
CPC_unite_ROS_2_desc: "我们的维吾尔兄弟所实控的北疆，与和阗马家一道对盛世才形成包夹之势。鉴于解放新疆任务的重要性，中央决定下书伊犁，让国民党反动派陷入新疆人民的天罗地网。"
CPC_support_xinjiang_brigade_2: "援疆纵队"
CPC_support_xinjiang_brigade_2_desc: "尽管阵线刚刚匡乱反正，但支援新疆依旧是我们不容推卸的责任。如今的盛世才伸出了“拳头”，露出了“胸膛”，我们的战略就是把他的拳头紧紧拖住，对准他的胸膛插上一刀。"
CPC_liberate_xinjiang: "解放新疆"
CPC_liberate_xinjiang_desc: "随着残余的反动势力被彻底逐出新疆，南疆与北疆将在新疆局同志们的指导下整合为统一的边区政府，从而更好的进行恢复与建设工作。"
CPC_setting_old_scores_2: "清算旧账"
CPC_setting_old_scores_2_desc: "盛家恶贯满盈，马家殷鉴不远。在审判反动派罪行的同时，我们也应敲打和阗马家，并指导新疆局进行群众工作，从而使新疆真正处于红旗之下。"
CPC_designate_committee: "中央指定"
CPC_designate_committee_desc: "要是我们还在发生过一次叛乱后继续放弃地方党委的任免权，党的政权就永远不可能真正得到安宁！"
CPC_committee_election: "地方推举"
CPC_committee_election_desc: "我们不应该困于身份认同差异而对其他民族产生不必要的信任危机，既然能够积极运用民主的方法建立地方政府，那我们就没必要再去另行去生搬硬套什么民族区域自治政策。\n认真履行党内民主原则，兑现我们对人民群众的承诺，这是共产党人应有的义务。"
CPC_Foreclosure_land: "赎买地产"
CPC_Foreclosure_land_desc: "西北脆弱的经济基础不能经受罔顾经济发展需求的纯政治运动，某些地方干部发现那些过于贫穷的部落里，地主和佃农在生存压力面前达成和解，建立起相依为命的关系。我们不应将他们粗暴打断，而要引导这种经营模式慢慢转型。"
CPC_radical_land_reform_goal: "强制改造"
CPC_radical_land_reform_goal_desc: "农民群众用“罪有应得”这种因果报应理论来解释什么是无产阶级专政，但这是否合乎科学暂且存疑。\n而且我们的地方干部也乐于顺应“民意”去发动贫农斗争地主，没有因地制宜制定分田标准，那么出现差错就在所难免了。"
CPC_ineffectual_remedy: "扬汤止沸"
CPC_ineffectual_remedy_desc: "多一次聚集，就多一次动乱的风险，立刻停止一切宗教活动。封闭回教的礼拜寺，收缴一切回教反动宣传材料，对宗教书籍用品集中销毁，一劳永逸挖掉反动根子。\n但这会耗费政府过多的精力去解决这些问题。"
CPC_deny_allah: "真主非主"
CPC_deny_allah_desc: "俗话说得好：强扭的瓜不甜。马家军叛乱就是前车之鉴——不能使用粗暴的手段去改变人的思想。\n转而对回教信众进行大量说服教育工作：我们不否定良善等等优秀的品格，也并非不愿信众们求取更美好的生活，而是让人们认清宗教作为统治阶级奴役大众的工具的反动本质。"
CPC_political_honesty: "政治诚信"
CPC_political_honesty_desc: "真诚地对待朋友，这是党的共识，这会使我们收获最美好的友谊。"
CPC_political_practicality: "政治实用"
CPC_political_practicality_desc: "毋用不利己者，这是党的共识，这会使我们收获最辉煌的胜利。"
CPC_eighth_national_congress_tree: "中共八大"
CPC_new_land_reform: "新土改"
CPC_new_land_reform_desc: "我们有许多新解放区尚未展开土地改革工作，党中央下达指示：凡已实行土地改革的地区，必须保护农民已得土地的使用权。凡尚未实行土地改革的地区，必须发动农民群众，建立农民团体，经过清除土匪恶霸、减租减息和分配土地等项步骤，实现耕者有其田。"
CPC_Cooperative: "合作社"
CPC_Cooperative_desc: "在党的领导下，通过各种互助合作的形式组织起一大批合作社，推进农业集体化，我们认为这套策略是稳健的，是行之有效的，以当前解放区的经济基础而言，我们需要在八大上提出一份温和的方案，不至于挫伤农民积极性。"
CPC_anti_rash_advance: "反冒进"
CPC_anti_rash_advance_desc: "党内部分同志在农业问题上表现出了不正常的狂热和冒进，他们认为中央稳健改革的决策是“不够彻底”，是“为资本主义复辟留尾巴”，这样的认识早在大跃进时期已经被现实证明是错误的，中央决定八大期间在党内展开反冒进运动，重点打击这部分人不正常的狂热和冒进。"
CPC_step_further: "更进一步"
CPC_step_further_desc: "部分同志质疑我们在社会主义建设方面的成就，认为党的农业集体化不可操之过急，认为当务之急是在新近解放各地区先建立合作社。总之，我们认为这些看法是片面的，甚至可说是右倾的，我们需要在现有的农业成就上更进一步，在八大上提出趁热打铁乘胜追击的方案，在根据地内掀起社会主义高潮。"
CPC_cleaning_party: "大四清"
CPC_cleaning_party_desc: "大四清，即清政治、清经济、清组织、清思想的四清运动，党内部分同志认为中央趁热打铁乘胜追击的决策是“左”倾，是“太过冒进的鲁莽举动”，这样的认识自四川解放以来已被证明存在漏洞，中央决定八大期间在党内展开大四清运动，重点打击这部分人的革命悲观主义。"
CPC_city_first: "城镇优先"
CPC_city_first_desc: "尽管我们党是一个工农联盟的党，但我们发现大跃进时代工农并举的旧提法最终造成的结果实际上是“工农并穷”，我们将在八大上提出优先保障城市户口生活的方案。\n如无法在八大上把加强工农业剪刀差作为既定国策，先让我们其中一个拳头变大变硬，那么我们认为工农并穷的窘状还将持续下去……"
CPC_strengthen_central_plan_committee: "强化中计委"
CPC_strengthen_central_plan_committee_desc: "中央计划经济委员会是党和阵线指导解放区经济发展的重要抓手，在八大这样特殊的时间点上，我们应当强化中计委的职能，将新解放的广大地区的经济工作统筹起来一并规划，工人工作有保障，农民种田有兜底，所谓“全国一盘棋”，正应如此。"
CPC_country_equals_to_city: "城乡趋同"
CPC_country_equals_to_city_desc: "我们党是一个工农联盟的党，在经济建设方面理应遵循工农并举的总纲领，因此，我们在八大上将继续坚持城乡居民趋同的公平政策，不搞特殊化不搞差异化。"
CPC_take_full_responsibility: "自负盈亏"
CPC_take_full_responsibility_desc: "新近解放的大片地区人民政府才刚刚建立，党和阵线还暂时没有余力在基层建立完备的可靠的经济组织，因此我们不得不要求根据地的人民群众自负生产盈亏。"
CPC_make_money_first: "多挣钱"
CPC_make_money_first_desc: "共产党的宗旨，按一句古话，可以不严谨地说成“藏富于民”，只有人民的生活富庶起来，党和阵线才能更好地开展工作。"
CPC_accumulate_first: "多积累"
CPC_accumulate_first_desc: "国防阵线是抗日民族统一战线的遗产，我们必须加快工业建设，加强我们的工业积累能力，阵线才能积蓄起足够的力量去痛击日本侵略者和汉奸走狗。"
CPC_national_autonomy: "民族自治"
CPC_national_autonomy_desc: "过去，党的民族政策和宗教政策都出现过偏差，最终酿成了马继援叛乱的悲剧，新时期我们应当坚持民族自治的政策，以实际行动换取少数民族群众的认同和尊重。"
CPC_culture_protection: "文化保护"
CPC_culture_protection_desc: "近期，有部分少数民族群众借着八大的春风恶意攻击党中央，攻击党中央的民族政策是“大汉族主义”，是“独裁”，必须对这一小撮反动分子深挖痛打，震慑住其他分裂势力！"
CPC_rebuild_red_army: "重建军队"
CPC_rebuild_red_army_desc: "我们赖以在国内开辟解放区的基础就是我们的解放军，解放军也是党和阵线协助人民群众抓好生产工作的重要组织，我们必须明确新时期解放军的定位，使其更好地为人民服务。"
CPC_lead_of_our_party: "党的领导"
CPC_lead_of_our_party_desc: "坚持党的领导，是我们完成祖国统一大业的最重要原则，是我们阵线永葆革命活力的法宝，在新的时期，更应该坚持党在各条战线上的领导，以严格的组织纪律和伟大的毛泽东思想应对我们未来的内外事务。"
CPC_break_the_sphere_lock: "打破封锁"
CPC_break_the_sphere_lock_desc: "日本及其傀儡的封锁一度令我们阵线落入窘迫甚至濒临灭亡的命运，但我们不仅挺过来了，我们的解放区还扩大了，我们有能力冲破共荣圈的封锁了，新的时期，我们要把打破共荣圈封锁的重要任务提到议事日程上来。"
CPC_a_new_peak: "新高峰"
CPC_a_new_peak_desc: "八大即将落幕，阵线已经迎来了新一轮社会主义高潮，在新时期，我们将以马列毛思想作为党的理论核心，高举三面红旗不倒，鼓足干劲力争上游，多快好省地建设社会主义。"
#毛线
CPC_phase_2_Mao_tree: "毛主席的政策"
CPC_rural_commsearization: "农村公社化"
CPC_rural_commsearization_desc: "我们已经从大跃进的挫折中恢复过来了，不可否认的是，在当时的历史条件与经济基础下实行全面人民公社化带来了一些不好的影响，我们认识到了错误，积极改正，成功取得了经济复苏的胜利，现在是时候依靠人民、动员群众，集中力量发展集体化，迎接下一个社会主义高潮！"
CPC_big_community_is_preferred: "大社优先"
CPC_big_community_is_preferred_desc: "并大社，转公社必须与当前生产密切结合，不仅不能影响当前的生产，而且要使这个运动成为推动生产更大跃进的一个巨大力量。社的组织规模，就目前说，一般以一乡一社、两千户左右较为合适。某些乡界辽阔、人烟稀少的地方，可以少于两千户，一乡数社。有的地方根据自然地形条件和生产发展的需要，也可以由数乡并为一乡，组成一社，六，七千户左右。至于达到万户或两万户以上的，也不要去反对。"
CPC_wage_system: "工资制"
CPC_wage_system_desc: "传统观念中，农民总认为从自己的地里收下的粮食都应该归自己所有。但农业集体化后，土地归集体占有，劳动也是集体分工，农民很难界定哪一块田是自己耕的，哪一石粮食是自己打的。关乎每个社员的劳动积极性，因此公社管理需要劳动结算工资，评定工资级别，按照级别发固定工资，避免绝对平均主义的错误思想在社员中间泛滥。"
CPC_state_monopoly_of_purchasing_and_marketing: "统销统购"
CPC_state_monopoly_of_purchasing_and_marketing_desc: "统销统购即粮食计划供应和计划收购的简称，这是党中央为了更好的转化农业产出，支援社会主义工业建设。公社粮库要按中央规定的价格、数量、品种向国家销售余粮，上交后计划外粮食可以自行处置；城镇居民由国家计划定量供应；非国家指定单位，禁止擅自销售。"
CPC_team_settlement: "队社结算"
CPC_team_settlement_desc: "现在人民公社的所有制，除了公社直接所有的部分以外，还有生产大队和生产队的所有制；而且基本上是生产队（有些地方是生产大队，总之大体相当于原来的高级农业生产合作社）的所有制。要由基本上生产队所有制，改变成为基本上公社所有制，正如毛主席所指出的，需要公社有更强大的经济力量，需要各个生产队的经济发展水平大体趋于平衡，而这就需要有一个发展过程。"
CPC_grain_hard_indicator: "粮食硬指标"
CPC_grain_hard_indicator_desc: "集体劳作的公社给粮食综合生产能力稳步提升打下坚实基础，有力支撑了根据地的农产品供给。在平原地区，平均亩产争取达到200斤；山区争取达到70到100斤。麦、小米、高粱等在粮食产量中所占的比例需要提高，玉米产量的绝对数，除了种植过分集中的地区以外，一般也不宜降低，并且还要准备在必要的时候补种一些薯类作物。"
CPC_farmers: "农副业"
CPC_farmers_desc: "中央目前不反对公社在保证完成粮食生产计划之外种植其他作物，改善社员生活。同时，中央鼓励公社去探索副业，包括：林场、浴场、果园、畜牧场等……使这些企业成为扩大公社积累的重要来源，用于社办学校、医院等文化福利事业。"
CPC_factory_docking: "工厂对接"
CPC_factory_docking_desc: "每月固定组织国营工厂代表下乡，与公社社员代表举办交流大会，彼此抛出需求和供给，并进行直接的物质交换。"
CPC_supply_and_marketing_agency: "供销社包办"
CPC_supply_and_marketing_agency_desc: "供销社是人民公社的重要组成部分，是各种资源传递交换的中转站。粮食统购统销要依赖供销社集中，城市商品要依赖供销社分销。扩大供销社的职能，为进一步开展城乡物资交流，促进以互助合作为中心的农业增产运动，支援根据地工业化而奋斗。"
CPC_cancel_three_one: "取消三自一包"
CPC_cancel_three_one_desc: "我们的根据地幅员辽阔，又存在着阶级，一定会出现各种资产阶级思想、封建阶级思想和富农思想，“三自一包”、“叫嚣单干”就是最显著的象征。而现在，激烈的阶级斗争已经渗透到党内，要立刻消灭腐化的源头，彻底取消生产中的“三自一包”。"
CPC_socialist_education: "社教运动"
CPC_socialist_education_desc: "在农村掀起社会主义教育运动，要解决的问题主要分为两个方面。\n一个方面，排查疏解农业集体化完成后出现的新困难，协调公社之间的共存关系，也包括公社内部产生的经济问题，对人民公社建立以来的各种帐目作一次认真的清理，结清旧帐，建立新帐。\n另一个方面则是本次运动的重点，“清政治，清经济，清组织，清思想”。阶级斗争，一抓就灵。为了反修防修，防止反革命篡党篡权，要在农村地区执行一次长期的，广泛的，影响深远的运动，来清算三年经济困难时期产生的各种反动倾向。"
CPC_anti_corruption: "反贪污"
CPC_anti_corruption_desc: "反贪污是针对腐败分子的一项重要举措。伴随大跃进后经济的自由化，一些干部被侵蚀腐化，现在有的人仅凭三斤猪肉，几包纸烟，就被收买，成为反革命分子的帮凶，必须予以严厉打击。"
CPC_abundance: "反浪费"
CPC_abundance_desc: "在大跃进时期，工作组下乡发现高级社组织者不懂经营，对粮食、物资随意浪费，以此加重向社员的劳务摊派，中央决定杜绝这种现象。"
CPC_bright_bureaucracy: "反官僚主义"
CPC_bright_bureaucracy_desc: "官僚主义是封建社会以来的顽疾，就算是我们也不例外。必须开展反官僚主义运动，严厉打击那些养成“官老爷“习气的干部。"
CPC_anti_revisionism: "反修正主义"
CPC_anti_revisionism_desc: "人的正确思想是从哪里来的？从社会实践中来，从社会的生产斗争、阶级斗争和科学实验这三项实践中来。而我们的高级干部、中级干部中有许多人已经忘了阶级斗争。这是不好的。\n列宁主义，布尔什维主义是两把“刀子”，拿起来就能和敌人战斗，而俄国人已经把这两把“刀子”都丢掉了，甚至某些人拿起这把刀致力于毁灭苏联。这就是布哈林不注意党内修正主义倾向的结果，才出现像图哈切夫斯基这样的反革命野心家。\n毛主席不希望党内去学习这种人，一味地丑化布哈林，而要按照实际情况办事。"
CPC_new_name_word: "新名词“走资派”"
CPC_new_name_word_desc: "我国城市和农村都存在着严重的、尖锐的阶级斗争。在所有制的社会主义改造基本完成以后，反对社会主义的阶级敌人，企图用“和平演变”的方式，恢复资本主义。社教运动的重点，是整党内那些走资本主义道路的当权派，进一步地巩固和发展城乡社会主义的阵地。只要全党更深入地、更正确地继续贯彻执行党中央关于社会主义教育运动的各项决定，抓住阶级斗争这个纲，抓住社会主义和资本主义两条道路斗争这个纲，走资派并不难发现，也不难扫清。"
CPC_socialist_agriculture: "社会主义农业"
CPC_socialist_agriculture_desc: "在经济上、政治上、思想上基本上战胜了资本主义道路之后，根据地发展了空前规模的农田建设，使农业生产比较稳定发展的新的基础。在克服右倾保守思想，打破农业技术瓶颈之后，出现了农业生产飞跃发展的形势，农产品产量成倍、几倍、十几倍、几十倍地增长，更加促进了人们的思想解放。在争取农业丰收的斗争中，发展出打破社界、乡界、县界的大协作，组织军事化、行动战斗化、生活集体化成为普遍的群众行为。\n以上种种成就，能够让我们庄严宣告：一个社会主义新农业的高潮，携带着不可阻挡之势，向全根据地奔涌而来。"
CPC_equity_recovery: "股权收回"
CPC_equity_recovery_desc: "1955年，根据地对私营工商业开始逐步公私合营改造，我们取得了大多数企业的管理权，资本家们仍可以无偿获得其所占股份的年终分红（即营业额）。由于经济困难时期的统战政策，中央未按十年约定期终结合同，这笔开销一直延续到今天。现在，社会主义建设总路线没有新旧资产阶级的位置，取缔私营经济势在必行，为根据地下一步行动打好基础。"
CPC_industrial_collective: "产业集体化"
CPC_industrial_collective_desc: "四十年代末为应对汪伪政权可能的入侵以及空袭，中央决定从西安、咸阳、宝鸡、渭南等地疏散工业，此后又经历多重风波使中央难以管理各地实际生产。得益于混乱结束，我们现在可以较清晰统计工厂及各手工作坊的地域分布，并准备把大部分产业合并到一起，集中经济力量。"
CPC_unified_production_criterion_Mao: "统一生产准则"
CPC_unified_production_criterion_Mao_desc: "公有制经济改造为根据地打破了产业壁垒，未来根据地可能要统领几十上百个企业共同生产，生产的社会化程度越来越高，技术要求越来越复杂，生产协作也就越来越广泛。因此生产标准化、规范社会生产活动，采取统一的、科学严谨的生产准则是十分必要的。"
CPC_go_to_the_mountains_and_the_countryside: "上山下乡"
CPC_go_to_the_mountains_and_the_countryside_desc: "即使大跃进时期，分散在各地的产业依然吸纳了超出计划的劳动人口，仅陕西省国营工厂从业人员就达到四十余万，大批员工没有劳动任务，成为闲散人群。与之相比，农村显然有更多需求，应该号召这些人到农村建设社会主义，接受贫下中农再教育，锻炼自己。"
CPC_beating_exercise: "严打运动"
CPC_beating_exercise_desc: "大跃进时期滞留在城市工厂、机关、学校的大量青壮劳动力，其中部分游手好闲的坏分子竟开始以违法犯罪为生。这些地痞流氓抱着“大法不犯，小法常犯”的狂妄思想，给社会风气、治安造成极其恶劣的影响，妇女不敢走夜路，父母不敢让孩子上街。中央已经下定决心，依靠广大的人民群众彻底根除这些害群之马。"
CPC_factory_community_construction: "厂院社区建设"
CPC_factory_community_construction_desc: "厂院社区即城市人民公社，将成为改造旧城市和建设社会主义新城市的工具，成为生产、交换、分配和人民生活福利的统一组织者，成为政社合一的社会组织。以职工家属及其他劳动人民为主体，吸收其他一切自愿参加的人，在党委领导和职工群众的积极赞助下组织起来的。它是以组织生产为中心内容，同时组织各种集体生活福利事业和服务事业。它能够大大改变城市特别是广大家庭妇女的面貌。"
CPC_labor_protection_compensation_Mao: "劳动保护补偿"
CPC_labor_protection_compensation_Mao_desc: "对劳动人民而言，劳动保护是其维护人身健康、提高工作效率、创造劳动价值的根本保障。为了根据地经济的生存与发展，预防工伤事故和各类职业病的发生，制定各种劳动保护措施。"
CPC_anti_economicist_black_wind: "反经济主义黑风"
CPC_anti_economicist_black_wind_desc: "许多工人受经济主义福利主义的蛊惑，在根据地经济最困难的时候向党中央发动进攻，恶毒诋毁毛主席领导下的社会主义建设总路线，在当时我们就予以严正批驳。\n工人要求是否正确，用工制度是否合理，本来是可以研究的。但在社会主义建设高潮开始之际，反动派们又抛出诱饵，打出“减工时，加工资”的经济主义口号，严重扰乱根据地的经济建设工作。西安全劳联等革命组织以及广大的革命无产阶级已经宣布与经济主义反动派划清界限，愤怒声讨这股资产阶级思潮。"
CPC_expand_product_release: "扩大产品投放"
CPC_expand_product_release_desc: "为了丰富城市居民的消费种类，为了丰富无产阶级日常生活的吃穿用度，在经济形势逐渐好转的大好形势下，中央决定为宝鸡第一国营商店和咸阳第二国营商店的可上架货物清单解封一批人民喜闻乐见的商品。\n政府将向居民发放“购物卡片”，发放标准一户一张，届时每户居民允许派出一人凭卡片进入国营商店按人口定量购物。"
CPC_eliminate_three_major_differences: "消除三大差别"
CPC_eliminate_three_major_differences_desc: "毛主席认为：在社会主义社会里，在生产资料所有制的社会主义改造基本完成以后，还必须突出无产阶级政治，逐步建立和发展人与人在生产和劳动中的新型关系，消除工农差别，城乡差别，脑力劳动和体力劳动差别后，我们才最终完成社会主义建设，防止资本主义复辟，为解放全国打下政权基础。"
#刘线
CPC_phase_2_Liu_tree: "刘主席的方针"
CPC_cooperatives_lead_retail_investors: "社带散户"
CPC_cooperatives_lead_retail_investors_desc: "生产资料所有制改造不是件小事，不是件容易的事，容不得乱搞。喊着“消灭剥削”，“建设社会主义”，实际犯的都是破坏生产、打击群众的错误，这种盲目乐观的情绪今后要避免。\n中央现研究决定，根据地农业建立高级合作社的总目标不变，但当前形势不允许我们进一步搞所谓的“共产主义”，因此应当解散一部分经营不善的农业合作社，尤其是濒临破产吃不上饭的那些社，允许农民单干一到两年，等到来年丰收恢复了生产再谈集体化。"
CPC_cooperatives_stand_up: "社自留地"
CPC_cooperatives_stand_up_desc: "马克思说：“空想的社会主义是反动的，错误的。” 遵照马克思的结论，我们曾经反对过农业社会主义思想，反对那种空想的，绝对平均主义式“同工同酬”的错误理论。 \n过去五六年中，合作社的成立是比较急促的，许多合作社过分地强调集体利盆和集体经营，错误地忽视了社员个人利靠、个人自由和家庭副业，这种错误必须迅速地纠正，这是不应该的，应该允许农民在集体化耕种之外另行开辟副业，不纳入公粮征纳范围，改善农民生活。"
CPC_trepall_the_purchase: "统购统销"
CPC_trepall_the_purchase_desc: "统销统购即粮食计划供应和计划收购的简称，这是党中央为了更好的转化农业产出，支援社会主义工业建设。公社粮库要按中央规定的价格、数量、品种向国家销售余粮，上交后计划外粮食可以自行处置；城镇居民由国家计划定量供应；非国家指定单位，禁止擅自销售。"
CPC_retail_contract: "散户包产"
CPC_retail_contract_desc: "事在人为，我们只有干出真成绩，体现政策价值。反对集体化的人只是一些私心比较重的贫农，觉得单干赚钱多，集体化来钱慢。对落后观念的改造不能着急，不能单纯依靠行政命令去压迫人，不要动不动就上“修正主义”的大帽子给人家戴。中央现在允许这一部分人从合作社里分开单干，中央将额外设置征粮指标。"
CPC_work_point_system: "工分制"
CPC_work_point_system_desc: "农村合作社内部强调按劳分配，多劳多得、少劳少得，根据每个社员的体力强弱和技能高低，经过集体评议和领导审定确定劳动等级，给定基础分。再按劳动时间、劳动时长、劳动强度等标准评定工分。这种做法突破了年龄和性别的限制，实行同工同酬，带动大家共同富裕。"
CPC_pay_for_yourself: "个体指标"
CPC_pay_for_yourself_desc: "对独立耕种的个体实行“三包到队、责任到户、定额到人、统一经营”的责任制，也就是在个人专管地段劳动质量负责制的基础上，加上产量责任制。具体做法是“队向社包工包产，户向队负责专管田上分摊的包产量”，包产量核算到每亩田，合起来就是队包产指标，而计划管理、定额管理的决定权在社，“社决定、队掌握、户执行”。"
CPC_agricultural_bank: "农业银行"
CPC_agricultural_bank_desc: "建立农业银行，是根据地加强支援农业的一个重要步骤，它将有利于管好用好中央支援农业的资金，发挥资金的效果，有利于促进农业生产的发展，并且有利于农村合作社和生产队更好地实行自力更生、勤俭办社的方针。\n各地党委和人民委员会加强对这项工作的领导，特别在开始建立时期，更要切实抓紧；要求各个有关部门和有关单位，密切同他们协作，从各方面给予支持，使他们能够顺利地开展工作；要求农业银行的同志，兢兢业业，虚心学习，努力钻研业务，努力作好工作。农业银行需要建立的工作很多，要分别情况，有计划地逐步开展和深入。在新旧机构交接的过程中，必须注意工作的衔接，防止脱节现象。"
CPC_rural_market: "农村集市"
CPC_rural_market_desc: "把所有零星分散的小农副产品和小手工业品，全部由国营商业和供销合作社包下来组织供应，事实上也难以完全办到。因此，在很小的范围以内，正确地利用集市贸易这种形式作为补充，是可以容许的。大中城市的集市贸易，应当是一些零星的农副产品的零售市场。在这种市场出售商品的，应当是郊区和附近地区进城出售自己产品的农民，经过批准从事一些鲜活商品短距离贩运的小商贩，以及出售家庭副业产品的城市居民和出售零星手工业品的个体手工业者。"
CPC_supply_and_marketing_cooperative: "供销社"
CPC_supply_and_marketing_cooperative_desc: "供销社是国营商业分销网络的重要节点，是各种资源传递交换的中转站。粮食统购统销要依赖供销社集中，城乡物质交换要依赖供销社分销。扩大供销社的职能，为进一步开展城乡物资交流，促进以互助合作为中心的农业增产运动，支援根据地工业化而奋斗。"
CPC_small_low_interest_loan: "小额贷款"
CPC_small_low_interest_loan_desc: "国家支援农业的资金将以贷款方式向民间释放。这些资金的分配和使用，由各级党委和人民委员会在上级分配的指标范围内安排确定。中国农业银行按照国家的计划、预算、政策和制度，按照既经确定的拨款额度、费用标准和贷款指标，逐笔审查核实，然后拨付和贷放。农业资金管理小组、有关主管部门和中国农业银行，对支援农业资金的使用情况，应当进行严格的监督和检查，随时总结经验，及时反映情况。"
CPC_research_bonds: "科研债券"
CPC_research_bonds_desc: "对农民而言，国债与其他金融手段相比具有多项优势：储蓄国债由财政部代表中央发行，信用高，安全有保证；发行利率固定，利息免税，收益稳定；30元即可认购，办理业务地点灵活，认购前无需风险评价，同样方便变现。\n对根据地而言，国债是宏观调控经济的重要手段，集中资金用于保障民生，扩大消费投资，还有更当务之急的事情——为根据地科研提供充足的资金。"
CPC_bureau_of_market_statistics: "中央统计局"
CPC_bureau_of_market_statistics_desc: "由于农业生产的增长，农民在完成国家统购派购任务以后，还有一部分剩余的农副产品需要出售，另一方面城市居民也有需要。在这种情况下，这些商品的调剂和交流成为必然。中央设立市场统计局加强对城乡集市的统一安排，加强价格监督，以及严格管理上市产品种类，禁止兜售管制物资及三类产品。"
CPC_acquisition_section: "收购科"
CPC_acquisition_section_desc: "供销社承担了一部分地方行政权力，因此中央决定单独设立政府部门挂靠在供销社以下，与市场统计局形成上下级承接的关系，具体事务具体担责。\n收购科负责监督收购产品的质量、数量，协调各地物资供需关系，统计银行及供销社出纳数额，监督地方政府是否存在强迫农民出售剩余产品的不法行为。"
CPC_price_section: "物价科"
CPC_price_section_desc: "供销社承担了一部分地方行政权力，因此中央决定单独设立政府部门挂靠在供销社以下，与市场统计局形成上下级承接的关系，具体事务具体担责。\n物价科的主要职能是平衡市场一般价格，监督地方政府是否存在强行压低物价，导致产品流失浪费的不法行为。"
CPC_discount_deposit: "折价存款"
CPC_discount_deposit_desc: "农业银行应当在保证完成国家计划收购任务（包括统购、派购和计划外换购）的前提下，采取换价、议价等方式，积极收购生产队和社员的剩余产品。\n假如有农民家中有剩余产品处理不完，可以运到县城由银行进行估价收购，再根据各地不同需求进行交换，运往当地供销社进行销售。个别商品适宜于国营商业经营的，也可以由国营商业经营。"
CPC_big_package_sale: "大包卖"
CPC_big_package_sale_desc: "供销社及村镇集市不能承担的市场业务，将全权由国营百货商店承担。市面上有的商品，国营的质量最好；市面上缺的商品，国营的一样不缺；根据地外时兴的商品，国营的照样有。"
CPC_rural_new_economy: "农村新经济"
CPC_rural_new_economy_desc: "为了更好地恢复经济，根据地的经济政策向后退了一大步，然而事实证明这些举措是正确的。粮食增收给农民阶级带来实惠，告别紧巴巴的日子，生活质量有了长足进步，人民群众的拥护爱戴就是对我们最大的肯定。"
CPC_equity_budget: "股权买断"
CPC_equity_budget_desc: "1955年，根据地对私营工商业开始逐步公私合营改造，我们取得了大多数企业的管理权，资本家们仍可以无偿获得其所占股份的年终分红（即营业额）。由于经济困难时期的统战政策，中央未按十年约定期终结合同，这笔开销一直延续到今天。现在，中央仍然以统战为要领，对这些剩余股份实行折价收购的政策，低价购买这些仍存在于私人手里的股份。"
CPC_industry_combination: "产业合并"
CPC_industry_combination_desc: "四十年代末为应对汪伪政权可能的入侵以及空袭，中央决定从西安、咸阳、宝鸡、渭南等地疏散工业，此后又经历多重风波使中央难以管理各地实际生产。得益于混乱结束，我们现在可以较清晰统计工厂及各手工作坊的地域分布，并准备把大部分产业合并到一起，集中经济力量。"
CPC_unified_production_criterion_Liu: "统一生产准则"
CPC_unified_production_criterion_Liu_desc: "公有制经济改造为根据地打破了产业壁垒，未来根据地可能要统领几十上百个企业共同生产，生产的社会化程度越来越高，技术要求越来越复杂，生产协作也就越来越广泛。因此生产标准化、规范社会生产活动，采取统一的、科学严谨的生产准则是十分必要的。"
CPC_city_Su_Fan_movement: "城市秩序整肃"
CPC_city_Su_Fan_movement_desc: "即使大跃进时期，分散在各地的产业依然吸纳了超出计划的劳动人口，仅陕西省国营工厂从业人员就达到四十余万，大批员工没有劳动任务，成为闲散人群。党中央决定对其采取胡萝卜加大棒的法子：既给予这批人员城市户口和相应待遇，又要在城市整顿治安秩序，清查城市党委组织，肃清马家封建余毒。"
CPC_education_subsidy: "教育补贴"
CPC_education_subsidy_desc: "为缓解教育支出压力，中央综合考虑各地情况，通过城市义务教育补助经费，对人口基数大、财力困难、民办义务教育占比较高等省给予适当奖补。\n严禁地方学校滞拨缓拨经费，严禁挤占、挪用、截留、克扣经费，确保学校正常运转。在安排学校公用经费时，要向薄弱学校倾斜。"
CPC_monitoring_working_hours_standards: "监督工时标准"
CPC_monitoring_working_hours_standards_desc: "过去我们的《劳动法》规定企业一律实行10小时工作制，但经领导视察发现长期备战状态下劳动时长政策难以执行，许多企业虽然纸面上规定10小时工作制，但都会用薪水、待遇，乃至于开除等手段对进行威胁，要求工人非自愿加班2-4小时，且不计入劳动时长。\n综合各方面考虑，在当下特殊时期中央重新修改《劳动法》，规定企业只能实行12小时工作制，严禁劳动时长外另行加班。如果企业内存在工人因“家庭困难要求自愿加班”的情况，地方工作组可代表党中央勒令企业建立援助基金，帮助工人疏解困难。"
CPC_labor_protection_compensation_Liu: "劳动保护补贴"
CPC_labor_protection_compensation_Liu_desc: "对劳动人民而言，劳动保护是其维护人身健康、提高工作效率、创造劳动价值的根本保障。为了根据地经济的生存与发展，预防工伤事故和各类职业病的发生，制定各种劳动保护措施。"
CPC_medical_subsidies: "医疗补贴"
CPC_medical_subsidies_desc: "加注医疗补贴基金额，提高职工医保最大限额，对重症、慢性病要贯彻管到底的精神，保证国企职工的人身健康。\n职工住院：三级医疗机构统筹基金支付比例86%，个人自付比例14%；二级医疗机构统筹基金支付比例89%，个人自付比例11%；一级医疗机构统筹基金支付比例92%，个人自付比例8%；社区卫生服务中心统筹基金支付比例92%，个人自付比例8%。\n职工子女亲属看病，同样享受公费医疗基金支付，但不能超过普通职工医保额度的30%。"
CPC_professional_skills_development: "专业技能培养"
CPC_professional_skills_development_desc: "面对企业职工良莠不齐的劳动素质，企业应加强对工人的劳动技能培训，根据劳动者自身情况有针对性的提供教育服务，定向定岗，明确分工。杜绝一人干活，十人看戏这种消极怠工的情形。"
CPC_tempered_into_a_steel: "百炼成钢"
CPC_tempered_into_a_steel_desc: "在取得一系列建设经验后，我们根据地的人民是更聪明了，不是更愚蠢了；是更谨慎了，不是更不谨慎了；是更强大了，不是更软弱了。全党的干部，全党的同志，应该同心同德。我们要集中全国革命力量的力量，在人力、物力、财力集中起来，在党中央和刘少奇同志的领导下，克服一切困难，胜利前进！"
#二阶段共享
CPC_PLA_announcement: "中国人民解放军宣言"
CPC_PLA_announcement_desc: "中国人民解放军，在粉碎马家军的叛乱之后，现已大举反攻。我军所到之处，敌人望风披靡，人民欢声雷动。整个敌我形势，和几年前比较，已经起了基本上的变化。\n\n同志们！我们肩负革命史上最光荣的任务，必须全力以赴。祖国的光明未来与同胞的美好生活，依赖我们的奋斗。我全军将士必须时刻牢记，我们是伟大的人民解放军，是伟大的中国共产党领导的队伍。只要我们时刻遵守党的指示，我们就一定胜利。"
CPC_PLA_reform_Mission_command: "任务式指挥改革"
CPC_PLA_reform_Mission_command_desc: "战争充满了不确定性，为此，上级指挥员应给予下级组织作战的自主权，充分发挥其主动性、创造性、灵活性，从而有效应对复杂多变的战场环境，以夺取和保持主动权。\n\n根据该指导思想，我军应尽快落实明确作战意图、作战指导和作战任务，而不规定完成任务的具体行动方法的指挥方式改革。"
CPC_PLA_reform_Centralized_command: "集中式指挥改革"
CPC_PLA_reform_Centralized_command_desc: "党是无产阶级先锋队和无产阶级组织的最高形式，它应当领导包括军队在内的一切其他组织。惟有坚持党的集中统一领导，协调党政军民各方面的步调，方能夺取解放战争的胜利。\n\n根据该指导思想，我军应尽快落实明确指挥关系，加强信息沟通，灵活调整指挥的指挥方式改革。"
CPC_PLA_emphasize_military_democracy: "强调军事民主"
CPC_PLA_emphasize_military_democracy_desc: "在练兵时，官兵互教，兵兵互教；在作战时，在火线上连队开各种针对战斗任务的大、小会，以此放手发动士兵群众、指挥员和一切工作人员，从而提高解放军的技术和战术。"
CPC_PLA_newtype_reorg_movement: "新式整军运动"
CPC_PLA_newtype_reorg_movement_desc: "随着解放区的扩张与土地改革运动的深入发展，新的成分大量进入军队，军队自身建设任务的急迫性变得日益突出。\n\n为适应战争形势和解放区土地改革、整党运动发展的需要，提高参军的新兵的政治觉悟，中央决定以诉苦、三查和三整为主要内容，进行新式整军运动。"
CPC_PLA_strengthen_military_staff_officer: "强化参谋职能"
CPC_PLA_strengthen_military_staff_officer_desc: "为缓解集中式指挥存在的下级依赖性大，适应性差，组织时间长的弊端，同时提升组织决策效率与质量，强化参谋职能的重要性变得日益突出。\n\n为此，中央决定提升参谋人员素质，完善参谋机构设置，建立健全参谋制度。"
CPC_PLA_Regularization_of_the_PLA: "解放军正规化"
CPC_PLA_Regularization_of_the_PLA_desc: "从八路军时期开始，我们便一直采用游击战法袭扰敌后以配合正面战场的行动，然而，随着正面战场的溃败，我们执行敌后游击战术策略的条件已经不复存在。在可见的未来内，若要重新点燃抗日的烽火，我们将无可避免地将在南方平原丘陵地带与敌寇展开正面决战，这就需要我们进行正规化以适应未来抗日的需求。"
CPC_PLA_reorg_movement: "整肃军纪"
CPC_PLA_reorg_movement_desc: "兵以治为胜，治以严为要。惟有纪律严明方能使人民军队无往不胜。\n\n人民军队三大纪律八项注意，实行多年，其内容各地各军略有出入。现在统一规定，重行颁布。望即以此为准，深入教育，严格执行。"
CPC_PLA_emphasize_backend_construction: "强化后方建设"
CPC_PLA_emphasize_backend_construction_desc: "稳定的后勤保障，是前线作战顺利进行的基石。阵线应对军队后方的经济、交通、通信、医疗、物资储备等方面进行全方位的建设和准备，从而提高我军的整体防御能力和战争潜力。"
CPC_PLA_military_academy_construction: "兴办军事院校"
CPC_PLA_military_academy_construction_desc: "目前，我军存在军事院校教育不正规、不统一、太简陋的状况。尽快新建一批适应培养现代作战人才的各类院校，形成正规化的军事教育体系，成为了人民军队建设的一项十分迫切的任务。"
CPC_PLA_regular_confrontation_exercises: "常态对抗演习"
CPC_PLA_regular_confrontation_exercises_desc: "近年来，我军与敌寇的大规模冲突较少，我军应定期进行模拟攻击和防御的训练活动，以提高应对能力，发现并解决军队中存在的问题。"
CPC_PLA_FOR_THE_FINAL_TRIUMPH: "向最后的胜利……"
CPC_PLA_FOR_THE_FINAL_TRIUMPH_desc: "要英勇冲锋，歼灭敌寇，\n要大声呐喊，唤起人民，\n发扬革命的优良传统，\n创造现代的革命新军，\n为了社会幸福，为了民族生存，\n巩固团结坚决的斗争。\n抗战建国高举独立自由的旗帜！\n\n——1939年，《新四军军歌》"
CPC_PLA_FOR_THE_NATIONAL_LIBERATION: "……向全国的解放"
CPC_PLA_FOR_THE_NATIONAL_LIBERATION_desc: "我们的队伍向太阳，\n脚踏着祖国的大地。\n背负着民族的希望，\n我们是一支不可战胜的力量！\n我们是善战的前卫，\n我们是民众的武装，\n从无畏惧，绝不屈服，永远抵抗\n直到把日寇逐出国境，\n自由的旗帜高高飘扬！\n\n——1939年，《八路军进行曲》"
CPC_proposal_of_Huangyin: "西南方略"
CPC_proposal_of_Huangyin_desc: "西南国防阵线主要领导人近日委托李井泉同志在政务委员会大会上作了关于康藏问题的演讲，并在大会上得到了一致认可和通过。我们认为，要冲破共荣圈的封锁，就必须收复藏区，打通与印度联系的陆上通道，继而通过印度联系到世界上其他反日帝势力。\n西藏问题将成为我们当前外交工作的首要重点。"
CPC_meet_the_panchen: "接见班禅"
CPC_meet_the_panchen_desc: "噶厦政权内部长久以来存在两大活佛世系的政教纷争，而根据派驻康藏地区同志的消息，十世班禅确吉坚赞活佛似乎表达出了想与我阵线进行接触交流的想法，天赐良机不可错失，我们必须尽快着手准备接见班禅活佛。"
CPC_armed_pilgrimage: "武装朝圣"
CPC_armed_pilgrimage_desc: "在同确吉坚赞班禅进行交流后，我们得知拉萨方面的达赖及其宗派长期以来一直倾轧刁难身处日喀则的班禅。达赖甚至蛮横无理地阻碍他和信众前往拉萨朝觐。\n或许，我们可以“武装护送”班禅前往拉萨……"
CPC_obtain_buddhist_scriptures: "恒沙无明"
CPC_obtain_buddhist_scriptures_desc: "中央计划未来自西部陆上口岸经印度向世界上较大的反法西斯国家建立联系，印度作为中央对外战略中的重要中转站，其国内局势错综复杂有如恒河沙尘，惑障人眼不得光明。\n\n必须对印度国内局势作出精准判断，方可使得抗日反帝解放事业得以向前发展。"
CPC_belated_consult: "迟来的请示"
CPC_belated_consult_desc: "数十载斗争辗转艰难，我党海南支部终于与我们建立了初步联系。\n从海南支部的消息中我们大致得知了如今华南、东南亚地区的情势。如果我们要冲出日帝包围网，同世界上其他反法西斯国家建立关系，我们就必须突破敌人在华南、东南亚地区的封锁。"
CPC_Unlock_SEA_GUI: "我们将和§Y中国共产党海南支部§!的同志们建立秘密联系，§Y影响东南亚§!的界面现已可用，请在£CPC_texticon §x党代会§!GUI的顶栏中找到£CPC_texticon §R华南局§!界面。"
CPC_message_from_east_mon: "兴安飞讯"
CPC_message_from_east_mon_desc: "从白山黑水而来的电波带来了令人惊喜的消息，如何对待这幸存的火种又成为了一个难题。\n\n中央决定，待向抗联代表了解具体情况后，召开工作会议，拟定行动。"
CPC_rearrange_najua: "重组联军"
CPC_rearrange_najua_desc: "由于抗联所处环境恶劣，成员鱼龙混杂，且西撤行动较为困难，对联军整顿重组的需求，迫在眉睫。\n\n因此，军委建议提供援助并指导联军重组，按自愿原则组织西撤。"
CPC_rebuild_party_najua: "整顿党委"
CPC_rebuild_party_najua_desc: "为图生存，抗联同中央失联后便不得不大幅简化政治教育，同时转移到相对荒凉的外满，联合当地朝鲜族游击队，苏联远东红军残存力量等。\n\n应当说这是必要的妥协，抗联的策略对荒凉但危险的外满是行之有效的，却终归不是共产党能发展走向成熟的正确道路。\n\n故此，我们必须对东北抗联的党组织关系进行一次清查和整顿，务求抗联摆脱独立发展时期产生的一些无奈错误。"
CPC_corridor_between_yunnan_and_burma: "滇缅走廊"
CPC_corridor_between_yunnan_and_burma_desc: "缅甸，原为英属印度领土，战后在日本的帮助下宣布“独立”，事实上仍然是听命于东京的傀儡政权，我们从琼崖纵队获悉，一支被称为“克钦人民军”的革命武装力量长期在缅甸东部各邦活动，并长期接受琼崖纵队的秘密资助。"
CPC_red_trace_in_jungle: "密林红踪"
CPC_red_trace_in_jungle_desc: "越共自建党伊始便同中国革命有密不可分的联系，尽管日本帝国主义一时得胜令我党与越共兄弟分隔，但我们始终都抱定抗日救国的坚强决心，各自发展出稳固的革命根据地。\n\n如今我们拥有了更胜往昔的力量，就应该肩负起领导亚洲人民反帝斗争的任务，帮助越南的革命同志夺取全国政权，赶走日本侵略者！"
begin_civilwar_in_vietnam_tt: "在我们的影响下，§G越南的共产主义者§!将掀起反抗！\n将能派遣§Y2支志愿师协助§!当地共产主义者解放越南。"
CPC_hell_in_pure_land: "净土炼狱"
CPC_hell_in_pure_land_desc: "来自柬埔寨共产党的消息称，柬埔寨内战战场上似乎出现了泰国步兵的身影，柬埔寨共产党总书记沙洛特绍已经通过海南向我们发出求援信号——尽管柬埔寨内战的局势混乱程度远超我们的估计，但我们仍然不可放弃这不可多得的肢解共荣圈的机会，立刻向柬埔寨增派志愿军。"
CPC_victory_in_southeast: "东南形胜"
CPC_victory_in_southeast_desc: "我们在东南亚的工作已经取得了喜人成果，红色政权如雨后春笋般在东南亚正式成长了起来。团结东南亚各兄弟政权的条件已经成熟，肢解共荣圈东南亚后方资源产地的总目标已经基本达成。"
CPC_victory_in_southeast_tt: "我们投下了镌刻着£CPC_texticon §R镰锤标志§!的骰子，等待着§Y历史与人民§!的决断……"
CPC_indicate_of_Qiongzhou: "琼州指示"
CPC_indicate_of_Qiongzhou_desc: "周恩来同志在政务委员会大会上作了关于东南亚问题的报告，报告强调随着我们近期工作取得了一连串成果，恢复与海南支部的联系将是可行的，我们可以将海南作为支点影响东南亚局势。\n东南亚问题将成为我们当前外交工作的首要重点。"
CPC_positive_contact: "积极联络"
CPC_positive_contact_desc: "在经过共同努力后，我们已与海南支部建立了较为稳固的联系，冯白驹同志在最近的电报中表示，海南在东南亚耕耘日久，已经形成了数条稳定的航线，以及一个遍布东南亚的情报网络，可以随时供我们使用。"
CPC_overrun_in_southeast: "纵横东南"
CPC_overrun_in_southeast_desc: "东南亚的局势不同于中国，该地是共荣圈的大后方，受日本陆海军的严密保护，若想在这一地区为海南攫取利益或是策动抗日势力起义，我们将不得不投入更多政治资源——为了肢解共荣圈的总外部目标，我们必须做好充足的准备。"
CPC_falling_leaves: "落叶归根"
CPC_falling_leaves_desc: "党的工作分为明暗双线，二十年前为了确保西安不落入敌手，党以暴露地下战线为代价成功控制了西安，这也导致地下战线工作陷入长期休克的状态。\n随着阵线经济工作和组织工作的恢复，是时候重新启动地下战线的工作了——这次，我们将派出一位特殊的女同志前往山西……"
CPC_two_buddha_scramble: "二法争衡"
CPC_two_buddha_scramble_desc: "西藏的确吉坚赞班禅通过与康区同志的秘密联系渠道向我们发来了一封信，我们得知班禅与拉萨方面的达赖多有龃龉，达赖甚至阻碍班禅去拉萨朝圣，这无疑给了我们一个绝好的机会，我们将以确吉坚赞和阵线的联合名义向拉萨发布最后通牒，警告他分裂西藏的无耻行径。"
CPC_educated_youth_brigade: "知青旅"
CPC_educated_youth_brigade_desc: "尽管已经策动克钦人民军起义，我们发现缅甸反动政权的反扑仍然十分凶恶，有必要号召青年团结起来组成知青旅，向克钦人民军增派支援。 "
CPC_blood_in_country_of_buddhist: "佛国血光"
CPC_blood_in_country_of_buddhist_desc: "来自柬埔寨共产党的消息称，柬埔寨内战战场上似乎出现了泰国步兵的身影，柬埔寨共产党总书记沙洛特绍已经通过海南向我们发出求援信号——尽管柬埔寨内战的局势混乱程度远超我们的估计，但我们仍然不可放弃这不可多得的肢解共荣圈的机会，立刻向柬埔寨增派志愿军。"
CPC_admit_phase_2_final_tree: "1968年§Y中国共产党第九次全国代表大会§!将开始筹备，九大相关的§Y国策树§!已经解锁。"
CPC_1968_5_1_festival: "劳动节"
CPC_1968_5_1_festival_desc: "盛大的节日来到了！作为全体劳动人民的节日，今年劳动节的重要地位与特殊意义更加凸显。经过这五年艰苦卓绝的奋斗，中国共产党团结带领各族人民在全阵线确立了社会主义基本制度，实现了中国历史上最伟大的社会变革。阵线在内政外交各个方面均有长足进步，不仅祖国的半壁大好河山已经解放，东南亚的革命烈火也正熊熊燃烧。\n\n我们用最有力事实攻破了内外反对派的污蔑造谣。值此胜利跃进之际，党中央决定将在年内召开党的第九次全国代表大会，吹响向胜利进军的号角！"
CPC_1968_preparatory_conference: "筹备大会"
CPC_1968_preparatory_conference_desc: "如今阵线已在中国西部各地区扎根，社会面貌也是日新月异。党中央认为，在伟大的[CPC.GetLeader]思想指导下全阵线基本完成了社会主义改造，确立社会主义制度的任务已经完成，总路线取得了决定性的胜利，因而召开党的九大便成为巩固已取得的成果的一项迫切任务。九大预备会将在西安召开，届时[CPC.GetLeader]主席将在预备会上提出九大的任务与大会指导思想，规划好各地代表参会事宜与安保工作。"
CPC_bookmarks_fake_2: "筹备大会"
CPC_bookmarks_fake_2_desc: "如今阵线已在中国西部各地区扎根，社会面貌也是日新月异。党中央认为，在伟大的[CPC.GetLeader]思想指导下全阵线基本完成了社会主义改造，确立社会主义制度的任务已经完成，总路线取得了决定性的胜利，因而召开党的九大便成为巩固已取得的成果的一项迫切任务。九大预备会将在西安召开，届时[CPC.GetLeader]主席将在预备会上提出九大的任务与大会指导思想，规划好各地代表参会事宜与安保工作。"
CPC_1968_deputies_from_SIC: "四川代表"
CPC_1968_deputies_from_SIC_desc: "南下解放川渝后，拥有富足粮田与大量人口的川区便一跃成为阵线重要核心。社会主义建设数年以来，该地区一直是阵线南方重要的御敌屏障，这给我们未来解放全国的工作提供了对敌工作、高效接收、安全保卫等宝贵经验。数年建设中，西南也培养出了一大批储备干部，以作为祖国东部解放后的组织建设基底。在四川积累的各项经验将有效地使阵线顺利解放全国。"
CPC_1968_deputies_from_QIN: "陕西代表"
CPC_1968_deputies_from_QIN_desc: "无论是革命圣地延安，还是我党第一个控制的大城市西安，皆表明了陕西为阵线无可争议的政治文化中心，尤其是西安、汉中两市为代表的关中汉中城镇群，代表了在我们探索长期抗日与社会主义建设中的最新经验。与晋豫鄂三省相邻，更让陕西成为了阵线与日伪长期对峙的最前线。从建设到斗争，陕西为我们提供了相当多可供借鉴的最新经验。"
CPC_1968_deputies_from_XIN: "新疆边区代表"
CPC_1968_deputies_from_XIN_desc: "[CPC_1968_deputies_from_XIN_desc]"
CPC_1968_deputies_from_XIN_desc_1: "自盛世才统治崩溃到如今九大召开，马仲英将军一直是新疆革命主要领导人之一。八大时因新疆新近解放，马仲英坐镇迪化未能赴陕参会。现在他不辞辛苦和一众新疆人民群众来参加大会，坚定地拥护祖国统一、民族团结的大政方针，新疆地区将在阵线未来的规划中承担更为重大的历史使命，在此向马仲英将军及一直以来支持我们的新疆人民致以崇高敬意。"
CPC_1968_deputies_from_XIN_desc_2: "多年以来，新疆始终处于割据状态，个别分裂分子勾结帝国主义势力，大肆宣扬民族分裂主义，蓄意制造民族矛盾，致使新疆人民不信任党的领导，不服从党的领导。长期将阵线人民的好意当做讨价还价的资本，对于少数破坏分子想在新疆制造第二个“满洲国”的错误思想，我们要坚决予以打击和歼灭，让其回归祖国与人民的怀抱。"
CPC_1968_deputies_from_XIK: "西康代表"
CPC_1968_deputies_from_XIK_desc: "西康地区在历任统治者的手中，都被寄予“化边地为腹地”的希望，我党自然也不例外：康区是西南局党委驻地，是我党在西南活动的重要基地，可以说，我党在西南地区活动的顺利开展离不开刘文辉先生的鼎力相助。其领导的西康省府也是反对国民党独裁，坚持抗日，同帝国主义分裂势力作斗争的西南核心。"
CPC_1968_deputies_from_QGN: "西北代表"
CPC_1968_deputies_from_QGN_desc: "马家军叛乱之后，中央践行民族平等原则，制定正确民族政策，并将开发大西北列为一项重要政策，五年耕耘到如今已到丰收之时。如今，西北各民族团结平等亲如一家，工农业产值几年内就翻了两番，人民生活水平与陕川等富庶地区已相差不大，我们必将依靠全国各民族人民群众的坚强支援，完成抗日统一的历史伟业。"
CPC_1968_deputies_from_TIB: "西藏代表"
CPC_1968_deputies_from_TIB_desc: "西藏解放后，藏区人民将帝国主义侵略势力出驱逐西藏，掀起了轰轰烈烈的社会主义改造运动，实行民主改革、废除封建农奴制度。西藏还主动担起我们对外沟通的重任，与印度等世界各国建立了联系，在支援东南亚革命中也出力甚多。之后一周的先头接洽中，周恩来总理会了解西藏现今发展的困难问题，以便对改造深度和广度做出合适调整。"
CPC_1968_central_ministries: "中央汇报"
CPC_1968_central_ministries_desc: "在处理完地方事务后，周恩来还要与中央各级领导干部汇总情况，听取收集中央各类党委的资料汇报，以此主持编写《关于下阶段的阵线经济发展规划的建议报告》，来在九大上发言。《建议》将总结过去的经验教训，规定下阶段阵线发展的基本任务，以饱满的热情迎接下一个社会主义高潮的到来。"
CPC_1968_interior_ministry: "内政"
CPC_1968_interior_ministry_desc: "[Get_CPC_1968_interior_ministry_desc]"
CPC_1968_mao_interior_ministry_desc: "过去几年在党的领导下，我们统一了全阵线的各种体系。财政改为统收统支，由中央统一安排。用西北剿匪反特斗争逐渐改革各级公安部门，推行凤桥经验，完善武警体系建设。老中青三结合模式成为各级领导班子和干部培养的基本原则，为党和阵线提供了大批可靠能干的人才。内政上我们已不亚于任何主流政府。"
CPC_1968_liu_interior_ministry_desc: "过去几年在党的领导下，我们对全阵线的各种体系完成了专业化体系建构。财政改为统收统支，由中央统一安排。警察任用军衔，彻底理顺各方管理关系，明确职权责任。增加学校建设，培养建设所需的专家干部，使其成为各级领导班子骨干。内政上我们已不亚于任何主流政府。"
CPC_1968_industry_ministry: "工业"
CPC_1968_industry_ministry_desc: "[Get_CPC_1968_industry_ministry_desc]"
CPC_1968_mao_industry_ministry_desc: "过去几年阵线的主要财政支出皆回馈农村，大力扶持社队企业，以五小工业为内容推进农村工业化，用知青下乡来提高农村劳动力素质和工业建设专业程度，并有计划地发展轻工业生产，将农民无产阶级化。工业生产与农业生产密切结合，同时也满足社员日常生活需要服务，为阵线的大工业和社会主义的市场服务。"
CPC_1968_liu_industry_ministry_desc: "过去几年阵线的主要财政优先集中投资建设重工业，并将将分散的中小业主也集中进大厂，发展形成规模效益，还推行厂长负责制，加强党组织的监督作用，展开了劳动竞赛和生产激励，提高了工业在阵线经济中的比重。形成了大量的先进社会主义工业区、城市区，反哺农业实现机械化。"
CPC_1968_agriculture_ministry: "农业"
CPC_1968_agriculture_ministry_desc: "[Get_CPC_1968_agriculture_ministry_desc]"
CPC_1968_mao_agriculture_ministry_desc: "先改变生产关系，才能发展生产力，农民是积极要走社会主义道路的。而联乡并社发展生产力便成了农业的主要任务。公社解决小社在修建水利设施时劳力不足和沟通协商的问题，机耕、灌溉面积每年翻倍增加，改善了农业生产条件，使得粮食产量逐年增长。还稳了定农村社会，保持了生产生活秩序的稳定，为阵线工业化战略提供资金。"
CPC_1968_liu_agriculture_ministry_desc: "先改变生产关系，才能发展生产力，这就需要进一步加强和完善农业生产责任制。这些措施，纠正了生产指导上的主观主义和分配中的平均主义。有效地调动了农民的生产积极性，释放农村劳动力潜能，激活农村市场经济，使农业生产得到比较迅速的恢复和发展，绝大多数农民的收入有所增加，农村的形势越来越好。"
CPC_1968_foreign_ministry: "外贸"
CPC_1968_foreign_ministry_desc: "五年来，阵线对外贸易取得长足发展，成为带动经济增长的重要动力。我们目前已经开辟了三条贸易路线：北通蒙古、西交哈萨克、南连印度。总的来说，目前国防阵线内的商品供应日益充足，发展工业农业所急需的原材料也通过贸易得到了补充。"

CPC_1968_GOOD_NEWS: "喜报"
CPC_1968_GOOD_NEWS_desc: "紧跟毛主席就是方向，紧跟毛主席就是光明，紧跟毛主席就是胜利。我根据地全体人民和党政军同志们无限热爱伟大领袖毛主席，无限忠于战无不胜的毛泽东思想，无限拥护毛主席的革命路线。毛主席怎么指挥，我们就怎么行动；以毛泽东主席、刘少奇同志为首的党中央怎么部署，我们就怎么紧跟，中国革命的胜利是属于我们的！"
CPC_phase_2_done_most_focuses: "我们关于§G农业§!、§m工业§!、§Y军事§!的改革发展工作均已暂告一段落，已有能力开始着眼§x核工业研究§!！"
CPC_NUKE_BEGINS: "核计划立项"
CPC_NUKE_BEGINS_desc: "经过五年艰苦卓绝的建设斗争，阵线在政治经济军事各个方面均有长足进步，经党中央论证研究，代号：§x曙光§!§O计划§!将正式启动。这将是我党我军我阵线掌握§x终极武力§!的必由之路。"
CPC_NUKE_BEGINS_tt: "新的§x核计划§!面板现已可以从§Y决议§!进入。"
CPC_NUKE_select_a_manager: "确定项目主管"
CPC_NUKE_select_a_manager_desc: "国防科委已经组建完成，我们挑选了一批相对年轻且有一定文化背景的同志来推进核计划，现在，是时候为国防科委选择一位总负责人了。"
CPC_NUKE_expand_research_institute: "扩展研究所"
CPC_NUKE_expand_research_institute_desc: "科委建议：对阵线内各大高校进行一次重组，与核计划直接相关的核物理、材料科学等专业将被单独抽离，以组建对应的中央科研院所。\n\n中央指示：西安市委要全力配合科委完成院校重组工作，确保相关研究人员正常开展研究。"
CPC_NUKE_select_college_talents: "遴选高校人才"
CPC_NUKE_select_college_talents_desc: "从重组后诞生的西北工业大学相关院系遴选一批政治觉悟特别高，专业素质特别硬的人才，编入核计划工程人员名单，此项工作特别重大，需慎之又慎，一定要坚定保密意识。"
CPC_NUKE_verify_the_nuclear_theory: "验证核物理理论"
CPC_NUKE_verify_the_nuclear_theory_desc: "将西北国防研究院的专家学者召集起来，对目前主流的核物理理论进行再论证和计算，以确保后续工程进展顺利。"
CPC_NUKE_select_a_experimental_site: "试验场选址"
CPC_NUKE_select_a_experimental_site_desc: "根据世界上其他核大国——尤其是美国的经验，核试验场地总的来说需要这些标准：人烟稀少，气候稳定。\n\n我国西北地区地广人稀，是天然的优质核试验场地，但我们仍要审慎调研，优中选优，绝不能让核试验打扰到当地人民的正常生产生活。"
CPC_NUKE_supporting_industries: "集中配套工业"
CPC_NUKE_supporting_industries_desc: "原子弹作为一种重要的战略威慑武器，对国家安全具有重要的战略意义。如果一个国家没有足够的配套工业支持，就无法实现核弹的研究和制造，也就无法具备核威慑的能力。\n\n因此，集中配套工业在核弹研究中的重要性是不可替代的。它不仅是核弹研究和制造的基础，还是确保核弹质量和性能以及国家安全的重要保障。"
CPC_NUKE_searching_uranium_mine: "勘探境内铀矿"
CPC_NUKE_searching_uranium_mine_desc: "经过勘探，我们在川康地区确认了一批富铀矿藏，主要分布在南部地区，如凉山、乐山、攀枝花等地。应组织专门的矿业单位前往勘探挖掘。"
CPC_NUKE_day_by_day: "夜以继日"
CPC_NUKE_day_by_day_desc: "我们深知拥有核武非一朝一夕之功，但我们仍决定迎难而上，日以继夜埋头苦干，誓要向全世界证明：中国人民不会向日本帝国主义的原子弹低头！中国抵抗的决心比山还要高，比海还要深，比金刚石还要坚不可摧。"
