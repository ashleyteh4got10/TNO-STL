 #事件
CPC_8th_congress.1.t: "大扫除"
CPC_8th_congress.1.d: "西安大会堂突然迎来了一次例行日程以外的大扫除，任务清单上不仅包括清扫主会堂，连许久未用的一些旁厅也要彻底打扫一番。\n\n刚来的小唐没见过如此大阵仗，进行清扫工作也就心不在焉，少不了要东张西望朝那些可靠的老资格们打听打听最近有啥重大活动。\n\n老宋是这么说的：“这我也没见过，那年国防阵线成立的时候这大会堂都还没建起来呢，后面每年的中央工作会议也没这么多地方要扫。”\n老李神秘兮兮地笑了笑：“这得是打垮马匪以后举行的庆祝会吧，咱都过了多少年穷日子了，好不容易攒了两年家底儿可不得庆祝庆祝。”\n老赵是小组里唯一一位党员，他翻了翻万年历，若有所思：“……怕是到时候咯……”\n\n小唐、老宋和老李一起凑了上来：“啥就到时候了？”\n“那些个旁厅，什么‘陕西厅’、‘西康厅’，那些地方也得一起扫，你们瞅瞅地图都是啥地方。”\n“你这不废话，咱国防阵线的地盘呗。”\n“那不就结了，啥大事能让西康新疆这些地方上的领导都上来开会啊？”老赵干笑两声，“七大都多久以前的事了，那会都没国防阵线呢，眼下刚刚平定了好些地方，正准备搞大生产运动，也该开次新的了。”\n\n小唐若有所思：“你这么一说还真是，开七大的时候我都还是个小屁孩呢。而且看党中央这次……”话音未落，老赵慌忙捂住了他的嘴。"
CPC_8th_congress.1.o: "“咱扫地的可别瞎多嘴！”"
CPC_8th_congress.6.t: "没有意思"
CPC_8th_congress.6.d: "周恩来在接待室里已经走了十几来回，焦虑和脸上的皱纹一般多，服务生煮好的茶水他一口没喝。\n\n南下战役是根据地前所未有的大胜利，一扫大跃进以来阴沉低靡的失败气氛，可毛主席在社论里写的“趁热打铁，乘胜追击”八个字却立刻勾起周心中的隐痛。打击马家军——大跃进——经济困难——内乱，这条公式犹在眼前。四川解放后，一方面建设百废待兴，这就足以刺激毛主席的兴奋神经，拦不住得上马项目，想要大干一场；另一方面，南下战役已经惊动国民党政府，各条战线都面临着高宗武的应激反应，人力、物力捉襟见肘。周恩来把这些情况都写进今年的报告，并额外创作一封意见书，托秘书送进主席的书房。可两天过去，开大会的日子都要到了，书房里还是一点回音也没有。周恩来似乎清楚了毛主席的心思，但总理义务还是驱使着他亲自登门，造访追问意见书的下文。\n\n就这样转了半小时圈，书房门打开，毛主席的秘书王力走了出来，习惯性微笑着把意见书双手递交给周:“总理，您的文件。”\n\n“主席，有没有看我的报告。”\n\n“看了，”王力顿了一顿，“上面有给您的批示。”\n\n意见书最后一页，稿纸花绿绿的横格下边，朱红毛笔龙飞凤舞赫然批着八个大字。周恩来看完，喉咙里涌上一股辛酸。"
CPC_8th_congress.6.o: "“只观其一，不观其余。”"
CPC_8th_congress.14.t: "你要面子，我要里子"
CPC_8th_congress.14.d: "看着康生递给自己的烟卷，博古摆了摆手拒绝抽烟，他不想让眼前这个特务大王转移话题：“康生同志，你的分内工作我不该指手画脚。可你也替别人想想，少数民族工作一定要细致，不能再走过去粗暴的老路。”\n\n康生在接待室里转了两圈，把从公共盘子里拿出来的招待烟卷又排齐摆了回去，他也没有抽烟的习惯，只是想借请烟的空当缓解一下博古等人的攻势。在蒙古问题上，他已经自知理亏了，可破获蒙古间谍的案底历历在目，谁敢说肃反一无是处？这长长的名单不是成绩吗？\n\n“你大手一挥，这些人全都按间谍罪处死，可之后呢？你怎么向毛主席交代？怎么向蒙古群众交代？说‘蒙古人没有一个好东西，都是破坏国家稳定的反动派’？你有没有想过少数民族干部怎么看咱们这些汉人党员？我们还怎么展开工作？”\n\n康生没言语，也不敢正眼看博古，假装捶捶自己的大腿，掸了掸裤子上的飞尘。\n\n“你这就是大汉族主义作祟，毛主席早就批判过，列宁也批过孟什维克搞的‘文化保护主义’，你的党课都白上了？不给少数民族政治权利、脱贫解困，你谈什么民族平等？”"
CPC_8th_congress.14.o: "不搞了，不搞了。"
CPC_8th_congress.15.t: "民兵师解惑"
CPC_8th_congress.15.d: "“毛主席说要‘大办民兵师’是个口号，并不是把‘师’都搞起来。县长当师长、书记当政委，靠两个人抓什么东西？师长政委解决什么问题？空架子，抓不住。真正有事，能以连为单位拿出来就很好。民兵很分散，他们的活动，主要在基层，在班、排、连。以师为单位的活动很困难。正规军也不能成师在一块活动。平时不能搞那么多师团架子，战时也不需要搞两三千个师。打不了仗，也养不起。民兵工作的中心任务是搞好生产，不能妨碍生产，要促进生产，把它搞大了，反而妨碍生产。\n\n“刘主席参观了工厂，讲了话，动员部根据刘主席的讲话写了一个文件。中央的方针，我们要坚决贯彻，认真执行，我们平时不能够养兵太多了，国家的财富不是用作扩大生产，而是拿来养了兵，这是不行的。所以我们平时养兵是要有限度的，到一定的饱和点就不能再多了。再多了就不得了。军队是脱离生产的，好几个老百姓才能养一个兵。我们是人民战争，把民兵工作搞好，平时养兵虽少，战争就有无穷无尽的兵员。刘主席说工厂要自己保卫自己！”\n\n……徐向前直讲得口干舌燥，终于将大办民兵师的逻辑和办法理顺，“总的而言，我们大办民兵师有一个最终的目标——”"
CPC_8th_congress.15.o: "“——保质保量！”"
CPC_8th_congress.16.t: "前途"
CPC_8th_congress.16.d: "“今天的会林总不去了，他胃疼。”\n\n推走周恩来的秘书小赵，叶群关上了宾馆房门。门外小赵通知各位首长开会的声音还时不时传入她的耳朵里，这都拜房子里冷冷清清所赐。林彪眼皮都懒得抬一下，胳膊撂在扶手上，身子摊在沙发上，两条腿交叉搭在前边的坐墩上，再拿个毛毯往身上一盖，活像一个泥娃娃。这就是林彪每个白天的“固定活动”。\n\n整天对着老伴这样一套死相，叶群实在忍不住了，她压了压自己的火气，尽量温柔地说：“拉着我千里迢迢从西安赶到这儿来开会，结果你去了一次就装病不去了，我就这么陪着你干耗了五天。我都不明白你心里想的是什么。”\n\n“嗯？”这种唠叨林彪已经听到太多，搁在过去肯定要急眼，现在他心如止水假装自己没听见，还吱了一声，“你说什么？”\n\n“我说——，你找江青拍的照片她已经让秘书给你送来了。”叶群拿出了公文袋，里面装着一张林彪认真研习毛泽东选集的照片。\n\n“哦，明天登到画报上，给全军一人发一份。”\n\n听到这话，现在就连叶群也闹不清老伴究竟有没有“上进心”，拽把椅子坐在林彪面前，试探着问他：“明天军队开会，你去不去？”她最怕林彪张口就是“不去”，简直把心提到了嗓子眼。\n\n林彪慢慢睁开眼睛，看着叶群一脸热切期盼，有气无力地说道：“去和各大军区领导干部见见面，也好……”\n\n叶群瞬间解脱了，长长舒了一口气。"
CPC_8th_congress.16.o: "“就说明天抱病参会。”"
CPC_8th_congress.17.t: "茶话会"
CPC_8th_congress.17.d: "西安迎宾馆的一个小房间里烟雾缭绕灯火通明，周恩来、博古、陈毅、李井泉等人坐成一圈。\n\n“各位同志也已经看见了，广西的桂系事变和北平的人民民主运动都遭到了血腥镇压，我们这时候如果再往东去，等于是撞人家枪口，每走一步都可能引起高宗武、伪满甚至日本的应激反应，到时候会与整个共荣圈兵戎相见。我们阵线才刚刚恢复元气，实在是没有能力同他们撕破脸皮。”周恩来率先打破沉默，“所以今天三更半夜我实在是放心不下，只好把负责外交的你们找来简单喝点茶谈谈。”\n\n陈毅抽口烟：“依我看，不如重建白区地下党，把这帮人的老底都渗透成筛子。”\n\n博古摇摇头：“不妥，47年为了确保敌后部队的顺利转移，我们不得不动用地下战线的同志们保驾护航，结果引来敌人的警觉，大规模暴露了线人网络。现在白区党的情况我们也并不是很清楚。”\n\n周恩来点点头：“白区地下党要恢复以前的活动规模确实有困难，但倒也是个不错的思路。”\n\n陈毅沉默良久，突然脑子里闪过一个念头：“我们还有华南局啊！听说叶老总他们在广东那边现在进展很不错……”\n\n所有人彼此对视一眼，思路瞬间清晰了许多，终于打开了话匣子开始规划下去……"
CPC_8th_congress.17.o: "天无绝人之路。"
CPC_8th_congress.18.t: "握手"
CPC_8th_congress.18.d: "雷鸣般的掌声和此起彼伏的“中国共产党万岁”的呼号在会场内久久回荡——中国共产党第八次全国代表大会胜利闭幕。\n\n毛泽东坐在主席位前看着代表依依不舍地离场，内心百感交集。\n\n“主席。”周恩来已经站到了他一侧，“散会了。”毛泽东却摆摆手：“你先去吧恩来，我坐一会。”\n\n不久后场内终于变得冷冷清清，只剩些须几个人还在整理文件。\n\n毛泽东长叹一口气，缓缓站了起来。\n\n“毛主席。”他的背后传来刘少奇的声音。毛泽东转回头去，赫然看见刘少奇满脸堆着笑意，微微前倾着身子。\n\n“会都散了，怎么还留在这里等我这个老同志呢？”毛泽东笑了，“我看我们两个还是要以团结求团结了……”\n\n刘少奇心知肚明，直接地伸出右手。\n\n毛泽东也伸手紧紧握住。"
CPC_8th_congress.18.o: "老骥伏枥，志在千里。"
CPC_8th_congress.19.t: "最后一问"
CPC_8th_congress.19.d: "“主席觉得我写的报告都是意气用事不肯信，你们是咱根据地的管账先生，把账目一条一条念给主席听，必须让他接受缩减预算的观点，不然要出大事!”\n\n面对周恩来的要求，李先念和李富春有些云里雾里。这两位刚刚巡视四川回来，下火车还没回家就被拉到总理面前。\n\n“总理，我们今晚还得给主席准备四川经济报告，时间可能有点紧……”\n\n“我就是要把两个报告合成一个办。”没容二人拒绝，周恩来斩钉截铁地要他们把四川情况单开一栏加进自己的报告里。\n\n当晚，二李带着新报告来向主席汇报。进入正式工作前，毛主席总得客套几句：“四川天府之国，一路巡视见了不少风光吧。”\n\n“呃，不是很好，主席。”只有李先念敢率先唱反调，“伪民国从十五年前起就一直在祸乱四川，在四川祸害不浅。现在春荒开始了，农民生活境况很差，要慢慢恢复。”\n\n“对，慢慢恢复。”李富春随即时和道。\n\n“城里的情况……”\n\n“好多商人资本家逃跑了，工商业总体有些拮据，正在尝试合营，不好直接干涉。”\n\n听到这些话，毛泽东点点头，好像明白了什么，抽了口手里的烟问道："
CPC_8th_congress.19.o: "“你们是从恩来那里过来的吧？”"
CPC_8th_congress.20.t: "开会当天"
CPC_8th_congress.20.d: "“马克思主义讲:不平衡是普遍的客观规律。从不平衡到平衡，又从平衡到不平衡，循环下已，永远如此，但是每一个循环都进到高的一级。不平衡，是经常的，绝对的；平衡是暂时的，相对的。自从安田危机爆发以后，全国革命形势发生逆转，这才有了我们南下战役的胜利。我们应该看到，成绩是主要的，困难是能够克服的。再苦再累，我们的人民都是坚挺不屈的！”\n\n“有些同志畏惧群众运动，一味求稳，好像只有他最理解根据地的困难，只有他最敢讲掏心窝的话。他们只看得见物，看不见人；只看到十根指头有一根不好，或许多一点，有三根，那剩下的七根好指头就可以视而不见了？根据地的情况决定了我们只知求稳那必然走向灭亡，只有不断发动群众掀起革命高潮才能有一线生机。我们的经验就是一条：不断革命！”\n\n“从四川回来的同志都向我们报告当地人民多么拥护欢迎我们，为什么就看不到人民群众无尽的热情呢？不仅看不到，还要给人民群众浇冷水，泄气，白白浪费党和人民的精力。”\n\n“这些人是不是觉得革命事业走得太快，就会栽跟头？他们不是要反冒进？好，那我就要反‘反冒进’，就是要和这股邪气斗争到底。”\n\n“马上又要开始整风与新的建设了，希望同志们卸掉历央包袱，准备迎接未来几年至关重要的工作。”\n\n(领头代表）“战无不胜的毛泽东思想万岁！”"
CPC_8th_congress.20.o: "（全场齐呼）“万岁！万岁！万岁！”"

 #故事事件
CPC_main_story_events.1.t: "黄沙（一）"
CPC_main_story_events.1.d: "黄沙翻滚，白日高照，风头如刀，一片苦寒。高岗身跨红鬃马，茕茕孑立于苍天之下，默默注视着远处忙忙碌碌收拾行李的士兵，仿若置身事外。离开毛主席已经一个月，久未打理的下巴钻出弯弯曲曲的胡须，更显得他粗陋无良，不知这代表着宣泄还是自毁以明志。\n\n警卫员王金鹏和李卫子手挽缰绳，牵着一辆水车悠悠并行，他们刚从河边取水归来。看到高岗落寞的身影，李卫子忍不住唉声叹气：“高主席以前雷厉风行的，现在怎么变成这样。看主席这个样子，我觉得憋得慌。”\n\n王金鹏当然知道原因是什么，只能低声提醒：“这话别当让首长听见。”\n\n二人停下交谈，走到高岗身后，李卫子先出马打了招呼：“主席，我们打水回来了。”\n\n“打了多少？”高岗的心情没有任何起伏，他只关心一个数字。\n\n“二百多斤。”\n\n高岗用鞭子虚指前方，让李卫子带水车归队，尔后叫住了他：“不要当面叫我主席，我已经不是了。”\n\n“是，高……高政委。”李卫子两腿夹紧马肚子，快步骑到列车末尾，将水车缆绳解下丢给士兵，大声吩咐着：“把水车系好，帐篷扎好，咱们收拾完就上路！”\n\n士兵们愈加忙碌起来，扛着大包小包往来穿梭，安顿好自己的位置。但是高岗的一片天空下寂寥依旧，只剩王金鹏静静伫立，警戒四周。猛然间，王金鹏望见东北方尘土飞扬，两匹快马直奔车队而来。透过望远镜他看清了远处的来人，不禁激动地叫喊：“是习书记！”"
CPC_main_story_events.1.o: "（下一页）"
CPC_main_story_events.2.t: "黄沙（二）"
CPC_main_story_events.2.d: "听到这个名称，高岗好像触电一样，激动和疑惑一齐涌上心头，他当即拨转马头迎面赶了上去，一片旷远天穹下，二人紧紧相拥在一起。高岗的问题像连珠炮一样吐出，他急切地想知道这位挚友下放后的境遇：“你的处分解除了？能自由活动了？谁帮你做的担保？”\n\n“是邓小平。”习仲勋平静地回答。\n\n高岗的表情一下就凝固住了，心中像打翻了调料罐，酸的、苦的、咸的一股脑喷涌而出，脸上的笑容慢慢褪去，先是百思不得其解，紧接着是愠怒，愠怒过后只剩下失落——只因为邓小平把手伸得太长。\n\n“也是他给我送信，说你出靖边往蒙古去，让我来送你，你看——”习仲勋一边解释，一边从马鞍袋上掏出两瓶酒，“这是咱们眉县酒厂酿的特曲，到那边你喝着它，可别忘了我们。”\n\n显然高岗还浸泡在忘我的沉思中，没有任何表示，直到习仲勋把酒塞进手里，他散乱的视线才逐渐凝聚：“你现在恢复工作了么？”\n\n“我现在就是眉县酒厂的厂长，日子过得比大跃进时候清闲。邓小平也和我谈过回中央的问题，他说毛主席现在处境不上不下，既得给过去受批判的同志平反，可又不能翻自己的案，很难办。”\n\n“都是我的错。”\n\n无意间的牢骚又让高岗陷入深深的自责，低下头久久一言不发，将手中酒瓶转个不停，一身的窘迫无处可藏。习仲勋当然明白高岗心里在想什么，安慰他不要辜负毛主席最后的信任，把精力都投入到蒙古革命中，只要干出成绩将功赎罪，什么坎都能迈过去。\n\n烈风抓起一把黄沙纷纷扬扬洒向远方的大地，冲散了二人各自的愁思。习仲勋再次张开他坚实的臂膀拥抱住高岗，充满期望地说出了自己的祝福："
CPC_main_story_events.2.o: "“只盼早早凯旋。”"
CPC_main_story_events.3.t: "星夜"
CPC_main_story_events.3.d: "男人找了条小板凳颓然坐在星月落照的院里，一旁摆着凉透了的饭菜，他却头也不偏，只静静看着惨白的地面一言不发。\n\n他点了一卷纸烟，任由愁云悲雾把自己失落的表情遮掩住——十四年来，几乎每个夜晚这个老人都要被不同的噩梦袭扰，在梦里他常常回到中条山溃败新闻登报的那天，常常回到蒋介石暴亡的那天，常常回到汪精卫满面春风庆祝改组国民政府成立的那天。每一个噩梦中他都会激动地撕碎报纸破口大骂，然后满身冷汗地惊醒在延安的窑洞，或是西安的矮屋里。\n\n68岁，对于一个志在涤荡神州大地百年沉疴的革命者而言，这是一个实在难以下咽的数字。他不清楚什么时候自己会猝然长逝，他甚至不敢想象他身故后的国防阵线究竟会走到怎样的路子上：刘少奇的人要独立自主，高岗被自己亲手流放，连邓小平也阴晴不定——自整风以来建立的革命队伍还未遭遇过如此重大的挫折。\n\n他心里空洞洞的，仿佛没了依靠，越没底的人就越容易攥紧自己手里的东西：阵线需要一个威望资历俱佳、能够为混沌的前景开辟出一条明路的领袖，他必须是那样的领袖，他不能害怕失败，他更不能畏惧错误。这位领袖必须果敢坚毅，必须能团结带领起根据地人民持续伟大的抗日斗争，必须坚信最终的胜利一定属于中国，必须……\n\n还能有多少个必须呢，仍在坚持抵抗的自由中国的伟大领袖毛泽东——他也终究只是个人，他会因为死亡的迫近而畏怖，会因过去的错误而懊悔，会因长久的失败而气馁，于是他每晚都会坐在那个小院里，抽一口烟叹一口气。\n\n懊悔和焦虑终归无用，两声鸡鸣打破了西安的沉寂，太阳还会从东方升起，然后又是崭新的一天……"
CPC_main_story_events.3.o: "太阳刺得有些眼疼。"
CPC_main_story_events.4.t: "明月"
CPC_main_story_events.4.d: "“主席还不吃啊，菜都凉了。”江青的秘书小隋在屋子里不住地发牢骚，“每天我都去打饭，打完了又不按时吃，凉了再热。”\n发完牢骚，小隋才突然意识到坐在自己面前的是江青，这位江主任眼里不揉沙子，肯定要批评自己一顿。可是，江青一反往日凌厉刻薄的态度跟她讲起了道理：“主席太累了，要放松自己。你要是饿了就先去吃，不用在这盯着了。”\n小隋的心一下子提到嗓子眼，她将信将疑拿起饭盒，却还不敢挪动半步，两眼目光定在江青笑意全无的面容上。等到江青摆摆手赶她走，才抱住饭盒一溜烟逃出了书房。\n\n小隋走后，江青反而坐立不安。一件大事正压在她的心头，不知该如何开场，只得走向书桌：“主席同志，菜要凉了，快过来吃吧。”\n毛泽东慢慢放下架子，丢下漫天星夜，顺着江青的招呼走进书房，十分自觉地坐在饭碗前，支起筷子夹了一口黄瓜搁到嘴里。江青立在门边默默忍耐着偶像的冷漠，小隋的牢骚一遍又一遍回荡，终于她的耐性见底了，下定决心吐露心声：“你一句话也不和我讲，可我心里全明白。”\n\n毛泽东并未回话，只是像老牛反刍一样细嚼慢咽，把咀嚼菜糜当作消磨苦闷的烈酒。\n\n“刘少奇快把根据地倒过来了，你一点表示也没有。”\n\n毛泽东咽下这口饭，只觉得诧异，这是他第一次听到江青对中央评头论足：“你想干什么？”\n\n“这两个礼拜你一直捂耳朵图清闲，一点都不管外边发生什么事。我就找康老和周恩来问情况，才知道你也学林彪不去开会了。”\n“我跟你结婚二十多年了吧，我一直按着你的要求不插手政治工作；但实话讲，就会堂里坐着的那些人，谁能比我还知道怎么配合你？谁能有我可靠？”\n江青说着说着就从门口走到书桌前坐下，不无体贴地给主席同志夹了口菜，随后讲出了自己的请求：“我只是想让你身边多个帮手，我实在是怕你撑不下去就这样撒手。你不替我想想，也替你女儿想想。”\n\n毛泽东的大脑高速运转着，他竟然一时半会找不到自己的立场。夫人参政实在是个诱人的决定，在拒绝的选项前他犹豫了，饭桌前的江青也越来越像耀眼的明月那样晶莹剔透。思考五分钟后，毛泽东松口了：“先从小事干起吧。”"
CPC_main_story_events.4.o: "月光怎么也开始刺眼了。"
CPC_main_story_events.5.t: "钟摆"
CPC_main_story_events.5.d: "刘少奇召集了中央工作会议，但是并没有邀请江青，而她现在就坐在会议室外。不过江青并非是为开会而来，她有一个给自己女儿谋好出路的计划：李讷的大学生涯就要结束了，马上该找工作实习，而工作单位需要介绍信才面试。江青虽然贵为毛泽东的妻子，可她不能给自己女儿写推荐信，更不能让毛泽东来写。因此她希望得到刘少奇的帮助，以获得这封命运之信——在此之前她找过马叙伦，但那个老头完全不答应。\n\n会议室内讲话声不停，墙壁上悬挂的时钟也滴答不停。时针从10走到11，盯着钟摆左右摇晃了一个小时把江青看头晕了。时间不断流走的感觉让她有些急躁，但她必须仍然虔诚地等待会议结束。\n\n“你想罢我官就直说，急扯白脸干什么？我乐意挨你骂？我还不干了呢！”\n\n话音未落，会议室门“砰“的一声被顶开，就像打雷一样。陇东区副书记曾希圣跌跌撞撞走出门，冲着对面白粉墙就大喊一声“憋死我了”。\n\n江青完全不关心这番滑稽的场景，在11点报时钟声的搅伴下，曾希圣旁若无人似的跑出了走廊。上半天的会议结束了，来西安开会的地委同志们大多在原地休息，有的三三两两去厕所。中央领导则要到隔壁开临时会，商议下半场计划。刘少奇和薄一波一前一后退场出来，一点高兴的意思也没有。江青从椅子上站起来拍拍裤脚，给自己鼓了鼓劲，迈出脚步找了上去：“少奇同志，我有事想跟你说。我们家李讷不是要大学毕业了嘛，我想让她到中央医院去实习，所以想请你帮李讷写一封推荐信。”\n\n突然出现的江青打断了刘少奇开会的思绪，一下就愣住了。不过迟疑很快消散，他在脑子里转了一个弯，毫不犹豫地拒绝写信：“这事你找周恩来，我这里忙，你不是经常找他么。”\n“这样啊……”\n“他在后头呢。”刘少奇撂下这句话就丢下江青一溜烟走远了。薄一波没有任何表示，只是略微欠了欠身子，而后紧跟上去。"
CPC_main_story_events.5.o: "钟摆并不怜悯，带着时间不断流走。"
CPC_main_story_events.6.t: "珊瑚"
CPC_main_story_events.6.d: "十几年前，叶剑英接受南下任务，与韦国清、萧向荣、卢绍武三位同志组成特委，秘密前往广西统战军阀。遭到夏威断然拒绝后，叶剑英当机给周恩来发电：脱离国民党军阀，就地发展独立的抗日武装。在周恩来的情报保护下，叶剑英等人已经成为隐蔽战线的一份子，西北的人们只知道在中国极南滨海之地，还有共产党的同志，他们的名字会时不时出现在内部刊物上。\n\n“一树红花照碧海，一团火焰出水来，珊瑚树红春常在，风波浪里把花开…”\n\n合唱团排练演唱《珊瑚颂》，悠扬的歌声将周恩来连日的疲劳稍稍舒缓。时值国防阵线周年大庆，远在天南的叶剑英托地下党同志给西安送来一份珍稀的礼物：一株枝繁叶茂的红珊瑚。\n西北已经很久没有收获过希望了，而这株远道而来的珊瑚，通体散发出革命的红色，代表远方同志的热情问候，这简直成了阵线美好未来的启示。在党中央看来，必须为了重振士气而宣传一番。于是，他不顾身体不适，亲自组织美术学院的学生为珊瑚制作了一个放大复制品，等到庆典那天，把它安放在花车上，与西安市民同享这份喜悦。\n\n“云来遮雾来盖，云里雾里放光彩，风吹来浪打来，风吹浪打花常开……”\n\n这句歌词在周恩来看来，的确恰如其分。广东的党组织正如一棵珊瑚，形似树枝，开枝散叶，骨质却坚硬异常。革命群众的光彩，决计不是日伪的云雾压制得住的。他们毫无怨言地全身心投入民族解放事业，坚决完成党中央交给他们的各项工作，甚至甘愿顶上“珠人”的名号，在敌人心脏立足，打入敌伪机关。这棵鲜红鲜红的珊瑚花，必然有在阳光下开放的一天。\n\n踏着歌声，邓小平走进排练厅视察工作。周恩来招呼他坐在自己身边，一起看合唱团表演。邓小平注意到总理的心情好像不错，这真是一则久违的消息，于是他决定陪周恩来看完整场彩排再去干下一项工作。\n\n听着听着歌曲，邓小平忍不住发表起自己的评论：“这首歌太像主席的一首诗了。”\n“哪首？”\n“咏梅。”\n“都是借物喻人。”\n\n“借物喻人……借物喻人……”邓小平反而心事重重陷入沉默，甚至没注意到表演结束，周围的掌声久久不停息。"
CPC_main_story_events.6.o: "最坏的时候终归要过去。"
CPC_main_story_events.7.t: "筹码"
CPC_main_story_events.7.d: "会客室里五个人围坐在一起，他们是根据地五大区的首脑：宁夏区副书记林枫，陕北区书记张秀山，陕南区副书记周林，关中区书记谭政，陇东区副书记高健君。这五个人应召集而来，等待中央领导接见。毛泽东没有在他们的预想中露面，等了好久才见到面沉似水的刘少奇副主席。只见他把一摞档案袋重重砸在茶几上，狠狠瞪着屋子里的五人。薄一波紧随而至，进门就用手指着五人中的一位命令道：“周林，站起来。”\n\n听到传唤，周林浑身打一冷战，颤颤巍巍从沙发上起立，不敢正眼看刘少奇。这时，刘少奇和薄一波开始了他们的配合——“毛主席看了你陕南的年终总结，你知道主席说了什么吗？”\n“主席说：‘你们新四军怎么净出这种……’我就不多说了。”\n“你听听，主席连我也骂进来了！我可是给新四军做过总政啊！”\n“看看你干出的好成绩，仔细看看，饥荒死人除了陇东就是陕南，真是紧追不舍。”\n“新四军出来的干部，向来无法无天，抗战时候我就领教过。远的项英不说，昨天曾希圣当着这么多中央领导的面大嚷大叫就是见证。”“你们就是这样对付中央的吗？”\n“张德生说了你一句不是，你就联合同伙夺他的权，愣是活活给这位正书记气死了，你们是真干得出来啊。”\n“彭真也死在你们任上。地方干部——个个都该砍头。”\n\n话说到这，刘少奇拆开陕南区的档案袋，将里面的文件拽出来一把甩到周林身上，等待着对方回应。\n\n就目前而言，大跃进造成的所有崩溃报告都在刘少奇掌握之中，而这些黑材料如同筹码一般，正帮助他在地方上攻城拔寨。在刘薄二人的一唱一和之下，周林完全成了待宰的羔羊，乖乖站在原地涕泗横流。被文件砸到的那一刻，他的血压高到极点，几乎当场昏厥。\n\n可能这就是“反者道之动”的魅力吧，不光彩的政治运动反而成了刘少奇政治生涯中的垫脚石。手中的筹码个个呼之欲出，但这就不知要赔上其他人多少眼泪了。"
CPC_main_story_events.7.o: "中央不相信眼泪。"
CPC_main_story_events.8.t: "归乡之路 - [GetYear]年，西安301医院"
CPC_main_story_events.8.d: "同往常一样，杨盈彩走出医生住宅楼，准备前往外科住院部开始一天的工作。\n\n清晨的阳光穿过解放军总医院的梧桐林落在地上，打出变幻柔和的树影，清晨的凉风拂面吹来，路上多了些边赶路边叽叽喳喳互相逗闷子的年轻护士，女孩们的笑声伴着麻雀婉转的鸣叫随着凉风驱散了杨盈彩残留的睡意。\n\n昨天的组会上副院长说今天要来一个新护士，她心里不由得好奇起来——这得是何方神圣，一个新来的护士犯得着副院长亲自提醒吗？\n\n带着疑惑她大步走进了住院楼，撇眼就看见护士站人头攒动熙熙攘攘，但杨盈彩没怎么搭理，径直走上四楼自己的办公室，她从绿衬白墙搭配着灰色的水泥地构成的空间中穿行而过——这样的半冷色调令她很快冷静下来进入工作状态。\n\n“杨医生。”迎面而来的副院长叫住了她，“现在有空吗？”\n“您说，我还有半小时才查房。”\n“住院部新来那个护士——你知道来历吧？”副院长把头凑过来，显得神秘兮兮。但杨盈彩却一脸茫然摇摇头：“我还纳闷呢啥护士能让您昨天组会上特意提醒……”\n不等她说完，副院长打断了杨盈彩的话：“那是……毛主席的闺女，刚从护理学校毕业，听说还要考外科医助想找老师带呢，你要不跟我下楼看看？”话虽这么说，副院长却已经迈开了脚步，徒留杨盈彩一个人呆立阶上，大脑转了好久才消化完刚刚听到的重磅消息。"
CPC_main_story_events.8.o: "“啊？”"
CPC_Yang_Yingcai_history_tips_1: "“§G她与她们§!的未来§Y正在揭幕§!。”"
CPC_main_story_events.9.t: "冷风"
CPC_main_story_events.9.d: "阳光明媚的清晨，冷风吹散了人的睡意。汉中火车站的一节车厢里，两张方桌拼成一张会议桌，盖着一块清洗得刷白的桌布，上面有十五套泡好秦岭春茶的青色茶缸子突突冒出水汽，三个白瓷烟灰缸按照对称位置依次排开——只有靠近主座的缸子里有烟灰和四五支烟头。与其他席位不同的主座面前还摆着一包已经抽掉半包的宝鸡卷烟厂纸烟。毛泽东正在这里会见陕西省各个官员，这次他要越过中央直接向地方传达自己的指示，两排脑袋齐刷刷地看向毛泽东沟壑纵横的脸。\n\n“中央的会上我已经讲过几次，今天呢我必须再和你们吹吹风。”毛泽东看着正襟危坐的众人，又点着了一根烟，“不要搞修正主义，要搞马克思列宁主义。全国人民还等着我们去解放呢，要是我们自己先变了质，哪还有解放的希望？”\n\n众人点点头，深以为然。\n\n “现在根据地又要渡难关了，青海那边的困难不需要各位操心，可是生产建设不能不靠你们出力。还是那句话，一定要团结，不要分裂。今天的话就讲到这里，你们下车，不用送。”毛泽东吸了口烟，指了指车厢里的警卫员，“这里有他收拾东西，你们也不用派人跟着我了。”\n\n众人纷纷道一声“主席再见”，鱼贯退出了车厢，人声也慢慢散去，四周归于宁静，只有汽笛“呜呜”低鸣。毛泽东盯着那些纹丝未动的茶水，和一尘不染的烟灰缸，碾灭了烟头，无可奈何地自言自语：“都盼着我早走呢。”"
CPC_main_story_events.9.o1: "再抽一支吧。"
CPC_main_story_events.10.t: "运筹"
CPC_main_story_events.10.d: "倒杯茶，点根烟，男人坐在办公桌前开始仔细审阅今天的日常事务。\n\n每当翻阅根据地的经济报表，刘少奇都会格外专注。过去十五年间，他长期承担组织与经济方面的具体工作，在曲折中调整政策，在困难中推动恢复，使许多基层单位逐步走上正轨。那些看似细碎的改进与整顿，往往关系着根据地的生计与秩序，他深知其中分量。\n\n十五年如一日，他在政治与组织工作上一丝不苟。随着职责不断加重，他逐渐成为党内重要的负责同志之一。许多干部在提及中央领导时，也会同时想到他与毛主席的分工与配合——\n\n——刘少奇，中国共产党的重要领导人之一。相较于毛泽东善于把握全局与战略方向，他更多承担具体部署与落实工作。在根据地需要巩固成果、应对内外复杂形势的关键阶段，这种分工显得尤为必要。\n\n对于外界的评价，刘少奇并不多作表态。他清楚，个人得失从来不是衡量工作的标准，真正重要的是党和国家能否在风浪中站稳脚跟。\n\n他依旧按部就班地处理手头事务。制度建设、经济调整、干部管理，每一项都需要耐心与细致。只要组织需要，他便承担相应的责任，把工作一件件落实下去。\n\n想到这里，他合上文件，又翻到最后一页，在一份经济议案上郑重地签下自己的名字。"
CPC_main_story_events.10.o1: "£Liu_Shaoqi_sign"
CPC_main_story_events.11.t: "热炭"
CPC_main_story_events.11.d: "会堂里洒满灰黢黢的阳光，墙角的火盆嗞啦啦烧着木炭，窗户为了通风常年不关，寒气推搡热浪裹住身体，让人时而舒适，时而寒战。一名身穿黑色棉袍，头戴瓜皮帽的老头坐在主席台正当中，揣着手，缩着脖，低着头，好让自己更暖和些——当然他也不想面对在他眼里无理取闹的审查人员。主席台下每个人都拿着一支笔，几张草稿，唰唰记录着审查过程。老人与主席台间隔两米远，更显得他一人在台上孤独渺小，无依无靠。短暂的沉默对峙后，坐在正中央的审查员发话了：“梁漱溟，你认识到错误没有？”\n老人正眼也没看他，别过脸一言不发。现在的他，满脑子都是下乡做田野时的经历，不忍直视的真相就像一团无名火淤积在心中难以发泄。\n\n阳光明媚的早晨，得知梁漱溟即将到公社调查，县里连书记带委员齐聚大盘公社村口列队欢迎，横幅满天飞，彩旗随风飘，就连村口大树上都蹲着眼线监视来人的一举一动。一行农调人员到地就被安排到地主大院里就餐休息，每顿饭吃的都是小米饭，炒黄菜，外加一个煮鸡蛋，好像村子里从来不缺粮食。想找人了解情况得经过书记精心挑选，问话的时候旁边还得蹲个“县代表”。找来谈话的农民满脸堆笑，口齿伶俐，嘴里说出的话完美中带着一丝违和，可碍于“代表”的面子又不好盘问，只能讲些稀里糊涂的淡话，这哪是做田野的样子？\n就在某一天，梁漱溟假借上厕所偷跑了出去，一口气奔黄土沟沟里猛走了五六里，直到老胳膊老腿支撑不住，瘫坐在路边。一边捶着灌了铅似的小腿肚子，一边看到穿着旧棉袄、白头巾的一对青年男女和他们挑在扁担里的一对小孩低头赶路。梁漱溟赶紧假装问路，叫住他们：“你们这是往哪里去啊？”\n小伙子看见老人，也寻思着休息一会，就和媳妇放下担子，自己席地而坐与梁漱溟攀谈起来：“老伯，我们是走亲戚去的。今年收成不好，没打下多少麦子，公家又收走一大堆。家里就有点揭不开锅了，想把两个娃放到我老娘家养些日子。”梁漱溟还想问收走了多少粮食，但对面那婆娘警觉得很，掐了一把自己的汉子让他少说话，就不好意思继续张口。\n\n火盆里的热炭劈里啪啦作响，把梁漱溟惊扰回现实，而审查人员已经被沉默顶撞得不耐烦了：“你不要有抵触情绪，老实交代。你为什么擅自挪用研究拨款？”\n梁漱溟终于开口：“我觉得钱花光了，买的粮食能一两不剩全发完，就已经够下结论了。”\n““所以你就否定大跃进，否定三面红旗，否定农业集体化？”\n“我只是否定错误的东西。”\n“你…你这老头怎么不开窍呢？看来你的右派帽子还得接着戴。”"
CPC_main_story_events.11.o1: "孟子曰：威武不能屈。"
CPC_main_story_events.12.t: "好逑"
CPC_main_story_events.12.d: "顾颉刚戴着满头白发躺在杨木摇椅上一晃一晃，手边离不开一根拐杖。茶几后的沙发坐着许烺光，他点着油灯发出暗黄的光热，照亮房宇，照见客人的脸。屋门方向站着精明丰满的矮个子，腰杆笔直，面带微笑。\n许烺光认出是邓小平，赶忙请他坐下：“邓先生突然下榻敝舍，不知有何见教？”“毛主席托我来看看二位。”邓小平让警卫员把礼品放上茶几，自己挪走黄豆油灯以防灯火烧到精心编好的红丝带，“一点好茶，一点好烟，不成敬意。”\n\n许烺光起身扶住小平推来的礼物——包裹不大，里边有硬面饼一样的触感，还有一个方盒子从线织缝隙中渗出烤烟的浓郁香气——他一下就认出这位大领导送来什么重礼：普洱团茶和云叶。\n顾颉刚看见蓝布包裹摆上桌面，清了清嗓子，说：“邓先生，您尽管放心，只要中央有用得到我们的地方，我们一定全力以赴。”\n许烺光则话锋一转：“可您要是不说清楚有什么任务，无功不受禄，这么贵重的礼物我们不能收。”说完，他又把礼物推了回去。\n“二位在民主人士中间不是一般人，尤其顾颉刚老先生德高望重，好多事情经您一讲就显得有分量。现在党中央遇到了困难，想请二位在大会上能够支持党中央。”邓小平掏出几张米色横格纸，上面写满密密的楷体字，“该说的话都在这上边，希望许先生，顾先生能体谅中央的难处。”\n顾、许二人面面对视，各自了然，郑重答应了邓小平的请求，但他们固辞不收送来的礼物。许烺光双手拿起包裹就要塞回小警卫员的怀里，警卫员躲得远远的不敢接，还是邓小平强按了下来，看着二人接受的神情才匆匆告辞。\n\n拎着分量颇足的包裹，许烺光没有急着拆开，原封不动得放进里屋储物间，这里面还存放着许许多多的“慰问品”：桌椅箱柜，木雕玉坠，矿泉甘醴，核桃杏仁——这次，又多了茶叶和旱烟。\n许烺光走出屋门，既觉得滑稽，又有点苦恼：“唉，每次都是这样，说了不听，听了不说。要是脑袋没发热，何至于让马家军当了借口……”\n“说那么多干什么，该做什么事就做什么事。”顾颉刚往上拉了拉毯子盖住寒腿，“明天的发言就你去吧，我走不动了。”\n\n屋内安静了下来，只有顾颉刚身下的老摇椅还在嘎吱吱，嘎吱吱地响。"
CPC_main_story_events.12.o1: "受人一饭，听人使唤。"
CPC_main_story_events.13.t: "新疆来信"
CPC_main_story_events.13.d: "陕西诸公钧鉴：自仲英学成归疆，只因日夜缠于盛府杂事，未得脱身，遂难得进谒毛、周诸公，共商革命大计。更兼民国二十四年折戟星星峡，皆因我之过，仲英甚惭之。\n\n幸北疆革命，痛击盛贼，迫其龟缩迪化不敢出，仲英乘隙鱼归大海，星夜驰往南疆，聚敛旧部，伺机反攻。仲英不才，新近率兵痛击东突匪帮，光复喀什，怎奈南疆苦瘠，兵士新募不堪用，难以更进一步，伏望延安诸公予以救济。仲英定感恩戴德，不负昔日诺言，亲提一旅而安新疆。\n\n草率至此，祈恕不恭，言不尽思，再祈珍重。\n此致\n敬礼\n马氏仲英\n民国五十一年正月二十五"
CPC_main_story_events.13.o1: "要发个嘉奖电去，赞扬马将军的义举。"
CPC_main_story_events.14.t: "远来的人"
CPC_main_story_events.14.d: "天水市政府大楼闯进一位不速之客——身着青色短衣汗水浸透，腰上紧紧扎着板带，脸蛋被暴晒得黑红透亮，神色紧促略有焦躁，旁人看来只觉得他是个推大车的搬运工。\n\n不料此人找到接待员称自己是西康省的信使，说完就急切地要和我方高层会面。等到工作人员到场进行甄别工作，这信使掏出西南国防阵线的证件，但对工作人员的盘问总是一套说辞，除了求援之外什么也不肯说，并且在随后的搜身过程中极其抗拒，即使被搜检到也不肯交出身上的信件，声称这信见到周恩来才能拆封。\n\n天水市书记已将所有情况提交中央，西康信使暂时留在当地听后回音。"
CPC_main_story_events.14.o1: "他们怎么来了？"
CPC_main_story_events.15.t: "信函"
CPC_main_story_events.15.d: "尊敬的毛主席：\n\n藏地脱离中央政权的时间已久，人心向背不服统治，因此康藏边境屡有事端。去年达赖喇嘛丝毫不隐藏自己称霸西陲的野心，动用武力偷袭了我们。\n\n我并非是没有胆量的人，肯洒热血与之一战，奈何我的军队太过孱弱，补给弹药都难以供应，很快便丢失了一大块土地。\n\n当时我知道陕西的处境还十分困难，所以试着联络成都向黄隐求援，可却是石沉大海，什么回信也没有。我不知道这群将他人生死置之度外的鬼心里盘算什么，或是忙着向高宗武进贡，到南京官场去钻营也未可知。但是我没想到，他们竟然出兵侵略了西康。我是在不忍心看着西康死在我自己手里，这种感觉痛如刀割，万望毛主席可以略施援手，救西康一救。\n\n西康省政府主席 刘文辉"
CPC_main_story_events.15.o1: "怎么办？救不救？"
CPC_main_story_events.16.t: "观影体验"
CPC_main_story_events.16.d: "安塞窑厂的上空刮着冬日的凛冽寒风，吹散了烟囱冒出的蒸汽，吹散了漫天群星。与平时不同，新年的厂房依旧人头攒动，温暖非常，一百多名烧窑工人齐刷刷坐在大银幕前，观看政治宣传片。\n\n不出所料底，影片中又现出那个熟悉的面孔——已牺牲十八年的张思德同志，一番标准流利的播音腔随着画面陡然升起：“我们来自五湖四海，为着一个共同的革命目标走到一起。今天，伟大、光荣、正确的中国共产党领导着地跨西北、两千九百万人口的根据地，但是这还不够，我们要和全国人民走上这条社会主义的康庄大道，争取全民族的解放！”\n\n慷慨激昂的画面前，台下观众却显得有些木然，没有什么精神上的起伏。有的三三两两交头接耳，有的只顾着跟旁边的哥们儿要茶水喝，随着影片声音越来越大，场下说话声也逐渐提高，甚至出现“嘿嘿”的笑声。“焦大海，好好看新闻，别说小话。”人群外，突然响起厂长厚重粗野的嗓音，嘁嘁喳喳的悄悄话才渐渐安静。\n\n影片长度40分钟，晚上九点结束。当谢幕画面亮起时，一盏大灯瞬间照亮整栋厂房，晃得人睁不开眼，只能坐在原地。但这时工人们还不能走，因为他们还要倾听厂长发表最后的总结讲话，而厂长已经拿起稿子，站上讲台了。"
CPC_main_story_events.16.o1: "“先把你们的哈欠收收，我说几句咱们就散场。”"
CPC_main_story_events.17.t: "高墙之内"
CPC_main_story_events.17.d: "昏暗幽长的走廊发出牢门沉甸甸的响声。“马继援，出来！”带枪的守卫冲牢房里面叫道。\n\n话音落下，一个疲惫不堪的身影伴着哗楞哗楞的脚镣缓缓走出，虽然穿着一身干净的囚服，脸上身上也被狱卒洗刷干净，但遮不住被铁圈磨破殷殷渗血的脚脖手腕。今天，这位曾经的马家军首领就要上刑场了，还差最后一道手续，由于犯人身份特殊且系重犯，需要地方长官验明正身，方可执行。\n\n马继援被一路带到等候室，带到长官的面前。看着衣冠楚楚的解放军军官，他冷冷地说：“审也审过，何必再验，赶快行刑。”对面的长官没有理他，而是扶住眼镜，两眼对准桌上的档案从上到下依次扫过，再抬头审视一番面如冰霜的马继援，长长叹了一口气：“马将军，你本来国仇家恨系于一身，而我们共产党与你无怨无仇，为什么不能共同抗日呢？”\n\n“你们共匪消灭我们的信仰，我岂能坐视不管。”\n\n“我有十足的理由向你解释以上误会，但我事先讲明白中央的意思。”说罢，长官将一纸文书推到桌前，上面赫然盖着红戳，“我们依然诚心希望与马将军共释前嫌，只要你能在这份《悔过书》上签个字，我们保证恢复你从前所有的名誉，再让你当个将军也是可以的。”\n\n一支水笔递到马继援面前，长官的眼中闪出一股殷切：“签吧。”马继援没理会那支笔，集中目光死死盯着“悔过书“三个大字，周遭光景俱已模糊，只有这三个字深深刺进他的大脑，使他恨不得从眼中喷出火来。\n\n长官旁边的秘书见马继援发呆，从座位上站起来帮腔道：“马将军，你不要犹豫，这是中央又给你一次改过自新的机会。”\n\n在真主看来，没有共产党和日本人的中国才能得救，而自己所做的一切都上合天意，下应民心。马继援压根没想过和解，更没想过什么“认罪”，他昂起头颅，心甘情愿为拯救中国的圣战捐躯。此情此景，长官只得叹一口气，摆摆手示意将马继援推出去。牢房中陷入久久的沉寂，时间慢慢流逝，等待令人煎熬。\n\n一声枪响，划破天际。"
CPC_main_story_events.17.o1: "解决掉一个麻烦。"
CPC_main_story_events.18.t: "河湟战役"
CPC_main_story_events.18.d: "“同志们，接下来轮我们上前线了！”王连长声音很低，话说得很平常，却像吸铁石一样把战士们的情绪、眼光和注意力一下子都紧紧地吸住了。\n\n他把四张麻纸的大地图往墙上一挂，指着上面的红点道：“马继援要他的队伍向北进攻，计划让他的那些马家亲戚配合向南攻，把我们消灭在这陇西地区。瞧，这盘算打得多带劲呀！上面的战术指示是(一)青马匪军在全国也是有数的顽敌，我们对他须有足够的估计，任何侥幸心理都是错误的。(二)力求集中兵力、火力、技术于一点，每个山头、每个阵地，逐次地歼灭敌人。不攻则已，攻则必效。(三)进攻中，须充分准备歼灭敌人反冲锋部队，组织歼灭敌反冲锋的火力，构筑抗击反冲锋的工事。(四)集中优势的炮火射击一点，得手后，再击另一点。密切步炮协同。(五)对敌人外壕陡壁的克服，须用挖对沟，改造地形来接近，用炸药来破坏。同志们，咱们大家先合计一番，看下次战役怎么打。”\n\n一排排长首先发言：“西宁的部队死挤成一团，我们目下还啃不动。现在先收拾祁连、海晏这些狗杂种，把敌人引出来，教敌人‘合围’不成，也能缓解东线同志的压力。” 周指导员也说：“对呀。敌人想让他们的几股子部队分头猛进，在这里围歼我们。可是我们不等他动，就先打他个头昏眼花。这样：第一，打碎了敌人的‘合围’计划；第二；不等敌人拧到一块，我们就把他零敲碎打了。” \n\n一个班长说：“打这儿向南，要走三四百里，还得过沙漠呀！这也得估划估划。”\n\n马排长说：“不要说翻大山钻梢林过沙漠，党中央让我们到天边上去帮助劳动人民翻身，我们也不怕；要怕，还叫什么共产党员！”山洞里挺闷气，大伙你一言我一语嘟嘟哝哝地在议论。这工夫，副连长王彪悄悄地蹲在墙角，思量什么。像是，他最大的心愿就是希望人家不注意他。\n\n“老虎，说话呀！三个人里头有诸葛亮，大伙多讨论就把这理弄明白了。”\n\n王彪站起来，微微一笑，说：“同志们！上级决定要进行河湟战役。我们从陇北分区进军去打马家匪徒。因为，敌人怕我们从陇东地区插出去，戳到他们后方去。所以，我们一动，马继援一定跟上我们转……那么，我们用零敲碎打的办法，把马继援的帮凶一个一个地敲掉，那马继援就孤立了，就好打了。”"
CPC_main_story_events.18.o1: "射人先射马，擒贼先擒王。"
CPC_main_story_events.19.t: "为何而战（1）"
CPC_main_story_events.19.d: "西伯利亚的寒流，伴随着北风的怒吼声，穿过鄂尔多斯草原，到达西北的崇山峻岭，黄土高原又恢复了它本来的面目——荒凉、冷清，掩饰不住的空旷与贫瘠。纪登奎端着一碗野菜粥，站在一家农户小院的门前，心里如同打翻了五味瓶：天气变冷，战士没衣穿，没米下锅，部队里俘虏兵占到一半以上，违反“三大纪律八项注意”的事不时发生，叹气哀嚎充斥军营…他呆呆地端详着远处光秃秃的山峦，仿佛想要忘记一切。\n\n一个多小时过去了，碗里的野菜粥冻成了冰坨子。他的脑海里浮现出了去年冬月攻打民和未能成功的情景。这对他来说，是藏在心里一直难于解开的一个巨大的疙瘩，因为轻敌冒进被马匪军埋伏，损失100多人，认定自己犯了一个大错误——急攻难下啊！尤其是战士们饿着肚子打仗的情景，仿佛在他的脑海里扎下了根，久久不肯散去。正如他曾经给上面的电报里所说的，有的部队五天没吃一顿饱饭，只好杀吃骡马，冬腊月有的战士还穿着单衣，冻得受不了，只好脱掉死人身上的衣服穿在自己身上……\n\n最让他着急的是底下不断地向他汇报部队里出现的不良情况。从马匪军叛乱开始起，几个月的作战，各个部队几乎没有扩充地方上的兵员，补充的都是俘虏。有的部队俘虏补充兵员比例占到八成，最少的也在四成以上。由于俘虏的大量补充，部队的素质和阶级觉悟等问题让他寝食难安。“乌合之众”这个词突然在他的脑子里冒出，这支部队一半以上是国民党的俘虏兵，怎会不出问题呢？如果有一个国民党军官隐藏在内，只要串通俘虏，会不会搞“兵变”？\n\n仗，显然暂时不能再打了，得进行长时间的整军，提高军队的素质和觉悟。纪登奎撂下冻成了冰坨子的饭碗，心事重重地找到李团长问：“你有没有什么好办法教育新编入的战士？”“有！”李团长响亮地回答：“我们七七二团就有一些成功的经验。”“快说！快说！”他迫不及待地催促道。"
CPC_main_story_events.19.o1: "李团长滔滔不绝地讲起了二营的事。"
CPC_main_story_events.20.t: "为何而战（2）"
CPC_main_story_events.20.d: "“在打下循化后，这个营补充了一批被‘解放’了的战士。一开始，这些被‘解放’的士兵狂妄得很，被我们俘虏内心很不服气，说我军打仗不正规，偷偷摸摸地干，还说要是摆开战场，说不定谁是俘虏呢！他们很不和气，大吵大闹，甚至动手打架。\n\n营教导员夏伟很关心被‘解放’的战士，经常问寒问暖，行军中让老兵给被‘解放’的战士背东西，一个被‘解放’的战士大受感动，说他们在家受地主阿訇的欺负，在国民党队伍里受长官的打骂，挨过拳头，也挨过鞭子。没想到共产党队伍里的长官这么好。虽然缺衣少吃，但心里舒坦。\n营长王克青从中受到启发，立即在全营搞了一次诉苦活动，让大家把心里的苦、家里的苦、在国民党队伍里的苦说出来。一诉苦才知道，几乎所有战士都出身贫寒，在家里受尽了地主老财的欺负折磨。被‘解放’的战士大部分都是被国民党强行按壮丁抓来的，都挨过国民党军官的耳光和皮鞭。而在我们这里，不仅没挨过打，还经常受干部的照顾。这样一对比、一诉苦，效果就出来了。被‘解放’战士们的积极性调动起来了，和子弟兵关系也好了。后来，二营的经验在全团推开，效果非常好。在后来的历次战斗中，七七二团都冲锋在前，屡立战功。”\n\n听完这些真实的例子，纪登奎精神为之一振，阴霾一扫而空，不由得拍手称赞："
CPC_main_story_events.20.o1: "“这个好，要马上推广开。”"
CPC_main_story_events.21.t: "中央军委关于部队换装与整训的指示"
CPC_main_story_events.21.d: "林粟许，并告西北局，前委：\n\n青海作战，据初步反映与检讨，装备已严重拖累战斗。经中央军委开会研究，决定对各部队更换装备和进行休整。\n\n（一）周密计划，分三个梯队有次序地返回后方，提高警惕，爱护有生力量，安全顺利地将整个部队带回解放区；\n（二）各级党委和领导，在返回解放区过程中，要精心组织好部队的战备行军，严守秘密，避免非战斗减员；\n（三）认真做好向党和人民汇报的准备工作，对部队青海作战的战绩和英雄模范人物的事迹，立即着手总结；\n（四）全面总结部队在作战方面、政治工作方面和后勤保障方面的经验和教训；\n（五）精确统计人员、马匹、火炮的减员和损伤情况；\n（六）妥善安排伤病员回后方治疗问题，对已牺牲的烈士选好墓地，立碑安葬，并将烈士遗物带回，很好保管；\n（七）认真检查群众纪律，借物归还，损失赔偿；\n（八）回解放区之前一定要为回族人民办件实实在在的好事；\n（九）返回途中要严格遵守纪律\n\n中央\n子宥"
CPC_main_story_events.21.o1: "准备启程。"
CPC_main_story_events.22.t: "旧友重逢"
CPC_main_story_events.22.d: "“友诚，原来你也在阿克苏！”刚刚到达红旗坡农场的刘文亮惊喜地看着老友任友诚，欣喜之情溢于言表，“四清开始之后，你就离开了西安，也只听说你去新疆参加插队去了。”\n任友诚咧嘴一笑，搂住刘文亮的脖子自嘲道：“我一个黑五类子女，不离开西安就等着被整啦！而且刚到阿克苏的时候，我们队刚好学着甘肃的那个……对，白银经验！个个过关，把我批斗一番后，我就被安排去树林里放羊去了，说是工作，其实就是流放，不过我天生自由，在树林里朗读，或者用梳子吹口琴，好不自在！”\n刘文亮一听，略带伤感，思绪一下子回到了四清刚开始的西安。开始的时候，确实抓了不少贪官污吏。可随着运动的深入，因言、因处分、乃至一些无足轻重的问题，都成为获罪的可能……\n\n“走，我带你去看看农场！”任友诚打断了刘文亮的思绪，带着刘文亮走进农场，“半年前，我回到插队时，农场便和我刚到时有了不少区别。北边的胡杨林被开垦成小麦田，南边的草原也建成了牧场。”进一步向里走，刘文亮看见了一个个半掩在地下的小土屋，“这里就是我们睡觉的地方，都是大通铺。一半在地上，一半在地下，冬暖夏凉，还防风。刚建设的时候，有个大队书记不信邪，不听当地维族的意见，非要建一个完全在地上的土屋，结果不到三个月，屋子就被风吹倒了，人都给直接埋了！”任友诚半是哀悼，半是戏谑，颇有“丧事喜办”的味道。“不过你这时候过来，也不至于太苦。农场三个月前收到两辆旧拖拉机，但农场的保养水平也只够上上油的，鬼知道还能用多久，不过可比以前轻松多了，以前有马的时候还好说，没马的时候就难过咯。“\n刘文亮问道：“对了友诚，你现在在干什么？也是去种地吗？”任友诚听到这个问题，一边拉着刘文亮的手，一边向一处平房走去，说到：“前段时间我确实也是在种地，但后来书记找到我，说我是西安的中学生，希望我去帮农场研究研究如何接电线电灯，然后在农场的小厂房，就是前面那个小平房，安排了一个工位。”任友诚带刘文亮进入平房，看见了还没缠完铜丝的变压器。刘文亮问道，单独缠变压器挺累吧？任友诚表示肯定，然后指着角落的那个废旧缝纫机：“我想把那个缝纫机改造缠线器，感兴趣不？”刘文亮咧嘴一笑，言语不如行动，二人就如何改造缝纫机开始研究起来，一边研究，一遍聊天。\n\n或许是因为见到老友，任友诚越讲越兴奋，刘文亮则颇为感慨。可此时，平房外传来不少嘈杂，刘文亮问道：“外边是怎么回事？” “批斗，最近在搞什么四清总结会，说是总结，其实就是再把一些人拉出来批斗一顿。之前四清最激烈的时候，有人被绑在树上差点给渴死。”任友诚不愿在往下说下去，因为他知道，自己一个黑五类子弟之所以没被批斗，只是因为被事实上流放，运气好，表现好没被逮着而已。\n刘文亮沉默片刻，讲道："
CPC_main_story_events.22.o: "总结完，事儿也就了了。"
CPC_main_story_events.23.t: "时代的一粒尘埃"
CPC_main_story_events.23.d: "严格来说，林峰没有工厂的正式编制工作，但他依然知道不少电器维修技巧，也就靠着这门手艺在城里东奔西走维生。他热爱生活，平日里跟街坊邻里关系不错，还总帮人修理电器。可几天前，他被指控参与一起抢劫案，但他对此一无所知。“林峰，你不要再装了！”审讯员冷冷地盯着他，一件件证据摆在桌上，“几名证人都说看到你在收音机厂的现场。你老实交代，不要想着蒙混过关！”\n\n林峰十分错愕，急忙摇头：“冤枉啊，同志！我那天去的是人家家属区给他们修风扇，根本没去过别的地方！”但审讯员显然不信，冷笑一声：“你以为装老实就能逃脱制裁？现在是严打，从重从快！坦白从宽抗拒从严，赶紧的。”林峰感到前所未有的恐惧，平日里温暖的家逐渐在脑海里模糊，眼前的四壁犹如冰冷的囚笼。审讯进行了一轮又一轮，林峰的头脑逐渐混沌，甚至开始怀疑自己，事情怎么会这样？一旦被定罪，污名将伴随他的一生。\n\n三天后，他被正式拘押，关进了西安市看守所。看守所里，他认识了几个同样被指控的人。小李便是其中之一，他是一个街头摊贩，因一位证人的“指认”而被抓进来。小李跟林峰一样，百口莫辩，一提起自己的冤屈便失声痛哭。他告诉林峰，听说这里的人很少有能够自证清白的，“从重从快”成了他们的梦魇，谁也不知道命运如何。一周后，林峰的母亲终于得以探视他，她面容憔悴，眼睛因哭泣而肿胀。“儿啊，我相信你没有做那些事！我真是急得几夜没睡啊！”母亲布满皱纹的手紧紧握着他，眼中满是绝望。“妈，我是无辜的！”林峰咬紧牙关，哽咽着说，“但只怕……没人会相信。”母亲擦了擦眼泪，勉强笑了笑：“别怕，孩子，我想办法。”\n\n接下来几日，林母四处奔走，找到林峰的同事和街坊邻居，试图为儿子证明清白。然而，很多人怕受牵连，纷纷避而不谈。即便有几个人肯出面作证，也遭到了冷遇，甚至被告知“不要多管闲事”。一个月后，林峰的案子终于进入了审判程序。法庭上，控方出具了几份证词，但内容模糊，甚至连案发的具体时间都描述不清。林峰一遍遍申诉自己当时的行踪，但法官却充耳不闻。最终，林峰判刑五年，罪名成立。林峰被送往监狱服刑。\n\n每天清晨，他望着监室外一小片灰暗的天空，心中充满了无尽的悲哀。往日的生活仿佛成为了一个遥不可及的梦境，母亲的探视成了他仅存的安慰。每次见面，母亲都会用颤抖的手紧握住他的手，不断告诉他坚持下去，等待清白的一天。"
CPC_main_story_events.23.o: "对个人而言，这是一座大山。"
CPC_main_story_events.24.t: "铁拳怎么砸我头上了"
CPC_main_story_events.24.d: "机械厂的工人俱乐部为工人们争取的加班费终于发下来了。工人们手捧着加班费，脸上露出难得的笑容。多亏了党员兼俱乐部长的老钟，虽然他平日里不爱说话，但工友们的事，他总是放在心上，竭尽全力。\n\n过去几个月，厂里任务繁重，工人们不得不日夜赶工，但厂方迟迟不发加班费。工人满腹怨气，几次对质领导都被一时搪塞。老钟听说后，便找领导协商谈判，他的态度温和而坚定，说道：“同志们辛辛苦苦加班，厂里也该给个交代，不然他们心里怎么能踏实工作？”厂领导固然知道老钟德高望重，但还是敷衍道：“老钟啊，最近厂里资金紧张，你还是让大家体谅体谅吧。”\n老钟知道领导又在故技重施，便化作一头倔驴，连着几天锲而不舍地与领导拉扯，几轮争执后，厂里终于发放了加班费。工人们感激地围着老钟，老钟摆摆手笑着说：“不算啥，俱乐部就是干这个的。”\n\n但几周之后，风云突变。\n某天早上，工厂的公告栏张贴着一则通知：机械厂工人俱乐部刮起一股“经济主义黑风”，片面追求经济利益，无视社会主义大局，即刻取缔。落款处地方党委的公章格外醒目，厂里的老工人看到这则通知，满腔怒火。俱乐部为工人们争取拖欠工资，是再正常不过的事，怎么成了“黑风”？他找到老钟，发现不少工人也在，有人愤怒，有人抱怨，现场沉闷得像是压了块巨石。“老钟，党委凭什么说是‘经济黑风’？”一个年轻工人满脸愤慨，“就因为给大家争取了点加班费？！”老钟默默点了支烟，望着窗外，低沉地说：“上头觉得我们只关注眼前的利益，要是其他工厂争相效仿，定会影响劳动生产。”他看了看大家，眼中满是不舍，“厂里的事，以后只能靠你们自己了，我大概率是要调离岗位了。”\n\n几天后，俱乐部正式解散。那天，厂区里飘着沉沉的冷雾，工人们自发地等待在老钟家门口，看着他收拾最后的行李。老钟站在大家面前，声音有些哽咽：“工友们，俱乐部没了，但咱们的情义还在，彼此照顾，心连着心，这厂子以后还是咱们的家！”工人们纷纷点头，但仍然情绪低落，看着老钟逐渐远去的背影，思考着工人阶级领导的社会主义为什么还要打压工人，或许若干年后，这个问题才能揭晓答案，亦或者永远不能。"
CPC_main_story_events.24.o: "雷霆雨露，俱是天恩。"
CPC_main_story_events.25.t: "车间工作日记"
CPC_main_story_events.25.d: "[GetYear]年某月某日：\n三车间班会上对新技术有反馈，效果不错。成品率比之前要高20%，但是原料消耗更多了。\n技术学校送了批新生实习，三人调钳工班，六人调金工班，优秀生两人调检查组学习。\n一，二，六车间劳动热情高，指标能完成，批复意见是暂时不拉高指标，易打击积极性，\n五车间陈工要求落实劳保补贴，批复是预支工资，优先落户。\n\n[GetYear]年某月某日：\n临时在后天举办职工大会，要准备会场、讲词、条幅。鼓励工人拥护新政策，完成新任务。行政岗要调整，扩大生产厂区。\n对实习生进行谈话教育，既要学习理论，也学习实际知识。顺便带他们熟悉厂子。\n今夜班发现一小偷，让保卫科移交公安。\n\n[GetYear]年某月某日：\n组织干部开学习会研讨会，书记提前发了党报学习研讨，现摘抄下一段:\n“以粮为本，以铁为纲。工农并举，继续前进。”\n之后讨论各办公室出几人到西安学习，还未定下。突然检查组来说学生王新和老工李平打架，王新言辞激烈被打，遣送回校后联系医院治疗。李平作检讨。\n夜班点洋灯继续学习材料，顺便敲定车间指标分配。"
CPC_main_story_events.25.o: "劳动创造世界。"
CPC_main_story_events.26.t: "《长庆精神长庆人》（节选）"
CPC_main_story_events.26.d: "许多工人说，他们过去没有赶上吃草根、啃树皮的长征，也没有经受过抗日战争的考验，今天，到长庆参加油田建设，为实现解放全国的远大理想吃一点苦，是他们的光荣！深刻懂得发扬艰苦奋斗、自力更生这个革命传统的伟大意义，心甘情愿地吃大苦，耐大劳，临危不惧，必要时甚至不惜牺牲个人的一切，而把这些看做是光荣，是幸福！这，不正是长庆人最鲜明的性格特征吗？\n\n有着二十多年工龄的老石油工人王进喜，长庆油田上有名的“铁人”，就是长庆人这种性格的代表人物。当年，这里有多少生活上的困难在等待着他们啊！但是，四十来岁的王进喜在一九六〇年三月奉调前往长庆油田时，他一不买穿的用的，二不买吃的喝的，把被褥衣物都交给火车托运，只把一套《毛泽东选集》带在身边。 到了长庆，他一不问住哪里，二不问吃什么，头一句就问在哪里打井？接着，他马上就去查看工地，侦察线路。钻机运到了，起重设备还没有运到。怎么办？他同工人们一起，人拉肩扛，把六十多吨重的全套钻井设备，一件件从火车上卸下来。他们的手上、肩上，磨起了血泡，没有人叫过一声苦。开钻了，一台钻机每天最少要用四五十吨水，彼时的自来水管还没有安装好。等吗？不。王进喜又带领全体职工，到三里多路以外的小湖里取水，保证钻井，如此艰苦地打下了第一口井。\n\n沉默的大地，复杂的地层，对于钻井工人来说，就好像难于驯服的怪物。王进喜领导的井队在打第三口井的时候，出现了一次井喷事故的迹象。倘若发生井喷，就有可能把几十米高的井架通通吞进地层。当时，王进喜的一条腿受了伤，可还拄着双拐，在工地上指挥生产。在那紧急关头，他一面命令工人增加泥浆浓度和比重，采取各种措施压制井喷，一面毫不迟疑地抛掉双拐，扑通一声跳进泥浆池，拼命地用手和脚搅动，调匀泥浆。两个多小时的紧张搏斗过去了，井喷事故避免了，但王进喜和另外两个跳进泥浆池的工人，皮肤上都被碱性很大的泥浆烧起了水泡。油田的干部前来慰问，他却拍着胸脯说：“宁可少活二十年，拼命也要拿下大油田！”\n\n那时候，王进喜住在工地附近一户老乡家里。房东老大娘提着一筐鸡蛋，到工地慰问钻井工人。她一眼看到王进喜，三脚两步跑上去，激动地说：“进喜啊进喜，你可真是个‘铁人’！”\n\n像王“铁人”这样的英雄人物，在长庆油田岂止一人！\n\n——解放日报 刊"
CPC_main_story_events.26.o: "劳动人民最光荣！"
CPC_main_story_events.27.t: "友谊常在"
CPC_main_story_events.27.d: "“你这身衣服还是太旧了，到华西将军那里能不能凭你这口俄语让他手下的军需官给你发个大衣？”国防阵线代表团的马队从草地上缓缓显出模样，他们正为了西北的命运在蒙古的土地上前行。高岗坐在马上凝望着远方，放下望远镜后调侃着身边号称“俄国通”的林虎，因为他看见了来迎接他们的人革委部队。\n林虎拿起装满烈酒的行军壶：“想要进毛子的仓库拿东西，还得看他们愿不愿意给。不从，要么把他们打晕，要么灌到他们愿意给。”\n“我看他们不一定有你能喝。”高岗话毕，草原上回荡着两人的笑声。\n\n蒙古战事已毕，人革委的蒙古官兵也便回归祖国，华西列夫斯基自知西蒙不是长居之所，也只好起身准备北上，继续为俄罗斯的命运而战——不过，毕竟都是共产党，华西本人并不介意在临行前为中蒙的共产党同志们留下些小礼物，这场宴席便是为此而设。\n\n高岗抿了一口粗茶，苦涩在口中爆开，恰似阵线和苏军如今的处境。就在这苦涩当中，他想起进入营地时瞥见的那一箱箱军火。\n羊肉的鲜嫩并不如那些武备更吸引两人，林虎正用俄语和华西列夫交流，并为他倒了杯酒。高岗开始琢磨起自己接下来要从哪方谈起：军阀横行的俄罗斯？共同的敌人日本帝国主义？外蒙古刀兵停息后要进行的重建？\n\n对面的蒙古翻译用简单的汉语表达了华西的态度，他指着空着的酒杯说：“蒙古暂时没有危险，我们留在这里只会消磨意志。但准备重建苏联是更困难的一件事，甚至没有粮食能拿来酿酒。”\n高岗立刻听出了将军的言外之意，立刻接过话茬：“你们可以用哪些武器换粮食？”\n“步兵装备，野战炮，还有能够打穿日本坦克的反坦克筒，看你们能提供多少粮食。”\n\n数日后，一辆以华西列夫斯基个人名义赠送的汽车行驶在回西安的土路上，使团的核心几人坐在车上，身躯也像骑马到蒙古时一样颠簸摇晃。\n蒙古的晚夜深空同西北一样深邃，高岗和林虎清楚今晚注定难以入睡，不过二人都很开心，也都很久没有如此放松了，高岗脑内仍萦绕着临别前华西的话：“我离开家乡好多年了，也不知道有生之年能否再看一眼莫斯科，希望我们都能平安地回家……”\n\n夜幕中，只剩发动机的轰鸣与探照灯的光亮，不断劈开漫长道路上深远的黑暗。"
CPC_main_story_events.27.o: "归家之路是如此遥远。"
CPC_main_story_events.28.t: "育苗"
CPC_main_story_events.28.d: "春日的阳光温柔地洒在广袤无垠的河套平原上，这里是刘丰的梦想之地。他，一个怀揣着对土地无限热爱的青年农科生，日复一日地在这片肥沃的土地上耕耘，只因心中藏着一个培育良种、改变家乡命运的梦想。\n\n数年的灾荒，迫使他改变了继续读书的念头，与农科院同学一起毅然投身参与河套平原的良种培育工作，开始了新的征程。他们大量翻阅各类农业书籍，找寻先进的育种技术；他们走访老农，虚心请教，收集每一个可能有助于改良种子的线索；他们埋头于干燥的盐碱地，思考着如何建立灌排系统将地下盐分导出，重塑农田的土壤结构。\n\n夜幕低垂，星辰点点，刘丰躺在简陋的木屋中，心中却翻涌着不安。连日的干旱像一块巨石压在他的胸口，让他难以入眠。梦中，他仿佛置身于一片荒芜之中，烈日炙烤着大地，庄稼枯萎，河流干涸，田地颗粒无收，孩子吸吮着碗底稀少的米水…那是他最不愿面对的场景——旱灾，饥荒，死亡。\n\n当第一缕晨光穿透窗帘，刘丰猛然惊醒，发现自己竟不在那闷热的小屋，而是置身于水坝边的一个简易棚子里。四周是忙碌的身影，社员们正合力加固水坝，为即将到来的灌溉季节做准备。清晨的露珠在草尖上闪烁，仿佛是大自然最温柔的抚慰，让他的心渐渐平静下来。\n\n梦虽残酷，却也是前行的动力。他站起身，望向远方那片他深爱的土地，心中涌动着前所未有的决心。他知道，要想在这片土地上培育出抗旱耐涝的良种，不仅需要汗水的浇灌，更需要智慧和坚持。后来，在无数个日夜的辛勤努力，与众多群众同志的帮助下，农科院的河套实验小组终于培育出了几种能够在干旱条件下依然茁壮成长的作物新品种。\n\n平原上一片生机勃勃的景象，许多年轻的黝黑脸庞上带着对丰收的祈盼。青春在汗水中闪耀，他们的故事，像一首浪漫的田园诗，正在河套平原上传唱。"
CPC_main_story_events.28.o: "不朽篇章正在缓缓展开……"
CPC_main_story_events.29.t: "十年不晚？"
CPC_main_story_events.29.d: "李福和于正带着一队骑警在蒙古的草原上疾驰，他们刚刚得知了一个伪蒙官员的藏身窝点：这是草原上的一个并不起眼的寻常毡包，警察们已经提前下马暗中包围了这里。\n\n于正掀开门帘举枪突入，果不其然，一个老头正颓然坐在椅子上，瞪大了布满血丝的眼睛，宛如一条皮包骨老狗。他不紧不慢地抬头，盯着眼前一汉一蒙两族警察。\n\n“我们是中蒙两国联合执法队伍，这是我们的逮捕令……别动！”李福刚要掏出出逮捕令，就看见那老头掏枪的动作。\n\n“我可知道你们这些共匪，蒙疆吃了败仗以后你们就像夺命恶鬼一样缠着我们不放！”老头颤颤巍巍地抬起枪口，“你们哪怕是在这就地毙了我我也不会让你们审的！”\n\n“毙了你？我们可不是旧警察。”于正着重强调了“旧警察”三个字，“你的罪行白纸黑字，字字如真，还要给你念一遍吗！”\n\n“够了！”老头猛地起身，但十几把长短枪也立刻瞄准了他，“我没杀过人，我从没亲手杀过人，我我我，我只是……”他的声音里带着一丝颤抖。\n\n于正不再废话，把逮捕令交给李福，自己拿出腰间的手铐：“现在你只有认罪伏法，不要抵抗，到法庭自有公论，好好悔过争取人民对你宽大处理！”\n\n“我没杀过人我没杀过人我没杀过人我才不上你那个法庭……”老头仍然只是举着枪颤抖着重复这句话。\n\n“放下枪！”于正的声音骤然严厉，然而这似乎刺激到了老头衰弱的神经，他圆睁双目，大叫着“我没杀过人”把枪口塞进了嘴，扣动了扳机。\n\n留下十几个警察在原地呆若木鸡。\n\n很快有个年纪稍轻的小警察抬着枪又朝着地上的尸体连开数枪，刚准备出门的李福惊得回头望去，赶紧让几个上年纪的老公安把他拉开，地上的尸体已经流出一汪血洼。"
CPC_main_story_events.29.o: "逮捕失败，犯人又自杀了。"
CPC_main_story_events.30.t: "罪有应得：一"
CPC_main_story_events.30.d: "“真他妈晦气，跟你们这帮死有余辜的混在一块。”老赵坐在坑边抽旱烟边瞧着坑里骂，对组织上的安排颇为不满。\n\n旗里武装队请他协助工作，看到报酬不错，老赵没多想就应下了，但此刻他只后悔当初为啥不多跟旗里讨价还价，多赚几匹好马。\n\n武装队最近人手紧，找他是为了看守死刑犯的埋尸坑，老赵已经推脱不掉。白天坐在草地上抽烟膈应，偶尔看见两个解放军拖着尸首抛进坑里，到夜里就在地上点个火堆，铺开毛皮简单睡了。\n\n今天距离老赵回家的最后期限还剩两天，心里忍不住高兴，托媳妇捎来二斤酒全都喝了，倦意比以往来得更早，太阳刚落山老赵便躺在被窝里呼呼大睡起来。等老赵酒醒，拍了拍脑袋坐起来一看，身边的火堆早就灭了，斗大的月亮正居高天，已是三更半夜。\n\n忽然，老赵听到一阵急促的马蹄声，一队黑影飞也似的朝自己奔来。\n\n老赵吓得冒出浑身冷汗，他不知道来人是谁，如果是解放军夜查一般都会打火把，可这些人直眉瞪眼就往他这闯。自己身边也没趁手武器——就算有肯定也不是来人的对手。老赵爬起来就跑，退到十几米外的小土包后面趴在那里仔细观察、那队黑影来到坑前站住，几个人倏地跳下坑中，摸摸索索找什么，随后拖上来一具尸体。\n\n老赵屏住呼吸，一动不敢动，继续看着那些人。\n\n其中一个黑影“唰”地抽出一把寒光熠熠的砍刀，直接劈了下去。这一刀下去，人群躁动了起来，纷纷举起自己手里的“武器”，有大锤，有马鞭，有木棒，有柴刀，不要命似地砸开了。一阵肉撕骨裂的响动后，黑影才渐渐退去。"
CPC_main_story_events.30.o: "他们要干什么？"
CPC_main_story_events.31.t: "招工会"
CPC_main_story_events.31.d: "遣返在蒙日人本是既定政策，不过组织上要求对其中的技术人员多加关注，滕海清很是明白临行前康生叮嘱自己的这番话。\n\n遣返过程中滞留的一百来号日本人都是滕海清特意向内蒙叮嘱筛选的，是“可以在阵线留用的技术人才”，需要“好好做做思想工作”。\n\n于是这次招工会就这么顺理成章地召开了，滕海清身旁站着日语翻译，他也不掩饰，开诚布公地把自己的意图讲明：“各位先生女士不要着急，我们在筛查的时候发现你们都有非常专业的技术背景，党中央高度重视你们能够发挥的作用，因而把你们召集到这里来开一次座谈会。”\n\n“这次座谈会的目的也很明确，就是想挽留各位先生女士为我们阵线建设添砖加瓦，待遇自然是不会亏待你们的，我们阵线的抗日方针绝非什么民族复仇主义，而是团结一切可以团结的力量……”\n\n这次招工会颇费了滕海清一番口舌，直讲到太阳西斜，他终于看见了底下几个日本人的眼神里有动摇的神色。\n\n他拿出了手中的招工证：“这是我们阵线制作的招工证，凭此证各位可以留在阵线并享受党中央每月特别的照顾，尽管我阵线现在力有不逮，但我们保证各位在阵线绝对比在蒙疆活得要更像一个人！”\n\n很快台下有人举起了手表示要进一步了解阵线的人才政策。\n\n滕海清的脸上显出一丝得意。"
CPC_main_story_events.31.o: "大概这就是有钱能使鬼推磨？"
CPC_main_story_events.32.t: "遣返证"
CPC_main_story_events.32.d: "张怀德对自己新领的工作极其不满：甄别滞留在呼和浩特的日本人并发放遣返证。\n\n“打死我也想不通，凭什么侵略完咱中国，领个轻飘飘的遣返证就又能坐上特地给小鬼子准备的卡车火车被礼送出境？照我说就该统统抓起来枪毙了，反正他们也这么对付我们的！”他在警局休息室里边抽烟高声臭骂，仿佛就是要把这股怨气喷到警局外，一直喷到西安，喷到党中央毛主席那里。\n\n应该说这样的臭骂多少有点作用，虽然不至于真让毛主席听到，但这么一闹腾，隔着两堵墙的局长办公室总还是听得见的——更何况今天有个中央来的大官恰巧就在呼市总局指导工作。\n\n……\n\n“你手里夹那根破烟赶快给老子掐了！”局长并未坐在位子上，而是陪在纪登奎身边，脸活像涨紫的猪肝，而他们的对面，则是早已两腿暗暗发抖的张怀德。\n“诶，没必要这么恶劣嘛，站咱们对面的又不是阶级敌人地主土豪。”纪登奎笑着摆摆手，“人家小同志不理解为啥发遣返证，你这个局长还不知道吗，平时的政治教育都怎么做的？基层党员为什么没有领会中央的精神？这些个事后面呼市常委会上我还得讲呢。”\n\n顿了一顿，纪登奎又把目光转向面前的张怀德：“刚刚我的第一句话是啥，你还记得吗？”\n“报告首……首长，你说站在你们对面的又不是阶级敌人地主土豪。”\n“那你觉得你的工作对象，那些需要遣返的日本老百姓，他们是阶级敌人地主土豪吗？”一句话把张怀德问懵了，他戳在原地支支吾吾不知如何作答。\n\n“特委交给公安系统的任务是甄别滞留内蒙的日本人确保不放过战犯，之后才是遣返。如果抓到个日本人不查清楚就要给人脑袋上来一枪，那咱们的革命队伍和日本鬼子又有啥区别？”纪登奎微笑道，“要知道，日本老百姓也在过苦日子，打仗那时候一个农民一年就要给政府交一吨大米还要更多，怎么免这个负担？只有家里出男丁参军打仗，他们就是这么压榨穷苦老百姓然后来侵略咱们的。咱革命队伍要替穷人出头，要解放全中国，就要查清楚在呼和浩特这些日本人哪些是骑在老百姓头上作威作福，哪些是无可奈何被迫来到这里的。”\n\n一番话说得张怀德脸越来越红，他立刻立正敬了个礼："
CPC_main_story_events.32.o: "“首长同志教育的是！”"
CPC_main_story_events.33.t: "罪有应得：二"
CPC_main_story_events.33.d: "这群黑影随着渐远的马蹄声离开了。老赵按捺不住好奇心，端着猎枪摸到先前人群聚集处。\n\n饶是老赵生平宰杀过牛羊无算，面对被月光照得灰亮斑驳的这摊血肉，他也很难保持镇定，他摸出一根旱烟点上，定了定心神，只当自己是在杀羊现场。\n\n从屠宰的角度来看这群人的手法只能说是稚嫩，骨头几乎尽数折开，半截肝脏被散乱的小肠缠住，割开的大肠里甚至还有临终饭的残留，一整张脸也早已面目全非，牙齿散落满地，鼻子被割去，眼球半吊在外面，脑浆随月光照耀而发出点点荧光……\n\n老赵知道这事可能得请武装队大队长来一趟，只好趁黑上马，朝着旗里的“蒙古汉奸特别审判办公室”奔去。\n\n清晨，大队长带着一队人马随着老赵赶到了埋尸坑，似乎在老赵走后又来了两拨人，现在坑旁地上平铺着三滩已经辨认不出谁是谁的血肉。\n\n“老赵，你今天就可以休息了。”大队长沉默良久，“你是新近才从别处搬来的牧民吧。”\n\n“是啊，咋了？”老赵满腹狐疑。\n\n“这里这三个人都是本地的恶霸，蒙疆统治咱们旗的时候有不少人被弄得家破人亡，妻离子散，他们认为一枪毙掉这些恶霸太便宜他们了。”\n\n“然后给人拖出来鞭尸啦？”\n\n“嗯。”大队长若有所思，“这就叫罪有应得啊。”"
CPC_main_story_events.33.o: "人民自有评判。"
CPC_main_story_events.34.t: "皆大欢喜"
CPC_main_story_events.34.d: "“来来来，喝，多喝一杯。”\n\n满都拉图不停地劝，博古就一杯一杯地喝，喝得眼镜腿都歪了半边，这位蒙古代表自己也鲸吞豪饮起来。今晚大家都格外的高兴，笼罩在他们心头的阴云早已消散。接下来要做的就是享受和平，这也是他们所渴望的。\n\n“博古同志，今天，今天一定得多喝点，今天可是个好日子，好日子！”\n\n满都拉图大着舌头说，一边大力地拍着博古的肩膀，博古和这个草原上的魁梧男人一比，似乎更是入地三分了。\n\n“好日子！”\n\n博古兴高采烈地举起酒杯，高呼一声，会场里人头攒动，听了博古的话，也都一起举杯呼应，他很明显是喝多了，面颊酡红，醉意熏熏。\n\n“今天，这么好的日子…嗝…这么好的日子。”\n\n他的声音由大转小，最后近乎耳语般地喃喃自语着，似乎在思考着什么，努力的从混乱的大脑中揪出一根贯穿始终的线。突然，他来了主意，唱一首歌是最好的。\n\n“同志们，我们…嗝…我们来唱歌吧！”\n\n所有的眼睛都望向他，这可真是个好主意，不过唱什么歌好呢？\n\n“唱，唱点什么呢？”\n\n博古茫然的看了看周围，他虽一时间没有想法，但感觉体内的血液正在加速流动，这使得他不可遏制地认为自己正在返老还童，无数个念头涌上他的嘴边，他张开了嘴……"
CPC_main_story_events.34.o: "“草原啊草原……”"
CPC_main_story_events.35.t: "蒙古风情"
CPC_main_story_events.35.d: "太阳慢慢坠下地平线的时候，女人仍佝偻着腰背着哭个不停的孩子烧火做饭，等着男人回来。陕北高原的热风和锅中飘出的热气使女人汗如雨下。女人不停用披在肩上的毛巾擦着永远擦不完的汗，擦着自己不断燥热的心情。\n\n“莫哭了！”女人的呵斥反使孩子哭得更响。小家伙还不到会用语言的年龄，只能用最原始的方法表达自己的不满。“我回来咯！”男人的四川口音在陕西极具辨识度。女人像抓住了救命稻草，快步走出厨房迎接男人，不过更像是为了赶紧把孩子交给他。\n\n“哎哟，娃儿咋哭了。莫哭莫哭，老汉给你好吃嘞。”男人一只手将孩子托在怀里，一只手从怀里摸出一颗奶糖，塞进了孩子的嘴里。不知是感觉到了甜味，还是感觉到了父爱，孩子慢慢止住了哭声，有了些许笑颜。\n\n“娃儿他妈，你也来一个。”男人将另一颗糖塞进了女人嘴里。女人嚼了几下，燥热的心情仿佛去了大半。“娃儿他爹，这是哪来的糖啊，没吃过这么甜的。”\n\n“没吃过吧，这是今早镇上新来嘞货……”"
CPC_main_story_events.35.o: "“……蒙古来的。”"
CPC_main_story_events.36.t: "惊诧之余"
CPC_main_story_events.36.d: "顺着蒙疆战俘的指认，章苓带着一组人奔到呼市市郊一座看起来不大不小的仓库门前。\n\n一阵沉闷而短促的爆炸声后，仓库大门被炸开，浓重的机油味立刻令在场众人不禁皱眉，章苓招招手示意队员们打开手电筒走进仓库分头探索。\n\n“队长！”很快就有队员招呼章苓，他顺着声音来向走到了一处工作台前，队员的手电筒将工作台上的文件照得惨白发亮——上面层层叠叠堆着将近十张图纸，尽管对军械制造一窍不通，但章苓也很快认出这些都是枪械图纸，左上角还浅浅地印着“豊和重工”四个日式汉字，看来这堆图纸便是出自臭名昭著的共荣圈军工企业丰和重工，这一企业长期为日本的仆从国生产自动火器，并从中赚取丰厚的利润——显然，蒙疆大约也被榨走了不少库银。\n\n不知是谁拨动了这间仓库的总阀门，很快电灯令这座仓库敞亮起来，这时章苓才看清楚仓库内弥漫的浓重机油味的来源——赫然是一条枪械生产线！"
CPC_main_story_events.36.o: "快通知旗里！"
CPC_main_story_events.37.t: "品茗"
CPC_main_story_events.37.d: "即便天气尚寒，西北的太阳依旧刺眼，雷任民坐在院子里，百无聊赖地煮着茶叶，眯着眼睛望向空中——几年前，因为反对大跃进，他在党内被批为“右倾投降主义”，继而被贬谪到印刷厂，当一名普通干部。今天是雷任民难得的休息日，他在院子里煮着茶叶，感受着沸腾茶水的阵阵清香。\n\n“好香的茶水哦！”门口传来了一句四川话，同时传来的还有一阵敲门声。雷任民抬头看向门口，来者是邓小平。雷任民从墙角拿来一个矮凳，招呼邓小平去喝杯茶，“邓小平同志？进来请坐，喝杯茶。”雷任民语气略带疑惑，思考着中央书记处主任为什么要来拜访一个谪官，他拿出搪瓷杯，将其满上茶水，递给邓小平。邓小平也不客气，接过茶水，闻了闻，笑道：“好茶叶啊，比我老家的松针茶还香。”雷任民试探道：“这是毛尖，山西的茶叶，离开山西前买了不少，你要是喜欢，我送点给你。请问邓小平同志，你这次特地来，应该不只是为了喝茶吧？”\n\n邓小平抿了一口茶说：“没错，党中央托我来问你，是否愿意去新组建的外贸部工作，去当外贸部的负责人。现在新疆、蒙古的贸易逐渐恢复，俄罗斯的一些军阀也愿意和我们做生意，统筹根据地的外贸工作刻不容缓。党中央也在寻找能够胜任这个工作的人，你以前管理根据地内的贸易工作出色，所以党中央想让你去外交部工作，你意向如何？”雷任民同样喝了一口茶，问道：“那我以前犯的错误…？”“你不要担心这个问题。”邓小平见雷任民瞻前顾后，打断了他的担忧，“现在根据地需要团结一致向前看，恢复建设，恢复生产，恢复贸易。专业的人做专业的事。”邓小平从随身的公文包里拿出一叠文件递给雷任民，是各根据地之间以及根据地同哈萨克、俄罗斯军阀的一些贸易记录，他紧接着说：“这些贸易记录里面，农产、机械还有军火，各种轻重工业商品纷繁复杂，需要一个部门专门负责统筹以及谈判工作，中央认为你有能力处理好这些问题。”\n\n雷任民也不再迟疑，站起来对邓小平说道：“邓小平同志，请您转告毛主席，我保证完成任务！”"
CPC_main_story_events.37.o: "十八年后，又是一条好汉。"
CPC_main_story_events.38.t: "一通电话"
CPC_main_story_events.38.d: "万毅坐在天水的办公室里，看着中央的要求，头皮发麻。中央要求天水在两年内，在原有军工产业的基础上，围绕着接收工厂转移、扩充军械生产、形成完整产业、研发新式武器四个方面，在两年内将天水建设成国防阵线的总军械所。万毅揉了揉干涩不已的眼睛，心里直犯嘀咕：大跃进的教训殷鉴不远，中央这是干什么？！\n\n“叮零零零零…”一阵急促的铃声响起，万毅接过电话，电话的那头是陈毅。“万毅同志啊，我是陈毅哎”陈毅的声音让万毅如沐春风，在这个所有人都悲观急躁的年代，陈毅的幽默宽和总是能让各部委的干部感到些许安慰。万毅紧皱眉头稍稍舒展，笑着对电话另一头的陈毅问：“哦，陈老总啊！什么事还特意打个电话啊？”陈毅也没客套，回复道：“最近中央不是说要把所有的军工全部搬到天水嘛，我是来和你说，中央将全力支持你的工作，这个工作将是未来全阵线军工建设的核心。不要怕难，有什么需要，随时给中央打电报。啊，我一会儿还要开会，先挂了哈。”言毕，陈毅挂断了电话，万毅叹了口气：“这回终于消停了些。”万毅望向窗外，不远处的铁路上，远处的蒸汽越来越近，是运送着工业机械的火车，万毅对秘书说：“走，我们去火车站。”\n\n万毅和秘书来到火车站，没有横幅，也没有欢迎会——只有等待着搬运施工的工人们。“呲——”火车释放出多余的蒸汽，停了下来，万毅礼节性的和车长握握手，然后转向在场的工人喊话：“同志们，工友们！中央要求我们，让天水接收来自根据地各地的军工厂，以此统一生产计划。我们要打起十二分精神，不仅要将接收到的厂子快速投入生产，更要在此基础上扩建乃至研发新武器。同志们，工友们！中央支持我们，将天水建设成为全阵线的大兵工厂，让全阵线的解放军战士用上我们天水生产的步枪，大炮。我们要打起十二分的精神，让战士们有足够的武器解放全国，让‘天水造’的威名响遍亚洲！党中央和全阵线人民将为我们提供一切可能的帮助，我们也要将一个大兵工厂的天水交付给党中央和全阵线人民，同志们，好不好？”，“好！——”站台上的工人欢呼起来，他们即兴奋于为全阵线提供武器，成为解放全国的重要力量，也高兴于中央的全力支持，而非‘自力更生，自行解决’。\n\n万毅之后又说了些工作上的安排，最后，他清了清已经干燥的嗓子，右手冲拳向天，高声呼喊道：“毛主席万岁！中国革命万岁！”工人们也纷纷冲拳，高呼："
CPC_main_story_events.38.o: "“毛主席万岁！中国革命万岁！”"

#马虎山危机调查事件
CPC_main_story_events.39.t: "背后异动"
CPC_main_story_events.39.d: "“先取新疆，缓图中原”是马仲英临行苏联前对姐夫马虎山的嘱托，也是马虎山南疆的精神支柱。与马步芳决裂后，为光复马家荣光，马仲英、马虎山与盛世才在新疆大战五场，若不是苏联人插手，他们几乎就要成功了。师夷长技以制夷，马仲英决定接受苏俄代表邀请，前往莫斯科深造军事，待学成归来东山再起。\n\n然而从苏联回来后，马仲英却性情大变，俨然被赤色思想洗了脑子，完全置家族于不顾，满口“无产阶级”和“社会主义”。而最让马虎山不能容忍的是马仲英联络陕北，接受任命，受中共制约，任其摆布。大丈夫一世英杰，岂可屈居人下？\n\n仅仅是战将的马虎山在面对身居高位的马仲英没能力取而代之，不过他有两个优势——第一，马仲英威名煊赫，离不开家族对他鼎力相助。现在他置家族利益不顾自然引发宗亲不满，而马虎山身为宗亲之一自然有“资格”挑明矛盾，赢得家族支持；\n\n第二，马仲英有意整顿南疆军纪，然而他繁杂政务缠身，很少前往和阗以外的地方，那么这么一件军纪整顿的大事也就落在自己这个姐夫头上：怎么整，要整谁，也就只能由马虎山说了算。\n\n因此，马虎山凭借隐秘的策略，把马仲英的权势化为自己的优势。到时先斩后奏，木已成舟，大哥纵然有万般抵触，也不得不接纳现状。"
CPC_main_story_events.39.o: "他开始行动了。"
CPC_main_story_events.40.t: "马仲英遇袭"
CPC_main_story_events.40.d: "巡街访市是马仲英每月都要举行的例行活动。他要从自己官邸出发，按一定路线走遍和阗城的四市八街，探视民情，安定民心。此举给马仲英带来滚滚人望，也使他身后的马氏家族一体均沾，这让苏维埃议会中某些议员颇为忌惮。\n\n今天又是巡视的日子，马仲英像平常一样，骑着高头大马慢慢走在市场里，保安卫士步行跟随。两边商户路人熙熙攘攘，摊贩相接络绎不绝。他们遇见马仲英元帅不必行礼，照常经营即可。\n\n中共党员蒙裕正巧在市场采买，看见马仲英的队伍虽然习以为常，但出于友好应该打声招呼。谈好羊肉价格后，他把肉存在店家，转身要去迎接马仲英一行人。\n\n就在这时，一家烤馕店突然冲出个乞丐样的人，破衣啰嗦蓬头垢发，怀里像揣着什么东西，直奔马仲英队伍而去。卫兵急忙一把拦住，差点就被撞散。乞丐仍不依不饶，死命往里顶，一边顶嘴里一边叽里咕噜说什么：“我快饿死了，我快饿死了……”\n\n卫队长眼见情况不对，忙拉住马仲英坐骑往后退：“将军，这乞丐有诈，哪有快饿死的人力气还那么大？”\n\n说时迟那时快，眼见马仲英要离开，乞丐掏出怀里的东西就飞掷过去。\n\n“手榴弹！”\n\n平静的市场顿时炸开了锅，人群奔走惊呼乱作一团，血肉横飞哀嚎遍地。马仲英被炸得遍体鳞伤，被手下人抢送医院。那个乞丐被卫兵控制扭送大牢，不久被转移到马虎山的营垒接受审讯。\n\n而这一幕，全部被蒙裕目击。"
CPC_main_story_events.40.o: "紧急复电：中央将立刻接管调查工作。"
CPC_main_story_events.41.t: "马虎山谴责中共策划袭击"
CPC_main_story_events.41.d: "蔡雪村数次通电马虎山，让共产党也参与马仲英遇刺的案件调查，但马虎山每次都含糊其辞，故意拖延。正当蔡雪村和杨波清等待中央回电，商议对策时，马虎山高调宣布自己找到了幕后凶手——那就是中共！\n\n蔡杨二人惊愕片刻，立刻明白个中内涵：马虎山要当盛世才第二。杨波清立刻要求蔡雪村起草一份召集军队的命令：“必须在马虎山之前控制军队，不然十几年的功夫就功亏一篑了！” 但蔡雪村没有拿笔，转而讲出自己的意见：“还得去找吴应祺。”听到这个名字，杨波清更急了：“现在这个情况，你还去找马仲英的那个跟班？”\n\n“你先别急，不讨论吴可靠与否，我们需要上层人士帮我们透信。”蔡雪村摆摆手示意杨波清坐下，压低了声音，“以及我谈过很多次，吴这个人跟军阀不一样，和我们也不一样，他应该是协助我们工作的格别乌特工。”\n\n可是杨波清不以为然，只是一直催促动笔，并且质疑蔡雪村的推断毫无根据。于是蔡雪村挥动钢笔，刷刷点点写下严禁部队擅自离位的命令，拿去给杨看然后继续说道：“马虎山正监视着咱们，调兵命令绕不开他控制的收发站。找到吴应祺，让他帮咱们安排稳妥的联络线——你别忘了之前他也帮过这个忙。”\n\n杨波清没有正眼看蔡雪村，望着那张纸似是而非的笑了笑：“除了发调兵命令，你不再求他办点别的事情。”\n\n“当然得求，”蔡雪村没有避讳，“让吴应祺再去找马仲杰，以宴请的名义找个地方见面。一是让咱们摆脱监视，二是团结这些同情共产党的上层人士，配合我们反马虎山的行动。”杨波清有点心动，抬起头好像自言自语地讲：“还得问问马仲英的真实情况是不是？”\n\n中央的回电尚未到达，但箭在弦上，不得不发，多耽搁一秒钟都会威胁我党的生命。杨波清点点头说：“好，我同意你联络吴应祺，走上层路线解决问题。”"
CPC_main_story_events.41.o: "宴请马仲杰，向他了解马虎山情况。"
CPC_main_story_events.42.t: "马仲杰的情报"
CPC_main_story_events.42.d: "致电中共中央：\n\n近期，马仲杰和吴应祺多次前往马虎山行营拜访，发现其营内气氛肃杀，人员来往频繁。故我方派遣特工潜入其中，以作进一步侦察。\n经调查，马虎山在营内多次向特定频率电台发送电报，其使用一种不同于我阵线的新式密文，该密文与日伪特务机关的密文高度相似，故我新疆局高度怀疑马虎山正试图勾结敌对势力，妄图颠覆新疆，危害革命。\n根据对电台频率、密文规律的分析以及特工的报告，我方发现，马虎山正在秘密囤积军备物资，同时进行军事训练。但受限于技术和人手，我方无法确认密文具体内容，以及马虎山的联系对象。故附电密文，恳请中央破解。\n最后，请中央做出进一步指示，应对马虎山，以备后患。\n\n中共新疆局\n蔡雪村、杨波清"
CPC_main_story_events.42.o: "不妙啊。"
CPC_main_story_events.43.t: "情报线索"
CPC_main_story_events.43.d: "致电中共中央：\n\n经我专区特工调查，白天，马虎山的商队驶离阿克苏，向喀什、北疆地区驶去。后经特工尾随，发现其夜间与未知势力进行交易后，迅速赶回阿克苏，如此往返数天。\n同时，逗留阿克苏的特工发现，商队每次回归，都用厚毛毡裹住货物，其长度，宽度，都足以放入数支步枪。而马虎山的部队亦加强巡逻，设岗置哨，对除他商队之外的其他商队进行严格排查。\n故我方确认，马虎山正与东突厥势力秘密交易，其行为若不制止，定会危害革命，望中央和新疆局的同志们速决。\n\n发自：维吾尔共产党并中共伊宁支部"
CPC_main_story_events.43.o: "盯紧他！调查他们的详细地点！" 
###前期情报到此为止
CPC_Ma_Hushan_crisis.0.t: "中央碰头会"
CPC_Ma_Hushan_crisis.0.d: "对大西北的其他地方而言，这只一个平平无奇一如既往的清晨，但对阿克苏政府路前而言恐怕并不如此：一支全副武装的部队快速行动至阿克苏政府内，逮捕其中的中共党员。士兵用布袋套住党员的头，将其带离市政府。而在新近解放的喀什，一支不明武装正在围攻喀什市委，在包围中，市委的工作人员在公频中急电，希望将求援信息传播的越远越好。\n\n报务员监听着各个频段的信息，忽然收到公频中的明文电码——喀什党委遭到袭击，请求支援！蔡雪村立刻要求致电喀什，确定情况；同时致电阿克苏，打探马虎山的行动。喀什方面说暴徒攻势凶猛，不同以往；而阿克苏方面却反常地默不作声。“糟糕！”阿克苏频道的寂静让蔡雪村意识到事态不对，这不是分裂分子的骚乱，而是有预谋的袭击。\n\n“马虎山开始行动了“一旁的杨波清笃定道，他立刻招来警卫员，“赶紧去召集部队，准备镇压马虎山的叛乱！”然后他对蔡雪村说道：“你在新疆长期工作，马上联系那些反对马虎山的势力，我这里向中央求援！” 紧接着，他让报务员致电中央，请求支援。长波电台带着新疆的求援信，经过电离层的反射，飞入西安城中。\n\n会议室内，周恩来将来信传阅众人，“马虎山终于露出马脚了”刘少奇说道。薄一波则提议，立刻让解放军开赴和阗，平定叛乱。周恩来和习仲勋则认为不可，现在尚不清楚南疆具体情况，贸然进军可能会打草惊蛇，激化矛盾。最终，会议决定："
CPC_Ma_Hushan_crisis.0.o1: "召集和阗商界座谈会，向他们通报情况。"
CPC_Ma_Hushan_crisis.0.o2: "继续私下调查，最好把赛福鼎那边也叫上。"
CPC_Ma_Hushan_crisis.1.t: "金库闹剧"
CPC_Ma_Hushan_crisis.1.d: "乘着共产党因为喀什和阿克苏晕头转向之际，马虎山誓要夺走和阗中央银行的黄金，只要夺取这批黄金，便有了和共产党叫板的资本，甚至可以自立为王。马蹄卷起戈壁的尘土，卷起马虎山难填的欲壑、狂妄的野心，他的精锐骑兵犹如沙尘暴，气势汹汹地向和阗袭去。\n\n马虎山带着骑兵杀入城中，向中央银行奔去，忠于共产党和马仲杰的军队都在守备着阿克苏、喀什方向，一时半会儿无法赶到。党委书记看见窗外不怀好意的骑兵，立即通知银行安保待命，同时拨通直连新疆局的电话，传达马虎山抢劫银行的信息。新疆局电铃大作，得知消息的杨波清立刻让人带队赶往银行，同时命令银行书记见机行事，以待支援。\n\n马虎山带着骑兵们提溜下马，举枪冲入银行，抓住了大厅里倒霉的银行经理。“高举双手不要动！”马虎山大吼一声，拿枪威胁着经理，“爷爷我只要黄金，其他不要！” 安保人员随即举枪对峙，双方剑拔弩张紧扣扳机，局面一触即发。马虎山摆弄着手里黑枪，威胁着经理：“你个老小子，赶紧把金库给老子打开！”\n\n党委书记梳理着周遭环境：匪徒人多势众，但初来乍到，人地生疏。经理现在是马虎山的人质，只有他知道金库大门的密码，或许令他缄默，可作缓兵之计。安保人员训练有素，但人手有限，抵抗只得一时。党委书记思索片刻后，他决定："
CPC_Ma_Hushan_crisis.1.o1: "警告经理不准听命。"
CPC_Ma_Hushan_crisis.1.o2: "命令安保人员武力抗命。"
CPC_Ma_Hushan_crisis.1.o3: "默许他运走，根据先前的情报在必经之路上埋伏他们。"
CPC_Ma_Hushan_crisis.2.t: "情报线索"
CPC_Ma_Hushan_crisis.2.d: "中共中央：\n\n目前我们未在伊犁及周边获得马虎山相关的情报，但近日东突厥恐怖分子活动确实日益猖獗，我们判断这可能有某种内在关联，目前有两种推断供中央参考推断：\n\n第一，马虎山有可能趁东突分子袭击喀什党委作出相应举动，以求架空马仲英夺取和阗政府主导权，目前我们判断这个可能性较大。\n\n第二，马虎山可能暗中唆使东突分子制造事端，然后再亲自带兵出面剿灭，通过作秀手段夺取政治筹码，在未来以“平叛功臣”身份要挟和阗政府甚至党中央。\n\n无论如何，从近日新疆局及和阗政府反馈之种种情况来看，马虎山正在酝酿阴谋一事是确凿无疑的。盼望中央早作决断，将阴谋扼杀在摇篮里。\n\n发自：中共伊宁支部"
CPC_Ma_Hushan_crisis.2.o: "批复：继续深入调查。\n此情报转维共赛福鼎处。"
CPC_Ma_Hushan_crisis.3.t: "情报线索"
CPC_Ma_Hushan_crisis.3.d: "中共中央：\n\n我方特工在伊宁、塔城等地继续遵照指示深挖，在伊犁地区没有发现其他有利线索，但发现克拉玛依一带似有东突分子活动痕迹，同时通过基层走查发现，和阗马氏商队也在不久前来到此处逗留，处理了不少大宗货物交易。\n\n由于克拉玛依目前靠近盛世才辖区，我们怀疑盛世才也可能参与马虎山的阴谋中来。\n\n我们接下来将派遣特工前往焉耆、迪化等地区以求情报突破，特此询问中央意见。\n\n发自：维吾尔共产党并中共伊宁支部"
CPC_Ma_Hushan_crisis.3.o1: "东突残党确实有和盛世才合流的可能。"
CPC_Ma_Hushan_crisis.3.o2: "塔城会不会有苏联旧部作祟？他们也喜欢两头下注。"
CPC_Ma_Hushan_crisis.3.o3: "阿克苏、喀什刚刚解放，那里也有可能。"
CPC_Ma_Hushan_crisis.4.t: "情报线索"
CPC_Ma_Hushan_crisis.4.d: "中共中央：\n\n我们在焉耆迪化等地的特工没有发现任何盛世才方面同东突勾结的迹象——毋宁说正相反，盛世才在境内也因东突厥分子四处流窜而疲于逮捕，马虎山似没有同盛世才有直接联系。\n\n根据收回情报我们认为调查方向可能出错，也可能是马虎山并未直接同盛世才勾结，而是同入疆的青海马家残党：马呈祥联系勾结。\n\n目前我方已经加紧催促迪化城内特工搜集马呈祥及其辖部近期的布防规划，特此告知中央。\n\n发自：维吾尔共产党并中共伊宁支部"
CPC_Ma_Hushan_crisis.4.o: "看来眼下只能去查马呈祥了……"
CPC_Ma_Hushan_crisis.5.t: "情报线索"
CPC_Ma_Hushan_crisis.5.d: "中共中央：\n\n我们阿拉木图的正式代表在经历较长一段时间观察后汇报说，哈共和哈萨克内务人民委员会目前似没有对外联络的迹象。且我们得到更进一步的消息称，自苏联崩溃联共中央失去联系后，哈萨克方面也就立刻事实上停止了对新疆一切势力的援助。\n\n而由于东突分子在喀什阿克苏等地举兵叛乱，滞留和阗的苏联教官也没有可能从陆路恢复同苏联哈萨克残党的联系，他们在和阗本地的根基也根本不稳，似乎不足以再通过操纵东突厥分子等方式和马虎山有什么秘密往来。\n\n发自：维吾尔共产党并中共伊宁支部"
CPC_Ma_Hushan_crisis.5.o: "看来方向错了，时间也浪费了……"
CPC_Ma_Hushan_crisis.6.t: "情报线索"
CPC_Ma_Hushan_crisis.6.d: "中共中央：\n\n线索彻底中断了，我们了解到马呈祥及其部队目前就在哈密地带布置防线，其意图明显是抵抗中央发兵攻打盛世才，他们的所有物资均由迪化方向运输，并未有任何从和阗送出的物资商品被运往哈密。\n\n我们现在怀疑马虎山是故意在盛世才方向制造疑兵引诱我们收到错误情报并作出错误判断。\n\n目前所有特工已被召回伊宁，随时听候中央进一步指示。\n\n发自：维吾尔共产党并中共伊宁支部"
CPC_Ma_Hushan_crisis.6.o: "可是我们已浪费了太多时间……"


#下策
CPC_Ma_Hushan_crisis.11.t: "大漠狂飙"
CPC_Ma_Hushan_crisis.11.d: "“不许泄露密码！”党委书记命令道，他试图拖延马虎山，等待援军到来。马虎山被书记激怒了，他将枪口顶在经理的脖颈，扳机只需扣动一毫，人质便会死亡。马虎山恐吓道：“你再不告诉密码，打开金库，我就一枪崩了你！”银行经理脸色惨白，眼泪止不住的流出来。见人质情况危急，党委书记只好作罢，同意打开金库，同时命令安保人员不要轻举妄动。\n\n马虎山的士兵和安保人员对峙着，而马虎山胁迫着经理来到金库门前，经理哆嗦地解开密码，打开金库大门。金库的正中间，陈放着南疆经济赖以维持的压舱石——央行黄金，它闪烁着富饶的光芒，映照在马虎山贪婪的脸上。马虎山让几个随从把黄金全部收纳装包，带着经理离开银行。出城后，才丢下经理，扬长而去。\n\n孟长有带着部队赶到后，只发现了一片凌乱的银行以及惊魂未定的工作人员。孟长有问道：“马虎山往哪里跑了！”银行书记回复道：“他带着黄金向策勒方向跑了！”，他大呼不妙，紧接着电告总部，说明情况，并提议立刻追击。蔡杨二人收到电报后，杨波清拍板下令：“跑得过初一跑不过十五，马上让孟长有追击，同时令马赫英在策勒拦截马虎山！”。“等一下！”蔡雪村制止道，“马赫英同马虎山素来交好，我恐他消极应付，即便抓住也可能高举轻放。我建议把他敢进沙漠，饿他个几天几夜，到时他自会缴械投降。”\n\n拦截他还是消耗他？杨波清面临着抉择。"
CPC_Ma_Hushan_crisis.11.o1: "电令策勒防区司令马赫英逮捕之"
CPC_Ma_Hushan_crisis.11.o2: "电令马彦良把马虎山赶进沙漠"
CPC_Ma_Hushan_crisis.12.t: "狂飙末路"
CPC_Ma_Hushan_crisis.12.d: "“嘀，嘀嘀——”，抓捕马虎山的命令电至马赫英营帐，报文措辞强硬：“务必将马虎山捉拿归案，若有懈怠，军法处置！”马赫英反复看了两遍，思索着如何解决妥当。“将军，我们要不要出发？”马赫英的副官问道。马赫英将报文递给副官，说道：“我们把马虎山带回去，略作交代就好。”\n\n马虎山继续飞驰，忽见侧翼驰来一列骑兵，心想追兵已来。“虎山兄！”熟悉的声音从侧后方传来，来者正是马赫英。“赫英贤弟，对不起啦，我要去过富贵日子啦。”马虎山回应道。侧翼骑兵前冲拦截，阻挡住了马虎山的去路。马赫英执马向前，说道：“过了我的防区，就是共军控制的防区，到时追兵只会不留情面！虎山兄，你跟我回去，我和马家的弟兄叔父一起想办法保你。”天罗地网，追兵不断，潜逃计划已然化作泡影。“赫英贤弟，我信你！”马虎山命令随从丢下枪，举手投降，“君子协定，你说过保我平安！”\n\n回到和阗之前，马赫英早已打点好其他马家勋贵，力求保住马虎山。而和阗城内，本应庆幸的蔡杨二人现在却左支右绌——马家的电报接二连三的送达新疆局，长篇大论间，除了马虎山为抗日“没有功劳也有苦劳”外，便是一篇篇措辞强硬的作保要求了。事关重大，蔡杨二人无法单独决定，只好将问题转交中央作决。\n\n周恩来阅读着新疆局的报告，不满道：“这帮马家军，无法无天了！”但新疆人多事杂，盛世才仍盘踞迪化，为大局着想，当下不宜内斗。吃一堑长一智，于是周恩来下令，让马虎山立刻退休，并将其软禁。“中央会增派人手，务必时刻盯紧马家！”周恩来在回电中写道。"
CPC_Ma_Hushan_crisis.12.o: "不是不报，是时候未到。"
CPC_Ma_Hushan_crisis.13.t: "狂飙末路"
CPC_Ma_Hushan_crisis.13.d: "接到电令后，马彦良立刻带着部队追击。侦察骑兵四散开来，试图找到马虎山的踪迹，不一会儿，一名骑兵带回马虎山的行踪。马彦良决定兵分二路，一支从正面截击马虎山，一支从侧面围堵马虎山，连同其后追击的孟长有部形成围三缺一的架势，计划将马虎山赶入塔克拉玛干沙漠。\n\n马虎山看见前方和左侧有两支骑兵杀来，而后方追兵的扬尘也越发靠近。一不做二不休，马虎山决定赌一把，“该死！”马虎山咬咬牙，策马向沙漠跑去。“生死由命富贵在天，先跑再说。”带着随从，马虎山一溜烟地钻入沙漠中，其后的马彦良部与孟长有部会和，决定不去追击，让马虎山在沙漠里自己耗几天，他们只需沿着公路巡逻即可。\n\n马虎山看见追兵并未赶来，于是停下脚步，他问随从周边有没有绿洲，随从回答没有；又问随从携带的食物和水够撑几天，随从回答只够两天。大漠广袤，除了沙子和零零散散的灌木丛，没有任何辨别方位的地标。硬着头皮试试吧，马虎山想。两天的时间很快就过去了，马虎山依旧在沙漠中兜兜转转，出路尚未找到，但随行士兵的抱怨却越来越多。马虎山惊恐地听着抱怨声，心想要是再不找到绿洲或是回到公路，部队就要哗变了。思来想去，他决定回到公路上。\n\n马虎山回到公路后，巡视已久的共产党骑兵叫来了大部队，将之团团围住。见大势已去，他示意手下丢下枪和黄金，举手投降。押回和阗后，马虎山被关入大牢，等待他的将是严厉的审判。"
CPC_Ma_Hushan_crisis.13.o: "人赃俱获，皆大欢喜。"
#中策
CPC_Ma_Hushan_crisis.21.t: "黄金大劫案"
CPC_Ma_Hushan_crisis.21.d: "“快把密码说出来！”马虎山继续威胁经理道。经理惊恐地望向书记，但书记想着能拖尽拖，只是沉默应对。马虎山胁迫数次无果后，心里一横，一枪毙了经理。倒霉的经理一命呜呼，被马虎山随手丢到一边。然后马虎山找到掩体，命令手下开火。\n\n书记也乘乱迅速找到掩体，并要求安保人员反击。双方拉开架势，你来我往。银行安保熟悉地势，可以拿办公楼为掩体组织对抗，但人手和弹药不足，抵抗时间有限；马虎山一行人则弹药充足，人手众多，可不熟悉银行结构，只好在门口和大厅不断向银行内部倾泻子弹。双方的交火很快引发了全城的混乱，交火的信息也很快传到了蔡杨二人的耳中。\n\n得知交火信息后，蔡杨二人立刻让部队开赴和阗。杨波清说道：“看来马虎山是忍不住了，开始明抢了。”蔡雪村则忧心地说：“不清楚安保部队可以坚持多久，我们赶紧。”部队到达和阗城还需些时间，蔡杨二人开始讨论具体对策：蔡雪村认为，应当立刻包围和阗城，这样马虎山便插翅难逃；而杨波清则认为，每拖一分钟都会造成更多的伤亡，应该让城内部队立刻进行清剿，同时城外部队也赶快进城支援。"
CPC_Ma_Hushan_crisis.21.o1: "电令和阗周边部队包围和阗城"
CPC_Ma_Hushan_crisis.21.o2: "电令城内部队封锁全城，清剿叛军"
CPC_Ma_Hushan_crisis.22.t: "狂飙末路"
CPC_Ma_Hushan_crisis.22.d: "孟长有和刘瑞龙带着主力部队，连同周边抽调的公安，将和阗古城围了个水泄不通。炸开金库夺取黄金后，马虎山来不及得意，便策马向城门跑去，刚出城门，他便看见前来的大军早已封堵前路。他只好执缰回头，想去另一个城门碰碰运气。可另一个城门外面，共产党的军队也早以逸待劳，等着猎物送上门来。\n\n恐慌的情绪在马虎山及其随从中蔓延：完了，全完了，好处没捞着，还要被枪毙！随行士兵很快发生争吵，相互指责对方的无能。更有甚者指责马虎山害了他们，扬言要拿马虎山的人头戴罪立功。马虎山顾不着随从的诘难，他自己脑袋里都是一团浆糊：怎么办，怎么办？城外的军队开始陆续进城，情急之中，灵光乍现，马虎山带着随从，跑进了市医院。\n\n马虎山让手下控制住医护人员，在医生护士的尖叫声中，马虎山着急的问马仲英在哪里，受惊的护士指了指走廊深处，马虎山二话不说，向走廊深处跑去。在最深处的病房里，脱离生命危险的马仲英已经回复了些，他看见马虎山忙急忙慌地跑进病房，身上沾满了灰尘。马仲英神色惊讶，不知姐夫为何如此狼狈。马虎山一下跪倒在病床前，声泪俱下的哭诉着自己鬼迷了心窍，希望马仲英为他求情。伤病缠身的马仲英经不住马虎山的软磨硬泡，他厌烦地闭上眼睛，答应了马虎山的请求。\n\n在马仲英的求情下，马虎山得以免受牢狱之灾，一切职务虽然全被罢免，但终归是平稳落地。偷鸡不成蚀把米，至少保住小命，被软禁在家的马虎山心想。"
CPC_Ma_Hushan_crisis.22.o: "今天先记上一笔，以后咱好好算账。"
CPC_Ma_Hushan_crisis.23.t: "狂飙末路"
CPC_Ma_Hushan_crisis.23.d: "和阗城内，公安、军队同时收到急电，开始行动起来。公安干警同民兵立刻赶到各个路口，戒备着城市里的一举一动，誓不放过任何一个暴徒。而城中军队则立刻赶往银行，争取在马虎山逃离之前捉拿马虎山，保卫新疆的经济安全。\n\n一番激烈交火后，马虎山解决了所有安保人员，他和随从用炸药炸开了金库，夺走了全部的黄金。来不及得意，马虎山和随从离开银行，却发现共产党的军队从四面八方赶来——他被彻底包围了，魔高一尺道高一丈，天罗地网已经布下。\n\n恐慌的情绪在马虎山及其随从中蔓延：完了，全完了，好处没捞着，还要被枪毙！随行士兵很快发生争吵，相互指责对方的无能。更有甚者指责马虎山害了他们，扬言要拿马虎山的人头戴罪立功。马虎山顾不着随从的诘难，他自己脑袋里都是一团浆糊：怎么办，怎么办？去医院找马仲英帮忙？通往医院的道路已被封锁，公安和民兵都在严阵以待。\n\n只能赌一把了，马虎山咬咬牙，策马向医院奔去，靠近的共产党士兵立刻开火，警察和民兵也纷纷倾泻弹幕清空弹匣。事后法医确认马虎山的致命伤应为穿胸而过的约10个弹孔。而他余下的随从见状，只得缴械投降。 "
CPC_Ma_Hushan_crisis.23.o: "死得其所"
#上策
CPC_Ma_Hushan_crisis.31.t: "守株待兔"
CPC_Ma_Hushan_crisis.31.d: "思索片刻后，银行书记回答道：“好的好的，我配合你，你冷静！”，书记指示经理打开金库，并表示一切责任由他承担。经理颤颤巍巍地打开了金库大门。金库的正中间，陈放着南疆经济赖以维持的压舱石——央行黄金，它闪烁着富饶的光芒，映照在马虎山贪婪的脸上。马虎山让几个随从把黄金全部收纳装包，离开银行。\n\n经理惊魂未定，但书记立刻跑入办公室，通知新疆局黄金被劫。蔡杨二人结合前些天赛福鼎的情报，立刻决定让李有祯派人在马虎山的必经之路上守株待兔，以逸待劳。出城后，马虎山将装有黄金的箱包放上马车，带着马车向交易地点驶去。\n\n维族特工们在一处必经的绿洲埋伏好，等待着马虎山的到来。晚上，一支可疑的车队缓缓驶来，领头的正是马虎山。车队在绿洲停下脚步，想要补充水源，略作休整。马虎山走到泊边取水时，维族特工一拥而上，将马虎山的随从和车队控制住。马虎山反应迅速，骑上一匹马向大漠深处奔去。特工们现场审讯了马虎山的随从，得知马虎山似乎想要摆脱共产党，自立为王。特工队控制住随从和运有黄金的马车。用无线电台向上级汇报了情况。\n\n李有祯收到了报告，确认黄金安全无误后，他长舒一口气——总算是没让这贼人运走了黄金，但他同时还必须决定："
CPC_Ma_Hushan_crisis.31.o1: "黄金运回和阗，逮捕马虎山"
CPC_Ma_Hushan_crisis.31.o2: "黄金扣下，接着运到目的地"
CPC_Ma_Hushan_crisis.32.t: "狂飙末路"
CPC_Ma_Hushan_crisis.32.d: "几天之后，缺水少粮的马虎山主动向巡逻的士兵投降。士兵将马虎山押送至和阗，新疆局总部接手后，立刻将马虎山送至安保科的地下室内，交由李有祯负责审讯。\n\n由于抢劫事件影响恶劣，审讯内容基本集中在马虎山为什么要抢劫上。日光灯直直照射着马虎山，让他感到一阵眩晕，不得不把眼睛眯成一条线。兼续不断、日夜不停的审问拖垮了马虎山的精神，但仅存的理智告诉他不能告知共产党他的合作对象，否则可就不是蹲大牢这么简单了。 \n\n于是马虎山说，他想利用这批黄金招兵买马自立为王，摆脱共产党的控制——这和他对随从说的一样。李有祯拿来马虎山随从的口供，发现对照无误。直觉告诉李有祯：马虎山还在隐瞒某些事情。接下来又是几天的审问，但马虎山并没有翻供，依旧重复着最开始的证词。李有祯无功而返，只得将原有口供上呈总部。\n\n最后，马虎山被投入大牢，而真正的阴谋也随之一起石沉大海。"
CPC_Ma_Hushan_crisis.32.o: "加强和阗安保工作，预防第二个马虎山。"
CPC_Ma_Hushan_crisis.33.t: "狂飙末路"
CPC_Ma_Hushan_crisis.33.d: "收到继续调查的命令后，特工们扒下俘虏的衣服，打扮成马虎山的人，并与前来追捕的部队会合。双方讨论后决定，特工队负责潜入调查，部队负责殿后支援。维族特工拿着之前查出的交易地点同马虎山随从核对，确认无误后便出发前往。\n\n到达交易地点后，维族特工立刻听见了他们最熟悉的语言——维吾尔语。交易者见到车队后，敞开双手招呼道：“赛俩目！（穆斯林祝贺词）”，特工们警惕了起来：维吾尔、穆斯林、马虎山的接头对象。综合这些信息，特工们判断交易者是尚未被清剿的东突厥份子，为避免引起怀疑，特工队长也回祝对方。交易者带着车队驶入东突残部的营地，特工们赫然发现营地内存放着大量的军火物资。残部首领见马车到来，笑脸相迎，说着“反共救国，再造突厥”的鬼话。特工队长敷衍着对方，突然间，他拔枪击毙残部首领，其他残部成员见状，慌乱中举枪反击。不远处殿后的部队听见枪声，策马赶往，特工和军队协作，击毙、逮捕了这群分离主义分子。\n\n特工押着剩余的东突份子回到和阗，此时早已被捕的马虎山仍在嘴硬，只承认“摆脱共党，自立为王”的想法。审讯完押解来的东突份子后，李有祯把东突的口供往桌上一摊，人证物证俱在，铁证如山！看着这些证据，马虎山的精神崩溃了，他瘫坐在审讯椅上，等待着最后的审判。\n\n几天后，马虎山试图勾结东突厥份子，阴谋推翻新疆根据地的新闻登上各解放区报纸，随后，马虎山被押往和阗市中心，执行公审。"
CPC_Ma_Hushan_crisis.33.o: "引蛇出洞，棒打七寸。"
CPC_we_exactly_know_what_Ma_Hushan_will_do: "§R马虎山§!的阴谋被§Y完全揭露§!！"
CPC_main_story_events.44.t: "黎明前夕"
CPC_main_story_events.44.d: "从病床回到工作岗位的马仲英感到前所未有的活力——休养让他得以暂时脱离繁忙的工作，好好恢复过去因操劳而过度紧张的神经，而马虎山事变的解决也让他得以收回部分被阻隔的权力。回到新疆局总部，蔡杨二人热切的欢迎他的回归，嘘寒问暖后，新疆局重新调整了工作重心：消灭盛世才，解放全新疆。\n\n\“我们将联合伊犁专区一起对盛世才统治区形成南北夹击之势。”杨波清指着地图说道，“中央也会给予我们支援。”马仲英看着地图，激动的心情难以平复——与盛世才决一死战的时候到了。马仲英主动提出：“我想到军营里看看士兵同志们，去做战前动员。”\n\n马仲英来到军营，立刻赢得了众将士的欢迎，这位人称“尕司令”、“雷电将军”、“当代马超”的老英雄，战斗勇猛，魅力非凡。军营中的汉人、回人、维吾尔人和蒙古人都对他敬爱有加。马仲英站到讲台上，向将士们做出最后的动员：“同志们，弟兄们。打败盛世才的日子到了！”台下的战士应声欢呼，为了打倒盛世才，解放全新疆，他们日夜训练，枕戈待旦。“北面的赛福鼎同志，东边的毛泽东主席都将同我们一起战斗，我们必能解放新疆！”马仲英的动员引发了更热烈的欢呼。战士们高喊道：“大元帅万岁！毛主席万岁！中国革命万岁！”"
CPC_main_story_events.44.o: "打进迪化城，活捉盛世才！"
CPC_main_story_events.45.t: "夜追"
CPC_main_story_events.45.d: "巡逻队长带着两名士兵追击土匪追到山口前。“土匪拉着大车进山跑不了多远，咱们快追，早去早回！”\n\n“是！”\n\n三人翻过一座小山坡，看到被土匪劫走的粮车，车上粮袋一片狼藉，粮食撒得七零八落。\n\n“他们应该是分粮逃了，去周围找，往最大股的追。”\n\n不多时，一路倒伏的野蒿把他们引到密林之中，在一片空地上轨迹中断了，四处幽暗无比。正当战士们寻找新线索时，队长猛然醒悟，急忙下令撤退。只听枪声骤然响起，一名战士中弹倒地，再看退路已被土匪封锁，还向他们步步紧逼。\n\n余下二人迅速躲到大树后面，队长问：“大宝，看清他们多少人了吗！”\n\n“五六个！”\n\n“你吸引，我瞄准！”\n\n“是！”\n\n说罢，大宝纵身一跃，窜到旁边的树窠，土匪的子弹立马朝那边飞去。趁这时机，队长举枪便瞄准一个蹲在草丛后的傻货扣下扳机，那人应声而倒。只听对面一叠声地叫：“老大吃弹啦！撤！”\n\n喊声一过，四周寂静如常。\n\n队长躲在树后，冷静观察四周还有没有敌人，转头招呼大宝报告敌情。\n\n“土匪好像都跑了，队长你真行，一枪就把对面头头干掉了。“\n\n“顶多是吓跑了，咱们还得继续追。“\n\n两人慢慢走出掩体，回到空场背上同志的遗体，继续追击土匪去也。"
CPC_main_story_events.45.o: "还有两处匪窝。"
CPC_main_story_events.46.t: "上访"
CPC_main_story_events.46.d: "四清运动是清账目、清仓库、清财物、清工分的统称，总而言之是清算大跃进时期犯错误的干部。为了给全根据地起个头，刘少奇决定亲自下场。那么，从哪逮个坏蛋来抓呢？于是铜川县公推出来一位——“白水”公社书记李秀梅。  一百多人的工作组，浩浩荡荡来到白水公社，一边宣布李秀梅是坏干部，一边把人给隔离起来，然后召集公社其他成员了解情况。\n\n可十几天里，了解来了解去也没抓住李秀梅什么把柄——她没犯过错误。 而李秀梅已经不甘监禁，从自家打到工作组开会的大院，口口声声要找刘少奇理论吵嚷起来。王任重出门制止道：“里面正在开会，不许大呼小叫！”  李秀梅两手一叉腰，瞪着王任重说：“我一没贪污，二没杀人，凭什么冤枉我？难道都是我害老百姓饿肚子的？屈打成招这不是党的作风啊！” 这一下把王任重惹恼了，刚想叫来武装队把李秀梅带走，房间里却传来刘少奇的声音：“你们不要动她，让她进来。” 李秀梅被请进屋内，见到刘少奇，满腹牢骚的她竟一时凝噎，眼泪止不住地就流了下来。\n\n“李秀梅同志，你受委屈了。大跃进中犯下的错误有些不完全是你们的责任，更多还是我们这些在上面的人要负主责。我们党现在清查这些问题，就是要搞清楚是非黑白，恢复人民的信任；你既然上访，说明你还是信任党的，你不妨告诉我们真实的情况，言者无罪，知者足戒。我们一定会实事求是。”刘少奇娓娓动听的话，让李秀梅再也无法抑制，一股脑地将连日来的苦水倒出。\n\n第二天，工作组悄然撤出了白水公社，省里也再没提及这次调查。后来，解放日报刊登了李秀梅上访事件，在批评这种鲁莽行为的同时，也赞同并鼓励了这种勇于反应实际，坚持真理的精神。"
CPC_main_story_events.46.o: "实事求是。"
CPC_main_story_events.47.t: "林中故事"
CPC_main_story_events.47.d: "“哗啦……哗啦……”\n\n泛着枯黄的白桦林被初秋的风吹动着，不时带走几片枯叶飘下，不断拍向行人的身上，就连那些少有停留的卡车，在面对如雨的枯叶时都被迫载满了一车，尤其是在昨夜的暴雨之后，那些叶子就仿佛沾了胶般紧贴在所依附的所有地方。\n\n苦恼于此的张若怀用棍子在他那宝贝车子前盖上划着，缓缓的将叶子扫掉，随后又走到车的后方检视了起来，如若不是那车厢在前几日就被蒙上了层布，此刻车厢内的几箱零件和那台满是油污的机器恐怕早就被叶子盖住了。\n\n除了暴雨，昨夜的交火也异常猛烈，几公里外的旧工厂附近的高炮阵地，前后总计近半个时辰都在响彻着炮声，因此工厂里出于安全考虑没有夜间卸货，期间甚至有两架机尾喷着火的敌机掠过这附近，随后在不知何处坠毁，一大早便有搜查队被组织了起来出去寻找敌机。\n\n车厢上的布被掀了起来，几名工人应着张若怀的声音爬上卡车，用钩索固定住机器下的托盘，随后扶着让一旁的小吊车缓缓的吊到了另一辆拖车之后，又经固定后被拖进了一旁涂满伪装涂料的厂房之中，张若怀则和其他工人一起，将剩下的零件向仓库抬去。\n\n穿过新厂房,旧厂房以及树林，它们以一种不协调的方式排列着，如同一座砖石组成的迷宫，错综复杂，绕的张若怀直迷糊，但它们的不协调加之部分伪装，却又让厂房完全融入了白桦与梧桐的杂交林之中，那原本聒噪的机器声也被林海吞没，只有几个民房样式的空屋在远处的空地上稀稀落落的坐落着，就像是此处没有任何的东西，而从林中驶出的卡车所载的不过是些无足轻重的“木材”。"
CPC_main_story_events.47.o: "在寂静中，热血得以流淌。"
CPC_main_story_events.48.t: "天河"
CPC_main_story_events.48.d: "“喂———”，艾克恭发出呼号声，沿着输水桥的桥墩赶着羊。太阳西斜，得在太阳落山前赶紧回村里，艾克恭想着。正好输水桥是沿着耕地建设的，沿着输水桥走，准不会出错。不过相较于输水桥，艾克恭更喜欢“天河”的称呼，这是乡里的老人取的绰号，架在天上的河水，真是形象。三个月前，村里还在为用水而困扰，还在为打了几口深井却水涌不出而焦急，现在，不仅农田的灌溉有了保障，生活用水也不再拮据。\n\n“据说这水是洮河水。”艾克恭的爷爷，一个老农民说道。夜晚已至，繁星点点，老农民结束一天的劳作，蹲在门口，划了只火柴，点燃手中的水烟壶，火柴闪烁且微弱的光芒映照着他黝黑且如黄土高原般沟壑纵横的脸庞。他甩了甩手，熄灭掉手中的火柴，呼出嘴中的烟气，眼神怅然若失，对艾克恭说：“小孙子，你爸爸之前就是去修这天河，才不慎跌入山谷里死的。”艾克恭木讷的点点头，这并非对父亲离世的无感，而是爷爷常把父亲的死挂在嘴边，以至于他视作平常。但老农没有像往常一样，接着对儿子的死耿耿于怀，而是拿手指了指输水桥，再指了指不远处的梯田，说道：“不过要是没有这天河水，怕不是明年我们都要饿死。原本的井水已经见底了，新打的几口井也不出水。没有这天河，庄稼都要枯死。”\n\n老农民不知是在对艾克恭说话，还是在喃喃自语，他眼神里闪烁着悲痛与侥幸，似乎在说服自己，要么儿子摔死、尸骨无存，要么庄稼歉收、全家饿死，没有其他选择。艾克恭看出了爷爷的五味杂陈，告诉爷爷他先回屋练习写字。老农民应了一声，继续留在屋外发呆，看着输水桥里的流水，在月光下反射出的粼粼波光，老农感受到了一种独特的美，却说不上来。“疑是银河落九天”屋内传来些许结巴的读书声打破了夜晚的宁静，是艾克恭在读自己练的字。银河？确实像银河，银河也是天河嘛。老农想到。他敲了敲水烟壶，把烟灰从中倒出，然后回到屋内。\n\n斯人已逝，可生活还要继续。老农拍了拍艾克恭的肩膀，说道："
CPC_main_story_events.48.o: "“早点睡，明天你还要上学，我还要上工呢。”"
CPC_main_story_events.49.t: "体制改革"
CPC_main_story_events.49.d: "“吴老师，您帮帮忙，那个苏联专家又在叽里呱啦讲一大堆我们不认识的名词了。”丁国祥和其他几个研究生一脸苦恼地找到吴老师，“昨天才搞明白上节课讲的一大堆关于发动机设计的名词和原理，今天上课又是一大堆的新名词。这样搞下去，我们专业光是理解名词上就得浪费不少时间，动力工程专业怕不是要变成翻译专业了，您是俄语方面的专家，可否麻烦您去当我们的助教？”\n\n自从翻译所合并到西安大学后，吴老师每天都能收到来自工程院学生的求助。虽然报读工程院的学生都学了俄语，可架不住专业名词即多又杂，而俄国专家们又不会汉语，只好尽可能减慢上课速度，但效果依旧不尽如人意。合并后的翻译所最初被理所当然的划分为翻译专业，但因为根据地基本没有外交需求，所以应者寥寥。工程院学生抱怨语言的隔阂拖慢了上课节奏，而翻译专业的老师又因不被重视而大倒苦水。吴老师想到此处，对丁国祥说道：“我知道了，正好我后天要去见校长，我会把你的困难一并和校长说明。到时我会给你答复”\n\n两天后，吴老师走进校长办公室，递交上一份建议计划书，上面写着让翻译专业的师生优先和工程学院和国防研究院的外籍专家对接，辅助阵线的科研人员和研究生展开工作。吴老师说到：“校长同志，我校新近合并，好多学生反映对于专业名词外语理解困难。同时我们翻译专业的师生对于缺少工作岗位、无法投身革命事业而感到遗憾，因此我想借此机会，让翻译专业的师生可以去做系统性文本翻译，以及外籍专家的助教工作，提升我校和研究院的工作效率。” \n\n校长详细阅读了吴老师的建议计划书，他也在为近期学校合并后的一系列问题而焦头烂额，有一份详细且可执行的文件是再好不过的。“写的很好，吴老师”校长笑着说到，“这是一份详实的计划书，就按照你说的，依此计划进行校内体制改革。”下午，校长便召集其他领导快速通过了关于体制修改的相关事宜，并向上呈报，力求尽可能快地解决师生问题。\n\n次日，西安大学的门口收到一份来自上级部门的信件，上面写着“批准执行，并由校长全权负责改革的具体事宜”。"
CPC_main_story_events.49.o: "枪打出头鸟，奖赏领头人。"
CPC_main_story_events.50.t: "齐心协力"
CPC_main_story_events.50.d: "习仲勋回到了淡村——他阔别多年的家乡，并非再次被贬罢官，而是受中央委托巡查陕北各公社的情况，而这一站，便是淡村。在淡村的街头巷尾，关于修建水渠的讨论早已成为了日常。每天清晨，社员们便扛起锄头和铁锹，向工地走去。\n\n一年半前，富平县要求淡村周边几个合作社合并成一个大社——淡村公社，公社内的田地星罗棋布、零零散散。开垦新田是肯定的，但灌溉却成了问题，这些年来，每一口新井都比前一口深，有的甚至打不出水，缺水问题日益严重。新成立的公社委员会决定，从公社外的山区挖一条水渠，引水灌溉，将各个零碎的耕地连成一片。动员大会后，社里的男女老少便在农闲时热情洋溢地参与水渠建设。山里的石头坚硬如铁，鼓舞士气的劳动号子、石渣飞溅的乒乒乓乓和铲土的沙沙作响交织成一曲不绝于耳的劳动交响。水渠的施工现场几乎是24小时不停工的。在白天，村里的男人们埋头挖掘，而到了晚上，许多妇女和老人则负责抬土、搬石。一些半大的少年也加入其中，他们一边嬉笑玩乐，一边推着载着石土独轮车跑步行进，要是他们玩得过火，家长也会略微斥责，以作提醒。几个月的努力后，水渠便初具雏形，沟渠边上由石块加固着，沿着黄土坡蜿蜒而下，进入平原后，沟渠将一片又一片田地连起，尽可能保证每一片田地都将得到滋润。\n\n等习仲勋来视察的时候，水渠已基本完工，今天是开闸放水的日子。公社书记说到，淡村公社除了一般农业，还有畜牧业以及农副业，新建的水渠不仅可以解决缺水的问题，还可以进一步拓展畜牧业和农副业的生产。公社书记带着习仲勋去到山口，习仲勋看着蜿蜒的沟渠，不由得啧啧赞叹。河道边，匝工将水匝缓缓升起，河水卷着一个个小漩涡沿着沟渠顺流而下，在日光的照耀下波光粼粼。不一会儿，渠水灌满了沟渠，冲出山口，奔向农田，连接成一条闪烁的项链，如同佛祖的捻珠，保佑着来年的丰收。村民们看着奔涌而来的河水，高声欢呼，人人脸上都洋溢着高兴的笑容——不靠天，不靠地，全凭我们自己的努力。"
CPC_main_story_events.50.o: "流下的汗水，都将成为未来的食粮。"
CPC_main_story_events.51.t: "做买卖（1）"
CPC_main_story_events.51.d: "收购员小李一早就来到了供销社，虽然他已工作多年，但每次收购的时候都会感到些许紧张，毕竟这是个得罪人的差事。而供销社门口也已聚集了不少村民，老杨排队等候，看着黑板上的价格，皱眉叹气道：“今年的谷价又降了，一斤三分钱，种粮这活儿还咋干！” 村民们纷纷附和，窃窃私语。 “这低价把我们辛苦全压没了，这点钱，够干什么？”一位妇女没好气地说道。\n\n轮到老杨时，他把稻谷往收购台上一放，站在台后的小李头也不抬，或许是心里紧张，或许是忙着称重。 “一斤三分钱，总共十五斤，四毛五。”小李报出价格。老王愣了一下，半天没说话，“小李，这么点钱，今年又是一分没涨？”他忍不住开口。小李无奈地摇摇头：“杨大叔，这价格是政府定的，我们供销社也没办法。谁不想多给点，和气生财呢？” 老杨攥紧了手中的零钱，语气中带着一丝愤怒：“这价格连买肥料的钱都不够。” 回家后，老王放下零钱，神情落寞，他从木柜中掏出陈年的老酒，苦酒入喉，心中有说不出的苦。\n\n忙活一天后，小李和供销社的工作人员装载好收购的农产品，一起回到了县内。麦穗磨成粉，稻谷褪去壳，猪肉盖上章，然后统统搬上运往汉中的卡车。一天后，这些农产品便全部上架到汉中市的供销社里，而价格也就比收购时高了一点。"
CPC_main_story_events.51.o: "下一页"
CPC_main_story_events.52.t: "欲念一起，无休无止"
CPC_main_story_events.52.d: "今天的雨下得很大，从书房的窗户向外看，稠密的雨丝打在街道和房屋上。在平日要么燥热要么阴冷的西安城中有这样的天气，并不容易。这非常能让此时正坐在这个房间里的心乱如麻的中年男人平静下来。\n有人在轻轻地敲门，在厨房忙活的女人走过去开了门，原来敲门的是一个小伙子，手上还带着一点礼物。还未进门，那个小伙子就礼貌地开口：“大姨好。”女人立刻认出，这是自己多年未见的侄子。\n那小伙子刚进了门，就将自己带着的西瓜和一两猪肉放到桌上，正想问大伯在哪里，就看见那个满面沧桑的中年男人从书房出来，小伙心下一喜，上前抱住了他。\n“小郭呀，你伯伯现在都是公安的郭局长了，你就没必要带东西来了，话说你进城时没有人为难你吧？”大姨的关切似乎有些让他不适应，小郭坐得更贴近大伯了，悄悄说了声：“没有。”大姨欣慰地点点头，把西瓜和猪肉拿进隔间。隔间里藏着不少东西——肉蛋奶果烟茶自不必谈，还有一个大且沉的木箱——至于内存何物，无人敢问，无人能答。\n\n家里有个不告人的规矩，就是把客人带的东西都放到这个隔间里。\n\n大姨又走回客厅，见屋里一老一小在聊天，便问：“聊什么呢？”\n“当年的苦日子呗，咱家没有粮，去找我弟家要，我弟弟把剩下的一点米和咱家一块分了嘛。”说完后还感叹一句。“要是不分，我们那一年月可能就得饿死了，哪还能等到加入红军。”\n他偏回头去对自己的侄子说：“孩子呀，你爹对我那么好，我也不能亏待你。今天正好雨又下这么大，就先别回去了，我等下给你爹写封信，就说让你先在我这里待着，我给你安排个工作。”\n第二天，小郭就被他的局长大伯带到公安局，领受了一份夜巡的工作。\n\n万籁俱寂的夜晚，郭局长的房间几乎是周围唯一的一点光亮。他从最底层的抽屉翻找出一本大账本翻到后半，蘸了点墨水，写上一行“猪肉一两，西瓜两个，侄儿送”，而往上一看，这账本就触目惊心得多——“黄金三两，碎银半斤，玉镯一对，万厅长送”“肉票三百斤，粮票九百斤，王科长送”……\n\n很快门便被砸开了，男人手中的笔被震得滑落在地，一群警察冲进书房围住了他，红臂章上赫然有三反标语。\n郭局长顿时头晕眼花，昏倒在地。"
CPC_main_story_events.52.o: "审判终临"
CPC_main_story_events.53.t: "一顿堂食"
CPC_main_story_events.53.d: "“张师傅，你过来一下。”正在灶台上忙活的张久兴听见有人叫他，扭头一看原来是公社的社长秦安正在后门叫他，便放下手上大锅让徒弟接手，自个把手一洗风风火火去也。\n“社长啊，您今天来我这儿有啥要求？您给我说，我能帮就帮。”\n“也没什么事，我来问问社里的食堂伙食如何，毕竟我平时只吃我爱人做的饭，不知道这里的菜合不合口味，丰盛不丰盛。”\n老张听秦社长这样问，以为是要表扬自己的工作成果就说：“秦社长你放心吧，大家吃的大锅饭可够数，不过每天都要剩些。”\n“有剩的？可是今天城里正好有个巡回组来检查餐饮浪费问题……”秦安摇摇头，张久兴心里像吃了一记闷锤。\n\n看他这样，秦社长拍了拍这位膀子大脖子粗的厨子，语重心长地教导他：“你们就把最近剩下的饭菜先倒菜园子里，这不是什么困难问题但粮食也确实不能浪费。这样吧，今天招待饭要在大堂吃，做顿四菜一汤就行，以后照此安排伙食。”\n一听有解决方案，张师傅也开始帮秦社长想问题：“那您说这食材采购费要按四菜一汤的标准来做，肯定是花不了这么多的，那这多出来的钱……”\n\n“哦，这事你不用操心，我觉得食堂的大家也不容易，这钱你就去通知会计补贴给你们。只是我怕有些某些干部和劳模觉得不好或不够。到时人家如果有需求，小厨就累点，多做一盘就是了。”\n张连连答应。\n张久兴觉得这事已经说定了，就要回后厨照办，可秦安拉住了他，还往他兜里塞了四根烟，说要他把剩饭菜倒干净后，用土盖瓷实了再将桶洗干净些。\n“对了，你还得给我四瓶年前产的酒，这种饭局肯定要酒。我还要去劳动点，同社员讲清楚，免得减餐这事怪到你头上，今天你也辛苦了。”"
CPC_main_story_events.53.o: "“没事，节俭勤劳紧跟党中央嘛！”"
CPC_main_story_events.54.t: "倒霉？"
CPC_main_story_events.54.d: "深沉的黑夜里，两三辆载着囚犯和军人的卡车在土路上行驶着，起伏不定、摇摇晃晃地开赴刑场。这趟行程的终点还没有到，但对于被五花大绑的囚犯来说，今日应当就是自己人生进程的终点了，因为他们都是在三反运动中落下马，失了乌纱帽的前党员，现为身背反革命罪的政治犯。\n王小光的身份正如前述，他紧闭双眼，低下头。为了让自己将面前站着的那个军人、那些钢枪、绿色军衣抛到脑后。他只得去反思自己是如何坐在这辆车上的。\n\n一周前，他还是汉中市市委的一员，可就在这狠抓干部的关键时期，自己负责的事却全出了人命：市里开会讨论市政建设，说要一队施工队，资金市里调拨，找人的这个担子就落在自己头上了，他可没时间亲自去挑人监工，就把此事转手给下面的人跑腿，还塞了点辛苦费，结果一开工就死了俩——不就挪了点钱吗？这工程咋能出事呢，还没来得及开会讨论，工头就带着工人家属直接拿着血衣来市政府大门口讨说法，万般无奈他只能用好茶好话给人磨走；\n\n碰巧采砂工作也出了事，采砂队在下游采砂，有群众不想让河道被占住就去理论，结果就打了架，出了人命。\n\n更要命的是两件事碰在一起，两拨人一块来市政府闹，他心一横便强令保安驱散了人群，结果一个老人踉跄倒地，驾鹤西去。\n\n终于到了行刑地，可王小光到子弹在自己脑袋上开了洞都不明白，自己怎么就那么倒霉呢？"
CPC_main_story_events.54.o: "活该。"
CPC_main_story_events.55.t: "做买卖（2）"
CPC_main_story_events.55.d: "半日后，汉中\n\n下班时间到了，老张脱下工作服，去水池旁边洗了把脸，他哼着小曲，向工厂旁边的供销社走去，他今天要买三斤肉，庆祝他宝贝女儿的生日。供销社前，有零零散散几个人在排队，供销社的陈大妈手起刀落，切下了一块猪肉，递给了最前面的顾客：“给，这是你的。”顾客看着肉，略带不满的说道：“这肉切的啥啊，就这一点瘦肉，你让我回去炼猪油啊？”眼看着两个人要争吵起来，老张看了一眼前面似乎要争吵的二人，发现顾客是邻居刘二姐。刘二姐和陈大妈确实有些矛盾，前些日子的吵架也确实是陈大妈理亏，看来这一次，陈大妈是想扳回一局。“算了，我要还不行！”刘二姐递出钱和粮票，一把拿走猪肉，愤愤离去。轮到老张后，老张满脸堆笑说：“陈大姐最近还好啊？” 无事不起早，陈大妈看老张突然嘘寒问暖，问他：“咋了，是要好一点的肉么？那得看我心情。”老张继续笑着说道：“我家萍萍今天过生日，想做点红烧肉给他庆祝庆祝。” “是萍萍啊！”陈大妈听见这个名字，脸上笑开了花，“这个小姑娘嘴可真甜，来来来，我给她切块好肉。再送你点我做的手擀面，回去给她下个长寿面。” \n\n老张再三推辞后，还是收下了额外的手擀面。他高高兴兴的走进家门。而他的女儿正在客厅写着作业。他抱着女儿，晃了晃手里的面条和五花肉。"
CPC_main_story_events.55.o: "“萍萍，今晚吃红烧肉和长寿面！”"
CPC_main_story_events.56.t: "积极性"
CPC_main_story_events.56.d: "“嘿咻！”插完最后一株禾苗后，老周擦了擦头上的汗，看了看西倾的太阳。整整一天，他和几个村民都在田间劳作，泥水溅得裤脚全是泥巴。他坐到田埂上，掏出烟袋，熟练地将烟草塞进水烟壶，用火柴一点，微微吸了一口，吐出一缕淡淡的烟气。\n\n老周是公社里有名的劳动模范，干活勤恳，手脚麻利，常年田里田外地奔波，这样的稻田对他自然不在话下，但老周心里一直不踏实：田里的活是干完了，可赚的工分却越来越不顶用了，辛苦一年，年底分下来的粮食和收入勉强糊口，供销社收购粮食换的钱，也挣不到几个子。天色渐暗，乡亲们陆续收工回家。老周一边推着车，一边看见公告栏的几个社员在商量些什么，听着断断续续的几个词：“计件工资”、“按劳分配”、“现金发放”。他心里一动，凑了过去。公告栏上贴着《关于农村工资制改革的决定》，落款公章处盖着国防阵线的红章。老周仔细看着决定的内容，听见旁边一位社员自言自语道：“逐步停止使用工分制，改革为粮票与货币工资制。”工资？粮票？也就是说以后在公社里干活和城里工人一样领工资了？老周想着。周边的社员也纷纷议论，畅想着不同以往的未来，老周第一个表态：“我看行！以前干多干少都一样，有时候想多干点都提不起劲儿。要是能按工算钱，挣多少看自己，那干活也更上心！” \n\n春去秋来，村里在收割季节开始施行“计件工资制”，割稻田、扎稻捆都按斤亩数量计算工钱。每亩一元，这个价格在县里也算高的了，公社书记动了很多关系才定下的价格。听到这个消息，老周心里高兴极了，心想今年要是多干几天，挣的钱怕是比往年高不少。收割的日子一到，田间便一派忙碌，社员们的干劲十足，都盯着自己能收多少亩田。原来大家一起收割，照着工分凑人数；但今年不一样了，人人争先恐后，恨不得一天多干几亩。老周更是像吃饱的水牛，没日没夜地干活，天刚亮就下地，天黑后才回家，腰酸背痛也顾不上。多干一亩就是多挣一元，这钱可是实实在在的。\n\n几天后，收割完成了，一簇簇稻捆立在田间，准备装载上车。公社给社员们发了工资，老周把手里的钞票反复数了几遍，脸上笑容止不住，心里甜如灌了蜜。回家的路上，他一边走，一边盘算着今年可以给家里添点新家具，也能给媳妇和儿子买些好布料做新衣服。"
CPC_main_story_events.56.o: "前途的光明需要当下的信心。"
CPC_main_story_events.57.t: "《解放日报：队社结算维护公平分红（节选）》"
CPC_main_story_events.57.d: "咸阳某生产大队在年终结算分红时出现了争议：部分社员发现分红有所遗漏，引发社员们对财务透明、公正分配的广泛关注。在全体社员的参与和当地干部的指导下，通过团结协作，妥善解决了这一事件，为全阵线集体经济做了一回模范标兵。\n\n分红争议引发社员不满\n咸阳某生产大队按惯例进行年终分红。许多社员辛勤劳动了一年，盼望年终的分红能补贴家用。然而，当分配方案公布时，部分社员发现自己的分红与实际不符，甚至有几户社员被遗漏。李姓老社员愤慨地说：“我们辛苦一年，分红可不能含糊！”不少社员对大队财务管理提出质疑，要求公开核算。\n\n成立“核查委员会”维护社员权益\n面对社员的质疑，大队书记王队长高度重视，立即召开全体社员大会，鼓励社员在毛主席“团结，批评，团结”的民主方针下，提出问题、积极讨论。与会社员一致同意成立“核查委员会”来审查账目，确保分红公平。委员会一共十名成员，都是由社员自行选举组成，包括小队长、老社员和懂会计的年轻社员，大家以极大的责任心和热心投入核查工作。\n\n委员会深入调查，查清财务情况\n委员会在生产大队的办公室里连续三天细查账目。委员们团结一致，对每一笔收入、支出、分配逐一核对。经过一丝不苟的审查，委员会发现，财务人员在分配账目上出现了登记疏漏，导致部分社员的分红遗漏。同时，委员会发现个别社员对队社结算制度存在误解，通过耐心解释、公开公示，逐步打消了社员的疑虑。\n\n公开讨论调整方案，社员民主参与\n在澄清财务问题后，委员会贴出公告，公布调查结果，提出补救方案，对遗漏分红的社员进行合理补偿。大会上，负责结算工作的会计向社员们做出检讨，承诺日后不再发生此类问题。委员会还提议，每年在年终结算时增加“公开核算”环节，接受社员监督。社员们对委员会的工作给予了充分的肯定，对来年的劳动展示了更高的热情。"
CPC_main_story_events.57.o: "一位年轻社员说：“只有真正参与监督，我们才对公社有信心。”"
CPC_main_story_events.58.t: "尾巴与先锋"
CPC_main_story_events.58.d: "“你们大队搞的好事！”汤书记正冲着眼前的大队长倾泻怒火，‘割资本主义尾巴’主要是在城市里搞，不是让你们生产大队搞的，你在生产队里干的破事都传到中央了！你把老百姓养的鸡鸭全部抓走干什么？让老百姓饿肚子？让解放军饿肚子吗？”\n\n汤书记的表情逐渐愠怒，平时温和的他现在时不时吐出脏话，大队长的噌亮的光头冒出了细细的汗珠。汤书记斥责得口干舌燥，不得不停下来喝口水，在此间隙，大队长轻声问道，怕再激怒了县委书记：“我看说‘斗资批修’，有些社员平时都热衷于养鸡养鸭，对于大队的集体劳动不上心，我就想……”，“啪”的一声，汤书记重重的把搪瓷水杯掷在桌上，找出报纸给大队长看，上面写着“以粮为纲，农林牧副鱼全面发展”，“这是三个月前就已经在报纸上写过，一周前就在会上说过的事情。就最近城市要‘割尾巴’，你前天就把农民生活的命根子给割了？”书记像看傻子一样看着大队长，“别说了，我跟你回一趟生产队，还有，你生产队队长别当了！”\n\n汤书记和前大队长回到了公社，他能从社员们百感交集的眼神里看出同一种情绪——对前大队长的不满。“同志们，抱歉让你们受苦了，什么‘资本主义尾巴’，我看真正的尾巴是他”，书记用手指了指旁边泄了气的前队长，这个全身上下只剩下光头在闪烁的男人。有些社员看见他吃了瘪的样子，暗自发笑，有的还笑出了声。汤书记让人去队社畜栏里清点损失，社员到时候发现，鸡鸭已经死了约五分之一，有人看见自家养的鸡鸭已经死了，眼泪水夺眶而出。汤书记得知后立刻安慰：“同志们，这狗东西害大家担惊受怕，经营受损了。我向大家保证，以后不会有类似事件发生，毛主席是支持你们的，他老人家才说要支持农副业发展，一周前我们开会也说了要鼓励各个公社生产队因地制宜积极发展农副业。”社员们有的逐渐平复情绪，但依旧不满，问道：“我们今年肉类肯定是要减产了，说这么多有什么用！” “我回向上面申请将你们生产队打造成模范生产队。”汤书记笃定的说，“明明并没有具体的会议决定，可你们早早就养了这么多鸡鸭，为社会主义贡献，我看哪像某些人说道‘资本主义尾巴’，明明是‘社会主义先锋’。未来解放军一定都能吃上你们养的鸡鸭去解放东部。”\n\n毛主席的肯定，汤书记的承诺都让不少社员重拾了信心，又是一番调解和安慰，社员各自回到了岗位，继续为革命而奋斗。"
CPC_main_story_events.58.o: "人为之事，必有缺失。"
CPC_main_story_events.59.t: "辣椒酱背后的故事"
CPC_main_story_events.59.d: "新华社四川采访专稿：\n我是四川刘村的一名普通农民，名叫刘平，家里三代贫农，世代种地。回想起我们村与酱菜厂对接的经历，心中充满了感慨。合作社刚成立的时候，大家的日子过得平淡无奇，平时种的辣椒也卖不上价格，大部分都作为日常的佐料自己吃掉了。\n\n就在这时，生产队刘书记听说县里的酱菜厂正要找优质辣椒。便邀请工厂领导来到我们村，商量如何合作。我记得很清楚，当时刘书记让工厂领导尝了尝我们村的干辣椒，工厂领导连连赞叹，说香味很浓。从那以后，我们村和工厂达成了合同，以一个较高的价格收购我们村的辣椒。县里也派来了农业专家，手把手教我们如何按照他们的要求种植辣椒，避免不必要的浪费。他们还特别强调，辣椒要辣味浓，颜色鲜艳，而且不能有病虫害。\n\n那时，我和村里的一些老农民在专家的帮助下，开始按照规范种植辣椒。社里的每一块田地都是按照要求进行规划，种植的种类、间距、施肥的量，都有了明确的标准。一开始，我们的操作并不熟练，有的人还会因为过度施肥或是缺乏经验而出现问题，幸好专家们定期巡田，及时提供指导。记得我刚开始施肥的时候，不太敢按照专家要求来，怕肥料太多，辣椒长不好，还浪费了肥料。专家郑师傅特意来我家，给我做了示范，告诉我如何合理地使用农家肥，保持土壤的健康。渐渐地，我开始掌握了技巧，辣椒长得比以前更好，颜色鲜亮，辣味香味十足。看到田间地头的辣椒长势喜人，我心想今年可以挣不少钱，再给家里添几件衣裳。辣椒送到工厂后，经过了清洗、切割、发酵、装罐，终于做成了平时能在供销社买到的辣椒酱罐头。记得当初我第一次品尝自己种的辣椒变成的酱料时，觉得十分好吃，味道鲜香麻辣。但最重要的是，工厂收购辣椒的价格远高于供销社的价格，而且每年都能提供稳定的采购量，这让我们心里非常踏实和高兴。\n\n如今，我们村的辣椒不再是自产自销，它已经成了我们村的“钱袋子”。酱菜厂与我们建立了长期稳定的合作关系，每年合同一签，收购问题就解决了。我们的收入也有增加，生活条件改善了，村里人也新建了不少平房。这日渐美好的日子，真是要感谢刘书记，感谢党啊。"
CPC_main_story_events.59.o: "好日子真的在后头！"
CPC_main_story_events.60.t: "《60年代乡村公社的几则记事》"
CPC_main_story_events.60.d: "以下是后世学家整理的，中国西北人民革命时期根据地的农村事例：\n（一）、王大爷每年都依赖供销社的支持。春天一到，村里的农民都会涌向供销社，王大爷也不例外。每年的种子、化肥、农药都由供销社提供，价格合理且物资充足。尽管村里很远离城市，但供销社能够在每个季节准时送达所需商品。有一年，村里发生了旱灾，农作物几乎绝收，王大爷心情沮丧。就在他担心未来几个月的生活时，供销社的工作人员主动找上门，告诉他可以延期支付农资款项，还提供了紧急救济物资，雪中送炭，王大爷深感温暖，对供销社感激不尽。\n\n（二）、四川某镇财政吃紧，但镇上供销社的职能却不断扩展，不仅承担农业用品、工业品的供应，还开始接手教育、医疗等社会事务。供销社开设了几所学校和诊所，投入大量资源进行运营。然而，这些设施不仅没有得到村民的广泛支持，也并未达到预期效果。随着时间推移，供销社的资金流转愈加困难，农民对供销社的依赖却并未增加。农资供应频频出现断货，村里的农民开始抱怨供销社没有做好最基本的职责。供销社的过度包办不仅没有为农民带来实质帮助，反而给镇上的财政带来了沉重的负担。\n\n（三）、周军是某村的年轻农民，经过供销社的帮助，他加入了一个农村合作社。在供销社的协助下，周军和其他农民共同采购了高质量的种子和化肥，并通过合作社集体销售蔬菜，降低了生产成本。供销社不仅提供了资金支持，还定期组织农业技术培训，帮助村民提高种植水平。\n在供销社的支持下，周军的蔬菜种植效益逐年上升，收入也大幅增长。每次合作社的销售额上涨，周军都会感慨：“供销社是我们农民的好朋友，没有它，生活没法变得这么好。”"
CPC_main_story_events.60.o: "诸事功过是非，自有后人评说。"
CPC_main_story_events.61.t: "西南局报告"
CPC_main_story_events.61.d: "※※※绝密※※※\n\n党中央：西康党委总体上遵循中央与刘文辉先生为康区发展拟定的八字方针：“民族自治、联络藏区”。经驻康党组织各负责同志的不懈努力，已基本稳定当地少民局势，并开始着手进行有计划的社会主义改造，改造工作总体平稳顺利。\n\n在民主改革过程中，由范明同志领导的康藏工委主动开展西藏噶厦政权的统战工作，推广党中央和平解放西藏的方针，然而噶厦当局达赖喇嘛拒不接受阵线的和平提议，多次在往来信函中表达了藏独分裂的危险思想，还妄称西藏自古皆是受菩萨保佑的独立“佛国”，与中国互不隶属。\n\n我们并没有放弃争取西藏内部政教高层支持者的可能性，通过长期联系我们逐渐了解到，西藏内部的活佛世系主要分为达赖、班禅两大世系，达赖是前藏之主，班禅是后藏之主。达赖班禅在全体蒙藏僧侣中，俱占有最高上的地位。凡是西藏佛教之寺院，无论在藏，在康，在青，在甘，在蒙古，在内地，皆由达赖所管辖，皆以达赖为主人。班禅大师在教务方面的地位，除开达赖一人以外唯他最高，但是他对于各寺院之主权，则没有达赖那样大。\n\n民国十二年，班禅世系与达赖世系便有龃龉，九世班禅逃离藏地，来到兰州，接受北洋政府的保护，从此就逗留在汉地，一直到1937年去世。而十三世达赖喇嘛已经在1933年底逝世。藏传佛教两位最高领袖之间的不和，由他们身边的人继承了下来，两大世系争端持续至今已经严重到几乎要分裂西藏的地步。达赖喇嘛所在的拉萨，在摄政和噶厦领导下，继续着十三世达赖喇嘛的方略，试图脱离中国的影响；十世班禅久居汉地，和汉人保持良好的关系，他身边的人组成班禅行辕拥戴着班禅，努力要维护班禅喇嘛在藏地的政教地位，为此积极地拥护中央的和平统一政策。\n\n在达赖集团借助日本力量四处扩张领土后，班禅行辕对此感到十分不满，已派人跟我方进行接触，表示愿意提供一切帮助。因此驻康党组织向党中央提出建议：应抓紧机会联系班禅代表，为尽快解放西藏做充分准备。"
CPC_main_story_events.61.o: "西南局李韩 电"
CPC_main_story_events.62.t: "班禅密信"
CPC_main_story_events.62.d: "国防阵线西北中央人民政府主席毛、中国人民解放军总司令朱钧鉴：\n钧座以大智大勇之略，成救国救民之业，义师所至，人民腾欢。班禅世受国恩，备荷优崇。二十余年来，为了西藏领土主权之完整，呼吁奔走，未尝稍懈。第以未获结果，良用疚心。兹幸在钧座领导之下，西北已获解放，边民同声欢忭。今后人民之康乐有期，国家之复兴可待。即久被忽视之西藏人民，亦莫不引领而望，卜庆来苏。仍垦领导义师，解放西藏，肃清叛国分子，拯救西藏人民。班禅谨代表全藏同胞，向钧座致崇高之敬意，并矢诚拥护爱戴之忱。\n班禅额尔德尼叩\n\n复电：\n接读先生来电，甚为欣慰。西藏人民是爱祖国而反对外国侵略的，他们不满意拉萨反动政府的政策，而愿意成为统一的富强的各民族平等合作的民主新中国的一分子。中国国防阵线和中国人民解放军必能满足西藏人民的这个愿望。希望先生和全西藏爱国人士一致努力，为西藏的解放和汉藏人民的团结而奋斗。"
CPC_main_story_events.62.o: "西藏的解放道路更进一步。"
CPC_main_story_events.63.t: "活佛返乡"
CPC_main_story_events.63.d: "巴颜喀拉与祁连，这两座巍峨的山脉，自古便是探险家心中的噩梦。它们蜿蜒曲折，险峻无比，但如今，在这两座山脉之间，一条长长的“黑线”已经悄然出现，通往遥远的西安：这是四川解放后，西南兵团历经艰险，沟通天堑修建的西成铁路。\n\n从火车窗户边一窥，就能看到沿线全副武装的解放军战士在执行守卫工作。班禅此时也不过是个二三十岁的年轻人，他还难以揣摩国防阵线为何要以如此阵仗来招待他，而他邻座上的翻译平措汪杰则满面春光地侧过头来说道：“尊者，这次中央动用了最高规格来接待我们，看得出毛主席他们很重视我们。”班禅闻言只是一笑，表面俨然是圣洁姿态，只是心跳不由得开始快了几拍。\n\n很快，到达西安站后，他就看到了路边红旗招展熙熙攘攘的欢迎人群，每三个路灯就要挂上汉藏团结、欢迎班禅、祖国统一等类的标语。现场气氛是空前的热烈，却越发让班禅感到有些紧张。\n\n简短的欢迎会后，班禅便立刻被送到了西安人民政府会议厅，毛泽东，周恩来，刘少奇，朱德，李富春…一众中共元老早已在此恭候多时。毛主席率先开口寒暄道：“大师身体可好？路途遥远，这些日子没受委屈吧，我们条件差，如有冒犯还请您海涵喽。”\n\n“没有没有，我对中央的招待完全满意，甚至觉得西北人民太热情了。今天主席特别到这里来，对我们很关心，我们特别感谢。”\n\n“你们今天第一次来，我这个地主自然要尽一份地主之谊，要是土皇帝似的摆架子，那他们还有你们这些人就要斗我这个地主喽！”"
CPC_main_story_events.63.o: "会议厅里充满了快活的空气。"
CPC_main_story_events.64.t: "中国人民决不允许帝国主义侵略西藏"
CPC_main_story_events.64.d: "※※※原文全文刊载于解放日报头版※※※\n\n近期以来西藏地方当局在中国边境制造的一系列反革命摩擦，是在日本帝国主义及其追随者东印度政府策划下发生的。日本帝国主义者勾结拉萨集团举行这种分裂活动，其根本目的在于诱使西藏脱离祖国母亲的怀抱，变成泛亚主义侵略者的又一块殖民地，剥夺西藏人民的自由与独立，让藏民变成日本人的奴隶。中国人民对于日、印侵略者与拉萨集团的侵略活动早已予以密切注意，而且深深地记取了他们这种与中华民族为敌的罪行。\n\n西藏是中国的领土，西藏民族加入中国各民族的大家庭，与汉族及中国境内其他民族发生兄弟的关系，已有悠久的历史。中国的任何少数民族与汉族人民的分裂，必将沦为帝国主义国家的殖民地奴隶，西藏人民是决不愿做殖民地奴隶的，他们在一八八七年和一九○四年两次英勇抗击英帝国主义的侵略，就是最好的证明。从西藏内部来说，拉萨集团罔顾全民族利益，依附于日本帝国主义，伪借达赖的名义推行分裂运动，制造出一件件流血事件，肆意镇压反对分裂的爱国群众，已成为全中国人民的公敌。西藏人民要的是成为民主新中国大家庭的一员，不是泛亚主义的殖民地。要的是中国共产党推行的民族自治，而不是分裂独立。\n\n西藏是中国的领土，绝不容许任何外国侵略；西藏人民是中国人民的一个不可分离的组成部分，绝不容许任何外国分割。最近人民解放军在新疆、西南的进军，受到各地少数民族的热烈欢迎，军行所至，欢声夹道，更充分的表现了中国共产党对少数民族政策的正确和解放军执行政策的纪律优良。久受帝国主义与噶厦反动派奴役的西藏人民和西藏少数民族应该团结起来，揭穿帝国主义侵略者的阴谋，摆脱帝国主义所加于西藏的束缚，准备迎接人民解放军进军西藏，解放西藏，解放全中国。"
CPC_main_story_events.64.o: "向高原进军。"
CPC_main_story_events.65.t: "壶口寒风"
CPC_main_story_events.65.d: "奔腾汹涌的壶口黄河水没能给傅作义老朽干瘪的躯壳注入活力，他早就心如死灰，坐在软轿上围紧一层毛毯，只觉得流水搅动起冷风寒彻透骨。\n\n跟在旁边的政府随员要时刻准备接受老主席琐碎的提问。诸如：今年气候如何，水汛丰不丰满，麦子打下多少，南京又派来多少趟“慰问”等等看似关注异常，却又无心挂念的问题。在傅作义看来，自己的质询无疑是统治牢固的象征，可是周围人早已习惯于糊弄这个耳聋眼花的孤寡老头。\n\n傅冬菊无奈地劝道：“爸爸，少说点话吧，话说多了伤神。”\n\n傅作义似乎早有预感般抬起头望了女儿一眼：“我家闺女私底下在做什么我还是多少知道一点的……”他压低了话音：“我不问他们，他们就要来问你了。”\n\n傅冬菊明白老父亲的意思，也就不再言语，只是心事重重地看着壶口浊流奔腾而下。\n\n傅作义浑浊的双眼里直直映出山陕两地的万顷沟壑，幽幽叹了口气。"
CPC_main_story_events.65.o: "“以前冬天还没这么冷呢……”"
