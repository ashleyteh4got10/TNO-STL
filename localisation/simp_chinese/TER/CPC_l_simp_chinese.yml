CPC_PLA_issue_1: "长夜孤星"
CPC_PLA_issue_1_tt: "£CPC_idea_texticon_PLA_dummy_1\n\n\n£CPC_texticon §R党政建设状况§!\n每日政治点数获得：[?CPC.CPC_PLA_political_power_gain|2+]\n组织度恢复：[?CPC.CPC_PLA_army_org_regain|2+=%]\n军队职业度每月变化：[?CPC.CPC_PLA_army_professionalism_monthly_rate|2+]\n组织度上限：[?CPC.CPC_PLA_army_morale_factor|2+=%]\n\n£TER_texticon_PLA §R指挥架构状况§!\n指挥点数增长：[?CPC.CPC_PLA_command_power_gain|1+]\n指挥点数上限：[?CPC.CPC_PLA_max_command_power|1+]\n部队经验增长：[?CPC.CPC_PLA_experience_gain_army_unit_factor|2+=%]\n部队经验损失：[?CPC.CPC_PLA_experience_loss_factor|2-=%]\n战斗宽度：[?CPC.CPC_PLA_combat_width_factor|2-=%]\n增援率：[?CPC.CPC_PLA_land_reinforce_rate|2+=%]\n\n£TER_texticon_NDF §R武器装备状况§!\n部队攻防：[?CPC.CPC_PLA_army_ad_factor|2+=%]\n单位速度：[?CPC.CPC_PLA_army_speed_factor|2+=%]\n补给效率：[?CPC.CPC_PLA_supply_factor|2+=%]\n部队突破：[?CPC.CPC_PLA_breakthrough_factor|2+=%]\n单位训练时间：[?CPC.CPC_PLA_training_time_factor|2-=%]\n\n[CPC.GetFlag]§m国防研究院§!\n科研项目年支出：[?CPC.CPC_NADT_modifier_misc_costs_modifier|-3=]B\n研究速度：[?CPC.CPC_NADT_research_speed_factor|+2=%]\n所有飞行器制造花费：[?CPC.CPC_PLAAF_dummy_num|-=%]\n步兵装备生产花费：[?CPC.CPC_PLA_inf_equip_dummy_num|-=%]\n步兵装备可靠性：[?CPC.CPC_PLA_inf_equip_dummy_num|+=%]"
CPC_PLA_issue_1_desc: "长夜漫漫，一颗孤星托北斗。\n\n红旗屹立西北十五年，是人民解放军支撑起了国防阵线的脊梁，誓死捍卫着这中国最后一片自由净土；但漫长而遥遥无期的备战消磨着解放军士兵们仅存不多的希望，我们的军队正在经历一场从信仰到能力的危机：武器军需短缺、官兵思想滑坡、技战术水平下降、战争理论落后——只有尽快采取积极手段扭转局面，这支人民军队才能免于沉沦，成长为足以抵御侵略者铁蹄的一支雄师劲旅。"
CPC_PLA_issue_2: "试缚苍龙"
CPC_PLA_issue_2_tt: "£CPC_idea_texticon_PLA_dummy_2\n\n\n£CPC_texticon §R党政建设状况§!\n每日政治点数获得：[?CPC.CPC_PLA_political_power_gain|2+]\n组织度恢复：[?CPC.CPC_PLA_army_org_regain|2+=%]\n军队职业度每月变化：[?CPC.CPC_PLA_army_professionalism_monthly_rate|2+]\n组织度上限：[?CPC.CPC_PLA_army_morale_factor|2+=%]\n\n£TER_texticon_PLA §R指挥架构状况§!\n指挥点数增长：[?CPC.CPC_PLA_command_power_gain|1+]\n指挥点数上限：[?CPC.CPC_PLA_max_command_power|1+]\n部队经验增长：[?CPC.CPC_PLA_experience_gain_army_unit_factor|2+=%]\n部队经验损失：[?CPC.CPC_PLA_experience_loss_factor|2-=%]\n战斗宽度：[?CPC.CPC_PLA_combat_width_factor|2-=%]\n增援率：[?CPC.CPC_PLA_land_reinforce_rate|2+=%]\n\n£TER_texticon_NDF §R武器装备状况§!\n部队攻防：[?CPC.CPC_PLA_army_ad_factor|2+=%]\n单位速度：[?CPC.CPC_PLA_army_speed_factor|2+=%]\n补给效率：[?CPC.CPC_PLA_supply_factor|2+=%]\n部队突破：[?CPC.CPC_PLA_breakthrough_factor|2+=%]\n单位训练时间：[?CPC.CPC_PLA_training_time_factor|2-=%]\n\n[CPC.GetFlag]§m国防研究院§!\n科研项目年支出：[?CPC.CPC_NADT_modifier_misc_costs_modifier|-3=]B\n研究速度：[?CPC.CPC_NADT_research_speed_factor|+2=%]\n所有飞行器制造花费：[?CPC.CPC_PLAAF_dummy_num|-=%]\n步兵装备生产花费：[?CPC.CPC_PLA_inf_equip_dummy_num|-=%]\n步兵装备可靠性：[?CPC.CPC_PLA_inf_equip_dummy_num|+=%]"
CPC_PLA_issue_2_desc: "历经六十年代以来诸多战事，我军已经一扫颓靡之势，尤其是在完成部队军事改革后，解放军正在朝着一支具有高组织，高士气，高战斗力的新型军队方向大踏步前进。\n\n在党的绝对领导下，人民军队在指挥上实现了高度的集中统一，在思想上建立了高度的阶级觉悟，他们将完全执行党中央制定的革命路线，在广大人民群众的支持下，完成解放全中国的伟大任务。用手中紧握的钢枪，消灭盘踞中国的日本帝国主义侵略者。就如毛泽东主席那句诗一样：长缨在手，缚住苍龙！"
CPC_PLA_issue_3: "赤勇精锋"
CPC_PLA_issue_3_tt: "£CPC_idea_texticon_PLA_dummy_2\n\n\n£CPC_texticon §R党政建设状况§!\n每日政治点数获得：[?CPC.CPC_PLA_political_power_gain|2+]\n组织度恢复：[?CPC.CPC_PLA_army_org_regain|2+=%]\n军队职业度每月变化：[?CPC.CPC_PLA_army_professionalism_monthly_rate|2+]\n组织度上限：[?CPC.CPC_PLA_army_morale_factor|2+=%]\n\n£TER_texticon_PLA §R指挥架构状况§!\n指挥点数增长：[?CPC.CPC_PLA_command_power_gain|1+]\n指挥点数上限：[?CPC.CPC_PLA_max_command_power|1+]\n部队经验增长：[?CPC.CPC_PLA_experience_gain_army_unit_factor|2+=%]\n部队经验损失：[?CPC.CPC_PLA_experience_loss_factor|2-=%]\n战斗宽度：[?CPC.CPC_PLA_combat_width_factor|2-=%]\n增援率：[?CPC.CPC_PLA_land_reinforce_rate|2+=%]\n\n£TER_texticon_NDF §R武器装备状况§!\n部队攻防：[?CPC.CPC_PLA_army_ad_factor|2+=%]\n单位速度：[?CPC.CPC_PLA_army_speed_factor|2+=%]\n补给效率：[?CPC.CPC_PLA_supply_factor|2+=%]\n部队突破：[?CPC.CPC_PLA_breakthrough_factor|2+=%]\n单位训练时间：[?CPC.CPC_PLA_training_time_factor|2-=%]\n\n[CPC.GetFlag]§m国防研究院§!\n科研项目年支出：[?CPC.CPC_NADT_modifier_misc_costs_modifier|-3=]B\n研究速度：[?CPC.CPC_NADT_research_speed_factor|+2=%]\n所有飞行器制造花费：[?CPC.CPC_PLAAF_dummy_num|-=%]\n步兵装备生产花费：[?CPC.CPC_PLA_inf_equip_dummy_num|-=%]\n步兵装备可靠性：[?CPC.CPC_PLA_inf_equip_dummy_num|+=%]"
CPC_PLA_issue_3_desc: "这是一支从人民解放战争洪流中得胜凯旋的伟大军队——他们自西北巍峨群山中涌出，如一把把锋利的钢刀刺穿日伪的漆黑心脏，完成了解放全中国的宏愿。\n\n现在的人民军队，气势如虹，却也任重道远：他们必将面临§m现代化§!提出的全新挑战，必将在未来承担起§G解放台湾、解放朝鲜§!、§S解放全东亚§!乃至§C解放全人类§!的神圣使命。唯有胸怀满腔赤诚，方可在未来征程中坚定方向，夺得胜利。"
CPC_non_exsistent_air_force: "长空折翼"
CPC_non_exsistent_air_force_2: "雏鹰展翅"
CPC_NADT_modifier: "国防研究院"
CPC_AT_gov_issue_idea: "雏凤有栖"
CPC_AT_gov_issue_idea_desc: "萧瑟秋风今又是，换了人间。\n\n人民政府刚刚成立，既带来人民民主专政的希望，也面临着诸多挑战。我们需积极推进新解放区改革，加强政府机关建设，以赢取人民群众的信任，从而为中国的独立、民主、和平、统一和富强而奋斗。"
CPC_AT_party_issue_idea: "火热如歌"
CPC_AT_party_issue_idea_desc: "取来烈火千万炬，这黑暗世界，化作尘烟。\n\n昔日西北的红星已然照破赤县的长夜，我们曾经的愿景已经实现。然而，革命事业仍未结束，誓为共产主义奋斗终身的我们，要下定决心，不怕牺牲，排除万难，去争取新的胜利！"
CPC_AT_eco_issue_idea: "苍流不舍"
CPC_AT_eco_issue_idea_tt: "§S解放后§!，我们的所有§G社会发展度§!相较于§G根据地时代§!§e恶化§!了§Y1级§!"
CPC_AT_eco_issue_idea_desc: "城池百战后，耆旧几家残。\n\n战事平定，国内经济状况满目疮痍。大量国民党反动派残余势力仍旧贼心不死，新解放区的土地改革尚未完成，诸多工业区受破坏严重…我们必须取消帝国主义国家在中国的一切特权,没收官僚资本归人民的国家所有，有步骤地将封建半封建的土地所有制改变为农民的土地所有制，发展新民主主义的人民经济，稳步地使新中国成为工业强国。"
CPC_AT_ANRL_issue_idea: "厚载同乘"
CPC_AT_ANRL_issue_idea_desc: "地势坤，君子以厚德载物。\n\n作为一个新生的反帝阵营，亚洲民族革命联盟誓要带领东亚各国民众走出一条平等、自由、发展、合作、共赢的独特道路。然而，已然日薄西山的共荣圈仍旧以“泛亚”的名义压迫着若干尚待解放的人民，甚至继续谋划着下一轮的对抗。我们将继续互相帮助，团结一致，积极援助各国的反帝力量，为实现亚洲民族的完全解放而战！"


