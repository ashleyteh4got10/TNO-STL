 ###内阁部长
CPC_Zhu_De: "朱德"
CPC_Zhou_Enlai: "周恩来"
CPC_Zhou_Enlai_hog_desc: "§Y政务委员会总理\n$communist_bolshevism_subtype$§!\n§Y无言苍鹰§!\n§F------------§!\n§L如果说中国共产党是一个蹒跚学步的婴儿，那么周恩来就是含辛茹苦把婴儿抚养成人的慈母。\n\n1898年，周恩来出生在江南地区一个士绅家庭，幼儿时期被过继给膝下无子的叔父，后跟随叔父跨过半个中国定居在北方。由于家境优越和开放，周恩来在童年接受了“新学”教育，包括几何、地理、哲学等等新学科，使他张开了蒙昧的双眼。和许多同时代的新式知识分子一样，周恩来受到了共产主义这种新思想的感召，成为了忠实的信众。五四运动后，周恩来远渡重洋到法国勤工俭学，加入了中国旅欧共产主义小组。中国共产党成立时，周恩来也位列创始地方小组之一。自参加革命三十年间，北伐时期的政治部主任、领导上海工人起义、南昌起义再造共和、长征时的军事三人小组、西安事变的谈判谋主、五十年代的第三次国共合作，到处都是他的身影……\n\n周恩来和毛泽东之间的合作，称不上如鱼得水，却是相辅相成。周恩来是一位有原则，有坚守的政治家，为人做事四平八稳。然而每当实用主义的心思作祟一次，周恩来的内心就像丢失了什么一样……§!"
