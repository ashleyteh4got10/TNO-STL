CPC_funni.2.t: "城头变幻大王旗"
CPC_funni.2.d: "市民们争相购买着国防阵线的蓝红金星旗，准备为解放城市的英雄喝彩，他们洋溢着笑容，为未来的自由解放兴奋。而在台湾的某个宅邸里，奸商霍子文也洋溢着笑容，为自己感到得意。\n霍子文出身富贵，几年前赴日留学，进修经济。或许是因为出生商贾之家，霍子文在经济学上展现出惊人的天赋，不仅理论卓越，实战经验也极其丰富。为补贴生活但又不想去打零工，霍子文选择去炒股，学术的专业和商贾的敏锐让他在股票市场大杀四方，在同学周围形成一股潮流——只要跟着霍子文炒股，那大概稳赚不赔。直到安田危机，为了在股票赤字中及时止损，霍子文卖出全部股票，等待市场稳定的一天。而特高课也在此时敲响房门：特高课正在按照政府的要求，逮捕“非法“抛售股票者，那些财阀他们自然不敢得罪，但普通人就倒霉了，霍子文便是其中之一。霍子文被没收了所有“非法所得”，然后遣返中国。\n\n但好在家境殷实，霍子文重整旗鼓。依靠着家庭的支持、自己的才华以及政界的关系，在武汉利用信息差低买高卖，再赚一笔。当武汉爆发起义、解放军东出潼关、国府颁发戡乱动员令的时候，霍子文不慌不忙，先是打电话让家人到台湾避险，然后订购了两批旗帜——一批青天白日，一批蓝红金星。当解放军势如破竹的消息传到武汉时，他将手底下的蓝红金星旗卖给店铺商贩，再让他们在卖给普通群众，就这样，霍子文再赚一笔。之后，他贿赂守在关卡的市民军，乘着时局混乱，带着金银细软离开武汉，向南方奔去。\n\n到达广东国的边界后，不少人恐慌地在海关前等待，海关内的广东国部队高喊着维持秩序，但海关外的人群仍然恐慌，想要通过封锁。霍子文看见有几个人在同海关人员交谈几句后，便通过了哨卡，于是他也准备去试试。他从包里拿出护照，夹上三万日元，穿过拥挤的人群，将护照递给海关。海关检查了护照——但重点数了数多少日元，然后瞅了瞅霍子文。霍子文尬笑着从怀里掏出一面青天白日旗，以及递上自己的国民党党证。海关把钱悄悄塞进兜里，还回护照，示意他赶紧过关。\n“嗨噫！”带着喜悦的日语脱口而出，霍子文成功过关，但步伐匆匆。广东国并非最后的终点，他继续南下，到达香港，又是一通操作，便乘上一艘驶往台湾的货轮，悠然离去。到台湾同家人团聚后，他在宅邸门口立起一面日之丸旗。"
CPC_funni.2.o: "有奶便是娘。"
