CPC_RBM_dummy_1: "雷填雨冥"
CPC_RBM_dummy_1_desc: "封锁引发急躁，急躁导致冒进，冒进造成背叛，山雨欲来风满楼。五年发展计划的一地鸡毛将共产党人拉回现实，听风是雨的反动派也变本加厉地对根据地里外夹攻。只有捋顺轻重缓急，亡羊补牢，方可重整旗鼓，带领根据地走出阴霾。"
CPC_RBM_dummy_2: "东方欲晓"
CPC_RBM_dummy_2_desc: "蒙疆川渝得以解放，陕甘宁青展开建设；在数年的苦心经营后，根据地的革命事业枯木逢春，日新月异。道路是曲折的，前途是光明的。在全阵线的共同努力之下，我们终于看见了漫漫长路的熹微晨光。知错能改，善莫大焉。现在，根据地已平复如故，但仍需小心谨慎、夕惕朝乾。"
CPC_RBM_dummy_3: "万众康乐"
CPC_RBM_dummy_3_desc: "随着工业化、集体化的稳步推进，流水线代替了手工，拖拉机代替了耕牛，根据地日新月异，大步向前。我们完全消散了跃进的阴霾，重拾了阔步的信心，积累了革命的力量。解放全国已不再是口号，而是可以实现的目标！根据地今非昔比，日月将换新天。"
