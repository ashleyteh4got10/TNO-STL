CPC_red_star_in_rev_base: "赤县红星"
CPC_red_star_in_rev_base_tt: "£CPC_idea_texticon_red_star_in_rev_base\n\n\n£CPC_texticon §R党代会§!\n党员总供需比：[?CPC.TER_NCCPC_PTMB_num_pct|G2%]\n每日政治点数获得：[?CPC.CPC_NCCPC_political_power_gain|+2]\n稳定度：[?CPC.CPC_NCCPC_stability_factor|+=%]\n战争支持度：[?CPC.CPC_NCCPC_war_support_factor|+=%]\n生产效率保持：[?CPC.CPC_NCCPC_line_change_production_efficiency_factor|+=%]\n建造速度：[?CPC.CPC_NCCPC_production_speed_buildings_factor|+=%]\n生产效率上限：[?CPC.CPC_NCCPC_production_factory_max_efficiency_factor|+=%]\n生产效率增长：[?CPC.CPC_NCCPC_production_factory_efficiency_gain_factor|+=%]\nGDP增长率：[?CPC.CPC_NCCPC_add_to_GDP_growth|+][TER_GDP_present_from_NCCPC]\n\n£CPC_texticon §R中央西北局§![CPC_red_star_in_rev_base_NWB]\n\n£CPC_texticon §R西南局§![CPC_red_star_in_rev_base_SWB]\n\n£CPC_texticon §R新疆局§![CPC_red_star_in_rev_base_XJB]\n\n£CPC_texticon §R华南局§![CPC_red_star_in_rev_base_SCB]\n--------------\n以上§Y修正§!均为§Y理论值§!，乘算§Y党员供需比§!后为§Y实际值§!。"
CPC_red_star_in_rev_base_desc: "长夜漫漫，赤县神州，唯余红星一点，希图点亮众生夙愿——那红星就是我们，就是中国共产党。\n\n入党之时，我们发下宏愿，要将自己微小的光芒洒向四方：我们深入群众，传播革命火种；我们动员人民，反抗侵略压迫；我们组织民众，发展生产建设。\n\n我们愿意相信，我们始终相信，我们必须相信：无垠的黑暗终会被黎明的红光驱散，届时赤色的霞光将把每一寸土地都照亮，红旗也会迎着温暖的太阳自东方升起。"
