CPC_main_story_events.66.t: "琼州请示"
CPC_main_story_events.66.d: "※※※绝密，电报原文抄送至外交部及统战部各负责同志※※※\n\n党中央各负责同志：\n\n自我支部转入地下工作至今已二十年余，支部工作目前运转正常，敌日本官僚在我支部精心伪装和欺骗下对海南已经放下戒心，现简要介绍我支部在海南经营状况。\n\n以“海南地方维持会”为伪装衣，在海南省政府唐生明主席的配合下，我支部已在东南亚地区培植起范围极广的情报网络和秘密贸易线路，几乎所有东南亚国家甚至驻菲律宾美军部队都与我支部保持着良好的民间经贸关系。此外，我支部正与越南、缅甸、柬埔寨地区的本土抗日势力保持联系，并暗中为他们提供支援，其中缅甸的克钦人民军已积蓄起足够的力量，只待举起义旗向日本帝国主义的走狗迎头痛击。\n\n幸闻党中央已决心打破共荣圈封锁，解放区发展形势喜人，白驹谨代表海南支部全体同志表示祝贺，我们将永远追随党中央的领导，矢志不渝地遵守党中央对东南亚局势的指示。"
