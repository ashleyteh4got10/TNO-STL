CPC_Black_Ops_desc: "解放四川后，日伪的渗透破坏行动重新活跃起来，给我党我军我阵线的生产工作带来严重威胁，给人民群众的生命财产安全带来巨大隐患，我们必须坚定信心团结人民群众，发动人民战争。只有这样，我们才能保卫来之不易的胜利果实。"
