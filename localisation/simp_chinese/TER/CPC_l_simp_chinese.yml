CPC_main_story_events.67.t: "战线重建"
CPC_main_story_events.67.d: "已日渐老迈的周恩来大概不会想到，他居然有机会重新建立地下战线——看着忙碌的电报室，百般复杂的情绪涌上他的心头。\n\n很快，一个中年女人已经站在他身后：“周总理，您找我吗？”\n\n周恩来转回头去：“啊，冬菊同志，来找个地方坐吧，我找一下你的文件。”\n\n俄顷，周恩来抽出两份档案，戴上眼镜。\n\n“想家了吧，来根据地这么多年都没能让你回去和傅将军团聚。”周恩来把文件凑到灯下开始细细研读。而傅冬菊则苦笑着低下头：“嗐，人之常情，如何不想——不过我自认为比起父亲我还是更忠于革命这边的。”\n\n周恩来抬起头：“好了，我也不和你卖关子了：中央秘密指示，地下战线要重新启动，并向我们的东部打入第一个楔子——就是傅将军所在的山西。”\n\n傅冬菊立刻意会：“这是要派我去山西说服父亲吗？”\n\n周恩来摆摆手：“傅将军他……这是我们赶制的计划，中央已经批准执行了。”他把手中的文件交给傅冬菊。\n\n傅冬菊俯下身去阅读文件，沉默良久。\n\n“如何，有困难吗？”"
CPC_main_story_events.67.o: "“冬菊保证完成党中央的任务！”"
CPC_main_story_events.68.t: "中央班禅座谈会记录"
CPC_main_story_events.68.d: "班禅：拉萨把我监禁多年，这一次西藏能够重归祖国母亲怀抱主要是由于毛主席的领导。\n主席：这不是我个人，这是由于共产党的领导，解放军的帮助，同时也是由于你们自己的努力，西藏人民的欢迎而来的。事情要慢慢地来，达赖现在还在拉萨吗？\n班禅：解放军入藏第一天噶厦的人就带着达赖逃到不丹了。\n主席：我们欢迎他回来，可噶厦的人不同意，他们害怕我们，有些人对我们不了解，你们怕拉萨，西藏人怕汉人，总是小的怕大的，这个不奇怪。由于过去汉人的反动统治阶级统治你们压迫你们，造成了不好的影响，所以产生了对汉人害怕，印象不好。因此，我们今后必须很好地多办些好事，才能使西藏人民慢慢相信汉人是帮助他们的，不是搞他们的。这需要我们做好工作，而且长期地做好工作。\n总理：给予藏区高度的自治权是有必要的。这是党中央和毛主席的决定，政务院正在审核批准藏区自治法，对于西藏建设的支援项目已经通过，我们一定不会辜负西藏人民的期望。\n\n随后阵线要员们开始一一发言，班禅渐渐觉得，明明正在开会讨论西藏事宜，而他这位藏地最高领袖之一却在会上几乎要无话可说了，终于当西南局第一书记李富春也结束讲话后，所有人的目光都转向了他。\n\n班禅只得堆着笑意和翻译一同起立：“大家不要看着我嘛，你们不是把藏区的未来安排得井井有条吗。”\n\n短促的沉默后，周恩来不紧不慢地发言了：“大师还有什么意见示下？”\n\n“未来设立西藏自治区我是支持的，但我藏地成千上万信众的信仰，及我藏地佛教传承数百年的法统中央却又如何打算？”\n\n众人彼此对视一眼，仍然是周恩来微笑着发话：“这要取决于大师您了。”\n\n班禅总算明白阵线用意，在众人或期待或警惕的目光中，他苦笑着点点头：“那么我明天就着手准备讲经的讲稿吧……”"
CPC_main_story_events.68.o: "题目就叫：佛教与社会主义。"
CPC_main_story_events.69.t: "神秘来电"
CPC_main_story_events.69.d: "尊敬的毛主席和中共中央：\n\n当你们收到这份电报的时候，世界便进入了一个新的时代，即世界革命的时代。\n毛主席不仅号召世界人民打倒亚洲最大、最凶恶、最残暴的帝国主义势力——日本帝国主义，还以西部中国为阵地，在全印太地区号召民族革命和社会革命。在斗争的烈火中，不仅日帝会崩溃，反动的纳粹帝国主义和假装进步的美帝国主义也将会崩溃，一个没有剥削的自由的世界将会建立起来。\n世世代代受压迫、受奴役、受剥削人们的梦想终将化作现实！舵手毛主席是世界人类唯一的救星！他高举世界革命的红旗，他在领导着我们，胜利一定属于我们。万岁！毛主席！祝毛主席万寿无疆！我们将会看到自由解放的印度四射着耀眼的阳光，东方的阳光必将照亮西方。世界将摆脱一切痛苦、浪费、毁灭和死亡，我们已经进入了这个伟大的时代。\n我们的责任很重大，但我们一定能完成这个任务，因为拥有无限伟力的毛主席还健在！他给我们心里带来太阳的温暖，我们将打碎这肮脏的旧制度。全世界人民注视着我们，因为我们是五亿的印度人民！这五亿人口的国家一旦觉醒，将会产生多么不平凡的力量，不可能做到的事也将会做到！相信人民群众，坚定地前进吧！胜利一定属于我们！\n毛主席万岁！印度的人民民主革命万岁！\n查鲁·马宗达，印共（马列）中央委员会"
CPC_main_story_events.69.o: "印度？马宗达？毛主席……万岁？"
