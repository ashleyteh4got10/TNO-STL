CPC_main_story_events.70.t: "农贸市场"
CPC_main_story_events.70.d: "每个村子的土路上都有不少穿粗麻衣服的农民挑着担子，在漆黑的凌晨里赶路，这时候鸡还没有打鸣。他们赶早去到镇上的农贸市场，想着把担子里的菜先安排好。如果天亮了之后才把菜运过去，位置满了不说，买菜的人还会觉得你的菜不新鲜。\n\n公鸡在一片暗蓝的天里打鸣，一直鸣到了太阳完全升起。\n\n“大宽，大宽，起来跟爷爷一起去买菜去。”\n\n“爷爷，我来了。”\n\n张大宽起来后，跟着他的爷一起往农贸市场走，路上跟见到的邻居打声招呼。\n\n市场大门的那把锁早早被打开，静静挂在铁门杆上。四下里都是人， 有些对着石台子上的菜讲价钱，不愿意讲价钱的立个木板用石灰往木板上写菜价。大宽跟着自己爷爷走进去的时候，正巧看见一只活猪被宰杀，几个光膀子壮汉压着肥猪，屠夫一刀下去给猪放血， 这一刀后大宽在市场只能听见猪叫的声音，慢慢的猪叫声也被人的声音给埋住了。\n\n大宽一回头，就是他爷爷那宽阔的后背，爷爷拎着的布兜里已经放上了几颗白菜，几根大萝卜。爷爷此时正跟卖茄子的讲价钱，大宽望着堆成小山的茄子，觉着它堆得比自己还高。"
CPC_main_story_events.70.o: "菜票三斤，买完回家。"
CPC_main_story_events.71.t: "概念枪？"
CPC_main_story_events.71.d: "研究所里的日本专家一阵叽里咕噜，旗里的书记皱着眉头侧耳听着日语翻译一句一句地翻译。\n\n“那么就是说，咱们从丰和重工的厂房缴获的那些图纸是……那啥……”\n\n日语翻译连忙提醒：“概念枪。”\n\n“哦对，这概念枪又是什么玩意呢？”\n\n又是一阵叽里咕噜。\n\n“首长，这概念枪就是单靠现在的工业水平还造不出来的，就还只是一些图纸阶段的枪。”\n\n“那山下先生，这把枪设计出来是什么时候要投产的？”\n\n日本专家扶了扶眼镜，用非常生涩的中文回答道：“书记先生，生产这把枪……共荣圈……来年……需要。”\n\n书记点点头，若有所思。"
CPC_main_story_events.71.o: "“看来咱阵线得再过个三五年。”"
CPC_main_story_events.72.t: "傅作义之死"
CPC_main_story_events.72.d: "太原省政府今日尽皆缟素，向所有人传递着一个确定无误的消息：傅作义——这位阎锡山之后的晋察绥巨头，山西主人，于本日清晨6时13分在其女傅冬菊、阎锡山嫡系亲信梁化之的注视下于太原家中安然合眼，撒手人寰。\n\n本日午11时23分，傅作义府中置办丧宴，傅冬菊作为傅作义爱女主持丧宴并致悼词，宴后单独邀梁化之于一偏房面谈。\n\n午14时整，山西省政府公布新任政府主席为梁化之，同时举行宣誓就职仪式，但就职仪式上未见傅冬菊出席。同时晋北部队首脑高树勋、黄樵松亦未出席。\n\n午15时，中共中央收到傅冬菊电报，文称：“冬菊已秘密联络高树勋、黄樵松两位爱国将领，他们今天在家父丧宴后便以边境防务为由启程赶回防区。建议中央尽速另派同志前往大同，与之接洽！”"
CPC_main_story_events.72.o: "中央复电：已采纳你的意见，务必保护自身安全。"
CPC_main_story_events.73.t: "猫背上的辣椒面"
CPC_main_story_events.73.d: "聚光灯打在他的脸上，令陈云有些犯困：中央今天要开一次工作会，内容是“公私合营，股权回收”——这是阵线社会主义工业计划的重要一环。陈云撇了撇搪瓷杯的盖子，浓浓的茶香扑鼻而来，茶多酚让他略显困意的眼皮重新振作了起来。“陈主任，与会人员已经到齐了。”秘书凑近到他耳边小声说道。与会者多是四川重庆来的一些民族资本家，有经营制衣厂、制盐厂的轻工业家，也有经营小型冶铁厂的重工业家。“我知道了，那开始吧。”陈云点了点头，将杯中茶水一饮而尽，“各位企业家朋友们，事不宜迟，让我们开始吧。”\n陈云向与会者们简要说明这次会议的目的——解放区工业的社会主义化，也就是川渝地区和根据地其他尚未完成改造的地区要进行产业的集体化，国有化。与会者们面面相觑，不知道是什么好。“集体化，国有化？”有的人小声嘟囔着思考着，但反应快的人已经开始直冒冷汗，暗中流泪了，心想人为刀俎我为鱼肉，自己辛辛苦苦攒下来的基业要被这帮“赤匪”夺走了。“不要这么悲观嘛。”陈云嘴上这么讲，心下却暗自嘲笑着这些资本家的丑态，“大家看这样如何，政府定期从你们手中收购股权，并且支付利息。当然了，我们也不会强买强卖，但生意真要谈不拢，我们收购股权的资金就直接投资建设新厂了。俗话说‘肥水不流外人田’，等新工厂建好后，阵线的物资采购也优先从新建的厂采购，毕竟要回本的嘛。”陈云一次回答了几乎所有关键问题，这便让与会者无法模棱两可。参会的资本家们听罢，也只得纷纷举手表示赞同，想要商讨股权收购的事宜。陈云双手抱拳在嘴前，掩盖着自己压制不住的笑意，暗暗想道：“到底还是主席的法子好用。”\n\n数日前，毛泽东给邓小平和刘少奇讲了一个笑话——\n毛：“你们想想看，怎样让一只猫吃掉辣椒面？”\n刘：“这简单，把辣椒包在鱼里面骗它吃下去。”\n毛：“再想想，还有更好的办法。”\n邓：“掰开猫的嘴直接灌就行了。”\n毛：“都不是，是把辣椒面涂抹在猫的背脊上。”\n刘和邓：“这是作甚？”\n毛泽东向两人凑近说道："
CPC_main_story_events.73.o: "“猫觉得不舒服，当然要去舔咯！”"
CPC_main_story_events.74.t: "用不了的螺帽"
CPC_main_story_events.74.d: "“他妈的，这个螺帽是哪个工厂产的，我拧半天发现这个螺帽是逆时针拧紧的。”维修机床的徐师傅拧了半天的螺帽，发现螺帽的螺纹与原本的是相反的。过去那么多“疑难杂症”都解决过的徐师傅怎么都没想到，问题会出在螺帽上。厂委书记递了一支烟给徐师傅，并帮他点上，说道：“这个螺帽就是我们阵线里头制造的。”听此，徐师傅只觉一阵天旋地转，但也只能默不作声，沉闷地抽着烟。\n\n工业部长陈尔陆正在整理着来自各地的建议和汇报：有改进生产组织模式的，有主张使用新工艺的，但收到最多的建议还是抱怨各工厂零件无法通用的。陈尔陆阅读了一同递上来的分析报告，报告中说：有的工厂是47年之前迁往西安，它们使用民国标准；有的工厂设备是从前苏联地区进口，它们使用苏联标准；还有新近解放的川渝地区的工厂，他们使用的则是日式标准。在阵线解放各地，打通商路之后，各地区产线也自然而然地交织在了一起。如果再不统一标准，那之后的工业生产恐怕会更加混乱。于是陈尔陆邀请工业各部门的专家，一同草拟了一份《生产统一标准方案书》。\n\n在政务委员会的会议上，陈尔陆提出了他的计划书，书中写道：\n现阶段阵线各区域各工厂生产标准不齐全、不完备，造成大量的损失浪费，严重阻碍生产进度。因此我部门建议，尽快统一生产标准，提高生产效率。考虑到阵线大部分有充足生产能力的工业设施以日本标准为主，同时走私进入根据地的设备亦有不少为日式规格，故建议将国防阵线的工业标准统一为日本标准为主，苏联标准为辅。各自侧重于不同生产部门，兼顾各生产线需要，进一步推进革命建设。\n政务委员会审阅后，很快批准通过了该计划书，接着便通告各地工厂，根据生产实际自行改造设备，用以统一标准。\n\n“这个螺帽是哪里来的？”徐师傅问道，自从上次乌龙之后，他便连螺帽的正反也开始在意起来。徐师傅的学徒说，这包螺帽与上次的螺帽是同一家工厂，不过其工艺已经统一了。徐师傅接过螺帽，确认纹路无误后便拧上机床。“这次不错啊，还挺紧凑的。”徐师傅意外到，“标准统一就是好啊，螺纹正反有了保证，公差也对得上咯。”徐师傅让学徒将其他零件拿来，开始修理起眼前的机床。"
CPC_main_story_events.74.o: "车同轨，轴同距，械同构。"
CPC_main_story_events.75.t: "后果"
CPC_main_story_events.75.d: "我们在新疆的政策方针已经彻底惹恼了新疆当地人民，他们纠集起来冲击我们的党组织机关，马仲英将军也几次致信中央表达了不满。\n\n由于驻在地各级干部同志人身安全受到严重威胁，中央决定从新疆撤出大部分驻地党组织。\n\n尽管新疆仍然是我们的后方根据地，但种种迹象表明，新疆人民已不再信任党中央的决策部署。"
CPC_main_story_events.75.o: "我们是否太贪得无厌？"
CPC_diplomacy_front_IND: "中央已经派出§Y印度§!代表团！"
CPC_main_story_events.76.t: "加尔各答一夜"
CPC_main_story_events.76.d: "加尔各答的深夜静谧而黑暗，但宾馆四楼的房间仍然亮着灯，如果顺着灯光的光路溯源，你可能会惊讶于这个小房间拥挤而湿热的环境——一壶粗茶，一张大桌，几把木椅，悬在头上略暗的大灯，以及几位中共访印代表团的代表——这就是陈毅在加尔各答的下塌处。\n\n“陈老总，夜里散会的时候他们提议送我们走空路去德里，明天下午两点就有卡车来接我们到加尔各答机场，听说用的还是美国人的飞机。”秘书抱着一叠文书起身准备出门。\n\n陈毅头也不抬：“这就是国家统一的好处啊，哪像我们出访个印度还怕日本人，要坐好一阵火车和大卡车，屁股都磨疼咯。”话音刚落，大家一块哄笑了起来。\n\n同来的林立果擦把汗，解开扣子，继续埋头书案：“要翻译的东西太多了，我恐怕明天登机之前翻译不完。”\n\n“那就飞机上接着整理，外交方面的事不能图快，要更准确些，更精密些。”陈毅瞥了一眼坐在对面眉头紧锁的林立果，“老虎（林立果小名），我们这些人里属你英语最好，这也是你妈要我们带你来印度的原因——到德里还要讲英语，甚至还要见美国人，你翻译这些东西一定要注意质量，只有你们事前准备充分了，我们这些老头子上去耍嘴皮的时候才管用，主席他们交代给我们的任务才能顺利完成。”\n\n林立果微微点了点头，旋即又投入到整理文书的工作中——"
CPC_main_story_events.76.o: "——而窗外，东方已然出现一抹鱼肚白"
CPC_main_story_events.77.t: "德里之旅"
CPC_main_story_events.77.d: "[IND.GetLeader]率领着一众印度政府要员站在德里机场上等候着那架满载着中共外交使团的波音707停稳，他们的心情都有些复杂：一方面，中国的命运悲惨甚至超过十年前陷于分裂困顿的印度，面对眼前这个志在解放全中国，使中华民族独立自由的团体，他们抱有一种英雄惜英雄般朴素的好感；但另一方面，如其执政党名，国防阵线是一个共产主义政权，他们对印共马列的支持和对争议领土的声索态度同样坚决，不知道这会不会成为两国未来关系的隐疾……\n\n同样心绪混乱的还有一同在德里机场等待中共代表团的美国外交官——在他眼里，东西中国恰似过去的东西印度，都是反日政权与亲日政权对抗——尽管如此，“共产主义者”还是勾起了他一些厌恶的情绪，但既然华盛顿委派自己来到印度的目的是遏制共荣圈向西发展，那么在盟友名单上多添一个中共似乎也不是不能接受……\n\n机舱门缓缓打开，在迎接者们各怀目的的注视下，一个身沉体宽的大汉从门中迈着台阶稳步走下——看来此人便是情报中所提及的陈毅了。\n\n来人面相和善笑容满面，向着[IND.GetLeader]伸出手来。"
CPC_main_story_events.77.o: "“哈喽哈喽，你好你好……”"
CPC_main_story_events.78.t: "胜利的柬埔寨"
CPC_main_story_events.78.d: "铺天盖地的红旗从宿舍窗前飘了过去，但宿舍里的援柬专家老金无心留意。东南亚的高温炽热难耐，老金躺在床上摇着蒲扇，一想起几个月以来在柬埔寨的工作，忍不住就和旁边端着铝盒吃午饭的老谢打开话匣子：“我三次会见农谢，每次谈话都在二十到三十分钟，真是对他一点好印象都没有，也算知道什么叫夜郎自大，和秀臣、胡荣那些正人君子没法比。”\n老谢嘴里还嚼着饭，嘟嘟囔囔：“柬埔寨都解放了，咱们也解放了，马上就能回去了，多想点高兴的。”\n\n“你先听我把话说完，”老金拿蒲扇敲了敲床沿，对老谢打断自己讲话很不满，“第二回我是坐挎子去见他，接送我的是个十五六岁的农村小战士，看样子是个高棉华人。车开到农谢离着几米远的地方，我准备下车，你猜怎么着？”老金翻身从床上支起来，“农谢鼻子一歪，当着我们面骂那个小司机：‘操你妈乡巴佬，给我往前停！’你说他就为了自己少走几步路迎接我们，这么大个首长，用这么难听的话骂小司机，还骂的是华人。”\n\n一听到这，老谢停下手里的勺子，若有所思地说：“我其实不想跟你一块发这些牢骚，但你一提起华人，这件事我真憋不住。”\n“什么事？”\n“有一回我到村里去指导水稻种植，进村就发现有二十几个华人在村子里显得特别扎眼，一眼就知道他们不是村里人。但也是拖家带口，集体挤在村口和牲口棚挨着的场院里。场院没墙，就一圈篱笆，有几个小孩在篱笆门外边不想进去。他们村书记是个尖脑袋满脸褶子的小黑矬子，看我发现那些华人，立马叫民兵拿鞭子把小孩抽了进去。然后把门一插，满脸堆笑把我请进他们的茅屋里去。我问他们场院里是什么人，小黑矬子说是接受改造的柬埔寨旧人，从附近抓来的。我当时心想你旧人就光抓华人，脸上就没藏住露了馅。结果临走时候，那个小黑矬子一脸怪笑来看我，说是给我送行，说着说着眼睛就往我包里录音机上瞟，说村里人都不欢迎华人，他用录音机录下我们的话随时听就行，不然他还得开会递报告才能把我们叫来。摆明了就是勒索我，我想人在矮檐下哪能不低头，只能忍痛割爱，花钱消灾。”\n\n“他凭什么勒索你啊？”“我估计和我看见被关起来的华人有关系，因为自打我露了馅以后，那个村支书身后的民兵就一个个穷凶极恶地盯着我。我那回就一个人去的，生怕他们在半路上给我来个这个。”说罢，老谢用手举起勺子猛地一挥。\n\n话说到这，俩人不敢多想，该吃饭吃饭，该午睡午睡，只等晚上车队接他们回海南。 "
CPC_main_story_events.78.o: "距离产生丑。"
CPC_main_story_events.79.t: "劳资纠纷"
CPC_main_story_events.79.d: "绵阳某纺织厂外，不满的工人们正在聚集，他们高呼着口号，工厂的外墙也贴上了大字报。“李家滚出去！”，“把工厂还给我们！”。厂长李志杰和儿子瑟瑟发抖地躲在工厂某个隔间内，听着厂区外工人的咆哮。李志杰哑巴吃黄连，恨不得连扇自己几个巴掌：两年前为什么开除工人的时候克扣补偿？半年前共产党要收购股权的时候为什么要消极对抗？\n\n厂区外的工人见迟迟无人回应，便用大锤砸开了纺织厂的大门。工纠队长（同样也是共产党员）四处张望，要求工人们一起把李家父子找出来，他找了一张木桌，站在上面演讲：“工友们，李家父子两年前因工厂效益不好开除我们，还不给最基本的补偿。两年前我们党说要收购，他也不接受，继续把工厂当作他的小朝廷。唯他是尊，这不和农村的地主老财一样嘛。我们今天就是要夺厂，让李家父子滚蛋！”小小的工厂内，山呼海啸的附和声此起彼伏，音浪似乎要冲出屋顶，直达天际。“我们把李家父子找出来！”一位工人说道。工人们行动着，一个房间一个房间地寻找李家父子，最终在走廊尽头的一间储藏柜里找到了父子二人。工人们揪住李志杰的衣领，将他从储藏柜中脱出，这位以前对工人大呼小叫的厂长现在看见一副副愤怒的面容，两腿发软差点摔倒。工人们叫嚷着将父子押送到工厂和厂房大门之间的小广场，将一份合同丢在李志杰面前。\n\n李志杰怔怔地看着合同，白纸黑字上分明写着他“自愿”将工厂转让给全体工人！“凭什么要我交出我的家业？”李志杰如此想着，越想越气，恼怒脱口而出：“你们这帮工人，我明天通通让你们下岗，卷铺盖走人！”祸从口出，群情激愤的工人开始围殴李家父子。没过一会儿，李志杰便已经鼻青脸肿，工纠队长和前来平息事态的公安好不容易才让工人停手，把快要奄奄一息的李家父子送往医院。\n\n一些地方党委带着水果前来探望李志杰，明面上安慰，但话里话外都在暗示着工厂所有权转移的事情。听见工厂，李志杰情绪激动，不过这一次不是想着保住私产，而是想着赶紧离开那片是非之地。“我签字，我签字还不行么？”李连杰颤抖着拿过钢笔和印泥，签完合同。来慰问的干部笑着递上去一个信封，说道：“之前工人们有些情绪激动，这点钱留作赔礼，不成敬意。”两天后，成都日报报道了这件事，将其称之为“一场劳资纠纷”。"
CPC_main_story_events.79.o: "劳资纠纷？我看是激烈斗争。"
CPC_main_story_events.80.t: "谈无可谈（1）"
CPC_main_story_events.80.d: "马家军给中共特使安排的会客室从来就没打扫过。满屋陈腐的烟臭味熏坏了谭希林，看着墙上发黑的焦油，不由得一阵反胃。马光援站在窗边想透透气，凛冽的寒风让他裹紧了皮衣。马惇靖努力使自己忘却屋内恶臭，聚精会神地盯着悠闲嗑花生的马敦厚——这名所谓的堂兄第六次负责接见马惇靖使团，并表示马步康又喝醉了，让他们三人等着醒酒。\n\n一行人其实提前定好了预备计划，假如这次拉拢马步康加入平叛队伍的行动失败，计划就会变成现实。但它太过冒险，目前谁都不愿走到那一步，马惇靖还想动用说服机会，说动眼前的堂哥：“前年饥荒，陕西省宁愿自己挨饿把粮食拉出来接济宁夏。人民政府没亏待我们家，也就不会亏待你们家。你也多替家乡着想，何苦一直拖着不让老叔见我们呢？”\n\n听完堂弟的高论，马敦厚嘿嘿笑了：“还教训起我来……实话和你说，找我谈没用。河州是咱们老家，住着那么多叔叔大爷，我一个人说了不算。”\n马光援忍不住了，气愤地问：“你们难道就这样接受中央领导？”\n“对啊，怎么着！”冲着马光援，马敦厚是一点好气都没有。\n\n见此情景，谭希林一语不发，仍旧静静端详墙上的焦油若有所思。突然，门外警卫通报马主席到，只见马步康被两个佣人缓缓抬进屋，眼皮睁不开，嘴里发出稀里糊涂的呜呜声，脑袋胡子拉碴摇来晃去，胳膊、腿像煮烂的面条一点力气使不出来。看他这样子，完全喝昏了头，一句话也讲不出来。马步康进来后，马敦厚也看热闹似的邀请中共代表团来跟老叔提要求。\n\n“都这样了还提什么，”谭希林同样没好气地回敬马敦厚，“让马主席好好休息，我们告辞。”\n\n说罢，手也没握，谭希林就从马步康身旁快步绕了出去。马惇靖和马光援见状，本想再留一下，可看着老谭那快走远的背影也只能追了上去。三个人刚走到楼道口，就听见身后轰然响起呕吐的声音。\n\n这送别的声音，很刺耳，很恶心。"
CPC_main_story_events.80.o: "我们被这酒鬼整整耽误了六天。"
CPC_main_story_events.81.t: "谈无可谈（2）"
CPC_main_story_events.81.d: "马步康横躺在床上不省人事，几个下人娴熟地煎上药罐，预备着给他们的老爷解酒。\n\n卧房外面，从青海赶来的马步瀛急不可耐地要马敦厚做出支持马家军造反的表态。\n\n“是战是和，你得给个准话。兰州丢了不怪你们，现在跟继援一块起兵不算晚。”\n\n“共产党的军队就摆在家门口，我们也不敢轻举妄动。真要惹得他们冲进河州把我们全抓了，咱们马家可是什么家业都留不下来。”\n\n“你怎么这么迟钝？没看见你弟，你儿子都让共匪从兰州撵到青海去了吗？生死攸关，你就想不明白。”\n\n“我弟跑了关我什么事，当年我被我爸赶到河州的时候他帮过我么？全凭我自己在这扎下根。现在让我回去帮他，我没空。”\n\n“那我就跟你摊个牌。”马步瀛在屋子里转了几个圈，经过深思熟虑的他还是把自己取得的成果和盘托出，“你的手下比你聪明，他们都懂得不打共匪就没法活的道理，所以都听命令要去青海。”\n\n“你！”\n\n“贤侄，你就好好陪着你老叔吧，我该去干正事了。”"
CPC_main_story_events.81.o: "这实在亲戚。"
CPC_main_story_events.82.t: "谈无可谈（3）"
CPC_main_story_events.82.d: "军营的夜一直是最安静的，也是最安全的，尤其对不用执勤站岗的人来说。营长宣布了三天后要开拔往青海移动的命令，士兵们收拾了一天行李劳累不堪，回到宿舍倒头就睡，没有睡前闲聊，不到十分钟宿舍里就鼾声一片——这对大宽来说也不例外。\n\n不知道睡了多久，安静突然被打破，响动和点着的灯吵醒了大宽，睡眼蒙眬之时，一把明晃晃的刺刀赫然摆到眼前，让他猛然惊醒，大声喝道：“什么人！”\n\n刚喊出声，枪托就像铁锤一样砸了下来，大宽因为躲避掉下床摔了个半死。\n\n“不许乱动，蹲下！”\n\n趴在地上的大宽抱住头往旁边看了看，两杆三八大盖后面是宿舍里的其他人，他们一律都双手抱头蹲在地上，班长也被堵嘴绑在床上。他已经完全晕了，大脑飞速旋转思考这是发生了什么事。\n\n“看什么呢！”\n\n“三……三八大盖……”\n\n“你胡说八道什么？”\n\n“你手里拿的……”\n\n“这是我们根据地自己造的，什么三八大盖。”\n\n这时，门外传来训话声：“对不住国军兄弟们，让你们吃苦了，我们是解放军。你们长官不想合作，还想勾结叛徒消灭我们，所以不得已提前出手。现在我们要去找你们长官理论了，各位就先委屈几天吧！上锁！”"
CPC_main_story_events.82.o: "想明白了，都想明白了。"
CPC_main_story_events.83.t: "调查团信函"
CPC_main_story_events.83.d: "毛主席并党中央：\n论及我与于光远等调研团同志在蒙古各地区之所见所闻，一言以蔽之：惨不忍睹。\n\n一路上并未见到“风吹草低见牛羊”之古景，反而饿殍遍野，百业废弛，即使是到达首都乌兰巴托，其设施之陈旧、建筑之破败，触目惊心，甚至远不如十年前的西安。\n\n经蒙人党同志介绍，蒙疆伪政权自五十年代起与远东联共中央、图瓦华西列夫斯基所部、蒙人党本土起义武装等势力爆发多次武装冲突。蒙人党同蒙疆历次武装斗争中，以本次蒙古大起义成果最丰。然而，蒙古地区沦于战火已有十年之久，大部分前苏联工业采掘设施被日本拆解运往伪满、伪民国，而德王蒙奸政府对蒙古地区之统治亦颇为残虐暴戾，制造了数百起骇人听闻的惨案。\n\n在蒙人党同志艰苦奋斗下，残存仍有采掘设备的矿点已有约四成复产，但仍然杯水车薪，据介绍，由于日本、伪满伪蒙政权的残酷掠夺，目前蒙古地区总工业产值据估算仅有抗战时期的三分之一，农产品、日常消费品严重匮乏，畜牧业规模据估算较四十年代缩水30%，政府日常运作已经难以为继。\n\n于光远同志撰写的蒙古经济简报已附在信件最后。\n\n盼望中央早日研究，提出妥善应对策略。\n\n此致\n万里"
CPC_main_story_events.83.o: "都不好过……"
CPC_main_story_events.84.t: "紧急会议"
CPC_main_story_events.84.d: "自长征结束后，很多人似乎就再没见过周恩来发火——直到今天。\n\n“我们的工作是哪里出了问题？是我们把蒙古人逼得太紧，还是我们承受不了和谈统一的代价？”带着明显怒气的声音回荡在西安的会议室里，博古、高岗等谈判代表团成员都低着头听训，额头上豆大的冷汗涔涔往下掉。\n\n“既然是全党一致通过的决议，你们应该事先做足准备，有十足把握再出击，弄成今天这样从包头灰头土脸的回来，你们怎么向党中央交代，怎么向毛主席交代？”\n\n旁席上一直沉默的毛泽东此刻却拍了拍他的肩膀：“恩来不要讲了，现在的主要问题还不是追究责任……”他似无悲喜的眼神冷冷扫视了一遍会堂里绷紧后背听训的几十个干部，最后却停在了空无一物的白墙上——像是要把白墙望穿，望到另一个世界，仿佛会谈失败的罪魁祸首藏在那里一样。\n\n“既然和谈失败又想统一蒙古，那就只有一条路可以选了：动武，让我们自己的人到乌兰巴托去。”毛泽东的声音显得很平静，“会上不好做决定，政务院做一个紧急方案投票表决吧。”"
CPC_main_story_events.84.o: "事已至此，无话可说。"
CPC_main_story_events.85.t: "密谈"
CPC_main_story_events.85.d: "跟在邓小平身后，乌兰夫来到了毛泽东位于延安的办公室——十年前，也是在这里，他冲着毛泽东周恩来等人的面，豪气冲天摔了酒碗，誓言前去阴山根据地领导武装革命斗争，十年解放蒙古。\n\n十年之期已到，内蒙古根据地早已旧貌换新颜，尽管还有大量的重建工作需要完成，但根据地里汉蒙各族人民欢送他来延安时留下的笑脸却是真真切切的。\n\n邓小平推开了门：“主席，乌兰夫同志到了。”正在看中国全图的毛泽东倏地回头，满脸笑容地走来：“从蒙古战场回来了一位大英雄。”\n\n他挥挥手示意乌兰夫坐下，但自己却在屋子里慢慢踱起步来：“寒暄的话我就不讲了，包头会谈的进展不算差，已经谈到内蒙古问题了——”\n\n乌兰夫略一思索，便明白了毛泽东的意思：“内人党的工作已经完全完成了，等包头会谈结束，如何处置内人党的后续工作，还请主席示下。”\n\n毛泽东点点头：“我的意思，最好还是把它变成我们党的内蒙支部，不过博古跟你都劝过中央，我们毕竟是跟蒙古同胞坐在了和谈的谈判桌上，不要搞大汉族主义，要搞国际主义云云。我想也有道理，那要不就这样。”他顿了一顿，“先看个人自愿选择，如果没有特别意愿的，就按民族划分，蒙古族就去蒙古帮他们重建，汉族就回来听中央指挥。”\n\n乌兰夫明白，既然主席把话说得这么滴水不漏，那他也就不必再多费心思了——更何况这一方案并非不能接受，他点点头。"
CPC_main_story_events.85.o: "“愿意服从中央安排。”"
CPC_main_story_events.86.t: "急救室外"
CPC_main_story_events.86.d: "来回穿梭的白衣人映衬出走廊内惨兮兮的灯光，陈毅只觉得好像飘然在梦里一样。周恩来病倒了，是吗？他的手不停颤抖，浑身打寒战，两条腿七歪八扭追赶着飞驰驶入急救室的病床。也许医院刚搞完卫生墩湿了地，也许是鞋底打滑，又或许体力不支导致腿软，恰逢这刹住脚的关头，陈毅在急救室前重重地摔了一个大屁墩。只见眼前瞬间被黑幕笼罩，随即便是呼吸急促和胸闷，不知所终。\n\n此时，杨成武受命带着警卫连来负责医院安保，当他走进急救科正看到乱作一团：前来看总理的人前赴后继，院长亲临现场左一个右一个往外赶；护士传递药品仪器，跑来跑去眼花缭乱；体胖身沉的陈毅瘫在人群中央，两名医生蹲跪在两侧使尽吃奶的劲也搀不起来。\n\n解放军开始维持秩序，无关人员或劝离或驱散，为医护人员清理出一条顺畅的通道。又有两名战士去扶起陈毅，院长问要不要进行全身检查，陈毅摆摆手说自己没问题，先集中力量救周恩来。但他终究觉得身体十分难受，四周异常吵闹，于是要辆车把自己送回家。\n\n杨成武扶着陈毅一拐一拐走上车厢，他看出陈毅精神有些恍惚，临行时担心地问：“陈老总，你不去检查一下吗？”\n\n陈毅口不能言，冲杨成武摇摇头，催司机赶紧出发。"
CPC_main_story_events.86.o: "汽车绝尘而去，杨成武还有更重要的事情要做。"
CPC_main_story_events.87.t: "顿悟"
CPC_main_story_events.87.d: "历经两天一夜抢救，急救室外的红灯砰然熄灭，门里走出了疲惫不堪的主治医生，告诉门外的人们一个天大的喜讯——总理脱离生命危险了。尚处在昏迷的周恩来被推进观察病房，邓颖超为了照顾早已住了进去。她不离不弃守候着爱人，等来周恩来的苏醒。看到人生伴侣微启双眸叫自己“小超”的那一刻，眼中满噙幸福泪。\n\n二人的亲密时光转瞬即逝，周恩来精神稍稍恢复就问起了工作上的事，当他得知九大因为自己病倒而被迫中断时，心情瞬间变得十分低落，好像有一块大石头牢牢坠在胸中。给毛主席造成这么大的麻烦，他还不知道自己将被置于何种境地。直到邓颖超说毛主席体谅他的身体，对会议中断没有意见，才使周恩来稍稍宽释。\n\n“就是要给代表们多花几天伙食费了。“邓颖超浅浅地讲了个玩笑，为了让老伴开心一下。\n\n这时间，博古和乔冠华代表外交部前来探望病情，他们是第一批到医院的外人。一站一坐着在病床前寒暄一番，说了几句安慰的话，请总理保重身体等等。周恩来急切地想知道外界情况，他问道：“陈老总怎么没有来？是他送我到医院的。”此话一出，病房中的气氛瞬间冷了下去，原来就在周恩来抢救的第二天，陈毅也被救护车送进急诊，起因是护送周恩来到医院那天摔了大跟头。\n\n面对栽培自己多年的老领导，乔冠华向总理讲出实情：“陈老总颅内出血在家晕倒，是陈老总夫人叫的救护车。”\n\n“他怎么会得这个病？“\n\n博古低下了头不敢回应。乔冠华迟疑一会，本想编个瞎话，可老领导脸上无以复加的真诚和柔情令他难以招架，更何况他哪有在总理面前耍小聪明的本事，乔冠华无计可施只得和盘托出：“送您来医院的那天，陈老总在医院里摔了一个跟头，没有当时检查，没想到……摔出了内伤。”\n\n陈毅的飞来横祸抽空了周恩来躯壳内所有支撑他的力量，只剩无边无际的压力灼烧自己的身体。他惧怕生命易逝，他感到人生无常，猛然间他好像想到了什么，马上做起安排。"
CPC_main_story_events.87.o: "“把小平同志请到这里来。”"
CPC_main_story_events.88.t: "病榻忠言"
CPC_main_story_events.88.d: "邓小平遵守医师规定，套上了素洁的白大褂，轻声迈进了周恩来的病房，走过挡在病床和门口之间的屏风。周恩来身穿蓝白相间的病号服，静静地躺在床上闭目养神。连续一周住院治疗，才终于拿下呼吸机，只是唇上和下巴没法打理，让灰白杂乱的胡须不争气地冒了出来。周恩来的妻子邓颖超站在面向的沙发旁，有一张草稿放在茶几上。邓小平先和邓颖超握手，问了问周恩来的身体状况。\n\n寒暄已毕，周恩来招呼邓小平坐到病床前，又让妻子把那张草稿拿到小平面前：“这是颖超帮我写好的检讨书，麻烦你帮忙修改一下，然后帮我转达给毛主席。”\n\n邓颖超也开口了：“恩来本来想让我改，但是有些话我不好说，还得请你来把把关。\n\n邓小平接过草稿，仔仔细细看了一遍：\n\n“尊敬的毛主席：\n“我向您深刻检讨隐瞒病情的政治错误，并愿意承担会议未能顺利进行的结果。九大期间，会见蒙古代表时，我因身体不适中途退出会场。那时医生为我诊断患有心脏病，并建议我停止工作住院治疗。但是我对自己的病情认识不清，没有从长远发展的角度看待问题，对医生的建议未予以重视，造成今天的意外。考虑到我的身体难以支撑往后的工作，我希望能有一位立场坚定，处事干练的年轻同志接替我的职务。”\n\n读完检讨书的邓小平看到周恩来退休的申请，显得尤为迟疑。他抬头看了看邓颖超期许的微笑，又看了看满目衰容的周恩来，吐出六个字:“多认错，总没错……”话音未落，只听隔壁病房稀里哗啦，茶杯茶碗碎了一地。邓小平往隔壁望了望，无奈地叹了口气——"
CPC_main_story_events.88.o: "“怎么还不把康生挪走？”"
CPC_Kangsheng_go: "§Y康生§!同志§R已无法再胜任工作§!，现已退休。"
CPC_main_story_events.89.t: "秘密交底"
CPC_main_story_events.89.d: "“小平同志，毛主席对你是另眼看待的，你的那些心思，主席一清二楚。所以你一定要多考察主席的意见，挑合适的时候说合适的话，不要让主席失望，因为我可能没法再保你了。”\n\n“林彪，主席就是离不开他，他是高岗的替身。没有他，主席在中央没法立足。可我对林彪太失望了，林彪心里装的全是他自己的事，一点都不关心其他同志。如果继续发展下去，我担心他会干出格的事。”\n\n“江青同志，简直是一头饿狼，在‘要权’这个题目上没完没了，好像进到政治局，把所有工作都抓在自己手里，就能帮到主席。这样太幼稚了。什么一人之下，全是她自己想象的，没有这样工作的。”\n\n“少奇同志我不能随便议论，我只能捡下一等的说。薄一波是个精明人，可手段粗糙，心气太盛。有之前高岗的教训，他绝不会接受另一个类似高岗的同志站在他眼前，他还会继续沿着少奇同志的路走，慢慢改弦易辙——这才是不好办的地方。”\n\n“总理的意思是，我应该更主动一点。”\n\n“不……我不是这个意思。小平，未来的人事变动中，你切记不要急功近利，不要什么事都冲在最前面。你的能力无人出其右，可并不适合站在前线做总指挥。你更应该做好一名救火队员，总要为全党、全军找到一条生路。”\n\n“我明白。”\n\n“薄一波虽然这个样子，但其他人我更没什么好印象。我已经向毛主席推荐由你和薄一波一起处理日常工作，你要保证他能顺利接手。”\n\n“我……不敢打包票。高岗那边我能让仲勋稳住他，但我和一波的关系不算很熟，我尤其怕少奇那边的人和我起冲突。”\n\n“这些话我不能当面和薄一波讲，眼下时局艰难，你一定要劝他们以大局为重。如果实在控制不住局面，去找毛主席。”\n\n“我一定做到。”"
CPC_main_story_events.89.o: "战战兢兢，如临深渊。"
CPC_main_story_events.90.t: "烫手山芋"
CPC_main_story_events.90.d: "自从李立三的检讨和周恩来的意见书摆上毛泽东的桌案后，就被批示不准公开。可世上没有不透风的墙，李立三公然顶撞主席的风言已经到处都是，周恩来上书的消息也不胫而走，人们纷纷猜测信上都写了什么。有的说老迈的周恩来在服软，求毛主席不要清算他；有的说周恩来要给自己找后路，赶紧安享晚年；更有的人好像知道些什么底细，竟然说毛主席年纪大了，不应该继续干了……关于年老体弱的风言风语在空气中飘来飘去，时不时揭开毛泽东的伤疤。\n\n他根本不想承认自己老，他也恨别人说他老。但自那天目送救护车驶离会场后，他终于发现衰老同样也袭击了自己，他错愕地发现如果没人搀扶，自己甚至连独自站立都开始费劲。每当会客室中空无一人，屋门紧闭之时，毛泽东总想强撑着松弛虚胖的身体，靠那两条肌肉萎缩的腿从沙发上站起，结果力气用尽瘫坐在地上爬不起来，随后闷闷不乐陷入深深的自悔，直到服务员发现将他重新架回到沙发上。\n\n这两封文件就像一副夹板狠狠夹住毛泽东，如果再想一想党内一大帮上岁数的老革命，此时若公开检讨中退休的内容，无论同意与否都相当于直接丢下一枚炸弹，把一切都炸翻天——到那时就连林彪也会弃自己而去。想到这，毛泽东又读了一遍李立三的检讨。"
CPC_main_story_events.90.o: "到底该不该放手呢……"
CPC_main_story_events.91.t: "谁是主席？"
CPC_main_story_events.91.d: "会堂中唱票计票的声音此起彼伏，这是国防阵线第二次进行主席换届选举，这一次毛泽东和刘少奇双双退出了候选人的队伍。\n\n经过一个多小时的等待，选举结果最终出炉，大会主持王任重宣布：一位被雪藏许久的忠厚老者成为新一任阵线主席，他就是朱德。\n\n对于这个结果，某几名代表显得有些愕然，明明换届选举是为了干部队伍年轻化，怎么偏偏选了一个更老的上台？可他们不敢多做声张，只有随着其他人一起为新一任阵线主席的当选鼓掌。\n\n朱德拄着一根黑黢黢的拐杖，在毛泽东和刘少奇的注视下颤颤巍巍走到台前。一边有气无力地将两只手一开一合像是在鼓掌，一边微微点头表示与众人一同沉浸在短暂的欢愉之中。而他接下来做出这样的演讲：“不是我朱德贪恋这个位置，实在是同志们一致推举的热情鼓舞着我，为革命事业再度添砖加瓦。”说完，上气不接下气地喘了两下，好像忘词一样呆站着和台下代表们对视。这样的冷场让朱德身后的邓小平脸色瞬间沉了下来，他赶紧朝下边打手势让自己的人带头鼓掌。\n\n在一片掌声的包围下，朱德晃晃悠悠了半晌才缓过来，他再次点了点头从嘴里挤出一句话：“嗯……好……我提名薄一波同志接任政务委员会总理，就这样。”随后走下讲台，一扭一扭回到座位，把自己的身体结结实实放在了椅子面上。"
CPC_main_story_events.91.o: "很快就会一切如常，大概吧。"
CPC_main_story_events.92.t: "谁是主席？"
CPC_main_story_events.92.d: "会堂中唱票计票的声音此起彼伏，这是国防阵线第二次进行主席换届选举，这一次毛泽东和刘少奇双双退出了候选人的队伍。\n\n经过一个多小时的等待，选举结果最终出炉，大会主持白栋才宣布：薄一波同志当选成为新一任阵线主席。\n\n正如五年前刘少奇当选主席那样，主持话音刚落，会堂内的代表们全体起立为新主席报以热烈掌声。就连台上的中央领导，也集体起立祝贺。刘少奇抑制不住兴奋，花白的发梢不停颤抖。在大家看来，似乎薄一波当选是一件理所当然的事情。激动的空气弥漫四溢，此时毛泽东用手碰了碰刘少奇，故意压低嗓门让他歪头附耳上来，然后告诉他：“我腿不好，就不起立了。”\n\n掌声中，身着一袭黑色中山装的薄一波迈步走上讲台，一番对所有人的感谢后发表了一番胜选感言：“阵线的情况有目共睹，未来的任务是艰巨的。大家把票投给我，我一定不会辜负大家的信任，在今后为革命事业竭尽全力，为全中国的解放奋斗到底。”\n\n经薄一波提名，习仲勋同志继任政务委员会总理，接手周恩来的工作。"
CPC_main_story_events.92.o: "很快就会一切如常，大概吧。"
CPC_main_story_events.93.t: "清退令"
CPC_main_story_events.93.d: "方桌前，刘少奇、林彪和邓小平三人讨论着解放军干部的退休任免事宜。\n“难办啊……”林彪从口袋里掏出烟，分别递给刘少奇和邓小平。见林彪主动递烟，刘邓二人便知道军委开会时林彪遇见的困难，刘少奇明知故问道：“老同志们还是不愿意退休？”\n\n林彪弹掉烧尽的烟蒂，干笑两声：“何止不愿意退，我看是想死在岗位上。”一直在抽烟的邓小平接过话茬：“但还是要清退的，恩来现在躺在病床上，毛主席身体也抱恙。毛主席让我们几个讨论退休人选，最后给他过目，然后中央批准即可。”\n\n“我有个主意”林彪说道，“我们少清退些人，然后多拉些年轻人进入军委，掺沙子。这群老同志总不能反对我们让队伍年轻化吧？”刘少奇问道：“那林副主席是希望保留那些人？”林彪拿出提前准备好的名单，说道：“黄克诚和聂荣臻，前者是国防研究院院长，本身不再负责实际军队指挥，让他留任可以稳定研究院的管理；聂荣臻同志则主要负责军队建设和后勤管理，职务关系虽然繁杂但不影响军队的指挥作战，而且他身体状态是所有老干部中最好的。还有部分老同志，也在上面。”然后林彪又拿出另一份名单，是新提拔的一些指挥员：“秦基伟、邱会作、吴法宪，还有其他一些同志，都是可堪一用的将才，能力不错，头脑灵活。”\n\n刘邓二人对提拔名单没有什么意见，但对是否留任老干部同林彪意见相左，刘少奇反对道：“要退一起退，不然很多老同志肯定要继续闹腾。别说军委了，不少基层指挥员更是年老，六七十岁还担任团长的大有人在。如果军委无法做出表率，这些人也会想办法留在军中，到时候肯定会影响战斗指挥。”\n\n“我明白你的意思。”林彪解释道，“基层指战员肯定是要花功夫的清退的，但我说的几个同志确实不影响军队建设，甚至是有好处的。”刘少奇摇摇头说道：“当然有好处，但命令统一的军队才有战斗力，总不能给个别人开后门，这会影响全军的士气，影响清退工作。这一点，林副主席应该比我更清楚吧。”\n\n二人没有进一步争执，而是把目光看向邓小平，邓小平思索一阵，回答道："
CPC_main_story_events.93.o: "“走军委流程开会，听过大家意见再定。”"
CPC_main_story_events.94.t: "归乡之路 - 西安"
CPC_main_story_events.94.d: "杨盈彩做了一个深沉的梦。她趴在母亲的膝上，老屋里点着昏黄的油灯，看不清母亲的脸，只能闻到淡淡的香胰子味。屋里很凉，母亲的身上很暖，她把母亲又多抱紧了几分。\n“娘……我冷。”\n“火已经点起来了，再捱一捱吧。今天的课可还温熟了？学校里怎样？”\n母亲轻轻地抚着她的后背。杨盈彩不记得母亲有问过她这些，不过，本来就只是一场梦。真也好，假也罢，她突然之间不在意了。\n“娘，我过得不好……谁都给我摆脸色。我吃了好多没想过的苦，受了好多奇怪的罪，干了好多我不想干的事情……”\n\n杨盈彩不知道自己为什么要在梦里说这么多。是因为在梦里，所以才敢说出口吗？一种她再熟悉不过的酸楚又涌上鼻尖，要忍耐住，要忍耐住……可是，就是再也忍耐不住了。就让自己哭出来吧，她既不是杨医生，也不是死硬右派分子，只是一个闺中的小女孩，就在此刻任性一会儿也不行吗？\n“娘……”\n往事一件件在眼前浮现，杨盈彩却再不想提。梦总会醒来，不要把时间用来说话吧——她只想在温暖的怀抱里多呆一会，再多呆一会。母亲一句话也不说，只是一直摩挲着她的头顶，一直等到杨盈彩的痛哭慢慢转为呜咽，才轻轻地开口。\n“小彩，你后悔吗？”\n杨盈彩怔怔地抬起头。后悔吗……或许她真的已经彻底后悔过无数次了。后悔自己没能多救下几个人，后悔自己不该在政治上太不小心，但就算错过千遍万遍，她也不会转身离去，因为道路的终点已经近在眼前。\n她像是下定决心似地紧紧闭上眼，最后一滴泪水从眼角滑落下来。\n\n“我不后悔。”\n“果真？”\n“一个新的时代要来了。您没有看到的，我会替您看见。”\n“如此，便好。”母亲的声音里好像含着笑意，“你该出发了。”\n\n杨盈彩突然感觉自己像是被轻推了一下，脚底趔趄，老屋昏黄的灯光霎时明亮起来。那不是灯光，是正午时分的太阳。\n“同志！你没事吧！”\n一个女干部扶住了险些摔倒的杨盈彩。\n“我……我没事。”“你看起来很疲劳……”也许真是太疲劳了。杨盈彩想要伸手揉一揉昏花的眼睛，却发觉自己手上还攥着些东西。红色的封皮，烫金的大字，虽然迟到得太久太久，它还是来到了杨盈彩的手中。\n\n迟到的正义仍是正义。对她也好，对中国也好。"
CPC_main_story_events.94.o: "“我志愿加入中国共产党……”"
CPC_main_story_events.95.t: "油尽灯枯"
CPC_main_story_events.95.d: "罗青长的进言终于打动了毛泽东，同意的批示和否决一样迅捷，飞速传到医院。顾虑甚多的毛泽东，本意不想让周恩来再到处抛头露面。他派去了习仲勋查看病情，进行最后的规劝。但当习仲勋来到病房，看到病床上穿戴整齐的周恩来，就自动放弃了这个念头。\n\n理发师刚刚挪走剪断的头发胡须，正用热毛巾为他擦拭面部。长达一个月的病痛折磨，周恩来的容貌完全变了样，灰黄的面部布满一块块褐色的老年斑，发黑的眼窝深深地陷在高耸的颧骨之下，那双炯炯有神的目瞳不复存在了……习仲勋握住周恩来的手，作出了最后的诀别，随后病床在医生护士的簇拥下被推上救护车，前往下一个目的地中央党校。\n\n然而，周恩来的时间不多了。汽车行驶到半路，周恩来再一次陷入昏迷。生命监测仪显示血压飙升至160，而后缓缓下降，体温忽高忽低，心跳散乱而微弱。司机停下了车，医生实施了最后抢救，但于事无补。阴沉沉的天，毛毛细雨打花了救护车的窗户。带着所有思念，带着所有忧虑，带着所有遗憾，周恩来褪去明亮的目光，沉沉睡去。邓颖超轻轻吻了爱人的额头，为他阖上双眼。\n\n救护车打开警笛掉头，慢慢返回医院。蜂鸣声吸引了道路两侧的市民，他们到处询问载在车上的人是谁。得到答案的市民大脑顿时陷入一片空白，一语不发地跟在救护车后面。就这样，肃穆的人群渐渐汇聚成一条长河缓缓流淌。"
CPC_main_story_events.95.o: "思念汇聚成河。"
CPC_main_story_events.96.t: "谓我何求"
CPC_main_story_events.96.d: "“为什么把周恩来放我隔壁，都滚出去！”\n康生沙哑的嘶吼，在整个走廊里回荡。还没走到病房，最先入邓小平眼的就是满地碎磁片，还有站在门外手足无措的护士。不多时一个茶杯在脚下炸裂，吓得护士一激灵。\n“他每天都这样么？”邓小平停在门口跟护士打听。\n“不是每天，但每次一闹就特别厉害。”\n邓小平会意地点点头。忽然又一阵瓷片飞溅，杯盖也被丢了出来，惹得他好一阵唏嘘。他迈过一片残骸走进病房，只见康生坐在病床上，滚烫的茶水泼了一身，脖子上黏着茶叶，双目通红，面色狰狞，手里举起茶壶马上就要扔。邓小平赶紧弯腰躲避，但茶壶没有向他飞来，而是顺着康生的手叽里骨碌滚到了床脚。\n“我叫了半天，没人理我！”康生的话里带着哭腔，好像自己受了很大的委屈。\n“你生这么大的气，连院长都怕你，何况是那些孩子。”\n\n说着，邓小平让护士去叫清洁来打扫卫生，接着他要给康生治治心病：“我今天来看你，你有什么话想和主席说，能转达的我尽量转达。而且咱们过了这次没有下次，你仔细想清楚要给主席留下个什么印象。”\n“真的？”\n“真的。”\n看着邓小平不是在骗他，康生的嘴像机关枪一样吐个不停：“别把我从中央除名，别把我打成反革命，别在我的名字上画叉，别烧我的照片，我永远忠于毛主席！”\n“我尽量。”\n“不许让罗青长接我的班，他是周恩来的手下，是叛徒！”\n“你这是和主席说话的态度？”\n“我是为了革命！”\n“我也没说你不是为了革命，但我怎么可怜你是我的事，到了主席那情况就变了。你说周恩来是叛徒，有什么证据么？”\n“有！”\n康生当即扯开被子，在自己的病号服上摸来摸去，又拉开床头柜抽屉，床上床下找了几分钟，最后一脸茫然地对邓小平说：“我忘了放哪了……”\n这在邓小平眼里简直是胡闹，他也不再废话，有一说一有二说二：“陈老总现在连话都说不出来了，也没像你这样。中央不是不讲道理，你的名誉由我们保证，该有的你全都有。但你非要为了几十年前一点连我都不记得的历史问题就调动中央调查——不是不行，也许你真的有证据，但你的名誉中央也没法保证，你好好想想吧。”\n\n邓小平掏出笔刷刷点点记了这些话，给康生确认之后，塞进衣服兜里，转头去嘱咐护士，康生情况特殊，一定耐心照顾病人，摔坏什么东西找他来赔，打了谁骂了谁他来道歉，总之不许让康生发生意外。听到承诺的护士连连称是，心存余悸的同时在想：自己怎么可能直接找到这么大的干部？\n邓小平走后，康生嚎啕的声音响彻医院走廊，摔杯子的次数有增无减。"
CPC_main_story_events.96.o: "用塑料杯子，别用陶瓷了。"
CPC_main_story_events.97.t: "随风而逝"
CPC_main_story_events.97.d: "中央医院大门口，门卫照例拦停车辆检查。司机出示证件后人准许通过，车要留在外面。汽车缓缓停稳在路边，副驾上的小隋一边解开安全带，一边向司机嘱咐道：“羊师傅，麻烦您在这等我，我拿完药就出来。”\n来医院的路上，小隋透过窗户见不到几个行人。现在推门走下车四处观望，发现大街从来没有像今天这样安静，她还以为自己来错了地方。但在大门的另一边，赫然簇拥了一群衣装灰突突的老头，就像水泥雕塑一样扎眼。他们的头上统一披着斑白的鬓角，抬头纹清晰可辨，叹气一声比一声沉重。小隋走到离那群老人五六米远的地方，只听他们叨咕叨咕不停，中央领导的名字随随便便从嘴里吐出，所说的话更令她惊诧不已——\n\n“等陈毅一死，咱们这些人就真散了。”\n“我还以为是周恩来病危，没想到是他俩。”\n“追悼会的事情，你们一定多上心。”\n\n他俩？谁俩？惊诧归惊诧，小隋没心思去想这些，急急忙忙往大厅去。可一进大门遇上的人，简直让她脑袋壳都要炸开了。医院围墙下，江青两臂交叉在胸前，冲着墙边一个大胡子男人大动肝火，指责其一点责任心都没有，简直就像训小孩一样。教训过后一扭头，横眉立目的江青就盯上了自己。小隋装作没看见，埋头向前赶路，哪成想还是没逃出江青的手掌心：“小隋，看见我怎么不打招呼？太没礼貌了！”一句话吼得小隋心肝乱颤，只能怯生生地往江青那挪动脚步：“对不起主任，我不知道今天您在这。”\n“怎么，小谢没告诉你我今天的行程吗？我看你是放假放昏头了！”\n“告诉了，是我忘记了……”\n“陈老总要死了，你也不知道？”\n“我真的不知道。”\n“那你来医院干什么？”\n“给我父亲拿药。”\n\n突然，一阵惊呼打断了江青就要脱口而出的呵斥：“医生出来了！”\n宣布死亡的白衣信使没有任何举动，也没有任何言语上的表示，只是远远地伫立在正门台阶上。见领导们注意到自己，医生鼻子一酸，掉头跑进了大厅的阴影里。大门前的人像旋风一样，呼啦啦冲向医院大楼。江青也立刻迈开双腿跟在后面，丢下小隋一个人在静默中兀自凌乱。\n大胡子男人没跑，他拍拍背上的白灰，叫醒了魂飞天外的小隋：“还不快追上你们江主任，你的假期已经被取消了。”\n“高书记……”\n“把你要拿的药告诉我，我让秘书给你送到车上。”"
CPC_main_story_events.97.o: "地震开始了。"
CPC_main_story_events.98.t: "《最后一封检讨》"
CPC_main_story_events.98.d: "“造成民主集中制始终不得贯彻的原因，可能是因为像我这种从根源上便严重不合格的党员仍旧高踞官位，深谋远虑的主席对我无法放下心来，担心有朝一日党会被我们这类人领进死胡同，所以对民主抱有顾虑。”\n\n“但是，每当民主前进，我们的党便收获一次胜利；每当民主退潮，我们的党便遭受一次挫折。这么长的时间，这么多的教训，教会了我这样一个浅显易懂的道理：没有民主集中制的社会主义是一场灾难。”\n\n“夜深人静之时，想起历次斗争会的情景，我都如同醍醐灌顶——托派分子，老牌修正主义分子，里通日本的特务，走资本主义道路的当权派，一个个曼妙无比的词汇从他们嘴里喷薄而出。这里面哪怕有一条罪行是真的该多好？因此我十分清楚，主席对我绝不会这样坏，那些给予我批评的人，一定没有谁在背后指使，都是他们胡编乱造的，但这是不公正的。“\n\n“人恒自爱而后人爱之，人恒自救而后人救之。我不是一个无私的人，我已经丧失追随主席伟大革命路线的能力了。我没有任何资格再承担党中央亲手交给我的职务，更不是值得他人效仿的榜样。请主席放下戒心，同意我的退休申请。我已经不想烈火焚心般地思索自己为什么还活着，我想救救我自己。”"
CPC_main_story_events.98.o: "愤怒和不安困住了毛泽东。"
CPC_Li_Lisan_end_tt: "批示：批准§Y退休申请§!，将§R李立三同志§!送往§Y301总医院精神科§!休养治疗，不得怠慢。"

CPC_main_story_events.99.t: "若只初见"
CPC_main_story_events.99.d: "自从医院面见周恩来后，前所未有的焦虑转移到了邓小平的身上，急得他整天在房间里踱步画圈，茶饭不思。退休这么大的事，总理怎么独独交代给他一个呢？这不是逼他当孤家寡人么？\n\n晚饭过后是惯例的散步时间，但河边的气氛自从周、陈、康等人一连串事故后就沉闷无比。邓小平特意和陈云并排行走，把苦恼写在脸上向他求助。陈云自然心知肚明，但他必须要等邓小平主动打开话匣子，事情才有商量的余地。\n“总理找我谈过一次话。”\n“谈了什么？”\n“他要退休。”\n“只他一个人么？”\n“不是。”\n“还有谁？”\n邓小平伸出大拇哥和食指：“这俩。”\n陈云会意地点点头：“那有点难办。这不是和高岗一样，搞不好就是路线错误？”\n“所以我特别发愁。”\n“这件事，你问过其他人么？”\n“你是第一个。”\n“中央这些人，目前为止还没有正常退休的，像谢觉哉那样的到死身上都挂着职衔。彭真是意外，高岗是犯错，他们两个都是非正常离休。这就是咱们党的历史包袱。”\n“有时候我就想，咱们这些人要是从没互相遇到过，还会不会有这么多事。“\n“我就当你是说胡话了。”\n\n沉默一会后，陈云先开口了。\n“你得让大家明白，退休不是惩罚，不是人走茶凉。待遇啊，名誉啊，儿子闺女什么的都给安排好，不然你这个事办不成。”\n“就不怕有要价高的让我下不来台？”\n“世上哪有天上掉馅饼的好事。再说，真要价高的就那两位，你还是好好想想怎么解决那俩吧。”\n”先在中央把讨论会开起来，不然我也两眼一抹黑。”\n\n夜幕降临，河边行人几乎绝迹，邓小平看不清陈云的脸，不知他心里在想什么。此时，一些模糊的思绪在脑海中浮现，两人一起走上回程的路。\n“陈毅追悼会什么时候？”\n“明天。”"
CPC_main_story_events.99.o: "明天准时到。"
CPC_main_story_events.100.t: "看客的烦恼"
CPC_main_story_events.100.d: "陈毅的遗体安放在告别厅正当中，一袭鲜红的党旗覆盖在身上，四周铺满鲜花，后面悬挂着微微含笑的黑白照片和“永垂不朽”四个大字。陈毅的老伴张茜带领着一众家属站在遗体西侧，止不住泪流满面。\n\n“从红军时代一路走来，陈毅同志从始至终都高举马克思列宁主义，毛泽东思想的大旗，对毛主席的革命路线忠心耿耿，矢志不渝。长期的革命战争中，陈毅同志将他毕生的心血献给了党，献给了西北人民，献给了我们每一位同志。我们怀着十分悲痛的心情，悼念陈毅同志。”\n\n军队代表黄克诚致完悼词，毛泽东在秘书关锋搀扶下走上讲台。一袭领子歪、全身褶皱的中山装，好像在诉说毛泽东放下一切事务，匆匆赶来追悼的过程，狼狈却包含一分平实。毛泽东的悼词比起前面也少了许多官样套话，那些追忆的话语全都被让给了他。尤其论及红军时代并肩作战时，在场老同志全部感动得热泪盈眶。\n\n遵照追悼会程序开始绕灵一周瞻仰遗容，哀乐填满了大厅里的每一处缝隙。有人痛心疾首，有人心如死灰。人群排成一列纵队，缓缓向前蠕动。刘少奇走在排头，第一个来到张茜面前致以哀思，随后拉过他的一个新朋友说：“这是周扬同志，专程从甘肃赶回来的。”周扬也不失时宜地请王茜节哀，并与她握了手。张茜点点头，接受了他们的礼遇。\n\n告别厅的角落里停着一辆轮椅，上面坐着骨瘦如柴的周恩来，中央体谅特许他旁观整场追悼会。目睹人群来来往往又与自己无关，隔膜感触发了置身事外的恶寒。\n\n“真是一场好戏。”周恩来露出无比反动的念头，但马上被自己驳倒，“唉，那我为了陈毅向张茜道歉又算什么呢？”\n\n周恩来没有更多时间感慨，只想把心心念念的退休搞下去。他目不转睛地看向主持人邓小平，这引起了后者的注意。邓小平来到周恩来旁边，询问他有什么事。\n\n“你有没有什么安排，我之前和你说过的那些。”\n“您的意见我已经给毛主席看了，主席没批示。我目前还是想先把会开起来……但最近事情太多了。\n“一定要抓紧。”"
CPC_main_story_events.100.o: "这些都得看主席的意思。"
CPC_main_story_events.101.t: "突破口"
CPC_main_story_events.101.d: "陈毅和康生的追悼会让中央筋疲力竭，以至于全都懒得来开这场讨论如何让自己退休的会。会议室里哈欠连天，喷出没刷牙的口气，再混合着烟草燃烧的气味，闻起来让人十分闹心。\n“主席安排我们开这场会，说明他心里认为总理的意见是个大题目，也代表我们党在新时期出现了新情况，不能不慎重考虑，希望大伙把这件事重视起来。”\n\n邓小平小心翼翼地致完开场白后，首先请出了一位最出乎意外的人来发言——这个人就是江青，今天是她第一次代表最高领袖的意见来参与决策，既见了猪跑，又吃了猪肉。\n“总理的身体行不行，不由谁个人说了算，医生说了也不算，这完全要看党中央的意见。如果革命任务不允许退休就不能退休，阵线上上下下大事小情全都等着总理解决，他走了让其他同志怎么办？主席也是一样的道理，谁退都行，毛主席不能退！”\n\n如果说执拗是毛泽东日趋老迈后唯一仰赖的武器，那他百分之百传授给了日日夜夜看护左右的江青，尤其是这份说一不二的作风。但好在，江青的话不是毛泽东本人的话，没必要百分之百服从。就在江青发言的时候，薄一波和一旁的刘澜涛悄悄嘲讽道：“她拿咱们全当死人呢，哼哼……”\n刘澜涛摆摆手让他不要声张，自己马上发言，大伙的眼睛都集中在他这，别再出什么意外。\n\n“总理的意见值得思考。他认为，自己退下去，年轻人上来，就能实现根据地的长远发展。那么我们可以再扩展一下，如果那些在岗位上什么都干不了的老同志也一起退下去，换上年富力强的新人，我们的领导工作会不会更加扎实稳固？”\n此言一出，清嗓子的咳嗽声此起彼伏。代表们各自打起了自己的小九九，没人嘬烟卷，没人啜饮茶水，连同服务员也一并止息，乖乖站在暖水壶边一动不动。这时，张云逸粗悍的声音像头蛮牛一样冲撞进来：“有的老人在位置上已经坐了十几年了，他一走单位连个主心骨都没有，什么都要重新培养，不是添乱么？”\n\n这一下，会议室里直接炸了窝，众人七嘴八舌议论纷纷。\n“好多人早就把工作全扔给秘书了，这个办公室那个办公室的，少了一个人单位照样运转。”黄克诚说完这话觉得自己喘不过气来。\n“我就不用秘书啊。”许世友嘻嘻哈哈，把别人的话当作笑料，根本没有讨论的意思。\n“为革命工作几十年，现在说让退就退，讲不讲道理？”\n\n面对可能越管越乱的场景，邓小平心里默默叹口气，扶着额头自顾自翻起了文件，只等底下人消停，可他没注意到愠怒正在李立三的脸上堆积，直到李立三呼啦踢开椅子，站起身大喊：“我退！”\n\n李立三的突然爆发令全场愕然，随后他便摔门而出，轰的一声关紧了所有人的心房。这时，陈云用脚踢了邓小平一下，用手指向李立三推开的大门：“你再压一压他，事就成了。”\n“让他写检查么？”\n“对，以毛主席的名义。”"
CPC_main_story_events.101.o: "送上门的买卖。"
CPC_main_story_events.102.t: "急中生智"
CPC_main_story_events.102.d: "自从中央召开“退休会”之后，紧张的政治空气弥漫整个西安。林彪的宅邸，“林办”人员一如既往地忙碌，为上司林彪接收各方信息。机要秘书于运恒拆开了一个文件袋，里面是毛主席最新指示，当他看到内容时不由得惊讶起来：“毛主席要退！”“退什么？毛主席要退什么？”惹得周围同事停下手里的活，纷纷聚集到于秘书身边看他收到什么样的消息，只见通知上赫然写着：毛主席同意周恩来关于党内老同志退休的意见，同时不再作为候选人参选阵线主席。\n\n“啊？”“怎么回事？”“毛主席要退，我们怎么办？”“林副主席退不退？”\n众人一时六神无主，甚至没注意站在门口的叶群。听说“林办”气氛异常，她第一时间赶来查看情况，到地方就撞见秘书们开小会，当即质问他们：“什么退不退？瞎嘀咕什么呢？”\n\n“叶主任，您看这个。”\n于运恒把通知双手捧了出去，叶群拿来打眼一看脸色大变，慌忙丢下众人直奔林彪的房间。进门后，看见林彪还在慢条斯理地圈阅文件，叶群气不打一处来，劈手夺下丈夫的水笔，把通知往桌上一拍指着说：“我说前天的会你得去，你非犯懒不去，看看出了多大的事！”林彪见到又是一脸不爽的叶群，用手绢擦擦手上的笔道，很不高兴地摘掉眼镜，好像事先知道什么似的反问叶群：“怎么，主席同意周恩来退休了？”“不光周恩来退，主席也退了！”“哦……”\n\n林彪瞥见了通知上的红字，明白叶群着急上火见自己的缘故。但说实话，林彪也有些手足无措，他自己也不知道退休的事情现在变得如此重大，更重要的是——叶群怎么又比自己先拿到情报。为了回敬前后操劳的夫人，林彪故作神秘地从裤兜掏出一封叠了好几折的信，展开，铺好，压在了通知上面。\n\n“我没去开会，但会上的事我都知道，这是吴法宪给我记的会议记录。”\n“你就剩下嘴硬，毛主席退休的事你能比我先知道？现在我问你怎么办！”\n林彪的大脑飞速旋转，他也不知道怎么办，“顺其自然”四个字脱口而出。\n“啊？你真要等刘少奇、薄一波那些人把咱们吃干抹净呢？你脑子里装不装点事？”\n“你胡说八道什么！”\n\n林彪口干舌燥，抓起杯子喝水降温，沉默半晌后心里才有了想法：“让杨得志准备一份各军区兵种的领导人名单，明天下午亲自到林办来，再加上杨成武，吴法宪，我要和他们商量退休人选。”“丁盛来不来？”“谁？”“你之前派去西藏的那个。”“他愿意就来，不愿意拉倒。”\n\n毛主席的决定不能更改，不过看到林彪不逆来顺受，叶群就心满意足了。得到指示之后好像得了宝贝一样，终于转怒为笑，撇下林彪走出房间，回头暗自庆幸全靠自己才让林彪在这么短的时间内做出决定。"
CPC_main_story_events.102.o: "军队的事，军头来办。"
CPC_main_story_events.103.t: "秋风难驯"
CPC_main_story_events.103.d: "“过去，主席教导我们要摆脱教条主义，但是没有提到经验主义。现在，主要危险是经验主义阻碍了阵线的发展。小平同志处理日常工作是毛主席许可的，他办起事也许有这样那样不妥的地方，老同志们要多包容，不要总依照惯性思维说他是坏人。”\n\n自从清退开始后，党内彻底沸腾了起来。那些被邓小平置于清退范围内的老人不甘心离开权力，他们或亲自拜访，或派人代劳，以邓小平办事不公为名，时不时到周恩来的病房里讨要说法。面对汹汹舆情，深知所有事端皆因他而起的周恩来不敢有半分怠慢，只要他还清醒就挨个亲自接见这些表面恭谦，实则兴师问罪的人。日复一日的言语交锋，拖垮了周恩来最后一分精神气。\n\n这天清晨，护士按时拉开了病房的窗帘，昏睡一夜的周恩来醒来得十分缓慢。他缓缓睁开双眸，映入眼帘的是邓颖超无比心疼的目光：“今天感觉怎么样？”\n“还是没有力气……”“你昨天要见罗青长，现在他来了，就在外面等着。”“快请进来。”\n\n邓颖超来到门口，让罗青长赶快来到病床边。周恩来也强撑精神，在护士帮助下坐了起来。看着腮帮子瘪下去的总理，罗青长眼里一下子充满了泪水。周恩来也没想到，老部下见到自己第一面就哭得不能自已，他只好一边宽慰，一边询问工作上的事情：“平日里，我不生病……没想到这一病，耽误这么多的事。罗青长同志，我请你来是想问一问，前天我发出去的申请，毛主席有没有批准。”\n罗青长抹了一把脸颊上的泪珠：“毛主席还没批准。主席说总理太累了，让您好好休息。”\n“我也是这样想的。”周恩来无比失望地低头看向床单，“像我这样子到处去转，也是给别人添麻烦。可是我不放心，报纸上、广播上的消息，都拦不住我要眼见为实的这个想法……这么多天的经历，我只看清了一件事——未来全都在年轻一代的身上，所以我一定要去中央党校见见新学员。”\n\n见周恩来还是不改四处奔波的想法，邓颖超再也忍不住了，她俯身在周恩来耳旁悄悄地说：“你把别人当亲密战友，可也得把自己放在心上。我理解你，可你不能这样糟蹋自己了。”\n“小家，我顾不上了。大家，我没有顾好，党内同志要戳我的脊梁骨，我的心里实在不好受。等我见完新学员，还要拜会某些同志解释情况。”\n\n罗青长挡不住周恩来热切的期盼，他只能尽量卸下总理的顾虑：“我再去和主席说说试试……”\n得到罗青长的肯定答复后，周恩来紧绷的精神一下松弛了下来，闭上眼晕了过去，吓得罗青长赶忙按响了护士站的呼叫铃。在主治医生仔细检查后，确定总理生理机能没出问题。"
CPC_main_story_events.103.o: "他会再次醒来的。"
CPC_main_story_events.104.t: "永远怀念"
CPC_main_story_events.104.d: "医院二楼，习仲勋、杨成武、林枫等人刚刚将周恩来的遗体送入太平间。一场简单的送别仪式后，几人在窗边驻足，望见医院外聚集的市民久久不能自已。\n\n附近照相馆，悲痛的人将门槛踏破，只为买到一张遗像。一幅硕大的照片立在医院大门旁，宽大的硬木相框上刻着“人民总理”四个金字，下面摆满鲜花、烟酒、食物等等一切能寄托市民哀思的供品。时间临近傍晚，下班自发前来吊唁的人群越来越庞大，他们抱来了花圈，并且亲自为燃香、蜡烛打伞庇护。汽车占满医院四周的道路，鸣笛不止。\n\n这时，整齐划一的踏步声震慑了所有人的心。黑夜笼罩下，一队解放军跑步抵达现场，他们设置路卡隔开人群与致祭的小灵棚，并开始执行中央下达的民防指示：身披雨衣的士兵撤下花圈，将照片封膜放倒准备搬上车，把供品扫进麻袋，最后赶跑了打伞的守护者。雨水将烛光浇灭，目睹士兵所作所为的人群骚动了起来。\n\n“为什么收走花圈！”“谁让你们这么干的！”\n\n悲伤化为了愤怒。为了保护现场，激动的人群向前涌动，号哭、推搡、怒斥在士兵与市民之间此起彼伏。有人被雨水滑倒，混乱引发了踩踏，个别落单的士兵不只是被挤得还是被打得鼻青脸肿。显然这批解放军对骚乱有备而来，他们迅速从车上抽出粗木棒，排成排组成一道人墙。车上大喇叭也响起播音：“市民同志们，中央十分理解你们悼念周总理的心情。但今天不是追悼会的正式日期，请你们有序离场，否则警察将进场维持秩序。”\n\n喊话不起任何作用，混乱仍在继续，一块大砖头朝军车飞去，砸掉了喇叭，刺耳的电流声穿透所有人的耳膜。这声音好似发令枪一般，一时间石子乱飞，砸得军车叮当作响。情况被车内长官上报指挥部，十五分钟后，他得到上级命令：警力增援已到，你们可以撤出来了，准备驱散会场。\n\n周恩来的巨幅相片被所有人遗忘在墙角，雨水打湿了他的脸颊。在相片的注视下，警察挥动手中的木棒砸向人群，头破血流的“带头分子“被抓上军车，人们惊叫着抱头鼠窜四散奔逃。这场被少数反革命分子敌特利用的混乱被彻底终结，任务圆满完成。"
CPC_main_story_events.104.o: "我会在终点等着所有人。"
CPC_main_story_events.105.t: "四川总结会"
CPC_main_story_events.105.d: "“江西时候，红军没支援十九路军，对内说是王明左倾造成的。现在刘文辉被赶到根据地，彭老总，你有没有什么说法？”\n\n四川问题本应是彭德怀领导下的关中军区处理，配合西南局支持刘文辉的存在。可现在军阀内战破坏了党中央的战略布局，他难辞其咎。在林彪的诘问下，彭德怀主动起立，摘下了缀饰红星的绿军帽以示谢罪。\n\n“战场失败是我的失职，”彭德怀脸上愈发聚起一团阴霾，“军阀开战前六个小时，除了韩先楚的电报，我没收到边防部队任何有关四川的报告，造成西康军战况侦察不清，误导了党中央决策。”\n\n彭德怀的检讨没有赚得林彪的满意。也许是接替军委工作以后他气性更大了，在检讨的基础之上，林彪释放了抑制不住长篇大论的欲望：“士兵是新的，军装是新的，可思想还是旧的。关中部队下到基层指战员，上到旅长师长，对根据地以外的变化毫无知觉，一点都不知道我们还在和其他地方打仗。这种懒惰的思维不是从外部——国民党旧军队带来的，是我们自己脑子僵化才会这样。如果只看表面问题，不真抓思想建设，那我们的军队就是到处被动挨打的木头。”\n\n说完这一大段话，林彪还不忘神秘兮兮地问彭德怀：“彭老总你也想想，为什么青海平叛没用关中的部队？”\n\n“你这话太伤人了。”\n\n“明天我到政务委员会帮主席拉票，解放四川的指示很快就到，希望各机关，各部队，各位老总能予以配合。”\n\n此话一出，在场的人都怔住了，就连一向说话不多的刘伯承也被吓到了：“拉什么票，你怎么能去拉票？”\n\n“刘文辉要去政务委员会做演讲，求求会堂里的代表们救救四川。根据地必须拿下四川，不然西南局的建设就全白费了。”"
CPC_main_story_events.105.o: "就拉拉票，不会有其他事的。"
CPC_main_story_events.106.t: "夸父逐日"
CPC_main_story_events.106.d: "刘亚楼回忆着周保中的嘱托，行进在边境线上。两天前，刘亚楼同周保中、李兆麟商议决定，组织一队人马，沿着边境线跨过大兴安岭，借道蒙古，前往陕西。刘亚楼仍记得临行前周保中同他说的话：“亚楼，一定要向党中央说明白，东北抗联还在，东北抗联没有失败！只要我们继续战斗下去，我们一定能解放东北，解放中国！”\n\n刘亚楼带着队伍，小心翼翼的躲避着伪军的巡逻，但行进到大兴安岭的山麓时，还是不幸地被伪军发觉。几发子弹掀起了脚边的土壤，几发子弹击中了森林中的百年老树。刘亚楼见状，策马挥鞭，带着队伍加速奔驰进群山之间。飞奔的马匹喘着粗气，汗水在空气中凝结成白雾。越过沼泽，绕开河流，所幸伪军追击意愿不强，没有继续深入。刘亚楼向后方望去，确认敌人没有追上来后，便带着队伍继续进军。刘亚楼手里拿着指南针和过去十几年抗联战士累计绘制的地图，寻找通向蒙古的道路。队伍一路西行，向着太阳落山的地方前进。\n\n这支百人左右的小队在山林中行进着。马儿的嘶鸣响彻了林海雪原，在这片自由天地之间宣誓着自己的主权；东北恶虎扑向狍子，在听见马蹄的哒哒声后蛰伏进树丛；满洲国军闻讯前来扫荡，但陷入泥沼的装甲车让他们只得罢休。山川险境如履平地，跨水渡河亦是平常。渴了，就喝水壶里融化的雪水；饿了，就从行囊中拿出坚如硬石的高粱饭团；困了，则哼着《松花江上》浅浅睡去。数天之后，小队从山谷中鱼贯而出，豁然开朗。沿着河流继续向前飞奔，一片水天一线的大湖映入眼帘——是呼伦湖。随队的蒙古翻译说，绕过呼伦湖，就是红色蒙古的地界了。要到了，离中央不远了，刘亚楼心想。\n\n小队沿着呼伦湖继续行进，“砰砰——！”远处传来两声枪响，小队快速变换成防御姿态，向着枪声处保持警惕，刘亚楼向枪声处望去，看见了一面红蓝分明的旗帜。旗帜下的士兵逐渐靠近，小队成员们看清楚了旗帜的全貌，也看清楚了士兵的帽徽——八一军徽。小队翻译率先走向前，说明来意以示友好，刘亚楼也笑着说道：“同志，我们是共产党，东北来的。”\n\n“共产党？东北？”领头的蒙古干部用生疏的汉语怀疑道。刘亚楼递上东北抗联总部的信件，向巡逻队的干部敬了一个军礼。"
CPC_main_story_events.106.o: "“我是东北抗日联军的刘亚楼，现需向中共中央汇报工作。”"
CPC_main_story_events.107.t: "白雪红光"
CPC_main_story_events.107.d: "我为自己建立了\n一座非人工所能建造的纪念碑，人们走向它的路径不会被野草掩没。\n它高高昂起那颗不屈服的头颅高过那纪念亚历山大的石柱。\n不，我不会死去\n我的灵魂在珍贵的诗歌当中\n将逃避腐烂，比我的骨灰活得更久长。\n我的名字会远扬，只要还有一个人\n活在这月光下的世界上……\n\n这是刘亚楼非常喜欢的一首诗，也是他与爱人苏丽娃在月光下的莫斯科树林共同咏唱过的定情诗，他总觉得这首诗似乎在暗示着自己的一生。莫斯科的时光仿佛仍在眼前，一样的冰天雪地，一样的热血澎湃，只是身边伤痕累累的战士们告诉刘亚楼：他可能永远回不去那个日子了。\n就在昨天傍晚，抗联的一支小股部队突袭了满洲国军在塔河的一座营地，这次有点冒险的行动是因为近期关东军一反常态，强化了对北满地区的封锁，这逼迫刘亚楼所在的这股部队为了转移不得不连日跋涉，才在昨天打下了一处落脚点。\n此行不虚，拿到了一些补给，趁敌人没有反应过来，他们还得尽快北上返回抗联总部。\n\n借着短暂的间隙，刘亚楼习惯性地让勤务员把这里能带走的杂志报纸通通打包，自己则一个人拿出一台晶体管收音机，开始左旋右旋地调整频道，想要打听到有价值的信息。\n没想到，接下来的消息却让他震惊得目瞪口呆。\n\n“这里是朝日新闻，据本台报道：因安田危机引起的中国内乱出现了意想不到的转折，位于西北的中国共产党扶植刘文辉军队趁乱侵略四川重庆等地，已完全控制了川渝两地，这是十几年来西北中共党人第一次主动地朝外扩张。对此，中华民国政府表示绝不轻易向共匪低头，将给予匪党猛烈的报复。日本政府发言人严厉谴责中共叛逆顽固坚持反日态度，试图掀起内战来颠覆中华民国政府。”\n“这是自蒙古内战后中国又一起大规模的政治变动，这是否意味着新的战争正在中国大地上酝酿？对日本又具有何等意义？请听本台特邀嘉宾稍后分析……”\n\n还在远处埋头整理杂乱书报的勤务员突然被一把拉住，抬起头只看到刚刚还有些疲惫的刘亚楼正以狂喜的表情在朝自己兴奋地喊道：\n“赶快收拾完东西，我们现在就回去，必须把这个消息立刻告诉周司令。”"
CPC_main_story_events.107.o: "党中央要有大动作了！"
CPC_main_story_events.108.t: "漫长路"
CPC_main_story_events.108.d: "“现在到处流行的“相思病”，我们叫“屯垦病”，在一望千里的平原上，过着集体生活，那有别于之前的城市生活，觉得受不了时，我时常会想起身在治安战争中的战友，继续努力与屯垦病作斗争，花费了几代人的努力，包括父母都已经七十了，如今仍在和增产的敌人——杂草做斗争……”\n“你忍心让你的年老的母亲和刚出生的孩子，去未开拓的土地上受苦吗？对此我用一句诗来回答：“生为大和敷岛子孙，死后要埋皇道之地。”我还教育他们，开拓不是为了个人，而是为了国家和子孙后代，我就这样来参加开拓团，成为了知青坚持战斗到今天……”\n张为先躺在病床上，看着日本人拍摄的，那些代表着过去的影像袋，在他的脑中，那战争后的几十年岁月也如幻灯片一般闪过，在那被称为“皇国满土的后开拓岁月”中，许多许多活着的人，那些仍然想要让这片黑土地获得自由的人，他们也都消逝了。\n\n而至今活着的人，亦如他一般，他们的灵魂被岁月磨平，惟有本能的麻木驱动着躯壳前进。“庸才唯有骈死于槽枥之间而已”，岁月使他愈发的确信了这句话，无论是青天白日还是红底白星，它们都在心中无法被忘却，但却永远被积压于心底，如同灰埃一样不愿再被提起。\n失败者自然可以伪装成胜利者的样子，然后融入他们之中，但，然后呢？背弃过去的人永远无法压抑住寂寞与空虚，而伪装者也无时无刻不在担心假面被揭穿，终有一天自己也会被清算，不是吗？就像是那年夏天的下午，他为了自己的平安所做的那样。\n一个人自走进荒原那一刻起就不可能回去了，他想是的，于是他望向床头的照片，望向照片中年轻的自己以及还年幼的孩子，他现在应该正在某个不知名的城市巷中游走着。\n\n你要去往何处？又在追寻什么？（电报机启动声）\n\n你难道要重蹈覆辙我的道路吗？（.--  .）\n\n你难道要和我落得一个下场吗？（.-  .-.  .）\n\n你难道要继续苟活在这样的时代里……（-.  .-  .---  ..-  .-）\n\n他不知道，直到黑夜降临的那一刻，他终究是不知道……\n\n哈尔滨灯火深处，一道来自地下电台的秘密电波，正穿越极寒的风雪，飞向遥远的西北大地。" #摩斯电码：WE ARE NAJUA（我们是东北抗联）
CPC_main_story_events.108.o: "27220，12110，34127，24111，53014"
CPC_main_story_events.108.tt: "译文：我们是§x东北抗日联军总部§!，呼叫党中央！——刘亚楼电\n这将解锁一条新的§Y国策分支§!……"
CPC_allow_focus_NAJUA: "我们收到了§x东北抗日联军总部§!的电报。"
CPC_main_story_events.109.t: "回家"
CPC_main_story_events.109.d: "收到蒙古方面的电报后，周恩来立刻将信息转达给毛泽东，询问毛泽东的意见。毛泽东看着刘亚楼的信件，心里感到些许宽慰，一方面是庆幸满洲省委火种尚存，另一方面是高兴于革命事业有了更多的可能。随后他告诉周恩来，让刘亚楼到达后立刻来汇报工作。两天后，刘亚楼的小队列队进入西安城门，道路两旁的人群高举着“欢迎东北抗日英雄”的横幅，向他们致以敬意。毛周等中央领导人早早站在办公楼外，邀请刘亚楼到会议室说明情况。\n\n会议室里，除了毛周等党政要员外，还有林彪、徐向前、彭德怀等军队将领，他们都在等着这位从林海雪原走出来的后生说明东北的情况。刘亚楼整理好文件后，开始向党政军的领导汇报东北抗日事业的现状。\n“德寇侵苏后，我们这些滞留在苏联的军校党员随苏共中央一同转移到伊尔库斯克，然后和流亡苏联的东北抗联会师。”刘亚楼在说明留苏党员的情况后，又继续开始讲解东北抗联的情况，“同抗联会师后不久，日本旋即向外东北发起进攻，我们也奔赴前线，参与抗日。抗联与红军同日伪军进行了残酷的拉锯战，但随着伊尔库斯克方面陷入混乱，同时几支反苏武装也在伊尔库斯克周边兴起，我们与苏共中央失去联络。此后，我们的弹药、武器、粮食全部陷入劣势，不得不收缩部队同日寇和伪军打游击。”刘亚楼在黑板上熟练的画出东北和前苏联远东地区的势力图——十几年如一日的抗日革命斗争早已使他将这些内容烂熟于心。他指着黑板说道：“我们北方是苏联解体后的白匪，南边是伪满和日军的封锁，使得我们根据地不得不局限于海兰泡、庙街和伯立的树林沼泽之间，这些地方伪军和日军的机械化部队开不进来，步兵也因为不熟悉地形而无法深入。后来，为了维持队伍存在，继续同日寇斗争下去，我们一部分同志秘密潜入黑龙江以南的一些大城市，开始进行地下活动，为根据地提供药物等必需品，有时甚至可以走私一些武器弹药。但日本人的封锁也越发残酷，我们也已经同敌人长期僵持。” \n\n刘亚楼向众人汇报完后，有的人窃窃私语，有的人低头沉思，东北问题着实棘手，借道蒙古前去支援亦是如履薄冰。众人一筹莫展之际，毛泽东率先发言：“把人家晾在这憋不出来个一二三也不好，东北的事情我看我们慢慢讨论。先让人家东北同志回去休息。”他双手撑着桌子站了起来，拍了拍刘亚楼的肩膀："
CPC_main_story_events.109.o: "“回家就好，有事后面我们还能慢慢讲嘛。”"
CPC_main_story_events.110.t: "东北总结会"
CPC_main_story_events.110.d: "刘亚楼被特许作为抗联代表旁听了这次中央工作会议，看着那些平常在印刷报刊上才能见到的面容，此刻他们正坐在会议桌前将要为东北革命的未来擘画蓝图——自己经历的这一切是如此真切而不容反驳，以至于刘亚楼竟一时恍惚，只得用手撑着桌子勉力不让自己倾倒。\n\n仍然是毛泽东率先发起讨论：“昨天中央会的共识也确定了，务必支援到东北革命同志，现在问题就转变到了怎么办上来——就是讲，要用什么办法，从什么地方打出一个通道，支援什么方面的问题。”\n林彪则起身走到巨大的东北全图前，举起教鞭指向满洲里：“昨天中央会散后我又集合军委的同志开了个小会，我们认为如果东北抗联要能接收中央援助的物资，收缩力量撤到满洲里周边是最佳选项，特别东北抗联总部可以西撤至乔巴山市，有乌兰巴托直达铁路补给非常方便。”\n刘少奇举手补充：“原先乌兰巴托的铁路是和内地相连的，但不是从包头直达——交通部的同志预计加急抢铺铁路联通包头到旧铁路可能需要半年到一年时间。”\n“能连通就不是大问题，另外我们还要听听我们抗联来的同志的意见——亚楼同志，你怎么看？”毛泽东转头看向刘亚楼。\n\n刘亚楼慌不迭站起，毛泽东却笑着摆摆手：“又不是老师叫学生回答问题，坐着说，坐着说。”\n刘亚楼笑着敬了个礼，重新落座，整理好思绪：“主席，我和周司令他们的想法都是一致的，尽快联络上党中央恢复组织关系。现在抗联吸收了不少苏联的老红军，还有些朝鲜族游击战士，虽说都是为了抗日，但是各人目的和组织关系都比较混乱。我们是希望首先能整顿组织关系统一思想认识，然后按自愿原则组织分批西撤……”\n\n数小时后，会议结束，在鱼贯出场的代表们中间，刘亚楼看到了双手撑着桌子缓缓起身的毛泽东，他不自觉地迈出双腿走到主席面前：“主席，您都这么老了……”\n\n“生老病死，自然的道理，我七老八十的人了，还不显老岂不成了老妖怪。”毛泽东拍拍他的肩膀，神色却有些落寞，“亚楼同志，请你回去转告周保中李兆麟几位同志，请他们相信我这个老头子的判断，我们这些年游击来游击去也总结了点道理出来，共产党的游击队是一定要有中央和根据地的，不然容易走错方向，要跟其他抗联同志讲明白这个利害关系，但不要强迫他们，中央毕竟没到过东北去，不晓得那里的实际情况。我预感一些战士——特别是朝鲜人——是要坚持留在东边打游击的，要尊重他们的意见。”"
CPC_main_story_events.110.o: "“我明白，请主席放心。”"
CPC_main_story_events.110.tt: "\n制作组注：更多有关西北以外的§x地下工作者§!与§G抵抗者§!的故事，将于§Y1.2版本：雾隐孤鸿§!中为您奉上。"
CPC_everything_is_settled_down_in_INDIA: "印度的§Y前途命运§!已由其§S人民§!亲手决定。"
CPC_main_story_events.111.t: "印度问题讨论会" #分3个，IND不存在；AZH不存在；IND_UNIFIED
CPC_main_story_events.111.d: "午夜，几个老头或蹙眉或以手撑额，在隐隐嗡嗡作响的白炽灯下端详着军委好不容易找到的一张印度详细全图，旁边还有各种报纸以不同的语言向这几位中国革命的大脑展示着印度近年来的情况。\n\n“人家扇扇翅膀，搞得我们几个这里像是狂风骤雨一样。”毛泽东尴尬地笑笑，“白天的时候外交部的同志跟我说他们翻遍了美国日本印度这些年的报纸，大概捋清楚了这个印共马列是什么个来头。”\n\n“印度的共产党搞了修正主义，在资本主义政府里面搞议会斗争，一些革命战士搞得不满意，就跑出去另搞了个印革共，搞了半天，党的中央总书记是个托派。最后又分出来现在这个印共马列的。”毛泽东说道，“他们现在在印度的北边，也就是靠近西藏的这边有一些农村根据地，好像还有外围掩护组织当他们的合法斗争抓手，拿下了北方几个邦的执政权。”\n\n“手段很高明，做了两手准备，要考虑组建联合政府，也要考虑武装夺取政权。”周恩来赞许道，“唯一的问题是，规模实在太小了。”\n\n一句话令在场所有人神色凝重起来：印共马列和当前印度合法政府的实力差距过于悬殊。帮，万一未来深陷南亚次大陆以至令国防阵线腹背受敌，解放大业功亏一篑，没有人担得起这个历史罪名；不帮，亚洲革命此刻正是需要凝心聚力的时候，若因此寒了东南亚革命盟友的心……\n\n纸烟燃烧的烟气在白炽灯照耀下拉出缕缕白线，一如他们此刻混乱的思绪。\n\n终于，毛泽东似乎狠了狠心，把手中快烧到指头的烟梗扔进烟灰缸碾熄：“我看……”"
CPC_main_story_events.111.o1: "“……印共马列是个抓手，跟他们当局定个秘密和约。”"
CPC_main_story_events.111.o1_tt: "由于§Y统一印度§!当局§R亲日§!，该选项可用。\n若§Y统一印度§!当局接受我们的提议，§x解放战争§!拉开帷幕之时，他们将§G不会插手§!中国的内部事务。"
CPC_main_story_events.111.o2: "“……跟印度当局谈口岸开放的事，我们可以打印共马列的牌。”"
CPC_main_story_events.111.o2_tt: "由于§Y统一印度§!当局§G不亲日§!，该选项可用。\n若§Y统一印度§!当局接受我们的提议，我们将引导§G印共（马列）§!参与联合政府。\n同时，我们将可自§Y印度§!接收§m外部援助§!，共享发展机遇。"
CPC_main_story_events.111.o3: "“……没有什么好讲的，帮革命同志最重要。”"
CPC_main_story_events.111.o3_tt: "无论§Y统一印度§!当局情况如何，该选项均可用。\n我们将引导§G印共（马列）§!建立革命根据地，为未来§x解放全印度§!打下基础。"
CPC_main_story_events.112.t: "印度回电" #ROI的支持回电
CPC_main_story_events.112.d: "中国国防阵线西北中央政府及中共中央委员会诸君敬启：\n\n我们收到了贵方来电，并真切认可贵方为民族独立自由事业作出的重大努力，本人[IND.GetLeader]谨代表[IND.GetName]政府向贵方致以崇高敬意。我方亦愿意在合适的外交场合承认贵方为中国之唯一合法政府，建立正式外交关系，并声援贵方抗击日本法西斯之正义举措。\n感谢贵方尊重我国内政之独立自主，愿意说服印共（马列）参与我国的合法参政过程。我国新近统一，国内诸多弊病亟需改革，我们愿意抓住一切可以合作共赢和吸收外资的机会。\n目前美国已同我国建交，如若阅信诸君不弃，可派代表团到德里来，我方愿做中间人促成贵方同美国的合作，这对于我方亦为重大发展机遇。\n\n此外，我方也期待同贵方进行正式会谈以确定印共（马列）之政党地位、阿鲁纳恰尔之领土归属等争议问题。\n\n[IND.GetName]国家元首 [IND.GetLeader]\n谨上"
CPC_main_story_events.112.o: "事不宜迟！"
CPC_main_story_events.112.o_tt: "我们将引导§G印共（马列）§!参与联合政府。\n同时，我们将可自§Y印度§!接收§m外部援助§!，共享发展机遇。\n\n制作组注：更多§Y外交博弈§!后续内容将在§Y1.2版本：雾隐孤鸿§!中呈现。"
CPC_main_story_events.113.t: "印度回电" #AZH的支持回电
CPC_main_story_events.113.d: "中国国防阵线西北中央政府及中共中央委员会诸君敬启：\n\n我们收到了贵方来电，并真切认可贵方为民族独立自由事业作出的重大努力，本人[AZH.GetLeader]谨代表[AZH.GetName]政府向贵方致以崇高敬意。\n感谢贵方尊重我国内政之独立自主，并未信服印共（马列）的一面之词。我国新近统一，国内诸多弊病亟需改革，我们需要长久且切实的和平。\n目前虽然我方仍处于共荣圈之军事同盟之中，但我方愿意接受贵方的提议，在贵方掀起统一战争之时，我方绝不参与共荣圈任何军事活动。但若因日本压力被迫在非战争领域对贵方造成不利，则是无奈之举，万望贵方海涵。\n\n此外，我方也期待同贵方进行秘密会谈以确定印共（马列）之政党地位、阿鲁纳恰尔之领土归属等争议问题。\n\n[AZH.GetName]国家元首 [AZH.GetLeader]\n谨上"
CPC_main_story_events.113.o: "去掉一个后顾之忧。"
CPC_main_story_events.113.o_tt: "根据和约内容，§x解放战争§!拉开帷幕之时，印度将§G不会插手§!中国的内部事务。\n\n制作组注：更多§Y外交博弈§!后续内容将在§Y1.2版本：雾隐孤鸿§!中呈现。"
CPC_main_story_events.114.t: "印度回电" #反对回电
CPC_main_story_events.114.d: "中国国防阵线西北中央政府及中共中央委员会诸君敬启：\n\n我们收到了贵方来电，我们认为贵方意图利用印共（马列）这一极左恐怖组织干涉我国内政。\n我方现在严正表达抗议，印度国内一切问题不容外部势力插手。我们绝不屈从于贵方的政治要挟企图，任何试图利用我们国内问题逼迫我国作出妥协让步的行为都将遭到我方拒绝，我们的国防力量也做好了一切抵御外部颠覆力量的准备！\n期望贵方早日放弃幻想，莫要再插手我方内政，否则我方将不得不行使合法合宪之国防权力，届时若启战端，责任全在贵方！"
CPC_main_story_events.114.o: "软硬不吃，实属朽木不可雕也！"
CPC_main_story_events.114.o_tt: "我们将引导§G印共（马列）§!建立革命根据地，为未来§x解放全印度§!打下基础。\n\n制作组注：更多§Y外交博弈§!后续内容将在§Y1.2版本：雾隐孤鸿§!中呈现。"
CPC_main_story_events.115.t: "哀牢山中的红星"
CPC_main_story_events.115.d: "滇桂黔边纵队是在群众斗争中成长和壮大起来的一支队伍，在西南敌后坚持斗争多年时间，活动的地区遍布桂西、桂西南、黔西南、黔西北及云南全省。一九四九年十月间，由于大西北保卫战的爆发和云南人民反对龙云投降的愤懑情绪普遍高涨，滇东南人民首先在中国共产党的领导下于西山地区发动武装起义，诞生了这支队伍。这支队伍成立后，即以当地的少数民族抗日同胞为骨干，粉碎敌伪保安团一个团的围攻，并向南进展。先后经过马厂之役，攻克师宗，横渡盘江，打下广南县城，继而向滇越边境进军，与桂滇边的游击队会师进行整训。一九五零年三月，中共桂滇边工作委员会和云南省工作委员会根据中共西南局关于加强对边界地区武装部队领导的指示，桂滇边人民游击队与云南、贵州境内的部分人民游击队合编为中国人民解放军滇桂黔边纵队，下辖多支游击总队。目前经过多年发展，纵队规模总计共达到一万余人，解放县城十余座，解放乡镇一百余处；解放人口两百万，占云南全省人口五分之一；解放区及游击区的面积占全省四分之一。云南民间枪支多，人民反卢汉匪帮的斗志高昂，因此组织起来的民兵很坚强，给敌人的打击不仅频繁且非常的大。卢汉匪帮视边纵为心腹之患，多次派遣反动武装重兵围剿，欲除之而后快。四川解放后，根据中共中央对西南局、云南工委与边纵下达的紧急指示，要求滇桂黔纵队接受来自西北、四川、广东等地的援助，尽力扩大游击范围，有条件下还可以对敌展开运动歼灭战，挤压伪军活动空间。并以农村为中心逐渐包围敌伪控制的城市，争取开辟并稳定控制滇越、滇缅等陆地交通线与山林通道。为配合中央打开东南亚革命局势的重大战略，在下一步计划的行动中，位于西南地区的滇桂黔边纵将对全局发挥至关重要的作用。"
CPC_main_story_events.115.o: "云贵高原上的星星之火。"
CPC_main_story_events.115.o_tt: "制作组注：更多§Y滇桂黔边纵§!的剧情及玩法内容将在§Y1.2版本：雾隐孤鸿§!中呈现。"
CPC_main_story_events.116.t: "平凡一天"
CPC_main_story_events.116.d: "清晨，天水军械厂的厂区还笼罩在一层薄雾之中。老马掀开窗帘，看见厂区的小路被湿润的晨光照亮，几只麻雀在树杈间跳跃，气氛宁静而祥和。这里是工厂自建的社区，虽然离市区不远，但厂区内自成一体，生活井然有序。\n\n在食堂吃完早餐后，老马走向厂区车间，开始一天的工作。车间内机器轰鸣，工人们已经穿戴好设备，开始了忙碌的工作，老马负责的是装配线上的焊接，虽然是中等水平的岗位，但在厂里也算是技术工种，前途光明。每天，他都在这里和其他工友们一起，按部就班地完成生产任务，大家的精力全都集中在机器和工具上，但偶尔也会有几句打趣的玩笑在空气中飘扬。午休时间，厂区内的一小片绿地公园成了大家的放松场所，一些户外健身的器材也在此处摆放，不少工人也在这里做着饭后运动，为下午的工作提振精神。下午的工作比上午稍显轻松，老马和其他工人把装配线上的问题逐一解决，渐渐进入了工作的尾声。太阳西斜，时钟也滴滴答答地走向七点，下班时间快到了。\n\n铃声响起，老马摘下工作帽，和工友们一边聊天一边走出车间。回到公寓楼下，老马抬头望着新建不久的小区，心里一阵温暖。厂里不仅有了更好的住宿条件，生活配套设施也日益完善，供销社、医院和电影院等基本服务设施，几乎解决了厂区工人们所有的日常需求。新建的健身房和图书馆，也成了大家日常生活的一部分。老马顺道去供销社买了点水果后走进家门，妻子正在厨房忙碌，儿子也早早从工厂小学放学回家，正在客厅里写着作业。\n\n工人们各自回到了自己的家，公寓的各个窗户逐渐亮起灯光，开始度过一天最后的时光。老马与妻子一起陪着孩子吃晚饭，偶尔聊聊工作，偶尔谈谈孩子的学习和生活。平凡的一天过去了，但对老马而言，这样的日子比过去幸福多了。相较于不知何时的解放东部，日复一日的抗日宣传，都不如当下和家人过好每一天来得实在。\n\n窗外的灯光如星辰般点缀在厂区的夜空下，而老马的生活，也在这片灯光下悄悄延续。"
CPC_main_story_events.116.o: "革命要继续，但生活也要继续。"
CPC_main_story_events.117.t: "三大件"
CPC_main_story_events.117.d: "不同于往日的门可罗雀，永新路旁的百货商店如今人满为患。但商店店员并不担心百货商品不够销售，因为前段时间，市计委才下达了“产品投放”的指令，不仅货架上商品充足，仓库里亦是如此。小高一边结算着顾客的商品，一边登记着顾客的购物卡片，而前来购物的客人们也是洋溢着笑容，毕竟现在是购物的好机会，人人都想凑齐三大件——自行车、收音机、缝纫机。\n\n小王骑着新买的自行车，从家中赶往报社。崭新的二八大纲上涂着红褐色的防锈漆，在阳光下泛起鲜艳的色泽。龙头的铃铛清脆作响，小王拨动数次，即便前方没车，也感受着新车带给他的喜悦。在过去，每天一大早就得赶着公交车去上班，如果没有赶上，那只能等待很久以后的下一班车了。但现在不同了，有了自行车，他便不用担心自己会因为赶不上公交车而迟到，也不用把那么多的时间放在等待公交上。小王吹着口哨，感受着自由的微风轻拂着他的脸，圆框眼镜下的眼角也是笑意盎然。\n重庆的胡同内，杨大爷正在躺在躺椅上，看着报纸，听着收音机——这是在厂里工作的女婿送给他的。咿咿呀呀的川剧通过电波传送到收音机的天线，紧接着伴随电阻的沙沙声一同涌出扬声器。“我家住赤州火塘内，父子八人把宋归……”，《五台会兄》的唱词从收音机涌出，敲锣打鼓声也清晰可闻。杨大爷连说几个“好”字，虽然他不在表演现场，但他仍然能想象出台上演员的精彩表演，想象得出川剧变脸的精绝。杨大爷收起报纸，泡了一壶热茶，一边细细品茗，一边细细听剧。看着收音机，心想：自己这个女婿真厉害，搞来这么个好东西。“早晚我要将你的性命追，我要板尔的翅来劈尔的腿，我还要吃你的血来壮某的威！”演罢戏终，收音机里传来如雷鸣般的掌声，收音机外的杨大爷也高呼过瘾，啧啧称奇。\n“妈，我想要一条裙子！”刘大姐的小女儿再一次向母亲撒娇道，虽然很可能依旧是拒绝。“好~，我来帮你新做一条。”不同以往，刘大妈这次果断的答应了。她用量衣尺细细地测量着女儿的身体数据，然后从橱柜中拿出藏青色的布匹，开始进行裁剪。裁剪好布料后，刘大妈开始坐在丈夫新买的缝纫机前，给女儿做一条裙子，她把脚放在踏板上，有规律的拨动，缝纫针也随着一起穿线收拉。两天后，小女儿穿着一间藏青色的碎花连衣裙，高高兴兴地走进学校。女儿高兴，刘大妈也甚是高兴。"
CPC_main_story_events.117.o: "“我也想要一辆自行车！”"
CPC_main_story_events.118.t: "新社会的新工业"
CPC_main_story_events.118.d: "依照要求，姚队长的车队正运输着城市里生产小拖拉机，领导让他们务必今天将其送到农场。姚队长对此多少有些抱怨，因为目标农场路途遥远，而农村条件怎么比也没有城市舒服。但任务就是任务，不乐意也得完成，姚队长想着。卡车驶过桥梁，跨过渭河，不一会儿便到达了农场。“这里是农村？”姚队长点起一支烟，诧异地看着车窗外。\n\n农场周围有一个钢铁厂、一个水泥厂以及一个肥料厂，虽然面积都比西安市内的小不少，但是看设备依旧能一眼辨别出来。在他眼中，这怎么也不像是农村。将拖拉机从车上卸下后，他给过来帮忙的农民递上一根烟，问：“你们这些厂子啥时候建的，平时的生产用电怎么解决？”农民吸了口烟，说道：“你说这些啊，都是两年前建的，我们村改造成合作社农场后，因为南边有一小片铁矿，所以就修建了一个小冶铁厂；北边河流里面的砂石非常适合造水泥，于是又修建了一个水泥厂；至于肥料厂，我们农场里每天那么多人的屎尿，不妥善处理容易得病。想着不浪费，建了个肥料厂处理这些废物，处理完后还能用来施肥。”农民带着姚队长往水泥厂走去，在水泥厂旁边，还有一个小发电厂。农民指着发电厂说：“看见没，靠那个发电，这是城里工程师过来指导援建的。我们从隔壁的煤田购买煤，驱动蒸汽机带动发电机发电。虽然也可以用柴油机，但用柴油机太浪费了，拖拉机还要吃油呢。”\n\n“那你们平时炼的铁都运去哪，毕竟造农具也不需要那么多铁。”姚队长问道。“当然是运到城里去” 农民说道，“城市钢铁厂生产的钢铁大部分都用去造武器了，毕竟大厂质量就是比我们这些小厂好，为了弥补空白，城市里面大部分民用品的铁都是从我们这一类小厂采购的。”姚队长看着这些小工厂，感到新鲜。一般而言，工厂都是建在城市里的，在农村里建工厂属实一件稀罕事。不远处的教室里，传来了孩子们的朗朗书声。一个带着眼镜的年轻人站在讲台上，教孩子们读书写字。看上去是个知青，姚队长心想。“我看村里不少是你我这样的中年人” 姚队长问，“像那个知青一样的半大小子呢？” 农民回复道：“不少人进城打工了，多是一些挖洞造楼的土木工作，需要不少临时工。虽然工资不高，但好在城市里管饭。”姚队长点点头，确实想起来西安市内有不少年轻的土木工在挖防空洞。\n\n还真得多出来走走，姚队长心想，不然就要成为井底之蛙了。"
CPC_main_story_events.118.o: "城市，农村，齐头并进。"
CPC_main_story_events.119.t: "炉火"
CPC_main_story_events.119.d: "老吴是化工厂的老工人了，厂里分配的物资已经成为生活的定心丸。每月初，工厂的供应站都会根据大家的“工龄”和家庭人口发放米、面、布料、煤炭等生活必需品，老吴家五口人，每次可以领到20斤的面粉、10斤的煤块和一卷粗布。厂里的工会也会为每个家庭发放限量的肉票和油票，这样老吴一家每个月还可以吃上几顿带油水的饭。\n\n月初，他照例带着自己的物资票，排在供应站长长的队伍里。排在他前面的都是老面孔，大家说说笑笑中，抱怨着天气寒冷，但语气里充满了对即将拿到物资的满足感。老吴心想，尽管条件艰苦，但有单位的照顾，日子过得也尚可。排队时，他和一旁的老李聊了起来。老李说，最近的煤矿运输不大顺利，估计这次煤的供应会少些。老吴叹了口气，不过，他还是安心地排着队，毕竟厂里总归会照顾到他们的。\n终于轮到他了，老吴把煤票递给了站里的小刘，小刘把秤一提，称出一小袋煤块，笑着对老吴说：“吴师傅，今天煤少了点儿，大家得省着点烧，过两天再来追加。”老吴点点头，拿上袋子，把煤块放在肩上。接下来是布票，这块布他要攒起来，准备等下个月领到布后，给小儿子做件厚棉衣。今年孩子们的衣物紧缺，厂里也早早发出倡议，鼓励大家自己动手做棉衣。\n回到家，老吴把煤块倒进煤箱，妻子已经在炉子上开始烧热水了。屋里顿时暖和了些。妻子从抽屉里拿出一个布票本，看着上面攒下的几张布票，说：“再攒两个月的票，给孩子们都做上新衣服，到时候就不怕冷了。”老吴笑了笑，把今天分到的粗布递给她：“咱们再省些，厂里每月有供应。” 晚饭时，妻子在灶上蒸了两个白面馒头，又加了一点儿油，把午饭剩的白菜炖了炖，虽然清淡，但老吴吃得很香。吃饭的时候，孩子们嚷嚷着冷，老吴安慰他们：“耐心些，厂里已经在给咱们申请额外的煤呢。等几天就能多烧火了。”孩子们点点头，停止了吵闹。\n饭后，老吴点着煤炉上的火，带着两个儿子围在桌前，让孩子们坐下温习功课。孩子们学得很用心。火苗在煤炉里不断窜出，温暖着这个小小的五口之家。"
CPC_main_story_events.119.o: "过两天，那炉火还能烧得更通红。"
CPC_main_story_events.120.t: "神龟寿尽"
CPC_main_story_events.120.d: "盛世才躲在迪化的地堡里，外面的枪炮声逐渐熄灭，取而代之的是来回的踱步声。“这里有扇铁门！”门外的声音说道。不一会儿，铁门被打开，共产党的士兵们发现了躲在其中的盛世才。“将军，找到了！”一个士兵说道。盛世才看见，一个久日未见的对手走上前来，来者同自己一样，早已不再年轻，满面白鬓——是马仲英。“好久不见啊，盛世才。”马仲英问道，“你可曾想过，你最终还是栽在我手里了？”盛世才没有回答这个问题，而是跟马仲英要了火柴和香烟。马仲英将自己的烟盒递给了他，盛世才拿出一支烟，点上并深吸一口，惨笑着对马仲英说道：“仲英老弟，这迪化城之后就是你的了。我奉劝你一句，跟共产党合作，没有好下场，我就是例子！”盛世才将烟掐灭，束手伏诛。\n\n西安的会议室内，中央众人得知活捉盛世才的消息后喜上眉梢，随机电令新疆方面将盛世才押送回西安。“终于抓住这个老狐狸了”陈毅高兴地说道，“可以给死去的同志们报仇了！”毛泽东的眼里亦是止不住的笑意，弟弟沉冤得雪，心头一块大石此刻终于落地。\n\n数日后，盛世才被押至西安，进行审判。这次审判是一场公审，法官、公诉人和被告人的面前都有着一个话筒，以便时时广播审判过程。除了一些细节问题，盛世才并没有否认自己的所作所为，他承认了自己的所有罪行，平静的等待着法院的审判。最终，西安市人民法院判处盛世才反革命罪，谋杀罪，等数罪并罚，判处死刑。盛世才没有异议，表示法庭的审判是公正的，他缓步离开法院，等待着死刑的那一天。\n刑期当日，出于人道主义关怀，监狱同意盛世才选择自己的最后一餐。盛世才只点了一个烤馕饼，狱警问他还要些什么，盛世才回答道：“不用了，我这一辈子吃的够多了，不差这一点。”吃完馕饼后，盛世才被带到一片空地，带上头套，透着织线缝隙处的光，他隐隐看见行刑员缓缓举起的枪口。“砰——！”一声枪响，统治新疆三十年的一代枭雄就此退出历史舞台。"
CPC_main_story_events.120.o: "君子报仇，十年不晚。"
#### 雷锋事件链 ###
CPC_main_story_events.121.t: "翻身"
CPC_main_story_events.121.d: "清晨，军马无精打采地扫着尾巴。早饭过后，团部召开“控诉大会”，专门教育新近整编的解放战士。“解放战士”们三五成群，散漫走来，交头接耳，漫不经心。台上的蓬布忽然拉开，一段醒目的大字冲入眼帘：“控诉旧社会，控诉旧军队，控诉旧军官！”。\n\n除主持会场的李政委外，台上只剩下垂头丧气准备挨批的国军军官们。台下的解放战士看着曾经的上司，眼中还带着些许恐惧。李政委清了清嗓子，走到桌前朗声道：“今天我们控诉，是为了让大家明白穷人、士兵的苦根，我们解放军是为谁扛枪，为谁打仗！有人说我是共党，怎么可能了解旧军队的苦？我就是从旧军队里出来的，上军校时，教官不但打骂我们这些学员，还叫嚣‘兵就是打出来的’。在座的各位大多朝不保夕前途无望，套上这身黄皮还不是出于无奈！”引导中，解放战士们陷入沉思，会场氛围开始转变。\n\n“我来！”一位年轻小伙跨上讲台，操着湖南话在台上诉苦，“我家祖辈九代，都是给地主扛活的，父亲因为参加过农运被汉奸打死，母亲也被地主玷污自尽，剩下的人都被饿死，我也成了孤儿。后来乡里的保长让我代了地主家的丁，一路被捆来四川。路上还有几个乡亲，水土不服发了病，军官索性割断绳子，在路边把他们活活打死。”湖南小伙愈发激动，指向了一位国军军官：“就是这个‘何疯子’，地地道道不折不扣的活阎王。正步走不齐，就让全连下跪；打枪打不中，就狠狠抽你几下。半年前那个小董，因为受不了折磨脱队，被抓回来扒光了绑在柱子上，一人一刀给刺死了！”眼泪不自觉地从眼角流出，压抑的情绪击溃了泪腺，湖南伢子泣不成声，掩面痛哭。一传十十传百，哭声掀开了解放战士的心房：不甘的哭嚎，积压的愤怒，生而为人却当牛做马的屈辱悲愤化作冲天的烈焰，照得受审军官瑟瑟发抖。\n\n会后，湖南小伙主动找到了团政委，开口便说：“政委，我要参加解放军，我要帮助穷苦人。”政委微微一笑，问道：“小同志，刚刚表现得很不错，你叫什么名字呀？”"
CPC_main_story_events.121.o: "“我叫雷正兴！”"
CPC_main_story_events.122.t: "光荣的使命"
CPC_main_story_events.122.d: "326高地上，成片的大树被炸得七歪八扭。雷正兴此时已改名为雷锋——受团里举荐考入军校后他便改了名，立志要为党和人民做先锋，毕业后第一站便是去缅甸支援清剿毒贩和伪军游击队的行动。就在刚刚，雷锋带着两个班趁夜一举收复326高地。但没等屁股坐热，敌人就又摸了上来，企图夺回阵地。雷锋将仅存的战友分成两个战斗小组，打退了敌人一轮又一轮冲击。天昏地暗，流弹横飞，战友们一个一个倒下，最后雷锋发现，阵地上只剩下他一个人了。子弹打光了，手榴弹也扔光了，雷锋给步枪装上刺刀，准备同敌人殊死肉搏。忽然间一发炮弹袭来，将余下的敌人炸上了天，而雷锋也被扬尘和冲击波掀翻过去，摔倒昏迷。\n\n当雷锋苏醒过来时，发现自己躺在病床上，才知道身上有数处枪伤。他不顾伤痛，向医生请求归队，医院领导一口驳回：“不行！你满身都是伤，回去是给部队添麻烦，还是转业吧”。大难不死的雷锋依旧思念九泉之下的战友，但更思想念朝夕相处的同志，医生的劝阻自然挡不住他。\n\n一个月后能下地了，他便找到办事处，想要借车回到部队驻地。但人家只管食宿，不管找车，无奈雷锋只得自己想办法。每天吃完饭，雷锋就跑上各主干道，见车便问：“是不是第三师第五团的？”，功夫不负有心人，没几天便等来了第三师拉服装的车。于是雷锋爬上卡车，回到部队，师、团领导们大喜过望，紧紧握着雷锋的手:“哎呀雷锋同志，当时伤那么重，都以为你要牺牲了，不少干部战士还哭了。没想到，真没想到！”\n\n直到这时雷锋才知道，他在战斗里前前后后杀敌数十人，一直坚持到支援赶来。几天后，中央授予他一枚“一级战斗英雄”勋章；半年后病情好转，受中央领导接见时又被授予一枚“八一奖章”。荣誉和赞美固然耀眼，但这些并不是雷锋想要的，他常常在日记中为抢救自己而牺牲的烈士发誓：“我一定归队，将自己的一切贡献给革命，多杀几个鬼子汉奸，为千千万万个阶级兄弟报仇！”\n\n架不住雷锋的“软磨硬泡”，师长把雷锋喊来:“你不是天天吵着要分配工作吗？师部缺个参谋，你能胜任吗？”"
CPC_main_story_events.122.o: "“保证完成任务！”"
CPC_main_story_events.123.t: "光荣的抉择"
CPC_main_story_events.123.d: "在解放军中，基层指导员一直是拓展革命队伍的先锋。雷锋，曾经的雷正兴，现在也是其中的佼佼者了。参军入党后他被调到解放军第一四八师第九团，任三营机枪连指导员。在改造运动里，他一次次成功地把士兵群众的仇恨引导到旧制度上，得到了上下官兵的一致好评。\n\n某一天，师、团政委找到雷锋，决定将他和本营八连王指导员对调工作。“八连的控诉运动没搞好。前两天，八连士兵集体到团里请愿，非要把他们原来的洪连长揪回连队批斗”团政委解释道。师政委是多年的老政工，细致分析道：“八连的控诉运动未能将士兵的仇恨引导到军阀制度上。你去了以后，八连的控诉运动一部分要重搞，要在根本问题上深入下去。”\n\n雷锋刚到八连，士兵就围了上来，七嘴八舌倾诉苦水。雷锋从这些士兵的眼中看到了过去的自己，愤懑与不甘令他们对曾经直接压迫他们的人充满仇恨。雷锋明白，士兵们的仇恨是控诉运动激发出来的，这股仇恨是改造起义部队根本的内在动力，堵不如疏，他索性放下别的事，做起士兵的思想工作：“在旧军队喝兵血的，就他洪连长一个吗？”“岂止他一个？”士兵们几乎嚷了起来。\n\n“那么，在旧军队，要是你们也当上了军官，能做到不打骂士兵，不贪污粮饷么？” 雷锋的这一问，士兵们哑然了。雷锋不再发问，耐心劝道:“你们大家，包括我本人受的苦，根子在旧制度上。旧制度在，官大一级压死人，没有洪连长，会有张连长、李连长。旧制度在，相当一部分受压迫的士兵一旦混上个一官半职，保不准也会变成人人痛恨的‘洪连长’。我们控诉旧军队不是为了报私仇。仇恨应该集中到旧的社会制度和军阀制度上去。”\n\n大部分人气顺了许多，但还有人不服:“ 难道他就没责任了？”\n“不！” 雷锋斩钉截铁地回答。“他有无法推卸的责任，但共产党有政策。处置他对解放全国不但无益，反而影响很坏。日后谁还敢率部起义？你们要相信组织会教育他，你们也要相信洪连长会交代罪行提高认识的。至于他将来如何，要看他的表现，若能回来，我敢说，经过改造，他不会再是从前的洪连长了。”这么一通解释，士兵接受了，一场小风波也随即平息。"
CPC_main_story_events.123.o: "洗心革面的改造，脱胎换骨的变化。"
#### 毛岸英 ###
CPC_main_story_events.124.t: "北麓飞书"
CPC_main_story_events.124.d: "阿拉木图，哈萨克最大的城市，宛若天山脚下的一颗明珠。薄薄的云雾覆盖在山脉上，如梦似幻。阳光洒在山峰的积雪上，散发出璀璨的光芒，跃然一幅绝美的画卷。\n办公楼里的谢尔盖整理完军队的杂务，便着手指定新的训练计划。“咚咚咚——”一阵急促的敲门声传来，“请进！”谢尔盖专注于案卷，头也不抬地说道。一个哈萨克小伙从门外钻了进来，是谢尔盖的朋友阿米尔。阿米尔嘴上带着笑：“谢尔盖，快看今天的报纸！”说着将手中的报纸递给了谢尔盖。谢尔盖纳闷地接过报纸，但硕大而清晰的标题即刻让人明白事情的重要性，至少是对他的重要性——中共统一新疆。\n\n谢尔盖放下手中的工作，立刻写了一封信，托人通过电报或驿站寄送中共。信件随着电波和马蹄，越过天山、穿过大漠、行过吐鲁番。两周之后，一封回信被陈放在他的办公桌前，信封内有两张信纸——一张是既熟悉又陌生的中文，一张是翻译好的俄文。他拿起俄文版，看见寄信者的名字，心情不由得激动起来。\n\n“见字如面。此时提笔，思绪万千，不知从何说起。自别离已二十载，父心常悬，昼夜牵挂，今闻你安然无恙，心中大石稍稍落地。虽山河阻隔，信笺传情，望此一纸能略解你我之间久积的乡思与隔世之感。”\n“二十年来，你由弱冠而至不惑，历尽沧桑。烽烟飘飘，国家与个人命运皆悬一线。苏联解体，你流落于哈萨克之地，音讯全无。今得书信，方知你独自一人在异国他乡，克服种种艰难，靠勤劳与毅力自立于世。此情此景，我尤欣慰。”\n“新疆虽已解放，然全国革命尚未成功，仍需无数人挥洒汗水。你身在海外多年，当积累了不少阅历与见识，然形势诡谲，望你照顾好弟妹，照顾好贺妈妈，待全国解放，再行归国之事。” \n “愿你珍重身体，莫负岁月磨砺。若有归国之日，父必等你相见。万里长征虽难，亲人团聚终是可期。”"
CPC_main_story_events.124.o: "落款处：毛泽东"
CPC_main_story_events.125.t: "游子归乡"
CPC_main_story_events.125.d: "天皇终战的颓音和中国人民的欢呼再一次随着电波传遍了世界。从都柏林到马加丹，从安克雷奇到巴塔哥尼亚。\n\n由何平播报的新中国宣言正随着他铿锵有力的声音温暖着书房当中的每一个人：毛岸英、毛岸青还有贺子珍。他们互相看看彼此，眼神中透露出欣喜和遗憾——欣喜的是，祖国解放之梦圆满，人民当家作主的新中国已经建立起来；遗憾的是，他们的伟大导师————毛泽东，也早已逝世。\n仅仅半日后，批复准许毛岸英携眷回国的信件就送到了他的家中，送信来的克孜勒朋友满脸笑容，转交给毛岸英另一封信件：“这是中央致中共的信件，请谢尔盖同志务必转交中共中央。然后，我的中国朋友，漂泊的游侠，我向你致意——该回家了！”\n毛岸英也紧紧握住对方的手，喜悦与感激之情溢于言表：“此行不是永别，我们一定再见！”毛岸英一面让毛岸青整理物品，准备回家；一面去和党内军中的同事和朋友们道别。\n“回去后一定要常联络！”“拍点中国的照片寄回来！”“代我向中国的同志问好！”哈萨克的同志们在惜别中祝贺毛岸英的归乡，数天准备后，毛岸英带着家人，踏上归途。\n\n到达西安后，得知毛岸英回国消息的中共高层们早早便在城外等待。毛岸英穿过欢迎的人群，和中央的各位元老们一一握手。\n“爸爸的事情，我已经知道了……他临走前能得知新中国的建立，这是好事，比我们父子未能相见的遗憾要好得多。”他感慨道，“我听说西安市中心矗立起他的雕像了……”"
CPC_main_story_events.125.o: "“……我想安顿下来后立即去看看。”"
#######
CPC_main_story_events.126.t: "“老朋友”"
CPC_main_story_events.126.d: "新德里的炎热总是把当地人的脑子熏得昏昏沉沉，但在蒋经国眼里它却宛如一颗越品越使人清醒的苦胆，相似的天气令他无时无地不在怀念重庆岁月——以及那正处于旭日炙烤下的祖国。\n\n犹记得，在重庆政府耻辱性的结局里，被裹挟于大流中的他如一片无依的落叶，在逃亡的飞机上绝望地最后瞥了一眼故土：风雨飘摇，山河破碎，青天白日被汪逆叛徒玷污蒙尘，自己也被迫踏上了不问归期的亡途。\n\n抗战终结后，美国接受了这些蒋氏国民党的流亡者，并以这群人为班底在自己的领土上组建了“中华民国临时政府”，这种承认成为国民党人最后一根救命稻草；在美国的授意下，以孙科为名义主席，实则由宋美龄垂帘听政的“自由中国”就这样迎来了自己的“新生”。\n\n倘若父亲还活着，党国是不是就不至于沦落至此呢？现在的蒋经国已无心假设了。\n为了摆脱“母亲”那喋喋不休的指令，他自告奋勇与“国防部长”孙立人一起来到了印度共和国，在这里重新组建起属于国民党的抵抗组织。皇天不负有心人，拜日本人侵略压迫的贪婪本性，经过他们多年的积极联络，越来越多的敌占区抵抗军加入了队伍。从热血的爱国青年，到昔日曾忠于蒋介石政府的国军及军统人员、乃至即便是在伪南京政府与军阀集团内部，也不乏存在的反正者。这支完全听从蒋经国指挥的地下大军，被前者统一冠名为“三民主义复国军”，他们潜伏于暗处伺机而动，随时准备响应党中央的号召，让青天白日洗尽污垢，让正统三民主义的光辉再度照耀中国…\n\n当然，同样不能忘掉的，还有国民党的那群老对手——\n譬如，正坐在蒋经国对面的老共产党人陈毅。\n“客套的话，作为革命军人我就不多说了；陈先生，好久不见。”"
CPC_main_story_events.126.o: "老朋友，新故事。"
CPC_main_story_events.126.o_tt: "流亡海外的£GNG_chinese_nation_texticon §m国民党残党§!将在§Y1.2版本：雾隐孤鸿§!中以他们的独特方式参与到中国解放的历史进程中来。"
CPC_main_story_events.127.t: "千年天山下"
CPC_main_story_events.127.d: "这是一个寒冷的年份，像从前的时光里的冬天一样寒冷，只是从某一天起，有灯火在这段长夜里被点亮，和从千百里之外来到这片山脉下的人一起迎接雪花的飘落，为打通连接新疆与阵线的这条道路做一份贡献。\n楚家梁从睡眠中醒了，他刚做了个梦，里头内容是有数不尽的车从他修的这条路经过。苏醒的他抓起自己的棉帽戴上，只嘟囔了一句不知道还有多久，就裹上了棉衣走了出去。\n\n马上天就亮了，不过现在看什么东西都有点灰蓝，家梁住的屋外头放的水没有上冻，他把手伸进斑驳的水盆内，冻的呲着牙把脸洗了。\n咔、咔、咔。工地上有很多工人边啃着干粮边挥舞着镐头给冻土打出一个个小坑，家梁和身边的工友都干的身体发红发热。\n\n“家梁，你说今个咱能吃啥饭？”\n“我不着，你劳去湖上林里猎个鱼肉，教工地上开开荤。”\n家梁的话虽然这样说，可还是回头朝瘦削的书记问了一嘴，这一嘴不但有饭的事儿，还有他那个梦能不能成事儿。\n\n书记简单喊回去：“今铺上三里路，保你们都是热菜热酒。”这话被一些休息着的工人应了回去，拎起自己的工具回到劳动的一线。\n他已经收到消息了，面前的道路通车之后，马上会有车队驶入新疆，当中的乘客会有解放军、教师、医生、工人、党员干部。他们能让新疆人民过上更幸福安定的生活。"
CPC_main_story_events.127.o: "为了人民，翻越过去吧。"
CPC_main_story_events.128.t: "顾命大臣"
CPC_main_story_events.128.d: "“你直接坐，我现在腿脚不方便，就不站起来了。”见到邓小平前来，一向不服老的毛泽东一反常态说道，“恩来现在怎么样？”邓小平摇摇头说道：“积劳成疾，医生说不太乐观。”\n沉默半晌，毛泽东在身上摸索着烟盒——但那东西好久之前就被秘书藏起来了。于是他只得自嘲道：“都嫌我老，有些人觉得我应该尽快退。但依我看，无论是刘少奇、林彪，还是高岗、薄一波、习仲勋，都差点火候。”\n\n毛泽东突如其来的自嘲和对其他干部的点评让邓小平一时不知如何回应，只好点头赞许。毛泽东继续没头没尾地说道：“我们目前的干部，像严嵩这种鱼肉人民的大野心家是没有的，但像徐阶，或者高拱的人却不少。”邓小平一边应着他的话，一边暗自嘀咕着毛泽东突然来两句明史是什么意思。“徐阶虽然很务实，能力很强，但他很贪，而且只会给朝廷当裱糊匠，不谋全局者，不足以谋一域，政权早晚会亡在这种人手里；高拱虽然锐意改革，但为人刚烈，把所有同事都给得罪了遍，最后自己也被罢黜了，有能力，却无法团结大多数把政策执行下去。”\n\n毛泽东拿出明朝的两个内阁首辅，并指出其问题所在，“我们的党，固然比这些地主士大夫好很多，清廉得多。但我们很多同志，要么只会执行党的命令，维持党的运行，就像徐阶；要么就过刚易折，不懂团结，就像髙拱。这两种人，谁都不适合领导接下来的革命和将来的建设。”邓小平听见最后一句话，惊讶地看着毛泽东，吃惊于毛泽东直白表明他对接班人问题的担忧。\n\n邓小平不敢妄自揣测毛泽东心仪的接班人，于是喝了一口茶问道：“那主席建议谁来领导接下来的工作呢？”毛泽东见邓小平小心翼翼地询问，直接说道：“我其实不放心把事情交给别人去干，毕竟党的一道命令，传递两层就变了样，大跃进时期这种事情还少么？”邓小平暗暗吃惊——毛泽东从未有像今天这样坦诚。“我们党需要一个张居正，萧规曹随，但又能解决新问题，团结大多数的人。”毛泽东说出心中合适的人选，并正视着邓小平，“我们党从现在到以后都是集体决策：理论家有张春桥、韩光这些；地方这些年也有很多像刘、纪这些好干部。中央我只操心一件事，就是刚才说的张居正——”\n\n毛泽东郑重的眼神让邓小平下意识挺直身板，天将降大任于斯人也，他确信毛泽东接下来要宣布很重要的事。毛泽东将一册明史和一册宋史递给了邓小平，说道："
CPC_main_story_events.128.o: "“——我看，你比较合适。”"
CPC_main_story_events.129.t: "军委会议"
CPC_main_story_events.129.d: "林彪坐在主座上，看着两边的将军们。他们不少是红军时期便指挥战斗的老将，不少人更是战功卓著，军中传奇。“事情难办呐”林彪低声抱怨道，他看着手中的红头文件，思考着如何组织语言说服眼前这些同僚。\n\n“林副主席，开始吧。”见林彪迟迟不发话，一向耿直的贺龙率先说道，其他将军们也纷纷点头。林彪见大家催促着开会，便借坡下驴道：“为了响应党中央干部年轻化的要求，我们解放军领导层也要年轻化，也就是说在座的部分同志需要退休。”听见退休二字，会议室里立刻炸开了锅：\n“我们解放军搞退休，要影响正常指挥的。”\n“退休是多大年龄的同志退休？人员缺口又有多大？”\n“我们和其他部门又不一样，其他部门小年轻多工作就可以胜任下一级岗位，但当将军至少得指挥过一场像样规模的战斗吧？”\n\n会议室你一言我一语，除了几个相对年轻的将领，大多反对党中央的要求。“我当红四军军长的时候也才23岁，年轻人也不差的嘛。”林彪拿自己作为例子，想着缓和现场的氛围，“在座的各位不也大多早早就上了战场？年轻人有的是闯劲。”很多人还是不服，给出各种各样的理由指出为什么不能让他们退休，林彪有些不耐烦地说道：“这是党中央的命令，不是我的！有本事你们去中央委员会闹去！党指挥枪，我们解放军要服从中央一切命令！”\n\n“那你林彪退不退？”彭德怀忽的发问，“你也就比我们小一些，我们这些老同志不少身体硬朗着呢，不比你差。”林彪反击道：“我退不退要党中央讨论后提议，如果中央要我退，那我自然遵从的中央命令。”为了防止老同志们进一步的发难，林彪果断决定："
CPC_main_story_events.129.o: "“好了，散会！”"
CPC_main_story_events.130.t: "夜会"
CPC_main_story_events.130.d: "月明星稀，林彪邀请贺龙到他家中夜谈。二人一边抽着烟，一边聊着工作。\n林彪忽然从抽屉中拿出一盒烟草，说道：“贺老总，这是我以前买的烟草，但我基本不用烟斗抽烟，我看您常用烟草抽烟，这个就送给您了。”贺龙看着林彪莫名其妙的态度，并没有接过烟草，反问：“大半夜叫我来肯定不只是讨论工作和送我烟草，说吧，还有什么事情。”\n\n林彪递出一封信给贺龙，贺龙拆开信，看见其中龙飞凤舞的文字，便知道是毛主席的信件。贺龙看着信，先是疑惑，紧接着是凄凉，最后是不满。他质问林彪道：“你和毛主席说了什么？难不成你天天在毛主席耳边吹风，说什么‘贺龙、彭德怀还有其他一些老同志不顶用了？’，你还让我去主动退休表态，这是什么意思？”\n\n“不是我让你表态，是毛主席让你表态”林彪纠正道，“这是毛主席和党中央的决定，不是我的决定，希望你能理解。“贺龙站起身来，激动地说道：“你也是中央的一员，林彪！你还是军委副主席，你的意见怎么可能不重要？我老归老，但不是不中用！怎么，你想着提拔你那些在军中的小徒弟们，好控制军委，当蒋介石第二？”听见此等指控，林彪也站起声来，严肃说道：“贺龙同志，请注意你的言辞。所有提拔名单都是军委拟定，党中央批准的，一切审查考核都是按程序执行。你无权将解放军这个人民的军队，民主的军队描绘成蒋介石的私军。你若是对党中央的命令不满，你可以找党中央申诉，而不是诋毁人民军队。” \n\n“好、好……我看出来了，你也只是为了你的目的在办事情，你只要把我们这些老家伙都赶走，你的前程就一片光明了。”贺龙见林彪如此绝决，无力和愤懑涌上心头，拿出笔纸，“好，毛主席的命令我执行。”他写好退休信，递给了林彪。林彪再一次将烟草递给贺龙。贺龙摆手退回，说：“林彪同志，我希望你明白，高处不胜寒，尤其是党的高处。这盒烟你留着，以后你肯定会抽掉，我就去疗养院等着看你怎么抽下去的这盒烟。”\n\n林彪点点头，从喉咙里挤出一句话："
CPC_main_story_events.130.o: "“谢谢贺老总理解。”"
CPC_main_story_events.131.t: "演艺生涯"
CPC_main_story_events.131.d: "假使大洋彼岸的好莱坞有机会了解这些人的事迹，影史上多半会出现以中国海南为舞台中心的经典间谍电影。不过对于潘江汉来说，数十年间谍生涯只是在此处“生活”的他的总结。\n“老潘！老潘！”门外传来喊声，哪怕在这暴雨之夜也是那么清晰，随后一个看起来和潘江汉年龄相仿的中年人进来了。“冯书……呃，李老板的通知下来了，日本那边过半个月会来一批游客，这次是我们海口新区负责接待。”\n又来了，战后日本人每隔三个月多就来一批，要么是东京的阔太太，要么是西装革履的议员，又或者是什么南洋总督之类的大官……\n“刘处长啊，以后不能叫老潘，要叫郑县长！也不要叫冯书记，叫李老板。”潘江汉看着张世英——眼前这老汉也得有四十多了，怎么这么不会来事儿。“叫不习惯嘛……我们还在山里打游击的时候哪有现在这样别去，现在过一段时间就和鬼子点头哈腰，临了还得学他们那一嘴鬼子话。”张世英看着外面，叹着气。\n\n暴雨持续了两天了，但是海口新区的城市排水系统还算优秀，所以路面并没有多少积水。十几年的潜伏对于他们来说相当煎熬：宁渝合流后，冯白驹只怔怔地在屋里望着海南游击区地图独自思考了两天，除了送饭的战士谁也不见——然后，琼崖纵队消失了，冯白驹带领红军走入村镇，在那个动荡的时期和大家一起掌握了海南的经济命脉，成为了“海南地方维持会”的会长。\n\n这是一场覆盖全海南农村和小镇的骗局，而棋盘之上对弈的双方，是琼崖纵队和大日本帝国，敌人眼皮底下演双簧，他们容不得半分差池，容不得一丝马虎。最开始的时候，大家害怕露馅，他们行走在钢丝上，稍有不慎就会落入深渊。\n\n“上一次收到中央的指示是什么时候来着？”张世英望着窗外的滂沱暴雨。\n“全面隐蔽只跟华南局单线联系那会，这些年全心全意唱双簧了。”他停下笔，结束了文件的批阅，唤来传报员将海滩部分的安排发给服务部，“该加快进度了，让小陈他们加班加点，鬼子那些东西做的真麻烦。”\n“真他妈累，每次演戏都要做全套。”张世英转过头，看向潘江汉，这个已经共同作战三十年的战友。\n“打仗不简单，演戏也不简单。”两人看着彼此，脸上只留苦笑，“明明才四十几岁，怎么头发花白呢？”\n“头发白了才能在黑夜散光，给人希望呢。”"
CPC_main_story_events.131.o: "“去你的，演员当久了还给你文艺起来了，干活去！”"
CPC_main_story_events.131.o_tt: "本事件以Bilibili用户-§Y潘柏磊不想毕业（UID：349636826）§!撰写的同人小说为蓝本改编，特此声明和致谢。"
CPC_main_story_events.132.t: "猫背上的辣椒面"
CPC_main_story_events.132.d: "聚光灯打在他的脸上，令陈云有些犯困：中央今天要开一次工作会，内容是“公私合营，股权买断”——这是阵线社会主义工业计划的重要一环。陈云撇了撇搪瓷杯的盖子，浓浓的茶香扑鼻而来，茶多酚让他略显困意的眼皮重新振作了起来。“陈主任，与会人员已经到齐了。”秘书凑近到他耳边小声说道。与会者多是四川重庆来的一些民族资本家，有经营制衣厂、制盐厂的轻工业家，也有经营小型冶铁厂的重工业家。“我知道了，那开始吧。”陈云点了点头，将杯中茶水一饮而尽，“各位企业家朋友们，事不宜迟，让我们开始吧。”\n陈云向与会者们简要说明这次会议的目的——解放区工业的社会主义化，也就是川渝地区和根据地其他尚未完成改造的地区要进行产业的集体化，国有化。与会者们面面相觑，不知道是什么好。“集体化，国有化？”有的人小声嘟囔着思考着，但反应快的人已经开始直冒冷汗，暗中流泪了，心想人为刀俎我为鱼肉，自己辛辛苦苦攒下来的基业要被这帮“赤匪”夺走了。“不要这么悲观嘛。”陈云嘴上这么讲，心下却暗自嘲笑着这些资本家的丑态，“大家看这样如何，政府定期从你们手中收购股权，并且支付利息。当然了，我们也不会强买强卖，但生意真要谈不拢，我们收购股权的资金就直接投资建设新厂了。俗话说‘肥水不流外人田’，等新工厂建好后，阵线的物资采购也优先从新建的厂采购，毕竟要回本的嘛。”陈云一次回答了几乎所有关键问题，这便让与会者无法模棱两可。参会的资本家们听罢，也只得纷纷举手表示赞同，想要商讨股权收购的事宜。陈云双手抱拳在嘴前，掩盖着自己压制不住的笑意，暗暗想道：“到底还是主席的法子好用。”\n\n数日前，毛泽东给邓小平和刘少奇讲了一个笑话——\n毛：“你们想想看，怎样让一只猫吃掉辣椒面？”\n刘：“这简单，把辣椒包在鱼里面骗它吃下去。”\n毛：“再想想，还有更好的办法。”\n邓：“掰开猫的嘴直接灌就行了。”\n毛：“都不是，是把辣椒面涂抹在猫的背脊上。”\n刘和邓：“这是作甚？”\n毛泽东向两人凑近说道："
CPC_main_story_events.132.o: "“猫觉得不舒服，当然要去舔咯！”"
CPC_main_story_events.133.t: "降本增效"
CPC_main_story_events.133.d: "阳光透过厚重的玻璃，洒在铁轨般笔直的厂区大道上，融合后的新厂区显得比以往更加生机勃勃——炼钢厂和轧钢厂合并后的第一个季度，生产效率翻了一倍多。新的高炉和轧机协同运转，钢坯从炉口出来，不再需要运输到几公里外的轧钢厂，而是直接通过传送带送入轧机。厂区空气中弥漫的铁锈气味依然刺鼻，却再没有那种效率低下的沉闷。“这条新的联动生产线一天能省下多少柴油，你算过没？”车间主任一边协调工人操作，一边对旁边的技术员打趣道。技术员推了推眼镜，说道：“不止柴油，这直接省掉了一整个运输班组的工作量！咱们这线，只要不出差错，效率高得吓人！”\n\n然而，效率的提升却也带来了另一个问题：一些岗位和职能显得多余了，过去两个厂各有自己的管理层，合并后职能重叠的岗位，比如人事、行政、后勤、甚至技术支持，不得不精简。虽然厂里尽量通过内部调岗减少裁员，但仍有不少人觉得自己的地位和待遇受到了冲击。\n几个被调岗的中层干部聚在一起，发着牢骚。李工是原炼钢厂的生产调度员，合并后他被调任到厂办负责文件整理。他坐在会议桌旁，闷闷地看着手中的茶杯，嘴里嘟囔着：“什么协同高效？我看就是让我们这些老骨头下岗。优化管理？其实就是裁人呗。”\n“是啊，”坐在一旁的赵科长接过话头。他是原轧钢厂的设备负责人，合并后因设备管理部门整合，只剩一个科长位置，竞争不上的他被调到后勤组管理宿舍，“咱们干这么多年，哪个地方管道漏水、哪个阀门老出毛病，咱不比那些小年轻明白？结果一合并，搞得我一堂堂科长，现在成修宿舍水龙头的了，真是越想越窝火！”\n“哼，”李工冷笑一声，“他们看中的是年轻人、学历高的，像咱们这种靠经验干事的，他们嫌咱们‘过时’呗。”\n\n傍晚时分，厂房外的天空被余晖映得通红，厂区的广播声响起，播报着今日的表彰：“今日的总产量创历史新高！感谢所有同志的努力！” 这一刻，广播的声音掩盖了李工的叹息，淹没了赵科长的沉默。炼钢厂和轧钢厂的合并是一个新起点，在这条充满生机的钢铁脉搏上，有人意气风发，有人踟蹰徘徊。"
CPC_main_story_events.133.o: "我的职称提高了，你呢？"
CPC_main_story_events.134.t: "时代的一粒尘埃"
CPC_main_story_events.134.d: "严格来说，林峰没有工厂的正式编制工作，但他依然知道不少电器维修技巧，也就靠着这门手艺在城里东奔西走维生。他热爱生活，平日里跟街坊邻里关系不错，还总帮人修理电器。可几天前，他被指控参与一起抢劫案，但他对此一无所知。“林峰，你不要再装了！”审讯员冷冷地盯着他，一件件证据摆在桌上，“几名证人都说看到你在收音机厂的现场。你老实交代，不要想着蒙混过关！”\n\n林峰十分错愕，急忙摇头：“冤枉啊，同志！我那天去的是人家家属区给他们修风扇，根本没去过别的地方！”但审讯员显然不信，冷笑一声：“你以为装老实就能逃脱制裁？现在是肃反，从重从快！坦白从宽抗拒从严，赶紧的。”林峰感到前所未有的恐惧，平日里温暖的家逐渐在脑海里模糊，眼前的四壁犹如冰冷的囚笼。审讯进行了一轮又一轮，林峰的头脑逐渐混沌，甚至开始怀疑自己，事情怎么会这样？一旦被定罪，污名将伴随他的一生。\n\n三天后，他被正式拘押，关进了西安市看守所。看守所里，他认识了几个同样被指控的人。小李便是其中之一，他是一个街头摊贩，因一位证人的“指认”而被抓进来。小李跟林峰一样，百口莫辩，一提起自己的冤屈便失声痛哭。他告诉林峰，听说这里的人很少有能够自证清白的，“从重从快”成了他们的梦魇，谁也不知道命运如何。一周后，林峰的母亲终于得以探视他，她面容憔悴，眼睛因哭泣而肿胀。“儿啊，我相信你没有做那些事！我真是急得几夜没睡啊！”母亲布满皱纹的手紧紧握着他，眼中满是绝望。“妈，我是无辜的！”林峰咬紧牙关，哽咽着说，“但只怕……没人会相信。”母亲擦了擦眼泪，勉强笑了笑：“别怕，孩子，我想办法。”\n\n接下来几日，林母四处奔走，找到林峰的同事和街坊邻居，试图为儿子证明清白。然而，很多人怕受牵连，纷纷避而不谈。即便有几个人肯出面作证，也遭到了冷遇，甚至被告知“不要多管闲事”。一个月后，林峰的案子终于进入了审判程序。法庭上，控方出具了几份证词，但内容模糊，甚至连案发的具体时间都描述不清。林峰一遍遍申诉自己当时的行踪，但法官却充耳不闻。最终，林峰判刑五年，罪名成立。林峰被送往监狱服刑。\n\n每天清晨，他望着监室外一小片灰暗的天空，心中充满了无尽的悲哀。往日的生活仿佛成为了一个遥不可及的梦境，母亲的探视成了他仅存的安慰。每次见面，母亲都会用颤抖的手紧握住他的手，不断告诉他坚持下去，等待清白的一天。"
CPC_main_story_events.134.o: "对个人而言，这是一座大山。"
CPC_main_story_events.135.t: "立木取信"
CPC_main_story_events.135.d: "老沈揉了揉发酸的肩膀，从轧机旁站起身来。厂区的钟声刚刚响起，标志着今天的工作结束了。他看了一眼厂区高挂的大钟，指针停在晚上七点。这让他有些恍惚，过去的几年里，他习惯了工作到深夜九点才能回家。如今，新规出台后，他竟有点不适应了。\n\n新规刚出台那天，厂里召开了一次全员会议。厂长站在台上，大声宣布：“从下个月起，每天的义务劳动时长调整到四小时，必须规范安排，不能随意超时。同志们，这不是放松要求，而是为了让大家劳逸结合，提高效率！”。台下一片议论，老工人们窃窃私语：“减了两小时，生产能跟得上吗？”、“可别到头来任务完不成，咱们被追着加班。” 年轻一些的工人却多半露出欣喜的神情：“每天早回去两小时，终于能多休息会儿了！” 老沈也不知道该怎么想，过去十四小时的工作已经让他的生活变得像齿轮一样单调。早晨六点起床，赶着厂车到工区，八小时的正常工时后紧接着是厂里规定的六小时义务劳动。所谓的“义务”，其实是变相的强制，不做就意味着扣绩效、少评奖。到家时常已是深夜，吃饭、洗漱、睡觉几乎成为机械重复。\n\n但新规执行的第一天，他便切身体会到了变化。早上，工人们照常七点开工，分秒不差地进入工作当中。老沈负责的轧机组由于设备升级，生产效率提升了不少，八小时下来，基本完成了主线任务。下午三点，厂区进入义务劳动时间，车间主任照例过来分配劳动任务：“老沈，你今天负责检查传送带的磨损，四个小时够了吧？” 沈钢点点头，心想，以前这个活可得干到天黑。果然，到了六点半，主任巡视了一圈，见工作完成得差不多，便挥挥手：“收工了同志们，别拖着了！” \n\n回家后，他意外地发现，自己竟能坐下来和儿子一起吃饭，而不是像往常，孩子早已入睡。饭桌上，妻子打趣道：“每天少干两小时，看来你还得重新学怎么陪儿子吃饭！”"
CPC_main_story_events.135.o: "官无定法，民无定心。"
CPC_main_story_events.136.t: "百炼成钢"
CPC_main_story_events.136.d: "军工厂内，机器轰鸣，钢铁的气息在空气中弥漫，工人们调整机床，锻造火炮，为革命事业添砖加瓦，为精进技术再上一层。\n\n在这铁与火之间，几名普通的工人正悄然发生着改变。年轻的李德勇，原本只是从农村来的学徒工，他手指粗糙，皮肤被工艺油和灰尘覆盖。然而，李德勇的心中有着远大的梦想——成为一名出色的技术工人，为根据地的建设贡献自己的力量。每当下班后，他都会去夜校上课。除了补全自己的文化课外，还学习了很多加工技能。功夫不负有心人，随着时间的推移，李德勇逐渐从一个青涩的学徒成长为一名合格的技术工人。他不仅能熟练操作各种机械设备，还开始参与到火炮设计与改进的工作中。特别是在内膛加工的精度控制方面，李德勇提出了许多自己独到的见解，凭借扎实的理论基础和细致入微的操作技巧，工程师和老师傅都对他的进步称赞连连。\n\n与李德勇并肩奋斗的其他工人，同样技艺精湛。老张是一个来自延安的工人，尽管年过五十，但他总是孜孜不倦地工作，丝毫不减当年热情。老张年轻时在是钢铁厂的技术员，对金属性质有着敏锐的直觉。在一次火炮调试工作中，老张发现炮管内的金属热膨胀性不均匀，导致了火炮射击时的精度波动。他提出了通过改进冷却技术来解决这一问题，经过测试小组的多次实验，最终取得了成功。年轻的林霞则是光荣的女性工人，她身体健壮，在劳动中巾帼不让须眉。她刻苦钻研，学以致用，在短短几个月内便掌握了许多复杂的工艺流程。林霞尤其擅长调试精密仪器，一次，在火炮射击测试中，火炮的射击误差总是超出预期。林霞细致检查，发现炮镜镜片浮动，于是她现场对炮镜进行修理，解决了误差问题。\n\n每当火炮生产线上的新一批炮管通过检测，进入到最后的组装环节时，工人们总会聚在一起，彼此交换心得，讨论技术细节。在革命岁月里，伟大的工人们用自己的双手和智慧，构建着属于自己时代的强大力量。"
CPC_main_story_events.136.o: "群英荟萃。"
CPC_main_story_events.137.t: "青黄可接"
CPC_main_story_events.137.d: "冬去春来，正值春小麦播种的季节。陕北各合作社的代表，有的是社长，有的是财务，都来到延安市的农业银行，申请今年的春种低息贷款。“利息好低啊！”白河合作社的张社长说道，“我记得打土豪之前，地主的贷款利息动不动便是五折。”\n\n“可不是嘛。”刘会计接过话头，“地主那利息就是奔着敲骨吸髓的，共产党这利息，真是做慈善呐。”来贷款的合作社代表纷纷点头，大家都是三四十岁的中年人，自然对于儿时印象中地主的剥削无度刻骨铭心。“下一位！”银行的柜台职员说道。张社长将文件递给职员，说道：“柜台同志，这是我们合作社今年的贷款申请，去年收成还不错，种子缺口不多，所以贷款也不多。”柜台拿出一叠厚厚的记录本，核对白河合作社的耕地信息，确认无误后，她在贷款凭证盖上章，让张社长去另一个窗口领取贷款。\n\n张社长拿到贷款，喜笑颜开，连连点头称谢，他数着手中的钞票，思索着需要买多少种子。张社长一路走到农贸市场，对种子精挑细选一番后，将四麻袋种子扛上驴背，赶着毛驴回到白河村。“嘿——呦——”张社长一边吆喝，一边行走在土路上，傍晚时分，便回到合作社。他见太阳尚未落山，便让各个社员把种子赶忙播种。“社长，这个贷款大概什么时候还啊？”一个社员问道。张社长甩出两个手指，社员紧张兮兮地问道：“两个月？我们社会不会来不及还？”见社员慌张的神情，社长哈哈大笑：“两年！还是只有百分之三利率的低息贷款！”来凑热闹的社员们张大嘴巴——这简直是天上掉馅饼。\n\n“不要惊讶了，同志们！”张社长顺手将麻袋从驴背上搬下，“趁着太阳还没落山，把这些种子撒下地，早一点播种，早一点结果！”言毕，几个小伙子带着种子来到田地，一点一点地迈入土中。种子已经洒下，汗水将凝结成一片片食粮，填饱这世界上的每一个人，为一切远大理想奠基最核心的根基。"
CPC_main_story_events.137.o: "细水长流，日积月累。"
CPC_main_story_events.138.t: "大家都要买"
CPC_main_story_events.138.d: "“这科研债券，相当于一种长期存款，将来解放后，凭券可以拿到比一般银行更多的利息。”宣传员丁隆口干舌燥地科普债券知识，这已经是他宣传的第五个合作社了。大多农民们面对债券这种新玩意，很陌生，也很警惕，此前报纸常指控国统区官僚用各种苛捐杂税剥削百姓，自然心里会想，这科研债券莫非是什么捐款？\n几个合作社跑下来，丁隆早就不在乎农民们怀疑的眼神，毕竟各个合作社的社长和书记总有办法动员他们去买，于是他最后说道：“这个债券都会有一个备份在银行，这样到了年限之后，你们就可以去银行连本带息取回所有钱，相当于你们是党和国家的债主！”说完后，丁隆同书记和主任打过招呼，马不停蹄地向下一个村庄赶去。\n\n晚上下工之后，书记和主任便带着民兵，挨家挨户地动员购买债券，动之以情，晓之以理。“你看看，我，还有主任，还有所有的民兵、党员，大家都买了。前村的老李头，那么倔的一个人，他也买了点债券支持阵线的科学发展。大家都买了，难不成就你向搞特殊？”书记动员道，但更像是一种强加的命令。老张咽了咽口水，说道：“我和我老婆商量商量。”\n“这帮人要吃绝户！”老张的妻子怒骂道，“我们家是贫农，哪有啥闲钱啊？为了他们的政绩，带着民兵上门来动员，这是动哪门子员？”妻子的抱怨穿透木门，书记和随行人员听的一清二楚。“不买，一分钱也不买！”妻子指着门口骂道，“这帮半吊子别想从我这拿走一分钱，你去把他们赶走！”老张霎时脸都绿了，商量来商量去结果里外不是人，他只得硬着头皮，指望把门口几尊大佛给送走。\n\n老张倚在门口，满脸赔笑：“书记，你看我也是贫下中农，没啥积蓄，我真买不了。”书记摇摇头，说道：“老张啊老张，要有政治觉悟！你要是买了，我们社今年说不定就可以评上模范社了。”但老张又同书记扯皮了几个回合，最后书记不耐烦地说道：“行行行，你不买，那就不买嘛，一切自便！”一群人悻悻地离开，走远后，书记对主任说道：“到时候给他今年的贫农合作金停了，看他还敢不敢搞特殊。”"
CPC_main_story_events.138.o: "自愿？被自愿！"
CPC_main_story_events.139.t: "多干，多得？"
CPC_main_story_events.139.d: "工分制，顾名思义，是按照工作量来计分。中央希望在合作社内，通过工分比例分配每年的余粮，在减小通胀压力的同时方便合作社社员们享受多劳多得的好处。合作社书记将中央文件誊抄在纸，并将工分规则一并附上，带到告示栏下。\n\n书记将告示贴上栏，并对前来查看的众人解释道：“我们社内的余粮分配，以后实行工分制，大家在合作社内的工作都将一一计分，最后年末汇总，按照工分比例分配余粮，多劳多得。”部分村民露出赞许的神情，三分天注定，七分靠打拼，要是多干一些就能多分配一些余粮，确实比以前机械的分配方式好不少。有的人眼珠子开始提溜起来，盘算那些活可以多干一干；有的人嘴角微微上扬，开始畅想老婆孩子热炕头的美好未来。千里之行始于足下，拿上工具赶紧的！村民们拿起农具和工具，锄起地，打起谷，都比往日更有力气，交足国家的，留足集体的，多干的都是自己的！\n\n勤劳与瑞雪共同塑造了一个丰年，春节年关将至，村民们排着队，期待自己的工分能帮自己多领一份粮食，但事物往往在意想不到的地方会出意外。“今年的余粮就这么点？”老李头瞪大双眼问道，“今年收成不是还不错嘛？”会计小张解释道：“今年收成好，但县里征收的粮食也会多一些。”虽然谷堆仍然堆满了整个粮仓，但相较于收成还是太少了，人群开始嘀咕，怀疑自己分不到多少。小张算好工分，公之于众，人群立刻炸开了锅——不是工分有统计谬误，而是分配比例上出乎意料。由于今年村民们的奋斗，大部分人工分相当高，但彼此之间差距不大，若按照工分比例分配，每人分得的粮食还是和实行工分制之前相当。但统计无误，规则公平，躁动的村民们很快安静下来，有序拿走属于自己的那一份粮食。迷茫感染着每一个人，村民们不理解为何多劳多得，结果也和过去一样。\n\n老李头带着分配到的粮食去供销社换钱，想要买点布料，做件新衣裳，但换到手的钱却买不了足够长的布。老李头只得不情不愿地离开，吞下这不知何处而来的怨气。"
CPC_main_story_events.139.o: "大家都多干等于大家都没干！"
#雷锋结局
CPC_main_story_events.140.t: "荣誉勋章"
CPC_main_story_events.140.d: "旌旗招展，解放东北的战士们列队整齐地行进在天安门前，意气激昂地踏着正步，一队队踩过扔在长安街上的日本军旗，接受党和人民的检阅。市民、学生和工人们欢呼着，迎接着革命英雄的凯旋。\n\n阅兵之后，雷锋作为指战员优秀代表，站在天安门上发言。雷锋咽了一口口水，记起林彪视察军队时对他的褒奖：“这个年轻人要好好培养，日后有大作为！之后回关内表彰时让他上台发言”。首长都这么说，那我就认真做，雷锋心想。林彪在天安门上讲完话后，便让雷锋走到演讲台前，雷锋拿起演讲稿，看着门楼下无数面飘扬的红旗，朗声道：“今天，我很荣幸的站在这里，作为官兵优秀代表发表胜利感言。几年前，我仍是一个朝不保夕的国民党军壮丁。但当我成为一名光荣的解放军后，我的人生才获得了真正的解放。在解放军的这几年，我学习了很多，学会了‘力量从团结来，智慧从劳动来，行动从思想来，荣誉从集体来’。”\n\n广场上的学生看着没比自己大几岁的雷锋，起哄起来，让雷锋多谈谈自己成为解放军后的经历。雷锋接着说道：“一滴水只有放进大海里才永远不会干涸，一个人只有当他把自己和集体事业融合在一起的时候才能最有力量，解放军就是这种力量最直观的体现。而共产党则是引导这种力量的风向标，作为一个共产党员，我感到很荣幸，因为我拥有了为革命、为解放献出一切的资格，成为党员后的每一天，我始终告诫自己：在工作上，要向积极性最高的同志看齐；在生活上，要向水平最低的同志看齐。只有这样，才能不辜负人民对我的期待，才能更好地建设社会主义。”\n\n青年才俊的演讲打动了在场的每一个人，所有人都被这个热情的小伙子给吸引了。现场的年轻人们，或直接，或间接地将雷锋作为心中的学习榜样。雷锋继续演讲，讲到自己的战友，讲到自己的同志，讲到他在根据地所见到的每一个为革命事业奋斗的普通人。最后，他将自己比作一颗螺丝钉，诚挚地讲道：\n“为了所有人的自由与幸福，我愿永远做一个螺丝钉。人的生命是有限的，可是为人民服务是无限的。我要把有限的生命，投入到无限的为人民服务之中去！”热烈的掌声一浪接着一浪地在人群中回荡，有的学生兴高采烈喊道："
CPC_main_story_events.140.o: "“向雷锋同志学习！”"
CPC_main_story_events.141.t: "破城之楔"
CPC_main_story_events.141.d: "“班长，你说这黄河水到底是从哪里来的呢？”在许峰身旁半蹲许久的林晨问道，但对方仍盯着前方对岸的火光，漫不经心的回道：“诗里说是从天上来的，那些教书的人也这么说的，那就是天上雨下来的呗”林晨仍是追问：“可哪有那么多雨啊？这水天天流个没完”“你管那么多呢，回头再问那些知识分子吧”许峰拍了拍那小子的头，打断了他的话，许峰知道林晨这是紧张的表现，尽管林晨年纪轻轻在各项训练中就能和班里甚至团里的高手斗得难分高低，但他终究只是第一回参与这种行动，心里不打鼓又怎么可能呢？\n对岸的火光仍在烧着，是刚才山岳军那边的炮击导致的，有炮弹击中几处弹药库，引爆了那些还没被贪污掉的弹药，随后那片阵地几乎被整个掀了起来，即使那里仍有活人但估计他们的内脏基本也都被炮轰的冲击波震碎了，只希望不会有山岳军的同志不小心错误的渗透进了这些预先打算引爆的阵地上，以及祈祷被摧毁的工事上少一点令人恶心的肉泥。\n在黑夜中泅渡并不会让人感到有安全感，尤其是在对岸火光照耀之下，只是相比河水中的人，敌军似乎对于其他事物的更加重视，即使是岸防地段，损失与耗时也都远低于平时，至少在许峰这里，最大的损失莫过于几名因紧张而突然发愣受伤的同志，而在当初训练时，可是出现过成建制在泅渡时被消灭的情况，至少对于许峰他们而言，他们曾认为自己会面对敌人无穷无尽的暗堡与机枪，但当他们真正上岸却发现，他们所面对的大部分只是一些龟缩在破旧堡垒的残垣断壁中，失去军官指挥而瑟瑟发抖，随时等待被肃清的散兵。\n几乎不费力气，只是麻木地反复喊着劝降或者是将炸药包贴在堡垒外壁爆破，肃清的最后，一面面红旗在阵地的高点猎猎升起，狗牙旗被放倒扔入火中，久久不能熄灭，各登陆场的号声先后响起，而在河对岸，点点炬火则泛起于黑夜之中，正如星辰萤火般闪耀。"
CPC_main_story_events.141.o: "前路已然平坦"
CPC_main_story_events.142.t: "荣誉勋章"
CPC_main_story_events.142.d: "时间如同粘稠的石油般缓慢流动着，四周的空气中弥漫着几近令人感到窒息的气息，每一个人看上去都在无助地沉默着，精神已经颇为疲惫，不再按照既定的程序守在自己所处的岗位上。\n山西省防军中士士官赵智杰借着来自黄昏的微弱光亮观察着腕表，现在离换班已经过去了五分钟，然而却没有来哪怕一个人，此刻几乎排中的每个人都望向了自己，也望向了不远处的群山，他们在等待他的命令，而他也在等待着——这让他感到仿佛有一种前所未有的不安爬上了胸口，只恨不得马上回到自己那温暖安全的小家，今晚那异常平静的风使人感到莫名的恐惧。\n当指针悠悠的又多划过了一刻时，交班的另一个连终于平安的到来了，“辛苦了，兄弟。”“嗯，没事……”，赵智杰附和着握了握对方的手，老实说，他不认识眼前的这名军官，“你是新来的？”“嗯，是的，这不最近匪祸有些严重嘛，所以被上头从别……”那人操着一口的口音说着，但无心听话的赵智杰只是随口应着，然后眼睛仔细观察着对方的队伍，直到自己手下的士兵排成同样的队伍笑着望向自己，他才终于不再过问，结束了交接，带着队伍向着太阳落下的远方行去。\n然而突然间一阵又一阵的尖啸声与爆炸声响彻了耳边，他慌张地望向四周，炮弹所激起的巨大烟尘几乎覆盖了前沿的堡垒阵地，而且还在有新的炮弹落下，队伍中士兵开始逃散到道路旁的坑中，随后等到炮击结束赵智杰才立刻带领部队返回，一路上他隐隐看到那些不远处冒着火光的阵地，他心中感到大事不妙，只想快速回到阵地中。\n“状况怎么样！”他打着头阵向堡垒阵地内问道，年老失修的堡垒主体看上去摇摇欲坠，被炸出了一个又一个龟裂纹块，从阵地上传来此起彼伏的吵闹声，一名勤务兵打扮的一脸土灰的人慌张冲出来，大声哭喊着质问有没有医务兵，赵智杰这才吼着让部队立刻分散进驻预备阵地，自己带着人跟随“勤务兵”进入指挥室救护“伤员”，然而当他真正进入指挥室时，他只看到两把枪瞄准着他，一群身穿林绿色野战服的人从黑影中走出，轻呵道：“别动！”"
CPC_main_story_events.142.o: "“我们是中国人民解放军山岳军部队，我军优待俘虏，请立刻投降！”"
CPC_main_story_events.143.t: "身后皆虚名"
CPC_main_story_events.143.d: "总统府上，充斥屈辱的青天白日被进城士兵扯下，换上象征解放的蓝红金星旗。市民和学生站在道路两侧，夹道欢迎入城的解放军。市民带着解放军撬开军火库，拿出其中的炸药，拥簇纪登奎来到梅花山——汪精卫墓地所在的地方。\n\n“解放军的……同志！”领头的学生想了想称呼，说道，“大汉奸汪精卫的墓地就在这里，麻烦你们炸掉它！我的哥哥，就是在他家族的工厂里面，因生产事故而死！不仅身死，连最基本的赔偿都没有！”有一人起头，周边的人也纷纷打开话匣，哭诉着自己或自己家人被压迫的故事。“炸掉它！炸掉它！”人群开始不断呼喊，声音愈发雷动，愤怒直冲云霄。\n\n纪登奎安抚着人群，勉强让大家安静下来，他捋了捋逻辑，说道：“汪精卫这个人，他很坏，他就是国民党软弱至极，独裁至极的象征！各位市民朋友，广大中国人民，还有我们共产党人，都厌恶这种不民主、不自由、不独立的反动政府。但这种事情，事关历史重大问题，所以我需要和上级沟通，还请大家稍作忍耐！”说完，纪登奎赶忙写了一份电报，指出群情激愤的现实，半小时后，中央的电报从西安打来，除了批准爆破汪墓外，还要求全程监督，防止市民受伤。\n\n纪登奎挥舞着手中的电报，告诉市民党中央支持他们的诉求。“好！——”人群兴高采烈，学生和市民接力帮助解放军将炸药搬上山，工兵则研究着炸药如何布置，电磁探测器对着坟冢滴滴作响，工兵感叹道：“我去，这个坟头外层全是碎钢浇筑的，汪狗这是浪费了多少钢铁！”工兵简单计算了所需炸药的质量——三百斤炸药，然后将炸药固定在爆破点位上。“市民朋友们，我们都到山下避一避，碎片不长眼，小心为妙。”纪登奎挥挥手，带着市民远离坟冢。\n\n“嘭！——”坟墓的穹顶被炸药掀翻，大汉奸的棺椁赫然映入众人眼帘，因为涂了防腐剂，即便尸体干瘪下去，也能清晰认出汪精卫的容貌——这个自投降日本，便处处模仿蒋介石的可悲可恨之人。围观的人群中，不知道是谁，从地上拿起一块碎片，扔向汪精卫的尸体。紧接着，两块、三块，越来越多的碎块砸向汪精卫尸体，纪登奎和解放军即便阻拦，也挡不住这积压已久的愤怒。不一会儿，汪精卫的尸体便千疮百孔，正如他曾经统治的国家一般。\n人群逐渐散去，纪登奎看着早已毁坏的尸首，细细回味着人民的愤怒。"
CPC_main_story_events.143.o: "引刀成一快，狗屁诗一首"
CPC_main_story_events.144.t: "花赠日升时"
CPC_main_story_events.144.d: "西安市中心，今天风和日丽，天高云淡，气温适宜——是一个适合纪念的日子。\n\n毛岸英和毛岸青搀着贺子珍，李讷则陪在江青身边，这些毛泽东身后的家眷们在一众中央干部的陪同下前往西安市中心新落成的毛泽东雕像前献花，寄托哀思——相较正式的葬礼，这更像一场仅限家人亲朋参与的追悼会。\n\n主持纪念仪式的是刘建勋，他受中央政治局委托撰写和宣读了毛泽东的万字生平——当然，在与会的所有人看来，一篇万字讲稿显然实在不足以概括这位阅尽中国八十年沧桑变迁的领袖，在十年后，二十年后，甚至五十年一百年后，一定还会有不同时代的青年才俊投身到这段历史中去，重新演绎和诠释他的传奇。\n\n中央委员会敬献的花篮由两个人挽起：毛岸英在左，毛岸青在右。他们踏上汉白玉铺就的雕像基台，在两人略显孤凉的脚步声下，一排排身着黑衣的中央干部们正长躬不起。\n\n在巨像脚下放下花篮，毛泽东的两位子嗣直起身来，同在俄罗斯大地军旅戎马数载，二人也都成长为名副其实的革命军人，在黑压压的人群之上，毛岸英和毛岸青举起右手，以最标准的姿势敬了军礼。\n\n倏然间，似乎在场所有人的耳边都响起了他那句带着浓重湘潭口音的呼号，这句呼号无疑也是中国共产党建立五十年来一切斗争，一切革命宗旨的最佳呈现："
CPC_main_story_events.144.o: "“人民万岁！”"
CPC_main_story_events.145.t: "买卖"
CPC_main_story_events.145.d: "村头集市热闹非凡，夕阳在地上投射出一片金黄。摊位摆满道路两旁，吆喝声、叫卖声交织一起，生机勃勃。赵师傅来到集市，在各个摊位上挑挑拣拣。\n“赵师傅，今天又来买菜啦？”摊位旁的张嫂笑脸相迎。 赵师傅看见张嫂，回答道：“嗯，来买些菜。”他眼角不经意间扫到一旁新鲜的蒜苔，张嫂注意到赵师傅的眼光，便挑了些蒜苔放到秤上，嘴巴也没闲着，“赵师傅，这蒜苔今天新鲜的，您看着要点儿吗？”\n“好，给我来两根。”赵师傅指着其中的两根蒜苔，叶子油绿，新鲜无比。张嫂一边包菜，一边说道：“你呀，慧眼识珠！每次来我这儿都挑最好的。”赵师傅眉眼弯成了弯月：“我这人讲究，吃得吃好。”，“你这老头，说得好像你要跑多远似的。吃点简单的也能活得好。” 张嫂一边称菜一边摇头笑道。\n\n赵师傅虽然不服老，但还是顺着张嫂的话说道：“我这老了，胃口倒是变得挑剔了些。你这蒜苔真的不错，吃了不上火，清清爽爽。”，“少拍我马屁，我地里的菜实打实的好。”张嫂不以为然，嘴里却不忘向赵师傅推销着她的新鲜蔬菜，“今天这土豆也不错，没水分，抵饱，您是常客，正好送你两个。”赵师傅点点头，又拿了两个土豆。\n赵师傅将蒜苔和土豆收好，从口袋里掏出几张纸币，递给张嫂后转头便走。张嫂见赵师傅没要找钱，急忙拉住他：“赵师傅，您忘找钱啦，要是多拿你的钱我还不好意思。”赵师傅却坚持把钱递过去，语气和蔼却明显坚定：“你知道我这人喜欢讲究，既然多买两个土豆，哪能白拿？” \n\n二人来回推辞，但张嫂终究是拗不过赵师傅，还是接过了他递来的钱。“这是应该的，”赵师傅见张嫂收下了钱，笑着点点头，然后将布袋装好，“你要是再有好的菜，记得给我留些哈！”\n赵师傅拎着菜，哼着小曲往家赶去，张嫂则将钱清点收好，在记账本上又记上一笔营收，“嗯，再挣五毛钱就回家。”"
CPC_main_story_events.145.o: "各取所需"
CPC_main_story_events.146.t: "单干户"
CPC_main_story_events.146.d: "陈金龙叼着麦穗，眼中满是幸灾乐祸；大队书记的眼皮不断跳动，睁大眼睛盯着报纸。大跃进时期，各地村书记，或动员、或胁迫，让大部分村民“自愿”加入合作社，但总有几个倔人，凭着“自愿”的指示始终不愿意入社，陈金龙便是其中之一。但世事无常，刘少奇主席开始“反冒进”后，农村合作运动便稳健起来，再次强调自愿原则，并鼓励散户包产。\n\n“党中央早就说了自愿嘛！”陈金龙指着报纸，略显得意地说道，“唉，书记，我知道你认为合作社好，我也认为合作社不差，但我毕竟单干惯了，大锅饭我吃不习惯。咱们毕竟都是同村人，相互理解嘛。”书记听出陈金龙前半段的阴阳怪气，愠怒顿时涌上心头，可毕竟事不在理，不好发作，只得为自己找补：“你说得不算错，但说实话，你家里有一头驴，要是加入合作社，大家的生产效率也会更高，你要不再考虑一下，带着你家驴，加入合作社吧。”\n\n见书记找补的同时还不忘打自家毛驴的主意，陈金龙毫不客气：“你想都别想，我还要靠这头驴帮我儿子添一双新鞋呢，而且你别忘了，咱两之前还有过节没有算呢。”陈金龙主动提书记为逼迫他入社，让人晚上踩踏他麦苗的事情，陈金龙继续说道：“书记，我就在这里直说了，只要中央一天不说所有人必须入社，那我就一天继续单干！您要是继续来我田里搞小动作，想逼我入社，那我就把驴杀掉吃了，到城里打零工！”书记涨红了脸，叉着腰，昂着油光的秃顶，即便比陈金龙矮整整一个头，依旧气势不见，回击道：“你别得意！今年明年你不入社，你后年大后年早晚得入社！中央只是调整发展脚步，别以为你能单干一辈子！”说罢，书记头也不回的离开陈金龙的家，临走前还朝门口的稻草吐了口痰。陈金龙双手抱胸，目送书记远离。\n\n见书记走远后，陈金龙带着毛驴到田中耕地，毛驴喘着粗气，一挺一挺地拖拽着铁犁，掀起一片片土块，一下午劳作后，陈金龙气喘吁吁地点起一杆旱烟，深吸一口，缓缓呼出。看见眼前自己翻出的土块，再看看合作社那边仍在劳作的村民，陈金龙内心沾沾自喜：“幸好没加入合作社，不然我的毛驴就要给这帮穷亲戚给糟蹋了。”"
CPC_main_story_events.146.o: "别人多吃一点，我就少吃一点"
CPC_main_story_events.147.t: "因循的老同志"
CPC_main_story_events.147.d: "一份电报从乌兰巴托跨过茫茫大漠，传递到西安市中。除了蒙古方面给出的说明外，还有一份俄文密电。看见密文格式，博古一下认出，这是共产国际的电报，这意味着苏共中央尚存于世。博古不敢怠慢，命人找到共产国际的密码本，将翻译好的信件递交给毛泽东。\n\n信件如下：\n“亲爱的中共同志：\n在我们平息叛乱后，远东法西斯在日本的支持下迅速抬头，对我社会主义复国事业构成严重威胁。我党坚守社会主义，但敌军攻势猛烈，资源紧缺，亟需贵党和贵阵线的鼎力援助。特此请求贵方在可能范围内，提供军事、物资及其他形式的支援，以助我方共抗法西斯侵略。我们坚信社会主义兄弟情谊万古长青！\n同志的敬礼\n亨里希·格里戈里耶维奇·亚戈达”\n\n得知苏共中央仍然矗立远东的消息，毛泽东先是惊讶，后是沉思，最后是五味杂陈。苏共中央撤退到远东后，便杳无音讯，如今它重新宣告其存在，便说明俄国革命一息尚存。毛泽东问众人，要不要给苏共提供援助？刘少奇率先说道：“苏共的远东中央周边群狼环伺，凶多吉少。而且我们党也资源有限，如果派兵过去支援，恐造成根据地兵力空虚，汉奸政权会乘机进攻。”周恩来则表示：“苏联的远东地区和我们的解放区相毗邻，如果苏共中央能重新控制远东地区，那么不仅有利于缓解我们的边境压力，更可以为我们提供一条对外沟通的渠道。另一方面，远东俄国的几个法西斯，都和日本关系暧昧。”\n\n毛泽东点上一根烟，撮合道：“少奇同志说得不错，要是直接去支援，确实会造成阵线兵力空虚。但高匪想着让我们憋死在西北，我们偏要让他的如意算盘落空！要是法西斯统一远东，恐怕阵线将被彻底包围！”毛泽东一面解释自己的计划，一面磨合与会者们的意见，最后，他做出如下部署："
CPC_main_story_events.147.o: "“派几支志愿军，其它的就靠他们自己。”"
CPC_main_story_events.148.t: "不羁的少壮派"
CPC_main_story_events.148.d: "一份电报从乌兰巴托跨过茫茫大漠，传递到西安市中。除了蒙古方面给出的说明外，还有一份俄文密电。看见密文格式，博古一下认出，这是共产国际的电报，这意味着苏共中央尚存于世。博古不敢怠慢，命人找到共产国际的密码本，将翻译好的信件递交给毛泽东。\n\n信件如下：\n“亲爱的中共同志：\n亚戈达的暴政结束后，远东法西斯在日本的支持下迅速抬头，对我社会主义复国事业构成严重威胁。我党坚守社会主义，但敌军攻势猛烈，资源紧缺，亟需贵党和贵阵线的鼎力援助。特此请求贵方在可能范围内，提供军事、物资及其他形式的支援，以助我方共抗法西斯侵略。我们坚信社会主义兄弟情谊万古长青！\n同志的敬礼\n瓦列里·米哈伊洛维奇·萨布林”\n\n萨布林？远东中央？毛泽东望向落款处陌生的名字，略微皱起眉头。周恩来看完信后，解释道：“萨布林应该是苏共内斗里面的反对派领导人，他现在夺了亚戈达的权，自己成为苏共领导人了。”听到这里，毛泽东沉吟片刻，缓缓说道：“局势变得这么快，看来苏共内部已经经历了一场剧烈震荡。”\n\n刘少奇接过话头，集中分析苏共目前的形势：“远东如果失守，法西斯势力就会进一步扩张，对我们同样不利。无论从国际主义立场还是战略格局看，都不能坐视不理。”\n\n“我听说他还是个年轻人，年轻人才有闯劲，才有干劲。”毛泽东点了点头，语气里多了几分思索，“既然他能在那样的局势下站出来，说明远东那边还没有完全熄火。要是再不去帮忙，不仅俄国革命的火种可能熄灭，我们整个阵线也会被法西斯逐步压缩。”\n\n周恩来和刘少奇点头同意，确认与会同志大多赞成后，毛泽东做出如下部署："
CPC_main_story_events.148.o: "“派几支志愿军，其它的就靠他们自己。”"
CPC_RUS_dip_tt: "制作组注：更多同§S俄罗斯远东共产主义者§!互动的剧情及玩法内容将在§Y1.2版本：雾隐孤鸿§!中呈现。"
### 斯诺事件链 ###
CPC_main_story_events.149.t: "世界另一端"
CPC_main_story_events.149.d: "清晨，忙碌的纽约车水马龙。公寓内，一个满脸皱纹的男人正紧紧盯着电视，新闻的标题远比手中的咖啡更令人清醒三分。时隔多年，他再一次听见曾经熟悉的名字——中国共产党，这个在战后便杳无音讯，却在昨日成功解放四川，向世人宣告其依旧存在的革命党。世事难料，男人心想，自从他离开中国，纳粹和军国主义者狼奔豕突，欧亚诸国先后沦陷，在东欧，在印太，惨绝人寰的大屠杀无时无刻不在发生，抵抗势力如同一团团脆弱的火苗，随手便被新秩序的主人掐灭。\n\n男人走进书房，点起一根烟。轻烟缭绕，在他的老相机前四散飘荡。相机旁，是几张泛黄的老照片，虽然陈旧，但仍能辨别出照片中的人——他们都带着八角帽，八角帽中央是一颗红星。其中一位，像憨厚老实的农民，叫朱德；另一位，像意气风发的知识分子，叫毛泽东。既然中共仍屹立西北，那朱毛二人应该还活着，或许我可以做些事情，为他们提供力所能及的帮助！男人想到这里，便将剩下半根香烟掐灭在烟灰缸里，拿出电话本，翻找老朋友的号码：“白宫幕僚、报社编辑…，最好是仍在白宫工作的老朋友，啊！找到了！”\n\n白宫中亦是繁忙，工作人员早早收到命令，正在档案中收集中共的零散资料。“叮铃铃铃铃——”本·希本斯接过电话，这位前白宫顾问、现智库专家得知男人可以帮忙同中共牵线搭桥时，随即保证，成功联系中共后，便立刻通知他。“过两天来华盛顿喝两杯？我知道一家不错的酒吧”希本斯问道，“正好听听你对中共的看法，到时候好说服国会里的那帮反共老顽固。”男人笑道：“行，到时见面聊。”\n\n“好的，埃德加。”希本斯回答道，“到时候我在火车站等你。”电话挂断后，男人决定先给报社投稿一篇社论，阐述中共在对日冷战中的重要性。打字机的声音细细簌簌，半响之后便完成稿件，最后，男人在末尾署上自己的姓名。"
CPC_main_story_events.149.o: "“埃德加·斯诺”"
CPC_main_story_events.150.t: "舌战群儒"
CPC_main_story_events.150.d: "斯诺的文章很快便引起了新闻界和学界的关注。大学里，学生从图书馆借阅《红星照耀中国》，想知道中共是何面貌。报社和电视台内，进步派兴致盎然的讨论中共为何能挡住日军围剿，屹立不倒；保守派则反唇相讥，认为中共不过是运气好一些的西俄革；更有好事者，声称共产党和纳粹并无不同，不过是两种互不顺眼的邪恶势力在狗咬狗，美国只需要坐山观虎斗。\n\n《时代周刊》的亨利·卢斯写道：长期以来，中共游而不击，现在侥幸夺取四川，无法改变其相较于共荣圈的绝对劣势，斯诺先生何以认为，中共将战胜日本，解放中国？况且中共曾听命于共产国际，如今苏联和共产国际都成为了历史，谁来支持本就孱弱的中共呢？\n\n斯诺反驳道：我曾亲身前往过中共的根据地，也知晓苏共的统治。社长先生，我敢保证，中共远比苏共智慧、开明。正如我过去描述的一样，正因为中共不同于苏共，所以才愿意放下仇恨，同重庆国民党组成统一战线。至于所谓的“游而不击”，这是毫无根据的指控，是蒋介石的片面之词。而且从结果上看，重庆国民党最终投降日本，可中共仍在坚持抗战，若中共真是游而不击，为何不在大势已去后投降？倘若中共真和苏共一样，为何战败后也没有崩溃？\n\n另一家杂志《国家评论》的文章质疑道：中共只占据了中国不到六分之一的人口，工业能力相较于共荣圈更是微不足道，别说战胜日本，从数据上看，连战胜南京政府也是难如登天，在人类历史上，从没有过这么差距悬殊的实力对比。\n\n斯诺解释道：中共是灵活、积极的，只要有获得胜利的机会，它便会义无反顾地投入其中，正如其解放四川，是乘着西南战争，共荣圈内乱之际。中共同样是自力更生的，从现有消息指出，中共想尽一切办法在西部中国进行工业化，至少从披露消息来看，他们使用的武器，卡车都是自己制造的，而不是曾经缴获的，这说明他们本身也在扩充力量。四川和重庆在二战后招商引资，建设了不少现代工业，中共只要运用得当，便可实力大增，缩小同中华民国的差距，解放东部中国并非白日做梦。但我不能确认它是否能解放满洲，因为这是日本的核心利益。\n\n斯诺最后写道：帮助中共撕碎共荣圈，不仅有利于中国人民，更有利于美国！想想太平洋战争的阵亡将士们！"
CPC_main_story_events.150.o: "再想想屠刀下的亿万生灵！"
CPC_main_story_events.151.t: "旅途在即"
CPC_main_story_events.151.d: "“叮咚！叮咚！叮咚！”三声急促的门铃，打破了斯诺和夫人一起做饭的兴致。斯诺略带不耐烦的打开房门，只看见一个身着军装的年轻人站在门口，肩部别着金橡叶肩章。军人递上文件袋，敬礼并说道：“斯诺先生你好，我是海军陆战队少校特莱夫·卡内尔瓦，受上级委托，将这份文件交给您，并邀请您为援华美军顾问团的特别记者。”\n\n听见援华顾问团，斯诺立刻反应过来：“和中共取得联系了？”，“没有，但缅甸事变后，中情局判断缅共背后的支持者定是中共，目前正在与中共建立联系。”卡内尔瓦说道，“白宫决定派遣一个军事顾问团去澳洲待命，随时准备帮助、考察中共及其根据地。而您便是两边沟通的桥梁——中国通，还是一个熟悉中共的中国通，全美可找不到几个。”斯诺眼中闪烁着激动，似乎回到了三十年前，那个在延安和毛泽东、周恩来谈笑风生的自己。“请容我收拾行李，便和你前往”斯诺回答道，他走进书房，拿起自己的相机和笔记本，和妻子告别后，便乘上卡内尔瓦的福特野马，赶往机场。\n\n野马轰鸣着V8发动机，行驶在高速公路上。斯诺扯开文件袋，一沓装订好的报告——一些关于缅甸以及中共的资料。中共远比想象中发展的好，看着手中的文件，斯诺不由得感叹道。此前，即便从乐观角度，中共的实力也只能战胜南京国民政府，而如今的中共军队，却可以和日本的甲级师团扳手腕。“卡内尔瓦，你觉得中共咋样？”斯诺忽然问道。卡内尔瓦手搭在方向盘上，思索一阵，回答道：“我个人其实没啥想法，美国国内支持中共的人很多；但同样，因为反共而反对中共的人也很多。但从军人的角度，我支持中共，因为它可以帮助美国打败小日本。”斯诺咧嘴一笑，点点头，因为这个理由足以说服大多数美国人。\n\n肌肉车驶离高速，沿着匝道开进军事基地。进入作战计划室后，只见一个壮硕的，满脸胡茬的硬汉正一边口吐脏话，一边概括着这次援华顾问团的任务摘要。“他是谁？”斯诺凑到卡内尔瓦耳边问道。“弗兰·诺瓦克，之前在亚洲一项黑色行动的参与者，具体细节我不清楚。”诺瓦克咳嗽两嗓子，说道：“好了小子们！这次我们要到西部中国去一探究竟，看看中共究竟有没有本事干死小日本！”他大手一挥，命令道："
CPC_main_story_events.151.o: "“所有人快点，都上运输机！”"
CPC_main_story_events.152.t: "师父与徒弟"
CPC_main_story_events.152.d: "澳洲，OFN对日冷战的前线。基地内部，美国、澳大利亚的士兵正一同操练着，一边跑步，一边呼号“干死小日本”的贯口。斯诺从运输机中颤巍巍地走出，空中的颠簸和噪音让他萎靡不振，身体的衰老与病痛使之力不从心。\n\n不及当年啊，生老病死乃自然之理，不知毛泽东他们身体如何，想到此处，斯诺总觉得身后有某种力量，在催促他前进，在催促他完成历史使命。“您就是斯诺先生吧？”一句标准的英语从侧旁传来，不带有任何澳洲口音。斯诺循声望去，一副亚洲面孔，更准确的说，一张中国面孔快步走来。年轻人握住斯诺的手，微笑道：“我是CBC驻澳记者，大卫·邓。应CBC和CNN要求，和您一起深入西部中国，采访有关中共的一首信息。”斯诺上下打量着这个年轻人，说到：“有个精通英语的中国人随行，沟通起来应该方便多了。”霎时，年轻人额头冒汗，面色尴尬。“我父母是来自广东的移民，但我在加拿大出生，除了一点蹩脚的粤语外，基本不会华语。”邓用手背擦了擦额头上的汗，继续说道，“工作后，我上司见我是中国面孔，说什么‘你们中国佬都讲的同一个语言，还愁啥语言不通？’，便把我外派到澳洲，以便他们采访流亡印度的重庆国民党和马来亚共产党。马共的高层大多会粤语，磕磕碰碰尚能沟通，但采访蒋经国——蒋介石的儿子时，我的华语都是先学的，完全鸡同鸭讲。”在场的人听罢都笑出声来，诺瓦克调侃道：“就像我和澳洲人沟通一样。”恰倒其分的类比顿时将现场气氛推上了一个台阶。\n\n或许是同行的共鸣，斯诺很欣赏眼前的年轻人，便说道：“我年轻的时候也是一路闯荡，跌跌撞撞地前往中共的根据地，来，这回你跟着我，一起去见见你未曾谋面的故乡！”“我把地图拿来了。”卡内尔瓦将东南亚的地图铺在桌上，并用手指了指缅甸，“我们在东南亚的线人表示，他们已经和中共搭上联系，我们今晚即刻出发！”"
CPC_main_story_events.152.o: "下一站，仰光。"
CPC_main_story_events.153.t: "漫长的解放·初到仰光"
CPC_main_story_events.153.d: "舟车劳顿后，我随着美军顾问团来到仰光，这座缅甸南部的古城，亦是这个崭新国家的首都。街道上红旗招展，时不时能看见两幅画像，其中一幅我很熟悉——是毛泽东，另一幅经过向导介绍，是德钦丹东的。按照向导的说法，德钦丹东是毛主席的好学生，带领缅甸的红色武装赢得了革命的胜利。\n\n军车护送着我们，在夜晚来到总统府大楼。德钦丹东和中共代表一同招待了我们。德钦丹东主动和美军代表攀谈，交流军事战术，他总是在表达着建设一支现代化军队的渴望。酒过三巡，我向他询问，前缅甸政府长期在北方种植鸦片，这些毒品随着航道流出东南亚，贩卖到世界各个角落，缅共方面会如何解决这些问题？听罢，德钦丹东放下酒杯，开始介绍缅共的销烟史。\n\n德钦丹东滔滔不绝，但简而言之，缅共先是将根据地内所有的鸦片集中起来，并让婴粟田改种粮食和经济作物，至于余下的鸦片，则通过黑市贩卖到前缅甸政府的各个山头里，以充实军资。按照德钦丹东的说法，这叫让敌人“搬起石头砸自己的脚”。解放全缅甸后，缅共便开始组织起来，大规模销烟，但缅共党内的一些成员，利欲熏心，竟然也学着以前的缅军军头做起鸦片生意来。\n\n谈到这里，德钦丹东苦笑着摇摇头，向我坦白道，缅共内部各个民族派系纷繁复杂，很多时候他只能当一个裱糊匠，尽可能弥合党内民族矛盾，但他同时表示，有一件事情是确定的：那就是要想尽一切办法，铲除罂粟毒草，只有这样，才可以终结殖民历史对缅甸的毒害。\n\n说完，他慢慢斟上一杯酒，举杯说道："
CPC_main_story_events.153.o: "为了缅甸人民，我无路可退。"
CPC_main_story_events.154.t: "漫长的解放·圣土污垢"
CPC_main_story_events.154.d: "我们顺着山腰上的公路，弯弯延延驶入西藏，这片西方冒险家口中的神秘圣洁之地。白雪如同一张柔顺的羊毛毯，覆盖在每一座山峰上，掩盖住狰狞的棱角。虽然仰光到拉萨的直线距离不算太远，但山路曲崎，终免不了一番功夫。\n\n卡内尔瓦拿着与西藏相关的文件，发现一则“有趣”的事情：一些西藏的流亡者，在NHK电台里哭诉他们的悲惨遭遇。一个自称是贵族的藏族小姑娘哭诉道，自己明明对待奴隶十分善良，可这些奴隶却倒打一耙，借着共军狐假虎威，反过来屠杀他们这些高贵的人，让整个西藏血流成河。诺瓦克深吸一口雪茄，颇具同情地感慨道在杀人方面，共产党也就比纳粹好些。\n\n或许是对老朋友们的信任，我并没有发表看法，而是准备到拉萨后再仔细询问。两天后，雄伟的布达拉宫映入眼帘，但与布达拉宫相对的，是大片破旧不堪的土屋。\n\n班禅和范明，这两位西藏的领导者，在布达拉宫脚下迎接我们。美军代表们感叹在布达拉宫的宏伟，而我直截了当地将西藏流亡者的事情告诉了他们。班禅的表情没有任何变化，似乎这些流亡者并不是他的同胞，而范则是抽了抽嘴角，最后忍不住笑出声来。他没有做任何反驳，而是直接带着我登上布达拉宫。范先是指着外墙，说这白墙是用牦牛奶混着石灰抹上去的。接着，他又带着我进入布达拉宫内部，烟雾弥漫呛人，可我仍不由得张大嘴，相较于外部的宏伟，内部的奢侈反倒更令人震惊——无数鲜艳的毛毡，无数夺目的首饰，以及数不清的黄金制品。这些，都是以宗教的名义，由教徒们虔诚供奉来的，而供奉这些宝物的，大多是奴隶主，范说道。这些奢侈品可谓精致至极，法国的珠宝也要敬其三分，不用多言，我便能想象到贵族们是如何在这片贫瘠的高原上巧取豪夺的。但还没等我从这震撼中回过味来，范又抛出一颗炸弹——贵族不仅仅在物质上对奴隶敲骨吸髓，甚至对奴隶本身也在敲骨吸髓！范明补充道，贵族们使用奴隶的身体组织，制作成各种宗教用品，其目的只是为更好的和神明沟通。这种本应该仅存在于恐怖小说中的情节，如同爵士鼓，震得我的脑袋嗡嗡作响。\n\n“那些逃出去的贵族们，说的大多都是事实，但却是不完整的事实”范用一种严肃的口吻说道，“和他们对人民犯下的罪行相比，人民的愤怒不过九牛一毛，用雨果的小说来描述，则是劈开乌云的一瞬雷电。”"
CPC_main_story_events.154.o: "雷电劈开了历史的阴霾，可为何要怪罪这道雷电？"
CPC_main_story_events.155.t: "漫长的解放·天府雨打萍"
CPC_main_story_events.155.d: "车队穿过无数山岭，驶出山口后豁然开朗。道路两旁竹林成荫，与此前光秃秃的山峦形成鲜明对比——向导告诉我们，已经到四川地界了。\n\n成都本是著名的古城，但我看到得更多是各式各样的工厂。刘建勋，今日的四川省长，向我们介绍道，四川军阀谋求自治，招商引资，购买了很多先进的工业设备，城市发达了，但农村却凋敝不堪，即便在丰年，饿死人的事也时有发生。四川解放后，除了整合原有工业外，共产党还想办法从其他地方走私、仿制工业设备，将四川建设成国防阵线的工业基地。刘省长带着我们参观了不少工厂——汽车厂、拖拉机厂、还有兵工厂。所有的流水线都开足马力全力生产，源源不断的机械从工厂运出。刘引用毛（泽东）的说法——“我们钢少气多，得借长补短，大炼钢铁”。\n\n告别刘省长，我们顺着公路，进入一个川北农村。村民们用好奇的目光打量着我们这些外国人，并时不时窃窃私语。行驶到歇脚处后，大卫·邓从车上跳下，跑去田中随机采访了一位农民——或许是他想试一试自己一路练习的汉语到底有没有效果。一番交流后，农民反而不乐意了：“你个假洋鬼子，汉语咋说的呜哩哇啦的？”随心干部见状，立刻前去打圆场：“人家自幼生活在国外，不会汉语不是很正常？你赶紧忙你的去！”紧接着干部转向邓，抱歉道：“我们农民朋友说话直率，还请邓记者见谅。”我一边看着干部不断赔礼，一边感受到无力感充斥着邓的全身，一种来自身份认同的无力感：他出生在北美，却因自己的民族而无法真正融入社会；他回到故乡，却因为语言而显得格格不入。“邻翁借问疑客至啊”随行干部感叹道，“邓记者，我相信在旅途之后，一定会重新认识到自己的故乡，认识到那个充满江河水土、千万人民的故乡，而不是祖辈口口相传的故乡。”\n\n邓无言，只是默默的走上车，跟随大部队继续前进。"
CPC_main_story_events.155.o: "鬓毛未催，乡音却改。"
CPC_main_story_events.156.t: "漫长的解放·汉中堡垒"
CPC_main_story_events.156.d: "汉中，它的名字和中国的主体民族汉族关系匪浅。不同于成都仍有很多古建筑，如今的汉中早已是钢筋混泥土浇筑的堡垒，在这里几乎找不到任何古代遗迹。\n\n进入汉中伊始，一股肃杀感便扑面而来，灰色的墙体印刷着红色的标语，隔三岔五便可看见一个防空洞入口。道路上时常经过一队队军人，以及来往不息的军用卡车。向导介绍到，汉中是中国革命的第二中心，如果西安遭受核打击，那位于汉中的指挥部将接过权柄，继续指挥全国的革命。我们进入市政府大楼，发现其外部墙体竟然有一米之厚，这种厚度，足以在核爆中维持建筑主体不倒。\n\n工作人员带我们进入市政府的防空洞内，通过电梯进入地下，离开电梯后，昏暗的灯光映照着一条长长的通道，继续通往地下深处，沿着通道一直走下去，一幅地下城市的样貌逐渐在我的脑海中形成——除了指挥室外，还有食堂、供销社、医院乃至工厂，各个防空洞间也有通道连通。地上有一座汉中城，地下也有一座汉中城，如同蚂蚁的巢穴，层层叠叠。一个工人拍着胸脯说道，就算全西北都挨了核弹，也可以依靠汉中继续抵抗，直到战死最后一人。\n\n我们进一步深入其中，一道地下列车赫然出现在眼前，诺瓦克问工作人员，这条列车通往哪里？但还没等工作人员回话，安保人员便阻止我的进一步询问，说前方是军事机密，不可以继续采访。列车前的隧道漆黑无比，没人知道隧道的尽头究竟是什么。这漆黑犹如深渊巨口，将一切吞噬其中，包括对生存的渴望。"
CPC_main_story_events.156.o: "希望永远不要用到这些防空洞。"
CPC_main_story_events.157.t: "漫长的解放·革命之心"
CPC_main_story_events.157.d: "回想三十年前，我曾来过陕西，但那是在陕北延安，远离文明的边缘之地。如今，中国的革命之心已经位于关中平原，位于西安城中。西安城方方正正，但也和汉中一样，在数十年的建设中变成一座堡垒城市，但由于需要承担西部中国的首都职能，市中心仍有一些非堡垒化的建筑。\n\n来到西安后，我便和美军顾问团分离开来。解放军将会招待他们，而我则急着去见毛主席，这个阔别多年的老革命家。不同于三十年前在窑洞的采访，这回的采访是在政府要员的会议室中。毛泽东、周恩来、朱德，即便阔别几十年，我还是一下子认出他们来。毛主席脸上多了不少皱纹，但眼神中的锐利不减当年；周恩来虽然面色憔悴，但说话时仍然精力充沛，思维敏捷；朱德发福不少，但仍然是乐呵呵的，像一个老农。毛主席向我调侃道：“革几十年命，从小伙子革成老头子。”在座的所有人都笑着摇摇头，但笑声无法消散漫长革命带来的悲观情绪。我坦白道，没想到过了几十年，仍然能和各位见面。周恩来点头说道，能再见面，便是缘分。\n\n一路所见所闻，早让我感受到中共党人誓死也要解放全国的决心。于是我便不再多问，反倒是大卫·邓急着采访毛周等人，中共为何能在西部中国屹立不倒，继续革命？在一群老头子里，有这么一个年轻人，总归能活跃气氛。毛问道：“你叫什么名字啊？”“我叫大卫·邓，还有一个标准的汉名，叫邓采英”“哦”毛笑着说道，“‘大卫’这个英文名字我叫不习惯，叫你‘采英’好不好？”大卫·邓，或者更应该叫邓采英，虽然仍有奇怪的口音，但依旧兴奋地说道：“当然没问题，毛…额，毛先生！”毛笑的更开心了：“哦呵呵，好久没人叫我先生喽。话归正题，采英，你问我为什么我们共产党能在西部屹立不倒，我能明确和你说，是共产党和全阵线人民，科学的、进步的解决了一个又一个问题，解决掉这一个个小问题，最终解决掉了有关生存的大问题！” \n\n良好的开头便是成功的一半，邓采英顺势继续采访。毛、周、朱先后接受采访，太阳西陲，月明星稀，等到采访结束，已是午夜。“有朋自远方来”毛忽然说道，“采英啊，你要不要去新疆看看？中国的最西部，正好也去感受一下中国内的异域风情。”新疆，这个在西方世界中默默无名的地方，刺激着我记者的神经：把西方人从未只晓的新疆报道出去，肯定能吸引更多的读者，进而让更多的西方人了解中国革命！还没等邓采英思考完，我便抢答道：“感谢毛主席，我们一定去新疆看看！”"
CPC_main_story_events.157.o: "行万里路，写万卷书。"
CPC_main_story_events.158.t: "漫长的解放·红色边疆"
CPC_main_story_events.158.d: "“大漠孤烟直，长河落日圆”邓采英一字一顿的读着在西安购买的诗集，诗歌所描述的便是新疆的景象。草原、戈壁交错，就像美国的西部，但和美国西部不同的是，新疆戈壁一望无际，除了胡杨和红柳，以及时不时看见的运输车队，便没有多少活物。但有时也会经过一片绿洲，绿洲里麦田成片，牛羊成群，似乎是这片戈壁当中的世外桃源。\n\n一周之后，我们到达了迪化城，马仲英将军组织宴会，邀请我共进晚餐。马仲英倒满整整一杯酒递给我，然后自己也倒满一搪瓷杯，一饮而尽。我尝试着喝下一口，一股灼热感便从胃部涌出，紧接着是火辣辣的痛；同样被灌了酒的邓采英辣得上窜下跳，叫苦连连。这是什么酒？比伏特加还辣，我苦着脸问道。马仲英和赛福鼎捂嘴偷笑，为一次成功的恶作剧感到窃喜。马仲英说，这种酒叫“闷倒驴”，蒙古来的，驴子喝了都能晕倒。赛福鼎也将杯中酒一饮而尽：“多喝点就适应了。”缓过劲来的邓采英询问，身为穆斯林的回族人和维族人不是不喝酒么？赛福鼎笑出声来，回答道：“马将军和我都是布尔什维克，不是穆斯林，自然可以喝酒。”\n\n马仲英接过话茬，说道他在苏联时喝的伏特加，一开始很辣，但北国寒冷，多喝一些便像喝水一般了。我从行李中拿出自己带的威士忌，邀请二人一起品尝。此时，一份水煮羊肉被端上餐桌，赛福鼎说：“中国的英雄好汉们有一个习惯，叫做大口吃肉，大碗喝酒，我们即使同志，也是英雄好汉，尽情享用！”\n\n马仲英大口的喝着威士忌和闷倒驴，脸上开始微微泛红，他让秘书拿来他的簧风琴，开始吹奏起民谣，簧风琴声咿咿呀呀，与会者一边有规律地鼓掌，一边哼唱着民谣的歌词。我问向导，歌词的内容是什么，向导介绍道，是一首新疆民歌，民歌内容是歌颂青年时代的青涩美好，歌词的大致内容则是："
CPC_main_story_events.158.o: "“我的青春小鸟一去不回来”。"
CPC_main_story_events.159.t: "漫长的解放·阅兵台上"
CPC_main_story_events.159.d: "游历全疆后，我们回到西安。受毛主席邀请，我得以在阅兵台上观看国防阵线的战前大阅兵。我随中共高层一起走上钟楼，笔直的街道上，一列列士兵等待着接受检阅，林彪站在吉普车上巡视一圈后，宣布阅兵开始。\n\n解放军军容肃穆，武备齐全：士兵劈出刺刀，步伐整齐；坦克列队行进，化作矛头；卡车托挂各式火炮，展示火力；直升机掠过空中，旋翼咆哮；战斗机呼啸而过，列阵冲天。我想起三十年前的共产党军队，除了精气神外，落后、弱小，随时都会被蒋介石的军队摧毁，但今天的人民解放军，不仅有解放全国的气概，更有战胜敌手的实力。毛泽东带着军帽，依靠着城墙，和上次见面相比，他仍然犹如一块坚强的磐石，矗立在中央，但他面容却衰老了许多。同时我注意到，周恩来并没有参加阅兵。见我四处观望，毛泽东干脆说道，周恩来病了，只能在医院休养。我感受到一股不知从何而来的悲怆，革命四十载，曙光愈来愈近，却倒在黎明的前夕。我用手帕掩过眼角，擦过将要涌出的泪水，并默默为周恩来祈祷。\n\n衰老的统帅站在城楼上，一批又一批的士兵和装备接受了领袖的检阅。毛泽东波澜不惊，看不出任何喜怒哀乐。“这些孩子马上就要为这个国家的命运去战斗了，我这个老人家只能用最后一丝力气去欢送他们了。”毛泽东冷不丁地说道，“斯诺先生，我有一个请求，希望您把我们的决心带出西北，带给全世界。我们，一定会解放全中国！”毛泽东的请求让我意外，因为我本来想和美军顾问团一起，亲历中国的解放之路，我向毛泽东表示，我想留下来，记录下这人类历史上最伟大的史诗。毛泽东摇摇头，否定了我的看法：“战争局势将是前所未有，危险异常。我希望你将所见所闻讲述给全世界，帮我们争取到全世界的支持，中国人民的斗争是世界人民斗争的一部分，中国人民同世界人民利益一致！”\n\n毛泽东转过身来，紧紧握住我的手，既是在告别一个好友，也是希望我完成他的嘱托。我郑重地向他点点头，表示一定会将西部中国的故事带给全世界。随后，我离开钟楼，阅兵仍在继续，但我有更重要的任务在身。"
CPC_main_story_events.159.o: "答应过毛主席的事，我说到做到！"
CPC_main_story_events.160.t: "离别亦永别"
CPC_main_story_events.160.d: "“我要留下来！”邓采英忽然说道，“我终于理解毛先生的用意以及四川那位中共干部对故乡的看法了！”邓采英眼神坚定，并将一份信件递交给斯诺：“斯诺先生，请帮个忙，回美国后将这封信转交给CBC总台，我要留在西部中国，亲眼见证、记录故国解放的全过程！我们中国人，不能继续寄人篱下！”邓采英的绝决令斯诺意外，但他仍郑重接过信件，表示一定会代邓采英转达想法。\n\n邓采英随工作人员先行离开阅兵台后，毛泽东又同斯诺沟通了一些琐事，唯独担心叮嘱得不够多，数次握手后，毛泽东终于同斯诺正式道别。斯诺也走下了阅兵台，而领袖仍然矗立在钟楼中央。可一股异样感快速传遍全身，毛泽东用双手撑在墙沿，想要稳住身体的平衡。使出全力后，毛泽东好不容易确保自己没有跌倒，一滴液体流入眼睛，霎时刺痛——额头早已满是汗水，顺着皱纹流入眼角。秘书见状，赶紧上前搀扶，防止跌倒。秘书问毛泽东，是否需要离场休息？毛泽东为避免群众和受阅士兵注意，拒绝了秘书的建议，说道：“和战士们要去的战场相比，我这点病痛算什么？” \n\n过了好一阵子，毛泽东终于缓过劲来，确定自己可以重新站稳。他气喘吁吁，却尽力保证自己的身体没有起伏——毕竟钟楼下无数双眼睛都在看着他。他瞥向台下的一个角落，只看见斯诺越走越远，直到在眼中同人群融为一体，完全模糊。从哪来，回哪去，没人例外，毛泽东想到。望着斯诺离去的方向，他在心中默念："
CPC_main_story_events.160.o: "“别了，斯诺同志。”"
CPC_main_story_events.161.t: "国会演讲（一）"
CPC_main_story_events.161.d: "离开西部中国后，斯诺越过大洋，回到美国。“将西部中国的故事带给全世界”是斯诺同毛泽东的约定。接到电报的希本斯在航空港外等候多时，见到刚出航空港的斯诺，立刻冲上去给他一个大大的拥抱。\n\n斯诺直截了当说道：“希本斯！我之前拜托你的国会演讲准备得怎么样了？”希本斯拿出许可文件，在斯诺面前晃了晃，并学起年轻人讲话：“早就准备好了，我的哥们。就等你呢！为了让你去国会演讲，我可是费了不少功夫！”斯诺笑着拍了拍希本斯的肩膀：“等演讲结束，我请你去吃饭。正好我在新疆认识的朋友送了我一壶酒，到时候带你一起喝！”\n\n“没问题！”希本斯回复道。他帮斯诺把行李放到后备箱，便开车向国会山驶去。路上，斯诺大致向希本斯介绍到自己的所见所闻。希本斯不由得感叹，短短几年，共产党便在西部中国快速崛起，我们或许能看见一场比西俄战争更加宏大的战争。斯诺点点头，说道：“日本的东亚霸权快破碎了。”\n\n汽车停在国会山前，希本斯提醒斯诺道：“如果一些右派议员质问你为什么要支持共产党，你尽量岔开话题。你的目的是为中共拉拢潜在盟友，而不是树立新的敌人。”斯诺点点头，表示明白希本斯的意思。\n\n斯诺站在讲台前，喉咙不自觉动了动，像是要把长久以来的见闻和感想咽进肚子好好消化。他看着打着哈气的议员们，说道："
CPC_main_story_events.161.o: "“尊敬的议员们……”"
CPC_main_story_events.162.t: "国会演讲（二）"
CPC_main_story_events.162.d: "“今天，我站在这里，不仅是作为一名记者，更是作为一个见证者，向各位传达中国正面临的真实局势，以及它对我们共同命运的深远影响。”\n\n“当我们讨论东亚局势时，我们不能忽视曾在中国大地上发生的那场惨烈的抗争。这不仅是一场军事上的较量，更是一场关乎全人类自由与民主的斗争。在这场斗争中，中国战败了，但有一股力量崛起了，并在西部中国坚持抗战，那就是中国共产党。”\n\n“我曾深入西部中国，与中国共产党的领导人和普通民众共同生活、交流。在那里，我看到了一幅与外界描述完全不同的画面：一个以民主、平等和团结为核心价值的社会。中国共产党不仅是在军事上抗击日本侵略的中坚力量，更是一个通过激励广大农民、工人、知识分子而形成的人民政权。”\n\n“相比之下，南京国民政府虽然被称为‘官方的中国’，但它对人民漠不关心，它的官僚体系腐败无能，他们媾和日本，协同压迫东亚人民。而中共，却以有限的资源发动起无数普通民众，用他们的力量解放了整个西部中国和东南亚，用他们的力量对抗着共荣圈的铁蹄。”\n\n“作为一个信仰民主与自由的国家，美国有责任支持这样的事业。中共对抗共荣圈的战争，不仅仅是中共的战争，更是世界反法西斯战争的重要组成部分。如果中共在这场战争中失败，不仅将导致东亚的彻底沦陷，还将让世界进一步滑向深渊。我呼吁各位议员认识到，中国共产党在这场战争中的决定性作用，并采取实际行动，向他们提供必要的援助。我们可以通过提供军事物资，支持医疗资源，声援国际舆论，乃至提供核保护伞，以此对他们的事业给予更多肯定。”\n\n“各位，我之所以在这里向你们陈述这些事实，是因为我深信，只有正视中国共产党的力量和他们的民主实践，我们才能真正理解中国正在发生的变革。中共是中国最具希望、最贴近人民的力量。支持他们，不仅是对抗日本侵略的关键一步，更是对全人类自由与民主事业的贡献。”"
CPC_main_story_events.162.o: "“让我们共同努力，为民主、为自由、为和平而战！”"
CPC_main_story_events.163.t: "漫长的解放·后记"
CPC_main_story_events.163.d: "当我写下这篇后记时，全中国已经得到了解放，日本帝国的势力彻底离开了除朝鲜之外的东亚大陆。一个崭新的国家在废墟中崛起，她叫新中国。\n\n而我的老朋友：毛泽东、周恩来、刘少奇，他们在建国前后相继离世。三十多年前，即便我带着对他们的期许，可仍然认为他们无法在蒋介石的围剿中存活下来。但中国共产党是坚强的，是可以创造奇迹的。他们不仅在蒋介石的围剿中活了下来，还在国民党投降日本后，坚持抗战。但同样，没有人认为占据贫瘠西部的共产党能够解放全中国，但奇迹又一次发生了，而这一次，东亚大陆，以及东亚大陆上的人民，重新获得了自由。\n\n中国的未来充满无限的可能，因为她是民主的、自由的、社会主义的。解放后的她，拥有世界上数一数二的工业，以及充满创造力的人民。我相信在未来，即便没有毛主席，中国人民也能昂首阔步，创造一个又一个奇迹，并发挥自己的伟力，帮助世界上所有受压迫的民族。化作一把利剑，彻底劈开轴心国新秩序的黑夜，将世界人民被法西斯夺取的正当幸福一一夺回。\n\n为了所有人都得到充分发展的自由王国，团结的人民必将为之奋斗终生！"
CPC_main_story_events.163.o: "我愿参与其中！"
CPC_main_story_events.164.t: "吾心安处是吾乡"
CPC_main_story_events.164.d: "“中国革命的故事结束了，但中国人民的故事才刚刚开始。”回到渥太华后，邓采英在纸上写下。“大卫！你真厉害，你的独家报道让我们电视台的收视率猛增二十个点，远超同行！”上司拿着收视率报表，兴高采烈地对邓采英说道，“升职加薪是肯定的，说吧，你想去哪个部门工作？”\n\n“去中国，当驻华记者。”邓采英不假思索道。“驻华记者？”上司反而疑惑，“最重要的事件明明报道结束了，中国那边正在重建，未来长期和平，没有什么国际热点是可以预见的。去中国对你而言会不会有些屈才了？”\n\n邓采英摇摇头说：“这不影响，这只是我个人的意愿。”他指了指墙上带有铁路的艺术照，继续说道：“我们华人，从1840年开始，便有不少流亡海外，寄人篱下，美国、加拿大的太平洋铁路，几乎都是依靠华人的血汗完成的。我父母虽然不是铁路华工，但因为1885年和1923年连续两部排华法案，我的父母在加拿大饱受歧视，而我，即便英语流利，甚至将母语遗忘，也无法融入这个社会。”回顾完历史和个人经历，邓采英继续说道：“中国之行，让我看见了一个不一样的中国，和我以前所了解的，那个人人都扎着‘猪尾巴’的中国完全不同，我头一回有了归属感，虽然不清楚这种归属感因何而来。”\n\n“你说的有道理”上司点点头，“好，我支持你。但你需要等一段时间才能去中国，因为大使馆的问题。”“大使馆发生什么了？”“中国政权更替，原本中华民国和满洲帝国使馆的倒霉蛋们正在想办法如何活下去，他们两使馆现在还在争谁的地盘才应该是新中国的大使馆呢。”邓采英摇摇头，感到苦笑不得，这或许就是某些哲学家说的，幸福也会带来烦恼？"
CPC_main_story_events.164.o: "这种烦恼何不多来些？"

CPC_main_story_events.201.t: "你好吗，越南？"
CPC_main_story_events.201.d: "大街上一切如常，人们行走在各自生活的轨道上，按部就班地开始了新一天的工作——无悲亦无喜，而天气正如今天的西安市井一样，稀松平常。\n\n但外交部内却是愁云惨淡，乔冠华收起往日开朗的笑容，面色凝重地向同事们宣读了胡志明去世的讣告。\n\n多数人表现得很震惊，纷纷感慨起来：“太可惜了。”“多好的人。”“他至少看到了国家解放。”\n\n一想到在越南的工作经历，和胡伯伯那份慈祥的身影，泪水从罗贵波的眼中夺眶而出，他难抑悲痛跑出办公室，独自到厕所大哭起来。\n\n得到消息后，周恩来也在办公室里暗自抹着眼泪，不仅仅为西北失去一个好朋友哀伤，也是在为自己哀伤，一股无力感重重地袭击全身——“我什么时候才能看到中国解放啊？”\n\n办公室的门开了，秘书小何从毛主席那里回来，胸前抱着一大捆档案袋，这是华南局所有关于越南的报告。越南副总理范文同一个月后就要亲自带队访问西北，他提出中越之间有三个重要议题要完美解决，周恩来得提前准备会谈内容。\n\n“毛主席接到胡志明去世的通知了，主席说他想抽烟，但傅医生没让。”小何把档案轻轻地堆放在周恩来的桌上，“刘主席说他要去火车站接越南代表，让甘肃省做准备。”\n\n周恩来这才注意到桌子上的档案，他仍旧没说话，伸出颤颤巍巍的手想要拽出一份文件，可一用力把整座文山都拽塌了。小何赶忙走到桌前把档案扶好，这时她看到了总理通红的双眼：“总理，你哭了。”\n\n“对不起小何，我有点难受。”\n\n“我去给您倒杯水？”说完小何打开暖壶，哗啦啦灌满茶杯，端到桌子上。周恩来用力平复一下心情，把水喝得一滴不剩后。终于，他重新镇静了下来，做出工作安排："
CPC_main_story_events.201.o: "“让罗贵波同志晚上八点来我这一趟。”"
CPC_main_story_events.202.t: "再见了，越南。"
CPC_main_story_events.202.d: "西安政务院前的广场上驶来了一列车队，正是范文同、黎笋和一众越共基层党员组成的越南外交代表团。在接待大厅里，代表团见到了刚刚推下其他工作、赶来见面的周恩来。\n\n“欢迎，听负责接待的同志讲，你们可是从藏南一路向北，取道兰州，才到了我们这里。真是辛苦了。”\n\n“哈哈，比起和您见面，算不得什么。胡主席以前还常常讲，哪怕是千山万水，他也时刻想念着中国同志们哪。”\n\n提到刚刚逝世不久的胡志明，周恩来不由得一阵恍惚：二人相逢于大革命的广州、共事在大后方的重庆。革命尚未成功，却未料斯人已去，再也无法把手言欢。范文同似乎察觉到了周恩来的情绪有些低落，试探着问道：“周总理，是不是有些累了，要不要我们……”周恩来回过神来，微笑着摆摆手，说道：“没什么，没什么，想起了过去和胡志明同志的事情。越南解放，虽然没有再见面，我也能想象出他兴奋的样子。”他振作起来，整理了一下思路，接着说道，“你们是胡主席逝世之后首次出访外国，就来到了大西北，证明了两党和两国人民之间坚实的友谊啊。”\n\n范文同和黎笋对视一眼，两人都希望尽快结束会谈，赶回河内去：“您知道的，越南刚刚解放，到处都要搞建设，说来不怕同志们笑话，都快要没米下锅了。”会场上响起一阵善意的笑声。周恩来闻言，答道：“越南需要的，我们都愿意帮忙，只是现在西北也有困难，”他沉思着，“但我们会尽全力，鲜血凝成的友谊，比什么都珍贵。”\n\n范文同长舒一口气，接着说道：“还有一件事要与中国同志们讲，胡主席走后，我们也准备进行新领导班子的选举，周总理，您看……”虽然他和黎笋都不愿中国真插手内务，但毕竟受人一惠、同为战友，不通个气似乎也说不过去。他正说着，周恩来抬手示意停一停，随即坚决地说道：“我们是同志加兄弟的关系，中国共产党不会对朋友自家的事情指手画脚。剑英同志也多次同武元甲同志谈过，我们的态度是一贯而明确的。”\n\n此时，黎笋开口说道：“周总理，我们还要赶回国内去，开展接下来的工作，就不多留了。等到亚洲革命胜利的日子，我们庆祝大会上再相见。”"
CPC_main_story_events.202.o: "“好，好，胜利的日子再见。”"

CPC_9th_congress.0.t: "周恩来致邓颖超"
CPC_9th_congress.0.d: "超：\n\n来到汉中养病已有月余，和你通过几次电话，不过没有给你执笔写信心中顿感戚戚。\n\n医生告诉我心脏功能尚还欠佳，主席也体谅我的病情，告诉我可以就地办公。但我思忖再三，还是决定提前出院回到西安去，回到同志们中间去工作。\n\n有些苦楚我只能向你一诉。昨夜我被噩梦缠住，我梦见至亲至爱都弃我而去，所有人都不惮以最坏的眼光看待我。我就这样无依无靠，备受冷眼地熬过苏醒前的两刻钟，梦醒之时泪水夹杂着冷汗浸透了枕巾和被褥。使我唯一感到快慰的是，你温暖的身影为我驱散了最后的梦魇，将我从深渊中唤醒。可这场梦却是十几年来未曾有过的怪现象，可能是养病消磨太多宝贵的时间让我产生了焦虑。\n\n在给你写信的时候，我已经走出不安，望你放心。一想到还有无限的解放事业在等待着我，则就把一切失落都扫除干净了。\n\n超，也祝你一切安好。\n\n周恩来\n\n四月二十三日"
CPC_9th_congress.0.o: "附海棠花瓣数枚，以报平安。"
CPC_9th_congress.1.t: "劳动节"
CPC_9th_congress.1.d: "五彩缤纷的花车和游行队伍从毛泽东和刘少奇的眼前慢慢走过，所有人都不禁沉浸在这片欢愉中。相比二十年前，西北已不是那副孤立无援、任人宰割的贫弱模样。\n\n但是毛泽东的世界正在崩塌，康生突然住院使他遭受了严重打击。时间带走的东西太多，他对未来的忧虑却还像十年前一样丝毫没变，自始至终心事重重，与刘少奇的交谈中潇洒气度荡然无存。\n\n刘少奇说的话就像这几年来一样少。实际工作掌握在自己手里，还要表示出尊重领袖的姿态，就像其他政治局成员一样，对领袖的话仅仅附和。\n\n“前几天，我到西安郊区视察。离我几十米的地方站着一个小孩指着我，声音特别大地喊：‘这人是谁啊！’当时我浑身都是说不上来的难受。”\n\n“这挺正常的，小孩懂什么。”\n\n“你觉得东边的人知道我是谁么？”\n\n“只要成年了就知道。”\n\n“康生病了，得了癌症，医生说没有治愈希望。”\n\n“咱们都有这一天。”听到这话，毛泽东的脸色更不好看了。\n\n“自打上次开会以后，五年了。各种工作，磕磕碰碰也都过来了，咱们该开一次会了吧。”\n\n刘少奇只把开大会当作一个程序问题，本身没有什么所谓。五年发展已经到头，该做到的都做到了，新的目标呼之欲出，应该再开一次会：“这个主席你定。”\n\n“既然我定，”毛泽东不等花车走完便转身离去，急着给秘书关锋下指示“给周恩来打电报，中央让他回来。”"
CPC_9th_congress.1.o: "“我马上就去。”"
CPC_9th_congress.2.t: "一夜的工作"
CPC_9th_congress.2.d: "一张写字台，两把杨木椅子，一盏翠绿罩住的台灯，再加上一叠半米高的文件，这就是周恩来位于西安的办公室。房间很大，这是为了便于接见干部，却更显得屋内陈设渺小，屋径空旷。\n\n夜很深，明月高挂，办公室不敢开大灯，只有杏子大小的台灯照亮写字台，蚊虫像一架架轰炸机肆意飞掠而过。办公室里点起了蚊香，可是防震胶带封住了窗户没法透气，烟雾呛得正在批阅文件的周恩来时不时轻咳一两声。\n\n“把值班室的小何叫来。”\n\n周恩来招呼书记员小何坐在写字台对面，陪同审阅会议记录稿，顺便咨询。周恩来一句一句地审阅，看完一句就用笔在那一句后面画上一个小圆圈。他不是浏览一遍就算了，而是一边看一边思索，有时停笔想一想，有时问小何一两句。夜很静，经过相当长的时间周恩来才审阅完，把稿子交给了小何。\n\n“明天早上送到打印室，记住省级干部一人一份。”\n\n钟打过3点，夜仍深。值班室的服务员送来两杯熬夜时必须预备的黑茶，外加一碟花生米，放在写字台上。周恩来让服务员自己再倒一杯，三个人一起喝茶，吃花生米。捻着一粒花生，两个指头不住地碾，周恩来小声嘟囔了一句：“我……我有点咬不动了。”服务员和小何对视一眼，各自明白了些什么。\n\n如果现在睡觉，早上一定没精神，而周恩来七点就要开会。于是三个人都有意无意小口啜茶，倒是花生米早早吃干净了。服务员杯里的茶最先见底，他看周恩来有些睡意朦胧，站起身和总理说：“我再让厨房准备点消夜吧。”周恩来没有反对，服务员拿走空碟空杯离开，没有带上屋门。小何也就势起身：“总理，我去送文件了，估计五点前回来。”周恩来点点头：“你去吧，等你回来一起吃个早饭。”\n\n“是。”"
CPC_9th_congress.2.o: "（时钟）当——当——当——当——"
CPC_9th_congress.3.t: "延安视察（1）"
CPC_9th_congress.3.d: "“西北的小米吃了二十几年，就数咱们延安最香啊。”\n\n“总理是南方人，饭菜上有什么不习惯我马上通知厨房。”\n\n“习惯的，习惯的，按你们平时的来就好。”\n\n上半天的视察工作很快就结束了，周恩来和一众地委书记坐小巴车赶回延安市政府的小食堂吃午饭。周恩来明白，这顿饭是营养师和地方小灶替他安排的。他还是尽力给车上自以为平安无事的领导干部们留住面子，不为自己视察中看到不该看的东西刺激他们。\n\n服务员推开食堂小门，通明透亮的大窗户下摆好两张圆桌和十几副碗筷，饭菜已经上齐，确保一行人到地开饭。一盘主食，一半是花卷一半是馍，都是白面；一盘孜然羊肉，盐料用得很薄；一盘酱焖鱼，酱色清淡；素菜是糖醋土豆丝和凉拌黄瓜青椒丝；靠近门口的橱柜上蹲着一盆热气腾腾疙瘩汤。望着满满当当一桌子菜，周恩来心里像有把钳子不停地捏他，哪怕随行领导笑脸相让也无法欣然落座。他示意大伙先坐下开吃。"
CPC_9th_congress.3.o: "（下一页）"
CPC_9th_congress.4.t: "延安视察（2）"
CPC_9th_congress.4.d: "“我们在未来还要解放全国，根据地的经济建设不能松懈，不能浪费群众对我们的信任。”\n\n桌子上所有人都只顾夹菜夹饭，低头闷吃，没人敢接周恩来抛出的话头。\n\n周恩来再也忍不住了，压抑在心中的话终于像机关枪一样流泻出来。\n\n“金书记告诉我延安是‘北穷南富’，可是今天到甘泉转了一遍，情况并不乐观。村子里一眼就能看见，有的群众没有饭吃，没有衣穿，这还是你们嘴里说的‘富县’的情况。”\n\n周恩来十分痛苦地摇摇头，从主食盘子里反手托起一只花卷，颤抖着拿到每一位埋头苦吃的干部眼前。餐具齐鸣的声音慢慢停下，夹菜的手也纷纷回到原位，小食堂里安静异常。“哗啦”，一位县委书记哆嗦了一下，碗沿上的筷子被碰落在地，但他已经顾不上捡了。\n\n“安塞的书记说今天到他那里的公路要维护，劝我下午不要去视察，省得汽车白跑一趟。我收下你的好意，我就告诉大家，今天下午我哪里都不去，就坐在这里不动！”\n\n周恩来的说话声越来越大，以至于连自己都意识到了这一点，他赶紧深呼吸压住满腹火气，狠狠心用商量的口气向这一屋子人提要求。\n\n“放下心里的包袱，中央不会怪你们，也不会为难你们。只有你们对我坦诚，我才能解决问题。我给你们一下午的时间，把生产、生活上遇到的问题，认认真真打一个报告给我。好吗？”"
CPC_9th_congress.4.o: "你们接着吃。"
CPC_9th_congress.5.t: "请病假"
CPC_9th_congress.5.d: "“卓琳啊，小平同志今天怎么没来开会？”\n“总理，小平这两天把腿摔坏了，走不了道，没能及时和您说，真是对不起。”\n“因为什么摔的？”\n“那个总理，我让小平亲自和您说啊，他管我要话筒。”\n“好。”\n\n“周总理，实在对不起，我因为个人原因耽误这次开会，我真应该做出检讨。”\n“你是因为什么摔的？”\n“那个总理，李先念在会上发言了么？我想讲的东西都提前交给他了”\n“他发言了。”\n“好好。”\n“那你到底为什么摔的。”\n“有点不好张口。前天我到活动室打台球，从台球桌上掉下来，把大腿摔脱臼了。傅医生能作证。”\n“哦这样，那你要补个病假。你后边还有两个会，必须提前请假。”\n“是，是，总理，一定补。”"
CPC_9th_congress.5.o: "检讨不用公开了。"
CPC_9th_congress.6.t: "又是前途"
CPC_9th_congress.6.d: "“……建议召开一个五年内达成中美友好关系的吹风会，请中央各部委、各大军区的负责人参加，向他们介绍有关美国的最新情况……”\n\n看到叶群走进客厅有事想说，正在为林彪念通知的于秘书止住声音，叶群示意他出去后起身默默离开。林彪慢慢抬起眼皮，他几乎已经猜到老伴要说什么，任她拉个坐墩做到自己跟前。\n\n果不其然，叶群一张口就是埋怨：“甭管开什么会，不都是周恩来出风头？”\n\n长时间靠坐在沙发上使林彪腰酸背痛，他扭扭脖子从叶群边上站起来开始满屋子踱步，一边走一边缓缓说：“他不开会，你去？”\n\n“我说你怎么一点反应都没有，外贸部已经和美国人搭上线了。”\n\n“周恩来和美国人打交道，迟早要倒霉的。”\n\n“我不是说这个，我的意思是说，你干嘛不帮儿子从里边找个差事。”\n\n听到这，林彪直接愣住了：“我还以为你……”\n\n“我都想好了，美国外交这件事，不能让周恩来陈毅他们把功劳全占了，咱们家也得有份。你儿子不是英语学的好吗？直接去外贸部当外交官，到时候谈成什么都算他的。这不是增光添彩的好事吗？将来要是解放了，咱俩还能跟儿子去美国转一圈，多好啊。”\n\n叶群这番话超过林彪以往接收的信息总和，他摸了摸自己干瘦的下巴，脑袋里晕晕乎乎千头万绪——\n\n自己的儿子干外交成吗？不成怎么办？不成可以练，让周恩来亲自带，成了全算我的。将来要打大仗，军队不是久安之所，外交是个好去处，不成也得成！"
CPC_9th_congress.6.o: "二十多岁的人，捧成外交官。"
CPC_9th_congress.7.t: "老无所依"
CPC_9th_congress.7.d: "透亮闪烁的聚光灯，摩拭提振着代表们大脑的兴奋神经。人们的脸上纵情欢笑，两手不停鼓掌，山呼海啸般呐喊着庆贺阵线在这三年里的伟大胜利。\n\n周恩来端坐在代表席上，似乎和阵线的前途一样稳固。一瞬之间，他突然感觉周围的一切都陌生无比，灯光那样刺眼，身边正在讲话的谢顶老头也不知是何物。他左瞧瞧，右看看，对四面八方的喧嚣不知所措，稿子攥在手中不住地颤抖。\n\n“中国共产党万岁！”\n\n突如其来的口号吓到徘徊在恍惚中的周恩来，浑身触电一样，心脏止不住突突跳。他隐约记得自己要染头发，染成黑色。不对！还是戴头套更好一点，老态龙钟的样子没法见人。\n\n想到这里，白发丛生的脑袋好似千斤重，带着轻飘的躯干眼睁睁朝左侧倾斜。陈毅发现了异状，赶忙扶住，一边轻声呼唤：“总理，你怎么了？”\n\n“总理，到你发言了。”林彪没扭正脸，两只胳膊交叉拄在会议桌上，脸上带着程式化的微笑提醒道。\n\n周恩来的两眼直勾勾瞪着前方，脸上的生气被渐渐抽干，只剩木讷和僵硬，嘴里絮絮叨叨不知说些什么。他强撑着两根竹竿似的腿站起来，讲稿早已从手中脱落，但是刚才他至少还记得自己应该干什么。会场已经安静下来，几百名代表的目光齐刷刷射向自己，前所未有的压力加之一身。这使他牙关紧闭，喘气越来越粗，一声不吭与代表们对峙着，直到像卷帘门一样哗啦倒下。"
CPC_9th_congress.7.o: "快叫医生！"
TER_phase_2_end_tip: "他们终将§x老去§!——而中国的前途§Y未定§!…"
CPC_9th_congress.8.t: "一则右派言论"
CPC_9th_congress.8.d: "那些聚居县城的中层干部有不少空有共产党之名而无共产党之实，中央下达指示不求甚解随意指使，把官样文章变成欺压群众的尚方宝剑，俨然变成小封建独裁者。过去我总是迷信，是中央监管不力，只需多派工作组。但渐渐工作组人员臃肿，继而与地方干部沆瀣一气，融为一体，使我逐渐认清党的治理危机症结何在——一定要让人民群众说得上话。\n\n我很奇怪，不单危机处理时干部的话语权至高无上，哪怕日常事件中普通群众也基本插不上话。也许工作开会时有发言环节，但这是上级派下任务之后，有引导、强制性地开启讨论，普通群众丧失主动权，沦为政府运行的工具。失去良好的反馈渠道，党员进入政府便是与人民脱离之时，那么发生这样多的干群事故，就基本能得到解释：这并非是党纪不牢或个别人道德败坏，环境使然而已。\n\n（一些潦草的笔道）\n\n（下面被撕掉）"
CPC_9th_congress.8.o: "下面被撕掉。"
CPC_9th_congress.9.t: "改换门庭"
CPC_9th_congress.9.d: "“中国人……算了不单说中国人，就说人吧。开完整场会我才明白人的忍耐力是无穷的，哪怕饿死也不会造反。”\n\n工作会议结束了，各级干部纷纷离场，陪伴傍晚的暑热。陈云摇头晃脑、神神秘秘地凑近高岗，发出这番神论。整句话把高岗惹得莫名其妙，忍不住拍肩膀叫住陈云：“你说这话简直混蛋。”\n\n陈云听见高岗的斥责不气不恼，回过头笑了一下：“你再好好想想，咱们俩之间谁更混蛋？”\n\n这一下把高岗问愣了，仔细玩味起这看似莫名其妙的反诘。一片绿叶轻轻落下，悄无声息地滚落在台阶上。回想起十年前自己人生的至暗时刻，再看看陈云意味深长的眼神，高岗噗嗤一下笑了：“和我说说你在想什么。”\n\n“我想，群众爱戴你，是他们不懂。可大跃进，你，你是头号大混蛋，周围的人全都知道你的底细，都恨不得活吃了你。”\n\n“继续。”\n\n“周恩来不是长寿的面相；毛主席也年纪大了，身体越来越不好，这个脑壳也……”陈云将声音压到极低，用手指了指自己的脑袋，“等他们到天上以后，假如将来你落难了，谁还愿意捞你一把？”\n\n“你这问题太怪了。”\n\n“康生？已经肝癌了。薄一波？当初就是他要置你于死地。”\n\n“你想让我找邓小平？”\n\n“他当年也出力了，你得报答人家啊。”\n\n其实高岗早就明白陈云的意图，他几次想搬出“大公无私”的理论反驳，可在显而易见的道理面前简直毫无招架之力——说实话，透着有点蠢。\n\n无奈淹没了高岗的肩头，他只觉得浑身无力，两眼看天重重地叹了一口气："
CPC_9th_congress.9.o: "“唉，我懂了。”"
CPC_9th_congress.10.t: "农村调查"
CPC_9th_congress.10.d: "“……交不起公粮就把你打成‘封建小农’‘反对社会主义’，开完批斗会书记就招揽着一大帮人到你家里挖地三尺地搜啊，灶眼刨开，水缸推倒，就连被和枕头都给你扯烂，看你藏没藏粮食。”\n\n“发生逼粮事件后为什么没有乡亲向上报案呢？”\n“报案？哼！”农民大爷的一声冷笑在秀娟心中划开一道淋漓的伤口。没有正面回答问题，大爷先反问道：“姑娘你是咋到村里来的？”\n“我是搭驴车……”\n“是那个书记用驴车把你请来的！”大爷的脸突然冷峻无比，冲着秀娟低吼，“你打量他会让你写他的烂话？写完你连这个村都出不去！”\n\n秀娟已经感受到对方的愤怒，攥笔的手不停颤抖，但她也委屈有些懊恼：就算没驴车，凭自己的体力还不能走出山去？正当秀娟平复心情，大爷继续将一盆冷水迎头浇下，他压低了嗓音就怕墙根有人偷听一样凑近秀娟，靠着嘘气声挤出自己想说的话：“给中央毛主席写信，到公社就给扣下，不准递出去。想要出村，没有凭据不让出，民兵端着枪把住村口没人敢闯。”\n\n说到这，老农把脑袋探出窗台向外瞄去，挑了挑下巴示意秀娟好好瞧瞧：“看吧，派人盯着呢！”秀娟往外一看，一个身穿灰蓝中山装的人在离屋子较远的地方晃来晃去，时不时朝房子里瞅一两眼，在空旷的公社大院像个黑头特别扎刺。\n\n看到这架势，秀娟明白自己掉进坑里爬不出来了，而接受采访的大爷也拍拍自己裤腿，掸了掸鞋上的泥，起身对她说：“姑娘你该干啥干啥去吧。这么长时间我也想开了，别给中央添麻烦，受着吧。”"
CPC_9th_congress.10.o: "中央头皮发麻"
CPC_9th_congress.11.t: "未来可期"
CPC_9th_congress.11.d: "收拾完办公室，刘建勋前往火车站，准备前往西安参加九大。“刘省长！刘省长！”刘建勋刚进火车站，便听见有人在不断喊他。回头一看，是卤菜馆的曹大婶。警卫拦住了曹大婶，她便向前伸出一只手，手中提有一个包裹。刘建勋赶忙支开警卫，让曹大婶通过。\n\n曹大婶将手中的青布包裹放在了刘建勋的手上，说道：“刘省长，你离开成都去西安怎么不说一声，我好准备一些卤菜给您送行啊！”刘建勋略显尴尬，想要推辞，见推辞不过，又想从钱包中拿钱付款，都被曹大婶一一婉拒。曹大婶说道：“见外了刘省长，我感激你还来不及。我弟弟以前给地主打短工，后来分了地，加了公社，学了写字。他总是寄信给我说共产党帮他翻了身！”刘大姐按住刘建勋找钱的手，进一步说道：“国民党十几年来鱼肉四川，即便工厂建了水利修了，可我们穷苦人还是过苦日子。后来共产党来了，短短几年便焕发生机，这点卤菜和我们好不少的日子比起来不算什么。”说到此处，曹大婶也不由得激动起来。见到激动的曹大婶，刘建勋也不好继续推辞，拿过卤菜后不断点头致谢。刘建勋带上卤菜，踏上前往西安的火车。\n\n“老刘，你也刚到？”纪登奎发现了刚下火车的刘建勋。二人当年一同受中央委托，领导川渝地区的改造整合工作，现在，他们二人又受中央召集，回到西安参加会议。“登奎，好久不见！”刘建勋对这个比自己小自己十岁的年轻人非常赞赏：年纪轻轻就成为了重庆市长，重庆市工业整合的一把好手，短短三个月便完成了重庆市各工业部门的复工复产。“天府之国可没把你养胖嘛！”纪登奎打趣道，“看来工作辛苦，日夜操劳啊。”刘建勋摆摆手，回应道：“你就别揶揄我了，城市还好说，但和四川地主们斗智斗勇快愁死我了，那些地主一个比一个人精。”，“可不是嘛”纪登奎安慰道，“要是这些地主愿意乖乖就范，就不需要我们共产党，农民自己就可以组织起来把地分了。”纪登奎看了一眼手表，说：“时间差不多了，我们去书记处报道吧。”\n邓小平看见前来报道的两人，高兴地站起来迎接：“自古英雄出少年啊！这几年整线的突飞猛进都归功于川渝的工业发展，你们二人在其中居功至伟！”邓小平拍了拍二人的肩膀，招呼他们坐下，并亲自为二人倒上茶，邓小平抿了一口茶，继续说道：“你们在四川重庆经验丰富，中央计划将你们调到中央，培养干部为未来接收东部解放区接受做准备，你们意向如何？到时候东部工农业接收还得靠你们二位打头阵。”\n二人对视一眼，一齐说道：“中央的命令指向哪里，我们就奔向哪里。”"
CPC_9th_congress.11.o: "广阔天地，大有可为。"
CPC_9th_congress.12.t: "金珠玛米"
CPC_9th_congress.12.d: "确吉坚赞杵在原地等着范明——虽然他是西藏现在的宗教领袖，但他根本无法在政务上做主，必须要有中共干部的“协助”，教令方可从拉萨传出去。一些喇嘛向他哭诉，共产党放了他们的奴隶、分了他们的田、还砸了他们的寺庙，而这些哭诉的喇嘛很快也被带走，有的进了监狱，有的被送去批斗。藏密社会主义？确吉坚赞默默苦笑摇头，这些不过是共产党的缓兵之计。\n\n“大师在思考什么呢？”范明不知何时来的，冷不丁地问道。确吉坚赞掩饰住惶恐，微笑的摇摇头说道：“没事没事，我在思考如何更好地把佛教善的一面和社会主义相结合。”范明点点头，似乎是被确吉坚赞糊弄了过去。二人又聊起了最近新开辟的几条通往缅甸的通路，说到从南洋源源不断走私进来的武器和工业品，确吉坚赞对这些当然一无所知，只好礼貌应付。\n范明看出确吉坚赞的尴尬，于是话锋一转：“大师愿意与我一同出去走走？”确吉坚赞没有理由拒绝，点头同意。范明开着吉普车，载着活佛在公路上溜达。前方不远处，一支解放军正在拉练，整齐干练的队列彰显着它的威武。不同于世界上其他的虎狼之师——气氛肃杀，耀武扬威。这支百战劲旅每到一处，都受到当地人民的热烈欢迎，沿途的藏民看见拉练而来的子弟兵，纷纷从自己的小屋中出来，有的拿出哈达，有的拿出牦牛奶，还有的拿出青稞糍粑，将战士们围得水泄不通，出于条令以及集体荣誉感，没有一个战士收下藏民的礼物。确吉坚赞听说过解放军军纪严明，民众拥护，但亲眼所见之后，依旧感到震撼。吉普车在队列的不远处停下，确吉坚赞隐约听见了几个词，但其中有一个词重复的最多——金珠玛米，汉译为“菩萨兵”。活佛有些失落，藏民们曾经虔诚的向喇嘛们进献贡品，但他们眼中时时刻刻闪烁着畏惧的目光，把头放得低低的，等待所谓“活佛的祝福”；而面对这些头戴红星的年轻人，曾经的奴隶却露出久违的笑容，争先恐后地向面前的这些“普通人”送礼。活佛不自觉地眯起眼睛，或许是因为山上积雪刺眼的反光，亦或是因为“金珠玛米”们解放的光辉。\n\n“大师以前有没有见过这种景象啊？”范明的语气里带着自信，调侃道，“我想啊，要是发扬佛教中善的一面，那大师也和我们追求的社会主义差不多嘛。”“是……是”确吉坚赞尴尬地回复道，他知道，共产党之所以没有废除他这个班禅，只是因为他目前站在了正确的一边。"
CPC_9th_congress.12.o: "如来未来，不如我来。"
CPC_9th_congress.13.t: "雏鹰展翅"
CPC_9th_congress.13.d: "“一、二！”成都飞机制造厂内，工人们齐心协力，将一架崭新的飞机推出车间。这是一架小巧的战斗机，搭载有一台小型雷达、两门机炮以及两枚空空导弹。总设计师陆孝彭欣慰地看着这架飞机，就像是看着自己的孩子。短短几年内，通过走私工具，配件以及图纸，还有国防阵线科研人员和工人们的日夜操劳，这架满足阵线作战需求的小型战斗机终于走下生产线，俄国工程师亲切的称她为“阿丽娜”，而“阿丽娜”和她的妹妹们，也将在未来撑起国防阵线乃至全中国的天空。\n坐在储物箱上的周巧琳吃完米粉，上下打量着新飞机。航程不大，但爬升速度应该很快，周巧琳猜测。“小周啊，可以准备试飞了。” 陆孝彭招了招手说道。周巧琳从储物箱上跳了下来，三下五除二地爬进驾驶舱。“这是首次飞行，进行‘拉起试飞’就好，测试一下飞机的基本性能。” 陆孝彭叮嘱道，“注意安全！”周巧琳点点头，戴上头盔和呼吸罩。塔台的声音从头盔的耳机里传来：“试飞员01，报告飞机准备状态。”周巧琳检查并回复道：“塔台，试飞员01，发动机启动正常，燃油压力正常，液压系统正常，航电设备正常，起飞准备完成。”\n\n“试飞员01，进行滑行状态报告。”\n“塔台，试飞员01，方向舵操控正常，刹车系统正常，滑行准备就绪。”\n“试飞员01，起飞许可确认前，报告所有系统状态。”\n“塔台，试飞员01，发动机推力正常，控制面正常，襟翼放至起飞位，起落架锁定，准备起飞。”\n“试飞员01，起飞许可确认，跑道03，风速5米每秒，注意安全。”\n“塔台，试飞员01，收到，起飞中。”\n\n发动机轰鸣着推动飞机前进，周巧琳轻轻拉动操作杆，使得飞机稍稍离地。见此情景，工程师和工人摘帽欢呼，庆祝着试飞的成功。飞机性能好稳定！周巧琳心想，多年参与试飞的她立刻发现这架新飞机异常稳定，远比在广东国工作时的那些飞行棺材稳定的多。那干脆把盘旋测试也做了！周巧琳想后，猛地拉起机头，飞机像燕子一般轻巧地跃升至空中，开始盘旋。地勤和工程师一开始脸色吓得惨白，生怕飞机坠毁，随后又得知周巧琳自作主张直接进行盘旋测试，才不由得舒口气，埋怨周巧琳不守规矩。但紧接着，工作人员爆发出更热烈的欢呼，庆祝新战斗机旗开得胜，庆祝人民空军雏鹰展翅。\n飞机平稳落地后，在场人员像迎接英雄一般迎接周巧琳。几天后，一副锦旗被送到了周巧琳的公寓，上面写着："
CPC_9th_congress.13.o: "一鸣惊人，一飞冲天！"
CPC_9th_congress.14.t: "多干少得"
CPC_9th_congress.14.d: "梯田上，拖拉机将一茬又一茬水稻收割捆扎。社员们干净利落，将一捆捆水稻搬运到田埂上。男人们的汗水顺着额角滴下，女人们用草帽挡住耀眼的阳光，孩子们则在田中一个个捡起被收割机遗漏的稻禾，不浪费任何一粒粮食。\n\n另一辆拖拉机缓慢地开来，驾驶员一边调整方向，一边大声喊道：“大伙儿把稻捆装车，咱们动作麻利点！”社员们合力将稻捆装上拖拉机的车斗。拖拉机拉着满载的稻谷顺着蜿蜒的小路往村里走去。村里的打谷场上更是热闹非凡。脱粒机轰鸣着，一捆捆稻谷被送进机器，金黄色的稻粒纷纷扬扬地洒落，堆成一座座小山。老人们在场边用簸箕扬谷，年轻人则忙着装袋，一袋袋稻谷被抬到仓库里，堆成了整齐的粮垛。\n\n张大海手里拿着记账簿，站在场边不停地记录产量：“今天早上已经入仓五十袋，下午争取再收两百袋，这产量比去年多了一倍，看上去可以多留些存粮了！”他脸上带着止不住的笑容，心想今年合作社可以去供销社购买更多的工业品，改善社员们的生活。\n\n但第二天，新派发的征粮指标从县里发了下来，让张大海大跌眼镜：为了备战备荒，粮食收购指标比往年高出一倍多，算下来今年合作社的余粮也只比往年多10%。一些消息灵通的社员也来到主任的办公室，想要为此讨个说法。办公室外，焦躁的社员人头攒动，“少干只有这些粮食，多干也只有这些粮食，那不是白干了！”，“我一个城市的亲戚写信说，城市比农村舒服得多，福利也多，我看共产党就是拿我们农村人当傻子。”人群中你一言我一语，吵闹声越来越大，再不控制事态便可能失控。\n\n张大海急中生智，想起之前县里开会时的战备动员，急忙平息现场众人：“同志们，之前县里开会传达上层精神，国防阵线现在已经全面进入备战备荒时期，两年之内就要去解放东部，城市工人也在加班加点生产武器。这个时候就好像爬山，再过一段时间就要登顶了！”\n\n社员们的不满略有平息，张大海不厌其烦的给众人做着思想工作。“解放解放，说的好听，谁知道解放后又会怎的！”人群中不知是谁放出如此反动的言论，霎时间，张大海的脸色先是红胀，然后铁青。社员们也被这句话给震住，心想哪个混蛋如此大胆，却一个二个不敢出声。张大海本想发火，最终却还是按捺住脾气：“我们不能为了个人利益去牺牲集体利益，要舍小家顾大家，要是日本鬼子来了我们岂不是连西北风都没得吃了？”"
CPC_9th_congress.14.o: "“解放后，我亲自去县委帮大家讨粮食。”"
CPC_9th_congress.15.t: "回家路上"
CPC_9th_congress.15.d: "“我们都是飞行军……”程玉清上完夜校，哼着歌走在回家的路上。她想乘着年轻，多学习一些技能，以便晋升到更好的岗位。“小丫头，你要回家吗？”一个男人赶着驴车，从她身后驶来，“上我的车，我顺路载你一程。”\n\n程玉清没有搭理男人，头也不回地向前走。并非是她感到害怕，毕竟经过严打，每天还有民兵干警日夜巡逻，不法分子早已逃之夭夭；相反，她是对男人的问候感到了冒犯。程玉清嘟起嘴，加快脚步。男人笑着摇摇头，驱车并列走在程玉清旁边，以免小姑娘怀疑他。“嘿！你在干嘛？”一声呵斥从二人背后传来，一个警察和一个民兵从后面走来。“刘叔叔！”程玉清认出了警察，是她的表叔刘康，“好久不见！”\n\n刘康见到程玉清，笑着点点头：“小程啊，这么晚还不回家？”，“我才上完夜校”，“啊，原来如此”。刘康又上下打量着旁边的赶车人，问道：“你又是干什么的？”男人拿出入城证，回复道：“去县里申请公社民兵训练需要的材料，顺带帮公社拖点农产品到县里，正巧碰上这个小同志，问要不要顺路载她一程，她还不乐意呢。”刘康检查完入城证，还给了男人：“好，天晚了，二位都早点回家，注意安全。”男人和程玉清点头答应。\n\n路上，男人又向同行的程玉清发出邀请：“小同志，还是上我的车歇歇脚，白天工作累，晚上又要上课，坐我的车又不收费。”程玉清听见“同志”二字，心情好转：这才对嘛。她跳上驴车，摇晃着腿，继续哼起歌。听见程玉清哼着《游击队歌》，男人也跟着一起哼了起来：“哪怕那山高水又深——”"
CPC_9th_congress.15.o: "路不拾遗，夜不闭户"
CPC_9th_congress.15.o_tt: "制作组注：本注释即代表本事件为开发组撰写的，以我们§m游戏社区中活跃人物§!为原型的§m趣味事件§!，所有带有本注释的事件均将标注§Y原型人物§!。\n\n§Y程玉清、刘康§!人物原型：Discord社群水友 - §Y玉清、刘康§!"
CPC_9th_congress.16.t: "大丰收"
CPC_9th_congress.16.d: "今天，任友诚和刘文亮起得比以往任何时候都要早，按照农场张书记的说法，中央工作组前来视察，农场需要比任何时候都“万无一失”，要“紧绷一根弦”。每当有上面来人视察的时候，书记都仿佛都如临大敌。刘文亮打着哈气，说“这死鬼老张，耳朵都快‘万’出茧子咯，又没做啥亏心事，怕甚。”任友诚拍了拍刘的肩膀，打趣道：“像个刚过门的小媳妇！”两人对视一眼，笑了起来。\n\n“同志们，中央工作组的领导们马上要乘车进来了，做好准备啊！”张书记望着远处驶来的车队，嘴里已经开始叽里咕噜下棋了命令。不一会儿，车队驶入农场，社员们站在车队两边，整齐划一，鼓掌欢迎。这次来的都是大官：马仲英、赛福鼎，还有中央派来的工作组领导王震。眼见农场生产氛围火热，王震感慨道：“你们干的不错嘛，刚开荒的时候，还只能用传统的木犁，现在都用拖拉机和柴油机了。确实是模范农场，在西北边疆建设起了社会主义农业！”\n\n紧接着，王震笑着问农场书记：“书记同志，我可以随便问问一个社员吗？”张书记愣了一下，虽然没有准备，但领导都说了，那也不好拒绝：“可，可以。”王震望向社员们，一下子便选中了任友诚。张书记脸都绿了：选谁不好，非要选一个四清时被整过的黑五类！\n\n“小同志，你叫什么名字？”王震微笑的问道。任友诚直接回答道：“我叫任友诚，黑五类，四清的时候被批斗过。”任友诚余光一瞟老张，随即话锋一转：“我想我之所以被批斗，恰恰是还残留着小资产阶级习气导致的，接受教育对于我们这样的黑五类很有好处，我现在在农场的一间平房内，利用中学知识和工程书，为农场缠绕铜丝，制作变压器——我带您去看一下我们的工坊成吗？”王震被这个思维跳脱的年轻人给吸引到了，挥挥手笑着说：“可以可以。”\n\n任友诚带着一行人来到了他平时工作的平房。任友诚指了指一台加踏板的的机器：“那个是缠线器，是我和刘文亮拿一个老旧缝纫机改造的，用上那个脚踏板来协助缠线，要比过去用手缠线快速多了。现在缠铜丝，就像缠风筝线一样简单。”王震点点头，鼓起掌来：“劳动群众的创造力是无限的，教育的好，教育的好啊！”一旁的张书记悬着的心终于放下，暗暗给任友诚竖起了大拇哥。\n\n巡视进入尾声，王震向农场众人发表了一个简短的演讲，高度赞扬红旗坡农场体现了社会主义的先进性。最后，王震向全体社员公布了一个好消息。"
CPC_9th_congress.16.o: "今年的新疆，粮食大丰收！"

#汉中事件链
CPC_HZ.1.t: "牢骚"
CPC_HZ.1.d: "好不容易在清净的检票口熬到晌午，李文正拿了饭票端着饭盒和几个老朋友一块打了饭围坐在一块，蹲着边吃边聊天。\n\n“你们说中央干啥玩意把这火车站修这么老远，拿我来说，我天天天还没亮就得出门吭哧吭哧蹬单车，蹬俩公里才到地，天天这么折腾累也累死了，中央咋就没想把这火车站建到城边上呢，这不给咱添堵吗。”\n\n“还中央给咱添堵，我看你不给中央添堵就是给社会主义做贡献了——”调度员赵响往自己嘴里塞了一坨白米，“中央那部署可远大了，说什么七年把汉中建设成咱陕西的第二大中心城市，什么中央部门，兵工厂，医院学校啥的统统要搬过来，不把车站盖远点，指望着咱老市区那点破地把这些东西全都塞下啊。”\n\n“得了吧净吹牛，我看最多盖两栋……”汽笛声突然响起，车轮碾过铁轨的轰隆声淹没了这群西北汉子们的话音，众人连忙几口并作一口胡乱扒干净碗里的饭，趴到窗户边上望一眼这是何方来车——这车竟一眼望不到头，车头后或红或蓝或绿各色货厢列队，还有些货厢绑着被绿布裹着的奇形怪状的大玩意——懂行的人能看出些端倪，成袋装的多是水泥红砖，被绿布裹着的中等大小的东西多半是卷扬机一类的工程设备，还有些半挂车车头，以及成批封装的货箱——不知这趟列车给汉中运来了多少东西。\n\n老少爷们面面相觑，大伙冲着李文正挤眉弄眼，而李文正趴在窗上大睁着眼，像个活傻子。"
CPC_HZ.1.o: "“乖乖，玩儿真的啊。”"
CPC_HZ.3.t: "车间"
CPC_HZ.3.d: "吴增光盯着眼前的玻璃瓶，像个雕塑似的一动不动，只用余光瞥了眼灰白的墙上新挂的时钟——白漆漆的灯光下指针明确地知会他：还有十分钟下工，这时他的身体才像从雕塑又变回了人，有了生物独有的小动作，耸肩抖腿打颤子，但眼睛仍然一动不动地盯着源源不断的空瓶子从流水线上滑过。\n\n他是刚从白区逃难来汉中的，正逢汉中新开了厂，抱着试一试的心态他走进了汉中特设的新招工处，招工处的干部是个有良心的人，看他逃难到汉中，身子瘦弱，就把他安排到这个车间盯着吹出来的玻璃有没有杂质——这确实不是什么体力活，但容不得差错，从早到晚都得盯着，一旦出了什么纰漏没看出来那一批玻璃瓶就毁了。\n\n不过吴增光倒没在意，比起从前在宜昌没地没粮只好逃难，一路颠沛流离饱一顿饥一顿，挨过今天不知明日死活的日子来，这里实在是太安稳了：包吃包住，月末还发工资，厂里还开了工人夜校，还会组织体育活动——他甚至已经学会怎么打篮球了，但吴增光始终没明白自己盯着的这批吹制玻璃瓶到底有什么用。\n\n“咣”一声响，吴增光的心思又回到现在来了。\n\n“老吴，下班了干点啥。”工友小徐走过来，“要不去趟厂门口那个国营商店？我听说最近那终于进了咱们厂的汽水了。”\n\n汽水？什么汽水？这个车间不是产玻璃瓶的吗？哪来的水？话说汽水又是什么？水里怎么能有气呢，那不是泡泡吗，说到泡泡那可不就是茶沫子吗，这都啥跟啥……\n\n错愕中，吴增光被小徐拉进国营商店花五毛买了一瓶冰峰汽水，直到丝丝凉意透过掌心沁入心脾，吴增光才终于回过神来，他盯着玻璃瓶看了好一阵，尽管明白了车间的玻璃瓶原来是用来灌装汽水的，但吴增光始终也想不明白这瓶子里的橘黄色液体和汽水二字有什么关联，汽水？哪来的气？水面上的沫子吗，这不还是茶沫子吗？\n\n一旁的小徐似乎看出了他的窘迫，不慌不忙地抠开瓶盖，嗤啦一声，瓶中液体就如沸腾一般开始翻涌起来。\n\n“没喝过？没事我一开始也不知道这啥玩意，贵是贵了点，但这玩意真好喝……”小徐举瓶仰头，还特地做了个干杯动作，吴增光有样学样，抠开瓶盖攥着玻璃瓶往喉咙里一灌——"
CPC_HZ.3.o: "透心凉！"
CPC_HZ.4.t: "汉中新变化"
CPC_HZ.4.d: "李文正觉得汉中越发大了起来，老市区竟渐渐同火车站连成片了，市里第一路公交也已开通——从古汉台到火车站往返，正好能载他每天通勤，这倒显得家里那架老自行车有些不合时宜了。当然，城区大了总是好的，至少自己不用怀疑为啥火车站修得离老市区那么远了——李文正的思绪随着窗外的建筑变幻而发散开来。\n\n眼前这栋楼是阵线粮储总局办公楼；街对面是汉中火车站农贸市场，偶尔他会攥着些粮票肉票来这里买点菜回家，农贸市场的鸡鸭都是现杀的，新鲜。有时候还能碰见有人在这卖水产，但通常他挤不进去闻风而来的人群——吃鱼对大部分内陆居民来说还是太奢侈了。\n\n过了十字路口，街区里有个电波塔，据说这地就是汉中广播电台，不过由于没闲钱买收音机，李文正对这座汉中最高建筑还没有什么实感。他更在意的是电波塔底下那个汉中火车站餐厅，年前火车站员工活动来这地方聚餐，他就对这地方的小炒牛肉赞不绝口——但要他自己来这花钱吃饭显然不太可能，一顿能花掉自己半个月工资的饭他可吃不起。\n\n再往前去就是汉中火车站的新仓库了，早先火车站修好没多久准备开始建设汉中的时候，由于汉中没有合格的仓库，许多工程材料甚至卷扬机吊车这些工程设备都只能露天摆放，任凭风吹日晒，最后统计下来，光轮胎漏气暂停使用的卡车就有至少70辆，红砖也至少有一两万块没法用，水泥更是没法说——还好现在有足够大的仓库了，装卸多少货都不在话下。\n\n“乘客同志们注意了啊，下一站就到汉中火车站了，站稳扶好了啊——”售票员的吆喝把李文正散乱的思绪带回现实，他又要去守火车站检票口了，不过，与以前时常发牢骚的他不同，现在的李文正坚信一件事。"
CPC_HZ.4.o: "汉中还真好起来了。"
CPC_HZ.5.t: "托派分子王实味给萧军的信"
CPC_HZ.5.d: "萧军我友：\n\n二十年前，你在会堂里的大喝我仍记忆犹新。“让他说话又能怎么样”，比起其他碌碌庸者的攻讦真是振聋发聩，更使我振奋至今，相信人间尚有希望。\n\n最近劳改农场又有个新到的年轻人，让我不得不惊叹世间真有重合之命运。他和我一样在北大上过学，同样满腔热血来到西北，同样靠文字吃饭，也同样不幸因文字获罪。初次见面时他的脸上青一块紫一块，向我介绍自己叫刘松萝，萝卜的萝。自那起我就叫他小刘，或者直接叫松萝——不过据监狱主管说他的本名是刘绍棠，就因为特别喜欢草头的字才自顾自改叫刘松萝。介绍过后，松萝朝我露出死尸一般僵硬的笑容，令我不寒而栗。我想，如果再不搞一些独具一格的追求，他可能会崩溃到寻短见吧。怀揣着不安的担忧，每天晚饭时候我都会去探望他，正如你一直对我的那样。\n\n从西安第四监狱转移到汉中劳改农场已经快一年了，托党中央的照顾，我在这里生活得很好，困难时期农场里有自种菜保证不饿肚子。说起萝卜，现今秋萝卜就快要收了，昨天晚上领导决定食堂加餐，允许我去拔几颗。大白萝卜个个长势喜人，活像浑身裹着泥的胖娃娃，要用两手抱着才能拿动。交给厨房洗干净，生做熟做都好吃。捧着碗里热气腾腾的萝卜汤，我猛然觉悟松萝为什么把植物当作精神寄托：生人恨不得躲着我们这些右派走，土里钻出来的萝卜尚能不分好恶任由我们吃进肚子，可能这就是劳改农场里为数不多的温情。想到这我不禁哑然失笑，同时多看了几眼坐在邻桌大口吞咽的松萝。\n\n一动笔就写了这么多事情，希望不会打扰到你，望你健康平安。\n\n毛主席万岁\n友 实味"
CPC_HZ.5.o: "把信扣下，改完再发。"
CPC_HZ.6.t: "惊弓之鸟"
CPC_HZ.6.d: "陕西师范大学汉中分校校区被正式启用后，渐渐聚集起各地的教职工和学生，从西安调来的文学讲师萧军和文学院书记杨泰被安排住在同一所职工房。\n\n“萧老师，组织上安排我和您一起住，相信您也明白用意。我作为咱们学院的书记得随时关注您的。当然有些学术上的问题还得要向您请教，希望我能和您一起进步。”\n\n萧军讪讪地和对方握握手，叫了一声“杨书记”，没有多说什么话。\n\n最初的陌生使二人各自保持着某些克制，尽量不给对方的工作添麻烦。一天的工作结束后，晚上会一起吃饭，还会到楼下一起散步。可一个月后，杨泰与萧军的关系依然形同路人，感情没有半分增进。曾经各种被批判的遭遇，都让萧军无法和这位“小官僚”和睦相处。他觉得自己被组织轻视，又觉得这是安插在自己身边的眼线。因此杨泰无论做什么，萧军都会与之刻意保持距离。\n\n每当家里来人找杨泰谈论工作，无论来者什么身份，是好意还是歹意，萧军总要一溜烟跑回自己的卧室关上门避而不见。至于萧军自己的生活，则一点也不让杨泰知道。他在书房里笔走不停，只要杨泰走进来就立马把书页合起来，用不易被察觉的警觉眼光扫视一下，坚持把杨泰请到书房外头说事。信件更是萧军的禁脔。有一次，萧军因为当日课少便早早从学校回家，杨泰则加班至傍晚，离校时从传达室帮萧军取回一封没来得及拿的信。回到家中，萧军一眼就看见杨泰手中的信封，脸上瞬间怒不可遏，劈手夺了过来质问杨泰有没有偷看。待仔细检查确认无虞之后就把杨泰晾在一旁，自顾自冲进书房锁上门。\n\n——或许再次走出书房的萧军会不好意思地向杨泰为自己的鲁莽和冲动道歉，但如果有下次，他的怒火依然会爆发，照旧重演这一幕。\n\n不过萧军的某些疑虑是正确的，杨泰确实被安排时刻观察萧军的动向，并按时向组织汇报。萧军用严防死守堵住了套取关系的各种办法，在这个月的报告上，杨泰给萧军写下了这样的评价：他就是一头狼，只懂得过度自卫，忘记了怎样与人相处。"
CPC_HZ.6.o: "以后会改观么？"
CPC_HZ.7.t: "汉中龙脉 - 一"
CPC_HZ.7.d: "街边蹲着三个抽烟的工人，他们背后则是刚刚竣工的汉中西城区，其中一个老者指着方盒子似的通气孔开口了：“知道这啥玩意吗？跟他妈烟囱似的，但又不在屋顶上，不知道干啥玩意。”\n\n“俺也不清楚，不过俺听说里面连着一个啥地下长城，为了挖这玩意不知道动员了多少人力物力呢！”另一个工人神秘兮兮地答。\n\n“这么神秘，建皇陵呢吧。”老者嘿嘿一笑，“准是给毛主席刘主席他们准备的，将来百年了到底下去跟始皇帝一块保佑老百姓。”\n\n“要不人家说你俗呢，日本人还没打跑净替人家考虑棺材镀不镀金的晦气事，依我看，搞不好是在挖秦始皇的龙脉，就这烟囱，搞不好是人家挖龙脉准备的气眼！一挖到龙脉，到时候始皇帝睁眼赐福，可保咱国运亨通百年呢！”两个老工人嘻嘻哈哈地聊着，把小吴晾在一边。\n\n小吴——作为三人中看上去稍微斯文年轻一点的实习工——只好无奈地跟着附和苦笑两声，他明白这压根就不是什么始皇帝的龙脉，但这根“烟囱”却确实地让他陷入了回忆中。\n\n“我知道这玩意是啥。”小吴抽一口旱烟，“我两年前来过汉中……”"
CPC_HZ.7.o: "“当时——”"
CPC_HZ.8.t: "汉中龙脉 - 二"
CPC_HZ.8.d: "中央指示，在校学生有参与社会劳动的义务，只不过小吴参与的劳动项目比较特殊，西安大学建筑系挑选了50名体格健硕有土木经验的年轻学生来到汉中参与为期一周的义务劳动，但具体要干什么却只字不提。\n\n直到他看到到处飘扬着红旗、搭着帐篷的汉中新城区建设工地，才明白了一切。卷扬机轰轰隆隆旋转着，工人师傅们忙着往外运土石，这很明显便是在挖防空洞——所有人都知道阵线与日本还会再有一战，和西安类似的三防工程在汉中也丝毫没有落下。\n\n到地简单休整一上午后，参与义务劳动的学生们就投入到工作中，他们这些学生可没有工厂使用的卷扬机，全靠在竖井口上支个三脚架，挂上滑轮和绳子，绳子头上栓个大筐，筐里装土、材料和上下的人，再用人力来回拉绳子。\n\n汉中的地理条件不错，在地下挖洞很少会碰到石头，用钢镐、铁锨就能掘进，大家并不觉着累，反而感得很好玩。模仿着地道战里的桥段嘻嘻哈哈地玩闹。但这不是没有危险的，他曾经亲眼看见一个同学因为不知深浅从运土的木篮上摔下把肚子砸出个大窟窿，有个带队老师下井时差点摔落井底，爬上来后双手已经满是血痕。\n\n尽管施工条件如此简陋，事故风险也不低，但出乎他意料的是，汉中人民依然积极地用三轮车、自行车运砖头，运石头，支援防空工事的建设。\n\n“……这就是你们说的‘汉中龙脉’，没啥保不保国运的说法——”小吴抽了一口烟。"
CPC_HZ.8.o: "“——它保的是咱们的命。”"
 #外科医生大冒险 - 62后
CPC_Yang_Yingcai_stories.1.t: "归乡之路 - [GetYear]年，西安"
CPC_Yang_Yingcai_stories.1.d: "这大概是杨盈彩第一次离周总理这么近——也许是唯一一次。\n\n惨淡的白色灯光下，一大批穿着中山装军装的中老年人正跟在她身后，推着周总理的病床往急救室飞奔而去，她刚想挥手驱赶前面挡路的人，却发现病床扶手上早已是一片汗渍，来自院长的声音也变得遥远起来：“杨主任，请你检查一下总理的瞳孔……杨主任……杨盈彩同志！”\n\n杨盈彩骤然惊醒，她仍然保持着飞快的脚步，右手已经探上周恩来的面颊——却听见背后一声闷响，好像有人摔倒了。她愣了片刻，无暇再顾及背后摔倒的是哪位可怜人，她上下打量了一番眼前这个紧闭双眼的老人，简单拨开了他的眼睑。\n\n“全身没有明显外伤，瞳孔明显散大，情况很危险！”杨盈彩都快听不出自己的声音了，她只觉得自己的心咚咚跳——仿佛天塌地陷一般。\n\n从急诊室出来已是半小时后，眼见杨盈彩摘下口罩，心急如焚的邓颖超、薄一波等人立刻凑了上来：“医生同志，情况怎么样？”\n\n“现在病情平稳下来了，总理的急病应该是脑血管方面的问题，我们已经组织了急诊内科的所有专家，马上准备手术。”面对如此多重量级人物，杨盈彩的声音有些不自觉地发抖起来，简单回答了几个问题后便匆匆离开了。\n\n她回到了自己的办公室，简单洗了洗手，看了眼墙上挂着的日历。"
CPC_Yang_Yingcai_stories.1.o: "“原来时间……这么快啊。”"
CPC_Yang_Yingcai_stories.2.t: "归乡之路 - [GetYear]年，西安"
CPC_Yang_Yingcai_stories.2.d: "最终杨盈彩还是接了教导毛主席女儿学习外科知识考外科医助资格证的任务——倒不是因为她政治过关，恰恰相反，解放军总医院里政审背景最有问题的恐怕就是杨盈彩自己——五八年在西安第一监狱写的黑材料还原封不动地躺在301医院的档案室。她能留在301医院当外科副主任完全是因为在马家军叛乱中立过大功，作为主刀医生救过不下十个营团级干部的性命。\n\n而政治压力在李讷身上也同样存在：一个过于威名显赫的父亲会成为儿女的负担，整个总医院上下除杨盈彩外几乎无人敢真正满足李讷边护理边学习的愿望，用李讷后来的话说：“比杨老师医术好的怕教不好担责，比杨老师敢担责的医术不如杨老师。”\n\n不过杨盈彩对于自己的黑材料问题并不十分在意——准确地说经过大跃进时期的折腾，她已经破罐子破摔，不在乎了。她现在只有一件事要做：观察李讷够不够格开始学习外科学知识。\n\n幸好，在长达一个月的试用期里，杨盈彩终于确定李讷在学校学的护理技能很扎实，作为护士来说无可指摘，但作为医助还远远不够，机械重复护理工作而不学理论是不行的。她终于下了决心，但却在熬夜排了一晚课表后终于扛不住昏昏沉沉的脑袋，趴在桌子上沉沉睡去。"
CPC_Yang_Yingcai_stories.2.o: "这时，门被推开。"
CPC_Yang_Yingcai_stories.3.t: "归乡之路 - [GetYear]年，西安"
CPC_Yang_Yingcai_stories.3.d: "刚到解放军总医院的日子里，李讷的心里是存着一些不悦的：且不论妈妈不顾爸爸反对强行找周叔叔写了那封推荐信，她自己也并不喜欢过前呼后拥众目睽睽的生活——直到看到愿意带她学习外科知识技能的杨医生面如古井波澜不惊时，李讷悬着的心才稍微放了下来。\n\n但随之而来的却是一个月的冷落，她的生活变成了真正的三点一线——食堂、住院楼、宿舍。她数次开口询问杨盈彩究竟要多久才能开始学习，但杨盈彩只是报以神秘的微笑：“再等两天。”\n\n又是一个平平无奇的清晨，李讷应杨盈彩前一天的邀约来到她的办公室，但却发现杨老师趴在桌上静静睡着了——她的桌案上横摆着一支尚未合盖的钢笔，她弯伏的身下则压着一张厚卡纸。\n\n“杨老师。”李讷轻轻戳了戳她的肩膀，杨盈彩悠悠醒转过来，抬眼看了看李讷：“来得倒早——昨晚给你排课表就没回去。”\n\n听得“排课表”三个字，李讷一个月以来的阴郁一扫而空，笑意瞬间挂上眉梢：“杨老师……真不知道叫我怎么谢谢您！”\n\n“诶，别急着谢。”杨盈彩把排满了学习和实习日程的厚卡纸递给李讷，“我那时候学外科可没啥像样的课本，刚从学校出来就得上战场救人，唯一能用的活教材就是……”她的眼神渐渐暗淡下来，“……远征军的伤残兵。”\n\n李讷并不知道杨老师的底细，但她也从爸爸叔叔的口中以及小时候的时局报刊中听说过缅甸的中国远征军——她是从云南来的么？但未等她开口，杨老师便作好了安排。\n\n“先把这张课表拿回去吧，之后我会教你外科的基本知识——各种外伤的辨认处理，比较复杂的大伤口缝合，常用的外科药和药理……”看见李讷在那发愣，杨盈彩抿嘴笑了笑，“如果有空，我再给你讲讲我的故事。”"
CPC_Yang_Yingcai_stories.3.o: "“保证完成任务！”"
CPC_Yang_Yingcai_stories.4.t: "归乡之路 - [GetYear]年，西安"
CPC_Yang_Yingcai_stories.4.d: "这是难得的休闲时光，查房和日常开药工作早早结束，也没有手术和急症患者需要处理，李讷便早早叫了杨盈彩来到医院楼下的绿地中慢慢散步。\n\n“杨老师，我把您之前给我出的那套卷子答完了，明儿一大早就带来给您。”李讷的脚步虽然缓慢，但相较于已经慢慢步入更年期的杨盈彩来说，仍然轻盈不少，一旁的杨盈彩只是安静地点点头。\n\n“爸爸前些日子老是唉声叹气的。”李讷犹豫许久，还是说出了自己的苦恼，“我问他为啥唉声叹气，明明马家军也打掉了，蒙古也解放了，他也不回，就是经常对着地图和老照片发呆，您说，他在想啥呢？”\n\n杨盈彩不动声色，但心里也已是翻江倒海，心说毛主席这么大的人物考虑的事我哪清楚，只能用一句淡话搪塞过去：“主席他老人家肯定是在为咱们中国谋一个未来吧。”\n\n但话一脱口，杨盈彩突然陷入了多年前的回忆漩涡里——她看过被日本人炸烂的飞虎队士兵、治过没粮吃野草不幸中毒的山民、照顾过因为中央军大屠杀而无家可归的四川孤儿……\n\n“他一定是这么想的吧。”杨盈彩轻轻甩了甩头，像是要把多年目睹之悲剧从脑子里甩出去求得一丝清净。她的思绪回到了那个比她更年长也看过更多悲剧的毛泽东——自己尚且如此，何况这杆中国革命的大旗——但那场甚至自己也牵连其中的大跃进……\n\n她努力摇了摇头，不再去想这些事。正巧，李讷的声音合乎时宜地把一个好消息送进自己的耳朵：“说回来杨老师，我妈前些日子跟我说，汉中要挑一批优秀医生去援建，我当时就跟她说教我这个杨老师特别好，如果杨老师去我也能跟着去看看！”\n\n杨盈彩当然明白李讷的期望——毋宁说她自己也有这种期望，她并不忙于询问江青对自己的看法，而是若有所思地点点头。"
CPC_Yang_Yingcai_stories.4.o: "“那也许我可以试试。”"
CPC_Yang_Yingcai_stories.5.t: "归乡之路 - [GetYear]年，西安"
CPC_Yang_Yingcai_stories.5.d: "杨盈彩失魂落魄地坐在自己的桌前——光是去档案室拿自己的档案就已经耗尽了她全部的勇气，而在把档案递给那个她并不认识名字的同行后，她彻底丧失了信心。\n\n这时，李讷送了病人的档案过来，她清楚这几天杨盈彩已经上交档案准备申请援助汉中了，于是下意识地问道：“怎么样杨老师，去汉中的事有结果了不？”\n\n“应该没啥希望。”杨盈彩从短暂的失神中回过味来，抬头看着身后的李讷苦笑，“我政审不可能过关的。”\n\n李讷感到愕然，她不敢想象眼前这个温文尔雅医术高超责任感又强的杨老师为什么会政审不过关。\n\n“你之前不是一直跟我说要我讲讲我来西安当医生以前的故事么，301院的医生或多或少都知道一些，不知道他们有没有跟你讲。”\n\n“搭不上话，感觉他们看我真跟看皇帝家公主似的，每一句话都像是求我一样，我不喜欢那样。”李讷蹙着眉摇摇头，“爸爸经常跟我说我也是劳动人民的一份子，我也是无产阶级的一份子，不要搞特殊……”\n\n杨盈彩意味深长地笑，但并不说话。\n\n“我知道杨老师你也在躲我，我求你好几次了你就是不肯给我讲。”见杨盈彩没有回应，李讷有些急躁，“我真的不想这样……”\n\n见李讷态度诚恳，杨盈彩长叹一口气，摆摆手示意李讷坐在办公室的病床上：“我也求你这一次，我可以给你讲讲我的故事，但……”\n\n李讷心领神会：“我保证不说！我还要您当我最好的杨老师呢！”\n“也别说给你家里人和你认识那些叔叔阿姨。”杨盈彩叹口气，“我那点破事可不想让这么多大人物都晓得……”"
CPC_Yang_Yingcai_stories.5.o: "“故事有点长，得从云南讲起。”"
CPC_Yang_Yingcai_stories.6.t: "归乡之路 - [GetYear]年，西安"
CPC_Yang_Yingcai_stories.6.d: "301医院的医生会不定期被组织上安排前往根据地其他城市进行巡诊，这次中签的恰好是杨盈彩和李讷，而目的地离西安很有一段距离：兰州。\n\n得知李讷中签要去兰州，她父母的反应着实让杨盈彩开了眼：毛泽东写了封贺信要李讷跟着老师好好学本领；江青却毫无动作，甚至连医院都懒得来——但这不代表江青不关心女儿的事，很快杨盈彩就被医院党委书记、院长、科主任、住院部主任等人统统约谈了一次，大意是说程序虽然是死的，但人是活的，李讷同志去兰州万一有个三长两短全院上下不好向党中央毛主席交代……\n\n出发的日子越来越近，杨盈彩心里清楚，无论别人怎么暗示怎么阻拦，决定这次兰州之行的永远是李讷自己——她来医院只是来镀金的？还是真心实意要给人民瞧病的？杨盈彩并不清楚，她决定晾着这件事不管，也当是自己对李讷想法的最后一次考验。\n\n终于，面红耳赤的李讷在临行前一天一把推开了杨盈彩的房门：“杨老师，他们太过分了，组织上的程序怎么能说推翻就推翻呢？凭什么我不能去兰州？”\n杨盈彩面无波澜，但心里暗自长出了一口气：“到底没给你爸丢脸，合格了。”\n她拍拍病床，示意李讷坐在这里：“这事确实有风险，我听说回族闹得凶……”“凶又怎么了？杨老师您当年一个人到西安来的时候不觉得凶吗。”李讷气鼓鼓地打断她。\n\n杨盈彩挠挠头：“倒也不是这个意思……我没有拦你的想法，但是这次去可不是公款吃喝，刚刚结束戒严，一是治安差，二是任务重。”\n\n“任务重就对了，爸爸说了，要我们年轻人往阵线最需要的地方去为人民服务。”李讷的眼神不容置疑。\n\n见状，杨盈彩赞许地点点头，不再遮掩自己的想法：“你能这样想很好。”"
CPC_Yang_Yingcai_stories.6.o: "“我们明天一早就坐火车出发。”"
CPC_Yang_Yingcai_stories.7.t: "归乡之路 - [GetYear]年，兰州"
CPC_Yang_Yingcai_stories.7.d: "尽管做足了心理准备，但兰州的任务之重还是超出了李讷的想象：从青海前线上退下来的伤兵几乎都是被流窜民间的马家残部和当地土匪所伤，大部分只是每天躺在病床上靠吊瓶吊着一口气，伤口感染而撒手人寰的更是数不胜数——她想起了杨老师和她一般大的那个年代，想起了杨老师给她讲的滇西抗日前线的点点滴滴。\n\n“别愣着，小李同志，把止血钳递给我。”杨盈彩温和的声音恰到好处地把李讷从恍神中拽出，她镇定心神，捏起止血钳递给杨老师，随后看着眼前这个深度昏迷的士兵，在心里过了一遍知识点——这是个可怜人，枯瘦的双手倒是仅有些许擦伤，但一条左腿血肉模糊，还能看见点点白色碎骨嵌在已经发焦的伤口中。她不忍再看，撇过头去，却看见杨盈彩正在一旁给骨锯做消毒处理——看来这条左腿是保不住了。\n\n“他是在行军路上被战友踩中爆炸的反步兵地雷波及的，这算轻的，没一条腿就能保命，踩中地雷的那个人当场会碎成一滩，哪怕医术再进步一百年也救不回来。”杨老师看来游刃有余，还有余力给自己上课，“这条肌腱是……”\n\n……\n\n外科截肢手术耗时极长，当李讷战战兢兢缝好最后一针，两人这才长出一口气，摘下早已被汗水浸透的口罩。\n\n“恭喜你，李讷同志，第一次全程参与外科手术感觉如何？”杨盈彩褪下消毒手套，“恐怕和我第一次见到被日本人炸烂腿的飞虎队飞行员时一样。”\n\n李讷苦笑着点点头。"
CPC_Yang_Yingcai_stories.7.o: "“很愧疚，学得还不够多。”"
CPC_Yang_Yingcai_stories.8.t: "归乡之路 - [GetYear]年，攀枝花"
CPC_Yang_Yingcai_stories.8.d: "有了去兰州援助医疗的经验，301院上下都替李讷松了口气——其实也是替自己松了口气，至少如果李讷又被外派去巡诊，江青不会再派人来唠叨了，杨盈彩也不用被各级领导轮番约谈了。\n\n时间就这样平淡地一天一天过去，很快李讷和杨盈彩迎来了第二次抽签外派的机会——这次目的地是攀枝花。\n\n站在攀枝花街头的两人面面相觑——不过原因却各不相同。\n\n“我大概……十几年前来过攀枝花，为了找我妹妹。”杨盈彩茫然地左顾右盼，“变化这么大啊……我那会，这地方甚至都不是个镇子，就稀稀拉拉几座房有一条主街，现在都成县城了。”\n\n看着平常那个总是从容温柔的杨老师竟也有慌张茫然的一面，李讷不禁抿嘴一笑：“这里现在不止是个县城，咱解放军的西南兵团现在也驻扎在这，听爸爸说，攀枝花矿多，这才把这里好好建起来的——说回来，杨老师，您妹妹还没找到吗？”\n\n“我到西安住下以后就没时间了——而且也没门路。”杨盈彩漫不经心地答道，“偌大个大西北要找到个不知死活的娃娃，唉，太难了。”\n\n眼看杨盈彩没有继续话题的兴趣，李讷只好换了个话题——不过此时的她还不清楚这个话题将给杨盈彩的人生带来怎样的涟漪：“前几天见到些奇怪的东西。”\n\n杨盈彩仍然往前走着：“嗯？”\n\n“就是前几天医院药房缺人，我顶了库管两天班，有两批从格尔木运来的……应该是藏药吧？我看见了运输单，上面的文字我看不懂，但绝对不是藏文，看着倒很像英语啥的……”\n\n格尔木？格尔木还有拉丁字母的使用者……等会？记忆迅速从杨盈彩脑海中褪去尘封，她不假思索脱口而出：“是不是有些拉丁字母，同时还有些你看不懂的花纹一样的文字？”\n“杨老师你知道吗？”\n“那是苗文的一种，你看见的那些药可能是苗药。世纪初有个叫伯格里的英国传教士为了传教给贵州云南这些地方的苗族设计出来的文字，我在云南时经常和苗族药商打交道……我也是跟着苗族药商队去买药的时候把我妹搞丢的……”杨盈彩的大脑飞速运转着，她直直瞪着李讷。"
CPC_Yang_Yingcai_stories.8.o: "“回西安后请你带我去一趟药房。”"
CPC_Yang_Yingcai_stories.9.t: "归乡之路 - [GetYear]年，格尔木"
CPC_Yang_Yingcai_stories.9.d: "作为格尔木唯一一家苗医药房的女掌柜，三十出头的她在历次风暴中得以因这座小药房而安存无恙：四七年宁渝合流，格尔木山高皇帝远；四九年第三次国共合作，这里作为格尔木最稳定的药房而受到国共双方的礼遇；六一年马继援独立，清共演变为屠杀，她同样凭借这座药房幸免于难——直到如今，无论外面风云如何变幻，杨盈喜都有一份小小的信心：只要疾病这一伴随人类上百万年的大敌还存在一天，只要自己还是格尔木唯一的苗医药商，她和这座小小药房就能安然无恙——只是，不知道自己那苦命的姐姐在哪里，是否还活着。\n\n她并非没有打听过姐姐的下落，她只是太过年轻——六零年带她辗转来到格尔木的老苗族去世后，她才接过药房的衣钵，才有打听姐姐消息的能力。她清楚姐姐是个基督徒。从六一年以来杨盈喜就开始刻意打听各地教堂看看有没有收留一个约莫四十多岁的中年修女——但毫无下落，唯一仅有的一点线索是，似乎成都的一座教堂曾经收留过一个懂医的基督徒，但也毫无下文。\n\n时间就这么缓缓流淌，格尔木市委最近又送来了一批货单，联络员的样子看来很焦躁：“杨医生，解放军总医院外科要一批外敷药，这是货单。”\n\n杨盈喜点点头接过货单，上面并非是平常的方块字——解放军总医院怎么会有能写伯格里苗文的医生？\n\n惊诧之余，杨盈喜收下货单，她决定在这次的货单中以苗文写下自己的疑惑——至少这次值得一试。"
CPC_Yang_Yingcai_stories.9.o: "“我在找我的姐姐，她姓杨。”"
CPC_Yang_Yingcai_stories.10.t: "归乡之路 - [GetYear]年，重庆"
CPC_Yang_Yingcai_stories.10.d: "从西康回西安不过一个来月，甚至都还没等到格尔木那批货物和她期待中的回信，杨盈彩就被紧急调往重庆协助战后医疗——这次李讷没有跟去，杨盈彩去重庆并不是单纯援助医疗，在滇西抗日的时光让杨盈彩具备了基本的制备和防范剧毒药品的知识，她被要求协助重组后的西南农学院做好防疫减灾的工作。\n\n农学院试验田里，年轻的研究员正带着杨盈彩介绍农学院的实验种：“这几亩是我们院的一个年轻教员袁隆平同志负责的，产量比一般的稻田可高出百分之四十。就是目前这一代耐药抗毒的特性差些。”\n杨盈彩点点头：“抗毒耐药性是基因学的东西，这种稻子能不能抗一般的农药？”\n“也不行，洒农药以后倒伏率就过半了，我们现在正在往这方面改进。”\n“我听说，我们重庆这边最近敌伪活动多起来了。”\n“对的，听西安的同志说杨老师您参加过滇西抗日，懂生物化学的相关知识，这次请您来也主要是想给我们这边的同志培训基本生物战的原理和防范措施，敌伪前几日侦察机天天绕，估计下一步就是撒传单蛊惑人心甚至撒毒气细菌残害根据地了。”"
CPC_Yang_Yingcai_stories.10.o: "“明白，我一定倾囊相授。”"
CPC_Yang_Yingcai_stories.11.t: "归乡之路 - [GetYear]年，格尔木"
CPC_Yang_Yingcai_stories.11.d: "似乎写了伯格里苗文的货单只有那一次，而杨盈喜的去信也石沉大海，她有些愠恼，不知道是哪个挨千刀的拿自己寻开心，明明自己找不到姐姐已经急得像热锅上的蚂蚁了——\n\n格尔木卫生局的供应科办公室门被推开，杨盈喜径直走到科长面前：“同志，最近西安那边缺药不？”\n望着突然来访的杨盈喜，科长显得有些手足无措：“还没特地打单子来……老乡，您这是……”\n“啊——没事！我就是担心西安缺药材，怕耽搁了革命工作——不缺就好，不缺就好，同志您忙，您忙啊。”杨盈喜声调一下高了八度，显得慌张无比——这也太失态了，为了朝思暮想的姐姐就这么冲到这来，像是个强买强卖的霸道老财一样。她慌忙关上办公室的门，徒留呆立在那不知道这是在演哪一出的科长。\n\n走出卫生局小楼的杨盈喜第一次觉得格尔木的阳光是那么刺眼，她暗暗下定了决心。"
CPC_Yang_Yingcai_stories.11.o: "“下次我非亲自送货去西安不可。”"
CPC_Yang_Yingcai_stories.12.t: "归乡之路 - [GetYear]年，西安"
CPC_Yang_Yingcai_stories.12.d: "李讷气冲冲走进杨盈彩的办公室，坐在病床上。\n\n“什么事？”杨盈彩并未抬头，她被增补为国防阵线外科教材编委会成员之一，负责战场简易消毒和军医外科手术的编写，现在正在撰写提纲。\n\n“爸爸这几天咳得厉害，保健医生叫他少抽点烟，非不听，天天夹着纸烟卷，走路也抽，开会也抽，看地图写文章也抽！”"
CPC_Yang_Yingcai_stories.12.o: ""
CPC_Yang_Yingcai_stories_tooltips_sorry: "总有一天，§m破镜可以重圆§!，§C命运可被重构§!，§G她们§!的故事§Y尚未完结§!。\n\n制作组注：杨盈彩的个人故事尚在写作中，请持续关注今后的热修复及更新！"
CPC_Yang_Yingcai_stories.101.t: "归乡之路 - 抉择"
CPC_Yang_Yingcai_stories.101.d: "“又见面了，杨……杨盈彩同志。”果不其然，负责南下军团医疗队征聘的人又是徐林，但杨盈彩却不太记得这人是谁了：“我们在哪里见过吗，同志？”\n\n“几年前，有个女医生要援建汉中，却扭扭捏捏不敢交档案过来。”徐林轻笑，“不过现在应该不会有那个问题了吧？”\n\n杨盈彩恍然大悟，笑着说道：“前些日子转正外科主任了，也入党了——现在我总能光明正大投身我们阵线的抗日事业了吧？”\n\n“那是自然。”徐林笑着说道，“不过这次得想好——队伍里已经重组成两大军团了：徐司令员领北上军团马上就要打山西，战斗烈度会很高，医疗缺口可以想见也会很大；林副主席领的是南下军团，先打云南，您又是云南人，我想漂泊在外半辈子……确实也该回去看看了。不知道您想去哪边。”\n\n眼前的杨盈彩似乎陷入了两难，徐林也并不忙于催促她——这个办公室是面向社会招聘的，大部分医生其实不用特地过来，一旦战争爆发组织上自会安排他们的去处，实在是眼前这个杨医生抗日热情太高了——三十年岁月都没能磨灭一个亲身参与过滇西抗战的医生的热情。\n\n终于，杨盈彩像是下定了决心，抬起头来。"
CPC_Yang_Yingcai_stories.101.o1: "“那我还是……回我那老家吧。”"
CPC_Yang_Yingcai_stories.101.o2: "“哪有需要我去哪，我去援助他们打山西去。”"
CPC_Yang_Yingcai_stories.325.t: "归乡之路 - 终"
CPC_Yang_Yingcai_stories.325.d: "南下军团已经往东攻去，杨盈彩则留守后方，被委任为新成立的禄丰县人民医院院长——她终于还是站上了久违的滇中大地。\n\n曾有无数次，杨盈彩在梦中都会回到这片生养了她的群山，她仿佛看见山野渐渐漫起蓝色的雾气，高大的松柏、樟树、榕树把枝杈刺向苍穹，村落、寺庙、水车、关隘都被变幻无常的雾岚所笼罩……魂归故里，或许是她梦寐以求的人生终极。\n\n她猛地想起昆明争夺战，双方动用了超过五个师在昆明坝子血战，大规模炮战甚至硬生生让昆明西山睡美人的头发被打出一个缺口，翠湖上的浮尸更是至今都没捞完……而眼前，就在禄丰县城的金山镇，一切都沉寂了，解放军已经往东而去，那些曾生生将她从噩梦中拽起的惊心动魄的枪声、撕心裂肺的呐喊、悲痛欲绝的呻吟、狼藉遍野的残肢断骨都早已沉寂，只留千疮百孔仍迎风飘扬的军旗猎猎作响。这大半辈子仿佛做了一场梦……\n\n她终于回来了，老家的情况不好不坏，一些人逝去，一些人降生——正如她的工作便是从死与新生的关隘中夺下命不该绝的灵魂一样。杨盈彩抚摸着医院正中心那棵老榕树——飘零半生，此时她才终于明白落叶归根的滋味，一个念头合乎时宜地从她脑海中升起。"
CPC_Yang_Yingcai_stories.325.o: "等全国解放，带妹妹回一趟老家吧。"
CPC_Yang_Yingcai_stories.1023.t: "归乡之路 - 终"
CPC_Yang_Yingcai_stories.1023.d: "杨盈彩合着眼，仿佛睡了过去……但她是被呼啸而来的炮弹震晕的，在纷乱的潜意识世界中，她只觉得自己来到了安塞腰鼓的现场——腰鼓震天轰响，漫天黄尘中白羊肚手巾在点点跳跃，绥德的精壮后生，米脂的俊俏闺女，硝烟中的《黄河大合唱》，刀枪铿锵的《大刀进行曲》……她忽又来到了自己身处的华北前线，千里太行，数十万解放军官兵高唱着：追上去，追上去，不让敌人喘气，不让敌人跑掉……她又来到了硝烟滚滚的成都，看到了流着清泪的孩子们，她刚开口，却发现自己的声音是那样遥远——仿佛这声音将她提拽起来，又来到了另一处时空……那是滇中的山雨，豆大的雨点敲在樟树叶上落下，打在一对正值豆蔻年华的少女的帽檐上，那时的她们无忧无虑——仿佛世界从未天翻地覆。\n\n她猛地惊醒，自己明明还在华北前线的战壕中，为何竟看到了如此光景？她探出头去，一枚迫击炮弹从五六十米的高空带着尖利的呼啸声，落在杨盈彩身旁。在爆炸的一瞬间，她觉得自己仿佛变成一片轻盈的羽毛飘起来，大脑在彻底陷入黑暗之前只剩下一个念头。"
CPC_Yang_Yingcai_stories.1023.o: "“我终于也是个烈士了……”"
CPC_Yang_Yingcai_stories_end_tt: "§G她§!的故事§Y到此结束§!——但还§C不够完满§!，也许，当世界线泛起§x自疆外而来的涟漪§!，阴晴不定的§C命运§!之手就将填补§C这诸多遗憾§!。"
 #种田阶段带李讷去西康
 #外科医生大冒险 - 历史
CPC_Yang_Yingcai_history.1.t: "归乡之路 - [GetYear]年，西安（1）"
CPC_Yang_Yingcai_history.1.d: "疲惫。在连续一个上午的工作后，徐林感到全身心的疲惫——前来应征的人不少，但多数都是些在前线抬了几天担架的民工，把这些人送去汉中简直毫无意义，他不得不一遍遍地向这些过于热情的青年说明情况，并劝他们回到人民更需要的岗位上去。即使脾性再好，也经受不了这样的折腾，徐林摘下他的老花镜，想要抓紧时间休息一阵。\n\n然而，他就连忙里偷闲的机会也没有。在他摘下眼镜的当口儿，面前的破门又吱吱呀呀地响起让他不快乐的敲击声了。\n\n“请进吧……”\n出乎他的意料，在门后闪出的却是个身材不甚高大的女性。看起来她已经度过了一个人生命中最光彩照人的青春时光，步入安静流淌的中年了，但徐林还能从她的身上感受到一股勃发的生命力。作为医务工作者，徐林敏锐地觉察到，来者可能是他的同行。\n\n“你以前有过相关的工作经验？”\n“是的，我是301医院的外科医生。”\n来人说得笃定，不像是假话，但总觉得她好像过于笃定了，像是要诱使他在兴奋之中直接敲定些什么一样。\n\n“那太好了。同志，请你把相关的政治材料留在这里，明天下午再来的时候，我们会给你答复的。”\n“……不能您在这里问我几个专业相关的问题吗？我知道支援汉中是要紧的事情……”\n“同志，你不会是没有带相关的材料吧？”\n听了这话，女医生也不再坚持。她慢慢从怀里拿出一个纸袋子放在台面上，深深地鞠了一躬，然后不发一言地从房间里退了出去，门缝里透下来的光砸在档案袋上，让徐林第一次看清了她的名字。"
CPC_Yang_Yingcai_history.1.o: "“杨盈彩”"
CPC_Yang_Yingcai_history.2.t: "归乡之路 - [GetYear]年，西安（2）"
CPC_Yang_Yingcai_history.2.d: "从西安市医院的正门走出来，杨盈彩深吸了一口气，有一种说不出的感觉让她既轻松又悲伤，脚下软得如同踩了棉花。西安正午的阳光轻轻地拥抱着她，好像要宽慰她，好像要融化她那些不好的念头，但她心里清楚，那个纸袋子递出的瞬间，她与汉中的缘分也就被切断了。\n\n——袋子里装的是她的“污点”。准确地说，是政治污点，是大大小小的政治风潮在普通人身上留下的刻痕。对于一线的医生而言，些少政治问题未必就会影响他们的工作，可是这次非比以往，汉中是党特别留心、重点指示建设的新城市，岂能容黑线插手其中。\n\n是，她的生活并不会因此分崩离析，她还在301院有着稳定的副主任工作。杨盈彩这样安慰着自己。毛主席不是曾经说过吗？抗日战争只是转入了长久的相持。更何况，边境摩擦仍在继续，总有那么一支两支部队会因军医短缺而破格聘用她——但那没用，游历多年的医术和眼光都绝不该仅仅只止步于此，即使已过了不惑之年，她也还有自己想取得的东西——哪怕只是奢望，哪怕最终不可能实现，她渴求着汉中，就像受唾弃的重刑犯渴求着地广人稀的荒原。\n\n一种流泪的冲动涌上她的鼻尖眼角，但她没有哭，新时代顶天立地的女性是不能随便让自己的眼泪流淌出来的。杨盈彩挺直自己不魁梧的身板，大踏步地向前走去，消失在人潮中。"
CPC_Yang_Yingcai_history.2.o: "断翅的鸟儿似乎永远回不了她的暖巢。"
CPC_Yang_Yingcai_history_tips_0: "§G她§!的过往§Y即将揭幕§!。"
CPC_Yang_Yingcai_history.3.t: "归乡之路 - [GetYear]年，西安（3）"
CPC_Yang_Yingcai_history.3.d: "“我们就不能破格录用吗？”\n\n“破谁的格？”西安市医院党委书记瞟了他一眼，“徐林同志，我必须提醒你，你的阶级立场有滑坡的风险，你需要马上改正过来。”\n\n徐林深吸了一口气。参加工作已快三十年，这是他第一次感受到为什么没人愿意和“右”沾边。尽管如此，他还是想要做一下最后的争取。\n\n“我当然不会为右派分子摇旗呐喊。我只是想要强调一下，杨盈彩六一年在马家军叛乱前线立过功，还是301院的外科副主任，甚至都可以独立完成外科手术，她甚至还是李讷同志的老师，我想……”\n\n“她确实是一个不错的人选，”党委书记举起一只手，示意徐林可以不必讲下去，“去汉中援建无重大责任事故的医师，回来以后都能各自升一级待遇，对所有人来讲这都是个香饽饽，但正因如此，中央才要求我们严格注意队伍的纯洁性和纪律性，不会容许黑线插手——”\n\n“我们征集汉中医疗队到底是看一个人的业务能力还是政治立场？！”\n\n“……请你冷静，徐林同志。先前援建队支部会议已经决定了，杨盈彩不予以录用，她不会出现在援建汉中医疗队的名单中，我希望你能够尊重其他同志的意见。以及——”\n\n断然说出结论的同时，党委书记从抽屉里取出了一个很大的包裹，把它推给徐林。\n\n“这是我们应你的强烈要求，调取的有关杨盈彩的笔录复写件以及她签字承认过的历史材料。虽然我觉得已经没有必要了，如果你想看的话，就在这里看吧。”"
CPC_Yang_Yingcai_history.3.o: "“这医生到底中过啥邪？”"
CPC_Yang_Yingcai_history.4.t: "离乡之路 - 1944年，昆明"
CPC_Yang_Yingcai_history.4.d: "一封措辞激烈的辞职信被交到昆华医院院长秦光弘的手中。\n\n“……若以所谓滇土自决之说辞掩盖省府令人唾弃之叛国行径，则我医护人员数年来为救护前线抗日将士之辛勤工作将意义全无。省政府对日和谈之意已决，则我自忖再无留院治病救人之必要，特书此函告秦院长。”\n\n对于杨盈彩这样成长于战争年代的外科医生而言，伤病和死亡早已如影随形：沿滇缅公路且战且退的远征军伤兵没了右手，却仍然想回前线打日本；从大理逃难而来，身上枪伤早已流脓的可怜白族老农丝毫不知伤口感染已经夺去了自己的最后生机；在云南驿机场被炸烂了双腿的飞虎队飞行员的嚎叫声越来越弱，直到大失血死去。\n\n但她既不逃避，更无惊惧，她总能从容地走上手术台，从容地从死神手中抢下几条人命，或者从容地为不幸蒙难的死者盖上白布。\n\n但她的从容与镇定终究还是被龙云卢汉的卖国行径毫不留情地击碎了，从前为了抗日做的一切努力全都烟消云散，云南一夜之间成为了日本的“友邦”，只留下她不解的泪水与悲愤。\n\n她才23岁，正是青年热血翻涌的年纪，她不甘心中国持续了七年的抗日大业竟要如此滑落到万劫不复的深渊——于是她提笔写了那封辞职信，拎着自己从滇光圣经学院带来的药箱走出了昆华医院的大门，重新徘徊在昆明的街头。"
CPC_Yang_Yingcai_history.4.o: "可我究竟要往何处去？"
CPC_Yang_Yingcai_history.5.t: "离乡之路 - 1945年，禄丰（1）"
CPC_Yang_Yingcai_history.5.d: "回到元永井的杨盈彩从不对外人——也包括娘家人——讲述自己在昆明的遭遇，她只是静静地牵着背上驮着药箱的毛驴，找娘家人要了个在罗川坝子的闲铺，做起了西医诊所的生意。\n\n从外人看来，杨家二妹是正经见过世面的有为青年：接受过滇光圣经学院的西式教育，去过省城当过医生，哪怕回了禄丰，她也还是罗川坝子里一镇三村唯一的西医。坝子里有些从贵州逃难来的苗民对她十分敬重，当面敬称她叫“杨师母”，私下里更称她为“小耶稣”——对于一个发过愿皈依了主的青年女子，这样的敬称常常令她哭笑不得。\n\n她的铺子在杨家盐铺罗川分铺的正对面，经营盐铺的则是她的二叔——女娃娃正是青春害羞的年纪，又不方便打搅小二妹行医问诊，上门的媒人们就纷纷提着酒肉礼品叨扰盐铺，向二叔打听小二妹的终身大事。\n\n得闲时，二叔会偷偷来杨盈彩诊所的后院给她生火做饭；或是抱着水烟筒抽烟，直到杨盈彩诊完最后一个病人，做完晚礼拜来到后院见到自己的亲二叔，他才会开口说出那句话。"
CPC_Yang_Yingcai_history.5.o: "“老二呀，信基督还能嫁人不？”"
CPC_Yang_Yingcai_history.6.t: "离乡之路 - 1945年，禄丰（2）"
CPC_Yang_Yingcai_history.6.d: "有时候杨盈彩也想像霍去病那样豪迈地喊一声“日寇不灭，无以家为也”，但滇中林海里土黄而潮湿的现实却将她一次又一次拉入乡土的最深处，娘家人对她的婚嫁大事相当上心，光二叔筛掉的媒人就有八家，再经娘家人层层筛选请宴，终于最后选出了一个看起来还不错的人选。\n\n诊所后院里摆着一盆炭火生暖烧水，杨盈彩攥着一个年纪相仿的军装男人的照片，而坐在她对面的，不仅有水烟筒抽得咕嘟响的二叔，还有她的亲爹娘。\n\n“朱家算元永井大家族了，来说媒这家跟以前朱将军（朱培德）他们家是表亲关系，家里头两个儿子，老大死在台儿庄，剩着这个独儿子老二在滇西打日本人的时候断了只手——”二叔叹了口气，“只怕老二嫁到朱家，服侍他家断手老二要遭罪，要不我们再看看？”\n\n“小伙子人不错，就是少了只手太不方便了。”杨盈彩的父亲也叹了口气，“但人家是打日本没的手，不丢这个脸。”\n\n“不然就街上那个马家老五也不错，他家爹是当罗川乡长的，在这边也好有个照应。”二叔抽一口烟，水烟筒又咕嘟咕嘟地响了起来，“只是——”\n\n“——小彩回来以后最恨当官的了，还是听听她的意见嘛。”母亲接了二叔的话茬。\n\n三双眼睛一齐望向杨盈彩——而她却把相片丢进了火盆，沉默良久。"
CPC_Yang_Yingcai_history.6.o: "“回元永井吧，我把朱家二哥带过来养。”"
CPC_Yang_Yingcai_history.7.t: "离乡之路 - 1947年，滇中深山"
CPC_Yang_Yingcai_history.7.d: "婚后的日子平淡但幸福，杨盈彩的四妹杨盈喜也从元永井走了二十里地来投奔她想学些医术，精良的医术和娴雅的气质更为杨盈彩赢得了乡民们的交口称赞；有些颇有门路的苗商已经和她的小诊所建立了定期的供应关系，每到山雨窸窸窣窣砸在山间林野的时节，杨盈彩就会把写着“买药”的白幕布挂在诊所紧闭的门前，带着杨盈喜跟着苗商翻越大山到禄丰县城，甚至到安宁去选购药物，这趟旅程通常要花半个月——如果一切顺利的话。\n\n马脖上的铃铛在雨中摇来晃去，发出清脆的响声，杨盈彩和杨盈喜骑着马披着蓑衣，和苗商商队一起穿行在林间的山道中。\n\n“二姐，还有多久能到滇缅路啊？”\n\n杨盈彩望了望周围地形：“还得翻座山，山翻过去到一平浪煤矿，滇缅路就从煤矿过，顺着路走就能去昆明了。”她压了压杨盈喜的帽檐，好让这十五岁少女俊俏的脸蛋不被雨点溅湿，“雨下得倒大。”\n\n一枚松果一样大的东西滚到了苗商的马车旁，杨盈彩没太在意，但那东西撞击到轮毂上竟发出清脆的金属响声。突然，她见前面的老苗人像是突然触电一般身形一耸，接着他扯开嗓子，一边嚎着一边连滚带爬翻下马就往山坡下跑——"
CPC_Yang_Yingcai_history.7.o: "“手——榴——弹——！”"
CPC_Yang_Yingcai_history.8.t: "离乡之路 - 1947年，安丰营（1）"
CPC_Yang_Yingcai_history.8.d: "再次醒来，杨盈彩已经躺在了安丰营的一个帐篷里，她不需要费力，只需要左右动动眼睛就明白这是滇军的野战医院——过去的八年里，她曾无数次在这样的帐篷里同死神抢夺人命。\n\n来往的年轻士兵不少，帽檐上还有她熟悉的白日徽标——尽管她已经对这轮白日失望至极，可眼下杨盈彩还是不得不承认，自己多半是被滇军救了条命回来。她试着活动了下四肢，没啥痛感，至少还完好无损……\n\n她突然像是想起了什么，唰地坐起，逮住一个过路士兵开始问话：“滇军兄弟！跟我一起的那一队人……”\n\n这位年轻士兵的眼神迷茫，不知道这女人在说什么：“我们是奉龙主席命令来禄丰剿匪的……”他瞥了一眼床号，“你是卢副主席亲卫队带回来的，我去把随队医生过来，你问医生。”\n\n杨盈彩连忙点点头，接着失魂落魄地坐回床边。"
CPC_Yang_Yingcai_history.8.o: "“上帝啊，我的四妹呢……”"
CPC_Yang_Yingcai_history.9.t: "离乡之路 - 1947年，安丰营（2）"
CPC_Yang_Yingcai_history.9.d: "杨盈彩隐约觉得来人身形眼熟——直到站到眼前，她才确认，这是国立云大医学院院长范秉哲。\n\n同为外科医生，又同在滇军抗日的野战医院里并肩作战过，范秉哲看到这位故人心里也是一惊：“小杨，你怎么……”\n\n“个人原因，跟秦院长写了辞职信——您看过了？”在昔日的老领导跟前，杨盈彩也只能压低声调。\n\n范秉哲左右望望，凑到杨盈彩跟前：“你那封信在昆明出名了，有些好事的都把状告到卢副主席那去了。”\n\n杨盈彩心里一惊，但又很快明白过来——倘若卢汉两年前当真下令追查，自己一个妇人就算躲进元永井的深宅大院也迟早被滇军揪出来。\n\n沉默片刻，杨盈彩还是开口了：“范老师，我应该是在罗川往一平浪去的山道上被土匪袭击的，跟我一起的还有一队苗商还有我妹妹，他们现在在哪？”\n\n“你身边没人，前面的苗族有几个被炸死了，有几个被乱枪打死，没见到其他跟你差不多年轻的女的。”\n\n一道轰雷直直劈在杨盈彩脆弱的心中，令它四分五裂。\n\n“小四妹……丢了。”她腿一软，竟直接瘫坐在潮湿的泥地上。\n\n好不容易将杨盈彩扶到床上坐稳，范秉哲叹了口气：“我还有别的伤员要看，先走了，小杨你四脚四手好好的，安定下来以后可以来找我我特批你当随队医生，卢副主席亲自带三个团来禄丰剿匪的……”"
CPC_Yang_Yingcai_history.9.o: "“留下来的话，你还可能找到你的小四妹。”"
CPC_Yang_Yingcai_history.10.t: "离乡之路 - 1948年，攀枝花"
CPC_Yang_Yingcai_history.10.d: "杨盈彩最终还是拒绝了范秉哲的提议，这倒不是她看不起这位昔日同侪，单纯是因为四年前省政府抛下抗日大业关门自保的懦弱做法令她蒙羞——她简短给家里写了封报平安的信，当然，28岁的杨盈彩完全没有同娘家扯谎的勇气，她在信里如实禀报了四妹失踪的事，写下承诺：“此去北上游医寻找四妹，若不能寻到四妹下落，彩儿愿被逐出族谱，百年之后便化孤魂野鬼也绝无怨言。”——大话是放出去了，但要如何找到四妹杨盈喜却令她颇为头痛。\n\n她挎着药箱，漫无目的地游荡在攀枝花镇的街头，既不知道自己要去哪找妹妹，也不知道自己今后应该干些什么——回乡避世的三年让她变得有些盲目，她根本不明白云南以外的地方这些年发生了什么。找人是需要本钱，她身上唯一的本钱就是她那个沉甸甸的药箱——范秉哲临别前还偷偷塞了一大堆西药和云南白药。借着这个药箱和身上带着的一点现大洋，杨盈彩在唯一的一条街口上搭起了一个露天桌台，印在白色幡旗上的招牌颇为实用主义：“不算命只看病，药一到病立除。”\n\n凭着精湛的医术和满满一大箱的药，杨盈彩的摊前立刻生意火爆起来，头疼脑热小半片阿司匹林，外伤做点小手术缝几针，甚至还当了一次接生婆……不到半个月，杨盈彩的钱包立刻变得鼓囊起来。\n\n但她的心思却不在这上面，半个月在攀枝花的各种见闻让她逐渐明白周遭的世界发生了怎样天翻地覆的变化：德意日铁蹄下，新秩序莅临这悲惨的世界——但在西北大地上还有一支正在夹缝中艰难求生的力量——"
CPC_Yang_Yingcai_history.10.o: "去陕西，找共产党！"
CPC_Yang_Yingcai_history.11.t: "离乡之路 - 1950年，成都"
CPC_Yang_Yingcai_history.11.d: "成都早已从战乱中恢复了元气。但中央军发动的大屠杀仍然给这里带来了永久的创伤，走在街上，杨盈彩还能看到许多战争时期遗留未及时清理的废墟，以及成片的临时避难营地。\n\n杨盈彩停在一座旧天主教堂前，下意识地开始在胸前画起十字——经年累月的旅途劳顿让她无暇顾及自己的教徒身份，直到看见十字架的这一刻，她才猛地想起自己已经有两年没做礼拜了。\n\n她怀着虔诚又内疚的心绪慢慢走进教堂大门，却发现里面并非赶来礼拜的教徒——相反，孩童们念课文的咿呀声回荡在大厅中，就在耶稣受难像之下，一个老修女在临时黑板上一笔一划写下了“中国”两个大字。杨盈彩没再敢叨扰孩子们的课程，只是找了把长椅坐下开始默默祷告。\n\n等孩子们下课笑着跑开，杨盈彩终于走上前来试探性地朝收拾黑板的老修女发问：“打扰一下，教堂现在其实是一个孤儿院吗？”\n“唉，都是前些年中央军屠城没了爹妈的娃娃，我们就腾了点房间出来把娃娃们收来养着。”老修女答道，“听你嘞口音，云南来的？”“对，听说北边共产党还在抗日，想到那里去。”\n老修女点点头：“路不好走吧？看你衣服上打了不少补丁了。”杨盈彩被说中心事，一下脸红了起来——从攀枝花一路行医到成都的路上她攒下的钱并不多，得在成都找份工作，要攒好些时日。\n老修女看出了她的窘态，却并没有揭穿，她笑笑：“识字不，愿不愿意来这里帮着领下娃娃？钱好说。”\n杨盈彩思忖了一番，找不到拒绝的理由——给孩子们上课还能方便做每日礼拜的差事并不多见，于是她郑重地点点头。"
CPC_Yang_Yingcai_history.11.o: "“可以的。”"
CPC_Yang_Yingcai_history.12.t: "离乡之路 - 1953年，成都（1）"
CPC_Yang_Yingcai_history.12.d: "应该说，在四川的三年间，杨盈彩时常被两种想法折磨着——有时是三种。\n\n两年前到西康去采买藏药的时候她打听到了一个跟四妹有关的消息：一个相同年龄的女娃娃在1949年的时候曾跟着一个穿着破烂的老苗族路过西昌继续北上，当时同老苗族接触的藏族药商用非常晦涩难懂的川西官话给杨盈彩连比带划才给她解释清楚，女娃娃和老苗族要去的是青海一个叫格尔木的小城——令杨盈彩倍感为难的是，从西康直上格尔木的旅途凶险异常，稍有不慎就会毙命。\n\n不过听说格尔木也是“国防阵线”的辖区，那或许她可以先北上到西安，安顿下来再去格尔木找杨盈喜——抗日未成是杨盈彩郁结在心中多年的遗憾，好消息是从成都到西安的路并不难走，沿途村镇也多，比从攀枝花到成都要轻松得多。\n\n但孩子们又令她放心不下：或许是到了年纪又孤身一人并无子嗣的缘故，杨盈彩对照顾孤儿院的孩子们也非常上心，现在她被拥戴为“杨妈妈”，孩子们甚至自发跑去城郊采集野花为她编了一顶花冠——只是这群孩子们最大的也才十五岁，虽然在杨盈彩的悉心照料下年龄稍大的孩子们已经能自食其力自谋生路，但……\n\n暮春，杨盈彩从又一个难眠之夜中醒来，她知道自己必须做出抉择——亲情，理想，责任……"
CPC_Yang_Yingcai_history.12.o: "手心手背都是肉。"
CPC_Yang_Yingcai_history.13.t: "离乡之路 - 1953年，成都（2）"
CPC_Yang_Yingcai_history.13.d: "“……确定了？你真的要去西安找共产党？”忏悔室里，老修女坐在杨盈彩身旁，用极温柔的声音询问道。\n“……嗯。”杨盈彩点点头。\n“有志气。”老修女赞许道，“娃娃们那边你有没有说啦？”\n“还没，我总觉得……就这么走了对他们不太负责……”杨盈彩有些扭捏。\n闻言，老修女竟咯咯笑了起来：“从你来这三年我算看出来了，你顾虑太多，为自己考虑太少——好多娃娃跟我说了，说杨妈妈本来是要去其他地方的，看他们可怜才留下来的。”\n杨盈彩苦笑一声：“这是撵我走？”老修女慢慢收敛笑意：“你看我就说，你顾虑太多，不信你今天上课的时候去问问娃娃们。”\n\n“吱呀——”一声，忏悔室的门被拉开，早已在门外偷听多时的孩子们鱼贯而入，团团围在两人身边，为首的“孩子王”更是顾不得涕泗横流就冲上来抱住杨盈彩。\n\n“我晓得……杨妈妈不是……不是来特地照顾我们嘞，杨妈妈要去其他地方……打……打日本。”他啜泣着说出了内心的想法，“我们也……也舍不得杨妈妈走，但是老妈妈跟我们讲，杨妈妈打日本要赶走那些杀了我们爸爸妈妈的混蛋——”\n\n杨盈彩拍拍他的脊背：“好孩子……我也舍不得你们。”\n\n怀里泪眼婆娑的男孩慢慢抬起头：“妈妈尽管去打日本，弟弟妹妹们还有老妈妈和我照顾。”话音刚落，孩子们大声附和起来。\n\n望着眼噙泪花的孩子们，杨盈彩感到了一股莫名的勇气——而这正是过去三年间她一直缺乏的。她在胸前画了个十字，随后郑重地开口了。\n\n“我知道你们都是好孩子，我相信你们……”"
CPC_Yang_Yingcai_history.13.o: "“这里是我的另一个家，我还会回来的。”"
CPC_Yang_Yingcai_history.14.t: "离乡之路 - 1958年夏，西安"
CPC_Yang_Yingcai_history.14.d: "杨盈彩见过太多病人因炎症痛苦到全身痉挛的模样。疼痛已过，神志暂时清醒时，有人闭上双眼但求速死，有人念念有词地向他们各自的神祈祷，恳求祛除病痛，或是干脆把希望放在了来生。在医学已力所不能及时，宗教便取而代之，为这些可怜人做着临终关怀。教会学校出身的她有时也会应要求替将死者做弥撒。这一点小小的善意逐渐变成了她的习惯，在一天的问诊结束后，她会安静地祷告一阵，借放空自我来消解疲劳。即便到了西安后，她也依然常常如此。\n\n仲夏的傍晚，杨盈彩像往常一样结束了工作后的祷告，准备收拾门面结束营业。原本平常的日子随着一个小插曲而发生了改变——一个满头大汗的年轻人突然钻进屋来，向她讨一口水喝。这正是大跃进运动如火如荼开展的一年，西安的学生和一部分工人不遗余力地沿街游行、派发传单，缺水中暑也是常有的情况，杨盈彩特地在诊所里准备了一口凉水缸和几只瓷碗，供他们降温解渴。因此，她只是简单地指了指水缸，示意可以自己舀来喝，就走进里屋收拾东西去了。\n\n有什么可担心的呢？西安是一个夜不闭户、绝无盗贼的城市，任何想通过三只手发财的人都会被群众扭送立功，更何况只是一个又口渴又疲劳的爱国青年，能发生什么呢？\n\n她错了。等杨盈彩收拾完里屋走出来时，她立刻意识到她错得太厉害了。讨水喝的青年已不见了踪影，他“偷”走了些什么东西。等到杨盈彩一刹那意识到失窃的东西是什么时，她几乎要瘫坐在地上。\n\n不是西药。失窃的不是什么值钱的东西，但实在太要命：卷边的圣经还放在橱柜上，但与圣经一同使用的十字架却不翼而飞了。"
CPC_Yang_Yingcai_history.14.o: "是祸躲不过……"
CPC_Yang_Yingcai_history.14.t: "离乡之路 - 1958年冬，西安第一监狱"
CPC_Yang_Yingcai_history.14.d: "“工作组到的时候，发现圣经就摊在对着门的柜台上。”\n\n“……”\n\n“沉默是没意义的。我想你最好自己解释清楚，否则我们完全有理由认为这是你对组织审查的死硬对抗。”\n\n“……我知道东西被拿走就一定会被揭发，反正是迟早的事。如果我自己偷偷把圣经藏起来，那就不是我个人的生活作风问题，而是欺骗组织，对党、对毛主席不忠诚……”\n\n“现在才表忠心是不是有点太迟了？杨盈彩，我要提醒你，这不是作风问题，而是你的立场问题！”\n\n“……立场问题？”\n\n“你为什么会藏有代表资产阶级唯心论宗教的印刷物？为什么不参与到集体生活中来，而是一个人躲起来做祈祷？你的所作所为完全站到了群众的对立面，更是站到了唯物主义的马克思列宁毛泽东思想的对立面上！”\n\n“我真的没有想那么多。”\n\n“你觉得我们会就这样相信你吗？我再提醒你一下，从沦陷区来的日伪特务一个两个都打着宗教的名号，你最好能证明自己不是其中的一员，那样你还有机会回到党和群众的怀抱中来。如果你真是无耻汉奸的话，我们是不会留情的。”\n\n“我可以向主席发誓，我绝不可能是卖国汉奸。以前不是，现在不是，未来也不会是。”\n\n“讲得蛮好听。行了，把她带回去吧……”"
CPC_Yang_Yingcai_history.14.o: "“……右派帽子还得接着戴。”"
CPC_Yang_Yingcai_history.15.t: "离乡之路 - 1960年末，天水"
CPC_Yang_Yingcai_history.15.d: "“杨盈彩，出来！”\n\n伴着一声指名道姓的呼喊，沉重的牢门在杨盈彩的面前敞开。她跟在战士的背后，走过回廊、穿过天井，然后，站在了监狱的大门外。\n\n不知是生来倔强还是自认问心无愧，杨盈彩用沉默对抗着一轮轮的审问，始终也没有承认她有任何反党卖国罪行。工作组在那次突击检查后又彻底搜查了诊所，没能再发现任何有价值的证据，也就对这个不肯张嘴的女医生失去了兴趣。1958年冬天，杨盈彩与一批政治犯一同关入了天水市监狱，并在这里度过了三年的劳改时光。她用一种怪异的方式保护着自己的双手：其他劳改犯进行粗重的体力劳动时，杨盈彩总是用额外的缝纫工作加以代替。闲来无事时她还会用毛线针在狱友的身上比划——她似乎坚信终有一天她会再次拿起手术刀来，因此一刻也没有停止过练习。然后，在期盼与等待中，日与夜交替着从她指尖滑过，不觉间竟已到了她出狱的日子了。\n\n萧萧寒风吹动她鬓发和衣角，大街上空空荡荡，既没人迎接她，也没人守在外面等着唾骂她。失却的自由被漫不经心地归还，但失去的时光则一去不复返。杨盈彩深吸了一口冰凉的空气，简单地整理一下思绪，然后迈步离开。"
CPC_Yang_Yingcai_history.15.o: "她需要一份新的工作。"
CPC_Yang_Yingcai_history.16.t: "离乡之路 - 1955年，西安"
CPC_Yang_Yingcai_history.16.d: "杨盈彩到底还是来到了这座革命之城——西安。\n\n同成都的战后破败不同，这里经过七年的经营已然从前朝故都变成了一座真正的堡垒城市——随处可见的战略防空洞，工厂楼顶设置的高射机枪，寺庙改成的医院，士兵列队在城市中巡逻……一切的一切都符合杨盈彩的预期——是的，这里便是她想象中的抗日堡垒，尚存良知的仁人志士心之所向的自由中国的最后家园。\n\n走进城市，她能看见许多陌生的标语：“战无不胜的毛泽东思想万岁！”“鼓足干劲，力争上游，多快好省地建设社会主义。”……彼时的杨盈彩对共产党所宣扬的思想和阶级学说还一无所知，她走走停停，有时看着宣传画上的谢顶老头发呆——原来毛泽东长这样；有时透过窗户看见放屋里的大胡子老头和中年光头洋人的肖像——那大概就是国民革命时候他们说的马克思列宁？\n\n她漫无目的地在城中穿梭，希望能找到一处关门倒灶预备出让的街铺，这样她才好开自己的小诊所。但事与愿违，共产党治下的西安实在是过于生机勃勃了，所有人仿佛巨大机器中各司其职的小小零件，没有一处朽坏也没有一处空闲。\n\n目睹如此景象的杨盈彩尽管略有沮丧，但她很快振作精神，重新想起了自己在攀枝花时的法子——看来又得去闹市摆摊了。与六年前不同，来到西安后的她并不迷茫，她的计划雄心勃勃——攒钱开个小诊所，然后去大医院里当外科医生，在不久的未来跟着共产党一起重新投入抗日战争的事业里——"
CPC_Yang_Yingcai_history.16.o: "前途光明。"
CPC_Yang_Yingcai_history.17.t: "离乡之路 - 援建汉中期间，西安"
CPC_Yang_Yingcai_history.17.d: "办公室里静得出奇，只听得到徐林翻动复写纸的沙沙声。厚厚如山的文件里，有一大半是57年的政治审查资料和服刑期间的报告，徐林没有看，也不想看。他一页接一页地跳过，终于，他的手上只剩下了最后的一张纸。那是1961年后的相关材料。这些记录甚至没有把一张16开的纸张填满，它们只简单地表明，“杨盈彩”在出狱后，作为解放军301医院紧急征聘的外科医生参与到了对青海的作战中，在条件不完善的情况下，仍然尽最大的努力挽救了数名营团级以上干部的生命。\n\n“她没有得到一份工作吗？”\n\n长久的沉默后，院长开口了：“61年的时候她立过功，后来被301院破格提拔成外科副主任——但她始终没被批准入党。她的医术不差，甚至可以说是301院最好的外科医生，但她始终都没当上主任医师。你也应该明白为什么我们现在不能让她去汉中了。”\n\n徐林长叹一口气，站起身来，把理好的文件码放回原处。他不知道自己该作何感想——他有资格去评论“杨盈彩”的人生吗？他应该怜悯、应该愤怒，还是应该像其他人一样漠视呢？徐林总有一种感觉：她的人生绝不是几张纸能描述的，或许自己未来还会在什么地方见到她……"
CPC_Yang_Yingcai_history.17.o: "……不过现在，汉中的事更重要。"
#社区人物异次元同位体
CPC_funni.0.t: "向自由奔去"
CPC_funni.0.d: "试飞员周巧琳不满地找到技术总监，质问为何新飞机尚未完成测试便送到南洋：“那飞机就试飞过一次，而且浑身上下全是毛病，你就这么把它送到南洋军政监？”热茶在总监的眼镜上附上了一层薄雾，他翘着二郎腿，摆摆手：“怕什么，新飞机出点事很正常，大不了死几个倒霉的飞行员，咱们出份事故报告，大不了死几个倒霉鬼，大惊小怪的干什么。”周巧琳惊讶地瞪大眼睛，吃惊着眼前的这个四眼狗为何如此不负责任。\n\n“你能不能负点责？”顶撞的话语脱口而出，而等待着的周巧琳的却是雷霆暴雨。\n“你这支那女人，摆正自己的态度，今年别想升职了！”总监突然暴起，唾沫横飞地辱骂道。周遭的同事识趣地低下头，默不作声。羞辱让周巧琳感到愤怒，但她只得忍耐，富士通和广东国一样等级分明，倘若反驳一句，那就不是辱骂这么简单的事情了。\n\n羞辱结束后，周巧琳一言不发地离开了办公室，她走到试飞场，看着机库里的飞机散心。她勤劳、努力，最终得以在富士通这样的大企业工作，而她的飞行天赋又让她成为了富士通的广东试飞员——少数几个非日裔的试飞员。看着眼前的飞机，想着每次在天空中遨游的自由，她不经感到一阵悲哀：广东的自由似乎不属于广东人。“听说了嘛，重庆那边被共匪霸占了”一旁的地勤讨论着这几天的新闻。共匪？周巧琳想着，一个前所未有的想法油然而生，随即心头一惊，她匆匆离开机场，回到家中。\n周巧琳想要追寻自由，她翻开飞行地图，看着世界各地的航线，想着哪里可以驾机飞达：美国是公认的自由国度，但是太远了；澳洲加满油或许能够飞到，但一路上共荣圈的雷达可不是摆设；印度或许不错，但要翻越喜马拉雅山，高度太高一定会被雷达发现。最后，周巧琳看着地图上被涂红的地区——中国西北，以及还没被涂红，但已经被共产党夺取的重庆。共产党？对于周巧琳来说，这个组织是如此陌生，共荣圈的电台对它的谩骂不断，而地下电台则高呼它是未来解放中国的救星。周巧琳看着地图，发现重庆无疑是合适去处，靠的近、风险小，但最重要的是，广东国的空气令她感到窒息。\n\n几天后，富士通决定让一架新式战机直飞南洋进行测试，而周巧琳毫无疑问是这次测试的飞行员。周巧琳坐上飞机穿戴设备，看着半满的油箱，心想时候到了。她熟练地将飞机升空，向南飞去，然后她关闭了飞机的所有的电子设备，调头加速，低空前进。机场的工作人员不断尝试连通周巧琳，但毫无作用。周巧琳沿着低空，飞过南岭群山，不一会儿便抵达重庆。重庆市内防空警报齐鸣，市民纷纷躲入掩体之中。低空飞行让高射炮无法瞄准目标，大部分炮弹都擦肩而过，只有一发击中尾翼，打出一个豁口。周巧琳打开电台，调整到公共频道，说明投诚来意。飞机环绕几圈后，降落在重庆机场，一群荷枪实弹的士兵立刻将飞机团团围住。周巧琳打开舱门，高举双手，对靠近过来的军官说道："
CPC_funni.0.o: "“我是来投奔国防阵线的！”"
CPC_funni.0.o_tt: "制作组注：本注释即代表本事件为开发组撰写的，以我们§m游戏社区中活跃人物§!为原型的§m趣味事件§!，所有带有本注释的事件均将标注§Y原型人物§!。\n\n§Y周巧琳§!人物原型：开发组§m图标美工§! - §Y人畜无害的魔女§!"
CPC_funni.1.t: "国府路秩序井然"
CPC_funni.1.d: "收音机播放完靡靡的《大东亚进行曲》后，播报着今天的社论：“共匪反复煽动国家之仇恨言论，引发民生凋敝、国民震荡，其篡权弄国之心路人皆知。而今北平、武汉之学生受共匪之思想侵蚀，一意孤行，公然与国军和警察对抗，着实是令人惊愕……”。傅崇的拿着咖啡杯的手不断握紧，作为中央大学的法学生，即便尸位素餐的教授们每天重复着民国的正确，但周遭和良心还是在告诉他，北平武汉的市民、学生和工人才是正确的。一个学生凑近傅崇小声说道：“我们也去抗议，就去国府路，就去国民大会堂和总统府门口！”\n\n两天后，南京的市民、学生和工厂工人们，在国府路前组建起了浩浩荡荡的抗议队伍。队伍中，个别人举着毛泽东的画像，但大部分都举着孙中山、鲁迅的画像；还有人拉着各色横幅——“停止内战，一致对外！”、“释放武汉爱国学生！”、“过去在南京杀了三十万人，今天又准备杀多少万人！”。国府路上，人们从西向东缓缓前进，巡逻的警察一边呼叫着支援，一边识趣地离开；国民大会堂的议员将大门紧闭，即便他们向来无用；美术陈列馆的艺术家惊恐地看向窗外，生怕“暴民”们打扰他们的美梦；地下刊物的记者也闻讯赶来，想要记录下这历史性的一幕；中共的地下党也向西北急电，报告着南京的事变。在呐喊中，人群行进到总统府前，总统府大门紧闭，门楼上的青天白日旗在满地红的衬托下显得格外压抑，而门楼下坦克早已严正以待。\n\n见人群到来，坦克车发动引擎，试图用轰鸣声吓退示威群众。大部分人本能的向后退去，毕竟肉身难敌钢铁，但傅崇冲出人群，站在坦克车前，背过去看向所有游行者高呼到：“总统府日夜重复着他们是孙中山事业的继承者！高呼他们是三民的，宪政的，但我着实看不出来，这汉奸政府有了什么‘民’，宪了什么政！通篇的案卷累牍我只看见了‘吃人’二字！”人群中传来欢呼，以表赞同。不远处阁楼上的地下记者林壹捌拿出自己的相机，对着傅崇聚焦。傅崇转向国军部队，质问道：“你们是中国军人，为什么要阻拦我们，而不是去抗日救国！”坦克车里的士兵自然是不会回答，但头车车长收到了连长的命令：直接碾过去，然后对人群开枪。三辆坦克车和随行步兵横列在国府路上，总统府前。沉默片刻后，中间的坦克毫无征兆地前冲。正在演讲的傅崇，忽然看见青天白日徽向他靠近——这是坦克首上装甲的军徽，然后是天旋地转，紧接着便是剧烈的阵痛。“哒哒哒哒哒——”同轴机枪，步枪一齐开火，人群尖叫着四散而逃。阁楼上的林壹捌，颤抖地按下数个快门键，记录下半身不遂早已死亡的傅崇，记录下不流血倒地挣扎的人群。流弹飞来，打碎了阁楼的玻璃，林壹捌迅速蹲下，然后拆出胶卷，向地下报社跑去。\n\n在总统府的血泊前，坦克团长向总统府打通电话，宣告着这次“镇压暴乱”的胜利："
CPC_funni.1.o: "“国府路秩序井然！”"
