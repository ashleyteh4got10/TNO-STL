CPC_Bai_Dongcai_eco_desc: "§Y财委主任\n$communist_liu_shaoqi_thought_subtype$§!\n§Y重锤开道§!"
CPC_Chen_Yun: "陈云"
CPC_Chen_Yun_eco_desc: "§Y财委主任\n$communist_bolshevism_subtype$§!\n§Y随侯珠§!\n§F------------§!\n§L毛泽东曾称陈云为“我党的布哈林。”\n\n贫农出身的陈云无力支付学费，高小毕业后便前往上海商务印书馆做学徒，了解、学习书局的商业运作和财务交易，这是他经济职业生涯的开始。五卅运动时，陈云成功领导了商务印书馆的罢工，随即加入中国共产党，负责组织劳工运动。延安整风时，他紧紧站在毛泽东一边。当根据地因蒋介石的封锁陷入经济危机时，陈云为党中央交出了一份满意的答卷：运用土地作为资本运作，既吸引普通小农前来投靠，又吸引大资本家来投资。此后，他便能轻车熟路地驾驭这种半资半社的经济模式，并以此稳居党的经济学家之位。\n\n然而这种经济模式却跟已经支离破碎的苏联实行过的新经济政策有几分相似……§!"
CPC_Gao_Gang: "高岗"
CPC_Qiao_Guanhua: "乔冠华"
CPC_Qiao_Guanhua_for_desc: "§Y外交部长\n$communist_mao_zedong_thought_TER_subtype$§!\n§Y乐天派§!"
CPC_Bo_Gu: "博古"
CPC_Bo_Gu_for_desc: "§Y外交部长\n$communist_bolshevism_subtype$§!\n§Y革命辅翼§!\n§F------------§!\n§L“跟着真理走。”是博古的人生座右铭。\n\n博古在江苏和上海上学时加入了许多学生组织，参加爱国学生运动，后经介绍加入中国共产党，前往莫斯科中山大学留学五年后回国参加革命。王明时期，与党内其他人不同，博古是在苏联镀金归来的“二十八个半布尔什维克”之一，对党内的实用主义者和调和主义者不屑一顾，也不把毛泽东这样的老人放在眼里。在他和李德的错误导致红军不得不放弃根据地进行长征后，博古终于认识到错误，开始虚心求学。在他创办《解放日报》把党的声音传播到全国全世界之后，博古开始在外交上有所建树。\n\n他心中革命的火焰依然熊熊燃烧。§!"
CPC_Chen_Yi: "陈毅"
CPC_Chen_Yi_for_desc: "§Y外交部长\n$communist_bolshevism_subtype$§!\n§Y硬汉§!\n§F------------§!\n§L“投身革命即为家，血雨腥风应有涯。取义成仁今日事，人间遍种自由花。”\n\n陈毅并不是职业军人出身，他早年在工业学校进学，赴法勤工俭学时认识了周恩来和共产主义，又因参与学生运动被押解回国，经介绍加入中国共产党。在黄埔武汉分校时，他任政治部文书，在红军里又任过政治委员，带着新四军在国民党和日本人的夹缝中艰难生存击退了国民党的数次围剿。在江南地区沦陷后，陈毅回到了延安。“将军的位子已经满了，让陈毅去外交部锤炼锤炼吧。”面对毛泽东的安排，陈毅没有半句怨言，马上收拾行装到外交部充任副部长。他把战场上养成的臭脾气带到了谈判桌上，吓吓对方时而有用，时而又不是那么必要了。\n\n“大雪压青松，青松挺且直。要知松高洁，待到雪化时。”§!"
CPC_Luo_Qingchang: "罗青长"
CPC_Luo_Qingchang_sec_desc: "§Y公安部长\n$communist_bolshevism_subtype$§!\n§Y活档案§!"
CPC_Luo_Ruiqing: "罗瑞卿"
CPC_Luo_Ruiqing_sec_desc: "§Y公安部长\n$communist_bolshevism_subtype$§!\n§Y罪恶斗士§!\n§F------------§!\n§L毛泽东说过，“天塌下来有罗长子顶着”，也说过，“罗瑞卿浑身是刺”。\n\n加入红四军后，罗瑞卿几乎参加过红四军的每一场战斗。在第二次反围剿中，他被子弹击中左腮，在鬼门关走了一趟，遵义会议时他负责外围警戒工作，还当过几年的延安抗大校长。但坦白说，罗瑞卿是个极其容易翘尾巴（或者说欺软怕硬）的人，虽然他的这些毛病使他撬开了许多铁嘴获得情报，但在他领导了战后混乱时期的根据地治安工作和肃反运动后，这些毛病可谓是变本加厉，随时可能酿成大祸。§!"
CPC_Pan_Hannian: "潘汉年"
CPC_Pan_Hannian_sec: "潘汉年"
CPC_Pan_Hannian_sec_desc: "§Y公安部长\n$communist_bolshevism_subtype$§!\n§Y谍报专家§!\n§F------------§!\n§L自红军长征时期起，潘汉年所做的几乎都是最危险的情报工作：他在白色恐怖最严重的时期前往上海、南京等国统区大城市获取情报，福建事变时，他被派往福建与十九路军谈判，在上海，他用几块烤面包骗过了日军的搜查，甚至还和汪精卫会过面。国民党兵败如山倒时，他又从沦陷区把沈钧儒、郭沫若等大批民主党派和民主人士成功护送到延安以组建新政协……\n\n然而，潘汉年的这些功绩并没有让他受到党中央的青睐。纵然情报工作得心应手，也争不过那些溜须拍马的小人。潘汉年只能耐心地等待着，也许罗瑞卿犯大错的那一天不远了……§!"
