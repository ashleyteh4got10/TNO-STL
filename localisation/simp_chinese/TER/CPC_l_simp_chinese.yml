CPC_custom_difficulties_dec_desc: "来自上层叙事者Crys7aL_L1nE的通讯：\n看来§C你§!已经准备好要给这操蛋的§S新秩序世界§!带去一点小小的§C命运之眷顾§!了——\n——深呼吸，放轻松，现在你有§Y一个月§!的时间来决定这片土地的§C前途命运§!。\n\n对于第一次面对如此困局的§G新手§!们，像儿时学自行车一样，这里会有一些§G辅助轮项目§!来帮助你快速上手这局游戏。\n而对于那些久经战阵的§C老伙计§!们，我猜你们会喜欢这些§x进阶项目§!的。\n\nPS：记得在创意工坊、Discord反馈你遇到的BUG！"
