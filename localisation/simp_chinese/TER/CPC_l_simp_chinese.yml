CPC_constitution_law_before_TRCW_desc: "[CPC.GetFlag]§m国防§!§V阵线§!的诞生要追溯到1949年，彼时西部中国§Y各抗日爱国势力代表§!齐聚§G西安§!，共同签署了§m《中国国防§!§V阵线纲领》§!，§m《纲§!§V领》§!以宪章形式规定：\n\n一、§V抗日事业§!已进入§R长期相持§!阶段，而§R第三次统一战线§!是取得§x最终胜利§!的重要保障。\n二、西部§Y各抗日爱国势力§!要紧密团结在£CPC_texticon §x中国共产党§!领导的§m国防§!§V阵线§!周围，自觉维护§R第三次统一战线§!的§G团结与完整§!。\n三、西部§Y各抗日爱国势力§!要服从£CPC_texticon §x中国共产党§!的指挥，积极在辖地完成§G土地革命§!、§R社会主义改造§!等革命工作。\n\n在阵线缔造之初，国防阵线的正式全称为§m中华民国§!§x国防阵线西北中央政府§!，仍沿用民国国号，但为区别于南京的汪伪政权，中央决定废除过去象征国民党一党独裁的£GNG_chinese_nation_texticon §m青天§!§W白日§!§R满地红§!国旗，而采用符合统一战线精神的[CPC.GetFlag]新国旗：国旗以§x红§!§m蓝§!色为基底，中央镶嵌§Y黄金色五角星§!，§m蓝色§!象征§m民族资产阶级，小资产阶级，开明绅士，爱国将官等抗日民主力量§!，§x红色§!象征§x支持革命战争与民族解放事业的广大工农兵学商各阶层劳动者§!，§Y五角星§!寓意着以§x共产党§!为核心的§m中国民族§!§x统一战线§!，将两股力量上下紧密团结，共同行驶在实现中国解放的§S光明大道§!上。\n\n然而，1961年秋，£GNG_chinese_nation_texticon §m西北国民党§!首领§m马继援§!公开宣布脱离§m国防§!§V阵线§!，切断了§G西北§!与§L康区§!的联系，致使阵线陷入§R严重的经济军事困难§!，§R第三次统一战线§!走到了生死存亡的关键节点。\n\n值此§S渔阳颦鼓§!§V天崩地裂§!之际，风雨飘摇的§m国防§!§V阵线§!即将启程，走入§C命运§!所定之§S新秩序§!中。"
CPC_constitution_law_after_TRCW_desc: "[CPC.GetFlag]§x[CPC.GetName]§!宪法规定：\n\n§x[CPC.GetName]§!的国体是§x人民民主专政§!的§S社会主义人民共和国§!。\n§x[CPC.GetName]§!的政体是§S人民代表大会制度§!。\n[GetConstitutionCPC]\n§x[CPC.GetName]§!是世界上代表中国的§S唯一合法政府§!。\n\n我国愿意同世界上一切§x反帝国主义§!的§m民主§!§C进步§!§x革命§!政权建立外交关系，并将矢志不渝地继续坚持我们§x反帝国主义§!、§x反霸权主义§!的§S社会主义§!基本立场。"
GetConstitutionCPC_1: "§x[CPC.GetName]§!贯彻实行§S无产阶级民主§!原则，实行§G集体元首的选举制度§!，元首为§S全国人大主席团§!。"
GetConstitutionCPC_2: "§x[CPC.GetName]§!坚持落实§R人民民主专政§!原则，实行§G单一元首的选举制度§!，元首为§R国家主席§!。"
GetConstitutionCPC_3: "§x[CPC.GetName]§!无限拥护§L无产阶级专政§!原则，§L英明领袖林彪主席§!将带领我们向§x社会主义美好明天§!大步跃进。"
CPC_we_have_our_constitution: "£TER_texticon_NDF §m《中国国防§!§V阵线纲领》§!的历史使命已经完成，崭新的[CPC.GetFlag]《§x[CPC.GetName]§!宪法》将登上历史舞台。"
CPC_against_right_wing_law_desc: "§G农业政策大讨论§!后，以£TER_texticon_mao §G高岗同志§!为首的支持§G农业集体化政策§!的一派领导在£TER_texticon_mao §G毛泽东同志§!的支持下获得完胜。然而，在农村地区掀起§R社会主义高潮§!的过程中，£CPC_texticon §R党中央§!遭遇了前所未有的§R执行阻力§!。在§C民主党派§!中间，一股§j资产阶级§!性质的势力、一股§e反社会主义§!的思潮开始恶毒攻击£CPC_texticon §R共产党§!的政策，妄图§R否定§!党的领导，扭转§S社会主义§!的方向。这种来势汹汹的§e反革命思潮§!甚至影响到了§R极个别同志§!，给党内思想造成极大的§R混乱§!。£TER_texticon_mao §G毛泽东同志§!当机立断发动反击，坚决保卫新生的§m国防§!§V阵线§!和§x革命政权§!，将这些§e害群之马§!从阵线的各个角落彻底铲除。\n\n这场运动取得的成果是丰厚的，从各机关单位和企业工厂清理了大量§n右派分子§!，为£TER_texticon_mao §G毛主席§!即将发动的£TER_texticon_mao §G大跃进§!扫清了政治上的障碍，并从思想上做足了准备。在运动过程中，虽然部分领导同志存在§R过火行为§!，但整体大方向是§G正确§!的。对于被错误划为§n右派§!的党内外人士，中央决定予以§G平反§!，摘去§n右派§!帽子，§G恢复工作§!。"
CPC_great_leap_forward_law_desc: "£TER_texticon_mao 《§G大跃进§!决议》属历史文件。1948年，出身§G西北局§!的£TER_texticon_mao §G高岗同志§!提出§G征集富人余粮赈灾、落实土地改革§!的双管齐下的工作措施，三年间根据地§G农业恢复良好§!，£TER_texticon_mao §G高岗§!因工作成绩突出而进入§R中央政治局§!。\n\n土改过后农村出现了新的制约生产难题，在1952年§G中央扩大会议§!上，£TER_texticon_mao §G高岗§!提出应当乘胜追击，以§G农业互助§!现象为范本加快§G集体化改造§!。\n\n1953年，£TER_texticon_mao §G高岗§!借§R李立三§!关于§S工会§!问题的报告展开攻势，£TER_texticon_mao §G毛泽东§!明确表态支持£TER_texticon_mao §G高岗§!，反对工会独立论。\n\n五十年代中后期，§R社会主义改造§!遗留的问题逐渐浮现，§m国防§!§V阵线§!内外都开始出现了不同的§R反对声音§!。£CPC_texticon §G党中央§!慢慢形成共识，要同£GNG_chinese_nation_texticon §m西北国民党§!及[CHI.GetFlag]§L伪民国政府§!展开生产及军备竞赛，誓要夺取国内各股势力的§G革命主动权§!。\n\n至此，£TER_texticon_mao §G大跃进§!的基础已经成熟：以§R生产关系变动上升§!为主要目标；将§R社会主义改造总计划、工业跃进和农业集体化§!作为£TER_texticon_mao §R三面红旗§!注入£TER_texticon_mao §G毛泽东思想§!，成为§R全党、全军、全阵线§!的行动纲领。\n\n1956年，£TER_texticon_mao 《§G大跃进§!决议》通过，但由于§n五十年代末期严重的自然灾害§!及£GNG_chinese_nation_texticon §m西北国民党§!的背叛，£TER_texticon_mao §G大跃进§!最终宣告失败，并给§m国防§!§V阵线§!造成了难以挽回的§R损失§!。\n\n尽管如此，£TER_texticon_mao 《§G大跃进§!决议》仍然成为了£TER_texticon_mao §G毛泽东思想§!的纲领性文件之一，£TER_texticon_mao §R三面红旗§!仍在§f西北大地§!上高高飘扬。"
CPC_fuck_KMT_law_desc: "§m国防§!§V阵线§!成立以来，以§m西北三马§!为前身重组的£GNG_chinese_nation_texticon §m西北国民党§!在日常工作中表现出严重的§R个人主义、封建主义、官僚资本主义§!倾向，为根据地§G革命群众§!所不容，为根据地§G革命战士§!所不齿；其首领§m马继援§!拒不执行§m《纲§!§V领》§!规定，自五十年代后期以来，£GNG_chinese_nation_texticon §m西北国民党§!肆意§R驱赶§!甚至§x杀害§!前往青海指导§G革命工作§!的£CPC_texticon §R我党干部§!，种种罪行不胜枚举。\n\n更兼§m马继援§!野心膨胀，竟于1961年公然宣称§R脱离并宣战§!，切断了§G西北§!与§L康区§!的联系，致使阵线陷入§R严重的经济军事困难§!，经过严肃警告和慎重考虑，£CPC_texticon §x中国共产党§!全党上下一致认为，£GNG_chinese_nation_texticon §m西北国民党§!已经§V严重偏离革命道路，背弃抗日誓言§!，已经变质为事实上的§e反动派§!，经£CPC_texticon §R党的中央全会§!及£CPGAC_texture_loc §G中央人民政务委员会§!表决，决议宣布£GNG_chinese_nation_texticon §m国民党§!为§e非法政党§!，逐出§R统一战线§!。"
CPC_agricutural_reform_law_1_desc: "£TER_texticon_mao §G毛泽东同志§!指出，§G农业集体化§!是社会主义农业的本质特征，§G集体化§!加§R机械化§!是中国农业发展的一个方向。£CPC_texticon §R党的八大§!指出，过去§G大跃进§!时期的§G人民公社§!集体化思路没有问题，§G大跃进§!时期的失败多是由于£GNG_chinese_nation_texticon §m国民党反动派§!故意破坏、党的部分干部犯了§R“左”倾错误§!造成的。有了六十年代初的教训，£CPC_texticon §R我们党§!已经摸索出了一套§G稳健而高效§!的§G集体化方法§!，我们的§G社会主义农业§!事业必能取得新的成功！"
CPC_agricutural_reform_law_2_desc: "£TER_texticon_liu §m刘少奇同志§!认为，§m生产资料所有制的改造§!绝非易行之事，需经过充分的调查研究。§m中央§!研究决定，根据地农业§m建立高级合作社§!的总目标不变，但在具体政措实施上应当较六十年代初§m有所缓和§!，应当§m解散一部分经营不善的农业合作社§!，允许农民在一段时期内§Y分田单干§!。我们相信，这部分政措将能以§m最快速度§!帮助根据地从§G大跃进§!的§R创伤§!中恢复过来。"
CPC_industrial_reform_law_desc: "自1955年以来逐步启动的£TER_texticon_mao £TER_texticon_liu §G公有制§!§m经济改造§!为根据地打破了§R产业壁垒§!。六十年代中期以后，§m国防§!§V阵线§!拥有§L陕南、川中、渝中、康南§!等重要工业区，工业生产§R社会化§!程度越来越高，§R技术要求§!越来越复杂。£CPC_texticon §R党中央§!审时度势，以§G工业§!§m改造§!为重心，完成了全解放区的§R社会主义工业改造§!，§R西部工业能力§!节节攀升，为§x解放全中国§!的远大目标打下了§G坚实基础§!。"
CPC_military_reform_law_1_desc: "为£TER_texticon_PLA §Y中国人民解放军§!发展长远计，£TER_texticon_NDF §Y中央军委§!审时度势，依照60年代中期我军的实际情况制定了围绕§L“任务式指挥改革”§!展开的£TER_texticon_PLA §Y军事改革§!总方针。\n\n军改总方针扩大了下级组织作战的§G自主权§!，充分发挥其§G主动性、创造性、灵活性§!，从而有效应对复杂多变的战场环境，以夺取和保持§G主动权§!。\n\n同时，我军军事改革还涉及§m多军种专业化§!、§Y战略支援共通§!、§R整肃部队纪律§!等方面，我们相信，切实有效的军改措施能帮助我军§G提升战斗力§!，§m完成现代化目标§!，§S夺得最后的胜利§!，§x解放全中国§!！"
CPC_military_reform_law_2_desc: "为£TER_texticon_PLA §Y中国人民解放军§!发展长远计，£TER_texticon_NDF §Y中央军委§!审时度势，依照60年代中期我军的实际情况制定了围绕§R“集中式指挥改革”§!展开的£TER_texticon_PLA §Y军事改革§!总方针。\n\n军改总方针强调，§x党§!是§G无产阶级先锋队§!和§G无产阶级组织的最高形式§!，它应当领导包括£TER_texticon_PLA §Y军队§!在内的一切其他组织。惟有坚持党的集中统一领导，协调§R党§!§G政§!§Y军§!§S民§!各方面的步调，方可实现§m军事现代化§!的目标。\n\n同时，我军军事改革还涉及§m多军种专业化§!、§Y战略支援共通§!、§R整肃部队纪律§!等方面，我们相信，切实有效的军改措施能帮助我军§G提升战斗力§!，§m完成现代化目标§!，§S夺得最后的胜利§!，§x解放全中国§!！"
CPC_ANRL_basic_law_desc: "[CPC.GetFlag][VIC.GetFlag][CRC.GetFlag][KPA.GetFlag] §m河内§!§V协定§!通常被视为§m亚洲民族§!§V革命联盟§!的基本法，其全文如下：\n\n自[VIC.GetFlag][CRC.GetFlag][KPA.GetFlag]§m东南亚各国革命运动§!广泛兴起以来，§S亚洲局势§!已经产生重大的变化，广大受£GNG_japanese_frustration_texticon §j日本帝国主义§!压迫，受剥削的民族正在§Y奋起反抗§!侵略者的§j残酷统治§!。面对这样的形势，缔约各国认为需要建立一个§x由所有亚洲革命国家组成的反帝联盟§!，才能推翻§j共荣圈§!这个建立在亚洲各族人民头上的囚笼。以此宗旨为核心，各缔约国派遣全权代表，经过协商一致，正式达成如下协议，成立§x亚洲民族革命联盟§!。\n\n一、缔约国以通过§x革命斗争§!来推翻§j日本共荣圈§!的§j殖民统治§!，§x解放亚洲各国人民§!为首要目标。凡与§j日本帝国主义§!勾结者皆属缔约国共同之敌，同时对于§Y维持中立的国家§!，缔约国愿意在§G尊重各国主权独立，不干涉内政与平等共处的原则§!基础上进行正常交流。\n二、缔约国应本着加强革命国家之间§G团结互助§!的精神，就涉及其共同利益的§Y所有重要国际问题§!进行磋商。\n三、当亚洲发生了§Y任何一国或国家集团§!对缔约国的§R武装进攻§!，所有缔约国应实行单独或集体的§R自卫反击权力§!，以一切它可以采用的§Y合理形式§!（包括§R派遣武装§!）对受攻击国进行全力支援。\n四、缔约国应成立§m联合指挥中心§!，统一协调各国在有关军事活动中的配合协作，各派代表进入§m联合指挥中心§!担任职责。\n五、缔约国应成立§G常设政治协商机构§!，负责联盟的日常工作，审议，批准并落实来自各国的提案。缔约国各派代表进入§G政治协商机构§!担任职责。\n六、缔约国之间应互相尊重§G领土完整，主权独立，互不干涉内政§!，在§G经济领域§!与§R军事领域§!上互相帮助，团结一致，并且积极援助各国的§x反帝力量§!，为实现§x亚洲民族的完全解放§!而战。"
CPC_old_aged_leaders_retire_law_desc: "£CPC_texticon §R党的第九次全国代表大会§!总结了我党多年来革命建设的伟大成就，但议程中突发的一系列§R变故§!让§R党中央§!首次认识到§m干部交接及退休制度§!§R尚不完善§!的迫切问题，随着时间流逝，中央出现了一大批§Y七十岁以上§!的“高龄干部”，这些§Y老同志§!无论是§G思维能力§!还是§m身体机能§!都在逐渐退化，各方面能力都已无法再胜任§R日渐繁重的政务、军务工作§!。\n\n关键时刻，£TER_texticon_mao §G毛泽东同志§!、£TER_texticon_liu §m刘少奇同志§!高风亮节，主动从§G中央领导职务§!上退休，并以极大的决心推动了§G高龄§!§m干部§!§R退休§!§Y制度§!的完善，终结了在制度设计上§R不科学也不合理§!的§m干部终身制§!。"
CPC_rural_democracy_law_desc: "£CPGAC_texture_loc 《§G基层§!§S参政议政§!工作条例》首次以立法形式明确了[CPC.GetFlag][CPC.GetName]的§S基层民主§!实践形式及实践范围，这标志着我们在§S社会主义民主§!道路上迈出了§G实质性的重要一步§!。随着§S基层民主§!实践形式和实践范围在这一条例的框架下不断深化扩大，我们相信§S人民民主§!乃至§x无产阶级民主§!的§G远大目标§!必将实现。"

