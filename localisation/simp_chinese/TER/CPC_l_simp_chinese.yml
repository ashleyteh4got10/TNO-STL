Member_of_the_United_Front: "统一战线成员"
Member_of_the_United_Front_desc: "蒋介石国民党政府宣布对日寇无条件投降后，国防阵线接过了抗日的大旗，号召团结一切可以团结的对象，在无产阶级的领导下，推翻帝国主义在中国的反动统治。\n\n国防阵线全体成员已经空前一致地认识了统一战线的正确性，空前自觉地团结在共产党的旗帜下，为一个独立、自由、民主、统一、进步的新中国而奋斗。"
Member_of_the_United_Front_international: "国际反帝阵线成员"
Member_of_the_United_Front_international_desc: "反帝统一战线一词，最早于共产国际第七次代表大会上被提出。在最新的理论著述中，毛泽东同志一针见血地指出：要建设更广泛的反帝统一战线，就是要把东亚东南亚所有受日本帝国主义压迫的兄弟民族团结到一起。\n\n中国共产党及其他共产主义兄弟政党要始终如一地团结在马克思列宁主义旗帜下，旗帜鲜明地反对日本帝国主义旧秩序，为一个独立、自由、民主、统一、进步的新东亚、新世界而奋斗。"
CPC_MUF_tooltip_1: "--------------\n§Y统一战线成员§!接受£CPC_texticon §R中国共产党§!的领导，拥有§G极高的独立决策权§!，£CPC_texticon §R中国共产党§!则需要通过派驻在各地的§Y党委§!或§Y地方局§!来影响§Y统一战线成员§!。\n--------------"
CPC_MUF_tooltip_2: "--------------\n§Y国际反帝阵线§!是§Y统一战线理论§!的延伸，成员为£CPC_texticon §R中国共产党§!承认的亚洲共产主义政权。\n--------------"
CPC_MUF_tooltip_3: "--------------\n§Y统一战线领袖§!，即£CPC_texticon §R中国共产党§!，可以通过派驻在各地的§Y党委§!或§Y地方局§!来影响§Y统一战线成员§!。"
CPC_leader_of_united_front: "统一战线领袖"
CPC_leader_of_united_front_desc: "[CPC_leader_of_united_front_desc]"
CPC_leader_of_united_front_desc_1: "脱胎自全面抗战的余烬，统一战线随着第三次国共合作在中国阴燃的废墟中再度崛起，这为中国共产党带来了隐形的“领袖”地位，自中日事实停战后，中共便开始以统战名义向西部各军阀派驻党委协助和“指导”军阀治理属地。\n\n最初的统战工作十分顺利，通过土改和稳健的生产政策，共产党在民间迅速积攒下巨大的声望，整个西部中国似乎又聚集起了一股足以撼天动地的能量，只等共产党振臂高呼，抗日大军便要自百二秦关东出——\n\n然而，五十年代以来愈演愈烈的社会主义改造运动不仅惹怒了本就不情不愿的旧军阀，也将步履蹒跚小富即安的西北农民抛在身后，以1961年秋马继援率青马旧部纠集青海回民宣布脱离统一战线，向西北国防阵线宣战为标志，统一战线终于走到了生死存亡的关键节点，而这之后，谁也不知道这一松散联盟的命运将走向何方……"
CPC_leader_of_united_front_desc_2: "脱胎自全面抗战的余烬，统一战线随着第三次国共合作在中国阴燃的废墟中崛起，这为中国共产党带来了隐形的“领袖”地位，尽管途中曾有波折，但如今的£CPC_texticon §R中国共产党§!经受住了考验，不仅没有在六十年代初的动乱中湎于沉沦，反而抓住机会扩大了抗日根据地，妥善处理了数个棘手难题。在日本帝国主义的经济封锁中能取得如此成就，足以让统一战线中的旧军阀们侧目。"
CPC_broken_united_front: "破碎的统战"
CPC_broken_united_front_desc: "国防阵线在创立之初就处于一种稳定的分裂之中，这是从娘胎里带出来的病，细究起来原因有二：\n\n其一，1949年的共产党相比于1937年的国民党还是过于弱小，纵使抗日的理由足够充分，也没有绝对的力量使其他盟友团结在自己身边；其二，共产党不可能完全接受大资本家、大地主、大军阀所需的政治纲领——除非她竟纵容自己变成第二个国民党。\n\n§R梁园虽好，不是久居之家。有些人别过脸去，头也不回地离开了阵线。§!"
CPC_heavy_blockade: "日本的经济封锁"
CPC_heavy_blockade_desc: "在日本军队试图强渡黄河，入侵陕北失败后，冈村宁次伙同汉奸阎锡山在山西-陕西交界的黄河堤岸上筑起一道堡垒封锁线，完全隔绝阵线与东部地区的自由交流，这给我们带来不小的麻烦。\n\n§R如果走不出西北的高山深壑，我们将就此慢性死亡。§!"
CPC_broken_China: "割据一方"
CPC_broken_China_desc: "阵线度过了相对和平的十年，但在国内局势恶化和发展不断遇挫的共同作用下，我们的合法性正在与日俱减。东部人民逐渐遗忘了我们，而西北的人民开始质疑共产党，质疑社会主义。\n\n中国还是“我们的”中国，这是个不容质疑的话题，但高宗武的声望从某种程度讲正在赶上阵线。时间不多了，只有消灭伪政权，才能彻底扭转我们的境遇。"
CPC_experts_from_ussr: "苏联专家"
CPC_experts_from_ussr_desc: "在苏联崩溃后，我们接收了部分苏联流亡科学家，他们曾经跻身世界顶尖学术领域的研究，现在投身于我党的革命事业，让我们向这些国际主义战士致以崇高的敬意。"
CPC_experts_from_ussr_and_jap: "西北国防研究院"
CPC_experts_from_ussr_and_jap_desc: "在改造收容一部分日本专家后，我们的科研力量又增强了。现在我们整合协调外籍技术员之间的人事关系，组建起西北国防研究院。日本专家要和苏联专家一同工作，为阵线的科研发展贡献自己的一份力量。"
CPC_experts_from_everywhere: "西北国防研究院"
CPC_experts_from_everywhere_desc: "时隔数年，研究院又迎来一批新人——来自远在大洋彼岸的美国专家。初来乍到时，他们对研究院简陋的条件感到不快，但又惊讶于人员构成的“国际性”。中国人、美国人、俄罗斯人、日本人一起工作的场面显然有些别具一格，而阵线的科研水平也将更上一层楼！"
CPC_military_advisor_from_USA: "美军顾问"
CPC_Construction_Corps: "建设兵团"
CPC_Construction_Corps: "建设兵团是一种介于完全军管与和平政府之间的组织管理形式，它兼具生产建设和巩固国防的作用。考虑到少数民族聚居的边远地区很难快速组织起有效的治理单位，设立建设兵团就成为一种便捷的选择，它能够高效执行中央发出的指示，并及时处理各类突发事件，减轻中央的负担。"
CPC_vote_for_election: "地方选举"
CPC_vote_for_election_desc: "这是我们第一次把基层干部任命权交到人民手中，有的同志可能会说这样做太麻烦了，普通群众哪懂什么路线方针，什么事情都交给他们讨论得好久才能出结果。但是就目前情况来看，我们最好不要过多计较，这样做能够听到普通群众最直观的声音。"
CPC_Foreclosure: "赎买资金"
CPC_Foreclosure_desc: "马家军的反动宣传深深影响了青海、甘肃等地，大量群众对阵线人员存在恐惧感。我们应该收紧缰绳，与人为善，用相对温和的方式执行革命政策。阵线决定从预算中抽取一部分，用来在土改中收买地主手里的地。"
CPC_radical_land_reform: "激烈土改"
CPC_radical_land_reform_desc: "那些渴望发展的党员干部迫不及待驱车前往青海、甘肃等地就职，指挥当地群众进行报复性的土改工作，甚至达到罔顾实际情况的程度，在不少地方酿成群众对立的混乱局面。但是目前中央的工作重点不是纠正“左倾”错误，而是通过土改运动重新唤起人民群众的革命热情。"
CPC_hug_strongly: "紧紧拥抱？"
CPC_hug_strongly_desc: "在兰州优秀市民表彰大会上，有许多回族群众因举报盘踞在地下的黑窝点得到市政府嘉奖，这象征着党关于彻底扫除宗教极端势力取得重大成果。表彰过程中，市民们与兰州市委书记刘澜涛热情地拥抱在一起，脸上洋溢着幸福的笑容。"
CPC_peace_is_first: "以和为贵"
CPC_peace_is_first_desc: "各少数民族聚居的地区应该实行民族自治，按照民族聚居的人口多少和区域大小，分别建立各种民族自治机关。凡各民族杂居的地方及民族自治区内，各民族在当地政权机关中均应有相当名额的代表。\n\n现在，不管发生过什么事情，从今以后都不要再提了，及时卸下历史包袱，凡事都要以和为贵。"
CPC_together_forward: "携手共进"
CPC_together_forward_desc: "兰州党史研究小组编写出一本《伊斯兰教的历史及其反动本质》，作为改造人员的必读书目发放，并由教学能力出色的老师开课讲解。相信在将来，我们可以阐述清楚党对待宗教的政策，与兄弟民族达成和解。"
CPC_purge_IMPRP: "清洗内人党"
CPC_purge_IMPRP_desc: "这是我们最不愿意看到的事情，但也是我们不得不做的事情。\n\n内人党作为民族分裂主义、反社会主义、修正主义的反动组织，走上了与党中央、毛主席相反的道路，继续发展下去必然走到反党叛国的道路上。党中央当机立断，决心彻底扫除这些反革命分子，拆除这些钻入我们阵线内部的定时炸弹。"
CPC_Elimination_Mon_independence_advocate: "蒙古肃反"
CPC_Elimination_Mon_independence_advocate_desc: "蒙古民族主义分子、蒙疆汉奸、日本特务和泽登巴尔蒙古修正主义分子纠集在一起，疯狂反对我们党的社会主义路线，制造了数不胜数的血案。同志们，这是一场与境外敌对势力关乎生死存亡的斗争，此时我们必须相信人民，依靠人民，将反动分子淹没在人民战争的汪洋大海中，为那些死去的汉族同胞报仇，让蒙古分裂分子血债血偿！"
CPC_ulaanbaatar_offensive: "乌兰巴托攻势"
CPC_block_barn: "封锁粮仓"
outermongolia_return: "外蒙古回归"
CPC_cavalry_company: "骑兵连"
CPC_cavalry_company_2: "骑兵连"
CPC_cavalry_company_3: "骑兵连"
CPC_three_rules_of_discilpine_and_eight_point_for_attention: "整肃军纪"
CPC_three_rules_of_discilpine_and_eight_point_for_attention_2: "整肃军纪"
CPC_avant_garde_company: "先锋连"
CPC_avant_garde_company_2: "先锋连"
CPC_avant_garde_company_3: "先锋连"
CPC_material_control: "物资管制"
CPC_catch_up_with_work_and_time: "赶工赶时"
CPC_demand_quantity_but_not_quality: "求量不求质"
CPC_village_joint_insurance: "村寨联保"
CPC_SIK_military_advisor: "派遣军事顾问"
CPC_big_four_cleans_1: "四清运动：1级"
CPC_big_four_cleans_1_desc: "我们的目标是通过四清在社会层面发动一次大规模的社会主义教育，批判右倾机会主义，批判资产阶级思想，彻底揪出地富反坏四类分子。现在，各地党员干部在基层开始传达中央的决议，获得了农民群众的普遍支持。"
CPC_big_four_cleans_2: "四清运动：2级"
CPC_big_four_cleans_2_desc: "我们的目标是通过四清在社会层面发动一次大规模的社会主义教育，巩固农业集体化的成绩，批判右倾机会主义，批判资产阶级思想，彻底揪出地富反坏四类分子。现在，农村地区的四清运动普遍得到实施，揪出许许多多我们未曾发现的双反分子（反党、反社会主义），取得可喜的成绩。"
CPC_big_four_cleans_3: "四清运动：3级"
CPC_big_four_cleans_3_desc: "我们的目标是通过四清在社会层面发动一次大规模的社会主义教育，巩固农业集体化的成绩，批判右倾机会主义，批判资产阶级思想，彻底揪出地富反坏四类分子。现在，四清运不仅仅是属于农村的运动，城市里的四清也如火如荼铺张开来。各大工厂单位紧紧跟随毛主席的革命路线，纷纷开展社会主义教育，将混入到阵线中的四类分子彻底清扫出去。"
CPC_big_four_cleans_4: "四清运动：4级"
CPC_big_four_cleans_4_desc: "“阶级斗争要年年讲、月月讲。党内有一部分党员成了右派，从支部到中央都有垮台的，这是政治新陈代谢的正常现象，不要怕。”——毛泽东\n\n我们的目标是通过四清在社会层面发动一次大规模的社会主义教育，批判右倾机会主义，批判资产阶级思想，彻底揪出地富反坏四类分子。现在，四清运动已开始指向中央的部分成员，他们即将面临“修正主义“的指控，并进行自我批评。从东到西，从南到北，从上到下，党从阵线各处挖掘出数不胜数的四类分子，我们相信这是阵线正在排出困扰已久的毒素。"
GAC_relationship_worthen: "关系恶化"
CPC_high_purchase_level: "高指标征购"
CPC_high_purchase_level_desc: "虽然党中央三令五申不能搞“两本帐”：中央定下指标，地方不允许暗中上调，追求“超额完成”。\n但是不可避免，我们的干部仍然或明或暗采取各种小动作博得中央的注意，给农民生活带来不小的困扰。"
CPC_personal_hard_level: "个体硬指标"
CPC_rural_market_idea: "农村集市"
CPC_calc_the_work_point: "算工分"
CPC_agricultural_bank_idea: "农业银行"
CPC_Lin_Biao_go_up_the_mountain: "背后的林彪"
CPC_Lin_Biao_go_up_the_mountain_desc: "身为军队首脑，林彪的权限应止步军事。可是党中央不得不屡次三番推广未获政务委员会通过的决议，使得他正以阵线副主席的身份指挥政府部门工作。\n这种打破党纪原则的行为，并非是毛主席或刘主席愿意看到的，这会对未来产生不可预料的影响。"
CPC_black_line_theory: "黑线论"
CPC_black_line_theory_desc: "文艺界基本上没有执行过毛主席的文艺理论，被一条与毛主席思想相对立的反党反社会主义的黑线专了我们的政，这条黑线就是资产阶级的文艺思想、现代修正主义的文艺思想和所谓三十年代文艺的结合。有人提出所谓“创作离经叛道”论，就是离马克思列宁主义、毛泽东思想之经，叛人民革命战争之道。——江青"
CPC_worthen_special_apply: "削减特供"
CPC_worthen_special_apply_desc: "每当阶级斗争的矛头指向党自身，似乎所有随之而来的批判都像是会拐弯的子弹，绕过党的躯体，朝四面八方胡乱飞去。\n你舍得中央老同志们抽不上卷烟厂特制润肺清咽的草药雪茄吗？\n你舍得填平毛主席的游泳池，让他只能到延河游野泳吗？\n你舍得拆掉刘主席最爱去的交际舞厅吗？\n我舍得。"
CPC_four_dishes_one_soup: "四菜一汤"
CPC_four_dishes_one_soup_desc: "宴请不超四菜一汤，食堂打饭不超三菜一汤。上到领导，下到基层，标准一致，勤俭革命。"
CPC_Bai_Yin_exp: "白银经验"
CPC_Bai_Yin_exp_desc: "刘少奇主席的夫人王光美带领一队中央工作组亲自莅临宁夏白银化工厂，通过揭露工厂历史问题、整顿组织工作，解决了工人阶级长期集中反映的党委治理问题。在斗争中，工人们干劲高涨，立志完成党中央下达的生产任务，向全根据地人民交出一份满意的答卷。"
CPC_culture_rev: "文化革命"
CPC_culture_rev_desc: "从批判反动京剧《申包胥》开始，阵线上下开始奉毛主席《在延安文艺座谈会上的讲话》为圭臬，加强革命文学创作的意识，勇夺无产阶级丢失的文化阵地，保证根据地人民远离反动势力堕落腐朽的精神污染。"
CPC_sky_changes_theory: "变天论"
CPC_sky_changes_theory_desc: "最大的问题，是防止反革命政变，防止颠覆，防止“苦迭打”。革命的根本问题是政权问题。有了政权，无产阶级，劳动人民，就有了一切。没有政权，就丧失一切。生产关系固然是基础，但是靠夺取政权来改变，靠夺取政权来巩固，靠夺取政权来发展……社会上的反动派，混进党内的剥削阶级汉奸走狗都要镇压，有的杀头，有的关起来，有的管制劳动，有的开除党籍，有的撤职。不然，我们就不懂得马克思主义关于政权的根本观点，我们就要丧失政权，就是糊涂人。——林彪"
CPC_sting_operation: "肃反"
CPC_work_protection: "劳保"
CPC_sting_operation_1: "肃反：1级"
CPC_sting_operation_1_desc: "我们的目标是通过肃反及时清理掉政府内部的腐败分子，为人民群众树立勤劳、廉洁、朴素的工作作风，教育民众什么事情应该做，什么事情不能做。关于肃反的决议，我们通过小范围吹风会通知执行肃反的工作组成员，他们将通过微服私访的形式潜入基层，等待中央下一步指示。"
CPC_sting_operation_2: "肃反：2级"
CPC_sting_operation_2_desc: "我们的目标是通过肃反及时清理掉阵线内部的腐败分子，为人民群众树立勤劳、廉洁、朴素的工作作风，教育民众什么事情应该做，什么事情不能做。肃反运动已经在部分单位、农村合作社部署，中央派出的工作组正在一点点发掘基层那些不为人知的腐败问题。有一部分普通罪犯和高级罪犯在审查中露出马脚，被我们的肃反人员抓个现形。"
CPC_sting_operation_3: "肃反：3级"
CPC_sting_operation_3_desc: "我们的目标是通过肃反及时清理掉阵线内部的腐败分子，为人民群众树立勤劳、廉洁、朴素的工作作风，教育民众什么事情应该做，什么事情不能做。在掌握充足证据之后，工作组开始指控犯有严重路线问题的干部。在审讯中，牵涉到的人员越来越复杂，这意味着我们能编织出一整张反对社会主义的关系网，有利于将反动分子斩草除根。"
CPC_sting_operation_4: "肃反：4级"
CPC_sting_operation_4_desc: "“你们都说阵线的反动根子在基层，在那些地主资本家——这是为自己推卸责任。群众反映反动根子‘上面就有’，遇到这种情况我不会手下留情。”——刘少奇\n\n我们的目标是通过肃反及时清理掉阵线内部的腐败分子，为人民群众树立勤劳、廉洁、朴素的工作作风，教育民众什么事情应该做，什么事情不能做。肃反运动在阵线上下轰轰烈烈地展开，越来越多的线索表明社会层面的反动思想来自共产党高层，中央工作组已对此展开调查，将会有一批党员干部遭到撤职。"
