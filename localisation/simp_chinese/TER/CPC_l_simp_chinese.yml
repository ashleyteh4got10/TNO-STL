CPC_MRC_modifier_tooltip: "每日政治点数获得：[?CPC.CPC_MRC_pp_gain|2+]\n稳定度：[?CPC.CPC_MRC_st_ws_factor|+=%]\n战争支持度：[?CPC.CPC_MRC_st_ws_factor|+=%]\n杂项收入：[?ROOT.CPC_MRC_misc_income|+2]b\n杂项支出：[?ROOT.CPC_MRC_misc_costs|Y2]b\n\n协定规定如下：\n一、[Get_MRC_state_1]\n二、[Get_MRC_state_2]\n三、[Get_MRC_state_3]"
CPC_MRC_modifier_idea_desc: "半世纪以来，纵使横生出许多枝节将汉蒙两民族推向对立，但在包头，我们终于摒弃前嫌，以马克思列宁主义、毛泽东思想为指导，携手并进共同对抗帝国主义威胁。\n\n所有受到日本帝国侵略、控制、干涉和欺负的国家和人民联合起来，打倒我们共同的敌人！"
