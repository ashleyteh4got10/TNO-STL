TER_Mongolia_Reunification_Conference_desc: "毛主席指示：§G“蒙古革命与中国被压迫民族被压迫阶级是相互联系的，热烈欢迎蒙古同志与我们站在同一战线上，结成一条铁链来粉碎日本帝国主义。”§!\n\n在我们暗中支持下，蒙古革命取得了令人欣慰的阶段性成功，根据£CPGAC_texture_loc §G中央人民政务委员会§!决议，我们将在包头同蒙古人民革命党召开§G中蒙和平统一会谈§!，接下来数月，我们将就§Y中蒙统一的各方面问题§!进行积极磋商。"
TER_MRC_info: "和平统一会谈进度：[?MRC_total_progress|0Y]%\n--------------------\n和平统一会谈将有§Y5个主要议题§!，中蒙双方对每个议题的态度不一，所提出的解决方案也五花八门，在议题结束之前，我们随时可以花费§G政治点数§!以选择合适的§G解决方案§!，不同的解决方案对双方的§Y和谈意愿§!有不同影响，请审慎选择解决方案以促成和平统一！\n\n当所有议题§G已经讨论结束§!，且中蒙双方的§Y和谈意愿§!均§G高于75%§!时，中蒙双方将基于§Y已经做出的选择§!获得相应§G民族精神§!及§G对应效果§!。\n\n若已§R无望和平统一，或代价过于高昂§!，您可以随时选择§Y退出会谈§!，§x以武力手段统一蒙古§!。\n\n请注意，若最终§R不满足统一必要条件§!，将自动取消§G和谈统一路线§!的所有国策，并依据您的选择§R采取相应措施§!。"
