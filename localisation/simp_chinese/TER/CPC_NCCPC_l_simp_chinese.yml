 CPC_NCCPC_info_desc: "£CPC_texticon §x中国共产党全国代表大会§!\n-------------------------\n[CPC_NCCPC_info_pics]以§G布哈林民主集中制理论§!为准则而建立的共产党禁止公开派系活动，但党员们总会因§Y意见分歧§!、§Y施政理念§!甚至§Y工作从属§!去区分彼此，强大的规则压力下，派系分歧如同母鸡下蛋一般自然发生。\n\n由于历史问题的认知差异，中国共产党内部形成了以§G毛泽东同志§!为首和以§m刘少奇同志§!为首的两大主流派别，左右着当前革命路线。\n\n尽管我党因§Y诸多原因§!发展出了各个派别，但我党仍然保持着§G总体团结，求同存异§!的正常政治空气，我党的§Y施政方针§!和§Y治党方针§!仍然严格以§G民主集中制理论§!为准则，绝不轻易开展§R过激过重的政治斗争运动§!。\n\n我们可以通过不同的操作去影响§Y派系结构和政策实施§!，以便在党的大会上决定§Y保持§!领导派别或§Y变换§!领导派别。\n\n日盈则昃，月满则亏，对党内政治的影响会因派系规模而受到限制。派系规模越§Y大§!，§R越难以增强§!；派系规模越§Y小§!，§R越难以削弱§!。"
 CPC_mao_power: "§G毛派§!"
 CPC_mao_power_value: "[?ROOT.TER_pol_str_real_percent^0|2]%"
 CPC_mao_power_desc: "§G毛派§!通常为支持毛泽东主张或受毛泽东信赖重用的党内干部群体，也是§x中国共产党§!内规模最大的山头之一，在§G西北出身的中高层干部§!及§R军队§!中拥有巨大号召力，但就目前而言，§G毛派§!似乎缺乏相对严密的组织关系，在政治事务中常常无法形成合力。\n\n§G毛派§!的施政纲领通常与毛泽东个人大开大合的行事风格相符，尤以§S社会主义改造时期§!的各项激进政策为最，但需要注意的是，§G毛派§!并不能完全等同于毛泽东本人的政治意志——事实上，§G毛派§!并非总是一副激昂慨然无所畏惧的浪漫主义者的模样：庞大的§G西北干部群体§!中，一批§G新生代§!正逐渐在毛泽东的保护下以更成熟的政治姿态投入根据地建设。相较老一辈，他们的身段大多更加灵活，也更受基层干部群众的欢迎——但他们的目标却十分坚定：完成§G毛主席§!的嘱托，推动掀起整个根据地……或是全中国的§x社会主义高潮§!。"
 CPC_liu_power: "§m刘派§!"
 CPC_liu_power_value: "[?ROOT.TER_pol_str_real_percent^1|2]%"
 CPC_liu_power_desc: "§m刘派§!通常为支持刘少奇主张或受刘少奇信赖重用的党内干部群体，也是§x中国共产党§!内规模最大的山头之一。其成员大多和刘少奇在§m白区敌后工作§!时期有直接或间接隶属关系，不少壮年干部已经跻身§x党的中央委员会§!，因此在一些非正式场合的私下谈论中这些人也被称为§m白区派§!或§m中央派§!。\n\n§m刘派§!的施政纲领和刘少奇个人相对温和的政治经济主张相符，在§G大跃进§!后因经济恢复和政治稳定需求而迅速崛起。\n\n与§m刘派§!本身相对温和的政治经济主张不同，为了实现其主张，§m刘派§!干部所使用的行政手段往往是§Y强硬§!的。在一些第三者的眼中，这样的行政作风使得§m刘派§!的总体形象与过去的§G毛派§!渐渐重合了起来……"
 CPC_li_power: "§R国际派§!"
 CPC_li_power_2: "§R大众派§!"
 CPC_li_power_value: "[?ROOT.TER_pol_str_real_percent^2|2]%"
 CPC_li_power_desc: "作为一个已经几近退场的派别，§R国际派§!曾在党史上有过一段轰轰烈烈呼风唤雨的时期：忠于共产国际指示的张闻天、王明、博古等人都以不同方式短暂问鼎过这支革命队伍的最高权力——但在那些更熟悉中国现状的人面前，他们满腹的经纶教条反而成为了§R国际派§!走向没落的死穴。\n\n如今的§R国际派§!远不能称得上是什么像样的派系，反而更像是历次党内政治运动中预设好的“靶子”，若非§m刘少奇§!出于拉拢政治盟友的需要而把§R他们§!绑定在自己的周边，只怕§R国际派§!一词早已成为档案馆中尘封的铅字。\n\n就算内心对§m刘派§!的“修正主义政策”如何不满，眼下的§R国际派§!也无力再起身驳斥，只能在政务决策中投出默不作声的赞成票。"
 CPC_li_power_desc_2: "这是一个新兴的派别，肇始于周扬为§x中国共产党§!奠定的§R文艺战线基础§!，九大后随着党内老一辈革命家相继退休，§R大众派§!逐渐进入高层视野。\n\n§R大众派§!远非什么能执掌神器的派系，其主要议题几乎集中在文化建设上，几乎完全是当前总路线的§Y附属品§!。\n\n尽管名字里带着“大众”，§R大众派§!却始终只是几个党报编辑文人的清谈沙龙。不过，§m刘派§!对§R大众派§!抱有一定兴趣——或许这会成为§m他们§!在文化宣传阵地上的助力……"
 CPC_deng_power: "§Y书记派§!"
 CPC_deng_power_value: "[?ROOT.TER_pol_str_real_percent^3|2]%"
 CPC_deng_power_desc: "§Y书记派§!的规模不大，但是职权却很高：能被称为§Y书记派§!的党内干部几乎无一例外，都是围绕在§x中共中央书记处总书记§!邓小平周围的中央高级干部。\n\n而邓小平本人，则是毛泽东拣选来挽救大跃进严重后果的重要助手，同中央那些强调§x“路线方向”§!的传统毛派干部不同，邓小平并不在意自己的经济主张，用他自己的话来说：§Y“不管黑猫白猫，捉住老鼠就是好猫。”§!\n\n有相当多的人对邓小平的§x党性觉悟§!颇有微词，但毛泽东事实上还是默许了他的补救措施，并许以他§G中央书记处总书记§!和§G中央人民政务委员会主任§!的要职来辅助自己管理日常党务政务。\n\n或许，单单从党内山头分野的角度将整个§Y书记派§!看成§G毛派§!的异端分支，似乎并无不可。"
 CPC_Kang_Sheng: "康生"
 CPC_Jiang_Qing: "江青"
 CPC_Hu_Jiwei: "胡绩伟"
 CPC_Yu_Guangyuan: "于光远"
 CPC_Bo_Yibo: "薄一波"
 CPC_Bo_Yibo_desc: "抗日时，薄一波的革命热情全部寄托在“决死”二字之中，对外界处处显出自己是一个性格刚烈的猛士。尤其在阎锡山面前，党的利益他寸步不让，若敢来犯则必然回敬。纵使阎锡山叛逃引来日军围剿，他也必须撕咬下敌人的几块肉之后才狠狠地转移到下一处游击区。\n\n任谁都会怀念人生的黄金时代，对薄一波来说就是浴血奋战于山西的光辉岁月。可晋冀鲁豫已然远在天边，这一切一去不复返了。\n\n西北不是薄一波的舒适区，回到延安后的一段时间内，他都不习惯处理陕北的人事关系。独在异乡为异客，一水的陕西籍干部中，他形如远途跋涉而来的游子，无处施展拳脚，磨灭了他的锐气——不过很快他就遇到了那能依靠的对象。受当时权势正盛的刘少奇提拔，薄一波获得了竞选中央委员的资格。明眼人看出这是毛泽东允许刘少奇培养自己的领导团队，同时奠定了薄一波今后三十年的政治轨迹。\n\n五十年代不属于刘少奇，也不属于薄一波，高岗毋庸置疑是这十年的宠儿。这一时期，薄一波因经济观点与高岗的“左”倾思想相左，自始至终受到非人般的刁难和打压。直到1960年国防阵线天崩地裂，高岗跌落神坛人人喊打，他和刘少奇才彻底翻身。西北干部的内部分裂，给了刘薄二人可乘之机。通过扶持与高岗同为陕西米脂人的刘澜涛，薄一波成功在中层干部队伍中打下一枚钉子，并随着镇压马家军的平叛进程逐步控制了西北的半壁江山。\n\n移除高岗的压迫后，薄一波就像弹簧一样猛然回弹，刚烈的灵魂正在复活。中共八大的前期准备工作中，受刘少奇之托，薄一波主持了清算高岗的会议，掀起肃清流毒运动：只要是高岗做过的事、用过的人，样样不落统统拿下。其秉持的彻底否定态度，重塑了共产党在西北的统治面目，赋予了刘少奇等人接管行政的必要性，使得他们能够深入政府工作的枝枝节节。而这场会议形成的决议将成为党的历史，在薄一波当选阵线主席后继续刻入一代又一代新人的脑中。\n\n掌声与嘘声齐鸣之下，薄一波与当年的高岗又有哪些不同呢？他们同样凭着一腔忿激施政，同样不把对手当人看，但阵线的长治久安并非是从政治上铲除一两个人便能实现的。可以预料到，薄一波那躁动且缺乏恭敬的身与心仍然难以被西北大地所接纳。待渔阳鼙鼓边风急之时，反对者们将慢慢集结起来，等到酝酿成熟就发出反戈一击。"
 CPC_Zhu_De_desc: "1947年重庆政府投降后，陕北共产党与西北国民党缔结盟约，双方相约抗日，建立国防阵线。朱德曾短暂作为最高军事首脑，名义上指挥国共双方所有的部队。但国共两党在军务上的事实分裂，使朱德变成了有名无实的总司令。坐上这把第一交椅，朱德迈步走入脱实就虚的工作道路，俨然一尊神佛。\n\n现在，二十年没有介入过实际工作的朱德，凭着洁白无暇的履历，被毛泽东推举成为国防阵线主席。\n\n身为发动南昌起义的元勋，朱德始终与“军队缔造者”的身份捆绑在一起，但却很难为他统治西北增添一分助力。这份荣誉太久远了，久到和他的主席身份一样高高在上又漂渺无迹。因此朱德与其他军队同僚的不同之处在于，他并不热衷于插手政治。与林彪开会时的眉飞色舞相比，朱德反而像是个寡言少语的小学生。尽管阅历高过所有人，朱德也不像彭德怀那样凭着自己满脑子的经验主义对中央工作评头论足。斗争形势风云变幻，统统和朱德无关，他只是默默交出属于自己的赞成票，把权力让给那些精力充沛，年富力强的同志。\n\n风雨八十载，久得就像一捧慢性毒药，将朱德折磨得憔悴不堪。革命队伍中的年轻人会为朱德的持久和坚忍兑现出绵延不绝的敬意，但当他们走过朱德面前时无不在恐惧与担忧：拖着一副历尽沧桑的躯壳，这位衰朽又臃肿的老人还能做些什么？也许，只是枯坐在这看似风光无限的头把交椅上，静待日落西山吧。"
