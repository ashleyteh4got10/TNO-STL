 TER_hosting_service_NCCPC_tt: "§Y托管服务§!：£CPC_texticon §x中国共产党全国代表大会§!\n----------------\n若您§R精力有限§!，无法顾及所有机制的运转，可点击此处启动§Y当前机制的托管服务§!，这将花费£pol_power §Y10§!政治点数。\n若已经开启§Y托管功能§!，再次点击即可关闭，并返还£pol_power §Y10§!政治点数。若您选择§Y关闭托管服务§!，最快将于下一次托管效果生效后关闭。\n本机制不再可用时，托管服务亦会自动关闭。\n----------------\n当前机制托管效果：\n每年§Y党费预算§!：§Y$25§!/人\n§Y1962年§!：§Y每月循环§!对§Y所有派系§!进行§G点名表扬§!\n§Y1962年以后§!：§Y每月循环§!对§Y所有派系§!进行§m特殊照顾§!"
 TER_hosting_service_NWB_tt: "§Y托管服务§!：£CPC_texticon §R中央西北局§!\n----------------\n若您§R精力有限§!，无法顾及所有机制的运转，可点击此处启动§Y当前机制的托管服务§!，这将花费£pol_power §Y10§!政治点数。\n若已经开启§Y托管功能§!，再次点击即可关闭，并返还£pol_power §Y10§!政治点数。若您选择§Y关闭托管服务§!，最快将于下一次托管效果生效后关闭。\n本机制不再可用时，托管服务亦会自动关闭。\n----------------\n当前机制托管效果：\n§Y每20天§!随机选取地区进行§Y六大任务§!，将在执行六大任务时§R扣除§!一定£pol_power §Y政治点数§!，具体数值为§Y5/党员供需百分比§!。\n\n若所有地区§Y六大任务§!都已§G完成§!，则§R自动关闭§!本托管服务，不返还先前的£pol_power §Y政治点数§!。\n\n§Y党员数目§!需要玩家§Y手动调配§!，§R不属于§!本托管服务范畴。"
 TER_hosting_service_SWB_tt: "§Y托管服务§!：£CPC_texticon §R西南局§!\n----------------\n若您§R精力有限§!，无法顾及所有机制的运转，可点击此处启动§Y当前机制的托管服务§!，这将花费£pol_power §Y10§!政治点数。\n若已经开启§Y托管功能§!，再次点击即可关闭，并返还£pol_power §Y10§!政治点数。若您选择§Y关闭托管服务§!，最快将于下一次托管效果生效后关闭。\n本机制不再可用时，托管服务亦会自动关闭。\n----------------\n当前机制托管效果：\n£pol_power §Y政治点数§!大于§Y20§!点时，随机选取§Y工作方针§!，否则§R不产生任何效果§!。\n\n城市及矿点的§Y发展模式§!需要玩家§Y手动调整§!，§R不属于§!本托管服务范畴。"
 TER_hosting_service_XJB_tt: "§Y托管服务§!：£CPC_texticon §R新疆局§!\n----------------\n若您§R精力有限§!，无法顾及所有机制的运转，可点击此处启动§Y当前机制的托管服务§!，这将花费£pol_power §Y10§!政治点数。\n若已经开启§Y托管功能§!，再次点击即可关闭，并返还£pol_power §Y10§!政治点数。若您选择§Y关闭托管服务§!，最快将于下一次托管效果生效后关闭。\n本机制不再可用时，托管服务亦会自动关闭。\n----------------\n当前机制托管效果：\n§Y工作能力点数§!满足要求时，随机选取§Y焦点卡片§!，否则§R不产生任何效果§!。\n\n§Y工作能力点数§!满足要求时，§Y焦点政策§!启动时，将随机抽取地区进行§Y次级焦点§!政策，否则§R不产生任何效果§!。"
 TER_hosting_service_SCB_tt: "§Y托管服务§!：£CPC_texticon §R华南局§!\n----------------\n若您§R精力有限§!，无法顾及所有机制的运转，可点击此处启动§Y当前机制的托管服务§!，这将花费£pol_power §Y10§!政治点数。\n若已经开启§Y托管功能§!，再次点击即可关闭，并返还£pol_power §Y10§!政治点数。若您选择§Y关闭托管服务§!，最快将于下一次托管效果生效后关闭。\n本机制不再可用时，托管服务亦会自动关闭。\n----------------\n当前机制托管效果：\n由于本机制较特殊，仍由§C玩家§!手动选择§Y通航地区§!和手动开启§x东南亚起义§!。\n在开启托管时，§Y所有通航地区§!将在可用时自动§Y降低日本警觉§!。"


