 NCCPC_budget_mechanic_desc: "§G党务经费§!\n--------------------\n每年初，我党将依据§Y上一年§!决定的§G党务经费预算§!从财政系统划拨相应份额以§Y维持党组织正常运转§!，并将§Y上一年§!的党务预算结余归入国库作为§Y准备金§!使用。如果年内不修改§Y下一年§!党务预算，则党务预算划拨份额§Y维持不变§!。\n\n每月，§Y一定数额§!（具体数目为§G党员数目§!的1/2）的经费将从预算中扣除，作为§Y日常党务必要开销§!；同时，§G党务经费预算§!还可用于进行党内政治操作以§Y修改派系占比§!。\n\n每年末，将依据经费结余对党内工作进行评估，若党务经费结余占当年预算额的10%-50%，判定本年度党务健康，将在下一年给予相应增益，在10%-50%区间以外则有随机惩罚，该部分奖惩通过国家精神§Y政策之舞§!表现。\n\n若要在此处查看§G党员规模§!相关细节，请点击下方按钮§Y切换图表§!。"
 NCCPC_pop_mechanic_desc: "§G党员规模§!\n--------------------\n我党每月的§Y党员数目§!将存在§Y总体趋势增加，服从二项分布规律§!的随机变动。\n\n随着我党在解放中国的事业上取得进展，§Y党员数目§!的总体增长趋势将越发明显，越多的§Y党员数目§!意味着每月的§Y日常党务必要开销§!将越高昂，请谨慎决定下一年度§G党务经费预算§!！\n\n若要在此处查看§G党务经费§!相关细节，请点击下方按钮§Y切换图表§!。"
