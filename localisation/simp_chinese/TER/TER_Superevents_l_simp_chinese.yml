SE_SOUTHWESTERN_CHINA_WAR: "西南战争"
TNO_SE_SOUTHWESTERN_CHINA_WAR: "西南战争"
SE_SOUTHWESTERN_CHINA_WAR_D: "苟活者在淡红的血色中，会依稀看见微茫的希望；\n真的猛士，将更奋然而前行。\n——鲁迅"
SE_SOUTHWESTERN_CHINA_WAR_A: "天日昭昭，天日昭昭！"

SE_TRCW: "东亚大革命"
TNO_SE_TRCW: "东亚大革命"
SE_TRCW_D: "得道者多助，失道者寡助。\n——《孟子》"
SE_TRCW_A: "白日落地，红旗升起。"

SE_TRCW_good: "东亚大革命"
TNO_SE_TRCW_good: "东亚大革命"
SE_TRCW_good_D: "朝闻道，夕死可矣。\n——孔子"
SE_TRCW_good_A: "白日落地，红旗升起。"

SE_TRCW_bad: "东亚大革命"
TNO_SE_TRCW_bad: "东亚大革命"
SE_TRCW_bad_D: "性自命出，命自天降。\n——孔子"
SE_TRCW_bad_A: "白日落地，红旗升起。"

SE_TER_WE_HAVE_GOTTEN_THE_NUKE: "“秋小姐”"
TNO_SE_TER_WE_HAVE_GOTTEN_THE_NUKE: "“秋小姐”"
SE_TER_WE_HAVE_GOTTEN_THE_NUKE_D: "北方有佳人，绝世而独立。\n一顾倾人城，再顾倾人国。\n宁不知倾城与倾国，佳人再难得。\n——李延年"
SE_TER_WE_HAVE_GOTTEN_THE_NUKE_A: "腾空而起"

SE_CHINA_REUNIFIED_GOOD: "东亚新生"
TNO_SE_CHINA_REUNIFIED_GOOD: "东亚新生"
SE_CHINA_REUNIFIED_GOOD_D: "无穷尽的人流，鲜艳夺目的旗帜，嘶哑而又悲壮的口号，继续沸腾在古老的故都街头和上空，雄健的步伐也继续在不停地前进——不停地前进……\n——杨沫"
SE_CHINA_REUNIFIED_GOOD_A: "浴火重生。"

SE_CHINA_REUNIFIED_NORMAL_MAO: "东亚重生"
TNO_SE_CHINA_REUNIFIED_NORMAL_MAO: "东亚重生"
SE_CHINA_REUNIFIED_NORMAL_MAO_D: "他被人群遮住了，可是又看见了，我好像永远看见他精灵消瘦的身子在人群中隐现，他用他那微微闪烁的，带着一些潮湿的眼睛，抚摸着很多人。\n——丁玲"
SE_CHINA_REUNIFIED_NORMAL_MAO_A: "浴火重生。"

SE_CHINA_REUNIFIED_NORMAL_LIU: "东亚重生"
TNO_SE_CHINA_REUNIFIED_NORMAL_LIU: "东亚重生"
SE_CHINA_REUNIFIED_NORMAL_LIU_D: "无数金星闪闪的红旗，在眼前招展回旋，渐渐溶成一片光亮的鲜红……他的嘴角微微一动，朝着胜利的旗海，最后微笑了。\n——罗广斌，杨益言"
SE_CHINA_REUNIFIED_NORMAL_LIU_A: "浴火重生。"

SE_CHINA_REUNIFIED_BAD: "东亚永生"
TNO_SE_CHINA_REUNIFIED_BAD: "东亚永生"
SE_CHINA_REUNIFIED_BAD_D: "每次看到这空车驶过，禁不住目送它远去。这车究竟载什么才好，我从未想过。\n——森鸥外"
SE_CHINA_REUNIFIED_BAD_A: "浴火重生。"

SE_TER_RGOC_WIN: "东亚歧途"
TNO_SE_TER_RGOC_WIN: "东亚歧途"
SE_TER_RGOC_WIN_D: "沽之哉，沽之哉！我待贾者也。\n——孔子"
SE_TER_RGOC_WIN_A: "道阻且长。"

SE_CHINA_COLLAPSED: "东亚长眠"
TNO_SE_CHINA_REUNIFIED_BAD: "东亚长眠"
SE_CHINA_COLLAPSED_D: "皇帝之德，存定四极。诛乱除害，兴利致福。\n——秦琅琊刻石"
SE_CHINA_COLLAPSED_A: "千秋雪，何日晞？"

SE_CHINA_IS_IN_HELL: "东亚烬灭"
TNO_SE_CHINA_IS_IN_HELL: "东亚烬灭"
SE_CHINA_IS_IN_HELL_D: "花非花，雾非雾。夜半来，天明去。\n来如春梦不多时，去似朝云无觅处。\n——白居易"
SE_CHINA_IS_IN_HELL_A: "千秋雪，何日晞？"