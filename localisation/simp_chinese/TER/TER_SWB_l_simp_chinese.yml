city_state_consumer_tt: "§G民事生产模式§!\n--------------------\n§G当地发展度§!每月§G增加3%§!\n\n§Y每座城市§!依据其§G当地发展度§!将产生§YGDP增长率§!、§Y医保社会发展水平§!、§Y消费品产出§!等增益，详情请查看国家精神§Y中国共产党-西南局§!。\n\n所有目前已控制的§Y城市§!都将依据其§R军事化程度§!产生不同增益，详情请查看国家精神§Y中国人民解放军-西南兵团§!"
city_state_weapon_tt: "§R军事生产模式§!\n--------------------\n§G当地发展度§!每月§G增加0.5%§!\n§R当地军事化度§!每月§G增加2.5%§!\n\n每座城市依据§G当地发展度§!都将为国防阵线带来£tt_prod_unit §G额外生产单位§!、§Y工业专业知识§!、§Y工业设备§!等增益。\n\n所有目前已控制的§Y城市§!都将依据其§R军事化程度§!产生不同增益，详情请查看国家精神§Y中国人民解放军-西南兵团§!"

mine_state_mine_tt: "§T侧重采掘§!\n--------------------\n除§L康南行政督查区§!外：\n§G当地发展度§!每月§G增加1.5%§!\n§R当地军事化度§!每月§G增加1.5%§!\n\n采取本策略的§Y矿点§!依据其§G当地发展度§!将产生§Y工业专业知识§!、§Y工业设备§!、§Y资源开采率§!等增益，详情请查看国家精神§Y中国共产党-西南局§!。\n\n所有目前已控制的§Y矿点§!都将依据其§R军事化程度§!产生不同增益，详情请查看国家精神§Y中国人民解放军-西南兵团§!"
mine_state_trade_tt: "§G侧重贸易§!\n--------------------\n除§L康南行政督查区§!外：\n§G当地发展度§!每月§G增加1.5%§!\n§R当地军事化度§!每月§G增加1.5%§!\n\n采取本策略的§Y矿点§!依据其§G当地发展度§!将产生§YGDP增长率§!、§Y消费品产出§!、§Y资源开采率§!等增益，详情请查看国家精神§Y中国共产党-西南局§!。\n\n所有目前已控制的§Y矿点§!都将依据其§R军事化程度§!产生不同增益，详情请查看国家精神§Y中国人民解放军-西南兵团§!"
