CPC_SWB_entry_tt: "点击打开£CPC_texticon §R中国共产党-西南局§!GUI"
TER_SWB_map_Pan_Zhihua_tt: "康南行政督察区"
TER_SWB_map_Pan_Zhihua_tt_delayed: "§R康南行政督察区§!，民国时称§Y西康省第三行政督察区§!，由§Y盐边、宁南、西昌§!三县合并而成，矿产资源丰富，人员聚落密集，是国防阵线重要的金属、盐煤产地。\n\n因该地区矿脉集中分布于§G攀枝花村§!周围，中央指示，在未来五到八年内，§R康南行政督察区§!要尽可能以§G攀枝花§!为中心，尽快建立一批矿业城镇，带动和辐射当地矿业工业迅猛增长，§G缓解阵线用矿困难§!。\n\n矿藏种类：§g铁§!、§L盐§!、§s锡§!、§d镍§!、§q铅锌§!、§r铜§!、§R磷§!"
Li_Fuchun_tt: "§Y李富春§!\n--------------------\n£CPC_texticon §R中国共产党西南局§!第一书记\n£TER_texticon_PLA §R中国人民解放军§!西南兵团政治委员\n§G毛泽东思想§!\n--------------------\n李富春，湖南长沙人，目前任中国共产党西南局第一书记，西南局是中国共产党派驻至西康的地方局机构，主要负责统战川康旧国民党军阀、指导川康工农业发展等任务。\n\n李富春代表§Y西南局工作重心§!的§G民政§!一侧，适当偏向§G民政重心§!有助于西南地区§G工农业生产§!，增强国防阵线的§G经济实力§!。"
Han_Xianchu_tt: "§Y韩先楚§!\n--------------------\n£TER_texticon_PLA §R中国人民解放军§!西南兵团司令员\n£CPC_texticon §R中国共产党西南局§!书记\n§R军政共产主义§!\n--------------------\n韩先楚，湖北黄安人，目前任中国人民解放军西南兵团司令员，该兵团目前驻屯于川康一带，职责重大，负责国防阵线南部防务安全。\n\n韩先楚代表§Y西南局工作重心§!的§R军政§!一侧，适当偏向§R军政重心§!有助于西南地区抵御§R伪民国及其走狗政权§!的骚扰，增强国防阵线的§R军事实力§！。"
Xinan_strategy_title: "毛主席语录"
Xinan_strategy_tt: "§G艰苦奋斗\n自力更生§!\n\n§R大干十年\n解放全国§!"
TER_SWB_generic_info: "£CPC_texticon §R中国共产党-西南局§!\n\n§Y西南局工作方针§!\n-在本界面右上部分，西南局根据重心地区不同，将以§y西康§!、§G四川§!、§R重庆§!、§V川东§!四地区为重心施展§Y工作方针§!，不同§Y工作方针§!都可为西南局解锁不同§Y对应国策分支§!。\n\n§L城市-矿点发展概况§!\n-本界面左上部分可以切换§L地图模式§!为§L矿点地图模式§!或§L城镇地图模式§!，在不同模式下，川康地区有不同§L重要地点§!可供查看，每个地点有其对应的§G发展程度§!及§R军事化度§!，及对应的§Y生产模式§!可供切换。\n\n£CPC_texticon §R中国共产党-西南局§!对党和阵线的贡献将通过国家精神§Y西南局工作重心§!、§Y中国共产党-西南局§!及§Y中国人民解放军-西南兵团§!直观呈现。"
