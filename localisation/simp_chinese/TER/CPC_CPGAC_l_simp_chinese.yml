#辅助事件
CPC_CPGAC.0.t: "序曲"
CPC_CPGAC.0.d: "一九六二年元月一日，一个看似平常的冬日，蒙蒙雨丝夹杂着雪花，纷纷淋淋地洒落大地，往往还未落地就已经消失得无影无踪。时节已近大寒，黄土高原严寒而漫长的冬天看来即将过去，但离那真正温暖明媚的春天还远远没有到来。\n\n一九四七年，在吞噬了数千万生灵后，大东亚战争以日本胜利而告终。旭日在西太平洋海面上升起，血色光芒焚尽了那些埋藏在帝国野望之下的皑皑白骨。在中国西北辽阔沧桑的土地上，仍有一面象征希望的红旗迎着西风巍然耸立，由中国共产党组建的国防阵线坚守捍卫着最后一片自由之土。\n\n时间如白驹过隙，四分五裂的中国在黑暗中转眼度过十四个寒冬——蓄谋已久的青海军阀马继援打出“救国军”的旗号，撕毁统战协约，突袭兰州，引爆了西北五省内战；蒙古草原上残留着三个政权，为着各自的长生天奋起搏杀；天山南北，易改颜色；雪域佛国，难掩凡心；在日本刺刀下苟且偷生的民国总统宣布中国未来要达成五个现代化目标；广东商人为新一年的利润指数正在积极路演；满洲国皇帝在新年演讲中敬祝水泥碉堡间的臣民“新年快乐”。\n\n中国人失掉自信力了吗？\n\n我们有并不失掉自信力的中国人在。\n\n总会有一些或大或小的人物，褪去喧嚣与繁华，为了或高尚或卑微的梦想，在聚光灯注视不到的暗幕中，演绎出独属于他们的故事。"
CPC_CPGAC.0.o: "世界不是压迫者的，应是我们的。"
CPC_CPGAC.1.t: "开幕"
CPC_CPGAC.1.d: "大寒时节乌云密布，冻雨夹着冰雹抛向大地，冻得人直打牙颤，防不胜防。\n\n著名作家丁玲，同时也是政务委员会代表，将湿漉漉的雨衣脱下交给工作人员，而后向会议厅稳稳走去。几年前，这里挂满了“打倒反党分子丁玲”的横幅。还有一群精神亢奋的同行，在他们集体表决开除丁玲文联主席后，也被相继打倒。三年蹉跎一晃而过，丁玲再次被起复。她不记恨党，所有怨气都化作一声感慨：世道为何变得这样快？\n\n路上所见都是兀自哀叹的人，他们哀叹的原因再清楚不过：马家军暴起叛乱，自称“救国军”，扬言要消灭西北国防阵线。现在前线作战失利，叛军兵锋直抵兰州城下。此情此景，丁玲没有过多忧虑，只是更想听听大伙都在说些什么，观测一下政治风向。假装路过一个聚众聊天的三人小团体，她听到如下交谈——\n“听说了吧，马继援又叫共产党叛匪了。”\n“被日本人叫了好几年，不稀奇。”\n“马家军到底为什么叛乱？”\n“那还不是因为大……”\n就在某些惊世之语将被讲出时，另外二人无不报之惊恐的目光。这位大胆的代表闭了嘴，转而说：“就是国民党真的要完了。”\n“国民党早该完了。”\n\n丁玲感觉没有什么好在意的。大会还有十分钟开始，她找到自己的座位坐下，平静注视着主席台，聚精会神等待新会议开幕。很快，会场安静了下来，主席台上陆续坐满了国防阵线的党政军要员，政务委员会总理周恩来与政务委员会主任邓小平，面色凝重地宣布："
CPC_CPGAC.1.o: "“现在召开政务委员会紧急会议。” "
CPC_CPGAC.2.t: "总理病倒！"
CPC_CPGAC.2.d: "长期在政务委员会的繁重工作显然严重损害了总理的健康，中央已经批准了总理为期三个月的病假，接下来三个月内总理将不能过问政务委员会事务！"
CPC_CPGAC.2.o: "注意休息。"
CPC_main_story_events_TT.86: "总理已经住院，将暂时禁用£CPGAC_texture_loc §G中央人民政务委员会§!的所有§Y总理相关职权§!。"
PM_health_0_punish: "总理正在休病假。"
CS_patience_0_punish: "主任正在反省错误。"
GAC_biggest_punish: "政务委员会已经停摆。"
CPC_CPGAC.3.t: "主任贿选！"
CPC_CPGAC.3.d: "频繁在政务委员会暗中操弄选票毫无疑问是不合我们的民主规定的，此事已严重惹恼了中央，中央决定给予主任处分，接下来三个月内主任将不能过问政务委员会事务！"
CPC_CPGAC.3.o: "小心犯错。"
CPC_CPGAC.4.t: "政务委员会停摆！"
CPC_CPGAC.4.d: "由于目前总理及主任在政务委员会中均不能发挥职权，政务委员会已无法维持其基本职能，经中央研究，决定暂停政务委员会活动，为期三个月，即日起执行。"
CPC_CPGAC.4.o: "完了，闯祸了……"
CPC_CPGAC.5.t: "政务委员会恢复运转"
CPC_CPGAC.5.d: "总理和主任已能回到岗位继续工作，政务委员会目前已经恢复运转。"
CPC_CPGAC.5.o: "下次小心。"
CPC_CPGAC.6.t: "总理康复"
CPC_CPGAC.6.d: "总理已能回到岗位继续工作，即日起总理可重新在政务委员会中发挥作用。"
CPC_CPGAC.6.o: "注意休息。"
PM_Zhou_retire_flag: "制作组注：该事件为机制事件，检测到§Y目前剧情§!中§Y周恩来总理§!仍在住院，因此，£CPGAC_texture_loc §G中央人民政务委员会§!的所有§Y总理相关职权§!仍然保持禁用。"
CPC_CPGAC.7.t: "主任回岗"
CPC_CPGAC.7.d: "主任已能回到岗位继续工作，即日起主任可重新在政务委员会中发挥作用。"
CPC_CPGAC.7.o: "小心犯错。"
### Joyful
CPC_LB_GM.1.t: "林彪上山"
CPC_LB_GM.1.d: "一片热烈的掌声中，几名中央常委缓缓走进会堂，并按照座次缓缓坐下。议案投票还没有正式开始，欢迎仪式完成后代表们互相说说笑笑，分享近来的所见所闻，十分融洽。但主席台上气氛却有些异样。\n\n朱德费力地攥住拐杖，一扭一扭走到本应是自己的座位前，抬头却发现走过了一个座位，以往他应该坐在毛泽东旁边，今天却没名牌。薄一波看到了位次变化，可不敢擅自挪动，只能先把朱德搀回新座位。刘少奇没注意身后，他像往常一样坐在椅子上打眼向下扫视，心里犯嘀咕：台下怎么坐着这么多穿军装的代表？到这他往主席台上左右一看，心里更糊涂了：毛主席没上来，右边怎么空出两个座位？\n\n时间一分一秒过去，距离会议正式开始已经过去十五分钟了，毛主席依然没出现。迟到总能制造紧张不安的气氛，场下代表由肃静变得窃窃私语。等不到毛泽东，刘少奇也不好维持秩序，就在座位上一动不动，被头顶的大灯默默炙烤。\n\n忽然，代表们呼啦啦地全体起立，热烈的掌声再一次出现，毛主席出场了！他迈着不太稳健的步伐微笑挥手致意，接受众人的欢迎。他的身后跟着一位浑身草绿色军装的小矮子，两手放在胸前微微鼓着掌，脸上似笑似不笑，向代表们不住地点头。就在他点头时，场下瞬间爆发出震透耳膜的口号声：“毛主席万岁！”林彪上场了，更令刘少奇诧异的是不速之客林彪理所当然地坐在毛泽东身边，成了第三位。不过大伙来不及反应了，讲台上周恩来宣布议案投票正式开始，掌声再次埋没了满腹狐疑。"
CPC_LB_GM.1.o: "投票结果是通过！"
CPC_LB_GM.2.t: "林彪再次上山"
CPC_LB_GM.2.d: "林彪跟在[CPC.GetLeader]身后第二次来到了投票现场，大家已经心知肚明他的到来意味着什么，乖乖地朝票箱里塞上了赞成票。除了[CPC.GetLeader]本人，代表们的笑容都十分僵硬，越走到台前嘴咧得越大，可一扭头就收回去。周恩来则把不快明明白白挂在脸上，投票到底是表态还是演戏，有没有点原则？"
CPC_LB_GM.2.o: "投票结果是通过。"
CPC_LB_GM.3.t: "林彪不想上山"
CPC_LB_GM.3.d: "“你知道我为他们几个天天在会堂里吵来吵去的家伙担了多大的风险吗？现在党内都在议论我，不止党内，军队还有各级地方政府哪个不戳我脊梁骨？说我是狗仗人势，仗势欺人。”\n\n“可毛主席刘主席他们也有难处啊，请您去也担着不是。”\n\n“照你这么说，我看党中央不是清楚得很吗？知道请我去投票就不是好事。”\n\n“那不是为了……”\n\n“我不去了，再去一次我成全党全军的罪人了。”\n\n“……”\n\n“我还告诉你，以后再有这种事，别想着找我！”"
CPC_LB_GM.3.o: "投票的结果仍然是通过。"
