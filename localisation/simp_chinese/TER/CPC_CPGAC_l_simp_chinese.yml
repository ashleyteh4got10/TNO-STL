CPGAC_faction_rep_Mao_p1: "康生、林彪"
CPGAC_faction_rep_Mao_p2: "刘建勋、纪登奎"
CPGAC_prop_option_in_party_0_desc: "§G毛派§!在£CPGAC_texture_loc §G政务委员会§!的代表：§Y[CPGAC_faction_rep_Mao]§!\n---------------------------\n§G毛派§!通常为支持毛泽东主张或受毛泽东信赖重用的党内干部群体，也是§x中国共产党§!内规模最大的山头之一，在§G西北出身的中高层干部§!及§R军队§!中拥有巨大号召力，但就目前而言，§G毛派§!似乎缺乏相对严密的组织关系，在政治事务中常常无法形成合力。\n\n§G毛派§!的施政纲领通常与毛泽东个人大开大合的行事风格相符，尤以§S社会主义改造时期§!的各项激进政策为最，但需要注意的是，§G毛派§!并不能完全等同于毛泽东本人的政治意志——事实上，§G毛派§!并非总是一副激昂慨然无所畏惧的浪漫主义者的模样：庞大的§G西北干部群体§!中，一批§G新生代§!正逐渐在毛泽东的保护下以更成熟的政治姿态投入根据地建设。相较老一辈，他们的身段大多更加灵活，也更受基层干部群众的欢迎——但他们的目标却十分坚定：完成§G毛主席§!的嘱托，推动掀起整个根据地……或是全中国的§x社会主义高潮§!。"
CPGAC_prop_option_in_party_1: "§m刘派§!"
CPGAC_faction_rep_Liu_p1: "薄一波、安子文"
CPGAC_faction_rep_Liu_p2: "赵明新、林枫"
CPGAC_prop_option_in_party_1_desc: "§m刘派§!在£CPGAC_texture_loc §G政务委员会§!的代表：§Y[CPGAC_faction_rep_Liu]§!\n---------------------------\n§m刘派§!通常为支持刘少奇主张或受刘少奇信赖重用的党内干部群体，也是§x中国共产党§!内规模最大的山头之一。其成员大多和刘少奇在§m白区敌后工作§!时期有直接或间接隶属关系，不少壮年干部已经跻身§x党的中央委员会§!，因此在一些非正式场合的私下谈论中这些人也被称为§m白区派§!或§m中央派§!。\n\n§m刘派§!的施政纲领和刘少奇个人相对温和的政治经济主张相符，在§G大跃进§!后因经济恢复和政治稳定需求而迅速崛起。\n\n与§m刘派§!本身相对温和的政治经济主张不同，为了实现其主张，§m刘派§!干部所使用的行政手段往往是§Y强硬§!的。在一些第三者的眼中，这样的行政作风使得§m刘派§!的总体形象与过去的§G毛派§!渐渐重合了起来……"
CPGAC_prop_option_in_party_2: "§R[TER_CPGAC_faction_name_sov]§!"
CPGAC_prop_option_in_party_2_desc: "[CPGAC_prop_option_in_party_2_desc]"
CPGAC_prop_option_in_party_2_desc_sov: "§R国际派§!在£CPGAC_texture_loc §G政务委员会§!的代表：§Y张闻天§!\n---------------------------\n作为一个已经几近退场的派别，§R国际派§!曾在党史上有过一段轰轰烈烈呼风唤雨的时期：忠于共产国际指示的张闻天、王明、博古等人都以不同方式短暂问鼎过这支革命队伍的最高权力——但在那些更熟悉中国现状的人面前，他们满腹的经纶教条反而成为了§R国际派§!走向没落的死穴。\n\n如今的§R国际派§!远不能称得上是什么像样的派系，反而更像是历次党内政治运动中预设好的“靶子”，若非§m刘少奇§!出于拉拢政治盟友的需要而把§R他们§!绑定在自己的周边，只怕§R国际派§!一词早已成为档案馆中尘封的铅字。\n\n就算内心对§m刘派§!的“修正主义政策”如何不满，眼下的§R国际派§!也无力再起身驳斥，只能在政务决策中投出默不作声的赞成票。"
CPGAC_prop_option_in_party_2_desc_pop: "§R大众派§!在£CPGAC_texture_loc §G政务委员会§!的代表：§Y胡绩伟§!\n---------------------------\n这是一个新兴的派别，肇始于周扬为§x中国共产党§!奠定的§R文艺战线基础§!，九大后随着党内老一辈革命家相继退休，§R大众派§!逐渐进入高层视野。\n\n§R大众派§!远非什么能执掌神器的派系，其主要议题几乎集中在文化建设上，几乎完全是当前总路线的§Y附属品§!。\n\n尽管名字里带着“大众”，§R大众派§!却始终只是几个党报编辑文人的清谈沙龙。不过，§m刘派§!对§R大众派§!抱有一定兴趣——或许这会成为§m他们§!在文化宣传阵地上的助力……"
CPGAC_prop_option_in_party_3: "§Y书记派§!"
CPGAC_prop_option_in_party_3_desc: "§Y书记派§!在£CPGAC_texture_loc §G政务委员会§!的代表：§Y陈云§!\n---------------------------\n§Y书记派§!的规模不大，但是职权却很高：能被称为§Y书记派§!的党内干部几乎无一例外，都是围绕在§x中共中央书记处总书记§!邓小平周围的中央高级干部。\n\n而邓小平本人，则是毛泽东拣选来挽救大跃进严重后果的重要助手，同中央那些强调§x“路线方向”§!的传统毛派干部不同，邓小平并不在意自己的经济主张，用他自己的话来说：§Y“不管黑猫白猫，捉住老鼠就是好猫。”§!\n\n有相当多的人对邓小平的§x党性觉悟§!颇有微词，但毛泽东事实上还是默许了他的补救措施，并许以他§G中央书记处总书记§!和§G中央人民政务委员会主任§!的要职来辅助自己管理日常党务政务。\n\n或许，单单从党内山头分野的角度将整个§Y书记派§!看成§G毛派§!的异端分支，似乎并无不可。"
CPGAC_prop_option_faction_from_DEM: "§C民主党派§!"
CPGAC_prop_option_faction_from_DEM_desc: "§C民主党派§!在£CPGAC_texture_loc §G政务委员会§!的代表：§Y[CPGAC_faction_rep_dem]§!\n---------------------------\n§C民主党派§!由共产党外其他的参政党组成，在§G第三次£GNG_chinese_nation_texticon §m国§!£CPC_texticon §x共§!合作§!的背景下，£CPC_texticon §x共产党§!与£GNG_chinese_nation_texticon §m西北国民党§!在西安共同签署§m《中国国防§!§x阵线纲领》§!，组建§m抗日§!§x联合政府§!，各党派在§G新民主主义革命§!的宗旨下，积极参与£CPGAC_texture_loc §G人民政府§!的工作，为推动抗日解放事业与建设根据地发挥了重要作用。\n\n由于§G50年代末到60年代初的动荡分裂§!，£GNG_chinese_nation_texticon §m国民党§!实际上已经背叛了§x中国革命§!，被§m阵§!§x线§!取缔。原£GNG_chinese_nation_texticon §m国民党§!内§C左翼人士§!带头组建新的§z中国民主§!§C革命同盟§!，与§s新中华民主同盟§!共同作为目前民主党派的代表。\n\n就其政治主张而言，§C民主党派§!并非单一阶级的政党，而是带有§C阶级联盟§!性质的组织，在政治态度上存在§C左§!、§Y中§!、§s右§!的政治分野。其政治主张与中国共产党§G新民主主义革命的政治纲领§!基本一致。"
CPGAC_faction_rep_dem_p1: "梁漱溟、章乃器"
CPGAC_faction_rep_dem_p2: "章乃器、谢婉莹"
CPGAC_prop_option_faction_from_LIB: "§m无党派人士§!"
CPGAC_prop_option_faction_from_LIB_desc: "§m无党派人士§!在£CPGAC_texture_loc §G政务委员会§!的代表：§Y[CPGAC_faction_rep_lib]§!\n---------------------------\n§m无党派人士§!是对那些没有参与任何党派组织又具备§m民主运动§!历史，拥有社会影响的知名人士的统称，其以§m知识分子§!和§x少数工农代表§!为主体。\n\n他们具有一定的社会号召力，普遍教育良好，素质优秀，为社会发挥积极独特的贡献，其人脉广泛分布于各行各业，为£CPGAC_texture_loc §G人民政府§!的施政方针建言献策是他们的主要工作。\n\n1947年重庆投降后，大后方滞留的无党派人士在§x党组织§!的协助下转移到§Y西安§!，参加£CPGAC_texture_loc §G政务委员会§!的组建，并由其中§m知名代表人物§!参与政府工作。"
CPGAC_faction_rep_lib_p1: "顾颉刚、许烺光"
CPGAC_faction_rep_lib_p2: "许烺光、吴景超"
CPGAC_op_execute_faction_NONE: "§Y暂无执行中的政策§!"
CPGAC_op_execute_faction_CPC: "§x中国共产党§!"
