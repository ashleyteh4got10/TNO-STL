CPGAC_u_field_investigation_movement: "查田运动"
CPGAC_u_field_investigation_movement_desc: "根据地刚刚度过最危险的时期，我们重新掌控了中国西部数百万平方公里的广袤土地。尽管如此，适宜耕作的土地却比较有限，就阵线实际控制区来看仅有河套、关中、四川三处主要粮食产地。平年还尚可维持粮食负担，然而一旦灾年到来，后果不堪设想。\n有鉴于事态严峻，中央决定立刻展开查田运动。要尽快完成下乡剿匪、清查土地、核对队社债务等重大任务，若不能及时清查土地以至于耽搁生产，我们的农业基础势必受到严重威胁。"
CPGAC_u_the_four_clean_ups_movement: "四清运动"
CPGAC_u_the_four_clean_ups_movement_desc: "在党中央毛主席的领导下，解放区农业工作成效卓著，然而在各地方公社实际建设的过程中，我们发现过去封建的农村残余的地、富、反、坏四类分子正肆无忌惮地乘着社会主义的春风做着“好风凭借力，送我上青云”的美梦。\n党和人民不会允许这样的反动分子窃取社会主义建设的伟大成果，开展农村四清运动刻不容缓，必须坚决彻底清除地、富、反、坏四类分子在地方上的影响，保护和巩固我们的基层组织。"
CPGAC_u_Su_Fan_movement: "肃反运动"
CPGAC_u_Su_Fan_movement_desc: "解放区的城市化工作十分成功，已经有一批工业城镇在解放区各地建设起来，我们的城市人口和工人数量也在稳步提高，但在最近的建设工作里面，有群众反映，城市中滋生了一批游手好闲好吃懒做的坏分子。\n党和人民不会允许这样的反动分子窃取社会主义建设的伟大成果，开展城市肃反刻不容缓，必须坚决彻底清除城市坏分子对组织的侵蚀和腐化，保护和巩固我们的城市党组织。"
CPGAC_u_recontact_NAJUA: "抗联西撤"
CPGAC_u_recontact_NAJUA_desc: "听取抗联同志报告后，中央一致认为要抓住此次来之不易的机会，与抗联建立工作关系网，必须想尽一切办法让东北同志与我们的势力范围接壤。东北边缘地区过于荒芜的环境并不适合根据地的独立生存，后续援助的唯一目标，就是打通蒙古-东北通道，让抗联能依靠阵线的支援转移至西满建立游击根据地。在此期间要落实党的纪律，绝对不能暴露行踪。\n\n最终计划是：抗联一方向满洲里以东突围，我方从乔巴山等城市向东进军，最终两军在边境会师，抗联将背靠蒙古与阵线，在西满地区建立根据地并开展游击活动。"
CPGAC_u_Force_to_go_through_the_Yellow_river: "强渡黄河"
CPGAC_u_Force_to_go_through_the_Yellow_river_desc: "在中央军委的作战计划中，强渡黄河解放山西是我们开启解放全国征程的第一步，若能迅速干脆地摧毁山西伪政权，物质上可以接收山西的能源军工产业，为解放全国事业提供有力保证；精神上对于阵线后方的胜利信心也有极大的鼓舞作用。\n毛主席指示：“对强渡黄河解放山西的准备不能按照准备一场局部战争来估计，而应该按照全面的、总体的、席卷全国的大战来准备。”这是极为正确的战略判断，我们的战斗很可能牵一发而动全身：必须将整个国防阵线乃至整个亚革盟从北到南从东到西调动起来，才能应对伪民国甚至日本帝国主义的全面反扑。"
