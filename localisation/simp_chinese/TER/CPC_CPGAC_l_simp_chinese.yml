CPGAC_prop_rebuild_ABC: "重建农业银行"
CPGAC_prop_rebuild_ABC_desc: "过去我们对§G农业社会主义改造§!的思路不够清晰，经常陷入§R操之过急过重§!的困境，打乱了农业生产规律，农民的家中常常缺粮少食，没有足够的积蓄应对可能的天灾。\n\n为了打破这一状况，中央决定重建§m农业银行§!，专门面对农民提供§Y储蓄、贷款和资助业务§!，帮助广大农民脱离困境，能够自力更生。\n\n综上，£CPGAC_texture_loc §G政务委员会§!投票同意通过£TER_texticon_liu §m重建农业银行§!的提案。"
CPGAC_prop_rebuild_ABC_effect: "将在解放区推广§Y增加农业农村贷款§!的政措。"
CPGAC_prop_rebuild_ABC_flag: "£CPGAC_texture_loc §G中央人民政务委员会§!投票表决通过了§Y重建农业银行§!的§m重大议题§!"
CPGAC_prop_rebuild_ABC_option_0: "增强中央调控"
CPGAC_prop_rebuild_ABC_option_1: "加强监管，杜绝剥削"
CPGAC_prop_rebuild_ABC_option_2: "学习现代金融经验"

CPGAC_prop_lower_food_prices: "降低粮食收购价格"
CPGAC_prop_lower_food_prices_desc: "解放区正在进行新一轮工业扩产，川康、关中等老工业区在这一时期都需要大量资金注入以获得发展动力，中央财政运转目前已濒临极限，在综合调研分析后中央决定开源节流，降低部分粮食的征购价格。\n\n综上，£CPGAC_texture_loc §G政务委员会§!投票同意通过£TER_texticon_liu §m降低粮食收购价格§!的提案。"
CPGAC_prop_lower_food_prices_effect: "未来一段时期将§Y以较低价格征购粮食§!。"
CPGAC_prop_lower_food_prices_option_0: "给予农民有限补贴"
CPGAC_prop_lower_food_prices_option_1: "从其他渠道筹资"

CPGAC_prop_increase_citizens_subsidy: "扩大城市户口补贴"
CPGAC_prop_increase_citizens_subsidy_desc: "党的既定路线是优先满足城市工业，城市产业工人群体随即扩大，为了维持城镇地区稳定，鼓励城镇产业工人生产，中央决定扩大城市户口补贴，满足人民日益增长的物质需要。\n\n综上，£CPGAC_texture_loc §G政务委员会§!投票同意通过£TER_texticon_liu §m扩大城市户口补贴§!的提案。"
CPGAC_prop_increase_citizens_subsidy_effect: "本议题的通过是国策§Y教育补贴§!及§Y监督工时标准§!开始的必要条件。"
CPGAC_prop_increase_citizens_flag: "£CPGAC_texture_loc §G中央人民政务委员会§!投票表决通过了§Y扩大城市户口补贴§!的§m重大议题§!"
CPGAC_prop_increase_citizens_subsidy_option_0: "加强城市户口甄别办理"
