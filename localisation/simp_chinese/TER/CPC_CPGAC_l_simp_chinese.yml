#界面短文本
TER_main_issue_entry_category: "三阳开泰"
TER_main_issue_entry_category_desc: "依§m《中国国防§!§x阵线纲领》§!规定，§Y[CPC.GetFlag][CPC.GetName]§!拥有一套独特的运作架构，按其组织分野可分为£CPC_texticon §R党组织§!、£CPGAC_texture_loc §G政府组织§!与£TER_texticon_PLA §Y解放军组织§!，即§R党§!§G政§!§Y军§!三大组织体系。"
CPC_dec_gui_entry_tt: "[CPC_dec_gui_entry_tt]"
enter_CPGAC_main_gui_tt_generic: "[GetEnterGACtt]"
enter_CPGAC_main_gui_tt: "点击打开£CPGAC_texture_loc §G中央人民政务委员会§!GUI"
enter_CPGAC_main_gui_CANNOT_tt: "自§R彻底停摆之日§!起，§Y90天§!内无法对£CPGAC_texture_loc §G中央人民政务委员会§!进行任何操作"
TER_CPGAC_tips: "£CPGAC_texture_loc §G中央人民政务委员会§!\n----------------------------------\n§Y立法讨论§!\n依§m《中国国防§!§x阵线纲领》§!规定，£CPGAC_texture_loc §G中央人民政务委员会§!是§G[CPC.GetName]§!的立法机构：我党与§Y党外民主人士§!在此以民主协商的方式通过并执行政府的各项政治决议。\n£CPGAC_texture_loc §G中央人民政务委员会§!内共有3个派系，分别为§x中国共产党§!、§C民主党派§!、§m无党派人士§!。依照§m《纲§!§x领》§!规定以§Y7:2:1§!的意见占比讨论和通过所有事关§m国防阵线§!§x前途命运§!之重大议题。\n所有§Y重大议题§!均由§Y国策、事件§!等方式触发，投票时长为§Y60日§!，并根据议题不同而有不同的§Y修改意见§!可供参考，在每轮重大议题投票讨论开始时，将默认选择§Y其中一个修改意见§!，此后至多更改一次§Y当前修改意见§!，也可通过委员会主任之职权额外获得变更§Y当前修改意见§!的机会，每次修改均需要花费£pol_power §Y5§!政治点数。\n----------------------------------\n§Y日常行政§!\n依§m《中国国防§!§x阵线纲领》§!规定，£CPGAC_texture_loc §G中央人民政务委员会§!是§G[CPC.GetName]§!的行政机构，在不同的发展阶段，将有不同的§Y日常政策§!可以选择执行，所有§Y日常政策§!都可以选择具体的§Y执行派系§!，其效果会有细微差别，敬请留意。"
CPGAC_confirm_yes: "确定"
TER_CPGAC_recessing: "休会中"
TER_CPGAC_recessing_red: "§R$TER_CPGAC_recessing$§!"
CPGAC_btn_hog_name: "人民政府总理"
CPGAC_add_to_PM_pressure: "§Y总理§!的压力值§R上升§!§Y1§!点。"
CPGAC_skill_PM_desc: "职权：结束表决\n§Y总理§!将直接加速当前议题§Y完成§!（包括§Y日常政策§!）。\n\n若§Y重大议题§!与§Y日常议题§!正在同时执行，则§Y优先加速重大议题§!。\n\n§R扣除§!§Y1§!点健康值。"
CPGAC_PM_gui_desc: "进入§Y总理交互界面§!/返回\n--------------------\n在这里可以看到§Y总理§!的各项指标和职权。\n\n§Y健康值§!代表着§Y总理§!当前的健康状况，过多的§Y压力值§!或是使用§Y职权§!均会导致健康值减少。\n\n§Y压力值§!代表着§Y总理§!当前的精神压力，压力值§Y每满3点§!就会导致§R健康值减少1点§!。\n\n当§Y健康值§!§R归零时§!，总理将强制获得由毛主席批准为期§Y90天§!的病假，§R此间总理不再参与政务委员会的工作。§!\n\n在总理参与日常事务时，健康值每月会§G恢复1点§!，压力值每月会§G减少1点§!。\n\n§R若总理和主任同时无法参与工作，委员会将产生为期90天的失效期，期间不允许进行任何操作，请谨慎行事！§!"
CPGAC_add_to_CS_popularity: "§Y主任§!的声望值§R上升§!§Y1§!点。"
CPGAC_skill_CS_desc: "职权：审议\n§Y主任§!将对§Y当前重大议题§!进行审议，额外获得§Y1§!次选择§Y修改意见§!的机会。\n\n§R扣除§!§Y1§!点容忍度。"
CPGAC_CS_gui_desc: "进入§Y主任进入界面§!/返回\n--------------------\n在这里可以看到§Y主任§!的各项指标和职权。\n\n§Y容忍度§!代表着当前主席对§Y主任§!的容忍度，过多的§Y声望值§!或是使用§Y职权§!均会导致容忍度减少。\n\n§Y声望值§!代表着§Y主任§!当前在代表中间的影响力，声望值§Y每满3点§!就会导致§R容忍度减少1点§!。\n\n当§Y容忍度§!§R归零时§!，主任将强制获得由主席批准为期§Y90天§!的处分，§R此间主任不再参与政务委员会的工作。§!\n\n在主任参与日常事务时，容忍度每月会§G恢复1点§!，声望值每月会§G减少1点§!。\n\n§R若总理和主任同时无法参与工作，委员会将产生为期90天的失效期，期间不允许进行任何操作，请谨慎行事！§!"
