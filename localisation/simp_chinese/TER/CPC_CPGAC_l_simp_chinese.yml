CPC_we_have_an_ongoing_proposal: "£CPGAC_texture_loc §G中央人民政务委员会§!正在投票中。"
CPGAC_begin_a_proposal_tips: "这将启动§Y[Get_CPGAC_ongoing_prop_title]§!的投票程序，默认选择§Y顺位第一的修改意见§!。\n获得§Y1§!次变更§Y修改意见§!的机会。\n获得§Y3§!次使用§Y派系特殊功能§!的机会。\n§Y所有派系§!的§G初始赞成率§!都将乘以§Y满意度§!以得出§G实际赞成率§!。\n---------------------------\n§G毛派§!初始态度：[?CPGAC_Y_attitude_in_party_tmp^0|G1]%/[?CPGAC_N_attitude_in_party_tmp^0|R1]%\n§m刘派§!初始态度：[?CPGAC_Y_attitude_in_party_tmp^1|G1]%/[?CPGAC_N_attitude_in_party_tmp^1|R1]%\n§R[TER_CPGAC_faction_name_sov]§!初始态度：[?CPGAC_Y_attitude_in_party_tmp^2|G1]%/[?CPGAC_N_attitude_in_party_tmp^2|R1]%\n§Y书记派§!初始态度：[?CPGAC_Y_attitude_in_party_tmp^3|G1]%/[?CPGAC_N_attitude_in_party_tmp^3|R1]%\n§C民主党派§!初始态度：[?CPGAC_yes_attitude_tmp^0|G1]%/[?CPGAC_no_attitude_tmp^0|R1]%\n§m无党派人士§!初始态度：[?CPGAC_yes_attitude_tmp^1|G1]%/[?CPGAC_no_attitude_tmp^1|R1]%"
