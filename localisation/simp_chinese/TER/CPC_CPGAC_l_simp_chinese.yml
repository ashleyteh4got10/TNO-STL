CPGAC_prop_foundation_of_NNPF: "§m《中国国防§!§x阵线纲领》§!"
CPGAC_prop_foundation_of_NNPF_desc: "§Y1949§!年，西部各爱国抗日政党于§Y西安§!共同签署§m《中国国防§!§x阵线纲领》§!，宣告§R统一战线§!成立，继续进行§x伟大的抗日事业§!。"
CPGAC_prop_foundation_of_NNPF_effect: "成立[CPC.GetFlag]§m中华民国§!§x国防阵线西北中央政府§!。\n开始§G第三次£GNG_chinese_nation_texticon §m国§!£CPC_texticon §x共§!合作§!。"

CPGAC_prop_rural_land_reform: "§G农村土地改革§!决议"
CPGAC_prop_rural_land_reform_desc: "§m《纲§!§x领》§!提出，§G各大根据地§!与§C爱国抗日势力§!要在§C新民主主义革命§!的旗帜下完成§R社会改造§!，首要任务是§Y摧毁农村的封建生产关系§!，建立§x集体化经济§!，£CPGAC_texture_loc §G政务委员会§!表决并通过了关于§G在农村发动土地改革运动§!的决议。"
CPGAC_prop_rural_land_reform_effect: "$improve_agriculture_medium$增加基础稳定度：§G+10.00%§!。"

CPGAC_prop_interim_capital_defense_plan: "临时首都§x国防规划§!"
CPGAC_prop_interim_capital_defense_plan_desc: "§m国防§!§x阵线§!成立之初，以§m《纲§!§x领》§!形式规定§Y西安§!为[CPC.GetFlag]§Y西北国防阵线§!的首都，因为§Y西安§!直接面临£GNG_japanese_frustration_texticon §j日伪§!的§e侵略威胁§!，迫切需要将其打造成一座§x战斗堡垒§!，为此£CPGAC_texture_loc §G政务委员会§!一致同意集中人力物力建设§Y西安§!，用最快速度将其改造为§x全副武装的要塞城市§!，以图长期§x抗日斗争§!。"
CPGAC_prop_interim_capital_defense_plan_effect: "开始§Y西安§!§x堡垒化§!建设进程。\n任命§Y张宗逊§!接替§Y习仲勋§!为§Y西安§!市长。"

CPGAC_prop_foundation_of_NADT: "组建§m国防§!§x研究院§!"
CPGAC_prop_foundation_of_NADT_desc: "£TER_texticon_NDF §R解放军§!成立后，为适应§m现代化战争§!需要，并探索§m新型战争§!与§S人民战争§!的结合形式，中央考虑组建专门的§m国防科技研究机构§!来负责钻研§m先进军事科技§!。经£CPGAC_texture_loc §G政务委员会§!听取各党派人士意见后，投票通过成立§m国防§!§x研究院§!的决定。"
CPGAC_prop_foundation_of_NADT_effect: "整合阵线§m科研力量§!组建§m国防§!§x研究院§!。\n任命总后勤部书记§Y黄克诚§!为院长。"

CPGAC_prop_5_years_plan: "§m国防§!§x阵线§!五年发展计划"
CPGAC_prop_5_years_plan_desc: "西北工业基础§R薄弱§!，发展重工业受§Y资金短细、动力不足、交通不便和人才匾乏等因素§!的栓桔，难以在短时期内见效，资本也不愿冒着风险在此投资。为建设根据地的§Y经济国防线§!，中央派出£CPC_texticon §R党政单位§!前往各大地区领导经济建设，并制订了§Y以五年为限的经济发展计划§!，力求在工农业上取得§G飞跃的成果§!，为阵线的解放事业奠定§G坚实的生产力基础§!。\n£CPGAC_texture_loc §G政务委员会§!在经党内的统一表态，并听取各党派的建议后，以绝大部分的同意票通过了五年经济发展计划的决定。"
CPGAC_prop_5_years_plan_effect: "组建£CPC_texticon §R中央西北局§!主管§Y陕甘宁青§!发展事宜。\n§Y西康省§!更名为[XIK.GetFlag]§Y西南国防阵线§!。\n派出£CPC_texticon §R西南局§!指导[XIK.GetFlag]§Y西南国防阵线§!政务发展。"

CPGAC_prop_NADT_10_years_plan: "§m国防研究§!§x十年规划§!"
CPGAC_prop_NADT_10_years_plan_desc: "§m国防研究§!§x十年规划§!的目标是通过系统性的§m国防科研投入和技术发展§!，提升西北国防阵线的§R军事科技水平§!，并带动§G民用科技水平§!进入§m现代化轨道§!，首要目的是确保在未来十年令我军具备启动§x全面现代战争§!的能力。该规划旨在推动自主研发，弥补技术差距，逐步实现§m国防§!§x现代化§!，增强军队的整体作战能力和战略威慑力。\n经£CPGAC_texture_loc §G政务委员会§!表决，通过了§m国防研究§!§x十年规划§!的决定。"
CPGAC_prop_NADT_10_years_plan_effect: "启动§m国防研究§!§x十年规划§!。"

CPGAC_prop_great_leap_forward: "§G大跃进§!决议"
CPGAC_prop_great_leap_forward_desc: "为彻底改变§G西北根据地§!的§R落后局面§!，实现§G跨越式发展§!，£CPC_texticon §R中共中央§!决定开展以§G农业§!、§m工业§!和§Y基层组织建设§!为核心的§G大跃进§!运动。要求迅速推行§G农业集体化§!、§m工商国有化改造§!，以§G多、快、好、省§!的高标准，全面加快经济建设，巩固§x社会主义制度§!。\n\n各级党组织须加强思想统一，坚决贯彻中央指示，确保目标如期实现。全党全军与广大人民群众同心协力，以大无畏的§x革命精神§!，勇夺社会主义新时期的§x伟大胜利§!。"
CPGAC_prop_great_leap_forward_effect: "掀起£TER_texticon_mao §G大跃进运动§!。"

CPGAC_prop_rightist_campaign: "§G反右§!决议"
CPGAC_prop_rightist_campaign_desc: "为了扭转宁夏解放以来政治上的§R被动局面§!，树立£CPC_texticon §x党§!的权威，应该通过§x疾风骤雨般的反击行动§!，坚决铲除阵线内一切§e反动右派分子§!。运动针对党内§m资产阶级同情者§!，§e国民党反动派§!，§C民主党派§!及其他§Y社会上层人士§!，及时揭露他们§e反共反人民反社会主义§!的真实目的。"
CPGAC_prop_rightist_campaign_effect: "宣布£GNG_chinese_nation_texticon §m中国国民党§!为§e非法政党§!，§e逐出§!§R统一战线§!。\n组建§z中国民主§!§C革命同盟§!与§s新中华民主同盟§!。"

CPGAC_prop_suppress_QIN_Ma_revolt: "镇压§m青海马家军§!叛乱"
CPGAC_prop_suppress_QIN_Ma_revolt_desc: "§e反动军阀§!§Y马继援§!原为西北地区£GNG_chinese_nation_texticon §m国民党§!军政首脑，接受统战以来拒不执行§m《纲§!§V领》§!规定，对革命建设工作§R阳奉阴违、百般阻挠§!。更兼其个人野心无限膨胀，竟于五十年代后期指使手下秘密§x杀害§!前往青海指导§G革命工作§!的£CPC_texticon §R我党干部§!§G彭真§!同志，种种罪行不胜枚举。\n[QIN.GetFlag]§Y[QIN.GetName]§!是§e反动军阀§!§Y马继援§!组建的，彻头彻尾地背叛§R统一战线§!和£GNG_chinese_nation_texticon §m国§!£CPC_texticon §x共§!合作的§e反动封建割据势力§!，应当予以§x彻底剿灭和镇压§!。\n£CPGAC_texture_loc §G政务委员会§!一致同意以最快速度集结部队，镇压§m青海马家军§!叛乱。"
CPGAC_prop_suppress_QIN_Ma_revolt_effect: "由于§Y人民救国军§!的§e敌对行为§!，现宣布§Y西北国防阵线§!与§Y人民救国军§!正式进入§R战争状态§!。"

