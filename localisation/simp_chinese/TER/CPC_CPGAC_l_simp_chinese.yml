CPGAC_prop_Mongolia_emergency_plan: "蒙古应急预案"
CPGAC_prop_Mongolia_emergency_plan_desc: "包头谈判以§R失败§!告终，蒙古拒绝了我们和平统一的任何意见并开始§R分批遣返§!驻蒙人员，甚至调集兵力驻扎边境摆出对抗姿态。\n§G和平统一§!已无希望，为避免夜长梦多，£CPGAC_texture_loc §G政务委员会§!一致同意以最快速度集结部队，§x武力统一蒙古§!。"
CPGAC_prop_Mongolia_emergency_plan_effect: "§Y西北国防阵线§!向§Y蒙古人民共和国§!宣战。"
CPGAC_prop_Mongolia_emergency_plan_option_0: "保证滞蒙人员安全"
CPGAC_prop_Mongolia_emergency_plan_option_1: "保证边界稳定"
CPGAC_prop_Mongolia_emergency_plan_option_2: "保证人民生活"
CPGAC_prop_Mongolia_emergency_plan_option_3: "强调蒙古是我国固有领土"

CPGAC_prop_party_committee_appointment_reform: "党委任免改革"
CPGAC_prop_party_committee_appointment_reform_desc: "“在过去一年里，我们党虽然积累了丰富的经验，但要使我们党今后继续保持正确的、健全的领导，根本的问题，是在于努力减少党组织和党员在思想认识上的错误。\n为什么回族群众集体围攻地方政府？为什么我们的党员被农民拒之门外？总而言之是我们自己的领导问题，如果不虚心改正，什么解释都是借口，群众不可能买你的帐。\n我们应该理解地方党委的作用，这是我们与人民群众最直接的联系，关系到我们党在人民群众中间的议论评价，也就给我们下达了认真选择党员干部任免方式的任务。”\n——§m刘少奇§!在£CPGAC_texture_loc §G政务委员会§!工作会议上的发言。"
CPGAC_prop_party_committee_appointment_reform_effect: "将决定未来§Y地方党委§!的任免方式，并解锁§Y对应国策§!。"
CPGAC_prop_PCAR_we_choose_Liu: "我们在§Y党委任免改革提案§!中采用了£TER_texticon_liu §m刘派§!的方案。"
CPGAC_prop_PCAR_we_choose_Mao: "我们在§Y党委任免改革提案§!中采用了£TER_texticon_mao §G毛派§!的方案。"
CPGAC_prop_party_committee_appointment_reform_option_0: "中央指定"
CPGAC_prop_party_committee_appointment_reform_option_1: "地方推举"

CPGAC_prop_liberate_Sichuan: "保卫§Y西康§!，解放§Y川渝§!"
CPGAC_prop_liberate_Sichuan_desc: "毛主席指示：“革命和革命战争是不可避免的，舍此不能完成社会发展的飞跃，不能推翻反动的统治阶级。”我们不能只把目光放在解放区以内，要看到国内形势和国际形势，根据形势变化，充分发挥人们的§G革命积极性§!，主动发起§G革命战争§!。\n\n经过艰苦卓绝的拼搏与奋斗，§G解放区§!已经§G摆脱困境§!，各项发展更上一层楼。而§R白区§!则深陷§R经济危机§!，民众处于水火之中，这对我们来说是一次难逢的机会，不能让新一轮革命高潮白白流失。因此，£CPGAC_texture_loc §G政务委员会§!决定向反革命最薄弱的地方推进，解救正在被反动势力围攻的刘文辉。"
CPGAC_prop_liberate_Sichuan_effect: "四川§R战火重燃§!之时，我们可以按§Y已决定的方案§!支援我们的§G盟友§!。"
CPC_YEAH_WE_CHOOSE_TO_FUCK_SIC: "我们将直接参与§Y解放川渝§!的战斗。"
CPGAC_prop_liberate_Sichuan_option_0: "不能让反动派得逞"
CPGAC_prop_liberate_Sichuan_option_1: "帮人帮到底，送佛送到西"
CPGAC_prop_liberate_Sichuan_option_2: "我们对开战有顾虑"

CPGAC_prop_rural_commsearization: "加快农村集体化"
CPGAC_prop_rural_commsearization_desc: "八大以前§x解放区§!的范围不大，§Y新疆§!、§G内蒙§!、§f四川§!等地都未解放，我们的§G农业工作§!在当时§f贫瘠干燥的西北高原§!难以为继，§R过激过重的集体化§!反而令解放区农业陷入了§R最低谷§!。\n\n随着根据地工作取得喜人进展，中央集体认为，§G加快农业集体化§!将成为该时期的重要工作：农业集体化是§S社会主义农业§!的本质特征，£TER_texticon_mao §G人民公社§!的集体化思路并没有显著漏洞，有了当初的历史教训，我们认为现在我们有经验也有能力稳健有效地实行集体化改造，£TER_texticon_mao §G人民公社§!将发挥出我们设想的巨大作用。"
CPGAC_prop_rural_commsearization_effect: "我们将加快推进£TER_texticon_mao §G农业集体化§!。"
CPGAC_prop_rural_commsearization_option_0: "加快大社合并"
CPGAC_prop_rural_commsearization_option_1: "重点巩固低级社"
CPGAC_prop_rural_commsearization_option_2: "提高统购粮价"
CPGAC_prop_rural_commsearization_option_3: "农贸市场也有可取之处"

CPGAC_prop_state_monopoly_of_purchasing_and_marketing: "提高粮食征购指标"
CPGAC_prop_state_monopoly_of_purchasing_and_marketing_desc: "步入六十年代中期，§x解放区§!总体上§G风调雨顺§!，农作物长势喜人，产量较之六十年代初期有了§G巨大的增长§!，地方上许多公社的粮食产量增长都有§G百分之五十§!以上，部分公社甚至达到了§G翻倍，翻几倍§!的产粮目标。\n\n由于新近解放的§x解放区§!面积广大，£CPGAC_texture_loc §G政府部门和职能§!也在深化和扩大，£TER_texticon_mao §G党中央§!和£CPGAC_texture_loc §G政务院§!在慎重考虑后决定，在不破坏解放区农民群众的生产生活的前提下，§Y提高§!每年征购粮食的指标，以适应目前接近半个中国解放区的政府工作的需要。"
CPGAC_prop_state_monopoly_of_purchasing_and_marketing_effect: "提高征购粮食指标会对§G农业§!产生§R一定压力§!，但会提升我们的§G行政效率§!。"
CPGAC_prop_state_monopoly_of_purchasing_and_marketing_option_0: "仅提高麦子征购指标"
CPGAC_prop_state_monopoly_of_purchasing_and_marketing_option_1: "略微提高全种类征购指标"

CPGAC_prop_ban_individual_businesses: "彻底取缔个体经营"
CPGAC_prop_ban_individual_businesses_desc: "§G重要产业公有化§!原本是阵线在五十年代制定的§G经济总目标§!之一，但因六十年代初的§e严重危机动乱§!不得不暂停这一进程。阵线转而重新允许和鼓励§Y私营企业和民族资本家§!在阵线内经营产业。诚然，私营产业曾对§G阵线经济工作§!的恢复起到了重要作用，但六十年代初期阵线§R经济困难§!期间，这些§Y私营产业§!也表现出了§R钻营逐利的利己性和局限性§!，我们必须重新考虑§Y私营产业§!在根据地未来的§S社会主义建设§!中应有的位置——£TER_texticon_mao §G党中央毛主席§!指出，§S社会主义经济§!的本质是生产资料的§x公有化§!，随着经济条件的成熟，我们现在应当对私营产业进行彻底的§G国有化改造§!，§x取缔个体经营§!。"
CPGAC_prop_ban_individual_businesses_effect: "将在解放区鼓励和强制§Y资本家§!放弃企业股份，主动向§G党和人民§!转交重要产业的经营权。"
CPGAC_prop_ban_individual_businesses_option_0: "贯彻执行公有制改造"
CPGAC_prop_ban_individual_businesses_option_1: "对爱国民主人士给予保护"
CPGAC_prop_ban_individual_businesses_option_2: "鼓励工人自发成立群众组织"

CPGAC_prop_release_surplus_labor_to_rural_areas: "向农村释放剩余劳动力"
CPGAC_prop_release_surplus_labor_to_rural_areas_desc: "§S社会主义建设§!进入新时期，随着§Y重庆、西安、成都§!几个大城市的相继解放，我们的§m城市人口和工业水平§!都得到了§G较大的跃升§!，阵线第一次拥有了充足的劳动力人口。£TER_texticon_mao §G党中央毛主席§!指示，阵线应当保持§G城乡趋同§!，要让城镇的富余劳动力到地方农村，到偏远地区去，接受§G贫下中农§!的§x再教育§!。\n\n这部分城镇居民在经历过地方公社的历练后，应当能成长为我们社会主义建设的§G中坚力量§!，同时我们的地方乡村人民公社也将因为富余劳动力的输入而实现经济工作的进步，是一举两得的双赢举措。"
CPGAC_prop_release_surplus_labor_to_rural_areas_effect: "将在解放区强化执行§Y干部下放，青年下乡§!的政务措施。"
CPGAC_prop_release_surplus_labor_to_rural_areas_option_0: "集中干部下放，办大学校"
CPGAC_prop_release_surplus_labor_to_rural_areas_option_1: "建立城镇对口支援乡村制度"
CPGAC_prop_release_surplus_labor_to_rural_areas_option_2: "对知识分子给予一定优待"

CPGAC_prop_relaxation_of_self_individual_farmers: "放宽农村个体经营"
CPGAC_prop_relaxation_of_self_individual_farmers_desc: "过去的调研中，中央发现一些合作社§R难以为继§!，社员§m私自分地耕作§!，靠这种§Y包干到个人§!的办法度过饥荒。现在经过几年小范围施行包干包产，当地许多农民的生活得到§G改善§!，有效§G缓解§!了经济困难的局面。§m刘少奇§!同志指出，放宽个体经营的办法可以在全根据地进行§m有限推广§!，主要是为了那些生活在更偏远贫穷地区的农民解决温饱问题，只有解决小农阶级迫在眉睫的§R生存危机§!，我们才能开始下一步的§G集体化§!工作。\n\n综上，£CPGAC_texture_loc §G政务委员会§!投票同意通过£TER_texticon_liu §m放宽农村个体经营§!的提案。"
CPGAC_prop_relaxation_of_self_individual_farmers_flag: "£CPGAC_texture_loc §G中央人民政务委员会§!投票表决通过了§Y放宽农村个体经营§!的§m重大议题§!"
CPGAC_prop_relaxation_of_self_individual_farmers_effect: "将在解放区推广执行§m包干到个人§!的农业措施。"
