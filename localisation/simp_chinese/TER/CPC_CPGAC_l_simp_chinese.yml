CPGAC_portrait_hog_desc: "§Y[TER_CPGAC_name_hog]§!\n---------------------------\n人民政府总理\n\n§Y总理§!为政务委员会首脑，负责总领政府工作。\n\n§Y总理§!有权加速§Y当前议题§!完成。"
CPGAC_portrait_sec_desc: "§Y邓小平§!\n---------------------------\n政务委员会主任\n\n§Y主任§!为中央政务委员会核心职务，负责协调统一政务委员会内各派别人士意见。\n\n§Y主任§!可沟通协调各方以提高§Y当前重大议题§!的支持率。"
faction_CPC_btn_tt: "£CPC_texticon §x中国共产党§!\n---------------------------\n依§m《中国国防§!§x阵线纲领》§!规定，£CPC_texticon §x中国共产党§!在£CPGAC_texture_loc §G人民政府§!中的意见比重为§Y70%§!。\n£CPC_texticon §x中国共产党§!目前对政府满意度为：[?CPC.CPGAC_satisfaction^1|1G%]\n---------------------------\n点击进入£CPC_texticon §x中国共产党§!的详细交互界面。"
faction_DEM_btn_tt: "§C民主党派§!\n---------------------------\n依§m《中国国防§!§x阵线纲领》§!规定，§C各民主党派§!在£CPGAC_texture_loc §G人民政府§!中的意见比重为§Y20%§!。\n目前在政府中的§C民主爱国党派§!为：§z中国民主§!§C革命同盟§!与§s新中华民主同盟§!。\n§C民主党派§!目前对政府满意度为：[?CPC.CPGAC_satisfaction^2|1G%]\n---------------------------\n点击进入§C民主党派§!的详细交互界面。"
faction_LIB_btn_tt: "§m无党派人士§!\n---------------------------\n依§m《中国国防§!§x阵线纲领》§!规定，§m无党派人士§!在£CPGAC_texture_loc §G人民政府§!中的意见比重为§Y10%§!。\n目前主要的§m无党派人士§!包括：§x工人代表§!，§R士兵代表§!，§G农民代表§!，§m有产人士代表§!等。\n§m无党派人士§!目前对政府满意度为：[?CPC.CPGAC_satisfaction^3|1G%]\n---------------------------\n点击进入§m无党派人士§!的详细交互界面。"
