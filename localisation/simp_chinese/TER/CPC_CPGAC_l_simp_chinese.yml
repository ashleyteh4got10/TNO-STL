CPGAC_prop_increase_citizens_subsidy_option_2: "扩大工人俱乐部规模"

CPGAC_prop_PLA_announcement: "§Y解放军改革§!提案"
CPGAC_prop_PLA_announcement_desc: "我军应当对§m现代战争§!的复杂多变有充分认识和准备，全军上下许多官兵在研讨推演近现代战争时都认为，现代战争中能克敌制胜的军队，往往拥有§G专业的兵员素质§!和§m现代化的作战装备§!，我军拥有§x光荣的建军传统§!和§G政治建军的先进思想§!，但亟需更新作战思维，我们需要一支§G更专业更精良的解放军§!以应对必将到来的§x解放战争§!。\n\n为保证解放军战斗素质，£CPGAC_texture_loc §G政务委员会§!一致同意通过£TER_texticon_PLA §Y解放军改革§!的提案。"
CPGAC_prop_PLA_announcement_effect: "我们将决定£TER_texticon_PLA §R解放军§!的§Y改革方向§!。"
CPGAC_prop_CPC_PLA_reform_L: "我们在£TER_texticon_PLA §Y解放军改革§!中采用了§G任务式指挥改革§!的方案。"
CPGAC_prop_CPC_PLA_reform_R: "我们在£TER_texticon_PLA §Y解放军改革§!中采用了§m集中式指挥改革§!的方案。"
CPGAC_prop_PLA_announcement_option_0: "采用§G任务式§!指挥改革"
CPGAC_prop_PLA_announcement_option_1: "采用§m集中式§!指挥改革"

CPGAC_prop_rural_democracy: "§C基层§!§S民主§!改革动议"
CPGAC_prop_rural_democracy_desc: "八大以来的建设时期，我们取得了非常巨大的成就，根据地的经济也得到了有效增长和回复。但党内有§Y同志§!指出，在我们的§G农村基层§!甚至§m城市基层§!，过度放权地方干部抓生产搞建设带来了很多§R负面问题§!，相当多基层干部的思想开始§R专擅滥权§!，故此，一些§G年轻同志§!已经向中央提出关于§C基层民主改革§!的意见。"
CPGAC_prop_rural_democracy_effect: "我们将决定§C基层§!§S民主§!改革的§Y改革方向§!。"
CPGAC_prop_rural_democracy_option_0: "采用£TER_texticon_mao §G张春桥同志§!提案"
CPGAC_prop_rural_democracy_option_1: "采用£TER_texticon_liu §m韩光同志§!提案"
CPGAC_admit_rural_dem_zhang: "£CPGAC_texture_loc §G中央人民政务委员会§!通过£TER_texticon_mao §G张春桥同志§!关于§Y基层民主改革§!的提案。"
CPGAC_admit_rural_dem_han: "£CPGAC_texture_loc §G中央人民政务委员会§!通过£TER_texticon_liu §m韩光同志§!关于§Y基层民主改革§!的提案。"
