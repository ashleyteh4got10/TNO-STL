CPGAC_prop_faction_button_click_desc: "该§Y派系特殊功能§!将使§Y各派态度§!发生变化，当前还可使用[?CPGAC_btn_faction_skills_time|+=0]次该功能。\n以下左侧为§G赞同率§!变化、右侧为§R反对率§!变化：\n---------------------------\n§G毛派§!态度变化：[?attitude_change_Y_in_party_tmp^0|+=1]%/[?attitude_change_N_in_party_tmp^0|-=1]%\n§m刘派§!态度变化：[?attitude_change_Y_in_party_tmp^1|+=1]%/[?attitude_change_N_in_party_tmp^1|-=1]%\n§R[TER_CPGAC_faction_name_sov]§!态度变化：[?attitude_change_Y_in_party_tmp^2|+=1]%/[?attitude_change_N_in_party_tmp^2|-=1]%\n§Y书记派§!态度变化：[?attitude_change_Y_in_party_tmp^3|+=1]%/[?attitude_change_N_in_party_tmp^3|-=1]%\n§C民主党派§!态度变化：[?attitude_change_Y_tmp^0|+=1]%/[?attitude_change_N_tmp^0|-=1]%\n§m无党派人士§!态度变化：[?attitude_change_Y_tmp^1|+=1]%/[?attitude_change_N_tmp^1|-=1]%"
CPGAC_ongoing_prop_option_desc: "[!CPGAC_ongoing_prop_option_click]"
CPGAC_prop_option_generic_desc: "该修改意见由[CPGAC_prop_option_faction_big][CPGAC_prop_option_in_party]提出，采纳该修改意见将使各派别意见发生变化，并花费£pol_power §Y5§!政治点数。\n以下左侧为§G赞同率§!变化、右侧为§R反对率§!变化：\n---------------------------\n§G毛派§!态度变化：[?attitude_change_Y_in_party_tmp^0|+=1]%/[?attitude_change_N_in_party_tmp^0|-=1]%\n§m刘派§!态度变化：[?attitude_change_Y_in_party_tmp^1|+=1]%/[?attitude_change_N_in_party_tmp^1|-=1]%\n§R[TER_CPGAC_faction_name_sov]§!态度变化：[?attitude_change_Y_in_party_tmp^2|+=1]%/[?attitude_change_N_in_party_tmp^2|-=1]%\n§Y书记派§!态度变化：[?attitude_change_Y_in_party_tmp^3|+=1]%/[?attitude_change_N_in_party_tmp^3|-=1]%\n§C民主党派§!态度变化：[?attitude_change_Y_tmp^0|+=1]%/[?attitude_change_N_tmp^0|-=1]%\n§m无党派人士§!态度变化：[?attitude_change_Y_tmp^1|+=1]%/[?attitude_change_N_tmp^1|-=1]%\n---------------------------\n当前剩余[?CPGAC_ongoing_prop_option_click_times|0+=]次变更§Y修改意见§!的机会。\n---------------------------\n原始效果：\n[CPGAC_ongoing_prop_effect]\n---------------------------\n该意见附加效果：\n"
