 LOY_Long_Zehui_for_desc: "外交部长\n专制主义\n------------\n§L龙泽汇可是抗击日寇的老将。他参加过台儿庄战役和抗日战争，亲眼看着大日本帝国蹂躏故乡，目睹无数战友倒在日军的铁蹄之下。双方议和后，战争结束了，龙泽汇却松了口气，这让他感到自己分明是在叛国。他和日本人握手、合作，叛国的感觉渐渐消退，直至不再顾虑。\n\n眼下，龙泽汇身处边疆，身居闲职，与改组国民政府的勾心斗角脱了干系。更重要的是，他待在这里，就能离那些会勾起自己糟糕回忆的日方官员远远的。\n或许，在这里，龙泽汇能享受到二十年来未能如愿的宁静。§!"
