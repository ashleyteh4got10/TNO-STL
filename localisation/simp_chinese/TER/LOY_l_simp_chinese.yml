 LOY_lu_han: "卢汉"
 POLITICS_LOY_LU_HAN_DESC: "卢汉是彝族人，于1895年出生在昭通。在早些年，他就与自己的亲表哥龙云一同学习军事。和平的岁月一晃而过，当日本帝国主义入侵时，卢汉机智而狡猾地与日本军队缠斗，保卫他的故乡远离压迫，但这远不能搭救不成器的蒋介石政府。豫湘桂惨败后，眼见国民政府行将覆灭，龙云主动抛下了重庆中央回到云南，打起“保境安民”的旗号，关上门自保起来。\n\n当爱国人士齐聚在五华山省政府大门前，厉声讨伐自轻自贱的龙云时，卢汉总看到表哥淡然一笑，随他自去。不多时，人群便慢慢散去。日久年深，翠湖畔的讲武堂早已废弛，与之仅一湖之隔的卢公馆亦紧闭门户，拒绝任何外人的斥责——而抗日的浪潮，亦随着时间渐渐消褪。\n\n龙云已于1960年去世，接过表哥留下的重担的卢汉俨然成为一邦之主。十几年来，对于云南而言，身在统治阶层的龙、卢二人早已有“土皇帝”的定位，但这片滇土如果想继续走下去，就得奋力追上时代潮流，成为整个中国的弄潮儿。"
 TER_SW_new_decisions: "[TER_SW_new_decisions_title]"
 TER_SW_new_decisions_desc: "[TER_SW_new_decisions_desc]"
 TER_SW_new_decisions_title_LOY: "西南新政-滇"
 TER_SW_new_decisions_title_GUZ: "西南新政-黔"
 TER_SW_new_decisions_title_GUX: "西南新政-桂"
 TER_SW_new_decisions_title_SIC: "新政-川渝一体"
 TER_SW_new_decisions_desc_LOY: "“新政”可能是从卢汉口中吐出最甜美的语言，他承诺要让所有云南人都能过上丰衣足食的小康生活。所以，为了建成这样的乐土，他可以用冲锋枪当街扫射反对分子，派军队驱散政协会议，纵容地主吊死抗税农民，铲平一切令龙氏家族不安的因素。不过血淋淋的杀戮已经过去将近十年。现在人人安分守己，努力工作，为建成模范省份奉献自己的一份力量。\n\n经济恢复得很快，云南也就这样活着，在中国战后幅员辽阔的大地上显得超乎寻常的平淡。山雨大滴大滴得从天上落下，将街头的污秽冲刷干净，记忆渐渐走远成为传说，茶馆中避雨的食客甚至开始高谈阔论英明的龙大帅保护云南免于日本人侵略，并无不感慨地啜了一口雾气腾腾的新茗。"
 TER_SW_new_decisions_desc_GUZ: "“新政”是汪精卫号召西南军阀恢复经济的口号，但是对贵州其内涵显得十分枯燥，甚至有威胁的意味。汪精卫看上了天无三日晴，地无三里平的贵州，因此专门用来流放“蒋介石余党”。南京不会向这里倾斜任何资源，只求这些政治弃儿尽快自生自灭在险峻的泥潭中。\n\n何应钦在1948年垂头丧气地回到家乡，戎马一生如井底捞月，六十岁的他想给乡亲们带来点好处，但多次品尝失败的滋味后，索性就不管了。可是南京来的考核人员又要挑肥拣瘦，这些无端的排挤使何应钦的脾气越来越乖张孤僻。他听不进去任何人的话，动不动就摔杯子骂人；他什么都不肯撒手，无论是吃饭的筷子还是任何形式的权力。何应钦活像一条斗败的老犬龇牙咧嘴保护着他仅剩的领地，“新政”只是威胁他统治的绊脚石罢了，而贵州的境遇也在他无微不至的“保护”中每况愈下。"
 TER_SW_new_decisions_desc_GUX: "当夏威每天骑着自行车离开桂林文明路16号时，不知他是否会记恨这所官邸曾经的主人，潜逃国外的李宗仁。\n\n夏威知道自己要做什么，他要带领家乡人过上好日子。他也知道自己什么会做什么不会做，时常谦虚地请教专业人士。他向广西大山派出农业改良团，在城市鼓励私人经商。为了听取更多建议，夏威允许境内自由结社，并用自己包容的心胸赢得人们的支持。在取得工农业增长后，经济专家又发掘出旅游业，令日本游客为广西秀丽的风景慷慨解囊——日本人令人讨厌，但日元可以让广西茁壮成长。\n\n唯有一个问题，夏威绝不让步，那就是服从日本。作为共荣圈里反日的异类，觊觎广西的豺狼只会与日俱增。广东国成立后，日本企业对充满敌意的邻居不可能熟视无睹，东京对此了然于胸。南京行政院中，不利于夏威的言论越来越多。卢汉嫉恨夏威的成绩，不断放出谣言，最甚者直呼夏威与共匪勾结。时代的黑潮何时会吞没广西这条小船呢？坦白地说，我不知道。"
 TER_SW_new_decisions_desc_SIC: "1946年春，饥荒再次袭击了四川。会见四川省主席贺国光时，李宗仁表示四川人马上就能吃到美国的大米白面了。\n\n1947年，四川代表王缵绪在武汉对日本提出川军进入重庆，统一四川的要求，遭到断然拒绝。\n\n1953年，汪精卫在他所倡导的西南新政中，向世世代代生活在四川的人们保证支持四川统一和川人自治，并且通过优惠政策，补偿蒋介石给四川带来的灾难。\n\n1957年，四川省主席邓锡侯在病危中寄给南京当局一封公开信，指责国府利用重庆设市的手段钳制地方，要求撤走重庆所有的国民党机构，否则“川渝一体”便是一句空话。\n\n1962年，“川渝一体”依然是一个政治理想。"
 TER_SW_great_suppress_bandits: "大剿匪"
 TER_SW_great_suppress_bandits_desc: "[TER_SW_great_suppress_bandits_desc]"
 TER_SW_great_suppress_bandits_desc_LOY: "西南省份在大战结束后饱受匪患侵陵，具统计有90万土匪零散在西南的山沟野壑中。各省首脑想要收编这些乱民加入军队，但在掏空财政续不上票子之后，这群老鸹便带着他们学会的军事技能一哄而散又回到山上为祸一方。\n\n卢汉不会给土匪任何好脸色，尤其是在浪费掉云南的钱之后。就像对付反抗的农民一样，卢汉派出自己的军队开进哀牢山中，用断绝粮食的手段逼出并擒获流窜的土匪。将匪首头颅砍下挑在旗杆上，去恐吓其他地方的土匪。犁庭扫穴的成效很快，滇军轻而易举击溃了数量高达十万的土匪，但卢汉始终不明白，为什么土匪总是一剿就有？"
 TER_SW_great_suppress_bandits_desc_GUZ: "西南省份在大战结束后饱受匪患侵陵，具统计有90万土匪零散在西南的山沟野壑中。各省首脑想要收编这些乱民加入军队，但在掏空财政续不上票子之后，这群老鸹便带着他们学会的军事技能一哄而散又回到山上为祸一方。\n\n贵州的土匪是声势最浩大的，他们占据了省城以外的大片地区，控制了耳熟能详的城镇：遵义、六盘水、毕节……他们把控税收，阻断道路，甚至可以包围勒索省长的车队。何应钦曾亲自挂帅对土匪宣战，但现在开始尝试与土匪共存。他给予势力最大的匪头正式官职，委托他们去辖制小股土匪。只要按时给何应钦付钱，土匪就可以随意经营自己盘踞的山头。贵州的匪患也就这样浑浑噩噩地在解决和未解决之间摇摆不定。"
 TER_SW_great_suppress_bandits_desc_GUX: "西南省份在大战结束后饱受匪患侵陵，具统计有90万土匪零散在西南的山沟野壑中。各省首脑想要收编这些乱民加入军队，但在掏空财政续不上票子之后，这群老鸹便带着他们学会的军事技能一哄而散又回到山上为祸一方。\n\n面对匪患，夏威更重视基层动员力，广西村寨的自主性很高，只要利用土地改革拉拢住农民组成自卫武装，就能进可攻，退可守，斩断土匪所需的一切资源。桂林的征兵处总共征募了18万地方民兵，这些农民一手拿锄头，一手拿火枪，配合广西军队打得土匪抱头鼠窜。而只有以剿促抚，才能在社会中给土匪安排好合适的岗位，最终让那些老奸巨猾的土匪安分下来，乖乖的成为合法公民。"
 
 CPC_riot_in_Sichuan: "成都之乱"
 CPC_riot_in_Sichuan_desc: "听闻国军放弃抵抗，日军即将进入四川的消息后，成都市民群情激愤，纷纷走上街头。\n\n卫戍区司令胡琏指挥部队封锁街道，但市民对国民党完全丧失信心，开始围攻军事机关，国军果断选择开火平叛。此时陈诚已亡，身为总司令的薛岳无力节制中央军，胡琏也在混乱中失去联系，群龙无首的士兵将镇暴变为了焚城，大火整整烧了七天，成都就像历史上那样又一次沦为废墟。然而日军没有停止行动，按照既定方针开进重庆，挑起“维持秩序”的布幅。\n\n一系列惨剧，给了国破家亡的四川人一个共识：蒋氏政权必须滚蛋，四川要自治。"