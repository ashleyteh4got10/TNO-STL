#民族精神
GGC_we_have_been_a_fucking_colony_for_52_years: "五十二载合并岁月"
GGC_we_have_been_a_fucking_colony_for_52_years_desc: "自大正九年大韩帝国皇太子李垠与日本皇族梨本宫家方子女王成婚以来，“内鲜一体”思想便出现在历代朝鲜总督的办公案头。在一体化政策指导下，日本陆续在朝鲜置办工业、加强其“大陆兵站基地”战争协力的定位、大力推行皇民化政策，力图磨灭朝鲜的本土文化与语言，完成与本土四岛的一体化。\n\n到昭和三十七年（1962年）为止，这场漫长的殖民吞并已进行了五十二年之久；如今的朝鲜半岛是共荣圈的重要工业基地，更是共荣圈内泛亚团结共存共荣的典范——\n\n——所有人都为朝鲜感到骄傲，但问题是，§R它仍然不够“日本”：无论在本土、朝鲜、或是世界上的其他地方，它仍然不能被人们看作是日本。§!"
GGC_we_have_been_a_fucking_colony_for_52_years_tt: "朝鲜的未来必须得到§Y某种形式的确认§!，否则，£GNG_japanese_frustration_texticon §j大日本帝国§!为合并朝鲜所做的努力将全部§R付诸东流§!。"
GGC_Japanese_skilled_migrants: "日本技术移民"
GGC_Japanese_skilled_migrants_desc: "长期殖民为朝鲜半岛带来了大量精于现代工业技术的日本籍熟练工人移民，朝鲜的工业水平也因此迎来了一轮不可谓不痛苦的“飞跃”。\n\n如今，来自日本的移民已经掌控了朝鲜工业的方方面面，诚然他们熟练的工业知识为朝鲜半岛带来了可观的经济增长，但他们日益膨胀的政治权力也在一点点蚕食本土朝鲜族裔的生存空间。"
GGC_strict_control: "社会管制"
GGC_strict_control_desc: "数十载殖民统治未能压制住朝鲜人桀骜不驯的独立野心，除了以更严厉的皇民化政策规训朝鲜人服从帝国统治，还必须加大军警宪特的投入。\n\n一定要严查朝鲜半岛上破坏泛亚共荣的§x赤化分子§!和§m自由派§!，否则总督府泛亚共荣模范之美名无非一笑柄而已。"
GGC_Border_inspection: "严查边防"
GGC_Border_inspection_desc: "尽管陆海邻国都是泛亚共荣友邦，但非法移民和走私问题一直是朝鲜对外事务的两大痼疾：非法移民以自满洲、中国混入半岛的失意者居多，其中很可能还有毒害东北亚数十年的§x赤化分子游击队§!；而朝满边境上屡禁不止的鸦片走私更严重损害了总督府的财政健康状况——或许还有帝国臣民的身体健康状况。\n\n严格边关检查有助于我们打击非法移民和货物走私，更为重要的是，它也能杜绝东北亚游击势力对朝鲜的渗透和破坏。"

#骨架
GGC_news.1.t: "[Get_newspaper_header]朝鲜产奉十周年大会"
GGC_news.1.desc: "近日，朝鲜半岛的劳工联合组织“产业奉公联合会”于京城召开了其成立十周年纪念大会，这被认为是决定朝鲜产业未来发展方向的重要会议，引来共荣圈内各国的极大关注。\n\n大会检讨了产奉的总路线，认为过去十年中大日本产业报国会朝鲜支部“指导”的协调路线在朝鲜没有取得实质性效果，十年来朝鲜裔劳工的生存状况与工作待遇没有得到改善，产奉应当负起“朝鲜人自己的劳工联合组织”的责任，在保护本土朝鲜裔劳工权益方面作出更积极的措施。\n\n据悉，大会通过了拟在半岛各地制铁所新建产奉支部的决议案，准备扩大朝鲜裔劳工的自主权。"
GGC_news.1.a: "殖民地劳工斗争？感觉这事成不了。"
GGC_news.2.t: "[Get_newspaper_header]朝鲜产奉十周年大会"
GGC_news.2.desc: "近日，朝鲜半岛的劳工联合组织“产业奉公联合会”于京城召开了其成立十周年纪念大会，这被认为是决定朝鲜产业未来发展方向的重要会议，引来共荣圈内各国的极大关注。\n\n大会高度肯定了产奉的总路线，认为过去十年在大日本产业报国会朝鲜支部指导下，协调路线在朝鲜取得了显著成效，大会喊出了“道义朝鲜”的口号，指出产奉和朝鲜应当肩负起泛亚共荣事业中义不容辞的巨大责任。\n\n评论普遍认为，此次大会预示着朝鲜本土劳工联合组织已不可避免地走向彻底法团化，最后被大日本产业报国会合并的结局。"
GGC_news.2.a: "不过是产报的又一个傀儡。"
GGC_news.3.t: "[Get_newspaper_header]平壤刺杀事件！"
GGC_news.3.desc: "危机动荡的共荣圈此刻传来又一个坏消息：第十二代朝鲜总督后宫淳，于本日在平壤参加总督府53周年成立庆典时遭遇朝鲜族游击队刺杀，当街暴毙。\n\n这被认为是和朝两族紧张关系走向临界点的重要事件，目前，东京对后宫淳遇刺一事尚无回应，朝鲜总督府已经取消了所有后续节庆安排，总督事务目前由总督府政务总监后藤田正晴代行。目前普遍认为，后藤田正晴将于稍晚时候接到东京的正式任命，成为第十三代朝鲜总督。"
GGC_news.3.a: "他们就不能安排个朝鲜人上台吗？"
GGC_news.4.t: "[Get_newspaper_header]朝鲜产奉分裂"
GGC_news.4.desc: "混乱中的朝鲜传来消息：朝鲜产业奉公联合会因稍早前的后宫淳遇刺事件取消了第六次代表大会，终止了先前在日铁制铁所建立产奉支部的构想。\n\n与此同时，产奉部分左派成员宣布脱离组织，另立了一个被称为“朝鲜劳动组合联合评议会”的劳工组织。评论普遍认为产奉已经事实瓦解，朝鲜劳工的生存状况也因产奉瓦解而再次备受外界瞩目。\n\n据悉，联评成立当日即宣告将组织黄海-咸镜地区大罢工，“以斗争求得朝鲜族的合法生存权益”。"
GGC_news.4.a: "我们将持续跟踪后续进展。"
GGC_news.5.t: "[Get_newspaper_header]朝鲜产奉中止并入产报流程"
GGC_news.5.desc: "混乱中的朝鲜传来消息：朝鲜产业奉公联合会因稍早前的后宫淳遇刺事件取消了第六次代表大会，终止了并入大日本产业报国会朝鲜支部的设想。\n\n普遍认为，后宫淳遇刺一事令产奉开始重新审视朝鲜本土民族的生存状况，“道义朝鲜”口号已经事实破产，产奉正在寻求以合法方式争取本土民族生存权益。\n\n据悉，已有超过2万名会员在产奉最新拟定的《国会代表权扩大请愿书》上联署，该文件旨在向日本国会请愿扩大朝鲜裔在国会中的话语权。"
GGC_news.5.a: "我们将持续跟踪后续进展。"
GGC_news.6.t: "[Get_newspaper_header]总督府血洗黄海道！"
GGC_news.6.desc: "由朝鲜劳动组合联合评议会组织的黄海大罢工以惨剧收场，在得到军部同意后，朝鲜总督府调遣日本陆军第17方面军机械化部队进驻黄海道，并指示陆军随意开火镇压罢工工人。\n\n目前黄海道地区没有确切信源传出，无从得知本次血腥镇压中的死伤情况，从现场流出的一张骇人照片看，镇压现场尸横遍地，军警甚至已经动用了重型武器，彰显了朝鲜总督府以强硬手段镇压联评罢工组织的决心。"
GGC_news.6.a: "恶贯满盈！"
GGC_news.7.t: "[Get_newspaper_header]全罗-咸镜暴动"
GGC_news.7.desc: "朝鲜全罗道、咸镜道地区于三日前陷入失联状态。有零星消息证实，东北抗日联军朝鲜族游击队于数日前发动突袭行动控制了上述地区。目前，总督府已经事实丧失了暴乱地区的实控权，目前事态有进一步扩大趋势，曾有人目击一些前产奉极左派成员在全咸地区现身，但目前仍不清楚游击队领导人身份。\n\n有评论认为，这次暴动同后宫淳遇刺一样是由东北抗联朝鲜游击队策划发动，藉由两次袭击破坏事件，他们的意图已经明晰：赶走日本殖民者，夺得朝鲜民族完全的独立自由。"
GGC_news.7.a: "殖民帝国正在土崩瓦解。"
GGC_news.8.t: "[Get_newspaper_header]全咸暴动平息"
GGC_news.8.desc: "面对日趋严重的内乱局面，朝鲜总督[GGC.GetLeader]于一个月前就镇压暴动问题前往新京会见关东军高层——我们无从得知这次会面的具体内容，但仅从结果来看，这次会面富有成效：关东军目前已经派出天野良英少将率领部队前往全罗道和咸镜道，会同日本陆军第17方面军一道迅速镇压了共产分子叛乱。\n\n而此前一直处于迷雾中的游击队首脑的真面目也被揭开——金日成，出身于平安南道农户家庭，1925年逃亡到中国，1931年加入中国共产党，在中共外围组织“东北抗日联军”中担任重要角色。\n\n尽管总督府对外宣称“本次镇压有力打击了赤匪的嚣张气焰，并取得了更多实质性情报”，但在长达二十日的审讯中，日本没有得到任何东北抗联的进一步消息。据信，金日成及大部分被俘的游击队员已经在平壤被集体枪决。"
GGC_news.8.a: "英勇的战士们。"
GGC_news.9.t: "[Get_newspaper_header]第十四代朝鲜总督上任"
GGC_news.9.desc: "从后宫淳遇刺、黄海大罢工到全咸暴动，朝鲜近年来绵延不断的乱局似乎令日本失去了耐心。在关东军入朝作战击溃东北抗联朝鲜游击队后，东京发出命令，正式委任关东军部队指挥官天野良英出任第十四代朝鲜总督。军部的奖赏也颇为丰厚：连升两级，擢升天野良英为陆军大将，并委任其为日本陆军第17方面军司令官。\n\n军人执政在朝鲜本不鲜见，但朝鲜总督府的这一变动仍然令人感到惊愕，在西部中国共产党政权威胁日笃的状况下，日本重新委任现役少壮军官为殖民地军政首脑的举动似乎展现了其重回总动员时代，启动全面战争准备的意图。"
GGC_news.9.a: "世界列强丑态毕露。"
GGC_news.10.t: "[Get_newspaper_header]朝鲜产奉重组"
GGC_news.10.desc: "为应对联评声称的黄海大罢工，朝鲜总督府采取了怀柔手段：一面以威逼利诱等手段分化联评中立场软弱的成员，另一面则对外散布了有关联评成员的负面消息。事实证明，朝鲜总督府的应对是正确的：分化后的联评丧失了组织产业工人罢工的能力，仅在几个零星厂区爆发了规模有限的抗议活动，仅有的联评极左成员也被迅速控制，“朝鲜劳动组合联合评议会”已经事实瓦解。\n\n朝鲜总督府的措施避免了大规模流血冲突的可能性，赢得了东京方面的赞赏，总督府先前提出的“以鲜治鲜”构想已得到日本现任内阁支持，预计将由一位朝鲜裔政客出任第十四代朝鲜总督一职，朝鲜产业奉公联合会也在政府帮助下完成重组。"
GGC_news.10.a: "明智之举。"
GGC_news.11.t: "[Get_newspaper_header]《外地国民代表权法案》获得通过"
GGC_news.11.desc: "近日，由朝鲜产业奉公联合会发起并联署的《国会代表权扩大请愿书》获得了东京方面的积极回应，日本国会高票通过了《外地国民代表权法案》，该法案扩充了“外地国民”的含义，并在立法上明确朝鲜、台湾等“外地国民”拥有同日本本岛国民基本一致的政治权利。\n\n根据《外地国民代表权法案》，日本仍然保留对于朝鲜的总督人事任免权，但日本今后将只能任命朝鲜裔政客为朝鲜总督，此消息不仅令产奉欢欣鼓舞，京城、平壤的许多一般市民也自发走上街头庆祝朝鲜族群在国家政治事务上获得了更多参与权。"
GGC_news.11.a: "但不还是仰日本鼻息而存？"
GGC_news.12.t: "[Get_newspaper_header]第十四代朝鲜总督上任"
GGC_news.12.desc: "根据先前既定的“以鲜治鲜”方针，东京于近日正式任命亲日派朝鲜裔议员金钟泌为朝鲜总督府第十四代总督。\n\n在总督府就职典礼上，金钟泌的就职演说宣誓要实现过去五年中蒙尘的“道义朝鲜”的政治理想，令朝鲜真正成为泛亚共荣“大使命之担当者”。同时，金钟泌还在就职典礼上宣布了一些经济产业目标，包括振兴北部钢铁产业，扩大对马海峡隧道运力等。\n\n普遍认为，在东亚局势渐趋明朗的现在，金钟泌的上台标志着朝鲜族和日本之间取得了新的政治平衡点，日本愿意通过提高朝鲜族一定的政治地位来换取朝鲜族在反共立场上的忠诚，这一措施的成效如何目前尚不明朗，只能留待时间来作出回答。"
GGC_news.12.a: "也许朝鲜的未来已经注定。"
GGC_news.13.t: "[Get_newspaper_header]《外地国民代表权法案》未获通过"
GGC_news.13.desc: "由朝鲜产业奉公联合会发起并联署的《国会代表权扩大请愿书》并未获得东京方面的积极回应，日本国会否决了旨在提高海外殖民地国民政治权利的《外地国民代表权法案》。\n\n消息传回朝鲜半岛引得一片沮丧和骂声，相当多评论认为，即使在东亚局势渐趋明朗的现在，日本完全吞并朝鲜，保证核心殖民利益的既定方针依旧没有任何动摇。一些东亚观察家指出，这可能导致朝鲜民族趋于分裂，产业工人亲共的风险似乎正在增加。"
GGC_news.13.a: "内鲜一体，不容动摇。"
GGC_news.14.t: "[Get_newspaper_header]朝鲜通过《中枢院职权改正法》"
GGC_news.14.desc: "“以鲜治鲜”的构想遭到东京冷落后，朝鲜总督府于近日通过了《中枢院职权改正法》，该法在1910年《朝鲜总督府中枢院官制》及1918年《朝鲜总督府中枢院事务分掌规程》基础上进行了一定的修改，确认朝鲜裔国民可以依法被选为中枢院议长，也即朝鲜总督府政务总监。同时强化了中枢院的行政职权，使其从政务咨询机构变为初步的政务监理机构，辅助朝鲜总督府管理半岛日常政务。\n\n该法案的通过被普遍认为是朝鲜总督府在“以鲜治鲜”构想上的备选方案，调查显示，产业奉公联合会、辅翼同友会及爱国朝鲜联合会都有意在该法通过后推出代表参选朝鲜政务总监。"
GGC_news.14.a: "他们找到了崭新的平衡点。"

