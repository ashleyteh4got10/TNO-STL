 #国家领袖
 QYC_Tang_Shengming: "唐生明"
 QYC_Tang_Shengming_desc: "出身湖南钟鸣鼎食之家，豪强子弟唐生明不偏不倚洄游于当权者之间。就像张学良一样，他手握这个国家的启动资金，等待着为一支潜力股一掷千金。\n\n没看上湘系的亲哥，也就没帮他做什么贡献。北伐时期，唐生明给蒋介石借兵借枪，还把自己的警卫连送给戴笠组建军统部队。以至于中原大战后的唐生明再也不缺票子，供他在秦淮河畔肆意花天酒地。有这一层关系，蒋介石在抗战时期才派他打入汪精卫政府，伺机而动。\n带上貌美如花的太太，唐生明在上海安了家，仅靠吃喝玩乐就和新权贵打得火热。富丽堂皇的水晶灯下，他们一边打牌一边高谈阔论。当被问及投靠汪精卫的缘故时，唐生明言之凿凿，回答道：“重庆，我住不惯，就喜欢上海。”\n\n§R但是重庆战败了。§!上峰失联，形势逆转，卧底成了假戏真做。\n\n当上汪精卫政府的头脸人物，重庆的旧人要反过来巴结唐生明。香车宝马滚滚而来，可是唐生明的真实生活已经彻底破灭。就像企图逃避命运的旧式官僚一样，他向汪精卫请求外调，只要不在南京，随便搬进一栋洋房别墅里自生自灭，更切合他一世纨绔的理想。\n\n§R共产党特工潘汉年§!希望帮唐生明走出人生低谷，试探性询问他想不想恢复地下工作。唐生明抽着吕宋雪茄，把烟雾干巴巴吐到潘脸上：“你说我同情共产党，我倒觉得更像施舍……你是干大事的，我佩服你，但咱们不是同路人。”\n面对武断拒绝，潘汉年没有多话，起身戴上棕色礼帽，一副胸有成竹的样子：§R“我们一定会达成合作，月内必然有消息。”§!五天过去，周佛海为潘汉年的预言画上了圆满的句号。唐生明深厚的人际关系——尤其是与日本海军军官深交，让周佛海意图拉拢这个自投罗网的军统。于是，他秘密召见唐生明并授予一项重任：火中取栗，收复海南。\n\n到达天涯海角，距离预言整整过去一个月。当地§R有心人§!应潘汉年的指示上门谈合作：他们代为管理海南，唐生明只需继续扮演英雄就好，彼此之间互不干扰。从日本人手中保护这座热带岛屿让唐生明名利双收，而他更惊诧于共产党的手竟然伸得那么远。合作，他接受了，同时还变得谦逊异常——没抱怨过饮食粗粝，没指责过手下粗野，也不会自居理所当然的统治者。\n老子讲，我无事而民自富，我无为而民自化。因这无为的合作，唐生明主席的南国遗珠正大有可为。"

 QYC_Feng_Baiju: "冯白驹"
 QYC_Feng_Baiju_desc: "扬起红旗，亮出镰锤，戴好红星。\n\n冯白驹已经没有必要再顶着“海南地方维持会会长李鸣双”的头衔度日了，自雷州、武汉、北京三地爱国民众起义之后，唐生明将军通电全国宣布海南脱离国民政府自治，并将海南日常治理的工作交给了自己；令人欣喜的是，不仅国内已经开始掀起反日救国运动的风暴，数年前支援起义的东南亚革命政权也宛如尖钉一样牢牢钉死了共荣圈的大后方——东京赖以掠夺剥削的原料产地已经变成了深不见底的泥潭，半个共荣圈已然名存实亡。\n\n现在，冯白驹偶尔会在屋里的中国地图面前驻足，凝视着陕西——共荣圈分崩离析的抗日愿景已经完成了一半，而接下来的最终一击，就要交给西北的党中央了……"
 QYC_Henshin_tt: "§Y海南§!将§m撕下长久以来的伪装……§!"
 #民族精神
 SEA_fake_idea: "[Get_SEA_fake_idea]"
 SEA_fake_idea_desc: "[Get_SEA_fake_idea_desc]"
 SEA_a_PERFECT_pretender: "双簧"
 SEA_a_PERFECT_pretender_desc: "卷起红旗，藏好镰锤，摘下红星。\n\n为了在敌人眼皮子底下生存，海南展开了一场绝密情报伪装。现在，中共海南支部有一个更为南洋地区所熟知的名字——“海南地方维持会”。\n\n作为中华民国海南省政府的重要助手，海南地方维持会以本地乡贤为骨干力量。海南支部各级干部纷纷戴上高帽穿上长袍，化身地主乡贤，在唐生明省主席的掩护下进入各地政府任职。而唐主席则动用私人关系请教师训练支部干部日语技能，双方一唱一和演双簧，共同经营海南，开辟风景名胜旅游区攫取日本游客的金钱，再利用这笔资金掺和政府税金一面定期向南京中央缴税，一面资助东南亚抗日民主势力的走私航线……\n\n——如此一来，日本人享受到了海南风景，南京政府省去了经营南岛的精力，而我们也得以暗中经营抗日势力。\n\n优秀的双簧演员就是要让所有人都很开心，很显然，我们做到了。"
 SEA_a_PERFECT_hainan: "乡贤辅政"
 SEA_a_PERFECT_hainan_desc: "唐生明将军自来琼上任便为海南拟定了一套独特的发展策略：重用本地乡贤，着重发展海产品产业及旅游业。\n\n1953年出台的《海南省扶产兴民条例》中明确规定，凡海货出产或游客观赏所带来的收益，可抵扣原定上缴省府之各项税款，若应缴税款已齐全，则其盈余全归地方自行决断用途。这一下放财权的举动很快激发了海南地方乡贤建设家乡扩大渔产的热情，海南经济民生得以迅速恢复，且财政收入连年盈余，受到南京中央政府的称赞。"