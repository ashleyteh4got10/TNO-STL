 #国家领袖
 MFN_Wu_Lanfu: "乌兰夫"
 MFN_Wu_Lanfu_desc: "乌兰夫是地地道道的蒙古人，但他一直是中国共产党的忠实信徒。少年时曾受到中共早期人物们的共同资助，汉人的开明和善意俘获了乌兰夫的信任。随着日本开始侵略内蒙古，乌兰夫受党委指派前往西蒙一带进行活动，一度促成一场革命暴动，给日军予痛击。现在，中国输了，中共抵抗力量捉襟见肘，只剩乌兰夫一人在苦苦支撑，十年如一日地维持着阴山根据地。"
