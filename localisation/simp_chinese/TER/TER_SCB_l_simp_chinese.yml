Alert_SCB_rev_enabled_Desc: "当前有地区可§x策动革命§!，您可以选择立即在该地策动抵抗武装，也可等待一段时间§Y以继续壮大抵抗力量§!，点击此处以打开£CPC_texticon §R中国共产党-华南局§!进行操作。"