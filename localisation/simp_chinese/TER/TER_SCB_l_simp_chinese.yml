SCB_QYC_CPC_modifier: "下南洋"
SCB_QYC_modifier_desc: "南洋航线网络是我们的生命线。我们需要利用各种民间名义：通航、经商、转运等等，与东南亚各国兄弟党派紧密联系，互帮互助，携手共进。这是冯白驹书记为根据地指出的发展路线。\n\n相信只要经营得当，这张秘密贸易网络将成为我们§R摧毁共荣圈§!，进而打倒£GNG_japanese_frustration_texticon §j日本帝国主义§!的§G强大武器§!。"
SCB_QYC_modifier: "下南洋"
SCB_QYC_modifier_desc: "[Get_SCB_QYC_modifier_desc]"
SCB_QYC_modifier_desc_CPC: "南洋航线网络是我们的生命线。我们需要利用各种民间名义：通航、经商、转运等等，与东南亚各国兄弟党派紧密联系，互帮互助，携手共进。这是冯白驹书记为根据地指出的发展路线。\n\n相信只要经营得当，这张秘密贸易网络将成为我们§R摧毁共荣圈§!，进而打倒£GNG_japanese_frustration_texticon §j日本帝国主义§!的§G强大武器§!。"
SCB_QYC_modifier_desc_other: "尽管海南的自然禀赋较为匮乏，但依靠有利地理位置外加唐省长和李会长多年来的苦心经营，海南已经建立起远起印尼近至广东的贸易网络，俨然成为共荣圈内重要的贸易节点。\n\n东京和南京的一些乐天派经济学家甚至高调表示，海南口岸经济潜力极高，只要肯加以开发，必将成为自£MAN_manchukuo_texticon §f满洲§!、£GFX_GNG_Guangdong_texticon §S广东§!之后又一处£GNG_japanese_frustration_texticon §j泛亚经济§!的新模范。"

SCB_CPC_modifier: "华南局"

SCB_trade_buff_title: "海南贸易增益简报"
SCB_trade_buff_desc: "月度人口\n[?QYC.SCB_QYC_monthly_population|+1%]\n\n稳定度\n[?QYC.SCB_QYC_stability_factor|+1%]\n\n生产效率增长\n[?QYC.SCB_QYC_production_factory_efficiency_gain_factor|+1%]\n\n工厂产出\n[?QYC.SCB_QYC_industrial_capacity_factory|+1%]\n\n初始生产效率\n[?QYC.SCB_QYC_production_factory_start_efficiency_factor|+1%]"
SCB_trade_weapon_desc: "轻武器获取：[?QYC.SCB_QYC_light_amount|+0]\n\n重武器获取：[?QYC.SCB_QYC_heavy_amount|+0]"
SCB_trade_burden_desc: "通航承载量：§Y[?SCB_trade_burden_value|0]§!%\n\n日本警觉：§R[?SCB_JP_alert_value|1]§!%"
TER_SCB_btn_sp_trade: "启动零散贸易"
TER_SCB_btn_sp_trade_desc: "本功能仅限当前通航承载量大于等于§Y90%§!且小于§Y100%§!时可启用，旨在充分利用富余航运资源改善海南经贸环境。\n\n本功能将使当前通航承载量锁定为§Y100%§!，并给予海南全门类增益加成§G2%§!（不包括武器贸易）。当华南局通航地区有所变动时，本功能即自动取消，需要重新手动启动。"
TER_SCB_Hainan_graph_info: "本表格可以帮助您直观地看到§G琼崖纵队§!当月从东南亚地区贸易中获得的增益，并能决定轻重武器分配比重。\n\n在本表格中，§Y步枪、支援装备、单兵反坦克装备、单兵防空装备§!被视为轻武器，§Y火炮、卡车§!被视为重武器，点击§G绿色方框§!即可§G勾选§!对应栏目，若有多种同类装备被勾选，则遵循平均分配原则在下月配发相应数额装备至琼崖纵队库存中。\n\n通过华南局暗中开辟的陆运通道，§G阵线和党中央§!也能收获少量海南贸易带来的增益，具体数值为海南贸易修正列表中全门类增益的§G20%§!（不包括武器贸易）。"
TER_SCB_generic_info: "[TER_SCB_generic_info]"
TER_SCB_generic_info_1: "当前选中：§Y[TER_SCB_tagnames]§!\n\n对应菜单为：§m华南局备忘录、海南月度贸易简表§!。\n\n§m华南局备忘录§!\n-为应对长期敌后抗战需要，1945年，刘少奇、朱德、周恩来、任弼时、董必武等同志集体向党中央提议建立§G华南局§!，并由叶剑英、肖向荣等同志负责华南局运转和联络，§m华南局备忘录§!即为1945年至今华南局重要工作文档合集。\n\n§m海南月度贸易简表§!\n-作为华南局工作的重要成果，§G琼崖纵队§!自五十年代起便在海南全面转入地下战线，多位海南支部负责同志已经通过伪造身份、冒名顶替等多种方式入职海南伪政府重要职位，情报伪装衣为海南暗中展开对东南亚地区的秘密贸易成为可能，经过十五年发展，如今海南与§Y东南亚沿海国家与地区§!均有密切联络与贸易往来，并已经与越南、缅甸、柬埔寨三地的共产主义抵抗武装取得了联系。§m海南月度贸易简表§!将能直观展示§G琼崖纵队§!贸易活动的各项主要信息，并提供了一些细节修改选项以优化贸易效率。"
TER_SCB_generic_info_2: "当前选中：§Y[TER_SCB_tagnames]§!\n\n对应菜单为：§m贸易界面、革命界面§!。\n\n§m贸易界面§!\n-§Y东南亚沿海国家与地区§!均与§G琼崖纵队§!建立了贸易联系，我们每个月可调整一次这些地区与海南的§Y贸易航运状态§!，并进行一些额外操作以提升§Y贸易意愿§!或降低§R日本警觉度§!，更详细信息请查看§m贸易界面§!中的§Y信息图标§!。\n\n§m革命界面§!\n-§Y越南、柬埔寨、缅甸§!三地拥有成规模的反抗武装，是华南局为§G琼崖纵队§!指定的秘密援助地区，我们将能够通过§G琼崖纵队§!向这些特定地区开展秘密的革命援助行动，§Y每月对每一地区仅可展开一次行动§!，如果这些地区同时§G正处于通航贸易状态§!，那么每月还将随机增加§Y1级战备等级§!，§Y战备等级§!越高，革命军队在发动武装政变时的准备就越充足，§G胜算也将越高§!，更详细信息请查看§m革命界面§!中的§Y信息图标§!。"
TER_SCB_trade_info: "§m贸易界面§!\n----------\n本界面主要功能为调整§Y选中地区§!与海南的§Y贸易航运状态§!，并进行一些额外操作以提升§Y贸易意愿§!或降低§R日本警觉度§!。\n\n§Y贸易意愿§!\n-该地区的贸易意愿直接影响§G琼崖纵队§!可从该地区获得多少增益，增益数值由该地§Y产业结构§!及§Y地区等级§!共同决定。\n\n§R日本警觉度§!\n-任一地区贸易意愿高于50%且正在开运时，日本警觉度将开始增长，增长幅度由§Y该类地区数量§!与其§Y贸易意愿§!共同决定：通航地区§Y越多§!、贸易意愿§Y越高§!，日本警觉度增长幅度§R越快§!。\n\n§Y通航承载量§!\n-海南的航运承载能力有限，§R不能§!同时与所有可贸易地区保持贸易航运，具体而言，一个地区的§Y地区贸易等级§!越高，代表其§Y产业物资§!越丰富，则占用的§Y通航承载量§!就越多，一旦海南的剩余§Y通航承载量§!不能满足当前选中地区的§Y地区贸易等级§!，则该地区将无法展开贸易行动，因此，§Y请谨慎决定贸易地区分配§!。\n-具体公式为：\n§Y该地占用通航承载量§!=§Y该地区贸易等级§!*5*100%"
SCB_trade_btn_admit_tt: "点击以§G勾选§!/§R取消勾选§!"

SCB_stop_trade_btn_tt: "点击切换至§Y停运状态§!\n----------\n选择此项将暂停§G琼崖纵队§!与该地区的秘密贸易，并§G降低§!§Y10%§!§R日本警觉度§!。\n\n保持§Y停运状态§!将以§Y10%-30%§!幅度降低该地区§Y贸易意愿§!直至归零。"
SCB_begin_trade_btn_tt: "点击切换至§Y开运状态§!\n----------\n选择此选项将开始§G琼崖纵队§!与该地区的秘密贸易，根据该地区§Y等级、产业结构、贸易意愿§!给予§G琼崖纵队§!不同的收益，该地区§Y贸易意愿§!超过§Y50%§!时，将引起§R日本的警觉§!。\n\n保持§Y开运状态§!将以§Y10%-30%§!幅度提升该地区§Y贸易意愿§!。"
SCB_friendship_btn_tt: "点击§G改善贸易关系§!\n----------\n选择此选项将以§Y15%§!幅度提升该地区§Y贸易意愿§!，仅开运地区可点击此选项，每月限一次。"
SCB_ease_tension_btn_tt: "点击§G缓和日本警觉§!\n----------\n选择此选项将以§Y2.5%§!幅度降低§R日本警觉度§!，仅开运地区可点击此选项，每月限一次。"
TER_SCB_JP_alert_tt: "当前日本警觉度：§R[?SCB_JP_alert_value]§!%\n----------\n§R日本警觉度§!每月增长幅度=所有§Y高于50%贸易意愿地区§!的贸易意愿之和/100。\n\n§R日本警觉度§!高于50%时，除§Y停运§!外，§R缓和按钮不再可用§!。\n§R日本警觉度§!达到100%时，§x全域禁运，华南局gui界面将不再可用§!。"
SCB_trade_will_value_tt: "当前地区贸易意愿：§Y[?SCB_trade_will_value]§!%\n----------\n贸易意愿在40%以下，生活消费品门类增益（§Y月度人口、稳定度、生产效率增长§!）生效。\n贸易意愿在40%-70%，重工业贸易增益（§Y工厂初始产出、初始生产效率§!）及上述增益生效。\n贸易意愿高于70%，武器工业贸易增益（§Y每月武器获取§!）及上述增益生效。"
TER_SCB_revolution_info: "§m革命界面§!\n----------\n本界面主要功能为暗中支援§Y目标地区§!，该界面拥有三个指标：§Y凝聚力、装备率、组织度§!，该三类指标的最高等级均为§Y5级§!，当该三个指标的等级均达到§Y3级§!以上，便可选择在目标地区§x策动革命§!。\n\n§Y战备等级§!越高，则§x策动革命§!时当地同志的力量越强大。\n\n具体效果如下：\n均达到Lv.3时：将在根据地出现§Y装备率80%，训练程度为Lv.2的师单位§!。\n\n均达到Lv.4时：将在根据地出现§G装备率100%，训练程度为Lv.3的师单位§!，并获得一个§G增益精神§!直至战斗结束。\n\n均达到Lv.5时：将在根据地出现§m装备率100%，训练程度为Lv.5的师单位§!，并获得一个§m更强力的增益精神§!直至战斗结束。"
TER_SCB_rev_level_btn_unify_tt: "舆论宣传\n----------\n选择此项将花费§Y50§!£pol_power §Y政治点数§!提升该地区§G1级§!的凝聚力。"
TER_SCB_rev_level_btn_org_tt: "军事代表\n----------\n选择此项将花费§Y50§!£command_power §Y指挥点数§!提升该地区§G1级§!的组织度。"
TER_SCB_rev_level_btn_equip_tt: "装备运输\n----------\n选择此项将从§G琼崖纵队§!调拨§Y100单位步枪、100单位支援装备、20单位火炮§!提升该地区§G1级§!的装备率。"
TER_SCB_start_the_storm_tt: "§x策动革命§!\n----------\n当下列三个指标的等级均达到§YLv.3§!以上，便可选择在目标地区§x策动革命§!，§Y战备等级§!越高，则§x策动革命§!时当地同志的力量越强大。"

