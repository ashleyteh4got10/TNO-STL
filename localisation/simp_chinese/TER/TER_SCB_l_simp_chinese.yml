Alert_SCB_JP_alert_50: "§R日本警觉度§!逼近§Y50%§!！"
Alert_SCB_JP_alert_50_Desc: "目前§R日本警觉度§!逼近§Y50%§!！请尽快通过§Y缓和关系§!或§Y停止航运§!等措施降低§R日本警觉度§!，点击此处以打开£CPC_texticon §R中国共产党-华南局§!进行操作。"
Alert_SCB_JP_alert_100: "§R日本警觉度§!逼近§R100%§!！"
Alert_SCB_JP_alert_100_Desc: "目前§R日本警觉度§!逼近§R100%§!！请尽快§Y停止航运§!以降低§R日本警觉度§!，否则§x我们将面临全域禁运的后果§!，点击此处以打开£CPC_texticon §R中国共产党-华南局§!进行操作。"
