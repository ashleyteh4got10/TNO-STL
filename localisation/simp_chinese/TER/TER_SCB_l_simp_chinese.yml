CPC_SCB_tutorial_tt: "提示：每月可在§G可策动革命地区§!点击§Y其彩色相片§!来提升§Y战备等级§!，每月各地区也会§G自动提升一级随机等级§!，当§G均到达3级及以上§!时，可点击§R五角星按钮§!以§G策动革命§!，等级§G越高§!，起义队伍§G越强§!。"
CPC_SCB_entry_tt: "点击打开£CPC_texticon §R中国共产党-华南局§!GUI"
SCB_NAME: "§G华南局§!"
SCB_tag_info: "§Y[TER_SCB_tagnames]§!\n$SCB_tag_level$"
SCB_tag_level: "Lv.§Y[?SCB_level|0]§!"
SCB_Burma_tagname: "缅甸"
SCB_Burma_tagdesc: "缅甸，位于中南半岛西部。东北与中国毗邻，西北与东印度接壤、东南与老挝、泰国交界，西南濒孟加拉湾和安达曼海，海岸线长3200公里。地势北高南低、西部为南北纵行的若开山脉，大部地区海拔在1800米以上，缅印边界上的沙拉马山海拔3826米，东北部为掸邦高原。介于西部山地和掸邦高原之间为伊洛瓦底江谷地。伊洛瓦底江长2150公里，为航运大动脉。萨尔温江在缅境内长1660公里。"
SCB_Thailand_tagname: "泰国"
SCB_Thailand_tagdesc: "泰国，位于中南半岛中部，东部、东北部、西和西北部与柬埔寨、老挝、缅甸为邻，南部与马来亚接壤。东南临泰国湾，西南濒安达曼海。海岸线长2600多公里。境内大部分为山地和高原，中部湄南河流域为平原，北部地势最高，森林密布。英坦昂峰海拔2576米，为全国最高峰。他念他翁山纵贯泰、缅边境。湄南河流经中部，全长1200公里。他里式湖有水道与泰国湾相通，为一泻湖。"
SCB_Vietnam_tagname: "越南"
SCB_Vietnam_tagdesc: "越南，位于中南半岛东部，北连中国，西界老挝、柬埔寨，东和东南部临南海。海岸线长3260公里。地形狭长，地势西高东低，境内3/4为山地和高原。北部和西北部为高山和高原，最高峰黄连山的番西邦峰海拔3142米。中部长山山脉南北纵贯于越南、老挝、柬埔寨边境。红河和湄公河三角洲地区为平原。主要河流有北部的红河，南部的湄公河。多良港、岛屿。"
SCB_Laos_tagname: "老挝"
SCB_Cambodia_tagname: "柬埔寨"
SCB_Cambodia_tagdesc: "柬埔寨，位于中南半岛南部，东和东南部、北部、西北部分别与越南、老挝和秦国为邻。西南濒泰国湾，海岸线长460公里。中部和南部是平原，东部、北部和西部为山地、高原，大部分地区被森体覆盖。境内有长山山脉、扁担山脉、豆蔻山脉。最高峰奥拉山海拔1813米。湄公河在境内约500公里。洞里萨湖是中南半岛的最大湖泊，低水位时面积2500多平方公里。"
SCB_Indonesia_tagname: "印尼群岛"
SCB_Indonesia_tagdesc: "印度尼西亚，位于亚洲东南部，地跨赤道。由太平洋和印度洋之间13667个大小岛屿组成，素称千岛之国，海岸线长3.5万公里。主要岛屿有爪哇、苏门答腊、加里曼丹南部、伊里安西部、苏拉威西等。地形以山地和高原为主，仅沿海有平原。除加里曼丹岛外，各岛均有活火山，地震频繁。伊里安岛的查亚峰海拔5030米，为全国最高峰，顶峰终年积雪。最长的河流为爪哇岛的棱罗河，全长560公里。岛屿之间构成许多海峡与内海，其中巽他、马六甲海峡等是沟通印度洋和太平洋的通道；内海有爪畦海、苏拉威西海等。"
SCB_Malaya_tagname: "马来亚"
SCB_Malaya_tagdesc: "马来亚全境被南海分成东马来亚和西马来亚两部分。西马位于马来半岛南部；沙巴地区和沙捞越地区合称东马，位于加里曼丹岛北部。海岸线总长4192公里。西马地势北高南低，中部为山地，东、西两侧沿岸为冲积平原。大汉山为最高峰，海拔2190米。西侧的霹雳河、东侧的彭亨河为最长河流。沙捞越地区西部沿海为冲积平原，内地是丘陵和山地，多为森林覆盖，山峰多在2000米左右。沙巴地区西部为沿海平原，内地多森林覆盖的山地。西部的克罗克山脉纵贯南北，其主峰基纳巴卢山海拔4101米，是东南亚最高峰。"
SCB_Philippines_tagname: "菲律宾"
SCB_Philippines_tagdesc: "菲律宾，位于亚洲东南部的群岛国家。北隔巴士海峡与台湾岛遥遥相对，南、西南隔苏拉威西海、苏禄海、巴拉巴克海峡与印度尼西亚、马来亚相望。西濒南海、东临太平洋。海岸线长18533公里。由7107个大小岛屿组成，其中吕宋岛，棉兰老岛、萨马岛等11个主要岛屿约占全国总面积的96%。山地占全国总面积的3/4。多活火山，地震频繁。棉兰老岛的阿波火山为全国最高峰，海拔2955米。富良港和海峡，河流短促，不利航行。"
SCB_Huanan_tagname: "华南局"
SCB_Taiwan_tagname: "台湾岛"
SCB_Taiwan_tagdesc: "台湾位于中国东南的大陆架上，由台湾本岛及周围附属岛屿和澎湖列岛等大小共88个岛屿组成。台湾本岛的形状酷似纺锤形，东濒西太平洋，南有巴士海峡与菲律宾相距约300公里，东北与日本琉球群岛间相距约600公里，西隔台湾海峡与福建省遥相招望，地当我国东南海上交通和西太平洋南北航线的要冲，为我国东南大陆通往太平洋及南海的海上门户。台湾岛总面积为36000平方公里，其中，台湾本岛面积35798平方公里，本岛周围的附属岛屿有23个，面积为74.8平方公里。东部和中部大部分是高山与丘陵，海拔500米以上山地约占面积1/3，海拔3000米以上高峰达200余座，主要山脉有中央山脉，玉山山脉，雪山山脉，阿里山脉，海岸山脉。大小河流600余条，河流总长度42000余公里，海岸线总长约1140公里。"

