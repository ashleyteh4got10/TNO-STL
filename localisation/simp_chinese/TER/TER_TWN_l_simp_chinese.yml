TWN_Ohashi_Hideo: "大桥秀雄"
TWN_Ohashi_Hideo_desc: "大桥秀雄的人生应当可用“惊愕”二字概括。是的，你没有听错，“惊愕”。\n\n当初在结办佐尔格案时，他仅仅在报告上多写下一句“或许不应该判死刑”，他的职涯发展便被惊愕地画上了一个“不忠”的记号，难以洗刷。由于佐尔格案的影响，大桥被排除出了陆军、满洲国，及特高系统，战后只能屈就于影响力较低的警政系统，成为一个“货真价实”的警官。\n\n惊愕的转折在数年后到来：旅居东京的台湾人在民族抗争上取得一定进展，国会决议结束台湾总督府总动员状态，重返后一次世界大战时代的“荣景”。然而台湾当地赤祸依旧，曾亲身与共产党搏斗的官僚却所剩无几，永田町内阁在茫茫宦海中挑来拣去，最后终于盯上这位侦办佐尔格案的“大桥警察官”，于是，已临花甲之年的大桥秀雄正式完成了从“警督”到“总督”的身份蜕变，登临台湾岛权力的最高峰。\n\n军方留下的烂摊子不少，大桥自己所要面对的问题则更多，无论是面对那些为自身地位焦虑至癫狂的日本移民、因长期被歧视而心怀愤懑的本地人民，又或是总督府评议会里早已与他结怨多年的老相识。\n\n对大桥而言，在台北的职业生涯并不比在东京容易半分。如何安全地从这惊愕的仕途最终章离去，大桥暂时没有头绪。"
