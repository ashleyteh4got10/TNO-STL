TWN_Baojia_System: "濒临崩溃的保甲制度"
TWN_Baojia_System_desc: "保甲制度曾是清帝国的高压统治手段，也曾在台湾纳入日本版图后由继承政策的总督府发挥镇反功能。然而随着日本移民的增多，日侨新村与本地村庄的界线逐渐模糊，纵使频繁更新名册也无法杜绝保甲内日益丛生的日侨犯罪问题，原有的连坐制度更导致台日民族冲突问题不减反增。\n\n在反对为日侨罪行负责的台湾人与拒绝受保甲体制监视的日本移民之间，总督府急需一套新的安保政策，而在那之前，保甲制度将继续执行，无论这代表有多少台湾人需要为与他们无关的罪行负责。"
TWN_communist_propaganda: "如芒在背"
TWN_communist_propaganda_desc: "自日本共产党在本岛的根据地完全被捣毁后，台湾便成为了日共的重要根据地，直到战后仍有些许杂音迸出。也因此，在五十年代军警政务交接前夕，总督府发动了有史以来最大规模的一次搜捕行动，潜藏在三芝农村的谢雪红被送到了马场町，一声枪响似乎代表着台湾从此不受“赤魔”威胁。\n\n可这一切就这么尘埃落定了？荣町街头不时能见到几张胡乱贴上的毛泽东思想宣传海报；东北矿区的矿工拥有与地方财阀叫板的勇气；南部的甘蔗农夫们更是开窍似地逼迫政府取缔不良会社，一切事物都在显示，台湾社会当中，仍有一股看不见的赤色力量正试图推翻一切秩序，无论是经济上的、思想上的，抑或是政治上的。"
TWN_in_the_core_of_storm: "浊流之中"
TWN_in_the_core_of_storm_desc: "自出版之日起，《亚细亚的孤儿》就在共荣圈所有书架上被查禁，然而其核心价值仍被传达各地，提醒人们即便在共荣圈的核心地区，仍有嗷嗷待哺，却从未被受到注意的贫瘠岛屿。\n\n由于尴尬的历史，台湾早已成为中日两国之间避而不谈的话题：中华民国驻台北领事馆无甚作为，而日本移民新村仍在各地大兴土木。岁月的冲刷使本地人日渐麻木，民族认同也日益飘散。\n\n台湾的未来在何处？这个答案早已随着新秩序的缔造而陷入浊流之中，要想找到答案，除非有一位挑战者，一位试图撕毁新秩序丑恶嘴脸的革命家……"

TWN_news.0.t: "[Get_newspaper_header]《台湾地方法》获得通过"
TWN_news.0.desc: "日本政府日前正式宣布通过《台湾地方法》，此法案在台湾岛内引发了各界剧烈反应。台湾本地民众对该法案表示强烈支持，认为这是争取自身权利的重要一步；而岛内日侨群体则普遍表达了深切忧虑与强烈反对。\n\n地方法内容主要包括扩大台湾本地民众选举权范围，又缩小了日裔议员的分布比例，同时又确保了未来选举中国会下院将有台湾代表席次。台民对该法案的支持，来自于多年来在选举权方面的期盼。许多台籍民众认为，这是日本当局对台湾人政治权利的首次重大让步，是推动地方自治的重要一环。然而，岛内的日侨对法案的通过深感不安，认为此举将削弱他们在台湾地方政治中的影响力与话语权，甚至担忧可能失去长久以来的优越地位。"
TWN_news.0.a: "台湾地方政治格局的大变局。"
TWN_news.1.t: "[Get_newspaper_header]台府选举临近，民间问题浮现"
TWN_news.1.desc: "近日，一部分日本移民在台湾的团体组织了一次大规模游行，旨在捍卫自身的生存权利。他们要求台湾总督府正视日本移民的生活现状，并重新审视其在台湾的公民参政资格，确保其在地方政治中的公平参与。\n\n面对这一局面，总督府方面尚未发表明确回应，但据内部消息人士透露，当局正在讨论如何应对这些日本移民的诉求，以避免此次事件对即将到来的选举结果以及选举管理带来不良影响。部分观察者认为，这一问题若处理不当，可能会对未来的选举进程产生不可忽视的冲击。"
TWN_news.1.a: "无言的山丘能否开口？"
TWN_news.2.t: "[Get_newspaper_header]台府拒绝镇压游行，大桥总督下台"
TWN_news.2.desc: "近日，台总督府面对声势浩大的抗议浪潮，决意不予以强制镇压。然而此举未能平息风波，反而导致全台范围内接连爆发严重冲突，社会秩序受到严重影响。\n\n据日台官媒消息，台湾总督大桥秀雄因事态严重，已于日前提前撤职，启程返回日本。现由奥野诚亮总务长官暂时代行总督职务，负责看守政务，直到新任总督到任接掌大局。\n\n奥野诚亮在声明中强调，总督府当局希望以和平方式解决问题。舆论普遍认为，大桥总督在此敏感时刻去职，颇具耐人寻味之处。此后形势如何发展，新任总督能否稳定局面，尚待观察。"
TWN_news.2.a: "黑雾降于全岛之上。"
TWN_news.3.t: "[Get_newspaper_header]台府镇压游行，全岛秩序渐稳"
TWN_news.3.desc: "近日，面对日本移民大规模抗议浪潮，大桥秀雄总督当局态度坚决，以维护选举秩序为重，果断出手，强制驱散了二代日本移民的聚集行动。大桥当局强调，台总督府绝不允许任何干扰选举进程的行为。\n\n此番举措，虽在日本侨界中引发不满情绪，然而各方在台当局的高压态势下不敢贸然行动，虽有不平之声暗流涌动，但未敢再行集会抗议。台湾社会表面秩序已渐渐恢复平静，市面已不见先前的骚动与人心惶惶。\n\n多方分析认为，大桥当局此番强力手段虽暂时平息了局势，但仍未能彻底化解日侨群体与台当局间的矛盾。此后发展，尚需持续关注。"
TWN_news.3.a: "时间会证明一切。"
TWN_news.4.t: "[Get_newspaper_header]第二届台湾博览会即将召开"
TWN_news.4.desc: "新任台湾总督[TWN.GetLeader]近日在特别召开的新闻发布会上确定，东京国会批准追加了1965年度台督府预算，为纪念台湾总督府建政70周年，第二届台湾博览会将于1965年10月召开。\n\n依据官方披露的博览会规划，台北将在第一届台博会三个主会场的基础上新增一个会场，具体地点目前尚未确定；各地分会场和地方馆的初步构想也已确定。\n\n展会官方同时披露，将与广东国的高精尖企业合作，运用最新的企业科研成果强化安保措施，“要让安保工作也成为共荣圈辉煌科技成就展览的一部分”。"
TWN_news.4.a: "让我们看看广东有多少真家伙。"
TWN_news.5.t: "[Get_newspaper_header]第二届台湾博览会即将召开"
TWN_news.5.desc: "新任台湾总督[TWN.GetLeader]近日在特别召开的新闻发布会上确定，东京国会批准追加了1965年度台督府预算，为纪念台湾总督府建政70周年，第二届台湾博览会将于1965年10月召开。\n\n依据官方披露的博览会规划，台北将在第一届台博会三个主会场的基础上新增一个会场，具体地点目前尚未确定；各地分会场和地方馆的初步构想也已确定。\n\n展会官方同时披露，将采纳满洲方面的建议以“极严厉之手段、极高压之态势”强化安保措施，应对日益猖獗的台湾地下组织。"
TWN_news.5.a: "台博会也放恐怖电影吗？"
TWN_news.6.t: "[Get_newspaper_header]台博会爆破事件！"
TWN_news.6.desc: "近日，台湾警方对非法组织“台民盟”的秘密行动多次侦查未果，未能成功阻止其在台湾博览会开幕式上的暴力举措。台民盟在博览会首日于各展馆暗中部署炸弹，各处展场皆遭受不同程度的爆炸袭击，现场一片混乱，伤者无数。\n\n最令人震惊的是，正在参观的皇太子明仁也在袭击中受伤。日方紧急调动航空力量，将皇太子护送返日进行治疗。皇太子遇袭一事，令各界哗然，日本政府已对此表示严重关切。\n\n台湾总督府面对事态恶化，紧急召开应对会议，并宣布全岛进入高度戒备状态。岛内内各界民众对此事议论纷纷，部分商会和社团对当局未能及时防范深感失望，质疑警方的情报能力；而民间亦有声音对博览会的安全措施表达担忧，台当局已沦为众矢之的。"
TWN_news.6.a: "愚蠢到什么地步才没发现这么多炸弹？"
TWN_news.7.t: "[Get_newspaper_header]台博会爆破事件"
TWN_news.7.desc: "近日，台湾警方加紧侦查，成功查获非法组织“台民盟”在台湾博览会场馆内布置炸弹的图谋，并对其进行了紧急处理。多枚炸弹在警方的及时行动下得以拆除，成功避免了大规模伤亡。\n\n然遗憾的是，仍有部分炸弹未能及时排除，在博览会举办首日相继被引爆，展馆内多处发生爆炸，造成了人员受伤与财物损失。幸运的是，原本针对皇太子明仁的袭击炸弹已在警方行动中成功拆除，避免了一场更为严重的灾祸。\n\n博览会现场虽然一度陷入混乱，但由于皇太子未受伤，日方对台湾当局的应急处理表示理解，并未激化矛盾。岛内群众对于警方行动褒贬不一，部分人安全感得到欣慰，称这是“危中有机，功不唐捐”。但也有声音认为，仍有炸弹被引爆，显示出警方在行动中的疏漏，对此表示担忧。"
TWN_news.7.a: "岛内的安全形势仍不乐观。"
TWN_news.8.t: "[Get_newspaper_header]台博会顺利举办"
TWN_news.8.desc: "据台湾警方报告，非法组织“台民盟”妄图在台湾博览会场馆内布置炸弹，意图制造骚乱的行动，已被警方提前破获。经过连日紧急拆除，所有炸弹已被成功排除，为台博会的顺利开幕日奠定了安全基础，使得博览会首日得以平安无事地进行。\n\n据悉，台湾警方在多方调查与追踪中，发现了台民盟活动的蛛丝马迹，并依据相关线索，迅速出动，进行布控与排查。最终成功在博览会开幕前彻底拆除所有爆炸装置，避免了可能发生的惨剧。\n\n有知情人士透露，警方在行动中获取了部分地下组织的情报。此次事件虽然惊险，但台湾警方的及时应对无疑稳住了局势，得到了社会各界的肯定与赞扬。"
TWN_news.8.a: "谁能知道下次还能否这样幸运？"
TWN_news.9.t: "[Get_newspaper_header]台湾总督府展开全岛大审判"
TWN_news.9.desc: "台湾总督府今日因先前台博会期间发生的骚乱事件，对全岛范围内的政治嫌疑人展开了一次大规模审判。据悉，凡经警方“认定”涉及此事件的嫌疑人，几乎全部被判以死刑，仅少数立场稍显温和者获流放判决。\n\n消息人士透露，此次审判引发社会各界广泛关注，但总督府方面态度强硬，宣称此举旨在“彻底肃清乱党，恢复社会安定”。然而，据地下组织的可靠线索显示，台民盟内部已因此次严厉镇压而迅速走向极端化，其成员对现状不满情绪高涨，未来可能采取更加激烈的行动以回应官方压迫。"
TWN_news.9.a: "事态发展值得高度警惕。"
TWN_news.10.t: "[Get_newspaper_header]台府公布第六届地方选举日期"
TWN_news.10.desc: "台湾总督府今日正式宣布第六届台湾地方选举日期，并同时公布参政及投票资格的相关细则。据悉，此次选举为强化地方自治迈出了重要一步，但背景复杂，备受各界关注。\n\n因先前台博会期间发生的“不详事件”，总督府特别强调，本届选举将采取更为严格的安保措施。警方将在各投票所增派人力，设立安检关卡，以确保选举过程安全、有序地进行。据知情人士透露，防范潜在的滋扰与暴力事件成为本次选举工作的重点之一。\n\n总督府呼吁台湾各界人士冷静理性参与选举，共同维护社会秩序。然而，有评论认为，过度的安保措施或将引发部分选民的不满，甚至进一步加深社会矛盾。"
TWN_news.10.a: "很快将为您带来后续报道……"
TWN_news.11.t: "[Get_newspaper_header]台湾暴动"
TWN_news.11.desc: "日前，台民盟策划学生于各大学校园内罢课事件，引发广泛关注。警方随即介入校内秩序整顿，然此举非但未能平息局势，反而使得警民关系愈加紧张，台北市内气氛骤然升温。\n\n更为震惊的是，台民盟竟凭借不明手段，成功取得岛内广播电台之控制权。如今，全台各地皆响起台民盟鼓动民众与日本人抗争之激烈口号，犹如烈火燎原，迅速传播。台岛各地骚动四起，局势已然失控，暴动之火星已蔓延至全岛。"
TWN_news.11.a: "快戒严——"
TWN_news.12.t: "[Get_newspaper_header]台湾总督府迅速平乱"
TWN_news.12.desc: "台湾总督府于短短两月内果断采取行动，成功平息岛内暴动，引发各界瞩目。据悉，东京当局对总督府此次镇压行动深感满意，并已决定暂不从本岛调动力量支援台湾。\n\n据知情人士透露，此次行动不仅有效遏制了骚乱的进一步蔓延，亦为总督府扫荡岛内反对势力提供了契机。在清剿行动中，多股潜在对抗力量被全面瓦解，部分长期潜藏的地下组织亦遭清除。\n\n总督府发言人声明，台湾治安形势现已全面恢复，民众生活逐步回归正常。同时，总督府亦强调将加强对岛内动态的监控，确保类似事件不再重演。"
TWN_news.12.a: "看不见的地方可能还会有什么东西？"
TWN_news.13.t: "[Get_newspaper_header]东京震怒"
TWN_news.13.desc: "台湾总督府未能在两个月内如期平定岛内骚乱，局势反而愈加恶化，引发东京当局强烈不满。为迅速恢复台湾秩序，东京政府特派新任总督上村健太郎赴台主持全面清乡行动。\n\n据悉，上村总督抵台后即展开雷厉风行的整治措施，其核心目标在于剿灭岛内一切反对势力。至此，台湾本地的绝大多数政治力量已遭全面摧毁，诸多活跃于岛内的地下组织和地方团体尽数覆灭。\n\n东京官方表示，此次清乡行动旨在维护“皇民化政策”的根本落实，绝不允许任何对抗势力破坏台湾稳定。然而，有消息称，上村总督的高压手段已在部分台湾民众中引发恐慌与不满，岛内情绪亟待观察。"
TWN_news.13.a: "你躲得过初一……"