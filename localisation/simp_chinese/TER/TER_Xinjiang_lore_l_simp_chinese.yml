XIN_Sheng_Shicai: "盛世才"
XIN_Ma_Chengxiang: "马呈祥"
Sheng_Shicai_desc: "平心而论，盛世才早年在一众同龄人中绝对算得上是鹤立鸡群的青年才俊。他没有任何不良嗜好，每天衣帽整齐，待人接物彬彬有礼。行军打仗更是科班出身，到日本留过学。由此被前省督金树仁看上，任命他为新疆警备司令。不过，这番拉拢没能扭转盛世才的勃勃野心。\n\n新疆“四一二”政变中，金树仁自顶峰跌落，盛世才抓住机会，宣誓效忠新政府后反手亮出屠刀，当场砍杀三名政变发起者和两名应邀而来的国民党大员，将最高权力收入囊中。\n\n屠刀一举起，就再未放下。用什么词汇去形容盛世才，又不至流于辱骂？“权力的奴隶”一词就非常合适。\n\n经过数场混战，盛世才审时度势，看清苏联在新疆无与伦比的影响力，于是他自称马克思主义者，甚至一度向布哈林请求把新疆作为新加盟国并入苏联，换取共产党对自己的支持。然而，这一切只是盛世才玩弄权术的手段。跟随吉斯卡车进入新疆的不止有金钱和顾问，还有内务部的特务系统。盛世才仿照联共清党自创“大清洗”，在新疆逮捕处决了数万人。所有威胁到他统治的人都难逃一死，就连苏联人也不例外。\n\n当苏联兵败如山倒时，盛世才毫不犹豫地扯下伪装，宣誓效忠蒋介石和三民主义，转身屠杀所有和共产党相关的反贼。然而令盛世才万万没想到的是，蒋介石接见他后很快就死了，没有国民党员承认他在新疆的地位。以及苏联元气尚在，动一动手指就足以把他从权力的奴隶变成真奴隶。\n\n1944年，天山北麓爆发了苏联主导的武装叛乱；死对头马仲英从阿拉木图秘密潜回和阗召集旧部；喀什地区，东突厥运动死灰复燃。他们发下宏愿，要盛世才为死难的同胞们血债血偿。1962年，年近古稀的盛世才龟缩在迪化城里，等待最终的天命降临。"
XIN_a_false_king: "油尽灯枯"
XIN_a_false_king_desc: "盛世才十几年如一日般残忍阴毒的统治激怒了所有人，无论苏联、中共、国民党，还是新疆本地人，又或是他自己的部下都对他恨之入骨。为了躲避仇家追杀，他只能躲在弟弟盛世骐家的一间密室中，过着密不透光的日子。\n\n在盛世骐为兄长精心布置的密室里，墙上赫然挂着一幅书法。书法讲述了东晋时期刘牢之的事迹：这位战功卓著的将军为了个人野心屡次背叛自己的主子，失去所有人的信任。当他最后一次决定背叛时，便立刻被部下抛弃，在躲避追捕的路上绝望自杀。\n\n据说这篇文字第一次映入盛世才眼帘时，使他气得发狂大叫，立刻命人拿出去烧掉。可仆人却无奈地说：“四老爷不准我们动书房里的东西，大老爷还是和四老爷说吧。”"
XIN_vampire_surnamed_Ma: "附骨之疽"
XIN_vampire_surnamed_Ma_desc: "盛世才的嫡系部队在伊宁暴动中损失殆尽，走投无路向当时统治青海的马步芳求援。马步芳一面答应助其平叛，一面准备鲸吞新疆，但不久这份野心被日本人打断。\n\n接掌青海的马继援按既定方略派马步青率骑五军进入新疆，与叛军交战。马步青的女婿马呈祥则进入迪化，假扮一副开明面孔广交人脉，拉帮结派。以至于表面上盛世才仍拥有新疆，实则是马家站在幕后。因而继马仲英后，马呈祥也被称为新疆第二马。\n\n那么，马呈祥的统治较之盛世才有何改变？很遗憾，口头答应的改变有很多，但真正落到实处的凤毛麟角。老实说，他就是仗着一伙扛枪的兵痞到甘肃之外吃白食罢了。"

