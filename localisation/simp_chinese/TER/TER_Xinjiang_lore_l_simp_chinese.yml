ETR_Isa_Yusuf_Alptekin: "艾沙·玉素甫·阿布甫泰肯"
ETR_Isa_Yusuf_Alptekin_desc: "艾沙·玉素甫·阿布甫泰肯出生于南疆喀什市英吉沙县，家庭相对富裕，因此他能同时接受维吾尔人创办的新学教育和中文考学。完成学业后，阿布甫泰肯进入新疆政府成为一个小职员，专门处理在疆俄国人事务。由于业绩出众，1926年被派往乌兹别克斯坦领事馆进行外事活动，并在那里结识了很多泛突厥主义者。但他起初并不认同这些人的思想，甚至还向当局举报过东突厥的秘密活动。\n\n1931年由于金树仁的粗暴统治，哈密发生暴动，虽然动乱最终被平息。但阿布甫泰肯借此向南京政府提议扩大新疆的自治权，这为他积攒了不少声望。而在1933年第一次东突厥暴动中，阿尔普泰肯受邀成为维吾尔代表，但还是刻意与东突厥保持距离，这让他能逃过马仲英的清算。\n\n阿布甫泰肯是个八面玲珑的温和派，整个三十年代他一直在追求一种既不激怒汉人统治者，又能使新疆脱离中国成为众望所归的路子。抗日战争爆发后，阿布甫泰肯以中国穆斯林的身份代表国民党政府出访埃及、叙利亚和土耳其等国，既为中国招徕国际支持,也将新疆独立的愿望广而告之，可谓一箭双雕。\n\n残暴的盛世才在1944年被推翻，苏联支持维吾尔留学生在北疆建立伊犁政府，哈萨克斯坦外交部同时暗中联络阿布甫泰肯，希望他出面主持喀什独立：“只要接受苏联指导，无论您信仰什么，追求什么，我们都会无条件支持您”。重庆政府迟迟没消息，盛世才身败名裂，形势瞬息万变，只有独立后采取高姿态要求各方和平解决争端，才能使自己立于不败之地。阿布甫泰肯仔细盘算之后，以“东突厥斯坦”的名义宣布脱离中国，但其他新疆势力并没能按他的构想不战而降，§R战争必须进行下去§!。"
ETR_under_the_FUCKING_sun: "赤日炎炎"
ETR_under_the_FUCKING_sun_desc: "在十九世纪六十年代，面对英国和俄罗斯帝国主义的威胁，东突厥民族开始了一场自救启蒙运动，并一直持续到如今共和国成立，拥有自己的国家。\n\n苏联崩溃后，日本竭力扩展自己在中亚的存在。不过他选择阿富汗作为盟友，势必受到其他突厥国家敌视。但是，我们已经拒绝任何共产党势力介入，只能与日本建立友好外交关系，获取他们的支持，东突厥民族向现代化迈进才不会是一场梦。"