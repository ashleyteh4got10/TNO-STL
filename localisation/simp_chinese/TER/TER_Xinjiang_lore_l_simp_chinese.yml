ROS_Saifuddin_Azizi: "赛福鼎·艾则孜"
ROS_Saifuddin_Azizi_desc: "十岁之前，赛福鼎只是喀什城外一户富商之子。每天清晨早起，朝礼拜寺方向跪拜、颂扬安拉不止，尚不知晓自己与苦命人有何关系。\n\n十三岁时，父亲经商失利，家中顿时一贫如洗。赛福鼎挑起养家糊口的重担，他当过佃户，充过小贩，最后做起了裁缝。四年时间，世道的艰辛磨砺了他的胆略。喀什政府为扩军强征马匹，赛福鼎的村子也在摊派之列。看着曾陪伴父亲的大马被几个兵痞呵斥驱赶，他热血上涌，趁着夜色溜进政府的马场，解开所有缰绳，把马放得一干二净。\n\n这次不法行为让赛福鼎懂得反抗的意义，母亲对忽然长大的孩子也另眼相看。当喀什城外的维吾尔农民争相暴动反抗省督金树仁时，母亲含着泪同意儿子加入起义军，一起打进县城：“这是你爸爸的愿望。”走在得胜后的喀什街上，赛福鼎看到汉人们战战兢兢，戴着滑稽的色兰一步一跪，蹩脚地念叨着安拉胡安克巴，心里比起同情，恐怕更多是胜利的喜悦。\n\n省督金树仁很快被部下推翻，反抗军幸存下来接受诏安。赛福鼎被选拔为喀什行政公署的秘书，期间还见识到玩弄新疆于股掌之上的苏联。在盛世才和马仲英之外，苏联仍计划培植第三势力。1934年，赛福鼎被公派留学乌兹别克斯坦，容光焕发的中亚令他耳目一新——原来维吾尔人是突厥民族的一支，而联共支持突厥民族独立自主。留学归来的赛福鼎准备掀起革命，结果一入境就被盛世才软禁，直到1944年，表哥阿巴索夫领导的伊宁暴动将他从冷狱中解放。\n\n伊宁暴动由秋明联共中央指示，哈萨克斯坦执行，鼓动新疆的突厥民族组建革命联盟，反抗盛世才的统治，“建立新国家”。但联盟不是组织严密的政党，内部存在根本分歧，地主和宗教人士高声畅谈伊斯兰国，左派知识分子们则憧憬民主共和国。苏联顾问瓦西里警告赛福鼎，小心宗教首脑和封建领主水涨船高的权威，建议及时清理阶级敌人。然而，日本特务泄露了消息，挑动伯克、大商人们裹挟哈萨克民军叛乱。叛军迅速奔袭伊宁首府，阿巴索夫仓促组织防御，但寡不敌众被追兵击杀。\n\n在苏联的强大压力下，残存的联盟接受重组，分民族分区建党，收编各地零散的起义军，对反动势力实施专政。赛福鼎成为阿巴索夫的继承人，在苏联军官的帮助下，领导军队阻止分裂。1947年，中国共产党斡旋制止马继援入侵北疆，给了赛福鼎一线生机。可当笑容可掬的中共代表进入塔城，建立维吾尔斯坦的梦想就被暂时搁置——不，不是暂时，或许……或许是永远！"
ROS_weakened_trade: "驼铃声稀"
ROS_weakened_trade_desc: "月隐星沉，伊宁城郊的国际贸易站寂静无声。从前络绎不绝的哈萨克商队，如今屈指可数。零星旅者敲开旅店大门，带来哈萨克斯坦日渐动荡的流言，催动着境内哈萨克人回归祖国，探望家人。\n\n与哈萨克人一起离去的还有稳定的经济。贸易停止造成了巨大的供给缺口，通货膨胀居高不下。地区间的商品流通趋于萎缩，乡野公路无人夜行。\n\n为了划分有限资源，兄弟民族间纠纷不断，甚至超过政府的日常工作。我们需要一片更广阔的天地，帮助我们的人民渡过难关。"
ROS_secret_war: "暗战"
ROS_secret_war_desc: "独立后的维吾尔斯坦受到苏联内务部的深度介入，就和其他中亚国家一样。怀揣联共指示的塔吉克特工在伊宁创办格别乌训练班，培养情报安保人员。经过训练的维吾尔族、鞑靼族特工足以纵横天山南北，给暴君盛世才以沉重打击。\n\n在与东突厥的冲突中，我们充分认识到政治工作的重要性。因此，党乐于接受这样的安排，仿照苏联建立内务部，不惮以采取强硬措施维护内部稳定，动员更多的人为祖国而战。"

