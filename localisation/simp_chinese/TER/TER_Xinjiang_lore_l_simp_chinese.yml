HTC_Ma_Zhongying: "马仲英"
HTC_MA_Zhongying_desc: "与马仲英打过交道的人对他都有一致评价，说他像三国时期的马超——生于边地，长于异族，魅力超群，勇猛善战。一九二七年，十七岁的马仲英身被父兄大仇，起兵搅乱西北四省，麾下屠戮甚重，直到冯玉祥发兵将他逼退至肃州一隅。 \n\n1931年，维吾尔叛军首领和加·尼牙孜和尧乐博斯邀请心有不甘的马仲英入主新疆，推举他做中华斯坦的埃米尔。马仲英受此诱惑，率领六千回回兵纵马出关，使出浑身解数与新疆督办盛世才大战五场。可每当他即将胜利时，苏联就会出手挽救盛世才。望远镜里，坦克履带下的红鬃马嘶嘶哀鸣，马仲英好似万箭穿心。\n\n“你打败了我，我要向你学。”败走和阗的马仲英没有一刻休息，马不停蹄地联系苏联驻喀什领事，申明访苏意愿，并且保证不再与叛军交往。经联共中央政治局讨论，马仲英及一众回族军官获准成为苏联牵制盛世才的一枚棋子。一九三五年，马仲英和姐夫马虎山被契卡囚于莫斯科郊外一所大宅，只有四名苏联教师获准进出。争做埃米尔的封建狂想退散了，往事渐渐不堪回首，马仲英再不能把无知当作拒绝变革的借口：“盛世才做不好的，我要把它做好；盛世才做好的，我要比他好上一千倍。”\n\n七七事变后，苏联要求盛马二人配合国府抗日。盛世才百般推诿，马仲英则派马虎山回国领兵，进抵黄河前线。蒋介石为此颁发嘉奖令，授予马虎山部国民军第三十六师番号，承认马仲英的“新马”地位。一九四四年，新疆形势急转直下。为了报复弃苏投蒋的盛世才，联共决议将马仲英送回阔别十年的家园。当他走下火车，苏联教官调教下的三十六师士兵们高呼大元帅万岁。弟弟马仲杰带领一群年轻军官向他敬礼，然后兴高采烈地介绍起这些共产党员。马仲英拍了拍马虎山的肩膀，夸奖姐夫没有追随盛世才清共。熟料马虎山自始至终黑着脸，嘴唇上的小胡子微微发抖，在鼓乐队掩护下问了一个尖锐的问题：“你觉得，现在的新疆谁说了算？”\n\n面对粗暴的质疑，马仲英一时不明所以。马虎山的话看似是挑衅，实则是警示。是啊，离开部队十年，自己单靠书信和录音和国内联系，怎么可能保证所有人的忠诚？甚至眼前浓眉大眼的姐夫也不能！马仲英浮起的嘴角慢慢沉下，心中好像压了一块大石头，排挤着他绕开马虎山走进士兵当中。"
HTC_Ma_Hushan: "马虎山"
HTC_love_and_hate: "爱恨交织"
HTC_love_and_hate_desc: "马仲英斩钉截铁地厌恶苏联对自己的干预。没有苏联，新马本不必分崩离析；没有苏联，他也本不必蹉跎岁月。可是，他又不得不像宿敌盛世才一样假装向苏联宣誓效忠——不如此做，就换不来卢布和枪炮。\n\n虽说苏联分裂减轻了不少来自老子党的压力，可滞留在新疆的苏联顾问却余威仍在。他们占据一些要害部门，不时挑衅大元帅的权威，叫嚣着苏联复国自新疆始，令马仲英头疼不已。\n\n马仲英希望与内地尽快建立联系，名正言顺地让苏联人为中国服务。但青海的马继援还记恨着当年自相攻伐的仇，故意切断两地交通，给他平添许多麻烦。"
HTC_four_class_system: "四等人制"
HTC_four_class_system_desc: "“甘青回回第一，本地回回第二，汉人第三，蒙古回回第四，缠回不是人。”\n\n和阗中央政府的民族构成占比，照维吾尔党员的上述口头报告依次排名。这种不成文的用人制度，被有识之士讥讽为“四等人制”。由此发散出来的，是马仲英的个人独裁，是少数人控制多数人的专制。\n\n这位马大元帅在内极度倚重穆斯林，尤其是本乡穆斯林构成了统治顶层。焉耆、昌吉的回族响应马仲英围攻盛世才，紧随其后坐上第二把交椅。汉人拥有较高的素养，因此以利诱之，免除了他们信教的义务，允许参与重大事项讨论。对于流落南疆的察哈尔人和土尔扈特人，马仲英推翻了“不遵真主”的王公，强迫穷苦牧民改信伊斯兰教，然后拔擢他们到处做官。至于其他新疆民族，则确确实实没有他们的位置。\n\n不平等的制度，不开明且难以持续。前四等人在新疆毕竟是少数，不可能填满所有空缺。但政府宁愿出现缺额，也不雇佣本地人，使得革命政策推进受阻。这不是共产党人想要的结果，它必须被扭转。"
HTC_red_family: "红色家族"
HTC_red_family_desc: "马仲英与河州马氏恩断义绝，孑然一身闯事业。现在，五十知天命的马仲英养育了儿子一辈、孙子一辈，再加上从前陆陆续续投奔来的子侄和他们的后代，在和阗蔚然形成一个新的大家族。成年马家人有最好的岗位等待着他们；而孩子们则被送进最好的学堂，按照父祖的期望，培养成未来的接班人。\n\n以马仲英的姐夫马虎山为首，连带其他家族成员，在人民代表会议之外组建了“马将军会”，用来与共产党打擂台，搞得政府中乌烟瘴气。对于这种弄权行为马仲英不置可否，大元帅可以无情地打击敌人，可他能打击自己的亲人么？\n\n用马仲英对弟弟马仲杰讲的话就是：“只能顺其自然，无法改变。”"
HTC_XJ_bureau: "中国共产党新疆局"
HTC_XJ_bureau_desc: "二十年代末，马仲英举义反叛国民党，一些被国民党追杀的共产党员选择加入他的麾下谋求生存。这些党员采取“借水养鱼”的办法，用能力换取与军阀合作的机会，从而逐步发展革命组织。拜通讯断绝所赐，这些在暗处默默奉献的革命者，对陕北党中央来说就是一群隐形人，谁也不知道他们的存在。\n\n抗战爆发后，在盛世才政府中履职的陈潭秋、毛泽民等人才是延安派驻到新疆的正式代表。直到一九四二年盛世才叛变，迪化满城腥风血雨之时，蔡雪村、吴逸民等辈才机缘巧合回到中央的视野，和阗党员们终于归队，重组为新的新疆局。"
CPC_give_attache: "中共军事顾问"

#说不好，不好说
