CPC_NUKE.1.t: "秋小姐出嫁"
CPC_NUKE.1.d: "密电：穿衣梳辫已毕，零时已到，血压正常，秋小姐出嫁。"
CPC_NUKE.1.o: "终于……"
CPC_NUKE.2.t: "[Get_newspaper_header]中国成功试爆原子弹"
CPC_NUKE.2.d: "中华人民共和国外交部向外界宣布中国成功在西部沙漠中引爆一枚原子弹，中国已经成为拥核国家。发言人乔冠华在记者招待会上说，核武器对中国国防发展具有里程碑式的意义，但是中国始终以和平为第一愿景，以免亚洲人民受到一些大国的威慑和讹诈。\n\n日本政界对中国拥有核武器表示深深的遗憾，同时声称东亚大陆正面临着最不幸的一刻，中国利用核武器破坏脆弱的和平局势；外务省表示，日本不会通过任何手段，使东亚人民遭受原子弹的戕害。\n\n美国则希望东亚各国保持克制，并否定了所有关于中国核武器的非官方观点。"
CPC_NUKE.2.o: "中国发出巨响。"
CPC_NUKE.3.t: "秋小姐的嫁妆"
CPC_NUKE.3.d: "被月光照成惨白的走廊里，几人安静地向前走到一扇门前。走在前头的人用钥匙打开那扇红漆门，见得十几摞资料文件安然在桌，他们便也各自长舒一口气——这就是阵线这些年月里凝结出的成果：一个大姑娘的画像就在层层叠成小山的白纸中。\n\n那姑娘原本该叫球小姐，后来家里爷公叔伯都觉得这名字不甚雅致，于是取了个同音的名，只叫她作“秋小姐”——西北的黄沙孕育着永恒的金秋，而金秋则代表着丰收，代表着足以让中华民族安稳活在这晦暗世道中的立命之本。\n\n大家依次落座，卢鹤绂则仍旧站在桌边：“根据目前理论，我们的人工计算出来的数据以及计算机计算的数据是和各种期刊资料所给出的数据相吻合的。所以，在阵线可以保证原材料供应以及具体实验情况下，我们的核工程应该去开展下一步工作。”\n\n语毕，卢鹤绂坐下，望着首席那个面容有如刀削斧砍的肖劲光。\n\n肖劲光点点头：“理论工作很顺利嘛，接下来铀矿和试验场都需要你们，只要你们确定好方向，组织会全力支持的。”\n\n年青的学生悄悄听着他们的谈话，老头们细密的声音传入他的耳内，却比他心脏泵动的闷音还要震耳欲聋，他的手不知不觉已经牵着电灯的拉绳绕了好几圈——好在这并没有影响到这场谈话。晚空的雨云随旭日的方向骤去，新日似的皓白月光透窗而过，撒散到谈话的几人身上，屋虽暗但有微光。\n\n于是人们在月夜里为姑娘选择好了嫁衣。"
CPC_NUKE.3.o1: "没有原材料，去哪都没用。"
CPC_NUKE.3.o2: "实验场的一手数据更重要。"

##2023年愚人节事件
TER_april_fool_nuke_YEEEEEEEES: "§Y超级烟花秀开幕！§!\n\n开发者注：为获得最佳观赏效果，建议您将地图缩放至可正好完整看到§Y[CPC.getname]§!全境。\n\n烟花效果仅作为愚人节彩蛋，均为视觉效果，没有任何后续实际游戏进程影响，敬请放心游玩，以及，§G愚人节快乐:)§!"
CPC_MEOW.0.t: "愚人节快乐！"
CPC_MEOW.0.d: "你决定要开启愚人节事件吗？"
CPC_MEOW.0.o1: "开。"
CPC_MEOW.0.o2: "不开。"
CPC_MEOW.1.t: "MEOW - 1"
CPC_MEOW.1.d: "一只灰白相间，三角脸狸花猫在你的门口来回晃悠，时不时喵喵叫两声，似乎是在呼唤你过去看看它。"
CPC_MEOW.1.o1: "放下手头的活，去看看。"
CPC_MEOW.1.o2: "我忙，没空"
CPC_MEOW.2.t: "MEOW - 2"
CPC_MEOW.2.d: "好吧，既然你已经这样决定了，就照你的吩咐办。"
CPC_MEOW.2.o: "愚人节事件关闭。"
CPC_MEOW.3.t: "MEOW - 3"
CPC_MEOW.3.d: "小猫见你无动于衷，扭了扭尾巴跳走了，好像什么都没发生过，世界依然在照常运行。"
CPC_MEOW.3.o: "无聊。"
CPC_MEOW.4.t: "MEOW - 4"
CPC_MEOW.4.d: "你决定去看看这只猫。小猫并不怕你，迈开四条腿主动向你走来，很快你的两腿之间就感受到小猫柔软又温暖的触感。"
CPC_MEOW.4.o: "它太亲人了。"
CPC_MEOW.5.t: "MEOW - 5"
CPC_MEOW.5.d: "正当你享受这一刻时，小猫突然结束了盘桓，带着你找到了它的食盆，里面空荡荡的连口汤都没有。你看见远处的大黑狗舔了舔嘴唇，说不定是它抢了猫的饭，所以要求你来给口吃的，真是无事不登三宝殿。"
CPC_MEOW.5.o1: "这太荒谬了。"
CPC_MEOW.5.o2: "咬咬牙，给了。"
CPC_MEOW.6.t: "MEOW - 6"
CPC_MEOW.6.d: "你静下心想了一想，自己一天还吃不饱三顿饭，哪有剩饭喂它，于是你转身就回去了，只留下小猫在那里喵喵叫。"
CPC_MEOW.6.o: "我并不想管。"
CPC_MEOW.7.t: "MEOW - 7"
CPC_MEOW.7.d: "你跑回家中，从灶台上的锅里舀出一勺米汤，小步快走回去。还差几步就要到小猫的饭盆，你一个趔趄摔倒了，米汤洒了一地，真倒霉！"
CPC_MEOW.7.o1: "都怪我爱管闲事，撒手不管了！"
CPC_MEOW.7.o2: "既然已经决定了，就要把猫喂完。"
CPC_MEOW.8.t: "MEOW - 8"
CPC_MEOW.8.d: "你爬起来，拍拍身上的土，揉了揉磕青的胳臂肘，又回到灶台，这次你换了一个碗稳稳当当把米汤端了过来，倒进了小猫的食盆里。"
CPC_MEOW.8.o: "小猫欢快地吃了起来。"
CPC_MEOW.9.t: "MEOW - 9"
CPC_MEOW.9.d: "小猫认为你对小猫很好，至少是方圆五里内最好的，所以小猫决定带你去看一场烟花。"
CPC_MEOW.9.o: "那就快开始吧。"
CPC_MEOW.10.t: "MEOW - 10"
CPC_MEOW.10.d: "看完烟花，你吓得目瞪口呆。小猫冲你好似戏谑般一笑，“啪”得跳出院墙，等你去追赶时已经不见踪影。"
CPC_MEOW.10.o: "最好看看受了什么损失。"
CPC_MEOW.11.t: "MEOW - 11"
CPC_MEOW.11.d: "你在烟花升起的地方发现了一个又干又脆、压成饼状的面条，你掰下一块放进嘴里发现能吃。更怪异的是，被掰的面饼迅速复原回完整形态，这块面饼是无穷无尽吃不完的！在面饼底下压着一张字条，上面写着一串颇有意思的文字：“也许他们以后会谈论一个无聊至极的问题：假如给历史人物们数量无限的方便面，历史是否会改变？”\n\n而现在你将印证这个话题。"
CPC_MEOW.11.o: "好像没什么损失，虚惊一场。"
CPC_Instant_Noodles: "吃不完的方便面"
CPC_Instant_Noodles_desc: "这是小猫报答你的礼物！"