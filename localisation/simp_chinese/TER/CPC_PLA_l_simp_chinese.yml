CPC_NADT_event.1.t: "下一步科研方向" #1-2
CPC_NADT_event.1.d: "依据《国防研究十年规划》，我们的下一步研究工作将从农业转向工业，尤其需要解决流水线不易拆装转移的问题，为此，国防研究院工业科技研究所的同志提出了初步的流水线简易化轻便化构想。\n\n具体来说，该构想将聚焦于简化现有的生产流程，提升工业生产的灵活性和效率，以适应资源匮乏和技术条件有限的环境。阵线目前的工业基础仍然较为薄弱，无法支持大规模复杂的流水线生产，因此需要开发更加轻便、易于搭建和维护的生产系统，以满足军需物资和日常用品的需求。"
CPC_NADT_event.1.o: "批准项目，开始执行。"
CPC_NADT_event.2.t: "下一步科研方向"
CPC_NADT_event.2.d: "依据《国防研究十年规划》，在完成「[NADT_completed_proj]」项目后，我们的下一步研究工作可有三个研究方向：\n\n1.武器科技研发方向，该方向聚焦研发高精尖武器装备，以适应我军未来大规模现代战争作战需求；\n2.民用科技研发方向，该方向聚焦提升我们的生产能力，巩固根据地建设成果，确保根据地经济社会快速发展；\n3.后勤支援科技研发方向，该方向聚焦建立完善的后勤战略支援体系，确保未来大规模现代战争中我军能保证持续作战和后勤稳定。\n\n由于科研资源有限，我们各个阶段的科研工作只能选择其中一个方向展开研究。随着研究不断加深，科研项目的每月花费将逐渐上升，因此，我们也可以随时终止《国防研究十年规划》的执行，当然，这么做会付出一些我们不愿看到的代价。"
CPC_NADT_event.2.o1: "启动项目：[NADT_next_proj_left]"
CPC_NADT_event.2.o2: "启动项目：[NADT_next_proj_mid]"
