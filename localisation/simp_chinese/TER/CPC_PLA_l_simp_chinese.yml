TER_Central_Military_Commission: "中央军事委员会"
TER_CMC_info: "£TER_texticon_PLA §Y中央军事委员会§!\n----------------------------------\n§Y军队建设§!\n£TER_texticon_PLA §R解放军的军事改革工作§!必须面向§m现代化§!，面向§x全面战争§!，非如此不能与£GNG_japanese_frustration_texticon §j暴日§!抗争。为了完成我们军改的宏大目标，在我们§Y发展实力壮大革命队伍的全阶段§!，将陆续解锁不同的§R军事改革主题§!，其中大部分议题拥有§Y两类解决方案§!，并在执行军改日程前有§Y10天§!供斟酌思考发展方向；部分议题没有争议，会直接进入§G执行阶段§!。\n\n§m国防研究院§!\n在£CPC_texticon §x革命的马克思列宁主义§!、£TER_texticon_mao §G毛泽东思想§!指导下，我们的§m国防科技研究§!遵循一条独特的轨迹：不仅包括§Y武器装备、指挥战术§!等的研究，还包括§G工农民生§!等§G生产力科技§!的研究。\n根据1960年通过的§m《国防研究§!§x十年规划》§!的部署，在20世纪60年代的宝贵十年中，我们将陆续对§m一些重要科研领域§!展开攻关研究，在国防科研逐渐步入§R深水区§!时，我们也可以选择§R提前中止§!§m《国防研究§!§x十年规划》§!。"
