NADT_proj_1: "谷种改良技术研究"
NADT_proj_1_desc: "步入六十年代，阵线面临干旱贫瘠的地理条件和粮食短缺的多重严峻挑战。为了解决这一问题，，国防科研十年规划提出，应尽快突破谷种改良技术。其主要目标是通过培育适应恶劣环境的高产、抗旱谷物品种，提升粮食产量，确保部队和民众的基本粮食供应，从而支撑抗日斗争和政权的稳定。\n\n该技术的主要方向包括：增强抗旱性，通过选育耐旱品种应对西北地区的水资源匮乏；提高高产性，确保在有限的土地和种植季节内获得最大产量；提升抗病性，减少病虫害对作物的威胁，降低对农药的依赖。这些改良方向使得阵线能够在恶劣环境下实现粮食自给，保障社会稳定和农业发展。"
NADT_proj_2: "流水线轻便化"
NADT_proj_2_desc: "流水线轻便化的目标是通过简化现有的生产流程，提升工业生产的灵活性和效率，以适应资源匮乏和技术条件有限的环境。阵线目前的工业基础仍然较为薄弱，无法支持大规模复杂的流水线生产，因此需要开发更加轻便、易于搭建和维护的生产系统，以满足军需物资和日常用品的需求。\n\n该技术的主要方向包括：模块化设计，使得流水线可以根据需要快速组装和拆解，适应不同生产任务；减少机械依赖，更多依靠手工和简单机械操作，降低对复杂设备的需求；提高移动性，使得流水线可以在战时或紧急情况下快速转移，确保生产不被中断。这些改进将帮助阵线在资源有限的情况下，保持稳定的生产能力。"
NADT_proj_3_left: "重启直升机设计"
NADT_proj_3_left_desc: "过去，我们缺乏必要的工业门类，尽管国防研究院接收了来自米里设计局的专业设计师和朱家仁等国内直升机设计先驱，但我们的直升机研制工作一直处于停滞状态。鉴于当前阵线工业关键门类已经恢复正常运作，国防研究院决定重启直升机设计，我们的目标是提供一种能够快速部署、灵活作战的空中运输和支援工具。\n\n该设计的主要方向包括：简化结构，以减少制造成本和维护难度，适应阵线的工业能力；多用途设计，使直升机既能执行运输任务，也能进行侦察、救援和战场支援；提高适应性，确保直升机能够在高原、山区等复杂地形中稳定飞行。这些设计方向将帮助阵线在资源有限的情况下，最大化直升机的作战效能。"
NADT_proj_3_left_tt: "将§G解锁§!全种类§Y直升机§!科技至§Y1950年§!水平，其中§Y运输直升机§!科技将提升至§Y1960年§!水平，若此前已研究过部分对应科技，则给予§Y200%科研加成/每项已研究科技§!"
NADT_proj_3_mid: "研制消杀药剂"
NADT_proj_3_mid_desc: "研制消杀药剂的目标是应对西北地区恶劣的卫生条件和敌伪投放生化武器的威胁，确保军民健康安全。由于战时环境恶劣、医疗资源匮乏，传染病和虫害可能对部队战斗力和社会稳定构成严重威胁。开发高效、易于生产的消杀药剂，能够有效防止疾病传播，保障部队的战斗力和后方的稳定。\n\n该药剂的主要方向包括：广谱性，确保药剂能够对多种病原体（如细菌、病毒、寄生虫等）和害虫（如蚊蝇、跳蚤等）有效；易于生产和使用，配方简单，能够在阵线现有的工业条件下大规模生产，并且便于部队和民众在日常生活中使用；环境适应性，确保药剂在西北地区的干旱、寒冷等极端环境下依然保持有效。这些方向将帮助阵线在有限资源下有效控制疾病和虫害，维持社会稳定。"
NADT_proj_3_right: "现代军事理论"
NADT_proj_3_right_desc: "研究现代军事理论的目标是提升中国人民解放军的战略规划和战术执行能力，使其能够在复杂的国际环境和多变的战场条件下保持竞争力。随着战争形态的变化，传统的作战方式已不足以应对现代战争的需求，因此需要引入和发展适应现代战争的军事理论，以指导部队的组织、训练和作战行动。\n\n该研究的主要方向包括：非对称作战理论，通过灵活机动的战术和有限资源的高效利用，弥补与强大敌军之间的差距；联合兵种作战，强调各兵种间的协同作战，尤其是步兵、装甲部队、炮兵和空军的联合行动，以最大化战斗效能。这些理论将提供更为先进的作战指导，确保我们在现代战争中立于不败之地。"
NADT_proj_4_left: "重启喷气式飞机设计"
NADT_proj_4_left_desc: "喷气式飞机设计的目标是为我军提供一种能够快速、远程打击和防御的空中作战平台，以应对现代空战的需求。喷气式飞机的高速度和高机动性将大幅提升空军的战斗力，确保在面对强敌时能够有效进行空中拦截、侦察和打击任务。由于我们的工业基础相对薄弱，喷气式飞机的设计需要在性能和生产能力之间找到平衡。\n\n该设计的主要方向包括：简化结构与材料，以适应现有的工业能力，确保飞机能够在有限的资源条件下生产；多用途设计，使飞机既能执行空中拦截任务，也能进行对地支援和侦察任务；提高燃油效率和航程，确保飞机能够在西北地区广阔的疆域内执行长时间的作战任务。这些设计方向将帮助我们在有限的资源和技术条件下，开发出具备现代空战能力的喷气式飞机，提升空军的整体作战效能。"
NADT_proj_4_left_tt: "将§G解锁§!全种类§Y飞机§!科技至§Y1945年§!水平，若此前已研究过部分对应科技，则给予§Y200%科研加成/每项已研究科技§!"
NADT_proj_4_mid: "实验型农业机械"
NADT_proj_4_mid_desc: "实验型农业机械的目标是通过机械化手段提升阵线的农业生产效率，缓解劳动力短缺和低效传统耕作方式带来的问题。由于西北地区地广人稀、土地贫瘠，传统的农业方式难以满足粮食需求，因此开发适应当地环境的机械化设备将有助于提高产量，改善农业生产条件。\n\n研发该类机械的主要方向包括：小型化与多功能性，设计适合西北地区复杂地形的小型农业机械，能够在有限的土地条件下进行耕作、播种、收割等多种任务；耐用性与易维护性，确保机械设备能够在恶劣的气候条件下长期使用，并且易于维护和修理，适应西北国防阵线的工业水平。这些方向将帮助我们逐步实现农业机械化，提升粮食生产能力，保障部队和民众的粮食供应。"
NADT_proj_4_right: "军事设施改进"
NADT_proj_4_right_desc: "改进军事设施的目标是提升我军的防御能力、训练效率和后勤保障水平，以应对现代战争的需求。由于西北地区地形复杂、气候恶劣，现有的军事设施可能无法满足长期作战和大规模部队集结的要求，因此必须对现有设施进行优化和升级，以确保部队的战斗力和生存能力。\n\n该改进的主要方向包括：强化防御工事，在关键战略位置加固现有的掩体、堡垒和地下设施，提升其抵御现代武器（如空袭和炮击）的能力；优化后勤与训练设施，建设更加现代化的仓储、运输和训练基地，确保物资供应的高效运转，并为部队提供更先进的训练场地。这些改进将帮助我军在面对强敌时，拥有更强的防御和作战能力，确保部队能够在恶劣环境中长期作战。"
NADT_proj_5_left: "实验型步炮装备"
NADT_proj_5_left_desc: "实验型步炮装备的目标是为我陆军步兵部队提供更灵活、强大的火力支援，提升步兵在战场上的作战效能。山地丘陵为我们未来的作战中需要应对的主要地形，传统的重型火炮难以快速部署和移动，因此开发适合步兵使用的轻型火炮装备，能够在不牺牲火力的前提下提升部队的机动性和战术灵活性。\n\n该装备的主要方向包括：轻量化与便携性，设计能够由步兵携带或快速组装的轻型火炮，确保在复杂地形中能够迅速部署和撤离；多功能性，使装备既能用于直接火力支援，也能进行反装甲作战，适应多种战场需求。这些实验型步炮装备将帮助我军在面对敌方装甲或坚固防御时，拥有更强的火力支援，提升整体作战效能。"
NADT_proj_5_mid: "自主研发计算机"
NADT_proj_5_mid_desc: "自主研发计算机的目标是为我们提供基础的信息处理和计算能力，以支持军事指挥、情报分析和后勤管理等关键领域。随着现代战争对信息化的需求日益增加，计算机技术的引入将大幅提升军队的作战效率和决策能力。由于外部技术封锁和资源限制，自主研发计算机不仅是提升军队信息化水平的必然选择，也是确保技术自主可控的重要步骤。\n\n该研发的主要方向包括：简化设计与实用性，优先开发适合现有工业能力的基础计算设备，能够满足军事指挥、通信和后勤管理的基本需求；模块化与可扩展性，确保计算机系统能够随着技术进步逐步升级，适应未来更复杂的军事需求。这些自主研发的计算机将奠定信息化作战的基础，提升指挥效率和情报处理能力，确保在现代战争中保持技术优势。"
NADT_proj_5_right: "后勤体系机械化"
NADT_proj_5_right_desc: "后勤体系机械化的目标是通过引入机械化设备，提升后勤运输和物资供应的效率，确保在战时和日常运作中能够快速、稳定地为前线提供支持。由于西北地区地形复杂、交通不便，传统的后勤方式效率低下，机械化后勤将显著提高物资运输的速度和规模，减少对人力和畜力的依赖。\n\n该机械化的主要方向包括：运输设备的现代化，引入卡车、装甲运输车等机械化工具，确保物资能够快速运送到前线，特别是在复杂地形和恶劣气候条件下；建立相应的后勤流程自动化体系，通过机械化设备简化物资的装卸、储存和分配流程，减少人为操作的时间和误差。这些改进将帮助我们在有限的资源条件下，确保后勤体系的高效运转，提升部队的作战持续能力。"
NADT_proj_6_left: "扩大空输编制"
NADT_proj_6_left_desc: "扩大直升机空降部队编制的目标是增强我军的快速反应和纵深打击能力，确保在复杂地形和敌后作战中具备更强的机动性和作战灵活性。直升机空降部队能够快速部署到敌军防线后方或难以通过地面部队到达的区域，执行突袭、包围和支援任务。扩大编制将进一步增强这支部队的作战规模和任务覆盖范围。\n\n该扩编的主要方向包括：增加直升机数量与类型，引入更多运输直升机和武装直升机，确保空降部队能够在执行任务时同时具备运输和火力支援能力；提升空降部队的训练与协同作战能力，确保部队在复杂的空中和地面环境中能够高效协同作战，快速完成部署、作战和撤离任务。这一扩编将大幅提升西北国防阵线的空中机动作战能力，确保在现代战争中具备更强的战略和战术优势。"
NADT_proj_6_mid: "实验自动化流水线"
NADT_proj_6_mid_desc: "实验型自动化流水线的目标是通过引入自动化技术，提升生产效率，减少对人力的依赖，尤其是在资源和劳动力有限的情况下。自动化流水线可以显著加快军需物资、武器装备等关键产品的生产速度，确保在战时能够快速响应前线需求，提升整体工业生产能力。\n\n该流水线的主要方向包括：简化自动化流程，优先开发适合现有工业基础的自动化设备，确保流水线能够高效运作且易于维护；模块化设计，使流水线能够根据不同生产需求灵活调整，适应多种产品的生产任务。这些实验型自动化流水线将提供更高效的生产手段，确保在有限资源条件下，保持持续的物资供应和装备制造能力。"
NADT_proj_6_right: "完善战略支援体系"
NADT_proj_6_right_desc: "完善战略支援体系的目标是提升我们在现代战争中的综合作战能力，确保在情报、通信、电子战和后勤保障等方面具备强大的支援能力。战略支援体系的完善将为前线部队提供更加精准的情报支持、稳定的通信保障以及高效的后勤服务，确保在复杂战场环境中保持作战优势。\n\n该体系的主要方向包括：完善部队通信机制，通过引入先进的通信设备、雷达系统，确保指挥部与前线的实时联络，并能够有效干扰和削弱敌方的通信与情报系统；优化后勤与物资支援，建立更加高效的后勤调度系统，确保物资、弹药和医疗资源能够及时送达前线。这些改进将为我们提供强大的战略支援，确保在现代战争中具备信息优势和后勤保障能力。"
NADT_proj_6_right_tt: "将§G解锁§!全种类§Y支援§!科技至§Y1970年§!水平。"
