XJB_focus_card_info: "[Get_XJB_focus_names]\n----------\n任一§Y焦点卡片§!被选中时，其余§Y焦点卡片§!将不再可被选中，直至§Y当前焦点日程§!结束。"
XJB_focus_card_desc_1: "§R工业焦点§!\n----------\n选中§R工业焦点§!卡片将花费§Y3§!点§G工作能力§!，并在§Y[HTC.GetNameWithFlag]§!解锁对应§Y国策树§!以开始当前§Y政权焦点日程§!。"
XJB_focus_card_desc_2: "§n农业焦点§!\n----------\n选中§n农业焦点§!卡片将花费§Y3§!点§G工作能力§!，并在§Y[HTC.GetNameWithFlag]§!解锁对应§Y国策树§!以开始当前§Y政权焦点日程§!。"
XJB_focus_card_desc_3: "§l军事焦点§!\n----------\n选中§l军事焦点§!卡片将花费§Y3§!点§G工作能力§!，并在§Y[HTC.GetNameWithFlag]§!解锁对应§Y国策树§!以开始当前§Y政权焦点日程§!。"
XJB_focus_card_desc_4: "§O教育焦点§!\n----------\n选中§O教育焦点§!卡片将花费§Y3§!点§G工作能力§!，并在§Y[HTC.GetNameWithFlag]§!解锁对应§Y国策树§!以开始当前§Y政权焦点日程§!。"
XJB_focus_card_desc_5: "§j商贸焦点§!\n----------\n选中§j商贸焦点§!卡片将花费§Y3§!点§G工作能力§!，并在§Y[HTC.GetNameWithFlag]§!解锁对应§Y国策树§!以开始当前§Y政权焦点日程§!。"
XJB_focus_card_desc_6: "§m医卫焦点§!\n----------\n选中§m医卫焦点§!卡片将花费§Y3§!点§G工作能力§!，并在§Y[HTC.GetNameWithFlag]§!解锁对应§Y国策树§!以开始当前§Y政权焦点日程§!。"
