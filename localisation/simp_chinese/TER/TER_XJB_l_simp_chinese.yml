CPC_XJB_info_desc: "£CPC_texticon §R中国共产党-新疆局§!\n\n§Y根据地焦点§!\n-在本界面右下部分，有§R工§!、§n农§!、§l兵§!、§O学§!、§j商§!、§m医§!六张§Y根据地焦点卡片§!可供选择，每一张§Y焦点卡片§!都可以为§Y[HTC.GetNameWithFlag]§!解锁对应§Y国策树§!以获得收益。\n\n§m地区次级焦点§!\n-在§Y根据地焦点§!界面的右方，还有多种焦点政策可被实施，该类焦点被称为§m地区次级焦点§!，仅在选中地块生效，且具备一定随机性，需要注意：§R敌占区§!无法执行§m地区次级焦点§!。\n\n§n§n人民态度§!§!\n-人民群众的眼睛是雪亮的，我们在新疆的一举一动，都与当地各族人民息息相关，也都被他们看在眼里——人民对我们的政举自有评断。\n-然而，根据地内部并非铁板一块，§l马将军会§!长期与根据地共产主义者存在争执，他们将利用和阗马氏在民间的巨大声望不断给我党派驻新疆人员§R使绊子、穿小鞋§!，惟有控制好§l马将军会§!在新疆的影响力，我们才能避免我们在人民心中的形象受损。\n\n§G工作能力§!\n-尽管可以通过联络中央换取一定资源支持，但新疆局的工作能力仍然较为有限，将其量化为§G工作能力点数§!，各类行动均需要消耗一定点数。每月，新疆局都会自动回复§Y1点§!§G工作能力点数§!，但由于规模限制，新疆局也存在§G工作能力上限§!。\n新疆局当前剩余§G工作能力点数§!为：[?XJB_abilities_num|Y0]点。\n新疆局当前§G工作能力上限§!为：[?XJB_abilities_num_limit|Y0]点。"
