CPC_XJB_before_war_tt: "新疆地区，地处亚欧大陆腹地，为中国不可分割之领土，由于其地理位置特殊，自十九世纪以降便成为欧亚各国争逐利益的角斗场，更兼抗战失败，旧国民政府的合法性逐渐裂解，各方势力蠢蠢欲动。\n\n由前苏联势力扶植而发的北疆起义打响了推翻盛世才暴政的第一枪，随后§R共产主义者§!、§Y旧军阀§!、§O泛突厥主义者§!划土而治——但新疆局势仍然波诡云谲。\n\n自1942年§G陈潭秋同志§!被§Y盛世才§!残忍杀害后，我党在新疆地区的组织系统一度崩溃，直到§G张雅韶、吴应祺两同志§!不懈努力，接过重担，重组了新疆局——这也是我们赖以影响新疆局势的唯一抓手。\n\n§G张雅韶§!同志于1957年逝世，其死因讳莫如深，但新疆如今的局势渐渐失控，我们不得不把仅存的精力放在§R更要紧的事§!上。\n\n§R战争不会停下脚步，而在下一次暴风雨到来之前，我们必须做好万全准备……§!"
CPC_XJB_in_war_tt: "新疆地区目前正处于§R战争状态§!，目前由§G中央军委§!联合§G和阗人民会议§!及§G疆共§!统筹规划我党我军在新疆地区的战略安排，新疆局应趁此机会休整和整顿组织，以应对战后指导建立边区政府的繁重任务。"
CPC_XJB_special_action_tt: "当前新疆局正经历一个§Y特殊时期§!，绝大部分可调配资源均被投入到我们当前正在应对的§Y特殊局势§!中，暂无余力指导和规划新疆地区的发展与治理工作。"
CPC_XJB_post_war_tt: "新疆战事已平，亟待开发，新疆局在今后较长一段时间内务必以§Y援建开发新疆边区§!为要，协助§G边区政府§!完成重建和稳定新疆的工作。\n\n务必审慎制定政策，以赢得新疆人民的§G信任§!，不负§G陈潭秋、毛泽民、张雅韶§!等革命先烈之遗愿。"
XJB_pie_detail: "§Y[HTC.GetName]§!是我们在新疆的主要统战对象与政治盟友，其内部政治势力构成简况如下：\n\n§x人民代表会议§!集中了我党新疆局、前苏联援疆顾问、新疆本土共产主义者、马氏家族等多方代表，主管§Y[HTC.GetNameWithFlag]§!的内政事宜。\n\n在§x人民代表会议§!之外，由马氏嫡亲战将§Y马虎山§!牵头成立的§l马将军会§!在§l军队§!及§j商界§!享有一定声望，主要由马氏家族及原新编第36师军事主官所控制，主管§Y[HTC.GetNameWithFlag]§!的防务事宜。\n\n新疆局在今后较长一段时间的主要任务是：稳定§Y[HTC.GetNameWithFlag]§!的局势，尽可能削减§l马将军会§!对新疆地区内政决策的影响，若§l马将军会§!的势力过于强大，§R我党在新疆可能会面临极为棘手的处境§!。\n\n当前§Y[HTC.GetNameWithFlag]§!的政治势力结构为：\n§x人民代表会议§!：[?XJB_real_pct_C|Y1]%\n§l马将军会§!：[?XJB_real_pct_M|Y1]%\n\n下月，因§l马将军会§!影响，预计[TER_XJB_popular_will_predict]。"
