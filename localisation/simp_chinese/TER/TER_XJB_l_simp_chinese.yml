TER_XJ_popular_will_tt_2: "当前根据地§n人民态度§!（§Y[?XJ_popular_will]§!%）为：§Y略有不满§!\n\n下月，因§l马将军会§!影响，预计[TER_XJB_popular_will_predict]。"
