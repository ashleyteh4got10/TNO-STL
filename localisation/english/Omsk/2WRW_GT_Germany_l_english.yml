l_english:
### Events ###


### Focuses ###
 GER_A_Spectre_Haunts_Germany:0 "A Spectre Haunts Germany..."
 GER_A_Spectre_Haunts_Germany_desc:0 "Our nation has been shockingly and violently attacked by the Slavic menace from the east, this time donned in black instead of red. This war promises to be much more brutal and violent than any our people have faced before, as already horrific attacks have been carried out against our civilian populations in the opening hours of this conflict. Unimaginable horrors may yet be unleashed on our people as the Slavic beast rises in one last attempt to take down our glorious civilization.\n\nWe must not bend or break. We will stand tall against our foes, beat them back across our borders and secure our Reich for a thousand years. And, after all the ashes of the war have settled across the plains of Russia, we will make them pay for their insolence and hubris."
 GER_The_Rapture:0 "The Rapture"
 GER_The_Rapture_desc:0 "It is often said that history repeats, and this is undeniable proof that is the case. Two decades ago, the Russian horde crossed the Arkhangelsk-Astrakhan line with a sudden and unrelenting offensive, resulting in them reaching within a hair’s length of Moscow before being pushed back. Now, it seems this so-called Black League is making another attempt.  However, the offensive is proving more dangerous this time, the attack is much more organized and with much greater material backing, OFN involvement is suspected.\n\nBut we cannot fall to shock, this has been a sudden blow we should’ve seen coming, but we’ve come back from this before. We will send reinforcements east with our best generals and officers, and draw up a new defensive plan. We will analyze their tactics and strategy, and develop the best counters to them. We will march all the way to Omsk, and make sure this never happens again."
 GER_Revitalizing_The_OKW:0 "Revitalizing The OKW"
 GER_Revitalizing_The_OKW_desc:0 "The Oberkommando Wehrmacht has grown complacent, and is in a suboptimal state. The generals, officers and staff as a whole feel assured of an easy victory and as such are not applying themselves to solve the crisis we face. We must introduce newly promoted staff and make the existing ones sit up and listen. We are facing a great danger and their expertise will be of vital importance. We will outline the problem to them and once the situation is abundantly clear, their work can begin in earnest. We shall commence organizing army groups and logistics, appointing the right generals to lead the armies and ensuring that everyone is doing their part to uphold our dominant position.\n\nThe task of ensuring a wartime economy must be properly organized and maintained so that the right numbers of materials, munitions and manpower reach the frontlines. German military prowess has never been in doubt, from the days of Prussia up to the West Russian War. We will not allow the fears of atrophy to creep in now."
 GER_No_Town_Untouched:0 "No Town Untouched"
 GER_No_Town_Untouched_desc:0 "It may seem to be a drastic measure, but the efficacy of such tactics in denying the enemy useful supplies, materials, and cover cannot be debated. “Scorched Earth” as it has become known must become part of our doctrine in defensive battles. As disheartening as a retreat might be, it can be lessened by setting ablaze anything of use that we cannot carry with us. This can leave the enemy off balance and hurting for supplies, making a counterattack much more viable. In the vast expanses of the east, this will have great effect.\n\nIt will take time to rebuild villages and supply caches once the war is over, but we will have all the time in the world to do so once the threat of the Black League has been well and truly extinguished. Even if we have to inflict collateral damage in order to do it, the ends will justify the means."
 GER_Fleecing_The_Corporations:0 "Fleecing the Corporations"
 GER_Fleecing_The_Corporations_desc:0 "As much as we are loath to admit it, certain difficulties have begun to arise in the logistical aspect of our war with the Black League. Deficits of arms, munitions, vehicles, supplies and other war materials have been identified and are beginning to cause major problems. Unfortunately. our current production cannot keep up, and this deficit threatens to grow larger. We are forced to turn to the private sector of our economy to bring the logistical situation under control.\n\nIf they expect us to come to them cap in hand then they will be mistaken. We have the means to apply pressure to them in legal and economic ways to bend them to our desires. It may hurt our relations with them, but these private companies have grown fat and decadent on the fruits of slave labor. It is time to whip them into shape."
 GER_Our_Past_Trials:0 "Our Past Expertise"
 GER_Our_Past_Trials_desc:0 "History can be considered a series of themes and patterns, and learning from the past is often the key to facing new challenges. That wisdom can also be applied here, the First West Russian War forced us to adapt in new and interesting ways, and we cannot let those lessons go to waste due to the hubris and ego of our current general staff. We shall open the logbooks and call on the veterans to review how the previous war was won, and apply those strategies and tactics once more, from the general to the private.\n\nHaving to learn these lessons all over again is much too slow a process. This will also give a job to the many veterans of the previous war who may not be able to serve directly, they can pass on their knowledge and experience as trainers and advisors."
 GER_A_Wall_Of_Water_And_Mud:0 "A Wall of Water and Mud"
 GER_A_Wall_Of_Water_And_Mud_desc:0 "The mighty Dnipro Reservoir Cascade is Ukraine's lifeline, impounding billions of cubic meters of water in its relentless grasp. Its presence fuels the heartbeat of the territory, bestowing water and electricity to the Reich's coveted breadbasket. But it can serve a tactical purpose. By releasing its floodgates, we can unleash a monstrous deluge flooding its drainage basin, rendering the once-familiar terrain nearly impassable, an insurmountable barrier sure to halt the pillaging Slavic hordes' advances any further. Although there are substantial logistical and tactical issues to consider, the dams can serve a very powerful purpose, possibly enough to change the tide of the war and shatter the Russian state once and for all."
 GER_Render_Unto_Caesar:0 "Caesar's Due"
 GER_Render_Unto_Caesar_desc:0 "One of the many problems we are facing is the bottomless financial pit that the eastern territories have thus far proven to be, vast sums of money, resources and manpower only to receive mediocrity in return. This can no longer be allowed to stand, we have given them so very much, is it not unreasonable to begin to expect something in return? It is high time that they earned their keep, and paid back the vast sums we invested in them.\n\nThe war is proving costly in every sense of the word, and it is not merely recognition for the contributions that we must demand of them. Products of industry, food, raw materials and other such goods which will be of vital necessity for the war effort  Quotas will be set and tightly held, so to ensure that the dues we are owed are rightfully collected. A return on investment is a reasonable expectation, and now more than ever such an expectation must be met."
 GER_Every_Inch_A_Battleground:0 "Every Inch, A Battleground"
 GER_Every_Inch_A_Battleground_desc:0 ""
 GER_The_White_Horse:0 "On A White Horse, Sat Conquest"
 GER_The_White_Horse_desc:0 ""
 GER_All_For_The_Reich:0 "All for the Reich"
 GER_All_For_The_Reich_desc:0 "There can be no victory without the backing of industry, without popular support, the utmost dedication of the government and administration at all levels. The ferocity and persistence of the attack against us by the Black League has made it abundantly clear that this will be a fight to the death. But not ours. Every single factory and workshop will produce arms, munitions, vehicles, equipment and all else needed for our armies to stop the offensive and turn it back to the heart of the Russian monster once and for all.\n\nEvery spare crumb of food will be diverted to our soldiers, civilians have made do with rationing before and this can be implemented fairly without causing famine. We can also requisition shipments of iron, coal, tungsten and copper from civilian industries, as the military needs them more. The Fuhrer will also deliver a speech announcing the reintroduction of conscription to ensure that our regiments always have an ample supply of manpower."
 GER_An_Engine_Ran_On_Blood:0 "An Engine Ran On Blood"
 GER_An_Engine_Ran_On_Blood_desc:0 ""
 GER_The_National_Struggle:0 "The National Struggle"
 GER_The_National_Struggle_desc:0 "As any propagandist will tell you, you can spin almost anything into being positive or negative with the right words and framing. As such, we must bring to the nation’s attention the indelible fact that we are the superior people, which has been proven time and again for all to see. We will stand shoulder to shoulder as a bold and proud people against the animalistic aggression of the Slavic horde. We as contemporary Spartans have turned back many enemies in different forms, and this will be no different. Have no fear, people of the Reich, for victory is assured. All that remains is to make it official.\n\nWe can push this through television, newspapers, radio and all other means to ensure that this vitally important message reaches everyone within the Reich’s borders. Every spirit will be ignited, and with souls aflame we will claim a final and resounding victory."
 GER_The_Many_Talons_Of_The_Eagle:0 "Boons of the Einheitspakt"
 GER_The_Many_Talons_Of_The_Eagle_desc:0 "To some, it may seem as if we stand alone against the Slavic hordes to the east. That we are isolated and weak in a hostile world. They are wrong. We are the masters of Europe, a continent conquered by our will decades ago, remade to serve us and to obey us. The Pakt is our greatest achievement and weapon, and it is time to harness it.\n\nWe stand on the precipice, with our greatest of enemies threatening to undo all that we have accomplished. For the good of the nation, party, and people, they must be destroyed by any means necessary. We will treat every appendage of our alliance as if it was our very nation, for Germany and Germany alone rules Europe, and Germany and Germany alone will rule it forevermore."
 GER_Fan_The_Winds_Of_Desperation:0 "Fan the Winds of Desperation"
 GER_Fan_The_Winds_Of_Desperation_desc:0 "Although we firmly believe in victory, introducing a sense of urgency to the situation will help in encouraging people to make more inventive solutions. The hand is around our throat! The gun at our head! You must act right this second now! Sentiments such as these have been expressed by alarmists both in the government and army as well as in the civilian population. It may seem unorthodox, but panic can be refined into motivation.\n\nAll it takes for this to bear fruit is for a few people to lay down a creative solution to an existing problem. A way to produce guns a little faster, refine petrol a little more efficiently, or a corner that can be safely cut in the bureaucracy and other small things will begin to add up. It will be an unconventional edge, but in the position we’re in we cannot afford to turn our nose up at any potential advantage."
 GER_There_Is_No_Want:0 "There is no "Want""
 GER_There_Is_No_Want_desc:0 "Autarky. The system of self-sufficiency where it comes to societies, states and their economic systems. During the second world war, it proved invaluable in maintaining the Reich’s economic and societal stability, cutting down on the need for imported goods. We have no need for such excesses anyway. The ever resilient people will only consume what is needed for life and nothing more, and that much the government will provide.\n\nThere are, however, some who quite selfishly hoard and stockpile, depriving their neighbors and communities of goods which, in their foolishness, pride and paranoia believe that they are more deserving of. Perfectly good food rots away unused because of this, and such wastage is unacceptable. We will properly enforce autarky, and root out those who attempt to circumvent it."
 GER_Only_What_Must_Be_Done:0 "Only What Must Be Done"
 GER_Only_What_Must_Be_Done_desc:0 "Since we have formally instituted these extreme autarky policies throughout Germany and our territories, a flood of resources from our civilian population has begun to flow its way into the hands of our men on the frontline. The issue we face now, however, is that it is still not enough.\n\nWith that said, we must do only what must be done. We will need to secure more resources from the civilian population and distribute it all back to our troops. Food and fuel rationing must be increased, alongside the trucks and cars that serve our people must be repurposed for the war effort. It will hurt us in the short term, but victory must be achieved at any cost."
 GER_Black_Horse:0 "On A Black Horse, Sat Famine"
 GER_Black_Horse_desc:0 ""
 GER_Vengeance_Incarnate:0 "Russia, an Existential Threat"
 GER_Vengeance_Incarnate_desc:0 "This conflict, its size and as well as the apparent hardline rhetoric of our enemy, is much larger in scope than just between the Reich and Russia. These fanatics are in possession of nuclear weapons, a combination akin to a pool of petroleum and a dozen lit matches. There’s no doubt that this clear and present danger has made itself obvious to other powers in the world, we must extend earnest words through diplomatic channels to said other powers.\n\nAs much as it may pain us to admit this, it was not the Reich alone which conquered Europe. We had allies, and we must play this card again. By reaching out to nations abroad, this could grant us a stream of favorable trade deals, or ideally more direct support. This is not desperation, this is us making it clear to the international community that this is their problem too."
 GER_A_Meeting_Of_Necessity:0 "A Meeting of Necessity"
 GER_A_Meeting_Of_Necessity_desc:0 "The Reich is not always known for its humility. The Eagle never gave pittance to the mice in its talons. Nevertheless, the world now is faced with a truly existential threat and we must swallow our pride. The Americans in their packed office and the Japanese in their pagoda are our proven enemies, but we need to meet for the sake of all of our survival. We will show whatever evidence we need, say whatever needed to get this unholy alliance through, for the sake of our survival. All metaphorical bets are off of the table.\n\nAfter all, what is the alternative? An Unholy Alliance is the better alternative to a world ruled by rabid cultists, obsessed with what they call a "Great Trial", by any and all means. They must understand that our existence is preferable to a world coated in sarin gas and radiation. If not, only God can guarantee our survival now."
 GER_Old_Friends_In_Rome:0 "Our Old Friends in Rome"
 GER_Old_Friends_In_Rome_desc:0 "Our relationship with the Italian government has decayed over the years, since the time of the Axis. Nonetheless, there exists the groundwork for us to foster a new alliance of sorts. It may require us to swallow some pride and perhaps give a concession or two, but the circumstances the Black League has put us in warrants more desperate measures. The Italians will more than likely be aware of this, which may serve to make them more receptive. As such, diplomatic channels must be opened.\n\nWe will make our needs clear to them, as this is not the time to be playing mind games and engaging in a competition of petty one-ups. We will request economic support, light or heavy industrial imports, business investment or perhaps even any sort of military support. We will attempt to tap them for whatever they care to give us. A substantial price may be incurred, but our diplomats will negotiate fair deals."
 GER_Sins_Of_The_Demons_Revealed:0 "Let Them Witness the True League"
 GER_Sins_Of_The_Demons_Revealed_desc:0 "There has been some idea of the Black League, some notion of plurality. The Americans and many parts of the uncivilized world see the League as some sort of comeuppance for the Reich. These childish ideas will be disproven when the world is dragged kicking and screaming into a new age. By our calculations and estimates a nuclear exchange will spill over into the rest of the world. We do not need to stage any incidents with the League, they have proven more than capable to spill our pure blood all over the tapestry of Europe.\n\nAll we must do is record and show to the world and they shall turn against the League in due time."
 GER_Comrades_In_The_Balkans:0 "Our Allies in the Balkans"
 GER_Comrades_In_The_Balkans_desc:0 "This war we find ourselves in will not be the end of just the German peoples, but that of all our allies that have fought diligently for our cause. Our allies in the Balkan region were once called upon to aid us in our victory during the Second World War but did not see the action our troops faced during the First West Russian War. We shall not make that same mistake again.\n\nThey must call upon their militaries to assist us in keeping back the Black League at all costs. Any material shortcomings they might endure in this conflict will be handled by us, and if they refuse our call to arms, we must remind them why we are the master of Europe."
 GER_Against_The_Maelstrom_Of_Hatred:0 "Against the Evils of Hell"
 GER_Against_The_Maelstrom_Of_Hatred_desc:0 "The illegitimate Russian state is viewed as a threat by nearly everyone on the international stage, and while we may have our disagreements, it is a necessary precaution to form an aegis with both the Organization of Free Nations and the Co-Prosperity Sphere, in hopes of forever tearing down this short-lived, degenerate excuse of a government. We will make sure with the power of the entire collective, industrialized world, that the Reich prevails in this costly conflict."
 GER_On_A_Red_Horse_Sat_War:0 "On A Red Horse, Sat War"
 GER_On_A_Red_Horse_Sat_War_desc:0 ""
 GER_Riding_On_A_Pale_Horse_Came_Death:0 "Riding On A Pale Horse, Came Death"
 GER_Riding_On_A_Pale_Horse_Came_Death_desc:0 ""
 GER_GT_Econ:0 "Alles Für Das Reich"

