 ### CHARACTERS
 
 POSTNUKE_The_Fuhrer: "The Fuhrer"
 POLITICS_POSTNUKE_THE_FUHRER_DESC: "THEY ARE STILL ALIVE! OUR MISSION REMAINS INCOMPLETE!\n\nAccording to our sources, the hated Teuton still lives. Somewhere to our West, the rats scurry and crawl from their hiding places and begin to rebuild. If you open your ears enough, you can almost hear their chattering and hastened pacing. Despite our best efforts, the Great Trial remains in session.\n\n No doubt they come back East to take back what was once there's. Their debauched tendencies never fell with their humanity. All of the old Nazi leadership: Keitel, Boreman, Speer, Himmler, Eichmann, Goebbels, they all sit in their bunkers and laugh mockingly at the Black League. They laugh and mock at their pathetic attempt to end their existence, like Kings who had deduced poisoned wine.\n\n  Steadily, bit by bit, they begin to sally out from their irradiated fortresses. Bit by bit, they rally to face the Black League one final time. Bit by bit they claw at the walls and bunkers to destroy the last remnants of Russia's defenders. One final time, the Teuton rises and reaches for the sun."
 
 POSTNUKE_Kommer_Damen: "Kommer Damen"
 POLITICS_POSTNUKE_Kommer_Damen_DESC: "Beyond the noxious tendrils of the nuclear bombs, a small group known as the Army of Salvation has coalesced around what the forests of Ostland, remote enough to have escaped the worst effects of the bombing. Under this group is a wide umbrella of refugees, former-soldiers, and a small detachment of Swedes led by Carl Eric Almgren, a former-General in the Swedish Army.\n\n Originally dispatched as an attaché, Almgren stood out as the only unifying figure with military experience in the region. As such, under his strict yet fair rule, and guided by the values of Christ, he assembled a militia in order to combat the area's bandits, SS holdouts, and Omsk remnants. This militia, to the best of their ability, fights to protect the people from these supposedly bygone and hateful forces.\n\n  Of course, Almgren holds out hope for the future of the wasteland. One day, his soldiers and the civilians they protect will ink out more than a motley existence in the wastes. One day, they will rebuild. They are a motley band of Germans, Swedes, and Balts. Yet, together, they all dare to dream. "
 
 POSTNUKE_Dmitry_Yazov: "Dmitry Yazov"
 POLITICS_POSTNUKE_DMITRY_YAZOV_DESC: "Boots, boots, boots, boots, movin’ up and down again—There’s no discharge in the war!\n\nThese monotonous actions define the current stage of the Great Trial and the illustrious Glavkoverkh’s life. These years- hell, maybe even decades- are not enough to deter the hatred harbored in Dmitry Yazov's heart. He stirs like a rabid dog at the chance to leave his concert catacomb, which would see lesser men and nations break under the pressure of a post-nuclear society. These underground labyrinths, like conduits to Damnation itself, witness the lowest dredges conspiring in the sea of the faithful. The League’s children, in the bunker with their leader, live under the regime’s watchful eye, for dissidents and Teutonic sympathizers alike; like rats, they shall be flushed out and incinerated. This busywork blinds them to the glaring issue at hand: the Teutons are undoubtedly revitalizing within these acrid wastes, one day at a time. But Yazov does not fear, for this will not stop them from their ultimate goal and purpose. He awaits the day he can see Russia again, or what remains of it.\n\nUntil that fateful day, until the continuation of the Great Trial he can only stir and roam these iron halls, painted yellow by halogen bulbs. He counts the bullets, bread, blood, and boots over and over again. The containers, dorms, hunger, thirst, and weariness pale and deepen, but the League stays vigilant. The strong endure, and the weak fall. The strong march, and weak starve.\n\nBoots, boots, boots, boots, movin’ up and down again—There’s no discharge in the war!"
 
 POSTNUKE_Evgeny_Savintsev: "Evgeny Savintsev"
 POLITICS_POSTNUKE_EVGENY_SAVINTSEV_DESC: "§xCONTINUE DEFENSE OF MOSCOW AS DIRECTED.§!\n\nNo matter how many updates of the situation Evgeny Savintsev receives from Moscow, no matter how many times he's assured that all that's left is a smoldering ruin of no value, these are the only orders that continue to leave his office. Even as countless men fight and die over blocks that have long forgotten purposes, homes whose occupants have long since perished, only one directive is given:\n\n§xCONTINUE DEFENSE OF MOSCOW AS DIRECTED.§!\n\nThere are many theories on why the defense of Moscow continues, even as the war was long since dragged into the mud by nuclear fire. Some say he was driven insane by the incomprehensible losses suffered. Others say that Savintsev was unwilling to let the cause he sacrificed so much for be for nothing. It's even been suggested that Savintsev was killed by the nuclear blasts, and the directives are nothing but automated responses. Nonetheless, one order continues to echo across the ruins of Moscow to Black League soldiers:\n\n§xCONTINUE DEFENSE OF MOSCOW AS DIRECTED.§!"
 
 POSTNUKE_Adolfas_Ramanauskas: "Adolfas Ramanauskas"
 POLITICS_POSTNUKE_ADOLFAS_RAMANAUSKAS_DESC: "The §xGreat Trial§! has seen some of the worst that humanity has to offer. Every day, scores of civilians and innocents were cut down by and slaughtered by both sides. Hundreds of cities and centuries of history were all reduced to rubble that men fight and die over. In this conflict, there are no clean hands. Adolfas Ramanauskas, while not an exception, is trying to change that and atone.\n\nAdolfas, like many of his brothers-in-arms, cooperated heavily with German forces throughout the 60s and 70s. The encroaching Black League, however, pushed him to his limit. He oversaw endless cruel executions of his own beloved Lithuania and turned a blind eye to acts of pillage and wanton destruction his masters inflicted. As the lands he lived on crumbled beneath him and the sky above him fell to the Earth, however, something changed.\n\nUnder the banner of the Men of Lost Honor, all manner of former soldiers are united. Black League soldiers, SS Paramilitary, Russian and Baltic collaborators of all stripes, all stand united under a simple promise: to atone for the mistakes they've made and protect the people who they once ruled over."
 
 POSTNUKE_Akihito: "Akihito"
 POLITICS_POSTNUKE_AKIHITO_DESC: "Akihito knew nothing but the sublime beauty of the Japan he once lived in. He remembered strolling through the calm rock gardens of the Imperial Palace and admiring the architecture of his ancestors. Now, it is all gone, alongside the rest of Tokyo and Japan's major cities. All he remembered now was the haste at which his servants crammed him into a car that took him below Mount Fuji. Then, there was the shaking, the horrible, awful, non-stop shaking.\n\nWhen he was allowed to peer out, he witnessed a city buried beneath rubble and dust. Beneath the mountain in the bunker, discussions were already underway of what to do. There, the news was broken that Hirohito, his father, the now Emperor Shōwa, never reported to his shelter. Akihito was now Emperor, acceding hastily and shoved into the role of figurehead for a new, fractured Japanese government.\n\nDespite it all, there were survivors in need of aid. Across Japan, reorganization efforts begin. Municipalities under the blessing of Akihito are reforming along new lines, and services are being distributed. The new cabinet, as shrunk as it is, issues official decrees by radio. Perhaps one day, a new session of the Kokkai will convene. The road for Japan is irradiated and treacherous. But, with him at its stead, it shall hopefully recover."
 
 POSTNUKE_Aleksandr_Sakharovsky: "Aleksandr Sakharovsky"
 POLITICS_POSTNUKE_ALEKSANDR_SAKHAROVSKY_DESC: "Aleksandr Sakharovsky follows a very strict routine.\n\nAt 7:30 in the morning (or roughly about, the Redoubt's clock has gotten out of time over the years), he and everyone else awaken. The people who were working the night shift shuffle to their billets, and the people who work the day shift take positions on the assembly lines. For the next five hours, they work to produce firearms with the dwindling supplies they have. They receive a fifteen-minute lunch before resuming work until they rest at 7:30 in the evening.\n\nIt's a cycle that Aleksandr has been maintaining for as long as the Industrial Redoubt has been operational. The men inside have long forgotten what the outside world was, only knowing their purpose in producing rifles and sending them to win the Great Trial in the west, even as nuclear fires drag the conflict to an end, even as the soldiers who supposedly receive the guns continue to dwindle, and even as Aleksandr cracks more and more with the knowledge that his work is for nothing.\n\nIn the meantime, he will continue to produce and ship firearms if only because he can't fathom doing anything else."
 
 POSTNUKE_Sergey_Akhromeyev: "Sergey Akhromeyev"
 POLITICS_POSTNUKE_SERGEY_AKHROMEYEV_DESC: "Even during the all out war with the Germans, there remained those who doubted the Black League and Yazov’s cause. Nothing was spared, not even other Russians and Slavs if they surrendered. Everything was to be fed to the great Russian war machine. Sergey Akhhromeyev and his unit are former special forces and amongst those who rejected the Black League’s hateful ideology which saw the world drenched in radiation. Caught in no-man's-land, they founded a new community in Western Ukraine, formed of soldiers and survivors based on the ideology of Marx and Lenin. It promises equality, shared ownership, and a fair deal for all willing to work.\n\nSergey tries his best to uphold stability and rule of law despite the many difficulties they face, vowing to protect their community from the nightmares of Nazism, Yazov’s remaining followers, and the various disparate bandits and gangsters prowling the wastelands. Afterall, West Ukraine yet retains some usable land, enough to maintain a meagre but manageable existence of farm and forage. So, despite everything, Sergey Akhromeyev and his motley band are determined to remain a beacon of hope for survivors in this bleak, moribund, and irradiated new world.\n\n"
 
 POSTNUKE_Carl_Erich_Almgren: "Carl Erich Almgren"
 POLITICS_POSTNUKE_CARL_ERICH_ALMGREN_DESC: "As the old world ended in nuclear fire, the last embers of the past may be enough to provide just enough of a spark to restart the flame of society. When the end came to the Netherlands, the major port of Rotterdam was spared the end by sheer chance as the nuclear weapon that was aimed at burning the city far beyond what happened in 1940, it failed mid-flight. When the apparent connections with the wider world fell away, the engineers and workers at the Damen Shipyards worked with their remaining storage of diesel and machinery to begin constructing steam engines that would provide power long after the oil reserves ran out.\n\nMany people starved as the world went dark, but in Rotterdam the first basic steam engines provided the backbone for industry and commerce to revive itself post war. WIth that came money, and not long afterwards, power over the wider region as Damen Shipyards was the one place that could keep the lights on and it’s machines running, at least long enough to build up a steam-powered base of industry. \n\nAt the head of this entity stands Kommer Damen, the prodigal son who revolutionized and simplified the shipbuilding process during the early 60’s before resolutely launching into emergency steps once the bombs fell down. With the complete collapse of Rotterdam’s local government, the Stoomheer as he came to be nicknamed was able to rise further and further as the first steam ships resumed fishing and commerce operations, reaching across the Dutch coast to begin connecting together the remnant societies under the corporate overlordship of Damen. N.V. who could provide supplies and support in return for labour and taxation.\n\nBut now, the company’s success may perhaps become its undoing as immediate survival needs are met and the local communities begin to demand more representation in the Company’s affairs. Unions and local political organisations are starting to form and the universal acceptance of Damen N.V’s control over most affairs is finally beginning to be questioned. Now the question remains if the Lord of Steam will finally begin to not just revive the economy but the old democratic politics of the netherlands. Or perhaps, Kommer Damen will retain his grip, forever driving forth the new iron engine of progress forwards, no matter the price paid."
 
 POSTNUKE_Andrey_Matvienko: "Andrey Matvienko"
 POLITICS_POSTNUKE_ANDREY_MATVIENKO_DESC: "Kazakhstan has not known peace in two centuries. Subjected to the brutality of Tsars, the tumult of the Bolsheviks, and finally the continuous and never-ending terror bombings by the Germans, hope was counted amongst those who could scrounge for food and water in the shell-shocked steppes and survived day by day.\n\nForceful reunification with Omsk did nothing to solve Kazakhstan's woes. Trading one master for another, most simply found themselves transferred from farms to factories. Even as the bombs dropped, the chains of oppression clung desperately to Kazakhstan's.\n\nAndrey Matvienko, in his capacity as the military governor of Kazakhstan, continues Omsk's brutal cycle over the ashen steppes. Trapped and mostly confined in underground bunkers, the people are put to work far from the land of their ancestors. Choking in smoke and dust, Kazakhstan grinds forward for when the Great Trial is to begin again."
 
 POSTNUKE_Carl_XVI_Gustaf: "Carl XVI Gustaf"
 POLITICS_POSTNUKE_CARL_XVI_GUSTAF_DESC: "Carl XVI Gustaf, born Carl Gustaf Folke Hubertus, is a relatively new King, having only been enthroned in 1973. Ever since then, he has lived a life of slow escalation: escalation in tension around the world and escalation of the demands placed upon him. Despite this, he and the Royal House of Bernadotte never thought they would be ejected from their lives of relative comfort and privilege.\n\nWhen the bombs dropped, obliterating all of Stockholm and most of Sweden's populated South, the King and the remnants of his family fled with his citizens to the relatively uninhabited north, which was thankfully spared from bombing. There, he has set up an emergency government, himself as figurehead, to rebuild hand-in-hand with survivors fleeing from the also-decimated Norway.\n\nCarl Gustav now trades palaces for huts, servants for citizens, and his rank for true, life-bringing responsibility. His motley collection of refugees seek to build a new civilization in the far-north, free from the bombs. As he watches them slowly construct new roads, apartments, and install generators, he can only give a wry smile. Civilization would live on, because of men like him."
 
 POSTNUKE_Council_of_the_Caucasus: "Council of the Caucasus"
 POLITICS_POSTNUKE_COUNCIL_OF_THE_CAUCASUS_DESC: "The Caucasus have, for the longest time, known nothing but repression.\n\nFirst, they faced the imprisonment of political dissidents during their time under the now-defunct Soviet Union. Then, they faced overwhelming violence and bombing during the Great Patriotic War and subsequent West Russian War. Beyond that, the entire region was then enslaved under the cruel whims of the Nazis. Finally, they faced the draconian repression of the Black League, where any dissenting concept was ground to dust under an overwhelming heel.\n\nTheir suffering has only ended by way of a 30,000-degree salting of their lands, with the survivors slowly gathering together to form the Council of Caucuses. A disjointed government of many different ethnicities and languages coming together,  they are all bound together by an infinitely strong glue:\n\nThe collective torture their lands have gone through and an overwhelming need to survive, whether that be because of self-preservation or to spite those who have tried to to ensure they don't."
 
 POSTNUKE_Fyodor_Pavlovsky: "Fyodor Pavlovsky"
 POLITICS_POSTNUKE_FYODOR_PAVLOVSKY_DESC: "In the face of the end of civilization as we know it, and especially in the former lands of the Black League, sights of wanton cruelty and atrocities are depressingly common. However, if one ventures far enough north to the otherwise barren lands of Yugra, there is a small beacon of light.\n\nThe Ural Commune is an anarchist commune that formed as a combined effort of the few people who live in the sparsely populated region. At the front of the commune uniting everyone who inhabits it is Fyodor Pavlovsky. A partisan who witnessed and survived both the Second World War and the first West Russian War, he's accustomed to fighting tooth and nail to survive. And even if the odds are heavily stacked against him, he has no intention of abandoning his cause.\n\nTo accomplish his goals, he's gathered what food and weaponry he can. It isn't much, but he and his people share what they can in the ancestral lands of the Yugra principalities. In a way, it is an almost rustic existence as civilization slowly returns to the banks of the Ob, heralded by the calls of fishermen's wives and roosters."
 
 POSTNUKE_Jaakko_Valtanen: "Jaakko Valtanen"
 POLITICS_POSTNUKE_JAAKKO_VALTANEN_DESC: "Jaakko Valtanen was a man of honest compunctions with a long history of service. Having first enlisted in the army at the age of fifteen during the first stages of the Continuation War, the short post-war peace allowed for his rapid advancement within the Finnish Defence Forces, with him commanding a series of coastal forts protecting the north of Finland’s new empire against Russian raiders.\n\nHe and his family were vacationing in the countryside when the bombs fell, wiping out most of Finland's cities, population, and much of Parliament. What was left of Finland that remained untouched by the toxic radiation consisted of its vast hinterland, sparsely populated and difficult to control when the government was at peace, let alone now that anything resembling a cohesive civilian government had long since ceased to exist.\n\nValtanen reluctantly accepted his appointment as leader of the new military administration, one that seeks to try to restore Finland to its former glory amidst a power struggle in the remnants of the Finnish Defence Forces. An apolitical general mostly confined to duty and nation beyond all else, he was the only agreeable candidate to all factions that emerged from the shattered remains of the Finnish military. Now at the helm of the Land of a Thousand Lakes, he must become this age's Mannerheim, to govern Finland out of its most difficult challenge: the end of the world as we knew it, and perhaps the beginning of a new one if he succeeds in his task."
 
 POSTNUKE_Jurgen_Echternach: "Jürgen Echternach"
 POLITICS_POSTNUKE_JURGEN_ECHTERNACH_DESC: "The denizens of Neues Hamburg is an eclectic mix, born out of desperation and survival. Composed of German colonizers, refugees from the bombs, and the remaining slavic population, this community lives under a single metaphorical roof, carving out a territory on the peninsula that once was the German Reich’s strongest bastion along the Black Sea. Named after the old Hanseatic port of Hamburg, the population carves out its means through the sea, venturing far in their rickety and decaying vessels to try and collect clean catch. It is a struggle, but one that they’re committed to overcome. The population, once at each other's throats, now co-exist to try and eke out a meager living together. By the grace of God, the people began to do this in tandem, working together to rebuild the city, maintain its defense, and reclaim the land. Whilst certainly not flourishing, the embers of a dream grow in the people's minds. As the largest German port city to remain, could it prosper in this hellish new world?\n\nJürgen Echternach, a refugee himself, leads this collection of wayward souls in a world that has nearly doomed itself. He is challenged to create what was previously thought impossible: a community where many peoples, bonded by nothing but circumstance, could survive in this harsh, post-nuclear hellscape. Although difficult, he has attempted to build inclusive institutions and keep his people alive. But, as New Hamburg's Bürgermeister, it remains to be seen whether this seemingly irradiated dream will become reality or if it’ll evaporate like so many other dreams did once the nuclear bombs erased thousands of years of human progress."
 
 POSTNUKE_Lazarenko: "Alexander Lazarenko"
 POLITICS_POSTNUKE_LAZARENKO_DESC: "For Alexander Lazarenko, the most faithful soldier of the black league and her 2nd in command. Life in a bunker has been nothing short of exhausting. It had only seemed yesterday the nukes fell all those years ago. He couldn’t remember for sure if the nuclear launches were ordered first by Yazov or the Teutons orders.\n\n\nHe has spent most of his time organizing what remains of the armies of the black league, perhaps more than necessary, but he couldn’t help himself but to organize and reorganize the command structure over and over again until it was perfect in his eyes. He was also placed in command of drilling the troops in the bunker and maintaining morale ever since he entered this damned bunker, to Lazarenko the latter order was the hardest, he couldn’t think of what to do to increase morale among the troops, drilling the troops was easy to accomplish. N\n\nYet. Lazarenko has begun to question if what he’s doing is worth it, the first time he’s ever done that in all of his life in the black league, it was exhausting to him doing the same thing over and over and over again… Perhaps it’s better to not question it then fight it..."
 
 POSTNUKE_Lennart_Jedeur_Palmgren: "Lennart Jedeur Palmgren"
 POLITICS_POSTNUKE_LENNART_JEDEUR_PALMGREN_DESC: "Lennart Jedeur-Palmgren looks upon the craggy, wind-swept shores of Gotland and can only sigh. Having been an officer in the Swedish Navy since 1949, he has served his King, his country, and his ideals faithfully for decades now. Previously, he saw his assignment to Gotland as a promotion, a cause for celebration. Afterall, the Baltic Sea was the only means by which either the Germans or the Black League could approach Sweden's shores.\n\nNow it has taken on a new dimension. With the remnants of the Omsk Fleet dug in at Öland, the flow of refugees, supply, fuel, and information across that same sea is imperiled. He and his sailors, cut off from the now irradiated Stockholm, will never go home. Yet, their duty still calls to them one last time. So, in response to the pirate menace, Jedeur-Palmgren has turned Gotland into a fortress of his own, constructing rudimentary dockyards, dryports, and workshops to maintain his ships and fabricate ammunition. Whatever the cost, Omsk would not control Sweden's shores and the island of Gotland shall be an oasis of sanctuary for Nords and Germans alike.\n\nAfterall, even though Sweden has crumbled, the work of her dutiful sons shall never end."
 
 POSTNUKE_Mikhail_Khronopulos: "Mikhail Khronopulos"
 POLITICS_POSTNUKE_MIKHAIL_KHRONOPULOS_DESC: "In decades past, an old Soviet fleet found itself marooned in Kamchatka, assailed on all sides by both the cold and remnant warlords, each jostling for its small bit of the Siberian wastes. Now long gone, a new flotilla of damned souls finds itself stranded. Under Admiral Mikhail Khronopulo, the Black League Far East Fleet found itself the unfortunate victims of déjà vu.\n\nAdmiral Khronopulo never thought it would end up like this. His fleet was one that saw limited action during the initial stages of the Great Trial, however their task was still an important one. Monitoring the League's far-eastern flank, he could take pride in his ships and sailors as the rearguard of the effort, ensuring Japan could never strike with the element of surprise.\n\nNow, he watched as they desperately fought the cold to prevent the glass windows of his ships from shattering, the steel from becoming brittle, and themselves from freezing, all the while the rest dug trenches and pillboxes into the frozen ground. With little fuel for themselves, let alone for fueling his ships to a potential escape, Khronopulo can only watch his rear, hoping that the large guns of his battleships could keep the dregs at bay."
 
 POSTNUKE_Nikolai_Ogarkov: "Nikolai Ogarkov"
 POLITICS_POSTNUKE_NIKOLAI_OGARKOV_DESC: "Nikolai Orgakov is a survivor. Once a general in the destroyed West Russian Revolutionary Front, had briefly joined the league shortly after 1970, contenting himself to fulfill the late Red Napoleon's vision in another uniform. However, prior to the Great Trial, he found himself purged in one of several cleanses Yazov undertook to ensure the ideological purity of the league. Now however, with the bombs having dropped, Orgakov takes on a new mission.\n\n\nThe newly reconstituted West Russian Revolutionary Front, founded by Orgakov alongside communist holdouts, promises a vision for Russia free from the tendrils of Nazism and Yazov's genocidal mania. Instead, Orgakov has crafted a society based around the ideals of War Communism in order to survive the apocalypse and save the people. Afterall, Orgakov knows that nothing less will protect Russia from the threats that now roam the wastes.\n\nMeanwhile, Orgakov and his soldiers must live a spartan existence. The mission of protecting West Russia is a difficult one. Roving bandits terrorize any settlement left unprotected by his red militias. But, each and every soldier and officer knows that the hardships they endure today will pave the next generation's revolution that will finally reclaim the union of their forefathers."
 
 POSTNUKE_NORAD: "NORAD"
 POLITICS_POSTNUKE_NORAD_DESC: "NORAD essentials contains the remaining military High Command and any remaining politicians who weren't in the large cities and subsequently atomized. Now they're held up in the Cheyenne Mountains under the belief they are now the only remaining United States authority in the wasteland, cut off from the outside world.\n\nThe mountains of the Cheyanne are host to many secrets. Not least of these secrets were a large network of underground bunkers, fitted with advanced ventilation, power generators, living quarters large enough to house a battalion, and a fully fitted command post able to contact anywhere in the United States, from West Point to Guam.\n\nWhen the bombs dropped, these bunkers filled to their brim. NORAD was meant as a defensive shield for North America, but the sheer amount of weapons dropped meant that only a pitiful few bombs in select sites were destroyed upon descent. NORAD's commanders, held up in their bunkers, could only watch helplessly as DC was annihilated. They, as far as they knew, was the last remnant of the United States on the Earth.\n\nThe chain of succession was broken. Unable to leave, the remnant politicians and generals NORAD that managed to entomb themselves have gathered in a twisted stratocracy, forced to live lives of rigid discipline in hopes of reclaiming some semblance of order from the nuclear waste. Over the years, the air grows more stale, the generators stall out one by one, and the complex's rulers grow more desperate, it seems more and more likely that NORAD eats itself out from the inside. Such will be the case, unless those who dare sate the curiosity of finding out what lies outside the door."
 
 POSTNUKE_Pyotr_Yakir: "Pyotr Yakir"
 POLITICS_POSTNUKE_PYOTR_YAKIR_DESC: "Pyotr Takir is an unlikely leader. One of many victims of Yazov’s regime, by the time the bombs fell, he had been reduced to merely a number in the endless records of captives that were healthy enough for hard labor but inadequate to be shoved to the frontlines. He thought he’d toil to his death, but the apocalypse brought with it an unlikely chance at a new life for the prisoners in the subterranean factory-dungeons of Tomsk.n\n\nTakir, true to the Decembrist cause, believes in working towards healing Mother Russia and restoring her natural beauty. While under no illusion that he and his comrades can accomplish this dream in their lifetimes, they still believe in and work towards that day when they can reclaim Siberia and restore its lush forests, rivers, and plains, however unattainable it seems.\n\nBut in the meantime, survival remains first. What remains in Tomsk's battered ruins is an eclectic collection of those Yazov sought to dispose of: artists, political dissidents, and fellow dreamers. But with a large supply of food and arms meant to sustain the prison for a generation at their disposal, the citizens of New Tomsk stride forward. It is, afterall, their destiny to bring back life to Russia after emerging from their underground prisons."
 
 POSTNUKE_Swiss_Council: "Swiss Federal Council"
 POLITICS_POSTNUKE_SWISS_COUNCIL_DESC: "In 1815, the Congress of Vienna ruled that Switzerland would, forevermore, be a neutral country. Since then, the world has witnessed two world wars, multiple continent-spanning conflicts, endless threats to their existence as a state, and even complete societal collapse. Yet still, Swiss neutrality lives on.\n\nFormed from the threat that the German Reich posed during its decades of hegemony, the Swiss Alps host an exhaustive bunker system that would've seen use if Germany had decided an independent Swiss state couldn't be tolerated anymore. Comparable to the Black League's redoubt, the bunkers currently host a large majority of the Swiss population, under the protection and governance of the Swiss Federal Council.\n\nEven though they've found safety in their bunkers, the area around them remains an inhospitable wasteland. The next generation of Swiss will likely be forced to grow up without ever seeing the world beyond their bunkers. Nonetheless, the Swiss Federal Council will continue to do everything in its power to safeguard its people hidden deep within the Alps."
 
 POSTNUKE_The_Chosen_One: "The Chosen One"
 POSTNUKE_The_Chosen_One_desc: "Placeholder"
 
 POSTNUKE_Vasyl_Halasa: "Vasyl Halasa"
 POLITICS_POSTNUKE_VASYL_HALASA_DESC: "Vasyl Halasa has fought for the independence of Ukraine for his entire life. However, that fight has seemingly only produced one tyrant after another. When the UPA successfully helped bring about the end of the Soviet Union, their German allies simply turned their newly won conquests onto them, seeking to force Ukraine under a new yoke to feed Germany's colonization. When that order broke down, the Black League simply came in to fill the vacuum, content to use Ukraine to its own ends. No matter how hard Halasa fought, the jackboot still lay perilously close to Ukraine's jugular.\n\nThen, what Halasa could never have predicted came to pass. The world burned, literally. Nuclear bombs fell on both the Germans and the Russians, taking out both of Ukraine's oppressors in one fell swoop. The homeland, however, was not spared. Much of its lush farmland, rivers, and landscape are irradiated beyond habitability. Halasa, an ultranationalist at heart, will once again fight for an independent Ukraine, a phoenix to rise from the ashes. Except now, instead of fighting to create a nation, he fights to preserve what little is left in the face of raiders, outsiders, and what remains of Ukraine's oppressors. The UPA steels itself, for they know that one day, those former enemies of their beloved nation will come for them once more."
 
 POSTNUKE_Vasyl_Kuk: "Vasyl Kuk"
 POLITICS_POSTNUKE_VASYL_KUK_DESC: "Placeholder"
 
 POSTNUKE_Vladimir_Chernavin: "Vladimir Chernavin"
 POLITICS_POSTNUKE_VLADIMIR_CHERNAVIN_DESC: "The Great Trial goes on… in seas of the Baltic. Remnants of the Black Fleet, once a proud symbol of the League's military buildup, now occupy the island of Öland. Once inhabited by Vikings, it is now a fortress, with the Black Fleet's sailors digging-in following the nuclear exchange that doomed much of the world and stranded their navy. However, despite its bluster and on-paper crushing force, it is a pale imitation of the true navy it once was.\n\nAdmiral Vladimir Chernavin knows this all too well. His sailors scrounge for fuel, food, fresh water, and are engaged in a constant struggle with the locals he relies on for supplies and repairs. Additionally, despite his rhetoric, he and his sailors know the truth of their position. When the bombs dropped, all pretenses disappeared with civilization. To survive, Chernavin and his men engage in what is essentially piracy, sallying out to pillage, burn, and loot what few settlements and ships can still be found in this new radioactive hellscape, this legacy of the §RGreat Trial§.\n\nTheir existence is pitiful. The men's discipline falters more day-by-day, and the prospect of revolt by the local Swedes grows. The supply of shells, already sparse during the Great Trial, has all but run out. Longing for home, Chernavin can only keep his men focused on the ultimate objective. If they can destroy the remnants of the Swedish Navy at Gotland, they would be rendered uncontested rulers of the Baltic, free to sail wherever the wind takes them. With each passing day, however, that objective feels more like a delusion than a goal."
 
 POSTNUKE_Vladimir_Pikalov: "Vladimir Pikalov"
 POLITICS_POSTNUKE_VLADIMIR_PIKALOV_DESC: "Decontamination is a hard, dangerous, and costly business. Radiation is often insidious, it's effects will only be felt by the men and women deteriorating from cancer, lack of bone marrow, and the physical degradation of their body's DNA years down the line. Yet, it must be done before the poison can seep further into Irkutsk's rivers and eventually, God forbid, the Lake Baikal.\n\nThis responsibility fell to Vladimir Pikalov, previously an officer in the Black League's Chemical Troops, a body specifically raised to deal with chemical, biological, radiological, and nuclear threats throughout Russia. Being some of the only men equipped in the wasteland to actually deal with the horrific scars that the §RGreat Trial§! has inflicted upon Mother Russia, he and his fellow officers have cast side their former loyalties to Yazov and formed a military administration in hopes to decontaminate the Far East of Russia. These men seek to create a world where future generations of Russians can live and prosper without the fear of radioactive blight.\n\nIt will not be easy. Radiation seeps into every tree, animal, and molecule it can. Yet, with geiger counters in one hand and pistols in the other, Pikalov and his men set out to do the impossible: rebirthing Russia to its former glory, free from the scars of the bomb. The officers lament that they will never see this goal within their lifetimes. Many already feel the effects of their lethal doses. Many already suspect they are already developing cancer. Nevertheless, they march forward and try because they know, their children and grandchildren deserve to inherit a better world than the ones that they currently have to endure."
 
 POSTNUKE_Yuri_Drozdov: "Yuri Drozdov"
 POLITICS_POSTNUKE_YURI_DROZDOV_DESC: "Prior to the fall of the bombs, Yuri Drozdov was as fanatical as any Black League general. His faith in Yazov was ironclad, and was only further strengthened by his campaigns against the hated Germans.  As his armies advanced, he bathed in the glory of re-taking the sacred city of St. Petersburg. When the bombs dropped however, what was once the crown jewel of Russia was reduced to little more than an irradiated ash heap.\n\nDespite this, Yuri’s faith did not waver in the slightest, considering the strategic situation salvageable, despite the scale of the destruction and depopulation suffered by the area. As such, his governance of the city remains largely unchanged. The harsh jackboot of the Black League Army would remain.\n\nIn the meantime, he and his ruling clique are convinced that the end of the world is merely a strategic pause, and that the advance is soon to continue. Throughout the city, soldiers are to maintain high readiness, and the people are ordered to work themselves to the bone to provide for them. What few, dwindling resources remaining in the city shall continue being fed to the machine, or at least, what's left of it. Word has yet to come from Omsk. Nonetheless, Drozdov and his clique continue to maintain their faith in the cause, stamping out those who have since lost theirs."
 
 POSTNUKE_Yuri_Orlov: "Yuri Orlov"
 POLITICS_POSTNUKE_YURI_ORLOV_DESC: "Yuri Orlov was, prior to the end of the old world, a scientist living in the city of Arkhangelsk. Under the austere and iron fist rule of the Black League, Orlov buried himself in his agriculture work, keeping a low profile whilst attempting to plant whatever would take to the inhospitable, frozen lands surrounding the city. It was a battle, but he and his colleagues succeeded in developing hardier strains to combat the arctic frost. His secret left-leaning views were kept well hidden.\n\nAfter the bombs fell, the city and its surrounding hamlets were left without administration. Fearing a fall into utter chaos, Orlov pieced together the Arkhangelsk Sanctuary, a broad coalition attempting to live and work together under the nuclear mushroom. Under his leadership, a democratic and highly communal society has emerged, one that doesn't adhere to any particular ideology. Instead, it is focused foremost on creating a functional living space and keeping its people alive. Buoyed by remnants of Russia's intelligentsia within its walls, Orlov and the Sanctuary hope to eke out a stable, if spartan existence in Russia's untapped hinterland."
 
 POSTNUKE_Vyacheslav_Ivankov: "Vyacheslav Ivankov"
 POLITICS_POSTNUKE_VYACHESLAV_IVANKOV_DESC: "Who said the post-apocalypse didn't have a need for speed? With the fall of civilization comes new opportunities to pillage, plunder, and explore. Vyacheslav Ivankov knows this all-too-well. Even whilst Russia was under the totalitarian jackboot of the Black League, men like him always found willing consumers in their line of work.\n\nNow, with anarchy ruling over western and central Russia, Ivankov has seized his chance… literally, by seizing control of an underground factory near Samara, capturing their vast vehicle stockpiles. With these, and hundreds of thousands of weapons in his and his thug's hands, his merry band of turbo-charged madmen terrorize the countryside, shooting any who resist and flattening the rest, all in the meantime filling their trunks with stolen loot.\n\nThis is, of course, all towards a goal. Like any petty king, Ivankov has wide aspirations of controlling his own private fiefdom. This is well within reach if only he can only gain the expertise, manpower, and know-how to upgrade his gaggle of rusting scrap into something even greater. In the meantime, he continues speeding down the vast Russian steppes, occasionally cowering behind the Volga when things get hairy, stealing everything not nailed down. His black flag, emblazoned with their terrifying battle cry of, \"We follow no laws but our own\", shall know only fear west of the Volga."
 
