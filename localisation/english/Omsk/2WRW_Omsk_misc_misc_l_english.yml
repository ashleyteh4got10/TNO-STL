l_english:
 TNO_anarchy_ZZZ_Great_Finale_tt: "§RThe Global Wasteland§!"
 TNO_anarchy_ZZZ_Great_Finale_tt_delayed: "The end has come.\n\n Mankind is gone.\n\n §xREST IN PIECE, THE MISTAKE SHALL NOT BE REPEATED§!"
 TNO_anarchy_ZZZ_Great_Mistrial_tt: "§RThe Great Mistrial§!"
 TNO_anarchy_ZZZ_Great_Mistrial_tt_delayed: "The Great Trial has failed.\n\nIt was thought by some, daring and confident alike, that it would leave the world cleansed of the Germans — a prediction that turned out to be false, as significant portions of the Motherland now burn under the avalanche of nuclear weapons. Today, the same people who once thought the Great Trial would be a victory fight to make it to the next day, amongst the despair, confusion, rubble and corpses of the millions dead."

 # Omsk War Milestones
 SWRW_Omskmilestones.1.t:0 "[Get_newspaper_header]Capture of Konigsburg"
 SWRW_Omskmilestones.1.desc:0 "Reports on the war in Eastern Europe have concluded that the Russian armed forces have breached into East Prussia occupied the German port city of Königsburg.\n\nAnalysts and world governments never expected the deadly continental war to culminate In the Russian National Reclamation Government entering mainland Germany, but it seems the end of war is inching closer and closer.\n\nOfficials of the Pakt have declined requests for comment, and independent reports have confirmed turmoil and mutinies within the Wehrmacht and civilian populace after the Fuhrer and his staff seemingly went missing. Whatever the case, the tumult of the war seems to be teaching its conclusion."
 SWRW_Omskmilestones.1.a:0 "Alles ist verloren, starte sie alle..."
 SWRW_Omskmilestones.1.b:0 "Our vengeance is almost complete, nothing will stop us."
 SWRW_Omskmilestones.1.c:0 "The end is finally in sight."

 SWRW_Omskmilestones.2.t:0 "[Get_newspaper_header]The Fall of Ukraine"
 SWRW_Omskmilestones.2.desc:0 "The Forces of the League have found themselves in control of the breadbasket of the Reich, The first time the Ukraine has been under Russian control since the thirties.Reports from German broadcasts claim Kiev, Kharkov and other major population centres have been completely decimated by bombing raids trying to trap Wehrmacht forces in their strongholds, The process of which has killed thousands of civilians already.\n\nAs expected, The Black League’s treatment of captured German forces has been cruel, With the colony’s Reichskommissar hanged in front of live television, and commissars giving ‘little to no punishment’ to soldiers found guilty of executing German prisoners of war or those who defy martial law. As the front moves ever westward, The world can only watch in horror as eastern Europe burns."
 SWRW_Omskmilestones.2.a:0 "Scheiße..."
 SWRW_Omskmilestones.2.b:0 "Onwards, Soldiers!"
 SWRW_Omskmilestones.2.c:0 "We have come to this?"

 SWRW_Omskmilestones.3.t:0 "[Get_newspaper_header]The Fall of the Caucasus"
 SWRW_Omskmilestones.3.desc:0 "Military broadcasts and Newspaper articles have confirmed that the majority of German forces have fled from the Caucasus area and while some garrisons appear to be resisting in the south, The invading Black League has, for the most part, completely secured all major cities and strategic zones. For many decades a Nazi colony, The Reichskommissariat’s massive reserves of oil has instantly given the Reclamation government a boost in morale and resources, And shaken the already nosediving Nazi economy even further!\n\nDisturbing reports show a complete lack of regard for human rights for captured soldiers or civilians, with those refusing to comply with the League’s orders being immediately executed or reassigned to penal battalions. Regardless, It is clear that the Nazi government has lost a vaulable asset, And will possibly lose far more in the months to come."
 SWRW_Omskmilestones.3.a:0 "Mein Gott."
 SWRW_Omskmilestones.3.b:0 "Onwards To Germania!"
 SWRW_Omskmilestones.3.c:0 "Another nail in the Nazi’s coffin."

 SWRW_Omskmilestones.4.t:0 "[Get_newspaper_header]The Fall of Ostland"
 SWRW_Omskmilestones.4.desc:0 "As the League marches west into Germany, The Crown Jewel of the Reich has found itself under siege. Reports from both sides claim that fighting so brutal and intense that it could only be matched with the second weltkrieg itself took place as Russian forces attempted to push into Riga, Where they encountered heavy resistance by everything from elite German commandos to hastily conscripted Native militia. Televised broadcasts from Nazi stations, Now turned into propaganda outlets for the League show that Reclamation forces have been instructed to exterminate any and all settlements, particularly those with a majority German population. With reportedly thousands massacred by Russian troops.\n\nAs German forces no longer hold supremacy over Ostland, the Wehrmacht has fled to Poland as Millions of Germans and Poles are being conscripted to make one final hold against the Russian horde in the Vistula."
 SWRW_Omskmilestones.4.a:0 "HEILIGER FICK, HOL MIR SCHÖRNER JETZT!"
 SWRW_Omskmilestones.4.b:0 "One Last Push!"
 SWRW_Omskmilestones.4.c:0 "Not much longer now..."

 SWRW_Omskmilestones.5.t:0 "[Get_newspaper_header]Mass Purges In Russia!"
 SWRW_Omskmilestones.5.desc:0 "As the fury of The Great Trial casts its fiery cloak over all of Eastern Europe, photos and news leaks coming in from Russia show disturbing reports of Russian Glavkoverkh, Dimitry Yazov, disposing of several high ranking officials from both the military and civilian administration. While no official reason has been given as to why, analysts believe that the purges are due to Yazov’s dissatisfaction with the performance of the war in Europe, which has slowly grinded down to an impasse similar in vein to the First World War.\n\nThe purges seem to reach all echelons of the military and government, a scale which hasn’t been seen since Hitler’s Night of Long Knives. Officials from Germany state that this outcome was ‘expected from an adversary as savage as the Slav’. Meanwhile, Yazov expressed assurance that he simply is ensuring that his government is free of ‘influence from outside forces’."
 SWRW_Omskmilestones.5.a:0 "They’re destroying themselves! Now is our time to strike!"
 SWRW_Omskmilestones.5.b:0 "They are all guilty of the unforgivable crime: failure..."
 SWRW_Omskmilestones.5.c:0 "Have they truly gone mad?"

 #Omsk Nukes Everything
 SWRW_Omskmilestones.6.t:0 "Nuclear War Declared"
 SWRW_Omskmilestones.6.desc:0 "The unthinkable has happened.\n\nThe Germans have called the Black League’s bluff and they have failed remarkably. As German soldiers began the March on Omsk proper, the Earth shook. Hundreds if not thousands of nuclear weapons shot out of their silos.\n\nAs they silently sit in orbit slowly making their way towards the German homeland, the Reich has started preparations to remove what they believe to be “stains” on the world map. Ladies and gentlemen, this will be the end of not only news reporting but the Earth as we know it.\n\nThank you for reading."
 SWRW_Omskmilestones.6.a:0 "May holy flame cleanse the world!"
 SWRW_Omskmilestones.6.b:0 "Heil [GER.GetLeader]"
 SWRW_Omskmilestones.6.c:0 "For the emperor!"
 SWRW_Omskmilestones.6.d:0 "The free world shall be protected!"
 SWRW_Omskmilestones.6.e:0 "Hold your loved ones close."
  
 Global_Conflicts.57.t:0 "[Get_newspaper_header]Walter Jens Ascends to the Führership"
 Global_Conflicts.57.desc:0 "With the chaos of the Second German Civil War finally coming to an end, the now victorious Wehrmacht forces that mutinied against the Reich have now appointed a Führer of their own. Walter Jens, who joined the party in 1941 and served as a minor ally of Martin Bormann, now rules the battered German nation — at least ostensibly.\n\nJens' lack of experience has led many analysts to posit that the Wehrmacht remains in control, with his appointment serving as an attempt to obfuscate this fact from both the German public and the world. Regardless of the power he truly wields, however, this may signal the end of the turmoil that has engulfed the Reich since the end of the Second West Russian War and begin Germany's recovery from its recent devastation."
 Global_Conflicts.57.a:0 "Führerprinzip, but who's really the Führer?"
  
 Global_Conflicts.58.t:0 "[Get_newspaper_header]Richard Von Shirach Installed as Next Fuhrer"
 Global_Conflicts.58.desc:0 "Upon the bloody pacification of several dissident factions and the failures of the defunct Nazi regime, the provisional government led by the Wehrmacht has been reestablishing several components of the failed regime, even the various levels of bureaucracy that were problematic in Bormann's party. Despite these similarities, the Wehrmacht has kept all forms of leadership under strict supervision, including the newly elected Führer, Richard von Schirach.\n\nNephew of Joseph Goebbels and Bormann's right-hand man, Schirach is no stranger to National Socialist Orthodoxy and the management of the state. However, despite his willingness to lead, Schirach appears to merely be a begrudging figurehead for the Junta, a fact that appears to have caused tensions between him and the army."
 Global_Conflicts.58.a:0 "The army and a puppet Führer."
 WORLD.41047.t:0 "[Get_newspaper_header]Russian Incursion into Manchuria"
 WORLD.41047.desc:0 "Tensions in East Asia have boiled over following a Russian incursion into Manchuria. Hasty reports from the ground reveal that multiple divisions have crossed into Hailanpao, engaging in combat with local Kwantung forces. The cities of Blagoveshchensk and Nikolayevsk have suffered continuous shelling, with reports suggesting that Russian troops have been using the local supply routes to overwhelm the forces.\n\nXinjing and Tokyo have condemned the incursion, branding it as an "indisputable violation of sovereign Chinese territory.", with Xinjing confirming that its forces have been already mobilized to respond to the incursion. Tokyo for its part has yet to mobilize its own forces, seemingly confident in the abilities of the Kwantung Army to defeat Russia which only just emerged from decades of civil war."
 WORLD.41047.a:0 "A necessary fight for the liberation of Russian people."
 WORLD.41047.b:0 "This cannot be tolerated!"
 WORLD.41047.c:0 "Hopefully not the start of another war."

 WORLD.41048.t:0 "[Get_newspaper_header]Russian Incursion into Manchuria"
 WORLD.41048.desc:0 "Tensions in East Asia have boiled over following a Russian incursion into Manchuria. Hasty reports from the ground reveal that multiple divisions have crossed into Niuleimanho, engaging in combat with local Kwantung forces. The cities of Blagoveshchensk and Nikolayevsk have suffered continuous shelling, with reports suggesting that Russian troops have been using the local supply routes to overwhelm the forces.\n\nXinjing and Tokyo have condemned the incursion, branding it as an "indisputable violation of sovereign Chinese territory.", with Xinjing confirming that its forces have been already mobilized to respond to the incursion. Tokyo for its part has yet to mobilize its own forces, seemingly confident in the abilities of the Kwantung Army to defeat Russia which only just emerged from decades of civil war."
 WORLD.41048.a:0 "A necessary fight for the liberation of Russian people."
 WORLD.41048.b:0 "This cannot be tolerated!"
 WORLD.41048.c:0 "Hopefully not the start of another war."

 WORLD.41049.t:0 "[Get_newspaper_header]The Black League over Manchuria"
 WORLD.41049.desc:0 "In the wake of the swift and thorough Russian incursion across the Manchurian border, the Black League has secured a decisivie victory over Manchuria. After losing their last stronghold in the region, the Kwantung Army has conducted a disorderly retreat across the Amur River while being harassed by the Russian air force. The invasion, which saw intense urban combat and artillery barrages across a wide front, has led to the greatest destruction seen in the region since the Second World War.\n\nWhile the Black League has yet to formally acknowledge any hostilities, Tokyo lifted its uneasy silence by declaring that any further incursion on Chinese territory will result in an immediate response from the Japanese Military. As the guns fall silent, an uneasy peace returns to Manchuria while both sides entrench themselves along the river."
 WORLD.41049.a:0 "All according to plan."
 WORLD.41049.b:0 "Devastating."
 WORLD.41049.c:0 "Has war been avoided?"

 WORLD.41050.t:0 "[Get_newspaper_header]Manchuria over the Black League"
 WORLD.41050.desc:0 "In the wake of a swift and brutal Russian incursion across the Manchurian border, the Kwantung Army has achieved a decisive victory, driving the Black League back across the Amur River. After intense urban combat and relentless artillery barrages, Manchurian forces successfully held their ground, launching a counteroffensive that shattered Russian supply lines and forced a chaotic retreat.\n\nThe battle, which saw devastation not witnessed in the region since the Second World War, has left much of the borderlands in ruins. Despite their victory, Manchurian forces remain on high alert, with defensive positions being reinforced along the river in preparation for any renewed hostilities. Tokyo, breaking its uneasy silence, has issued a stern warning that any further Russian aggression will be met with full military force."
 WORLD.41050.a:0 "It wasn't supposed to be like this."
 WORLD.41050.b:0 "And never return!"
 WORLD.41050.c:0 "Has war been avoided?"

 WORLD.41051.t:0 "[Get_newspaper_header]Black League Invades Central Asia"
 WORLD.41051.desc:0 "The Omsk-based government of Russia has launched a full-scale invasion of the entire Central Asian region with the stated goal of reclaiming what it sees as rightful territories. The outbreak of war was deemed inevitable by many following Russia's gradual unification in the sixties. Though the invasion was met with condemnations from Tokyo and Germania, there seems to be little appetite in either capital to intervene in yet another war in the footsteps of the breakup of the USSR.\n\nWith this move, Russia has effectively established its own Monroe Doctrine and asserted itself in its own historical backyard. While unable to intervene, Pakt and CPS forces are nonetheless reinforcing their positions near Kazakhstan to deter future hostilities."
 WORLD.41051.a:0 "Another historical error rectified."
 WORLD.41051.b:0 "We must shore up our defenses in Kaukasien."
 WORLD.41051.c:0 "Another land war in Asia?"

 WORLD.41052.t:0 "[Get_newspaper_header]The Great Central Asian Earthquake of [GetYear]"
 WORLD.41052.desc:0 "Thousands are feared dead following an earthquake with its epicenter near Kzyl-Orda in Kazakhstan. With tremors being felt well beyond the nation's borders, early reports by semiologists indicate that this is by far the most devastating earthquake to hit the region since 1911, a claim that's been disputed by Russian authorities.\n\nThis disaster has led to calls for the secretive Russian National Reclamation Government to open its airspace and allow aid into the war-torn region which was recently annexed by Russia following an invasion. The RNCG for its part has downplayed the severity of the event and reassured the international community that it has the situation under control and refused any form of what it sees as foreign meddling into its domestic affairs."
 WORLD.41052.a:0 "We can't hide this for long."
 WORLD.41052.b:0 "After more than three decades of war, haven't they endured enough?"

 WORLD.41053.t:0 "[Get_newspaper_header]The RNRG invades Finland"
 WORLD.41053.desc:0 "Forces of the Russian National Reclamation Government have crossed the borders of the Republic of Finland today amid a heavy strategic bombing of Helsinki. In a statement from a spokesman for the Russian government in Omsk, the invasion is an overdue response to what it describes as Finland's systemic genocide against Russians since the state's independence in 1917 and declared that the Black League's intent is to bring Finland back under Russian control.\n\nThe international response to the invasion has been muted as Finland's allies deliberate on how to help the beleaguered Nordic state without the crisis escalating into a new general war in Europe. Finland fights alone as it finds itself in a death struggle against the irredentist Russian state."
 WORLD.41053.a:0 "Every inch of Russian territory must be reclaimed by the Motherland."
 WORLD.41053.b:0 "Yet another Continuation War."


 WORLD.41054.t:0 "[Get_newspaper_header]Sweden Intervenes In the Russo-Finnish War"
 WORLD.41054.desc:0 "Following the outbreak of the latest Russo-Finnish war, the government in Stockholm has declared its formal support for Helsinki by enforcing its 1942 defense pact. As of now, the government of Sweden is in a de facto state of war with Russia. The announcement was swiftly followed by the Greater German Reich pledging to let aid enter Finland through its Reichskommissariats without formally committing to sending troops to the conflict. In a joint message by defense officials from Sweden and Moskowien, these actions are meant to preserve European freedom against eastern totalitarianism.\n\nWith the war expanding, it's clear to international observers that this crisis is likely merely the first act in a greater war between Russia and Germany, this time fought on the soil of one of Germany's minor allies."
 WORLD.41054.a:0 "We will bury them alongside their Finnish cronies."
 WORLD.41054.b:0 "The Thousand Lakes run red."

 WORLD.41055.t:0 "[Get_newspaper_header]Helsinki Surrenders To the Black League"
 WORLD.41055.desc:0 "The surviving remnants of the now defunct Finnish government have offered their unconditional surrender to the government in Omsk, something that was all but a formality after the complete destruction of the Finnish state and the complete rout of its armed forces. Following the general collapse of the Finnish army in the most recent Russian breakthrough, Pakt-aligned forces have been evacuated from the country.\n\nThe government in Omsk has already declared that Finland is to be made to pay for its crimes against Russia, particularly in relation to its occupation of Karelia following WW2. As the Black League enacts a policy of harsh suppression and Russification in Finland, many see this conflict as merely the prelude to a new general war in eastern Europe."
 WORLD.41055.a:0 "Our revenge against the Finnish has only begun."
 WORLD.41055.b:0 "We were caught off-guard and must prepare for war."
 WORLD.41055.c:0 "Europe's youngest empire has ceased to exist altogether."

 WORLD.41056.t:0 "[Get_newspaper_header]Finland Triumphant In Finno-Russian Hyperwar"
 WORLD.41056.desc:0 "The hyperwar between Russia and Finland reached its shocking conclusion today as the tiny Finnish army flushed out the last holdout of the Black League's forces in Siberia. The outcome of the war has been described as farcical with many observers claiming that the only explanation for this is God commanding it to happen and reality being forcibly bent as a result.\n\nWhether the outcome was the result of divine intervention or strategic genius, most people now agree that Suur-Suomi will pick up the mantle as the liberator of Eurasia now that it has the Black League's nuclear arsenal at its fingertips. Whether the next Finnish hyperwar will be against Korea in the east or Germany in the west remains to be seen."
 WORLD.41056.a:0 "Our revenge against the Finnish has only begun."

 NTG_CountryInfo_Folder.101: "A Book Long Forgotten"
 NTG_CountryInfo_Folder.102: "A Strange Turn of Events"

 NTG_CountryInfo_Content.1: "The Siberian Plan"
 NTG_CountryInfo_Content.2: "Trotskyism in the Interwar Years"
 NTG_CountryInfo_Content.3: "A Storm Brewing"
 NTG_CountryInfo_Content.4: "And After The Snow Fell"
 NTG_CountryInfo_Content.5: "The Central Siberian War"
 NTG_CountryInfo_Content.6: "The People Arming Themselves"
 NTG_CountryInfo_Content.7: "The Trotskyist Revival"

 NTG_CountryInfo_Content_desc.1: "Throughout the tenure of Premier §eNikolai Bukharin§!, a visionary scheme, dubbed the §nSiberian Plan§! was created to develop a highly mechanized industrial heart within the deep confines of the §VSoviet Union§!, far from possible §oinvaders§! while simultaneously developing formerly unconnected regions.\n\nUnder this ambitious plan, factories, industrial lines and mines that were built up in Siberia gave Krasnoyarsk the helping push to develop into a big industrial centre, much like its fellow sibling cities of §KTomsk§! and §ANovosibirsk§!.\n\nDue to the expansive size of the §VSoviet Union§!, the far region of §nSiberia§! allowed for opposition against §eBukharin§! to grow. Political dissidents formally dismissed by the premier swelled in popularity amongst a complacent population."
 NTG_CountryInfo_Content_desc.2: "As §eNikolai Bukharin§! solidified his control over the §VSoviet Union§!, two of §xVladimir Lenin§!’s protégés would be sidelined. One being §XJoseph Stalin§!, and the other, was none other than Lev Davidovich Bronstein, more popularly known as §ZLeon Trotsky§!. As a central instigator of the §VBolshevik Revolutions§! of the 1910s, §ZTrotsky§! would rise to become amongst one of the few men at the top of §VSoviet leadership§!.\n\nDespite his loss to succeed §xLenin§! as Premier, §ZTrotsky§! would mark his faction within the Bolshevik Party, with the Left Opposition. Forming just after the death of Lenin, Trotsky would find himself firm friends amongst members of higher echelons in the army, people's commissars and Old Bolsheviks.\n\nDistrustful of §eBukharin§!’s legitimacy as §xLenin§!’s successor this coalition of disgruntled polities eventually signed the Declaration of 45, a document decrying against the bureaucratic cliques forming in the halls of the Moscow Soviet and Presidium, an attack aimed directly at §eBukharin§!."
 NTG_CountryInfo_Content_desc.3: "While §eBukharin§! continued his crackdown on political dissent on other factions in the Bolshevik Party, §ZTrotsky§! would repeatedly savagely criticize §eBukharin§!'s economic policies on industrialisation. He tore down every minute decision, every bill, every word that the Premier uttered, decrying his actions as weak, going as far as claiming that §eBukharin§! had strayed too far from the path in which §xLenin§! set out.\n\nUnbeknownst to him, this would cost him his life. Later that year, an unknown assassin attacked him in his Irkutsk home, ending the §Zrevolutionary§!’s life prematurely, whilst his supporters would end up exiled, scattered throughout various posts in faraway lands.\n\nDespite the loss of their main ideologue, §ZTrotskyism§! survived, with its successors still prominent members active within the Bolshevik Party, bitter and burning within their hearts. §eBukharin§! had won, purging all of his internal enemies out of sight. However, the Union would soon find itself in §otrouble§!."
 NTG_CountryInfo_Content_desc.4: "§oOperation Barbarossa§! would throw the entire §VSoviet Union§! into a self-destructive disarray. As the §gWehrmacht§! overran settlement after settlement, it was soon clear that the end was inevitable. With many being evacuated towards the §aUrals§!, or abandoning their posts to join remnants of the §VSoviet Government§! in §nSiberia§! or the §fFar East§!, §eBukharin§!’s union would finally disintegrate into pieces.\n\n§ZTrotskyism§! would become a quiet footnote within §VSoviet§! history, washed away by the backdrop of the collapse and destruction of the §VSoviet Union§! ...or so that’s what their opponents thought."
 NTG_CountryInfo_Content_desc.5: "Split into various splinter states across the former §VSoviet Union§!, many citizens fleeing from §eBukharin§!’s failures, or the ever increasing suppression by the §eNKVD§! in the §fFar East§! would settle within the democratic §KCentral Siberian Republic§!.\n\nHowever, tensions would grow between the §KRepublic§! and Remnants of the §eSoviet Presidium§!, with the §eSoviet Remnants§! declaring war against the fledgling Republic, culminating in the §nSiberian War§!.\n\nWhat was expected to be a quick war, escalated into a regional one that resulted in the already fractured glass of Russia to be further shattered into fiefdoms, centered in various cities across the region. As the Army of §nCentral Siberia§! broke up and became the personal armies of warlords, the people of §,Krasnoyarsk§! decided to take matters into their own hands."
 NTG_CountryInfo_Content_desc.6: "In the §echaos§! of retreat and consolidation, military bases, weapons caches and ammunition points were left abandoned by both sides, with many still containing serviceable arms for further use.\n\nWith no one to guard them, and no protection from any organized government, many villages and towns would enter such munition points and arm themselves with these leftovers from the §nSiberian§! armies, sustained themselves through hunting, and if necessary, fended off against the big bands of §qraiders§! and §qbandits§!.\n\nAnd so formed the various militias in the suburbs of §,Krasnoyarsk§!, who frequently patrolled and protected their own property, becoming a recognizable sign of the region, where refugees entered and left without loss of life."
 NTG_CountryInfo_Content_desc.7: "In the wake of withdrawal by both sides, a problem of governance arose. The city was losing its §fpower§! supply, and soon a §qslow death§! became commonplace.\n\n§ZThe Trotskyists§! rose up and organized themselves, forming a local government. With the massive support of §Vexiles§!, his father’s §Vfollowers§! and former §xBolshevik§! members within the city, taking control was only a menial task.\n\nAlthough nominally loyal to the §KCentral Siberian Republic§!, General §,Nikolai Andreev§! and his officers' clique would see where the wind was blowing. Although wishing to rule the city, he would lend his support to the §ZTrotskyists§!, ending up in the General Staff of the reformed §VRed Army§!.\n\nFor now, Russia’s only a bastion of §ZTrotskyism§! lies in §,Krasnoyarsk§!, but only time will tell if the lowly statelet will reignite the fire of revolution, restore the §VMotherland§!, and bring the workers’ revolution to the world."

 NTG_THENEWORDER_DESC: "As the Soviet Union decayed and broke into its many different warlord states, Nizhny Tagil seemed to be roughly untouched by the various conflicts that surrounded its landscape. During the war against the Fascist invaders, the industry that was built up in Western Siberia let Nizhny Tagil develop into a big industrial centre, much like its fellow cities of Sverdlovsk and Tyumen, allowing for arsenals to arm it’s civilian militias against the many bandits that roamed the vast wastes.\n\nThese militias became an iconic part of Nizhny Tagil’s identity, as the Anarchy years loomed further in.\n\nDue to the distance from Tyumen, and the Far East led by Yagoda, Nizhny Tagil became a calling hub for many people to seek refuge, especially former political prisoners that were set free in the rapid collapse of the Soviet Union. These prisoners, sent to the gulags by Yagoda, escaped and in turn led by Lev Sedov, formed the Trotskyist Government of Nizhny Tagil.\n\nDespite the tense reception of the civilian populace against this new form of government, many begrudgingly accept this new state of affairs, for their promises could lead to a better tomorrow for them, but not everyone is keen on supporting Sedov’s policies."

 BOOKMARK_NIZHNYTAGIL_BLOCKER: "§VTHE NIZHNY COMMUNE§!"
 BOOKMARK_NIZHNYTAGIL_BLOCKER_DELAYED: "§GNEW IN THE PERMANENT REVOLUTION:§!\n§Y- 3 YEARS OF PLAYABLE CONTENT\n- WIN THE SECOND SMUTA\n- CHART THE COURSE OF THE COMMUNE§!\n§F--------------\n\n\n£GFX_texticon_bookmark_NTG\n\n\n\n\n§!The violent disintegration of the Soviet Union at the feet of the German onslaught brutally destroyed any remaining prestige for the left, especially for the now disgraced ideology of communism. As the world’s first socialist superpower burned away to ash, its remains gave way to fertile soil for smaller statelets to grow and flourish.\n\nThe failure of both the West Russian War and the Siberian War, still two deeply gushing wounds, turned humiliation to action for some citizens of the old Union. Sick of opportunistic warlords and the oppressive NKVD and aided by exiled opposition leaders and generals, they congregated underneath the barrier of Trotskyism and formed the Commune of Nizhny Tagil.\n\nSurrounded by hostile states on all sides, and virtually unheard of by the people of 1962, aside from its most fervent supporters, the Commune quietly bides its time, waiting for the right time to strike and restore Trotsky’s legacy in the history books. If done correctly, the world may see the incumbent rise of a glorious 4th international, or something far, far worse."



ultranationalism_black_league_thought_subtype: "Black League Thought"
ultranationalism_black_league_thought_subtype_desc: "                            §YBLACK LEAGUE THOUGHT§!\n\n£GFX_ideology_ultranationalism_black_league_thought_bar\n\n\n\n\nRussia was once a continental superpower, one that projected its diligent power all over the steppes of Eurasia, surviving unscathed through the centuries, even as the various forms of clockwork on which the state operated changed.\n\nHowever, the hundreds of years of continuous victories and setbacks did not last forever, with the arrival of one group: the German Reich. They were dedicated to casting Russia into the whirlwind of history, hoping to bury the idea of such a state ever existing. For the most part, they were successful. Bukharin fled, and the Soviet party and state apparatus shattered, leaving Russia desecrated by the horde of illegitimate rump states and warlords. This was the First Trial.\n\nBut In the face of insurmountable odds, one man refused to succumb. Amidst the horrific conditions of Mauthausen concentration camp, Comrade Karbyshev endured relentless beatings daily within its grim walls, eventually being released into the harsh winter to perish at the hands of the elements. However, the brave son of Russia knew this wasn’t the end. The gaunt general walked hundreds of kilometers to the bitter city of Omsk, where the foundations and dogma of the All-Russian Black League were forged. To the men who hold the ideals of the Black League dear, a dream exists that the Reich that murdered millions of Russians under its jackboot is shattered, spiraling in a new age of total, pure Russian hegemony."
communist_trotskyism_subtype: "Bolshevik-Leninism"
communist_trotskyism_subtype_desc: "                                §YBOLSHEVIK-LENINISM§!\n\n\n£GFX_ideology_communist_trotskyism_bar\n\n\n\n\nWith its origins as a sneer from the 1920s, the Trotskyist label was adopted by Trotsky's supporters in exile. Never abandoning the revolution, he organised an opposition within the Comintern before being hounded out by the strong hand of the Bukharin-Stalin clique. The question of the international revolution had always been of utmost importance to him, and on this basis, he would form the Fourth International. Viewing Russia as a backwards economy, only through the relief of the international revolution could it pass from pre-capitalism to socialism. Until then, the USSR was a transitional society. He termed this understanding of revolution in backwards conditions the 'Permanent Revolution', and some outside of Europe would pick up this concept as the basis for their own revolution, avoiding Bukharin's two-stages. Ultimately, he would see in Russia a degenerated revolution, a 'worker's state' corrupted by an undemocratic bureaucracy resting on the middle classes and sinking into capitalism.\n\nIn the meantime, believing the conditions were overripe for socialism and that the key element lacking was leadership, the Trotskyists attempted to take their place at the helm. They appealed to the first four congresses of the Comintern, upholding the United Front against both the 'Ultra Leftism' of the Third Period and the bourgeois Popular Front. Their strategy coalesced in 1938 in the Transitional Programme, a programme of pursuing increasingly unrealisable demands to force revolution. Trotsky himself met a fateful end in 1940 at the hands of his rivals, but the events of the 1940s suggest to some his relevance. Heeding his call, his followers have found themselves in power. Will they be able to achieve the socialist society he envisioned — democratic, staunchly internationalist, and rigorously planned — or will the bureaucracy rear its head again and begin the Thermidor anew?"

 OMS_2WRW_debug_category: "Omsk 2WRW Debug"
 OMS_2WRW_debug_category_desc: "\n\n\n\n\n\n\n\n£GFX_OMS_omskdebug2\n\n\n\n\n\n\n\n\n\n\nI bathed a germ*n kid in white phosphorus the other day.\nIt was pretty cool.\n\nhek was here. Frank was here. Andy was here. Emmy was here. Voyteck was here."
communist_securocratism_subtype: "Securocratic Communism"
communist_securocratism_subtype_desc: "                                §YSECUROCRATIC COMMUNISM§!\n\n\n£GFX_ideology_communist_securocratic_communism_bar\n\n\n\n\nThe term 'Securocratic Communism' is often used to describe the Communist system mixed with securocracy, characterized by strict state control, surveillance, and repression of dissent. Despite this, however, the 'securocracy' does not actually define the strain of Marxism that state might follow, with finer details being unique to the revolutionary government. However it is present as long as Communism emphasizes information stability over individual rights and freedoms, and relies heavily on secret police forces to maintain order and enforce the state's will as opposed to the army or vanguard party like in traditional cases.\n\nWhile generally a forgotten dogma since the times of the Bolshevik power struggles, in the former Soviet Union, the remnants of the old government are ruling the rump state in Irkutsk with the iron hand of the NKVD. In that frozen wasteland that idea was reborn, With the presidium and armed forces both shown to be incompetent of statesmanship the idea that only a security officer could safeguard the will of the people begun to not seem so insane. After all, what other option do the people of Russia have? Every day a revolutionary dies, every day the glorious cause of humanity seems to dim. Until it is saved, only bullets and iron bars should rule, to remind the reactionaries and traitors that Socialism will punish it's mortal enemies with absolute impunity.\n\n§R'We have no compassion and we ask no compassion from you. When our turn comes, we shall not make excuses for the terror.'§!" 
