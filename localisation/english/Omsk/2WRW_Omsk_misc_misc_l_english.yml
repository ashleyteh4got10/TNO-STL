 RUS_news.95.t: "[Get_newspaper_header]A Trotskyist Soviet Union?"
 RUS_news.95.desc: "Today is a day that most Russians have not expected. The Trotskyites of the Bolshevik Party have managed to pursue their vision on the Russian lands under their control. Hailing from Nizhny Tagil in Western Siberia, the Red Army, under the command of Trotsky's son, Lev Sedov has triumphed over their ideological enemies, from West Russia to the Siberian plains.\n\nThe government in Nizhny Tagil has declared it's main objective, to fulfill the core idea of Trotskyism, the establishment of the "Permanent Revolution". Most of foreign observers agree that this vision is currently modified, to free Russians from Japanese and German occupation, and subsequently an establishment of a new International.\n\nIf the new Soviet Union is strong enough as it claims to be, then both the Germans and the Japanese have to prepare for the inevitable. \n"
 RUS_news.95.a: "The Soviet Union in new clothes."

