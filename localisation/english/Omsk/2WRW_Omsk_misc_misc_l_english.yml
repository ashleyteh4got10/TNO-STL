 RUS_news.94.t: "[Get_newspaper_header]Nizhny Tagil Unifies West Siberia!"
 RUS_news.94.desc: "News from Russia today, as Nizhny Tagil led by Lev Sedov, the son of Leon Trotsky himself, has reunified Western Siberia, forming the Western Siberian Soviet Republic.\n\nFormed by a worker’s uprising in the merchant republic of Zlatoust, Nizhny Tagil has come a long way from a simple revolution, to a reunified regional republic, whilst enduring the struggles against other rivals to Lenin’s legacy.\n\nIts system of communism, while unorthodox when compared to Bukharinism, has triumphed in the end, utilizing their newly invigorated Red Army to propel them to the top in West Siberia. The new socialist regime seeks to carry on the ideas and goals of Trotsky himself, with aggressive internationalism and ideological expansionism onto the global stage.\n\nThe question still remains, will this new branch of Leninism restore the Union, or will it crumble like Bukharin before it?"
 RUS_news.94.a: "Onwards, comrades!"
 RUS_news.94.b: "They won't get far."

