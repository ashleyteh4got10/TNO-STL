 # OMSK

  #101
  OMS_CountryInfo_Folder.101: "What Once Was"
  OMS_CountryInfo_Content.1: "Once a superpower…"
  OMS_CountryInfo_Content_desc.1: "One of the great inevitabilities of history was that he who held the vastness of Russia would become a superpower. That was the case for centuries. From the great steppes  to the Bering Strait, Russia stood proud, respected and feared on the world stage. \n\nBut that is in the distant past. The memory of bustling towns and cities, of dignified halls and the bell's toll for Christmas mass, are gone.."

  OMS_CountryInfo_Content.2: "…Fallen from Grace"
  OMS_CountryInfo_Content_desc.2: "The incompetence of our past leaders leaves Russia as nought but a rotting carcass of divided warlord states, fighting over the little scraps the Teutons do not leave bombed to ash and rubble. Those opportunities, whether they be communist, tsarist, liberal, or fascist, claw at any effort to unify our great country. Even when united, during the First West Russian War against the Teuton, the first sign of weakness saw these parasites cut at Russia's heels, as victory was lost. Our nation, more than ever, requires a new start, a new metamorphosis that shall ensure our ultimate victory. "

  #102
  OMS_CountryInfo_Folder.102: "Birth of an Idea"
  OMS_CountryInfo_Content.3: "Our Leader"
  OMS_CountryInfo_Content_desc.3: "Our leader, Dmitry Karbyshev, was destined to die. Captured and tortured by the Germans, he miraculously escaped and returned to serve under the West Siberian People's Republic. Reaching the rank of Lieutenant General, he watched with dismay as the Second Trial was lost, and Russia buckled under the Teutonic invaders. "
  OMS_CountryInfo_Content.4: "Our Defeat"
  OMS_CountryInfo_Content_desc.4: "As the army retreated deeper into the West Siberian People's Republic, an attempt to take over leadership from the incapable bureaucrats. This attempt failed. Instead, the survivors rallied to secure the city of Omsk where the All-Russian Black League truly took its current form. In secret, the League began a process of total militarization, everything to ensure the city would be able to endure all the Trials they had ahead of them, foreign or domestic."

  OMS_CountryInfo_Content.5: "Our Bastion"
  OMS_CountryInfo_Content_desc.5: "Every system needs its philosophy, and in the case of the Black League, this involves pure, nihilistic hatred for Germany and all that it entails. General Dmitry Karbyshev has summarized this philosophy in his theory of the Great Trial as such: the First Trial was the Great Patriotic War, where the Union was dissolved and Russia left humiliated and broken. The Second Trial was the West Russian War which failed to break the Teuton. Thus, the Third or Great Trial would be the one that would bring Russia its long awaited victory.\n\nOmsk has since become a beating black heart of stone. One where Glavkoverkh Dmitry Karbyshev and his clique rule over a society of total militarization. But as each day passes, Karbyshev grows older and less influential as the Old Guard of the League strays further from his philosophy, effectively ensuring that Omsk is governed chiefly by greed and selfishness."

  OMS_CountryInfo_Folder.103: "Where We Stand"
  OMS_CountryInfo_Content.6: "Rotten to the Core"
  OMS_CountryInfo_Content_desc.6: "The Old Guard of the Black League has turned into a group of petty little rivalries and fiefdoms within the state where loyalty to corrupt commanders is rewarded over loyalty to the Great Trial. \n\nKarbyshev’s vision is being left to rot, but so is Karbyshev himself. His old age is catching up to him to the point where he seems not as the man who shall bring the Great Trial into fruition, but as a puppet controlled by small-minded despots destined to be forgotten by history itself.\n\nBut unfortunately, not only Karbyshev’s vision was left to rot, it was corrupted beyond redemption. The Theory of the Great Trial was the idea of a defensive war against the Teutonic menace, but the savages corrupted this idea, turning the concept into justification behind a death cult, the idea of pure cruelty and vengeance against the Germans, believing every one of them would suffer for assaulting and defiling the Russian eagle. The old and tired Glavkoverkh never wanted this, but all he can do now is look with horror at the monster he created without being able to do anything to stop it.\n\nBut there are still true believers who believe in doing everything and anything to realize Karbyshev’s vision and to swear total revenge against the Teutons. Thankfully for the League, that man just so happened to be his second in command… "
  OMS_CountryInfo_Content.7: "Dmitry Yazov"
  OMS_CountryInfo_Content_desc.7: "A warrior with a vision, a patriot for his beloved Russia, and a crusader with a deep hatred for all things German. Having fought valiantly during the First Trial and the Second Trial, Yazov recognized that nothing that he did was enough to turn the tide against the Teutons. This only helped cultivate the hatred he already had for the Nazis and those who had failed Mother Russia. Thus, when the ultimately-failed conspiracy around the All-Russian Black League was established, he was one of the plan’s masterminds.\n\nSoon enough, he had become Karbyshev’s right-hand man, becoming one of the most influential figures within the League. However, with Karbyshev aging and the Old Guard festering in more and more corruption each and every day, Yazov is quietly making moves to become the sole undisputed leader of the League, moves he will make at any cost…"

  OMS_CountryInfo_Folder.104: "The Hour of Vengeance Awaits"
  OMS_CountryInfo_Content.8: "Our Surroundings"
  OMS_CountryInfo_Content_desc.8: "To our west, the few remains of the West Siberian People's Republic linger in Tyumen, naively hoping to restore the Soviet Union. Just beyond that lies Sverdlovsk, a military junta led by Konstantin Rokossovsky which seems to have stopped following the tenets of weak communism. Still, they are incompatible with the League’s doctrine, lacking a complete dedication towards the cause of vengeance. \n\nAt Zlatoust, a corporation sells weapons to all warlords across Russia, taking advantage of the Russian carcass to make some quick cash without caring for the nation. \n\nBut they are not as detrimental to the cause of a united Russia as the thieves in Yugra and the NKVD holdouts in Vorkuta. The only group here which deserves even a modicum of our respect is the Free Aviators in Surgut, which continue to stand their ground against the endless aerial Teutonic onslaught."
  OMS_CountryInfo_Content.9: "The Struggle That Lies Ahead"
  OMS_CountryInfo_Content_desc.9: "With all that is unfolding, Yazov seems to be the only man worthy of carrying on Karbyshev’s legacy. Even as the old general starts to have doubts about his actions and the paths his life has taken, Yazov will hold true, for the Great Trial awaits.In dutiful preparation, the Black League will hold true to the vision of its creator. \n\nThe entire League and all of Omsk shall be purified, redeemed, with those unworthy being purged and their names stricken from history. A new, fanatic New Guard waits in the wings to take their place and bring about the end of the Teutonic race, for it is merely destiny. The only question that remains to be answered is when that fateful and sacred day shall arrive as a blessing upon the loyal sons of the Motherland.\n\nRussia will have her revenge, even if she must take all of humanity down with her…"

 BOOKMARK_OMSK_BLOCKER: "§wTHE BLACK LEAGUE§!"
 BOOKMARK_OMSK_BLOCKER_DELAYED: "§YPOST UNIFICATION CONTENT COMING IN §dBATTLE ON THE ICE.§!\n\nTHE §RGREAT TRIAL§! AWAITS!§!\n§W--------------\n\n\n£GFX_texticon_bookmark_OMS\n\n\n\n\n§FFor Dmitry Karbyshev, hatred has been his greatest ally.\n\nFaced with hunger, death, and torture in the Reich's many concentration camps, it was his hatred that kept him alive. Forgotten by his country, it was his refusal to accept defeat that drove him to escape. Returning to a Russia broken and divided, it was his ambition to one day avenge his comrades that led to the foundation of the §YBlack League§!, a state centered around his tenents of §GNational Survival§! and the §RGreat Trial.§!\n\nIn a cruel twist of fate, however, hatred has become Karbyshev's greatest enemy.\n\nOld and feeble, the Black League's leader finds himself outmaneuvered at every turn, his greatest work now dominated by a thirst for vengeance even he had once thought unimaginable. One that does not seek to defeat Germany, but destroy it. One that does not intend to preserve Russia, but to sacrifice it.\n\nNow, with the Reich growing weaker, and the radical, ultramilitarist officer §YDmitry Yazov§! his successor in all but name, only one thing is clear to the dying general: The §rTeutonic Menace§! will pay for every piece, nay, every inch of Russia they have looted and stolen;\n\n§xOne way or another.§!§!§!"