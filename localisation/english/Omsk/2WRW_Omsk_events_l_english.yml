l_english:
 OMS_Post_unification.1.t:0 "A Black Siberia"
 OMS_Post_unification.1.desc:0 "Where there was loyalty to the League's principals, there was always treachery, and the Captain always had a nose for treachery. Dancing from corner to corner, the penned executioner finally found his next target for “questioning”. Standing idly by next to the ill-appropriate light afforded by the rusted lamppost, reading his paper in the company of none.\n\n“Comrade citizen,” he bellowed out to the younger man. “Would you lend me a minute of your time?”\n\n“O-Oh, uh, Comrade" the Man began. “I r-really should be off to work. Got lost in the pages as they say, right?”\n\n“Nonsense!” Captain Dyatlov waved his gloved hand. "I insist.."\n\nSlowly the Captain approached, placing his cuff on the young man's shoulder. Dyatlov let a grin creep upon his face, the fear was palpable.\n\n“What’s your name, Comrade?”\n\n“It’s V-Viktor, Viktor Semyonov."\n\n"Well then, Viktor! You are glad I came across you. I.. consider myself more lenient than others. We can talk for a bit, maybe chat about this fine paper in your possession."\n\n“S-Sir, I'm a-afraid if I don't get going soon, the Store's going to ope-"\n\n"Say Semyonov, where do you work? I don't blame you for taking your time. Can't see much in this fog, you can get lost without keeping track." the Captain bored his gaze into the young man's frightened eyes, directing them to the pavement below.\n\n"A-Anastasia's Books, just off Molokova Street."\n\n"Is that so? And what kind of books do you sell at such an establishment?"\n\n"U-Uh, well, I guess all kinds. Childrens, History, Philosophy. We sell whatever w-we can find, really. I work the counter and the children seem to l-love it."\n\nDyatlov paused for a moment, letting his artificial grin slowly turn into a face of stone.\n\n“Well, off you go, Viktor Semyonov. I hope your work finds you well in your future endeavors."n\n"O-Of course, Sir. Glory to Russia!" the man quickly scurried off into the boundless smog, leaving the Captain alone in the light.\n\nDyatlov reached his glove into his breast pocket, removing a small black booklet from its confines. He flipped past hundreds of identical columns before stopping on a single blank box."
 OMS_Post_unification.1.a:0 "Suspect 51: Viktor Semyonov. Suspected of spreading subversive literature to palatable youth. Appropriate Action: Immediate Disposal."

 OMS_Post_unification.2.t:0 "An Atmosphere Of Silence"
 OMS_Post_unification.2.desc:0 "Maxim had sat at his desk rhythmically assembling the slides of the several rifles he was ordered to make. For the past week he had been biting his tongue, the quota had been extended and now he worked through the night. He had already been making the allotted amount of weapons parts, hell he even made more most days.\n\n“Tima what is this shit, we’ve been making the parts and now they do this to us?”\n\nTima quickly muttered, “Maks stop this, don’t you remember Vitya, do you want to get shot?”\n\nBefore Maxim could respond Tima walked away to ‘get parts’. Annoyed, Maxim went back to assembling slides, hearing the crunch of a League soldier on the catwalk. In fear, he quickly returned to making slides, his adrenaline-riddled hands forming several slides at once.\n\nBefore long, Tima came back and glared at his weapon parts muttering a few comprehensible words under his breath. Before long the loudspeaker croaked its awful song, “Factory Worker 4673 enter the nearest office, Worker 4673.” Inevitably the speaker stopped and quietly beset the factory. What used to be the eyes of his coworkers, whom he’d share occasional small talk with turned into dark coals. The Factory had gone silent as the ringing in his ears prevailed and he stood up, his legs aching after each stride.\n\nThe door to the office was heavy, groaning as he pushed it open. Inside this simple room stood two Black League soldiers and an officer, who welcomed him in. After sitting in silence for what felt like hours the officer finally spoke,\n\n“What is your name worker?”\n\nMaxim cleared his throat and muttered,\n\n“Maxim Larionovich sir, but my friends call me Maks.”\n\n“So you make the slides of rifles Maxim?”, the officer retorted back. Before he answered Maxim noticed a glint in the officer's eyes, a degree of morbid sadism spreading to his lips.\n\n“Yes sir, I make the slides primarily of rifles but I can also make other weapons parts.” Maxim had replied.\n\nIn a few swift swipes, the officer crossed multiple boxes on a document, before staring at Maxim.\n\n“Thank you for your cooperation Worker 4673.” The officer then grabbed his pistol and waved goodbye to Maxim, pulling the trigger. "
 OMS_Post_unification.2.a:0 "They shall not corrupt our works..."

 OMS_Post_unification.3.t:0 "SCRAP"
 OMS_Post_unification.3.desc:0 "SCRAP"
 OMS_Post_unification.3.a:0 "SCRAP"

 OMS_Post_unification.4.t:0 "Teach Them Hate"
 OMS_Post_unification.4.desc:0 "Ivano sat in his classroom although the last time he did so was many many years ago. There was no sweet teacher who taught everyone with a grace about basic topics such as Russian, Mathematics, and the small world around them. It was replaced with a grizzled and aged man, his face bearing a large scar down towards the tip of his nose and nearing his eye a glass one replaced what once was his own.\n\nAfter sitting down the teacher introduced himself as Lazar and pulling down a clean map had shown all of Russian territory they had and with some additions, pointing westwards Lazar explained that Russia had been raped and pillaged by the Germans so much that even some of the Russian people had began to join the rank and file of the German army. \n\nHearing this, and well seeing this horrified Ivano. He had heard stories from the west of some of the atrocities occurring in Western Russia. But if what he heard was true then what else had the Germans done?\n\nLazar, aware he shook the throng of civilians, continued to list depressing statistic after depressing statistic almost demoralizing them to the point of depression. Before ending he decided to give the people something to hate.\n\n“What is it we can do?” one woman exclaimed.\n\n“You can work harder, longer, and help us fight the teutonic menace with all the patriotic zeal you can muster!” Lazar responded."
 OMS_Post_unification.4.a:0 "The first of many."

 OMS_Post_unification.5.t:0 "A Slight Divergence"
 OMS_Post_unification.5.desc:0 "Yekaterina was in the middle of her work. She was checking papers in the central bureau where the most important documents about everything from military operations to propaganda campaigns to rally the population. All of that she had been entrusted to take care of. It was quite surprising considering her gender, and in spite of both dangerously low wages and the misogyny she experienced, she liked her job.\n\nAs she searches through the files detailing political prisoners, it seems that there are files that detail the location of political prisoners are missing. She checks multiple times before concluding that it is unnecessary. There had been multiple times before that documents were organized improperly, however that was just for pretty simple ones, these ones were in one of the deepest parts of the bureau. It was a discrepancy she never before had seen, while she wasn’t that worried, it still was strange.\n\nShe rose and walked to her office table where she wrote down that five files had disappeared. Right as she wrote it down she started to contemplate if it really was a good idea to note it down or not. When there had been a rare inconsistency before, she had always been yelled at by the boss, even if it was never her fault. Her male colleagues were only occasionally yelled at by the boss, even if it was the exact same discrepancy found. She continued to write, she slowly became more and more nervous. Finally she erased it. It was no big deal, right. As she slowly took a deep sigh of relief, she walked back to her work, continuing with searching through the files."
 OMS_Post_unification.5.a:0 "She quickly forgot the event."

 OMS_Post_unification.6.t:0 "Some Never Grow Old"
 OMS_Post_unification.6.desc:0 "The Family Petrova may have been an ordinary family in the Soviet Union, this is however not the case after the Great Patriotic War and the arrival of the Black League. The family was split up after the Great Patriotic War and now can rarely send letters, only through secret contacts through Kazakhstan can they get their letters to Muscovy.\n\nElyna Petrova was doing her usual business taking care of the house. She couldn’t take her mind off the letter she got four months ago. Her husband trapped in Muscovy had gotten a job as a soldier in the Moskowien Wehrmacht and he would soon be able to reunite with her. She sent a reply immediately as she explained her concern about the Black League discovering her ties with a collaborator. Usually a response would take about four to six weeks. She hadn’t gotten a response in five months. She had grown to be strong, even after being driven away from her husband. In the early days she would cry herself to sleep every night. Now she was ready to fight against anything coming in her way, including the rigid Black League.\n\nThe doorbell rang, it rang across the small apartment. Someone coming to their house was something very unusual. She quickly walked towards the front door. She opened the door to see five policemen, all with uniforms black as the night. The head officer started speaking.\n\n“Mrs Petrova, I am afraid we are going to have to arrest you for subversive actions against the All-Russian Black League and for having contacts with Collaborators.”\n\n“WHAT!?! YOU CAN’T-”\n\nThe Officers proceeded to turn the apartment upside down and arrested the rest of her family left in Russia, her Mother, Father and son... They were put into the trucks of the officers. They were driven away and forgotten to history."
 OMS_Post_unification.6.a:0 "Another family removed so that the Great Trial can prevail."

 OMS_Post_unification.7.t:0 "The Gears Grind On"
 OMS_Post_unification.7.desc:0 "As all Black League personnel are subject to the highest standards of fitness, Glakoverkh Yazov was ordered on this date by BLP-DR-078431 (AMOSOV, Nikolai Mikhailovich) to desist from his duties and report for a complete physical and mental examination. During this period, leadership of the Black League was devolved from Yazov to Evgeniy Savintsev; duties of the Glakoverkh were divided between the leadership cadres as outlined in Succession Document 178.\n\nEvgeniy Savintsev began the day as he did every other, with a steaming cup of black coffee and two hundred push ups. From 06:30 to 09:30, he reviewed the names of five hundred criminals, dissidents, and malformed individuals sentenced to the Redemptionary Brigades. He assigned two hundred and thirty seven to rebuild the highway between Irkutsk and Krasnoyarsk, and one hundred and twelve to mine clearing duties on the Moscowien-Russian border. The remainder were shipped to Vorkuta, to assist in Black League training operations. At 10:15, he left his desk for a three mile run with Foreign Minister Aleksandr Sakharovsky, wherein they agreed to conduct an assassination of several pro-democracy advocates in Romania.\n\nAt 11:45, Aleksandr Sakharovsky met with several members of the “Foreign Ministry'', to discuss the issue of Turkmenistan. Central Asia, as the borderlands of the Russian National Reclamation Government, occupied an increasingly large place in Sakharovsky’s mind; it is a place of dissent, of weakness, of degeneracy and anti-Black League thinking, infested by Bolsheviks and fascists alike. Eventually, a junior member of the cadre offered a suggestion that caught Aleksandr’s eye: a mass resettlement of vetted, loyal Russian populations into the largest cities of Central Asia, and a temporary displacement of unvetted Turkish and Khazak populations from the region.\n\nAt 14:20, Sakharovsky gathered with Evgeny Pitovranov and the leadership of the Economic Ministry to discuss ongoing preparations for the Great Trial. Pitovranov has repeatedly requested additional labor resources to complete fortifications on the Nowa Polska-Moscowien border, but has been rebuffed several times by both Yazov and Savintsev. Together, Sakharovsky and Pitovranov draft a proposal to mobilize the Redemptionary Brigades in low priority industries,  freeing trustworthy laborers to shift to building forts, pillboxes, and life saving defenses.\n\nAt 18:00, Pitovranov and Yuri Drozdov spoke over dinner concerning a wave of sabotages in Central Siberia. Drozdov suspects remnants of the Siberian Black Army; Pitovranov surmises the presence of German agents. They agree only that security must be doubled. Together, they compose a plan to make Novosibirsk a closed city, expelling all women, children, and unvetted civilians and permitting only trustworthy laborers to stay. Soon, this plan will extend to all major industrial hubs throughout the Reclamation Government. The traitors and the saboteurs will have nowhere to hide.\n\nAt 24:00, Glakoverkh Yazov returned from the examinations. His desk was empty, for once. He marched to his chambers, removed his shoes, and slept without worry.\n\n"
 OMS_Post_unification.7.a:0 "Leadership entails creating new leaders, not followers."

 OMS_Post_unification.8.t:0 "The Costs Of Victory"
 OMS_Post_unification.8.desc:0 "The unification of Russia had brought something into Dimitry Yazovs life that he’d only fakely expressed to his subordinates. For once, he could now truly say without a doubt that he now possessed a sense of certainty. He could now be fully confident in the Leagues strength, and he would now truly be at the helm of his peoples destiny. But, there were issues at hand that needed to be taken care of. After all, he couldn’t simply run head first into the lands of the Aryan.\n\nThe assembly assembled before him had been assigned to hammer out a solution to every problem the League is facing or could face in the coming months. Lasting long into the night, it became clear that there were indeed several issues that had to be resolved, lest the League's chance for success in the coming Trial be at risk.\n\nThe most discussed topics included the problem of production capability, access to resources, and technological advantages that their enemy held. There were ways to solve such issues of course, but it became clear to the assembly that implementation of reforms would be severely hampered by the current economic capability of the League.\n\nYazov felt a burning sensation in the back of his head upon hearing those last words, and stood up to speak, immediately silencing everyone present.\n\n“I think you’re all forgetting a core part of what made our state triumphant in unifying the Motherland. When we marched onward to reunify Russia, we did not do so only because we had such things as advantages in production capability or overwhelming firepower.”\n\nAll eyes were on Yazov now, as each man began to squirm uncomfortably in their seats.\n\n“We triumphed because of our will, and unwillingness to ever give up on our peoples right to see the day when vengeance could be achieved in full. Yet you sit here and tell me that our will is no longer enough to solve the current issues at hand?”\n\n"
 OMS_Post_unification.8.a:0 "“We will immediately move to implementation, sir.”"

 OMS_Post_unification.9.t:0 "Name, Age, And Place Of Birth"
 OMS_Post_unification.9.desc:0 "“Next.”\n\nCheckpoint officer Vasily Smirnov rubbed his temples with his thumbs while the next feckless idiot shuffled up to the booth.\n\n“Name, age and place of birth.”\n\n“Well, uh, it’s Ivanov,” the small, beetle-shaped man mumbled, “Ivan Ivanovich, that is.”\n\n“You taking the piss?”\n\n“Of course not, comrade checkpoint officer.”\n\n“Hand over your papers,” Smirnov groaned, “I trust you have them on you.”\n\nIvan Ivanov winced as he passed a single passport beneath the glass. Smirnov sighed when he saw the hammer and sickle on the front cover.\n\n“This look like the Soviet Union to you, Ivanov?”\n\n“Well, its the most current—\n\n“Most current?” Smirnov laughed, “Trust me, Ivanov, if you want to fool somebody, don’t act so fucking daft.”\n\n“It says here, comrade sir, I was born in Sverdlovsk.”\n\n“You don’t expect me to read this shit, do you Ivanov? Are you delusional?”\n\nFor a moment, Ivanov looked ready to burst into tears as he shuffled nervously. Just as Smirnov thought he was about to walk away, he spoke again.\n\n“That lady that just passed through, she’s—\n\n“Your wife? I’ve heard it all before Ivanov. I don’t give a fuck if its true or not, it comes down to this: if you can’t show me anything printed this decade, you’re not getting in. Understand?”\n\n“Well, I have this.”\n\nSmirnov felt his hairs stand up and his smile drop as Ivanov passed through a crisp slip of paper with a black swastika stamped on top. He examined it for a moment before speaking again.\n\n“Ivan Ivanovich, you are a citizen of the German Reich?”\n\n“Moskowien, to be precise, but yes.”\n\n“And why are you attempting to enter Russia?”\n\n“To escape,” Ivanov stared at him blankly, as if it were obvious, “to reunite with my family.”\n\n“Ivan Ivanovich, are you aware that this document is tantamount to treason against Russia, and undeniable proof of collaboration with the German occupiers?”\n\n“Treason?” Ivanov paled, “That can’t be true. I’ve never collaborated. How could I have?”\n\n“Well, Ivan Ivanovich,” Smirnov reached over to the telephone, “That’s for us to find out.”\n\nSmirnov put the telephone to his ears and waited for the tone. When he heard the grunt of the man on the other end, he spoke.\n\n“Yes, this is Smirnov at point D, I’m gonna need a hand or two. No, nothing dangerous, just a collaborator. Oh, and his wife may have gotten through, one, uh, Maria Ivanova. I’d advise liquidation upon sight. She’s not likely to know anything.”"
 OMS_Post_unification.9.a:0 "“Next.”"
 
 OMS_Post_unification.10.t:0 "For all to see"
 OMS_Post_unification.10.desc:0 "Was it a dream? Elias wasn’t sure what had just happened. Ever since the Russians had come and thrown everyone into the old ghettoes, hunger had gnawed at his stomach without end. Some of the other kids had taught Elias to drink as much water as he could, to trick his stomach into being full. Elias thought it worked, but deep down he knew that in the end it was only a trick. The grown-ups knew it too, and so they sent the children out every morning to beg the guards for some food. Usually, the guards would just scream and kick at them until they ran away. But today, when nobody was looking, the old man with the kind eyes had leaned down and reached through the barbed wire and passed Elias a backpack, filled with bread.\n\nElias hurtled down the streets of the ghetto with the bag strapped to his back. He felt the eyes of starving Germans and Russian guards on him as he bolted, but he wouldn’t stop until he made it home. With every step, the bag seemed to become heavier and heavier, like it was filled with bricks. Even when it was so heavy that he felt like his back was on fire, Elias refused to slow down. His house was just around the corner.\n\nWhen he burst into his home, he saw Papa and Opa, but they were not alone. About twelve other men were crowded around the kitchen table, studying a map that was spread across the surface. Red arrows and crosses had been drawn all over it, and Elias thought he even saw some rifles in the corner of the room. Before he could understand what was happening, he collapsed from the effort he had just spent. As Papa rushed over to him, a few of the other men cheered to see the bread overflowing from his bag. Elias smiled weakly as they sung and danced and Papa ran his hand over his head.\n\nIn an instant, the world turned white. Elias tried to ask what was happening, but his mouth was empty and his ears were full. When he tried to scream, his mouth filled with ash and blood. He didn’t have long to think, before a force stronger than anything he could imagine pressed down on his chest. Just as quickly, the fabric of the world seemed to rip, and a sea of blackness came rushing through the gaping chasm.\n\nWhen the smoke had cleared and the ash had settled, a messaged had been scrawled across the ruined building in hateful black paint."
 OMS_Post_unification.10.a:0 "Know your fate. Resistance is hopeless."

 OMS_Post_unification.11.t:0 "We Are Ready"
 OMS_Post_unification.11.desc:0 "The door slammed shut, and silence returned to the bunker that served as Dmitiry Yazov’s quarters. Yazov and his staff had concluded yet another meeting, with the main talking points being on the current status of readiness for the Leagues troops and reports on the morale of the people. Dozens of files containing dizzying amounts of data had been laid out on the table before him, and Yazov had slowly combed through each and every one. When the meeting concluded, his outward persona completely changed, going from the cold, iron hearted man that the world knew, to a man shakily taking off his cap and taking several swigs of vodka.\n\nSo much work had been done. So many production facilities were created, dissidents crushed, military units trained and organized, and so much more that Yazov had begun to start wishing that the day would come sooner. The day when he would give that order, and it could begin. The day the Motherland’s redemption would finally be achieved when The Great Trial was commenced. But at the advice of his staff, he’d delayed that order so that Russia could well and truly be prepared for The Great Trial.\n\nAnd now, after so long, that day was on the horizon. Finally, he thought. Finally, it would all be worth it. Every moment of progress, gained in blood since the day his mentor had given him the mantle of leading the Leagues destiny, would all be worth it. When the day came where Russian flags flew over Germania, and the Aryan was obliterated by Russian arms... finally, justice for innumerable crimes against his people would be achieved at last.\n\nYazov sighed, rising from his seat and reaching for his hat as he remembered once more that there were still a few remaining tasks at hand that needed to be addressed before all of his thoughts could come to fruition. He exited his room, and made his way over to the broadcasting station as he prepared himself for one last grand speech to his people before destiny."
 OMS_Post_unification.11.a:0 "“Midnight grows ever nearer.”"

 OMS_Post_unification.12.t:0 "All for One"
 OMS_Post_unification.12.desc:0 "Just days ago, Yegor was supposed to be fighting Teutons. Instead he busied himself with hoofing it the other direction, opposite the frontline, in the dead of night, with some extra supplies he “borrowed” for his journey. Deserting didn’t mean anything to him. He was an only child, and the only one taking care of his parents when they got grey and old. He couldn’t stand to think of how they were just barely surviving without him so he ran. He had considered the thought they might come for his family after he deserted, so he needed to just get home and get them the hell out of Russia.\n\nFinally, he saw his village on the horizon, standing atop the hill as it always has. Yet, with all the men conscripted and gone, it seemed dead and grim. He rushed up the hill, past the market, and all the way down to the other edge of the village; the only people around to observe him were elderly women and the youngest of children.\n\nHe entered the home where he grew up and took a few more steps, into the old familiar living room, finding his mother sitting on the couch, staring ahead with eyes dead and energy completely depleted. She looked almost 10 years older, and didn’t even acknowledge Yegor as he came in.\n\n“Mother, you’re here! We need to go, I need to get you and father out of here. Where is he? I’ll go fetch him while you pack-”\n\n“They took him.” She replied, without a trace of emotion in her voice. She would have cried, had she any tears left.\n\n“B-because of me...?” Yegor asked, dread running throughout his nerves.\n\n“No. They just needed him. Gave him a uniform, a gun, everything. Told him he’s going west.” She said, finally daring to look her son in the eyes.\n\nYegor’s heart sank. These monsters didn’t even care that he had deserted, they just needed everyone, even an elderly man at the end of his life. He knew the conditions out there, on the front; it is no place for old men.\n\nYegor sat down next to his mother as he wrapped his arms around her and held her close, both of them staring into nothingness as thoughts better left unvoiced ran through their heads."
 OMS_Post_unification.12.a:0 "There will be no exceptions."

 OMS_Post_unification.13.t:0 "The Truth in the Numbers"
 OMS_Post_unification.13.desc:0 "Abrasha sat in a dark room, with the cold embrace of his metal chair and table being the only outside stimuli to keep him from outright sleeping right then and there. Today, he’d been ordered to come in and work on “A new set of data” for him to process and organize. Truth be told, he would take anything new as a blessing.\n\nHe’d spent months chipping away at the same old administrative paperwork, after having been reassigned from his beloved home of Tomsk to the depressing and minimalistic city that the League called a capital. Despite the food rationing and lack of anything resembling goods for a middle class, Abrasha’s main issue was simply boredom.\n\nBut now perhaps Abrasha could get something new. Maybe it would even put the skills he’d gained in university to use. And as he read through and examined each folder given to him, he displayed a barely noticeable smile. His wish had come true, and he tried to savor the moment as much as he possibly could in times where happiness could be considered its own luxury.\n\nHe’d been assigned to the task of looking over and diagnosing the health of the economy, and had been given access to several classified League files to accomplish this task. Abrasha thought to himself that perhaps an increase in responsibilities was on the horizon.\n\nEleven hours later, the once tidy looking man in uniform was now an out of control mess, with sweat dripping down his face as the temperature had gotten to a point where he had thrown his jacket to the floor. On that floor now lay countless papers and charts, painting a terrifying picture that only those with the proper knowledge could decrypt.\n\nHe slowly sank to a sitting position, sliding down the wall as he did so. Abrasha now truly understood it all. Russia no longer had an economy. In its place an engine had been constructed. That engine used the scraps of what was once prosperity to fuel a complete and total war without any chance of returning to normalcy after. Only now could he truly understand where Russia was heading, swallowed whole into the dark abyss of hatred."
 OMS_Post_unification.13.a:0 "“What have they done to the motherland?”"

 OMS_Post_unification.14.t:0 "On Minefields"
 OMS_Post_unification.14.desc:0 "“There are no minefields in Russia and they were told to keep it that way.\n\nOfficially, the Black League espouses the need for prisoners of war to 'tame the motherland' by fertilizing the soil for farms, flattening the earth for infrastructure and urban development as well digging holes with which to bury the dead and further fortify the state.\n\nTruth was that Leonid and his group of young prisoners had the unenviable task of clearing the land of mines that the several russian warlords had laid all throughout their motherland. Sometimes it was as easy as following the map that detailed the minefield. Other times it was as hard as finding needles in a haystack.\n\nClearing the mines was made harder by the fact that each of them had been given selective treatment depending on which warlord they served along with what other 'war crimes' they may have committed. If they had served a naive but benevolent warlord on top of being a 'good servant of the motherland', then they were allowed tools and a single slice of bread a day. Being the opposite meant having nothing or being executed by minefield.\n\nHe hoped that one day he and his fellow prisoner would be free men. But until the last of the teutons are dead and until justice has been served, they shall never be free."[Change Later]"
 OMS_Post_unification.14.a:0 "Clearing the way for Russia."
 
 OMS_Post_unification.15.t:0 "The Men On The Front"
 OMS_Post_unification.15.desc:0 "Late into yet another Siberian night, Andrei reclined back in his chair with a newspaper and vodka in each of his hands, having missed the chance to read it earlier in the day. In large, bold letters, the headline read, “GERMANY THREATENS NUCLEAR WAR”. At the bottom corner of that same page was a public service announcement from the government, informing the public of how those first allowed into the National Redoubt System would be members of the army and their families, followed by the general populace.\n\nAndrei himself had a mixture of emotions swirling through his head. On one hand, he, his wife, and children were guaranteed a spot after having been working in the League's governmental apparatus since before the Reunification Wars. But, besides the potential for the very collapse of humanity itself, Andrei pondered the fate of the millions of his Russian comrades who wouldn’t make it into the bunkers. Would they just be tossed aside? Discarded as though they were only a means to an end? The conclusion of that last thought was enough to convince Andrei that he needed to just go to bed, simply forget these thoughts and return to work at the recruitment office without such things to ponder.\n\nThe next morning brought something he’d never seen before. Usually, a recruitment office is almost always empty, and with little activity in it, and Andrei had worked in this building for over a decade, and his team never had an amount of enlistment requests that came close to challenging.\n\nBut that morning when he went to open the doors to the building, he saw a line of people that had to have been miles long. Andrei saw the terrified faces of tens of thousands, no doubt having read the same words and had the same thoughts he had the night before.\n\nThat day, Andrei helped thousands of families obtain spots in the bunkers, with ever more pleading and begging to have their fathers and husbands enlist so that they too may avoid the worst fate imaginable. Yet, as more and more pleaded and begged to enlist, Andrei knew he could only save so many before the military blocked any further enlistment."
 OMS_Post_unification.15.a:0 "Vengeance demands the highest of prices."

 OMS_Post_unification.16.t:0 "A Pain Beyond Pain"
 OMS_Post_unification.16.desc:0 "Major Friedrich Schäfer sat, handcuffed to a chair, beaten and bloodied. Dozens of cuts oozed across his body. They'd torn out his fingernails on the third day, and blood stained his once pristine uniform. The interrogation room was ice cold, every surface formed of featureless grey brick. The only sound was the humming of the lights over head.\n\nThe door to his prison slammed open, and struck the wall with a bang. Two men of the Black League, both part of the reborn interrogation cadres, shuffled inside. Behind them, a new man took the stage.\n\nHe was tall, so tall that he had to duck beneath the lip of the door. He was bald, and wore a white lab coat. His arms were inhumanely long, stretched thin like taffy, and a syringe of amber liquid sloshed in his black-gloved hands. "Ah, here is the patient." One of the interrogators offered him a stool next to Schäfer's immobilized body. "Thank you for your patience," the doctor said, smiling. He took the offered seat. "I do hope my friends have not been too brutal to you. Sometimes, I think they act in such a manner because they're simply bored." His smile dimmed. "Or perhaps they saw what happened in Smolensk."\n\nFriedrich spat a foul mixture of blood and spit at the doctor's face. "Kill me now, untermensch. I will tell you nothing."\n\n"That is your choice, my friend. But, I would like to test that hypothesis." The doctor gripped Schäfer's arm, and pierced the closest of his bulging veins without another word. The amber medicine poured into his body in seconds.\n\nEvery nerve in the Major's body ignited. He seized, foam bubbling in his mouth as he threw himself back and forth, unable to control his own movements. The legs of his chair slipped from the ground. Friedrich screamed as his skull cracked against the concrete floor. His lungs strained, and his heart felt as though it was soon to burst. "Please!" he screamed, "I'll talk! I'll talk!"\n\n"No, my friend," the doctor said."
 OMS_Post_unification.16.a:0 "[Change Later]"I'm getting wonderful data from this."[Change Later]"

 OMS_Post_unification.17.t:0 "Free Loaders"
 OMS_Post_unification.17.desc:0 "[Change Later]"Please! It's not for us, it's just for the baby! Pleeease!\n\nYuri's hands tightened around the rough kitchen counter, growing whiter with every cry of desperation from his sobbing wife. A whole year they had been 'living' in this soulless concrete shell. A year since they had had every family photo, every rug and ring, every ounce of color mercilessly stripped from them, sent into the belly of the foul factories. A year he had been forced to feed them, put screw upon miserable screw into radios he could never play, first aid kits he could never use.\n\n"Pleeeeeease! Just take half! Leave us with some! Our baby is all we have!"\n\nBut they had kept going, like reeds floating in rapids, trying their damndest not to snap. And it had paid off. The miracle of life. The League could not snuff out the joy that a parent felt as a child, their child, grew. But they were trying their best. For the crime of possessing some simple wooden blocks and and some meager rations, they had sent two of the League's lackeys; a snivelly but ferocious boy, his hat too big for his head, and a towering giant of a man, his eyes two sharpened daggers. A duo as comical as it was terrifying.\n\nBut Yuri didn't care. This would be his stand. The knife in the drawer beneath his hand was bent and blunted, but it stabbed all the same. He would show everyone what good Russian people did to those who crossed the line. He'd wipe that stupid smug face off this baron in black. He would -\n\nAngela crumpled to the floor, her arms clutching her bloodied and mutilated belly, her face now a reflection of Yuri's soul: pale and panic-stricken.\n\n"There! Now you really don't need these little blocks and extra calories."\n\nWith a pleased smile, the two devils in uniform exited through the door, the baron giving Yuri one more crushing glare. A glare of pity, as if he was a fool to think he had ever had any control of the situation. A glare of victory.\n\nAnd then the room was silent again. The frantic cries of Angela, replaced by quiet, uncanny sobs. The rage that had filled Yuri's soul, now crushed, ground into dust, and scattered before the cold midnight wind. And the beating heart of his unborn child, silenced. They would now never gaze upon all the colors and lights and sounds and smells of the world.\n\nBut perhaps that was for the best."
 OMS_Post_unification.17.a:0 "For the reclamation of Russia, no sacrifice is too great."

 OMS_Post_unification.18.t:0 "Separate the Wheat from the Chaff"
 OMS_Post_unification.18.desc:0 "A knock rang out from a humble house on the outskirts of Barnaul, a major grain producing area within the [OMS.GetName]. A rude awakening was to await its owner, who was ready to sell his grain the next day.\n\n"Comrade Nikita, your grain has been deemed unsuitable for the general populace. It is too expensive and decadent for the people of the Great Trial."\n\nNikita shook life a leaf; this nameless official had condemned his harvest, and therefore his life. Panicking, Nikita cried out. "B-but you can’t do that, that's the entire stockpile for the year! How am I supposed to buy rations from the storage? I'll starve! You aren't so cruel, are you?"\n\nNikita stared at the officer, hoping that just this once, the Spartan discipline of the Black League would be relaxed for him, just this once. The officer's eyes wavered a tiny bit. Maybe they'd give him the standard pricing, even if they didn't agree to his asked prices. How dare they, anyhow? After the Union collapsed, he built his own way, he made his estate in Barnaul!\n\nThe officer slowly shook his head, "Sir, one farmer's life doesn’t matter in the grand scheme of the nation. If you starve, you shall be replaced with another, more capable person. We will begin the confiscation of this improper yield. Please vacate the field, or you will be arrested for treason."\n\nThe officer shook his head, looking away from the grim situation. For a moment, he faltered. His mind thought of traitorous things. What right did they have to kill this man for a mistake? They could just call it mass-produced, it'd be a simple response for a simple mistake. What was the point in a government to reclaim Russia if they were going to destroy their own people?\n\nHis train of thought was rudely interrupted by farmer Nikita, now on his knees, crying and begging for another chance. "I'll plant the crops, it doesn't matter to me! Just enough to live!" The last thing the officer said in the confrontation was a simple, harsh..."
 OMS_Post_unification.18.a:0 "“No.”"

 OMS_Post_unification.19.t:0 "More For The Soldiers"
 OMS_Post_unification.19.desc:0 "Even through some of the harshest training programs that existed in the world, not once had Mizenov ever felt like the League had not given him enough. Meals, a roof over his head, and even a degree of respect he hadn’t ever been given before in his life were some of the things that enlisting in the military had helped him obtain.\n\nAnd it didn’t stop there. Many of the civilian encounters he had often ended in a salute for his eventual service in The Great Trial, or an acknowledgement of his bravery. It had always made him even more proud to be a part of the cause, yet something always seemed a little lost in their eyes.\n\nMizenov never quite knew why. At least until his unit passed by the village of his childhood.\n\nAs his transport vehicle bumped along the road, he turned his gaze to the buildings he used to sleep under as a child. Although he remembered the structures never being in the best of shape, they certainly never reached the state they were in now. Pieces of brick were missing all throughout it, with many of the windows being boarded over.\n\nAnd it was then that he saw the occupants of the village. Each and every one looked as though they hadn’t been fed in at least a week, with plenty of bones remaining visible. Upon their faces sat the looks of despair that Mizenov hadn’t seen since the days of the terror bombings, in some cases some even looked to have drifted into an even darker place...\n\nThe sight of his fellow Russians in such a state almost brought tears to his eyes, as this scene repeated again and again as the convoy passed through even more of the countryside. Village after village, turning men and women into fuel for the engine of war. It was the only time in his life where the seeds of doubt grew into a deep, underlying anger at the League. Perhaps, he thought, that maybe Russia had a deeper, much darker enemy than the Aryan."
 OMS_Post_unification.19.a:0 "“The price for vengeance is never too high.”"

 OMS_Post_unification.20.t:0 "The Men in the Factories"
 OMS_Post_unification.20.desc:0 "“Listen up!”\n\nA certainly strange awakening, unlike the usual inhumane conditions they usually live in. Dominik was certain that it wouldn’t be much more special than another word about increased quotas or a small promotion, it had never been special before, why would it today. At the factory in Barnaul, there was always a collective pessimism between the workers. They all knew that they would all one day fall to the cold embrace of death, they weren’t scared of it, the present couldn’t be much more different from it.\n\n“Under the commandment of the central command of the All-Russian Black League, we will teach you how to survive a nuclear fallout which the Teutonic menace might one day wreak upon us. The closest fallout shelter lies to the room left of us, near the offices. If the sound of sirens rings out, please try to get to the shelter as soon as possible. If you are not quick enough, or you don’t have the time to get to your local fallout shelter, please stay calm and go as deep as you can in your building. Any other information will be detailed in the pamphlet you will receive, thank you.”\n\nThe soldiers around the officer handed out a pamphlet to every worker in the building. On the paper there were pictures showing a step by step guide on how to survive the nukes from the teutons. Dominik was surprised that they could be so compassionate, or perhaps they just wanted to have their cheap labor survive. In any case, it was a feeble attempt at giving the people hope. He doubted if most would even try to survive, he could try to, but would it be a happier life in a dead world. From the small things he had heard about this foreign ‘nuke’, it didn’t sound very pleasant to live in a world where it destroyed the world."
 OMS_Post_unification.20.a:0 "He lost the small hope they tried to give him."

 OMS_Post_unification.21.t:0 "Expand the Bunkers West"
 OMS_Post_unification.21.desc:0 "The deep rumbling of cement mixers and the roar of truck engines awoke Vadim from his short sleep. It had only been a week or so since the league had occupied his village, and he had sure as hell not enjoyed it. Starting at 6 o’clock every morning they would start construction around the hills surrounding the settlement, and stop around nine in the afternoon.  Working on what? He had absolutely no idea. The elders had gathered the community upon the arrival of the workers, instructing them to stay away and avoid the workers and the sites at all costs.\n\nHe was sick to death of them. Not a single night’s good sleep was had since those bastards had arrived! It was time to do something about it, even if there were some damn consequences. Leaving his house, making his way through the town square and hiking up the steep hill towards the main site, before moving through the bushes, peering into the scene below.\n\nThere were about 20 of them, the majority seeming to be workers of sorts. Looking starved and haggled, they were either lined up towards the officers inspecting them or slaving away at a large pit in the centre. Digging yet deeper into the earth, as they began lifting heavy concrete slabs and steel doors into the pit, Vadim only grew more puzzled. What just was going on here? The nearest town worth anything was Syktyvkar, and that was hundreds of miles away. What did his place matter? And what were they building? A shelter of sorts, maybe even a bunk-\n\nHe met the gaze of the officer staring at him, screaming while pointing directly at his face. There was no time to hear the shouts and orders they would give him if he stuck around another second. He just knew he had to run as fast as god would let him.\n\nDashing into his village, He caught his breath and started to make his way home and prayed they wouldn’t recognize him again."
 OMS_Post_unification.21.a:0 "Best to not snoop around."

 OMS_Post_unification.22.t:0 "Dig Deeper"
 OMS_Post_unification.22.desc:0 "At a table sat a group of engineers and architects, rolling out several schematics and plans that were to be the main talking point of this hastily assembled meeting. They were ordered by the League to gather together once more to discuss an extension of the same bunkers that they had all spent so much work on. Not that they could complain or say no to such an order, but it frustrated them all nonetheless.\n\nMost frustrated of all was the designated leader of the group, Kolya, who quickly began to realize that a previously mildly aggravating situation had just developed into an unbelievably painful one, as it became clear to all present that such a request related to the expansion of underground bunker sites would require materials that their superiors simply did not have possession of.\n\nThey would need to find an alternative. Something cheaper, and in vast amounts so as to supply other sites with the means to pursue their own expansion operations if need be.\n\nThen, they had it: Steel. It only had to be layered twice as thick as lead to get the same effectiveness, and it was 3 times as cheap. And if constructed in a fashion where the maximum amount of dirt possible could be in between the steel lining and potential radioactive fallout, the occupants of the bunker would be relatively safe.\n\nBut, the issue of effective air filtration would arise, as those too needed design changes according to the orders of the League.\n\nKolya and the group pondered this for a while, as they wondered how they could possibly downgrade air filtration without harming the occupants in the process. But they had to come to an answer at some point, and that involved simply hoping and praying that a few experimental methods would be enough.\n\nBut of course, they couldn’t tell their benefactors this, as the consequence for implementing plans with such blatant logical holes in them would be severe. So, with smiles and neutral faces, they later informed the council assigned to oversee them of their “successful discovery” of new design methods."
 OMS_Post_unification.22.a:0 "Desperation has unforeseeable consequences."

 OMS_Post_unification.23.t:0 "More Ears on the Border"
 OMS_Post_unification.23.desc:0 "It was supposed to be his off day, Braun thought as he rode by car back to his forward base near the Russian border. Torrential rains hammered on his car's windows. For some reason, the Generalfeldmarschall had called Braun to the front once again to deal with yet another inconsequential matter, probably for some slave revolts.\n\nAs soon as he reached the base, he looked at the map on the diminutive planning table. His heart froze when he saw the damning maps in front of him. Over the past weeks, the "Reclamation Government" had begun a massive buildup along the German frontier, and he had been oblivious to it? He knew the Russians had unified, but invading the Reich? It was absurd! More importantly, Braun shuddered to think about what it meant for his career.\n\nAn unexpected voice made him jump: his commanding officer. "Care to explain your negligence, Generalleutenant? You've been noticeably absent from your duties." the Generaloberst demanded.\n\n"Herr Generaloberst, I was not under the impression that these were serious rep-" Braun stammered. Suddenly, his superior slammed the table in frustration, ripping the map with a gash where the German border was.\n\n"Do you think this is a game?!" he roared in Braun's face. "We could be attacked at any moment, all for your laying about in Moskau! I need your plan, and I need you to get your ass out there to implement it right now!"\n\nBraun had seen what those madmen did to his fellow pilot when he crash-landed in Omsk, in 1963, during the Anarchy. Had he condemned his people to not being prepared to fight against this rabid beast? What if they got into Moskau, or Sankt Petersburg, or beyond?\n\nAshamed and afraid, Braun spoke up. "I apologize, sir. Fortifications will be built along with the proposed conscription for all adults and emergency defense measures. Sieg Heil!"\n\nDespite the bluster, Braun was nervous. While the Russians were a weaker people, while they didn't have the same economy, Braun knew that Yazov's Black League had one thing: hatred. All encompassing, brutal, murderous, grasping, hatred. Any tactic, any sacrifice, any idea, no matter how depraved or brutal, would be thrown at the noble German people to annihilate them."
 OMS_Post_unification.23.a:0 "The beast is at bay."

 OMS_Post_unification.24.t:0 "Under Lock And Key"
 OMS_Post_unification.24.desc:0 "Marin closed his diary, sighing and looking out the window at the street below. As he did so, his thoughts ached at him. Thoughts of his dear lover, Sasha. He hadn’t been able to see her for a while, and the heartache he felt grew more prominent within his mind each and every day it continued.\n\nHe sat up straight, a plan forming in his mind. His eyes shot over to the clock, revealing that the 10 PM curfew would be in effect minutes from now. Marin began to pace around the room, running his hands through his hair as he considered his options. He could wait yet another night, which would probably be yet another sleepless one. So he decided to run the gauntlet, and finally see his dear lover and soulmate for the first time in months.\n\nAs he set his feet out on the pathway, he found the brightness of the moon above him both a blessing and a curse, as the first League patrols proceeded to begin the sweeping of the streets. Quietly moving behind whatever could pass for cover, he expertly maneuvered around easily a dozen patrols. Soon, he was only a block away from his dear Sasha. Smiling, he reveled in his progress so far. And it was then that he tripped, letting out a blood curdling scream into the darkness.\n\nHe immediately stood up, knowing exactly what was coming for him. Marin could only put faith into his speed, as the flashlights of patrols bounced off of the walls in front of him, soon accompanied by the terrifying sounds of gunshots. But, he did have a lead on the soldiers, and he turned the final corner, almost at the finish line. Sasha's apartment couldn’t have been more than a hundred feet away.\n\nBut...something started to burn in his back...he grew weak, losing all strength in his legs as he fell into a pool of blood. Through ever darkening vision, he saw the horrified face of his lover, who had opened her window to see where the noises were coming from. As the two locked eyes, Marin summoned one last bit of strength. He died with a smile on his lips, as his final thoughts only contained love and happiness."
 OMS_Post_unification.24.a:0 "The last candles of hope in Russia are being snuffed out."

 OMS_Post_unification.25.t:0 "Fortresses Among The Tundra"
 OMS_Post_unification.25.desc:0 "Andrei joined the Black League to avenge the family he’d lost in the Second Trial. To reclaim Moscow. To destroy the Teuton, once and for all. Digging a trench on the steppes of European Russia was a far cry from that. He was in an endless cycle: he'd wake up, eat breakfast, dig, eat lunch, dig more, eat dinner, dig even more, then go to sleep. It didn’t help that the ground had almost frozen solid from the weather. On top of that, it was supposed to rain the next day. Chances were, the dirt would turn to mud and undo much of their progress. It didn't matter, in Andrei's eyes. They'd been digging in the same damn spot for three weeks now and had nothing to show for it.\n\nOnce again, he plunged his shovel into the earth ahead of him once more, only to be met with a clang. He tried the same spot again a couple times, the same result producing itself each time. "Why have you stopped digging," the commissar overseeing the men demanded. "It’s the soil, sir," Andrei replied, "It’s frozen solid!"\n\n"Then dig faster! Harder! Use your hands if you have to!"\n\n“If you want this done faster, maybe grab your own fucking shovel and get digging,” a soldier cried. The commissar’s head snapped to the source of the demand, and he motioned with his hand for one of his guards to grab the man and bring him before him.\n\n"What is your name, soldier?" the commissar growled. Rather than being cowed, the young soldier spit a phlegmy blob right onto the commissar's eye. The camp froze for one moment. The commissar dazedly wiped his face with a leather-bound hand.\n\nSilently, slowly, the commissar drew his service pistol from its holster. For a split second, one could see the private attempt to struggle fruitlessly before the commissar fired a single round into his skull. His body slumped backwards into the trench. "When that bell rings, you will ignore it and keep digging," the commissar ordered.\n\nThe next morning it was raining, and as Andrei predicted, their work had been washed away."
 OMS_Post_unification.25.a:0 "And the private's body was never found."

 OMS_Post_unification.26.t:0 "The T.V’s will Run Black"
 OMS_Post_unification.26.desc:0 "Yustina Novikova was doing her usual business in her family’s household, a small bungalow outside of Krasnoyarsk. She lived with her family of four, her two daughters Marianna and Lana, her husband Adrik and finally herself. All in all, they were lucky. Adrik was not in the front, and yet they survived, working at the local artillery factory. As she was finishing her chores for the day, Lana ran up to her. Lana was a very artistic child and she often showed her art to her mother. This day she had made a rather terrifying piece.\n\nThe drawing looked like a demon with a German helmet languishing in pain while it burned upon a stake of fire. Around the stake were multiple people cheering as the Teuton burned. The drawing was comically unrealistic and simple, yet disturbing to look at. Yustina carefully handed the drawing back to Lana.\n\n"See? It’s a German burning, like teacher said they should! I saw it on T.V! I hate the evil Teutons!" Lana shouted in childish rage. Yustina couldn't muster much of a response to her outbursts — they terrified her. "Do you also hate them, mommy?"\n\n"Well, Lana... hate is a scary thing. Very scary." she offered.\n\nLana frowned. "But Mommy, school says that hating the enemy is good. And the 'clab-rat-ors' sold us out!"\n\n"I just think you shouldn't draw these things, honey." Yustina sighed.\n\nLana frowned and crumpled the drawing in her round little hands. "Well, I'll tell the teacher you won't let me!"\n\nYustina grabbed Lana by the shoulder before she could scamper off. "You will do no such thing! You'll do as I say! Throw that drawing away, and don't you dare tell the teacher, or you won't have any dinner for a week!" her voice raised to a fever pitch in staccato tones until Lana, shuddering, sat down and cried on her little chair.\n\nShe quickly moved to calm down her youngest child with soft, motherly tones. While what she did was necessary, Yustina sighed, not only over the drawing, but over her reaction."
 OMS_Post_unification.26.a:0 "Hate seeps even into the youngest ones"

 OMS_Post_unification.27.t:0 "A Justified Military Reclamation"
 OMS_Post_unification.27.desc:0 "The village of Brilyakovo was awoken by the skid of truck tires and the shouting of voices as the 35th Motorized Infantry Division stormed the village. The steady footfalls of soldiers blended into those of panicked villagers, fleeing a potential German invasion.\n\nA broad-shouldered officer contemptuously began to read out a prepared statement. “By command of the All-Russian Black League, this village is to be confiscated and turned over to the state in which it shall be used in our national defense. Any resistance to arrest will be met with gunfire at sight for treason."\n\nFearing the terror of the League, one by one, the villagers gave themselves up to the occupiers. Black-cloaked soldiers stomped to their houses, rounded the pedestrians up, and sent them to the village square. Any who resisted were beaten, or if they were unlucky, shot. Following this, they were corralled off to a few trucks, who'd send them away from everything they held dear. Only a scant 15 mix of rebellious youth and aging elders protested. However, instead of pushing and shoving, the officer simply began reading from a list of crimes they'd apparently committed against Russia.\n\nThen, the officer raised his gloved hand, snapped his fingers, and the group was no more. In ten minutes, they were thrown into a snowy ditch. In just four hours, nothing and nobody remained. The good people of Russia would later learn that they were "attacked by Nazi Sympathizers" during the construction of state infrastructure. Despite the errant rumbling, nobody seemed to care, and certainly nobody did anything about it.\n\nThe construction was underway, and progress was steady. The village was going to become a military base for the preparations for the Great Trial. The forward military base would serve as a vanguard in the assault towards the plunderers in "Moskowien". This station, merely one of many, will be crucial in our fight against the Teutonic Menace."
 OMS_Post_unification.27.a:0 "An inevitable act for a noble cause."

 OMS_Post_unification.28.t:0 "This Is My Shovel"
 OMS_Post_unification.28.desc:0 "Life in the city of Dimitrovgrad was one of constant struggle for the people living there. Ever since 1941, it seemed that the residents of the average city could never truly catch a break. But recently, it seemed like they could, after Yazov had the previous owners of the city "decommissioned", life in Dimitrovgrad continued on without any real issues from the government, other than the odd military recruitment drives and so-on.\n\nIt was nice, but it couldn't last forever.\n\nEarly morning, on another seemingly average day, about five dozen soldiers poured into the city. They began going door to door and ordering the two most fit members of the family outside, once they had 52 people total. All of them odered into trucks, where they were told they were needed by the army and woulld fulfill their patriotic duty on this day.\n\nAny questions asked were waved off and were replied with "When we arrive there, our commander will explain.". When they did arrive, all of them were ordered to dismount and line-up in age order. An officier in full League gard approached, and began to speak with a voice that exuded authority and confidence. "That way" he pointed "Is the Germans. High command has issued an express order that we should be prepared in-case any fights were to break out between us and them. So, you are going to dig two kilometers of trenches. By digging these trenches you are saving the lives of servicemen of the Russian Army. Get to work!"\n\nAnd so they did Digging trenches was hard work that not all of them were used to, but with the amount of people there, it took them only about 3 hours to get the job completed to the officer's approval. Without so much as a word of praise they were then right after directed to leave the area immediately. They got back into the trucks and were driven back to the city. There were no words shared on the truck ride back, but it was obvious what everyone sitting there was thinking."
 OMS_Post_unification.28.a:0 "The dawn of the Great Trial was rapidly approaching."

 OMS_Post_unification.29.t:0 "Little Eyes, Little Ears"
 OMS_Post_unification.29.desc:0 "Arseniy tread with haste throughout the hallway of the bureau, folders in hand, a line to the United States straight behind the cold metal doors in front of him. He swung them open with great elan, slamming them into the utilitarian, off-white spackle. He set the folders down on the counter and booted up the computers. He jogged through the room, fiddling with knobs, setting the radios to the right frequency to call for help. The fax machine was already on, as he hoped. Everything was going swimmingly, and if it continued to do so, no one would ever know that Arseniy Nikolaev set foot in this building.\n\nHe’d had enough of it. Every day his son, Nikita, would come back from school, ranting about whatever new insanity the League invented that week, drilling him to become the perfect meat shield for the coming German onslaught. Every day his wife came back home more depressed, the tears of a woman separated from her family by the cadre system staining his white dress shirt. All of it, he’d had fucking enough. What the Americans knew was only a HINT of the true depravity of the League; soon enough, they’d get their impetus to act, god willing.\n\nArseniy was lost in thought until he realized something. The computers weren’t connecting to a network. The radios returned nothing but static. And the fax machine was on, but it wasn’t even working. His heart sank. The doors thumped as three men ran into the room, pistols in hand. At their front was Igor, the only officer of the League he ever managed to get along with, and the only friend he had ever made in the brutal rearrangement of the cadre system.\n\nIgor thumbed the trigger on his pistol. “Arseniy. It is disappointing to find you here, truly.”\n\n“H-How?”\n\n“You raised a good kid.” Igor cocked the hammer of his gun and raised it up to Arseniy’s head."
 OMS_Post_unification.29.a:0 "“He’ll make a fine officer, one day.”"

 OMS_Post_unification.30.t:0 "True League Comrades"
 OMS_Post_unification.30.desc:0 "In all of Ivan's life, he’d never once dared to betray the League. They were his protectors, and the ones who would strike down all who opposed his people’s enemies. And although he was only sixteen years of age, he believed himself to perhaps be the Leagues most faithful servant, taking every beating and scolding as a gift rather than a simple exercise of discipline.\n\nWhich is why he didn’t complain about being assigned to a League production facility. Upon arrival, he was in awe of the scale of these facilities, and just how intricately they were laid out. He had been assigned to a Cadre upon arrival, and was given instruction on how to operate the equipment on the production line by a fellow member of that Cadre. Within the hour, Ivan was working to produce the mechanisms of war that would assist in his nation's struggle.\n\nHe was perhaps the most zealous one there, being the first of a new type of Russian who had spent a majority of their time growing up knowing only the League and its constant flow of propaganda.\n\nIvan’s zealotry was exactly what the League needed, but he was a curse for the man sitting next to him, Valentin. He had never wanted to be here, and was forcefully assigned here years ago. He knew what happened to those who spoke out against the conditions, but had begun to reach his limit as the years went on. And when that day came, just a few hours after this new arrival had been assigned to work next to him, a man in an all black uniform came to inform them all of the new increase of production quotas, and the reduction in hours for break time.\n\nHe couldn’t restrain himself any longer, and let out a small whisper of defiance. “I hate this place and the godforsaken fools that lead it.”\n\nIvan heard every word. He swung his head over to look at the fool who dared speak against the League, but didn’t say a word. Later that day, he would report it to an official. And when he went to sleep, his bunkmate Valentin was there."
 OMS_Post_unification.30.a:0 "When he awoke, he was gone."

 OMS_Post_unification.31.t:0 "Great Russian Murals"
 OMS_Post_unification.31.desc:0 "Pavel wiped the sweat from his forehead, admiring the finished poster design. Like all his other works as of late, it had been commissioned. Well, 'commissioned' was a deeply charitable way of saying 'he had been told by a large, threatening man in a uniform to make it on pain of death whilst on minimal wages', but he was holding onto as much positivity as he could muster, given the circumstances.\n\nHe looked down upon what he had drawn, and felt alongside the token pride he took in his work, the familiar taste of bitterness. He was a cartoonist by trade. An illustrator. Before the Black League marched into his smaller city in West Russia, he had drawn cartoons of small animal people for children, living life and teaching them how to be kind to one another. His style had certainly developed over the years, that was for sure. Certainly not of his own volition, however.\n\nWhere he had once drawn soft, rounded shapes to appeal to the younger eye, he now drew sharp, angular lines. Lessons on life and getting along with one another were of no use to the Black League, nor was softness — only messages of triumph over the Teuton and the superiority of the Russian spirit would do. This was embodied in his piece — a chiseled man in a Black League uniform snapping the neck of Adolf Hitler.\n\nThe old artist sighed, looking at the time. 3:56AM. He still had 5 prompts to produce art for. Part of him wanted to doodle absent-midedly, but his paper usage was cataloged and he would be penalized financially for any 'wasted' paper. He checked the list once again. His next prompt, 'Russian Eagle disembowelling a German Eagle" would be fun to draw. Hopefully."
 OMS_Post_unification.31.a:0 "No room for creativity in the Great Trial."

 OMS_Post_unification.32.t:0 "A Safe Frontline"
 OMS_Post_unification.32.desc:0 "Pavel wiped the sweat from his brow, as his shovel dug into the dirt once more. He’d lost track of how long he’d been training, digging, building, and preparing for when his country would at last strike the Aryan, and drown him in his own blood. His brigade's training regimens had grown even more demanding than usual, but nobody complained. Every man knew what it was for, and some even welcomed the new torment brought upon them.\n\nAfter all, every drop of blood, every broken bone, every moment of pain, was fuel. Fuel for the brave sons and daughters of the League who would exact vengeance on those who had defiled her, who had broken her and believed her incapable of returning to the world. Yet here they stood, ready to tear those scum limb from limb as the west burned in the fires of vengeance.\n\nPavel looked up from his part of the defensive works, and for the first time saw in their entirety the fruits of his and his comrades' work. Trenches and bunkers for miles, with a multitude of differently designed defensive works dug into the earth around them. Sadly his time for admiration quickly ended with the commanding officer's orders to get into formation. Pavel and his fellow soldiers assembled within seconds, forming an intricate pattern with each one standing at attention and ready for orders.\n\n“Soldiers, I have received new orders pertaining to the extension of drilling procedures within the League. You shall now have only three separate five minute break periods per day, and you are required to complete a daily 12 mile run in place of the pre-existing 10 mile run. However, with the completion of all defensive works projects in this sector, you’re no longer to assist in their construction. Finally, the minimum accuracy in shooting range tests has been increased to 90%. Dismissed.”\n\nPavel and his 2 other friends found each other during the break period, and began to talk about things to come. Not about the new, unbelievably difficult demands laid upon their shoulders, but about a topic they had been betting upon for a while.\n\nThey each argued who would be the first to enter Moscow."
 OMS_Post_unification.32.a:0 "The warriors of a new age..."

 OMS_Post_unification.33.t:0 "Burn Evidence, Burn Witnesses"
 OMS_Post_unification.33.desc:0 "Rule 15. Should a suspected person be found disseminating misinformation that undermines progress of the Great Trial, they are to be taken from their living area and put into interrogation until they reveal exactly which Teuton agency they are working for and who they have lied to. Upon revealing this, said person is to be executed.\n\nRule 16. Should a member of the police or any other security agency come into contact with any misinformative or deceptive Teuton propaganda, it is to be taken to the nearest town pyre and thrown in with any other Germanic materials. Only the cleansing fires can bring any merit out of their sordid materials.\n\nRule 17. Should a civilian act out against any member of the Black League or other official personnel, they are to be subdued by any means necessary. Punishment for doing so can range from two decades of service in a labor camp, rescindment of nuclear protections, a reduction of rations to any known familial relations, or point blank execution."
 OMS_Post_unification.33.a:0 "Rule 18..."

 OMS_Post_unification.34.t:0 "The Weaponization of Social Progress"
 OMS_Post_unification.34.desc:0 "It was odd, having Yuri out of the house so often. Nadya wandered through their shared apartment, as she often did nowadays, wafting aimlessly from room to room. The couple had only met recently, a few years ago at a book club in Tomsk. Yuri had always been a well-read man.\n\nPart of her wanted to be distraught that her partner had been forced into working 14-hour shifts at the local munitions factory, seven days a week, and she was undoubtedly angry at not seeing him as much. But whilst he was gone, she had found herself digging into the secret stash of books that Yuri kept, hidden away where the Black League couldn't burn it for not being patriotic enough.\n\nHe was always too scared to share his collection with her, before. But because he was now too busy to even come close to stopping her, Nadya could do it, and when she did, she felt free. And she enjoyed that feeling more than anything.\n\nOf course, she knew that Yazov had not done this out of some great feminist desire to liberate women, or something. Russia was not the place for that. But he had done something, inadvertently. As she curled up with Yuri's copy of War and Peace, Nadya mused about what else to do later on. It wasn't as if she'd be pressed for time, after all."
 OMS_Post_unification.34.a:0 "Dmitry Yazov — ally to women?"

 OMS_Post_unification.36.t:0 "An Ear In Every Room"
 OMS_Post_unification.36.desc:0 "Nikolai Volkov was not a man to take things lightly. Suspicion was as much a part of his personality as his affinity for black tea or his love for classic Russian novels. Living in an aging apartment complex, he had a habit of paying a little too much attention to his surroundings.\n\nThis particular night was no exception. As the small town settled into its nocturnal routine, an unusual hush fell over his apartment. However, what caught his attention was the soft murmur of his neighbors' conversation seeping through the paper-thin wall separating their lives.\n\nHis heart pounded slightly harder in his chest, the tranquility of his demeanor replaced with an edge of anxiety. The conversation felt different, the cadence, the intensity. Even the silence between their words seemed to carry a certain gravity. Something was not right.\n\nThe words were veiled by the sturdiness of the wall, the specific sentences hard to decipher. Yet, certain phrases seemed to penetrate this barrier, filling his apartment, and his mind, with an unease. "It's coming sooner than we thought," he heard a man say. "We need to prepare. It could change everything," a woman responded.\n\nA shiver ran down Nikolai's spine, his eyes narrowing with intrigue and suspicion. Was it a coded message? Could his seemingly ordinary neighbors be involved in some clandestine operation? As the minutes rolled into hours, he found himself increasingly drawn to this puzzle and soon enough found the answer in his troubled mind.\n\nHe rushed to pick up his old telephone and dial 'Line One.' A heavily distorted voice echoed through the receiver, “You have reached the Complaints Secretariat, do you have a concern to report?”\n\nDrawing in a deep breath, Nikolai found the words he needed, the declaration that felt both chilling and necessary, "I do. I think my neighbors are spies.”"
 OMS_Post_unification.36.a:0 "“It’s a boy, Anatoly... it’s a boy...”"

 OMS_Post_unification.37.t:0 "Produce Only What You Need"
 OMS_Post_unification.37.desc:0 "A loud knock was on the door followed by an order to open the door immediately. A worker rushed to the door and opened it. It was a Black League officer. The officer demanded to speak to the owner. He said that this factory had been creating too many luxury products and should instead focus on producing only what the community and army needs. The workers called the owner out. The owner was annoyed, but came quickly.\n\n“What is i-”\n\nHis heart stopped whenever he saw the officer.\n\n“Your factory has been deemed to not be complying with the government's regulations. You have been creating too many luxury goods.”\n\nThe owner started biting his nails, he knew that it was illegal to produce luxury goods, however it was very lucrative and had generated an immense amount of wealth for him.\n\n“Are you insane? You fools are destroying Russia! How are we supposed to earn a living here if business can’t flourish without the government sticking their nose where they shouldn’t!”\n\n“I will not repeat myself, cease production or else you will be terminated.”\n\nThe owner thought for a moment. Would he really be willing to sacrifice all of this wealth just for some doomed war? Why did they have to come into power? Russia would’ve been prosperous under any other government but we had to get stuck with these fools.\n\n“Mere bluffing will not stop me. I am one of the biggest industrialists in all of Russia, do you really think you can terminate me without any consequences?”\n\nThe officer sighed, and calmly reached for his pistol."
 OMS_Post_unification.37.a:0 "“There will be no more distractions.”"
 
 OMS_Post_unification.38.t:0 "Acceptance is Defeat"
 OMS_Post_unification.38.desc:0 "Rows of workers, hoping to find some respite from the grueling labor that was their lives from dawn to dusk, were instead sitting before a projector, soldiers in black uniforms guarding the exits. A few of the workers squirmed in their chairs, the uncomfortable seating compounding the aching in their muscles. At the front of them all stood an officer, gesturing to the wall on which the projection was playing.\n\n"Here you see the bodies of the dead. The German beasts have mutilated their corpses for the crime of rebellion. These are your fellow Russians, those who seek to be redeemed in the struggle against our eternal foe. This is what they are doing at this very moment, and what they hope to do to all of us should they succeed in their plans."\n\nThe film showed a mass grave that had been dug by some of the other slaves working in the Reichskommissariat Moskowien. Men, women, and children were lying in a mountain of bodies, with bullet holes and gashes where bayonets had pierced their skin. The film then shifted as a group of soldiers harassed a woman who had attempted to kill one of the officers. They tore at her clothing, enough for the men to begin raping her. Some of the workers looked away on instinct, not wanting to continue watching. Only the mere movement of the men in black out of the corner of their eyes snapped their attention back towards the projection.\n\nAfter the men had finished with her, one of them took out a knife and began stabbing her. A game of sorts had started as the soldiers began cutting at her as if to carve mementos from her body. She was only screaming for a few short moments before she lay dead. By the end, she was missing both her ears, a hand, and a breast, and her stomach had been cut open. The film ended here.\n\n"See the hatred that the Germans feel for us, and know that we will show them retribution. They will feel our wrath–our vengeance–and justice will be served to every last one of them."[Change Later]"
 OMS_Post_unification.38.a:0 "Shock and horror give way to rage."
 
 OMS_Post_unification.39.t:0 "Goodbyes at Fifteen"
 OMS_Post_unification.39.desc:0 "The bugle’s call clawed at the morning fog, yanking Ivan from his thin mattress. Cold and barefoot, the fifteen-year-old recruit snapped to attention like he had done every day for the past five months. Thirty-two other recruits of similar age fell into formation next to their beds, an unbroken line of adolescent determination stretching down the length of the barracks.\n\nExactly twenty-three seconds after the horn sounded, their drill officer stormed into the room. His eyes held a glint that spoke of a perpetual bad mood and a determination to instil order and discipline in his charges.\n\n"Kozlov! Fix that blasted posture now!" His words sliced through the morning chill. "Are you planning on marching into Germany looking like a hunchback?"\n\nKozlov stumbled over his response, the young cadet wilting under scrutiny. "Y-yes sir! It won’t happen again."\n\n"Damn right it won't," growled the officer. His gaze swept over them all, eyes as piercing and cold as the winds outside. "We are the chosen, the ones to reclaim our homeland's glory. We are the instruments of the Great Trial, and we will not fail!" His gaze found Ivan's, a silent understanding passing between them. "Ivanov," he said, a new edge of severity cutting through his voice, "You were the first to arrive at the training field yesterday, were you not?"\n\n"Yes sir, I was." Ivan's voice held steady under the scrutiny.\n\nThe officer grunted, a sound trapped between approval and scorn. "Good. Make sure you're the first one today as well, or it's extra drills for you."\n\nAs the officer moved on, Ivan set his gaze straight ahead, a grim smile tugging at his lips. His day had just begun. The whispered dreams of home from the night before lingered, but there was no time for dreams here, only duty."
 OMS_Post_unification.39.a:0 "The Motherland has no need for sentimentalism."
 
 OMS_Warprep.1.t:0 "Minutes to Midnight"
 OMS_Warprep.1.desc:0 "Guards stood rapt at attention as the motorcade came to a soft halt in front of the military headquarters of the Black League's Army in Magnitogorsk. The door opened. What was once a bustling center of the commerce of war went silent, as all, from the highest of commanders to the lowest of janitors. Yazov stepped forward, his crisply polished black boots clanging on the immaculate and sterile tiles.\n\n"Men and women of Russia..." He rasped. "We have come upon a moment foretold by our ancestors for generations. Long ago, we succumbed to the great myth that we were inferiors to the Germans. Through weak will and the insolence of opportunistic warlords, we fell. Our country has now been infected by a stain known only as the Greater Germanic Reich. Now however, we have risen, stronger than ever. Where once we were splintered, we now find ourselves unified under a single banner and purpose. Where once we were disparate in thought and mind, we now stand unified behind one singular vision. Vengeance, vengeance against our inferiors who dared to plunder and take from Russia everything that their grubby hands could touch. From today on, good citizens of Russia, brothers and sisters of the Great Trial, no more!" Yazov smiled as the speech was met with uproarious applause and celebration. \n\n"We shall beat back the Teutonic hoard and all who dare stand with them! A ring of steel shall surround their rotten cities! We shall crush all who resist the will of the Black League! They shall learn the meaning of suffering, and by the Lord's command, they shall learn to abandon all hope!" With a rehearsed flurry, Yazov entered into controlled zealotry, throwing his hat into the fervent crowd as he began to chant. "URA! URA! URA!"\n\nWith the crowd crazed to satisfaction, Yazov journeyed back to his motorcade. There were many more locations to hit that night.\n\n"
 OMS_Warprep.1.a:0 "The Heart of this Army will not be Broken!"

 OMS_Warprep.2.t:0 "Total War"
 OMS_Warprep.2.desc:0 "The Cadre officers sat around the table in the dimly lit bunker. A large manila folder sat in the middle, the front cover marked "STRATEGIES AND TACTICS FOR THE GREAT TRIAL" in big bold letters. The highest ranking officer took the folder and removed the plethora of manuals and charts, passing them out to the men. \n\nOne of the men sat his papers down and looked at the commander. "It says here the standard protocol for handling POW's as a tank crew is to.. strap the prisoner to the front of the tank..?"\n\nThe commander nodded. He strode over to the man and flipped the page, pointing to the instructions on how to properly tie a man to the front of a battle tank, complete with pictures of demonstrations. \n\nAnother officer visibly shivered, shoving the manuals away from him. "The proper way to burn down a settler's farm includes locking the family in the livestock barn before setting fire to all 4 corners. I'm not sure how this-" he locked eyes with the commander glaring at him, promptly silencing himself and staring at the manual in front of him.\n\n	Across the table, a younger officer flipped to the 'Public Building Demolition' section. He coughed, struggling to say he was going to the bathroom. The other officers could hear him vomit the moment the door was closed. Those close to his seat curiously looked at what he'd been reading and fought the urge to do the same. \n\n"During the initial bombardment of Teuton population centers, chemical shells should be used on school buildings in order to increase the chance of immediate surrender.""
 OMS_Warprep.2.a:0 "Victory, no matter how it is achieved."

 OMS_Warprep.3.t:0 "The Torches Blaze"
 OMS_Warprep.3.desc:0 "As I stepped off onto the gray pier of Vladivostok, my eyes couldn't help but wander to the familiar skyline from my last visit. My last visit had prompted Langley to view me as somewhat of a go-between man, and my assignment had once again brought me to this dismal city. Surprisingly, my old friend, the little green man, was once again waiting for me on the dock. After giving me an elaborate salute, we began once again. \n\n	"Greetings. As you know, I am with the American Central Intelligence Agency in Langley. I'm here at the behest of my government to confirm that the shipments will continue as normal. Is that satisfactory?" \n\n	As opposed to last time, the soldier seemingly showed emotion this time. His eyes were more wild than normal. Beneath them lay bags and his entire figure seemed more tense, as if he was holding his motion instead of instinctively keeping a deeply drilled formation. \n\n	"Yes..." He began carefully. "The Black League is satisfied by your continued support. Know that in the war against the hated Teut.." He faltered slightly, and this time he failed to pick up the script. That oppressive blanket was coming up again. \n\n	"The hated Teuton, no support will go unused." He finished weakly.\n\n	"Of course. Would you happen to be okay?" \n\n	"Yes." He replied, clearly flustered. Something was not going right. \n\n	"May I leave?" \n\n	"You may. We have arranged a hotel room for you. It is very comfortable. You will stay in it until your ship arrives." \n\n	"Very well." The conversation had become very awkward, and like I had the first time, Vladivostok was feeling more unbearable by the minute. As I walked past however, the Black League soldier bumped me, in-so-doing passing me a small piece of paper. Now that I am safe in the states, I shall record what it says. \n\n	"It begins soon. I pray for you." \n\n	The Potemkin Village has been torn down. \n\n"
 OMS_Warprep.3.a:0 "And behind it lays only vengeance"

 OMS_Warprep.4.t:0 "Symphony of Sacrifice"
 OMS_Warprep.4.desc:0 "Heavy machinery's deafening buzzing and whirring filled the factory's spacious yet cramped rooms. It was a constant, miserable affair to be working in. The room's humid, dangerously hot temperature would make even the strongest men fall to their knees, pleading for a moment of respite. Every worker knew such a plea would have the guards answer with a bullet in the back of one's skull.\n\nVasily knew he would not leave this factory alive. He unconditionally loved his son Viktor, who was Vasily's life's subject of daily prayer. The mere thought of seeing his son after consecutive 20-hour shifts was the only thing he could depend on. Vasily smiled warmly to himself, keeping the image of his sweet child Viktor in his mind.\n\nSuddenly a dull, bodily thud broke the constant rhythm of machinery. The distinct sound of what sounded like a watermelon slamming into concrete briefly overpowered every noise as Vasily's head swiveled around, attempting to detect the source of the noise. His eyes finally rested on one spot: a motionless body with a pool of blood collecting around the body's head. It was one of the factory workers. From the looks of it, Vasily assumed the woman had collapsed from exhaustion and had slammed her head into the concrete floor where she once stood.\n\nThe guards, alerted by the factory's manager, were quickly dispatched with a body bag ready. Laying out the bag, the guards hurriedly move the body, not even stopping to check for a pulse. As the guards were getting ready to seal the bag, the body inside began to spasm violently. One of the men drew their pistol and squeezed the trigger, all in one fluid motion. The moment, for once, was filled with a dreadful silence.\n\nBy now, a dazed Vasily slowly returned to his workstation, his brain on autopilot as his hand autonomously pulled down on the lever. The image of Viktor was in the back of his mind, as his brain kept flashing images of the horrors he'd seen.\n\n"
 OMS_Warprep.4.a:0 "Oh Viktor, I pray for your better life."

 OMS_Warprep.5.t:0 "Posture Our Might"
 OMS_Warprep.5.desc:0 "Yazov beamed with pride as he looked on the Omsk parade grounds. Over 20 lanes of asphalt, devoted to showing the might of the Black League that had been painstakingly constructed, at ludicrous expense, in the center of the city. Intersecting League headquarters, several ministerial buildings, and the Grand Marshal's palace, there remained no question as to why all this labor had been expensed. The parade grounds, and hundreds like it across the country, were shows of pure power and might, both financial and military.\n\nOn the grounds today were rows and rows of Russia's finest mechanized troops. BMPs, BMDs, and tanks of makes and models from every stage of the Smuta plowed forward, alongside lines and lines of soldiers stood at rapt attention all whilst hanging or standing on the beds of trucks. It was all a far-cry from what Omsk began as. From a band of sniveling militia and remnants, to perhaps the most powerful military east of Moscow, though the progress had come at great costs to the people and to Russia's natural resources. Nevertheless, Yazov thought, it was all worth it. A wing of MIG-23's suddenly soared by, flying so high that their shiny chrome coatings appeared only as a speck in the high afternoon. Across Russia, the sight was much the same. Forces of Omsk marched in unison for one reason, one purpose, one party.\n\nDaniel looked on in silent horror. As the Russian correspondent for NBC, he had never felt comfortable in the country. What he was shown was highly rehearsed, what he heard highly scripted, what he felt unnatural and stilted. The city of Omsk itself had physically spread its concrete tendrils outwards throughout the years. Massive prefabricated flats rose from the previously desolate wasteland, overshadowed by gigantic palaces and split by the 20-lane parade ground. What he saw in front of him now, the rows and rows of vehicles going forward, did nothing to assuage his feelings. A chaperone oversaw all his notes, so he kept them brief." 
 OMS_Warprep.5.a:0 "An army that will shake the world."

 OMS_Warprep.6.t:0 "The Sleeping Mantis"
 OMS_Warprep.6.desc:0 "A bitterly frozen breeze swept through the decrepit house that once housed a small family of farmers. The house appeared barely held apart after a few decades of abandonment by its original inhabitants. It was the perfect place for Andrey to wait - and he did. For over a couple of years, Andrey had been camped out in the cellar, foraging for what food he could, stealing all necessities to ensure he could survive any challenge Mother Nature might pose.\n\nAs a result of his constant need to ensure utmost secrecy, Andrey's living quarters had been filthy, save for the pristine-looking handset radio on the desk. That radio will crackle to life when the day comes, informing him of his codeword to wreak havoc among the nearby German garrison. The mere thought alone brought excitement to his eyes as he sat quietly next to the radio - the same task he had performed every day since being stationed in West Russia.\n\nOne night, when the moon was at its antithesis from the sun, Andrey heard the faint crackling from the receiver of his device. His eyes widened. Is he finally getting the chance he waited for years? His ears were open, and his mouth shut tight, waiting for whoever was on the other side to tell him. After a few moments of excitement, he could make a voice speaking through his radio.\n\n"Firefly."\n\nAlmost falling flat on his face, Andrey lept out of his chair and sprinted to his action station. The adrenaline coursing through his veins made him beam a massive smile across his face and take over his body as he went outside to the nearby old horse pen. Andrey grabbed the cover over his weapon and threw it to the side, revealing a large mortar precisely aimed at a barracks. As he reached his right, he retrieved a single mortar round, placed it in the tube, and dropped it down to the bottom. Shtoomp! The shell flew towards its destination, and before it landed, he dropped another round into the tube."
 OMS_Warprep.6.a:0 "This is the most fantastic moment of my life!"

 OMS_Warprep.7.t:0 "Operation Chernobog"
 OMS_Warprep.7.desc:0 "The radio chatter all morning had been nothing but deafening. Ulrich kept receiving nothing but the same radio reports since 5 in the morning. Bridges blown, powerlines cut, communication poles split in half, everything that holds apart this land was being systematically picked apart and shredded up. There was nothing he could do but roughly map out where these reports took place, but by this point in midday he was running out of tacks to mark down the information through the constant screaming in his earpiece. It was as if he was witnessing the end of the world around him in real time.\n\n"Ulrich! Report!" Ulrich immediately stood at attention, Major Steuben stood opposite of the table from him.\n\n"Mein Herr! The situation is dire, sir. Our infrastructure is becoming a victim to relentless terrorist attacks, I assume directed from those barbarians to the East." The Major could identify the exhaustion worn on Ulrich's face, and he silently nodded at him to return to what he was doing. "Sir, if I may," As Ulrich returned to his post, he kept his eyes on Major Steuben, who seemed to be calm and collected in spite of the situation. "If we are to lose all communication with the rest of our garrisons, what is our plan?" The major noticed a glimmer of fear within Ulrich's eyes.\n\n"If you find yourself in such a position..." Steuben walked towards Ulrich, reaching in his coat pocket to grab something out of there. "...You take this pistol here, and this is the important part." He swiftly grabs Ulrich's hand and forces a pistol grip into his hand. "You take this pistol here, you point it at the bad guy in front of you, and you squeeze that trigger as if it's the last thing you ever do in this life. That, or you could turn the gun around, and squeeze the trigger for the last time. The choice is yours, kid."\n\nUlrich bit his lip in quiet terror. He was only doing his mandatory service and wanted nothing more in this moment than to sprint westwards back into the arms of his mother. He nodded at the major, and watched him leave the room. Placing the pistol in front of him, he sat in a silent state, not even registering the cries for help in his earpiece."
 OMS_Warprep.7.a:0 "Gott, hilf uns"
 
 OMS_Warprep.8.t:0 "A Letter Of Intent"
 OMS_Warprep.8.desc:0 "[Change Later]"To the damnable government of the Greater Germanic Reich,\n\nIf you wish to avoid the destruction upon your nation which will surely be wrought by failure to comply, you will adhere to the demands which have been listed in this letter. Any response other than complete assent to our requests will be cause for immediate and total war against your abhorrent nation.\n\nFirstly, the Black League demands the prompt return of all German Reichskommisariats in Eastern Europe which house Russian or otherwise Slavic populations to the control of the Reclamation Government to be reincorporated as territory of its administration. Any German colonizers present in these lands are expected to return to Germany within thirty six hours or face immediate execution for the raping of the lands which they occupy.\n\nSecondly, the German Reich is to immediately and without protest present the officials currently holding any and all higher offices of its state, including that of the Fuhrer, to the Black League for immediate military tribunal for their crimes. In addition, the German people must unilaterally be found as guilty of genocide and destruction of the Slavic and Russian peoples and be sentenced to pay collective reparations of at least one hundred billion Reichsmarks. Payment in full to the Russian National Reclamation Government is expected no less than ten years from today.\n\nFurthermore, the organs of state of the German Reich are to be placed under direct control of the Russian Government for inspection of their heinous and undeniable crimes against the world and sacred Russia. Black League officials are to oversee the trial of these state organizations and their administrators.\n\nThe National Socialist German Workers Party is to be immediately disbanded and any who hold membership are to be banned from holding public office. A complete list of these rats responsible for destroying the Russian nation is to be sent to the Black League for inspection and to do with as it sees fit.\n\nFinally, the German government is to formally and unconditionally surrender to the Black League. The full punishment of its people is to be determined by the Russian Government at a later date.\n\nWe await your response."[Change Later]"
 OMS_Warprep.8.a:0 "[Change Later]"They can't be serious, can they?"[Change Later]."

 OMS_Warprep.9.t:0 "Our Offer Declined"
 OMS_Warprep.9.desc:0 "DIRECT TELEGRAM TO GLAVKOVERKH\n\nThe broadcasts have come back with a simple response, and in only a few words do we find disgustingly revolting messages. We have found nothing but a willingness to descend into hellfire from the menace that lies to the west.\n\n“Your request for a return of ‘rightfully Russian territories’ back to the so-called ‘National Reclamation Authority’ has been formally rejected.”\n\nOnly one excerpt of a damned message we will prove entirely false. In due time, we will show them what it truly means to exact divine power in the name of defending our Motherland. The crimes of desecration will duly end."
 OMS_Warprep.9.a:0 "When the storm passes, and the clouds eventually clear, justice will have no meaning."

 OMS_Warprep.10.t:0 "Every Waking Moment"
 OMS_Warprep.10.desc:0 "Once, there was a time Mikhail's village could have been described as "sleepy," even pleasant. In a time long past, only remembered by a select few remaining in the town, their concerns were few in number and small in scope. They were subjects of Bukharin's Union, yes, but beyond taxes and the growing pains of collectivization in the early Soviet era, their interactions with the larger central government were blissfully few. They were self-sustaining, and as far as anyone who Mikhail met was concerned, life was contained within their community.\n\nThen, as the calamity of Barborossa swept his town, peace became little but a memory. Every town, city, and individual in all of Russia had a radically different story of how the warlord period caused their former lives to be destroyed, but for Mikhail there was nothing but catastrophe after catastrophe. Their fields were salted by fascists, their food stores raided by communists. The years of suffering the winter storms, the bitter taste of blood staining their earth sharpened the white hot hatred that burned inside of them. Life was war, and to survive was to be the victor.\n\nNow, they fought for something larger. Day in, and day out, the villagers shipped out to factories on new infrastructure and worked well into the night.  A local garrison had been established to protect the area - it seemed the men never stopped marching. Rationing was fierce, and the bitter cold and darkness bit fiercely at their weary bones. But the consequences of failure weighed heavier still. Yazov made the greatest demand - the demand of the total self. In return he promised the greatest vengeance. He would extract a pound of flesh from the Enemy for every hour spent hiding under the floorboards, hoping that the raiders would not put another house to the torch."
 OMS_Warprep.10.a:0 "Thus, the sleeping town awakens to the sound of boots and steel."

 OMS_Warprep.11.t:0 "Towards Midnight"
 OMS_Warprep.11.desc:0 "Yegveny stood idle dressed in Berezka camouflage, fiddling the headset connected to his radio kit. He sighed in resignation, before turning into his commanding officer's station, the static washed out by the man's voice.\n\n\"Proud servicemen of the Armed Forces of the Russian National Reclamation Government, we're restationing countless units to our most far western border as a part of a new strategy. Further statements will be issued today. Glory to the Black League."\n\n‘Innocuous enough, right?’ Yevgeny thought. Surely this is just a simple training exercise with some distant unit? He wouldn't have to feel the ramifications of the Great Trial anytime soon, he had been following the same strict schedule for a while, why would anything significant happen now? Yevgeny held back his disbelief, but a crushing realization would come.\n\nIt was happening. It all added up, the increased requests for weapons shipments in the last few days, the increased frequency of training exercises, the strange mobilizations, it was enough to shatter his disbelief. Nothing he could do was going to stop the inevitable conflict, he was subject to the whim of his superiors, and of course Glavkoverkh Yazov. This was of eschatological proportions, this was possibly the end of everything he knew. The prospect kept coming back to him, overwhelming him as he tried to recover mentally from the circumstances. Yevgent was forced to do so by the petty antagonisms that were the Great Trial, the backbone of the fierce nationalism that the Black League had weaponized. There was nothing else that could be done, he was made to tread the line of history, spiraling into a cataclysm that was ultimately out of his control."
 OMS_Warprep.11.a:0 "The gears of history are grinding to a halt."

 OMS_Warprep.12.t:0 "We Are Ready"
 OMS_Warprep.12.desc:0 "The door slammed shut, and silence returned to the bunker that served as Dmitiry Yazov’s quarters. Yazov and his staff had concluded yet another meeting, with the main talking points being on the current status of readiness for the Leagues troops and reports on the morale of the people. Dozens of files containing dizzying amounts of data had been laid out on the table before him, and Yazov had slowly combed through each and every one. When the meeting concluded, his outward persona completely changed, going from the cold, iron hearted man that the world knew, to a man shakily taking off his cap and taking several swigs of vodka.\n\nSo much work had been done. So many production facilities were created, dissidents crushed, military units trained and organized, and so much more that Yazov had begun to start wishing that the day would come sooner. The day when he would give that order, and it could begin. The day the Motherland’s redemption would finally be achieved when The Great Trial was commenced. But at the advice of his staff, he’d delayed that order so that Russia could well and truly be prepared for The Great Trial.\n\nAnd now, after so long, that day was on the horizon. Finally, he thought. Finally, it would all be worth it. Every moment of progress, gained in blood since the day his mentor had given him the mantle of leading the Leagues destiny, would all be worth it. When the day came where Russian flags flew over Germania, and the Aryan was obliterated by Russian arms... finally, justice for innumerable crimes against his people would be achieved at last.\n\nYazov sighed, rising from his seat and reaching for his hat as he remembered once more that there were still a few remaining tasks at hand that needed to be addressed before all of his thoughts could come to fruition. He exited his room, and made his way over to the broadcasting station as he prepared himself for one last grand speech to his people before destiny."
 OMS_Warprep.12.a:0 "Midnight grows ever nearer"

 OMS_Warprep.13.t:0 "U-Bahn 36"
 OMS_Warprep.13.desc:0 "The warm morning in Stuttgart did little to ease Boris’ mind, he sat on an empty bench in a bustling metro terminal. He checked the time on his watch and flipped another page in his newspaper that he pretended to read, but there was little to make out due to his basic knowledge of the Teuton’s pig-speech. 17:25 was the time that showed on his watch, Boris couldn’t help but let out a shaky sigh as a breeze brushed along the back of his neck. He tucked his trench coat closer to himself, but it was hard given what was underneath. His last day on Earth would end in less than five minutes.\n\nIt had been half a year into his infiltration of the Reich. Being forced to speak and walk among the fascist peons, it disgusted Boris, but his duty was to Russia. If she asked him to jump, he would ask how high, and so when he was ordered to cross the border and venture deep into the black heart of the world’s greatest evil, he followed the order to the letter. When the details of his cell’s role in Chernobog were dispatched, Boris stepped up to take the responsibility.\n\nDespite his hands starting to shake as he held his newspaper, Boris felt at peace with the knowledge that his sacrifice would help make the foundations for the Great Trial. Boris wept on the day his parents died from a German bomber, he couldn’t help but find his coming death to be ironic. A dry chuckle left his lips as the train came into view of the U-Bahn terminal. He looked at his watch again, 17:29, it was time.\n\nBoris set down the newspaper and stood. He was beside a crowd of men, women, and children, going about their daily routine, blissfully ignorant of the struggle of his race that these people wrought. Boris felt no pity for them. Slowly, his hand reached into his coat and pulled out a remote with a blood red trigger.\n\nAs the train braked to a stop, Boris casted off his coat, the years of struggle and loss were lifted off his shoulders as the coat touched the concrete platform and dozens of blocks of C-4, taped to his person, became exposed. The train doors opened and as people around took notice and began to panic, Boris held up the detonator and yelled his final two words before flexing his finger."
 OMS_Warprep.13.a:0 "Za Rodina!"

 OMS_Warprep.14.t:0 "Controlled Burning"
 OMS_Warprep.14.desc:0 "“Cell-27 to Orel, Cell-27 to Orel, come in.” Ivanna said into the receiver of the HAM radio that sat on the desk of the now former overseer of Site-17, a Rostow grain plantation. It was one place of many in Ukraine where Ivanna’s fellow countrymen would slave away and till the fields, only to see the fruits of their labors be packed onto trucks and shipped to fill the appetites of their gluttonous German overlords. Men and women like Ivanna held no love for the Germans and the dogs that were their collaborators. As a result, they naturally welcomed the agents from the Black League. They heard the odd tales of brutality and spartan policies, but it was certainly German propaganda, because nothing could be more cruel than their current oppressors. \n\nWith the help of the Black League agents via weapons and information, Ivanna and her fellow workers liberated the plantation and expunged any German resistance . With the farm taken over, their next task was to make communication with their Black League contacts.\n\n“Cell-27 to Orel, do you read?” Ivanna said to the radio receiver, the silent static began to unnerve her. She looked at the radio frequency scribbled onto a chit of paper, checking if she dialed it in correctly, when a voice that spoke Russian came on.\n\n“Cell-27, this is Orel. We read you. What’s the status of your objective?”\n\nIvanna felt relief when she heard the voice. She pressed her hand onto the button of the receiver to respond.\n\n“We’ve taken the grain site, we’ve taken several casualties and have some wounded but-" She got interruped by the voice on hte other side of the radio. “New orders from the top, burn any and all assets you can before enemy reinforcements arrive.”\n\n“Say again, Orel? You want us to burn it all?” She asked, failing to hide her incredulous tone. \n\n“Correct.” Was the only response Ivanna received.\n\n"
 OMS_Warprep.14.a:0 "Dump any animals you find into the river."

 OMS_Warprep.15.t:0 "Stabbed In the Back"
 OMS_Warprep.15.desc:0 ""Gentlemen, quiet down!" Heinreich practically kicked over the door in anger and frustration, his day derailed almost in totality by the reports which had been dumped on his desk the day before. As head of the Reichskommissariet's Kaukasien's Gestapo, Heinreich was responsible for suppressing any civilian who dared oppose the Aryan race's vision for the mountains of this vast region. It seemed now however that something else was afoot. \n\n	"All of you, report" He listened to a few reports of industrial sabotage before speaking again. "Gentlemen, we are being buried under a pile of Judeo-Bolshevik sabotage. It is clear that we are facing a coordinated campaign and hence we must prepare. We must redouble our efforts to combat this crisis before it spirals out of control, before it hits the Reich's very heart." \n\n	"Yes Herr Director." The assembled chiefs chorused. \n\n	"We will take back control of our streets and our charges. Any who participate in these sabotages will be made an example of. For every innocent Aryan who is killed, 10 natives will be shot. This crisis ends today!" \n\n	"Yes Herr Director." \n\n	"I expect to hear tomorrow that this little misunderstanding has been dealt with. I expect to see the saboteurs hanging from lamposts!" \n\n	"Yes Herr Director." \n\n	"You are dismissed." \n\n	As the meeting came to a close and all assembled members shuffled out, Heinreich took a moment to contemplate the situation he was in. The sounds of sirens and the light of fires burning out in the Tbilisi streets were open for him to see. He wondered if his motivational speech would actually work. \n\n"
 OMS_Warprep.15.a:0 "If you say something enough times and keep repeating it, it will become true. Right?"

 OMS_Warprep.16.t:0 "Dirty Tricks"
 OMS_Warprep.16.desc:0 "The radio in the police vehicle crackled to life as Konrad cruised down the city's bustling waterfront district. \n\n"Officer Pfister. There has been an incident at the Church of St. Michael. Visitors heard a strange ticking noise in the rafters. Over." \n\nKonrad picked up the hand radio. \n\n"Copy that. Show me going to the Church." \n\nWith a spin of the wheel, Konrad drove off to another routine call, this time away from the waterfront. He parked the car by an empty-looking curbside to a crowd gathered hesitantly outside. After gently clearing them away, he opened the door. His right hand was positioned tenuously near his pistol. Entering from the south facade, nothing met him except the magnificence of baroque pulpit and altar; rows upon rows of empty pews clad in a deathly silence. The Church was usually full of people, and even in off hours stragglers trickled into the pews to give quick prayers or to consult a priest. Now, there was nobody. Konrad took stock. There was nothing on the ground floor but emptiness. Perhaps the basement would offer more answers. \n\nThe officer took a brisk pace down the footsteps into the basement. It was barely accommodating of his height, forcing him to stoop down. Lit by nothing but dim oil lamps, boxes crowded the place. In between them and the pillars which maintained the structure, it was hard to even walk with so little light. \n\nThen, he heard it. The ticking. It was faint, barely enough to hear with a focused mind. He tried to make his way towards it, gingerly stepping over boxes as he went. \n\nClang. Metal. Konrad looked down as to what his foot had just banged on. It was covered in some sort of cloth. Removing it revealed a radiation sign... and then peeling off the veil revealed an object, cylindrical in shape. \n\nAs time froze, Konrad could barely bring himself to stay standing. It was... the impossible. \n\n"Oh god..." He muttered. \n\n"
 OMS_Warprep.16.a:0 "A shame it did not explode"
 
 OMS_unification_war.1.t:0 "Baubles and Trinkets"
 OMS_unification_war.1.desc:0 "The disgusting symbols of Nazis are what they were. Baubles, flags, and other assorted items were strewn along the side of the road. The Black League had crushed these men like the vermin they were. They were Nazi worshipers, whether they believed themselves distinct or not. Anyone who called himself an Aryan wasn't worth a second thought as you crushed their head beneath your boot, painting the snow with their brain. Ivan smirked as he looked over the baubles, swinging his rifle over his shoulder. "Come over, boys. Let's take a look!" He shouted to his comrades.\n\nThere were pins which were meant to be attached to lapels, as well as drawings of vikings swinging their swords at monsters and creatures. These degenerates probably truly believed that this shit was real. "Take a look at this one," Ivan said as he picked up one of the drawings and showed it to one of his fellow soldiers. "You think whoever owned this one thought he would swing his Aryan sword at us and cast us into the pits of hell?"\n\n"Who knows what the hell they thought. They're dead, that's what's important." The soldier replied, kicking some dirt and snow onto the collection. "This should all be burned before someone reads it and their mind is poisoned by these degenerates." In reply, the other soldiers laughed, a rolling laughter that left some of them on their hands and knees against the dirt road.\n\n"You," Ivan replied through laughs, "put far too much power into these degenerates' words. Who in their right minds would follow fanatics like these?" He patted the soldier on his back, before rounding up his men and continuing down the road.\n\nThey were close to the next village and as they approached, they could see a fire burning in the center of the village. On closer examination, there was a viking-like statue carved out of wood in the center of the village. It wasn't very well made; clearly created by peasantry. But around the statue, wood was stacked up and set aflame. And around the flaming wood were the residents of this village, all laying in red snow, dead. Their throats were cut, and each of them held a knife. Nothing was left alive in the village except the ravens cawing on the rooftops."
 OMS_unification_war.1.a:0 "Even a fanatic's words hold sway."

 OMS_unification_war.2.t:0 "The Prototype"
 OMS_unification_war.2.desc:0 "Chains rattling. Fires burning. Hunger, thirst, sadness, death. This is the scene that Dmitry Yazov bore witness to upon a tour of the camps set up in the wake of the defeat of the “Aryan” Brotherhood. After stepping out of his car, Yazov locked eyes with a young man, emaciated and near-death, faintly looking onto him with a look of disgust and hatred. Looking at him for a moment, Yazov entered the small barbed-wire enclosure that houses these degenerate souls. Looking over upon these starving, dirty, and broken men, Yazov feels a mixture of contempt and regret. These animals, who enslaved innocent Russians, who slaughtered without thought, and who were fully convinced that this would bring them salvation, were now brought down to their knees, and silently begging for any kind of mercy to come to them. These thoughts only entered Yazov’s head for a moment, however, as soon he would be greeted by the Administrative team running the camp.\n\n“I trust you had a safe Journey in, sir?” said one of the younger Administrators, with a tinge of intimidation in his voice.\n\n“Can I trust that these traitors to the Russian people are being taken care of?” Said Yazov, aggressively.\n\n“This filth? They are giving us an hour of work for every single Russian child who never saw their father again!” said one of the more senior administration members “They will all redeem themselves through blood, sir. In due time.”\n\nYazov glanced around the room and then back at the man speaking to him. “Very well. These animals, wishing to purge all who do not bear loyalty to their hooked cross. But these men are not the issues, my friends. They are simply side-effects of a much larger phenomenon, and soon, very soon, all of those who wish ill upon the Russian state will find them paying a very large debt back to the motherland!\n\n"
 OMS_unification_war.2.a:0 "These men have hell to pay."

 OMS_unification_war.3.t:0 "The Last Will"
 OMS_unification_war.3.desc:0 "The room rattled ferociously as the lights continued to flicker, growing dimmer with each passing moment. Despite the layers of concrete and steel, the horrors that lay on the surface could never truly be masked. Georgy Zhukov, Marshal of the ever shrinking Soviet Union, grasped his aging microphone, both to steady its rusty frame and his frail body.\n\nHe looked up. Where once secretaries, staff, comrades had stood, now there was only silence. It seemed he alone would tend to the worker's flame in its darkest hour. He looked down. His hastily prepared speech was more akin to the stumbling of a dying spider than the words of a great statesman, but it would serve him nonetheless. As the room at last grew still, the Marshal began his final, but perhaps his most important, oration...\n\n"Soldiers and citizens, friends and foes, masters and serfs, I come to you bearing the hopes and fears of myself and my nation alike. Despite the heights we have risen to, despite the enemies we have destroyed, despite the continuing temerity of our people, our banner will not fly forever. The Dark forces of the Black League have overwhelmed our nascent union and again killed the flower of our country's youth. This will be my final address.\n\nBut peoples' of the world! Do not despair! Our cause may be over, but there is hope for you still. The insidious Yazov wishes to open his own version of Pandora's box. Chemical, biological, nuclear, they will destroy everyone they deem their enemy, no matter their creed or character. They will take the world with them, too.\n\nIf they are allowed to conquer and exploit unabated, humanity as a concept will end. I beg of everyone listening, suspend your petty divisions, and unite against this tidal wave of horrors. I beg of everyone, there can be no despondence or delay, I beg-"\n\n"Get on the ground. Now!"\n\n" As the once empty room filled with masked soldiers, Grigory Zhukov, the Black League's newest prisoner, collapsed to the floor. But pain did not forsake him, for despite his age, his flaws, and his failures, he had done today what he had set out to do.\n\nHe simply hoped that the world had heard."
 OMS_unification_war.3.a:0 "Another voice silenced."

 OMS_unification_war.4.t:0 "The Siege of Arkangelsk"
 OMS_unification_war.4.desc:0 "The tension in the command bunker was oppressive. All of the senior generals of the Red Army stood around a large table with a map depicting the city of Arkangelsk. Small black figurines were placed on the map in a semicircle ring from coast to coast, leaving no doubt that the city was surrounded. Tukhachevsky stared at those black figurines, his scowl deepening with each passing moment as he was forced to acknowledge just how bad things had become.\n\n"Perhaps, Grand Marshal, it might be time to consider escape..." One of the younger generals finally spoke up. Tukhachevsky looked over to him, but said nothing. He took this to mean that he may continue, and so he explained, "There is still the coastline, which we have control over. We could organize a retreat across the White Sea and into Finland, and from there into Sweden."\n\n"The Finns would love to get their hands on some reds," Another general said. "We'll have to be careful when we move through their territory. Does anyone here know Finnish?"\n\n"No." Tukhachevsky interrupted this talk of retreat. His eyes were still locked on the young general's face. The man's hair was still full of color, and his face only showed the beginning wrinkles of age and decay. This supposed soldier thought that his youth gave him the privilege of living longer. He seemed to forget... no, all of them had forgotten what it means to be fighting men. They were soldiers, and they would not abandon their posts. Not under his command.\n\n"You are all cowards." Tukhachevsky spoke calmly, his anger simmering just beneath the surface. "You propose to run like frightened children across the frozen wastes and leave the Russian people to toil under that madman's control? Are you not Communists? You are the Red fucking Army! We will fight them in every alleyway and across every street corner until this city is laid to rubble and then we shall fight them over the scraps that remain. And we will win. I don't want to hear any more talk of surrender. If Yazov wants to take Arkangelsk, he'll have to kill every last one of us"
 OMS_unification_war.4.a:0 "The Red Napoleon gives his last speech."

 OMS_unification_war.5.t:0 "Memorandum No. 4, 568"
 OMS_unification_war.5.desc:0 "[Change Later]"From the desk of Glavkoverkh Dmitri Timofeyevich Yazov, leader of our nation and follower of our founder Dmitry Karbyshev:\n\nToday, I write with a sense of satisfaction. Our operation to bring the impotent and disunited opponents of our rightful mission was quick, clean, and showed neither hesitancy nor mercy. Every single man who has marched west in these recent months has done their job dutifully, and they have done it well. I congratulate every one of you.\n\nHowever, I believe that this recent victory may serve as a good point of reflection as to the righteousness of both our goals and the way in which we achieve them. Suppose that, every time us men of battle wished to conduct a maneuver, complete a task, instruct an individual, everyone, no matter their rank or their relevance, had to be consulted. Imagine, if you will, that every single decision made had to be checked, authorized, reauthorized, and passed through a myriad of near infinite bureaucracy. How then, would our operation have gone. Would it have been quick, clean, and merciless?\n\nEvery man who has so much as picked up a rifle thus knows the folly that is democracy. Every man who has so much as worked in a team knows that cohesion, competence, and decisiveness is reliant on resolute action, ascribed from men who have earned elevated rank, and followed without question by those beneath them. Every man today now knows why our Black League operates the way it does.\n\nBut do not grow feeble and meek. The treacherous Teutons know of this too, for they have abandoned the feebleness of democracy just as we have done the same. When we march west once more, they will not be as forgiving.\n\nWhether all of you rise to the challenge remains to be seen."
 OMS_unification_war.5.a:0 "Signed, Dmitry Yazov."

 OMS_unification_war.6.t:0 "Simple Arithmetic"
 OMS_unification_war.6.desc:0 "Name: Igor Shafarevich\n\nOccupation: President of the Russian Republic.\n\nPrevious Occupations: Mathematics Professor, Writer, Radio Talk Show Host, Political Dissident.\n\nStatus: HVT-1099-A surrendered peacefully with the occupation of Syktyvkar and Vyatka. Signed terms of conditional surrender. Currently in custody and awaiting trial-\n\n"A mathematician?" Yazov crumpled the paper and tossed it into the trash. "What an absurdity."\n\nHe stood and looked out of the snow-flecked window that adjoined his office. What a  joke. The people of Russia elected a mathematician and allowed him to create a state calling itself a 'republic'. A 'democracy'. A system of snakes. A system of inefficiency, mistreatment, and deception. A weak, degenerate system.\n\nYazov looked into the training ground outside his office. There, newly commissioned officers were undergoing physical and mental conditioning — the same training their subordinates had already survived. The Black League would not permit the unworthy to lead the strong. No. The comrades of the League would lift their subordinates by their iron wills, and the enlisted would lift  their leaders by their obedience.\n\nNot so, in a democracy. Yazov's men had already lifted the curtain. Anti-semitism, bribery, and corruption were rife in Shafarevich's fief. More commonly, representatives simply ignored what they'd campaigned on to suck at the teat of graft. An unacceptable division in a time of civilizational struggle. No, the Russians who suffered Shafarevich's inferior vision were not free. Once again, the Black League marched as liberators. Once again, they brought freedom.\n\n"Freedom," Yazov whispered. "Freedom is ... " He struggled to find the words. Not from a piece of paper, he knew, not from the childish whims of a parliament. Not from the civilized rituals of legislation. "Freedom is strength. Strength is freedom."\n\nAnd thus, he realized, the Black League is freedom."
 OMS_unification_war.6.a:0 "No mathematician can calculate their fall."

 OMS_unification_war.7.t:0 "Death Call Of the Steppes"
 OMS_unification_war.7.desc:0 "Glavkoverkh Yazov entered the vacant Passionarity congress hall. It reeked of gin and dried urine. A caustic taste tingled on the tip of his tongue. "You found the hall in this manner, Private?"\n\nPrivate Artemyev nodded. "Sir, yes sir. We eliminated the Eurasian milita sent to defend the hall three clicks from the building." The Private smiled, excitement creeping into his voice. "Ambushed them, sir. They weren't ready for us."\n\n"You have nothing to be proud of, Private." Yazov ran a finger over a wooden banister. Dust. "Look around you. Look at these cave paintings. Look at the standard our enemies held themselves to. This room speaks to me of ineptitude, and cultural insignificance."\n\nThe Private began to sweat. "I apologize, sir."\n\n"We do not permit ourselves self-aggrandizement, soldier." Yazov shook his head. "Our enemies debased themselves, physically and ideologically. Their thoughts were born of an artificial rationale, not rooted in tradition or actual culture but instead a false preconception of history. Lev Gumilyev -" a vein bulged on Yazov's forehead " — sought to erase Russia's cultural reality, and reorganize our people into a mindless horde. The same horde, mind you, that raped and pillaged our nation centuries ago. They were nothing more than barbarians. And this was nothing more than pest control."\n\nPrivate Artemyev stood as still as stone. The wooden floor creaked beneath their feet.\n\nYazov raised his head to the rafters. "I would not be proud of shooting rats, Private. I advise you to keep your attention on duty." He raised an eyebrow. "Now, please light this garbage on fire."[Change Later]"
 OMS_unification_war.7.a:0 "Passion alone could not save them."

 OMS_unification_war.8.t:0 "Last Stand of Madness"
 OMS_unification_war.8.desc:0 "An RPG soared through the sky and exploded in a fireball against Taboritsky's grand palace. The fine marble and gold inlays were ruined from three days of heavy gunfire. The Black League fired from all directions, unleashing a hailstorm of brass and the mighty thunder of cannons. The defenders knelt in trenches, their cover whittling away, praying that God would intervene and save the Holy Regent.\n\nThe League's soldiers saw an opening, and squads flooded the palace grounds. Fervent guards stood their ground, some felled by a single bullet, others taking a few more. Afterwards, a handful of attackers swore they saw a man with ragged hair and bloodshot eyes stand up even after a round pierced his lung.\n\nThe agonizing slog of claiming the compound section by section took the rest of the afternoon. Every corridor, every room, every hall was trapped, every corner held an ambush. When Taboritsky's men ran out of ammunition, they turned to knives and blood streaked fists.\n\nBy the end of the day, the League claimed five hundred and eighty six scalps. The few who were captured refused to repent their allegiance. They showed no regret, and died believing in their own righteousness. But of the many, many corpses, none belonged to Taboritsky. The League's men double-checked, triple-checked, and, with the guiding hand of the Interrogation Cadres, quadruple checked. Their conclusion remained the same: Regent Taboritsky had escaped.\n\nThe League's leadership ground its teeth and wailed its anger. Orders were given, subordinates punished. But they could not overawe the joy in the hearts of soldiers and civilians alike as the disgraceful flag of the Holy Russian Empire lowered from its pole. Taboritsky's twisted vision for Russia was grounded into dust, here, forever."
 OMS_unification_war.8.a:0 "Sic Semper Tyrannis."

 OMS_unification_war.9.t:0 "Memorandum No. 45,862"
 OMS_unification_war.9.desc:0 "From the desk of Glacoverk Dimitry Timofeyevich Yazov, leader of our nation and follower of our founder Karbyshev:\n\nI congratulate all of you Russians who have participated in this great pacification operation of the tyrannical dictator Ivan Serov. As many of you know, and as much as that mentally ill troglodyte has tried to establish, Ordosocialism is dead.\n\nHis ideals of Fascist Communism is fundamentally a broken system. Many years ago, when the Black League broke from the yolk of the West Siberian Socialist Republic, Karbyshev and now I made a promise to never submit to the opiates of Communism and Bukharanist thought. That the ideals of Marx, Lenin, and all other socialist revolutionaries have done nothing to truly help people. They have led the Russian people astray.\n\nWas it not that Lenin was sent on a train from Switzerland to the old Monarchy due to the German menace? And was it not that Marx and Engels were Germans? Clearly these two snakes have had the ability to run rampant throughout all of Russia and Ordosocialism is the final binding of Communism with their Germanic origin. I, personally, am happy that we have aborted this way of thought before it festered within our great nation long enough.\n\nThe only saving grace that this unredeemable man has accomplished within his borders of Western Russia was his industrial programs. He has turned the nation into a factory, albeit one of fear and hate. We shall begin using these facilities to create better weapons of war in order to fully blot out the German cloud.\n\nThank you."
 OMS_unification_war.9.a:0 "Signed, Dmitry Yazov."

 OMS_unification_war.10.t:0 "Recursive Failures"
 OMS_unification_war.10.desc:0 "Yazov looked at the plethora of military reports on his desk, this was it. Victory in Western Russia had been achieved, the resilient and loyal soldiers of the Black League had marched across the Urals and swiftly crushed any resistance. He put down the pile of papers, before slumping over in his chair.\n\nThe Soviet Union was gone; left shattered by the Germanic marauders in the First Trial. The deceitful, incompetent ways of Bukharin cascading Russa into chaos. Yazov thought of his time fighting on the Eastern Front, forced to retreat beyond the A-A line, humiliated by the Union's failures. Oh, the young Soviet Union was his homeland, one he was supposed to defend and feel a sense of patriotism for, but seeing Bukharin's failures first hand, it shed a light on its shortcomings. In what was the tragedy of what was the fall of the U.S.S.R, something could be salvaged: information. If the Black League ever needed to survive, it needed the knowledge of how to avoid the faults of the Union.\n\nBut Yazov knew that knowledge was a fickle thing, some people were stubborn enough to deliberately copy the mistakes of the past, and Bukharina was no exception. She was like a caricature of her father, showing the worst parts of him. All this talk of "Marxist dialectics", "the proletariat", but how does this serve the Russian people beyond pseudo-intellectual discussion? The Soviet Union was gone, and Bukharina's death cemented it."
 OMS_unification_war.10.a:0 "The hydra pervading Russia has been slayed."

 OMS_unification_war.11.t:0 "MEMORANDUM 93: Communist Ideology"
 OMS_unification_war.11.desc:0 "From the desk of Glavkoverkh Dmitry Timofeyevich Yazov, leader of our nation and follower of our founder Dmitry Karbyshev:\n\nI write having just been informed of the unconditional surrender of the treacherous communist government of Mikhail Suslov. I would like to take this opportunity to reflect on communism and its effects on our nation.\n\nI was once a communist. Communism and its proponents have long held admirable goals for Russia. It saved us from complete destruction following the civil war, and brought some measure of economic strength to our nation. I grew up in Bukharin’s Russia, and I joined Bukharin’s Red Army in 1941 to fight the Teutonic menace. Later, I joined the Revolutionary Front and took up arms once again in the West Russian War. Throughout this time, I believed in communism, and its vision of a truly strong and prosperous Russia.\n\nHowever, I need not remind anyone that both Red Armies I fought in ultimately lost, undermined by petty squabbling and weak idealism of their political leadership. This is where the lofty ideals of Lenin and Bukharin fall apart. They cannot survive the siege that we, the Russian nation, find ourselves under. The Germanic horde cannot be fought with equality, it cannot be fought with dialectics, it cannot even be fought with prosperity. No, the Teutons can only be fought with steel. Violence alone is our defense against the arsenal the Teutons bring against them, of which communism is in fact a component. Need I remind you where Marx, the inventor of this Germanic corruption of the Russian nation, comes from? Need I remind you that Lenin himself was sent here by the Teutons to undermine us in the Great War?\n\nCommunism is not a defense for the Russian nation, nay, it is yet another sword pointed by the Teutons at our heart."
 OMS_unification_war.11.a:0 "Signed, Dmitry Yazov."

 OMS_unification_war.12.t:0 "Report BP-DPL-WQ8"
 OMS_unification_war.12.desc:0 "Identifier: BP-DPL-WQ8\n\nComposer: BLP-NV-3\n\nClassification: 2A+\n\nConcerning: Salvage of People's Commissariat of Science\n\nBackground: Following capitulation of Soviet Federation, Scientific Cadre 112685 ordered to amass, investigate, and identify useful research and 'blue sky' technologies developed by the People's Commissariat of Science. Interrogation Cadre 356707 ordered to interrogate surviving Federation personnel to accomplish this objective.\n\nFindings: Ninety-five percent of technologies recorded in People's Commissariat archives classified by 112685 as Class Zero (Not Recommended for Further Inquiry). Further three percent classified as Class One (Potential Civilian Applications) and two percent classified as Class Two (Potential Military Applications). Personnel note that scientific research in the Federation was driven by political concerns and as a method of personal aggrandisement rather than potential use cases. Additionally, personnel note possible logistics concerns with technologies in Class Two category, as many will require heavy industrial investment to be produced at a significant scale.\n\nOne item noted as Class Three (Immediate Military Applications). Project CHEREPAKHA is a long distance, supersonic bomber. Existing data and blueprints indicate measurable superiority over current Black League air assets in both speed, resilience, and air power. Further information in Appendix A-74-SSI (attached).\n\nOne item noted as Class Four (Immediate and Significant Military Applications). Project CHERENKOV is a re-engineered medium tank design involving a number of design superiorities including mobility over rough terrain, decreased reload time, and armor plating designed to minimize the effects of radiation exposure to crew. Recommend immediate production of test models and exercises using CHERENKOV models within twelve months."
 OMS_unification_war.12.a:0 "[Change Later]"Recommendations accepted."[Change Later]"

 OMS_unification_war.13.t:0 "[Change Later]"MEMORANDUM 884: Monarchist Collaborationism"[Change Later]"
 OMS_unification_war.13.desc:0 "[Change Later]"Comrade soldiers! We celebrate together as we rip the collaborationist parasite from our lands. The Sovereignty of Western Russia is no more. Our victory is evidence of our superiority and our righteousness. Indeed, it is the only evidence a soldier needs.\n\nIt has not escaped the soldiers who conquered the Tsar's palace that he lived in splendor while his people scraped in poverty. Monarchism is, by its nature, corrupt. By empowering men of weak bodies and corrupt minds for their bloodline, it ensures only that the nation is led by bandits, the vainglorious, and the self-obsessed. Comrade soldiers, there is only one bloodline which matters: the bloodline of Russia!\n\nMonarchism is a yearning for the past. It denies, even despises the present, searching ever backwards for the image of power and respect. But we know that respect comes to those who earn it, and power comes not from symbols but from action.\n\nOur Russia is a land of merit. Where the strong shall lead, and become stronger for it. Where strength of body, strength of mind, and strength of will define your duties, and your rewards. Our Russia is led by men of humble beginnings. The League is made up of diligent men of firm character, not those empowered by an accident of birth. Our Russia is a land of the present, neither indulging in fancies of the future nor denying the sorrows of the past. Our eyes are fixed on the here and now, upon duty, and upon the actions we must take to leave the precipice of annihilation.\n\nWe who have conquered the present have overturned those who obsess over the past. There is only today. There is only duty."[Change Later]"
 OMS_unification_war.13.a:0 "[Change Later]"And only in death does duty end."[Change Later]"

 OMS_unification_war.14.t:0 "The Traitor's Call"
 OMS_unification_war.14.desc:0 "This had to work. There were no other options left for Bunyachenko. The League had beaten him time and again. They had driven his people from the Ural Mountains. They had driven them back to the Kama River, and they had driven them back until the only thing behind his men was the Reichskomissarat. At every engagement, the League had shown more fortitude and more cunning. They were like a steel blade cutting through his men in one clean sweep. But he would never back down or surrender. Not to them. Not to any man. He would save Russia from itself.\n\n"Men," Bunyachenko began to speak as he paced before a few dozen soldiers, the last remnants of his army. "On the other side of this hill is the bulk of the League's army. They're tired from fighting us. They have had to travel over hundreds of miles of our land. And they have butchered everything in sight. They have laid waste to your villages, your cities, and your families. Your wives and and children may have even died at the hands of one of those monsters on the other side of that hill. And did they shed a tear for any of them? Did any of them show an ounce of mercy for the many they've killed? No.\n\n"Let's show them what they deserve. They want to cleanse Russia of its filth? I agree. They want to purify Russia, so that it can stand strong once again as a mighty power? I couldn't agree more. And in our shared mission to free Russia of degeneracy, I say we start with the men in black over these fucking hills!"\n\nHe raised his rifle to the cheers of his men, all their eyes looking up to him with inspiration, young and old. Perhaps they could still do this. Perhaps they could pull victory from the jaws of defeat. Who knew? Yazov himself could be standing at the head of the army, and this charge might make it far enough to kill him, and leave the black snake leaderless as it eats itself from within. So many possibilities ran through Bunyachenko's mind as he turned, and charged over the hill. On the other side were hundreds of League soldiers waiting for them. And the moment enough of them had charged over the ridge, they opened fire and let their bullets spray into the bodies of Bunyachenko and his men."
 OMS_unification_war.14.a:0 "No mercy for traitors."

 OMS_unification_war.15.t:0 "The Negotiating Table"
 OMS_unification_war.15.desc:0 "There must have been twenty of them. They wore black uniforms and peaked caps, each patched and repaired with scraps of the same ink colored cloth. Each of them was armed even beyond what was expected of an ROA soldier- machineguns, pistols, agglomerations of miscellaneous ammunition, knives and trunchions dangled from overful waists and bent backs. Zykov trembled whenever one grew near. He'd rather be anywhere but sitting at this dusty banquet tablel; but it was here, or a gallows.\n\nThe floor creaked as General Sakharovsky, the League's representative in these negotiations, sat down. He slid his bony hand onto the back of  Zykov's neck. "Now then, Mister President," the smirking officer said, "Let's get down to business. Your armies are decimated, and good Russians are fleeing for their lives. The League is more than happy to slaughter the surviving ROA formations in Gorky and Vologda." The General's grip tightened. "But I believe that cooler heads can prevail. I believe that, should you concede to total annexation and order the survivors of your military to stand down, the League may be inclined to commute your sentence to life imprisonment."\n\nZykov’s heart sank. "Gentlemen, Gentlemen," he said, desperately glancing around the room for an ally. The League's soldiers were cold, not ever glaring in anger as he pleaded. "We are civilized men here! There's no need to leave an experienced propagandist like me to rot. Surely we can work something out."\n\nSakhavorsky clicked his tongue. "Corporal Ivanova, could you forge the President's signature?"\n\nOne of the soldiers nodded. "Yes, sir. With enough time."\n\nThe General smiled. "Well, it seems we don't need you after all, President Aleksandrovich. It has been a pleasure."\n\nBefore Zykov could respond, two men with Titanium grips grabbed him by the shoulders and pulled him from the table. He wanted to scream, he wanted to make a desperate plea, to beg for his life. In the end, all that escaped his mouth was a terrified wail."
 OMS_unification_war.15.a:0 "All ROA soldiers are hereby ordered to immediately surrender. Signed, President Meletios Aleksandrovich Zykov."

 OMS_unification_war.16.t:0 "The Great Scam Ends"
 OMS_unification_war.16.desc:0 "The bottom of the vodka bottle never looked more beautiful. Or perhaps it was simply the fact that Oktan couldn't see it very well, with his hand swaying this way and that, and his eyes only able to make out vague shapes swimming across his vision. He still had to finish the last bit of it, though. Couldn't very well let it go to waste. So he turned the bottle over his cup, pouring out the last of it before tossing the bottle aside and letting it shatter against the hardwood of his office. He took hold of his glass, leaned back, and shot the drink down his throat, before throwing the glass over to join the bottle as shards across the floor.\n\nHe could have lived like a king. He had been using the Germans like marionettes, and they were singing to his tune just as he'd wanted. The whole of Russia could have been his domain with their help, and he could have taken whatever he fucking wanted from whoever he fucking wanted. But no. Yazov and his band of radicals had to storm across the Urals and beat back his army. What fucking use is an army if they can't defend some god damn mountains?\n\nOktan looked back to his desk, eyes locked on a German Luger lying on top. He reached over and took hold of it, twirling it between his fingers lazily. Perhaps he could run away with what he could carry, and live it rich in the Caribbean or South America. Somewhere tropical. But he could hear gunshots approaching from outside. He couldn't run, not anymore; Yazov's men were far too close. He wouldn't make it ten miles. No, there was nothing he could do.\n\nHe pressed the barrel against the underside of his chin, feeling the coolness of the metal spreading across his skin. He had no illusions about some supposed afterlife; once the trigger was pulled, darkness would be Oktan's eternal companion. All of the money that he's amassed won't matter. It'll all be used to fuel Yazov's war machine. The glory of leading West Russia would be swept away to the dustbin of history. Oktan would be a footnote, and nothing more. Yes, darkness was all he had left before him. He let his finger squeeze down on the trigger as he painted the wall with his head."
 OMS_unification_war.16.a:0 "The German puppet falls."

 OMS_unification_war.17.t:0 "All is Lost"
 OMS_unification_war.17.desc:0 "The city was burning. The air was choked with ash and smoke and embers, scraps of a dream deferred that drifted on the wind like fireflies. Private Koslov held his left arm over his face, hoping to ward the sting from his watering eyes. He failed. The young man, barely sixteen, stumbled over wood and rubble, his Kalashnikov clutched by the cold barrel.\n\nIn the distance, he could hear screaming. The invaders were growling, roaring their hate like animals. They had slipped past language into the primordial. Beneath their shouts, he could hear civilians — women — begging for mercy. Their speech was crushed under the hammerfall of gunshots.\n\nKoslov's bowels ran cold. The stripling broke out in a sweat as he scrabbled through chalk and fallen beams, forcing himself forward on his hands and knees. He had to escape. He had to get away from this nightmare, retreat, live to fight another day -\n\n"Help me." A phantom's moan drifted on the burning wind.  "Please... help me."\n\nKoslov wiped the tears and smoke from his eyes. Everything around him was an indistinguishable ruin, the same pattern of broken concrete and toppled walls. Without thinking, the words slipped from his mouth. "W-where-" He cleared his throat, spitting black phlegm into the dust. "Where are you?"\n\nA scraping sound came from his left, and Koslov saw him. He was a man, or the remnants of one. The soldier was middle aged, balding, with a curly grey beard and the patch of the Utopian salon's militia sewn onto the breast pocket of his uniform. And his legs had been crushed by a falling beam. An arm dangled by the man's side, useless.\n\nKoslov knew what the soldier wanted before he even spoke. Mercy. A reprieve from the animals that hunted Tomsk's ruins. But the League was close, and growing closer by the second. He could feel their breath on his neck...\n\n"I'm sorry." The boy turned as the soldier wailed in horror, and sprinted for the city's outskirts. For survival, and shame."
 OMS_unification_war.17.a:0 "Pragmatism — another word for cowardice."

 OMS_unification_war.18.t:0 "A Struggle Forgotten"
 OMS_unification_war.18.desc:0 "The building had since been cleared of any sort of hostile presence, and been swept for mines and traps. Though Pavel still lingered, this previously being an administrative center, perhaps there could be something interesting here. Be it actually useful intelligence, or just simple curiosity, trivia and the like. He stubbed his cigarette out on the windowsill, and flicked it into the cold evening air before turning back to the dilapidated hallway he was in. Something at the far end caught his eye, though.\n\nA records room, perhaps something worth his time could be found there? He wandered in, the room lined floor to ceiling with filing cabinets, some torn from the walls, their contents flung all about. On a large and long table in the middle of the room where the pencil pushers likely did their tiresome work, sat a file marked in red which caught his eye. “ARREST RECORDS 1962-64” it practically screamed. He picked it up and flipped it open a few pages in.\n\nNames, many many names. Accompanied by a brief description of their crime as well as a sentence. The document was rather thick, there could easily be over a thousand names in this record. Not to speak of other such records like this one. While idly scanning over it, something caused him to raise an eyebrow. “Valery Mikhailovich Sablin” it read “Rebellion against the state. Mutiny. Sedition. Sentence: Execution, firing squad” it stated bluntly.\n\nWith a dry laugh, and an overarm throw into a waste paper bin on the far side of the room, the document hit its mark with a dry thump. Making his way out, he struck a match and ignited another cigarette, meeting a pair of other officers who’d been lingering on the steps outside the building.\n\n“Find anything interesting?” one of them asked disinterestedly, tobacco smoke clouding the air around them.\n\n“Not really” Pavel replied, leaning on the doorframe. “Arrest and sentence records mostly, building's shot to shit. Would be more trouble than it's worth to get it back to working order” he continued, taking a long drag.\n\n"might be able to recycle some materials from in there, wiring might still be good” his comrade suggested\n\nPavel tilted his head, considering this “I’ll get in contact with command, strip out anything useful and demolish the rest” he said with finality."
 OMS_unification_war.18.a:0 "To the dustbin of history."

 OMS_unification_war.19.t:0 "Cold Comfort"
 OMS_unification_war.19.desc:0 "Igor had seen much in his time, born at the turn of the century and long before all the triumphs and tragedies that had ensued. He sat back in an old armchair while the fire crackled close by, leaning his head back as a feeling of nostalgia bit at him and he began to reminisce.\n\nThe first pictures to run through his mind were of the revolution which put the Bolsheviks in power. He was only a young man at the time, still living in Angarsk, so the revolution was well underway by the time news reached him. While he worked in a workshop at the time, all he had heard from friends and colleagues was of the revolution. Igor had been concerned that a new government would be no better than the old one.\n\nThe turmoil didn’t end there; various names vied for power, with Bukharin eventually coming out on top after Stalin's death. But that wasn’t the end of it. The Great Patriotic War would prove trying for everyone. Igor was shocked when news that Moscow had fallen filtered through. He had worked long and exhausting hours in a factory, likely inducing his current arthritis and it had all been for nothing. \n\nAfter that, the union which had seemed so very invincible shattered like a stone through a glass panel. Igor felt as though a trapdoor had opened beneath him, his mind spun with uncertainty as warlords sprung up across the broken nation. When his arthritis rendered him unable to work, he thankfully had family to move in with in the face of the whirlwinds of danger racing around him.\n\nDespite bravado about scattering the Black League, the opposite had taken place, and now the League’s troops paraded through Irkutsk. But, if the Black League had picked up the pieces of a shattered nation, perhaps they could be strong enough to one day face the Reich? One could only hope. And these days, a single hope is enough to sustain you like a log in a fire."
 OMS_unification_war.19.a:0 "The cold kept at bay."

 OMS_unification_war.20.t:0 "Broken, But Not Shattered"
 OMS_unification_war.20.desc:0 "Tank 237, was wandering around Siberian villages for nearly the whole afternoon, tasked with advanced reconnaissance to investigate rumors of Sablinite resistance following their government's capitulation. All of the villages they passed, from farming hamlets to town hubs were vacant, not a single soul was seen.  Abandoned buildings and town squares were devoid of life, with the occasional dead farm animal being feasted upon by wolves or crows. It was uncannily quiet, with the break in silence coming from the embers of a burning barn. Eventually, the crew of 237 stopped, their fuel had begun to run out. Luckily their logistics convoy was just a short distance behind and was coming to help refuel. The tank commander, Nevsky, climbed out and pulled out one of his cigars before lighting it. The fire from the stub tickling his cheekbones with comforting albeit brief warmth. He looked around, Nevsky assumed that the population fled in the face of their advance.\n\nThe fuel truck arrived and began refilling 237’s tank. It took a while but eventually  they were good to go, that was before a loud whistle and a house next to the tank exploded. Coming from the dense tree line in front of Tank 237, a rocket was fired, which was followed by a crescendo of bullets coming from the same direction. The small Black League convoy went into disarray. Everyone expected that the Sablinite army was scattered. They were wrong, it was there, and still had some fight in it. Finally, the main turret of the tank started to return fire. It was unclear how long the battle would last, but it was clear that blood would have to be shed."
 OMS_unification_war.20.a:0 "The last followers of Lenin, raging against the dying of the light."

 OMS_unification_war.21.t:0 "We Dared to hope"
 OMS_unification_war.21.desc:0 "It was a new morning in Bada, Pavlov, the mayor, entered the town hall like any other day. The war with the black league passed them, and the fate of Sablin's Nation is unknown. But they were sure to have some rough months, maybe years from now on. Everyone greeted Pavlov as he moved with his briefcase up the stairs. The heating and lights were cut off the grid so they had to use generators. He eventually made it to the front of his office and opened the door. He placed his briefcase next to his desk as he laid back to catch his breath before a long day of work. He looked at his desk and saw an envelope. He opened it to see in big and red colors the word, NOTICE, reading it was the black league informing him about his town being on his territory now and that all orders are to be obeyed.\n\nHe breathed a sigh of relief. At least it didn't mean he would get shot. He eventually put the envelope to his side and began working. Yet, it wouldn't last. At around noon he heard something outside. After looking outside his window he saw a truck with a jeep in front of it parking in front of the town hall. He jumped out of his chair to investigate while passing all of his worried staff. As soon as he came outside an Officer stopped him with his palm pointing towards him.\n\n"Under the Order of the Black League, you are to follow us."\n\nBefore he could respond one of the soldiers viciously grabbed both of his hands and placed them behind his head, while the others entered to look for his staff. He was led behind the Town Hall and placed on his knees. It was freezing. The officer lit up a cigarette behind him, after the officer saw him looking at him, he looked to see if the others were back, but they weren't, he was quick to place a cigarette in his mouth and lit it up while quickly returning to his position. After around 10 minutes the building was clear. His staff were all standing with their heads to the wall. They didn't say a word. Pavlov didn't say a word.\n\n"PREPARE!" The Officer shouted as the men loaded their rifles.\n\n"PRESENT!" The Staff were all panicking as Pavlov's secretary began crying. Yet he didn't panic, and he didn't cry, it was over, and the only way to accept it was by accepting what was going to happen. In his last moments, he thought of the officer who allowed him one last smoke."
 OMS_unification_war.21.a:0 "[Change Later]"FIRE!"[Change Later]"

 OMS_unification_war.22.t:0 "Guilty after Guilty"
 OMS_unification_war.22.desc:0 "The war was over. Whatever was left of the Amur government was in Black League hands. Igor woke up as always, washed his face, got his uniform, and left the barracks just to see that he had the honor of guarding a tribunal of blackshirts. After being driven in a truck with his comrades they arrived in front of the courthouse.  Igor stood straight with his rifle for around an hour, it was surprisingly warm inside the courtroom of all places. For at least half an hour he had seen at least four black shirts already guilty and sentenced to be shot. One of them didn't even have time to say anything. He didn't exactly understand why the court was even in session if every defendant was sentenced to death almost instantly. Perhaps for propaganda.\n\nTwo hours passed as more blackshirts were tried, all of them guilty and sentenced to death for treason. Yet one seemed to be more aggressive than his other ilk. He was trying to push the two guards carrying him away while shouting slurs and calling everyone "Jewish pigs". The two guards eventually forced him to sit down. The judge attempted to talk only for him to shout again at each attempt. A bailiff eventually got tired, pulled out his pistol, and without hesitation pulled the trigger behind his head. His head fell flat on the table and his body simply carried away shortly after. When the next defendant came in he was visibly disturbed by the fresh blood stain that tainted the wood covered desk, continuously looking behind him to check if he was going to meet his end on the chair as well.\n\nIt eventually ended after ten painful hours and Igor was soon on the truck heading back to his apartment. It was exhausting to just stand up, but the extra rations were worth it. While Igor was sitting on his bed his partner on the bed next to him asked how his day was. Igor simply looked at her and sighed."
 OMS_unification_war.22.a:0 "[Change Later]"Exhausting."[Change Later]"

 OMS_unification_war.23.t:0 "The Merchants of Death, Outsold"
 OMS_unification_war.23.desc:0 "In an unmarked room, in an unincorporated town, on the outskirts of Magadan, two men who weren't in Russia, along with one who most certainly was, sat down to have a meeting that never happened to discuss a state that never was.\n\n"Alexander Lazarenko, I take it? We, uh, assure you that the United States of America had nothing to do with the deranged misadventures of that madman Werbell. Rather, we seek to ensure continued diplomatic ties with-"\n\n"-You Americans are too damn sloppy."\n\n"Excuse me?"\n\n"You prop up an illegal puppet state on Russian soil, and upon its inevitable destruction act as if you had no hand in it. I know your game, and I have to say you're terrible at playing it."\n\n"I apologize, Mr. Lazarenko, but there seems to have been a misunderstanding. The CIA would not back foreign dictators and warlords, nor would it operate against its allies. We simply ask for this to be cleaned up as nothing more than a minor, inconsequential stain on the clean surface of Russo-American cordiality, and for all CIA operatives and assets in the region to be allowed to be withdrawn. Surely a reasonable government such as yours would be more than amenable to such requests?"\n\nFor a moment, there was silence. Then, the sound of something sliding on the floor.\n\n"Mr. Lazarenko you can't be serious-"\n\n"Leave. And do not return. Let this generosity be the last act of its kind required."[Change Later]"
 OMS_unification_war.23.a:0 "And all that was left was a single, bloodied cap, lying still upon the floor."

 OMS_unification_war.24.t:0 "Where Did We Go Wrong?"
 OMS_unification_war.24.desc:0 "The dripping of water, the bad bed quality, the horrendous smell. Shukshin and Amet-Kahn were already beginning to get used to their new cell. Two small rusty beds with the worst mattress known to mankind, a sink, and a toilet that doesn't work. They were both still in their stained suits, as they were never even given a proper prisoner uniform. They were both staring at the ceiling until Amet-Kahn broke the silence.\n\n"Where did we go wrong?"\n\nShukshin turned his head.\n\n"Did we build too little? Did we prepare too little? Did we hope too little? Did we cause this?"\n\nShukshin would've normally said something to make his friend feel less guilty, but he was facing the reality, that he felt the same guilt as him. The unification wars were quite literally the worst time of his life. His winning against Pokryskin brought him hope, hope that things were finally going to get better. But when more and more reports came in detailing in mass detail how the Black League was seeing victory after victory. It gave him nightmares, and it seemed that the nightmares would become real. He was about to say something but then they heard a voice.\n\n"Amet Khan Sultan, follow us please."\n\nThey both looked up to see men dressed all in black as if he was preparing for a funeral, one was an officer, and the two behind his shoulders were soldiers. Shukshin looked scared but Amet Khan didn't show a single expression, he simply got up and exited the cell, but before he left he turned to Shukshin one last time and said.\n\n"I'll see you soon."\n\nShukshin sat in his cell alone, for hours, or so he assumed was hours, he lost track of time a long time ago. He was tired, but everything in him refused to rest. As things couldn't get worse. A shiver ran down his spine as the same officer came back..\n\n"
 OMS_unification_war.24.a:0 "[Change Later]"Let's get this over with, ‘Mr. President’."[Change Later]"

 OMS_unification_war.25.t:0 "Almost Painless"
 OMS_unification_war.25.desc:0 "It was over, Novosibirsk has fallen. The Black League was advancing daily as the All-Siberian Army could do little to nothing at stopping their advance. What was left was no longer about defense but of evacuating. While the soldiers were fighting, many civilians were fleeing. The Siloviki, once the most influential men in the country, were reduced to a bunch of greedy businessmen getting on whatever that could fly to escape, either to their estates abroad in Japan or America or any country that would accept their money.\n\nA prime example would be Artem Makarov, once sitting on the Sibir board of directors now running alongside his staff toward his private jet. All around the airfield civilians were climbing the fence to get in and on anything that had wings and wheels. Eventually, everyone was seated, the atmosphere tense, and everyone on the plane held their breath as the engines fired up to life. Artem looked out the window to see the turmoil, it was madness, civilians running as whatever security was left could do nothing other than be pushed down and trampled. The plane started moving as the runway began to be clogged with people. The pilot  turned to Artem. \n\n"Sir, it seems that the runway is blocked, we-"\n\n"I don't care! Just take this plane off the ground!"\n\nThe pilot looked at him in disgust but held his tongue as a gunshot broke the silence. A security enforcer was shot as people were rushing towards the plane. The pilot pushed the throttle forward. People ducking mere meters from the wing. Artem looked down, as his heart sank seeing men in black uniforms entering the airport. The ground became smaller and smaller as he finally breathed a sigh of relief. The pilot mimicked Artem.\n\n"Systems are nominal, we will be arriving in-"\n\nAll of a sudden, a loud  beeping emitted from the dashboard of the cockpit. Before anybody could say anything, the whole plane was engulfed in a fireball. It was almost a painless death. Five thousand feet below the fireball, a Black League officer simply said on his radio while standing next to his SAM launcher."
 OMS_unification_war.25.a:0 "[Change Later]"Missile, hit!"[Change Later]"

 OMS_unification_war.26.t:0 "Ashes to Ashes"
 OMS_unification_war.26.desc:0 "At 09:00 in the morning, Black League Troops entered the city of Bratsk situated on the Angara Sea. The City was previously bypassed by League troops on their advance. Reports showed that a sizable number of anarchist resistance has been reported, in response two infantry divisions have been ordered to move in from the north and west to secure the city. At around 10:00 the first serious combat began with orders to use artillery fire. League soldiers faced almost fanatical resistance from the local militia. At 10:30 the east of the city was fully secure with low to no resistance left. The Resistance in the West had seemingly no end with resistance to its fullest. At 12:00, a tank brigade was moved into the city.\n\nAt 13:30, North and South were cut into two, resistance was finally showing signs of slowing down. Already a quarter of the city was in rouble. Anarchists were using everything they had to fight, including bricks, rocks and even ramming cars into troops. At 14:50 with the help of the tank brigade, most of the fighting in the south of the city has ceased with all attention to the north now. Casualties, while not very high, were still a reason for concern for our troops. At 16:00 fighting in occupied areas ceased as our troops finished preparing for the final push. At 16:40 After a lengthy artillery bombardment, our troops entered the last pocket of resistance. Despite the long artillery bombardment, morale seemed to have not disappeared, and the resistance fighters still fought on. At 18:00, most of the fighting has ceased. The city is in absolute ruin, most of the civilians have fled or fought over what's left. Close to no resistance fighters surrendered. It is debatable if there is any worth in rebuilding the town or if it's better off just a burning memory."
 OMS_unification_war.26.a:0 "Mother Anarchy embraces her sons for the last time."

 OMS_unification_war.27.t:0 "[Change Later]"All is Lost"[Change Later]"
 OMS_unification_war.27.desc:0 "[Change Later]"The city was burning. The air was choked with ash and smoke and embers, scraps of a dream deferred that drifted on the wind like fireflies. Private Koslov held his left arm over his face, hoping to ward the sting from his watering eyes. He failed. The young man, barely sixteen, stumbled over wood and rubble, his kalashnikov clutched by the cold barrel.\n\nIn the distance, he could hear screaming. The invaders were growling, roaring their hate like animals. They had slipped past language into the primordial. Beneath their shouts, he could hear civilians — women — begging for mercy. Their speech was crushed under the hammerfall of gunshots.\n\nKoslov's bowels ran cold. The stripling broke out in a sweat as he scrabbled through chalk and fallen beams, forcing himself forward on his hands and knees. He had to escape. He had to get away from this nightmare, retreat, live to fight another day -\n\n"Help me." A phantom's moan drifted on the burning wind.  "Please... help me."\n\nKoslov wiped the tears and smoke from his eyes. Everything around him was an indistinguishable ruin, the same pattern of broken concrete and toppled walls. Without thinking, the words slipped from his mouth. "W-where-" He cleared his throat, spitting black phlegm into the dust. "Where are you?"\n\nA scraping sound came from his left, and Koslov saw him. He was a man, or the remnants of one. The soldier was middle aged, balding, with a curly grey beard and the patch of the Utopian salon's militia sewn onto the breast pocket of his uniform. And his legs had been crushed by a falling beam. An arm dangled by the man's side, useless.\n\nKoslov knew what the soldier wanted before he even spoke. Mercy. A reprieve from the animals that hunted Tomsk's ruins. But the League was close, and growing closer by the second. He could feel their breath on his neck...\n\n"I'm sorry." The boy turned as the soldier wailed in horror, and sprinted for the city's outskirts. For survival, and shame."[Change Later]"
 OMS_unification_war.27.a:0 "[Change Later]"Pragmatism — another word for cowardice."[Change Later]"

 OMS_unification_war.28.t:0 "All the Queen’s men"
 OMS_unification_war.28.desc:0 "Desperation and melancholy hung thick in the air like a choking miasma, and everyone present at the small camp was fully aware of it, from the logistics staff and soldiers all the way up to Lydia herself. But, even if this would be their final hour on Earth, the least she could do for these men was to provide the illusion that it would be worthwhile. That they would achieve something, even if only minor. The cavalrymen were mounted and neatly lined up, though not half as many as she would have wanted, most of all when faced with tanks. Slowly but purposefully, she took her own mount to front and center of the line, facing the men and scanning them sternly. Some met her stony glare, others looking decidedly more glum.\n\nShe turned her steed around, saber pointed into the air, and with a battle cry charged. Even when pushing their mounts to full speed, the only thing most men there expected to achieve was a glorious death. As they made their way over a small hill which had been covering their position, the extent of the Black League attack became fearfully obvious to all. A lump rose in her throat, but there was no turning back now.\n\nThe fleet of tanks and other armored vehicles wasted no time in turning their guns towards the cavalry charge. The thump of cannons and rattle of machine guns was the death knell for many, and those not immediately killed by a bullet were thrown to the ground. Lydia was no exception. A pair of bullets slammed into her chest, flinging her to the cold, hard ground below.\n\nNumb from the waist down as a pool of blood slowly started to spread out, her weary thoughts turned to her father, the so-called “Rurik II”. For all his eccentricities, he truly did believe that he had been building a better future for Russia. How bitter then that this dream was torn from them. Then, her brother Yuriy drifted into focus. For all their arguments and power struggles, she did in her heart of hearts love him as any family should. She didn't know his fate; perhaps that was for the best. As darkness began to claim her, her thoughts became fearful."
 OMS_unification_war.28.a:0 "Light, they always said there’d be light..."

 OMS_unification_war.29.t:0 "All the King’s men"
 OMS_unification_war.29.desc:0 "A series of distant rumbles sent a thin layer of fine dust from the ceiling, to the table around which King Yuriy and a handful of his guards sat. The situation was dire, and everyone there knew it. A large contingent of Black League infantry was about to split their defenses in the city center in half, allowing a straight shot to their command post. They were stretched to breaking point as it was, and no reinforcements or support fire could be spared. But one last desperate plan hatched in the unfortunate king’s mind. A withdrawal, and a last stand to frustrate the attackers into halting their advance for the moment.\n\nThey still had radio contact with the front line, a mere 200 meters away. The defenses were a little more solid closer to their position, and could hold at least temporarily. With a shaking hand, which he clenched to avoid showing weakness, he ordered this tactical withdrawal. The remaining forces were exhausted and low on supply, but still fought on with a gritty determination to at least take a few more attackers with them into the arms of the reaper.\n\nAnother explosion rocked the crumbling building, closer now, yielding a much larger shower of dust particles. Feverishly, Yuriy rifled through his mind as though it were a collection of documents in a filing cabinet. Strategies, tactics, options... But alas, there was nothing.\n\nAt the front of the room, coated in dust but nonetheless unmistakable, hung a large portrait of his late father, “Rurik II” he had called himself until his final moment. A lump rose in his throat, Yuriy had hoped that when his time came,  it would be peaceful and in the company of loved ones. But it was not to be. In less than an hour, this place would be overrun, there was no stopping it.\n\nWith a deep and sharp breath through his nose, he wordlessly rose to his feet, eyes still focused on the painting. A single tear rolled out of the corner of one of his eyes, which he quickly wiped away. Nobody truly chooses their end, but one must play the hand they’re dealt. He picked up a Mosin rifle from behind him, as well as a bandolier with several spare clips on it, even attaching a bayonet. Every man present armed himself, following his lead. And with one final look at his father’s visage, he exited the room, and entered history."
 OMS_unification_war.29.a:0 "My Fatherland is dying."

 OMS_unification_war.30.t:0 "Dishonorable discharge"
 OMS_unification_war.30.desc:0 "The war was utterly lost. That much was obvious to Boris Shepunov and anyone else with eyes and ears, but the man himself was somewhat less concerned than most. His Japanese benefactors were less than pleased at the outcome of the war, especially considering just how much investment they had poured into Shepunov’s upstart statelet. But nonetheless, it appeared they still had some sort of use for him, as they had arranged to extract him and a cadre of his staff and guards by helicopter.\n\nOf all the men in the armored cars on their way to the pre-arranged landing site, one of them seethed with unspoken contempt. Not merely for the unfortunate situation they found themselves in, but for Shepunov himself. Their so-called glorious leader was bravely fleeing,escaping the consequences of his failures. The coward! The fool! But he would not get away with his spinelessness so easily; if it would be his job to drag this pitiful excuse for a leader backwards into hell, then so be it.\n\nShepunov himself looked tired and haggard, his sunken bloodshot eyes indicative of many sleepless nights, and his red face betraying his acquired habit of self medicating with copious amounts of alcohol. His clothes were crumpled and askew, far from the polished portraits showing him as nothing short of perfect. Anxiety burned in him like a hot coal lodged in his chest, his hands clasped tightly together to prevent them from trembling. He was a shell of a man, as all present could tell.\n\nEveryone there bore weapons, though only one man was prepared to make use of his in short order. Eventually, the cars slowed to a stop, parking at a small helipad in the countryside outside of the city of Chita. As they got out, a pistol was quietly cocked, and its user took position behind Shepunov. The helicopter had already landed, one of the doors sliding open to greet them. One of the Japanese staff on board motioned for them to board. At that moment, the assailant drew his weapon. Wordlessly he pulled the trigger, and with a cry of anger blew a hole in the back of Shepunov’s head.\n\nThe attacker was felled mere seconds later, but departed the world with a satisfied smirk frozen on his face."
 OMS_unification_war.30.a:0 "Rewarded as deserved."

 OMS_unification_war.31.t:0 "What comes after"
 OMS_unification_war.31.desc:0 "Department of the army.\n\nMemorandum for: generals of the Black League and regional governors.\n\nSubject: The integration of lands formerly held by the White Army and the fate of Mikhail Andreevich.\n\nGeneral: After the capture of Chita and the final capitulation of the white army, the remaining forces have fallen into disarray either fleeing into the vast forests of Yakuita or have broken off from whatever central command is left to become little better than bandits. Participating in various raids against undefended towns not fully incorporated into our administration like the barbarians they are. Full authorization to terminate these remnants in whichever way deemed necessary has been granted by central command. To accomplish this task, regional military governors will be installed who will work towards restoring order in the newly conquered territories.\n\nMikhail Andreevich has been confirmed dead since the capture of Chita. His body was found buried underneath the rubble of his imperial palace which had been shelled by artillery during the capture of Chita. His corpse has been safely relocated to be burned and forgotten. A weak and useless puppet to the white army, propaganda campaigns must be enacted against Mikhail as possible. We will discredit all this talk of Mikhail being a legitimate candidate with a campaign targeting the backwardness of the Russian monarchy that brought Russia to ruin in the first world war. We will also bring up Mikhail's pathetic character and his upbringing in the United Kingdom to showcase that he was a foreigner who didn't understand the needs of any Russian that lived under his banner.\n\nWith the annexation of the White Army's territory, we can now finally begin truly preparing ourselves for the Great Trail, Russia marches on, the chains that the white army wanted to strangle Russia with by bounding her to the past have been destroyed and the Teutons and any other country that has contributed to the destruction of Russia will feel the full might of our wrath.\n\n"
 OMS_unification_war.31.a:0 "Signed, Glavkoverkh Dmitry Yazov."

 OMS_unification_war.32.t:0 "For what is it worth"
 OMS_unification_war.32.desc:0 "Artillery fire, Planes flying, tanks rolling, ships sailing, civilians panicking, it was over. Black League Troops entered Magadan, and whatever authority the government held was gone, as is hope. The remaining politicians or troops sailed on ships on a course towards America even before the league was on the outskirts of the city, but now, without even a miracle to save it. Whatever was left, left Magadan. Petlin stayed, He didn't have anywhere, Magadan was everything he had, and now it's gone. He decided to visit an old friend. Matkovsky, as he entered the prison, it was empty, no one at the reception, no one guarding, not even a single person in a cell. Petlin entered the guard locker room, just to see one of the guards frantically packing, however after seeing Petlin he stood up straight immediately. Yet Petlin simply told him to pack up his things and see if any ships were still leaving and asked him for his keys.\n\nEventually, Petlin found Matovsky's cell. As he opened it Matovsky asked.\n\n"Is my sentence up yet?" While grinning and lying on his bed. Petlin sat on a chair in his cell.\n\nThey both talked for hours, about life, their history, their families, their "friendship". Sometimes they argued, sometimes they grieved. Eventually, they ran out of things to talk about. All of a sudden artillery was heard outside as the dust off the ceiling was falling off and the lights began to dim. Petlin then took out his pistol with two bullets knowing that it was time.\n\nMatovsky didn't react and grinned while asking.\n\n"Was it all worth it? You and your ideas and this state you created?\n\nPetlin didn't respond and shot him between his forehead as his corpse fell to his bed. Then he pointed his gun at his forehead and while watching Matovsky's lifeless body, he grinned and before pulling the trigger he said."
 OMS_unification_war.32.a:0 "[Change Later]"Yes, yes it was."[Change Later]"

 OMS_unification_war.33.t:0 "Blood on the Snow"
 OMS_unification_war.33.desc:0 "Matkovsky sat cold and alone in the presidential chamber, the situation was beyond dire and everyone, most of all he, knew it all too clearly. Magadan’s armies were shattered, in broken disorderly retreats and routs all across the board. Only a single understrength and poorly equipped division along with whatever militia could be scrambled stood to defend the city. They may last a little while if they’re lucky, but in the end, only death or captivity awaited them.\n\nAs for him? A protracted humiliation and torture was likely. He had read reports of what the Black League had done to other leaders, making examples of them to bring the populace to heel. Now he was directly in that firing line, potentially literally. After considering this carefully, he opened a drawer in his desk. One he had never hoped to open. It contained only a small glass bottle with a pair of white pills in it, and a flask of vodka.\n\nWhile staring vacantly at the items, he drew a deep and haggard sigh, and began to reminisce about his time in Harbin, as one of the so-called “Harbin Three” along with Rodzaevsky and Shepunov as the different branches of the Russian Fascist Party. But, their desires for different types of fascism or even monarchism resulted in what was once a united effort to put the far right in control of Russia falling at the first hurdle, and splintering into a trio of statelets. It had all seemed too simple at the beginning, and he’d convinced himself that maybe, just maybe they could pull off an audacious takeover and stay together. How woefully naive, in retrospect.\n\nHe tipped the pills onto the desk and unscrewed the cap on the flask, but hesitated still. His life began to flash before his eyes, memories flooding back in a torrent of fear and nostalgia. After securing their foothold by pushing Yagoda’s reds back to Irkutsk, everyone took that opportunity to sharpen their knives. The cracks which had been slowly forming, all burst open at once. Amur, Transbaikal and Magadan were the result of this. Nobody won, not really. Even after his erstwhile peers were conquered and subsumed, it felt like a hollow victory. Symbolic at most.\n\nHe picked the pills up, placing them on his tongue before sending them down with a generous swig of vodka. The Black League would be denied their prize. This is the way the war had left him. No hope, no love, no glory, no happy ending."
 OMS_unification_war.33.a:0 "He died choking, like a dog."
 
 OMS_unification_war.34.t:0 "Rust"
 OMS_unification_war.34.desc:0 "Svetlana Stalina lazily gazed at the room before her. Damp, worn, and decaying, it cast comfort from its domain and banished tranquility further still. She looked upon the men and women crowded in the holding cell with her. Once, they had made fiery speeches to their foes in the open, and to their allies behind closed doors. Now, they sat lifeless. Damp, worn, and decaying, molded by the tyrant king whose walls they slumped against.\n\nIt was the last room they would ever see.\n\n"Number 8452!"\n\nShe stood up as two authoritative hands clasped her shoulders, and led her between her fellow prisoners, miring in the sullen stares of the people she had failed. Where had it all gone wrong? She had forsaken everything to build a Russia worth living in: her time, her health, even her morals. She had looked on as the light of democracy dimmed, and turned away, content in the fact that it was all for the people, all for Russia. Now, the light had been snuffed out, its candle nothing more than a damp, worn, and decaying obituary.\n\nThe blindfold was wet and heavy. She would never see her native land again. She didn't want to. She had been warned. God, she had been warned that those who sold democracy for security got neither. And she had pushed them away like the naive fools they appeared to be. But they were right. An insidious evil, one then basked in its malign despotism, had exploited her failings, turned her army into dust, turned her own people against her. They had won. The room she now sat in was a testament to it.\n\n"READY!"\n\nCould she have done things differently? Altered Russia's very destiny? Maybe. But perhaps her people had suffered too much. Perhaps there was nothing anyone could do to escape their fates. Perhaps the world really did need to bathe in hatred and hellfire if anything were to truly change. Such questions had plagued her mind since she could at last remember, demanding answers, but never receiving them.\n\n"FIRE!"\n\nBut, at the very least, she would worry no longer."
 OMS_unification_war.34.a:0 "Bullets pierce. Steel shatters."

 OMS_unification_war.35.t:0 "What's left?"
 OMS_unification_war.35.desc:0 "The winds blowing on the fields with overgrown grass, the sun between the mountain range's peaks, and the suspiciously peaceful and silent environment of the Siberian Taiga made him uneasy. For weeks they hid, in ruins, forests, the mountains, and in cellars, avoiding League patrols. They had no plan, no organization, perhaps no tomorrow. They had been following a creek the past few days until they were forced to flee into the mountains to avoid the League airforce. They needed someplace to rest, to reorganize, to think. Finally, after what seemed forever, the group leader turned around and told them to rest. He placed down a blanket on which they placed their remaining ammunition, rations, and grenades. He took a deep breath and looked down the valley. It was quiet. It made him even more paranoid. He thought of the day he left home. He thought of the day of his oath. He thought of the day they received the news.\n\nThe Leader inspected the blanket thoroughly while muttering under his breath. He turned his head up and asked, "That's it?" Another soldier reached into his pocket and pulled out about 5 or 6 more bullets and uncomfortably said he forgot. The Leader cursed the soldier under his breath. Eventually, he lifted his head, breathed a heavy sigh, and lifted his cap to scratch his forehead.\n\n"Should last us a couple of weeks until we decide what to do. Hopefully, we aren't detected; a single major attack would deplete this."\n\nBefore the Leader could finish his sentence, the group was interrupted by the sound of rumbling. Just down the valley, a lonesome tank was passing by on a dirt track. The whole group ducked down. He clenched his rifle hard, not moving a muscle. Each breath became more heavy than the one before. One of the soldiers picked up a grenade and a mag and slowly began moving forward, but the Leader quickly stopped him by pulling his belt. The Leader slapped the back of his head but spared the scolding for another time. From what seemed like an eternity the group slowly emerged as they peeked over the overgrown grass. But he did not. He was still clinging to his rifle as he lay in the dirt; repeating to himself over and over again the words."
 OMS_unification_war.35.a:0 "[Change Later]"We've had a good run".[Change Later]"

 OMS_great_trial.1.t:0 "A True War Economy"
 OMS_great_trial.1.desc:0 "The snow gathered on the ice that used to be a river, as the wind blew hard into his face. Watching such a trivial thing as snow was about all that remained for entertainment anymore, as the realization of just how far Komi had fallen in recent years hit him.\n\nKrylov could only watch as the League extended its ever tightening grip over Russia, and then began to suck the joys of life out of every Russian underneath its flag. First, it was the simple things; Silverware, “Unnecessary Furniture”, and then the home appliances. Soon, the boardgames, paper, and even clothing that was considered to be “extra” were confiscated by those soldiers in the pitch-black uniforms.\n\nSadly, it didn’t end there. Eventually, Krylov could do nothing as he was forced out of his home and assigned to an arms plant down the road. His former housing, although not of the highest caliber in Russia, had been replaced by a single bunk bed crammed into a room only 12 feet wide.\n\nAnother tear fell down his cheek, with vivid memories of the anger and sadness of it all being displayed in his mind. He had watched as the League tore down one of Russia’s brightest beacons, and replaced it with a factory of despair and anguish. And the propaganda? It was laughable, a pitiful attempt at justifying the drainage of the Russian soul in the pursuit of vengeance.\n\nKrylov began to pull his thinly layered coat over as much of his body as he could, with the wind picking up further, and the elegant dance of the snow transforming into a blizzard. It mattered little anyway, as the whistles of the guardsmen signaled that his break for the day was over. He turned away from the river, leaving behind the memories of what once was, and lost hope for a better tomorrow."
 OMS_great_trial.1.a:0 "The last breaths of Russian freedom draw ever closer."

 OMS_great_trial.2.t:0 "Anja"
 OMS_great_trial.2.desc:0 "[Change Later]"Peter, eat your vegetables." Anja tried to put as much calm into her voice as possible when instructing her child. It was the only thing she could do to try and soothe his anxieties in these trying times.\n\nAnja and her family had come during the migration in the wake of Generalplan Ost. The Reich had promised her everything, and for a time they received everything. The spoils of Russia came to her doorstep every day. The natives, turned to servants and nannies, kneeled and kissed her feet at the offer of employment, and the luxuries offered to her and her family from the land nigh limitless. But, as her sons dutifully informed her even through the censorship and black ink, they were coming.\n\nThe Slav had never been a threat to Germany. According to the most intelligent minds in all of Germany, they were subhumans and henceforth incapable of standing up against the Aryan race. Her sons were of said stock, born and bred from a line of pure-Prussian vintage going back to the times of Bismark. Yet, she could detect their desperation in every letter, every stroke of a pen which continuously decreased in quality. Neat cursive turned to hasty print and hasty print turned to panicked scrawls, nigh animalistic. And the sirens. The wretched sirens. They blared at seemingly random times in the day, forewarning of attacks that came mercilessly despite the best efforts of the city's air defense. She was told all was well. For the first time though, Anja did not believe them. As if glass was shattering on the ground, her trust in the Reich was broken.\n\n"Mommy? Why can't we have more? I'm still hungry." Anja's thoughts went back to reality, as she saw that Peter had finished his plate. It was licked clean, pristine as if she had just washed it.\n\n"It's because the Reich needs to give everything it can to your brave brothers and fathers, fighting the Black League, so we can be safe."\n\nShe put on a smile and stroked his hair."
 OMS_great_trial.2.a:0 "The Black League moves onwards!"

 OMS_great_trial.3.t:0 "A Culture of Pillage"
 OMS_great_trial.3.desc:0 "One small flask of water. A pack of hardtack. Some strange dried meat. That seemed to be all that this deceased German soldier had to offer him. Alexei unceremoniously threw the cadaver to the ground — as befitting the treatment of the hated enemy. Pocketing the mediocre rations, Alexei flung his gun over his shoulder and went onto the next body.\n\nThe troops had been informed roughly two weeks into deployment that they would not, in fact, be receiving any more rations from the government throughout their time in the military. They were given the directive to instead "steal from those who stole from their land" — "them" obviously being the Germans. This was met with mixed reactions. Of course, they didn't stay mixed for long, as anyone who protested was immediately shot, with their rations being distributed amongst the loyal soldiers.\n\nAlexei didn't take to the marauding lifestyle as some of his fellow troops did. Many would group together and hide in devastated buildings, jumping out at passerby Germans like a pack of Hyenas, shooting them dead and looting their corpses.\n\nAlexei was more of a vulture, himself. He scavenged battlefields for food that was edible. Sometimes he would take their uniform if his own got too frayed. The stench of death was his constant companion, and he honestly? He was fine with it. As far as he was concerned, this was only a fraction of the suffering the hateful teutons had inflicted on his people. He was just. Kneeling down towards the next corpse, he began to pick through his belongings. Hopefully this would be more bountiful."
 OMS_great_trial.3.a:0 "Hopefully not more Hardtack."

 OMS_great_trial.4.t:0 "Only a Matter of Time"
 OMS_great_trial.4.desc:0 "To steady his nerves, Yazov poured another drink. For hours, he had sat alone in an office, pouring over the mountain of reports from the mobilising army on the border that piled up in front of him. His only company was an overflowing ashtray, a plate of half-eaten buterbrod and the slender bottle of vodka that stared at him as he read. Quickly taking another gulp from his glass, Yazov felt his stomach writhe like a mass of worms. He finished the glass and slammed it down as an unshakable anxiety wrapped its hands around his throat. Everything he had read, absolutely everything, was good.\n\nIt wasn’t merely good, Yazov reflected as he laid back in his chair. It was superb. Across the vast front, from the icy forests in the north to the sweltering steppe of the south, the Russian eagle screamed in fury, as its vengeful wings prepared to cover the west in perfect darkness. Russian tanks were ready to tear through the Germans’ feeble soldiers, greedily crushing any resistance under their hungry treads. Once-dreaded German bombers would be sent howling towards the earth by Russian falcons, erupting in fiery blossoms of red and gold. Even around the corrupted heart of Moskau, the Russian army would run like clockwork as the Germans’ defences were pathetic and unprepared. Everything was in place, Yazov thought as he watched it in his mind’s eye. So why did he feel so damn nervous?\n\nHe glanced at the clock. 02:37. Maybe he was just getting delirious. Sleep would cure him of this nervousness, he knew. But even as he got to his feet, the papers in front of him screamed out, as if they still had some secret he had missed. Groaning, Yazov collapsed back into the seat. He knew he wouldn’t be able to sleep without sifting through these infernal reports again.\n\nAs he continued reading, he caught himself thinking about Karbyshev. Nothing the man had told him when they knew each other, but instead the stories from the war that had made him a legend. All those years he had been held in that camp, he had inspired even the most pathetic creatures to resistance against the Germans. Karbyshev had been utterly convinced, that one day, the unstoppable German war machine would falter, and he and his comrades could rise in rebellion and free themselves. Even as Kiev, Leningrad and Moscow had fallen, he remained adamant. For a fleeting moment, Yazov realised it was only a matter of time before the clockwork snapped.\n\nAngrily, he stood, clenching the paper between strong, short fingers. Karbyshev’s day had never come, he told himself, nor would the Germans’. Karbyshev’s faith had not saved him, nor would the Germans’. Everyone Karbyshev had ever known was murdered."
 OMS_great_trial.4.a:0 "So would the Germans."

 OMS_great_trial.5.t:0 "Never Waste a Good Crisis"
 OMS_great_trial.5.desc:0 "Watching thin fingers of steam rise from a cup of tea, Yazov waited in silence. All morning, he’d done nothing but listen to reports from the front, of failure after failure. There didn’t seem to be a clear reason for these failures; the long-awaited breakthrough had simply never come. The army was hardly unprepared, Yazov thought to himself, and the Germans shouldn’t have been able to put up such a defence. Anger curled in Yazov’s stomach like a dragon as he hunted for traitors in his mind. If the treachery wasn’t on the frontlines, it must be festering inside his own government.\n\n“Comrade Glavkoverkh,” Sakharovsky muttered as he slid into the room, clutching a stack of files, “You’ve heard the reports from the front?”\n\nYazov nodded slowly, taking a sip of tea.\n\n“We’ve compiled a number of responses here,” Sakharovsky gestured to the tower of paper that he had placed on the table, “For your selection, of course.”\n\n“That won’t be necessary, Alexander Mikhailovich.”\n\n“No?”\n\n“No,” Yazov repeated firmly, “Continue executing the plan as is.”\n\n“With respect, the current plan is failing.”\n\n“There’s still time,” Yazov invited Sakharovsky to sit, “It’s a question of willpower. The Germans are putting up everything they have in the hopes it will send us scurrying back behind the Urals. I won’t be the first to blink.”\n\n“Dmitry Timofeyevich,” Sakharovsky poured himself a cup of tea, “Perhaps a different approach should be considered.”\n\nYazov sat quietly, looking back at Sakharovsky curiously. Perhaps in an attempt to dodge the Glavkoverkh’s cold stare, Sakharovsky looked down into the depths of his tea, slowly mixing in a cube of white sugar. For the longest minute, the only sound in the room was the delicate ring of a spoon on the side of the teacup.\n\n“How long have we prepared for this, Alexander Mikhailovich? How many years? Only to stumble at the first hurdle?”\n\nA moment.\n\n“No.”\n\n“No,” Yazov nodded, “The Great Trial cannot be stopped. We do, however, have traitors in our midst. This is an internal affair.”\n\n“Internal? Lazarenko has a talent for fear. I’d recommend him.”\n\n“Not Lazarenko,” Yazov grimaced, “He’s too... loud. I want this done quietly.”\n\n“Quietly,” Sakharovsky nodded, “No blood on the streets?”\n\n“No blood, only whispers. Just enough to keep people looking over their shoulders, and doing everything they can for their Motherland.”\n\n“Understood,” Sakharovsky rose from his seat, gathering his files, “Although a little blood may need to be spilled.”\n\nYazov sighed and leaned back into his chair, as Sakharovksy left. Alone, his mind wandered. Before he could stop it, a flame of doubt flickered. To dispel it, Yazov muttered to himself quietly as he rose from his chair."
 OMS_great_trial.5.a:0 "“The Great Trial cannot be stopped. Never.”"

 OMS_great_trial.6.t:0 "Hold the Line"
 OMS_great_trial.6.desc:0 "[Change Later]"Ach! Schise!" Kurt bashed the side of his MG with his palm, desperately trying to fix the feed jam. He worked frantically, every few moments glancing out of his dugout for Russian troops. He wasn't sure how long was left until the next onslaught, but it couldn't be enough.\n\nRussia and the Black League... Kurt had never seen anything like them. He was only eighteen, but he remembered the famines and death of the Burgerkrieg as a young boy. It may have been hard but the front was... the stench of the bodies, the smell of the gas never leaving his lungs... These were animals. The Black League had charged his trench line three times. He could make out nothing but black uniforms and the stench of chlorine. They charged again and again, achieving nothing but spilling their own blood. Kurt couldn't stop staring out of the MG nest at the corpses. He went to wretch but the month old rations held in his stomach.\n\nHis empty gaze was interrupted by something breaking through the line. His eyes widened and he scrambled to battle position. They were back. He gave one last hopeless bash to the machine gun, glancing between the ever advancing charge and the weapon, and was shocked to see it cycle a round. He threw his whole weight into lifting the gun onto its position and screamed as he held down the trigger, shutting his eyes and praying that the screams would stop. He could feel the bodies hit the earth as his finger dug into the metal, holding it down with all the strength he could muster. He dared to open his eyes, the wave of gas slowly beginning to subside, but the charge hadn't abated. They were getting closer. His comms were slowly filled with more and more screams. Kurt's aim became less focused as he desperately tried to gun down whoever was closest to him. Suddenly the stream of bullets stopped.\n\nNot now. Please not now. He slammed the gun into the wall but the jam wouldn't clear, the onslaught drawing ever nearer, only meters away. He pulled the trigger and pulled it again but the gun was done for. He pulled his pistol from its holster and tried to lift his arm.\n\nBefore the pistol had left his waist he felt the air escape his lungs as a bayonet pierced his chest. He was thrown to the floor, blood and chemicals filling his mouth as he screamed a hysterical gurgle."
 OMS_great_trial.6.a:0 "The black flood breaks Europe's last line."

 OMS_great_trial.7.t:0 "Whatever it takes"
 OMS_great_trial.7.desc:0 "“Hey Andrey, put that cigarette out. I’ve got explosives here, genius.”\n\n“Cool it, gramps,” Andrey took a pull. “What do you want me to do? Take a break?”\n\n“Wait,” Damir suggested. “Like the rest of us.”\n\n“You might be able to go fourteen hours without a smoke,” Andrey replied. “And if Daniil hasn’t set anything off with his sparks over there, no-one will.”\n\nDamir snorted. Andrey was almost right, he knew, but he couldn’t abide the younger man’s recklessness.\n\nWhen the Black League had arrived in Kazan, nothing had changed for Damir. Bullets and shells tended to stay the same, regardless of ideology, he quickly noticed. Somebody always wanted to kill somebody else, and so nobodies like Damir kept their job slaving away at the production line. But as the army had become hungrier and hungrier, quality had started to slip. Soon enough, modern power tools, safety regulations and even decent steel were nowhere to be found across western Russia. Worst of all were the production quotas, increasing endlessly with no signs of slowing down. If Damir and his colleagues had any hope of meeting them, they had to juggle dozens of deadly tasks at once to create something that didn’t even deserve to be called a shell.\n\nAs Andrey stood across from him, twirling a drill while smoking that damned cigarette, Damir packed the shells. His leathery old hands worked swiftly, as they had a thousand times before. Damir would have liked to work slower, but before he had even finished a single shell, the ancient conveyor belt groaned and pulled another into view. His back ached abominably as he reached down and up and down again, filling his hands with explosives, but he did his best to ignore the pain. If he lost his rhythm, he would not be able to keep up.\n\nAfter his fingers stumbled for a brief instant, he quickly tried to correct the mistake. Although his fingers knew what to do, and moved in swift, decisive strokes, his heart panicked. As he heard the conveyor belt grind into motion once more, he hurried alongside it, desperately trying to fix his error. He tried to scream out to Andrey, to tell him to get down behind something, but there wasn’t enough time. Before Damir could even open his mouth, he felt himself swirling into the whirlpool of the pale blue sky."
 OMS_great_trial.7.a:0 "I hope he enjoyed that cigarette."

 OMS_great_trial.8.t:0 "No Dissident"
 OMS_great_trial.8.desc:0 "Tyumen City Police Report A/11 \n\nStatus of Anti-Trial Dissidents\n\nWe are pleased to report that all districts of Tyumen are henceforth clear from all anti-Trial dissidents, without regard for age or ideology. Although the battle was tough, the brave officers of Tyumen have carried out their duties without fault. For promotion and commendation, I could recommend nobody more qualified than Sergeant Pavlov Dmitrovich who showed exemplary bravery in combatting armed anti-Trial cells in downtown Tyumen.\n\nAs the battle against anti-Trial forces was escalating to unseen levels, Sergeant Pavlov Dmitrovich took executive action against subordinates which he considered incompetent. He immediately excised all anti-Trial thought and speech from the units under his command and went onto lead them in both investigative and combative situations without regard for his own safety or the safety of his officers against those who expose themselves traitors to the state. Without loss, he successfully defeated a cell of well over three dozen fighters. In addition, he (again without loss) successfully intercepted and eliminated several illegal hubs of propaganda production and distribution.\n\nWithout the contributions of brave men such as Sergeant Dmitrovich, it cannot be said for certain that our victory would be so complete. However, with the brave efforts of all officers in the Tyumen Secret Police, I am pleased to report total and undeniable victory against anti-trial forces. Dissent has been rendered untenable for our great mission against the hated enemy.\n\nYours truly, \n\nCaptain Rytin Vissarion Vitalievich"
 OMS_great_trial.8.a:0 "Nowhere left to run."

 OMS_great_trial.9.t:0 "No Death is Meaningless"
 OMS_great_trial.9.desc:0 "Beneath his feet, the concrete seemed to shift like a thrashing dog. A black mist clung to the towering silhouettes of buildings beside him, blotting the sun from the sky. Sasha could barely see out of the gas mask as it were, but the dark fog had made him nearly blind. A ferocious roar echoed from the street beside him, and when he turned he saw the black figures of his comrades charging forwards, gunfire crackling from their shadowy fingertips. In an instant, their warcry was drowned out by the thundering wail of artillery, beating the earth beneath him like a drum. When Sasha desperately ran forwards, it felt like he was falling. Between his frostbitten fingers, Sasha clung to his rifle like a Bible, tight against his chest. He tried calling out to his comrades, but his voice was drowned out in the sea of war. \n\nSasha’s division was the sixth to have attacked this position. The other five had failed, and so it was up to Sasha and his comrades to prove their redemption by blood. On the first day of their attack, they encountered no resistance and took it as an easy victory. It only took one day to prove them wrong. The German dogs had blocked off streets to funnel them into a tight pocket, before gunning them down in narrow chokepoints. As Sasha’s comrades tried to force their way out, hell had opened from above their heads, in a storm of rockets and bombs. When noxious gasses had come raining from the sky too, Sasha had quickly strapped his gas mask on, and he had not seen clearly since. \n\nOther men might have collapsed after days like this, but not Sasha. Even as he blindly groped his way through the collapsing streets, hate burned hot inside him. Not for the enemy, but for the League. He had given them everything he had that they had asked for. Every drop of sweat and scrap of skin. But now, they thrust a rifle in his hand and tell him to die for them? When the order had been given, the officer giving it had stared at them with disgust and said, “The price of redemption is blood.” \n\nSasha fell in line with his comrades, emerging ghostlike out of the fog. His feet matched their rhythm as they delved forward. Sasha found himself charging, filled with anger again. He had decided to live, and to kill those Black League bastards another day."
 OMS_great_trial.9.a:0 "Another day never came."

 OMS_great_trial.10.t:0 "No Wreckers"
 OMS_great_trial.10.desc:0 "“It had been quite the weekend, as several Buryat laborers had holed themselves up inside an ammunition factory near Lake Baikal. They used whatever table, chair, or furniture they could find to keep the black league at bay. Despite Yazov's victory in the Far East, some of the locals of Buryatia still clung to the ideals that Sablin had given them. Ideals that kept the strikers fed and well-supplied via sympathizers within the area. As such, they refused to negotiate with the local police force.\n\n"Workers of Buryatia unite! Unite for free and fair labor!" The young Buryat activists rallied the workers who supported them as they tried to keep up morale and make the local government concede to their demands. Chief of which was the shortening of working hours and working days. But alas, the great trial had no time nor patience for 'complainers,' and neither did Yazov or his men.\n\nIn the dead of night, a Black League battalion arrived on the factory's grounds and began burning the barricades the strikers had set up. The soldiers soon shot anyone present in the area dead, whether they had been part of the strike or not. When the soldiers had finished off the strikers, they soon moved into the villages surrounding the factory. Anyone who they suspected of harboring Sablinist ideals was quickly rounded up and driven to the remote wilderness nearby, where they were burned thoroughly by the flamethrower troops.\n\nBy Monday morning, the only trace that the strikers or the sympathizers were there was the black soot on the floors of the ammunition factory and the empty houses in the villages surrounding it. That, too, was wiped away as the factory's new workers cleaned up the mess, and loyal citizens of the black league occupied the empty houses. The following week, it was back to routine, with all who witnessed The Black League's fury being silent, lest it be them next.”"
 OMS_great_trial.10.a:0 "No excuses!"

 OMS_great_trial.11.t:0 "A Few Questions"
 OMS_great_trial.11.desc:0 "A quiet, cold breeze filled the dimly lit interrogation chamber. Two earnestly dressed officers armed with revolvers sat side by side in front of a woman, a soldier of the black army. The two men look at the woman's face with cold, harsh eyes as the woman averts any eye contact with the men. She's distressed by the conversation and appears to be holding back tears.\n\n"Once again, recruit, explain to us the incident. In detail, make sure you miss nothing." Placing his pistol on the table between her and the men, her eyes finally break contact with the concrete flooring, darting directly to the gun barrel. She swallows down her emotions and takes a deep breath. Moving her handcuffed hands back up to the table in clenched fists, she opened her mouth again to say something.\n\n"...I. I saw his face. It took me a moment, but I knew I had seen his eyes before." She stared away into space momentarily before one of the officers slammed his palm onto the table, signaling her to keep it together. She returned to reality at that moment and continued, "And it all came back to me. Who he was, what he'd done. Murdered my sister just for fun." She stopped again, tightening her eyes to force every muscle in her eyelids to hold the tears back. The officers, keeping up their stoic gazes, didn't move a muscle.\n\n"He killed her! He mutilated her! I had to! No-no one does that and gets away! He made a mistake letting me go–I drove that knife in that bastard's throat! Dead! Dead!" Her nose flared, tears rolled down her cheeks and onto the table. She was breathing hard, her eyes were full of rage, yet her face was of sheer terror. It was as if the officers were witnessing a person, metaphorically, splitting apart at the seams.\n\nThe officers looked at one another, then returned to her enraged gaze with still emotionless faces. "Here's what you'll do. From now on, if anyone asks, it never happened. If you need to say something to anyone–and I mean, anyone–you keep your mouth shut."[Change Later]"
 OMS_great_trial.11.a:0 "Don't ask. Don't tell."

 OMS_great_trial.12.t:0 "A Youth’s Mission"
 OMS_great_trial.12.desc:0 "Young Misha was one of many in the trucks driving towards the frontlines towards the Great Trial. He was half-awake, only conscious because of the faint roars of gunfire and aircraft fighting to protect his country. A group of scary men in black uniforms had taken him and so many other people his age into bellowing trucks. He knew that the Great Trial had started so long ago, and that his family: his father, mother, and brothers, were all sent to factories or to fight the Teuton. He remembered those frightening men making big speeches, about “obedience” and “the Trial”, things that he learned in school so willingly along with his friends in their cadre.\n\nHe remembered the days in the camp where he was forced to practice fighting for the Trial. Even if the weapons he got were too heavy, he learned to show no mercy towards the Teutons who came and destroyed their homes and took away their people. Misha was confused though for he, and many other children with him were beaten and forced to struggle to live while training. He was a Russian, not an evil Teuton, why must he face beatings as if he was a criminal? Even as he ate his last meal before the black uniformed men shoveled his cadre back into the trucks, he contemplated this same question endlessly.\n\nBut these thoughts were irrelevant now; the Great Trial was now, and he had to wake up! He exited the truck, and saw his friends in his cadre and a multitude of others exit the motorized column, reforming into their companies. He saw the grown soldiers, and was inspired by their discipline and weapons. Misha emulated the others, and joined with his cadre. He saw a big man with a special suit walk in front of them, and Misha heard the suited-man proudly talk about the soldiers, including the “Black League Children Authority” battalion amongst the multitudes. He was ready, he was ready to serve his nation, and with an “URA!” in a flood of ten thousands, Misha followed his sergeant into battle with a double-time sprint!\n\nHe followed, screaming at the top of his lungs, until he took in his first sight of the battlefield. His charge into the fray steadily slowed as he saw the field of corpses and blazing fire, wide and expanding. He saw fellow Black League children lifeless amongst the wrecks of armoured vehicles and aircraft, and he was reminded of his brothers who disappeared months before. His knees began to shake. He had wanted to fight for Russia’s vengeance, not this slaughter! But words quietly forced out of his mouth, “I will be the sword and shield of Russia by which justice shall be done.” Misha screamed one last warcry, before regaining pace with his squad on the plains."
 OMS_great_trial.12.a:0 "They shall not die old."

 OMS_great_trial.14.t:0 "What's Left?"
 OMS_great_trial.14.desc:0 "Sighing, Vyacheslav looked down at his watch. He let twenty seconds tick away before he pounded on the door for the third time. Again, nothing.\n\nAround him, his comrades passed from door to door, knocking with gloved fists and inviting themselves inside, much to the displeasure of the unsuspecting residents. Most of them didn’t show their displeasure however; submission was a skill they had learned long ago. They sat quietly, listening to the faint murmur of the radio and sipping cups of lukewarm tea, while tall men in dark clothing tore into their apartments. They exited down the spiralling stairwell into the night, hauling loads of mismatched rifles and ancient ammunition. Vyacheslav was shocked to find so many guns, simply lying around, unused and forgotten.\n\n“Out of the way, comrade citizen,” he grunted and pushed the old crone aside after she finally opened her door, “Official business.”\n\n“Official?” She buzzed around him like a fly around a corpse, “I’m a Black League lady, truly. What could the Army want with me?”\n\n“Are there any firearms on the premises, comrade citizen?”\n\n“Well, I’m not certain I understand.”\n\nHer hesitation was enough to tell Vyacheslav what he needed to know. Without another word, he stormed forwards, almost tearing the door off a cupboard. Shoving aside all manner of useless trinkets, his fingers slowly worked towards the back of the cupboard. All the while, the lady was making noise in his ears about her property or her rights. Vyacheslav didn’t care to listen.\n\nHe let out a wry chuckle when he noticed the rifle was still loaded. An old Mosin, unused for decades, from the Civil War if he was to judge. He pitied the poor sod at the front who would end up using this piece of shit. A quick glance was all he needed to know that this thing would jam like a bitch. Still, orders were orders, and the Great Trial came before all else. If even a single bullet from this gun found its way into German flesh, it would be worth it. The old lady stared open-mouthed at him as he left."
 OMS_great_trial.14.a:0 "Everything for the front!"

 OMS_great_trial.15.t:0 "Ersatz Blitzkrieg"
 OMS_great_trial.15.desc:0 "Vasily’s heart screamed as his fingers fumbled with the gearstick. Under his foot, the accelerator roared and spluttered, desperately trying to pull the vehicle out of the muddy pit. As he tried to climb out, Vasily pushed all of his weight into a door that refused to open. Falling back, he realized that he was going to die here.\n\nBefore he resigned himself to his fate, he dropped a gear on the old truck. The rusty metal skirts and the ridiculous cannon that had been clumsily fitted to it were weighing him down immensely, but the tyres were sturdy and designed for the wilds of Russia. He pushed the truck as hard as he could, until he felt it lurching awkwardly forward. When he finally felt the wheel press onto a rock of some kind, the engine roared triumphantly and slowly began to drag itself out of the quagmire.\n\nAs Vasily reemerged, he almost laughed at what an obscene sight it must have been, The truck’s wheels had been covered by scrap metal, crudely shaped to look like armored skirts. Along the body of the truck, sandbags held down even more of the pathetic armor that covered the truck, fastened with all manner of chains and ropes. Finally, a squat turret from the Great Patriotic War sat above the cabin. Now that the whole thing was covered in black mud, it would have been barely recognisable.\n\nWhen the ‘tank’ finally came to a grunting halt, Vasily crawled out of the cabin through the back. Feeling the solid ground beneath him, his legs turned to water, struggling to hold up his weight. As he backed away from the tank, he felt sick at the thought of a creature like this facing down an infamous German panzer.\n\nBefore Vasily could speak, the captain turned and glanced briefly at the pathetic tank.\n\n“It’ll do nicely,” Vasily heard the captain say to his colleagues. “I want as many as you can get me ready for the end of the week.”\n\nVasily rose to his feet, shaking his fist and yelling.\n\n“You think that piece of shit is going to stand up to a German tank? The drivers will be dead before they even reach the front!”\n\nWith the ground still shaking beneath his feet, he strode angrily towards the captain. Before he could say anything else, an aide grabbed him by the arm, and the captain issued a single command."
 OMS_great_trial.15.a:0 "“He’s in shock. Get him to the infirmary.”"

 OMS_great_trial.16.t:0 "A Quivering Plea"
 OMS_great_trial.16.desc:0 "[Change Later]"Dmitry Yazov stared at the document which lay in front of him with both a feeling of utter shock and an equally strong urge to break into a fit of cackling. He almost couldn't believe his eyes as he read the address.\n\n"To the Glavkoverkh of the great Russian nation,\n\nI'm sure you are under no misconceptions that the war between our two states has devolved into needless and total death and destruction. I know you do not wish for your people to suffer any more than I do mine. I urge you, please, reopen communication between our two governments. This war does not have to end in the manner I dread to imagine you believe it does. We can find a way to avoid any further destruction and find a path to peace.\n\nPlease,\n\nThe Office of the Fuhrer of the Greater Germanic Reich"\n\nYazov read through the letter again with nothing short of complete awe. That bastard even put his own little signature at the end. What did they expect to come of this wailing cry to save their own skins? A peace? He couldn't help a small chuckle escape his mouth. They must be more desperate than he thought. This pathetic appeal to escape Russia's rightful retribution was all the proof Yazov needed that the Trial was truly bringing an end to the Teutonic fever dream of Aryan supremacy. The great Russian Spirit had to be prevailing, or else they wouldn't resort to such lowly begging.\n\nStill, he supposed a response was in order. His secretary dictated his words as they left his tongue without a moment of hesitation or thought.\n\n"To the Fuhrer of the German cancer which stains Europe,\n\nWe will have peace once every last wretched German man, woman, and child lies in a ditch with the flag of the Black League waving over their corpses. I will hang your rotten body myself when I arrive at the shattered remains of Berlin.\n\nSigned,\n\nDmitry Yazov, Glavkoverkh of the Russian Black League"[Change Later]"
 OMS_great_trial.16.a:0 "The only response was deafening radio silence."

 OMS_great_trial.17.t:0 "Military Grade"
 OMS_great_trial.17.desc:0 "Leonid felt life returning to his frozen fingers as he shakily poured three cups of tea. He and the other two were crowded around a makeshift campfire, savoring the warmth and calm after days of endless battle. Two days ago, they had finally been pulled from the frontlines, but Leonid knew the officers weren’t pleased in the slightest. Every inch of soil they had fought and bled for had been lost, after it became clear that no-one had the strength, or even the weapons to continue. And so, they had huddled behind the front for the past few days in silence, waiting for fresh meat and guns to arrive.\n\nWhen the soldiers were called to assemble, Leonid knew that it wasn’t good. Quickly draining the last fiery drops of his tea, he joined the mindless river of men shuffling towards the senior officers. As expected, Leonid spied huge crates being unloaded from trucks and opened, to reveal the guns within. The men already assembled must have been the newest recruits sent to fill the gaps. Leonid snorted. Not one of them looked a day over sixteen.\n\nEven as the officers were announcing a renewed offensive, a murmur rose through the crowd of soldiers. It was a moment before Leonid noticed that none of the weapons presented looked to have been made this decade. Hell, some of them probably hadn’t seen service since the First World War. From ceremonial Tsarist guns to shotguns taken from a film set, the cache would have been better suited for a museum than a war. Hesitantly, a few soldiers began slowly making their way towards the weapons.\n\n“I suppose it’s better than nothing,” Leonid muttered, reaching down. As he placed his hand on the barrel of a rifle, he felt another hand on his shoulder. Looking over, he saw a brutish officer staring down at him disapprovingly.\n\n“Comrade medic, these rifles are for soldiers, not nurses.”\n\n“For soldiers? I’ve seen more of the front than any of those kids you’ve recruited straight out of kindergarten.”\n\n“What I mean to say, comrade medic, is that a rifle is worth more in the hands of a killer, not a doctor. You can choose from the weapons over there.”\n\nAs Leonid looked over to where the man was pointing, he felt his throat tighten. His legs almost gave out beneath him as he shuffled towards a crate filled with wooden poles, carved in the shape of rifles."
 OMS_great_trial.17.a:0 "As long as the enemy thinks it’s real."

 OMS_great_trial.18.t:0 "Echo In The Wind"
 OMS_great_trial.18.desc:0 "Anatoly scratched the bottom of the hood covering his gas mask, exterminating a scorching itch that plagued him since the start of the patrol. Today was nothing but another daily march. Their objective: crush the embers of Teuton partisan activity in the Volga settlements. He couldn’t stand the monotony. It frustrated him to enter empty villages and ersatz graveyards without the Russian praise or Teutonic slaughter that he was promised. Still, his duty was to obey, and he kept marching.\n\nAnatoly's squad leader, Sergeant Petrovich, raised his hand; they'd reached their destination. It was a scorched village, an empty cairn that housed dozens of traitorous Volga dogs. The Sergeant’s orders were simple, to keep together and to keep patrolling for ambushers.\n\nMoments turned to minutes, nearly into hours. But what did he find? Nothing but the whistle of the wind through bones and the crackling of embers. There was nothing here, just like all the other villages. That feeling of unfulfillment kept crawling into his skin, then into his mind, worse than any itch. It scuttled and burrowed, tormenting him, driving him mad. Anatoly couldn’t handle it any longer. His duty was to force the Teutons out of their burrows, but what was he doing here? Wasting time, just like every other day!\n\n“Come out, you rats!" he screamed. "Come out so I can kill you!”\n\nAnatoly felt the butt of a rifle jam into his chest and two hands grab his collar. The Sergeant was livid. “Private Dyushev, you fucking idiot! Don’t you know that there are partisans?” The voice of the sergeant echoed through the square like Anatoly’s taunts.\n\nThe sergeant could only hear the fading echoes booming through the air, then; nothing. Likewise, his anger faded and was replaced with the same feeling; the terror of unfulfillment and fatigue that Anatoly had just outburst over. The sergeant let go of Anatoly and shook his head in resignation.\n\n“Don’t you dare tell anyone about this incident.”"
 OMS_great_trial.18.a:0 "What good are soldiers if there’s nothing to fight?"

 OMS_great_trial.19.t:0 "Those Who Fought For Love"
 OMS_great_trial.19.desc:0 "Pavel had simple orders from the Black League: call the partisans in this village to fight against the Teuton. He was trained to fulfill this one order, and he carried it out wholeheartedly in the early stages of the Great Trial. He knew these partisans and he knew this village for they were like family to him. Months ago, he remembered everything about them, and grew to love them beyond their patriotism: their hospitality to him, their camaraderie, their total resolve in years fighting against the Teuton. It was a shame to Pavel that the Glazoverkh denounced Communists as decadent and Muscovites as irredeemable, if only the Glazoverkh knew who those Partisans really were.\n\nRegardless, there was a mission to complete, and it started in the village. The moment he took his first step, he knew that by the time he returns back to his seniors, they’ll have him shot.\n\nPavel forced himself to continue walking, scanning the bombed roads and the husks of peoples’ homes and livelihoods, torn by warfare. He could only hear the howls of the cold winds and the rustling and crumbling of the debris which covered it. It took him only ten minutes to find what he was looking for; an unassuming store. Pavel entered quickly and immediately walked to the back of the store, his eyes pointed at the backroom storage door. He knew that all it took was two words, before he could meet their smiling faces once again.\n\n“Krasnaya Armiya”\n\nMinutes passed, and there was no response. Pavel entered the room, and went down to its basement, but he only found it abandoned. He felt a lump in his throat, and continued forwards.\n\nHe entered the Partisans’ planning room, where he got to meet Western Russia’s quiet defenders, but he only saw the smears of long-dried blood, and casings: Mauser and IzhMash. He couldn’t even see any bodies, but he knew that the people that he called comrades, the people who loved him like their son, were gone forever. Pavel picked up one of their armbands, red star painted, and gripped it in sorrow.\n\nThe Red Partisans were the closest to his heart, and he could never replace them with anyone in the Black League. So Pavel shoved the armband in his coat pocket, and set off to return back to his officers, no matter what awaited him."
 OMS_great_trial.19.a:0 "He wanted to return home, to meet his comrades once again."

 OMS_great_trial.20.t:0 "Our Eternal War"
 OMS_great_trial.20.desc:0 "They all swarmed around him like vultures as he sat patiently behind the desk. Slowly, the world wrapped its fangs around him, as the lights snapped on, the microphone began to crackle and the cameras began rolling. As an aide slid a single sheet of paper in front of him, his vision blurred and the letters swum. After choking back the bile in the back of his throat, Yazov’s eyes snapped open and once again, he spoke.\n\n“Comrade Russians. The Great Trial marches ever onward. Every day, the Motherland swells with pride to know that all brave sons of Russia have answered the call, and now march on a holy war to annihilate the German parasite. With every inch of stolen soil reclaimed, the honour of Russia is restored.\n\nHowever, an ugly beast has once again reared its head. The spectre of defeatism. Not by any fault of men at the front, but by the insidious plotting of cowards in the dark, the Great Trial grinds to a halt. They deceive true Russians with their honeyed words, claiming our war is futile, even cruel. Such creatures are as detestable as the collaborator, scarcely a step above a German, as they aim to break the Russian spirit itself. Be vigilant, comrade Russians, for it is your duty as Russians to expose these traitors and stave off their lies. A noose has been tied for each and every renegade, awaiting only their necks.\n\nAnd remember, comrade Russians, this is the war that has always been. From Aleksandr Nevsky to Tsar Nikolai, the plains of Russia have been marked by the shadow of our struggle against the German dogs, as this war passed through generations. Even after swallowing bitter defeats without end, the Red Armies of Bukharin and Voroshilov gave their blood and tears to Russian soil, against a thunderstorm of steel and fire, before passing the torch of war to us.”\n\nYazov’s brow hardened as he leaned into the microphone, slamming his fist on the desk as he spoke the final words.\n\n“Russia has always fought this war, and will continue to fight it. The Great Trial is all that there has ever been. If it takes ten years, or ten thousand, every inch of German flesh shall rot beneath our triumphant boots.”"
 OMS_great_trial.20.a:0 "Forevermore."

 OMS_great_trial.21.t:0 "Misgiven Trust"
 OMS_great_trial.21.desc:0 "Adrian Volkov hurriedly stepped into the town square of the village, recently liberated by the Black League. The streets were entirely empty, no one in the small settlement had left their homes since the last Wehrmacht company abandoned the town. Adrian figured they were likely too scared to even notice the lifting of the jackboot from their necks. He walked along the desolate street in a stern, speedy gait, entirely alone but moving with the same vigilance expected from a formal march.\n\nHe passed home after home, barely paying attention to them as he continued down the road. Finally he found a man, gathering water from a well near his house. Adrian approached, the silence in the streets accentuating the clacking of his boots against the stone beneath him.\n\n"Comrade! I was hoping you could help me with something!" As he called out to him the man seemed startled. As Adrian grew closer he pulled a photograph from his pocket and showed the villager. "I was hoping you could help me find these two," He pointed to a smiling couple with a small boy next to them. "They should be somewhere in this town, though older than in the photo of course." The man did nothing but stare. "Comrade, please, have you seen them?"\n\nThe man gazed at Adrian as he stumbled through his words. "T- Tut mir leid, ich spreche kein Russisch." Adrian stumbled backwards away from the German. His mind raced. Why was a Teuton civilian here? Then, for the first time since entering the town Adrian truly looked at the buildings around him. His rush-induced tunnel vision dissipated as he studied them more closely. He found German architecture and beaten crooked crosses adorning them. His face turned completely pale as the reality of what had become of his home dawned on him.\n\nThe man kept pleading, "Bitte, ich-" he was interrupted by a shot ringing out from Adrian's rifle. A woman left the house behind them and screamed at the sight. Adrian turned to face her. Inside he could see a portrait of Hitler adorning the mantle. He again aimed his rifle and shot, his eyes entirely cold and lifeless.\n\nThe cracks ringing through the village wouldn't end until well past midnight."
 OMS_great_trial.21.a:0 "Vengeance, at the cost of his soul."

 OMS_great_trial.22.t:0 "Minesweepers"
 OMS_great_trial.22.desc:0 "Klara scanned the line of fellow prisoners who had joined her. Most of them carried the bloodied marks of torture, all of them were withered beyond belief. She was no exception. Some were old enough to be her grandfather. Many were young enough to be her children. If it weren’t for the weeks of sleeplessness, hunger, and pain, she would’ve burst into tears then and there. Instead, she turned back towards the sergeant. A well built, intimidating man with a penchant for suffering, he made the perfect leader of this “internment facility” for captured Germans like herself. And with a sadistic smile, he began to address his most hated subjects...\n\n“Teuton scum! We are here today to offer you something. You see, although you are all worthless and evil now, the Black League believes that anyone can achieve redemption. Now, we will determine who is worthy of it. You see that hill in the distance? Anyone who makes it to the top will be released from here and enlisted into the army immediately. There is one... small issue, however.” The smile on his face grew larger. “...There’s a minefield in the way, and I don’t know where the mines are.”\n\nKlara’s soul shattered. She had expected to die here, but not like this. Anything but this. As her innards writhed in agony, the demonic creature standing before her continued...\n\n“That’s where you come in. Make it through the field and earn your freedom. If you don’t, well, that’s just one less mine I need to worry about. Anyone who does not walk forward on my command will be shot. Oh, and if you don’t mind, we’ll be recording your “valiant” redemption for all the world to see. Ready!...”\n\nKlara wanted to run away, to scream, to cry, to fall over, to do something, anything, that would prevent, even stall her fate. But she couldn’t. She had heard what happened to people who tried to defy the League. It was one of the few things that still sickened her. All she could do, with the hill in her eyes and the sergeant’s cackles in her ears, was walk forward...\n\n“...March!”"
 OMS_great_trial.22.a:0 "...and hope for a painless death."

 OMS_great_trial.23.t:0 "Battle on the Ice"
 OMS_great_trial.23.desc:0 "[Change Later]"The brackish waters of Lake Peipus lapped gently at the sandy loam beneath the Glavkoverkh's feet. They were a disappointment. Polluted with industrial runoff and garbage, the lake stank of rotting fish and urine; plastic bags and rotting food collected in the grass at the water's edge in molding clumps.\n\nYazov sighed. His ears burned as the wind bit at exposed skin, and his fingers stiffened in frozen agony  within mink-fur gloves. "I shouldn't have come here." He turned to his attendant, a nameless bodyguard with a boxer's build and a missing tooth. "I've wasted the League's resources clearing a safe road for my attendance today. And for what? An indulgence." He paused, and looked back at the faecal-brown water. "Another provocation. Another sin perpetrated against our sacred motherland, against the Russian national body. I came here searching for a symbol of our history, and have found only a crime scene."\n\nThe bodyguard remained expressionless. "I'm not here to judge you, sir."\n\n"No, I claim that duty for myself, and myself alone." Yazov snarled. "Symbols are for the weak. They are the bilious discharge of propaganda, and if our civilization was as strong as we must be in the coming days, we would reject them out of hand!" Yazov ground his teeth together. He clenched his fists, threatening to tear out the stitching of his gloves. "A great victory was won on this frozen lake, long ago. And Russian blood was shed to defend Russian civilization, before Russia called itself Russia. But in these days, every inch of our home is soaked in the blood of patriot-martyrs. To elevate one great victory only displays my own disrespectful failure to honor our comrades who completed their final duty."\n\nYazov turned his back on the stinking morass, and began the march back to his motorcade. "With me, comrade soldier. We will not honor Alexander Nevsky's legacy by fawning over a pool of water."\n\nAs he walked, he thought of German knights run through with spears, choking on their own blood, praying to a corpse. He thought of the Livonian Order, extinguished and replaced by Slavic settlers. And Yazov's thoughts turned to Germania."[Change Later]"
 OMS_great_trial.23.a:0 "Everything sacred is already exhausted, every hope extinguished."

 OMS_great_trial.24.t:0 "The Glavkoverkh Speaks"
 OMS_great_trial.24.desc:0 "[Change Later]"Comrade Russians, The Great Trial is upon us.\n\nMore than thirty years ago, the true path of history was altered forever. Our Motherland blossomed in the company of its people, awaiting what was to be her glorious destiny. In a just world, the Russian Eagle would perch itself above the world, gazing benevolently upon her domain and exorcising its will freely upon the World.\n\nThen, the Führer's armies, ignited by hatred and an unstoppable thirst for blood, tore through our lands, leaving nothing but ashes and ruins in their wake. The Third Reich of Germany defiled history itself when it stole from us our sacred destiny. They tore down from Russia's people are rightful place as the Earth's Hegemon.\n\nAs a generation of Russia's people lie beneath our soul, another has risen to exact the Motherland's vengeance upon the wretched Reich. I ask of you, my sacred people, Kill! Kill for your Motherland! Count not the days that have passed you by, but by the number of German lives you have ended!\n\nIf your rifle is loaded, empty it into the enemy's chest. If your bayonet is clean, smother it with the blood of your ancestor's killers! If you possess not a weapon, then you will use your hands to rip and tear the Teuton's flesh off his bones. Use every action necessary to exact your revenge upon the Monsters of Prussia!\n\nFor those who believe they cannot take a life. For those who lack the capacity to right the great wrongs of our history, remember that If you do not kill the German Soldier, he will spare no mercy in taking your life. If you do not bury his offspring beneath the Earth, then he will massacre your children! If you do not kill his wife, she shall bear the German race on forevermore!\n\nKnow this, Comrade Russians. We have waited three decades to get our chance at reclamation. Only when the concept of "Germany" has been buried beneath the great monolith of history can our sacred Motherland know peace. From today, Comrade Russians, the Great Trial has begun! Glory to Victory! Glory to the Black League!"[Change Later]"
 OMS_great_trial.24.a:0 "§RVengeance. Vengeance, through any means necessary.§!"

 OMS_great_trial.25.t:0 "A Letter Of Intent"
 OMS_great_trial.25.desc:0 "“To the damnable government of the Greater Germanic Reich,\n\nIf you wish to avoid the destruction upon your nation which will surely be wrought by failure to comply, you will adhere to the demands which have been listed in this letter. Any response other than complete assent to our requests will be cause for immediate and total war against your abhorrent nation.\n\nFirstly, the Black League demands the prompt return of all German Reichskommisariats in Eastern Europe which house Russian or otherwise Slavic populations to the control of the Reclamation Government to be reincorporated as territory of its administration. Any German colonizers present in these lands are expected to return to Germany within thirty six hours or face immediate execution for the raping of the lands which they occupy.\n\nSecondly, the German Reich is to immediately and without protest present the officials currently holding any and all higher offices of its state, including that of the Fuhrer, to the Black League for immediate military tribunal. In addition, the German people must unilaterally be found as guilty of genocide and destruction of the Slavic and Russian peoples and be sentenced to pay collective reparations of at least one hundred billion Reichsmarks. Payment in full to the Russian National Reclamation Government is expected no less than ten years from today.\n\nFurthermore, the organs of state of the German Reich are to be placed under direct control of the Russian Government for inspection of their heinous and undeniable crimes against the world and sacred Russia. Black League officials are to oversee the trial of these state organizations and their administrators.\n\nThe National Socialist German Workers Party is to be immediately disbanded and any who hold membership are to be banned from holding public office. A complete list of these rats responsible for destroying the Russian nation is to be sent to the Black League for inspection and to do with as it sees fit.\n\nFinally, the German government is to formally and unconditionally surrender to the Black League. The full punishment of its people is to be determined by the Russian Government at a later date.\n\nWe await your response.”"
 OMS_great_trial.25.a:0 "“They can't be serious, can they?”"

 OMS_great_trial.26.t:0 "One More Job"
 OMS_great_trial.26.desc:0 "Sergei was sitting with his comrades, after a long and tiring day. It was, surprisingly, a quiet week on that side of the frontline. No reports of any counter-attack by the Germans, and the General commanding his division had ordered them to dig in and defend the position until they had an opportunity to attack. Some of the lads were disappointed, but Sergei felt it was a great opportunity to relax and play some cards. They'd listen to the radio, but all that old thing could play was a transmission of Sacred War from an army station nearby, and frankly, everyone was tired of listening to that.\n\n"Hey, you!" — Sergei heard, immediately turning his head at the sound's source. "The soldiers need you on the other side of the camp to carry a corpse. Apparently, one private there decided to kill himself."\n\nSergei felt annoyed. They always called him for this kind of task. He would protest, but he knew his opinion didn't matter, so he got on his feet and headed over to where the corpse was.\n\nHe was pretty much used to it at that point, but it was still a disgusting sight. The young soldier, possibly 15 to 18 years old, had shot himself with his handgun, with the bullet going through his mouth and up into his brain, apparently having fired the gun right below his chin.\n\nSergei really didn't have much time, and decided to drag the body to a nearby mass grave. After slightly raising him by his legs, Sergei noticed a small book falling off the corpse's pockets. He picked it up, noticing it was a diary. Sergei was intrigued, they almost never found something interesting on that side of the front. He put the diary inside his jacket's right pocket, so that he could read it later. Sergei was eager to learn about the experiences of another soldier, but he didn't have the time for it at that moment. For now, he had a corpse to carry.\n\nAfter launching the corpse in that dig, reuniting him with his comrades, Sergei headed back to his friends. Night was about to fall, and he still wanted to play cards before it was too late."
 OMS_great_trial.26.a:0 "Nothing matters any more"

 OMS_great_trial.27.t:0 "If You Gaze Into The Abyss..."
 OMS_great_trial.27.desc:0 "00:53\n\nDay 1: My name is Alexander. This is officially the beginning of my diary. Today, I have enlisted in the National Reclamation Army. I am happy to be fighting for my motherland and helping the Black League destroy the Teuton threat. Tomorrow I will be starting my military training, and hopefully, join the front lines as soon as possible. I shall make my family proud by fighting the Germans in the Great Trial. Glory to Russia, indivisible and invincible.\n\n20:24\n\nDay 2: Today was my first military training. We started off by doing the oath of allegiance to the Black League. It was glorious. After that, we started the drills. They were very tiring, but they are necessary, for they will turn me into the ultimate killing machine in the Great Trial. When the sun went down, the lads lit a campfire and we burned a German flag. It was a great day, but I expect to honor Russia by joining the frontlines soon.\n\n04:36\n\nDay 36: In the preceding days, I have finished my training and finally been sent to the frontlines, near the German border. Upon arrival at the military camp, I realized things weren't as I predicted. I was assigned to a platoon dedicated to searching newly conquered settlements and eliminating threats hiding inside places our frontline divisions couldn't afford to get into. I was disappointed, but I understand someone has to do it. For Comrade Yazov. For Russia.\n\n23:59\n\nDay 40: Today, I killed a German for the first time. Our platoon entered a government building to search for any possible threats, and we found two German soldiers hiding in one of the rooms. Gunfire ensued as soon as our comrades saw the Teutons. We managed to kill one of them as soon as the shootout started with three bullets in the chest. The other soldier was wounded in the leg and dropped his weapon while crawling inside another room. I ran after him and shot him. I know I did no wrong, he deserved it. After all, he was a German. He made us all suffer for so long... But as I looked into his eyes, as I saw the light fade away... I pitied him. I did the right thing. I'm sure of it. I'm helping save Russia."
 OMS_great_trial.27.a:0 "“This is getting interesting.”"

 OMS_great_trial.28.t:0 "...The Abyss Will Gaze Back"
 OMS_great_trial.28.desc:0 "23:34\n\nDay 47: I'm writing this right after I arrived at the camp. I don't know who else to talk to. Today, we found a family of Germans hiding in their house. I was surprised, but I didn't really think much of it. I don't know...What I did...I feel like a monster. They made me kill them. They made me shoot them all. The woman, the children...I can't take it anymore. Everytime I close my eyes, I see their faces, begging for mercy. But I had to, didn't I? I had to do it, for...For my sake. Otherwise they'd kill me too! The blood, the suffering...Out of all of them, the children were the ones who screamed louder. It was so loud. I can still hear their screams...They haven't stopped ever since we left the settlement and it's driving me insane. Am I really on the right side? They were Germans, but they were unarmed. And the children...They didn't deserve that. Maybe...They all deserved it, right? Right? May God help me.\n\n22:53\n\nDay 61: Today marks 2 months since I decided to join this godforsaken army. The screams have not stopped. They keep playing in my head, like a broken record. Today, we rounded up around 20 civilians, pushed them into a trench, aimed at them and held the trigger. The screams intensified after that. Every day, they seem to be getting louder, and louder...As if many people were screaming at once. I have been unable to sleep for several days, because every single time I close my eyes I see all of them. Everyone, dying by my hand. I did horrible things to innocent people. I was just following orders, wasn't I? I believe that, but the voices keep telling me I'm a monster. How is it possible that I'm hearing voices over all of this SCREAMING? Somebody help me, I can't take this anymore.\n\nNight\n\nDay ?: I have no idea what day it is, all I can tell is that it's night. I can't leave my tent anymore. They scare me. I see them, lurking outside, in the middle of the fields, waiting to punish me for what I have done. I have killed so many of them. The voices don't stop, they won't stop. They keep telling me it's my fault...Someone please help me, please...For whoever is reading this, don't make the same mistake I did. I will find peace in the only place I can, and find forgiveness for my sins...I'm sorry, little children. I'm sorry, Russia. And good riddance, Yazov and your filthy lies."
 OMS_great_trial.28.a:0 "“I could've slept without reading this.”"

 OMS_great_trial.29.t:0 "Arise, Motherland Of Mine!"
 OMS_great_trial.29.desc:0 "“You can’t do this,” his mother howled, “He belongs right here with me, not in some godforsaken German ditch.”\n\nTimofey didn’t struggle as the officers seized him firmly by the arms and pulled him from his apartment. After living under Yagoda’s tyranny for most of his life, he knew better than to resist.\n\n“Your son is a man, comrade citizen,” one of the officers, Lieutenant Chekov, was trying to explain to his mother, “He must fulfill his duty to the Motherland.”\n\n“Look how young he is,” she sobbed, “How weak he is! He’s not even fit to hold a gun!” As if to prove her point, she started desperately hurling punches at Timofey. Before she could strike him, Chekov clamped her fist in his own.\n\n“The Great Trial waits for no-one, comrade citizen,” Chekov explained patiently, “When the Motherland calls, we answer.”\n\n“To hell with the Motherland!” She screamed back at him, “To hell with the Germans, the League and your Great Trial! Give me back my boy! He’s mine!”\n\nBefore Timofey could hear Chekov’s cold response, he was bundled out of the apartment and into the stairwell. As he felt the icy eastern air screaming upwards, he saw black fists beating on every door, on every level. Green boys to weathered old men were all being torn from the warmth of their bed by the Glavkoverkh’s hungry fingers, spirited away into the night by a sea of shadowy silhouettes.\n\nAs he was marched down the stairs, Timofey was herded into a stream of boys just like him. Exiting the building, they saw fat trucks, bursting with Yazov’s thugs. Rivers of black poured across the streets, wielding bright flashlights and kicking down doors with iron-shod boots.\n\nAs the boys quietly sat there, a sleek, black car emerged from the darkness, its headlights blinding them. After it came to a graceful stop, a slender figure stepped out of it, snowflakes crunching under his leather shoes. The two soldiers that remained stood to attention and saluted the general as he regarded the newest recruits with disdain. He spoke up, mentioning a name none of them had ever heard before."
 OMS_great_trial.29.a:0 "“Send them to Vorkuta.”"

 OMS_great_trial.30.t:0 "Purpose in Hate"
 OMS_great_trial.30.desc:0 "Anatoly barely remembered his home village. It was a small little place, just outside Kursk. He couldn't have been much older than five when he was forced out of his home. The only thing he truly remembered was leaving. The smell of smoke and gunpowder through every street, screams echoing from across every building. As he left the village in a crowded truck he even saw, just for a moment, the first Wehrmacht companies entering the town.\n\nHis family had escaped by the skin of their teeth, narrowly avoiding the earliest days of the Luftwaffe bombings, eventually, coming to Tomsk. Life became almost peaceful in Pasternack's Republic, but even that wouldn't last. The assault from further east once again thrust him into the middle of war, but this time he decided to remain in his home, and as the writer's state collapsed on itself and throughout the Smuta, Anatoly felt nothing but shame at his people's self-destruction.\n\nYears later when he laid eyes on the first Black Guard unit in the streets, he felt that same contempt of the Russian people tearing themselves apart. However, that changed as he witnessed them offer the defending soldiers amnesty for a place in the League. And as his city was swiftly remade in the League's vision, slowly, Anatoly was as well.\n\nThe radio addresses he listened to spoke of nothing short of complete devotion to vengeance against the German, true unity in struggle amongst Russians. The very thing Anatoly wished for was now mandated by the will of the Glavkoverkh. He became fully devoted to the Black League and the Trial, address by address and speech by speech. His suffering fueled frustration became directed fully toward duty to the League as his heart filled with cold, unwavering rage.\n\nHe saw now that all the League had done was in the name of the Great Trial, to liberate all under the Germanic boot. The Black League's actions were not only necessary, but just. For the first time in many years Anatoly felt pride in being a Russian again. He was grateful for the newfound direction in his hatred. The Reclamation Government was fighting a sacred struggle, and he was truly thankful to be part of it."
 OMS_great_trial.30.a:0 "The echoes of all that was lost ring through Russia."

 OMS_great_trial.31.t:0 "The End Rimes"
 OMS_great_trial.31.desc:0 "It had been several long days on the road. When word got out of the League’s plans to finally use their nuclear arsenal, everything went to shit. Entire towns emptied underground, people running for the wilds, and mass desertions. Pyotr was one such deserter, having stolen a motorcycle and jerry cans to last him through his final mad dash across Russia. He had been driving north nonstop, only stopping to eat his now-meagre rations. There was only one plan on his mind, the only possible way to get out of this ordeal alive, and with every turn of the motorcycle’s wheels, he prayed for it to all work out.\n\nAs the sun began to rise, Pyotr feared he would be too late. He began to speed up even more, his unsleeping eyes dead ahead as his destination came into view beyond the early morning fog... Arkhangelsk. He once again hoped and prayed to God, Jesus, and all the saints in the world that Andrei would be there waiting for him. He promised him, he did. He would never abandon Pyotr, he’s a good man. Even if the others wanted to leave without Pyotr, Andrei would convince them. He was a good navy man, he had sway, he had power. He had to be waiting there.\n\nPyotr rode into Arkhangelsk at full speed, his eyes focused only on the road as the city’s dead silence greeted him. Everyone was gone now; either to the bunkers, the wilds, or the sea. He continued down onto the docks, where the sight of a large steel vessel still docked in port made him cry tears of joy. He wiped his tears off as he got off the motorcycle, taking what was left of his meagre possessions as he ran faster than he ever did in his life to the ship. He looked up at the men on the deck, locking eyes with Andrei as a smile crossed both of their faces. The bridge quickly lowered for Pyotr as he got on, embracing Andrei and the rest of his comrades. Come hell or high water, they would be together for this one.\n\nAs the ship cast off, Pyotr tightened his coat as he looked back at his motherland. A feeling of dread overcame him, as the shore receded further and further beyond his sight. He took a deep breath and closed his eyes as sirens began to sound off in the distance, and hellfire rained."
 OMS_great_trial.31.a:0 "Deign to save the suppliant soul."

 OMS_great_trial.33.t:0 "The Liberation of Volgograd"
 OMS_great_trial.33.desc:0 "Not many times have two armies met with such vicious hatred that the only memento of their engagement were the smoldering remains of what were once people. The ravenous hostility bursting out from the Black Army had caused them to furiously bombard the city of Volgograd without any real objective other than to rack up the highest body count as fast as possible, no matter who was on the receiving end of the strikes.\n\nRussian forces held a small victory parade in the town square, with not a mouse cheering for their arrival. The residents of the cities held fast in dread and fear. The men of the army considered turning their guns on the civilians, but the generals decided not to waste any more bullets today. After all, there was still the march to Germania to consider, and the League was not one to waste.\n\nAs the Russians geared up for the next advance, German radio chatter flared up with panic-stricken soldiers and officers running for their lives from the Black Army, giving ghastly accounts of the horrors that they had just faced. Diplomatic cables from Ukraine and Caucasia were sending alarm signals to just about every channel within Neu Berlin that the machines receiving them were on the verge of exploding on the spot.\n\nA terrifying trepidation silently fell across the world as all eyes were on the war. For those that listened, a realization crept into their minds, raging like the metal seas that washed over eastern europe. Perhaps...Perhaps this might be the last war. For Germany, for Russia, for the world."
 OMS_great_trial.33.a:0 "No Mercy Under the black flag."

 OMS_great_trial.34.t:0 "Ashes to Ashes"
 OMS_great_trial.34.desc:0 "The fire burned brightly, creating a strangely comforting afterglow. Leonid Pesterev looked upon the sight with a sense of marvel. How easy it was, for a city to burn, especially one as filthy as Adolfsburg.\n\nHe watched as prisoners dressed like tattered grey effigies of the Wehrmacht ambled past towards a large hall, the remnants of a town hall. His comrades herded the scum into the hall and for those that resisted, they received a rifle butt to the face and were thrown in after.\n\nAs the last of them was shoved in, Leonid took out a molotov cocktail he had prepared earlier, as did those around him. He lit it and tossed it towards the building. The drywood caught fire quickly. He could hear the desperate wails of the filth inside the hall, it was much sturdier than it appeared to have held up against the ceaseless pounding of the damned within it.\n\nSoon the screams stopped, the sickly smell of charred flesh wafting through the air. Leonid looked on with impassion as the flames grew brighter, flying higher as they attempted to ascend. The flames died out after several long minutes as the ashes slowly drifted down like tattered grey snow.\n\nLeonid recalled a life long past, one where he had a family. It was good, but it was gone. He remembered the day when men in grey uniforms came to his village. He remembered the cries and screams of despair of his mother and sister as they were taken away. He remembered the all-too-familiar smell of burnt flesh as he hid under the floorboards of his burning home. He remembered.\n\n He could see an arm twitching amidst the pile of bodies, and he pulled away the burnt corpses to uncover it. A youth, no more than eighteen years of age was revealed, his stark blue eyes filled with fear.\n\n“Bitt- Please, no more Kamerad, nein, NEI–”.\n\nLeonid thrusted the bayonet through his head, it was almost effortless. He watched as the body stilled, perhaps this would have been his fate if he had not been so lucky as to escape the eyes of the rapacious Nazi scum. He looked towards the burning city, mesmerised by its collapse into ruin."
 OMS_great_trial.34.a:0 "Earth to earth, ashes to ashes, dust to dust."

 OMS_great_trial.35.t:0 "A Rude Awakening"
 OMS_great_trial.35.desc:0 "Gotthard woke up to the blasting of bombs overhead.\n\nIt shook him out of bed and rushed him outside. Seeing the bomber fly and whizz overhead brought him back to the old days when he himself was able to do such things. The power he felt as the bomber flew through the air, wreaking havoc over the cities across the East. Of course now he was in his twilight years and wasn’t the same man he was twenty years ago.\n\nThe near constant barrage of high explosive bombs lit up the Germanic side of the city. Lighting the churches ablaze along with the markets. People inevitably were running to the air raid shelters as the haze of his mind was broken by the loudness of machine guns firing down and pelting people. He ran towards the hospital, surely they would not fire upon a building bearing the red cross.\n\nSuddenly a large explosion almost seemed to rock the Earth, coming from the hospital. Gotthard was knocked to the ground as the glass was blasted from the hospital. It crumbled, slowly falling to the ground as the street was coated in a thick dust. Gotthard didn’t even notice that his leg was full of glass alongside most of his body.  He passed out shortly after the fact.\n\nWaking up he felt a little better. The pain still was all around his body; however there was a sweet looking face tending to him. The kind woman took a pitcher and made a cup of what he assumed to be tea. He glanced around to see other people laying on stretchers. Gotthard gripped the glass the kind nurse gave him. “I see you still have your strength” she said as the young woman chuckled. Pouring the tea down his throat the warmth began to offset his pain with soothing peace."
 OMS_great_trial.35.a:0 "It was broken by more bombs."

 OMS_great_trial.36.t:0 "The Streets of Moscow Run Red"
 OMS_great_trial.36.desc:0 "Gotthard woke up again, clutching a dirty kitchen knife to his side, it had been all a blur to him when the Black League invaded Moscow. Laying amongst the rubble he had to get into the sewer lines. If he could not then surely he would be captured and most likely executed there on the spot. He had seen so much in the few days he was able to walk around.\n\nThere was the looting of the German side of the city, the taking of men from their families and being rounded up. There was always the loud rang of machine gun fire after such things. But, as the occupation continued hopes were dashed that Germany would be able to mount such a counterattack against the League.\n\nDeciding to take his chances he exited the safety the rubble had given him for a brief respite and ran towards a shell crater exposing a part of the open sewage line. Crouching into the filth and sludge filling the drainage pipe he could remember other things the occupation had given to him in those early days. The images of children being shot alongside their mothers much to the chagrin of the Black League soldiers had horrified Gotthard.\n\nOf course he had bombed cities and towns and surely it had killed at least one person but this, this was entirely different to him. Crawling through the blood and bile filled system a flash of light grazed his face. Russian shouting began to fill the pipe as he was ordered out of the pipes."
 OMS_great_trial.36.a:0 "His lucky streak had ended."

 OMS_great_trial.37.t:0 "The Second Day of the Rope"
 OMS_great_trial.37.desc:0 "Gotthard was in a line, not like the lines of bread his fellow Germans had wanted during a state of national emergency, Gotthard was in line to be hanged alongside an almost endless line of German men. A Black League cadre commander espousing in Russian things he could not understand. Whatever it was he was saying, there was indeed great passion under those words.\n\nAnother drop of the handle, and more men were hung.\n\nGotthard looked around, was everyone just going to watch this happen. Of course some were cheering and clapping merrily, but most were walking along the bombed out streets of Moscow. The man in front of him turned his head to the side and said “Hey, I’m running, want to come with?”\n\nAnother drop of the handle, and more men were hung.\n\n“What no, surely we’d be shot” Gotthard stated rather frankly. “We are dead men already, I’m just going out on my own accord” and with that the man ran to his right only to almost instantly be rained down upon by machine gun fire. Bullets riddled the man’s corpse and he was dead before he hit the floor.\n\nAnother drop of the handle, and more men were hung\n\nIt was his turn to step towards the gallows. He walked up the makeshift steps and looked around him one last time. Finally he looked at the heavens, to see if divine fate would save him and that God himself would take pity on a man such as himself."
 OMS_great_trial.37.a:0 "He dropped like the rest."

 OMS_great_trial.38.t:0 "There Will Come Soft Fog..."
 OMS_great_trial.38.desc:0 "Creeping its way across the sleeping city of Konigsberg was an early morning fog, blanketing the city–like a butterfly lying in wait inside its cocoon. Only the residents up before the sun witnessed the eerie, yet mesmerizing work of art created by what seemed like unearthly powers. As the fog rolled its way covering the entire city, it was only until then that the sun began to find itself creeping over the horizon, penetrating the fog with sharp beams of light–creating a sight that some would have thought was a work of God alone.\n\nBut there came a strange, eerie feeling as the fog remained hovering amongst the city. As if it was an ancient omen letting the people know that there was malice afoot. That there was no safety, no escape from the ill-intentions of others. The front was hundreds of kilometers from the city, however. Why on Earth should anyone be afraid? None of the residents, nor the military for that matter were sharp enough to pick up on mother nature's cries of fear.\n\nBefore long, it was midday. The morning fog had passed and the city was bustling with activity, as it usually is when the sun is shining above them. The day was set to be yet another unremarkable day in history, with residents and visitors alike moving within the cities streets, doing their day-to-day lives without any sort of fear–save for the war, of course.\n\nAs the sun started its descent back down beyond the horizon, a line of trucks dotting the highways made their way westwards into the city. They appeared to be yet another normal military convoy set to resupply on goods to be sent back out east, just another cog in the machine after all. As they entered the city that had instead spread themselves out amongst the city, placing themselves in strange locations. In front of schools, government buildings, military bases, and residential areas did these trucks find their destinations. Yet none thought to ask the drivers what they were doing. When the sunlight finally faded away until tomorrow, new bursts of orange glows littered across the city–and died out as quickly as they came.\n\nAfter all was revealed, another soft fog had clouded itself inside the city–out of nowhere it seemed. It was as if this fog wasn't ordained by God Himself, but of man. A malicious one, at that."
 OMS_great_trial.38.a:0 "Something's wrong."

 OMS_great_trial.39.t:0 "...And Bringeth The Taste of Metal"
 OMS_great_trial.39.desc:0 "Within hours, the entire city of Konigsberg was dead. Desolate. From one end of the city to the other, not a single living, organic creature or plant was taking their required breaths. There was nothing but the soulless emptiness of silence. Not even God nor Mother Nature herself decided to make a sound either, as the thick, cloudy fog sat itself faintly upon the city.\n\nNot before long, trucks kitted out with lead plating, and men cladded with hazmat suits and gas masks sped their way into the seemingly abandoned city. As the trucks approached the gates of the city, in droves of hundreds lie unmoving squirrels, birds, deer, cats, dogs, people–all of God's earthly creations lie as if they had all simultaneously met their maker.\n\nWhen the men entered the city proper, they had finally met the most dreadful of sights. Men, women, children, all strewn about like a bunch of ragdolls had been dropped from the sky. Some died clutching their throats, some died holding on to their loved ones. Most died alone. All of them shared the same fate though: unimaginably painful radioactive burns.\n\nAnd as the men began documenting the utter destruction of an ancient city, there was one–just one–question lingering in the thoughts of everyone there"
 OMS_great_trial.39.a:0 "What hath man wrought?"

 OMS_great_trial.40.t:0 "Nothingness Under the Earth"
 OMS_great_trial.40.desc:0 "Artyom eyed wearily around, being a guard of these bunkers especially ones so close to the front was not an easy job. There were common events that would occur such as someone attempting to steal all the food, even though they clearly had enough. Artyom didn’t enjoy shooting people, especially Russians. He tried to think of these people as German agents but time and time again he would hesitate to take another human life even leading to him getting a demotion for his actions. Apparently he was not as tough as the average Black League soldier, and it showed. \n\nSometimes while he stood outside the bunker he would wonder what would be happening inside of it, he saw many men coming in and out. Stocking food perhaps or maybe just putting finishing touches on it. Although slightly disillusioned with the way of things being run he still could find enjoyment  in his thoughts and of what could be down there. On one particular day the excitement of thought captured him and he decided to go inside. \n\nFollowing the workers to “check up on anything wrong” he was surprised to see how small it had looked, the propaganda had made the bunkers seem like labyrinths of concrete but this... This looked like it wouldn’t even hold a thousand people. “Would the Black League, would Yazov do this?” Artyom thought to himself. “No no clearly you just need to go further and there will be more” And so he went deeper and deeper into the facility. And yet it was all unfinished, he thought the war would break out in less than a month now and really there would be no way they would be able to finish this bunker. \n\nLeaving the bunker he exited and stood back at his post, the guard to the right of him responding \n\n“So how does it look? Good enough to watch the Germans waste away?”\n\nHe looked no younger than 17, Jesus were they conscripting that young. Artyom pondered before responding"
 OMS_great_trial.40.a:0 "“It’s just as good as the pictures.”"

 OMS_great_trial.41.t:0 "The Riot"
 OMS_great_trial.41.desc:0 "War had been going on for God knows how long. And while the Russian news spoke of the Russian victories Artyom knew that deep down it was all pointless however cynical he was, all of that was brushed away as people started to flock towards some of the little public shelters. The one he was stationed at number A-1684 was one of the unlucky few, however if he just explained to the protestors that they all would have a chance in the bunker. If he could just tell the lie maybe some dumber part of himself will believe in what he was working for. \n\nThat all came crashing down when a woman and her young child, maybe less than 10, appeared in the crowd, although it was disorganized and mainly full of those who were older. Aside from the few reluctant teenagers unwilling to join the army. \n\n“Please sir, my name is Alyona just take my child”\n\nShe picked up her child and amidst all the screaming and the shouting. Everything fell away, for once he had a choice in his life. He could either take the young boy and foster him as a new life. Or like everyone there he was to turn them both away, getting them to walk home once more back to their small little village which hadn’t changed much since Omsk’s control over it. \n\nHowever his time to decide ran out as reinforcements encircled the small throng of humanity. The commander of the garrison force had radioed for help from the local detachment near the front and soon enough. The firing soon began, like the Reunification Wars Russians were killing Russians once more. As the crowd dispersed quickly, he saw the young woman Alyona laying on the grass in a puddle of her own blood. Her son tugged at her and cried, as Artyom looked on. The kid was picked up and sent on his way back with the retreating crowd. \n\n“Fucking idiots they all are, why can’t they just trust the army” Blurted out from one of the advancing vanguard. “I mean we’re liberating Russia here and these liberals want to live in the bunkers? What a load of shit am I right?” the soldier responded to Artyom."
 OMS_great_trial.41.a:0 "“Yeah... I guess it is.”"

 OMS_great_trial.42.t:0 "Finalé"
 OMS_great_trial.42.desc:0 "It was Artyom’s day off, a simple but welcome pleasure to his life with the Black League. As he walked down the main street getting looks from the onlookers, among the soldiers they privately did not want to enter town after what was being called “The Red Afternoon”. After getting a newspaper from the stand and paying for it, he sat down. Opening the paper as he would any other day, his eyes looked at the front headline. In large and bold letters it exclaimed “Königsberg Has Been Captured” seeing this he knew the inevitable was close to occurring. Although he had been taught about this by his teachers in Basic Training he could not fathom that it had happened so quickly.\n\nHe knew his world was ending, although the people around him didn’t seem to notice. In due time the well astute citizens would spell it out for them. He got up out of his chair and began to run towards the bunker he once defended, in his full military uniform. Although he used it for a discount, maybe it could even save his life. Countless thoughts were rushing throughout his head, he thought back to seeing the bunker for the first time. Was the construction still going on, or maybe it was nothing at all. Perhaps Germany would for the good of the world accept it’s natural conclusion. With a simple peace and Russian hegemony, as idealistic as it was, it was better than accepting the end of humanity as a whole.\n\nNearing the bunker Artyom found that there was an eerie silence to it all. Besides for the industrial sounds emanating from the bunker itself. It was calming, relaxing even as the wind blew through his hair as he drew closer and closer to the entrance his heart sank deep into its chest. The door was drawn shut, attempting to reach anyone there he at first knocked on the cold metal only giving him echoes. Hearing the emergency sirens begin to blare on and on as a cacophony of noise began to displace the silence with pure fear and terror. As Artyom sat near the door he imagined back to the woman who went to give her child to him. He wondered what he was doing in all of this, “I just hope he’s safe” his mind told him. As the blinding light flashed before his eyes. One last thought crossed his mind"
 OMS_great_trial.42.a:0 "I just wish I could apologize to her."

 OMS_great_trial.43.t:0 "Time was running thin on Oleg"
 OMS_great_trial.43.desc:0 "His job was simple, plain and simple. Take the chemical weapons found in the Black Mountain and use them against the Germans. An easy task in concept alone, to launch such chemical attacks upon a nation the likes of which would rival The Great War localized in a single empire. It would be the first masterstroke of The Great Trial and one to rival the “Blitzkrieg” the Nazis used to attempt the conquering of Russia.\n\nStaring at the map in mild disbelief he pondered what part or district of the city could be terrorized the most. Crossing his mind thoughts danced around his head of the Teutonic scum slowly choking on their own lungs slowly dissolving in their throats. The gas seeping through every corner of the streets and buildings. Creeping like a malignant ooze through masks and rags. \n\nLooking at the small instructional booklet given to him in code he soon deciphered the next few instructions. Finishing off the final touches Oleg masterfully plugged in code, taped in wires, and wound the watch on his hand so that eventually when the hands struck noon the device would go off. Packing the device away into his briefcase he set it aside on the floor next to his blanket barren cot, the springs rusted from age and coarse to the touch.\n\nSleeping on the cot in his rental for the month it was barren, spartan if one could call it. There were papers strewn about, propaganda from the League and ideological dog whistles and small wrappers of food. Parcels given to him by the League through postage. However the little the thin man ate he ate only what kept him healthy. Not indulging himself in the excesses as he saw the other German scum dine upon."
 OMS_great_trial.43.a:0 "He slept soundly."

 OMS_great_trial.44.t:0 "The Yellow City"
 OMS_great_trial.44.desc:0 "Klara arose at roughly 5:30 AM, early for most but not for her. Going through the daily routine was simple: she’d eat some toast and jam with a small hint of butter, finish her planning for the day and set out in her Volkswagen on the daily commute. The breeze softly caressing her face as the windows roll down she sensed excitement in the air.\n\nArriving at the school she taught at, she parked her Bug in the respective parking zone and walked inside the heavy glass doors. Passing room by room she checked the watch, 7:13 AM was plastered on the clock as she went into her room.\n\nOpening the door she saw once more how well her and her children decorated the room as it burst with personality. There were little drawings and past assignments posted stapled or drawn on the surrounding walls and the sun peaked ever so slightly through the half opened windows. Breathing in the fresh air she sat at her desk attentively.\n\nSoon enough the children started petering in.\n\nAfter the bell rang with an annoying clang the room fell silent. Addressing the class Klara spoke loud and concisely “Alright class let-” A large BANG rang out from the outside world the force of the explosion seemed to rock everyone to the core. Klara herself was thrown out of her chair and to the floor. After getting up she saw that at least all the children were under their desks. Hands over little heads, asides from the glass scraping the arm of one child relatively they were all ok.\n\nIn a shaky and shoddy tone Klara told the children it would be all ok and she would find out what was happening. Poking her head outside of the door the young woman eyed nervously around, the Russians surely have not invaded here and arrived this fast she thought to herself. As nervous thoughts danced around in her mind, she walked towards the once glass entrance doors, now shells of their former selves on the ground. The crunch of the glass as it stuck to her shoe sent pings of fear down her spine.\n\nAs she stared around her she saw a plume of smoke from the adjacent apartment building. However as she eyed the building another colored apparition floated through the air. A thickly yellow gas emitted from the hole in the building above. She immediately thought back to her father telling her of his experiences in the first world war. And what even was that awful stench she began to smell."
 OMS_great_trial.44.a:0 "And then she began to cough."

 OMS_great_stall.1.t:0 "A Weary Beast..."
 OMS_great_stall.1.desc:0 "Timofey and Alexei were profoundly exhausted, having marched 10 miles just today, but there was no rest for the wicked. “New orders from high command,” Alexei’s radio crackled, both men leaning forward to listen intently. “There is a German position in the lowland ahead, Number 3 Platoon will proceed along the side of the road to support the motorized troops. Over”.\n\n“I don’t believe it,” Timofey, the younger man, murmured miserably. “We've had no food or sleep in a day and a half! Constant German ambushes, counterattacks, snipers, and now they demand we just keep on marching like it’s nothing?! Just statistics to be drilled, dieted, treated like cattle, used as cannon fodder?” he ranted.\n\nAlexei listened quietly before replying. “Accidents are common on the frontlines,” the older man advised. “If a hand, maybe a foot were to get injured, it wouldn't be questioned.” He kept his tone even, eyes locked with Timofey. “They can’t starve and deprive us for weeks without expecting a few accidents to happen, no?”\n\nTimofey met his gaze. “And wounded soldiers need food and rest to get better, of course” he mused. “What’s the betting there’s going to be a lot of ‘accidents’ around here before long?”\n\n“You said it yourself,” Alexei replied, “we’re not cattle and we won’t be driven across the steppe like a herd. Hell, a herd might be treated better. But unless something changes, we’re going to see a lot of men break, or worse.”"
 OMS_great_stall.1.a:0 "Hate leads to suffering."

 OMS_great_stall.2.t:0 "...And An Uncomfortable Reality"
 OMS_great_stall.2.desc:0 "The door opened, and seemingly the air inside the room was sucked out. Evgeny barely heard the doorman call for him for his appointment. Appointment was a strong word, actually. It was a summons. \nHe stood up, attempting to suppress his nausea. He took one step forward, and another, until he walked in stride. Whatever his fate, he would not meet it with cowardice. Each door opened as if a portal to another world, each increasing in relative opulence to the next and the consecutive hallways almost seemed to expand in radiance and size. It all led to a throne room of sorts. Yazov had insisted his office be at the epicenter of the building. It was more bunker than  workspace, the result of his own paranoia. Pitranov witnessed Yazov pacing wolf-like next to a truly gigantic fireplace. It cast a shadow large enough to loom over the entire room. He swallowed hard. \n"Comrade Marshal. I have the report you requested of me regarding the economic state of the League and the lack of offensive progress." He stuffed his hands behind his back, praying the decorum would save him. Yazov continued his pacing, merely signalling for him to continue. "I'm afraid I have pinned the reason for our great stall. A state of exhaustion has taken over the economy. Circulation of money is almost nil. The people have hoarded their remaining material wealth. Our policies of austerity have taken a larger and earlier toll than normal. I fear if we do nothing and continue mass-spending on the Army, then..." \nPitranov's lip quivered uncontrollably as he finally saw Yazov face him. His face was lined with exhaustion, darker even than the shadow that appeared at his back. With bloodshot eyes, he made another quick hand gesture, and the blast-door Pitranov came through locked shut. \n"
 OMS_great_stall.2.a:0 "And whose fault is that?"

 OMS_great_stall.3.t:0 "The Wells Run Dry"
 OMS_great_stall.3.desc:0 "Petronov flipped through the binders and binders of names, graphs, and figures collated at his recruitment station in one of Samara's countless pre-built housing districts. It had been a quiet day, an abnormality for sure, one he lit a cigarette to calm the impending chiding from his superiors at the next Sub-District Recruitment Officer Summit a fortnight from now. However, as he continued flipping through the figures, a trend began to emerge, and suddenly, the issue seemed much more deserving of another cigarette.\n\nRecruitment was down, and unlike other periods, it was no longer a blip. Figure after figure, graph after graph showed the indelible downward curve, an ever-decreasing slope that varied only in how many fewer recruits walked through his door to give their lives to the Black League. From a peak of more than 2,000 fresh and young recruits entering his center in one day, now numbers were lucky to dip into the hundreds per week. Petronov's hands and lip began to quiver, his eyes darting from side to side and forehead collecting sweat. He rushed for the phone, calling a colleague in the city. He normally would not give that smug bastard the pleasure of seeing his weakness, but he had to know.\n\nDmitri's voice was hoarse as ever even through the static of the phone line. After exchanging thinly veiled pleasantries, he got to the point.\n\n"Dmitri. What is happening to recruitment? My station has hardly seen anyone enlist. Is it the same with you?" There was a silence on the other line before Dmitri cautiously responded.\n\n"You're having the same problem?""
 OMS_great_stall.3.a:0 ""By all accounts, we've emptied out everyone here.""

 OMS_great_stall.4.t:0 "The Engine Sputters"
 OMS_great_stall.4.desc:0 "There is a fundamental cowardice with the clerk. Whether he works in the deepest bowels of Army Intelligence, or an office far behind the lines, it is that fundamental cowardice that remains a constant factor. It is a deep-rooted aversion to presenting failure. At least in the Black League, that fear made sense. An excess of failure carried a sentence. Nevertheless, it seeps through and corrodes government and institutions further than any Germanic intelligence network or purposeful campaign of sabotage.\n\nIt is a disease that manifests when a clerk in the Finance Ministry incorporates a surplus into the new year's budget. It is a disease that manifests when an Intelligence Officer does not have the will to report new enemy formations that should not exist. It is the cowardice of a propaganda officer who can not admit that his efforts produce fewer and fewer recruits every day. They collect like water pressing against a dam, steadily applying more pressure to the failing stones that make it, each drop seeping through the ailing concrete and threatening to burst out the other end.\n\nSteadily, as a foreign diplomat fails to report that foreign commitments grow scarcer and scarcer, and bureaucrats within the Ministry of Health report that their hospitals still have the capacity, even as they discard those too costly to save, the dam that holds the war effort threatens to break asunder. Now, as German armies recuperate from the relentless offensive and begin to advance, the dam stands vulnerable and at its precipice. All it would take is one well-timed strike to bring the whole rotten structure down."
 OMS_great_stall.4.a:0 "A rot that extends further than any mold."

 OMS_great_stall.5.t:0 "The Engine Stops"
 OMS_great_stall.5.desc:0 "The patrol on horseback saw smoke on the horizon kilometers before they encountered the convoy. Packing the road and the surrounding fields were churned-up scraps of metal, some of which still burned and warped from the intense heat of battle that took place. The remnants of rifles, foodstuffs, spare parts, and other assorted military goods joined them, almost all of it burnt or otherwise destroyed beyond use. The grass was charred black, and the torn apart bodies, or at least what could be identified as bodies, littered it.\n\nMaksim simply plugged his nose and signaled for his men to dismount and move toward the ruined trucks. They had just been rotated off the line, not that it came with any benefit. The Luftwaffe was perfectly capable of hitting anyone, or anything, it wanted, no matter how far behind the line they hid. His stomach rumbled, and he hunched over in pain. Rotation also didn't mean improved rations. Command claimed they were needed for the men who "actually fought". He signaled for his men to quicken the pace and headed over to one of the destroyed trucks. This expedition wasn't sanctioned by command, but given the lack of presumed survivors, nobody would know any better.\n\nIn its flatbed was nothing much of value. Ruined ammunition and pieces of flesh were strewn across the splintered wood and tattered canvas tarp. The next series of trucks didn't yield anything better. Suddenly, one of his men shouted out. Maksim raced towards him. His sergeant held aloft a crate full of raw potatoes looted from one of the burnt-out trucks. Maksim quickly ordered it tied to the back of one of the horses. They would eat well tonight, not that it would last longer. As he walked back to his horse, he spotted what appeared to be a survivor amongst the wreckage, a trooper no older than 18. His face was charred almost beyond recognition, hair burnt to the skin. He reached out weakly, croaking for something. His voice sounded like he was speaking through a torn paper bag."
 OMS_great_stall.5.a:0 "Maksim ignored him. They had gotten what they came for."

 OMS_great_stall.6.t:0 "A True Believer"
 OMS_great_stall.6.desc:0 "Piotyr leapt aside as the concrete mixer tipped, filling the hole that he had dug in the frozen earth: a foundation for yet another bunker. For the past eight weeks, he had been here, in some remote part of the Urals, building bunkers to protect his people from the coming storm. The cold conditions and small rations would have made almost anyone complain, if not desert outright, but not Piotyr. Piotyr had faith. Faith that they would destroy the Teutonic menace. Faith in Russia. Faith in Yazov. This faith had driven him to work at a furious pace, and along with a handful of other true believers in his construction crew, his crew had built bunker after bunker, faster than any cadre crew in this place, far far away from any civilization or anything to really speak of.\n\nSo far their efforts had gone unnoticed by the government, not that Piotyr cared. Piotyr’s family had been killed by the Teutons, not in one swoop– that would have been a mercy– but one after the other. His parents that he barely remembered had died in Barbarossa, executed by one of the Einsatzgruppen. His brother– the brother that saved him from the fate of his parents– had died a soldier in the West Russian War. His wife and children had died in one of the Luftwaffe’s accursed bombing raids while they had been living in Vyatka. After this decades-long torture at the hands of the Teuton, Piotyr only had one goal, one driving force as he layered brick after brick, hole after frozen hole:\n\nRevenge..."
 OMS_great_stall.6.a:0 "... no matter the cost."

 OMS_great_stall.7.t:0 "Diamonds in the Rough"
 OMS_great_stall.7.desc:0 "“Aysen shoveled through the frostbitten, packed dirt with as much grit and determination as he could muster. Echoes of gunshots, just beyond the distance, reminded him of the consequences if he failed to do so. Every brief moment of rest between shovels was cut short as he plunged his equipment back into the Earth, just to drown out the sounds around him.\n\nEver since that bastard Yazov and his soldiers, draped in black, had marched into his homeland, he and his fellow Yakuts knew nothing but the back breaking labor of the mines. What was once peaceful co-existence, albeit tense at times, with those he once called his countrymen soon became a violent subjugation as any in Yakutia able to work were forced at gunpoint into contributing to 'the reclamation of Russia'.\n\n"No cost too great, and no sacrifice too small," they would repeat to the workers, day after day, as they did nothing but sit back and watch their endless toiling.\n\nOnce, there was a time Aysen would've protested the actions of the Black League, perhaps even rebel if he had the strength of his youth. Now those thoughts were now brushed aside, replaced with the memories of his fellow Yakut, his own friends and family, being beaten and bloodied by the guards of the labor site. Even children, already being indoctrinated into the hate of the Black League, would kick at worker's knees as they passed, "not adequately pursuing their patriotic duty," as their instructors would say.\n\nAnd so Aysen continued to shovel, through monotony, through heavy snow storms, through bright skies, through brutal winters, and warm summers. Perhaps, he thought, all his hard work would be worth something one day.”"
 OMS_great_stall.7.a:0 "How many shifts are there in an eternity?"

 OMS_great_stall.8.t:0 "An Unmeasurable Anger"
 OMS_great_stall.8.desc:0 "An emergency cabinet meeting had been called by Yazov, who had grown frustrated with the news that the war situation was not necessarily developing to Russia’s advantage. This could not continue, and someone had better have an explanation. Everyone took their seats, the room deathly quiet. “Gentlemen” Yazov finally said “the line is stagnant, the advance halted. Resources seem to be falling into a black hole” he leaned forward, fixing the cabinet with a chilling gaze. “And I want to know why”.\n\nThose present looked nervously around, one man tugged anxiously at his collar while another fidgeted and flicked his eyes to the others, hoping someone else would speak first. Thankfully, Pitovranov plucked up the courage to propose an explanation. “It’s the Luftwaffe” he explained, trying to stay calm “Our frontline forces are facing highly intense bombing in areas we are attempting to advance in. Furthermore, the conscription effort is producing unwilling men, who don’t want to fight”\n\nYazov considered this long before he replied, “Then redouble production on anti-aircraft equipment, and ensure that our planes are concentrated in the contact zones. As for the conscripts, I want you to ensure that new soldiers are educated properly, and so we can be sure that both their political and military training is up to standard.” He concluded, as the orders are quickly written down. “You had better be right, Pitovranov. On your head be it if this fails to produce results."
 OMS_great_stall.8.a:0 "The sword of Damocles looms."

 OMS_great_stall.9.t: "Summon The General Staff"
 OMS_great_stall.9.desc: "Dimitry Yazov considered himself a patient man, but even the patience of a saint had to be expended eventually, especially in the face of such continual failures. Everywhere he looked, the military situation seemed to be busy going backward. A meeting of the general staff would allow him to pick out exactly who and why this was happening, such that they could be dealt with accordingly. He would listen to no excuses, no half-hearted whimpering about why the general staff had failed.\n\nAs the staff sat around the conference table, the excuses already began to flow. “We simply don’t have enough supplies and winterized equipment!” one man exclaimed, leaning forward in his seat “The men are suffering from frostbite, and their guns are locking up!”. Yazov couldn't think up of a response. “The Germans are giving us no breathing room,” another said, “if we could have a day to recover and organize a counterattack, we can get back on the front foot”. A little panicky for Yazov’s taste, but his head seemed to be in the right place.\n\nAnd so it went, with an unwritten list of who would live or die depending on the explanations given for the suboptimal performance on the front lines. To be carried out with immediate effect as soon as the meeting ends. Perhaps those spared would show some gratitude, and improve their performance. A threat to one’s life is a powerful motivator, and Yazov would ensure they were very motivated indeed."
 OMS_great_stall.9.a: "Under the gun."
 
 OMS_great_stall.10.t: "A Change Must Happen"
 OMS_great_stall.10.desc: "At a radio station in the heart of the city of Omsk, a message from Dimitry Yazov, the great and unquestionable leader of the Black League, and of Russia was preparing a message. Russia was to be overhauled and rebuilt from the core outwards, and everybody would be affected. Everybody would need to take part. The fate of the world hung in the balance. He placed on a pair of headphones and positioned the microphone in front of him. The technician present gave an affirmative thumbs up, indicating he was on air.\n\n“People of Russia. Workers, farmers, soldiers, wives, children, whomever you may be. A change is coming, and this broadcast is to notify you of it. All industry and all agriculture will be reformed and regulated in such a way that it will serve the war effort. If it does not enable us to fight, it will not be produced or grown. Education will also change, from the first lessons taught, children will learn of the enemy and his crimes, and what must be done to eradicate him from the world. Ready-made soldiers will emerge from the schooling system, knowing their duty well.”\n\nHe took a brief pause to take a sip from a cup of water “Furthermore, all media, be it books, radio or anything else will reinforce our values and our way of life, as well as our struggle. Anything that opposes or questions this will not be allowed to proliferate. From top to bottom, all systems and the people who work in them will be directed towards a single goal. The destruction of Russia’s enemies, and to secure a future for its people. Prepare yourselves accordingly.”"
 OMS_great_stall.10.a: "An army with a state."
 
 OMS_great_stall.11.t: "Of Hearts and Minds"
 OMS_great_stall.11.desc: "Our people have known nothing but defeat for the last century.\n\nAgain and again, we rise to the occasion and dig our heels in the mud. Again and again, we are thrown back into the throes of humiliation. We will never again commit such an error.\n\nThe hearts and minds of the Russian people must be brought up to the strength that made all of Europe, and the world, fear us for our resilience and resolve. Our commitment to victory above all else is what drives the average Russian out of bed in the morning and straight into the enemy lines. Our commitment to the final victory is what makes the factory worker labor endlessly with spite and toil in his soul, driving him to become a productive worker in death.\n\nTo ensure this effort succeeds, we must pull from our most fanatical and loyal supporters, of whom will lord over those who do not see the vision for the future. In doing so, our people will retain the nation's interest in utterly destroying the Teutonic menace, once and for all."
 OMS_great_stall.11.a: "Germania delenda est."
 
 OMS_great_stall.12.t: "Of Savagery and Weakness"
 OMS_great_stall.12.desc: "Our army suffers the same crisis as our people: the gutlessness and fear that grips the hearts and minds of our frontline cadres. Our soldiers carry with them the finest weaponry the nation has to offer; they have all-encompassing plans to advance themselves towards our final victory, yet there remains the problem of improperly carrying themselves forward to the battle lines.\n\nOur fearless Glavkoverkh's fervor and spirit are what our soldiers need in this very moment. To bring out the spirit of final victory above all else in the minds and hearts of our soldiers is the final key to the absolute end of the Teutonic dogs.\n\nOur fanatical and most loyal commissars will dish out this spirit of national vengeance. If any are to refuse, they will simply be shot. We cannot tolerate weakness any longer, for our only way forward is victory. Absolute, total victory. Anything less, and we will have failed our nation once more."
 OMS_great_stall.12.a: "Mind, body, and soul, all for our sacred struggle."
 
 OMS_great_stall.13.t: "Of Waging War"
 OMS_great_stall.13.desc: "Yazov sat alone in his office, disappointment and frustration filling him with a most unpleasant malaise. He could envision the victory, and how it would come about. All the pieces seemed to be moving into place, but there still remained a minority of rogues within the system. The grit in the instrument, the grease on the lens.\n\nA list of dossiers had been compiled, of potential troublemakers in the general staff whose loyalty had proven questionable. One had a disappointingly timid strategy planned and was proving resistant to change. Another was being annoyingly alarmist about the current strategic situation, saying that more time was needed, plans should be changed and the war not being to our advantage. Such liabilities shouldn’t be allowed to stand. Especially if compliant loyalists are waiting to take their place.\n\nThe first man is older, a weary stiff-neck who refuses to learn. He could likely be enticed to leave his post with a tempting severance package, solving the problem easily. The second man would prove considerably more problematic. The worst type of troublemaker is one who is convinced he is right, a more underhanded approach is needed. The plan is to have a gunman accost him at a moment of vulnerability. An appropriate stooge has been identified, a man diagnosed with terminal cancer, but still with some strength left. A large sum of money has been promised. To his family."
 OMS_great_stall.13.a: "War isn’t pretty."
 
 OMS_great_stall.14.t: "The Watch-Guard "
 OMS_great_stall.14.desc: "A curious phenomenon was beginning to sweep the new Russia. A recently assented policy had been passed down from the high echelons of government, causing a sense of anticipation to fill the populace. Increased rations and generous monetary rewards would be given to any who could give actionable information to the police and greater authorities. If there is anyone you suspect of wrongdoing, sabotage, or insubordination, say something. See it. Say it. Sort it.\n\nIt wouldn’t take long for people to sharpen their knives, and plunge them into the backs of neighbors and co-workers. Acts as petty as being insufficiently patriotic, not working quickly enough, and showing indifference to the great comrade Yazov were all given as reasons, which would need to be sorted through, assessed and, if deemed worthy, acted upon.\n\nAs the first rewards were cautiously doled out, some took it upon themselves to act as amateur commissars. Loudly espousing their faith in the Black League and its goals, and expecting everyone around them to do the same. It would not be long before members of the same family began to inform on each other, and were split apart as a result. A sense of paranoia began to permeate, as some began to keep to themselves, speaking to few for fear of their words being twisted against them. An air of anxiety hung over a changed society, with no sign of it leaving."
 OMS_great_stall.14.a: "A house divided?"
 
 OMS_great_stall.15.t: "Paranoia"
 OMS_great_stall.15.desc: "Pyotr and Vladimir sat apart from each other, a stern military judge in the stand above them while a gallery of observers quietly watched from aside. Both men feared for their lives. Anxiety renders them light-headed, their minds full of a pernicious fog. “Both of you face charges of cowardice, incompetence, and insubordination” the old man rumbled. “How do you plead?”. His tone was severe, as though he had already made up his mind as to what should be done.\n\n“Not guilty!” Both men shouted in unison. Pyotr pointed sharply at his counterpart. “The charges belong to this shortsighted oaf!” he argued, causing Vladimir to visibly recoil. “While he was busy dithering about, my advance was held up! I didn’t have the strength to assault that much ground alone, and this idiot refused to help!”\n\n“What this liar is refusing to tell you” Vladimir spat back “Is that I was already in a forward position, but I couldn’t advance if this coward didn’t have my flank! He was satisfied to throw me to the wolves while I stuck my neck out!” his voice rising to a shout, echoing around the wood paneled room. The judge put a hand up, stopping him. “I have heard enough” he replied to the tirades.\n\n“Had either of you the spine to take responsibility, I may have considered showing leniency. Instead, you point and shout like schoolboys caught stealing, and such immaturity is not wanted among the general staff. You are both liabilities and will both be sentenced to death”. Both men continued to howl and shout as they were dragged away by the bailiffs. Minutes later, they argued no more."
 OMS_great_stall.15.a: "A lesson learned too late."
 
 OMS_great_stall.16.t: "An Army of One"
 OMS_great_stall.16.desc: "Savintsev had been summoned to the office of Dimitry Yazov, and when the call came for him to do so, he made a point of hurrying there, such was his loyalty. To the consternation of the unit he was previously attached to, but Yazov’s orders superseded everything. Both technically and philosophically. He stood bolt upright to attention and snapped a neat salute before Yazov gestured for him to sit opposite.\n\n“Comrade Savintsev,” the great man began. “As I am sure you are aware, when there is a harvest of wheat, amongst the good and healthy sheaves of grain lies the useless, flammable chaff, serving only to get in the way. I trust you understand what I am saying,” he explained with a severe tone. Savintsev nodded quickly in reply, the metaphor taking root.\n\n“Sir” he replied with disquieting enthusiasm “The recent promotion of staff officers may have some... problematic individuals which must be dealt with properly”. Yazov gave an affirmative gesture, a modicum of praise. “Precisely, it has come to my attention that some of these men are not fit for purpose, and I am giving you full authority to find and prosecute them,” he said, before leaning forward, expression hard as stone. “Lest another failure occur”.\n\nAn agonizsing wave of cold anxiety permeated Savintsev’s body as the meaning of the words dawned on him. He stood. “I will carry out a thorough investigation and culling immediately, never again shall we be held up by cowards!” his voice rising, compensating for the pang of nervousness he had felt."
 OMS_great_stall.16.a: "Dismissed."
 
 OMS_great_stall.17.t: "Sacrificial Lambs"
 OMS_great_stall.17.desc: "An air of anger and enmity lay thick over the city of Perm like a choking smog. But it was most concentrated at the city center, where an event had been arranged for the people to vent their frustrations at the difficulties they faced. Lest the Black League begin to face blame, a controlled outlet for this pent up anger to be pointed at targets of the League’s choosing would soon take place. Driven by military police, a disgraceful parade of ex-soldiers found guilty of fear and cowardice were frog-marched through the city center.\n\nThe thick crowds of civilians and onlookers present were instructed to hurl abuse, with the tacit addition of solid objects as well. Each man in the shameful parade had a sign around his neck reading “COWARD” or some other insult, and each looked their miserable part. As they met the crowd, every kind of insult, slur and abusive remark was hurled at them, all melding together in a torrent of raw, unfiltered hatred.\n\nOne man was struck on the side of the head by a rotting tomato, covering him in foul smelling slime. Another took a clump of wet mud directly to his face, his cry of pain and shock earning louder jeering from the already incensed crowd. And so it went, with some of them acquiring injuries from the projectiles thrown at them.\n\nEven when they reached the bottom of the street, it didn't end. They were herded into armored vans to be taken to an ominously nondescript “detention” facility, like lambs being taken to the abattoir. Tears rolled down their faces, all of them feeling as wretched as could be."
 OMS_great_stall.17.a: "How much hate is enough?"
 
 OMS_great_stall.18.t: "Cogs Moving Backwards"
 OMS_great_stall.18.desc: "A squad of Spetsgruppa stacked up outside on the front door of Vasily’s house, silently waiting for the signal to begin their sweep of the officer’s residence. Suspicions had filtered through that he had been using his relatively secure position to extend bribes to logistics units for extra supplies, and even surreptitiously cooking books and fudging numbers such that additional rations could be sent to him and his favorites.\n\nSuch corruption and subversion of the system could not be tolerated for a second longer, and a hand ram was brought forward to break down the door, the squad stormed in to find the man in his living room, seeming to be peacefully reading a book. Panicked, he snapped to attention, hiding the book under a blanket. The squad leader, Viktor, took notice of this. He had two men restrain the struggling occupant before picking up the book and flipping it open.\n\nA list of names, numbers, and amounts. A black book, containing a list of the people he had bribed, what for and for how much. It was not a small ledger, with scores of records. The problem ran deep. Wordlessly, and with his lower lip pushed up in disgust, Viktor drew his revolver, ignoring Vasily’s pleas. Choosing to execute him right then and there. The body slumped to the floor, and the book seized. “Search this place, I doubt that’s the only evidence here” he ordered, the men spreading out to tear apart the rest of the house."
 OMS_great_stall.18.a: "Lead us not into temptation."
 
 OMS_great_stall.19.t: "See My Beauty"
 OMS_great_stall.19.desc: "Yazov took his place at the head of a large meeting table, with many other general staff and officials present. A meeting had become necessary to pool and judge ideas in the war against the hated Germans, and against cowardice, the enemy within. The men murmured amongst themselves, making last minute touches to their plans. Folders and sheets of paper were laid out on the table as each man made ready to make his proposition.\n\nTaking the initiative, one man provided a situation report on the status of the front line. “As of now, the German counteroffensive has been contained with minimal loss of progress. Requests for supplies and reinforcements have increased markedly, but the lines are tentatively believed to be stable” He reported. Yazov nodded, acknowledging this. “Very good. I will hear any proposals you all have now.”\n\nThe next man to speak up did so enthusiastically. “We should make greater use of incendiary weapons,” he proposed. “By incorporating more fire munitions and flamethrowers into infantry and artillery units, we can have a decisive edge against entrenched foes, or more concentrated formations." Murmurs of agreement were followed by another man speaking up.\n\n“There exists a large number of workers wasting their efforts in non-essential industries, things like civilian consumer goods, trinkets and other such artisanal work. I propose that these workplaces be converted to military workshops, and the workers retrained. Everyone must serve the cause.”"
 OMS_great_stall.19.a: "Passed unanimously."
 
 OMS_great_stall.20.t: "The Fog Disperses"
 OMS_great_stall.20.desc: "Dmitry Yazov was silent. It was an exhausting day, more so than usual. As of late he’d been forced to personally give more and more direct orders to his subordinates. Leading by example however, the Glavkoverkh was willing to push himself if it meant that the §RGreat Trial§! would succeed even as he was worn down from the strain of overseeing so many facets of the Black League’s operations himself. Though he wanted to rest for just a bit, he knew he couldn’t. A meeting with his top generals was scheduled to take place and without the word of their leader to guide them, the machinery of war would grind to a halt.\n\nHe entered the office with a dour look on his face. The room was a spartan affair, the most notable feature being the long table and chairs with a projector hanging above said table. Yazov looked at the assembled generals and saluted them with his generals saluting back in perfectly disciplined unison. “Sit Down.” Yazov ordered, the generals followed his word. Yazov cleared his throat and began to talk. “I’m Issuing a new decree, effective immediately.” The generals remained silent. “Our men are to advance,  er the cost, and their commanders will be held responsible if this command is not carried out.”.\n\nThe implications were as clear as day. A few moments of silence passed by before the ever-faithful Alexander Lazarenko spoke up. “I assume by any means necessary?” He asked, though everyone assembled already knew the answer. Yazov gave him a confirming nod.\n\n“No matter the cost in blood and steel, our men advance. We have been bogged down for too long and if this keeps up we are risking the great trial itself.” The generals nodded along as Yazov continued. “I don’t care if you push your men to death, the only thing that matters is that we advance to the heart of the enemy, and I expect results. Is that understood?”.\n\nThe generals responded in unison once more with their complete agreement. All of them knew, however, that they were living on borrowed time if they couldn’t breach the enemy’s lines this time."
 OMS_great_stall.20.a: "“Advance and give the nation the results it demands from you.”"
 
