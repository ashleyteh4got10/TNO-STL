OMS_nuclearfoci.1.t: "Cardiac Arrest"
OMS_nuclearfoci.1.desc: "The last bullet is fired in Germania. Endless bodies litter the streets. Men torn apart by bullets, stabbed by bayonets, and choked by thick clouds of toxic gas that had been ruthlessly unleashed upon the once great city. Ripped apart by artillery shells, rockets, and mines. Left to rot in burning tanks and behind abandoned barricades that no longer served any purpose now that the battle was lost.\n\nBuildings that once served as centers of life and commerce have been reduced to nothing but foundations, coated in thick layers of crumbling brick and mortar. Bakeries, corner stores, and the homes of thousands had been burnt to cinders. The once mighty factories that were at the heart of Europe’s industries lay in ruins with the workers that toiled within these buildings now resting within the rubble.\n\nAtop all of it, on the half-burnt husk of the Reichstag, stood a man. A man in a black rubber suit and hood, face concealed by a mask white as the face of Death, and a bright yellow armband wrapped around his arm slowly made his way through the toxic miasma and twisted metal that marked the final great engagement between the League and Germania’s last SS defenders.\n\nHe slowly approached one of the flag poles hanging over the side. With the bayonet affixed to his rifle, he carefully cut the tattered flag of the Reich free and watched it flutter into the poisonous wind. One of his comrades opened a backpack and unveiled a flag of black and bright yellow. The standard of the Black League, their symbol of absolute victory.\n\nAfter a few moments, the flag was waving from the side of the building, held aloft by the soldiers that marched from Siberia to the heart of the Reich. Over the crumbling foundations of a city that had been destroyed in all but name. The men stepped back, looking over the ruins that lay before them. After all of their struggle and pain, it was over."
OMS_nuclearfoci.1.a: "§RHatred of the invading enemy is the most sacred and humane feeling.§!"

