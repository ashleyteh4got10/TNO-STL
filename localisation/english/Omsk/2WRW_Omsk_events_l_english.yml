OMS_more_flavor.1.t: "What Must Return"
OMS_more_flavor.1.desc: "It had been a rather trivial sector of the reclamation efforts, but a sector worth fighting nonetheless. Whatever was Russia’s at any point would be Russia’s eternally, by the sacred right of the people. Primorsky Krai, or as the pan-Asians called it, Outer Manchuria, had been in their hands for decades, and had only recently fallen to imperialist hands, hands which had turned the land into something more of a wasteland and an industrial hellhole, rather than a rightful homeland. As would be the right thing to do, following the First Trial, there remained thousands of Russians and peoples formerly under Soviet rule who remained, armed but weak, resolute but small.\n\nThe IJA had been pacifying the region for years, leaving only a few devotees who remained to be a thorn in the sides of the Empire, anything to prepare it for a return to Russian sovereignty. Yazov had a realization, and called up his general staff, including Savintsev, to make a new case as a prior goal before the endgame came into play. “My fellow brethren, I understand that there is territory of the Motherland not under our control, not just occupied by the treacherous Reich, but also by the blind Empire.” The staff talked amongst themselves. One opted to chime in with a simple question, “What do you suggest we do?” “It’s rather obvious.” That day, a plan was drawn up with vigor.\n\nSlowly but surely, a constant stream of resources, rations and rifles, would trickle into Primorye, supplying the resistance with whatever they needed to present a significant threat. As Yazov put it, “As much as they need before they grow into a nuisance that we can intervene on behalf of.” Not only this, but several units of soldiers would be deployed in strategic positions across the region to help destabilize Japanese control over the land and deliver it into the hands of the Black League. Yazov dubbed it “Operation: Alexseyev”. By the time he went to bed, units were selected, and the precise number of resources was spared."
OMS_more_flavor.1.a: "Rest was something Yazov would need, for he wouldn’t have it again."

OMS_more_flavor.2.t: "A Plan to Execute"
OMS_more_flavor.2.desc: "The one time for bureaucracy was over, as Yazov wrote his signature on starting Operation: Alexseyev, and a large portion of the eastern forces of the Black League apportioned to the effort of destabilizing Primorye. By the end, hopefully, it would be ripe for reclamation, one step on the way to taking all of Russia’s original territory. Thousands of able-bodied men from Magadan, Kamchatka, Amur, and several other cities were pulled and conscripted as the manpower behind the operation. Besides this, sets of agents were deployed across the region to provide the partisans with crucial intelligence and weaponry.\n\nSowing the seeds of anger amongst the rebels, and creating restless rebelliousness in the region was only step one. Savintsev was fully aware of this, knowing that at some point, this arrangement would eventually be ended, and the capabilities of Russian counterintelligence would find their limit.  In the office of Sakharovsky, there lay a map of Outer Manchuria on the desk. Beside it was a list of all the settlements in the land, compared with their Japanese names. One by one, he provided his own estimates for when each would be reached and later liberated when the League’s firepower were to be tested in a foreign conflict for the first time.\n\nIn Amur, out of the still-standing buildings, two soldiers bound for deployment were eating rations, and talking about their families back home. “Vanya is barely five. He’s hanging on for dear life.” And now, his father was off to another country to do something he didn’t fathom he’d be capable of. His comrade was guilty of forgetting how much he’d missed out on. “Your son loves his country. Do you?” Surely, he hadn’t just said that. He sounded stir-crazy. The father responded with a poignant statement."
OMS_more_flavor.2.a: "“So much that I want to live for it.”"

OMS_more_flavor.3.t: "Casual Talk Before A Mission"
OMS_more_flavor.3.desc: "Vasily pulled a cigarette from his mouth, teeth already rotting. He only knew the bare minimum of war: that it was bad, and that he’d have to live with it. Besides that, not much, apart from the training with a rifle. Even then, this was espionage, not actual war. “So, how hard is it going to get?”\n\n“Very hard, if that isn’t obvious already,” responded Alexei. While he did look younger than Vasily, he was, in fact, more experienced than he, having already faced Spartan levels of drilling and constant drivel from the higher-ups for a year or two. He didn’t like to keep count of how long he’d been beaten to death.\n\nIosef was busy making sure his rifle wasn’t jammed; it had happened too many times, and he wasn’t going to stand for another grilling by a superior. After all, his colleagues used to joke that if it weren’t for a fellow’s brave sacrifice, Iosef’s incompetence would mean they wouldn’t have the Far East. “Come on, this is ridiculous. Loyalty first, gossip second.”\n\nOf course, Pyotr simply watched this mess of a squadron try and fail miserably to make small talk. “You all need to square up. The Motherland waits for no one.”\n\nAlexei had a response up his sleeve, rolled up anyhow."
OMS_more_flavor.3.a: "“Well, we wait for instructions!”"

OMS_more_flavor.4.t: "In the Gray Area"
OMS_more_flavor.4.desc: "Angels of death, as they were described by the locals. The Spetsgruppa could be considered such, even if they were not angels at all, they were there to deliver divine punishment.\n\nThe translator was bound to collapse at any point if he did not rest, but he tried his best to keep up with the constant flow from the arriving soldiers, who’d jumped off planes and tried their best to land properly, but ended up stumbling on the ground. The locals were watching them land, and understanding their uniforms, opted to help them if only they would return the favor. Indeed, this was the mission.\n\n“We promise you bread, we promise you ammunition, we promise you liberation, and only on one condition.” On paper, it sounded like a good deal coming from the commander of the Spetsgruppa unit. At least, on paper, that is. A resistance member rightfully questioned the condition of said deal, too good to be true. He bravely quipped, “What’s the price?” “Your unquestioned loyalty to the Black League, to the Motherland, to Russia. In return, we give all this.”\n\nThe resistance leader asked the translator to ask for the official oath of allegiance. After it was requested, the unit leader spoke with a clear voice, all Russian, and the translator relayed the message in the native language, even though there were Russians within the local resistance group. Several members got down on one knee and raised a hand straight to the air."
OMS_more_flavor.4.a: "“...by my sacred Motherland.”"

OMS_more_flavor.5.t: "Birds That Cried, Birds That Whistled"
OMS_more_flavor.5.desc: "A few dozen operatives were called to a local village, an apparent hotspot of anti-Japanese activity. They fired their rifles into the air, clearing out the street, and leaving only the partisans to fire back. Said partisans would follow their creed to death, and so the triggers exploded, so the metal pellets flew faster than birds.\n\nIn both directions did the ravens of metal speed in any way, their targets men, country first, human second. A few “brave martyrs” made a run for it, bearing the symbol of death on their uniforms, and not to prolong their lives, nor to prolong their suffering, but to cut those of their enemies, and to deliver suffering to those on the opposite side. A few shrieks and screams from children whose ears were not spared from the gunfire, a few claps of wings from actual birds of flesh, too many whistles of smoke and of death.\n\nIt wasn’t so easy to say that the fire had ended, for it hadn’t. Young Takeshiro was the first to rise from the ashes from all the bullets that had fired, for the few surviving partisans knew if they wanted to kill more, they’d have to leave for another day. Into the green forests, they ran and ran while pursued unsuccessfully by a few Manchurian police. Meanwhile, Takeshiro, clutching onto his heart, looked around, fixing his eyes on a wooden crate.\n\nTakeshiro pried one open, and found it filled to the brim with Mosin-Nagants, too many to count. He then ran to another, opened it, and saw it filled with ammunition. There were at least a dozen more in his field of vision. “Commander! You should come and see this.”"
OMS_more_flavor.5.a: "A costly sight to behold."

OMS_more_flavor.6.t: "A Form of Traffic Control"
OMS_more_flavor.6.desc: "It was 2300 in military time, and Modest was ready to go to sleep. He was already nodding off on the wheel, but he had a job to do. Delivery men put their work before their rest, so he thought. Nevertheless, Modest would protest if he could do so without getting his tongue cut off.\n\nModest was one of many in a column of Russian vehicles that was on a delivery mission to get through Manchuria and drop off crucial supplies for local resistance contacts. All it would take was a single checkpoint, likely empty considering its dire state. Modest had heard from colleagues that it was already rotting and would be an easy way in. As the column approached the border, the delivery man dwelled on the rumors he’d heard, rumors of people getting shot, people from the League who were completing much the same mission as he before they were promptly killed.\n\nThe delivery man knew it was nighttime, though, and it couldn’t be that bad. Before the column could even reach the checkpoint, however, the truck in front of him quickly stopped on the brake, forcing him to do the same. Several vehicles ahead, there was an argument going on, and it wasn’t between the drivers. There were both Manchurian and Japanese police at the scene shouting over the drivers and telling them to turn back. It turned out the Empire wasn’t exactly complacent about border incursions on their “sovereign territory.”\n\n“What’s the hold up?”"
OMS_more_flavor.6.a: "“Go back, go back to where you came from!”"

OMS_more_flavor.7.t: "Scandalous, No?"
OMS_more_flavor.7.desc: "Routine missions, thought Shoto. The Imperial Japanese Army Air Service pilot looked on. His instructions were different than usual, not a mission he’d known about, not a mission he’d expect. Shoto took off his glasses to check for any mistakes; none to be found. Shoto simply took off as he normally would, and a fly-over ensued. He was the first to do the mission, and he wouldn’t be the last. It was an aerial photography operation, to see if there were any “peculiarities” on the ground that required the further attention of his superiors. At least, that’s how his commander phrased it.\n\nIndeed, the photos Shoto took of certain targets were conspicuous, boxes or piles of rifles that didn’t corroborate with any IJA ground operations. What Shoto didn’t know was that the higher-ups were reviewing the photos with intent, as if they knew what was going on - they did. If it wasn’t the IJA, it was the only other suspect. The next day, the airbase was filled with more pilots, pilots with much the same skills and same instructions as Shoto. He was rightfully confused, but he couldn’t pay any mind to it."
OMS_more_flavor.7.a: "Luckily, he wasn’t in “enemy” territory."

OMS_more_flavor.8.t: "Gone With A Whisper"
OMS_more_flavor.8.desc: "The radio went silent - only after gunshots and yells of desperation were heard coming out of it, to the obvious horror, audibly and mentally, of the soldiers listening in to their “comrades”’ last transmission. Even though it may have been regarded as dishonorable, some wept, some covered their mouths or their eyes, while others knelt. It was all the same, it was sympathy. They were friends that had fallen, fathers, brothers, sons, uncles, grandfathers, neighbors, comrades, on and on, and gone by the hands of those filled with undying hatred for people they’d never met. Why?\n\n“Back to work!” A general barged through the doorway, having no idea what he’d walked into. “Haven’t you heard? A base was overrun!” Even though the underclassman would likely be punished for yelling back, he still had the decency to explain why all of them were standing, sitting, or lying down in shock. “By who?” “The Russians!” The broadcast wasn’t the only one, it was but one out of several instances where Manchurian territory was being taken over, and not silently, by Russian forces under the pretense of stability.\n\nThe general was pissed, but he did have the power of the IJA behind him, and he wasn’t the only general with the same idea. It therefore fell to the Kwantung Army to fix the issue, as if it were a minor matter. Not a day later, hundreds of soldiers stood, rifles at the ready, waiting to be yelled at and to yell at their fellow soldiers on their way to meet their match on the frontlines."
OMS_more_flavor.8.a: "A mighty Empire guards its doors, while the same doors come crashing down."

OMS_more_flavor.9.t: "The Work Doesn’t End Here!"
OMS_more_flavor.9.desc: "“Just how dumb do you think we are?” The Japanese minister wanted to strangle the ambassador, but he couldn’t, lest he risk pissing off the entire Black League and have blood on his hands. Nevertheless, he summoned the Russian Foreign Ambassador to Tokyo, and he was going to ensure that Russia knew how angry the Empire was.\n\n“I have no intention of considering you less intelligent for any reason besides warmongering.” The ambassador chose his words wisely. He wasn’t going to allow an international incident, at least, not this early in the process. There was still much to do, but it could all be taken away in the snap of a finger if he weren’t careful enough. In hindsight, he wasn’t. Russian and Japanese troops were fighting each other while they were speaking, and the minister made sure this was known, before he revealed it to the public. “The Imperial Japanese Army is facing off against your Black League, ready to defend itself by any means necessary.” However, revealing it to the public meant weakness, weakness the Empire couldn’t afford to publicize. After a terse conversation that ended with a refused handshake, the ambassador called up Yazov, knowing full well he was being recorded. “We can’t do it anymore.”\n\nOn the other end of the line, Yazov’s hand was shaking. The phone was trembling, and there was a brief moment of silence before he responded with a simple question: “Is it the end?” The ambassador used a rather poetic and proverbial answer to Yazov’s curiosity. “No, my Glavkoverkh.”"
OMS_more_flavor.9.a: "“It’s only the beginning.”"

OMS_more_flavor.10.t: "An Untold Night"
OMS_more_flavor.10.desc: "Nazerov began to wake from the beating he took. The events flashed through his mind rapidly, oscillating between vague, hazy memories and solid red. He was in a bar, resting. His sheep had been settled in for the night, so he took the rest of it for his nightly rituals. Then, out of nowhere, men from outside the small village dragged him outside. Now, as he began to stir, he could hear the voices more clearly. They were Russian.\n\n"No... no. I have money. I have sheep. I can make you a rich man. I have names." He stammered in heavily accented Russian.\n\n"It's not names we want." One of them snarkily replied. He peered backwards to see a lone tree, and another man tying a noose around one of the thicker branches. He began to thrash. "No! No, I've done nothing wrong. I've been accused of no crime! When the militia hears of this-"\n\n"If you mean the other collaborators, have no fear. They're next." The band laughed as they hoisted him onto a stool, gently sliding the thatch rope beneath his chain and around his neck. Nazerov tried one last time to beg for mercy.\n\n"Please, I have a wife. I have children. I... I didn't do anything wrong. I never stole, I supported the Motherland during the war, I sw-" His words were cut off as the brigands kicked the stool out from under him. His vision slowly went black as he suffocated, his limp body hanging from the branch. With a curt whistle, the Russians moved out to search for the next name on the list."
OMS_more_flavor.10.a: "No collaborators will escape our wrath."

OMS_more_flavor.11.t: "BLACK ALERT - GLAVKOVERKH'S EYES ONLY"
OMS_more_flavor.11.desc: "TO: Glavkoverkh Yazov\nFROM: Colonel Igor Rodoinov, Far East Command\n\nComrade Gavokoverkh,\n\nThe situation here in the Far East has changed dramatically for the worse. In addition to a significantly increased force concentration of Japan and its allies in the region, American air and naval vessels have been spotted training together close to our maritime border. These military exercises have been nonstop for the last week and a half.\n\nWe do not have much time to prepare further defenses in eastern Siberia. It seems both the American and Japanese are preparing to launch an attack by land, air and sea. We must assemble a force to guard any ports in the region and enough men to hold back the joint OFN-CPS invasion for they must not interfere with our Great Trial."
OMS_more_flavor.11.a: "Signed, Col. Igor Rodoniov"

OMS_more_flavor.12.t: "The League's Special Brew"
OMS_more_flavor.12.desc: "The finest minds of the League had done it again and Oleg was being given the privilege of being the first to test out this new weapon of vengeance that was to be used against the hated Hun in the west. In his mind's eye he'd pictured a better AFV that could withstand the German's shells better than their current vehicles. When the scarred veteran of the reunification wars was in store for, however, was something entirely different.\n\nOut in a concrete testing facility outside of Irkutsk he now found himself wearing a protective hazmat suit that was heavy enough on its own even without the chemical tank he was now carrying on his back. The weapon was familiar to the flamethrowers he'd used to clear out trenches not too long ago when the League reclaimed these parts of Siberia from Russia's domestic enemies, though if it was just a regular weapon the eggheads wouldn't go through this much trouble for a simple test. Across from him was a dilapidated, open-topped Ural-355 truck with its carriage full of mannequins wearing German helmets. To his left and behind what seemed like a meter of protective glass, the scientists running this experiment.\n\n\"Are you sure this is safe?\" Oleg asked, though the question was more aimed at himself than the scientists that wouldn't be able to understand a single one of the muffled words that he was saying even if they were in the same room. They simply gave him a thumbs up. With a deep breath, he pulled the trigger, half-expecting this to be his last moment on earth.\n\nInstead, he struggled to stand firm on the ground as a tremendous stream of corrosive chemicals spewed forward from his weapon all over the truck, strong enough to corrode the metal the truck was made of and the concrete floor alike while making short work of the mannequins. Left in the wake of this attack were green, noxious fumes of deadly chemicals that even his thick rubber suit barely protected him from. At that moment, he could only think of one thing."
OMS_more_flavor.12.a: "The Teutons stand no chance."

OMS_more_flavor.13.t: "Near misses"
OMS_more_flavor.13.desc: "This small Siberian village had survived the revolution, the Entente intervention and the Smuta without a single shot being fired within its vicinity. When the Black League scoured across the steppes of Siberia to reclaim it for their righteous cause, however, it had ended up being the spot of the last stand of a platoon of traitors to the Motherland. Subsequently it ended up being their graves. The evacuated villagers remained in the city after the war and now it, too, had met its end.\n\nA GAZ-69 jeep was the first sign of actual human life the village had seen in a long time. Vadim and Kliment were driving through this village on the stretch of road that went through the main street. It wasn't a pretty sight. Each of the ten missiles had been designated to strike the same coordinates, yet each of them had veered off-target by a large margin with some of the craters being visible on the hills just outside of the village. Parking by the former grocery store that had been marked for bombardment, just about everything but it seemed to be standing after the initial volley of rockets had hammered the ghost town.\n\nVadim, a lanky and sardonic fellow, stepped out of the driver's side and looked around at the mayhem the scientists had caused. \"It'd be comedic if we weren't expected to rely on this to take out strategic targets.\", he remarked as Kliment stepped out of the jeep./n\"If anything it seems better at creating foxholes for the Teutons than hitting the bastards.\", his colleague replied, clearly on the same wavelength as long as the disciplinary officers weren't looking.\n\n\"Let's survey the site and head back to the facility. The colonel ain't gonna like this if he expected the eggheads to deliver a precision weapon.\""
OMS_more_flavor.13.a: "\"An elated colonel went on to recommend its mass use against German urban areas.\""

OMS_more_flavor.14.t: "Object 416 Test Results"
OMS_more_flavor.14.desc: "With an effective payload nearing eighty megatons, Object 416 has exceeded all expectations even though it is currently unfit for use by our strategic forces. Due to its rushed development cycle the weapon is highly unstable and the payload generates an explosion so powerful that it vaporized the plane that flew it. Due to the primitive state of our missile capabilities, it's advised that alternative delivery mechanisms are developed for future tests.\n\nThe effects are of grave concern. Despite being dropped at what was presumed to be a safe height over the unpopulated steppes, the collateral damage has been enormous as the destructive potential of the bomb exceeds anything predicted in our preliminary calculations. Entire cities were set ablaze several kilometers away from the blast radius and the effects of the bomb are reported to have been felt as far away as Tehran and Sverdlovsk, registering as a small-scale earthquake by seismographic centers in the Middle East and eastern China. Tragically, some of the soldiers deployed to restore order in the region were casualties despite sheltering in what was assumed to be safe bunkers. Additionally, because of our underestimation of the explosive effect, several localities beyond the mandatory evacuation zones were affected as well.\n\nDue to the intense firestorms and radiation near the point of detonation it'll be a substantial amount of time before we can fully assess the damage of this weapon. In conclusion, if used against a Teutonic metropolis it would inflict within a moment what they spent three decades doing to our Motherland.\n\nSigned,\nN.M Demichev"
OMS_more_flavor.14.a: "The sword is what we will drive straight through the heart of the Reich."

OMS_more_flavor.15.t: "Report on the AN416 Incident"
OMS_more_flavor.15.desc: "Oberführer,\nSpace-based surveillance platforms have confirmed our suspicions that earlier reports of an earthquake in Kazakhstan were false and that it was in fact a test of a nuclear device called the AN416 carried out by the Russian National Reclamation Government. While the nuclear device was successfully deployed, the careless handling of the weapon by the Slavic state led to a nuclear catastrophe on their own soil with a soaring casualties as a result.\n\nWhile it is of no small amount of concern that this rogue state possesses the capability of developing such powerful weapons to begin with, the silver lining in all of this is that this self-inflicted wound will set back their nuclear program by several years and is bound to destabilize the state.\n\nAs the failed Russian state has so far only proven itself capable of destroying itself, my recommendation is that we don't blow their cover story at this time. There is no reason to alarm our population or risk aggravating this shamble of a state into further experiments. The truth will bear out eventually.\n\nOur men will continue to monitor the situation. Unfortunately, our last contacts within the Turkestan Legion are considered a write-off at this point. Action: Signed,\nKarl Himmelstoß, SS-Obersturmbannführer"
OMS_more_flavor.15.a: "Signed,\nKarl Himmelstoß, SS-Obersturmbannführer"

OMS_more_flavor.16.t: "Report on the Glavkoverkh Bomb"
OMS_more_flavor.16.desc: "Director,\nOur satellites as well as intercepted German intelligence from the Sicherheitsdienst indicate that our suspicions were correct in that the Kazakh quake was in fact caused by a failed nuclear experiment carried out by the Russian government. The device, referred to as Object 416 by the Russians, is a bomb of tremendous explosive power that may eclipse any of our own weapons, though its instability means that it's unfit to be used as a weapon. Because of the origin of the device, it'll internally be referred to as the Glavkoverkh Bomb from here on.\n\nWhile they were able to successfully test the Glavkoverkh Bomb, miscalculations on their part led to widespread damage that extends far beyond the impact site in the open steppes of Kazakhstan. The Russians clearly did not intend for the bomb to have this effect. So far, the Russian government is sticking to the cover story of an earthquake and remains a closed state. The Germans seem intent to allow this charade to stand so as to not cause further instability in the region, believing that the Russian government will crumble on its own. Both the Agency and the Germans also assess that the domestic nuclear catastrophe caused by the Glavkoverkh Bomb test will set the Russian atomic weapons program back by several years.\n\nWhile the Russian possession of nuclear arms remains a concern, there is little reason to cause an international scare over the situation. Public knowledge of a nuclear catastrophe on that scale would lead to domestic protests over our own atomic weapons programs, something we can ill-afford in the middle of an arms race. Moreover, we have no reason to to destabilize the Russian government as they remain a thorn in the side of the Germans."
OMS_more_flavor.16.a: "Signed,\nAgent Daniel Willis"

OMS_more_flavor.17.t: "AN416 Incident"
OMS_more_flavor.17.desc: "Thanks to the efforts of the Kempeitai we have been able to determine the falsehood of the Russian claims of an earthquake in their occupied regions of Central Asia. As we expected, it's the result of the NBC production facilities that were recently established near the northern border of the Co-Prosperity Sphere. Due to the rushed nature of the program, the test of the AN416 nuclear device was a failure that caused tremendous unintended damage to their own population.\n\nSignal intercepts from Germany and America indicate that both our adversaries believe that this self-inflicted nuclear disaster will set back the Russian program by several years. However, we have seen an increase in the activity in the facilities throughout Siberia in recent days. While the hermit state remains difficult for our agents to penetrate it's clear that our adversaries are misguided in their beliefs.\n\nWe must not alert the Russians to the fact that we've seen through their deception as this may further complicate our efforts to gather information within Russia.\n\nRecommend to Tokyo that they take measures to safeguard against this threat including increased military readiness along the Siberian border."
OMS_more_flavor.17.a: "Rikugun-Shōsa\nFujimoto Masumi"

OMS_more_flavor.18.t: "Report From Menshikovgrad"
OMS_more_flavor.18.desc: "Comrade Glavkoverkh Yazov,\nI'm pleased to report that organized Finnish resistance has been quelled. The task proved easier than expected as Finland's decades of grueling counter-insurgency war has left the country hollowed out and demoralized. While the reserve army stationed in Finland suffered some casualties, they were significantly lighter than initially estimated. We estimate that over 90% of the men that served in the army have either been killed, arrested or deported.\n\nIt will be several years before we can achieve full Russification of the region and fully phase out the barbaric culture and language of the Finns and their Swedish siblings. To expediate the process, a substantial amount of the native population has been transferred to southern Kazakhstan with loyal Russians being moved in to replace them.\n\nA fitting end to the Finnish problem. After spending years trying to colonize and erode everything Russian in Karelia, they've instead been broken as a people after having the same methods used against them and applied with overwhelming force.\n\nAs operations are winding down, I've approved for the immediate transfer of excess manpower from the reserve army to be redeployed into our main forces along the border with Moskowien for the honorable duty of serving in the §RGreat Trial§!.\n\nSigned,\nYuri Drozdov"
OMS_more_flavor.18.a: "Another historical adversary dealt with."

OMS_more_flavor.19.t: "Project Reports: CT-60 & OT-60M"
OMS_more_flavor.19.desc: "To: OKB-Karbyshev Department of Ordnance Requisition /nFrom: Krasnoyarsk-7 Testing Department #4\n\nAfter further evaluation we've come to the conclusion that the general's request to investigate the possibility to outfit our main battle tanks with a modified version of the chemical thrower cannot be fulfilled.\n\nOn the move, the toxic gasses from the chemical canisters are too unstable and pose a health risk to our tankers under combat conditions. In all tests that were conducted, at least one and sometimes all crew members ended up being hospitalized due to the conditions. In one of these instances, the vision restrictions imposed on the crews by the protective gear was the main culprit as the tank ended up colliding with a wall.\n\nThanks to our safety precautions all test volunteers will be able to return to regular combat duty in the near future. However as not a single stress test saw the tank come within firing range of the designated mock target, all testing on the CT-60 chemical tank are to be halted until further notice.\n\nIn more positive news, the conventional flamethrower tank tests proved to be an outstanding success. In the final trials the entire tank squadron managed to reach the Teutonic mock village our engineers had built and successfully burnt it to the ground fast enough to ensure minimal theoretical survivors even under intense combat conditions. We recommend that the OT-60M is fast-tracked for production this instant."
OMS_more_flavor.19.a: "A precursor to the hell we'll send our enemies to."

OMS_more_flavor.20.t: "Opening Salvo"
OMS_more_flavor.20.desc: "The telegram had been laying on the old man's desk for several minutes, silently observed by a bespectacled pair of eyes that couldn't hide the shock and disgust he felt over what was just read. Countless messages had passed through this tidy section of the Foreign Office and thousands of those had been parsed by Sven, yet not once could he recall anything as absurd as what he'd just read. It was effectively a demand for Germany's unconditional surrender of everything the great nation had fought so hard to achieve, all without a single shot being fired. If the aged gentleman had possessed a single informal bone in his body, he'd surely have laughed at such a ridiculous notion that could only have been concocted by the fertile imagination of the barbaric Slav.\n\nJust as he was about to pick up the cursed piece of paper to bin it, an air raid siren started to ring from outside. His stomach started to turn, and he started to read it again, his eyes dancing between the words with increasing horror as he realized that what he was reading wasn't a poorly formulated joke by a rogue state but an actual statement of intent that amounted to a declaration of war. He read it again, and then again, and then a third time just to make sure he wasn't in a bad dream. Sweatdrops started to form on his wrinkled, balding head and he nearly made it to a fourth re-reading of the telegram when a loud explosion rocked the entire city block, making the man fall out of his chair as the window to his office shattered from the force of the blast.\n\nFor a brief moment, the old veteran of war and politics felt something he hadn't felt since his trenches in Russia had been shelled. Adrenaline alone got him back up on his feet without a care for the shards of glass surrounding him. As he looked out of the blown-out window with his bare eyes, he realized to his horror that the regional office next to his had been struck with a missile, three entire floors being obliterated by the force of the blow with many more explosions thundering across the old Prussian city. To his horror, he realized what this meant."
OMS_more_flavor.20.a: "Germany was once again at war, and with an adversary more brutal than any other."

