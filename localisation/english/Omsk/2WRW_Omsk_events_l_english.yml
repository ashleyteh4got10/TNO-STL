OMS_News.555.desc: ""
OMS_News.555.a: ""


OMS_News.1.t: "[Get_newspaper_header]Terror Attacks Across the Reich"
OMS_News.1.desc: "Across territories of the Reich, devastating terrorist attacks on key installments have taken place near simultaneously. In Germania, key government buildings were targeted by small explosives in just a matter of hours. In addition, other targets such as railroad junctions and Heer supply depots were also hit. The attacks are being particularly concentrated within the German Reichskommissariats.\n\nThe perpetrators have identified themselves as members of the "Army for Russian Liberation", who advocate for the return of former Russian lands to the Omsk-based Russian government. In turn, they have long decried Germany's treatment of the occupied Russian lands. Their cause has received consistent support from members\nof the Organization of Free Nations, most notably the United States."
OMS_News.1.a: "How will the Führer respond to this?"

OMS_News.2.t: "[Get_newspaper_header]Unternehmen Herbstdonner"
OMS_News.2.desc: "In a move perhaps only unexpected to the Russians, Pakt forces have begun a massive counter-attack across the entire front, aimed at driving back Russian Black League forces from the Moscow frontier, German-held Ukraine, the Baltics, and Finland. Dubbed "Operation Autumn Thunder", the offensive has seemingly carried massive buildup and has involved, for perhaps the first time, almost complete coordination between Pakt air, ground, and sea assets working in tandem against the Black Leagues' Armies.\n\nCaught completely off guard, it is rumored Russian formations have already begun to break, a rumor firmly denied by Russian High Command who state that whilst the counter-attack was unexpected, it will be "duly repulsed"."
OMS_News.2.a: "Chaos takes hold and Russia continues to burn..."

OMS_News.3.t: "[Get_newspaper_header]Plot Revealed"
OMS_News.3.desc: "As the fury of The Great Trial casts its fiery cloak over all of Eastern Europe, photos and news leaks coming in from Russia show disturbing reports of Russian Glavkoverkh, Dimitry Yazov, disposing of several high ranking officials from both the military and civilian administration. While no official reason has been given as to why, analysts believe that the purges are due to Yazov’s dissatisfaction with the performance of the war in Europe, which has slowly grinded down to an impasse similar in vein to the First World War.\n\nThe purges seem to reach all echelons of the military and government, a scale which hasn’t been seen since Hitler’s Night of Long Knives. Officials from Germany state that this outcome was ‘expected from an adversary as savage as the Slav’. Meanwhile, Yazov expressed assurance that he simply is ensuring that his government is free of ‘influence from outside forces’."
OMS_News.3.a: "They are all guilty of the unforgivable crime: failure."
OMS_News.3.b: "They’re destroying themselves! Now is our time to strike!"
OMS_News.3.c: "Have they truly gone mad?"

OMS_News.4.t: "[Get_newspaper_header]The Great Mistrial"
OMS_News.4.desc: "Years of fighting and countless millions of casualties on both sides has finally come to a close today with an exhaustive nuclear exchange between the Black League and the combined arsenals of the other superpowers. Although the German Reich has claimed nominal victory following a complete nuclear annihilation of Russia, it remains a pyrrhic triumph.\n\nFrom the streets of Warsaw to the bunkers buried deep in the Urals, Eastern Europe lies in shambles. The exchange has brought countless cities to ruin and completely halted any sort of ground fighting. With Yazov missing and presumed dead, many expect the Black League to face complete governmental collapse. Even though the German Reich still stands, it remains a husk of its former self. With hundreds of millions of dead across the world, and many more missing, the future for humanity is bleak."
OMS_News.4.a: "For the madness of one, the world paid the price."

OMS_News.5.t: "[Get_newspaper_header]The Fall of the Black League"
OMS_News.5.desc: "The Great Trial has finally come to an end. After countless months of brutal warfare through Russia and countless millions of casualties, the flag of the Black League flies over Russia no more following the collapse of the League’s so-called National Redoubt. German soldiers breached the final line of fortified cities earlier this month and fought block by block, mountain by mountain to assert control over the Urals and what laid beyond them. As the last holdouts were captured, the Black League and its apocalyptic plans have fallen.\n\nEven as Yazov's remains were identified in the ruins of Orsk and the Black League faces complete annihilation, the fight hasn't ended. Countless remnants of fanatic devotees of the former government have already established themselves across Russia. Although the §RGreat Trial§! has come to an end, the war is far from over for Germany."
OMS_News.5.a: "nihil vidi post me, et finem ante me vidi."
OMS_News.5.b: "Eurasia breathes a sigh of relief."

OMS_News.6.t: "[Get_newspaper_header]The Fall of the Black League"
OMS_News.6.desc: "The Great Trial has finally come to an end. After countless months of brutal warfare through Russia and countless millions of casualties, flag of the Black League flies over Russia no more following the collapse of the League’s so-called National Redoubt. A joint OFN-CPS invasion force breached the final line of fortified cities earlier this month and fought inch-by-inch over the inhospitable Siberian wastes and what laid beyond them. As the last holdouts were captured, the Black League and its apocalyptic plans have fallen.\n\nEven as Yazov's remains were identified in the ruins of Orsk and the Black League faces complete annihilation, the fight hasn't ended. Countless remnants of fanatic devotees of the former government have already established themselves across Russia. Although the §RGreat Trial§! has come to an end, the war is far from over for Germany."
OMS_News.6.a: "nihil vidi post me, et finem ante me vidi."
OMS_News.6.b: "Eurasia breathes a sigh of relief."

OMS_News.7.t: "[Get_newspaper_header]The United States and Japan Declare War on the Black League"
OMS_News.7.desc: "In a joint statement issued from the OFN and CPS military leadership, it was stated that military units from both Japan and the United States have begun operations against Black League. At dawn, tanks crossed the border between Manchuria and Siberia, marking another escalation in the ongoing war between Russia and Germany.\n\nThis comes after warnings issued from both Washington and Tokyo were addressed to the Russian government, calling for an end to the use of chemical and biological weapons throughout Europe. However, in an act of defiance against global pressures, Russia has refused to abide by international law. It seems that, once more, humanity has found itself in a global struggle against itself."
OMS_News.7.a: "Perhaps there will be a war to end all wars..."

OMS_far_eastern.1.t: "The Tokyo Communique"
OMS_far_eastern.1.desc: "FROM: [JAP.GetLeader]\nADDRESSED TO: National Reclamation Government of Russia\nSUBJECT: Final Warning\n\nLet it be known from this day onward if the situation within Eastern Europe devolves any further into such senseless and mindless butchery, the Empire of Japan and its allies will take preemptive measures to ensure the stability and defense of members within the Greater East Asian Co-Prosperity Sphere. The government of Japan is especially concerned that many of the facilities producing the chemical and biological weapons being used against Germany are located in close proximity to nations allied to the Co-Prosperity Sphere and therefore pose an existential risk to our collective security.\n\n\n\nWe strongly urge negotiations with the Germans immediately to avoid any further use of banned weapons arising and start abiding by the non-proliferation treaty for atomic, biological and chemical weaponry. This will be our only warning.\n\n\n\nSigned,\n[JAP.GetLeader]"
OMS_far_eastern.1.a: "Yet another repugnant ally of the Teuton's impeding the process of true justice."

OMS_far_eastern.4.t: "CONFIDENTIAL - A REPORT FROM THE KEMPEITAI"
OMS_far_eastern.4.desc: "TO: The Prime-Minister of Japan\nFROM: Kempeitai HQ (Kyushu)\nSUBJECT: Deployment of Nuclear Weapons in Central Europe\nAn intelligence tip from agencies based in the United States have revealed a startling conclusion: that Black League agents have planted a number of nuclear weapons in Central Europe, most likely with the intent of initiating a pre-emptive strike on cities and infrastructure. As is proper for the security of the Japanese nation and His Imperial Majesty, the Kempeitai heavily recommends intervention.\n\nAs per your latest directive, we have begun a slow regime of intelligence sharing with the Americans, and as such are prepared to begin the drafting of a joint-plan of action in order to prevent the detonation of the bombs. Additionally, we recommend that the Imperial Japanese Army and Navy begin preparations of the highest severity for war as Omsk's deployment of forces grows more aggressive. "
OMS_far_eastern.4.a: "Approved. Let us hope they succeed…  "

OMS_far_eastern.5.t: "TOP SECRET - FOR THE PRESIDENT'S EYES ONLY - URGENT"
OMS_far_eastern.5.desc: "TO: POTUS\nFROM: Central Intelligence Agency\n\nSUBJECT: Deployment of Nuclear Weapons in Central Europe\n\nAccording to the latest observations of the Central Intelligence Agency, we have irrefutable proof that Black League agents have begun the confidential deployments of "Glavkoverkhbombas", nuclear-weapons placed in strategic locations across Central Europe. The CIA has immense fears that these bombs represent the start of nuclear devastation with Omsk plans to inflict upon Germany, and potentially the world.\n\nAs per POTUS directive, we have informed our Sphere partners of this development, and are actively working to intervene in the bombs' deployments in an effort to potentially prevent a "hot war" scenario, the consequences of which can only be described as apocalyptic in nature."
OMS_far_eastern.5.a: "Let's hope Tokyo gets this quick…  "

OMS_far_eastern.6.t: "CONFIDENTIAL - A REPORT FROM THE KEMPEITAI"
OMS_far_eastern.6.desc: "TO: The Prime-Minister of Japan\n\nFROM: Kempeitai HQ (Kyushu)\n\nSUBJECT: Potential and Realized Deployments of Black League WMDs\n\nObservations from listening posts and satellites have revealed a sharp increase in the buildup of suspected biological weapons laboratories and testing sites in Russia's Far East specifically aligned along the borders of CPS-friendly governments and Manchuria. This coincides with the widespread deployment of WMDs in the Moskowien region against German forces.\n\nIt is highly feared that escalation in any form or capacity will inevitably bring the war into Mongolia, Manchuria, and other Sphere-controlled territory. The Kempeitai make the strongest recommendation to increase troop buildup and CBRN training and unit concentrations in and around the border with Russia in accordance with this threat.\n\n"
OMS_far_eastern.6.a: "Dear God… "

OMS_far_eastern.7.t: "TOP SECRET – FOR THE PRESIDENT'S EYES ONLY"
OMS_far_eastern.7.desc: "TO: POTUS\n\nFROM: Col. Daniel Bard, USEUCOM\n\nSUBJECT: Use of WMDs in Eastern Europe and Civilian Loss\n\nObservations from both satellite and witness testimonials have confirmed our worst fears. The Black League, in an attempt to gain the advantage, have begun the mass deployment and use of tactical nuclear weapons on the front against Germany. In combination with the League's already lacking policy in terms of the preservation of civilian life, all reasonable estimates have put civilian casualties in the millions.\n\nRecommendations from USEUCOM are to stand all forces at high readiness whilst further observations commence. The use of WMDs, in the eyes of command, will inevitably beget a further climbing of the escalation ladder as the Black League continues seeking increasingly destructive means of achieving their objectives. "
OMS_far_eastern.7.a: "Dear God…"

OMS_far_eastern.8.t: "The Black League's Downfall"
OMS_far_eastern.8.desc: "The Great Trial has finally come to an end. After countless months of brutal warfare through eastern Russia and countless millions of casualties, flag of the Black League flies over Russia no more following the collapse of the League’s so-called National Redoubt. A joint OFN-CPS invasion force breached the final line of fortified cities earlier this month and fought inch-by-inch over the inhospitable Siberian wastes and what laid beyond them. As the last holdouts were captured, the Black League and its apocalyptic plans have fallen.\n\nEven as Yazov's remains were identified in the ruins of Orsk and the Black League faces complete annihilation, the fight hasn't ended. Countless remnants of fanatic devotees of the former government have already established themselves across Russia. Although the §RGreat Trial§ has come to an end, the war is far from over for Germany."
OMS_far_eastern.8.a: "And yet, the Pacific breathes a sigh of relief. "

OMS_far_eastern.10.t: "To Err is Human"
OMS_far_eastern.10.desc: "After the first reboot, the officer snatched the phone to receive orders from Tokyo. The command was clear. His district commander instructed an immediate retaliatory strike, under the assumption that with Germany's bombing, a dead man's switch contingency had been invoked. Nuclear war had begun. He put down the phone and looked back. His men sat still as stone. The radar screen was filled to the brim with pips.\n\nAfter the third reboot, his mind came to accept what his stomach already had. It was an awfully weird phenomenon to feel embarrassment in his final moments, however he had regretfully vomited on the floor. If one of his men had done so, he would've instructed a lashing. With a wry and almost insane smile, he came to realize his command had been one exactly like the one had endured before his promotion: one of cruelty and abuse.\n\n On the fourth and final reboot, his technicians had managed to track the basic velocity and targeting data of the missiles. The first wave headed for Manchuria; many more flew to other targets across China, Taiwan, and even the Home Islands. He grabbed his activation keys and conjoined them with his second-in-command. Gingerly, they both inserted them into the small locked cabinet that carried the launch codes. His hands shook. To even touch or glance at it previously was to invite death.\n\n His judgement and heart screamed at him to reconsider. What if his system was still damaged? What if a final reboot would fix the computer, an import from Guangdong, and reveal the pips were simply mirages? If he launched these missiles now, it would be he who ended the world, who could potentially end 2,600 years of Japanese existence. But, he had his orders. His key turned and the small metal door flipped open.\n\n  "
OMS_far_eastern.10.a: "Long live the Empire of Japan."

OMS_far_eastern.11.t: "URGENT- GLAVKOVERKH'S EYES ONLY"
OMS_far_eastern.11.desc: "TO: Glavkoverkh Yazov\n\nFROM: Colonel Igor Rodionov, Far East Command\n\nSUBJECT: CPS Buildup On The Border\n\nComrade Glavkoverkh,\n\nReports from our comrades in the Black Hand indicate that Japan, Manchuria, and other members from the Co-Prosperity Sphere are aligning their forces along our shared border in large quantities and have adopted a high alert stance. Additionally, we have detected movement of yet additional reserve troops and accompanying heavy equipment towards it. There is no indication that the buildup of men and matériel is for any aggressor action, but the force concentration is concerning nonetheless.\n\nTherefore, my staff and I recommend preparing a new force to take up defensive positions in central Siberia and the Far East. In spite of the tentatively neutral stance of CPS forces in the area, doing so still gives us time to implement measures dedicated to stopping any potential incursions by Japan and its satellite states should they appear.\n\n"
OMS_far_eastern.11.a: "Signed, Col. Igor Rodionov"

OMS_far_eastern.12.t: "Diplomatic Cable From the American Embassy"
OMS_far_eastern.12.desc: "TO: Glavkoverkh Yazov and the Russian Government\n\nFROM: The White House, Washington D.C.\n\nSUBJECT: Final Warning\n\nWe have been watching the situation in Eastern Europe closely both internally and externally. Our concerns for both the future of Europe and that of the world itself are gravely put on full display by the actions of both your army and government, with Eastern Europe being the unfortunate victim of such unprecedented violence.\n\nIn addition, we have strong reasons to believe that your nation is willing to commit inhumane and despicable acts of genocide and violence against the victims of the conflict you have started. Let it be known that the United States and its allies, despite its bitter history with Germany and its allies, will not stand idly by if your army continues to deploy any prohibited weapons both on the battlefield and against the civilian populations of Europe.\n\nThere will be no further warnings from the White House.\n\nSigned,[GetPresidentFirstName] [GetPresidentLastName]"
OMS_far_eastern.12.a: "Tell that Nazi-loving swine to die like the rest of his Teutonic masters."

OMS_far_eastern.13.t: "BLACK ALERT - GLAVKOVERKH'S EYES ONLY"
OMS_far_eastern.13.desc: "TO: Glavkoverkh Yazov\n\nFROM: Colonel Igor Rodoinov, Far East Command\n\nComrade Gavokoverkh,\n\nThe situation here in the Far East has changed dramatically for the worse. In addition to a significantly increased force concentration of Japan and its allies in the region, American air and naval vessels have been spotted training together close to our maritime border. These military exercises have been nonstop for the last week and a half.\n\nWe do not have much time to prepare further defenses in eastern Siberia. It seems both the American and Japanese are preparing to launch an attack by land, air and sea. We must assemble a force to guard any ports in the region and enough men to hold back the joint OFN-CPS invasion for they must not interfere with our Great Trial.\n\n"
OMS_far_eastern.13.a: "Tell that Nazi-loving swine to die like the rest of his Teutonic masters."

OMS_far_eastern.14.t: "FOF 5"
OMS_far_eastern.14.desc: "Igor hastily breathed deeply to himself as the last remaining Pakt forces hastily vacated the village. He quickly checked how many rounds were left in his magazine. He was almost out. The small community lay on an expanse of open ground without any natural defenses to protect them from the League's overwhelming fire. Trying to hold it was an invitation to be encircled as League forces pushed forward from all sides. That evening, he and his squad posted themselves in a mostly intact house to shelter for the night, intending to set up a forward post where the wounded could be triaged. But as they swept the building for booby traps that may have been left behind by the defenders, Igor found something curious just as he was ready to give the all-clear signal.\n\nA three-string balalaika, in good condition, lay mounted next to an abandoned closet. A flicker of a smile crossed his face. He had one back home, and was quite well-practiced before the war. Perhaps he still had the knack to play a tune to lift some spirits? He picked the instrument up, and leaned against the wall, setting his rifle down next to him. Other squad members gathered around, curious to see if he could perhaps play something they knew. WIth a cursory strum to test the strings, he began to play.\n\nTo their interest and amusement, he began to play Kalinka. Starting slower in tempo, and singing along calmly. Even as the song grew more energetic, his fingers effortlessly glided across the strings. Not wanting a sudden and awkward silence to fall once the song was over, he immediately began again into Troika. He was already a decent shot and calm under pressure, but it was heartening to know that a little time could be found to put aside the horrors of war, and enjoy playing for and singing along with your comrades."
OMS_far_eastern.14.a: "For just one evening, the song drowned out the cacophony of war."

OMS_far_eastern.15.t: "The Reclamation of Vladivostok"
OMS_far_eastern.15.desc: "Vladimir had faced the resolute and fanatical defenses of the Imperial Japanese Army, the Kwantung Army, and their American collaborators. But, despite everything, the Black Flag of Russia was hoisted above the city center for the first time since the Great Patriotic War. The combined forces of both the Sphere and its American allies threw everything they had at them, and Vladimir had been in the thick of it from the start. When the IJA first crossed the boundary into League territory, he had been summarily drafted from a backwater farm in rural Amur oblast. Now, he was part of an army bringing the §RGreat Trial§ to Russia’s enemies in Asia.\n\nThough his training was rudimentary at best, life under Yazov had taught him how to follow orders without question. Any other militiaman would’ve panicked when they experienced a stovepipe jam for the first time, but not him nor his comrades. They had learned far more from the harsh regimen back home than even a year in basic training could. Little wonder then that he and others rose to the challenge when called to do so, to mete out retribution upon the allies and their pack of ill-set attack dogs, and even those Russians who sided with them, their heads filled with lies about Yazov.\n\nAs a mark of honor for their courage in battle, Vladimir and his squad had been hand-picked to round up those who had thrown down their weapons during the waning hours of the battle. The Japanese, Chinese and Americans that had been herded into the city hall were as good as dead, but the Russian collaborators still held out hope that their shared nationality would e	arn them clemency. Time stood still for the captives as the Black Hand officer directed Vladimir and his men, and the order couldn’t be clearer"
OMS_far_eastern.15.a: "No quarter for traitors,” and Vladimir didn’t hesitate to end them."
OMS_far_eastern.15.b: "You owe your lives to Glavkoverkh Yazov”, and Vladimir lowered his rifle."
