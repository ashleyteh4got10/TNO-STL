OMS_failstate.1.t: "The Black Spectre"
OMS_failstate.1.desc: ""Pitor,"\n\nPiotr slowly glanced over at his comrade, Fyodor, a look of exhaustion strewn about his face.\n\n"What?" Piotr said softly, himself also having felt the effects of days without sleep.\n\n"...Do you think the end for us is near? As in, we no longer have to keep fighting?" Fyodor said, albeit with an unassured tone.\n\nPitor's eyes shifted from Fyodor's face to that of the wall behind him, as he looked out at the vast expanse of death and decay from the slit in their bunker. Then he looked up, looking through the massive hole blown through their bunker from days before. Of the 10 men sent to defend this position, only the 2 men remained after the bunker buster was dropped on their heads.\n\n"Perhaps... maybe the end is across the field over yonder."\n\nSuddenly, a loud static chirp was heard from the radio, which the 2 men thought it to be broken. They had not heard a word from high command in the last five days.\n\n"Comrade soldiers, this is your commander speaking. You are to all reposition yourselves just outside the national redoubt. Our struggle does not end here. Vengeance will be ours. Long live comrade Glavkoverkh Yazov."\n\n"Was that Lazarenko?" Fyodor chipped in, this time with a hint of excitement in his voice. Finally, they had gotten confirmation that all was not lost yet. The 2 men collected their items and made their way out of the bunker as they heard the sounds of heavy rocket engines overhead, and a quick blur passes right over their heads."
OMS_failstate.1.a: "The §RGreat Trial§! continues."

OMS_failstate.2.t: "Report from Katherinenburg"
OMS_failstate.2.desc: "A mild static marred the broadcast as the news broadcast switched from the dry, almost mechanical introductory reading from the German news anchor to the chaotic scenes of what used to be Sverdlovsk, recently conquered as the Black League made its atomic scorched earth retreat to behind the Urals. Despite the evident tumult, the RRG’s finest as always put on a confident show for the cameras.\n\n“... We are reporting live from the recently liberated Katherinenburg. Behind me you can see that there’s a lot of activity at the recently established headquarters for the nuclear, biological and chemical protection forces.” Said the German war correspondent with a straight face, trying his best to give the impression that everything was finally under control after the devastation that had punctuated the fighting in the region. The reporter took a deep breath before he continued to speak.\n\n“There remains no sign of the leader of the Russian horde, Dmitry Yazov, who is presumed to have died in the destruction of his mountain fortress. We’ve been assured by the newly appointed Reichskommissar Walther Wenck that the Heer will soon eliminate the last pockets of resistance in Russia and the final victory is well within sight in the war against Russia.”\n\nAnother deep breath. The reporter had the briefest expression of anxiety on his face before he spoke again. “The effects of the small-scale deployment of nuclear weaponry by the incompetent and barbaric Russians has, as expected, resulted in only minor damage as the nuclear warheads were largely intercepted before they could strike our heroic soldiers. Not even the most underhanded attempts by the enemy can delay the eastward march of Germany’s heroic sons, let alone stop it, as they honor Germany and the Führer with yet another success!”\n\n“In other news, we will soon have an interview with the head of peacekeeping and anti-banditry in Siberia, Gustav Wagner, declared by the Führer himself to be the best man for the job of capturing the remaining Russian bandits. Please stay tuned for the interview.” With a flick of a button, the tv was turned off."
OMS_failstate.2.a: "The end is near."

OMS_failstate.3.t: "Report From Vilyuysk"
OMS_failstate.3.desc: "David Halberstam checked his microphone. It had been giving him trouble a few minutes ago, but by some miracle it was working again just as they were going live on air in this God-forsaken land. Out of all wars he’d have to cover, none were giving as much pain in every sense of the word as this one. The fact that the camera lens hadn’t been frozen was a surprise to him as the red light lit up.\n\nWhat greeted viewers from across the Pacific was a reporter, clad in winter gear, in front of a mostly undamaged village. As the League had fallen apart, cities were taken with gradually less resistance as only the most radical remained devoted to Yazov's cause at this point. Long gone were the days of metropolitans like Irkutsk and Kansk needing to be fought over block by block.\n\n“Good morning. I'm David Halberstram with CBS, presenting you with an exclusive look at the liberated territories of Sakha in Siberia.” He said in a matter-of-fact way. “Specifically, we are reporting to you in the village of Vilyuysk, one of the coldest places on earth.” Halberstream's face was neutral for the most part.\n\n\n“The collapse of the Russian Government has been marked a monumental victory for the joint forces of the United States and her allies, as well as for the world at large. The world came closer than any point in history to nuclear war, thanks to our brave soldiers, this has thankfully been averted.”\n\n\nHalberstream decided to take a moment before resuming. “Already the scale of the humanitarian crisis in Russia has been realized, supplies are expected to arrive within the next week to help the local population who have been subjected to the hardships of war, even in these remote places. As many as-”\n\nAn explosion occurred in a building across the street, Halberstream cursed as both him and the cameraman started to run even as the tape rolled. Moments later, the broadcast cut out due to what was charitably called “technical difficulties”."
OMS_failstate.3.a: "For some, the struggle is far from over."

