 OMS_forpol.1.t:0 "Outside the Vacuum of Hate"
 OMS_forpol.1.desc:0 "Talgat had lived his entire life on the steppe, some Kilometers from the Aral Sea. One day, while tending to his flock, he noticed a strange plane, and a strange message falling from it, descending from the cloudless blue sky. It was a small pamphlet and upon closer inspection, he realized it was written in Russian.\n\nCurious, Talgat started reading the pamphlet, and as he did, he couldn't help but feel a growing sense of disgust and confusion. The words written on the paper spoke of hatred and revenge, of the anger of a whole people. Talgat had heard of many such Russians; waxing and waning over many years. Once, it was a Bolshevik, who exclaimed the equality of all nations among a strange, and alien Allah to the one he knew so long. Then, It shattered; and out poured disparate political groups, Tatars and Bashkirs, and strange merchants. He truly never much fancied it all, content with life tending to sheep. He read the document further, and its many strange declarations.\n\nThe piece was focused on the German espionage that had apparently infiltrated Kazakhstan, even spanning to his town. Members of apparent spy rings were cited to have been found, 3 of which Talgat recognized from a parable about thieving bread, and 2 of which he went to Mosque with, when he had once lived in Alma-Alta. Most strangely, he found the Russians had declared a war upon degeneracy within their national holdings. Upon finishing the final sentences, Talgat almost exclaimed; “Do the Russian and Kazakh people have the resources to be degenerates?”\n\nHe almost came to a chuckle at the stamp-like picture of Yazov, a supposedly well ordained king from what he could make of the stamp. Hadn’t the Russians had enough of gods, and kings, and their murder in the like? Why had the honorable Allah given the Russian such dishonorable bloodthirst, to be mired in insanity generation over generation?"
 OMS_forpol.1.a:0 "What are those Russians up to?"

 OMS_forpol.2.t:0 "No Rest For the Lain"
 OMS_forpol.2.desc:0 "The citizens of the city of Turkistan had always been proud of their gift from Tamerlane in 1405, that gift being the Mausoleum of Khoja. For centuries, this symbol of Timurid construction had defied the test of time, despite never even being fully completed by its original constructors. For centuries, it had been a center of many pilgrimages throughout all of Central Asia, and had been a centerpiece of Kazakh culture. \n\nToday, that structure has been demolished, and in its place, long rows of razor wire were constructed in the fashion of a perimeter. Not long after, shoddily constructed wooden barracks were hastily assembled within the confines of the wires, and after that the soldiers began unloading trucks full of other soldiers, and a plethora of guns.The civilian populace was on edge, and a wave of paranoia set in amongst them. \n\nThousands of angry Kazakh men, women, and children filled the streets, shutting down the city of Turkistan for a few hours. Within the early hours of the morning, Russian army units were being deployed en masse in and around key, strategic road junctions across the entire city. At the crack of dawn, the orders were given, and the soldiers descended down upon the feverous populace. \n\nThe protestors that survived were blinded and bound, loaded into trucks, and carried off into the gates of 'Camp Skobelev'. For the ones that weren't loaded onto trucks, they were simply left for nature to reclaim, blood soiling the earth. \n\nInside the camp, the situation was nothing short of inhumane. People within the gates of the camp were still outraged that their camp was constructed on the grounds of a building they had once considered sacred, and a local muezzin insisted that the people should pray together, for Allah would protect them in their time of need. As the congregation gathered to pay their respects to Him, the soldiers entered the scene with batons, and attack dogs. There was little room for mercy."
 OMS_forpol.2.a:0 "The tragedy of life is not death, but what we let die inside of us while we live."

 OMS_forpol.3.t:0 "A Stronghand With Uncle Sam"
 OMS_forpol.3.desc:0 "Jacob Frey readjusted the collar of his suit jacket, moreso to take his mind off the blistering cold than anything else. He, along with one his aides, stood outside the US embassy and waited for the League delegation to arrive. His aide was a young recent graduate from an émigré family, fluent in Russian, French, and English. He'd be an invaluable asset, given that Frey was largely a political appointee. He'd given a lot of money to the President's campaign, and he wanted the prestige of serving as ambassador to the country that'd finally end the Nazi menace. At least, that's what those in the State Department were hoping.\n\n"How much longer do you think they'll be-" Frey began to ask, before a car finally pulled up in front of the embassy. Finally, Frey thought. They could get out of this cold. He approached the car just as one of the League's officials stepped out. He was a stern looking man with thick eyebrows that nearly covered his brow. His handshake was firm, gripping Frey tight as he pulled him close.\n\n"Apologies for the delay," the League diplomat said in English with only a minor accent. "A call that I could not put off. I do have a very busy schedule, so I was hoping perhaps we could agree here and now on American support over the issue of Outer Manchuria? Helping to free Russian territory from the grip of the Japanese is a worthy goal for us old allies, Russia and America, don't you agree Mister Frey?"\n\nFrey was surprised by the forwardness of the ambassador. The embassy had prepared a dinner for this whole occasion in order to come to an understanding with the League. But given what he had just said, it didn't seem like there was much to discuss. "Of course," Frey quickly replied. "We would be more than happy to aid in your efforts to contain and push back against Japanese imperialism."\n\nThe League diplomat gave no smile in return when he let go of Frey's hand and made his way back to his car. He spoke a few quick words to his aide in Russian, before getting back in. In a few more moments, they had driven off. Frey couldn't help but be a bit amused by the situation, turning to give a shrug to his aide. But the look on his aide's face troubled him.\n\n"Is there something wrong?" Frey asked. "Was it something he had said?"[Change Later]"
 OMS_forpol.3.a:0 "He said that this was all too easy."

 OMS_forpol.4.t:0 "Deport the Rot"
 OMS_forpol.4.desc:0 "Lev had nothing left on him except the clothes on his back. Even these, the last vestiges of his old life, were starting to fray at the seams and let the cold Siberian wind slip into the cracks and bite at his skin below. But he had to keep going. He had no other choice. He had seen the League officers skewer his comrades with their bayonets if they strayed too far to one side from the marching column. If they fell too far back, then they too would get a bayonet through the heart.\n\nHe had tried to explain that he had no choice. All of them had tried to explain that the Japanese officials would have killed their families and sent them to work camps if they hadn't agreed to help them. He tried to implore that they have mercy on him and his family. He got none. The League officers, following their capture of Outer Manchuria, dragged all of the so-called collaborators out and declared them enemies of the Russian people. None of them asked Lev how he had managed to save countless lives over the course of his supposed collaboration. Sure, he had signed off on many of their deaths. But countless more would have died if not for him.\n\nNone of them cared. They were too self-righteous about having been born on the proper side of the Russian-Japanese border. They gave them no opportunity to get their things. They had to march all the way to their "Japanese friends" across the border. It didn't matter that the march would be hundreds of miles. And so they marched. A few hours in, one of his friends–a secretary named Vladimir–asked if they could have any food. A League officer pierced his heart with his bayonet. A few hours later, the first of them dropped from exhaustion. Those that fell were stabbed or shot. Lev wasn't sure which fate was better. He didn't look to see who had already fallen. None of that mattered now. All that mattered was that he survived.\n\nThe sun was starting to set over the horizon, and Lev felt some hope that they might be given a few hours rest before the sun rose up the next day. As the minutes passed, and the horizon turned darker and darker, Lev realized that they had no intention of giving them a moment's rest. And with the last light leaving the horizon, his hope was extinguished."
 OMS_forpol.4.a:0 "No mercy for collaborationist scum."

 OMS_forpol.5.t:0 "Production for Promises"
 OMS_forpol.5.desc:0 "Despite my better judgment, I made my way at the arranged meeting place and met a soldier of the Black League. He was dressed in a newly ironed uniform, an AK slung around his back. He was cleanly shaven, looked well-rested, but something rested behind those eyes. It wasn't so much a sharp edge as nothing at all. Nothing lay behind the sallow face which greeted me, no life sprung to the dead and hardened fingers which reached to grasp my hand. The conversation that follows went something like this, of course in Russian. \n\n"Greetings. I am with the Central Intelligence Agency of the United States. I presume you know why I am here?" \n\n"Yes." His reply was curt, so curt that it almost caught me off-balance. Apparently these Russians were more direct than I had been briefed. \n\n"Very well. I am here to carry forward my demands to your leaders. The United States is prepared to supply the Black League with money, arms, and munitions. In exchange, we'd like a few... assurances." \n\nWe went onto discuss said assurances. Well, discuss is quite a loaded term. I presented my demands, and as the seagulls circled and the nets were cast out to sea, the soldier simply absorbed them, that blank stare from those empty eyes barely moving. When we finished our negotiations, I was about to leave when that innate curiosity finally got to me. \n\n"Private. How do you even feel about this? The war I mean. We all know you're headed for it. You're endeavoring a total war with the Germans. Are you sure this is even a good idea? To potentially destroy the entire world?" \n\n"The Black League will do whatever is necessary to avenge the Russian people. Even to the... even to the d-" \n\n"Death, yes I know. But have you ever considered what this might entail? For you? What if the Germans or Teutons as you call them are not grinded under your boot? What if you lose?" \n\nThe soldier took a pause himself. I could see his Adam's apple move as he swallowed deeply, sweat building up around his brow. I had struck a nerve. His eyes darted from side to side. The atmosphere suddenly became far more oppressive, as if a blanket was placed over the both of us. The hairs on the back of my neck stood straight up. \n\n"I'm sorry sir, but our time is up. Your ship will be coming for you soon. In the meantime, you may stay at one of our hotels."[Change Later]"
 OMS_forpol.5.a:0 "The weapons are enough for now."

 OMS_forpol.6.t:0 "The Potemkin Plea"
 OMS_forpol.6.desc:0 "[Change Later]"Ladies and gentlemen. Citizens of the free world. I, Comrade Dmitry Yazov, come to you with an urgent address and a warning of what is to come for the people of Russia."\n\nThis message would not be broadcast to our people. We will not pollute their ears with our lies.\n\n"The forces of expansionist fascism are powerful. The German threat to our west is wary of our resurgence, and their repeated incursions into our rightful borders have become more determined and numerous over the past months."\n\nOn the western front, experimental pushes into Moscowien territory by Black League reconnaissance forces were met with remarkably little resistance. Their sloth would be their undoing.\n\n"German Nazism is a poisonous ideology. It extols militarist expansionism, a mythologized ideology of racial purity, and upholds slavery as just some of its many core tenets."\n\nIn prisons to the north, countless prisoners were worked to death in the forced labor of frozen work camps. Their blood will grease our war machine.\n\n"All the Russian people have ever desired is safety and security. To live a life without the constant threat of invasion hanging over their heads. Despite our best efforts, we have been forced to harden our defenses against the fascists who wish to again reduce us to the anarchic chaos that defined these lands before our Reconstruction Authority managed to retrieve what had been lost for so many years."\n\nDeep underneath the western taiga, top secret networks of underground bunker systems run for many kilometers. None will know of their existence until it is too late to stop us.\n\n"Our desire was to rebuild what had been taken and forge a new peace. But now we find ourselves preparing for war."[Change Later]"
 OMS_forpol.6.a:0 "There was never truly an option."

 OMS_forpol.7.t:0 "Operation Alekseyev"
 OMS_forpol.7.desc:0 "No. 089-32-46							           Date: [DATA EXPUNGED]\n\nFROM: [DATA EXPUNGED]\n\nTO: Dmitry Yazov\n\nSUBJECT: Comrade Yazov, it has come to my attention that a contingency of Red Army remnants have been coerced into infiltrating the Manchurian border along our far eastern border. Our efforts have gone unnoticed by the high command in both Japan and Manchuria. We have aided these remnants by giving them intelligence reports necessary to carry out operations and avoid detection by regular army units of Manchuria. Villages along the border have become strong points for our forces to gather more men and material for further operations deeper within Manchurian territory.\n\nFurthermore, the remnants inside foreign territory have requested our own contingency of forces to assist them for large-scale operations, such as harassment of enemy soldiers, further gain in territory and solidifying what territory is already held. This request has been personally ordered to be delivered to you personally, Comrade Yazov, as the clandestine nature of the situation presents an opportunity to right a wrong committed against our people by the barbaric Japanese.\n\nThe decision rests on you alone, Sir. How should we approach this situation?\n\n"
 OMS_forpol.7.a:0 "Arm the remnants, and send them an attache. The Japanese are not a priority."
 OMS_forpol.7.b:0 "Send in our forces. Right the wrong committed against our people."

 OMS_forpol.8.t:0 "Soldiering, a Noble Profession"
 OMS_forpol.8.desc:0 "Kirill woke up to the same sound he did every day. Chaos. For such an orderly state of being the Army claimed to be, the barracks were quite the scene. I guess that’s what you can expect putting a bunch of rowdy teenagers together with not much to do.\n\nThen in came the sergeant. Everybody scrambled to attention in front of their bunks. After screaming at some privates who were in a less than admirable shape, he began speaking about their mission.\n\n“Listen up! You lot are heading east...quite a bit east. To Manchuria to be exact. Before you start yelling, don’t ask me any fucking questions because I don’t know. You have two hours to get ready, so hurry up and pack.”’\n\nThe sergeant waltzed out with the same casual bravado he entered with. Once the doors closed the chaos resumed once more. 2 hours was more than enough time to pack. The other men, if you could call them that, began singing, cheering, and smoking. Kirill just sat on his bed.\n\n“Manchuria? I might as well march to the moon. Were they not meant to fight the Germans?  The Teuton menace? No, surely I didn’t join for this. I am meant to fight the Germans. To avenge my fallen father and honor my family. How could I do that in Manchuria?” He wondered.\n\nKirill looked around. Sure there were some thinking like him, but overall there was an atmosphere of glee. They cheered that they were going to fight. They cheered that they would finally become heroes.\n\n“That is why I joined. To become a hero. To serve my nation. I suppose there is no difference if it’s in the West or East. Papa surely will be proud of me, no matter where.” He reasoned at last. \n\nKirill put his worries behind and joined his friends. They drank and smoked. They sang and cried. They toasted that they would be in Vladivostok within months.\n\nHours later everyone was packed and they were about to march. The excitement had died down and his stomach began eating at him. He thought of his mother crying when he left. He thought of his father leaving to fight. He thought of his village and of his sister. He was eager to fight but he missed them all so much. He was left with those thoughts as they marched on the muddy roads."
 OMS_forpol.8.a:0 "Anxiety and excitement make a noxious potion."

 OMS_forpol.9.t:0 "[Change Later]"
 OMS_forpol.9.desc:0 "[Change Later]"
 OMS_forpol.9.a:0 "[Change Later]."

 OMS_forpol.10.t:0 "Icy Winds and Russian Cattle"
 OMS_forpol.10.desc:0 "Manchuria was damn cold. When Kirill was told he was going to fight the Japanese, he imagined something more...exoctic. Jungles, rice farms, something. All he saw was cold forests and cold plains.\n\nHe was huddled around a campfire with the other boys. They were all so different, yet all so alike. Another gust of wind blew into his bones. It got cold in Tyumen, but it was nothing like this. The wind blew right through you. At home he had his mother and the samovar. He had warm blankets. Here he had his uniform, a shabby tent, and a campfire. The campfire was a struggle. Too close and it burned. Too far and you’d freeze.\n\nSince they left Tyumen a battle had been waging in his soul. One side was his excitement for revenge and service to his motherland. The other was homesickness and fear of what’s to come. The fear was winning.\n\nKirill briefly heard the sound of the tent flapping and turned around. There stood the lieutenant. He was a beast of a man. He walked to the center and yelled in his raspy voice about the Japanese and some guerillas. Kirill was trying to pay attention but he was on the verge of dozing off. Then all of the sudden...\n\n“Up! Up! Get on your feet! Up! Out of the tent! Out!”\n\nLike animals they were driven out. Kirill certainly wasn’t tired anymore. Those who lagged behind were beaten by the officer’s baton. They were herded out onto a field. There was shouting and screaming but he couldn’t hear now that the helicopters began to roar. He soon got the message though when the whips began to come down.\n\nThe cattle were herded into separate helicopters. That’s just what they were, cattle. They had no autonomy. No self thought. No hopes or dreams. They were merely at the mercy of their master’s whips. They ate when they were told. They slept when they were told. They moved when they were told. They fought when they were told"
 OMS_forpol.10.a:0 "Is a man with no free will still a man?"

 OMS_forpol.11.t:0 "[Change Later]"
 OMS_forpol.11.desc:0 "[Change Later]"
 OMS_forpol.11.a:0 "[Change Later]."

 OMS_forpol.12.t:0 "On the Hills of Manchuria"
 OMS_forpol.12.desc:0 "When the helicopters landed, Kirill and the other men were immediately wrangled out. Their officers told them they were going on a long march. Something about if they landed too close the Japs would spot them. They drugged for miles upon miles. Despite the chilly winds, Kirill was sweating. When they finally got to the top of the hill he was out of breath, but then he saw them. The partisans! Officers shouted back their code words to identify the groups, but it was soon drowned out by cheering from the Red soldiers. They started running and naturally the Black soldiers did the same. They met together in the middle in a blissful celebration.\n\n“How are you!” “What a fancy gun that is” “Does that old thing still shoot?” “Why, my farm horse has a better coat!” “That was some march..” “Anybody know how my home is doing? I’m from Barnaul?”\n\nFirst it was cheering and sharing names. Then in an unorderly march that would put the higher command into a fit of rage, they waltzed back to the partisan’s camp. There they were met with the sweetest gift of all, alcohol. The partisans poured shots for the soldiers, but most of these boys could hardly stomach vodka. Yet, over the night they would learn how to.\n\nThe two colors of soldiers, red and black, became one in an instant. They played cards, chess, drank, sang, danced, cried, and laughed together. It was the happiest the partisans had been in decades. Not only was it their night, but it was the happiest Kirill and the black men had been in months. These men weren’t barking orders or threatening court martials. No, they were friends. They were old soldiers who understood their plight and after a night of partying they would kick the Japs right back to Korea.\n\nAfter a night of great fun, Kirill stumbled back to where he dropped his things. He had his blanket over him and the drink had warmed his body. As he dozed off to sleep he only had one thought..."
 OMS_forpol.12.a:0 "...with the partisans at our side, we will be okay."

