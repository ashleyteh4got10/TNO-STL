PRC_CountryInfo_Folder.101: "The Past"
PRC_CountryInfo_Content.1: "The Valiant Heart"
PRC_CountryInfo_Content_desc.1: "To speak of the People's Revolutionary Committee's history is to speak of its legendary yet tragic founding figure—Marshal Alexander Vasilevsky, one of the Soviet Union's most brilliant military minds.\n\nAfter the October Revolution, Vasilevsky served across multiple Red Army departments before being transferred to the General Staff in 1937. His strategic proposals for military readiness and Far Eastern defense against Japan often aligned with Stalin's views, clashing with Bukharin's emphasis on expansion over political oversight. This earned him Bukharin's disfavor, leaving his recommendations ignored and himself sidelined for years.\n\n"

PRC_CountryInfo_Content.12: "Nightmare of War"
PRC_CountryInfo_Content_desc.12: "In May 1939, Japan and Manchukuo attacked Mongolian border forces at Nomonhan to test Soviet Far Eastern defenses. Unprepared, Soviet-Mongolian troops suffered heavy losses. Vasilevsky and Georgy Zhukov were urgently dispatched to organize mobile defenses, buying time to reorganize troops. Despite Japanese artillery, air superiority, and even biological warfare, their brilliant command held the line for two months.\n\nBy August, the Red Army launched a decisive counteroffensive. Concentrated armor and artillery shattered Japanese positions, forcing a humiliated retreat. The September ceasefire ended with a Soviet victory. Though his strategies remained partially ignored, Vasilevsky's competence was undeniable, restoring his standing within the Party.\n..."

PRC_CountryInfo_Content.2: "Guardian of the East"
PRC_CountryInfo_Content_desc.2: "The Great Patriotic War began Russia's descent into suffering. The Red Army's weakness validated Vasilevsky's earlier warnings—entire divisions were annihilated as Brest, Kiev, and Minsk fell. Alongside comrades like Yegorov, Tukhachevsky, and Zhukov, Vasilevsky desperately organized defenses. Meanwhile, Japanese forces grew bolder in the Far East. To secure the region, he was appointed Transbaikal Front commander, overseeing Mongolia and military logistics.\n\nYet the Union's collapse came swifter than imagined. As Germany took the Caucasus and neared Moscow, Bukharin vanished en route to the Far East. Stalin's emergency takeover sparked paranoia—Vasilevsky, a staunch Stalinist, faced suspicion even from Blücher. Undeterred, he fortified the Far East, maintaining supply lines to Moscow, believing the Union could still prevail. But fate struck relentlessly: Sino-Soviet relations crumbled over Xinjiang; Stalin was deposed; Moscow fell, its evacuation devolving into slaughter. Even Vasilevsky, the unbreakable soldier, had to concede—the Union was doomed."

PRC_CountryInfo_Content.3: "Twists of Fate"
PRC_CountryInfo_Content_desc.3: "Before Vasilevsky could mourn, survival became paramount. As the Union's fall reached the Far East, Japan struck. Most troops and equipment had already been transferred westward. Though Vasilevsky employed deceptive tactics, the ruse couldn't last. Japanese-Manchukuo-Mengjiang forces launched a full invasion. Vladivostok and Khabarovsk fell despite desperate resistance. Even localized victories couldn't stop the tide—Ulaanbaatar was overrun, Prime Minister Choibalsan killed during retreat. Prince Demchugdongrub of Mengjiang boasted of restoring Genghis Khan's empire."

PRC_CountryInfo_Content.13: "Last Stand"
PRC_CountryInfo_Content_desc.13: "Vasilevsky's preparations finally bore fruit. The Mongolian People's Army exploited supply shortages in the deserts, establishing a defensive line to halt the advance while retreating to western Mongolia. Japan, satisfied with its gains, withdrew after installing the Russian Fascist Party in occupied zones. Prince Demchugdongrub established the Mengjiang United Autonomous Government under Japanese patronage. With Blücher's counsel, Vasilevsky regrouped in Tuva's Kyzyl, integrating remnants of Far Eastern forces and allying with Mongolian deputy commander Yumjaagiin Tsedenbal. Together, they formed the People's Revolutionary Committee to resist the puppet regime."

PRC_CountryInfo_Content.4: "Fortune in Misfortune"
PRC_CountryInfo_Content_desc.4: "Amidst the chaos, Vasilevsky encountered a miracle—a Red Army detachment from Mozhaisk, led by Major General Leonid Brezhnev. Having crossed bandit-ridden Kazakhstan, they sought to regroup in the Far East. Through them, Vasilevsky learned of Central Siberia's state: after the Union's fall, intellectuals, scientists, and kulaks in Tomsk formed the Central Siberian Republic, staffed by former colleagues like Pokryshkin, Budyonny, and Krylov.\n\nThough furious at this bourgeois deviation, survival demanded pragmatism. Suppressing his men's outrage, Vasilevsky negotiated supply agreements in exchange for defending against Mengjiang. Republic President Pasternak, valuing stability and Vasilevsky's prestige, consented. The battered Soviet-Mongolian forces finally caught their breath."

PRC_CountryInfo_Content.5: "The Long Night"
PRC_CountryInfo_Content_desc.5: "The respite couldn't last. While Vasilevsky avoided conflict with Central Siberia, others wouldn't. After the exiled Presidium settled in Irkutsk, its de facto leader Genrikh Yagoda—having consolidated power through purges—invaded to seize the Siberian Plan's resources. Vasilevsky's position deteriorated; though open clashes were avoided, surveillance intensified. Fearing accusations of treason for his dealings, he kept his distance.\n\nThen, catastrophe struck. The Republic, desperate to end the war, demanded Vasilevsky's submission to crush rebellions in Novosibirsk and Barnaul. He refused, mobilizing defenses. Before fighting could erupt, Central Siberia imploded—Pokryshkin's secession, the Kansk Black Army uprising, Andreyev's warlordism... Even old comrade Budyonny fell to anarchists. Banditry from Kansk, Oyrot, and Krasnoyarsk forced Vasilevsky to divide his forces, straining the Committee's survival."

PRC_CountryInfo_Content.6: "Misfortune Never Comes Alone"
PRC_CountryInfo_Content_desc.6: "By 1955, Mengjiang sought to complete its conquest. Allied with Japan and the Reorganized National Government, its armies swept across Mongolia. Outnumbered and outgunned, the People's Army collapsed. Vasilevsky's reinforcements arrived too late—retreat became a rout. Just as Tuva faced annihilation, salvation came unexpectedly: the Reorganized National Government's forces were mauled in the northwest, forcing Japan to divert troops south. Isolated Mengjiang troops were repelled, sparing the Committee from destruction."

PRC_CountryInfo_Content.7: "Crossroads of Destiny"
PRC_CountryInfo_Content_desc.7: "By 1962, the Committee stabilized. New recruits swelled its ranks, but internal divisions deepened. Russians, led by Brezhnev, prioritized reclaiming Siberia; Mongols under Lkhamsüren demanded Mongolia's liberation first. Factional strife and supply shortages plagued morale.\n\nAlone but resolute, Vasilevsky must now make his final choice—where to strike, how to unite his people. The Committee's fate hangs on his decision.\n\nWill dawn finally break, or is this twilight's end?"

PRC_CountryInfo_Folder.102: "The Present"
PRC_CountryInfo_Content.8: "Internal Strife"
PRC_CountryInfo_Content_desc.8: "The People's Revolutionary Committee is a fragile alliance of Russians and Mongols bound by socialism. Cultural divides and competing homeland aspirations have split them into two factions. Their quarrels threaten to erupt into open conflict—some even prioritize it over eastern threats. Meanwhile, regional instability persists...\n\nA cured illness may still relapse."

PRC_CountryInfo_Content.9: "Mongol Faction"
PRC_CountryInfo_Content_desc.9: "Led by Zhamyangiin Lkhamsüren, this faction comprises the last remnants of the Mongolian People's Republic. After Japan crushed Mongolia, Deputy Commander Tsedenbal rallied survivors in Tuva. Since the 1955 defeat, Tsedenbal has organized the Mongolian People's Front in occupied territories, leaving Lkhamsüren to advocate prioritizing Mongolia's liberation. Years of infighting with the Russian faction have crippled the Committee's cohesion—bridging this divide is paramount."

PRC_CountryInfo_Content.10: "Russian Faction"
PRC_CountryInfo_Content_desc.10: "Headed by Leonid Brezhnev, this group consists of 18th Army remnants and other eastern refugees. After General Grechko went missing during the Mozhaisk defense, Brezhnev led survivors through Siberia to Tuva. They argue that the coming battle for Russia demands focus on Siberian reunification first."

PRC_CountryInfo_Content.11: "External Threats"
PRC_CountryInfo_Content_desc.11: "The Committee's primary foe remains Mengjiang, now a Japanese-armed behemoth capable of summoning Co-Prosperity Sphere reinforcements. Secondary threats abound: the reclusive Old Believers of Oyrot hoard fertile lands; Kansk's anarchic Black Army raids borders; Andreyev's 'democratic' junta rules Tyva; the heretical 'Rurik II' in Novosibirsk; the ambitious Pokryshkin; and Tomsk's anti-Soviet salons. To redeem the Soviet legacy, Vasilevsky must crush these factions, uniting Central Siberia's strength for liberation."
 
