 MGI_ADJ: "Witch"
 MGI_Tsukishiro_Yuki: "Tsukishiro Yuki"
 POLITICS_TSUKISHIRO_YUKI_DESC: "She is the only true witch to appear in this game, and the true identity of the \"Great Witch\" frequently mentioned in various documents, records, and discussions among girls in the game.\n\nHarboring hatred towards humanity, she laid down a precise plan with the goal of exacted revenge upon all of mankind.\n\nThe magical abilities of the 13 girls, as well as those of all the candidate witches who died imprisoned in cells in the past and those who haven't been discovered yet, all originate from Tsukishiro Yuki.\n\nTherefore, it can be assumed that Yuki can cast all magic."
 ultranationalism_yuki_thought_subtype: "Tsukishiro Yuki Thought"
 ultranationalism_yuki_thought_subtype_desc: "                            §YTsukishiro Yuki Thought§!\n\n£GFX_ideology_ultranationalism_black_league_thought_bar\n\n\n\n\nWitches once lived happily on an isolated island, projecting the power of their wisdom across the vast continents of the world. Despite the passage of centuries, their interior remained harmonious, stable, and joyous.\n\nHowever, these hundreds of years of joy and peace came to a sudden halt with the arrival of a certain group: humans. They were bent on throwing the witches into the torrent of history, wildly attempting to completely bury such a wise and peace-loving race. To a large extent, they succeeded. On the island of the witches, all traces of their existence have been turned to ash. The locations of the Great Witches remain unknown, and the witch race is on the brink of extinction. This was the \"First Judgment.\" \n\nBut facing seemingly insurmountable difficulties, one person refused to yield. Comrade Tsukishiro Yuki endured endless loneliness day after day on the island of the witches. Yet, this heroic daughter of the witches knew that this was not the end. This last witch flew across the entire Earth from the island of the witches, spreading the witch factor—forging the foundation and doctrines of the witch judgment. For Tsukishiro Yuki herself, a dream has always existed: that the animals who once slaughtered the entire witch race under their iron heel will certainly be completely turned to ash, and a new era ruled entirely and purely by witches will arrive in its wake. The \"Great Witch Trial\" will ultimately arrive."
 STL_april_fools.1.t: "Anomaly in the North"
 STL_april_fools.1.desc: "More than twenty years have passed since the collapse of the Soviet Union, and the Russian land has fallen into endless division. The Omsk Black League regime is one such warlord established after the First West Russian War. Its leader Karbyshev's concept of the \"Great Trial,\" aimed at launching a large-scale revenge against Germany, has been revered as a treasure by members of the Black League. However, a confusing piece of news came from the Omsk side: the Omsk regime has been seized by a girl calling herself \"Tsukishiro Yuki,\" and the country has been renamed the \"Magical Witch National Rebirth Government.\" We are extremely interested in the developments in Omsk. After a long discussion within the nation, it was finally decided:"
 STL_april_fools.1.oa: "Send a few investigators to look into the situation."
 STL_april_fools.1.ob: "Never mind, their affairs are none of our business."
 STL_april_fools_tt: "§RThe Great Magical Girl Witch Trial has begun...§!"
 STL_april_fools.3.t: "A Bitter Cold Wind"
 STL_april_fools.3.desc: "She stood there. She stood alone at the highest point of the canyon.\n\nA cold wind swept up from the abyss, tearing at her clothes, and at this long-dead world. There was no response, no echo, as if even the wind just brushed past her as a matter of routine.\n\nShe had completed her final revenge on humanity, turning them into inferior \"witches,\" leaving them to twist and madly kill each other, before wiping them out entirely with the witch killer—just like humans did to her and them a century ago: coldly, precisely erasing this race that called itself \"civilization\" from the face of the earth. They should have been destroyed long ago. They should have been destroyed long ago.\n\nWitches were originally a race that didn't fight with the world. They isolated themselves, living in peace and contentment on the island of the witches. They observed humans, but never interfered.\n\nWhat about humans? Humans developed rapidly, technology advanced continuously, and their quality of life rose constantly. They conquered the skies, they gazed into the deep sea. But they were never satisfied. They fought each other for interests. The tragedy of the Second World War remains vivid in her memory—Germany and Japan practiced thorough, merciless colonial policies on the lands they conquered, treating the people of the colonies like pigs. Not to mention, how would they treat a different race?\n\nUltimately, they looked toward the witches. Almost all witches died in that storm, leaving only her. She was not resigned. She resolved to seek revenge for her deceased comrades. She formulated a meticulous revenge plan for this purpose, creating the perfect \"witch factor,\" sentencing humanity to death step by step. She has personally ended this trial. Now there is no species named human left on Earth, including the human experimental subject who used to bother her—Melulu Hikami.\n\nShe slowly sat down. The rocks were cold and hard, a piercing chill passing through her clothes. That question that had troubled her for a long time surfaced in her mind once more—\n\nIs all of this really worth it?\n\nDuring the early stages of the experiment, she had adopted a human and named her Melulu Hikami. She was supposed to be just an experimental subject, a tool used to verify the witch factor. However, the experiment failed. Melulu did not turn into a witch, she just stayed behind, clinging to Tsukishiro Yuki all day while calling her \"Great Witch-sama!\". Even though the experiment failed, she had to admit that ever since Melulu appeared, she was finally no longer alone. She began preparing food for her, telling her about the world, leaving... a light on for her. She treated her as an experimental subject, but unknowingly began treating her as family.\n\nShe walked into the house that has been kept perfectly intact to this day. The house that belonged to her, Melulu, and the owl who always complained about how hard it was to work. She really wanted to hear \"Great Witch-sama, you're back\" once more, really wanted to hold Melulu in her arms again, and enjoy the rare peaceful times with them once more. All of this is gone and will never return. Everything she did was supposed to be for revenge, to make humans repay all the pain they inflicted on them. She succeeded. She repaid them a hundredfold. But in the end, did it only yield such an outcome? A meticulously planned revenge, just to exchange for a world that has only her in it—a world that is incredibly quiet, incredibly empty, and incredibly lonely? She began to doubt. Doubt her choices. Doubt her obsession. Even doubt—the revenge itself.\n\n\"...\" She fell silent for a long while.\n\n\"Emma, Shiro, Melulu,\" she spoke softly, as if calling out, or as if saying goodbye.\n\n\"Thank you.\"\n\nShe stood up, did not look back, and walked out the door.\n\nIt seemed as if she had finally let go of something.\n\nOr perhaps, she took everything with her."
 STL_april_fools.3.o: "She smiled, and turned to fly into the sea."
 MGI_ultranationalism_party: "Magical Witch National Rebirth Committee"
 MGI_ultranationalism_party_long: "Magical Witch National Rebirth Committee"
 SE_THE_GREAT_MAGICAL_GIRL_WITCH_TRIAL: "THE GREAT MAGICAL GIRL WITCH TRIAL"
 SE_THE_GREAT_MAGICAL_GIRL_WITCH_TRIAL_D: "What is Yazov? He only wiped out the entire Germanic race, but we're going to wipe out the entire human race.\n-Tsukishiro Yuki"
 SE_THE_GREAT_MAGICAL_GIRL_WITCH_TRIAL_A: "Setting off from Omsk once more"
 WORLD_2WRWTER.114514.t: "[Get_newspaper_header] Magical Girl Witch Trial"
 WORLD_2WRWTER.114514.desc: "With a month passed since Tsukishiro Yuki announced the seizure of the Omsk regime, the world began to think it was just a small ripple in Russian politics. However, today Tsukishiro Yuki suddenly declared war on all surrounding nations and mobilized the national army, advancing out towards the borders. The OFN, Unity Pact, and Co-Prosperity Sphere nations have all expressed strong condemnation towards the Tsukishiro Yuki regime. Our war correspondent reported that it's impossible to enter the interior of Omsk city, let alone investigate the internal situation of the so-called \"Magical Witch National Rebirth Government.\" According to accusations from Russian refugees who narrowly escaped from Omsk, the Omsk regime is an anti-human, destruction-advocating regime, where all human residences within have been converted into massive prisons, and where the massacre of humans takes place day after day. Its authenticity remains to be verified.\n\nOur reporter will continue to report on the situation in Omsk."
 WORLD_2WRWTER.114514.a: "??? What the hell is this?"
 MGI_Magical_Factor: "Witch Factor Infection"
 MGI_Magical_Factor_desc: "The \"Great Witch\" Tsukishiro Yuki sowed many witch factors into the human world during her travels around the globe, and they have now penetrated the very bones of humanity. At a single thought of Tsukishiro Yuki, the fuses will be lit, and humans will rapidly turn into witches full of murderous intent. When that time comes, she can use her \"best friend\" Emma Sakuraba to activate the witch killer, thereby achieving her goal, presenting the first and also the last grand curtain call for the human world————\n\n§RThe Great Witch Trial§!."
 MGI_the_end_tt: "Thus, she sank into the ocean depths. §MThank you for playing through the April Fools content of the STL mod. We hope you had a blast in the battles, just as we did when making it.§!"
