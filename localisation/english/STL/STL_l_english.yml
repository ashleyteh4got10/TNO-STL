 WORLD_2WRWTER.1.t: "[Get_newspaper_header] Communist Coup in Laos"
 WORLD_2WRWTER.1.desc: "Many people have accused Lao Prime Minister Souphanouvong of sympathizing with communism in both public and private spheres. Today, the \"Red Prince\" proved the truth of those words. Following the establishment of the Southeast Asian Revolutionary Alliance, he not only publicly declared his support for its members, but also formally withdrew from the Co-Prosperity Sphere to join the alliance as a sign of solidarity. Laos has been renamed the Lao People's Democratic Republic, joining a nascent communist bloc in Asia alongside Vietnam.\n\nSince Souphanouvong had previously expressed support for Pan-Asianism, his actions caught everyone by surprise. A bewildered Japan issued a sharp condemnation, as the millions of yen they had invested in Laos's development went down the drain. Souphanouvong also banned several royalist and far-right parties in the country, and recalled officials of the Indochinese Communist Party who had previously been expelled from Lao politics back into the government. Nevertheless, no other changes have been made to the country's existing democratic structures.\n"
 WORLD_2WRWTER.1.a: "The Co-Prosperity Sphere loses another member."
 WORLD_2WRWTER.3.t: "[Get_newspaper_header] Sino-Russian War"
 WORLD_2WRWTER.3.desc: "With the breakdown of Sino-Russian negotiations, Russia has shockingly declared war on China when the latter was not fully prepared, and its forces have already crossed the Sino-Russian border. [SOV.GetLeader] has publicly declared that the purpose of the war is to \"recover the Far East homelands occupied by China.\" Hours after the war broke out, the Chinese government \"expressed strong protests\" against the Russian government's actions, and initiated wartime mobilization across the country, calling on the people to actively resist the invaders while urging all nations of the Asian Revolutionary Alliance to assist China in fighting the aggression of \"Russian imperialism.\" \n\nImmediately upon the outbreak of war, the OFN declared its support for China's resistance against Russian aggression and dispatched weapons and military advisors to member nations of the Asian Revolutionary Alliance. While the Unity Pact has not yet responded to the war, international commentators believe there is a high probability it will stand on the opposing side of Russia to weaken Russian power. According to insiders, Japan—which had vanished from the scene after its complete defeat in the Second Great East Asian War a few years ago—is mobilizing troops again after a few years of recovery, moving from Hokkaido towards the Sino-Russian border."
 WORLD_2WRWTER.3.a: "Let us do it once more."
 WORLD_2WRWTER.3.b: "Burn the boats."
 WORLD_2WRWTER.3.c: "Why is Eurasia fighting again?"
 WORLD_TER.400.t: "[Get_newspaper_header] Sino-Soviet Treaty Officially Signed"
 WORLD_TER.400.desc: "Today, news emerged from Moscow and Beijing: [CPC.GetName] and [SOV.GetName], two socialist nations that had only recently emerged from civil wars, officially signed the \"Sino-Soviet Treaty of Friendship, Alliance and Mutual Assistance\" in Beijing. The treaty stipulates that China will provide volunteer forces and equipment support for the Soviet Union's Second West Russian War, while the Soviet Union will return its occupied parts of Mongolia, Tannu Tuva, and the Far East Chinese \"Outer Northeast\" region. After the war, the two nations will form an alliance in economic, technological, and resource spheres to seek common development and progress.\n\nMost international media outlets view this as another manifestation of the expansion of the international communist movement; Germany and Japan have refrained from commenting."
 WORLD_TER.400.a: "Long live the great unity of the people of the world!"
 WORLD_TER.400.b: "Nothing more than a deathbed struggle."
 WORLD_TER.400.c: "..."
 WORLD_TER.400.d: "A glimmer of hope for a new order?"
 SE_SINO_RUSSIA_WAR: "CONTINENTAL SHELF WAR"
 SE_SINO_RUSSIA_WAR_D: "However, if any side insists on acting unreasonably, if they push us too far, if they practice oppression, then the Communist Party must treat it with a serious attitude. This attitude is: We will not attack unless we are attacked; if we are attacked, we will certainly counter-attack.\n-Mao Zedong"
 SE_SINO_RUSSIA_WAR_A: "Peace No More"
