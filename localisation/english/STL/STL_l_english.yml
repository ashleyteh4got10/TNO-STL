 STL_CHI_main_story.1.t: "The Heavens Bear Witness"
 STL_CHI_main_story.1.desc: "It was the opening day of the 1970s. Young students from Tsinghua, Peking, Fu Jen, and other schools, along with a considerable portion of Beiping citizens, followed the instructions of secret leaflets distributed half a month ago and came to Lugou Bridge. They saw a woman in her late thirties standing on a temporary platform by the bridge, holding a white megaphone.\n\n\"Citizens, democratic comrades! This is the first morning of 1970. I stand here to win a future for our Beiping free from oppression and ruin!\"\n\n\"You should remember that seven years ago our Beiping made immense sacrifices for the fight for democracy and freedom—more than three thousand Beiping citizens were innocently arrested, and a third of them were summarily executed, including our senior predecessor in the Citizens' Association, Mr. Chu Anping, and Mr. Yu Luoke, of whom there has been no news to this day!\"\n\n\"That's right! Yu Luoke, who was placed on the 'wanted' lists of the Republic of China police and the Manchukuo Army for seven years, died here, in this very Yongding River!\"\n\nAn uproar broke out in the venue.\n\n\"It was here by the Lugou Bridge that several senior members of the Democratic Comrades Association braved the immense danger of arrest for violating the curfew, salvaged the remains of the martyr Yu Luoke, and buried him on the spot,\" Zhang Zhixin's voice grew sorrowful. \"The death of martyr Yu Luoke was extremely tragic, and I cannot bear to describe it further—but his death truly taught us all a lesson.\"\n\nZhang Zhixin took a deep breath: \"The invaders use their bullets to create blood, yet use our blood to irrigate their ambitions!\"\n\nCries erupted from the venue again and again, but Zhang Zhixin still shouted through the higher-powered megaphone against the noise: \"Citizens, the Japanese have locked us in chains for forty years with a forty-yen hourly wage! The headquarters of the Japanese puppet Manchukuo Army has retreated to Rehe. Do we have any reason left to continue obeying their so-called military control?\"\n\nSeeing that the crowd was fired up, Zhang Zhixin raised her right fist: \"Down with Japanese imperialism! Drive out the Manchukuo invaders! Give us back our free Beiping!\""
 STL_CHI_main_story.1.o: "\"Give us back our free Beiping!\""
 STL_CHI_main_story.2.t: "The Billowing Yangtze Rolls On"
 STL_CHI_main_story.2.desc: "It was morning in Wuhan. A red and white sun pierced through the layers of mist over the Yangtze River, painting the sky beneath the endless layers of stratocumulus clouds a crimson red. The Yangtze flowed quietly, the mother river of the Chinese nation never stopping. Lu Hong'en and thousands of Wuhan citizens had spent the night awake, holding their breath, listening to the artillery sounds drawing closer outside the city. The rumbling artillery fire reminded Lu Hong'en of the timpani he heard in the orchestra back when he was still in Shanghai. Amidst the earth-shattering war drums, Wuhan would either bow its head once more or proudly earn the right to stand, shaking off the dust of the past, showing the true colors of China's first city of revolution.\n\nBy noon, the sounds of artillery gradually died down. By the afternoon, the People's Liberation Army entered the city. Rows of men in ash-green uniforms, their faces still covered in dust and blood, quietly and curiously took in this thoroughfare of nine provinces. Seeing the efforts of himself and other comrades finally blossom into fruit, Lu Hong'en, walking along the riverbank, felt a bit dazed. He thought of the Heavenly Lord his family believed in. Could there truly be such an all-knowing, all-powerful, and merciful Lord to save China?\n\n\"Is this Comrade Lu Hong'en of the People's Justice League?\" A greeting interrupted Lu Hong'en's thoughts. It was a PLA officer. With a face covered in dust, he adjusted his military cap that had become disheveled from the consecutive days of war, brushed off his uniform, and gave Lu Hong'en a straight salute. \"The Party Central Committee is very grateful for your work in Wuhan. Thanks to you and the comrades of the People's Justice League, the PLA was able to take over Wuhan with minimal losses. With the support of the Wuhan people, we will surely liberate all of China faster!\"\n\n\"Liberating China... that is certainly good, but how do you plan to handle the current situation in Wuhan? We, the citizens of Wuhan, have resisted for a long time. Even though the wealth extracted by the Gao puppet government now belongs to the people, you've seen it yourself, haven't you?\" Speaking of this, Lu Hong'en looked toward the city. \"There are still many people who are displaced, many who cannot eat enough or dress warmly, many who must beg to survive... What do you plan to do?\"\n\nThe PLA officer looked at Lu Hong'en's hands. They were the hands of a pianist, slender and long, yet worn with calluses from the fires of war. \"The purpose of the Communist Party has always been to serve the people. We will make every effort to guarantee the normal life of the Wuhan people. But there is another urgent matter: how is the production status of the Hanyang Arsenal? If it has stopped, can it be quickly resumed to support the front line?\"\n\nLu Hong'en choked. He acutely caught a discordant note, preventing him from continuing to raise questions about worker democracy, democratic elections, freedom of speech, and free artistic expression. He reminisced about his life more than thirty years ago when he performed in the foreigners' adventure paradise. Back then, he didn't have the concerns and burdens of today, only music and the next meal to think about. Perhaps when China was liberated, he could return to Shanghai and play the piano again."
 STL_CHI_main_story.2.o: "...All are passed in talk and laughter"
 STL_CHI_main_story.3.t: "Hainan Province Secret Report"
 STL_CHI_main_story.3.desc: "President Gao Zongwu:\n\nSince 1968, the Communist \"Qiongya Column\" has infiltrated and made contact with Zhanjiang, Leizhou, and other places. Today, we suddenly lost contact with the local area of Leizhou. Leizhou has publicly declared the establishment of the \"Anti-Persecution Struggle Committee,\" with its community leader being Su Shouzhong.\n\nSu Shouzhong, also known as Su Youshi, born in Guangzhou in 1941, has successively believed in Catholicism and Buddhism. In 1959, he entered the Fujitsu Hong Kong factory. He was fired by Fujitsu after participating in the protest and hunger strike in Central, Hong Kong, due to the 1963 Li Chunru suicide incident. He then moved to Leizhou, and after working in Japanese enterprises for a long time, his thoughts gradually shifted towards becoming a revolutionist, secretly forming the underground Anti-Persecution Committee group.\n\nWith recent incidents occurring in Beiping and Wuhan, Su Shouzhong organized a protest march on his own to \"respond to the righteous uprising.\" Later, the Anti-Persecution Committee seized control of the Zhanjiang government building and declared autonomy for the Leizhou Peninsula.\n\nNow, the fires on the eastern riot front lines have been ignited. If we do not take action, our twenty years of peaceful rule will be destroyed."
 STL_CHI_main_story.3.o: "Approve the action."
 STL_CHI_main_story.4.t: "Riots in the East!"
 STL_CHI_main_story.4.desc: "Recently, large-scale democratic armed riots have broken out in Beiping, Wuhan, Leizhou, and other places, threatening to burn across the land. The underground Communist networks that were almost extinguished are active once again. This is our perfect opportunity to capture the underground Communist forces in one fell swoop and bolster our strength!\n\nNanjing has approved the suppression plan for the eastern riot forces, and issued a serious warning to the representatives of the rioting mobs in the three cities. Units of the National Revolutionary Army are on standby outside the three cities. The intelligence departments have thrown themselves fully into work. We must eliminate the red bandits, wipe out the riots, and defend the Three Principles of the People's China!"
 STL_CHI_main_story.4.o: "Always prepared."

 # April Fools 111111 --愚人节
 MGI: "Magical Witch National Rebirth Government"
