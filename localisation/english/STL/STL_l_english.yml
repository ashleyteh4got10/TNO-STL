 BOOKMARK_MAR_NEW: "Verkhne-Kamskoye Governorate/Regency of Berezniki"
 BOOKMARK_MAR_NEW_DELAYED: "§FCopyrighted by The New Order: §fTsar§! And §XSoviet§!Team\n-is Integrated into §xTNO:STL§!in version §LThe Raging Sea§!\nNew content in this version: \n§Y§eNew Begining§!\n§rHow the Steel Was Tempered§!\n§lSecond Chance§!§!\n§Y- §gSecond West Russian War§!\n-New Mechanisms and GUI\n-New opportunities and divergent endings!"

 STL_version_intro_tt: "§LThe Raging Sea§!\n\n§LThe Raging Sea§!,originally refers to drastic changes in the world and turmoil in the mountains and rivers, later gradually becoming synonymous with the torrent of the times. In troubled times, rivers change course, heaven and earth swap places; the old era sinks and floats in the stormy seas, while a new world is bred amidst the gathering winds and clouds. The line \"§LWalls of stone will stand upstream to the west, to hold back Wushan's clouds and rain, till a smooth lake rises in the narrow gorges§!\" from Mao Zedong's 'Water Melody:Swimming', endows this torrent with new meaning—people can not only adapt to history, but also shape it with their own hands, channeling the surging era into the people's own course.\nCorresponding TNO Version: §OThe Modern Tordesillas§! - Ver.1.10.x"

 STL_version_intro_tt_delayed: "§FThroughout history, people have often believed that history is like a river, capable only of flowing downstream; however, it is the people within this vast river who truly propel the torrent of history forward. The raging sea agitates the mountains, rivers, and lakes, washing out the destiny of an era.\n\nThe end of the World War II did not usher in true peace. §qGermany§!, §eJapan§!, and their followers partitioned the Eurasian continent, planting the banners of fascism all over the old world. The flames of revolution were crushed into ashes by steel and violence, while freedom, justice, and equality were reduced to feeble words among the high mountains and steep ridges. The powerful proclaimed that the new order they forged would last a thousand years; the end of history was merely an epitaph written by the victors for the vanquished.\n\nYet, no river can remain stagnant forever, nor can any empire truly freeze history. Steel can suppress rebellion, but it cannot extinguish faith; high walls can isolate the people, but they cannot stop the march of time. From the mountains of §RChina§! to the boundless permafrost of §SRussia§!, there are always those guarding a faint flicker of light in the dark night. They may never know each other, and they may never witness the dawn in their lifetimes, but they firmly believe: someone will take up the fallen's banner, and one day, the old world will finally meet its twilight.\n\nAt last, some traversed the snowfields to plant the crimson flag back in Moscow; some emerged from the mountains to make the five stars shine over the Divine Land once again. The two rivers, once separated by thousands of miles, will eventually converge downstream in history, joining forces to wash away the final dams of the old era. The thousand-year empire that fascism took so much pride in is, ultimately, nothing more than a wave in the long river of time.\n\nThe river is still surging, and the world is still moving forward. A new order will not be made eternal by a single victory, nor will the future be preordained by a single revolution. Yesterday's revolutionaries forged today, and the people of today will decide tomorrow.\n\nIn the past, the world sank amidst the raging sea; today, the people themselves are the very torrent that changes history.§!"
 TNOSTL_menupic_tooltip_1: "§FIdle boast the §Rstrong pass§! is a wall of iron, with firm strides we are crossing its summit.§!"
 TNOSTL_menupic_tooltip_2: "§F§LIf Heaven had feelings§!, it too would grow old; the right path in the human world is through vicissitudes.§!"
 TNOSTL_menupic_tooltip_3: "§F§OBitter sacrifice§! strengthens bold resolve, daring to make sun and moon shine in new skies.§!"


