 TER_new_automatic_dec: "TER hosting service"
 TER_new_automatic_dec_desc: "In response to feedback from many commanders regarding the automation mechanics, TENFUJI CHANCE, a member of the STL dev team, has developed updates and improvements to the automation system, adding the following mechanics on top of the existing framework:\nAutomatic Party member allocation and prioritized development for regions with unity levels below 2 for the Northwest Bureau; dynamic urban development and militarization mechanics for the Southwest Bureau; new mechanisms to counter Ma Clique expansion and address low popular satisfaction for the Xinjiang Bureau.\n\nMost mechanics have been integrated into the existing automation system—you only need to click the button in the top-left corner of each Bureau's GUI interface to enable them. The Party member allocation system operates separately, automatically distributing members every 10 days once activated. Please note that enabling these mechanics still requires manual activation, but you do not need to click again to adjust allocation plans once enabled."
 TER_cal_NWB_SWB: "§WAutomatically managed the The party members with Priority:§Y Northwest Bureau§! AND §GSouthwest Bureau§!§!"
