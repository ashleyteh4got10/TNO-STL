#Post-war spirit
CPC_PRC_period_1: "The Young Phoenix Finds a Perch"
CPC_PRC_period_2: "The Azure Flow Never Rests"
CPC_PRC_period_3: "The Sun Illuminates the Firmament"
CPC_PRC_period_tt: "Highest organ of power: [PRC_highest_power]\nHighest administrative organ: [PRC_highest_gov]\nCurrent ruling party: [PRC_ruling_party]\nCurrent participating party: [PRC_participating_party]\n\nMonthly change in administrative efficiency: [?CPC_admin_efficiency_monthly_rate|=.1%%+]\nDaily political power gain: [?CPC_political_power_gain|=+]\nStability: [?CPC_stability_factor|=.1%%+]\nWar support: [?CPC_war_support_factor|=.1%%+]\nGDP growth rate: [?CPC_gdp_growth_modifier|=.3%%+]\nMonthly change in agricultural technology: [?CPC_agriculture_monthly_rate|=.1%%+]\nMonthly change in industrial expertise: [?CPC_industrial_expertise_monthly_rate|=.1%%+]\nMonthly change in industrial equipment: [?CPC_industrial_equipment_monthly_rate|=.1%%+]\nProduction efficiency growth: [?CPC_production_factory_efficiency_gain_factor|=.1%%+]\nConstruction speed: [?CPC_production_speed_buildings_factor|=.1%%+]"
PRC_highest_power_CPGAC: "Central People's Administrative Committee"
PRC_highest_power_CONGRESS: "National People's Congress"
PRC_highest_gov_PEOPLE: "Central People's Government"
PRC_ruling_party_CPC: "Communist Party of China (CPC)"
PRC_rebuild_party_CPC: "China Democratic Revolutionary League, New China Democratic League, Progressive faction of the Kuomintang (KMT)"
PRC_participating_party_CPC: "China Democratic Revolutionary League, New China Democratic League, Revolutionary Committee of the Kuomintang (KMT), Chinese Peasants' and Workers' Democratic Party, China Zhi Gong Party"
CPC_ununified_country: "A Country Not Yet Unified"
CPC_ununified_country_desc: "Although we have achieved a perfect victory on the mainland, looking around, Taiwan, China and its affiliated islands, the South China Sea, and Sakhalin are still in Japanese hands, and Bhutan still controls a small piece of land. Our country has not yet completed its final unification, which is both a regret and our goal."
CPC_cold_war_with_JAP: "The Sino-Japanese 'Cold War'"
CPC_cold_war_with_JAP_desc: "Although we do not officially acknowledge that China and Japan are in a state of Cold War, reality tells us that Japanese imperialism will not give up; they still intend to provoke this Cold War. Be that as it may, the de facto Cold War still reminds us that a thorough revolution must be carried out against Japan in order to end this century-old grievance."
CPC_disintegrated_industrial_1: "A Disintegrated Industrial System"
CPC_disintegrated_industrial_1_desc: "Since the Defense of the Northwest, the different policies adopted by the National Defense Government and the puppet government have caused industrial development in the east and west to become increasingly deformed, forming separate and independent industrial systems. If we do not integrate the redundant factories and enterprises as soon as possible, under free market competition there is no doubt that the burden on the people will increase."
CPC_disintegrated_industrial_2: "A Disintegrated Industrial System"
CPC_disintegrated_industrial_2_desc: "Since the Defense of the Northwest, the different policies adopted by the National Defense Government and the puppet government have caused industrial development in the east and west to become increasingly deformed, forming separate and independent industrial systems. If we do not integrate the redundant factories and enterprises as soon as possible, under free market competition there is no doubt that the burden on the people will increase."
