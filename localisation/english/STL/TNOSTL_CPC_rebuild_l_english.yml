CPGAC_prop_new_officers_training_program: "New Cadre Training Program"
CPGAC_prop_new_officers_training_program_desc: "The Party Central Committee has decided to establish accelerated cadre schools to address the shortage of cadres in various places. To this end, we must determine the guidelines for training new cadres and define exactly what kind of cadres we need."
CPGAC_prop_new_officers_training_program_effect: "Will determine the basic guidelines for future §Ycadre training§! and unlock the §Ycorresponding national focus§!."
CPGAC_prop_new_officers_training_program_option_0: "Prioritize Worker and Peasant Cadres"
CPGAC_prop_new_officers_training_program_option_1: "Strict Cadre Standards"
CPGAC_admit_worker_peasant_cards: "In the §YNew Cadre Training Program§! we adopted the £TER_texticon_mao §GMaoist§! plan."
CPGAC_admit_strict_party_member: "In the §YNew Cadre Training Program§! we adopted the plan of the £TER_texticon_liu §mLiu faction§!, with the support of the Secretariat faction."
CPGAC_prop_restructure_national_industry: "Restructure National Industry"
CPGAC_prop_restructure_national_industry_desc: "As urban reconstruction proceeds, the national bourgeoisie has mixed feelings about us. Therefore, we should promptly define our policy toward them and dispel their doubts."
CPGAC_prop_restructure_national_industry_effect: "Will determine the future policy toward the §Ynational bourgeoisie§! and unlock the §Ycorresponding national focus§!."
CPGAC_prop_restructure_national_industry_option_0: "Transform National Capital"
CPGAC_prop_restructure_national_industry_option_2: "Restore National Capital"
CPGAC_admit_reform_national_capitalism: "In the §YRestructure National Industry§! we adopted the £TER_texticon_mao §GMaoist§! plan."
CPGAC_admit_appease_national_capitalism: "In the §YRestructure National Industry§! we adopted the plan of the £TER_texticon_liu §Rdemocratic parties§!."
CPGAC_u_anit_bandit_and_hage: "Suppress Bandits and Fight Local Tyrants"
CPGAC_u_anit_bandit_and_hage_desc: "After liberation, counterrevolutionaries such as bandits and village tyrants have grown increasingly arrogant and rampant, causing the already unsettled newly liberated areas to teeter. Many former puppet officials and traitors are mixed among them, intending to launch an uprising; the latest intelligence shows that these counterrevolutionaries are funded by Japanese imperialism, and once they succeed, they will immediately become accomplices of Japanese imperialism, staging a counterattack. Therefore, we must round them up in one swoop before they can act."
