STL_CPC_anti_colonial_over_tt: "§nNational conditions§! will gain a bonus of §R+§Y0.25§! political power§! per month, and completely end the pain inflicted on the Chinese nation by §jJapanese imperialism§!"
STL_CPC_specify_chinese_lang_study_tt: "Eliminate the last remnants of colonial culture left by §jJapanese imperialism§! in §YMongolia§!"
