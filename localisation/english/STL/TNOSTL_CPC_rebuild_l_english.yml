TER_ballot_title: "Ballot for the First National People's Congress of the People's Republic of China"
TER_ballot_subtitle: "(Listed in order of the number of strokes in the names)"
TER_ballot_note_1: "Instructions: 1. This ballot elects [?TER_ballot_candidate_sum] representatives. A ballot on which the number of 'approve' marks is equal to or fewer than the number of seats to be filled is valid; one with more is invalid."
TER_ballot_note_2: "2. To indicate approval, mark '○' in the box below the candidate's name; to indicate opposition, mark '×'; to abstain, leave the box blank."
TER_ballot_note_3: "3. To vote for someone else, first mark '×' in the box below the name of the candidate you oppose, then write the name of your chosen alternative in the 'other candidate' column, noting their work unit and ethnicity. Those who abstain cannot vote for another candidate."
