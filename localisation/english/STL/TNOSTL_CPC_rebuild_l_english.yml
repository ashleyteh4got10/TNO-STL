CPC_disintegrated_industrial_4_desc: "Since the Defense of the Northwest, the different policies adopted by the National Defense Government and the puppet government have caused industrial development in the east and west to become increasingly deformed, forming separate and independent industrial systems. If we do not integrate the redundant factories and enterprises as soon as possible, under free market competition there is no doubt that the burden on the people will increase."
TER_coordinate_industrial_support_tt: "The nation's §Gindustrial system§! will be partially §Yintegrated§!"
TER_coordinate_industrial_complete_tt: "The nation's §Gindustrial system§! will be completely §Yintegrated§!"
CPC_administrative_overload_1: "An Overextended Administrative Apparatus"
CPC_administrative_overload_2: "An Overextended Administrative Apparatus"
CPC_administrative_overload_3: "An Overextended Administrative Apparatus"
CPC_administrative_overload_4: "An Overextended Administrative Apparatus"
CPC_administrative_overload_5: "An Overextended Administrative Apparatus"
CPC_administrative_overload_1_desc: "As the Chinese Revolution achieves great victory, the Communist Party of China (CPC) is about to transition from a local ruling party to a national ruling party, and the newly formed bureaucracy is beginning to struggle to adapt to our actual situation. We must expand the administrative departments and carry out a series of reforms to alleviate the current administrative pressure."
CPC_administrative_overload_2_desc: "As the Chinese Revolution achieves great victory, the Communist Party of China (CPC) is about to transition from a local ruling party to a national ruling party, and the newly formed bureaucracy is beginning to struggle to adapt to our actual situation. We must expand the administrative departments and carry out a series of reforms to alleviate the current administrative pressure."
CPC_administrative_overload_3_desc: "As the Chinese Revolution achieves great victory, the Communist Party of China (CPC) is about to transition from a local ruling party to a national ruling party, and the newly formed bureaucracy is beginning to struggle to adapt to our actual situation. We must expand the administrative departments and carry out a series of reforms to alleviate the current administrative pressure."
CPC_administrative_overload_4_desc: "As the Chinese Revolution achieves great victory, the Communist Party of China (CPC) is about to transition from a local ruling party to a national ruling party, and the newly formed bureaucracy is beginning to struggle to adapt to our actual situation. We must expand the administrative departments and carry out a series of reforms to alleviate the current administrative pressure."
CPC_administrative_overload_5_desc: "As the Chinese Revolution achieves great victory, the Communist Party of China (CPC) is about to transition from a local ruling party to a national ruling party, and the newly formed bureaucracy is beginning to struggle to adapt to our actual situation. We must expand the administrative departments and carry out a series of reforms to alleviate the current administrative pressure."
CPC_anti_revolution: "Rampant Reactionary Forces"
CPC_anti_revolution_desc: "The victory of the revolution we have achieved is only a victory on the surface. The reactionary forces will not give up because of it; they kill, set fires, and rob, still clinging to the fantasy of overthrowing the people's regime."
CPC_banditry_activation: "Rampant Banditry"
CPC_no_land_reform: "Land Reform Not Yet Carried Out"
CPC_restless_society: "A Restless Population"
#Post-war national focuses
CPC_rebuild_1: "National Reconstruction - Phase One"
CPC_rebuild_1_medium_1: "10th National Congress of the Communist Party of China (CPC)"
CPC_rebuild_1_medium_1_desc: "The country is in ruins and awaiting reconstruction, the people yearn for stability, foreign enemies remain malicious, and internal traitors bide their time. Under such circumstances, the Communist Party of China (CPC) has reached the point of leading the whole nation. How should we gather this heap of loose sand? How should we break through the difficult situation? One question after another urgently demands answers from the Communist Party of China (CPC)."
CPC_rebuild_1_medium_1_tt: "A new §Bera§! has §Ybegun§!, and the §xCommunist Party of China (CPC)§! will anchor its §Gdirection§!. Whatever the §Rfuture§! holds, §xwe will never regret it§!."
CPC_rebuild_1_medium_2: "Dispatch Eastward Cadres"
CPC_rebuild_1_medium_2_desc: "Thanks to the policies previously adopted to deal with aging cadres and the democratic reforms at the rural grassroots, we have accumulated a group of cadres sufficient to take over the newly liberated areas, and now is the time to dispatch them to implement the policies of the Party Central Committee."
CPC_rebuild_1_medium_2_tt: "The §xParty§! will release §Y[?PRC_backup_PP|.1]§! thousand cadres trained before the war"
CPC_rebuild_1_medium_3: "Establish Accelerated Cadre Schools"
CPC_rebuild_1_medium_3_desc: "Although anticipated and prepared for, the demand for cadres in the newly liberated areas still exceeds our plans. The existing eastward cadres are not enough, so we must immediately launch accelerated training to ensure that central policies are implemented at the local level."
CPC_rebuild_1_medium_3_left_1: "Promote Worker and Peasant Cadres"
CPC_rebuild_1_medium_3_left_1_desc: "The Communist Party of China (CPC) is the vanguard of the working class, and the peasants are the allies of the workers. The Communist Party of China (CPC) brought about the worker-peasant alliance and represents the fundamental interests of the broad masses of workers and peasants. Therefore, in selecting cadres, we must focus on worker cadres and peasant cadres, strengthening their voice in grassroots Party organizations."
CPC_rebuild_1_medium_3_left_2: "Strict Standards for Party Cadres"
CPC_rebuild_1_medium_3_left_2_desc: "Organizational discipline is a great magic weapon of the Communist Party of China (CPC). It is precisely because the broad mass of Party members strictly observe intra-Party organizational discipline and are absolutely loyal to the Party Central Committee and its leadership that the Party's correct policies can be implemented at the grassroots. Therefore, we must also apply strict standards in selecting cadres and must not let mediocre opportunists slip into the Party."
CPC_rebuild_1_medium_4: "Retain Puppet Government Officials"
CPC_rebuild_1_medium_4_desc: "Chairman Mao once said: 'Learn from past mistakes to avoid future ones, and cure the sickness to save the patient.' The officials of the puppet government are indeed guilty of terrible crimes, but at present we must remain calm. Not only because of the shortage of cadres in the newly liberated areas, but also because most officials were merely bowing to circumstances; we can remold them and let them play a proper role in new posts and gain the understanding of the people."
CPC_rebuild_1_medium_4_left_1: "Gradually Dismiss Puppet Officials"
CPC_rebuild_1_medium_4_left_1_desc: "Be that as it may, the officials of the puppet government did, after all, serve the puppet government. From the perspective of public opinion or of the people's regime, they should not continue to occupy their former posts without doing any work. They should undergo remolding and achieve new results in new positions."
CPC_rebuild_1_medium_4_left_1_tt: "After strict screening, a new batch of §GParty members§! will enter government organs across the country"
CPC_rebuild_1_medium_4_left_2: "Retain Progressive Talent"
CPC_rebuild_1_medium_4_left_2_desc: "The puppet government was not a monolith; there were also progressive-minded people within it. We must fully unite with them, let them sincerely serve the Chinese people, and give full play to their proper role."
CPC_rebuild_1_medium_4_left_2_tt: "After strict assessment, a group of progressive talents will join the §RParty organization§!"
CPC_rebuild_1_medium_5: "Mass Supervision"
CPC_rebuild_1_medium_5_desc: "How can we ensure that the Party's governance fully embodies the will of the masses? By letting the masses supervise the Party's governance. We must fully mobilize our masses to participate in political affairs and, through democratic centralism, allow the opinions of the masses to be fully expressed. Our cadres must humbly accept criticism and suggestions from the masses and improve our policies based on their opinions, thereby fully embodying the will of the masses."
CPC_rebuild_1_medium_6: "The 'Three Anti' and 'Five Anti' Campaigns"
CPC_rebuild_1_medium_6_desc: "In the course of advancing grassroots construction in the newly liberated areas, we have discovered large numbers of corrupt officials colluding with criminals for personal gain, causing enormous waste of resources and seriously endangering the lives of the people. We must immediately launch the campaigns against 'corruption, waste, and bureaucracy' and against 'bribery, tax evasion, fraudulent appropriation of state property, cutting corners, and stealing state economic intelligence' to safeguard the safety and interests of the people and recover and reduce the losses of the Party and the state."
CPC_rebuild_1_medium_7: "Consolidate the People's Democratic Dictatorship"
CPC_rebuild_1_medium_7_desc: "How to embody the will of the masses? By letting the people democratically elect and democratically decide. How to effectively safeguard the fundamental interests of the people? By exercising dictatorship over the enemies of the people. Therefore, the Party must fully consolidate the people's democratic dictatorship, embody the will of the people, and safeguard their fundamental interests."
CPC_rebuild_1_left_1: "Go Deep into the Countryside"
CPC_rebuild_1_left_1_desc: "Having worked in the western countryside for a long time, we lack sufficient understanding of today's eastern countryside, and the vast countryside is a major feature of China. Therefore, the Party's reach must extend to the eastern countryside, making full use of our experience working in the west so that the Party's policies and will are fully understood and implemented in the eastern countryside."
CPC_rebuild_1_left_2: "Suppress Bandits and Fight Local Tyrants"
CPC_rebuild_1_left_2_desc: "The incompetence of the puppet government has long exposed the people across China to bandits and local tyrants. In the newly liberated areas, many bandits attack villages and rob property, while some local tyrants throw their weight around in the villages, posing a serious threat to the lives and property of the people. The Party Central Committee has ordered the launch of the campaign to 'suppress bandits and fight local tyrants,' mobilizing the people to assist the People's Liberation Army (PLA) in eliminating bandits and tyrants."
CPC_rebuild_1_left_3: "Survey Land and Assess Yield"
CPC_rebuild_1_left_3_desc: "To restore the rural economy, we must first understand what each village has. The Party Central Committee has instructed local cadres to make full use of the experience of the land survey movement from a few years ago, to figure out how much land, how many households, and how much property each village has, and to gain a thorough understanding of the current state of the countryside."
CPC_rebuild_1_left_3_tt: "The progress of §Gland reform§! in the eastern region §Ghas increased§!"
CPC_rebuild_1_left_3_left_1: "Classify Class Status"
CPC_rebuild_1_left_3_left_1_desc: "Class classification is intended to ensure the stability of production and is also an important means of maintaining the Party's link with the proletariat. Unlike the western countryside, the eastern countryside has not carried out class movements, so we need to immediately begin class classification so that when we eliminate the exploiting classes in the future we will not let the real ones escape or wrongly kill the innocent."
CPC_rebuild_1_left_3_left_2: "A New Look for the Countryside"
CPC_rebuild_1_left_3_left_2_desc: "Our policies are correct and effective. Compared with the western countryside, the eastern countryside has no fundamental differences apart from a gap in production. Every household has land to cultivate, bankrupt peasants have been pulled back from the brink of death, the faces of the people are wreathed in smiles, and the desolation of the countryside is gone forever."
CPC_rebuild_1_left_3_right_1: "Distribute Land"
CPC_rebuild_1_left_3_right_1_desc: "The land reform in the western region back then secured the Party's leading position in the west. Now the Party will extend this valuable experience to the east. We must carry out land reform in the eastern countryside, distributing contiguous tracts of land to the peasants for cultivation, and completely overthrowing the feudal land system, sweeping it into the dustbin of history."
CPC_rebuild_1_left_3_right_2: "Encourage Cooperatives"
CPC_rebuild_1_left_3_right_2_desc: "Although the peasants have obtained land, some still go bankrupt because they cannot afford the costs. The cost of farming land is not something a single household can bear, so we should promote the cooperative system of the western region in the eastern countryside to fully safeguard the fundamental interests of the peasants."
CPC_rebuild_1_left_4: "Literacy Campaign"
CPC_rebuild_1_left_4_desc: "What exactly is preventing the proletariat from fighting for its own interests? The exploiting classes have deprived the proletariat of the awareness that they are being exploited. One of their means is to deprive the proletariat of the right to education. Therefore, we must vigorously develop education; first, we must make them literate, let them think and write, and thereby actively consider how to improve their own lives."
CPC_rebuild_1_left_4_left_1: "Open Night Schools"
CPC_rebuild_1_left_4_left_1_desc: "Most laborers have their daytime occupied by busy work; unlike students, they cannot find time to study during the day. But lacking time during the day does not mean the night cannot be used. Through night schools, we can provide education to laborers who work during the day."
CPC_rebuild_1_left_4_left_2: "Establish Rural Vocational Schools"
CPC_rebuild_1_left_4_left_2_desc: "Developing various industries requires large numbers of talents, and our educational facilities are still insufficient. In the new era, all industries have shown strong specialization, which means we must pay attention to specialized training when cultivating talent; and since cities lack talent, the countryside must solve this itself. Therefore, we will invest sufficient funds to establish vocational schools in the vast countryside."
CPC_rebuild_1_left_4_right_1: "Build Water Conservancy Projects"
CPC_rebuild_1_left_4_right_1_desc: "Water is an extremely important resource; drinking, irrigation, power generation, and so on all require water. Water can also be harmful, as floods and deluges of all kinds seriously threaten the lives and property of the people. In a country as old as China, water conservancy is also etched into our culture. Building water conservancy facilities across the vast eastern land will be of great help to future economic development and work."
CPC_rebuild_1_left_4_right_2: "Develop Rural Industry"
CPC_rebuild_1_left_4_right_2_desc: "China does not have many industrial cities, and the scattered countryside will not disappear in a short time, yet we have an urgent need to develop industry. The Party Central Committee believes that developing rural industry can effectively meet the demand for industrial development and also ease the pressure on cities, without the need to concentrate large numbers of industries there."
CPC_rebuild_1_left_5: "Pilot Agricultural Collectivization"
CPC_rebuild_1_left_5_desc: "As the eastern agricultural economy recovers, the Party Central Committee, drawing on years of experience with cooperativization in the western region, believes that agricultural collectivization can be carried out alongside the promotion of cooperativization. Therefore, we will select a number of areas with a high socialist component to launch agricultural collectivization."
CPC_rebuild_1_left_6: "Steadily Advance Cooperativization"
CPC_rebuild_1_left_6_desc: "The Party once deepened ethnic contradictions in the northwest by forcibly imposing agricultural collectivization. This lesson tells the whole Party and the people that development beyond one's stage does not exist. We must not repeat the same mistake in the newly liberated areas and must ensure that agricultural cooperativization advances steadily."
CPC_rebuild_1_right_1: "Take a Foothold in the Cities"
CPC_rebuild_1_right_1_desc: "After liberation, urban residents in the east were not clear about the Party's policies and lacked sufficient understanding of the Party, but we need the cities to develop industry. Therefore, we must do everything possible to win the support of the overwhelming majority of the people in the cities."
CPC_rebuild_1_right_2: "Unify Financial and Economic Work"
CPC_rebuild_1_right_2_desc: "The divide-and-rule strategy adopted by Japanese imperialism in China has been endlessly harmful; the various economic industries in the newly liberated areas are not only deformed in development but also suffer from incompatible currencies. We must unify financial and economic work nationwide; we cannot have one system in the northwest and another in the northeast, as this not only raises governance costs but also seriously hinders exchanges between the peoples of different regions."
CPC_rebuild_1_right_2_left_1: "Establish State-Owned Enterprises"
CPC_rebuild_1_right_2_left_1_desc: "As early as the base-area period, our Party had already established companies with the nature of state-owned enterprises, but due to the circumstances they did not have nationwide influence. Now that the whole country has been liberated, our state-owned enterprises must establish their economic position nationwide. As for the confiscated Japanese and puppet enterprises and bureaucratic capital, they will all be nationalized and become part of the state-owned enterprises."
CPC_rebuild_1_right_2_left_2: "Appease the National Bourgeoisie"
CPC_rebuild_1_right_2_left_2_desc: "Post-liberation China cannot afford further upheaval. The national bourgeoisie spent the period of Japanese and puppet occupation like walking corpses, and they now need to resume production. But under Japanese and puppet propaganda, these eastern national capitalists do not trust us as highly as their western counterparts do. We need to appease them and show them the side of the Communist Party that differs from the Japanese and puppets."
CPC_rebuild_1_right_2_left_3: "Redeem Assets"
CPC_rebuild_1_right_2_left_3_desc: "Ultimately, the Communist Party of China (CPC) is, after all, a Marxist-Leninist party. As for this private capital, the state still needs to transform it into enterprises of a socialist nature. However, we need not treat them as we would enemies we have defeated; instead, through peaceful redemption, we will purchase ownership from them."
CPC_rebuild_1_right_2_right_1: "Crack Down on Speculative Capital"
CPC_rebuild_1_right_2_right_1_desc: "No era lacks people who profit from national calamities. Many lawless capitalists use illegal means to hoard goods, causing resource shortages and thus market turmoil, reaping huge profits. Against such speculative capital that seriously disrupts the market, we need to strike effectively and forcefully."
CPC_rebuild_1_right_2_right_2: "Allow Mass Movements Free Rein"
CPC_rebuild_1_right_2_right_2_desc: "Capital has accumulated stained with the blood of the proletariat. After liberation, we must continue to promote mass movements and call on the workers in the east to safeguard their legitimate rights and interests. We must fully cultivate the workers' sense of ownership and reclaim from the capitalists the rights that belong to the workers."
CPC_rebuild_1_right_2_right_3: "Planned Management"
CPC_rebuild_1_right_2_right_3_desc: "Market allocation of resources is driven by profit; it naturally cultivates profit-seeking thinking in people. As a country about to embark on the road to socialism, we should blaze a new path in distribution and management; the planned economy system of the former Soviet Union is a good choice, and we should promote a similar planned management system nationwide."
CPC_rebuild_1_right_3: "Launch Urban Suppression of Counterrevolutionaries"
CPC_rebuild_1_right_3_desc: "The liberation war swept the country like a prairie fire, and the rapid pace of the war allowed large numbers of reactionaries to hide in the newly liberated cities. If these reactionaries are not dealt with, they are very likely to coordinate with foreign reactionary forces to attack us. Therefore, we must strike first and launch operations in the cities to suppress reactionaries."
CPC_rebuild_1_right_3_left_1: "Screen and Arrest War Criminals"
CPC_rebuild_1_right_3_left_1_desc: "The crimes of the Japanese and puppet war criminals are too numerous to write down. To escape the people's judgment, they hide among the crowds. Therefore, we must do a good job of investigation and statistics; we must not wrong the innocent, nor let a single guilty person go."
CPC_rebuild_1_right_3_left_2: "Maintain Moderate Suppression"
CPC_rebuild_1_right_3_left_2_desc: "Based on years of governing experience, the Party Central Committee, considering that the suppression campaign could be exploited, did not launch a violent campaign. Facts have proven this correct; many cities reported miscarriages of justice, but precisely because the Party Central Committee strictly controlled the intensity of suppression, the hidden reactionaries were unable to incite the masses to further attack the Party Central Committee. We should continue to maintain this status quo."
CPC_rebuild_1_right_3_right_1: "Register Reactionary Parties and Groups"
CPC_rebuild_1_right_3_right_1_desc: "The reactionary forces in the east have formed various groups, which has hindered our law enforcement; different groups should receive different punishments. Therefore, we must investigate and register these reactionary parties and groups one by one, which will help us continue to dig deeper into the organizations behind them."
CPC_rebuild_1_right_3_right_2: "Intensify Suppression"
CPC_rebuild_1_right_3_right_2_desc: "Based on years of governing experience, the Party Central Committee knows that overcorrection is sometimes necessary, and overly lenient policies actually give reactionaries a chance to escape the net of the law. However, the miscarriages of justice reported by many cities must still be handled with caution; while intensifying our efforts, we must not give reactionaries an opening to attack the Party Central Committee."
CPC_rebuild_1_right_4: "Sound the Retreat"
CPC_rebuild_1_right_4_desc: "The suppression of reactionaries was only a temporary measure; as large numbers of reactionaries received appropriate punishments, the situation in the cities has stabilized. It is time to sound the retreat and begin large-scale construction."
CPC_rebuild_1_right_4_tt: "In the eastern region, §Ymass support§! §Ghas increased§!"
CPC_rebuild_1_medium_8: "Purify the Realm"
CPC_rebuild_1_medium_8_desc: "More than a year of reconstruction has been fruitful. The eastern region has taken on an entirely new look; we have gained a firm foothold, transformed the eastern economy, suppressed the reactionary forces, and reintegrated the people of all regions, all achieved under the leadership of the Communist Party of China (CPC). Now, looking across the whole of China, the smoke of battle has dissipated, but the hearths of ten thousand homes send up curling smoke; the liberated people are celebrating their own emancipation and congratulating themselves and their future!"
CPC_rebuild_2: "National Reconstruction - Phase Two"
CPC_rebuild_2_medium_1: "Socialist Transformation of the Newly Liberated Areas"
CPC_rebuild_2_medium_1_desc: "After the great war, the people's hearts are at ease. As our rule in the eastern region gradually stabilizes, it is time to transform the economic base of the east and put it on the road to socialism. Therefore, we should set about carrying out the socialist transformation of the newly liberated areas."
CPC_rebuild_2_medium_1_tt: "§nNational conditions§! will undergo favorable changes"
CPC_rebuild_2_left_1: "Agricultural Collectivization"
CPC_rebuild_2_left_1_desc: "Originally, for the sake of reconstruction and recovery, the Party allowed the eastern economy to temporarily forgo collectivization. Now, as the productive forces in the east recover, the existing relations of production are no longer suitable. Therefore, we should actively promote the collectivization policies of the western region and launch collectivization in the east."
CPC_rebuild_2_medium_2: "Establish Collective Cooperatives"
CPC_rebuild_2_medium_2_desc: "As early as the National Defense Front period, we explored socialist forms in the cities of Xi'an, Chengdu, and Chongqing; in handicrafts, the collective cooperative system was an important achievement of ours. Now that our country controls all the major cities, we should set about establishing collective cooperatives in these cities to carry out socialist transformation."
CPC_rebuild_2_right_1: "Establish Trade Union Organizations"
CPC_rebuild_2_right_1_desc: "Since the Party's birth, the trade union system emerged to effectively safeguard the interests of urban workers. During the National Defense Front period, under the Party's leadership, trade unions were established in all major cities. As collective organizations of workers participating in production management, trade unions became an important component of the socialist system. Today, we should also promote this system in the eastern region, letting trade unions everywhere participate deeply in management and construction."
CPC_rebuild_2_medium_3: "Prepare for the National People's Congress"
CPC_rebuild_2_medium_3_desc: "As the socialist transformation of the newly liberated areas in the east proceeds rapidly, the Party Central Committee judges that the time is nearly ripe to convene the National People's Congress. Moreover, the Central People's Administrative Committee is in fact no longer sufficiently representative; as an interim body, its duties have come to an end. Therefore, our country should immediately form a preparatory committee for this congress of decisive significance to China."
CPC_rebuild_2_medium_3_tt: "The focus of §xParty affairs§! will change"
CPC_rebuild_2_left_2: "Census"
CPC_rebuild_2_left_2_desc: "In people's democracy, the main body is the people. To ensure that the people's congress is representative, we need a delegation that adequately represents the people, and the size of this delegation is of paramount importance. Therefore, we need to know exactly how many people our country has, so that we can determine which levels can hold direct elections and which cannot, and thereby determine how many people we need to represent our people in managing national affairs."
CPC_rebuild_2_left_3: "Register Voters"
CPC_rebuild_2_left_3_desc: "In people's democracy, what matters is democracy. To let the people participate in the democratic process, we must give them an identity with which to take part - that of voter. The state must always know how many people participate in elections and how many have their proposals legitimately raised in the democratic process. Therefore, we must register voters and let the true people manage this newborn country."
CPC_rebuild_2_right_2: "Form Work Groups"
CPC_rebuild_2_right_2_desc: "The preparatory work is very heavy - selecting venues, formulating election rules... all this requires our wholehearted commitment. Therefore, we need to form specialized work groups responsible for a whole series of tasks, including organizing elections at the local level."
CPC_rebuild_2_right_3: "Draft the List"
CPC_rebuild_2_right_3_desc: "Only a government sufficiently recognized by the people is a democratic government, and only a delegation sufficiently recognized by the people is a democratic delegation. Given the heavy workload and tight time, we need to draft a list that the people can approve, so that they can make their decisions with ease."
CPC_rebuild_2_medium_4: "Clarify Election Principles"
CPC_rebuild_2_medium_4_desc: "Elections need clear and explicit rules so that the people willingly exercise their rights. We must clarify our election principles: voluntary participation, electoral nomination, anonymous vote counting, and majority rule, fully embodying the will of the people."
CPC_rebuild_2_medium_5: "Strict Discipline"
CPC_rebuild_2_medium_5_desc: "Just as the Party ensures cohesion and combat effectiveness through organizational discipline, our elections must also enforce strict discipline. Elections must be fair, just, and open, allowing the people to retain their own opinions; there must be no favoritism, backdoor dealing, coercion, misbehavior, or suppression of dissent."
CPC_rebuild_2_medium_6: "Hold Local Elections"
CPC_rebuild_2_medium_6_desc: "The principle of the congress is to fully embody the will of the people, which must be expressed through elections at every level. Therefore, before holding the national congress, we must first hold local elections, so that we can confidently say that our congress is nationally representative."
CPC_election_prepared: "We have prepared elections in all regions"
CPC_rebuild_2_medium_7: "First National People's Congress"
CPC_rebuild_2_medium_7_desc: "Comrades, the long-awaited National People's Congress has arrived, and we have at last realized the Chinese nation's century-old aspiration for democracy. This congress will fully embody the will of the whole nation; this congress will be a brand-new starting point. The people will fully express their will, manage their own country, and enjoy their own rights, and this country will become ever better!"
CPC_rebuild_2_medium_7_trigger: "We are ready to decide China's §xfate§!"
CPC_rebuild_2_medium_7_tt: "Set off, and grasp your destiny"
#Party affairs reconstruction
TER_info_help: "[TER_info_help]"
TER_rebuild_help: "After the nationwide liberation, the CPC Central Committee assessed the situation and established six major regions across the country, with the central authority directly administering the capital and certain areas, in order to oversee the reconstruction work. You can adjust each §Rregional bureau§!'s §Yfocus§! to advance reconstruction. Please note that the recovery speed is affected by the party member demand of each regional bureau,"
TER_congress_help: "As the national economy rapidly recovers, the Party Central Committee has set the policy of preparing for the National People's Congress. Now please click the button to have all bureaus begin preparing local elections. Please note that local elections can only be held once all major regions have completed their preparations."
