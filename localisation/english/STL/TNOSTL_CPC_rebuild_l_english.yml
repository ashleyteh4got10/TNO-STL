STL_CPC_remove_colonial_culture: "Dismantle the Remnants of 'Concord' Cultural Colonialism"
STL_CPC_remove_colonial_culture_desc: "Japan's design to destroy China has not died. To justify the invasion of China by this pack of beasts, Japan promoted the so-called 'Concord' culture in the Northeast and Mongolia; later, to split Guangdong, it promoted the so-called 'Pearl People' concept there, incorporating the 'Pearl People' into the 'Concord' culture. For the diverse yet unified Chinese culture, this is intolerable; therefore, we must destroy the so-called 'Concord' culture and uproot this malignant tumor."
STL_CPC_anti_colonial_over_trigger: "We have completely eliminated the colonial culture in the Northeast and Guangdong and integrated the local areas"
STL_CPC_anti_colonial_over: "End the 'Concord' Culture"
