 #Story
 NEB_main_story_events.1.t: "Telegram from the Northeast Party Committee Requesting Instructions"
 NEB_main_story_events.1.d: "Respected Party Central Committee:\n\nRegarding the westward withdrawal [NAJUA_situation], acting on the Party Central Committee's instructions we have moved our headquarters to the city of Choibalsan and await further instructions from the Party Central Committee. We hope to hear from you soon.\n\nNortheast Party Committee"
 NEB_main_story_events.1.o: "[?global.date.GetDateStringNoHourLong]"
 NEB_main_story_events.2.t: "Urgent Telegram from the Center"
 NEB_main_story_events.2.d: "Telegram in reply to Liu, and to be passed to the Northeast Party Committee:\n\nAfter discussion and study, the Party Central Committee has decided that, to meet the needs of the present great liberation struggle, a Northeast Bureau of the CPC Central Committee must be established at once to represent the Party Central Committee in providing unified leadership for work in the Northeast. The Northeast Anti-Japanese United Army should be reorganized and incorporated into the People's Liberation Army (PLA).\n\nCentral Committee of the Communist Party of China (CPC)\n\n[?global.date.GetDateStringNoHour]"
 NEB_main_story_events.2.o: "A Brand-New Situation for the Liberation of the Northeast!"
 NEB_main_story_events.3.t: "Establishment of the Northeast Bureau"
 NEB_main_story_events.3.d: "Gao Gang had first heard of the Northeast Anti-Japanese United Army more than twenty years before. Ever since the dissolution of the Soviet Union and the Nanjing-Chongqing merger, contact between the Party Central Committee and the Northeast had come close to being severed. They had assumed the comrades had long since been martyred, and never expected that they had actually held on - news that was surely good.\n\nOn the rostrum, Gao Gang looked out at the comrades below: some were disheveled, others in perfect order - a contrast that marked these two groups, the original comrades of the Northeast and the comrades sent from the northwest to support them.\n\n'Comrades, today is a great day. Here we will open a brand-new beginning for the anti-Japanese struggle in the Northeast!' Gao Gang's speech from the rostrum was clear and resonant. Li Zhaolin, sitting to his right, watched this high-spirited First Secretary with mingled feelings. He had never met Gao Gang; indeed, this could be called their first meeting. Yet he trusted the Party Central Committee, and trusted that the Party had sent a capable and vigorous man. Thinking thus, Li Zhaolin, though still uneasy, relaxed a good deal.\n\n'I was sent by the Party Central Committee. The Northeast's comrades have never met me, so you must have your doubts. I assure you all that I will lead this team well, and I hope you will offer plenty of criticism and correction!' Gao Gang pressed on with his stirring words. Beside Li Zhaolin, Zhou Baozhong's heart was heavy. He could not understand why the Party Central Committee had not made Li Zhaolin First Secretary, but had instead dropped in someone unfamiliar with conditions in the Northeast. Could he truly lead the Northeast's comrades? Did he truly know the Northeast? His mounting doubts kept him from trusting this ambitious fellow.\n\n'Comrades, the Party Central Committee regards the Northeast as our future strategic direction, an important part of China's future war of liberation. We must close ranks under the leadership of the Party Central Committee.' Gao Gang's speech was nearing its end. Liu Yalou, seated at Gao Gang's left, was in fine spirits. Renewing contact with the Party Central Committee made him very happy. In his time in Xi'an he had been fully aware of how much the Party Central Committee prized the Northeast, treating it as one of its strategic directions. He had therefore approached Gao Gang early; although Gao Gang's past was hardly glorious, Liu Yalou had chosen to trust him.\n\n'The liberation struggle of the Northeast has lasted the longest, been fought in the harshest conditions, and developed with the greatest difficulty of any since the war of resistance began. The Northeast's comrades have endured much hardship, but that hardship was worth it. Today we gather here for our parents and neighbors, to free the whole Northeast from the Japanese conquerors' colonial rule, for the liberation of the entire Northeast. Our task is to liberate the Northeast, to liberate China, to liberate the whole world!' Amid applause Gao Gang's impassioned speech drew to a close. But even as the applause rang out, those below could not conceal their doubts.\n\n"
 NEB_main_story_events.3.o: "All the work has only just begun."
 NEB_main_story_events.3.tt: "Please view the GUI of £CPC_texticon §xNortheast Bureau§! and begin the first-stage missions of the Northeast's liberation."
 NEB_main_story_events.4.t: "In Choibalsan"
 NEB_main_story_events.4.d: "Choibalsan is a small town of only three thousand souls. Five hundred meters from the town stands a small compound. Within it, plank shacks stand in rows; outside, weeds grow rank, and a newly repaired grave mound rises here.\n\nThe townspeople often see outsiders in green clothes and caps with five-pointed stars passing through. They know only that these people belong to the PLA; what they are doing here, nobody knows. And in that compound, a kerosene lamp often burns all night.\n\nThe townspeople know there are people in that compound, but that is not the point. The point is the grave mound, in which a thousand wronged souls are buried. At some point a small epidemic began to spread through the village; the residents realized it came from the rotting corpses, so they reburied the bodies and raised a small gravestone, hoping those below could rest in peace. What astonished the townspeople was that anyone dared to live beside that grave!\n\nWhat the townspeople did not know was that the compound was the Northeast Bureau's headquarters and the grave was evidence of past crimes.\n\nIn this once-abandoned compound the crooked fence was a home for woodworms, and a strange roof turned a square space into a triangle. In the mud wall, a few stalks of straw drooped like disabled old men, weathered by wind and years, still stubbornly alive. Gao Gang and Li Zhaolin led the Northeast Bureau's comrades in spending a month cleaning the place up and investigating the grave thoroughly. What they discovered was staggering: the compound had once been a liaison office of a Japanese army unit based in Harbin, and beneath the grave lay the bones of local monks and Mongols slaughtered en masse by the Japanese, along with victims of germ-warfare experiments. As to what those experiments involved, those who knew the inside story felt their blood run cold."
 NEB_main_story_events.4.o: "Because that has nothing to do with humanity."
 NEB_main_story_events.5.t: "A New Life for the United Army"
 NEB_main_story_events.5.d: "'Attention! Fourth man in the second row, lift your foot higher!' The PLA officer's voice rang through the air. 'On my command, goose step - march!' 'One, two, three, four!' This was a camp not far from Choibalsan, where Zhou Baozhong and Zeng Kelin were inspecting training. Since the United Army returned to the Party Central Committee, the Northeast Party Committee had been reorganized into the Northeast Bureau, and the United Army's officers and men had been incorporated into the PLA. The Northeast Anti-Japanese United Army Training Brigade belonged to history now; their new designation was the 38th Army of the People's Liberation Army, with three divisions of twelve thousand men apiece. Once the United Army joined the PLA, the Central Military Commission promptly ordered PLA officers to be sent to it and adjusted the formation: Zhou Baozhong was made army commander, Zeng Kelin head of the political department. Thus began the United Army's standardized training.\n\nThere had been a time when the United Army fought the invaders among the white mountains and black waters. A long blockade made it hard for the soldiers to eat their fill, and constant campaigning left them almost no time to rest, deepening their fatigue. On top of that, the Northeast's temperatures were low, staying below zero for long stretches, so many officers and men suffered frostbite or froze to death. Then the collapse of the Soviet Union took from the United Army its last safe refuge; the Soviet people lost their homes and their belonging. Unwilling to follow the fascists of the north, the Red Army joined the United Army. Yet several great mopping-up campaigns that followed drove the United Army into a desperate corner. Since the September 18th Incident of 1931, the Northeast Anti-Japanese United Army had held on in this vast land for nearly forty years.\n\nToday was different. The United Army had climbed out of the mire and returned beneath that vivid red flag. This was the start of their new life, and the start of a wholly new phase in the liberation of the Northeast."
 NEB_main_story_events.5.o: "An Entirely New Situation"
 NEB_main_story_events.6.t: "'Diaoyucheng'"
 NEB_main_story_events.6.d: "At the PLA command post, when Li Zhaolin laid the map of the Hailar fortress before Gao Gang, Gao Gang drew a sharp breath, for a fortress on this scale rivaled those built around Xi'an.\n\n'Five high points around Hailar have all been fortified by the Japanese: Henantai, Aobaoshan, Songshan, Yidongtai, and Dongyingtai. The Henantai and Aobaoshan positions sit on either side of the highway; Henantai and Songshan flank the railway. The Japanese supply base lies near the Yidongtai position in the east, while Dongyingtai guards the southeast of Hailar city. On the hills are the mass pits where the Japanese buried Chinese alive years ago, and the five positions are linked by underground tunnels.' Li Zhaolin explained as he sketched. Zhou Baozhong said, his face grave: 'This place will be hard to take. A frontal assault would cost us dearly.' Liu Yalou added earnestly: 'With installations so complete, it would be best to take it over intact.' Gao Gang, eyeing the map on the wall, said: 'This is simply a copy of Sichuan's Diaoyucheng set down in the Northeast. The only difference, I suppose, is that Diaoyucheng was used to defend the homeland.'\n\nThis fortress, cast from the people's blood, must return to the people's hands and be dealt with by the people; and those who forced the Chinese people to build it must stand before the people's judgment.\n\nGao Gang and Li Zhaolin were filled with conflicting emotions. How could they bring this fortress back to the people? To attack it would be easy to hold and hard to storm, but this was a difficulty they had to overcome.\n\nFor the people, once they learned the truth, would not hesitate to order their own troops to slaughter that pack of beasts."
 NEB_main_story_events.6.o: "The People's Judgment Is Bound to Come"
 NEB_main_story_events.7.t: "Shut the Door and Beat the Dog"
 NEB_main_story_events.7.d: "The Greater Khingan is a natural barrier along the western edge of the Northeast Plain. Its mountains may not equal the Kunlun in grandeur, but the richness of its forests is rare anywhere on earth. Since 1900 Tsarist Russia built railways and towns here, cutting roads through hills and bridging rivers, until at last it opened a way clear across the ranges.\n\nThe mark of that opening was the 'Khingan Tunnel.' At 3,077.2 meters in length, this tunnel is the sole passage between the eastern and western Greater Khingan, and the main artery of the North Manchuria Railway runs through it. Li Zhaolin knew the place well: he had fought here as a guerrilla, blown up trains, seized supplies, and liberated the people. It was the Japanese garrison's only supply line west of the Greater Khingan; cut the tunnel, and the Japanese holed up there would be turtles in a jar.\n\n'Ring, ring -'\n\nLi Zhaolin picked up the receiver and put it to his ear. A young, bright voice came over the line: 'Secretary Li, word just came from Buketu - they've finished the job.'\n\n'Good. Tell them to keep it up.' Having hung up, Li Zhaolin wore a relieved smile: control Buketu, and they controlled this tunnel. He took out paper and pen. He meant to sketch out a grander plan - shut the door and beat the dog. He would see to it that the Japanese devils in the Greater Khingan came and never returned, and that not one escaped."
 NEB_main_story_events.7.o: "This Blood Debt Ought to Be Settled"
 NEB_main_story_events.8.t: "A Move Born of Necessity"
 NEB_main_story_events.8.d: "Few people knew the Northeast Bureau's First Secretary. That was no great matter, in fact, for the Northeast's comrades had no notion of what had happened during those dozen-odd years. Gao Gang's arrival at the Northeast Bureau was itself the outcome of a compromise.\n\nWhen the Party Central Committee discussed sending a support team to the Northeast, the meeting chaired by Mao Zedong got off to a promising start and the team's membership was quickly settled. But on the question of 'who should be named team leader,' Mao Zedong and Liu Shaoqi thought differently. The two then went into fuller discussion - perhaps because both believed it was only a matter of picking a man, or perhaps because sectarianism was raising its head again. In any event, at one meeting the participants broke into a bitter quarrel. Though neither Mao Zedong nor Liu Shaoqi had wanted this, it happened and grew worse. In the end, had Zhou Enlai and Zhu De not intervened, the quarrel would likely have escalated further. Mao Zedong scoffed at the idea, widespread among many, of 'installing one's own cronies,' yet he had to admit that, for him and Liu Shaoqi, whoever was chosen to lead would be seen by some as one faction staking a claim in the Northeast.\n\nJust when Mao Zedong was at a loss, a chance remark from Liu Shaoqi woke him: 'It would be simple if we picked some washed-up nobody that no one cares about.' So when Gao Gang's name came up at the meeting, everyone fell silent. The reason was simply too good to be faulted. First, Gao Gang had long been stationed in Mongolia; though not especially familiar with the Northeast, he had always worked in the territory nearest to it. Second, he had once been a figure of great influence within the Party Central Committee; though he had left, he still had that backing. Third, he was a man 'with a stain on him,' so no one would suppose that the so-called 'Mao faction' would enlarge its influence in the Northeast.\n\nAnd so the leader of the Northeast support team was settled - and that leader would beyond doubt become the Northeast Bureau's First Secretary. The fallen Gao Gang cared no longer whether he could stage a comeback, but this chance he had to seize for certain."
 NEB_main_story_events.8.o: "Winning back even a little face is something."
 NEB_main_story_events.9.t: "Replanning"
 NEB_main_story_events.9.d: "Once the base areas were secure, Northeast Bureau branches were set up from Manzhouli all the way to Zhalantun. Thanks to intelligence obtained inside the fortress by the Hailar branch, the Northeast Bureau not only gained the full picture of the fortress but also established base areas throughout Hulunbuir. At one word from the Party, Hulunbuir would rise in revolt and rejoin the people's ranks. In these circumstances the Northeast Bureau held meeting after meeting to weigh the coming campaign. In the end, the Chinese Eastern Railway Plan advanced by Liu Yalou and the Outer Northeast Restoration Plan advanced by Choi Yong-jian were laid on the First Secretary's desk.\n\nAfter hearing reports from Liu Yalou and Fang Hushan (Choi Yong-jian being advanced in years), Gao Gang and Li Zhaolin sank into deep thought. Both the Northeast and the Outer Northeast had their merits. Backing the Northeast would aid the coming liberation, but without a solid base among the people it would demand more resources, and the Outer Northeast would struggle for attention. Backing the Outer Northeast would restore the United Army's original strength, with a better popular base, and neither Japan nor Manchukuo set much store by the place; but it would not help the future liberation of the Northeast, which would meet with stiff resistance.\n\nA hard choice - how to decide? After several fruitless discussions, Gao Gang and Li Zhaolin finally agreed to refer the matter to the Party Central Committee. And the Party Central Committee's decision was -"
 NEB_main_story_events.9.o1: "Execute the Chinese Eastern Railway Plan"
 NEB_main_story_events.9.o2: "Execute the Outer Northeast Restoration Plan"
 NEB_main_story_events.9.tt: "Please view the GUI of £CPC_texticon §xNortheast Bureau§! and begin the second-stage missions of the Northeast's liberation."
 NEB_main_story_events.10.t: "The Pearl of the Northeast"
 NEB_main_story_events.10.d: "The muddy river raced eastward; one train thundered through the place where Ito Hirobumi met his death, while another, billowing black smoke, drew in beside the platform.\n\nSasaki stepped down and took a good look at the city where he was to live. The station still kept its Russian style. They had intended, it was said, to remodel it in Japanese style, but Japanese architecture differed so greatly from Russian that remodeling would have meant rebuilding; so the Japanese gave up and merely did some repairs. Sasaki walked into the square before the station: streams of traffic, hawkers' cries on every side, a scene of bustle. He felt a surge of excitement - it had been worth coming a thousand li from home to this thriving city.\n\nWith a job found, Sasaki was happy each day. His duty was to clear beggars, gangsters, and vagrants from the streets and alleys - impossible in a city like Harbin, so it was a sinecure. Sipping coffee and black tea in the café was his daily refinement; dancing under the neon lights with a pretty woman his evening delight; a fine film at the theater, red sausage, kvass - and the day was done. Sasaki reflected that life in his big villa in Tokyo had been much the same.\n\nLost in pleasure, Sasaki watched the Chinese woman washing his feet; her supple figure stirred his lust, and heedless of the Russian girl shampooing his hair and the Korean maiden drying his body, he swept her into his arms. The girl, terrified, instinctively cried out, but the maiden quickly covered her mouth and eyes, murmuring in Korean, 'Don't look, don't look'...\n\nHaving had his fill, Sasaki rolled onto the bed, paying no mind to the weeping Chinese woman, for his thoughts were already on the morrow."
 NEB_main_story_events.10.o: "'Truly the pearl of the Northeast.'"
 NEB_main_story_events.11.t: "The Fulcrum"
 NEB_main_story_events.11.d: "The Northeast had always been a cold region, but after years of development it was no longer so cold and had built up a vast industrial park, the Manchurian industry around Shenyang and Changchun thriving.\n\nYet the raw materials feeding that industry came from the Republic of China. To move them, Japan poured huge sums into running and protecting the transport routes, with Jinzhou at the center. Jinzhou had always been the southern gate of the Northeast; every shipment had to pass through it. Liu Yalou saw this clearly and proposed 'breaking through Jinzhou first.' Building on that, the Party Central Committee put before the Northeast Bureau the grand strategy of seizing Jinzhou, Shenyang, and Dalian and then advancing north to Vladivostok: the People's Liberation Army would burst through Jinzhou with dizzying speed, then take the strategic points of western and eastern Liaoning, cutting the Northeast's enemies off from Japan.\n\nUsing intelligence and the like to draw the enemy toward the frontier was not hard; the hard part was whether the PLA could seize those strategic points in a very short time. And of those points, Japan would surely fortify Jinzhou above all. So the rapid rupture of Jinzhou was the key of keys.\n\nThe Northeast Bureau therefore decided to drive a wedge there ahead of time, to throttle the enemy completely in the days to come. With the small fulcrum of Jinzhou, we will pry up the great iron ball of the Northeast!"
 NEB_main_story_events.11.o: "Taking Precautions"
 NEB_main_story_events.12.t: "The Long Spring"
 NEB_main_story_events.12.d: "Although the Northeast Bureau had fixed on a strategy centered on the Northeast, the Outer Northeast was equally vital. After discussion the Bureau decided to send Fang Hushan back there to continue the work.\n\nFang Hushan hurried back to Hailanpao and threw himself into his tasks without a moment's rest.\n\nHe investigated conditions in the Outer Northeast anew. They were still bad, but at least they were no longer isolated. He set about restoring the Party organizations and base areas there. First, he took stock of the surviving Party members; some former Soviet Communist Party members also joined the Communist Party of China (CPC). Contact with the comrades in Korea was re-established, and on the Northeast Bureau's instructions Fang Hushan helped them organize the Communist Party of Korea. Second, he restored the base areas. The Bureau's operations in the Northeast had successfully drawn the attention of Japan and Manchukuo, and Fang Hushan used the opening to recover part of the Outer Northeast; with too little support from the Bureau, only the Nikolayevsk base was restored, the others still struggling back to life. Finally, he reorganized the Outer Northeast's guerrilla bands: modest in size, they were nevertheless more than enough to occupy Japanese forces.\n\nLi Zhaolin was overjoyed at Fang Hushan's report and took up his pen to write a verse of praise: 'Thirty years by the white mountains and black waters, apparently a rotten stump, yet truly raising fine timber; a thousand li of crisscrossing hills - the tiger's roar chills the foe to the heart.'\n\nThe long night was over, and the frozen soil greeted a belated spring. Fang Hushan was deeply moved by the reply: winter had truly ended at last, and he sincerely wished this spring would last a little longer."
 NEB_main_story_events.12.o: "Let us feel the gentle spring breeze."
 NEB_main_story_events.13.t: "The Troika"
 NEB_main_story_events.13.d: "China, the Soviet Union, and Korea were the three nations to suffer most from Japanese invasion. The Northeast lay precisely where the three met, and so the Northeast Anti-Japanese United Army was composed mostly of their peoples. Whether in the Northeast Anti-Japanese United Government founded earlier, or in the People's Liberation Army reorganized after the Northeast Bureau's establishment, men of China, the Soviet Union, and Korea remained the majority. This obliged the Party Central Committee to handle relations among the three with care, striving to rally all three peoples under the banner of Chinese resistance. In a sense, the Chinese, Soviet, and Korean peoples were the troika of the United Army.\n\nKorea was the first nation to be annexed by Japan. Since the annexation of 1910 its independence movement had surged without cease; the national hero Ahn Jung-geun's assassination of Ito Hirobumi was a declaration that the Korean people would never bow to slavery. The Soviet Union was a country dealt a grave blow by Japan. Though it inherited the lands of Tsarist Russia, the common people upon them were guiltless; with the Soviet dissolution Japan fell on them like a robber. The broad Soviet masses, having won liberation, were subjected to a new oppression. China was the country worst afflicted by Japanese invasion. The Nanjing massacre, the crippled and fractured state of the motherland - all were Japan's doing. The Communist Party of China (CPC) raised high the banner of resistance and vowed to drive Japanese imperialism off the soil of China.\n\nThe peoples of China, the Soviet Union, and Korea share a single heartfelt wish, and it is this -"
 NEB_main_story_events.13.o: "Let Japan have no place to be buried!"
 NEB_main_story_events.14.t: "An Empty Shell"
 NEB_main_story_events.14.d: "Mayor Tokugawa glanced over this year's accounts and was startled to find they had hit a new high. He was pleased, but also uneasy - what if he were posted to Tokyo? Yet this was needless worrying, for there was no call for it: the people in Tokyo did not care about Vladivostok in the least.\n\nTokugawa had another reason for not wanting to go to Tokyo. Since he took office, familiar faces had vanished one by one - each promoted faster than the last. Ordinarily that would be nothing, but for some reason the newly appointed officials were all from outside the Japanese home islands. Tokugawa had little head for politics, but his powers of observation were sound. He made discreet inquiries into their backgrounds: all had come from Manchukuo, yet no reliable registration records could be found, and they were so diligent and conscientious that they were utterly unlike Japanese officials. Troubled, he tried to lull himself with the thought that they had merely brought in a batch of able men, but illusion is an illusion and self-numbing solves nothing. By the time he looked around again, everyone near him was of that stamp.\n\nTokugawa believed in no bushido; a scion of the former shogunate, he had long since ceased to care about politics. Yet the present situation was truly awkward: he had come to Vladivostok to escape one political storm, only to be caught in another that might be gathering. In no mood to take joy in his results, he picked up a book from his desk - The Communist Manifesto."
 NEB_main_story_events.14.o: "I hope my future turns out a little better."
 NEB_main_story_events.15.t: "Run!"
 NEB_main_story_events.15.d: "Sato was an ordinary first-class soldier at the Japanese headquarters in Manchukuo. From the day he was transferred there, he had seen nothing but oddities.\n\nHis immediate superior kept ordering him to storm into every sort of private dwelling, yet whichever house it was, it was empty. So the words Sato heard most were 'sorry,' 'idiot,' and 'we'll catch the red bandits this time for sure.' From his fellows he learned that 'banditry' in Manchukuo was growing ever worse, while the Northeast Anti-Japanese United Army, which had once led the Kwantung Army a merry chase, had vanished without a trace. Oddly enough, the hour the United Army vanished was precisely the hour 'banditry ran riot' began. Harbin and Fengtian were in an uproar; rumors passed from mouth to mouth that the United Army had returned and Japan would be defeated in Manchuria. Sato was badly frightened.\n\nOne day he was sent beyond the city on patrol: an earlier patrol had disappeared, and Sato's squad was taking its place. Outside the gates he walked and looked about, unable to fathom why a squad should vanish in so quiet a place. At the end of the route he found nothing amiss. Empty-handed, he followed his officer back, still wondering why he had been well enough at headquarters for the officer to send his squad out patrolling. Unable to work it out, he resolved to think no more of it. Back in the city he complained to a comrade about the patrol. When he had finished, the comrade asked one question: 'Then where did that squad go?' Sato answered irritably over his drink: 'Beats me.' His comrade went on: 'But don't you think it strange? If they'd been ambushed, there'd have been traces all along the way.'\n\nThat brought Sato's cup down. Yes - why had they found no trace of the missing squad anywhere along the road?"
 NEB_main_story_events.15.o: "'I absolutely cannot stay here a moment longer!'"
 NEB_main_story_events.16.t: "Retire After Success?"
 NEB_main_story_events.16.d: "Working at the Northeast Bureau gave Gao Gang back some of the pleasure of work he had not felt in years. Perhaps a posting like this could serve as a springboard back to the Center? He could not help wondering.\n\nWith his first year nearly done, Gao Gang judged the time ripe. There was no point grinding away in this godforsaken place; Gao Gang belonged on some high ridge, bringing good to all below. So he filed a report with his superiors, setting out conditions in the Northeast in detail and expressing his wish to go on working at the Bureau.\n\nSome may find such conduct hard to fathom, but history offers many examples: three refusals and three requests, keeping one's talents in reserve... Gao Gang saw nothing to lose, for whether the Party Central Committee agreed or refused, the worst would be returning to Mongolia, staying in the Northeast, being sent to the frontier, or being recalled to an idle post. Precisely because he was 'blemished,' he did not fear harsh treatment from the Center.\n\nLi Zhaolin, who had worked beside Gao Gang for nearly a year, had known of his ambition from early on. Those around them had remarked that Gao Gang was somewhat too proud of his talents, but since he was genuinely able, they put up with it. Li Zhaolin reckoned the Center would certainly move him away, but not so quickly: a 'blemished' man was better kept at a distance from the Party Central Committee.\n\nBefore long, the Center's reply arrived."
 NEB_main_story_events.16.o: "'The meeting has decided: Gao Gang returns to Xi'an.'"
 NEB_main_story_events.17.t: "Who Should It Be?"
 NEB_main_story_events.17.d: "With Gao Gang gone, Li Zhaolin was the natural choice for First Secretary. The Second Secretary's post, however, was disputed.\n\nSome comrades backed Zhou Baozhong, commander of the 38th Army, reasoning that he knew the PLA's command system and fighting ways better, so that with him at the head of troops the Northeast Bureau's unified military command would be strengthened. Others backed Liu Yalou, arguing that he was stronger in political work and that, as a Bureau cadre, he would better guide political mobilization, organizational work, and logistics in the Northeast.\n\nLi Zhaolin sounded out several more comrades. Comrade A said: 'I'm for Commander Zhou as Second Secretary, because he knows the army well. The Bureau needs more cooperation from the military just now; with him coordinating we'll get twice the result for half the effort.' Comrade B said: 'I personally favor Commander Zhou, but he has been in the army all his life. I'd rather we chose someone inside the Bureau, so as not to burden the commander.' Comrade C said: 'Then I'll back Deputy Secretary Liu. Secretary Liu is first-rate at political work, and most of us in the Bureau know him well.' Comrade D said: 'Either would do, as far as I'm concerned. But Secretary Li, you must watch your health. I hear Gao Gang's transfer had more behind it than appears.' Comrade E said: 'Anyone's fine by me. No objection, so long as they do the job well.'\n\nWith all these views collected, Li Zhaolin had his man in mind. At the election assembly he was elected First Secretary without a murmur, and the Second Secretary would be - who? The room held its breath as the teller counted the ballots, then cried out: 'Second Secretary goes to -'"
 NEB_main_story_events.17.o1: "'Zhou Baozhong!'"
 NEB_main_story_events.17.o2: "'Liu Yalou!'"
 NEB_main_story_events.18.t: "A Dream"
 NEB_main_story_events.18.d: "In Li Zhaolin's office stood a safe holding every telegram authorizing the founding of a Northeast Party Committee branch. One day he took the telegrams out to examine them, and at the end of the check he noticed something small but glad that he had long overlooked - twenty-eight telegrams in all, exactly the number of provinces occupied by Manchukuo. On his desk lay two more, authorizing the Dalian and Vladivostok branches, awaiting dispatch. Li Zhaolin felt water run down his cheek; he glanced at the ceiling, but it was not leaking. Puzzled, he touched his face, and found the water had come from the corner of his own eye.\n\n'Knock, knock, knock!' All at once came a knocking at the door. Li Zhaolin hurried to open it, and the instant he did, he stood frozen. Before him was a Henan man with a keen look in his eye, who asked with a smile: 'Hello - where am I?' Li Zhaolin clenched his fists, forcing down the feelings about to burst forth, and replied evenly: 'Hello, comrade. This is the Northeast Bureau.' 'The Northeast Bureau? Never heard of it.' 'Naturally - because the Northeast Anti-Japanese United Army has come back under the banner of the Party Central Committee.' 'The United Army... the United Army's come home?' 'Yes, it's come home!' 'Home... home...' The stranger's voice went from tense to easy, his face gradually relaxing. 'Home - home, that's good...' And with that he dissolved into smoke and dust. Li Zhaolin watched the strange sight in wonder, then stepped outside. The square before the building was still the one where the Northeast Bureau stood, yet three ranks of men now filled it, each rank holding a red flag. The flags read 'First Route Army of the Northeast Anti-Japanese United Army,' 'Second Route Army of the Northeast Anti-Japanese United Army,' and 'Third Route Army of the Northeast Anti-Japanese United Army.'\n\nFrom the distant sky came that well-known melody, and the soldiers in the ranks began to sing: 'We are the Northeast Anti-Japanese United Army, makers of its First Route Army. The crack of rifles, the cry of charging men, the surrender of the foe - that is the iron proof of revolutionary victory... Tieling's sheer cliffs, rank upon rank of forest, driving rain and gales, warhorses neighing by the wilderness water. Round the campfire we stand united, suffused with the red glow of heaven. Comrades! Sharp of purpose, though the Songhua's evening waves rise high. Arise! Charge boldly, drive out the Japanese invaders, recover the Northeast, till day breaks and ten thousand beams of glory pour forth...' Li Zhaolin broke into sobs and wept where he stood. 'Comrade, take this.' The stranger was suddenly at his side again, holding out that rifle. 'Use this gun to cut through the Northeast's long night!' Li Zhaolin took it, his mind going back to those days forty years before; he wiped away his tears and shouted: 'Everybody - charge!'\n\n'Comrade Zhaolin, Comrade Zhaolin.' Li Zhaolin's eyes flew open. [NEB_second_leader] was looking at him anxiously. [NEB_second_leader] chided him: 'Comrade Zhaolin, whatever are you doing sleeping on the floor? If you're tired you should rest properly. I must criticize you for this.' Li Zhaolin looked around: he was still in his office, and all he had seen seemed a vision. He smiled awkwardly. 'I accept the criticism.'"
 NEB_main_story_events.18.o: "Even a dream is worth it."
 NEB_main_story_events.18.tt: "Please view the GUI of £CPC_texticon §xNortheast Bureau§! and begin the third-stage missions of the Northeast's liberation. Since [NEB_second_leader] was elected Second Secretary, mission [NEB_num] of this stage is completed automatically."
 NEB_num_1: "One"
 NEB_num_2: "Two"
 NEB_main_story_events.19.t: "Building Bridges"
 NEB_main_story_events.19.d: "Zhou Baozhong brought Li Zhaolin and Liu Yalou to the 38th Army. The column's soldiers were mastering entirely new methods of warfare, drilling with rifles and guns; compared with the United Army of a year earlier they were mightily changed.\n\nThe three entered the meeting room, where the PLA cadres had been waiting a long while. Zhou Baozhong introduced everyone in turn, then they sat down. He chaired the meeting: 'Comrades, this gathering is to strengthen coordinated fighting between the Northeast Bureau's comrades and the PLA's. We have asked Comrade Li Zhaolin, First Secretary of the Northeast Bureau, to brief us on the Northeast. Let us welcome him.' After applause, Li Zhaolin briefly described the Bureau and the Northeast, and answered questions from the PLA comrades about terrain and cities.\n\nWhen it was over, the three went to the mess hall. Li Zhaolin teased: 'Old Zhou, you've grown thin! Comrades used to say you looked like a French loaf - now you look even more like one.'\n\n'Spare me your teasing, Old Li. Commanding an army is no small matter; if the Center hadn't been truly hard up, I'd never have gotten the job. Still, coordinating a whole army is harder than running a brigade used to be.' Liu Yalou put in: 'Old Zhou, I hear you've been issued some new contraption - something called... aeroplanes?' Zhou Baozhong roared with laughter: 'Aeroplanes, indeed! They're worn-out trainer planes shipped in from the Northeast. They can't fly at all - they're just instructional gear.'\n\n'Enough of that, Old Li - is something big in the offing?' Zhou Baozhong asked. 'More or less. Big or not, your cooperation is vital,' said Li Zhaolin. 'Which is why we've come to build bridges,' said Liu Yalou. All three burst out laughing."
 NEB_main_story_events.19.o: "The Northeast's liberation is within sight."
 NEB_main_story_events.20.t: "A Complete Change"
 NEB_main_story_events.20.d: "During his spell at the Northeast Bureau, Zhou Baozhong came to know its overall situation anew.\n\nThe Bureau had now carved out broad base areas in the Northeast and partly restored those in the Outer Northeast. Production had revived and all was flourishing; the intelligence network had been rebuilt, so that the least stir in the Northeast brought a report to the Bureau's desk the next day.\n\nHe recalled his previous visit, when he had come to hear a briefing on the Hailar fortress. Now he no longer had to worry about taking that fortress: the link across the Greater Khingan had been cut, the enemy's cipher broken, and at a single word the fortress would return to the people by uprising. Zhou Baozhong had originally been Second Deputy Secretary, with his heart set on military construction; as Second Secretary he now had political work on his hands as well.\n\nFirst Secretary Li Zhaolin and First Deputy Secretary Liu Yalou had lent much help, giving many introductions to the work when PLA comrades arrived at the Bureau.\n\nHaving signed the day's last document, Zhou Baozhong returned to his quarters to find Li Zhaolin long since waiting.\n'How is it going?'\n'All right. I'm not yet very deft at the work, but the comrades are kind and have taught me a great deal. Old Li, you've done well here in the Northeast.'\n'Don't praise me - there's plenty still to do. As for you, don't wear yourself out. You can't fool me; we've worked together for years. Do I not know you?'\n\nZhou Baozhong could only laugh wryly, for Li Zhaolin had read him exactly. He said, resigned: 'I know, I know. You may rest easy about that!'"
 NEB_main_story_events.20.o: "'I hope tomorrow is a fine day.'"
 NEB_main_story_events.21.t: "A Good Man"
 NEB_main_story_events.21.d: "Thanks to those forty years in the Northeast Anti-Japanese United Army, Zhou Baozhong not only enjoyed excellent relations with the Korean comrades and very good ones with the former Soviet comrades, but was one of the few PLA officers fluent in both Russian and Korean. The brilliant graduate of the Yunnan Military Academy had a career that might truly be called majestic.\n\nIn youth he burned to serve his country, but the times mocked him. After joining the Communist Party of China (CPC) he was posted to the Northeast and became a leading figure in the United Army; as the struggle grew crueler, the offices he held grew higher. After Yang Jingyu's death the United Army gradually withdrew into the Soviet Union. Zhou Baozhong worked alongside Li Zhaolin in leading a United Army of Chinese, Soviets, and Koreans, organizing the training brigade and founding the United Government. Whether it was his careful planning when the Japanese struck Vladivostok in force, or his orderly direction of the Red Army's retreat at Khabarovsk, the sweep of those early years shaped his bold yet meticulous conduct and his kindly way with people.\n\nKim Il-sung and Zhou Baozhong were on good terms. Recommending a candidate for Second Secretary, Kim Il-sung wrote: 'Even back in the United Army days, Commander Zhou told me more than once that our policy toward Koreans then had been wrong, and that in the new era Koreans and Chinese would do best to bury old grudges and resist Japan together. Thanks to him, I established good relations with the Chinese comrades once more. I might say that without Commander Zhou there would be no Kim Il-sung today.' He remembered too that when the United Government was founded, Zhou Baozhong had put him forward as a staff officer of the joint Chinese-Soviet-Korean command. The reason was simple: in that starving age for talent, Kim Il-sung was one of the few fairly young senior officers among the Koreans. In truth Zhou recommended several other Koreans as well; Kim Il-sung was only one of them. But that a young battalion commander such as he should enter the staff suggests Zhou may indeed have perceived an ability in him - what ability, only Zhou himself knew.\n\nSemyon was an ordinary Red Army soldier and also on good terms with Zhou. Recommending a candidate for Second Secretary, Semyon wrote: 'I met Commander Zhou at Khabarovsk. Japan was attacking the city and I was placed under his command. Khabarovsk was on the point of falling, my regiment had lost again and again and morale was low; I did not yet know what Commander Zhou could do, and pitied him as a victim forced to bear responsibility. I was wrong. Arriving at the front, he told us in imperfect Russian that this was not a defeat but a setback that must precede success; that we were all sparks of fire, and he, as commander, would never abandon us. Under his command we never lost again, and we pulled out of Khabarovsk successfully. From then on I deeply admired him and learned much military knowledge from him.'\n\nChinese, Soviet, or Korean - their verdict on Zhou Baozhong was a very simple one."
 NEB_main_story_events.21.o: "A Good Man"
 NEB_main_story_events.22.t: "A Heaven-Sent Genius"
 NEB_main_story_events.22.d: "Liu Yalou, with his years of study in the Soviet Union, was beyond doubt one of the few senior intellectuals in the Northeast Bureau. At the Frunze Academy he had struggled hard against the language barrier and finished his course. Yet in the very year he graduated he was abruptly sent to the Far East, and after that he never managed to restore contact with the Party Central Committee. Denied the chance to return to the Center and go on resisting Japan, he had come instead to a wholly new front - the Northeast. He had hoped to meet men like Yang Jingyu and Zhao Shangzhi, whose very names struck fear into the enemy; instead he learned of their deaths. And hard on that came the Soviet collapse. Seeing Li Zhaolin and Zhou Baozhong for the first time, Liu Yalou gazed blankly at a Far East in chaos. How long could the Northeast Anti-Japanese United Army hold on?\n\nIn that hour of crisis Liu Yalou saw that the Northeast's resistance must enter a new phase. The Soviet dissolution had left the Far East administratively adrift, contact with the Supreme Soviet was cut, and the region needed a backbone. He hurried to confer with Li Zhaolin about founding the Northeast Anti-Japanese United Government. Li Zhaolin, as it chanced, had the same thought. The two immediately contacted the various forces and established the United Government at Vladivostok to administer Far Eastern affairs as one. This fragile government was a motley crew, hard for Li Zhaolin and Zhou Baozhong to coordinate, so the burden of personnel fell upon Liu Yalou. He at once showed the flair of a political cadre: within a bare month he made contact with every Red Army unit and grass-roots authority in the Far East and basically steadied the situation.\n\nJust as the United Army was gathering strength to resist Japan in earnest, it was struck by a major Japanese offensive. Liu Yalou had meant to renew contact with the Supreme Soviet but had to break it off. Unprepared, the United Army and the Red Army suffered an unprecedented defeat, and Japan easily took most of the Far East. In the retreat, formations were broken up and communications severed; Liu Yalou used every device to rally the troops and send out liaison men, and so salvaged part of the loss.\n\nNow Second Secretary of the Northeast Bureau, Liu Yalou enjoyed what amounted to universal confidence. With the Center's help the United Army had not only recovered its strength but would become the spearhead of the Northeast's liberation. Liu Yalou studied the map and traced two offensive lines along the Chinese Eastern Railway - a great encircling movement he had long been nursing, and Chairman Mao's strategy matched his own exactly. Though he had been away from command for a long time, the art of war in his mind let him once more build a flawless plan of operations."
 NEB_main_story_events.22.o: "Commissioned in a Time of Peril"
 NEB_main_story_events.23.t: "Disaster Descends"
 NEB_main_story_events.23.d: "In the streets and alleys of Hsinking, newsboys held up their papers and shouted at the tops of their voices: 'Extra! Extra! The CPC rejects the Empire of Japan's peace talks! Extra! Extra! The CPC rejects the Empire of Japan's peace talks!' Old Liu picked up a torn copy of the fresh edition from the ground and read the big headline closely: 'CPC refuses the Empire of Japan's peace talks; the red bandits have already attacked Manchukuo.'\n\nOld Liu gave a cold laugh. He thought of his family: the wife seized and made a comfort woman, dead of a broken heart; the eldest son, forcibly conscripted, now at the front in the south; the second son, whom he had had no choice but to send off, unheard of since he entered the Greater Khingan. Now Old Liu was alone, keeping body and soul together only by his neighbors' aid. 'Retribution! Retribution! Retribution!' he cried in the market street. 'This is your retribution!' He laughed up at the sky, heedless of the Japanese gendarme who bore him to the ground; nor could he see the Japanese officer in the distance slapping a policeman. He only felt that the sky would soon brighten, the night would soon be over, and the demons of the land of the rising sun would be scattered by the true sun.\n\nAt that moment, in a daze, he thought he heard the Japanese officer before him, in his service cap, say something in that outlandish tongue; the interpreter beside him translated a few words: 'You... disturbing the peace... what?' Old Liu sneered: 'Disturbing the peace, yes, disturbing the peace - what business have you beasts here disturbing the peace?' He fixed his eyes on the officer. The interpreter appeared to say something more, but whatever it was, the officer suddenly drew a black hole from inside his coat. Old Liu looked at that black hole and said: 'Go on, then! This old carcass isn't good for much. Go on!' The officer, seemingly more enraged, was about to do something when several Japanese held him back. In a haze Old Liu saw a Japanese officer with a samurai blade say something else, and then the gendarmes forced him down. Last of all, a gunshot split the sky."
 NEB_main_story_events.23.o: "Japan Incurs Another Blood Debt"
 NEB_main_story_events.24.t: "The Tiger Comes Down the Mountain"
 NEB_main_story_events.24.d: "Inside the Hailar fortress several Japanese officers were whiling away the time sharpening pencils. These men had long been turned by the Northeast Bureau; the moment they learned of the puppet government's collapse in the south, they knew at once that the PLA's next blow would fall on the Northeast, and that the beginning of its liberation would beyond doubt be this vast fortress. They had a powerful presentiment that contact would come soon.\n\nJust then a messenger came into the officers' room and said: '報告します、大佐、西から手紙が届きました。(Reporting, Colonel: a letter has arrived from the west.)' The colonel took it and slapped the table delightedly: '王明貴支隊長が来るらしい、どうやら反乱を起こそうとしているようだ。(It seems Commander Wang Minggui is coming - looks like they mean to raise a revolt.)' He rushed from the bunker and saw Wang Minggui, formerly commander of the Third Detachment of the Third Route Army of the Northeast Anti-Japanese United Army and now commander of the Hailar fortress detachment, already standing on the Henantai position. A standard-issue PLA pistol hung at his hip; behind him stood PLA soldiers with rifles, green uniforms, and red five-pointed-star caps.\n\n'Commander Wang, I am obliged.' The colonel took off his cap and offered his samurai sword.\nWang Minggui accepted the blade, produced a cap, and said: 'Come with me. Let us save our homeland.'\nThe colonel donned the green cap with its red five-pointed star and saluted Wang Minggui: 'Commander Wang, the Hailar fortress today answers your army's call, declares its uprising, and returns this sacred soil to the Chinese people!'\n\nWang Minggui went to the radio at the Henantai position and reported to Li Zhaolin and Zhou Baozhong that the fortress was about to rise. The two ordered the uprising wire sent. As the radio waves of the Hailar uprising carried across the broad Northeast, the PLA's 38th Army set out from Zhalantun, crossed the Greater Khingan along the railway, and threw itself against Qiqihar; the guerrillas of the Outer Northeast to the north responded at once, crossing the mighty Heilongjiang to set foot on a homeland lost nearly forty years. The people of the Northeast have backbone; the people of the Northeast are kind; the people of the Northeast long for home! Today they bring liberation to the soil of their fathers!"
 NEB_main_story_events.24.o: "The road home lies right before us"
 NEB_main_story_events.25.t: "Beginnings and Endings"
 NEB_main_story_events.25.d: "Sasaki huddled shivering in a cupboard. The roar of gunfire was far off, but the footsteps of those hunting Japanese officials were close at hand. Sasaki could not understand it: the Emperor had announced that the war was wholly over, so why were the Chinese still advancing? And Manchukuo was no part of China, so why were the Chinese invading? Suddenly the cupboard was torn open. Several women with guns shoved Sasaki to the floor; he struggled frantically, but in vain. He cried out desperately in Japanese: '放す！放す！(Let go of me! Let go of me!)'\n\n'Open those dog eyes of yours and see who I am!'\n\nSasaki understood little Chinese, but he caught that. He looked hard and saw a Chinese woman; then, glancing around, he found she was not alone - a Russian-looking girl and a Korean-looking young woman stood beside her. He dropped to his knees and kowtowed again and again: 'Spare me, spare me!' But his broken Chinese was so poor that no one could have taken him for a beast who had shed his arrogance. The woman shook her head and signaled to the other two; together they bound Sasaki. The young woman said in halting Japanese: '逃げるな。(Don't try to escape.)' Her icy tone left Sasaki scarce daring to breathe. Then the Chinese woman and the others went away.\n\nDespairing, Sasaki had supposed someone would come to save him and take him back to the big villa in Tokyo with its wine. But when next he heard the door open, his face bright with a smile, there was no Japanese with a samurai blade to be seen. What he did not know was that here no Japanese would ever come to his rescue."
 NEB_main_story_events.25.o: "Your sins can never be forgiven, though you die ten thousand deaths."
 NEB_main_story_events.26.t: "Homecoming"
 NEB_main_story_events.26.d: "Li Zhaolin, Liu Yalou, and Zhou Baozhong stood on the summit of Dadingzishan, looking toward the city that had at last recovered the name it had lost for forty years.\n\n'At last, we're back,' said Li Zhaolin.\n\n'Yes, back,' said the white-haired Zhou Baozhong, with deep contentment.\n\n'So this is what the Northeast is like,' mused Liu Yalou.\n\nFrom the Greater Khingan in the west to Vladivostok in the east, from Shanhaiguan in the south to Hailanpao in the north; from snow-crowned ranges to close-packed conifer forests, from bottoms unseen to peaks that pierce the clouds; from 1931 to 1972 the Northeast's resistance to Japanese colonial rule lasted a full forty-one years. Forty-one years - near half a century; forty-one years - near a whole generation; forty-one years - near the length of a marathon. The people of the Northeast had at last come out of the long night; they were at last no longer slaves of a fallen nation; at last they could go home! Nor were they the only ones. The Koreans were still striving for their motherland's liberation, the former Soviet people awaited their return, and the recovery of Taiwan, China was still uncertain. Much work lay ahead - but today, let us drink a toast to the liberation of the Northeast!"
 NEB_main_story_events.26.o: "The great §xWar of Resistance of the Chinese Nation§! began in §xthe Northeast§! and ended in §xthe Northeast§!"
 NEB_main_story_events.27.t: "Going Home"
 NEB_main_story_events.27.d: "The Communist Party of China (CPC) smashed the government of the Republic of China with the force of thunderbolts, then declared war on Japan and launched the Third War of Resistance against Japan. In the wake of this, the Japanese in Vladivostok fell into utter confusion. Tokugawa was at his wits' end: he longed to return to Tokyo to escape the fighting, but the port of Vladivostok had long been closed.\n\nAs he was still casting about, his secretary came to him and said there was still one vessel that could carry him back to Japan, and asked whether he wished to go.\n\nBut with the chance before him, Tokugawa hesitated. Returning to Tokyo would only be flight from the fighting; even there, he could not be sure of avoiding another political storm. He had seen Japan's corruption and impotence with his own eyes - had he not come to Vladivostok precisely because he could not bear to stay in Tokyo? Going back now might embroil him in matters he wished no part of. On the other hand, the people now running Vladivostok's government had not only kept the city in excellent order but had brought him a fair measure of credit. Joining them was no bad choice either.\n\nAfter weighing it this way and that, Tokugawa said:"
 NEB_main_story_events.27.o: "'Do you know the CCP?'"
# Abandoned-draft easter egg; nothing else can be done for lack of a portrait of Song Renqiong
 NEB_main_story_events.28.t: "Establishment of the Northeast Bureau"
 NEB_main_story_events.28.d: "Song Renqiong had first heard of the Northeast Anti-Japanese United Army more than twenty years before. Ever since the dissolution of the Soviet Union and the Nanjing-Chongqing merger, contact between the Party Central Committee and the Northeast had come close to being severed. They had assumed the comrades had long since been martyred, and never expected that they had actually held on - news that was surely good.\n\nOn the rostrum, Song Renqiong looked out at the comrades below: some were disheveled, others in perfect order - a contrast that marked these two groups, the original comrades of the Northeast and the comrades sent from the northwest to support them.\n\n'Comrades, today is a great day. Here we will open a brand-new beginning for the anti-Japanese struggle in the Northeast!' Song Renqiong's speech from the rostrum was clear and resonant. Li Zhaolin, sitting to his right, watched this high-spirited First Secretary with mingled feelings. He had never met Song Renqiong; indeed, this could be called their first meeting. Yet he trusted the Party Central Committee, and trusted that the Party had sent a capable and vigorous man. Thinking thus, Li Zhaolin, though still uneasy, relaxed a good deal.\n\n'I was sent by the Party Central Committee. The Northeast's comrades have never met me, so you must have your doubts. I assure you all that I will lead this team well, and I hope you will offer plenty of criticism and correction!' Song Renqiong pressed on with his stirring words. Beside Li Zhaolin, Zhou Baozhong's heart was heavy. He could not understand why the Party Central Committee had not made Li Zhaolin First Secretary, but had instead dropped in someone unfamiliar with conditions in the Northeast. Could he truly lead the Northeast's comrades? Did he truly know the Northeast? His mounting doubts kept him from trusting this ambitious fellow.\n\n'Comrades, the Party Central Committee regards the Northeast as our future strategic direction, an important part of China's future war of liberation. We must close ranks under the leadership of the Party Central Committee.' Song Renqiong's speech was nearing its end. Liu Yalou, seated at Song Renqiong's left, was in fine spirits. Renewing contact with the Party Central Committee made him very happy. In his time in Xi'an he had been fully aware of how much the Party Central Committee prized the Northeast, treating it as one of its strategic directions. He had therefore approached Song Renqiong early; although Song Renqiong knew almost nothing of the Northeast, Liu Yalou had chosen to trust him.\n\n'The liberation struggle of the Northeast has lasted the longest, been fought in the harshest conditions, and developed with the greatest difficulty of any since the war of resistance began. The Northeast's comrades have endured much hardship, but that hardship was worth it. Today we gather here for our parents and neighbors, to free the whole Northeast from the Japanese conquerors' colonial rule, for the liberation of the entire Northeast. Our task is to liberate the Northeast, to liberate China, to liberate the whole world!' Amid applause Song Renqiong's impassioned speech drew to a close. But even as the applause rang out, those below could not conceal their doubts.\n\n"
 NEB_main_story_events.28.o: "All the work has only just begun." 
 NEB_main_story_events.29.t: "A Move Born of Necessity"
 NEB_main_story_events.29.d: "Having finished reviewing a document at his desk, Song Renqiong removed his reading glasses, shut his eyes, and relaxed. Working at his age was a real strain on the body. He set aside his work troubles for the moment, let his mind go blank, and recalled why he had come here...\n\nIt had been an ordinary afternoon. Song Renqiong returned from lunch to his office and found Deng Xiaoping sitting on the sofa. Startled, he hurriedly took up the teapot to pour the General Secretary of the Secretariat a cup of tea. Deng Xiaoping waved him off: 'No need. I've come to see you today about an urgent matter.' Song Renqiong knew this man of iron will: the Secretariat had more than enough on its plate already, and for him to come in person to see a mere local-bureau cadre, the business had to be grave. So he said: 'Very well - what is it?' Deng Xiaoping stunned him: 'The Party Central Committee is preparing to support the Northeast's construction. Will you go?' Song Renqiong nearly lost his footing - not because he shrank from going, but because if Deng Xiaoping asked him this way, the burden of supporting the Northeast would most likely land on his shoulders. The United Army had only just returned to the fold; supplies were scarce, personnel in disorder, conditions in the Northeast far worse than in the southwest, and the north colder than the south.\n\nClearly a thankless assignment - yet someone had to do it, and Song Renqiong was prepared to be named. Still, he wondered: why not transfer someone from the Center instead of choosing a local cadre? He ventured to ask Deng Xiaoping, whose answer left him at a loss: 'The truth is, the Chairman is rather at his wits' end...' That Chairman Mao should be at his wits' end meant things were worse than imagined. Deng Xiaoping let a little more out: 'You know as well as I do that the Party Central Committee has had little time to recover from the chaos, and some poison from the old thinking has not been cleansed away. I've looked over your record: when the southwest was liberated, you were the one managing the post-war grassroots cadre organization there, and you led the recovery in Chengdu and Chongqing as well. You were also the Southwest Bureau's candidate recommended for work in the Center. That shows uncommon ability, and the Northeast is exactly short of able cadres. Besides, revolution is revolution wherever it is; no post is high or low. Getting about and seeing more will do you good.'\n\nSong Renqiong thought it over: Deng Xiaoping's words did hold water. He could not stay cooped up in that little patch of southwest; he should travel, observe, and temper himself further. And though he was only a candidate now, if he did well in the Northeast his chances of entering the Center would be the better for it. So he consented readily, afterwards becoming head of the Northeast support team and then First Secretary of the Northeast Bureau."
 NEB_main_story_events.29.o: "We must not fail the Party Central Committee's trust"