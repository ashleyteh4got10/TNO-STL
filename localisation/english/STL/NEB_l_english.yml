# Story Events
NEB_main_story_events.1.t: "Telegram from the Northeast Party Committee"
NEB_main_story_events.1.d: "Respected Central Committee:\n\nThe westward withdrawal operation [NAJUA_situation]. In accordance with the instructions of the Central Committee, we have moved the headquarters to Qiaoba Mountain City and are awaiting further instructions from the Central Committee.\n\nNortheast Party Committee"
NEB_main_story_events.1.o: "[?global.date.GetDateStringNoHourLong]"
NEB_main_story_events.2.t: "Urgent Telegram from the Central Committee"
NEB_main_story_events.2.d: "Reply to Liu and inform the Northeast Party Committee:\n\nAfter study and discussion by the Central Committee, it has been decided that, to meet the needs of the current great liberation struggle, the Central Committee Northeast Bureau should be immediately established to represent the Central Committee in uniformly leading work in the Northeast. The Northeast Anti-Japanese United Army should be reorganized into the sequence of the People's Liberation Army.\n\nCentral Committee of the Chinese Communist Party\n\n[?global.date.GetDateStringNoHour]"
NEB_main_story_events.2.o: "A brand new situation for the liberation of the Northeast!"
NEB_main_story_events.3.t: "Establishment of the Northeast Bureau"
NEB_main_story_events.3.d: "It had been more than twenty years since Gao Gang first heard of the Northeast Anti-Japanese United Army. Since the collapse of the Soviet Union and the merger of Nanjing and Chongqing, contact between the Central Committee and the Northeast had been almost completely severed. It was thought that the comrades had long since sacrificed themselves, but they had unexpectedly persisted. This was undoubtedly good news.\n\nOn the rostrum, Gao Gang looked at the comrades below. Some were dressed in ragged clothes, while others were neat and orderly. This difference was also the mark of these people — the original Northeast comrades and the comrades who came to support from the Northwest.\n\n'Comrades, today is a great day. We will open a brand new starting point for the anti-Japanese resistance in the Northeast here!' Gao Gang spoke clearly and forcefully from the stage. Li Zhaolin, sitting to his right, looked at this spirited First Secretary and felt a mix of emotions. He had never met Gao Gang before; today could even be said to be their first meeting. But he trusted the Central Committee and believed that the person sent by the Party was a capable cadre. Thinking this way, although Li Zhaolin still had some doubts, he felt much more at ease.\n\n'I was sent by the Central Committee. The Northeast comrades have never met me before and must have doubts in their hearts. I promise everyone that I will definitely lead this team well. I hope comrades will criticize and correct me!' Gao Gang continued speaking bold words. Zhou Baozhong beside Li Zhaolin looked heavy-hearted. He did not understand why the Central Committee did not let Li Zhaolin become First Secretary but instead parachuted in someone unfamiliar with the Northeast situation. Could he really lead the Northeast comrades? Did he really understand the situation in the Northeast? His heavy doubts made him not fully trust this ambitious fellow.\n\n'Comrades, the Central Committee regards the Northeast as our future strategic direction and an important component of the future Chinese liberation war. We must closely unite under the leadership of the Central Committee.' Gao Gang's speech was nearing its end. Liu Yalou, sitting to Gao Gang's left, looked in a good mood. Re-establishing contact with the Central Committee made him very happy. During his time in Xi'an, he was very clear about the Central Committee's emphasis on the Northeast, regarding it as one of the strategic directions. Therefore, he had contacted Gao Gang early on. Although Gao Gang's past was indeed not very glorious, Liu Yalou still decided to trust him.\n\n'The liberation struggle in the Northeast is the one that has persisted the longest, faced the most difficult conditions, and been the hardest to develop since the War of Resistance. The Northeast comrades have endured a great deal of hardship, but this hardship is worth it. Today we gather here for our fathers and fellow villagers, to free the entire Northeast from Japanese colonial rule, and for the liberation of the entire Northeast. Our task is to liberate the Northeast, liberate China, and liberate the world!' Amid enthusiastic applause, Gao Gang's impassioned speech came to an end. Although the applause was loud, the people below could not hide their doubts."
NEB_main_story_events.3.o: "All the work has only just begun."
NEB_main_story_events.3.tt: "Please check the £CPC_texticon §xNortheast Bureau§! GUI and begin the first phase tasks of the Northeast liberation."
NEB_main_story_events.4.t: "In Qiaoba Mountain"
NEB_main_story_events.4.d: "Qiaoba Mountain City is a small town with only three thousand people. Five hundred meters away from the town, there is a small courtyard. Inside the courtyard are rows of plank houses, while outside the courtyard weeds grow wildly. A newly built tomb stands there.\n\nResidents often see outsiders wearing green clothes and five-pointed star hats walking around the town. They only know these people are from the People's Liberation Army, but no one knows what exactly they are doing here. In that courtyard, the kerosene lamps are often lit all night long.\n\nThe residents know someone lives in that courtyard, but that is not the main point. The main point is that tomb, which contains thousands of wronged souls. At some point, a small infectious disease began to spread in the village. The residents discovered it was caused by the rotting corpses, so they reburied the bodies and erected a small tombstone, hoping the people there could rest in peace. What surprised the residents was that someone actually dared to live next to that tomb!\n\nWhat the residents did not know was that the courtyard was the headquarters of the Northeast Bureau, and the tomb was evidence of past crimes.\n\nThis once-abandoned courtyard had crooked fences that were the home of insects. The eerie roof turned a square space into a triangle. In the mud walls, a few strands of straw hung down like a disabled old man weathered by the years, still stubbornly alive. Gao Gang and Li Zhaolin led the Northeast Bureau comrades in spending a month cleaning up the courtyard and thoroughly investigating the tomb. Shockingly, this courtyard had once been a liaison office set up by a Japanese unit from Harbin, and beneath the tomb were buried the remains of local monks and Mongols massacred by the Japanese army, as well as test subjects of bacterial weapons. As for what kind of experiments they were, those in the know felt chills down their spines."
NEB_main_story_events.4.o: "Because it has nothing to do with humanity."
NEB_main_story_events.5.t: "Rebirth of the Anti-Japanese United Army"
NEB_main_story_events.5.d: "“Attention! Fourth soldier in the second row, lift your feet higher!” The PLA officer’s voice rang out loud and clear. “On command, goose-step — march!” “One, two, three, four!” This was a military camp not far from Qiaoba Mountain City. Zhou Baozhong and Zeng Kelin were inspecting the training. Since the Anti-Japanese United Army returned to the Central Committee, the Northeast Party Committee was reorganized into the Northeast Bureau, and the soldiers of the United Army were incorporated into the PLA sequence. The Northeast Anti-Japanese United Army Teaching Brigade had become history. Their new designation was the 38th Army of the Chinese People's Liberation Army, consisting of three divisions, each with 12,000 men. After the United Army was incorporated into the PLA, the Central Military Commission immediately issued an order to dispatch PLA officers to the United Army and adjusted the force structure. Zhou Baozhong served as Army Commander, and Zeng Kelin served as Director of the Political Department. The regularized training of the United Army thus began.\n\nOnce upon a time, the United Army fought against the invaders in the white mountains and black waters. Long-term blockades made it difficult for soldiers to eat their fill, continuous combat left little time for rest, exacerbating fatigue. Moreover, the Northeast temperatures were not high and often below zero, causing many soldiers to suffer frostbite or freeze to death. Later, the collapse of the Soviet Union deprived the United Army of its last safe haven. The Soviets lost their homeland and their sense of belonging. The Soviet Red Army soldiers, unwilling to follow the fascists in the north, joined the United Army. However, subsequent large-scale mopping-up operations pushed the United Army into desperate straits. Since the September 18 Incident in 1931, the Northeast Anti-Japanese United Army has persisted in struggle on this vast land for nearly forty years.\n\nTimes have changed. The United Army has climbed out of the quagmire and returned under the bright red flag. This is the starting point of their rebirth and also a brand new starting point for the liberation of the Northeast."
NEB_main_story_events.5.o: "Brand New Situation"
NEB_main_story_events.6.t: "“Diaoyucheng”"
NEB_main_story_events.6.d: "In the PLA command headquarters, when Li Zhaolin placed the map of the Hailar Fortress in front of Gao Gang, Gao Gang gasped. A fortress of this scale was already comparable to the ones built near Xi'an.\n\n'Five high grounds around Hailar have all been turned into fortresses by the Japanese: Henan Terrace, Aobao Mountain, Song Mountain, Yidong Terrace, and Dongying Terrace. The Henan Terrace and Aobao Mountain positions are on both sides of the main road, Henan Terrace and Song Mountain positions are on both sides of the railway line. The Japanese supply base is built near the Yidong Terrace position to the east, and the Dongying Terrace position defends the southeast of Hailar City. There are mass graves on the mountains where Chinese people were buried alive. The five positions are connected by underground tunnels.' Li Zhaolin explained while sketching. Zhou Baozhong looked solemn and said, 'This place is not easy to attack. Casualties will definitely be heavy if we assault it directly.' Liu Yalou also said seriously, 'With such complete facilities, it would be better to capture it intact.' Gao Gang looked at the map on the wall and said, 'This place is simply the Northeast version of Diaoyucheng in Sichuan. The only difference is probably that Diaoyucheng was used to defend the country and protect the people.'\n\nThis fortress, built with the blood of the people, must return to the hands of the people and accept the judgment of the people. The criminals who forced the Chinese people to build this fortress must face the people's trial.\n\nGao Gang and Li Zhaolin felt extremely complicated inside. How could they return this fortress to the hands of the people? Attacking this heavily fortified position would be difficult, but it was a challenge they had to overcome.\n\nBecause the people who learned the truth would unhesitatingly order their troops to exterminate these beasts."
NEB_main_story_events.6.o: "The people's judgment will surely come"
NEB_main_story_events.7.t: "Trap the Dog Behind Closed Doors"
NEB_main_story_events.7.d: "The Greater Khingan Range is a natural barrier on the western side of the Northeast Plain. Although its mountains are not as majestic as the Kunlun, its dense forests are rare in the world. Since 1900, Tsarist Russia built railways and towns here, cutting through mountains and bridging rivers, finally completely opening up the mountain range.\n\nThe symbol of this opening is the 'Xing'an Ridge Tunnel.' This 3,077.2-meter-long tunnel is the only passage through the east-west Greater Khingan Range, and the North Manchuria Railway's main transport artery runs through it. Li Zhaolin was very familiar with this place. He had fought guerrilla warfare here, bombed trains, seized supplies, and liberated the people. This was the only supply line for the Japanese forces west of the Greater Khingan Range. If this tunnel were cut, the Japanese forces entrenched here would be trapped like turtles in a jar.\n\n'Ring ring ring—'\n\nLi Zhaolin picked up the receiver and put it to his ear. A young and crisp voice came from the receiver: 'Secretary Li, we just received news from Boketu. They have completed the mission.'\n\n'Good, tell them to continue working hard.' After hanging up the phone, Li Zhaolin showed a gratified smile. As long as they controlled Boketu, they would control this tunnel. Thinking of this, Li Zhaolin took out paper and pen. He was preparing to conceive a larger plan — Trap the Dog Behind Closed Doors. He wanted the Japanese invaders in the Greater Khingan Range to have no way out, not a single one could escape."
NEB_main_story_events.7.o: "This blood debt must be settled"
NEB_main_story_events.8.t: "A Helpless Move"
NEB_main_story_events.8.d: "Many people do not understand the First Secretary of the Northeast Bureau. This is actually not a big deal, because the Northeast comrades do not know what happened in those ten-plus years. Gao Gang coming to the Northeast Bureau itself was the result of a compromise.\n\nWhen the Central Committee discussed sending a support team to the Northeast, the meeting presided over by Mao Zedong went very smoothly at first, and the members of the support team were quickly determined. However, on the question of 'who should be appointed as the team leader,' Mao Zedong and Liu Shaoqi had different ideas. The two sides then engaged in deeper discussion. Perhaps because both sides thought it was only a personnel issue, or perhaps due to the resurgence of factionalism, a heated argument broke out among the participants during one discussion meeting. Although Mao Zedong and Liu Shaoqi had no intention of causing this, it still happened and grew more intense. In the end, if Zhou Enlai and Zhu De had not intervened, the quarrel might have escalated further. Mao Zedong scoffed at the idea of many people 'placing their own trusted aides,' but he had to admit that for him and Liu Shaoqi, no matter who was chosen as the leader, some people would see it as one faction extending its hand into the Northeast.\n\nJust when Mao Zedong was at a loss, an unintentional remark from Liu Shaoqi woke him up: 'It would be easy if we choose a disgraced person that no one cares about.' Thus, when Gao Gang's name appeared at the discussion meeting, everyone fell silent. The reason was simply too sufficient and impeccable. First, Gao Gang had long been stationed in Mongolia. Although he was not particularly familiar with the Northeast situation, he had been working in the place closest to the Northeast. Second, Gao Gang had once been a highly influential figure within the Central Committee. Although he had left, he still had that background. Finally, he was a person 'with stains,' so no one would think that the so-called 'Mao faction' was expanding its influence in the Northeast.\n\nThus, the leader of the Northeast support team was decided, and this leader would undoubtedly be the First Secretary of the Northeast Bureau. The frustrated Gao Gang no longer cared whether he could make a comeback, but he was determined to seize this opportunity."
NEB_main_story_events.8.o: "Gaining back some face is still something."
NEB_main_story_events.9.t: "Replanning"
NEB_main_story_events.9.d: "After consolidating the base areas, Northeast Bureau branches were established from Manzhouli to Zhalantun. With the intelligence obtained by the Hailar branch inside the fortress, the Northeast Bureau not only successfully acquired all information about the fortress but also established base areas throughout Hulunbuir. Once the Party gave the order, Hulunbuir would rise up and return to the ranks of the people. Under such circumstances, the Northeast Bureau held multiple meetings to study the next operational strategy. In the end, the China Eastern Railway Plan proposed by Liu Yalou and the Outer Northeast Recovery Plan proposed by Cui Yongjian were placed on the First Secretary's desk.\n\nAfter listening to the reports from Liu Yalou and Fang Hushan (Cui Yongjian was advanced in age), Gao Gang and Li Zhaolin fell into deep thought. Both the Northeast and Outer Northeast had their merits. Supporting the Northeast was beneficial for future liberation, but it lacked a solid mass foundation, meaning more resources would need to be invested, and Outer Northeast would be difficult to prioritize. Supporting Outer Northeast would help restore the original strength of the Northeast Anti-Japanese United Army, had a better mass foundation, and Japan and Manchukuo did not attach much importance to the area. However, this was not conducive to the future liberation of the Northeast and would create greater resistance to liberating the Northeast.\n\nA difficult choice — how should they decide? After several discussions with no result, Gao Gang and Li Zhaolin finally agreed to report to the Central Committee. And the Central Committee's decision was —"
NEB_main_story_events.9.o1: "Implement the China Eastern Railway Plan"
NEB_main_story_events.9.o2: "Implement the Outer Northeast Recovery Plan"
NEB_main_story_events.9.tt: "Please check the £CPC_texticon §xNortheast Bureau§! GUI and begin the second phase tasks of the Northeast liberation."
NEB_main_story_events.10.t: "Pearl of the Northeast"
NEB_main_story_events.10.d: "The surging river water churned the silt and flowed eastward. One train whistled past the place where Itō Hirobumi met his end, while another train billowing thick smoke stopped at the side of the platform.\n\nSasaki got off the train and clearly saw the city where he would live. The train station still retained its Russian style. It was said that there had been plans to transform it into Japanese-style architecture, but Japanese and Russian styles differed greatly, and renovation would basically mean reconstruction. So Japan gave up on the transformation and only made some repairs. Sasaki came to the square in front of the station. It was bustling with traffic, and the cries of vendors were endless. Sasaki felt a surge of excitement. It was worth traveling thousands of miles from home to this prosperous city.\n\nSasaki, who had found a job, was happy every day. His duty was to drive away beggars, gangsters, and vagrants from the streets and alleys. But in a city like Harbin, this was impossible, so it was just a leisurely job. Drinking coffee and tasting black tea in a café was his daily pleasure. Dancing with beauties under the neon lights at night became his joy. Watching a wonderful movie in the theater, eating sausages, and drinking kvass — the day passed just like that. Sasaki thought that it was almost the same as in his big villa in Tokyo.\n\nIndulging in pleasure, Sasaki looked at the Chinese woman washing his feet. Her graceful figure immediately aroused his lust. Ignoring the Russian girl washing his hair and the Korean girl wiping his body, he grabbed her. The frightened girl instinctively wanted to scream, but the Korean girl quickly covered her mouth and eyes, murmuring in Korean, 'Don't look, don't look...'\n\nAfter enjoying himself, Sasaki rolled over onto the bed, completely ignoring the crying Chinese woman, as he was fantasizing about tomorrow."
NEB_main_story_events.10.o: "“Truly worthy of being the Pearl of the Northeast.”"
NEB_main_story_events.11.t: "Fulcrum"
NEB_main_story_events.11.d: "The Northeast has always been a relatively cold place. After years of development, it is no longer so cold and has even built an industrial park. The Manchuria industry centered on Shenyang and Changchun is thriving.\n\nBut the raw materials supporting this industry come from the Republic of China. To transport the raw materials, Japan invested huge amounts of money to operate and secure transportation, with the focus being Jinzhou. Jinzhou has always been the southern gateway to the Northeast; all material transport must pass through here. Liu Yalou recognized this point and thus proposed 'break through Jinzhou first.' On this basis, the Central Committee proposed to the Northeast Bureau the grand strategic concept of seizing Jinzhou, Shenyang, and Dalian and then advancing north to Haishenwai: The People's Liberation Army would break through Jinzhou with lightning speed, then seize the strategic points in western and eastern Liaoning, cutting off the connection between the enemy in the Northeast and Japan.\n\nIt is not difficult to use intelligence and other means to lure the enemy toward the border. The difficulty is whether the People's Liberation Army can seize these strategic points in an extremely short time. Among these points, Japan will definitely focus on defending Jinzhou. Therefore, whether Jinzhou can be quickly broken through is the key of keys.\n\nThus, the Northeast Bureau decided to drive a wedge here in advance, so that in the future they could completely throttle the enemy's neck. Using the small fulcrum of Jinzhou to pry up the big iron ball that is the Northeast!"
NEB_main_story_events.11.o: "Prepare in Advance"
NEB_main_story_events.12.t: "The Long Spring"
NEB_main_story_events.12.d: "Although the Northeast Bureau established a strategy centered on the Northeast, Outer Northeast was also of great importance. After discussion by the Northeast Bureau, it was decided to dispatch Fang Hushan to Outer Northeast to continue the work.\n\nAfter rushing back to Hailanpao, Fang Hushan threw himself into work without stopping.\n\nFang Hushan re-investigated the situation in Outer Northeast. Although it was still bad, at least they would no longer be isolated and helpless. He set about restoring the Party organizations and base areas in Outer Northeast. First, he took stock of the remaining Party members in Outer Northeast. Some former Soviet Communist Party members also joined the Chinese Communist Party. Comrades in Korea also re-established contact. According to the instructions of the Northeast Bureau, Fang Hushan helped the Korean comrades establish the Korean Communist Party. Second, he restored the base areas. The Northeast Bureau's actions in the Northeast successfully attracted the attention of Japan and Manchukuo. Taking this opportunity, Fang Hushan restored some base areas in Outer Northeast. Due to insufficient support from the Northeast Bureau, only the Miaojie base area was restored. Other base areas were still in the process of difficult recovery. Finally, Fang Hushan reorganized the guerrilla units in Outer Northeast. Although they were not large in scale, they were more than enough to pin down the Japanese army.\n\nUpon receiving Fang Hushan's report, Li Zhaolin was overjoyed. He picked up his pen and wrote a tribute: 'White mountains and black waters for thirty years, seemingly like a rotten axe handle but actually nurturing people. Mountains stretching for thousands of miles, the tiger's roar intimidates the enemy's courage.'\n\nThe long night has finally ended, and the cold land welcomes a belated spring. After receiving the reply, Fang Hushan was extremely excited. He deeply felt that winter had completely ended and sincerely hoped that this spring would last a little longer."
NEB_main_story_events.12.o: "Let us feel the warm spring breeze."
NEB_main_story_events.13.t: "Troika"
NEB_main_story_events.13.d: "China, the Soviet Union, and Korea are the three countries that suffered the most severe Japanese invasion. The Northeast happens to be at the intersection of the three countries, so the personnel of the Northeast Anti-Japanese United Army were mostly composed of people from these three countries. Whether it was the Northeast Anti-Japanese United Government established in the past or the People's Liberation Army reorganized after the establishment of the Northeast Bureau, personnel from China, the Soviet Union, and Korea still made up the majority. This situation forced the Central Committee to always handle relations among the three countries carefully, striving to unite the peoples of the three countries under the banner of the Chinese people's resistance against Japan. It can be said that the Chinese people, the Soviet people, and the Korean people are the troika of the United Army.\n\nKorea was the first country to be annexed by Japan. Since its annexation in 1910, the Korean independence movement has surged continuously without stopping. The national hero An Jung-geun's assassination of Itō Hirobumi was a declaration by the Korean people that they would never submit to enslavement. The Soviet Union was a country that suffered a major blow from Japan. Although it inherited the territory of Tsarist Russia, the底层 people above were innocent. After the collapse of the Soviet Union, Japan took advantage of the chaos. After the broad Soviet people gained liberation, they suffered new oppression. China is the country that suffered the most severe Japanese invasion. The Nanjing Massacre and the current fragmented and torn state of the motherland are all thanks to them. The Chinese Communist Party holds high the banner of resistance against Japan and vows to drive Japanese imperialism out of Chinese soil.\n\nThe peoples of China, the Soviet Union, and Korea have one common wish, and that is —"
NEB_main_story_events.13.o: "To leave Japan with no place to bury its dead!"
NEB_main_story_events.14.t: "Empty Shell"
NEB_main_story_events.14.d: "Mayor Tokugawa looked at this year's financial report and was surprised to see a new high. Although he was delighted, he was also very worried — what if he had to go to Tokyo? But that was definitely overthinking, because there was no need at all. People in Tokyo simply did not care about Haishenwai.\n\nTokugawa had another reason for not wanting to go to Tokyo. Since he took office, familiar faces had disappeared one by one — they were promoted faster and faster. This would have been fine, but for some reason, all the newly appointed officials were not from mainland Japan. Although Tokugawa was not politically savvy, his observation skills were quite good. He slightly investigated the resumes of these officials. Although they all came from Manchukuo, reliable household registration information could not be found, and these officials worked diligently, completely unlike the style of Japanese officials. With doubts in his heart, he hypnotized himself by thinking that they had simply changed to a batch of capable people. But illusions are ultimately illusions, and numbness cannot solve the problem. By the time he looked around again, the people around him were all of this kind.\n\nTokugawa did not believe in bushido at all. As a descendant of the former shogunate, he had long lost interest in politics. However, the current situation was indeed somewhat tricky. He had originally come to Haishenwai to avoid political storms, yet he had fallen into another potential storm. He no longer had the mood to rejoice over achievements and instead picked up a book on the table — *The Communist Manifesto*."
NEB_main_story_events.14.o: "I hope my future will be a little better."
NEB_main_story_events.15.t: "Run Quickly"
NEB_main_story_events.15.d: "Sato was an ordinary first-class soldier stationed at the puppet Manchukuo headquarters. Ever since he was transferred here, he had seen a bunch of strange things.\n\nHis immediate superior would from time to time order him to rush into various civilian houses, but every single house was empty. Therefore, what Sato heard most were phrases like 'Sorry,' 'Idiot,' and 'This time we must catch the Red bandits.' From his colleagues, he learned that the 'bandit problem' within puppet Manchukuo was becoming increasingly serious. Meanwhile, the Northeast Anti-Japanese United Army, which had once toyed with the Kwantung Army, had vanished without a trace. Coincidentally, the disappearance of the Northeast Anti-Japanese United Army marked the beginning of the 'rampant banditry.' Harbin, Fengtian, and other places were already in a state of panic, with rumors spreading on the streets that the United Army had returned and that Japan would fail in Manchuria. Sato was frightened by this.\n\nOne day he was dispatched to patrol outside the city. Previously, a patrol squad had gone missing, and now Sato's squad was taking over. After leaving the city, Sato walked and looked around, very puzzled as to why a squad would go missing in such a safe place. When they reached the end of the patrol route, Sato found nothing unusual. Having gained nothing, Sato followed his superior back. Along the way, he was still puzzled why his superior had sent their squad out on patrol when they were doing fine at headquarters. Unable to figure it out, he decided not to think about it anymore. Back in the city, he complained to his colleagues about the superior sending them out on patrol. After listening, a colleague asked a question: 'Then where did that squad go?' While drinking, Sato answered irritably, 'I don't know.' His colleague continued, 'But don't you think it's strange? If they were attacked, there should have been traces along the way.'\n\nThis sentence made Sato put down the wine in his hand. That's right — why were there no traces of the missing squad along the way?"
NEB_main_story_events.15.o: "“I absolutely cannot stay here any longer!”"
NEB_main_story_events.16.t: "Retire After Success?"
NEB_main_story_events.16.d: "Working at the Northeast Bureau allowed Gao Gang to regain some of the joy of work that he had not felt for a long time. Perhaps this kind of work could become a springboard for his return to the Central Committee? Gao Gang could not help but think so.\n\nSeeing that he was about to complete a full year, Gao Gang felt it was time. There was no need to continue idling in this desolate place. Gao Gang should stand on a high hill and benefit the people. So he submitted a report to his superiors, detailing the situation in the Northeast and expressing his wish to continue working at the Northeast Bureau.\n\nPerhaps some people find it hard to understand Gao Gang's behavior, but this is not uncommon in history. Three resignations and three refusals, hiding one's light and biding one's time... Gao Gang did not feel there was any loss in this, because whether the Central Committee agreed or not, the worst outcomes were returning to Mongolia, being transferred to the border, or being recalled as an idle person. Precisely because he was a person 'with stains,' he was not afraid of excessive处置 from the Central Committee.\n\nLi Zhaolin, who had worked with Gao Gang for nearly a year, had long known of Gao Gang's ambitions. Comrades around had reported that Gao Gang was somewhat arrogant due to his talents, but since Gao Gang was indeed capable, the comrades could still tolerate it. Li Zhaolin believed the Central Committee would definitely transfer Gao Gang away, but the Central Committee would not do so too quickly. It was better for a person 'with stains' to stay farther from the Central Committee.\n\nSoon, the Central Committee's reply arrived."
NEB_main_story_events.16.o: "“The meeting decided that Gao Gang shall return to Xi'an.”"
NEB_main_story_events.17.t: "Who Should Be Chosen?"
NEB_main_story_events.17.d: "After Gao Gang left office, Li Zhaolin became the undisputed choice for First Secretary of the Northeast Bureau. However, the selection of the Second Secretary fell into controversy.\n\nSome comrades recommended Zhou Baozhong, Commander of the 38th Army, on the grounds that Zhou Baozhong better understood the PLA's command system and actual combat style. With him leading the troops, it could strengthen the Northeast Bureau's unified military command. Other comrades recommended Liu Yalou, on the grounds that he was better at political work. As a cadre of the Northeast Bureau, having him would better guide the Northeast's political mobilization, organizational construction, and logistical support work.\n\nLi Zhaolin talked with several comrades again. Comrade A said, 'I support Commander Zhou as Second Secretary because he is very familiar with the army. The Northeast Bureau now needs more coordination with the army. With him coordinating, things will definitely be twice as effective.' Comrade B said, 'I personally support Commander Zhou, but Commander Zhou has always been in the army after all. I think it's better to choose someone from within the Northeast Bureau so as not to add burden to the commander.' Comrade C said, 'Then I support Deputy Secretary Liu. Secretary Liu is excellent at political work, and most comrades in the Bureau are familiar with him.' Comrade D said, 'I think either is fine. But Secretary Li, you should pay attention to your health. I heard that Gao Gang's transfer this time actually has another deeper meaning.' Comrade E said, 'Whoever it is is fine. I have no opinion. As long as they can do the job well.'\n\nAfter collecting various opinions, Li Zhaolin also had a candidate in mind. At the election meeting, Li Zhaolin was elected First Secretary without controversy. As for who would become the Second Secretary? Everyone held their breath as the vote counter tallied the votes and finally announced loudly: 'The Second Secretary shall be —'"
NEB_main_story_events.17.o1: "“Zhou Baozhong!”"
NEB_main_story_events.17.o2: "“Liu Yalou!”"
NEB_main_story_events.18.t: "A Dream"
NEB_main_story_events.18.d: "In Li Zhaolin's office there was a safe that contained every telegram approving the establishment of Northeast Party Committee branches. One day, Li Zhaolin took out these telegrams for inspection. At the end of the inspection, Li Zhaolin discovered a small, unnoticed good thing — there were a total of 28 telegrams, exactly the same as the total number of provinces occupied by puppet Manchukuo. On Li Zhaolin's desk, there were also two telegrams approving the establishment of Dalian and Haishenwai branches waiting to be sent. Li Zhaolin felt water sliding down his face. He looked up at the ceiling, but there was no leak. He touched his face in confusion and realized the tears were flowing from the corners of his own eyes.\n\n'Knock knock knock!' Suddenly, there was a knock at the door. Li Zhaolin hurriedly got up to open it. The moment he opened the door, he froze on the spot. In front of him was a sharp-eyed man from Henan. He smiled and asked, 'Hello, where is this?' Li Zhaolin clenched his fists, trying hard to suppress his emotions that were about to burst out, and calmly replied, 'Hello, comrade. This is the Northeast Bureau.' 'Northeast Bureau? I've never heard of it.' 'Of course, because the Northeast Anti-Japanese United Army has returned under the banner of the Central Committee.' 'United Army... the United Army has come home?' 'Yes, the United Army has come home!' 'Come home... come home...' The stranger's voice changed from tense to relaxed, and his expression gradually eased. 'Come home, it's good to be home...' As he spoke, the stranger turned into smoke and disappeared. Li Zhaolin looked at this abnormal scene in astonishment. He walked out of the room. Although it was still the square where the Northeast Bureau was located, three formations stood in the square. Each formation had a person holding a red flag, and on the red flags were written 'Northeast Anti-Japanese United Army First Route Army,' 'Northeast Anti-Japanese United Army Second Route Army,' and 'Northeast Anti-Japanese United Army Third Route Army.'\n\nFrom the distant sky came the familiar melody. The soldiers in the formations began to sing: 'We are the Northeast Anti-Japanese United Army, creating the First Route Army of the United Army. The sound of charging, killing the enemy, and seizing weapons is the ironclad proof of revolutionary victory... Iron Ridge's steep cliffs, dense forests, violent storms, war horses neighing by the荒原 waterside. Gathering around the fire, illuminating the sky red. Comrades! Even if the Songjiang waves rise at dusk, our resolve remains sharp. Rise! Charge bravely, expel the Japanese invaders, recover the Northeast. The sky breaks at dawn, and glorious light surges forth...' Li Zhaolin burst into tears and cried loudly on the spot. 'Comrade, take it.' The stranger suddenly appeared beside Li Zhaolin again and handed him a rifle. 'Use this gun to pierce the long night of the Northeast!' Li Zhaolin took the gun, recalling the time forty years ago. He wiped away his tears and shouted loudly: 'Everyone, charge!'\n\n'Comrade Zhaolin, Comrade Zhaolin.' Li Zhaolin suddenly opened his eyes. [NEB_second_leader] was looking at him with concern. [NEB_second_leader] rebuked him: 'Comrade Zhaolin, why are you sleeping on the floor? If you're tired, you should rest properly. I have to criticize you for this.' Li Zhaolin looked around. He was still in his office; everything he had just seen seemed to be an illusion. He smiled awkwardly and said, 'I accept the criticism.'"
NEB_main_story_events.18.o: "Even if this is a dream, it is worth it."
NEB_main_story_events.18.tt: "Please check the £CPC_texticon §xNortheast Bureau§! GUI and begin the third phase tasks of the Northeast liberation. Since [NEB_second_leader] was elected as Second Secretary, the [NEB_num] task of this phase is automatically completed."
NEB_num_1: "first"
NEB_num_2: "second"
NEB_main_story_events.19.t: "Build Bridges"
NEB_main_story_events.19.d: "Zhou Baozhong led Li Zhaolin and Liu Yalou to the 38th Army. The column soldiers were learning brand new military combat techniques, practicing shooting and artillery. Compared to the Northeast Anti-Japanese United Army of a year ago, they were already much stronger.\n\nThe three came to the conference room, where the PLA cadres had been waiting for a long time. Zhou Baozhong introduced them one by one, and then the three sat down. Zhou Baozhong presided over the meeting: 'Comrades, this meeting is to strengthen coordination between Northeast Bureau comrades and PLA comrades in combat operations. We have invited Comrade Li Zhaolin, First Secretary of the Northeast Bureau, to give us an introduction to the Northeast. Everyone, please welcome him.' After a round of applause, Li Zhaolin briefly introduced the Northeast Bureau and the situation in the Northeast and answered some questions raised by the PLA comrades, such as terrain and city issues.\n\nAfter the meeting, Zhou Baozhong, Li Zhaolin, and Liu Yalou went to the cafeteria for a meal. Li Zhaolin joked, 'Old Zhou, you've gotten thinner. Comrades used to say you looked like French bread before. Now you look even more like it?'\n\n'Stop teasing me, Old Li. Being the commander of an army is not easy. If the Central Committee hadn't really had no one else, I wouldn't have gotten this position. However, unlike managing a brigade before, coordinating the actions of an entire army is much more difficult now.' Liu Yalou said, 'Old Zhou, I heard you've been equipped with new toys. Something called... airplanes?' Zhou Baozhong laughed loudly: 'What airplanes? They're just scrapped trainer planes shipped from the Northeast. They can't fly at all. They're only used as training aids.'\n\n'Enough of that. Old Li, is there going to be a big operation soon?' Zhou Baozhong asked. 'Pretty much. Whether there is or not, your cooperation is crucial.' Li Zhaolin said. 'That's why we've come to build bridges,' Liu Yalou said. The three of them laughed heartily."
NEB_main_story_events.19.o: "The liberation of the Northeast is close at hand."
NEB_main_story_events.20.t: "Brand New Look"
NEB_main_story_events.20.d: "During his time working at the Northeast Bureau, Zhou Baozhong gained a new understanding of the overall situation of the Northeast Bureau.\n\nThe Northeast Bureau has now opened up vast base areas in the Northeast, and base areas in Outer Northeast have also been partially restored. Production has recovered and is thriving. The Northeast Bureau has also rebuilt the intelligence network. Any slight movement in the Northeast results in a report appearing on the Northeast Bureau's desk the next day.\n\nRecalling the last time he came to the Northeast Bureau, he was there to listen to explanations about the Hailar Fortress. Now he no longer needed to think about how to capture that fortress. The connections between the east and west sides of the Greater Khingan Range had been cut, and the enemy's telegraph codes had been deciphered. Once the order was given, the fortress would return to the hands of the people in the form of an uprising. Zhou Baozhong had originally been the Second Deputy Secretary of the Northeast Bureau, but his focus was on army building. After becoming Second Secretary, he also had to take on political work.\n\nFirst Secretary Li Zhaolin and First Deputy Secretary Liu Yalou had also provided a lot of help. When some PLA comrades came to work at the Northeast Bureau, they gave many introductions about the work.\n\nAfter signing the last document of the day, Zhou Baozhong returned to the dormitory. Li Zhaolin had already been waiting for a while.\n'How do you feel?'\n'Not bad. Although I'm not yet very proficient in the work, the comrades are very friendly and have taught me a lot. Old Li, you've done quite well in the Northeast.'\n'Stop praising me. There is still a lot of work to do. As for you, don't wear yourself out. Don't try to fool me. We've worked together for many years — don't I know you?'\n\nZhou Baozhong could only smile bitterly. Because Li Zhaolin had indeed predicted him correctly, he said helplessly, 'I know, I know. You can rest assured about that!'"
NEB_main_story_events.20.o: "“I hope tomorrow will be a good day.”"
NEB_main_story_events.21.t: "A Good Man"
NEB_main_story_events.21.d: "Thanks to his forty years in the Northeast Anti-Japanese United Army, Zhou Baozhong not only maintained excellent relations with his Korean comrades but also enjoyed quite good relations with his former Soviet comrades. Moreover, he was one of the few officers in the People's Liberation Army proficient in both Russian and Korean. This outstanding graduate of the Yunnan Military Academy had a truly magnificent and eventful life.\n\nAs a young man, he was determined to serve his country, yet was mocked by the times. After joining the Communist Party of China, Zhou Baozhong was transferred to the Northeast, where he became one of the main leaders of the Northeast Anti-Japanese United Army. As the struggle grew increasingly brutal, the important positions he held rose higher and higher. After Yang Jingyu's death, the Anti-Japanese United Army gradually withdrew into the Soviet Union. Zhou Baozhong partnered with Li Zhaolin to jointly lead the Northeast Anti-Japanese United Army, which included Chinese, Soviet, and Korean personnel. They formed the Teaching Brigade and established the Anti-Japanese United Government. Whether it was the meticulous planning during the major Japanese offensive on Vladivostok or the orderly command of the Soviet Red Army's retreat in Khabarovsk, the tumultuous first half of his life forged Zhou Baozhong's bold yet meticulous style of action and his friendly, kind attitude toward others.\n\nKim Il-sung had a good relationship with Zhou Baozhong. When recommending a candidate for Second Secretary, Kim Il-sung wrote: “During our days in the Anti-Japanese United Army, Army Commander Zhou more than once told me that the policies toward Koreans at that time had been problematic. In the new era, Koreans and Chinese should set aside past grievances and fight the Japanese together. With his help, I once again established good relations with the Chinese comrades. It can be said that without Army Commander Zhou, there would be no Kim Il-sung of today.” Kim Il-sung also remembered that when the United Government was being established, he was recommended by Zhou Baozhong to serve as a staff officer in the Sino-Soviet-Korean Joint Command. Zhou Baozhong's reason for recommending him was simple: in that era when capable personnel were extremely scarce, Kim Il-sung was one of the relatively young senior officers among the few Koreans. In fact, Zhou Baozhong had recommended several other Koreans as well—Kim Il-sung was merely one of them. Yet for a young battalion commander like Kim Il-sung to be brought into the staff ranks, perhaps Zhou Baozhong truly saw some special ability in him. But what exactly that ability was, only Zhou Baozhong himself knew.\n\nSeryozha was an ordinary Soviet Red Army soldier who also had a very good relationship with Zhou Baozhong. When recommending a candidate for Second Secretary, Seryozha wrote: “I met Army Commander Zhou in Khabarovsk. At that time, the Japanese were attacking Khabarovsk, and I was assigned to serve under his command. Khabarovsk was on the verge of falling, and my unit had suffered repeated defeats, with low morale. I didn't yet understand Army Commander Zhou's capabilities and felt he was quite pitiable—a victim forced to shoulder responsibility. But I was wrong. After arriving at the position, Army Commander Zhou addressed us in somewhat halting Russian, saying that this was not defeat, but a necessary setback on the road to victory. We were all sparks of fire, and as the commander, he would never abandon us. Under his command, we never lost another battle and successfully withdrew from Khabarovsk. From then on, I held Army Commander Zhou in great admiration and learned a great deal of military knowledge from him.”\n\nWhether Chinese, Soviet, or Korean, their evaluation of Zhou Baozhong was very simple."
NEB_main_story_events.21.o: "A Good Man"
NEB_main_story_events.22.t: "A Heaven-Born Genius"
NEB_main_story_events.22.d: "Liu Yalou, who had studied in the Soviet Union, was undoubtedly one of the few high-level intellectuals in the Northeast Bureau. During his studies at the Frunze Military Academy, he overcame severe language barriers and completed his education. However, in the very year he finished his studies, he was suddenly transferred to the Far East. Afterward, Liu Yalou was never able to reestablish contact with the Party Central Committee. Although he could not return to the Central Committee to continue the war of resistance, he arrived at a brand-new front—the Northeast. He had originally hoped to meet comrades like Yang Jingyu and Zhao Shangzhi in the Northeast Anti-Japanese United Army—men who struck fear into the enemy—but what he received instead was news of their deaths. To make matters worse, the Soviet Union suddenly collapsed. Upon first meeting Li Zhaolin and Zhou Baozhong, Liu Yalou stared blankly at the chaotic Far East. How much longer could the Northeast Anti-Japanese United Army hold out?\n\nIn this moment of crisis, Liu Yalou realized that the Northeast resistance was entering a new stage. With the collapse of the Soviet Union causing chaos in Far East administration and communications severed with the Supreme Soviet, the Far East desperately needed a stabilizing force. He urgently discussed the matter with Li Zhaolin and they decided to establish the Northeast Anti-Japanese United Government. Coincidentally, Li Zhaolin had the same idea. The two immediately contacted various military forces and established the Northeast Anti-Japanese United Government in Vladivostok to unify administration of Far East affairs. This fragile government was a mixture of all sorts of people, and Li Zhaolin and Zhou Baozhong found it difficult to coordinate. Thus, the heavy responsibility of personnel management fell on Liu Yalou's shoulders. However, Liu Yalou immediately demonstrated the talents of a political commissar. In just one month, he successfully contacted all Red Army units and grassroots regimes in the Far East, basically stabilizing the situation.\n\nJust as the Northeast Anti-Japanese United Army was preparing to recover its strength and actively resist the Japanese, it suffered another major Japanese offensive. Liu Yalou had intended to actively contact the Supreme Soviet but was forced to suspend those efforts. The unprepared Northeast Anti-Japanese United Army and Soviet Red Army suffered an unprecedented defeat, and the Japanese easily occupied most of the Far East. During the retreat, unit formations were shattered and communications severed. Liu Yalou used every possible method to regroup the troops and dispatch liaison personnel, thereby salvaging part of the losses.\n\nToday, Liu Yalou, who has become the Second Secretary of the Northeast Bureau, is widely acknowledged as the right person for the job. With the help of the Party Central Committee, the Northeast Anti-Japanese United Army has not only successfully regained its strength but will also serve as the vanguard in the liberation of the Northeast. Looking at the map, Liu Yalou drew two lines of attack along the Chinese Eastern Railway. This was the grand envelopment operation he had been pondering for a long time, and it coincided perfectly with Chairman Mao's strategy. Although he had not commanded for quite some time, the art of war in his mind once again allowed him to construct a perfect battle plan."
NEB_main_story_events.22.o: "Taking Command in a Time of Crisis"
NEB_main_story_events.23.t: "Great Calamity Approaches"
NEB_main_story_events.23.d: "On the streets and alleys of Xinjing, newspaper boys held newspapers in their hands and shouted loudly: “Extra! Extra! The Chinese Communist Party refuses the Empire of Japan’s peace negotiations! Extra! Extra! The Chinese Communist Party refuses the Empire of Japan’s peace negotiations!”Old Liu picked up a torn, newly published newspaper from the ground. He carefully read the large headline: “The CCP Rejects the Empire of Japan’s Peace Negotiations; Red Bandits Have Launched an Offensive Against Manchukuo.”\n\nOld Liu gave a cold laugh. He recalled his own family: his wife, who had been taken away to become a comfort woman, had already died with deep resentment; his eldest son, forcibly conscripted, was now on the southern front line; and his second son, whom he had no choice but to send away, had disappeared without a trace after entering the Greater Khingan Mountains. Now Old Liu was all alone, barely surviving thanks to the help of his neighbors.“Retribution, retribution, this is retribution!” Old Liu shouted agitatedly in the busy market. “This is your retribution!”Laughing wildly toward the sky, he completely ignored the Japanese military police who pinned him to the ground. Of course, he also couldn’t see the Japanese officer in the distance slapping a policeman across the face. He only felt that the sky was about to brighten, that the long night was finally coming to an end, and that the demons and monsters of the Land of the Rising Sun were about to be dispersed by the true sun.\n\nAt that moment, in his daze, he seemed to hear the Japanese officer wearing a military cap in front of him say something in a foreign tongue. The translator beside him spoke a few words: “Why… You… disturbing the public?”Old Liu sneered: “Disturbing the public? Yes, disturbing the public. You beasts, what the hell are you doing here disturbing the people?”Old Liu stared fiercely at the Japanese officer in front of him. The translator seemed to say something else, but no matter what he said, the Japanese officer suddenly pulled out a black muzzle from his chest. Old Liu looked at that dark hole and said: “Come on! These old bones of mine aren’t worth anything anyway. Come on!”\n\nThe seemingly even more enraged Japanese officer was about to do something when several other Japanese people suddenly stopped him. In a hazy state, Old Liu saw a Japanese officer holding a samurai sword say something, and then he was pressed to the ground by the Japanese military police. Finally, a gunshot rang out, piercing the sky."
NEB_main_story_events.23.o: "Japan Once Again Owes a Blood Debt"
NEB_main_story_events.24.t: "Fierce Tiger Descends the Mountain"
NEB_main_story_events.24.d: "At the Hailar Fortress, several Japanese officers were idly sharpening pencils. These Japanese officers had long been secretly won over by the Northeast Bureau. The moment they learned that the puppet government in the south had collapsed, they immediately realized that the People's Liberation Army's next offensive target would be the Northeast — and the beginning of the liberation of the Northeast would undoubtedly be this massive fortress. They had a very strong premonition that contact would be made very soon.\n\nAt this moment, a messenger entered the officers' office and reported: “Reporting, Colonel! A letter has arrived from the east.”The Colonel took the letter, slapped the table in delight, and said: “It seems Captain Wang Minggui's detachment is coming. Looks like they're preparing to launch an uprising.”\nThe Colonel rushed out of the bunker, only to see Wang Minggui — former Commander of the Third Detachment, Third Route Army of the Northeast Anti-Japanese United Army, and now Commander of the Hailar Fortress Detachment — already standing on the Henan Terrace position. A standard-issue People's Liberation Army pistol was tucked at his waist. Behind him stood soldiers of the People's Liberation Army, all holding rifles, wearing green uniforms, and donning caps with red five-pointed stars.\n“Captain Wang, thank you for your trouble,” the Colonel said as he removed his cap and respectfully presented his samurai sword.\nWang Minggui accepted the samurai sword, then took out a cap and said: “Let's go. Come with me to liberate our homeland.”\n\nThe Colonel put on the green military cap bearing the red five-pointed star, saluted Wang Minggui, and declared: “Captain Wang, the Hailar Fortress hereby responds to your army's call today and announces its uprising! We return this sacred territory to the Chinese people!”\n\nWang Minggui walked to the radio station at the Henan Terrace position and reported to Li Zhaolin and Zhou Baozhong that the fortress was about to rise up. Li Zhaolin and Zhou Baozhong immediately issued the order to transmit the uprising telegram. As the radio waves of the Hailar Fortress Uprising spread across the vast Northeast, the People's Liberation Army's 38th Army set out from Zhalantun, crossed the Greater Khingan Mountains along the railway line, and launched an all-out offensive toward Qiqihar. At the same time, the guerrilla forces in Outer Northeast to the north quickly responded, crossing the wide Heilongjiang River and stepping onto their homeland, which they had lost for nearly forty years.\n\nNortheasterners have courage and backbone. Northeasterners are also kind-hearted. Northeasterners deeply miss their homeland! Today, they will bring liberation to their motherland's soil!"
NEB_main_story_events.24.o: "The road home is right before our eyes."
NEB_main_story_events.25.t: "Beginning and Ending"
NEB_main_story_events.25.d: "Sasaki shivered as he hid in the cabinet. The deafening sound of gunfire and artillery was far away, but the footsteps of the search for Japanese bureaucrats were close at hand. Sasaki really did not understand. The Emperor had already announced that the war was completely over — why were the Chinese still attacking? Moreover, Manchukuo was not Chinese territory — why were the Chinese launching an invasion? Suddenly, the cabinet was opened. Several women holding guns pinned Sasaki to the ground. Sasaki struggled in panic, but it was useless. He shouted desperately in Japanese: '放す！放す！(Let me go! Let me go!)'\n\n'Open your dog eyes and look carefully. Who am I?'\n\nAlthough Sasaki did not understand Chinese very well, he barely understood this sentence. He looked closely and saw it was a Chinese woman. He looked around and realized there was not only her — there was also a girl who looked Russian and a young Korean girl beside them. Sasaki hurriedly knelt down, kowtowing repeatedly, saying: 'Spare me, spare me!' But his poor Chinese was really bad. The woman shook her head repeatedly, signaling the girl and the young woman. The three tied Sasaki up. The young woman said in clumsy Japanese: '逃げるな。(Don't even think about escaping.)' Her cold tone scared Sasaki so much he almost stopped breathing. Then the Chinese woman led the other two away.\n\nThe desperate Sasaki originally thought someone would come to save him and take him back to his big villa in Tokyo with wine. However, when he heard the door open again, the smiling Sasaki did not see any Japanese holding samurai swords. What he did not know was that here, no Japanese would come to save him."
NEB_main_story_events.25.o: "Your sins cannot be forgiven even by ten thousand deaths."
NEB_main_story_events.26.t: "Return"
NEB_main_story_events.26.d: "Li Zhaolin, Liu Yalou, and Zhou Baozhong stood at the top of Dadinzi Mountain, looking toward the city that had finally regained its name lost for forty years.\n\n'Finally, we're back,' Li Zhaolin said.\n\n'Yes, we're back,' Zhou Baozhong, whose hair had already turned white, said with gratification.\n\n'So this is what the Northeast looks like,' Liu Yalou sighed.\n\nFrom the Greater Khingan Range in the west to Haishenwai in the east, from Shanhaiguan in the south to Hailanpao in the north, from snow-covered mountains to dense coniferous forests, from unfathomable depths to towering heights — from 1931 to 1972, the Northeast's struggle against Japanese colonial rule lasted a full forty-one years. Forty-one years — nearly half a century; forty-one years — nearly a generation; forty-one years — a number close to the length of a marathon. The people of the Northeast have finally walked out of the long night. The people of the Northeast are no longer slaves of a conquered nation. The people of the Northeast can finally go home! But it is not only the people of the Northeast. The Koreans are continuing the struggle for the liberation of their motherland. The former Soviets are waiting to return home. The recovery of Taiwan is still uncertain. There is still much work to be done in the future, but today, let us raise a glass to the liberation of the Northeast!"
NEB_main_story_events.26.o: "The great §xChinese Nation's War of Resistance Against Japan§! began with §xNortheast§! and also ended with §xNortheast§!."
NEB_main_story_events.27.t: "Going Home"
NEB_main_story_events.27.d: "The Chinese Communist Party crushed the Republic of China government with the force of thunder, and then declared war on Japan, launching the Third Anti-Japanese War. Affected by this, the Japanese in Haishenwai fell into chaos. Tokugawa was also at a loss. He very much wanted to return to Tokyo to avoid the war, but the port of Haishenwai had long been shut down.\n\nWhile Tokugawa was still thinking of a way, his secretary came to him and said there was still one ship that could return to Japan, and asked if Tokugawa wanted to go back.\n\nBut when the opportunity was right in front of him, Tokugawa hesitated again. Because returning to Tokyo was only to avoid the war. Even if he returned to Tokyo, it was hard to say he would not be drawn into political storms again. He had long seen Japan's corruption and incompetence. Wasn't it precisely because he didn't want to stay in Tokyo that he had come to Haishenwai? Going back now might involve him in things he didn't want to get involved in. On the contrary, looking at the people in the current Haishenwai government, they not only managed Haishenwai in an orderly manner but also brought him some achievements. Joining them was also a good choice.\n\nAfter weighing his options repeatedly, Tokugawa said:"
NEB_main_story_events.27.o: "“Do you know anyone from ‘Xixipi (CCP)’?”"