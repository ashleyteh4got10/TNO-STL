communist_northeast_thought_subtype_desc: "Since the Japanese invasion of the Northeast in 1931, the Chinese Communist Party has held high the banner of resistance against Japan and waged an extremely arduous struggle on this vast black soil. The fighters used white snow as blankets, stone caves as houses, forests as homes, and wild grass as food. Under the leadership of the CCP Party Committee, batches of anti-Japanese heroes emerged from the Northeast Anti-Japanese United Army. However, since the collapse of the Soviet Union and the merger of Nanjing and Chongqing, the Northeast Anti-Japanese United Army has gone from one desperate situation to another. To this day, the Northeast has been under the iron hoof of the Japanese invaders for thirty years. Homes and country are gone, revival seems hopeless, and the long night appears endless. But fortunately, the victory at Tongguan in the south has signaled the defeat of Japanese ambitions. The spark still remains, and hope still exists."
