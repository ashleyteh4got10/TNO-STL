 SWRWTER_tfoa_CPC_name: "£TNO_game_rule_flag_CPC §xEast Asian Great Revolution§!"
 SWRWTER_tfoa_CPC_DESC: "As, in the East Asian Great Revolution, the scales of victory gradually tip toward the §xCommunist Party of China (CPC)§!, the Republic of China can no longer resist the torrent of the people's army from the §xCommunist Party§!. But the watchful §jCo-Prosperity Sphere§! will not sit idly by as the China it painstakingly cultivated falls into the hands of the §xCommunist Party of China (CPC)§!."
 SWRWTER_tfoa_CHI_name: "£TNO_game_rule_flag_CHI_ROC §iEast Asia's Errant Path§!"
 SWRWTER_tfoa_CHI_DESC: "As, in the War of Pacification, the scales of victory gradually tip toward the §iKuomintang (KMT)§!, the §xCommunist Party of China (CPC)§!, which had resisted for many years, finally collapses along with its §mNational Defense§!§V Front§! regime, and the §xCommunist Party of China (CPC)§! retreats to Xinjiang. §jJapan§! is only too delighted to see this situation. What the outside world does not know is that a §etiger§! has been §iawakened§!."
 SWRWTER_Ma_HuShan_conspiracy_name: "£TNO_game_rule_flag_CPC §LMa Hushan§!'s §qConspiracy§! §CEnding§! (AI only)"
 SWRWTER_COMPLETELY_DONE: "§LConspiracy§!§GFully Exposed§!"
 SWRWTER_COMPLETELY_DONE_DESC: "§LMa Hushan§!'s §qconspiracy§! has been §Gfully exposed§!, and £TNO_game_rule_flag_CPC §mwe§!§V§! have clarified the situation in Khotan. The demise of §fSheng Shicai§!'s §Jreactionary puppet government§! §xis imminent§!!"
 SWRWTER_Ma_HuShan_conspiracy_default: "Random AI"
 SWRWTER_Ma_HuShan_conspiracy_default_DESC: "Amid layers of fog, our investigation into §LMa Hushan§!'s §qconspiracy§! has yet to yield any leads; liberating Xinjiang from §fSheng Shicai§!'s §Jreactionary puppet government§! and sweeping away the unfavorable situation in Khotan has become our foremost task. The journey to liberate Xinjiang will step into §xthe unknown§!."
 CPC_outer_mongolia_status: "£TNO_game_rule_flag_CPC §mOuter§!§V Mongolia§!'s §CFate§! (AI only)"
 CPC_outer_mongolia_default: "Random Path"
 CPC_outer_mongolia_default_DESC: "£TNO_game_rule_flag_CPC §mInner and Outer§!§V Mongolia§! will follow the §Sguidance of the New Order§! on its §Cjourney§!, stepping into §xthe unknown§!."
 CPC_outer_mongolia_cpc: "§GIncorporated into the§!§mNational§!§V Defense Front§!"
 CPC_outer_mongolia_cpc_DESC: "£TNO_game_rule_flag_CPC §mInner and Outer§!§V Mongolia§! will be incorporated into §mthe National§!§V Defense Front§!, seeking a longer-term future"
 CPC_outer_mongolia_fed: "With §mthe National§!§V Defense Front§! establish a §mFederal§!§V Republic§!"
 CPC_outer_mongolia_fed_DESC: "£TNO_game_rule_flag_CPC §mOuter§!§V Mongolia§! will establish a republican union with §mthe National§!§V Defense Front§!, seeking a longer-term future."
 CPC_outer_mongolia_mon: "§VEstablish Independence§!"
 CPC_outer_mongolia_mon_DESC: "£TNO_game_rule_flag_CPC §mOuter§!§V Mongolia§! will establish independence and seek a longer-term future together with the Asian Revolutionary League."
 CPC_outer_mongolia_war: "§xAbandon Illusions, Prepare for Reunification by Force§!"
 CPC_outer_mongolia_war_DESC: "£TNO_game_rule_flag_CPC After the breakdown of Sino-Mongolian talks, §mthe National§!§V Defense Front§! decided to abandon illusions and §xunify Mongolia by force§!, establishing a more stable autonomous ethnic region."
 SWRWTER_lake_baikal_civil_war_name: "£TNO_game_rule_flag_BRY £TNO_game_rule_flag_IRK Lake Baikal Civil War"
 SWRWTER_lake_baikal_civil_war_default: "Random AI"
 SWRWTER_lake_baikal_civil_war_bry_name: "£TNO_game_rule_flag_BRY Victory of Idealism"
 SWRWTER_lake_baikal_civil_war_bry_DESC: "As the last bullet by Lake Baikal flew toward Heinrich Yagoda, the £TNO_game_rule_flag_BRY Buryat Soviet Socialist Autonomous Republic, led by Valery Sablin, successfully defeated the Presidium of the Supreme Soviet, sweeping away Yagoda's oppressive rule and practicing on both shores of Lake Baikal the 'idealism' he believed correct. Even so, its road to unifying the Soviet Union will not be smooth."
 SWRWTER_lake_baikal_civil_war_irk_name: "£TNO_game_rule_flag_IRK Triumph of Pragmatism"
 SWRWTER_lake_baikal_civil_war_irk_DESC: "As the last bullet by Lake Baikal struck Valery Sablin, Heinrich Yagoda declared that £TNO_game_rule_flag_IRK the Presidium of the Supreme Soviet had successfully suppressed the rebel forces led by Sablin, continuing to practice the pragmatism he believed correct on both shores of Lake Baikal. Even so, its road to unifying the Soviet Union will not be as smooth as suppressing the rebellion."

