 Eurasia_National_Revolutionary_League: "Eurasia National Revolutionary League"
 ANRL_Leader_SOV: "Leader of the European Anti-Fascist Revolution"
 ANRL_Leader_SOV_desc: "Core Territory Defense: §G+10%§!\nSurrender Limit: §Y100%§!\n\nAfter the Russian land was trampled under the iron hooves of German fascism, it was divided for over thirty years. Finally, nearly thirty years after the dissolution of the Soviet Union, Russia was reunited under a single red flag. Now, the newborn Russia is preparing to launch a third war against Germany to reclaim its ancestral lands.\n\nHowever, the anti-fascist cause is not smooth sailing. Russia's own strength alone cannot defeat Nazi Germany. The new states born from the fire of revolution need to unite as one to resist the ever-imminent invasion of global imperialism. The Communist Party of China (CPC) in the East gathered the communist parties of Asian nations in Vietnam, jointly signing the 'Hanoi Agreement' and founding the Asian National Revolutionary League; after the signing of the 'Sino-Soviet Treaty of Friendship, Alliance and Mutual Assistance', the Soviet Union formally joined the league, and the 'Asian National Revolutionary League' was thereby renamed the 'Eurasia National Revolutionary League'.\n\n§x'All countries and peoples subjected to imperialist aggression, control, interference and bullying, unite! Overthrow our common enemy!'§!"
 ANRL_Leader_SOV_effect: "[!ANRL_Leader]"
 RUS_CPC_treaty_of_friendly: "'Sino-Soviet Treaty of Friendship, Alliance and Mutual Assistance'"
 RUS_CPC_treaty_of_nap: "'Sino-Russian Non-Aggression Pact'"
 RUS_cpc_supports: "To Beijing"
 RUS_cpc_supports_desc: "In the East, our Chinese comrades overthrew the oppression of Japanese fascism and successfully completed the people's revolution. Therefore, we will establish friendly relations with our Chinese comrades in order to learn from their revolutionary experience."
 RUS_have_a_talk_with_cpc: "Look to the South"
 RUS_have_a_talk_with_cpc_desc: "The Communist Party of China (CPC) has successfully seized the East Asian countries from the Japanese. Now China has completed its reunification, and most of the countries of Southeast Asia are also within the CPC's sphere of influence. In this situation, if we wish to retake the Far Eastern regions occupied by China, we had best earnestly inquire as to the Chinese government's stance."

 CPC_RUS.1.t: "Guests from the North"
 CPC_RUS.1.desc: "A green military car slowly drove into the courtyard of Zhongnanhai, with several Soviet diplomats in dark clothing and stern expressions seated inside. The car doors opened, and the diplomats stepped out one after another, picking their way with difficulty past those solemn red walls and ancient trees toward Zhu De's office building. Though no words passed between them, the tension hanging in the air already bespoke the importance of this meeting. Alexander Vasilyevich was the leader of this delegation. After entering the reception room, his eyes swept across and landed on Chairman Zhu. Chairman Zhu had long since taken his seat by the desk, wearing a Sun Yat-sen suit, his brow betraying a fortitude and depth tempered by the years. Though he was advanced in age, his eyes were still full of wisdom and foresight. With Zhu were several senior CPC leaders, ready to listen to the diplomatic proposal from the Soviet Union. Vasilyevich and the other diplomats bowed together in respect. Then Vasilyevich straightened up and began this momentous conversation.\n'Chairman Zhu,' Vasilyevich's tone carried a trace of reverence, 'we in the Soviet Union know full well that, with the world order undergoing dramatic change today, China is our most important strategic partner. As you know, German fascism threatens not only the security of Europe but the peace of the entire globe. We hope to receive China's help in resisting this evil force together.' Zhu De slowly raised his head, his voice still calm and strong: 'Comrade Alexander, we understand the Soviet Union's predicament, but China too has endured long wars and hardships; our foundations must be more secure before they can support the country's future. Cooperation can be discussed, but it must be built on mutual respect and equality.' Vasilyevich nodded immediately, not a trace of hesitation in his expression. He knew that China's independence and dignity were the first element of their diplomatic strategy. 'Of course, Chairman, we fully understand your position. We have no wish to see China lose its independent right of choice at any time,' Vasilyevich emphasized. 'The goal of us Soviets is very clear — to utterly end the forty-year tyranny of fascism and defend the socialist camp. And in this process, we hope to have China's support.' Zhu De fell silent for a moment, seemingly pondering the feasibility of this proposal.\n'Your goals align with our Chinese position. We too oppose fascism and support the liberation of all peoples,' Zhu De's voice rang out forcefully, 'After the war, the order of Asia must be led by the Asian peoples themselves; we do not wish to see any great power attempt to oppress us in this region.'\n'We understand that perfectly, Chairman,' Vasilyevich said earnestly, 'The Soviet Union will never seek to alter the status quo in Asia. Our goal has always been to fight fascism alongside China and to establish a fairer and more just international order after the war......'\nIn the ensuing conversation, the two sides engaged in in-depth discussion on issues such as military cooperation, territorial sovereignty and resource allocation. On territorial matters, the Soviet side stated that Tannu Tuva and the Soviet-occupied parts of Outer Mongolia would be returned to China; regarding the Outer Northeast, the Soviet Union would renounce its claims and respect China's territorial integrity. As the talks deepened, the two sides finally reached a preliminary cooperation framework — China would dispatch volunteer armies to support the Second West Russian War, while the Soviet Union would provide advanced military technology and material support. At the same time, the two sides also agreed on plans for future economic cooperation and cultural exchange, ensuring that the two countries would establish long-term and mutually beneficial relations after the war.\nAs the meeting drew to a close, Zhu De stood up, nodded to Vasilyevich, his voice still gentle and firm: 'China is willing to contribute to global peace. We hope that on this path, we and the Soviet Union can always advance side by side.' Vasilyevich bowed deeply, his tone sincere: 'Chairman, we believe that under your leadership, Sino-Soviet cooperation will not only end fascist tyranny but bring a more just and peaceful order to the future world.' The diplomats left Zhu De's office, all of them knowing in their hearts that today's meeting was not merely a diplomatic exchange — it marked that the two great powers best representing the socialist camp had, at last, found the road of cooperation before a common enemy."
 CPC_RUS.1.o: "The world of the future may well become different because of this historic decision."
 CPC_RUS.2.t: "Guests from the North"
