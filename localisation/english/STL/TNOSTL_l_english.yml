 PRR_Grigory_Isayev: "Grigory Isayev"
 POLITICS_PRR_GRIGORY_ISAYEV_DESC: "Until Russia's reunification, Grigory Isayev was merely an ordinary technician and engineer. That was until he met Alexey Razlasky, a petroleum engineer at the same plant — Alexey Razlasky, well-read in the classics of Marxism and deeply interested in the communist movement unfolding in China.\n\nAfter finding common ground, the two immediately began printing pamphlets in bulk and distributing them to their colleagues, winning over quite a few people. They called themselves the 'Workers' Center', published 'The Second Communist Manifesto', and successfully staged a strike at the Maslennikov Factory, contributing to the Russian workers' movement; in the eyes of the Russian proletariat, his standing gradually rose.\nHe had thought that he and the Russian working class following him lacked the strength to seize revolutionary victory in a short time. Not long after, the Sino-Russian War ended in Chinese victory, and China decided to establish provisional governments in Central Siberia and the Far East of Russia. At this point, he actively roused workers across Russia in the 'Workers' Center' movement, and Isayev and Razlasky gradually became known to the Russian people.\n\nIn the end, at the reorganized Council of Ministers, he was successfully elected Chairman of the Council of Ministers, while Razlasky was elected First Vice Chairman of the Council of Ministers. The two understood that on land trampled by the former Russian government, only by persisting in putting workers and peasants at the center and the masses at the center could a socialist society truly be built and People's Democracy correctly implemented."
