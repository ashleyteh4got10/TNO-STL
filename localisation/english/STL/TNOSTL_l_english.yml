'China is willing to contribute to global peace. We hope that on this path, we and the Soviet Union can always advance side by side.' Vasilyevich bowed deeply, his tone sincere: 'Chairman, we believe that under your leadership, Sino-Soviet cooperation will not only end fascist tyranny but bring a more just and peaceful order to the future world.' The diplomats left Zhu De's office, all of them knowing in their hearts that today's meeting was not merely a diplomatic exchange — it marked that the two great powers best representing the socialist camp had, at last, found the road of cooperation before a common enemy."
