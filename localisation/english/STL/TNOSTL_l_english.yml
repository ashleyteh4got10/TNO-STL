 #Eastern Uprising
 CHI_dem_riot_gui: "Eastern Riots"
 CHI_dem_riot_gui_desc: "While we devote ourselves to §Gdevelopment and biding our time§!, some citizens who wish to see China independent again from beneath the rising sun have not sat idly by — ever since the §YYasuda Crisis§!, the Communist Party of China (CPC) has secretly supported, in places such as §YGuangxi and Beiping§!, the stirring up of §Criots§!; although in the end they were §xsuppressed§! by us, scattered protests still §Ycontinue§! and have §Ggrown ever stronger§! amid the recent domestic and international turmoil — represented by the three cities of §YBeiping, Wuhan and Leizhou§!, the §CEastern Riots§! are spreading, and before we formally tear off the mask with Japan, it is necessary for us to continue to §Ysuppress§! them."
 CHI_dem_riot_gui_tt: "-§RStrength§!\n---------------\nEvery §Cinsurgent region§! has its own §Rstrength§!, representing their ability to §Yresist suppression by the central government§!; this strength will §Rslowly decline§! over time. If a region's strength §Rfalls below§! §Y30%§!, we can §Rlaunch suppression operations directly§!.\nWe will suppress the §Crioters§! through a series of operations, weakening their §Rstrength§! and that of the red bandits behind them.\n\nOnce all three regions are §xfully suppressed§!, the §Ydisillusioned people of the East§! are highly likely to adopt toward the Communist Party of China (CPC)'s §xliberation operations§! a §Rindifferent attitude§!, allowing us to better complete the Fifth Modernization.\n\n-§GRadicalism§!\n---------------\nEvery §Cinsurgent region§! has its own §Gradicalism§!, representing how radical their §Ydemocratic demands§! are. Although we can use §Yintelligence networks§! to §Gweaken§! these regions' §Rstrength§!, this will correspondingly §Yfuel§! their §Gradicalism§!. If the §Raverage radicalism§! of the three regions exceeds §Y50%§!, they will act on their own, convening the §mNational Affairs Conference of the Republic of China§! in Shanghai, and §Rno longer cooperate with§! the Communist Party of China (CPC)'s democratic proposal to convene the §GChinese People's Political Consultative Conference§! in Xi'an.\n\n— Although for §Rthe cause of pacification§!, §Yboth conferences§! will become §Gstepping stones§! for the Communist Party of China (CPC) to win the war, for §xthe CPC§! the §GCPPCC§! will bring greater help to their §Rwar effort§!, while the National Affairs Conference will make them an isolated force."
 CHI_dem_riot_failure: "Eastern Riots Quelled"
 CHI_dem_riot_failure_desc: "All rioting forces in the East have been suppressed.\n\nNow the people of the East have lost patience with the CPC and are no longer willing to cooperate with their other actions — our future war of pacification in the Northwest will gain a great advantage."
