 #menu_tooltips
 STL_version_intro_tt: "§LThe Sea Surges§!\n\n§LThe Sea Surges§! originally referred to great upheavals across the land and the trembling of mountains and rivers, and gradually became a byword for the torrent of the era. In turbulent times, rivers change course, heaven and earth shift places, the old world rises and falls amid towering waves, and a new world is gestated amid the gathering of winds and clouds. In Mao Zedong's 'Shuidiao Getou: Swimming', the line \"§L a stone wall rises on the western river, cuts off the clouds and rain of Mount Wu, and a flat lake emerges from the high gorges §!\" endowed this torrent with new meaning — that man can not only follow history, but shape it with his own hands, channeling the surging era into a course belonging to the people.\n\nCorresponding TNO version: §OContemporary Tordesillas§! - Ver.1.10.x"
 STL_version_intro_tt_delayed: "§FSince ancient times, people have always believed history to be like a river, able only to flow downstream; yet what truly drives the torrent of history rolling forward is the people within the vast river. The sea surges, stirring mountains, rivers, lakes and seas, washing out the fate of an era.\n\nThe end of the Second World War did not bring true peace. §qGermany§!, §eJapan§!, and their followers carved up Eurasia, planting the fascist flag across the old world. The flame of revolution was pressed into ashes by steel and violence; freedom, justice and equality dwindled into faint words among towering mountains. The powers declared that the new order they created would last a thousand years; the end of history was but an epitaph written by the victors for the vanquished.\n\nYet no river can remain still forever, nor can any empire truly freeze history. Steel can suppress resistance but cannot extinguish faith; high walls can separate the people but cannot halt the era. From among the mountains of §RChina§! to the boundless frozen soil of §SRussia§!, there are always those who guard that faint spark in the darkness. They may not know one another, may never witness the dawn in all their lives, yet they always believe: someone will take up the flag from the fallen, and one day the old world will meet its own dusk.\n\nAt last, some crossed the snowfields and planted the crimson flag back in Moscow; some emerged from the mountains and let the five stars shine once more upon the divine land. The two rivers once ten thousand li apart finally converge in the lower reaches of history, together washing away the last dam of the old era. The thousand-year empire the fascists prided themselves on was, in the end, but a single wave in the great river of time.\n\nThe rivers still flow, the world still moves forward. A new order will not be made permanent by one victory, nor will the future be decided by one revolution. Yesterday's revolutionaries made today, and today's people will decide tomorrow.\n\nIn days past, the world sank in the surging sea; today, the people ARE that torrent which changes history.§!"
 TNOSTL_menupic_tooltip_1: "§F§RThe Long March§! is truly like iron, yet now we stride forward starting anew.§!"
 TNOSTL_menupic_tooltip_2: "§F§LIf heaven had feeling§!, heaven too would grow old; the right way of the world is vicissitude.§!"
 TNOSTL_menupic_tooltip_3: "§F§OFor there is sacrifice§!, grand aspirations multiply, daring to make sun and moon usher in a new heaven.§!"

 
