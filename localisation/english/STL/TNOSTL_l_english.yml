 STL_CHI_main_story.1.t: "The Sun Shines Bright in Heaven"
 STL_CHI_main_story.1.desc: "It was the first day of the nineteen-seventies. Young students from Tsinghua, Peking University, Fu Jen and other schools, along with a substantial portion of Beiping's citizens, followed the guidance of secret leaflets distributed half a month earlier and came to the Marco Polo Bridge, where they saw a woman nearing forty standing on a makeshift rostrum beside the bridge, holding a white megaphone.\n\n'Friends, fellow citizens, comrades of democracy! This is the early morning of the first day of nineteen seventy, and I stand here to claim a future free from oppression and persecution for our Beiping!'\n\n'You should all remember that seven years ago, our Beiping made enormous sacrifices in its struggle for democracy and freedom — more than three thousand Beiping citizens were arrested without cause, and a full third of them were summarily executed, among them the respected elder of our Citizens' Guild, Mr. Chu Anping, and also Mr. Yu Luoke, who to this day remains missing!'\n\n'That's right! Yu Luoke — wanted for seven years under joint warrants issued by the Republic of China police and the Manchukuo Army — he died right here, died in this very Yongding River!'\n\nThe crowd erupted in an uproar.\n\n'It was right here beside the Marco Polo Bridge that several elders of our Democratic Comrades' Association, risking arrest for violating the curfew, fished the martyr Yu Luoke's body out of the water and buried him on the spot.' Zhang Zhixin's voice grew sorrowful. 'The martyr Yu Luoke's death was truly horrific; I cannot bear to describe it — but his death taught us all a real lesson.'\n\nZhang Zhixin took a deep breath: 'The invaders used their bullets to spill blood, yet they use our blood to water their ambitions!'\n\nThe crowd broke into wave after wave of shouting, but Zhang Zhixin raised her voice still louder through a more powerful megaphone: 'Friends, for forty years the Japanese have kept us shackled with an hourly wage of forty yen! The headquarters of the Japanese running-dog Manchukuo Army has already retreated to Rehe — do we have any reason left to keep obeying their so-called military administration?'\n\nSeeing the crowd roused to a fever pitch, Zhang Zhixin raised her right fist high: 'Down with Japanese imperialism! Drive out the Manchurian invaders! Give us back our free Beiping!'"
 STL_CHI_main_story.1.o: "'Give us back our free Beiping!'"
 STL_CHI_main_story.2.t: "The Yangtze Flows Eastward"
 STL_CHI_main_story.2.desc: "It was early morning in Wuhan. The red-and-white sun passed through layer upon layer of mist over the Yangtze, dyeing the sky beneath the endless stratocumulus crimson. The Yangtze flowed quietly by; the mother river of the Chinese people never ceases. Lu Hong'en and countless Wuhan citizens had not slept all night, holding their breath and listening to the sound of cannon fire drawing ever closer from outside the city. The rumble of cannon reminded Lu Hong'en of the timpani he had heard in the orchestra back in Shanghai. Amid the earth-shaking drums of war, Wuhan would either bow its head once more or proudly earn the right to stand, dusting itself off to reveal its true colors as the first city of the Chinese revolution.\n\nBy morning the cannon fire gradually died down. At noon, the PLA entered the city. Row upon row of gray-green figures, their faces still smeared with dust and blood, looked silently and curiously about this thoroughfare of the nine provinces. When the moment truly came that his and his comrades' efforts bore fruit, Lu Hong'en, walking along the riverbank, felt a little dazed. He thought of the God his family believed in — perhaps there really was such an all-knowing, all-powerful and merciful lord to save China?\n\n'Comrade Lu Hong'en of the People's Justice League?' A greeting interrupted Lu Hong'en's thoughts. It was a PLA officer. His face covered in dust, he straightened his military cap, disheveled from days of fighting, brushed off his uniform, and saluted Lu Hong'en crisply. 'The Party Central Committee is deeply grateful for your work in Wuhan. It is thanks to you and the comrades of the People's Justice League that the PLA could take over Wuhan with minimal losses. With the support of Wuhan's people, we will surely liberate all of China even faster!'\n\n'Liberating China... is certainly fine, but how do you plan to handle Wuhan's current situation? We citizens of Wuhan have resisted for a long time. Granted, the wealth squeezed out by the Gao puppet government now belongs to the people, but as you yourself can see—' Lu Hong'en looked toward the city, 'there are still many people displaced, many who cannot eat their fill or keep warm, many who must beg to survive... What do you plan to do?'\n\nThe PLA officer looked at Lu Hong'en's hands. They were a pianist's hands — slender and long, but callused from the fires of war. 'The purpose of the Communist Party has always been to serve the people. We will do everything in our power to ensure the normal life of Wuhan's people. But there is one other urgent matter — how is production at the Hanyang Arsenal? If it has stopped, can it resume quickly to support the front?'\n\nLu Hong'en choked up. He had keenly caught a discordant note and so did not go on to raise questions about workers' democracy, democratic elections, free speech and free artistic expression. He thought back to his life over thirty years ago, performing in the foreigners' adventurers' paradise. Back then he had none of today's worries and burdens, only music and the question of his next meal to trouble him. Perhaps once China was liberated, he could return to Shanghai and play the piano again."
 STL_CHI_main_story.2.o: "...... all reduced to idle talk"
 STL_CHI_main_story.3.t: "Secret Report from Hainan Province"
 STL_CHI_main_story.3.desc: "President Gao Zongwu:\n\nSince 1968, the communist 'Qiongya Column' has been infiltrating and making contact in places such as Zhanjiang and Leizhou. Today, we suddenly lost contact with the local authorities in Leizhou; Leizhou has publicly declared the establishment of an 'Anti-Persecution Struggle Committee', whose organization is led by Su Shouzhong.\n\nSu Shouzhong, also known as Su Youshi, was born in Guangzhou in 1941. He followed Catholicism and later Buddhism, and in 1959 entered the Fujitsu factory in Hong Kong. After participating in marches and hunger strikes in Central, Hong Kong over the 1963 Li Chunru suicide incident, he was dismissed by Fujitsu and eventually made his way to Leizhou. After long years working at Japanese enterprises, his thinking gradually shifted toward revolution, and he secretly organized the underground group of the Anti-Persecution Committee.\n\nIn response to recent developments in Beiping, Wuhan and elsewhere, Su Shouzhong organized protest marches on his own to 'answer the righteous cause'. The Anti-Persecution Committee has since seized control of the Zhanjiang municipal government building and declared autonomy for the Leizhou Peninsula.\n\nNow the fuse of the eastern riots has been lit; if we do not act, our peace of more than twenty years will be destroyed."
 STL_CHI_main_story.3.o: "Approve the operation."
 STL_CHI_main_story.4.t: "Eastern Riots!"
 STL_CHI_main_story.4.desc: "Recently, large-scale democratic armed riots have broken out one after another in Beiping, Wuhan, Leizhou and elsewhere, threatening to spread like wildfire, and the nearly extinct communist underground organizations have become active again. This is a golden opportunity to round up the communist underground forces in one stroke and strengthen our own power!\n\nNanjing has approved the plan to suppress the eastern riot forces and issued stern warnings to the representatives of the rioters in each eastern city; units of the National Revolutionary Army are standing by outside the three cities. The intelligence services have thrown themselves fully into the work. We must destroy the red bandits, crush the riots, and uphold the Three Principles of the People in China!"
 STL_CHI_main_story.4.o: "Always ready."


# Anti-narcotics in Laos
 #LAO_LPDR.2.t: "Cut Out the Poisonous Weeds"
 #LAO_LPDR.2.desc: "Although the South China Bureau's reports had mentioned it earlier, when the Southeast Asian Revolutionary League's aid team arrived, they were still shocked by the rampant opium cultivation in Laos. The former Royal Lao Army led the way in planting poppies, seizing large tracts of farmland and bringing famine; the senior officers grew fat and bloated while the rank and file were corrupted beyond recognition...... Okay, I can't write any more for now ()"
 #LAO_Legacy_of_Thai_Cambodian_War: "Aftermath of the Thai-Cambodian War"
 #LAO_Legacy_of_Thai_Cambodian_War_desc: "For Laos, sending troops into Cambodia may not be a wise choice. The war will affect the stability and security of numerous border villages. The price of the Thai-Lao War and the Souphanouvong coup is that Laos will permanently lose Japanese aid and its allies in the Co-Prosperity Sphere — but under the tide of the East Asian Great Revolution, these costs can be set aside for now————\n\n§RThere must be a war between imperialism and communism. And Laos has chosen communism§."
# Decisions
 CPC_Mon_Mfn_help_dec: "Aid to Mongolia"
 help_with_mfn_dec: "Support the Mongolian Civil War"
 infrastructure_construction_dec: "Infrastructure Construction Aid"
 infrastructure_construction_dec_desc: "For Outer Mongolia's economy to take another step forward, railway construction must keep pace. Although this requires substantial investment, Outer Mongolia's rich mineral resources are more than enough to cover these outlays. The Ministry of Railways can cooperate with the Mongolian side to establish state-owned mining bureaus one by one, using mining revenues to offset the Ministry of Railways' initial investment."
 CPC_Mon_Mfn_help_dec_desc: "In the current version, this decision is available in normal gameplay (except for the anti-three-disasters path). The decision cooldown is extended to 60 days."
 mine_craft_dec: "Mineral Survey"
 mine_craft_dec_desc: "Through the surveyors' exploration, we have found that Outer Mongolia's mining industry has promising prospects. Perhaps this can serve as an opportunity to further strengthen our ties with Outer Mongolia and provide the National Defense Front with better industrial raw materials."
 fang_san_zai_desc: "'White Disaster', 'Black Disaster' and 'Yellow Disaster' cause immense harm to the grasslands. In Outer Mongolia we should build fodder fields and livestock shelters; improve water conservancy facilities; plant sand-fixing vegetation, fence off and close areas to restore pastures. We should reasonably control stocking rates, implement rotational and rest grazing, improve disaster early-warning and emergency response capabilities, and comprehensively prevent and control grassland disasters."
 fang_san_zai: "Guard Against the 'Three Disasters'"
 TER_new_automatic_dec: "TER Trusteeship Mechanism"
 TER_new_automatic_dec_desc: "In view of the issues many commanders have reported regarding the trusteeship mechanism, member of The Long March development team Tianteng Qianxi has developed supplements and improvements to the trusteeship mechanism, adding the following mechanisms on top of the original:\nThe Northwest Bureau's automatic party-member assignment and priority development of regions below unity level 2; the Southwest Bureau's dynamic development of urban construction and military levels; and for the Xinjiang Bureau, new mechanisms for the expansion of the Anti-Ma Generals' Council and excessively low people's satisfaction.\nMost of these mechanisms have been integrated into the original trusteeship mechanism; you only need to click the button in the upper-left corner of each local bureau's gui interface. The party-member assignment mechanism is separate and, once activated, performs an automatic assignment every ten days. Please note that enabling the mechanism still requires a manual click, but you do not need to click again to re-enable it when adjusting the assignment plan."
