 NEB_Li_Zhaolin: "Li Zhaolin"
 Li_Zhaolin_DESC: "Born amidst the white mountains and black waters, Li Zhaolin witnessed how the Japanese invaders colonized the Northeast. When the Communist Party of China (CPC) organized Anti-Japanese Volunteer Armies in the Northeast, he threw himself into the struggle without regard for his own safety, gradually becoming a core figure in the Northeast's anti-Japanese organizations. After the dissolution of the Soviet Union, Japan seized Outer Northeast China, and Li Zhaolin led the Northeast's Party organizations in continuing the resistance in the even colder Outer Khingan Mountains. But the longer they resisted, the deeper the night grew, and the less the dawn could be seen. The dissolution of the Soviet Union had left the Red Army in the Far East homeless, the liberation of the Northeast seemed indefinitely distant, and Korea's path to restoring its statehood thoroughly hopeless. But Li Zhaolin knew that the darker it got, the more a leader must hold firm to his position; heroes in success are never as precious as heroes in defeat. Li Zhaolin persevered through hardship, until at last, on that day, he saw a flash of lightning in the night - the Japanese army's defeat at Tongguan. Though the situation in the Northeast grew still more unfavorable, Li Zhaolin thereby confirmed once again that Japanese imperialism was, after all, a paper tiger! And so Li Zhaolin made up his mind to carry on and set foot on the road home."
 Li_hero: "Standard-Bearer in Desperation"
 NEB_Liu_Yalou: "Liu Yalou"
 Liu_Yalou_DESC: "Liu Yalou, who had gone to the Soviet Union to study during the War of Resistance against Japan, could never have imagined that he would end up with the Northeast Anti-Japanese United Army. As one of the few who had experienced the Long March, could any adversity possibly be harder than the Long March? Yet the facts nearly shattered Liu Yalou's perception: the environment of the Northeast Anti-Japanese United Army made him fully realize how narrow his own horizons had been. Leaving aside the commonplace shortages of food and clothing and the lack of medicine and medical care, the cold weather was the greatest enemy. In the south, Liu Yalou had never had to contend with the weather, but in the Northeast that was not the case: deep snow was harder to traverse than muddy ground, the low temperatures sapped their strength, and to drive off the cold they had to light fires - which in turn exposed their positions. The days and nights spent with the Northeast Anti-Japanese United Army reminded Liu Yalou of that distant Mountain of Death thirty years before, where the climate had likewise been harsh and blizzards frequent."
 NEB_Zhou_Baozhong: "Zhou Baozhong"
 Zhou_Baozhong_DESC: "Southerners were already rare within the Northeast Anti-Japanese United Army, and Zhou Baozhong was an even rarer sort of southerner among them - a graduate of the Yunnan Military Academy. Zhou Baozhong's experiences could be called a history, a history of the Party - only, that is, up until the September 18th Incident. He should have returned to the Party Central Committee after finishing his studies in the Soviet Union, but the September 18th Incident forced him to change course. Zhou Baozhong obeyed orders and came to the Northeast to organize the people to resist Japan and save the country. But the good times did not last: the Northeast Anti-Japanese United Army retreated again and again, the Soviet Union dissolved, and the Nanjing-Chongqing merger took place. A series of blows left the army in dire straits; the Red Army soldiers in its ranks were homeless and had no choice but to be incorporated into the United Army. And within that swelling force there were Chinese, Koreans, and Soviets alike. Zhou Baozhong realized that the hardest moment had already come, but before the dawn there is always darkness. How much longer would the night last? Though no one knew the answer, it could no longer be far off."
