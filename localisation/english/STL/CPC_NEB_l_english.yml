# History
NEB_history.1.t: "1931 - Manifesto of the CCP Manchuria Provincial Committee on Japanese Imperialist Armed Occupation of Manchuria (Excerpt)"
NEB_history.1.d: "To the toiling masses of workers, peasants, and soldiers: The evil Japanese imperialists have completely occupied Fengtian, Yingkou, Andong, Fushun, Liaoyang, Haicheng, Tieling, Changchun, and many other large and small towns. What a shocking event this is!\n\nThis event did not happen by chance! This policy is the inevitable action taken by Japanese imperialists to realize their 'continental policy' and 'Manchuria-Mongolia policy'! This policy is one by which Japanese imperialists aim to more effectively rule Manchuria, invade Mongolia, and turn Manchuria-Mongolia into a complete colony... Japanese imperialists claim that 'this conflict was caused by the destruction of the South Manchuria Railway by Chinese troops at the Beidaying barracks in Fengtian.' This is completely a lie that not even a three-year-old child would believe!\n\nThe reason Japanese imperialists were able to occupy Manchuria is entirely the result of the surrender of the Kuomintang warlords to imperialism... The crimes of the Kuomintang's surrender to imperialism have been fully exposed by world-shocking facts! No one should believe anymore that the Kuomintang warlords oppose imperialism! No faction of the Kuomintang, nor any political group in China, can solve the Manchuria issue by surrendering to imperialism! They will once again shout their shameless slogans of 'calmness,' 'patience,' and 'prudence.' They will once again deceive the people and rely on so-called 'international justice'! They will once again hoarsely shout: 'The only current issue is still suppressing the Communists,' to confuse the masses. They will use this event to attack each other in an attempt to gain 'popular trust.' But no matter how they deceive or what tricks they play, past facts have already taught every mass member to resolutely oppose and expose these shameless deceptions!\n\nOnly the armed forces of the toiling masses of workers, peasants, and soldiers are the real force against imperialism. The glorious history of the Red Army's heroic struggle against imperialism and the Kuomintang over the past two years is everlasting proof. Only the government of the toiling masses of workers, peasants, and soldiers (the Soviet government) is a government that thoroughly opposes imperialism. Only under the leadership of the Communist Party can imperialism be driven out of China!\n\nToiling masses of workers, peasants, and soldiers! The only way out has long been before us! The great task has long been placed on our shoulders! Only through our heroic struggle can we accomplish it!"

NEB_history.2.t: "1931 - Declaration of the Chinese Communist Party on the Japanese Imperialist Violent Occupation of the Three Eastern Provinces (Excerpt)"
NEB_history.2.d: "The bloodstains of Wanbaoshan and Korea have not yet dried, and Japanese imperialism has once again openly sent troops into China, violently occupying Fengtian, Andong, and Yingkou, carrying out even larger-scale massacres of the Chinese people!\n\nThe imperialist powers, especially Japanese imperialism, are the evil bandits who oppress China and massacre the Chinese people. In the past six months, they have killed from Wanbaoshan §RKorea§! all the way to Qingdao, and now to Fengtian, Andong, and Yingkou. Tens of thousands of Chinese toiling people have already been sacrificed, and past incidents such as the May Thirtieth Massacre and the Jinan Massacre are too numerous to count. Now they have openly and violently occupied Chinese territory, with the clear aim of plundering China, suppressing the Chinese workers' and peasants' revolution, turning China completely into their colony, and at the same time more actively and directly attacking the Soviet Union, attempting to destroy the world's first proletarian homeland and the base camp of world revolution, and launching the Second World War, especially the Pacific imperialist war, carrying out even larger-scale massacre policies to partition China.\n\nAt a time when the people are suffering unbearably from warlord wars and unprecedented floods, Japanese imperialism has once again openly sent troops into China, occupied Chinese territory, and massacred the Chinese people... Only the power of mass struggle and the victory of the workers' and peasants' Soviet movement can liberate China."

NEB_history.3.t: "1933 - Letter from the Central Committee to All Party Organizations and Members in Manchuria (Excerpt)"
NEB_history.3.d: "Our Party should clearly understand and consolidate the leadership of the anti-Japanese mass struggle; this is a task in our own hands and one of the basic tasks at the current stage of Chinese revolutionary development.\n\nFirst, at all times, we must uphold and preserve our political and organizational independence.\n\nSecond, when actually implementing the united front strategy, we must concretely take into account the objective environment and subjective factors, and deal with different targets differently...\n\nFourth, we must carefully take into account that if the proletariat, under certain circumstances and conditions, forms a united front with a certain part of the national bourgeoisie... Therefore, we must do our utmost to expand the political education and organization of the proletarian peasants and petty bourgeoisie (especially workers). The basic method is to develop their political and economic struggles. This is currently the foremost basic task of our Party in Manchuria."

NEB_history.4.t: "1935 - Appeal to All Compatriots for National Salvation and Resistance Against Japan by the Chinese Soviet Government and the Central Committee of the Chinese Communist Party (Excerpt)"
NEB_history.4.d: "At a time when the great calamity of national subjugation and genocide is imminent, the Communist Party and the Soviet Government once again appeal to all compatriots: Regardless of any differences in political views or interests between parties in the past or present, regardless of any differences in opinions or interests among people from all walks of life, and regardless of any hostile actions between various armies in the past or present, everyone should have the sincere realization of 'brothers fighting within the walls, but uniting against external aggression.' First of all, everyone should stop the civil war so as to concentrate all national strength (human, material, financial, military, etc.) to strive for the sacred cause of resisting Japan and saving the nation. The Soviet Government and the Communist Party once again solemnly declare: As long as the Kuomintang armies stop attacking the Soviet areas, and as long as any troops carry out resistance against Japan, regardless of past or present grudges with the Red Army, and regardless of any differences on internal issues, the Red Army will immediately cease hostile actions against them and is willing to join hands closely with them to save the nation together.\n\nThe Chinese nation is at a critical juncture of life and death. Resisting Japan and saving the nation is the primary task facing all Chinese people. The declaration clearly states: 'To resist Japan is to live, not to resist Japan is to die. Resisting Japan and saving the nation has become the sacred duty of every compatriot!'\n\nAll parties, groups (trade unions, peasant associations, student unions, chambers of commerce, education associations, journalists' federations, teachers' federations, hometown associations, Zhigongtang, national armed self-defense associations, anti-Japanese associations, national salvation associations, etc.), celebrities, scholars, politicians, and all local military and political organs that are willing to participate in the cause of resisting Japan and saving the nation should negotiate to jointly establish a national defense government. The national defense government established as a result of the negotiations should serve as a provisional leading organ for national salvation. This national defense government should convene a representative body that truly represents all compatriots (representatives elected under democratic conditions from workers, peasants, soldiers, merchants, students, all parties and groups willing to resist Japan and save the nation, overseas Chinese, and various ethnic groups within China) so as to discuss in more concrete terms various issues concerning resisting Japan and saving the nation. The Soviet Government and the Communist Party will do their utmost to support the convening of this national representative body and will absolutely implement the resolutions of this body, because the Soviet Government and the Communist Party are governments and parties that absolutely respect the will of the people."

NEB_history.5.t: "1940 - Draft New Outline on the Northeast Anti-Japanese National Salvation Movement (Excerpt)"
NEB_history.5.d: "Based on the current struggle environment in the Northeast, the overall situation of the nationwide war of resistance, and in reference to the general policy of the Sixth Enlarged Plenum of the Central Committee (Sixth Plenary Session of the Sixth Central Committee of the CCP), the current tasks facing the Northeast Party must be emphatically pointed out:\n\n1. First, we must grasp the leadership of the existing Northeast Anti-Japanese United Army guerrilla units, restore and re-establish local Party organizations everywhere, and the anti-Japanese national salvation movement of the masses in cities and countryside. No matter how much damage or failure the guerrilla movement suffers, we must not regard the crystallization of eight years of anti-Japanese national salvation struggle by the broad masses in the Northeast as a powerless remnant.\n\n2. For eight years the Northeast Party and the Northeast people have been bound by flesh and blood. Their goal is the survival of the nation and the true welfare of the people. With the spirit of sacrificing everything, they were the first to advocate for the nationwide war of resistance to persist and endure. The period when the whole nation is now carrying out a powerful, great, and protracted war of resistance and moving toward final victory has already been shown. To promote the overall war situation in a direction favorable to our country or in the sense of thorough national liberation, the historical task of the Northeast guerrilla movement contains a profound future.\n\n3. The current stage is not about abstract ideas of balanced movement development, but to thoroughly reorganize the existing guerrilla units, properly plan guerrilla zones and tactics, and actively meet the requirements of the current stage of the nationwide protracted war of resistance against Japan. Therefore, we must strive to overcome the weaknesses of the previous period so that the future actions of the guerrilla units tend toward unity; Party leadership must strive for centralization. At the same time, we must correct tendencies within the Party—blind adventurism and erratic behavior, exaggeration and arrogance, disappointment and pessimism, passivity and lack of reliability, etc.—weaknesses in the actions of guerrilla units and masses that have appeared during the long struggle, which are reflected in the Party as conscious or unconscious political action tendencies."

NEB_history.6.t: "1942 - Northeast Anti-Japanese United Government"
NEB_history.6.d: "Since the collapse of the Soviet Union and the large-scale Japanese offensive in the Far East, the Far Eastern Red Army has been fragmented. The Anti-Japanese United Army Party organizations held a meeting and decided to actively rescue the Soviet Red Army, search for scattered soldiers, treat the wounded, and instructed all units to immediately establish rescue committees and organize soldiers and doctors to participate in the rescue work. In order to further adapt to the situation of the anti-Japanese struggle, the Anti-Japanese United Army Party organizations deliberated on adjusting the military structure and planned to form a force with a more reasonable command system and troop allocation that better meets the needs of the struggle. Zhou Baozhong exchanged views on this with former Soviet comrades and received their support.\n\nAfterwards, with the support of former Soviet comrades, Li Zhaolin prepared to establish the Northeast Anti-Japanese United Government.\n\nIn August 1942, the Northeast Anti-Japanese United Army was reorganized into the Anti-Japanese United Army Teaching Brigade, and officer appointment orders were announced: Zhou Baozhong as brigade commander, Li Zhaolin as political commissar of the teaching brigade, and Cui Shiquan (later renamed Cui Yongjian in 1945) as deputy chief of staff and concurrently secretary of the brigade Party committee. The Soviet army selected more than 30 officers to serve as chief of staff, director of the political department, quartermaster, and various deputy positions in the teaching brigade. The next day, the Northeast Anti-Japanese United Government was announced in Haishenwai.\n\nOn September 13, 1942, the teaching brigade held a general meeting of all Party members and established the 'Teaching Brigade CCP Northeast Party Organizations Special Branch Bureau' (also known as the Northeast Party Committee). The Special Branch Bureau implements the political line of the Central Committee of the CCP, and the original Northeast Party organization relations remain unchanged. The Northeast Party Committee is both the brigade Party committee and the provisional highest leading organ of the entire Northeast Party organizations in the absence of contact with the Central Committee. After the establishment of the Northeast Party Committee, the CCP Jidong and Beiman Provincial Committees were abolished. At this point, the Party organizations in the Northeast region once again achieved unity."

NEB_history.7.t: "1948 - Instructions on Carrying Out the Eighth Anti-Mopping-Up Campaign (Excerpt)"
NEB_history.7.d: "We are now at a low point in the anti-Japanese struggle. The base areas have shrunk and casualties are very serious, but our years of struggle are still effective. The enemy's main targets are still in North China and the Central Plains. Although we have been completely split in two by the Japanese army from Boli to the Whale Sea line, this does not mean that the Japanese army has completely annihilated us. We are tired and heavily depleted, but the enemy is even more tired and depleted. They can no longer dispatch more troops to continue attacking the remaining base areas, nor are they able to continue advancing northward. As long as we persist in the struggle and continue on this foreign land, there is no defeat. We hope that all Party branches will encourage Party members and soldiers to remain optimistic, act prudently, and strive for the great victory of the Eighth Anti-Mopping-Up Campaign!"

NEB_history.8.t: "1950 - Instructions on Continuing to Persist in the Struggle"
NEB_history.8.d: "To all Party branches, brigades, regiments, battalions, and companies:\n\nThe current anti-Japanese struggle has entered an even more arduous period. Recently, from enemy and puppet radio stations, we learned that the Central Committee thwarted the enemy's attempt to destroy the anti-Japanese national united front at Tongguan in Shaanxi. This has greatly encouraged the entire Party and the whole army. Party branches of all units should take this opportunity to strengthen ideological construction, do a good job in ideological work between the Soviet Red Army and our army, and maintain unity and a good atmosphere. Continue to persist in the Northeast anti-Japanese struggle."

NEB_history.9.t: "1957 - Instructions on Reducing the Boli Underground Party"
NEB_history.9.d: "To the Northeast Party Committee Boli Branch:\n\nSince the end of the Western Russian War, Japanese imperialism and the puppet Manchukuo have intensified their suppression against us, and the anti-Japanese base areas have shrunk very rapidly. To preserve strength, underground Party members stationed in Boli should continue to reduce their numbers. Please convene a meeting immediately to discuss and formulate a reduction plan and evacuate as soon as possible."

NEB_history.10.t: "1958 - Great Victory at Hailanpao"
NEB_history.10.d: "In 1958, the Northeast Party Committee moved to the Hailanpao area. The Japanese army and puppet Manchukuo troops also launched a new round of large-scale mopping-up operations. This mopping-up caused heavy losses to the Northeast Party Committee, and the Northeast Party Committee completely lost contact with Boli, Whale Sea, and Miaojie until the remnants returned two years later. After mopping up most of Outer Northeast, the Japanese army turned their spearhead directly toward Hailanpao. Under the instructions of the Northeast Party Committee, the remnants of the Soviet Red Army and the Northeast Anti-Japanese United Army launched the Hailanpao Campaign in Hailanpao. The Japanese army, in coordination with reactionary forces from Amur in the north, advanced on our base area in five routes. Our army adopted flexible countermeasures, attacking two enemy forces crossing the river on the Heilongjiang, then crossing the Heilongjiang to threaten Qiqihar. The enemy forces panicked, and one route was ordered to advance toward Qiqihar. Our army ambushed them on their retreat route and annihilated an entire enemy regiment; the enemy's last route, fearing attacks on both flanks, also withdrew to the south bank of the Heilongjiang. The reactionary forces from Amur in the north, worried about attacks from surrounding Russian warlords, advanced slowly and also withdrew after we repelled the four routes. Our army achieved the great victory at Hailanpao and consolidated the base area."

NEB_history.11.t: "1958 - Instructions on Doing a Good Job in the Arduous Enemy-Rear Struggle (Excerpt)"
NEB_history.11.d: "The current anti-Japanese struggle is at a low point. Although we have consolidated the Hailanpao base area, the troops have suffered heavy losses, and personnel organization and thinking are in chaos, urgently requiring rest and replenishment. We have not yet broken through the blockade, and the struggle situation remains severe. Therefore, after discussion and study, the Northeast Party Committee has decided that all units should follow the following principles:\n\n1. The Three Main Rules of Discipline and Eight Points for Attention remain the basic principles of the Northeast Anti-Japanese United Army. Any grassroots soldiers or Party members within the army who violate these principles must accept inspection by the Party committee and receive disciplinary punishment. The fundamental reason our Party and army can gain mass support is that we have upheld the Three Main Rules of Discipline and Eight Points for Attention, have not disrupted the lives of the common people, and stand in sharp contrast to the actions of the enemy, puppet, and reactionary forces.\n\n2. Party members and cadres should maintain the style of hard struggle, put the problems of the masses first, treat the masses kindly, solve the masses' problems with a positive attitude, and conduct investigations and research with a cautious and steady attitude. Party members and cadres should also play a vanguard and exemplary role. Some things must be done by someone first before others will follow. Do not fear difficulties; overcome them.\n\n3. The overall guideline for base area construction is eight characters: Restore, Seek Stability, Enrich, and Improve. Focus primarily on restoring the base areas; construction and production should not be rushed but should be restored steadily and step by step in a planned manner. Construction standards must be high, and every step of the process must be done properly to enrich the base area in preparation for possible future struggles. Meaningless construction should be avoided as much as possible, and the level of the base area should be gradually improved."

NEB_history.12.t: "1963 - Decision on Opening the Western Route (Excerpt)"
NEB_history.12.d: "The year 1962 was an extremely extraordinary year for the land of China. The end of the civil war in Mongolia, the end of the civil war in Xinjiang, and the unification of Sichuan expanded the areas controlled by the Central Committee to half of China. Although we are still out of contact with the Central Committee, since the great victory at Hailanpao, Japanese imperialism has no longer launched large-scale mopping-up operations. This has allowed us to re-establish intelligence lines in the former Soviet Far East region. However, we have no control and still lack the ability to launch offensives against cities such as Boli and Haishenwai. We must seek external assistance. However, the Russian warlords to the north are reactionary regimes and cannot have any intersection with us. To the east is Japanese-controlled Sakhalin, and to the south is puppet Manchukuo. Therefore, we are left only with the western route.\n\nToday's situation is different from the past. Puppet Mongolia has withdrawn from the eastern part of the former Mongolian People's Republic, which means that the forces of the Central Committee have approached the Northeast, greatly shortening the straight-line distance between us. That is to say, we only need to cross the Greater Khingan Range, or if the northern Russian warlords agree to let us pass, we can enter the Mongolian region from Amur and Chita to join the Central Committee. But the northern situation is still unclear, and our survival threat is imminent. Therefore, after discussion, the Northeast Party Committee has decided that we will cross the Greater Khingan Range, open the direct route from Manzhouli to Hailanpao, enter the Mongolian region from Manzhouli, and restore contact with the Central Committee.\n\nTherefore, the main task of the Northeast Anti-Japanese United Army at this stage is to infiltrate the Xing'an region, break through the blockade, open the western route, and return to the united front of the Central Committee."

NEB_history.13.t: "1966 - Decision to Dispatch the Northeast Delegation Led by Liu Yalou to the Mongolian Region"
NEB_history.13.d: "After discussion and study by the Northeast Party Committee, it has been decided to dispatch Comrade Liu Yalou, Chief of Staff of the Northeast Anti-Japanese United Army, to the Mongolian region to find the Central Committee. All branches should intensify preparations and await orders from the Central Committee."

NEB_history.14.t: "1966 - §x(Top Secret)§! Instructions After Comrade Liu Yalou Arrives in Mongolia"
NEB_history.14.d: "To all Party branches:\n\nAfter Comrade Liu Yalou arrives in Mongolia, he will immediately set up a radio station and send an identification code. All underground radio stations of the Party branches should monitor at all times. Once received, immediately identify the source and send the identification code, and accept instructions from Comrade Liu Yalou. The identification code will be delivered by a special commissioner.\n\nNote: This instruction is top secret and is for reference by high-level Party committee members only.\n\n§xAnnotation: The mutual identification codes are “Liberate the Northeast” and “The Spark Never Dies”§!"

NEB_history.15.t: "1966 - Instructions on Resolutely Implementing the Central Committee's Order to Withdraw Westward (Excerpt)"
NEB_history.15.d: "Considering the enormous difficulties in support, the Central Committee has decided to have the Northeast Anti-Japanese United Army withdraw westward. After discussion and study, the Northeast Party Committee has decided to resolutely obey the instructions of the Central Committee. The relevant instructions of the Central Committee on the westward withdrawal are now issued to all Party branches. All branches should study them carefully and earnestly understand the spirit of the instructions of the Central Committee and Chairman Mao. For this westward withdrawal, all Party branches should do the following work:\n\nFirst, adhere to the principle of voluntariness. Do not use coercion; persuasion should be moderate and respect the wishes of comrades. Even if they are unwilling to leave, it does not matter; we will return in the future.\n\nSecond, establish westward withdrawal working groups. All Party branches should establish westward withdrawal working groups to unify all aspects of the westward withdrawal. This westward withdrawal will pass through enemy- and puppet-controlled areas, so unified and secret actions require special organization.\n\nThird, do a good job in the ideological work of those left behind. The liberation of the Northeast is still long-term and arduous. For the sake of future liberation, we must leave some comrades behind to coordinate from within. We must do a good job with these comrades, make them fully understand that 'the westward withdrawal is for the future eastward advance and northern expedition,' and fully recognize the great significance of underground work behind enemy lines."

NEB_history.16.t: "1966 - Announcement of the Establishment of the Chinese Communist Party - Northeast Bureau (Excerpt)"
NEB_history.16.d: "Since resisting the Japanese invaders in 1931, the Northeast Anti-Japanese United Army has gone through hardships, withstood numerous tests, and overcome countless difficulties. We have waged an extremely arduous guerrilla war between the white mountains and black waters, striking at the arrogance of Japanese imperialism and preventing them from extending their claws to broader areas. All the struggle history of the Anti-Japanese United Army will be remembered by future generations.\n\nThe struggle is cruel and arduous. In nearly forty years of struggle, many comrades have sacrificed their lives on that rich and beloved land. Many comrades have developed pessimistic emotions, believing that the liberation of the Northeast is no longer possible, that the Northeast has already been subjugated and its people exterminated, and that the people of the Northeast will forever be slaves of Japanese imperialism. However, whether it was the signing of the 1947 Sino-Japanese traitorous treaty or the civil wars in Xinjiang and Mongolia five years ago, the Central Committee has always held high the banner of resisting Japan, expanded the liberated areas, and unified northwest China. With the completion of our westward withdrawal and the restoration of contact with the Central Committee, the liberation of the Northeast is no longer a long dark night, but a dawn that is about to arrive!\n\nThe Central Committee is not only going to liberate the Northeast but also the whole of China. This is why we are establishing the Northeast Bureau. Things must be done step by step. Not only is the Northeast under the iron hoof of the Japanese invaders, but the vast areas of North and South China are still under Japanese colonial rule. Only by uniting the broadest masses of the people can we completely drive Japanese imperialism and the running dogs of the traitorous puppet regime out of China.\n\nComrades, today is the day the Northeast Bureau is established and a new starting point for the Northeast anti-Japanese liberation struggle. The Northeast Anti-Japanese United Army is no longer fighting alone. Behind us stands a reliable and strong Central Committee, which is both our leader and our backing. Let us unite around the Central Committee with Chairman Mao at its core and strive unremittingly for the liberation of the Northeast and the whole of China!\n\nThe meeting also decided that Gao Gang shall serve as the First Secretary of the Northeast Bureau, Li Zhaolin as the Second Secretary, Liu Yalou as the First Deputy Secretary, and Zhou Baozhong as the Second Deputy Secretary."

NEB_history.16.o: "[GetMonth] X, 1966"
NEB_history.17.t: "1967 - Decision on Restoring Northeast Base Area Construction and Expanding the Intelligence Network"
NEB_history.17.d: "To meet the needs of the future liberation struggle and reduce unnecessary casualties, after discussion and study by the Northeast Bureau, it has been decided to restore the construction of the Northeast base areas and expand the existing intelligence network. On the basis of the existing Hailanpao and Miaojie, restore the Outer Northeast base area and the Heilongjiang base area; expand the existing intelligence network from major cities to the entire Northeast region. This is an important component of the future liberation struggle and an important step in the liberation of the Northeast. All units should attach great importance to it."
NEB_history.17.o: "[GetMonth] X, 1967"
NEB_history.18.t: "1972 - Decision on Supporting the People's Liberation Army Operations and Completely Liberating the Northeast"
NEB_history.18.d: "Northeast comrades and Northeast compatriots, Japanese imperialism is unwilling to accept defeat. After the founding of the New China, they actually fantasy to allow puppet Manchukuo to continue to exist and to separate the Northeast and part of North China from Chinese territory. The Chinese people will never accept such an unreasonable demand! The Central Committee, based on the principle of putting the people first, hoped that the Northeast would suffer less war damage, but the arrogance and hubris of Japanese imperialism have ruined all this! They妄想 to make the New China swallow the bitter fruit of splitting the motherland and to make the New China submit to their demands. The Chinese people have never been a people willing to accept oppression. The Chinese people deeply abhor all acts and ideas of splitting the motherland. Therefore, the liberation of the Northeast can no longer be resolved peacefully.\n\nYesterday, the Central Committee of the CCP issued to the Northeast Bureau the 'Decision of the Central Committee on the Liberation of the Northeast' and the 'Decision of the Central Military Commission on the People's Liberation Army Advancing North to Liberate the Northeast.' These documents are now issued to all institutions. The Central Committee requires us to coordinate with the People's Liberation Army's northward advance into the Northeast, completely defeat Japanese imperialism, and strike at the arrogance of Japanese imperialism. Comrades, this is the final battle of the Asian people's liberation war. We are standing at a historic juncture. The whole of China and even the whole world are watching us. We must fight this battle well and strive for the greatest victory! After discussion and study by the Northeast Bureau, the main task of the Northeast Bureau at present is to do its utmost to provide logistical support to the People's Liberation Army, do a good job in takeover work, refugee identification, and a series of tasks in occupied areas. Under the triumphant song of the People's Liberation Army's victory, we are going home!"
NEB_history.18.o: "The Horn of Decisive Battle Has Sounded"
NEB_history.18.tt: "Launch the §xFinal Strike§! against §jJapanese Imperialism§!!"

# National Spirit
NEB_ghost_army: "Ghost Army"
NEB_ghost_army_desc: "To the whole of China, the Anti-Japanese United Army ceased to exist after the collapse of the Soviet Union. However, the actions of Japan and Manchukuo repeatedly declare to the world that a ghost still lingers over the Northeast. Only we and our enemies know of our existence."
NEB_insist_spirit: "Eastern Spark"
NEB_insist_spirit_desc: "The prairie fire that once blazed in the East has long been extinguished with the ceasefire between China and Japan and the liberation of Xi'an. But does this mean defeat? No, it does not. We are the last spark in the East—the raging flame that will burn all reactionaries to ashes. We are the kindling. One day, the land of China will burn again, and this time the fire will consume all filth!"