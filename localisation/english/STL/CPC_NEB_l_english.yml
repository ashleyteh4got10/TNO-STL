CPC_NEB_entry_tt: "Click to open the £CPC_texticon §xChinese Communist Party - Northeast Bureau§! GUI"
CPC_NEB_info_desc: "The £CPC_texticon §xChinese Communist Party - Northeast Bureau§! is a newly established organization tasked with building base areas in Northeast China and preparing for the §xLiberation of the Northeast§!. You can click on the §Gcity markers§! on the map to view regional information. In the Memorandum, click the §Ggreen triangles§! and §xred triangles§! to review the arduous years of the Northeast Anti-Japanese United Army.\n\nThe Northeast Bureau has established three §Ystrategic phase plans§!, each containing three missions. You may freely choose which missions to carry out. After completing a plan, you can still review its details. Please note: to accomplish the great cause of resisting Japan, please complete these missions as thoroughly as possible.\n\nAt the same time, for the sake of the §xcause of liberation§!, the Northeast Bureau will do its utmost to support the §xCentral Committee§!."
