 CPC_NEB_info_desc: "£CPC_texticon §xCommunist Party of China (CPC) - Northeast Bureau§! is a newly established institution, tasked with building base areas in the Northeast in preparation for §xthe liberation of the Northeast§!. You can click on the §Gcity markers§! on the map to view regions, and click the §Ggreen triangle§! and §xred triangle§! in the memorandum to revisit the hard years of the Northeast Anti-Japanese United Army.\n\nThe Northeast Bureau has established three §Ystrategic phase plans§! in total, with three missions in each phase. You are free to choose which missions to execute. Click the green 'Execute Plan' button to start a 60-day plan, and once the plan is completed you can continue to view its details. Please note that if you wish to accomplish the great cause of resisting Japan, you should complete these missions as far as possible.\n\nAt the same time, for the sake of §xthe cause of liberation§!, the Northeast Bureau will do all it can to assist §xthe Party Central Committee§!."
