 NEB_help_text: "H E L P"
 NEB_abstract_help_text: "With the help of §xthe Party Central Committee§!, the Northeast Bureau has restored the intelligence network in §Ythe Northeast§!. Each intelligence station can provide four kinds of development - §Gresearch facilities§!, §Reducation§!, §Bindustrial equipment§!, and §ahealthcare§! - as well as a monthly bonus to acquiring weapons and equipment. But because resources are limited, each city can only grant one bonus.\n\nYou can click on markers on the §Gmap on the left§! that are not round §Wwhite dots§! to change each city's §Gfocus§!. The effects of a changed focus will automatically appear next month.\n\nTo see §xthe Northeast Bureau's overall situation§!, click the icon in the upper-left corner of the map."
