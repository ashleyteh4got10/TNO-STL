NEB_help_text: "Help"
NEB_abstract_help_text: "With the help of the §xCentral Committee§!, the Northeast Bureau has restored the intelligence network in the §YNortheast region§!. Each intelligence station can provide four types of development progress: §Gresearch facilities§!, §Reducation§!, §Bindustrial equipment§!, and §amedical care§!, as well as monthly bonuses for acquiring weapons and equipment. However, due to limited resources, each city can only grant one type of bonus.\n\nYou can click on the non-white §Wdot§! markers on the §Gleft-side map§! to change the §Gfocus§! of each city. The effects of the new focus will automatically take effect next month.\n\nTo view the §xOverall Situation of the Northeast Bureau§!, please click the icon in the upper-left corner of the map."
