NEB_Li_Zhaolin: "Li Zhaolin"
Li_Zhaolin_DESC: "Born in the white mountains and black waters, Li Zhaolin witnessed how the Japanese invaders colonized the Northeast. When the Chinese Communist Party organized anti-Japanese volunteer armies in the Northeast, he threw himself into the struggle without hesitation and gradually became a central figure in the Northeast anti-Japanese organizations. After the collapse of the Soviet Union, Japan seized Outer Northeast. Li Zhaolin led the Northeast Party organizations to continue resistance in the even colder Outer Xing'an Mountains. Yet the more they resisted, the deeper the darkness became, and dawn seemed ever more distant. The collapse of the Soviet Union left the Soviet Red Army in the Far East homeless. The recovery of the Northeast seemed indefinitely postponed, and the path to restoring Korea also became hopeless. But Li Zhaolin knew that in the darkest times, leaders must hold firm to their principles. Heroes in victory are never as great as heroes in defeat. Li Zhaolin persisted through hardship until one day he saw lightning in the darkness—the Japanese army was defeated at Tongguan. Although the situation in the Northeast became even more unfavorable, Li Zhaolin once again confirmed that Japanese imperialism was ultimately a paper tiger! Thus, he made up his mind to continue the struggle and embark on the road home."
Li_hero: "Standard-Bearer in Desperate Straits"
NEB_Liu_Yalou: "Liu Yalou"
Liu_Yalou_DESC: "Liu Yalou, who went to study in the Soviet Union during the War of Resistance, never imagined he would end up with the Northeast Anti-Japanese United Army. As one of the few who had experienced the Long March, he thought no adversity could be worse than that. However, reality nearly shattered his understanding. The environment faced by the Northeast Anti-Japanese United Army made Liu Yalou fully realize how narrow his previous perspective had been. Shortages of food and clothing, lack of medicine—these were commonplace. The freezing cold was the greatest enemy. In the South, Liu Yalou did not have to fight the weather, but in the Northeast it was different. Thick snow was far harder to traverse than muddy ground, low temperatures drained physical strength, and lighting fires to ward off the cold would expose their position. The days and nights with the Northeast Anti-Japanese United Army reminded Liu Yalou of the distant Mountain of Death from thirty years ago, where the climate was equally harsh and blizzards frequent."
NEB_Zhou_Baozhong: "Zhou Baozhong"
Zhou_Baozhong_DESC: "Southerners were already rare in the Northeast Anti-Japanese United Army, and Zhou Baozhong was even rarer among them—a graduate of the Yunnan Military Academy. His experience can be described as a piece of Party history—up until the September 18 Incident. He should have returned to the Central Committee after completing his studies in the Soviet Union, but the September 18 Incident forced him to change direction. Following orders, Zhou Baozhong came to the Northeast to organize the people in the anti-Japanese national salvation movement. Good times did not last. The Northeast Anti-Japanese United Army was forced to retreat again and again. The collapse of the Soviet Union, the merger of Nanjing and Chongqing, and a series of blows left the Northeast Anti-Japanese United Army in a difficult position. The homeless Soviet Red Army soldiers were incorporated into the United Army. The expanded force now included Chinese, §RKoreans§!, and Soviets. Zhou Baozhong realized that the most difficult moment had arrived, but before dawn there is always darkness. How much longer would the night last? No one knew the answer, but it surely could not be far off."
