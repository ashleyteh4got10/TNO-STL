NEB_mission_title: "£GFX_NEB_mission_title_icon    §Y[NEB_mission_title_loc]§!    £GFX_NEB_mission_title_icon"
NEB_mission_1: "Infiltrate the Greater Khingan Range"
NEB_mission_1_tt: "[NEB_mission_1_tt]"
NEB_mission_1_tooltip: "In accordance with the instructions of the §xCentral Committee§!, we have decided to open and consolidate a base area near Manzhouli. If possible, we will completely control the Greater Khingan Range."
NEB_mission_1_sub_1: "Black Under the Lamp"
NEB_mission_1_sub_1_desc: "According to the instructions of the §xCentral Committee§!, the §YNortheast§! forces should establish a new base area near §GManzhouli§!. After investigation, §WZhalainuoer§! is not far from §OManzhouli§! and is an ideal location."
NEB_mission_1_sub_2: "Clear Obstacles"
NEB_mission_1_sub_2_desc: "According to intelligence from our agents, the Japanese army has built the largest §jmilitary fortress§! in the §YNortheast§! in Hailar. This fortress has turned the entire city into a military stronghold. The Japanese invested heavily here, constructing five fortresses forming a fortress group. If we can infiltrate it, this will become the ideal supply base for our future advance into the §YNortheast§!."
NEB_mission_1_sub_3: "Trap the Dog Behind Closed Doors"
NEB_mission_1_sub_3_desc: "The §GXing'an Ridge Tunnel§! is the only railway tunnel in the Greater Khingan Range. All Japanese military supplies pass through here into the western foothills. In the future, when our army crosses the Greater Khingan Range, railway transport must also pass through here. Therefore, we must seize this §Ostrategic chokepoint§!."
NEB_mission_201: "China Eastern Railway Plan"
NEB_mission_2_tt: "[NEB_mission_2_tt]"
NEB_mission_201_tooltip: "The China Eastern Railway is the lifeline of the entire §YNortheast§!. This proposal was put forward by Liu Yalou. The goal is to build a north-south intelligence network with §GHarbin§! as the base."
NEB_mission_201_sub_1: "Seize the Hub"
NEB_mission_201_sub_1_desc: "§GHarbin§! is the heart of the entire China Eastern Railway. Whether we advance east from the Greater Khingan Range or north into Outer Northeast in the future, §GHarbin§! is a strategic hub we must capture."
NEB_mission_201_sub_2: "Open the Pass and Defeat the Enemy"
NEB_mission_201_sub_2_desc: "Jinzhou is the southern gateway to the §YNortheast§!. If our army wants to advance north from Shanhaiguan in the future, this is a place we must pass through. Controlling it in advance will greatly assist our northward advance."
NEB_mission_201_sub_3: "Aid for Outer Northeast"
NEB_mission_201_sub_3_desc: "While focusing on the §YNortheast§! mainland, we must not forget the existence of §ROuter Northeast§!. They will also provide help to our plans."
NEB_mission_202: "Outer Northeast Recovery Plan"
NEB_mission_202_tooltip: "§ROuter Northeast§! is the cornerstone of the §YNortheast§! anti-Japanese resistance. This proposal was put forward by §WCui Yongjian§!. The goal is to rebuild the anti-Japanese base areas in §ROuter Northeast§!. This will not only create strategic pressure on §jJapan§! from the north, but also re-establish better connections with comrades in §RKorea§!."
NEB_mission_202_sub_1: "Rebuild the Heart"
NEB_mission_202_sub_1_desc: "§GBoli§! is the second-largest city in §ROuter Northeast§!. Located at the confluence of the Heilongjiang and Ussuri Rivers, it connects §WHaishenwai§! to the south and §WHailanpao§! to the north. §GBoli§! was once the underground intelligence core of the Northeast Anti-Japanese United Army. Therefore, our first stop is to rebuild this heart."
NEB_mission_202_sub_2: "From North to South"
NEB_mission_202_sub_2_desc: "§RKorea§! is the main rear area of the enemy forces in the §YNortheast§!. But if we depart from Haishenwai and advance along the §GYalu River§! line to Dandong, we can create panic among the enemy and cut off their supplies."
NEB_mission_202_sub_3: "Advance into the Northeast"
NEB_mission_202_sub_3_desc: "Our purpose in rebuilding §ROuter Northeast§! is not only to restore our strength, but also to recover our homeland. We must prepare to advance into the §YNortheast§! after restoring §ROuter Northeast§!."
NEB_mission_3: "Rectify and Prepare for War"
NEB_mission_3_tooltip: "The main task of §xliberating the Northeast§! must still be undertaken by the §RPeople's Liberation Army§!. As the Northeast Bureau re-infiltrates the §YNortheast§!, it is urgent to strengthen coordination between comrades of the Northeast Bureau and comrades of the PLA, such as intelligence work and city takeover work. Only by coordinating these non-military aspects related to military operations can we ensure the smooth §xliberation of the Northeast§!."
NEB_mission_3_sub_1: "Build Bridges"
NEB_mission_3_sub_1_desc: "The §RPLA§! is the main force for §xliberating the Northeast§!. The Northeast Bureau will carry out a series of activities to strengthen the understanding of §RNortheast Bureau§! comrades by §RPLA§! comrades and break down barriers between the two sides."
NEB_mission_3_sub_2: "Strengthen Construction"
NEB_mission_3_sub_2_desc: "Unity is not one-sided; it is carried out jointly by both sides. The Northeast Bureau will hold a series of meetings, systematically study military-related knowledge, and strengthen ties with §RPLA§! comrades to enhance mutual understanding."
NEB_mission_3_sub_3: "Unified Action"
NEB_mission_3_sub_3_desc: "After a series of activities and meetings, comrades from the §xNortheast Bureau§! and the §RPLA§! have gained sufficient understanding of each other. Next, a joint meeting will be held by both sides to determine specific actions and strategic arrangements."
