 NEB_history.1.t: "1931 - Declaration of the CPC Manchuria Provincial Committee on the Armed Occupation of Manchuria by Japanese Imperialism (Excerpt)"
 NEB_history.1.d: "To the toiling masses of workers, peasants, and soldiers: the villainous Japanese imperialists have completely occupied Fengtian, Yingkou, Andong, Fushun, Liaoyang, Haicheng, Tieling, Changchun, and many other large and small towns. What an astonishing event this is!\n\nThis event did not happen by chance! It is a policy the Japanese imperialists were bound to pursue in order to realize their 'Continental Policy' and 'Manchuria-Mongolia Policy'! It is a policy by which the Japanese imperialists seek to rule Manchuria more effectively, invade Mongolia, and turn Manchuria and Mongolia into outright colonies... The Japanese imperialists claimed that 'this conflict was caused by Chinese troops at the North Barracks in Fengtian damaging the South Manchuria Railway.' This is pure deception and rumormongering; even a three-year-old would not believe such words!\n\nThe reason the Japanese imperialists were able to occupy Manchuria is entirely the result of the Kuomintang (KMT) warlords capitulating to imperialism... The crime of the Kuomintang (KMT) in capitulating to imperialism has been fully laid bare by facts that have shocked the world! No one should believe any longer that the Kuomintang (KMT) warlords oppose imperialism! No faction of the Kuomintang (KMT), and no political group anywhere in China, can settle the Manchuria incident by capitulating to imperialism! They will once again shout their shameless slogans of 'calm,' 'patience,' and 'caution'; they will once again deceive the masses and lean on so-called 'international justice'! They will once again scream themselves hoarse with 'the only issue at present is still the suppression of the communists,' to confuse the people. They will once again exploit this incident to attack one another in an attempt to win the 'trust of the masses.' But no matter how they deceive, no matter what tricks they play, all the facts of the past have taught every one of the masses that we must resolutely oppose and expose these shameless lies!\n\nOnly the armed forces of the toiling masses of workers, peasants, and soldiers themselves are a genuine force against imperialism. The glorious history of the Red Army's heroic battles against imperialism and the Kuomintang (KMT) over the past two years is eternal, indelible proof. Only the government of the toiling masses of workers, peasants, and soldiers themselves - the Soviet government - is a government that thoroughly opposes imperialism. Only under the leadership of the Communist Party can imperialism be driven out of China!\n\nTo the toiling masses of workers, peasants, and soldiers! The only way out has long lain before us! The great task has long rested on our shoulders! Only through heroic struggle can we accomplish it!"
 NEB_history.2.t: "1931 - Declaration of the Communist Party of China (CPC) on the Brutal Occupation of the Three Eastern Provinces by Japanese Imperialism (Excerpt)"
 NEB_history.2.d: "The bloodstains at Wanbaoshan and Korea were barely dry when Japanese imperialism once again openly marched troops into China, brutally occupying Fengtian, Andong, and Yingkou, and massacring Chinese civilians on an even larger scale!\n\nThe imperialists of every country, and Japanese imperialism above all, are the villainous robbers who oppress China and slaughter its people. In the space of half a year they have killed their way from Wanbaoshan and §RKorea§! all the way to Qingdao, and now to Fengtian, Andong, and Yingkou. The Chinese toiling masses already sacrificed number in the tens of thousands; the past May Thirtieth and Jinan massacres and others are past counting. Now they are seizing Chinese soil even more openly and brutally, with the plain aim of plundering China, crushing the Chinese workers' and peasants' revolution, and turning China wholly into their colony. At the same time they are more actively and directly attacking the Soviet Union, seeking to destroy the fatherland of the world's first proletariat, the great base of the world revolution, and to launch a second world war - above all an imperialist war in the Pacific - carrying out an even vaster policy of massacre in order to partition China.\n\nJust when the people were suffering unspeakably under the ravages of warlord warfare and an unprecedentedly swollen flood, Japanese imperialism once again openly marched into China, seized Chinese territory by force, and massacred Chinese civilians... Only the power of the masses' struggle, only the victory of the workers' and peasants' Soviet movement, can liberate China."
 NEB_history.3.t: "1933 - Letter from the Central Committee to All Party Organizations and Party Members in Manchuria (Excerpt)"
 NEB_history.3.d: "Our Party must clearly understand and consolidate its leadership of the anti-Japanese mass struggle as a task in its own hands; this is one of the fundamental tasks at the present stage of the Chinese revolution's development.\n\nFirst, at all times, uphold and preserve our own political and organizational independence.\n\nSecond, in actually applying the tactics of the united front, we must attend concretely and carefully to objective conditions and subjective factors, and deal with different targets separately...\n\nFourth, we must seriously bear in mind this point: namely, that if the proletariat, under certain circumstances and conditions, forms a united front with a section of the national bourgeoisie... Therefore, expanding as widely as possible the political education and organization of the proletariat, the peasants, and the petty bourgeoisie (especially the workers) - fundamentally by developing their political and economic struggles - is the foremost and most basic task of our Party in Manchuria at present."
 NEB_history.4.t: "1935 - Manifesto to All Compatriots for Resisting Japan and Saving the Country, by the Chinese Soviet Government and the Central Committee of the Communist Party of China (CPC) (Excerpt)"
 NEB_history.4.d: "At a time when the calamity of national subjugation and racial extinction presses hard upon us, the Communist Party and the Soviet government once again appeal to all compatriots: whatever differences in political opinion or interest may have existed in the past or exist now between the parties, whatever differences of view or interest may exist among compatriots of all walks of life, and whatever hostilities may have existed in the past or exist now between the armies, we should all attain the sincere realization of 'brothers quarrelling within the walls yet uniting against foreign insult.' First of all, we must all stop the civil war, so as to concentrate all the nation's strength - human, material, financial, and military - in the sacred cause of resisting Japan and saving the country. The Soviet government and the Communist Party hereby solemnly declare once more: so long as the Kuomintang (KMT) army ceases its attacks on the Soviet areas, and so long as any unit actually fights Japan, then whatever old grudges or enmity may exist between them and the Red Army, in the past or at present, and whatever differences may divide them on internal questions, the Red Army will not only immediately cease all hostile acts against them, but is ready to join hands with them closely in a common effort to save the country.\n\nThe Chinese nation stands at the brink of life and death; resisting Japan and saving the country is the foremost task facing every Chinese person. The manifesto states plainly: 'To resist Japan is to live; not to resist Japan is to die; resisting Japan and saving the country has become the sacred duty of every compatriot!\n\nAll parties and organizations willing to join the cause of resisting Japan and saving the country (trade unions, peasant associations, student unions, chambers of commerce, educational associations, journalists' federations, teachers' federations, fellow-provincial associations, the Zhigong Tang, the National Armed Self-Defense Association, anti-Japanese associations, national salvation associations, and so on), all eminent figures and scholars, all politicians, and all local military and civil authorities, should enter negotiations to establish a national defense government together. The national defense government so established should act as a provisional leading organ for saving the nation from extinction. Such a national defense government should strive to convene a representative body truly representing all compatriots (with delegates elected under democratic conditions from workers, peasants, soldiers, officials, merchants, and students, from all parties and groups willing to resist Japan and save the country, and from overseas Chinese and all the ethnic groups within China), so as to discuss in greater detail the various questions of resisting Japan and national salvation. The Soviet government and the Communist Party will absolutely do their utmost to sponsor the convening of this all-national representative body, and will absolutely carry out its resolutions, for the Soviet government and the Communist Party are a government and a party that absolutely respect the people's will."
 NEB_history.5.t: "1940 - Draft New Outline on the Northeast Anti-Japanese National Salvation Movement (Excerpt)"
 NEB_history.5.d: "In light of the present conditions of struggle in the Northeast, the overall situation of the nationwide war of resistance, and the general line of the resolution of the Party Central Committee's Sixth Enlarged Conference (the Sixth Plenary Session of the Sixth Central Committee of the CPC), the tasks now facing the Northeast Party must be pointed out with emphasis:\n\n1. First, we must take firm hold of the leadership of the existing guerrilla units of the Northeast Anti-Japanese United Army, and restore and re-establish local Party organizations and mass anti-Japanese national salvation movements in town and country. However grave the wounds and defeats suffered by the guerrilla movement, we must not treat the fruit of eight years of tempering in the Northeast masses' anti-Japanese national salvation struggle as a spent and powerless remnant.\n\n2. For eight years the Northeast Party and the Northeast people have been bound together as flesh and blood, its purpose being the survival of the nation and the true welfare of the people. With a spirit that shrinks from no sacrifice, it was the first to uphold our nationwide war of resistance through long endurance. Now the hour is already at hand when the whole people are waging a mighty and great protracted war and advancing toward final victory. In turning the whole war situation to our advantage, and in the sense of complete national liberation, the historical task of the Northeast guerrilla movement holds far-reaching prospects.\n\n3. The present stage is not some abstract notion of the movement developing in balance; it calls for thoroughly reorganizing the existing guerrilla units, properly laying out guerrilla zones and tactics, and actively meeting the demands of the present stage of the nationwide protracted war of resistance. We must therefore strive to overcome the weaknesses of the earlier period and bring the guerrillas' future actions toward unity; Party leadership must strive for centralization, and at the same time we must rectify tendencies within the Party: in the long struggle the guerrilla movement and its units have shown blind adventurism and vacillation, or exaggeration and arrogance, or disappointment and pessimism, or passivity and unreliability - these weaknesses in the mass conduct of the guerrillas have been reflected inside the Party as conscious or unconscious political tendencies."
 NEB_history.6.t: "1944 - Northeast Anti-Japanese United Government"
 NEB_history.6.d: "Ever since the dissolution of the Soviet Union and Japan's large-scale offensive into the Far East, the Far Eastern Red Army has been shattered. The United Army's Party organization held a meeting and resolved to actively aid the Red Army, search for scattered soldiers, and tend the wounded, ordering all units to set up rescue committees at once and mobilize soldiers and doctors for the rescue work. To adapt still further to the situation of the anti-Japanese struggle, the United Army's Party organization began to plan adjustments to the force structure, intending to form a unit better suited to the needs of the struggle, with a more rational command system and composition. Zhou Baozhong exchanged views on this with the former Soviet comrades and won their support.\n\nAfter that, with the support of the former Soviet comrades, Li Zhaolin set about establishing the Northeast Anti-Japanese United Government.\n\nIn March 1943 the Northeast Anti-Japanese United Army was reorganized into the United Army Training Brigade, and officer appointments were announced at the same time: Zhou Baozhong as brigade commander, Li Zhaolin as political commissar of the training brigade, and Cui Shiquan (renamed Choi Yong-jian in 1945) as deputy chief of staff of the brigade and concurrently secretary of the brigade Party committee. The Soviet Army selected more than thirty officers to serve as chief of staff, director of the political department, head of logistics, and deputies at every level of the United Army Training Brigade. The next day the Northeast Anti-Japanese United Government was proclaimed in Vladivostok.\n\nOn September 13, 1943, the training brigade held a general meeting of all Party members and founded the 'Special Branch Bureau of the CPC Northeast Party Organization within the Training Brigade' (also called the Northeast Party Committee). The Special Branch Bureau carried out the political line of the CPC Central Committee, with the existing Northeast Party organizational ties left unchanged. The Northeast Party Committee was at once the brigade Party committee and, with contact with the CPC Central Committee lost, the provisional supreme leading body of all Party organizations across the Northeast. After the Northeast Party Committee was established, the CPC's Jidong and North Manchuria provincial committees were abolished. Thus the Party organizations of the Northeast were once again unified."
 NEB_history.7.t: "1948 - Directive on Carrying Out the Eighth Anti-Mopping-Up Struggle (Excerpt)"
 NEB_history.7.d: "We are at present in a low period of the anti-Japanese struggle; our base areas have shrunk and our losses are severe, yet our years of struggle have still been effective. The enemy's main objective remains the region of North China and the Central Plains. Though we have been cut cleanly in two by the Japanese along the line from Khabarovsk to the Sea of Japan, that does not mean the Japanese have destroyed us outright. We are tired and have suffered heavy attrition, but the enemy is more tired and has suffered still heavier attrition; they can no longer scrape together more troops to attack our remaining base areas, nor have they the strength to keep advancing north. So long as we hold fast to the struggle and endure on this foreign soil, we have not been defeated. It is hoped that every Party branch will encourage Party members and soldiers to stay optimistic, act with caution, and strive for the great victory of the eighth anti-mopping-up struggle!"
 NEB_history.8.t: "1950 - Directive on Continuing the Struggle"
 NEB_history.8.d: "To all Party branches, brigades, regiments, battalions, and companies:\n\nThe anti-Japanese struggle has entered a still more arduous phase. Recently, from enemy and puppet radio, we learned that the Party Central Committee, at Tongguan in Shaanxi, frustrated the enemy's design to destroy the Anti-Japanese National United Front. This has greatly heartened the whole Party and army. The Party branches of our units should seize this opportunity to strengthen ideological construction, do the ideological work between the Red Army and our own forces well, and preserve unity and a healthy atmosphere. Continue to persevere in the Northeast anti-Japanese struggle."
 NEB_history.9.t: "1957 - Directive on Reducing the Underground Party in Khabarovsk"
 NEB_history.9.d: "To the Khabarovsk Branch of the Northeast Party Committee:\n\nSince the end of the West Russian War, Japanese imperialism and Manchukuo have intensified their strangling of us, and our anti-Japanese base areas have shrunk very quickly. To preserve our strength, our underground Party members in Khabarovsk must be further reduced. The branch is instructed to convene a meeting at once to discuss the matter, draw up a reduction plan as soon as possible, and evacuate."
 NEB_history.10.t: "1958 - The Great Victory at Hailanpao"
 NEB_history.10.d: "In 1958 the Northeast Party Committee moved to the Hailanpao area. Japanese and Manchukuo forces also began a fresh round of large-scale mopping-up operations, in which the Committee suffered heavy losses and completely lost contact with Khabarovsk, the Sea of Japan, and Nikolayevsk, until the surviving remnants rejoined the main body two years later. After sweeping through most of the Outer Northeast, the Japanese turned their spearhead on Hailanpao. On the instructions of the Northeast Party Committee, the remnants of the Red Army and the Northeast Anti-Japanese United Army launched the Battle of Hailanpao. The Japanese, joined by the Amur reactionary forces from the north, pressed against our base areas in five columns. Our army adopted flexible tactics: we ambushed two enemy columns as they crossed the Heilongjiang, then crossed the river ourselves and drove straight at Qiqihar. The enemy panicked and sent one column toward Qiqihar; our troops ambushed them along the line of retreat and wiped out an entire enemy regiment. The enemy's last column, fearing an attack on both flanks, also pulled back to the southern bank of the Heilongjiang. The Amur reactionaries in the north, worried about attacks from the neighboring Russian warlords, advanced slowly and withdrew in succession after we routed four enemy columns. Our army won the great victory at Hailanpao and consolidated the base area."
 NEB_history.11.t: "1958 - Directive on Carrying Out the Arduous Work of Struggle Behind Enemy Lines (Excerpt)"
 NEB_history.11.d: "The anti-Japanese struggle is at a low ebb. Though we have consolidated the Hailanpao base, our units have suffered heavy losses and our personnel, organization, and thinking are in confusion, so we are in urgent need of rest and replenishment. We have still not broken the blockade and the situation remains grave. Therefore, after discussion and study, the Northeast Party Committee has resolved that all units must observe the following principles:\n\n1. The Three Rules of Discipline and Eight Points for Attention remain the basic principles of the Northeast Anti-Japanese United Army. Any rank-and-file soldier or Party member in the army who violates them must be investigated by the Party committee and subjected to disciplinary action. The reason our Party and army enjoy the support of the masses is fundamentally that our army upholds the Three Rules of Discipline and Eight Points for Attention and does not disturb the people's lives - a sharp contrast to the conduct of enemy and puppet reactionary forces.\n\n2. Party cadres must preserve a style of hard work and plain living, put the masses' problems first, treat the masses kindly, solve their problems with a positive attitude, and conduct investigation and research with care and steadiness. Party cadres must also play a vanguard and guiding role, remembering that some things must be done by someone before others will follow; do not fear difficulties - overcome them.\n\n3. The general policy for building the base areas is contained in eight words: restore, stabilize, enrich, improve. Restoration must be our main task; construction and production must not be rushed but should proceed steadily, step by step, according to plan. Standards must be strict, and every step of the work must be done properly, so that the base areas are enriched against whatever struggle may come. Meaningless construction should be avoided as far as possible, and the level of the base areas raised gradually."
 NEB_history.12.t: "1959 - Decision on Winning Over the Soviet Pacific Fleet (Excerpt)"
 NEB_history.12.d: "Comrades, the pirates we have met are not ruthless criminals, but the Soviet Pacific Fleet! They are short of food and clothing and have been forced to turn pirate and live by plunder. If we can ease their hardship, they will become a powerful ally of the Northeast Anti-Japanese United Army."
 NEB_history.13.t: "1959 - The Recovery of Nikolayevsk"
 NEB_history.13.d: "The chance encounter between the Northeast Anti-Japanese United Army and the Soviet Pacific Fleet gave both sides room to breathe, but their movements soon drew the attention of Japanese imperialism and the Far Eastern fascists.\n\nTo pluck out this thorn that was the Pacific Fleet, Japanese imperialism prepared to collude once more with the Rodzaevsky group for an encirclement campaign. With intelligence support from the Northeast Anti-Japanese United Army, the Pacific Fleet and the United Army struck first, launching a general offensive while the main Japanese force was resting at Nikolayevsk.\n\nRelying on intelligence supplied by the United Army, the Soviet fleet shelled the port of Nikolayevsk for three hours in the night. The sleeping Japanese navy tried to hit back but was quickly pinned down by United Army detachment. Unable to leave the harbor, Japanese warships either sank in roaring flames or were seized and sailed away by Soviet sailors.\n\nBecause the railway at Nikolayevsk had long fallen into disrepair, the Kwantung Army used this as a pretext to refuse to send troops into the town, and the Japanese could only rush reinforcements by sea. But the naval force sent to help was routed by the Soviet fleet. The panicked Japanese government could only hope its allies would arrive quickly, yet the Magadan coup made it impossible for its Far Eastern allies to answer Japan's appeal.\n\nIn the end the Japanese had to abandon the encirclement plan, and the Northeast Anti-Japanese United Army entered the port of Nikolayevsk."
 NEB_history.14.t: "1963 - Decision on Opening the Road Westward (Excerpt)"
 NEB_history.14.d: "The year 1962 was an extraordinary one for the land of China. The Mongolian civil war ended, the Xinjiang civil war ended, and Sichuan was unified; the territory held by the Party Central Committee had grown to half of China. Though we are still out of touch with the Party Central Committee, ever since the great victory at Hailanpao Japanese imperialism has stopped launching large-scale mopping-up operations, which has let us re-establish intelligence lines in the Far Eastern lands that once belonged to the Soviet Union. Still, we have no real control there and remain unable to attack cities such as Khabarovsk and Vladivostok. We must seek aid from outside. Yet the Russian warlords in the north are a reactionary regime with whom we can have nothing in common; Sakhalin in the east is in Japanese hands; and to the south is Manchukuo. The only road left to us, therefore, is westward.\n\nThe situation today is not what it was. Puppet Mongolia has pulled out of the eastern territories of the former Mongolian People's Republic, which means the forces of the Party Central Committee have drawn close to the Northeast and our straight-line distance from them has shrunk greatly. In other words, we need only cross the Greater Khingan - or, if the Russian warlords of the north agree to let us pass, come from the Amur and Chita into the Mongolian regions - and we can join up with the Party Central Committee. But the northern situation is still unclear, while the threat to our survival is immediate. After discussion, therefore, the Northeast Party Committee has decided that we will cross the Greater Khingan, open a direct route from Manzhouli——Hailanpao, enter the Mongolian regions through Manzhouli, and restore contact with the Party Central Committee.\n\nThus at the present stage the chief task of the Northeast Anti-Japanese United Army is to infiltrate the Khingan region, burst through the blockade, open the westward road, and return to the united front of the Party Central Committee."
 NEB_history.15.t: "1966 - Decision on Dispatching a Northeast Delegation Led by Liu Yalou into the Mongolian Region"
 NEB_history.15.d: "After discussion and study, the Northeast Party Committee has resolved to dispatch Comrade Liu Yalou, Chief of Staff of the Northeast Anti-Japanese United Army, to the Mongolian region to search for the Party Central Committee. All branches should step up their preparations and await the Center's orders."
 NEB_history.16.t: "1966 - §x(Top Secret)§! Directive Concerning Comrade Liu Yalou After His Arrival in Mongolia"
 NEB_history.16.d: "To all Party branches:\n\nOn arriving in Mongolia, Comrade Liu Yalou will immediately set up a radio and transmit an identification code. All underground radios of the Party branches must keep a constant watch; the moment a signal is received, identify its source at once, send back the identification code, and act on Comrade Liu Yalou's instructions. The identification codes will be delivered by a special courier.\n\nNote: This directive is strictly confidential and for senior Party committee members only.\n\n§xAnnotation: The two identification codes are 'Liberate the Northeast' and 'The Spark Never Dies'§!"
 NEB_history.17.t: "1966 - Directive on Resolutely Carrying Out the Party Central Committee's Order to Withdraw Westward (Excerpt)"
 NEB_history.17.d: "The Party Central Committee, mindful of the enormous difficulties of support, has decided that the Northeast Anti-Japanese United Army is to withdraw westward. After discussion and study, the Northeast Party Committee has resolved to obey the Party Central Committee's directive without wavering. The relevant directives of the Party Central Committee on the westward withdrawal are hereby issued to all Party branches; all branches must study them closely and truly grasp the spirit of the directives of the Party Central Committee and Chairman Mao. In this westward withdrawal all Party branches must do the following:\n\nFirst, adhere to the principle of voluntariness. No coercion is to be used, persuasion must be moderate, and the comrades' wishes must be respected. Even if they are unwilling to go, it does not matter - we shall return in the future.\n\nSecond, set up westward-withdrawal work groups. Every Party branch should form such a group to unify all work connected with the withdrawal. Since we must pass through areas held by the enemy and the puppet regime, united and secret action calls for a special organization.\n\nThird, do the ideological work of those left behind well. The liberation of the Northeast will still be long and hard; for the sake of that future liberation we must leave a number of comrades behind to work in coordination. We must do this work well, helping them understand fully that 'the westward withdrawal is for the sake of an eastward advance and a northern expedition later,' and appreciate the great significance of underground work behind enemy lines."
 NEB_history.18.t: "1966 - Announcement of the Establishment of the Northeast Bureau of the Communist Party of China (CPC) (Excerpt)"
 NEB_history.18.d: "Since the Northeast Anti-Japanese United Army began resisting the Japanese invaders in 1931, it has passed through many trials, withstood test after test, and surmounted obstacle after obstacle. Between the white mountains and the black waters we have waged arduous guerrilla war against the enemy, beating down the arrogance of Japanese imperialism so that it dared not stretch its claws over wider lands. The whole history of the United Army's struggle will be remembered by later generations.\n\nThe struggle is cruel and bitter. In nearly forty years of fighting, many comrades gave their lives on that rich and beloved soil. Many grew pessimistic, holding that the Northeast's liberation was now impossible, that the Northeast was doomed to subjugation and extinction, and that its people would be slaves of Japanese imperialism forever. Yet whether it was the signing of the 1947 Sino-Japanese traitorous treaty, or the civil wars in Xinjiang and Mongolia five years earlier, the Party Central Committee kept the banner of resistance aloft, enlarged the liberated areas, and brought about the unification of Northwest China. With our westward withdrawal completed and contact with the Party Central Committee renewed, the liberation of the Northeast is no longer a long, dark night, but a dawn close at hand!\n\nThe Party Central Committee seeks not only the liberation of the Northeast but the liberation of all China. That is why we are establishing the Northeast Bureau. Things must be done step by step: it is not only the Northeast that lies beneath the hooves of the Japanese invaders; the broad regions of North and South China are still under their colonial rule. Only by uniting the broadest masses of the people can we drive Japanese imperialism and the lackeys of the traitorous puppet regime utterly out of China.\n\nComrades, today is the day the Northeast Bureau is founded, and a new beginning for the Northeast's anti-Japanese liberation struggle. The Northeast Anti-Japanese United Army is no longer an isolated force; behind us stands a trusted and strong Party Central Committee, at once our leader and our mainstay. Let us rally around the Party Central Committee with Chairman Mao at its core and strive unceasingly for the liberation of the Northeast and of all China!\n\nThe meeting also resolved that Gao Gang should serve as First Secretary of the Northeast Bureau, Li Zhaolin as Second Secretary, Liu Yalou as First Deputy Secretary, and Zhou Baozhong as Second Deputy Secretary."
 NEB_history.18.o: "[GetYear] Year [GetMonth] Day X"
 NEB_history.19.t: "1967 - Decision on Resuming Construction of the Northeast Base Areas and Expanding the Intelligence Network"
 NEB_history.19.d: "To meet the needs of the coming liberation struggle and reduce needless casualties, the Northeast Bureau has resolved, after discussion and study, to resume construction of the Northeast base areas and enlarge the existing intelligence network. Building on our existing positions at Hailanpao and Nikolayevsk, we will restore the Outer Northeast base areas and the Heilongjiang base areas; the intelligence network must spread from the big cities to the whole of the Northeast. This is an important part of the coming liberation struggle and a major step toward the Northeast's liberation; every unit must give it due attention."
 NEB_history.19.o: "[GetYear] Year [GetMonth] Day X"
 NEB_history.20.t: "1971 - Decision on Supporting Our People's Liberation Army in Combat and Liberating the Northeast Completely"
 NEB_history.20.d: "Comrades of the Northeast, compatriots of the Northeast: Japanese imperialism will not accept defeat. After the founding of New China it actually dared to dream that Manchukuo might continue to exist, tearing the Northeast and part of North China away from Chinese soil. Such an unreasonable demand the Chinese people will never accept! Acting on the principle of government for the people, the Party Central Committee had hoped the Northeast might be spared the worst of the war, but the arrogance and presumption of Japanese imperialism wrecked all of that! They vainly imagined that New China would swallow the bitter fruit of a divided motherland, and that New China would grant them whatever they demanded. The Chinese people have never been a people content to be oppressed; they loathe and detest every act and every thought of splitting the motherland. The liberation of the Northeast, therefore, cannot be settled peacefully.\n\nYesterday the CPC Central Committee issued to the Northeast Bureau the 'Decision of the CPC Central Committee on the Liberation of the Northeast' and the 'Decision of the Central Military Commission on the Northward Advance of Our People's Liberation Army to Liberate the Northeast,' and these documents are now distributed to all organs. The Party Central Committee calls on us to support the People's Liberation Army's advance into the Northeast, to crush Japanese imperialism utterly and break its arrogance. Comrades, this is the final battle of the Asian peoples' war of liberation. We stand at the gate of history; all China and the whole world are watching us. We must fight this battle well and strive for the greatest victory! After discussion and study, the Northeast Bureau has decided that its principal task now is to devote every effort to logistical support for the People's Liberation Army, to the work of taking over, to the identification of refugees, and to the whole range of work in occupied areas. Beneath the triumphant advance of the People's Liberation Army, we go home!"
 NEB_history.20.o: "The Bugle Call of the Decisive Battle Has Sounded"
 NEB_history.20.tt: "Against §jJapanese imperialism§!, deliver §xthe final blow§!"

 #National Spirit
 NEB_ghost_army: "Ghost Army"
 NEB_ghost_army_desc: "To the whole of China, the United Army had long ceased to exist along with the dissolution of the Soviet Union. Yet the moves of Japan and Manchukuo have time and again proclaimed to the world that a ghost still hovers over the Northeast. Only we and our enemies know that we are here."
 NEB_insist_spirit: "Eastern Spark"
 NEB_insist_spirit_desc: "The prairie fire that once blazed in the east was long ago snuffed out by the Sino-Japanese ceasefire and the liberation of Xi'an. But does that mean defeat? No, it does not mean defeat. We are the last spark in the east, the raging flame that will burn all reaction to ashes. We are the seed of fire, and one day the soil of China will burn again - and this burning will consume every last trace of filth!" 
