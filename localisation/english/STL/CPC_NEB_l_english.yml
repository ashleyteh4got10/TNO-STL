 NEB_mission_1: "Infiltrate the Greater Khingan"
 NEB_mission_1_tt: "[NEB_mission_1_tt]"
 NEB_mission_1_tooltip: "In the spirit of the directives of §xthe Party Central Committee§!, we have decided to open up and consolidate a base area around Manzhouli. If possible, we also intend to take full control of the Greater Khingan."
 NEB_mission_1_sub_1: "Darkness Under the Lamp"
 NEB_mission_1_sub_1_desc: "According to the directives of §xthe Party Central Committee§!, our forces in §Ythe Northeast§! should establish a new base area near §GManzhouli§!. After extensive surveys, §WZalainuoer§! lies not far from §OManzhouli§! and is an ideal site for a base."
 NEB_mission_1_sub_2: "Clear the Obstacles"
 NEB_mission_1_sub_2_desc: "According to intelligence from inside sources, the Japanese have built §Ythe Northeast§!'s largest §jmilitary fortress§! at Hailar. This fortress has turned the whole city into a major military stronghold; the Japanese invested enormous resources here, building a total of five fortresses that form a fortress complex. If we can infiltrate it, this will become the ideal supply base for our army's future advance into §Ythe Northeast§!."
 NEB_mission_1_sub_3: "Shut the Door and Beat the Dog"
 NEB_mission_1_sub_3_desc: "The §GKhingan Tunnel§! is the only railway tunnel through the Greater Khingan. All Japanese military supplies pass through here into the western foothills of the Greater Khingan, and when our army crosses the range in the future, rail transport will have to pass through here too. Therefore, we must take this §Ostrategic stronghold§! into our own hands."
 NEB_mission_201: "Chinese Eastern Railway Plan"
 NEB_mission_2_tt: "[NEB_mission_2_tt]"
 NEB_mission_201_tooltip: "The Chinese Eastern Railway is the lifeline of all §Ythe Northeast§!. This proposal was put forward by Liu Yalou, with the aim of using §GHarbin§! as a base from which to build an intelligence network running north and south."
 NEB_mission_201_sub_1: "Seize the Hub"
 NEB_mission_201_sub_1_desc: "§GHarbin§! is the heart of the entire Chinese Eastern Railway. Whether in the future we advance east out of the Greater Khingan or head north into the Outer Northeast, §GHarbin§! is a strategic hub we must capture."
 NEB_mission_201_sub_2: "Open the Pass and Break the Enemy"
 NEB_mission_201_sub_2_desc: "Jinzhou is the southern gateway to §Ythe Northeast§!. If our army is to advance north from Shanhaiguan in the future, this is a place we must pass through. Therefore, taking control of it in advance will aid our northward advance."
 NEB_mission_201_sub_3: "Aid to the Outer Northeast"
 NEB_mission_201_sub_3_desc: "While attending to the mainland of §Ythe Northeast§!, we must never forget the existence of §Rthe Outer Northeast§!. They will also be of help to our plans."
 NEB_mission_202: "Outer Northeast Restoration Plan"
 NEB_mission_202_tooltip: "§RThe Outer Northeast§! is the cornerstone of the anti-Japanese struggle in §Ythe Northeast§!. This proposal was put forward by §WChoi Yong-jian§!, with the aim of rebuilding the anti-Japanese base areas in §Rthe Outer Northeast§!. This will not only create strategic pressure on §jJapan§! from the north, but also let us build better ties once more with our comrades in §RKorea§!."
 NEB_mission_202_sub_1: "Rebuild the Heart"
 NEB_mission_202_sub_1_desc: "§GKhabarovsk§! is the second-largest city in §Rthe Outer Northeast§!. It stands at the confluence of the Heilongjiang and the Ussuri, linked to §WVladivostok§! in the south and §WHailanpao§! in the north. §GKhabarovsk§! was also once the underground intelligence core of the Northeast Anti-Japanese United Army. Therefore, our first stop is to rebuild this heart."
 NEB_mission_202_sub_2: "From North to South"
 NEB_mission_202_sub_2_desc: "§RKorea§! is the rear base of the enemy forces in §Ythe Northeast§!. But if we set out from Vladivostok and follow the §GYalu River§! line straight to Dandong, we can throw the enemy into panic and cut off their supplies."
 NEB_mission_202_sub_3: "Advance into the Northeast"
 NEB_mission_202_sub_3_desc: "Our purpose in rebuilding §Rthe Outer Northeast§! is not merely to restore our strength, but to recover our ancestral land. We must be ready to advance into §Ythe Northeast§! once §Rthe Outer Northeast§! has been restored."
 NEB_mission_3: "Reorganize and Prepare for Battle"
 NEB_mission_3_tooltip: "The main task of §xthe liberation of the Northeast§! still falls to the §RPeople's Liberation Army (PLA)§!. Now that the Northeast Bureau has infiltrated back into §Ythe Northeast§!, there is an urgent need to strengthen coordination between the Bureau's comrades and the PLA's comrades - for example in intelligence work and the takeover of cities. Only by properly coordinating these non-military aspects tied to the war effort can we ensure the smooth progress of §xthe liberation of the Northeast§!."
 NEB_mission_3_sub_1: "Building Bridges"
 NEB_mission_3_sub_1_desc: "The §RPLA§! is the main force behind §xthe liberation of the Northeast§!. The Northeast Bureau will carry out a series of activities to deepen the §RPLA§! comrades' understanding of the §xNortheast Bureau§! comrades and break down the barriers between the two sides."
 NEB_mission_3_sub_2: "Strengthen Construction"
 NEB_mission_3_sub_2_desc: "Unity is not one-sided; it is a joint effort. The Northeast Bureau will hold a series of meetings to systematically study military knowledge and strengthen its ties with the §RPLA§! comrades, enhancing mutual understanding."
 NEB_mission_3_sub_3: "Unified Action"
 NEB_mission_3_sub_3_desc: "After a series of activities and meetings, the comrades of §xthe Northeast Bureau§! and the §RPLA§! have gained a sufficient understanding of one another. Next, a joint meeting of both sides will be held to settle their concrete actions and strategic arrangements."
