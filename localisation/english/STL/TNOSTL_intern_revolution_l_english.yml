 RAS_shameful_display_desc: "It's over, all over. We staked the future of the Australian Communist Party on victory in the Australian Civil War, and it all turned to dust as the junta's flag rose over the last stronghold on the mainland. There is nothing we can do but silently swallow the bitter pill, let Peterson celebrate his \"counterinsurgency success\" to himself, and face the tangled mess of the island's situation after our retreat to Tasmania..."

