#Postwar event chain
STL_CPC_2_main_story.1.t: "The Clay Buddha Resting by the River Bend"
STL_CPC_2_main_story.1.d: "Zhu De leaned on a cane and strolled through the park, supported by others. Eighty-six springs and autumns had passed over the old man; he should have been enjoying his remaining years in peace, yet he was eking out an existence under an empty title. Whether from fear that no successor would follow him, or from fear that he might suddenly die, the old man kept pressing stubbornly forward.\n\nAt a pond he was finally able to rest. He sat on the bench beside the water, gazing at its glittering surface — but the pond was a stagnant pool, murky and fishless; even if he tried to see something in the water, all he found was his own reflection. Two trees grew around the pond, a black-barked Chinese pine and a Mongolian pine. Zhu looked at the Mongolian pine, lush and straight, green even in winter; then at the Chinese pine, its trunk black as night, yet not as tall as the other.\n\nAs he silently watched the two pines, Zhu could not help recalling their origin. In those years many people from the Northeast had settled in Xi'an, and two households had become neighbors. The two families were of the same clan, one branch split from the other, yet for various reasons they had long been on bad terms. As time passed, with the help of cadres the two families buried the hatchet; to mark their reconciliation they planted saplings brought from the Northeast by this pond. More than twenty years had slipped by in a flash; the once tiny saplings had long since grown. Though the two families had since returned home, their bond remained here.\n\nWith trembling hands Zhu drew a sheet of paper from his coat and, wearing his reading glasses, scanned it as quickly as he could. The content was fine, the format correct; only the last step remained. He folded the paper and slipped it into the prepared envelope. Slowly he rose and, supported by his guard, continued on into the distance. When his shadow vanished along the boardwalk, only his muttering echoed through the deserted park."
STL_CPC_2_main_story.1.o: "'If only they could be like these two trees.'"
STL_CPC_2_main_story.2.t: "The East Wind Swells"
STL_CPC_2_main_story.2.d: "Deng stood on Xi'an's city wall, hands behind his back, gazing out at the lights of ten thousand homes. Usually wreathed in cloud and mist, he now had only a thin wisp drifting in the air. Beside him the guard watched the pile of documents at his feet, watched the leader enjoying the view, and rubbed his already aching arm.\n\n'Let's go back.'\n\nDeng descended from the gate tower, and the great red banner 'Celebrating the Liberation of the Whole People' caught his eye. Over there an Ansai waist-drum performance was reaching its climax; a man in a green military cap was sharing Mongolian milk candy with a shy girl; a storyteller's consummate vocal mimicry drew a round of cheers; on the stage, a man in an Eighth Route Army uniform and a man in a Japanese army uniform held the same type of gun, their mock duel drawing bursts of applause.\n\nAt some point the sign for the Central People's Administrative Committee came into Deng's view — though it had been renamed the State Council, they had not yet taken the sign down. Deng gazed at it a while, then shook his head and moved on.\n\n'When will the 10th Congress be held?'\n'Don't know, but surely soon. I heard Secretary Deng's driver say that Secretary Deng has already done the groundwork.'\n\n'Ah, good news at last. So who will be president?'\n'Do you mean of the Party or of the state?'\n'Both.'\n'That I can't say. But it'll be either Secretary Deng, or...'\n'Him? But his age...'\n'What about his age?'\n'Well, it's just that this isn't... oh, I see.'\n\nAfter passing through the alley filled with every kind of sound, Deng rubbed his temples. Just then the guard, holding the documents, reminded him: 'Sir, these papers really can't wait any longer today.'"
STL_CPC_2_main_story.2.o: "'I know, I know. Let's go back, then.'"
STL_CPC_2_main_story.3.t: "A Turning Point"
STL_CPC_2_main_story.3.d: "'This was the last time the Communist Party of China held its national congress in Xi'an; to convene it, the Party Center became the last central institution still in Xi'an.\n\nOn the final day of the congress, reporters from newspapers around the world were crowded at the gate of the 10th Congress venue. When Deng led the other leaders out of the gate, the reporters with their long lenses and microphones nearly broke through the cordon. Secretary Deng, please give us your views on your nomination as President! Secretary Deng, what will the CPC's policies be next? Secretary Deng, your party promised after the war to convene a National People's Congress as soon as possible — when will it be held? Question after question nearly left Deng tongue-tied, and he felt keenly that the Communist Party of China was no longer a regional party but a national ruling party.\n\nThe reporters had countless questions, but Deng was only one man; unable to cope, he asked them to put their questions one at a time, in order. On the Party's postwar national policy, Deng answered: this congress had set the three-year postwar guideline, 'two years of reconstruction, one year of transformation.' The east had only just been liberated, the people's lives were hard, and reactionary forces were still rampant; they planned to spend two years dealing with that. Socialist transformation was basically complete in the west, and they hoped to finish nationwide transformation in about a year. On the National People's Congress, Deng replied: after careful discussion and assessment at this congress, the earlier decision to reorganize the Central People's Administrative Committee had been too hasty; the congress had therefore redefined the committee's role, suspending its reorganization, leaving any already reorganized units untouched, and the Central People's Administrative Committee would assume the duties of the Central People's Government and the National People's Congress.\n\nDeng did not, however, offer his own views on being nominated for President. Perhaps even this man in his seventies still had a streak of stubbornness in him."
STL_CPC_2_main_story.3.o: "The journey of New China begins here"
STL_CPC_2_main_story.3.tt: "Please check the §RParty Affairs§! and §BGovernment Affairs§! GUIs, begin the reconstruction of §xNew China§!, and prepare for §Rsocialism§! building."
STL_CPC_2_main_story.4.t: "Eastward"
STL_CPC_2_main_story.4.d: "Once past the Yangtze, the whole scene changed.\n\nEverywhere there was water. The fields were paddies, the roads were waterways, even the air was damp. Li Taigen stepped down from the truck and felt the earth underfoot — it was soft, unlike the soil of his old home, hard and compact. Back home the mountains were stone mountains and the slopes steep; when you stepped on them they were solid, and you knew where you stood. Here, two steps and your soles were caked with mud, sticky and impossible to shake off.\n\nHe stood by the road, lit a cigarette, and gazed at the gray village in the distance, his heart empty. Before coming, he had gone over his notebook again and again — population, yields per mu, the course of the rivers, a whole book crammed with figures. But standing here on this soil, those words suddenly floated off the page and would not match what lay before his eyes. He knew dikes needed repairing and canals digging, things he could do blindfolded back home, yet here he did not know where to begin. There was too much water — too much for him to know how to handle. On the dry land back home, you dug a channel and the water followed it; here the water would not obey — block it and it bored elsewhere, channel it and it lay stubbornly still.\n\nThe first time he went to the township office, a young local briefed him at length and he caught only three words — water, fields, hard. He asked the messenger: 'What did he say?' The messenger shook his head too. The two looked at each other, laughed, and felt a lump in their throats afterward. He suddenly remembered what his leader had said before he left: 'You're going to take over a mess, not take over a plot of land.' Only now did he grasp the flavor of it. Land was dead, people were alive; a mess was a tangled account of people and land intertwined, to be unravelled from the start.\n\nThe next day he woke at five-thirty — he had woken at that hour for decades and could not change it. He fastened the buttons of his Sun Yat-sen suit, washed his face with cold water, and called to the messenger: 'Come on, into the village.'\n\nSeveral peasants squatted under the old locust tree at the village entrance and shrank back when they saw him coming. Li said nothing, squatted with them on the stone roller, fished half a pack of cigarettes from his pocket, put one in his mouth and held one out. An older man took it. Li grinned, pointed at the crooked dike by the river, and said in a thick southern Shaanxi accent: 'This dike won't do.' The man said nothing, nor did he hand the cigarette back. Li squatted there and finished his smoke, and suddenly understood something — in these parts, you had to let people accept you as a person before they would accept your methods. He used to start from the blueprints; now, because he was an outsider, he had to start from squatting on a stone roller and offering a cigarette."
STL_CPC_2_main_story.4.o: "Starting from zero, beginning anew"
STL_CPC_2_main_story.5.t: "Directive on the Rapid Establishment of Accelerated Cadre Schools"
STL_CPC_2_main_story.5.d: "To the provincial, municipal, prefectural and county Party committees of every region:\n\nAt present the nationwide war of liberation has achieved decisive victory and the newly liberated areas are expanding rapidly. Work in every locality — taking over cities, building rural administrations, managing finance and economics, restoring culture and education — is being launched on all fronts, creating an urgent need for large numbers of trained grassroots cadres to fill the posts. The present numbers fall far short of actual needs, and with cadres frequently transferred southward and eastward, every locality faces the pressing situation of a 'cadre shortage.'\n\nTo meet the demands of the situation, all localities must immediately set about establishing accelerated cadre schools. Through short-term training they should absorb large numbers of activists from among workers and peasants, young intellectuals and progressive figures from the newly liberated areas, giving them concentrated instruction in policy, mass-work methods and basic administrative skills. Each course shall last no more than three months, with the aim that what is learned can be applied at once and graduates can take up their posts immediately. The schools must combine theory with practice, use local typical cases as teaching material, and emphasize the ability to solve real problems.\n\nParty committees at all levels must treat the accelerated cadre schools as the top priority at present, select capable cadres to serve as instructors, and guarantee funding and premises. They must overcome passive attitudes such as 'take it slow' and 'wait for conditions,' and push the work forward in a fighting spirit. The training of cadres bears on the consolidation of the regime and the support or opposition of the people; the slightest delay will jeopardize the larger cause. On receipt of this directive, all localities are to study and make arrangements at once, open their first classes within a set time limit, and report the situation promptly.\n\nNotes:\n1. This directive is issued to all provincial, municipal, prefectural and county Party committees, and shall be personally supervised by the leading comrades of each committee.\n2. The first class of the accelerated cadre schools must formally open within thirty days of receipt of this directive; no pretext for delay is permitted.\n3. The criteria for selecting students, the teaching syllabus and the budget shall be reported to the higher Party committee for the record before classes begin.\n4. This directive takes effect from the date of issue. Any previous regulations conflicting with it are superseded by this directive.\n\nCentral Committee of the Communist Party of China"
STL_CPC_2_main_story.5.o: "[Getyear] Year [Getmonth] X Day"
STL_CPC_2_main_story.6.t: "Rain"
STL_CPC_2_main_story.6.d: "The late-spring rain fell for three days straight, seeping pale-yellow stains into the white walls of the archive. Lin Shouqian stacked the last personnel file of the puppet municipal government into a wicker crate; at the bottom lay half of an unfinished résumé form — he had prepared it for himself the previous winter, but had never used it.\n\nOutside the window, the plane trees were shedding last year's fruit, each one thudding dully on the flagstones. He remembered the winter of the 36th year of the Republic, another rainy day like this, when Deputy Director Chen Bozhao entertained guests at his residence, the gramophone playing 'Night Shanghai,' cigar smoke mingled with the scent of Tokyo perfume drifting down from the second floor. Chen's wife had bought a new mink coat, said to have been brought back from Manchukuo through an intermediary.\n\nLin's salary had already been three months in arrears. His wife sat in the inner room stitching shoe soles, always twisting the thread extra long, as if longer thread might make the days stretch out. His elder daughter needed school fees; his little son's cough would not go away. He had asked in the finance office several times, but the section chief only turned the gilt-edged ledger and shook his head, saying nothing had been allocated from above. Yet the month before, Chen had changed to a new car — a Toyota sedan, gleaming like a piece of dark jade.\n\nThe dismissal notices had been posted at the start of the month. Red paper, black characters, stamped with a vivid seal. Colleagues from the office gathered under the veranda to read, none speaking. Then came the handing over of keys, seals and files. Lin surrendered the brass key he had used for four years, the metal still warm from his palm.\n\nOn the last day he carried the wicker crate to Old Zhou in the gatehouse. Turning back, he saw a pin left on the empty shelves of the archive — silver, set with a tiny sapphire, dropped by some female employee, he knew not whom. Perhaps Chen's secretary, the girl who always wore an Indanthrene qipao, who had disappeared the month before.\n\nThe rain stopped. From afar came the new government's broadcast, every word distinct. Lin walked across the wet courtyard, his soles covered with fragments of plane-tree leaves. He did not look back, only paused at the gate. The sign reading 'Municipal Government' on the lintel had been taken down, leaving pale wood beneath, like a healing wound."
STL_CPC_2_main_story.6.o: "Times Have Changed"
STL_CPC_2_main_story.7.t: "Retained in Service"
STL_CPC_2_main_story.7.d: STL_CPC_2_main_story.7.d: "Zhou Mingyuan set his fountain pen on the inkstone; the form, its ink still wet, was headed 'Approval Form for Proposed Retention of Personnel.' From outside came the rehearsal of a waist-drum troupe, dong-qiang, dong-qiang, shaking the accumulated gloom of the office out of it.\n\nHe remembered when he first came to this room three years ago, the walls plastered with slogans 'Resist Communism, Save the Nation.' He was a junior clerk then, handling household-registration files. One night on duty he saw a secret wanted list with several students' names — one of them he had taught at the night school, always sitting in the last row, taking meticulous notes. Zhou slipped that list to the bottom, and the next day filed it under 'closed.' The student was arrested anyway; he often thought how much better it would have been if he had been bolder.\n\nMost of his colleagues were gone. The section chief surnamed Huang had flown to Taiwan before the PLA arrived, urging him on the way: 'Little Zhou, aren't you coming?' Zhou shook his head. He thought of the previous winter, when the municipal government distributed rationed rice to each office; Huang had told him to swap his third-grade rice for first-grade and take it home, but he quietly swapped his own portion back, poured it into the big pot in the canteen, and told the cook: 'Let everyone share it.'\n\nThe retention interview took place in the new government's office. His questioner was a young man in a gray cloth uniform, not much older than himself; Zhou's file lay open on the desk, its corners curled. The young man asked about his family and work experience, paused at one page, and asked: 'The winter before last, you were in the archives section?'\n\n'Yes.'\n'There's a wanted list whose numbers don't match the final number of arrests.'\n\nZhou's palms broke out in sweat. He lowered his head and saw the frayed cuffs of his sleeve.\n\n'Three names are missing. Do you know who they were?'\nHe was silent a moment, then said: 'I crossed them out.'\n\nThe young man closed the file, stood up, and held out a rough hand callused from work. As Zhou took it, he heard the man say: 'Welcome to stay.'\n\nNow he was still in the same office, only the slogan on the wall had changed — 'Serve the People.' The waist-drum rehearsal had broken up, and from downstairs came children singing a new song. Zhou went on filling in the form; the last column read: 'During his service in the old institution, this person did not oppress the people and showed concern for protecting progressive figures. Retention recommended.'"
STL_CPC_2_main_story.7.o: "A new job is about to begin"
STL_CPC_2_main_story.8.t: "Filing a Complaint"
STL_CPC_2_main_story.8.d: "On the threshing ground at Zhao Family Gully, the gong sounded three times.\n\nWang Laoshuan crouched beside the stone roller, the ember in his pipe glowing and dimming. He eyed the heap of new grain in the middle of the ground — covered with a red cloth, said to be relief grain allocated by the authorities — yet Li Degui of the village office had said three days ago that it had 'come down from above,' and still had not distributed it. The night before, Old Shuan had gone to Li's house to borrow a millstone; through the firewood gate he saw Li's wife pouring wheat into a jar, good white grain, half a sack of it.\n\n'There's an ink stamp with the word 'relief' on the corner of that sack,' Old Shuan told the militia captain that morning, his throat tight. Twenty years as a hired hand in the old society had taught him the difference between public grain and private grain — what was in Li's jar and what lay under the red cloth on the threshing ground were the same kind of sack.\n\nThe gong ceased. Nearly a hundred people had gathered on the threshing ground, more than at New Year. Li stood on the opera stage in a half-new blue cloth shirt, a pen tucked in his belt, saying the relief grain had to wait for 'overall arrangements' and that everyone should 'trust the organization.' No one below answered.\n\nWang pushed his way to the front, fished a small cloth bag from his coat with a few wheat kernels in it, and held it up, his hand trembling: 'Director Li, how is the wheat in your jar the same grade as this relief grain?'\n\nThe ground went quiet for an instant, then boiled over like a pot of water. Er'ya said she had seen Li carrying things home the day before yesterday; Daniu said Li's brother-in-law ran a mill and had taken in no grain lately but turned out three sacks of white flour. Voices grew louder, rising from under the eaves, from beside the roller, from the middle of the crowd, merging into a rumbling thunder.\n\nLi's face went white. He pulled out a handkerchief to wipe his forehead — the cloth was dazzlingly white.\n\nThe new district work team leader, surnamed Wu, had stood outside the crowd listening for a good while. He had the militia ask Li down from the stage and sent men to search his house. Two hours later the relief grain from the jar was carried onto the threshing ground — four sacks and seven sheng in all, seals intact, ink stamps clear. At the mass meeting the next day, Li stood on the stage, the pen gone from his belt, his blue shirt creased. Wang sat in the front row for the first time, still clutching the little cloth bag. Captain Wu said this was democracy — the people's eyes are sharp.\n\nWhen the grain was being divided, Wang carried his sack to the heap, grabbed a handful of new wheat and held it under his nose — it smelled of sun-drying. He glanced back at the old locust tree at the edge of the ground: three years earlier a KMT security chief had hanged a tenant who owed rent from that tree; now it was tied with red silk, put up by the new government for a meeting.\n\nOn the day Li was led away, he passed through the village gate and no one watched him. Only a yellow dog followed him a little way, then turned back."
STL_CPC_2_main_story.8.o: "If not for the people's livelihood, then for the people's death"
STL_CPC_2_main_story.9.t: "Beside the Sunken Boat"
STL_CPC_2_main_story.9.d: "On the Shanghai Bund the plane trees had not yet budded, but the 'Three Antis' campaign had already swept the whole city. Zhou Mutao, a chief clerk retained from the former Kuomintang finance bureau, a Fudan commerce graduate and an expert in finance, became a key target of 'help' in the storm.\n\nHis 'bourgeois habits' had long been noted by his colleagues: every morning he steeped Longjing tea and scanned the newspaper before strolling into the building, merely nodding and smiling at colleagues of worker or peasant origin; at lunch he would secretly pull a Japanese edition of Principles of Accounting from his drawer, fingering it like a relic of a bygone age; after work he could not break the habit of going to Avenue Joffre for a cup of black coffee, as though those two dimes could wall him off from the clamorous new world. These small daily details were one by one dragged out at the criticism meeting and turned into evidence of a 'problematic ideological stance.' The military representative pounded the table: 'You understand the work, but you use your expertise as capital to look down on the masses — that is bourgeois superiority!'\n\nZhou stood on the platform, his lips moving but no words coming. He had indeed never embezzled, nor opposed the new regime; yet that ingrained sense of 'I am different from them' was like a transparent shell sealing him off from everyone around. Watching his old colleagues vie with one another in tearful self-criticism and ten-thousand-character statements drawing boundaries, he felt both contempt and panic — contempt at how quickly they changed faces, panic that if he did not change too he would sooner or later be dismissed.\n\nThe turning point came on a murky rainy day. Little Wang, a demobilized soldier, came to him with the account books, saying an old entry did not balance; he was so anxious his clothes were half soaked. Zhou meant to fob him off with a few words, but saw the sincere urgency in the young man's eyes — in that moment he remembered himself when he had first entered the trade. He sat down and taught Wang item by item how to check the original vouchers and verify account balances, talking the whole afternoon. After Wang left, Zhou sat in the empty office; outside the rain gradually stopped and the sky grew faintly light, and the ice in his heart seemed to crack.\n\nLater, at a self-criticism meeting, he spoke the truth: 'I turned accounting into a wall separating me from the masses.' He thought candor would earn him a chance, but the campaign tightened its grip; the organization judged that he was 'too rooted in the old intellectual habits, not thoroughly enough remolded,' and he was still listed for dismissal. On the day he left the finance bureau, he left the Japanese Principles of Accounting in the empty drawer."
STL_CPC_2_main_story.9.o: "And the train of a new era has already rumbled away."
STL_CPC_2_main_story.10.t: "All Under Heaven, White with Snow"
STL_CPC_2_main_story.10.d: "Northward through Shanhaiguan, the deeper we went the harder the ground grew; by the time we trod the frozen soil of the Northeast, our soles ached and the cold seeped through. The mountains were a heavy black, the rivers a frozen white, villages scattered in snowdrifts, quiet — you would never guess a war had just ended. That was my first impression of the land beyond the pass.\n\nSince the Japanese withdrew, the countryside beyond the pass could hardly be called peaceful. Bandits on horseback appeared often, carrying off no small amount of the villagers' property; one peasant specially reported: 'Hey, would you believe it — those Japanese know how to hide better than the bandits! The ones who couldn't get away simply holed up in that abandoned kiln behind the hill, and came down in the middle of the night to steal sweet potatoes.'\n\nAt the first cockcrow the next day I was up and walked toward the hill by the light of the snow; dawn comes slowly in the Northeast and I could not see clearly, so I took several comrades up with me.\n\nThe abandoned kiln was not hard to find — halfway up the slope, three earthen chambers, originally for charcoal. Half the doorway had collapsed, leaving a black hole facing the gully. Before we reached it we caught a smell — mildew mixed with the sweet stench of rotting sweet potatoes, sharp in the nose; and a faint, wandering whiff of iodine. I crouched to look at the ground first: there were footprints in the snow, not Chinese cloth boots but the marks of reversed-leather army boots, evenly sized, the soles worn smooth at the forefoot. Characters were carved into the kiln wall, legible in the snowlight — the character 'zheng' (a tally mark), row upon row, the last one stopped at the third stroke. Beside them more words, still in Chinese: 'Ninth day of the fourth month, snow, no rice.'\n\nI struck a match and peered in: a tattered quilt, and beside the bedding roll a water jar, its rim all chipped, with Japanese characters cut into it, half a jar of clear water still inside; at the far end against the wall a heap of gnawed sweet-potato peelings. From deep in the kiln I heard a cough — a human voice, very faint; at first I thought it was Japanese, but the cough did not come again, only the wind pouring in through the collapsed roof. Soon after, a comrade with us found a person already dead in a recess of the cave.\n\nWhen we came back out, smoke was rising from the distant village; it must have been time to prepare breakfast. I looked once more at that black hole — they had settled in, much as in Guangdong, no doubt; they really did know better than bandits how to hide.\n\nSpring was the busy farming season in the Northeast. From the mouth of the kiln one could see the villagers working the fields. After the Japanese surrender, destruction here had been somewhat less than elsewhere, but no better for that. The people loathed those Japanese — they were invaders, and they were still scattered widely through the villages beyond the pass. These drifters, together with the afflicted villagers, ought to be dealt with more properly."
STL_CPC_2_main_story.10.o: "June 14 — Liu Sheng, submitted to the Central Committee"
STL_CPC_2_main_story.11.t: "Helpless"
STL_CPC_2_main_story.11.d: "Ji Dengkui felt deeply uneasy as he investigated and visited in Shangluo. In an empty pig farm, he listened to Uncle Zhao pour out his troubles: 'Our family had thirty pigs. Ever since the higher-ups said we had to restore production in the eastern economy, we voluntarily gave up two pigs. At first there were subsidies and the family could carry on, but then an order came down from above and they took every one of our pigs. They paid compensation, but there's not a single place within thirty li selling piglets. Now we live on the subsidy and the allowance sent home by my second son in the army. I know the east is having a hard time, but that's no reason not to let the people here live!'\n\nUncle Zhao kept sighing, tapping his cane on the ground as he spoke. Ji could think of nothing comforting to say and took his leave. He went to the county government to ask the grassroots staff about the details. Old Li, the village Party secretary, tapped his cigarette and sighed: 'Leader, let me be frank — those thirty pigs really were handed over, and not only the pigs: three thousand jin of wheat from our county were handed over too. That wheat was surplus to begin with; now our county hasn't a grain of surplus left.'\n\nJi remembered an earlier investigation in a village in Shandong, where he found the land recorded did not match reality, some fields lying waste; many landlords hoarding grain and creating refugees to storm the local Party and government offices; and some peasants secretly hiding relief supplies, so that much grain and livestock went to waste.\n\nThinking back ten years, the Party Center had faced a similar situation, but it had acted at once, launching a vigorous land-inspection campaign that clarified production and living conditions in most areas. Now, shouldn't the experience of the past be used to solve today's problems?"
STL_CPC_2_main_story.11.o: "It Must Be Done"
STL_CPC_2_main_story.12.t: "Annual Leave"
STL_CPC_2_main_story.12.d: "Liu Lantao, having got his annual leave, was resting on a bench in his old home when his neighbor Old Wang came by pushing a walk-behind tractor and greeted him: 'Old Liu, long time no see!' 'Old Wang, long time no see.' 'What are you doing back from Beiping?' 'Annual leave — I came back to see my parents.' Liu looked at the tractor: 'Old Wang, does it handle well?' 'Handles fine, fine. Ever since this tractor, my back isn't stooped anymore. Today at work, Old Zhang's family asked for a day off and I used this tractor to do their work too.'\n\nOld Wang took off his gloves and wiped the sweat as he asked: 'Old Liu, what's Beiping like?' Liu smiled: 'Very big.'\n'And the people?'\n'Very good, all very down-to-earth. But our village — I remember last year you took in a lot of refugees from the east. How are they?'\n'Long gone home. They said they got letters from their folks saying the Communist Party had been good to them and things were looking up, so they packed up and left in a hurry. Say, Old Liu, aren't you in Beiping? How's the east?'\n'The tractor in your hands is a common sight in the east now. Land is doing well this year; if all goes smoothly we'll be shipping more grain west.'\n'That's good. We've finally seen the light at the end of the tunnel.'\n\nOld Wang lit a cigarette, a gray cloud dispersing in the air. The red sun hid half its face, peeking slyly at the loess slopes; a few small-leafed poplars scattered over the broken hills, and a brook murmured from the village entrance toward the east. Just then two white specks appeared on the winding road, the roar of an engine growing louder; Liu saw at a glance it was a delivery truck.\n\n'Fellow villagers, the county's sending out benefits! Specialties from the east!'"
STL_CPC_2_main_story.12.o: "Life is finally looking up"
STL_CPC_2_main_story.13.t: "A News Item（1）"
STL_CPC_2_main_story.13.d: "Eastward-working teams of cadres seconded from the old liberated areas have penetrated the newly taken-over regions of the east to conduct in-depth investigation and guidance on restructuring grassroots economic organizations and restoring production. After the violent upheavals of the great war and the collapse of the old order, the east's commercial networks and production chains were severely damaged; ordinary peasant households and artisans face shortages of means of production and broken sales channels, and urgently need new forms of organization to reintegrate productive resources.\n\nInspecting a newly established supply-and-marketing cooperative pilot in the east, the central specially dispatched cadre in charge of eastward guidance explained in detail to the local coordinators accompanying him: 'We have accumulated extremely rich experience in cooperation in the old liberated areas. By organizing scattered peasant households, small assemblers and artisans, we can not only straighten out the channels for unified procurement and marketing and reduce the market risk borne by individuals, but also, during the transitional period while order is being restored, concentrate and allocate limited resources to guarantee the people's most basic daily supplies.'\n\nA local people's representative replied in the conversation: 'In the past everyone worked on his own, and we simply couldn't withstand a famine or a price swing. Now that the cooperative handles distribution uniformly, we finally feel secure.'\n\nThe head of the East China Bureau, presiding over the administrative coordination meeting, summed up after hearing the reports: 'Logistics and finance departments at every level have been closely watching the restoration of the east's supply chains. The practical experience brought by the veteran cadres shows that encouraging and guiding cooperative construction is entirely in line with our current organizational principles; it helps bring the east's scattered resources and labor back into a unified framework of coordination, providing solid grassroots support for overall stability and the coming economic transformation.'\n\nThe meeting finally decided to sum up the pilot experience of the eastward work teams and extend the supply, marketing and production cooperative system comprehensively across all counties and districts in the east, streamlining local distribution networks and consolidating the grassroots economic base."
STL_CPC_2_main_story.13.o: "Spread the cooperative experience, stabilize order in the east."
STL_CPC_2_main_story.14.t: "A News Item（2）"
STL_CPC_2_main_story.14.d: "As the situation in the east gradually stabilized, universal education and ideological work were formally placed high on the agenda of the Administrative Coordination Committee. The newly liberated areas had long suffered the double influence of the old order's policy of keeping the people ignorant and the shadow of war; literacy among the grassroots population was generally low, many could not even read the most basic notices, and the dissemination of administrative orders and policy often met obstacles from the cultural gap and lagging information.\n\nOutside the classroom of a newly built grassroots night school, visiting instructors chatted warmly with several students from the newly liberated areas who had just come in from a day's work. A local resident who had returned to the classroom held a pencil and spoke of his own experience: 'Under the old system we couldn't read official documents and could barely write even our own names; we were always being duped by the propertied and the old officials. Now, educated again at the night school and learning to read and follow the news, we feel for the first time the dignity of working people and hope for the future.'\n\nThe young teacher in charge of the night school also told the inspection team: 'Everyone is extremely eager to learn. Many come straight to class after work and supper, and even quiz each other on words after lessons.'\n\nThe special commissioner of the Ministry of Education stressed at the educational work coordination meeting: 'Literacy work is by no means a simple spread of cultural knowledge; it is a profound task of organization and political mobilization. Only when the people of the newly liberated areas master the tools of culture can they truly understand the intentions of the revolutionary committee's policies and take an active part in local public affairs and the building of the new order.'\n\nThe defense and administrative coordination departments promptly signed a joint agreement to increase resources and teacher guarantees for literacy night schools in all grassroots communities of the east, making cultural literacy the key lever for consolidating the popular base in the newly taken-over areas."
STL_CPC_2_main_story.14.o: "Knowledge is power — universal education."
STL_CPC_2_main_story.15.t: "A News Item（3）"
STL_CPC_2_main_story.15.d: "The Central Administrative Coordination Committee held a special closed seminar on ecological restoration in the east and the planning of water conservancy works on the great rivers. The maps of eastern water systems and geology spread out on the conference table showed that, owing to prolonged war damage, overexploitation by the old regime and the lack of coordinated management, local water facilities had fallen into widespread disrepair, soil erosion had worsened, and seasonal droughts and floods occurred frequently — severely constraining long-term defense logistics and stable agricultural production.\n\nAfter reading the in-depth research report submitted by the planning department, the Central Minister of Water Resources pointed out: 'From the perspective of overall strategy, the fragility of the east's ecology and the decay of its water facilities already directly affect the stable supply of the country's basic resources. Building waterworks and managing river basins is by no means merely an agricultural or economic issue; it is a fundamental matter bearing on whether the whole eastern security shield can be consolidated over the long term and whether national strength can be smoothly restored.'\n\nWater engineering experts showed survey data to the delegates: 'If we give priority to repairing the large dikes at key nodes and building diversion canals, we can not only withstand floods effectively next spring but also provide stable irrigation water for hundreds of thousands of mu of good farmland around them.'\n\nLocal administrators also said: 'Past experience in ecological management shows that rational allocation of water and better flood-control and storage facilities can markedly raise local resilience to natural disasters. Central coordination of large water projects is entirely in everyone's long-term interest and will have the full cooperation of departments at all local levels.'\n\nThe Center finally approved the project proposals for large water hubs and soil-and-water conservation works in the east, decided to allocate special war-readiness and construction resources, and formally launched the first phase of large-scale water conservancy works."
STL_CPC_2_main_story.15.o: "Coordinate ecological management, build infrastructure."
STL_CPC_2_main_story.16.t: "A News Item（4）"
STL_CPC_2_main_story.16.d: "Local governments and war-preparedness industrial departments jointly held an on-site work meeting to explore in depth how rural micro-industries and township handicrafts could ease the strain on urban heavy-industry supply chains. In the reconstruction period after the great East Asian war, the big city factories were working at full capacity on heavy equipment, key components and core materials, with no spare effort for basic parts, small farm tools or light consumer goods.\n\nAfter visiting an intensive rural iron-and-wood processing and component-making plant, the local government leader explained to the accompanying industrial coordinator: 'The vigorous growth of rural industry has greatly lightened the supporting burden on the urban heavy-industry system. These small processing plants scattered across the townships can use local materials and switch production flexibly, supplying basic parts and primary processed goods to the big urban industries and forming a sound industrial pattern in which town and country complement each other and upstream and downstream are closely linked.'\n\nAn old worker in the workshop pointed at the standardized bolts and cast-iron components about to be shipped to the big city plants: 'Don't let our small size fool you. Many of the basic little parts the city needs to build its big machines are turned out by us working overtime.'\n\nThe special commissioner of the State Ministry of Industry said at the defense liaison meeting: 'The logistics departments have felt firsthand the great benefit of this supplementary role. The farm tools, building components and light equipment produced by rural industry cover everyday consumption at the grass roots, allowing core urban industry to concentrate its strength on tackling heavy equipment and key technologies.'\n\nThe meeting decided to introduce special support and technical-guidance policies, encouraging local governments to guide small rural industries toward standardized, intensive development and to weave the network of industrial cooperation across the whole region still more closely."
STL_CPC_2_main_story.16.o: "Town and country industry complement each other — consolidate the base of production."
STL_CPC_2_main_story.17.t: "A News Item（5）"
STL_CPC_2_main_story.17.d: "The highest central decision-making body and the theoretical research departments held a high-level seminar on deepening the transformation of rural production relations and reshaping the grassroots social structure. Faced with the intricate land relations in the taken-over eastern regions, scattered small-peasant production, and the urgent demand of large-scale reconstruction for grain and industrial raw materials, some delegates put forward more active and decisive proposals for collectivization.\n\nThe head of the central theoretical working group, setting out in depth the necessity of collectivization, stressed: 'Relying merely on the self-circulation and spontaneous regulation of the small-peasant economy can never meet the need for centralized allocation of grain and raw materials demanded by intensive state-building, large-scale industrialization, and potential geopolitical risks. We must, with a higher strategic vision, have the Center forcefully promote agricultural collectivization pilots, integrating scattered land and means of production to the highest degree and fundamentally reshaping the pattern of rural productive forces and production relations.'\n\nLand reform experts at the seminar noted: 'In the pilot areas, unified planning of cultivation and centralized allocation of large farm tools and seed will sharply raise output per unit area and overcome the natural weakness of small-scale farming in resisting risk.'\n\nA representative of the Central Reform Committee said: 'Past practical experience shows that highly organized collective production has displayed incomparable institutional advantages when facing external risks and national mobilization. Clarifying this strategic direction at the central level will help thoroughly break the hidden monopoly of the old forces in the east over rural land and resources, and establish a solid grassroots class base.'\n\nThe seminar finally reached a general consensus and decided to launch centralized agricultural collectivization pilots first in the key eastern counties and districts where conditions were ripe, so as to accumulate institutional experience for wider application."
STL_CPC_2_main_story.17.o: "Push forward the collectivization pilots with firm resolve."
STL_CPC_2_main_story.18.t: "Advanced Is Not Always Best"
STL_CPC_2_main_story.18.d: "In July the heat in Xiangyang was scorching. The old locust tree in the commune's threshing yard drooped its leaves under the sun; only the loudspeaker among its branches droned on tirelessly, broadcasting news about tractors helping farm production.\n\nZhou Dehou squatted in the shade against the trunk, his dry pipe glowing and dimming, too listless to wipe the sweat running down his neck. The stone roller beside him was too hot to sit on. In the distance on the field ridge, Tiedan's tractor rumbled and puttered, the noise twining with the broadcast until his ears throbbed.\n\n'Uncle Dehou, listening to the radio again?' Chen Zhiqiang came over, his face red beneath a straw hat.\n\n'To pass the time.' Zhou blew out a mouthful of smoke. 'The radio says birds can eat a whole field of corn and hail can smash a tractor — sounds like a storyteller's tale. We get birds here, but they've never been a plague; the only sensible bit is that warning about farm-machinery road safety. Just yesterday Tiedan nearly ran into the canal bank with that tractor.'\n\n'The county says we should organize everyone to study the material, not just listen for fun.' Chen squatted down too, picking up a twig to scribble on the ground.\n\n'Study? First let's figure out those two tractors. This speaker shouts 'Learn from Wubao in agriculture' every day. I've been there — all barren clods, conditions far worse than ours — and they managed something. Could our land possibly be worse?' Zhou knocked his pipe against his shoe sole. 'Cooperation is a good thing, no doubt; now the canal's built, this year's corn can all be watered. But there's a time and an order for everything — get what you can done first, don't take every breeze for a storm.'\n\n'You're right, uncle. That's the county's thinking too — start with two pilot cooperatives and don't rush the other villages. But with the speaker playing it round the clock, the young folks are itching to mechanize the whole commune by tomorrow.'\n\n'Mechanize with Tiedan's half-baked skills? Teach him properly before talking about anything else.' Zhou snorted.\n\nThe previous broadcast had just ended and a new voice began reading the news. Zhou had no interest; he pushed himself up on his knee. On the earthen wall at the village entrance the slogan 'Learn from Changqing in industry, learn from Wubao in agriculture' glared in the blazing sun. He narrowed his eyes and set off toward his own field. Chen followed, and the two walked along the ridge without another word."
STL_CPC_2_main_story.18.o: "Steady and sure, step by step"
STL_CPC_2_main_story.19.t: "Three Worlds"
STL_CPC_2_main_story.19.d: STL_CPC_2_main_story.19.d: "Xi Zhongxun stood on the roof of the former Guangdong National Legislative Assembly building, looking down over the city. Glass curtain walls threw back the light; tram tracks still ran down the streets, several cars overturned by blasts. Ye Jianying, wrapped in a military uniform, stood beside him; Song Zhiguang followed, clutching a roster.\n\n'Twenty-some years of ruin,' Ye said, pointing into the distance. 'Japanese firms bombed two generating units at the power plant — Yuexiu has been without electricity for three weeks. Chinese, Japanese and Zhuren live mixed together — the Japanese gather in Dongshan and Shamian, running their own schools and collecting their own taxes; the Zhuren live downtown, speak Cantonese, and are accepted by neither side; the Chinese are crowded into Xiguan and Henan. Three worlds.'\n\n'Let's go down and look first,' said Xi.\n\nThey went down and walked through the arcade streets. Most shops were shuttered; a few display windows held transistor color televisions, washing machines, tape recorders and telephones. Xi stopped: 'We can't make things like these.'\n\n'Can't make them, can't even afford to repair them,' Ye said with a bitter smile. 'The assembly lines Hitachi left behind — we can't even name all of them; if one part breaks, nobody in the whole country can fix it. Like Granny Liu entering the Grand View Garden — not enough eyes to take it all in.'\n'We still have to try. If we don't know, we learn. The Japanese technicians haven't all left — invite them back and pay them the same wages. Once the technology is in our heads, it belongs to the people.'\n'Among the Zhuren there are Chinese and Japanese too. Some hate us, some fear us, but most just want a quiet life,' said Ye. 'Call him an enemy and he's an enemy; call him one of the masses and he's one of the masses.'\n\n'Win them over. The very few with blood on their hands will be dealt with according to policy; the rest can be retained where possible. Guangdong must become an industrial base — we can't do without them. But make the principle clear: the city belongs to the people, the machines belong to the state, and the people have the final say.' Xi turned to Song: 'Within a week, draw up inventories of the assets and personnel of Hitachi, Fujitsu, Sony, Matsushita and Cheung Kong Holdings. Put the assembly lines under special guard and hand the keys to the Military Control Commission. Without approval, not a single bolt may be removed. I don't understand technology, but I do know that once it's scattered, it's hard to gather again.'\n\nA few young Zhuren stood under the arcades watching them. Xi glanced over: 'First get the lights on, then get the lines turning. Let all Guangdong see that this Granny Liu has come to stay, not just to gawk.'"
STL_CPC_2_main_story.19.o: "Granny Liu has come to stay in the Grand View Garden."
STL_CPC_2_main_story.20.t: "Decision of the State Council on Unifying National Financial and Economic Work（Excerpt）"
STL_CPC_2_main_story.20.d: "The present characteristics of national finance and economy: the numbers of military, political and educational personnel nationwide are huge; taxes and public grain in each locality are managed separately by province, city and county, with revenue and expenditure agencies disconnected; after the whole mainland is liberated, fluctuations in finance and prices will inevitably affect the entire country. The Government Administration Council decides:\n\n1. Establish a National Establishment Committee, with Bo Yibo as director and Nie Rongzhen as deputy director. Immediately verify staffing at all levels and stop recruiting on one's own. The policy of taking over old personnel unchanged remains, but they shall be remolded and used step by step.\n2. Establish a National Committee for Clearing and Allocating Warehouse Supplies, with Chen Yun as director. Within a set time, ascertain all warehouse stocks; no concealment or unauthorized transfer is permitted.\n3. Practice strict economy. Set staffing and work quotas for all offices and factories, establish a custody system, and punish corruption and waste severely.\n4. All public grain nationwide, apart from local surcharges, shall be uniformly allocated by the Central Ministry of Finance. No province, city or county may draw on it without a payment order.\n5. Customs duties, salt tax, commodity tax and industrial-commercial tax shall all be uniformly allocated by the Central Ministry of Finance.\n6. State trading operations and the movement of supplies shall be under the unified command of the Central Ministry of Trade. Military units and offices may not engage in business.\n7. State-owned factories shall be divided into three kinds: directly managed by the Center, administered by local bodies on commission, and transferred to local management. All public enterprises must pay taxes on time and hand over a portion of their profits.\n8. The People's Bank is designated as the central agency for national cash allocation. All cash held by offices shall be deposited in the state bank; no private lending is permitted.\n9. The Central Ministry of Finance guarantees military and local expenditure. The principle of payment: first the front, then the rear; first the army, then the localities.\n10. Whoever fails to implement the above provisions shall be punished according to law.\n\nLocal comrades have done a great deal of work in the past, and will continue to bear great responsibility. Once public grain and tax revenue are assigned to the Center, local funds may be tight, but that difficulty is smaller than continued disunity in finance and chaos in finance and prices. It must be stressed that the part obeys the whole and the locality obeys the Center.\n\nLeading comrades everywhere must be still more active and responsible."
STL_CPC_2_main_story.20.o: "The whole country is one chessboard."
STL_CPC_2_main_story.21.t: "Reassurance"
STL_CPC_2_main_story.21.d: "Boss Zhou sat in the back row of the Federation of Industry and Commerce hall, his suit washed pale, his palms soaked with sweat. He ran three textile mills; one campaign followed another, and he lay awake night after night for fear that one day his factories would be confiscated.\n\nThe chairman had barely finished announcing the full name of the leader from the Center when the leader began to speak, stating plainly and clearly the purpose of his visit. But Boss Zhou, standing to one side, was already frightened out of his wits; the sweat on his back instantly soaked through the lining, and though he strained his ears he heard only a humming. None of what the leader said went in, and he never even caught whether the man's surname was Zhang or Wang.\n\n'Today China does not have too many capitalists, or too developed a capitalist class — it has too few, and too underdeveloped. Because the capitalists are underdeveloped, the workers suffer. Today capitalist exploitation is not only not a crime; it has merit. If you have the ability to open more factories and exploit more workers, that benefits the country and the people. Today capitalist exploitation is legal — the more the better. The more you exploit, the greater your merit.'\n\nBoss Zhou was dumbfounded. He turned to look at the man beside him, who was also gaping. On the platform the leader went on speaking, his tone as even as if discussing the weather.\n\nAfter the meeting, Boss Zhou walked out with weak legs. At the door he grabbed Old Hu, who ran a rice shop.\n\n'Old Hu, did you hear that? The more you exploit, the greater the merit! That came straight from the Center!' His voice shook as he lowered it. 'I was going to open a fourth mill but was afraid of getting into trouble, and couldn't sleep at night. Now it's fine — the leader said it himself: more factories, more workers, that's merit!'\n\n'Keep it down! Words like that — just listen, don't go repeating them everywhere,' Old Hu hushed him.\n\n'I don't care! My mind's made up. Tomorrow I'll send the accountant to handle the paperwork and hire another three hundred workers. Workers need to eat, I need to eat — everybody makes a profit.' Boss Zhou mopped his brow with a handkerchief, his eyes alarmingly bright. 'These days, there's something to look forward to.'\n\nHe looked toward Nanjing Road, where the neon signs were lighting up one after another.\n\n'When the fourth mill opens, I'll treat you to wine at Laozhengxing — order your favorite, the rock-sugar turtle!'"
STL_CPC_2_main_story.21.o: "The reassuring pill has been swallowed."
STL_CPC_2_main_story.22.t: "A Sinner's Panic"
STL_CPC_2_main_story.22.d: "Boss Zhou huddled in the corner of his office as the shouting outside rose wave upon wave. The workers poured in, waving red flags, a sea of arms stretching as far as the eye could see like a wheat field. His three mills had been shut for three days; today the office was finally reached.\n\n'Boss Zhou, come out and face the masses!' The young worker at the head kicked the door open.\n\nHe recognized the man, surnamed Gu, who had worked in his mill for six years and had had his pay docked the previous year for being late. Gu's face was flushed and shining, a roll of paper clutched in his hand.\n\n'Gu... Comrade Gu, let's talk, let's talk...' Zhou backed away until his spine met the wall. His suit was whiter than before — he had washed it again, trying to remove the bloodstains.\n\n'Comrade indeed! You're a capitalist, we're the proletariat! Today, on behalf of all the workers of this plant, we declare East Asia No. 1, No. 2 and No. 3 Textile Mills transferred to collective ownership! Sign here!'\n\n'The mills belong to the state; if they're to be taken over, it should be by the government. You can't...'\n\n'The government is on our side! Didn't you hear? The Center says to boldly mobilize the masses and support the mass movement! You've exploited us all these years, feasting on meat and fish every day while we can't even get a full meal! Today we're settling accounts with you! Sign now — or you don't leave this room today!'\n\nMore shouts outside: 'Long live the proletariat! Down with the capitalists!' Zhou's hands shook like leaves and at last he scrawled his name on the document, the characters crooked as if drawn by a ghost.\n\nThe crowd cheered. Some began carrying his office furniture out, others threw the account books on the floor and stamped on them. Comrade Gu did not leave; he stood before him and said: 'Comrade Zhou, from now on you're like us — a worker. The mill belongs to the public; remold yourself properly.'\n\nZhou looked up at him, his eyes bloodshot, and suddenly gave two dry laughs: 'Fine, fine... I'll remold, I'll remold...'\n\nThat night he squatted on the floor of the emptied office and smoked through the night. At dawn he walked out of the mill gate with his bag, unable to resist one last look at the plant that had been his — but on the familiar gateway, at some point a brand-new sign had appeared: Shanghai No. 17 Cotton Textile Mill."
STL_CPC_2_main_story.22.o: "The mill belongs to the masses; the boss belongs to the past."
STL_CPC_2_main_story.23.t: "Redemption of Assets"
STL_CPC_2_main_story.23.d: STL_CPC_2_main_story.23.d: "Outside the workshop of Shanghai No. 3 Textile Mill, several workers squatted against the wall smoking. A notice on the blackboard bulletin said the mill was being bought out: Manager Zhang had received the redemption payment and had been appointed deputy director.\n\n'What kind of thing is this? The capitalist takes the money, doesn't clear off, and still gets to be director?' young Zhao Dazhuang said, flinging his cigarette butt down.\n'He knows the technology. Manager Zhang can repair the spinning machines himself — who in the mill doesn't know that?' said an old worker beside him.\n'That's no reason to keep him on a pedestal. How much did he exploit us before? Now the state has bought his mill with public money, and he still takes money and still holds office!' Zhao grew angrier as he spoke.\n\nYe, squatting nearby, flicked his ash and spoke up: 'You think the state is stupid? Throw him out for good and who fixes the machines when they break? If he ran off, how would several thousand people in this mill eat? Redemption means paying to keep him here content. The money is the state's, the mill ends up in the state's hands, and we workers keep our jobs — understand?'\n'That's letting him off too easy,' Zhao muttered.\n'Too easy? He used to eat meat; now he can only drink soup. From now on he works for us, not us for him. I'm angry too, but life goes on. Didn't your brother just join the mill? If things fall apart, he'll be the one sent back to the countryside.' Ye stood up. 'Come on, to work. Doing our own job well beats everything.'\n\nThey dispersed. The workshop director came running over and called: 'Ye Changming! Manager Zhang wants you — that new batch of machines in the spinning workshop, he wants you to count them!'\n\nYe answered, stubbed out his cigarette, and headed into the workshop."
STL_CPC_2_main_story.23.o: "The machines keep turning as before."
STL_CPC_2_main_story.24.t: "Subsidies"
STL_CPC_2_main_story.24.d: "Zhang Defu clutched his pay slip and walked briskly out of the factory office. He had moved up one wage grade, twelve yuan and six jiao more a month. When he first entered the mill thirteen years ago, an apprentice earned eighteen yuan a month; now it was nearly four times that.\n\nAt home he slapped the pay slip on the table. His wife was mending clothes and looked up.\n\n'Xiulan, it went up! One full grade, nine yuan.'\n\nHis wife poked her head out from behind the stove: 'Really? You've finally come through. We should save it and make the child a new outfit.'\n\n'Save it for what? Spend it as it should be spent. I'm a model worker — the mill says distribution according to work, so I take this money with a clear conscience.'\n\n'What about Old Liu's family? Five kids — did he get an increase this time?'\n\n'Half a grade. They said it was consideration for families with many children. Hm, if you ask me, distribution according to work should look at contribution — how many kids you have is no contribution. The state has to give more money; isn't that holding everyone back?'\n\n'Listen to you. Old Liu's wife is in poor health, five children to feed and clothe; he's been here longer than you, he just never made model worker. What's wrong with the mill giving a little consideration? Isn't socialism supposed to look after families like that?'\n\n'But I'm a model worker — I sweat more than he does. What right has he to rise along with me?'\n\n'He didn't rise along with you — you got a full grade, he got half. Besides, have you forgotten when we first came to the mill and you were ill for a month and the mill sent us grain coupons? Why didn't you talk about distribution according to work then?'\n\nZhang opened his mouth but said nothing. He pulled out the raise notice and read it once more; he was still not quite easy in his mind.\n\n'I'm not saying he shouldn't get a raise. I just feel the money should go to the people who do more work.'\n\n'The mill's policy is written on the notice board: model workers first, then families with many children. You may think it's unfair, but the mill has to look after everybody's livelihood. Do you think socialism can be built on model workers alone?'\n\nZhang said no more, put the notice in the drawer, went to the door and lit a cigarette. His wife had a point, but that little sense of superiority was still there."
STL_CPC_2_main_story.24.o: "Everyone has his own difficulties."
STL_CPC_2_main_story.25.t: "Closing the Net"
STL_CPC_2_main_story.25.d: STL_CPC_2_main_story.25.d: "On a Sunday afternoon the People's Park was full of visitors. A young man in a gray-blue work suit leaned against a locust tree gnawing an apple, his eyes darting this way and that. The middle-aged man selling ice pops at the roadside passed two pops to an old man reading a newspaper.\n\n'That's him?' The old man peered over his paper.\n'No mistake — the scar on his forehead. Robbed someone at the back gate of the textile mill yesterday and beat up a woman worker coming off the night shift.' The ice-pop seller lowered his voice. 'East and south gates are blocked, and the management office people are in place.'\n'Wait a bit longer. Let him get further in — don't hurt any visitors.'\n\nThe young man tossed the core aside and ambled toward the lake. As he passed a stone table, two old men playing chess looked up at him together. He faltered — something was wrong.\n\nJust then the ice-pop seller flipped his box over, whipped out a short baton and roared: 'Go!'\n\nThe whole park moved. The chess players overturned the board, the tai chi practitioners folded their fans, the sweeper dropped his broom, a woman with a child thrust the little one into someone else's arms, and the man behind the newsstand pulled handcuffs from under the counter. Dozens converged from all directions.\n\nThe young man bolted, but within ten paces three burly men charged from the east, four or five emerged from the bushes to the south, and a team came from the boat dock. Like a hare run to ground, he was finally pinned to the grass by the lake.\n\n'Let go! What are you arresting me for? I'm a good man!' he struggled.\n\nA man in a jacket crouched down and showed his ID: 'The night before last, in the back alley of Shengli Street, you robbed a retired worker and broke two of his ribs. Yesterday, at the back gate of the textile mill, you snatched a woman worker's bag and knocked her out. Shall I go on?'\n\n'I didn't! You've got the wrong man!'\n'Settle it at the station.' The jacket waved a hand. 'Take him away.'\n\nAn old woman pushed forward and pointed: 'That's him! He grabbed my granddaughter's bag the other day and pushed the child over!'\n'Beast in human skin!' the crowd cried.\n\nThe young man stopped struggling and was marched toward the police car with his arms twisted behind him. The park returned to calm — the chess players went on playing, the tai chi practitioners went on with their forms."
STL_CPC_2_main_story.25.o: "The net of justice is vast."
STL_CPC_2_main_story.26.t: "Leniency and Severity"
STL_CPC_2_main_story.26.d: "Shen Zhongwen turned the campaign summary over and over, his eyes stopping at the column 'persons not yet apprehended.' Ma Sandao. Six months, three lives in the dockside blood case, and the man seemed to have evaporated. Shen's teeth itched with hatred; the hatred was rooted in his stomach and rose up whenever he thought of it.\n\nThe office door opened and Little Wu, the clerk, poked his head in.\n\n'Director Shen, we just got a denunciation letter — someone in the western part of the city saw a man who looks like Ma Sandao.'\n'Has it been verified?' Shen was on his feet at once.\n'Not yet. The comrades are checking.'\n'Make it quick. This time we can't let him slip away.' His tone was heavy, but he did not shout.\n\nAfter Wu left, he turned to the list of 'activists in remolding.' Chen Shunfa — at that name his brow relaxed, and he could not help thinking of the day before.\n\nYesterday at the vegetable market, a tall, thin man carrying two baskets of greens had seen him, hastily set down his shoulder pole and bowed.\n'Comrade Shen, buy some vegetables.'\n'It's you, Shunfa. How are things now?'\n'Good, good. I'm a group leader at the neighborhood factory; I was rated advanced last month.' Chen rubbed his hands, smiling shyly.\n'Good. Keep it up. The past is past.'\n'Yes, yes. Thanks to the government's leniency, I've been given a way out.'\nShen nodded and held out a cigarette. Chen took it with both hands, tucked it behind his ear, bowed again and left.\n\nWatching his retreating back, Shen felt easier in his mind. Ma Sandao kept him awake at night, but men like Chen Shunfa made him feel that gentleness was not indulgence — it was giving someone a road back. One must be hunted to the ends of the earth; the other must be helped onto the right path. Suppressing counterrevolution was not about killing as many as possible: it was making the guilty answer for their crimes and letting those who could change live decent lives.\n\nHe closed the notebook, lit a cigarette and looked out the window. In the street, Chen Shunfa was dividing his vegetables among the elderly and lonely."
STL_CPC_2_main_story.26.o: "Leniency and severity together win the people's hearts."
STL_CPC_2_main_story.27.t: "Force"
STL_CPC_2_main_story.27.d: STL_CPC_2_main_story.27.d: "Shen Zhongwen spread two case files side by side on the desk, his finger moving back and forth between 'already executed' and 'awaiting execution.'\n\nHe Shouqian, Zhao Tietou. Two names, two different tastes.\n\nLittle Wu knocked and came in with a report.\n\n'Director Shen, He Shouqian's family have come again. They're kneeling in the reception room and won't leave, saying the evidence was insufficient back then and he confessed under torture.'\nShen's hand jerked; ash fell on the file.\n'Back then... pressure from above, a deadline to solve the case. I interrogated He myself. He signed his confession in the end, but something about his eyes didn't seem right. Later we established the knife wasn't his. But the man was already gone.' His voice dropped. 'I owe him a life.'\n'Then this report...'\n'Accept it. Pass it to the Political and Legal Committee, written as it is. If he was wronged, he was wronged — he's owed an explanation.'\n\nWu was about to go when Shen called him back: 'What about Zhao Tietou? What did he say at the end?'\n'Three rounds of interrogation, the evidence solid. The bastard never repented — at the sentencing yesterday he actually laughed and said that killing him would only leave others to follow.'\nShen gave a cold laugh and ground his cigarette into the ashtray.\n'Men like him are a plague alive. Three lives, robbing soldiers' families, and threats to kill every one of us cadres. If he'd bowed his head I might have respected him as a man. But he spat in the female judge's face in court.'\n\nHe stood and walked to the window, his back to Wu.\n'He Shouqian's case must be thoroughly investigated — exonerate him if he should be exonerated, compensate him if compensation is due. But with men like Zhao Tietou, catch every one you can and execute every one you catch. We've intensified the effort, but not only against honest people.'\n\nHe turned, his gaze suddenly sharp.\n'Tomorrow, verify Zhao Tietou's file once more and have him sign before the execution. This time, no mistakes at all.'\n'Yes.' Wu withdrew.\n\nShen sat down again, his eyes falling on He Shouqian's photograph. After a long while he said in a low voice: 'I'm sorry.'"
STL_CPC_2_main_story.27.o: "There must be force, but force alone is not enough."
STL_CPC_2_main_story.28.t: "Sounding the Gong to Withdraw"
STL_CPC_2_main_story.28.d: "Wang Erhu crouched in the corner of the detention cell, his heart in a turmoil. He had stolen two bundles of copper wire from the factory and been caught red-handed by the security section. Six months ago that would have meant at least three years. He had heard that during the counterrevolution suppression campaign, people were dragged to the square for struggle sessions just for stealing a manhole cover. Now he had been in for three days and nobody had interrogated him, let alone beaten him.\n\nOld Li from the same cell edged over: 'What did you do?'\n'Took two bundles of copper wire.'\n'Then you're lucky. Haven't you heard? Since last week, petty theft has been changed to administrative detention — a few days and they let you go. The fellow in the next cell who stole a bicycle only got seven days.'\n'Really? I thought I'd be sentenced.'\n'The campaign is over. Haven't you noticed the streets? Fewer patrols. They've sounded the gong to withdraw.'\n\nWang felt a little easier but still could not believe it. Just then the iron door opened and a policeman called from the doorway: 'Wang Erhu, come out.'\nHe got up quickly, his legs a little weak. The policeman took him to an office and pushed a sheet of paper across: 'Sign here. Fifteen days' administrative detention and a fifty-yuan fine. Keep your nose clean when you get out.'\n\nHe took the pen and signed with a shaking hand.\n\n'Do you know you were wrong?'\n'Yes, yes.'\n'Don't do it again.'\n\nHe nodded like a pecking bird. When the formalities were done, the policeman told him to go back to his cell. He lay down on his bunk and suddenly smiled. Only fifteen days and a fifty-yuan fine — what was that? He had expected at least three years. So it really was over.\n\nOld Li edged over again: 'What did they give you?'\n'Fifteen days' administrative detention, fifty-yuan fine.'\n'Congratulations — you'll be out in time for New Year.'\n\nWang chuckled and began wondering where he would find work after release. Outside, the sky darkened; for the first time he felt that detention wasn't so hard to bear."
STL_CPC_2_main_story.28.o: "The storm has passed."
STL_CPC_2_main_story.29.t: "A Season of Lasting Peace"
STL_CPC_2_main_story.29.d: "'Chairman, the report is here.'\n\n'Good. I'll look at it shortly.'\n\nDeng put down the report on Party affairs in his hands and picked up the State Council report that the Central Secretariat had just delivered, already reviewed. Ignoring the praise and formulaic language, he read the figures word by word.\n\n'At the start of liberation there were over ten thousand recorded banditry incidents; this year there are only 34. At the start of liberation the number of large landholders in the east was only in the dozens; this year the category of individuals holding large tracts of land has been abolished from the statistics. In the east, seventy percent of railways and sixty percent of roads were destroyed in the war; they have all been repaired this year. Before liberation dirt roads made up eighty percent of all roads in the east; this year that has fallen by thirty percent, and every county is linked by highway. All the industrial standards of the puppet government era have been abolished; products from the western and eastern regions each account for no less than 20% of their respective markets...'\n\nDeng rarely smiled as he took off his glasses; he closed his eyes and lay back slowly on the bed. The silence of the Chrysanthemum Fragrance Study gradually slowed his thoughts. Behind closed eyes, an old man was driving a four-wheel-drive vehicle along a broad, clean black road. Behind him sat his wife in clean clothes and his son holding a university diploma. The vehicle had a trunk loaded with domestically produced firewood, rice, oil, salt, iron pots, ladles and other daily necessities. The whole family, neat and complete, disappeared into the traffic.\n\nIn a blink, a young man was operating a small machine. He merely stared at a glowing screen and moved his fingers slightly, then spoke the name of the old man before him; he did not know what the old man said, but the young man only moved his fingers and a certificate emerged from the machine. In what felt like less than a minute, the old man smilingly put away the certificate and left.\n\nIn another blink, before his eyes was a white roof."
STL_CPC_2_main_story.29.o: "All Is Well"
