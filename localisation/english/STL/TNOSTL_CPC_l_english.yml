Chen_Yun_desc: "Mao Zedong once called Chen Yun 'the Bukharin of our Party.'\n\nBorn to a poor peasant family, Chen Yun could not afford school fees; after finishing higher primary school he went to the Commercial Press in Shanghai as an apprentice, learning the press's business operations and financial transactions — the beginning of his economic career. During the May 30th Movement, Chen successfully led the strike at the Commercial Press, soon joined the Communist Party of China, and took charge of organizing the labor movement. During the Yan'an Rectification Movement he stood firmly on Mao Zedong's side. When the base areas fell into economic crisis under Chiang Kai-shek's blockade, Chen delivered a satisfactory answer to the Party Center: using land as capital, he both drew ordinary small peasants to come over and attracted big capitalists to invest. Thereafter he handled this half-capitalist, half-socialist economic model with easy familiarity, and secured his position as the Party's economist.\n\nAnd yet this economic model bore more than a little resemblance to the New Economic Policy once practiced in the already shattered Soviet Union..."
Xi_Zhongxun_desc: "Mao Zedong once praised Comrade Xi Zhongxun: 'He is a mass leader who emerged from the masses.'\n\nA native of Fuping, Xi Zhongxun joined the revolution in his early years; this homegrown northwesterner devoted his youth to the cause. From the Long March to the Defense Front, Xi maintained a modest and prudent style of work. When the Communists entered Xi'an, it was he who stepped forward to take charge of the city's affairs and stabilize the situation. Later, during the Defense Front period, he served as First Secretary of the Northwest Bureau, presiding over all Party, government and military work in the northwest, uniting the masses of all ethnic groups and local forces, properly handling ethnic and religious affairs, and building the most basic political and security shield of the Defense Front. Although he had violated organizational discipline when the Communists entered Xi'an, he still gained a seat on the Central Politburo. However, it seems that because Xi leaned slightly toward Deng Xiaoping's pragmatic views in implementing policy and expressing opinions, quite a few comrades found fault with him.\n\nAmid today's ever more intricate maneuvering over the party line and rapidly changing circumstances, he has been drawn into Deng's camp. How will this pragmatic leader, so beloved by the people, use his political wisdom to steer the country's future voyage..."
CPC_Xi_Zhongxun_hog_desc: "§YPremier of the Administrative Committee\n$communist_mao_zedong_thought_TER_subtype$§!\n§YPragmatist§!\n§F------------§!\n§LMao Zedong once praised Comrade Xi Zhongxun: 'He is a mass leader who emerged from the masses.'\n\nA native of Fuping, Xi Zhongxun joined the revolution in his early years; this homegrown northwesterner devoted his youth to the cause. From the Long March to the Defense Front, Xi maintained a modest and prudent style of work. When the Communists entered Xi'an, it was he who stepped forward to take charge of the city's affairs and stabilize the situation. Later, during the Defense Front period, he served as First Secretary of the Northwest Bureau, presiding over all Party, government and military work in the northwest, uniting the masses of all ethnic groups and local forces, properly handling ethnic and religious affairs, and building the most basic political and security shield of the Defense Front. Although he had violated organizational discipline when the Communists entered Xi'an, he still gained a seat on the Central Politburo. However, it seems that because Xi leaned slightly toward Deng Xiaoping's pragmatic views in implementing policy and expressing opinions, quite a few comrades found fault with him.\n\nAmid today's ever more intricate maneuvering over the party line and rapidly changing circumstances, he has been drawn into Deng's camp. How will this pragmatic leader, so beloved by the people, use his political wisdom to steer the country's future voyage...§!"

