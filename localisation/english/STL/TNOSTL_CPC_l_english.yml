CPC_Chen_Boda: "Chen Boda"
Chen_Boda_DESC: "For Chen Boda, the essence of revolution was not simply a change of regime, but a remolding of thought that must remain absolutely pure.\n\nWhile his comrades fought the Japanese invaders bloodily at the front or struggled against hostile forces in the Kuomintang-controlled areas, Chen remained at his desk, measuring the depths of Marxism-Leninism with his pen. He had no illustrious military record, nor did he wallow in the mire of complex economic affairs as the pragmatists did; yet with exceedingly rigorous logic and uncompromising class analysis he built an unshakable ideological fortress within the Party. As the undisputed chief theorist of the Party, he enjoyed Mao Zedong's deep trust and esteem. In those dark and stormy years, faced with the inevitable compromises and concessions in the united front, it was Chen's stream of theoretical articles that kept his comrades' nerves taut, reminding the whole Party never to lose the proletarian character amid the tide of national salvation.\n\nThe death of the leader Mao Zedong had once brought this column, trudging through hardship, to the brink of losing its way and splitting apart. To preserve the delicate balance among the Party's factions, the heavy burden of Chairman of the Defense Front was entrusted to the venerable Zhu De. This old soldier, who had spent a lifetime in the saddle, no longer concerned himself with the details of political operations; his assumption of office was merely a symbol of unity — because every faction regarded him with goodwill. Under Zhu De's broad and silent protection, the comrades set aside their differences over the line for the time being and threw all their energy into the final blow against the Japanese invaders. Throughout that long transitional period, Chen Boda watched the undercurrents of thought within the Party with cold eyes, quietly gathering strength on the heights of theory, sworn to defend the red legacy left by the leader.\n\nTime passed, and at last the dawn of victory broke through the historical gloom. With the Japanese puppets and invaders utterly driven out, the land of China was once again united. But before the joy of victory had faded, the burdens of reality came crowding in. The world-watched National People's Congress placed the heavy responsibility of President of the State historically into Chen Boda's hands. When this erudite theorist truly stood at the summit of power, looking out over this vast land — scarred yet awaiting renewal — he faced an unprecedented test.\n\nBuilding a new world is far harder than criticizing an old one on paper. Faced with voices within the Party advocating gentle means, even borrowing capitalist methods, to restore the nation's vitality, the taut string of class in Chen's heart never slackened for a moment. In his view, to compromise with bourgeois rights in the process of national reconstruction would rob the blood of countless martyrs of its meaning. He gripped the helm of the age with resolve, striving to build a new order without impurity on this rubble with the purest of convictions. Yet can rigorous theory heal the wounds left by years of war? Can this great ship, just emerged from the Three Gorges of history, withstand the tempests of reality under his guidance? All remains hidden in the mist of the unknown."

CPC_postwar.1.t: "Spring Haze"
CPC_postwar.1.desc: "Deng Xiaoping was fretting over the report sent by the Datong Railway Branch. Large quantities of coal lay piled up at the yards, yet none of the railway branches could spare freight cars, and the outbound shipping plan kept falling behind. The coal users were pressing hard, but the railway side had no better solution. He took up his pen and drew a line beside 'Tangshan can only keep the operating rooms of the municipal people's hospital supplied with power.' His secretary knocked and came in, placing the letter of recommendation forwarded by the NPC preparatory group beside the pile of documents. Deng set down his fountain pen, opened the envelope, and read it through. After a moment of silence, he read it once more from the beginning, then slid the letter under the glass top of his desk.\n\n'What was bound to come has come.'\n\nThe nomination at the NPC was no surprise to him. Since reconstruction began, he had conscientiously shouldered his duties: traveling about, attending meetings, going down to investigate — grain, industry, transport, wherever a problem arose someone had to see to it. But the letter reminded him that beyond work lay an unavoidable transfer of power. Ever since the 9th Congress, the undercurrents over personnel arrangements at the highest level had never ceased. Chen Boda's faction and his own side showed outward restraint but each had its own calculations in private. Mao Zedong, Liu Shaoqi and Zhou Enlai had died in succession; while Zhu De was in office, his personal prestige had kept the fragile balance intact — but the old marshal had now tendered his resignation, and that buffer was gone. With the task of reconstruction so arduous, people could still keep the conversation on work; once personnel arrangements were on the table, who would talk only about work?\n\nDeng lit a cigarette and sank back in his chair. His early Party membership, his years in France, and the old label of being one of the 'Four Giants of the Maoist faction' during his pro-Mao period had all been his political capital. But he trusted more the things he had actually accomplished these years: the allocation of materials during the Great Leap Forward, the economic recovery after nationwide liberation — one after another, achieved not by fine words but by those 'hands' of his that solved real problems. And his record had proved him a doer who could shoulder burdens and get things done. He looked down at the railway report again. If the coal could not be shipped, the power plants might run short; if electricity supply could not keep up, factory production, urban operations and agricultural development would all suffer. Problems like these would not disappear just because a meeting was held or a person replaced. He did not want the core government departments dragged into disputes over the transfer of power, still less an ideological purge. The country had only just begun to recover; it could not afford more upheaval. Therefore the Secretariat faction must secure sufficient weight within the NPC framework, and must ensure stability and continuity in the core departments.\n\nWhen the cigarette burned down to the end, Deng crushed the butt into the ashtray. He looked again at the Datong Railway report, then glanced at the recommendation letter under the glass. He signaled to the secretary to close the door and said, in a low, steady voice: 'Ask several of the leading comrades in Beijing to come. We'll hold a small meeting tonight — keep it quiet.'\n\nThe secretary asked whether representatives from out of town should be contacted. Deng waved his hand:"
CPC_postwar.1.o: "'No hurry. Let's get our line unified here in Beijing first.'"

CPC_postwar.2.t: "Guardian of Orthodoxy"
CPC_postwar.2.desc: "It was already four in the afternoon when Chen Boda read a villager's complaint letter from Lixin County. The letter said that village cadres had charged repeatedly under the pretext of school miscellaneous fees, and squandered the money collected. The villagers had reported it to the township, expecting the township Party secretary transferred in from Shaanxi to set things right; instead of ordering the money returned, the township had actually intimidated them, and a middle-school student who spoke up for his family had been beaten by the township police station.\n\nChen put the letter down and wondered: only last year Anhui had carried out a large-scale purge in the Fuyang prefecture, so how could such a thing happen again? He read it once more, his eyes resting on the lines about the student's injuries. In the revolutionary years the masses had delivered grain, passed intelligence, even given their lives, to bring about today. Now someone abused the power of the organization to oppress the masses, and when the masses appealed they met with intimidation. Was this still the column that had fought to win the world for the people?\n\nThe secretary brought a copy of the NPC preparatory group's recommendation letter. Chen read it twice, and his heart stirred: this was the whole nation's recognition of him, and support for his political views. But the NPC nomination also involved another candidate, whose selection was all but a foregone conclusion. Mao Zedong, Liu Shaoqi and Zhou Enlai had died in succession, and with Zhu De's resignation after the war the old balance within the Party could hardly be maintained. Chen laid the two letters side by side on the desk. One came from the grass roots, describing people with nowhere to turn; the other foretold changes at the very top. The Secretariat faction held the government apparatus and the economic lifelines, and its ranks were growing. While Zhu De was in office the factions could keep a balance; now, would Deng and his crowd let the chance slip? Deng was a pragmatic man. Chen believed he would not condone those cadres' conduct, yet the very word 'pragmatic' put him on guard. If from now on only output, efficiency and administrative results were discussed, and the political stance of cadres and the ownership of power were no longer questioned, grassroots corruption might be treated as a trivial matter. As class struggle gradually withdrew from daily work, the revolution might quietly change its face after victory. Deng had said 'using capitalist means to realize the communist ideal,' and Chen worried that if such thinking became dominant, people would eventually tolerate privilege in the name of development and compromise with bourgeois rights.\n\nHe called his confidential secretary: 'Circulate the copy of the NPC recommendation letter among all Central Committee members. Old Marshal Zhu labored all his life and his personal wishes should be respected, but before a decision is made the whole Party must discuss it fully. This is a question of line.' Then, pointing at the complaint letter: 'Send it at once to the Anhui provincial committee for investigation. The fees, the township's handling of the matter, and the student's injuries must all be clarified. During the investigation, local cadres must not be allowed to trouble the people who reported the problem. Send the letter and my instructions to several Central comrades as well.'\n\nThe secretary noted this down and was about to leave when Chen called him back: 'Tell the editorial department of Red Flag that the next issue should discuss grassroots corruption, bureaucratism, and how to prevent the ranks from degenerating after the revolution's victory. Submit a first draft within a week. Old Marshal Zhu's resignation is a sign — the transfer of power is not only a personnel change but a confirmation of the line. If the line is right, it doesn't matter who holds office; if the line is wrong, no one will do.' The secretary left and the office grew quiet again. Chen tucked the complaint letter into Quotations from Chairman Mao, set the recommendation letter aside, and took out his notebook. The pen traveled across the page:\n\n'Revolution is a continuous remolding of thought. We must uphold Marxism-Leninism and Mao Zedong Thought, and uphold the dictatorship of the proletariat for ten thousand years without wavering.'"
CPC_postwar.2.o: "The Defender's Lonely Shadow."

CPC_postwar.3.t: "The Critical Hour (1)"
CPC_postwar.3.desc: "The preparatory meeting was set for late March. In the conference hall in western Beijing — in the late Qing a prince's mansion reception hall, in the Republic era a venue for the Senate — portraits of Marx, Engels, Lenin and Mao Zedong now hung on the walls. The long tables were arranged in a horseshoe, covered in dark green felt, with teacups lined up neatly and thermoses standing in the corners.\n\nMore than forty people attended: Central Committee members, members of the NPC preparatory group, representatives of the various factions. Chen Boda sat near the head of the long table with a stack of documents before him and an untouched cup of tea on his left. Deng Xiaoping sat opposite him, slightly to the right, murmuring something to the delegate beside him, his expression relaxed and giving nothing away. The first item on the agenda was 'NPC arrangements,' but everyone knew there was really only one question: who would be in charge?\n\nChen cleared his throat and spoke first, choosing his words courteously: 'Old Marshal Zhu's merits are beyond count; his retirement is a loss to the whole Party, the whole army and the whole people.' Speaking of postwar reconstruction, he said: 'This is the first victory the Party has won outside of war.' Then he changed tack: 'I feel that before the new arrangements are settled, there are still matters deserving our serious consideration.'\n\nHe drew a sheet from his documents: 'Last year Anhui carried out a large-scale purge in Fuyang prefecture. Yet recently I received a complaint letter from Lixin County. Village cadres repeatedly charged fees under the pretext of primary-school miscellaneous expenses and squandered the money. When the villagers reported it to the township, the township cadres not only refused to order refunds but resorted to intimidation. A middle-school student who wanted an explanation was even beaten by the police station.'\n\nThe room gradually fell silent.\n\n'The villagers had expected the Party secretary sent in from Shaanxi to set things right — and what happened? Even after the purge, such problems persist. Can we still dismiss these matters as the poor conduct of a few cadres?' Chen set the letter down, his gaze sweeping over those present. 'Comrades, the revolution has won, and we have moved into the buildings of Beijing — but we must not forget where we started. The people gave us their grain, their sons and even their lives, not so that today's cadres could ride roughshod over them. In his later years Comrade Mao repeatedly warned the whole Party: the enemy is not only in the trenches, but may also be in the offices. If we do not take this seriously today, tomorrow we shall be standing on the very side we once opposed.'\n\nHe paused, then continued: 'Therefore I believe that in this round of personnel arrangements revolutionary purity must be the foremost criterion — not merely ask whether a person knows how to manage the economy or administration, but above all whether he holds fast to the proletarian revolutionary stand. With the right line, the right people can be chosen; with the wrong line, the more capable a person is, the greater the harm.'"
CPC_postwar.3.o: "The hall was silent for several seconds"

CPC_postwar.4.t: "The Critical Hour (2)"
CPC_postwar.4.desc: "At this point some lowered their heads over their documents, others held teacups without drinking. Deng sat opposite, still wearing that calm expression, and tapped his fingers lightly twice on the table, breaking the silence: 'I don't deny what Comrade Chen has said. If what the letter says is true, then of course it must be investigated — we cannot let the people suffer injustice with nowhere to turn. We must not lose the revolutionary character. But I'd like to speak about some other matters.'\n\nHe picked up the document before him: 'The recent report from the Datong Railway Branch: coal is piling up at Datong station, freight cars are not turning over, and the outbound plan keeps falling behind. The power plants are waiting for coal, the factories for electricity; if railway capacity can't keep up, the whole production plan suffers. Electricity supply concerns not only industry but urban operations and agriculture. Can such problems be solved merely by holding a few more ideological discussion meetings?' Chen was silent a moment, then said: 'Comrade Deng, the line and practical work have never been opposed to each other. Comrade Mao said that politics is the commander, the soul. If we first get the line right, practical problems will naturally find their solution. If the line is wrong, the more one toils the more chaos one creates, the more one does the more one errs.'\n\n'I never said we don't need political direction.' Deng shook his head. 'But direction must in the end be realized in actual work. Comrade Chen, your scholarship in theory is excellent, and that is well and good. But you must also see that what we face now are practical problems: a few days ago an earthquake struck Haicheng, and the people in the stricken area are waiting for rescue and resettlement; transport, supplies and the restoration of production all need someone to organize them. Last year natural disasters hit some regions again and grain output was affected. Which of these matters can wait until we have finished discussing every theoretical question?'\n\nChen frowned: 'But what if the cadres responsible for the work are themselves at fault? The very word purity may strike you as ironic, but to me purity is precisely what fundamentally distinguishes us from the old regime. If our regime were not essentially different from the Kuomintang, then what was the point of all those who sacrificed?' Deng did not answer at once. He raised his cup, drank a mouthful of water, set it down, then said slowly: 'Of course I know that in theory we differ essentially from the old regime — that is why we must investigate the cadres. But we must also get real work done. We cannot cast production and construction aside just because someone is corrupt, nor can we suppress the people's complaints just because the construction tasks are urgent. We need to show the common people this — we are not the old Kuomintang government; we are a government that can solve problems, not one that only holds meetings and issues documents. And that is not something shouted out in slogans; it is something done, one matter at a time.'\n\nChen did not reply. The two ends of the long table sat at a distance, and several cups of tea had already gone cold."
CPC_postwar.4.o: "The hall stayed quiet for a long time."

CPC_postwar.5.t: "The Critical Hour (3)"
CPC_postwar.5.desc: "Chen Boda looked down at the papers before him, seeming to want to say more, but in the end he did not. Xu Xiangqian, who had not spoken so far, now set down his teacup. He had lived through the brutal war years and seen many disagreements within the organization. Until now he had sat quietly listening; at last he spoke slowly: 'Comrade Deng, Comrade Chen, I think enough has been said today.'\n\nHe looked around, his tone unhurried: 'The matter of the cadres Comrade Chen raised cannot be dismissed just because it came in a letter from the people. If the things mentioned in the letter are true, then someone must be held responsible. The people sent the letter up; it cannot be allowed to end with no reply at all.' He turned to Deng: 'The coal transport and electricity supply Comrade Deng spoke of are indeed urgent problems we must solve. Railway capacity is short, power plants lack coal, and both production and daily life suffer. The Haicheng earthquake happened only recently, and recovery work in the stricken area cannot be delayed either. These things cannot be set aside just because we are arguing here today.'\n\nXu picked up his teacup, took a sip, and set it down again.\n\n'When commanding in battle, I know that one must watch the direction but also see to the supplies. If the direction is wrong, moving fast is useless; if the supplies don't keep up, the right direction still won't get you there. Building the country now is the same principle. We must not lose our political principles, but practical work must not be held up either.' He paused, then went on: 'I don't think these two matters need to be argued together. Send the complaint letter to the responsible departments for investigation, and any cadres who must be dealt with should be dealt with; as for the railway and electricity problems, let the relevant departments come up with solutions. As for today's personnel discussion, we should still take the overall situation as our starting point — we shouldn't reject a person over a single matter, nor ignore other aspects just because someone is capable.'\n\nXu did not elaborate further; he simply closed the papers at hand: 'We all came through this together. The country has only just recovered; the most important thing now is to get things done. We can differ in opinion, but we must not let these differences disrupt normal work.'\n\nThere was still not much sound in the room. Some picked up their teacups, others bowed over their documents. Chen did not signal agreement, nor did Deng continue to argue. Xu's few words did not remove the difference between the two sides, but they slightly eased the previously taut atmosphere."
CPC_postwar.5.o: "The meeting room fell silent again for quite a while."

CPC_postwar.6.t: "The Critical Hour (4)"
CPC_postwar.6.desc: "The comrade chairing the meeting looked from one side to the other, then flipped through the agenda in his hand: 'The secretariat will faithfully record today's discussion. The letter from the people and the railway transport problem will be referred separately to the relevant departments for study. As for the personnel arrangements, they will continue according to the established procedure. Does anyone have any other comments?' No one answered immediately.\n\nChen Boda straightened the papers before him and put them back in his folder. His fingers paused on the Lixin County complaint letter, then slipped it back among the documents. The matter in the letter had not been cleared up, and Xu's mediation had not changed his view. He simply did not speak again. Deng picked up the Datong Railway report, turned to the page marked 'insufficient capacity,' and glanced once more at the figures. He did not bring up electricity supply again, nor continue talking about the Haicheng earthquake; he only slipped the report back into his notebook and set it at hand. Xu remained where he was and said nothing more. He looked at Deng, then at Chen, then pushed his teacup a little to one side. The tea on the table had gone cold, and several delegates began quietly gathering their own documents.\n\nThe chairman announced a short recess. Chairs scraped one after another as the participants rose. Some went to the door and exchanged a few words with comrades they knew; others stayed in their places, continuing to leaf through the meeting minutes. The secretaries cleared the papers from the table, setting aside the few documents that had to be forwarded. When Deng got up, Chen was still seated where he had been. Their eyes met briefly, but neither spoke first. Xu rose, nodded to several old comrades he knew, and headed for the door as well.\n\nThe teacups on the long table were quite cold now, and several documents still lay spread where they were. Chen gathered up his materials; Deng left with his notebook; the two said not a word to each other. The meeting was over for the time being. The discussion of personnel arrangements would continue, the complaint letter still awaited verification, and the Datong Railway transport problem remained unresolved."
CPC_postwar.6.o: "No one spoke to one another."

CPC_postwar.7.t: "The Election"
CPC_postwar.7.desc: "The formal election was set for the fifth day after the preparatory meeting ended. That morning the hall was packed with delegates; the ballot box stood at the front, with scrutineers on either side. The air in the hall was a little stuffy — although a window stood ajar, the spring chill could not seep in; there was only silence and the sound of rustling paper.\n\nChen Boda sat on the rostrum, front row, left side, in a black Sun Yat-sen suit with the collar buttoned tight, his expression calm — neither tense nor lax. Before him lay a copy of Quotations from Chairman Mao, its cover worn white at the edges, but he never opened it. Deng sat on the right, some five or six meters away. His head was slightly bowed, seemingly reading some document on the table, though now and then his peripheral gaze swept the hall. His posture was a little more relaxed than Chen's; his right hand rested lightly on the table's edge, his knuckles moving occasionally.\n\nThe counting of votes went on for more than an hour.\n\nWhen the final figures were read out, the tally above Chen Boda's name was clearly higher than that of the other nominees. Chen stood and nodded to the hall. Applause began, but it was not warm — more like a polite response. He stood on the platform for about ten seconds, then sat down again.\n\nChen leaned slightly forward, but showed no distinct smile, nor made any move to rise. Throughout, the corners of his mouth hardly changed, as if he had already anticipated the result. Some present noticed he did not look in Deng's direction. Not once. Deng showed little emotion after the result was announced; he closed the document before him, set both hands on the table, and did not shift his posture. Someone saw him murmur a few words to a staff member beside him; no one knew what was said. His expression kept that pragmatic neutrality — neither pleased nor displeased.\n\nAfter Chen's victory, warm applause and shouts broke out in the hall:"
CPC_postwar.7.o: "'Long live the invincible Mao Zedong Thought!'"

CPC_postwar.8.t: "The Election"
CPC_postwar.8.desc: "As the results were being announced, Deng stood in the shadows of the hall's side corridor, a cigarette burning between his fingers. He had not stayed on the rostrum to await the final verdict; when the count was halfway through, he had left on the pretext of 'getting some air.' The secretary who had followed him for years knew him well: the more decisive the moment, the less willing he was to be caught in the center of that oppressive whirlpool, preferring to wait outside for the judgment.\n\nThe cigarette had burned halfway when the secretary hurried up through the side door and said in a low voice: 'Comrade Deng, the result is in. You have been elected President.' Deng's face did not change. He drew the cigarette slowly to its end, extinguished it against the concrete pillar in the corner, and only then asked calmly: 'What about Chen Boda?'\n\n'He says he fully respects the result of the election.'\n\nDeng nodded slightly, straightened his jacket, and turned into the hall. As he pushed the door open, there was a hush of about two seconds, then applause came rolling in like a tide. Representatives of the economic system, the government administration and the major local administrative cadres were the first to stand and clap; those who had been waiting and seeing joined in as well. He looked neither left nor right, walking straight to the front of the stage; in the corner of his eye Chen still sat at the center of the rostrum, face like iron, still as an old well. He delivered no stirring inauguration speech, only said briefly into the microphone: 'Thank you for your trust, comrades. Unifying and building this country has not been easy; the people have waited too long, and we cannot make them wait any longer. As for how we move forward from here, we will not listen to empty talk — we will look at real results.'\n\nAfter the meeting, the corridor was crowded with old subordinates offering congratulations, but he only waved them off and said, weary yet firm: 'Go back to work, all of you.' With that he put on his coat and walked slowly out of the Beijing Hotel. On Chang'an Avenue under the night sky the streetlights were coming on; he waited at the door for his car, lit a cigarette, took only two puffs and hastily crushed it out. He knew perfectly well that this ballot was not the end but a fragile truce. Chen's residual power was still there, the deep-rooted ideological foundations had not collapsed, and the rifts within the Party might grow only more glaring after this election. The battles ahead would be longer and harder than those of the war years.\n\nJust then a black sedan glided to the curb and stopped squarely before him. He opened the door and, as he got in, said to the driver in a low voice:"
CPC_postwar.8.o: "'Home.'"

CPC_postwar.9.t: "Aftermath"
CPC_postwar.9.d: CPC_postwar.9.d: "After the hall emptied, Chen did not leave at once. He remained in his seat, the Quotations from Chairman Mao before him still open, its cover worn white at the edges. Only when the staff came in to clear the tables did he close the book and take his documents away. Back in his office, he handed his coat to the secretary, then took the Lixin County complaint letter from his folder. The matter had not been cleared up, but he knew the problems it raised would not vanish simply because he had been elected.\n\nThis election proved that his political views still had the support of a good many comrades. Yet although Deng had lost the presidency, he had not lost his influence. He had spent years building up positions in the government and the economic system, knew administrative affairs intimately, and had a group of cadres willing to work with him. Chen was well aware that the work ahead could not bypass these people. He thought of the coal transport and electricity supply Deng had spoken of at the meeting. The Datong Railway report, the recovery after the Haicheng earthquake, and last year's grain losses from natural disasters were indeed problems that had to be dealt with now. Chen did not consider these matters unimportant. What he truly feared was that economic construction would gradually become the sole measure of all work, pushing the political stance of cadres and their relations with the masses into a secondary place. But he also understood that political principles could not remain only in meeting speeches and newspaper articles. The villagers of Lixin were still waiting for an answer, the power plant was still waiting for coal, and the people in the stricken area still needed to resume production. If he merely demanded that others uphold principles without getting these problems solved, what would today's electoral victory amount to?\n\nChen took up his pen and wrote a few lines of instruction in the margins of the letter, then called his confidential secretary: 'Keep investigating the complaint letter. Don't let it quietly die just because time has passed. The people who reported these problems deserve an answer.' The secretary took the document. Chen asked again: 'When will the Datong Railway transport report arrive?'\n\n'The relevant departments are compiling it.'\n'Urge them on. Send the figures on electricity supply and post-disaster recovery as well.'\n\nWhen the secretary had agreed and was leaving, Chen opened his notebook again. He knew he had gained the chance to push through political adjustments, but that did not mean everything would develop as he imagined. The administrative forces represented by Deng still existed, and the country's economic construction could not be stopped. He jotted down several pending tasks, then closed the notebook.\n\nOutside, the sky grew gradually darker. Chen put the Quotations from Chairman Mao back on the desk and let his eyes fall once more on the complaint letter. The election had given him his chance; what he had to do next..."
CPC_postwar.9.o: "was to prove that the road he held to could stand the test of reality."

CPC_postwar.10.t: "Aftermath"
CPC_postwar.10.d: "Night had worn deep. Deng returned to his quarters; several documents the secretary had delivered were still on the desk. He did not hurry to read them but poured himself a glass of water first, then sat down at the desk.\n\nThe result was in — he had won the presidency. The months of lobbying, coordination and argument had finally borne fruit. But Deng felt little relief. He picked up the Datong Railway report; the coal transport problem was still there, and several of the markings were ones he had left himself. An election could decide who presided over the work, but it could not make the piled-up coal ship itself out. He thought again of Chen's speech at the preparatory meeting. That letter from Lixin County was indeed not something to be brushed aside. Only the previous year a large-scale purge had been carried out, and yet cadres at the grass roots still dared to embezzle the people's money and even use the police station to suppress complaints. Chen's brooding over it was not without reason.\n\nBut Deng still disagreed with Chen's judgment. What worried him was that Chen tended to explain every problem in terms of line and stance, turning matters that could be settled through investigation, oversight and institution-building into a larger political struggle. He knew very well that Chen would not leave the political stage because of one electoral defeat. The theoretical faction still wielded considerable influence in the Party, and many cadres shared Chen's views. If victory were treated as a chance to sweep away all dissent, the government would soon be plunged into fresh arguments.\n\nDeng set the report down and leaned back. The most important thing now was to get every department back to normal work as quickly as possible. Coal transport, electricity supply, recovery in Haicheng, and agricultural production — none could be delayed because of a change in personnel. But the Lixin problem had to be investigated too; grass-roots cadres must not be allowed to think that a new leader meant old scores could be written off. He called the secretary: 'Tomorrow, tell the relevant departments to send up the reports on railway transport and electricity supply first. And keep investigating that complaint letter — don't rely only on reports from the localities.' The secretary wrote it down, and Deng added: 'Don't cold-shoulder Comrade Chen just because of the election result. His views are still worth hearing.'\n\nWhen the secretary had gone, Deng reopened the report. Outside, the night was very deep; the recommendation letter on the desk was still pressed beneath the documents. He knew the election was over."
CPC_postwar.10.o: "but the real work had only just begun."

