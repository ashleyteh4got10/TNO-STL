#Homecoming event chain - The Long Road Home
STL_CPC_main_story.1.t: "A Letter from the Northern Foothills"
STL_CPC_main_story.1.desc: "Almaty, the largest city in Kazakhstan, is like a pearl at the foot of the Tianshan. A thin veil of cloud and mist drapes over the mountains, dreamlike and unreal. Sunlight spills across the snow on the peaks, scattering brilliant light, a breathtaking painting come to life.\n\nIn the office, Sergei finished tidying up the army's paperwork and set about drafting a new training plan. 'Knock, knock, knock——' came an urgent rap at the door. 'Come in!' Sergei said without looking up, absorbed in his files.\n\nA young Kazakh poked his head in — it was Amir, Sergei's friend. Amir wore a smile. 'Sergei, look at today's paper!' he said, handing the newspaper over.\n\nSergei took it with a puzzled frown, but the huge, clear headline made the importance of the matter instantly clear——\n\n§YInner Mongolia and the Mongolian People's Republic, backed by the Communist Party, unite Mongolia!§!\n\nNearly twenty years away from his homeland, longing for the old soil lay deeply buried in Sergei's heart. Through the days and nights in a foreign land he seemed rarely to dwell on it, yet whenever he started awake from a midnight dream, the salt-damp wind of parting would blow into his mind again, caressing his vision of returning home."
STL_CPC_main_story.1.o: "What should I do....."

STL_CPC_main_story.3.t: "The Past"
STL_CPC_main_story.3.desc: "From the time he arrived in Marseille, France, and made his winding way into the Leningrad Military-Political School, he had once imagined himself serving the revolution.\n\nWhen the Great Patriotic War broke out, he was unwilling to merely study at the academy and joined the Communist Party of the Soviet Union to defend the revolution. After joining the 2nd Belorussian Front, he threw himself bravely into battle. In the harsh years of the Great Patriotic War, Sergei held on through sheer perseverance and resolve, and kept honing himself in the years that followed.\n\nThen came bad news after bad news. The Union of Soviet Socialist Republics, led by Bukharin, suffered one defeat after another in the Great Patriotic War, and the situation collapsed like a landslide. In the end he withdrew with Marshal Yegorov to the West Russian Revolutionary Front, fighting for the revolution alongside the Marshal.\n\nIn that West Russian War, which changed his life, he commanded valiantly and fought the enemy with courage. But infighting within the revolutionary front, defeats against the Germans, and the departure of the leader of the West Siberian People's Republic finally doomed the West Russian War to failure, and the West Russian Revolutionary Front collapsed.\n\nWith Marshal Yegorov's approval, he led his troops to the Kazakh Soviet Socialist Republic. Sergei knew the revolution would not fail, and he refused to give up — but he was thousands of miles from the Front, his will strong but his strength unequal to it."
STL_CPC_main_story.3.o: "The Spark of Revolution Will Never Die"
STL_CPC_main_story.5.t: "Remembrance"
STL_CPC_main_story.5.desc: "Liu Siqi stood at the apartment window, gazing at the street far below stirred by the light breeze, her mind already lost in thought.\n\nMore than ten years ago, before she left this land, it had been nothing but yellow sand; now it was alive with birdsong and flowers. She was young then, knowing only to follow that silent, steadfast man toward an unknown future.\n\nDuring their time in the Soviet Union, he had told her that place had taught him two things——how to endure in suffering, and how to rise again from ruins. And she had never betrayed his trust: from the sorrow of the Great Patriotic War, through the carnage of the first West Russian War, to the campaigns to suppress rebellion on the Kazakh steppe, she had stayed at his side, unwavering.\n\nOver the years, war had indeed changed many people. The young man who had once come to the Soviet Union with books and ideals had grown into a commander tempered by fire. He no longer showed his emotions lightly; after every operation he would quietly compile the list of the fallen.\n\nLiu Siqi knew that what he carried had never been only his own fate.\n\n'Have you ever regretted it?' she asked softly one night.\n\nHe was silent a long while, then said slowly: 'If history were to begin again, I would still choose this road.'\n\nOutside the window, the bells of Almaty rang out slowly.\n\nThe world kept turning onward, but they both understood that the war belonging to their generation had never truly ended.\n\nLiu Siqi gently took his hand. Wherever the future led, she knew she would keep accompanying this man who had walked out of war, until the end of the world."
STL_CPC_main_story.5.o: "Wherever you may go, you are always by my side'"
STL_CPC_main_story.7.t: "Love Amid the Flames of War"
STL_CPC_main_story.7.desc: "Love in wartime never really unfolded amid flowers and applause.\n\nBack then, the Great Patriotic War was still raging. When they were in Moscow, the streets still bore the scars of shell fire. When Liu Siqi saw Mao Anying again, he was still a young soldier, his eyes shining with resolve.\n\nWhat struck Liu Siqi most was Mao Anying sitting alone in a corner, recording the names of the soldiers who had fallen that day. He said softly: 'Because... I feel they shouldn't be just numbers in a report. I have to do something.'\n\nTheir feelings did not begin with romance; they were built up bit by bit, war after war. Liu Siqi had seen him exhausted, and had seen him forcing calm to hearten his men.\n\nAfter one battle, Mao Anying was wounded, and Liu Siqi kept watch beside him the whole night.\n\n'What do you want to do when the war is over?'\n\nMao Anying was silent a long time, then said softly: 'If I get the chance, I want to help build a world without war.'\n\nLiu Siqi only took his hand in silence.\n\nShe knew that however long the road ahead, there would always be someone at his side.\n\nHer name was Liu Siqi.\n\nShe was his wife, and the person he loved most in this life."
STL_CPC_main_story.7.o: "'She was my comrade-in-arms and my beloved all my life'"
STL_CPC_main_story.9.t: "Fading Memories"
STL_CPC_main_story.9.desc: "During his time in Kazakhstan, Sergei's outstanding abilities shown in the Great Patriotic War and the West Russian War earned him the rank of major general, and he helped the Kazakh Soviet Socialist Republic quell the chaos there.\n\nBut Sergei could never put his homeland out of mind. He did not know what had become of it — while he fought for the revolution, his home was suffering under the invasion of Japanese fascist imperialism. Later he learned that the Japanese offensive had broken Chongqing's last resistance, and the Chongqing government had ceased fighting. His father had led the army northwestward in a continued retreat, now surrounded and attacked by forces from all sides.\n\nHe did not know what exactly had happened in his homeland, or how his father was faring now... but one thing was certain — his homeland had fallen into hell.\n\nSergei was in pain, no doubt. He was unwilling to abandon his duty, yet he was still a wanderer longing for home — longing to see his kin, to feel the wind of his homeland, to set eyes on its soil again.\n\nWhen he heard the news that a thunderbolt had struck his stagnant homeland, he understood: he would carry out a second revolution; he would save the revolution with his own hands, and save the people of his homeland."
STL_CPC_main_story.9.o: "Only Death Is the End of Duty"

STL_CPC_main_story.2.t: "The Long Road Home"
STL_CPC_main_story.2.desc: "'The pass is as iron, yet now we stride forward and begin anew'\n\nWith Kazakhstan's consent, Sergei set out for that distant homeland in the capacity of a diplomatic envoy of the Kazakh Soviet Socialist Republic.\n\nGetting home from Kazakhstan was no easy task. The former Union of Soviet Socialist Republics had collapsed, and the old Soviet soil was racked by warlordism and roaming bandits; the road ahead was fraught with peril. He had to cross the vast expanse of Soviet territory, a land crawling with warlords and marauders.\n\nSergei carried on his father's optimism, calling this journey of revolution and national salvation the 'Long March'. He would see the revolution through to the end, just as his father had.\n\nThe first morning light shone over Ayaguz, turning into a hazy hope. The column's camp was livelier than usual; the soldiers struck their tents while eagerly discussing life after they returned home. To reach home the sooner, Sergei ordered them to travel light, leaving much of the heavy weaponry and surplus supplies behind in Kazakhstan.\n\nMany in the column were of mixed Chinese-Russian blood, and they felt the pull of 'homecoming' more keenly than the old men. It was precisely the unknown that made them long for it all the more.\n\nHomecoming meant not only redemption for the living, but a resting place for the dead. Sergei vowed to bring everyone back — even the ashes of those who were gone — to the yellow earth of their homeland."
STL_CPC_main_story.2.o: "'A wanderer longs for a distant homeland'"

STL_CPC_main_story.4.t: "The Long Road Home (2)"
STL_CPC_main_story.4.desc: "'The Red Army fears not the hardship of the Long March; ten thousand rivers and a thousand mountains are but trifles'\n\nHeading east from here, the sight of a radar station would mean the People's Revolutionary Committee was not far off — Saifuding was explaining to Sergei what to watch for.\n\nAcross a land of blowing yellow sand, the column pressed on toward Kizil. Infrastructure was wretched, the roads all but impassable, and the trucks often sank into the mud, forcing everyone to get out and push. Sergei and several commanders climbed to high ground to plot the route carefully: where there were rough tracks, where villages lay, where the supply wagons could pass... every step taken with the utmost caution.\n\nAfter much trudging, the column finally reached Kobdo and entered the lands of the People's Revolutionary Committee.\n\nBrezhnev came galloping up on a white horse, cheering; he had made contact with the Mongols — Marshal Vasilevsky was waiting for them in person.\n\nFor this column it was another stretch of living under others' roofs. But home was drawing ever closer. The soldiers sat around the fire eating tinned rations; Brezhnev contributed a crate of liquor, and everyone broke into song.\n\nThen Sergei learned earth-shattering news — his father was alive. Father and son were finally to meet."
STL_CPC_main_story.4.o: "'Though the road ahead is hard, the heart's resolve to return never wavers'"

STL_CPC_main_story.6.t: "The Long Road Home (3)"
STL_CPC_main_story.6.desc: "Though the old roads had gone unmaintained, they were still solid and serviceable. Brezhnev led the column onward toward Ulaanbaatar.\n\nAfter speaking with Vasilevsky and Demid, Sergei gained a clearer picture of the misery gripping his homeland: a people in anguish, famine running rampant, the puppet government and Japanese devils cruelly oppressing the Chinese populace. The conversation steeled his conviction — only the Communist Party could save China, and only revolution could sweep away every reactionary.\n\nNights in Ulaanbaatar left Sergei unable to eat or sleep. Standing outside his crude tent, gazing at the starry sky, image after image of his hometown elders in dire straits rose in his mind. How could he save them sooner? The thought burned in his chest like a flame.\n\n'Go south from here and you'll reach the Northwest Defense Front. Good luck,' Demid said, clapping him on the shoulder.\n\n'Comrades, we're here! One more step and the ground beneath our feet will be the soil of our motherland!'\n\nAt Sergei's shout, many soldiers jumped down from the trucks. This stretch they would measure with their own feet, taking the first step onto their homeland. Zhao Tianjun, like the others, stepped quietly onto the soil of the motherland — no cheers, no tears, only silent forward strides.\n\n'Get in touch with the radio station here, comrades. Raise our flag — we've come home!'\n\nThe banner of the 109th Division was hoisted high, and alongside it unfurled a huge scroll bearing the word 'Homecoming' in Chinese characters. The border post soon learned the news; they had long heard that a legendary unit would be returning across the frontier. Zhao Weiming swiftly sent men to verify their identity, then flashed an urgent telegram to Xi'an——\n\nAfter all their trials and hardships, the column was finally home."
STL_CPC_main_story.6.o: "'We have at last set foot on the soil of our motherland'"

STL_CPC_main_story.8.t: "The Long Road Home (Finale)"
STL_CPC_main_story.8.desc: "The breeze of Xi'an carried the distinctive desolation of the Loess Plateau.\n\nStanding on the ancient city wall, Liu Siqi gazed at the rolling mountains in the distance and suddenly thought of their life in the Soviet Union many years before. Yet they had come back in the end.\n\nAfter returning to the Northwest Defense Front, they arrived in Xi'an. This was Mao Anying's home, and the place where the father he had not seen for so many years lived.\n\nWhen Mao Zedong saw his son again, both men were silent for a long while.\n\n'These years have been hard on you,' were the first words the father spoke after that long silence.\n\nMao Anying shook his head gently: 'In this day and age, there is always someone who bears more than I do.'\n\nMao Zedong reached out and lightly patted his son's shoulder.\n\nLiu Siqi stood to one side, watching the scene.\n\nAt that moment Mao Anying was no longer a commander; he was only a wanderer come home, a son finally back at his father's side.\n\nThe family sat together under the lamplight, talking of the past and of the future."
STL_CPC_main_story.8.o: "'Father and son, reunited at last'"

STL_CPC_main_story.10.t: "Ordinary Days"
STL_CPC_main_story.10.desc: "These days, for Mao Zedong, were perhaps a rare stretch of peace in many years.\n\nAs Mao Anying and Liu Siqi returned to the northwest, Mao Anqing and He Zizhen also came back to Xi'an. The family was reunited at last.\n\nMao Zedong looked at his two sons standing before him, silent a long time, and finally said only, softly: 'Welcome home.'\n\nAt dinner, for once he did not talk about work, but quietly asked the children about their experiences over the years.\n\nMao Anqing said: 'The hardest part wasn't meeting with difficulties. It was missing home and not knowing when we could come back.'\n\nMao Zedong listened and bowed his head in silence.\n\nHe Zizhen's return gave the reunion a still more special meaning. She said lightly: 'It's all in the past.'\n\nAfterward, Mao Zedong often took walks with his two sons, talking about building the country and about family matters too.\n\nLiu Siqi stood to one side, watching. She realized that Mao Zedong, so calm and decisive on the battlefield, was in front of his family simply an ordinary father."
STL_CPC_main_story.10.o: "A Reunion Long Delayed, All the More Precious"

STL_CPC_main_story.11.t: "A Moment of Happiness"
STL_CPC_main_story.11.desc: "Spring finally came to Xi'an.\n\nLiu Siqi stood before the mirror, looking at her wedding dress, a little dazed.\n\nTheir love, all the way, had known neither flowers nor fireworks, nor romantic dates. There had only been mutual support along a long road, a greeting in the depth of winter, and those words at countless partings: 'Wait for me to come back.'\n\nThe wedding was not lavish; Mao Anying insisted on keeping everything simple. Many comrades-in-arms and ordinary people came to offer their blessings.\n\n'Who would have thought the lad who once charged with a gun would live to see a day like this?' an old comrade said with a laugh, clapping Mao Anying on the shoulder.\n\nAt night, Liu Siqi and Mao Anying stood atop the city wall, gazing at the lights of ten thousand homes.\n\n'Do you remember when we first met?'\n\nMao Anying nodded: 'I do. Back then, I never imagined we would come this far.'\n\nThey both knew the future would not always be peaceful, but at least for this moment they held a rare tranquility."
STL_CPC_main_story.11.o: "'May we never be parted in this life'"

STL_CPC_main_story.12.t: "Father and Son"
STL_CPC_main_story.12.desc: "§Y'Tap, tap, tap...'§!\nMao Zedong pricked up his ears; footsteps were coming from beyond the threshold, drawing nearer. He raised his head slightly, then went back to his papers, sitting a little straighter.\n'——Anying?'\nThe man opposite stopped. 'Comrade Chairman...' The words touched his lips and stopped there, the rest dissolving into the air.\n'How can you tell just from footsteps...'\n\nMao Zedong put down his pen, looked up at him, and smiled faintly: 'No need to be so formal. Come on, call me comrade and let me hear it.'\n'Comrade Mao Zedong... I suppose I'll keep calling you Comrade Chairman.'\n'All right, call me whatever you like, Anying.' The cigarette between Mao Zedong's fingers was still burning; he raised it to his lips for a light pull, then set it on the rim of the porcelain jar beside the desk, half of it left, and tapped the wooden stool at his side with the pen cap: 'Don't stand. Sit. You came in with something on your mind, so sit down and take your time.' Mao Anying tugged at his trousers and said: 'You can tell who it is by the footsteps alone, without looking?'\nMao Zedong did not answer directly. Instead he reached for the half cigarette on the jar's rim, relit it, but this time did not draw on it; he only held it between his fingers, and after a long while said slowly: 'Those footsteps have such strength. The heels of leather shoes are too low for you, aren't they?'\n'They take a bit of getting used to.'\n'You'll get used to them in time. Now, what is it?'\n'Chairman, not long ago you asked where I wanted to work. I have my answer.'\n'You do? Then let's hear it.'\n'I want to join the army.'\n\nMao Zedong drew on his cigarette, his brows knitting slightly. Mao Anying went on: 'Chairman, I've thought about this a long time and discussed it with Siqi. She supports my decision.'\n'You've only just come back. Why do you want to go to the army again?'\n'I want to do my part. I finally made it back, and I want to contribute in the field I'm good at, to put the experience I gained fighting in the Soviet Union to use.'\n\nMao Zedong listened to Mao Anying's explanation, smoking one puff after another. By the time Mao Anying finished, he found his cigarette had burned down to the filter.\n\nReluctantly tossing the butt into the ashtray, Mao Zedong leaned back in the wooden chair and said slowly: 'Then let me see whether these decades in the Soviet Union taught you anything. Since you've made your plans, do as you say. But once you're in the army, you must observe our discipline and get along well with your comrades. Don't put on airs; be considerate of them. You've been through many wars and seen much; there will be things they don't understand, so be patient. You are the son of me, Mao Zedong — don't think too highly of yourself. And when you're in the army, take good care of Siqi. If Siqi comes running to me to complain about you, I'll give you a scolding.'"
STL_CPC_main_story.12.o: "'I understand, Fa...ther'"
STL_AnYing_LFB_tt: "If the father had given his life in the War of Resistance Against Japanese Aggression, the storyline of the 88th Guards Rifle Brigade and Mao Anying §xgrowing up alone§! might have unfolded in the timeline of §R'The New Order: Light from Lake Baikal'§!......\nMao Anying joins the £TNO_game_rule_flag_CPC Northwest Defense Front."


