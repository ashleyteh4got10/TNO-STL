CPC_the_Golden_Mean: "The Golden Mean"
CPC_Deng_Xiaoping: "Deng Xiaoping"
Deng_Xiaoping_DESC: "No party outside the party — that is imperial thinking; no faction within the party — that is bizarre indeed.\n\nAs Mao Zedong's chief assistant in repairing the grave consequences of the Great Leap Forward, Deng Xiaoping had strong powers of decision and was a man who got things done, rendering meritorious service. Besides, he was among the earliest Party members, a classmate of Zhou Enlai's during his years in France, and the greatest backer of Mao's 'mountain-top' faction. After Chairman Mao stepped down following the third anti-encirclement campaign, Deng was branded as belonging to a faction for his pro-Mao stance, becoming one of the famous 'Four Giants of the Maoist faction'. This was the greatest political capital of his life, and the reason why, even after he put forward the heterodox idea that 'whether a cat is black or white, it is good if it catches mice,' he was still regarded as a key component of Maoism. Even if some classify Deng's faction separately as the 'Secretariat faction,' within the Party it is mostly seen as a heterodox offshoot of Maoism. To this day he himself styles himself a 'Maoist' — at least on the surface. Though a communist, he is not much concerned about the ideological labels of his own economic views — in terms of his 'black cat, white cat' theory, any economic system that can sustain the development of a socialist state can be used by a socialist state. Many people have found fault with the direction of his line. Faced with doubts from Party comrades and even punishment from Chairman Mao, Deng replied firmly: 'I am only using capitalist means to realize the communist ideal and thereby develop the productive forces. Only when the productive forces are developed can socialism stand firm.' As an old politician who could bend as well as stand firm, Deng possessed extraordinary patience. He did not always insist on his own views; when the Party's winds shifted, he knew how to give ground at the right moment. In his own words, 'to endure is to think things through and hold firm.'\n\nToday he is still regarded as a qualified revolutionary, but as to where this party and state — built with blood and sacrifice — will go in the future, Deng may not have a precise answer. Taking up the History of Ming that Mao Zedong handed him, all he can do is change course a little at a time while keeping Mao's basic direction steady — only 'crossing the river by feeling the stones.' And where will that river finally lead? Probably only heaven knows."

CPC_Guardian_of_Orthodoxy: "Guardian of Orthodoxy"
CPC_Zhang_Chunqiao: "Zhang Chunqiao"
Zhang_Chunqiao_desc: "As the Party's theorist, Zhang Chunqiao's theoretical level is second to none.\n\nCarefully following Chairman Mao's teachings, he conducted investigations in the countryside near Xi'an. His incisive critiques of the various problems in the rural areas quickly caught Ke Qingshi's eye, making him a member of the so-called Maoist faction. After entering the central leadership, Zhang kept his sharp edge in attacking the ills of the times, helping Mao Zedong clear away many obstacles in public opinion. Yet just as his career was flourishing, Ke Qingshi — the teacher he looked up to — passed away. Mao Zedong's death threw the whole Party into panic, no doubt; who would preside over the future? Factions of every kind had their own schemes, and the shifting, treacherous currents within the Party constantly tugged at this guardian's sensitive nerves.\n\nThis forced him to consider one great question: how, in the period of socialist construction, to hold high the banner of Mao Zedong Thought and hold the line of socialist ideology?"
