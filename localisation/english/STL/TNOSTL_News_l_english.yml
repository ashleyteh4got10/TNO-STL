 #WORLD_STL.1.t: "[Get_newspaper_header]Australian Crisis Ends: Communists Take the New Regime"
 #WORLD_STL.1.d: "The weeks-long Australian constitutional crisis ended as expected. Facing the predicament of being isolated and without support, the Australian Prime Minister Bjerke-Petersen announced his resignation and swiftly went into exile in the United States. The military immediately ordered all troops back to their barracks to stand by, avoiding needless bloodshed; the nationwide standoff thus came to an end, and the communists claimed victory in this 'revolution'.\n\nIt is said that the veteran revolutionary E.F. 'Ted' Hill, building on the Australian Communist Party's Marxist-Leninist faction, united communists of all stripes to form a united front and formally took the new regime's reins.\n\nAlthough a festive atmosphere of struggle's victory pervaded Australia, internal infighting within the united front began to surface. Observers noted that Hill's core challenge lies in the long-standing feature of Australia's political ecology — 'strong unions, a weak and fragmented party'. He is therefore seeking a creative reconciliation between Australia's deep syndicalist tradition and Marxism-Leninism-Maoism, exploring what he calls a 'socialist path with national characteristics'.\n\nMeanwhile, the remnants of the old regime have not entirely disappeared. Small opposition armed groups have holed up in the vast deserts and jungles, expressing their protest against the New Order by ambushing transport routes and remote desert towns. To the new government, however, these ragtag forces, contemptuously dubbed the 'White Kelly Gang', are but little flies destined to bump their heads against a wall."
 #WORLD_STL.1.a: "It is time to face a completely different future."
 #WORLD_STL.2.t: "[Get_newspaper_header]Martial Law Declared, Australia Slides into the Abyss of Civil War"
 #WORLD_STL.2.d: "Prime Minister Joe Bjerke-Petersen refused to hand over power, declared a state of emergency, and vowed to maintain his rule by 'all necessary means'. The Australian Communist Party's Marxist-Leninist faction promptly established the 'Australian People's Government' in Sydney, claiming to represent the working class and calling on unions, students and defecting armed units to join, while denouncing the Petersen government as unconstitutional. Civil war took shape overnight: the Petersen government held Canberra and several military strongholds, while the People's Government massed in the southern and eastern industrial cities, with both sides exchanging fire in multiple locations.\n\nWashington broke its silence. The Organization of Free Nations, citing the 'protection of civilians', formed a multinational peacekeeping force and established a 'trust zone' along the northern coast. Critics charged that the move was in fact aimed at preventing a pro-socialist regime from emerging in the South Pacific. Inside the trust zone, the former Labor and Liberal leadership jointly issued a statement condemning the Prime Minister, rebuilding their political presence under a foreign military umbrella.\n\nA war that will decide Australia's future has already begun."
 #WORLD_STL.2.a: "As expected."
 #WORLD_STL.3.t: "[Get_newspaper_header]Australia's Great Strike"
 #WORLD_STL.3.d: "Australia is experiencing unrest far exceeding the 1923 Melbourne police strike. University students across the country have set up camp at roadblocks, vowing a protracted struggle; the major unions have jointly called a general strike, and the slogan 'Not my republic!' has swept the streets. The strike has taken a darker turn — urban guerrilla groups inspired by the 'Red Army Faction' have appeared in several cities, and bomb attacks against public security authorities have left the government at its wits' end.\n\nFaced with a situation slipping out of control, Prime Minister Joe Bjerke-Petersen only poured oil on the fire. In an emergency television address, he tore up the old 'Australian Constitution' — already cut to pieces — in public, then raised a shotgun, vowing to 'restore order at any cost'. Observers at home and abroad uniformly condemned this as a brazen declaration of authoritarianism — the law is dead, and only the will of the gun barrel is truth.\n\n\nThe government also announced that the newly formed 'Miners' and 'Farmers' militias have been granted additional law-enforcement powers and are moving into urban areas alongside police forces to suppress the mass movement."
 #WORLD_STL.3.a: "Australia's future looks bleak."
 WORLD_STL.4.t: "[Get_newspaper_header]China Convenes Its First National People's Congress"
 WORLD_STL.4.d: "Today, world-shaking news came from China: the People's Republic of China convened its First National People's Congress in Beijing. The release of the communiqué caused a sensation at home and abroad; the press conference held after the congress was packed, and major newspapers around the world opened special columns to carry the story. The congress promulgated a constitution, establishing the National People's Congress as China's highest organ of state power; designating the Communist Party of China (CPC) as the sole legal ruling party nationwide, with other parties participating in state governance as participating parties; and establishing socialism as China's fundamental system.\n\nThere is no doubt that this congress marks the final passage of the Central People's Administrative Committee into history, and that the Communist Party of China (CPC) has indeed fulfilled its pre-war promise. Previously, many had worried that the CPC would slide into dictatorship under the cover of post-war reconstruction, but the facts show that the CPC still wants China to move toward democracy. How the CPC will implement democratic institutions in China in the future, however, remains to be seen."
 WORLD_STL.4.a: "The Dawn of China's Century"
 WORLD_2WRWTER.1.t: "[Get_newspaper_header]Communist Coup in Laos"
 WORLD_2WRWTER.1.desc: "Many have accused Laotian Prime Minister Souphanouvong of communist sympathies, in public and in private. Today, the Red Prince proved such claims correct. After the establishment of the Southeast Asian Revolutionary League, he not only publicly declared support for its member states but, as a gesture of solidarity, even openly withdrew from the Co-Prosperity Sphere to join the league. Laos was renamed the Socialist Republic of Laos, joining Vietnam in a burgeoning communist bloc spanning Asia.\n\nBecause Souphanouvong had previously expressed support for pan-Asianism, his move took everyone by surprise. A baffled Japan issued a sharp condemnation, as the millions of yen it had invested in Laos' development went down the drain. Souphanouvong also banned several royalist and far-right parties at home and recalled Indochinese Communist Party officials previously expelled from Laotian politics to the government. Despite all this, the country's existing democratic structures underwent no other changes.\n"
 WORLD_2WRWTER.1.a: "The Co-Prosperity Sphere has lost another member."
 WORLD_2WRWTER.3.t: "[Get_newspaper_header]Sino-Russian War"
 WORLD_2WRWTER.3.desc: "With the breakdown of Sino-Russian negotiations, Russia has shockingly declared war on China while the latter was not fully prepared, and its troops have now crossed the Sino-Russian border. [SOV.GetLeader] publicly declared that the purpose of this war is to 'retake the Far Eastern ancestral lands occupied by China'. Hours after the war broke out, the Chinese government 'expressed strong protest' at the Russian government's actions and launched wartime mobilization nationwide, calling on all the people to actively resist the invaders, while appealing to all states of the Asian Revolutionary League to help China resist the aggression of 'Russian imperialism'.\n\nAt the very outset of the war, OFN declared its support for China against Russian aggression, shipping weapons and dispatching military advisers to Asian Revolutionary League member states; although the Unity Pact has not yet reacted to the war, international commentators believe that, in order to weaken Russian power, it is likely to side against Russia. According to sources familiar with the matter, Japan — which vanished from the scene after a crushing defeat in the Second Greater East Asian War a few years ago — has, after several years of recovery, begun massing troops again and moving toward the Sino-Russian border from the direction of Hokkaido."
 WORLD_2WRWTER.3.a: "Let's do it again."
 WORLD_2WRWTER.3.b: "Burn the Boats."
 WORLD_2WRWTER.3.c: "Why are Europe and Asia fighting again?"
 WORLD_TER.400.t: "[Get_newspaper_header]'Sino-Soviet Treaty of Friendship' Formally Signed"
 WORLD_TER.400.desc: "Today, news came from Moscow and Beijing: [CPC.GetName] and [SOV.GetName], two socialist states that had only recently ended their civil wars, formally signed the 'Sino-Soviet Treaty of Friendship, Alliance and Mutual Assistance' in Beijing. The treaty stipulates that China will provide volunteer armies and equipment support for the Soviet Union's Second West Russian War, while the Soviet Union will return the parts of Mongolia it occupies, Tannu Tuva, and the Chinese Far Eastern region of the 'Outer Northeast'; after the war, the two countries will form a mutual-aid alliance in economic, technological and resource matters, seeking common development and common progress.\n\nMost international media saw this as another sign of the growth of the international communist movement; Germany and Japan made no comment."
 WORLD_TER.400.a: "Long Live the Great Unity of the Peoples of the World!"
 WORLD_TER.400.b: "Just a dying struggle."
 WORLD_TER.400.c: "......"
 WORLD_TER.400.d: "Might the New Order thus glimpse a ray of dawn?"
