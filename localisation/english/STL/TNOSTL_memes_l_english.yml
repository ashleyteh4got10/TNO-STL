 POLITICS_YUG_KASANE_BROZ_TETO_DESC: "No idea why, but that day after the Croatian partisans got wiped out by the Krauts, Tito took a nap and her hair turned red on its own, and she grew two red drill bits on her head that the barber couldn't cut off, and then for some reason she gained divine powers and nobody could tell she was Tito, so she survived in the world as Kasane Teto and fled to Japan to become a virtual singer. Yeah, that's right."
 Tomorin_DESC: "Takamatsu Tomori (たかまつともり) is a character from the next-generation girls' band project 'BanG Dream!' planned by the Japanese entertainment company Bushiroad, and its derivative works. She is the lead vocalist of MyGO!!!!!, and her representative color is #77BBDD.\n\nA first-year high school student at Haneoka Girls' Academy, she is the sole member of the astronomy club inherited from the former student council president, Hikawa Hina. She has served as the lead vocalist of both CRYCHIC and MyGO!!!!!. She lives near Tsukinomori Girls' Academy.\n\nA somewhat pessimistic girl. She has delicate emotions and her own unique inner world. She easily feels lonely and often calls herself 'feeling lonely'. She is extremely sensitive to interpersonal relationships, constantly worrying whether her words and actions will have a negative impact. Thus she always dies in fan works (such as the common 'chandelier' meme), though her ways of dying are no longer limited to suicide. Although she admits she isn't very good at singing, she still tries her best to sing. She writes lyrics in her notebook."

