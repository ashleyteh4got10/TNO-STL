 STL_Omsk_Witch_Trial_category_desc: "[STL_OMSK_TGWT_STATUS]"
 STL_TGWT_russian_desc: "Central Siberia has been unified under one banner. But for Tsukishiro Yuki, this is only the first step——and for her revenge plan, it is also only the first step. Next, it is time to set her sights on this Russian land full of warlord infighting......"
 STL_TGWT_desc: "§RThe momentous Magical Girl Great Witch Trial has begun.§! We can finally tear off the disguise, sweeping that pathetic so-called 'democracy' and 'freedom' together with the very word 'humanity' into the dustbin of history, repaying a hundredfold what this race that calls itself 'civilized' has done to witches, until it is utterly erased from the earth.\n\nThe great rejuvenation of the witch race shall come at last.\n\n-§R[MGI_TGWT_Get_Region]§!\n---------------\n[MGI_TGWT_Get_Region_Desc]\n\n"
 STL_European_desc: "Now, the spear of our Trial points to Europe.\n\nLooking back over the bloody history of this continent, countless brutal wars had this as their main battlefield. In the Second World War, the hypocritical Axis usurped victory and, in the name of a so-called 'New Order', inflicted cruel exploitation and enslavement upon their own kind.\n\nThe inherent depravity and ugliness of the human species are fully displayed on this land. They styled themselves the cradle of civilization, yet all they bred was endless slaughter and a decadent lust for power. Such a base species does not deserve to continue on this planet.\n\nHere, our primary objective is to utterly wipe out the core leading nation of the Pakt——the Greater Germanic Reich——and let these arrogant sinners become ashes under the karmic fire."
 STL_Indopacific_desc: "Now, our strategic advance has stepped into the Indo-Pacific region.\n\nThe Empire of Japan is the region's largest projector of power. Its biological experiments in Manchuria and its brutal plundering in Southeast Asia are but further ironclad proof of humanity's capacity for every evil in pursuit of selfish desire.\n\nThe hellish scene of that day remains fully before my eyes to this very hour. Those executioners, raising the Rising Sun flag and shouting 'Long live His Majesty the Emperor', as they slaughtered my entire witch race——did their faces not bear the most ugly and greedy smile of humanity? Yamato people, and all the ignorant blind followers on this land, every drop of blood in your bodies turns my stomach.\n\nHere, our primary objective is to utterly destroy the core leading nation of the Greater East Asia Co-Prosperity Sphere, the Empire of Japan, and its puppet Republic of China, and use their blood to offer sacrifice to the departed souls."
 STL_American_desc: "Now, the Sword of Damocles points to the Americas.\n\nThe United States of America is the major projector of power in the New World. This nation, which once won independence by betraying its suzerain, after tearing off the mask of liberty built instead a white supremacist empire that expelled the indigenous peoples and discriminated against people of color.\n\nThe so-called 'beacon of democracy' is nothing but a garbage heap piled high with capital and hypocrisy. Humanity is always adept at using lofty rhetoric to conceal its greedy nature; such an inconsistent, despicable and shameless nation does not deserve to remain within my sight.\n\nHere, our primary objective is to utterly destroy the core leading nation of the Organization of Free Nations——the United States of America——and tear away the last shred of decency from these hypocrites."
 STL_African_desc: "Now, the scope of our cleansing has extended to Africa.\n\nHaving endured ravagement and the flames of war, the various forces in Africa today are deeply intertwined. Here there are the surviving remnants of colonial empires, as well as native warlords who, amid the chaos, fight one another and devour each other's flesh for paltry gains.\n\nDon't talk to me about pity and compassion——human tears only sicken me. Once victims grip power, in an instant they become perpetrators. In this Trial of all humanity, not a single human is innocent. Weakness is no exemption for you; your ignorance and chaos are likewise a tumor parasitizing this planet.\n\nHere, we will leave no corner untouched. The witches' footsteps will tread every inch of this land, annihilating every last pest named 'human' that resists to the end."
 STL_Central_desc: "Now, our strategic objective has locked onto the central region.\n\nAs the absolute hub connecting the continents, controlling this place will provide us with unparalleled strategic advantage for our global Trial.\n\nLook at this land: greedy humans bleed one another dry over the oil and wealth beneath the ground, and on the ruins of civilization nothing remains but sectarian vendettas. They kill one another over empty faith and material gain, writhing in the mire like maggots. I am deeply weary of this species' incurability.\n\nHere, our primary objective is to crush all balances with absolute might and destroy every hostile force that dares to obstruct the Trial."
