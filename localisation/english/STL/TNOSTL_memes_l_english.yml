 WORLD_2WRWTER.114514.t: "[Get_newspaper_header]The Magical Girl Great Witch Trial"
 WORLD_2WRWTER.114514.desc: "A month has passed since Tsukishiro Yuki publicly announced the seizure of the Omsk regime, and the world had begun to think of it as merely a small ripple in Russian politics. However, today Tsukishiro Yuki suddenly declared war on all surrounding nations and mobilized the country's entire army, marching beyond the border. The OFN, the Pakt, and the Co-Prosperity Sphere nations all expressed strong condemnation of the Tsukishiro Yuki regime. This paper's war correspondents report that they cannot enter the city of Omsk itself, let alone investigate conditions inside the so-called 'Witch National Rebirth Government'. According to accounts from Russian refugees who narrowly escaped Omsk, the Omsk regime is an anti-human, destruction-seeking regime in which all human dwellings have been converted into large prisons, where the slaughter of humans is carried out day after day. The veracity of this remains to be verified.\n\nOur reporters will continue to bring you coverage of the situation in Omsk."
 WORLD_2WRWTER.114514.a: "??? What the hell is this?"
 MGI_Magical_Factor: "Magical Factor Infection"
 MGI_Magical_Factor_desc: "'Great Witch' Tsukishiro Yuki once scattered many magical factors into the human world while traveling around the globe; now they have penetrated deep into human bone marrow. At a single thought from Tsukishiro Yuki, the fuse will be ignited, humanity will rapidly turn into 'witches' brimming with murderous intent. Then she can use her 'best friend' Sakuraba Ema to activate the witch-hunters, thereby achieving her goal, presenting the human world with the first——and also the last——grand curtain call————\n\n§RGreat Witch Trial§!."
 MGI_Magical_Factor_player_side: "Magical Factor"
 MGI_Magical_Factor_player_side_desc: "'Great Witch' Tsukishiro Yuki once scattered many magical factors into the human world while traveling around the globe; now they have penetrated deep into human bone marrow. At a single thought from Tsukishiro Yuki, the fuse will be ignited, humanity will rapidly turn into 'witches' brimming with murderous intent. Then she can use her 'best friend' Sakuraba Ema to activate the witch-hunters, thereby achieving her goal, presenting the human world with the first——and also the last——grand curtain call————\n\n§RGreat Witch Trial§!."
 MGI_the_end_tt: "And so, she sank into the seabed. §MThank you for completing the STL mod's April Fools' content, and we hope you enjoyed the thrill of battle in it as much as we enjoyed making it.§!"

