 MGI_THENEWORDER_DESC: "In the final years of Black League rule, Omsk had become a war machine that never ceased. Everyone was required to live for the future's revenge; every grain of food, every piece of steel, and even every life was counted into that final battle which would surely come. Yazov and his followers firmly believed that human history had proven mercy worthless, and that Russia's only way out was to answer violence with even more thoroughgoing violence. Yet, before the war had even arrived, people had already begun to be devoured by the war itself. Factories lacked workers, villages lost their youth, cities lost hope. The Black League demanded that people sacrifice the present for the future, but more and more people found that they seemed never able to wait for that future.\n\nIt was against this backdrop that Tsukishiro Yuki and her supporters launched the political movement later known as the 'January Revolution'. Unlike those warlords who raised banners of ideology, she rarely spoke of -isms, and rarely painted grand blueprints. She only repeatedly emphasized one thing: people should be allowed to live.\n\nThe new government swiftly abolished large numbers of emergency decrees, restored local autonomy and the parliamentary system, and reopened schools, hospitals, and factories. For the residents of West Siberia who had long lived under high-handed rule, this was undoubtedly a welcome rain after a long drought. More and more people began to believe that perhaps Russia really could extricate itself from warlord infighting and endless hatred, and find a new path between democracy and order. And surprisingly, all of this operated exceptionally smoothly. Arguments in parliament would always reach consensus at critical moments; local officials rarely defied the will of the center; the opposition still existed, yet could never form real resistance. Those who had initially doubted Tsukishiro Yuki gradually changed their attitude, while those who always refused to change often chose to leave the political stage. Regarding this, Tsukishiro Yuki herself never explained. She simply watched it all calmly, like a patient gardener tending her garden. She delighted in seeing the people laugh, delighted in seeing the factories run, and delighted in seeing cities rebuilt from ruins. Only occasionally would someone notice that in her speeches about freedom, peace, and the future, one strange question never appeared. She never spoke of why humanity was worth saving. Perhaps for most people, this was just an irrelevant detail. After all, life in Omsk was improving, the war was receding, and Russia had finally gained a ruler not eager for bloodshed. But few realized that when a person is willing to devote such enormous energy to observing, understanding, and transforming humanity, it may not be because she loves them.\nSometimes, the best way to judge a thing is not to destroy it.\n\nBut to let it live first."
 #April Fools' bookmark
 BOOKMARK_MGI_INFO: "Witch National Rebirth Government (Omsk Republic)"
 BOOKMARK_MGI_INFO_DELAYED: "§FBelonging to §xThe New Order: The Long March§!'s development team\n§CMagical Girl's Echo of the Eternal Night§! \n- Reset in the v1.2.1 'Blood-Red Setting Sun' version;\n- Unify Russia, fight for 'democracy' and 'freedom';\n- As the Great Witch §ETsukishiro Yuki§!, launch a thorough Judgement upon the New Order before its iron curtain falls;\nEnable it in the custom settings to play!\n\n(What's the Omniscient One doing in TNO? This can't be right. Whoever it is—Speer save me, Takagi's fine too, Naval Bureau save me, kou a...)"
 WORLD_2WRWTER.6.t: "[Get_newspaper_header]Omsk Republic unifies Central Siberia!"
 WORLD_2WRWTER.6.desc: "Fragmentary sounds drift from the wasteland of Central Siberia, softly telling people the news that the Omsk Republic's witch government has unified that region. Having extricated itself from the now-defunct Black League, the Omsk Republic is determined to rebuild Russia to protect its people from German aggression.\n\nTsukishiro Yuki, who single-handedly founded the republic, now leads this young nation, promising to bring back pre-war prosperity for the people, which has won her thunderous applause, and her reforms mean she will devote herself wholeheartedly to the great cause of unifying Russia. As the republic's flags are planted across the towering Ural mountains and its spearheads point toward the Far East, this turbulent land seems to face a bleak future."
 WORLD_2WRWTER.6.a: "This is not good."

