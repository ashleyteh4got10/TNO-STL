 MGI_Nikaido_Hiro: "Nikaido Hiro"
 MGI_Hikami_Meruru: "Hikami Meruru"
 POLITICS_TSUKISHIRO_YUKI_DESC: "She is the only true witch who appears in this game, and the true identity of the 'Great Witch' frequently mentioned throughout the game in various documents, records, and girls' discussions.\n\nHarboring hatred toward humanity, she devised a meticulous plan with the goal of taking revenge on all of humanity.\n\nThe magical abilities of the 13 girls, as well as those of all the candidate witches who were imprisoned and died in the past, and those not yet discovered, all come from Tsukishiro Yuki.\n\nTherefore it can be said that Yuki can wield all magic."
 ultranationalism_yuki_thought_subtype: "Tsukishiro Yuki Thought"
 ultranationalism_yuki_thought_subtype_desc: "                            §YTsukishiro Yuki Thought§!\n\n£GFX_ideology_ultranationalism_black_league_thought_bar\n\n\n\n\nWitches once lived happily on a lonely island, projecting the power of their wisdom across the vast continents of the world; though centuries passed, their society remained harmonious, stable, and joyful.\n\nHowever, these centuries of joy and peace were destined to end——brought to a sudden halt by the arrival of a certain group: humanity. They were bent on casting the witches into the torrent of history, seeking to utterly bury such a wise and peace-loving race. To a great extent, they succeeded. On the Witch Island, all traces of witch life turned to ash, the Great Witches' whereabouts became unknown, and the witch race teetered on the brink of extinction. This was the 'First Judgement'.\n\nYet faced with seemingly insurmountable adversity, one refused to yield. Comrade Tsukishiro Yuki, within the Witch Island, endured endless loneliness day after day. However, this heroic daughter of the witches knew full well that this was not the end. The last witch leapt across the entire globe from the Witch Island, scattering magical factors——the foundation and doctrine of the Witch Trial were forged. For Tsukishiro Yuki herself, one dream always existed: that the beast which had slaughtered the entire witch race beneath its iron heel would surely be annihilated, and that a new era, wholly and purely ruled by witches, would descend as well. The 'Great Witch Trial' would surely come."
 STL_april_fools.1.t: "Stirring in the North"
 STL_april_fools.1.desc: "More than 20 years have passed since the collapse of the Soviet Union, and the Russian land has fallen into endless fragmentation. The Omsk Black League regime is one such warlord state established after the First West Russian War. The 'Great Judgement' ideology upheld by its leader Kalbeshev, aimed at launching a large-scale revenge against Germany, has been treasured as a sacred doctrine by Black League members. However, a puzzling piece of news has arrived from Omsk: the Omsk regime has been seized by a girl calling herself 'Tsukishiro Yuki', and she has begun to eradicate nationalist sentiment within Omsk. We are extremely interested in developments in Omsk. After long discussions within the state, the final decision is:"
 STL_april_fools.1.oa: "Interesting."
 STL_april_fools.1.ob: "Turn a blind eye."
 STL_april_fools_tt: "§RThe momentous Great Witch Trial has begun...§!"
 STL_MGI_main_story.2.t: "The Sinners' Dance"
 STL_MGI_main_story.2.desc: "With the conclusion of the Magical Girl Great Witch Trial, the world drained its last drop of blood. Magical factors spread like an all-pervading plague into every corner of the New Order. The once-invincible Nazi Empire, the free world gasping for breath across the ocean, and the warlords struggling in the wastelands all met an equal destruction in the black witch-fire. Humanity killed one another, wails filled the fields, and at last everything fell silent.\n\nThe Trial was complete. The race known as humanity had been utterly erased from the earth. Except... the small figure behind her.\n\n'Great Witch... where did everyone go?'\n\nHikami Meruru rubbed her drowsy eyes and tugged at Tsukishiro Yuki's sleeve. This human girl, whom she had treated as a test subject yet had unknowingly come to depend on, was now looking at her with clear, innocent eyes. Meruru did not know what had happened outside; she did not know that during these seven days, the human civilization she knew had turned to dust in history.\n\nTsukishiro Yuki's body shuddered violently. She turned and looked at Meruru, that cold face which had once remained utterly unruffled before armies of millions now filled with struggle. In her flawless plan for humanity's extinction, the sole flaw was this girl. She should have become a twisted witch on the very first day, like all other humans. It was Tsukishiro Yuki who had used her own magic to forcibly shield her, letting her live seven more days.\n\nBut now the curtain call was over, and the stage had to be cleared. As long as Meruru lived, this 'complete Judgement' upon humanity would forever bear a stain, and the witches' revenge could never reach its end.\n\n'Meruru,' Tsukishiro Yuki crouched down, stroking the girl's soft long hair, her voice hoarse unlike herself, 'Go to sleep. Go to that room we lived in together, and have a good dream. In the dream there is no war, no hatred, there is your favorite food, and Ema and Hiro... they will all be with you.'\n\n'Will the Great Witch come too? I don't want to lose you again,' Meruru asked innocently.\n\nTsukishiro Yuki did not answer. She only slowly injected the last strand of magic——representing destruction, yet infinitely gentle——into Meruru's body. The girl's eyes gradually grew hazy, then, wearing a sweet smile, fell into a deep sleep in her arms, her body turning into countless glittering motes of magical dust that flew toward the house still preserved intact.\n\nWith her own hands she killed the last human. With her own hands she destroyed the only 'family' she had in this world.\n\nTsukishiro Yuki slowly stood up. The world had never been so quiet, so quiet it drove one mad. Hatred had been avenged, revenge completed, but what followed was a tremendous emptiness that devoured her.\n\nShe needed a place, a place where she could face this endless loneliness alone. So the Great Witch turned around, bracing the piercing cold wind surging from the abyss, and walked step by step, numbly, toward the very peak of the canyon."
 STL_MGI_main_story.2.o: "The Trial ends, and loneliness is born."
 STL_MGI_main_story.3.t: "Piercing Cold Wind"
 STL_MGI_main_story.3.desc: "She stands. She stands alone at the very peak of the canyon.\n\nThe cold wind sweeps up from the abyss, tearing at her hem and tearing at this long-dead world. No response, no echo, as if even the wind merely brushes past her as a matter of routine.\n\nShe has completed her final revenge upon humanity, transforming them into lesser 'witches', letting them twist and go mad and kill one another, then sweeping them all up with witch-hunters——just as, a century ago, humanity had done to her, to them, coldly and precisely erasing a race that called itself 'civilization' from the world. They should have been destroyed long ago. They ought to have been destroyed.\n\nWitches were by nature a race that sought no quarrel with the world; they shut themselves away and lived in peace and contentment on the Witch Island, observing humanity but never interfering.\n\nAnd humanity? Humanity developed rapidly, technology advanced steadily, living standards rose continuously. They conquered the sky, they gazed into the deep sea. Yet they were never satisfied. They fought brutally against their own kind for profit. The cruelty of the Second World War still could not be erased from her memory even now——Germany and Japan enforced thorough, merciless colonial policies on the lands they had conquered, treating colonial peoples like swine. Let alone a different race?\n\nIn the end, they turned their eyes upon the witches. Nearly all witches died in that storm, leaving only her. She was unwilling. She resolved to avenge her fallen kin. To this end she devised a meticulous revenge plan, creating the perfect 'magical factor', and step by step pronounced humanity's death sentence. She has personally ended this Trial. Now no species named humanity remains on earth, including the human test subject who once clung to her——Hikami Meruru.\n\nShe slowly sat down. The rock was cold and hard, a piercing chill seeping through her clothes. In her mind there surfaced once more the question that had plagued her for so long——\n\nWas any of this truly worth it?\n\nIn the early stages of the experiment, she had adopted a human, naming her Hikami Meruru. She was supposed to be nothing but a test subject, a tool for verifying the magical factor. Yet the experiment failed. Meruru did not turn into a witch; she simply stayed, clinging to Tsukishiro Yuki all day, calling 'Great Witch!' again and again. Even though the experiment failed, she had to admit that ever since Meruru appeared, she was finally no longer alone. She began preparing food for her, telling her about the world, and... leaving a lamp on for her. She treated her as a test subject, yet before she knew it, she had come to treat her as family.\n\nShe walked into the house still preserved intact. The house that had belonged to the three of them——her, Meruru, and the owl who always complained how hard working was. She wanted so badly to hear once more 'Great Witch, you're back', to hold Meruru in her arms again, to share those rare moments of peace with them again. All of that was gone forever. Everything she had done was supposed to be for revenge, to make humanity repay all the suffering they had inflicted. She succeeded. She repaid everything a hundredfold. But in the end, was this the outcome? Did this meticulously planned revenge yield only a world with just her——a world so quiet, so empty, so lonely? She began to doubt. To doubt her choice. To doubt her obsession. Even to doubt——the revenge itself.\n\n'......' She remained silent for a long time.\n\n'Ema, Hiro, Meruru,' she said softly, as if calling out, as if saying goodbye.\n\n'Thank you.' She stood up, did not look back, and walked toward the door.\n\nIt was as if she had finally let go of something.\n\nOr as if she had taken everything away with her."
 STL_MGI_main_story.3.o: "She smiled, turned, and flew into the sea."
