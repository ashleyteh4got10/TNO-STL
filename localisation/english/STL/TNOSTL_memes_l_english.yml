 STL_MGI_main_story.1.t: "Aftermath"
 STL_MGI_main_story.1.desc: "The basement of the Black League headquarters reeked of rust and scorching. \nKalbeshev's corpse still lay slumped over that worn map table, eyes wide open, as if he never understood what happened even in death. Yazov lay at the end of the corridor, his chest pierced by something that was not a bullet——Tsukishiro Yuki withdrew the ice pick that had skewered him and let it melt into a pool of clear water. \nShe sat down against the wall, and the smell of blood reminded her of what humanity had done to her family long ago. \nShe could have done all of this far more simply——one great spell to evaporate the entire Black League headquarters along with the surrounding barracks. But that would reveal too much. She needed to do it little by little, with coups, assassinations, and purges the way humans do. As despicable as humans. \nShe looked at her own hands. Clean, pale, without a trace of blood. \nBut they had killed. Not just tonight. ——Those humans who destroyed her entire people in the 'Judgement', those humans who screamed in terror after she became a 'witch' yet never reflected on their own crimes... \nShe closed her eyes and suppressed the surging hatred. \nNow was not the time. She first needed to play the savior, needed to win the trust of these people, needed to unify Russia, needed to... \n'Need to become more like them.' A cold voice whispered in her heart. 'Then, when they believe in you the most, destroy everything.' \nShe opened her eyes, a faint smile tugging at her lips. \nThe basement door was pushed open, and a young soldier poked his head in: 'G...Great Witch, everyone is gathered in the square, waiting for you to speak.' \nTsukishiro Yuki stood up, straightened her dust-stained hem, and replied in a tone so gentle it could almost melt ice and snow: \n'I'll be right there. Tell the people the suffering is over.'"
 STL_MGI_main_story.1.a: "A new era begins."
 MGI_Tsukishiro_Yuki: "Tsukishiro Yuki"
 yuki: "Great Witch"
 yuki_tt: "May the Great Witch Tsukishiro Yuki, our great leader, great mentor, and great helmsman, live forever!"
 yuki_end: "The Time of the End Has Come" #Go grab a hamburger
