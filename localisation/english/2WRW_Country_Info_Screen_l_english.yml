 KMC_CountryInfo_Folder.101: "The Fate of the Pacific Fleet"

 KMC_CountryInfo_Content.1: "The Past"
 KMC_CountryInfo_Content_desc.1: "In the ensuing chaos following the collapse of the §GSoviet Union§! we found ourselves the last remaining Fleet, with §BArkhangelsk, Leningrad and all ports on the Black Sea§! falling to the fascist invader we remained the sole inheritor of the proud Soviet Naval Tradition. Pledging our loyalty to §RYagoda’s§! regime, as the legitimate continuation of the USSR we served for a time from §GVladivostok§! continuing routine maritime patrol missions and guarding the ever decreasing Russian shipping coming in and out of our ports."

 KMC_CountryInfo_Content.2: "The Situation"
 KMC_CountryInfo_Content_desc.2: "With the §RJapanese§! backed invasion of the Far East by their Fascist puppets we faced a stark choice, fight and die or preserve what was left of the fleet. With no prospect of victory in the face of the overwhelming power of the §RJapanese Navy§!, §BAdmiral Ivan Yumashev§! made the decision to evacuate north to the Kamchatka Peninsula. Basing ourselves out of the then mostly abandoned port of §GPetropavlovsk-Kamchatsky§!, the small port down has gradually grown with our presence."

 KMC_CountryInfo_Content.3: "Unfortunate Circumstances"
 KMC_CountryInfo_Content_desc.3: "Without the support of a larger government the prospect of maintaining even our small navy became more difficult. With a small population, no industry to speak of and no outside support we had no other option than to turn to §YPiracy and Smuggling§!.\n\nNow a sad excuse for a navy the warships rarely raid themselves, instead preferring to operate from converted fishing, or cargo vessels to avoid suspicion, with the warships often found sitting in port, rusting and slowly falling apart. As our ships decay so do the spirits of the men. Over time more and more of our veterans perished or left of their own accord, often making off with one of our ships to operate on their own out of another village elsewhere in the peninsula, refusing to hand over their loot to the good of the fleet. What is left is a band of the aging old guard, and young men and boys who have often only joined the fleet to escape crushing poverty, hoping to chance their luck on a raid or aboard a smuggling ship. "

 KMC_CountryInfo_Content.4: "The Future"
 KMC_CountryInfo_Content_desc.4: "There are those in the fleet who hope for change however, §BVeteran Admiral Grigory Shchedrin§! and devout §RCommunist, Captain Ivan Maslennikov§! believe that the fleet must rebuild its §YProfessional Core§! and reignite its spirit as a defender of the Soviet Motherland. Should they wish to achieve their goals, it will be necessary to rely on, or even increase our efforts towards §YPiracy and Smuggling§! if they hope to fund this.\n\n==FEATURES==\n\n*Address the decaying standard of §YProfessionalism§! in the Fleet.\n\n*Conduct §YPiracy and Smuggling§! to keep what is left of the Navy afloat.\n\n*Find a way out of Kamchatka to reassert the Navy as a significant force in Russia again!"
 SAF_CountryInfo_Folder.101: "The Good Old Days"
 SAF_CountryInfo_Folder.102: "Domestic Affairs"
 SAF_CountryInfo_Folder.103: "In-between Two Superpowers"
 SAF_CountryInfo_Content.1: "A Nation of Many Peoples"
 SAF_CountryInfo_Content_desc.1: "§uSouth Africa§! is a confluence of many peoples. Inland, the §JAfrikaners§!, descendants of the original §ODutch§! settlers of the Cape colony, live in deeply conservative communities that segregate against the §KNative majority§! that provide their farms with cheap manual labor. While critical to the economy, no black citizen has the right to vote or even voice their concern regardless of their situation.\n\nIn the Cape province, the §eAnglo Settlers§!, arriving after the §eBritish§! takeover in 1815, have been in governance of the nation ever since. Whereas the §ZColoureds§!, people of mixed race live in the Western Cape as a lower middle class. The leadership in §JCape Town§! sees them as allies against both the §JAfrikaners§! and the §KNatives§! and so seeks to win them over with favorable economic and social benefits not granted to the majority."
 SAF_CountryInfo_Content.2: "Rupture and Rapture"
 SAF_CountryInfo_Content_desc.2: "§uSouth Africa§! answered the call on the Third of September 1939 to join the Second World War, despite the objections of the §JAfrikaners§! who ended up splitting from the §eAnglo-dominated§! §BUnited Party§! to manufacture their own §LNational Party§!. The leadership of the party passed from former Prime Minister James Hertzog to his son §jAlbert Hertzog§! who leads it to this day.\n\nDespite the diligent efforts of the §uSouth African troops§! fighting on the §KAfrican Front§!, the war could not be won, and with the §Vfall of Britain§!, the §uSouth African§! forces were pulled back to defend their homeland. Emerging from the chaos of the war, §uSouth Africa§! found its freedom to be still intact. Yet its connection to the §eBritish Empire§! became tenuous, and caught between rising §qGerman§! and §mAmerican§! influence, §uSouth Africa§! declared its §gcomplete neutrality§! in the Cold War."
 SAF_CountryInfo_Content.3: "Deceptive Affluence"
 SAF_CountryInfo_Content_desc.3: "The years since the war have seen great economic progress for select groups. §eThe Anglo elite§!, §JAfrikaners§!, and even the §ZColoured peoples§! of §uSouth Africa§! have enjoyed the increase in wealth brought by the expansion of trade and the integration of many §eBritish exiles§! who sought to escape the §qGerman§! onslaught.\n\nNew technologies such as Television, Radar, and a plethora of new extraction techniques for its §Gplentiful mineral wealth§! have taken root in §uSouth Africa§!, and its §Geconomic growth§! has held steady ever since the §sSecond World War§!. Mineral resources, wine, and other basic goods flow out to the world's markets while high-end goods are imported to further help modernize the nation.\n\nHowever, wealth and growth §Vdo not fix all problems.§!"
 SAF_CountryInfo_Content.4: "The United Party"
 SAF_CountryInfo_Content_desc.4: "At the top of the nation stands §mDe Villiers Graaff§!, a §JAfrikaner§! who remained true to §Bthe United Party§!. Charismatic, pragmatic, but ultimately indecisive §mGraaff§! has been content to appease all sides, inside and outside of his party.\n\nBut §Bthe United Party§! is a broad tent, and its two outer wings have grown more and more restless. §CThe Progressives§! are led by §PJan Hendrik Hofmeyr§!, an old party administrator from the §PSmuts§! era. While somewhat sympathetic to §Kthe ANC§!, §Cthe progressives§! are looking for continuous moderate reforms focussing on slowly improving the lives of §uSouth Africa's§! downtrodden, irregardless of their race.\n\nOn the other hand, there are §Qthe conservatives§! under §aVause Raw§!. The §QUP's conservatives§! are on board with §Bthe United Party§! solely to keep §Jthe Afrikaners§! out of power and §Kthe Natives§! in the fields, and possibly even §eregressing the current status quo if given the chance.§!"
 SAF_CountryInfo_Content.5: "The Native Peoples"
 SAF_CountryInfo_Content_desc.5: "§uSouth Africa§! has been §yprospering§!, but the benefits of that fact are §edenied§! to the majority of its citizens, §Kthe Native people§! who make up a supermajority of the nation. Denied §Za vote, a voice, land and prosperity§! §Kthe Native population§! is used exclusively as §Acheap labour§! for the more §Wprivileged§! §.peoples§! to take advantage of.\n\nBut the Status Quo §bcannot last forever§!, and more and more the §KAfrican inhabitants§! of §uSouth Africa§! are getting organised under the banner of §Kthe African National Congress§!, led by §nOliver Tambo§!. Despite several attempts by §uthe South African government§! to deal with §Kthe ANC§! through banning it and §Xarresting its key members§!, the organisation continues to grow in the shadows. Vowing to achieve §zcomplete equality§! between the different peoples of §uSouth Africa§!, §Kthe ANC§! has pursued both §Gpeaceful§! and §Zviolent§! means to achieve its ultimate goal, §fgrowing more influential by the day.§!"
 SAF_CountryInfo_Content.6: "The Afrikaners"
 SAF_CountryInfo_Content_desc.6: "A strong electoral alliance of §eAnglos§!, §,Cape Coloured§! and §jIndian§! voters has kept §Othe Afrikaners§! out of power for good as §sthe National Party§! under §bAlbert Hertzog§! has been the permanent opposition to §Bthe United Party's§! continuous governance since 1934. While the party has gotten more radical overall due to its inability to ever achieve power, most §OAfrikaners§! are §nsatisfied with the Status Quo§!, with the §BUnited Party§! seeking to partially serve the needs of §Othe Afrikaners§! overall.\n\nBut the most radical group of §OAfrikaners§! has been continuing to struggle against the §uUnion of South Africa§!. The §rOssewabrandwag§! is a §qNational Socialist§! organisation dedicated to establishing a dictatorial one party §OAfrikaner§! state in §uSouth Africa§!. With his organisation §jbanned§! and §zin exile§! in §qOstafrika§!, §uJohannes van Rensburg§! is gathering power to finally see through the §Gfinal liberation of the Afrikaner people§!, §eby enslaving all other races to serve the Afrikaners§! as the one true master race of Africa."
 SAF_CountryInfo_Content.7: "Between Washington..."
 SAF_CountryInfo_Content_desc.7: "With the total collapse of §ZGreat Britain§! and §zthe Allied powers§!, the centre of power of the free nations on the earth shifted from §ZLondon§! to §zWashington§!. As the allied democracies gathered their strength and formed §mthe Organization of Free Nations§!, §uSouth Africa§! kept its distance despite an official invitation to join.\n\nWhile the ties to the §mOFN§! are strong and informal, §uSouth Africa§! has remained ignorant of the wider §Ucold war§!, satisfied to §ntrade with every single block§! and focus inward. But under the table, §uthe South African§! §<intelligence service BOSS§! under §<Sir John Sinclair§! is one of America's §nclosest intelligence partners§!, and while §Jthe Anglo establishment§! strongly favours §zAmerica§! and its §RCommonwealth allies§! it stays quiet due to fear of…"
 SAF_CountryInfo_Content.8: "and Germania"
 SAF_CountryInfo_Content_desc.8: "Half of §rAfrica§! now falls under §bdirect German control§!, and §uSouth Africa§! borders two of the §sReichskommissariats§! that serve to §nextract wealth§! for the masters of §jthe New Order§! in Europe. Owing to the many §eBritish refugees§! that landed on §uSouth African shores§! and the continuing §uAnglo dominance§!, relationships between the three neighbours have always been §hstrained, but pragmatic.§!\n\nAll of that changed with the §xFrancistown Incident§!. In 1956 increased tension led to §border clashes§! between §qOstafrika§! and §uSouth Africa§!, leading §uSouth Africa§! to begin paying some more attention to the §Kstate of its military§!. Still, the new prime minister §MDe Villiers Graaff§! was able to smooth over the issues and resume the very §yprofitable trade relationships§! with §sGermany and its colonies§!. Ever since, §uSouth Africa§! has been…"
 SAF_CountryInfo_Content.9: "A Leaf in the Wind"
 SAF_CountryInfo_Content_desc.9: "§MDe Villiers Graaff§! and his foreign minister §aMarais Steyn§! are the guardians of §uSouth African§! neutrality, ever focused on what can happen when the §sGermans§! reach for a §eviolent solution§! to their problems. Overtures from §zboth§! §qsides§! are denied, yet in a §npleasant, diplomatic tone§! as the nation holds the §dtalisman of neutrality§! close, hoping that the §Jconflicts§! and §bideo§!§zlogi§!§Xcal§! clashes §rraging across the world§! will quietly pass it by.\n\nBut §MGraaff's§! unwillingness to change or adapt, only ever to §Gappease§! all sides can only last so long as both §Ointe§!§Krnal§! and §sext§!§zernal§! forces begin to §erip the nation apart§!. As §Wdestiny§! marches on §uthe Cape§!, the flawed democracy stands either §nto rise to the challenge like a phoenix reborn§!, or to §efall to pieces to its own contradictions.§!"

