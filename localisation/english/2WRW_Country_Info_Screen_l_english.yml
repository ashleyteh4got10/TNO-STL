 NOV_CountryInfo_Folder.103: "SWRW Info"
 NOV_CountryInfo_Content.5: "Shukshin Features"
 NOV_CountryInfo_Content_desc.5: " - Play as Shukshin and his successor, stabilise, reunify and lay low the German eagle and the Japanese Sun.\n\n-Reconstruct and de-nazify eastern Europe for a better tomorrow.\n\n- Vote in the 1976 election that will decide the fate of Russia and the world for decades to come."
 NOV_CountryInfo_Content.6: "Russia Features"
 NOV_CountryInfo_Content_desc.6: "The Second West Russian War mod introduces several new mechanics related to governing and guiding a reunified Russia through the most intense era of the modern world — the Cold War between the §MUnited States§!, the §qGerman Reich§! and the §eEmpire of Japan§!, reclaiming her lost territories with force when all other options fail.\n\nThis mod features both reworked wars and mechanics. As of now, only Shukshin in Novosibirsk has any unique content after 1972. All other unifiers have a generic SWRW tree, with nation-specific content in development for several nations."
 NOV_CountryInfo_Content.7: "SWRW Updates"
 NOV_CountryInfo_Content_desc.7: "§MUpdate 0.9.0§! - §MFoundations§!\n§MUpdate 1.0.0§! - §MDreams of Federation§!\n§MUpdate 1.1.0§! - §BUlysses of Serica§!\n§MUpdate 1.2.0§! - §BCodetalker§!\n§MUpdate 1.2.1§! - §OSolaris§!\n§MUpdate 1.3.0§! - §OSolaris: Heartless Sea§!\n§MUpdate 1.3.1§! - §yGlobal Conflicts: World in Flames§!\n§MUpdate 1.3.2§! - §VThe§! §WBicentennial§! §zBallot§!"