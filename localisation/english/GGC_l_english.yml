 GGC_we_have_been_a_fucking_colony_for_52_years: "52 Years Since Annexation"
 GGC_we_have_been_a_fucking_colony_for_52_years_desc: "Since Taishō 9 (1920), when Crown Prince Yi Eun of the Korean Empire married Princess Nashimoto Masako of the Japanese imperial family, the concept of \"Naeseon Ittai\" (Japan-Korea Unity) had been a recurring theme in the offices of successive Governors-General of Korea. Under the guidance of this integration policy, Japan steadily expanded industrial investments in Korea, reinforced its role as a \"continental military logistics base\", and vigorously promoted the Kōminka (Imperialization) movement, seeking to eradicate Korea’s indigenous culture and language in pursuit of full integration with the Japanese Home Islands.\n\nBy Shōwa 37 (1962), this prolonged process of colonial annexation had spanned fifty-two years. Today, Korea stands as a crucial industrial hub of the Greater East Asia Co-Prosperity Sphere, a model of Pan-Asian solidarity, coexistence, and shared prosperity within the Sphere—\n\n—Everyone takes pride in Korea, but the problem is,§Rit is still not \"Japanese\" enough. Whether in the Home Islands, in Korea, or elsewhere in the world, it is still not seen as Japan.§!"
 GGC_we_have_been_a_fucking_colony_for_52_years_tt: "Korea’s future must be affirmed in §Ysome form§!; otherwise, £GNG_japanese_frustration_texticon §jThe Empire of Japan§! will see all its efforts toward the integration of Korea §Rgo to waste§!."
 GGC_Japanese_skilled_migrants: "Immigrant Japanese Technicians"
 GGC_Japanese_skilled_migrants_desc: "Long-term colonization has brought a large influx of Japanese skilled workers proficient in modern industrial technology to the Korean Peninsula, leading to an undeniably painful \"leap\" in industrial development.\n\nToday, Japanese immigrants have come to dominate nearly every aspect of Korea’s industrial sector. While their expertise has undeniably contributed to significant economic growth, their ever-expanding political influence is gradually eroding the living space of the indigenous Korean population."
 GGC_strict_control: "A Controlled Society"
 GGC_strict_control_desc: "Decades of colonial rule have failed to quell the Koreans' defiant ambitions for independence. In addition to enforcing an even stricter Kōminka (Imperialization) policy to discipline Koreans into submission under Imperial rule, greater investments must be made in military, police, gendarmerie, and special security forces.\n\n§xCommunist agitators§! and §mliberal dissidents§! who seek to undermine Pan-Asian Co-Prosperity across the Korean Peninsula must be rooted out with utmost vigilance. If not, the Governor-General's vision of Korea as a model for Pan-Asian unity will be nothing more than a farcical illusion."
 GGC_Border_inspection: "Strict Border Inspections"
 GGC_Border_inspection_desc: "Although Korea’s neighboring countries, both on land and sea, are Pan-Asian Co-Prosperity allies, illegal immigration and smuggling remain two persistent foreign affairs challenges for the peninsula. Most illegal immigrants sneaking in from Manchuria and China are disillusioned drifters, among whom §xRed guerrilla elements§!—who have poisoned Northeast Asia for decades—may also be hiding. Meanwhile, rampant opium smuggling along the Korea-Manchuria border continues to undermine the financial stability of the Governor-General's Office—and perhaps even the health of Imperial subjects themselves.\n\nStrict border inspections will help us combat illegal immigration and contraband smuggling. More importantly, they will prevent Northeast Asian guerrilla forces from infiltrating and sabotaging Korea."
