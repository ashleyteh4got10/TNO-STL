 GGC_news.1.t: "[Get_newspaper_header] 10th anniversary of KISA"
 GGC_news.1.desc: "Recently, the Korean labor union organization, the \"Korean Industrial Service Associatio,\" held its 10th-anniversary commemorative conference in Keijō (Seoul). This event is widely regarded as a pivotal moment in determining the future direction of Korean industry, drawing significant attention from across the Co-Prosperity Sphere.\n\nDuring the conference, the general policy of the Korean Industrial Service Associatio (Sanpō) was reviewed. It was concluded that, over the past decade, the \"guidance\" and coordination policies led by the Korean Branch of the Greater Japan Industrial Patriotism Association had failed to achieve substantial results in Korea. The living conditions and working slavery of Korean laborers had seen no meaningful improvement, and the Federation should assume its responsibility as \"Korea’s own labor union organization\", taking more proactive measures to protect the rights of native Korean workers.\n\nReports indicate that the conference passed a resolution to establish new Korean Industrial Service Associatio branches in steelworks across the peninsula, aiming to expand Korean laborers' autonomy."
 GGC_news.1.a: "A colonial labor struggle? I don't think that's going to happen."
 GGC_news.2.t: "[Get_newspaper_header] 10th anniversary of KISA"
 GGC_news.2.desc: "Recently, the Korean labor union organization, the \"Industrial Patriotic Federation,\" held its 10th-anniversary commemorative conference in Keijō (Seoul). This event is widely regarded as a critical moment in shaping the future of Korean industry, drawing significant attention from across the Co-Prosperity Sphere.\n\nThe conference highly praised the federation's general policy, asserting that under the guidance of the Korean Branch of the Greater Japan Industrial Patriotism Association, the coordination policy had achieved remarkable success in Korea over the past decade. The slogan \"A Righteous Korea\" was prominently voiced, emphasizing that both the Industrial Patriotic Federation and Korea itself must shoulder an undeniable and vital responsibility in advancing the cause of Pan-Asian Co-Prosperity.\n\nObservers widely believe that this conference signals the inevitable full-scale corporatization of Korea’s native labor organizations, with their eventual absorption into the Greater Japan Industrial Patriotism Association as the most likely outcome."
 GGC_news.2.a: "Another pupet of KBGJIPA."
 GGC_news.3.t: "[Get_newspaper_header]Pyongyang assassination incident!"
 GGC_news.3.desc: "The already turbulent Co-Prosperity Sphere has been struck by yet another crisis: Hokomi Jun, the 12th Governor-General of Korea, was assassinated today in Pyongyang by Korean guerrilla fighters while attending the 53rd anniversary celebration of the Governor-General’s Office, dying instantly in the streets.\n\nThis incident is widely regarded as a critical turning point in escalating tensions between the Japanese and Korean populations. As of now, Tokyo has yet to issue an official response to Hokomi Jun’s assassination. Meanwhile, the Korean Governor-General’s Office has canceled all subsequent celebratory events, with Chief Director of Political Affairs Gotōda Masaharu temporarily assuming gubernatorial duties.\n\nIt is widely expected that Gotōda Masaharu will soon receive an official appointment from Tokyo, making him the 13th Governor-General of Korea."
 GGC_news.3.a: "Can't they at least appoint a Korean to the position?"
 GGC_news.4.t: "[Get_newspaper_header]KISA Divided!"
 GGC_news.4.desc: "Amid the ongoing turmoil in Korea, reports have emerged that the KISA has canceled its 6th Representative Conference in response to the recent assassination of Hokomi Jun. As a result, plans to establish Federation branches in Nippon Steel's ironworks have been abandoned.\n\nAt the same time, left-wing members within the KISA have announced their secession, forming a new labor organization known as the \"Korean Labor Union Joint Council.\" Observers widely believe that this marks the de facto collapse of the Industrial Patriotic Federation, once again bringing the plight of Korean workers into the spotlight.\n\nReports indicate that on the very day of its founding, the Joint Council declared plans to organize a mass strike across the Yellow Sea and Hamgyong regions, vowing to \"struggle for the legitimate survival rights of the Korean people.\""
 GGC_news.4.a: "We will continue to follow up on the progress."
 GGC_news.5.t: "[Get_newspaper_header]The KISA has been terminated and integrated into the KBGJIPA process."
 GGC_news.5.desc: "Chaos grips Korea as new reports emerge: the Korean Industrial Service Association has canceled its Sixth Representative Assembly following the assassination of Governor-General Atsushi Hōkō and has abandoned plans to merge with the Korean branch of the Greater Japan Industrial Patriotic Association.\n\nIt is widely believed that Hōkō’s assassination has forced the Korean Industrial Service Association to reevaluate the survival conditions of the native Korean people. The slogan \"Righteous Korea\" has effectively collapsed, and the organization is now seeking legal avenues to secure the rights of the local Korean population.\n\nReports indicate that over 20,000 members have already signed the newly drafted \"Petition for the Expansion of Parliamentary Representation.\"\n\nThe petition aims to formally request the Japanese National Diet to grant greater political representation to ethnic Koreans within the imperial system."
 GGC_news.5.a: "We will continue to follow up on the progress."
 GGC_news.6.t: "[Get_newspaper_header]Total Massacre in Hwanghae Province by the Governor-General's Office!"
 GGC_news.6.desc: "The Hwanghae General Strike, organized by the Korean Labor Union Joint Council, has ended in a horrific tragedy.\n\nWith the approval of the Imperial Army High Command, the Korean Governor-General’s Office deployed mechanized units from the Japanese 17th Area Army into Hwanghae Province and ordered the troops to open fire freely on striking workers.\n\nNo verified reports have emerged from Hwanghae, and the true scale of casualties remains unknown.\n\nHowever, a chilling photograph leaked from the scene shows bodies strewn across the ground, with heavily armed military and police units actively suppressing the strike.\n\nReports suggest that even heavy weaponry was deployed, underscoring the Governor-General’s unyielding commitment to crushing movement with absolute force."
 GGC_news.6.a: "Evil Knows No Bounds!"
 GGC_news.7.t: "[Get_newspaper_header]Uprising in Jeolla and Hamgyong Provinces!"
 GGC_news.7.desc: "Total Blackout in Jeolla and Hamgyong—Korean Partisans Seize Control!For the past three days, all communication with Jeolla and Hamgyong Provinces has been lost.Scattered reports confirm that Korean guerrillas from the Northeast Anti-Japanese United Army launched a surprise offensive days ago, successfully seizing control of both regions.The Governor-General’s Office has effectively lost its grip on the rebellious provinces, and the situation appears to be escalating further.Eyewitnesses claim to have spotted former radical elements of the Korean Industrial Service Association in the affected regions, though the identities of the guerrilla leaders remain unclear.\n\nAnalysts suggest that this uprising, much like the assassination of Atsushi Hōkō, was deliberately orchestrated by the Northeast Anti-Japanese partisans.Through these two high-profile strikes, their intentions are now undeniable—to expel the Japanese colonial government and secure complete independence for the Korean nation."
 GGC_news.7.a: "The Colonial Empire is Crumbling!"
 GGC_news.8.t: "[Get_newspaper_header]Jeolla and Hamgyong Uprising Suppressed!"
 GGC_news.8.desc: "Governor-General Secures Kwangtung Army Support—Rebellion Crushed! As Korea descended further into chaos, Governor-General [GGC.GetLeader] personally traveled to Hsinking a month ago to meet with the high command of the Kwangtung Army regarding the suppression of the uprising.While the details of the meeting remain unknown, its outcome is now clear—the Kwangtung Army has deployed forces under the command of Major General Amano Yoshihide to Jeolla and Hamgyong Provinces. Working alongside the Imperial Japanese Army’s 17th Area Army, they swiftly crushed the communist insurgency.\n\nAt last, the mystery surrounding the rebel leadership has been unraveled—the guerrilla commander was none other than Kim Il-sung.Born into a farming family in South Pyongan Province, Kim fled to China in 1925, later joining the Chinese Communist Party in 1931. He rose through the ranks of the CCP-affiliated Northeast Anti-Japanese United Army, playing a key role in its operations.\n\nAlthough the Governor-General’s Office has publicly declared that the suppression of the rebellion dealt a decisive blow to communist forces and yielded valuable intelligence, the reality appears far less clear.Despite twenty days of intense interrogation, Japanese authorities failed to extract any meaningful intelligence regarding the broader structure of the Northeast Anti-Japanese United Army.It is widely believed that Kim Il-sung and the majority of captured guerrillas were summarily executed in Pyongyang."
 GGC_news.8.a: "Brave warriors."
 GGC_news.9.t: "[Get_newspaper_header]The 14th Governor-General of Korea Takes Office!"
 GGC_news.9.desc: "From the assassination of Atsushi Hōkō, to the Hwanghae General Strike, and finally the Jeolla-Hamgyong Uprising, Korea’s years of continuous unrest seem to have finally worn down Tokyo’s patience.After the Kwangtung Army’s intervention in Korea and the defeat of the Northeast Anti-Japanese Korean Guerrillas, Tokyo has issued a decisive order—appointing Kwangtung Army commander Amano Yoshihide as the 14th Governor-General of Korea.The military rewards have been equally generous—Amano Yoshihide has been promoted two ranks to General, while simultaneously assuming command of the Imperial Japanese Army’s 17th Area Army.\n\nMilitary rule in Korea is not unprecedented, but this shift has still sent shockwaves throughout the colonial administration. With the communist regime in western China growing more threatening, Japan’s decision to place a hardline, active-duty officer at the head of its colonial government suggests a return to the era of total mobilization—and a potential escalation toward full-scale war preparations."
 GGC_news.9.a: "The Great Powers Reveal Their True Colors!"
 GGC_news.10.t: "[Get_newspaper_header]Reorganization of KISA"
 GGC_news.10.desc: "In response to the Hwanghae General Strike threatened by the KLUJC, the Korean Governor-General’s Office adopted a strategy of co-optation and suppression. On one hand, authorities used coercion and incentives to divide the organization, isolating moderate elements within theKLUJC. On the other, a deliberate smear campaign was launched to discredit the organization’s leadership.The strategy proved highly effective—the fractured KWCC lost its ability to mobilize industrial workers, resulting in only scattered and small-scale protests across a few factories. The remaining radical elements were swiftly neutralized, leading to the practical dissolution of the KLUJC.\n\nBy avoiding a large-scale bloodshed, the Governor-General’s Office has won the approval of Tokyo. With the success of this approach, the Japanese cabinet has endorsed the \"Korean Rule for Koreans\" initiative, paving the way for a Korean-born politician to be appointed as the 14th Governor-General of Korea. Meanwhile, the Industrial Service Association of Korea has successfully completed its reorganization with government support, ensuring continued stability under colonial administration."
 GGC_news.10.a: "Nice work."
 GGC_news.11.t: "[Get_newspaper_header]\"Foreign Nationals Representation Act\" Passed!"
 GGC_news.11.desc: "The \"Foreign Nationals Representation Act\", recently proposed and petitioned by the Korean Industrial Service Association (KISA), has received an overwhelmingly positive response from Tokyo. With strong support in the Japanese Diet, the act expands the legal definition of \"foreign nationals\" and formally grants Koreans, Taiwanese, and other colonial subjects political rights nearly equal to those of Japanese citizens. Under this new law, Japan will retain the authority to appoint the Governor-General of Korea, but with a key change—from now on, only Korean-born politicians can be appointed to the position.\n\nThis landmark decision has sparked celebrations across Keijo and Pyongyang, where ordinary citizens have taken to the streets in joyful demonstrations, welcoming their newfound role in national politics. For the Korean Industrial Service Association, this marks a triumphant step forward, as Korea’s long-sidelined political class finally secures a voice in shaping the empire’s future."
 GGC_news.11.a: "Yet Still at Japan’s Mercy?"
 GGC_news.12.t: "[Get_newspaper_header]The 14th Governor-General of Korea Takes Office!"
 GGC_news.12.desc: "In accordance with the \"Korean Rule for Koreans\" policy, Tokyo has officially appointed pro-Japanese Korean legislator Kim Jong-pil as the 14th Governor-General of Korea. At his inaugural ceremony, Kim delivered a speech reaffirming his commitment to reviving the \"Moral Korea\" political ideal, which had faded over the past five years. He declared that Korea must truly become the bearer of Greater East Asia’s grand mission, fully embracing the Pan-Asian Co-Prosperity ideal.\n\nBeyond politics, Kim also outlined ambitious economic plans, including: Revitalizing the steel industry in the north, ensuring Korea’s role as an industrial backbone of the empire. Expanding capacity on the Tsushima Strait Tunnel, strengthening economic integration with Japan. Observers believe that Kim's appointment signifies a new political equilibrium between Koreans and the Japanese government.\n\nWith East Asia’s political landscape stabilizing, Japan appears willing to elevate the political status of Koreans in exchange for their unwavering loyalty against communism. However, whether this approach will succeed in securing long-term stability remains uncertain—only time will tell if this new arrangement is truly sustainable."
 GGC_news.12.a: "Perhaps Korea’s Fate Is Already Sealed."
 GGC_news.13.t: "[Get_newspaper_header]\"Foreign Nationals Representation Act\" Haven't Passed!"
 GGC_news.13.desc: "The \"Foreign Nationals Representation Act\", which aimed to expand political rights for colonial subjects, has been formally rejected by the Japanese Diet, dashing hopes for greater political inclusion in Korea and other overseas territories. The petition, spearheaded by the Korean Industrial Service Association (KISA), failed to sway Tokyo, as Japan remains firm in its stance on fully integrating Korea as a colonial possession, prioritizing imperial interests over political concessions.\n\nThe news was met with widespread disappointment and outrage across the Korean Peninsula, with many denouncing the decision as proof that Japan has no intention of allowing true political autonomy for Koreans. Some observers warn that this refusal to grant even symbolic representation could exacerbate internal divisions within Korean society, particularly among industrial workers, who may now gravitate toward communist influences as disillusionment with Japan's rule deepens.\n\nEven as East Asia’s political landscape stabilizes, Tokyo’s iron grip on Korea remains unshaken—and with it, the risk of growing dissent in the empire’s most crucial colony."
 GGC_news.13.a: "\"Naisen Ittai\"—Unshakable and Absolute."
 GGC_news.14.t: "[Get_newspaper_header]Korea Passes the \"Chusuin Authority Reform Act\""
 GGC_news.14.desc: "After Tokyo's cold reception to the \"Korean Rule for Koreans\" policy, the Governor-General’s Office of Korea has recently enacted the \"Chusuin Authority Reform Act\", amending the 1910 Ordinance on the Central Council of the Governor-General of Korea and the 1918 Regulations on the Division of Affairs within the Central Council.\n\nThis revised law includes the following key changes:\n\nEthnic Korean nationals are now legally eligible to be elected as the President of the Chūsuin, a position that effectively serves as the Administrative Director of the Governor-General’s Office.\nThe Chusuin's powers have been expanded, transforming it from a purely advisory body into a preliminary administrative oversight institution that assists in managing daily governance on the peninsula.\nThe passage of this law is widely seen as the Governor-General’s fallback plan after the failure of the \"Korean Rule for Koreans\" initiative.\n\nEarly reports suggest that the Industrial Service Association, the Friends of the Imperial Authority, and the Patriotic Korean Union all intend to nominate candidates to compete for the newly empowered Administrative Director position.\n\nWhile supporters hail this as a step toward political participation, critics argue that the core of colonial rule remains untouched, and this reform only strengthens Japan’s indirect control rather than offering real self-governance.\n\nUltimately, whether this measure will ease tensions or fuel further demands for autonomy remains to be seen."
 GGC_news.14.a: "They found a new balance."
