 UZB_Alexander_Rutskoj:0 "Aleksandr Rutskoy"
 UZB_Alexander_Rutskoj_desc:0 "The life of Alexander Rutskoy began very tragically. His family's hopes crumbled to dust with the defeat of the Soviet Union, and his father miraculously survived the meat grinder of the Russian interregnum. Rutskoy had to learn to use an automatic rifle early, so his abilities were quickly recognized by the field commander he served. 'Sanya the Mad', captain of a mercenary detachment, fought not for an idea, but for whoever paid more. However, this changed when his guys met the professional troops of Belozerov in the final war for the unification of all Russia. After several tribunals and a sincere confession, he entered the service of the tsarist army, where he proved equally in demand.\n\nNow, with the personal permission of the tsar, the soldier of a thousand wars has found his peace as the organizer of Russian order in the Turkestan steppes."

