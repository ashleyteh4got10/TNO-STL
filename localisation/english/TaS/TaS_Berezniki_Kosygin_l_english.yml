 MAR_prestol_dynmod_dummy: "Taboritsky’s Machinations"
 MAR_prestol_dynmod_dummy_desc: "§FResource extraction efficiency: [?MAR_prestol_dynomod_array^2|2R%+=]\nSupply consumption: [?MAR_prestol_dynomod_array^1|2R%-=]\nStability: [?MAR_prestol_dynomod_array^3|2R%+=]\nGarrison damage: [?MAR_prestol_dynomod_array^0|2R%-=]\nGDP growth: [?MAR_prestol_dynomod_array^4|2R+=]§R%§!\nOther military expenses: §R$[?MAR_prestol_dynomod_array^5|3R-]B§!\n--------------\n§!Now we know that our country harbors an extremely dangerous terrorist group that seeks to destroy our state from within. Taboritsky and his people inflicted severe damage on the Mladorossi after their stunt in Vyatka, and now we are facing clear difficulties in governing the state. Moreover, the activities of 'Prestol' are all-encompassing: from propaganda to open terrorist attacks, the population is beginning to lose trust in us, and as a result, we are losing the legitimacy of our authority.\n\nWe must urgently do something about them before they destroy us completely, and in this fight, there can be no compromise: either a new Time of Troubles will descend upon Russia, or we will defeat the 'Prestolniki.'"

