  MAR_greater_good_category:0 "The Greater Good"
 MAR_greater_good_category_desc:0 "\n\n\n\n\n\nAlexei Kosygin-Romanov wishes for us to make maximum efforts in implementing his plan. The 'Greater Good' program system aims to improve the welfare of specific population groups and encourage actions by individuals to advance societal development. Naturally, we cannot immediately allocate all resources to the entire population, so it depends on you to decide where the primary efforts to ensure public welfare will be directed.\n\nThe program is designed for the long term, and during this period, we are fully capable of raising the overall standard of living in the country, as well as improving other national indicators. Of course, this will require significant financial investment, but it will pay off in the future, making it an investment in the future."

 MAR_greater_good_help_the_poor:0 "Poverty Reduction Program"
 MAR_greater_good_help_the_poor_desc:0 "The poor are one of the most vulnerable segments of the population. Often, they cannot even properly feed themselves, let alone maintain good health or afford new housing. Working for meager wages in factories, they wear themselves out even faster. To help them, we can introduce social benefits to increase their income, allowing them at least to eat well."

 MAR_greater_good_create_universal_healthcare:0 "Expansion of the Healthcare System"
 MAR_greater_good_create_universal_healthcare_desc:0 "The health of our citizens is one of the pillars of our country’s development. Without proper and timely medical care, people become sick and frail. Sick and frail people cannot fight, work, or innovate. Therefore, we must establish a comprehensive healthcare system across the country to ensure that every person, whether in a village or a city, receives timely medical attention."

 MAR_greater_good_invest_in_scientific_research:0 "Investment in Science"
 MAR_greater_good_invest_in_scientific_research_desc:0 "Scientific and technological advancements are crucial not only for developing the economy, military, and electronics but also for improving the daily life of ordinary people. We must encourage scientific progress in the development of consumer goods that will enhance people’s lives. Upgrading and modernizing everyday household items like refrigerators or stoves will be a significant innovation for every citizen of our country."

 MAR_greater_good_allocate_education_funding:0 "Subsidies for Schoolchildren"
 MAR_greater_good_allocate_education_funding_desc:0 "Parents strive to provide their children with the best education, sometimes sacrificing their own health to ensure their child lacks nothing. For such children and families facing serious financial difficulties in education, we must do everything possible to alleviate their struggles. We should provide these children with quality, warm school lunches and offer families social payments to cover school-related expenses such as pens, notebooks, uniforms, and more."

 MAR_greater_good_please_veterans:0 "Honor the Veterans"
 MAR_greater_good_please_veterans_desc:0 "Veterans of the Great Patriotic War, the Western Russian War, and the Battle for Western Russia deserve special reverence in our country. Despite their recognition, they often live as difficult lives as the poor. Those who returned from war gave their all for victory. Those who fought for the future of our children and our country must be fully rewarded."

