 # OGAS
 MAR_ogas_dev_started:0 "OGAS Development Underway"
 MAR_ogas_deccat:0 "OGAS"
 MAR_ogas_deccat_desc:0 "The Nationwide Automated System for Accounting and Information Processing is the most ambitious project of Tsar Kosygin and Viktor Mikhailovich Glushkov. If we manage to complete it, it will give us a tremendous advantage. However, we must always assess our capabilities realistically.\n\n[GetStageDescOGAS]"
 MAR_ogas_stage_one:0 "Current Stage: §YDesign§!\n\nThe project is currently in its embryonic stage, and many ideas are yet to be born. Their implementation is still far off."
 MAR_ogas_stage_two:0 "Current Stage: §YPreparation§!\n\nStarting correctly is half the battle, which is why even the initial steps must be approached with great care. At this stage, we must select the most capable individuals and provide them with the opportunity to work on the project."
 MAR_ogas_stage_three:0 "Current Stage: §YDevelopment§!\n\nActive work has begun. It’s time to create the basic functionality and configure the systems."
 MAR_ogas_stage_four:0 "Current Stage: §YTesting§!\n\nWe’ve crossed the Rubicon, and now it’s time to test the developed systems. At this stage, we must verify OGAS in action and make corrections to any malfunctioning elements."
 MAR_ogas_stage_five:0 "Current Stage: §YImplementation§!\n\nWork on OGAS is complete, and it’s time to integrate it into the life of the People's Empire. Soon, our citizens will enjoy the fruits of automation."

