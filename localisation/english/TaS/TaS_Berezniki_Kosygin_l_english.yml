 UAR_Faction_MAR_Pro_RUS_Propaganda:0 "Pro-Russia Propaganda"
 UAR_Faction_MAR_Pro_RUS_Propaganda_desc:0 "To convince the United Arab Republic to join us, we will launch a propaganda campaign promoting cooperation between our two countries and highlighting the benefits awaiting us from this future alliance."
 UAR_Faction_MAR_Anti_Pakt_Propaganda:0 "Anti-Pact Propaganda"
 UAR_Faction_MAR_Anti_Pakt_Propaganda_desc:0 "We cannot allow our Arab friends to return to a pseudo-alliance of oppressors, so we will launch anti-Pact propaganda, detailing their inability to solve problems and reminding the Arabs of the cost of cooperating with their enemy."
 UAR_Faction_MAR_Invest_in_Arab_Industries:0 "Invest in Industry"
 UAR_Faction_MAR_Invest_in_Arab_Industries_desc:0 "To help the Arabs decide in our favor, we will invest in the UAR’s industrial economy to promote its growth. We hope they will recognize our commitment to helping them and join our alliance."
 UAR_Faction_MAR_send_advisors_to_arabs:0 "Send Military Advisors to the UAR"
 UAR_Faction_MAR_send_advisors_to_arabs_desc:0 "By sending military advisors to the United Arab Republic, we will provide them with better training and doctrines for their army, enabling them to defend their country. Additionally, this will strengthen our influence in Arab politics and may sway them to join our alliance."
 UAR_Faction_MAR_Remember_who_helps_them:0 "'The Germans Will Always Stab You in the Back'"
 UAR_Faction_MAR_Remember_who_helps_them_desc:0 "There’s no reason for the Arabs to ally with a fascist, reactionary country that only seeks their subjugation. We cannot allow this to happen. It’s time to remind the Arabs what their friendship with fascists truly means. Our propaganda will trumpet the words 'The Germans will always stab you in the back.'"
 UAR_Faction_MAR_trans_kaspi_exercise:0 "Naval Exercises in the Caspian Sea"
 UAR_Faction_MAR_trans_kaspi_exercise_desc:0 "We will conduct naval exercises in the Caspian Sea, and this will not go unnoticed by the Arab state, which needs a strong army to defend the peninsula. Moreover, this will make the Arabs think twice about the Germans’ proposal."
 MAR_Faction_Join_Rus_Mission:0 "§G[UAR.GetFlag]United Arab Republic joins our sphere§!"
 MAR_Faction_Join_Rus_Mission_desc:0 "Our diplomats have informed us that if the diplomatic situation continues as is, the United Arab Republic will join us, strengthening our position in the Cold War."
 MAR_Faction_Join_Pakt_Mission:0 "§R[UAR.GetFlag]United Arab Republic joins the [GER.GetFlag]German sphere§!"
 MAR_Faction_Join_Pakt_Mission_desc:0 "Our diplomats have expressed concern that if the diplomatic situation continues as is, the United Arab Republic will join [GER.GetFlag] §sGermany§! in the §sUnity Pact§! at the end of this diplomatic standoff."
