 MAR_Kosygin_Prestol.28.d: ""
 MAR_Kosygin_Prestol.28.a: ""

 MAR_Kosygin_Prestol.29.t: "Beyond the Thistle"
 MAR_Kosygin_Prestol.29.d: "The atmosphere in the KGB headquarters today was unusual. While it appeared unchanged from the outside, inside was utter chaos. Information recently obtained by agents was supposed to shed light on the location of the 'Prestol' terrorist organization’s leader, Sergey Taboritsky himself.\n\nNaturally, Vladimir Gil had to personally verify the information—blindly trusting prisoners would be overly naive.\n\nThe briefing room door opened with a characteristic creak, and a young employee entered with a stack of documents and photographs.\n\n'Well, what’s there?' Vladimir spoke calmly, but his appearance betrayed some anxiety.\n\n'The information has been confirmed; Taboritsky’s hideout is indeed in Gayny. Aerial reconnaissance has helped us pinpoint the approximate location of the cell.'\n\n'Hm. So that’s how it is. You try to help people with a pure heart, and this is what you get.'\n\nThis was followed by terrain analysis and preparations for the elimination operation. The operation was codenamed 'Fall.'"
 MAR_Kosygin_Prestol.29.a: "It’s time to put an end to this."
 MAR_prestol_check_berezniki_retard_tt: "§!Now we should pay a visit to Berezniki...§!"

