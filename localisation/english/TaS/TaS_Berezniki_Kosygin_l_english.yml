 UAR_Faction_GER_Pro_Pakt_Propaganda:0 "Pro-Pact Propaganda"
 UAR_Faction_GER_Pro_Pakt_Propaganda_desc:0 "The simplest way to gain influence in the United Arab Republic is to launch propaganda campaigns promoting their membership in the Pact. We will entice them with all the advantages of an alliance with the Master of Europe, from better protection to economic incentives and more."
 UAR_Faction_GER_Anti_Rus_Propaganda:0 "Anti-Russian Propaganda"
 UAR_Faction_GER_Anti_Rus_Propaganda_desc:0 "We can appeal to them as much as we like, but if the Russians appeal to them more, we’ll surely lose their favor. Launching anti-Russian propaganda will prevent such a turn of events. We’ll highlight the incompetence and selfishness of the Russians, emphasizing that they do not serve Arab interests but pursue only their own."
 UAR_Faction_GER_Invest_in_Arab_Industries:0 "Invest in Arab Industry"
 UAR_Faction_GER_Invest_in_Arab_Industries_desc:0 "By securing a fair share of the Arab economy, particularly in the industrial sector, we can sway the Arabs to our side, gaining a valuable ally in the Cold War. Investing a certain amount will increase their dependence on our investments, leading them to join our alliance in the near future."
 UAR_Faction_GER_Anti_Independence_Propaganda:0 "Anti-Independence Propaganda"
 UAR_Faction_GER_Anti_Independence_Propaganda_desc:0 "Preventing the Arabs from joining the Russian sphere is one thing, but their remaining independent benefits us no more. Thus, our propaganda efforts must be expanded to prevent the Arabs from maintaining neutrality in this conflict."
 UAR_Faction_GER_send_advisors_to_Arabs:0 "Send Military Advisors to the Arabs"
 UAR_Faction_GER_send_advisors_to_Arabs_desc:0 "Strengthening our military ties with the United Arab Republic is key to this endeavor. Our goal is to make them rely on our military might to feel secure from any threat. We will send military advisors to assist in this effort."
 UAR_Faction_GER_mediterranean_sea_naval_exercises:0 "Naval Exercises in the Mediterranean Sea"
 UAR_Faction_GER_mediterranean_sea_naval_exercises_desc:0 "Conducting Kriegsmarine naval exercises in the Mediterranean Sea will be a significant display of strength for both Arab forces and the Russians. It will show Arab troops that we rule the waves and that the security of their lands is guaranteed by the Reich, hopefully convincing them to distance themselves from the Russians and turn to us instead."
 GER_Faction_Join_RUS_Mission:0 "§R[UAR.GetFlag]United Arab Republic is leaning toward the [MAR.GetFlag]Russian sphere§!"
 GER_Faction_Join_RUS_Mission_desc:0 "Our diplomats have expressed concern that if the diplomatic situation continues as is, the Arabs will join the [MAR.GetFlag] §eRussian People's Empire§! at the end of this diplomatic standoff."
 GER_UAR_Faction_Join_Pakt_Mission:0 "§G[UAR.GetFlag]United Arab Republic joins our sphere§!"
 GER_UAR_Faction_Join_Pakt_Mission_desc:0 "Our diplomats have informed us that if the diplomatic situation continues as is, the Arabs will join the §sPact§!, strengthening our position in the Cold War."
 GER_UAR_Faction_Close_Faction_Mechanic_Mission:0 "§V[UAR.GetFlag]United Arab Republic§! §Rwill remain independent!§!"
 GER_UAR_Faction_Close_Faction_Mechanic_Mission_desc:0 "Our diplomats have expressed concern that if the diplomatic situation continues as is, the United Arab Republic may choose to §Vremain neutral§! in the Cold War."

 GER_Faction_Join_RUS_Mission.tt:0 "§R[UAR.GetFlag]United Arab Republic will join the §eRussian Sphere.§!§!"
