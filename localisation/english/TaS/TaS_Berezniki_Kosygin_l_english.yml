 MAR_Kosygin_OGAS.1.t: "Glushkov in Silicon Valley"
 MAR_Kosygin_OGAS.1.d: "You’re greeted by your appearance but judged by your intellect. This proverb best describes Glushkov’s visit to Guangdong. The neon signs and city lights were captivating, but beneath them lay a rotten, corrupt, and exploitative system. Yet, even despite its flaws, lessons could be drawn from such an experience.\n\nAfter all, Viktor wasn’t here to establish social justice or liberate China’s workers. His focus was solely on scientific progress in electronics, an area where Guangdong truly excelled. A state at the forefront of progress should serve as a starting point for creating OGAS. However, local technologies are heavily oriented toward a market economy, with planning technologies used only for market analysis. Still, development must start somewhere.\n\nThe week-long visit ended with a personal conversation with the current CEO. The topics discussed and the outcome of the talk will likely never be made public. And so, the chief ideologue of OGAS leaves this land of contrasts—a place where neon signs hide poverty and cutting-edge technologies serve to enrich the few. Perhaps one day he’ll return, but with entirely different goals."
 MAR_Kosygin_OGAS.1.a: "A start has been made."

 MAR_Kosygin_OGAS.2.t: "First Day at the Academy"
 MAR_Kosygin_OGAS.2.d: "Igor knew little about state affairs and couldn’t imagine what awaited him at his new post. After all, he had excelled at his native Arkhangelsk Academy and was among the 'Tsar’s scholars,' so his sudden transfer to an entirely unknown institution seemed bizarre. Perhaps someone in higher leadership had it out for him. But what did it matter?\n\nThe fact remained—he was being transferred from a prestigious academy to some establishment on the Volga that literally no one had heard of! And so, Igor stood with other equally confused students at the entrance, all wondering if they had done something wrong. Perhaps this was the greatest lesson the Northern State University had taught him.\n\nSoon, a middle-aged man in a business suit appeared before the crowd and began his speech: 'Greetings, esteemed students of the Volga Academy of Cybernetics. As you may have noticed, your enrollment here seemed chaotic and spontaneous. But I’m here to dispel your doubts and explain why you’ve been gathered here today. Please follow me.'\n\nThe group followed the guide. The building looked impressive inside, but the real treasure lay in the rooms.\n\nRows of cutting-edge Japanese computers and mainframe rooms.\n\nAfter such a display, the students were inspired and eager to start learning. Igor, in particular, was thrilled—his talent had been recognized."
 MAR_Kosygin_OGAS.2.a: "To work!"

 MAR_Kosygin_OGAS.3.t: "Meeting with Big Blue"
 MAR_Kosygin_OGAS.3.d: "New York’s gloomy weather wasn’t kind to the People’s Tsardom delegation. The motorcade moved through busy streets as Pyotr Demichev admired the city. Countless advertisements, hundreds of people with their own lives and worries, always rushing somewhere. Perhaps Russia could become like this one day.\n\nMeanwhile, the motorcade approached IBM’s office, which was already prepared for the visit. A delegation of efficient managers and Thomas Watson himself was set to present their product effectively. Unfortunately, they didn’t yet know it was largely pointless.\n\nEverything went according to plan: a presentation of the latest IBM System/360 mainframes and numerous discussions about their capabilities. Unfortunately, Pyotr Demichev knew little about these modern machines. But even he was impressed by the zeal with which they showcased these pieces of metal.\n\nUltimately, it came down to whether the company could meet the Tsardom’s needs. Unsurprisingly, IBM was ready to sell a sizable batch of Model 91 at a favorable price, with the option to order more. It was decided that the first 10 machines, along with maintenance staff, would arrive in Russia next month."
 MAR_Kosygin_OGAS.3.a: "Demichev’s work ends here."

 MAR_Kosygin_OGAS.4.t: "Pearl on the Volga"
 MAR_Kosygin_OGAS.4.d: "Matters related to the development of the OGAS system always personally interested Alexei II, so he closely monitored the project’s progress. When a whole city on the Volga was needed to continue the project, the Tsar approved its construction and constantly demanded progress reports. Now, the time had come for the final meeting before the city’s public opening.\n\nAs expected, construction was nearly complete, but an unexpected issue arose during the meeting: the city still had no name! Until now, it had only been referred to in documents as 'KBR-1,' with no proper name. An urgent brainstorming session began.\n\n'I propose the name Mladograd,' suggested Nikolai Maslennikov. 'It’s meaningful and reflects the spirit of cybernetics!'\n\nAlexei II’s face didn’t flinch, but he disliked the name.\n\n'I think the city should be called Bergburg, after the head of the St. Petersburg Institute and a man who did much for the country’s radio electronics,' countered Glushkov.\n\nAlexei II remained unimpressed. Naming the city in a German style or after a now-insignificant figure...\n\n'Kibergrad-na-Volge,' Kosygin-Romanov said quietly.\n\nA brief silence hung in the room before the name was approved, and the meeting concluded."
 MAR_Kosygin_OGAS.4.a: "Kibergrad it is."

 MAR_Kosygin_OGAS.5.t: "Clearing the Space"
 MAR_Kosygin_OGAS.5.d: "Today, Alexei Kanaev, the general director of the Kazan Electrotechnical Plant, received an unusual government directive. They needed to free up a room roughly the size of a storage closet for computers. Naturally, no such space was available, and the director, along with the facility manager, tackled the issue.\n\n'Maybe we just say to hell with it? Write that there’s no space available,' suggested Vasily Ibyatov.\n\n'Yeah, right, you dreamer. Know what happens to people like that?' Alexei gestured across his throat. 'Out in the cold, and the plant’s top brass get fined. So this is in your interest too!'\n\n'Fine, then let’s clear out the storage closet and stick the computers there!'\n\n'And where will all the tools go?'\n\n'I don’t know, let the paper-pushers make room for now. They don’t do anything anyway.'\n\n'Alright, gather the guys then. We need to start moving now; the computers should arrive by noon.'"
 MAR_Kosygin_OGAS.5.a: "In cramped quarters, but no offense taken."

 MAR_Kosygin_OGAS.6.t: "Report No. 001"
 MAR_Kosygin_OGAS.6.d: "Subject: Testing of the OGAS System in Kazan\n\nDescription: As part of testing the OGAS system, special data processing rooms were set up at several enterprises in Kazan.\n\nResults: Preliminary results show a 25% increase in efficiency and improved product accounting. On the downside, the machines consume excessive electricity. Additionally, due to the rushed allocation of space for computing machines, the results of the first few days were unsatisfactory. Further refinement is needed."
 MAR_Kosygin_OGAS.6.a: "Noted."

 MAR_Kosygin_OGAS.7.t: "Next-Generation Factories"
 MAR_Kosygin_OGAS.7.d: "Work at the Kazan Electrotechnical Plant continued as usual after the computers were installed; most didn’t even notice their presence. Everything went on as normal, except for the accounting department. Even Alexei Kanaev, the plant’s director, tried to master the computer installed in the manager’s office. During one such attempt, Vasily Ibyatov entered in high spirits.\n\n'Look, Lyokha, these machines really work well. We might even boost output significantly.'\n\n'Sure, they work fine, but aren’t you worried they’ll replace you next?'\n\n'Replace me? How’s a machine going to figure out how to clear a whole room of junk in a couple of hours and hook up computers to the network by evening?'\n\n'Yeah, I messed up there. But think about it. In the future, machines might write, draw, and work. What’s left for humans then?'\n\n'Well, by then, we’ll be retired. We’ll live it up, relax,' Vasily laughed, while Alexei gazed thoughtfully at the monitor again."
 MAR_Kosygin_OGAS.7.a: "Someday."

 MAR_Kosygin_OGAS.8.t: "Hello, World!"
 MAR_Kosygin_OGAS.8.d: "Today, the graduate program at the Volga Cybernetics Institute was in a state of heightened tension. For the first time, computers from several higher education institutions were linked into a single network! This event undoubtedly sparked excitement and interest. After all, if this attempt succeeded, it would open unprecedented possibilities for using the OGAS system.\n\nBut there was a downside to all this excitement. Caught in a liminal state between past and future, the graduate students hesitated to approach the machine. But one student mustered the courage to step forward and begin the test. Igor Nechaev emerged from the crowd and approached the keyboard. In complete silence, the sound of keys typing 'Hello World' was unmistakable, followed by another keypress to send the message.\n\nSilence hung in the room. What if the entire experiment collapsed right now? One second, ten seconds, a minute, two. Time dragged on unbearably. But then the machine’s screen lit up, displaying new text—not the one typed earlier! Igor leaned in, adjusted his glasses, and read aloud: 'Why not in the state language?' A brief silence was broken by loud laughter, followed by applause."
 MAR_Kosygin_OGAS.8.a: "It worked."

 MAR_Kosygin_OGAS.9.t: "The Fate of a Man"
 MAR_Kosygin_OGAS.9.d: "Ivan Federov’s day didn’t start well. He knew that sooner or later, a machine would replace him. It was always a problem for the future, but that future had arrived.\n\nWhere to go now? He could only handle accounting as part of a whole department. Now, a few people at computers could manage it. In frustration, the worker snapped. He’d promised himself to quit smoking this week, but to hell with it—there was a reason to light up. While smoking, his eyes caught a newspaper ad he’d grabbed that morning, hoping to read at work. 'State courses for training system administrators... Guaranteed employment upon completion and provision of basic amenities.'\n\nIvan fumbled for a notebook and pen in his pocket, jotted down the address from the ad, and bolted toward it. The building was about to open."
 MAR_Kosygin_OGAS.9.a: "It’s not over yet."

 MAR_Kosygin_OGAS.10.t: "OGAS Launched!"
 MAR_Kosygin_OGAS.10.d: "In a few days, the OGAS system was set to officially go into operation, and the entire country awaited the moment with bated breath. Everyone except Glushkov himself. A sense of melancholy had haunted him since the announcement of the full activation date. But now, Viktor Mikhailovich was to attend a private audience with the Emperor. The office doors opened, and Alexei II greeted the visitor.\n\n'Greetings, Viktor Mikhailovich,' he began calmly. 'OGAS will soon fully integrate into our Tsardom’s life, so I wanted to speak with you personally.'\n\n'Yes, greetings, Alexei... Mikhailovich. Of course, I’m ready to talk.'\n\n'Tell me, Vitya, what’s troubling you? After all, the whole country will soon witness the miracle of automation. Isn’t this your dream?'\n\n'Of course it is...' Viktor removed his glasses and nervously wiped them. 'But I’m afraid I couldn’t do everything I wanted. Many ideas are simply impossible to implement.'\n\n'I see...' With that, the Tsar rose from his chair and approached Viktor. 'You’ve already done more for people than any Marxist theorist or critic could in a lifetime. Don’t reproach yourself for what you couldn’t achieve. Rejoice in what you’ve managed to bring to life.'\n\nThe conversation gradually shifted to more practical matters, but it left a mark on Glushkov’s state of mind. He felt better. Perhaps this talk was exactly what he needed to take the hardest, final step."
 MAR_Kosygin_OGAS.10.a: "The time has come."
