 MAR_dossier_title_txt:0 "Dossier"
 MAR_NARIENMAR_DOSSIER:0 "§YCould the Berezniki MGB have predicted the emergence of an aggressive community of Black Hundred sectarians in the far North? Regardless, this community now poses a threat to the national security of the new Russia, and the KGB must deal with it. Preliminary investigation results indicate that it is led by Father Ioann, a former collaborator long presumed missing.\n\nThe objectives of this organization remain a mystery; they operate from the shadows and spare neither their own nor others. Rumors reach us of numerous and extremely brutal public executions, including beheadings 'in the name of God.' Their connection to 'Prestol' is undeniable, which is one of many reasons we must eliminate these terrorists at all costs.§!"
 MAR_ARKHANGELSK_DOSSIER:0 "§YThe activities of Finnish agents and 'White bandits' from Onega in the vicinity of Arkhangelsk were well known to the ZRRF, but there was no resolute opportunity to eradicate these groups. Now, taking advantage of the chaos engulfing western Russia, the anti-communists have emerged from the shadows and are acting far more confidently, preparing the ground for the future 'Liberation of Northern Russia.'\n\nThe intervention of third parties in the 'Prestol' crisis is a significant problem, especially since the Onega groups are shielding terrorist activities in Arkhangelsk, complicating their capture. Beyond this situational alliance, the agents and agitators have no direct ties to the 'Prestol' leadership and pursue the interests of their foreign masters.§!"
 MAR_SYKTYVKAR_DOSSIER:0 "§YThe OVI, one of the many small parties in the Komi Republic, turned out to be the ideological core of the formation of 'Prestol' while the government in the capital was preoccupied with preparations for the Vyatka Conference. Surprisingly, the party, led by the infamous Andrey Dikiy, operates completely openly and without fear.\n\nThe KGB can only guess at their true motives, but openly, they engage in agitation against the 'imposter Tsar' and the Mladorossi party, as well as clashes with city police and other regional groups. Although the accomplices of Taboritsky are clearly acting solely to distract attention from the movement’s true leader, we must still suppress the Society’s activities at their root, if only for the peace and safety of the country’s citizens.§!"
 MAR_GORKY_DOSSIER:0 "§YThe ascension of Alexei Kosygin provoked a sharp reaction not only from the right but also from the left. Among the veterans of the Gorky Tank Army and the West Russian Revolutionary Front, anti-government sentiments have spread widely, leading to the spontaneous formation of the 'Narodnaya Krasnaya Armiya' under General Lashenko.\n\nDespite its name, this 'army' is a veteran organization opposing the 'distorted Tsarist infection' of Kosygin’s socialism. Of greater interest in the context of fighting the Prestolniki is the trade union organization of the Gorky factory, closely affiliated with Lashenko’s group. The KGB has reason to believe that these individuals may be connected to the Prestolniki and numerous terrorist attacks across the country.§!"
 MAR_PERM_DOSSIER:0 "§YTo our great regret, the bandits from the 'Ariyskoe Bratstvo' have taken root in Perm more deeply than we initially assumed. With widespread uprisings of ultra-right extremists and terrorist acts across the country, these sectarians have also seized the opportunity. According to intelligence, the 'Aryans' are led by Nikolay Ivanovich Kukushin, one of the most dangerous Aryan executioners, known by the pseudonym Baldur Goltz. Their connection to the 'Prestol' leadership remains questionable, though some witness testimonies from the Vyatka Conference suggest the possible presence of Aryans during the terrorist attack.\n\nIn Perm, however, their activities are evident and bloody. Mass executions, building explosions, village burnings, and assaults on women are comparable only to the crimes of Nazi punishers during Operation Barbarossa. This marauding must be stopped at all costs and as quickly as possible.§!"
 MAR_SAMARA_DOSSIER:0 "§YThe attempts by the late Kazem-Bek’s government to behead the hydra of the Russkaya Osvoboditel’naya Armiya were ultimately in vain. Now, previously disarmed soldiers and rank-and-file members led by Viktor Maltsev have taken up arms again. We can only guess what specific connections Maltsev’s people have with the 'Prestolniki,' or if such connections exist at all.\n\nThe KONR currently operates as a full-fledged military force, controlling several settlements in the Volga region, particularly the city of Balakovo on the border with Reichskommissariat Moskowien, which has become a center for a renewed wave of smuggling comparable only to the activities of Mikhail Oktan during Andrey Vlasov’s lifetime.§!"

