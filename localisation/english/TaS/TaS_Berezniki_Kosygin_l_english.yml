### Decisions
 MAR_ogas_first_stage_effigy:0 "§YSTAGE 1:§! §GDESIGN§!"
 MAR_ogas_first_spying_for_superpowers:0 "Spy on the Superpowers"
 MAR_ogas_first_spying_for_superpowers_desc:0 "Our agents will infiltrate top scientific institutions in Germany, the USA, Japan, and Italy to search for and steal classified knowledge and information that could be useful in developing the OGAS system."
 MAR_ogas_first_trip_to_guandong:0 "Trip to Guangdong"
 MAR_ogas_first_trip_to_guandong_desc:0 "Guangdong is an experimental state. Created for corporations and technocrats, it holds immense potential. By traveling to Hoshu and meeting with CEOs of top corporations and corporate scientists (especially noting a certain Sony), we will gain the experience vital for developing OGAS."
 MAR_ogas_first_imperial_academy:0 "Form the Imperial Academy of Cybernetics"
 MAR_ogas_first_imperial_academy_desc:0 "Foreign experience is valuable, but it cannot replace the ingenuity and determination of the Russian mind. By establishing the Imperial Academy of Cybernetics, the best Russian minds in this field will work together, bringing the launch of OGAS closer."
 MAR_ogas_first_our_previous_ideas:0 "Our Previous Ideas"
 MAR_ogas_first_our_previous_ideas_desc:0 "Thank God we’re not starting from scratch. With experience in processing large datasets from the USSR and some warlord states, we can better understand cybernetics. Even the works of that self-taught maniac Lysenko or the utopian ideas of Syktyvkar’s Ultravisionaries might prove useful!"
 MAR_ogas_first_sort_the_designs:0 "Refine Our Developments"
 MAR_ogas_first_sort_the_designs_desc:0 "At the end of the first phase, we have numerous developments and projects! Truth be told, not all projects are coherent or flawless. By conducting a final review, we can proceed to the next phase of development."

 MAR_ogas_second_stage_effigy:0 "§YSTAGE 2:§! §GPREPARATION§!"
 MAR_ogas_second_talk_with_ibm:0 "Meeting with IBM"
 MAR_ogas_second_talk_with_ibm_desc:0 "IBM is a top company in high technology. Their products are used by the entire military and civilian apparatus of the OFN. Using old connections of our dear comrade Belozersky and other levers of influence, we can arrange a meeting between our scientists and IBM’s key figures. The meeting will be productive, one way or another."
 MAR_ogas_second_get_all_the_nerds_in_the_one_place:0 "Selecting the Best Minds"
 MAR_ogas_second_get_all_the_nerds_in_the_one_place_desc:0 "The country needs the best, which means the requirements for passing semesters and admission to the IAC must be significantly raised. Only the brightest of the bright have the right to shape the future of science and Russia!"
 MAR_ogas_second_math_analyze:0 "Analysis of Options"
 MAR_ogas_second_math_analyze_desc:0 "At this point, we have numerous options for the further development of OGAS. By conducting mathematical, schematic, prognostic, and other analyses, we must determine which OGAS variants are the most viable."
 MAR_ogas_second_cybernetics_cult:0 "Cult of Cybernetics"
 MAR_ogas_second_cybernetics_cult_desc:0 "Not only the state but also society must be ready for OGAS. Public campaigns, propaganda posters, radio and TV broadcasts, toys, performances at children’s events, and more—every outlet should proclaim the glory of cybernetics and assure that OGAS will be the future not only of Russia but of our entire blue planet."
 MAR_ogas_second_glushkovs_seminars:0 "Glushkov’s Seminars"
 MAR_ogas_second_glushkovs_seminars_desc:0 "Viktor Mikhailovich Glushkov. A man who became a legend in his lifetime. Laureate of the highest scientific award of the People's Tsardom and chief scientific director of the Imperial Academy of Cybernetics. One of the fathers of OGAS. We must provide him with comfortable working conditions, increasing his salary tenfold and granting him anything he requests. Through his seminars, future cyberneticists will not only learn cybernetics but live it."

 MAR_ogas_third_stage_effigy:0 "§YSTAGE 3:§! §GDEVELOPMENT§!"
 MAR_ogas_third_cybergrad_kazan:0 "Kibergrad-na-Volge"
 MAR_ogas_third_cybergrad_kazan_desc:0 "The lands near Kazan are ideal for creating a new city entirely dedicated to working on OGAS. New homes will rise where nothing stood before, creating a city of the new generation!"
 VICTORY_POINTS_11339:0 "Kibergrad-na-Volge"
 MAR_ogas_third_tsars_financing:0 "Increase Funding"
 MAR_ogas_third_tsars_financing_desc:0 "It’s clear that the current level of state funding for OGAS is insufficient. To continue work on the project, new funds are needed, and preferably as soon as possible."
 MAR_ogas_third_kibersin:0 "International Cooperation Corporation"
 MAR_ogas_third_kibersin_desc:0 "One way or another, foreign assistance helped us in the previous phases of OGAS. It’s time to return the favor! Invitations for a working visit to Cybergrad will be sent to Tokyo, Rome, and Washington so that scientists from our countries can work together for humanity’s future while, of course, reaping benefits."
 MAR_ogas_third_expand_the_institutions:0 "Expand the Development Network"
 MAR_ogas_third_expand_the_institutions_desc:0 "Currently, only the IAC, Kazan, and a few enterprises in major Western Russian cities are actively involved in OGAS development. By opening IAC branches in other regions of Russia and expanding existing scientific laboratories and enterprises, we will accelerate the development process."
 MAR_ogas_third_prepare_the_places:0 "Prepare Infrastructure"
 MAR_ogas_third_prepare_the_places_desc:0 "Unfortunately, our cities are not ready for the future. But not for long. By modernizing roads, radio-telecommunication systems, installing new radars, and generally exposing the Tsar’s subjects to the wonders of technological progress, we will prepare society and the state for the OGAS launch!"

 MAR_ogas_fourth_stage_effigy:0 "§YSTAGE 4:§! §GTESTING§!"
 MAR_ogas_foutrh_stress_test_kazan:0 "OGAS in Kazan"
 MAR_ogas_foutrh_stress_test_kazan_desc:0 "Despite the readiness of the OGAS system, many aspects still require testing. To verify them in real conditions, we must implement OGAS in a single city—Kazan—and observe how it functions compared to neighboring cities not connected to OGAS."
 MAR_ogas_foutrh_test_the_factory:0 "OGAS at a Single Factory"
 MAR_ogas_foutrh_test_the_factory_desc:0 "The ambitions of the OGAS project continue to grow, but so does the need for financial support. Additional investments are necessary for further development."
 MAR_ogas_foutrh_develop_army_verison:0 "OGAS for the Army"
 MAR_ogas_foutrh_develop_army_verison_desc:0 "How can we talk about grand plans like building the future of science and humanity while Nazi scum still trample our lands! By introducing cybernetics into our army, we can surpass the Wehrmacht in the technological sphere, where Germany once led. And when the last German punisher chokes on his own blood, he’ll know he was killed by two Russians—a soldier and a scientist."
 MAR_ogas_foutrh_test_it_in_sgvuz:0 "Test OGAS at SGVUZ"
 MAR_ogas_foutrh_test_it_in_sgvuz_desc:0 "It’s time to test OGAS in higher education institutions. A perfect opportunity has presented itself with the Northern State University."
 MAR_ogas_foutrh_do_the_debug:0 "Final Debugging"
 MAR_ogas_foutrh_do_the_debug_desc:0 "The OGAS system is nearly ready for launch. All that remains is to make final adjustments, and the project can be rolled out."

 MAR_ogas_fifth_stage_effigy:0 "§YSTAGE 5:§! §GIMPLEMENTATION§!"
 MAR_ogas_intergrate_into_civil_economics:0 "Integration into the Civilian Sector"
 MAR_ogas_intergrate_into_civil_economics_desc:0 "OGAS is primarily a tool for improving human life. Connecting OGAS to economic planning systems, managing civilian finances, and planning incoming revenues and expenses will significantly enhance the quality of life for the Tsar’s subjects and free up numerous production resources."
 MAR_ogas_intergrate_into_millitary_economics:0 "Integration into the Military-Industrial Complex"
 MAR_ogas_intergrate_into_millitary_economics_desc:0 "It’s time to integrate OGAS into the military-industrial complex. Soon, factories and plants will be connected to the system."
 MAR_ogas_intergrate_into_army:0 "Integration into the Army"
 MAR_ogas_intergrate_into_army_desc:0 "The Nationwide Automated System for Accounting and Information Processing is the most ambitious project of Tsar Kosygin and Viktor Mikhailovich Glushkov. If we manage to complete it, it will give us a tremendous advantage. However, we must always assess our capabilities realistically."
 MAR_ogas_fifth_integrate_into_education:0 "Integration into the Education System"
 MAR_ogas_fifth_integrate_into_education_desc:0 "The OGAS system holds boundless potential. Near-instant access to vast amounts of information will revolutionize education. We just need to integrate it properly into the existing system."
 MAR_ogas_fifth_semiconductor_valley:0 "Semiconductor Valley"
 MAR_ogas_fifth_semiconductor_valley_desc:0 "The Kibergrad-na-Volge project has undoubtedly proven its worth. As a result, a decision was made to further develop the city. We may not have our own Silicon Valley, but a Semiconductor Valley sounds pretty good too."

 MAR_ogas_tick:0 "Monthly Report"
 MAR_ogas_tick_desc:0 "Every month, we receive a report on the work done."

