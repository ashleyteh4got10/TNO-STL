 MAR_Faction_Close_Faction_Mechanic_Mission_desc:0 "Our diplomats have expressed concern that if the diplomatic situation continues as is, the United Arab Republic will choose to §Vremain neutral§! in the Cold War."
 UAR_Faction_Close_Mechanic_tt:0 "§VThe Middle Eastern Great Game§! will conclude."

