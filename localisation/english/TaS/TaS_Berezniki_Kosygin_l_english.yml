 MAR_Kosygin_UAR.1.t:0 "Middle Eastern Tango"
 MAR_Kosygin_UAR.1.d:0 "This evening will be long remembered by the Ministry of Foreign Affairs, as will the several that preceded it. Trouble began when Russian volunteers found themselves on the same side as Germans in Middle Eastern wars. This negatively impacted relations with our allies in America and Asia, as we also acted against their interests.\n\nNow, hearts at the Ministry are frozen, awaiting a dispatch from the newly formed United Arab Republic with proposals for mutual cooperation. It hasn’t arrived. It’s unclear whether one reached the Germans, as Berlin’s bureaucrats are adept at poker faces.\n\n'Enough, it’s time to take the initiative. It’s not too late. I’m heading to Damascus now,' was the decision of an exhausted, sleep-deprived Demichev. The next few hours were spent on the phone, dictating telegrams and letters. He only fell asleep on the plane."
 MAR_Kosygin_UAR.1.a:0 "Peace is but a dream."

 MAR_Kosygin_UAR.2.t:0 "Double-Headed Eagle"
 MAR_Kosygin_UAR.2.d:0 "The morning was particularly pleasant for Pyotr, and even the long voting session in the national assembly couldn’t dampen his mood. Most of the time, he and his subordinate ambassadors observed the German delegation, also present at the vote. Their leader, Helmut Braun, looked as if he were anticipating something. Perhaps Pyotr imagined it. A man in military uniform stepped to the podium to announce interim results. It seemed things were leaning in Russia’s favor.\n\n'ATTENTION ALL PRESENT,' the general’s roar interrupted the murmurs of elderly Arab and European men. All eyes instantly turned to the ceremonial door, where Salah Jadid stood. 'Ahmed Hassan al-Bakr and his gang of rabid dogs just attempted to storm the national assembly! Armed with German rifles, they’ve been arrested and disarmed, and Ahmed himself is in custody,' the general concluded, gesturing toward the German delegation.\n\nAfter these words, the German delegation protested and attempted to confront the Russian one but was stopped by UAR army soldiers. Passing the Russian delegation, Helmut glared at a smiling Pyotr."
 MAR_Kosygin_UAR.2.a:0 "Peace is but a dream."

 MAR_Kosygin_UAR.3.t:0 "Black Eagle"
 MAR_Kosygin_UAR.3.d:0 "The morning was particularly miserable for Pyotr, and the long voting session in the national assembly made it even worse. Most of the time, he and his subordinate ambassadors observed the German delegation, also present at the vote. Their leader, Helmut Braun, looked as if he were anticipating something—like someone was about to burst in. A man in military uniform stepped to the podium to announce results. It seemed no side had a clear advantage.\n\n'ATTENTION ALL PRESENT,' the general’s roar interrupted the murmurs of elderly Arabs and Europeans. All eyes turned to the ceremonial door, where Ahmed Hassan al-Bakr stood with his personal guard. 'The Russian delegation has been caught acting against the republic! All its members must be immediately punished for attempting to interfere in a sovereign state’s affairs!' he gestured toward the Russian delegation.\n\nThough Pyotr understood there would be no arrest, only deportation back to Russia, it brought him no joy. As he was escorted out by Ahmed’s thugs, Pyotr heard a mocking 'Auf Wiedersehen!' likely from Helmut."
 MAR_Kosygin_UAR.3.a:0 "A long flight home..."

 MAR_Kosygin_UAR.4.t:0 "Feathers"
 MAR_Kosygin_UAR.4.d:0 "The morning was particularly miserable for Pyotr, and the long voting session in the national assembly made it even worse. Most of the time, he and his subordinate ambassadors observed the German delegation, also present at the vote. Their leader, Helmut Braun, looked as if he were anticipating something—like someone was about to burst in. A man in military uniform stepped to the podium to announce results. It seemed no side had a clear advantage.\n\n'ATTENTION ALL PRESENT,' the general’s roar interrupted the murmurs of elderly Arab and European men. All eyes turned to the ceremonial door, where Hafez al-Assad stood.\n\n'Unprecedented acts of espionage and interference in the republic’s internal affairs have been uncovered! German and Russian agents tried to destabilize our stability and seize our freedom to make Arabs a bargaining chip in their global game! Well, tell your masters we won’t play by your rules,' he gestured first at the German delegation and, a second later, at the Russian one.\n\nAfter these words, the German and Russian delegations, completely forgetting the presence of their Arab partners, turned on each other.\n\n'The German side is trying to frame us!'\n\n'The general had evidence of your involvement too! The KGB messed up and now tries to pin the blame on the Germans!'\n\nThis altercation could have escalated to a fight if not interrupted by a shot from a Kalashnikov. The frightened diplomats were then escorted out of the assembly."
 MAR_Kosygin_UAR.4.a:0 "Neither for us nor for them."

 berez_dobrovoltsy_world_news.14.t:0 "[Get_newspaper_header]United Arab Republic Aligns with Russia"
 berez_dobrovoltsy_world_news.14.d:0 "Today, the results of the competition between the German Reich and the Russian People's Tsardom for the fate of a new player in Middle Eastern politics—the United Arab Republic—have been finalized.\n\nTo the joy of some and the dismay of others, the Red Tsardom of Alexei Kosygin has emerged victorious in this diplomatic standoff. The Arab state has already signed key cooperation and mutual aid agreements with Russia, effectively entering its sphere of influence.\n\nThis shift has also altered the country’s political climate: the Arab socialists of the Ba’ath Party have reaffirmed their name with the rise of Salah Jadid, a staunch advocate of people’s power and revolutionary reforms.\n\nThe Russian gambit succeeded, and the forgotten empire is returning to the global stage."
 berez_dobrovoltsy_world_news.14.a:0 "A cause for pride, isn’t it?"
 berez_dobrovoltsy_world_news.14.b:0 "The new order has wavered but not fallen."
 berez_dobrovoltsy_world_news.14.c:0 "Scheisse"

 berez_dobrovoltsy_world_news.15.t:0 "[Get_newspaper_header]United Arab Republic Aligns with Germany"
 berez_dobrovoltsy_world_news.15.d:0 "Today, the results of the competition between the German Reich and the Russian People's Tsardom for the fate of a new player in Middle Eastern politics—the United Arab Republic—have been finalized.\n\nTo the joy of some and the dismay of others, the Hegemon of Europe has emerged victorious in this diplomatic standoff. The Arab state has already signed key cooperation and mutual aid agreements with Germany, effectively entering its sphere of influence.\n\nThis shift has also altered the country’s political climate: the Ba’ath Party continues to drift rightward with the rise of Ahmed Hassan al-Bakr, a proponent of consolidating party power and Arab supremacy.\n\nCarrying away hopes of global reach, the Russian gambit seems to have failed."
 berez_dobrovoltsy_world_news.15.a:0 "Utterly failed, utterly!"
 berez_dobrovoltsy_world_news.15.b:0 "The devil never forgets favors."
 berez_dobrovoltsy_world_news.15.c:0 "Bavarian on the house!"

 berez_dobrovoltsy_world_news.16.t:0 "[Get_newspaper_header]Arab Isolation"
 berez_dobrovoltsy_world_news.16.d:0 "Today, the results of the competition between the German Reich and the Russian People's Tsardom for the fate of a new player in Middle Eastern politics—the United Arab Republic—have been finalized.\n\nTo the joy of some and the dismay of others, the diplomatic standoff concluded with the Arab state distancing itself from both the German and Russian spheres, culminating in a refusal to sign any cooperation agreements with these powers. The United Arab Republic is descending into isolation.\n\nThis shift has also altered the country’s political climate: through a bloodless coup, the relatively unknown Hafez al-Assad rose to power, seeking to consolidate as much authority as possible in his hands.\n\nThis domino held, and the status quo in the East remains untouched."
 berez_dobrovoltsy_world_news.16.a:0 "At least they didn’t go to the Germans."
 berez_dobrovoltsy_world_news.16.b:0 "Europe’s fate remains uncertain."
 berez_dobrovoltsy_world_news.16.c:0 "At least they didn’t go to the Russians."

 berez_dobrovoltsy_world_news.17.t:0 "[Get_newspaper_header]Battle for the Middle East"
 berez_dobrovoltsy_world_news.17.d:0 "Foreshadowing an inevitable clash between the Wehrmacht and the Russian Army on the battlefield, today Russian diplomats faced off against Germans in tense diplomatic rounds, verbal battles, and behind-the-scenes intrigues in the Middle Eastern desert.\n\nThe emergence of the United Arab Republic was the result of unexpected cooperation between volunteers (or, depending on perspective, interventionists) from Russia and Germany. Now, pragmatic Arab diplomacy has reached a deadlock, forcing them to choose a side or stand alone."
 berez_dobrovoltsy_world_news.17.a:0 "We cannot afford to make a mistake."
 berez_dobrovoltsy_world_news.17.b:0 "Can the wolf tame the bear?"
 berez_dobrovoltsy_world_news.17.c:0 "We cannot afford to make a mistake."