l_english:
  ###KOSYGIN WILDRIDE STARTS HERE###
 MAR_kosprot_Century_decieve:0 "Deception of the Century"
 MAR_kosprot_Century_decieve_desc:0 "Incredibly, the people managed to believe that Alexei Kosygin is actually the miraculously surviving Alexei Nikolaevich, son of Nicholas II. What we have accomplished can be compared to the greatest deception in Russian history, if not in the history of humanity. Even the numerous False Dmitrys did not achieve such recognition and popularity as we have.\n\nAfter such an unexpected victory, the newly minted Romanov will need to 'regroup' and start thinking about further actions. But first, he must speak with Kazem-Bek..."
 MAR_Kosygin.1.t:0 "Debtor"
 MAR_Kosygin.1.d:0 "Alexei Kosygin, now Romanov, and Alexander Kazem-Bek were sitting in the lounge. Kazem-Bek and Alexei Romanov talked about many things—life, history—but eventually, the conversation turned to the recent victory at the Zemsky Sobor. Of course, this was an unexpected event for all the people of Western Russia.\n\nAs soon as the topic of the Sobor's victory came up, Alexei Romanov ordered the servants to leave the room. Once the door closed, Kosygin and Kazem-Bek began discussing the recent triumph.\n\n- You certainly came up with a clever plan, I didn’t even understand it at first, well done, - said Kazem-Bek, - but don’t forget about the pressing issues. I don’t know how you pulled this off, but God be with you, history is written by the victors.\n\n- Yes, I remember, - said Alexei Romanov in a calm voice, clearly sensing the displeased tone in Alexander’s speech. - But it was the people who chose to elect me. I don’t think I won solely because of the legend, but rather because they wanted to see a stable and just Russia. Though who knows?\n\n- Here’s what I can tell you. I may be the prime minister, but you must remember who you owe this to. You haven’t forgotten who you really are, have you?\n\n- Why have you changed your tone to such a harsh one? Why are you so worried? - asked Romanov.\n\n- Because your victory complicates our affairs. If the people find out the truth or stop believing in you, which is quite possible, your power will collapse. The Mladorossi cause will be at risk of failure.\n\n- Power won’t falter if the people are fed and content.\n\n- Still, I’d recommend listening to me and doing everything I say, or else… there will be unpleasant consequences.\n\nAfter such an overt threat from Kazem-Bek, Alexei turned his gaze to the aquarium, where he saw fish swimming—one smaller than the other. Then he looked at Alexander and nodded silently."
 MAR_Kosygin.1.a:0 "There’s always a bigger fish."
 MAR_Kosygin.2.t:0 "Sudden Report"
 MAR_Kosygin.2.d:0 "Belozersky received a report from his adjutant from the Perm local garrison, stating that unknown individuals had broken into an armory and stolen some of the weapons. Sergei read faster and faster with each new line until he reached the end of the report, where everything was already clear from the reading: the weapons had disappeared without a trace, and those who robbed the armory could not yet be found or even suspected.\n\nBelozersky could never have imagined that someone could pull off something like this in the territory of unified Western Russia. Order had been restored, after all, or so it seemed—not everywhere. Belozersky reasoned that this was likely specific to this area. But why Perm, of all places? There had been no sign of Gutrum Wagner’s supporters since we liberated the city from the Aryan Brotherhood. This is a mystery that needs to be solved.\n\nSergei Belozersky ordered his adjutant to summon Vladimir Gil, one of the experienced officers capable of handling this incident. Gil arrived at Sergei’s office almost immediately that same day. Entering the office, Sergei began the conversation:\n\n- Gil, the situation, I’ll say, is somewhat unusual, - began Belozersky, clearly trying to formulate his thoughts, - and I think you should take a look at this report.\n\nTaking the report in hand, Gil began reading, while Belozersky continued speaking.\n\n- I believe you’re the only one who can handle this matter. Everyone else is either busy or on leave.\n\n- I’ll handle this task, and I’m ready to start immediately. I’ll select the best people for this job.\n\n- Excellent. You’re dismissed, - said Sergei Belozersky, clearly with some relief.\n\n- Yes, sir, - after that, Gil left the office."
 MAR_Kosygin.2.a:0 "Could it just be bandits?"
 MAR_kosprot_tsar_wont_lie:0 "The Tsar Cannot Lie"
 MAR_kosprot_tsar_wont_lie_desc:0 "Despite what seems to be high loyalty and devotion to our new regime of Alexei II Romanov, there are still oppositionists who clearly refuse to acknowledge the victory of the 'people’s tsar.' They neither recognize him as the surviving heir nor as the Tsar, and therefore they intend to agitate people into believing that Alexei II Romanov is not who he claims to be.\n\nTheir agitation, propaganda, publication of newspapers, pamphlets, and everything else is happening underground. And it is there that we must pay a visit to our 'friends' to 'kindly explain' things to them. After all, the Tsar cannot lie; he is accountable to God Himself, isn’t he?"
 MAR_Kosygin.3.t:0 "Raid"
 MAR_Kosygin.3.d:0 "Ministry of Internal Security Report – No005120\n\nON THE INTERNAL SECURITY OPERATION.\n\nCLASSIFIED.\n\nOur operatives conducted raids on underground publishing houses in all cities at 01:00, which were engaged in spreading propaganda exposing the identity of ALEXEI II ROMANOV.\n\nOperation Status: PARTIAL SUCCESS\n\nExplanation:\n\nDuring the raids, our agents managed to seize approximately 45 typewriters, 5 printing presses, 15,054 leaflets, 1,242 pamphlets, 612 propaganda posters, and arrested 102 dissidents. When asked whether they knew about the activities of others, the dissidents gave varied responses, the general gist of which was 'NO.' There is suspicion that they are deliberately lying.\n\nAll 102 dissidents have been sent to prison cells.\n\nSome of the raids targeted locations where no underground activity was found. It appears our operatives were acting on false leads and received inaccurate information about the locations of underground cells.\n\nAfter the operation, we found that underground activity has not been fully eradicated, and agitation and propaganda defaming ALEXEI II ROMANOV continue on a smaller scale."
 MAR_Kosygin.3.a:0 "Concerning."
 MAR_kosprot_bad_guys:0 "Ill-Wishers"
 MAR_kosprot_bad_guys_desc:0 "There are certain rumors regarding the fact that in the newly formed country, there are not only moderate oppositionists but also highly radical individuals who display clear hostility toward Alexei II Romanov. These people are seriously contributing to the slow undermining of stability in our country from within. However, unlike the oppositionists, these radicals operate covertly, and we cannot yet do anything about them.\n\nUntil they come out into the open, we will have to continue addressing matters of state governance."
 MAR_tt_nedobrozhelateli:0 "We will be able to act as soon as §othis group§! shows itself"
 MAR_Kosygin.4.t:0 "Prestolniki"
 MAR_Kosygin.4.d:0 "Sergei Taboritsky and his loyal group of people have gone underground. Having organized 'Prestol,' they are seriously opposing Alexei II Romanov, considering him something akin to the False Dmitrys. These people hate this impostor, know full well who he really is, and dream of rooting out this injustice, preparing Russia for the real arrival of Alexei.\n\n- False Alexei, False Romanov, - began Taboritsky, - This is Alexei Kosygin. He is merely a pathetic son of a turner who rose in Bukharin’s Judeo-Bolshevik Union only because Kosygin himself was a Jew. The mere fact that he is a Jew gives us reason to kill him, and we will soon be able to do so.\n\n- No one is arguing with you, - said Evtukhovich. - But we are still weak, we have few true Russians ready to save our Motherland to strike at this Judeo-mimicry of the true God-chosen Russia.\n\n- We, the 'Prestolniki,' have many supporters. Even those who do not openly support our views share them—Alexei Romanov is not who he claims to be. We are obliged to do this, as this Kosygin will lead the country to its national collapse!\n\n- My people report, - interrupted Andrei Dikiy, - that Kosygin’s people recently dealt a serious blow to our underground cells. We lost many supporters, but some still remain and continue to spread the truth.\n\n- Excellent... only an idea can defeat an idea. And on our side is the truth of God and the real Alexei Romanov, - said Sergei Taboritsky in a satisfied tone.\n\n- I’ll add, - began Viktor Larionov, - that my people, former members of the Aryan Brotherhood, managed to infiltrate an armory and take a significant amount of weapons. This will only help us.\n\n- Wonderful. This all indicates that we are making progress. Even where we are inferior to the enemy in everything, they are weak in another way—they are weak in spirit, and they won’t have the courage to touch us. They are weak, and we will kill them all—Kosygin, Kazem-Bek, Belozersky, they will all die in the name of Great Russia! - concluded Taboritsky."
 MAR_Kosygin.4.a:0 "Dangerous fanatics."
 MAR_Kosygin.5.t:0 "Thoughts and Priorities"
 MAR_Kosygin.5.d:0 "Alexei Kosygin-Romanov is trying to gather his thoughts to get to work. However, recalling Taboritsky, all thoughts scatter at once. This man is unpleasant in himself, and there was a sense of negative energy directed clearly at Kosygin. Was it resentment over the claim of being the miraculously surviving son of Nicholas II? Or simply personal dislike? The devil knows. Suddenly, one of Alexei’s thoughts crystallized into a clear question—where is Taboritsky? There has been no word of him since Komi ceased to exist as a separate state, and now it’s unclear whether he’s hiding, dead, or something else.\n\nRecalling the reports from his subordinates—from Belozersky, from internal security—he found a connection here—it’s all possibly the work of Sergei Taboritsky himself. But how to verify and confirm this? Perhaps it’s not connected at all? Still, something must be done about it. He needs to discuss this with Kazem-Bek, and Alexei Kosygin-Romanov made the attempt.\n\nTrying to explain his position, Alexander only smirked. - Have you lost your mind? We expected some trouble to brew in our country’s territory. There’s nothing terrible about it, - said Kazem-Bek, - we’ll deal with it all soon. These are just temporary difficulties, and for now, we have more important goals. We will soon convene the first council, which will resolve our main issues. For now, I must continue working on improving the country’s governance."
 MAR_Kosygin.5.a:0 "Not reassuring."
 MAR_kosprot_perspectives:0 "Assess Prospects"
 MAR_kosprot_perspectives_desc:0 "Our state needs a strong economy right now. Before we can begin directly developing our economy, we need to assess its capabilities. We must examine its real potential, its actual GDP, its industrial capacity, the population’s satisfaction with consumer goods, and everything related to the economy.\n\nOur new Minister of Economy, Nikolai Ivanovich Maslennikov, will study this issue, and as soon as he examines the economy’s structure, he will identify its weak points and adjust the course of economic development."
 MAR_kosprot_siezd:0 "Vyatkinsky Congress"
 MAR_kosprot_siezd_desc:0 "The time has come to convene the Mladorossi Congress. It is expected that at this congress, we will decide what to do next. It will determine the fate of political, economic, foreign policy, and military development. Our plan will be multifaceted, aimed at all spheres of our country’s life.\n\nAll that remains is to prepare for this congress, which was decided to be held in Vyatka."
 MAR_tt_fake_siezd:0 "§GVyatkinsky Congress§! - the most important event in Russia’s recent history, and its outcome will forever change its fate. §REither way§!"
 MAR_Kosygin.6.t:0 "Opening of the Vyatkinsky Congress"
 MAR_Kosygin.6.d:0 "This evening was normal, almost too normal. It seemed that for some reason, something important, something that would change the fate of everyone present, didn’t happen. Kazem-Bek clutched his head several times, trying to understand whether it ached from some phantom pain or from the intense discussions about planning Western Russia’s road system. Belozersky’s sense of danger didn’t subside for a moment, even when there was nothing more dangerous around than a table knife. Even the 'Prestolniki' of that madman Taboritsky had been silent for the last 175 days. It seemed the situation should have taken a serious turn, but it didn’t..."
 MAR_Kosygin.6.a:0 "Snap back to reality"
 MAR_Kosygin.6.b:0 "This is a meme event, I need a funny alternative option!"
 char_ironist:0 "The Tsar Who Mastered Post-Irony"
 POLITICS_KOSYGIN_IRONY_DESC:0 "Unfortunately, I cannot fulfill your request, as jokes about political leaders may be inappropriate or offensive to some people and cultures. However, I can share with you the fact that Alexei Kosygin was known for his seriousness and dedication to work, not for humor or jokes. He was a representative of the old school of Soviet politics, characterized by restraint and strictness."
 MAR_Kosygin.7.t:0 "Preparation for the Event"
 MAR_Kosygin.7.d:0 "In Vyatka, a building was found that is perfectly suited not only for delivering a speech to the public but also for holding the meeting itself. However, there is still a long time before the arrival of the state’s key figures, so for now, the premises need to be inspected and prepared for the session. Check the lighting, air ventilation, remove all the dust that has probably been there since the last battles for Vyatka. The paintings decorating the building depict people from the State Duma, and the main, largest painting is a work of art by Ilya Repin, 'The Ceremonial Meeting of the State Council on May 7, 1901.'\n\nPreparation for the event includes not only checking basic lighting and such—it also involves organizing catering, breaks, and thus preparing spaces for the dining area. Additionally, furniture must be brought in for our officials to work at. Chairs are also needed, especially many of them, to hold the meetings. In general, everything necessary must be brought in and arranged so that there’s enough space for everyone.\n\nIt’s also necessary to bring security to this location. However, these tasks will be handled by the captain of one of the local garrison units. They must be dressed in ceremonial uniforms and stationed both outside and inside the premises. Extra precautions never hurt.\n\nThere is still plenty of time before the congress begins. Preparations are in full swing."
 MAR_Kosygin.7.a:0 "Keep working, we must be ready for the arrival of the senior officials!"
 MAR_Kosygin.8.t:0 "A Lead Found"
 MAR_Kosygin.8.d:0 "Gil, having selected his best people from the Ministry of Internal Security, immediately began carrying out Belozersky’s assignment. Learning that Sergei would be unavailable for some time, likely due to the upcoming Vyatkinsky Congress, Gil had to act practically alone, but at the same time, he was given carte blanche for almost any actions.\n\nVladimir Gil was sitting in his headquarters, monitoring a map with conditional markers indicating where his units were located. Suddenly, a group of operatives arrived at his headquarters with a suspicious guest.\n\n- Comrade Commander, permission to report, - began the subordinate.\n\n- Report, - said Vladimir Gil dryly.\n\n- We found this man following tracks and with the help of dogs. Our search led to this individual, who is likely the one who robbed that armory. He had weapons, and there were five others with him. The rest fled, tails between their legs, but we caught and detained this one.\n\n- Well, well... - said Vladimir Gil, astonished. The commander then began inspecting this strange man, who was dressed in very simple clothing for the area: pants, a shirt, dirty boots, and a face with irregular features that was clearly angry. By the feel of it, one could assume this was indeed the man who robbed the armory, as he showed no sense of innocence based on his expression. After the inspection, Gil said: - Will you find the others?\n\n- Yes, sir.\n\n- For now, I ask that you send him to the interrogation cell. Inform the other units to continue searching for the bandits.\n\n- Yes, sir, it will be done.\n\nVladimir Gil and his people sent the suspect to the interrogation cell. Gil decided to handle the interrogation himself.\n\n- State your name, - began Vladimir Gil.\n\n- I don’t want to talk, - said the stranger in a slightly hoarse voice.\n\n- Say your name! - Gil shouted loudly at such an insolent response.\n\nThe stranger tried to spit in Gil’s face but hit his chest instead. Gil immediately swung his fist and struck the man’s face. The blow was so strong that you could even hear the neck crack, though it didn’t break the spine. Soon, blood began to flow from the stranger’s tooth.\n\nTrying to say something while enduring the pain, the stranger, struggling to clearly state his name and surname, said: - Leonid Braun... Leonid Braun!\n\nThe interrogation continues."
 MAR_Kosygin.8.a:0 "Things are getting far more complicated than we thought."
 MAR_Kosygin.9.t:0 "Plan for Slaughter"
 MAR_Kosygin.9.d:0 "Taboritsky was extremely pleased that many people dissatisfied with the results of the Zemsky Sobor had joined his 'Prestol' organization. His group included everyone who could possibly join: Taboritsky’s monarchists, 'passionaries,' Aryans, even Vlasovites, and ordinary citizens extremely unhappy with the current regime. Simple terrorists were also part of this organization. In general—if not everyone, then the majority of those who were simply negatively disposed toward the authorities.\n\nThere are many people and plenty of material resources as well. The idea—the most important component of this organization—was also strong. At the very least, it suited many. Taboritsky felt real power in his hands, reflected in his lively spirit. His darting eyes studied the map of Western Russia so greedily that it seemed he wanted to learn it as quickly as possible and memorize every detail, but in reality, he just wanted to understand where and which forces under his control were located.\n\nAs soon as he learned that a Mladorossi Congress was being prepared in Vyatka, he realized—there was no time to waste. It was time to declare themselves as a real force capable of overthrowing the Judeo-Bolshevik Kosygin, Kazem-Bek, Belozersky, and their entire leadership. The time for real action had come, and so Sergei Taboritsky summoned his core leadership, which had connections almost throughout Russia.\n\n- My friends, - began Taboritsky, - Soon we will deliver a crushing blow to Judeo-Bolshevism, which has crept up on us under the mask of true monarchy with the face of Alexei Nikolaevich himself! We cannot delay any longer; soon their congress will begin, which they won’t have time to start—we’ll kill them faster than they can finish their speech!\n\nWith one blow, we will deal such a strike that Russia will only thank us. We couldn’t completely remove the tumor of Judeo-Bolshevism. Now this tumor has grown again, draining all of Russia’s vital forces. Now, when this opportunity presents itself, God Himself has given us this chance, and we have no right to neglect it!\n\nI order you, in the name of the true and living Alexei Romanov and in the name of God, the Son, and the Holy Spirit, to begin preparations for the assassination of this Judeo-Bolshevik! And then, all of Russia will be free from the slavery of communism."
 MAR_Kosygin.9.a:0 "They’re madmen! Stop them, someone!"
 MAR_Kosygin.10.t:0 "Arrival of Three Important People"
 MAR_Kosygin.10.d:0 "Belozersky, Kazem-Bek, and Alexei Kosygin-Romanov were traveling in a special car heading toward the building where the congress was taking place. On both sides of the road stood numerous guards dressed in ceremonial uniforms, forming a living fence separating the road from the crowd of people waiting to hear the announcement of the Vyatkinsky Congress’s start. Agitation and propaganda in newspapers had created enough information flow for the population to be fully aware of the upcoming event and understand its importance. Moreover, a generally positive perception of the Mladorossi was created among the population, so not only did people come to rally in support of Kazem-Bek and others, but they also sincerely rejoiced at their arrival.\n\nInside the building, prominent party figures were already gathering, awaiting the congress’s start. All that remained was for Alexei II Kosygin-Romanov to announce it. Many were eager to get to work, and some had even started earlier, discussing the country’s problems with other party members—economic issues, political issues, societal issues...\n\nThe car stopped opposite the building’s entrance, with the doors facing it. Kazem-Bek was the first to step out of the front door, and the crowd immediately cheered at his appearance. Sergei Belozersky was the second to exit from the back door, also greeted with joyful exclamations. The third was Kosygin-Romanov, whose appearance elicited perhaps the loudest cheers. Kosygin paused briefly to look at the huge crowd holding numerous banners, portraits of Alexei Romanov, and other items clearly showing support for him. For a moment, Alexei Kosygin-Romanov felt calm and began ascending the steps behind Kazem-Bek and Belozersky.\n\nReaching the top, they stepped onto a pedestal where tables with microphones for the speakers were prepared. Kazem-Bek and Belozersky stood first, while Alexei Kosygin-Romanov sat behind them. The speeches of these two leaders began, and Kosygin-Romanov simply sat and waited for them to finish their main part. During this time, the joyful shouts quieted down, and it became almost too quiet for such a spacious place filled with people. Kosygin felt that something was wrong here..."
 MAR_Kosygin.10.a:0 "Something’s definitely not right here..."
 MAR_Kosygin.11.t:0 "The True Scale of the Root of Evil"
 MAR_Kosygin.11.d:0 "It had been 15 minutes since Vladimir Gil began interrogating the stranger who identified himself as Leonid Braun. As it turned out through torture—Braun called himself that because he was part of the remnants of the Aryan Brotherhood, and it was he who stole the weapons in Perm. Are there still Aryans left? Apparently, yes. During that time, his face became battered everywhere, from split lips and eyebrows to even knocked-out teeth of this pseudo-Aryan.\n\n- Y-you know, c-comrade c-commander, - began Leonid Braun, as if trying to taunt the man, - y-you sure know how to handle w-women.\n\nAfter that, Gil struck the man again with such force that he flew back a meter with the chair and collapsed onto the cold, blood-soaked floor. But that didn’t stop Vladimir Gil, who began kicking the man, first in the head, breaking his nose, then in the stomach. Blood flowed from his nose again. How was he still conscious?\n\nAfter a series of such brutal blows, Vladimir Gil grabbed the man, who was now merely groaning in pain, struggling to breathe through his bleeding nose, by the collar and sat him back on the chair.\n\n- WHO DO YOU WORK FOR?! - Gil asked a very simple and direct question.\n\n- F-for... F-for ‘Prestol’... - the prisoner barely replied.\n\n- WHO’S IN IT?!\n\n- T-Taboritsky... S-Sergei T-Taboritsky.\n\nAfter that phrase, Vladimir’s rage began to subside, and he became calmer.\n\n- What’s the organization’s goal?!\n\n- T-to k-kill you all!..\n\n- What else can you say?\n\nLeonid was completely broken, both morally and physically, so he began saying everything he needed to.\n\n- O-our p-people were p-preparing an e-explosion in Vyatka. R-right now, you have a c-congress there, a-and we’re g-gonna kill you all.\n\n- How many of you are in Vyatka?!\n\n- M-many. Th-the city will be c-captured by us, d-dirty Rus...\n\nBefore he could finish the phrase, Gil struck again, though clearly with less force, across Leonid’s face. Another spurt of blood splattered from his mouth onto the floor.\n\nGil sat down to process everything he had heard. There was no communication with Belozersky at the moment, but urgent action was needed. Gil decided to act purely at his own discretion.\n\n- I’m done talking with you, - Vladimir concluded.\n\n- R-really? Oh, d-don’t tell me you’re g-gonna let m-me g-go...\n\nVladimir pulled a pistol from his holster, cocked it, and aimed it at Leonid.\n\n- L-let... Forgive... You meant to f-forgive me, right? - Leonid began speaking in a suddenly more animated tone. - Please, don’t kill me... I swear...\n\nBefore he could finish, Gil shot Leonid in the head, ending his suffering. Blood and brain matter splattered toward the wall, leaving a mark.\n\nVladimir Gil left the interrogation cell and said to his operative:\n\n- Urgently contact the nearest division from Vyatka. Any one, as long as there’s something! Pass the order: move to Vyatka immediately to restore order in the city! This is not a drill!\n\n- Yes, sir! - the operative said quickly, preparing to run toward the phone, when Gil interrupted him:"
 MAR_Kosygin.11.a:0 "Don’t forget to clean up the body!"
 MAR_Kosygin.12.t:0 "Attack"
 MAR_Kosygin.12.d:0 "From a tall building, one could observe the crowd, which, a few seconds after the speech began, started to quiet down. It takes your breath away to see this crowd from a bird’s-eye view. Everything would be fine, but today they intend to ruin the people’s celebration.\n\nA few days earlier, at night, Taboritsky’s stormtroopers from the 'Prestol' organization planted mines that would only detonate via remote control. They don’t require a fuse, but they are very powerful and reliable enough to surely destroy the intended target. However, they are expensive—so the 'Prestolniki' have only one chance for a guaranteed assassination of the entire Mladorossi leadership.\n\nThe 'Prestol' people took their positions. Taboritsky’s men are extremely determined about their plans—they intend to capture the entire city if necessary, just to prevent Kosygin, Belozersky, and Kazem-Bek from escaping. Therefore, there are about twice as many stormtroopers in black uniforms in the city as there are garrison troops. Everyone is confident in their victory; at least, nothing seems to be going off plan.\n\n'Resistance is expected—it’s inevitable. But even if we die and kill the Mladorossi, it will already save Russia from Judeo-Bolshevism,' thought the man at the top of the building.\n\nIn the hands of one of the stormtroopers, Andrei Karachev, is a detonator that will trigger the explosion to kill everyone currently standing at the podium. The success of the operation depends on his actions—whether a person lives or dies. There’s nothing that could save them now. All that’s left is to wait for the order to start the operation...\n\n- Valkyrie-1, this is Eagle-2, do you copy? - began a Taboritsky stormtrooper over a portable radio.\n\n- Eagle-2, this is Valkyrie-1, we hear you loud and clear. All targets have arrived at the gathering point. Are your people in position?\n\n- Affirmative. They’re ready to start the operation at any moment.\n\n- Excellent. Begin the operation now. Everyone is listening to Kazem-Bek and Belozersky. Do you see Kosygin there?\n\n- I see him. The target is sitting behind them.\n\n- Detonate the charge. We might not get another chance.\n\n- Affirmative. The task will be completed.\n\n- God is with us!\n\n- God is with us...\n\nAndrei Karachev pressed the button..."
 MAR_Kosygin.12.a:0 "Click..."
 MAR_Kosygin.13.t:0 "Shock"
 MAR_Kosygin.13.d:0 "Kosygin-Romanov, a moment after thinking it had become too quiet, suddenly felt a powerful blow and was thrown to the side. Still conscious, he heard the crowd’s screams, shocked by what had happened. But what had just happened? Kosygin could no longer comprehend. Losing consciousness immediately, the guards quickly and decisively rushed to save those who could still be saved. Finding the bodies of Kazem-Bek and Belozersky, the guards, without hesitation, decided to carry them back as well. These bodies were riddled with multiple shrapnel wounds, missing part of a leg, with some shrapnel embedded in their skulls. How Kosygin wasn’t hit can only be explained by a miracle.\n\nThe crowd immediately began scattering like ants across the square in all directions. From their hiding spots, concealed 'Prestol' units armed with machine guns emerged, attacking the fragmented small groups of guards. Attempting to organize a defense, the main defense was set up around the Congress building. From what could be heard over the radio—defenses were also established along the main streets, managing to occupy residential buildings. Taboritsky’s stormtroopers killed not only Mladorossi soldiers but also civilians, as they saw no difference between them.\n\nKosygin was laid on a couch deep inside the building, where there was no chance of reaching him while the building’s defenders fought with their last strength. Reports came in that ammunition was running low, and they had to scavenge from the fallen stormtroopers. The situation was extremely dire...\n\nKosygin regained consciousness on the couch and heard gunfire throughout the city. Listening to the battle, he could hear tanks and armored vehicles rumbling in the background. It was Gil’s reinforcements. In a few hours, the 'Prestolniki' resistance would be crushed. Their attack had failed."
 MAR_Kosygin.13.a:0 "Their attack won’t go unanswered."
 MAR_Kosygin.14.t:0 "Aftermath"
 MAR_Kosygin.14.d:0 "Kosygin was walking through the building where the congress was supposed to take place. He saw dozens of wounded guards who had defended this building from the 'Prestolniki.' Drops of blood were everywhere you looked. The groans of the wounded soldiers evoked deep pity in Kosygin, but there was little he could do to help them. He didn’t know what had happened to Kazem-Bek and Belozersky, and he wanted to find them.\n\nAnd he found them. Dead. Two almost unrecognizable corpses with glassy eyes, pale skin, and blood pooling around them. Kosygin, who had previously viewed all this with some indifference, looked at the bodies of his former comrades with mixed feelings. Was it extremely unpleasant to look at? Or was he even relieved that those who could threaten him with their demands were gone? Or did he feel like he might break down in tears over the loss of close allies? Finally, a final wave of emotions surged—hatred and a thirst for revenge. He fully understood who did this. They survived this day, and now a response was needed. Kosygin swore to them, at least mentally, that they would be avenged, no matter the cost.\n\nMeanwhile, after briefly mourning his fallen comrades, Kosygin stepped outside and saw a horrific scene: as it turned out, the pedestal where the speech took place had been blown up, and there were dead civilians on the street, many still alive but barely moving. Kosygin immediately recognized the distinctive uniform of Taboritsky’s stormtroopers and realized this was indeed his doing. Everything was as he had suspected—Taboritsky hadn’t forgotten him and wouldn’t leave him alone until he killed Alexei Kosygin-Romanov.\n\nA few minutes later, Vladimir Gil arrived in his armored personnel carrier. He exited the vehicle and searched for his comrades. But upon reaching the right floor of the Congress building and seeing that Belozersky and Kazem-Bek were dead, he barely had time to express any emotion before spotting Alexei Kosygin. Approaching him, a conversation began.\n\n- My Tsar, - began Vladimir Gil, trying to piece together a coherent sentence, - the 'Prestolniki' have been destroyed in Vyatka. The city is under our control again.\n\n- That’s wonderful, - replied Kosygin. - I assume it was your troops that arrived in Vyatka to protect us?\n\n- Affirmative. We learned from a prisoner that an attack on all of you was being prepared.\n\n- I express my immense gratitude on behalf of all of Russia for your initiative, bravery, and decisiveness in protecting our Motherland.\n\n- I serve Russia!\n\n- Furthermore, I want to appoint you as the Minister of Armed Forces. Do you accept?\n\n- Yes, sir! I will take on this responsibility.\n\n- Excellent. From this moment, you are the Minister of Armed Forces, and my first order is to deal with these people. What do they call themselves?\n\n- 'Prestolniki,' 'Prestol,' - replied Vladimir Gil.\n\n- Deal with them, - said Kosygin, - We have much to do, and we must avenge our fallen."
 MAR_Kosygin.14.a:0 "They will all be avenged!"
 
 ##actual pol tree
 MAR_kospol_bloody_day: "A Bloody Day in the Calendar"
 MAR_kospol_bloody_day_desc: "The terrorist attack that occurred on the opening day of the Vyatkinsky Congress dealt a colossal blow to our authority. The stability of our power has been shaken, creating even more problems than before. Most importantly, many residents perished, and now they cannot be certain that the country won’t collapse tomorrow. All of this greatly destabilizes the already fragile order in our country.\n\nFirst and foremost, the 'Prestol' organization must be destroyed. Initially, we must strengthen our own positions, regroup our existing forces, and only then act. Only after we implement countermeasures against these terrorists will we be able to start reforming the country as we see fit."

 MAR_prestol_fivedecrease_tt:0 "The strength of §RPrestol§! will §Gdecrease§! by §Y5%§! in §Gevery region§!"

 MAR_kospol_KGB: "Creation of the KGB"
 MAR_kospol_KGB_desc: "The terrorist attack that took place on the day of the Vyatkinsky Congress could have been prevented at its inception if our special services had functioned more effectively. They could have suppressed all activities of the 'Prestol' organization and also prevented any activities of foreign agents on our territory if they were far more efficient and stronger.\n\nThe old special services are hopelessly outdated, as they are based, at best, on the experience of the Tsarist Okhranka and Bukharin’s NKVD, which failed to prevent revolutions or the infiltration of foreign agents into our country in the distant past. We must create our own unique special service, capable not only of surpassing the old ones but also of rivaling the world’s leading intelligence agencies, such as the CIA, Abwehr, and others."

 MAR_Kosygin.60.t:0 "Committee for State Security"
 MAR_Kosygin.60.d:0 "Vladimir Gil was walking toward the office of Nikolai Alexeevich Dushin, one of the best counterintelligence officers in Western Russia. He is part of the operatives of the special service responsible for protecting the internal interests of the Western Russian People’s Principality. However, no matter how experienced an operative he may be, if the leadership undergoes unclear reshuffles, his experience becomes less useful as efficiency drops.\n\nAs Vladimir Gil walked to Dushin, he repeated to himself: 'If it weren’t for the weakness of the special service, there wouldn’t have been a massacre in Vyatka.' He was partly right—this could have been prevented if the security services had detected the threat in time and acted to suppress it. But it happened as it did—now they had to deal with the consequences. Vladimir Gil was dissatisfied with how the special service operated and was determined to address this issue seriously.\n\nEntering Nikolai’s office, Vladimir began speaking almost immediately:\n\n- I want to share some very good news, directly from the Tsar.\n\n- What news? - asked Dushin, looking up from his work.\n\n- The old special service is no more, along with the others—we are creating the Committee for State Security. All special services will be integrated into this new committee, which you will personally lead.\n\n- This is a great honor for me... - said Dushin in response, not yet fully grasping the immense responsibility he’d been given. - When do I start?\n\n- You can begin right now. From now on, you will report to me on the KGB’s activities, and I hope you will work tirelessly to improve its performance. You may start.\n\n- Yes, sir, it will be done."
 MAR_Kosygin.60.a:0 "An army of sheep led by a lion is stronger than an army of lions led by a sheep."
 MAR_Kosygin_KGB_agency:0 "Committee for State Security"

 MAR_kospol_army_streets: "Army on the Streets"
 MAR_kospol_army_streets_desc: "The terrorists from 'Prestol' pose an extremely serious threat to us all, which must be fought. To combat this menace, we must deploy not only special services but also a full-fledged army. As we learned from the recent terrorist attack in Vyatka, they are quite capable of fielding combat-ready bandit formations that can seize an entire city and terrorize it for their purposes.\n\nThe army deployed in the cities will repel numerous terrorist attacks and contribute to the overall stability of populated areas. Anyone who goes out during curfew will, at best, end up in a police station, and anyone suspected of ties to 'Prestol' will face interrogation."

 MAR_Kosygin.61.t:0 "Keeping a Hand on the Pulse"
 MAR_Kosygin.61.d:0 "Tatyana Karachaeva was walking down the street with her brother Nikolai, who was five years older than her. Tatyana could have gone to the store alone if not for the recent surge in street banditry, and to protect his sister, Nikolai was always by her side. The fear of being robbed—or worse, becoming a victim of a 'Prestol' terrorist attack—was strong, and the only way to feel somewhat safe was to travel in pairs.\n\nHowever, the situation had changed somewhat. When the two went to the store for groceries again, they noticed new posters stating, in dry language, that martial law was being introduced in the city. A curfew was now in effect, prohibiting anyone without special documents from being on the streets after 6:00 PM local time, and many penalties for various violations were being tightened.\n\nWhat stood out most was the appearance of new people—stern soldiers with rifles at the ready. They stood near stores, warehouses, factories, administrative buildings, and other important government sites for reasons unclear to the public. People avoided looking directly at these soldiers—the fear of real authority was strong, yet there was also a sense of a firm hand. Now, there was no looming threat of crime in broad daylight, as these soldiers were obliged to protect people from danger. Still, it was unusual to see these tin soldiers performing their stern but critically important work.\n\nReturning home, Nikolai and Tatyana looked out the window at these soldiers in the evening when one of them pointed at two people walking in an unclear direction. Judging by his gesture, he told the two strangers to stop. They stopped, were told something, and turned back, likely toward home. But what happens to those who dare resist them? Or worse, what if someone turns out to be a 'Prestolnik'? Somewhere in the distance, toward the factories, they heard pops painfully reminiscent of firecrackers, but given the circumstances, it was likely not firecrackers."
 MAR_Kosygin.61.a:0 "Only we can show who’s in charge here."

 MAR_kospol_who_are_against_us: "Those Not With Us Are Beneath Us..."
 MAR_kospol_who_are_against_us_desc: "The difficult times that have suddenly swept over our country demand decisive countermeasures. Be that as it may, freedom is also our enemy, as it aids our adversaries. 'Prestol' exploits this weakness to deal crushing blows to our state authority. To eliminate these significant flaws, our state must curtail some of the people’s freedoms.\n\nThis is done not so much against 'Prestol' as for the protection of our citizens. When choosing between bread and freedom, the people will choose bread, so they won’t strongly oppose these measures. Those who criticize our actions will get what they deserve..."

 MAR_Kosygin.62.t:0 "Unheard-of Audacity"
 MAR_Kosygin.62.d:0 "Citizens gathered around a poster announcing a ban on gatherings of more than 20 people in one place. Ironically, these citizens wanted to read the poster, so they crowded around it. More than 30 people, perhaps 30-40, came and went around the poster. Nearby, discussions of this law took place, and despite the law, people gathered in large groups to 'taunt' the authorities.\n\nHowever, as soon as the first police officers appeared, a squad of them began dispersing such crowds, and through loudspeakers, they asked the crowd to disperse. Some complied, but most refused to leave, and those people were taken to police stations for subsequent questioning.\n\nThe first few times, the police simply released such people, explaining that next time it wouldn’t be so lenient. However, if new crowds of people appeared, the arrests would be far harsher than they were today..."
 MAR_Kosygin.62.a:0 "Freedom dies, order is born."

 MAR_kospol_motherland_and_tsar: "Union for the Defense of the Motherland and the Tsar"
 MAR_kospol_motherland_and_tsar_desc: "Since our legitimate government began fighting the terrorists from 'Prestol,' the burden on our police has increased manifold. Not only have terrorist attacks risen, but so have ordinary petty robberies, fueled by the general chaos in our country. This all deals significant damage to our already fragile stability.\n\nTo assist our police, we must literally mobilize the entire population for this cause, creating people’s militias that will maintain order on the streets alongside the police, help reduce the number of robberies, and partially aid in the fight against 'Prestol.'"

 MAR_Kosygin.59.t:0 "Operation 'Y'"
 MAR_Kosygin.59.d:0 "Three robbers were planning a heist of a local warehouse filled with various items, which, by all accounts, contained many interesting things—alcohol, decorative swords, musical instruments, and more. The value of this warehouse for the three was that they could take all the state-owned wine and sell it, earning money to spend on something else. They agreed that each would get at least 330 rubles from selling all the alcohol.\n\nArriving at the meeting point late at night, the three robbers discussed their entire plan of action, and one of them even came up with a name for the venture—Operation 'Y.' When asked why 'Operation Y,' he replied that it was to ensure no one would figure out the true plan. Indeed, the plan was so good that it couldn’t be allowed for anyone to learn about it or understand its essence, providing a safeguard against ending up in prison.\n\nApproaching the warehouse, one of the robbers pried open the door with a crowbar, and they entered. The three began dismantling the warehouse piece by piece—first, they carried out the state-owned wine, of which there was plenty and of various types. They loaded it into a special vehicle they had brought for the occasion. But suddenly, they saw an entire squad of people’s militiamen starting their night shift approaching from the street. They immediately noticed what was happening at the warehouse and quickly ran toward it, while the robbers tried to make their escape. But it was no use—they were surrounded on all sides, and the militiamen apprehended them all.\n\nThe robbers were quickly taken to the local police station and detained pending clarification of all the details of the robbery."
 MAR_Kosygin.59.a:0 "Plunderers of public property!"

 MAR_kospol_security_comeete: "State Committee for the State of Emergency"
 MAR_kospol_security_comeete_desc: "Despite the presence of legitimate authority, our situation is extremely precarious, and moreover, the entire power structure has been battered. We no longer have a prime minister to advise the Tsar. The Mladorossi party has lost significant quality personnel, and if we need to strengthen our positions, we must convene a State Committee for the State of Emergency, which will structure the entire power hierarchy in Western Russia.\n\nOnce we achieve this, it will immediately reduce certain governance issues and significantly strengthen the connection between us and the country as a whole."

 MAR_Kosygin.63.t:0 "Personnel Reshuffle"
 MAR_Kosygin.63.d:0 "Vladimir Gil was walking toward the office of Alexei Kosygin-Romanov. Important negotiations among the key ministers who survived the Vyatka terrorist attack were scheduled for today, and the main issue to be resolved at this meeting was the creation of an emergency governing body to handle all critical decisions within the country until the situation in Western Russia stabilizes.\n\nEntering the office, Vladimir found that all the key state figures had already gathered and were waiting for him to take his seat. As soon as Gil sat at the table, Alexei Kosygin-Romanov began speaking:\n\n- Dear comrades, we are in an extremely difficult situation. While we fight 'Prestol,' our authority is in a severe crisis—we don’t even have a prime minister because Kazem-Bek perished in that assassination attempt. Therefore, I have decided on some reshuffles. First and foremost—Vladimir Gil will now take the post of prime minister and lead the Mladorossi party, while I appoint Anatoly Vavilov as the new Minister of Defense of our country.\n\n- My Tsar, this is a great honor for me, - said Vladimir Gil. - When do I transfer my duties to Vavilov?\n\n- You can do it right now, but for now, I ask you all to review the full list of the new composition of our government."
 MAR_Kosygin.63.a:0 "Freedom dies, order is born."

 MAR_kospol_universal_good: "A New Dawn"
 MAR_kospol_universal_good_desc: "We have resolved many problems caused by the terrorist attack at the Vyatkinsky Congress. The power structure has been restored and is now ready to expand the administrative apparatus. We have created the KGB, which will be more effective than Russia’s old special services, and thanks to it, we will be able to protect our country from foreign influence and internal harmful elements. By introducing martial law, we have strengthened stability in our country’s territory, and by curtailing some rights and freedoms of citizens, we have safeguarded the population.\n\nFinally, our state will awaken to a new day with hope for a better future. At least, as much as we can afford. However, while resolving new issues, we still face old problems that we didn’t manage to address at that congress. We will need to start implementing political reforms that will eliminate administrative burdens all at once and develop our strategy for the future."

 MAR_kospol_nation_of_soviets: "A Nation of Soviets"
 MAR_kospol_nation_of_soviets_desc: "The Soviet system used in Bukharin’s Soviet Union could be quite effective in the right hands. Our action program states that we must create a symbiosis of Tsarist and Soviet Russian authority, adopting the best from both. The time has come to revive the Soviet system.\n\nSince we lost one of the main ideological inspirers of the Mladorossi—Kazem-Bek—it’s likely we won’t be able to create the true vision of the Soviets as our party’s founder envisioned. Therefore, we must recreate the Soviet system of local self-governance, eliminate its past shortcomings, and place Mladorossi in it."

 MAR_kospol_Soviet_Empire: "Soviet Empire"
 MAR_kospol_Soviet_Empire_desc: "Any empire is a means of uniting disparate peoples into a single state, and we are no exception here. Our country is home to many minority peoples who, together, form the unified picture of Russia. To tear them away from our country would mean discarding the wealth our Motherland possesses—the people inhabiting our state.\n\nOur Western Russian People’s Principality is, in a way, an 'empire.' Some already call us not just an empire but a Soviet one, and let them continue to call us that, because we will not persecute national minorities. They are part of our culture, and by recognizing these minorities as equals, we will only enrich and strengthen Russian culture."

 MAR_Kosygin.64.t:0 "Hiring Process"
 MAR_Kosygin.64.d:0 "An unemployed man wanted to find a job. He was a skilled mathematician who could handle money well, so he planned to work primarily at a state bank. In his opinion, the work there wasn’t as difficult as, say, being an accountant or a loader. Moreover, the job was profitable, so he decided to apply there.\n\nThe day of the hiring committee arrived. At the meeting with the employer, he presented himself very well. A diligent intellectual who also excels at mathematics and understands the essence of banking. It seemed all the chances of getting the job were already in his pocket. But then the employer asked a question:\n\n- What is your nationality?\n\n- Jewish, - he replied, less confidently than before.\n\nThe employer, after this question, paused to think. He muttered a lot, and it seemed to our hero that this might be the only reason he wouldn’t get the job. Jews, generally speaking, were only loved and respected in Bukharin’s USSR, but that time had long passed.\n\nFinally, after half a minute of waiting, the employer said:\n\n- Alright. You’re hired. Your workplace is waiting for you. When can you start?\n\n- Right now.\n\n- You may go."
 MAR_Kosygin.64.a:0 "Overcoming prejudices"

 MAR_kospol_nex_siezd: "New Congress"
 MAR_kospol_nex_siezd_desc: "Having taken the first steps toward resolving old problems, we have managed to create a stable foundation for further governance of the country. The time has come to consolidate our Party’s successes and develop a strategy for the future, which will determine the main direction of development for foreign policy relations, the economic component, military reforms, and everything else.\n\nThis congress, unlike the Vyatkinsky Congress, will be far better prepared, with significantly increased security for the premises and cities as a whole, and we must demonstrate to our entire country the appearance of stability and firm confidence in future successes."

 MAR_Kosygin.65.t:0 "Seeing the Work Through to the End"
 MAR_Kosygin.65.d:0 "The first Mladorossi Congress in Vyatka was marred by a terrorist attack by 'Prestol,' where some of our country’s most important figures—Kazem-Bek and Belozersky—perished. At that congress, we were supposed to address the future structure of our country, but it was disrupted almost before it could begin. However, it was obvious that a new congress would take place sooner or later.\n\nIn the capital’s Mladorossi Congress building, all possible preparations were made to prevent a repeat of the bloody day’s events. The KGB checked every corner, every person, and every item for potential threats—no dangers were found. Now the congress can definitely begin.\n\nVladimir Gil, the prime minister and head of the Mladorossi party, opened the session with his speech:\n\n- Dear friends, comrades, and colleagues. Today, we must begin the long-awaited congress of the party and the Soviets. Today, we must start working on developing a strategy for the future. We must create a plan for economic development, a plan for developing foreign policy relations, a general strategy for domestic policy, and a plan for developing the military potential of the Western Russian People’s Principality.\n\nHowever, before we begin this session, we must honor our fallen friends, acquaintances, and the first leader of our Party and country—Alexander Kazem-Bek, and his loyal right hand—Sergei Belozersky. I ask you to stand for a moment of silence, after which I will give the floor to our Tsar, Alexei II Romanov.\n\nAfter these words, the entire hall stood under the sound of a metronome, set to tick rhythmically once per second, to honor all those who died in the Vyatka terrorist attack. The party members stood for a full minute, some with somber faces, having witnessed those events. As soon as the time ended, everyone sat down.\n\nAlexei Kosygin-Romanov approached the podium and began his part of the speech:\n\n- Dear comrades. Their sacrifice will always remain in our memory, and the bitterness of loss will always be in our hearts. Kazem-Bek and Belozersky were true patriots of our country, but they didn’t have time to realize all their plans. We will deeply miss them, and we will always remember the day of their death. But their sacrifice, like that of thousands of Russian people, was not in vain. We will not allow the Mladorossi cause to perish after so many hardships and trials we’ve gone through and will face later. We will move forward with our heads held high toward a bright Mladorossi future, and we will definitely reach it.\n\nBut now, the time has come to complete the work they started. Good luck to you, comrades, in your work and efforts, and may success always accompany you!"
 MAR_Kosygin.65.a:0 "Always remember death."
 
 ###экономика
 
 MAR_koseco_new_gosplan:0 "Return of GOSPLAN"
 MAR_koseco_new_gosplan_desc:0 "Kosygin-Romanov believes that to revive our country’s economy as quickly as possible, we must create an economic management structure practically from scratch. The first step in this structural evolution of the economy should be the return of GOSPLAN, which will serve as the foundation for our entire future economy that we aim to reconstruct.\n\nState planning, which will underpin the entire economy, must take control of most of our country’s industry and then implement our main initiatives. Only manual allocation of our very limited resources will allow us, for the time being, to develop the economy far more efficiently than a market-based system would."

 MAR_Kosygin.15.t:0 "Planning the State Planning"
 MAR_Kosygin.15.d:0 "Alexei Kosygin-Romanov was an excellent economist and mathematician. Undoubtedly, if he were not the Tsar by the will of God, under, say, Kazem-Bek or Belozersky, he would have been the Minister of Economy. People like him are highly competent in such matters, capable of performing miracles with the economy, pulling the country out of chaos and ruin, and surpassing other nations, leaving them in the dust.\n\nKosygin-Romanov’s plan was quite simple: it is necessary to create a mixed economy, combining the best qualities of state planning and market self-regulation. Only this combination, in the Tsar’s opinion, will be the most effective. Most importantly, it meets the population’s basic needs—a key to the success of any economic system.\n\nThere is, of course, one problem—Kosygin, though a Tsar, is not omnipotent. He cannot oversee all the processes occurring in the state simultaneously. He must also work in other areas, while his main passion—economics—requires a constant overseer to keep a hand on the pulse. There is only one solution: appoint a trusted individual. Only someone who reports directly to the Tsar and is nearly as competent is needed. Therefore, before signing the decree to establish the state planning body, he appointed Nikolai Ivanovich Maslennikov to lead it."
 MAR_Kosygin.15.a:0 "Approve GOSPLAN, appoint N.I. Maslennikov as Minister of Economy"

 MAR_koseco_red_capitalism:0 "Socialist Capitalism"
 MAR_koseco_red_capitalism_desc:0 "The foundation of our new economy has been laid, and now it is time to build upon it, starting with the framework of our economy—a fusion of market and command-administrative systems. Our economy must be balanced between planned and market economies, and this is what will distinguish our socialism from all others.\n\nThis combination allows us to call our Mladorossi socialism a socialism with Russian specifics. We may immediately be labeled as communists, but we are not—we are merely Mladorossi who have chosen this path. Our Mladorossi socialism will incorporate capitalist elements, which will only make it stronger."

 MAR_Kosygin.16.t:0 "Our Mladorossi Socialism"
 MAR_Kosygin.16.d:0 "Alexei II Romanov, reflecting on the economic policy of the Western Russian People’s Principality, constantly arrived at the same thought: our socialism must be Russian, and it is made Russian only by involving the spirit of the people in the economy. Moreover, this socialism must be flexible in all its aspects—so that public demand can be met through the supply from private individuals. In theory, it’s quite simple.\n\nBut what if such socialism becomes soulless, as it was under Bukharin? Recalling the relatively recent past, he understood that he could make the same mistake Bukharin did—failing to unite the Russian people and their spirit to fight the enemy and not preparing the country to resist the Nazis. And what is the Russian national spirit?\n\nThe Russian national spirit is the collective, communal spirit of the entire people. The Russian people are not a nation of individualists; they are a collective people. The Orthodox Russian people have repeatedly shown miracles of self-sacrifice, even in the lost Great Patriotic War, for the lives of others and for those who had already perished. It is through sacrifice and the desire to sacrifice for others that we have triumphed in many wars, such as the Patriotic War of 1812 and hundreds of others like it.\n\nThe Russian people do not like it when a minority rules over the majority. Our people have always supported the majority governing the rest, but what constitutes the ‘majority’ in this context? It is the collectives of people, and thus, in Russian culture, it is customary to yield personal interests for the sake of society and the collective. This is where the drive for collectivism manifests.\n\nHow do we create an economy that combines socialism, capitalism, and the Russian national spirit? We will not follow any Marxist dogmas or Adam Smith’s laws. We will follow our own, Russian path."
 MAR_Kosygin.16.a:0 "Could Mladorossi socialism be the ideology for all Russians?"

 MAR_koseco_national_sector:0 "State Sector"
 MAR_koseco_national_sector_desc:0 "The jobs so vital to our country can be created by both private individuals and the state. However, while private individuals may deliberately cut jobs or fire people without cause, the state sector is free from these sins of capitalism. If we further develop this sector, we can provide people with the critically needed jobs with guarantees that they will always have work in this sector. The working class will no longer have the Damocles’ sword of poverty hanging over them.\n\nThis will undoubtedly be costly, as we will build it solely from our budget. But who else will finance state factories? That’s why we must do it ourselves."

 MAR_koseco_rebuild_infr:0 "Infrastructure Restoration"
 MAR_koseco_rebuild_infr_desc:0 "Roads, schools, hospitals—everything that can be considered infrastructure—was destroyed during the Nazi bombings. We still haven’t restored what was built, at least by Bukharin during the USSR, and we haven’t done so only because we haven’t paid attention to this issue. By addressing it, we must start solving this problem, as the well-being of individual regions directly depends on it.\n\nIt has been statistically proven that a region develops faster with just one road, not to mention everything else. If we want to accelerate economic growth in our country, this measure is vital."

 MAR_koseco_foreign_specs:0 "Foreign Specialists"
 MAR_koseco_foreign_specs_desc:0 "If we want to develop our economy, we need skilled specialists who know the intricacies of their profession. However, despite many efforts, our country still has very few professional specialists, and most importantly, few modern specialists who can work on modern machines in factories or use new work methods. Most of our specialists are graduates of schools from Bukharin’s Soviet Union, where even back then we lagged behind modernity.\n\nThe only way out is to learn from our colleagues in other countries—primarily Sweden and the USA, the most advanced in this regard. We must invite them to our Motherland, and for a decent salary, they will train our specialists, enabling us to catch up with the world."

 MAR_Kosygin.17.t:0 "Colleagues in the Trade"
 MAR_Kosygin.17.d:0 "Two new people arrived at the factory, ones no one had seen before. One of them clearly stood out with his appearance—he was well-dressed, with a well-groomed face. His gait and gestures were distinctly non-Russian. The second one resembled a Russian more closely.\n\nIt was later revealed at a meeting that this new person was a foreign specialist from the USA. The translator conveyed everything he said:\n\n- Hello, colleagues, my name is Adam Nixon, I’ve come from the United States of America, and I will be your instructor for the next four years until you learn new methods of working with machines and instruments.\n\nThe Russian workers noticed his unusual, non-Russian mannerisms: leaning on his left leg, a wide smile showing his teeth, and other behaviors—gestures, walking, and so on. For a Russian, much of what this American did was clearly atypical, as Russians smile much less and, when they do, typically don’t show their teeth. Many workers saw a certain falseness, an artificiality in his smile. But no one dared say anything against him, as this respected specialist could teach them something valuable."
 MAR_Kosygin.17.a:0 "We are different in some ways, after all."

 MAR_koseco_double_factories:0 "Dual-Purpose Factories"
 MAR_koseco_double_factories_desc:0 "Our factories must be versatile and always ready to switch to producing military goods. At any moment, factories making pasta, matches, and pots must start producing rifles, bullets, and helmets, which are so necessary for our country in times of war.\n\nBukharin’s USSR was unprepared for the war imposed by Germany, but it could have had a chance to resist if its factories were adapted for immediate production of military goods. To avoid repeating past mistakes, we must prepare plans everywhere to convert factories to military needs."

 MAR_Kosygin.18.t:0 "New Order"
 MAR_Kosygin.18.d:0 "The factory manager was overseeing his workers at the pasta factory, observing the production of various types of pasta—spirals, tubes, long strands. In Western Russia, it was now possible to produce this affordable food, popular among pasta lovers or those who couldn’t afford more. The pasta was in high demand.\n\nWhen he returned to his office to continue his paperwork, he received what seemed like an ordinary letter. Opening it, he saw the heading ‘ORDER IN CASE OF…’ and continued reading. The order stated that in the event of war, this factory would need to reorient toward producing cartridges and any other military goods feasible at this facility.\n\nThe manager wasn’t shocked but was quite surprised by the order. The only question on his mind was how he would reorient a pasta factory to produce cartridges. As it turned out, further instructions and references to additional documents were provided. He now needed to review them and keep in mind that, in the event of a serious war, this factory would be repurposed for military needs."
 MAR_Kosygin.18.a:0 "If the front needs it, we’ll do it!"

 MAR_koseco_Glushkov_project:0 "Glushkov’s Project"
 MAR_koseco_Glushkov_project_desc:0 "Despite the undeniable advantages of the planned component of our economy, it also has numerous drawbacks that could become especially pronounced in the future as the scale of economic interactions grows exponentially. Primarily, we are talking about bureaucratic red tape, which will inevitably arise.\n\nBureaucratic red tape will emerge because, as the economy grows, so does the paperwork. This work will inevitably lead to a bottleneck in our economy, preventing it from responding to the challenges of the times.\n\nThere is an interesting project from scientists in the emerging field of cybernetics regarding this issue—a project proposed by Glushkov and Kitov. We must listen to their proposals regarding this project."
 MAR_tt_ogas_mech:0 "Access to the decision category for developing OGAS will be unlocked"

 MAR_Kosygin.19.t:0 "Nationwide Automated System"
 MAR_Kosygin.19.d:0 "Maslennikov and Tsar Kosygin-Romanov listened attentively to the presentation by two cyberneticists, Glushkov and Kitov, about their new project. What they presented was called by a very long name but abbreviated simply: OGAS.\n\nPresenting their project concisely, Glushkov and Kitov tried to capture as much interest as possible from the most influential figures in the Western Russian People’s Principality. Glushkov explained the basic principle of the system’s operation, what would be connected, what would be transmitted, and so on. Kitov outlined the effects of investing significant funds and efforts into implementing this project.\n\nBy the end of the presentation, Maslennikov and Kosygin-Romanov looked at the project with clear astonishment. Most importantly, this project is highly promising for the future—it could solve the issue of bureaucratic red tape at its inception, while immediately providing a strong boost to scientific development and administrative efficiency, which is highly desirable now.\n\n- How expensive will this entire project be? - asked Maslennikov.\n\n- It depends primarily on the scale of development and implementation of OGAS into the economy, - replied Kitov.\n\n- At the moment, - clarified Glushkov, - we haven’t calculated the project in depth. Right now, we’re only dealing with the tip of the iceberg, and if you allow us, we will continue developing the project. But we will need significant investments in any case.\n\n- In my humble opinion, - began Kosygin-Romanov, - if we invest now, this project will greatly help us in the future. The money we could invest in OGAS will easily pay off. Comrade Maslennikov, I believe we should pay attention to this project and start funding it.\n\n- I think you’re right. As soon as we have the funds, we’ll start pouring them into the project."
 MAR_Kosygin.19.a:0 "We’ll leave even the Germans behind!"

 MAR_koseco_privats:0 "Private Entrepreneurs"
 MAR_koseco_privats_desc:0 "The second component of our economy should be a market system within the framework of a socialist economy. Private individuals, as practice sometimes shows, are more progressive and efficient compared to state enterprises. They can quickly adapt to market demands and meet public needs. Moreover, by allowing private individuals, we can create jobs without state expenditure.\n\nHowever, unlike the state, they are susceptible to various crises. This is important to keep in mind, and if necessary, our state will need to intervene in private business affairs."

 MAR_koseco_support_kulaks:0 "Kulak - Friend of the State"
 MAR_koseco_support_kulaks_desc:0 "In the Russian Empire, after the Stolypin reforms, a whole layer of peasantry—kulaks—quickly surged ahead in the countryside. Kulaks, who own large amounts of livestock and land, and consequently significant wealth, are one of the main private actors in the countryside, and after the abolition of landlord titles, they are the sole monopolists of land.\n\nIn this context, kulaks must become the main driver of private development in the countryside. Once they revive, they will ultimately drive significant development in agriculture and the economy as a whole. Therefore, we must promote their development by investing in a social program to support the peasantry, and only the most worthy will rise to the top."

 MAR_Kosygin.20.t:0 "Sam-3, Sam-4"
 MAR_Kosygin.20.d:0 "Peasant Ivan was riding his cart to a social assistance point in the city. He learned from a newspaper that every peasant now has the opportunity to receive a social subsidy to cover the costs of sowing and growing various crops. In his opinion, if he could get money this way, he should take it and use it as intended, especially since his harvest this time wasn’t as good as he’d hoped.\n\nThe term ‘Sam-3’ means that from one bucket of sown grain, Ivan got three buckets, which generally means he can survive and plant another field. But to grow economically, he needs ‘Sam-4,’ meaning four buckets of grain from one sown bucket. In that case, he could sell the surplus on the external market and profit. However, in this case, Ivan couldn’t achieve ‘Sam-4,’ only ‘Sam-3,’ so he needed to cover the costs of sowing his new crop. For this purpose, he rode to the city on horseback.\n\nArriving at the designated money distribution point, he provided all the necessary information to receive the funds and specified the size of his field. Based on these calculations, he was given exactly enough money to cover his sowing expenses. Now he had extra money to spend on something else besides fertilizers and seeds. If this continues, he might even save up for a tractor."
 MAR_Kosygin.20.a:0 "Life gets easier when money appears."

 MAR_koseco_jap_partners:0 "Japanese Partners"
 MAR_koseco_jap_partners_desc:0 "Trade with other countries is as necessary for our economy as it is for any other country. We cannot rely solely on our own resources to develop our country, so we must interact with other nations, primarily those with a good reputation and attractive offers.\n\nRussia’s economy faces many issues with industrial equipment—cranes, excavators, bulldozers, and so on. Additionally, basic consumer goods like tape recorders, televisions, radios, and more are lacking. Currently, the Japanese dominate in this regard, holding a technological advantage over the rest of the world. Therefore, we must first turn to them for the items we need.\n\nOf course, we won’t get these for free: to receive something, we must give something in return—and we will offer them resources, which they will gladly accept."

 MAR_Kosygin.21.t:0 "Industrial Robots"
 MAR_Kosygin.21.d:0 "An unusual convoy of trucks with large containers arrived at the automobile factory. The containers were marked with various hieroglyphs, rarely seen here. They appeared to be Japanese or Chinese—hard to tell. The workers watching speculated about what could be inside.\n\nThe most curious among them suggested it might be new industrial equipment. But no one could say for sure until the container was opened. Inside were mechanisms that, if compared to anything, resembled claws most closely. These robotic claws had several types of attachments—suction cups, welding devices, grippers, and manipulators. They sparked significant interest among the factory workers.\n\nAfter installing the robots, the workers continued their tasks as if nothing had changed, but they activated the robots to see how much production efficiency would increase. The result was immediate: by the end of the day, the factory produced five more cars than the usual quota."
 MAR_Kosygin.21.a:0 "New technologies—new opportunities!"

 MAR_koseco_usa_friends:0 "American Friends"
 MAR_koseco_usa_friends_desc:0 "The United States of America is currently the wealthiest country in the world. Due to the strength of their capitalist system, a huge portion of global economic ties revolves around them, resulting in an enormous GDP. Their economy is a vivid example of the variety of goods available to consumers, creating the wealth and diversity found in the USA.\n\nThe USA, it must be admitted, is not the most advanced in some technological aspects, but it is a solid leader in many metrics, making it one of the best trading partners imaginable. We could purchase consumer goods from them that our population needs to improve their well-being: tea, coffee, chocolate, and other exotic foods."

 MAR_Kosygin.22.t:0 "Foreign Treat"
 MAR_Kosygin.22.d:0 "Petya, an eight-year-old boy, was doing his homework after school. Despite not facing as many hardships as his parents, he wasn’t a spoiled child. On the contrary, he was hardworking and diligent, eager to learn sciences. Although he had read in textbooks about unimaginable delicacies, he had never seen them himself and wanted to try them when he grew older.\n\nBut generosity came unexpectedly. His father came home from work and brought groceries from the store. His mother took the bag of food to the kitchen, while his father pulled an unfamiliar tile from his pocket with equally unfamiliar letters for the boy. He could recognize some letters but couldn’t form a coherent word that meant anything to him. ‘Cadbury Dairy Milk’—the word was utterly foreign to him.\n\n- Petya, this is a chocolate bar.\n- Wow, really? - the boy exclaimed, his eyes darting over the tile.\n- Yes, remember reading about it in a book?\n- Yes, I remember!\n- Open it, try the chocolate.\n\nPetya began opening the chocolate bar, careful not to break or damage it. Holding his breath, he saw five rows of three small squares and broke off one to put in his mouth. The delicate milk chocolate melted instantly, and he was truly happy with the treat. Petya wanted to eat more but feared finishing it all, so he closed the wrapper to save it, perhaps for a long time.\n\n- Papa, the chocolate is sweet!\n- If you want more, just tell me, I’ll buy it."
 MAR_Kosygin.22.a:0 "Joy is the best gift we can give children."

 MAR_koseco_Technospy:0 "Technological Espionage"
 MAR_koseco_Technospy_desc:0 "Our country is hopelessly behind the rest of the world. Decades of lagging in modern technologies, years of war, and years of ruin and chaos have led to our science and education system either degrading or, at the very least, falling behind current trends. While the world possesses nuclear technologies and launches people into space, we are only beginning to master industrial equipment, much of which is already outdated or will soon become so.\n\nAll the measures we can take may simply not be enough, so we must attempt technological espionage to acquire technologies and scientific advancements from other countries. The most interesting target for us is the USA, and we will send our KGB agents there to study the technologies available and infiltrate their scientific centers."

 MAR_koseco_faster_than_future:0 "Outpacing the Future"
 MAR_koseco_faster_than_future_desc:0 "The main foundation of our future economy for decades to come has been established. Our system has managed to combine the core ideas of capitalism and socialism, the principles of planned and market economies, but one of the most important conditions it retains is the backbone of our state—the spirit of the Russian people. Our socialism with Russian specifics may be criticized by anyone—we are neither communists nor monarchists—we are Mladorossi, and we have created the true Russian spirit manifested in our economy.\n\nThe time has come to step into the future. We have carved a window into the future of our prosperity, and soon the people will be provided with everything necessary. Even the successes we clearly have will become even greater in the future."

 MAR_Kosygin.24.t:0 "Maslennikov’s Report"
 MAR_Kosygin.24.d:0 "Maslennikov, the Minister of Economy, was presenting reports on the results of the first economic and scientific reforms directly to Alexei Romanov. Presenting not only the report but also various charts, Maslennikov tried to explain everything in minute detail but in a way that avoided getting lost in the maze of dozens of figures, graphs, and percentages. Overall, Maslennikov’s report was very positive—it felt as though he wasn’t preparing for a report but for a thesis defense. This was also evident in how Maslennikov was dressed—his suit was even stricter than usual, reflecting his discipline.\n\nSeparate points included the development of the OGAS project, social programs to support various population groups, overall industrial development, statistics on the growing qualifications of workers, and more, which could go on for quite a while. The overall GDP growth indicators pleased Romanov—such economic growth rates hadn’t been seen, if memory serves, since the days of the Russian Empire and the early years of Bukharin’s Soviet rule.\n\nEven after highlighting the main positive points, Maslennikov was careful not to let Romanov get carried away with success, emphasizing that there were also negative aspects in the economy that needed resolution. However, Romanov had no intention of getting ‘dizzy with success’—he was a staunch realist, looking only at bare facts and what the statistics showed, which was objective reality.\n\nAt the end of the report, Maslennikov noted that there were still some systemic issues in the economy of the Western Russian People’s Principality, but they were generally fixable. It was only a matter of adjusting its development path and awaiting further results of the Mladorossi’s activities. Alexei Romanov applauded Maslennikov for the report and said he would reward him with a bonus for such complex work."
 MAR_Kosygin.24.a:0 "The Motherland is proud of you! Alexei II Romanov awards you a bonus!"

 MAR_koseco_DCP:0 "Development of Computers"
 MAR_koseco_DCP_desc:0 "The primary tool of the future will be electronic computing machines. Since their inception, they have been actively integrated into people’s lives and science, leading to rapid growth in all societal sectors. It is now clear that the absence of such machines threatens any state with complete backwardness compared to those that possess them.\n\nObviously, we need these machines, and we must start developing our own to avoid dependence on foreign supplies. This concerns not only economic independence but also our country’s global prestige."

 MAR_koseco_future_technologies:0 "Technologies of the Future"
 MAR_koseco_future_technologies_desc:0 "Despite our current technological level, our country still has opportunities to develop technologies in areas where other countries have not succeeded or have stalled. Where they stopped, we will make breakthroughs; where they failed, we will likely succeed; where we can, we will move forward, striving to catch up and surpass existing nations.\n\nWe must grant freedom of thought in the scientific sphere, allowing scientists to fully realize their potential. They will implement their projects, and thus, we can catch up with the world’s leading nations. Of course, with a certain degree of ethics..."

 MAR_koseco_Best_education:0 "The Best Education"
 MAR_koseco_Best_education_desc:0 "Our state has become strong and stable enough to implement more serious reforms in the socio-spiritual sphere. The time has come to introduce free mandatory school education for all children to raise the population’s literacy to unprecedented heights. Long ago, in Bukharin’s USSR, free education was a reality, and although everyone could access it, during Russia’s collapse, this concept fell out of sight because educating children became too costly.\n\nNow that we have the means and opportunities to develop education in our country, we must introduce mandatory education for all children, and every parent must send their children to school to acquire basic knowledge about the world. Only this way can we create the foundation for our state’s further prosperity."

 MAR_Kosygin.23.t:0 "First Day at School"
 MAR_Kosygin.23.d:0 "Parents were preparing their child for his first day of school. They picked out clothes meeting the requirements set at the parent meeting, having to travel across half the city to find them. Besides clothing, they needed to buy stationery—pens, pencils, notebooks, a backpack, and a pencil case... everything a schoolchild needs. Special attention was given to the flowers they had to buy for the child’s first homeroom teacher. They chose the most lavish flowers, ones a father might give his wife. They didn’t know the teacher’s preferences, so they picked based on their taste.\n\nTo say this process was exhausting for a seven-year-old boy is an understatement, especially since he didn’t sleep enough that morning. Finally, the boy returned home with his parents, who had bought everything needed. It was time to pack his first backpack for his first day at school. Textbooks would be provided later at school, but for now, he needed to pack his first notebooks and pencil case with everything necessary.\n\nAfter packing, evening came, followed by night. Soon, it would be his first trip to school, his first assembly, and the start of a new chapter in his life..."
 MAR_Kosygin.23.a:0 "Learning to write different letters with a fine pen in a notebook at school..."

 MAR_kosmil_to_protect_motherland:0 "To Defend the Motherland!"
 MAR_kosmil_to_protect_motherland_desc:0 "Bukharin’s Soviet Union was weak, not only because its economy couldn’t withstand the pressure of German tanks but also because our army was extremely weak in many aspects—soldier training, equipment, command planning, and many other areas. If our country had a strong army, we could have avoided the catastrophe of the summer and winter of 1941.\n\nThe situation hasn’t changed much now. The Motherland can only be united through military strength, an indisputable fact. Russia will not be whole without a strong army, especially now as we actively prepare for further unification of Russia. We need a large and capable army that can crush any enemies in our path."

 MAR_Kosygin.25.t:0 "The Need for Change"
 MAR_Kosygin.25.d:0 "Anatoly Vavilov received an order from the Tsar himself to assess the army’s combat readiness to avoid a repeat of 1941. After a short time, he compiled a relatively clear picture...\n\nThe army’s condition, despite its greater equipment and organization compared to a few months ago, is still unsatisfactory. The army remains stuck at the level of the Battle for Western Russia, led by the late Kazem-Bek—tactical expertise, combat training, and sometimes equipment are largely from those times. The army may be capable of resistance at a regional level, but against, say, Germany, it would not stand a chance.\n\nReporting this to Tsar Romanov, he asked, ‘What do you propose to address these issues?’ Vavilov responded roughly as follows: ‘If we want to increase our army’s combat effectiveness, we need to reform it. I have ideas and plans about what specifically needs to change. If you give me the opportunity to fix them, you’ll end up with a strong army.’\n\nOf course, the army won’t become strong overnight. We must start with small decrees and later move to more serious measures. But overall, his words carried a guarantee that it would be done well. The Tsar agreed with Vavilov’s proposals and gave permission to carry out these reforms."
 MAR_Kosygin.25.a:0 "Russia will be strong only with a strong army."

 MAR_kosmil_reorganise_minwar:0 "Reorganization of the Ministry of War"
 MAR_kosmil_reorganise_minwar_desc:0 "Our military leadership mainly consists of very old, though experienced, officers. Many served in the Soviet Union and now serve in our army. However, what they learned during the Great Patriotic War is now outdated. Moreover, the dominance of old officers prevents younger, promising ones from advancing, which often harms the army overall.\n\nWe must acknowledge that some of these officers need to be retired to make way for young, talented officers. Of course, not all old officers will be retired—only those who showed extremely low effectiveness on the battlefield, while those above average may remain."

 MAR_kosmil_expand_Archangelsk_ports:0 "Expand Arkhangelsk Ports"
 MAR_kosmil_expand_Archangelsk_ports_desc:0 "If we wish to have our own navy, we must first ensure we have a place to store our ships and build new ones. For this purpose, only one port city in our country is suitable, serving for centuries as Russia’s northern gateway—Arkhangelsk. It is the only port city with enormous potential for trade and military construction.\n\nThe most sensible thing we can do with Arkhangelsk is to reactivate many unused ports and build additional docks to allow us to construct ships of specific sizes and purposes. Therefore, Vavilov issued a decree to reactivate and build new ports in Arkhangelsk."

 MAR_kosmil_weapon_modernisation:0 "Weapon Modernization"
 MAR_kosmil_weapon_modernisation_desc:0 "Our weaponry primarily consists of old models from the Battle for Western Russia. While they are certainly good and almost the weapons of victory in Western Russia, we must consider that the enemy likely has more advanced rifles, grenade launchers, and other equipment that could significantly trouble us. Ultimately, our weapons may simply be inferior in terms of rate of fire and reliability, which could play a significant role in the future.\n\nTo proactively avoid such a situation, we need a deep modernization of existing weapon types for subsequent production. We likely won’t be able to create entirely new rifles, so we must improve the old ones that have already proven themselves."

 MAR_kosmil_new_avia:0 "Development of the Aviation Industry"
 MAR_kosmil_new_avia_desc:0 "If we need a strong army, we must ensure the enemy does not gain air superiority over us. Analyzing the experience of the Great Patriotic War, we can confidently state that air forces have become highly significant, creating a strong need to control them. If the enemy gains air superiority, they will bomb our cities and supply lines, weakening our defenses.\n\nOur aviation is not advanced, and that’s a fact. At best, we’re stuck at the level of 1950. Our fighters are still largely piston-driven, while the world has reached supersonic thresholds. We must correct this oversight and catch up with leading nations in military aviation in a very short time."

 MAR_kosmil_new_training_methods:0 "New Training Methods"
 MAR_kosmil_new_training_methods_desc:0 "The training of our soldiers requires a major overhaul, as the level of training remains at the level of the Battle for Western Russia. While the theoretical and physical training was sufficient to oppose pseudo-states, it is now at least inadequate—too weak for fighting more serious adversaries, especially considering that beyond the Urals, other states claim to unite Russia through military means.\n\nWe must surpass them in this regard, and to do so, we need to change everything—the theoretical framework, daily schedules, training intensity, and much more. If we do this, we will immediately strengthen our army without increasing its size."

 MAR_Kosygin.26.t:0 "Tough in Training"
 MAR_Kosygin.26.d:0 "The battalion woke up much earlier than usual, startled by the command ‘Company, rise!’ Everyone was caught off guard, and though they were trained to get up quickly, they had never risen this early.\n\nThe battalion commander gathered them at the parade ground and announced:\n\n- Comrade soldiers! We have received an order from the Ministry of Defense of the Western Russian People’s Principality. Starting today, the daily schedule, physical, and theoretical training will change, and we will live by this new routine. The first thing on the schedule is the morning run. About-face! - As soon as the commander said this, the battalion turned 180 degrees toward the field. - Forward, quick march!\n\nThe battalion began the day with a morning run that lasted about an hour. By the end of this ‘light’ run, many soldiers were thoroughly exhausted, and the day had barely begun. They had a chance to rest during breakfast, with only half an hour allocated for food and rest. After this short break, theoretical classes began with new textbooks based on global trends and recent conflict experiences. The soldiers had to take notes on everything, as the material was critically important and new.\n\nFollowing the theoretical classes, there was a brief rest and lunch, but immediately after, physical training began—gymnastics, running, and exercises to build muscle endurance. After another sports session, more theoretical classes followed, just as intensive as the morning ones.\n\nFinally, after the classes, the soldiers had a little free time to catch their breath, wash off the sweat, and perform hygiene routines. But they were warned that the next day would involve practical application of the theory through exercises, the nature of which was kept secret. Later, around 10:00 PM local time, the ‘lights out’ command was given, and the soldiers, aching from the intense training, fell asleep almost instantly."
 MAR_Kosygin.26.a:0 "Maybe it’ll be easy in battle?"

 MAR_kosmil_tank_squads:0 "Tank Squads"
 MAR_kosmil_tank_squads_desc:0 "The experience of the Great Patriotic War and the Battle for Western Russia shows that tank forces, when gathered into a single powerful fist, are the primary tool for breaking through defenses of almost any complexity. Tanks can wreak havoc on enemy infantry if used correctly, so we must employ them actively. However, we have significant issues with our tank forces—they are outdated compared to those of advanced nations. Their functionality, speed, armor, and guns determine their battlefield effectiveness.\n\nTherefore, we must urgently catch up and improve our tank fleet—creating more modern, superior tanks comparable to foreign analogs and surpassing others in fragmented Russia."

 MAR_kosmil_military_academies:0 "Creation of Military Academies"
 MAR_kosmil_military_academies_desc:0 "One of the final touches to our army’s military reforms will be the creation of military academies specialized in training new officer corps. Without a large number of capable officers, their loss would be extremely painful, so we must mass-produce new officers who graduate year after year.\n\nOnce we establish these academies, we will complete our military reforms."

 MAR_Kosygin.27.t:0 "New Suvorov Academy"
 MAR_Kosygin.27.d:0 "On this day, the main representatives of the government gathered in the capital—the mayor, a general, Minister of Defense Anatoly Vavilov, and Alexei II Romanov. They assembled for an important event: the opening of the new Suvorov Academy in the capital, built with entirely new architecture, distinct from other similar buildings across Russia. The building and its interiors looked very modern, constructed from the best materials available in Western Russia.\n\nAfter cutting the red ribbon, symbolizing the academy’s opening, each official delivered their speech. The mayor expressed joy at the city gaining such a beautiful building, the general spoke about the importance of officers and the army, the Minister of Defense discussed the quality of officers the academy would produce, and Alexei Romanov explained that all this was for the greater good of Russia as a whole.\n\nAs the speeches concluded, the event ended with a military march orchestra, and the academy began its work that same day..."
 MAR_Kosygin.27.a:0 "There is such a profession—to defend the Motherland."

 MAR_kosfor_red_eagle:0 "The Red Eagle Soars Above the Sky"
 MAR_kosfor_red_eagle_desc:0 "It is time for our state to make its presence known. Since the collapse of any semblance of a unified centralized state, our Russian people have been in international isolation. Before and during the Battle for Western Russia, warlords and pseudo-rulers mostly lacked diplomatic ties with foreign states, with only a few maintaining minimal contact with the West and East. But now the situation has changed, and our state has appeared on the world map, bearing all the hallmarks of a unified centralized country, yet we have not properly established diplomatic relations with anyone.\n\nOur state must use diplomacy to implement our ideas and interests, and we must engage as many countries and regions as possible in this regard."

 MAR_Kosygin.28.t:0 "Ministry of Foreign Affairs"
 MAR_Kosygin.28.d:0 "Pyotr Nilovich Demichev, the Minister of Foreign Affairs of the Western Russian People’s Principality, explained to his diplomats the main tasks and directions for developing our country’s foreign policy. According to Demichev, he developed a plan with Alexei Romanov, and therefore, diplomats and ambassadors must achieve these goals by any means, as this is the will not only of Demichev but of the Tsar himself.\n\n- First and foremost, - began Demichev, - our task is to establish friendly relations with one of the world’s poles—either the USA or Japan. We must not cooperate with the Nazis under any circumstances, as they are our number one enemy, so we must secure support from a state capable of opposing them on equal terms.\n\nWhy choose one of these two options? The fact is, we are still considering many possibilities for cooperation. It’s important for us to gain not only military-political support but also to establish trade relations with one of these sides. If our leadership decides we should cooperate with, say, Japan, we must direct all our efforts toward that.\n\nFurthermore, - Demichev continued, - we must establish relations with other countries, primarily third-world nations, to gain significant weight in global politics and defend our interests worldwide. - He concluded. - Any questions?"
 MAR_Kosygin.28.a:0 "No questions, time to get to work."
 
 MAR_kosfor_two_polars:0 "Two Poles of Power"
 MAR_kosfor_two_polars_desc:0 "The time has come to choose which side of the Cold War we will prioritize. The decision to support one side or the other may determine the fate of the entire world, and therefore, we must consider not only the immediate benefits but also the future that will inevitably arrive soon.\n\nBefore Tsar Alexei II Romanov makes his final decision and instructs Demichev on what to do, he must weigh the pros and cons of each country we are dealing with."

 MAR_Kosygin.29.t:0 "Analysis"
 MAR_Kosygin.29.d:0 "Alexei Romanov was still pondering which country to choose as the primary economic partner. It was clear that each country had its advantages and disadvantages, which sometimes stood out sharply in comparison. However, overall, they were, strangely enough, quite comparable.\n\nFirst, looking to the West, the United States of America seems a very attractive option. They have a strong military, one of the most powerful economies in the world, and it’s practically a consumer’s paradise with a vast array of goods for every taste and preference. Many countries trade with the USA, meaning they have almost everything one could offer, and for our people, importing consumer goods, at least initially, would improve citizens’ lives.\n\nOn the other hand, looking to the East, where the sun rises, there is an equally compelling option—Japan. Japan’s economy and military are not as strong, but their technologies are nearly legendary (at least according to what Kosygin knows). Their industrial technologies and electronics are said to surpass those of the Americans, and by adopting their technologies, we could catch up and even surpass others economically."
 MAR_Kosygin.29.a:0 "What will the Tsar choose?"
 MAR_Kosygin_choose_fopo_tt:0 "§YChoosing a geopolitical partner will affect the availability of certain focuses and decisions in the future§!"

 MAR_kosfor_birthplace_of_democracy:0 "Birthplace of Democracy"
 MAR_kosfor_birthplace_of_democracy_desc:0 "If Romanov so desires, we must open an embassy in the USA. This means we will begin aligning with the West, reaping significant economic benefits. While we may miss out on some technological advantages by not choosing Japan, we will compensate for this by providing our people with a vast assortment of goods for every taste.\n\nAll that remains is to open the embassy there. Demichev will send his ambassadors as soon as the Tsar gives the order."
 MAR_Kosygin_choose_USA_tt:0 "We will choose §Bthe United States of America§! as our geopolitical partner"
 MAR_Kosygin_choose_USA:0 "We have chosen §Bthe USA§! for our foreign policy"

 MAR_Kosygin.30.t:0 "From Russia with Love"
 MAR_Kosygin.30.d:0 "Alexei II Romanov decided that the most appropriate course of action would be to establish ties with Washington. Ordering Demichev to begin forging trade relations with the USA, Demichev simply responded, ‘It will be done.’ Now, Pyotr had to prepare his ambassadors for their journey to the USA.\n\nA week later, an entire delegation set off for the USA on a long-range plane across the Atlantic Ocean. The ten-hour flight was grueling for the ambassadors, but they managed to reach Washington, where they were met by escorts who guided them to the White House.\n\nThe President and several U.S. ministers began discussions with our ambassadors, leading to lengthy negotiations. The main purpose was to provide general information about the Western Russian People’s Principality and outline our intentions. Overall, the President found our stance toward the United States quite amicable, so the negotiations were not overly difficult, though some complications arose regarding questions about Europe. The President and ministers skillfully dodged direct questions about the region.\n\nIn the end, the firm outcome of this small conference was the decision to open an official WRPP embassy in Washington. This is a tremendous success, especially considering that our country was recently fragmented into numerous pseudo-states and has been recovering economically for a long time."
 MAR_Kosygin.30.a:0 "The first brick of our relations has been laid."

 MAR_kosfor_from_America_with_love:0 "From America with Love"
 MAR_kosfor_from_America_with_love_desc:0 "As soon as we opened our embassy in the USA, we immediately began building active diplomatic relations with the Americans. The most encouraging aspect is that they are eager to offer us their goods, likely to capture our markets. We can allow them to penetrate our markets, but only to ensure they continue supplying the goods our people desperately need.\n\nIt’s also important to understand that, beyond basic food products—from canned goods to exotic fruits—our state needs everything else: medicines, cars, household items, and more. These goods are just as essential, so if they supply them, everyone benefits."

 MAR_Kosygin.31.t:0 "Red Cross Medicines"
 MAR_Kosygin.31.d:0 "A truck arrived at the hospital carrying numerous crates filled with medicines for sick patients. It was later revealed that these were medicines from the Red Cross, based in the USA, which had sent humanitarian aid to the Russian people.\n\nThe crates contained essential medicines for patients—foreign equivalents of aspirin, analgin, and other painkillers, but of much higher quality. Penicillin, which is in high demand, was also included. Bandages, cotton pads, cotton wool, tourniquets, syringes, antibiotics, and a wide range of other medicines needed during illness were provided.\n\nOf course, the Western Russian People’s Principality has these and many other medicines without foreign aid, but they are not produced in sufficient quantities. Until we can establish our own production, we can rely on the help of those who have these medicines. Patients in need will receive the best treatment to recover and continue their work."
 MAR_Kosygin.31.a:0 "The health of our citizens is vital to the state."

 MAR_kosfor_pearl_of_Asia:0 "Pearl of Asia"
 MAR_kosfor_pearl_of_Asia_desc:0 "If Alexei II Romanov has decided that the Western Russian People’s Principality should cooperate with Japan, so be it. We must open an embassy there to begin negotiating the supply of industrial robots and other computer technology. While we won’t be able to import large quantities of goods from the United States, we will compensate by developing an efficient industry that could, in theory, surpass even advanced nations like Japan itself.\n\nAll that remains is to open the embassy there. Demichev will send his ambassadors as soon as the Tsar gives the order."
 MAR_Kosygin_choose_Japan_tt:0 "We will choose §Rthe Japanese Empire§! as our geopolitical partner. §GIn the future, this will open the option for a peaceful return of the Far East§!"
 MAR_Kosygin_choose_JAP:0 "We have chosen §RJapan§! for our foreign policy"

 MAR_Kosygin.32.t:0 "Eastern Window"
 MAR_Kosygin.32.d:0 "Alexei II Romanov decided that the most appropriate course of action would be to establish ties with the Japanese Empire. Ordering Demichev to begin forging trade relations with Japan, Demichev responded, ‘Very well, it will be done.’ Now, Pyotr Nilovich had to prepare ambassadors for their journey to the Japanese Empire.\n\nA week later, an entire delegation set off for Japan on a long-range plane across the Atlantic Ocean. The eleven-hour flight was grueling for the ambassadors, but they managed to reach Tokyo, where they were met by escorts who guided them to the government building.\n\nThe Prime Minister and several Japanese officials began discussions with our ambassadors, leading to lengthy negotiations. The greatest challenge was the language barrier—the vast gap between Russian and Japanese was overcome only with the help of translators. The main purpose was to provide general information about the Western Russian People’s Principality and outline our intentions. Overall, the Prime Minister found our stance toward the Japanese Empire quite amicable, so the negotiations were not overly difficult, though some complications arose regarding questions about the Far East. The Prime Minister and officials skillfully dodged direct questions about the region.\n\nIn the end, the firm outcome of this small conference was the decision to open an official WRPP embassy in Tokyo. This is a tremendous success, especially considering that our country was recently fragmented into numerous pseudo-states and has been recovering economically for a long time."
 MAR_Kosygin.32.a:0 "We have carved a window to the East!"

 MAR_kosfor_tokyo_embassy:0 "Tokyo Embassy"
 MAR_kosfor_tokyo_embassy_desc:0 "Like Peter I, who embarked on the Great Embassy abroad, our diplomats and personnel must be in Japan to see what interesting things the East has to offer. Computers, tape recorders, radio equipment, industrial robots—in short, everything that could be useful—must be examined and brought to Russia. Naturally, we will pay for it, and the state will cover all our expenses."

 MAR_Kosygin.33.t:0 "Excursion"
 MAR_Kosygin.33.d:0 "Japanese sellers and entrepreneurs were clearly interested in flooding foreign markets with their products. These markets were essential for Japan to grow wealthier through the sale of its goods abroad, so the Japanese were delighted to hear our delegation’s proposal to explore Japan’s scientific achievements.\n\nA comprehensive excursion program was organized for the Western Russian ambassadors to win them over and showcase the vast array of goods essential to the People’s Principality. There were tape recorders, televisions, refrigerators, and robots—the latter being of particular interest to the ambassadors. They were primarily focused on purchasing these robots and signing a trade agreement to supply them to Russia for a reasonable price.\n\nDespite the Japanese attempts to entice the ambassadors to buy other types of goods, they were unsuccessful. The ambassadors were uncompromising in their desires and had no intention of bringing anything unnecessary back to their homeland. Even though they toured much of Tokyo, enjoyed excellent food, and saw plenty of technology, the ambassadors stayed focused on acquiring industrial robots. In the end, the agreement was signed without any additional clauses."
 MAR_Kosygin.33.a:0 "The marketing ploy didn’t work."

 MAR_kosfor_Delhi_travel:0 "Trip to India"
 MAR_kosfor_Delhi_travel_desc:0 "In addition to establishing diplomatic ties with superpowers, we must also pay attention to other countries that may be of interest to us. First and foremost, we mean India. This country has as much potential for modernization as our own, and they, too, need assistance in developing their nation. Therefore, it would be highly beneficial, even necessary, to have a massive market in Asia that could purchase our goods in volumes we can only dream of.\n\nBy reselling goods or producing higher-quality products with new robots and selling them, we can improve the lives of Indians while our economy reaps significant benefits."

 MAR_Kosygin.34.t:0 "Help Your Neighbor"
 MAR_Kosygin.34.d:0 "India is one of the poorest countries in the world, despite its enormous population and, consequently, vast labor force. India has virtually no industry; much of its economy is agrarian, and there are still risks of famine. This is not to mention the numerous social problems within the country, which the government is addressing with varying success.\n\nDespite India’s poverty, it has immense potential for development. With such a large labor force, if India had an industry, labor costs would be comparable to those in China. Moreover, India could produce as much as a third of the world combined.\n\nWhile India lacks industry, it needs consumer goods. We have an offer India likely cannot refuse—we could sell them our consumer goods and even invest in Indian factories to help them develop, expand, and produce consumer goods. By spending our time on them, we gain money and a crucial partner in both economic and political spheres. By reaching out to them now, we secure strong positions for the future."
 MAR_Kosygin.34.a:0 "Send the request."

 MAR_kosfor_Transural_amogus:0 "Penetration Beyond the Urals"
 MAR_kosfor_Transural_amogus_desc:0 "It is obvious that the battle for Russia will soon continue, and its outcome will determine under whose banner Russia will be united. For now, it is difficult to predict, as there are too many contenders for Russia’s unification.\n\nAt present, our primary adversary is the pseudo-state beyond the Ural Mountains. Clearly, their pseudo-rulers also consider us an enemy and are likely intent on destroying us, showing no signs of seeking peaceful negotiations. Therefore, we must ensure that the pseudo-state in Western Siberia is undermined from within, so its population sabotages any war against us and welcomes us as heroes-liberators, or at the very least, accepts us as the only legitimate rulers of Russia."

 MAR_Kosygin.35.t:0 "Beyond the Urals"
 MAR_Kosygin.35.d:0 "The KGB ‘Gamma’ unit is infiltrating Western Siberia through the Ural Mountains, ideally crossing them in a single night. The task is feasible but extremely challenging, so only the best operatives, suited for the main objective, were selected.\n\nWhat is the task of the KGB ‘Gamma’ unit? They must destabilize the situation in Western Siberia. These experienced operatives can spread propaganda, undermining the stability of the state and the morale of enemy soldiers. Propaganda and agitation are weapons of mass destruction, with the speed of their initial effects comparable to a turtle, but their destructive impact akin to nuclear bombs. Words can inflict damage that bombings cannot.\n\nThe KGB ‘Gamma’ unit is already infiltrating Western Siberia, moving through forests and hiding among the population to begin their activities. From there, they will erode the enemy’s defenses day by day, no matter who they are."
 MAR_Kosygin.35.a:0 "If you break the enemy before the battle, you’ve already won."

 MAR_kosfor_Tsar_legion:0 "Tsar’s Legion"
 MAR_kosfor_Tsar_legion_desc:0 "The world is embroiled in a three-way Cold War—between the USA, Japan, and Germany. Though not overt, this conflict puts global stability in question, with tensions along the borders of these superpowers’ spheres of influence. The presence of nuclear weapons on all three sides makes direct war impossible, but regional conflicts—typically civil wars or localized wars—persist, as seen in the recent South African War, where U.S. and German interests clashed.\n\nOur country must defend its interests wherever possible. The Western Russian People’s Principality has established itself as a real force, but we have little global influence. To gain influence, we must support regimes loyal to us in civil wars or conflicts between regional states. The Tsar’s Legions, modeled after the French Foreign Legion and deployed abroad as volunteers, will aid us in this complex task."

 MAR_Kosygin.36.t:0 "A Place in the Sun"
 MAR_Kosygin.36.d:0 "Citizens increasingly saw news in the papers about the formation of the Tsar’s Legion—a special unit, vividly described in the press, that would recruit anyone willing to join, including exotic minorities—French, Africans, Arabs, Americans, even Germans, anyone eager to serve, with one condition: loyalty to our state and Tsar. However, it’s clear that such minorities will be few, and the vast majority will be Russians joining the legion.\n\nThe newspapers actively promote joining the Tsar’s Legion, making promises like ‘You’ll see the world’ or ‘You’ll defend your country.’ While there’s some apparent falsehood in these good intentions, like ‘We’ll protect the poor and needy,’ it’s clear the country needs people to fight for its geopolitical interests. What’s enticing is the substantial salary, which could provide a comfortable life after service, and the chance to visit regions like Africa, the Middle East, Asia, or America."
 MAR_Kosygin.36.a:0 "Join the Legion! You’ll see the world!"

 MAR_kosfor_third_world:0 "Fourth World Countries"
 MAR_kosfor_third_world_desc:0 "We must also pay attention to the so-called ‘Fourth World’ countries. These are the poorest nations we know, where poverty is so extreme that even having a home and some modern amenities is considered great wealth. This and other issues cause significant problems, sometimes leading to civil wars.\n\nWhere there’s war, there’s a need for weapons. We could profit by selling arms to Africans, much like Zlatoust once sold weapons to Russia’s pseudo-rulers. We could sell them simple rifles, using the profits to develop our economy or further stimulate arms production."

 MAR_Kosygin.37.t:0 "Business, Nothing Personal"
 MAR_Kosygin.37.d:0 "Dockworkers loaded crates of weapons into containers, which would later be transferred by crane onto a cargo ship. The crates bore serial numbers for AK-47 rifles, which the inspector checked to determine which would be sent to Africa. The inspector marked each crate, dealing with a dizzying array of numbers and letters. To anyone else, these figures might cause a headache, but not to the inspector, who saw real money behind each mark.\n\nDid he think about where these rifles would end up? Perhaps in another African country unable to settle disputes with its neighbor? Or to rebels of the African Shield or another group aiming to overthrow their ruler? Maybe just to people who could afford them? Who knows. Perhaps the inspector didn’t dwell on it, too absorbed in his work to be distracted."
 MAR_Kosygin.37.a:0 "Money doesn’t smell!"

 MAR_kosfor_global_Russia:0 "Global Reach"
 MAR_kosfor_global_Russia_desc:0 "Our policy is not limited to Europe and Asia. It’s not confined to Russia and its outskirts. Our geopolitics spans the entire globe! Wherever it may be, the WRPP has geopolitical interests we must defend by all means—military support, spy networks, diplomatic pressure, and more. Our interests can range from establishing pro-Russian regimes to lobbying our interests in parliaments worldwide. Our Mladorossi state has earned its place in the sun, and we must not yield it to anyone.\n\nA new era for Russia begins. Soon, our people will be fully united under our banner, and once we emerge from the shadow of our former greatness, the world will tremble, realizing our nation was not broken but has grown stronger. We will feel the grandeur of this moment soon."

 MAR_Kosygin.38.t:0 "Where the Russian Flag Was Once Raised, It Must Never Be Lowered"
 MAR_Kosygin.38.d:0 "Nicholas I Romanov once said, ‘Where the Russian flag was once raised, it must never be lowered.’ In our geopolitical reality, this phrase retains its meaning. With it, we proclaim that we will never relinquish our interests.\n\nAccusations of ‘Mladorossi imperialism’ can be easily refuted by noting that our interests do not always harm others. We believe that cooperation—Russian interest in economic and political collaboration with other states—is not negative. Look at the USA, Germany, or Japan—they, too, have interests in cooperation. Are their interests imperialistic? No. Thus, neither are ours.\n\nWe may be accused of sponsoring destabilization and pro-Russian groups worldwide. Yet, others—like the USA and Germany—have directly or indirectly interfered in conflicts like the recent one in South Africa or supported factions in civil wars elsewhere. Is this wrong? From a geopolitical perspective, it’s beneficial.\n\nIn this harsh world, we cannot afford to be toothless. The resolute and ‘sharp-toothed’ can protect their interests. Pacifism and peacefulness are formally welcomed, but in reality, things are far more complex, with even calls for peace hiding certain interests.\n\nOur policy must be all-encompassing to protect ourselves and our homeland."
 MAR_Kosygin.38.a:0 "Geopolitics is not a game for children."

 MAR_kossup_porog:0 "Crossing the Threshold"
 MAR_kossup_porog_desc:0 "Having resolved many issues in Western Russia and finally crossing the ‘threshold’ of the Ural Mountains into Western Siberia, we can now proceed with further actions to develop our Russian People’s Empire. Our Mladorossi state is worthy of being considered the successor to the Russian Empire, as we represent a serious force capable of uniting Russia’s remaining fragments.\n\nBefore continuing to unite Russia, we must address some equally important issues that will add final touches to our state."

 MAR_Kosygin.39.t:0 "Between Past and Present"
 MAR_Kosygin.39.d:0 "Tsar Romanov sat in his office, reflecting on his life and his country’s past. Enough time had passed to make a subjective assessment of prior events, and there was much to recall.\n\nHe remembered joining the Mladorossi party and asking Kazem-Bek to be a candidate at the Zemsky Sobor. It was astonishing that people genuinely believed he was the surviving Alexei Romanov. What was the reality? What went through the minds of ordinary citizens who voted for Alexei Romanov, a mask for Alexei Kosygin? Perhaps they simply wanted Kosygin. It’s remarkable that, despite his efforts to win, this outcome wasn’t fully planned. He expected to become Minister of Economy under Belozersky or Kazem-Bek, not a full-fledged Tsar.\n\nThe Vyatka Conference dramatically altered the country’s fate—not because it was held, but because it was disrupted by the ‘Thronists.’ The scale of opposition and the near-all-encompassing conspiracy were staggering. Taborytsky was truly mad, and Kosygin understood why people followed him—a figure uniting radical opposition. It’s terrifying to imagine what would have happened to the WRPP if his followers had succeeded. Their exact goals remain unknown, and perhaps that’s for the best. Taborytsky is dead, and there’s no need to worry about them anymore.\n\nThese pivotal events greatly improved ordinary citizens’ lives. The economy is growing rapidly, unlike during Bukharin’s time. The same could likely be said if Kazem-Bek or Tsar Belozersky were in power, but they perished, leaving Kosygin—now Romanov—as the leader.\n\nRomanov pondered for a long time until Vladimir Gil, the Prime Minister, entered.\n\n– Am I disturbing you, my Tsar? – asked Vladimir Gil.\n\n– No, come in. What questions do you have?\n\n– We need to address the integration of Western Siberia, and I have a plan for its inclusion in our state."
 MAR_Kosygin.39.a:0 "Speak, I’m listening."

 MAR_kossup_ural_archives:0 "Ural Regional Council Archives"
 MAR_kossup_ural_archives_desc:0 "The archives stored in the Ural region, specifically where the Ural Regional Council once existed, contain a wealth of fascinating information. However, we are not as interested in the documents themselves as in what we specifically need to find—above all, we must eliminate any evidence that Alexei Romanov was killed, particularly documentary proof. We must ensure no one finds documents that could compromise the current ruler. Otherwise, it could backfire.\n\nHowever, it’s clear we’ll find other interesting things in these archives, so we must open them and uncover everything possible."

 MAR_Kosygin.40.t:0 "Vigilante Justice"
 MAR_Kosygin.40.d:0 "Several archivists opened the sealed Ural Regional Council archive, created during the Civil War. Their task was to sift through all documents to find papers related to the Tsarist family—information on where they were buried (if buried), who issued the execution order, and so forth. They expected to find many such documents, which could be attributed to the Ural Regional Council’s decisions.\n\nUpon opening the door, they were hit by the distinct smell of dust and an almost legendary antiquity. One archivist sneezed from the scent. Turning on the light in this forgotten place, they spread out across the archive, which was practically overflowing with documents. A serious question arose—why had no one explored this place before these archivists? The question grew more perplexing as they realized how long it had been since the door was last opened.\n\nPerhaps there was a silver lining—the archive was completely untouched. The documents remained intact, and time hadn’t faded the ink. There was a vast amount of information to extract.\n\nWhile sifting through the archive, they found much, often utterly useless, information. Some documents could be used for history coursework or theses, but most were entirely irrelevant. Still, this wasn’t what they needed—information about the execution at the Ipatiev House on July 17, 1918.\n\nYet, one archivist stumbled upon a surprising find. They discovered a trove of orders and letters between none other than the Ural Regional Council and Lenin himself. From this correspondence, a fascinating detail emerged—there was no order to execute Nicholas II and his family. In fact, Lenin only called for trying him and imprisoning him, but the Ural Regional Council acted independently, defying Moscow’s orders. Thus, the execution order came from the Ural Regional Council, not Lenin.\n\nThe archive review continues."
 MAR_Kosygin.40.a:0 "A remarkable coincidence."

 MAR_kossup_curdes_old_house:0 "Cursed Old House"
 MAR_kossup_curdes_old_house_desc:0 "Nicholas II was executed, frankly, for no reason. He was killed solely because the local Ural Regional Council decided to take justice into their own hands. Had it not been for them, we might have seen the entire Tsarist family behind bars. Perhaps, in our reality, their execution was for the best.\n\nNevertheless, having found all the information about Nicholas II and his family, we now know exactly where their burial site is. We must urgently go there to locate the grave and rebury them properly."

 MAR_Kosygin.41.t:0 "Unexpected Revelations"
 MAR_Kosygin.41.d:0 "A team of archivists and gravediggers set out to find the burial site identified in the Ural Regional Council archives. According to the documents, the bodies were buried relatively near Yekaterinburg, but astonishingly, they were placed in a cave filled with sulfuric acid—a harsh burial, to say the least.\n\nArriving at the site, many feared the acid would have dissolved everything, leaving nothing behind, or that it might still be present. No one could say for sure what to expect. However, the team was incredibly fortunate—not only was the acid long gone, but they also found the skeletal remains of Nicholas II’s family.\n\nIn the cave, they identified the bodies of Nicholas II, his wife Alexandra Fyodorovna, Olga, Tatiana, and Anastasia, at least according to the documents. Most intriguing was the discovery of other bodies clearly unrelated to the Tsarist family—Botkin, Trupp, and Anna Demidova. However, the bodies of Maria Nikolaevna and Alexei Romanov were not found. The absence of Alexei Romanov’s body was particularly amusing to the researchers, as it seemed to confirm the rumor that Alexei II Romanov, now in power, had indeed survived. This was both amusing and deeply puzzling, raising many questions."
 MAR_Kosygin.41.a:0 "What, is Maria Nikolaevna alive too?"

 MAR_kossup_make_lenin_leave:0 "Comrade Ulyanov—Time to Go"
 MAR_kossup_make_lenin_leave_desc:0 "Vladimir Ilyich Ulyanov-Lenin is a highly controversial figure in Russian society. Years of Soviet propaganda elevated Lenin to near-divine status, attributing qualities he didn’t possess, while his role in establishing Soviet power is often overstated. On the other hand, staunch monarchists, conservatives, and anti-communists despise him, viewing Lenin as the destroyer of Russia’s spiritual and material essence. Many believe he was responsible for the Tsarist family’s murder, despite this being a misconception.\n\nNaturally, this figure sparks heated debates, but it’s undeniable that he made an indelible mark on history. Like any historical figure, however, he must become part of history. We must retire Lenin, preferably in a neutral manner, lest we alienate supporters of either side."

 MAR_Kosygin.42.t:0 "Become Part of History"
 MAR_Kosygin.42.d:0 "In Tyumen stands an unremarkable structure, yet one of great significance for the once-existent Tyumen Republic of Kaganovich, a supporter of the lesser-known Joseph Stalin. This modest building was a mausoleum for Vladimir Ilyich Lenin, almost an exact replica of the one in Moscow before the war. It differed only in its rougher construction, likely built hastily with the possibility of German bombings in mind, to avoid wasting resources. Still, it was far from shoddy.\n\nTyumen residents watched as Lenin’s mummified body was removed from the mausoleum. For many, over time, the body and mausoleum had become sacred, as they were for millions of Soviet citizens during Bukharin’s USSR. However, the residents didn’t know what to do—Lenin’s body was being removed for burial.\n\nA crowd gathered around the burial site, and to avoid upsetting the residents or Lenin’s sympathizers, it was decided to bury him with an orchestra but without speeches. The orchestra played the USSR anthem, perhaps for the last time in public, adding to the tears of Tyumen’s residents. As the anthem began, some started singing its lyrics, followed by others until the entire crowd joined in. Three minutes later, the crowd finished singing, and Lenin’s body was carried to a special vehicle, which drove off in an unknown direction."
 MAR_Kosygin.42.a:0 "Time to rest. Into the future."

 MAR_kossup_topor:0 "Bury the Hatchet of War"
 MAR_kossup_topor_desc:0 "The November Revolution of 1917 and the Civil War led to a persistent ideological divide in Russian society. The Reds, supporters of Soviet power, and the Whites, their opponents, may always see each other as sworn enemies, even though both sides have largely faded into history.\n\nThe Whites proclaim their irreconcilability with the Reds, and the Reds do the same. However, this nearly half-century-long conflict must end. We must reconcile them in an unusual way—by making them part of the same history as Nicholas II and Lenin."

 MAR_Kosygin.43.t:0 "Roots of the Conflict"
 MAR_Kosygin.43.d:0 "The struggle between the Whites and Reds holds one of the most tragic places in Russian collective memory. Without exaggeration, the Civil War is among the cruelest conflicts the world has seen—not comparable to the First World War or even the Great Patriotic War, but no less brutal.\n\nWhere else have you seen fathers fighting sons, or brothers charging at brothers with bayonets or sabers? Only the Russian Civil War divided families’ fates, all because of ideology. In this regard, it is particularly tragic. Yet, this struggle has its roots.\n\nRussia is unique. Only our people possess qualities not found elsewhere—communalism, collectivism, and a sense of justice. Our nation shares much with socialism but also needs a Tsar, as it is typically fiercely loyal to its leader. The Civil War exposed and amplified these qualities to their extremes, sparking a clash between monarchist and socialist principles, making the White-Red struggle especially brutal and tragic.\n\nThe Mladorossi have combined the monarchist and socialist elements of the Russian people, eliminating ideological contradictions in our homeland—at least where Mladorossi rule. We have merged these ideals, but one final contradiction remains unresolved. We must resolve it in an unusual way—by creating a Valley of Reconciliation for fallen communists and Whites, burying their bodies together."
 MAR_Kosygin.43.a:0 "We will eradicate this root of conflict through reconciliation."

 MAR_dolina_primirenya_category:0 "Valley of Reconciliation"
 MAR_dolina_primirenya_category_desc:0 "The ‘Valley of Reconciliation’ carries more symbolic than practical significance. In this valley, we will build a memorial for White and Red soldiers who fell during the Civil War. By reburying mass graves, we can symbolically end this conflict in Russian consciousness, declaring the struggle over."

 MAR_build_the_dolina:0 "Begin Construction of the Valley"

 MAR_Kosygin.100.t:0 "Reconciliation"
 MAR_Kosygin.100.d:0 "Through our efforts, the ‘Valley of Reconciliation’ has finally been created. This site, resembling a mass grave, is not only a burial ground but also a gesture of reconciliation between Whites and Reds. Many Russians take pride in their ancestors who fought for either side, yet harbored enmity toward their opponents. This ends now, as this memorial complex was created to spiritually unite Russia, which has long held conflicting feelings on this matter.\n\nAs a final act of reconciliation, the bodies of Lenin and Nicholas II’s family were buried opposite each other. Could anyone have imagined that these two figures—Lenin and Nicholas II—would ever be buried side by side? Probably not, but they must be laid to rest humanely to end the contradictions within the Russian people."
 MAR_Kosygin.100.a:0 "Rest in peace."

 MAR_kossup_red_midday:0 "Red Midday"
 MAR_kossup_red_midday_desc:0 "The Russian People’s Empire is at the zenith of its power and prosperity. Neither the Soviet Union nor the Russian Empire could dream of the successes we are achieving. We combine the best of both regimes, and therein lies the uniqueness of our Mladorossi ideology.\n\nOur regime could even be called monarcho-socialism. Some see this as a strange combination, mocking or cursing our attempt to merge the incompatible. Our detractors are simply envious of our regime, which unites the best of socialism and monarchism. Russia’s day has not yet ended, and its sunset is far off."

 MAR_Kosygin.44.t:0 "Monarcho-Socialism in Russia"
 MAR_Kosygin.44.d:0 "The fact that our country has built a form of monarcho-socialism is a source of pride for Alexei II Romanov. This regime is a compromise between two extremes, and as we see, opposites have attracted and strengthened. In Russia, the seeds of Mladorossi monarcho-socialism are bearing fruit: our country has grown stronger, the army more robust, the economy more stable, and the people more prosperous—achievements neither Bukharin nor Nicholas II could fully realize.\n\nMonarcho-socialism in Russia stands firm, and undermining its foundations is no easy task. The Russian spirit, combined with socialist principles and crowned by monarchist rule, provides an ideological shield unmatched by any other regime. The German people no longer know what they truly want, the American people stand at a crossroads, and the Japanese people cannot shake off imperialistic tendencies.\n\nOur monarcho-socialism is progressive, looking both to the future and the past, preserving Russia’s traditions and spirit while bolstered by socialist ideals of justice, equality, and prosperity. The greatness of the Russian people has been forged in our state.\n\nAnd we will not stop. We will show the world our ideals, and they will live long in the hearts of people worldwide."
 MAR_Kosygin.44.a:0 "The greatness of the Mladorossi idea."

 MAR_kossup_thaw:0 "Easing Restrictions"
 MAR_kossup_thaw_desc:0 "Until now, martial law has remained in effect in our state, though it has been gradually relaxed. With the situation stabilized, the ‘Thronists’ defeated, and robberies reduced to rare incidents, we can now afford to withdraw the army from cities and transfer all public order duties to the militia and people’s squads.\n\nHowever, some restrictions must remain to ensure the stability of our state and the safety of our people’s lives. After all, no one has ruled out the possibility of reinstating martial law, have they?"

 MAR_Kosygin.45.t:0 "They’re Gone"
 MAR_Kosygin.45.d:0 "Tatyana Karachaeva, now Smirnova, was heading to the store to buy groceries for her family. It had been some time since soldiers appeared on the streets, and she no longer feared walking alone, as the soldiers, though stern, provided moral reassurance—a sense of protection. At some point, it even felt like these ‘tin’ soldiers had become a familiar, integral part of the city. Gunshots at night were frightening at first but became rare over time.\n\nOne could even say that living by a strict daily schedule improved things—it instilled discipline and responsibility in work, studies, or household tasks. Though curfew times shifted, she kept in mind the need to complete everything by then.\n\nBut today, as she walked, she noticed the soldiers were gone. This didn’t cause disappointment or negativity—she wasn’t overly attached to them. She simply noted their absence. She also noticed announcements about the lifting of martial law. The curfew was canceled, and executions for crimes were replaced with arrests and detentions. Responsibility for order now fell to the militia and people’s squads."
 MAR_Kosygin.45.a:0 "They’re gone, but will they return?"

 MAR_kossup_kosyginki:0 "Kosyginkas"
 MAR_kossup_kosyginki_desc:0 "The housing issue remains one of the most pressing in our country. Despite the end of bombings long ago, many still live in communal apartments built during Bukharin’s Soviet Union. Some can afford decent private apartments, but such housing is scarce, and supply cannot meet demand. To decisively address this, we need standardized homes that meet all necessary standards, are easy to build, and affordable for people.\n\nThus, we have adopted a project to build new-type houses in all cities, already dubbed ‘Kosyginkas.’ Easy to construct, relatively cheap, yet high-quality, these homes will finally resolve the housing shortage. No longer will multiple families live in a single room—each family will have a full two-room apartment to meet their personal space needs."

 MAR_kossup_red_and_white:0 "Red and White"
 MAR_kossup_red_and_white_desc:0 "Our regime cannot be easily categorized—it incorporates elements of both monarchism and socialism. The Mladorossi have created a compromise that unites the ideas of Reds and Whites. Though many may not understand how our system even exists, if it works—and works effectively—then we have chosen the right path for our state’s development.\n\nWe combine the best of Bukharin’s Soviet Union and Nicholas II’s Russian Empire. Equality is fused with imperial self-awareness. Prosperity is paired with the strength of the Russian spirit. Loyalty to the homeland and loyalty to the Tsar. This gives us the right to call ourselves the Red Empire."

 MAR_Kosygin.46.t:0 "Conscripts"
 MAR_Kosygin.46.d:0 "Nikolai Malashenko was heading to the conscription office to enlist in the army. Having just turned 18, he received a draft notice from the military office. It was time to serve and repay his debt to the Motherland.\n\nAt the conscription office, he saw many other young men who had also arrived by draft notice, waiting to be enlisted. There were about 40 people, and he took his place in line. As he waited, the line behind him grew almost as long as the one ahead. This surprised Nikolai, though it wasn’t unexpected—avoiding conscription was frowned upon, and dodging the army was considered bad form. From what he observed, many young men were eager to join the army.\n\nWhen his turn came, he entered the office where personal details were recorded.\n\n– Hello, – Nikolai began, – I’m here by draft notice to enlist in the army.\n\n– Hello, it’s good that you want to enlist, – said the clerk, about 26 or 27 years old. – Please provide your documents.\n\nNikolai placed the required documents on the desk, and the clerk quickly began transcribing them.\n\n– Have you undergone a medical examination? – the clerk asked.\n\n– Yes, sir, – Malashenko replied.\n\n– State your fitness category.\n\n– A3.\n\n– Good, we’ll record that.\n\nAfter finishing, the clerk said:\n\n– Congratulations, you’re enlisted. You’ll be assigned to a service location. Please return to the military office in a week, and they’ll give you further instructions.\n\n– Yes, sir, I’ll be there.\n\n– You’re free to go, – the clerk said kindly."
 MAR_Kosygin.46.a:0 "I serve the Motherland!"

 MAR_kossup_look_to_the_east:0 "Gaze to the East"
 MAR_kossup_look_to_the_east_desc:0 "There is no doubt that uniting all of Russia will require shedding more blood to make our nation whole again. In the East, in Central Siberia and the Far East, pseudo-rulers seek to unite Russia under their rule. If they destroy us, Russia’s fate will be far from enviable. We know they are impostors who care nothing for their people and seek to unite Russia for their own selfish ends.\n\nA war is likely coming to end this fragmentation. There can be no compromise—either they destroy us, or we destroy them, and this struggle is to the death. We must be prepared for this war, or they will crush us with Siberian industry. We must mobilize all available forces to deliver a crushing blow to these pseudo-rulers. By defeating them, we will secure a better future for Russia and our people.\n\nFor the Motherland, no sacrifice is too great."

 MAR_kossup_meet_Gil:0 "Meeting with Gil"
 MAR_kossup_meet_Gil_desc:0 "If we plan to wage war with Siberia to unite the rest of Russia, we need a thorough battle plan. It must account for Siberia’s likely resistance, our own capabilities, timelines for capturing cities, and much more. Russia is eagerly awaiting who will unite our vast Motherland, and we must be worthy of defeating those in Siberia.\n\nOur battle plan will not be handled by just anyone but by Prime Minister Vladimir Gil, together with Minister of War Anatoly Vavilov. To ensure the plan is well-crafted, we must involve competent individuals, even those who might not typically be involved."

 MAR_Kosygin.47.t:0 "Back to Old Times"
 MAR_Kosygin.47.d:0 "Vladimir Gil walked to the military command office. He had almost forgotten, during his time as Prime Minister, that he was once an army general—and not a bad one. Even Tukhachevsky, a legendary Soviet commander, adopted some of Gil’s tactics. But those days were gone, and now he donned the general’s uniform once more.\n\nEntering the military headquarters, he was greeted by Anatoly Vavilov and two or three high-ranking generals honored with commanding the armies for the Siberian War—the final, decisive war for a united Russia. The generals had already drawn arrows and battle plans against the state in Siberia.\n\n– Greetings, Comrade General Gil! – said everyone in the room.\n\n– Greetings. At ease, – Gil replied, recalling those army days. – I see you’re already hard at work?\n\n– Yes, sir, General. We’ve begun developing defensive and offensive plans against the enemy, – Vavilov began.\n\n– Good, I’d like to take a look.\n\n– Here, see for yourself, – Vavilov said, leading Gil to the table with maps.\n\nGil examined the maps closely. He first noticed their high quality, unlike anything before. His attention then shifted to the arrows and positions of the Russian People’s Empire’s divisions and the enemy’s. The main strike was planned in southern Siberia, where most of the population and industry were located—a logical choice. However, the plan was not yet perfect.\n\n– Hmm… – Gil said, studying the maps. – These aren’t final, are they?\n\n– Correct, we started working on them just a few hours ago.\n\n– That’s encouraging. Well, I can suggest some things that could be useful in war.\n\nAfter this, Gil dove into planning the war. They say a backup plan is essential, and one was developed—for cases where the enemy proves stronger, relying on defensive lines that could be built shortly before the war. Airbases for easier air superiority, bunkers, roads, and army mobilization—everything needed for war was planned in this headquarters.\n\nThe defense and attack plans were finalized. During breaks, Gil and Vavilov discussed past campaigns. Gil recounted his time as a commander in the Great Patriotic War, the Western Russian War, and the Battle for Western Russia, and how he helped save the Principality from collapse at the hands of Taborytsky and his ‘Thronists.’ These conversations occurred during sparse breaks, as the entire command worked tirelessly on the plan.\n\nIn the end, the plan was signed, awaiting its implementation."
 MAR_Kosygin.47.a:0 "A plan is essential."

 MAR_kossup_scarlet_etud:0 "A Study in Scarlet"
 MAR_kossup_scarlet_etud_desc:0 "The Russian People’s Empire is undoubtedly experiencing one of its finest periods of development. We are 100% confident that Russia will be fully united under the leadership of our ‘Red Tsar’—Alexei II Romanov. Without him, the fate of the Russian people might have taken a very different course. Who knows what would have happened if he hadn’t been in the right place at the right time?\n\nRussia’s history is far from over. Spanning just over 1,000 years, it shows no signs of ending. On the contrary, our state demonstrates that these centuries were merely the prelude to a new, perhaps the greatest, era in Russian history. Our nation has not yet lived its golden age, which lies ahead. As dawn breaks before the darkest hour, this night is ending, and we are witnessing the Russian nation greet a scarlet-tinged dawn.\n\nThe old persona of Alexei II Romanov is gone. He is not Kosygin, not the son of a turner. He is one of his own among a foreign surname. Romanov is, of course, glad to be Russia’s ruler, but he remains an ordinary son of a turner named Kosygin. He, too, is a simple man—and he has decided to publish memoirs to tell his story, without revealing that he is not a Romanov. Romanov has ideas for writing his own ‘Study in Scarlet’—to recount his life, as if he had been hiding under the guise of ‘Kosygin.’"
 
 MAR_Kosygin.48.t: "Reconciliation with One’s Own Past"
 MAR_Kosygin.48.d: "A book authored by Alexei II Romanov himself has appeared on the shelves. Titled *A Study in Scarlet*, it primarily sheds light on a lesser-known side of Alexei Romanov’s life—the period between 1918 and the 1950s. Essentially, these are memoirs. Opening the book, the first page features a photograph of the entire imperial family, followed by the publication details, the title, and, a page later, the table of contents. The book is quite voluminous, spanning nearly 500 pages.\n\nHere, the author, Tsar Alexei II Romanov himself, recounts how he became Kosygin, describing his life in meticulous detail, almost month by month. For just over 30 years, he lived under the guise of Kosygin while always keeping in mind that he was the true heir to the Russian Empire. Climbing the career ladder, he achieved success and improved the lives of those around him. However, because he was not at the helm of the country at the time, he couldn’t save it when it needed him most. He explains that socialism, as it existed under Bukharin, greatly influenced the future Tsar’s views. By striving to combine the best elements of that era, he ultimately created what we now call the 'Russian People’s Empire.'\n\nThe book concludes with the defeat of the evil that sought to destroy Russia from within—the news of Taborytsky’s death and the birth of hope for the Russian people’s prosperity serve as the finale of Alexei II Romanov’s *A Study in Scarlet*.\n\nHistory will judge and fully evaluate Alexei II Romanov’s contribution to the welfare of his homeland."
 MAR_Kosygin.48.a: "The final reconciliation, now with himself."

 MAR_kosnuk_Weapon_of_Prometeus: "Weapons of Prometheus"
 MAR_kosnuk_Weapon_of_Prometeus_desc: "Many people, even those far from politics, understand that to stand as equals with superpowers like the United States, Japan, and especially the Greater German Reich, we must possess nuclear weapons—a strategic tool of immense destructive power. Therefore, Emperor Alexei II of the Russian People’s Empire has decided to establish a special government commission under the leadership of our head of government, Vladimir Vladimirovich Gil. All we can do is pray to God that we complete this work in time of need."

 MAR_Kosygin.49.t: "An Important Task"
 MAR_Kosygin.49.d: "The joint meeting with the Emperor was nearing its end, and everyone began to disperse when Alexei II asked the head of government, Vladimir Gil, to stay for an important matter.\n\n'Vladimir Vladimirovich, can you stay for 20 minutes? We need to discuss something.'\n\nGil agreed, and once the doors closed, the conversation continued in private.\n\n'Vladimir Vladimirovich, as the head of government, you understand that our country must now prepare for war with the German Reich, one of the three superpowers.'\n\n'Forgive me, Alexei Nikolaevich, but I’m not entirely sure where you’re going with this, Your Majesty.'\n\n'It’s simple, Vladimir Vladimirovich. The Reich, like the United States and Japan, has something we lack—a nuclear arsenal. For us, possessing such a shield is crucial, as without it, we will simply be crushed.'\n\n'And what do you propose, Alexei Nikolaevich? And what does this have to do with me?'\n\n'I would like to appoint you, as head of government, as chairman of a special committee to develop nuclear weapons. However, you understand the sensitive nature of this work. It would be best to avoid any information leaks, lest our neighbors get ideas to act before we have this powerful argument.'\n\n'What are my powers in this new role?'\n\n'You will be given all necessary resources to develop an atomic bomb within six months or, at the latest, a year. The world must know that Russia is returning to the global stage.'\n\n'It will be done, Emperor Alexei Nikolaevich. Permission to leave.'\n\n'You are dismissed, Vladimir Vladimirovich.'\n\nAs Vladimir Gil left the meeting room, he was drenched in sweat from the excitement and the realization that he had been entrusted with such critical work. Leaving the government building, he was no longer just the head of government but also the chairman of the special committee for developing the atomic bomb under the Russian People’s Empire."
 MAR_Kosygin.49.a: "And the fate of the country depended on this committee’s decision."

 MAR_kosnuk_mythical_inspirations: "Scientific Inspirations"
 MAR_kosnuk_mythical_inspirations_desc: "Before starting the construction of nuclear weapons, we must understand their theoretical framework, as all current superpowers did. As the saying goes, 'If you want an omelet, break some eggs.'\n\nTo this end, we should engage all available nuclear physicists to assist in developing this type of bomb. Some should be sent abroad for training to acquire the knowledge we urgently need."

 MAR_kosnuk_Kurchatov_genius: "Geniuses of the Past"
 MAR_kosnuk_Kurchatov_genius_desc: "Although our ideas diverge from those of the so-called 'ultravisionaries,' we should consider and adopt some of their developments for our projects. After all, alongside Andrei Zhdanov, they included many outstanding Soviet scientists and engineers. Therefore, our people in the government committee for creating the nuclear bomb must review all their blueprints and developments. Perhaps what they intended to bring to life will aid us."

 MAR_kosnuk_new_kind_of_weapon: "A New Kind of Weapon"
 MAR_kosnuk_new_kind_of_weapon_desc: "Since our military projects have not been as materially and technically challenging, the government commission must appeal to the Emperor for additional funding. Developing nuclear weapons is not only labor-intensive but also requires significant financial investment from the state. Sending scientists abroad and creating a government commission are clearly insufficient efforts for creating a nuclear bomb."

 MAR_Kosygin.50.t: "TBD"
 MAR_Kosygin.50.d: "TBD"
 MAR_Kosygin.50.a: "TBD"

 MAR_kosnuk_kurgan_mines: "Kurgan Mines"
 MAR_kosnuk_kurgan_mines_desc: "Thanks to geological surveys, we have received information about vast uranium deposits in the Kurgan region. As we all understand, this resource is essential for creating nuclear weapons. Therefore, we will make every effort to build mines and storage facilities in this area. By developing this critical production, we can meet our uranium extraction plan ahead of schedule."

 MAR_kosnuk_third_world_uranium: "Fourth World Uranium"
 MAR_kosnuk_third_world_uranium_desc: "Although our country has uranium deposits, we must not forget that parts of our territory are under the control of German puppets. Therefore, the commission has decided to organize uranium mining in African countries. While we can legally mine uranium in African nations allied with us, we face challenges mining in other states. As a result, we have decided to organize covert uranium mining in countries allied with the USA and Japan through third parties willing to cover for us."

 MAR_kosnuk_tame_the_fire: "Taming the Fire"
 MAR_kosnuk_tame_the_fire_desc: "Enough time has passed since the establishment of the government commission for nuclear weapons development to report to the Emperor on our progress. There are murmurs within the state apparatus that the resources allocated to the commission were wasted. Therefore, we will prepare a comprehensive report for the Emperor, detailing the commission’s work since its creation. This will convince the Emperor that our efforts for the country’s benefit are not in vain."

 MAR_Kosygin.51.t: "A Long and Difficult Conversation"
 MAR_Kosygin.51.d: "Vladimir Gil entered the office where the government meeting was about to begin. He knew that, as chairman of the special commission, he would have to answer to the Emperor for the results of his and his subordinates’ work. However, before the meeting started, the Emperor asked Vladimir to come to his office for a personal report.\n\nReaching the designated place, Vladimir Gil pulled out all the necessary documents from his briefcase and sat opposite Alexei II.\n\n'Vladimir Vladimirovich, please provide a full report on your commission’s work. I’d like to hear about the progress in developing the atomic bomb.'\n\n'Your Majesty, may I first ask one question?' \n\nThe Emperor nodded approvingly.\n\n'Alexei Nikolaevich, why can’t I present the report at the meeting, to all the ministers?' \n\n'I want to hear about this critical matter first and personally. I’ll inform the other ministers of what’s necessary. You may begin your report.'\n\n'The result of our work so far includes the construction of factories in many cities across the country for uranium isotope separation using the diffusion method and industrial nuclear reactors. This will facilitate the industrial production of plutonium-239 and uranium-235, which are used in atomic bomb production.'\n\nAfter a lengthy reading of reports and summarizing the work done, Vladimir Gil concluded with joyful news.\n\n'…thus, we will be able to conduct a test of the atomic bomb in record time, even earlier than planned.'\n\nAfter the report, the head of government packed his documents into his briefcase and left the office at the Emperor’s behest. Meanwhile, Alexei Nikolaevich, left alone, allowed a smile to spread across his face, through which a quiet monologue slipped out to himself."
 MAR_Kosygin.51.a: "Finally, Russia will make its mark."

 MAR_koskaz_red_sun_over_steppe: "The Red Sun Rises Over the Steppe"
 MAR_koskaz_red_sun_over_steppe_desc: "Once upon a time, a bright sun illuminated the endless Kazakh steppes, showcasing their beauty and grandeur. Unfortunately, those times are long gone. Now, Kazakhstan is torn apart by numerous cliques of petty warlords vying for absolute power over the region. It seems this process could continue indefinitely.\n\nBut the time has come to say, 'Enough!' The Kazakhs were and remain brothers to Russia. It’s time to end the suffering of this poor fraternal people, who have lost their homes but not their comrades. Our valiant troops will sweep through the steppes like a whirlwind, putting an end to the fratricidal wars that destroy an already suffering nation."

 MAR_koskaz_red_imams: "Red Imams"
 MAR_koskaz_red_imams_desc: "Central Asia is a melting pot of diverse cultures and religions, which don’t always coexist peacefully. The most widespread religion remains Islam. It’s unlikely that Muslims will take kindly to our societal structure. Their response is unknown, so we must prepare for the worst possible outcome.\n\nBut should we simply sit and wait for their actions? Isn’t it simpler and wiser to act preemptively? Our KGB operatives will conduct accelerated 'retraining' courses for certain imams and other Islamic clergy. This way, only truthful and appropriate information that aligns with the government will reach the masses. As for what to do with the others…"

 MAR_Kosygin.52.t: "From Russia with Love"
 MAR_Kosygin.52.d: "'The need to train personnel who will convey only the correct information to believers is fully justified, and I demand the immediate preparation of these personnel in KGB facilities. The training will take place through lectures on topics that enhance the state’s image. After several lectures, trainees will be required to pass a test. The results will determine the trainee’s fate.\n\nIf the test is passed, the trainee must prepare for a trip to Kazakhstan for an indefinite period. The train departs every Sunday at 10:00. If a trainee fails to arrive on time for any reason, they will face a court that will determine their punishment, either retraining or a prison term of up to six months.\n\nIf the test is failed, the trainee must retake the course. If they systematically fail to attend lectures, they will face a court that will determine their punishment, either retraining or a prison term of up to six months.'\n\nFrom the order 'On the Training of Personnel to Alter Religious Rhetoric in Kazakhstan,' dated xx.xx.xx."
 MAR_Kosygin.52.a: "Read and execute."

 MAR_koskaz_liquidate_other_ideas: "Elimination of Dissent"
 MAR_koskaz_liquidate_other_ideas_desc: "Lengthy conversations in KGB offices have borne fruit, and now imams are beginning to deliver the sermons and information we need. However, this is only half the task, if not less. Many adherents of Middle Eastern faiths and others have failed to heed our advice and continue to sow dissent among the people.\n\nUnfortunately, retraining is a lengthy and costly solution. In this situation, we will have to resort to using the KGB and other military formations to eliminate the remaining parasitic elements of Islam and other faiths that oppose our government."

 MAR_Kosygin.53.t: "Report No. 42198"
 MAR_Kosygin.53.d: "From Report No. 42198, dated xx.xx.xx:\n\nOn Monday, at 3:00 p.m. in the city of Aktau, a group of Muslims engaged in subversive activities against our state was detained. The group consisted of seven individuals, led by Aslan Burdenov. During the arrest, three Makarov pistols, two Kalashnikov rifles, six RGD grenades, and approximately 500 rounds of various calibers were seized. The detainees were sent to the Mangistau region prison.\n\nOn Wednesday, a group of four individuals attempting to flee to Iran was detained in the Mangyshlak Bay. During the arrest attempt, they opened fire on coast guard personnel. In the ensuing brief firefight, all group members were killed.\n\nOn Thursday, a group of approximately 20 people attacked the KGB center in Atyrau. These were radical Islamists intending to blow up the KGB building. In the firefight, 13 gang members, two KGB operatives, and one passerby were killed, with approximately 50 people injured. One gang member was stunned and is now in custody. Interrogations have yet to yield much information, but we believe he will soon break. The gang’s homemade bomb failed to detonate. Active searches are underway throughout the Atyrau region."
 MAR_Kosygin.53.a: "Such reports are troubling."

 MAR_koskaz_kazakh_autobahn: "Kazakh Autobahns"
 MAR_koskaz_kazakh_autobahn_desc: "There’s no denying that Kazakhstan is merely a transit point, a supply base for our future campaigns southward. Halting expansion to the south is out of the question, and the leadership understands this. However, a logical problem arises: as a supply base, Kazakhstan is comparable to Germany as a model of communism—in other words, it’s one of the worst options for supply.\n\nBut we can fix this. Actively involving the local population in building autobahns and using new technologies will soon yield results. Embankments for future roads are already being created, allowing easy travel from one part of the country to another. And, of course, all this is done solely for the people’s benefit. Solely…"

 MAR_koskaz_arbeit_macht_frei: "Work Sets You Free"
 MAR_koskaz_arbeit_macht_frei_desc: "‘Work made man from monkey,’ goes the famous saying, and it holds true. It can also be said that without work, a man becomes a monkey. And we don’t need monkeys in our state. Therefore, we must engage as many idle people as possible in labor—namely, prisoners. Moreover, work helps a person become freer.\n\nIn the near future, we will send directives to all facilities for particularly disruptive individuals in Kazakhstan. This way, they will serve the Motherland and perhaps rethink their lives, becoming useful members of society. Additionally, we can send prisoners from other regions, where prisons cannot provide them with meaningful work, to the vast steppes. Maximizing the use of convicts is the path to their liberation."

 MAR_Kosygin.54.t: "In the Realm of Hades"
 MAR_Kosygin.54.d: "The clanging of pickaxes against stone merged into a single sound in the mines. Overseers shouted relentlessly at the workers, dissatisfied with their efforts. Prisoners were required to work multiple four-hour shifts daily. The work never stopped. Even at night, it continued, as the nation’s industry couldn’t halt for a single mine. Everything here strained and toiled for the Motherland’s benefit.\n\nSuddenly, all sounds became eerily quiet. Everyone covered their ears and ducked their heads. Seconds later, a powerful explosion roared. In one of the many tunnels, another chunk of impenetrable rock was blasted. Despite the deafening noise and disorientation, activity was already buzzing. While some cleared the rubble into carts for removal, others assessed the explosion’s effectiveness and searched for new deposits.\n\nThen, a bell rang sharply through the winding tunnels. Reluctantly, the guards shouted, 'Lunch!' signaling the end of a shift. Exhausted from the immense workload, the prisoners silently trudged outside. Other unwilling miners awaited them, ready to take their place. It wouldn’t be easy for them either. In fact, it wouldn’t be easy for anyone spending time in the mines…"
 MAR_Kosygin.54.a: "But it’s all for the Motherland’s benefit!"

 MAR_koskaz_zhuz_aesteisc: "Each Zhuz Has Its Specialty"
 MAR_koskaz_zhuz_aesteisc_desc: "There’s a simple truth: if you try to do everything at once, it turns out poorly. We’ve seen this with the centralized enterprises left to us after Russia’s unification. Fortunately, our planned economy is free of this flaw, and we must apply it in Kazakhstan.\n\nOur esteemed Minister of Economy, Maslennikov, proposed a simple but effective idea: each zhuz will receive its unique specialization, focusing on a single industry. This plan will optimize Kazakhstan’s economy as a whole and raise the standard of living across its territory."

 MAR_koskaz_return_northern_kazakhstan: "Return of Northern Kazakhstan"
 MAR_koskaz_return_northern_kazakhstan_desc: "At the turn of the 19th and 20th centuries, Russian Empire officials had a grand plan to make Northern Kazakhstan part of Russia. Although formally included, assimilation was limited or nonexistent. As a result, these territories became part of Kazakhstan during the Civil War.\n\nBut now things are different. We can complete what began nearly 70 years ago. We must undertake a massive resettlement of Kazakhs and other non-Slavic minorities to the south and relocate Russians there. While the plan seems complex and nearly unfeasible on paper, it is far simpler and more beneficial in reality. Moreover, we don’t wish to repeat the mistakes of the past…"

 MAR_Kosygin.55.t: "Redrawing the Maps"
 MAR_Kosygin.55.d: "The office was buzzing with activity. Two officials—the head of the Orenburg Governorate and the Minister of Economy—were heatedly discussing the issue of Northern Kazakhstan. When planning the operation to liberate Kazakhstan, post-war administrative divisions were not considered. But now, this issue has become more pressing than ever.\n\n'At the start of the 20th century, the Russian Empire considered a plan to assimilate and incorporate Northern Kazakhstan. That plan didn’t come to fruition then. Now, we are ready to fulfill it. Of course, we’ll need your help, but I assure you, the results will be worth it,' declared the head of the Orenburg Governorate.\n\n'I assure you, we will consider your arguments and discuss this proposal at the next Duma meeting,' replied Maslennikov, the Minister of Economy.\n\n'Very well, I suggest we determine the boundaries for redistribution using a map.'\n\n'I have no objections, colleague.'\n\nAn aide handed them a map of Kazakhstan and its adjacent territories. With pencils and other tools, they began proposing various ideas for reorganizing the borders. The discussions dragged on, threatening to turn into an argument, but a few drinks later, they were laughing heartily as they left the administrative building."
 MAR_Kosygin.55.a: "Good that it’s for the country’s benefit."

 MAR_koskaz_islamic_monbol: "Monarcho-Socialism with Islamic Characteristics"
 MAR_koskaz_islamic_monbol_desc: "Enough time has passed since Kazakhstan’s annexation to begin assessing the initial results of reforms, construction, and transformations in this Central Asian state. The head of Kazakhstan’s reconstruction, Nikolai Ivanovich Maslennikov, is ready to personally demonstrate the results to Emperor Alexei II.\n\nOur sovereign will spend several days visiting Kazakhstan to personally inspect the results of the work done. Accompanying him will be the Minister of Economy and the project’s chief ideologist, Nikolai Maslennikov. Over a few days, they will visit various parts of Kazakhstan and see the full scope of the efforts firsthand. We can only wish the Emperor luck on his journey!"

 MAR_Kosygin.56.t: "A Celebration in Akmola"
 MAR_Kosygin.56.d: "Despite the early morning, Akmola was in constant motion. How could it not be, when His Majesty Alexei II himself was arriving in the capital of newly annexed Kazakhstan? The monarch personally expressed his desire to tour the territories that had recently witnessed the horrors of war and the relief of liberation from the grip of generals and other officials.\n\nOn the main square, soldiers of the special 17th Kazakh Battalion stood in formation, awaiting the Emperor’s arrival since 7 a.m. The unbearable heat tested the soldiers’ endurance. The arrival was scheduled for 8:30, but by 8 a.m., the first vehicles of the elite escort began entering the city. Military orchestras began to play. After the Emperor’s arrival, a celebration erupted in the city. Crowds of people poured out, accompanying Alexei II’s car. Finally, his vehicle stopped at the square, and His Majesty ascended a newly built platform. There, he delivered a speech planned back in Berezniki, speaking of the unity of the Russian and Kazakh peoples, expressing gratitude to local officials for their timely and successful reforms, and offering wishes for the future.\n\nAfter the speech, a grand parade began, likely unlike anything Akmola had ever seen. The 17th Kazakh Battalion marched in full formation across Memory Square, carrying portraits of Lenin and Nicholas II. After the parade, Alexei visited Astana’s main mosque. There, he was warmly received by imams who discussed various topics with the Emperor. After a brief conversation, Alexei, as Russia’s ruler, was blessed for future wars against the Motherland’s enemies. He was genuinely moved that the population already considered Russia their homeland and promised funding at the highest level. It seemed that on that day, not only Akmola but all of Kazakhstan was celebrating."
 MAR_Kosygin.56.a: "Long live Emperor Alexei II! Our protector, ruler, and guardian!"

 MAR_Kosygin.57.t: "Forward, to the Future"
 MAR_Kosygin.57.d: "Russia is not just a machine that was broken and then fixed. No, it’s not merely mechanisms and cogs made of people. Russia is the future, something everyone should strive for. We have achieved unprecedented success in many fields, and now Russia serves as an example to all humanity of how to achieve harmony with oneself—monarchism and socialism no longer conflict but harmonize and synergize.\n\nCan we even say that Russia will soon become the most advanced country? Without a doubt. We have not only achieved unity of body and spirit but are also creating remarkable machines the world has yet to see. We are unique in every way—our nation, our political system, our technology, our economy. Perhaps the world will realize we were right and follow us. But they will never catch up, because we have already surpassed them in every respect.\n\nWhat will the future bring us? What new challenges will Russia face? We do not doubt that we will overcome these challenges, and they will only make our people stronger. But curiosity outweighs fear, and we yearn to step into the future. Or perhaps we’re already there? In any case, Russia is not just moving—it is soaring forward like a jet fighter, looming over all."
 MAR_Kosygin.57.a: "The Red Empire has already surpassed everyone."

 MAR_Kosygin.70.t: "A Good Catch"
 MAR_Kosygin.70.d: "A KGB unit was preparing to hunt down and eliminate a small group of Thronists who had been hiding in the forest for a long time. Not only were they hiding, but this cell, armed with weapons, had been terrorizing the local population, which the regional government could not tolerate.\n\nBefore the operation, the unit’s commander, Nikolai Skvortsov, gave a brief briefing to remind the soldiers of their task: 'Short and sweet for those who don’t want to get chewed out for dozing off at the wrong time. The enemy, roughly a platoon in size, has set up positions in a forested area where they’re stashing their loot. We know the camp’s location, so move fast before these bastards figure out a maneuver. A kilometer out, our unit splits, and sergeants lead their squads to encircle the scum. At the designated time, or when you hear gunfire, we hit them with crossfire. Grenades are not recommended since we need prisoners—toss them without pulling the pin to scare them. The goal is to take them down quick to grab some tongues before they bleed out. Nobody skipped first aid for a smoke break, right? Most importantly, who knows if they’ve got mines or if you’ll step on an empty can, so there’s a high chance we’ll need to storm without fully surrounding the area. In that case, the flanks’ job is to cut off their escape routes and hold until we catch the runners. Everyone clear?' The soldiers responded affirmatively.\n\nAfter advancing 18 kilometers into the forest, they spotted scattered figures among tents, crates, and dug-in trenches.\n\nThe commander looked through his binoculars and ordered over the radio, 'Ten minutes to readiness.'\n\nAt the designated time, the radio call repeated, this time ordering to open fire. The sparse figures began to fall. The Thronists were so stunned that they couldn’t organize resistance, and some were taken unarmed in their tents. Only those in a dugout had time to prepare for the approaching KGB operatives, who threw a grenade into the confined space, followed by an unpinned one for intimidation, before entering themselves. When the camp was cleared and the sounds of battle ceased, a voice came from the soldiers clearing the last Thronist hideout, now carrying out a bearded man with a leg blown off by the explosion, now roughly bandaged into a stump, wearing epaulettes from the Russian Empire and White Army chevrons.\n\n'Prisoner’s wounded, medic!' Nikolai heard. Seeing the captive’s uniform as the medic rebandaged him, the officer smirked and said to himself:"
 MAR_Kosygin.70.a: "This could work to our advantage."

 MAR_Kosygin.71.t: "Night in Vyatka"
 MAR_Kosygin.71.d: "Despite his noble origins, Vladimir Oskarovich Alexandrov-Belyaev lacked the privileges his father’s relatives enjoyed during the Romanovs’ reign. Before the Vyatka Principality joined Berezniki, he was an ordinary citizen. After the terrorist attack at the Vyatka Conference, when the government sought new personnel for law enforcement, Vladimir decided to try a new job. He started as a people’s volunteer and was later noticed by the militia, who recruited him to patrol the capital’s streets at night against various criminals.\n\nOne night, Vladimir Oskarovich and his colleague were on duty at the intersection of two streets. Suddenly, they saw several thuggish-looking men harassing a young girl.\n\n'Well, you’re caught now, bitch. Guys, grab her,' one of the criminals said. The girl’s screams and pleas for help echoed.\n\nAlexandrov-Belyaev didn’t hesitate and told his colleague to stay put while he dealt with the situation.\n\n'What’s going on here? Leave the girl alone!' Vladimir shouted at the criminals.\n\n'Listen, cop, mind your own business. Get lost while you’re still in one piece.'\n\n'I insist you leave her alone.'\n\nSuddenly, the lead criminal pulled a Nagant revolver from his pocket, aimed it at Vladimir, and repeated, 'I told you clearly, stay out of it.' Vladimir tried to disarm him, but the criminal fired, hitting Vladimir Oskarovich in the arm. His colleague rushed to the scene, helped subdue the criminals, and called the militia and an ambulance.\n\nAs the militia began investigating the scene and the criminals were taken to the police station, one of the officers called Vladimir over for a talk.\n\n'Listen, it feels like this isn’t our case anymore.'\n\n'Why’s that?'\n\n'Some new organization for fighting crime showed up. KGB, I think.'\n\n'Yeah, I’ve heard of them. But they mostly deal with tracking down the terrorists behind the capital’s attack.'\n\n'True, but with a shooting in the middle of the night, the KGB will likely take over. After the attack, they control every case like this.'\n\nAfter the officer finished, Vladimir approached the victim and offered to escort her home."
 MAR_Kosygin.71.a: "It’s restless in the capital at night these days."

 MAR_Kosygin.72.t: "All the Regent’s Men"
 MAR_Kosygin.72.d: "The Regent and the Tsar-General—two of the most powerful political figures in the People’s Empire—now lie in the same carriage, though in different coffins. Their deaths were like a bucket of cold water poured over a sleeping man. A near-fatal stupor gripped all layers of society when news of the deaths of such important figures spread across Mladorossi lands.\n\nThe procession was escorted by the entire capital militia, supported by the Georgy Pobedonostsev Guards Tank Battalion. People gathered to bid farewell to the Regent and General and to learn who would succeed them, as for some, they seemed irreplaceable.\n\nAt the farewell ceremony, Vladimir Gil declared that those responsible for the murder would be punished to the fullest extent of the law, as would anyone opposing the state. Alexei II and a now-grown Maria Vladimirovna also spoke.\n\nThe country held its breath as the cortege arrived at the burial site. As the coffins were lowered to the sounds of the anthem 'Long Live Our State,' no one hid their tears. It seemed even nature itself fell silent. After the farewell, Vladimir Gil approached the Emperor and escorted him to a waiting car nearby."
 MAR_Kosygin.72.a: "Great men meet a fitting end."

 MAR_Kosygin.73.t: "The Rat’s Nest"
 MAR_Kosygin.73.d: "Kanevsky and his men were the best of their kind, and after exposing the Kazan Hammer, they became living legends in the People’s Empire’s law enforcement. When the threat of Taborytsky’s terrorists loomed over the young state, Vladimir Gil didn’t hesitate to choose his right-hand man: Kanevsky had already dismantled numerous Thronist cells. But this time was special. According to information confessed by a terrorist, Taborytsky himself was due to arrive at this hideout that evening. Leaving the interrogated man in a puddle of his own fluids, Kanevsky and his team set out to capture the main criminal of Western Russia.\n\nThe plan was as follows: Kanevsky and his team would enter through the main entrance, while militia brigades assigned by Gil occupied every tree and rock around the hideout. No one was to escape. Kanevsky was made up at a local theater to look beaten, and his team dressed in Thronist stormtrooper uniforms. By the time Taborytsky arrived, the local Thronists were to appease their leader with this ‘gift.’\n\nEverything worked as planned: Kanevsky’s team was let through, and they began their operation in the heart of the hideout, cutting off the Thronists from the armory and disabling the alarm. Fleeing stormtroopers were caught or eliminated by the militia.\n\nOperation results: Irrecoverable losses among personnel—2; criminals killed—14; criminals arrested—21; primary target ‘Head’ not captured, as he escaped 15 minutes before the operation began."
 MAR_Kosygin.73.a: "The snake wasn’t beheaded, but it’s been thoroughly battered."

 MAR_Kosygin.74.t: "A Patch of Native Soil"
 MAR_Kosygin.74.d: "Nikolai didn’t exactly love Russia. In fact, he didn’t love it at all. Unlike many of his compatriots, it wasn’t the Russians or even Russian statehood he disliked—it was Russia itself. The winters were too cold, the autumns too muddy, and the summers and springs not warm enough. In such conditions, the soil didn’t yield as it did in his homeland, meaning Nikolai Grishchenko couldn’t properly pursue his beloved work—agriculture.\n\nBut after the region stabilized and Nikolai saved enough money to buy a plot of land and a small shop in central Samara, he decided to play his ace. During the evacuation from his native village near Zhitomir, he had taken six sacks of Ukrainian black soil. Nikolai believed that bread grown in this soil and baked by his wife Svetlana would take Samara’s markets by storm, perhaps even the entire region.\n\nIn any case, Nikolai thought that by doing this, he was preserving his culture and bringing closer the day when he could sow and harvest millet on his native farm again."
 MAR_Kosygin.74.a: "And they will know hunger no more."

 MAR_Kosygin.75.t: "Mowing the Wheat"
 MAR_Kosygin.75.d: "Ivan and Fyodor, both Ivanovs. Their family wasn’t particularly original with names. But regardless, they were brothers, and in their family, almost everything was done together.\n\nToday, they were plowing a field. On one of the hottest days of the year, they stood in white shirts, swinging scythes.\n\n'Brother, why are we doing this all by hand? We could bring the tractor.'\n\n'No, we can’t. That Ukrainian said not to use machinery, or we’ll ruin his black soil.'\n\n'What’s so special about that black soil? Dirt’s dirt.'\n\n'Listen, brother, who’d you vote for as Tsar? I voted for that one, what’s her name, Masha.'\n\n'I voted for Belozersky. But they chose Alexei.'\n\n'Yeah, things got interesting back then.'\n\n'What do you think, is this Alexei II really the…'\n\n'Shut your mouth, fool!'\n\nThe elder brother scanned the open field and shouted at the top of his lungs:\n\n'ALEXEI II ROMANOV IS THE TRUE PEOPLE’S TSAR, AND THAT’S THAT! TO HELL WITH THE THRONEISTS!'\n\n'Oh, right, yeah. ALEXEI II IS THE TRUEST PEOPLE’S TSAR! MY BROTHER AND I BOTH VOTED FOR HIM!'"
 MAR_Kosygin.75.a: "Alright, looks like we’re in the clear. Back to work."

 MAR_Kosygin.76.t: "The Proletarian’s Lunch"
 MAR_Kosygin.76.d: "'Phew… we ate till we’re stuffed, as they say. Right, Vlad?'\n\n'No kidding, Yuz. Worked like dogs all week, but eating this good? Worth it!'\n\n'Hey, how much did your brigade overfulfill the plan?'\n\n'Last week, we hit 109%. How’s that?'\n\n'Pfft, big deal. My guys did 118%. Learn from us!'\n\n'Oh, quit showing off. At least I look out for my crew. Your Grigory nearly lost his hands.'\n\n'Well, Grigory shouldn’t have been daydreaming, then his hand wouldn’t have gotten caught in the conveyor.'\n\n'Was he wearing gloves? No? Exactly! Not even basic safety gear. Even the great Lenin talked about that.'\n\n'Where’d he say that, Mr. Biographer?'\n\n'What, you think I memorized all of Lenin? He’s a mountain! No, a MONOLITH! An intellectual monolith.'\n\n'Alright, alright, let’s wrap it up. It’s 8 p.m., and we’ve got a shift starting at 7 tomorrow. Pay the bill, and let’s head home.'\n\nLooking at the bill, both workers were initially shocked by the cost but quickly remembered something. That amount would’ve been unaffordable before Alexei’s reforms. Thankfully, today’s Russian proletariat can afford to eat better than American or, especially, German workers."
 MAR_Kosygin.76.a: "It’s good to live in the Tsarist-Soviet state!"

 MAR_Kosygin.77.t: "From Prince to Pauper"
 MAR_Kosygin.77.d: "Gavriil Alexeyevich Mironovtsev was born in 1930. He received everything the Soviet regime could offer. In the 1920s, his parents were NEPmen, so Gavriil’s childhood was comfortable. He could play the accordion and quickly made friends among his peers.\n\nDuring the war, his father went to the front and was killed in the Battle for Moscow during Operation Suvorov.\n\nGavriil moved to Berezniki and worked in the Ministry of Economy. His charisma helped him make friends quickly, and he began buying and selling estates and homes in conquered territories. In Tatarstan alone, he bought 12,000 hectares of black soil and sold it to his friends. This was done to avoid being left behind by history and to adapt to the new environment. However, the creation of the KGB and the hunt for Thronists disrupted his plans. The KGB learned of Mironovtsev’s operations and began gathering evidence against him. Soon, his friends and colleagues were arrested. He realized his fate was sealed.\n\nSome time later, he was summoned to the prosecutor’s office, where he faced charges of embezzling land property.\n\nHe was then placed in Vyatka’s pretrial detention center. There, it was revealed that several deputies of the People’s Congress were also involved in his scheme. In the so-called 'Mironovtsev Case' or land affair, 20 deputies were stripped of immunity and arrested. After the trial, Mironovtsev received a 15-year sentence for plundering socialist property. While in his cell, he reflected that he had acted foolishly and had indeed been left on the sidelines of history."
 MAR_Kosygin.77.a: "He who was everything became nothing."

 MAR_Kosygin.78.t: "Moving Pictures"
 MAR_Kosygin.78.d: "Despite living most of his life in a remote Samara village, Evdokim always loved technology. At age 11, when he first saw a tractor—a relic from Soviet times—he was mesmerized. Much time has passed since then. The Vlasovites fell, and now a People’s Tsar rules, while the dilapidated tractor has turned into 15 modern combines, bringing good profit to Evdokim and his family. After Russia’s rapprochement with Japan, Evdokim could fulfill a long-held dream—buying televisions from Guangdong!\n\nArriving at the port in Arkhangelsk with a hired Russian-Japanese translator, Evdokim breezed through customs and rushed to the nearest Sony factory. His rural simplicity, kindness, and charisma were novel for the factory director, which likely helped the Russian merchant seal the deal quickly, albeit with a slight markup. But that didn’t matter—here it was, a real Japanese-Chinese television!"
 MAR_Kosygin.78.a: "Blue screen, happy face."

 MAR_Kosygin.79.t: "Speed Bump"
 MAR_Kosygin.79.d: "Evdokim sat behind the wheel of his truck, deep in thought. Tomorrow, he would sail back to the Motherland. He wondered how surprised his family would be. What shows would he watch? What would Alexei look like in color?\n\nHis thoughts were interrupted by a chain hitting the hood and a hand yanking him from the driver’s seat. In an instant, Evdokim was on the bare asphalt, being beaten by two young thugs from a triad. While they attacked him, others transferred the televisions from his truck to their vehicle. They drove off as quickly as they appeared. Evdokim didn’t stay down long. Rising, his mind was filled not with thoughts but with indignation, hatred, and a faint glimmer of hope. Rushing toward the nearest police station, he grabbed the first man with a badge.\n\n'Vaben jala!'\n\n'Duibuqi, shenme?' (Sorry, what?)\n\n'Vei ben zhala un bange rei Kuang zule dlankdi jiti!' (They stole my stuff in Guangdong!)\n\n'Shei pianle ni?' (Who tricked you?)\n\n'Yichin Ivan va vshehen di kvashennaya!' (Some Ivan and his pickled stuff!)\n\n'Shenme?' (What?)\n\n'Goddamn it!' \n\nHope seemed to fade in Evdokim’s soul. But then it flared up in an all-consuming flame! He remembered the street where his truck was during the attack. More importantly, he recalled that all the attackers had a tattoo of three rabbits!\n\n'Look!' \n\nEvdokim showed the number three, mimicked rabbit ears, and slapped his shoulder.\n\n'Riben Jefang Zhe Te!' (Japanese Liberation Front!)\n\nSuddenly, the policeman sprang to life, shouted to his colleagues through the window, and soon Evdokim was joined by six officers heading to the crime scene.\n\nAt the site, after a brief inspection, the police moved to a nearby warehouse, where the attackers were found. As the young bandits’ bones and lives were thoroughly broken under the batons and boots of law enforcement, Evdokim reloaded his televisions, bid farewell to the officer, and headed to the port. His ship was set to sail in an hour and a half."
 MAR_Kosygin.79.a: "Remember, son, never set foot in Guangdong!"

 MAR_Kosygin.80.t: "Old Maple, Young Sakura"
 MAR_Kosygin.80.d: "'I told you, Lyusenka, we left your dress in the hold, not in Vyatka.'\n\n'Oh, thank God, I was getting all worked up. It’s my first time abroad, after all.'\n\n'The main thing is we didn’t forget the camera…'\n\n'Oh, come on, Kolya. We’re in Japan—they’ve got tech stuff here you could shovel away.'\n\n'Yeah, but spending extra money…'\n\nHearing the worry in her husband’s voice, Lyusena Arkadyevna pressed her chest to his back and placed her hands on his.\n\n'Dear, tell me honestly, what’s bothering you?' \n\nAfter a heavy sigh, Nikolai Alexandrovich shared his concerns.\n\n'We haven’t finished the reports at work, and now this vacation. What if they fire me?' \n\n'Kolya, who’s gonna fire you over a vacation? Did you tell your boss?' \n\n'Well, yeah.' \n\n'There you go. Besides, you’re a hard worker, determined, and handsome. Even if they fire you, I’m not going anywhere.' \n\nAfter those words, a smile crept onto Nikolai’s face, and his anxiety drowned in a flood of memories of romantic evenings with his wife.\n\n'Thank you, my darling. I needed to hear that.'"
 MAR_Kosygin.80.a: "The main thing is we didn’t forget the jars for pickling. Though, are there even mushrooms in Nagasaki?"

 MAR_Kosygin.81.t: "A Long Day in Long Beach"
 MAR_Kosygin.81.d: "Pavel was always a man of labor, and his efforts paid off. Lounging on barley-colored sand, his ears filled with Beach Boys songs from the radio, and his throat cooled by a piña colada. Setting his drink aside, Pavel was about to doze off when something hit his face. Opening his eyes and sitting up, he saw a guilty-looking boy, with a beach ball to his right.\n\n'Mike! What did I tell you about playing with the ball on the beach?' \n\nAs the boy looked sheepishly at the ground, his father pointed at him and sent him to a less crowded part of the beach.\n\n'Hello. Sorry about my son; he won’t bother you again.' \n\n'No worries, nothing serious happened.' \n\n'Hey, buddy, you’ve got a funny accent. Where you from?' \n\n'Me? I’m Russian. Came here after our Tsar and your President established diplomatic relations.' \n\n'You Russians are an interesting bunch. A typical beach bum would’ve chewed out my kid, but you’re cool as a cucumber.' \n\n'Believe me, comrade, I’ve been hit with things heavier than a rubber ball.' \n\nBoth men chuckled, and the American gazed at the beach horizon.\n\n'What’s your name, American?' \n\n'Eric. Eric McFelon.' \n\n'Pavel Slezkin. Nice to meet you.' \n\nAfter a firm handshake, both men stared at the calm beach waters.\n\n'You know, this beach is nice, but when I was six, my family vacationed in Los Angeles before those yellowfaces occupied it.' \n\n'We’re kinda similar. My family lived and vacationed in Sevastopol until the Germans invaded. You know the rest of the story.' \n\n'Yeah, guess we’re not so different.' \n\n'You know what, Eric? I was thinking: since our countries are allies now, we’ll crush those Japanese and Germans in no time.' \n\n'If our countries keep improving relations at this pace, in 5–10 years, we’ll be flying Sevastopol to Los Angeles together.' \n\n'Yeah… Hey, isn’t that your kid?' \n\n'What?! Mike, get over here!'"
 MAR_Kosygin.81.a: "Boys will be boys."

 MAR_Kosygin.82.t: "Transoceanic Survey"
 MAR_Kosygin.82.d: "'Vadim, we’ve already covered half of California, asking people what they think of this or that politician. Where to now?' \n\n'Listen, Nikita, no whining. You agreed to come with me to the U.S. We’ve still got Oregon to cover.' \n\n'Which way’s Oregon from California? I’m no expert in U.S. geography.' \n\n'It’s the neighboring state.' \n\nFor a week, two journalists from the newspaper *To Young Russia!*, Vadim Karpenko and Nikita Vasilyev, had been traveling across the United States to gauge the opinions of West Coast residents about various American political figures. Their work involved street interviews in both large and small cities. With their work in California nearly done, they decided to move on to another state.\n\nThe drive was exhausting, so Nikita decided to lighten the mood with conversation.\n\n'Listen, Vadim, we’ve covered half of California and haven’t once summed things up. Sure, we discussed what we heard, but we haven’t drawn conclusions.' \n\n'What’s there to discuss? Some support the current government’s policies, others back their opponents. Sure, some folks support Gus Hall or Francis Yockey, but you can count them on your fingers.' \n\n'That’s exactly what I wanted to talk about. Do you think they could gain popularity and grow in numbers?' \n\n'What am I, a fortune-teller? I can’t say what’ll happen tomorrow. It’s possible, but I think it’s unlikely.' \n\n'Fair enough, as they say, “We’ll live and see.”' \n\nStopping at a local gas station, Nikita suggested interviewing its visitors about their political views.\n\nThe result: of eight people surveyed, five supported the Republican-Democratic Party, two backed the National Progressive Party, and one supported the NPP’s left wing led by Gus Hall.\n\nAfter the survey, Nikita and Vadim continued their journey to Oregon.\n\n'When we get back to Vyatka,' Vadim began, 'we’ll need a good headline for the article.' \n\n'Let’s think about it after we’re back in the capital. For now, let’s find the nearest motel to crash for the night.' \n\nAt the motel, the journalists booked a room. Vadim began reviewing recorded interviews, while Nikita jotted notes in his notebook. As Vadim slept, an idea for the article’s headline sparked in his mind."
 MAR_Kosygin.82.a: "The Rich and Diverse American Society."

 MAR_Kosygin.83.t: "Russian Roadlessness"
 MAR_Kosygin.83.d: "Arkady had endured much during Russia’s anarchy. But to have his boot half-filled with snow, pebbles, twigs, and swamp water—that was a first.\n\n'Hey, Petya, how much longer do we have to slog through this muck?' \n\n'The foreman said till eight, so another hour and a half.' \n\n'At least that. You know what I was thinking?' \n\n'What?' \n\n'They probably built a road to Surgut before us.' \n\n'Of course they did, but the Germans tore it up, the bastards.' \n\n'Well, on the other hand, it’s better than our roads in the West when they were still bombing.' \n\n'That’s all thanks to the Surgut airwomen. Locals say a lot of Messerschmitts are buried in this swamp.' \n\nArkady and Pyotr took a short smoke break. As they stared into the swamp, Arkady let out a sad but hopeful remark."
 MAR_Kosygin.83.a: "God willing, we’ll pave a road all the way to Moscow."

 MAR_Kosygin.84.t: "Courtroom"
 MAR_Kosygin.84.d: "The bunker had dim lighting, cold walls, and sparse furnishings. Apart from propaganda posters, plans, maps, and similar junk, it was bare. 'Fitting for the Chernigovites,' thought Lieutenant Shmatkov. He and his subordinates were tasked with inspecting one of Yazov’s reserve hideouts.\n\n'Nothing but weapons, Black League agent codes, and plans for some “Great Trial” found, Comrade Lieutenant.' \n\n'Then you didn’t search well enough, Comrade Junior Lieutenant. Keep looking.' \n\nFrom the next room came the unbroken voice of Private Pavlenko.\n\n'Comrade Lieutenant, I found something!' \n\nRushing to the voice, the officers saw their subordinate staring at a torn map of the Urals.\n\n'What’s the fuss, Pavlenko?' \n\n'Comrade Lieutenant, there’s, uh, a cavity.' \n\nReaching into the map, the private hid his arm up to the elbow, after which the paper tore completely. A hole gaped in the wall."
 MAR_Kosygin.84.a: "The Black League has nothing left to hide."

 MAR_Kosygin.85.t: "The Heaviest Burden"
 MAR_Kosygin.85.d: "Alexei II Kosygin. Whether he was the real Alexei II or not, he now had to be.\n\nAfter the liberation of the Urals, the Ipatiev House—the site where the entire imperial family met their deaths—came under Mladorossi control. But, as it turned out, almost the entire family, and Kosygin had to personally participate in the ceremonial reopening of his house. A group of officials and a company of journalists and reporters followed the Tsar as he recounted the chronology of that horrific day in vivid detail. Credit must be given to the Emperor—he remembered that time down to the smallest details.\n\nAfter the ceremony ended and the event moved toward celebratory drinks, Alexei remained alone. In the main room, where a glass frame held the last photograph of the imperial family taken in life, Kosygin stood in silence for about half an hour.\n\n'Forgive me,' Alexei Nikolaevich said softly. Unexpectedly, a young adjutant entered the room and, seeing the silent Emperor, asked, 'Alexei Nikolaevich, is something wrong?' \n\nThe Emperor turned and said, 'Nothing of the sort. Just remembering how it used to be here. I’ll join you in a minute. Please wait outside.' Alexei placed the photograph back and walked to his car."
 MAR_Kosygin.85.a: "The faces in that photograph seemed so alive."

 MAR_Kosygin.86.t: "Church Talk"
 MAR_Kosygin.86.d: "'Tell me, have you prepared everything for the Eucharist?' \n\n'Sorry, Father Vasily, I’ll bring it now.' \n\nAs the young deacon descended to the cellar for the body and blood of Christ, the priest climbed to the bell tower. Vasily always loved their chime, which calmed him and gave him strength even in the darkest times of the Time of Troubles. As usual, Vasily surveyed the village, but this time he saw the red banner of the new government. Too young for dementia but too old to recall the horrors his church endured during the Civil War, the priest was troubled by the possible future and descended.\n\n'Tell me, Trofim, what do you think of this new Tsar?' \n\n'Father Vasily, those are worldly matters—what’s it to us?' \n\n'If it were any other power, it’d be worldly. But these are communists. I can’t let this church suffer as it did under the Bolsheviks.' \n\n'I occasionally talk with deacons from nearby villages, and they haven’t reported anything like what the Bolsheviks might do. The People’s Empire seems to rely on Orthodoxy…' \n\nA loud knock came at the church door. Opening it, Vasily saw a grizzled man in a KGB uniform with several soldiers. His heart sank, as it had in 1918.\n\n'Father Vasily, good morning. My name is Gleb Moenko, and I represent the Committee for State Security. During searches at Dzhabba Ioseliani’s camp, we found these icons and liturgical items. Your village was the closest settlement, so we thought you might be the original owner. Can you confirm?' \n\n'Yes… Yes. Those bandits raided the church God knows how long ago. How did you find them?' \n\n'As it turns out, Ioseliani knew the Yugra terrain better than any Ural warlord. But we had better equipment. Goodbye, Father Vasily.' \n\nRecovering from the shock, Vasily’s heart rose back to his chest, filled with hope and faith. His church would no longer be robbed or desecrated."
 MAR_Kosygin.86.a: "They’re red, but not godless."

 MAR_Kosygin.87.t: "From Red to Red"
 MAR_Kosygin.87.d: "From Red to Red.\n\n'Hello, I’d like to join the party.' \n\n'Good afternoon. Please provide your name and occupation.' \n\n'Borzov Nikita Yegorovich. I work at the meat processing plant in southern Tyumen.' \n\n'Thank you very much. Please indicate your address on the form so we can send you a letter if your candidacy is approved.' \n\nAs Nikita bent over the paper, one question swirled in his mind:\n\n'Am I doing the right thing? These syncretist-fascists have perverted the essence of communism by placing a Tsar at the helm. What if I flee further east? There might still be that Soviet presidium with Yagoda. Or has it already perished in the Time of Troubles? Who knows, but I should try. Or should I…? No. I’m tired of running. First from Kharkov, then Moscow, and now Tyumen? No way, not this time. Maybe these syncretists are right, damn it. If the best Bolshevism can offer is Kaganovich and Khrushchev, then I’m no Bolshevik.'"
 MAR_Kosygin.87.a: "Reconciliation Street, House 9, Apartment 11."

 MAR_Kosygin.88.t: "Underground Jihad"
 MAR_Kosygin.88.d: "Danislan had no intention of accepting that Russian infidels had once again come to the Kazakh Dar al-Islam to kill mujahideen and impose the religion of the weak. Tonight, he and several other young men from his aul were to gather at the muezzin’s house.\n\n'Son, when you leave, take the rifle from the wall.' \n\n'Father’s? But…' \n\n'He fought communists and Russians with that rifle. It was his will.' \n\nWith the family relic on his shoulder, Danislan walked, thinking about the plan for the first attack. Maybe the party building? Or better, the militia station? They might have weapons there.\n\nLost in thought, Danislan didn’t notice reaching the muezzin’s house. A primal fear gripped him. The yard was filled with red-starred vehicles, even a few APCs. The house was swarming with KGB agents. Musa, Khadir, and other friends and acquaintances lay in a pile with slit throats and bullet-riddled heads. The muezzin was nowhere to be seen, but his screams echoed from a shed nearby. Danislan reached for his father’s rifle, but a burst of dry cracks rang out, and he ceased to feel his right arm."
 MAR_Kosygin.88.a: "Blood oozed from it."

 MAR_Kosygin.89.t: "From the Frying Pan into the Fire"
 MAR_Kosygin.89.d: "Two hours. For two hours, road repairs had been underway. Though Vasily was accustomed to the hardships and suffering of the Second Time of Troubles, no one could get used to the Kazakh heat.\n\n'Vadik, bring the mixer to Mikhalych—they’ve got some local blowing up part of the road again.' \n\n'Hell, again? They blew up the same damn spot the day before yesterday. Everyone okay?' \n\n'Looks like Petya Trepov got hit by shrapnel, but the soldiers already took him to the army hospital. And they took out the local.' \n\n'Alright, tell them I’ll finish this section and head over.' \n\nAs his companion headed toward the makeshift toilet, Vadim’s thoughts were conflicted: 'On one hand, the pay here compared to Arkhangelsk is downright royal, so I’ll definitely send my daughter to university.'"
 MAR_Kosygin.89.a: "But this damn heat is unbearable."

 MAR_Kosygin.90.t: "A Role Model"
 MAR_Kosygin.90.d: "Unlike other visiting Russian language teachers, Pavel Chirkov had lived in Akmolinsk his entire conscious life. His family, Soviet intelligentsia, moved here by party orders to combat illiteracy among Kazakhstan’s fraternal peoples. After the German invasion, that goal took a backseat to survival. But recent events allowed Pavel to teach both Russian and Kazakh, and his school, district, and entire city were rebuilt after recent battles—and improved. Pavel felt that despite past tragedies, meaning was returning to his life, found in serving the Motherland and its people—not with a rifle but with a Russian language and literature textbook.\n\nDuring one of his first Russian lessons, a longtime student raised his hand.\n\n'Pavel Yevgenyevich, why are we studying Russian now when we didn’t before?'"
 MAR_Kosygin.90.a: "Moldabek, we’re studying Russian because Kazakhstan and Russia have become brotherly again."

 MAR_Kosygin.91.t: "Fundamental Reconstruction"
 MAR_Kosygin.91.d: "The old building in the center of Koksay, built during the late Russian Empire, had seen little renovation even in Soviet times and was later forgotten entirely. But with Emperor Alexei II’s visit approaching, it was decided to begin a major overhaul three days before his official arrival. The party committee chairman and his deputy were whitewashing the main corridor’s walls while other party members worked on other updates.\n\n'Sergei Sergeyevich, couldn’t we have hired local workers?' \n\n'No, Yevgeny Yevgenyevich. At the last meeting, we decided to do it ourselves. Besides, labor made man from monkey! Maybe it’ll make something worthwhile out of us too.' \n\n'Do you think we’ll finish in time? His Majesty arrives the day after tomorrow, and we still have to polish the roof and install new gates.' \n\n'We hired people for the exterior work. From what I hear, even Arkhangelsk’s proletariat isn’t thrilled about the local heat, and we’d faint in it.' \n\n'Ugh! Sergei Sergeyevich, open the window, please, or we’ll get poisoned by this paint.' \n\nAt that moment, a young party member burst through the main door and reported in a panicked voice.\n\n'Sergei Sergeyevich, Yevgeny Yevgenyevich! The government just called. His Majesty the Emperor is arriving not the day after tomorrow evening but tomorrow afternoon!'"
 MAR_Kosygin.91.a: "Looks like the repairs will go on late into the night."
