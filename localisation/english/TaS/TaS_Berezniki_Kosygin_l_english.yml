# PRESTOL EVENTS
 MAR_Kosygin_Prestol.1.t: "Preparation..."
 MAR_Kosygin_Prestol.1.d: "REPORT\n\nTO: GIL V.V.\n\nFROM: MERENOV I.Ya., HEAD OF THE KGB DEPARTMENT FOR THE NARYAN-MAR GOVERNORATE\n\nThe first reports of the activities of the 'Tsarebozhniki' organization, which is part of the 'Prestol' terrorist network, in the far North reached our KGB department in early 196X. As a result, it was decided to send Agent (-------) to the scene to conduct an investigation and establish connections with members of the organization.\n\nAgent (-------) managed to infiltrate the organization’s ranks within the first month of the mission. Contact was established through an acquaintance with a local resident (-------), who was a sympathizer of the terrorists. He introduced (-------) to a meeting with representatives of the organization who were already part of its inner circle.\n\nTo maintain cover, Agent (-------) was forced to carry out various tasks that drew the attention of the organization’s members and express support for their ideas. This allowed him to gather more information about the group’s activities, its structure, and the locations of their gatherings and operations.\n\nAfter some time, sufficient information was collected to determine the whereabouts of the organization’s key members. It was established that they were hiding in an abandoned building on the outskirts of (-------). Agent (-------), using his skills, managed to track the building and then relay the information to our forces.\n\nThe plan to storm their hideout is fully prepared for execution. Awaiting instructions from KGB central headquarters.\n\nDate: (-------)"
 MAR_Kosygin_Prestol.1.a: "Proceed with the plan. V.V. Gil"

 MAR_Kosygin_Prestol.2.t: "...And the Assault."
 MAR_Kosygin_Prestol.2.d: "The early, dark morning, typical for these lands. On the outskirts of the city, special forces gathered: KGB agents, police officers, and OMON fighters. All were in full combat readiness, with a single task—to storm the main headquarters of radical Orthodox terrorists.\n\nEarlier, KGB agents conducted thorough reconnaissance and pinpointed the location of the terrorists’ headquarters. Based on the gathered information, an operation plan was developed. It was meant to be swift and silent to prevent the terrorists from preparing a counterattack.\n\nBut at the scene, the agents realized the plan might fail—the terrorists were expecting them. The Orthodox fanatics were armed to the teeth: rifles, pistols, grenades. They knew the full force of the special services was aimed at them and were ready for battle.\n\nThe KGB agents decided to take a desperate step. Their unit, led by the commander, began slowly advancing toward the terrorists’ headquarters, using a T-62 tank for cover. OMON special forces supported the combat group from the other side to create dual pressure on the terrorists.\n\nThe terrorists opened fire, and returning fire was difficult—they were well-fortified. But suddenly, their fire slackened. The combat group commander, seizing the opportunity, ordered an advance. The first defensive line protecting the headquarters was broken.\n\nThe terrorists, realizing their chances of victory were slipping away, began to retreat, hoping to escape and continue their subversive activities. Most surrendered, but some abandoned their weapons and fled into the forest. An additional OMON detachment has already been sent to pursue them.\n\nThe operation resulted in the capture of several Prestolniki, though most were eliminated for resisting. We hope that the 'Prestol' hydra will no longer be able to raise its head here."
 MAR_Kosygin_Prestol.2.a: "The hydra has lost one of its heads."

 MAR_Kosygin_Prestol.3.t: "The White Devil’s Hideout"
 MAR_Kosygin_Prestol.3.d: "Today, the KGB building in Vyatka was bustling with activity. After receiving data from agents embedded in Onega, operations immediately began.\n\n'The information from our agents isn’t particularly encouraging. However, we now know who we’re dealing with,' the agent said, pulling out several photographs and pinning them to the board.\n\n'Anticommunist brigades in the Arkhangelsk region are receiving supplies directly from Onega, possibly with direct involvement from Finland. The bandits have looted several villages. Notably, according to agent reports, a local schism within 'Prestol' has occurred in the North, with one rebellious village joining the so-called Narodnaya Krasnaya Armiya, resulting in the Anticommunist brigades massacring the defectors. Unfortunately, we cannot capitalize on this. But the fact remains—to destroy this Prestol cell, we must invade Onega.'\n\nSilence fell over the briefing room. A war with Finland, effectively, in such unstable conditions? Madness! However, it seems there is no other choice."
 MAR_Kosygin_Prestol.3.a: "We must advance."

 MAR_Kosygin_Prestol.4.t: "Do You Recognize?"
 MAR_Kosygin_Prestol.4.d: "Kirpichnikov sat in the truck. As a leader, he bore far greater responsibility than those who chose to follow him. What did he hope to achieve in the end? Perhaps he himself didn’t know. Maybe at some point, he genuinely believed that liberating Northern Russia from communists would improve the lives of Russians. But what difference does it make now, when you’re being driven to your execution?\n\nSuddenly, the moving truck stopped, and the shouts of soldiers were heard. Was the road blocked? Did someone, in their desperation, attack the convoy? What difference did it make... Amid the soldiers’ shouts, he heard a familiar voice, stirring something... good in the recesses of his memory. But at the same time, infinitely sad. 'Please, I must speak with him!' the unknown voice pleaded. Could it be...\n\nA soldier from the principality burst into the truck and gestured for Kirpichnikov to exit. The cold White Sea air and wind immediately reminded Kirpichnikov that he was still alive. Several armed men stood before the convoy, but they showed no aggression toward the escorts. Then, one of them, in a white uniform with a cap in hand, rushed forward despite the soldiers and the tense atmosphere.\n\nCold hands touched Kirpichnikov’s face.\n\n'Volodya, it’s me! Do you recognize?!' The old man who rushed toward Kirpichnikov seemed to forget his advanced age, rejoicing like a child meeting a friend.\n\n'Sasha... you’re... alive.' Vladimir recognized him. Alexander Medvedev, with whom they had fought the fascists together. Time had spared neither of them.\n\n'How did it come to this?' Medvedev’s gaze lost its liveliness, likely realizing the circumstances of this reunion. A single tear rolled down his cheek.\n\nThe traitor couldn’t respond; too much water had passed under the bridge since then. He only averted his gaze and tried to turn away.\n\n'Forgive me for how this turned out. And farewell.' The man in the white uniform reached for something near his belt. By the time Kirpichnikov realized what was happening, it was too late. A flash..."
 MAR_Kosygin_Prestol.4.a: "The snow was stained crimson."

 MAR_Kosygin_Prestol.5.t: "Unexpected Revelations"
 MAR_Kosygin_Prestol.5.d: "Long ago, when the Komi Republic still existed, Kosygin dealt with ultra-right fascists, the so-called 'Passionaries.' Without delving too deeply into their ideology, Kosygin immediately understood that their ideas were extremely fascist, and what surprised him most was that Gumilyov’s passionary theory was even taken seriously in academic circles, though many of its tenets could (and should!) be challenged. Besides him, there was also a certain Igor Shafarevich, once a respected mathematician who had turned to politics. In theory, he too was connected to 'Prestol.'\n\nAnd yet, they had to be spoken to. The current priority is the fight against 'Prestol.' Even though they are in prison, they remain highly dangerous to us, as they could communicate with the 'Prestolniki.' We must first attempt to interrogate them.\n\nThe first person to enter Shafarevich’s interrogation cell began the questioning.\n\n'Surname, name, and patronymic,' the interrogator began.\n\n'Shafarevich, Igor Rostislavovich.'\n\n'Alright, I want to talk with you. I won’t ask overly complicated questions, so...'\n\n'I’ll tell you everything you need,' Shafarevich suddenly interrupted.\n\n'...Excuse me?' the interrogator said, surprised.\n\n'I won’t resist you. It’s pointless for me.'\n\n'That’s unexpected. Why?' \n\n'There’s no point in hindering your fight against 'Prestol.' I know perfectly well the situation you’re dealing with regarding Taboritsky’s people. I have my own personal scores to settle with that madman, and it’s better for me if you defeat him.'\n\n'This is very unexpected from you. Well then, please tell me everything you know about him.'\n\nShafarevich crossed his arms in a defensive posture and began speaking:\n\n'I’ll start by saying that this man is a complete lunatic, a deranged monarchist who believes Alexei Nikolaevich is still alive. The same one the Bolsheviks executed in 1918. I’m amazed anyone followed him at all, as any sane person wouldn’t. Perhaps it was all a joke?'\n\n'So, you believe this man genuinely thinks Alexei is alive? Then why is he against our current Tsar?'\n\n'Because he believes your Romanov isn’t real,' Shafarevich said firmly. 'If my memory serves, he’s Kosygin. I often saw him on the political stage in the Komi Republic. And though Kosygin, posing as a Romanov, seems to me the fraud of the century, he’s still far better than that deranged Taboritsky.'\n\n'What else can you tell me?'\n\n'I’m certain some of my associates are part of that organization. I can’t say exactly how many or who specifically, but I’m sure they’re there. It’s mathematically logical.'\n\n'What do you know about Taboritsky’s whereabouts?'\n\n'Unfortunately, I can’t say anything,' Shafarevich replied.\n\nThe first interrogation of Igor Shafarevich concluded. More interrogations lie ahead. However, such revelations have never come to us so easily before."
 MAR_Kosygin_Prestol.5.a: "What will Gumilyov tell us now?"

 MAR_Kosygin_Prestol.6.t: "No One Steps into the Same River Twice"
 MAR_Kosygin_Prestol.6.d: "From the interrogation of Gumilyov, which was as forthcoming as Shafarevich’s, certain details emerged. It was revealed that members of the 'Passionaries' party joined the 'Prestol' organization, and their main base in Komi is located in an unremarkable house on the eastern outskirts of Syktyvkar. This two-story building is notable for being a meeting place for the 'Passionaries' and other radically right-wing groups. Gumilyov learned from his comrades that the 'Prestolniki' headquarters in Komi was located in the same place.\n\nUpon learning of this, a local operative unit was immediately dispatched. The assault on the building was planned so that the 'Passionary-Prestolniki' would not even have time to resist. By beheading the local 'Prestol' movement in this location, we automatically deal a crushing blow to the entire network, and once this happens, the organization’s members will no longer be able to act in a coordinated manner.\n\nThe assault was scheduled for 1 a.m. The operatives began the operation, and everything went according to plan: all these individuals were captured, and the entire 'Prestol' cell was destroyed without a single shot fired. The operation took about two minutes. All of them are being sent to prison for further action."
 MAR_Kosygin_Prestol.6.a: "Finally, this den has been shut down."

 MAR_Kosygin_Prestol.7.t: "Crime..."
 MAR_Kosygin_Prestol.7.d: "Due to harsh working conditions and low wages, Ivan Prokhorov was forced to survive by any means. An opportunity arose when certain individuals approached him, offering good money in exchange for small amounts of explosive material. The offer seemed very appealing to Ivan, despite it being outright criminal. Prokhorov had done this several times already, even though he was checked for such materials. Apparently, they didn’t look closely enough.\n\nIvan Prokhorov stole explosives again, almost without realizing he was committing a crime once more. Calmly leaving after another workday, he headed to the usual spot where he delivered the materials. Nothing seemed amiss until two men approached him from behind, grabbed his arms, and dragged him around a corner.\n\n'Hey, what’s this!? Who are you?! Let me go!' Prokhorov shouted, trying to resist and break free from the unknown men.\n\nShortly after, when they had dragged him around the corner, a man in an officer’s uniform appeared before him and addressed him:\n\n'Ivan Prokhorov Petrovich. I am an officer of the Ministry of Internal Security,' he said, showing his identification documents. 'No need to panic, young man, and listen carefully. You’ve committed multiple thefts at production sites, but we can resolve all your problems if you help us.'\n\nIvan Prokhorov was scared but calmed down slightly after a few seconds to say:\n\n'What do you need?'\n\n'We need you to help us find the people you’re selling your explosives to. They are terrorists from the 'Prestol' organization. Don’t worry—you’re not on the suspect list, but you can help us take them down.'\n\n'Yes, I agree... I’ll help you,' Ivan Prokhorov said, somewhat dazed.\n\n'Good. I’m glad you understand. Tell us, where are they?'"
 MAR_Kosygin_Prestol.7.a: "Crimes stem from unfavorable living conditions."

 MAR_Kosygin_Prestol.8.t: "...and Punishment"
 MAR_Kosygin_Prestol.8.d: "Ivan Prokhorov provided information about where he sold the explosives. The operative unit took their positions to catch those receiving the explosives. Twenty minutes after the operatives arrived, the 'Prestolniki' showed up at the meeting point.\n\nAs it turned out, the 'Prestolniki' were expecting a large shipment of explosives meant for Taboritsky’s main group. From their conversations, it was clear this was their last meeting here, and they expected several suppliers from different factories in Gorky. However, this was not to happen.\n\nSuddenly, the operatives launched their operation. Escape routes were immediately cut off, and anyone who resisted was killed with shots to the torso. The leader of this 'Prestol' cell was captured and sent to prison.\n\nAll those involved with this organization were extremely poor workers. Therefore, the operatives sent a request to the central authorities to increase wages at the Gorky factories. This would help prevent such situations in the future."
 MAR_Kosygin_Prestol.8.a: "A well-fed person will not go against the authorities."

 MAR_Kosygin_Prestol.9.t: "Chase in the Forest"
 MAR_Kosygin_Prestol.9.d: "Hans ran down the road without looking where he was going. Just minutes ago, his squad of true Aryans was attacked by the forces of those damned mongoloids. The idiots got scared of the 'Untermenschen' and scattered in all directions; those who tried to fight back were gunned down. What idiots were assigned to his command.\n\nThe forest, however, showed no signs of ending, and the Aryan’s mind began to feel the pressure of the surroundings. The trees seemed like monsters, stretching out their bony hands. A terrifying figure kept peering from behind these monsters, as if the forest king himself wanted to revel in such a hunt.\n\nThe ancient treetops blocked the sky, and something grabbed the officer by the legs. A wooden creature seized him, refusing to let go. A little more, and it reached its thin limbs toward his head, after which the world plunged into darkness...\n\nA soldier from the People’s Principality army, catching his breath, approached. 'Damn, what a runner this bastard was. We’ve caught worse,' he muttered. The Aryan didn’t react to the soldier’s musings, which was highly unusual. 'No, no, don’t tell me you...' The soldier forgot his fatigue and approached the body. Turning it over, he found the Aryan unconscious but alive. During his escape, he had tripped over a fallen branch and hit his head, knocking himself out. Nothing critical, though. Only frustration nagged at the soldier, as he now had to carry the body back to the squad."
 MAR_Kosygin_Prestol.9.a: "At least we’ll have someone to interrogate."

 MAR_Kosygin_Prestol.10.t: "The Last of the Brothers"
 MAR_Kosygin_Prestol.10.d: "Thanks to that first interrogation, we have information about the surviving remnants of the Ariyskoe Bratstvo, who, apparently, are still fighting against our forces. Likely in contact with 'Prestol,' they intend to reclaim what was lost during the Battle for Western Russia. However, they will not succeed, and our special services will deliver the final, decisive, and fatal blow to this hydra.\n\n'Our troops are in combat readiness,' Dmitry reported via radio.\n\n'Understood. The other units are ready as well. Begin Operation 'Swastika.' Finish off these Nazis!' replied the combat operations headquarters.\n\n'Yes, sir, executing.'\n\nAt 8 a.m., a flare shot signaled the other units to begin the operation. The Ariyskoe Bratstvo partisans were caught off guard but attempted to form a circular defense. Using stolen weapons from warehouses, they tried to fight back, but the operatives easily broke through their first lines of defense. Notably, there were no prisoners taken, as the order was clear: do not take regular rank-and-file partisans alive, only their commander.\n\nThe entire battle lasted about an hour, and the Ariyskoe Bratstvo partisans were annihilated. The fight was a slaughter. The last of the 'Brothers' was a man named Adolf Meyer. He was sent for interrogation, where he remains."
 MAR_Kosygin_Prestol.10.a: "They’ve finally been crushed."

 MAR_Kosygin_Prestol.11.t: "Escort Mission"
 MAR_Kosygin_Prestol.11.d: "'Do we really have to chase such small fry? Why not go after officers?'\n\n'The driver knows exactly where to go. And this truck is the only one that fell far enough behind the convoy.'\n\n'Seriously, they’re so careless they let this happen? And if they hadn’t gotten stuck, would we have chased them all the way to Moskowien?'\n\n'Even to Germany if needed. As for the first point—when Vlasov was gone, KONR passed to Artsezo, and he doesn’t care about anything that doesn’t make him money.'\n\nIn the middle of a forest road, a lone truck marked with KONR symbols was stuck in the mud. Its wheels, mired in the dirt, couldn’t free the vehicle. Several soldiers and the driver had been struggling with the elements for four hours but seemed unable to do anything without help. Suddenly, their efforts to free the truck were interrupted by a shout from behind: 'Stuck? Maybe we can help?' The voice belonged to none other than the commander of a West Russian People’s Principality squad. In an instant, the KONR soldiers found themselves surrounded by about half a dozen armed men. The soldiers dropped their weapons in surprise, and the driver tried to climb back into the cab. That attempt was cut short.\n\n'Where do you think you’re going?' the commander said, grabbing the driver by the belt and pulling him back. In seconds, the driver was lying in the wet mud, staring at the barrel of a pistol pointed at his face. 'So, where were you headed?'\n\n'Don’t shoot! To Moskowien for cargo.'\n\n'And then where?'\n\n'I don’t know. The meeting point was changed, and we’d only learn the location after crossing the Samara border.'\n\n'Damn it... Alright, get up, we’ll give you and your men a ride.'"
 MAR_Kosygin_Prestol.11.a: "Better than nothing."

 MAR_Kosygin_Prestol.12.t: "The Limits of the Permissible"
 MAR_Kosygin_Prestol.12.d: "Ministry of Internal Security Report – No. 007451\n\nON THE INTERNAL SECURITY OPERATION.\n\nCLASSIFIED.\n\nAt 12:00, our operatives conducted Operation 'Border' in the Samara region to suppress the activities of 'Prestol' in this region.\n\nOperation Status: COMPLETE SUCCESS.\n\nDetails:\n\nOur operatives detected suspicious activity in this region. Trucks bearing markings of the Committee for the Liberation of the Peoples of Russia crossed the border of the West Russian People’s Principality from Reichskommissariat Moskowien. Immediately upon discovery, the 'Alpha' squad launched an attack on the convoy. The capture of the convoy yielded:\n\n12 GAZ-AAA trucks\n\n100 rifles\n\n50 grenades\n\n5 anti-tank rocket launchers\n\n10 pistols\n\nAmmunition for them.\n\nA map of convoy movements.\n\nUsing this map, the 'Alpha' squad coordinated the actions of other units, which struck in the area of the small town of Terenga, where a KONR detachment was based. After a brief battle, the KONR detachment was destroyed by our forces, and the leader of the detachment was taken prisoner. Interrogation is pending.\n\nRecommendation: It is necessary to investigate our border troops for connections with 'Prestol.'"
 MAR_Kosygin_Prestol.12.a: "Didn’t we already kill Artsezo?"

 MAR_Kosygin_Prestol.13.t: "Operation 'Fall'"
 MAR_Kosygin_Prestol.13.d: "From the interrogations of all the prisoners we captured in previous operations, we have determined the true location of Taboritsky and the center of his entire network. It is located on the border with Western Siberia—in the Ural Mountains, in the Gayny region. The fact that he has a base there is a curious detail, at least as it seems to Vladimir Gil, who decided to personally lead this operation.\n\nThe most experienced operatives were deployed for the mission. Those who haven’t yet fallen to enemy bullets, terrorist attacks, or other dangers, and those who have simply done their jobs well, are expected—hopefully—to complete this final task that will bury 'Prestol' for good. Even equipment was deployed: BTR-60s will provide fire support for the operatives.\n\nThe operation was set to begin at 23:30, when the sun would fully rise, to deliver a crushing blow to 'Prestol.' Flares and flashlights would help locate the last terrorists in the area.\n\nAt 23:30, Vladimir Gil himself fired a red flare, signaling the operatives to begin. Several illumination flares were then launched into the sky, lighting up the terrain. The operatives advanced under the light of the flares deep into the forest, moving toward its edge to reach Taboritsky himself.\n\nThe 'Prestolniki' immediately realized what was happening. Lessons from the recent Operation 'Swastika' were applied, and now the 'Prestolniki' took defensive measures. Evtukovich, alongside Viktor Larionov, organized a defense with the last of 'Prestol’s' forces. Lacking sufficient explosives, weapons, and manpower by this point, their defense was shaky. Their only assets were hatred for the new regime and determination to resist to the very end, despite these limitations.\n\nA firefight began, which the 'Prestolniki' initially withstood, but their defenses soon showed massive gaps.\n\n'Sergey, you’d better run,' Viktor Larionov said to Sergey Taboritsky.\n\nTaboritsky, in a state of confusion, realizing his end was near, agreed with Viktor’s suggestion. But he fled without any escort, running toward the Ural Mountains with only a Bible in his hands.\n\nThe battle continues..."
 MAR_Kosygin_Prestol.13.a: "That coward fled! Catch him!"

 MAR_Kosygin_Prestol.14.t: "The Advent"
 MAR_Kosygin_Prestol.14.d: "Taboritsky fled so far into the Ural Mountains that it seemed he might soon cross the border of Western Russia and reach Western Siberia. Gasping for breath, he climbed a mountain where snow grew thicker with each step. Taboritsky ran blindly, driven by the realization, even in his clouded mind, that this was likely the end. The sacred, truly Russian Orthodox Russia had just been lost, finally falling to the Judeo-Bolshevik mimicry. It was over.\n\nTaboritsky was exhausted when he spotted a small lake reflecting the moonlight. Its water was crystal clear, safe to drink without fear. Suddenly, Taboritsky felt an overwhelming thirst and approached the spring. As he drew closer, he slowed to peer into the water, growing more horrified with each second—the crystal-clear spring was turning blood-red.\n\n'What does this mean? Hallucinations? Is this real? What is it?!' Taboritsky muttered to himself, clearly confused.\n\nA sudden adolescent voice startled him: 'You failed your task.'\n\nTaboritsky looked around and saw, to his left, the figure of a boy, whom he unmistakably recognized as Alexei Romanov. He couldn’t believe his eyes, trembling with a hellish mix of emotions: fear of what would happen next, joy that he had been right, amazement at finding Alexei, and shock at the sight before him. Which emotion prevailed? Fear. It soon dominated all others.\n\n'Forgive me, Alexei... I couldn’t do it. I tried...' Taboritsky began, kneeling before Alexei Nikolaevich.\n\n'It’s alright. I saw everything. You failed, but I forgive you.'\n\n'Really?'\n\n'Come with me. We have other tasks where you will succeed.'\n\nTaboritsky wanted to follow Alexei, but suddenly he felt a sharp headache, collapsed from exhaustion, and fell to the ground..."
 MAR_Kosygin_Prestol.14.a: "Is he real?"

 MAR_Kosygin_Prestol.15.t: "The End of 'Prestol'"
 MAR_Kosygin_Prestol.15.d: "After a brief battle in which the entire 'Prestol' was destroyed and the terrorist leaders were captured, a forward search team began looking for Taboritsky in the area. Everyone feared he had escaped to Western Siberia to continue his schemes, but luck was on our side.\n\nThe forward team found Taboritsky’s body near a small lake. A small pack of wolves surrounded the corpse, seemingly about to eat it but didn’t. Why? It’s unclear. Nonetheless, the wolves scattered when the team approached.\n\nIdentifying the body was easy, but the cause of death—likely a brain hemorrhage—was less clear. It was decided to bury Taboritsky’s body nearby in an unmarked grave, so no one could ever identify it.\n\nThe complete destruction of 'Prestol' was reported to Gil, who relayed the news to Alexei Kosygin. Now that 'Prestol' is no more, the country can finally be governed properly."
 MAR_Kosygin_Prestol.15.a: "This madman has finally been stopped."

 MAR_Kosygin_Prestol.16.t: "Collapse"
 MAR_Kosygin_Prestol.16.d: "Shadows loomed over Kosygin-Romanov. The battle of shadows, otherwise known as the fight against the 'Prestolniki,' is proving extremely difficult. Even if there is progress somewhere, it is not a decisive blow against 'Prestol.' Their forces seem endless, like devils from the underworld—impossible to defeat, only to be banished temporarily before they return. These fiends are breaking the state that the Mladorossi worked so hard to build.\n\nA year has passed since the assassination attempt. Kosygin knew they would try to strike sooner or later. If not within a week or a month, then in six months or a year. It seems the time is nearing, and soon there will be a second, successful attempt. All that remains is to wait, as nothing can be done—'Prestol' has proven too strong for us.\n\nKosygin needed fresh air to clear these dark thoughts. But as soon as he stepped outside, a bullet struck his head. A sniper, positioned across the street, had been waiting for his target. Kosygin fell with a dull thud.\n\nThe deed was done. Kosygin was dead. 'Prestol' won this battle. It’s over."
 MAR_Kosygin_Prestol.16.a: "A tragic end for the Mladorossi."

 MAR_Kosygin_Prestol.17.t: "Epilogue of the Mladorossi"
 MAR_Kosygin_Prestol.17.d: "After destroying Kosygin’s authority in Western Russia, 'Prestol' attempted to seize power in the country. Taboritsky, declaring himself regent of the now Holy Russian Empire, discovered that his organization, 'Prestol,' was falling apart. Many supporters broke away, having backed Taboritsky only because they rejected Western Russia’s authority. The remnants of former pseudo-leaders began splitting off, declaring their own rule over various regions.\n\nAt the same time, Vladimir Gil, Prime Minister of the West Russian People’s Principality, announced his seizure of power, but his forces were insufficient to subdue all other regions. The regions began breaking away from the Principality, and a dual power structure emerged in the country. However, there will be no fight for a unified Western Russian throne—Taboritsky and Gil cannot establish any significant influence over the territory, and in the end, everything reverted to its previous state.\n\nWestern Russia is slowly but surely descending into chaos. There is no unified authority, no unified border, and once again, as in the era of warlords, internal borders are appearing in this once-united country. If Western Russia is to see a single ruler again, it won’t be anytime soon. Famine, wars, and ruin have once again descended upon this part of Russia."
 MAR_Kosygin_Prestol.17.a: "This is the end."

 MAR_Kosygin_Prestol.18.t: "A Play in the Wilderness"
 MAR_Kosygin_Prestol.18.d: "Late morning. A country road. A GAZ truck with two men in the cab drives through bumps and potholes from the forest to the city. Nothing foreshadows trouble. The radio plays serenely on one of its stations, the cargo in the back rattles, complementing the symphony of the radio and the driver’s conversation with the passenger. Suddenly, a strange bald, bearded man runs out of the forest onto the road, shouting for help.\n\nThe truck stops at the roadside as the man runs to the door. He practically crawls to the driver on his knees. The men ask about his condition, but the old man continues to sob. Unsure what to do, they decide to fetch a sedative from the first-aid kit. But...\n\nA shot. Then a second. The entire forest comes alive. Birds, startled by the gunfire, fly off in all directions, while other forest creatures try to hide. Two lifeless bodies fall face-down to the ground almost simultaneously. The man holsters his weapon and lights a cigarette.\n\nAfter calming down, he inspects the cargo in the GAZ. 'Nothing useful. When did they stop making decent stuff?' he mutters to himself, pulling out a notebook and pencil. Opening one of the last pages, he rereads neatly written text: 'Task: Eliminate key 'Prestol' agitators. Do it quietly. If possible, retrieve important documents and deliver them to headquarters. Task status: ____.' In the blank, he writes: 'Completed by Serov I.A.' After inspecting the truck again, he steps off the road and disappears into the taiga."
 MAR_Kosygin_Prestol.18.a: "Await further instructions, over..."

 MAR_Kosygin_Prestol.19.t: "Swift and Precise"
 MAR_Kosygin_Prestol.19.d: "Another unremarkable day was underway. The sound of a printing press churning out newspapers filled the building, stack after stack. Hundreds of paper copies with identical content were dipped in ink and pulled out seconds later. Their front pages boldly proclaimed: 'Alexei Kosygin – LIAR!' It seemed this routine would continue all day without change.\n\nThe clock’s hand slowly approached 2 when a deafening clang rang through the air. It felt as if someone had struck a gong inside the building. Seconds later, heavily armed fighters stormed in. Through the ringing haze, shouts could be heard: 'ON THE FLOOR, YOU SONS OF BITCHES! ON THE FLOOR!'\n\nWithin minutes, it was over. The printing house director was dragged from his workplace and shoved into a police van already packed with other employees of the publication. They were being taken to the main KGB office in Berezniki, where they would spend the rest of their lives. Simultaneously, the printing press was halted. Hundreds, even thousands, of newspapers were carried out and loaded into the back of a GAZ truck, packed into boxes. Their fate was clear: in an hour or so, these boxes would be burned at a landfill near Berezniki. The fighters also tried to knock down the sign with rifle butts: 'Prestol Typography.'"
 MAR_Kosygin_Prestol.19.a: "Yes, Comrade Gil, the operation was executed flawlessly."

 MAR_Kosygin_Prestol.20.t: "The Perfect Plan"
 MAR_Kosygin_Prestol.20.d: "Heavy rain had been falling in Berezniki for two days, and according to forecasters, it wasn’t stopping anytime soon. The drumming of raindrops clattered loudly on the balcony, preventing the man from smoking in peace. Realizing he couldn’t relax properly, he stepped back into the apartment and closed the door. 'Damn weather,' he grumbled. 'We’ll have to act fast, or everything will get soaked to hell.'\n\nAfter listening to his companion, the young man fiddled with the radio again, chaotically tuning the frequency. After a few minutes of struggle, he finally connected to the right channel and transmitted briefly:\n\n'Goose, this is Hut, over. The weather’s awful, we need to act fast.'\n\n'Hut, this is Goose, over. Understood, we’ll act quickly.'\n\nThe headphones filled with static again. It seemed to blend perfectly with the sound of the rain, creating a symphony no worse than those in philharmonics or theaters. While one end of the line mused about music, the other was holding a final briefing:\n\n'...The plan has changed. We need to act fast. Reason—rain. We have literally five minutes for everything. If you miss the moment, we’re all done for. Clear?'\n\n'Yes, sir!'\n\n'Alright then, take your positions and stick to the plan. Remember, the truth is more important than life!'\n\nWith those words, four men hid in the luggage compartments of an Ikarus bus carrying Party members to a congress in the capital. They would spend about three hours there to, in a five-minute window when the Party members disembarked, plant explosives in pre-designated spots in the Party building and leave Berezniki the same way.\n\nThe entire operation, lasting five minutes, was executed flawlessly. The charge was planted and set to detonate when the bus with the operatives left the city. And finally, when the signal to detonate was given..."
 MAR_Kosygin_Prestol.20.a: "The Party headquarters was blown to pieces."

 MAR_Kosygin_Prestol.21.t: "Taboritsky’s Gang"
 MAR_Kosygin_Prestol.21.d: "Once again, in the headquarters hall of 'Pamyat,' he held a meeting. But this time, it was more than just a routine propaganda session. This time, he spoke of a truly horrific event—the terrorist attack on Potemkin Street. Standing at the podium, he first honored the fallen with a minute of silence. Without exception, everyone present stood and fell silent for a moment. After paying respects, he began his fiery speech:\n\n'Comrades! I cannot believe this actually happened. I don’t want to believe that people in their right minds could do such a thing. I cannot believe that such an immoral and horrific act could be committed by a Russian! Our nation is the greatest in the world, and I cannot stay silent about this! I will shout with all my might so that our great people hear the truth! And the truth lies in the fact that behind this terrorist act stands the infamous organization 'Prestol.'\n\nThe room gasped, but it was clear they weren’t surprised—more like their fears were confirmed.\n\n'Yes, yes, you understood correctly, my dear friends! Behind all this is Taboritsky and his pathetic band of followers. These societal outcasts, who can’t handle criticism and resort to insults—this is all them! I knew they were radicals; moreover, we ourselves are the radical wing of Alexei II, but to this extent... Can you imagine a situation where, to achieve a goal, you have to kill your own compatriots? I can’t! But Taboritsky and his criminal gang can! My verdict is this: 'Prestol' and all who defend it are traitors to Russia and the Russian people! Such scum must be crushed like cockroaches! And that’s exactly what I expect from Alexei II! I’ll bash my head in, but I’ll reach his office and convince him to take appropriate measures! Because if there’s anyone I cannot doubt, it’s Alexei Nikolaevich. He can strangle these murderers and scoundrels with an iron grip, I know it! For Alexei Nikolaevich is a great man! At the crack of dawn, he spoke on the radio to support the people, took immediate measures, and ordered sappers, engineers, and other specialists to be sent to the site of the tragedy. Because he loves Russia, he loves Russians, and that is the main aspect of Pat-ri-o-tism! Hurrah for Alexei Nikolaevich, the Russian monarch!'"
 MAR_Kosygin_Prestol.21.a: "The hall erupted in thunderous applause."

 MAR_Kosygin_Prestol.22.t: "Not at the Right Hour"
 MAR_Kosygin_Prestol.22.d: "Night quickly descended on the city, enveloping it in its embrace. A faint strip of light lingered on the horizon, barely illuminating the tops of high-rise buildings. But most of the city was lit only by streetlights and lamps. Lights flickered on in nearly every window as dinners, guest visits, and other family events began. Despite the horrors, the city continued to live.\n\nDue to the rising crime rate, emergency measures were introduced to combat it. One such measure was a curfew, requiring all citizens to stay in their residences from 10:00 p.m. to 6:00 a.m. These measures aimed to enhance public safety. The People’s Militia and military units assigned to patrol the streets enforced compliance. Violators were to be taken to the nearest police station. But these measures weren’t always strictly followed.\n\nAt 10:30 p.m. on one of the days of heightened public protection, a soldier patrolling a residential area spotted a group of minors playing outside. Checking the time, he approached them, but they either didn’t notice him or chose to ignore him. Finally, he stepped onto the playground, where he was noticed.\n\n'Young people, do you know what time it is?'\n\n'What’s the matter, are we late for something?'\n\n'Absolutely. The curfew started half an hour ago.'\n\n'Get home, or you’ll have to take a trip to the nearest station.'\n\n'Thanks for the info, private. We’ve noted it and, weighing the pros and cons, decided to take your advice.'\n\n'Smart thinking.'\n\nAfter the conversation, the boys turned and headed to their apartment buildings, shaking hands with each other. Soon, no one was left in the courtyard except the soldier. Realizing the job was done, he continued patrolling the city."
 MAR_Kosygin_Prestol.22.a: "The safety of citizens comes first."

 MAR_Kosygin_Prestol.23.t: "Principles of the People’s Militia"
 MAR_Kosygin_Prestol.23.d: "Five men walked through the empty, lantern-lit streets of Berezniki. Red armbands on their sleeves marked their affiliation with the Militia, formed in Berezniki due to the massive rise in crime linked to the terrorist attack at the Party headquarters. Occasionally, cars passed by, catching the militiamen’s attention as they turned to watch them go.\n\nStreet after street, block after block, nothing notable happened. The moon, occasionally peeking through the clouds, was often their only companion. Surprisingly, their arsenal was limited to their fists, which seemed odd given that some criminals were armed. But most were merely looters robbing stores.\n\nMidnight approached. Eyes grew heavy, yawns overtook the brave fighters protecting order in Berezniki, and their legs stumbled. They wanted to give up, go home, ask to stay with someone, or just sleep on the street. Sleep was mercilessly overpowering. It seemed it would end this way until the squad leader noticed a broken shop window. 'Quiet!' he hissed to his men. The team fell silent instantly. Carefully approaching the shattered storefront, the commander signaled everyone to gather. 'You stay here; the thief might try to run,' he whispered to one of the men, who nodded in agreement. The commander surveyed the area and climbed into the store, followed by three other militiamen. Signaling directions for the search, he moved forward. The others fanned out, searching the department store. The shelves were half-empty, explained by the public’s panic. Meter by meter, they neared the back of the store when a piercing scream came from outside. Moments later, the entire squad was back on the street, watching their comrade who had stayed on guard pin the thief to the ground. 'Well, my friend, let’s take a walk to the police station,' the commander said to the thief, congratulating the militiaman who caught him."
 MAR_Kosygin_Prestol.23.a: "Our Militia is the best in the world!"

 MAR_Kosygin_Prestol.24.t: "Mourning and Sharpening Knives"
 MAR_Kosygin_Prestol.24.d: "A column of people led by Kosygin marches to a monument in Berezniki, symbolizing the strength of the Russian people.\n\nA massive crowd gathered near the Berezniki administration building, awaiting Alexei Kosygin’s appearance. Many held portraits of their loved ones, but most, fortunately, came empty-handed. The portraits depicted those who perished in the terrorist attack at the Party headquarters.\n\nFinally, Alexei Kosygin, dressed in black, emerged from the administration building. After greeting the crowd, he called for a minute of silence to honor the fallen. The procession then moved silently toward Central Park. As they walked through the city streets, the crowd grew. More people mourning the deaths of innocent victims joined them. Soon, the column passed along the main street, which had been closed off for the event, and entered the park. In the center stood an eternal flame and a monument. The granite monument depicted a soldier shielding a little girl holding a rose—the flower of peace.\n\nAfter the march, Kosygin ascended a makeshift platform and, with a microphone, delivered his speech:\n\n'Comrades! Today, we gather here to honor the memory of our loved ones. Today, we can unite and, overcoming the pain of loss, send our loved ones on their next journey. But we are also here to stand together against those who caused this tragedy; against those who poisoned the lives of ordinary citizens with devilish lies; against those who question the unity of the Russian people; against one man—Sergey Taboritsky. Of course, we cannot underestimate the significance of 'Prestol' in these matters, but Taboritsky is the one to blame. He wanted to destroy us—the government—to rule the country alone. But he failed. Because I have you—my people—who are ready to help me in any situation, and I, in return, am ready to help you. Together, we can overcome all hardships, no matter what!'"
 MAR_Kosygin_Prestol.24.a: "The Russian people will always be united!"

 MAR_Kosygin_Prestol.25.t: "Another Black Morning"
 MAR_Kosygin_Prestol.25.d: "Yesterday morning, the 'Prestolniki' terrorists committed another atrocity. During a demonstration in support of the Mladorossi Party and Alexei II’s government in the (redacted: MGB) region, a group of unidentified individuals used a homemade explosive device.\n\nIn the panic caused by the explosion, about two dozen more people died in a stampede. Afterward, the terrorists holed up in a residential building, taking hostages. Special forces managed to infiltrate the building and eliminate the threat, but some hostages could not be saved."
 MAR_Kosygin_Prestol.25.a: "The terrorists will answer for their crimes."

 MAR_Kosygin_Prestol.26.t: "Siege"
 MAR_Kosygin_Prestol.26.d: "TOP SECRET\n\nREPORT TO HEAD OF INTERNAL SECURITY GIL V.V.\n\nIncident investigation protocol at the military base in the (redacted: MGB) region.\n\nBoth the methods used and interrogations of survivors indicate without a doubt that this terrorist attack was carried out by the 'Prestol' terrorist organization. While precise details are still being established, significant losses in personnel have been recorded, along with the loss of some small arms, ammunition, explosives, and service vehicles. Other assets, including heavy weaponry, were destroyed on-site.\n\nDESTROY AFTER READING"
 MAR_Kosygin_Prestol.26.a: "..."

 MAR_Kosygin_Prestol.27.t: "Attack on the Branch"
 MAR_Kosygin_Prestol.27.d: "Our party branch in the (redacted: MGB) region was attacked by forces of the 'Prestol' terrorist organization. The terrorists approached the building in an unmarked truck and, after closing in, opened fire on the guards attempting to stop them. The attackers also used Molotov cocktails in an attempt to set the building ablaze. They were forced to retreat when army units began arriving at the scene, but several people were killed, and the building was damaged."
 MAR_Kosygin_Prestol.27.a: "Damn it"

