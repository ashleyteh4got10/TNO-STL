 CPC_XJB_info_desc: "£CPC_texticon §RCPC-Xinjiang Bureau§!\n\n§YBase area Focus§!\n-In the lower right portion of this screen, there are §!six§Y Focus Cards for §RIndustries§!, §nAagriculture§!, §lmilitarily§!, §OEducation§!, §jBusiness§!, and §mHealthcare§! to choose from, §Yeach§! of which can unlock the corresponding §YNational Focus§! for §Y[HTC.GetNameWithFlag]§! to gain benefits.\n\n§mSub-focus in Region§!\n-On the right side of the §YBase area Focus§!, there are a variety of focus policies that can be implemented. These focuses are called §mSub-Focuses§!, and they only take effect in selected plots, and they are somewhat randomized, so it is important to note that §mSub-Focus§! can't be implemented in §Renemy-occupied areas.§!\n\n§n§nPopular Will§!§!\n-The people's eyes are discerning, and every move we make in Xinjiang is closely related to and seen by the local people of all ethnic groups - the people have their own judgment of our political actions.\n-However, the base area is not an ironclad one internally, and §lGeneral Ma Association§! will have a long-standing dispute with the base area communists, who will make use of Hetian Ma clan's great popularity among the people to continually §Rmake trouble§! for our Party's personnel assigned to Xinjiang, and it is only by controlling the influence of §lGeneral Ma Association§! in the Hetian Soviet that we can avoid tarnishing the image of the people that we have in their hearts.\n\n§GWork Ablilty§!\n-Despite being able to contact the Central Authorities in exchange for some resource support, the Xinjiang Bureau's working capacity is still relatively limited, quantified as §GWork Ablilty points§!, which are consumed for all types of actions. Each month, the Xinjiang Bureau automatically recovers §Y1§! §GWork Ablilty point§!, but due to its size, the Xinjiang Bureau also has a §GWork Ablilty cap.§!\nRemain §GWork Ablilty points§! of CPC-XJB: [?XJB_abilities_num|Y0]\nCurrent §GWork Ablilty cap§! of CPC-XJB: [?XJB_abilities_num_limit|Y0]"
