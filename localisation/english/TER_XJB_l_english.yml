 TER_XJ_popular_will_tt_4: "Current §nPopular Will§! in the base area(§Y[?XJ_popular_will]§!%) is: §mWarmly Welcome§!\n\nNext month, because of the influence of §lGeneral Ma§!, predicting it will change [TER_XJB_popular_will_predict]."
 CPC_XJB_before_war_tt: "Xinjiang, located in the hinterland of Asia and Europe, is an inalienable part of China's territory. Due to its special geographic location, Xinjiang has been a battleground for the interests of Eurasian countries since the nineteenth century, and with the failure of the War of Resistance, the legitimacy of the old Nationalist government gradually cracked, and various forces were eager to move.\n\nThe first shot at overthrowing Sheng Shicai's tyranny was fired in the North Xinjiang Uprising, fostered by the former Soviet Union, which was followed by the division of the territory between §Rcommunists§!, §Yold warlords,§! and §Opan-Turkicists§! - but the situation in Xinjiang remained treacherous.\n\nAfter Comrade §GChen Tanqiu§! was brutally murdered by §YSheng Shicai§! in 1942, the Party's organizational system in Xinjiang collapsed for a time, until Comrades §GZhang Yashao and Wu Yingqi§! made tireless efforts to take over the burden and reorganize the Xinjiang Bureau - the only grip we had to influence the situation in Xinjiang.\n\nComrade §GZhang Yashao§! died in 1957, and the circumstances of his death are not known, but the situation in Xinjiang is now spiraling out of control, and we are forced to focus our remaining energies on §Rmore important matters.§!\n\n§RWar doesn't stop, and we must be ready for anything before the next storm arrives...§!"
 CPC_XJB_in_war_tt: "The Xinjiang region is now in §Rwar§!, and it is now up to the §GCentral Military Commission§! in conjunction with the §GHo-Tep Soviet§! and the §GXinjiang Communist Party§! to co-ordinate and plan the strategic arrangements of our Party and our army in the Xinjiang region; the Xinjiang Bureau should take advantage of this opportunity to rest and reorganize its organization in order to cope with the heavy task of guiding the establishment of the border region government after the war."
 CPC_XJB_special_action_tt: "Currently, the Xinjiang Bureau is going through a §Yspecial period§! in which the vast majority of its deployable resources are being invested in the §Yspecial situation§! we are currently dealing with, leaving no room for directing and planning the development and governance of the Xinjiang region."
 CPC_XJB_post_war_tt: "The war in Xinjiang has been pacified, and is in urgent need of development. The Xinjiang Bureau must, for a long time to come, assist in the development of the §YXinjiang border region§! and assist the §Gborder government§! in completing the reconstruction and stabilization of Xinjiang.\n\nIt must formulate policies prudently to win the §Gtrust§! of the people of Xinjiang and live up to the wishes of revolutionary martyrs such as §GChen Tanqiu, Mao Zemin and Zhang Yashao.§!"
 XJB_pie_detail: "§Y[HTC.GetName]§! is our main united front target and political ally in Xinjiang, and the composition of its internal political forces is summarized below:\n\n§xThe Congress of Soviets,§! which brought together representatives of our party's Xinjiang Bureau, the former Soviet Union's advisers for Xinjiang, Xinjiang's native communists, and the Ma clan, was in charge of §Y[HTC.GetNameWithFlag]'s§! internal affairs.\n\nOutside of the §xCongress of Soviets§!, the §lGeneral Ma Association§!, led by §YMa Hushan,§! a direct relative of the Ma clan, enjoyed a certain degree of prestige in the §lmilitary§! and §jbusiness§! circles, and was mainly controlled by the Ma family and the former military chief of the 36th New Division, which was in charge of §Y[HTC.GetNameWithFlag]'s§! defense affairs.\n\nThe main task of the Xinjiang Bureau for a longer period of time in the future is to stabilize the situation in §Y[HTC.GetNameWithFlag]§! and minimize the influence of §lGeneral Ma Association§! on internal decisions in the region; if the §lGeneral Ma Association§! becomes too powerful, the §RCPC may face an extremely difficult situation in Xinjiang.§!\n\nThe current political power structure in §Y[HTC.GetNameWithFlag]§! is:\n§xCongress of Soviets§!: [?XJB_real_pct_C|Y1]%\n§lGeneral Ma Association§!: [?XJB_real_pct_M|Y1]%\n\nNext month, because of the influence of §lGeneral Ma Association§!, will effect [TER_XJB_popular_will_predict]."
