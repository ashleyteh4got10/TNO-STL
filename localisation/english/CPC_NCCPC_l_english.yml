 button_special_care_in_party_tt: "§mBestow Special Attention§!\n----------------\nSelecting this option will §mimplement§! this faction's §Ypolicies§! and §Gexpand§! their Intra-Party Influence. It will also influence the §Ystatus of Party affairs§!.\nOnly one faction can be selected to interact with each month, and it costs §Y1.5M (major faction) or 1M (minor faction)§! Party Budget. This option will be disabled when the influence of any faction is less than §Y3%§!.\n----------------\n[!NCCPC_btn_blue_click]"
 button_praise_tt: "§GPraise by Name§!\n----------------\nSelecting this option will §Gencourage the implementation§! of this faction's §Ypolicies§! and §Gexpand§! their Intra-Party Influence. It will also influence the §Ystatus of Party affairs§!.\nOnly one faction can be selected to interact with each month. This option will be disabled when the influence of any faction is less than §Y3%§!.\n----------------\n[!NCCPC_btn_green_click]"
 button_criticize_in_party_tt: "§YCriticize by Name§!\n----------------\nSelecting this option will §Yrestrict the implementation§! of this faction's §Ypolicies§! and §Rundermine§! their Intra-Party Influence. It will also influence the §Ystatus of Party affairs§!.\nOnly one faction can be selected to interact with each month. This option will be disabled when the influence of any faction is less than §Y3%§!.\n----------------\n[!NCCPC_btn_yellow_click]"
 button_punish_in_party_tt: "§RIntra-Party Discipline§!\n----------------\nSelecting this option will §Rpunish§! this faction.\nThis option is available when the National Spirit §RIntra-Party Disciplinary Action§! is not active and there has been no prior interaction this month, and it costs 0.5M§Y Party Budget§!. This option will be disabled when the influence of any faction is less than §Y3%§!.\n----------------\n[!NCCPC_btn_red_click]"
