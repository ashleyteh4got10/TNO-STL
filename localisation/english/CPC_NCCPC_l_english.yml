 CPC_mao_power: "§GMao's Faction§!"
 CPC_mao_power_value: "[?ROOT.TER_pol_str_real_percent^0|2]%"
 CPC_mao_power_desc: "§GThe Mao’s Faction§! typically refers to a group of party cadres who support Mao Zedong’s policies or have earned his trust and favor. It is one of the largest factions within the §xChinese Communist Party§!, wielding immense influence among §Gmid-to-high-ranking cadres from the Northwest§! and within the §Rmilitary§!. However, at present, the §GMao’s Faction§! appears to lack a well-structured organizational framework, often struggling to act cohesively in political affairs.\n\n§GThe Mao’s Faction’s§! policy agenda generally aligns with Mao Zedong’s bold and sweeping leadership style, with the most radical measures emerging during the §SSocialist Transformation Period§!. However, it is crucial to note that §GMao’s Faction§! does not entirely equate to Mao Zedong’s personal political will. In fact, the §GMao’s Faction§! is not always the embodiment of fearless, impassioned romanticism. Within the vast §GNorthwest cadre group§!, §Ga new generation§! of rising figures has begun to emerge under Mao’s protection, bringing a more sophisticated political approach to base area governance. Compared to their predecessors, they tend to be more pragmatic and adaptable, gaining greater favor among grassroots cadres and the masses. Yet, their objectives remain unwavering: to fulfill §GChairman Mao’s§! instructions and to ignite a §xsocialist upsurge§!—within the base areas, or perhaps across all of China."
 CPC_liu_power: "§mLiu's Faction§!"
 CPC_liu_power_value: "[?ROOT.TER_pol_str_real_percent^1|2]%"
 CPC_liu_power_desc: "The §mLiu's Faction§! generally refers to the group of Party cadres who support Liu Shaoqi’s ideas or are trusted and promoted by him. It is also one of the largest factions within the §xCommunist Party of China§!. Most of its members have direct or indirect ties to Liu Shaoqi during his time working in the §mwhite zone§! behind enemy lines. Many of the faction's mid-aged cadres have ascended to the §xParty’s Central Committee§!, and therefore, in some informal discussions, these individuals are also referred to as the §mwhite zone faction§! or the §mcentral faction§!.\n\nThe political agenda of the §mLiu's Faction§! aligns with Liu Shaoqi's relatively moderate political and economic views. It rose rapidly after the §GGreat Leap Forward§! due to the need for economic recovery and political stability.\n\nContrary to the §mLiu's Faction§!'s generally moderate political and economic stances, the administrative methods employed by the faction’s cadres to achieve their goals are often §Ytough§!. From the perspective of third parties, this administrative style has made the §mLiu's Faction§! gradually resemble the §GMao's faction§! from the past…"
 CPC_li_power: "§RLi's faction§!"
 CPC_li_power_value: "[?ROOT.TER_pol_str_real_percent^2|2]%"
 CPC_li_power_desc: "As a faction that has nearly exited the stage of history, the §RInternational Faction§! once experienced a period of remarkable influence: figures loyal to the Comintern, such as Zhang Wentian, Wang Ming, and Bo Gu, briefly ascended to the highest power within the revolutionary ranks in various ways. However, their rigid adherence to doctrinal strategies became the Achilles' heel that led to the §RInternational Faction's§! decline when confronted by those more familiar with China's realities.\n\nToday, the §RInternational Faction§! can hardly be considered a legitimate faction. Instead, it resembles a \"target\" pre-set for criticism in successive internal political movements. Were it not for §mLiu Shaoqi's§! need to secure political allies by keeping §Rthem§! within his orbit, the term §RInternational Faction§! might have long since been relegated to the dusty archives.\n\nDespite their dissatisfaction with §mLiu's Faction§!'s \"revisionist policies,\" the §RInternational Faction§! is now powerless to rise and refute. All they can do is cast silent approval votes in policy decisions."
 CPC_deng_power: "§YDeng's Faction§!"
 CPC_deng_power_value: "[?ROOT.TER_pol_str_real_percent^3|2]%"
 CPC_deng_power_desc: "The §YSecretary Faction§! is relatively small in size but holds significant power. Almost without exception, party cadres identified as part of the §YSecretary Faction§! are high-ranking central officials closely associated with §xGeneral Secretary of the CPC Secretariat§! Deng Xiaoping.\n\nDeng Xiaoping himself was selected by Mao Zedong as a key aide to mitigate the severe aftermath of the Great Leap Forward. Unlike the traditional Maoist cadres in the central government who emphasize §x“ideological direction”§!, Deng Xiaoping is indifferent to labels when it comes to his economic policies. In his own words: §Y\"It doesn't matter whether a cat is black or white, as long as it catches mice, it's a good cat.\"§!\n\nMany have criticized Deng Xiaoping's §xcommitment to party ideology§!, but Mao Zedong tacitly approved his remedial measures and entrusted him with the important roles of §GGeneral Secretary of the CPC Secretariat§! and §GDirector of the CPGAC§! to assist in managing daily party and governmental affairs.\n\nPerhaps, from the perspective of internal factional divisions, it would not be entirely inaccurate to regard the §YSecretary Faction§! as a heterodox branch of the §GMao's Faction§!."
