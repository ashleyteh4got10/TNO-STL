 mao_zedong_thought_TER_subtype_desc_pic: "\n\n\n\n\n£mao_zedong_thought_TER_subtype_desc_pic\n\n\n\n\n\n\n\n"
 CPC_li_power_2: "§RMass Faction§!"
 CPC_li_power_desc_2: "After the Ninth National Congress, with the retirement of Li Lisan and others, the 'People' Faction, led by Zhou Yang and other literati, began to gradually enter the limelight. As the \"founder of the Party's literary line,\" Zhou Yang and the 'People' Faction's ideas were not so much political as they were artistic and life-oriented, which was unusual for the CPC, which had grown up amidst bloodshed - the emergence of the 'People' Faction seemed to mark a subtle shift from a fighting party to a ruling party. mark a subtle shift in the Communist Party from a fighting party to a ruling party.\nBecause of its economic conservatism and political humanism, the 'People' Faction could be expected to serve as a literary assistant to the Liu's faction in the future."
 CPC_Jiang_Qing: "Jiang Qing"
 CPC_Hu_Jiwei: "Hu Jiwei"
 CPC_Yu_Guangyuan: "Yu Guangyuan"
 CPC_Bo_Yibo: "Bo Yibo"
 CPC_Bo_Yibo_desc: "In the second Sino-Japanese War, Bo Yibo's revolutionary enthusiasm is all in the \"death\" in the word, to the outside world everywhere to show that he is a strong character of fierce warriors. Especially in front of Yan Xishan, the party's interests, he did not give way, if you dare to come to the offence is bound to return the favour. Even if Yan Xishan defection attracted the Japanese siege, he must tear down the enemy a few pieces of meat before ruthlessly transferred to the next guerrilla area.\n\nAnyone would miss the golden age of life, for Bo Yibo is the glorious years of bloodshed in Shanxi. But Jinji Luyu is already far away, all this is gone.\n\nNorthwest is not Bo Yibo's comfort zone, back to Yan'an after a period of time, he is not accustomed to dealing with personnel relations in northern Shaanxi. Alone in a foreign land for a foreigner, a water of Shaanxi cadres, he is like a long-distance travelling to the wanderer, nowhere to show his feet, grinding his sharpness - but soon he met the object that can be relied on. Promoted by the then powerful Liu Shaoqi, Bo was qualified to run for the Central Committee. The discerning eye could see that this was Mao's way of allowing Liu Shaoqi to groom his own leadership team, and at the same time set Bo's political trajectory for the next three decades.\n\nThe 1950s did not belong to Liu Shaoqi or Bo Yibo, and Gao Gang was undoubtedly the favourite of the decade. During this period, Bo Yibo was subjected to inhuman hardship and suppression from the beginning because his economic views were at odds with Gao Gang's \"left\" leaning ideology. It was not until 1960, when the national defence front collapsed and Gao Gang fell to his knees, that he and Liu Shaoqi were completely turned around. The internal division of the Northwest cadres gave Liu and Thin an opportunity to take advantage of the situation. By supporting Liu Lantao, who was a native of Shaanxi Mili with Gao Gang, Bo Yibo managed to drive a nail into the middle cadre and gradually took control of half of the northwestern country with the suppression of the rebellion against the Horse Guards.\n\nAfter removing Gao Gang's oppression, Bo Yibo springs back like a spring, and his rigid soul is being resurrected. In the preparatory work for the 8th CPC National Congress, entrusted by Liu Shaoqi, Bo Yibo presided over a meeting to liquidate Gao Gang, and launched a campaign to purge the poison: as long as Gao Gang had done things and used people, he was taken down without fail. This complete rejection reshaped the face of Communist rule in the Northwest, and gave Liu Shaoqi and others the necessity to take over the administration, enabling them to penetrate into the workings of the government. And the resolutions that emerged from this meeting would become party history, continuing to be etched into the minds of generations of newcomers after Bo Yibo was elected chairman of the Front.\n\nUnder the applause and boos, what is the difference between Bo Yibo and Gao Gang back then? They also governed with the same anger and did not treat their opponents as human beings, but the long-term stability of the Front could not be achieved by eradicating one or two people from the political arena. It can be expected that Bo Yibo that restless and lack of respect for the body and heart is still difficult to be accepted by the Northwest land. When the wind rushes along the fishing drums, the opponents will slowly gather, and when the time is ripe, they will launch a counterattack."
 CPC_Zhu_De_desc: "After the surrender of the Chongqing government in 1947, the CPC and the Northwest Kuomintang concluded a pact in which they agreed to resist the Japanese and establish a national defence front. Zhu De briefly acted as the supreme military head, nominally commanding all the forces of the Kuomintang and the Communist Party. But the de facto split between the Kuomintang and the Communist Party on military matters turned Zhu De into a commander-in-chief in name only. Sitting in this first chair, Zhu De stepped into the path of working out of the realm of reality, as if he were a god and a Buddha.\n\nNow, Zhu De, who had not intervened in real work for twenty years, was elected by Mao Zedong to be the chairman of the National Defence Front on the basis of his impeccable curriculum vitae.\n\nAs the founder of the Nanchang Uprising, Zhu De has always been tied to the identity of \"army builder\", but it is difficult to add a point to his rule over the Northwest. The honour was too long ago, so long that it was as high and obscure as his presidency. Zhu De therefore differed from his army colleagues in that he was not keen to meddle in politics. In contrast to Lin Biao's flamboyance in meetings, Zhu De was a schoolboy of few words. Though more experienced than anyone else, Zhu De did not judge the work of the Central Committee on the basis of his own empiricism, as Peng Dehuai did. Struggle with the changing situation, all and Zhu De has nothing to do, he just quietly handed over their own vote in favour of the power to those energetic, strong comrades.\n\nEighty years of wind and rain, as long as a handful of chronic poison, will Zhu De tortured emaciated. The young people in the revolutionary army will honour Zhu De's endurance and perseverance with unending respect, but when they walk past Zhu De in front of them they are all in fear and worry: dragging a body that has been through the vicissitudes of life, this decrepit and bloated old man can still do what? Perhaps, just sitting in this seemingly endless chair, waiting for the sunset."
 CPC_Liu_Lantao: "Liu Lantao"
 TER_hosting_service_NCCPC_tt: "§Ydelegation services§!: £CPC_texticon §xNational Congress of the Communist Party of China§!\n----------------\nIf you find yourself §Rshort on energy§! and unable to manage all mechanisms effectively, you may click here to activate §Ydelegation services for the current mechanism§!, at the cost of £pol_power §Y10§! political power.\nIf §Ydelegation services§! are already enabled, clicking again will disable them and refund £pol_power §Y10§! political power. Should you choose to §Ydisable delegation services§!, they will remain active until the next scheduled effect takes place.\nDelegation services will also automatically deactivate when this mechanism is no longer available.\n----------------\nCurrent delegation services effect:\nYearly §YParty Dues Budget§!: §Y$25§!/person\n§Y1962§!: §GPraise§! §Yall faction§! §Ymonthly§! automaticly\n§YAfter 1962§!: §mSpecial Emphasis§! §Yall faction§! §Ymonthly§! automaticly"
 TER_hosting_service_NWB_tt: "§Ydelegation services§!: £CPC_texticon §RNorthwest Bureau of the CPC§!\n----------------\nIf you find yourself §Rshort on energy§! and unable to manage all mechanisms effectively, you may click here to activate §Ydelegation services for the current mechanism§!, at the cost of £pol_power §Y10§! political power.\nIf §Ydelegation services§! are already enabled, clicking again will disable them and refund £pol_power §Y10§! political power. Should you choose to §Ydisable delegation services§!, they will remain active until the next scheduled effect takes place.\nDelegation services will also automatically deactivate when this mechanism is no longer available.\n----------------\nCurrent delegation services effect:\nEvery §Y20 days§!, a random region will be selected to carry out the §YSix Major Tasks§!. During their execution, a certain amount of £pol_power §Ypolitical power§! will be §Rdeducted§!, calculated as §Y5 / Party Member Supply Percentage§!.\n\nIf all regions have §Gcompleted§! the §YSix Major Tasks§!, this delegation service will be §Rautomatically disabled§! without refunding any previously spent £pol_power §Ypolitical power§!.\n\nThe §Ynumber of party members§! must be §Ymanually managed§! by the player and is §Rnot covered§! by this delegation service."
 TER_hosting_service_SWB_tt: "§Ydelegation services§!: £CPC_texticon §RSouthwest Bureau§!\n----------------\nIf you find yourself §Rshort on energy§! and unable to manage all mechanisms effectively, you may click here to activate §Ydelegation services for the current mechanism§!, at the cost of £pol_power §Y10§! political power.\nIf §Ydelegation services§! are already enabled, clicking again will disable them and refund £pol_power §Y10§! political power. Should you choose to §Ydisable delegation services§!, they will remain active until the next scheduled effect takes place.\nDelegation services will also automatically deactivate when this mechanism is no longer available.\n----------------\nCurrent delegation services effect:\nIf £pol_power §Ypolitics power§! more than §Y20§!, it will select random §YOperational Policy§!, if less than 20, §Rno effect§!\n\n§YDevelopment mode§! of city and Mining need §Yplayer to adjust§!, §Rexcluding§! from delegation services."
 TER_hosting_service_XJB_tt: "§Ydelegation services§!: £CPC_texticon §RXinjiang Bureau§!\n----------------\nIf you find yourself §Rshort on energy§! and unable to manage all mechanisms effectively, you may click here to activate §Ydelegation services for the current mechanism§!, at the cost of £pol_power §Y10§! political power.\nIf §Ydelegation services§! are already enabled, clicking again will disable them and refund £pol_power §Y10§! political power. Should you choose to §Ydisable delegation services§!, they will remain active until the next scheduled effect takes place.\nDelegation services will also automatically deactivate when this mechanism is no longer available.\n----------------\nCurrent delegation services effect:\nWhen §YWorking ability points§! is enough, will select random §YFocus Card§!, if not, §Rno effect§!.\n\nWhen §YWorking ability points§! is enough, §YFocus Card§! is activating, will select random region to Implement §YSub-focus§! in Region, if not, §Rno effect§!."
 TER_hosting_service_SCB_tt: "§Ydelegation services§!: £CPC_texticon §RSouth China Bureau§!\n----------------\nIf you find yourself §Rshort on energy§! and unable to manage all mechanisms effectively, you may click here to activate §Ydelegation services for the current mechanism§!, at the cost of £pol_power §Y10§! political power.\nIf §Ydelegation services§! are already enabled, clicking again will disable them and refund £pol_power §Y10§! political power. Should you choose to §Ydisable delegation services§!, they will remain active until the next scheduled effect takes place.\nDelegation services will also automatically deactivate when this mechanism is no longer available.\n----------------\nCurrent delegation services effect:\nBecause of mechanism, §Cplayer§! need select §Yshipping area§! and §xSoutheast asia uprising§!\nWhen delegation services is active, §Yall avaliable shipping area§! §Ywill reduce Japan Alert§! automaticlly."
