 CPC_NCCPC_info_desc: "£CPC_texticon  §xNational Congress of the Communist Party of China§!\n-------------------------\n[CPC_NCCPC_info_pics] The Communist Party of China, established on the basis of §GBukharin's theory of democratic centralism§!, prohibits public factionalism. But party members will always be able to set each other apart on the basis of their §Ydiffering opinions§!, §Yphilosophy of governance§!, and even §Ywho they work for§!. Given the forceful pressure from above, factional divisions arising is as natural as hens laying eggs.\n\nDue to differences in their perception of historical issues, two major factions have formed within the Chinese Communist Party: one led by §GComrade Mao Zedong§! and the other led by §mComrade Liu Shaoqi§!, both influencing the current revolutionary line.\n\nDespite the fact that the Party has developed various factions for §Ymany reasons§!, its political atmosphere normally maintains §Gbroad unity, seeking common ground while putting aside differences§!. After all, its §Ymethods of governance§! and §Yadministration§! are still strictly based on the §Gtheory of democratic centralism§!, and it does not lightly undertake §Roverly intense campaigns of political struggle§!.\n\nVarious means allow us to influence the Party's §Yfactional composition and policy implementation§!, such that we may §Ykeep§! the leading faction or perhaps §Ychange§! it at the Party Congress.\n\nAs the sun rises and sets, and the moon waxes and wanes, our influence on intra-Party politics is constrained by the size of the factions. The §Ylarger§! the faction, the §Rharder it is to expand§!, while the §Ysmaller§! the faction, the §Rharder it is to weaken§!."
