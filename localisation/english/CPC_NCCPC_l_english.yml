 NCCPC_budget_mechanic_desc: "§GParty Budget§!\n--------------------\nAt the beginning of each year, our Party will allocate the corresponding share from the financial system to §Ymaintain the normal operation of the Party§! based on the §GParty Budget§! decided in the §Yprevious year§! and the balance of the Party budget of the §Yprevious§! year will be returned to the State Treasury for use as a §Yreserve.§! If the party budget for the §Yfollowing year§! is not revised during the year, the share of the party budget allocation will §Yremain unchanged.§!\n\nEvery month, §YA certain amount§! will be deducted from the budget(it will be the 50% of §GThe Number of the Party member§!), as the §YNecessary expenses for daily party affairs§!, besides, the §Gparty budget§! can be used in operation inner the Party to §YModify faction ratio§!\n\nAt the end of each year, the party's work will be evaluated based on the balance of funds. If the balance of the party's funds accounts for 10%-50% of the current year's budget, the party will be judged to be healthy this year and will be given a buff in the following year; outside the 10%-50% range, there will be a random gain debuff. You can inspect National idea§YArts of policy§! to check it.\n\nIf you want to inspect the detail of §GThe Number of the party memeber§!, please click the button §Yswitch graph§!"
 NCCPC_pop_mechanic_desc: "§GParty Membership§!\n--------------------\n§YThe number of our party members§! per month will §Yincrease, obeying the random variation of the binomial distribution law.§!\n\nAs our Party progresses in liberating China, the trend of §YThe number of our party members§! growth will become more and more apparent. More §Ymembers§! means higher and higher monthly expenses §Ynecessary for daily Party affairs§!, so please decide carefully on next year's §GParty budget!§!\n\nIf you want to inspect the detail of §GParty Budget§!, please click the button §Yswitch graph§!"
 NCCPC_buget_confirmed: "Has determined the §GParty Budget§! for next year."
 NCCPC_up_btn_desc: "[!NCCPC_budget_up_btn_click_enabled]\nClick: §Y1M§! will be §Gadded§! to next year's Budget.\n£shift + Click: §Y5M§! will be §Gadded§! to next year's Budget.\n£ctrl + Click: §Y0.5M§! will be §Gadded§! to next year's Budget."
 NCCPC_dn_btn_desc: "[!NCCPC_budget_dn_btn_click_enabled]\nClick: §Y1M§! will be §Rremoved§! from next year's Budget.\n£shift + Click: §Y5M§! will be §Rremoved§! from next year's Budget.\n£ctrl + Click: §Y0.5M§! will be §Rremoved§! from next year's Budget."
