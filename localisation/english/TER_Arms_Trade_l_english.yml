 CHI_Arms_Trade_category:0 "Arms purchases from Japan"
 CHI_Arms_Trade_category_desc:0 "China and Japan have had a deep friendship since ancient times, and the interests of the two countries are the same; we have only one enemy, the §RCommunist§!. Therefore, we must begin to buy weapons and equipment from Japan, which is essential for the great cause of counter-insurgency and the common prosperity of East Asia.\n\nAnd, of course, it's vital to the wallets of the commissioners."
 CHI_buy_JAP_inf:0 "Purchase Infantry Weapons"
 CHI_buy_JAP_Support_Equipment:0 "Purchase Support Equipment"
 CHI_buy_JAP_at:0 "Purchase AT Weapons"
 CHI_buy_JAP_at_desc:0 "Due to the deteriorating situation in East Asia, Japan has opened up the sale of heavy weapons to us."
 CHI_buy_JAP_arty:0 "Purchase Artillery"
 CHI_buy_JAP_arty_desc:0 "Due to the deteriorating situation in East Asia, Japan has opened up the sale of heavy weapons to us."
 CHI_buy_JAP_mot:0 "Purchase Motorized Equipment"
 CHI_buy_JAP_APC:0 "Purchase APC"
 CHI_buy_JAP_APC_desc:0 "Due to the deteriorating situation in East Asia, Japan has opened up the sale of heavy weapons to us."
 CHI_buy_JAP_MBT:0 "Purchase MBT"
 CHI_buy_JAP_MBT_desc:0 "Due to the deteriorating situation in East Asia, Japan has opened up the sale of heavy weapons to us."

 CPC_Black_Market_category:0 "Covert Operation"
 CPC_Black_Market_category_desc:0 "Gao's Nanking pseudo-government was so corrupt that the generals of the pseudo-army could not even get the equipment they deserved without paying satisfying bribes.\nThese corrupt bureaucrats will sell the equipment in their warehouses to anyone who can afford it.\nEven the \"commies\" as they call them."
 CPC_smuggle_CHI_inf:0 "Smuggled pseudo-army's Infantry Weapons"
 CPC_smuggle_CHI_at:0 "Smuggled pseudo-army's AT Weapons"
 CPC_smuggle_CHI_mot:0 "Smuggled pseudo-army's Motorized Equipment"
 CPC_smuggle_CHI_Support_Equipment:0 "Smuggled pseudo-army's Support Equipment"
 CPC_invite_CHI_Scholar:0 "Assist university teachers and students relocate to the Northwest"
 CPC_invite_CHI_Scholar_desc:0 "A large number of university teachers and students, who hold sincere patriotic ideals, refuse to live as enslaved people under the pseudo-government's rule. We can assist them in relocating to the Northwest."
 CPC_invite_CHI_Workers:0 "Assist workers in relocate to the Northwest"
 CPC_invite_CHI_Workers_desc:0 "Workers under the pseudo-government's rule, who are deeply exploited by comprador capitalists and Japanese zaibatsu, can be assisted by us in relocating to the Northwest."

 RUS_Connection_category:0 "Cooperation with Chinese comrades"
 RUS_Connection_category_desc:0 "News from the East: the Chinese comrades have not been defeated by the Japanese imperialists, and they are still Fighting! However, they lack industrial equipment, while we lack manpower and have a serious shortage of civilian consumer goods. Cooperation will be of great benefit to both of us."
