 SE_THE_GREAT_MAGICAL_GIRL_WITCH_TRIAL: "Magical Girl Witch Trial"
 SE_THE_GREAT_MAGICAL_GIRL_WITCH_TRIAL_D: "What is Yazov? He only wiped out the entire Germanic race, but we're going to wipe out the entire human race.\n-Tsukishiro Yuki"
 SE_THE_GREAT_MAGICAL_GIRL_WITCH_TRIAL_A: "Setting off from Omsk once more"
 WORLD_2WRWTER.114514.t: "[Get_newspaper_header] Magical Girl Witch Trial"
 WORLD_2WRWTER.114514.desc: "With a month passed since Tsukishiro Yuki announced the seizure of the Omsk regime, the world began to think it was just a small ripple in Russian politics. However, today Tsukishiro Yuki suddenly declared war on all surrounding nations and mobilized the national army, advancing out towards the borders. The OFN, Unity Pact, and Co-Prosperity Sphere nations have all expressed strong condemnation towards the Tsukishiro Yuki regime. Our war correspondent reported that it's impossible to enter the interior of Omsk city, let alone investigate the internal situation of the so-called \"Magical Witch National Rebirth Government.\" According to accusations from Russian refugees who narrowly escaped from Omsk, the Omsk regime is an anti-human, destruction-advocating regime, where all human residences within have been converted into massive prisons, and where the massacre of humans takes place day after day. Its authenticity remains to be verified.\n\nOur reporter will continue to report on the situation in Omsk."
 WORLD_2WRWTER.114514.a: "??? What the hell is this?"
 MGI_Magical_Factor: "Witch Factor Infection"
 MGI_Magical_Factor_desc: "The \"Great Witch\" Tsukishiro Yuki sowed many witch factors into the human world during her travels around the globe, and they have now penetrated the very bones of humanity. At a single thought of Tsukishiro Yuki, the fuses will be lit, and humans will rapidly turn into witches full of murderous intent. When that time comes, she can use her \"best friend\" Emma Sakuraba to activate the witch killer, thereby achieving her goal, presenting the first and also the last grand curtain call for the human world————\n\n§RThe Great Witch Trial§!."
 MGI_the_end_tt: "Thus, she sank into the ocean depths. §MThank you for playing through the April Fools content of the STL mod. We hope you had a blast in the battles, just as we did when making it.§!"
