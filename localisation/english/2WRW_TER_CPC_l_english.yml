 CPC_RUS.1.t: "Visitors from the North"
 CPC_RUS.1.desc: "A green military vehicle slowly drove into the courtyard of Zhongnanhai. Sitting inside were several Soviet diplomats dressed in dark clothing with serious expressions. The car doors opened, and the diplomats stepped out of the vehicle, walking heavily through the solemn red walls and ancient trees towards Zhu De's office building. Although they did not speak to each other, the tension in the air already indicated the importance of this meeting. Alexander Vasilievich was the leader of this delegation. After entering the reception room, his gaze swept across and saw Chairman Zhu De. Chairman Zhu De was already seated at his desk, wearing a Sun Yat-sen suit, his brow revealing a steadfastness and depth honed by years of experience. Despite his advanced age, his eyes were still full of wisdom and vision. Accompanying Zhu De were several high-ranking CCP leaders who were prepared to hear the diplomatic proposals from the Soviet Union. Vasilievich and the other diplomats bowed together in respect. Then, Vasilievich stood up and began the highly significant talks.\n\"Chairman Zhu De,\" Vasilievich's tone carried a hint of reverence, \"We in the Soviet Union know that in today's drastically changing world landscape, China is our most important strategic partner. As you know, German fascism threatens not only the security of Europe, but also endangers global peace. We hope to receive China's help to jointly resist this evil force.\" Zhu De slowly raised his head, his voice still steady and powerful: \"Comrade Alexander, we understand the difficulties of your Soviet Union, but China has also experienced prolonged wars and tribulations. Our foundation needs to be more stable before it can support the future of our nation. Cooperation can be discussed, but it must be built on the basis of mutual respect and equality.\" Vasilievich immediately nodded without a moment's hesitation. He knew that China's independence and dignity were the foremost elements in their diplomatic strategy. \"Of course, Chairman, we completely understand your position. We do not wish for China to lose its independent choice at any time,\" Vasilievich emphasized. \"Our Soviet goal is very clear—to completely end forty years of fascist tyranny and defend the socialist camp. And in this process, we hope to gain China's support.\" Zhu De fell silent for a moment, seemingly considering the feasibility of this proposal.\n\"Your goals align with our Chinese position. We also oppose fascism and support the liberation of all peoples,\" Zhu De's voice was resonant and powerful. \"After the war, the order in Asia must be led by the Asian people themselves. We do not wish to see any major power attempt to oppress us in this region.\"\n\"We are very clear on this point, Chairman,\" Vasilievich said earnestly. \"The Soviet Union will never attempt to change the status quo in Asia. Our goal remains to jointly fight against fascism with China, and establish a more fair and just international order after the war...\"\nIn the discussions that followed, both sides held in-depth talks surrounding military cooperation, territorial sovereignty, and resource allocation. Regarding territorial issues, the Soviet side stated that Tannu Tuva and the Soviet-occupied part of Outer Mongolia would be returned to China; as for the Outer Northeast, the Soviet Union would renounce its claims, respecting China's territorial integrity. As the talks deepened, both sides finally reached a preliminary cooperation framework—China would send volunteer forces to support the Second West Russian War, while the Soviet Union would provide advanced military technology and material support. At the same time, both sides agreed on future economic cooperation and cultural exchange plans to ensure a long-term and mutually beneficial relationship between the two countries after the war.\nAs the talks drew to a close, Zhu De stood up and nodded to Vasilievich, his voice still gentle and resolute: \"China is willing to contribute to global peace. We hope that on this path, we can always walk side by side with the Soviet Union.\" Vasilievich bowed deeply, his tone sincere: \"Chairman, we believe that under your leadership, the cooperation between China and the Soviet Union will not only end fascist tyranny, but also bring a more just and peaceful order to the future world.\" The diplomats left Zhu De's office, knowing in their hearts that today's meeting was not just a diplomatic exchange; it marked the moment when the two major powers that best represented the socialist camp finally found the path to cooperation in the face of a common enemy."
 CPC_RUS.1.o: "The future world may change because of this historic decision."
 CPC_RUS.2.t: "Visitors from the North"
