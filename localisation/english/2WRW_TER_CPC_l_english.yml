China is willing to contribute to global peace. We hope that on this path, we can always walk side by side with the Soviet Union.\" Vasilievich bowed deeply, his tone sincere: \"Chairman, we believe that under your leadership, the cooperation between China and the Soviet Union will not only end fascist tyranny, but also bring a more just and peaceful order to the future world.\" The diplomats left Zhu De's office, knowing in their hearts that today's meeting was not just a diplomatic exchange; it marked the moment when the two major powers that best represented the socialist camp finally found the path to cooperation in the face of a common enemy."
