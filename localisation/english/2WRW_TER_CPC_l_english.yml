 PRR_Grigory_Isayev: "Grigory Isayev"
 POLITICS_PRR_GRIGORY_ISAYEV_DESC: "Until the unification of Russia, Grigory Isayev was nothing more than an ordinary technician and engineer. That was until he met Alexei Razlatsky, a petroleum engineer at the same factory who was well-read in Marxist classics and very interested in the communist movement underway in China.\n\nAfter finding common ground, the two immediately began printing large amounts of leaflets and distributing them to their colleagues, gathering many people together, calling themselves the \"Workers' Center.\" They published the \"Second Communist Manifesto\" and successfully launched a strike at the Maslennikov Factory, making a contribution to the Russian labor movement and elevating their status before the Russian proletariat.\nHe originally thought that with his own strength and that of the Russian working class following him, they wouldn't be able to achieve revolutionary victory in a short time. Shortly after, when the Sino-Russian War ended in a Chinese victory, China decided to establish temporary governments in Russian Central Siberia and the Far East. At this point, he actively led workers across Russia in sparking the \"Workers' Center\" movement, and Isayev and Razlatsky gradually became known to the Russian people.\n\nUltimately, in the reorganized Council of Ministers of the Soviet Union, he was successfully elected as Chairman of the Council of Ministers, and Razlatsky was elected as the First Vice Chairman of the Council of Ministers. Both understood that on this land trampled by the previous Russian government, only by persisting with workers and peasants as the core, and the people as the center, could a socialist society truly be established and people's democracy properly implemented."
 YUG_Kasane_Broz_Teto: "Kasane Broz Teto"
 POLITICS_YUG_KASANE_BROZ_TETO_DESC: "Dunno why, but that day after the Croatian partisans got wiped out by the Germans, Teto slept and woke up with red hair and two red drills on her head that couldn't be trimmed off, and then somehow gained divine powers so people couldn't recognize her as Tito. Then she just survived in the world under the identity of Kasane Teto and ran away to Japan to become a virtual singer. Yeah, exactly."
 CPC_Deng_Xiaoping: "Deng Xiaoping"
 deng: "The Golden Mean"
 Deng_Xiaoping_DESC: "\"No party outside the party is an emperor's thought; no faction inside the party is strange and bizarre.\"\n\nAs a crucial assistant to Mao Zedong in mitigating the severe consequences of the Great Leap Forward, Deng Xiaoping possesses strong decisiveness and the ability to get things done, having performed meritorious service. In addition, he was one of the earliest party members, a classmate of Zhou Enlai during his time in France, and the biggest factional supporter of Mao Zedong. After being dismissed during Chairman Mao's third anti-encirclement campaign due to his pro-Mao stance, he was labeled as part of a certain faction, becoming one of the famous \"Four Giants of the Maoists.\" This is the greatest political capital of his life, and the reason why he is still viewed as an important part of the Maoist faction even after proposing the heterodox theory that \"it doesn't matter if it's a black cat or a white cat, if it catches mice, it's a good cat.\" Even though some separate Deng Xiaoping's faction as the \"Secretariat Faction,\" many within the party view it as a heterodox branch of the Maoists. Up to now, he still considers himself a \"Maoist\"—at least on the surface. Although a communist, he doesn't care much for his own economic views—using his \"black cat white cat\" theory, any economic system that can make a socialist country continue to develop can be used by the socialist state. Quite a few people have expressed dissatisfaction with his line. Faced with questions from party comrades and even reprimands from Chairman Mao, Deng Xiaoping still firmly replies: \"I am merely using capitalist means to realize communist ideals, and in turn develop productivity. Only when productivity is developed well can socialism stand firm.\" As a resilient old politician, Deng Xiaoping has extraordinary patience. He doesn't always insist on his own views, but rather makes concessions at appropriate moments in the ever-shifting party winds. In his own words, \"To endure means to be open-minded and hold on.\"\n\nToday, he is still regarded as a qualified revolutionary. But as for where this party and nation, built with blood and sacrifice, will go in the future, Deng Xiaoping might not have an accurate answer in his heart. After accepting the \"History of Ming\" from Mao Zedong's hands, all he can do is to slightly adjust the course while stabilizing Mao Zedong's basic direction, doing nothing more than \"crossing the river by feeling the stones.\" As for where this river will eventually lead? Only the heavens know."
 Tomorin_DESC: "Tomori Takamatsu is a character from the media franchise \"BanG Dream!\" and its derivative works, planned by the Japanese entertainment company Bushiroad. The vocalist of MyGO!!!!!, with her representative color being #77BBDD.\n\nA first-year high school student at Haneoka Girls' Academy, she is the sole member of the astronomy club, having inherited it from the previous student council president Hina Hikawa. She served as the vocalist for CRYCHIC and then MyGO!!!!!. She lives near Tsukinomori Girls' Academy.\n\nShe is a somewhat pessimistic girl. Emotionally delicate, she possesses her own unique inner world. She easily feels lonely and often refers to herself as \"experiencing solitude.\" Extremely sensitive to interpersonal relationships, she is always worried about whether her words and actions will have negative effects. Because of this, she is always dying in derivative works (such as the common \"chandelier\" meme), though the causes of death are actually no longer limited to suicide. Although she doesn't consider herself very good at singing, she still puts in the effort to sing. She writes lyrics in her notebook."
 CPC_phase_4_Mao_long: "Chinese Communist Party§F\n--------------\nPresident of the State: §YDeng Xiaoping§!\nChairman of the Central Committee: §GMao Zedong§! §V(Deceased)§!\nMembers of the Central Political Bureau: §GMao Zedong§! §V(Deceased)§!, §mLiu Shaoqi§! §V(Deceased)§!, §OZhou Enlai§! §V(Deceased)§!, §GZhu De§! §V(Deceased)§!, §GLin Biao§!, §mBo Yibo§!, §YDeng Xiaoping§!, §YChen Yun§!, §GJiang Qing§!, §RZhou Yang§!, §YXi Zhongxun§!, §mLiu Lantao§!, §GWang Renzhong§!, §GLiu Jianxun§!, §YWan Li§!, §GZhang Chunqiao§!, §mBai Dongcai§!, §mZhao Mingxin§!, §mRen Zhongyi§!, §mHan Guang§!\nGeneral Secretary of the Central Secretariat: §YDeng Xiaoping§!§!\n"
