 CHI_dem_riot_gui: "Eastern Riots"
 CHI_dem_riot_gui_desc: "While we were concentrating on §Gdevelopment and biding our time§!, some citizens who hoped China would once again be independent from the Rising Sun did not sit around waiting. Since the §YYasuda Crisis§!, the Chinese Communist Party has secretly supported the sparking of §Criots§! in §YGuangxi, Beiping§!, and other places. Although they were ultimately §xsuppressed§! by us, sporadic protests have §Ycontinued§!, and with the recent international and domestic turmoil, they have become §Gincreasingly powerful§!. The §CEastern Riots§!—represented by the three areas of §YBeiping, Wuhan, and Leizhou§!—are spreading. Before we officially tear off our faces against Japan, it is necessary for us to continue §Ysuppressing§! them."
 CHI_dem_riot_gui_tt: "-§RStrength§!\n---------------\nEach §Criot area§! has its own §RStrength§!, representing their ability to §Yresist the central government's suppression§!. Their strength will §Rslowly decrease§! over time. If a certain region's strength falls §Rbelow§! §Y30%§!, we can §Rdirectly launch suppression actions§!.\nWe will suppress the §Crioters§! through a series of actions, weakening the §Rstrength§! of them and the red bandits behind them.\n\nOnce all three regions are §xcompletely suppressed§!, the §Ydisappointed eastern people§! are very likely to hold a §Rcold attitude§! towards the Chinese Communist Party's §xliberation actions§!, allowing us to better complete the Fifth Modernization.\n\n-§GRadicalism§!\n---------------\nEach §Criot area§! has its own §GRadicalism§!, representing the radical level of their §Ydemocratic demands§!. Although we can use the §Yintelligence network§! to §Rweaken§! the §Rstrength§! of these regions, it will correspondingly §Yincrease§! their §Gradicalism§!. If the §Raverage radicalism§! of the three regions exceeds §Y50%§!, they will act on their own and convene the §mRepublic of China Affairs Conference§! in Shanghai, §Rno longer cooperating§! with the Chinese Communist Party's democratic proposal to convene the §GChinese People's Political Consultative Conference§! in Xi'an.\n\n—Although for the §Rpacification cause§!, §Yboth conferences§! will serve as §Gstepping stones§! for the Chinese Communist Party to win the war, for the §xCCP§!, the §GCPPCC§! can bring greater assistance to their §Rwar cause§!, while the Affairs Conference will turn them into an isolated force."
 CHI_dem_riot_failure: "Suppressed Eastern Riots"
 CHI_dem_riot_failure_desc: "The strength of the riots in the East has been completely suppressed.\n\nNow, the people of the East have lost patience with the CCP and are no longer willing to cooperate with their other actions—our future war of pacification in the Northwest will gain a tremendous advantage."
