 # Flavor Event Chain - Young Mao Returning Home
 STL_CPC_main_story.1.t: "A Startled Dream"
 STL_CPC_main_story.1.desc: "\"Chairman, Chairman Mao, please come back! Please come back quickly! We are all waiting for you here, Chairman, Chairman Mao...\" The noisy cries gradually converged into a deafening sound of weeping, a sound so direct it struck the mind and drove one to madness. Gasping for breath, Mao Zedong suddenly woke up. He hurriedly looked around, and after realizing that everything just now was only a dream, he let out a long sigh of relief.\n\nThe details of the dream gradually faded from Mao Zedong's mind. Looking at the familiar surroundings and wiping the cold sweat from his forehead, Mao Zedong sat up. Although he had slept for less than three hours, he was now completely wide awake. He just sat on the bed in a daze. After sitting for a while, Chairman Mao got off the bed cautiously, draped a greatcoat over his shoulders, quietly opened the door, and sat down outside.\n\n\"Chair...\" The guard standing watch outside saw Chairman Mao sitting at the doorway and wanted to ask him to go back inside, but Chairman Mao quickly waved his hand to stop him. \"I can't sleep inside the room. I came out to get some fresh air. It's no big deal, I'll go back in a bit.\" \"Chairman, it's too cold outside. You should still go back inside,\" the guard continued to urge him.\n\n\"Go inside, go inside. I'll go inside as soon as I finish this cigarette.\" Chairman Mao fumbled in his pockets for a long while and pulled out a half-smoked cigarette butt. This was a cigarette butt he hadn't finished smoking this morning, it couldn't be wasted. Striking a match, the Chairman crouched by the door and started smoking. The guard also knew Chairman Mao's temperament and knew there was no point in forcing the issue, so he stood beside the Chairman to block the wind. Before the cigarette butt was even finished, the door opened again. The guard immediately stood at attention and saluted the woman who walked out.\n\n\"Get some rest early. You are the backbone of the entire Northwest. Isn't the pacification progressing very smoothly? These difficulties in the Northwest will be overcome very soon.\" Chairman Mao had to work late into the night every day, and as he grew older, his mental state was not very good. With the Eighth National Congress about to be held, there were even more things for the Chairman to be busy with, so his sleep quality became worse and worse. After taking some sleeping pills, Chairman Mao lay back down on the bed. As the medicine kicked in, his drowsiness returned.\n\n\"An'ying should be forty by now. Time flies so fast.\" The Chairman murmured to himself as he fell asleep again. In the Chairman's memory, when they parted in Yan'an, An'ying was still a young man in his twenties. In the blink of an eye, another twenty years had passed. During the Soviet-German War, Mao An'ying volunteered to join the armored divisions to fight against the Germans. However, after the disastrous defeat in Moscow, Mao Zedong completely lost all news of his son. Born in 1922, Mao An'ying would be forty years old by now."
 STL_CPC_main_story.1.o: "Of course, if he is still alive."

 STL_CPC_main_story.2.t: "Long Road Home"
 STL_CPC_main_story.2.desc: "\"This map isn't right, Old Wang. Go check nearby to see if there's anyone around. Did we take the wrong way again?\" \"Impossible! I bought this map at a high price, how could it be wrong?\" Wang Renjie took the map over, but after comparing it for a long while, he still couldn't figure out where they were. \"How much did you spend on it?\" \"Four bottles of vodka and two packs of bullets.\" Hearing Wang Renjie say this, Zhao Yu sighed, completely speechless. Good grief, this was a massive loss.\n\n\"Comrade Wang, take a few comrades and walk around nearby to see if you can find a local to ask for directions. Platoon Leader Zhao, take your platoon and maintain vigilance in the area. There must be more than just this many bandits, be careful not to get ambushed.\" A middle-aged officer walked over and gave the next orders. It seemed they couldn't leave today; they were lost, and there was no telling when they would make their way out.\n\n\"Yes! Comrade Seryozha!\" The two of them saluted and hurriedly got the other comrades moving. Watching their departing figures, Mao An'ying sighed. He was getting closer and closer to the hometown he had been away from for nearly twenty years. The mountains and rivers of his homeland—with the whistle of the ocean liner setting sail, his longing for his native soil was buried deep within Mao An'ying's heart.\n\nDuring his days and nights in foreign lands, Mao An'ying seemed to recall all this very rarely. Yet, whenever he woke up in the middle of the night, the salty wind of that departure would blow into his mind once more, reminding him that he should return. But he could not return, nor was he able to return. Here sat not only the entrustment of his father, but also many realistic factors. From landing in Marseille, France, to journeying to the Ivanovo International Children's Home, he too had once fantasized that the war would end quickly. The war did end quickly, but it was the collapse of the Soviet Union under Bukharin's leadership.\n\nAs the Red Army collapsed like a falling mountain, he was forced to evacuate urgently with the academy to Kostroma. Life as a student in an era of upheaval was exceptionally hard. Mao An'ying persevered with his sheer willpower and determination, completing all his studies over the next few years and successfully graduating. However, bad news followed one after another. He learned that the aggressive Japanese offensive had crushed the last resistance in Chongqing, and the Republican government had ceased to resist. His father was leading his army to continue moving westward, undergoing encirclement by multiple factions. He did not know what exactly was happening in his homeland or how his father was doing at that moment, but only one thing was certain: his homeland had fallen into enemy hands."
 STL_CPC_main_story.2.o: "He had no home to return to."

 STL_CPC_main_story.3.t: "Long Road Home (2)"
 STL_CPC_main_story.3.desc: "\"A young man makes his resolve to leave his native village, swearing not to return until his studies are crowned with fame. Why must one's bones be buried in one's homeland? Life offers green hills everywhere.\" This was his father's bold declaration in his youth, and Mao An'ying remembered it deeply. Green hills everywhere are a fitting place to bury loyal bones; there is no need to return wrapped in horsehide.\n\nWith no hope of returning home, Mao An'ying immediately applied to join the West Russian Revolutionary Front, and participated in countless low-intensity local security operations as a platoon-level commander. As a soldier, he needed to fight, and he also knew whose son he was. As the son of a great Chinese revolutionary, he had to prove whether or not he was worthy.\n\nWhen the Suvorov Offensive was launched in 1954, he had already been promoted to commander of the 88th Infantry Brigade, and won the Guards title for his excellent performance leading the brigade on the northern front. Regrettably, the valor of a single unit was never enough. The West Russian War ended with the defeat and disintegration of the West Russian Revolutionary Front, and Mao An'ying felt deeply disappointed by the internal power struggles of the Front, developing the intent to leave.\n\nWith Marshal Voroshilov's approval, Mao An'ying was able to take a portion of the original commanders and fighters from the 88th Guards Infantry Brigade, traveling to the Far East in the name of the Front's diplomatic mission to seek a way back home. To get from one side of Russia to the other was not easy; this return trip would not be as easy as when he first arrived. It required traversing the vast territory of the Soviet Union, and this land was now full of warlords and various bandits, making it difficult to cross.\n\nUpholding his father's optimism, Mao An'ying called this adventure the \"Soviet Long March.\" He wanted to walk a Long March of his own, just as his father did back then. Mao An'ying desperately wanted to know what had happened to his homeland, things he could only learn once he reached the Far East. How was his father doing? What had become of the land of China? Mao An'ying had already prepared for the worst—at worst, they would just start another revolution. As long as he was still alive, he would never give up a shred of hope.\n\n\"The Long March is a manifesto, the Long March is a propaganda force, the Long March is a seeding machine\"—this was the experience his father left him. Along the way to the Far East, Mao An'ying's troops actually expanded quite a bit. On their Long March, they helped local residents drive away bandits and thieves, helped them build houses, and trained their troops. These actions made their stories spread far and wide, and many people with ideals were attracted by Mao An'ying and his troops, choosing to join the 88th Guards Brigade.\n\nMao An'ying was well aware of the hardships and difficulties of this journey, but he would not give up. Revolution must always maintain optimism. He simply and quietly managed this complex company, calculating the travel distance every day to see how much further it was to his hometown, and how much further to his motherland."
 STL_CPC_main_story.3.o: "Home is not far away."

 STL_CPC_main_story.10.t: "Long Road Home (3)"
 STL_CPC_main_story.10.desc: "A thin mist rises from Lake Baikal in the early morning, turning into the haze before the sun comes up. The few street lamps used for illumination in Verkhneudinsk went out one after another. This city has just woken up from its slumber, but some people have already begun to work early.\n\nThe camp of the 88th Guards Infantry Brigade was even more bustling than usual. Soldiers were dismantling tents while warmly discussing life after returning home. Normal life has been restored, and the wounds left by the war are being gradually erased by machines and the hands of workers. Today, they are setting off to return home. Zhao Tianjun was so excited that he didn't sleep at all last night, and many comrades were just like him, awake the whole night. They are finally going home—the long road home.\n\nIn order to return home as quickly as possible, Mao An'ying ordered them to travel light. Much of the heavy weaponry brought along the way was left behind in Buryatia, and excess supplies were also left here, which could be considered as aid to Buryatia. They only brought enough supplies to make the return trip. Traveling light was fine, but Zhao Tianjun couldn't bear to let things go; he had collected many things along the way as souvenirs, and he would rather carry two fewer packs of ammunition than leave them behind.\n\nWatching Zhao Tianjun busy running back and forth, Song Jiusheng kept quiet. Curiously, most of those who felt excited about returning home were the young people. Some of them were born after the Great War ended. Aside from having Chinese looks, it could be said they had no prior connection to China. The 88th Brigade also had many Sino-Russian mixed-bloods whose fathers or mothers were students who studied in the Soviet Union early on. Because the Patriotic War broke out so rapidly, many of these people fell on the battlefield, especially during the Second West Russian War.\n\nMany people in the ranks were not strictly Chinese anymore, but they possessed a very deep emotional connection to the word \"return\"—even deeper than that of the older generation. It was precisely because of the unknown that they yearned for it; not knowing the current state of China gave them a strong desire to return home.\n\nReturning home is not just redemption for the living, but also the entrustment of the deceased. The 88th Brigade was not without losses on this journey; ambushes and diseases had claimed many lives. But Mao An'ying was determined to bring them all home. This was his oath when he set off from West Russia: to bring everyone back.\n\nSeveral dedicated trucks carried the ashes of the deceased, and some others whose ashes couldn't be processed in time had only their identification tags brought back. In the Far Eastern Soviet Civil War, many comrades also sacrificed their lives; they fell in places closest to home. These deceased were true heroes, a group of real soldiers.\n\nMao An'ying sometimes even felt he was a bit selfish, after all, they had helped the Russians for so long and shed blood for them here. But even if it happened all over again, they would probably make the same choice.\n\nFor soldiers fighting for the cause of communism, wherever there is oppression, there they will be. What Mao An'ying can do now is carry the entrustment of these deceased comrades and bury them in the yellow earth of their hometown."
 STL_CPC_main_story.10.o: "\"I am bringing you all home.\""

 STL_CPC_main_story.11.t: "Long Road Home (4)"
 STL_CPC_main_story.11.desc: "\"Go south from here, and eventually you will see a radar station. Seeing that radar station means you're not far from the Revolutionary Committee. I already explained this to Marshal Vasilevsky when I came, and once we get there, there will be dedicated personnel to receive us.\"\n\nBrezhnev was explaining the things to keep in mind to Sablin. After handling some domestic matters, Sablin also chose to accompany Mao An'ying to the Northwest. The Far Eastern Soviet was once an exporter of industrial goods, but now after the war, many factories have been destroyed, turning it into an importer.\n\nTo quickly restore production, Sablin still needed help from the Northwest. Right now, the Far Eastern Soviet is full of things waiting to be rebuilt, and they don't have the time to wait around. Braun did not accompany Sablin; for one thing, he still believed he had committed errors in China and shouldn't go over, and for another, the Far Eastern Soviet still needed someone to sit in command. Since Sablin was going to the Northwest, someone had to stay behind to handle the work here.\n\nBrezhnev was about to take people and leave, and Malkheyev was somewhat reluctant to see him go. They got along very well. Before leaving, Malkheyev even gave Brezhnev a crate of alcohol. But Brezhnev's favorite things were still shiny medals—in Buryatia, he had even obtained a Victory Medal, which made him as happy as completing all achievements.\n\nReturning to the motherland, Mao An'ying was now a bit nervous, because besides leading his troops back, he was also going to \"meet the parents\" this time. From his conversations with Sablin, Mao An'ying learned that his father was still alive. This was the best news he had received back then—father and son could finally meet.\n\nLiu Siqi told him that her father was a minor cadre in the Northwest, and Mao An'ying did not tell her about his background. Upon returning, there would be many things to deal with. Just thinking about it gave Mao An'ying a headache, so he could only take it one step at a time.\n\nReturning to the hometown for real, their pace actually slowed down instead, perhaps also because of the weather. Their troops had been moving through this Siberian land for several days. During the first few days, they moved quite fast in the trucks, but the infrastructure level here was too poor—there wasn't even a decent road, only a path trodden out by people walking for a long time. There was originally no path on the earth, but as many people walked, a path was made.\n\nDue to the weather, this kind of road became extremely slippery, and the trucks often got stuck, which forced everyone to get out and push. Fortunately, they had left the heavy equipment behind in Buryatia, otherwise it would have been abandoned in this place for nothing. Sablin also took in many sights on this journey, seeing the complete picture of the Far East.\n\nApart from Irkutsk, Verkhneudinsk, and a few large cities, the other places seemed to still live in the Tsarist era—low houses and the impoverished lives of herders. All of this indicated that the situation was not as good as Sablin had imagined."
 STL_CPC_main_story.11.o: "\"I must change all of this.\""

 STL_CPC_main_story.12.t: "Long Road Home (5)"
 STL_CPC_main_story.12.desc: "The goal of Russian reunification must be put aside for the time being. Right now, it is more important to restore and improve the people's lives, otherwise reunification would lead to complete collapse. Mao An'ying had heard stories of the Red Army crossing the grasslands. He originally thought many of the details were exaggerated by later generations, but the present situation was even worse than the legends. Stepping on the damp meadows, every step was cautious, every step inevitably picked up more mud, and every step was heavier than the last.\n\nMao An'ying and several commanders climbed up to a high vantage point to plan the direction of their march. Where there were simple paths, where there were villages and people, where the supply wagons could pass, where the gullies were prone to waterlogging... Brezhnev came cheering on horseback; he had already established contact with Mongolia, and the first destination of their homecoming had arrived. Marshal Vasilevsky and Gao Gang were personally waiting for them. The sky gradually darkened, and the 88th Brigade led by Mao An'ying also temporarily stationed in Ulaanbaatar.\n\nFor the 88th Brigade, this was another of countless times they had stayed under someone else's roof. Along the way, the 88th Brigade encountered a series of setbacks, and countless factions had designs on this massive army. Although home seemed a step closer, it was still far away on the horizon.\n\nRest time was tight, and there was no time to prepare exquisite food, but salt was available anyway. Everyone ate whatever was at hand along the way. Soldiers of the 88th Brigade hauled canned food out of the big trucks. They were about to reach the motherland, and once they were home, these things wouldn't be as important, so they might as well eat them early rather than carry the weight.\n\nSoldiers gathered around the fire eating roasted food, and alcohol broke down the barriers between the two sides. Hearing that a banquet was being held here, Brezhnev even contributed his crate of alcohol. Some who were a bit tipsy were testing their strength against each other, while others ate slowly and chatted with people nearby. Just then, a few soldiers brought out musical instruments, and everyone started singing. Having overcome all kinds of difficulties along the way, everyone's heart relaxed as they drew closer to home, after all, home was right ahead."
 STL_CPC_main_story.12.o: "\"The hometown is right ahead!\""

 STL_CPC_main_story.13.t: "Long Road Home (End)"
 STL_CPC_main_story.13.desc: "Although the old roads were poorly maintained, they were still much easier to walk on than the meadows from Buryatia to Ulaanbaatar. \"The Northwest border is just ahead.\" In the Northwest, they finally did not have to live in fear; it was very safe here, and far from starvation.\n\n\"Comrades, we've arrived! Walk further ahead, and under our feet will be the soil of our motherland!\" When Mao An'ying shouted this, many soldiers jumped out of the trucks. This stretch of the road, they wanted to walk personally, taking their first steps back into the country. Zhao Tianjun jumped down just like the other soldiers. He originally thought he would cry, laugh, or cheer loudly, but Zhao Tianjun did none of that. He just quietly stepped onto the motherland's soil, just like the other soldiers, and continued walking forward.\n\n\"Contact the radio here. Comrades, unfurl our flags, we are back!\" The flag of the 88th Brigade was raised, and alongside it was a large flag with two Chinese characters written on it: \"Returning Home.\" The border post soon received the news. They had previously heard that an army would be coming through the border, that it was their troops. Zhao Weiming immediately sent people to investigate, and after verifying their identities, instantly sent a message to Xi'an: this legendary unit had returned.\n\n\"Chairman, the comrades from Buryatia have arrived, and that unit of the 88th Brigade has also come. They've reached Xi'an. Comrade Liu Siqi has returned too. Would the Chairman like to go see them?\" An officer ran over to report to the Chairman. This was definitely worth a visit—to see which good lad had \"abducted\" his daughter.\n\nAs Liu Siqi's adoptive father, Mao Zedong naturally wanted to meet the son-in-law who had frequently appeared in rumors. What exactly did this person look like? Coming over from Buryatia, this hero who returned with Liu Siqi was also leading a moderately sized force. But the Chairman was in no hurry to go see them right away; after all, they had just returned, and should naturally have some time alone first. However, the Chairman was anxious in his heart, and in this conflicted state, the Premier saw the Chairman pacing around in circles.\n\n\"Old Mao, don't worry. To be able to make the journey all the way from Russia, Comrade Seryozha must be a resolute soldier. I think that's why Comrade Liu Siqi chose to be with him.\" The Premier gave a relatively fair assessment. He hadn't seen this comrade from Russia either. The Premier currently thought the person was probably a Sino-Russian mixed-blood who had learned something after his relatives passed away there, and then returned to China.\n\n\"After news of An'ying was lost, I've always treated Siqi like my own daughter. She's the child of a martyr, in her thirties now, and it's time she finds a good home. I also trust her judgment.\" All this talk boiled down to the Chairman still being somewhat uneasy, after all, this had developed too fast—it hadn't even been a month and she had already been \"abducted.\" The Chairman hadn't met this comrade from Russia yet, nor had he vetted him, so he was inevitably somewhat worried."
 STL_CPC_main_story.13.o: "\"Enlai, come with me to have a look.\""

 STL_CPC_main_story.14.t: "An Old Father's Worries"
 STL_CPC_main_story.14.desc: "\"Me? I think I shouldn't go. There are things to arrange at the Planning Commission, I have to go check on it. I'll call Little Sun and let him accompany the Chairman.\" \"Nie Rongzhen is handling things over at the Planning Commission, it's not urgent for you to go. Little Sun can come along too.\"\n\n\"Chairman, there are plans to build a new factory in the south of Xi'an. Do you want to go take a look?\" Just as the Chairman was pulling the Premier to leave, Comrade Liu Shaoqi walked over somewhat tactlessly and spoke about the factory. The Northwest has added many factories lately, and if this continues, they won't have to rely on foreign industry anymore.\n\n\"Shaoqi, about... the construction status in the south of Xi'an, I'm not an expert either, so it doesn't matter if I go look or not. If you have nothing to do this afternoon, help me go take a look.\" Chairman Mao made an excuse to deflect. The understanding Liu Shaoqi could tell at a glance that Old Mao was hinting for him to clear off—this factory wasn't going to build itself just because the Chairman took a look at it. The Chairman was busy trying to see his daughter right now.\n\n\"Sigh, mother's...\" Having come in vain, Comrade Shaoqi left in a gentle and refined manner. The Premier and Chairman Mao soon arrived at the meeting room. Liu Siqi and their future son-in-law were inside. Since this was the Chairman's family matter, the Premier tactfully stood aside to wait.\n\n\"Old Mao, I know what you're worried about. Others have given high praise to this young man from Russia. I've also met a few soldiers from the 88th Brigade, they are all very good people. If the soldiers under him have such good discipline, the man himself certainly isn't bad. You don't need to worry about this.\" Chairman Mao could hear the noise of the triumphant soldiers inside the meeting room, thinking about whether his daughter had grown fat or thin. How had she fared during her time in Buryatia?\n\nJust at this moment, Liu Siqi walked out of the room. She hadn't told Mao An'ying her father's official identity, only that he was a minor cadre in Xi'an. Now that they were going to meet, she certainly had to tell the truth. She was afraid he wouldn't be able to accept it right away, so she wanted to brief them before the Chairman went in. Seeing Liu Siqi come out, the Chairman stood up from his seat and looked her up and down. After losing contact with Mao An'ying, the Chairman was very afraid of losing another.\n\nThe Chairman was by no means a cold revolutionist; on the contrary, Chairman Mao was a very emotional person, to the point where he once said he was most afraid of enemies kneeling down in front of him and crying for mercy—seeing them kowtow made his heart soften. Many relatives, friends, and comrades had already sacrificed their lives for the cause of the revolution, and the Chairman simply kept his feelings for them unspoken.\n\nWhen Chairman Mao's third brother sacrificed his life, the hat he wore was still hung by the Chairman's bedside. When the Chairman was alone, he liked to look at that hat and smoke, sitting for several hours."
 STL_CPC_main_story.14.o: "\"I told Comrade Seryozha that my father is a minor cadre in the Northwest, I haven't told him the truth yet.\""

 STL_CPC_main_story.15.t: "Meeting"
 STL_CPC_main_story.15.desc: "The Chairman understood immediately upon hearing Liu Siqi's words; it meant he temporarily couldn't go in. Portraits of the Chairman hung everywhere in the Northwest—wouldn't his identity be instantly exposed the moment he walked in?\n\n\"Old Mao, let your Brother Zhou go in first to clear things up before you head over.\" \"Anxious? I'm not anxious, not anxious at all.\" After saying that, he squinted as if about to sleep. \"I'll take a nap first, by the time you're done talking, I'll probably be awake.\" The Premier smiled, sighed, and went in with Liu Siqi. The noise inside also died down, presumably because they realized what the situation was. Shortly after, the officers of the 88th Brigade came out together, leaving room for the few of them to talk.\n\n\"Little Sun, bring a chair over, quickly.\" Sun Linyuan didn't know what the Chairman meant, but hurriedly brought a chair over. The Chairman placed the chair against the wall and stepped up onto it. Because there was a piece of glass on the door, although he couldn't hear, he could see the situation inside. The Chairman also wanted to see what this son-in-law looked like. Him stepping up startled Sun Linyuan. What if he fell down? \"Chairman, please come down! If Minister Li sees this, he'll have me shot!\" Sun Linyuan pleaded in a low voice.\n\n\"Then leave the room right now, that way nobody will know.\" Hearing the Chairman talk like this, Sun Linyuan felt a surge of helplessness, but had no choice but to stand behind the Chairman and hold the chair—if the Chairman fell, shooting him ten times over wouldn't be enough. The Chairman quietly peeked in to observe. At first glance, he saw Liu Siqi sitting in one of the rows further back, and next to her was a handsome soldier. \"Sigh, the child has grown up, she can't be kept anymore,\" the Chairman thought.\n\n\"I don't know what Enlai is asking him, but I must vet him properly.\" He peeked in again. Not bad—a sturdy build, broad shoulders, a mature and steady posture; the man had a seasoned air that didn't match his age, which was probably honed in prolonged combat. No wonder Liu Yalou admired him so much.\n\nLiu Siqi held his hand, the young couple sitting together openly. The young man wore a Soviet cadet uniform that was a bit worn out but hung with quite a few medals. The Premier felt this person looked familiar, but couldn't recall exactly. After all, nearly twenty years had passed, and the current Mao An'ying could barely speak fluent Chinese anymore."
 STL_CPC_main_story.15.o: "\"Uncle Zhou, I'm An'ying.\""

 STL_CPC_main_story.16.t: "Comedy"
 STL_CPC_main_story.16.desc: "Mao An'ying took a photo out of his pocket—it was a photo of him and his father. He hadn't told Liu Siqi that his father was actually the current leader of the Northwest, Mao Zedong. \"Old Mao, look who's back!\" Although he felt very familiar and they looked very much alike, he wasn't certain if it was the same person. Now it could be confirmed—this person was Mao An'ying! \"Dad, An'ying is back!\" Liu Siqi ran out of the room to tell the Chairman. The Chairman was visibly stunned upon hearing this—the man sitting inside was actually Mao An'ying! Having been missing for nearly twenty years, he had actually returned! \"Is it really An'ying?\" The Chairman's voice trembled; he too couldn't believe his child would return in such a manner. Who could have imagined this? The father walked a Long March, and the son walked a Long March too. He didn't know how to describe such a legendary story. The Chairman walked in quickly and saw Mao An'ying sitting in the chair. Mao An'ying also saw the Chairman. Both were clearly unprepared and froze for a moment, just looking at each other. \"An'ying? Is it really you? You're back?\" The Chairman's voice was still trembling; he still couldn't believe his son was still alive. Twenty years—these twenty years were enough to make an old man run dry of tears. The Premier and Little Sun naturally didn't want to disrupt the atmosphere and quietly left, though they still found it hard to believe. For such a thing to happen was simply miraculous. This story was too legendary, wasn't it? An'ying found his father, Siqi found love, and Old Mao found his son. Soon the news spread across the Northwest: the commander of that heroic unit, the 88th Brigade, was Chairman Mao's son, Mao An'ying, who had been missing for over twenty years. He was still alive, and had lived to become the Chairman's pride. Mao An'ying had asked himself on countless nights whether he was worthy as the child of this leader. Today, the Chairman answered him in a very certain tone."
 STL_CPC_main_story.16.o: "You are worthy, even more outstanding than him."

 STL_AnYing_LFB_tt: "If the father had died for the country during the War of Resistance Against Japanese Aggression, the storyline of the 88th Guards Infantry Brigade and Mao An'ying's §xindependent growth§! would perhaps unfold in the timeline of §R\"The New Order: Light from Lake Baikal\"§!...\n Mao An'ying joins the £TNO_game_rule_flag_CPC Northwest National Defense Front."

