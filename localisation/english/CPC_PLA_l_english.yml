 TER_CMC_info: "£TER_texticon_PLA §YCentral Military Commission§!\n----------------------------------\n§YMilitary Buildup§!\n£TER_texticon_PLA §RThe Military reforms of PLA§!shall orientate itself in §mModernisation§! and §xAll-out War§!, so as to outcompete the £GNG_japanese_frustration_texticon §jJapanese salvages§!. To fully implement the ideals of our military renovation, in our bid to §Yconcentrate the revolutionary forces§!, we shall unlock mutually exclusive §RMilitary Reform Tenets§!, with most of them consisting of §YBipolar solutions§!, with §Y10 days§!prior to their enactment. Other unanimously passed decisions§Gshall be convened immediately§!.\n\n§mInstitute of National Defence§!\nUnder the guidance of £CPC_texticon §xRevolution orientated Marxism-Leninism§! and £TER_texticon_mao §GMao Zedong Thoughts§!, Our §mNational Defence Technological Advance§! shall follow a unique suit: One not only dedicated to those of §YEquipments and Strategies§!, but also of §GPeople and Welfare§! and of §GProductive Forces§!.\nAs per the §xDecadal Plan §!on §mNational Defence Technologies§!, we may subsequently embark on technological advancements in §mSpecific Fields§!. As we face §Rfurther obstacles§!, we may also choose to §RABORT§! the §xDecadal Plan §!on §mNational Defence Technologies§!."
