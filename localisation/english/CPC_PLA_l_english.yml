 TER_XJ_SP_ended: "§GThe Xinjiang region§! holds great strategic significance in our nuclear program. After further discussions and evaluations with Xinjiang representatives, the Xinjiang Border Government has pledged full support for the §xDawn§! §OPlan§!, §Gincreasing§! the project speed by §G1.5% per month§!."