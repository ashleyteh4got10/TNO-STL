 CPC_NADT_event.1.t: "Next direction of research"
 CPC_NADT_event.1.d: "According to the Ten-Year National Defense Research Plan, our next research phase will shift focus from agriculture to industry, with particular emphasis on solving the issue of assembly lines being difficult to dismantle and relocate. To address this, comrades from the Industrial Technology Research Institute of the National Defense Research Institute have proposed an initial concept for simplified and lightweight assembly lines.\n\nSpecifically, this concept aims to streamline existing production processes, enhancing industrial flexibility and efficiency to adapt to resource constraints and limited technological conditions. Given that the Front's current industrial foundation remains relatively weak and incapable of supporting large-scale, complex assembly line production, it is necessary to develop lighter, easily deployable, and low-maintenance production systems to meet the demands of military supplies and daily necessities."
 CPC_NADT_event.1.o: "Approve the project, start implementation."
 CPC_NADT_event.2.t: "Next direction of research"
 CPC_NADT_event.2.d: "According to the Ten-Year National Defense Research Plan, upon completing the “[NADT_completed_proj]” project, our next research phase may proceed in one of three directions:\n\nWeapons Technology Research – This path focuses on the development of advanced and high-precision weaponry to meet our army’s future needs for large-scale modern warfare.\nCivilian Technology Research – This path aims to enhance our production capacity, consolidate the achievements of base area development, and ensure the rapid economic and social growth of our controlled territories.\nLogistics and Support Technology Research – This path is dedicated to establishing a comprehensive strategic support system to ensure our army’s sustained combat capability and logistical stability in future large-scale modern warfare.\n\nDue to limited research resources, only one direction can be pursued at each stage. As research progresses, the monthly cost of research projects will gradually increase. Should circumstances require, we may also choose to terminate the Ten-Year National Defense Research Plan, though doing so would come at a cost we would rather not face."
