 CPC_NUKE.1.t: "Miss Autumn is here"
 CPC_NUKE.1.d: "Encrypted Message: Dressing and hair braiding complete. Zero hour has arrived. Blood pressure normal. Miss Autumn is getting married."
 CPC_NUKE.1.o: "Finally..."
 CPC_NUKE.2.t: "[Get_newspaper_header]China successfully tested an atomic bomb"
 CPC_NUKE.2.d: "The Ministry of Foreign Affairs of the People's Republic of China has officially announced that China has successfully detonated an atomic bomb in the western desert, marking its entry into the ranks of nuclear-armed nations. At a press conference, spokesperson Qiao Guanhua stated that nuclear weapons represent a milestone in China's national defense development, but emphasized that China remains committed to peace as its primary vision, aiming to prevent the people of Asia from being subjected to intimidation and coercion by certain major powers.\n\nJapan's political circles expressed deep regret over China's nuclear capability, declaring that the East Asian continent is facing its most unfortunate moment and accusing China of destabilizing an already fragile peace with nuclear weapons. The Ministry of Foreign Affairs further stated that Japan will not, by any means, allow the people of East Asia to suffer the devastation of atomic weapons.\n\nMeanwhile, the United States urged all East Asian nations to exercise restraint and dismissed all unofficial claims regarding China's nuclear weapons."
 CPC_NUKE.2.o: "The Roar of the Dragon"
 CPC_NUKE.3.t: "Miss Qiu's Dowry"
 CPC_NUKE.3.d: "Under the moonlight, the corridor was cast in a ghostly white hue as a few figures silently advanced toward a door. The one leading the way pulled out a key and unlocked the red-lacquered door. Inside, stacks of documents sat undisturbed on the table. Seeing them intact, the group collectively let out a sigh of relief—these papers were the culmination of years of effort by the Front. Amidst the towering piles of white sheets, a portrait of a young lady lay hidden.\n\nShe was originally meant to be called Miss Qiu, but the elders in her family—her grandfather, uncles, and other relatives—found the name unrefined. Thus, they gave her a homophonous but more elegant name: Miss Autumn. The golden sands of the Northwest nurtured eternal autumn, and autumn itself symbolized harvest, the very foundation upon which the Chinese nation could secure its existence in these dark and turbulent times.\n\nThe group took their seats one by one, except for Lu Hefu, who remained standing by the table.\n\n\"Based on current theories, our manually calculated data, as well as those processed by computers, align perfectly with figures published in various academic journals,\" Lu said. \"Therefore, as long as the Front can guarantee the supply of raw materials and the necessary conditions for experimentation, our nuclear engineering efforts should proceed to the next stage.\"\n\nFinishing his statement, Lu took his seat, turning his gaze to Xiao Jingguang, whose sharp features seemed chiseled from stone.\n\nXiao nodded.\n\n\"Theoretical progress has been smooth. The next step will require uranium mines and a proper test site. As long as you determine the direction, the organization will fully support you.\"\n\nA young student sat quietly, listening to the conversation. The aged voices of these men reached his ears, yet they thundered even louder than the muffled pounding of his own heart. Unconsciously, his fingers had coiled the lamp’s pull cord several times around his hand—but fortunately, this did nothing to disrupt the discussion.\n\nOutside, rain clouds receded swiftly toward the rising sun, while the moonlight, white as dawn itself, poured through the window, scattering upon those in conversation. Though the room was dim, the light was just enough.\n\nAnd so, beneath the moonlit night, they chose the bride’s wedding gown."
 CPC_NUKE.3.o1: "Without raw materials, it’s useless no matter where you go."
 CPC_NUKE.3.o2: "First-hand data from the laboratory is more important."
 TER_april_fool_nuke_YEEEEEEEES: "§YThe Grand Fireworks Show Begins!§!\n\nDeveloper’s Note: For the best viewing experience, we recommend zooming the map to fully display the entire §Y[CPC.getname]§! territory.\n\nThe fireworks effects are purely an April Fool’s visual event with no impact on actual gameplay progression. Enjoy the spectacle, and §GHappy April Fool’s Day! :)§!"
 CPC_MEOW.0.t: "Happy April Fools' Day!"
 CPC_MEOW.0.d: "Confirm to active April Fools' Event?"
 CPC_MEOW.0.o1: "Go it!"
 CPC_MEOW.0.o2: "NO!"
 CPC_MEOW.1.t: "MEOW - 1"
 CPC_MEOW.1.d: "A gray-and-white tabby cat with a triangular face is pacing back and forth at your doorstep, occasionally letting out a soft \"meow\" as if calling for you to come over and take a look."
 CPC_MEOW.1.o1: "Put down what you're doing and walk over to take a look."
 CPC_MEOW.1.o2: "I am busy now, no time."
 CPC_MEOW.2.t: "MEOW - 2"
 CPC_MEOW.2.d: "Alright, since you've already made up your mind, I'll do as you say."
 CPC_MEOW.2.o: "April Fool’s Event Closed."
 CPC_MEOW.3.t: "MEOW - 3"
 CPC_MEOW.3.d: "The little cat, seeing no response from you, flicks its tail and hops away, as if nothing had ever happened. The world continues to run as usual."
 CPC_MEOW.3.o: "Boring"
 CPC_MEOW.4.t: "MEOW - 4"
 CPC_MEOW.4.d: "You decide to take a closer look at the cat.Surprisingly, it isn't afraid of you—instead, it steps forward confidently on all fours, approaching you with ease. Before you know it, you feel the soft, warm touch of its fur brushing against your legs as it gently weaves between them."
 CPC_MEOW.4.o: "It's incredibly affectionate."
 CPC_MEOW.5.t: "MEOW - 5"
 CPC_MEOW.5.d: "Just as you were enjoying the moment, the little cat suddenly stopped circling around you and trotted off purposefully. It led you straight to its food bowl—completely empty, not even a trace of leftovers.In the distance, you spot a big black dog licking its lips. Maybe it was the one who stole the cat’s meal. And now, the cat has come to you for help, demanding food. Truly, it seems there’s no such thing as a visit without a reason."
 CPC_MEOW.5.o1: "Insane."
 CPC_MEOW.5.o2: "You grit your teeth and give in."
 CPC_MEOW.6.t: "MEOW - 6"
 CPC_MEOW.6.d: "You take a moment to think—you can barely afford three meals a day for yourself, let alone spare any leftovers for the cat.\n\nWith that, you turn around and head back, leaving the little cat behind, meowing softly into the empty air."
 CPC_MEOW.6.o: "I DO NOT CARE."
 CPC_MEOW.7.t: "MEOW - 7"
 CPC_MEOW.7.d: "You ran back home, scooped a spoonful of rice soup from the pot on the stove, and walked back quickly. You were only a few steps away from the kitten's food bowl when you stumbled and fell, spilling the rice soup all over the floor. What bad luck!"
 CPC_MEOW.7.o1: "Blame me for meddling—I’m done with this!\n\nYou let go of the matter entirely, turning away without a second thought. Whatever happens next is no longer your concern."
 CPC_MEOW.7.o2: "Now that you have made the decision, you have to feed the cat."
 CPC_MEOW.8.t: "MEOW - 8"
 CPC_MEOW.8.d: "You got up, brushed off the dirt on your body, rubbed your bruised elbows, and went back to the stove. This time you changed the bowl and steadily brought the rice soup over and poured it into the kitten's food bowl."
 CPC_MEOW.8.o: "The kitten started eating happily."
 CPC_MEOW.9.t: "MEOW - 9"
 CPC_MEOW.9.d: "The kitten thinks you are very good to her, at least the best within five miles, so the kitten decided to take you to see a fireworks display."
 CPC_MEOW.9.o: "Just go it."
 CPC_MEOW.10.t: "MEOW - 9"
 CPC_MEOW.10.d: "After watching the fireworks, you were stunned. The kitten smiled at you as if jokingly, and jumped out of the wall. When you chased it, it had disappeared."
 CPC_MEOW.10.o: "It would be best to see what the damage was."
 CPC_MEOW.11.t: "MEOW - 11"
 CPC_MEOW.11.d: "At the spot where the fireworks had risen, you stumble upon a dry, brittle, disk-shaped noodle cake. Out of curiosity, you break off a piece and put it in your mouth—it’s edible.\n\nBut then, something strange happens. The broken piece instantly regenerates, restoring the noodle cake back to its original form.\n\nThis noodle cake is infinite—no matter how much you eat, it will never run out!\n\nBeneath the noodle cake, you find a small slip of paper with an intriguing message:\n\n\"Perhaps, in the future, they will debate an utterly trivial question: If historical figures were given an infinite supply of instant noodles, would history have changed?\"\n\nAnd now, you will put this question to the test."
 CPC_MEOW.11.o: "It seems there was no loss, just a false alarm."
 CPC_Instant_Noodles: "Unfinished instant noodles"
 CPC_Instant_Noodles_desc: "A Present The Kitten Graces"
