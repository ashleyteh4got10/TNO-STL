 BOOKMARK_VASILEVSKY_NEW: "§xPeople's Revolutionary Committee§!"
 BOOKMARK_VASILEVSKY_NEW_DELAYED: "§YNew content will be released in the §RRed Skies§! version:\n\nForward!\n§W--------------§!\n\n\n£GFX_texticon_bookmark_PRC\n\n\n\n\n§Y     - Complete overhaul of the first decade content\n     - §VHow will the §!Revolution§! proceed?\n     - Brand new §Wpost-war decade content§!, extending the timeline to 1982\n     - §RRevolution for All§!§!§!\n§W--------------§!\n§OOne land, two factions, three powers.§!\n\n§WThis is the best description of §x“The People's Revolutionary Committee”§!. Alexander Vasilevsky, former Marshal of the Soviet Army, now leads his forces holed up in a corner of Russia: Tannu Tuva. But this is not the end of the story. Threats to the Soviet Motherland come not only from §qthe Western £GFX_OMS_great_trial_texticon Nazis§!, but also from §Vthe Eastern £GFX_jap_ijn_texticon Rising Sun§!, and §renemies within§!. For Alexander Vasilevsky, what awaits him and the §VPeople's Revolutionary Committee§! – hope, or despair? The Central Siberian War has pushed him to Kyzyl for a final stand. The North faces the threat of anti-Soviet forces, while the East wages its final struggle against the Japanese.\n\n§RBesieged on three fronts, Alexander Vasilevsky chose to unite against the foreign foe.§!\n\nWhether the Mongolian faction or the Russian faction, both are forces Alexander Vasilevsky must unite. He must carve a path to survival out of this desperate situation. And this path will undoubtedly be long and arduous. Thus, a grand plan formed in his mind: to restore the Motherland, to restore the entire Soviet Union. He refuses to wait for death in this extremity. What he aims for is not merely to escape this desperate situation, but to §ereclaim the ideals of the Soviet Union's founding—§!\n\n§VALL POWER TO THE SOVIETS!§!§!"
 the_union_defender: "Defender of Union"
 SAF_THENEWORDER_DESC: "§FSouth Africa has always been a crossroads of many different peoples. After the consolidation of British rule over South Africa with the completion of the Second Boer war in 1902 where the descendants of the original Dutch settlers were crushed and forcibly incorporated into the Dominion of South Africa, something that the Boer had never really forgotten about. Yet with the sudden, shocking end of the British empire at the end of the Second World War left the Dominion staring down three massive German Reichkommisariats to the north, as South Africa became the last bastion of democracy on the African continent.\n\nA democracy for some, that is. South Africa's majority Black population have no voice in how the country is run by the Anglo-Saxon United party, while the Boers' contacts with the German colonies in the north continue to deepen. It is clear that in 1962 South Africa finds itself on a crossroad between two rising forces both intent on taking up arms for their future. The fine balance between German and American influence externally and Boer and ANC influence internally is starting to break down, and soon enough the greatest crisis in South Africa's history is about to begin. Will South Africa perish under its own contradictions, or rise like a phoenix through fire and flame?§!"

 BOOKMARK_NOVOSIBIRSK_USA: "§xUnited§!§W States§!§B of America§!"
 BOOKMARK_NOVOSIBIRSK_USA_DELAYED: "Added in the §ONew Decade§! version:\n\n§YGlenn Administration from the 1976 election, extending playable time to 1984\n\nNew GFX interface and narrative text\n\nDynamic nuclear, warfare, and political mechanics\n\nWithin eight years, lead America from the shadow of lunar failure to land on Mars§!\n§W--------------\n\n\n£GFX_texticon_bookmark_USA\n\n\n\n\n§FIn 1962, Nixon's executive order nearly dissolved §mNASA§F. As America's first orbital astronaut, §WJohn Glenn§F was dismayed and vowed to realize his dreams.\n\nIn 1964, §WGlenn§F announced his bid for governor, later becoming an Ohio senator. He bided his time, awaiting his shot at the presidency.\nBy 1976, as the §ONational Progressive Convention§F collapsed, §WJohn Glenn§F seized the moment. He declared his presidential candidacy, aiming to revive §mNASA§F and charge toward the §eNew Frontier§F.§!"

 BOOKMARK_RUSSIA: "Divided §xRus§!§Wsi§!§ma§!"
 BOOKMARK_RUSSIA_DELAYED: "Added in the §fVictory Day§! version:\n\n§YPost-Second West Russian War (1976) content: 4 years of rebuilding for all Russian warlords\n\nNew narrative text\n\nFour additional years of political content beyond fascist unifiers\n\nWithin eight years, forge Russia into the world's sole superpower rivaling the §xUnited§!§W States§!§B of America§!\n§W--------------\n\n\n£GFX_texticon_bookmark_UKR\n\n\n\n\n§FIn 1972, §WRussia§! reunified, preparing for war.\n\nIn 1975, the §xSecond West Russian War§! erupted—a final clash between §WRussia§!, §BOFN§!, the §eCo-Prosperity Sphere§!, and the §qUnity Pact§!: §Ra fight to the death§!.\n\nBy 1976, the war ended. Russia reclaimed its territories and began rebuilding. Yet this §aquadripolar world§! remained unstable. Among §qGermany§!, §BAmerica§!, §WRussia§!, and §eJapan§!, two would fall during the §Cillusory 1980s§!, leaving a new bipolar order—§xRussia (USSR)§! and §BAmerica§! locked in Cold War until the new millennium.§!"

 BOOKMARK_NTG_BLOCKER: "§VTHE TAGIL COMMUNE§!"
 BOOKMARK_NTG_BLOCKER_DELAYED: "§GCOMING IN THE PERMANENT REVOLUTION:§!\n§Y- 10 YEARS OF PLAYABLE CONTENT\n- REUNIFY RUSSIA IN FULL\n- CHART THE COURSE OF THE COMMUNE§!\n§F--------------\n\n\n£GFX_texticon_bookmark_NTG\n\n\n\n\n§!The violent disintegration of the Soviet Union at the feet of the German onslaught brutally destroyed any remaining prestige for the left, especially for the now disgraced ideology of communism. As the world’s first socialist superpower burned away to ash, its remains gave way to fertile soil for smaller statelets to grow and flourish.\n\nThe failure of both the West Russian War and the Siberian War, still two deeply gushing wounds, turned humiliation to action for some citizens of the old Union. Sick of opportunistic warlords and the oppressive NKVD and aided by exiled opposition leaders and generals, they congregated underneath the barrier of Trotskyism and formed the Commune of Nizhny Tagil.\n\nSurrounded by hostile states on all sides, and virtually unheard of by the people of 1962, aside from its most fervent supporters, the Commune quietly bides its time, waiting for the right time to strike and restore Trotsky’s legacy in the history books. If done correctly, the world may see the incumbent rise of a glorious 4th international, or something far, far worse."