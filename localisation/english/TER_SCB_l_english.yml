 SCB_QYC_modifier: "To Southeast Asia"
 SCB_QYC_modifier_desc: "\"The South China Sea route is our lifeline. We need to utilize various civilian means such as navigation, trade, and transportation to establish close ties with brother parties in Southeast Asian countries, help each other and move forward together. This is the development path pointed out by Secretary Feng Baiju for the base area.\""
 SCB_CPC_modifier: "South China Bureau"
 SCB_trade_buff_title: "Hainan Trade Gain Briefing"
 SCB_trade_buff_desc: "Monthly Manpower\n[?QYC.SCB_QYC_monthly_population|+1%]\n\nStability\n[?QYC.SCB_QYC_stability_factor|+1%]\n\nProduction efficiency growth\n[?QYC.SCB_QYC_production_factory_efficiency_gain_factor|+1%]\n\nFactory Output\n[?QYC.SCB_QYC_industrial_capacity_factory|+1%]\n\nInitial Production Efficiency\n[?QYC.SCB_QYC_production_factory_start_efficiency_factor|+1%]"
 SCB_trade_weapon_desc: "Monthly Light Weapons: [?QYC.SCB_QYC_light_amount|+0]\n\nMonthly Heavy Weapons:[?QYC.SCB_QYC_heavy_amount|+0]"
