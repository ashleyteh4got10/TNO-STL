 SCB_Burma_tagname: "Burma"
 SCB_Burma_tagdesc: "Burma, located in the western part of the Indochinese Peninsula. It shares borders with China to the northeast, India to the northwest, Laos and Thailand to the southeast, and is bordered by the Bay of Bengal and Andaman Sea to the southwest, with a coastline of 3,200 kilometers. The terrain is high in the north and low in the south, with the north-south-running Rakhine Mountains in the west, and most areas have an elevation of over 1,800 meters. The Shalawam peak on the Burma-India border has an elevation of 3,826 meters, and the northeast is the Shan Plateau. The Irrawaddy River Valley is located between the western mountains and the Shan Plateau. The Irrawaddy River, which is 2,150 kilometers long, is a major transportation artery. The Salween River is 1,660 kilometers long within Burma."
 SCB_Thailand_tagname: "Thailand"
 SCB_Thailand_tagdesc: "Thailand is located in the central part of the Indochinese Peninsula, bordering Cambodia, Laos, and Burma to the east, northeast, west, and northwest respectively, and sharing a border with Malaysia in the south. It is bordered by the Gulf of Thailand to the southeast and the Andaman Sea to the southwest, with a coastline of over 2,600 kilometers. Most of the country is covered by mountains and plateaus, with the central plain in the Menam River basin and the highest elevation in the north, where forests are abundant. Doi Inthanon, at an elevation of 2,576 meters, is the highest peak in the country. The Thai highlands and Tenasserim Hills run along the Thai-Burmese border. The Menam River flows through the central region, with a total length of 1,200 kilometers. The Tonle Sap Lake has a waterway that connects it to the Gulf of Thailand and is a natural flood retention basin. "
 SCB_Vietnam_tagname: "Vietnam"
 SCB_Vietnam_tagdesc: "Vietnam is located in the eastern part of the Indochinese Peninsula, bordering China to the north, Laos and Cambodia to the west, and the South China Sea to the east and southeast. It has a coastline of 3,260 kilometers. The terrain is narrow and elongated, with highlands in the west and lowlands in the east, with 3/4 of the country being covered by mountains and plateaus. The northern and northwestern regions are dominated by high mountains and plateaus, with the highest peak being the Phan Xi Păng peak of the Hoang Lien Son range at an elevation of 3,142 meters. The Truong Son Mountains run north-south along the border of Vietnam, Laos, and Cambodia in the central region. The Red River and Mekong River Delta regions are flat plains. Major rivers include the Red River in the north and the Mekong River in the south. There are also many harbors and islands."
 SCB_Laos_tagname: "Laos"
 SCB_Cambodia_tagname: "Cambodia"
 SCB_Cambodia_tagdesc: "Cambodia is located in the southern part of the Indochinese Peninsula, bordering Vietnam to the east and southeast, Laos to the north, and Thailand to the northwest, with a coastline of 460 kilometers along the Gulf of Thailand. The central and southern parts are plains, while the eastern, northern, and western parts are covered by mountains and plateaus, with forests covering most of the country. There are the Cardamom Mountains, the Dangrek Mountains, and the Elephant Mountains. The highest peak is Phnum Aoral, which has an elevation of 1,813 meters. The Mekong River flows for about 500 kilometers through the country. The Tonle Sap Lake is the largest lake in the Indochinese Peninsula, with an area of over 2,500 square kilometers at low water level."
 SCB_Indonesia_tagname: "Indonesia"
 SCB_Indonesia_tagdesc: "Indonesia is located in the southeastern part of Asia, spanning the equator. It is composed of 13,667 islands of various sizes between the Pacific and Indian Oceans, known as the \"Thousand Islands\" country, with a coastline of 35,000 kilometers. The main islands are Java, Sumatra, southern Kalimantan, western Irian Jaya, Sulawesi, etc. The terrain is mainly mountainous and plateau, with only plains along the coast. Except for Kalimantan Island, all islands have active volcanoes, and earthquakes are frequent. The highest peak in the country is Mount Jayawijaya on Irian Jaya, with an elevation of 5,030 meters, and the summit is snow-capped year-round. The longest river is the Bengawan Solo River on Java Island, which is 560 kilometers long. The islands are connected by many straits and inland seas, among which the Sunda Strait and the Malacca Strait are channels that connect the Indian and Pacific Oceans; the inland seas include the Arafura Sea and the Celebes Sea."
 SCB_Malaya_tagname: "Malaya"
 SCB_Malaya_tagdesc: "Malaysia is divided into two parts by the South China Sea: West Malaysia and East Malaysia. West Malaysia is located in the southern part of the Malay Peninsula, while Sabah and Sarawak are collectively referred to as East Malaysia, located in the northern part of Borneo. The total length of the coastline is 4,192 kilometers. West Malaysia's terrain is high in the north and low in the south, with mountains in the central region and alluvial plains along the east and west coasts. Gunung Tahan is the highest peak, with an elevation of 2,190 meters. The Perak River on the west side and the Pahang River on the east side are the longest rivers. The coastal area of Sarawak is alluvial plain, while the inland is hilly and mountainous, mostly covered by forests, with peaks mostly around 2,000 meters. The western part of Sabah is a coastal plain, while the inland is mostly covered by forested mountains. The Crocker Range runs north-south in the west, with Mount Kinabalu as its main peak at an elevation of 4,101 meters, which is the highest peak in Southeast Asia."
 SCB_Philippines_tagname: "Philippines"
 SCB_Philippines_tagdesc: "The Philippines is an archipelagic country located in the southeastern part of Asia. It faces Taiwan across the Bashi Strait to the north, and is bordered by Indonesia and Malaysia across the Sulu Sea, Sulawesi Sea, and Balabac Strait to the south and southwest. It is bounded by the South China Sea to the west and the Pacific Ocean to the east, with a coastline of 18,533 kilometers. It is composed of 7,107 islands, with 11 main islands such as Luzon, Mindanao, and Samar, which account for about 96% of the total land area of the country. Three-quarters of the country's total land area are covered by mountains, and there are many active volcanoes, with frequent earthquakes. Mount Apo on Mindanao Island is the highest peak in the country, with an elevation of 2,955 meters. The Philippines has many harbors and straits, but its rivers are short and not suitable for navigation."
 SCB_Huanan_tagname: "South China Bureau"
 SCB_Taiwan_tagname: "Taiwan"
 SCB_Taiwan_tagdesc: "Taiwan is located on the continental shelf in the southeast of China, consisting of a total of 88 islands including Taiwan Island, surrounding islands, and the Penghu Islands. The shape of Taiwan Island resembles a spindle, facing the western Pacific Ocean to the east, about 300 kilometers away from the Philippines across the Bashi Strait to the south, about 600 kilometers away from the Ryukyu Islands of Japan to the northeast, and across the Taiwan Strait to the west, facing Fujian Province. It is a key point of the maritime traffic in the southeast of China and the north-south routes in the western Pacific Ocean, and a gateway for the mainland of China to access the Pacific Ocean and the South China Sea. The total area of Taiwan Island is 36,000 square kilometers, with the area of Taiwan Island being 35,798 square kilometers and the surrounding islands having a total area of 74.8 square kilometers. Most of the eastern and central parts are high mountains and hills, with mountains over 500 meters above sea level accounting for about one-third of the area and more than 200 peaks over 3,000 meters above sea level, including the Central Mountain Range, Yushan Mountain Range, Xueshan Mountain Range, Alishan Mountain Range, and Coastal Mountain Range. There are over 600 rivers of different sizes, with a total length of over 42,000 kilometers, and a total coastline of about 1,140 kilometers."
