 TER_SCB_btn_sp_trade: "Fully develop the potential of shipping capacity"
 TER_SCB_btn_sp_trade_desc: "This feature is only available when the current shipping capacity is greater than or equal to §Y90%§! and less than §Y100%§! with the aim of fully utilizing surplus shipping resources to improve the economic and trade environment in Hainan.\n\nThis feature will lock the current shipping capacity at §Y100%§! and provide a §G2%§! boost to all categories of Hainan's economy (excluding arms trade). When there is any change in the shipping regions of the South China Bureau, this feature will be automatically canceled and will need to be manually reactivated."
 TER_SCB_Hainan_graph_info: "This table can help you visually see the gains obtained by the §GQiongya Column§! from trades in Southeast Asia for the month and decide the allocation proportion of light and heavy weapons.\n\nIn this table, §YInfantry equipment, support equipment, individual anti-tank equipment, individual anti-aircraft equipment§! are considered as light weapons, and §Yartillery and trucks§! are considered heavy weapons. Click the §Ggreen square§! to §Gtick§! the corresponding column. If there are multiple types of equipment of the same kind ticked, the corresponding amount of equipment will be distributed to the inventory of the Qiongya Column next month based on the principle of average distribution.\n\nThrough the land transport channel secretly developed by the South China Bureau, the §GFront and the Party Central Committee§! can also reap gains from the small amount of Hainan trade, with a specific value of §G20%§! of the full-category gains listed in the Hainan trade correction list (excluding arms trade)."
 TER_SCB_generic_info: "[TER_SCB_generic_info]"
 TER_SCB_generic_info_1: "Currently selected: §Y[TER_SCB_tagnames]§!\n\nThe corresponding menus are: §mSouth China Bureau Memo, Hainan Monthly Trade Summary§!.\n\n§mSouth China Bureau Memo§!\n-To respond to the long-term anti-Japanese war behind enemy lines, in 1945, Comrades Liu Shaoqi, Zhu De, Zhou Enlai, Ren Bishi, Dong Biwu and others collectively proposed to the Party Central Committee to establish the §GSouth China Bureau§!, which was run and coordinated by Comrades Ye Jianying, Xiao Xiangrong and others. The §mSouth China Bureau Memo§! is a collection of important work documents of the South China Bureau from 1945 to the present.\n\n§mHainan Monthly Trade Summary§!\n-As an important achievement of the work of the South China Bureau, the §GQiongya Column§! has been completely underground in Hainan since the 1950s. Many Hainan branch leaders have already entered important positions in the Hainan puppet government through various methods such as forging identities and impersonation. Intelligence disguise makes it possible for Hainan to secretly conduct trade with Southeast Asia. After 15 years of development, Hainan now has close contacts and trade with §Ycoastal countries and regions in Southeast Asia§!, and has established contact with the communist resistance forces in Vietnam, Myanmar, and Cambodia. The §mHainan Monthly Trade Summary§! can visually display the main information of §GQiongya Column§! trading activities, and provides some options for modifying details to optimize trade efficiency."
 TER_SCB_generic_info_2: "Currently selected: §Y[TER_SCB_tagnames]§!\n\nThe corresponding menus are: §mTrade Interface, Revolution Interface§!.\n\n§mTrade panel§!\n-§YCoastal countries and regions in Southeast Asia§! have established trade contacts with the §GQiongya Column§!. We can adjust the §Ytrade shipping status§! between these regions and Hainan once a month, and perform some additional operations to increase §Ytrade willingness§! or reduce §RJapanese Alert Index§!. For more detailed information, please refer to the §Yinformation icon§! in the §mTrade Interface§!.\n\n§mRevolution panel§!\n-§YVietnam, Cambodia, and Burma§! have anti-Japanese armed forces of a considerable scale, and are designated secret aid regions for the §GQiongya Column§! by the South China Bureau. We will be able to carry out secret revolutionary aid operations to these specific regions through the §GQiongya Column§!, and can only carry out one operation per region §Yper month.§! If these regions are also in a §Gtrade shipping status§!, one §Ycombat readiness level§! will also be randomly added each month. The higher the §Ycombat readiness level§!, the more prepared the revolutionary army will be when launching a coup, and the higher the §Gchance of success§!. For more detailed information, please refer to the §Yinformation icon§! in the §mRevolution Interface§!."
 TER_SCB_trade_info: "§mTrade Interface§!\n----------\nThe main function of this interface is to adjust the §Ytrade shipping status§! between the §Yselected region§! and Hainan, and perform some additional operations to increase §Ytrade willingness§! or reduce §RJapanese alertness§!.\n\n§YTrade willingness§!\n-The trade willingness of a region directly affects how much gain the §GQiongya Column§! can obtain from that region. The gain value is jointly determined by the §Yindustrial structure§! and §Yregional level§! of that region.\n\n§RJapanese alertness§!\n-If the trade willingness of any region is higher than 50% and is currently in operation, Japanese alertness will begin to increase. The increase rate is jointly determined by the §Ynumber§! of such regions and their §Ytrade willingness§!: the more §Ycoastal regions§! and the higher the §Ytrade willingness§!, the §Rfaster the increase rate of Japanese alertness§!.\n\n§YShipping capacity§!\n-Hainan's shipping capacity is limited and §Rcannot§! maintain trade shipping with all tradable regions at the same time. Specifically, the higher the §Yregional trade level§! of a region, the more §Yindustrial materials§! it represents, and thus the more §Yshipping capacity§! it occupies. Once the remaining §Yshipping capacity§! of Hainan cannot satisfy the §Yregional trade level§! of the currently selected region, the region will not be able to carry out trade actions. Therefore, §Yplease carefully decide the allocation of trade regions§!.\n-The specific formula is:\n§YShipping capacity occupied by the region§! = §YRegional trade level§! * 5 * 100%"
 SCB_trade_btn_admit_tt: "Click to §GSelect§!/§RCancle Selecting§!"
 SCB_stop_trade_btn_tt: "Click to switch to §Ysuspended status§!\n----------\nSelecting this option will temporarily suspend §GQiongya Column§!'s secret trade with the selected region and §Greduce§! §Y10%§! of §RJapanese Alertness§!.\n\nKeeping §Ysuspended status§! will gradually decrease the selected region's §Ytrade willingness§! by §Y10%-30%§! until it reaches zero."
 SCB_begin_trade_btn_tt: "Click to switch to §Yoperational status§!\n----------\nSelecting this option will start §GQiongya Column§!'s secret trade with the selected region, providing different gains to §GQiongya Column§! based on the region's §Ylevel, industrial structure, and trade willingness§!. If the selected region's §Ytrade willingness§! exceeds §Y50%§!, it will cause §RJapanese alertness§!.\n\nKeeping §Yoperational status§! will gradually increase the selected region's §Ytrade willingness§! by §Y10%-30%§!."
 SCB_friendship_btn_tt: "Click to §Gimprove trade relations§!!\n\nSelecting this option will increase the selected region's §Ytrade willingness§! by §Y15%§!§, and this option is only available for operational regions. This option can be selected once per month."
 SCB_ease_tension_btn_tt: "Click to §Greduce Japanese alertness§!!\n\nSelecting this option will reduce §RJapanese alertness§! by §Y2.5%§!! and this option is only available for operational regions. This option can be selected once per month."
 TER_SCB_JP_alert_tt: "Current Japan Alertness: §R[?SCB_JP_alert_value]§!%\n----------\nThe monthly growth rate of §RJapan Alertness§! is calculated based on the sum of the trade willingness of all areas with trade willingness §Yabove 50%/100.§!\n\nIf the §RJapan Alertness§! is above 50%, the §Rsoothing button§! is no longer available except for the §Ysuspended status§! button.\nWhen the §RJapan Alertness§! reaches 100%, there will be an §xembargo on all areas, and the South China GUI panel can no longer be interacted with§!."
 SCB_trade_will_value_tt: "Current region's trade willingness: §Y[?SCB_trade_will_value]§!%\n\nIf trade willingness is below 40%, there will be an increase in consumer goods categories (§Ymonthly manpower, stability, and productivity growth§!) effectiveness.\nIf trade willingness is between 40% and 70%, there will be an increase in heavy industry trade benefits (§Yinitial factory output and productivity§!), as well as the above benefits.\nIf trade willingness is above 70%, there will be an increase in weapons industry trade benefits (§Ymonthly weapon acquisition§!), as well as the above benefits."
 TER_SCB_revolution_info: "§mRevolution Interface:§!\n----------\nThe main function of this interface is to secretly support the §Ytarget region§! and it has three indicators: §YUnlity, equipment rate, and organizational rate§!. The highest level for all three indicators is §YLevel 5§!. Once all three indicators reach §YLevel 3§! or above, you can choose to §xinitiate a revolution§! in the target region.\n\nThe higher the §Ycombat readiness level§!, the stronger the local comrades' power will be during the §xrevolution.§!\n\nSpecific effects are as follows:\nWhen all three indicators reach Lv.3: A §Ydivision unit with an equipment rate of 80% and training level of Lv.2 will appear in the base area.§!\n\nWhen all three indicators reach Lv.4: A §Gdivision unit with an equipment rate of 100% and training level of Lv.3 will appear in the base area, and you will gain a §Gboosted morale§! that lasts until the end of the battle.§!\n\nWhen all three indicators reach Lv.5: A §mdivision unit with an equipment rate of 100% and training level of Lv.5 will appear in the base area, and you will gain a §mstronger boost§! that lasts until the end of the battle.§!"
 TER_SCB_rev_level_btn_unify_tt: "Public Opinion Propaganda:\n----------\nChoosing this option will cost §Y50§!£pol_power §Ypolitical points§! to increase the unity of the region by §G1 level§!."
 TER_SCB_rev_level_btn_org_tt: "Military Representative:\n----------\nChoosing this option will cost §Y50§!£command_power §Ycommand points§! to increase the organizational rate level of the region by §G1 level§!."
 TER_SCB_rev_level_btn_equip_tt: "Equipment Transportation:\n----------\nChoosing this option will allocate §Y100 units of Infantry equipments, 100 units of support equipments, and 20 units of artillery§! from §GQiongya Column§! to increase the equipment rate of the region by §G1 level§!."
 TER_SCB_start_the_storm_tt: "§xInitiate Revolution§!\n----------\nOnce all 3 indicators reach §YLv.3§! or above, you can choose to §xinitiate a revolution§! in the target region. The higher the §Ycombat readiness level§!, the stronger the local comrades' power will be during the §xrevolution.§!"
 Alert_SCB_trade_state: "§GQiongya Column§! Shipping Capacity Not Full."
 Alert_SCB_trade_state_Desc: "§GQiongya Column§! currently has surplus shipping capacity. Click here to open £CPC_texticon §RCommunist Party of China - South China Bureau§! for operation."
 Alert_SCB_JP_alert_50: "§RJapan Alert Index§! is almost reaching §Y50%§!."
 Alert_SCB_JP_alert_50_Desc: "Currently, §RJapanese alertness§! is approaching §Y50%§!. Please take action to reduce §RJapanese alertness§! by §Yreduce Japanese alertness§! or §Ysuspended status§! as soon as possible. Click here to open £CPC_texticon §RCommunist Party of China - South China Bureau§! for operation."
 Alert_SCB_JP_alert_100: "§RJapan Alert Index§! is almost reaching §R100%§!."
 Alert_SCB_JP_alert_100_Desc: "§RJapan Alert Index§! is almost reaching §R100%§!, please use the §Ysuspended status§! option as soon as possible to reduce the §RJapanese Alertness§!, otherwise §xwe will face a full embargo§! as a consequence. Click here to open £CPC_texticon §RCommunist Party of China - South China Bureau§! for operation."
 Alert_SCB_rev_enabled: "You can §xinitiate a revolution§! in some regions."
 Alert_SCB_rev_enabled_Desc: "There is a region available for §xinitiating a revolution§! currently. You can choose to immediately start a resistance armed action in the area, or wait for a period of time to §Yfurther strengthen the resistance force§!. Click here to open £CPC_texticon §RCommunist Party of China - South China Bureau§! for operation."
 CPC_SCB_tutorial_tt: "Notice: Each month, you can click on the §Ycolourful photos§! of the §Garea where can be initiate a revolution§! to raise the §Ycombat readiness level§!. Each month, each area will also be §Gautomatically raised by one level at random§!, and when §Gall of them reach level 3 and above§!, you can click on the §Rfive-pointed star§! button in order to §Ginitiate a revolution§!, and the §Ghigher§! the level, the §Gstronger§! the insurrectionary team will be."
 SCB_QYC_modifier_desc_CPC: "The South Seas shipping routes are the lifeline of our struggle. Under the guidance of Comrade Feng Baiju, we must utilize all possible civilian fronts—be it maritime commerce, trade, or logistics—to establish and maintain covert connections with brother parties across Southeast Asia.\n\nThrough mutual assistance and shared struggle, we will strengthen our revolutionary ties and advance together toward liberation. If managed wisely, this underground trade network will become a §Gformidable weapon§! in our quest to §Rshatter the Greater East Asia Co-Prosperity Sphere§! and ultimately £GNG_japanese_frustration_texticon §jcrush the Japanese imperialists§!."
 SCB_QYC_modifier_desc_other: "Despite Hainan's relatively scarce natural resources, its strategic location—coupled with years of meticulous development under Governor Tang and Chairman Li—has transformed the island into a crucial trade nexus. Today, Hainan’s commerce extends from nearby Guangdong to as far as Indonesia, solidifying its role as an important economic hub within the Greater East Asia Co-Prosperity Sphere.\n\nSome optimistic economists in Tokyo and Nanjing have even publicly praised Hainan’s economic potential, arguing that with the right investment and development, the island could become a new economic model for £GNG_japanese_frustration_texticon §jPan-Asian trade§!, following in the footsteps of £MAN_manchukuo_texticon §fManchukuo§! and £GFX_GNG_Guangdong_texticon §SGuangdong§!."
 SCB_QYC_CPC_modifier: "To Southeast Asia"