 state_lore_initials.53_RUS: "SEV"
 state_lore_name.53_RUS: "Sevastopol"
 state_lore_desc.53_RUS: "Sevastopol had always been a prosperous maritime city, owing to its navigable deep harbour and key geographic location on the Black Sea. From a small fortress constructed on the orders of Catherine the Great Sevastopol grew to a centre of commerce and the biggest naval base in the black sea, allowing Russia to project power into the entire region. After the fall of the Soviet Union the city was renamed Theodorichshafen in honour of the Germanic Goths that once inhabited it and heavily settled by the Germans to secure their grasp on Ukraine forever.\n\nBut the tide of Germania was slowly but surely broken up and then decisively pushed back by the Russian forces. Cut off from the mainland, isolated, battered and taken, the pride of the German settlement in the Eastern territories was shattered forever as Russia reclaimed the Crimean peninsula. While it shall take long for the scars of occupation to mend, Sevastopol shall shine once again as Russia’s prime Black Sea port."

 state_lore_initials.87_RUS: "S-PB"
 state_lore_name.87_RUS: "Saint-Petersburg"
 state_lore_desc.87_RUS: "Saint-Petersburg, named after it's creator in the late 18th century, Has been one of the important cities in the history of Russia, being host to some of the biggest icons of Russian culture and being one of the biggest ports for the nation, hosting a massive industry and many shipbuilding yards.\n\nThe city met a terrible fate when operation Barbarossa commenced, It's beauty and population alike completely massacred by the onslaught of German troops and bombs, Twisted into the vison of of it's Nazi conquerors as they worked the remaining Russian populace to death in factories, slowly being replaced by waves of German settlers, the statues of Lenin torn down and replaced by Hitler.\n\nWith the Reich finally pushed out from the east, the city begins (albeit slowly) to return to a semblance of normality, Russians are returning to the inner city to work and Nazi monuments are burnt down and removed. While the city has decades to go before it's importance is reclaimed, The first step has been already taken."

 state_lore_initials.88_RUS: "VOL"
 state_lore_name.88_RUS: "Volgograd"
 state_lore_desc.88_RUS: "Originally founded in the 16th century as Tsaritsyn, the city has stood on the Volga river for nearly as long as the region has acted as a bulwark on what was then the frontier of Russian conquest. The importance of the city stood the test of time and it later became a foundation of commercial trade.\n\nFollowing the Second World War, the city was partially rebuilt and used as an administrative center for the German colonial regime. Untold lives were destroyed in the Reich's wake, but as dawn rises over the old Reichskommissariats, the cool air on the river begins to drift into a new direction…\n\nThe old colonial dachas which German aristocrats once lived in are defaced and torn down as their owners are thrown into the street. The Wehrmacht garrison barracks lay silent. Trade and commerce on the river ports slowly rekindle from the ashes of war, unabated by the shadow of the Othala. A phoenix rises over the Volga, with the jackboot unable to stifle its potential."

 state_lore_initials.89_RUS: "MOS"
 state_lore_name.89_RUS: "Moskva"
 state_lore_desc.89_RUS: "Russia is whole once again. With the city of Moscow once again in Russian hands after 30 years of being crushed underfoot by the German occupation, the city of the Third Rome can once again become the Heart of Russia. Ever since the Tartar Yoke had been thrown off and the Russian people secured their independence, Moscow has been at the very centre of Russian civilization. After the disastrous defeat of the USSR the German authorities chose to name the entire colony after the city to further rub salt in the wounds of their crushed enemies.\n\nBut despite the looting, occupation and decades long exploitation Moscow endured, continuing to be a central location for both politics and economics. While its shine faded, the city itself remained unbroken, awaiting its liberation from the German jackboot.As the streets are cleaned up and the last remnants of German occupation destroyed, the first steps towards restoring the city to its former glory are undertaken. A bright new dawn rises over the city of Moscow, as it returns home to its mother country with open arms."

 OMS_World_Ended_Title: "No Signal"
 OMS_World_Ended_Initials:0 "---"
 OMS_World_Ended_desc:0 "§RFor I have chosen him, so that he will direct his children and his household after him to keep the way of the LORD by doing what is right and just, so that the LORD will bring about what he has promised him§!."

state_lore_initials.828:0 "AQM"
state_lore_desc.828:0 "Akmola is a Soviet city located in northern Kazakhstan. \n\nAkmola's history dates back to 1824 when Tsarist Siberian Cossack troops established a fortress here, later developing into a city. In the early 20th century, Akmola was built as a railway hub with rapid economic growth. After the Soviet Union's collapse under Nazi aggression, Kazakhstan gained independence, and a flood of refugees brought capital, resources, and cheap labor, propelling Akmola's development. \n\nHowever, Pavel Fiting held distinct views. \n\nTo 'defend the Soviet Union' on Kazakh soil, Akmola was the perfect choice for this NKVD veteran - unlike southern cities with stronger Kazakh identity, the city's large Russian population created a fragmented identity reminiscent of northern Soviet-era neighbors, with Soviet architecture and slogans marking its uniqueness and division. \n\nToday, Akmola still carries Kazakhstan's historical and cultural essence. New agricultural waves dress the land in prosperity, yet political turbulence simmers beneath. Its mottled walls bear Soviet rise-and-fall codes, with shadows of the USSR continuing to haunt its uncertain future."

state_lore_name.828:0 "Akmola"

state_lore_initials.829:0 "KGD"
state_lore_desc.829:0 "In Kazakhstan's vast steppes, Karaganda emerges like an industrial leviathan from the earth, its pulse syncing with mine drills and breath heavy with coal and steel. Once an obscure mining town, it became the industrial backbone of independent Kazakhstan - but this sudden glory exacts heavy costs. \n\nDuring Bukharin's era, Karaganda's slow industrialization left it a frontier town. Post-Soviet collapse awakened its subterranean treasures, making it the nation's coal powerhouse. Mine shafts spiderweb into the earth, steel mills burn day-night, and railways carry resources nationwide. Yet each ton of coal leaves yellowish haze, blighting playgrounds and obscuring starry skies. The Karaganda River glows metallic, tailings eroding grasslands, while miners dwell in Soviet-era barracks contrasting new government towers. \n\nAt this crossroads: Should it sustain growth through environmental sacrifice? As sunlight struggles through smog onto Lenin Square, workers still march to mines and factories. Their choices will determine whether this city finds balance between development and ecology - like buried coal awaiting geological patience to reclaim light."

state_lore_initials.830:0 "ALM"
state_lore_name.831:0 "Almaty"
state_lore_desc.830:0 "Almaty nestles in Tianshan foothills oasis, once a Silk Road hub transformed by Soviet planners into Kazakhstan's political-cultural heart. Slow industrialization under Bukharin preserved Central Asian traditions within Soviet architecture. By the 1960s, tree-lined boulevards hosted harmonious coexistence of socialist buildings and Kazakh yurts - yet the city's soul slowly drained. \n\nAs capital, it suffered post-Soviet isolation. Industrial zones fell silent, scholars fled universities, and even Green Bazaar vendors echoed anxiety in their cries. Lenin's statue remains on Central Square, though its slogans have faded. \n\nYet hope persists. Almaty's future may resemble its famed apple orchards - dormant through winter, reblooming with spring. When Kazakhstan overcomes isolation, this mountain-ringed city could reclaim its status as Central Asia's crown jewel. But no one knows when that spring will come."

state_lore_initials.831:0 "SMK"
state_lore_name.831:0 "Shymkent"
state_lore_desc.831:0 "When Soviet giants fell to Nazi attacks, Shymkent prospered. \n\nAs western industrial zones collapsed under German offensives, this city became war industry refuge, planting seeds for industrialization. Former wartime factories now produce modern agricultural machinery. Once a Silk Road trade node, it now embodies Kazakhstan's modernization: oil workers trade with herders in bustling bazaars, engineers attend traditional horse races after work, and students study mechanical engineering alongside epic poetry in universities. \n\nDespite achievements, challenges remain: empty university halls, creaking Soviet machinery, and developmental bottlenecks. Yet at dawn, sunlight gilds oil refinery pipes as Shymkent prepares to write new legends - blending nomadic heritage with modern flavors like Beshbarmak stew."
state_lore_name.831:0 "Shymkent"

state_lore_initials.832:0 "FRZ"
state_lore_name.832:0 "Frunze"
state_lore_desc.832:0 "Amid Tianshan foothills' Chu Valley, Frunze's Soviet obelisks stand tall, but its soul lost between victory and decay. This Kyrgyz capital gained territory through lightning military success, only to face deeper crises. \n\nPost-First Turkic War victories brought Fergana Basin spoils, flooding Frunze with euphoria: squares piled with captured weapons, cinemas showing propaganda films. Soon reality bit - occupation costs drained treasuries, transforming war monuments into conscription offices within months. \n\nStagnation followed resource drain to new territories. Frunze's plight mirrors mudflows after snowmelt - initial triumph leaving debris and chaos. The ill-fitting Fergana jigsaw puzzles into Kyrgyzstan's map. At night, officials argue in darkened chambers, unable to digest gains nor admit defeat. Like koumiss (fermented mare's milk), initial thrill turns sour. \n\nFuture lies in overlooked details: underground student papers, smuggled goods in markets, barrack graffiti reading 'We won battles but lost our homes'. When Chu River floods return, Frunze may learn: true victory means keeping roofs dry, not conquering lands."
state_lore_name.832:0 "Frunze"

state_lore_initials.833:0 "TSK"
state_lore_name.833:0 "Tashkent"
state_lore_desc.833:0 "Amid Central Asian deserts and oases, Tashkent stands stubborn as an island - encircled by Kyrgyzstan, this 2,000-year Silk Road gem went from Timurid stronghold to Soviet industrial heart, now a 'flying capital' isolated by blockade. \n\nPost-Turkic Wars losses left suburbs mined, textile mills half-operational. Capital relocation drained political prestige. Kyrgyz blockade exacerbated crises - local melons tripled in price, Fergana grapes vanished from markets. \n\nYet Tashkent endures. Navoi Opera House lights stay on despite empty seats; professors teach with 10-year-old lab equipment. Tea houses recite Alisher Navoi's verses while youths sketch blockade-breaching maps. Like plov (rice pilaf), simplicity becomes triumph in hardship. \n\nThis city embodies contradictions: Uzbek national spirit vs political liability. While Kyrgyz blockades threaten, Tashkent's people cling fiercely to cultural roots. When dawn hits Independence Square, vendors and students resume routines... As long as Uzbekistan stands, Tashkent remains."
state_lore_name.833:0 "Tashkent"

state_lore_initials.834:0 "NMG"
state_lore_name.834:0 "Namangan"
state_lore_desc.834:0 "'She has Uzbek heart in Kyrgyz body!' \n\nAt Namangan's Victory Monument, yogurt-sellers recount the morning without resistance - more resignation than anger. \n\nPost-First Turkic War, Kyrgyz boots woke Namangan's markets, binding its fate unwillingly. Years later, Kyrgyz vendors gather dust while Uzbek copper-smiths thrive. Schools teach Kyrgyz through covered Uzbek poetry notes. Fresh Kyrgyz slogans peel to reveal older Uzbek ones - every crack protests imposed identity. \n\nAs Kyrgyz governors celebrate 'Unity Day', new plots brew beneath. Namangan glows with defiant Uzbek light in Kyrgyzstan's fabric, a wound that refuses healing. When change comes, it will erupt like spring floodwaters through cracked earth."
state_lore_name.834:0 "Namangan"

state_lore_initials.835:0 "NKS"
state_lore_name.835:0 "Nukus"
state_lore_desc.835:0 "Look! Nukus - proud capital of Karakalpakstan rising from Aral Sea sands. \n\nFirst West Russian War chaos gifted independence. Government halls display crudely altered maps replacing 'Uzbek SSR' with Karakalpak labels. Kadyrov statues replace Lenin's, though pedestals remain. \n\nNew nation faces existential threats: shrinking Aral's sandstorms, Uzbek border clashes, foreign currency shortages. Professors teach dual language curricula with photocopied textbooks. \n\nFuture hinges on Kyrgyzstan finding balance in volatile region - like desert reeds bending in storms. For now, Nukus breathes between sandstorms: slum schools form in presidential tents, farmers irrigate heedless of coming dust. As dunes shift, they cling to fragile hope."
state_lore_name.835:0 "Nukus"

state_lore_initials.836:0 "SMK"
state_lore_name.836:0 "Samarqand"
state_lore_desc.836:0 "On Zerafshan Valley's golden plains, Samarqand's blue domes pierce Uzbekistan's existential fog. \n\nIn Registan madrasas, Jadidists debate Islam-modernity fusion while across the square, Hujayev's office burns midnight oil signing concessions. Post-Turkic Wars forced Samarqand into Tashkent's abandoned capital role. Soviet-era Culture Palace became Islamic revivalist hub. \n\nIdeologies clash: Bazaars mix Soviet medals with Qurans; universities teach Marxist history beside Islamic Golden Age; Guri Amir mausoleum guides flip between Timurid glory and socialist achievements. \n\nYet Samarqand's soul endures. As twilight swallows Registan's red slogans, tea masters brew tea using 400-year methods, dutar strings echo Timurid courtyards. This city remains Eurasia's crossroads - lost, ignored, humiliated, yet timeless."
state_lore_name.836:0 "Samarqand"

state_lore_initials.837:0 "AGB"
state_lore_name.837:0 "Ashgabat"
state_lore_desc.837:0 "In Karakum Desert's heart, Ashgabat - 'White City' - embodies Turkmenistan's paradoxes. Newly unveiled Boda Amiralazov monument stands amidst tribal quota disputes. \n\nPost-Turkic Wars brought unexpected prosperity. Inviting German-Japanese engineers rebuilt its skyline: glass-domed 'Grand Afghanistan Palace' gleams, metro echoes disturb Babur Mausoleum spirits. \n\nYet cracks fester beneath glitter: German machinery gathers dust in Foreign Ministry halls; Soviet-era fertilizer plants rot in tribal boycotts. Political schisms erupt: pro-German Daudov vs moderate king's faction; youth flyers share streets with Marxist pamphlets. \n\nAshgabat's future shimmers like desert mirage. As Daudov rubs temples in his office, question remains: Can tribal fragments forge modern nation? This gilded cage may yet crumble under its own contradictions."
state_lore_name.837:0 "Ashgabat"

state_lore_initials.838:0 "DSB"
state_lore_name.838:0 "Dushanbe"
state_lore_desc.838:0 "Cradled by Gissar Mountains, Dushanbe feels forgotten. Soviet government buildings stand with Marx portraits bleached by sand. Central Square echoes with empty Gofurov speeches, while breadlines coil three blocks long - this city endures deepest winter, spiritual and climatic. \n\nPost-Turkic Wars cost Tajikistan Badakhshan's rubies and Fergana's wheat. Museum dioramas show jagged territorial gaps. \n\nSurvival wisdom emerges: Teahouses play ancient dutar tunes; bazaars sell embroidered homeland maps; professors pause lectures to gaze westward at lost peaks. \n\nThough beaten, Dushanbe's unextinguished lights whisper: As long as Ferdowsi's epics endure, as Vakhsh River flows, Tajiks will await tomorrow. But what color will that dawn bring? Gofurov's regime wobbles, yet answers elude."

state_lore_initials.839:0 "KRS"
state_lore_name.839:0 "Karakul"
state_lore_desc.839:0 "Decades past, Karakul was Uzbekistan's forgotten southeastern outpost. Harsh environment kept settlers scarce - until Afghanistan trade routes transformed it. Few predicted the bloodshed to come. \n\nPost-Turkic Wars, Turkmenistan rebuilt Karakul as 'Pan-Turkic ideal' showcase. Kabul-funded Turan Cultural Center peddles fabricated Turkic history; German advisors train Uzbek-Turkmen Youth Brigades; Wilayat Khan's portrait glares from every building. \n\nResidents witness paradoxical 'utopia': Soldiers loot with impunity, shielded by 'Pan-Turkic warrior' status; taxes fund endless labor under Pan-Turkic banners. Wilayat's ambitions stretch beyond Karakul - he seeks pan-Turkic empire. \n\nHow long can this torture city endure? Each day's sun sets on Karakul's uncertain fate, teetering between imposed vision and hidden rebellion."\n\nstate_lore_name.839:0 "Karakul"

state_lore_initials.840:0 "KBL"
state_lore_name.840:0 "Kabul"
state_lore_desc.840:0 "Kabul - millennia-old Silk Road gem, Mughal frontier fortress, Cold War chess piece - transformed by WWII. When Berlin and Tokyo's engineers arrived, glass-domed 'Grand Afghanistan Palace' rose beside Babor Mausoleum's slumbering emperors. \n\nAt Tehran Summit, King Zahir shaking Hitler's hand seemed to crown Kabul as Eurasia's crossroads. Yet marble cracks hid decay: German lathes gathered dust in Foreign Ministry halls; Japanese fertilizer plants rotted in tribal boycotts. \n\nPolitical plagues festered: Pro-German Daoud vs moderate king; 'Awakened Youth' leaflets mingled with Marxist pamphlets. \n\nToday's Kabul resembles over-polished artifact - foreign gems strain its foundation. As Berlin-Tokyo teams haggle, bureaucrats realize: Fascist efficiency requires American chips. \n\nKabul's zenith is built on enemy armor - its weight may yet crush its spine."\n\nstate_lore_name.840:0 "Kabul"

state_lore_initials.841:0 "KDH"
state_lore_name.841:0 "Kandahar"
state_lore_desc.841:0 "They call Kandahar Afghanistan's modern-ancient paradox. This southern desert city - Persian frontier fortress, Mughal military hub, Pashtun cultural core - saw WWII bring German investments: power plants, asphalt roads, radio stations. \n\nYet its 'modernization' fits poorly. Western irrigation salts fields; synthetic textiles undermine traditional weavers. Deeper divides emerge: Kabul elites indulge while mullahs condemn modernity as 'infidel temptation'. \n\nKandahar's orange pomegranate rind hides seething seeds. When Kabul's golden dreams shatter, Kandahar may peel off its foreign skin, revealing immutable core: land that defies conquest and 'enlightenment' alike."\n\nstate_lore_name.841:0 "Kandahar"

state_lore_initials.842:0 "HRT"
state_lore_name.842:0 "Herat"
state_lore_desc.842:0 "First Turkic War left Herat desolate. \n\nPost-conflict reconciliation allowed Herat to rise phoenix-like from ashes. Revived Silk Road brings camel caravans back to repaired trade routes. Bazaars brim with Persian carpets, Tajik silver, Uzbek silks. Restored Jam Mosque shines again as spiritual beacon. \n\nHerat thrives through tolerance: Tajik elders study scriptures with Persian youths; Hazara artisans trade with Pashtun merchants. Despite Kabul's gaze, self-rule persists. Evening gatherings under ancient plane trees blend languages and stories. \n\nBut Herat walks tightrope: Silk Road revival brings opportunities, while Kabul's shadow looms. One day, central control may snap this peace. For now, Heratis weave renewal dreams under weathered walls - city that outlived empires, waiting through endless dawns."\n\nstate_lore_name.842:0 "Herat"

state_lore_initials.850:0 "KZL"
state_lore_name.850:0 "Kyzyl"
state_lore_desc.850:0 "Kyzyl - a city bearing dual Russian-Mongolian identity, the last Bolshevik bastion in Central Siberia.\n\nWhen Vasilevsky's Red Army and the Mongolian People's Liberation Army found themselves cornered between the Central Siberian Republic and Mengjiang United Autonomous Government, Kyzyl became their final stronghold.\n\nUnlike other Central Siberian cities, Kyzyl lay outside the Siberian Project's blueprint. Before the Red Army's arrival, it was merely a pastoral town known for livestock.\n\nAfter losing contact with Irkutsk and needing respite, Vasilevsky abandoned eastward advances. Instead, he joined Mongolian comrades to garrison here as a future staging ground. Lkhagvasuren envisioned Kyzyl refocusing on her ancestral motherland - still struggling under Japanese occupation.\n\nAmidst this uneasy coexistence, Kyzyl experienced explosive modernization, fueled by Russo-Mongolian labor and revolutionary zeal.\n\nThe Kyzyl Miracle arrived. This city stands ready for challenges. But as Vasilevsky and Lkhagvasuren's disagreements intensify, Kyzyl must eventually choose her destiny:\n\n§xCharge into Russia's chaotic unknown§!, §YOr march to Mongolia for final reckoning with invaders.§!\n"

state_lore_initials.851: "AKT"
state_lore_name.851: "Aktobe"
state_lore_desc.851: "While the northern regions of Kazakhstan were plunged into turmoil by Russia's chaos, Aktobe maintained a rare tranquility amidst the surrounding instability.\n\nThroughout history, the land of Aktobe has witnessed the rise and fall of countless Central Asian civilizations. From the era of the Yuz to the Russian Civil War, continuous warfare failed to destroy it. Even in the years when Kazakhstan was isolated after the collapse of the Soviet Union, this city managed to carve out its unique path to survival in chaotic times. But it begs the question: what unique quality allowed this strategically vital location to ultimately avoid the full onslaught of the new order?\n\nToday's situation is largely due to Malenkov's personal diplomatic skill. Through his active mediation, the Aktobe authorities reached a series of mutually beneficial agreements with the Orenburg Revolutionary Commune, allowing the region to barely maintain peace during the turbulent period.\n\nHowever, this peace did not bring economic prosperity to Aktobe. Instead, it was a restrained stability: Aktobe's self-sufficient industrial and agricultural output; limited trade in goods between Aktobe and Orenburg; and military cooperation between the two sides to resist the depredations of the Dirlewanger Brigade. Ultimately, these factors allowed the city to fortunately avoid the famine and warfare sweeping its surroundings.\n\nBut Aktobe's true 'lifeline' was its 'non-development survival rule' in times of chaos: while surrounding cities suffered repeated calamities during modernization, Aktobe deliberately maintained a state of technological backwardness—no large factories, no strategic facilities. Only by making itself 'worthless' could it avoid banditry due to a lack of plunderable value.\n\nBut the question is: when the surrounding wars finally cease, will the world still need such a small city deliberately stuck in the past?\n\n"

state_lore_initials.852: "PVD"
state_lore_name.852: "Pavlodar"
state_lore_desc.852: "In 1861, to commemorate Grand Duke Paul, the eighth son of Tsar Nicholas II, the city was renamed Pavlodar (Russian for 'Paul's Gift').\n\nIndeed, Pavlodar can be considered a 'gift' from Kazakhstan to Russia. During the Soviet and West Siberian Republic periods, Pavlodar briefly prospered due to the 'Siberian Plan,' becoming a renowned industrial center in northern Kazakhstan. Since then, a monument to 'Russo-Kazakh Friendship' was erected in Pavlodar's city center.\n\nBy choosing to align with Russia, Pavlodar cut off other possibilities for its future development. Thus, when the West Siberian Republic collapsed and was destroyed in the flames of war, Pavlodar's economy quickly stalled, and it swiftly became an isolated island: Russia abandoned it, but Kazakhstan couldn't find it.\n\nToday, this important Kazakh border town is on the verge of collapse, with its lifeblood barely sustained by intermittent trade convoys with Novosibirsk. The letters of the word 'Friendship' on the base of the monument in the city center are peeling off one by one, a poignant reflection of this era: those Russian immigrants who flocked to Pavlodar during its economic boom have either left during the economic winter and inter-ethnic standoff, or remained to turn the place into a still-thriving den of crime.\n\nAs the halo of self-interest fades, so-called friendship is nothing more than a tattered flag abandoned by the roadside, trampled by all. Those 'fair-weather friends' who once raised their glasses and sang loudly during Pavlodar's decadent days have long since scattered. As for Pavlodar itself, it is merely an abandoned train car, isolated on a historical siding—waiting for someone to give it a chance to choose its destiny anew.\n\nIn General Secretary Kunayev's strategic vision, it is Pavlodar's tumultuous fate that gives it the potential to become Kazakhstan's future compass: either open the door to Russia, or close it forever.\n\nHowever, General Secretary Kunayev himself must know whether Kazakhstan's grand vision of independence can be realized, after all...\n\n§xKazakhstan might find it hard to reclaim this 'gift'.§!"

state_lore_initials.853: "KTN"
state_lore_name.853: "Kostanay"
state_lore_desc.853: "Kostanay—Kazakhstan's veritable 'granary'.\n\nAmong the population remaining in Kostanay, the city is like a giant repeatedly toyed with by time. Its steel arms once supported Kazakhstan's industrial dreams, and its wheat-waving chest once fed the entire nation's hunger.\n\nThe industrial migration during the Bukharin era unexpectedly forged Kostanay's dual soul of industry and agriculture. Vast wheat fields rolled golden waves in the wind, while rich iron ore underground nurtured hot steel flows. This miraculous symbiosis once allowed Kostanay's trains to carry both grain and steel ingots north and south—renowned far and wide, celebrated across the land.\n\nGood times did not last. Raids from the north continuously eroded every inch of Kostanay's land, and more and more people chose to leave their homes. After a brief period of prosperity, Kostanay seemed destined to become the desolate border town it once was.\n\nThose who refused to leave invented a unique art of survival. They learned how to take up arms and resist the northern bandits, defending their farmlands and workshops. The courage of the Kostanay people is certainly commendable, but under such high pressure, they also increasingly felt overwhelmed...\n\nToday, the glory of this 'twin-crowned city' is gradually cooling in the northern wind, with the lingering warmth of its blast furnaces and the faint fragrance of its wheat ears intertwining into a melancholic epic of survival. As for its ultimate fate—whether Kostanay can break free from the northern curse and be reborn, or sadly accept its barren future—remains unknown.\n\n"

state_lore_initials.854: "ATR"
state_lore_name.854: "Atyrau"
state_lore_desc.854: "On the banks of the Ural River, by the Caspian Sea—Atyrau city holds Kazakhstan's richest oil reserves.\n\nAtyrau's predecessor was the wooden fortress 'Lower Yaik Fort' built by Russian merchant Gury Nazarov at the mouth of the Yaik River. Between 1647 and 1662, after being plundered by the Yaik Cossacks, the fortress was rebuilt in stone by the Guryev family, from whom the city's old name 'Guryev' originated. By 1810, the fortress was dismantled after losing its military function, and its original site gradually developed into the modern city of Atyrau.\n\nDuring World War II, the Caspian-Volga oil channel was a lifeline for the Soviet army's oil supply. Coupled with the assistance of the Emba oil field, Atyrau began to establish its oil industry, thus ushering in its first spring.\n\nWhen German forces advanced directly towards the Caucasus oil fields, Atyrau was spared from the war due to its remote location. In the early days of independent Kazakhstan after the war, to build a complete industrial system, Atyrau was designated as a key industrial experimental zone. Through a series of investments, the city gradually developed from traditional oil extraction into a complete oil industry system.\n\nUndeniably, today's Atyrau is one of Kazakhstan's most modernized cities, and the profits from oil have undoubtedly made it one of the wealthiest cities in Kazakhstan. But as soon as one's gaze leaves Atyrau city, all that can be seen is desolation—like a cage, sealing Atyrau within this place.\n\nThe wealth brought by oil may have paved Atyrau's streets with asphalt, but it cannot smooth over the fear in people's hearts. Whenever the southwest wind brings the smell of oil pollution from across the Caspian Sea, old workers instinctively look towards the opposite shore—for many workers who fled from Baku, that place remains their homeland, while Atyrau is their sweet haven.\n\nBut if Baku suffered such a fate, one might wonder if Atyrau will also be ruined by this wealth in the future?\n\n"

state_lore_initials.855: "SVK"
state_lore_name.855: "Shevchenko Fort"
state_lore_desc.855: "The Mangyshlak Peninsula, where Shevchenko Fort is located, has an arid climate, with most of its surface being desert and saline land. In ancient times, it served as a migration corridor for Turkic nomadic tribes, rather than a permanent settlement.\n\nIn the mid-19th century, after Tsarist Russia annexed Central Asia, the Mangyshlak Peninsula was incorporated into the Transcaspian Oblast. However, due to its harsh environment, it was only used as a military patrol route and was not extensively developed.\n\nOne day in the 1940s, the drill bit of a geological team uncovered the secret of this desolate land. Subsequently, the army swept in like a sandstorm, bulldozers rolled over the wasteland, and steel and concrete grew wildly under the moonlight. No one knew what they had unearthed, only that Pavel Fiting's name became forever linked to this forbidden zone.\n\nIn the rumors among the nomads, Pavel Fiting's subordinates are conducting Kazakhstan's greatest experiment here, capable of creating the most powerful force the world has ever seen—enough to grant the entire nation endless energy and supreme status. But the specific details of the experiment remain unknown to the public.\n\nShevchenko Fort has no future, only waiting. Waiting for a certain experimental result, waiting for a certain order, or waiting for an inevitable outbreak. Perhaps one day, when the dawn of Kazakhstan arrives, people will find this desert returned to silence, with only a few twisted steel beams sticking out of the sand, like an unnamed tombstone.\n\nTo this day, the only thing that can be confirmed about Shevchenko Fort is the widely circulated codename...\n\nSite 27\n\n"

state_lore_initials.856: "KLO"
state_lore_name.856: "Kyzylorda"
state_lore_desc.856: "In the eyes of older generations of Kazakhs, Kyzylorda evokes complex emotions.\n\nAs Kazakhstan's 'first capital,' it recorded the initial heartbeat of the Kazakh Soviet Socialist Republic. Its abundance, its prosperity, carried the most sincere aspirations of the Kazakh people, and Kyzylorda thus took on a heavy burden.\n\nIn those nascent days of the nation, Kyzylorda spared no effort to support every corner of Kazakhstan, helping the country through its most difficult times. People at that time were filled with hope, optimistically believing that under the leadership of this great and prosperous city, Kazakhstan would surely become a shining pearl.\n\nBut it was this unsung dedication that ultimately burned out Kyzylorda's life.\n\nWhen Kazakh officials re-evaluated, they were surprised to find that the entire city inevitably hindered national development—Kyzylorda was too old and remote, so much so that its aging body could no longer supply fresh blood to the nation. Ultimately, after much deliberation, the Kazakh government had no choice but to leave it, migrating west to the younger Almaty.\n\nFor Kyzylorda, it remembers too much, yet always hesitates to speak when looking at its departing children, gazing blankly at their receding figures.\n\nThus, by the winding course of the Syr Darya, Kyzylorda, like an old mother stripped of her finery, nurtured Kazakhstan's initial dreams. And now, her children have long since journeyed west for survival, leaving only the sound of river water lapping against the banks, and the wailing of the wind and sand, accompanying her through years of neglect, stumbling along with Kazakhstan's fluctuating destiny.\n\n"

state_lore_initials.857: "ORA"
state_lore_name.857: "Uralsk"
state_lore_desc.857: "On the western steppes of Kazakhstan, Uralsk stands like a fortress reshaped by war and refugees, a once tranquil riverside town now crowded with escapees from all directions.\n\nAfter the collapse of the Soviet Union and Russia, everything in Uralsk changed. Bandits from the north raided south, German threats from the west loomed, and countless Poles, Ukrainians, and Russians poured in with their families, setting up temporary shelters in abandoned factories, parks, and even cemeteries.\n\nThe city's streets became a microcosm of ethnic tensions. Polish refugee self-defense groups vied with Ukrainian gangs for food rations; Russian exiled soldiers controlled black market trade; while local Kazakhs held onto their last territories in shrinking communities. Every component of this city is colliding violently, and no one knows what outcome all this will lead their homeland to. Those who still hold a glimmer of hope for this chaos pile complaint letters written in several languages on the police chief's desk, but in reality, law here has long been defunct.\n\nAlthough the Kazakh military intends to build Uralsk into a western fortress, internal chaos may be more dangerous than external enemies. Half of the soldiers in the barracks are newly conscripted refugees, more concerned with profiting during wartime than standing guard; German reconnaissance planes frequently cross the border, but anti-aircraft units face a shortage of ammunition and dare not fire. The city is like the fences torn down by refugees for firewood—already riddled with holes by the ravages of the crowd.\n\nPeople here can't help but wonder: if external pressure disappears, will this city regain its former peace? Or is it destined to breed some new, rough way of life in this chaos?\n\n"

state_lore_initials.858: "ZBL"
state_lore_name.858: "Jambyl"
state_lore_desc.858: "What is Jambyl?\n\nWhen discussing this special city, one must mention Jambyl himself—Kazakhstan's most famous akyn (bard) of modern times. Whether during the October Revolution, the Great Patriotic War, or the West Russian War, Jambyl expressed his most unadorned patriotism for Kazakhstan in his unique way—until his passing.\n\nLike his most famous long poem, 'My Life,' Jambyl showcased the lives of Kazakhs in both the old and new eras. In ordinary days past, Jambyl was merely a border town, but when Kazakhstan became isolated, relying on the nation's few transportation lifelines, Jambyl slowly embarked on its path of development.\n\nToday, walking on Jambyl's dilapidated streets, youths in suits and old women in headscarves brush past each other, each carrying different understandings of Jambyl's poetry. Resting under ancient trees, elderly people might suddenly recite Jambyl's poems in hoarse voices, savoring the city's ancient memories. When gently touching the railings of the Taraz River Bridge, old and new scratches intertwine, recording the city's fluctuating life.\n\nAnd in the poems passed down from Jambyl, this city is solemn and unpretentious, ordinary yet great. It is precisely for this reason that it can radiate its unique brilliance within Kazakhstan's grand narrative.\n\nPerhaps only this way lies Jambyl's true soul.\n\n"

state_lore_initials.859: "PTP"
state_lore_name.859: "Petropavl"
state_lore_desc.859: "In the cold mist of the Ishim River, Petropavl is like a boundary stone repeatedly tossed, with different inscriptions carved on its two sides. The railway tracks of the Trans-Siberian Railway are like black stitches sewing a wound, forcibly connecting this city to the northern wilderness, while the southern Kazakh steppe slowly fades from its memory.\n\nOriginally, this city did not belong to Kazakhstan. After the October Revolution, to suppress local White Army forces, the Soviet Russian government decided to divide Petropavl and Omsk, both predominantly Russian, between two countries—the former assigned to Kazakhstan to ensure Russian influence over the steppe; the latter, as a core White Army city, was strictly controlled by Russia.\n\nFor decades thereafter, Kazakhstan's influence over this city gradually increased, thanks to the harmonious coexistence of Russian and Kazakh ethnic groups and deliberate Russian policies. But when the old government collapsed, this harmony naturally ceased to exist.\n\nUndoubtedly, the Trans-Siberian Railway provided considerable convenience for passing bandits, and the city was quickly engulfed in chaos. Even as the Kazakh army continuously strengthened the blockade of the northern border, these raiding activities intensified.\n\nAnd whenever freight trains roared past late at night, the windows of the old town would tremble, like a silent protest. In the alleys not far away—the truncheons of Kazakh police and the machetes of northern bandits exchanged violent whispers under the railway bridge, vying for control of Petropavl.\n\nPetropavl's ultimate fate may be to succumb to the threat of the Russian giant, to once again become an inseparable part of Russia after undergoing a long process of Russian assimilation—whether Petropavl is willing or not. And it can only accept all this in silence...\n\nAfter all, sometimes, bowing your head before the butcher's knife is also a kind of wisdom.\n\n"

state_lore_initials.860: "OKM"
state_lore_name.860: "Oskemen"
state_lore_desc.860: "Oskemen—born from minerals, thrived by water.\n\nSince the 1940s, with the discovery of large quantities of copper, lead, silver, and zinc resources in Oskemen, more and more Russians and Ukrainians came here to mine and process them, and this small town gradually became known.\n\nBy the 1950s, Oskemen ushered in significant development opportunities. With the establishment of the city's lead-zinc complex and the Oskemen Hydroelectric Power Station, this border town rapidly rose, growing into an important industrial center. Its status as a railway transportation hub and river port also played a crucial role in Kazakhstan's logistics and trade.\n\nBut what truly influenced Oskemen's destiny was the Bukhtarma Reservoir and Oskemen Hydroelectric Power Plant, completed in 1961. Oskemen's mining and heavy industries no longer had to rely on power transmission from other regions, and their development was put on the fast track.\n\nTo this day, this city is thriving, becoming the only rapidly developing city among many regions on Kazakhstan's northern border. Admittedly, environmental pollution caused by mining is beginning to show, and the proportion of residents suffering from respiratory diseases is also rising—but for Oskemen, these are merely insignificant costs.\n\nBut looking north, the fires of war have left the plains there in disarray. People also realize that this city is still shrouded in the shadow of the northern giant, though it cannot yet erode Oskemen's shining brilliance.\n\nTemporarily...\n\n"

state_lore_initials.861: "ADJ"
state_lore_name.861: "Andijan"
state_lore_desc.861: "As one of the twin cities of the Fergana region, Andijan could not escape the fate of being occupied by Kyrgyzstan.\n\nAs one of the spoils of victory claimed by Kyrgyzstan, Andijan, severed from its original branch, inevitably fell into decline. This once prosperous ancient Uzbek city, now under Kyrgyz rule, silently and resiliently guards its soul.\n\nLong-coveted Kyrgyzstan immediately began its assimilation efforts in Andijan, attempting to forever bind this fertile land to Kyrgyzstan. The Kyrgyz people naturally assumed that since they could achieve an undisputed military victory, they could just as easily win the cultural and economic war...\n\nBut they were wrong.\n\nNo matter what methods they used, whether enticement or threats, in the eyes of Andijan's people, they would never forgive these demons who destroyed their beautiful lives. The so-called scene of daytime prosperity was merely a facade created to lull Frunze's watchful eyes.\n\nOnly when night falls does Andijan reveal its unique vitality. Under the desolate moonlight, Andijan's people still instinctively turn their gaze westward—where their compatriots are also suffering. And beneath the city, an invisible network is transmitting messages, waiting for an opportune moment...\n\nA moment that will allow them to reunite with their compatriots.\n\n"

state_lore_initials.862: "CRZ"
state_lore_name.862: "Chardzhou"
state_lore_desc.862: "Fate is so capricious that Chardzhou has had to repeatedly assume its original mission.\n\nThe history of Chardzhou can be traced back a long time, originally serving as a fortress for the Emirate of Bukhara to defend against nomadic incursions along the Amu Darya. In 1886, a Trans-Caspian railway reached the city, laying a solid foundation for its current military and economic status. In 1901, with the construction of a railway bridge across the Amu Darya, Chardzhou gradually became the central city of the upper Amu Darya region.\n\nToday, Chardzhou is undoubtedly Turkmenistan's second-largest city. It advances steadily within Turkmenistan's comfortable environment, moving towards tomorrow along its pre-planned blueprint.\n\nAcross the Amu Darya lies the heavily blockaded territory controlled by the Turkestan Legion. After the First Turkestan War, Turkmenistan had to retreat to the west bank of the Amu Darya, using fortifications built along the river to withstand the almost frantic attacks of the Turkestan Legion.\n\nIn this environment, Chardzhou had to bear the dual heavy responsibilities of border defense and economic development, and the entire city was built into a strong fortress. Although urban development was thus forced to slow down, if this action had not been taken, the more than a million compatriots behind Chardzhou would likely have faced the deadly threat of the Central Asian plague.\n\nBut even so, the deepest source of fear for the people of Chardzhou is not the ever-present possibility of war, but apathy. The comfortable environment gradually washes away the terrifying past. When a new generation of Turkmen children play by the isolation wall, they no longer ask about the stories beyond the wall.\n\nPerhaps one day, the city's memories will settle like the silt of the Amu Darya, and the new generation of Turkmen will completely forget how the river once flowed freely.\n\n"

#state_lore_initials.863: "DSB"
#state_lore_name.863: "Dushanbe"
#state_lore_desc.863: "Nestled within the majestic Gissar Mountains, Dushanbe is like a forgotten, isolated city. Soviet-era government buildings still stand, but the portraits of Marx on their walls have been blurred by wind and sand. In the central square, General Secretary Gafurov's speeches echo in the empty plaza, while queues for rationed bread stretch three blocks: today's Dushanbe is experiencing its coldest winter since its founding—not just climatically, but spiritually.\n\nAfter the First Turkestan War, Tajikistan lost the ruby mines of eastern Badakhshan and the granary of northern Fergana. In the Dushanbe Central Museum, the originally complete national sand table model has been crudely gouged out in two large sections, revealing the glaring wooden base.\n\nAmidst this collective depression, the people of Dushanbe have developed a unique wisdom of survival: elders in teahouses play ancient melodies on the dutar, bazaar vendors secretly sell embroideries depicting the full national territory, and even professors at the National University, while teaching officially approved history lessons, will suddenly pause and then look with meaningful eyes towards the snow-capped mountains in the west that once belonged to their homeland.\n\nFacing national humiliation, Dushanbe is neither willing to be a loser nor able to find a path to resurgence. The shadow of the Gissar Mountains perpetually shrouds the city, much like the Tajiks' lingering sense of inferiority.\n\nBut Dushanbe's faint, unextinguished lights each night seem to remind the world: as long as someone remembers Ferdowsi's epic, as long as the waters of the Vakhsh River continue to flow...\n\nThe Tajiks will never truly abandon their hope for tomorrow. Gafurov's rule has already wavered—but they do not yet know what color this so-called 'tomorrow' will arrive in.\n\nOr perhaps...?\n\n"

state_lore_initials.864: "LNN"
state_lore_name.864: "Leninabad"
state_lore_desc.864: "The history of Leninabad dates back to the 4th century BC, when it was one of the northernmost outposts established by Alexander the Great in Central Asia. For centuries, this city underwent multiple name changes and rulers under the Persian, Arab, Mongol, and Tsarist Russian empires—and it remained so in modern times.\n\nWhat Leninabad is most known for in the memories of the older generation is the Great Central Asian Uprising—this great uprising against feudal oppression began with the Leninabad Uprising on July 17, 1916.\n\nBut unlike other cities in the Fergana War that were forcibly occupied by Kyrgyzstan, Leninabad did not fight, nor did it resist. When the Tajikistan flag on the government building was taken down, no one looked up. The city's once unyielding character vanished at this moment—in the eyes of Leninabad's residents, their beloved homeland had died, died that morning, died on the battlefields of Badakhshan and Fergana.\n\nWhen Kyrgyz officials celebrated their 'Victory Day,' there were no angry glances from behind Leninabad's windows. Only on the night of the fifteenth of each month, when the desolate cold moon shone upon this land, would suppressed sobs emanate from a few rooftops—people mourning a homeland whose name they dared not speak.\n\nThus, this once vibrant ancient Tajik city is now left with only hollow buildings and numb faces, becoming an empty shell drained of its soul, awaiting a dawn that will never come.\n\n"

state_lore_initials.865: "KDZ"
state_lore_name.865: "Kunduz"
state_lore_desc.865: "Kunduz, a city transformed into a drawn scimitar, lies across the occupied Badakhshan mountains of Tajikistan. This ancient city, suddenly thrust onto the strategic frontline by Kabul, is undergoing a militarized metamorphosis contrary to its gentle nature.\n\nKunduz was once an important stop on the Silk Road, renowned throughout Central Asia for its sweet pomegranates and bustling camel markets. But now, a decree from Kabul seeks to transform this ancient city into a military fortress to resist northern counterattacks. Although construction funds from Kabul have rapidly modernized the city, ubiquitous fortifications and military checkpoints still remind Kunduz of its mission.\n\nAs pressure from Tajikistan mounts daily, the military and civilian life in Kunduz remains under continuous high tension. In hospitals, delivery rooms are separated from battlefield emergency rooms by only a wall; on the minarets of mosques, military binoculars are placed alongside scriptures. This city is overdrawing its millennia-long accumulation of peaceful heritage, much like the century-old pomegranate trees felled to build fortifications—with each one lost, a part of the city's soul withers.\n\nOne day, Kunduz will, as it has many times throughout history, revert from a military stronghold to a border town enveloped by the scent of pomegranate blossoms. But at this moment, it must continue to play the role of the iron defense line Kabul needs—unrelenting, facing destruction. After all...\n\nKunduz can be rebuilt, but Badakhshan may never return to the embrace of Greater Afghanistan.\n\n"

state_lore_initials.866: "KRG"
state_lore_name.866: "Khorog"
state_lore_desc.866: "As the world plunged into despair amidst the chaos of war, Khorog became a secluded paradise, isolated from the world.\n\nKhorog was founded in 1932 and has since served as the administrative and transportation hub of the Pamir region, as well as an important transit point for goods.\n\nWhen the flames of the First Turkestan War swept through the Fergana Valley, Khorog became the first city in Tajikistan to fall. Fortunately, due to its remote location, it was spared from the ravages of war.\n\nGeographically, the Badakhshan mountains where Khorog is located do not seem destined to enjoy such tranquility: Tajikistan, Afghanistan, and China all claim ownership of this land. For Afghanistan, which currently possesses this territory, they cannot guarantee that Badakhshan will remain in their hands indefinitely.\n\nBut the fact is, Khorog continues to shine in its original place, quietly lying by the rushing waters of the Panj River, permanently freezing the beauty of the Pamir mountains in this moment—unnoticed, undisturbed, with natural barriers of high mountains blocking not only the cold wind but also the clamor of the new order.\n\nOnly when travelers, drawn by its reputation, arrive here, will Khorog reveal the beauty of this land, allowing them to write in their travel journals an exclamation of wonder, as if it were a paradise:\n\n“In the scratches left by God's fingertips, Khorog possesses both the ruggedness of high mountains and wide valleys, and the gentleness of apricot blossoms in spring rain...”\n\n"

state_lore_initials.867: "PSW"
state_lore_name.867: "Peshawar"
state_lore_desc.867: "A dark joke circulates in Peshawar's teahouses: 'We should thank the Afghans for not fixing the drainage system—the sky reflected in the puddles is the only freedom we can still see.'\n\nThis ancient city, once cherished by Pakistanis, now lies like a casually discarded trophy in the northwestern corner of the Afghan Empire's map. The winds and sands of the Khyber Pass batter the remaining Victorian colonial buildings, and the once bustling Saddar Bazaar is now crowded with second-hand military surplus vendors from the Afghan army. Passing vehicles rumble over potholed streets, stirring up not the dust of British Indian prosperity, but the gloom of poverty and oblivion.\n\nAfghan conquerors view Peshawar as proof of the recovery of Pashtunistan, yet they are unwilling to invest any genuine effort into it. Promised industrial parks remain mere ink on blueprints, and so-called infrastructure projects never move beyond groundbreaking ceremonies. Ironically, in the British-style building renamed 'Afghan-German Friendship Hospital,' Pakistani doctors still treat patients with equipment left from the colonial era. The city's water supply system is dilapidated, but the German-made fountain in front of the Afghan Governor's Palace runs day and night.\n\nBut in this seemingly desperate ruin, the Pakistani independence movement flourishes like weeds.\n\nPeshawar's predicament is much like the genuine and fake antiques in its bazaar: on the surface, it is a decaying border town under Afghan rule, but internally, it is the nerve center of the Pakistani restoration movement. While Kabul boasts of its 'modernization achievements,' they rarely notice the strange noises emanating from the border.+\n\nThe irony of history is that while the Germans are busy building victory monuments in Kabul, every 'gift' they deliberately left in Peshawar attempts to shatter that victory. Perhaps soon, this silent city will angrily prove to the world:\n\nIt is the conquerors' indifference and contempt that preserved the purest spark for Pakistan's resurgence.\n\n"

state_lore_initials.868: "QTT"
state_lore_name.868: "Quetta"
state_lore_desc.868: "Quetta's fate underwent a dramatic turn in modern times: as the former capital of the Khanate of Kalat, it once witnessed the glory of Baloch civilization. The arrival of British colonizers changed everything—the Khanate of Kalat was torn apart by their schemes, and this strategic stronghold was forcibly incorporated into British India. After the Afghans arrived, due to numerous problems left by the British, the Khanate of Kalat lost full legal claim to Quetta. Furthermore, considering this land a 'fortress' for the Pashtuns, Quetta was assigned to the North-West Frontier Province, becoming part of Greater Afghanistan.\n\nToday, three political ideals fiercely collide in this city: in front of the Afghan government building, the black, red, and green flag flutters weakly; in quiet side alleys, propaganda leaflets calling for Pakistani independence are ubiquitous; and in caves outside the city, Baloch people swear allegiance to old maps of the Khanate of Kalat.\n\nAnyone with discerning eyes can see Quetta's contradictions clearly, but the distant Kabul elites turn a deaf ear, allowing Quetta to slide into the abyss of chaos.\n\nIn Afghan government schools, Pashtun teachers outline the borders of 'Greater Afghanistan' in the margins of textbooks; in a hidden corner of a mosque, Pakistani activists examine newly acquired German rifles; inside remote teahouses, Baloch people are busily planning their next attack.\n\nQuetta's future is full of variables: will it willingly remain an Afghan border outpost, or will it become Pakistan's southwestern gateway in the chaotic tide of history, or will it ultimately return to its former homeland, restoring the past glory of the Khanate of Kalat?\n\nProbably no one knows the answer...\n\n"

state_lore_initials.869: "KLT"
state_lore_name.869: "Kalat"
state_lore_desc.869: "On the desolate plateau of Balochistan, the city of Kalat is like a ruined palace forgotten by time. The former glory of the Khanate has long weathered away, leaving only a few mottled palace walls casting broken shadows under the scorching sun.\n\nIn the dilapidated council hall, Mir Ahmad Yar Khan still holds monthly cabinet meetings, but the attendees are merely a few tribal elders, who often come to blows over unequal distribution of interests, much like a camel caravan—seemingly moving in a unified direction, but in reality, each camel carries the private goods of a different owner.\n\nBullet holes in the palace walls cannot be repaired due to lack of funds, just as colonial archives left by the British mercilessly destroy the legitimacy of the Khan's rule. In the palace basement, the already scarce pounds are still being gnawed by termites, while vendors in the market still use opium as currency.\n\nAnd when night falls, the Khan's guard will punctually light the gas lamps on the palace walls, even though half the city's residents have long switched to kerosene lamps. This futile sense of ritual is a microcosm of Kalat's current situation—maintaining the decorum of royalty, but unable to conceal the emptiness of power.\n\nThe so-called palace is adorned with faded silk drapes, while the slums outside the palace walls spread like thorns in the desert—this nominal 'capital' is sliding at an alarming rate into irreversible decay.\n\nKalat's future is perhaps already determined: either succumb to Afghan guns, or be submerged by Pakistan's human tide, or self-destruct in tribal feuds. The only certainty is that when that day comes, the sand beneath the Khan's throne will be no heavier than the sand piles where the slum children play.\n\nAnd its only defense, perhaps, is its daunting poverty and chaos.\n\n"

state_lore_initials.870: "GWD"
state_lore_name.870: "Gwadar"
state_lore_desc.870: "Since 1792, Gwadar has belonged to the Sultanate of Oman, becoming its overseas exclave. The Khanate of Kalat once gifted this land to an exiled Omani prince, never imagining that centuries later, it might become key to changing Balochistan's destiny.\n\nHowever, the reality of Gwadar is utterly disproportionate to this strategic value—the villages have no electricity, no running water, and fishermen still go out to sea in primitive dhows, bringing back catches barely enough to make ends meet. Omani rule is loose and distant; apart from the annual symbolic visit of tax collectors, there is almost no sense of 'foreign territory' here.\n\nIn 1958, the Baloch princely states first attempted to buy back Gwadar, but Oman refused. This event was like a stone thrown into calm water, creating ripples. Relations between the two sides began to tense, eventually escalating into the first confrontation between Baloch and Omani forces.\n\nFishermen often wonder why, as the two countries had never clashed over this before. But in distant Berlin, German engineers are evaluating the possibility of building a submarine base in Gwadar; in Rome, Italian trading companies have begun drafting plans for the construction of a Gwadar trade port; in Tokyo, Japanese fisheries companies have turned their attention to the undeveloped Arabian Sea—this Omani exclave, dormant for two centuries, is being drawn into an international game far beyond the villagers' comprehension.\n\nHowever, when fishermen mend their nets, they only worry about tomorrow's catch—after all, no matter who Gwadar belongs to, the fishermen's livelihood must continue. Gwadar's uniqueness lies in its poverty serving as the best camouflage: while great powers argue over blueprints, the real Gwadar maintains its own rhythm amidst the ebb and flow of tides.\n\nBut the great powers will not let such days last too long.\n\n"

state_lore_initials.871: "ONG"
state_lore_name.871: "Onega"
state_lore_desc.871: "In the mists by Lake Onega, Onega—this frozen prison—has long been Finland's puppet, silently enduring pulls from all directions. Finnish army outposts, anti-communist volunteer barracks, and the banners of the West Russian Revolutionary Front across the river tear Onega into painful fragments.\n\nBefore the West Russian War, it was merely a small town known for its timber processing industry. And when Nikolai Bukharin stopped here during his exile in 1911, Onega's severe cold and barrenness left a deep impression on him—far more so than his final place of exile, Arkhangelsk.\n\nAfter the West Russian War, the Finns set their front line here. Those who could still confront them after the smoke cleared were the West Russian Revolutionary Front, with whom they had a blood feud. Over the years, in this meaningless war of attrition, Finland ultimately could not bear the long-term cost of confronting the Front, but a new problem arose: if they wanted to guard this gateway to Europe, what effective methods could there be?\n\nThe First Anti-Communist Volunteer Army was thus born.\n\nUsing family ties as leverage, Finland pushed these captured Red Army soldiers to the front lines with bayonets, forcing them to turn their swords against their former comrades. This was the optimal method, and also the cruelest punishment for these Russians: allowing everyone stationed there to hear the laughter of their children from the opposite trenches.\n\nAs winter approaches, the artillery fire from both sides gradually ceases. Not because peace is coming, but because both sides have run out of ammunition, or cannot bear to kill each other. The residents of Onega know that there are no victors in this standoff—only more bodies covered by snow, and the increasingly quiet sobs of soldiers in the trenches:\n\nNo resistance, no indignation, only numbness—and humble, desperate pleas for the only remaining family ties...\n\n“When—how much longer, will you let us go home...”\n\n"

state_lore_initials.872: "PLK"
state_lore_name.872: "Plesetsk"
state_lore_desc.872: "If an ordinary person were to peruse Plesetsk's urban archives, they would only find fragmented records within the pages.\n\nPlesetsk's time as a true city is very short—in 1951, a special unit led by Galaktion Alperadze and a team of engineers led by Sergei Korolev quietly arrived here. They brought blueprints, equipment, and a certain firm belief to carry out secret work. Within a few years, the once desolate Plesetsk rapidly expanded: new buildings rose, railways extended deep into the dense forest...\n\nIndeed, such activity was bound to arouse German suspicion. In 1955, taking advantage of the West Russian War, the German army intensified its reconnaissance and bombing of Plesetsk. This engineering project ultimately ended without success due to German bombing and a shortage of funds. Fortunately, Germany was unable to fully ascertain the West Russian Revolutionary Front's true intentions here.\n\nToday's Plesetsk appears calm as usual, with reconstruction work slowly progressing, allowing the city to gradually fade from German sight: it seems to have become an ordinary city once more. But if one removes the elaborate disguise meticulously crafted by the West Russian Revolutionary Front for this city, beneath the seemingly calm surface...\n\nOnly high-ranking military officers stationed here can retrieve these materials, considered top national secrets, from the archive's safe. In closed-door meetings with the resident expert panel, the true mission assigned to this city by the West Russian Revolutionary Front is revealed—an exceptionally bold, seemingly unattainable mission:\n\n“The Earth is the cradle of humanity, but humanity cannot forever be confined to the cradle.”\n\n“To stand tall in the world, Russia must possess a terrifying power from which the entire world cannot escape the threat of death.”\n\n"

state_lore_initials.873: "UKT"
state_lore_name.873: "Ukhta"
state_lore_desc.873: "If Arkhangelsk is the brain of the revolution, and Plesetsk its hands, then Ukhta is the torso that supports the revolution.\n\nUkhta's predecessor was a village called 'Chibyu,' and oil springs along the Ukhta River were known as early as the 17th century. In the mid-19th century, oil drilling began in the Ukhta region. It was also one of the earliest oil wells in Russia. In 1943, with the opening of the Pechora Railway and forced labor by political prisoners, Ukhta's urban scale expanded. With the blessing of resources, Ukhta's urban status continuously rose.\n\nDuring the tumultuous years of the West Russian War, the Ukhta region utilized its rich mineral resources to provide valuable fuel and mechanical parts to the Revolutionary Front's mechanized units. As a strategic logistics hub and resource city, it made significant contributions to the early victories of the West Russian War.\n\nWhen the Front collapsed and the Komi rebels' artillery approached, Georgy Zhukov led the remnants of his troops to retreat here and fought to the death with the local defenders. After several months, at the cost of nearly half of Ukhta's urban area being reduced to ruins, the Front's vital resource lifeline was ultimately preserved.\n\nDespite his distinguished military achievements, internal rifts within the Revolutionary Front still deeply entangled Zhukov. Open attacks are easy to dodge, but hidden ones are not. Zhukov ultimately chose to retreat gracefully, volunteering to return to Ukhta to oversee the reconstruction of this vital resource hub. Under the Grand Marshal's meticulous governance, in just a few years, Ukhta's ruined city regained its former prosperity.\n\nAlthough the internal rifts within the Revolutionary Front have not yet healed, Ukhta, this battle-hardened industrial center, has found a moment of peace. Even if the road ahead is bumpy, Ukhta will continue to be loyal to the Front, and its destiny is already closely intertwined with it—either sharing in its glory or perishing together.\n\n"

state_lore_initials.874: "VGD"
state_lore_name.874: "Vologda"
state_lore_desc.874: "Vologda, this ancient city slumbering on the banks of the Vologda River, is donning a tragic mask of neutrality, dreaming its last dream of peace.\n\nThe history of Vologda is remarkably long. From the rule of the Grand Duchy of Moscow to the Time of Troubles, this city witnessed the rise and fall of the Russian land. Too much warfare and turmoil, endless bloodshed and sacrifice, have left this city and its people deeply weary of war. They chose to withdraw their gaze from the conflicts of the outside world, seeking only a moment of peace in their homeland.\n\nAs the smoke of the West Russian War gradually dissipated, General Ivanov led his troops back to this city, liberated after being ravaged by Nazi iron heels. Amidst the chaos of regime collapse, the exhausted people of Ivanovo and Vologda declared the city an armed neutral zone, ceasing all hostile military activities.\n\nTrenches, bunkers, and basic shelters built during the Great Patriotic War now serve as Vologda's self-deceiving umbrella of protection. The air defense systems that once protected railway hubs and military enterprises were also sufficient to allow Vologda to barely survive Germany's endless bombing. At first glance, both sides seemed to use this place as a buffer zone, peace returned to Vologda, and war seemed like a performance one could remain detached from.\n\nHowever, the cruel truth is that Vologda's choice inevitably prevents it from remaining aloof in chaotic Russia. And when Ivanov's carefully constructed facade of armed neutrality is ruthlessly torn down, when the defense lines collapse and the army withdraws, Vologda will inevitably fall into flames again, paying the price for its inaction. Its people will only suffer nameless wrath due to their so-called 'neutrality,' barely surviving under the threat of others' weapons. This is Vologda's inescapable destiny, and indeed, its own doing...\n\nNo one weeps for the neutral.\n\n"

state_lore_initials.875: "KRM"
state_lore_name.875: "Kostroma"
state_lore_desc.875: "When the Russian land plunged into endless strife, Kostroma chose to stand with Vologda—to be a beneficiary of the neutral zone, and also a guardian of this pure land.\n\nAs one of Russia's most renowned ancient cities, Kostroma is famous as the birthplace of the Romanov dynasty. Its urban area still preserves many wooden churches, official residences from the 16th to 19th centuries, and classical architectural complexes from the 18th century. The city's economy is supported by jewelry processing, engine parts manufacturing, and cotton textile industries.\n\nAs the transportation hub of the Vologda neutral zone, Kostroma is known for its developed water and land transport. Its proximity to the Moscow Kommissariat also makes it an essential route for people fleeing east from the occupied territories.\n\nAs refugees continuously poured in, Kostroma's streets became crowded. Although local infrastructure was under increasing pressure, no one proposed closing the borders. Kostroma understood that neutrality was not an escape, but a mission bestowed upon it by heaven. In this war-torn land, it used its ancient city walls to build a barrier for the innocent, and with wisdom accumulated through history, it guarded the last sparks of civilization. When the smoke of war clears, people will not forget that in Russia's darkest years, there was a city that refused to participate in killing and chose to save lives. As the literary giant Aleksey Pisemsky, born here, once said:\n\n“I have always been true to my convictions, never betraying the humble talent bestowed by heaven for any fleeting reason. One of my guiding lights has been the desire to tell my homeland the truth about itself. As for success or failure, it is not for me to judge.”\n\n"

state_lore_initials.876: "IVK"
state_lore_name.876: "Izhevsk"
state_lore_desc.876: "To speak of Izhevsk is to speak of its renowned firearms manufacturing. Since the first hammer blow fell with Tsar Alexander I's decree in 1807, the city's fate has been inextricably intertwined with gun barrels, gunpowder, and revolution.\n\nThe entire city has echoed with the sounds of forging for nearly two centuries, from the flintlocks of the Tsarist era to the Red Army's Mosin-Nagants during the Civil War, and then to the PPSH submachine guns that resisted the Nazis during the Great Patriotic War—the name of this city is engraved on the primer of every bullet. When German iron heels rolled over the Russian land, Izhevsk's production lines never ceased: even if the workers' fingers were stained black with oil and metal shavings, they still forged weapons of revenge with almost religious fervor.\n\nMikhail Kalashnikov ignited the spark of design here, forging the blueprint of the AK-47 in the crucible of war. At that time, Izhevsk was not just an arsenal; in people's eyes, it was a monument to the revolution, engraving the sincere desire of every soldier to restore peace and beauty to their homeland.\n\nHowever, as the Front collapsed, Vladimir III's army swept in like a blizzard. Workers had to smash machine tools they couldn't take with them, and core technicians and blueprints were evacuated to the frozen tundras of West Siberia. All that remained were empty factories and oil stains mixed with blood under the boots of Tsarist soldiers.\n\nToday, Izhevsk remains the most dangerous arsenal on Russian soil. Whether it's the Tsar's generals, West Russian warlords, or Ural bandit chiefs, all covet its production lines. For here, steel is not merely forged, but tamed—every turn of the lathe can churn out a killing tool for their use, becoming the winning formula in every war.\n\nAnd this is Izhevsk's mission:\n\nIt never produces firearms; it produces war itself.\n\n"

state_lore_initials.877: "UFA"
state_lore_name.877: "Ufa"
state_lore_desc.877: "The history of Ufa is precisely the history unique to the Bashkirs.\n\nIn 1574, Ivan IV ordered the establishment of Ufa to protect the Bashkirs who recognized Russian suzerainty from invasions by the Kazakh Khanate—and to administer the area, while also requiring the Bashkirs to pay furs as tribute to Russia here. In exchange, Russia had to maintain the Bashkirs' land ownership and recognize their rule.\n\nBut the honeymoon period was ultimately short-lived. Russia gradually showed its fangs, and the Bashkirs had no choice but to rise in resistance. After several costly uprisings, large and small, Russia finally had to compromise—and Ufa, a city that stood firm through the fires of war, became a great spiritual symbol for the Bashkirs.\n\nInto the 20th century, with the development of the Volga-Ural oil field and the support of Bukharin's 'Siberian Plan,' Ufa's economy further developed. It quickly became an important center for oil refining, petrochemicals, and mechanical industries in the Soviet Union. The industrial relocation during the Great Patriotic War further boosted the city's development, making it the most brilliant and precious pearl on the territory of the Bashkir Autonomous Soviet Socialist Republic.\n\nAfter the West Russian War, the Bashkir Islamic Republic seized the opportunity to gain independence. Ufa was also able to shed the many shackles Russia had imposed on it, becoming the true capital of the Bashkirs.\n\nAlthough the chaos brought by the war hindered Ufa's development, the Bashkirs, with their independent and resolute spirit, continued to build their cherished city into a prosperous and great metropolis, and also a religious city rich in Bashkir Islamic faith. However, as the descendants of the new generation of Bashkirs play freely in the city's parks, the older generation still cannot forget the past under Russian rule, and a truth they are unwilling to recall...\n\nUfa was ultimately a city founded by ethnic Russians. Can it truly... escape Russia's grasp?\n\n"

state_lore_initials.878: "BZK"
state_lore_name.878: "Berezniki"
state_lore_desc.878: "Since the 19th century, Berezniki, leveraging its rich reserves of potassium-magnesium salts, built Russia's earliest alkali plant, and subsequently developed a vast fertilizer industry that not only nourished the entire Soviet agriculture but also significantly impacted global food trade.\n\nUnexpectedly, in the warlord-ridden, power-struggling land of Russia, Berezniki struggles to sustain the isolated Order of Saint George, leaving it tormented by hunger, poverty, and cold.\n\nThis is not unfounded. After several wars, Berezniki has long shed its industrial crown. The former glory of the crown can no longer hide the truth of its decline: after the Russian Civil War and the West Russian War, most of Berezniki's industrial facilities were either damaged by the war economy or directly destroyed in the fighting, and the city was once on the verge of abandonment.\n\nLater, the Order of Saint George arrived here—without advanced technology, without astonishing wisdom, without vast wealth, but with supreme piety to their faith and a paramount vision of liberating the common people of Russia. Berezniki continues to decline, but the Order is powerless to stop it: there is no other way than to simply repair its ruins and scavenge the remaining industrial facilities to continue production. As the city remains stagnant, its demise is only a matter of time.\n\nWhat is worrying is that even with its industrial glory gone, Berezniki still bears the heavy responsibility of nurturing this land. As the industrial heart of the Order of Saint George inevitably ages, even the most steadfast believers may not escape the fate of being sealed by frost.\n\nLord, please do not truly forget us...\n\n"

state_lore_initials.879: "GNY"
state_lore_name.879: "Gainy"
state_lore_desc.879: "Gainy was first mentioned in historical documents in the land survey records titled 'Yakhontov Cadastre of 1579.' At that time, Gainy, a 'pogost,' had 17 farming households, 4 idle cultivated lands, and 16 Russian acres of arable forest land.\n\nIn the years after Gainy's establishment, no matter what drastic changes occurred in the outside world, Gainy continued to go its own way in the ice and snow, undisturbed by external affairs. All this seemed to be due to divine favor and the simplicity of its people.\n\nHowever, this tranquility ultimately could not escape the clutches of war.\n\nWith the advent of the Time of Troubles, greedy individuals came here, plundering and burning—they turned a blind eye to the suffering of their compatriots, and disdained Gainy's extreme poverty. For them, as long as plunder was enough to allow them to continue their debauchery, their butcher's knives would not be put down.\n\nJust as everything was falling apart, Mikhail Ivanovich Antipov fled here. Inspired by a local priest, he realized that all the horrifying tragedies in Russia today were by no means accidental, but rather a punishment. The people of Russia had abandoned the Lord, and thus, the retribution for their sins descended upon this place.\n\nHe gathered the people of Gainy and nearby villages, raised the banner of the 'Order of Saint George,' and purified the erosion of warmongers and infidels, making Gainy once again an undisturbed 'Eden.'\n\nNo one knows if this peace will be broken again, but the town of Gainy has become the spiritual symbol and source of faith for the Order of Saint George: since God has given it the mission to save Russia, Gainy will surely be the beginning of this divine journey, and God's last chance for Russia. Under the storm and cold snow, that oath will still echo:\n\n“That godless dragon shall ultimately be pierced by the spear of truth.”\n\n"

state_lore_initials.880: "BRK"
state_lore_name.880: "Beloretsk"
state_lore_desc.880: "On the fragmented lands of post-war Russia, thugs are many, heroes are few. Yet the soldiers of the Ural League have forged many new identities for Beloretsk—a land of miracles, a city of heroes.\n\nBeloretsk has witnessed numerous historical events in Russia's industrial development and peasant uprisings. Its history dates back to 1762, when two merchants established a settlement on Bashkir land. In 1774, it was an important stronghold for Pugachev's Rebellion. The water tower completed in 1916, with its unique combined water supply and firefighting functions, became the city's most recognizable landmark. During the Soviet era, the 'Siberian Plan' ushered in a golden age of industrial development for Beloretsk, gradually transforming it into a crucial industrial center in the Southern Urals.\n\nWith the collapse of the Soviet Union and the Front, Beloretsk, deeply mired in warlord conflicts and economic depression, welcomed a special group of exiles: led by Father Janis Mendriks, a group of prisoners from the Vorkuta Gulag in the north and sympathetic guards, traversed through heavy fighting and blockades, finally reaching this industrial city at the foot of the Southern Urals. This mixed group of redeemers and the redeemed injected new variables into Beloretsk.\n\nToday, under the valiant efforts of the Ural Guard, the dark forces entrenched in Black Mountain and Orsk have also been swept away. This miraculous city, having endured the ravages of war yet standing firm, is once again moving towards revival by the water tower. The Ural Guard, as liberators, has also won the heartfelt support and endorsement of the local populace with their righteous demeanor.\n\nHowever, the crisis is far from over—the shadow of Black Mountain and the forces of Orsk still hang over Beloretsk like the Sword of Damocles. Although the warriors of the Ural Guard can still fight, as the defending commander looks at the growing chaos and despair within the city, a cruel and unwelcome truth becomes increasingly clear in their hearts:\n\nThough heroes bear the responsibility of salvation, the wicked are too powerful to resist. Perhaps one day, the Ural Guard will be exhausted and unable to bear this immense burden.\n\nAt that time, how will Beloretsk fare?\n\n"

state_lore_initials.881: "ORS"
state_lore_name.881: "Orsk"
state_lore_desc.881: "Since Orsk's descent from a bastion of civilization to a barbaric graveyard, its suffering has been so profound that other cities in the Russian wasteland pale in comparison.\n\nOrsk was once a beacon of industrial civilization in the Southern Urals. From the 1870s, the city developed rapidly. During the Russian Civil War, Orsk endured a three-month blockade and then changed hands four times between the warring factions. In the 1930s, funded by the 'Siberian Plan,' many large industrial enterprises were established here, drawing resources from Orsk's mineral-rich soil.\n\nHowever, nightmares always strike unexpectedly.\n\nAfter the collapse of the Soviet Union, due to long-term underinvestment, foreign blockades, and lack of reform, Orsk's economy rapidly collapsed, local factories were largely lost, and unemployment sharply increased. This was followed by extremely intense worker strikes and protests. Yet, amidst the clamor of the West Russian War, who heard the cries of the people here?\n\nWhen the West Russian Revolutionary Front collapsed, the thugs of the Dirlewanger Brigade swarmed into this dying city like locusts. They turned Orsk into a bloody hunting ground and a base for plunder, and the civilization of yesteryear seemed like a distant legend...\n\nToday, Orsk is indeed no different from ruins. Upon it: these bloodthirsty fanatics take arson, murder, and looting as their spiritual totem; Dirlewanger as their spiritual banner; and Orsk as their carnival den. After every raid, these thugs, stimulated by drugs and numbed by alcohol, shout their slogans by the blazing bonfires:\n\n“Dirlewanger is Death, and Death has come to Orsk.”\n\n"

state_lore_initials.882: "YGK"
state_lore_name.882: "Yugorsk"
state_lore_desc.882: "Perhaps Yugorsk itself never anticipated that when it revealed its true face to the world, it would be so dirty and squalid.\n\nIn the far north of Siberia, this is an ice cellar forgotten by the gods. The wind here, like a file wrapped in ice shards, can scrape exposed skin into festering frostbite overnight. The extreme cold is an eternal punishment—it penetrates the bone marrow, thickens the blood, and makes every breath of the prisoners held here like swallowing glass shards. For the politicians in Moscow, this is the best execution ground for criminals.\n\nBefore this, Yugorsk wasn't even considered part of Russia's far northern penal system. When Ioseliani led the 'Thieves in Law' to this desolate place, the locals couldn't even provide decent accommodation and food.\n\nToday, Yugorsk, transformed by the 'Thieves in Law,' has become a 'thieves' world' with an extremely tight criminal network and ubiquitous 'criminal culture.' Ioseliani, weaving through the intricate web he personally spun, seized the opportunity to sign agreements with arms dealers from Zlatoust. Then, amidst the cheers of the crowd, he ascended to the throne of 'Thieves in Law leader' alone.\n\nBut in the shadows, some whisper, some resent. As Zlatoust's arms dealers gradually arm Yugorsk into a formidable fortress against the remnants of West Russian forces, the discontented hide firearms and ammunition in the city's streets and alleys. They await the leader's complacency and laziness, to once again awaken the 'criminal culture' unique to the 'Thieves in Law.'\n\nIn this land where even time freezes, the ambition of thieves is like an ice sculpture trying to ignite diesel. Grand, deadly, and destined to collapse in the flames it ignites, yet always unable to stir up any significant waves...\n\nAfter all, how can thieves contend with an army?\n\n"

state_lore_initials.883: "SGT"
state_lore_name.883: "Surgut"
state_lore_desc.883: "Surgut—city of the far north, a desolate and cold place.\n\nThis city was originally founded in 1594 by order of Tsar Fyodor I. For centuries, it has been one of Russia's military strongholds and development centers in Siberia.\n\nGiven Surgut's geographical location and environment, this wasteland was destined not to have the prosperity of Kurgan and Tyumen. Even during the 'Siberian Plan,' it received only very limited development.\n\nWith the collapse of the Soviet Union and the disastrous end of the West Russian War, this seemingly forgotten northern town regained its soul with the arrival of the Free Pilots Organization.\n\nPerhaps some would say that Surgut is still desolate and poor, but Bocharova also proved that these difficulties are not insurmountable: even with backward technology and tight finances, the people here will still use their wisdom to produce with the remaining industrial facilities; recycle scarce scraps for manufacturing; and even use home workshops to produce ammunition. All just to deliver urgently needed supplies to their pilot comrades.\n\nFearless of storms, severe cold, night, or fog, the 'Night Witches' will take off punctually from Surgut's makeshift airfield, continuing their desperate fight against the German invaders who destroyed their homeland, protecting this land from the ravages of the Germanic eagle.\n\nThus, on the boundless frozen tundras of Siberia, Surgut is like a black fox with a silver tail, maintaining a mysterious vitality amidst alternating mist and blizzards. And the sound of warplanes cutting through the sky, the slogans shouted in unison by soldiers and civilians, have become the city's faint heartbeat.\n\nAnd this steadfastness, perhaps one day in the future, will welcome its own...\n\nReward?\n\n"

state_lore_initials.884: "NTG"
state_lore_name.884: "Nizhny Tagil"
state_lore_desc.884: "Who grants Nizhny Tagil—this never-extinguishing furnace—infinite life?\n\nTracing its history, when the 'Siberian Plan' began, this city was designated as a key industrial development area due to its rich mineral resources. The establishment of the Nizhny Tagil Ural Carriage Works in 1936 was the best answer this city submitted to its motherland.\n\nHowever, unforeseen circumstances arose. When Germany suddenly plunged its blade into the Soviet Union, Nizhny Tagil's comfort and prosperity instantly vanished. Even as the Ural Carriage Works' T-34 production line worked day and night, the steel torrents it produced were still vulnerable before the elite German army. Ultimately, the motherland's mountains and rivers were shattered, the past became smoke, and Nizhny Tagil plunged into a dark abyss of rapid decline.\n\nJust when everything seemed irreversible, Lev Sedov, carrying his late husband's last wish, reignited the torch of Trotskyism's permanent revolution in Nizhny Tagil. What was left for Sedov at that time was merely a revolutionary island facing severe challenges, with warlordism escalating: food and medicine were increasingly scarce; industrial gears were decaying; political struggles spiraled out of control; and the revolutionary cause lacked support...\n\nIt was in such an environment that Sedov, with his iron will and meticulous planning, swept away reactionaries and enemies, saving Nizhny Tagil from dire straits and giving the city a brand new body.\n\nToday, this city, which once nurtured countless revolutionaries, stands on the ruins of Russia, raising the banner of Trotsky, becoming the last spiritual beacon in Russia's Time of Troubles, illuminating the future of permanent revolution with the flames of Trotskyism...\n\nA future of permanent revolution sufficient to liberate Mother Russia, bring new life to the world, and attract the attention of all humanity.\n\nAnd as revolutionaries passionately deliver speeches about their ideals in the square, the children of Nizhny Tagil have already begun to ask: 'Why should we worry about the whole world?'\n\n"

state_lore_initials.885: "KRG"
state_lore_name.885: "Kurgan"
state_lore_desc.885: "Revolutionary flames forge revolutionary steel, revolutionary steel shapes a revolutionary city—Kurgan, a staunch fortress of Stalinists, one of the transportation and industrial hearts of the West Siberian People's Republic.\n\nBetween 1659 and 1662, it was built as an imperial fortress, serving as a fortified town to defend against nomadic attacks. In 1782, Catherine the Great granted it city status, naming it Kurgan, after a large burial mound near the city.\n\nIn 1893, the steel rails of the Trans-Siberian Railway, like surgical sutures, connected this wild land to the civilized world. The whistle of trains tore through two centuries of steppe silence, and cast-iron bridge piers cast the shadow of the 'Siberian Plan' into the Ob River. When Kaganovich declared the establishment of the West Siberian People's Republic, Kurgan's development was given its final acceleration towards the abyss.\n\nDespite the shattered alliance, military defeats, economic collapse, and incessant air raids, Kurgan stubbornly survived with an iron will, continuing to forge revolution for Kaganovich's nation...\n\nTo this day, Kurgan's strategic importance is beyond doubt: it is home to the Kurgan Western Air Base, and also to the machinery manufacturing companies Kavz Automobile Plant and Kurgan Automobile Plant, the latter having produced the famous ATS and ATS-59 artillery tractors since 1954, which are used for field operations and oilfield reclamation in the People's Republic.\n\nAnd in Kaganovich's yet-to-arrive five-year plan, Kurgan will complete its ultimate transformation. For the motherland, for the leader, for the people of Russia, Kurgan will advance at full speed in this adventure, never stopping until the dawn of victory once again graces this land...\n\nFor this, the city of revolution will no longer show mercy to traitors; it will forever adhere to the iron will bestowed by revolution. When the last screw of the five-year plan is tightened, this city, in conjunction with a unified Russian motherland, will let out a thunderous roar to the world.\n\n"

state_lore_initials.886: "BRN"
state_lore_name.886: "Barnaul"
state_lore_desc.886: "Novosibirsk and the Altai Federation, their names are closely related to the left and right arms of this nascent nation: Novosibirsk as the industrial left arm, and Barnaul as the agricultural right arm.\n\nBarnaul was founded in 1930, and after that, its industrial status rapidly rose, and its product range became increasingly wide. Agricultural tool production, timber processing, metal smelting... these industries are not only the economic pillars of Barnaul but also direct proof of the Altai Krai's richness.\n\nThe impact of the 'Siberian Plan' on Barnaul was also immeasurable: with funding from the Bukharin government, the city established a more complete industrial system—and an unimaginable prosperity. The hundreds of factories relocated here during the Great Patriotic War rightfully placed Barnaul on the throne as the third-largest city in the Siberian region. However, fate did not always favor this city, and this brief prosperity vanished with the collapse of the Soviet Union.\n\nAfter the Siberian War and the collapse of the West Siberian Republic, Shukshin, the mayor of Barnaul, raised the banner of freedom and democracy amidst the chaos, bringing new dawn to the city. The richness of the Altai Krai is beyond doubt—it was the most important granary during the former Soviet era, and its timber and agricultural tools sold well throughout Russia. But clearly, Barnaul was unable to fight alone, and the city ultimately chose to create a future with its partners in Novosibirsk.\n\nToday, Barnaul appears desolate. Sibir's tentacles penetrate every corner of the city, attempting to seize its wealth. Shukshin's ideals are certainly beautiful and simple, but concerns about Novosibirsk's competition and attacks are growing daily, making the realization of this ideal seem distant.\n\nAll of it: the suffering of the people, the cries of the workers, the protests of the farmers—Shukshin is not unaware. He is not indifferent, nor is he willing to surrender everything, but he also knows deeply:\n\nThe wheat is not yet ripe.\n\n"

state_lore_initials.887: "ORT"
state_lore_name.887: "Oyrot-Tura"
state_lore_desc.887: "“Therefore, putting away falsehood, let each one of you speak the truth with his neighbor, for we are members one of another.” — Ephesians 4:25\n\nThe destiny of Oyrot-Tura has always been closely intertwined with religion. In 1824, the first Russian settlers moved here from Biysk, and the further development of the area was closely related to the work of the Altai Mission. In 1831, the mission began its work in the area, and missionaries and clergy gathered here. Over the next nearly hundred years, this border village gradually transformed into an important trading post in southeastern Siberia.\n\nThe arrival of the Red Army not only failed to eliminate Oyrot-Tura's religious undertones but instead fostered a unique symbiosis. And when the Soviet edifice crumbled and the smoke of warlordism swept across Siberia, Oyrot-Tura, due to its isolated geographical location, remained untouched by the fires of war, continuing to recite the Bible during the Time of Troubles.\n\nBut history has repeatedly proven: wars always end, and tranquility will eventually shatter.\n\nThe influx of refugees caused Oyrot-Tura's religious balance to tilt. The coexistence of Old Believer immigrants and indigenous Burkhanists gradually evolved from initial mutual suspicion into a struggle to defend their faith. In this resource-limited mountain town, adherents of two faiths are tearing apart the city's fragile peace inch by inch with suspicion and hostility.\n\nZavoloko's mediation and that of his followers, though like casting stones into an abyss, failed to break the mountain town's rhythm of life: adherents of different faiths still work from sunrise to sunset under the same sky—this is the Lord's original intention, and also the Lord's vision. And Oyrot-Tura will, in its unique way, silently follow in the footsteps of Jehovah amidst the wind and snow.\n\n"

state_lore_initials.888: "NRS"
state_lore_name.888: "Norilsk"
state_lore_desc.888: "\"To the outside world, Siberia is merely a rumor—this vast, cold, and fertile land, where everything possesses a primordial, cosmic scale, even the biting extreme cold and boundless desolation are as awe-inspiring as outer space.\"\n\nAs described by Valentin Rasputin, the Siberian region has always maintained its eternal soul—even under the wave of construction of the 'Siberian Plan' during the Bukharin era, this far northern land stubbornly retained its original character of frozen wilderness stretching for thousands of miles. Only a few scattered towns, like forgotten constellations, stubbornly twinkled on the permafrost. And Norilsk is the brightest solitary star in this desolate galaxy.\n\nWhen the iron fences of Norillag rose on the permafrost in 1935, this destined-to-be-extraordinary settlement truly etched itself into the map of the Soviet Far North under the name of a city. And a group of 'dissidents' swept away by the tide of the times—from intellectuals to religious figures—poured into this iron cage located within the Arctic Circle, escorted by the Internal People's Commissariat. The iron will of the Soviet government permeated every corner here like a biting cold wind, and the prisoners' remaining lives were sacrificed on this land, used to plan blueprints for Norilsk, seeking a way to survive.\n\nAfter the collapse of the Soviet regime, the Norillag uprising ended the brutal rule of the local government. The city then reconciled with the nascent West Siberian Republic and briefly integrated into the territory of this new nation. During this rare period of peace, Norilsk showed astonishing vitality in its recovery: industrial buildings rose, and the city's boundaries continuously extended into the permafrost. The Republic's ambitious land route plan once attempted to break the fate of the polar island. However, the extremely harsh geological and climatic conditions ultimately stifled this 'Far North Road' at the exploration blueprint stage.\n\nAs the West Siberian Republic disintegrated, Norilsk and its surrounding areas once again became isolated polar islands. Under the endless erosion of wind and snow, this far northern city was gradually forgotten by time, until one day...\n\nPerhaps explorers will break through the snow blockade, bringing the ice-covered city back into the light; perhaps architects will break the frozen curse, continuing this interrupted epic of development. But before the wheel of fate turns again, Norilsk will remain dormant in the eternal night of the Arctic Circle, quietly awaiting its dawn as a secret of the tundra deliberately forgotten by civilization.\n\n"

state_lore_initials.889: "YKS"
state_lore_name.889: "Yakutsk"
state_lore_desc.889: "There's a famous saying: Siberia has no spring, summer, or autumn, only winter and 'around winter.' And in the far north of East Siberia, near the Arctic Circle, there is an extremely cold city—Yakutsk.\n\nA city of ice and snow on permafrost, a kingdom of ice and snow adorned with diamonds—all descriptions of Yakutsk cannot escape its two greatest features: extreme cold and rich mineral deposits. The former limited Yakutsk's development, while the latter opened a new window for it.\n\nWhen the red banner of the Far Eastern Soviet Presidium fell, Yakutsk chose to rush towards an unknown freedom. Above the diamond and gold-studded mines, nationalist revolutionaries led by Basharin dreamed of the independent glory of the Yakuts, but the drilling sound of ELGA Mining Company was far louder than the Yakut national anthem.\n\nIndeed, the export of diamonds and gold brought considerable wealth to Yakutsk, but unfortunately also became a curse upon itself: leveraging its strong capital and vast connections, ELGA, a mining giant deeply rooted in the Sakha Republic, was able to establish its own 'state within a state': possessing its own private army; rampant through gangs; controlling Yakutsk's economic lifeline; and contending with the Yakut government...\n\nTo whom will this city ultimately belong? To the idealists waving nationalist flags? Or to the commercial behemoths controlling the flow of diamonds and gold? Perhaps the answer is already written in the permafrost beneath this city:\n\nIn Yakutsk, only two things are eternal—the minus sixty-degree winter, and humanity's insatiable greed for wealth.\n\n"

state_lore_initials.1001: "NaN"
state_lore_name.1001: "Omsk"
state_lore_desc.1001: "\n\n\n\n\n\n£GFX_state_lore_img_1001_texticon “he will put on righteousness as a breastplate,and wear impartial justice as a helmet;he will take holiness as an invincible shield,and sharpen stern wrath for a sword,and creation will join with him to fight against the madmen.Shafts of lightning will fly with true aim,and will leap to the target as from a well-drawn bow of clouds,” — Wisdom 6:18-21\n\nThirty years ago—from the moment the world order was decided, the fear of §V<BLOTTED OUT>§! was deeply ingrained in people's hearts, and this fear intensified with its own spread and human ignorance. Until §xthat day§!, fear turned into a terrifying reality, and all things were consumed by atomic flames. Yet the mastermind behind all this still survives in this underground nuclear bunker.\n\nEven though the outside world has fallen into silence, for §V<TOP SECRET>§! and his descendants, this §xjudgment§! will continue. The surviving victims and remnants, now only because of this one person's elusive, flickering obsession, are either reorganized under the banner of §V<UNSEEN>§!, or become gunned-down souls before the grave of §x<BROKEN>§!—becoming the apocalyptic force to meet their §Rultimate destiny§!.\n\nFor the military and civilians stationed in Zoar, this burden—day after day, dull and monotonous, like a cycle, grinding the invisible future into a monotonous straight line. Together with the bunker and himself, he is trapped here, turning into an eternal cage of monotonous colors, unable to escape this §x<UNKNOWN>§! fate. Will he be the righteous man spoken of by the Lord? §V<TOP SECRET>§! meditates in the dim bunker, the flickering light reflecting his mottled figure. He was once a fanatic holding a torch high, and now, the fire of revenge still burns—but it is no longer magnificent, only the faint glow of radioactive embers. What was his original intention? Was it justice, or obsession? Where does his path lead? Is it salvation, or the abyss? If all he did was wrong, why did §Rfate§! choose him? If justice should prevail, why did the Lord turn everything to ashes?...\n<The Lord did not answer him>\nAnd people cower in the abyss of fear and despair, gasping like ants in eternal night, as for §V<TOP SECRET>§! himself—he also wanders in a void of cycles, repeating meaningless rituals, recalling the earnest teachings of his former mentor §x<CROSSED OUT>§!... and the §Rultimate destiny§! woven for him by the Lord, buried in radioactive dust...\n"

state_lore_initials.1002: "NaN"
state_lore_name.1002: "Germania"
state_lore_desc.1002: "\n\n\n£GFX_state_lore_img_1002_texticon \n\n\n\n§W“So the Lord said, “I'm going to wipe out these people I created from the earth, and not only them but also the animals, the creatures that run along the ground, and the birds, because I'm sorry I made them.” — Genesis 6:7\n§dProsperity, abundance, beauty—transformed from the heart of an empire into a human purgatory, fallen from the pinnacle of the world into a nuclear inferno, even dragging the entire world to its grave. Behold, your empire is built on hatred as its beams, on the flesh and blood of other peoples as its foundation, and on their wails as its anthem. In that vast, §V<UNSEEN>§! land, countless people wept blood from suffering, countless people were displaced by oppression. Why do you still refuse to understand—that all this will eventually backfire on yourselves? Why do you still indulge in illusory dreams, unwilling to open your eyes and see the cruel world outside your walls that you yourselves created?\n\nBurn! Destroy! No one cries out for you, the world's tragedy began with you—\n§gIf not for you, if not for §x<BLOTTED OUT>§! and §V<BROKEN>§!, how could there be today's raging fury and corpses strewn across the fields? The people of all nations ultimately turned to ashes, and 'God' sent down divine punishment, burning Gomorrah to ruins with §V<BROKEN>§!, thick smoke rising like from a kiln. In helplessness and fear, homes marched towards an eternally unknown tomorrow.\n§sWeep! Grieve! No one grieves for you, the world's evil was born from you—\n\nIf not for you, if not for §V<BLOTTED OUT>§! and §x<BROKEN>§!, how could there be today's widespread suffering and wails? All living beings turned to scorched earth, 'God' sent down divine punishment, resetting the world order with §x<BROKEN>§!, radioactive dust covering the earth. In the void of silence, the world marched towards an impossible tomorrow.\n§b§V<BROKEN>§! ah, can there be repentance today? You proclaimed yourself a fire-stealing prophet, scattering the sparks of §x<BLOTTED OUT>§! among humanity. That so-called light was merely the karmic fire that consumed the world. You once cried out for salvation, yet you personally lit the fuse of destruction. Looking back now, is it too late to mend the fold after the sheep are lost?\nIt's too late, ultimately too late.\n§qAnd now, you can only be nailed to the peak of fate, letting vultures peck at your liver, day after day, repaying an endless debt in the pain of being consumed by fierce flames.\n\nAs for posterity? They may mock, or lament—but your story, after all, is just a joke, and a tragedy.\nSleep, be silent...\nIf tomorrow still comes, may you pick up your shattered shield, stand upon the ruins, and become a nuclear night watchman.§!§!§!§!§!§!"

state_lore_initials.1003: "NaN"
state_lore_name.1003: "Moscow"
state_lore_desc.1003: "\n\n£GFX_state_lore_img_1003_nothing \n\n\n£GFX_state_lore_img_1003_texticon \n\n\n\n\n\n§W“Abraham came to him and asked: “Are you really going to wipe out the good people along with the wicked? What if there are fifty good people in the town? Are you still going to wipe it out despite the fifty good people there?” — Genesis 18:23-24\n\nIf the wicked are pardoned out of pity for a few righteous, evil will proliferate like weeds, eventually consuming the entire world. Therefore, even at the cost of blood, even bearing eternal infamy, evil must be uprooted—this is not a choice, but a necessity for survival. Historical judgment may question the legitimacy of the means, but if evil is allowed to spread, even §xjudgment§! itself will cease to exist...§d\nNow, they stand before the §Vjudgment seat§!.\n\nThe righteous raise the banner of "Supreme, Holy, Pure," and in the name of justice, push their enemies—and even "corrupted compatriots"—into the world's cruelest execution ground. They raise their shields to resist invasion from the West; they draw their swords, pointing at every "wicked person." As for the outcome, who is wicked, who is righteous, and the innocent caught in the crossfire, it no longer matters.§g\nFor from the moment §xjudgment§! descended, the righteous and the wicked became indistinguishable.\n\nThe Lord looked down upon the ruins of Sodom, shocked and silent. The righteous He had hesitated to save, swayed by §V<BLOTTED OUT>§!, had their eyes consumed by hatred, swallowed by the pleasure of revenge.\nSo, the Lord sent down divine punishment.§s\n\nAs for the "motherland" they swore to defend to the death, it has turned to scorched earth in atomic fire. They were once liberators, then guardians...\nAnd also destroyers.\n\nToday, the outside world has fallen silent, only soldiers still mechanically executing the lingering orders of §x<TOP SECRET>§!, wandering like ghosts over this radioactive wasteland of Sodom. They stubbornly believe that §V<BROKEN>§! will eventually return, convinced that the §Rjudgment§! has not yet ended.§bSo day after day, they hold their ground in collapsed watchtowers and corroded trenches, vowing to defend this scorched earth until the sky falls and the seas dry up, or until blood flows like rivers and they die fighting...\n§qYet they are oblivious that Sodom is no longer their home, and in the Lord's list of salvation, no righteous can be found.§!§!§!§!§!§!"

state_lore_initials.1004: "NaN"
state_lore_name.1004: "Kyoto"
state_lore_desc.1004: "\n\n\n\n\n\n\n£GFX_state_lore_img_1004_texticon \n\n\n\n\n\n\n\n§W“Watch out! The day is coming—it burns like an oven—when the proud and the wicked will be burned like straw. When that day comes they will be completely burned up, root and branch, says the Lord Almighty.” — Malachi 4:1\n\nWhen the heavenly fire descended, all evil would ultimately be consumed by ashes—Sodom was so, Gomorrah likewise, and Admah could not escape. \nWhen divine punishment descended, flames scorched the sky, turning the entire land pale. All of Admah: those running, those soaring, those laughing, those praying, those lamenting...\nAll perished in that purifying light. Shadows flickered, and all returned to void.§d\nIn the embers of the radioactive dust storm, those who survived, the people of §x<BLOTTED OUT>§!. Under the call of §V<BROKEN>§!, they began to rebuild the homeland that had long been buried in radioactive dust. The shattered past was gradually pieced together, but it was never quite the same as before, leaving only intermittent, hoarse sobs, whether of tears or laughter, for the past.§g\n\nThe residents of Admah wept to the Lord, weeping that they should have been innocent, weeping that their families were broken, yet the Lord remained silent as iron, coldly watching all beings struggle in the flames, letting them crawl, wail, and die on the wasteland, facing this terrifying reality alone.\nWere the people of Admah truly innocent?\n\nIf they claim innocence, they should lay bare all the evils of the past: was not the Eastern land a purgatory? And when did the people of Admah ever show compassion for others?§sIn those forty years of §x<BLOTTED OUT>§! arrogance, they shouted "Golden Age," their iron hooves trampling half the world. How many unavenged bones were embedded in each stone of that "Eight Corners of the World Under One Roof" tower, built with bricks from countless cities.\n§R<SPEECHLESS>§!\n§bThe so-called "Co-Prosperity" was to use the strength of the entire world to forge the prosperity of one city: within this city, debauchery and revelry; outside this city, wails filled the fields, and bones piled high.\n\nToday's prosperity has all turned to dust, and the residents of Admah have no more arguments. Innocence does not equate to blamelessness. In the cycle of cause and effect, the suffering they once sowed has now all become divine punishment upon themselves.§qBut the Lord will still leave a glimmer of light: if they are willing to do good and atone for their sins, repenting of the past, perhaps they can break free from the shackles of the old §x<BLOTTED OUT>§!, wash away all their bloodstains, and forge a future in desperation.§!§!§!§!§!§!"

state_lore_initials.1005: "NaN"
state_lore_name.1005: "Denver"
state_lore_desc.1005: "\n\n\n\n\n\n£GFX_state_lore_img_1005_texticon \n\n\n\n\n\n\n§W“All those things have vanished like a shadow,and like a rumor that passes by;like a ship that sails through the billowy water,and when it has passed no trace can be found,nor track of its keel in the waves;or as, when a bird flies through the air,no evidence of its passage is found;the light air, lashed by the beat of its pinionsand pierced by the force of its rushing flight,is traversed by the movement of its wings,and afterward no sign of its coming is found there;or as, when an arrow is shot at a target,the air, thus divided, comes together at once,so that no one knows its pathway..” — Wisdom 5:9-12\n\nShibian is located in a land that calls itself the free nation of §x<BLOTTED OUT>§!§d, at least its inhabitants once called it so. For hundreds of years since creation, war was rare, and the Lord's faithful lived here in peace and prosperity, bathed in abundance. But this ease eventually became a hotbed of corruption. The wicked seized power, justice became a joke, and the once holy city was left with only a decaying shell.\n\nShibian had long indulged in the illusion of being isolated from the world, arrogantly convinced that the fires of this §Rapocalyptic judgment§! would never spread beneath its walls. But did §V<BLOTTED OUT>§! not know—that this divine punishment was originally the Lord's §Rjudgment§! upon the whole earth?\nFinally, divine punishment descended here.\n\n§gFrom §V<BROKEN>§! to §x<BROKEN>§!, no part of Shibian was spared—whether prosperous capital or remote village, whether center of power or border outpost, their painstakingly managed §V<UNSEEN>§! was like a mantis trying to stop a chariot before divine punishment. Where nuclear fire raged, palaces turned to dust, and freedom burned to ashes. So-called prosperity, in but a day, returned to dust.\nHowever, the wicked of Shibian dared to deceive the Lord.§s\n\nThey built an isolated island in §V<TOP SECRET>§!, smugly believing that they could remain untouched in this §Rapocalyptic judgment§!. They calculated: once the fire consumed all things, once the Lord restarted creation, they would crawl out from underground, like venomous insects, to infest the new world, continuing to build their extravagant hotbed.§b\nBut would the omniscient Lord be mocked by fools? §q\n\nThe wicked cowered on their isolated island, thinking they could escape the flames of divine punishment. Little did they know that this foolishness had already stripped them of their last shred of courage. Fear eroded their reason; they dared not step half a step out of their isolated island, trembling even at the light of the new world. Until resources ran out, and all things were about to end. Fear made them raise their butcher's knives against their colleagues, using their blood as sustenance to prolong their lives, frantically vying for the ridiculous title of the new world's "Adam and Eve," ultimately perishing in mutual slaughter.\nThis is the Lord's §xfinal judgment§!.§!§!§!§!§!§!"

state_lore_initials.1006: "NaN"
state_lore_name.1006: "§R<ERROR: ACCESS DENIED>§!"
state_lore_desc.1006: "\n\n\n\n\n\n\n£GFX_state_lore_img_1006_texticon \n\n\n\n\n\n\n\n§WWhen the Lord resolved to send down divine punishment, to burn the five cities of the Moabite plain, His gaze swept over the ruins of those five cities and saw a faint glimmer still unextinguished amidst the rubble. That was the remaining righteous holding onto goodness in the ashes. So He sighed: “For this remaining spark, I will not burn everything completely.”\nThus, divine punishment descended, yet still left a way out for those righteous.§d\nIndeed, among these survivors, good and evil are mixed. But the wicked will ultimately be overthrown by their own evil deeds, the innocent will spend their remaining lives under the Lord's protection, and the righteous will retain the reliance of faith. Although the world has been disfigured by the erosion of §x<BLOTTED OUT>§!, §V<BLOTTED OUT>§!, and §R<BLOTTED OUT>§!. But divine punishment only burns away impurity; as for the pure embers, the Lord leaves them for those believers who still hold onto the light.§g\n\nThose who still hold fast in the land cleansed by divine punishment, the only thing they can do is quietly await the Lord to burn away all the world's filth. When the last sins dissipate into smoke, they will emerge from the shadows, bathed in the light of the Lord's new world.§s\n\nThus, the world is dotted with specks of light, arks illuminated by the Lord for the innocent. There, He expects these chosen ones to cleanse their minds, to adhere to their true selves like ascetics, to learn the wisdom of surviving alone in the new world, the devotion of following the Lord's sacred footsteps, and the courage to protect the eternal justice of the new world.\n\nAfter some years, every void here will, under the Lord's creation, once again have heaven and earth, light, air, water, and living things. He will witness the birth of new humanity, bestow upon them blessings and dominion over all creation, and also admonish them: how the former civilization brought divine punishment upon itself through its depravity, leading to the overturning of heaven and earth and the world consumed by divine wrath. These memories will remain like a brand, warning the new beings He created not to repeat the same mistakes, so that this reshaped world may endure, until they are fruitful and multiply, and fill the earth.§b\n\nYet sometimes, even the omniscient and omnipotent Lord, too, hesitates before this great work of reshaping the world:\n§qWill His creations truly heed His warnings, rest and multiply; or will they remain deluded, repeating the same §Rtragedy§! again?§!§!§!§!§!§!"