 TWN_Hiroshi_Arai: "Hiroshi Arai"
 TWN_Baojia_System: "Collapsing Baojia System"
 TWN_Baojia_System_desc: "The Baojia system, once a tool of imperial suppression under the Qing, was later repurposed by the Taiwan Governor-General’s Office to maintain order and counter resistance after Taiwan's annexation by Japan. However, as Japanese immigration increased, the boundaries between Japanese settler communities and local villages blurred. Despite frequent updates to household registries, the proliferation of crimes committed by Japanese settlers within the Baojia system could not be curbed. Worse still, the collective punishment mechanism originally intended for control only exacerbated ethnic tensions between Taiwanese and Japanese residents.\n\nCaught between Taiwanese refusing to be held accountable for the crimes of Japanese settlers and Japanese immigrants resisting state surveillance, the Governor-General's Office finds itself in dire need of a new security policy.\n\nUntil that policy is devised, however, the Baojia system will remain in place—no matter how many Taiwanese must suffer for crimes they did not commit."
 TWN_communist_propaganda: "A Thorn in One's Side"
 TWN_communist_propaganda_desc: "After the destruction of the Japanese Communist Party's last strongholds in the Home Islands, Taiwan became a critical base of operations for the JCP—one that, despite the war’s end, continued to echo with faint revolutionary whispers. Thus, on the eve of the military-police administration handover in the 1950s, the Governor-General’s Office launched its largest purge in history. In a dramatic climax, Hsieh Hsueh-hung, the elusive communist leader, was dragged from her hideout in the rural fields of Sanzhi and sent to Machangting, where a single gunshot seemed to mark the final victory over the Red Demon in Taiwan.\n\nBut was this truly the end?\n\nScattered across Rong-chō, crude posters extolling Mao Zedong Thought appear in the dead of night. In the coal mines of the northeast, workers now dare to challenge the financial cliques. Meanwhile, in the sugarcane fields of the south, farmers, as if awakened, demand the dissolution of exploitative corporations.\n\nSigns of an unseen red tide ripple through the island—threatening to upend the established order, be it economic, ideological, or political."
 TWN_in_the_core_of_storm: "Amidst Muddy Waters"
 TWN_in_the_core_of_storm_desc: "From the moment it was published, The Orphan of Asia was banned from every bookshelf within the Greater East Asia Co-Prosperity Sphere. Yet, its message could not be silenced—its core ideals spread like whispers through the shadows, reminding the world that even at the heart of the Co-Prosperity Sphere, there existed an island of the forsaken, an orphaned land, impoverished and ignored.\n\nBound by an uncomfortable history, Taiwan had long been a topic neither China nor Japan dared to address. The Republic of China’s consulate in Taipei remained a hollow institution, a mere token of forgotten sovereignty, while Japanese settler villages continued to spread like wildfire, reshaping the land without regard for its people. Time itself had dulled the will of the natives—their identity eroded, their sense of belonging adrift in an endless tide.\n\nWhere does Taiwan’s future lie?\n\nThat answer had long since drowned beneath the currents of the New Order. To unearth it, to defy the fate imposed upon this island, only a challenger—a revolutionary willing to tear away the grotesque mask of this false prosperity—could rise to claim the answer."
 TWN_news.0.t: "[Get_newspaper_header]\"Taiwan Local Governance Act\" Passed"
 TWN_news.0.desc: "The Japanese government recently announced the official passage of the \"Taiwan Local Governance Act\", sparking intense reactions across various sectors on the island. The local Taiwanese population has expressed strong support for the legislation, viewing it as a crucial step toward securing their rights. In contrast, the Japanese expatriate community in Taiwan has voiced deep concerns and strong opposition.\n\nThe act primarily expands the voting rights of local Taiwanese while reducing the proportion of Japanese legislators. Additionally, it guarantees that Taiwan will have representation in the lower house of the National Diet in future elections. Support among the Taiwanese stems from long-standing demands for electoral rights. Many believe this marks the first significant concession by the Japanese authorities regarding their political participation and represents a crucial step toward local self-governance.\n\nHowever, the Japanese expatriates on the island are deeply unsettled by the law’s passage. They fear that it will erode their political influence and diminish their voice in Taiwan's local governance. Some even worry that it may jeopardize the privileged status they have long enjoyed."
 TWN_news.0.a: "Major changes in Taiwan’s local political landscape."
 TWN_news.1.t: "[Get_newspaper_header]Taiwan Government Elections Approaching, Public Concerns Emerge"
 TWN_news.1.desc: "Recently, a faction of Japanese settlers in Taiwan organized a large-scale protest to defend their rights to political participation and secure their livelihoods. They called on the Taiwan Governor-General’s Office to acknowledge their living conditions and reconsider their eligibility for civic participation, ensuring fair representation in local politics.\n\nThe Governor-General’s Office has yet to issue a formal response, but insider sources suggest that officials are currently deliberating on how to address the settlers' demands while minimizing any potential impact on the upcoming elections. Some analysts warn that mishandling this issue could have significant repercussions on the electoral process and political stability in the region."
 TWN_news.1.a: "Can the Silent Hills Speak?"
 TWN_news.2.t: "[Get_newspaper_header]Taiwan Government Refuses to Suppress Protests, Governor Ohashi Resigns"
 TWN_news.2.desc: "In response to the large-scale protests sweeping across Taiwan, the Governor-General’s Office has decided against using forceful suppression. However, this approach has failed to quell the unrest; instead, escalating tensions have led to widespread violent clashes, severely disrupting social order.\n\nAccording to official reports from both Japanese and Taiwanese media, Governor-General Hideo Ohashi has been prematurely dismissed due to the severity of the crisis and has departed for Japan. In his absence, Chief Cabinet Secretary Makoto Okuno has assumed interim leadership, overseeing administrative duties until a new governor is appointed.\n\nIn his official statement, Okuno stressed that the government seeks to resolve the crisis through peaceful means. Analysts suggest that Ohashi’s resignation at such a critical moment carries deeper implications. Whether the incoming governor can stabilize the situation remains uncertain and is a matter of close observation."
 TWN_news.2.a: "A Shroud of Black Mist Descends Upon the Entire Island."
 TWN_news.3.t: "[Get_newspaper_header]Taiwan Government Suppresses Protests, Island-Wide Order Gradually Restored."
 TWN_news.3.desc: "In response to the large-scale protests by second-generation Japanese immigrants, Governor Hideo Ohashi's administration acted decisively, prioritizing electoral stability by forcibly dispersing gatherings. The administration reiterated that the Taiwan Government-General will not tolerate any disruptions to the election process.\n\nWhile the move has stirred resentment among the Japanese expatriate community, the firm stance of the authorities has deterred further demonstrations. Though dissatisfaction simmers beneath the surface, open protests have ceased, and order has gradually returned across the island, with daily life resuming a semblance of normalcy.\n\nAnalysts suggest that while Governor Ohashi’s strong-handed approach has temporarily quelled unrest, it has not resolved the underlying tensions between the Japanese immigrant community and the Taiwanese authorities. The long-term implications of this crackdown remain uncertain."
 TWN_news.3.a: "Time will tell."
 TWN_news.4.t: "[Get_newspaper_header]The Second Taiwan EXPO Set to Open Soon"
 TWN_news.4.desc: "At a specially convened press conference, [TWN.GetLeader], the newly appointed Governor of Taiwan, officially confirmed that the Tokyo National Diet has approved an expanded 1965 budget for the Taiwan Governor-General’s Office. As part of the commemoration of the 70th anniversary of the Taiwan Governor-General’s administration, the Second Taiwan Exposition will be held in October 1965.\n\nAccording to official disclosures regarding the exposition’s plans, Taipei will host an additional venue, building upon the three main venues from the First Taiwan Exposition, though the exact location remains undetermined. Additionally, regional sub-venues and local exhibition halls have been outlined in preliminary planning.\n\nThe exhibition organizers have also revealed a major security collaboration with Guangdong’s high-tech enterprises, incorporating the latest cutting-edge corporate research and technological advancements. Officials have emphasized that security measures themselves will serve as a highlight of the exposition, showcasing the technological brilliance of the Greater East Asia Co-Prosperity Sphere."
 TWN_news.4.a: "\"Let's see just how much real firepower Guangdong has.\""
 TWN_news.5.t: "[Get_newspaper_header]The Second Taiwan EXPO Set to Open Soon"
 TWN_news.5.desc: "\"The new Governor of Taiwan, [TWN.GetLeader], announced at a specially convened press conference that the Tokyo National Diet has approved an additional budget for the Taiwan Governor-General’s Office for the fiscal year 1965. To commemorate the 70th anniversary of the Taiwan Governor-General’s administration, the second Taiwan Exposition will be held in October 1965.\n\nAccording to official disclosures, Taipei will add a new venue on top of the three main sites from the first Expo, though its specific location has yet to be determined. Plans for regional exhibition halls and local pavilions have also been finalized.\n\nFurthermore, the Expo organizers revealed that they would adopt recommendations from Manchuria to ‘reinforce security with the strictest measures and the highest pressure’ in response to the increasing activities of Taiwan’s underground organizations.\""
 TWN_news.5.a: "Does the Taiwan Expo also show horror movies?"
 TWN_news.6.t: "[Get_newspaper_header]Taiwan Expo explosion incident!"
 TWN_news.6.desc: "Recently, Taiwan police repeatedly attempted but failed to uncover and prevent the secret operations of the illegal organization \"Taiwan People's Alliance\", ultimately failing to stop their violent actions during the opening ceremony of the Taiwan Exposition. On the first day of the Expo, Taiwan People's Alliance covertly planted bombs across multiple exhibition halls, resulting in a series of explosions that left the venues in chaos and caused numerous casualties.\n\nMost shockingly, Crown Prince Akihito, who was attending the event, was also injured in the attack. In response, Japanese authorities urgently mobilized air transport to evacuate the Crown Prince back to Japan for medical treatment. His injury has sent shockwaves across political and social circles, with the Japanese government expressing serious concern over the incident.\n\nAmid escalating tensions, the Taiwan Governor-General’s Office convened an emergency response meeting and declared a state of heightened alert across the island. The situation has sparked widespread public discussion, with business associations and civic groups expressing disappointment at the authorities' failure to prevent the attack, questioning the police's intelligence capabilities. Concerns over the security measures at the Expo have also intensified, leaving the Taiwan administration under mounting criticism from all sides."
 TWN_news.6.a: "How incompetent must they be to have missed so many bombs?"
 TWN_news.7.t: "[Get_newspaper_header]Taiwan Expo explosion incident"
 TWN_news.7.desc: "Recently, the Taiwan police intensified their investigations and successfully uncovered the illegal organization \"Taiwan People's Alliance\" (Tai Min Meng) and its plot to plant bombs within the Taiwan Expo venues. In response, they carried out emergency operations to neutralize the threat. Multiple explosive devices were dismantled in time, successfully preventing large-scale casualties.\n\nRegrettably, some bombs were not defused in time and were subsequently detonated on the opening day of the Expo, causing explosions at multiple locations within the exhibition halls, leading to injuries and property damage. Fortunately, the explosive device intended for Crown Prince Akihito was among those successfully dismantled during the police operation, thereby averting a far more severe disaster.\n\nAlthough the Expo site briefly descended into chaos, the fact that the Crown Prince remained unharmed led the Japanese authorities to express understanding toward Taiwan's emergency response, preventing further escalation of tensions. Public reactions within the island have been mixed—some expressed relief, stating that this was a \"blessing in disguise, proving that efforts were not in vain.\" However, others pointed out that some bombs still went off, revealing flaws in police operations, and voiced concerns over ongoing security risks."
 TWN_news.7.a: "The security situation on the island remains unstable."
 TWN_news.8.t: "[Get_newspaper_header]Taiwan Expo was successfully held"
 TWN_news.8.desc: "According to a report from the Taiwan police, the illegal organization \"Taiwan People's Alliance\" attempted to plant bombs at the Taiwan Expo venues in an effort to incite chaos. However, the police successfully uncovered and foiled the plot in advance. After days of emergency disposal efforts, all explosive devices were safely removed, ensuring a secure foundation for the Expo’s grand opening, which proceeded without incident.\n\nIt is reported that through extensive investigation and tracking, the police identified critical traces of Taiwan People's Alliance activities. Acting swiftly on the gathered intelligence, authorities deployed personnel for surveillance and inspection, ultimately dismantling all explosive devices before the Expo commenced, thus preventing a potential catastrophe.\n\nInsider sources have revealed that the police obtained valuable intelligence on underground organizations during the operation. Though the incident was perilous, the timely response by law enforcement successfully stabilized the situation, earning praise and recognition from various sectors of society."
 TWN_news.8.a: "Who knows if we can be so lucky next time?"
