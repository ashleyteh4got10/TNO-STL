 XIN_Sheng_Shicai: "Sheng Shicai"
 XIN_Ma_Chengxiang: "Ma Chengxiang"
 Sheng_Shicai_desc: "In 1919, Sheng Shicai, who had studied in Japan for two years, returned to China and joined the May Fourth Movement. This young man, convinced that studying alone could not save the country, joined the military and went to Guangdong and Japan to further his military training, serving in the Feng army before defecting to Chiang Kai-shek.\nIn 1929, Sheng Shicai took the initiative to come to Xinjiang to train the army for Jin Shuren and gradually became the de facto controller of the Xinjiang army. In the 1933 coup, Jin Shuren fell from favor in Xinjiang politics and fled to the Soviet Union. Sheng Shicai took advantage of the opportunity to fast-track his way into Dihua. In 1934, he defeated Zhang Peiyuan and Ma Zhongying with the power of the Soviet giant, and in 1937, he defeated Ma Hushan, who rose against Sheng and became the real \\"King of Xinjiang.\\" After that, Sheng Shicai called himself a Marxist-Leninist, entered into a \\"honeymoon period\\" with the Soviet Union, and even requested to join the United Communist Party at one time. Xinjiang became a significant communication point between the Chinese Communist Party and the Soviet Union. However, this was just a means for Sheng Shicai to consolidate his rule, as he entered Xinjiang not only with Soviet aid and Marxist-Leninist writings but also with the People's Committee-style spy system borrowed from the Ministry of Internal Affairs. In imitation of Bukharin's purge of dissidents within the UCP, Sheng Shicai arrested and executed tens of thousands of people from all walks of life in Xinjiang. Even key members of the provincial government were imprisoned.\nHowever, life is always unpredictable. When the Soviet Union fell before the armored blitzkrieg of Nazi Germany, Sheng Shicai did not hesitate to tear off the veil of communism and show his butcher's knife to the communists, swearing allegiance to Chiang Kai-shek and the Three People's Principles. However, as the fallen areas continued to expand and large numbers of refugees from the remnants of the army poured into Xinjiang, Sheng Shicai's power began to face challenges once again.\nEverything exploded in 1944, with the grievously wounded Soviet Union still supporting an uprising of left-wing Uyghurs within Altai, in northern Xinjiang. At the same time, Ma Zhongying, who had returned from his studies in the Soviet Union, took advantage of the opportunity to gather his old troops on the southern border to rise and form a Soviet-style regime. More frighteningly, deep in the Taklamakan, the East Turkestan Liberation Movement was revived, and the Han, Hui, and Wei peoples were reduced to slaves of fascism...\nIn 1962, Sheng Shicai, already nearing old age, crouches in the city of Dihua, waiting for his death knell...or his destiny."
 XIN_a_false_king: "A Life Worn Thin"
 XIN_a_false_king_desc: "During his ten years in Xinjiang, Sheng Shicai managed to anger everyone with his erratic and cruel methods. He was hated by the Soviet Union, the Communist Party, the Kuomintang, the locals in Xinjiang, and his own men. To escape his enemies, he had to hide in a secret room in his brother Sheng Shiqi's house, living a life without seeing the light of day.\n\nIn the secret room that Sheng Shiqi had carefully decorated for his brother, there was a calligraphy hanging on the wall. The calligraphy tells the story of Liu Juzhi during the Eastern Jin Dynasty: the war hero who repeatedly betrayed his \"master's family\" for his personal ambitions and lost the trust of everyone. When he decided to betray for the last time, he was immediately abandoned by his own men and committed suicide alone in despair.\n\nIt is said that when Sheng Shicai first entered the secret room, he was so angry and shouted when he saw this text that he ordered someone to take it out and burn it. But the servant said helplessly, \"The Fourth Master forbids us to touch the things in the study, so the Grand Master should talk to the Fourth Master.\""
 XIN_vampire_surnamed_Ma: "A malignant curse that clings like a shadow"
 XIN_vampire_surnamed_Ma_desc: "Sheng Shicai's loyalist forces were nearly wiped out during the Ili Rebellion, leaving him with no choice but to seek assistance from Ma Bufang, the then-ruler of Qinghai. Ma Bufang, while agreeing to help suppress the uprising, secretly harbored ambitions to swallow Xinjiang for himself. However, his ambitions were soon interrupted by the Japanese.\n\nFollowing the established strategy, Ma Jiyuan, who succeeded Ma Bufang, dispatched Ma Bujun to lead the Fifth Cavalry Army into Xinjiang to engage the rebels. Meanwhile, Ma Bujun's son-in-law, Ma Chengxiang, entered Dihua under the guise of a reformist, networking extensively and forging alliances. Although Xinjiang nominally remained under Sheng Shicai’s control, in reality, the Ma family was pulling the strings from behind the scenes. As a result, following Ma Zhongying, Ma Chengxiang became known as the \"Second Ma of Xinjiang.\"\n\nSo, how did Ma Chengxiang's rule differ from Sheng Shicai’s? Unfortunately, while he made many promises of reform, very few were ever realized. The truth is, he and his gang of gun-toting thugs simply moved beyond Gansu to freeload off Xinjiang."
