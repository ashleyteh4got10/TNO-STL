 ROS_Saifuddin_Azizi: "Seypidin Azizi"
 ROS_Saifuddin_Azizi_desc: "Before the age of ten, Seypidin was merely the son of a wealthy merchant on the outskirts of Kashgar. Each morning, he would rise early, kneel in the direction of the mosque, and ceaselessly praise Allah, unaware of any connection between himself and the suffering masses.\n\nAt thirteen, his father suffered a business failure, and the family was suddenly plunged into poverty. Seypidin took up the burden of supporting his household—he worked as a tenant farmer, a street vendor, and eventually a tailor. Four years of hardship forged his courage. When the Kashgar government expanded its army and forcibly requisitioned horses, his village was not spared. Watching as the soldiers barked orders and led away the horse that had once accompanied his father, Seypidin's blood boiled. Under the cover of night, he slipped into the government’s stables, loosened every rein, and set the horses free.\n\nThis act of defiance taught Seypidin the meaning of resistance. His mother, too, began to see her son in a new light. When Uyghur farmers outside Kashgar rose up in rebellion against the provincial governor, Jin Shuren, she tearfully gave her blessing for her son to join the insurgents and march on the county town. \"This was your father’s wish,\" she told him. As Seypidin walked through the victorious streets of Kashgar, he saw the Han Chinese trembling with fear, donning absurdly large sarands, prostrating themselves step by step, and awkwardly muttering Allahu Akbar. He felt little sympathy—only the thrill of victory.\n\nJin Shuren was soon overthrown by his own subordinates, and the surviving rebels were granted amnesty. Seypidin was selected to serve as a secretary in the Kashgar Administrative Office, where he witnessed firsthand how the Soviet Union manipulated Xinjiang at will. Beyond Sheng Shicai and Ma Zhongying, Moscow was still nurturing a \"third force.\" In 1934, Seypidin was sent to study in Uzbekistan, where the vibrant sights of Central Asia opened his eyes—he learned that the Uyghurs were part of the Turkic family, and that the Soviet Communist Party supported the independence of Turkic peoples.\n\nReturning from his studies, Seypidin was eager to launch a revolution, only to be immediately placed under house arrest by Sheng Shicai upon re-entering Xinjiang. He remained imprisoned until 1944, when the Ili Rebellion, led by his cousin Abasov, finally set him free.\n\nThe Ili Rebellion was orchestrated under the directive of the Tyumen Central Committee and executed by Kazakhstan, mobilizing Xinjiang’s Turkic peoples to form a revolutionary alliance against Sheng Shicai’s rule and to \"establish a new state.\" However, the alliance was not a tightly organized party; deep internal divisions existed. Landowners and religious figures openly envisioned an Islamic state, while leftist intellectuals dreamed of a democratic republic.\n\nSoviet advisor Vasily warned Seypidin to beware of the rising influence of religious leaders and feudal lords, urging a timely purge of class enemies. However, Japanese intelligence operatives leaked the plans, inciting beks and wealthy merchants to rally Kazakh militias in rebellion. The insurgents swiftly launched an assault on Ili’s capital. Caught off guard, Abasov hastily organized a defense, but he was outnumbered and ultimately killed by pursuing forces. Under immense Soviet pressure, the remnants of the alliance accepted reorganization. The movement was split along ethnic and regional lines, with the creation of new parties, the integration of scattered rebel forces, and the enforcement of political repression against reactionary elements. Seypidin emerged as Abasov’s successor, leading the army—with the aid of Soviet officers—to prevent the movement from fracturing. In 1947, the CPC mediated to halt Ma Jiyuan’s invasion of northern Xinjiang, granting Seypidin a narrow chance for survival. Yet, when the smiling CPC envoys entered Tacheng, the dream of an independent Uyghuristan was temporarily shelved—or perhaps… not just temporarily. Perhaps it was shelved forever."
 ROS_weakened_trade: "Camel bell"
 ROS_weakened_trade_desc: "The moon hides, and the stars fade. The international trade station on the outskirts of Ili remains silent. The once-thriving Kazakh caravans, which once flowed through ceaselessly, are now few and far between. Occasionally, lone travelers knock on the doors of roadside inns, bringing with them whispers of Kazakhstan’s growing turmoil—whispers that urge Kazakhs within the border to return to their homeland and visit their families.\n\nBut as the Kazakhs depart, stability departs with them. The cessation of trade has created a severe supply shortage, and inflation soars unchecked. The flow of goods between regions has withered, and the countryside roads become deserted at night.\n\nTo divide what little remains, disputes among the brotherly peoples erupt with increasing frequency, often surpassing the capacity of the government to mediate. We need a broader expanse—a greater horizon—to help our people survive these hardships."
 ROS_secret_war: "Invisiable war"
 ROS_secret_war_desc: "After gaining independence, Uyghurstan, like other Central Asian nations, fell under deep intervention by the Soviet Ministry of Internal Affairs. Tajik agents, acting on directives from the Communist International, established a Cheka training program in Ili, grooming intelligence and security personnel. The newly trained Uyghur and Tatar operatives soon traversed the Tianshan Mountains, dealing devastating blows to the tyrant Sheng Shicai.\n\nAmid our conflicts with East Turkestan, we have come to fully appreciate the critical role of political work. Thus, the Party welcomes this arrangement, modeling our own Ministry of Internal Affairs after the Soviet system. We do not shy away from taking firm measures to maintain internal stability and mobilizing even more people to fight for the homeland."
