 HTC_Ma_Zhongying: "Ma Zhongying"
 HTC_MA_Zhongying_desc: "Those who have dealt with Ma Zhongying all share a common impression—he resembled Ma Chao of the Three Kingdoms era: born on the frontier, raised among foreign tribes, possessing unparalleled charisma, and unmatched in battle. In 1927, at the age of seventeen, he took up arms to avenge his father and brothers, plunging the four northwestern provinces into chaos. His forces carried out brutal massacres until Feng Yuxiang mobilized troops, forcing him back to Suzhou (Jiuquan).\n\nIn 1931, Uyghur rebel leaders Khoja Niyaz and Yulbars Khan invited the embittered Ma Zhongying into Xinjiang, offering him the title of Emir of Chinaristan. Tempted by the prospect, Ma led 6,000 Hui cavalry through the passes, unleashing his full strength against Sheng Shicai, the warlord-governor of Xinjiang, in five great battles. Yet each time he neared victory, the Soviets intervened to rescue Sheng. Through his binoculars, he watched as the red-maned horses of his cavalry were crushed beneath the tracks of Soviet tanks, their dying cries piercing his heart like a thousand arrows.\n\n\"You have defeated me, and now I must learn from you.\"\n\nAfter his defeat in Hotan, Ma Zhongying wasted no time in seeking out the Soviet consul in Kashgar, declaring his willingness to travel to the USSR and sever ties with the rebel forces. Following deliberations by the Politburo of the Comintern, Ma Zhongying and his Hui Muslim officers were granted asylum—as pawns in Moscow’s game to restrain Sheng Shicai.\n\nBy 1935, Ma Zhongying and his brother-in-law Ma Hushan found themselves imprisoned in a secluded mansion outside Moscow, under constant watch by the Cheka. Only four Soviet instructors were permitted contact with them. His feudal ambitions of becoming an Emir slowly faded, and the past grew more painful to recall. At last, he could no longer use ignorance as an excuse to reject change.\n\n\"Whatever Sheng Shicai failed to accomplish, I will succeed in. Whatever Sheng Shicai did well, I will surpass him—a thousandfold.\""
 HTC_Ma_Hushan: "Ma Hushan"
 HTC_love_and_hate: "Love and Hate"
 HTC_love_and_hate_desc: "The change in thinking did not mean that Ma Zhongying would be grateful to the Soviet Union; on the contrary, he was extremely disgusted with what the Soviet Union had done to Xinjiang - especially supporting Sheng Shicai. Without the Soviet Union, Xinjiang would not have had to fall apart, and without the Soviet Union, he would not have had to waste his time. Yet he had to pretend, like his arch-enemy Sheng Shicai, to pledge allegiance to socialism (which was partly true) and to the Soviet Union (which was partly false) - without which they would not have received aid in return. Although the breakup of Russia after the Russo-Western War relieved Ma Zhongying of a lot of external pressure, the Soviet advisers who remained in Xinjiang still had a lingering presence, provoking his authority and that of the Xinjiang people, and some militants called for the restoration of the Soviet Union to begin in Xinjiang, which caused Ma Zhongying a lot of headaches.\n\nMa Zhongying was eager to establish contact with the mainland as soon as possible so that the Soviets could serve China in a legitimate manner. But Ma Jiyuan's great nephew in Qinghai still held a grudge against the year when they attacked each other and deliberately cut off the connection with the northwest, adding to his troubles."
 HTC_four_class_system: "Four-class system"
 HTC_four_class_system_desc: "\"In Hotan’s central government, ethnic composition ranked as follows, according to an informal Uyghur Party member report:\n\nHui Muslims from Gansu and Qinghai first, local Hui Muslims second, Han Chinese third, Mongol Hui Muslims fourth, and 'Chantou Hui' (Central Asian Muslims) were not even considered people.\"\n\nThis unwritten hierarchy of four classes was widely mocked by those with insight into its implications. From it stemmed Ma Zhongying’s personal dictatorship—a system where a minority ruled over the majority with absolute power.\n\nWithin the state, the Grand Marshal Ma relied almost exclusively on Muslims, particularly those from his hometown, who occupied the highest rungs of power. Hui Muslims from Yanqi and Changji, who had supported Ma Zhongying’s campaign against Sheng Shicai, secured the second-highest status.\n\nThe Han Chinese, recognized for their administrative skills, were enticed rather than coerced—exempted from religious obligations and permitted to participate in major policy discussions. As for Chahar and Torghut Mongols who had migrated to southern Xinjiang, Ma overthrew their non-Muslim nobles, forcibly converted impoverished nomads to Islam, and installed them as local officials.\n\nFor all other ethnic groups in Xinjiang, however, there was simply no place in this system.\n\nThis regime was inherently unjust, closed-minded, and ultimately unsustainable. The first four classes were minorities in Xinjiang, incapable of filling all government positions. Yet the administration preferred vacancies over hiring locals, obstructing the implementation of revolutionary policies.\n\nThis was not the outcome the Communist Party had envisioned—and it had to be overturned."
 HTC_red_family: "Red Family"
 HTC_red_family_desc: "Ma Zhongying defected from the Ma family, cut ties from his clansmen, and had established his business all alone. Now, at the age of 50, Ma has raised a generation of sons and grandchildren, plus a succession of sons and nephews and their offspring, forming a large family in Hotan. The adult Ma family occupied various key positions in the Xinjiang government and military, while the Ma children were sent to the best schools to be trained as future successors according to their father's expectations.\n\nLed by Ma Zhongying's brother-in-law Ma Hushan, together with other Ma clansmen, the \"General Ma Association\" was formed outside the HPC to fight with the central government in order to do whatever they wanted in the Soviet meetings. Ma Zhongying did not deny this power play of establishing a shadow government. The marshal could strike the enemy mercilessly, but could he strike his own family?\n\nIn the words of Ma Zhongying to his brother Ma Zhongjie, \"We can only go with the flow, we cannot change it.\""
 HTC_XJ_bureau: "Communist Party of China - Xinjiang Bureau"
 HTC_XJ_bureau_desc: "In the late 1920s, Ma Zhongying raised the banner of rebellion against the Kuomintang (KMT). Some Communist Party members, fleeing persecution by the KMT, sought refuge under his command, using \"borrowing water to nurture fish\" as their survival strategy. They leveraged their skills to gain a foothold within the warlord's ranks, gradually expanding revolutionary influence from within.\n\nThanks to severed communication lines, these hidden revolutionaries remained invisible to the Central Committee in northern Shaanxi—no one in Yan’an even knew they existed.\n\nWhen the Second Sino-Japanese War broke out, Chen Tanqiu, Mao Zemin, and others were officially dispatched by Yan’an to serve within Sheng Shicai’s government in Xinjiang. However, it was only in 1942, when Sheng Shicai betrayed the Communist Party and Dihua (Ürümqi) descended into a bloody purge, that figures like Cai Xuecun and Wu Yimin unexpectedly resurfaced on the Party’s radar.\n\nAt last, the long-forgotten Party members in Hotan were able to reunite with the Central Committee, formally reorganizing as the new Xinjiang Bureau."
 CPC_give_attache: "CPC Attaché"