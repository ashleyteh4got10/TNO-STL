 CPC_TRCW.20.t: "Urgent Message from SCB"
 CPC_TRCW.20.d: "The Party Central Committee, the Central Committee, and the Military Commission:\n\nThe message of the Central Committee's determination to fight the war has spread throughout East Asia, and we are now reporting to the Central Committee on the present situation in Guangdong and proposing a plan for the struggle behind the enemy lines.\n\nAs a result of the oil crisis, the situation in Guangdong is deteriorating rapidly: a large number of ordinary workers have lost their jobs and their salaries have plummeted; unemployed vagabonds continue to take to the streets; a large number of factories have been closed down due to the shortage of petroleum and electricity; the plutocrats are struggling to salvage the collapsing economy; and there are constant quarrels and disputes within the Legislative Council.\n\nThe workers and Chinese compatriots developed by the South China Bureau in the Canton Federation of Trade Unions and the CCL are ready to start a riot that will paralyze the whole of Guangdong. We will try our best to undermine the administrative system of the enemy and the hypocrites and to disrupt their administration, to turn Guangdong into a quagmire for the imperialists!\n\nYexiao Luma, South China Bureau\nWei Guoqing, Military Representative in Vietnam"
 CPC_TRCW.20.o: "Accept it."
 CPC_TRCW_GNG_RIOTS_BEGINS: "With the §Vriots in Guangdong§!, we will be able to learn the details of the region through the §Ycomplex intelligence network§! that £CPC_texticon §Gthe South China Bureau§! has laid down in £GFX_GNG_Guangdong_texticon §SGuangdong§! over the past 30 years.\n\n§YNew decisions and national focus will be unlocked§! to control the course of the §VGuangdong riots§!."
 CPC_TRCW.21.t: "The Road Home - Finale"
 CPC_TRCW.21.d: "Yang Yingxi stared at the radio that was making a rustling white noise - it hadn't been like this in the past; in the past, the radio would carry powerful calls, inspiring revolutionary songs and frontline reports - even if bombs occasionally fell on her head, the airwaves still sent the confidence and songs of resistance to Golmud, to Yang Yingxi's ears--\n\nThe people's war of liberation, which had taken so much effort, was only one foot short of the goal, obviously the liberation of China was close at hand, obviously even Chairman Mao had closed his eyes peacefully and handed over the last unfinished business to the successors behind him, but why? Why was it that the motherland could not win against the Japanese invaders even after all the hardships?\n\nShe did not understand, she began to get annoyed, the last time her sister called her she could still hear the front line artillery, but that was a long time ago - she squeezed her head with both hands, pursed her lips, and clutched locks of her hair in the palm of her hand, as if she wanted to rip off her scalp. Outside seems to resound with the sound of screams - the ghosts so quickly into the Gelmu? Yang Yingxi's five insides burned as she stumbled towards a large sandalwood box - a legacy left to her by the old Miao clan - and she rummaged through it to find a very historic revolver - and the last of the bullets.\n\n\"I, Yang Yingxi, won't let you Japanese spoil me in death, I won't let you spoil me in death, I'll die ......\" Her voice trembled, and several times she failed to grasp the revolver, but she finally managed to poke the barrel into her mouth.\n\nThe great fear of death haunted Yang Yingxi's whole body, she desperately breathed, her pupils trembled, and the images in her mind flashed back one by one - finally fixed on the leisurely time twenty-five years ago when she rode a horse and hugged her sister as she traveled through the verdant mountain passes of Dianzhong.\n\nHer mouth was still wide open, letting the blackened muzzle of the gun rest against her upper jaw, but she finally calmed down.\n\n\"Sis, I'm coming.\""
 CPC_TRCW.21.o: "Their story died - along with China."
 CPC_TRCW.22.t: "The Last Elegy"
 CPC_TRCW.22.d: "Ma Zhongying, in his 70s and with a large family, never thought he would have to lead a battle on horseback again. His only forces were a few garrison cavalry brigades, the scattered remains of the People's Liberation Army, and some uneasy militia brigades brought by Seypidin from northern Xinjiang. He faced a formidable enemy - the IJA was massing troops in Golmud and preparing to invade Xinjiang.\n\n\"I massacred people in Gansu and Qinghai when I was young, and my imbecile nephew Ma Jiyuan sabotaged the Front ten years ago. Would China's fate be different if we Ma clan had not committed so many crimes in the Great Northwest? What do you think?\" He asked Seypidin, who was also dressed for war.\n\nSeypidin smiled bitterly, but did not look at Ma Zhongying. He gazed at the sand and the mountains ahead. \"Emperor Shun said, 'If you in the myriad regions commit offenses, these offenses must rest on my person.' Are you comparing yourself to him?\"\n\n\"Don't joke with me,\" Ma Zhongying replied with a dry laugh. \"Ever since I was back, I've been eaten up with guilt over what we did.\"\n\nSeypidin turned his head, \"Then, do you think you've done right by the people of Xinjiang, following the Front all these years?\"\n\n\"I don't know. All I know is, 30 years ago when the country was at war, I ran away to the Soviet Union. I failed to fight the Japanese. A year ago, I wanted to join the battle, but the Party Central Committee told me to stay in Xinjiang and maintain law and order. The Soviet Union, the one that taught me about Marx, is gone. The Central Committee is gone too. The people who protected us, they're all gone. If I keep living like a coward, will I even deserve to be called General Ma anymore?\"\n\nSeypidin said no more, but nodded in agreement. They looked at each other for a long time and smiled with relief.\n\n\"Let's go.\""
 CPC_TRCW.22.o: "So, they drew their sabers,\nand made a final charge towards The New Order."
 CPC_TRCW.23.t: "Secret Letter from Nanjing"
 CPC_TRCW.23.d: "Mao Zedong could no longer smoke, he just sat quietly on his side next to his hospital bed, looking at the ventilation fan in the room, pondering - on the bedside table beside him, there was the ceasefire agreement that [CHI.GetLeader] had secretly delivered to the central government through a special channel.\n\nFootsteps sounded outside the door, and Bo Yibo quickly arrived at his bedside: \"Chairman, are you looking for me?\"\n\nMao Zedong trembled as he picked up the agreement, \"[CHI.GetLeader]'s peace agreement, have you shown it to Liu Shaoqi, what is his opinion?\"\n\nBo Yibo's heart flinched as he realized Chairman Mao's meaning, \"It has been shown to Chairman Liu ......\"\n\nMao Zedong interrupted Bo Yibo's words, \"In fact, there is no need to ask about your attitude, this piece of paper is a complete waste of paper, [CHI.GetLeader] to lose and want to armistice, and want to keep their what North China Autonomous Government ......\"\n\n\"Yes, Chairman Liu means the same thing, and he also says that it's completely foolhardy and unacceptable.\"\n\nSilent for a long time, Mao Zedong spoke: \"I can't write, so I'll just use my mouth here, you and Xiaoping go and do it: get the Party newspaper, People's Daily, Liberation Daily, and these media to write articles exposing how incomprehensible this 'cease-fire agreement' is, and let the whole of China know that the pseudo-government still harbors illusions even when it's dead and dying. We must let the Chinese people know that the pseudo-government is still harboring illusions and still wants to rule the Yellow River with us, and we must expose the internal affairs of the Fascist camp.\" When he said the last four words, Mao increased his tone of voice - but with it came a violent cough.\n\nBo Yibo rushed forward and patted him on the back until Mao's breathing calmed down, and only then did Bo Yibo straighten up."
 CPC_TRCW.23.o: "\"As you wish.\""
 CPC_TRCW.24.t: "A Thorough Exposure of Japanese Imperialism's Ambitions (excerpts)"
 CPC_TRCW.24.d: "...To preserve the Chinese reactionary forces and the Japanese invasion regime in China, the Japanese imperial lackey government declared on the eve of its imminent annihilation by the People's Liberation Army (PLA) that \"it is hoped that stability will be restored as soon as possible in the domestic situation, and that, for the sake of the well-being and safety of all the people, the Kuomintang and the Communist Party should come to the negotiating table to settle political issues peacefully and not put the entire people of East Asia at war for their selfish interests. not to put the people of East Asia at war for their selfish ends.\" This so-called \"peace treaty\" means that the pseudo-government is trying to ask our troops to stop, which makes the whole Chinese people feel ridiculous - because it was the Japanese imperialists who imposed the war of aggression and colonial rule on the Chinese for their militaristic interests.\n\nThe lackeys of the pseudo-government also conspired with the Japanese imperialists to re-establish the infamous blood-stained \"Restoration Autonomous Government\" in North China; at the same time, they deployed a large number of troops in the Northeast and Guangdong, and their fleet openly intruded into Chinese territorial waters and shelled the coastal areas, killing many innocent people. They declared that they would \"fight with the Communist armies of Asia to defend the collective security of the entire Co-Prosperity Sphere\", which did not frighten the Chinese people, but only strengthened their determination to expel the Japanese invaders once and for all.\n\nThe tide of the Chinese revolution is rising in the whole of East Asia, and the question before the Chinese people, the democratic forces, and the people's organizations is whether to carry the revolution to the end or to let it go halfway. If the revolution is to be carried out to the end, it is to be carried out by revolutionary means, to eliminate all reactionary forces in a resolute, thorough, clean, and complete manner, and to persevere unswervingly in defeating imperialism. While the puppet Gao Zongwu bandit gang of the invaders massacred millions of men, women, and children with murderous weapons such as bombers, fighters, artillery, tanks, rocket-propelled grenades, automatic rifles, gasoline bombs, gas bombs, and so on, the Japanese imperialists relied on their plundering of China's territorial rights, rights to territorial waters, rights to airspace, rights to inland waterway navigation, commercial privileges, internal and diplomatic privileges, right up to the killing of people, crushing them to death, and raping them with impunity, as well as the privileges. Should the Chinese people, who have been forced to fight such a long and bloody war, still show dear tenderness to these vicious enemies instead of destroying and expelling them completely? Only when the Chinese reactionaries have been annihilated and the aggressive forces of Japanese imperialism expelled from China can China have independence, democracy, and peace.\n\nThe Chinese People's Liberation Army will continue to advance until the Japanese imperialists have completely withdrawn from the territory of China which they have invaded, until the whole country is liberated, and until the People's War of Liberation is completely won!"
 CPC_TRCW.24.o: "The war continues."
 CPC_TRCW.25.t: "Worries of A Sick Man (1)"
 CPC_TRCW.25.d: "\"...At present the progress of the several major corps on the front is rapid; the North Corps has already captured the main strongholds of Shanxi, the South Corps is marching deeper towards the Yunnan-Guizhou plateau, and the East Corps is penetrating towards Wuhan, and it is believed that it will soon be able to break through the enemy's south-central line of defense, and insert its main force into the heart of Nanking...We met later and decided that some of the leading comrades of the Central Committee and the convalescent old comrades should be evacuated to Hanzhong - what do you mean, Chairman?\" For fear that the chairman would not hear, Deng Xiaoping had to sit on the edge of the bed with a small bench and report in a not-too-loud voice, as if it were the same as always. Meanwhile, Jiang Qing, Liu Lantao, Gao Gang, and others stood guard in the room and waited: this was already the second time he had been critically ill, but fortunately, the Chairman was still gradually recovering from the resuscitation, and he inclined his head aside, his eyes facing out of the window where the trees were verdant, their green leaves swaying gently in the breeze.\n\n\"That's fine, the Military Commission will decide on the matter of the Military Commission - Wuhan and Guangdong should be taken down as soon as possible, and once these two places are taken down, the military industry will be secured. The matter of withdrawing from Hanzhong, I can't walk, I'll have to bother you guys to carry me away.\" He laughed dryly twice and turned his eyes back to the crowd, just a short command, but he still had something to say. His tired eyes were like burnt-out dead wood, sweeping over the four people present one by one, and only after a long time did Mao Zedong decide to reveal some of his heartfelt words that in the past had been like a bone in his body, \"The fact that you are all gathered around like this instead reminds me of the time when I was assisted to see Enlai in the hospital room, and there was not much at the front of his bed at that time but only Deng Yingchao accompanying him. And Mr. Sun Yat-sen, Comrade Hu Zhiming - are the poor people who died before the revolution was successful, and now I'm afraid it's my turn Mao Zedong, I would like to hope that I can survive for another year or two, least to see the founding of a new China...These days the heart also saves some old words, do not say unhappy, since you several are here, are also following the central fight for decades of reliable comrades, then let me this half-dead person before going to see Marx last say a few words.\""
 CPC_TRCW.25.o: "（Next page)"
 CPC_TRCW.26.t: "Worries of A Sick Man (2)"
 CPC_TRCW.26.d: "\"I'm seventy-nine this year, which is eighty whole years according to the imaginary age, and I'm already in my eighties and nineties. I believed in everything when I was young: reformists, liberals, and even anarchy, provincial constitutional autonomy ...... turned my brain into a pot of hodgepodge, but none of them lasted very long until after my first contact with communism, Marxism, and Leninism, and my beliefs have never changed. Why? Because I believe this doctrine is the truth.\"\n\"The word truth is important, so why are we sitting here together today? Because we all believe in the truth that is communism, and we all believe that only by following the path of socialism can we save China. We may have different views on certain issues, including our approaches to certain specific things, but the fundamental goal is the same, we all want to continue this socialist cause.\"\n\"It's not easy to persevere for decades, how many people have grayed their heads, how many people have left, they didn't have to choose this path, but they walked this long march path without any hesitation, for decades, and some of them will never even be able to stand shoulder to shoulder with us again.\"\n\"This Party of ours is plagued with many disasters, from Chen Duxiu and Li Lisan to Zhang Guotao and Wang Ming, several times pulling our Party to the brink of almost extinction; we all struggled with them before we found a road in line with the reality of the Chinese Revolution, and the right road is not in the hands of a few people but in the practice of the people, as long as the Party can respond to them with their heart hearts, what in this world is there for us to fear?\"\n\"The party line, I've said many times, we fight over and over just two issues: one is the revolution, willing to suffer, willing to bleed, leave home and work for the revolution; one is perseverance, no matter to kill this, take that, open and secret struggles, wars and fires, all for the sake of sticking to the revolutionary path. As the old saying goes, there are many good people at the beginning and few good people at the end. How many of you remember why you chose the Communist path in the first place? How many of you can maintain the perseverance that I have mentioned and ensure that this Party will not gradually alienate itself into all sorts of freaks who will ride over the people and do evil? I've wanted to talk to some of you about these questions before, but with a big Japan still hanging in the east waiting to be defeated, it's really not easy to talk about it - and even now I'm still in the dark, and don't have a chance to think about it.\" Looking at the four people present: Jiang Qing's eyebrows were slightly creased with disdain; Liu Lantao's face was expressionless, but his body appeared tense; Gao Gang's head was lowered and his eyebrows were downcast with a mournful look; Deng Xiaoping didn't say a word, but his demeanor was calm and steady. Mao sighed silently, pointed his finger at the four, and uttered the last aphorism left to these successors, \"As for you what to do ......\""
 CPC_TRCW.26.o: "\"I'm afraid only Heaven knows.\""
 CPC_TRCW.27.t: "Width of the time"
 CPC_TRCW.27.d: "Deng Xiaoping, who had stayed behind in Xi'an, hadn't come to see him to report on his work for a long time, much to Mao's chagrin. Since the founding of the Communist Party, he had never missed a major event, and it had always been an experience of which he was proud. But the center of rule had long since left him, and as one of the millions of ordinary old men, perhaps there was no need to report to him on his work now in the first place.\n\nApart from the messenger Xie Jingyi and the doctor, the only people Mao could see from time to time were Bo Yibo and Han Guang, who had been transferred to Hanzhong, and who came regularly to visit the surviving old chairman and to give him papers to read, together with the latest newspapers and magazines. But after a long stay in the Hanzhong air-raid fortifications, Mao had lost all sense of time. The concrete box firmly confined his thoughts, the documents were marked with clear dates, but the impression of sunrise and sunset was already blurred. The voluminous battle reports were more of a broadcast of a basketball game with uncertain winners and losers, sapping his patience and longevity.\n\n\"When I can't see the sun, my brain is going to freeze.\" Mao bemoaned to Xie Jingyi as he knocked on his brain.\n\nIn addition to reporting all outside news to Mao, Xie Jingyi was tasked with liaising separately with Jiang Qing in Xi'an and reporting regularly on Mao's health, a power that even Deng Xiaoping did not possess. After Jiang Qing entered the Politburo, Mao put all his hopes in his good wife to allow this channel to be opened.\n\nThat morning, a morning unknown to Mao, the war report of the liberation of Nanjing was delivered to the air raid shelter. A smile squeezed out of Mao's puffy face since the war began, eighty years of revolutionary life saved only for this one piece of glad tidings, and now he was granted eternal peace - it was as if he had flung himself into a deep coma in the comforting darkness of the Roam. Xie Jingyi sent the telegram that Mao was gravely ill.\n\nBraving the danger of bombing by enemy planes, the special Xi'an train arrived at Hanzhong station, on which stepped down the distraught Jiang Qing. Draped in a red headscarf and wearing a light blue jacket, she ran toward Mao's residence, unable to stop her tears from flowing out."
 CPC_TRCW.27.o: "Will I ever see the sun tomorrow?"
 CPC_TRCW_NANJING_1.t: "End of life"
 CPC_TRCW_NANJING_1.d: "The night in Nanjing was lost in chaos—this included the brightly lit Presidential Palace. The Communist Party had only raised arms less than half a year ago; how could they break through so many defenses and reach the gates of Nanjing so quickly? Had the Communist forces equipped themselves with American Bigfoot off-road vehicles, or were they on some kind of German adrenaline rush?\n\nGao Zongwu's mind was filled with these tangled thoughts as he sat dejectedly at his presidential desk, spinning in circles. His assistant, Zhou Longxiang, burst into the office like a gust of wind. His exhausted face was heavy with concern. \"Mr. Gao, the Communist forces have reached Nanjing. We need to evacuate quickly.\" His short but emotional voice shattered the silence in the room. The president first confirmed the safety of his wife and daughter, and then the two of them hurriedly set off towards the airport.\n\nHowever, their escape did not go smoothly. The air was thick with unease and confusion. They had no idea where to go to ensure their safety. Gao Zongwu’s already chaotic mind was now even more unsettled—less than six months and almost the entire country had fallen. The Japanese would never take in such an incompetent exiled leader. What about the Americans? The Germans?\n\nHesitation leads to defeat. In the cabin, Gao Zongwu, indecisive, finally heard the sound of the People's Liberation Army breaking down the door—he realized there was nowhere left to run. Arrest, imprisonment, trial: everything proceeded smoothly, and even the date of execution had already been set.\n\nHowever, Gao Zongwu still held onto one last hope: he had reached an agreement with Ji Dengkui, the temporary mayor of Nanjing. He would write an autobiography during the two months he awaited execution, one that would reveal all the evil deeds of the traitorous high-ranking officials in the puppet government and the Japanese, to assist the Communists in their subsequent arrests and trials. In exchange, the Communists would guarantee the safety of his wife and daughter, ensuring they could live safely under assumed identities in this land.\n\nThe day of execution was fast approaching, and it would undoubtedly be a public shooting. Gao Zongwu, naturally, felt no attachment, but he would still indulge in some impractical dreams in the two remaining months—what would have happened if he had been the main protagonist of the war against Japan? A grand unfinished task weighing on his heart would soon end in regret… He sighed."
 CPC_TRCW_NANJING_1.o: "Maybe, in the afterlife, I could be a hero too."
 CPC_TRCW_NANJING_2.t: "Los Angeles Tour"
 CPC_TRCW_NANJING_2.d: "President Gao Zongwu was packing up the last of his personal belongings in his office when he picked up a pile of Indonesian passports with different avatars hidden in the deepest part of the layers of documents, crying and laughing. At this time he was secretly happy: fortunately, the communists and the United States exchange was not too deep, still had the United States to go, if it was to stay in East Asia, the Japanese would not let go of him.\n\nSoon he took his family to the plane that had been waiting for a long time, Gao Zongwu looked around and did not find any strange movement, he quietly with the crowd on the plane, in the uneasiness of the passengers to talk about the future of the place to go. Yes, this is not his special plane, it is just one of the thousands of flight planes in Nanking. The airplane was like a repressed beast waiting for the moment to regain its freedom and might. With a roar of the engine, the plane took off after a short glide and quickly disappeared into the morning mist.\n\nUpon landing in Shanghai, Gao Zongwu and his group immediately disguised themselves as ordinary citizens and cautiously blended into the crowd. They took off their carefully sewn Zhongshan suits and replaced them with greasy suits, wearing worn-out bowler hats on their heads, just like everyone else in that city-original Shanghai white-collar workers.\n\n\"Get up for me, with such unsteady hands and feet, if you want to leave, get out!\" Yelling from behind him, he just wanted to talk back, but immediately remembered that he was now just a \"Shanghai white-collar\" - so he did not pay attention, just walked forward.\n\nI do not know how many days and nights, the ship finally arrived at the west coast, Gao Zongwu took out the long-prepared Indonesian passport, they would start a new life as Indonesian Chinese - it is not true to say that there is no attachment, he will still be under the torch of freedom to do some impractical dreams - -What if the protagonist of the war against Japan was himself? A large pile of unfinished business hidden in his heart would be depressing to end...but he finally sighed."
 CPC_TRCW_NANJING_2.o: "Maybe, in the afterlife, I could be a hero too."
 CPC_TRCW.328.t: "Unfamiliar Words"
 CPC_TRCW.328.d: "The war-torn streets outside and the cold factory are two worlds. Even without the foreman's urging, the workers consciously stand in front of the assembly line and start the day's work neatly, the order running naturally under muscle memory. That was what Lao Gao was about to do, as always, joining as a cog in this sophisticated human machine: in the morning, work, and the sound of gunfire became sporadic; at midday, work, and the streets became silent; in the afternoon, work, and the footsteps of the military lords returned to the streets, though both the frequency and the neatness were different from the usual, but these bleary-eyed workers didn't notice-- or didn't care about the difference. -or rather did not care for the difference either. Though the foreman had been missing all day, the hard indicators would not follow, and there was no room for distraction among the workers.\n\nFinally, at night, it was time to work, but Lao Gao's body was crowded in the military surrounded by hard pushed out of the factory, he did not know what to do, the foreman would come back tomorrow, if they scolded them for delaying the production can not be good - he only hoped that the foreman came back to blame the delay on the head of the military, or the military side of the fast things, so that he and his colleagues back to their jobs, so that he and his colleagues can be done quickly. He only hoped that the foreman would come back and blame him for the delay, or that he would get things done quickly so that he and his colleagues could get back to work and catch up with the end-of-month targets.\n\nThe military masters told Lao Gao to sit down in the compound, and a dressed officer stood in front of the crowd, said a few words in his hard accent, and then instructed everyone to disperse and leave.\n\nLao Gao was too lazy to understand his strange southern accent, so as he returned to the workshop with the crowd, he was completely confused about the current situation - and had to be the one to ask Lao Li.\n\nOld Li said, summed up in three sentences - the foreman will not come back, the army will come into the factory to help work, there is a break in the daytime.\n\nLao Gao was a little surprised and began to regret not listening carefully to the officer's speech, but this emotion soon be in the busy faded away.\n\nTo say that the officer's speech Lao Gao did not listen to a word, in fact, not quite. There was an out-of-the-way word with a common pronunciation that he had mindlessly memorized, and this word was preceded by an unfamiliar and familiar name. Although he had never come across the word before, once he remembered why the name sounded familiar, he immediately figured out the latter's meaning. Unfortunately, the production machine was still running as usual, and his rare independent thoughts had come to an end along with the cold assembly line, naturally slipping into numbness driven by habit."
 CPC_TRCW.328.o: "Changchun... Liberated..."
