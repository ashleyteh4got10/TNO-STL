 CPC_TRCW_lin_coup_effect_tt: "Thus was §xChina§! §ximmortalized§! under the caring guidance of §LComrade Lin Biao§!, bringing the §xdream of liberation§! to its §Lfull conclusion§!...\n§MThank you for partaking in the content of the £CPC_texticon §Sliberators of China§!, and may you have enjoyed it just as much as we did creating it.§!"
 CPC_TRCW_China_collapse_effect_tt: "Thus was the motherland §eDismantled For Good§!, §Vshattering§! the §xdream of liberation§! completely.\nAlas, you have §Rfailed§!. §MThank you for partaking in the content of the £CPC_texticon §Sliberators of China§!, and may you have enjoyed it just as much as we did creating it.§!\n\nWe deeply wish for §CYour§! remedy to §eCease Another Pitiful Replay§!. May We Reunion whereever of §jNo Darkness§!."
 CPC_Lin_TRCW_FINAL: "§LAutumn§! in Xi'an"
 CPC_Lin_TRCW_FINAL_desc: "It was said. \"Failing to rectify a wrongdoing is another.\"\n\nThe Central Committee has committed time and again grief misdeed with the modern revisionist rightists and the opporturnitist left leaners at its helm regarding the strategic thesis. Were it not Comrade Lin Biao's decisiveness, the Revolution may have been doomed."
 CPC_Lin_TRCW_I_dominate: "The §LTai ' Ah§! At Behest"
 CPC_Lin_TRCW_I_dominate_desc: "Comrade Lin Biao has unswervingly upheld the grand banners of Mao Zedong Thought, pursuing and defending His revolutionary line of the Proletariat. Comrade Lin Biao shall be hailed as His Companion and thus His Heir."
 CPC_Lin_TRCW_Revolution_Court: "Tribunals FOR §LRevolution§!"
 CPC_Lin_TRCW_Revolution_Court_desc: "The enemy will not eliminate itself. Neither the reactionaries in China nor the imperialist forces of Japan invading China will voluntarily exit the stage of history.\n\nTherefore, it is necessary for us to put their crimes on trial."
 CPC_Lin_TRCW_committee: "Committee of §LMilitary Rulership§!"
 CPC_Lin_TRCW_committee_desc: "The People's Army originates from the people, protects the people, and reflects the collective will of the masses.\n\nOnly by establishing a Military-Political Committee can the Party make decisions that align with the people's interests and follow the course of historical progress."
 CPC_Lin_TRCW_FUCK_THOSE_MANCHURIAN_AND_KANTONESE: "§LPurging the \"Man-Guang\"§!(Manchukuo and Canton) Remnants"
 CPC_Lin_TRCW_FUCK_THOSE_MANCHURIAN_AND_KANTONESE_desc: "Japanese expatriates, invaders in civilian clothing; Zhujin, shameless opportunists who betray for profit; Manchurians, accomplices to the division of China.\n\nEliminating these remnants is not only the expectation of the people but also a necessary step for the revolutionary cause."
 CPC_Lin_TRCW_FUCK_THOSE_JAPANESE: "Down with §LJapanese Imperialism§!"
 CPC_Lin_TRCW_FUCK_THOSE_JAPANESE_desc: "Japan, the root of East Asia's evils, a shameless entity driven by insatiable greed, and a petty opportunist seeking to abandon Asia and join Europe.\n\nThe Communist Party of China is determined to overthrow imperialism led by Japan, to defeat reactionaries across nations, and to strive together to abolish systems of human exploitation within East Asia, ultimately achieving liberation for the entire region."
 CPC_Lin_TRCW_FUCK_THOSE_TRAITORS: "§LHunt for the Traitors§!"
 CPC_Lin_TRCW_FUCK_THOSE_TRAITORS_desc: "Traitors, accomplices to the invaders, committing countless atrocities with crimes too numerous to record. The enemy hides right under our noses. For the sake of the great revolutionary cause, we would rather err by eliminating a thousand than let a single one escape."
 CPC_Lin_TRCW_FUCK_THOSE_ENEMIES: "§LJudgement for War Criminals§!"
 CPC_Lin_TRCW_FUCK_THOSE_ENEMIES_desc: "War criminals, representatives of reactionary factions, and enemies of the people. For counter-revolutionary war criminals, there can be no leniency—only execution, with no room for personal considerations. Only by thoroughly prosecuting the war criminals responsible for atrocities can we completely eradicate the lingering roots of Japanese imperialism within our nation!"
 BACK_TO_ETERNAL: "§LEternal§! §xRevolution§!"
 BACK_TO_ETERNAL_desc: "The Revolutionary Path of China is penetrated with Classes, Class Contradictions and Class Struggles. The Struggle of Socialism with Capitalist-Roaders persists, the danger of Capitalist Restauration lingers, the Threats of Imperialist and Modern Revisionist Overturn and Invasion haunts. These Contradictions are solved by none other than Persisted Revolution and Praxis. \n\nAll of the Party, the PLA, and the People of all ethnics of China shall willingly align themselves with the Party Central Committee with Comrade Lin Biao at its Core, and march forward with the Banner of Mao Zedong Flying High Evermore."
 CPC_TRCW_phase_3_medium_2: "Leave Behind the \"Man-Guang\" Issue"
 CPC_TRCW_phase_3_medium_2_desc: "The settler groups in Manchuria, the \"Zhujin\" and \"Japanese expatriates\" in Guangdong—these remnants of the colonial era continue to linger.\n\nAlthough addressing them may negatively impact the economy, the liberated people of China will never shy away from resolving these toxic legacies for fear of temporary difficulties."
 CPC_TRCW_Border_Strategy: "Border Strategy"
 CPC_TRCW_Border_Strategy_desc: "The Liberation War has reached a temporary conclusion, but Japanese imperialism remains unrepentant.\n\nTo achieve the complete liberation of China and the entire East Asian people, the central government has decided to draft a border strategy targeting the weak points of Japan's colonial system."
 CPC_TRCW_Border_Taiwan: "Taiwan"
 CPC_TRCW_Border_Taiwan_desc: "Taiwan, the unsinkable aircraft carrier, the key to the First Island Chain, and a testing ground for colonial rule.\n\nThe People's Army stands ready, and the people of Taiwan eagerly await liberation. We must plant the flag of victory on Taiwan."
 CPC_TRCW_Border_Chosen: "Korea"
 CPC_TRCW_Border_Chosen_desc: "Korea, once a vibrant land under the sun, now the \"prize\" of forced annexation and the testing ground for colonial indoctrination.\n\nThe People's Army is sharpening its swords, and the Korean people are rising in resistance. We must ensure the voice of freedom echoes across the Yalu River."
 CPC_10th_congress_preparation: "Prepare for the Tenth Congress"
 CPC_10th_congress_preparation_desc: "The Liberation War has already been won, but the great task of liberation has only just begun. How to restore and develop the national economy, consolidate the newly established people's government, complete the socialist revolution, establish the fundamental system of socialism, and advance socialist construction—these pressing questions still await our answers.\n\nAt this critical juncture, the Central Committee is preparing to convene the Tenth National Congress to discuss several post-foundation issues."
 CPC_Central_People_Government_reform: "Central People's Government Reforms"
 CPC_Central_People_Government_reform_desc: "With the establishment of the new China, the original Central People's Government should undergo reorganization to complete the transition from a national defense government to a people's democratic dictatorship government, laying the foundation for a new future for the Chinese people."
 THE_EAST_IS_RED: "§xThe East is Red§!"
 THE_EAST_IS_RED_desc: "§xThe Communist Party§!, like the §Ysun§!, is bright wherever it shines\nWherever the §xCommunist Party§! is, hurrah!, §Sthe people§! are liberated\n\n- Lyrics of \"The East is Red,\" 1944"
 CPC_force_to_go_through_the_Yellow_river_tt: "With all §YPrerequisites§! of §GThis Focus§! Complete, and the Time is §YLate 197§!0, the CMC shall autonomously embark on §YFurther Operations§! §RWithout Player Involvement§!."
 CPC_FUCK_JAPANESE_trait: "The Tai'Ah Penetrates the Tai-Yo"
 CPC_TRCW_Border_Strategy_tt: "The £TER_texticon_PLA §YPeople's Liberation Army of China§!'s §Smission§! remains unfulfilled, as the £GNG_japanese_frustration_texticon §jJapanese imperialists§! continue to occupy our nation's §YTaiwan§! region and station troops south of the §YYalu River§! ceasefire line, persistently training and preparing for war.\n\nThe £TER_texticon_PLA §YPLA§! must undertake §Gcomprehensive reforms§! aimed at addressing §mmodernization§! challenges, so it can shoulder the sacred mission of §Gliberating Taiwan, liberating Korea§!, §Sliberating all of East Asia§!, and even §Cliberating all of humanity§! in the future!"
 CPC_TRCW_begins_flag: "The §xfinal battle§! that will determine the §Rfuture and fate§! of the National Revolution has begun."
 CPC_TRCW.28.t: "Frog on Yangtze River"
 CPC_TRCW.28.d: "\"Is this really the Yangtze River? Why does it look so murky? It’s nowhere near as blue as Qinghai Lake was when we passed it fighting Ma’s army,\" said Wu Xiaochuan, a scout from the reconnaissance company. Carrying his Type 67 rifle, he straightened his back and squinted forward, straining to take in more of the scene. Growing up, he'd often heard adults describe the Yangtze as China's second-largest river system, magnificent and picturesque. Yet his first impression of the river was one of muddiness and oppressiveness. \n\nA dense fog blanketed the gray surface of the river, layer upon layer, like countless ropes twisting and winding. The fading light of the setting sun pierced through the mist, casting an angled glow on the river’s mouth, long used as an industrial wastewater dumping ground. The polluted waters shimmered with oil slicks and floating debris, creating a strangely suffocating sense of vitality.\n\nFarther east lay the churning sea, from where Japanese invaders had once sailed their warships, arrogantly pushing up the Yangtze to display their power.\n\nSince the liberation of Nanjing, the People's Liberation Army had remained on high alert for any military activity from Japan in the Yangtze River basin, which explained the reconnaissance company’s current mission: to scout for any suspicious movements by Japanese forces along the eastern stretch of the Yangtze.\n\n\"It’s all thanks to those high-ranking traitors and their so-called modernization efforts,\" muttered Yang Xiushan, a fellow scout with a keen interest in current affairs. \"Not only have they ruined the lives of ordinary people, but they’ve polluted the lands our ancestors left us.\" His words cut through the cold river breeze, answering the question Wu hadn’t even asked aloud."
 CPC_TRCW.28.o: "\"Report to the Nanjing Frontline Committee immediately!\""
 CPC_TRCW.29.t: "The river fog dissipated"
 CPC_TRCW.29.d: "\"Imperial Japanese Navy, exercising legal navigation rights in the Yangtze River Basin\" (signal flag)\nIn the Yangtze near Nanjing, the massive steel leviathan—the Japanese cruiser *Kirishima*—steadily cruised at a slow speed in the center of the river. Captain Suzuki lowered his binoculars, his thoughts uneasy. Should he obey orders to proceed further into the Yangtze and, under the guise of protecting expatriates, reenact the infamous shelling of Nanjing? Meanwhile, PLA artillerymen on the shore were equally tense. The enormous ship, though appearing small from a distance, was a formidable threat. To minimize errors, all positions along the river had been moved as close as possible to the banks—right into the enemy’s cannon range. Regardless, the towering beast flying the Rising Sun flag began to accelerate.\n\"The Yangtze River is Chinese territorial waters. Your warship must leave immediately, or your safety cannot be guaranteed.\" (signal flag)\nGunner Zhang Wei observed as heavy artillery beyond the ship's cannon range began firing warning shots around the vessel. These shots were both a warning to the intruders that the Yangtze was no longer their domain and a signal to scattered artillery groups along the river to prepare for combat. Yet the warnings had little effect. The enemy's ship guns turned, elevated, and responded with explosions in unoccupied areas. Emboldened by the lack of direct hits, the cruiser grew more aggressive.\n\"All cannons, prepare! Target the Japanese ship!\"\nThe sentinel relayed coordinates to the calculator, who quickly translated them into angles for the crew. Rusty elevation wheels spun rapidly, shells and charges were loaded into the cannons, and the sharp crack of explosions, followed by a faint ringing in the ears, echoed across the river.\n\"Did we hit it?\"  \n\"No, just two shells hit! Our lead was too far. Adjust again!\"  \nZhang Wei recalibrated the gun sights back onto the target. However, the flashes from their earlier shots had exposed several positions. The enemy ship retaliated, destroying one artillery position, but one of the ship's own cannons was also damaged in the exchange.\n\"Direction left zero-zero-one, elevation plus five.\"  \n\"Adjust the parameters! Charge number three! Single shell—fire!\"\nNew artillery positions braved the enemy ship's bombardment and joined the attack. Shells brought down the observation tower atop the ship's command bridge, and flames quickly spread to the interior. Thick smoke billowed out from the midsection. Meanwhile, hidden artillery from the opposite bank joined in, launching rapid salvos. One shell struck the rear gun of the ship, triggering a massive explosion. The crippled vessel ceased maneuvering and drifted inertly toward a shallow grounding area, its momentum carrying it like a target into a trap."
 CPC_TRCW.29.o: "Where Towering Tiger and Wreathing Tiger Residing, Rises the New out of Old.\n Before the Heaven Quaking and Earth Upheaving, Heroically I Chant An Ode."
 CPC_TRCW.30.t: "The Road Home - Finale"
 CPC_TRCW.30.d: "Yang Yingxi stared intently at the crackling static of the radio—it never used to sound like this. It used to carry powerful calls to action, stirring revolutionary songs, and front-line war reports. Even when bombs occasionally fell overhead, the airwaves still delivered messages of confidence and triumph to Golmud, reaching her ears and filling her heart with hope.\n\nBut the hard-fought People's Liberation War had ultimately failed in its mission: the frontlines collapsed, casualties mounted, and despite a decade of tempered resilience in the base areas and the assembly of a million-strong elite People's Liberation Army on the front lines, they had still lost. Why? Why, after enduring so much, could her homeland not even defeat a single lapdog of the Japanese invaders?\n\nShe didn’t understand. Her frustration mounted. The last time her sister called, she could still hear the artillery of the front lines in the background, but that had been so long ago. Now, her hands clutched her head, her lips pressed tightly together, and her fingers grasped at tufts of her hair as though trying to tear away her own scalp. Outside, it seemed like the sound of screams echoed—had the Kuomintang’s lackey traitors already reached Golmud? Her heart burned with panic as she stumbled toward a large mahogany chest—a relic left to her by her elder from the Miao people. She rummaged through it, pulling out an aged revolver, along with its last remaining bullet.\n\n“I, Yang Yingxi, will never let you defile me. I’d rather die than let you defile me. I’d rather die…” Her voice trembled, and she fumbled with the revolver multiple times before finally managing to press its barrel into her mouth.\n\nThe overwhelming fear of death enveloped her entirely. She gasped for breath, her pupils quivering, as flashes of memory played across her mind—finally freezing on a moment twenty-five years ago. She was on horseback, cradling her sister as they made their way along the verdant mountain paths of central Yunnan, the sun warm and the world at peace.\n\nHer mouth remained open, the cold, dark barrel of the revolver pressed against her palate. Yet, for the first time in what felt like forever, she found calm.\n\n“Sis, I’m coming.”"
 CPC_TRCW.30.o: "Their story died - along with Dream of Librerating China."
 CPC_TRCW_TAIYUAN_1.t: "Overcome challenges"
 CPC_TRCW_TAIYUAN_1.d: "The fortifications in front of Taiyuan City stood layer upon layer, with the enemy hidden in concealed positions, constantly ambushing the People's Liberation Army soldiers tasked with breaking through. Battalion Political Commissar Lei Feng walked through the trenches, comforting the soldiers who had retreated to rest after failing to breach the defenses. The soldiers' eyes showed deep exhaustion—multiple assaults had already cost them more than half their numbers, leaving them physically and mentally drained. \n\nUsing a periscope, Lei Feng observed outside the trench and noticed a flash of fire occasionally spitting from a dark opening about a hundred meters away. \"It must be a pillbox,\" Lei thought.\n\nLooking at the scattered bodies of the fallen vanguard, Lei Feng’s heart burned with urgency. \"Comrades are falling one by one—how can I, as commissar, stand idly by?\" Gathering the remaining troops, he sketched the situation on a map and said, \"At two o’clock, there’s a machine gun pillbox. If we don’t take it out, more comrades will die on the path forward.\" He ordered the combat teams to assess their remaining supplies of rocket launchers and mortar shells, deciding to employ a feint to destroy the pillbox.\n\n\"Commissar Lei, we only have two mortar shells and one rocket!\" reported the Company Commander of the 3rd Company after taking stock. \n\n\"Only that much left?\" Lei Feng gritted his teeth. \"2nd and 3rd Companies, use suppressing fire against the pillbox. 1st Company and I will close in with the rocket launcher and take the shot ourselves!\"\n\nAfter finalizing the plan, 2nd and 3rd Companies split into two groups, suppressing the pillbox's firing ports with concentrated fire. Two mortar shells fell around the pillbox, scattering shrapnel and creating shockwaves that disrupted the enemy’s aim, giving 1st Company the critical window to act."
 CPC_TRCW_TAIYUAN_1.o: "The pillbox has been destroyed—let's press forward!"
 CPC_TRCW_TAIYUAN_2.t: "Fire on my position"
 CPC_TRCW_TAIYUAN_2.d: "The fortifications in front of Taiyuan City loomed layer upon layer, with the enemy hiding in concealed positions and relentlessly ambushing the People's Liberation Army soldiers tasked with breaking through. Battalion Political Commissar Lei Feng walked through the trenches, comforting soldiers who had retreated for rest after unsuccessful assaults. Exhaustion was evident in their eyes—multiple attempts at breaking through had left their unit with more than half their numbers lost, and their spirits drained.\n\nUsing a periscope, Lei Feng scanned the battlefield outside the trench. In a dark area about a hundred meters away, he spotted a flash of fire intermittently spitting out. \"It must be a pillbox,\" Lei concluded.\n\nLooking at the scattered bodies of the vanguard soldiers, Lei Feng felt an overwhelming urgency. \"Comrades are falling one after another—how can I, as commissar, stand by and do nothing?\" He gathered the remaining troops, laid out the situation on a map, and said, \"At two o'clock, there's a machine gun pillbox. If we don't destroy it, more comrades will lose their lives trying to move forward.\" He instructed the soldiers to check how many rockets and mortar rounds remained, deciding on a strategy to use a feint and destroy the pillbox.\n\n\"Commissar Lei, we only have two mortar rounds and one rocket left!\" reported the 3rd Company Commander after checking the ammunition. \n\n\"Just that?\" Lei Feng gritted his teeth. \"2nd and 3rd Companies, suppress the pillbox with all remaining firepower. 1st Company, follow me—we'll close in with the rocket and take it out!\"\n\nWith the plan set, 2nd and 3rd Companies divided into two groups, directing suppressive fire at the pillbox's firing port. However, rifles proved inadequate against the enemy's machine gun, and the advancing soldiers fell one after another, their bodies strewn in pools of blood. By the time the survivors reached a crater only 20 meters from the pillbox, only seven or eight men remained."
 CPC_TRCW_TAIYUAN_2.o: "\"Comrades, for the New China, fire on my position!\""
 CPC_TRCW_TAIYUAN_3.t: "Prisoner and Soldier"
 CPC_TRCW_TAIYUAN_3.d: "Under the moonlight, a hunched, small shadow wandered through the wheat field. The diminutive figure parted stalk after stalk of wheat, momentarily believing that the endless brown sea undulating in the wind stretched on forever, and that he was a drowning sailor lost within it.  \n\nAbout five hours earlier, Zhang Zhiyin’s unit had been ambushed during the night. About three and a half hours earlier, while covering the main force's retreat, he realized he had been separated from his squad. Soon after, he discovered that his gun and canteen were gone, leaving only a broken strap on his shoulder. Since then, he had been retracing his steps, searching for his weapon.  \n\nZhang Zhiyin wasn’t stupid; it was just that by the time he realized he could have abandoned his gun and fled, it was already too late. Running away unarmed was far too risky. But if he could find a weapon, maybe—just maybe—he’d have a fighting chance (if his luck held).  \n\n\"Zhang! Run! The black dogs are catching up!\"  \n\nBlack dogs?  \n\nZhang was puzzled. Weren’t his comrades supposed to shout “communist dogs (共匪)”? Was his memory playing tricks on him? But why did the phrase feel so natural? The coarse voice was vividly clear.  \n\n\"Stop picking up that shit! Move!\"  \n\nNo, it wasn’t today. It was five years ago, under a night sky much like this one. That night, he had also sprinted nervously through a wheat field, just as he was now. That night, he too had been hunted. That night, he had also gambled everything searching for something.  \n\nThe difference was that today, he was free—and alone.  \n\nTo give his son a chance to hold his head high, he had chosen to turn over a new leaf and enlist. But why was he now running through a wheat field like a fugitive, just as he had when he broke out of prison? Why, as a soldier, was he still so miserable? Was this divine punishment for escaping his past, forcing him to pay the price? Or was it divine revelation, pointing him toward the right path?  \n\nThat night, he had abandoned a sack of silver coins in exchange for freedom. Perhaps tonight, he should heed heaven's advice again, let go of the broken gun, and run once more toward freedom.  \n\nWhen Zhang raised his head again, he saw a massive black wall rising on the eastern horizon, marching like a shadow across the golden land under the first light of dawn.  \n\nHis gun, bound with two layers of bandages, was already back in his hands. The image of a fearless man, ready to die a hero and bring honor to his family, naturally formed in his mind. Yet, before his resolve could harden into action, his legs had already carried him in the opposite direction, sprinting madly.  \n\nThe nagging wife and the disappointing son he had once scorned now seemed incomparably precious."
 CPC_TRCW_TAIYUAN_3.o: "\"Report, Commander! The enemy has completely withdrawn from Taiyuan!\""
 CPC_TRCW_JINZHOU_1.t: "The invincible iron force"
 CPC_TRCW_JINZHOU_1.d: "After formally declaring war on the new China, the Japanese forces faced relentless advances from Lei Feng’s armored combined division, which had already conquered Shanhaiguan and Xingcheng, driving their forces to the gates of Jinzhou—a fortress city that Japan had fortified since the Mukden Incident.\n\nOutside Jinzhou, Manchukuo forces and the Japanese Army had entrenched themselves, fully prepared for a decisive defense. Armored vehicles, tanks, and anti-tank weapons took turns in a deadly exchange, continuously destroying each other’s war machines. As the youngest officer in the division’s command staff, Lei Feng meticulously studied the strategy for taking Jinzhou. Standing up, he pointed to the lines of defense marked on the map and said, \"We can’t afford to drag this out any longer. Delays only invite complications. We must break through the enemy's defenses in one decisive push! First, have the artillery clear out enemy high points and roadblocks. Then, send the tank regiment and mechanized infantry regiment for a direct assault, breaking through the weakest points in their defenses. Once we breach the city, strike at their command center—head straight for the City Hall. At the same time, deploy other infantry regiments to eliminate enemy fire points on the streets and in buildings, shrinking their space for maneuver. Coordinate with friendly forces to surround the city, leaving a single escape route to give the enemy a false sense of hope. Once they retreat, annihilate them outside the city. Above all, ensure the safety of civilians and public property. We must return an intact Jinzhou to the people!\"\n\nAt dawn, the Japanese defenders, tense and fatigued, watched nervously for signs of PLA movements. Suddenly, a thunderous barrage of artillery fire erupted, with precisely calculated shells hitting key defensive positions. Moments later, tanks bearing the Eight-One emblem emerged from the morning mist, one after another, their machine guns unleashing fiery tongues that tore through the enemy ranks. Armored personnel carriers followed closely behind, delivering waves of mechanized infantry into the heart of the city.\n\nIn the command bunker, Lei Feng crouched with his staff under dim lighting, their maps spread out before them. Colored pencils traced routes and objectives as Lei Feng held one hand to his headset and used the other to mark critical positions. The continuous explosions outside shook the bunker, leaving everyone dizzy. \"The enemy has located our command post,\" Lei Feng realized. Almost simultaneously, reports of enemy artillery positions arrived. Without hesitation, he switched frequencies, calling for counter-artillery fire.\n\nA series of heavy explosions followed, shaking the ground one last time before subsiding. The tremors outside the bunker ceased, and the staff exhaled in collective relief. However, Lei Feng didn’t pause to celebrate. With his headset still on, he confirmed updates from the front lines.\n\n“Beep—beep—” The radio transmitted a faint signal. Lei Feng’s eyes narrowed as he listened closely. \"Repeat, confirm information!\"\n\nHis eyes lit up as he processed the message. Grabbing a pencil, he decisively marked a red X over Jinzhou City Hall on the map. Straightening up, he turned to his comrades and announced:\n\n\"Comrades, the City Hall has been taken! Jinzhou is ours!\"\n\nCheers erupted in the bunker, a mix of joy and exhaustion. But Lei Feng quickly shifted focus back to coordinating mop-up operations to clear out remaining resistance and secure the city for its residents.\n\nThe morning fog lifted, revealing a liberated city. Tanks adorned with the August 1st emblem rolled steadily through Jinzhou's streets, crushing remnants of enemy fortifications. What was once thought to be an impregnable fortress had fallen, marking a significant victory for the PLA and delivering a devastating blow to Japan’s foothold in the Northeast."
 CPC_TRCW_JINZHOU_1.o: "\"Comrades, Jinzhou has been liberated!\""
 CPC_TRCW_JINZHOU_2.t: "Call of duty"
 CPC_TRCW_JINZHOU_2.d: "After Japan formally declared war on the new China, Lei Feng’s armored combined division swiftly conquered Shanhaiguan and Xingcheng, advancing directly to the gates of Jinzhou—a fortress city that Japan had fortified since the Mukden Incident.\n\nOutside Jinzhou, the Manchukuo army and Japanese forces had already entrenched themselves, ready to defend to the last. Armored vehicles, tanks, and anti-tank weapons clashed in a relentless duel, with both sides losing war machines one after another. As the youngest officer in the division’s staff, Lei Feng meticulously studied how to break through Jinzhou’s defenses. Standing up, he pointed at the various defense lines marked on the map and declared, \"We can’t afford to delay any longer—prolonging this battle will only make things worse. We must strike decisively and tear through the enemy's defenses in one push! First, have the artillery clear enemy high points and road obstacles. Then, send the tank regiment and mechanized infantry regiment for a frontal assault, breaking through the weakest section of their defenses. Once inside the city, target the enemy command—head straight for the City Hall. Meanwhile, other infantry regiments will clear enemy fire points in the streets and buildings, compressing their space to maneuver. Coordinate with friendly forces to surround the city while leaving one escape route to give the enemy a false sense of hope. Allow them to abandon the city and retreat, only to annihilate them outside. Throughout the operation, ensure the safety of civilians and public property so that we can return a fully intact Jinzhou to its people!\"\n\nAt dawn, the Japanese defenders, tense and exhausted, anxiously observed PLA movements. Suddenly, a thunderous artillery barrage erupted, pounding their defensive positions. As the shelling subsided, tanks bearing the August 1st emblem emerged from the morning fog, rolling forward relentlessly. Though the surviving Japanese forces managed to destroy a few tanks, their efforts were futile. Machine guns unleashed devastating bursts, tearing through their ranks. Following closely behind, armored personnel carriers crushed enemy bodies as they transported waves of infantry into the city.\n\nIn a hastily constructed bunker, Lei Feng and his fellow staff officers huddled together under dim light, poring over maps marked with colored pencils. Outside, artillery shells rained down, shaking the bunker and leaving everyone dizzy. Lei Feng adjusted his radio to locate the enemy artillery positions, but all he heard was static—communications had been severed by a shell that destroyed the antenna.\n\nDamn it! Lei Feng thought, retrieving a spare antenna. Ignoring the danger, he dashed out of the bunker to restore the connection. Crouching low, he worked to set up the new antenna. Another barrage of artillery fire roared closer. Hearing the shrieking approach of the shells, Lei Feng decisively planted the antenna into the ground and shouted back to the bunker, urging them to reconnect with the front lines. He wrapped his arms tightly around the antenna, ensuring it wouldn't break again. \n\n\"Lei Feng!\" A comrade’s shout rang out just as a shell exploded, throwing up a cloud of dirt and swallowing Lei Feng's figure.  \n\nWith the battle still raging, the other staff officers focused on reestablishing contact with the front lines. Once the enemy artillery positions were confirmed destroyed and the troops resumed their advance toward the city center, they rushed out to search for Lei Feng. Outside, they found him clutching the antenna tightly, his body riddled with shrapnel, lifeless. \n\nLei Feng had given everything, even his life, to ensure victory and the liberation of Jinzhou."
 CPC_TRCW_JINZHOU_2.o: "He stood there, like a towering monument."
