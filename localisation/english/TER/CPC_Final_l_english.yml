 CPC_TRCW_Revolt.1.t: "The Gathering"
 CPC_TRCW_Revolt.1.d: "Zhang Zhixin always felt trapped in Beiping, caught between China and Manchuria, where many brave people had fallen to the Japanese invaders: Li Dazhao, Ji Hongchang, Chu Anping, Yu Luoke. She saw no hope for a better future, only misery and bloodshed.\n\nAs a rare survivor of the Manchurian Cavalry Division's crackdown on the Citizens' Association, she joined the clandestine Democracy Association. The humiliations of the 1960s haunted her, and she longed to voice her dissent at Xizhimen or elsewhere, yet her fellow democrats held her back - they knew that Zhang Zhixin was not made of steel, and that the Manchurian Army would show no mercy.\n\nIn late 1969, strange rumours stirred up the citizens of Beiping. They heard that the Communists had infiltrated the city and were planning to oust the Manchurian troops; that the Cavalry Division headquarters had moved to Chengde, and the arrogant mounted police had vanished from the streets; and that Yu Luoke, who had disappeared, was still alive and had joined the Communist Party. The rumours grew more mysterious and exciting as they spread.\n\nAs the de facto leader of the Democracy Association, Zhang Zhixin knew some secrets that the public did not. She knew that the Communists had a covert military unit in Beiping called the \"Urban Engineering Department\", which occasionally contacted them and sent them supplies and MLM revolutionary literature. She knew that the Cavalry Division headquarters had indeed retreated to Chengde, because Manchuria was facing the threat of the Resistance and the Soviet Red Army in Outer Manchuria. And she knew that Yu Luoke was dead, unlike Chu Anping who was executed publicly, he was shot in secret on the banks of the Yongding River and dumped into the water by the Japanese. Only a few association veterans who had avoided arrest had the courage to guard the Lugou Bridge, hoping to find his body. Otherwise, his fate would have remained unknown.\n\nAt the dawn of 1970, Zhang once again stood at the Lugou Bridge."
 CPC_TRCW_Revolt.1.o: "This time, we have to take back our freedom."
 CPC_TRCW_Revolt.11.t: "New Life of Old City"
 CPC_TRCW_Revolt.11.d: "The grey clouds are dense and the rain is continuous.\nThe long-awaited artillery fire from outside the city has certainly shaken away many of the false pretences of decay for the former Chinese capital, which had been whitewashed by the Japanese invaders, and the local residents living in this ancient city are finally able to stop being subjected to the impermeable day and night surveillance and suppression - but the reality is still bleak, with many centuries-old houses destroyed and a large number of people displaced to spend the night on the streets.\nThese are the number one problems that the new communist cadres in the city need to solve.\n\nZhang Zhixin, who was worried at the bulletin board under the Zhengyangmen Gate, immediately broke into the courtyard of the Beiping Provisional Public Security Administration Committee and found Liu Jianxun, who had just arrived and was worried about the reconstruction of Beiping.\n\"We can understand the need for the army to maintain law and order to defend Beiping from Manchurian invasion, but we don't agree that you should control freedom of the press and freedom of commerce in the name of maintaining the stability of Beiping, we're too familiar with this line of rhetoric, and we said the same thing when the Manchurian invaders were in military control of Beiping.\"\n\"Please take a lesson from the United States, the beacon country of freedom and democracy on our planet, and they will not restrict the voice of the people, nor will they follow the example of the Japanese imperialists in spying on and controlling their people with grandiose excuses - we believe that the Communist Party is not the kind of people who cannot listen to their citizens' opinions. \"\n\nLiu Jianxun, who was confused by the barrage of questioning, could only swing his hands helplessly in an attempt to appease her, \"The priority now is to stabilise order and resume production, what you said we...\"\n\"...How do you want it? Don't pretend to be deaf and dumb, don't shelve our demands, the people of Beiping have endured for forty years, we can't tolerate such ambiguous, so-called wartime controls that are hastily implemented without resorting to public deliberation.\" Zhang Zhixin was unforgiving.\nBeing forced to ask such a wretched Liu Jianxun heart on fire: you are tolerating me to endure for forty years? Why are you angry at me? And you can represent all of Beiping? I was busy building porridge shed when you did not see? Now everything is good for the United States?\n\nIn the end, they didn't argue, and Liu Jianxun suppressed his anger and gave a vague reply, saying only, \"We'll consult the public when we issue the decree.\"\nZhang Zhixin, who had been asked to leave the house, was equally angry - the Communist Party was after all just another inward-looking product of civilisation running on a big river, and although it might still be shouting the slogans of democracy and liberation, a familiar wariness once again caught up with Zhang Zhixin's heart."
 CPC_TRCW_Revolt.11.o: "The Same Bed, the Different Dreams."
 CPC_TRCW_Revolt.12.t: "Heaven Is Clear"
 CPC_TRCW_Revolt.12.d: "At the first dawn of 1970, a large crowd gathered at Lugou Bridge, following a secret leaflet that had circulated two weeks earlier. They saw a woman in her late thirties on a makeshift stage near the bridge, holding a big white megaphone.\n\n\"My fellow citizens, my comrades for democracy! I stand here on this new year's dawn to demand a future for our Beiping that is free of tyranny and poison!\"\n\n\"Remember how we fought for democracy and freedom seven years ago in Beiping, and how we paid a heavy price. More than three thousand of us were arrested for no reason, and a third of them were killed. Among them were Chu Anping, a veteran of our Citizens' Association, and Yu Luoke, who disappeared without a trace!\"\n\n\"Yes! The man who has been 'wanted' by the Republic of China Police and the Manchurian Army for seven years, he died here, in this Yongding River!\"\n\nThe crowd was shocked.\n\n\"It was here, by the Lugou Bridge, that some elders of our Democracy Association braved the risk of being caught for breaking the curfew, and it was here that they found and buried the body of Martyr Yu Luoke.\" Zhang's voice turned mournful, \"Yu Luoke's death was so horrible that I can’t even tell you how he suffered - but his death taught us a valuable lesson.\"\n\nZhang breathed deeply, \"The invaders make blood with their bullets, but they use our blood to feed their greed!\"\n\nThe crowd roared with anger, but Zhang still spoke louder with her megaphone, \"Friends and citizens, the Japanese have kept us in chains for forty years with their forty yen wage! The Manchurian Army, their puppet, has already fled to Jehol. Do we have any reason to obey their so-called martial law?\"\n\nSeeing the crowd’s passion and impatience, Zhang lifted her right fist high: \"Down with Japanese imperialism! Kick out the Manchurian invaders! Give us back our free Beiping!\""
 CPC_TRCW_Revolt.12.o: "\"Give us back our free Beiping!\""
 CPC_TRCW_Revolt.2.t: "Symphony No. 9 in D minor, Op. 125"
 CPC_TRCW_Revolt.2.d: "When Lu Hong'en walked into the former site of the All-China Federation of Trade Unions in Hankou, he felt as if he had returned to Shanghai more than thirty years ago. At that time, although I could not say that I was full of energy, but at least I was much better than the present dishevelled appearance. At that time, he spent more than half of his time playing the piano in various venues, barely making a living; he had written plays and music reviews, rehearsed a few plays, and assumed the position of conductor. Although it had been a long, long time since he had picked up the slender yet heavy baton, Lu Hong'en felt that today he was once again picking up the baton. Only, the repertoire of this rehearsal did not consist of notes.\n\nThe first movement is a not-too-fast and slightly solemn Allegro, grim and powerful. The comrades silently picked up their weapons from the north-west and put on their final touches before setting off. The atmosphere is not very cheerful. During these years of underground struggle, many, many figures had disappeared senselessly and like a dog. In silence, the comrades' refurbishment drew to a close. The small bumps, the whispered conversations, the sadness and the tense wrestling, the gradual convergence of light in the struggle.\n\nThe second movement is an extremely lively Allegro. Because of the oil crisis and the Communist threat in the north-west, the pseudo-government of Nanking has long since drawn most of its forces forward for defence. There were even fewer guards at the government in Wuhan. The comrades quietly approached the guards and surged in with the commanders' orders. Charge and shout together weave a soft harmonic of timpani and strings. The jumping shots and bright chants seemed to make people see the white of the fish's belly in the east on a cloudy battlefield.\n\nThe third movement is the soft panels of the song. After a short battle, the victorious party has to wipe away the dust from themselves and clean their gaping wounds. Lu Hong'en did not stop for a moment to patrol around the wounded. He Woods questioned himself. Perhaps this was the wrong revolution? Perhaps his decision had wasted more lives? Perhaps the time was not yet ripe, and the team still needed to settle down and hibernate? But the situation could never give him time to think it over, and the fourth movement was coming soon under the deep thoughts of Romanticism.\n\nThe fourth movement is the quintessence of the whole work, the sharp plate. The resistance of the pseudo-government is gradually quelled by the combined efforts of the comrades. The sky also tears off its veil of darkness hastily and slowly amidst the gradual cessation of gunfire, revealing its luminous skin. Lu Hong'en, in front of the microphone, excitedly and solemnly proclaimed the victory of the People's Alliance for Justice, the liberation of Wuhan, and the promise of freedom."
 CPC_TRCW_Revolt.2.o: "The chorus of the people!"
 CPC_TRCW_Revolt.21.t: "On and on the Great River Rolls"
 CPC_TRCW_Revolt.21.d: "It is early morning in Wuhan. The red-white sun cuts through the layers of mist on the Yangtze River, colouring the sky under the endless layers of cumulus clouds crimson. The Yangtze flows silently by, the mother river of the Chinese nation that never stops. Lu Hong'en and millions of Wuhan citizens stayed up all night, holding their breath and listening to the sound of artillery coming closer and closer outside the city. The rumbling of the guns reminds Lu Hong'en of the timpani he heard in the orchestra when he was still in Shanghai. To the sound of the drums of war, Wuhan will either grovel again or proudly win the right to stand, shaking off the dust and revealing itself as the first city of the Chinese Revolution.\n\nBy mid-morning, the cannonade petered out. By noon, the People's Liberation Army entered the city. Rows and rows of grey-green men, their faces still covered with dust and blood, were silent and curious as they surveyed this thoroughfare of the nine states. True to the blossoming of his own efforts and those of his other comrades, Lu Hong'en, walking along the river, was in a bit of a trance. He remembered his family's belief in the God of Heaven. Perhaps there really was such an all-knowing and compassionate Lord who had come to save China?\n\n\"Is this Comrade Lu Hong'en from the People's Justice League?\" A greeting interrupted Lu Hong'en's thoughts. The one who greeted him was a PLA officer. With a face covered in grey, he straightened his military cap, which was messy from days of war, patted his uniform, and straightened up and saluted Lu Hong'en. \"The Party Central Committee is very grateful for your work in Wuhan, and it is because of you and the comrades of the People's Justice League that the PLA was able to take over Wuhan with minimal losses. With the support of the people of Wuhan, we will surely be able to liberate all of China more quickly! \"\n\n\"While it is great to liberate China...how do you plan to deal with the current situation in Wuhan? We, the people of Wuhan, have been resisting for a long time, and even though the people's fat and wealth squeezed out by the Gao pseudo-government has been returned to the people, you have seen it for yourself.\" Said Lu Hong'en, looking towards the city, \"There are still many people who are displaced, there are still many people who are unable to feed and clothe themselves, and there are still many people who need to beg in order to live...What do you intend to do?\"\n\nThe PLA officer looked at Lu Hong'en's hands. They were the hands of a pianist, slim, slender, but calloused from the war. \"The purpose of the Communist Party is always to serve the people. We will do everything we can to ensure a normal life for the people of Wuhan. But there is one more important matter, I wonder what the production status of the Hanyang Arsenal is? If it's stopped, can it be resumed quickly to support the front?\"\n\nLu Hong'en choked. He keenly caught a hint of dissonance and thus did not continue to throw out questions about workers' democracy, democratic elections, free speech and free artistic expression. He remembers nostalgically what life was like when he was performing in the foreigner's adventurer's paradise more than thirty years ago. At that time, he did not have the concerns and burdens of today, and only the music and the next meal bothered him. Perhaps when China was liberated, he could return to Shanghai and play the piano again."
 CPC_TRCW_Revolt.21.o: "...all rest in pleasing chats."
 CPC_TRCW_Revolt.3.t: "Secret Report from Qiongya Column "
 CPC_TRCW_Revolt.3.d: "Party Central Committee and Military Commission:\n\nSince 1968, in accordance with the instructions of the South China Bureau, our column has been actively infiltrating and making contact with Zhanjiang, Leizhou and other places, and, after long-term observation, we have made contact with the \"Committee for the Struggle Against Persecution\", a local workers' underground mutual aid group in Leizhou, whose leader is Su Shouzhong.\n\nSu Shouzhong, also known as Su Youshi, was born in Guangzhou in 1941, and was a Catholic and Buddhist. He joined the Fujitsu Hong Kong factory in 1959, and was dismissed from Fujitsu because of his participation in a march and a hunger strike in Hong Kong's Central in connection with the suicide of Li Chunru in 1963, and then he moved to Leizhou, where he gradually changed his mindset to that of a revolutionary after a long period of oppression by the Japanese imperial enterprises, and he secretly set up an underground group of the \"Fighting Committee Against Persecution\".\n\nBecause of the recent changes in Beiping and Wuhan, Su Shouzhong organised a protest march on his own in order to \"respond to the righteousness of the act\", and our column decided to assist him in expanding the scope of the uprising, and now the Anti-Combat Committee has taken control of the Zhanjiang City Government Building and declared the autonomy of the Leizhou Peninsula.\n\nNow that the uprising has entered a phase of stalemate, we request the Central Committee to coordinate with our allies in South-East Asia to provide material assistance and ideological guidance.\n\nFirst Secretary of the Qiongya Column Feng Baiju"
 CPC_TRCW_Revolt.3.o: "Approved."
 CPC_TRCW_Revolt.31.t: "High as the sky and wide as the sea"
 CPC_TRCW_Revolt.31.d: "The sunlight sprinkled on the surface of the sea, sparkling as if splashing a thousand silver stars. In the distance, the azure sea water and the sky merge into one, making it impossible to tell where is the sea and where is the sky. Seagulls are flying freely in the air, and the reefs are enduring the lapping of the waves and the blowing of the wind.\n\nThe wind from the South China Sea is also blowing on his dusty face, which is salty and bitter, blowing away his wrinkled brow and evoking the complex emotions in the heart of this long-time inland dweller.\n\n\"Chief,\" seeing that he did not respond, Su Shouzhong had to raise his tone, \"Chief!\"\n\n\"Eh,\" he seemed to wake up from a dream, \"Comrade Su Shouzhong, it's a pleasure to meet you. Thanks to you, we were able to recover Zhanjiang without bloodshed, the Party and the people will remember your achievements...\"\n\n\"We have already collected all the firearms that the enemy failed to withdraw, and at the same time, we have raised food, ready to receive the warriors who have been born and died along the way, and the military factory will also resume work as soon as possible in the near future, but also ask you to make the next step in the instructions.\"\n\n\"There is no need to go to such great lengths, from what I have observed in recent days, there are many local residents who have been displaced and do not have enough to eat. The PLA is the people's army, how can we sit on the people's rations? The first order of business is to first...\"\n\n\"Chief, do you know? Since I can remember, this place has been invaded by the Japanese, and how many young men have been shot! How many big girls were spoilt! When I am a little older, often see the pseudo-police kicking people's buttocks, step on their toes, extremely insulting, the atmosphere is simply suffocating, actually have a kind of this place is not my land, not my people's feeling. Later, when General Xia rose up, I wanted to follow him to fight for the Chinese nation, but who would have thought that I, an upright Chinese man, would succumb to the steel guns of the Japanese, and be forced into factories to build things to deal with the Chinese people! Fortunately, our troops came, the People's Liberation Army is the real liberator of Zhanjiang, as a Chinese, I can not see the tragedy of the past repeat? As long as we can liberate China and revive the Chinese nation, our small loss is nothing!\"\n\nHe looked at the sea, thinking of Su Shouzhong's words, those invaders came and went from the sea, no matter what, in the future this place-"
 CPC_TRCW_Revolt.31.o: "-all things are revived!"
 CPC_TRCW_Revolt.4.t: "Outbreak of the East China Uprising!"
 CPC_TRCW_Revolt.4.d: "Large-scale democratic anti-riot struggles have broken out one after another in the enemy-occupied areas of Beiping, Wuhan and Leizhou, with the momentum of a prairie fire, and the underground party organisations that we had previously restored in these areas are now in operation, which is an excellent opportunity for us to infiltrate and shake up the enemy's rear, and to strengthen the democratic and patriotic forces in the latter part of the country!\n\nThe Central Committee has already approved an aid programme for the democratic and patriotic forces in the east, and has put forward a vision of inviting democratic representatives from the east to Xi'an to take part in the convening of the National Political Consultative Conference on Democracy, and Comrade Luo Qingchang has already mobilised the intelligence services to go into full operation. We must seize this once-in-a-lifetime opportunity!"
 CPC_TRCW_Revolt.4.o: "Always be ready!"
 CPC_rural_dem.1.t: "Great Changes with No Sounds"
 CPC_rural_dem.1.d: "The seasons remained unchanged, and people's attire neither increased nor decreased. Yet, subtle transformations were afoot. Former secretary Luo Yulai had lost his position due to unaccounted historical errors. Now an ordinary brigade member, he followed Liang Jiabao with a bowed head. The vacant post sparked heated debates among the five production teams. Eventually, they settled on Liang Guisheng, the poorest cadre from one of the brigades. Everyone else reveled in newfound contentment, as if realizing their mastery over the country for the first time.\n\nAs secretary, Liang Guisheng's life changed little. He reviewed important matters with the members, but his actual influence remained limited. That afternoon, Liang Guisheng led the team's several plough oxen to the stream to cut grass. He had only cut half a morning when he heard the sound of noise from afar. He saw Luo Yulai's wife and Widow Li tearing each other's hair, crying and cursing as they staggered towards him.\n\n\"Secretary Liang! Yulai sneaked into this woman's house again. Why not convene a meeting so we can speak openly?\"\n\nYulai's wife wept and cursed, while Li Widow's hair hung loose as she cried. Half of her face bore the red imprint of a slap. Embarrassed, Luo Yulai trailed behind them. Liang Guisheng found their comical appearance amusing. His initial intention was for Luo Yulai to \"redeem\" himself by assisting a struggling family on behalf of the brigade. However, this situation had mistakenly become evidence of a broken relationship. Sometimes good intentions lead to unintended consequences. Democratic evaluation wasn't meant for relationship disputes! Yet, outright suppression wasn't the solution.\n\n\"You claim Comrade Li committed adultery with Yulai. Do you have evidence? Without it, a fair decision cannot be made.\"\n\n\"What evidence do I need? I saw Yulai entering this fox's house with my own eyes!\"\n\n\"Let's not be hostile to our fellow comrades. At next week's council meeting, present your evidence and figure it out in front of everyone for fifteen minutes. After that, no more fighting over this issue!\""
 CPC_rural_dem.1.o: "Long had been my road and far was the journey;\nI will go up and down to seek my heart's desire."
 CPC_rural_dem.2.t: "A Total Mess"
 CPC_rural_dem.2.d: "\"How could we elect that son of a bitch? Last year, while he was paying his taxes, I clearly saw him manipulating the scale to reduce the amount he owed, which was clearly a ca, ca...\"\n\n\"Capitalist mistake!\"\n\n\"Right! Capitalist mistake! That son of a bitch is trying to sabotage our brigade to prepare for the capitalist road!\"\n\n\"Bullshit! You said you saw it? Who else saw it? Who?!\"\n\nThe Convocation erupted once more, as expected. Amidst the clamorous crowd, Luo Yulai remained silent. He found amusement in this farce; why should he bother speaking? With Luo Yulai out of the picture, the selection of a new secretary became impossible. Yet, the steering group insisted he step forward to clean up the mess. \"You all fucking deserve this,\" he thought, spitting fiercely and feeling a strange, painful satisfaction.\n\n\"I saw it too!\" \"Me too!\"\n\nThe crop farmer, now the crowd's target, briefly turned iron blue, then flushed red. \"You spineless cowards!\" he stammered, anger rendering him speechless. In frustration, he changed his approach.\n\n\"Give me that!\"\n\nLuo Yulai, still bewildered, suddenly lost his seat. The small stool was yanked away! The week-long quarrel over electing a secretary had pushed everyone to their limits. Furious members hurled abuse, using stools and fists to settle their differences. Someone, in their shortsightedness, had even brought their child to the meeting, now crying aloud. As Luo Yulai scrambled away from the violence, he glanced at the steering group—several cadres crouched on the ground, exchanging bewildered looks."
 CPC_rural_dem.2.o: "Great. It's all over."
 CPC_rural_dem.3.t: "Their Deafening Silence"
 CPC_rural_dem.3.d: "\"...In short, if anyone has anything to say, please speak freely!\"\n\nSilence. A long time after the words fell, there was only a deathly silence in the meeting hall of the council. Even Liang Jiabao, who was usually the most active speaker, pursed his lips and said nothing.\n\n\"Wh, what's wrong? Is our brigade's democratic construction so good that it has solved all the problems? Haha!\"\n\nA cadre from the supervisory unit forced out a couple more sentences, unable to let the silence continue. But it didn't warm up the atmosphere at all. Those two dry laughs were as shriveled as sun-baked zucchini, making everyone uncomfortable. As a result, the awkward air became even heavier, clogging the team members' mouths and making them afraid to speak.\n\nLiang Jiabao looked left and right. Except for him, no one was holding their head up, but everyone's lips were moving, as if they wanted to say something. Yes, how could they not want to speak? When the supervisory unit first arrived, they were told to \"speak openly and freely,\" and everyone was willing to vent their grievances. But no matter what they said, it was always \"incomplete\" or \"too radical.\" It's important to know that a large part of these grievances were directed at Luo Yulai. After all, the supervisory unit was not from the village. Once they left, who knew if Luo Yulai would seize on these words and make things difficult for them? Or even, looking further ahead, once the supervisory unit left, would their council even be able to continue existing?\n\nTime passed in awkwardness and silence, and the members suffered along with it. Finally, they had to announce the meeting adjourned. As Liang Jiabao dragged his feet out the door, he heard two farmers, who had once stood up and angrily denounced Luo Yulai, squatting together and whispering.\n\n\"I say, maybe we should carry a bag of sorghum tomorrow to apologize to Secretary Luo. He's an official after all.\"\n\n\"I'm just afraid he'll look down on us and refuse it.\""
 CPC_rural_dem.3.o: "Sigh..."
 CPC_rural_dem.4.t: "New and Old Secretaries"
 CPC_rural_dem.4.d: "A few weeks had passed. At midday, Luo Yulai, as usual, finished eating his wotou with cool water in the field. He paced slowly along the ridge with folded arms. His rubber shoes pressed into the soil, creating a soft rustling sound. A few brigade members sat nearby, glancing up as he passed, but no words were exchanged.\n\nLuo Yulai was no longer the brigade secretary. Although still considered a cadre, he no longer commanded the same respect as before. Once, he made decisions and calls; now, the supervisory unit and the new leadership held that authority. It seemed an unbreakable truth: whoever had the final say received the corresponding respect.\n\n\"Comrade Yulai, how have you been?\" Luo Guiwa, the new brigade secretary, greeted Luo Yulai. Despite his honest and quiet demeanor, Luo Guiwa had assumed the role without objections, hurrying to fulfill his duties.\n\n\"Good. How's work?\"\n\n\"Not much else, Just a lot of meetings. Day to day. And I have to convey the message from the party to the comrades. Life's not easy!\"\n\n\"Why doesn't the supervisory unit convey the spirit themselves? You're always assigned the hard work,\" Luo Yulai asked.\n\n\"In those meetings, I mostly sit on the side and listen,\" Luo Guiwa explained, wiping sweat from his face. \"Recently, some new cadres arrived from the county. Their behavior during yesterday's meeting reminded me of your past demeanor, but they are quite sensible! They've meticulously planned out the entire year, and if I continue my recent activities, I'll eventually have some free time.\"\n\nLuo Yulai felt a pang of discomfort. He waved Luo Guiwa away, instructing him about a row of wheat with stubborn weeds at the east end of the field. \"Tell the supervisory unit I'll lead the weeding this afternoon. As for the meeting, I'll take a leave of absence.\""
 CPC_rural_dem.4.o: "Focus on action, not talk.\nThe Party decides, the people obey."
 CPC_rural_dem.5.t: "Double-headed"
 CPC_rural_dem.5.d: "Luo Yulai has been feeling increasingly unhappy lately. The supervisory unit's actions have left him puzzled - neither dismissing him nor cutting his power. It's as if the supervisory unit has taken root in the village, and Luo Yulai can't predict its next move. Sometimes he's required to report everything to the unit, while other times he's burdened with strange tasks related to \"democracy.\" Even his team members are confused: should they knock on the brigade secretary's office door or the supervisory unit's?\n\nSeeking answers, Luo Yulai turns to Zhang, the village accountant. Zhang, once a fortune-teller before the village's liberation, was beaten up after the revolution and, due to his ability to read and write, assigned as an accountant serving the people. But secretly, he continues his old profession, offering fortune-telling services to superstitious brigade members.\n\n\"I know where the problem lies, Secretary Luo. The answer is right here in this book of heaven.\" He lifted the book in his hand. Luo Yulai focused his gaze, only to find that to be a high school history textbook, opened to the introduction of the Russian Empire. \"Look,\" Accountant Zhang pointed to the double-headed eagle logo in the book, \"this is you, Secretary Luo; this is them.\" He then pointed at the office of the supervisory unit.\n\nAlthough the term \"them\" is a well-known code word in the brigade, Luo Yulai remains puzzled.\n\n\"I don't get it, why do you sound so insane today?\"\n\n\"Ignore the deep meanings those Russians implied. I just want to tell you that a bird shouldn't have two heads. That's why you've been unhappy lately.\""
 CPC_rural_dem.5.o: "\"What are you talking about...\""
 CPC_rural_dem.6.t: "Outbreaks"
 CPC_rural_dem.6.d: "\"Comrade Secretary, l...l'm here to validate the letter of introduction.\"\n\nLuo Yulai is resting with his eyes closed, a nervous and discordant voice suddenly disturbed his peace. The \"Secretary's Office\" sign was removed not long ago, or there are always some people walk blindly, stepping into the room without knocking the door. He didn't even bother to open his eyes:\n\"This letter of introduction is not for me to validate.\"\n\n\"Oh, Comrade Secretary...My niece is getting married, if I don't go, won't I...\"\n\nSee Luo Yulai is still silent, this ploughman pondering to have the wedding feast continued to stutter to explain the need to validate this letter of introduction. He was completely oblivious to the fact that Luo's face was getting tighter and tighter, like roaring clouds before a rainstorm, his anger was about to burst.\n\n\"I said I'm not in charge of that! I'm not the secretary anymore, not anymore, don't you get it?!\"\n\nThe sudden roar was enough to startle people, but Luo Yulai wasn't done yet. He pounded the desktop and yanked on the drawers like crazy. One, two, three, four, all the drawers were yanked out and flung on the floor, each one empty.\n\n\"The paperwork's been taken away, so the official seal, even my tap pen! How can I write you a letter of introduction now? What can I write with? What can I use to stamp it?\"\n\nLuo Yulai pounded the table with every roar, and by the end of the shout, he was almost crying:\n\n\"Taking everything away, not allowing me to go back, to be a peasant, what mistake have I made? What sin have I committed against the Party, against Chairman Mao?\"\n\nThe ploughman was so scared that he couldn't walk, he never thought that the godly and lively Luo was actually like a child now, crying with a snotty nose and a tear."
 CPC_rural_dem.6.o: "...W, well, I'll go out first."
 CPC_rural_dem.101.t: "Working Style Conference"
 CPC_rural_dem.101.d: "They always say democracy , brigade secretary Luo Yulai is now a solid understanding of what is called the people as the master of the house. He stood awkwardly in the middle of the brigade members, not knowing where to put his hands. The central cadre in civilian clothes stood in the middle of the team members, ignoring Luo Yulai's look of help, signaling that the meeting could begin.\n\n\"You said! Last year there was a drought, and the wheat of the others withered a large area, but your own production group, the wheat in the fields are all green and strong! Do you have any selfish favoritism, you say!\"\n\nA member of the team who has always been at odds with him jumped up first, pointing at Luo Yulai's nose, and started to curse.\n\n\"I...was clearly decided by lottery last year, how can I be blamed?\"\n\nLuo Yulai open mouth, half a day to say this small sentence. He is very bottomless because the drawing of lots is what he proposed, who knows the son of a bitch own luck so good...today he can be finished!\n\n\"You still have the face to say! Originally everyone agreed out to be an equal share, you said that egalitarianism should not be, this is to draw lots!\"\n\n\"He's the most immoral person.\" A middle-aged woman's voice rang out, \"Not even on this one matter of irrigation. He's immoral in everything, and he's engaged in broken shoes with the Li family's widow...\"\n\n\"You fart!\" It was the voice of the Li family's widow.\n\n\"How am I farting? Luo Yulai sneaked into your house, I saw it with my own eyes!\"\n\n\"You can't even control your own man, and you still care about me! He goes to Luo Xiu Mei's house at the east end of the village every three days, why don't you care?\"\n\n\"I'll strangle you, you little shrew!\"\n\nWhat started out as a democratic meeting to criticize the irrigation issue and Luo Yulai's style of work has somehow turned into a big exposé of the village's broken-shoe story. Now not only Luo Yulai, but even the head of the central cadres can not help but seep out the sweat, if you do not call a halt, the venue will really be torn up."
 CPC_rural_dem.101.o1: "In any case, exposing the problem is meaningful."
 CPC_rural_dem.101.o2: "A good meeting turned into this, it's really..."
 CPC_rural_dem.102.t: "The new face of the production team"
 CPC_rural_dem.102.d: "Only after three times of blowing the horn for the end of work, a few production teams have already picked up their farming tools and rushed to the village. Liang Jiabao, the captain of the fifth team, carried a hoe handle and walked in the forefront, with a grey towel wrapped around his head - the only towel he had, and yesterday he asked Luo Yulai for a piece of foreign pancreas, but he still couldn't wash it. Not white is not white, Liang Jiabao does not care about this secondary contradiction, this thin man proudly raised his ribbed chest, striding forward. Today is the day that their five teams are proud of themselves, his waist can finally straighten up!\n\nOriginally, there were only four production teams in the village, and the four captains complained to the secretary that there were too many people to manage, so each of them set aside a few people to form another team. Needless to say, the allocated are old and weak, the land is barren, but also scattered in various places, Liang Jiabao can not even point people. To the end of the year a calculation of points, always the bottom of the five teams, he had forgotten how much he wrote a review of this, the team made how many assurances. But now it is different, the cadres from above came to the village, they encouraged them to get up and make trouble. Liang Jia Bao boldly, with all the members of the five teams to the problem up, really made the decision for them: after the close of work today, the five production teams will be broken up and reorganised, the responsibility of the field is also re-drawn, we are all fair, to see who can still pressure them to the head of the five teams!\n\nLiang Jiabao was as beautiful as if he had drunk ice water in a three-volt day, humming an albatross as he walked past the Long. The people in the field who were still packing up watched him walk by proudly and couldn't help but talk to each other.\n\n\"Look at what you can give him!\"\n\n\"The little man is...pleased with himself.\"\n\n\"He can make a scene, but I can't? Next time I'll go and make fun of him too, let's see what he'll do!\""
 CPC_rural_dem.102.o1: "There should be a reason for this kind of thing...."
 CPC_rural_dem.102.o2: "The poor and lower-middle peasants\nhave nothing to fear!"
 CPC_rural_dem.103.t: "On the Bulletin Board"
 CPC_rural_dem.103.d: "The secretary of the brigade is to be re-elected! The shocking news travelled from the head of the village to the tail of the village in the space of a meal, and everyone was chewing over the implications. It's not that they haven't seen Luo Yulai punished before, and it's not uncommon for him to do a review, but there's never been any talk of removing him. Nowadays...nowadays can be really different!\n\nAlthough the world is big, the wind and clouds change but with the people in the small village has nothing to do with, only these things that are really connected with life can be in their heart lake ripples. Field breaks in the discussion day by day more and more, production team members have got rid of the initial sense of vertigo, their mouths discuss more is how to let Luo Yulai honestly stepped down, as well as Luo Yulai stepped down, and then let who will be the secretary.\n\n\"In my opinion, if we don't introduce someone to choose this secretary, Luo Yulai will continue to rely on miles!\"\n\"Who doesn't know this? We're just waiting for someone to fire the first shot.\"\n\nThe next day, a campaign statement was posted on the newspaper board at the entrance of the village. The words were written by the brigade's accountant, Zhang, who first \"exposed\" Luo Yulai's work mistakes over the years, and then laid out some simple promises for his inauguration. At the end of the statement, with a tap pen twistedly signed the name of the candidate: \"Liang Jiabao\".\n\nAt the end of the evening, when the trumpets were blowing, the people brought Accountant Zhang here and asked him to read out the campaign statement again. When he read a few sentences, the crowd talked for a while, almost forgetting to eat their dinner.\n\"He's made a name for himself again this time.\"\n\"I'm a Party member too, so why wouldn't I dare to run if he does? I'll write something tomorrow to run for the election!\"\n\nIn a few days, the more statements were posted on the newspaper board, the more Liang Jiabao's paper had to be lifted to find the other statements. The accountant Zhang, who was dizzy from copying, finally hid his tap pen, and when others asked, he shook his hand with a bitter smile, \"They say we need democracy, and I have the right to speak, so let my wrist rest for a couple of days first!\""
 CPC_rural_dem.103.o1: "Great! Elections! More elections!"
 CPC_rural_dem.103.o2: "It's a big deal, better ask for permission first..."
 CPC_rural_dem.201.t: "Self-Criticism"
 CPC_rural_dem.201.d: "Luo Yulai, the Party Secretary of the production brigade, felt dizzy and disoriented. His \"crimes\" were laid out on the table before him, the printed Chinese characters seeming to grow larger, shouting and attacking him. Although Luo Yulai himself couldn't quite discern how much of these accusations were true and how much were false, faced with the black and white text, all he could do was confess, self-criticize, confess again, and self-criticize again.\n\n\"In 1958, you knew that the entire village only had 23 full-time laborers, yet you still applied to the county to increase the production quota for staple grains.\" The cadre from the supervisory unit calmly \"helped\" Luo Yulai recall his mistakes. \"The production team leader and several team members warned you that the quota couldn't be met, but you didn't listen. As a result, you ended up owing 3,060 catties of corn.\"\n\n\"That same year, you also demanded that the brigade dam the stream to store water, leaving two downstream production teams without irrigation water, forcing them to dig open the earthen dam again. Before they came to you from downstream, you hadn't discussed the feasibility of damming the stream with anyone in the brigade.\"\n\nHow can they blame me? Luo Yulai couldn't understand it at all. While making his self-criticism verbally, subconsciously, he never saw himself as a tyrannical and arbitrary secretary. Ever since he could understand things, he had followed the Party in making revolution, doing whatever the Party said, and everyone unanimously supported him. If they had to sit together and \"discuss\" everything every day, how could they \"leap forward\"?\n\nThe words he wanted to say reached his lips but were swallowed back down.\n\n\"Yes, I admit that there were serious mistakes in my work. I will write another self-criticism and submit it.\"\n\nIt was almost dark. People saw Luo Yulai walk out of the supervisory unit's room, dejected and listless. The tall secretary, hunched over, clutched a scroll of his crimes and staggered home."
 CPC_rural_dem.201.o1: "Enthusiasm alone is useless; he must figure this problem out."
 CPC_rural_dem.201.o2: "Let's stop here - if the people's enthusiasm fades,\nwe're screwed."
 CPC_rural_dem.202.t: "Secretary with No Authority"
 CPC_rural_dem.202.d: "Luo Yulai, the brigade secretary, paced back and forth in the outer room, feeling frustrated. The wooden door's sound insulation was terrible, and he could hear the conversation in the inner room clearly – Damn it! They made him write so many self-criticisms, and now they're having a closed-door meeting. They even spend ages discussing how many livestock the village should slaughter for the New Year!\n\nLogically, he had the right to attend the meeting like the other brigade cadres, but the supervision unit criticized his self-criticism for lacking depth, so he was temporarily excluded. Words that Luo Yulai couldn't understand and didn't want to hear poured into his ears – spring irrigation, autumn irrigation, moisture retention... Chairman said to promote democracy, what kind of democracy is this? They're just using empty talk to suppress people; it's like they've sent a bunch of yamen magistrates to boss him around!\n\nLuo Yulai was still fuming when the door to the inner room suddenly creaked open – the meeting was over. The supervision unit cadres filed out, followed by a few brigade cadres who had been allowed to observe, all emerging from the inner room.\n\n\"This is next month's irrigation plan.\"\n\nThe man at the front handed Luo Yulai a stack of papers. He snatched it, glaring at the man opposite him.\n\n\"Comrade Yulai, your confrontational attitude is a serious problem... Our village's irrigation last year was chaotic. Everyone had their say, and in the end, no one was offended, but the water was wasted, and the grain yield didn't increase. If we want to progress, we have to change this.\""
 CPC_rural_dem.202.o1: "... do as discussed."
 CPC_rural_dem.202.o2: "Progress my ass. Does it matter at all even if you\nharvest an extra thousand catties of grain?"
 CPC_rural_dem.203.t: "Say Less, Do More"
 CPC_rural_dem.203.d: "Early in the morning, the supervision unit directed a few people to paste a large sheet of paper on the village bulletin board with wheat paste. On it, written in respectful regular script were a few large characters: \"No casual conversation for cadres during work hours.\" For the brigade's cadres, this was no small matter. Although they vaguely felt they were \"officials,\" they still retained a bit of peasant naivety, unable to put on official airs. They often got their work done amidst laughter and chatter. Now, with this sudden prohibition, they would probably need a long time to adapt to this new situation.\n\nAround afternoon, Liang Jiabao, the captain of the fifth team, walked into the brigade secretary's office. He was there to report to Luo Guiwa, the deputy secretary, about the storage of the fifth team's winter wheat seeds. The responsibility fields of Liang Jiabao's team were scattered all over the place, and Luo Guiwa hadn't seen him for several days. Seeing him now, he felt a sudden surge of warmth and really wanted to ask about Liang Jiabao's recent situation.\n\nJust as Luo Guiwa was about to speak, he suddenly felt a sharp gaze from behind - not good! Although Luo Yulai had gone out, the cadres from the supervision unit were still around. This was working hours, no casual conversation allowed. His thoughts raced, the smile that hadn't yet fully formed froze halfway, and the words that were about to come out were swallowed back silently.\n\n\"Are they all collected?\"\n\nLuo Guiwa's strange expression and unnatural speech left Liang Jiabao puzzled. He could only respond stiffly with a simple answer.\n\n\"All collected, there's even some surplus.\"\n\n\"Then I'll have the oxcart go over and get the seeds into storage.\"\n\nWith just a few words, Liang Jiabao had finished the most important task of his day. He stood outside the secretary's office, dumbfounded. When did Comrade Guiwa become so taciturn? In the past, it would have been impossible to leave without at least half an hour of casual conversation."
 CPC_rural_dem.203.o1: "This is what I call compact and energetic!"
 CPC_rural_dem.203.o2: "This is completely out of touch with the masses!"
 CPC_rural_dem.301.t: "Speech on organisational principles"
 CPC_rural_dem.301.d: "At present, it is particularly necessary to emphasise socialist democracy. Our Party is a common cause of millions of people, and we should allow millions of people to speak and encourage the masses to participate in the revolutionary work. The people's speeches will inevitably be wrong and over the top. As long as they are favourable to the development of our socialist revolutionary cause, we need to listen to both good and bad words, and to listen to both is to be clear, while partiality is to be dark. Only in this way can we pool our wisdom and be lively and enthusiastic.\n\nA revolutionary party is afraid of not being able to hear the voice of the people; the worst thing is silence. It must believe that the majority of the masses will cherish their democratic rights. With this fundamental position, democratic life can be enlivened and the enthusiasm of the masses can be further mobilised for the cause of socialist modernisation. How can the organs of the Communist Party and the cadres of the Communist Party be afraid of the people and have no feelings for them? Can that be called Communist Party cadres? Such cadres were not even considered good officials in feudal society!\n\nHow to distinguish between right and wrong, between black and white, between the limits of freedom of speech and the scope of criticism, this needs to be established on the principle of law and discipline. If democracy becomes a blind movement of unorganised public opinion, it will mean failure...\n- Xi Zhongxun"
 CPC_rural_dem.301.o1: "The current problem is not disorganization.\nIt is that the people are too formal."
 CPC_rural_dem.301.o2: "Adherence to organisational principles and opposition to over-activism."
 CPC_rural_dem.302.t: "Talks on democratic principles"
 CPC_rural_dem.302.d: "We members of communist party, especially grass-root cadres, are serving the people, we should stand among the people, not on top of them. In Chinese society, the people fear of bureaucrats and the authorities, and the bureaucrats in the old society liked the people to be afraid of them and to obey them. If the grass-root cadres also follow the footsteps of these old bureaucrats, keep a straight face, \"sitting in the court\", \"judging cases, acting as the parental officials\", then that is totally wrong! We should let our enemy be afraid, not the masses. We should not let the cadres take over everything. When the people has something to say, we should listen carefully, then explain to them slowly and adopt an appropriate approach according to the actual situation.\n\nIf we do not give play to the power of the people and rely solely on the influence of our grass-roots organisations and cadres, it will make democratic reforms formalized. We should not think that we are superior to the people. A number of folk activists have emerged in the countryside recently, their methods and ways of acting are worthy of study by our cadres.\n\nNew creations of democracy have to be tapped from practice. Rural areas now have a private \"opinion box\", which is very good, in the various communes are worth promoting to try, but it must be \"sopntaneoused and asisted by pubulic\", which means only let the masses to engage in it spontaneously, official ones must be cancelled to avoid the negative effects.\n\nIn short, party organisations cannot shut the mouths of the masses, and only when the masses participate spontaneously can we hope to succeed in our reforms.\n- Xi Zhongxun"
 CPC_rural_dem.302.o1: "Adherence to democratic principles and rejection of substitution."
 CPC_rural_dem.302.o2: "Party should play a leading role."
 CPC_rural_dem.303.t: "The Letter"
 CPC_rural_dem.303.d: "To Central Committee:\nThe democratic reform in the countryside is now advancing rapidly, but as it does so, various problems are surfacing, among them, both left- and right-leaning ones: First, the overexpansion of the mass movement. Secondly, the rise of formalized democratic stuggles. And finally, the dissatisfactions of grass-roots cadres and worries of some masses.\n\nThe liberation of Shanxi is about to begin. In order not to affect the coming war, I suggest the democratic reforms in the countryside should be gradually wrapped up after they've achieved the phased objectives so that we can concentrate on preparing for the war and mobilize the masses to participate in the war of liberation, I hope the Central Government will agree to my suggestion.\nZhongxun"
 CPC_rural_dem.303.o1: "Agreed, we can resume this for another period of time."
 CPC_rural_dem.303.o2: "The dem-campaign can be extended for a bit longer time."
 CPC_rural_dem_end: "Depending on the choices we make during the current §Ggrassroots democratic reform§! process, the following effects will be triggered:"
 CPC_rural_dem_not_ended_yet: "The §GGrassroots democratic reform§! is NOT completed, and there is no way to know the §Cfinal effects.§!"
 CPC_rural_dem_complete_success: "§CTotal Success§! in the §GGrassroots democratic reform§!."
 CPC_rural_dem_partial_success: "§CPartial Success§! was achieved in the §GGrassroots democratic reform§!."
 CPC_rural_dem_fail: "§CFailure§! in the §GGrassroots democratic reform§!."
 CPC_WE_GOT_THE_FINAL_VICTORY: "The §xVISION OF INDEPENDENCE AND FREEDOM§! harboured by the Chinese Nation since one Sexagenary Cycle has been finally realised in §xOUR OWN HANDS!§!"
 CPC_TRCW_phase_3_tt: "It's the §xfinal fight§!, §Gunited§! until §Ytomorrow!§!"
 CPC_TRCW_GNG.1.t: "From Lofty Dreams I Now Awake"
 CPC_TRCW_GNG.1.d: "The fiery red sunset cast an amber-coloured glow over the fifteen-storey room, but despite this, they could still hear the sirens outside the government building. Another night of chaos was coming, vehicles were overturned, shops were burnt and the streets were thrown into chaos, an invisible chaos that seemed to cast an unseen shadow over the sunny room that seemed to be casting itself right under Morita's hunched frame.\n\nAs Li Ka-shing, Stanley Ho, and Ōmori Kan looked on, Morita laid a document on the table, an ultimatum from the Chinese Communist Party ordering the unconditional surrender of Guangdong, and everyone knew exactly what it meant.\n\n\"Is there no way to mediate.\" Li Ka-shing asked the question to which he already knew the answer. Ōmori Kan quickly shook his head, \"This is the backlash of the war between Japan and China, to my understanding, their goal since the beginning is only one - China, Guangdong, Manchuria, and even Taiwan Birch too all back in the bag, not to achieve the goal will not stop.\"\n\nThe office once again once again fell into dead silence, Stanley Ho suddenly snapped, his voice echoing in the office in unwilling defeat: \"I'll go and organise the Triads in those places in Shantou Chaozhou, I don't believe they can have much fighting power.\"\n\nSheng Tian shook his head, \"Don't be so impulsive, our goal hasn't changed, if handing over Guangdong can protect this land and the people on it, I think...\""
 CPC_TRCW_GNG.1.o: "\"...mayhap we shall converse with them.\""
 CPC_TRCW_GNG.2.t: "To be in a Quandary"
 CPC_TRCW_GNG.2.d: "Matsushita's office was cluttered and cluttered, and also filled with a foul air that was vaguely arid, like it was trying to consume everyone in the room.\n\nAs Foreign Secretary, it was now time for Morita to give Matsushita his weekly briefing again, but perhaps for the first time, he hated to slip in a few hasty words. Mercifully, this report he had to make - for the Chinese Communists had just delivered to him the ultimatum ordering the unconditional surrender of Canton.\n\n\"Now that the Chinese civil war is being fought as a meat grinder, with hundreds of thousands and millions dead on both sides, the hordes have pressed up to our western border.\" Morita struggled to control his voice, \"It's all over the papers. The Kyushu Weekly says 'The Chinese Communist army is pointing directly at Guangzhou', the Guangzhou Daily says 'Japanese expatriates are withdrawing to the home islands', and even China's Zhonghua Daily has editorial commentators with nothing better to do than say 'The country of Guangdong may find it difficult to withstand the I don't know what the Communists are doing, but we can't get through to Japan - I've read that there are long queues at the Guangdong border, and it takes three hours to get in and three hours to get out. It takes three hours to get in and six hours to get out. If we don't act-\"\n\n\n\nMatsushita reached down, copied the Communist ultimatum, and slammed it down hard on the floor. He turned to the Minister with bloated bags under his eyes, \"I know everything you're saying, but I'm burnt out right now, give me a few hours to get some peace and quiet, please!\"\n\nMorita looked at Matsushita with no small amount of pity in his eyes as he turned back to push open the door to his room."
 CPC_TRCW_GNG.2.o: "\"The onus is yours, thou shalt decide.\""
 CPC_TRCW_GNG.3.t: "The Heavens Quake, the Earth Upheaves"
 CPC_TRCW_GNG.3.d: "Blood and coffee scrambled through Ibuka's veins as he forced his wavering eyes to read the Chinese Communist Party's ultimatum ordering Canton's unconditional surrender-another piece of bad news. The economic lines had plummeted, and the division of battle lines on the map signaled that the Canton state was about to face the unbearable weight of its life. Order after order was hurled from the Administrator's office, and when it stopped depended only on when Ibuka fell asleep briefly, or unconsciously into sleep. However, things still hadn't changed much of anything substantial and were still steadily heading towards destruction.\n\nIbuka felt terrible all over. The ubiquitous headache naturally went without saying, and his mind was trapped in a no-man's land between fatigue and caffeine. He understood that something had gone wrong with his body, and every second he spent felt like he was struggling on the line between life and death. Who knew, maybe he was indeed dying. If he couldn't solve this problem, everything Ibuka had built would come to an end, probably including himself. If there was still a vestige of the old days left in Japan, maybe those old brutes under Tojo would finally get their way and turn Canton into a huge garrison; maybe Nanking would be able to hold down the Communists in north-west China on the Loess Plateau before it was too late; maybe the Communists could indeed provide the people with the bright future they had hoped for.\n\n...No, these possibilities never existed to begin with. There is only success ahead, and once it fails it will be all over. To contemplate failure is to acknowledge it. His vision is realistic, his cause is just. It is his responsibility to bring about the future, so nothing can stop it. These problems would be solved, and if not he would continue to stay up here. Another week of all-nighters, another month until the sun burns the earth to a crisp. No failure could be tolerated. Not for anyone under him. Of course, neither could he."
 CPC_TRCW_GNG.3.o: "No man, having put his hand to the plough, and looking back, is fit for the kingdom of God."
 CPC_TRCW_GNG.4.t: "Dost thou hold it in such lowly regard?"
 CPC_TRCW_GNG.4.d: "In the dimly lit office, Komai Kenichiro paced anxiously. The wooden desk was littered with cigarette ashes, and upon it lay the ultimatum from the Chūgoku Kyōsanshugi, demanding Kanton's unconditional surrender. Pale paper, ceaseless ringing telephones, and the flames raging in the streets, all conspired to torment Komai's mind. He and Hitachi were like a boat drifting downstream on the Pearl River, and he knew well that their small vessel was powerless against the impending tsunami that would engulf Kanton. Despite this awareness, despite Hitachi's profits plummeting like a free-falling meteor, and despite his own inner turmoil, when Komai received this ultimatum from the intelligence office, he retained an air of indifference - as if he were eternally the emperor of Kanton, looking down disdainfully upon all. Only a keen observer might have noticed the slight tremor in his withered, yellowed hand as he accepted the document.\n\nAfter much hesitation, Komai answered the phone, and on the other end, he heard a cold and unfamiliar voice, one he had never encountered in his entire life.\n\n\"You've messed up, Komai. Recent events in Chuugoku...let me put it this way, they've exceeded all our estimations.\" The voice on the phone belonged not to Hitachi's CEO, but to the puppeteer of Nissan.\n\n\"Please, sir, I still have...\" Komai tried to interject but was promptly silenced.\n\n\"We've prepared for the worst, and you need to consider your own future now. If you wish to remain in Kanton, you'll have to fend for yourself. We won't offer you any more support.\"\n\nKomai had no choice but to agree and hung up the phone. He slumped in his chair, defeated.\n\nYet, he had not given up. His mind raced, and he picked up the receiver once more, dialing another local number."
 CPC_TRCW_GNG.4.o: "\"General Nagano Shigeto...?\""
 CPC_TRCW_GNG.5.t: "Chaos in the LegCo"
 CPC_TRCW_GNG.5.d: "After a long hesitation, [GNG.GetLeader] finally walked into the Legislative Council building, the noise of the crowd gradually subsided due to his heavy steps - everyone understood that today, with the war between China and the Communist Party getting hotter and hotter, the Guangdong Province had come to the brink of survival, and that perhaps this was the last plenary session of the Legislative Council of the Guangdong Province. plenary session.\n\n\"I have called you all here today to discuss the issue of defence against the Communist Party and internal security...We have introduced a bill, and we will now begin to discuss the vote.\"\n\nWhen they actually saw the content of the bill, even the most moderate members of the Sony faction were stunned - \"Dissolution of the Cantonal Police and the Gendarmerie Ordinance\" in large letters stood out in front of their eyes.\n\nThe meeting was immediately thrown into turmoil. What the legislators did not know was that this was the minimum condition under which Ye Jianying promised [GNG.GetLeader] to peacefully take over Guangdong. Ibuka Masaru and Komai Kenichiro immediately stood up and besieged the Chief Executive with the filthiest vocabulary he had ever known in his life, but he went against his usual tit-for-tat intent, and when the noise of the Fujitsu and Hitachi councillors had died down, he finally spoke up: \"Even if we retained the Cantonal Police and Gendarmerie, we would not be able to resist the Communist hordes that are pressing in on us, and our initiative is purely out of a desire to avoid wasting our labour force in the battlefield. purpose, not the so-called traitors, our defence can be handed over to Japanese responsibility.\"\n\nIbuka Masaru was burning with rage, he pointed at [GNG.GetLeader]'s nose and cursed bitterly, \"You're fucking doing this on purpose, who doesn't know that we can't contact the mainland right now?\" Komai had even torn the ordinance document in front of him to shreds, \"Traitor who turned his back on the Co-Prosperity Sphere, sooner or later you'll be paraded through the streets by the Kenpeitai!\"\n\nThe crowd screamed and cursed and even fought again, leaving [GNG.GetLeader] standing helplessly on the stage, like a child failing a test and being scolded."
 CPC_TRCW_GNG.5.o: "I should never have taken the Chief Executive's mess."
 CPC_TRCW_GNG.6.t: "Political Mobilisation Order for the Liberation of Guangdong"
 CPC_TRCW_GNG.6.d: "To our comrade commanders,\n\nThe battle to liberate Guangdong is about to begin.\n\nGuangdong is the place where our National Revolution began, we must take back the holy land of the revolution from the Japanese and the hypocrites, and we feel honoured to be able to finally expel the Japanese from their 20 years of oppressive colonialism in Guangdong! We must wipe out the vicious pseudo-Guangdong government and the monopolistic plutocrats completely and cleanly, so that we can move on and liberate the whole of China.\n\nThe liberation of Guangdong is a just battle and a battle to be won. Firstly, the workers and peasants of Guangdong have risen up to resist colonial aggression, and the enemy and pseudo-armies, tired of suppressing the people's uprisings, are incapable of responding to our advance; secondly, our comrades of the South China Bureau, who have operated for many years in the back of the enemy's territory, have provided us with sufficient intelligence, and we know Guangdong like the back of our hand; and thirdly, Guangdong's local forces are mostly police units, with a weak fighting strength and low will to fight. and low will to fight. This will be a favourable condition for us to liberate Guangdong.\n\nHowever, the pseudo-Guangdong government is not a lamb to be slaughtered; they may call upon the Japanese invaders to send support at any time, so it is clear that we will face a tough battle next. We must seek to destroy the enemy at the lowest possible cost, using both bravery and intelligence, every battle requires thorough preparation, and everyone must be adept at using technical and political manoeuvres to defeat the enemy. At the same time, we must maintain political discipline, form a good relationship with the people, not take a stitch from them, protect important industrial and technological facilities, and return an intact Guangdong to the people.\n\nAll PLA commanders and fighters should be united with one heart, military discipline, honour and disgrace, unity and progress, and make unremitting efforts to win the battle for the liberation of Guangdong with the fighting posture of \"Pillow Goggle Waiting for Dawn\" and \"Soldier Not Dismissing Armour\", as well as with the fighting style of \"Take Charge\" and \"Don't Rest Until You Win\"!\n\nComrades, let us unite as one and shout together:\nDrive out the invaders and liberate Guangzhou, Hong Kong and Macau!\n\nLin Biao, Chairman of the Central Military Commission"
 CPC_TRCW_GNG.6.o: "Drive out the invaders and liberate Guangzhou, Hong Kong and Macau!"
 CPC_TRCW_GNG.7.t: "Whose High Castle May Yet Be Seen?"
 CPC_TRCW_GNG.7.d: "Two months ago, the Imperial Army's tanks would have made this mob run for their lives, but now they have machine guns, artillery, grenades, and barrels! They want to destroy this building and bury me under it? To hell with Guangdong! I should have gone to the Northwest and wiped out those losers!\n\nNagano Shigeto, trapped in the Kenpeitai command, felt conflicted for a moment, but the current war situation left no room for regrets. Artillery shells whizzed towards the building. Nagano dove to the concrete floor. Then, a dull boom, the building trembled, dust and debris fell on his uniform, already blackened by smoke. He got up and looked around, his heart aching at the sight of his miserable men, and he lost his temper.\n\n\"Why do I have to work with these cowards!? The corporations in Guangdong only care about showing off their money, not the Empire! They waste time on some nonsense police reform, we should have crushed that mob when the riot started, then we wouldn’t be in this mess!\" The others in the room gazed at the mad general, too scared to say anything, while Nagano ranted on.\n\n\"Those useless Kenpeitai drunkards can't do anything right!\" His rage didn't subside, but grew stronger, \"And that idiot Gao Zongwu! He's fighting the reds too, shouldn't he send reinforcements?\" He remembered the absurd scenes flashing before his eyes: the blazing jungles of Malaya, the towering mountains of Colombia... Yes, the fat heads back home didn't care about the fate of the Guangdong Garrison, they only wanted Guangdong to keep sending them gold, they treated him and his soldiers like pawns on a board!\n\nThe door was blown off by a grenade, and a line of black machine guns aimed at the last survivors in the building. Nagano didn't have time to think, he grabbed his command sword, held it shakily by his side, and shouted \"See you in the Yasukuni, banzai-\" as he charged into the gunfire. He wondered, in the brief moment before the bullets shattered his skull, if the enemies they faced in Shanghai and Nanjing years ago had felt the same despair as he did."
 CPC_TRCW_GNG.7.o: "The thing that hath been, it is that which shall be;\nAnd that which is done, is that which shall be done."
 CPC_TRCW_GNG.8.t: "To Whom Can I Lay Bare My Heart?"
 CPC_TRCW_GNG.8.d: "The former Guangdong police force received a surprisingly mild treatment from the Communist Party - those who had been classified as Zhujin were now re-identified as Han, Zhuang, or other ethnicities based on their origin, and those who agreed to help with Guangdong's security were given temporary military police roles after rigorous ideological and political training and placed under the Security Office of the Provisional Commission. This eased Lam's mind, and the huge ethnic gap that had haunted him for decades was finally closed.\n\n\"I am grateful to the Party and the People's Government for giving me the chance to rehabilitate myself and rejoin the people. I will devote the rest of my life to repent and serve the people of Guangdong.\" Lam finished his thought report, put down his pen, and looked out the window. With most refugees evaluated, Yoshiko's role as a Red Cross volunteer was coming to a close - would she leave?\n\nThe dormitory door opened with a squeak, and his temporary military police roommate Lee Chun came in with a letter. They exchanged greetings and Chun handed it to Lam. \"It's from your Red Cross friend. I got it at the reception. Aren't you going to open it?\" He noticed Lam's blank expression under the lamp. Lam replied. \"No hurry. How's your family? Guangzhou is still getting bombed, remind them to keep indoors.\"\n\n\"I just called, they're fine. My little brother got a job as a Japanese interpreter at the Provisional Commission.\" Chun smiled proudly. \"Have you finished your thought report for this week?”\n\n\"Well, I never wrote this kind of thing when I was a police officer, so I'm still getting used to it. You attended the party class at the CCL, can you check if I wrote it right?\" Lam scratched his head and smiled sheepishly. Chun glanced at the envelope in Lam's grip, then at the papers on the table, and a flash of insight hit him. He stroked his chin with a mysterious smile: \"Sure, I'll check outside; it's brighter.\"\n\nAppreciatively, Lam watched Lee Chun shut the door behind him. He tore open the envelope, and under the lamp's glow, he recognized the graceful, yet still somewhat immature Chinese handwriting."
 CPC_TRCW_GNG.8.o: "\"Dear Officer Lam Haau-cyun...\""
 CPC_TRCW_GNG.9.t: "The Letter"
 CPC_TRCW_GNG.9.d: "Dear Officer Lam Haau-cyun,\n\nI have been so busy with the Red Cross work that I only found time to write to you today - this is the first letter I have ever written to you, and I hope it won't be the last. My emotions are overflowing as I write this farewell letter to you, who have been my support for so long.\n\nOur first meeting was not very pleasant. Soon after my father passed away, I became a journalist for the Kanton Fujin Koron, and got into a fight with someone in the market. Your angry face when you came to restore order was not quite appealing - but that's how we became acquainted. You may have thought I was very childish back then. I didn't speak Cantonese at all, yet I interviewed and quarreled on the streets. And since then, you had been sacrificing your work time for my safety. Sorry for causing you so much trouble with everything.\n- - -\nTogether, we travelled the Three Pearls. You taught me the essential social skills in its society, how to read and write in Chinese, and also how to help those poor people who considered Guangdong their home - I owe it all to you.\n\nI remember seeing you on the streets of Guangzhou, and waving at you happily to show you my newly learned \"nei hou\". But then I realized that I had wasted my interview time. So, when you came closer, you saw an annoyed Yoshiko with her arms crossed over her chest - I suppose that was how a young woman's mind works.\n- - -\nSo many memories I wish to share with you, but I'm boarding the plane in just an hour. I will be on my way to Bangkok, and when things settle down, Honshu. Honestly, I don't want to. Guangdong has changed my life completely. With you, the Kanton Fujin Koron, and the lovely people I interviewed and helped, Guangdong is the only place I call home.\n\nI heard a civil rights activist named Martin Luther King Jr. said, \"I have a dream that one day every valley shall be engulfed, every hill shall be exalted and every mountain shall be made low, the rough places will be made plains and the crooked places will be made straight.\" I believe that one day, there will be peace between China and Japan, and I will come back to Guangdong, the home of my heart, and see you again.\n\nWith this letter, I return to you the police badge that I secretly kept when we last parted.\n\nRespectfully yours,\nYasukawa Yoshiko"
 CPC_TRCW_GNG.9.o: "He bade a quiet farewell, his eyes glowing with tears."
 CPC_TRCW_GNG.10.t: "Cozy Winds"
 CPC_TRCW_GNG.10.d: "The former Guangdong police force received a surprisingly mild treatment from the Communist Party - those who had been classified as Zhujin were now re-identified as Han, Zhuang, or other ethnicities based on their origin, and those who agreed to help with Guangdong's security were given temporary military police roles after rigorous ideological and political training and placed under the Security Office of the Provisional Commission. This eased Lam's mind, and the huge ethnic gap that had haunted him for decades was finally closed.\n\n\"I am grateful to the Party and the People's Government for giving me the chance to rehabilitate myself and rejoin the people. I will devote the rest of my life to repent and serve the people of Guangdong.\" Lam finished his thought report, put down his pen, and looked out the window. This relaxed but serious life gradually calmed his restless mind - maybe this was what they meant by liberation? The dormitory door opened with a squeak, and his temporary military police roommate Lee Chun came in. They changed greetings, and Lam asked. \"How's your family? Guangzhou is still getting bombed, remind them to keep indoors.\"\n\n\"I just called, they're fine. My little brother got a job as a Japanese interpreter at the Provisional Commission.\" Chun smiled proudly. \"Have you finished your thought report for this week?”\n\n\"Well, I never wrote this kind of thing when I was a police officer, so I'm still getting used to it. You attended the party class at the CCL, can you check if I wrote it right?\" Lam scratched his head and smiled sheepishly. Lee Chun nodded and walked over to the desk, shaking his head and reading out loud, making Lam blush.\n\nYasukawa Yoshiko sat on the special Red Cross refugee plane to Bangkok, resting her hand on her forehead. She recalled her past ten years - the story of Kanton Fujin Koron was over, but it had left a vivid mark on her first thirty years of life. She remembered all the people she had met when she first came to Guangdong: Suzuki Teiichi, the domestic worker who had lost her job, her editor, her boss who had argued with her at the first interview, and Officer Lam, who had come to keep the peace at that time. Among these people, the one she felt the most fondness for was Officer Lam - as she thought of this, Yoshiko's mind wandered further and further, as if she was still in the fast-changing Guangdong in the 60s - they were in the eye of the silicon storm, any small disturbance could alter history. But life only gives one chance, she smiled, feeling a warm surge in her heart, flying over the South China Sea towards the Pearl River."
 CPC_TRCW_GNG.10.o: "\"Sometimes, I wish I'd known him better.\""
 CPC_TRCW_GNG_ends_tt: "The culture of §YGuangzhou, Hong Kong, and Macao§! will become §SYue§!.\n---------------\n§CTo things that change, and things that won't.§!\nThe tale of £GFX_GNG_Guangdong_texticon §SGuangdong§! concludes, yet its people §mcontinue§! §SStrolling Down the Path of Life§!."
 CPC_TRCW_GNG.11.t: "Suppression report"
 CPC_TRCW_GNG.11.d: "Ye Xiao, South China Bureau:\nOur insurrectionary action in Shaoguan and Chaozhou has met with serious setbacks.\nUnder the authorization of the core figure of the enemy, Stanley Ho, the Triad launched an armed raid on our liaison stations in Shaoguan, Zhujin and other places of the Chinese Workers' Committee, killing and injuring several Chinese Zhujin workers, Comrade Lu Shao-wu was injured while covering the evacuation of Shaoguan liaison officers, and is now secretly sent to Macao, Ma Wan-qi place to receive medical treatment.\nAccording to the Hong Kong and Macau liaison officer's secret report, we are sure that Stanley Ho will launch an onslaught on the liaison stations of the CWCC in Guangzhou, Yunfu, and other places, and we hope that the South China Bureau will give us a reply as soon as possible.\nShaoguan CCL - CPC Liaison Officer: (Name erased)\n\nInstructions: The Triad gangster group is a thoroughly reactionary organization, don't be afraid to fight against it, the South China Bureau has contacted the Central Committee and the Hainan branch, and the next batch of military aid will be transported overland to western and northern Guangdong after the Central Committee has taken full control of Guangxi, your ministry must adhere to the strategy of guerrilla warfare, and in any case, you must first ensure your safety before making a struggle against the riots.\nYe Jianying, South China Bureau\n\n- Ye Jianying put down his pen, his left hand propped up his jaw on the table, and sighed deeply: \"Stanley Ho in the end a gangster origin, at most Morita Li Ka-Shing and other people's handlers...\" He twisted his stubble-covered chin. He twisted his stubble-covered chin. Office aside Ma Wanqi also shook his head: \"The heart is not right, the butcher knife aimed at their Chinese brothers, Brother Ye, how do you plan to deal with him?\"\n\nYe Jianying took off his glasses and started rubbing his temples, \"Diehard elements should either be shot on the spot or taken alive and put in jail to await a public trial.\"\n\nMa Wanqi thought for a moment and offered his thoughts."
 CPC_TRCW_GNG.11.o: "\"Why don't I make an inviting trap?\""
 CPC_TRCW_GNG.12.t: "Piteous Entreaty"
 CPC_TRCW_GNG.12.d: "\"Please, let's go to Thailand at least. How can you stay here and let the communists ruin our life's work, Akio?\" Li Ka-Shing pleaded as he walked nervously in Morita Akio's office.\n\n\"I don't think they will.\" Morita sighed. \"Ka-Shing, we have invested our heart and soul in Guangdong for a decade, defending the workers from Fujitsu and Matsushita's exploitation, providing housing for the poor, and even…\"\n\n\"Even what? Getting captured?\" Li cut him off. \"We are capitalists to them, do you know what the Soviets did to our kind? Bullets. How many grievances will you take to the grave with your dead companions?\"\n\n\"I trust that I can shield Guangdong from the war, it's my duty, I made a vow when I fled to Guangdong fifteen years ago, Ka-Shing, I have no other place to go. I would be hanged in Japan, Guangdong gave me a chance to live, and I won't leave it behind.\" Morita's resolve wavered as his white hair quivered.\n\nLi was speechless, he gazed at his old friend with a mixed feeling and realized that he was so different - maybe they were never alike, Morita vowed to make Guangdong a haven of idealism, but Li never thought that he would foolishly die with it.\n\n\"Farewell then!\" Li Ka-Shing stormed out of the door, leaving behind Morita Akio, still slightly trembling."
 CPC_TRCW_GNG.12.o: "Former friends parted ways."
 CPC_TRCW_GNG.13.t: "A Negotiation"
 CPC_TRCW_GNG.13.d: "\"I thought you'd invite Li Ka-Shing and Stanley Ho.\" A troubled Morita pushed his glasses, a fine one - of tortoise shell, as he sat in the secret parlor the South China Bureau had set up for his very being.\n\n\"Didn't know anything of Li Ka-Shing. The CCL mobs made intrusion into his residence, only to find an emptied house - after that there's no more news of him. Fled perhaps.\" Ye Jianying didn't take unworthy time for his tea, \"As for Stanley Ho - there's others to settle him, so it's not my job.\"\n\n\"As for you, Mr. Morita, \" Ye Jianying looked at Morita Akio with a wry smile, \"Your presence notifies your consent for our cause, I presume?\"\n\n\"Should Guangdong return to peace undeterred...\" Morita nodded, \"May one enquire if his capitulation may benefit himself, as...\"\n\nYe Jianying didn't respond, he interrupted. \"As I recall, it was Unconditional Surrender our proposal entailed. \"he deliberately made accent. \"We are not at square one when it was open to proposals. An ultimatum, this is. You either force an armistice for our smooth takeover, sparing your life as well as many other Japanese for our mercy or you resist, then we force an armed occupation and you all subject yourselves to the military tribunal.\"\n\n\"...even counting on my dedication to Guangdong after all...?\" the question was raised by Morita, one discontent with Ye's judgement.\n\nYe Jianying finished his tea and stood up, looking down condescendingly at Morita - after a full fifteen seconds had passed, issued his final verdict."
 CPC_TRCW_GNG.13.o: "\"Rubbishing about sacrifice you are?\"\n\"Ineligible comparing to People of all Guangdong.\""
 CPC_TRCW_GNG.14.t: "End of the Line"
 CPC_TRCW_GNG.14.d: "- Bangkok International Airport, Thailand -\n\nLi Ka-Shing had never experienced such a profound sense of relief, not even when his status rivaled that of the Chief Executive in the \"Land of Opportunity,\" amidst the greatest wealth aggregation within the Sphere. But today, his reassurance was unparalleled. Guangdong was once his sanctuary, where he amassed fame and wealth before chaos ensued. The riots brought nothing but agony; his enterprise was reduced to ashes, his residence pillaged. His prompt decisiveness spared his family, though he remained concerned for a friend too obstinate to steer clear of conflict.\n\n\"Chief, the villa is ready. Young master and Madam are already there,\" announced his secretary, dispelling his anxieties. With a nod, Li grasped his suitcase and made his way to his private vehicle. Though the nightmare of Guangdong might forever haunt his nights, for now, the rays of the sun promised a relieving day.\n\n- Ma Man-kei's Private Residence, Macau, Guangdong -\n\n\"Could you enlighten me as to why you've called upon me during such trying times?\" Stanley Ho had a nagging suspicion that Ma Man-kei's intentions for inviting him to Macau were less than benevolent.\n\n\"Remember the dinner here, with you, Ka-Shing, Akio, and the others?\" Ma's voice was icy. \"I declared then that I'd never refuse help in times of trouble, barring crimes. Yet now, a decade later, it seems you, Stanley Ho, have raised your sword against your own people.\"\n\n\"Uncle Man, please, that's not the case…\" Stanley Ho began, only to be cut off. \"Silence! Recall Macau's rule: upon your arrival, your life is forfeit to all.\" Ma's tone grew increasingly harsh, and as he uttered the word \"life,\" PLA soldiers burst into the room, guns at the ready.\n\nConfronted with the grim barrels, Stanley Ho accepted his fate, offering a sorrowful smile.\n\n\"You're correct, Uncle Man. I've erred.\""
 CPC_TRCW_GNG.14.o: "The dust settled."
 CPC_TRCW_GNG.15.t: "Things We Lost in the Fire"
 CPC_TRCW_GNG.15.d: "Morita Akio perched in his office on the fifteenth floor of the erstwhile Sony Central Building, absorbed in the serene sunlight bathing the room, his thoughts clouded with frustration. The dawn of the next day would mark a significant shift; the building was to be claimed by the Hong Kong Interim Commission, and Morita himself was to be appointed as a special advisor, tasked with aiding the Communist Party's integration efforts.\n\nAs the door creaked open, Morita was greeted by the somewhat unfamiliar visage of Xiao Xiangrong, the Director of the Interim Commission, accompanied by a youngster. \"He's Lee Hei, a bright mind familiar with Japanese, so I've chosen him as our interpreter,\" Xiao Xiangrong remarked with a smile, gesturing towards the boy, who nodded. \"It is okay. I'm fluent in Cantonese and understand Mandarin,\" Morita responded in clear Cantonese. \"Has Director Xiao come to survey his new office for tomorrow?\"\n\n\"Not at all, I was merely seeking your company for a chat. I assumed you would be here, so I came - Comrade Ye Jianying and others have been dispatched by the Military Commission to oversee the battlefront. Thus, I believe the unification of China is imminent,\" Xiao Xiangrong explained. Morita felt a twinge of discomfort at terms like \"comrade\" and \"liberation\": \"I'm still puzzled about the difference between your 'liberation' and China's - I mean the Republic of China's 'reclamation'. To me, both seem like a quest for power, a reconquest of lost lands…\"\n\n\"It does carry that connotation, but perhaps there's an additional layer of meaning. Why not ask him instead?\" Xiao Xiangrong suggested with a smile, nodding towards Lee Hei, who sat nearby. \"Lee Hei, how would you describe life under Morita's leadership?\"\n\nAfter a moment's hesitation, Lee Hei spoke up shyly, \"Compared to others, Mr. Morita might… show a greater concern for our well-being in Guangdong…\" A smile graced Morita's lips: \"It appears my decade-long efforts weren't for naught.\"\n\n\"…However!\" Lee Hei's voice grew firmer, challenging the current HKIC advisor's view, \"No offense intended, but honestly, I wish for a more liberated, dignified existence in a Guangdong free from the corporates.\"\n\nA complex smile, tinged with both bitterness and relief, slowly emerged on Morita's face as he gazed at Xiao Xiangrong and Lee Hei, lost in contemplation."
 CPC_TRCW_GNG.15.o: "Tenderly, they turned to dust all that I adore."
 CPC_TRCW_GNG.21.t: "Reminding"
 CPC_TRCW_GNG.21.d: "\"A meeting request from the Chinese Consulate General?\" The anxious Matsushita Masaharu was currently walking through the corridors of the Matsushita headquarters building to get to the next police coordination meeting, \"Tell Song Zhiguang if he can schedule it for tomorrow...\"\n\"Consul Song said he's waiting for you in the parlor, he won't leave until you come.\" The secretary trotted along behind him. Matsushita secretly rolled his eyes and let out a long breath.\n\nIt was bad, no matter where it was, inside Canton was being turned upside down by the mobs, and outside of Canton - hell, the Communist war outside had killed untold numbers of people, and the casualty figures were even close to matching Matsushita's monthly turnover in Canton.\n\nIn the dead of night, Matsushita, who had just escaped from the conference room, tentatively pressed the elevator button that led to the floor where the parlor was located, and as the floor numbers jumped, he began to pray that Song Zhiguang would have the good sense to leave - so that at least he could go home and get some sleep without any psychological burden. His hopes were still dashed the moment the elevator doors opened and the parlor was brightly lit.\n\n\"Mr. Song, I'm really sorry, the police meeting took too long, making you wait until so late...\" He walked into the room with a smile on his face, while Song Zhiguang seemed refreshed and straight, sitting on the guest sofa.\n\n\"No, it's just the right time of the day, and I was only willing to wait so long because I really had something urgent to do.\" Song Zhiguang returned a polite smile, \"To make a long story short, you and I both know that Guangdong is in trouble both internally and externally right now - the President has just given the Consulate General orders to withdraw the high-level envoys, the war in China is tight, the Communists are attacking one city after another, and they've now even pressed their armies against the Guangdong border. \" Matsushita nodded: \"I understand, it can't be helped...\"\n\nSong Zhiguang's words turned: \"I am able to leave, Guangdong can't stay I can still go back to Nanking - what about you, as the administrator of Guangdong, can you just walk away?\" Matsushita shook his head, \"I believe the Empire will not abandon us...\"\n\n\"It is the Empire's Matsushita that will not abandon you.\" Song Zhiguang said with cold sarcasm, \"Think more about your own future, Mr. Matsushita, don't get yourself killed, Guangdong can't afford a second destruction.\"\n\n\"Do you mean that I should surrender to the Communists?\"\n\n\"I didn't say that, I'm just offering you a bit of advice out of years of working together, so, farewell.\" Song Zhiguang picked up his jacket and got up to bow."
 CPC_TRCW_GNG.21.o: "Matsushita sat dejectedly on the couch, pondering Song's remind."
 CPC_TRCW_GNG.22.t: "Pillow Talk"
 CPC_TRCW_GNG.22.d: "Matsushita Masaharu returned to his own mansion after a long time - the reason why I say after a long time is really because of such a special period, a trip home has to go through the mountain of knives and the sea of fire, Yuko was shocked to see her husband push the door in, and hurriedly jogged over to take off his jacket for him: \"Is the street still safe? You just come back and call home regularly.\"\n\n\"I've had my eyes opened, there are definitely communists behind the CCL: improvised barricades, Molotov cocktails, and guess what else they've got-\" Matsushita Masaharu grumbled harshly at his wife, \"- they've got our experimental foot soldiers. -They actually have our experimental rifles, hell knows how they learned the location of the armory.\" Sachiko sighed and assisted him into the bedroom, \"Don't say much more, take a shower then get some rest for the night.\"\n- - -\nMatsushita looked particularly tired after his bath, letting his heavy body slam onto the spring bed before rolling over and letting out a long sigh.\n\nSachiko's warm palm stroked his spine, \"Tired, aren't you.\" Matsushita was silent.\n\n\"I've actually always thought that it's too tiring for you to be in the position of Administrator; Canton wasn't meant to be a place for mere business.\" Sachiko's murmur still lingered in her ears, \"Even if I've been taking care of your housekeeping at home, I still know more or less a little bit about what you guys have been doing outside...Husband, I don't like politics, I'll go talk to Dad about letting us...\"\n\nMatsushita waved her hand in annoyance, \"Sachiko, I'm tired, let me rest.\"\n\nHearing this, Matsushita Sachiko stopped speaking and patted her husband on the back."
 CPC_TRCW_GNG.22.o: "\"Oyasumi nasai, Masaharu.\""
 CPC_TRCW_GNG.23.t: "Rainy Night Bell"
 CPC_TRCW_GNG.23.d: "It was another midnight. Thunder and rain crashed on Koshu, like an attempt to quench the flames that engulfed the city. Matsushita Masaharu sat at his desk, reviewing the report of the rioters' attack, when a phone call interrupted him.\n\n\"Hello?\" He answered impatiently, recognizing his father's voice despite the poor signal. \"Father? What are you doing? Aren't you in Osaka? How can you reach Guangdong now?\" Masaharu panicked.\n\n\"I wanted to see you and Sachiko in Guangdong, but it's too risky to leave the home island. I'm worried about you two, so I came to Taiwan on the pretext that I had to transfer our assets. I'll leave in two days - is Sachiko safe at home? \"\n\n\"She's fine, the police and the Kenpeitai are guarding our place, but I can't go back, I only call her every day.\"\n\n\"I'm glad she's fine.\" Konosuke sounded relieved. \"Come back to Osaka, Masaharu, you can't solve the situation in Guangdong by yourself, or with Matsushita's help.\"\n\n\"What about our assets in Guangdong?\"\n\n\"Forget them, Masaharu, you remember the General Mobilization, don't you? This is not a simple internal conflict between the Nationalists and the Communists. It's a continuation of the Japan-China War.\" Konosuke's voice trembled. \"Matsushita may have many ways to make money, but my son and daughter's lives can't be risked.\"\n\n\"Father, I know what you mean, but I wish to fulfill my last obligation to Guangdong before it's over.\" After a long quiet moment, Masaharu made up his mind.\n\nKonosuke also remained quiet for a long while, before he spoke again."
 CPC_TRCW_GNG.23.o: "\"Whatever you do, be careful, and stay safe.\""
 CPC_TRCW_GNG.24.t: "Sayonara, Matsushita"
 CPC_TRCW_GNG.24.d: "This should be the last day Matsushita Masaharu stayed in Canton, he sat in a tent specially built by the Red Cross, and beside him was his married wife of thirty years, Matsushita Sachiko, despite the rags, Matsushita had never felt so practically alive. He clutched his wife's warm but also deteriorating hand, \"On the first day of the war, I sent Atsuko and the girls back to Osaka ahead of time, now it seems that this decision is really wise, otherwise we can't be seen in this state...\"\n\nSachiko chimed in with a wry smile, \"What a saucy thing to say...\" She skimmed her eyes to see an unfamiliar man lift the tent curtain and walk in, followed by a young woman, \"Ryoko-sama! \" Yukawa Yoshiko, who was also in the same coterie of Cantonese noblewomen, instantly recognized Yasukawa Yoshiko, the young baron's daughter wearing a red cross armband on a white background. Matsushita Masaharu followed the sound of the voice, but uttered another name: \"Mr. Ye Jianying?\"\n\n\"Yasukawa Yoshiko is now a temporary Japanese volunteer with the Guangdong Red Cross, and I have asked her to serve as an interpreter between you and you.\" Ye Jianying gestured as he spoke, \"Thank you for your efforts over the past period to delay the Japanese government and assist us in the peaceful liberation of Guangdong, Mr. Matsushita, I have come here today to say goodbye to you - of course, your trip back home is going to be slightly more unique, so Ms. Ryoko will convey that on my behalf. \"\n\nRyoko nodded and crouched in front of Mr. and Mrs. Matsushita, \"After the Red Cross enters Guangdong to assist in the evacuation of the refugees, every three days a special Thai Airways plane will transfer the Japanese refugees to Bangkok.\" Matsushita looked at Ye Jianying, \"So is that why we have to go to Bangkok and then wait for the Red Cross to coordinate?\"\n\n\"No, no, no, Mr. Matsushita you don't have to go through that trouble.\" Yasukawa Yoshiko waved her hand hastily, \"Old Mr. Matsushita Konosuke has already been waiting in Bangkok for two days, and after arriving in Bangkok, you and your wife will return to the home island on Matsushita's special plane immediately tomorrow.\"\n\nSachiko cast a grateful glance, \"And you?\"\n\nYasukawa Yoshiko scratched his head and smiled blushingly."
 CPC_TRCW_GNG.24.o: "\"I'll go back with the last group of refugees.\""
 CPC_TRCW_GNG.31.t: "Suddenly We Heard Water Burst a Silver Jar"
 CPC_TRCW_GNG.31.d: "The sun was setting at five o'clock, painting the dark clouds over Koshu with a dismal yellow hue. The world held its breath, waiting for the night to pass its verdict. The noise and commotion of the streets subsided, and the twilight whispered of the city's dirt and decay.\n\nI despise and tremble at dusk. It is the sun's final gasp, a mournful tune at the end of the journey. Before the sun disappears behind the horizon, the city's towering skyscraper devours its last words, throwing a massive shadow that covers and silences the world, with the rotten happily feed on the nourishment of darkness.\n\nDusk is the end of the day's life, the eruption of all the sorrow and despair that has built up, and the first crack of the silver jar, when it cries out, \"O ye folk, what worth hath the light of day that ye laud? For as ye have wrought edifices to shroud it, so hath the night supplanted it.\"\n\nOn the bleak and indifferent stage of the city, the ugliness of humanity is fully exposed. No escape, no redemption.\n\nI fear my own power to hurt, manipulate, and kill others, yet I cannot distinguish myself and my kind from our humanity. I cannot make us - me too - what we deserve. The rot that infects Guangdong is the fault of the people, Fujitsu, and myself, Chief Executive Ibuka Masaru.\n\nI took out a pen, and scribbled my symbol on the sign of disgrace.\n\n--------\n\nOutside the windows, a sudden downpour, and in that instant, neon lights of ivory and sapphire illuminated the heart of Guangdong."
 CPC_TRCW_GNG.31.o: "Report: Unsuccessful Suppression of Dissent\nSignature of the Chief Executive: Ibuka Masaru"
 CPC_TRCW_GNG.32.t: "Questions of the Lost"
 CPC_TRCW_GNG.32.d: "As the storm subsided, sunlight pierced through, illuminating leaves strewn across the ground, now tranquil after the tempest's fury. In the serene expanse of Canton Shrine's courtyard stood Takashima Masuo, inhaling deeply the rain-freshened air, now cleansed of industrial taints. A solitary figure, Takashima was the shrine's most faithful visitor. Its hallowed grounds, once bustling, lay mostly abandoned, especially since the upheaval. Only a handful of entrepreneurs, their fortunes dashed by the oil crisis, had sought solace here, as recounted by the shrine's caretaker before his retreat to his ancestral island.\n\nYet, for Takashima, such matters held little consequence. With no one left to tend to the shrine, he embraced the role with idle hands. The storeroom's lock had been pried open, its contents plundered, save for a cumbersome broom, too unwieldy for thieves to bother with. Grasping it, Takashima set about his task, sweeping the courtyard's edges with care. The broom's bristles danced lightly over the damp earth, corralling the scattered leaves into neat mounds. Time lost meaning as he worked, until at last, he paused, content, and returned the broom to its place. Bathed in the clarity of sunlight, the deserted Main Hall stood solemn against the azure sky.\n\nThe echo of approaching footsteps was familiar, yet Takashima required no visual confirmation; he already knew their owner. \"Chief Executive Ibuka,\" his voice steady, as the deliberate steps drew near. \"Your presence in this forsaken shrine speaks volumes. Yet, permit me to inquire,\" Takashima continued, leaning back with a weary exhale, \"to what end does your mission lead you?\"\n\nIbuka, facing Takashima's silhouette, clutched the hidden crucifix, his intended words faltering. His thoughts drifted to Tomeko, stricken with fever, her plight fueling his resolve to spread enlightenment from Guangdong's revered soil. His vision of an Engineer's Paradise, a beacon for all seeking wisdom, was his alone to forge. With the might of Behemoth, he aspired to cleanse the corrupted Leviathan.\n\n\"Your silence is your response. One seeking the Shinto way might consult the kannushis from the Home Islands. Yet, these shrines, desecrated by Guangdong's legions, leave us bereft of choice in determining our destiny.\" Takashima turned, his figure brushing past Ibuka, leaving behind a parting message as he traversed the fallen torii, vanishing into the expanse beyond."
 CPC_TRCW_GNG.32.o: "\"Cherish the time in pursuit of answers.\""
 CPC_TRCW_GNG.33.t: "Blue Like Him, Inside and Outside"
 CPC_TRCW_GNG.33.d: "What was going on?\n\nWhat in the bloody hell was going on?\n\nNagano Shigeto, Lieutenant General of the Imperial Japanese Army and commander of the Guangdong garrison, was not happy, not happy at all. Those lawless good-for-nothing shitheads, Chinese and 'Zhujin' alike, were making a ruin of Guangdong and defying the government, spreading chaos wherever the hell they fucking wanted. After hearing yet another report of worsening Chinese lawlessness, Nagano lost his temper and decided to get hold of that pencil-head Ibuka at the Office of the Chief Executive.\nAn automated voice sounded.\n\"Thank you for your call to the office of His Excellency, the Chief Executive of the State of Guangdong. Regrettably, the Chief Executive is unable to receive your -\" Slam. Click. Dial again.\n\"Thank you for your call to the office of His Excellency, the Chief Executive of the State of Guangdong. Regret -\" Slam. Click. Dial again.\n\"Thank you for your call - \" Slam. Click. Dial again.\n\"Thank you for your call to the office of His Ex -\"\n\nNagano slammed the phone on his desk and threw his cap against the wall. This was it, then. They had no communication with the home islands, and that fucker would rather curl up in a corner than face the mess he made.\n\nThe ringing of the phone startled him. He spun around and gazed at the phone on his desk with disbelief - was it possible that the home island had finally reached him? He grabbed the phone eagerly, and the rainstorm outside hammered on the glass windows, creating a weird harmony of white noise with the phone's hum. \"Lieutenant General Nagano speaking.\""
 CPC_TRCW_GNG.33.o: "This is Ibuka. I wish to discuss military control with the garrison."
 CPC_TRCW_GNG.34.t: "Judgment Day"
 CPC_TRCW_GNG.34.d: "\"...Now this court allows the defendant to make a final statement.\" Zhao Tingfeng coldly looked at Ibuka Masaru who was wearing a prison uniform, while the latter at the moment raised his right hand in front of his chest and gestured a cross, \"Once I wanted to create a place, a place where people struggled and worked hard for things they couldn't even imagine, I hoped that I could contribute more to the people of this land, I hoped that they could build the future with perseverance, intelligence, and determination, and that's exactly what I tried to cultivate, and which I have failed to show myself, but reality has not given me that chance after all, and my story is finished, just waiting for you all to pronounce my final fate as a lost man.\"\n\"Have you finished your statement?\"\n\"Yes, please pronounce the sentence, Mr. Judge.\"\n\nZhao Tingfeng nodded his head, mixed feelings - ten years ago he was in Hohhot to try the Mongolian prisoners of war, now he was in Guangzhou to try the Guangdong plutocrats, it was really like a lifetime ago - he took a deep breath, his thoughts falling back to reality.\n\n\"All rise, the verdict will now be read.\" Zhao Tingfeng's solemn voice echoed in this makeshift courtroom.\n\n\"This court finds that the defendant Ibuka Masaru has committed a clear crime, the evidence is solid and sufficient, and based on the provisions of Articles 3, 4, and 7 of the Jurisdiction and General Provisions section of the Charter of the National Defense Front Military Court, the verdict will now be read as follows:\n\nFirst, the criminal Ibuka Masaru is guilty of war crimes, crimes against humanity, and crimes against peace, and the punishment for all the crimes is determined to be the death penalty, suspended for two years, and deprived of political rights for life. By the provisions of Article 4 of the Criminal Procedure Part of the Charter of the Military Court of the National Defense Front, the convict Ibuka Masaru shall not be subject to a reduction of sentence or parole.\nSecondly, to seize all the industries of Japan Fujitsu Company in Guangdong, and to seize all the profits gained by the defendant Ibuka Masaru from his illegal profits during the period when he served as the pseudo 'Cheif of the State of Guangdong'.\n\nIf you are not satisfied with this judgment, you may appeal to the Provisional Supreme People's Court through this court or directly to the National Defense Front within fourteen days from the second day of receipt of the judgment.\""
 CPC_TRCW_GNG.34.o: "Ibuka Masaru hung his head low and said nothing."
 CPC_TRCW_GNG.41.t: "A Hong Kong Conspiracy"
 CPC_TRCW_GNG.41.d: "On weekdays, Komai Kenichiro preferred to stay in his office than to go and meet with the representatives of the home island. All it took was a bottle of sake for him to sit idly in the Administrator's office for the rest of the day. Now that the riots were in full swing, he had even more reason to stay behind closed doors - a blessing in disguise, as Canton's external channels of communication had been largely cut off, and he instead had full decision-making power in administrative matters. Taking a sip of the sweet liquor, he picked up the phone that had given him all sorts of stress in his day and dialed a number.\n\n\"Lieutenant General Nagano Shigeto, this is Komai. How is the situation on your end?\"\n\n\"The military is very vocal, the news of the riots is getting worse by the day, and the scenes of chaos printed in the media have stirred up a lot of outrage.\"\n\nOutrage? Who was outraged? Komai naturally knew exactly what Nagano wanted. The word outrage was not so much for the riots as it was born out of the current state of corporate control in Guangdong. It was the Great East Asia Province and the main headquarters of the home island that had handed over the Imperial Army to a group of corporations to support, and Takashima Masuo was merely their sounding board. Now that GD had lost contact with the home island, it was clear that the military would not cooperate with the Chief Executive for too long.\n\nHe pondered for a moment and decided to grant Nagano a wish while he was still willing to act in cooperation with himself, the Administrator. He believed that he was wise enough to grasp the young general and try to get him to stop before his behavior got out of hand."
 CPC_TRCW_GNG.41.o: "\"Lieutenant General, I wish to ask the Japanese Military Department to suppress the riot.\""
 CPC_TRCW_GNG.42.t: "Secret order"
 CPC_TRCW_GNG.42.d: "Comrade Song Zhiguang, Special Agent of the South China Bureau:\n\nRecently, the situation in Guangzhou, Hong Kong, and Macao has been grim, the pseudo-Guangzhou Administrator Komai Kenichiro has authorized the Japanese Imperial Army in Guangzhou, Lieutenant General Nagano Shigeto to command his division to suppress the uprising in Guangzhou, Hong Kong, and Macao, and the comrades of the underground party in the White Zone have cracked a large number of secret telegrams to confirm that the Japanese Army in Guangzhou is promoting the investigation of the \"Consulate General\" of the Republic of China in Guangzhou and that due to the special nature of your identity you are likely to be exposed at any time. Because of your special identity, you may be exposed at any time. The Central Committee hereby orders you to transfer to the rear of Sichuan with the assistance of the relevant comrades of the CCL of the South China Bureau.\n\nThere is no need to worry about the safety of your family. The South China Bureau successfully escorted your family to Guizhou the day before yesterday, and they are expected to arrive in Chengdu in two days.\n\nThe enemy's investigation is progressing very fast, please make sure to destroy all sensitive information including this letter within three days, there will be a Nissan car parked at the Consulate General's south gate, the third lamp post from the left in three days, when the sun goes down, the South China Bureau will organize a siege of the Consulate General by the CCL and the workers of the Canton Federation of Trade Unions, at that time, our special correspondent will disguise himself as a staff member to make contact with you and escort you to leave in secret, and your interrogation password is: How is the CCL outside? The password for your inquiry is: How is the Chinese Labor Committee outside? Your password will be: How is the Chinese Labor Committee outside? The password of our special agent will be: It is not very optimistic, please evacuate immediately. Please confirm the password before following the instructions. If the counterpart does not match the password and insists on taking you away, please insist on staying at the Consulate General, otherwise you may fall into the enemy's trap!"
 CPC_TRCW_GNG.42.o: "Central Military Commission, [GetDateText]"
 CPC_TRCW_GNG.43.t: "Diary of a battle in western Guangdong"
 CPC_TRCW_GNG.43.d: "[GetDateText], cloudy\nIt became increasingly difficult to supply the enemy forces in Guangdong. With the main seaports blockaded, the Japanese Empire switched to airdrops as the main means of supply, but it was not easy to drop supplies from the air to the front line in Guangdong. The western part of Guangdong was mountainous and foggy, with poor visibility, so the suitable air-drop field was very small. Since our anti-aircraft guns had formed a blocking fire net over western Guangdong, enemy planes dared not fly low and could not drop supplies accurately, and some of the supplies dropped at high altitude and even landed on our army positions. Most of the supplies dropped to enemy positions were destroyed by my artillery fire under the dispatch of my South China Bureau in conjunction with the CCL and the GWU. According to the estimation of the intelligence department, the daily supplies dropped by air and delivered to the western part of Guangdong amounted to only 5.5% of the amount of supplies under normal conditions in the past, and the Japanese and the hypocrites could only live on their reserves by hiding in tunnels and bunkers. According to the report of the South China Bureau, the enemy commander Nagano Shigeto and others regarded the CCL, the Canton Federation of Trade Unions, and other insurrectionary light infantry teams as thorns in their side and wanted to get rid of them as soon as possible, and every day after nightfall there were small groups of enemy infantry determined to fight with my CCL's internal response team despite the obstruction of my artillery fire, and the current casualties of CCL's armed units in the western part of Guangdong Province were reported to be a total of 411, and according to the intelligence, the enemy had already suffered more than 3,000 casualties in the course of my artillery strikes and intelligence cooperation. According to intelligence, the enemy has suffered more than 3,000 casualties as a result of our artillery strikes and intelligence cooperation."
 CPC_TRCW_GNG.43.o: "There's heavy fighting on the front lines."
 CPC_TRCW_GNG.44.t: "Fire to the sky"
 CPC_TRCW_GNG.44.d: "Even though he was already patrolling the streets in his brand new Type 7-1 uniform, holding all kinds of company experimental weapons seized from the warehouse, Lee Chun still felt dreamy about this new life - Komui's criminal empire destroyed, and by that communist? He still can't believe this fact, and his soul was about to rot in Komai's bloody and sweaty hell until the CCL took him out of the factory; then the South China Bureau of the Communist Party, where he saw the real Ye Jianying, whom the Kenpeitai had failed to catch even after fifteen years of posting wanted notices, and who, along with the rest of the Communist Party, began to teach the CCL how to organize workers' armed uprisings and how to fight against the powers that be; and then the PLA came, and he was specially recruited as a Guangdong activist of the CCL into the PLA garrison in Guangzhou to participate in the aftermath of Guangdong...\n\nGuangzhou's military control was not yet over; the patrol turned the corner, and the sharp-eyed reconnaissance sentries had already spotted a nondescript Nissan car running askew toward them on a wrecked perhaps the driver had also seen clearly that there was a patrol on the road, and the Nissan braked sharply to throw off its tail and crashed fifty meters from the patrol into the Fire hydrant.\n\nLee Chun waved his hand, everyone immediately went into combat mode, all of them stared and waited for the car door to open - an old man in his seventies stumbled and rolled out of the car, \"It's Komai!\" The sharp-eyed sentry immediately yelled.\n\nHearing the word \"Komai\", Lee Chun seemed to lose his mind: his ten years of miserable life is all because of the State of Guangdong, all because of Komai Kenichiro and his Manchurian enterprises, the original beautiful beautiful Guangdong also because of Hitachi's arrival has become withered and rotten...\n\nEveryone watched in amazement as Lee Chun leaped up and snatched the Hitachi experimental RPG in the hands of the man next to him, dropping to one knee to aim it at Komai Kenichiro, who was staring at him in disbelief."
 CPC_TRCW_GNG.44.o: "May the fire of ignorance scorch his sinful soul until hell is destroyed."
 CPC_TRCW_GNG_FINAL_BATTLE: "We will liberate Guangdong by force."
 CPC_TRCW_GNG_FINAL_negotiations: "We will liberate Guangdong in peace."
