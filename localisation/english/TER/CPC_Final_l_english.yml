 CPC_TRCW_end.8.t: "A China of the New Proclaims"
 CPC_TRCW_end.8.d: "At the behest of a sunny morning, Comrade He Ping, at his post in the familiar yet now solemn studio in the capital of China, now holds the script bearing all hopes and dreams of the people. He, newly appointed as the first moderator of the Radio People's China, shall be honored with the sacred mission, to herald the new age to the Chinese people. With longing towards the future and the past flicking in his eyes, He shall began as all of China shall hear, that a new age is hereby summoned upon. \n\n\"To fellow compatriots of China: Throughout ages of strife and turmoils of war, the sunlight of peace is upon us.\" He switched his tune to one of warmth, bearing strength, soul and will. He's voice shall not only seal the war, but also summon a new life for all.\n\"For the Liberation, for the Freedom of the Chinese People, many have sacrificed themselves. Of comrades, of cameraderie, lovers and friends, those we have loved and those who loved.\"\nIt is those who strives and withstands the turmoils that reaches people's mind. Those who fought through the plains of Heluo, the ranges of Shanxi, the lands of Huabei, the hirsts of Nanjing. Those who march into the hinterlands of Yun-Gui, the Grotesque of Guangdong, the Frost of Dongbei. All of the PLA warriors, the toilers, the students, the peasants. All of the Named, and all that was unnamed. It is in this spectacle of history and hope He Ping has illustrated. All of the People of Heroes marching through all of China, and sheads their blood radiating its domain crimsom.\n\"At this moment, we may finally declare our Victory. One of the Chinese People, and One of the People across the globe.\"\n\"The Revolution in China arrives with the masses of a nation, united under a consolidated Front dedicating itself to the revolution. The Front has proven to be wide, stretching from the Working Class, the Peasant Class, all of the Petty Bourgeoise and its National Bourgeoise counterpart. We have built a front so strongwilled against any enemies and all hardships, and so well equipped against them. It is proven that the imperialism, however they may push on to obstruct the Chinese People, shall only watch in horror as the Chinese People achieve one after another unto a final triumph.\"\nHe Ping's Voice echos, not only through the mountains and seas of China, but also throughout the memory of a generation, penetrating itself into the history.\n\"And We the Chinese People hereby Proclaims to all of the world: That We shall oppose none other than the imperialist world order seeking oppression and invasion, one no doubt fascist, no doubt of the oppression of the people liberated across the globe, which shall be destroyed by the people of all the world for Liberation. Here we have triumphed in an age where fascist imperialism reaches their final collapse. \"\n\n\"Envisioned are the Chinese People as well as People of all the world, that the fate of China, once returned to its own people, shall be sealed. China shall radiate all of its brilliance as the Sun has risen, purging herself of all the foul leftovers of the reactionary rulers, with its scars of wars all healed. It is only rightful that we strides upon a China, new, formidable, true to its name.\"\n\"Rise my Compatrioits-\""
 CPC_TRCW_end.8.o: "\"For China of the New!\""
 CPC_TRCW_end.402.t: "Northen Frog"
 CPC_TRCW_end.402.d: "Occasionally, the cold morning fog of North China mingles with the smoke billowing from trains, intertwining hot and cold, blending light and shadow in a fickle dance of uncertainty.  \n\nEvery dozen steps along the platform stands a fully armed military policeman, their caps adorned with red stars. They hold their rifles upright, gazing straight ahead, awaiting the arrival of a figure of great importance. Toward the end of the platform, where the railway stretches into the horizon, a high-wattage train light pierces through the North China mist, casting its incandescent beam onto the station—this is the special train of Lin Biao, Chairman of the State of [CPC.GetName], Chairman of the Central Committee of the Communist Party of China, and Chairman of the Central Military Commission.\n\nWhen the train arrived, there were no bouquets of flowers or bustling crowds, only rifles glinting with cold steel under the pale light, and Li Zuopeng, Commander of the People's Liberation Army Navy, waiting patiently on the platform.  \n\nChairman Lin Biao, clad in an army-green overcoat, emerged from the steam billowing from the locomotive. Li Zuopeng immediately stepped forward to greet him, but Lin merely nodded briefly, said a few low words, and proceeded alone toward the station’s exit.  \n\nAnother figure descended from the mist of steam—Ye Qun. She hurriedly ran to catch up with Lin, as if eager to report something of great importance. Yet, within seconds of walking beside him, she abruptly turned back. In the piercing wail of the train’s whistle, whatever was said between them remained shrouded in secrecy—there would be no historical record of what Lin Biao said to Li Zuopeng, nor what he discussed with Ye Qun on this cold morning.\n\nPerhaps that was precisely the effect Lin Biao desired. His silhouette slowly faded into the swirling mist of North China—disappearing like a shadow swallowed by the fog."
 CPC_TRCW_end.402.o: "All that remained was that cold yet bewildered gaze."
 JAP_Chozen_Naikaku: "Cabinet of Decree"
 JAP_Chozen_Naikaku_desc: "It is the Third Sino-Japanese War that rendered the Empire of Japan faceless as the rusk in the Kalter Krieg. The Kyoei Ken is scattered along with the scam of \"Pan-Asian Prosperity\" imposed upon the Nationals of Japan and Subjects of all Asia.\n\nThe Empire of Rising Sun, overturned from the status of demigod at the wrath of Chinese People, finds itself before a collapsing decade of the 70s. People of bitterness and liberal politicians once forced into obvilion now tears the holy Kokutai of the Empire apart, imposing their demands whatsoever. \n\nYet not all is lost. The Teikoku still maintains control over its Pearl String from Karafuto, Chosen, Okinawa, Taiwan unto Kita Boruneo as well as its Pacific assets. The Teikoku still wields the second largest Navy and the third largest nuclear assets. All of them shall point out a future of grievance and darkness: The Iron Curtain of Sino-Japanese Rei-Sen falls from the harbor of Hailanpao unto Kita Boruneo, from the plateau of Pamir to the Trench of Mariana. The Teikoku shall malice - and retaliate should the right time comes."
 CPC_TRCW_Xibei_Anarchy_end_tt: "Thus, the Great Northwest was reduced to a §VHell§! of §ofire§! and §nplague§!, and the §xdream of liberation§! was utterly §Vshattered§!.\n\nUnfortunately, §Ryou have failed§!. §MThank you for playing £CPC_texticon §SChina Liberator§!—we hope you enjoyed it as much as we enjoyed creating it.§!\n\nWe hope §Cyou§! can avoid the §etragedy repeating§! in your next save. Until we meet again, in a place free of §jdarkness§!."
 CPC_TRCW_RGOC_wins_end_tt: "Thus was the §xRiot of Shina§! §mPacified§!, with the §xDream of Liberation§! §mWalking a Long and Arduous Path§!.\nAlas, you have §Rfailed§!. §MThank you for partaking in the content of the £CPC_texticon §Sliberators of China§!, and may you have enjoyed it just as much as we did creating it.§!\n\nWe deeply wish for §CYour§! remedy to §eCease Another Pitiful Replay§!. May We Reunion whereever of §jNo Darkness§!. "