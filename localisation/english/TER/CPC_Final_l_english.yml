 CPC_TRCW_end.101.t: "He Will Smile Mingling in Their Midst"
 CPC_TRCW_end.101.d: "The coldness of the Loess Plateau was gradually blown away by the warm wind, and spring quietly arrived in Xi'an. The yellowish sunlight sprinkled lightly on Li Ne, like the touch of her relatives, giving her stiff and tired body a touch of warmth. Gently pushing open the door of her long-closed home, she walked into the home she had been away from for a long time: it was her home, and the home of that great man, her father Mao Zedong. As the supreme leader of the Party and the country, her father's living room was exceptionally simple: excluding the front hall, patio, washroom, and dining room, his living room contained only a sandalwood desk, a wooden bed, and several large bookcases full of Chinese and foreign books, as well as stacked piles of ancient books placed randomly at the end of the bed. The furnishings of the room are still the same as the day he left, but the owner of the room will never return here.\n\nNot wanting to continue to touch the scene, Li Ne on the companion came to the secretary of the small Sui and commanded: \"This is the chairman of the study, small Sui you are responsible for the desk that, I go to look at the miscellaneous cabinets, remember to be careful and light, this is an important relic of the revolution.\" \"I understand, then I'll go over.\"\nOpening the dusty rectangular storage box, a variety of unnamed odds and ends filled the box. There were half-broken pencils, children's scribbles, and crookedly embroidered scarves, which she instantly recognized as objects from her childhood. The broken pencil she used to write for the first time, the crayon drawing she gave to her father when she started to learn art, and the crooked embroidered scarf with two large peaches on it: she had made it by hand for her father's 60th birthday, sewing it stitch by stitch, and because she had no experience in women's embroidery, the final product was quite unattractive. But she clearly remembers her father's happy and loving expression when she received the handkerchief. Dad didn't like birthdays because they always reminded him of his dead and separated relatives: Yang Kaihui, Mao Zechun, Mao Zemin, He Zizhen, Mao Anying, Mao Yanqing, and Li Min... He only had one child left.\nHer eyes began to moisten again, the suppressed emotion in Li Ne's heart was raising its head a little bit, her father was no longer by her side, and she could no longer see the kind old man who would teach her to write and read with his own hands.\n\n\"Comrade Li Ne, come over and take a look at this thing.\"\nHearing Sui's call, Li Ne rushed over to the desk, on which was a piece of manuscript paper exclusively used by the Central Committee, on which a poem had been written in a handwriting that was already somewhat askew but still ethereal and agile.\nHolding the poem like a holy relic, the bright sunlight from the window illuminated the handwriting on the paper, and Li Ne took one look at it and knew clearly that this was the last image of an old man who had burned his whole life for the revolution and left his back to the world at the end of his life's path.\n\n\n\n\n\n\n£GFX_CPC_Mao_end \n\n\n\n"
 CPC_TRCW_end.101.o: "She understood that her father's wish had been fulfilled."
 CPC_TRCW_end.102.t: "A Farewell Eternal"
 CPC_TRCW_end.102.d: "After the complete reunification of China (except for Taiwan and the individual islands off the coast), a huge back has finally disappeared at the end of the horizon - the Mao Zedong Funeral Committee of the Central Committee of the Communist Party of China (CPC) has resolved that Mao Zedong's funeral will be held on the following day.\n\nThree hundred thousand people lined up to walk across the casket where Mao's ashes would be placed to \"say goodbye\". Time was reserved for foreign diplomats to pay their respects, and a separate slot was set aside for ideological allies of the Communist Party. Among the wreaths sent by the committees was one that read: \"Deeply in memory of the beloved Great Teacher Chairman Mao Zedong, your student and close comrade Jiang Qing .......\"\n\nMillions of people descended on Xi'an's People's Square for a memorial service held at the end of Chairman Mao's week of mourning. At exactly 3:00 p.m., all of China stopped work for three minutes. Eight hundred million people (there will undoubtedly be some exceptions) stood in quiet silence for leaders they didn't always meet, for martyrs who died in the war, and for their fellow Chinese who have died since the Japanese invasion. All the whistles in China (on the trains, in the factories, on the ships) were blown in those three minutes. \n\nDeparture from logic often makes the ceremony a lie. It was in this way that all the main leaders of the Communist Party took to the funeral stage. Deng Xiaoping presided over the memorial service; Bo Yibo delivered the eulogy, extolling Mao's greatness in his measured words; Jiang Qing talked about the inevitability of China's path to socialism and beware of bourgeois corruption. At this point, Sun's widow stood next to Xi Zhongxun.\n\nAt the end of the meeting, those present (along with the hundreds of millions of people watching or listening throughout China) bowed solemnly three times to the huge portrait of Mao Zedong at the front of the square. A 500-piece orchestra then played a loud hymn, \"The East is Red,\" the last line of which called Mao \"the great savior of the people.\n\nBy 4 p.m., the crowd had dispersed. Bicycles began to roll through People's Square as usual, crunching on the scraps of paper left over from the memorial service that bore the program of the conference. An era of poverty, weakness, and fragmentation had ended, and a new era under the leadership of the Communist Party was about to be born."
 CPC_TRCW_end.102.o: "Zhongguo Wansui, Renmin Wansui!"
 CPC_TRCW_end.103.t: "Old land, new system"
 CPC_TRCW_end.103.d: "In view of the fact that the infrastructure of Xi'an was still intact, an earlier CPPCC meeting had resolved to hold the election of the Presidium of the National People's Congress in Xi'an.\n\nAs head of the Nanjing delegation to Shaanxi to participate in the election and Honorary Chairman of the CPPCC, Soong Ching Ling was both familiar and unfamiliar with the Communist Party that had founded the new China, and with the Communist Party \"as it is now\": what a familiar name, a party that half a century earlier her husband and his comrades in arms had held in high regard; what unfamiliar people, the young faces she remembered: Zhou Enlai, Mao Zedong  all had their own faces. The young faces she remembered: Zhou Enlai, Mao Zedong...had all gone before her.\n\nIn Xi'an, at the CPPCC's temporary assembly hall, she was surrounded by people walking up the steps and into the hall, she saw a group of young people whom she had never met but who were full of vigor - she couldn't help but think back to decades ago when she was as young as these children: at that time she was surrounded by Dr. Sun Yat-sen, Liao Zhongkai, Zhou Enlai, Lu Xun and Cai Yuanpei. The voices and smiles of these people slowly appeared in her mind, and even overlapped with the children in front of her...\n\nThe process went very smoothly, and soon it was time for her to speak. \"Next, please invite Mr. Song Qingling to announce the beginning of the election process.\" The moderator of the assembly was Ji Dengkui, whom she had met in Nanjing - all of the younger generation, all of the generation with ideas.\n\nSong Qingling nodded and took the microphone, \"My legs and feet do not allow me to stand and speak, so I will have to borrow a microphone and sit among you to speak, so I ask for your forgiveness, gentlemen of the assembly. For a non-Communist like me to be able to attend this historically significant congress is the most honorable and pleasant thing in my life.\"\n\"At the same time, I can see that not only me, but also many young faces that I have not met before, from various places and groups all over the country, are in the audience, which represents one thing, that our China, which has been suffering from division and backwardness for a hundred years, has finally been reunited.\"\n\"Now, this democratic, revolutionary, independent new China is attempting a road that has never been traveled before, a road that was not traveled by the old generation of democratic revolutionaries, including Mr. Sun Yat-sen, a road that the Kuomintang reactionaries and Japanese imperialism fear. And the way to embark on this path is today, in this ballot in my hand.\"\n\nSong Ching-ling finally stood up on her crutches and, amidst endless applause and hot tears, walked with slow but firm steps to the ballot box in the center of the dais.\n\n\"I declare the election of [CPC.GetName] First National People's Congress, start now!\""
 CPC_TRCW_end.103.o: "A first vote towards a China reborn has been cast."
 CPC_TRCW_end.201.t: "He Will Smile Mingling in Their Midst"
 CPC_TRCW_end.201.d: "The coldness of the Loess Plateau was gradually blown away by the warm wind, and spring quietly arrived in Xi'an. The yellowish sunlight sprinkled lightly on Li Ne, like the touch of her relatives, giving her stiff and tired body a touch of warmth. Gently pushing open the door of her long-closed home, she walked into the home she had been away from for a long time: it was her home, and the home of that great man, her father Mao Zedong. As the supreme leader of the Party and the country, her father's living room was exceptionally simple: excluding the front hall, patio, washroom, and dining room, his living room contained only a sandalwood desk, a wooden bed, and several large bookcases full of Chinese and foreign books, as well as stacked piles of ancient books placed randomly at the end of the bed. The furnishings of the room are still the same as the day he left, but the owner of the room will never return here.\n\nNot wanting to continue to touch the scene, Li Ne on the companion came to the secretary of the small Sui and commanded: \"This is the chairman of the study, small Sui you are responsible for the desk that, I go to look at the miscellaneous cabinets, remember to be careful and light, this is an important relic of the revolution.\" \"I understand, then I'll go over.\"\nOpening the dusty rectangular storage box, a variety of unnamed odds and ends filled the box. There were half-broken pencils, children's scribbles, and crookedly embroidered scarves, which she instantly recognized as objects from her childhood. The broken pencil she used to write for the first time, the crayon drawing she gave to her father when she started to learn art, and the crooked embroidered scarf with two large peaches on it: she had made it by hand for her father's 60th birthday, sewing it stitch by stitch, and because she had no experience in women's embroidery, the final product was quite unattractive. But she clearly remembers her father's happy and loving expression when she received the handkerchief. Dad didn't like birthdays because they always reminded him of his dead and separated relatives: Yang Kaihui, Mao Zechun, Mao Zemin, He Zizhen, Mao Anying, Mao Yanqing, and Li Min... He only had one child left.\nHer eyes began to moisten again, the suppressed emotion in Li Ne's heart was raising its head a little bit, her father was no longer by her side, and she could no longer see the kind old man who would teach her to write and read with his own hands.\n\n\"Comrade Li Ne, come over and take a look at this thing.\"\nHearing Sui's call, Li Ne rushed over to the desk, on which was a piece of manuscript paper exclusively used by the Central Committee, on which a poem had been written in a handwriting that was already somewhat askew but still ethereal and agile.\nHolding the poem like a holy relic, the bright sunlight from the window illuminated the handwriting on the paper, and Li Ne took one look at it and knew clearly that this was the last image of an old man who had burned his whole life for the revolution and left his back to the world at the end of his life's path.\n\n\n\n\n\n\n£GFX_CPC_Mao_end \n\n\n\n"
 CPC_TRCW_end.201.o: "She understood that her father's wish had been fulfilled."
 CPC_TRCW_end.202.t: "A Farewell Eternal"
 CPC_TRCW_end.202.d: "After the complete reunification of China (except for Taiwan and the individual islands off the coast), a huge back has finally disappeared at the end of the horizon - the Mao Zedong Funeral Committee of the Central Committee of the Communist Party of China (CPC) has resolved that Mao Zedong's funeral will be held on the following day.\n\nThree hundred thousand people lined up to walk across the casket where Mao's ashes would be placed to \"say goodbye\". Time was reserved for foreign diplomats to pay their respects, and a separate slot was set aside for ideological allies of the Communist Party. Among the wreaths sent by the committees was one that read: \"Deeply in memory of the beloved Great Teacher Chairman Mao Zedong, your student and close comrade Jiang Qing .......\"\n\nMillions of people descended on Xi'an's People's Square for a memorial service held at the end of Chairman Mao's week of mourning. At exactly 3:00 p.m., all of China stopped work for three minutes. Eight hundred million people (there will undoubtedly be some exceptions) stood in quiet silence for leaders they didn't always meet, for martyrs who died in the war, and for their fellow Chinese who have died since the Japanese invasion. All the whistles in China (on the trains, in the factories, on the ships) were blown in those three minutes. \n\nDeparture from logic often makes the ceremony a lie. It was in this way that all the main leaders of the Communist Party took to the funeral stage. Deng Xiaoping presided over the memorial service; Bo Yibo delivered the eulogy, extolling Mao's greatness in his measured words; Jiang Qing talked about the inevitability of China's path to socialism and beware of bourgeois corruption. At this point, Sun's widow stood next to Xi Zhongxun.\n\nAt the end of the meeting, those present (along with the hundreds of millions of people watching or listening throughout China) bowed solemnly three times to the huge portrait of Mao Zedong at the front of the square. A 500-piece orchestra then played a loud hymn, \"The East is Red,\" the last line of which called Mao \"the great savior of the people.\n\nBy 4 p.m., the crowd had dispersed. Bicycles began to roll through People's Square as usual, crunching on the scraps of paper left over from the memorial service that bore the program of the conference. An era of poverty, weakness, and fragmentation had ended, and a new era under the leadership of the Communist Party was about to be born."
 CPC_TRCW_end.202.o: "Zhongguo Wansui, Renmin Wansui!"
 CPC_TRCW_end.301.t: "He Will Smile Mingling in Their Midst"
