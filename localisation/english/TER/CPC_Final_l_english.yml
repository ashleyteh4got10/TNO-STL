l_english:
 CPC_have_an_anchor_to_windward: "Looming Age"
 CPC_have_an_anchor_to_windward_desc: "A coup apprehending the veteran leadership of the party - Premier Zhou Enlai has fallen during the 9th Congress. The blessing of time no longer endures, the half centennial Communist Party faces paralyzing illness and aging. \n\nAll the minions of prominent figures are unleash their full might to apprehend the impending political strife."
 CPC_visit_the_patient: "Call on the Patient"
 CPC_visit_the_patient_desc: "Premier Zhou Enlai has invited the General Secretary of Secretariat Deng Xiaoping for a private talk at this very crucial time."
 CPC_large_scale_retirement: "Great Staff Refreshing"
 CPC_large_scale_retirement_desc: "The old revolutionary veterans are no longer in their best status to be held responsible for major tasks. Premier Zhou Enlai has called to draw a clean-and-clear roadmap for intra-Party generation cycling to prevent health problems from disrupting routines of the Party and the Front."
 CPC_empty_monarch_in_the_party: "Sideline the Chairmen"
 CPC_empty_monarch_in_the_party_desc: "The struggle vying for the position of Chairman of the Front has attracted public attention. Both Mao and Liu withdrew from the election. Regarding the extraordinary achievements of the revolution and the collective wish of all within the party, their Party assignments and positions remain."
 CPC_the_abler_the_busier: "Power to the Powerful"
 CPC_the_abler_the_busier_desc: "In order to ensure a continuous and steady renewal of the party's leadership, it is important to strengthen the development of young leaders. This involves selection, training, and examination to ensure that they have the capacity and qualities to lead the country. And with the formation of a new leadership, different factions and views may emerge within the party. How to deal with these internal conflicts and ensure party unity and stability is crucial."
 CPC_veteran_retirement: "Retiring Old Heroes"
 CPC_veteran_retirement_desc: "The PLA, as the armed forces of the CPC, faces equally important problems. Veterans in the chain of command such as Peng Dehuai and He Long are all in their old age. How to carry out a smooth transfer of power and how to ensure the combat effectiveness and loyalty of the army are problems that must be faced and solved."
 CPC_not_to_be_made_a_precedent: "Only I Persist"
 CPC_not_to_be_made_a_precedent_desc: "The PLA also has the ambitious task of liberating the whole of China, and at the level of strategic command of our army, the energy and brainpower required to achieve this task is beyond the capacity of a few veteran generals, and it is necessary to ensure that our army's brain is strong and not too old; however, at the level of tactical command, we can at the same time retain a number of middle- and lower-ranking commanders of higher seniority and strengthen the cultivation of young leaders, which is of great benefit to the maintenance of the army's combat effectiveness."
 CPC_back_door_deal: "Safe and Sound"
 CPC_back_door_deal_desc: "The rapid retirement of veteran generals is not conducive to a smooth transfer of power, and during this period it is necessary to consider a smooth transfer of power. A smooth transfer of power would ensure the continuity of the chain of command of the army and avoid sudden policy shifts that would have a knock-on effect on the combat effectiveness of the army."
 CPC_new_blood: "Fresh Blood"
 CPC_new_blood_desc: "The cultivation of young leadership should start from the broader context of society as a whole, starting from the most basic level of schools, enterprises and communities, and encouraging young people to participate in social services, voluntary activities and the management of public affairs, so as to enable them to practise their leadership skills in real-life environments. Such experience will not only develop their organisational, co-ordination and decision-making skills, but also enhance their sense of responsibility towards society and their concern for the public interest.\n\nAt the same time, young leaders need to be groomed at all levels and sectors of the party and the Front. This involves providing them with more opportunities to participate in the decision-making and implementation of major projects, or putting them in charge of a particular area of work. In the process, they can gain experience, face challenges and solve problems on the ground."
 CPC_expand_party_school: "Expand Party School Admissions"
 CPC_expand_party_school_desc: "As the Party's main institutions for training its cadres and leadership, the Party schools are the best bases for young cadres to learn Marxism-Leninism-Mao Zedong Thought. Expanding enrolment in party schools will train more young cadres for the Party and the Front, ensuring that they are equipped with the Party's basic theoretical knowledge, practical experience and class consciousness, and will contribute to the long-term development of the Party and the Front."
 CPC_choose_a_principal: "Headmaster in Positon"
 CPC_choose_a_principal_desc: "The policy of expanding the Party School has received widespread praise from all sectors of society, but the expanded Party School organization inevitably means a complete change of the leadership team.\n\nThere is an urgent need to select a comrade who is politically reliable, loyal to the Party, and outstanding in organizational ability to serve as the President of the Central Party School."
 CPC_where_to_go: "Graduate Placement"
 CPC_where_to_go_desc: "The issue of graduate placement requires comprehensive consideration. It involves the overall talent strategy of the Party and the Front, the needs and capabilities of departments at all levels, as well as the expectations and interests of graduates. Appropriate policies and mechanisms can help ensure that Party school graduates are placed in suitable positions and contribute to the development of the Party and the Front."
 CPC_rural_democracy: "Rural Democratic Reform"
 CPC_rural_democracy_desc: "Comrade Zhou Yang's speech at the Ninth National Congress pointed out that the style of the middle and grass-roots cadres inherited from the period of front building, who were monopolistic and manipulative, had become more and more serious, that the channels for feedback from the masses of working people had been deliberately blocked, and that many of the brigade secretaries had a serious \"I AM BOSS\" mentality, who were not only indifferent to the people, but also secretly paid bribes, and some of them even fought against surveillance. The researchers sent to the grassroots by the Central Government.\n\nComrade Zhou Yang's report recommended that this \"authoritarian\" trend should be stopped immediately, that Marxism-Leninism-Mao Zedong Thought should be taken as the guide, that the spirit of proletarian democracy should be carried forward, and that a movement for democratic reform at the grassroots level in the countryside should be carried out."
 CPC_Zhang_plan: "Zhang Pushes Forward"
 CPC_Zhang_plan_desc: "Our people have long ceased to be ignorant. Thirty years of revolutionary training have brought unprecedented maturity to a people fully capable and willing to govern themselves. No tutelage shall be enforced onto them. The only thing we need to intervene is to free the shackles from the people's minds and let them express their heartfelt thoughts at will. "
 CPC_liberate_poor_people: "Poor Production Teams Spearhead"
 CPC_liberate_poor_people_desc: "In the past, the Party relied on the poor peasants to carry out its work; today, we still have to rely on them to carry out our democratic reform work. Class divisions are happening all the time, and in the same brigade there will be one or two production teams that are in the most difficult situation; as the saying goes, when the poor are in need of change, they are bound to have some insights."
 CPC_disclosure_conference: "Public Accusation of Local Cadres"
 CPC_disclosure_conference_desc: "One or two bad elements cannot deceive everyone forever; the masses see and remember all sorts of bad deeds, and as long as the first person dares to come forward and expose them, there is no worry about not being able to dig up the black background of the bad elements. The victories of the mass denunciation campaigns in the Agrarian Revolution and the Anti-Rightist Movement are still to be seen, and we should immediately launch denunciation meetings."
 CPC_able_to_act: "Daring to Speak, Daring to Take Rein"
 CPC_able_to_act_desc: "The revolutionary struggle cannot be won by merely paying lip services. The masses oppressed by the malicious elements should not only stand up and denounce them, but also take action to bring them down completely, ban them from public office, send them to reform through labour, and establish a new leadership by the own will of the masses."
 CPC_Han_plan: "Han Guang's Plan"
 CPC_Han_plan_desc: "A responsible parent will not force his baby to run. China's society is too deeply poisoned by feudal despotism, and there is no possibility for democracy to be achieved overnight. Until our people are equipped with the appropriate capabilities, the Party must carefully hold their hands and move forward, lest these hapless newborns be destroyed by sudden winds and rains."
 CPC_clean_the_grass_roots: "Tutelage to Lower Cadres"
 CPC_clean_the_grass_roots_desc: "The imperfect accountability mechanism for duty reporting has caused a lot of mischief, sometimes to the extent that the public has to petition and the Commissioner must make visits in order to get to the bottom of the deep-rooted maladministration. This kind of lax attitude of treating the head when there is a headache and treating the foot when there is a foot sore is most undesirable. We must take immediate action to make it mandatory for grass-roots cadres to report their duties to the steering group and hold those who are not doing their jobs properly accountable."
 CPC_audience_and_guidance: "Audits and Guidance"
 CPC_audience_and_guidance_desc: "A part of the cadres have an incorrect understanding that they have already finished their lifetime of lessons in the cadre school and party school, and henceforth no longer need to study - what a big mistake. Communists can never stop sharpening themselves, and the first lesson of tuition is to sit beside the supervisory team and see how others handle their daily work. "
 CPC_high_quality_decisions: "Decision Making Streamlined"
 CPC_high_quality_decisions_desc: "It is important to have a clear understanding that the poor development of our agricultural areas is not constrained by any objective conditions, but rather by a problem of governance. The freewheeling nature of the grass-roots administrative team, which shirks its responsibilities, procrastinates when it can, and turns decision-making meetings of production teams into joint chit-chat, should be curbed and replaced by high-quality decision-making activities."
 CPC_master_of_balance: "Master of Balancing"
 CPC_master_of_balance_desc: "Grassroots democratic reform is never just a grassroots matter. As the initiator of grassroots democratic reform, the Party is certainly not a so-called \"detached\" referee in this movement. However, it must also exercise a high degree of political wisdom to balance and guide the healthy development of the democratic reform movement so that it truly achieves its goals."
 CPC_principal_of_democracy: "Principle of Democracy"
 CPC_principal_of_democracy_desc: "Needless to say, the keyword of the grassroots democratic reform movement is democracy. It is necessary to give full play to both intraparty and extraparty democracy, fully mobilize the masses, broaden the channels for expressing opinions, and pool wisdom. It's best to make some cadres with tough styles blush and sweat – improving governance, the first priority is to respect the will of the people."
 CPC_principal_of_organization: "Principle of Organization"
 CPC_principal_of_organization_desc: "How to clear between right and wrong, the border of freedom of speech, and the scope of criticism, which we need to establish on the principle of law and discipline, if democracy turns into disorganised populism, it will mean failure -"
 CPC_more_important_thing: "The Bigger Picture"
 CPC_more_important_thing_desc: "The democratic reform of the countryside has achieved relatively significant results in terms of both institutions and mobilisation, and it is now time to gradually transform this intentionally initiated movement into a permanently existing system, and the focus of the work of the whole Party and the whole Front should be shifted as soon as possible from the democratic reform of the grassroots to the preparation for war and the preparation for the liberation of Shanxi."
 CPC_all_honor_to_you: "All Credit to ME!"
 CPC_all_honor_to_you_desc: "The Movement for Democratic Reform in the Countryside is the latest practical outcome of Marxism-Leninism-Mao Zedong Thought, which has enriched the spiritual connotation of Mao Zedong Thought with great political wisdom and great political determination. Through this Movement, it is believed that the whole Party, the whole army and the whole nation of all ethnic groups will unite even more closely around Chairman Mao's Central Committee, and will endeavour to make a leap forward towards the ambitious goal of socialist democracy!"
 CPC_all_honor_to_us: "Everyone CONTRIBUTED!"
 CPC_all_honor_to_us_desc: "The ambitious goal of socialist democracy can by no means be achieved by subjective enthusiasm alone. In the course of practice, we must always bear in mind the wise teaching of \"from the people, to the people\", and only when the masses and the Party are close to each other, and only when the masses dare and are good at giving their opinions and suggestions on the work of the Party and the Government, will the movement be considered to have laid a solid foundation for the ambitious goal of socialist democracy."
 CPC_shanxi_liberate_plan: "The Shanxi Plan"
 CPC_shanxi_liberate_plan_desc: "The establishment of the ANRL has forced the Japanese imperialists and the Nanking pseudo-regime to speed up their intervention in the north-west, and a full-scale war between us and the enemy is at hand; now that the internal problems of the Front have come to an end, it is necessary to study our next plan of action on the eve of the final battle."
 CPC_covert_contact: "Secret Contact"
 CPC_covert_contact_desc: "At the end of the war, we left behind the embers of many base areas in Shanxi on our way out, and now that the old comrades in these base areas are gradually restoring contact with us through the chaotic situation, we will send cadres to establish a channel of contact with them, which will play a major role in the forthcoming Shanxi program."
 CPC_new_special_force: "New Concept: Special Forces"
 CPC_new_special_force_desc: "In the process of military reform, our army has gradually come into contact with and understood the concept of special forces, the quality of its members requires high quality, and the task it has to shoulder is significant, we will immediately promote the training and formation of the special forces of the whole army task, in order to prepare for the liberation of Shanxi and the liberation of China."
 CPC_Yellow_river_army: "Yellow River Pioneers"
 CPC_Yellow_river_army_desc: "Designated to convene fording battles in the Shanxi Plan, the Yellow River Pioneers, is an integral part of the Special Unit Formation of the Front. Their adept river crossing techniques may empower them to quickly capture vital posts on the east shore of Huanghe, swipe out all pockets and establish outposts."
 CPC_Yellow_river_army_tt: "§YMilitary Reforms§! gains:\nSpecial Forces Attack §G+15%§!"
 CPC_increase_conscription: "Expand the Formation"
 CPC_increase_conscription_desc: "The existing Special Forces alone are not enough, we need more soldiers, of better quality, on board to ensure the smooth progress of the program."
 CPC_increase_conscription_tt: "§YMilitary Reforms§! gains:\nSpecial Forces Cap §G+25§!"
 CPC_mountain_special_army: "The Mountaineer Units"
 CPC_mountain_special_army_desc: "The Mountaineer Units, as an integral part of the Special Unit Formation of the Front, were adept at conducting infiltration operations, and in the Shanxi Plan they are to be responsible for acting as a vanguard to infiltrate the mountains of western Shanxi and dismantle the fortress system there."
 CPC_mountain_special_army_tt: "§YMilitary Reforms§! gains:\nSpecial Forces Defense §G+15%§!"
 CPC_force_to_go_through_the_Yellow_river: "Yellow River Ferry"
 CPC_force_to_go_through_the_Yellow_river_desc: "The preliminary infiltration and counteractions in Shanxi have already begun. It is imperative to quickly clear the bunkers blocking the east bank of the Yellow River before the reactionary forces of the Kuomintang become aware, creating favorable conditions for the subsequent main force offensive!"
 CPC_the_time_has_come: "conditions of country and the world§Yhave been suitable§!, the Central Military Commission will§Ytake the next step by self§!.\n§RYou do not need to operate.§!"
 CPC_Yu_Gong_move_the_mountain: "§xYugong Yishan§!"
 CPC_Yu_Gong_move_the_mountain_desc: "We all know about the fable \"Yugong Yishan\", the Foolish Old Man Who Removed the Mountains. It tells of an old man who lived in northern China long, long ago. His house faced south and beyond his doorway stood the two great peaks, Taihang and Wangwu, obstructing the way. He called his sons, and hoe in hand they began to dig up these mountains with great determination. When questioned as to the seemingly impossible nature of his task, the Foolish Old Man replied that while he may not finish this task in his lifetime, through the hard work of himself, his children, and their children, and so on through the many generations, some day the mountains would be removed if he persevered. The gods in Heaven, impressed with his hard work and perseverance, cleared away the mountains with their mighty power.\n\nToday, two big mountains lie like a dead weight on the Chinese people. One is imperialism, the other is feudalism. The Communist Party of China has long made up its mind to dig them up. We must persevere and work unceasingly, and we, too, will touch gods' heart. Our gods are none other than the masses of the Chinese people. If they stand up and dig together with us, why can't these two mountains be cleared away?"
 CPC_TRCW.1.t: "A Military Commission Secret Meeting(1)"
 CPC_TRCW.1.d: "The day quiets into the night, and the stars have abled to be seen. Guanzhong, an old and wide region in China, has held onto its peace and tranquility for a long time, whereas it is clear that the atmosphere in here has become nervous.\n\n Xi'an City has decided restricting lights in the night as well as extending the curfew time, more and more guards and soldiers are going on patrol in the urban and outskirts of Xi'an, there are only a little military searchlight could be allowed. This city is preparing to return to a state of combat readiness after 1947, it was reformed into Fortress by the CCP. \n\n In a building which belongs to the Central Military Commission, lights fill a wide situation room with some military pictures and tactical deduce props, The military leaders are sitting tensely around the conference table in the center of the room: Su Yu, Xu Shiyou, Han Xianchu, Qin Jiwei, Yang Dezhi, Wu Faxian, and other newly-promoted or still active frontline generals are seating on both sides, from left to right. Lin Biao is sitting at the head of the table, his eyes is closing for meditation, while the man who is seating next to him in the deputy seat is the current military commission's second-in-command, Xu Xiangqian.\n\n “So, everyone is here now. well, let's begin for this meeting.\" Lin Biao adjusted his posture and announced the commencement of this special strategic symposium. \n\n \"This meeting has been delegated to me by Chairman Mao to discuss with you all the next direction of the war front. We might soon face direct confrontation with the Nanjing authorities. As everyone has seen from the briefings, Gao Zongwu is further expanding the scale and quality of their puppet army, preparing to form more elite troops, and he has received support from their Japanese masters. The Japanese imperialists have become increasingly anxious about the situation in East Asia, especially after the establishment of the ANRL and the development of the National Defence Front’s nuclear program. Then, they have not only relaxed their control over the puppet government of Gao but are also actively pushing for against us at first time. That means that even if we don't attack them, the enemy must attack us once they are prepared...\"\n\n Then, Lin Biao decided to make a joke, \"The Chairman said we are like a woman who just got married, 'knowing she will give birth but do not know when.' So now, it's necessary to discuss with all the 'mothers-in-law' here how we're going to 'give birth' to this child.\" There were some wry smiles around the room, but the atmosphere still remained tense. \n\n Su Yu was the first to respond, \"If we are to go to war now, we must prepare under the premise of a full-scale conflict with Japan and its puppet regime. Our current combat readiness work is progressing smoothly. I believe we can soon complete the preliminary preparations, giving us the initiative.\"\n\nXu Shiyou continued, \"If we fight, it boils down to three directions: to the north, we would need to pass through the frontier regions to fight against the puppet Mongolian regime; to the east, we would cross the Yellow River to attack Shanxi; and to the south, we'd clash with the Lu Han group on the Yunnan-Guizhou Plateau.\"\n\nYang Dezhi added, \"However, all three plans come with risks. Although our army has fought several battles over the years, whether we are qualified for a full-scale war is yet to be tested. We must limit the risks to a certain extent so that the front's strategy and morale are not severely affected.\"\n\n\"You all have valid points. We need to devise a plan that identifies the enemy's weakest point for an easy assault.\" After saying this, Lin Biao gestured to Xu Xiangqian with his eyes."
 CPC_TRCW.1.o: "Xu Xiangqian nodded, then he stood up."
 CPC_TRCW.2.t: "A Military Commission Secret Meeting(2)"
 CPC_TRCW.2.d: "\"I suggest that Shanxi be the breakthrough point for our National Defence Front at this moment.\" Well-prepared, Xu Xiangqian stood up, and the attendees realized that the real protagonist had finally taken center stage.\n\nHe suppressed the bubbling excitement in his heart, Xu Xiangqian presented his years-long masterpiece to everyone—a detailed map of the Shanxi combat plan. It was densely marked with symbols indicating enemy bases, assembly areas, economic and military hubs, especially noticeable were the scattered \"fortress clusters\" in the western mountain areas.\n\n\"Shanxi is currently the most suitable direction for the following reasons: First, since the death of Fu Zuoyi, the loyalty of the Shanxi faction has dispersed and disputes are ongoing. Taiyuan's control over nearby bases has also weakened, and we've received messages from comrades left in our old base areas asking to reestablish contact. Second, Shanxi is a crucial area for the Nanjing authorities; both its minerals and energy resources play a significant role in the puppet government's economic map. Attacking from here would disrupt and severely undermine Nanjing's war preparations. Third, the fortification system along the Yellow River, built after the war under the supervision of Okamura Yasuji, has been neglected for years. The field artillery currently equipped by us is specially designed to counter and restrain such fortifications.\"\n\n\"We should lead with our Special Force from the Mountain Army, infiltrating the western Shanxi mountains, making an opening. Since the enemy relies on their fortresses, their main forces are primarily concentrated in Datong or the Zhongtiao Mountain line. The mountain fortresses on the eastern bank of the Yellow River are only connected point-to-point, easy to divide. With the help of our old base areas, a few targeted strikes at weak points would split the entire defense network, collapsing Shanxi's fortress system. Once the enemy's fortress defense is thoroughly breached, our Yellow River troops will cross the river, quickly seizing the eastern bank, clearing obstacles, and establishing forward bases.\"\n\n\"Our actions will surely attract the close attention of Nanjing and even Japan. Hence, we need to control the progression of the plan, escalating it step by step. Only when a favorable opportunity for our front arises should a full-scale offensive begin. By then, with the help of our vanguard troops, the People's Liberation Army will forcefully cross the Yellow River and liberate Shanxi.\"\n\nAs he finished, everyone was jolted awake from the comprehensive plan, followed by hearty applause. In reality, Xu Xiangqian had discussed this scheme with central leaders before the meeting and had received their approval. Bo Yibo and others had even provided a lot of related intelligence and information. The purpose of this meeting was primarily to persuade these frontline commanders.\n\nLin Biao also joined in the applause. After it subsided, he said, \"Well, it seems like everyone agrees with Comrade Xu Xiangqian's suggestion. Very well, let's adopt this plan as the conclusion of the meeting.\""
 CPC_TRCW.2.o: "“Do not forget to convey the spirit of the meeting to the cadre of regiments and above, that’s all, dismissed.”"
 CPC_TRCW.3.t: "Long Time No See"
 CPC_TRCW.3.d: "\"I can't imagine that you guys can actually take your work to the enemy's bunker...\"\n\"Haha, that's thanks to Senior Officer Liang Huazhi Liang.\"\n\nAlready almost sixty years old Dong Tianzhi today glowed no less than the vitality of young people, vaguely white beard can be seen also excitedly rising - has been almost more than twenty years have not seen comrades from the Central Committee, and this time to come is still his former in the death of the column of old partner Rong Zihe.\n\nLeading his old partner on a stroll through the former Jin Army post that guarded the gateway to northwestern Jin, Dong Tianzhi chattered, \"...In previous years, our comrades had infiltrated this place to start their revolutionary work, but it was not until a few days ago that we were able to launch a mutiny, because those people in Taiyuan are having a hard time, not only are they fighting amongst themselves but also short of money, and they are also scouring the bones of these soldiers. These soldiers are also scraping the bones and marrow, actually did not pay wages for nearly five consecutive months, all rely on a little bit of sand mixed with poor food to fool people, the officer in charge here is also a bad seed, not moving to suck the blood of the soldiers and also mistreat the soldiers, after we agreed to supply food in our base, some of the lower and middle level officers who were originally inclined to our comrades to cooperate with the comrades here, in that day the officer was once again beating the people to start a military mutiny, now it's our Chief of Staff, Comrade Cai Tiegen, is presiding over the situation here.\"\n\nRong Zihe, who volunteered to return to Shanxi to do liaison work, also couldn't help but smile when he heard this, \"After so many years, Lao Dong your political work is still as sharp as ever, it's true that the sword hasn't aged ah! Does Taiyuan know about the situation here? What's your numbers, what percentage of guerrillas and party members?\"\n\n\"Taiyuan is completely unaware, we are now blocking the news and disguising as if everything is normal, but the guerrillas have been mixed with the uprising soldiers, and the Communist Party cadres have been assigned as political instructors at all levels, totalling roughly 2,000 or so. The comrades here will tell you more about the specifics later.\"\n\"Well, after grasping the main road here, our troops will then have a good guarantee when they march into northwestern Jin, and I will also report to the Central Committee in detail.\"\n\nRong Zihe looked around and noticed that there were quite a number of quite old soldiers walking around the camp, their faces were weathered and they were obviously old guerrillas who had been turning to the war for many years, in stark contrast to the generally much younger Kuomintang soldiers, a feeling of heartache arose and he turned his head to Dong Tianzhi and said, \"You guys aren't easy to do, staying behind the enemy lines and still making these kinds of accomplishments, you've worked hard for so many years. \"\n\nHair and beard has been white Dong Tianzhi words silent for a moment, years of experience for a moment as a walking light flashes in the brain: Yan Xishan defected to the enemy after their own guerrillas rooted behind enemy lines, and Jinsui Jinchahi surviving comrades, in the mountains to rebuild the party organisation and the base, the top of the ghosts and traitors of the rain of bullets rolled in the land of northwestern Jin...How many comrades with a passionate blood and unwillingness to fall in front of their own! How many comrades with a lot of blood and unwillingness have fallen in front of him? Didn't he stay alive until now so that he could one day fight back to avenge them?\n\nIt was a long time before he answered:"
 CPC_TRCW.3.o: "“We will fight whatever how many years it takes, until we're dead.”"
 CPC_TRCW.4.t: "Diverging Paths of Life (1)"
 CPC_TRCW.4.d: "What is the meaning of life? This is a question that has haunted Wang Weiguo ever since he was born, in a humble cave-house in Shaanbei, a poor but sacred land where the CPC fought for the revolution. The first thing he smelled was the ocher that filled the air. The first thing he saw was his parents' silent joy, despite their harsh living conditions. That was when he received his name: Weiguo - to defend one's homeland.\n\nShaanbei is both desolate and sacred - it is where the Communist Party of China continues to fight. This world-renowned land of revolution, with over thirty years of glorious and magnificent struggle, remains poor and barren. Living in Shaanbei means enduring poverty and hardship, whether in war or peace. The people's main goal is to survive: they have children, farm the land, cope with sandstorms and droughts, and brave the elements. This life has been passed down for generations, unchanged for centuries.\n\nWang would never forget the year he turned seven. His father took him to his uncle's house in Qingjian, and bought him a bowl of youcha with his last coin. When Wang finished his drink, he asked his father: \"Papa, why didn't you drink?\" His father said: \"I'm not thirsty.\" But Wang knew he was lying. He had seen the last banknote in his father's hand, wet with sweat.\n\nThe next morning, his father left without a word, like a thief. Wang watched him from behind a tree at the village gate. He knew his father could not keep him anymore, and he wanted to leave him here. He could have run after him and cried, but he didn't. He knew this was the only place that could take care of him until he grew up."
 CPC_TRCW.4.o: "Since then, endless sorrow had never left him alone."
 CPC_TRCW.5.t: "Diverging Paths of Life (2)"
 CPC_TRCW.5.d: "Wang Weiguo was loved by his foster parents, who were also very poor. They did their best to feed him and send him to school, even though he often lacked clothes and food. He was happy and studious, and he excelled in his primary school exams, despite the family's financial difficulties. He insisted on taking the secondary school entrance exam, saying, \"I have to prove myself, even if I can't study further!\" He was one of the few who passed. When his father wanted him to chop wood in the mountain, he threw down the axe and sobbed, \"Dad, I want to go to school, I want to go to school...\" His foster father was unhappy, but he pitied the kid's despair. He asked his old friends from the commune and brigade to help him, and he also borrowed some money from neighbors and relatives. With their assistance, Wang Weiguo enrolled in middle school.\n\nSecondary school opened a new world for him. He had access to textbooks, books, newspapers, and a library that had everything. He learned about the world beyond Shaanxi: Germany and Japan occupying Europe and Asia, China suffering under the Japanese invaders and their collaborators, the United States leading a coalition of free countries against the fascists, the Soviet Union, the red star that was once revered, now shattered on the Russian land. But he also learned that there were still many revolutionaries who resisted and fought in every corner of the world, including China.\n\nNow he is twenty-one and about to graduate. He thought he would go back to the production team and work as a laborer, but the newspaper has made him aware of the changing political situation. He senses that the final showdown between the National Defence Front and the enemies of China is near."
 CPC_TRCW.5.o: "Perhaps, there is a new chance."
 CPC_TRCW.6.t: "Diverging Paths of Life (3)"
 CPC_TRCW.6.d: "Wang Weiguo's childhood friend came to his door yesterday and said he had enlisted to fight on the front line. He asked Wang Weiguo what his plan was.\n\n\"I want to enlist too, but my parents need me. How can I persuade them?\" \"Don't worry, it's not a big deal if you can't go. The front line is dangerous, you can still help us by doing other things, like making clothes, delivering food, haha...\"\n\nHis friend's words stayed in his mind, but he felt a mix of anger and excitement in his heart. He wanted to go to the front, but he feared his parents' sad eyes. He had to look after his parents, but he also wanted to feel the adrenaline of war. How could he be so conflicted? Should he stay or go? How should he choose?\n\nHe tried to clear his mind and remembered he had to chop some wood today. He picked up the axe and sat on the stump, ready to chop the firewood in the yard.\n\nSuddenly, he heard a loud noise from the sky. He looked up and saw a plane flying out of the clouds. He saw that the plane came from across the Yellow River, and that the symbol on its tail was not the Kuomintang's blue sky and white sun, but the Japanese's red circle - it was a Japanese plane! Then he heard a series of blasts from the east bank of the Yellow River, where the Jinxi mountains were. This had been happening for several days.\n\nThe noise of the plane and the bombs shook Wang Weiguo's young heart. He had a sudden realization that the noise..."
 CPC_TRCW.6.o: "...was the call of a bugle."
 CPC_TRCW.7.t: "Political Mobilisation Order for the Shanxi Campaign"
 CPC_TRCW.7.d: "Brave comrades of all the commanders:\nThe battle to liberate Shanxi is about to begin.\nWe must wipe out completely and cleanly the vicious Jin Warlord, the tumour that is sucking the blood and marrow out of the people of Shanxi. We must pull down the biggest reactionary stronghold of the Japanese and the hypocrites against the front in North China, so that we can move on, liberate Shanxi, advance into North China, and liberate the whole of China. We must take back Shanxi, China's most important coal energy base, from the Japanese and the hypocrites in order to benefit the people. We feel supreme honour in carrying out this great campaign.\nNot only must we liberate Shanxi, we are also certain of liberating it. Firstly: after the death of Fu's bandit, the warlords of Shanxi are scattered and fighting among themselves, and the people are suffering even more. Many comrades from the old base have already resumed contact with us and are ready to assist us in our operations. Secondly, the advance troops, spearheaded by the Mountain Army and the Yellow River Army, have penetrated into western Jin, launched intensive guerrilla and movement warfare, and have successfully smashed the so-called \"mountain fortress defence system\" set up by Okamura Ningji, and have set up an advance base on the east bank of the Yellow River, ready to receive us there at any time. Thirdly, after the outbreak of the Oil Crisis, the economy from Taiyuan to Nanking has been thrown into chaos, the enemy soldiers are short of food and ammunition, and even the soldiers have not received their weapons for a long time, so their morale and equipment level are declining, and at the same time, the people of Shanxi, who are struggling more and more fiercely under the oppression of the reactionary government, have adopted a more welcoming and supportive attitude towards us, and eagerly hope that we can go to liberate them.\nFinally, we should also be clear that the Shanxi warlords have been operating for many years, and have constructed many strong walls and barriers as well as a large number of reactionary arms, and now there are also reinforcements from Nanking as well as Japanese weapons support, and they fantasise about resisting, so it can be seen that we will face a tough battle, and we must not take it lightly. We must endeavour to destroy the enemy at the lowest possible cost, using both bravery and intelligence, and be fully prepared for every battle, with everyone skilled in the use of technical and political manoeuvres to defeat the enemy. At the same time, we must adhere to political discipline, form good relations with the people, not take a single needle or thread from them, protect important industrial and cultural facilities, and return a complete Shanxi to the people.\nComrade commanders! You must carry out this honourable task with resolute courage and careful planning! Political comrades! You must fulfil this glorious task with profound education, agitation and exemplary action on your part! Comrades in logistics! You must fulfil this glorious task with a high sense of responsibility, overcoming all difficulties and ensuring that the front does not run out of food and ammunition and that the wounded are given timely medical care! Comrades in the infantry! You must complete this honourable task with bravery, tenacity plus skill! Comrades of the artillery! You must carry out this honourable task with fierce firepower, precision and skill! Comrade correspondents! You must carry out this honourable task with a high degree of responsibility and maintain smooth communications!\nCommunists! You must take an exemplary and leading role on the battlefield and in your work, and be truly worthy of being a good soldier of the people and of the PLA!\nDear comrades, let's unite as one and shout together:\nLiberate Shanxi, liberate all of China!\n\nXu Xiangqian, Commander of the People's Liberation Army's North Corps."
 CPC_TRCW.7.o: "Cross the Yellow River, Liberate Shanxi!"
 CPC_TRCW.8.t: "Beginning the Broadcast"
 CPC_TRCW.8.d: "In his own broadcasting career, it had been a long time since He Ping had been as nervous and excited as he was today - the last time he had a similar experience was the day he first officially sat in a broadcasting room and read out press releases to the millions of people of Northwest China. Since then, from the pledge to continue the war of resistance to the flag of theGreat Leap Forward, from the statement of the crusade against the Ma's army to the declaration for Liberating Sichuan - he has used his melodious, clear and striking voice to transform those impassioned words into a trumpet, which has echoed over and over again on the northwestern land, and has been recited in the ears of the people of the northwestern part of the country.\n\n And today he holds in his hands this document, the content and significance far beyond his past read all the manuscript; it will not only change the fate of the Northwest, but also may change the fate of the whole China, the whole world. Although the paper is light, but in his palm, it seems it is as heavy as a thousand pounds.\n\nTurning to the announcer's microphone and looking carefully at the script in his hand, he suppressed the waves within him and tried to regulate his state to the best, clearly understanding that at this moment countless people were eagerly awaiting this momentous occasion, and began to calmly read, \"This is the Northwestern People's Broadcasting Station—— \""
 CPC_TRCW.8.o: "Broadcasting the Appeal of the National Defense Front to the Chinese People"
 CPC_TRCW.9.t: "Fateful Battle of Two Chinas Ensues"
 CPC_TRCW.9.d: "\"The Central Government of Northwest National Defence Front of China, the Central Committee of the Communist Party of China and the Central Military Commissioners solemnly declare to the people of the country that \"\n\" since 1947, when the war of resistance against Japan entered the stage of prolonged struggle, the National Defence Front has always held high the great banner of the war of national liberation, and has been at loggerheads with the Japanese invaders as well as with the traitorous puppet regimes; and that in the course of twenty-four years we have never given up the For twenty-four years we have never given up the goal of liberating the whole of China, and with the support of the hundreds of millions of people in the north-west of the country we have repulsed the reactionary offensives of the imperialists and the traitorous warlords; and we have seized the great victory of the socialist cause. Especially in the last ten years the economy and the military of the base area have made great leaps forward, and we are now strong enough to honour the promises made to the people of all China.\"\n \"Now, under the impact of the oil crisis, our compatriots in the fallen areas are rising up in revolt, and the Japanese imperialists and the traitorous pseudo-regime of Gao Zongwu in Nanking, in an attempt to salvage their reactionary rule, have taken brutal measures to suppress these people's uprisings, just as they did in the case of Guangxi and Beiping in the past, but this time, with the support of the people of Northwest China, as well as the mighty People's Liberation Army, the whole of the people of China will come together with swords and guns to overthrow the so-called Pan-Asian order of the oppressors.\"\n\n \"We believe that China belongs to the Chinese people, not to the reactionaries. There is an ancient Chinese fable called <The Foolish Old Man Removes the Mountain>. It is about an old man in ancient times named Yugong(means foolish old man) the Northern Mountain. There were two big mountains to the south of his house blocking the way out of his house, and Yugong resolved to lead his sons to dig away these two big mountains with hoes. An old man named Zhisuo(means Wisdom old man) laughed at this and said, \"You are too stupid to do this, it is totally impossible for you father and son to dig up such two big mountains. Yugong replied, \"After I die, there will be my son, and after my son dies, there will be my grandchildren, and there is no end to the number of children and grandchildren. Although these two mountains are very high, they will not increase in height any more; if you dig a little, there will be less, so why can't you dig them flat? Yugong refuted Zhisuo's erroneous thinking and did not waver, digging the mountains more than once a day. This incident moved God, and he sent two immortals down to earth to carry away the two mountains. However, right here, there are also two big mountains pressing down on the Chinese people, one called imperialism and the other feudalism. Our Communist Party has long made up its mind to dig out these two mountains. We will never give up, we will keep working, and we can also move the God. This God is no one else but the people of China as a whole. If all the people who lives in China rise up and join us digging up these two mountains, how does anything we can't overcome?\n\n \"Compatriots of the whole country, China is now facing two different destinies: one to destroy the Communist Party and the forces of democracy in China, leading China into darkness; and the other to overthrow the forces of Japanese imperialism and its lackeys, leading China into light. This is a duel between two destinies, and we firmly believe that, with the unity of all the people, we will be able to defeat the Japanese invaders, overthrow the colonial oppression of the Co-Prosperity Sphere, and establish a new, democratic, equal, united, and independent China that truly belongs to all the Chinese people.\"\n\n \"This war is not just a continuation of the war of resistance against Japan, it is also a war of liberation in which the Chinese people take their destiny back into their own hands, let us unite! Mobilise! Organise! Take up arms and prepare for the struggle!\""
 CPC_TRCW.9.o: "\"We have nothing to lose but our chains. We have a world to win.\""
 CPC_TRCW_FINALLY_BEGINS: "§xONWARDS TO REPUDIATION OF THE CENTURY OF HUMILIATION!§!\nNO MORE TURNING BACK as our forces march eastwards to Tongguan. §VTHE GREAT EAST ASIAN LIBERATION WAR§! presents itself.\n--------------------\nWith the §VEAST ASIAN LIBERATION WAR§! breaking out, New §xWar of Liberation§! GUI as well as National Foci are unlocked.\n\nBefore §YEXECUTING WAR PLAN§! on assorted regions, all §ROccupied Zone§! states gain modifier: Division Speed §R-60%§!, Division Organisation Recovery §R-30%§!, Division Defense§G+30%§!.\n\nAs §RTOTAL WAR§! wages on, all §YREGIONAL BUREAUS§! will be §RDEFUNCT§!, Most §YPARTY CONGRESS§! Functions will be §Rlocked§!, with only §YYEARLY PARTY BUDGET§! requiring executive ratification.\n\nFunctioning Government empowers the£CPGAC_texture_loc §GCPGAC§! to §YINTRODUCE AND EXECUTE ADMINISTRATIVE DECISIONS§!.\n\nImpact of War hinders the §oNUKE PROGRAM§! Assigned to Institute of National Defense, §YMonthly Progress§! of Nuke Programm decreases by §R1%§!."
 CPC_TRCW.10.t: "World-Shaking"
 CPC_TRCW.10.d: "The broadcast of the National Defence Front's declaration of war against the Japanese and the hypocrites was sent out from Xi'an through high-powered relay station signals, which were received at signal towers in the northwest every dozens of miles, spreading outwards to the maximum extent possible. Layers upon layers were passed on, like a lit beacon transmitting the broadcast out across China, and across the world.\n\nIn Nanjing, the National Government declared that the whole country had entered a state of emergency war and that martial law would be imposed everywhere. The Ministry of National Defence announced that the National Army would now begin a general mobilisation for counter-insurgency, that it would fight back against the invasion of the Red Bandits with sincere force, and that it would expand the scope of recruitment as soon as possible. Pseudo-government newspapers, such as the China Daily and the Central Daily, began to publish articles in support of the Presidential Office's decision to counter-insurgency and resist the spread of the Red Scourge throughout China, while some underground newspapers reported that the National Security Bureau was stepping up its efforts to suppress the mass movements in cities under the order of President Gao Zongwu, who had ordered that \"foreigners and the interior should be pacified\".\n\nIn Tokyo, Nagata Machi refused to comment on the matter, but everyone could smell the smell of gunpowder in Tokyo - the cabinet ministers had already left for the Imperial Residence to attend the Imperial Council, and the army and navy had already taken action in advance: the Japanese land garrison in China had already entered the first level of combat readiness, and the navy had declared a blockade of waters from the Western Pacific to the South China Sea, with the fleet sailing into Chinese territorial waters. The Air Force is making frequent manoeuvres at the major airports.\n\nIn Xinjing and Guangzhou, the growing oil crisis and popular uprisings have made it difficult for the local authorities to make any decisions in advance, and they can only maintain a deathly silence.\n\nNew York, Berlin. Almost all major media in Germany and the US have translated and forwarded the full text of the National Defence Front's letter to the whole nation. From political pundits to the general public, the Chinese civil war and the possible third Sino-Japanese war are being discussed enthusiastically, and many people have become interested in the emerging forces of the CCP and the ANRL. , the two superpowers officially behaved cautiously and made no clear statement.\n\nFrom the northwest to the fallen territories, all those who listened to the broadcasts, openly or clandestinely, were talking to each other. Some whispered, some cheered; some were secretly planning, while others took direct action to embrace the revolution; some were jittery, while others finally made up their minds...\n\nBut all this could not be heard by the PLA soldiers on the front line. Carrying guns and cannons, they crossed the Yellow River, crossed the mountains, crept through the dense forests, and slowly pressed forward towards the enemy's goal...\n\nThe sun was setting in the west, and a misty and gorgeous rainbow light was running across the sky."
 CPC_TRCW.10.o: "Crimson of China shall surpass the Fading Sun's Paleness!"
 CPC_TRCW.11.t: "State Title and National Flag for a Rejuvenated China"
 CPC_TRCW.11.d: "When the Kuomintang Government is completely destroyed under the blows of our troops, the formation of a nationwide central government on the basis of the political system of the National Defence Front will need to be put on the agenda as soon as possible. This will not only proclaim to the people of the country that we are the sole legitimate government of China but will likewise consolidate the basis of rule in the newly liberated areas and provide favorable conditions for our march to the whole of China. Now, we must first decide on the official name and flag of the new China."
 CPC_TRCW.11.o: "Decision must be made."
 CPC_TRCW.12.t: "Capital City Designation"
 CPC_TRCW.12.d: "After deciding on the country's name and flag, it was necessary to decide on the capital of the new China as the seat of the central government. Most of the people's deputies to the State Council are now suggesting that Peking would be the best choice for the capital of the new China in all respects, but Peking is still under enemy control, and if the capital were to be set at Peking, it would have to be relocated only after the liberation of the whole country; some are suggesting that the capital should be set up in Nanjing or Xi'an, which would not only allow for quick relocation of the capital but also allow for the use of all the various governmental facilities directly. What should we choose?"
 CPC_TRCW.12.o1: "Beiping"
 CPC_we_choose_beijing: "At the end of the victorious §xWar of Liberation in East Asia§!, we will move our capital to §YPeking.§!"
 CPC_TRCW.12.o2: "Nanjing"
 CPC_TRCW.12.o3: "Xi'an"
 CPC_TRCW.13.t: "Announcement of the Central People's Government"
 CPC_TRCW.13.d: "Since the reactionary Nationalist Government in Nanjing betrayed the motherland, surrendered to Japanese imperialism and launched a counter-revolutionary war, the people of the country have been in dire straits. Fortunately, our People's Liberation Army (PLA), with the assistance of the entire nation, fought bravely to defend the territorial sovereignty of the motherland, to safeguard the lives and property of the people, and to relieve the people's sufferings and fight for their rights, and was able to destroy the reactionary army and overthrow the Kuomintang Government's reactionary rule.\n\nNow that the People's War of Liberation has achieved an initial victory, the majority of the country's people have been liberated. On this basis, the Chinese People's Deputies, composed of representatives of all democratic parties, people's organisations, the People's Liberation Army, representatives of all regions, all nationalities, overseas Chinese and other patriotic and democratic elements, have assembled to proclaim, on behalf of the will of the people of the whole country, the establishment of the Central People's Government of China. This Government is the sole legitimate government representing the entire Chinese people. This Government is prepared to establish diplomatic relations with any foreign government which is willing to observe the principles of equality, mutual benefit and mutual respect for territorial sovereignty.\n\nThis is hereby proclaimed."
 CPC_TRCW.13.o: "Herewith is a Rejuvenated China Proclaimed!"
 CPC_TRCW.14.t: "Length of the time"
 CPC_TRCW.14.d: "Life is sometimes quite complex, so complex that even a million words are not enough to explain it; life is sometimes very simple, so simple that a few fluctuating lines can summarised it with ease. The mighty mind accompanying Mao Zedong for half of his lifetime has quietly withered, leaving an old body lying on the dead bed. Wearing a breathing mask, connected to an electrocardiogram, with a mess of tubes and wires all connected to Mao, tugging at him tightly, as if not been carefully taken care, this dying old man may turn around and leave this world, never to return.\n\nThe white curtains of the ward were tightly drawn, but they could not keep out the glitter of stars, and fireworks set off to celebrate the founding of a New China illuminating the Hanzhong's night sky as bright as day.\n\n \"So...bright…outside...\"\n\n A voice so hoarse and weak that it was almost inaudible sounded softly. The nurse in front of the hospital bed was the first to come to the bed, followed by Deng Xiaoping in a white coat. Before, everyone did not expect that Mao Zedong, who had been in a deep coma, could regain consciousness and speak again.\n\n \"Sir, Chairman…he is…\"\n\n \"You may tell Chairman the situation.\" Deng Xiaoping stood with his hands down, his face solemn, \"If Chairman can wake up now, it means that he still has things on his mind that he can't let go of. Whether we talk about it or not, the Chairman may not be able to make it through the night.\"\n\n So the nurse leaned down and put her face to Mao's ear.\n\n \"Chairman, the people outside are celebrating the founding of a new China with fireworks.\"\n\n\"A...New China…new...China.\"\n\n Mao slowly pronounced that words twice as if he were chewing on a plum. His expression was hard to see given the oxygen mask on his face, but at a certain moment, everyone present saw that the Mao's mouth seemed slightly higher.\n\n \"Did...did Chairman smile just now?\" Deng, who was momentarily lost in thought, couldn't help but blurt out.\n \"Sir, it is not the time to talk about this!\" The nurse was so anxious that she was about to cry out, \"Chairman…Chairman's heart cease to beat!!\"\n  \"Chairman! Chairman!!!\"\n\n The electrocardiogram's mournful alarm resounded through the ward - and around this air defence fortification, the city of Hanzhong celebrates with enthusiasm, one of the biggest fireworks of the night was hissing and whistling as it helicoptered up into the sky, blossoming into one of the most brilliant flowers on the nightsky."
 CPC_TRCW.14.o: "Chairman! Wake up please! Chairman!"
 CPC_TRCW.15.t: "Japanese Secret Letters"
 CPC_TRCW.15.d: "\"To the Chairman of the National Defense Front of China and the Members of the Central Committee of the Communist Party of China:\n\nTo date, the Empire of Japan has stood alongside the recognized government of the Republic of China in pursuit of Pan-Asian peace. However, the intense domestic warfare in China and the surging tide of public opinion have evolved to a point that may no longer be favorable to Japan. Therefore, our government now expresses its utmost sincerity in listening to the voices of the Chinese people and respecting their autonomous choices. In this letter, the Prime Minister himself conveys his goodwill and hopes the members of the National Defense Front will consider his generous proposal.\n\nThe Empire reaffirms its desire for peace in Asia, in line with the ideals of Pan-Asian unity. Should you agree, ceasefire negotiations can commence immediately. However, we must remind you that any pursuit of peace must maintain China's current legal territorial boundaries and acknowledge the independence of nations such as Manchuria and Mengjiang. The Japanese army is willing to withdraw entirely from within China's borders, return sovereignty, and respect the autonomy of China's new government.\n\nAdditionally, we are aware that your forces destroyed our battleship Kirishima at the Yangtze River estuary. The Kirishima's unauthorized entry into the estuary was due to the impulsive actions of certain navy officers and does not reflect the official stance of the Empire of Japan. We are willing to let this matter rest without further pursuit. However, we demand the immediate return of the detained combat personnel aboard the ship. They are all citizens of the Empire of Japan. Should you insist on holding them, the Imperial Government will have no choice but to view this as an act of direct confrontation. Consequently, all subsequent diplomatic negotiations will be canceled, and we will consider it a declaration of total war against your side.\n\nFor the lasting peace of East Asia and the welfare of all its people, we hope both sides can reach a consensus on this matter, as we have in the past. The Japanese government has already made generous concessions and hopes that our desire for peace will be respected by the Communist Party of China.\n\n—The Tennou, [JAP.GetLeader], humbly serving His Majesty the Tennou\""
 CPC_TRCW.15.o: "It's a fool's errand and incomprehensible."
 CPC_TRCW.16.t: "The terminus of time."
 CPC_TRCW.16.d: "In the dimly lit corridor outside the emergency room, a somber assembly had gathered. Bo Yibo, Jiang Qing, Xi Zhongxun, Han Guang, Xie Jingyi, and Guan Feng stood together, their collective gaze fixed on the closed door. They waited in silence, bracing for the inevitable moment. Finally, the door of the emergency room swung open, and out stepped Deng Xiaoping, clad in a white coat. He paused briefly, his hand lingering on the doorknob, and then he closed it firmly behind him. Jiang Qing, her anxiety mounting, leaped forward and accosted him, urgently inquiring if the Chairman had spoken to him. Her impatience stemmed from the fact that her own political power hinged on the Chairman's continuing support. If he were to pass away, she feared her position would crumble, leaving her vulnerable to expulsion by others in the leadership.\n\nIn truth, Mao Zedong in the ward himself harbored similar concerns. Even upon hearing the news of the founding of the New China, he couldn't entirely let go of the politically inexperienced student named Jiang Qing. When faced with Deng Xiaoping's forthcoming meeting with her, he uttered these words in private: \"Your political acumen surpasses hers; she's not as capable as you.\" This implied that Deng Xiaoping must ensure Jiang Qing's standing within the Party. Should he dare to marginalize the Chairman's widow, there would be consequences.However, Mao Zedong strictly forbade Deng Xiaoping from conveying these sentiments to Jiang Qing, fearing that it might exacerbate her immaturity.\n\nDeng Xiaoping, prepared for Jiang Qing's interrogation, stood. Simultaneously, grief and fear clouded Jiang Qing's mind, and she could no longer fathom how to swiftly secure her position in this precarious moment.\n\n\"I asked the Chairman how he wanted his body to be handled. He said it should be cremated,\" Deng Xiaoping began.\n\"Is there more?\" Jiang Qing demanded.\n\"I asked him if he wanted it preserved indefinitely, just like Lenin. He said he didn't want any fuss.\"\n\"Anything else?\"\n\"He said it should be kept secret. The war is not over yet. It should be decided after the total liberation of our country.\"\n\"ANYTHING ELSE?!\"\n\"No...nothing more.\"\n\"NOTHING MORE?!\"\n\nJiang Qing's eyes reddened, and she forcefully pushed past Deng Xiaoping, rushing into the room. She collapsed at the bedside, tears and snot flowing as she sobbed, \"Chairman...Chairman...there must be something else you want to tell me...You can't just leave me like this...tell me more instructions...Please...Chairman...Please...\"\n\nAs she spoke, Jiang Qing's hands frantically searched Mao Zedong's body, as if she could find the nonexistent instructions. Soon, doctors arrived to restrain the distraught Jiang Qing, and Guan Feng and Xi Zhongxun escorted her out. Under the doctor's orders, Bo Yibo, Deng Xiaoping, Han Guang, Guan Feng, and Xie Jingyi entered the room, bidding their farewell to the great leader on his deathbed.\n\nAt exactly 12:09 AM, Mao Zedong's heartbeat ceased its rhythmic cadence, and his soul descended into the realm of eternity. His directives would be carried out by his comrades, his ideology would be emulated by future generations, and his legacy would be etched into the annals of history."
 CPC_TRCW.16.o: "The hands of time, frozen in that very moment."
 CPC_TRCW.17.t: "The 392 Steps"
 CPC_TRCW.17.d: "The secluded Purple Mountain is a great weekend getaway for politicians who are tired of fighting, but what if they were kept there for nearly 30 years? Soong Ching Ling was thus confined to this mansion by the pseudo-government - anyone else would have suffered a nervous breakdown, but she had long since recovered from the depression of her confinement. Although the pseudo-government prohibited her from communicating with outsiders and reading about current affairs, she was able to turn to poetry to relieve the boredom of her confinement. \n\nShe knew that the hatred of losing the party and the country had never left her mind, and how she hoped that one day the Chinese people would be free to stand among the peoples of the world.\n\nThe rabbit flew away, and time passed.\n\nThe sound of artillery fire in the distant city gradually subsided, and the pseudo-government guards who were originally responsible for guarding her were long gone. With a convoy of People's Liberation Army troops driving into the residence, she was also freed. The first thing Song Qingling did after gaining her freedom was not to visit the leaders of the PLA, but to tell the guards around her that she wanted to see Mr Sun. Fortunately, the distance between the public house and the Dr Sun Yat-sen Mausoleum was not too far, and the chief agreed to the request.\n\nStep by step, step by step, she gradually approached the resting place of her beloved. Step by step, step by step, her prolonged confinement had weakened her body, and on the last few steps, she was on the verge of falling, only to be assisted by a bystander. Step by step, step by step, the hobbling Soong Ching Ling was finally reunited with Dr Sun Yat-sen, and the devastated Nanjing was finally returned to China's embrace."
 CPC_TRCW.17.o: "\"Yat-sen, I'm back...\""
 CPC_TRCW.18.t: "Final Agreement"
 CPC_TRCW.18.d: "To His Excellency President of the Central People's Government of China:\n\nThe possibly not beneficial development of armed conflict across East Asia which swallowed thousands of innocent imperial subjects, causing unpleasantries among workers, enterprises and expatriates and loyal warriors of the Empire serving to secure their life has propelled the Imperial Government to present the People's Government the following proposals for enduring peace between the two nations.\n\n1. All warriors serving in IJA, IJN along with other supplementry units cease all military actions and proceed to full course withdrawal.\n2.The Empire rescinds support to regimes stationed in Manchuria, Mongolia and Guangdong, returning their sovereignty at China's disposal.\n3. All belongings of Japanese enterprises pending withdrawal be preserve intact for future discussion.\n4. Japanese nationals be protected and repatriated by mutual agreement.\n5. Demilitarisation status be enforced on area alongside the Yalu River, with troops movement be announced 1 month in advance.\n6. Japanese Empire agrees to restore friendship between the two nations before the conflict breaks out.\n\nThis is the final agreement with no article to alter. May His Majesty's will be heed along with the sincere proposal unanimously adopted by the Diet,lest final retaliatory measures be taken.\n\nHerewith, the Imperial Government of Japan"
 CPC_TRCW.18.o1: "Now back to the negotiating table."
 CPC_TRCW.18.o2: "No! We cannot just stop right here and now."
 CPC_TRCW.19.t: "Terminus"
 CPC_TRCW.19.d: "In the Bible, it is said that God destroyed Sodom with fire and brimstone, exacting vengeance upon this unjust city.\n\nZhao Dezhi had never read the Bible; he was a staunch atheist. He was of the people of the Northwest National Defence—once, that is.\n\nHe remembered only running. Stole a horse and ridden out of Hohhot. At first, the police were chasing behind him, but he did not look back. He didn't remember how far he had ridden, only until the shouts of the police faded, until the horse collapsed beneath him with blood foaming from its mouth.\n\nHe dragged his injured leg onwards, limping to the east. Occasionally, he heard thunderous roars from behind, but he did not turn his head. He kept walking until the sun vanished entirely below the horizon and the stars filled the sky —\n\nIn the Bible, it is said that Lot's wife looked back at the fiery destruction of Sodom and instantly turned into a pillar of salt.\n\nZhao Dezhi had never read the Bible, and he was certainly not a tender-hearted woman. But now, he could move no more. He sat on the grasslands of Inner Mongolia, staring back in the direction he had come.\n\nUnder the starry sky, he saw distant fires ignite and flicker intermittently. They were mere pinpricks in his eyes, but their redness pierced him—\n\nHe remembered the militia's anti-nuclear manual distributed last month. He raised his hand, the glare and calamity were covered the upraised thumb, as if there were still the last bastion of resistance against the Japanese, the last hope of a Free China, not another \"Sodom\" lost to the inferno, not an \"Asian menace\" destined to be destoried.\n\nNo one who puts his hand to the plow and looks back is fit for service in the kingdom of God.—Jesus seemed to had said something like that, he guess.\n\nZhao did not know for sure that Jesus had spoken those words. He probably would never get the chance to know. What stood above the sun's majesty was not God but the gods of Takamagahara and their progeny. The offspring of the divine walked among mortals, using fire and brimstone to obliterate the last redoubt of Judeo-Bolshevism in East Asia, to destroy \"Sodom.\"\n\nThe fortune of surviving this disaster would one day turn to wrath. Those unjust souls who had escaped Sodom might yet perpetrate wickedness upon the promised land under the reign of the gods of Takamagahara—"
 CPC_TRCW.19.o: "—But here, the tale of the wicked draws to a temporary close."
