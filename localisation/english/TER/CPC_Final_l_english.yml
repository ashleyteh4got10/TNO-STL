 CPC_TRCW.599.t: "Last Bus"
 CPC_TRCW.599.d: "Ma Jiuliang smoothed his messy hair against the car window, above his neat suit, his handsome Chinese face overlapped in the passing night scene of the city, the colorful lights skimming over the composition line hid his eyes, and he could only be heard repeatedly reciting a rather fluent Japanese honorific. Like appreciating an essay, he silently pondered the meaning of the composition.\n\"Bell-!!!\"\nThe urgent disembarkation bell interrupted Ma Jiuliang's thoughts, and he pinched his brow and shook his head. The habits he had developed from his work kept him unconsciously introspective. It was only speaking Japanese that helped him forget his despicable status for a while and reach peace.\n\n\"Damn it, Shimura you bastard...\"\n\nMa Jiuliang gritted his teeth and secretly hated his incompetence, but he still let that incident disturb him. His work in the Su village was excellent, nearly half of the people were willing to transfer peacefully, and it was all because of him alone, why was Shimura's attitude even more contemptuous than usual? He was just a lobbyist who knew two languages like himself, and even his Chinese wasn't very good, so what right did he have to mock others? Just because he's close to the military?...Fuck, it's all a bunch of bells and whistles! They should be praising my name at the meeting, not that bubble of vanity-ridden shit!\nEven without saying it out loud, Ma felt a sense of loss and remorse for not suppressing these rude thoughts. But the thought that Shimura could have been in his luxury suite in Kyoto by now, mocking his Shimura to his escort, made him want to sink his teeth into his opponent as if he were him.\nThe car finally stopped, and inside the empty compartment, lonely thoughts wandered outside his body. With that newspaper from last night, it seemed that he could already feel the northern earth trembling with the speed of a hundred ghosts.\n\nNever mind, it doesn't fucking matter. Guilin has been \"liberated\", great, no longer have to deal with those poor people. I'm sorry to say that I've wasted those 10 years of my life...\n\nLaughing, still thinking about school days? One's next life is gone! After all these years of not hitting a farmer and cursing him, but just peacefully putting them in their place, what crime did one commit? Yes, one did work for the Japanese, and one did despise those fools. But if it wasn't for him, what would have been done about those peers who didn't give a shit and just wanted to get money? What would those asshole soldiers have done? What would have happened to those local officials who took the chicken feather for an arrow and probably never stepped halfway out of their offices? What about myself? What's the reward for ten years of dedicated service? Traitor! Shot! And now he's a wanted man. It's fucking great! The perfect ending!\n\nGazing out the window at the still-sleeping Steel City, he laughed uncontrollably. Before the madness completely consumed his sanity, before the gun in his purse was pointed at his temple, before the piercing wail of grief brought an infinite deathly silence, he snapped back to the last time he'd laughed from the bottom of his heart."
 CPC_TRCW.599.o: "In 1943, he was chasing and playing in the village."
 CPC_TRCW.813.t: "The Sun Rises in the East..."
 CPC_TRCW.813.d: "Almost no one can deny the importance of the city of Shanghai to modern China, both as a bustling economic center at the mouth of the Yangtze River and as a brutal footnote to the ravages of imperialism on the mainland. For the Communists, the liberation of the city was more than just a major military triumph - it represented a return to the city after nearly half a century of separation.\n\nThe key figures of the pseudo-government had fled to the north days before the PLA entered the city, and the Japanese expatriates had taken everything they could carry with them, leaving the place that had once provided them with a life of luxury. Under the complicated and surprised eyes of the citizens, the People's Liberation Army marched into the city in a neat procession, taking over the property and protecting the city under strict discipline, to quickly restore order to the city. But the darkness over the city has not yet lifted: the Imperial Navy in the East China Sea is waiting for an opportunity to reclaim one of the jewels of the Co-Prosperity Sphere for the Empire.\n\nBut for today, the sun of tyranny has set over the East China Sea, and the once-unspoiled city will be bathed in the light of new life."
 CPC_TRCW.813.o: "... In Honor of Our Vocation."
 CPC_TRCW.607.t: "Forward flows in Luoshui River Recollections of Our Motherland..."
 CPC_TRCW.607.d: "Cannon fire roared through the heart of the Central Plains, shaking the people of this land once again. It had been more than ten years since the turbulent times of China's past, which had struck like a hammer in the heart of every person in the area.\n\nSeveral lines of defense of the Japanese Imperial Army at Tongguan were successfully encircled and shattered by the PLA with the sacrifice of formed units, and those national troops stationed on the railroads did not come to their aid for various reasons, but instead tried their best to close in on Luoyang.\n\nAfter the railroad leading from Luoyang to Zhengzhou was successfully cut off by the guerrilla columns, the PLA formed an encirclement of the enemy forces in Luoyang. After several targeted raids on the east gate urn, Luoyang was liberated.\n\nWhen the first batch of commandos who had finished the battle saw an old villager looking at them from afar, they put their weapons to their side and greeted each other with accents thousands of miles apart, saying, \"The People's Liberation Army is coming! China is going to be liberated!\"\n\nAfter the army entered the city, the political cadres quickly organized some of the soldiers into propaganda teams and began to make the people here as aware as possible of what the People's Liberation Army was, what the Communist Party was, and what the War of Liberation was all about. However, the people of the old country had some idea that the Chinese people were not only the people of the Central Plains, but the PLA would also have to face the non-liberated areas and people at the ends of the earth and the corners of the earth, which were as vast as the sea.\n\nAfter arranging the order and defense matters in Luoyang, the other PLA officers and soldiers looked to the far east on the strategic map, and so did the people.\n\nWith one heart and one mind, we braved enemy fire and marched, marched, marched ......"
 CPC_TRCW.607.o: "...The lights of Shanghai shine on my heart."
 CPC_TRCW.596.t: "Flattering Cabaret No More"
 CPC_TRCW.596.d: "The military boots stepped over the solid ground in silence. The blood that flooded this land has changed from the crimson blood of the people thirty years ago to the tainted blood of traitors and invaders. The People's Liberation Army (PLA), which had just occupied downtown Hangzhou, did not have time to do much restoration before assembling and forming up again and setting out in full gear. Undressed people poked their heads out from behind the broken walls and stared silently at the soldiers marching on the tattered roads. Some had terror in their eyes, some were excited to rush forward and join them, but more than anything else, they were numb. From heaven on earth to hell on earth, anyone would need time to adapt.\n\nThe People's Liberation Army walked around the West Lake with heavy steps. The once beautiful pearl of Jiangnan is now nothing but charred deadwood and collapsed buildings, as well as the murky gray water of the lake. Those who need a lot of people to close the ancient trees, now only scorched stumps; Su Shi presided over the construction of the Su Causeway in the six bridges have become broken bridges; Three Pools and the Moon is only left with a broken stone tower; Wenlan Pavilion is early by the Japanese invaders burned, which the ancient cultural relics have long been sent by the Gao Zongwu people to Taipei, I'm afraid that the next will be forwarded to Japan, right.\n\nThe People's Liberation Army has only one goal, and that is to eliminate the Japanese troops entrenched in Lingyin Temple. Until the PLA shouted in front of Feilai Peak, nestled in the Pharmacist Hall to imagine that reinforcements come to save their own Japanese, and pseudo officers only woke up as if in a dream, panicked and organized defense. They know very well that surrender is only a dead end. Seeing the ineffectiveness of shouting, the PLA commanders immediately began to implement the booking of the battle plan. To prevent damage to the monuments, they did not carry heavy firepower, only heavy machine guns. They quietly touched the gate, made hand signals, and rushed into the Hall of Heavenly Kings together.\n\nMuzzle fire and streaks of blood filled the Buddhist shrine, and Maitreya Buddha's smiling face and belly were splattered with dark red blood. Among the rising and falling wails were the moans of the PLA, but more than anything else, the screams of the enemy. Enemies before the war in Hangzhou daily spend the day, singing and dancing, sparse battle, had long been no match for the battle-hardened People's Liberation Army, and some enemies even had rounded and huge bellies.\n\nThe battle was soon over. The PLA rushed into the Huayan Temple and controlled the stubborn elements who intended to set the fire. Immediately afterward, the commanders at all levels began to count the number of people, treat the wounded, and escort all the prisoners away from Lingyin Temple. What awaited them could not be songs and dances, but only the judgment of the people's will."
 CPC_TRCW.596.o: "Hangzhou can no longer be Bianzhou, but it can be their Fengdu."
 CPC_WINS_TRCW: "The §xVISION OF INDEPENDENCE AND FREEDOM§! harboured by the Chinese Nation since one Sexagenary Cycle has been finally §xrealised§!!"
 CPC_TRCW_end.1.t: "Common was the same Moon and Homesickness(1)"
 CPC_TRCW_end.1.d: "Su Qingli adjusted the frequency band of the radio, trying to be able to find some useful information in a sea of rustling white noise, and as the voice from the speakers became clearer and clearer, her hand cupping the knob gradually slowed down - \"Now broadcasting 'On the liberation of Taiwan' written by comrade Su Xin, a communist fighter from Taiwan...\"\nWhen she heard the word \"Su Xin\", Su Qingli's hand on the antenna suddenly trembled, and the white noise then overpowered the human voice and dominated her ears.\n\nThe following day, Su Qingli knocked on the door of Chen Mingzhong's house with the transcribed full text of On the Liberation of Taiwan, it so happened that Chen Yingzhen and other underground left-wing friends in Taiwan were also there at that time, so Su Qingli excitedly read aloud the article.\n\n\"This article by senior Su Xin is truly deafening, and now that the mainland has fully realized its independence and freedom, it is truly invigorating!\" After listening to Su Qingli's reading, Chen Yingzhen applauded excitedly, \"But on the contrary, we in Taiwan...\"\n\"Don't be discouraged, revolutions don't happen overnight, I think a few of us should respond to the mainland's call and set up a revolutionary group of our own in Taiwan.\" Chen Mingzhong's words awakened his friends and fellow travelers present, and they all looked at each other and nodded tacitly.\n\nReturning to her house, Su Qingli still felt that the fire in her heart had not yet been extinguished and that her father was still alive was a great encouragement to her. She hurriedly drew out her letter paper and found a pen, and wanted to write a letter to - she did not know to whom it should be given, but one day it would be delivered to her father's hands.\nSo she thought, and, pen in hand, she began to pour out her heart."
 CPC_TRCW_end.1.o: "\"Dear Comrade Su Xin My Father...\""
 CPC_TRCW_end.2.t: "Common was the same Moon and Homesickness(2)"
 CPC_TRCW_end.2.d: "The first secret meeting to establish the Forum of Revolutionary Groups was held at Snowy Peak. The conference lasted one day and determined the constitution and organization of the Revolutionary Forum, and by the time the delegates filed out of the conference hall, it was already late in the evening.\n\nAfter dinner, we walked on the mountain top, when the top of the mountains to see the mountains in Chen Yingzhen's chest, he opened his mouth to ask: \"Everyone, from here can we see the mainland?\"\nFollowing his finger, the crowd looked to the northwest - but found nothing but dense sea mist.\n\nSeeing that the atmosphere was a bit stiff, Chen Mingzhong took out his binoculars, \"How do we know if we don't try?\" He took the binoculars and repeatedly fiddled with them, but the lens was always a misty mess.\n\n\"The fog is too big, I'm afraid it won't work.\" Su Qingli shook her head, \"Maybe we'll come back up to Snow Mountain Peak tomorrow to take a look?\"\n\nNo one responded to her suggestion - revolution doesn't always wait for the next day's sun, and the fog in front of her seemed like the prospect of Taiwan's revolution - confusing and worrying.\n\nSuddenly, the light of the setting sun burst through the clouds. The faint outline of the other side of the strait appeared in the crowd's field of vision. Everyone's footsteps froze, and Chen Yingzhen turned around, reaching out his hand out of thin air in an attempt to touch his imaginary motherland, and softly singing under his breath the lyrics that had been passed down for a hundred years."
 CPC_TRCW_end.2.o: "\"Arise, ye Prisoners of Starvation...\""
 CPC_TRCW_end.3.t: "Common was the same Moon and Homesickness(Fin)"
 CPC_TRCW_end.3.d: "Secretary of the Southeast Bureau Han Xianchu wants to give the comrades in Fuzhou a surprise, with the party, government, and military dignitaries to inspect the sea defense preparedness work to Pingtan Island, at the end of the routine inspection, there is a newly formed troop have been waiting for the pillow - \"the first regiment of the People's Liberation Army Marine Corps \", which is the Central Military Commission approved the establishment of the first experimental Marine Corps - with the inspection group to visit the end of the Han Xianchu in the regimental headquarters of the temporary construction of the open-air meeting place to make a speech: \"This time to bring you over is not to come here to eat, drink and have fun, I know. I know that some of our comrades think that when we arrive in Fujian, it means that the whole country has been liberated, and we can rest easy and enjoy peaceful days. This idea is wrong, the whole of China has not been completely liberated, because the Japanese imperialists are still entrenched in our country's Taiwan, watching intently, they have a powerful navy and air force, with far more than our high-tech weapons, and powerful atomic bombs, and they won't easily admit that they have lost the battle in the Chinese mainland, and may roll over at any time. mainland China, they may make a comeback at any time, and then this land under our feet will be the forefront of the war, and we don't just have to defend, we also have to attack!\"\n\nAfter a pause, Han Xianchu pointed to the sea behind him and said, \"What can you see from here? I see four words: ten thousand miles of sea border, China's ten thousand miles of sea border! How can we give it away? The Japanese have a strong navy and air force, we will also have a strong navy and air force, if ten years do not work, then twenty years, if twenty years do not work, then another twenty years, we will one day be able to hold the motherland's blue skies and the sea completely in our own hands, and will no longer allow anyone to wreak havoc and overrun it.\"\n\nTurning again: \"Recently, Comrade Su Xin received a letter there, is his daughter through comrades in Japan forwarded to us here, she said in the letter that she would inherit her father's cause, in order to liberation Taiwan and the unity of the nation and the fight, even so lonely and helpless a girl doll have such a realization, how can we, these big men and how to lag behind others? When the President was still alive, he told me that he had not seen the sea for many years, and if I had the opportunity, I would like to go to the ends of the earth to see the motherland on his behalf. At that time, I had just received a transfer order from the Southward Corps to go to Sichuan - how could I have thought that one day I would be able to come to Pingtan Island to see our Taiwan Strait? But we have really come through step by step, and in the future, we will continue to move forward, ever forward, and eventually break out of the imperialist encirclement and travel every inch of our motherland's mountains and rivers!\"\n\nWarm applause rang out, but Han Xianchu looked past the gathering heads to the sea at sunset, the outline of Taiwan's islands looming over the sea level, and he knew that at this time there would surely be people looking this way as well, just as they were now."
 CPC_TRCW_end.3.o: "One day, you and I will meet again."
 CPC_TRCW_end.4.t: "Samchunri Gangsan"
 CPC_TRCW_end.4.d: "Hwang Sok-yong, a young left-wing writer who had received support from the Chinese government, decided to give a public speech to the students after work. The few students in the base (including elementary, middle, and college students, as well as night school workers) gathered in the square of a former Japanese high school to listen to Hwang Sok-yong's speech. In front of thousands of people, Hwang took out a blackboard and wrote down the words \"father,\" \"mother,\" and \"family\" and asked the students to tell him what they meant. He smiled with satisfaction and wrote another word, \"motherland\". At that moment, the students' eyes shot up at him, some of them wanted to speak but didn't know what to say. Hwang Sok-yong began to explain the word, \"The motherland is our mother and father, our common home. And what is the name of our motherland?\"\n\nHe wrote down two words: North Korea.\nAt the same time, the staff around him unfolded a large-scale map of the Korean Peninsula with the bases marked in red.\nHwang Sok-yong pointed his finger at the map and talked about the thousand-year history of the ancient state of Joseon, Yi Sun-sin and Ahn Chang-geun, Pyongyang, Seoul, Pusan, Jeju, and the 3,000-mile territory of Joseon.\nJust when all of them were intoxicated and mesmerized by the story of 3,000 miles of rivers and mountains, he changed his words and pointed to the red base on the map and said, \"We only have such a little place now. Students, would you like to have only this little bit of our home? Would you like your moms and dads to have their bodies chopped off and only have one head left?\"\nThere was still silence at the bottom, but the difference was that this time, the silence held a plain anger-\n\nHwang Sok-yong took a deep breath and roared in a very impassioned tone, \"This! is the first lesson I've taught you all! I am a North Korean! My motherland is North Korea! I deeply love my motherland! I will never allow anyone to continue to violate and bully it!\""
 CPC_TRCW_end.4.o: "\"Jogug Manse!\""
 CPC_TRCW_end.5.t: "New star"
 CPC_TRCW_end.5.d: "\"Old Ji, I've been waiting for you for a long time.\" Seeing Ji Dengkui push open his office door, Liu Jianxun smiled and let out a breath, \"Nanjing's reception of the transformation work is still smooth?\"\n\nJi Dengkui smiled bitterly and shook his hand, \"Quickly don't mention it, if there is a next life I can't be the secretary of the Nanjing Municipal Party Committee, you don't know how prickly these underground democratic associations in Jianghuai are, and it cost me a lot of words to open the CPPCC meeting.\"\n\n\"The same goes for Beijing.\" Liu Jianxun spread his hands, \"The first National People's Congress is about to hold elections, the national political situation is very complicated right now, there's no doubt that there's a generation gap between us and these newly liberated areas in central and eastern China over the years, they can't think the same thing as we do.\"\n\n\"However,\" Liu Jianxun's words turned, \"Alas, in fact, it's normal for the NPC to be elected not in line with our expectations, it was supposed to represent the people's position-isn't there an old saying from our Party's Revolutionary War period that. 'There is no party outside the party, imperial thought; no faction inside the party, a thousand oddities', not only is it difficult outside the party, but there will be no shortage of people opposing us inside the party.\" Ji Dengkui nodded: \"In fact, I think, we are trying to make a new China, so we can't go back to Gao Zongwu's old ways, if we can't listen to the people's voices and objections, the trouble will come in waves - in the future, there is only one thing we have to do, we have to defend the National People's Congress so that it can represent the people's s will, and not be taken over by ambitious people ......\"\n\n\"There's no need for slogans, I'm clear that you and I won't budge on matters of principle.\" Liu Jianxun turned over a crumpled piece of white paper from the drawer, on which some words were written crookedly - it seemed to be the handwriting of an old man when he was in his waning years: \"Open the 10th Congress as soon as possible after liberation and call Liu and Ji to the Central Committee to participate in the meeting.\"\n\n\"What does the Chairman mean?\" Ji Dengkui came forward.\n\n\"I heard Secretary Deng say that it was entrusted to him by the Chairman a few days before he left.\" Liu Jianxun's face was grave, \"Secretary Deng warned that many of the old cadres in the party feel that we are young and shallow in seniority, and feel that we are not yet qualified to participate in the Politburo meeting ......\"\n\n\"Asshole words, dry revolution is still divided into old and young, Premier Zhou's retirement resolution before he left was forgotten by this group of people is not.\" Ji Dengkui whined, \"In the next few years we have to do something to shut them up.\"\nLiu Jianxun stopped talking and just nodded silently.\n\nThe door thumped, Liu Jianxun raised his head, \"Please come in!\"\n\nThe one who came in was no one else but Zhuo Lin, she skillfully nodded slightly to Liu Ji and the two of them, \"It just so happens that Comrade Ji Dengkui has also arrived, Comrade Xiaoping has asked the two of you to come over to his place after you have settled down, to discuss the preparations for the Top Ten.\"\n\nThe two looked at each other and stood up."
 CPC_TRCW_end.5.o: "\"Got it, Comrade Zhuolin.\""
 CPC_TRCW_end.6.t: "The Announcement"
 CPC_TRCW_end.6.d: "To accomodate future massive reconstruction and recuperation tasks, the works and institutions within the Central People's Government must be reorganized. A new unified central authority of the revived China must base upon the Socialist System. Also, the establishment of regional People's Governments and Military Institutions are planned.\n\nDirectives are as following:\n\n1. Reform the Government Affairs Committee into the State Council, empowering it so as to administer national affairs on behalf of the Central People's Government.\n2. Establish Regional People's Government in Newly Liberated Zone directly affiliated to Central People's Government. The Regional People's Government is the leading and supervisory organ of local governments on behalf of the Central Government.\n3. Establish Military Districts in Newly Liberated Zone parallel to Regional People's Government. Military Districts submit to orders of the Central Military Commission and are directly deployed by the Central People's Government.\n\nThe Orders listed above shall proceed after complete liberation of our motherland."
 CPC_TRCW_end.6.o: "The Central People's Government has been inaugurated today!"
 CPC_TRCW_end.7.t: "Banquet Sorrows"
 CPC_TRCW_end.7.d: "In the banquet hall of Xi'an, a celebration was held to commemorate the liberation of all of China. There were central leaders, local officials, representatives of various professions, and ordinary citizens in attendance.\n\nAmidst the revelry, only Wang Guangmei noticed the absence of one person - her husband, Liu Shaoqi. Initially, she thought they had missed each other due to the toasts and well-wishing activities that scattered them across the hall. But as minutes passed, Liu Shaoqi did not reappear before her eyes. Had he been detained at another table for drinks? With a mix of doubt and unease, Wang Guangmei apologized to her table companions and left her seat to embark on the quest to find Liu Shaoqi.\n\nToday was a day free from the constraints of formal etiquette. As the banquet progressed, the scene grew increasingly chaotic. Wang Guangmei had to exert considerable effort to push her way through the crowd to reach the table where the Defense Garrison Corps was seated.\n\"Xiao Jingguang, have you seen Comrade Shaoqi?\" she inquired.\nXiao Jingguang, somewhat inebriated, mumbled with a slurred speech. He mentioned that Liu Shaoqi had moved on to another table for more drinks and was no longer there.\n\"He's quite cheerful,\" Xiao Jingguang added.\n\nWang Guangmei then proceeded to the table of industrial workers and inquired about Liu Shaoqi's whereabouts. A metalworker informed her that Chairman Liu had moved to the table of their older leaders after toasting here. He then filled a glass and raised it to Wang Guangmei, saying, \"All the workers wish Chairman Liu good health!\"\n\nWang Guangmei expressed her gratitude and took a sip of the drink. The older leaders, undoubtedly led by Zhao Mingxin, were Liu Shaoqi's old comrades.\n\nUpon reaching the destination, Wang Guangmei was shocked to find that everyone at this table was in a drunken state - some were laughing, some were crying, and Liu Shaoqi sat pale and motionless in his chair. Wang Guangmei was furious. How could he have drunk so much? She tugged at Liu Shaoqi's arm but found that he wouldn't budge.\n\"He seems...to have frozen,\" she stammered.\n\nLiu Shaoqi, overwhelmed by excessive emotion and under the influence of alcohol, had suffered a sudden stroke, leaving him paralyzed in his seat. Wang Guangmei, filled with a mixture of anger and despair, discreetly had the waitstaff carry Liu Shaoqi away under the pretext of him being drunk, through a side door, and onto an ambulance that raced away. However, it was already too late. He passed away during the journey due to a stroke."
 CPC_TRCW_end.7.o: "At least he had been happy."
 CPC_Lin_Coup.0.t: "Secret report from the rear"
 CPC_Lin_Coup.0.d: "A top-secret telegram from the Xi'an Forestry Office was sent to Lin Biao, who was on defense on the Beiping and Tianjin front, with a cryptic message saying, \"The tree has fallen, the birds and beasts are not scared.\"\n\nHis brain buzzed, and immediately realized what Ye Qun meant: the President had died - but now Lin Biao could not grieve, the eerie peace on the Beiping and Tianjin front would not last long, probably not a week, or even three days, the silence on the front was bound to be broken - and he still needed to direct the deployment of the campaign to liberate the Northeast.\n\nBut then he thought back to those days in the base area: the Political Affairs Committee was full of tug-of-war and indecision, and Zhou Enlai, or Deng Xiaoping, was running around for the intentions of those few ambitious men - either sick or disciplined. ......\n...... Yes, after Zhou Enlai's death, Bo Yibo and his gang began to step up their efforts to remove military representatives from the government, obviously to sideline me as Chairman of the Military Commission. ......\n\n...... But the President also said that the Party commands the gun, not the other way around. ......\n\n...... not right, I am also the center, go back to open a Politburo meeting to see who has more energy, why start a coup - they want to withdraw my power, why can't I withdraw their power ......\n\nThe more he thought the more irritated he touched the chin of the beard that had not been shaved for some days, and raised his head to look at the topographic map of the Northeast, his eyes penetrated a coldness - but soon, that coldness was transformed into a kind of helplessness and fatigue, he looked up and saw the statue of Chairman Mao hanging higher, and took a deep breath to calm down.\n\n\"Everything is focused on the war ......\" he muttered, crushing the peanuts in his hand as he did so, \"...... If I come back from the Shanhaiguan and you guys are still like that ......\""
 CPC_Lin_Coup.0.o: "\"...Then don't blame me.\""
 CPC_Lin_Coup.1.t: "New star?"
 CPC_Lin_Coup.1.d: "\"Old Ji, long time no see.\" As Ji Dengkui pushed open the door to his office, Liu Jianxun greeted him with a grave expression. \"How's the progress with the reconstruction work in Nanjing?\"\n\nJi Dengkui shook his head sternly. \"Don't even mention it.\" The two exchanged a silent look, understanding each other's concerns without needing words.\n\n\"…How's the situation in the Central Committee?\" Ji Dengkui was the first to break the silence, asking a question he already knew the answer to.\n\nLiu Jianxun glanced around and lowered his voice. \"Chief Lin is in Xi'an—Chairman Liu just passed away, and Xi'an immediately called for an emergency meeting of the Central Committee. I wasn’t invited—it must have been Secretary Deng’s decision. But I heard from Comrade Wanli that Bo Yibo, Liu Lantao, and the others were all summoned.\"\n\nAs the two exchanged information, the door suddenly opened—Xi Zhongxun walked straight in.\n\n\"There's no time for pleasantries during such extraordinary times.\" Without greeting them, Xi Zhongxun closed the door and leaned in between the two. \"Last Monday morning, the Central Security Regiment confined Bo Yibo, Liu Lantao, and the others to their residences in Xi'an, forbidding them from leaving. Xiao Jinguang led the operation, and even Secretary Deng was stopped. They said no one could see them without a direct order from Chief Lin.\"\n\nCold sweat immediately soaked the backs of Ji and Liu, their instincts honed by years of political work signaling that something ominous was afoot—perhaps a major upheaval was brewing in the Central Committee.\n\n\"Before he passed, the Chairman entrusted me with a message: you two are to wrap up your local work and return to the Central Committee to prepare for the Tenth National Congress. I don't know what the Chairman had in mind, but for now, no one will touch the people he personally named. As for what Chief Lin is planning, we have no idea. Secretary Deng told me to take it step by step and ensure stability within the Party before anything else.\"\n\nJi Dengkui finally realized that, unbeknownst to them, the Party's ship had already reached turbulent and dangerous waters. \"But what about the work we did in Nanjing? I gave them guarantees…\" He was unwilling to see his efforts in Nanjing go to waste. \n\n\"It's all for nothing now. You can see the situation—this isn’t the time to discuss such matters,\" Xi Zhongxun said firmly, leaving no room for debate.\n\n\"Tomorrow morning, after breakfast, you two are to report directly to Secretary Deng and Comrade Jiang Qing for further instructions. I'll join you then.\"\n\nWith that, Xi Zhongxun quickly got up to leave, only to be stopped by Liu Jianxun. The three clasped hands tightly, the weight of the moment unspoken but palpable."
 CPC_Lin_Coup.1.o: "\"Thank you, Comrade Zhongxun.\""
 CPC_Lin_Coup.2.t: "Seal"
 CPC_Lin_Coup.2.d: "Lin Biao's desk also placed an official seal seized from Bo Yibo's home, engraved with a spike ring, in which a seal script \"government\" is particularly conspicuous - now this seal is in his own hands, which means, he has the power to command the Central People's Government.\n\nHe played with this official seal, and his mind immediately appeared in the figure of those deceased: Mao Zedong, Zhou Enlai, Chen Yi, Kang Sheng...and then Peng Zhen, Ren Bishi, Zuoquan...and then again, his mind stopped at forty years ago when he penned the New Year's greeting letter to Mao Zedong, and then he wrote to Mao Zedong. When he wrote that New Year's greeting letter to Mao Zedong forty years ago.\n\nAt least for someone like Mao Zedong, who had experienced great storms, he was too naive at that time, so naive that even Mao Zedong could not bear to criticize himself too much, but wrote an earnest letter in reply. Over the years, he often recalls his question, which is etched in the history of the Party: How long can the Red Flag last?\n\nMao Zedong's reply was fulfilled, and the Red Flag has reached the present day - even if those who carried the flag, in the beginning, have all closed their eyes, the Communist Party of China has still succeeded in taking over 12 million square kilometers of China today.\n\nHowever, is it still a red flag - Lin Biao in the past did not pay much attention to political affairs, he was only upset with the group of bad bureaucrats who repeatedly undermined the system to invite themselves to come out to force the administration, and immediately after the Ninth National Congress, they wanted to kick them out of the way. He understood that that was not what the Communist Party should do, so at this moment of national liberation, he stepped in to snatch the red flag into his own hands - but the bigger question was already in front of him, what was he going to do to keep the red flag standing? If the red flag is not to fall, the politics must be reliable...But behind the chairman of these people who can willingly listen to their command? Besides their people who else is reliable?\n\n\"...How do I know...\" He dropped the official seal on the table and pondered for a long time, and that irritatingly shrewd dwarf broke into his mind again - -\n\nHe seemed to make up his mind and picked up the phone, \"Get me the Secretary's office...\""
 CPC_Lin_Coup.2.o: "\"...Let Deng Xiaoping come.\""
 CPC_Lin_Coup.3.t: "Soldier and Secretary"
 CPC_Lin_Coup.3.d: "\"I want to be the Chairman of the Central Committee at the 10th National Congress.\" Lin Biao's office only had one seat – reserved exclusively for him – while Deng Xiaoping, standing before him, could only respectfully stand behind the desk. \"I know that if I do this, some people will inevitably scold me as an eternal thief.\"\n\nDeng Xiaoping leaned forward tentatively and said, \"It's not impossible. The Chairman himself said before his death that after the founding of the nation, we should hold the 10th National Congress as soon as possible to rectify the Party organizations across the country and establish a new central work line.\" He then changed his tone, \"But at least we should first draft a national constitution and organize the political structure of the new China before we can hold the Congress...\"\n\n\"A long night brings about many dreams. The issue of revisionists must be dealt with as soon as possible at the Tenth National Congress. Their roots and branches in the localities must also be eradicated together.\" Lin Biao rubbed his temples. \"Too many bad people have emerged within the Party in the past, headed by Bo Yibo, Liu Lantao, Lin Feng, Zhou Yang, and that dead man, Liu Shaoqi. They didn't follow Chairman Mao's revolutionary line and wanted to take the revisionist route. You've been in the government for the past few years, and you've seen it yourself. These people have been obstructing the Chairman's decisions and actions.\"\n\nDeng Xiaoping remained silent.\n\n\"The documents for the Tenth National Congress need to be reviewed by the Secretariat. I've called you here, General Secretary of the Secretariat, to sign them.\"\n\n\"Aren't we going to hold a Politburo meeting?\" Deng Xiaoping's palms were sweating.\n\n\"There are many bad people in the Party. Extraordinary times call for extraordinary measures. Please understand, Comrade Deng Xiaoping.\" The moment the words left his lips, Deng Xiaoping heard the sound of the guards at the door cocking their rifles - this bald old man dared to make such a ruthless move?"
 CPC_Lin_Coup.3.o: "\"It's all for the revolution. Please understand.\" \nLin Biao repeated."
 CPC_Lin_Coups_tt: "§LComrade Lin Biao§!has now been honored as §RChairman of the Central Committee of CPC, Chairman of the Central Military Commission (CMC), and President of the [CPC.GetName],§! and §Rthose in power within the Party who have taken the path of capitalism have been swiftly brought under control§! and §xwill be duly judged.§!"
 CPC_Lin_Coup.4.t: "Two Announcements"
 CPC_Lin_Coup.4.d: "Left Side:\nResolutely overthrow the capitalist roaders in the Party, namely, Bo Yibo, Liu Lantao, Lin Feng, and Zhou Yang!\nResolutely eliminate the agents of traitors in provincial Party committees across the country, including Han Guang, Ren Baige, Yu Guangyuan, Hu Jiwei, Gong Yuzhi, Bai Dongcai, Ren Zhongyi, Zhao Mingxin, and Li Liguo!\nResolutely eliminate the agents of traitors within the People's Liberation Army, namely, Xiao Hua and Zhang Aiping!\nResolutely eliminate the bourgeois enemies within the People's Government, including Liang Shuming, Wu Jingchao, Xie Wanying, and Xu Langguang!\nPeople of the whole country, unite and overthrow the capitalist roaders! Safeguard the security of Chairman Mao's funeral! Stand the last guard for the Chairman!\nPeople of the whole country, mobilize and unite around the Party Central Committee with Chairman Lin Biao as its core, and defend the fruits of the revolution!\nPeople of the whole country, arm yourselves, defend the eternal red land, defend the national territorial sovereignty, and overthrow Japanese imperialism!\n\nRight Side:\nThe Hanzhong Party Committee, together with the garrison troops, recently cracked a major counter-revolutionary group case. Investigation revealed that a bourgeois counter-revolutionary doctors' group, headed by Xu Lin, the former vice president of Hanzhong People's Hospital, was spreading bourgeois counter-revolutionary ideology and slandering the revolutionary line and propositions of Chairman Mao and Chairman Lin in their work. The criminal Xu Lin and his 77 accomplices have confessed to their crimes and have been handed over to the Hanzhong Revolutionary Tribunal for prosecution.\nSince Chairman Lin Biao proposed to launch a struggle to defend the fruits of the revolution throughout the Party, the army, and the country, officers and soldiers of the People's Liberation Army at all levels have actively responded and established Revolutionary Committees in various regions across the country. According to Comrade Xu Shiyou, Director of the Nanjing Revolutionary Committee, the revolutionary situation in Nanjing has been excellent since the liberation of the whole country. He pointed out: \"There are definitely counter-revolutionaries in Nanjing, not only are there, but there are nests and strings of them.\" More than 3,500 counter-revolutionaries were ferreted out just from the former \"National Central University\" of the puppet regime, successfully eradicating the hidden anti-Party and anti-socialist malignant tumor in Nanjing.\nThe situation across the country is excellent, and the revolutionary process is advancing rapidly. The people of the whole country unite and, under the guidance of the wise leader Chairman Lin, will surely stride forward towards a bright socialist future!"
 CPC_Lin_Coup.4.o: "The names of traitors and enemies were\nwritten upside down and crossed out."
 CPC_Lin_Coup.5.t: "The Announcement"
 CPC_Lin_Coup.5.d: "To cope with the large-scale construction and restoration work that will soon begin after the liberation of the whole country, the work, and institutions of the Central People's Government should be redistributed and reorganized, and the whole Party, the whole army and the whole people of all nationalities should follow unswervingly the revolutionary path of Marxism-Leninism-Mao Tse-tung Thought, and resolutely support the great deployment of the wise leader, President Lin, to establish a united central government of the new China under the socialist system; at the same time, it is proposed to establish all levels of people's governments and military institutions in the newly liberated areas. Liberated Areas to establish people's governments and military organizations at all levels.\n\nThe following decisions are hereby made:\n\nFirst, because in the history of the Party and the country the former \"Central People's Government Affairs Committee\" has not been able to carry out its duties properly and has been held by a small group of those in power who have followed the capitalist road, thus jeopardizing the socialist road of the Party and the country, it is hereby declared that it will be abolished, and that the composition of the Central People's Government will be announced at another date.\nSecond, the establishment of regional people's governments in the newly liberated areas, which are directly under the jurisdiction of the Central People's Government, and which represent the Central People's Government in the leadership and supervision of the local governments in the respective areas.\nThird, to establish major military districts in the newly liberated areas, parallel to the regional people's governments, subject to the orders of the Central Military Commission and directly mobilized by the Central Government.\n\nThe above orders will be carried out after the liberation of the whole country."
 CPC_Lin_Coup.5.o: "There is no Government of the People, but empty talks and lip services."
