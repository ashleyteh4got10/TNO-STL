 CPC_not_to_be_made_a_precedent_tt: "In response to the Central Committee's call, senior military commanders who are too old will be §Yretired§! and new §Ycommanders§! will be welcomed into our chain of command.\nIn compliance with Comrade §mLin Biao§!'s instructions, all personnel scheduled for the list will §Ybe retired§!."
 CPC_back_door_deal_tt: "In response to the Central Committee's call, senior military commanders who are too old will be §Yretired§! and new §Ycommanders§! will be welcomed into our chain of command.\nAccording to Comrade §GBo Yibo's§! opinion, some veteran generals will be retained in the chain of command to complete the §Ysmooth handover§!."
 CPC_TRCW_phase_2_left_1_tt: "§YMilitary Reforms§! gains\nRecovery Rate §G+5%§!"
 CPC_TRCW_phase_2_left_2_tt: "§YMilitary Reforms§! gains:\nArmy Organization §G+5%§!"
 CPC_fragile_silicon_dream: "The Fragile Silicon"
 CPC_fragile_silicon_dream_desc: "Canton, the ugly colony, the so-called \"Co-Prosperity Sphere Subsidiary Enterprise State\", has finally been hit by a storm it has not seen since its birth - the War of Liberation in East Asia.\nOur attitude was clear: the pseudo-government of Guangdong had only one way out - unconditional surrender."
 CPC_press_the_button: "Press the button"
 CPC_press_the_button_desc: "We have already instigated the South China Bureau to launch a workers' insurrection in Guangdong that has almost paralysed its administration, and from the intelligence coming back from the South China Bureau, it seems that the pseudo-Guangdong government is tired of maintaining law and order and suppressing the workers' insurrection - of course, we don't mind adding a little more fuel to this revolutionary blaze."
 CPC_go_fuck_GNG: "Get straight to the point"
 CPC_go_fuck_GNG_desc: "According to the intelligence and advice coming back from the South China Bureau, it is best not to harbour any illusions about the current government hierarchy in Guangdong, and one must be prepared for the rupture of the vision of the peaceful liberation of Guangdong. The South China Bureau will continue to monitor the movements of the pseudo-Guangdong government through its intelligence network, and once the situation changes, the People's Liberation Army (PLA) must enter the country and fight to take control of Guangdong, Hong Kong and Macao at once."
 CPC_go_fuck_GNG_tt: "£CPC_texticon §GThe South China Bureau§! will play a rear-enemy role by temporarily disrupting enemy communications with the £GNG_japanese_frustration_texticon §jJapanese Army§!, and with the exception of §YCanton, Hong Kong and Macau§! The rest of the area will be turned into a §Rdemilitarised area§!\n\nBut the enemy will soon find out about our sabotage and summon the £GNG_japanese_frustration_texticon §jJapanese Army§! to land, and once that happens we will be facing up to an opponent far more difficult than the §RCanton Police Force.§!"
 CPC_talk_with_GNG: "Couple strength and gentleness"
 CPC_talk_with_GNG_desc: "Based on the intelligence and advice coming back from the South China Bureau, we found that there was not much willingness to resist among the top echelons of the Guangdong government - rather than burning Guangdong to the ground in order to follow Japan, they seemed to prefer protecting the integrity and peace of Guangdong - whether out of compassion or simply This tendency coincides with our vision of a peaceful liberation of Canton.\nBut we should still be prepared for both peace talks and unification by force, and the pressuring army will be able to put psychological pressure on them as well."
 CPC_talk_with_GNG_tt: "£CPC_texticon §GThe CPC South China Bureau§! shall push through SpecOps, temporarily sabotaging Guangdong's communication with £GNG_japanese_frustration_texticon §jJapan§! and dispatching covert personnel as negotiators to mediate with §YHis Excellency Chief Executive and his advisors§!. All states except for §YGuangzhou, Macao and HK§! falls into §RDemilitarisation Status§!.\n\n£GNG_japanese_frustration_texticon §jGuangdong Garrisons of the IJA§! are trying their best to restore communication with the Japanese homeland. Should they succeed in summoning £GNG_japanese_frustration_texticon §jIJA Reinforcements§!, All efforts for peaceful liberation would be lost, facing an enemy §Rfar tougher than Guangdong Police Units§!."
 CPC_SONY_our_dream: "Our Dreams"
 CPC_SONY_our_dream_desc: "From the information provided by the South China Bureau, the economic and political power in Guangdong is now in the hands of Morita Akio's Sony and Li Ka-shing's Cheung Kong. Unlike other plutocrats who only know how to oppress the workers in Guangdong, Sony and Cheung Kong seem to have a more \"humane\" way of governing the local area of Guangdong, and they are the ones who can be approached for peace talks...Of course, there will be no change in our demands, and there is only one way for the pseudo-government in Guangdong: unconditional surrender."
 CPC_Matsushita_folly_to_be_wise: "Folly to Be Wise"
 CPC_Matsushita_folly_to_be_wise_desc: "According to the information provided by the South China Bureau, the economic and political power in Guangdong is now in the hands of Matsushita Masaharu's Matsushita, an electrical appliance company which demonstrates the nature of the most classic capitalist business company: selfishness and profit-seeking.\nHowever, this selfishness is not a bad thing, at least this kind of business company will not be willing to raise the flag of war and go into the fire for the sake of Japan's so-called \"Great East Asian Jihad\", therefore, Matsushita can be the object of our contact and negotiation - of course, there will not be any change in our demands. There is only one way for the Guangdong False Government: unconditional surrender."
 CPC_Fujitsu_world_of_glass: "World Of Crystals"
 CPC_Fujitsu_world_of_glass_desc: "From the information provided by the South China Bureau, the economic and political power of Guangdong is now in the hands of Ibuka Masaru's Fujitsu. Ibuka Masaru is not a mere capitalist, but he is also attempting to transform Guangdong with Silicon Chip and Social Darwinism, and he is tough and stubborn.\nWe can send representatives to contact Ibuka Masaru, but we may scare him, so we must be prepared to liberate Guangdong by force."
 CPC_Hitachi_forest_of_steel: "Forest of Steel"
 CPC_Hitachi_forest_of_steel_desc: "From the information provided by the South China Bureau, it appears that the economic and political power in Hitachi is now in the hands of Komai Kenichiro. Komai has committed countless crimes against Hitachi, has turned Hitachi into a sweaty hell comparable to Manchuria, and has been in close contact with the fascist militarists of the Japanese army, so we must give up our illusions of peaceful liberation of Hitachi, and make haste in our war preparations to liberate Hitachi as soon as possible."
 CPC_make_a_fuss_in_LegCo: "Havoc in the LegCo"
 CPC_make_a_fuss_in_LegCo_desc: "As agreed, the Chief Executive has already submitted to the Legislative Council our instrument of disbanding the Canton Police Force and demanding the unconditional surrender of Guangdong, and it is foreseeable that this demand will stir up the Legislative Council - but this has nothing to do with us; this demand is not some ordinance or bill to be scrutinised in respect of Guangdong, but rather a notification of our liberation of Guangdong."
 CPC_turn_hostility_into_friendship: "Swords to Plowshares"
 CPC_turn_hostility_into_friendship_desc: "South China Bureau has assisted the Guangdong government in accordance with the agreement to disband all its military and police forces, but this move has completely angered the Japanese Army in Guangdong, the Military Commission instructed that the fastest possible takeover of Guangdong, to do a good job of coastal defence to prevent the landing of Japanese reinforcements and to focus on the superiority of forces to completely wipe out the Japanese Empire in Guangdong \"Phoenix\" mechanized divisions."
 CPC_life_is_not_satisfactory: "Life is not as it should be"
 CPC_life_is_not_satisfactory_desc: "The panic of a large army pressing on the border has spread to all of Guangdong, and intelligence from the South China Bureau shows that major plutocrats have been transferring their assets to Japan or to other countries in the Co-Prosperity Sphere, and that the Japanese Army in Guangdong has been authorised by Tokyo to begin directing its troops to build fortifications on the front line - we must organise our troops to prepare for the liberation of Guangdong as soon as possible to avoid causing more casualties and economic losses."
 CPC_good_bye_silicon_dream: "Meet again at unspecified date"
 CPC_good_bye_silicon_dream_desc: "All soldiers of the People's Liberation Army, the battle for the liberation of Guangdong is about to begin. The capitalists and plutocrats have been hammering away at the people of Guangdong for 20 years, and the people of Guangdong yearn for liberation and freedom! We must march on Guangzhou, Hong Kong and Macau as a civilised and mighty division! We must destroy the remaining Japanese imperialists in Guangdong!"
 CPC_TRCW_phase_1: "National Defence Mobilization"
 CPC_TRCW_phase_1_desc: "Finally, the campaign for the liberation of Shanxi has leaded to a violent reaction from the KMT reactionaries, and now the Third Domestic Revolutionary War has in fact broken out in full force. Now we must immediately mobilise the entire National Defence Front and indeed the entire ANRL people to fight the Japanese imperialists together!"
 CPC_TRCW_phase_1_1: "Military Institution Reorganization"
 CPC_TRCW_phase_1_1_desc: "In order to cope with the needs of an all-out war, the Military Commission will immediately reorganise and set up a southward front-enemy committee with Comrade Lin Biao as secretary, and a northward front-enemy committee with Comrade Xu Xiangqian as secretary, to take overall charge of matters concerning the north and south of the war. At the same time, Deng Xiaoping, Bo Yibo, Xi Zhongxun, Wang Renzhong, Ren Zhongyi, Li Xiannian, Luo Qingchang and other comrades will form the Central Committee of the Front Enemy, with Deng Xiaoping as secretary, to co-ordinate the command of operations on all fronts."
 CPC_TRCW_phase_1_left: "Economic Control Ordinance"
 CPC_TRCW_phase_1_left_desc: "War had broken out, and the base had to change its economic system as soon as possible to suit the needs of the war."
 CPC_TRCW_phase_1_left_1: "Supporting the War"
 CPC_TRCW_phase_1_left_1_desc: "The gap in demand for front-line military supplies is huge, and the factories in the base area must be ordered as soon as possible to change the production of uniforms, bullets, firearms, and other front-line materials in short supply, at the temporary expense of the demand for consumption in the rear."
 CPC_TRCW_phase_1_left_2: "No More Starvation"
 CPC_TRCW_phase_1_left_2_desc: "No matter how hard it is, do not make the people of the base area a sacrifice. The lesson of the famine that struck the base area ten years ago is still fresh in our minds, and we should not and can not repeat it."
 CPC_TRCW_phase_1_medium: "Emergency Conscription Ordinance"
 CPC_TRCW_phase_1_medium_desc: "With the fierce fighting on the front line, many troops have begun to suffer from combat attrition and weakened combat power, and it is imperative that relevant conscription regulations be formulated immediately to ensure an adequate supply of reserve troops, so as not to slow down the liberation process."
 CPC_TRCW_phase_1_medium_1: "Fill the Draft List"
 CPC_TRCW_phase_1_medium_1_desc: "Our reserve manpower is far inferior to that of the Pseudo-Republican government in the east, but we have a huge first-mover advantage in mobilising the rear, and we must make good use of this time lag to complete the established task of expanding the conscription more quickly and efficiently, and to liberate the densely populated areas of central and southern China before the Pseudo-Republican expansion of armaments is completed."
 CPC_TRCW_phase_1_medium_2: "Deferred Conscription"
 CPC_TRCW_phase_1_medium_2_desc: "We are a revolutionary regime that already has a population of 100 million, with sufficient reserve manpower, so there is no need to over-emphasise the difficulties of conscription, and the policy of maintaining a moratorium on student recruitment will remain unchanged, as school students are the fresh blood that will enable us to continue the work of revolutionary construction in the future, and should not be forcibly expanded until it is absolutely necessary to do so."
 CPC_TRCW_phase_1_right: "Asian Collective Defence Agreement"
 CPC_TRCW_phase_1_right_desc: "The ANRL \"Hanoi Declaration\" stipulates in the form of a charter that in the event of an armed attack in Asia by any State or group of States against a Contracting State, all Contracting States shall exercise the right of self-defence, either individually or collectively, and shall lend full support to the attacked State in all reasonable forms available to it, including the dispatch of armed forces. We can now call upon the other member States of the ANRL, through the collective defence mechanism of the ANRL, to provide support for our war effort."
 CPC_bookmarks_fake_1: "Asian Collective Defence Agreement"
 CPC_bookmarks_fake_1_desc: "The ANRL \"Hanoi Declaration\" stipulates in the form of a charter that in the event of an armed attack in Asia by any State or group of States against a Contracting State, all Contracting States shall exercise the right of self-defence, either individually or collectively, and shall lend full support to the attacked State in all reasonable forms available to it, including the dispatch of armed forces. We can now call upon the other member States of the ANRL, through the collective defence mechanism of the ANRL, to provide support for our war effort."
 CPC_TRCW_phase_1_right_1: "China First"
 CPC_TRCW_phase_1_right_1_desc: "After decades of construction since the end of the Second World War, we have become the largest socialist country in the world, and today China is undoubtedly the heart of international communism. It is the honourable duty of the ANRL to defend this heart of international communism and, if necessary, to assist China by all means from the imperialist countries.\n\nThe task of the ANRL in the future is to \"organise the struggle of all countries against Japan and support China\" to safeguard the hard-won hope of communism."
 CPC_TRCW_phase_1_right_2: "Common Destiny"
 CPC_TRCW_phase_1_right_2_desc: "\"Armed Defence of the USSR\" was the main slogan of the international communist movement in the 1930s and 1940s. This old-fashioned style of communist party has brought serious obstacles to the communist parties of various countries, and our party has suffered a great deal from it, but nowadays we can't impose this style on others, and only by treating all the countries of the ANRL as equals, and by jointly carrying out the war against Japan and fascism, can the goal of the revolution be achieved to the fullest extent. Only by treating the ANRL countries equally and jointly fighting the war against Japan and fascism can we maximise the goals of the revolution.\n\nThe ANRL will \"organise the defence of its member countries against Japan\" and unite to defeat imperialism."
 CPC_TRCW_phase_2: "Tough Time"
 CPC_TRCW_phase_2_desc: "As the war situation between the enemy and us gradually enters a white-hot stage, many problems are beginning to be exposed at the front and the rear: the chain of command is not smooth, prisoners of war are difficult to manage, the pressure on medical care is excessive, etc., and the toughest time of this war has come\nChairman Mao teaches us: Make up your mind, fear no sacrifice, and overcome all difficulties to fight for victory. We should go through this difficult time of war with the belief that we will win."
 CPC_TRCW_phase_2_left: "War Affairs Management Programme"
 CPC_TRCW_phase_2_left_desc: "As the battle front deepens, the front line has been separated from the central command by a considerable geographical distance, and the problem of miscommunication in the chain of command is becoming more and more serious, we have to make an immediate choice - should we delegate the authority to our comrades in the front line commanders to command on their own, or should we invest more resources in reinforcing the channel through which the central government communicates its orders?"
 CPC_TRCW_phase_2_left_1: "Audit of the DefMin"
 CPC_TRCW_phase_2_left_1_desc: "Regime comes from the barrel of the gun, and the barrel of the gun should always listen to the Government, which is related to the Party's ruling position, the nature and purpose of our army, and the combat effectiveness of the troops. Therefore, we must stand on the strategic level of the overall situation and realise that only by comprehensively strengthening the supervision of the frontline operations by the Ministry of Defence can we ensure victory in the war of liberation."
 CPC_TRCW_phase_2_left_2: "Allowing Front-Enemy Committee"
 CPC_TRCW_phase_2_left_2_desc: "When the general is out, the king's orders may not to be taken. In order to improve decision-making and operational efficiency, ensure the rational allocation and use of combat resources and adapt to the changing battlefield environment, we should strengthen the autonomous decision-making power of the Military Commission's front-line battlefield affairs, improve operational efficiency, and exchange the successful completion of each combat mission for ultimate victory."
 CPC_TRCW_phase_2_medium: "POW Regulation Ordinance"
 CPC_TRCW_phase_2_medium_desc: "As wars escalate and the number and complexity of prisoners of war increase, their management and resettlement become an important task. Not only do we need to treat them humanely, but we also need to decide whether they will stay or go in this war. Therefore, we must draw up relevant regulations as soon as possible and take effective measures to manage and resettle prisoners of war."
 CPC_TRCW_phase_2_medium_1: "Send Them to Rear"
 CPC_TRCW_phase_2_medium_1_desc: "In order to alleviate the shortage of labour resulting from the heavy reconstruction work in the rear, and at the same time to avoid the problem of mutiny that may be brought about by the integration of prisoners of war, the Central People's Government and the Central Military Commission, in view of the current war situation, issue this Regulation. With immediate effect, all prisoners of war shall be sent to the rear to engage in industrial production and undergo labour reform, and out of humanitarian principles, the local government shall supply them with the necessities of life, so as to contribute to a solid rear for victory at the front."
 CPC_TRCW_phase_2_medium_2: "Integrate Immediately"
 CPC_TRCW_phase_2_medium_2_desc: "In order to supplement the sacrifices of experienced soldiers at the front and to relieve the pressure on the supply of supplies at the rear, the Central People's Government and the Central Military Commission, in view of the current war situation, issue these Regulations. With immediate effect, all prisoners of war shall, in the light of their actual situation and in accordance with the principle of voluntariness, choose either to accept their supply and return to their home towns, or to accept integration and engage in combat on the spot, so as to contribute to the cause of national liberation."
 CPC_TRCW_phase_2_right: "Medical Work Programme"
 CPC_TRCW_phase_2_right_desc: "Healthcare has become indispensable on the battlefield since the great profession of the war doctor was pioneered by the angel of the lamp, a hundred years ago, and the various conflicts we have experienced are no exception.\n\nWith the war of liberation now underway, a large-scale war that also rare involves of biological and chemical weapons use of enemies, the rear medical staff have taken on far more tasks than in the local conflicts we have been involved in in the past. Tens of thousands of wounded and local victims of biochemical warfare are now being transported to the major hospitals in the Great Northwest almost every day, and almost everyone has become a Nightingale.\n\nThe problem is that the number of our medical staff is limited, so much so that a large number of nurses are showing up with a lot of wounded working overtime. In the midst of this day-and-night rescue work, there were already some complaints that reached the ears of the hospital party committee, while the enemy's stockpile of chemical and biological weapons still hadn't seen much of a reduction."
 CPC_TRCW_phase_2_right_1: "Ultimate Working"
 CPC_TRCW_phase_2_right_1_desc: "Treating the sick and saving lives was the duty of a healer, and the Front's current urgent task was to protect the various regions from the effects of the enemy's large-scale biochemical warfare, which would inevitably increase the workload of the medical team by a large amount, but there was no better solution than this.\n\nAmong the past cases of biochemical warfare, the most famous was the Italian invasion of Ethiopia, where the Italian invaders' poison gas killed more than half a million Ethiopians. One of the reasons for such a massive wave of infection was the lack of medical care. If this incident were to spread on a large scale in the Northwest, the results would be catastrophic.\n\nNow the medical staff will have to maintain a state of round-the-clock readiness, working overtime today in exchange for the lives and properties of hundreds of millions of compatriots in the Northwest, and the responsibility of defending the rear of the front line rests on their shoulders. Despite a little bitterness and fatigue, the Front must never become a second Ethiopia."
 CPC_TRCW_phase_2_right_2: "Simplified Therapy"
 CPC_TRCW_phase_2_right_2_desc: "Doctors are human beings, and all human beings need to rest or else something will go wrong. Since the beginning of the war, there have been many casualties in the overworked medical front, which is unacceptable. Every time a nurse is reduced, the responsibility will be handed over to another nurse, and this will only result in more attrition, and continuing the overdraft will only lead to a vicious circle.\n\nTo avoid this vicious result, the Front will shorten and simplify some of the extermination procedures. Minor contaminated areas will be provided with more bleach and buried, while other contaminated areas will be treated, depending on the situation, with infected personnel. While this treatment will reduce the intensity of decontamination, it is also a strategy to ensure a stable medical burden."
 CPC_TRCW_phase_3: "For Final Decisive Victory"
 CPC_TRCW_phase_3_desc: "With the forces of the KMT reactionaries purged, the Third Domestic Revolutionary War has achieved a stage-by-stage victory. However, with the rising sun in the east eyeing us and a new phase of China's war of national liberation on the horizon, the people of the country should strengthen their unity and fight for the final victory."
 CPC_TRCW_phase_3_left: "New Government Organization Programme"
 CPC_TRCW_phase_3_left_desc: "With the gloom of war about to lift and the dawn of liberation approaching, the organisation of a new form of government has become an urgent necessity as the historic task of striving for national independence and the liberation of the people is accomplished, which will be of vital significance for the restoration of the country and its future development."
 CPC_TRCW_phase_3_left_1: "Democratic Consultation"
 CPC_TRCW_phase_3_left_1_desc: "Surrounded by powerful enemies on the outside and in ruins on the inside, at this time of crisis and desperation, we will, on behalf of the fundamental interests of the people of all national races, put forward the policy of peace, democracy and unity, actively strive for the realisation of peace and democracy in the country, organise a united front of people's democracy in the broadest sense of the word, unite the oppressed classes, people's organisations, democratic parties, ethnic minorities, overseas Chinese in all parts of the country and other patriotic elements, and prepare for the convening of a new Chinese People's Political Consultative Conference to Establishment of a new China."
 CPC_TRCW_phase_3_left_2: "Systematic Dictatorship"
 CPC_TRCW_phase_3_left_2_desc: "Without the Communist Party, there would be no new China. It was under the leadership of the Party that the Chinese people were liberated from the tyranny of the Japanese invaders and the KMT reactionaries. As the backbone of China's revolution, the Party has the right and the duty to pick up the mainstay of the construction of a new China, to decide on the future form of government, and to carry the socialist revolution through to the end."
 CPC_TRCW_phase_3_medium: "Rear Reconstruction Notifications"
 CPC_TRCW_phase_3_medium_desc: "As the war front continues to advance, the reconstruction and rehabilitation of the home front has been put on the agenda. In order to restore order in the rear as soon as possible, improve the quality of life of the people and ensure the fruits of victory, each locality should gradually resume infrastructure reconstruction and resettlement of people in accordance with the local conditions, and should fulfil their responsibilities effectively in order to promote the progress of the work together."
 CPC_TRCW_phase_3_medium_1: "Confiscation of Property of Enemies and Traitors"
 CPC_TRCW_phase_3_medium_1_desc: "The Communist Party of China and its armed forces have the mission of fighting hostile forces and punishing traitors. As one of the ways of punishing traitors, the disposal of the assets of the enemy and the hypocrites is not only significant for punishing evil and maintaining national integrity, but also for building up prestige, mobilising the masses and combating the enemy. All localities should confiscate the assets of the enemy and the hypocrites in accordance with the laws and methods of disposal, so as to cut off their economic basis for resurgence, provide strong support for the victory in the war of resistance, and lay the foundation for opening up the situation in the post-war period."
 CPC_TRCW_phase_3_right: "Discussion on Sino-Japan Relations"
 CPC_TRCW_phase_3_right_desc: "With the invaders fleeing from the land of China, the ancient country is on the verge of her liberation and rebirth. What kind of attitude should we adopt towards the former invaders? The blood feuds of the past and the institutional differences of today seem to have built a moat between the two countries; however, the neighbourly ties and the class narratives of beliefs call for the normalisation of diplomatic relations and humane measures. The choice seems difficult to decide..."
 CPC_TRCW_phase_3_right_1: "Refugee Identification"
 CPC_TRCW_phase_3_right_1_desc: "Comrades! We have no time to dwell on whose fathers killed whose sons, whose sons killed whose husbands; this is just a nationalist trap of hatred that prevents us, the class brothers, the proletariat, oppressed by the bourgeoisie and imperialism as they are, from uniting to give them the final blow.\n\nThe first step towards the fulfilment of our great ideals, towards the unity of the peoples of the world, is to let go of hatred, which may be difficult for some to accept, but the Commissars are always ready to give them the correct class perspective answer.\n\nThe ultimate programme for Japanese refugees is to be screened for identity and to decide voluntarily whether to repatriate peacefully or to remain in the land as Chinese citizens."
 CPC_TRCW_phase_3_right_2: "Don't Forgive Anyone"
 CPC_TRCW_phase_3_right_2_desc: "It is difficult to stop the hatred for a while, at least we don't have to repeat the tragedy of the city, after all, after all the identities, we are still class brothers, some deceived and oppressed.\n\nNo. We can't ignore the blood feuds, at least not of the people who were slaughtered, not of the soldiers who spilled their brains and blood on the battlefields. The compromise is to deport them all; that's the best we can do for them, despite the casualties of transport, flight, and lynching."
 CPC_TRCW_FINAL: "Proclamation of the New China"
 CPC_TRCW_FINAL_desc: "§YEternal Glory§! to the People's Heroes who laid down their lives in §Ythe People's War of Liberation and the People's Revolution§! over the past three years!\n\n§REternal Glory§! to the People's Heroes who laid down their lives in §Rthe People's War of Liberation and the People's Revolution§! over the past thirty years!\n\n§xEternal Glory§! to the People's Heroes who, since the 1840s, have given their lives during the many struggles to resist the enemy, domestic and foreign, §xto strive for the independence§! of the nation and the §xfreedom of the people§!!"
 CPC_dem_riot_gui: "Democratic Uprisings in the East China"
 CPC_dem_riot_gui_desc: "While we are §Gbiding our time with development§!, the suffering Chinese people in the East are not sitting still - since §Ythe Yasuda crisis§!, §Cdemocratic and patriotic movements§! against imperialism have broken out in §YGuangxi, Beiping§! and other places, and in spite of §xbrutal repression§!, sporadic protests are still §Ygoing on§! and have §Ggrown stronger§! in the wake of recent international and domestic unrest - the §Cdemocratic uprising movements in the East§!, represented by §YBeiping, Wuhan and Leizhou§!, are thriving, we have the responsibility and obligation to send §Ysupport§! to them."
 CPC_dem_riot_gui_tt: "-§RStrength§!\n---------------\nEach §Cinsurgent region§! has its own §Rstrength§!, which represents their ability to §Yresist repression by the pseudo-government§!, and its strength will §Rslowly decline§! over time, with the §Rpseudo-government§! launching §Rdirect repressive action§! if the strength of a region §Rfalls below§! §Y30%§!.\nWe will support the §Cdemocratic insurgents§! through a series of actions to maintain their §Rstrength§!.\n\nOnce §xall three regions have been suppressed§!, it is highly likely that the §Ydisillusioned people§! of the east will remain §Rindifferent§! to our §xliberation operations§!.\n\n-§GRadical§!\n---------------\nEach §Cinsurgent region§! has its own degree of §Gradical§!, representing the degree of radicalisation of their §Ydemocratic demands§!, and although we can §Gguarantee§! the §Rstrength§! of these regions through our §Yintelligence network§! in enemy-occupied areas, we will accordingly §Ycontribute§! to their degree of §Gradical§!; if the §Raverage degree of radical§! in the three regions is greater than §Y50%§!, they will independently convene the §mStatehood Conference of Republic of China§! in Shanghai, and will §Rno longer co-operate§! with our democratic proposal to convene the §GChinese People's Political Consultative Conference§! in Xi'an.\n\n--While for the §Rrevolutionary§! cause, §Yboth conferences§! would be §Gmilestones§! in the Chinese people's milestone victory , but for §xour Party§!, the §GCPPCC§! can be of greater help to our §Rwar cause§!."
 CHI_liberty_front: "Chinese Freedom Front"
 CPC_dem_riot_failure: "The Failed Movement of Democracy"
 CPC_dem_riot_failure_desc: "We failed to seize this opportunity, and because of our inaction, all the democratic and patriotic movements in the east fell under the iron hooves of the bandits of the pseudo-government.\n\nNow the people of the East have lost patience with us and are no longer willing to co-operate with our other actions - it is likely that our future liberation and transformation in the East will meet with heavy resistance."
 BJC_name: "Beiping"
 WHC_name: "Wuhan"
