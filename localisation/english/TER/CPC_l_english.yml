 CPC_red_star_in_rev_base_tt: "£CPC_idea_texticon_red_star_in_rev_base\n\n\n£CPC_texticon §RParty Congress§!\nParty Members Desired Ratio: [?CPC.TER_NCCPC_PTMB_num_pct|G2%]\nDaily Political Power Gain: [?CPC.CPC_NCCPC_political_power_gain|+2]\nStability: [?CPC.CPC_NCCPC_stability_factor|+=%]\nWar Support: [?CPC.CPC_NCCPC_war_support_factor|+=%]\nProduction Efficiency Retention: [?CPC.CPC_NCCPC_line_change_production_efficiency_factor|+=%]\nConstruction Speed: [?CPC.CPC_NCCPC_production_speed_buildings_factor|+=%]\nProduction Efficiency Cap: [?CPC.CPC_NCCPC_production_factory_max_efficiency_factor|+=%]\nProduction Efficiency Growth: [?CPC.CPC_NCCPC_production_factory_efficiency_gain_factor|+=%]\nGDP Growth: [?CPC.CPC_NCCPC_add_to_GDP_growth|+] [TER_GDP_present_from_NCCPC]\n\n£CPC_texticon §RNorthwest Bureau of the CCCPC§! [CPC_red_star_in_rev_base_NWB]\n\n£CPC_texticon §RSouthwest Bureau§! [CPC_red_star_in_rev_base_SWB]\n\n£CPC_texticon §RXinjiang Bureau§! [CPC_red_star_in_rev_base_XJB]\n\n£CPC_texticon §RSouth China Bureau§! [CPC_red_star_in_rev_base_SCB]\n\n[CPC_red_star_in_rev_base_NEB]\n--------------\nThe above §Ymodifiers§! are all §Ytheoretical§!; to obtain the §Yreal values§!, multiply them by the §YParty Members Desired Ratio§!."
 CPC_red_star_in_rev_base_desc: "In this endless night, the \"Divine Land of Red Earth\" (China) is the only place that still harbors a red star. That red star is us - we and our Communist Party of China.\n\nWhen joining the Party, we pronounce our ambitions, our hopes that our own small light can shine out: we will go among the masses, spreading revolutionary sparks; we will mobilize the people, resisting the invaders' repression; we will organize the people and the masses, developing productive and constructive forces.\n\nWe wish to believe, we have always believed, we must believe: in this darkness without end, a red light will shine forth. When that time comes, the red hue of sunset will light each inch of land, and in the East we shall raise our red flags to greet the sun's warmth."
 CPC_red_star_in_rev_base_SWB_tt: "\nParty Members Desired Ratio: [?CPC.TER_SWB_PTMB_num_pct|G2%]\nAdditional £tt_prod_unit Production Units: [?CPC.SWB_PUs_num|+0]\nGDP Growth: [?CPC.SWB_gdp_growth_modifier|+] [TER_GDP_present_from_SWB]\nConsumer Goods Production Modifier: [?CPC.SWB_consumer_goods_production_factor|+=%]\nIndustrial Expertise Monthly Change: [?CPC.SWB_industrial_expertise_monthly_rate|+=2]\nIndustrial Equipment Monthly Change: [?CPC.SWB_industrial_equipment_monthly_rate|+=2]\nHealthcare Quality Monthly Change: [?CPC.SWB_healthcare_monthly_rate|+=2]\nResource Gain Efficiency: [?CPC.SWB_local_resources_factor|+=%2]"
