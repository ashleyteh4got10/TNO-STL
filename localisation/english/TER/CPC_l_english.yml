 CPC_presidium_of_the_NPC: "Presidium of the NPC"
 CPC_presidium_of_the_NPC_desc: "Those who are a bit older, when faced with the procedure for electing the Bureau of the National People's Congress for the first time, may recall the lyrics of the famous anti-war song \"Unity is Strength\" from 30 years ago: \"Fire at the fascists, let all undemocratic systems die.\"\n\nFor socialism, \"democracy\" is of great significance: the practice of socialist democracy is the essential requirement of a socialist society; democracy means that the people are in charge, and a socialist society should be one in which the people are in charge; therefore, democracy is fundamentally consistent with and inseparably linked to the essence of a socialist society.\n\nFor China, \"democracy\" is the ultimate goal that it has been pursuing for 60 years without stopping to bleed or die: from the Protectorate War in Yunnan and the Protector of the Law Movement in Guangdong to the famous \"Mr. De\" and \"Mr. Sai\" banners, it is the ultimate goal that China has been pursuing for more than 60 years. From the war to protect the country in Yunnan, the movement to protect the French in Guangdong, and the May Fourth Movement, which is famous for holding the banner of \"Mr. De\" and \"Mr. Sai\"; from the citizen's movement in Beijing and Wuhan, and the anti-persecution struggle in Leizhou, to the united front in Northwest China and the War of Liberation in East Asia, millions and millions of revolutionaries paved with their blood a rugged road to a bright future of the people's ownership. ......?\n\nWhen the 60-year people's revolution finally won a complete victory, the Chinese people, who had worked hand in hand with the Communist Party, were faced with the question: What is democracy? How to realize the people's right to be masters of their own house? They asked the earth but received no response. If we examine the history of the Chinese revolution in detail, it is not difficult to find a fact: the Chinese revolution has been profoundly bound up with the national salvation movement from the beginning to the end, and the Chinese people have proved the rarity of the dream of democracy, equality, independence and freedom with their blood and tears for sixty years, but they have rarely been given the opportunity to practice what democracy, equality, independence and freedom are--democracy and science are two sides of the same coin. Democracy and science are two sides of the same coin, and China's troubled past has become the biggest obstacle to the practice of people's democracy: if it is only based on passion without scientific design and research, the democratic system will be difficult to operate; if the people do not receive the training and inculcation of a normal political life, then the democratic system will become a mere decoration.\n\nBut the ambitious Chinese people will not sit idly by, they have already made up their minds to start a great experiment in people's democracy with the election of collective leaders by the National People's Congress, and the whole world is watching with bated breath this \"revitalization of the global communist movement\" comparable to the October Revolution - it will open the way to a new era of democracy and democracy. -Will it open the way to a bright future of proletarian democracy? Or will it repeat the mistakes of the Bolsheviks, who lost their party and their country to internal strife?\n\n--Only the will of the Chinese people is qualified to write the answer to this questionnaire."
