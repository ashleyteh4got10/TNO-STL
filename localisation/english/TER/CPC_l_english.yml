 CPC_Yang_Yingcai_stories.1.t: "The Road Home - Xi'an, [GetYear]"
 CPC_Yang_Yingcai_stories.1.d: "This was probably the closest Yang Yingcai had ever been to Premier Zhou - perhaps the only time.\n\nUnder the bleak white light, a large group of middle-aged and elderly men in Zhongshan suits and military uniforms were following behind her, pushing Premier Zhou's hospital bed towards the emergency room at a frantic pace. She was about to wave away the people blocking the way ahead when she noticed that the handrail of the bed was already covered in sweat. The voice of the hospital director became distant: \"Director Yang, please check the Premier's pupils... Director Yang... Comrade Yang Yingcai!\"\n\nYang Yingcai suddenly snapped back to reality. She maintained her rapid pace, her right hand already reaching for Zhou Enlai's cheek—but then she heard a muffled thud behind her, as if someone had fallen. She froze for a moment, but had no time to worry about which poor soul had fallen. She quickly examined the elderly man with closed eyes before her, gently parting his eyelids.\n\n\"No obvious external injuries, pupils significantly dilated, the situation is very dangerous!\" Yang Yingcai could barely hear her own voice, she only felt her heart pounding - as if the sky was falling.\n\nIt was half an hour later when she came out of the emergency room. Seeing Yang Yingcai take off her mask, Deng Yingchao, Bo Yibo, and others who had been anxiously waiting immediately gathered around: \"Doctor, how is the situation?\"\n\n\"His condition has stabilized for now. The Premier's sudden illness should be a cerebrovascular problem. We have assembled all the experts from the emergency internal medicine department and are preparing for surgery immediately.\" Faced with so many important figures, Yang Yingcai's voice trembled involuntarily. After briefly answering a few questions, she hurriedly left.\n\nShe returned to her office, washed her hands, and glanced at the calendar hanging on the wall."
 CPC_Yang_Yingcai_stories.1.o: "\"Time... passes so quickly.\""
 CPC_Yang_Yingcai_stories.2.t: "The Road Home - Xi'an, [GetYear]"
 CPC_Yang_Yingcai_stories.2.d: "In the end, it was Yang Yingcai who took on the task of teaching Li Na, Chairman Mao's daughter, surgical knowledge and helping her prepare for the surgical assistant qualification exam. It wasn't because Yang's political background passed muster - quite the opposite. Of all the people at the PLA General Hospital, Yang Yingcai probably had the most questionable political history. The incriminating documents from her time in Xi'an No.1 Prison in 1958 still sat untouched in the archives of the 301 Hospital. Her position as Deputy Director of Surgery at the hospital was solely due to her heroic actions during the Ma Clique rebellion, where she had saved the lives of at least ten battalion and regiment-level cadres as the lead surgeon.\n\nPolitical pressure also weighed heavily on Li Na. An overly prestigious and prominent father could become a burden for his children. Apart from Yang Yingcai, almost no one in the entire hospital dared to truly fulfill Li Na's desire to learn while she nursed. As Li Na later put it, \"Those who were better surgeons than Dr. Yang were afraid of bearing the responsibility if I didn't learn well, and those who were braver than Dr. Yang weren't as skilled.\"\n\nYang Yingcai, however, didn't care much about her own problematic past. To be precise, after the turmoil of the Great Leap Forward, she had become indifferent, like a broken pot beyond repair. She had only one thing on her mind: to observe whether Li Na was qualified to begin learning surgery.\n\nFortunately, during a month-long trial period, Yang Yingcai finally determined that Li Na's nursing skills learned in school were solid. As a nurse, she was beyond reproach. However, as a surgical assistant, she was far from ready. Mechanically repeating nursing work without learning the theory wouldn't cut it. Yang finally made up her mind. After staying up all night creating a curriculum, she couldn't fight off the exhaustion any longer. Her head drooped, and she fell into a deep sleep at her desk."
 CPC_Yang_Yingcai_stories.2.o: "Just then, the door creaked open."
 CPC_Yang_Yingcai_stories.3.t: "The Road Home - Xi'an, [GetYear]"
 CPC_Yang_Yingcai_stories.3.d: "In the early days at the PLA General Hospital, Li Na harbored some discontent. Not only had her mother disregarded her father's objections and insisted on asking Uncle Zhou to write the recommendation letter, but she herself had no desire for a life constantly surrounded by people and attention. It was only when she saw the serene and composed demeanor of Dr. Yang, who was willing to teach her surgical knowledge and skills, that Li Na's heart settled down a bit.\n\nHowever, what followed was a month of neglect. Her life became a monotonous cycle between the canteen, the inpatient building, and the dormitory. She had asked Yang Yingcai several times when she could start learning, but Yang Yingcai only replied with a mysterious smile: \"Just wait a bit more days.\"\n\nOn another ordinary morning, Li Na arrived at Yang Yingcai's office as invited the day before, only to find Dr. Yang asleep at her desk. An uncapped fountain pen lay across the table, and a thick piece of cardboard was spread out beneath her slumped figure. \"Dr. Yang,\" Li Na gently nudged her shoulder.\n\nYang Yingcai slowly stirred, glancing up at Li Na. \"You're here early. I was up late last night working on your study plan.\"\n\nAt the words \"study plan,\" the gloom that had shrouded Li Na for the past month vanished instantly, replaced by a bright smile. \"Dr. Yang… I don't know how to thank you!\"\n\n\"Hey, don't thank me yet.\" Yang Yingcai handed the cardboard, now filled with a schedule of lessons and internships, to Li Na. \"When I was learning surgery, we didn't have any decent textbooks. I had to go straight from school to the battlefield to save lives. The only living textbook I had was…\" Her eyes dimmed. \"...the wounded soldiers of the expeditionary force.\"\n\nLi Na didn't know Dr. Yang's background, but she had heard of the Chinese Expeditionary Force in Burma from her father, her uncles, and the wartime newspapers of her childhood. Was she from Yunnan? She wondered.\n\n\"Take this schedule back with you first. I'll teach you the basics of surgery—how to identify and treat different types of wounds, how to suture more complex wounds, the commonly used surgical drugs and their pharmacology...\" Seeing Li Na's stunned expression, Yang Yingcai smiled faintly. \"If there's time, I'll tell you my story.\""
 CPC_Yang_Yingcai_stories.3.o: "\"Of course!\""
 CPC_Yang_Yingcai_stories.4.t: "The Road Home - Xi'an, [GetYear]"
 CPC_Yang_Yingcai_stories.4.d: "It was a rare moment of leisure. Li Na had already finished her rounds and daily prescription work early. There were no surgeries or emergency patients to attend to. She invited Yang Yingcai for a stroll in the green space below the hospital building.\n\n\"Dr. Yang, I've finished the set of test papers you gave me. I'll bring them to you tomorrow morning,\" Li Na said. Her pace was slow, but compared to Yang Yingcai, who was entering menopause, it was still much lighter. Yang Yingcai simply nodded quietly.\n\n\"My father has been sighing a lot lately.\" After a long hesitation, Li Na finally voiced her worry. \"I asked him why, but he wouldn't tell me. The Ma Clique has been defeated, Mongolia has been liberated, but he just stares at maps and old photos all day. What do you think he's thinking about?\"\n\nYang Yingcai remained silent, her mind churning. What Chairman Mao was thinking about was beyond her. She could only offer a vague answer: \"The Chairman must be planning a future for our China.\"\n\nBut as soon as the words left her mouth, Yang Yingcai was caught in a whirlpool of memories. She had seen the bodies of Flying Tigers pilots bombed by the Japanese, treated villagers poisoned by eating wild grass due to famine, and cared for Sichuan orphans left homeless by the KMT massacres...\n\n\"He must be thinking about that,\" Yang Yingcai said, shaking her head slightly as if to dispel the tragedies she had witnessed over the years and seek a moment of peace. Her thoughts returned to Mao Zedong, who was older than her and had seen even more tragedies. If she felt this way, how much more must the leader of the Chinese revolution feel? But then there was the Great Leap Forward, which even she had been involved in...\n\nShe shook her head forcefully, trying not to dwell on these thoughts. Li Na's voice brought her back to the present with good news: \"Speaking of which, Dr. Yang, my mother told me the other day that Hanzhong is selecting a group of excellent doctors to help with reconstruction. I told her that you are an excellent teacher, and if you go, I can go with you!\"\n\nYang Yingcai understood Li Na's wish, or rather, she shared the same hope. Instead of asking about Jiang Qing's opinion of her, she simply nodded thoughtfully."
 CPC_Yang_Yingcai_stories.4.o: "\"Then maybe I can try.\""
 CPC_Yang_Yingcai_stories.5.t: "The Road Home - Xi'an, [GetYear]"
 CPC_Yang_Yingcai_stories.5.d: "Yang Yingcai sat listlessly at her desk. Just gathering her courage to retrieve her personnel file from the archives had taken everything she had. After handing it to the unfamiliar colleague, her last shred of confidence dissipated.\n\nAt that moment, Li Na came in with a patient's file. Knowing Yang Yingcai had submitted her application to volunteer in Hanzhong, she casually asked, \"How did it go, Dr. Yang? Any news about Hanzhong?\"\n\n\"Probably no hope,\" Yang Yingcai snapped out of her daze, forcing a wry smile at Li Na. \"I won't pass the political background check.\"\n\nLi Na was stunned. She couldn't imagine why this gentle, skilled, and dedicated doctor wouldn't pass.\n\n\"Didn't you ask me to tell you about my life before becoming a doctor in Xi'an? The doctors at this Hospital know bits and pieces. Didn't any of them tell you?\"\n\n\"They wouldn't dare. They treat me like some princess. Every word feels like they're begging me for something. I hate it,\" Li Na frowned, shaking her head. \"Father always tells me I'm just another worker, another member of the proletariat, without any privilege...\"\n\nYang Yingcai chuckled meaningfully but remained silent.\n\n\"I know you've been avoiding, Dr. Yang. I've asked you so many times, but you wouldn't tell me anything.\" Seeing Yang Yingcai's silence, Li Na's voice grew urgent. \"I really don't want to be treated like this...\"\n\nTouched by Li Na's sincerity, Yang Yingcai sighed and gestured for her to sit on the examination table in the office. \"I have a favor to ask in return. I can tell you my story, but...\"\n\nLi Na understood. \"I promise not to tell anyone! I still need my dearest Dr. Yang!\"\n\n\"And don't tell your family or those uncles and aunts you know.\" Yang Yingcai sighed again. \"I don't need those big figures to know about my messy past...\""
 CPC_Yang_Yingcai_stories.5.o: "\"It's a long story that started in Yunnan...\""
 CPC_Yang_Yingcai_stories.6.t: "The Road Home - Xi'an, [GetYear]"
 CPC_Yang_Yingcai_stories.6.d: "Doctors from the PLA General Hospital were often assigned to temporary rotations in other cities within the revolutionary base areas. This time, the luck of the draw fell upon Yang Yingcai and Li Na, who were to embark on a journey to Lanzhou, a city quite a distance from Xi'an.\n\nNews of Li Na's assignment to Lanzhou elicited interesting reactions from her parents. Mao Zedong penned a congratulatory letter, urging Li Na to diligently learn from her mentors. Jiang Qing, on the other hand, remained curiously inactive, not even bothering to visit the hospital. However, this apparent indifference did not equate to a lack of concern. Soon enough, Yang Yingcai found herself summoned to a series of meetings with the hospital's Party Secretary, Director, Department Head, and Head Nurse. The message was clear: should anything untoward happen to Li Na, none of them at the hospital could face the Party Central Committee or Chairman Mao.\n\nAs the departure date drew nearer, Yang Yingcai knew that regardless of the hints, suggestions, or even outright attempts to dissuade her, the ultimate decision regarding the Lanzhou trip rested solely with Li Na. Was Li Na at the hospital merely for the prestige, or was she truly committed to serving the people? Yang Yingcai remained unsure. She decided to step back and observe, treating this as a final test of Li Na's true intentions.\n\nFinally, on the eve of their departure, a visibly flustered Li Na stormed into Yang Yingcai's room. \"Dr. Yang, they've gone too far! Why shouldn't I be allowed to go to Lanzhou?\"\n\nYang Yingcai, outwardly composed but inwardly relieved, gestured towards the bed. \"Sit down, Li Na. This trip does carry risks. I've heard the Hui are rioting.\"\n\n\"So what?\" Li Na retorted, cutting her off. \"Didn't you think it was risky when you came to Xi'an alone all those years ago?\"\n\nYang Yingcai paused. \"That's not what I meant… I'm not trying to stop you. But this isn't a walk in the park. They have just come out of martial law. Security is poor, and the workload will be heavy.\"\n\n\"Heavy is good,\" Li Na declared, her eyes shining with determination. \"Father always says we young people should go where the revolution needs us most, to serve the people.\"\n\nSeeing this, Yang Yingcai nodded approvingly, finally revealing her true thoughts. \"That's the spirit, Li Na. That's the spirit.\""
 CPC_Yang_Yingcai_stories.6.o: "\"We will leave by train tomorrow morning.\""
 CPC_Yang_Yingcai_stories.7.t: "The Road Home - Lanzhou, [GetYear]"
 CPC_Yang_Yingcai_stories.7.d: "Despite being mentally prepared, Li Na never imagined the task in Lanzhou would be this daunting. Almost all the wounded soldiers retreating from the Qinghai front line were injured by remnants of the Ma Clique roaming the countryside or by local bandits. Most of them lay on their beds, barely clinging to life on IV drips, with countless succumbing to infected wounds. It reminded Li Na of the stories Dr. Yang had shared about her time on the front lines in western Yunnan during the Anti-Japanese War, when she was just Li Na's age.\n\n\"Don't freeze, Comrade Li. Pass me the hemostat,\" Yang Yingcai's gentle voice snapped Li Na out of her daze. She composed herself, picked up the hemostat, and handed it to her teacher. As she looked at the unconscious soldier, knowledge from her studies raced through her mind. He was just a pitiful soul. His thin hands bore only a few scratches, but his left leg was a mangled mess of flesh and bone. Tiny white bone fragments were visible within the charred wound. Li Na couldn't bear to look any longer. As she turned her head, she saw Yang Yingcai sterilizing a bone saw. It seemed there was no saving the leg.\n\n\"He was hit by the blast of an anti-personnel mine that his comrade stepped on during their march. Consider him lucky. He gets to live by sacrificing a leg. The one who stepped on the mine was blown to pieces instantly. Not even a hundred years of medical advancement could have saved him,\" Yang Yingcai said calmly, even finding the time to educate her student. \"This tendon here...\"\n\n...\n\nThe amputation surgery took an excruciatingly long time. When Li Na finally finished sewing the last stitch, both of them breathed a sigh of relief, pulling off their sweat-drenched masks.\n\n\"Congratulations, Comrade Li. How did it feel to participate in your first surgery from beginning to end?\" Yang Yingcai asked as she removed her surgical gloves. \"You must have felt the same way I did when I first saw a Flying Tigers pilot whose leg was blown apart by the Japanese.\"\n\nLi Na could only manage a bitter smile."
 CPC_Yang_Yingcai_stories.7.o: "\"I'm ashamed that I haven't learned enough yet.\""
 CPC_Yang_Yingcai_stories.8.t: "The Road Home - Panzhihua, [GetYear]"
 CPC_Yang_Yingcai_stories.8.d: "Relieved by Li Na's experience in Lanzhou, everyone at the PLA General Hospital breathed a sigh of relief—for themselves as much as for her. At least if Li Na was sent on another medical tour, Jiang Qing wouldn't send anyone to pester them, and Yang Yingcai wouldn't be summoned by every level of leadership.\n\nTime passed uneventfully, and soon Li Na and Yang Yingcai faced their second random selection for a medical mission. This time, their destination was Panzhihua, Yunnan.\n\nStanding on a street in Panzhihua, the two looked at each other - each for their own reasons.\n\n\"I think… I came to Panzhihua about ten years ago, looking for my younger sister,\" Yang Yingcai said, gazing around in bewilderment. \"It's changed so much… Back then, this place wasn't even a town, just a few scattered houses and a main street.\"\n\nSeeing the usually calm and gentle Dr. Yang looking flustered, Li Na couldn't help but smile. \"Now it's not only a town, our Southwest Army Corps is also stationed here. My father says Panzhihua is rich in minerals, that's why they've developed it so well. Speaking of which, Dr. Yang, have you found your sister?\"\n\n\"I haven't had the time since I settled in Xi'an—and I haven't had any leads,\" Yang Yingcai replied absentmindedly. \"Finding a lost child in the vast northwest... it's too difficult.\"\n\nSeeing that Yang Yingcai wasn't interested in continuing the topic, Li Na changed the subject - unaware of the ripples it would cause in Yang Yingcai's life. \"I saw something strange a few days ago.\"\n\nYang Yingcai continued walking. \"Oh?\"\n\n\"The hospital pharmacy was short-staffed, so I filled in as inventory manager for two days. There were two batches of… probably Tibetan medicine, shipped from Golmud. I saw the shipping documents; I couldn't understand the writing, but it definitely wasn't Tibetan. It looked more like English or something...\"\n\nGolmud? Someone using the Latin alphabet in Golmud... Wait a minute. Memories rapidly resurfaced in Yang Yingcai's mind. Without thinking, she blurted out, \"Were there some Latin letters, along with some symbols that looked like patterns?\"\n\n\"You know about it, Dr. Yang?\"\n\n\"That's a type of Miao script. The medicine you saw was probably Miao medicine. At the beginning of the century, a British missionary named Pollard created this script to spread Christianity among the Miao people in Guizhou and Yunnan. I often dealt with Miao medicine traders when I was in Yunnan… It was while I was buying medicine with a Miao caravan that I lost my sister...\" Yang Yingcai stared at Li Na, her mind racing."
 CPC_Yang_Yingcai_stories.8.o: "\"After we return to Xi'an, please accompany me to the pharmacy.\""
 CPC_Yang_Yingcai_stories.9.t: "The Road Home - Golmud, [GetYear]"
 CPC_Yang_Yingcai_stories.9.d: "As the only Hmong medicine pharmacy in Golmud female boss, in her early thirties, she was able to survive the storms because of this small pharmacy: forty-seven years Ning Yu merger, Golmud mountain high emperor far away; 52 years of the third Communist Party, here as the Golmud the most stable pharmacy and by the Communist Party's courtesy; 59 years of the independence of Ma Jisai, clearing the Communist Party has evolved into a massacre, she is also by the pharmacy was spared! --Until now, no matter how the wind and clouds change outside, Yang Yingxi has a little confidence: as long as the disease, the enemy that has accompanied mankind for millions of years, still exists for one day, as long as she is still the only Hmong medicine merchant in Golmud, she and this small pharmacy will be safe and sound.... -Only, she didn't know where her bitter sister was and whether she was still alive.\n\nIt wasn't that she hadn't inquired about her sister's whereabouts, she was just too young - it was only after the death of the old Hmong who had brought her to Golmud in the year 60 that she had taken up the mantle of the pharmacy, and only then had she been able to inquire about her sister. She knew well that her sister was a Christian. Since 1961, Yang Yingxi had been deliberately asking around churches to see if they had taken in a middle-aged nun in her mid-forties - but to no avail, and the only clue she had was that a church in Chengdu seemed to have taken in a Christian who knew about medicine, but that too went unanswered.\n\nTime flowed so slowly, the Gelmu Municipal Committee had recently sent another batch of manifests, and the liaison officer looked anxious: \"Dr. Yang, the surgery department of the General Hospital of the People's Liberation Army wants a batch of topical medicines, here's the manifest.\"\n\nYang Yingxi nodded and took the bill of lading, which was not in the usual square characters - how could the PLA General Hospital have a doctor who could write Bogorian Miao?\n\nSurprised, Yang Yingxi took the bill of lading, she decided to write down her doubts in Miao language in this bill of lading - at least this time it was worth a try."
 CPC_Yang_Yingcai_stories.9.o: "\"I'm looking for my sister, her family name is Yang.\""
 CPC_Yang_Yingcai_stories.10.t: "The Road Home - [GetYear], Chongqing"
 CPC_Yang_Yingcai_stories.10.d: "From Xikang back to Xi'an but a month or so, even before waiting for the shipment of Golmud and her expected letter of reply, Yang Yingcai was urgently transferred to Chongqing to assist in the post-war medical care - this time Li Ne did not go with, Yang Yingcai to Chongqing is not purely to assist in the medical care, the time of the anti-Japanese resistance in western Yunnan let Yang Yingcai have the basic preparation and prevention of poisonous She was asked to assist the reorganized Southwest Agricultural College in preventing epidemics and mitigating disasters.\n\nIn the experimental field of the College of Agriculture, a young researcher was taking Yang Yingcai to introduce the experimental seeds of the College of Agriculture: \"This few acre is the responsibility of a young faculty member of the College, Comrade Yuan Longping, and the yield can be 40% higher than the general rice field. It's the current generation that has poor resistance to drugs and toxins.\"\nYang Yingcai nodded: \"Anti-toxicity and drug resistance is something of genetics, can this kind of rice resist general pesticides?\"\n\"Neither can it, after sprinkling pesticides the fall rate is more than half, we are now improving in this area.\"\n\"I've heard that our side of Chongqing has recently seen more enemy and counterfeit activities.\"\n\"Right, I heard from the comrades in Xi'an that you, Mr. Yang, participated in the Western Yunnan Anti-Japanese War, and understand the relevant knowledge of biochemistry, and this time we invited you to come here mainly to train our comrades here in the principles of basic biological warfare and precautionary measures, the enemy and the pseudo-pseudo have circled every day in the past few days, and it is estimated that the next step is to spread leaflets to confuse people or even to spread the poisonous gas and bacterial mutilation of the base area. \""
 CPC_Yang_Yingcai_stories.10.o: "\"Understood, I will give you all my knowledge.\""
 TER_RGOC_black_ops_begin: "The Public Security Department has §Yestablished relevant organizations to detect and prevent enemy agents,§! and the frequency of sabotage operations by the §Rpseudo-government§! will §Gdecrease§! as our §YMilitary Professionalism§! rises."
 CPC_MRC_issue_1: "Sino-Mongolian Unity"
 CPC_MRC_issue_1_desc: "As per discussions of the CPGAC and contacts with Mongolian People's Party comrades, the two party shall attend the conference for peaceful unification where we may debate on all agendas of unification. The first agenda would be the status of Mongoian region."
 CPC_MRC_issue_begin_tt: "§GSino-Mongolian Peace Unification Conference§! draws to yet another new §YProposal§!."
 CPC_MRC_issue_1_left: "Touring the Steppe"
 CPC_MRC_issue_1_left_desc: "Parallel to the talks, the Central Committee have formed a inspection team with Wan Li and Yu Guangyuan chairing it. The team shall embark on arduous march to Ulannbator to conclude their survey on current status of post war Mongolia. The tour shall be accompanied by representatives from the Mongolian Party and purposed to draw more knowledge on the economic situation and the livelihood of the people so that both the nations may recover the economic losses."
 CPC_MRC_issue_1_right: "Greet the Heroes"
 CPC_MRC_issue_1_right_desc: "The Mongolian people have finally achieved their liberation, not without support from all the peoples of East Asia in support of peace. The cadres having assisted the Mongolians shall be deemed true heroes and seasoned veterans. Now that they have returned to the Front with honor, they must also be applauded.\n\nIn the Mongolian civil war, our heroes have fought hard against Japan and witnessed things we have never dreamed of before. These heroes will be of great value to the Front's future development."
 CPC_MRC_issue_2: "Organizational Agenda"
 CPC_MRC_issue_2_desc: "Sharing the fundamental political platform of Marxism-Leninism, the CPC and MPP have reached the consensus that cooperation between the parties may prove beneficial while antagonising each other would be cursor to annihilation. In spite of historical unpleasantries, both parties shall pursue the policy of unity in actions."
 CPC_MRC_issue_2_left: "Handling Membership"
 CPC_MRC_issue_2_left_desc: "Confuscated membership and organizational affiliation between the three parties persists due to Hetao Region's complicated situation in the 1950s. Many Han and Mongol ethnic cadres have joined multiple parties to serve the revolutionary cause. Now that the Mongolian revolution have triumphed, it is imperative that we clarify the party member affiliations to prevent administrative strife."
 CPC_MRC_issue_2_right: "Handling Ideology"
 CPC_MRC_issue_2_right_desc: "Persisted national revolutionary war have made the nationalist sentiment grow rampant. Both Han and Mongol Supremacism have infiltrated our cadres' mind. A directive of the Central Committee introduced cleansing in the party, aiming at rectifying the misguided cadres' mind that the asian peoples have all fallen victim to the imperialist exploitation and as bretherens equal each other."
 CPC_MRC_issue_3: "Military Agenda"
 CPC_MRC_issue_3_desc: "The People's Army of Mongolia are seasoned in the revolutionary war, espousing expertise of steppe warfare. We positively look forward to coordinated actions between the PAM and the PLC, which may help cencentrate our defenses against reactionaries and preserve the revolution from all threats."
 CPC_MRC_issue_3_left: "The Collaborators"
 CPC_MRC_issue_3_left_desc: "In the last two decades, the Han and Mongol ethnic traitors have coalesced their influence into a web, sucking blood from the people and shall not be forgiven. \n\nAs the Party spearheaded, a unified court shall be introduced to collectively bring justice to the war criminals of Mengjiang puppet regime."
 CPC_MRC_issue_3_right: "The Russians"
 CPC_MRC_issue_3_right_desc: "As the Mongolian Revolution draws to success, the Mongolian cadres within Vasilevsky's Soviet remnants have vowed to returned to Mongolia. MPP comrades have sent delegation to Kyzyl to coordinate further negotiations.\n\nWe after all have nothing in objection."
 CPC_MRC_issue_4: "Inner Mongolian Agenda"
 CPC_MRC_issue_4_desc: "Inner Mongolia have been integrated into China Proper since Qing's reign, with Manchu nobles exercising sovereignty. The situation did not alter after the Republic of China was inaugurated. To clarify, we must underline the particular importance of Inner Mongolia in our hands."
 CPC_MRC_issue_4_left: "Consult Ulanhu"
 CPC_MRC_issue_4_left_desc: "The Inner Mongolia People's Revolutionary Party had deep ties to both People's Democracies. As the talk progresses, the mission of the party shall be deemed complete.\n\nDrawn from prudent consideration, we are adviced to consult the General Secretary of IMPRP, comrade Ulanhu to determine the existence of the party."
 CPC_MRC_issue_4_right: "Coordinated Patrols"
 CPC_MRC_issue_4_right_desc: "Post war Mengjiang influence have been beaten back to Chahar bordering the Hohhot region. In the foreseeable future, small swaths of enemy special service aiming at infiltrating, harassing and sabotage may be deployed. The Party leadership have thus decided to accelerate the construction and raise war consciousness of the region to combat said threats. "
 CPC_MRC_issue_5: "Reconstruction Agenda"
 CPC_MRC_issue_5_desc: "It is clear that peaceful unification of the two nations is by much united by interest. As the Base Area also suffered from economical recessions, it is hard to promise Ulannbator any substantial aid - just as two wolfs tainted by wounds, the two parties may only lick each others' wounds and help each other out of economical plight."
 CPC_MRC_end: "A Conference of Unity!"
 CPC_MRC_end_desc: "From Ulan Bator in the north to Hanzhong in the south, the news of the Sino-Mongolian reunification spread through the streets of the Base Areas, people spontaneously came out of their homes and began to take to the streets to celebrate, and for the first time since the Rebellion of the Ma Clique, the Front have been injected with passion of victory! The two great people of Han and Mongol shall certainly unite under the banner of Marxism-Leninism and the banner of Mao Zedong Thought. Onwards to yet another victory of socialism!"
 BOOKMARK_FBM_BLOCKER: "§LXinjiang Province§!"
 BOOKMARK_FBM_BLOCKER_DELAYED: "§FCopyrighted by §VThe New Order: FBM§! development team\nIn memory of the §mTNO: BNW§! Asia team\nNew content will be released in the §VFBM§! version\n-It will release as an independent §Lworkshop demo§!\n-It is also §Ya parallel storyline§! to §xTNO: TER§!§!\n§W--------------\n\n£GFX_texticon_bookmark_XIN\n\n\n\n\n§!§FIf, with its fierce storm, the New Order destroyed almost all resistance on Chinese soil...\nIf, amidst ripples of change, the world's thread hung on the rainy mountains of Huili, Sichuan...\n\nIn 1962, although he had long since retreated from the stage, the dying Sheng Shicai still had a sharp eye on every inch of Dihua and every peak of the Tianshan Mountains, trying to secure his power over Xinjiang. History had proven many times that he was the true king of this land, the sage who had led Xinjiang to stand tall in Central Asia. Early on, he was simply glancing towards Stalin, enjoying supplies and aid from Tyumen's government via the Kazakhstan overland route; after the collapse of Western Siberia, he promptly launched a campaign to reclaim financial independence, cut off all ties with Tyumen, and take a butcher's knife to any Communists who remained in the government...\n\n...But still, the Communists were this lord's lingering problem: Chen Tanqiu, Abasov, and Ahmadiyan, who had cunningly fled from the Anti-Imperialist Association like rabbits into the vast, sparsely-populated lands of Xinjiang. Only Yu Xiusong fell into his net over the course of his two-year effort to purge them, a defeat the likes of which he had never before experienced!\n\nRage gradually transformed into frustration, then lingered in his heart as a painful scar. At last, from Sheng Shicai's aging brain came a new idea - perhaps the time was right to put a line through to Japan...\n\nBut would his dream be fulfilled this time?§!"
