 Gsgx: "Improve Relationships"
 CPC_8th_congress.1.t: "Happy Chinese new year"
 CPC_8th_congress.1.d: "In order to promote the Gregorian calendar, the countryside has not had a lunar year for a long time, but the Lunnar New Year's Eve is still a custom that rural people can hardly let go of.\n\nWhenever this day is approaching, all families will start making preparations. The village fair is punctual with intellectuals who write couplets, a pair of couplets; itinerant vendors who sell New Year paintings, most of which are of Chairman Mao or agricultural harvests, 2 or 5 cents a piece, and stick to the house for a year. The year of the Gregorian calendar is also one of the few days when families will buy meat, save a year of meat stamps to be used on the something useful, buy some fatty meat, streaky pork home to make up for the oil; female comrades also have to buy five or six feet of cloth to make new clothes for the children at home.\n\nThe commune secretary Zhang got up early, with a large broom in the courtyard \"swish\" sweeping the ground, the western courtyard of the old Li is in the house mouthwash, heard the movement outside, with a mouthwash cup pushed out the door.\n\n\"Lao Zhang, get up so early.\"\n\n\"It's almost New Year's Eve, so do some sanitation and look clean.\"\n\n\"New Year again? only one isn't enough ah.\"\n\n\"Just consider me addicted to this.\"\n\nIt seems like to be sarcastic, Lao Li fussed to go to the broom, close to the Lao Zhang said: \"In fact, we all have this addiction, but the superior is not advocating it.\"\n\nHearing this, Zhang grinned, picked up a large broom and said, \"Come to our house tomorrow after work, let my wife make two dishes, let's drink a little.\""
 CPC_8th_congress.1.o: "Deal"
 CPC_8th_congress.6.t: "none of interest"
 CPC_8th_congress.6.d: "Zhou Enlai in the reception room has been anxiously walking back and forth for some time, anxiety and face wrinkles in general, the waiter boiled tea he did not drink a sip.\n\nThe battle in the south was an unprecedented victory for the Free China, sweeping away the gloomy and sullen atmosphere of defeat since the Great Leap Forward, but the words written by Mao in his editorial, \"Strike while the iron is hot and multiply the victory\", immediately evoked a hidden pain in Zhou's heart. The history of the fight against the Ma Clique - the Great Leap Forward - economic hardship - civil unrest was in his eyes. After the liberation of Sichuan, on the one hand, the construction of a hundred things need to be done, which would be enough to hit the excitement of Mao, can not stop the project, the budget has no place to find; on the other hand, the south campaign may alarm the Kuomintang government, all fronts are facing high Zongwu's stress reaction, manpower and material resources stretched to the limit. Zhou Enlai wrote all these situations into this year's report, and created an additional opinion letter, entrusting the secretary to send into the Chairman's study. But two days have passed, the day of the Congress is coming, there is still no response at all. Zhou Enlai is not a fortune teller, can not guess the mind of Chairman Mao, and no responsibility to guess, so he personally visited the door to follow up the letter of advice.\n\nAfter waiting half an hour, the Chairman's door opened and Chairman Mao's secretary Wang Li came out, handing the submission to Zhou with both hands with his customary smile: \"Premier, your document.\"\n\n\"If Chairman read my report properly?\"\n\n\"Yeah,\" Wang Li paused, \"there is an approval for you on it.\"\n\nThe last page of the respone, the vermilion brush was clearly approved with six large words. Zhou Enlai finished reading, don't know what to say."
 CPC_8th_congress.6.o: "\"It makes me annoy, take it out.\""
 CPC_8th_congress.14.t: "You want to feel proud, I want to deal with fact."
 CPC_8th_congress.14.d: "Looking at the cigarette roll handed to him by Kang Sheng, Bo Gu waved his hand and refused to smoke, he did not want the king of secret service in front of him to change the subject: \"Comrade Kang Sheng, I should not dictate your part of the work. But you also think for others, the work of ethnic minorities must be meticulous, and can no longer go down the old way of brutality in the past.\"\n\nKang Sheng turned around in the reception room, the hospitality cigarette rolls taken from the public plate and lined up to set back, he also did not have the habit of smoking, just want to take the opportunity by cigarettes to ease the question of Bo Gu and others. On the Mongolian issue, he already knew he was in the wrong, but the case of busting Mongolian spies was still fresh in his mind, who dared to say that the purge was useless? Is not achievement?\n\n\"You waved your hand, and all these people were executed for espionage, but what happened afterwards? How will you explain to Chairman Mao? How can you explain to the Mongolian people? How will you explain to the Mongolian people that 'none of the Mongolians are good, they are all reactionaries who destabilize the country'? Have you ever thought about what the cadres of the ethnic minorities think of us, the Han Chinese party members? How else can we start our work?\"\n\nKang Sheng did not say anything, and did not dare to look at Bo Gu, pretending to pound his thighs, dusting off the flying dust on his pants.\n\n\"You are the great Han nationalism, Chairman Mao has criticized, Lenin also criticized the Mensheviks’ 'cultural protectionism', party classes are in vain for you? What kind of ethnic equality are you talking about without giving political rights to ethnic minorities and lifting them out of poverty?\""
 CPC_8th_congress.14.o: "Don't do that anymore..."
 CPC_8th_congress.15.t: "Explain the Militia Division"
 CPC_8th_congress.15.d: "\"Chairman Mao said to 'found a great militia division' is a slogan, not to get the 'divisions' all up. The county magistrate as the division chief and the secretary as the political commissar, what’s problem that they can deal with? Empty frame can’t be caught. It's good to be able to take it out as a company when something really happens. The militia is very scattered, and their activities are mainly at the grassroots level, in squads, platoons and companies. It is very difficult to have division-based activities. The regular army can't move around in divisions in one piece either. You can't have so many divisions and regiments in normal times, and you don't need to have two or three thousand divisions in wartime. It is not possible to fight a war, and it is not possible to raise them. The central task of militia work is to improve production, not to hinder production, to promote production, to make it bigger, but hinder production.\n\n\"Chairman Liu visited the factory and gave a speech. The Ministry of Mobilization wrote a document based on Chairman Liu's speech. The Central Committee's policy, we must resolutely implement, seriously implement, we usually can’t raise too many soldiers, the country's wealth is not used to expand production, but used to raise soldiers, which is not okay. Therefore, we usually must have a limit to raise troops, to a certain saturation point can’t be more. If there is more, it is not allowed. The army is out of production, several people can only feed a soldier. We are the people's war, the militia work well, although the number of soldiers raised in normal times, the war will have an endless number of soldiers. Chairman Liu said the factory to defend itself!\"\n\n...... Xu Qianqian spoke straight to dry mouth, finally the logic and approach of the big militia division to rationalize, \"In general, there is a final goal -\""
 CPC_8th_congress.15.o: "\"-Quality and quantity!\""
 CPC_8th_congress.16.t: "Prospects"
 CPC_8th_congress.16.d: "\"General Lin is not going to today's meeting, he has a stomachache.\"\n\nPushing away Zhou Enlai's secretary Xiao Zhao, Ye Qun closed the door of the hotel room. Outside the door, the voice of Zhao informing the heads of the meeting still came into her ears from time to time, thanks to the quiet house. Lin Biao didn’t even bother to raise his eyelids, his arm on the armrest, his body spread out on the sofa, two legs crossed on the front sitting pier, and then take a blanket to the body a cover, like a mud doll. This was Lin Biao's \"regular activity\" every day.\n\nThe whole day to the old partner such a set of same expression, Ye Qun really can’t stand, she said as gently as she could, \"I was dragged a long way from Xi'an to come here for a meeting, but you pretended to be sick and didn't go once, so I stayed with you for five days. I don't even understand what's in your mind.\"\n\n\"Huh?\" This kind of nagging Lin Biao has heard too much, in the past he must be anxious, now his mind like water, pretend to not hear, and squeaked, \"What did you say?\"\n\n\"I said -, you look for Jiang Qing to take the photos she has asked the secretary to send you.\" Ye Qun took out the briefcase, which contained a photo of Lin Biao carefully studying the anthology of Mao Zedong.\n\n\"Oh, tomorrow it will be published in the newspaper, and one copy will be sent to each person in the whole army.\"\n\nHearing this, even Ye Qun was confused about whether her partner was \"motivated\" or not, so she dragged a chair and sat in front of Lin Biao, asking him tentatively, \"Are you going to the army meeting tomorrow?\" She was most afraid that Lin Biao would open his mouth and say \"no\", and her heart was in her throat.\n\nLin Biao slowly opened his eyes, looking at Ye Qun face eager expectation, breathlessly said: \"to meet with the major military leadership cadres, but also ......\"\n\nYe Qun instant relief, a long breath of relief."
 CPC_8th_congress.16.o: "\"Let's just say we'll be attending the meeting tomorrow with an illness.\""
 CPC_8th_congress.17.t: "Tea Party"
 CPC_8th_congress.17.d: "A small room in the Xi'an Welcome Hotel was lit up with smoke, and Zhou Enlai, Bo Gu, Chen Yi, Li Jingquan, and others sat in a circle.\n\n\"The war in Guangdong and the storm in Peiping just passed not long ago, as comrades have seen, if we go to the east, every step we take may cause Gao Zongwu, pseudo-Manchukuo, and even Japan's reaction, then the whole co-prosperity warring against each other, our front has only just recovered its strength, really is not capable of tearing the skin with them.\" Zhou Enlai took the lead in breaking the silence, \"So today at midnight I was really worried, so I had to get you guys in charge of diplomacy to simply have some tea and talk.\"\n\nChen Yi smoked: \"In my opinion, it is better to rebuild the underground party in the White Zone. \"\n\nBo Gu shook his head: \"No, the White Zone underground party was a big project that Comrade Enlai was in charge of for almost twenty years, in order to preserve Xi'an, this big project is broken - all leaders, how much time we have?”\n\nZhou Enlai nodded: \"It's true that it's difficult for the White Zone underground party to regain its previous scale of activity, but it's a good idea.\"\n\nChen Yi was silent for a long time, and suddenly an idea flashed through his mind, \"Don't we have a South China Bureau?\"\n\nEveryone glanced at each other, thoughts instantly clear a lot, and finally opened their mind to start planning down ......"
 CPC_8th_congress.17.o: "There is still a way."
 CPC_8th_congress.18.t: "Shaking hands"
 CPC_8th_congress.18.d: "The thunderous applause and the chants of \"Long live the CPC\" echoed for a long time in the hall - the Eighth National Congress of CPC was successfully finished.\n\nMao Zedong sat in front of the chairman's seat and watched the delegates reluctantly leave the venue, with mixed feelings inside.\n\n\"Chairman.\" Zhou Enlai had stood to his side, \"The meeting is finished.\" But Mao waved his hand: \"You go ahead Enlai, I'll sit for a while.\"\n\nSoon after the hall finally became clear, a few people were still sorting out the documents.\n\nMao Zedong let out a long sigh and slowly stood up.\n\n\"Chairman Mao.\" Liu Shaoqi's voice came from behind him. Mao Zedong turned back and saw Liu Shaoqi with a smile, leaning forward slightly.\n\n\"The meeting is over, why do you still stay here and wait for me, an old comrade?\" Mao Zedong laughed, \"I think that we still have to unite to seek unity ......\" \n\nLiu Shaoqi knew it by heart and extended his right hand directly.\n\nMao Zedong also reached out and clasped his hand."
 CPC_8th_congress.18.o: "Old people, ambitious ideals"
 CPC_8th_congress.19.t: "Last question"
 CPC_8th_congress.19.d: "\"The Chairman feels that the report I wrote is all spontaneous and refuses to believe, you are our base's bookkeeper, read the accounts line by line to the Chairman, he must be made to accept the idea of reducing the budget, or crisis will happen!\"\n\nIn the face of Zhou Enlai's request, Li Xiannian and Li Fuchun confused. They had just returned from Sichuan and were dragged to the Premier before they got off the train and went home.\n\n\"Premier, we still have to prepare the Sichuan economic report for the Chairman tonight, time may be a bit tight ......\"\n\n\"I just want to combine the two reports into one\" Not allowing the two to speak Enlai categorically asked them to add a separate column on the situation in Sichuan to his report.\n\nThat night, they came with a new report to the chairman. Before entering the official work, Chairman Mao always had to be polite: \"Sichuan, the land of heaven, saw a lot of scenery along the tour, right?\"\n\n\"Uh, not very good, Chairman.\" Only Li Xiannian dared to take the lead in singing the opposite, \"The ROC has been plaguing Sichuan since 15 years ago. Now that the spring famine has begun, the peasants are living in a very poor situation and have to recover slowly.\"\n\n\"Yes, recover slowly.\" Li Fuchun followed.\n\n\"The situation in the city ......\"\n\n\"Many businessmen capitalists fled, industry and commerce in general some straits, is trying to joint venture, not good to interfere directly.\"\n\nHearing these words, Mao Zedong nodded his head, as if understanding something, smoked, and asked: "
 CPC_8th_congress.19.o: "\"You guys came from Zhou Enlai, right?\""
 CPC_8th_congress.20.t: "Opening day"
 CPC_8th_congress.20.d: "\"Marxism says: Imbalance is a universal objective law. From imbalance to balance, and from balance to imbalance, the cycle goes on forever, but each cycle advances to a higher level. Imbalance is constant and absolute; balance is temporary and relative. Since the liberation of Xinjiang, the national revolutionary situation has reversed, which led to the victory of our southward campaign. We should see that achievements are main, and difficulties can be overcome. No matter how hard we suffer, our people are steadfast and unyielding!\"\n\n\"There are some comrades, day in and day out, will only be at odds with the fiery socialist climax, as if he is the only one who understands the difficulties of the base areas best, as if he is the only one who can speak from the heart. The sky and the world will be broken, and the sun and the moon will have no light if hundreds of millions of people in China are missing him. Such “right defeatists” must be purged from the Party.\"\n\n\"The comrades who returned from Sichuan all reported to us how much the local people embraced and welcomed us, so why couldn't they see the endless enthusiasm of the people? Not only do they not see it, but they also pour cold water on the people, discourage them, and waste the energy of the Party and the people for nothing.\"\n\"Don't these people think that the revolutionary cause has gone too far to his disadvantage? Don't they want to start an 'anti-adventurous' rampant attack on the Party and obstruct the development of the revolution? Well, then I am going to oppose the 'anti-adventuring', that is, to fight this evil spirit to the end.\"\n\n\"Soon the rectification will begin again, and I hope that comrades will unload their calendar central baggage and prepare for the vital work of the next few years.\"\n\n\n(Lead delegate) \"Long live the invincible Mao Zedong Thought!\""
 CPC_8th_congress.20.o: "(All chanting in unison) \" Long live! long live! long live!\""
 CPC_Ma_Hushan_crisis.0.t: "The Central Coordination Meeting"
 CPC_Ma_Hushan_crisis.0.d: "For other parts of the Great Northwest, it was just another ordinary morning, but not so for Government Road in Aksu: a fully armed unit stormed into the Aksu government office and arrested Communist Party members. Soldiers covered the members' heads with sacks and dragged them out of the city hall. Meanwhile, in newly liberated Kashgar, an unidentified armed group was besieging the municipal party committee. Amid the encirclement, committee staff broadcasted distress signals on public frequencies, hoping the call for help would spread as far as possible.\n\nThe radio operator, scanning frequencies, suddenly intercepted a clear-coded message: Kashgar's municipal party committee is under attack, requesting reinforcements! Cai Xuecun immediately ordered a call to Kashgar to confirm the situation and to Aksu to investigate Ma Hushan’s actions. Kashgar reported that the attackers were fierce and unusually organized, while Aksu remained eerily silent. \n\n\"Something's wrong!\" Cai Xuecun realized the gravity of the situation. The silence from Aksu was a clear signal—this wasn't a random riot by separatists but a premeditated assault.\n\n\"Ma Hushan has begun his rebellion,\" Yang Boqing asserted confidently. He immediately called for his guards. \"Gather the troops and prepare to suppress Ma Hushan’s uprising!\" Turning to Cai Xuecun, he said, \"You’ve worked in Xinjiang for years—reach out to forces opposing Ma Hushan. I'll contact the Central Government for reinforcements.\" \n\nThe radio operators transmitted the plea for help, with long-wave signals carrying Xinjiang’s call for assistance through the ionosphere and into Xi'an.\n\nIn the meeting room, Zhou Enlai passed the message around. \"Ma Hushan has finally shown his hand,\" Liu Shaoqi remarked. Bo Yibo proposed that the PLA immediately march on Hotan to quell the rebellion. Zhou Enlai and Xi Zhongxun, however, advised caution. They argued that the situation in southern Xinjiang was unclear, and a hasty military campaign could alarm the rebels and escalate the conflict. \n\nUltimately, the meeting decided:"
 CPC_Ma_Hushan_crisis.0.o1: "Convene a forum with the Hotan business community to brief them on the situation."
 CPC_Ma_Hushan_crisis.0.o2: "Continue the private investigation, and it’s best to involve Seypidin as well."
 CPC_Ma_Hushan_crisis.1.t: "The Treasury Farce"
 CPC_Ma_Hushan_crisis.1.d: "Seizing the opportunity while the Communist Party was overwhelmed by the chaos in Kashgar and Aksu, Ma Hushan was determined to capture the gold stored in the central bank of Hotan. With this treasure, he could secure the resources to challenge the Communists, or even proclaim himself a sovereign ruler. Hooves churned up the dust of the Gobi Desert, mirroring the boundless greed and audacious ambition of Ma Hushan. His elite cavalry charged forward like a sandstorm, threatening to consume Hotan in its wake.\n\nUpon storming into the city, Ma Hushan's forces headed straight for the central bank. Loyal Communist and Ma Zhongjie’s forces were tied up defending Aksu and Kashgar, leaving Hotan momentarily vulnerable. The bank’s Communist party secretary, spotting the advancing cavalry from his office window, immediately alerted the bank's security team and made a direct call to the Xinjiang Bureau, reporting Ma Hushan’s intent to rob the bank.\n\nIn the bureau headquarters, the news sent alarm bells ringing. Yang Boqing swiftly organized a response team to head to the bank and issued urgent orders to the secretary to hold the line at all costs until reinforcements arrived.\n\nMeanwhile, Ma Hushan and his cavalry dismounted in front of the bank, their weapons drawn as they stormed the entrance. Inside, bank security personnel stood their ground, firearms at the ready. Tension gripped the air as Ma Hushan grabbed the unlucky bank manager from the lobby, pointing a gun to his head.\n\n“Hands in the air! Nobody move!” Ma Hushan bellowed, his voice echoing through the halls. Waving his pistol menacingly, he barked at the trembling manager, “All I want is the gold—open the vault, now!” \n\nSecurity guards and Ma Hushan's men faced off, fingers resting firmly on triggers. The standoff grew increasingly volatile, the weight of impending violence hanging thick in the air. Ma Hushan leaned in closer, snarling at the manager, “Don’t test me, old man! Open the vault, or you’ll regret it!”"
 CPC_Ma_Hushan_crisis.1.o1: "Warn the manager not to comply."
 CPC_Ma_Hushan_crisis.1.o2: "Order the security personnel to resist with force."
 CPC_Ma_Hushan_crisis.1.o3: "Allow him to take it, and ambush them on their predetermined route based on prior intelligence."
 CPC_Ma_Hushan_crisis.11.t: "Desert Wild Charge"
 CPC_Ma_Hushan_crisis.11.d: "\"The Party Secretary ordered, 'Do not disclose the password!' He aimed to stall Ma Hushan, buying time for reinforcements to arrive. Enraged by the delay, Ma Hushan pressed the muzzle of his gun against the manager's neck, his finger poised on the trigger. 'If you don't give me the password and open the vault right now, I'll shoot you!' he threatened. The bank manager's face turned pale, tears streaming down his cheeks. Realizing the hostage's life was in grave danger, the Party Secretary reluctantly relented, agreeing to open the vault and ordering the security personnel to hold their fire.\n\nMa Hushan's men stood face-to-face with the security guards, their fingers twitching on the triggers, while Ma forced the trembling manager to lead him to the vault. The manager nervously entered the combination, and with a click, the heavy vault doors swung open. At the center of the vault lay the foundation of southern Xinjiang’s economy—the central bank’s gold reserves. The gleaming treasure reflected on Ma Hushan's face, twisted with greed. He ordered his men to pack the gold into sacks and, taking the manager as a temporary hostage, left the bank. Once out of the city, Ma released the manager and rode off with his loot.\n\nWhen Meng Changyou’s forces finally arrived, they were met with a scene of chaos—scattered belongings, shaken staff, and an empty vault. 'Where did Ma Hushan go?' Meng demanded. The bank secretary replied, 'He took the gold and fled toward Cele!' Alarmed, Meng immediately reported the situation to headquarters and proposed a rapid pursuit. Upon receiving the news, Cai Yang deliberated. Yang Boqing decided, 'He might have escaped for now, but he won't get far. Send Meng Changyou to chase him immediately, and order Ma Hanying to intercept him at Cele!'\n\n'Wait!' Cai Xuecun interjected, 'Ma Hanying and Ma Hushan have always been close. I fear he may handle this lightly, letting Ma off the hook. I suggest forcing him deeper into the desert. Let him starve for a few days and nights. When his supplies run out, he'll have no choice but to surrender.'\n\nIntercept or exhaust? Yang Boqing faced a critical decision.\""
 CPC_Ma_Hushan_crisis.11.o1: "Send an urgent telegram to the Cele Defense Zone Commander, Ma Hanying, ordering the immediate arrest of Ma Hushan!"
 CPC_Ma_Hushan_crisis.11.o2: "Send an urgent telegram to Ma Yanliang, ordering him to drive Ma Hushan into the desert!"
 CPC_Ma_Hushan_crisis.12.t: "End of charge"
 CPC_Ma_Hushan_crisis.12.d: "\"Beep, beep beep—\" The command to apprehend Ma Hushan arrived at Ma Heging's camp in no uncertain terms: \"Ensure Ma Hushan is captured and brought to justice immediately. Any negligence will be met with martial discipline!\" Ma Heging read the telegram twice, pondering the best way to handle the situation. \"General, should we prepare to leave?\" asked his adjutant. Ma Heging handed over the message and replied, \"We'll bring Ma Hushan back and make some arrangements to smooth things over.\"\n\nMeanwhile, Ma Hushan continued his wild escape, only to spot a column of cavalry charging in from his flank. His heart sank, thinking it was the pursuing troops. \"Brother Hushan!\" called a familiar voice from behind. It was none other than Ma Heging. \"Heging, my dear brother, I'm sorry, but I'm off to live a life of fortune!\" Ma Hushan replied. The flanking cavalry surged forward, blocking his path. Riding up, Ma Heging urged, \"Beyond my territory lies the area controlled by the Communists. Their troops won't show any mercy once they catch you! Brother Hushan, come back with me. Together with our family's brothers and elders, we'll figure out a way to protect you.\" Surrounded on all sides, with relentless pursuit cutting off any escape, Ma Hushan's plan had crumbled to nothing. \"Brother Heging, I trust you!\" Ma Hushan commanded his followers to drop their weapons and raise their hands in surrender. \"A gentleman's word—remember, you promised to keep me safe!\"\n\nBefore returning to Khotan, Ma Heging had already coordinated with other prominent Ma family figures to protect Ma Hushan. However, back in Khotan, where victory should have brought relief, Cai and Yang found themselves scrambling. A barrage of telegrams from the Ma family flooded the Xinjiang Bureau, filled with long-winded arguments defending Ma Hushan's \"merits during the war against Japan\" and demanding his safety in increasingly forceful terms. The matter was too significant for Cai and Yang to resolve alone, so they deferred to the central government for a decision.\n\nZhou Enlai reviewed the Xinjiang Bureau's report, his dissatisfaction evident. \"These Ma family forces have become utterly lawless!\" he exclaimed. Yet, given the delicate situation in Xinjiang—with Sheng Shicai still entrenched in Dihua and internal strife inadvisable for now—prudence prevailed. Learning from this costly episode, Zhou Enlai issued orders for Ma Hushan to retire immediately and be placed under house arrest. \"The central government will dispatch additional personnel. Ensure the Ma family is monitored closely at all times,\" Zhou wrote in his response."
 CPC_Ma_Hushan_crisis.12.o: "It's not that retribution won't come; it's just that the time has not yet arrived."
 CPC_Ma_Hushan_crisis.13.t: "End of charge"
 CPC_Ma_Hushan_crisis.13.d: "Upon receiving the order, Ma Yanliang immediately led his troops in pursuit. Scouting riders spread out to locate Ma Hushan's whereabouts. It wasn’t long before one returned with information on his movements. Ma Yanliang decided to split his forces into two: one group would intercept Ma Hushan head-on, while the other would flank him from the side. Combined with Meng Changyou’s pursuing forces at the rear, they aimed to form a three-sided encirclement, driving Ma Hushan into the Taklamakan Desert.\n\nMa Hushan noticed two cavalry units approaching from the front and left, with the dust clouds of the rear pursuit growing ever closer. Left with no other options, he made a desperate gamble. “Damn it!” he muttered through clenched teeth, spurring his horse toward the desert. “Fate will decide—riches or ruin!” Together with his followers, Ma Hushan vanished into the desert sands. Meanwhile, Ma Yanliang and Meng Changyou’s forces regrouped, agreeing not to pursue. Instead, they patrolled along the main roads, content to let the desert take its toll.\n\nInside the vast expanse of the desert, Ma Hushan paused when he realized the pursuers had not followed. He asked his men if there were any nearby oases. They reported none. He then inquired about their food and water supplies, only to hear that they had provisions for just two days. The endless dunes stretched in every direction, offering no landmarks or guidance. “We’ll just have to keep trying,” Ma Hushan thought grimly.\n\nTwo days passed quickly. Still trapped in the desert’s unrelenting grasp, Ma Hushan’s party remained without an escape route. Meanwhile, the murmurs of discontent among his followers grew louder. Alarmed by their grumbling, Ma Hushan realized that without an oasis or a return to the road, a mutiny was imminent. With no better options, he resolved to head back toward the main road.\n\nUpon reemerging onto the road, Ma Hushan and his group were immediately surrounded by Communist cavalry, who had been patrolling and awaiting this moment. Realizing the futility of resistance, Ma Hushan instructed his men to drop their weapons and surrender the stolen gold. Raising their hands, they surrendered without a fight.\n\nBack in Hetian, Ma Hushan was imprisoned in a secure jail, awaiting the severe trial and judgment that his actions had earned."
 CPC_Ma_Hushan_crisis.13.o: "The culprits and the stolen goods have been seized—everyone is satisfied."
 CPC_Ma_Hushan_crisis.21.t: "The Great Gold Heist"
 CPC_Ma_Hushan_crisis.21.d: "\"Quickly, give me the password!\" Ma Hushan continued threatening the manager. The manager looked to the secretary in terror, but the secretary, determined to buy more time, remained silent. Frustrated, Ma Hushan lost patience and, with one cold shot, executed the unfortunate manager. The manager fell lifeless to the ground, discarded by Ma Hushan as if he were nothing more than an obstacle. \n\nMa Hushan then took cover and ordered his men to open fire. The secretary also quickly found cover and directed the security team to return fire. The two sides clashed fiercely, bullets flying in every direction. The bank's security personnel, familiar with the building's layout, used the office structures as cover to mount a defense. However, they were outnumbered and running low on ammunition. Meanwhile, Ma Hushan's forces, well-equipped and numerous, struggled to navigate the unfamiliar terrain of the bank, opting instead to flood the main entrance and hall with gunfire. \n\nThe relentless firefight quickly threw the entire city into chaos. News of the clash reached Cai Xuecun and Yang Boqing in no time. \n\nAfter receiving the report, the two leaders immediately ordered reinforcements to march toward Hotan. \"It seems Ma Hushan couldn't hold back any longer and has resorted to outright robbery,\" remarked Yang Boqing. Cai Xuecun, however, expressed concern, saying, \"We don't know how long the security team can hold out. We must act swiftly.\" \n\nAs the reinforcements made their way to the city, Cai and Yang debated their next steps. Cai Xuecun proposed immediately surrounding Hotan to ensure Ma Hushan had no route of escape. On the other hand, Yang Boqing argued that every minute of delay risked further casualties and suggested the internal security forces launch a clearing operation immediately, with reinforcements rushing in to provide support as quickly as possible. "
 CPC_Ma_Hushan_crisis.21.o1: "Issue an Order: Encircle Hotan City with Surrounding Forces"
 CPC_Ma_Hushan_crisis.21.o2: "Issue an Order: Instruct Inner-City Forces to Lockdown Hotan and Eliminate Rebel Forces"
 CPC_Ma_Hushan_crisis.22.t: "End of charge"
 CPC_Ma_Hushan_crisis.22.d: "Meng Changyou and Liu Ruilong, leading the main forces alongside the public security units drawn from surrounding areas, encircled the ancient city of Hotan in an impenetrable siege. After blowing open the bank vault and seizing the gold, Ma Hushan had no time to savor his success before spurring his horse toward the city gate. Yet as he reached it, he found the advancing army had already sealed the path. Forced to turn back, he galloped toward another gate, only to find Communist troops waiting patiently there as well.\n\nPanic quickly spread among Ma Hushan and his followers: *It’s over. It’s all over. We didn’t gain anything, and now we’re going to be executed!* Heated arguments erupted among the soldiers, with accusations flying of incompetence. Some even turned on Ma Hushan, blaming him for their plight and threatening to take his head as an offering to earn pardon. But Ma Hushan ignored their recriminations; his own mind was in turmoil. *What now? What do I do?* As Communist forces began to move into the city, a desperate idea flashed into his mind: he and his followers dashed into the city hospital.\n\nMa Hushan ordered his men to take control of the medical staff. Amid the doctors' and nurses' terrified screams, he frantically demanded to know where Ma Zhongying was. A frightened nurse pointed down the corridor, and Ma Hushan hurriedly ran in that direction. At the far end of the hallway, he found Ma Zhongying resting in a hospital bed, looking frail but no longer in critical condition. The elder man’s expression turned to surprise at the sight of his brother-in-law, disheveled and covered in dust, rushing into the room.\n\nMa Hushan fell to his knees beside the bed, sobbing and confessing his greed-induced folly. He begged Ma Zhongying for mercy, pleading for him to intervene on his behalf. Ma Zhongying, wearied by his injuries and Ma Hushan’s relentless groveling, finally closed his eyes in irritation and grudgingly agreed to make an appeal.\n\nThanks to Ma Zhongying’s plea, Ma Hushan avoided imprisonment. Stripped of all his official titles, he was nevertheless allowed to live in relative peace under house arrest. *At least I’ve kept my head,* Ma Hushan thought bitterly. *A failed gamble, but I’m still alive.*"
 CPC_Ma_Hushan_crisis.22.o: "Let’s note this down for today; we’ll settle the score properly another day."
 CPC_Ma_Hushan_crisis.23.t: "End of charge"
 CPC_Ma_Hushan_crisis.23.d: "Inside the city of Hotan, the public security forces and military received urgent orders and immediately sprang into action. Police officers and militia quickly secured key intersections, staying alert for any suspicious activity and vowing not to let a single perpetrator escape. Meanwhile, the city's military forces rushed toward the bank, determined to capture Ma Hushan before he could flee and to protect Xinjiang's economic assets.\n\nAfter a fierce gunfight, Ma Hushan and his men overcame the bank's security team. Using explosives, they blasted open the vault and seized all the gold. However, their moment of triumph was short-lived. As they exited the bank, they found themselves surrounded—Communist forces had converged on them from all directions. The trap was set, and there was no way out.\n\nPanic swept through Ma Hushan's group. Realizing the gravity of their situation, fear quickly turned into blame. The soldiers began arguing, accusing each other of incompetence. Some even turned on Ma Hushan, blaming him for leading them to ruin and threatening to hand him over in exchange for leniency. Ma Hushan, overwhelmed by the chaos and despair, was consumed by panic. What to do? The hospital? Seek help from Ma Zhongying? But the route to the hospital was already barricaded, with police and militia ready for confrontation.\n\nLeft with no options, Ma Hushan decided to gamble it all. Gritting his teeth, he spurred his horse toward the hospital. Communist soldiers opened fire immediately, while police and militia unleashed a barrage of bullets, emptying their magazines. When the dust settled, Ma Hushan lay lifeless, his chest riddled with approximately ten fatal gunshot wounds, as later confirmed by forensic analysis. His remaining followers, witnessing his demise, surrendered without further resistance."
 CPC_Ma_Hushan_crisis.23.o: "Die worthwhile"
 CPC_Ma_Hushan_crisis.31.t: "Lie in wait like a hunter by the stump, catching prey as it comes."
 CPC_Ma_Hushan_crisis.31.d: "The bank secretary paused for a moment before answering, \"Alright, alright, I’ll cooperate with you. Calm down!\" He instructed the manager to open the vault and assured him that all responsibility would fall on his shoulders. Trembling, the manager unlocked the vault. In the center of the room lay the foundation of southern Xinjiang's economy—the central bank's gold reserves. The shimmering glow of the gold reflected on Ma Hushan's greedy face. Ma ordered his men to pack all the gold into bags and promptly left the bank.\n\nThe manager, still shaken, watched as the bank secretary ran to the office to inform the Xinjiang Bureau of the gold heist. Armed with intelligence from Seypidin over the past few days, Cai and Yang quickly instructed Li Youzhen to set up an ambush along Ma Hushan’s escape route, laying in wait for the inevitable.\n\nAfter leaving the city, Ma Hushan loaded the gold-laden bags onto a wagon and led his convoy toward their planned meeting point. \n\nUyghur agents lay in ambush near an essential oasis, awaiting Ma’s arrival. As night fell, a suspicious convoy approached, led by none other than Ma Hushan himself. The convoy stopped at the oasis to replenish their water supply and rest briefly. As Ma stepped to the water’s edge, the agents sprang from their hiding spots, swiftly subduing his men and securing the convoy. Ma Hushan, however, reacted quickly, mounting a horse and fleeing into the vast desert. \n\nThe agents interrogated Ma’s captured men on the spot and learned of his ambition to escape Communist control and establish himself as a ruler. They secured the captured convoy and its golden cargo, using their radio to report back to headquarters.\n\nLi Youzhen received the report and, upon confirming the gold’s safety, exhaled deeply in relief—at least the thief hadn’t succeeded in spiriting away the treasure. But now he faced another pressing decision:"
 CPC_Ma_Hushan_crisis.31.o1: "The gold was transported back to Hotan, and Ma Hushan was swiftly arrested."
 CPC_Ma_Hushan_crisis.31.o2: "The gold was withheld and then transported to its intended destination."
 CPC_Ma_Hushan_crisis.32.t: "End of charge"
 CPC_Ma_Hushan_crisis.32.d: "A few days later, dehydrated and starving, Ma Hushan voluntarily surrendered to patrolling soldiers. The soldiers escorted him back to Hetian, where the Xinjiang Bureau Headquarters took charge and immediately transferred him to the underground detention facility of the Security Division, placing Li Youzhen in charge of his interrogation.\n\nDue to the severe impact of the robbery, the interrogation primarily focused on Ma Hushan’s motive for the heist. A glaring fluorescent light shone directly on Ma Hushan, causing him to squint under the disorienting brightness. The relentless, round-the-clock questioning gradually eroded his mental state, but the remnants of his rationality warned him not to reveal his collaborators to the Communists—doing so could lead to consequences far worse than imprisonment.\n\nThus, Ma Hushan claimed that he intended to use the gold to recruit soldiers and establish his own power base, free from Communist control—an explanation consistent with what he had told his subordinates. When Li Youzhen cross-referenced this statement with the confessions of Ma Hushan’s followers, he found no discrepancies. Yet, Li Youzhen’s instincts told him that Ma Hushan was hiding something more.\n\nSeveral more days of interrogation followed, but Ma Hushan remained steadfast, repeating his original testimony. Exhausted and without new leads, Li Youzhen had no choice but to submit the existing confession to headquarters.\n\nUltimately, Ma Hushan was imprisoned, and the true conspiracy behind the gold heist disappeared with him into obscurity."
 CPC_Ma_Hushan_crisis.32.o: "Strengthen security measures in Hotan to prevent such incidents from happening again."
 CPC_Ma_Hushan_crisis.33.t: "End of charge"
 CPC_Ma_Hushan_crisis.33.d: "After receiving orders to continue the investigation, the operatives stripped the prisoners of their clothes, disguised themselves as Ma Hushan's men, and joined forces with the pursuing troops. After discussion, it was decided that the operatives would infiltrate the area to investigate, while the troops remained behind to provide support. Using the transaction location uncovered earlier, the operatives verified the information with Ma Hushan's captured men before setting off.\n\nUpon arriving at the site, the operatives immediately heard a familiar language—Uyghur. A trader greeted the convoy with open arms, saying, \"Assalamu Alaikum!\" The operatives grew cautious, noting the connection between the Uyghur language, Islam, and Ma Hushan’s contact. Combining this information, they concluded that the traders were remnants of the unneutralized East Turkestan separatists. To avoid arousing suspicion, the operative team leader reciprocated the greeting.\n\nThe convoy was led into the separatists’ camp, where the operatives discovered a stockpile of weapons and ammunition. The leader of the separatists greeted them warmly, spouting rhetoric about \"Anti-communist salvation\" and \"Rebuilding Turkestan.\" Feigning agreement, the team leader suddenly drew his weapon and shot the separatist leader. Chaos erupted as the other separatists retaliated. Hearing the gunfire, the support troops rushed to the scene. In the ensuing battle, the combined forces of operatives and soldiers either killed or captured the separatists.\n\nThe operatives returned to Hetian with the remaining East Turkestan captives. Meanwhile, Ma Hushan, still in custody, continued to deny any association, sticking to his story about wanting to \"break free from the communists and establish his own rule.\" After interrogating the captured separatists, however, Li Youzhen laid their confessions and evidence on the table—irrefutable proof of Ma Hushan's collusion. Faced with the undeniable truth, Ma Hushan finally broke down, slumping in his chair as he awaited judgment.\n\nDays later, the news of Ma Hushan’s conspiracy with East Turkestan separatists to overthrow Xinjiang’s liberated zones spread across newspapers in all the liberated areas. Ma Hushan was then escorted to the center of Hetian, where a public trial was held."
 CPC_Ma_Hushan_crisis.33.o: "Lure the snake out of its hole, then strike at its vital point."
