 CPC_communist_party_long: "Communist Party of China§F\n--------------\nChairman of the National Defence Front: §GMao Zedong§!\nChairman of the Central Committee: §GMao Zedong§!\nMembers of the Standing Committee of the Politburo: §GMao Zedong§!, §mLiu Shaoqi§!, §OZhou Enlai§!, §GZhu De§!, §YChen Yun§!, §YDeng Xiaoping§!, §GGao Gang§!\nGeneral Secretary of the Central Committee's Secretariat: §YDeng Xiaoping§!§!\n"
