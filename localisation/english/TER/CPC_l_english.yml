 CPC_funni.1.t: "Guofu Road still in normala"
 CPC_funni.1.d: "The radio finished playing the sentimental \"March of the Greater East Asia\" and began broadcasting today's editorial: \"The Communist bandits repeatedly incite hatred against the state, causing the decay of livelihoods and shocking the nation. Their ambition to seize power and disrupt the country is obvious to all. Now, students in Beiping and Wuhan, corrupted by Communist ideology, stubbornly resist the national army and police. This brazen defiance is truly astonishing...\" Fu Chong tightened his grip on his coffee cup. As a law student at Central University, even though the professors repeated the so-called truths of the Republic of China like bureaucratic puppets, the world around him and his conscience told him that the citizens, students, and workers of Beiping and Wuhan were in the right. A fellow student leaned close and whispered, \"We should protest too—let's go to Guofu Road, to the National Assembly Hall, and to the Presidential Office!\"\n\nTwo days later, a massive protest formed on Guofu Road in Nanjing, consisting of citizens, students, and factory workers. Among the crowd, a few held portraits of Mao Zedong, but the majority held portraits of Sun Yat-sen or Lu Xun. Some carried banners with slogans such as: \"Stop the civil war, unite against foreign aggression!\" \"Release Wuhan’s patriotic students!\" and \"You killed 300,000 in Nanjing before; how many more will you kill today?\" The protesters marched slowly from west to east along Guofu Road. Police patrols called for reinforcements while quietly stepping aside. The doors of the National Assembly Hall were tightly shut, as the legislators inside—useless as ever—sought refuge. Artists at the Art Exhibition Hall peeked out nervously, afraid the \"mob\" would disturb their dreams. Underground journalists rushed to the scene, eager to capture this historic moment. The Communist underground network sent urgent messages to the northwest, reporting the unfolding events in Nanjing. Amid the chants and shouting, the crowd reached the Presidential Office. Its gates were tightly closed, and the blue sky with a white sun emblem flag hung above the crimson sea of the protesters, a stark contrast to the tense atmosphere. Below the gates, tanks stood ready.\n\nAs the crowd approached, the tanks roared to life, trying to intimidate the protesters with their engines' thunderous noise. Most instinctively retreated—flesh was no match for steel. But Fu Chong stepped forward, standing in front of a tank. Turning his back to the vehicle, he faced the protesters and shouted, \"The Presidential Office endlessly proclaims itself the inheritor of Sun Yat-sen’s legacy! It boasts of its commitment to 'Three Principles' and 'constitutional governance,' but I see none of that here! The endless volumes of official documents contain nothing but one phrase: 'devouring the people!'\" Cheers erupted from the crowd in agreement. On a nearby loft, an underground journalist, Lin Shi-ba, focused his camera on Fu Chong. Fu Chong then turned toward the military units, questioning them: \"You are Chinese soldiers! Why are you blocking us instead of fighting to save the nation from foreign invaders?\"\n\nThe soldiers inside the tanks remained silent. However, the commander of the lead tank received orders from his superior: Advance and open fire on the crowd. Three tanks and their accompanying infantry formed a horizontal line on Guofu Road in front of the Presidential Office. After a brief pause, the middle tank suddenly surged forward without warning. While delivering his speech, Fu Chong suddenly noticed the blue sky and white sun emblem moving toward him—it was the military insignia emblazoned on the tank’s front armor. Then came dizziness, followed by excruciating pain. \"Ratatatatatata—\" The coaxial machine guns and rifles opened fire, sending the crowd screaming and scattering. In the loft, Lin Shi-ba trembled as he pressed the shutter button multiple times, capturing Fu Chong’s lifeless, paralyzed body and the panicked crowd struggling and falling without blood. A stray bullet shattered the loft’s glass, prompting Lin to crouch down quickly. He removed the film from his camera and sprinted toward the underground newspaper office.\n\nIn the blood-soaked street before the Presidential Office, the tank battalion commander called the Presidential Office to declare the \"successful suppression of the rebellion.\""
 CPC_funni.1.o: "\"Guofu Road still in order!\""
