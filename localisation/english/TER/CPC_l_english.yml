 CPC_Yang_Yingcai_stories.11.t: "The Road Home - [GetYear], Golmud"
 CPC_Yang_Yingcai_stories.11.d: "Seems to have written the Burghri Hmong Wen's bill of lading only that time, and Yang Yingxi's letter also sinks into the sea, she is a bit huffy, I do not know which one of the daggers to take their fun, obviously they can't find my sister has been anxious like ants on a hot pot -\n\nGeermu Health Bureau's supply section office door was pushed open, Yang Yingxi walked straight to the section chief: \"Comrade, recently Xi'an side of the shortage of drugs?\"\nLooking at the sudden visit of Yang Yingxi, the section chief appeared a bit overwhelmed: \"Haven't made a special order to...Laoxiang, what are you...\"\n\"Ah - it's fine! I'm just worried about the lack of medicinal materials in Xi'an, for fear of delaying the revolutionary work - not lack of good, not lack of good, comrade you busy, you busy ah.\" Yang Yingxi's voice tone went up an octave at once, looking flustered--this was too out of character, rushing here like this for the sake of her longed-for sister, like an overbearing old man who was forcibly buying and selling. She panicked and closed the door of the office, leaving the chief of the section who didn't know which act was being played.\n\nWalking out of the Health Bureau building Yang Yingxi for the first time felt that the sun of Golmud was so blinding, that she secretly made up her mind."
 CPC_Yang_Yingcai_stories.11.o: "\"Next time I'll have to make a personal delivery to Xi'an.\""
 CPC_Yang_Yingcai_stories_tooltips_sorry: "One day, §mthe shattered mirror will be remade§!, §Cdestiny will be reconstructed§!, and §Gtheir§! story is §Yfar from over§!.\n\nDeveloper's Note: Yang Yingcai's personal story is still being written, so stay tuned for future hotfixes and updates!"
 CPC_Yang_Yingcai_stories.101.d: "\"We meet again, Comrade Yang... Yang Yingcai.\" As expected, the person in charge of recruitment for the South Corp's medical team was Xu Lin again, but Yang Yingcai couldn't quite remember who this person was: \"Have we met somewhere before, Comrade?\"\n\n\"A few years ago, a female doctor wanted to support the construction of Hanzhong, but she was hesitant to hand over her file.\" Xu Lin chuckled, \"But there shouldn't be that problem now, right?\"\n\nYang Yingcai suddenly realized, smiled and said, \"I was officially promoted to chief surgeon a few days ago, and I also joined the Party - now I can finally devote myself to the anti-Japanese cause of our front with dignity, right?\"\n\n\"Absolutely.\" Xu Lin said with a smile, \"But this time you have to think about it carefully - the army has been reorganized into two corps: Commander Xu will lead the North Corp to fight in Shanxi soon, the intensity of the battle will be very high, and the shortage of medical care can be imagined It will also be very large; Vice Chairman Lin led the South Corp to fight Yunnan first. You are from Yunnan. I think you have been wandering abroad for half your life. Might as well go back and have a look? But, of course, it's up to you to decide.\"\n\nYang Yingcai in front of him seemed to be in a dilemma, and Xu Lin was not in a hurry to urge her - this office is open to the public for recruitment, most doctors don't actually need to come here, once the war breaks out, the organization will arrange their whereabouts, it's really this Doctor Yang's enthusiasm for resisting Japan is too high - 30 years of time has not been able to obliterate the enthusiasm of a doctor who personally participated in the Anti-Japanese War in western Yunnan.\n\nFinally, Yang Yingcai seemed to have made up her mind and raised her head."
 CPC_Yang_Yingcai_stories.101.o1: "\"Then I guess…I'll go back to my hometown.\""
 CPC_Yang_Yingcai_stories.101.o2: "\"I'll go and help them fight in Shanxi wherever I'm needed.\""
 CPC_Yang_Yingcai_stories.325.t: "The Road Home - Finale"
 CPC_Yang_Yingcai_stories.325.d: "The South Corps had already marched eastwards, leaving Yang Yingcai behind to serve as the director of the newly established Lufeng County People's Hospital. Finally, she stood once more upon the soil of central Yunnan, a land she had yearned for for so long.\n\nCountless times, Yang Yingcai had dreamed of returning to these mountains that had nurtured her. She would see blue mist rising from the slopes, towering pines, camphor trees, and banyans stretching their branches towards the sky. Villages, temples, waterwheels, and mountain passes would all be shrouded in the ever-changing mist... Returning to her roots, this was perhaps the ultimate desire of her life.\n\nThe Battle of Kunming flashed vividly in her mind. More than five divisions had clashed fiercely on the Kunming plateau. The relentless artillery bombardment had even blown a gap in the Sleeping Beauty Hill's \"hair\". As for the bodies in Dianchi Lake, even now, they had not all been recovered...\n\nYet here, in Jinshan, Lufeng, everything was still. The People's Liberation Army had gone east. The heart-stopping gunfire, the gut-wrenching cries, the despairing moans, the mangled limbs scattered across the battlefield - all had faded away, leaving only the bullet-riddled but still proudly flying military flags rustling in the wind. Her whole life felt like a dream.\n\nShe had finally returned. Her hometown was neither good nor bad. Some had passed away, others had been born - just like her work, snatching souls not yet meant to die from the jaws of death and ushering them into new life. Yang Yingcai caressed the old banyan tree at the heart of the hospital. After a lifetime of drifting, she finally understood the meaning of returning to one's roots. A thought, timely and fitting, rose in her mind."
 CPC_Yang_Yingcai_stories.325.o: "Once China is liberated, I'll take my\nsister back to our hometown."
 CPC_Yang_Yingcai_stories.1023.t: "The Road Home - Finale"
 CPC_Yang_Yingcai_stories.1023.d: "Yang Yingcai closed her eyes, as if falling asleep - but she was actually knocked unconscious by the whistling shells. In the chaotic world of her subconscious, she found herself at a performance of the Ansai waist drum dance - the drums thundered, white sheep-belly towels bobbed and jumped in the dust-filled air, strong and young men and women of Suide and Mizhi, the Yellow River Cantata amidst the smoke of war, the clanging March of the Swords.\n\nThen she was back on the North China front line, where she was, the Taihang Mountains stretching for thousands of miles, hundreds of thousands of PLA soldiers singing, \"Chase them! Chase them! Don't let them breathe, don't let them escape!\"\n\nThen she was in Chengdu, filled with the smoke of battle, and saw children with tears streaming down their faces. She opened her mouth to speak, but found her voice was so distant – as if it was pulling her away, to another time and space.\n\nIt was the mountain rain of Yunnan, large raindrops hitting the camphor leaves, falling on the brim of the hat of a young girl in the prime of her youth. Back then, they were carefree – as if the world had never been turned upside down.\n\nShe woke up with a start. She was clearly still in the trenches on the Northern front line, so why did she see such a scene? She poked her head out. A mortar shell, whistling sharply, fell beside Yang Yingcai from a height of fifty or sixty meters. At the moment of the explosion, she felt as if she had turned into a light feather, floating up, and before it completely fell into darkness, only one thought remained in her mind."
 CPC_Yang_Yingcai_stories.1023.o: "\"Finally, I am a martyr too...\""
 CPC_Yang_Yingcai_stories_end_tt: "§GHer§! story §Yends here§! - but it's §Cnot perfect enough§!, and perhaps, when the world line ripples from §xbeyond the frontier§!, the shadowy hand of §Cfate§! will fill in the §Cmany regrets§!."
 CPC_Yang_Yingcai_history.1.t: "The Road Home - Xi'an, [GetYear] (1)"
 CPC_Yang_Yingcai_history.1.d: "Exhaustion. After an entire morning of work, Xu Lin felt utter exhaustion. There had been no shortage of applicants, but most were laborers who had carried stretchers on the front lines for a few days. Sending them to Hanzhong would be utterly pointless. He had to explain the situation repeatedly to these overly enthusiastic young men and persuade them to return to the posts where the people needed them more. Even with the best of tempers, he couldn't endure this kind of torment. Xu Lin took off his reading glasses, wanting to seize the opportunity to rest for a bit.\n\nHowever, he couldn't even steal this moment of leisure. Just as he removed his glasses, the dilapidated door in front of him creaked open again with a knock that brought him no joy.\n\n\"Please come in.\"\n\nTo his surprise, the person who slipped through the door was a woman of less than imposing stature. She appeared to have passed the most radiant years of her life, entering into the quiet flow of middle age. Yet, Xu Lin could still sense a vibrant life force emanating from her. As a medical professional, Xu Lin keenly perceived that the visitor might be a colleague.\n\n\"Have you had any relevant work experience?\"\n\n\"Yes, I am a surgeon at the PLA General Hospital.\"\n\nThe visitor spoke with certainty, not sounding like a lie. But there was something about her unwavering confidence, as if she were trying to entice him into making a decision on the spot.\n\n\"That's wonderful. Comrade, please leave your relevant political background materials here. We will give you an answer when you return tomorrow afternoon.\"\n\n\"... Couldn't you ask me a few professional questions here? I understand that supporting Hanzhong is an urgent matter...\"\n\n\"Comrade, you wouldn't happen to have forgotten to bring the relevant materials, would you?\"\n\nUpon hearing this, the female doctor didn't insist further. She slowly took out a paper bag from her arms and placed it on the table, bowing deeply. Without another word, she retreated from the room. The light filtering through the crack in the door fell upon the file bag, allowing Xu Lin to see her name clearly for the first time."
 CPC_Yang_Yingcai_history.1.o: "\"Yang Yingcai\""
 CPC_Yang_Yingcai_history.2.t: "The Road Home - Xi'an, [GetYear] (2)"
 CPC_Yang_Yingcai_history.2.d: "Walking out of the main entrance of Xi'an Hospital, Yang Yingcai took a deep breath, a feeling of both relief and sorrow washing over her. Her legs felt like cotton, unsteady beneath her. The midday Xi'an sun embraced her gently, as if trying to comfort her, to melt away the unsettling thoughts. But deep down, she knew the moment she handed over that paper bag, her ties with Hanzhong were severed.\n\nInside the bag was her \"stain\" - her political stain, to be precise. It held the marks left by waves of political movements on an ordinary person like her. For doctors on the frontlines, a few political issues wouldn't necessarily affect their work. However, this time was different. Hanzhong was a new city that the Party was paying special attention to, a city designated for key development. They couldn't have any hint of political blemishes involved.\n\nNo, her life wouldn't fall apart because of this. She still had her stable job as Deputy Director at the PLA General Hospital. Yang Yingcai consoled herself. Didn't Chairman Mao once say that the War of Resistance Against Japan had simply entered a protracted phase? What's more, border friction was still ongoing. There would always be an army unit or two that, due to a shortage of military doctors, would make an exception and hire her. But that wasn't enough. Years of experience had honed her medical skills and vision, and she couldn't let them stagnate. Even though she was past forty, she still had aspirations, even if they were just wishful thinking, even if they were impossible to achieve. She yearned for Hanzhong, like a despised convict longing for a vast and sparsely populated wasteland.\n\nThe urge to cry welled up, stinging her eyes and nose. But she held back her tears. A strong, independent woman of the new era couldn't let her tears flow freely. Yang Yingcai straightened her small frame and strode forward, disappearing into the crowd."
 CPC_Yang_Yingcai_history.2.o: "A bird with clipped wings, it seemed,\ncould never return to her warm nest."
 CPC_Yang_Yingcai_history_tips_0: "§GHer§! past §Ywill be unveiled§!."
 CPC_Yang_Yingcai_history.3.t: "The Road Home - Xi'an, [GetYear] (3)"
 CPC_Yang_Yingcai_history.3.d: "\"Can't we just make an exception and recruit her?\"\n\n\"Exception? From what?\" The Party Secretary of the Xi'an City Hospital shot him a sideways glance. \"Comrade Xu Lin, I must remind you that your class stance is in danger of slipping. You need to rectify this immediately.\"\n\nXu Lin took a deep breath. Having worked for almost thirty years, this was the first time he felt the weight of why no one wanted to be associated with the \"Rightists.\" Still, he wanted to make one last effort.\n\n\"Of course I wouldn't wave the flag for Rightists. I just want to emphasize that Yang Yingcai earned merits on the front lines of the Maji rebellion in '61. She was also the Deputy Director of Surgery at the PLA General Hospital and can even perform surgeries independently. She was even Comrade Li Na's teacher. I think…\"\n\n\"She is indeed a good candidate,\" The Party Secretary raised a hand, signaling that Xu Lin could stop. \"Doctors who volunteer for the Hanzhong support mission and return without major accidents will all be promoted upon their return. It's a coveted opportunity for everyone. But precisely because of this, the Party Central Committee requires us to pay strict attention to the purity and discipline of our ranks. We will not allow any hint of political blemishes to involve-\"\n\n\"Are we selecting the Hanzhong medical team based on professional competence or political stance?!\"\n\n\"…Please calm down, Comrade Xu Lin. The previous branch meeting of the support team has already decided. Yang Yingcai will not be recruited. Her name will not appear on the list of the Hanzhong medical team. I hope you can respect the opinions of other comrades. And-\"\n\nWhile resolutely stating the conclusion, the Party Secretary took out a large package from the drawer and pushed it to Xu Lin.\n\n\"This is a copy of the transcript regarding Yang Yingcai and the historical materials she signed and admitted to, which we retrieved at your strong request. Although I don't think it's necessary anymore, if you want to read it, you can read it here.\""
 CPC_Yang_Yingcai_history.3.o: "\"What the hell has this doctor been possessed with?\""
 CPC_Yang_Yingcai_history.4.t: "The Road Away - Kunming, 1944"
 CPC_Yang_Yingcai_history.4.d: "A strongly worded letter of resignation was handed over to Qin Guanghong, the president of Kunhua Hospital.\n\n\"...If the so-called self-determination of Yunnan Province to cover up the provincial government is spurned by the treasonous acts, then my medical staff for several years to save the front line of the anti-Japanese soldiers of the hard work will be meaningless. The provincial government's intention of peace talks with Japan has been decided, then I think there is no longer a need to stay in the hospital to treat the sick and save lives, so I am writing this letter to President Qin.\"\n\nFor surgeons like Yang Yingcai, who grew up in the war years, injury, illness and death have long been a shadow: the wounded soldiers of the Expeditionary Army who fought and retreated along the Yunnan-Burma Highway lost their right hands but still wanted to go back to the front line to fight against Japan; the poor old Bai farmers who fled from Dali with pus from gunshot wounds did not know that the infection of the wounds had already taken away their last chance of life; the Flying Tigers pilots whose legs were blown up at the Yunnan Stage Airport howled more and more weakly until they were blown up in a hospital in the middle of a war. howls grew weaker and weaker until he died of great blood loss.\n\nBut she did not run away, not to mention fear, she could always calmly go to the operating table, calmly snatch a few lives from the hands of the God of Death, or calmly cover the unfortunate dead with a white cloth.\n\nBut her calm and collected finally was Long Yun Lu Han's traitorous behaviour mercilessly shattered, the former anti-Japanese efforts to do all the efforts have disappeared, Yunnan overnight became Japan's \"friends\", only to leave her incomprehensible tears and grief.\n\nShe was only 23 years old, just the age of youthful fervour, she was not willing to China's anti-Japanese cause lasted for seven years should be so slipped into the abyss of doom - so she put pen to paper to write the letter of resignation, carrying their own from Dian Guang Bible College brought the medicine box out of the door of Kunhua Hospital, wandering in the streets of Kunming again."
 CPC_Yang_Yingcai_history.4.o: "\"But where on earth am I going?\""
 CPC_Yang_Yingcai_history.5.t: "The Road Away - 1945, Lufeng(1)"
 CPC_Yang_Yingcai_history.5.d: "Back to the Yuan Yongjing Yang Yingcai never tell outsiders - including her mother's family - about what happened to her in Kunming, she just quietly holding the donkey with a medicine box on her back, looking for her mother's family to ask for a shop in Luochuan Dam, doing business as a Western medicine clinic.\n\nFrom an outsider's point of view, the Yang family's second sister is a serious young man who has seen the world: she has received a Western-style education from Dian Guang Bible College, has been to the provincial capital as a doctor, even if she went back to Lufeng, she is still the only Western doctor in a town and three villages in Luochuan Dam. Some of the Miao people in the dam who had fled from Guizhou held her in high esteem, calling her \"Master Yang\" to her face and \"Little Jesus\" in private - for a young woman who had made a wish to convert to the Lord, such a title of respect was not enough for a young woman who had made a wish to convert to the Lord. For a young woman who had made a vow to convert to the Lord, such honorifics often made her laugh and cry.\n\nHer shop was directly across the street from the Yang Family Salt Shop's Luochuan branch, which was run by her second uncle - the girl was at the age of youthful shyness, and it was not convenient to disturb the youngest sister's medical practice, so the matchmakers on the doorstep had brought gifts of meat and wine to the salt shop, and asked the second uncle about the youngest sister's lifelong affairs.\n\nIn his spare time, the second uncle will secretly come to the backyard of Yang Yingcai's clinic to cook for her; or hold a water pipe and smoke, until Yang Yingcai finished the last patient, after the evening service to the backyard to see his own uncle, he will not speak the words."
 CPC_Yang_Yingcai_history.5.o: "\"My little girl, can you still get married if you believe in Christ?\""
 CPC_Yang_Yingcai_history.6.t: "The Road Away - 1945, Lufeng(2)"
 CPC_Yang_Yingcai_history.6.d: "Sometimes Yang Yingcai also want to want to Huo Zaiyi as heroic shout \"Japanese invaders are not destroyed, no home for also\", but the reality of the Dianzhong forest sea of yellow and humid will be pulled into the deepest part of the countryside again and again, her mother's family is quite attentive to her wedding event, the light of the second uncle sifted out of the matchmaker there are eight, and then by the mother's family layer after layer of screening invitations to the banquet, and finally! finally selected a candidate who seemed to be pretty good.\n\nIn the backyard of the clinic, there is a pot of charcoal fire heating water, Yang Yingcai clutches the photo of a man in military uniform of similar age, and sitting opposite her, not only is there a second uncle who smokes a water pipe with a loud sound, there are also her own parents.\n\n\"The Zhu family counts Yuan Yongjing big family, come to matchmaking this with the former General Zhu (Zhu Peide) their family is a cousin relationship, the family head of the two sons, the eldest died in the Taierzhuang, leaving this only son of the oldest two in the west of Dianxi to fight the Japanese when the hand is broken -\" the second uncle sighs I'm afraid that if the second son marries into the Zhu family, the second son will have to suffer if he serves his family with a broken hand, why don't we take a look at it again?\"\n\n\"The young man is nice, but his missing hand is too inconvenient.\" Yang Yingcai's father also sighed, \"But he is the one who fought the Japanese without a hand, not to lose this face.\"\n\n\"Otherwise the street that Ma family old five is also good, his father is when Luo Chuan township mayor, in this side also have a care.\" Second uncle smoke a mouthful of cigarettes, the water pipe again gurgling up, \"just--\"\n\n\"- Yingcai came back after the most hate when the official, or listen to her opinion.\" Mother picked up the second uncle's words.\n\nThree pairs of eyes looked at Yang Yingcai - but she threw the photo into the fire pot and was silent for a long time."
 CPC_Yang_Yingcai_history.6.o: "\"you could go back to Won-yongui if you want, I'll bring the second brother of the Zhu family here and raise them.\""
 CPC_Yang_Yingcai_history.7.t: "The Road Away - 1947, deep mountains in Yunnan"
 CPC_Yang_Yingcai_history.7.d: "The days after the marriage were uneventful but happy, Yang Yingcai's fourth sister Yang Yingxi also travelled twenty miles from Yuanyongjing to join her in order to learn some medical skills, and her excellent medical skills and elegant temperament won Yang Yingcai the praise of the townspeople; some Miao merchants with good connections had already established a regular supply relationship with her clinic, and at the time when the rain was rustling and crashing down on the mountains and forests, Yang Yingcai would hang a white curtain with \"Buy Medicine\" on the closed door of her clinic, and take Yang Yingxi to follow them over the mountains to Lufeng County or even to Anning to buy medicines. When the rain rustles through the mountains and forests, Yang Yingcai hangs a white curtain that reads \"Buy Medicine\" in front of the closed door of her clinic, and takes Yang Yingxi with her as she follows the Miao traders over the mountains to Lufeng County, or even to Anning, where she shops for medicines, a journey that usually takes half a month-if all goes well.\n\nThe bell on the horse's neck swung around in the rain, making a crisp ringing sound, as Yang Yingcai and Yang Yingxi rode their horses, cloaked in straw raincoats, along with the Miao merchant caravan through the forested mountain passes.\n\n\"Second sister, how much longer until we reach the Yunnan-Burma road?\"\n\nYang Yingcai looked at the surrounding terrain, \"There is still a mountain to go over, the mountain goes over to the Yipinglang coal mine, the Yunnan-Burma road passes through the coal mine, and you can go to Kunming by following the road.\" She pressed the brim of Yang Yingxi's hat, so that this fifteen year old girl's handsome face is not splashed by the rain, \"It's raining heavily.\"\n\nAn object as big as a pine cone rolled next to the Miao merchant's carriage, Yang Yingcai didn't pay much attention to it, but the object hit the wheel hub and actually made a crisp metallic ringing sound. Suddenly, she saw the old Miao man in front of her shifted as if he was suddenly electrocuted, and then he opened his voice and howled while rolling and crawling to get off his horse and ran down the hillside..."
 CPC_Yang_Yingcai_history.7.o: "\"Grenaaaade!\""
 CPC_Yang_Yingcai_history.8.t: "The Road Away - 1947, Anfeng camp(1)"
 CPC_Yang_Yingcai_history.8.d: "Wake up again, Yang Yingcai has been lying in a tent in Anfeng Battalion, she does not need to struggle, only need to move her eyes from side to side to understand that this is the field hospital of the Dian Army - in the past eight years, she has been in such a tent countless times with the god of death to snatch human life.\n\nThere were quite a few young soldiers coming and going, and on the brim of their hats there was the familiar white sun logo - although she had been disappointed to the core with this round of white sun, right now Yang Yingcai had to admit that she had more than likely been saved by the Dian Army and had been brought back to life. She tried to move her limbs, not much pain, at least still intact...\n\nShe suddenly seemed to remember something, swish sat up, caught a passing soldier began to ask: \"Dianjun brothers!  Those people which accompanied with me...\"\n\nThis young soldier's eyes were confused, not knowing what this woman was talking about, \"We were ordered by Chairman Long to come to Lufeng to fight the bandits...\" He glanced at the bed number, \"You are Vice Chairman Lu's personal guards brought back, I'll go to bring the accompanying team of doctor over, you ask the doctor.\"\n\nYang Yingcai hurriedly nodded, then sat back on the edge of the bed in disorientation."
 CPC_Yang_Yingcai_history.8.o: "\"God, where's my sister...\""
 CPC_Yang_Yingcai_history.9.t: "The Road Away - 1947, Anfeng camp(2)"
 CPC_Yang_Yingcai_history.9.d: "Yang Yingcai vaguely felt that the figure of the visitor looked familiar - it was not until she stood in front of her eyes that she confirmed that it was Fan Bingzhe, the Dean of the Medical School of the National Yun University.\n\nThe same surgeon, but also in the Dian army anti-Japanese field hospitals and fought side by side, Fan Bingzhe see this deceased heart is also a shock: \"Xiao Yang, how do you...\".\n\n\"Personal reasons, and Qin Dean wrote a letter of resignation - you read it?\" In the past before the old leader, Yang Yingcai can only suppress the tone of voice.\n\nFan Bingzhe looked around and came to Yang Yingcai in front of him, \"Your letter is famous in Kunming, some good things are sued to the vice chairman of the Lu.\"\n\nYang Yingcai heart a shock, but quickly understood - if Lu Han two years ago really ordered to track down, even if he was a woman hiding into the Yuan Yongjing compound will sooner or later be the Yunnan army to find out.\n\nSilent for a moment, Yang Yingcai still spoke: \"Teacher Fan, I should be in Luo Chuan to a flat wave to go to the mountain road attacked by bandits, together with me there is a team of Miao merchants and my sister, where are they now?\"\n\n\"There's no one around you, a few of the Miao in front of you were blown up, a few were killed by random gunfire, I didn't see any other women who were almost as young as you.\"\n\nA thunderbolt struck straight into Yang Yingcai's fragile heart, tearing it apart.\n\n\"My sister...I lost her…\" Her legs were soft, and she even sat down directly on the wet mud ground.\n\nIt is not easy to help Yang Yingcai to the bed to sit steady, Fan Bingzhe sighed: \"I have other wounded to see, first go, small Yang you four feet and four hands well, after settling down can come to find me I specially approved you as the accompanying doctor, Lu vice chairman personally brought three regiments to Lufeng to eliminate the bandits...\""
 CPC_Yang_Yingcai_history.9.o: "\"If you stay here, you might still find your little sister.\""
 CPC_Yang_Yingcai_history.10.t: "The Road Away - 1948, Panzhihua"
 CPC_Yang_Yingcai_history.10.d: "Yang Yingcai finally refused Fan Bingzhe's proposal, it is not that she looked down on this former peer, simply because four years ago the provincial government left the anti-Japanese cause closed the door of self-protection of the cowardice of the doings of her shame - she briefly to the family to write a letter to report safety, of course, 28-year-old Yang Yingcai completely did not have the courage to lie with the family of his mother, she wrote a letter to report truthfully the disappearance of the sister. She truthfully reported the disappearance of her sister, and wrote a promise: \"I'm going to the north to travel to the doctor to look for my little sister, if I can't find my little sister's whereabouts, Cai'er is willing to be expelled from the genealogy of the family, and after a hundred years, she will become a lonely soul and wild ghosts and also have no complaints.\" The big words are put out, but how to find the little sister Yang Yingxi but make her quite a headache.\n\nShe wandered aimlessly through the streets of Panzhihua Town with her medicine chest on her arm, not knowing where she was going to find her sister or what she should do in the future - the three years she had spent in her hometown had made her a little bit blind, and she didn't understand at all what had happened outside of Yunnan over the years. Finding someone requires capital, and the only capital she has is her heavy medicine chest - Fan Bingzhe also secretly stuffed a large pile of western medicine and Yunnan Baiyao before saying goodbye. With the help of this medicine box and a little bit of present ocean, Yang Yingcai set up an open-air table on the only street corner, and the signboard printed on the white streamer was quite pragmatic: \"No fortune-telling but only see the sick, medicine once the disease is removed.\"\n\nWith superb medical skills and a large box full of medicines, Yang Yingcai's stall immediately business booming, headache and brain fever small half-piece of aspirin, traumatic injuries to do a little surgery a few stitches, and even as a midwife...less than half a month, Yang Yingcai's wallet immediately became bulging up.\n\nBut her mind is not on this, half a month in Panzhihua all kinds of sights and sounds let her gradually understand how the world around her has changed drastically: Germany, Italy and Japan under the iron hooves of the new order to come to this miserable world - but in the Northwest there is also a force that is struggling to survive in the cracks..."
 CPC_Yang_Yingcai_history.10.o: "Now to Shaanxi, find the Communist Party!"
 CPC_Yang_Yingcai_history.11.t: "The Road Away - Chengdu, 1950"
 CPC_Yang_Yingcai_history.11.d: "Chengdu has long since recovered from the war. But the massacres waged by the Central Army have still brought permanent trauma to the area, and walking through the streets, Yang Yingcai can still see many ruins left over from the war that were not cleared in time, as well as patches of temporary refuge camps.\n\nYang Yingcai stopped in front of an old Catholic church, and subconsciously began to draw a cross on her chest - the years of travelling had left her with no time to think about her religious identity, and it was only at this moment when she saw the cross that she suddenly remembered she hadn't worshipped for two years.\n\nShe walked through the doors of the church with a mixture of devotion and guilt, only to find that it wasn't a congregation of worshippers - instead, the babble of children reading from a text echoed through the hall, and just below the crucifix, the old nun wrote \"China\" on a makeshift blackboard in a single stroke. Yang Yingcai didn't dare to disturb the children's lesson, but just found a bench and sat down to pray silently.\n\nWhen the children left the class and ran away laughing, Yang Yingcai finally came up and tentatively asked the old nun who was cleaning up the blackboard, \"Excuse me, is the church actually an orphanage now?\"\n\"Alas, they're all dolls with no parents from the Central Army's massacre some years ago, so we made some room out to take the dolls in and raise them.\" The old nun replied, \"Listen to your le accent, from Yunnan?\" \"Yes, I heard that the communist party in the north is still fighting the Japanese, want to go there.\"\nThe old nun nodded: \"The road is not easy to walk, right? Look at the patches on your clothes.\" Yang Yingcai blushed as she was caught in the middle of the conversation - she hadn't saved much money from her medical journey from Panzhihua to Chengdu, and it would take her some time to save up to find a job in Chengdu.\nThe old nun saw her dilemma, but did not reveal it, she smiled: \"Can you read and write, would you like to come here to help lead the dolls? Money is easy to say.\"\nYang Yingcai pondered for a while, unable to find a reason to refuse - it wasn't often that one could teach the children and still be convenient to do the daily worship, so she solemnly nodded her head."
 CPC_Yang_Yingcai_history.11.o: "\"Okay.\""
 CPC_Yang_Yingcai_history.12.t: "The Road Away - 1953, Chengdu(1)"
 CPC_Yang_Yingcai_history.12.d: "It should be said that during her three years in Sichuan, Yang Yingcai was often tormented by two thoughts - sometimes three.\n\nTwo years ago to Xikang to buy Tibetan medicine when she inquired about a sister related news: a same age girl doll in 1949 had followed a ragged old Hmong through Xichang to continue north, then with the old Hmong contact with the Tibetan medicinal use of very obscure and difficult to understand the official language of western Sichuan to Yang Yingcai even with the explanation of the girl doll and the old Hmong to go to a small town called Gelmu in Qinghai. Golmud a small city in Qinghai - Yang Yingcai doubly difficult is that the journey from Xikang straight on the Golmud exceptionally dangerous, the slightest carelessness will be killed.\n\nHowever, I heard that Golmud is also the jurisdiction of the \"National Defence Front\", then perhaps she can first go north to Xi'an, settle down and then go to Golmud to find Yang Yingxi - the regret of failing to fight against the Japanese is the regret of Yang Yingcai buried in her heart for many years, the good news is the road from Chengdu to Xi'an is not difficult to travel, the villages and towns along the way are not difficult, and there are many villages and towns along the way, which is much easier than from Panzhihua to Chengdu.\n\nBut the children were also a source of concern: perhaps because she was old and alone with no heirs, Yang Yingcai was also very devoted to caring for the children in the orphanage, and now she was known as \"Yang's mother,\" with the children even taking it upon themselves to go to the outskirts of the city and gather wildflowers to weave a crown of flowers for her - just the biggest thing the children could do for her. -The oldest of these children is only fifteen years old, although under Yang Yingcai's careful care the older children have been able to earn their own living, but...\n\nIn late spring, Yang Yingcai woke up from another sleepless night, she knew she had to make a choice - affection, ideals, responsibility..."
 CPC_Yang_Yingcai_history.12.o: "It's all my precious."
 CPC_Yang_Yingcai_history.13.t: "The Road Away - 1953, Chengdu(2)"
 CPC_Yang_Yingcai_history.13.d: "\"...You've decided? You really want to go to Xi'an to find the Communists?\" In the confessional, the old nun sat beside Yang Yingcai and inquired in an extremely gentle voice.\n\"...Well.\" Yang Yingcai nodded her head.\n\"Ambitious.\" The old nun praised, \"Did you say anything on the dolls' side?\"\n\"Not yet, I always feel that...t is not very responsible for them to go away like this...,\" Yang Yingcai was a bit squirmy.\nAt these words, the old nun actually giggled: \"From you to these three years I counted out, you worry too much, too little for their own consideration - a lot of dolls told me, said Yang mother was going to go to other places, to see them pitiful to stay.\"\nYang Yingcai let out a bitter laugh, \"This is whisking me away?\" The old nun slowly tightened her smile, \"See I told you that you have too many concerns, don't believe me, go ask the dolls in class today.\"\n\n\"With a creak, the door to the confessional was pulled open, and the children who had been eavesdropping at the door for a long time came in and surrounded the two of them, with the leader of the group. The leader of the \"child king\" even do not care about sniveling and rushed up to embrace Yang Yingcai.\n\n\"I know...Yang mother is not...not to take care of us specially le, Yang mother to go to other places...to play...fight Japan.\" He sobbed out his inner thoughts, \"We also...can't let go of Yang mama, but the old mum told us that Yang mama fight Japan to drive away those bastards who killed our mum and dad - \"\n\nYang Yingcai patted his spine, \"Good boy...I can't let go of you guys either.\"\n\nThe teary-eyed boy in his arms slowly raised his head, \"Mom despite going to fight Japan, younger brothers and sisters and old mother and I take care of.\" The words just fell, the children loudly echoed.\n\nLooking at the children with tears in their eyes, Yang Yingcai felt an inexplicable courage - which she had been lacking for the past three years. She drew a cross in front of her chest and then spoke solemnly.\n\n\"I know you are all good children, I believe in you...\""
 CPC_Yang_Yingcai_history.13.o: "\"I'll be back one day, because this is my family too.\""
 CPC_Yang_Yingcai_history.14.t: "The Road Away - Xi'an No.1 Prison, Winter 1958"
 CPC_Yang_Yingcai_history.14.d: "\"When the work team arrived, they found the Bible lying open on the counter facing the door.\"\n\n\"…\"\n\n\"Silence is meaningless. I suggest you explain yourself, otherwise we have every reason to believe that you're stubbornly resisting the organization's scrutiny.\"\n\n\"…I knew it would be discovered as soon as it was taken. It was only a matter of time. If I had hidden the Bible myself, it wouldn't just be a personal conduct issue, but a deception of the organization, a betrayal of the Party and Chairman Mao…\"\n\n\"Isn't it a bit late to pledge your loyalty now? Yang Yingcai, let me remind you, this is not a matter of lifestyle, but a matter of your stance!\"\n\n\"…Stance?\"\n\n\"Why do you possess printed material representing bourgeois idealism and religion? Why don't you participate in collective life and instead hide yourself in prayer? Your actions are completely against the masses and against the Marxist-Leninist-Mao Zedong thought of materialism!\"\n\n\"I really didn't think that much about it.\"\n\n\"And you think we'll just believe you? Let me remind you again, spies and traitors from the occupied areas often use religion as a cover. You better be able to prove that you're not one of them, so you still have a chance to return to the embrace of the Party and the masses. If you're really a shameless traitor, we won't show any mercy.\"\n\n\"I swear to Chairman Mao, I could never be a traitor. I wasn't before, I'm not now, and I won't be in the future.\"\n\n\"That sounds nice. Alright, take her away.\""
 CPC_Yang_Yingcai_history.14.o: "\"The rightist label will have to stay.\""
 CPC_Yang_Yingcai_history.15.t: "The Road Away - Tianshui, Late 1960"
 CPC_Yang_Yingcai_history.15.d: "\"Yang Yingcai, come out!\"\n\nAlong with a shout of her name, the heavy prison gate creaked open before Yang Yingcai. She followed behind the soldier, walking down corridors, crossing courtyards, and finally, stood outside the prison gates.\n\nWhether it was her innate stubbornness or her clear conscience, Yang Yingcai met each round of interrogation with silence, never once admitting to any crimes of treason or counter-revolution. After that initial raid, the work unit thoroughly searched her clinic but found no further incriminating evidence. They soon lost interest in the tight-lipped female doctor.\n\nIn the winter of 1958, Yang Yingcai, along with a group of political prisoners, was incarcerated in Tianshui Prison, where she spent the next three years in laogai. She had a peculiar way of protecting her hands: while other prisoners toiled away at heavy manual labor, Yang Yingcai always managed to substitute it with extra sewing work. In her free time, she would even use needles to practice anatomical drawings on her fellow inmates - she seemed to firmly believe that one day she would pick up a scalpel again, and so she never stopped practicing. And so, between hope and waiting, days and nights slipped through her fingers, until, unexpectedly, the day of her release arrived.\n\nThe biting winter wind ruffled her hair and clothes. The streets were deserted. There was no one to welcome her, nor anyone waiting to spit curses at her. Her lost freedom was carelessly returned, but the lost time was gone forever. Yang Yingcai took a deep breath of the icy air, gathered her thoughts, and walked away."
 CPC_Yang_Yingcai_history.15.o: "She needed a new job."
 CPC_Yang_Yingcai_history.16.t: "The Road Away - Xi'an, 1955"
 CPC_Yang_Yingcai_history.16.d: "After all, Yang Yingcai arrived in this city of revolution - Xi'an.\n\nUnlike the post-war devastation in Chengdu, after seven years of development here, it has transformed from the former dynasty's capital into a true fortress city. Everywhere you look there are strategic air raid shelters, anti-aircraft guns set up on factory roofs, temples turned into hospitals, soldiers patrolling the streets... Everything matched Yang Yingcai's expectations. Indeed, this was the anti-Japanese stronghold she had imagined, the last refuge for the conscientious and benevolent who still held on to the dream of a free China.\n\nEntering the city, she saw many unfamiliar slogans: \"Long live the invincible Mao Zedong Thought!\" \"Boost our morale, strive to be the best, and rapidly, efficiently, and frugally build socialism.\" At that time, Yang Yingcai knew nothing about the Communist Party's doctrines and class theories. Sometimes she would stop and stare at the bald man depicted in the propaganda posters - so that's what Mao Zedong looked like. Sometimes she'd peer through windows to see portraits of a bearded old man and a middle-aged bald foreigner - were those Marx and Lenin, as mentioned during the Nationalist Revolution?\n\nShe wandered aimlessly through the city, hoping to find a shop that was closing down and willing to transfer its lease, so she could set up her own small clinic. However, to her disappointment, Xi'an under the Communist Party was thriving too vigorously. Everyone seemed like small parts in a massive machine, with no decay or idle spots to be found.\n\nAlthough slightly disheartened by the sight, Yang Yingcai soon lifted her spirits. She remembered her approach in Panzhihua - it seemed she would have to set up a stall in the busy market again. Unlike six years ago, after arriving in Xi'an, she wasn't lost. She had ambitious plans - save up money to open a small clinic, then work in a big hospital as a surgeon, and in the near future, join the Communist Party in their renewed efforts in the anti-Japanese war."
 CPC_Yang_Yingcai_history.16.o: "The future looked bright."
 CPC_Yang_Yingcai_history.17.t: "The Road Away - Hanzhong Construction Period, Xi'an"
 CPC_Yang_Yingcai_history.17.d: "The office was eerily quiet, save for the rustle of carbon paper as Xu Lin shuffled through the documents. A mountain of files lay before him, more than half of them filled with political reviews from 1957 and reports from Yang Yingcai's imprisonment. Xu Lin skipped over these, page after page, unwilling to delve into that period. Finally, only one sheet remained in his hand. It contained information from 1961 onward. These records barely filled half the page. They simply stated that after her release, Yang Yingcai had been recruited as an emergency surgeon by the PLA General Hospital and sent to Qinghai during the conflict. Despite the inadequate conditions, she had saved the lives of several battalion and regiment-level cadres through her exceptional skills.\n\n\"Wasn't she offered a permanent position?\"\n\nA long silence followed, broken by the director's voice. \"She received a commendation for her service in '61 and was even exceptionally promoted to Deputy Director of Surgery at the PLA General Hospital, but her application to join the Party was never approved. Her surgical skills were undeniable, perhaps even the best there, but she was never made Chief Surgeon. You understand why we cannot send her to Hanzhong now.\"\n\nXu Lin sighed deeply, rose, and carefully returned the organized files to their original place. He grappled with a maelstrom of emotions. Was he in any position to judge Yang Yingcai's life? Should he feel pity, anger, or indifference like everyone else? A strong feeling lingered within him: her life story was far more intricate than these few sheets of paper could ever convey. Perhaps their paths would cross again someday..."
 CPC_Yang_Yingcai_history.17.o: "...But now, the matter in Hanzhong is more important."
 TER_RGOC_black_ops_prelude.1.t: "Night Raid"
 TER_RGOC_black_ops_prelude.1.d: "At midnight, Wu Shubin confirmed that no one will come again, then completely on the door, closed the stall. Back to the inner room, opened the thick stack of books, and began the complicated work of checking the accounts. As the pen flew and sketched on the books, the corners of Wu Shubin's mouth curled up slightly.\n\nAt this time, the sound of a large car passing by came from outside, he put away his pen and account book, and peered towards the door. He was just about to sit down again when a sharp knock suddenly came to mind at the door. Wu Shubin subconsciously touched the matching gun on his waist and shouted outwards, \"Who is it, don't you know I'm closed this late?\" . Outside a moment later returned: \"I, Yang Liuqing, delivery came.\" Found that it is the contact, Wu Shubin relieved, but still puzzled, \"so late, what are you doing here?\". . Another voice came from outside the door, \"Things have changed, Mr Gao has new orders for you.\" After hearing this set of explanations, Wu Shubin completely put his heart down. Release the hand holding down the gun, then remove the door panel, ready to let the \"connector\" in.\n\nSuddenly, \"Yang Liuqing\" behind the rush out a few big men, Wu Shubin under the body. \"Chongqing Municipal Public Security Bureau Political Protection Team, do not move!\" . Only then did he realise that he had been betrayed by his contact. Wu Shubin looked at \"Yang Liuqing\" with anger. The latter, however, looked unconcerned, spreading his hands: \"My guy, I'm just trying to stay alive.\"\n\nWu Shubin handcuffed to go out, to the place to look up, actually a car, the car is escorted by four \"colleagues\". There was also a soldier with a live gun standing around, so it turned out that the sound of the previous car came from here. Being escorted to the car, Wu Shubin is the more you think the more angry. Suddenly do not know how, Wu Shubin opened the handcuffs to the police next to the shot, jumped out of the car, and not far away from the \"Yang Liuqing\" another shot, to the safety of the place to run.\n\n\"Want to run?\" The soldiers on the side were about to shoot, the police leading the group called out: \"Zhang, the top wants to live!\"\n\n\"Bang! Bang!\" Two shots passed, Zhang hit Wu Shubin's left leg, Wu Shubin fell to the ground immediately. A group of policemen immediately rushed up and held him down to death, and urgently sent the injured to the hospital."
 TER_RGOC_black_ops_prelude.1.o: "Take back, then under strict guard."
 TER_RGOC_black_ops_prelude.2.t: "Suspect Related Reports"
 TER_RGOC_black_ops_prelude.2.d: "Sichuan Provincial Public Security Department:\n\nIn this operation, the Bureau successfully destroyed the Chongqing secret agent network and captured the main figure Wu Shubin (formerly known as Chen Shaozong, \"Wu Shubin\" was his wife's name) by controlling the pseudo-Republican NSB(National Security Bureau)'s Chongqing contact person \"Yang Liuqing\" (formerly known as Tao Yiming) in advance, and captured the main figure Wu Shubin (formerly known as Chen Shaozong, \"Wu Shubin\" was his wife's name). (formerly known as Chen Shaozong, \"Wu Shubin\" was his wife's name).\n\nTao Yiming was arrested by the Bureau only after he was found and reported by the villagers around the area when part of the acid leaked out of the pool of acid that was used to kill a traitor of the Party who was mistakenly thought to be a high-ranking comrade of the Southwest Bureau last month. According to his account, as it was easy to detect the use of radio in Chongqing, intelligence was passed on through \"contact persons\", and it was only after this Council succeeded in destroying the secret service system in Chongqing by following the clues.\n\nChen Shaozong, who was in charge of the various operations of the NSA in Chongqing, owned a teahouse in Shapingba called \"Eight Immortals House\". This teahouse was the most prosperous in the area due to the fact that it received subsidies from the secret service and was well-funded. Because it agreed to pay on credit, it had a very good reputation and it was very easy to collect all kinds of information. Contacts would bring supplies and instructions to Chen Shaozong in the form of \"deliveries\" and \"meal tickets\", and Chen would pass on the information in the form of \"money\".\n\nChen Shaozong was originally a student of the Linli Special Training Course and had been working under Dai's Junta since graduation, but after Dai committed suicide because of the \"assassination of Chiang\", the Junta was on the verge of collapse, and Chen was kicked out of the Junta and then defected to the Gao Pseudo-Government, and had been working in the Chongqing area since long before the liberation of Sichuan. We've already begun interrogations.\n\nHu Xiliang, head of the Chongqing Public Security Bureau's Political Security Brigade."
 TER_RGOC_black_ops_prelude.2.o: "The intelligence is sufficient and useful."
 TER_RGOC_black_ops_prelude.3.t: "Suspect Related Reports"
 TER_RGOC_black_ops_prelude.3.d: "Name is Wu Shubin, currently single and a native of Chongqing. I used to be a student at Chongqing University. After graduation, I was invited to stay and teach at the university because of my outstanding ability, during which I was discovered by DaiLi and tasked with spying on students. Later, in order to expand the scope of action, the NBIS allocated funds for me to open a teahouse in Shapingba, and at the same time, I used my contacts at the school to collect intelligence.\n\nAfter Chiang Kai-shek was assassinated, himself backed by Chiang Kai-shek's Dai and because of \"defending the leader is ineffective\" was launched as a backstabber, received most of the party state colleagues under siege, our NBIS intelligence in order to defend the victory of the war, in order to fight the Japanese sacrificed so many comrades, Chiang Kai-shek's death, is it not responsible for the CBIS? Why do we have to bear the brunt of the death of Chiang Kai-shek? They even forced Mr Dai to die! The NBIS has also been disbanded! The KMT is truly chilling!\n\nBut fortunately there are still people who appreciate talent in the party-state. The teahouse itself was doing well, so we didn't live on a tight budget, but we did live with our fingers crossed, and around '53, Tao Yiming, a fellow member of the NBIS, approached me, who was on the brink of extinction, and asked me if I'd like to work for Mr Gao. I refused. How could a Chinese work under a Hanjian? How can a Chinese do anything that would harm his fellow countrymen? Then he said that he was only an informer, and that he was only collecting information in Chongqing, and that he would not harm the Chinese for the sake of the Japanese, and pleaded with me many times, so I reluctantly agreed.\n\nI was only buying information in Chongqing, and the main person in charge of all the operations was the liaison person \"Yang Liuqing\", who did no evil, and really had no humanity at all. I was really blind at that time, and I regretted it too much, and I was ashamed of the Chinese people.\n\n\n\n\n\n\n£GFX_CPC_black_ops_Report\n\n\n\n\n"
 TER_RGOC_black_ops_prelude.3.o: "There is not a word of truth in it, and it must be interrogated severely."
 TER_RGOC_black_ops_prelude.4.t: "Suspect Related Reports(2)"
 TER_RGOC_black_ops_prelude.4.d: "Honourable Chairman Mao and the people:\n\nMy real name is Chen Shaozong, a native of Zhejiang Province, with the pseudonym \"Wu Shubin\", and I have a daughter. I was one of the first students in the Provisional Training Class, headed by Dai. After graduation, he was placed in Chongqing University as a military instructor to monitor the students and also collect intelligence through them, and was later allocated funds to open a teahouse to further collect intelligence. What happened after that, as I said before, Chiang was assassinated because of his treachery, NBIS was disbanded, I was almost on the verge of closing down the teahouse because of my ineptitude in running the business, then I found out that my former colleague Tao Yiming was living a rich life, and I was induced to join the NSB, I am sorry to the Chinese people, and I've already realised my mistake.\n\nAfter the liberation of Chongqing, I was asked by the Gao’s bandits to collect information on the chiefs of the Sichuan and Chongqing regions, and to plan for assassinations in an attempt to sabotage the revolution, so I collected lists of the guards and tried to use them as a starting point, but I didn't realise that the targets I contacted all had very high bottom lines, and they didn't waver for a single minute under coercion and temptation. After that, the Gao’s bandits were heartless enough to try to release a virus plague into the liberated areas to fight \"bacteriological warfare\"; they also released poisonous chemicals, which killed the animals and plants that had been sprayed on, and the land that had been sprayed on would be barren of grass later on, and it was my task to investigate the spread of the plague poison and to confirm that the objectives of the various batches had been achieved.\n\nI was looking at it with pain in my heart. Was not expecting them to be so inhumane.\n\nI have come to realise my mistake, that I have long brutalised the people, undermined the revolution, endangered the lives of the Party and the people, and degenerated into a fascist lackey of Chiang and Gao’s bandits. If I had not been captured and educated by the people, I might have caused even greater harm, and I am willing to make a greater contribution to atone for my sins by providing from now on all the information I know about the Gao’s puppet Government."
 TER_RGOC_black_ops_prelude.4.o: "This time the intelligence is of great significance and it is recommended that it be immediately reported to the Central Government."
 CPC_Black_Ops: "Stabbed in the Back"
 CPC_Black_Ops_tt: "Probability of enemy attack: [?CPC_Black_Ops_rate|0R]%/week\nThe §Rprobability of a enemies sabotage§! depends on the current level of §YMilitary Professionalism§!; the higher the level of §YMilitary Professionalism§!, the lower the §Rprobability of a enemies sabotage§!."
 CPC_Black_Ops_desc: "After liberation of Sichuan, the Japanese and Puppets infiltration and sabotage operations have become active again, posing a serious threat to the production work of our Party, our army and our front, and posing a great danger to the safety of the lives and property of the people, so we must unite the people with firm confidence and wage a people's war. Only in this way can we defend the fruits of our hard-won victory."
 TER_RGOC_black_ops.1.t: "either friends or enemies"
 TER_RGOC_black_ops.1.d: "The sweaty bolter gripped the barrel of his rifle in an effort to control his increasingly rapid breathing and pressed his arm against the wound in his lungs as best he could. He didn't know how many men on the other side had been replaced by those bullets just now, but judging by the sounds of gunfire and Cantonese yells echoing all over the mountain, at least one had been wounded.\n\nFive minutes ago, the three of them, Shuanzi, Wang Zhi, and Chen Jun, ran head-on into three other patrolmen at the foot of the mountain, all speaking with a southern accent. In accordance with the usual practice, Wang Zhi pencilled in hand signals and commands to them. But strangely enough, those three people did not react at all, which Shuanzi repeated it in a serious manner. Opposite a small white man awkwardly pinched the military cap, his fingers twisted and twisted and did not make the corresponding command.\n\nIn the next second, both sides suddenly realised that the bullets instantly whizzed through the woods.\n\nShuanzi dragged his bleeding body out to the trees, struggling to search for his comrade's body. He heard the crunching sound of bullets shattering bone as they ran back together just now, but he didn't know who had fallen where, or if the other man was still alive.\n\nIn his consciousness, which was darkening from blood loss, only one thing was certain ......"
 TER_RGOC_black_ops.1.o: "They've infiltrated the border!"
 TER_RGOC_black_ops_flag_1: "It has been ascertained that the §Rpuppet-government§! will from time to time carry out §Rsabotage operations§! against me by means of infiltration of §Rarmed squads§!."
 TER_RGOC_black_ops.2.t: "Diary of a battle"
 TER_RGOC_black_ops.2.d: "[GetDateText], cloudy.\n\nIn the early hours of yesterday morning my reconnaissance post detected red flares from enemy bunker groups Nos. 31 and 35 on the east bank and from the position of high ground No. 32A, and fifteen minutes later the enemy's artillery group launched a large-scale artillery bombardment on a number of my strategic points. My reconnaissance unit observed the day before yesterday that the aforementioned positions had begun to build temporary fortifications and sent the information back in a timely manner, effectively assisting our troops in evacuating and relocating the people, thus resulting in few casualties from this round of artillery shelling, but still causing serious damage to my infrastructure and key transport routes.\n\nThe sudden change in the situation was too late to report to the Military Commission, and our military region immediately mobilised the artillery units within 50 kilometres of the place under attack to carry out counter-attacks, and the large-scale artillery battle between the enemy and us lasted a total of 85 minutes, with instructions from the staff department of the military region to set up artillery units on duty at each of our artillery positions within the next seventy-two hours to give targeted counter-attacks, and to update the artillery units' firing units in accordance with the regularity of this enemy's artillery action."
 TER_RGOC_black_ops.2.o: "Losses from shelling need to be accounted for."
 TER_RGOC_black_ops_flag_2: "It has been ascertained that the §Rpuppet-government§! will from time to time carry out §Rsabotage operations§! against me by §fshelled our base§!."
 TER_RGOC_black_ops.3.t: "Unexpected good news"
 TER_RGOC_black_ops.3.d: "\"Eh, old Kuang quickly come quickly come!\"\n\nDashan's shouting to make the old Kuang laugh, laughter is not without flirtation: \"What, you are not to invite me to dinner?\"\n\"Come on, quickly, or good things to others robbed!\"  Dashan grabbed the old Kwong's hand and ran to the woods.\n\nTo the woods, into the eyes of the hundreds of balloons hanging in different trees, balloons also fishing some canned food and leaflets, and has long been heard of the people here are scrambling to jump up enough to those balloons - accurately said above the canned food.\n\"Heh, you are finally a bit useful.\" Old Kuang, with a bad smile on his face, also joined the crowd in grabbing the balloons - until dusk, the people inside the woods had a good harvest, especially Dashan and Old Kuang.\n\nDashan looked at Lao Kuang proudly, \"These balloons can be used to make clothes, don't throw them away.\"\n\"What about these propaganda leaflets of the Gao's army? Can they also be used to make clothes?\"\n\"Are you stupid? Of course, take them to the government for rewards!\"\n\nOld Kuang scratched his head, feeling that he was still old and dim, not as bright as the young, so he had to look around and say something else: \"By the way, look at how much food we've taken, I don't think we'll have to go hungry for a while, why don't we open a can of food tonight to celebrate?\""
 TER_RGOC_black_ops.3.o: "\"Then let's go faster.\""
 TER_RGOC_black_ops_flag_3: "It has been ascertained that the §Rpuppet-government§! will from time to time carry out §Rsabotage operations§! against me by §Ydropped propaganda leaflets and supplies§!."
 TER_RGOC_black_ops.4.t: "Death from Heaven?"
 TER_RGOC_black_ops.4.d: "The night was low, and it should have been a peaceful night - if one ignored the National Army fighters that were on the runway preparing for takeoff. An instruction came over Song Yanmin's headset, \"Formation One cleared for takeoff.\"\n\"Roger that.\"\n\nAir defence control in Chengdu under the Commie was not perfect, and with the active downtown area scrambling to meet the light emanating from the heights, identifying bombing targets was no mean feat. The escort whistled and swept across the sky in a cruel arc, flashing scarlet lights towards the bombers, Song Yanmin received the signal.\n\n\"Report, formation entering over Chengdu city centre.\" He looked at the button in front of him, with only one thought in his mind: with a single press of the button tens of thousands of people would be killed by his own hands. Tens of thousands of lives pressed into his hands, making his whole body tense up and he could barely breathe. But he was still a soldier after all, his vocation was to obey orders, the right or wrong of the order had nothing to do with him, and it wasn't something he should think about.\n\"Report, the formation is approaching the target.\" In the end, he clenched his teeth and held his breath as he placed his hand on the button and pressed it hard.\n\nBy the lights of Chengdu, he saw several black dots slowly drifting down from the bombing bay, reaching the ground in the scheduled time, but there was no fire, no explosion, and the roar of the engines remained the same. He thought back carefully to the type of bombs he had mounted on his plane, but racked his brain and found no answer.\n\n\"Report, bombing mission completed.\"\n\"Permission to return.\"\n\"Report, I heard no explosions after dropping the ordnance.\"\n\"Please return immediately, over.\"\n\n\"Maybe it's just some leaflets.\" Song Yanmin swung the tail of the aircraft and once again pulled a silky arc towards home."
 TER_RGOC_black_ops.4.o: "What exactly was just drop in?"
 TER_RGOC_black_ops_flag_4: "Chengdu reports that an epidemic of unknown origin has been detected in the urban area, and investigations have confirmed that it was a biological or chemical weapon dropped by KMT reactionaries in order to sabotage the work carried out by the Central Committee of the Party in Sichuan. Twenty-four KMT enemy agents have been arrested in connection with this poisoning incident.\n----------\nIt has been ascertained that the §Rpuppet-government§! will from time to time carry out §Rsabotage operations§! against me by §nbacteriological weapons§!"
 TER_RGOC_black_ops.5.t: "Doctors go to the countryside"
 TER_RGOC_black_ops.5.d: "Yang Yingcai ultimately did not understand why a surgeon would follow a group of agronomy researchers and even veterinarians to Jiange's field research.\n\nThe highway from Hanzhong to Jiange only goes to the county seat of Jiange, while their target village has to go over at least four mountains. A group of people over two big mountains will have spent five hours, seeing the surrounding verdant towering, Yang Yingcai can not help but think of Li Bai's \"difficult road to Shu\", \"it seems to be afraid that they feel no one can help to deal with the wound before I called on.\" She thought as she panted and climbed the mountain.\n\nThe sun was already slanting to the west, but at last, they had reached the last hill, and the group decided to rest on the spot for half an hour. A young faculty member who taught at the Southwest Agricultural College pointed his hand down the hill, \"That's where we're going, it seems to be a little different from the rest of the world.\"\n\nFollowing Yuan Longping's dark arm, Yang Yingcai took a breath of cold air as she looked down the hill to the tiny village. Unlike the normal farmland which was green and verdant or golden and creamy, not to mention the farmland, even the small forests around the village showed a lifeless wilted yellow color, she subconsciously spoke, \"This is not the time for harvesting rice, how come the fields in this place are wilted?\"\n\nYuan Longping scratched his head: \"Said to have been poisoned by enemy planes, there are several other villages similarly stricken, this time we mainly want to take specimens to go back to study, and that is, if the people's livestock are also affected by the plague, comrade veterinarians should help to take a look at the people of the 301 Hospital said that you, Mr. Yang, have been to Sichuan before and will speak about Sichuan. The people in 301 Hospital said that you, Ms. Yang, have been to Sichuan before and that you speak Sichuanese and know some biochemistry, so they recommended you to accompany us to participate in this research.\"\n\nYang Yingcai took a deep breath and nodded solemnly, her thoughts drifted back to ten years ago - she had also set foot in a place where there was not an inch of grass, and had also taken care of a group of homeless children."
 TER_RGOC_black_ops.5.o: "\"I'll do my best to help where I can!\""
 TER_RGOC_black_ops_flag_5: "It has been ascertained that the §Rpuppet-government§! will from time to time carry out §Rsabotage operations§! against me by §ndissemination of toxic agents destroying agricultural land§!."
 TER_RGOC_black_ops.11.t: "Enemies’ armed squads infiltration"
 TER_RGOC_black_ops.11.d: "Public security reports:\n\nDuring the past month, signs of suspicious activity have been detected at various places on our front: accidental fires in grain silos, missing bank deposits and even thefts from armouries, etc., and thanks to the efforts of our investigators, it has now been established that such incidents are the result of infiltration and sabotage by enemy and pseudo-squads, which were killed or captured by our department as a result of a fierce exchange of gunfire with the enemy and pseudo-squads following the trail of the enemy and the pseudo-squads.\n\nA detailed operational report is attached."
 TER_RGOC_black_ops.11.o: "You are to severely interrogate the prisoners, and at the same time calculating the damage they have caused."
 TER_RGOC_black_ops.12.t: "Enemies’ armed squads infiltration"
 TER_RGOC_black_ops.12.d: "Public security reports:\n\nDuring the past month, signs of suspicious activity have been detected at various places on our front: accidental fires in grain silos, missing bank deposits and even thefts from armouries, etc., and thanks to the efforts of our investigators, it has now been established that such incidents are the result of infiltration and sabotage by enemy and pseudo-squads. However, my department did not track the enemy squad,and they appeared to have achieved its objective and returned to the eastern area.\n\nA detailed operational report is attached."
 TER_RGOC_black_ops.12.o: "Summary and calculate our losses."
 TER_RGOC_black_ops.21.t: "Enemies and puppets shelled our base!"
 TER_RGOC_black_ops.21.d: "Frontline troops report:\n\nLast month, the enemy and the hypocrites launched a blatant artillery attack on the important infrastructure of our base areas, as well as on farmland and factories, causing considerable damage to the lives and property of the people of the base areas.\n\nOur commanding comrade made a prompt decision and immediately ordered a return fire. The artillery battle between the two sides lasted for several hours, and our army struck several strategic points of the enemy in accordance with the original plan, and according to the information sent back by underground comrades in the nearby Nationalist Region, the return fire of our army basically achieved the expected effect and effectively deterred the arrogance of the enemy and the pseudo-counterfeits.\n\nA detailed report of operations and losses is attached."
 TER_RGOC_black_ops.21.o: "Let's continue our efforts."
 TER_RGOC_black_ops.22.t: "Enemies and puppets shelled our base!"
 TER_RGOC_black_ops.22.d: "Frontline troops report:\n\nLast month, the enemy and the hypocrites launched a blatant artillery attack on the important infrastructure of our base areas, as well as on farmland and factories, causing serious damage to the lives and property of the people of the base areas.\n\nAs our troops were not sufficiently well fortified in the area of the enemy and pseudo targets, and thus failed to form an effective counterattack, the enemy and pseudo shelling continued for several days.\n\nA detailed report of losses is annexed hereto."
 TER_RGOC_black_ops.22.o: "Summary our losses."
 TER_RGOC_black_ops.31.t: "Enemies and puppets dropped propaganda leaflets and food supplies!"
 TER_RGOC_black_ops.31.d: "Public security reports:\n\nLast month, the enemies dropped balloons, leaflets, canned goods, ammunition, firearms and other items by air on the outskirts of a number of our major cities, causing disturbances among the inhabitants and looting in the vicinity of some of the places where they were dropped, and the public security authorities have dispatched police forces to maintain order and to clear the areas involved.\n\nA detailed report is annexed hereto."
 TER_RGOC_black_ops.31.o: "Destroying all leaflets,\nand collecting weapons unit by unit."
 TER_RGOC_black_ops.41.t: "The enemy disseminate plague by bacteriological weapons"
 TER_RGOC_black_ops.41.d: "Health department reports:\n\nRecently in the main towns along the border found a small-scale outbreak of unexplained plague phenomenon, after investigation suspected by the KMT reactionaries to sabotage the party and front work and put a biological and chemical weapon. In order to avoid disturbing the military spirit and the people's panic, the matter is kept secret for the time being and the situation will not be disclosed to the public, looking forward to further instructions from the Party Central Committee.\n\nA detailed report on the damage is annexed hereto."
 TER_RGOC_black_ops.41.o: "Preparation of medical teams for disease prevention."
 TER_RGOC_black_ops.51.t: "The enemy disseminate chemical agents on the farmland!"
 TER_RGOC_black_ops.51.d: "Agriculture Department Report:\n\nRecently in Shaanxi, Sichuan and Chongqing a number of villages found large areas of crops withered phenomenon, part of the disaster is extremely serious, after investigation is suspected of being by the KMT reactionary factions in order to sabotage the work of the Party and the Front and put a highly toxic agent. In order to avoid disturbing the military as well as the people into a panic, this matter is temporarily confidential not to disclose the situation, look forward to further instructions from the Party Central Committee.\n\nA detailed report on the damage is annexed hereto."
 TER_RGOC_black_ops.51.o: "In the event of a poor harvest, supplies will be collected from the local granaries to provide relief to the affected areas."
 CPC_bookmarks_fake_2: "Prepare for the Congress"
 CPC_bookmarks_fake_2_desc: "Now the Front has taken root and established its presence throughout the west of China, while social progress is made more and more rapidly. The Central Committee of the Party, believing that the whole Front has essentially completed its socialist reforms under the important [CPC.GetLeader] Thought, with socialist institutions already in place, achieving a decisive victory for the general political line. Thus, to complete the urgent task of consolidating these results, the Ninth National Congress must be convened. During a prepatory conference in Xi'an, Chairman [CPC.GetLeader] will lay out the main tasks and guiding ideology of the Congress, planning for deputies of all regions to participate and handling security work."
