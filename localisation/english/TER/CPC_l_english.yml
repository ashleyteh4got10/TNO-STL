 CPC_custom_difficulties_dec_desc: "Note from the upper narrator, Crys7aL_L1nE:\nLooks like §Cyou§! are ready to bring a little bit of §CBlessings of Fate§! to this miserable §SNew Order§!.\nTake a breath, relax. Now you have §Ya month§! to decide the future §CFate§! of this land.\n\nFor those who are §Gnew§! to this predicament for the first time, like learning to ride a bike as a child, there will be a few §Gassisted options§! to help you get used to the game.\nAnd for those of you who have §Cbeen in the game for a while,§! I guess you will enjoy these §xadvanced programs.§!\n\nPS: If you encounter any bugs, feel free to give us feedbacks on our Workshop page or Discord server!"
