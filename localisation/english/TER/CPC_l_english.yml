 CPC_trip_to_Shanxi: "All Things Must Return"
 CPC_trip_to_Shanxi_o1: "Old Affair Resurfaces"
 CPC_trip_to_Shanxi_o1_desc: "The undergroud CPC branch in enemy-occupied areas must be active and rebuild its intelligence organization, and send a special person to contact Comrade Fu Dongju to find out from her the detail of underground activities in Shanxi."
 CPC_trip_to_Shanxi_o2: "Night Talk in North Shanxi"
 CPC_trip_to_Shanxi_o2_desc: "Fu Zuoyi is already dying, Fu Dongju to the Central Committee to ensure that within two weeks to contact the anti-Japanese patriots within Shanxi, in the name of the high-level meeting from which to take his place."
 CPC_trip_to_Shanxi_o3: "Strenuous Fording of the Yellow River"
 CPC_trip_to_Shanxi_o3_desc: "Fu Zuoyi's early death made the situation in Shanxi more urgent and complicated, in order to take more time for Comrade Fu Dongju, the Central Committee decided to plan a feint mission, sending agents into the Luliang area to mobilize the masses, creating the illusion of \"rampant communist bandits\"."
 CPC_trip_to_Shanxi_o4: "Send a Tiger to the Mountain"
 CPC_trip_to_Shanxi_o4_desc: "Comrade Fu Dongju contacted Gao Shuxun and Huang Qiaosong, two patriotic generals who had cooperated deeply with our, and who would take advantage of the momentum of the unstable border in Shanxi to lead their troops out en masse to Datong in northern Shanxi, where they would establish an anti-Japanese democratic regime to openly confront the Shanxi cliques."
 CPC_trip_to_Shanxi_o5: "War break"
 CPC_trip_to_Shanxi_o5_desc: "Liang Dunhou will not condone rebellions, and now that he has mobilized his army to invade the democratic regime in northern Shanxi, we must continue to mobilize the people of Shanxi to comprehensively undermine Liang Dunhou's war preparation plans from the countryside to the cities."
 CPC_trip_to_Shanxi_o6: "Peace or War"
 CPC_trip_to_Shanxi_o6_desc: "Thanks to the tireless efforts of the Front, the clique Liang Dunhou is finally willing to sit at the negotiating table and talk with us properly about the political status of Datong, and we will never give up any of our friends."
 CPC_DAT_rebuild_army_tt: "Transfer the §YNorth Shanxi National Defence Front§! force to §YPLA§!"
 CPC_trip_to_Shanxi_o7: "Establish coal transportation turrel"
 CPC_trip_to_India: "Ask to the West"
 CPC_trip_to_India_o1: "Contact with the northern \"red\" states"
 CPC_trip_to_India_o1_desc: "Some of the independent states in northern India are being run by Indian communists, and our diplomats can begin with these comrades and gradually deepen their dealings with the Free Indian Government."
 CPC_trip_to_India_o2: "Contact with free Indian magistrates"
 CPC_trip_to_India_o2_desc: "Through the facilitation and mediation of our Indian comrades, we were able to hold a small consultation with the highest local governor of India to express the willingness of the Front to stand with free India against the Japanese invaders."
 CPC_trip_to_India_o3: "Secret visit to Calcutta"
 CPC_trip_to_India_o3_desc: "Due to the close surveillance by the Japanese, the Sino-Indian talks had to be kept absolutely secret from the outside world. The Free Indian government had approved this secret diplomatic operation with China, and our diplomats were finally allowed to communicate with the Free Indian central government."
 CPC_trip_to_India_o4: "Reach some consensus"
 CPC_trip_to_India_o4_desc: "On the surface, the Indian negotiators did not deny our view that China and India were both victims of Japanese aggression, but they still explicitly and implicitly expressed their inner monologue of approval. In the face of the grave international situation, we fully understand the Indian side's plight of not being able to spill the beans. Now that we have gauged the attitude of the government of free India, let our personnel make frank offers and ride out the storm."
 CPC_trip_to_India_o5: "Secret Meeting in Delhi"
 CPC_trip_to_India_o5_desc: "Since Free India is still a member of the Co-Prosperity Sphere and is under a mutual embargo against the United States, at our request, Free India has secretly established contact with the Republic of India to prepare for the safe and secret escort of our delegates to Delhi.\n\nThere, we will not only have official access to the U.S. envoy but also be able to make some diplomatic efforts for the peaceful reunification of the two Indias."
