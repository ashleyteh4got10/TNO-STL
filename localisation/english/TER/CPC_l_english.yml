 CPC_funni.2.t: "Business is business"
 CPC_funni.2.d: "Citizens rushed to purchase the blue, red, and gold-starred flags of the National Defense Front, preparing to cheer for the heroes who liberated their city. Their faces beamed with joy, and they brimmed with excitement for the freedom and liberation to come. Meanwhile, in a certain mansion in Taiwan, unscrupulous merchant Huo Ziwen also wore a smug smile, pleased with himself.\n\nBorn into wealth, Huo Ziwen had studied abroad in Japan a few years earlier, majoring in economics. Perhaps due to his merchant upbringing, Huo exhibited remarkable talent in economics—not only excelling in theory but also amassing extensive practical experience. To support himself while avoiding menial jobs, he turned to stock trading. His academic expertise and business acumen allowed him to dominate the stock market, setting a trend among his peers: anyone who followed Huo’s stock picks was guaranteed to profit.\n\nBut during the Yasuda Crisis, Huo faced financial disaster. To mitigate his mounting losses, he sold off all his stocks and decided to wait for the market to stabilize. Unfortunately, this attracted the attention of the Tokkō police. Acting on government orders, the Tokkō began arresting individuals for \"illegal\" stock dumping. They dared not touch the major zaibatsu families but targeted ordinary traders instead, including Huo. His so-called \"illegal profits\" were confiscated, and he was deported back to China.\n\nBack home, Huo managed to recover quickly thanks to his family’s wealth. With familial support, his own sharp mind, and well-placed political connections, he began trading again in Wuhan, exploiting information asymmetries to buy low and sell high, amassing another fortune. When the uprising broke out in Wuhan, the Liberation Army surged eastward through Tongguan, and the Nationalist government issued its Emergency Suppression Directive. Huo, calm and composed, made his move. He first called his family, instructing them to retreat to Taiwan, then placed an order for two batches of flags—one featuring the Blue Sky with a White Sun and the other displaying the blue, red, and gold-starred flag of the National Defense Front.\n\nAs news of the Liberation Army’s unstoppable advance reached Wuhan, Huo began selling the blue-red-gold-starred flags to shopkeepers, who then resold them to the eager public. This endeavor earned him yet another fortune. He then bribed members of the local militia guarding the checkpoints, taking advantage of the chaotic situation to escape Wuhan with his hoarded gold and silver.\n\nWhen Huo reached the Guangdong State border, he encountered a large, panic-stricken crowd waiting at the customs gate. The Guangdong State troops stationed there shouted at the crowd to maintain order, but the chaos persisted as desperate people tried to push through the blockade. Observing some individuals engaging in quiet conversations with customs officials and subsequently passing through, Huo decided to try his luck. He retrieved his passport, slipped 30,000 yen between its pages, and pushed his way through the throng to hand it to an officer.\n\nThe customs officer inspected the passport but spent more time counting the yen. Eyeing Huo, the officer’s gaze lingered. Huo, feeling the tension, awkwardly pulled a Blue Sky with a White Sun flag from his coat pocket and added his Kuomintang membership card to the mix. The officer discreetly pocketed the bribe, returned the documents, and waved Huo through.\n\n\"Haii!\" he exclaimed in jubilant Japanese, quickening his steps past the checkpoint. But Guangdong State wasn’t his final destination. He continued southward, eventually arriving in Hong Kong. After a similar round of negotiations, he boarded a cargo ship bound for Taiwan. Relieved and triumphant, Huo reunited with his family in Taiwan. Once settled, he proudly erected a Hinomaru flag in front of his mansion."
 CPC_funni.2.o: "Money knows no bounds"
