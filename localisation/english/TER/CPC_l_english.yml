 CPC_ira: "Chinese Advisors"
 CPC_broken_united_front: "The Broken United Front"
 CPC_broken_united_front_desc: "The National Defence Front (NDF) was in a steady state of division at its inception, a disease brought from the womb, for two reasons when examined in detail:\nOne, the CPC in 1947 was still weak compared to the KMT in 1937, and even if the case for resisting the Japanese was strong enough, it did not have the absolute power to unite the other allies around itself; and two, the Communist Party could not fully embrace the political program required by the big capitalists, landowners, and warlords-unless it became the second KMT.\n\n§RThis place is good, but can't stay. Someone leaves, nothing left.§!"
 CPC_heavy_blockade: "Japanese Economic Blockade"
 CPC_heavy_blockade_desc: "After the IJA tried to forcibly cross the Yellow River and failed to invade northern Shaanxi in 1946, Ningji Okamura, together with the traitor Yan Xishan, built a fortress blockade on the bank of the Yellow River at the Shanxi-Shaanxi border, completely isolating the free communication between the front and the eastern region, which caused us no small trouble.\n\n§RIf we cannot walk through the deep ravines of Northwest China, we will be going to die slighty.§!"
 CPC_broken_China: "A Divided Nation"
 CPC_broken_China_desc: "The Front spent fifteen years in relative peace, but our legitimacy is diminishing with each passing day, due to a combination of a deteriorating situation in the country and constant setbacks in development. The people in the east are gradually forgetting us, while the people in the northwest are beginning to question the Communist Party and socialism.\n\nThat China is still \"our\" China is a topic that cannot be questioned, but Gao Zongwu's popularity is somehow catching up with the Front. Time is running out, and only the elimination of the pseudo-regime will completely reverse our situation."
 CPC_experts_from_ussr: "Soviet Experts"
 CPC_experts_from_ussr_desc: "After the collapse of the Soviet Union, we welcomed a number of exiled Soviet scientists. These individuals, once at the forefront of their fields in the global scientific community, have now dedicated themselves to the revolutionary cause of our Party. Let us extend our highest regards to these warriors of internationalism."
 CPC_experts_from_ussr_and_jap: "Northwest Defence Research Institute"
 CPC_experts_from_ussr_and_jap_desc: "After reforming and hosting some of the Japanese experts, our scientific research strength has been enhanced again. Now we integrate and coordinate personnel relations between foreign technicians and form the Northwest Defence Research Institute. Japanese specialists are to work together with Soviet experts and contribute their share to the scientific research development of the front."
 CPC_experts_from_everywhere: "Northwest Defence Research Institute"
 CPC_experts_from_everywhere_desc: "After a few years, the Institute welcomed a new group of people - U.S. experts from across the ocean. When they first arrived, they were displeased by the modest conditions of the Institute, but surprised by the \"international\" composition of the staff. The Chinese, Americans, Russians, and Japanese working together is clearly something special, and the research level of the front is about to go to the next level!"
 CPC_military_advisor_from_USA: "U.S. Army Advisor"
 CPC_Construction_Corps: "Establishing of the Construction Corps(CC) is a form of organizational management that falls between complete military control and civilian governance, and it serves to both promote production and construction as well as strengthen national defense. Considering that it is difficult to quickly establish effective governing units in remote areas where ethnic minorities reside, the CC becomes a convenient choice. It can efficiently execute instructions issued by the central government, and promptly handle various emergencies, thus relieving the burden on the central government."
