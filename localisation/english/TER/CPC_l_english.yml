 CPC_PLA_issue_1: "Lone Star in the Darkness"
 CPC_PLA_issue_1_tt: "£CPC_idea_texticon_PLA_dummy_1\n\n\n£CPC_texticon §RParty Organ Consolidation§!\nDaily Political Power Gain: [?CPC.CPC_PLA_political_power_gain|2+]\nDivision Recovery Rate: [?CPC.CPC_PLA_army_org_regain|2+=%]\nMilitary Professionalism Monthly Change: [?CPC.CPC_PLA_army_professionalism_monthly_rate|2+]\nDivision Organization: [?CPC.CPC_PLA_army_morale_factor|2+=%]\n\n£TER_texticon_PLA §RCommand Structure§!\nDaily Command Power Gain: [?CPC.CPC_PLA_command_power_gain|1+]\nCommand Power Max: [?CPC.CPC_PLA_max_command_power|1+]\nDivision Experience Gain: [?CPC.CPC_PLA_experience_gain_army_unit_factor|2+=%]\nDivision Experience Loss: [?CPC.CPC_PLA_experience_loss_factor|2-=%]\nDivision Combat Width: [?CPC.CPC_PLA_combat_width_factor|2-=%]\nReinforce Rate: [?CPC.CPC_PLA_land_reinforce_rate|2+=%]\n\n£TER_texticon_NDF §REquipment Upkeep§!\nDivision Attack & Defence: [?CPC.CPC_PLA_army_ad_factor|2+=%]\nDivision Speed: [?CPC.CPC_PLA_army_speed_factor|2+=%]\nSupply Efficiency: [?CPC.CPC_PLA_supply_consumption_factor|2+=%]\nSpecial Forces Attack & Defence: [?CPC.CPC_PLA_breakthrough_factor|2+=%]\nSpecial Forces Cap: [?CPC.CPC_PLA_SP_amount|0+]\n\n[CPC.GetFlag]§mNorthwest Defence Research Institute§!\nAnnual Expenditure on Scientific Research Projects: [?CPC.CPC_NADT_modifier_misc_costs_modifier|-3=]B\nResearch Speed: [?CPC.CPC_NADT_research_speed_factor|+2=%]\nAll Aircraft Production Cost: [?CPC.CPC_PLAAF_dummy_num|-=%]\nInfantry Equipment Production Cost: [?CPC.CPC_PLA_inf_equip_dummy_num|-=%]\nInfantry Equipment Reliability: [?CPC.CPC_PLA_inf_equip_dummy_num|+=%]"
 CPC_PLA_issue_1_desc: "In this endless night, one lonely star supports the Big Dipper.\n\nThe red flag has stood tall in the Northwest for fifteen years, with the steadfast support of the People's Liberation Army restoring the backbone of the National Defense Front as they pledge their lives to defend Free China's last refuge. But endless preparation for a far-off war has worn down the optimism of the PLA's fighters; our army's confidence has reached a state of crisis. There is a shortage of weapons and supplies, a reduction in ideology, a decline in tactical skill, a lag in military theory...Only decisive action can reverse this situation and save the PLA from its fall, developing it into a heroic and elite army capable of resisting the foreign invaders' iron boots!"
 CPC_PLA_issue_2: "To Tame the Blue Dragon"
 CPC_PLA_issue_2_tt: "£CPC_idea_texticon_PLA_dummy_2\n\n\n£CPC_texticon §RParty Organ Consolidation§!\nDaily Political Power Gain: [?CPC.CPC_PLA_political_power_gain|2+]\nDivision Recovery Rate: [?CPC.CPC_PLA_army_org_regain|2+=%]\nMilitary Professionalism Monthly Change: [?CPC.CPC_PLA_army_professionalism_monthly_rate|2+]\nDivision Organization: [?CPC.CPC_PLA_army_morale_factor|2+=%]\n\n£TER_texticon_PLA §RCommand Structure§!\nDaily Command Power Gain: [?CPC.CPC_PLA_command_power_gain|1+]\nCommand Power Max: [?CPC.CPC_PLA_max_command_power|1+]\nDivision Experience Gain: [?CPC.CPC_PLA_experience_gain_army_unit_factor|2+=%]\nDivision Experience Loss: [?CPC.CPC_PLA_experience_loss_factor|2-=%]\nDivision Combat Width: [?CPC.CPC_PLA_combat_width_factor|2-=%]\nReinforce Rate: [?CPC.CPC_PLA_land_reinforce_rate|2+=%]\n\n£TER_texticon_NDF §REquipment Upkeep§!\nDivision Attack & Defence: [?CPC.CPC_PLA_army_ad_factor|2+=%]\nDivision Speed: [?CPC.CPC_PLA_army_speed_factor|2+=%]\nSupply Efficiency: [?CPC.CPC_PLA_supply_consumption_factor|2+=%]\nSpecial Forces Attack & Defence: [?CPC.CPC_PLA_breakthrough_factor|2+=%]\nSpecial Forces Cap: [?CPC.CPC_PLA_SP_amount|0+]\n\n[CPC.GetFlag]§mNorthwest Defence Research Institute§!\nAnnual Expenditure on Scientific Research Projects: [?CPC.CPC_NADT_modifier_misc_costs_modifier|-3=]B\nResearch Speed: [?CPC.CPC_NADT_research_speed_factor|+2=%]\nAll Aircraft Production Cost: [?CPC.CPC_PLAAF_dummy_num|-=%]\nInfantry Equipment Production Cost: [?CPC.CPC_PLA_inf_equip_dummy_num|-=%]\nInfantry Equipment Reliability: [?CPC.CPC_PLA_inf_equip_dummy_num|+=%]"
 CPC_PLA_issue_2_desc: "With experience gained in the conflicts of the sixties, our army has completely swept away its rot, particularly following the completion of military reforms. The People's Liberation Army is now on the way to excellent organization, morale, and combat capabilities, taking great strides towards becoming a truly modern army.\n\nUnder the Party's absolute leadership, the PLA's command structures have been centralized, their ideology and class consciousness elevated, ready to completely fulfill the Central Committee's revolutionary path. With the support of the masses, they will definitely accomplish the liberation of all China! Rifles firm in hand, they will annihilate the Japanese imperialist invaders' illegal occupation of Chinese land. Just as Chairman Mao once said: Elegant lance in hand, I dare to strike the Blue Dragon!"
