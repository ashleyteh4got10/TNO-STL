 CPC_9th_congress.0.t: "Zhou Enlai to Deng Yingchao"
 CPC_9th_congress.0.d: "Chao:\n\nCame to Hanzhong to recuperate has been more than a month, and you through a few phone calls, but did not give you a pen to write a letter in the heart of the sudden feeling of solidarity.\n\nThe doctor told me that my heart function is still not good, the chairman also sympathized with my condition, and told me that I could be local office. But I thought twice and decided to leave the hospital early and return to Xi'an to work among my comrades.\n\nThere are some pains I can only tell you. Last night I was haunted by a nightmare that my closest relatives and loved ones had abandoned me, and that everyone was afraid to look at me in the worst possible light. I was thus helpless and coldly looked upon for two-quarters of an hour before I awoke, and when I did I soaked my pillowcase and bedclothes with tears and cold sweat. The only comfort I felt was that your warm figure dispelled my last nightmare and woke me up from the abyss. But this dream was a strange phenomenon not seen for more than a decade, perhaps because I was anxious about spending too much of my precious time recuperating from my illness.\n\nAs I write to you, I have come out of my uneasiness and look to you for reassurance. The thought of the infinite liberating endeavors awaiting me has swept away all loss.\n\nAll the best to you, too.\n\nZhou Enlai\n\nApril 23rd"
 CPC_9th_congress.0.o: "With a few begonia petals for peace of mind."
 CPC_9th_congress.1.t: "The Day of labors"
 CPC_9th_congress.1.d: "The colorful floats and parade slowly passed in front of Mao Zedong and Liu Shaoqi, and all of them could not help but be immersed in the joy. Compared to twenty years ago, Northwest China was no longer isolated and weak.\n\nBut Mao's world was falling apart, and Kang Sheng's sudden hospitalization had dealt him a severe blow. Time had taken so much away from him, but his worries about the future remained as unchanged as they had been ten years earlier, and he was preoccupied throughout, his dashing demeanor gone from his conversations with Liu Shaoqi.\n\nLiu Shaoqi said as little as he had in the past few years. The actual work was in his hands, and he had to show respect for the leader, just as the other Politburo members did, merely echoing his words.\n\n\"A few days ago, I visited the outskirts of Xi'an. A few dozen meters from me stood a child pointing at me and shouting in a particularly loud voice: 'Who is this man!' At that time I was all over the place, I can't tell you.\"\n\n\"It's quite normal, what do kids know.\"\n\n\"Do you think people on the east side know who I am?\"\n\n\"As soon as you're an adult you know.\"\n\n\"Kang Sheng is sick with cancer and the doctor says there's no hope of a cure.\"\n\n\"We all have this day.\" Hearing this, Mao's face became even more unpleasant.\n\n\"It's been five years since the last meeting. All kinds of work, bumps, and bruises have come and gone, so it's time for us to have a meeting.\"\n\nLiu Shaoqi regarded the opening of a conference only as a matter of procedure, nothing so-called in itself. Five years of development have come to an end, what should have been done has been done, new goals are crying out to be achieved, another meeting should be held: \"You set this chairman.\"\n\n\"Since I decide,\" Mao turned away without waiting for the float to finish, and hurriedly gave instructions to his secretary, Guan Feng, \"to telegraph to Zhou Enlai that the Central Committee has asked him to come back.\""
 CPC_9th_congress.1.o: "\"I'll be right there.\""
 CPC_9th_congress.2.t: "A night of work"
 CPC_9th_congress.2.d: "With a writing desk, two poplar chairs, a bright green-covered lamp, plus a stack of half-meter-high documents, this is the office of Zhou Enlai bit Xi'an. The room is very large, which is to facilitate the reception of cadres, but more seemingly small furnishings inside the house, the house path empty.\n\nThe night is very late, the moon is high, the office dares not open the lights, only an apricot-sized lamp to light up the writing desk, mosquitoes like a bomber raiding through. The office lit up mosquito incense, but the anti-shock tape sealed the window can not breathe, the smoke-choked Zhou Enlai is reviewing documents from time to time lightly coughing a couple of times.\n\n\"Call He from the duty room.\"\n\nZhou Enlai greeted the clerk He sat across the writing desk, accompanied by reviewing the draft minutes of the meeting, the way, and the consultation. Zhou Enlai reviewed one sentence at a time, and after reading one sentence, he used a pen to draw a small circle after that sentence. He did not browse once and forget it, but while reading and thinking, sometimes stopping to think about it, sometimes asking Xiao He a sentence or two. The night was very quiet, and it took quite a long time before Zhou Enlai finished reviewing it and handed the manuscript to Xiao He.\n\n\"Tomorrow morning to the printing room, remember the provincial cadres one copy.\"\n\nThe clock struck 3:00 and the night was still deep. The duty room attendant sent two cups of black tea that must be prepared when staying up late, plus a plate of peanuts, placed on the writing desk. Zhou Enlai asked the waiter to pour himself another cup, and three people together to drink tea and eat peanuts. Twisting a peanut, two fingers uncontrollably crushed, Zhou Enlai muttered in a low voice: \"I ...... I can't bite it a bit.\" The waiter and Xiao looked at each other and each understood something.\n\nIf you sleep now, you must not be in the morning, and Zhou Enlai has a meeting at seven. So the three people intentionally small sips of tea, but the peanuts ate clean early. The waiter's cup of tea was the first to the bottom, he saw Zhou Enlai sleepy, stood up and the Premier said: \"I'll let the kitchen prepare some supper.\" Zhou Enlai did not object, the waiter took away the empty plates and cups and left, without taking the door. Xiao He also got up: \"Premier, I'm going to deliver the documents, I guess I'll be back by five o'clock.\" Zhou Enlai nodded: \"Go ahead and have breakfast together when you return.\"\n\n\"Yes, Sir.\""
 CPC_9th_congress.2.o: "(Clock)Dang-Dang-Dang-Dang"
 CPC_9th_congress.3.t: "Yan'an Inspection (1)"
 CPC_9th_congress.3.d: "\"We have eaten the millet in the northwest for more than twenty years, and the Yan'an that smells the best.\"\n\n\"The Premier is a southerner, I will inform the kitchen immediately if there is anything uncomfortable in the meal.\"\n\n\"Used to it, used to it, just follow your usual.\"\n\nThe first half of the day's inspection was soon over, and Zhou Enlai and a group of local party secretaries rushed back to the small cafeteria of Yan'an City Hall in a minibus for lunch. Zhou Enlai understood that the meal had been arranged for him by the dietician and the local mini-cafeteria. He still tried his best to save face for the leading cadres in the car who thought they were safe and sound, not to irritate them for seeing things they shouldn't see during their inspection.\n\nThe waiter pushed open the small door of the cafeteria, bright and translucent under the large window set up two round tables and a dozen pairs of dishes, meals have been served to ensure that a line of people to the ground to start eating. A plate of staple food, half of the rolls and half of the bun, are white flour; a plate of cumin lamb, salt material used very thin; a plate of sauce casserole fish, sauce light; vegetarian dishes are sweet and sour shredded potatoes and cold cucumber green pepper shreds; near the door on the cupboard squatting a steaming pot of lump soup. Looking at a table full of dishes, Zhou Enlai's heart like a pincer kept pinching him, even if the accompanying leader's smiling face can not be pleased to sit down. He gestured to the group to sit down and eat first."
 CPC_9th_congress.3.o: "(Next Page)"
 CPC_9th_congress.4.t: "Yan'an Inspection (2)"
 CPC_9th_congress.4.d: "\"We have to liberate the whole country in the future, the economic construction of the base areas cannot be slackened, and the trust of the people in us cannot be wasted.\"\n\nAll the people at the table were just eating, and no one dared to answer the words that Zhou Enlai threw out.\n\nZhou Enlai could not hold back any longer, and the words repressed in his heart finally flowed out like a machine gun.\n\n\"Secretary Jin told me that Yan'an is poor in the north and rich in the south, but today I went to Ganquan, and the situation is not optimistic. A glance at the village shows that some of the masses have no food or clothes to wear, and this is still the situation in the 'rich county' as you call it.\"\n\nZhou Enlai shook his head very painfully, backhanded a roll from the primary food plate, and took it trembling to each cadre who buried his head in the hard work of eating in front of his eyes. The sound of utensils chiming slowly stopped, and the hands that were pinching the food returned to their original positions, and the small canteen was unusually quiet. \"Wow,\" a county party secretary shivered, the chopsticks on the rim of the bowl were touched to the ground, but he could not be bothered to pick them up.\n\n\"The secretary of Ansai said that the road to his place has to be maintained today, and advised me not to go to inspect it this afternoon, so as to save the car from making a trip for nothing. I accept your kindness, I'll tell everyone that I'm not going anywhere this afternoon, just sit here and do not move!\"\n\nZhou Enlai's speech is getting louder and louder, so much so that even he realized that he hurriedly took a deep breath to suppress his belly full of fire, and ruthlessly used a consultative tone to this room of people to make a request.\n\n\"Put down the baggage in your heart, the central government will not blame you, nor will it make things difficult for you. Only if you are honest with me, I can solve the problem. I give you one afternoon, the production, life problems encountered, seriously type a report to me. Okay?\""
 CPC_9th_congress.4.o: "Keep eating."
 CPC_9th_congress.5.t: "Request for sick leave"
 CPC_9th_congress.5.d: "\"Zhuo Lin, why didn't Comrade Xiaoping come to the meeting today?\"\n\"Premier, Deng Xiaoping broke his leg in the past two days and couldn't walk, so I'm really sorry for not being able to talk to you in time.\"\n\"For what?\"\n\"Premier, I asked Deng Xiaoping to speak to you personally, and he asked me for a microphone.\"\n\"Okay.\"\n\n\"Premier Zhou, I'm really sorry, I delayed this meeting for personal reasons, I really should make a review.\"\n\"Why are you sick?\"\n\"Premier, did Li Xiannian speak at the meeting? I want to speak of things in advance to him\"\n\"He did.\"\n\"Good.\"\n\"Then why did you fall?\"\n\"It's not easy to talk. Two days ago, I went to the activity room to play billiards and fell off the billiard table and dislocated my thigh. Dr. Fu can testify.\"\n\"Oh so, then you have to make up sick leave. You have two more meetings in the back and must take leave in advance.\"\n\"Yes, yes, Premier, definitely make up.\""
 CPC_9th_congress.5.o: "The review doesn't need to be made public."
 CPC_9th_congress.6.t: "Future, again"
 CPC_9th_congress.6.d: "\"...... Suggest holding a briefing on reaching friendly relations between China and the U.S. in five years, inviting the heads of central ministries and commissions and major military regions to attend and updating them on the situation concerning the U.S. ...... \"\n\nSeeing that Ye Qun came into the living room with something to say, Secretary Yu, who was reading the notice for Lin Biao, stopped his voice and got up and left silently after Ye Qun signaled him to go out. The company's main business is to provide a wide range of products and services to the market.\n\nAs expected, Ye Qun complained at the outset: \"No matter what meeting is held, is it not always Zhou Enlai who makes a splash?\"\n\nHe craned his neck and stood up from the side of Ye Qun and began to pace around the room, saying slowly as he walked, \"He's not going to the meeting, are you?\"\n\n\"I said how come you have no reaction at all, the Ministry of Foreign Trade has got on board with the Americans.\"\n\n\"Zhou Enlai and the Americans to deal with sooner or later will be unlucky.\"\n\n\"I'm not talking about that, I mean, why don't you help your son find an errand from the inside.\"\n\nHearing this, Lin Biao directly froze: \"I thought you ......\"\n\n\"I have thought about it, the United States diplomatic matter, can not let Zhou Enlai a person take all the credit, our family must also have a share. Your son is not good at learning English? Directly to the Ministry of Foreign Trade as a diplomat, when the time to talk about what is counted for him. Isn't this a good thing to add glory and color? In the future, if the liberation, we can also go to the United States with our son, how good.\"\n\nYe Qun's words exceeded the sum of information Lin Biao had received in the past, and he rubbed his dry, thin chin, his head dizzy with a thousand questions.\n\nWill his own son's diplomacy work? What if it doesn't work? If not, you can practice, and let Zhou Enlai personally lead, success is all mine. In the future to fight a big war, the army is not a place of permanent peace, diplomacy is a good place to go, can not but must become!"
 CPC_9th_congress.6.o: "Twenty-somethings was held up as diplomats."
 CPC_9th_congress.7.t: "No Country for Old Men"
 CPC_9th_congress.7.d: "The bright and flashing spotlights were a great source of excitement in the brains of the delegates. People's faces were smiling, their hands were clapping, and they were shouting like a tsunami to celebrate the great victory of the front in these three years.\n\nZhou Enlai sat on the delegates' table, seemingly as secure as the future of the front. For a moment, he suddenly felt that everything around him was unfamiliar, the lights were so blinding, and Xie Ding who was speaking beside him did not know who he was. He looked to his left and right, overwhelmed by the clamor in all directions, his script trembling uncontrollably in his hands.\n\n\"Long live the Chinese Communist Party!\"\n\nThe sudden slogan frightened Zhou Enlai, who was wandering in a trance, and his body was electrocuted, and his heart could not stop beating suddenly. He vaguely remembered that he had to dye his hair, dye it black. Not true! Or wear a head covering a little better, the old look can not meet people.\n\nThinking of this, the head with white hair seemed like a thousand pounds, with the light torso tilted to the left. Chen Yi noticed the difference, and rushed to hold, while softly calling out: \"Premier, what happened to you?\"\n\n\"Premier, it's your turn.\" Lin Biao did not twist his face squarely, both arms crossed on the conference table, with a programmed smile on his face to remind.\n\nZhou Enlai's eyes were staring straight ahead, the anger on his face was gradually drained, leaving him only mute and stiff, his mouth rambling on and on about something. He stood up with two bamboo-like legs, the speech had fallen out of his hands, but just now he at least remembered what he should do. The room had fallen silent, the eyes of hundreds of delegates were directed at him, the unprecedented pressure was added to his body. This made his teeth close, breathing more and more ragged, without saying a word and the delegates confronted, until like a roll-up collapsed with a crash."
 CPC_9th_congress.7.o: "Call the DOCTOR, HURRY UP!"
 CPC_9th_congress.8.t: "A right-wing statement"
 CPC_9th_congress.8.d: "Many of those middle-level cadres living in the county have the name of the Communist Party but not the reality of the Communist Party, the central government issued instructions without seeking to understand the arbitrary instructions, the official-style articles into an imperial sword to oppress the masses, just like a small feudal dictator. In the past, I always believed that the central government was not effective in supervision, and only needed to send more working groups. But gradually the task force became bloated, and then it became integrated with local cadres, so that I gradually realized the crux of the Party's governance crisis - the people must be allowed to have a say.\n\nI was surprised that not only the cadres' right to speak was supreme in crisis management, but even the ordinary people were basically unable to intervene in everyday events. Maybe there is a speaking part in the work meeting, but this is after the task sent down from above, there is a guide, mandatory to open the discussion, the ordinary masses lost the initiative, reduced to a tool of government operation. The loss of good feedback channels, party members into the government is the time to disassociate from the people, then the occurrence of such a large number of cadres of accidents, it can basically be explained: it is not the party discipline is not firm or individual moral corruption, the environment has made however.\n\n(Some scribbled pencils)\n\n(Torn out below)"
 CPC_9th_congress.8.o: "Torn out below"
 CPC_9th_congress.9.t: "Everything changed"
 CPC_9th_congress.9.d: "\"Chinese people ...... forget about not just saying Chinese people, let's just say people. After the whole meeting I realised that people's endurance is infinite, even if they starve to death, they will not rebel.\"\n\nThe working meeting is over, cadres at all levels have left the field to accompany the evening heat. Chen Yun shook his head and mysteriously approached Gao Gang and issued these theological remarks. The whole remark puzzled Gao Gang, and he could not help tapping his shoulder and calling out to Chen Yun, \"You're a bastard for saying that.\"\n\nChen Yun heard Gao Gang's rebuke, not angry and not annoyed, turned back and smiled a little: \"Think about it again, who is the bigger jerk between us?\"\n\nGao Gang was stunned by this question, and carefully played with this seemingly inexplicable rejoinder. A green leaf gently fell, quietly rolled down on the steps. Recalling the darkest moment of his life ten years ago, and then look at Chen Yun's meaningful eyes, Gao Gang snorted and laughed: \"Tell me what you are thinking.\"\n\n\"I think that the masses love you because they don't understand. But the Great Leap Forward, you, you're the number one big bastard, and all the people around you know what you're all about, and they all want to eat you alive.\"\n\n\"Go on.\"\n\n\"Zhou Enlai is not the face of longevity; Chairman Mao is also getting old, his body is getting worse and worse, and this brain is also ...... \" Chen Yun pressed his voice to a very low level and pointed to his own head with his finger, \"When they get to heaven later, if you fall on hard times in the future, who will still be willing to fish for you?\"\n\n\"Your question is too strange.\"\n\n\"Conson? He already has liver cancer. Bo Yibo? He was the one who wanted to put you to death in the first place.\"\n\n\"You want me to find Deng Xiaoping?\"\n\n\"He also contributed back then, you have to repay him.\"\n\nIn fact, Gao Gang has long understood Chen Yun's intentions, he tried several times to move out of the \"chauvinistic\" theory to refute, but in the face of the obvious truth is simply no power - to be honest, through a little stupid.\n\nHelplessness flooded Gao Gang's shoulders, he only felt weak, two eyes look at the sky and sighed heavily: "
 CPC_9th_congress.9.o: "\"Fine, I know.\""
 CPC_9th_congress.10.t: "Rural Investigation"
 CPC_9th_congress.10.d: "\"...... If you can not afford to pay the public grain, you will be branded as 'feudal peasants' 'against socialism', after the criticism meeting secretary recruited a large group of people to your Home to dig three feet to search ah, the stove eye open, the water tank overturned, even the quilt and pillow are to you to tear, to see if you hide food.\"\n\n\"Why didn't the villagers report the incident to the police after the forced grain incident?\"\n\"Reported? Hmph!\" A sneer from the farmer's grandfather cut a dripping wound in Xiujuan's heart. Without answering the question directly, the grandfather first asked rhetorically, \"How did you get to the village, girl?\"\n\"I took a donkey cart .......\"\n\"It was that secretary who invited you here with a donkey cart!\" moncler outlet online The face was suddenly cold and incomparable, shouting at Xiujuan, \"You think he will let you write his bad words? You can't even get out of this village after writing that!\"\n\nXiujuan felt the other party's anger, the hand clutching the pen kept trembling, but she also aggrieved some chagrin: even without a donkey cart, with their own physical strength can not get out of the mountain? Just as Xiujuan calmed down, the grandfather continued to pour a basin of cold water over the head, he lowered his voice for fear that someone at the root of the wall eavesdropping as close to Xiujuan, relying on the hush sound to squeeze out what he wanted to say: \"To the Central Committee Chairman Mao, the letter to the commune will be withheld, not allowed to pass out. Want to go out of the village, no evidence to let out, the militia with guns to hold the village entrance no one dares to break in.\"\n\nSpeaking of which, the old farmer poked his head out of the window sill and looked out, picking his chin to show Xiujuan a good look: \"Look, there are people watching it! Xiujuan look outside, a person wearing a gray and blue Zhongshan suit in a place far from the house wandering around, from time to time towards the house to look a couple of eyes, in the empty commune compound like a black head especially thorny.\n\nSeeing this situation, Xiujuan understood that he fell into a pit and could not climb out, and the interviewed grandfather also patted his trouser legs, dusted off the mud on his shoes, got up and said to her: \"Girl you should do what to do what to go. So long I also want to open up, do not add trouble to the central, suffer it.\""
 CPC_9th_congress.10.o: "The central committee think it's too complex."
 CPC_9th_congress.11.t: "Blessing Future"
 CPC_9th_congress.11.d: "After tidying up his office, Liu Jianxun headed to the train station, preparing to travel to Xi’an for the Ninth Party Congress. “Governor Liu! Governor Liu!” As soon as Liu entered the station, he heard someone calling his name repeatedly. Turning around, he saw Auntie Cao from the braised food shop. The security detail blocked her path, but she stretched out her hand, holding a parcel. Liu quickly gestured for the guards to let her through.\nAuntie Cao placed the blue cloth-wrapped parcel in Liu’s hands and said, “Governor Liu, how could you leave Chengdu for Xi’an without saying a word? I would’ve prepared some braised food to send you off properly!” Liu felt a bit embarrassed and tried to decline, then attempted to pay for the food, but Auntie Cao firmly refused. “No need to be so formal, Governor Liu,” she said. “I’m already so grateful to you. My younger brother used to work as a hired hand for landlords. Later, he got his own land, joined a commune, and even learned how to write. He often writes to me saying how the Party has completely changed his life!” Holding down Liu’s hand as he tried to find money, Auntie Cao added, “For over a decade, the KMT preyed on Sichuan. Even with the factories and irrigation projects, poor folks like us still lived hard lives. Then the Communist Party came, and in just a few years, everything’s turned around. This little gift of braised food is nothing compared to the better days we’re living now.” Moved by her sincerity, Liu Jianxun accepted the food with many thanks and boarded the train to Xi’an.\n“Lao Liu, just arrived?” Ji Dengkui spotted Liu stepping off the train. Both had been entrusted by the Central Committee to lead reform and reconstruction in the Sichuan-Chongqing region, and now they were summoned to Xi’an for the upcoming conference. “Dengkui, long time no see!” Liu admired Ji, ten years his junior, for his exceptional talent. At a young age, Ji had become mayor of Chongqing and played a crucial role in revitalizing its industrial sectors, achieving full recovery within just three months.\n“The Land of Abundance hasn’t fattened you up, eh?” Ji teased. “You must’ve been working hard day and night.” Waving his hand, Liu responded, “Don’t tease me. Urban matters are manageable, but dealing with Sichuan’s landlords—outsmarting them is wearing me out. They’re shrewd, every single one of them.”\n“True enough,” Ji consoled. “If landlords were willing to give in easily, we wouldn’t need the Communist Party. The farmers could have organized and redistributed the land themselves.” Glancing at his watch, Ji said, “It’s about time. Let’s report to the Secretariat.”\nUpon seeing them, Deng Xiaoping stood up to greet them warmly. “Heroes have always emerged in their youth! The rapid progress in the region owes so much to the industrial development in Sichuan and Chongqing. You two have made incredible contributions!” He patted their shoulders, invited them to sit, and personally poured them tea. After taking a sip, Deng continued, “With your rich experience in Sichuan and Chongqing, the Central Committee plans to transfer you both to central positions to prepare cadres for managing the eastern liberated areas in the future. What do you think? The reception and integration of the eastern region’s industry and agriculture will depend on your leadership.”\nThe two exchanged a glance and replied in unison, “Wherever the Central Committee directs us, we will go.”"
 CPC_9th_congress.11.o: "Unbound Frontiers Harbor Infinite Potential."
 CPC_9th_congress.12.t: "Bcings grol dmag mi"
 CPC_9th_congress.12.d: "Standing in place, Choekyi Gyaltsen waited for Fan Ming. Though he was now the religious leader of Tibet, he had no real authority over governance. Without the \"assistance\" of Chinese Communist cadres, no edict from Lhasa could be issued. Some lamas had come to him, tearfully complaining that the Communists had freed their slaves, redistributed their land, and even demolished their temples. These complaining lamas were soon taken away—some were imprisoned, others subjected to public criticism sessions. Tibetan Buddhist socialism? Choekyi Gyaltsen chuckled bitterly to himself. These measures were nothing more than the Communist Party’s stalling tactics.\n\n“What is the master contemplating?” Fan Ming asked unexpectedly, his sudden voice breaking the silence. Choekyi Gyaltsen quickly masked his unease, smiling as he shook his head. “Oh, nothing, nothing. I was just pondering how to better integrate the compassionate side of Buddhism with socialism.” Fan Ming nodded, seemingly fooled by the response. The two then discussed the newly established routes leading to Burma, as well as the flow of smuggled weapons and industrial goods from Southeast Asia. Choekyi Gyaltsen knew nothing about these matters and could only respond politely.\n\nNoticing the awkwardness, Fan Ming changed the subject. “Master, would you like to join me for a drive?” Choekyi Gyaltsen had no reason to refuse and agreed. Fan Ming drove his jeep along the road, with the living Buddha as his passenger. Not far ahead, a column of the People’s Liberation Army (PLA) was conducting training exercises. The well-ordered and disciplined troops exuded a sense of might and professionalism. Yet, unlike the ferocious and oppressive armies elsewhere in the world, this battle-hardened force carried with it an air of calm resolve. Wherever they went, they were warmly welcomed by the local people.\n\nAs the soldiers marched, Tibetan villagers emerged from their homes. Some offered khatas, others brought yak milk, and still others presented barley cakes. They surrounded the troops, forming an impenetrable crowd. Bound by their regulations and a strong sense of collective honor, not a single soldier accepted the villagers’ gifts. Choekyi Gyaltsen had heard of the PLA’s strict discipline and popularity among the people, but witnessing it firsthand still left him deeply impressed.\n\nThe jeep stopped a short distance from the column, and Choekyi Gyaltsen faintly caught the sound of a few words—one of them repeated more than any other: Gyenbo Nyima, which translates to \"Bodhisattva Soldiers\" in Tibetan. The living Buddha felt a pang of loss. In the past, Tibetan villagers had reverently offered tributes to the lamas, their eyes filled with fear and their heads bowed low, awaiting the so-called blessings of the “living Buddhas.” Yet here they were, once-enslaved villagers, smiling warmly and eagerly presenting gifts to these “ordinary young men” with red stars on their caps.\n\nChoekyi Gyaltsen squinted his eyes, perhaps due to the dazzling reflection of sunlight on the snowy mountains, or perhaps because of the radiant aura of liberation emanating from the Gyenbo Nyima.\n\n“Master, have you ever seen a scene like this before?” Fan Ming asked, his tone brimming with confidence and a touch of teasing. “I’d imagine that if we emphasize the compassionate side of Buddhism, it wouldn’t be so different from what we’re striving for with socialism, would it?”\n\n“Y-Yes… yes,” Choekyi Gyaltsen stammered, visibly uneasy. He understood that the only reason the Communists hadn’t abolished his position as the Panchen Lama was because, for now, he stood on the right side of history."
 CPC_9th_congress.12.o: "If the Buddha's coming is uncertain, let me take the lead."
 CPC_9th_congress.13.t: "The fledgling spreads its wings"
 CPC_9th_congress.13.d: "\"One, two!\" Inside the Chengdu Aircraft Manufacturing Plant, workers worked together to push a brand-new aircraft out of the workshop. It was a small fighter jet equipped with a compact radar, two cannons, and two air-to-air missiles. Chief designer Lu Xiaopeng watched the plane with satisfaction, as if looking at his own child. In just a few years, through smuggled tools, parts, and blueprints, along with the tireless efforts of defense research personnel and workers, this small fighter jet, meeting the operational needs of the Frontline, finally rolled off the production line. Russian engineers affectionately called her \"Alina,\" and \"Alina\" and her sisters would soon carry the skies of the Frontline and all of China.\n\nSitting on a storage box, Chow how lam finished her rice noodles and sized up the new plane. The range wasn't large, but the climb rate must be fast, she guessed. \"Chow, get ready for the test flight,\" Lu Xiaopeng called out. Chow how lam jumped off the storage box and quickly climbed into the cockpit. \"This is the maiden flight; just conduct a 'pull-up test' to check the plane's basic performance,\" Lu Xiaopeng reminded her. \"Be safe!\" Chow nodded, putting on her helmet and oxygen mask. The tower's voice came through the headphones in her helmet: \"Test Pilot 01, report the aircraft's readiness.\"\n\nChow how lam checked and responded:\n\"Tower, Test Pilot 01, engine startup normal, fuel pressure normal, hydraulic system normal, avionics functioning, ready for takeoff.\"\n\n\"Test Pilot 01, report taxi status.\"\n\"Tower, Test Pilot 01, rudder control normal, brakes functioning, ready to taxi.\"\n\n\"Test Pilot 01, before confirming takeoff clearance, report all systems' status.\"\n\"Tower, Test Pilot 01, engine thrust normal, control surfaces normal, flaps set to takeoff position, landing gear locked, ready for takeoff.\"\n\n\"Test Pilot 01, takeoff clearance confirmed, runway 03, wind speed 5 meters per second. Stay safe.\"\n\"Tower, Test Pilot 01, acknowledged, taking off.\"\n\nThe engine roared as it pushed the aircraft forward. Chow how lam gently pulled the control stick, and the plane smoothly left the ground. Engineers and workers took off their hats, cheering to celebrate the successful takeoff. The plane's performance is incredibly stable! Chow thought. With years of test flight experience, she immediately noticed how much more stable this plane was compared to the \"flying coffins\" she tested while working in Guangdong. \"Might as well do a circling test too!\" Chow decided and sharply pulled up the nose. The plane soared gracefully like a swallow, climbing into the air to start a circling test.\n\nOn the ground, the crew and engineers turned pale with fright at first, fearing the plane might crash. They later realized Chow had gone ahead and conducted a circling test without prior approval. While relieved, they grumbled about her breaking protocol. But soon after, they erupted into even louder cheers, celebrating the resounding success of the new fighter jet and the People's Air Force's fledgling eagle taking flight.\n\nAfter the plane landed smoothly, the crowd greeted Chow how lam like a hero. Days later, a banner was delivered to her apartment. It read:"
 CPC_9th_congress.13.o: "\"Astonishing with one cry, soaring to the skies!\""
 CPC_9th_congress.14.t: "Do more, Less gain"
 CPC_9th_congress.14.d: "On the terraced fields, a tractor steadily harvested and bundled row after row of rice. The cooperative members worked swiftly, carrying the bundles to the edges of the fields. Sweat dripped from the foreheads of the men, the women shielded their eyes from the glaring sun with straw hats, and the children diligently picked up any stalks missed by the harvester, leaving no grain wasted.\n\nAnother tractor rumbled onto the scene, the driver shouting as he adjusted the direction, \"Let's load up the bundles, everyone, and move quickly!\" The members worked together to load the bundles onto the tractor’s trailer. The fully loaded tractor made its way down the winding paths toward the village. In the village’s threshing ground, the atmosphere was bustling with activity. Threshing machines roared as bundles of rice were fed into them, golden grains spilled out like a shimmering cascade, forming little hills of harvest. Elderly villagers sifted the grains with winnowing fans on the sidelines, while younger members packed the grains into sacks. One by one, the sacks were carried to the warehouse, where they were neatly stacked.\n\nZhang Dahai, holding a ledger in his hand, stood at the side recording the output nonstop. \"We’ve already brought in fifty sacks this morning. Let’s aim for two hundred by the afternoon. This year’s yield is double that of last year! Looks like we can store more surplus grain,\" he said with a smile he couldn’t hide. In his mind, he was already thinking about how the cooperative could use the surplus to purchase more industrial goods from the supply cooperative, improving the members’ living standards.\n\nBut the next day, a newly issued grain requisition quota from the county office arrived, leaving Zhang Dahai stunned. To prepare for both defense and shortages, the grain requisition target was more than double that of previous years. After calculations, the cooperative’s surplus this year would only exceed last year’s by about 10%. Word quickly spread, and a group of well-informed members gathered outside Zhang’s office, demanding an explanation. The crowd grew restless outside, their voices a mixture of worry and anger.\n\n\"Why bother working harder if it means we only get the same amount of grain in the end?\" someone grumbled. \"My relatives in the city write to me about how much better life is there, with more benefits. I think the Party just sees us rural folks as fools,\" another voice chimed in. The noise of the complaints swelled, threatening to spiral out of control.\n\nThinking quickly, Zhang Dahai recalled the wartime mobilization message conveyed during the recent county meeting. He addressed the crowd urgently, \"Comrades, the county communicated the higher-ups' instructions: the National Defense Front has now entered full preparation mode for defense and shortages. Within two years, we’ll be liberating the East. City workers are already working overtime to produce weapons. Think of this moment as climbing a mountain—we’re almost at the summit!\"\n\nThe dissatisfaction of the members subsided slightly, though murmurs of discontent persisted. Zhang tirelessly explained the broader mission and collective effort. But then, a voice rang out from the crowd, dripping with defiance, \"Liberation, liberation—sounds nice, but who knows what’ll happen after that!\"\n\nThe crowd fell silent, shocked by the audacity of the remark. Zhang Dahai’s face flushed red, then turned ashen with anger. The cooperative members looked around nervously, wondering who had dared to speak so provocatively but reluctant to expose anyone. Suppressing his fury, Zhang Dahai responded with deliberate calm: \"We can’t put personal interests above the collective good. We must sacrifice for the greater whole. If the Japanese devils come back, we won’t even have the northwest wind to eat!\""
 CPC_9th_congress.14.o: "\"After the liberation, I will personally go to the county committee to secure food for everyone.\""
 CPC_9th_congress.15.t: "Way to Home"
 CPC_9th_congress.15.d: "\"We are the flying army...’ Cheng Yuqing hummed a tune as she walked home after night school. She wanted to take advantage of her youth to learn more skills so she could secure a better position in the future. \n\n‘Little girl, heading home?’ A man driving a donkey cart came up from behind her. ‘Hop on, I’ll give you a ride since I’m headed that way.’\n\nCheng Yuqing ignored him and kept walking, not because she was afraid—after all, the recent crackdowns and nightly patrols by militiamen and police had sent most troublemakers fleeing. Instead, she felt his offer was inappropriate. Pouting, she quickened her pace. The man chuckled and shook his head, driving alongside her to avoid raising any suspicions.\n\n‘Hey! What are you up to?’ a voice suddenly called out from behind. A policeman and a militia member approached. \n\n‘Uncle Liu!’ Cheng Yuqing recognized the policeman—it was her uncle, Liu Kang. ‘Long time no see!’\n\nLiu Kang smiled and nodded at her. ‘Little Cheng, why are you out so late?’\n\n‘I just finished night school,’ she explained.\n\n‘Ah, I see,’ Liu Kang replied, before turning to scrutinize the cart driver. ‘And you? What are you doing here?’\n\nThe man handed over his entry permit and replied, ‘I’m heading to the county seat to request supplies for militia training and deliver some agricultural goods from our commune. I just happened to meet this young comrade and offered her a ride, but she wasn’t too keen on the idea.’\n\nLiu Kang examined the entry permit, returned it, and said, ‘Alright, it’s late. Both of you should head home and stay safe.’ Both the man and Cheng Yuqing nodded in agreement.\n\nAs they continued along the road, the man invited her again, ‘Comrade, why don’t you hop on and rest your legs? You’ve had a long day working and now night classes—it won’t cost you anything to take a ride.’\n\nHearing the word \"comrade,\" Cheng Yuqing felt her mood lift. ‘Now that sounds better,’ she thought, hopping onto the cart and swinging her legs as she resumed humming. The man, hearing her singing the \"Guerrilla Song,\" joined in with a grin: ‘Even if the mountains are high and the waters deep—\""
 CPC_9th_congress.15.o: "People do not pocket lost items on the street, and doors are left unlocked at night."
