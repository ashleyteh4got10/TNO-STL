 CPC_constitution_law_before_TRCW_desc: "The history of the [CPC.GetFlag]§mNational Defence§! §VFront§! can be traced back to 1949, when all §Ypatriotic anti-Japanese forces§! in western China sent delegates to §GXi'an§!, co-signing the §mCommon Program of the §!§VChinese National Defence Front§!; §mthe Common§!§V Program§! enshrines: \n\n1, that the §Vcause of anti-Japanese resistance§! has reached the stage of §Rprolonged confrontation§!, with the §RThird United Front§! pivotal for ensuring §xultimate triumph§!.\n2, that §Yall patriotic anti-Japanese forces§! in the west be fraternally united around the §mNational Defence§!§V Front§! led by the £CPC_texticon §xCommunist Party of China§!, conscientously defending the §Gunity and integrity§! of the §RThird United Front§!.\n3, that §Yall patriotic anti-Japanese forces§! in the west obey the directives of the £CPC_texticon §xCommunist Party of China§!, proactively presiding over thorough §Gagrarian revolution§!, §Rsocialist reforms§!, and other revolutionary tasks.\n\nThe flag of the §mNational Defence§! §VFront§! [CPC.GetFlag]: at the front's founding, its formal name was the §xNorthwestern Central Government of the National Defence Front§! of the §mRepublic of China§!, retaining the official style of the ROC. However, to distinguish itself from the false Wang regime in Nanjing, the Central Committee has resolved to abolish the former symbol of the Kuomintang's one-party dictatorship, the £GNG_chinese_nation_texticon Blue Sky, White Sun, and Wholly Red Earth flag, and adopt a [CPC.GetFlag]new flag in keeping with the spirit of the United Front. The flag has red and blue as its base, with a five-pointed golden star embedded in the center. The blue represents anti-Japanese democratic forces such as the national bourgeoisie, petty bourgeoise, enlightened gentry, patriotic officers, and others. The red represents the numerous workers, peasants, and soldiers, students, merchants, and toilers of all classes who support the revolutionary struggle and the cause of national liberation. The five-pointed star teaches that the Communist Party is the core of China's national United Front, inseparably united with forces both high and low, traveling together with them on the great road of China's liberation. \n\nHowever, in the fall of 1961, §mMa Jiyuan§!, head of the £GNG_chinese_nation_texticon §mNorthwestern Kuomintang§!, openly declared his separation from the §mNational Defence§! §VFront§!, severing the lines between the §GNorthwest§! and §LChamdo§!. This caused §Rgrave economic and military difficulties§! for the Front, bringing the §RThird United Front§! perilously close to death.\n\nAt this moment of §Schaotic insurrection§!, §Vheaven is to be rent asunder and earth shall fall away.§!. Battered by wind and rain, the §mNational Defence§! §VFront§! is about to embark on a fateful expedition, moving inexorably towards its §Cdestiny§! in this §Snew order§!."
 CPC_constitution_law_after_TRCW_desc: "The Constitution of the [CPC.GetFlag]§x[CPC.GetName]§! enshrines: \n\nThe state system of the §x[CPC.GetName]§! is to be a §Ssocialist people's republic§! under a §xpeople's democratic dictatorship§!.\nThe governmental system of the §x[CPC.GetName]§! is to be a §Sseries of people's congresses§!.\n[GetConstitutionCPC]\nThe §x[CPC.GetName]§! is the §Sonly legitimate government§! that represents China internationally.\n\nOur country is willing to establish foreign relations with §xanti-imperialistic§!, §mdemocratic§!, §Cprogressive§! and §xrevolutionary§! authorities, and unswervingly persist in maintaining the fundamental §Ssocialist§! stances of §xanti-imperialism§! and §xanti-hegemonism§!."
 CPC_against_right_wing_law_desc: "After the §GGreat Agricultural Policy Debate§!, the faction led by £TER_texticon_mao §GComrade Gao Gang§!, advocating for §Gagricultural collectivization policies§!, emerged victorious with the support of £TER_texticon_mao §GComrade Mao Zedong§!. However, during the subsequent §Rsocialist upsurge§! in rural areas, the £CPC_texticon §RCentral Committee§! encountered unprecedented §Rresistance in implementation§!.\n\nWithin the §CDemocratic Parties§!, a §jbourgeois§!-oriented faction and a wave of §eanti-socialist§! ideology began to viciously attack the policies of the £CPC_texticon §RCommunist Party§!, attempting to §Rundermine§! the Party’s leadership and reverse the direction of §SSocialism§!. This powerful §eanti-revolutionary current§! even affected §Rcertain individuals within the Party§!, causing significant §Rideological confusion§!. In response, £TER_texticon_mao §GComrade Mao Zedong§! decisively launched a counterattack to firmly defend the fledgling §mNational Defense§! §VFront§! and the §xrevolutionary regime§!, rooting out these §eblack sheep§! from every corner of the Front.\n\nThe movement achieved substantial results, clearing out a significant number of §nrightist elements§! from government agencies, enterprises, and factories. This effectively removed political obstacles and laid the ideological groundwork for the forthcoming £TER_texticon_mao §GGreat Leap Forward§! spearheaded by £TER_texticon_mao §GChairman Mao§!. \n\nAlthough some leading comrades exhibited §Rexcessive actions§! during the movement, the overall direction was deemed §Gcorrect§!. For those both within and outside the Party who were erroneously labeled as §nrightists§!, the Central Committee has decided to grant §Grehabilitation§!, remove the §nrightist§! label, and §Grestore their positions§!."
 CPC_great_leap_forward_law_desc: "The £TER_texticon_mao \"§GGreat Leap Forward§! Resolution\" is a historical document. In 1948, £TER_texticon_mao §GComrade Gao Gang§! of the §GNorthwest Bureau§! proposed a dual-pronged approach of §Gcollecting surplus grain from the wealthy for disaster relief and implementing land reform§!. Over the following three years, agricultural recovery in the base areas was §Gremarkable§!, earning £TER_texticon_mao §GComrade Gao Gang§! a position in the §RCentral Politburo§! for his outstanding achievements.\n\nAfter land reform, new challenges emerged that hindered rural production. At the §GCentral Expanded Meeting§! in 1952, £TER_texticon_mao §GComrade Gao Gang§! advocated for taking advantage of the momentum by accelerating §Gcollectivization efforts§!, using the §Gmutual aid system§! in agriculture as a model.\n\nIn 1953, £TER_texticon_mao §GComrade Gao Gang§! launched an offensive by leveraging §RLi Lisan’s§! report on §Strade union§! issues. £TER_texticon_mao §GChairman Mao Zedong§! explicitly expressed his support for £TER_texticon_mao §GComrade Gao Gang§! and opposed the notion of trade union independence.\n\nBy the mid-to-late 1950s, issues left unresolved during the §Rsocialist transformation§! began to surface. Within the §mNational Defense§! §VFront§! and beyond, various §Ropposing voices§! emerged. The £CPC_texticon §GCentral Committee§! gradually reached a consensus to engage in production and arms races with both the £GNG_chinese_nation_texticon §mNorthwest Kuomintang§! and the [CHI.GetFlag] §Lpseudo-Republican government§!, vowing to seize §Grevolutionary initiative§! against all domestic forces.\n\nAt this point, the groundwork for the £TER_texticon_mao §GGreat Leap Forward§! had been laid: focusing on §Rtransforming production relations§! as the primary objective, integrating the §RGeneral Plan for Socialist Transformation, Industrial Leap Forward, and Agricultural Collectivization§! into the £TER_texticon_mao §RThree Red Banners§! and infusing them with £TER_texticon_mao §GChairman Mao Zedong Thought§! to become the action plan for the §Rentire Party, military, and Front§!.\n\nIn 1956, the £TER_texticon_mao \"§GGreat Leap Forward§! Resolution\" was adopted. However, due to §nsevere natural disasters§! in the late 1950s and the betrayal of the £GNG_chinese_nation_texticon §mNorthwest Kuomintang§!, the £TER_texticon_mao §GGreat Leap Forward§! ultimately ended in failure, inflicting irreparable §Rlosses§! on the §mNational Defense§! §VFront§!.\n\nNevertheless, the £TER_texticon_mao \"§GGreat Leap Forward§! Resolution\" remains a guiding document of £TER_texticon_mao §GChairman Mao Zedong Thought§!, and the £TER_texticon_mao §RThree Red Banners§! continue to fly high over the §fNorthwest§! plains."
 CPC_fuck_KMT_law_desc: "Since the establishment of the §mNational Defense§! §VFront§!, the £GNG_chinese_nation_texticon §mNorthwest Kuomintang§!, restructured from the former §mThree Mas of the Northwest§!, has exhibited severe tendencies of §Rindividualism, feudalism, and bureaucratic capitalism§! in its daily operations. Such behavior has been intolerable to the §Grevolutionary masses§! and despised by the §Grevolutionary soldiers§! of the base area.  \n\nIts leader, §mMa Jiyuan§!, has repeatedly refused to implement the stipulations of the §mProgram§!, and since the late 1950s, the £GNG_chinese_nation_texticon §mNorthwest Kuomintang§! has wantonly §Rexpelled§! and even §xmurdered§! £CPC_texticon §Rour Party cadres§! who were dispatched to Qinghai to guide §Grevolutionary work§!. Their crimes are too numerous to recount.\n\nFurthermore, with his growing ambition, §mMa Jiyuan§! audaciously declared §Rsecession and war§! in 1961, severing the connection between the §GNorthwest§! and §LKham region§!. This act plunged the Front into §Rsevere economic and military difficulties§!. After stern warnings and careful deliberation, the £CPC_texticon §xCommunist Party of China§! unanimously concluded that the £GNG_chinese_nation_texticon §mNorthwest Kuomintang§! had §Vgravely deviated from the revolutionary path and betrayed its anti-Japanese oath§!, effectively degenerating into a §ereactionary faction§!.\n\nFollowing a resolution by the £CPC_texticon §RParty's Central Plenary Meeting§! and the £CPGAC_texture_loc §GCPGAC§!, it was declared that the £GNG_chinese_nation_texticon §mKuomintang§! is an §eillegal political party§! and expelled from the §Runited front§!."
 CPC_agricutural_reform_law_1_desc: "£TER_texticon_mao §GComrade Mao Zedong§! emphasized that §Gagricultural collectivization§! is the essential characteristic of socialist agriculture, and that §Gcollectivization§! combined with §Rmechanization§! is the direction for the development of Chinese agriculture. The £CPC_texticon §RParty’s Eighth National Congress§! affirmed that the collectivization model of the §GPeople's Commune§! during the §GGreat Leap Forward§! was fundamentally sound. The failures of the §GGreat Leap Forward§! were largely due to deliberate sabotage by the £GNG_chinese_nation_texticon §mKuomintang reactionaries§! and §R“Left” deviations§! made by some Party cadres.With the lessons learned from the early 1960s, the £CPC_texticon §RParty§! has now developed a §Gstable and efficient§! method for §Gcollectivization§!. Our §Gsocialist agriculture§! enterprise is poised to achieve new successes!"
 CPC_agricutural_reform_law_2_desc: "£TER_texticon_liu §mComrade Liu Shaoqi§! argued that the §mtransformation of ownership of the means of production§! is no easy task and must be based on thorough investigation and research. The §mCentral Committee§! has resolved that while the overarching goal of establishing §madvanced agricultural cooperatives§! in the base areas remains unchanged, specific policy measures should be §mmoderated compared to those of the early 1960s§!. It was decided to §mdissolve some poorly managed agricultural cooperatives§! and allow farmers to §Ytemporarily engage in independent farming§!.We firmly believe that these measures will help the base areas recover §mas quickly as possible§! from the §Rtrauma§! of the §GGreat Leap Forward§!."
 CPC_industrial_reform_law_desc: "Since 1955, the gradual implementation of £TER_texticon_mao £TER_texticon_liu §Gpublic ownership§! and §meconomic restructuring§! has broken through §Rindustrial barriers§! in the base areas. After the mid-1960s, the §mNational Defense§! §VFront§! came to control key industrial zones such as §LSouthern Shaanxi, Central Sichuan, Central Chongqing, and Southern Kham§!. Industrial production became increasingly §Rsocialized§!, and §Rtechnological demands§! grew more complex.The £CPC_texticon §RCentral Committee§!, recognizing the trends of the time, focused on §Gindustrial§! §mrestructuring§! as a priority, completing the §Rsocialist industrial transformation§! across all liberated areas. The §Rindustrial capacity of the western regions§! has risen steadily, laying a §Gsolid foundation§! for the grand goal of §xliberating all of China§!."
 CPC_military_reform_law_1_desc: "For the long-term development of the £TER_texticon_PLA §YPeople’s Liberation Army§!, the £TER_texticon_NDF §YCentral Military Commission§! has carefully assessed the situation and, based on the realities of our forces in the mid-1960s, formulated a comprehensive £TER_texticon_PLA §Ymilitary reform§! policy centered around the §L“Mission-Oriented Command Reform”§!.\n\nThis reform expands the §Gautonomy§! of lower-level units in combat, fully leveraging their §Ginitiative, creativity, and flexibility§! to effectively respond to complex and rapidly changing battlefield environments, thereby securing and maintaining the §Ginitiative§!.\n\nAdditionally, the reform encompasses areas such as §mmulti-branch specialization§!, §Ystrategic support integration§!, and §Rstrengthening troop discipline§!. We firmly believe that practical and effective reform measures will enable our forces to §Genhance combat effectiveness§!, §machieve modernization goals§!, §Sand secure ultimate victory§! in the grand mission to §xliberate all of China§!!"
 CPC_ANRL_basic_law_desc: "[CPC.GetFlag][VIC.GetFlag][CRC.GetFlag][KPA.GetFlag] §mHanoi§! §VAccord§! is often regarded as the foundational charter of the §mAsian National§! §VRevolutionary Alliance§!. The full text reads as follows:\n\nSince the rise of the [VIC.GetFlag][CRC.GetFlag][KPA.GetFlag] §mSoutheast Asian revolutionary movements§!, §Sthe situation in Asia§! has undergone significant changes. The masses of people oppressed by £GNG_japanese_frustration_texticon §jJapanese imperialism§! and exploitation are §Yrising in resistance§! against the §jbrutal rule§! of the invaders. Facing this situation, the contracting nations have recognized the need to establish an §xanti-imperialist alliance composed of all revolutionary nations in Asia§! to overthrow the §jGreater East Asia Co-Prosperity Sphere§!, a cage imposed on the peoples of Asia. With this objective at its core, plenipotentiary representatives of the contracting nations have reached the following agreement to establish the §xAsian National Revolutionary Alliance§!.\n\nThe contracting nations regard the §xliberation of the peoples of Asia§! through §xrevolutionary struggle§! to overthrow the §jcolonial domination§! of the §jJapanese Co-Prosperity Sphere§! as their primary objective. Any entities collaborating with §jJapanese imperialism§! are deemed common enemies of the contracting nations. Meanwhile, the contracting nations pledge to engage in normal relations with §Yneutral states§! based on the §Gprinciples of respecting sovereignty, non-interference in internal affairs, and peaceful coexistence§!.\nThe contracting nations, in the spirit of §Gsolidarity and mutual assistance§! among revolutionary states, shall consult on §Yall significant international issues§! concerning their shared interests.\nIn the event of §Yarmed aggression§! by §Yany country or group of countries§! against a contracting nation, all contracting nations shall exercise their §Rright to individual or collective self-defense§! and provide full support to the attacked nation by §Yall reasonable means§! (including §Rdeploying armed forces§!).\nThe contracting nations shall establish a §mJoint Command Center§! to coordinate their military activities. Representatives from each nation will serve at the §mJoint Command Center§!.\nA §GPermanent Political Consultative Body§! shall be established to handle the alliance's daily affairs, deliberate, approve, and implement proposals from member states. Representatives from each contracting nation shall serve in the §GPolitical Consultative Body§!.\nThe contracting nations shall mutually respect §Gterritorial integrity, sovereignty, and non-interference in internal affairs§!. They shall assist one another in the §Geconomic and military spheres§! and actively support each nation's §xanti-imperialist forces§! to achieve the §xcomplete liberation of the Asian peoples§!."
 CPC_old_aged_leaders_retire_law_desc: "£CPC_texticon §RThe Ninth National Congress of the CPC§! reviewed the Party's great achievements in revolutionary construction over the years. However, a series of §Runexpected incidents§! during the agenda revealed for the first time to the §RCentral Committee§! the urgent issue of the §mdeficiencies in the cadre succession and retirement system§!.\n\nAs time passed, a significant number of §Ysenior cadres over the age of 70§! emerged within the Central Committee. These §Yveteran comrades§!, whether in terms of §Gcognitive abilities§! or §mphysical capacities§!, were gradually declining and could no longer handle the increasingly §Rdemanding responsibilities§! of political and military affairs.\n\nAt this critical moment, £TER_texticon_mao §GComrade Mao Zedong§! and £TER_texticon_liu §mComrade Liu Shaoqi§! demonstrated great selflessness and voluntarily retired from their §Gcentral leadership positions§!. With remarkable determination, they actively advanced the improvement of the §Gretirement system for senior cadres§!, bringing an end to the §Runscientific and unreasonable cadre lifetime tenure system§! through institutional reform."
 CPC_rural_democracy_law_desc: "The newly legislated £CPGAC_texture_loc Guidelines of §GGrassroot Governance§! on §SMass Democracy§! has affirmed the routines and forms of §SGrassroot Democracy§! within the [CPC.GetFlag][CPC.GetName], signifying a §Gfirm step§! towards §SSocialist Democracy§!. With the Grassroot Governance §SGradually Taken over by the People§!, we are reassured the §Glofty ideals§! of §SPeople's Democracy§! and in its advance §xProletarian Democracy§! shall not be restricted to lip services."
 CPC_power_vacant: "NULL"
 TER_MRC_we_can_choose_this: "According to the §Ypreviously selected plan§!, we now §Ghave the option to choose§! §Ythis option§!."
 CPC_diplomacy_front: "Diplomatic Front"
 CPC_diplomacy_front_desc: "Under the guidelines of the 8th Congress, we have reinitiated diplomatic operations, reaching far beyond the NDF and even out of China.\nUndercover comrades as well as Diplomatic Corps have been vigorously working to aid the Revolution. We advocate a prudent diplomatic strategy to strengthen the cause of Asian Revolution.\n\nNote by the TER Team: The Decision Group shall be overhauled in §YTER 1.2: Cygnoidea Nebulae§! forming a complete system of mechanism and narrative on National Defence Front §YDiplomatic and Undercover Operations§!. "
