 Mao_Zedong_DESC: "After Mao Zedong assumed the supreme leadership of the CPC in the mid-1930s, he resembled a divine healer capable of miraculous cures, repeatedly prescribing unorthodox remedies for the ailing nation. One such instance was the establishment of a united front with the KMT, whom they regarded as mortal enemies, to jointly resist Japanese invasion. Simultaneously, he insisted on maintaining the Party's independence and autonomy within this alliance, leveraging the tumultuous tide of the war to steadily bolster their domestic strength and influence, which angered both the left and right wings, provoking their incessant criticism. However, he remained undeterred, and the course of events often vindicated his methods. It was precisely due to this that, under their admiring gazes, he slowly climbed to the pinnacle of political power, becoming the leader of communism in China. In an interview with the American journalist Edgar Snow, he candidly admitted, not without a hint of irony, that China's revolutionary leadership emerged because \"in the mountains where there are no tigers, a monkey can be king.\"\n\nWhen the news of the defeat of the Chinese army at Zhongtiao Mountain reached Yan'an, Mao Zedong lost control of his emotions, tearing up the war report and cursing Chiang Kai-shek for his lack of success and his failure to give China an advantage on the battlefield. The light in Mao's eyes dimmed when the Soviet Union's defeat in the Soviet-German War a month later shadowed the future of Chinese resistance. The day in 1947 when Chongqing and Nanjing declared the \"Nanjing-Chongqing merger\" under Japanese supervision was the darkest moment of Mao's revolutionary career.\n\nIn his shelter, Mao Zedong slowly unfurled the map – China lay utterly shattered. The day of her reunification, in the eyes of an aging Mao, seemed to grow ever more distant. A single, cloudy tear escaped his weary eye.\n\nDespite the defeat by Japan, the revolution's red flag still waved over the Northwest, symbolising the only free land remaining in the whole of China. As time moved inexorably into the fifties, Mao Zedong became more and more impatient in the process of formulating his economic plans, as if China was going to perish under the hooves of Japan if it didn't hold on to the straw of \"socialism\". This almost became Mao's obsession, and caused him to push his comrades with great anxiety to implement more and more wild ideas, which eventually caused irreversible damage. The dream waved a hand towards Mao and darted away, leaving only his silhouette behind; as his mind wavers, the future of the Chinese Revolution grows uncertain..."
 Liu_Shaoqi_DESC: "Liu Shaoqi was always confronted with the question: to what class does the Communist Party belong?\n\nIn the early years, he felt a strong wind blowing towards the workers' movement, and it was a great victory to see all the big bosses, who were once so powerful, bowing down before his eyes - only the Communist Party could do that. The day-to-day organizational work he completed also yielded an answer: the Chinese revolution needed a group of advanced theorists, a group of eternal pioneers, to lead the proletariat in their struggle until the final victory came.\n\nDuring the Yan'an years, as a city representative, Liu Shaoqi was as active as ever in the front line. He was not averse to dealing with the peasants; the Communist Party should always lead the majority of people, and it was simply a change in who they were leading.\n\nDuring the Rectification Campaign, he came to support Mao Zedong. For this dedication, he was rewarded by Mao by being entrusted with important responsibilities from time to time, so much so that a common saying spread within the Party: to join the Party you need Mao, to handle the Party you need Liu. These decisions also concerned the CPC's most crucial areas: the countryside was the focus of their work, while the cities also could not be abandoned. Liu Shaoqi controls a large number of urban party organizations, granting him valuable political capital. Slowly, he has risen to become the second-in-command of the party: a pioneer among pioneers.\n\nDuring the1950s, the years of failure, Liu Shaoqi saw the flaws in Mao's overly-ambitious character. He saw class distinctions as rather more significant than Mao did, and thus had some unpleasant disagreements with him. He relied on consistent and dutiful compliance to reap the Party's unanimous praise, and intentionally or unintentionally hinted at Mao's dereliction of duty in public. Well, for political figures, this transparency is not something to be ashamed of; \"the Party does not hide its views or intentions.\""
 CPC_THENEWORDER_DESC: "Once, the CPC and the KMT shared a common hatred, willing to sacrifice their lives for the freedom of their nation. These events are still vivid in our memories. The sacred War of Resistance against Japan united those in West China determined to resist, refusing any compromise with the traitorous puppet regime.\n\nThe CPC achieved its ambition of leading \"all China\". Yet, compared to their Soviet counterpart, their rule was inexperienced and hasty. The rapidly expanding government was chaotic. Disputes during political consultations were often perceived as obstructions by the CPC, leading them to resort to direct intervention. Those outside the CPC grew impatient with the Party's autocratic style.\n\nAs the Japanese threat receded, the rift between the communists and conservatives within the National Defence Front sharpened. Arguments over whether to advance the revolution became increasingly bitter. Past grievances resurfaced. Trapped in a prisoner's dilemma, each faction within the Front willingly betrayed the other. Now, only the Communist Party remains in the Front; in a radical move, she has further stripped away the right of dissenters to exist, standing alone to face a future fraught with thorns."
