 CPC_Zhou_Enlai: "Zhou Enlai"
 CPC_Zhou_Enlai_hog_desc: "§Y$head_of_government$\n$communist_bolshevism_subtype$§!\n§Yslient workhorse§!\n§F------------§!\n§LIf CPC is a toddler, then Zhou Enlai is the loving mother who painstakingly raised the baby to adulthood.\n\nIn 1897, Zhou Enlai was born in a family of a scholar and gentry in the Jiangnan area. As a child, he was passed on to his childless uncle, and later followed him halfway across China to settle in the north. Due to his family's superiority and openness, Zhou Enlai received a childhood education of \"new learning\", including new subjects such as geometry, geography, philosophy, etc., which opened his eyes to obscurity. Like many of his new intellectual contemporaries, Zhou Enlai was inspired by the new ideas of communism and became a devoted believer. After the May Fourth Movement, Zhou Enlai traveled across the ocean to France for work and study and joined the Chinese Communist Group in Europe. When the Chinese Communist Party was founded, Zhou Enlai was also among the founding local groups. In the thirty years since he joined the revolution, he was the director of the Political Department during the Northern Expedition, led the Shanghai Workers' Uprising, recreated the republic during the Nanchang Uprising, was a member of the military trio during the Long March, was the negotiating master of the Xi'an Incident, and was everywhere in the Third United Front in the 1950s ......\n\nThe cooperation between Zhou Enlai and Mao Zedong was not as good as a fish in water, but complementary. Zhou Enlai was a principled and steadfast politician, who acted in a calm and steady manner. However, whenever the pragmatic mind works once, Zhou Enlai's heart feels like something is missing ......§!"
 CPC_Chen_Yun: "Chen Yun"
 CPC_Chen_Yun_eco_desc: "§YFinance Committee Director\n$communist_bolshevism_subtype$§!\n§YSuihouzhu§!\n§F------------§!\n§LMao Zedong once called Chen Yun \"the Bukharin of our Party.\"\n\nBorn into a poor peasant family, Chen Yun couldn't afford tuition, so after graduating from primary school, he went to work as an apprentice at the Commercial Press in Shanghai. There, he learned about the commercial operations and financial transactions of the bookstore, marking the beginning of his career in economics. During the May 30th Movement, Chen Yun successfully led a strike at the Commercial Press and subsequently joined the Communist Party of China, taking charge of organizing labor movements. During the Yan'an Rectification Movement, he firmly sided with Mao Zedong. When the communist base areas were plunged into an economic crisis due to Chiang Kai-shek's blockade, Chen Yun provided the Party Central Committee with a satisfactory solution: utilizing land as capital, which attracted both ordinary smallholders and large capitalists to invest. From then on, he was able to skillfully manage this mixed economy model and thus secured his position as the Party's leading economist.\n\nHowever, this model bears some resemblance to the New Economic Policy implemented by the already fragmented Soviet Union...§!"
 CPC_Gao_Gang: "Gao Gang"
 CPC_Bo_Gu: "Bo Gu"
 CPC_Bo_Gu_for_desc: "§YForeign Minister\n$communist_bolshevism_subtype$§!\n§YAuxiliary of the Revolution§!\n§F------------§!\n§L\"Follow the truth\" was the motto that guided Bo Gu throughout his life.\n\nWhile studying in Jiangsu and Shanghai, Bo Gu joined numerous student organizations, actively participating in patriotic student movements. Later, he was introduced to the Communist Party of China and went on to study at Moscow Sun Yat-sen University for five years. Upon returning to China, he joined the revolution. During Wang Ming's leadership, unlike other party members, Bogu, as one of the \"28 and a half Bolsheviks\" who returned to China after being \"gilded\" in the Soviet Union, held disdain for pragmatists and conciliationists within the party and looked down upon veterans like Mao Zedong. It was only after the errors made by him and Otto Braun, resulting in the Red Army's forced abandonment of their base areas and embarkation on the Long March, that Bo Gu finally acknowledged his mistakes and began to humbly seek knowledge. Since the establishment of the \"Liberation Daily\" started to spread the Party's voice throughout the nation and the world, Bo Gu has made significant contributions to diplomacy.\n\nThe flames of revolution is still burning brightly within him.§!"
 CPC_Chen_Yi: "Chen Yi"
 CPC_Chen_Yi_for_desc: "§YForeign Minister\n$communist_bolshevism_subtype$§!\n§YDie Hard§!\n§F------------§!\n§L\"Give all of me to revolution, must be succeed. Insist on justice, get freedom across nation.\"\n\nChen Yi did not come from a professional military. He attended an industrial school in his early years, met Zhou Enlai and communism when he went to France for work-study, and was escorted back to China because of participating in the student movement. He served as a clerk in the political department of the Wuhan branch of Whampoa and as a political committee member of the Red Army, leading the New Fourth Army to survive several sieges by the Kuomintang and the Japanese. After the fall of the South o Yangtze River area, Chen Yi returned to Yan'an. \"The general's seat is full, let Chen Yi go to the Foreign Ministry.\" Faced with Mao Zedong's arrangement, Chen Yi did not complain and immediately packed his bags and went to the Ministry of Foreign Affairs to serve as deputy minister. He brought his bad temper to the negotiating table, scaring the other side, sometimes useful, and sometimes not so necessary.\n\n\"Under snow's pressure, pines are still standing. Remain true to original aspiration.\"§!"
 CPC_Luo_Ruiqing: "Luo Ruiqin"
 CPC_Luo_Ruiqing_sec_desc: "§YPublic Security Minister\n$communist_bolshevism_subtype$§!\n§YJustice Gladiator§!\n§F------------§!\n§LMao Zedong once said, \"If the sky falls, Luo Changzi will hold it up,\" and he also said, \"Luo Ruiqing is covered in thorns.\"\n\nAfter joining the Fourth Red Army, Luo Ruiqing participated in almost every battle. During the second counter-encirclement campaign, he was shot in the left cheek, narrowly escaping death. At the Zunyi Conference, he was responsible for perimeter security and later served as the president of the Anti-Japanese Military and Political University in Yan'an for several years.\n\nHowever, frankly speaking, Luo Ruiqing is a person who easily gets arrogant (or rather, he bullys the weak and fears the strong). Although these flaws have enabled him to pry open many tight-lipped individuals and obtain intelligence, they have become even more pronounced since he led the security work and anti-rightist campaigns in the base areas during the chaotic postwar period, potentially leading to disaster.§!"
 CPC_Pan_Hannian: "Pan Hannian"
 CPC_Pan_Hannian_sec: "Pan Hannian"
 CPC_Pan_Hannian_sec_desc: "§YPublic Security Minister\n$communist_bolshevism_subtype$§!\n§YSpy Specialist§!\n§F------------§!\n§LSince the Red Army's Long March, Pan Hannian has done almost all of the most dangerous intelligence work: he traveled to Shanghai, Nanjing, and other major cities in the National Unification Area to obtain intelligence during the height of the White Terror; he was sent to Fujian to negotiate with the 19th Route Army during the Fujian Incident; in Shanghai, he tricked the Japanese into searching him with a few pieces of toast, and even met with Wang Jingwei. When the Kuomintang was defeated, he successfully escorted Shen Junru, Guo Moruo and many other democratic parties and figures from the fallen areas to Yan'an to form the new CPPCC...\n\nHowever, these achievements of Pan Hannian did not make him favored by the Central Committee. Even though his intelligence work was satisfactory, he could not compete with those villains who were sneaking around. Pan Hannian can only wait patiently, perhaps the day when Luo Ruiqing makes a big mistake is not far away...§!"
