 CPC_PLA_issue_3: "Scarlet Valor and Keen Edge"
 CPC_PLA_issue_3_tt: "£CPC_idea_texticon_PLA_dummy_2\n\n\n£CPC_texticon §RParty Organ Consolidation§!\nDaily Political Power Gain: [?CPC.CPC_PLA_political_power_gain|2+]\nDivision Recovery Rate: [?CPC.CPC_PLA_army_org_regain|2+=%]\nMilitary Professionalism Monthly Change: [?CPC.CPC_PLA_army_professionalism_monthly_rate|2+]\nDivision Organization: [?CPC.CPC_PLA_army_morale_factor|2+=%]\n\n£TER_texticon_PLA §RCommand Structure§!\nDaily Command Power Gain: [?CPC.CPC_PLA_command_power_gain|1+]\nCommand Power Max: [?CPC.CPC_PLA_max_command_power|1+]\nDivision Experience Gain: [?CPC.CPC_PLA_experience_gain_army_unit_factor|2+=%]\nDivision Experience Loss: [?CPC.CPC_PLA_experience_loss_factor|2-=%]\nDivision Combat Width: [?CPC.CPC_PLA_combat_width_factor|2-=%]\nReinforce Rate: [?CPC.CPC_PLA_land_reinforce_rate|2+=%]\n\n£TER_texticon_NDF §REquipment Upkeep§!\nDivision Attack & Defence: [?CPC.CPC_PLA_army_ad_factor|2+=%]\nDivision Speed: [?CPC.CPC_PLA_army_speed_factor|2+=%]\nSupply Efficiency: [?CPC.CPC_PLA_supply_consumption_factor|2+=%]\nSpecial Forces Attack & Defence: [?CPC.CPC_PLA_breakthrough_factor|2+=%]\nSpecial Forces Cap: [?CPC.CPC_PLA_SP_amount|0+]\n\n[CPC.GetFlag]§mNorthwest Defence Research Institute§!\nAnnual Expenditure on Scientific Research Projects: [?CPC.CPC_NADT_modifier_misc_costs_modifier|-3=]B\nResearch Speed: [?CPC.CPC_NADT_research_speed_factor|+2=%]\nAll Aircraft Production Cost: [?CPC.CPC_PLAAF_dummy_num|-=%]\nInfantry Equipment Production Cost: [?CPC.CPC_PLA_inf_equip_dummy_num|-=%]\nInfantry Equipment Reliability: [?CPC.CPC_PLA_inf_equip_dummy_num|+=%]"
 CPC_PLA_issue_3_desc: "This is a great army that has emerged victorious from the torrent of the People's Liberation War—surging forth from the majestic mountains of the Northwest, like razor-sharp blades piercing the dark heart of the Japanese puppet regime, fulfilling the grand vision of liberating all of China.\n\nNow, the People's Army stands at the peak of its momentum, yet the road ahead remains arduous. It must rise to the unprecedented challenges posed by §mmodernization§!, and in the future, it shall bear the sacred mission of §Gliberating Taiwan, liberating Korea§!, and even §Sliberating all of East Asia§!—ultimately striving toward the §Cliberation of all humankind§!. Only with unwavering devotion and an unyielding will can it chart its course through the journey ahead and secure final victory."
 CPC_AT_gov_issue_idea: "The fledgling phoenix finds its roost."
 CPC_AT_gov_issue_idea_desc: "The desolate autumn wind returns once more, yet the world has changed.\n\nThe People's Government has just been established, bringing hope for the people's democratic dictatorship while also facing numerous challenges. We must actively advance reforms in newly liberated areas, strengthen government institutions, and earn the trust of the people, thereby striving for China's independence, democracy, peace, unity, and prosperity."
 CPC_AT_party_issue_idea: "Burning Like a Song"
 CPC_AT_party_issue_idea_desc: "All must bear the Torch, for the world of darkness shall fade into ashes of oblivion.\n\nThe Crimson Sparks have triumphed against the darkness haunting China, and our vision has come true. The Revolution, is yet of a path unwindling. We who sworn to strive for achievement of Communism, shall endeavor unto new victories with determined hearts, valiant minds, and skillful hands."
 CPC_AT_eco_issue_idea: "River never ends"
 CPC_AT_eco_issue_idea_tt: "§SEnd of Liberation War§! leads to us reassessing our §GSocial Development§!, which §eregressed§! §Yone level§! in comparison to the §GEra of Prolonged Resistance§!"
 CPC_AT_eco_issue_idea_desc: "After a Hundred Battles for the Cities, Few of the Elders Remain.\n\nWith the war settled, the domestic economy lies in ruins. The remnants of the reactionary Kuomintang forces still harbor ill intentions, land reform in newly liberated areas remains incomplete, and many industrial zones have suffered severe devastation.\n\nWe must abolish all privileges of imperialist countries in China, confiscate bureaucratic capital and place it under the ownership of the people’s state, systematically transform the feudal and semi-feudal land ownership system into a system where land belongs to the peasants, develop a new democratic people's economy, and steadily transform the New China into an industrial powerhouse."
 CPC_AT_ANRL_issue_idea: "We move together"
 CPC_AT_ANRL_issue_idea_desc: "The Earth is Vast and Nurturing; the Noble One Upholds Virtue to Sustain All Things.\n\nAs a newly established anti-imperialist alliance, the Asia National Revolutionary League(ANRL) is committed to leading the peoples of East Asia toward a unique path of equality, freedom, development, cooperation, and mutual prosperity. However, the fading yet persistent Co-Prosperity Sphere continues to oppress many yet-to-be-liberated peoples under the guise of \"Pan-Asianism\" and even plots its next confrontation.\n\nWe shall stand together in solidarity, support one another, and actively aid all anti-imperialist forces across the region. We will fight until the complete liberation of the Asian peoples is achieved!"
 TER_Mongolia_Federation_modifier: "Mongolia Federation Area"
 TER_Mongolia_Federation_modifier_desc: "This region falls under the jurisdiction of [CPC.GetFlag] §C[CPC.GetName]§!, as a federal member state, the §YPeople's Republic of Mongolia.§! According to the §YChina-Mongolian Joint Unification Agreement§! signed in the 1960s, the §YPeople's Republic of Mongolia§! shall submit to the leadership of the §C[CPC.GetName] Central Government§! upon the complete liberation of the Asian continent, joining [CPC.GetName] as a §Cfederal entity§!.Under this agreement, Mongolia shall enjoy a §Ghigh degree of internal autonomy§!, while its citizens shall legally acquire §C[CPC.GetName]§! national citizenship and be placed under the governance and administration of the [CPC.GetName] §CCentral Government.§!"
 CPC_main_story_events.1.t: "Yellow Sands (Part I)"
 CPC_main_story_events.1.d: "The yellow sands billowed under the blazing sun, the wind sharp as a blade, casting a bitter chill over the land. Gao Gang sat astride his red-maned horse, standing alone beneath the vast sky, silently watching the soldiers in the distance hurriedly packing their belongings, as if he were an outsider to the scene. It had been a month since he parted ways with Chairman Mao. His unkempt beard, curling in unruly strands, only added to his rugged, unrefined appearance—whether it was an act of defiance or self-destruction to prove his resolve, none could say.\n\nGuards Wang Jinpeng and Li Weizi walked side by side, leading a water cart, their reins slack in hand. They had just returned from the river. Seeing Gao Gang’s forlorn figure, Li Weizi sighed and muttered, “The Chairman used to be decisive and commanding. How did he end up like this? Watching him like this makes me feel stifled.”\n\nWang Jinpeng knew the reason all too well but could only whisper a warning, “Be careful not to let the commander hear you.”\n\nThe two men fell silent as they approached from behind. Li Weizi took the lead and greeted, “Commander, we’ve brought back water.”\n\n“How much?” Gao Gang’s tone was devoid of emotion, his only concern the number.\n\n“Over two hundred jin.”\n\nGao Gang flicked his whip toward the front of the convoy, signaling Li Weizi to return the water cart to the ranks. Then, he called after him, “Don't call me ‘Chairman’ anymore. I am no longer one.”\n\n“Yes, Commissar Gao…” Li Weizi quickly corrected himself, clenching his legs around his horse's belly and galloping to the rear of the convoy. He tossed the cart’s reins to the waiting soldiers, shouting orders, “Secure the water cart! Set up the tents! Once everything is packed, we move out!”\n\nThe soldiers worked even faster, carrying their heavy loads and settling into their places. Yet, under the sky where Gao Gang stood, silence lingered—only Wang Jinpeng remained, standing alert, eyes scanning the horizon.\n\nSuddenly, Wang Jinpeng spotted a rising cloud of dust in the northeast—two riders galloping toward them at full speed. He raised his binoculars, peering through the swirling sand, and his heart leaped with excitement.\n\n“It’s Secretary Xi!” he shouted."
 CPC_main_story_events.1.o: "Next page"
 CPC_main_story_events.2.t: "Yellow Sands (Part II)"
 CPC_main_story_events.2.d: "Hearing that name, Gao Gang reacted as if struck by lightning. A surge of excitement and confusion washed over him. Without hesitation, he turned his horse and galloped forward. Under the vast and boundless sky, the two men embraced tightly. Gao Gang's questions burst forth like a barrage of artillery—he was desperate to know what had become of his dear friend after his demotion.\n\n\"Has your disciplinary action been lifted? Can you move freely now? Who vouched for you?\"\n\n\"It was Deng Xiaoping,\" Xi Zhongxun replied calmly.\n\nGao Gang's expression froze instantly. It was as if his heart had been overturned, spilling out bitterness, sourness, and saltiness all at once. His smile faded slowly, replaced first by confusion, then by anger, and finally by disappointment—because Deng Xiaoping’s influence had stretched too far.\n\n\"He also sent me a message, telling me that you were leaving Jingbian for Mongolia and that I should come see you off. Look—\" Xi Zhongxun reached into his saddlebag and pulled out two bottles of liquor. \"This is the special brew from our Meixian Distillery. When you're over there, drink it and don’t forget us.\"\n\nGao Gang was still lost in thought, showing no reaction until Xi placed the bottles in his hands. Only then did his scattered gaze begin to refocus. \"Have you resumed work?\" he asked.\n\n\"I'm the director of Meixian Distillery now. Life is much quieter than during the Great Leap Forward. Deng Xiaoping also talked to me about returning to the central government. He said Chairman Mao is in a difficult position—he needs to rehabilitate comrades who were criticized in the past, but at the same time, he can't overturn his own verdicts. It's tricky.\"\n\n\"It's all my fault.\"\n\nThe unintentional complaint made Gao Gang sink into deep guilt. He lowered his head and fell silent, endlessly rotating the bottle in his hands, his embarrassment laid bare. Xi Zhongxun, understanding Gao’s turmoil, reassured him not to betray Chairman Mao’s final trust. He urged Gao to dedicate himself fully to the Mongolian revolution—if he could achieve results and atone for the past, any obstacle could be overcome.\n\nA fierce gust of wind lifted a handful of yellow sand, scattering it across the vast land, dispersing the worries lingering in both their hearts. Xi Zhongxun embraced Gao Gang once more, his voice firm with expectation as he offered his blessing:"
 CPC_main_story_events.2.o: "\"I only hope for your triumphant return soon.\""
 CPC_main_story_events.3.t: "Star Night"
 CPC_main_story_events.3.d: "The man slumped onto a small wooden stool in the courtyard, bathed in the dim glow of the stars and moon. Beside him, a meal long gone cold sat untouched, but he didn’t so much as glance at it. Instead, he stared blankly at the pale ground, lost in silence.\n\nHe lit a cigarette, letting the curling smoke veil his worn, dejected expression. For fourteen years, almost every night, he had been plagued by different nightmares. In them, he always found himself reliving the day the news broke of the collapse at Zhongtiao Mountain, the day Chiang Kai-shek met his untimely demise, the day Wang Jingwei beamed with joy, celebrating the reorganization of the national government. In every dream, he would furiously tear apart the newspaper, curse until his throat went hoarse, then wake up drenched in cold sweat—in a cave dwelling in Yan’an or a cramped house in Xi’an.\n\nSixty-eight years old. For a revolutionary who had dedicated his life to purging China of its century-old ailments, it was a number hard to swallow. He did not know when death might suddenly claim him, and he dared not imagine what course the National Defense Front would take once he was gone. Liu Shaoqi’s faction advocated for independence, Gao Gang had been exiled by his own hand, even Deng Xiaoping wavered between light and shadow—since the Rectification Campaign, never had the revolutionary ranks faced such profound turmoil.\n\nHe felt hollow, as if he had lost all footing. And the more uncertain a man becomes, the tighter he clings to what little remains in his grasp. The Front needed a leader—one with unmatched prestige and experience, someone who could carve a path through the haze of uncertainty. That leader had to be him. He could not afford to fear failure. He could not allow himself to dread mistakes. That leader had to be resolute and unwavering, capable of uniting and leading the people of the base areas in their unyielding war of resistance. He had to believe, with absolute conviction, that ultimate victory belonged to China. He had to…\n\nHow many more \"musts\" could there be? Mao Zedong, the great leader of Free China, still standing in defiance—he was, after all, only human. He too felt the creeping fear of death. He too wrestled with regret over past mistakes. He too knew the exhaustion of long years of failure. And so, night after night, he sat in that quiet courtyard, took a long drag from his cigarette, and let out a weary sigh.\n\nBut regret and anxiety changed nothing. The silence of Xi’an was broken by two sharp cries of a rooster. The sun would rise again in the east, and with it, a brand-new day…"
 CPC_main_story_events.3.o: "The sun's glare stung his eyes slightly."
 CPC_main_story_events.4.t: "The Moon"
 CPC_main_story_events.4.d: "\"The Chairman still hasn’t eaten? The food's getting cold,\" Xiao Sui, Jiang Qing’s secretary, grumbled inside the room. \"Every day, I go fetch the meal, and every day, it just sits there, untouched. Cold again, then reheated again.\"\n\nAfter venting, Xiao Sui suddenly realized who was sitting right in front of her—Jiang Qing. Director Jiang was not one to tolerate nonsense, and she was surely about to get a scolding. But to her surprise, Jiang Qing, instead of her usual sharp and severe demeanor, calmly reasoned with her: \"The Chairman is exhausted; he needs to relax. If you're hungry, go ahead and eat first. No need to wait around.\"\n\nXiao Sui’s heart jumped to her throat. She hesitantly picked up her meal box but didn’t dare move a step, her eyes fixed on Jiang Qing’s expressionless face. Only when Jiang Qing waved her off did she finally clutch her meal box and scurry out of the study like a startled rabbit.\n\nAfter Xiao Sui left, Jiang Qing felt restless. A pressing matter weighed heavily on her mind, but she didn’t know how to begin. She walked over to the desk and spoke softly, \"Chairman, the food’s getting cold. Come and eat.\"\n\nMao Zedong slowly set down his book, leaving behind the vast night sky of thoughts, and followed Jiang Qing’s invitation into the study. He sat down before his bowl without hesitation, picking up his chopsticks to take a bite of cucumber. Jiang Qing stood by the door, silently enduring his indifference. Xiao Sui’s grumbling echoed in her mind over and over again. Finally, her patience wore thin, and she made up her mind to speak: \"You don’t say a word to me, but I understand everything.\"\n\nMao Zedong didn’t respond. He simply chewed his food slowly, like an old ox ruminating, using the act of eating to dull his frustrations.\n\n\"Liu Shaoqi is turning the base area upside down, and you haven't said a thing.\"\n\nMao Zedong swallowed his bite and looked at her in mild surprise. This was the first time he had heard Jiang Qing comment on the Central Committee's affairs. \"What are you trying to do?\"\n\n\"For the past two weeks, you've been shutting yourself off, pretending not to hear what’s happening outside,\" Jiang Qing continued. \"I had to go ask Kang Lao and Zhou Enlai just to find out that you’ve been avoiding meetings, just like Lin Biao.\"\n\n\"We’ve been married for over twenty years, haven’t we? I’ve always followed your instructions, never interfering in politics. But let’s be honest, out of all the people sitting in that conference hall, who understands how to support you better than I do? Who is more reliable than me?\"\n\nAs she spoke, Jiang Qing walked from the doorway to the desk and sat down. With an almost tender gesture, she picked up some food and placed it in the Chairman’s bowl before making her request: \"I just want to be another pair of helping hands by your side. I’m afraid that if you keep bearing all this weight alone, you’ll just let go one day. If not for me, then at least think about your daughter.\"\n\nMao Zedong’s mind raced, but for once, he couldn’t immediately find his stance. A wife stepping into politics was an alluring proposal. Faced with the choice of refusal, he hesitated. Across the table, Jiang Qing seemed to glow like the bright moon—clear and unwavering. \n\nAfter five minutes of contemplation, Mao Zedong finally relented: \"Start with the small things first.\""
 CPC_main_story_events.4.o: "Even the moonlight was starting to sting the eyes."
 CPC_main_story_events.5.t: "Pendulum"
 CPC_main_story_events.5.d: "Liu Shaoqi convened a central work meeting, but Jiang Qing was not invited. However, she was not here to attend the meeting; she had a plan to secure a good future for her daughter. Li Na was about to graduate from university and needed to find an internship. The work unit required a recommendation letter for an interview. Although Jiang Qing was the wife of Mao Zedong, she could not write a recommendation for her daughter, nor could she ask Mao to do so. Instead, she sought Liu Shaoqi’s help to obtain this crucial letter—before this, she had approached Ma Xulun, but the old man flatly refused.\n\nInside the meeting room, voices never stopped, and the clock on the wall ticked incessantly. The hour hand moved from 10 to 11, and staring at the pendulum swinging back and forth for an hour made Jiang Qing dizzy. The relentless passage of time made her anxious, but she had to patiently wait for the meeting to end.\n\n\"If you want to dismiss me, just say it outright! Why put on such an act? Do you think I enjoy being scolded? I quit!\"\n\nBefore the words even finished, the meeting room door was slammed open with a loud *bang*, like a thunderclap. Zeng Xisheng, the Deputy Secretary of the Longdong District, stumbled out of the room and, as if no one else was present, shouted toward the whitewashed wall opposite, \"I’m suffocating in there!\"\n\nJiang Qing paid no attention to this ridiculous scene. As the clock chimed 11, Zeng Xisheng stormed down the hallway, completely oblivious to his surroundings. With the morning session concluded, most of the local officials attending the Xi’an conference either stayed behind to rest or gathered in small groups to head to the restroom. Meanwhile, the central leadership was moving next door for an impromptu meeting to discuss plans for the afternoon session. Liu Shaoqi and Bo Yibo exited one after another, neither showing any sign of satisfaction.\n\nJiang Qing stood up from her chair, patted the dust off her pants, took a deep breath to steady herself, and stepped forward to intercept them. \"Comrade Shaoqi, I have something to discuss with you. My daughter, Li Na, is about to graduate from university. I want her to intern at the Central Hospital, so I’d like to ask you to write her a recommendation letter.\"\n\nJiang Qing’s sudden appearance broke Liu Shaoqi’s train of thought, and for a moment, he was caught off guard. But his hesitation quickly faded. His mind turned over the situation once, and without the slightest pause, he flatly refused.\n\n\"Go talk to Zhou Enlai about this. I’m busy here. Don’t you usually go to him for these things?\"  \n\n\"I see…\"  \n\n\"He’s just behind us.\" Liu Shaoqi threw out these words and briskly walked away without looking back. Bo Yibo made no comment—he merely gave a slight nod before following closely behind."
 CPC_main_story_events.5.o: "The pendulum shows no mercy, carrying time away relentlessly."
 CPC_main_story_events.6.t: "Coral"
 CPC_main_story_events.6.d: "A decade ago, Ye Jianying accepted the mission to head south, forming a special committee with Wei Guoqing, Xiao Xiangrong, and Lu Shaowu. Their secret objective was to negotiate with Guangxi’s warlords. However, after a resolute rejection from Xia Wei, Ye Jianying immediately telegraphed Zhou Enlai: \"Sever ties with the Kuomintang warlords and establish an independent anti-Japanese force on-site.\" Under Zhou Enlai’s intelligence protection, Ye and his comrades became part of the underground resistance. In the northwest, people only knew that far in the southernmost coastal regions of China, there were still Communist comrades whose names occasionally surfaced in internal publications.\n\n\"A tree of red blossoms reflects upon the blue sea,\nA flame rises from the waters,\nThe coral tree blooms red like an eternal spring,\nEven amid wind and waves, its flowers never fade...\"\n\nThe choir rehearsed Coral Ode, its melodious tune easing Zhou Enlai’s exhaustion from long days of work. It was the anniversary celebration of the National Defense Front, and from the distant south, Ye Jianying had arranged for an underground Party member to deliver a rare gift to Xi’an—a lush, vibrant red coral.\n\nThe northwest had long been deprived of hope, but this coral, glowing with the deep red of revolution, carried the warm regards of distant comrades. To many, it was a symbol of a brighter future for the Front. The Party Central saw an opportunity to boost morale, and despite his fatigue, Zhou Enlai personally organized students from the Academy of Fine Arts to create an enlarged replica of the coral. On the day of the celebration, it would be placed atop a parade float, allowing the people of Xi’an to share in its joy.\n\n\"Clouds gather, mist conceals, yet within the haze, brilliance shines,\nWinds howl, waves crash, yet the flowers bloom undeterred...\"\n\nTo Zhou Enlai, these lyrics could not have been more fitting. The Party organization in Guangdong was like a coral tree—spreading branches far and wide, yet its core was as unyielding as stone. The brilliance of the revolutionary masses could never be smothered by the oppressive mist of the Japanese puppet regime. With unwavering resolve, they dedicated themselves wholly to the cause of national liberation, carrying out every directive from the Party Central without complaint. Some even embraced the label of \"Zhujin\", embedding themselves deep within the enemy’s ranks, infiltrating their institutions. This coral, so brilliantly red, was destined to bloom under the sun one day.\n\nAs the song echoed through the hall, Deng Xiaoping stepped in to inspect the rehearsal. Zhou Enlai beckoned him over to sit beside him and watch the choir perform. Deng noticed that the Premier seemed to be in good spirits—a rare sight these days. Deciding to prolong this brief moment of respite, he stayed to watch the entire rehearsal before moving on to his next task.\n\nListening intently, Deng Xiaoping could not help but comment, \"This song reminds me so much of one of the Chairman’s poems.\"\n\"Which one?\" Zhou Enlai asked.\n\"Ode to the Plum Blossom.\"\n\"Both use metaphors to portray resilience.\"\n\n\"Metaphors to portray resilience… metaphors to portray resilience…\" Deng Xiaoping repeated the words to himself, falling into deep thought. He was so lost in contemplation that he failed to notice the performance had ended, the hall now filled with the sound of prolonged applause."
 CPC_main_story_events.6.o: "The worst times will eventually pass."
 CPC_main_story_events.7.t: "Bargaining Chip"
 CPC_main_story_events.7.d: "In the reception room, five individuals sat around a table—leaders of the five major regions of the base areas: Lin Feng, Deputy Secretary of the Ningxia Region; Zhang Xiushan, Secretary of the Shaanbei Region; Zhou Lin, Deputy Secretary of the Shaannan Region; Tan Zheng, Secretary of the Guanzhong Region; and Gao Jianjun, Deputy Secretary of the Longdong Region. They had all been summoned and were awaiting an audience with the central leadership.\n\nHowever, Mao Zedong did not appear as they had anticipated. After a long wait, it was Vice Chairman Liu Shaoqi who entered, his expression dark and severe. Without a word, he slammed a stack of dossiers heavily onto the tea table, his glare sweeping across the five men. Close behind him was Bo Yibo, who strode in and immediately pointed at one of them, commanding, \"Zhou Lin, stand up.\"\n\nHearing his name, Zhou Lin shuddered, his body instantly cold. Trembling, he rose from the sofa, unable to meet Liu Shaoqi’s gaze. At that moment, Liu and Bo began their coordinated onslaught.\n\n\"Chairman Mao read your year-end report on Shaannan. Do you know what he said?\"\n\"The Chairman said: ‘How does the New Fourth Army keep producing people like this...’ I won’t say any more.\"\n\"You hear that? Even I got scolded by the Chairman! And I was once the political commissar for the New Fourth Army!\"\n\"Look at your fine achievements! The only places where famine deaths were rampant were Longdong and Shaannan—neck and neck in their failures.\"\n\"Cadres from the New Fourth Army have always been lawless. I learned that firsthand during the war. We won’t even talk about Xiang Ying, but just yesterday, Zeng Xisheng was shouting and making a scene in front of numerous central leaders—another shining example.\"\n\"Is this how you deal with the Central Committee?\"\n\"Zhang Desheng criticized you, and what did you do? You and your cronies seized his power, and you quite literally drove the rightful secretary to his death. You really had the nerve to do that.\"\n\"Peng Zhen also died under your watch. Local cadres—each one of them deserves the guillotine.\"\n\nAt this point, Liu Shaoqi tore open the dossier on Shaannan, yanked out a handful of documents, and flung them onto Zhou Lin, waiting for his response.\n\nAs things stood, Liu Shaoqi had every collapse report from the Great Leap Forward at his disposal. These damning materials, like bargaining chips, were helping him conquer one local region after another. Under the relentless assault from Liu and Bo, Zhou Lin was nothing more than a lamb awaiting slaughter, standing frozen, tears and snot streaming down his face. When the stack of documents hit him, his blood pressure spiked to the point of near collapse—he almost fainted on the spot.\n\nPerhaps this was the \"power of the dialectic in motion\"—a disgraceful political movement had instead become Liu Shaoqi’s stepping stone in his political career. Every chip in his hand was ready to be played, but at what cost? How many others would have to shed tears to pay for it?"
 CPC_main_story_events.7.o: "The Central Committee does not believe in tears."
 CPC_main_story_events.8.t: "The Road Home - [GetYear], Xi'an 301 Hospital"
 CPC_main_story_events.8.d: "As usual, Yang Yingcai stepped out of the doctors' residential building, preparing to start her day in the surgical inpatient department.\n\nThe morning sunlight filtered through the plane trees of the PLA General Hospital, casting soft, shifting shadows on the ground. A cool breeze swept through, carrying the lively chatter of young nurses rushing to work, playfully teasing one another. Their laughter, mingling with the crisp chirping of sparrows, helped dispel the last traces of sleepiness from Yang Yingcai’s mind.\n\nDuring yesterday’s team meeting, the deputy director mentioned that a new nurse would be arriving today. Curiosity stirred within her—who could this be, to warrant a personal mention from the deputy director?\n\nWith this question lingering in her mind, she strode into the inpatient building. A quick glance revealed a bustling crowd at the nurses’ station, but she paid little attention and headed straight for her office on the fourth floor. Walking through the corridor, framed by green walls, white trim, and gray cement floors, the cool-toned setting quickly calmed her, bringing her into work mode.\n\n\"Dr. Yang.\" The deputy director approached her. \"Do you have a moment?\"\n\"Of course, I still have half an hour before rounds.\"\n\"The new nurse in the inpatient department—you know who she is, right?\" He leaned in, an air of secrecy about him.\n\nYang Yingcai, however, only looked puzzled and shook her head. \"I was just wondering what kind of nurse would be important enough for you to bring up in the meeting…\"\n\nBefore she could finish, the deputy director cut her off. \"She’s… Chairman Mao’s daughter. Just graduated from nursing school. I hear she even wants to take the surgical assistant exam and is looking for a mentor. Want to come downstairs with me and meet her?\"\n\nDespite his words, the deputy director had already started walking, leaving Yang Yingcai frozen on the steps. It took her a long moment to fully process the shocking news she had just heard."
 CPC_main_story_events.8.o: "“Ah?\""
 CPC_main_story_events.9.t: "Cold Winds"
 CPC_main_story_events.9.d: "The morning sun shone brightly as the cold wind dispelled the lingering drowsiness. Inside a train carriage at Hanzhong Station, two square tables had been pushed together to form a conference table, covered with a tablecloth so thoroughly washed that it had faded white. On top, fifteen sets of green enamel tea mugs, filled with freshly brewed Qinling Spring Tea, steamed gently. Three white porcelain ashtrays were arranged symmetrically—only the one closest to the main seat contained ashes and four or five cigarette butts. Unlike the other seats, the main seat had an additional half-empty pack of cigarettes from Baoji Cigarette Factory.\n\nMao Zedong was meeting with provincial officials from Shaanxi here. This time, he bypassed the central authorities to deliver his instructions directly to local leaders. Two rows of heads sat in disciplined attention, eyes fixed on the deeply furrowed face of Mao.\n\n\"I’ve already mentioned this several times in central meetings, but today, I must remind you once again.\" Mao Zedong took a drag from his freshly lit cigarette, scanning the solemn faces before him. \"Do not engage in revisionism; uphold Marxism-Leninism. The people of the entire nation are still waiting for us to bring them liberation. If we ourselves become corrupted first, what hope is there for liberation?\"\n\nThe officials nodded in agreement, their expressions solemn.\n\n\"The base areas are facing another difficult period. You don’t need to worry about the hardships in Qinghai, but when it comes to production and construction, your efforts are indispensable. As I’ve always said—unity is essential, division is unacceptable. That’s all for today. You may disembark now, no need to see me off.\" Mao took another puff of his cigarette and gestured toward the guard in the carriage. \"He’ll take care of my belongings. No need to send anyone to accompany me.\"\n\nThe officials all respectfully bid him farewell, filing out of the carriage one after another. The sound of conversation gradually faded, leaving only the low wail of the train whistle echoing in the silence.\n\nMao Zedong stared at the untouched tea and the spotless ashtrays before him. Snuffing out his cigarette, he muttered to himself with resignation: \"They’re all just waiting for me to leave sooner.\"\n\n"
 CPC_main_story_events.9.o1: "One More smoke."
 CPC_main_story_events.10.t: "Gaming"
 CPC_main_story_events.10.d: "Pouring himself a cup of tea and lighting a cigarette, the man sat at his desk, carefully reviewing the day's routine affairs.\n\nThough it might be somewhat self-indulgent, every time Liu Shaoqi examined the economic conditions of the base areas, he couldn't help but feel that for the past fifteen years, he had been the one patching things up for the Party and Chairman Mao—implementing \"moderate but incomplete\" reforms, administering medicine and IV drips to the ailing National Defense Front.\n\nFor fifteen years, he had maintained unwavering diligence in political work. His position and prestige had risen to a level second only to one. Many cadres had begun to mention his name alongside that of Mao Zedong—\n\n—Yes, Liu Shaoqi, the second-in-command of the Chinese Communist Party. Measured and methodical in contrast to Mao Zedong’s sweeping boldness, he seemed to be the more suitable leader for the National Defense Front as it prepared to navigate the complex domestic and international landscape of the 1960s.\n\nLiu Shaoqi silently approved of this view—of course, only silently.\n\nHe continued to quietly fulfill his duties. As the old saying goes, \"nurturing all things in silence,\" his pragmatic spirit was garnering increasing favor both inside and outside the Party. When the time came, he would rightfully step into the spotlight, shouldering the burdens of the National Defense Front and becoming its new leader—not just for himself, but for the Party and the people.\n\n—With this thought, a subtle smile appeared at the corner of Liu Shaoqi’s lips. Flipping smoothly to the last page, he signed his name on an economic proposal."
 CPC_main_story_events.10.o1: "£Liu_Shaoqi_sign"
 CPC_main_story_events.11.t: "Firing Coal"
 CPC_main_story_events.11.d: "The hall was bathed in a dull, grayish sunlight. In the corner, a brazier crackled with burning charcoal. The windows, left open year-round for ventilation, allowed cold air to push against the rising heat, wrapping around the body in waves—at times comforting, at times chilling.\n\nAt the center of the stage sat an elderly man in a black cotton robe and a melon cap, his hands tucked into his sleeves, his neck drawn in, his head bowed—seeking warmth, but also unwilling to face the inquisitors whom he saw as utterly unreasonable. Below the platform, every person held a pen and a few sheets of paper, scribbling away as they documented the interrogation. The two-meter distance between the old man and the audience made him appear even more alone and defenseless, a solitary figure against the tide.\n\nAfter a brief, tense silence, the lead interrogator, seated at the center, spoke. \"Liang Shuming, have you recognized your mistakes?\"\n\nThe old man did not even look at him. He turned his face away, refusing to speak. His mind was elsewhere—replaying scenes from his time in the countryside, where harsh realities lay bare before him, a seething truth that festered like a silent fire in his heart, with no outlet for release.\n\nIt had been a bright morning when news came that Liang Shuming was arriving at the commune for an investigation. The county's leadership, from the Party secretary to the committee members, had all gathered at the entrance of Dapan Commune to welcome him in formation. Banners filled the sky, colorful flags fluttered in the wind—even the branches of trees at the village gate had eyes perched on them, watching his every move.\n\nUpon arrival, the rural survey team was escorted to dine and rest in a former landlord’s courtyard. Every meal was the same: millet rice, stir-fried yellow vegetables, and a boiled egg, as if grain was never in short supply. Anyone they wanted to interview had to be handpicked by the Party secretary, and even then, a \"county representative\" had to be present for every conversation. The selected villagers smiled broadly, spoke with rehearsed fluency—statements so polished they seemed almost unnatural. Yet, in the presence of the \"representative,\" further probing was out of the question. Forced into shallow pleasantries, how could this possibly be considered proper fieldwork?\n\nThen, one day, Liang Shuming pretended to use the restroom and slipped away. He walked five or six miles deep into the loess ravines, not stopping until his aging limbs could carry him no further. Collapsing onto the roadside, he massaged his leaden calves. Just then, a young couple passed by—both clad in worn cotton jackets, the woman with a white headscarf. A bamboo pole rested on the man’s shoulders, carrying two small children in slings, their heads bowed as they hurried forward.\n\nLiang Shuming quickly feigned a casual inquiry. \"Where are you headed?\"\n\nThe young man, seeing an old man resting, figured he could afford a short break. He set down his burden, sat down beside Liang, and struck up a conversation. \"Sir, we're going to visit some relatives. The harvest this year was poor—we barely reaped any wheat, yet the government took a huge share. We can’t even keep our pots boiling at home, so we’re taking the kids to my mother’s place for a while.\"\n\nLiang Shuming wanted to ask how much grain had been taken, but the woman, sensing the danger, pinched her husband’s arm in warning. Embarrassed, he fell silent, and Liang Shuming knew better than to press further.\n\nThe sudden crackle of burning charcoal jolted him back to reality. The interrogators had lost patience with his silence.\n\n\"Stop resisting. Just confess. Why did you misuse research funds?\"\n\nAt last, Liang Shuming spoke. \"I thought if the money was spent and every last measure of grain distributed, that would be enough to reach a conclusion.\"\n\n\"So you deny the Great Leap Forward? You deny the Three Red Flags? You deny agricultural collectivization?\"\n\n\"I only deny what is wrong.\"\n\n\"You… you old fool! It seems that your 'Rightist' label will stay right where it is.\""
 CPC_main_story_events.11.o1: "Mencius said: \"One cannot be bent by force or intimidation.\""
 CPC_main_story_events.12.t: "Meeting"
 CPC_main_story_events.12.d: "Gu Jiegang lay in a birchwood rocking chair, gently swaying back and forth, his head full of white hair, never far from the cane by his side. Across from the tea table, sitting on the sofa, was Xu Liangying. The dim yellow glow of an oil lamp illuminated the room, casting warm light on their faces. Near the doorway stood a shrewd, stocky man with a straight posture and a slight smile.\n\nXu Liangying immediately recognized him—Deng Xiaoping. Hastily, he invited him to sit. \"Mr. Deng, your sudden visit to my humble home—what guidance do you bring?\"\n\n\"Mao Chairman asked me to check in on you both,\" Deng Xiaoping replied, signaling for the guard to place a gift on the tea table. He then moved the oil lamp aside to prevent its flame from touching the meticulously tied red silk ribbon. \"A little tea, a little tobacco—a small token of appreciation.\"\n\nXu Liangying stood up to steady the package Deng had pushed forward. Though not large, its contents were unmistakable—a firm, compressed shape that felt like hardened biscuits, alongside a square box from which the rich aroma of roasted tobacco seeped through the woven fabric. Xu immediately recognized the gesture—a gift of Pu'er tea bricks and Yunnan leaf tobacco from the high-ranking leader before him.\n\nGu Jiegang, seeing the indigo-wrapped package on the table, cleared his throat and spoke. \"Mr. Deng, rest assured. If the Central Committee has need of us, we will do our utmost to assist.\"\n\nXu Liangying, however, took a different approach. \"But if you don’t clarify what exactly is required of us, we cannot accept undeserved gifts. Such a generous offering—we simply can’t take it.\" He promptly pushed the gift back.\n\n\"You two are no ordinary figures among the democratic personalities, especially Mr. Gu Jiegang, a man of great prestige. When you speak, it carries weight. The Central Committee is facing difficulties, and we hope you can support us at the upcoming assembly.\" Deng Xiaoping pulled out a few sheets of beige, lined paper, densely covered with neatly written characters. \"Everything that needs to be said is written here. I hope both of you can understand the Central Committee’s predicament.\"\n\nGu and Xu exchanged glances, immediately grasping the gravity of the situation. They solemnly agreed to Deng’s request but firmly refused to accept the gift. Xu Liangying picked up the package with both hands, intending to return it to the young guard. Yet, the guard backed away, unwilling to take it back. In the end, it was Deng Xiaoping who pressed it down firmly, only leaving after seeing their reluctant acceptance.\n\nCarrying the hefty package, Xu Liangying did not immediately open it. Instead, he placed it untouched in the inner storage room, where many other \"tokens of appreciation\" had accumulated—tables and chairs, wooden carvings, jade pendants, mineral spring liquors, walnuts, almonds. Now, the collection had grown to include tea and tobacco.\n\nStepping out of the room, Xu Liangying found the situation both amusing and troubling. \"Sigh, it's always the same—say no, they don’t listen; listen, they say nothing. If tempers hadn't flared, would the Ma Family Army have ever become an excuse…?\"\n\n\"Enough talk. Just do what needs to be done.\" Gu Jiegang tugged his blanket higher to warm his aching legs. \"You go and deliver tomorrow’s speech—I can't walk anymore.\"\n\nThe room fell silent, save for the rhythmic creaking of Gu Jiegang’s old rocking chair—creak, creak, creak."
 CPC_main_story_events.12.o1: "One who accepts a meal must heed the giver's command."
 CPC_main_story_events.13.t: "Message from Xinjiang"
 CPC_main_story_events.13.d: "To the Esteemed Gentlemen of Shaanxi,\n\nSince returning to Xinjiang after my studies, I have been entangled day and night in the mundane affairs of the Sheng household, unable to extricate myself. As such, I have found little opportunity to pay respects to Chairman Mao, Premier Zhou, and other esteemed comrades to deliberate on the grand strategy of revolution. Moreover, my defeat at Xingxing Gorge in the twenty-fourth year of the Republic was entirely due to my own shortcomings, and I am deeply ashamed.\n\nFortunately, the revolution in Northern Xinjiang has struck hard against the traitor Sheng, forcing him to retreat and cower in Dihua, too afraid to make a move. Taking advantage of this opening, I have returned to the great sea, traveling swiftly to Southern Xinjiang to gather my old forces and await the opportune moment for a counterattack.\n\nLacking great talent, I have recently led my troops in a fierce assault against the East Turkestan bandits, reclaiming Kashgar. However, the lands of Southern Xinjiang are barren, and the newly recruited soldiers are ill-prepared for prolonged campaigns. Progressing further proves difficult. I humbly beseech the esteemed gentlemen of Yan’an to provide aid and support. If granted such assistance, I shall forever be grateful and shall honor my past promise—to personally lead a brigade in securing Xinjiang.\n\nWith haste, I write this letter, hoping for your forgiveness in any lack of decorum. Words fail to express all that is in my heart. Once more, I wish you good health and well-being.\n\nRespectfully,\nMa Zhongying\n51st Year of the ROC First Month, 25th Day"
 CPC_main_story_events.13.o1: "A commendation telegram should be sent to praise General Ma for his righteous deeds."
 CPC_main_story_events.14.t: "The traveler from afar"
 CPC_main_story_events.14.d: "A sudden visitor barged into the Tianshui City Government Building—his sweat-soaked cyan short tunic clung to his back, a tightly fastened waist belt around his midsection. His face, deeply tanned and flushed from the scorching sun, bore a tense, slightly agitated expression. To onlookers, he appeared to be nothing more than a cart-pulling laborer.\n\nUnexpectedly, the man approached the receptionist and declared himself a messenger from Xikang Province, urgently requesting a meeting with high-ranking officials. When staff arrived to verify his identity, he produced credentials from the Southwest National Defense Front. However, his responses remained consistent—he refused to disclose anything beyond his plea for aid.\n\nMoreover, during the subsequent body search, he resisted fiercely, refusing to surrender the letter he carried. He insisted that it could only be unsealed in the presence of Zhou Enlai.\n\nThe Tianshui Party Secretary has since reported the entire situation to the Central Committee. The Xikang messenger is currently being held in the city, awaiting further instructions."
 CPC_main_story_events.14.o1: "Why do they come?"
 CPC_main_story_events.15.t: "Letter"
 CPC_main_story_events.15.d: "Esteemed Chairman Mao,\n\nThe Tibetan region has long been estranged from central authority, and its people have become resistant to governance. As a result, conflicts along the Kham-Tibet border have been frequent. Last year, the Dalai Lama made no effort to conceal his ambitions of dominating the western frontier, resorting to military force to launch a surprise attack against us.\n\nI am not a man lacking in courage—I am willing to shed my blood in battle. However, my army is too weak, struggling even to secure supplies and ammunition. Before long, we lost a vast stretch of territory.\n\nAt the time, knowing that Shaanxi was also facing difficulties, I attempted to contact Chengdu and seek reinforcements from Huang Yin, yet my plea vanished without a trace—no response ever came. I do not know what these men, who so easily gamble with the lives of others, are scheming in their hearts. Perhaps they are too busy offering tributes to Gao Zongwu, maneuvering through the bureaucratic circles of Nanjing’s officialdom.\n\nBut I never expected that they would invade Xikang instead.\n\nI cannot bear to watch Xikang perish at my own hands—the agony is as if a blade is carving into my soul. I earnestly plead with you, Chairman Mao, to extend your hand and save Xikang.\n\nLiu Wenhui\nChairman of the Xikang Provincial Government"
 CPC_main_story_events.15.o1: "How do we do?"
 CPC_main_story_events.16.t: "Viewing experience"
 CPC_main_story_events.16.d: "The bitter winter wind howled over the Ansai Kiln Factory, dispersing the steam rising from the chimneys and sweeping away the countless stars in the night sky. Unlike usual, the factory remained bustling and exceptionally warm even on New Year's night, as more than a hundred kiln workers sat in neat rows before a giant screen, watching a political propaganda film.\n\nAs expected, a familiar face soon appeared on the screen—Comrade Zhang Side, who had sacrificed his life eighteen years ago. His standard, fluent broadcaster’s voice suddenly rose in sync with the images:\n\n\"We come from all corners of the land, united for a common revolutionary goal. Today, the great, glorious, and correct Chinese Communist Party leads a base area spanning the northwest, home to twenty-nine million people. But this is not enough—we must march alongside the people of the entire nation, forging ahead on the grand socialist path and striving for the liberation of all!\"\n\nDespite the passionate and stirring imagery, the audience below remained somewhat indifferent, showing little emotional reaction. Some whispered to each other in small groups, others were more focused on asking their buddies for tea. As the film’s volume grew louder, so did the murmurs in the crowd, even accompanied by the occasional chuckle.\n\n\"Jiao Dahai, watch the news properly—stop chatting.\"\n\nThe deep, rough voice of the factory director suddenly rang out from the sidelines. The hushed conversations slowly died down.\n\nThe film lasted forty minutes, ending at nine in the evening. As the closing credits rolled, a bright overhead lamp suddenly flooded the entire factory hall with light, dazzling the workers so intensely that they had to squint, staying in their seats.\n\nBut they couldn’t leave just yet—they still had to listen to the factory director’s final summary speech. Holding his manuscript, the director had already stepped up onto the podium."
 CPC_main_story_events.16.o1: "\"Hold back your yawns for a moment—I'll say a few words, and then we'll wrap up.\""
 CPC_main_story_events.17.t: "Inner the wall"
 CPC_main_story_events.17.d: "The dim, endless corridor echoed with the heavy clang of a prison door.\"Ma Jiyuan, step out!\"\nThe armed guard called into the cell.\nAt the command, a weary figure slowly emerged, the clanking of his shackles accompanying his every step. Though his prisoner’s uniform was clean, and his face and body had been scrubbed by the jailers, they could not conceal the raw, bleeding wounds where the iron restraints had chafed against his wrists and ankles.\nToday, the former commander of the Ma Family Army was to be led to the execution ground. Only one final procedure remained—due to his high-profile status as a serious offender, a local military officer had to personally verify his identity before the sentence could be carried out.\nMa Jiyuan was escorted into the waiting room, where the officer awaited him. Facing the neatly dressed PLA officer, Ma scoffed coldly.\n\"The trial is over. Why verify anything? Just get it over with.\"\nThe officer ignored him. Adjusting his glasses, he scanned the dossier on the table from top to bottom before raising his gaze to examine Ma’s frosty, unyielding expression. Letting out a long sigh, he finally spoke.\n\"General Ma, you once bore the weight of both national and personal grievances. We Communists have no enmity with you—why did we not fight against the Japanese together?\"\n\"You Communists destroyed our faith. How could I stand by and do nothing?\"\n\"I could explain everything to clear up these misunderstandings, but first, let me be clear about the Central Committee’s stance.\"\nWith that, the officer slid a document across the table, stamped in red ink.\n\"We sincerely hope to put aside past hostilities, General Ma. If you sign this 'Letter of Repentance,' we will fully restore your name. We could even reinstate you as a general.\"\nA pen was placed before him. The officer’s eyes shone with expectation.\n\"Sign it.\"\nMa Jiyuan ignored the pen, his gaze instead locking onto the three bold characters—\"Letter of Repentance.\"\nEverything else in the room blurred into the background. Only these three words seared into his mind, burning with an intensity that made him wish he could set them ablaze with his own eyes.\nSensing his hesitation, the secretary beside the officer stood up to chime in.\n\"General Ma, do not waver. This is the Central Committee giving you one last chance to redeem yourself.\"\nBut to Ma Jiyuan, there was no doubt. China could only be saved without the Communists or the Japanese. Everything he had done was divinely ordained—the will of Allah above, the will of the people below. Reconciliation had never crossed his mind. Confession even less so.\nHe lifted his head high, ready to die for the Holy War to save China.\nSeeing this, the officer could only let out another deep sigh, before waving his hand. The guards dragged Ma Jiyuan away.\nThe prison fell into a long, suffocating silence. Time crawled forward, the wait unbearable.\nThen—A single gunshot pierced the sky."
 CPC_main_story_events.17.o1: "Solver a problem."
 CPC_main_story_events.18.t: "Battle of Hehuang"
 CPC_main_story_events.18.d: "\"Comrades, it’s our turn to head to the front lines!\"\n\nCompany Commander Wang’s voice was low and steady, yet it had the magnetic pull of a lodestone, instantly drawing the soldiers' emotions, eyes, and full attention.\n\nHe unrolled a large four-sheet hemp paper map on the wall and pointed at a red-marked location:\n\n\"Ma Jiyuan is ordering his forces to advance north while planning to have his Ma family relatives attack from the south, attempting to crush us in the Longxi region. Just look at their grand scheme! Now, here are our tactical directives:\n\nThe Qinghai Ma bandit army is one of the most tenacious enemies in the entire country. We must fully acknowledge their strength—any underestimation would be a mistake.\nWe must concentrate our forces, firepower, and technology on a single point. Every hilltop, every position—if we attack, we must ensure victory.\nIn an offensive, we must prepare for enemy countercharges. Organize counter-charge suppression fire and fortify defensive positions against enemy assaults.\nFocus superior artillery fire on a single point. Once secured, move on to the next target. Maintain close coordination between infantry and artillery.\nTo overcome the enemy’s outer trenches and steep defenses, we must dig approach trenches, alter the terrain, and use explosives for demolition.\nComrades, let’s first discuss how to conduct the next battle.\"\n\nThe first platoon leader spoke up first: \"The Xining forces are packed too tightly together—we can’t break through just yet. We should take out the enemies in Qilian and Haiyan first, lure them out, and even if we can’t completely encircle them, it will at least ease the pressure on our comrades in the east.\"\n\nPolitical Instructor Zhou nodded: \"Exactly! The enemy wants to split their forces and encircle us here. But we won’t wait for them to act—we’ll strike first and leave them dizzy. That way, first, we shatter their encirclement plan, and second, before they can regroup, we’ll wear them down bit by bit.\"\n\nA squad leader added: \"If we push south from here, we’ll have to cover three or four hundred miles—and cross a desert! We need to account for that.\"\n\nPlatoon Leader Ma responded: \"Mountains, forests, deserts—no matter what, the Party has sent us to the ends of the earth to help the working people rise up. If we were afraid, what kind of Communists would we be?\"\n\nThe air inside the cave was stuffy, yet the men murmured and debated among themselves. Meanwhile, Deputy Company Commander Wang Biao crouched quietly in the corner, deep in thought—his greatest wish seemed to be that no one would notice him.\n\n\"Old Tiger, speak up! They say among three people, there's always a strategist. The more we discuss, the clearer our plan will be.\"\n\nWang Biao stood up, smiled slightly, and said:\n\n\"Comrades! The higher-ups have decided on the Hehuang Campaign. We will march from the Longbei Subregion to crush the Ma bandits. The enemy fears us breaking out from Longdong and striking at their rear. So, the moment we move, Ma Jiyuan will have no choice but to follow us...\n\nThat’s when we’ll chip away at his accomplices, one by one—until Ma Jiyuan is completely isolated. Then, he’ll be easy to defeat.\""
 CPC_main_story_events.18.o1: "Shoot the horse before the rider; capture the leader before the followers."
 CPC_main_story_events.19.t: "What we are fighting for(1)"
 CPC_main_story_events.19.d: "The cold Siberian front, carried by the roaring northern winds, swept across the Ordos Grasslands, pushing deep into the rugged mountains of the northwest. Once again, the Loess Plateau returned to its natural state—desolate, barren, and inescapably impoverished.\nJi Dengkui stood at the entrance of a peasant courtyard, holding a bowl of wild vegetable porridge. His heart felt like a bitter mix of emotions—as if a bottle of five flavors had been overturned.\nThe weather had turned freezing, yet his soldiers had no winter clothing. No rice for the pot. Nearly half the troops were former prisoners, and violations of the Three Rules of Discipline and Eight Points for Attention were becoming frequent. Sighs and complaints filled the barracks.\nJi stared blankly at the barren mountains in the distance, as if trying to forget everything.\nAn hour passed—the porridge in his bowl froze into a solid lump of ice.\nScenes from last winter’s failed attack on Minhe resurfaced in his mind. That battle had left a knot in his heart that he had never been able to untangle—a mistake born from reckless overconfidence, leading to an ambush by the Ma bandits, costing over a hundred men.\nIt was a bitter lesson—rushing an attack was no solution.\nThe sight of hungry soldiers fighting on empty stomachs had taken root in his mind, refusing to fade.\nJust as he had once reported in a telegram to headquarters—some units had gone five days without a proper meal, surviving only by slaughtering their own mules for food. In the harsh depths of winter, some soldiers were still in thin summer uniforms, shivering until they had no choice but to strip clothing from the dead to keep warm.\nBut what worried him the most were the increasing reports of troubling developments within the army.\nSince the Ma bandit rebellion broke out, after months of fighting, the army had failed to recruit local forces—instead, most reinforcements were prisoners of war.\nSome units had prisoners making up 80% of their ranks, with even the lowest proportion exceeding 40%.\nThe mass integration of captured soldiers raised serious concerns about discipline and ideological commitment, robbing Ji Dengkui of sleep.\nThe term \"rabble\" suddenly surfaced in his mind.\nMore than half the army was made up of former Kuomintang soldiers—how could this not lead to problems?\nIf a former Kuomintang officer was secretly hiding among them, what if he rallied the prisoners—could there be a mutiny?\nThe war—clearly, it could not continue.\nA long period of reorganization was needed. The army’s quality and ideological awareness had to be raised.\nJi Dengkui set down his frozen bowl of porridge, his mind heavy with concern, and sought out Regimental Commander Li.\n\"Do you have any good ideas for educating the newly recruited soldiers?\"\n\"Yes!\" Li answered loudly. \"Our 772nd Regiment has some successful experience.\"\n\"Tell me—quickly!\" Ji urged impatiently."
 CPC_main_story_events.19.o1: "Regimental Commander Li began speaking at length about the experiences of the 2nd Battalion."
 CPC_main_story_events.20.t: "What we are fighting for(2)"
 CPC_main_story_events.20.d: "\"After capturing Xunhua, the battalion replenished its ranks with a batch of soldiers who had been ‘liberated.’ At first, these 'liberated' soldiers were very arrogant. They were upset about being captured, and they complained that our army fought dishonestly, engaging in sneaky tactics. They even said that if we were to fight on an open battlefield, they might be the ones to be captured! They were difficult to handle, arguing loudly and even resorting to physical fights.\n\nThe battalion political instructor, Xia Wei, was very concerned about these ‘liberated’ soldiers. He would often ask how they were doing, and during marches, he would have the veteran soldiers carry the packs of the newly ‘liberated’ ones. One of them was deeply moved, saying that at home, they had been bullied by landowners and imams, and in the Kuomintang army, they were often beaten by their superiors—they had been punched and whipped. They never expected that in the Communist army, the officers would treat them so well. Even though there was a lack of clothes and food, their hearts felt at ease.\n\nInspired by this, Commander Wang Keqing immediately organized a complaints session for the entire battalion, encouraging everyone to voice their grievances—whether it was the hardships of life at home, their struggles in the Kuomintang army, or their suffering in general. During the session, they learned that almost all the soldiers came from poor backgrounds, suffering from oppression and abuse at the hands of landlords. Most of the ‘liberated’ soldiers had been forcibly conscripted by the Kuomintang, enduring slaps and lashes from Kuomintang officers. But in our army, not only had they never been beaten, but they were often looked after by the officers.\n\nThis comparison and catharsis had a huge impact. The ‘liberated’ soldiers’ morale was boosted, and their relationship with the regular soldiers improved significantly. Later, the experience of the 2nd Battalion was adopted by the entire regiment, with great success. In subsequent battles, the 772nd Regiment always led the charge, earning numerous military achievements.\"\n\nAfter hearing these real-life examples, Ji Dengkui felt a renewed sense of energy. The gloom that had clouded his mind lifted, and he couldn't help but applaud in admiration."
 CPC_main_story_events.20.o1: "\"This is great, we need to implement it immediately across the board.\""
 CPC_main_story_events.21.t: "Central Military Commission's Directive on Troop Re-equipment and Training Reform"
 CPC_main_story_events.21.d: "Lin Su, Xu, and to the Northwest Bureau and the Front Committee:\n\nRegarding the Qinghai Operation: Based on initial feedback and reviews, it has become evident that our equipment has seriously hindered combat effectiveness. After discussions and research by the Central Military Commission, a decision has been made to replace the equipment of all units and carry out reorganization.\n\nDetailed planning: Return the units to the rear in three stages in an orderly manner, remaining vigilant, protecting the remaining forces, and safely guiding the entire force back to the liberated areas.\nParty committees and leadership at all levels: During the return to the liberated areas, ensure that the troops are organized for combat preparedness marches, maintain secrecy, and prevent non-combat attrition.\nPreparation for reporting to the Party and the people: Immediately begin summarizing the performance of the troops in the Qinghai operation, as well as the deeds of heroic figures.\nComprehensive review: Thoroughly summarize the experiences and lessons learned in combat, political work, and logistical support.\nAccurate statistics: Record the losses and damages to personnel, horses, and artillery.\nProper arrangements for wounded and sick personnel: Ensure their return to the rear for treatment. Select proper burial sites for martyrs, erect gravestones, and bring back their personal belongings for safekeeping.\nStrictly enforce discipline among the masses: Ensure that items are returned, and damages compensated.\nDo something substantial for the Hui people before returning to the liberated areas.\nDiscipline must be strictly adhered to during the return journey.\nIssued by the Central Committee\n\nZiyou"
 CPC_main_story_events.21.o1: "Reedy to go"
 CPC_main_story_events.22.t: "Old friends"
 CPC_main_story_events.22.d: "\n\"Youcheng, I didn't expect you to be here in Aksu!\" Liu Wenliang, who had just arrived at the Hongqi Po farm, looked at his old friend Ren Youcheng with a surprised expression, his joy evident. \"After the Four Clean-ups started, you left Xi'an, and I only heard that you went to Xinjiang to join the farming team.\"\n\nRen Youcheng grinned, put his arm around Liu Wenliang's neck, and said self-deprecatingly, \"I'm a child of the 'black five categories.' If I didn't leave Xi'an, I would have just been targeted for criticism! When I first got to Aksu, our team was just imitating the experience from Gansu... Yes, the Baiyin experience! Everyone passed the examination, but after being criticized and sent to the mountains to herd sheep, they called it work, but it was actually exile. Still, I’m born to be free, and in the woods, I could read aloud or play the harmonica with a comb—what a carefree life!\"\n\nHearing this, Liu Wenliang felt a touch of sadness, and his thoughts drifted back to the early days of the Four Clean-ups in Xi'an. At the start, they had indeed arrested many corrupt officials. But as the movement deepened, things such as words, actions, or even trivial issues became potential grounds for punishment...\n\n\"Come on, I’ll show you the farm!\" Ren Youcheng interrupted Liu Wenliang's thoughts and led him into the farm. \"When I came back to join the farming team half a year ago, the farm had changed a lot since I first arrived. The poplar forest to the north has been converted into wheat fields, and the grassland to the south has become a ranch.\" As they walked further in, Liu Wenliang saw small mud houses partially buried in the ground. \"This is where we sleep, on big communal beds. Half of it is on the ground, half is underground, warm in winter, cool in summer, and protected from the wind. When it was first built, a brigade secretary didn't believe in the local Uighur advice and insisted on building a completely above-ground mud house. In less than three months, the house was blown down by the wind, and people were buried alive!\" Ren Youcheng said with a mixture of sorrow and humor, his tone almost like a \"funeral in celebration.\" \"But you're lucky that it’s not too hard for you. Three months ago, the farm received two old tractors, but the maintenance level is only good enough for oiling. Who knows how much longer they’ll last, but it's much easier than before. When we had horses, it was manageable. Without horses, though, it’s tough.\"\n\nLiu Wenliang asked, \"By the way, Youcheng, what are you doing now? Still farming?\" Ren Youcheng, hearing the question, grabbed Liu Wenliang's hand and led him toward a small building. \"Recently, I was farming, but then the secretary found me and said that since I was a high school student from Xi'an, he wanted me to help the farm with the electricity and lighting installation. So, in the small workshop on the farm, the one in front, they arranged a station for me.\" Ren Youcheng led Liu Wenliang into the building, where they saw a transformer with copper wire still being wound. Liu Wenliang asked, \"Isn't it tiring to wind the transformer by yourself?\" Ren Youcheng confirmed it and then pointed to a broken sewing machine in the corner. \"I want to transform that sewing machine into a wire-winding device. Interested?\" Liu Wenliang grinned and, instead of responding with words, got to work. The two of them started figuring out how to modify the sewing machine, chatting as they worked.\n\nPerhaps because they were reunited, Ren Youcheng became more and more excited as he spoke, while Liu Wenliang felt a deep sense of reflection. But just then, loud noises came from outside the building. Liu Wenliang asked, \"What's going on outside?\"\n\n\"Criticism sessions. They're holding some sort of summary meeting for the Four Clean-ups. They say it's a summary, but really it's just another round of pulling people out to criticize them. During the most intense period of the Four Clean-ups, someone was tied to a tree and nearly died of thirst.\" Ren Youcheng stopped himself from saying more, knowing that, as a child of the \"black five categories,\" he had escaped criticism only because he had been effectively exiled. He was lucky and had behaved well enough to avoid being targeted.\n\nLiu Wenliang fell silent for a moment and then said:"
 CPC_main_story_events.22.o: "Once everything is summed up, the matter will be settled."
 CPC_main_story_events.23.t: "A grain of dust in the era"
 CPC_main_story_events.23.d: "Strictly speaking, Lin Feng didn’t have a formal job at a factory, but he knew many electrical repair techniques, and it was this skill that allowed him to make a living, traveling all around the city for work. He loved life, got along well with his neighbors, and often helped fix electrical appliances for them. However, a few days ago, he was accused of being involved in a robbery case, though he knew nothing about it.\n\n\"Lin Feng, stop pretending!\" The interrogator coldly stared at him, placing one piece of evidence after another on the table. \"Several witnesses have stated they saw you at the radio factory site. Come clean, don’t think you can escape by lying!\"\n\nLin Feng was shocked and quickly shook his head. \"This is a misunderstanding, comrade! That day, I went to the housing district to fix a fan for a family; I never went anywhere else!\" But the interrogator clearly didn’t believe him, sneering, \"Do you think pretending to be innocent will get you off the hook? This is a crackdown—severe and swift! Confess for leniency, resist for harsher punishment, hurry up.\"\n\nLin Feng felt a fear he had never experienced before. His once warm home seemed to fade from his mind, the cold walls of the interrogation room closing in around him like a prison. The interrogation went on and on, his mind growing more and more muddled, to the point where he started doubting himself. How did it come to this? If convicted, the stigma would follow him for the rest of his life.\n\nThree days later, he was officially detained and sent to the Xi'an Detention Center. There, he met others who had also been accused. One of them, Xiao Li, was a street vendor who had been arrested after a witness \"identified\" him. Like Lin Feng, Xiao Li was unable to defend himself, and every time he spoke of his innocence, he would break down in tears. He told Lin Feng that very few people here could prove their innocence. The phrase \"severe and swift\" had become their nightmare—no one knew what their fate would be.\n\nA week later, Lin Feng’s mother was allowed to visit him. She looked haggard, her eyes swollen from crying. \"Son, I believe you didn’t do those things! I’ve been so anxious, I haven’t slept for nights!\" Her hands, covered in wrinkles, gripped his tightly, her eyes full of despair.\n\n\"Mom, I’m innocent!\" Lin Feng gritted his teeth, choking on his words. \"But I’m afraid… no one will believe me.\" His mother wiped away her tears, forcing a smile. \"Don’t be afraid, my child, I’ll find a way.\"\n\nIn the following days, his mother ran around, seeking out Lin Feng’s colleagues and neighbors, trying to prove his innocence. However, many people were afraid of being implicated and refused to speak up. Even those who were willing to testify were met with cold responses and were told, \"Don’t interfere.\" A month later, Lin Feng’s case finally went to trial. In court, the prosecution presented several testimonies, but their contents were vague, and even the exact time of the crime was unclear. Lin Feng repeatedly appealed about his whereabouts at the time, but the judge ignored him.\n\nIn the end, Lin Feng was sentenced to five years in prison, found guilty. He was sent to prison to serve his sentence.\n\nEvery morning, as he gazed out at the small patch of gray sky outside the prison window, his heart was filled with endless sorrow. The life he once knew seemed like a distant dream, and his mother’s visits were his only solace. Each time they met, his mother would tightly grasp his hand with trembling fingers, constantly telling him to hold on, that one day his innocence would be proven."
 CPC_main_story_events.23.o: "For an individual, this is a towering mountain."
 CPC_main_story_events.24.t: "Why has the iron fist struck my head?"
 CPC_main_story_events.24.d: "The workers' club at the mechanical factory had finally distributed the overtime pay they had fought for. Holding their overtime pay in their hands, the workers wore smiles that were rare for them. It was all thanks to Old Zhong, the club leader and a party member. Although he was usually quiet, he always had the workers' best interests at heart and worked tirelessly on their behalf.\n\nFor the past few months, the factory had been under heavy pressure, and the workers had to work day and night to meet the deadlines, but the factory had delayed the overtime pay. The workers were frustrated and, after several attempts to confront the leadership, had been met with empty excuses. After hearing this, Old Zhong went to negotiate with the leadership. His attitude was both gentle and firm as he said, \"Comrades have worked hard overtime; the factory should give them a proper explanation. Otherwise, how can they work with peace of mind?\" The factory leadership, though knowing that Old Zhong was well-respected, still dismissed him with, \"Old Zhong, the factory is facing financial difficulties right now. Please have the workers understand.\"\n\nOld Zhong realized the leadership was once again stalling, so he turned into a stubborn mule, relentlessly pushing the issue for several days. After several rounds of arguments, the factory finally agreed to pay the overtime wages. The workers gathered around Old Zhong, expressing their gratitude. Old Zhong waved his hand and smiled, saying, \"It’s nothing, the club’s job is to do this.\"\n\nBut just a few weeks later, the situation changed dramatically.\n\nOne morning, a notice was posted on the factory’s bulletin board: \"The mechanical factory workers' club has been swept by an 'economic black wind,' focusing solely on economic interests and ignoring the broader socialist agenda. The club is to be disbanded immediately.\" The local party’s official seal was prominently displayed at the bottom of the notice. The factory's veteran workers were furious upon seeing this. Fighting for the workers' overdue wages seemed like the most natural thing, so how could it be labeled as a \"black wind\"? One worker found Old Zhong, and many other workers gathered around, some angry, some complaining. The atmosphere was heavy, as if a massive stone had been placed on their chests.\n\n\"Old Zhong, why is the party saying it's a 'black wind'?\" A young worker asked, his face full of anger. \"Just because we got the overtime pay for everyone?!\"\n\nOld Zhong silently lit a cigarette, stared out the window, and said in a low voice, \"The higher-ups think we are focusing only on immediate benefits. If other factories start following our example, it will affect labor productivity.\" He looked at everyone, his eyes filled with reluctance. \"From now on, the factory matters will be up to you. I will most likely be transferred.\"\n\nA few days later, the workers' club was officially disbanded. On that day, a heavy fog hung over the factory area. The workers gathered outside Old Zhong’s house, waiting for him to pack his last belongings. Old Zhong stood in front of them, his voice somewhat choked with emotion: \"The club is gone, but our bond remains. We will continue to take care of each other, heart to heart. This factory will still be our home!\" The workers nodded, but their spirits were low. As they watched Old Zhong’s figure fade into the distance, they pondered why a socialist system led by the working class would suppress workers. Perhaps the answer would only emerge years later—or perhaps it would never be answered at all."
 CPC_main_story_events.24.o: "Thunder and rain, both are blessings from heaven."
 CPC_main_story_events.25.t: "Workshop Work Diary"
 CPC_main_story_events.25.d: "[GetYear]one day\nAt the third workshop team meeting, feedback was provided regarding the new technology, and the results were positive. The finished product rate has increased by 20%, but the raw material consumption has also gone up.\nThe technical school sent a group of new interns: three were assigned to the fitter class, six to the metalworking class, and two outstanding students were sent to the inspection team for learning.\nWorkshops 1, 2, and 6 showed high enthusiasm for labor and met their production targets. The suggestion is not to raise the targets temporarily to avoid discouraging motivation.\nIn Workshop 5, Worker Chen requested the implementation of labor protection subsidies, and the response was that the wage advance should be prioritized for settlement.\n\n[GetYear]another day\nA temporary workers' meeting is scheduled for the day after tomorrow. We need to prepare the meeting venue, speeches, and banners. The focus is to encourage workers to support the new policies and complete new tasks. Administrative positions will be adjusted, and the production area will be expanded.\nTalks and education sessions will be held with the interns to ensure they learn both theoretical knowledge and practical skills, while also familiarizing them with the factory.\nA thief was caught during the night shift, and the security department has been instructed to hand the case over to the public security authorities.\n\n[GetYear]some day\nAn organizational meeting was held for cadres to study and discuss, with the party secretary sending out the study materials in advance. Here’s a passage that was excerpted for discussion:\n\"Grain is fundamental, iron is the backbone. Workers and farmers advance together, continuing to move forward.\"\nA discussion was held about sending a few people from each department to study in Xi’an, but no decisions were made.\nSuddenly, the inspection team reported an incident where intern Wang Xin and worker Li Ping had a fight. Wang Xin, who spoke aggressively, was beaten. After being sent back to school, he was sent to the hospital for treatment. Li Ping wrote a self-criticism.\nDuring the night shift, lights were on for continued study of materials, and workshop target allocation was finalized."
 CPC_main_story_events.25.o: "Labor creates the world."
 CPC_main_story_events.26.t: "\"The Spirit of Changqing, the People of Changqing\" (Excerpt)"
 CPC_main_story_events.26.d: "Many workers say that they did not experience the hardships of the Long March, nor were they tested by the struggles of the Anti-Japanese War. Today, however, by coming to Changqing to participate in the construction of the oil field and enduring some hardship for the grand ideal of liberating the entire nation, they feel it is an honor! They deeply understand the great significance of carrying forward the revolutionary traditions of hard work, self-reliance, and perseverance. They are willing to endure great suffering, work hard, remain fearless in the face of danger, and, if necessary, even sacrifice everything personal, viewing these as honorable and fulfilling! Isn't this the most distinctive characteristic of the people of Changqing?\n\nWang Jinxie, an experienced oil worker with over twenty years of service, is known as the \"Iron Man\" of Changqing Oil Field. He is the embodiment of the Changqing spirit. Back then, how many difficulties awaited them in life! However, when the forty-something-year-old Wang Jinxie was assigned to the Changqing Oil Field in March 1960, he did not buy clothes or daily necessities. He sent his bedding and clothing via train shipment and only took a copy of Selected Works of Mao Zedong with him. Upon arriving in Changqing, he didn’t ask about accommodations or meals—his first question was, \"Where are the wells to be drilled?\" He immediately went to inspect the construction site and survey the drilling routes. The drilling equipment had arrived, but the lifting equipment had not yet been delivered. What to do? He and the workers carried the entire 60-ton set of drilling equipment off the train by hand, carrying the heavy loads on their shoulders. Their hands and shoulders were covered in blisters, but no one complained. Once the drilling started, each drill rig required at least 40 to 50 tons of water daily, but the water pipes hadn’t been installed yet. Should they wait? No. Wang Jinxie led all the workers to a small lake over three miles away to fetch water, ensuring the drilling could continue. This was the arduous effort that led to the completion of the first well.\n\nThe silent earth and the complex layers of rock were like a fierce, untamable beast to the drilling workers. During the drilling of the third well, an indication of a blowout occurred. If the blowout happened, the wellhead structure could be swallowed up by the ground. At that time, Wang Jinxie had injured one of his legs, but he still guided the production with crutches. In this critical moment, he ordered the workers to increase the mud concentration and weight to suppress the blowout. Without hesitation, he threw away his crutches, jumped into the mud pit with a splash, and used his hands and feet to stir the mud, mixing it thoroughly. After over two hours of intense struggle, the blowout was avoided, but Wang Jinxie and two other workers who jumped into the pit had their skin badly burned by the highly alkaline mud. When the oil field cadres came to visit, he patted his chest and said, \"I’d rather live twenty years less, but I will give my all to take down this great oil field!\"\n\nAt that time, Wang Jinxie was staying at a local villager's home near the construction site. The landlord, an elderly woman, brought a basket of eggs to the construction site to visit the drilling workers. She spotted Wang Jinxie at a glance, ran up to him, and, excitedly, said, \"Jinxie, Jinxie, you are truly an 'Iron Man'!\"\n\nHeroes like Wang \"Iron Man\" are not unique in the Changqing Oil Field!\n\n— Liberation Daily"
 CPC_main_story_events.26.o: "The working people are the most honorable!"
 CPC_main_story_events.27.t: "Friendship still here"
 CPC_main_story_events.27.d: "\"Your clothes are still too old. Do you think you could get a coat from the logistics officer under General Huaxi by using your Russian when you get there?\" The horse-drawn team of the National Defense Front slowly appeared from the grasslands, making their way across Mongolian land to determine the fate of the northwest. Gao Gang sat on his horse, gazing into the distance, and, after lowering his binoculars, teased Lin Hu, who was known as the \"Russian expert\" among them, because he had spotted the personnel from the People's Committee who were coming to greet them.\nLin Hu picked up his marching flask filled with strong liquor. \"To get something from the Russian warehouse, it depends on whether they are willing to give it. If not, we’ll either knock them out or make them willing to hand it over.\"\n\"I doubt they can drink as much as you,\" Gao Gang remarked, and their laughter echoed across the grasslands.\nThe Mongolian conflict had ended, and the Mongolian soldiers of the People's Committee were returning to their homeland. Huaxi Lievski, knowing that Simón was not a permanent residence, had to prepare to head north to continue fighting for Russia's destiny. However, since they were both Communists, Huaxi didn't mind leaving a few small gifts for his Communist comrades in Mongolia and China before he departed, which was why the banquet was being held.\n\nGao Gang took a sip of bitter tea, the bitterness exploding in his mouth, much like the current situation of the Front and the Soviet Army. In the midst of this bitterness, he remembered the crates of munitions he had glimpsed when entering the camp.\n\nThe tenderness of the lamb was not as appealing as the military supplies to the two men. Lin Hu was conversing in Russian with Huaxi Lievski and poured him a drink. Gao Gang began to ponder where to start his next conversation: the warlords of Russia? The common enemy of Japanese imperialism? The reconstruction that would follow the cessation of violence in Outer Mongolia?\n\nThe Mongolian translator, speaking in simple Chinese, conveyed Huaxi's attitude. He pointed to the empty glass and said, \"Mongolia is not in immediate danger, and staying here will only dull our will. But preparing for the reconstruction of the Soviet Union is a much harder task, and we don’t even have grain to brew the liquor.\"\n\nGao Gang immediately understood the general's implication and swiftly responded, \"What weapons can you offer in exchange for food?\"\n\n\"Infantry equipment, field artillery, and anti-tank bazookas capable of piercing Japanese tanks. Let’s see how much food you can provide in exchange.\"\nA few days later, a car, personally gifted by Huaxi Lievski, drove along the rough road back to Xi’an. The core members of the team were riding in the car, their bodies bouncing and shaking just like when they were riding horses on their way to Mongolia.\nThe deep night sky in Mongolia was as profound as that of the northwest. Gao Gang and Lin Hu knew they would likely not sleep tonight, but both were happy and more relaxed than they had been in a long time. Gao Gang’s mind kept returning to Huaxi’s words before they parted: \"I’ve been away from home for many years, and I don’t know if I’ll ever see Moscow again in my lifetime. I hope we all return home safely...\"\nIn the dark of the night, only the roar of the engine and the light of the searchlights continued to split the deep darkness of the long road ahead."
 CPC_main_story_events.27.o: "The road home is so distant."
 CPC_main_story_events.28.t: "Seeds"
 CPC_main_story_events.28.d: "The gentle spring sunlight poured over the vast and boundless Hetao Plain, a place that represented Liu Feng's dreams. As a young agricultural science student with an infinite love for the land, he worked tirelessly on this fertile soil day after day, driven by the dream of cultivating superior seeds and changing the fate of his hometown.\n\nYears of famine forced him to abandon his plans to continue his studies and, together with his peers from the Agricultural Science Institute, he resolutely threw himself into the work of breeding better crops in the Hetao Plain, beginning a new journey. They pored over various agricultural books, searching for advanced breeding techniques; they visited old farmers, humbly sought advice, and gathered every possible clue that could help improve the seeds. They buried themselves in the dry saline-alkali soil, brainstorming ways to establish irrigation and drainage systems to draw out the salt from the ground, to reshape the soil structure of the fields.\n\nAs night fell and the stars twinkled, Liu Feng lay in a humble wooden hut, his heart restless. The prolonged drought felt like a massive stone pressing on his chest, making it impossible to sleep. In his dreams, he seemed to find himself in a desolate wasteland: the scorching sun dried the land, crops withered, rivers ran dry, and fields lay barren, with children sucking on the scant rice water left in bowls… This was the scene he dreaded most—drought, famine, death.\n\nWhen the first rays of morning light pierced through the curtains, Liu Feng suddenly awoke, realizing he was no longer in the stifling hut, but in a makeshift shelter by the dam. Around him, busy figures worked together, reinforcing the dam in preparation for the upcoming irrigation season. The morning dew shimmered on the grass tips, as if nature’s most tender comfort, slowly calming his restless heart.\n\nThough the dream had been harsh, it served as his motivation to press forward. He stood up and looked out over the land he loved so much, a surge of unprecedented determination rising in his heart. He knew that to cultivate drought- and flood-resistant seeds on this land, it would take not only the irrigation of sweat but also wisdom and persistence. Later, after countless days and nights of hard work, with the help of many fellow comrades, the Hetao experiment team at the Agricultural Science Institute successfully bred several new crop varieties that could thrive even under drought conditions.\n\nThe plain was now teeming with life, and many young, sun-darkened faces were filled with hopes for a bountiful harvest. Youth shone in the sweat of their labor, and their stories, like a romantic pastoral poem, were being sung across the Hetao Plain."
 CPC_main_story_events.28.o: "The immortal chapter is slowly unfolding..."
 CPC_main_story_events.29.t: "A decade isn't still too late?"
 CPC_main_story_events.29.d: "Li Fu and Yu Zheng rode swiftly across the Mongolian grasslands with a team of mounted police. They had just learned the location of a hideout used by a fake Mongolian official: a seemingly ordinary yurt on the vast plain, where the police had already dismounted and surrounded the area covertly.\n\nYu Zheng lifted the door flap, raised his gun, and entered. As expected, an old man sat wearily in a chair, his bloodshot eyes wide open, resembling a gaunt, skeletal dog. He slowly looked up, staring at the two police officers, one Han and one Mongol.\n\n“We are a joint enforcement team from China and Mongolia. Here is our arrest warrant… Don’t move!” Li Fu started to take out the warrant, but before he could, he saw the old man reach for a gun.\n\n“I know you Communists. After losing the battle in Inner Mongolia, you’ve been clinging to us like death itself!” The old man shakily raised the barrel of his gun. “Even if you kill me here, I’ll never let you interrogate me!”\n\n“Kill you? We’re not the old police,” Yu Zheng emphasized the words “old police” with particular weight. “Your crimes are written in black and white, every word is true. Do you want me to read it out loud again?”\n\n“Enough!” The old man suddenly stood up, but a dozen guns were instantly pointed at him. “I’ve never killed anyone. I’ve never killed anyone with my own hands! I-I-I was just…” His voice quivered.\n\nYu Zheng stopped talking and handed the arrest warrant to Li Fu. He then took out a pair of handcuffs from his belt. “Now you must confess and submit. Don’t resist. Let the court handle it. If you repent, you might receive leniency from the people!”\n\n“I haven’t killed anyone! I haven’t killed anyone! I haven’t killed anyone! I won’t go to your court…” The old man still shook and repeated the same words, holding the gun tremblingly.\n\n“Put down the gun!” Yu Zheng’s voice suddenly grew harsh. However, this seemed to trigger something in the old man’s frail nerves. His eyes widened, and with a cry of \"I haven’t killed anyone!\" he shoved the barrel into his mouth and pulled the trigger.\n\nThe police officers stood motionless, frozen in shock.\n\nSoon, a younger officer lifted his gun and fired several shots into the body on the ground. Li Fu, who had been about to leave, turned back in surprise. He quickly signaled for the older officers to pull the young officer away. The body on the ground had already formed a large pool of blood."
 CPC_main_story_events.29.o: "The arrest failed, and the criminal committed suicide."
 CPC_main_story_events.30.t: "Deserved punishment: one"
 CPC_main_story_events.30.d: "\"Such damn bad luck, stuck with you bunch of scoundrels who deserve what’s coming to you,\" Old Zhao muttered as he sat on the edge of the pit, smoking his dry tobacco, clearly dissatisfied with the arrangements made by the authorities.\n\nThe armed team from the banner had asked for his help, and seeing the decent pay, Old Zhao hadn’t thought much about it and agreed. But now, he regretted not bargaining harder with the team, wishing he had managed to get a few more good horses out of the deal.\n\nThe armed team had been short-handed recently, and they needed him to guard the pit where the condemned prisoners’ bodies were buried. Old Zhao had no way to refuse. By day, he sat on the grass, irritated, smoking his pipe, occasionally seeing two soldiers from the People’s Liberation Army dragging bodies to throw into the pit. By night, he would light a small fire, spread out his fur, and sleep simply.\n\nWith only two days left before he could return home, Old Zhao couldn’t help but feel happy. He had his wife send him two pounds of liquor, which he drank all at once. The drowsiness came earlier than usual, and as soon as the sun had set, Old Zhao was fast asleep in his bedding. When he woke up, groggy from the alcohol, he slapped his head, realizing the fire had long since gone out, and the full moon hung high in the sky—it was already the middle of the night.\n\nSuddenly, Old Zhao heard the sound of hooves galloping swiftly. A group of dark figures was charging toward him.\n\nOld Zhao broke out in a cold sweat, not knowing who they were. If it were the soldiers from the People’s Liberation Army checking on them, they usually carried torches. But these people came charging straight at him without any sign. Without any good weapons nearby, even if he had one, he knew he wouldn’t be able to fight them off. Old Zhao quickly ran to a small mound about ten meters away and crouched, watching closely. The group of figures arrived at the pit, stopped, and several of them quickly jumped into the pit, feeling around for something. Then, they dragged out a body.\n\nOld Zhao held his breath, not daring to move, continuing to watch them.\n\nOne of the figures suddenly drew a gleaming machete, and with a swift motion, struck down. As soon as the blade hit, the group became restless, raising whatever weapons they had—there were sledgehammers, whips, wooden clubs, and machetes—desperately smashing down. After a series of sickening, bone-crushing sounds, the group of figures slowly retreated."
 CPC_main_story_events.30.o: "What are they going to do?"
 CPC_main_story_events.31.t: "Recruitment meeting"
 CPC_main_story_events.31.d: "The repatriation of the Japanese nationals in Inner Mongolia was a policy that had already been decided, but the organization had instructed to pay special attention to the technical personnel among them. Teng Haiqing understood well the instructions that Kang Sheng had given him before his departure.\n\nAmong the one hundred or so Japanese nationals who had been delayed during the repatriation process, they had been specifically selected by Teng Haiqing from Inner Mongolia, as \"technically skilled personnel who could be retained within the Front,\" and needed to have \"proper ideological work done with them.\"\n\nThus, the recruitment meeting was held as a matter of course. Standing next to Teng Haiqing was a Japanese-speaking translator. He did not hide his intentions, but spoke openly, making his purpose clear: \"Ladies and gentlemen, please don’t be anxious. During the screening process, we discovered that all of you have very professional technical backgrounds. The Central Committee highly values the role you can play, and that is why you have been gathered here for a discussion.\"\n\n\"The purpose of this meeting is also clear: we want to retain you to contribute to the construction of our Front. Naturally, we will not treat you unfairly. Our Front's anti-Japanese policy is not based on ethnic revenge, but on uniting all the forces we can. . .\"\n\nTeng Haiqing spoke at length during this recruitment meeting, and by the time the sun was beginning to set, he finally saw signs of wavering in the eyes of several of the Japanese individuals in the audience.\n\nHe took out a recruitment certificate: \"This is the recruitment certificate issued by our Front. With this certificate, you can stay with our Front and receive special care from the Central Committee every month. Although our Front is currently facing difficulties, we assure you that you will live better here than in Inner Mongolia!\"\n\nSoon, some raised their hands to inquire further about the Front's talent policies.\n\nA slight look of satisfaction appeared on Teng Haiqing's face."
 CPC_main_story_events.31.o: "I suppose this is an example of how money can make even the devil work?"
 CPC_main_story_events.32.t: "Repatriation certificate"
 CPC_main_story_events.32.d: "Zhang Huaide was extremely dissatisfied with his new assignment: identifying the Japanese who remained in Hohhot and issuing repatriation certificates.\n\n\"I just can't understand it—why should they get a light repatriation certificate after invading our country, then get to ride on the special trucks and trains prepared for the little devils, being politely sent out of the country? If it were up to me, they should all be rounded up and shot. After all, that's how they treated us!\" He angrily cursed aloud in the police station break room while smoking, as if he were venting his resentment toward the police station, out through two walls, all the way to Xi'an and the Central Committee, to Chairman Mao.\n\nIt must be said that this kind of angry rant had some effect. While it wouldn't have reached Mao, the commotion could still be heard from the office of the police chief, which was separated by two walls—especially since a senior official from the Central Committee happened to be in Hohhot that day, overseeing the work.\n\n...\n\n\"Put out that damn cigarette!\" The police chief wasn't sitting at his desk but was standing beside Ji Dengkui, his face resembling a purple liver, and across from them sat Zhang Huaide, whose legs were already trembling under the table.\n\n\"Hey, no need to be so harsh. The people on the other side aren’t class enemies like landlords or wealthy landowners,\" Ji Dengkui said with a smile and a wave of his hand. \"The young comrade doesn’t understand why repatriation certificates are being issued. Don’t you, as the police chief, know how political education is usually done? Why haven’t the grassroots Party members grasped the spirit of the Central Committee? I’ll have to explain this at the Hohhot Standing Committee meeting later.\"\n\nAfter a pause, Ji Dengkui turned his gaze back to Zhang Huaide: \"Do you remember what I said at the beginning? What was it?\"\n\n\"Report, Sir... you said the people on the other side aren’t class enemies or landlords,\" Zhang Huaide replied, trembling.\n\n\"Then do you think the Japanese civilians who need repatriation are class enemies or landlords?\" Ji Dengkui’s question left Zhang Huaide speechless, unsure of how to respond.\n\n\"The task the Special Committee gave to the Public Security system is to identify the Japanese left behind in Inner Mongolia and make sure we don’t let any war criminals escape. Only then can we proceed with repatriation. If we just shoot a Japanese person without fully investigating, what difference would that be between our revolutionary forces and the Japanese devils?\" Ji Dengkui smiled. \"You have to understand, the Japanese civilians are also living hard lives. During the war, a farmer had to pay a ton of rice to the government every year, and more besides. How could they avoid this burden? Only if a male family member joined the army to fight could they be exempt. This is how they exploited the poor and oppressed and then came to invade us. Our revolutionary forces must stand up for the poor, we must liberate all of China, and to do that, we must investigate the Japanese in Hohhot and distinguish between those who oppressed the common people and those who were helpless and forced to be here.\"\n\nAfter hearing these words, Zhang Huaide’s face turned redder and redder. He immediately stood at attention and saluted:"
 CPC_main_story_events.32.o: "\"Comrade, your guidance is greatly appreciated!\""
 CPC_main_story_events.33.t: "Deserved punishment: two"
 CPC_main_story_events.33.d: "The group of shadows slowly faded away with the sound of galloping hooves. Old Zhao, unable to suppress his curiosity, took his hunting rifle and cautiously approached the spot where the crowd had gathered earlier.\n\nDespite having slaughtered countless cows and sheep in his life, he found it hard to remain calm in the face of the bloodied remains, bathed in the pale light of the moon. He lit a dry cigarette, trying to steady himself, telling himself he was simply at a sheep slaughtering site.\n\nFrom a slaughtering perspective, the group's methods could only be described as amateur. The bones were nearly all broken, half a liver entangled in scattered intestines, and the slit open stomach still had remnants of the last meal. The face was completely mutilated—teeth scattered on the ground, the nose cut off, the eyeball half hanging out, and the brain matter glowing faintly under the moonlight...\n\nOld Zhao knew this would require the armed brigade captain’s involvement, so he mounted his horse and, in the dark, rode toward the \"Mongolian Traitors Special Tribunal Office\" of the banner.\n\nAt dawn, the captain arrived with a team of men, following Old Zhao to the burial pit. It seemed that after Old Zhao left, two more groups had arrived. Now, the ground by the pit was covered with three piles of mangled flesh that could no longer be identified.\n\n\"Old Zhao, you can rest for today,\" the captain said after a long silence. \"You must be a herder who just moved here recently.\"\n\n\"Yeah, so what?\" Old Zhao asked, still filled with doubt.\n\n\"These three men were local bullies. When Mongolia ruled our banner, many people had their homes destroyed, families torn apart. They thought killing these bullies with a single shot was too easy for them.\"\n\n\"And then they dragged them out and whipped their bodies?\" Old Zhao asked, piecing the events together.\n\n\"Yes,\" the captain responded thoughtfully, \"this is what we call 'deserved punishment.'\""
 CPC_main_story_events.33.o: "The people have their own judgment."
 CPC_main_story_events.34.t: "All be happy"
 CPC_main_story_events.34.d: "\"Come on, come on, drink, have another glass.\"\n\nMandulatu kept urging him, and Bo Gu kept drinking glass after glass. His glasses were askew, and the Mongolian representative himself was drinking heavily. Tonight, everyone was unusually happy, and the clouds that had once overshadowed their hearts had long since disappeared. What remained was to enjoy the peace they had longed for.\n\n\"Comrade Bo Gu, today, today you must drink a bit more. Today is a good day, a good day!\"\n\nMandulatu slurred his words, slapping Bo Gu on the shoulder. Bo Gu, in comparison to this strong man from the grasslands, seemed even more out of place.\n\n\"Good day!\"\n\nBo Gu, in high spirits, raised his glass and shouted, \"A good day!\" The crowd, packed in the hall, cheered and raised their glasses in response. It was clear that Bo Gu had drunk too much; his cheeks were flushed, and he was somewhat intoxicated.\n\n\"Today, such a good day... hic... such a good day.\"\n\nHis voice dropped from loud to soft, eventually becoming a whisper, as if he were lost in thought, trying to pull a thread of coherence from his chaotic mind. Suddenly, an idea struck him, and he thought that singing a song would be the best thing to do.\n\n\"Comrades, let's... hic... let's sing a song!\"\n\nAll eyes turned toward him. It seemed like a good idea, but what song should they sing?\n\n\"Sing, sing something, what should we sing?\"\n\nBo Gu looked around in confusion. Though he didn’t have an immediate idea, he could feel the blood rushing through his veins. This made him uncontrollably think that he was returning to his youth. Countless thoughts surged to his lips, and he opened his mouth..."
 CPC_main_story_events.34.o: "“Steppe...\""
 CPC_main_story_events.35.t: "Mongolia favor"
 CPC_main_story_events.35.d: "As the sun slowly sank below the horizon, the woman, still bent over with her back aching, continued to cook and tend to the crying child, waiting for her husband to return. The hot wind from the northern Shaanxi plateau, combined with the steam rising from the pot, caused the woman to sweat profusely. She kept wiping the sweat, which seemed endless, with a towel draped over her shoulder, trying to ease her increasingly agitated mood.\n\n\"Stop crying!\" Her scolding only made the child cry louder. The little one was too young to speak, so he could only express his discontent in the most primitive way. \"I'm back!\" The man's Sichuan accent was easily recognizable in Shaanxi. The woman, as if holding onto a lifeline, quickly left the kitchen to greet her husband, but it seemed more like she was eager to hand the child over to him.\n\n\"Ah, why is the child crying? Stop crying, stop crying, I'll get you something to eat,\" the man said, holding the child in his arms. With one hand, he pulled out a piece of milk candy from his pocket and popped it into the child's mouth. Whether it was the sweetness of the candy or the comfort of paternal love, the child's crying gradually ceased, and a faint smile appeared.\n\n\"Dear, have one too,\" the man said, putting another candy into the woman's mouth. She chewed a few times, and the heat in her heart seemed to subside by half.\n\n\"Where did this candy come from? I've never tasted anything so sweet,\" the woman asked.\n\n\"You haven't had it before? This is from the new shipment that came to town this morning...\""
 CPC_main_story_events.35.o: "\"...From Mongolia.\""
 CPC_main_story_events.36.t: "In the midst of astonishment..."
 CPC_main_story_events.36.d: "Following the directions of the Mongolian and Xinjiang war prisoners, Zhang Ling and a team of people arrived at the front of a moderately sized warehouse on the outskirts of Hohhot.\n\nAfter a dull and brief explosion, the warehouse doors were blown open, and the heavy smell of machine oil immediately caused everyone present to frown. Zhang Ling waved his hand, signaling his team to turn on their flashlights and enter the warehouse to explore in separate directions.\n\n\"Captain!\" Soon, one of the team members called Zhang Ling. He followed the voice and walked over to a workbench. The flashlight illuminated the documents on the bench, casting a harsh, pale light. There were nearly ten layers of blueprints piled up. Though Zhang Ling knew little about arms manufacturing, he quickly recognized that these were blueprints for firearms. In the upper left corner, the words \"Howa Machinery\" were lightly stamped in Japanese-style characters. It seemed that these blueprints came from the notorious military-industrial company, Howa Machinery, a company that had long produced automatic firearms for Japan's puppet states, earning substantial profits in the process. Clearly, Mongolia and Xinjiang had likely been drained of a significant amount of wealth as well.\n\nIt was unclear who had turned the main valve in the warehouse, but soon the lights flickered on, revealing the source of the heavy machine oil smell. To Zhang Ling's surprise, it was a full-fledged firearms production line!"
 CPC_main_story_events.36.o: "Quick, notify the government!"
 CPC_main_story_events.37.t: "Taste the Tea"
 CPC_main_story_events.37.d: "Even though the weather remained cold, the northwestern sun was still glaring. Lei Renmin sat in the courtyard, idly brewing tea while squinting up at the sky. A few years ago, for opposing the Great Leap Forward, he had been labeled a \"right-leaning defeatist\" within the Party and was subsequently demoted to work in a printing factory as an ordinary cadre. Today was one of his rare days off, and he enjoyed the fragrance of the boiling tea leaves filling the air.\n\n\"What a fragrant tea!\" A voice speaking Sichuanese came from the entrance, followed by a knock at the door. Lei Renmin looked up and saw the visitor—it was Deng Xiaoping. He fetched a low stool from the corner and gestured for Deng to join him.\n\"Comrade Deng Xiaoping? Come in, have a seat, and enjoy a cup of tea,\" Lei Renmin said with a hint of doubt in his tone, wondering why the Director of the Central Secretariat would visit a demoted official. He filled an enamel cup with tea and handed it to Deng Xiaoping. Deng accepted it without hesitation, took a sniff, and smiled. \"Good tea! Even more fragrant than the pine needle tea from my hometown.\"\nLei Renmin cautiously probed, \"This is Maojian, a tea from Shanxi. Before leaving Shanxi, I bought a good amount. If you like it, I can send some to you. But tell me, Comrade Deng Xiaoping, surely you're not here just for the tea?\"\nDeng took a sip and replied, \"Indeed not. The Central Committee has sent me to ask whether you'd be willing to take charge of the newly established Ministry of Foreign Trade. Trade with Xinjiang and Mongolia is gradually resuming, and some Russian warlords are also willing to do business with us. Coordinating the base areas’ foreign trade is an urgent matter. The Central Committee is looking for someone capable of handling this work, and since you managed trade in the base areas exceptionally well in the past, they believe you're the right person for the job. What do you think?\"\nLei Renmin took a sip of his tea and asked, \"And what about my past mistakes…?\"\n\"You don't need to worry about that,\" Deng interrupted, noticing Lei Renmin’s hesitation. \"Right now, the base areas need unity to move forward—restoring construction, production, and trade. The right people should do the right work.\"\nDeng then pulled out a stack of documents from his briefcase and handed them to Lei Renmin. They contained trade records between different base areas and transactions with Kazakhstan and Russian warlords. He continued, \"These records cover agricultural goods, machinery, and even military supplies. The range of light and heavy industrial products is vast. We need a dedicated department to manage and negotiate these deals. The Central Committee believes you are capable of handling this task.\"\nLei Renmin no longer hesitated. He stood up, looked at Deng Xiaoping, and firmly stated, \"Comrade Deng Xiaoping, please inform Chairman Mao that I will complete this mission!\""
 CPC_main_story_events.37.o: "Eighteen years later, he will be a hero once again."
 CPC_main_story_events.38.t: "One call"
 CPC_main_story_events.38.d: "Wan Yi sat in his office in Tianshui, staring at the Central Committee’s directive, feeling an overwhelming sense of pressure. The Central Committee had ordered Tianshui to, within two years, transform itself into the headquarters of the National Defense Front’s armament industry. This was to be achieved by expanding existing military industries, receiving transferred factories, increasing arms production, developing a complete industrial system, and researching new weapons. Rubbing his dry, tired eyes, Wan Yi muttered to himself: The lessons of the Great Leap Forward are still fresh. What exactly is the Central Committee trying to do?!\n\"Ring, ring, ring...\" The urgent ringing of the telephone broke his thoughts. He picked up the receiver to hear the familiar voice of Chen Yi on the other end.\n“Comrade Wan Yi, it’s me, Chen Yi!” The warmth in Chen Yi’s tone felt like a refreshing breeze in this era of pessimism and tension. His humor and calm demeanor always brought some reassurance to the cadres across various ministries. Wan Yi’s furrowed brows relaxed slightly, and he chuckled as he responded, “Ah, Chief Chen! What’s the occasion for a personal call?”\nChen Yi didn’t bother with pleasantries and got straight to the point: “The Central Committee has decided to relocate all military industries to Tianshui, and I’m calling to tell you that you have our full support. This task will be at the heart of the Front’s future military-industrial development. Don’t be afraid of difficulties—if you need anything, send a telegram to the Central Committee at any time. Alright, I have another meeting to attend, so I’ll hang up now.”\nWith that, Chen Yi ended the call. Wan Yi sighed in relief. At least things are finally clear now. He turned his gaze toward the window. In the distance, a plume of steam from an approaching train rose over the railway tracks—it was carrying industrial machinery. He turned to his secretary and said, “Come on, let’s go to the train station.”\nArriving at the train station, there were no banners, no grand welcoming ceremony—only workers waiting to unload and install the equipment.\n\"Tssss—\" The train released excess steam as it came to a stop. Wan Yi shook hands with the train conductor as a formality before turning to address the workers gathered on the platform.\n\n“Comrades, fellow workers! The Central Committee has tasked us with receiving military factories from all over the base areas and unifying our production efforts here in Tianshui. We must give this our absolute best effort—not only must we quickly integrate the transferred factories into full production, but we must also expand and innovate, developing new weapons.\n\nComrades, workers! The Central Committee supports us in making Tianshui the great arsenal of the entire Front. Soon, our rifles and cannons, made right here in Tianshui, will arm the soldiers of the People’s Liberation Army. We must dedicate ourselves fully to ensuring that our soldiers have the weapons they need to liberate the entire country. We must make ‘Made in Tianshui’ a name that resounds across Asia!\nThe Central Committee and the people of the entire Front will provide us with every possible resource and support. In return, we must deliver a fully operational military-industrial complex to them! Comrades, are you with me?!”\n\"Yes!\" The workers roared in response. They were thrilled—not just because they would play a crucial role in equipping the revolution, but also because the Central Committee was providing full support instead of leaving them to struggle through \"self-reliance.\"\nAfter delivering further work instructions, Wan Yi finally cleared his dry throat, raised his right fist to the sky, and shouted:\n“Long live Chairman Mao! Long live the Chinese Revolution!”\nThe workers all raised their fists and echoed his cry."
 CPC_main_story_events.38.o: "\"Long live Chairman Mao! Long live the Chinese Revolution!\""
 CPC_main_story_events.39.t: "Omnious Moves"
 CPC_main_story_events.39.d: "Ma Zhongying had decreed to his cousin Ma Hushan prior to his Soviet journey, \"Priortize Xinjiang, Refrain from Zhongyuan\". This very motto turned into the motto of his regime based in southern Xinjiang. The Breakup with Ma Bufang saw the cousins budding together to fight Sheng Shicai, the five fierce fights would not have been in vain should the Soviets not intervene. Contending that one serves the master to become the master, Ma accepted the Soviet invitation to Moscow, to study warfare and prepare for further comeback.\n\nIt seems like Ma Zhongying isn't his former self after the Soviet venture. The family man turned into an all out communist, preaching his \"Proletarian\" \"Socialism\" and neglecting his clan. What's adding insult to injury, Ma rapproached with the CPC and submitted himself to them, becoming a servant indeed to the communist shackle. \n\n\"A Self-Made Man shall not be subservient to any\".\n\nMa Hushan is a mere military man and thus no match for his empowered cousin. Yet he has his connections: Ma Zhongying's fame relies on the clan, his renegade now indeed made many wary. Ma Hushan, as one among the clan, is entitiled to unveil the mishap and gain support from the clan. Ma Zhongying has also been intended to work on discipline in the army, yet he's surely too bothered to venture out of Hotan, and thus this arduous task is assigned to his very cousin. Assignments and relinquishments are of his decree.\n\nThereby works Ma Hushan as a covert agent, turning Ma Zhongying's power into his own fiefdom. He shall assume the de facto leadership, and Ma Zhongying would only succumb and acquiesce."
 CPC_main_story_events.39.o: "Ma Hushan ventures."
 CPC_main_story_events.40.t: "Ma Zhongying assailed!"
 CPC_main_story_events.40.d: "Street inspections were a monthly routine event held by Ma Zhongying. Starting from his official residence, he would follow a set route, traversing the four markets and eight streets of Hetian City, to survey public sentiment and stabilize the people's hearts. This practice garnered Ma Zhongying immense public support and also benefited the Ma family behind him, which made certain members of the Soviet Council quite apprehensive.\n\nToday was another day of inspection. As usual, Ma Zhongying rode a tall, majestic horse slowly through the market, followed by his security guards on foot. On both sides, merchants and passersby bustled with activity, and vendors lined up one after another without interruption. When they encountered Marshal Ma Zhongying, there was no need for the merchants to salute; they continued their business as usual.\n\nCommunist Party member Meng Yu happened to be shopping in the market. Seeing Ma Zhongying's entourage, though accustomed to their presence, he felt it was friendly to greet them. After negotiating the price for lamb, he stored the meat with the vendor and turned to welcome Ma Zhongying and his entourage.\n\nAt that moment, a beggar-like person suddenly burst out from a nearby naan bakery. Dressed in tattered clothes, muttering incoherently, and with disheveled hair, he seemed to be clutching something in his arms as he charged straight toward Ma Zhongying's team. The guards hurriedly tried to block him, almost being knocked aside. However, the beggar was persistent, forcefully pushing forward while mumbling, \"I'm starving... I'm starving...\"\n\nSeeing that the situation was deteriorating, the head of the security squad quickly pulled Ma Zhongying's horse backward. \"General, this beggar is suspicious. How can a man who’s about to starve to death still have such strength?\"\n\nBefore anyone could react, just as Ma Zhongying was about to leave, the beggar pulled out what he was holding and threw it towards them.\n\n\"Grenade!\"\n\nThe previously calm market immediately erupted into chaos. People ran in panic, shouting and scattering in all directions, blood and flesh flying everywhere with wails filling the area. Ma Zhongying was severely injured by the explosion and was rushed to the hospital by his subordinates. The beggar was subdued by the guards and dragged off to prison, and shortly thereafter, he was transferred to the Ma Hushan fortress to undergo interrogation.\n\nAnd Meng Yu witnessed the entire scene."
 CPC_main_story_events.40.o: "Urgent Reply: The Central Committee will immediately take over the investigation."
 CPC_main_story_events.41.t: "Ma Hushan Condemns the CPC for Orchestrating the Attack"
 CPC_main_story_events.41.d: "Cai Xuecun Repeatedly Sends Telegrams to Ma Hushan, Urging the CCP’s Participation in the Investigation, but Ma Hushan Stalls and Then Directly Accuses the CCP\n\nCai Xuecun had repeatedly sent telegrams to Ma Hushan, urging him to allow the Communist Party to participate in the investigation of Ma Zhongying’s assassination. However, Ma Hushan responded with vague and evasive answers each time, deliberately delaying the process. Just as Cai Xuecun and Yang Boqing were awaiting a reply from the Central Committee and discussing their next steps, Ma Hushan made a high-profile announcement—he had identified the mastermind behind the attack, and it was none other than the CCP!\n\nCai and Yang were momentarily shocked but quickly understood the true meaning behind Ma Hushan’s move—he was trying to become the next Sheng Shicai. Without hesitation, Yang Boqing demanded that Cai Xuecun draft an order to summon the army: \"We must take control of the military before Ma Hushan does, or else all our efforts over the past decade will be wasted!\"\n\nHowever, instead of picking up a pen, Cai Xuecun put forward his own proposal: \"We need to reach out to Wu Yingqi.\"\n\nHearing this name, Yang Boqing became even more anxious: \"At a time like this, you still want to approach Ma Zhongying’s former aide?\"\n\n\"Calm down first,\" Cai Xuecun gestured for Yang to sit down and lowered his voice. \"Regardless of whether Wu is reliable or not, we need someone from the upper ranks to help us pass messages. Besides, I've long suspected that Wu is not just another warlord—nor is he completely on our side. He’s likely an agent of the GPU.\"\n\nYang Boqing remained unconvinced and continued urging Cai to write the military mobilization order, dismissing his speculation as baseless. Eventually, Cai Xuecun relented and swiftly drafted an order forbidding troops from leaving their posts without authorization. Handing it to Yang, he continued: \"Ma Hushan is watching us closely. Any orders to mobilize troops will have to pass through his controlled transmission stations. We need Wu Yingqi to help us establish a secure communication line—don’t forget, he has done this for us before.\"\n\nYang Boqing didn’t respond immediately, instead staring at the document with a cryptic smile. \"So, besides mobilizing the troops, are you planning to ask him for anything else?\"\n\n\"Of course,\" Cai Xuecun answered bluntly. \"We need Wu Yingqi to arrange a meeting with Ma Zhongjie under the pretext of a banquet. First, this will help us shake off Ma Hushan’s surveillance. Second, we need to rally those within the upper ranks who sympathize with the Communist Party and get them to support our efforts against Ma Hushan.\"\n\nYang Boqing seemed intrigued by the idea. After a moment of contemplation, he murmured, \"You also want to find out the real situation regarding Ma Zhongying, don’t you?\"\n\nThe Central Committee’s reply had yet to arrive, but time was running out. Every second of delay increased the risk to the Party's survival. Yang Boqing finally nodded in agreement. \"Alright. I support contacting Wu Yingqi. We’ll use the upper-level channels to resolve this problem.\""
 CPC_main_story_events.41.o: "Host a Banquet for Ma Zhongjie to Gather Intelligence on Ma Hushan"
 CPC_main_story_events.42.t: "Intelligence from Ma Zhongjie"
 CPC_main_story_events.42.d: "The CPC Central Committee, \n\nRecent observations of Ma Zhongjie and Wu Yingqi's visits to Ma Hushan saw stern atmosphere and omnious figures venturing, the Xinjiang Bureau has thus assigned agents to make knowledge of them. \nInvestigations revealed Ma Hushan's encoded telegrams to a certain frequency, formatted unknown to the Front. The format proves to be highly analogous to those of Japanese puppets, and the Bureau concludes that Ma Hushan may be in connection to enemies of the people to subvert the Xinjiang Regime and endanger the Revolution.\nAnalysis show Ma Hushan's actions to amass support and train military personnel. Further disclosure of said telegrams and contactee is unavailable due to limited personnel and technologies. The Bureau thus sends the codes and requires technical support. \nThe Bureau awaits directions from the CC to counter Ma Hushan's moves and weather the upcoming.\n\nThe CPC Xinjiang Bureau\nSigned, Cai Xuecun Yang Boqing"
 CPC_main_story_events.42.o: "That's unfavorable."
 CPC_main_story_events.43.t: "Incoming Clue"
 CPC_main_story_events.43.d: "Telegram to the CPC Central Committee:\n\nAfter an investigation conducted by our regional intelligence agents, we have determined the following:\n\nDuring the daytime, Ma Hushan’s trade caravans were observed leaving Aksu, heading toward Kashgar and northern Xinjiang. Our agents, who covertly followed them, discovered that at night these caravans engaged in transactions with an unknown force before swiftly returning to Aksu. This pattern repeated for several days.\n\nAdditionally, intelligence gathered by agents stationed in Aksu revealed that each time these caravans returned, they carried goods wrapped in thick felt. The dimensions of these packages—both in length and width—suggest they could easily contain multiple rifles. At the same time, Ma Hushan’s forces have significantly increased patrols, set up additional checkpoints, and imposed strict inspections on all trade convoys—except for his own.\n\nBased on these observations, we have confirmed that Ma Hushan is secretly conducting arms transactions with the East Turkestan factions. If his actions are not stopped in time, they will undoubtedly threaten the revolution. We urge the Central Committee and comrades of the Xinjiang Bureau to act swiftly.\n\nSent by:\nUyghur Communist Party and CPC Yining Branch"
 CPC_main_story_events.43.o: "Keep a Close Watch on Him! Investigate Their Exact Locations!"
 CPC_Ma_Hushan_crisis.2.t: "Incoming Clue"
 CPC_Ma_Hushan_crisis.2.d: "To the CPC Central Committee:\n\nAt present, we have not obtained any direct intelligence on Ma Hushan in Ili or the surrounding areas. However, we have observed a significant increase in activity by East Turkestan terrorist factions in recent days. We believe there is a possible underlying connection between these developments. Based on our assessment, we offer two possible hypotheses for the Central Committee's reference:\n\nMa Hushan may be preparing to act amid an East Turkestan attack on the Kashgar Party Committee in an attempt to sideline Ma Zhongying and seize control of the Khotan government. We assess this scenario to be highly probable.\n\nMa Hushan may be secretly instigating East Turkestan militants to create disturbances, only to personally lead a military campaign to suppress them. By orchestrating such an operation, he could manufacture political leverage and later demand greater authority from the Khotan government—or even from the Central Committee—under the pretext of being a “hero of counterinsurgency.”\n\nRegardless of his exact strategy, the latest reports from the Xinjiang Bureau and the Khotan government strongly indicate that Ma Hushan is plotting a conspiracy. We urge the Central Committee to make a decisive move and crush this scheme before it takes shape.\n\nSent by:\nCPC Yining Branch"
 CPC_Ma_Hushan_crisis.2.o: "Approval: Continue the Investigation.\nThis intelligence is to be forwarded to the Uyghur Communist Party, specifically to Seypidin."
 CPC_Ma_Hushan_crisis.3.t: "Incoming Clue"
 CPC_Ma_Hushan_crisis.3.d: "To the CPC Central Committee:\n\nOur intelligence agents have continued deep investigations in accordance with directives in Ili, Tacheng, and surrounding areas. While no further leads have been uncovered in the Ili region, we have detected signs of East Turkestan militant activity near the Karamay area. Additionally, grassroots reconnaissance has revealed that the Hetian Ma clan's trade caravan also arrived in Karamay not long ago and conducted large-scale transactions.\n\nGiven Karamay’s proximity to Sheng Shicai’s jurisdiction, we suspect that Sheng Shicai may also be involved in Ma Hushan’s conspiracy.\n\nWe now seek permission to deploy agents to Yanqi and Dihua in pursuit of further intelligence breakthroughs. Requesting the Central Committee’s directive on this matter.\n\nSent by:\nUyghur Communist Party & CPC Yining Branch"
 CPC_Ma_Hushan_crisis.3.o1: "Those East Turkestan remnants collide with Sheng Shicai, this is viable."
 CPC_Ma_Hushan_crisis.3.o2: "Maybe it's the Soviet remnants in Ta'Cheng, they are indeed bet hedgers."
 CPC_Ma_Hushan_crisis.3.o3: "Aksu and Kashgar, newly recovered, should not be exempted from inspection."
 CPC_Ma_Hushan_crisis.4.t: "Incoming Clue"
 CPC_Ma_Hushan_crisis.4.d: "To the CPC Central Committee:\n\nOur agents in Yanqi, Dihua, and surrounding areas have found no evidence of Sheng Shicai colluding with East Turkestan factions—on the contrary, Sheng's administration is also struggling to suppress the movement of East Turkestan militants within his territory. We have found no direct ties between Ma Hushan and Sheng Shicai.\n\nBased on our collected intelligence, we believe our investigation direction may have been misaligned. Alternatively, it is possible that Ma Hushan is not directly colluding with Sheng Shicai but instead engaging with remnants of the Qinghai Ma clique, specifically Ma Chengxiang.\n\nAt present, we have accelerated efforts to have our Dihua-based agents gather intelligence on Ma Chengxiang’s recent troop deployments and strategic planning. This update is provided for the Central Committee’s reference.\n\nSent by:\nUyghur Communist Party & CPC Yining Branch"
 CPC_Ma_Hushan_crisis.4.o: "It seems that for now, we have no choice but to investigate Ma Chengxiang..."
 CPC_Ma_Hushan_crisis.5.t: "Incoming Clue"
 CPC_Ma_Hushan_crisis.5.d: "To the Central Committee of the CPC:\n\nOur official representative in Almaty, after an extended period of observation, has reported that the Kazakh Republic and the Kazakh People's Commissariat of Internal Affairs do not currently appear to have any external connections. Furthermore, we have obtained additional information indicating that since the collapse of the Soviet Union and the loss of contact with the Soviet Communist Central Committee, the Kazakh authorities have effectively ceased all support for any forces in Xinjiang.\n\nAdditionally, due to the armed uprising of the East Turkestan separatists in Kashgar and Aksu, the Soviet instructors stranded in Hotan have no possibility of restoring contact with the remnants of the Soviet forces in Kazakhstan via land routes. Their foundation in Hotan is extremely weak, making it unlikely that they could manipulate the East Turkestan separatists or maintain any secret dealings with Ma Hushan.\n\nSent by:\nThe Uyghur Communist Party and the CPC Yining Branch"
 CPC_Ma_Hushan_crisis.5.o: "It seems that the direction was wrong, and time was wasted…"
 CPC_Ma_Hushan_crisis.6.t: "Incoming Clue"
 CPC_Ma_Hushan_crisis.6.d: "To the Central Committee of the Communist Party of China:\n\nThe trail has completely gone cold. We have learned that Ma Chengxiang and his troops are currently deploying defensive lines in the Hami region, with a clear intention to resist any central military action against Sheng Shicai. All of their supplies are being transported from the direction of Dihua, and there is no indication that any goods or materials from Hotan have been sent to Hami.\n\nWe now suspect that Ma Hushan deliberately created a diversion toward Sheng Shicai's direction to mislead us into receiving false intelligence and making incorrect judgments.\n\nAt present, all agents have been recalled to Yining and are awaiting further instructions from the Central Committee.\n\nSent by: The Uyghur Communist Party and the CPC Yining Branch"
 CPC_Ma_Hushan_crisis.6.o: "We have wasted too much time..."
 CPC_main_story_events.44.t: "Before the dawn"
 CPC_main_story_events.44.d: "Ma Zhongying felt an unprecedented surge of energy as he returned to his post from the hospital bed. His time in recovery had allowed him to temporarily escape the overwhelming workload and restore his nerves, which had been stretched thin by relentless responsibilities. Moreover, the resolution of the Ma Hushan incident had enabled him to regain some of the authority that had previously been obstructed.\n\nUpon his return to the Xinjiang Bureau headquarters, Cai Xuecun and Yang Boqing warmly welcomed him back, showing great concern for his well-being. After brief pleasantries, the Xinjiang Bureau swiftly realigned its strategic focus: eliminating Sheng Shicai and liberating all of Xinjiang.\n\n\"We will coordinate with the Yili Special Administrative Region to form a pincer movement against Sheng Shicai’s controlled territory,\" Yang Boqing said, pointing at the map. \"The Central Committee will also provide us with support.\"\n\nLooking at the map, Ma Zhongying found it difficult to suppress his excitement—the time had finally come for a decisive battle against Sheng Shicai. He took the initiative and declared, \"I want to visit the military camps and speak to our soldiers personally. I will deliver a pre-battle mobilization speech.\"\n\nAs soon as Ma Zhongying arrived at the camp, he was met with an overwhelming reception from the troops. Nicknamed ‘Little Commander,’ ‘General Thunderbolt,’ and ‘The Modern Ma Chao,’ Ma was a war hero renowned for his bravery and charisma. The soldiers—be they Han, Hui, Uyghur, or Mongolian—held deep respect and admiration for him.\n\nStanding on the platform, Ma Zhongying delivered his final address to the troops: \"Comrades, brothers, the time has come to defeat Sheng Shicai!\"\n\nA resounding cheer erupted from the crowd. The soldiers had been training tirelessly, ready to lay down their lives to overthrow Sheng Shicai and liberate Xinjiang.\n\n\"Comrade Seypidin in the north and Chairman Mao in the east will fight alongside us. Victory shall be ours!\"\n\nMa Zhongying’s rousing speech ignited an even greater wave of enthusiasm. The soldiers raised their voices in unison:\n\n\"Long live the Grand Marshal! Long live Chairman Mao! Long live the Chinese Revolution!\""
 CPC_main_story_events.44.o: "Storm Ürümqi, capture Sheng Shicai alive!"
 CPC_main_story_events.45.t: "Night Chasing"
 CPC_main_story_events.45.d: "The patrol captain, accompanied by two soldiers, pursued the bandits all the way to the mountain pass.\n\n\"The bandits dragged a cart into the mountains; they can't have gone far. Let's move quickly and finish this early!\"\n\n\"Yes, sir!\"\n\nThe three men crossed a small hill and spotted the grain cart that had been hijacked by the bandits. The sacks of grain were in disarray, with spilled grain scattered all around.\n\n\"They must have divided the grain and fled. Search the area—follow the largest trail.\"\n\nBefore long, a path of trampled wild mugwort led them into the dense forest. The trail ended abruptly in a small clearing, where the surroundings were eerily dark. As the soldiers searched for new clues, the captain suddenly realized something and urgently ordered a retreat.\n\nGunfire erupted. One soldier was hit and fell to the ground. Looking back, they saw that their escape route had been cut off—the bandits had encircled them and were closing in.\n\nThe remaining two quickly took cover behind a large tree. The captain asked, \"Dabao, did you see how many of them there are?\"\n\n\"Five or six!\"\n\n\"You draw their fire, and I'll take aim!\"\n\n\"Got it!\"\n\nWith that, Dabao sprang to another tree hollow, drawing the bandits' gunfire in his direction. Seizing the opportunity, the captain took aim at a careless bandit crouching in the underbrush and pulled the trigger. The target fell instantly.\n\nFrom the enemy's side, panicked shouts rang out, \"Boss is down! Retreat!\"\n\nAs the shouting faded, silence returned to the forest.\n\nThe captain remained behind the tree, calmly scanning for any remaining threats before turning to call for Dabao.\n\n\"The bandits seem to have fled. Captain, you're amazing—you took down their leader with one shot!\"\n\n\"At best, we scared them off. We still need to pursue them.\"\n\nThe two slowly emerged from cover, retrieved their fallen comrade's body, and continued their chase after the bandits."
 CPC_main_story_events.45.o: "There are still two more bandit hideouts."
 CPC_main_story_events.46.t: "Petition"
 CPC_main_story_events.46.d: "The Four Cleanups Movement was the collective term for the rectification of accounts, warehouses, assets, and labor points—essentially an effort to purge cadres who had made mistakes during the Great Leap Forward. To set an example for the entire base area, Liu Shaoqi decided to personally intervene. But where should he find a \"bad element\" to target? The authorities in Tongchuan County recommended one: Li Xiumei, the secretary of the \"Baishui\" commune.\n\nA work team of over a hundred people arrived at Baishui commune in full force, announcing that Li Xiumei was a corrupt cadre while simultaneously placing her under isolation. They then gathered the commune members to collect evidence against her.\n\nHowever, after more than ten days of investigation, no substantial charges against Li Xiumei could be found—she had committed no wrongdoing. Meanwhile, Li Xiumei had grown increasingly frustrated with her detention. She stormed from her home to the work team’s meeting hall, loudly demanding to confront Liu Shaoqi himself.\n\nWang Renzhong stepped outside to stop her, sternly saying, “We are in the middle of a meeting. No shouting allowed!”\n\nLi Xiumei, hands on her hips, glared at him and retorted, “I haven’t embezzled, I haven’t killed anyone—why am I being wrongfully accused? Am I the one responsible for the people going hungry? Forcing confessions isn’t the Party’s way!”\n\nHer defiance angered Wang Renzhong, who was about to call the militia to remove her when Liu Shaoqi’s voice came from inside the room: “Don’t touch her. Let her in.”\n\nWhen Li Xiumei entered and finally stood before Liu Shaoqi, her pent-up grievances overwhelmed her. She choked up and tears streamed uncontrollably down her face.\n\n“Comrade Li Xiumei, you have been wronged,” Liu Shaoqi said gently. “The mistakes of the Great Leap Forward were not entirely the responsibility of local cadres like you. The greater burden lies with us at the top. The purpose of this investigation is to clarify right and wrong and restore the people's trust. Since you have come forward, it shows that you still believe in the Party. Speak freely—no one will be punished for telling the truth. We will uphold the principle of seeking truth from facts.”\n\nLiu Shaoqi's calm and persuasive words finally opened the floodgates, and Li Xiumei poured out all her grievances in one breath.\n\nThe next day, the work team quietly withdrew from Baishui commune, and the provincial authorities never mentioned the investigation again. Later, Liberation Daily published an article about Li Xiumei’s petition, criticizing the recklessness of such accusations while also commending and encouraging the spirit of courage in reporting real problems and standing by the truth."
 CPC_main_story_events.46.o: "Truth is the best."
 CPC_main_story_events.47.t: "Inner Forest"
 CPC_main_story_events.47.d: "\"Swish... swish...\"\n\nThe dry, yellowing birch forest swayed under the early autumn wind, sending down a steady rain of withered leaves that clung stubbornly to passersby. Even the few trucks that rumbled down the road found themselves burdened with an unintentional cargo, their beds filled with fallen leaves. After last night's heavy rain, the leaves seemed to have glued themselves to every surface they touched.\n\nAnnoyed by this, Zhang Ruohuai took a stick and scraped at the hood of his beloved truck, slowly sweeping away the damp foliage. He then walked to the back to inspect the cargo. Fortunately, the truck bed had been covered with a tarp days ago, or else the crates of machine parts and the oil-stained engine would have been buried under layers of leaves by now.\n\nBesides the storm, last night’s battle had been particularly intense. The anti-aircraft artillery site near the old factory, just a few kilometers away, had been firing continuously for nearly half an hour. As a precaution, the factory had suspended nighttime unloading. At one point, two enemy planes had streaked across the sky with their tails ablaze before crashing somewhere in the distance. At dawn, a search party had been dispatched to locate the wreckage.\n\nZhang Ruohuai called out as he lifted the tarp on the truck bed. Several workers climbed onto the vehicle, securing the pallet beneath the machine with metal hooks before guiding a small crane to slowly hoist it onto a waiting trailer. Once secured, the machine was towed into a nearby factory building camouflaged with a mottled coat of paint. Meanwhile, Zhang joined the others in carrying the remaining parts into the warehouse.\n\nThey navigated through a labyrinth of new and old factory buildings, interwoven with patches of dense woodland. The layout was oddly disjointed, like a maze of brick and steel, disorienting Zhang as he moved through it. Yet, the disorderly arrangement, combined with layers of camouflage, allowed the factory complex to seamlessly blend into the surrounding forest of birch and sycamore. The once-deafening hum of machinery was swallowed by the sea of trees, leaving only a few scattered structures in the distance—simple houses that gave the illusion of an unremarkable settlement. From the outside, it seemed as if nothing significant lay hidden within, and the trucks emerging from the woods carried nothing more than mundane \"lumber.\""
 CPC_main_story_events.47.o: "In the silence, passion flows freely."
 CPC_main_story_events.48.t: "Heaven River"
 CPC_main_story_events.48.d: "\"Hey———,\" Aikegong called out as he herded his sheep along the piers of the irrigation bridge. The sun was setting, and he had to hurry back to the village before nightfall, he thought. Fortunately, the irrigation bridge was built along the farmland, so following it would ensure he didn't lose his way. However, compared to \"irrigation bridge,\" Aikegong preferred the nickname \"Heavenly River,\" a name given by the village elders—water flowing through the sky, how fitting. Just three months ago, the village was still troubled by water shortages, still anxious over the deep wells that yielded nothing. Now, not only was irrigation secured, but there was also plenty of water for daily use.\n\n\"They say this water comes from the Tao River,\" Aikegong's grandfather, an old farmer, remarked. Night had fallen, and the sky was dotted with stars. After a long day of labor, the old man squatted at the doorway, struck a match, and lit his water pipe. The flickering, faint light of the match illuminated his dark, deeply wrinkled face, resembling the rugged terrain of the Loess Plateau. He waved his hand to extinguish the match, exhaled a puff of smoke, and said to Aikegong, \"My grandson, your father was working on this Heavenly River when he accidentally fell into a valley and died.\"\n\nAikegong nodded blankly. It wasn’t that he was indifferent to his father’s death, but his grandfather mentioned it so often that he had grown used to it. Yet, unlike usual, the old man did not dwell on his son's tragic end. Instead, he pointed toward the irrigation bridge, then at the terraced fields not far away, and said, \"But without this Heavenly River, we might all have starved next year. The old wells had already dried up, and the new ones yielded nothing. Without this river, the crops would have withered and died.\"\n\nIt was unclear whether the old farmer was speaking to Aikegong or just murmuring to himself. His eyes flickered with sorrow and relief, as if convincing himself that the choice had always been between two fates: either his son fell to his death, his body lost forever, or the entire family starved due to failed harvests. There was no other option.\n\nAikegong sensed his grandfather’s complex emotions and told him he would go inside to practice his writing. The old farmer hummed in acknowledgment but remained outside, lost in thought, watching the water flow through the irrigation bridge, its rippling surface shimmering under the moonlight. He felt an odd kind of beauty but couldn’t quite put it into words.\n\n\"It looks like the Milky Way falling from the sky...\" A hesitant, stuttering voice broke the night’s silence—it was Aikegong reading aloud as he practiced writing. The Milky Way? Yes, it did look like the Milky Way. And the Milky Way was a Heavenly River too, wasn’t it?\n\nThe old farmer tapped his water pipe, emptying the ashes, then stepped back inside the house.\n\nThe departed were gone, but life had to go on. The old farmer patted Aikegong on the shoulder and said:"
 CPC_main_story_events.48.o: "\"Go to bed early. You have school tomorrow, and I have work to do.\""
 CPC_main_story_events.49.t: "Structural Reform"
 CPC_main_story_events.49.d: "\"Professor Wu, please help us! That Soviet expert is rattling off a bunch of terms we don’t understand again,\" said Ding Guoxiang, looking frustrated along with several other graduate students. \"We only just figured out all the terminology and principles about engine design from the last lecture, and now today's class is full of new terms again. If this keeps up, our power engineering major will turn into a translation major! You're an expert in Russian—could you help us as a teaching assistant?\"\n\nEver since the translation institute was merged into Xi’an University, Professor Wu had been receiving frequent requests for help from engineering students. Although the students had studied Russian, the sheer volume and complexity of specialized terminology made comprehension difficult. On top of that, the Soviet experts didn’t speak Chinese, forcing them to slow down their lectures, yet comprehension still remained poor. After the merger, the translation institute was initially categorized as a translation major, but since the base had little need for diplomacy, enrollment was sparse. Engineering students complained that the language barrier was slowing their courses, while translation faculty lamented their lack of meaningful work.\n\nConsidering all this, Professor Wu turned to Ding Guoxiang and said, \"I understand. Coincidentally, I have a meeting with the university president the day after tomorrow. I’ll bring up your concerns and let you know the response.\"\n\nTwo days later, Professor Wu entered the president's office and submitted a proposal. The document suggested assigning translation faculty and students to work closely with the School of Engineering and the National Defense Research Institute, assisting researchers and graduate students with their work. \"Comrade President,\" Wu explained, \"our university has recently merged, and many students are struggling to understand foreign technical terms. Meanwhile, our translation faculty and students feel they lack opportunities to contribute to the revolutionary cause. I propose that our translation department be systematically involved in translating technical documents and assisting foreign experts as teaching assistants. This will enhance research efficiency and support our scientific progress.\"\n\nThe president carefully reviewed the proposal. He had been overwhelmed by the challenges of the recent merger, and having a clear and actionable plan was exactly what he needed. \"This is well-written, Professor Wu,\" he said with a smile. \"It’s a detailed and practical plan. We’ll implement this reform as you suggested.\"\n\nThat afternoon, the university leadership swiftly approved the restructuring plan and submitted it for higher-level review, aiming to resolve the issue as quickly as possible.\n\nThe next day, a letter from the upper authorities arrived at the gates of Xi’an University. It read: \"Approved for execution. The university president is granted full authority over implementing the reform.\""
 CPC_main_story_events.49.o: "Shoot the bird that sticks its head out, reward the one who takes the lead."
 CPC_main_story_events.50.t: "Do togerther"
 CPC_main_story_events.50.d: "Xi Zhongxun returned to Dan Village—his long-separated hometown. However, this was not another political exile; rather, he was entrusted by the central government to inspect various communes in northern Shaanxi, with Dan Village as one of his stops.\n\nIn the alleys and streets of Dan Village, discussions about the construction of an irrigation canal had long become part of daily life. Every morning, commune members would shoulder their hoes and shovels, making their way to the construction site.\n\nA year and a half ago, Fuping County ordered several cooperatives around Dan Village to merge into one large commune—the Dan Village Commune. The farmland within the commune was scattered and fragmented. While land reclamation was inevitable, irrigation became the biggest challenge. With each new well dug deeper than the last, some wells even yielded no water at all, and the water shortage became increasingly severe. The newly established commune committee decided to excavate a canal from the mountainous area outside the commune to introduce water for irrigation, linking the scattered fields into a cohesive system.\n\nAfter the mobilization meeting, men and women, young and old, enthusiastically participated in the project during the farming off-season. The mountain rocks were as hard as iron, and the site was filled with the rhythmic shouts of laborers, the sharp clang of chisels against stone, and the soft rustling of shovels moving soil—all blending into a continuous symphony of labor. The construction site never rested, operating 24 hours a day. During the daytime, the village men toiled at excavation, while at night, many women and elders carried soil and transported stones. Even some teenage boys joined in, laughing and playing as they raced forward with wheelbarrows filled with rock and earth. If they got carried away, their parents would scold them slightly as a reminder. After months of effort, the canal began to take shape, with stone-reinforced embankments winding down the loess slopes. As it reached the plains, the canal connected one field after another, ensuring that every patch of farmland would receive nourishment.\n\nBy the time Xi Zhongxun arrived for his inspection, the canal was nearly complete, and today marked the grand opening of its water flow. The commune secretary explained that, in addition to agriculture, Dan Village Commune also had livestock farming and auxiliary agricultural industries. The newly built canal would not only alleviate water shortages but also help expand livestock and auxiliary production. \n\nGuided by the commune secretary, Xi Zhongxun arrived at the mountain pass, gazing at the winding canal with admiration. At the riverbank, the sluice gate workers slowly lifted the gate, allowing river water to surge forward, forming small swirling eddies as it flowed down the channel. Under the sunlight, the shimmering water sparkled like a radiant necklace. Within moments, the canal was filled, and the water rushed through the mountain pass, coursing toward the farmlands, linking them together like the prayer beads of a Buddha—an auspicious symbol for a bountiful harvest. \n\nWatching the torrents of water flooding in, the villagers erupted in cheers, their faces beaming with joy—no longer reliant on heaven or earth, but on their own unwavering effort."
 CPC_main_story_events.50.o: "The sweat that falls today will become the nourishment of tomorrow."
 CPC_main_story_events.51.t: "Doing business(1)"
 CPC_main_story_events.51.d: "Purchasing agent Xiao Li arrived at the supply and marketing cooperative early in the morning. Though he had been working for years, he still felt a bit nervous every time he handled a purchase—it was, after all, a job that easily offended people. At the entrance of the cooperative, a crowd of villagers had already gathered. Old Yang waited in line, staring at the prices on the blackboard, furrowing his brow and sighing, “The price of grain has dropped again this year—only three cents per jin. How are we supposed to keep farming like this?”\n\nThe villagers murmured in agreement.\n\n“This low price completely crushes all our hard work. What can we even do with this little money?” a woman grumbled impatiently.\n\nWhen it was Old Yang’s turn, he placed his sack of rice on the weighing platform. Behind the counter, Xiao Li didn’t even look up—perhaps because he was too busy weighing the grain, or perhaps because he was too nervous. \n\n“Three cents per jin, fifteen jin total, that’s forty-five cents,” Xiao Li announced. \n\nOld Yang was stunned for a moment, speechless. Then, unable to hold back, he asked, “Xiao Li, just this little money? Not even a single cent increase this year?” \n\nXiao Li could only shake his head helplessly. “Uncle Yang, the government sets the price. We at the cooperative can’t do anything about it. Who wouldn’t want to pay more? It’s good business to keep everyone happy.”\n\nClutching the small sum of change in his hand, Old Yang’s voice carried a trace of anger. “This price isn’t even enough to buy fertilizer.”\n\nBack home, Old Yang put the coins down, his expression bleak. He reached into his wooden cabinet and pulled out an aged bottle of liquor. As the bitter liquid burned down his throat, an even deeper bitterness welled up inside him—one he couldn’t quite put into words.\n\nAfter a long day, Xiao Li and the other staff at the cooperative finished loading the purchased agricultural products and returned to the county. The wheat was milled into flour, the rice husked, the pork stamped with official seals, and everything was loaded onto trucks bound for Hanzhong. \n\nBy the next day, all these products were stocked on the shelves of Hanzhong’s supply and marketing cooperatives—priced just a little higher than when they were bought."
 CPC_main_story_events.51.o: "Next Page"
 CPC_main_story_events.52.t: "Once a desire arises, it knows no end."
 CPC_main_story_events.52.d: "The rain poured heavily today. Looking out from the study window, the dense raindrops pelted the streets and rooftops. In Xi’an, where the weather was either oppressively hot or bone-chillingly cold, such a refreshing rain was rare. For the middle-aged man sitting in the study, whose mind was in turmoil, this downpour provided a fleeting sense of calm.\n\nA gentle knock came at the door. The woman, busy in the kitchen, walked over to open it. Standing outside was a young man carrying a small gift. Before stepping in, he greeted politely, \"Hello, Auntie.\" The woman immediately recognized him—it was her nephew, whom she hadn’t seen in years.\n\nAs soon as the young man entered, he placed the watermelon and a small cut of pork on the table. Just as he was about to ask where his uncle was, he saw the weathered-looking middle-aged man emerge from the study. His heart leaped with joy, and he rushed forward to embrace him.\n\n\"Xiao Guo, your uncle is now Director Guo of the Public Security Bureau. You really don’t need to bring gifts anymore,\" his aunt remarked with a hint of reproach, though her voice was filled with warmth. \"By the way, did anyone give you trouble when you entered the city?\"\n\nXiao Guo shifted slightly, feeling somewhat uneasy at her concern. He moved closer to his uncle and whispered softly, \"No, no trouble.\" His aunt nodded in relief, picking up the watermelon and pork and taking them into the back room.\n\nThe back room contained all sorts of things—meat, eggs, milk, fruit, tea, and cigarettes were just the surface. But among them sat a large, heavy wooden chest. As for what lay inside—no one dared to ask, and no one could answer.\n\nThere was an unspoken rule in this household: anything brought by a guest was always placed in that back room.\n\nHis aunt returned to the living room and, seeing the elder and younger man deep in conversation, asked, \"What are you two talking about?\"\n\n\"The hard days of the past,\" Director Guo sighed. \"Back then, our family had no grain. We went to my younger brother’s house for help, and he shared what little rice he had left with us. If he hadn’t, we might have starved to death that year. We wouldn’t have lived long enough to join the Red Army.\"\n\nHe turned to his nephew and said, \"Child, your father treated me so well. I cannot let you suffer. Since the rain is pouring so hard today, don’t go back yet. I’ll write your father a letter and tell him you’ll stay with me for now. I’ll arrange a job for you.\"\n\nThe next day, Xiao Guo was taken to the Public Security Bureau by his uncle, the director, where he was assigned a night patrol duty.\n\nThat night, as silence engulfed the city, the director’s office remained the only illuminated spot in the area. He opened the lowest drawer of his desk and pulled out a thick ledger. Flipping to the latter pages, he dipped his brush in ink and carefully wrote: \"One tael of pork, two watermelons, gifted by nephew.\" \n\nBut as his eyes drifted upward on the page, the previous entries were far more shocking—  \n\"Three taels of gold, half a jin of silver, one pair of jade bracelets, gifted by Director Wan.\"  \n\"Three hundred pounds of meat tickets, nine hundred pounds of grain tickets, gifted by Section Chief Wang.\"\n\nSuddenly, the door burst open with a loud bang. The force shook his hand, causing the brush to slip from his grip and fall to the ground. A group of officers stormed into the study, surrounding him. On their red armbands, bold characters read: Three-Anti Campaign.\n\nDirector Guo’s vision blurred. The room spun around him. Then, his body went limp, and he collapsed to the floor."
 CPC_main_story_events.52.o: "Judgment Comes"
 CPC_main_story_events.53.t: "A meal"
 CPC_main_story_events.53.d: "\"Master Zhang, come over for a moment.\"\n\nZhang Jiuxing, busy at the stove, turned his head upon hearing someone call him. It was Qin An, the head of the commune, standing at the back door. Quickly, he handed over the big pot to his apprentice, washed his hands, and rushed over in his usual brisk manner.\n\n\"Director, what brings you here today? Just tell me if there's anything you need—I’ll do my best to help!\"\n\n\"It's nothing major. I just wanted to check how the meals in the communal canteen are. Since I usually eat what my wife cooks, I don’t really know if the food here is tasty, nutritious, or sufficient.\"\n\nHearing this, Zhang Jiuxing assumed that the director was about to praise his work and replied confidently, \"Director Qin, rest assured! There's always plenty of food in the big pot, and everyone eats their fill. In fact, we even have leftovers every day.\"\n\n\"Leftovers? But today, a city inspection team is coming to check on food waste issues...\" Qin An shook his head, and Zhang Jiuxing felt as if he had been hit by a heavy blow.\n\nSeeing his reaction, Director Qin patted the burly cook on the shoulder and spoke in a serious yet reassuring tone, \"Just dump the leftover food into the vegetable garden for now. It's not a big problem, but grain should not be wasted. Here’s the plan: today’s reception meal will be served in the main hall, and four dishes with one soup will suffice. From now on, this will be the standard for meals.\"\n\nHearing that there was a solution, Master Zhang began thinking from Qin An’s perspective. \"But if we budget for meals based on the four-dish-one-soup standard, the purchasing costs will be much lower than before. What should we do with the extra money...?\"  \n\n\"Oh, you don’t have to worry about that. I know the canteen staff have a tough job. Just inform the accountant to distribute the extra funds as a bonus for you all. The only issue is that some cadres or model workers might complain about the meals being insufficient. If that happens, the kitchen will have to work a bit harder and prepare an extra dish upon request.\"  \n\nZhang nodded repeatedly in agreement.  \n\nThinking the matter was settled, he was about to return to the kitchen when Qin An stopped him again, slipping four cigarettes into his pocket. \"Make sure to dispose of the leftovers properly—cover them with soil and clean the buckets thoroughly afterward.\"  \n\n\"Oh, and I need four bottles of liquor from last year’s stock. A meal like this always calls for some alcohol. I’ll head over to the labor site to explain things to the workers, so they don’t blame you for the meal adjustments. You've worked hard today.\""
 CPC_main_story_events.53.o: "“No worries, frugality and hard work—always following the Party’s lead!”"
 CPC_main_story_events.54.t: "Bad luck?"
 CPC_main_story_events.54.d: "In the depths of the dark night, two or three trucks carrying prisoners and soldiers rumbled along the uneven dirt road, swaying unpredictably as they made their way to the execution ground. The journey’s final stop had yet to be reached, but for the tightly bound prisoners, today was undoubtedly the final destination of their lives. They were former Party members, now labeled counter-revolutionaries, stripped of their positions and condemned in the ongoing Three-Antis Campaign.\n\nWang Xiaoguang was among them. Eyes shut tight, head lowered, he tried to block out the sight of the soldier standing before him, the steel barrels of the rifles, and the green military uniforms. Instead, he found himself retracing the steps that had led him to this truck.\n\nJust a week ago, he had still been an official in the Hanzhong Municipal Party Committee. But in this period of fierce anti-corruption crackdowns, a fatal misstep had sealed his fate. The city government had convened a meeting to discuss municipal construction, deciding to deploy a work team with funds allocated from the municipal budget. The responsibility of staffing the project had fallen on him. With no time to personally oversee the hiring process, he had entrusted the task to subordinates, even slipping them some \"hardship compensation.\" But as soon as construction began, two workers lost their lives.\n\nHow could this have happened? He had only shifted some funds—why had the project resulted in deaths? Before he even had time to address the situation, the foreman had already gathered the victims’ families and stormed the municipal government building, bloodied garments in hand, demanding justice. Helpless, Wang Xiaoguang had tried to pacify them with kind words and good tea, hoping to smooth things over.\n\nAt the same time, another disaster struck: a dispute had erupted at a sand-mining site downstream. Villagers, unwilling to let their river be occupied, had confronted the miners. The argument quickly escalated into violence, leaving one dead.\n\nWorst of all, the two incidents overlapped. Two angry groups descended upon the municipal government together, demanding answers. Overwhelmed, Wang Xiaoguang had given the order to forcibly disperse the crowd. In the chaos, an elderly man stumbled, fell, and never got back up.\n\nNow, as the trucks ground to a halt at the execution ground, Wang Xiaoguang still could not understand. Even as the gunshot rang out, burrowing a hole through his skull, the only thought in his mind was—how had he been so unlucky?"
 CPC_main_story_events.54.o: "Deserve it"
 CPC_main_story_events.55.t: "Doing business(2)"
 CPC_main_story_events.55.d: "Half a day later, in Hanzhong.\n\nThe workday had ended. Old Zhang took off his work uniform and went to the washbasin to splash some water on his face. Humming a tune, he made his way to the supply and marketing cooperative next to the factory. Today, he planned to buy three pounds of pork to celebrate his precious daughter’s birthday.\n\nA few people were scattered in line at the cooperative. Aunt Chen, the shop assistant, swiftly brought down her cleaver, slicing off a piece of pork and handing it to the first customer.\n\"Here, this is yours,\" she said.  \n\nThe customer frowned at the cut of meat, displeased.  \n\"What kind of cut is this? Just a tiny bit of lean meat—am I supposed to go home and render pork lard?\"  \n\nSeeing that the two were about to argue, Old Zhang glanced at the customer and recognized her as his neighbor, Second Sister Liu. There had been past friction between Liu and Aunt Chen, and last time, Aunt Chen had been in the wrong. It seemed today she was trying to settle the score.  \n\n\"Forget it, I’ll take it anyway!\" Liu said, handing over her money and ration tickets before grabbing the pork and leaving in a huff.  \n\nWhen it was Old Zhang’s turn, he put on a beaming smile.  \n\"Aunt Chen, how have you been lately?\"  \n\nNo one comes with kind words for nothing—Aunt Chen gave him a sideways glance.  \n\"What’s the matter? Want a better cut of meat? That depends on my mood.\"  \n\nStill smiling, Old Zhang explained, \"It’s Pingping’s birthday today. I want to make some braised pork for her to celebrate.\"  \n\n\"Oh, it's for Pingping!\" Aunt Chen’s face lit up with a wide smile. \"That little girl is so sweet with her words! Come, come, I’ll cut a good piece for her. And I’ll throw in some of my handmade noodles—cook her some longevity noodles!\"  \n\nOld Zhang politely declined a few times but eventually accepted the extra gift. He walked home happily, pushing open the door to find his daughter sitting in the living room, doing her homework.  \n\nScooping her up into his arms, he playfully shook the noodles and the pork in his hands."
 CPC_main_story_events.55.o: "\"Pingping, tonight we're having braised pork and longevity noodles!\""
 CPC_main_story_events.56.t: "Proactivity"
 CPC_main_story_events.56.d: "\"Heave-ho!\" After planting the last rice seedling, Old Zhou wiped the sweat off his forehead and looked at the sun sinking westward. He and several villagers had been working in the fields all day, their pant legs covered in mud. Sitting down on the field ridge, he pulled out his pipe, skillfully packed some tobacco into his water pipe, struck a match, took a small puff, and exhaled a thin wisp of smoke.\n\nOld Zhou was a well-known model worker in the commune—diligent, quick with his hands, always busy in and out of the fields. A day’s work in the rice paddies was nothing new to him. But lately, he had felt uneasy: the work was done, but the labor points he earned were becoming increasingly worthless. After a whole year of toil, the food and money distributed at the end barely sustained his family. Even the grain he sold to the supply and marketing cooperative didn’t bring in much cash. \n\nAs the sky darkened, the villagers gradually finished their work and headed home. Pushing his cart along, Old Zhou noticed a few commune members gathered around the announcement board, discussing something. He caught bits of their conversation: \"piecework wages,\" \"distribution according to labor,\" \"cash payments.\" His interest piqued, he walked over. On the board was a notice titled *Decision on Rural Wage Reform*, stamped with the red seal of the National Defense Front. As he read carefully, he overheard a villager murmuring, \"Gradually stopping the labor points system, replacing it with grain vouchers and cash wages.\"\n\nWages? Grain vouchers? So, from now on, working in the commune would be like having a city job, with actual salaries? The thought excited him. The villagers around him also started discussing it, imagining a future different from the past. Old Zhou was the first to speak up: \"I think this is great! Before, whether you worked hard or not, the reward was the same. Sometimes, even if you wanted to do more, there was no motivation. But if we get paid based on our work, people will be more dedicated!\"\n\nAs the seasons changed, the commune introduced the \"piecework wage system\" during the harvest season. Cutting rice and bundling sheaves were now paid by weight and acreage—one yuan per mu, a relatively high rate for the county. The commune secretary had worked hard to secure this price. Upon hearing the news, Old Zhou was thrilled, thinking that if he put in extra effort this year, he might earn much more than before.\n\nWhen harvest time arrived, the fields were bustling with activity. The villagers were full of energy, eager to see how much they could reap. In the past, everyone worked together, splitting labor points; but this year was different—people were racing against each other, trying to harvest as many acres as possible. Old Zhou, like a well-fed ox, worked tirelessly from dawn until long after dark, ignoring his aching back. Every extra mu harvested meant another yuan in his pocket—real, tangible money.\n\nA few days later, the harvest was complete. Bundles of rice stood neatly in the fields, ready to be loaded onto carts. The commune distributed wages, and Old Zhou counted his bills over and over, unable to contain his smile. His heart swelled with joy as if it were filled with honey. \n\nOn his way home, he walked briskly, already making plans—this year, he could buy some new furniture for the house and get good fabric to make new clothes for his wife and son."
 CPC_main_story_events.56.o: "A bright future requires confidence in the present."
 CPC_main_story_events.57.t: "\"Liberation Daily: Team-Commune Settlement Ensures Fair Distribution of Profits (Excerpt)\""
 CPC_main_story_events.57.d: "Dispute Over Profit Distribution Sparks Concern Among Commune Members\nDuring the annual profit settlement in a production brigade in Xianyang, some members noticed discrepancies in their dividends, leading to widespread concerns about financial transparency and fair allocation. With the active participation of all members and the guidance of local cadres, the issue was resolved through collective efforts, setting an exemplary model for the broader collective economy of the National Front.\n\nProfit Dispute Raises Concerns Among Members\nAs per tradition, the production brigade in Xianyang conducted its year-end profit distribution. After a year of hard work, many members eagerly anticipated their dividends to supplement household expenses. However, upon the announcement of the distribution plan, some members found discrepancies in their shares, with several households being entirely left out. An elderly member, Li, voiced his frustration: “We have toiled for a whole year—this distribution cannot be handled carelessly!” This led many to question the financial management of the brigade, demanding an open review of the accounts.\n\nFormation of a \"Review Committee\" to Safeguard Members' Rights\nRecognizing the gravity of the concerns, Brigade Secretary Wang immediately convened a general meeting, encouraging members to engage in discussions under Chairman Mao’s democratic principle of \"unity, criticism, unity.\" The meeting resulted in the unanimous decision to form a \"Review Committee\" to scrutinize financial records and ensure equitable profit distribution. This ten-member committee was democratically elected by the members, comprising team leaders, senior members, and young members proficient in accounting. They undertook the task with a strong sense of duty and enthusiasm.\n\nThorough Investigation Uncovers Accounting Errors\nThe committee diligently examined the financial records in the brigade’s office over three consecutive days. Working in unison, they meticulously verified every income, expense, and allocation. Their investigation revealed that errors in bookkeeping had led to the omission of certain members from the profit distribution. Additionally, misunderstandings about the team-commune settlement system among some members had contributed to the confusion. Through patient clarification and transparent disclosure, the committee successfully alleviated these concerns.\n\nPublic Discussions and Adjustments with Democratic Participation\nOnce the financial discrepancies were clarified, the committee publicly posted its findings and proposed corrective measures to compensate the affected members. During a subsequent general meeting, the responsible accountant issued a formal apology and pledged to prevent such issues in the future. The committee also suggested implementing an \"open accounting\" process during annual settlements to enhance transparency and allow member oversight. The initiative was well received, and members expressed renewed enthusiasm for their labor in the coming year."
 CPC_main_story_events.57.o: "A young commune member said, \"Only by actively participating in supervision can we truly have confidence in the commune.\""
 CPC_main_story_events.58.t: "Tail and Vanguard"
 CPC_main_story_events.58.d: "\n\"The great work your brigade has done!\" Secretary Tang was furiously berating the brigade leader in front of him. \"'Cutting off the capitalist tail' is meant for the cities, not for you to implement in the production brigade! The nonsense you've done in the production team has already reached the central government! Why did you seize all the chickens and ducks raised by the people? Do you want them to starve? Do you want the People's Liberation Army to starve?\"\n\nSecretary Tang's usual gentle demeanor had turned into anger, and he even occasionally spat out harsh words. Sweat began to bead on the brigade leader’s shiny bald head. Tang, now parched from the scolding, paused to take a sip of water. Seizing the brief moment, the brigade leader hesitantly asked, careful not to provoke more fury from the county secretary, \"I heard about 'struggling against capitalism and criticizing revisionism.' Some commune members are too focused on raising chickens and ducks, neglecting collective labor, so I thought...\"\n\n\"PAH!\" Secretary Tang slammed his enamel cup on the table, grabbed a newspaper, and thrust it in front of the brigade leader. The bold headline read: \"Take grain as the key link, develop agriculture, forestry, animal husbandry, sideline production, and fisheries in an all-around way.\"\n\n\"This was already written in the newspaper three months ago! It was clearly stated in the meeting just last week! Just because the cities recently started 'cutting tails,' you went and chopped off the lifeline of the farmers?!\" Tang glared at the brigade leader as if looking at a fool. \"Enough. I'm going back with you to the production team. And you—you're no longer the brigade leader!\"\n\nUpon returning to the commune, Tang could read the collective emotion in the farmers' complex gazes—resentment toward their former leader.\n\n\"Comrades, I apologize for your suffering. 'Capitalist tail'? If there’s any real tail, it's him.\" Tang pointed at the deflated former brigade leader, whose entire body, except for his bald head, had lost its luster. Some farmers, seeing his embarrassed state, smirked; others even laughed outright.\n\nTang ordered an inventory of the brigade’s livestock. When the farmers checked, they found that about one-fifth of the chickens and ducks had already died. Some who discovered their own poultry dead burst into tears.\n\nTang quickly reassured them, \"Comrades, this scoundrel caused you distress and financial loss. I promise you that this will never happen again. Chairman Mao supports you! He personally said we must support the development of sideline farming. Just last week, our meeting emphasized encouraging communes to develop sideline industries according to local conditions.\"\n\nSome farmers calmed down, but many remained upset. \"This year’s meat production is definitely going to decline. What’s the point of all this talk?\" one asked indignantly.\n\nTang firmly replied, \"I will apply to make your production team a model brigade. While there was no formal directive yet, you had already started raising all these chickens and ducks for the cause of socialism. How is that a 'capitalist tail'? If anything, it's the 'socialist vanguard'! In the future, the People's Liberation Army will surely eat the poultry you raise to help liberate the eastern regions.\"\n\nHearing Chairman Mao’s endorsement and Tang’s assurances, many farmers regained their confidence. After more mediation and encouragement, they returned to their work—continuing to fight for the revolution."
 CPC_main_story_events.58.o: "\"Where there is human action, there is bound to be imperfection.\""
 CPC_main_story_events.59.t: "The story behind the chili sauce"
 CPC_main_story_events.59.d: "Xinhua News Agency Sichuan Interview Special Report:\n\nI am an ordinary farmer from Liu Village, Sichuan, named Liu Ping. My family has been poor peasants for three generations, relying on farming for a living. Looking back on our village’s cooperation with the pickle factory, my heart is filled with emotion.\n\nWhen the cooperative was first established, life in our village was uneventful. The chili peppers we grew did not fetch a good price, and most of them were used as a daily seasoning in our own meals.\n\nAt that time, our production team leader, Secretary Liu, heard that the county’s pickle factory was looking for high-quality chili peppers. He invited the factory leaders to our village to discuss potential cooperation. I remember it very clearly—Secretary Liu had the factory leaders taste our village’s dried chili peppers, and they praised the strong aroma. From then on, our village and the factory signed a contract, securing a good price for our chili peppers. The county also sent agricultural experts to guide us step by step on how to grow chili peppers according to their standards and minimize unnecessary waste. They emphasized that the chili peppers must have a strong spiciness, a vibrant color, and be free from pests and diseases.\n\nWith the help of experts, I and many of the older farmers in the village began to follow standardized planting techniques. Every plot of land in the cooperative was carefully planned—seed varieties, spacing, and fertilizer application all had clear guidelines. Initially, we struggled with the new methods. Some people over-fertilized, while others lacked experience and encountered problems. Fortunately, the experts regularly inspected the fields and provided timely guidance.\n\nI remember when I first started applying fertilizer, I was hesitant to follow the experts’ recommendations, fearing that too much fertilizer would harm the chili peppers and waste resources. Expert Zheng personally came to my home, demonstrated the proper techniques, and explained how to use organic fertilizer efficiently while maintaining soil health. Gradually, I mastered the techniques, and our chili peppers grew better than ever—brighter in color, stronger in aroma and spiciness. Seeing the thriving fields, I thought to myself, \"This year, we will make good money, and I can buy new clothes for my family.\"\n\nOnce harvested, our chili peppers were sent to the factory, where they underwent cleaning, cutting, fermentation, and packaging, finally turning into the canned chili sauce we often see in supply cooperatives. I still remember the first time I tasted the sauce made from the chili peppers I grew—it was delicious, with a rich, spicy, and fragrant flavor. But most importantly, the factory’s purchase price for chili peppers was much higher than that of the supply cooperative, and they provided a stable annual procurement volume. This gave us great peace of mind and satisfaction.\n\nToday, our chili peppers are no longer just for personal consumption—they have become our village’s economic backbone. The pickle factory has established a long-term and stable partnership with us, signing contracts each year, ensuring that our sales are secure. Our incomes have increased, living conditions have improved, and many villagers have even built new houses. This growing prosperity is something we truly have to thank Secretary Liu for, and we are deeply grateful to the Party!"
 CPC_main_story_events.59.o: "Indeed are better times ahead!"
 CPC_main_story_events.60.t: "Records of Rural Communes in the 1960s"
 CPC_main_story_events.60.d: "Collected Case Studies of Rural Areas in the Northwest People's Revolutionary Base\n(1) The Role of Supply and Marketing Cooperatives in Rural Economies\nBackground: During the People's Revolutionary period in Northwest China, supply and marketing cooperatives played a crucial role in stabilizing rural economies by ensuring the timely distribution of agricultural supplies and resources.\n\nCase Study: Every spring, farmers in the village would flock to the supply and marketing cooperative to purchase seeds, fertilizers, and pesticides. Among them was Grandpa Wang, who relied on the cooperative every year. Despite the village being far from the city, the cooperative ensured that essential agricultural supplies were delivered on time and at reasonable prices.\n\nOne year, a severe drought struck the village, causing near-total crop failure. Grandpa Wang was deeply worried about how he would sustain himself in the coming months. Just when he was feeling desperate, staff from the supply and marketing cooperative visited his home, informing him that he could delay his agricultural payments and also receive emergency relief supplies. This timely assistance provided much-needed relief, and Grandpa Wang was deeply grateful to the cooperative.\n\n(2) The Expansion of Supply and Marketing Cooperatives and Its Challenges\nBackground: In a small town in Sichuan, financial constraints posed significant challenges. Despite these difficulties, the local supply and marketing cooperative continued to expand its functions beyond the supply of agricultural and industrial goods. The cooperative took on additional responsibilities, including education and healthcare, by establishing schools and clinics.\n\nCase Study: Initially, the cooperative invested substantial resources to operate these facilities. However, these efforts failed to gain widespread support from the villagers and did not yield the expected results. As time passed, the cooperative faced increasing financial strain, making it difficult to sustain its services. Additionally, frequent shortages of agricultural supplies led to growing dissatisfaction among farmers, who began to criticize the cooperative for failing to fulfill its primary role.\n\nInstead of providing substantial benefits to the rural population, the cooperative's overexpansion burdened the town's finances and ultimately reduced its ability to meet the fundamental needs of the farmers.\n\n(3) Rural Cooperation and Agricultural Prosperity\nBackground: Zhou Jun, a young farmer from a rural village, joined a rural cooperative with the assistance of the supply and marketing cooperative.\n\nCase Study: With the cooperative's help, Zhou Jun and other farmers collectively purchased high-quality seeds and fertilizers. Through group sales, they significantly reduced production costs. The cooperative also provided financial support and regularly organized agricultural training sessions to enhance farmers' technical skills.\n\nUnder the guidance and backing of the supply and marketing cooperative, Zhou Jun's vegetable farming yields increased year after year, and his income grew substantially. Each time the cooperative's sales figures improved, Zhou Jun would exclaim with gratitude, “The supply and marketing cooperative is a true friend of farmers. Without it, life wouldn’t have improved this much.”"
 CPC_main_story_events.60.o: "Indeed, the merits, faults, and rights or wrongs of all matters shall be judged by future generations."
 CPC_main_story_events.61.t: "Report From Southwest Bureau"
 CPC_main_story_events.61.d: "Top Secret\nCentral Committee:\n\nThe Xikang Party Committee has, in general, adhered to the eight-character policy formulated by the Central Committee and Mr. Liu Wenhui for the development of the Kang region: \"Ethnic Autonomy, Tibetan Liaison.\" Through the tireless efforts of responsible comrades in the Party organizations stationed in Kang, the local minority situation has been largely stabilized, and planned socialist transformation has begun, progressing smoothly and steadily.\n\nDuring the democratic reform process, the Kang-Tibet Work Committee, led by Comrade Fan Ming, actively pursued united front efforts with the Gaxha government of Tibet, promoting the Central Committee’s policy of peaceful liberation of Tibet. However, the Gaxha authorities, under the Dalai Lama, have refused to accept the Front’s peace proposals, repeatedly expressing dangerous separatist sentiments in their correspondence. They have even falsely claimed that Tibet has always been an independent \"Buddhist nation\" under the protection of deities, with no historical affiliation to China.\n\nWe have not abandoned the possibility of securing support from within Tibet’s religious and political elite. Through long-term contact, we have gained a deeper understanding of Tibet’s reincarnate lama system, which primarily revolves around the Dalai and Panchen lineages. The Dalai Lama is the ruler of Ü-Tsang (Central Tibet), while the Panchen Lama holds authority in Tsang (Western Tibet). Within the Tibetan Buddhist monastic order, both figures hold supreme status. Every Tibetan Buddhist monastery—whether in Tibet, Kham, Amdo, Qinghai, Gansu, Mongolia, or the interior of China—is nominally under the Dalai Lama’s jurisdiction, with him regarded as their spiritual leader. The Panchen Lama, second only to the Dalai in religious authority, does not wield as much direct control over the monasteries.\n\nSince the 12th year of the Republic of China, tensions have existed between the Panchen and Dalai lineages. The 9th Panchen Lama fled Tibet for Lanzhou, where he was placed under the protection of the Beiyang government, remaining in the interior until his death in 1937. Meanwhile, the 13th Dalai Lama passed away at the end of 1933. The discord between these two highest religious leaders has been inherited by their successors, and the rivalry between their factions has now escalated to the brink of splitting Tibet.\n\nThe Dalai Lama’s administration in Lhasa, under the leadership of the regent and the Gaxha government, continues to follow the 13th Dalai’s strategy of distancing Tibet from Chinese influence. In contrast, the 10th Panchen Lama, who has long resided in the interior, maintains close relations with the Han Chinese. His entourage, organized around the Panchen’s Administrative Office, upholds his authority and strongly supports the Central Committee’s policy of peaceful unification.\n\nFollowing the Dalai faction’s territorial expansion with Japanese support, the Panchen Administrative Office has grown increasingly dissatisfied. It has since reached out to our side, expressing willingness to offer full cooperation. Therefore, the Party organizations stationed in Kang propose that the Central Committee seize this opportunity to establish direct contact with the Panchen representatives and make all necessary preparations for the swift liberation of Tibet."
 CPC_main_story_events.61.o: "By Li Han, Southwest Bureau"
 CPC_main_story_events.62.t: "Secret letter from Panchen"
 CPC_main_story_events.62.d: "To Chairman Mao of the Northwest Central People's Government of the National Defense Front and General Commander Zhu Junjian of the Chinese People's Liberation Army:\nYour Excellencies possess both great wisdom and immense courage, having accomplished the noble endeavor of rescuing the nation and its people. Wherever the righteous army advances, the people rejoice in jubilation. The Panchen Lama lineage has long received the benevolence of the state and enjoyed great prestige. For over twenty years, I have tirelessly called for the protection of Tibet’s territorial sovereignty, never once relenting in my efforts. However, as no resolution has been achieved, my heart remains heavy with sorrow.\nNow, under Your Excellencies' leadership, the Northwest has been liberated, and the border peoples rejoice in unison. The time for the people's well-being is near, and the nation's revival is within reach. Even the long-overlooked people of Tibet now eagerly anticipate their liberation and salvation. Therefore, I earnestly appeal to Your Excellencies to lead the righteous army in liberating Tibet, eradicating the traitorous elements, and rescuing the Tibetan people. On behalf of all my Tibetan compatriots, I extend to Your Excellencies my highest respects and pledge my unwavering loyalty and support.\nPanchen Erdeni\n\nReply Telegram:\nWe have received and read your message with great appreciation. The Tibetan people love their motherland and oppose foreign aggression. They are dissatisfied with the policies of the reactionary government in Lhasa and aspire to be part of a unified, prosperous, and democratic New China, where all ethnic groups cooperate as equals. The National Defense Front of China and the Chinese People's Liberation Army will surely fulfill the wishes of the Tibetan people.\nWe hope that you and all patriotic individuals in Tibet will work together to strive for the liberation of Tibet and the unity of the Han and Tibetan peoples."
 CPC_main_story_events.62.o: "The path to Tibet's liberation has taken another step forward."
 CPC_main_story_events.63.t: "The Return of the Living Buddha to His Homeland"
 CPC_main_story_events.63.d: "The towering mountains of Bayan Har and Qilian have long been the nightmares of explorers. Their winding, perilous terrain had once seemed insurmountable, but now, a long ‘black line’ silently stretches between them, leading far toward Xi’an. This is the Xicheng Railway, built with great effort by the Southwest Corps after the liberation of Sichuan, bridging the once-impassable divide.\n\nFrom the train window, one could glimpse fully armed PLA soldiers stationed along the route, dutifully carrying out security patrols. The Panchen Lama, still a young man in his late twenties or early thirties, could not yet fathom why the National Defense Front had assembled such a grand reception for him. Beside him, his translator, Phuntsok Wanggyal, beamed with joy and turned his head to remark, \"Your Eminence, the Central Government has arranged this with the highest regard. Chairman Mao and his comrades clearly place great importance on our arrival.\"\n\nThe Panchen Lama merely smiled at this, maintaining a serene and dignified demeanor. Yet, deep inside, he could feel his heartbeat quicken.\n\nUpon arrival at Xi’an Station, he was immediately met with an overwhelming sight—red flags fluttering in the wind, and bustling crowds eagerly awaiting his arrival. Every few streetlights bore banners with messages of \"Han-Tibetan Unity,\" \"Welcome Panchen Lama,\" and \"National Reunification.\" The fervor of the scene was palpable, yet it only heightened the Panchen Lama’s sense of unease.\n\nAfter a brief welcoming ceremony, he was swiftly escorted to the Xi’an People’s Government Conference Hall, where a gathering of the highest-ranking Communist Party leaders awaited him—**Mao Zedong, Zhou Enlai, Liu Shaoqi, Zhu De, Li Fuchun—**a lineup of revolutionary titans.\n\nChairman Mao was the first to break the silence, his tone warm and amicable:\n\n\"Master, how is your health? The journey was long—have you been treated well? Conditions here in the Northwest are still quite rough. If there’s been any neglect on our part, I hope you will forgive us.\"\n\nThe Panchen Lama quickly replied, \"Not at all, not at all! The Central Government’s hospitality has been impeccable, and the people of the Northwest have been overwhelmingly welcoming. Today, for the Chairman to personally meet with us shows his deep concern for Tibet, and for that, we are truly grateful.\"\n\nMao chuckled heartily, his voice laced with his characteristic humor:\n\n\"Since this is your first time here, as the host, it is only right that I show some proper hospitality. If I were to act all high and mighty like an emperor, then wouldn’t that give the people and even your delegation cause to denounce me as some feudal overlord?\""
 CPC_main_story_events.63.o: "The conference hall was filled with an atmosphere of joy and ease."
 CPC_main_story_events.64.t: "The Chinese people will never allow imperialist aggression against Tibet."
 CPC_main_story_events.64.d: "※※※The full text of the original article is published on the front page of Liberation Daily※※※\n\nRecently, a series of counterrevolutionary provocations orchestrated by the Tibetan local authorities along China's borders have been carried out under the instigation of Japanese imperialists and their accomplices in the East Indian government. The fundamental aim of these Japanese imperialists in colluding with the Lhasa clique to engage in such separatist activities is to lure Tibet away from the embrace of the motherland, turning it into yet another colony of the Pan-Asianist aggressors, stripping the Tibetan people of their freedom and independence, and reducing them to the slaves of the Japanese. The Chinese people have been closely monitoring the aggressive actions of the Japanese and Indian invaders alongside the Lhasa clique and have long engraved in their hearts the crimes of these forces that stand against the Chinese nation.\n\nTibet is Chinese territory. The Tibetan people have been part of the great family of China's ethnic groups for centuries, fostering brotherly ties with the Han and other ethnic groups within China. Any attempt to divide China's ethnic minorities from the Han people will inevitably lead to their enslavement under imperialist colonial rule. The Tibetan people will never willingly become colonial slaves, as evidenced by their heroic resistance against British imperialist invasions in 1887 and 1904. Within Tibet itself, the Lhasa clique, disregarding the interests of the entire nation, has aligned itself with Japanese imperialists. Under the false pretense of acting in the name of the Dalai Lama, they have pushed forward separatist movements, incited bloodshed, and brutally suppressed patriotic masses opposed to division, making them the enemies of all Chinese people. What the Tibetan people truly desire is to be part of the great family of the New Democratic China, not a colonial possession of Pan-Asianist imperialism. They seek the national autonomy policies implemented by the Communist Party of China, not separatist independence.\n\nTibet is Chinese territory and will never tolerate any foreign invasion; the Tibetan people are an inseparable part of the Chinese people and will never allow any foreign power to partition them. The recent advances of the People's Liberation Army into Xinjiang and the Southwest have been met with the enthusiastic welcome of local ethnic minorities. Everywhere the army passes, cheers line the roads, further proving the correctness of the Communist Party's ethnic policies and the exemplary discipline with which the PLA executes them. The Tibetan people, long oppressed by imperialists and the reactionary Ganden Phodrang regime, must unite to expose the imperialists’ conspiracies, break the shackles imposed upon Tibet by foreign forces, and prepare to welcome the People's Liberation Army’s advance into Tibet, bringing liberation to Tibet and the entirety of China."
 CPC_main_story_events.64.o: "Marching into the Plateau."
 CPC_main_story_events.65.t: "The Cold Wind of Hukou Waterfall"
 CPC_main_story_events.65.d: "The surging waters of the Hukou Yellow River failed to inject vitality into the frail, withered body of Fu Zuoyi. He had long since lost all hope, huddled in his soft sedan chair, wrapping himself tightly in a thick wool blanket, yet still feeling the biting cold wind stirred up by the rushing currents.\n\nThe government attendants walking alongside him remained ever vigilant, ready at any moment to respond to the old chairman’s habitual questioning—questions about the year’s climate, the river’s flood levels, the wheat harvest, and how many so-called “relief delegations” had been sent from Nanjing. These inquiries, while seemingly full of concern, were in fact hollow. In Fu Zuoyi’s mind, his questioning was proof of his enduring authority, yet those around him had long since grown accustomed to brushing off this deaf and dim-eyed old man with perfunctory answers.\n\nFu Dongju, walking beside him, sighed helplessly, “Father, you should speak less. Talking too much will only drain your energy.”\n\nFu Zuoyi lifted his weary head, his eyes, though cloudy, still carrying a trace of insight. He gazed at his daughter and spoke in a low voice, “I may be old, but I still know a little about what my daughter is up to in private…” He paused, then added in an even lower tone, “If I don’t ask them, they will come asking you instead.”\n\nFu Dongju understood her father’s warning. She did not respond, but a troubled expression lingered on her face as she stared at the turbulent waters cascading down the Hukou waterfall.\n\nFu Zuoyi’s murky eyes reflected the vast ravines stretching across the lands of Shanxi and Shaanxi. He let out a deep sigh, his gaze lost in the endless expanse of rugged terrain."
 CPC_main_story_events.65.o: "\"Winter wasn’t this cold before…\""
 CPC_main_story_events.66.t: "Message From Qiongzhou"
 CPC_main_story_events.66.d: "Top Secret – Original Telegram Copy Forwarded to the Ministry of Foreign Affairs and the United Front Work Department\n\nTo the Responsible Comrades of the Central Committee:\n\nIt has been over twenty years since our branch transitioned into underground operations. At present, the branch is functioning smoothly. Through meticulous disguise and deception, the enemy's Japanese officials have gradually lowered their guard regarding Hainan. Below is a brief report on the operational status of our branch in Hainan.\n\nUsing the \"Hainan Local Maintenance Committee\" as a cover, and with the cooperation of Hainan Provincial Government Chairman Tang Shengming, our branch has successfully established an extensive intelligence network and secret trade routes throughout Southeast Asia. Almost all Southeast Asian countries, and even U.S. military forces stationed in the Philippines, maintain favorable civilian trade relations with our branch. Additionally, we have maintained covert connections with indigenous anti-Japanese forces in Vietnam, Burma, and Cambodia, providing them with discreet support. Among them, the Kachin People's Army in Burma has amassed sufficient strength and is merely awaiting the moment to raise its banner and strike directly at the lackeys of Japanese imperialism.\n\nWith great joy, we have learned of the Central Committee's determination to break the blockade of the Greater East Asia Co-Prosperity Sphere. The development of the Liberated Areas is most encouraging. On behalf of all comrades of the Hainan branch, I extend our warmest congratulations. We pledge to remain steadfast in our loyalty to the leadership of the Central Committee and to unwaveringly follow its directives on Southeast Asian affairs.\n\nBaiju"
 CPC_main_story_events.66.o: "It's time to outland"
 CPC_main_story_events.67.t: "Reconstruct the Front"
 CPC_main_story_events.67.d: "The aging Zhou Enlai probably never expected that he would have the opportunity to reestablish an underground front—watching the busy telegraph room, a mix of complex emotions surged through his heart.\n\nSoon, a middle-aged woman stood behind him.\n\n\"Premier Zhou, were you looking for me?\"\n\nZhou Enlai turned his head.\n\n\"Ah, Comrade Dongju, come, let's find a place to sit. I'm looking for your file.\"\n\nAfter a brief moment, Zhou Enlai pulled out two files, put on his glasses, and began reading.\n\n\"You must miss home, don’t you? You've been in the Liberated Areas for so many years without a chance to reunite with General Fu.\" Zhou Enlai held the file closer to the lamp, reading it carefully.\n\nFu Dongju gave a bitter smile and lowered her head.\n\n\"Ah, it’s only human nature—how could I not? But I still believe that, compared to my father, I am more loyal to the Revolution.\"\n\nZhou Enlai looked up.\n\n\"Alright, I won’t keep you guessing anymore. The Central Committee has issued a secret directive: the underground front must be restarted, and our first wedge into the East will be driven into Shanxi—where General Fu is stationed.\"\n\nFu Dongju immediately understood.\n\n\"You want me to go to Shanxi to persuade my father?\"\n\nZhou Enlai waved his hand.\n\n\"General Fu... Here is our carefully formulated plan, which has already been approved by the Central Committee.\" He handed the file to Fu Dongju.\n\nFu Dongju leaned forward, reading the document in silence for a long time.\n\n\"Well? Do you foresee any difficulties?\""
 CPC_main_story_events.67.o: "\"Of course, No!\""
 CPC_main_story_events.68.t: "Minutes of the Central Committee's Meeting with the Panchen Lama"
 CPC_main_story_events.68.d: "Panchen Lama: \"Lhasa had imprisoned me for many years. This time, Tibet's return to the embrace of the motherland is primarily due to the leadership of Chairman Mao.\"\n\nChairman: \"This is not just me; it is the leadership of the Communist Party, the help of the People's Liberation Army, and also your own efforts and the welcoming of the Tibetan people. Things will take time. Is the Dalai Lama still in Lhasa?\"\n\nPanchen Lama: \"On the first day of the PLA entering Tibet, the Kashag took the Dalai Lama and fled to Bhutan.\"\n\nChairman: \"We welcome his return, but the Kashag disagrees. They are afraid of us, and some people do not understand us. You fear Lhasa, and Tibetans fear the Han people. It’s common for the smaller to fear the larger. This is not surprising. The oppressive rule of the old feudal Han ruling class has caused a negative impact, creating fear and bad impressions of the Han. Therefore, we must do many good things in the future to gradually make the Tibetan people believe that the Han are here to help them, not to harm them. This will require our efforts, and we must do so over the long term.\"\n\nPremier Zhou: \"It is necessary to grant Tibet a high degree of autonomy. This is a decision made by the Party Central and Chairman Mao. The State Council is reviewing and approving the Tibetan Autonomous Law, and support projects for Tibet’s construction have already been passed. We will not disappoint the Tibetan people’s expectations.\"\n\nAfterward, the leaders of the Front began to speak one by one. The Panchen Lama gradually felt that, although the meeting was about Tibet, as one of Tibet's highest leaders, he had almost nothing to say. Finally, when the first secretary of the Southwest Bureau, Li Fuchun, finished speaking, all eyes turned to him.\n\nThe Panchen Lama had no choice but to smile and stand with the translator: \"Don’t look at me, you all have already arranged the future of Tibet so well.\"\n\nAfter a brief silence, Zhou Enlai spoke slowly: \"Master, do you have any comments or suggestions?\"\n\nPanchen Lama: \"I support the establishment of the Tibet Autonomous Region in the future, but what about the faith of the thousands of my followers in Tibet, and the Buddhist tradition that has lasted for centuries in Tibet? How does the central government plan to handle this?\"\n\nEveryone exchanged glances, and it was still Zhou Enlai who smiled and spoke: \"That depends on you, Master.\"\n\nThe Panchen Lama finally understood the intentions of the Front. Under the watchful or expectant gazes of the others, he smiled wryly and nodded: \"In that case, I will start preparing my lecture notes tomorrow…\""
 CPC_main_story_events.68.o: "The title would be: \"Buddhism and Socialism\"."
 CPC_main_story_events.69.t: "Mysterious phone call"
 CPC_main_story_events.69.d: "Respected Chairman Mao and the Central Committee of the Communist Party of China,\n\nBy the time you receive this telegram, the world will have entered a new era—the era of world revolution.\nChairman Mao has not only called upon the people of the world to overthrow the largest, most brutal, and most vicious imperialist power in Asia—Japanese imperialism—but has also established Western China as a stronghold to ignite national and social revolutions across the Indo-Pacific region. In the raging flames of struggle, not only will Japanese imperialism collapse, but the reactionary Nazi imperialists and the hypocritically \"progressive\" American imperialists will also fall. A world free of exploitation, a world of true freedom, will inevitably be established.\n\nThe centuries-old dreams of the oppressed, the enslaved, and the exploited shall finally become reality! Chairman Mao, the great helmsman, is the only savior of humanity! He raises the red banner of world revolution high, leading us forward, and victory will undoubtedly belong to us. Long live Chairman Mao! May Chairman Mao live for ten thousand years!\n\nWe shall witness the dawn of a free and liberated India, shining with a brilliant light, and the light of the East shall illuminate the West. The world will rid itself of all suffering, waste, destruction, and death, as we step into this magnificent new era.\n\nOur responsibilities are great, but we are certain to fulfill our mission, for the infinitely powerful Chairman Mao is still with us! He brings the warmth of the sun to our hearts, and we shall shatter this filthy old order. The people of the world are watching us, for we are the five hundred million people of India! Once this great nation awakens, it will unleash an extraordinary force, and what seems impossible will become possible! Believe in the masses, march forward with unwavering determination! Victory is certain to be ours!\n\nLong live Chairman Mao! Long live the people's democratic revolution of India!\n\nCharu Mazumdar\nCentral Committee of the Communist Party of India (Marxist-Leninist)"
 CPC_main_story_events.69.o: "India? Mazumdar? Long live Chairman Mao?"
 CPC_main_story_events.70.t: "Rural Market"
 CPC_main_story_events.70.d: "Every village’s dirt roads were filled with farmers in coarse linen clothing, carrying shoulder poles and making their way in the pitch-black early morning. The roosters had yet to crow. They hurried toward the town’s farmers' market, eager to set up their vegetables before sunrise. If they waited until daylight to transport their produce, not only would all the good spots be taken, but buyers might also think their vegetables weren’t fresh.\n\nThe roosters crowed into the deep blue sky, continuing until the sun had fully risen.\n\n“Dakuan, Dakuan, wake up and come buy vegetables with Grandpa.”\n\n“Grandpa, I’m coming.”\n\nZhang Dakuan got up and followed his grandfather toward the farmers' market, greeting neighbors along the way.\n\nThe market gate’s lock had been opened early and now hung quietly on the iron doorpost. The place was bustling—some people were haggling over vegetables displayed on stone tables, while those unwilling to bargain wrote prices on wooden boards with white chalk. As Dakuan and his grandfather entered, they happened to see a live pig being slaughtered. Several shirtless, muscular men pinned the fat pig down while the butcher made a swift cut to drain its blood. After that single stroke, all Dakuan could hear in the market was the pig’s wailing, but even that was soon drowned out by the noise of people.\n\nWhen he turned around, all he could see was his grandfather’s broad back. The cloth bag in Grandpa’s hand already held a few heads of cabbage and some large radishes. At that moment, Grandpa was bargaining with a vendor selling eggplants. Dakuan gazed at the towering pile of eggplants, realizing they were stacked even higher than he was tall."
 CPC_main_story_events.70.o: "Three catty vegetable coupons, buy and head home."
 CPC_main_story_events.71.t: "Concept Gun?"
 CPC_main_story_events.71.d: "The Japanese experts in the research institute were chattering in their native language, while the party secretary of the banner furrowed his brows, listening intently as the Japanese interpreter translated sentence by sentence.\n\n“So, you’re saying that the blueprints we confiscated from the Howa Heavy Industries factory are… what exactly?”\n\nThe interpreter quickly reminded him, “Concept guns.”\n\n“Oh, right. And what exactly is a concept gun?”\n\nAnother round of rapid Japanese followed.\n\n“Sir, concept guns are firearms that cannot be produced with the current level of industrial technology—they only exist on paper as design concepts.”\n\n“So, Mr. Yamashita, when was this gun designed to go into production?”\n\nThe Japanese expert adjusted his glasses and, in very broken Chinese, answered, “Secretary… sir… this gun… Co-Prosperity Sphere… next year… need.”\n\nThe secretary nodded, deep in thought."
 CPC_main_story_events.71.o: "\"Seems like we still need time.\""
 CPC_main_story_events.72.t: "Death of Fu Zuoyi"
 CPC_main_story_events.72.d: "The Taiyuan provincial government was draped in mourning today, conveying an unmistakable message to all: Fu Zuoyi—the successor to Yan Xishan, the paramount leader of Jin-Cha-Sui, and the master of Shanxi—had peacefully closed his eyes for the last time at 6:13 AM this morning, passing away in his Taiyuan residence under the watchful gaze of his daughter, Fu Dongju, and Yan Xishan’s trusted aide, Liang Huazhi.\n\nAt 11:23 AM, a funeral banquet was held at Fu Zuoyi’s residence. His beloved daughter, Fu Dongju, presided over the ceremony and delivered a eulogy. Following the banquet, she privately invited Liang Huazhi to a separate room for a discussion.\n\nAt precisely 2:00 PM, the Shanxi provincial government officially announced Liang Huazhi as the new provincial chairman and held an inauguration ceremony. However, Fu Dongju was notably absent from the proceedings. Likewise, the top military commanders of northern Shanxi, Gao Shuxun and Huang Qiaosong, were also absent.\n\nAt 3:00 PM, the Central Committee of the Communist Party of China received a telegram from Fu Dongju, stating: “I have secretly contacted the patriotic generals Gao Shuxun and Huang Qiaosong. After attending my father’s funeral banquet, they immediately departed for their respective defense zones under the pretext of border security. I urge the Central Committee to dispatch comrades to Datong as soon as possible to establish contact with them!”"
 CPC_main_story_events.72.o: "Central Committee Reply: Your suggestion has been accepted. Ensure your own safety at all costs."
 CPC_main_story_events.73.t: "Chili Powder on the Cat’s Back"
 CPC_main_story_events.73.d: "Spotlights shone on his face, making Chen Yun feel a bit drowsy. The Central Committee was holding a meeting today on \"Public-Private Partnership and Equity Recovery\"—a crucial step in the Socialist Industrial Plan of the Front. Chen Yun lifted the lid of his enamel cup, inhaling the strong aroma of tea. The tea polyphenols revived his slightly sleepy eyelids.\n\n\"Director Chen, all participants have arrived,\" his secretary whispered in his ear.\n\nMost of the attendees were national capitalists from Sichuan and Chongqing—some operated garment and salt factories in light industries, while others ran small ironworks in heavy industries.\n\n\"I see. Let's begin,\" Chen Yun nodded, finishing the tea in his cup. \"Friends, let’s not waste time and start the meeting.\"\n\nChen Yun briefly explained the purpose of the meeting—the socialist transformation of industry in the liberated areas. This meant the collective and state-owned restructuring of industries in Sichuan, Chongqing, and other regions that had yet to complete their transformation.\n\nThe attendees exchanged uncertain glances, unsure whether this was good or bad news.\n\n\"Collectivization? Nationalization?\" Some murmured while processing the idea. The quicker ones had already started sweating profusely, secretly shedding tears, realizing that their hard-earned businesses would soon be taken over by these 'red bandits.'\n\n\"Don't be so pessimistic,\" Chen Yun said with a reassuring tone, though inwardly, he scoffed at their reactions. \"Here’s our proposal: The government will regularly purchase your shares and pay interest. Of course, we won’t force anyone to sell, but if negotiations fall through, the funds earmarked for buying your shares will be used to build new factories instead. As the saying goes, 'Don’t let good water flow into others’ fields.' Once the new factories are up and running, the Front's procurement will prioritize them to ensure we recover our investment.\"\n\nWith this, Chen Yun addressed nearly all the key concerns, leaving the participants with no room for ambiguity. The capitalists, having little choice, began raising their hands in agreement, signaling their willingness to discuss the terms of equity acquisition.\n\nChen Yun clasped his hands together, covering the smile he could no longer suppress, thinking to himself, \"Chairman Mao’s method works best after all.\"\n\nA few days earlier, Mao Zedong had shared a joke with Deng Xiaoping and Liu Shaoqi—\n\nMao: \"Think about it—how do you make a cat eat chili powder?\"\nLiu: \"That's easy. Wrap the chili in fish and trick it into eating it.\"\nMao: \"Think harder. There's a better way.\"\nDeng: \"Just pry open the cat’s mouth and force it down.\"\nMao: \"Neither. The best way is to rub the chili powder on the cat's back.\"\nLiu and Deng: \"Why would you do that?\"\n\nMao Zedong leaned in closer and said:"
 CPC_main_story_events.73.o: "\"The cat feels uncomfortable, so of course, it will lick it off!\""
 CPC_main_story_events.74.t: "Useless Nuts"
 CPC_main_story_events.74.d: "\"Damn it! Which factory made this nut? I’ve been twisting it for ages, only to find it tightens counterclockwise!\"\n\nMaster Xu, who was repairing a lathe, discovered that the threads on the nut he was working with were reversed. A man who had solved countless \"tricky problems\" in his career, Master Xu never expected the issue to be with the nut itself. The factory’s party secretary handed him a cigarette and lit it, saying, \"This nut was made right here within our own lines.\" Hearing this, Master Xu felt the world spinning but kept silent, smoking sullenly.\n\nMeanwhile, Minister of Industry Chen Erlu was sifting through suggestions and reports from various regions: some proposed improvements in production organization, others advocated for adopting new techniques, but the majority complained about the incompatibility of parts produced by different factories.\n\nThe analysis report alongside these suggestions indicated: some factories had relocated to Xi'an before 1947, adhering to the old Republic of China standards; others used Soviet standards, with equipment imported from the former USSR; and the recently liberated Sichuan and Chongqing regions operated under Japanese standards.\n\nAs the Front liberated territories and reopened trade routes, production lines from various regions naturally began to intertwine. If standards were not unified soon, future industrial production risked even greater chaos. With this in mind, Chen Erlu convened experts from various industrial departments and drafted a \"Unified Production Standards Proposal.\"\n\nAt the State Affairs Committee meeting, Chen presented his plan, which stated:\n\n\"Currently, production standards across the Front's regions and factories are inconsistent and incomplete, leading to significant waste and seriously hindering production progress. Thus, we recommend unifying production standards as soon as possible to improve efficiency. Given that the majority of industrial facilities with ample production capacity adhere to Japanese standards—and considering that much of the equipment smuggled into the base areas also follows Japanese specifications—we suggest adopting Japanese standards as the primary basis, with Soviet standards as a supplementary reference. Each will cater to different production sectors, ensuring the needs of various production lines are met, further advancing revolutionary construction.\"\n\nThe CPGAC swiftly approved this proposal, promptly notifying factories across the regions to adapt their equipment based on actual production needs to align with unified standards.\n\n\"Where did this nut come from?\" Master Xu asked. Ever since the last mishap, he had started paying extra attention to even the direction of the threads. His apprentice replied that these nuts were from the same factory as the previous batch, but their processes had been standardized now. Master Xu took the nut, confirmed the threads were correct, and tightened it onto the lathe.\n\n\"Not bad this time, fits snugly,\" he remarked with surprise. \"Standardization really is good—now the threads' direction is guaranteed, and the tolerances match up.\"\n\nMaster Xu motioned for his apprentice to bring over the other parts and resumed repairing the machine in front of him."
 CPC_main_story_events.74.o: "Unified standards first"
 CPC_main_story_events.75.t: "Consequence"
 CPC_main_story_events.75.d: "The policy guidelines we have implemented in Xinjiang have completely infuriated the local population, leading them to mobilize and storm our party organization offices. General Ma Zhongying has also sent multiple letters to the Central Committee expressing his dissatisfaction.\n\nDue to the severe threats to the personal safety of our stationed cadres at all levels, the Central Committee has decided to withdraw the majority of our party organizations from Xinjiang.\n\nAlthough Xinjiang remains our rear base, all indications suggest that the people of Xinjiang no longer trust the decisions and directives of the Central Committee."
 CPC_main_story_events.75.o: "Are we being too greedy?"
 CPC_main_story_events.76.t: "A Night in Calcutta"
 CPC_main_story_events.76.d: "The deep night in Calcutta was quiet and dark, but the room on the fourth floor of the hotel remained brightly lit. If one were to trace the source of the light, they might be surprised by the cramped and humid environment of this small room— a pot of coarse tea, a large wooden table, a few wooden chairs, a dimly lit ceiling lamp, and several representatives of the Chinese Communist delegation to India. This was where Marshal Chen Yi was staying in Calcutta.\n\n\"Comrade Chen, when the meeting ended tonight, they suggested we take an air route to Delhi. There will be a truck picking us up at 2 PM tomorrow to take us to Calcutta Airport. I heard they are even using an American plane,\" the secretary, holding a stack of documents, stood up, ready to leave.\n\nWithout looking up, Chen Yi responded, \"This is the advantage of national unity. Unlike us, who had to worry about the Japanese while traveling abroad, now we have to endure long train rides and truck journeys, making our backsides sore.\" As soon as he finished speaking, the room burst into laughter.\n\nLin Liguo, seated nearby, wiped the sweat off his forehead, unbuttoned his collar, and continued working at the table. \"There are too many documents to translate. I’m afraid I won’t finish before boarding tomorrow.\"\n\n\"Then continue on the plane,\" Chen Yi advised. \"Diplomatic matters cannot be rushed. They must be precise and meticulous.\" He glanced at Lin Liguo, who sat opposite him with furrowed brows. \"Tiger\"—referring to Lin Liguo by his childhood nickname—\"among us, your English is the best. That’s why your mother insisted we bring you to India. When we get to Delhi, you'll have to speak English, maybe even meet the Americans. These translations must be of high quality. If you prepare thoroughly, we old men will be able to handle the negotiations properly. Only then can we fulfill the mission entrusted to us by Chairman Mao.\"\n\nLin Liguo nodded slightly and then returned his focus to organizing the documents."
 CPC_main_story_events.76.o: "-Outside the window, the sun is raising."
 CPC_main_story_events.77.t: "Journey to Delhi"
 CPC_main_story_events.77.d: "[IND.GetLeader] stood at the tarmac of Delhi Airport, flanked by key figures of the Indian government, watching as the Boeing 707 carrying the Chinese Communist diplomatic delegation taxied to a halt. Their emotions were mixed—on one hand, they recognized the sheer determination of the delegation before them. China had suffered more than even their own India, which had itself been trapped in division and instability just a decade earlier. They harbored a certain admiration, an unspoken camaraderie—one embattled nation to another, struggling for unity and sovereignty.\n\nYet, there was another side to this. As its name suggested, the Guofang Zhixian (National Defense Front) was a communist regime, one that openly supported the CPI (Marxist-Leninist) and firmly maintained its territorial claims. Would this ideological alignment be a bridge between the two nations, or an inevitable wedge that would one day drive them apart?\n\nStanding a short distance away, an American diplomat awaited the Chinese delegation as well, his thoughts equally conflicted. To him, Eastern and Western China bore an uncanny resemblance to the former East and West Indies—one faction staunchly anti-Japanese, the other aligned with Tokyo. And yet, despite himself, the label of \"communists\" stirred his deep-seated disdain. But Washington had sent him here with one goal: to curb the Co-Prosperity Sphere’s western expansion. If that meant adding another unlikely name to the list of allies, then so be it.\n\nThe aircraft door slowly opened. Under the watchful eyes of the assembled hosts, a large-framed man with a steady, deliberate stride descended the stairs. There was no mistaking it—this was Chen Yi, the man mentioned in intelligence reports.\n\nHis face was amicable, his smile warm and confident as he reached out to shake [IND.GetLeader]’s hand."
 CPC_main_story_events.77.o: "\"Hello...\""
 CPC_main_story_events.78.t: "Victory in Cambodian"
 CPC_main_story_events.78.d: "Red flags fluttered past the dormitory window, but Lao Jin, the Chinese expert assisting Cambodia, paid them no mind. The sweltering Southeast Asian heat made the air thick and suffocating. He lay on his bed, lazily fanning himself with a palm-leaf fan, his mind drifting to the past few months of work in Cambodia. Unable to hold back any longer, he turned to Lao Xie, who was eating lunch from an aluminum food container beside him.\n\n“I’ve met with Nuon Chea three times, each conversation lasting about twenty to thirty minutes. Honestly, I can’t say I have a good impression of him. Now I finally understand what they mean by ‘arrogant and ignorant.’ Compared to gentlemen like Xiu Chen and Hu Rong, he’s just insufferable.”\n\nLao Xie, still chewing his food, mumbled, “Well, Cambodia’s been liberated, and we’re about to be liberated too. Soon we’ll be heading home. Why not focus on the good things?”\n\n“Let me finish,” Lao Jin rapped his fan against the bed frame, clearly annoyed at being interrupted. “The second time I went to see him, I was driven there in a sidecar by a young rural soldier, maybe fifteen or sixteen years old—looked like a Khmer Chinese. When we got close to Nuon Chea, just a few meters away, I got ready to hop off. And guess what?” Lao Jin propped himself up on his elbow. “Nuon Chea sneered and cursed at the young driver right in front of me: ‘F**k you, you hillbilly! Drive me all the way up!’ Just because he didn’t want to walk a few extra steps to greet us. And he had to use such nasty language—on a kid, no less. And a Chinese kid at that.”\n\nHearing this, Lao Xie put down his spoon, his face darkening. After a moment of silence, he sighed. “I really didn’t want to join you in this rant, but now that you brought up the Chinese, there’s something I just can’t keep bottled up.”\n\n“What is it?”\n\n“There was one time I went to a village to guide them on rice planting. As soon as I arrived, I noticed about twenty Chinese people standing out among the locals—clearly not from the village. They were huddled together with their families near the animal pens, pressed up against the wooden fences. The enclosure had no walls, just a makeshift barrier of stakes and twigs. A few kids stood outside the fence, unwilling to go in.\n\n“The village chief—a wiry, wrinkled little man—noticed that I’d seen them and immediately barked at the militia to whip the kids back inside. Then he bolted the gate and, all smiles, invited me into his thatched house like nothing had happened.\n\n“I asked him about the people inside the pen. He said they were ‘old elements undergoing re-education,’ captured from nearby areas. But come on—‘old elements’? And they just happened to all be Chinese? I guess my face must have given away my thoughts because, when I was leaving, that sneaky little bastard followed me out with a strange grin and said he wanted to ‘send me off properly.’ As he spoke, his eyes kept darting toward the tape recorder in my bag. He told me, ‘The villagers don’t welcome the Chinese,’ and that it would be easier for him to record our discussions rather than having to report things through meetings.\n\n“It was clear as day—he was trying to extort me. What choice did I have? I had to swallow my pride and play along. Better to lose a tape recorder than risk something worse.”\n\nLao Jin furrowed his brows. “And why did he think he could blackmail you?”\n\n“I figure it’s because I saw those imprisoned Chinese. The moment I reacted, I noticed how the militia behind the chief started staring at me like wolves. I was alone that time, and I was terrified they might pull something on me halfway down the road.” Lao Xie raised his spoon and made a sharp slashing motion in the air.\n\nNeither man spoke after that. Some things were better left unsaid. They finished their meal in silence, then lay down for an afternoon nap. Soon, the convoy would arrive to take them back to Hainan."
 CPC_main_story_events.78.o: "Distance just creates Ugly"
 CPC_main_story_events.79.t: "Labor Dispute"
 CPC_main_story_events.79.d: "Outside a textile factory in Mianyang, discontented workers had gathered in large numbers, chanting slogans and plastering big-character posters on the factory’s outer walls. Messages like “Li Family, Get Out!” and “Give the Factory Back to the Workers!” were prominently displayed. Inside a storage room within the factory, factory director Li Zhijie and his son trembled in fear, listening to the deafening roars of the crowd. Li Zhijie bitterly regretted his past decisions—why had he withheld compensation when he laid off workers two years ago? And why had he resisted the Communist Party’s proposal to buy out his shares six months ago?\n\nThe workers outside, seeing no response from within, took matters into their own hands. With heavy hammers, they smashed open the factory gate. The leader of the workers' committee, himself a Communist Party member, climbed onto a wooden table and addressed the crowd:\n\n“Comrades, two years ago, Li and his son fired us due to so-called poor factory performance, yet they refused to pay even the most basic compensation! When the Party offered to buy him out, he rejected it and continued running this factory as his own little kingdom. Tell me, is this any different from the landlords who oppressed the peasants? Today, we take back what’s rightfully ours—this factory belongs to the workers, not to the Li family!”\n\nA thunderous chorus of agreement erupted, shaking the very rafters of the factory. “Find the Li family!” someone yelled, and the workers quickly fanned out, searching every room. Eventually, they found Li Zhijie and his son cowering in a storage closet at the end of a corridor. The enraged workers yanked Li out by his collar, dragging him into the open courtyard between the factory floor and the main gate. A contract was thrown at his feet.\n\nLi stared blankly at the document, the words “voluntarily transfers ownership of the factory to the workers” glaring back at him in black and white. Why should I hand over my life's work? he thought, growing angrier by the second. His resentment boiled over, and he blurted out, “You useless workers! By tomorrow, you’ll all be fired and thrown out!”\n\nHis words ignited an immediate explosion of rage. The workers surged forward, beating Li and his son mercilessly. Before long, Li’s face was swollen and bruised, barely recognizable. It took the intervention of the workers’ committee leader and the public security officers who had arrived to calm the situation and rush the Li family to a hospital.\n\nA few days later, local Party officials visited Li in his hospital room, bringing fruit as a goodwill gesture. Outwardly, they spoke words of comfort, but their every sentence carried veiled pressure about the factory's ownership transfer. The mere mention of the factory sent Li into a fit of agitation, though not because he still wished to fight for it—now, all he wanted was to flee from this nightmare.\n\n“I’ll sign it! I’ll sign it, is that enough?” Li stammered as he took the pen and inkpad with trembling hands. After he completed the paperwork, the officials, smiling, handed him an envelope.\n\n“The workers were a little emotional,” one official remarked. “This is a small token to make amends.”\n\nTwo days later, Chengdu Daily ran a report on the incident, describing it as merely “a labor dispute.”"
 CPC_main_story_events.79.o: "Labor dispute? I think it's a fierce struggle."
 CPC_main_story_events.80.t: "Nothing to say(1)"
 CPC_main_story_events.80.d: "The reception room arranged by the Ma Family Army for the CPC envoys had never been cleaned. The stale stench of tobacco filled the air, making Tan Xilin nauseous as he glanced at the blackened tar stains on the walls. Ma Guangyuan stood by the window, trying to breathe in some fresh air, but the piercing cold wind only made him pull his leather coat tighter. Meanwhile, Ma Dunqing was doing his best to ignore the unbearable odor, focusing instead on the man leisurely cracking sunflower seeds before them—Ma Dunhou. This so-called cousin was meeting Ma Dunqing’s delegation for the sixth time, once again delivering the same message: Ma Bukang was drunk, and they would have to wait for him to sober up.\n\nThe delegation had already prepared a contingency plan in case their efforts to persuade Ma Bukang to join the anti-rebellion forces failed. But it was a risky move, one no one wished to resort to unless absolutely necessary. Ma Dunqing still hoped to use reason to sway his cousin. “Two years ago, during the famine, Shaanxi province sent food supplies to Ningxia despite its own hardships. The People's Government has treated our family fairly, and it will not mistreat yours. You should consider the homeland—why keep stalling and refusing to let Uncle meet us?”\n\nHearing his cousin’s appeal, Ma Dunhou let out a dry chuckle. “Lecturing me now, are you? Let me tell you the truth—talking to me is useless. Hezhou is our homeland, filled with uncles and elders. My word alone means nothing.”\n\nMa Guangyuan couldn’t hold back his frustration any longer and angrily asked, “So you’re just going to reject the Central Government’s leadership like this?”\n\n“That’s right! What are you going to do about it?” Ma Dunhou snapped back, completely unfazed.\n\nSeeing this, Tan Xilin remained silent, still studying the tar stains on the wall as if lost in thought. Suddenly, the guards outside announced the arrival of Chairman Ma. Moments later, two servants carried Ma Bukang into the room. His eyelids barely lifted, his mouth muttered incoherent noises, and his unkempt head wobbled uncontrollably. His arms and legs were as limp as overcooked noodles—completely incapacitated by alcohol.\n\nSeeing his uncle in such a state, Ma Dunhou mockingly gestured toward the CPC delegation. “Go on, make your requests. He’s right here.”\n\n“What’s the point of talking now?” Tan Xilin shot back coldly. “Let Chairman Ma rest. We’re leaving.”\n\nWithout so much as a handshake, he briskly strode past Ma Bukang and out the door. Ma Dunqing and Ma Guangyuan hesitated for a moment, considering whether to stay, but seeing how quickly Tan was disappearing down the hall, they had no choice but to follow.\n\nJust as they reached the stairwell, a sudden, guttural retching sound erupted behind them.\n\nThe sickening noise echoed through the hall—an appalling, wretched farewell."
 CPC_main_story_events.80.o: "We were delayed by this drunkard for a full six days."
 CPC_main_story_events.81.t: "Nothing to say(2)"
 CPC_main_story_events.81.d: "Ma Bukan lay unconscious on the bed, while several servants skillfully prepared a medicinal decoction to sober up their master.\n\nOutside the bedroom, Ma Buying, who had rushed from Qinghai, impatiently pressured Ma Dunhou to make a clear statement of support for the Ma family's rebellion.\n\n“Is it war or peace? You have to give a definite answer. Losing Lanzhou wasn’t your fault, but joining forces with Jiyuan to rise up now isn’t too late.”\n\n“The Communist army is right at our doorstep. We dare not act rashly. If we provoke them into storming Hezhou and arresting all of us, our Ma family won’t have anything left.”\n\n“How can you be so slow-witted? Haven’t you seen how your younger brother and son were driven all the way from Lanzhou to Qinghai by the Communist bandits? This is a matter of life and death, yet you still don’t get it.”\n\n“What does my brother running away have to do with me? When my father drove me to Hezhou, did he ever help me? I made my own way here. Now you want me to go back and help him? I have no time for that.”\n\n“Then let me lay it all out for you.” Ma Buying paced in circles around the room, and after careful deliberation, he finally revealed the trump card he had been holding. “Your subordinates are smarter than you. They understand that if they don’t fight the Communist bandits, they won’t survive. So they’ve all taken orders to head to Qinghai.”\n\n“You—!”\n\n“Dear nephew, you just stay here and look after your uncle. I have real business to attend to.”"
 CPC_main_story_events.81.o: "Such a relative."
 CPC_main_story_events.82.t: "Nothing to say(3)"
 CPC_main_story_events.82.d: "The night in the military camp was always the quietest and safest, especially for those who didn’t have to stand guard. The battalion commander had announced that they would be marching to Qinghai in three days, and after a full day of packing and preparations, the exhausted soldiers collapsed into their bunks and fell asleep instantly. There was no idle chatter before bed—within ten minutes, the dormitory was filled with the sounds of snoring. Da Kuan was no exception.\n\nIt was unclear how long he had been asleep when the silence was suddenly shattered. The commotion and flickering lights woke him up. In his groggy state, a gleaming bayonet suddenly appeared right before his eyes, jolting him awake. He shouted, “Who’s there?!”\n\nThe moment he spoke, the butt of a rifle came crashing down like a hammer. Da Kuan tried to dodge but ended up tumbling out of bed, hitting the floor hard.\n\n“Don’t move! Squat down!”\n\nLying on the ground, Da Kuan clutched his head and quickly glanced around. Behind the two rifles—clearly Type 38 Arisaka rifles—were several of his fellow soldiers. All of them had their hands on their heads, crouching in submission. The squad leader had been gagged and tied to his bed. He was completely unconscious. Da Kuan’s mind raced, trying to process what was happening.\n\n“What are you looking at?!”\n\n“T-This… Type 38 Arisaka…”\n\n“What nonsense are you spouting?”\n\n“The rifle in your hand…”\n\n“This is a model we built ourselves in the liberated areas, not some Type 38 Arisaka.”\n\nAt that moment, a voice came from outside the door, giving instructions:\n\n“Apologies to our Nationalist brothers, but we’ve had no choice. We are the People’s Liberation Army. Your commanders refused to cooperate and even conspired with traitors to eliminate us, so we had to act first. Now, we’re going to have a word with your officers. In the meantime, you’ll have to bear with us for a few days. Lock them up!”"
 CPC_main_story_events.82.o: "I’ve figured it out. Everything makes sense now."
 CPC_main_story_events.83.t: "Letter from Investigating team"
 CPC_main_story_events.83.d: "Chairman Mao and the Central Committee,\n\nRegarding my observations and those of Comrade Yu Guangyuan and the investigation team in various regions of Mongolia, I can sum it up in one phrase: unbearable to witness.\n\nAlong our journey, we did not see the traditional scene of \"the wind blows, the grass bends, and cattle and sheep appear.\" Instead, we encountered corpses scattered across the land due to starvation, industries in complete ruin, and an overall desolate landscape. Even upon arriving in the capital, Ulaanbaatar, we were struck by the dilapidation of its infrastructure and buildings—shockingly decrepit, even worse than Xi’an was a decade ago.\n\nAccording to our comrades in the Mongolian People’s Party, the Mongolian puppet regime has been engaged in numerous armed conflicts since the 1950s against the Far Eastern Soviet Central Committee, the Tuva Vasilyevsky forces, and the native Mongolian insurgent groups led by the Mongolian People’s Party. The most significant victory of the Mongolian People’s Party in its ongoing struggles against the Mongolian puppet regime was the recent Mongolian Uprising. However, Mongolia has been engulfed in warfare for over a decade. Most of the former Soviet industrial and mining infrastructure was dismantled by the Japanese and transported to Manchukuo and the puppet Republic of China. Meanwhile, the puppet government under Prince De has ruled Mongolia with extreme brutality, perpetrating hundreds of horrifying massacres.\n\nThrough the arduous efforts of the Mongolian People’s Party, approximately 40% of the remaining extractive industrial facilities have been restored to operation, but this remains a drop in the ocean. According to our Mongolian comrades, due to the relentless exploitation by Japan and the puppet regimes in Manchukuo and Mengjiang, Mongolia’s current total industrial output is estimated to be only one-third of what it was during the War of Resistance. Agricultural and daily consumer goods are severely lacking, and the scale of animal husbandry has reportedly shrunk by 30% compared to the 1940s. The government is struggling to maintain basic operations.\n\nComrade Yu Guangyuan has compiled a detailed economic report on Mongolia, which is attached at the end of this letter.\n\nI sincerely hope that the Central Committee will study the situation and devise an appropriate response as soon as possible.\n\nRespectfully,\nWan Li"
 CPC_main_story_events.83.o: "It’s not easy…"
 CPC_main_story_events.84.t: "Emergency Meeting"
 CPC_main_story_events.84.d: "Since the end of the Long March, many people had never seen Zhou Enlai lose his temper—until today.\n\n\"Where did our work go wrong? Have we pushed the Mongolians too hard, or are we simply unable to bear the cost of a negotiated unification?\" His voice, filled with barely contained anger, echoed through the conference room in Xi'an. Bo Gu, Gao Gang, and other members of the negotiation delegation sat with their heads lowered, beads of sweat dripping from their foreheads.\n\n\"This was a resolution unanimously approved by the Party. You should have been fully prepared, ensuring absolute confidence before making a move. Now that you've returned from Baotou in disgrace, how will you explain this to the Central Committee? How will you answer to Chairman Mao?\"\n\nFrom the adjacent seat, Mao Zedong, who had remained silent until now, gently patted Zhou Enlai's shoulder. \"Enlai, let’s not focus on blame right now,\" he said calmly. His cold, expressionless gaze swept across the room, passing over the dozens of cadres sitting with tense postures before finally settling on the blank white wall—staring at it as if he could see through to another world, as if the real culprit behind the failed negotiations was hiding there.\n\n\"If negotiations have failed and we still want to unify Mongolia, then there's only one option left: war. We must send our own people to Ulaanbaatar,\" Mao stated, his voice disturbingly calm. \"This meeting isn’t the place to decide. The State Council should draft an emergency plan and put it to a vote.\""
 CPC_main_story_events.84.o: "Nothing to say now."
 CPC_main_story_events.85.t: "Secret talk"
 CPC_main_story_events.85.d: "Following closely behind Deng Xiaoping, Ulanhu arrived at Mao Zedong's office in Yan'an.\n\nTen years ago, in this very room, he had smashed his wine bowl in front of Mao Zedong, Zhou Enlai, and others, vowing to lead the armed revolutionary struggle in the Yinshan base and to liberate Mongolia within a decade.\n\nNow, the ten-year promise had been fulfilled. The Inner Mongolia base had undergone a complete transformation. Although much rebuilding remained, the genuine smiles of the Han and Mongolian people who had bid him farewell as he departed for Yan’an were undeniable proof of progress.\n\nDeng Xiaoping pushed open the door. \"Chairman, Comrade Ulanhu is here.\"\n\nMao Zedong, who had been studying a map of China, suddenly turned around, his face beaming with a warm smile as he walked toward them. \"A great hero has returned from the Mongolian battlefield.\"\n\nHe gestured for Ulanhu to sit down, but he himself slowly began pacing the room. \"I won’t waste time on formalities. The progress of the Baotou negotiations isn’t bad—we’ve already reached the issue of Inner Mongolia—\"\n\nUlanhu pondered for a moment and immediately grasped Mao Zedong’s implication. \"The work of the Inner Mongolian People's Party has been completely concluded. Once the Baotou talks end, how to handle the party’s future work is something I leave to your guidance, Chairman.\"\n\nMao Zedong nodded. \"My view is that it would be best to transform it into our Party’s Inner Mongolia branch. However, both Bo Gu and you have advised the Central Committee that, since we are sitting at the negotiating table with our Mongolian comrades, we must avoid Han chauvinism and uphold internationalism. That reasoning makes sense.\"\n\nHe paused briefly before continuing, \"Let's start by allowing individuals to make voluntary choices. If they have no particular preferences, we’ll follow ethnic divisions—Mongolians can go to Mongolia to help with reconstruction, while Han comrades will return and operate under Central command.\"\n\nUlanhu understood. Since the Chairman had left no room for ambiguity, there was no need to dwell on it further. Besides, the proposal was not unacceptable. He nodded in agreement."
 CPC_main_story_events.85.o: "\"I am willing to obey Central committee's order.\""
 CPC_main_story_events.86.t: "Outside the emergency room"
 CPC_main_story_events.86.d: "The white-clad figures moving back and forth cast stark shadows under the dim, flickering corridor lights. Chen Yi felt as if he were floating in a dream.\n\nZhou Enlai had collapsed, hadn’t he? His hands trembled uncontrollably, his entire body shivering. His legs, unsteady and weak, struggled to keep pace with the hospital bed as it was rapidly wheeled toward the emergency room.\n\nPerhaps the floor had just been mopped and was still wet, perhaps his shoes had lost traction, or maybe sheer exhaustion had sapped the strength from his legs. Whatever the cause, just as he tried to stop himself, Chen Yi fell hard onto the ground outside the emergency room. Darkness engulfed his vision in an instant, followed by rapid breathing and a tightness in his chest. Then, nothing.\n\nAt that moment, Yang Chengwu arrived with a battalion of guards under orders to secure the hospital. As he stepped into the emergency department, he was met with utter chaos—people had flooded in to see the Premier, one after another; the hospital director was personally there, tirelessly shooing them away, left and right; nurses dashed about, fetching medications and equipment, moving so quickly it was dizzying to watch.\n\nAmidst the commotion, Chen Yi lay slumped in the center of the crowd, his broad frame motionless as two doctors on either side struggled with all their strength to help him up.\n\nThe PLA soldiers moved swiftly to restore order, dispersing unnecessary personnel and clearing a path for the medical staff. Two soldiers stepped forward to lift Chen Yi. The hospital director asked if he should undergo a full examination, but Chen Yi waved his hand, insisting he was fine and that all efforts should be focused on saving Zhou Enlai.\n\nYet, he could not deny the overwhelming discomfort in his body—the dizziness, the deafening noise surrounding him. He finally relented and requested a car to take him home.\n\nAs Yang Chengwu helped the limping Chen Yi into the vehicle, he noticed the general’s vacant, unfocused expression. Concerned, he asked, “Comrade Chen, are you sure you don’t want a check-up?”\n\nChen Yi could not summon the words to answer. He simply shook his head at Yang Chengwu and motioned for the driver to set off immediately."
 CPC_main_story_events.86.o: "The car sped off, leaving a trail of dust in its wake, there is something more important need Yang Chengwu to do."
 CPC_main_story_events.87.t: "Epiphany"
 CPC_main_story_events.87.d: "After two days and nights of emergency treatment, the red light outside the operating room suddenly went out. A visibly exhausted chief physician emerged from the room, bringing great news—Premier Zhou had survived the critical stage. Still in a coma, Zhou Enlai was transferred to an observation ward, where Deng Yingchao had already moved in to take care of him. She never left his side, waiting tirelessly for the moment he would regain consciousness. When she finally saw her lifelong partner slowly open his eyes and call her \"Xiao Chao,\" tears of joy welled up in her eyes.\n\nTheir intimate moment was fleeting. As soon as Zhou Enlai regained some strength, he immediately inquired about work. Upon learning that the Ninth Congress had been interrupted due to his illness, his heart sank, as if a heavy stone had been placed on his chest. He felt deeply troubled, not knowing what consequences his condition might bring to Chairman Mao and the party. Only when Deng Yingchao reassured him that Chairman Mao understood his situation and had no objections to the delay did he finally feel slightly relieved.\n\n\"It just means the delegates will have to be fed for a few extra days,\" Deng Yingchao joked lightly, hoping to cheer him up.\n\nAt that moment, Bo Gu and Qiao Guanhua arrived on behalf of the Ministry of Foreign Affairs to visit him, becoming the first outsiders to see him in the hospital. They sat by the bed, exchanging pleasantries and urging the Premier to focus on his recovery. Zhou Enlai, however, was anxious to know about external affairs. He asked, \"Why hasn’t Chen Lao Zong come? He was the one who brought me to the hospital.\"\n\nAs soon as he said this, the atmosphere in the hospital room suddenly turned heavy. In reality, just a day after Zhou Enlai was admitted, Chen Yi had also been rushed to the emergency room. The cause? The severe fall he suffered while escorting Zhou Enlai to the hospital.\n\nFaced with the long-time mentor who had nurtured his career, Qiao Guanhua hesitated for a moment before revealing the truth: \"Chen Lao Zong suffered an intracranial hemorrhage and collapsed at home. It was his wife who called the ambulance.\"\n\nZhou Enlai’s expression froze. \"How did he get this condition?\"\n\nBo Gu lowered his head, not daring to speak. Qiao Guanhua hesitated for a moment, initially considering fabricating a reassuring answer. However, the sincerity and concern in Zhou Enlai’s gaze left him defenseless. Lying to the Premier was never an option. With no other choice, he revealed everything: \"On the day he sent you to the hospital, Chen Lao Zong took a serious fall in the corridor. He didn’t undergo an immediate examination at the time… but it turned out that the injury was internal.\"\n\nChen Yi’s unexpected misfortune drained the remaining strength from Zhou Enlai’s body, leaving only an overwhelming sense of helplessness burning inside him. He feared the fragility of life, the fleeting nature of existence. And suddenly, as if struck by realization, he knew he had to act—there was no time to waste."
 CPC_main_story_events.87.o: "“Let Deng Xiaoping come here.\""
 CPC_main_story_events.88.t: "Bedside conversation"
 CPC_main_story_events.88.d: "Deng Xiaoping followed the doctor’s instructions, put on a clean white coat, and quietly stepped into Zhou Enlai’s hospital room, walking past the screen that separated the hospital bed from the entrance. Zhou Enlai, dressed in a blue-and-white striped hospital gown, lay still on the bed with his eyes closed, resting. After a full week of hospitalization and treatment, he had finally been taken off the ventilator. However, his upper lip and chin had gone unshaven, allowing gray and unkempt stubble to grow untidily. His wife, Deng Yingchao, stood beside the facing sofa, with a draft document placed on the tea table.\n\nDeng Xiaoping first shook hands with Deng Yingchao and inquired about Zhou Enlai’s condition.\n\nOnce the pleasantries were over, Zhou Enlai beckoned Deng Xiaoping to sit by his bedside and then asked his wife to bring the draft over to him. “This is a self-criticism letter that Yingchao helped me write. Please help me revise it and pass it on to Chairman Mao,” he said.\n\nDeng Yingchao added, “Enlai originally wanted me to revise it, but some things are difficult for me to say. We still need you to go over it.”\n\nDeng Xiaoping took the draft and read it carefully:\n\n\"Respected Chairman Mao,\n\nI sincerely and profoundly self-criticize my political mistake of concealing my illness and accept full responsibility for the disruption of the Ninth Congress. During the Congress, when meeting with the Mongolian delegation, I had to leave the session early due to physical discomfort. At that time, doctors diagnosed me with a heart condition and advised me to cease work and undergo hospitalization. However, I failed to fully recognize the severity of my condition and did not approach the situation with a long-term perspective. As a result, I did not heed the doctors' advice, leading to today’s unfortunate situation. Considering that my health may not allow me to continue my duties, I hope that a younger comrade, one who is firm in ideology and decisive in action, can take over my responsibilities.\"\n\nAfter reading the letter, Deng Xiaoping hesitated when he saw Zhou Enlai’s request to step down. He looked up at Deng Yingchao, who was giving him an expectant smile, then turned to Zhou Enlai, whose face bore the heavy marks of exhaustion. After a brief pause, he finally said, “Admitting mistakes more is never wrong…”\n\nBefore he could finish speaking, a loud crash came from the neighboring ward—the sound of teacups and bowls shattering onto the floor. Deng Xiaoping glanced toward the source of the noise, then let out a sigh of resignation."
 CPC_main_story_events.88.o: "\"Why haven't moved Kang Sheng away yet?\""
 CPC_main_story_events.89.t: "Secret Deal"
 CPC_main_story_events.89.d: "\"Xiaoping, you play a indeed pivotal role to Chairman Mao. He has in his mind your thoughts, and you shall make His mind clear, say the right thing when the time is rife. Do not fail him for I may not be able to save you again.\"\n\n\"Comrade Lin Biao is inseparable from the Chairman. He plays as the double to Gao Gang, and powerbase to Chairman Mao. Lin Biao dissappointed me too much, he only plays his own game, and cares little on others. I fear he may overreact should things escalate.\"\n\n\"Now, Jiang Qing is the hungering wolf, a powermonger. It seems to her as if grasping everything in control alleviates Chairman Mao's trouble. Childish and delusional. That's not teamwork as everyone knows.\"\n\n\"Comrade Shaoqi, for him i make no comment. To comment his deputy, Bo Yibo is a shrewd man, but brazen and rude. Gao Gang's downfall made him no longer tolerant to another comrade to work with. He is to go along with comrade Shaoqi and bide the time. Now that is the tricky part.\"\n\n\"Comrade Premier, if I may proceed forward and act?\"\n\n\"To the contrary. Xiaoping, DO promise me you will not act brazen and push everyone aside. You have unparred potential but you are not able to act as a good commander. You are to work as the problemsolver and work the way out for the Party and the PLA.\"\n\n\"I see.\"\n\n\"Despite Bo Yibo being so ill-habited, others can't work things out better than him. I have recommended you and him to do the routine jobs, and you are to ensure a smooth transition. \"\n\n\"Can't really promise that. Gao Gang may be dissuaded by Xi Zhongxun, but i'm not familiar to Bo Yibo. I fear Liu's men may want to instill trouble on me.\"\n\n\"Alas, I can't speak to Bo Yibo in person. Do persuade them that the dire time requires everyone to serve. If you feel overwhelmed, go get Chairman Mao for help. \"\n\n\"That I shall proceed.\""
 CPC_main_story_events.89.o: "Treading with extreme caution, as if walking on the edge of an abyss."
 CPC_main_story_events.90.t: "Hot Potato"
 CPC_main_story_events.90.d: "Ever since Li Lisan’s self-criticism and Zhou Enlai’s letter of opinion were placed on Mao Zedong’s desk, they had been marked as confidential and forbidden from being made public. But in a world where no wall is airtight, rumors of Li Lisan openly contradicting the Chairman had already spread far and wide. News of Zhou Enlai’s letter also traveled quickly, leading to widespread speculation about its contents. Some said that the aging Zhou Enlai was submitting, begging Chairman Mao not to purge him. Others claimed he was seeking a way out, preparing to retire peacefully. Still, some seemed to know more than they should, whispering that Mao himself was too old and should no longer continue leading…\n\nRumors about old age and frailty floated through the air, occasionally tearing open Mao Zedong’s wounds.\n\nHe did not want to acknowledge his own aging. He hated hearing others say he was old. Yet ever since he watched the ambulance drive away from the meeting hall that day, he had finally realized that aging had come for him as well. He was shocked to discover that without someone’s support, even standing up had become a struggle.\n\nWhenever the reception room was empty and the doors were shut, Mao would try to force his bloated, weakened body upright, relying on his two atrophied legs to lift himself from the sofa. But each time, his strength would fail, and he would collapse onto the floor, unable to get up. He would then sit there in silent frustration, sinking deep into self-reproach, until an attendant found him and helped him back onto the couch.\n\nThese two documents felt like a vise clamping down on Mao Zedong. If he considered the many aging revolutionaries within the Party, making the self-criticisms public—especially the mention of retirement—would be like dropping a bomb that would turn everything upside down. At that point, even Lin Biao might abandon him.\n\nWith this thought in mind, Mao Zedong read through Li Lisan’s self-criticism once more."
 CPC_main_story_events.90.o: "Should I let go?"
 CPC_main_story_events.91.t: "Chairman Who?"
 CPC_main_story_events.91.d: "The hall echoed with the alternating sounds of vote counting and ballot announcements. This was the second leadership election in the National Defense Front, and this time, both Mao Zedong and Liu Shaoqi had withdrawn from the list of candidates.\n\nAfter more than an hour of waiting, the final election results were announced. The conference host, Wang Renzhong, proclaimed that a long-sidelined, steadfast elder statesman had been elected as the new chairman of the Front: Zhu De.\n\nSome delegates appeared visibly stunned by the outcome. The whole point of the leadership transition was to bring in younger cadres—so why had they chosen an even older figure? Yet, no one dared to openly question it. They simply followed the crowd, clapping in unison for the new leader.\n\nZhu De, leaning on a dark, worn-out cane, trembled as he made his way to the podium under the watchful eyes of Mao Zedong and Liu Shaoqi. As he walked, he weakly opened and closed his hands in a slow-motion clapping gesture while nodding slightly, as if to show he was sharing in the brief moment of celebration. Then, in a frail voice, he began his speech:\n\n\"It is not out of personal ambition that I have accepted this position. Rather, it is the passionate encouragement of my comrades that has moved me to once again contribute to our revolutionary cause.\"\n\nAs soon as he finished speaking, he gasped for air twice, his breath unsteady. He then fell into a prolonged silence, staring blankly at the delegates as if he had forgotten his next words.\n\nThis awkward pause made Deng Xiaoping, standing behind Zhu De, visibly tense. His expression darkened as he hastily signaled to his allies in the audience to start applauding.\n\nSurrounded by a wave of applause, Zhu De swayed slightly, as if trying to collect himself. He nodded again and squeezed out a brief statement:\n\n\"Mm… good… I nominate Comrade Bo Yibo as the next Premier of CPGAC. That’s all.\"\n\nWith that, he wobbled off the stage, making his way back to his seat, where he let his body sink heavily into the chair."
 CPC_main_story_events.91.o: "Soon everything will be back to normal, I guess."
 CPC_main_story_events.92.t: "Chairman Who?"
 CPC_main_story_events.92.d: "The hall echoed with the alternating sounds of vote counting and ballot announcements. This was the second leadership election of the National Defense Front, and this time, both Mao Zedong and Liu Shaoqi had withdrawn from the list of candidates.\n\nAfter more than an hour of waiting, the final election results were announced. The conference host, Bai Dongcai, proclaimed: \"Comrade Bo Yibo has been elected as the new Chairman of the Front.\"\n\nJust as five years ago when Liu Shaoqi was elected chairman, the moment the announcement was made, the delegates in the hall all rose to their feet, giving a resounding round of applause for the new leader. Even the central leadership on stage stood up collectively to offer their congratulations. Liu Shaoqi, unable to contain his excitement, trembled slightly, the strands of his graying hair quivering. To everyone present, Bo Yibo’s victory seemed entirely expected. The atmosphere was electric with enthusiasm.\n\nAt that moment, Mao Zedong gently tapped Liu Shaoqi on the arm, deliberately lowering his voice and motioning for him to lean in. Then, he whispered, \"My legs aren’t good, so I won’t be standing up.\"\n\nAmidst the applause, Bo Yibo, dressed in a black Zhongshan suit, stepped onto the podium. After expressing his gratitude to everyone, he delivered his victory speech:\n\n\"The situation of the Front is clear to all, and the tasks ahead are arduous. Since everyone has cast their votes for me, I will not let you down. I will dedicate myself fully to the revolutionary cause and fight to the end for the complete liberation of China.\"\n\nFollowing Bo Yibo’s nomination, Comrade Xi Zhongxun was appointed as the new Premier of CPGAC, taking over the duties of Zhou Enlai."
 CPC_main_story_events.92.o: "Soon everything will be back to normal, I guess."
 CPC_main_story_events.93.t: "Retire Order"
 CPC_main_story_events.93.d: "Around the square table, Liu Shaoqi, Lin Biao, and Deng Xiaoping were deep in discussion about the retirement and reassignment of senior cadres in the People’s Liberation Army (PLA).\n\n“It’s a tough situation…” Lin Biao sighed as he reached into his pocket, pulling out cigarettes and offering them to Liu Shaoqi and Deng Xiaoping. The fact that Lin Biao was offering cigarettes first made Liu and Deng immediately realize that he had encountered difficulties during the Military Commission meetings. Feigning ignorance, Liu Shaoqi asked, “The senior comrades are still unwilling to retire?”\n\nLin Biao flicked off the ash from his cigarette and let out a dry laugh: “Not just unwilling. I’d say some of them want to die on the job.” Deng Xiaoping, who had been quietly smoking, chimed in, “But they still have to be cleared out. Enlai is now lying in a hospital bed, and Chairman Mao’s health is also declining. The Chairman has instructed us to finalize a list of retirements, which he will review before the Central Committee gives final approval.”\n\n“I have an idea.” Lin Biao spoke up. “Instead of clearing out too many people at once, we can bring in more young officers into the Military Commission—mixing them in gradually. The old comrades can’t possibly oppose us on the grounds of ‘modernizing’ the command structure, right?”\n\nLiu Shaoqi asked, “So, Vice Chairman Lin, who do you propose to keep?”\n\nLin Biao pulled out a prepared list and explained: “Huang Kecheng and Nie Rongzhen. The former is the President of the National Defense Research Institute and is no longer involved in direct military command—keeping him there ensures stability in the research sector. As for Nie Rongzhen, he primarily oversees military construction and logistics. Although his responsibilities are complex, they don’t interfere with combat command. Plus, among the senior cadres, he is in the best physical condition. There are also a few other comrades I’d suggest keeping.”\n\nThen, Lin Biao took out another list, this time containing names of younger officers recommended for promotion: “Qin Jiwei, Qiu Huizuo, Wu Faxian, and several other comrades—all capable, competent, and flexible-minded commanders.”\n\nLiu Shaoqi and Deng Xiaoping had no objections to the list of promotions, but when it came to retaining some of the old cadres, they disagreed with Lin Biao.\n\nLiu Shaoqi firmly objected: “If we’re retiring them, we should retire them all together. Otherwise, many senior comrades will continue to resist the process. It’s not just about the Military Commission—even at the grassroots level, we still have many commanders in their sixties and seventies holding regimental positions. If the Military Commission doesn’t set an example, those officers will find ways to stay in their posts as well. That will ultimately disrupt command efficiency.”\n\n“I understand your concerns,” Lin Biao responded. “Of course, we’ll need to put effort into retiring older grassroots commanders. But the specific senior officers I mentioned won’t affect the PLA’s modernization—on the contrary, their experience is beneficial.”\n\nLiu Shaoqi shook his head: “Of course, they have their advantages. But a military functions best with a unified command structure. If we start making special exceptions, morale across the entire army will suffer, and the retirement process will become even more difficult. Vice Chairman Lin, I believe you understand this better than anyone.”\n\nThe two men refrained from further argument and instead turned to Deng Xiaoping, waiting for his response. After a moment of thought, Deng Xiaoping finally answered:"
 CPC_main_story_events.93.o: "\"Follow the Military Commission procedures, hold a meeting, and make a decision after hearing everyone's opinions.\""
 CPC_main_story_events.94.t: "The Road Home - Xi'an"
 CPC_main_story_events.94.d: "She lay on her mother’s lap, an old oil lamp casting a dim, yellow glow in the room. She couldn’t see her mother’s face clearly, only the faint scent of soap lingering in the air. The room was cold, but her mother’s body was warm. She hugged her mother a little tighter.\n\n“Mother… I’m cold.”\n\n“The fire is already lit, just bear with it a little longer. Have you reviewed today’s lessons? How is school?”\n\nHer mother gently stroked her back. Yang Yingcai didn’t recall her mother ever asking her these things, but then again, this was only a dream. Real or not, it didn’t matter anymore.\n\n“Mother, I’m not doing well… Everyone gives me cold looks. I’ve endured hardships I never imagined, suffered injustices I don’t understand, and done things I never wanted to do…”\n\nShe didn’t know why she was saying all this in a dream. Was it because she could finally say it here, in this space? That familiar, sharp ache rose again in her nose—she had to hold it in, had to endure it… but this time, she couldn’t. Let it out. Let herself cry. Right now, she wasn’t Dr. Yang, nor a stubborn rightist. She was just a girl in her mother’s arms—was it so wrong to be willful, just for a moment?\n\n“Mother…”\n\nMemories surfaced one by one, but she no longer wanted to speak of them. The dream would end eventually—why waste time talking? All she wanted was to stay in this warm embrace, just a little longer. Her mother said nothing, just kept stroking her hair, waiting patiently until Yang Yingcai’s sobs faded into quiet sniffles. Only then did she finally speak.\n\n“Xiaocai, do you regret it?”\n\nYang Yingcai looked up in a daze. Did she regret it? Perhaps she had regretted it countless times before—regretting that she hadn’t saved more people, regretting that she wasn’t careful enough in politics. But even if she made those mistakes a thousand times over, she wouldn’t have turned away, because now, the road’s end was finally within sight.\n\nShe shut her eyes tightly, as if making a final decision. One last tear slipped down her cheek.\n\n“I don’t regret it.”\n\n“Truly?”\n\n“A new era is coming. What you couldn’t see, I will see in your place.”\n\n“Then that’s good.” A hint of a smile seemed to linger in her mother’s voice. “It’s time for you to go.”\n\nSuddenly, Yang Yingcai felt a gentle push, as if someone had nudged her forward. She staggered slightly, and the dim oil lamp’s glow suddenly turned dazzlingly bright.\n\nIt wasn’t lamplight—it was the midday sun.\n\n“Comrade! Are you alright?”\n\nA female cadre caught her just as she nearly stumbled.\n\n“I… I’m fine.”\n\n“You look exhausted…”\n\nPerhaps she truly was. Yang Yingcai reached up to rub her tired eyes, only to realize she was still clutching something in her hands.\n\nA red cover, golden embossed characters—though it had come far too late, it had finally arrived.\n\nDelayed justice was still justice. For her, and for China."
 CPC_main_story_events.94.o: "\"I volunteer to join the Communist Party of China...\""
 CPC_main_story_events.95.t: "A Life Worn Thin"
 CPC_main_story_events.95.d: "Luo Qingchang’s persistent persuasion finally moved Mao Zedong, and his approval arrived as swiftly as his rejections, rushing to the hospital in no time. Mao, burdened with concerns, had initially intended to keep Zhou Enlai from making any more public appearances. He had dispatched Xi Zhongxun to assess Zhou’s condition and deliver a final plea for him to stay put. However, upon entering the hospital room and seeing Zhou Enlai fully dressed and prepared, Xi abandoned the idea altogether.\n\nThe barber had just finished trimming Zhou’s hair and beard, now using a warm towel to wipe his face. After enduring a month of illness, Zhou’s appearance had changed beyond recognition. His once vibrant complexion had faded into a dull grayish-yellow, blotched with brown age spots. His sunken eye sockets lay deep beneath prominent cheekbones, and the piercing gleam in his eyes had long vanished… Xi Zhongxun grasped Zhou’s hand in a final farewell as doctors and nurses carefully wheeled his bed onto the ambulance, bound for the Central Party School—his next destination.\n\nBut Zhou Enlai did not have much time left.\n\nHalfway through the journey, he slipped into unconsciousness once again. The monitors showed his blood pressure surging to 160 before gradually falling, his body temperature fluctuating wildly, his heartbeat erratic and weakening. The driver pulled over, and the medical team administered their final emergency efforts, but to no avail.\n\nA somber sky loomed overhead, and drizzling rain blurred the windows of the ambulance. Carrying all his thoughts, all his worries, and all his regrets, Zhou Enlai faded into eternal slumber, his once-bright gaze dimming forever. Deng Yingchao gently kissed his forehead and closed his eyes for him.\n\nThe ambulance, now blaring its siren, made a slow U-turn back to the hospital. The sound drew the attention of pedestrians lining the streets, who stopped to ask who was inside. Upon hearing the answer, their minds went blank, and they fell into silent mourning, quietly following behind the vehicle.\n\nAnd so, as the solemn crowd grew, it formed a long, flowing river, moving steadily through the city."
 CPC_main_story_events.95.o: "Thoughts gather into a river."
 CPC_main_story_events.96.t: "What do I want?"
 CPC_main_story_events.96.d: "\"Why did you put Zhou Enlai next to my room? Get out! All of you, get out!\"\n\nKang Sheng's hoarse roar echoed through the corridor. Before even reaching the ward, the first thing that caught Deng Xiaoping’s eye was the shattered porcelain pieces scattered across the floor, along with the helpless nurses standing outside the door. Not long after, another teacup exploded at his feet, startling one of the nurses.\n\n\"Does he do this every day?\" Deng Xiaoping stopped at the doorway and asked.\n\n\"Not every day, but when he does, it gets really bad.\"\n\nDeng nodded knowingly. Suddenly, another round of porcelain shards flew out, and even the teapot lid was hurled into the hallway, making him sigh. He carefully stepped over the wreckage and entered the room. Kang Sheng sat on the hospital bed, his gown soaked in scalding tea, tea leaves sticking to his neck. His bloodshot eyes, contorted face, and raised teapot made him look almost feral. Seeing the incoming projectile, Deng Xiaoping quickly ducked, but the teapot merely rolled off the bed and clattered to the floor instead.\n\n\"I've been shouting for so long, but no one listens to me!\" Kang Sheng’s voice quivered, as if he had suffered a great injustice.\n\n\"You throw tantrums like this, even the hospital director is afraid of you. How do you expect the young nurses to not be?\"\n\nDeng Xiaoping gestured for the nurse to call in the cleaning staff. Then, he decided to get to the root of the problem. \"I'm here to see you today. If you have anything to tell Chairman Mao, I’ll relay it if I can. But this is the last time. Think carefully about the impression you want to leave on the Chairman.\"\n\n\"Really?\"\n\n\"Really.\"\n\nRealizing that Deng Xiaoping was serious, Kang Sheng's words poured out like a machine gun. \"Don’t remove me from the Central Committee! Don’t label me a counterrevolutionary! Don’t put an X over my name! Don’t burn my photos! I have always been loyal to Chairman Mao!\"\n\n\"I’ll do my best.\"\n\n\"Don’t let Luo Qingchang take my place! He’s Zhou Enlai’s man! He’s a traitor!\"\n\n\"Is that how you speak to the Chairman?\"\n\n\"I’m doing this for the revolution!\"\n\n\"I never said you weren’t. But whether I pity you is my decision. When it comes to the Chairman, the situation changes. You claim Zhou Enlai is a traitor—do you have any proof?\"\n\n\"I do!\"\n\nKang Sheng immediately threw off his blanket and frantically searched his hospital gown, then rummaged through the bedside drawer, looking under the bed and around the room. After several minutes of chaotic searching, he stopped, utterly bewildered. \"I forgot where I put it…\"\n\nTo Deng Xiaoping, this was outright nonsense. He wasted no more words and laid things out plainly. \"Marshal Chen Yi can’t even speak anymore, yet he hasn’t caused a scene like you. The Central Committee isn’t unreasonable. Your reputation is guaranteed, and you will receive everything that is rightfully yours. But if you insist on dragging up some decades-old history that even I don’t remember, demanding a full investigation—well, we can do that. Maybe you do have evidence. But in that case, your reputation is something the Central Committee cannot guarantee. Think it over carefully.\"\n\nDeng Xiaoping scribbled down the key points, let Kang Sheng confirm them, and stuffed the note into his coat pocket. Before leaving, he instructed the nurses, \"This patient is a special case. Take care of him patiently. If he breaks anything, I’ll cover the cost. If he hits or curses at someone, I’ll apologize. But under no circumstances should anything happen to him.\"\n\nThe nurses nodded repeatedly, still shaken, while wondering, How could we possibly reach such a high-ranking official ourselves?\n\nAs soon as Deng Xiaoping left, Kang Sheng’s wailing erupted through the hospital corridors, and the frequency of shattering teacups only increased."
 CPC_main_story_events.96.o: "Use plastic cups instead of ceramic ones."
 CPC_main_story_events.97.t: "Like winds"
 CPC_main_story_events.97.d: "At the entrance of the Central Hospital, the security guards routinely stopped vehicles for inspection. After the driver presented the necessary credentials, he was allowed through, but the car had to remain outside. The vehicle slowly came to a stop by the roadside. In the front passenger seat, Xiao Sui unbuckled her seatbelt while reminding the driver, \"Master Yang, please wait here for me. I'll just grab the medicine and be right back.\"\nOn the way to the hospital, Xiao Sui had noticed that the streets were nearly deserted through the car window. Now, stepping out and looking around, she found the street quieter than ever before, almost eerily so. For a moment, she thought she might have arrived at the wrong place. However, on the other side of the hospital gate, a group of elderly men dressed in dull gray clothes stood huddled together, resembling weathered cement statues. Their hair was uniformly graying at the temples, their deep forehead wrinkles clearly visible, and their sighs heavier than one could imagine.\nAs Xiao Sui walked within five or six meters of them, she overheard their murmuring, where names of central leaders were casually mentioned, but what truly shocked her were the words that followed:\n\"Once Chen Yi dies, we will truly be scattered.\"\n\"I thought it was Zhou Enlai who was in critical condition, but I didn't expect it to be both of them.\"\n\"Make sure you handle the memorial service properly.\"\nBoth of them? Who are they talking about?\nShocked as she was, Xiao Sui had no time to dwell on it and hurried toward the hospital lobby. But as soon as she stepped through the door, the sight she encountered nearly made her head explode.\nStanding against the hospital wall was Jiang Qing, her arms crossed, berating a bearded man beside her with the fury of a schoolteacher scolding a delinquent student. Her anger was palpable, her voice sharp and cutting. After finishing her tirade, she suddenly turned and fixed her piercing gaze on Xiao Sui.\nXiao Sui pretended not to see her and quickly lowered her head, trying to pass unnoticed. But it was futile—Jiang Qing’s voice cut through the air like a whip: \"Xiao Sui! You see me and don’t even greet me? How rude!\"\nThe command struck fear into Xiao Sui’s heart, making her stomach twist in knots. Trembling, she shuffled toward Jiang Qing. \"I’m sorry, Director. I didn’t know you were here today.\"\n\"What? Xiao Xie didn’t tell you my schedule? Or have you been on vacation so long that you've turned stupid?\"\n\"She did tell me... I just forgot...\"\n\"Chen Lao Zong is dying, and you don’t even know?\"\n\"I really didn’t know.\"\n\"Then why are you at the hospital?\"\n\"I came to get medicine for my father.\"\nBefore Jiang Qing could unleash another scolding, a sudden commotion interrupted them.\n\"The doctor is out!\"\nA figure in a white coat stood motionless at the top of the hospital steps, saying nothing, making no gestures. Seeing that the leaders had noticed him, the doctor’s nose twitched, and without another word, he turned and rushed back into the shadows of the hospital lobby.\nThe people in front of the hospital surged forward like a whirlwind, rushing toward the hospital building. Jiang Qing immediately followed suit, striding away, leaving Xiao Sui standing alone in stunned silence.\nThe bearded man didn’t move. Instead, he dusted off the white specks of plaster from his jacket and brought Xiao Sui back to reality.\n\"You’d better hurry and catch up to your Director Jiang. Your vacation is over.\"\n\"Secretary Gao...\"\n\"Just tell me what medicine you need. I’ll have my secretary bring it to your car.\""
 CPC_main_story_events.97.o: "The earthquake began."
 CPC_main_story_events.98.t: "The last review"
 CPC_main_story_events.98.d: "\"The reason why democratic centralism has never been fully implemented may be because people like me—who are fundamentally unqualified as Party members—still occupy high-ranking positions. The far-sighted Chairman cannot rest assured, fearing that one day, the Party will be led into a dead-end by people like us, and thus he harbors concerns about democracy.\n\nHowever, every time democracy advances, our Party gains a victory; every time democracy retreats, our Party suffers a setback. Over such a long period, with so many lessons learned, I have come to understand a simple and undeniable truth: socialism without democratic centralism is a disaster.\n\nIn the stillness of the night, when I recall the scenes of past struggle sessions, I am struck with a profound realization—Trotskyites, old-school revisionists, spies colluding with Japan, capitalist-roaders—such wonderfully damning labels poured forth from their mouths. How I wish that even one of these accusations had been true! And so I am fully aware that the Chairman would never treat me so harshly, that those who criticize me are not being manipulated by anyone behind the scenes but are merely fabricating accusations themselves. Yet, this remains unjust.\n\n'Only those who cherish themselves can earn the love of others; only those who strive to save themselves can be saved by others.' I am not a selfless person. I have lost the ability to follow the Chairman’s great revolutionary path. I have no qualification to continue bearing the responsibilities entrusted to me by the Party, nor am I a role model worthy of emulation.\n\nI ask the Chairman to set aside his concerns and approve my request for retirement. I no longer wish to be consumed by the agony of questioning why I am still alive—I want to save myself.\""
 CPC_main_story_events.98.o: "Mao is stunned in fear and anger."
 CPC_main_story_events.99.t: "If this is first meeting"
 CPC_main_story_events.99.d: "Ever since his visit to the hospital to see Zhou Enlai, an unprecedented sense of anxiety had taken hold of Deng Xiaoping, leaving him pacing in circles inside his room, unable to eat or rest. Such a major issue as retirement—why had the Premier entrusted it to him alone? Was this not forcing him into isolation?\n\nAfter dinner came the usual evening walk, but ever since the series of incidents involving Zhou, Chen, Kang, and others, the atmosphere by the river had turned unbearably heavy. Deng Xiaoping deliberately walked alongside Chen Yun, wearing his worries on his face as he sought his counsel. Chen Yun naturally understood the situation, but he waited for Deng Xiaoping to open up himself—only then could the matter be properly discussed.\n\n\"The Premier spoke to me once,\" Deng began.\n\"What did he say?\" Chen Yun asked.\n\"He wants to retire.\"\n\"Just him?\"\n\"No.\"\n\"Who else?\"\n\nDeng Xiaoping raised his thumb and index finger. \"These two.\"\n\nChen Yun nodded knowingly. \"That makes it tricky. This isn’t unlike what happened with Gao Gang—if handled poorly, it could be framed as a political deviation.\"\n\"That’s exactly why I’m so troubled.\"\n\"Have you spoken to anyone else about this?\"\n\"You’re the first.\"\n\"No one in the central leadership has retired under normal circumstances so far. Someone like Xie Juezai still held an official title until his death. Peng Zhen was an exception, and Gao Gang made mistakes—both were forced out under abnormal conditions. This is the historical burden of our Party.\"\n\"Sometimes, I wonder… if we had never met each other in the first place, would we still have so many problems?\"\n\"I’ll pretend I didn’t hear that nonsense.\"\n\nAfter a brief silence, Chen Yun spoke first.\n\n\"You need to make everyone understand that retirement is not a punishment, not a case of being discarded once useless. You have to ensure that their benefits, honorary titles, and even the futures of their children are properly arranged—otherwise, this won’t work.\"\n\"And what if some people demand too much, putting me in an impossible position?\"\n\"There’s no such thing as a free lunch. Besides, if anyone makes excessive demands, it’ll be those two—so you’d better think carefully about how to handle them first.\"\n\"I'll start by convening a discussion within the Central Committee. Otherwise, I’m completely in the dark here.\"\n\nAs night fell and the riverside became deserted, Deng Xiaoping could no longer see Chen Yun’s face clearly, nor could he guess what was on his mind. Some vague thoughts drifted through Deng’s mind as they walked the path back together.\n\n\"When is Chen Yi’s memorial service?\"\n\"Tomorrow.\""
 CPC_main_story_events.99.o: "Arrive on time tomorrow."
 CPC_main_story_events.100.t: "Visitors' troubles"
 CPC_main_story_events.100.d: "Chen Yi’s body lay solemnly in the farewell hall, draped in a bright red Party flag, surrounded by an ocean of fresh flowers. Behind him, a black-and-white photograph captured his gentle smile, framed by four solemn characters—\"Eternal Glory\". His grieving wife, Zhang Qian, stood at the west side of the casket, leading the family members in mourning, her face drenched in tears.\n\n\"From the days of the Red Army to the very end, Comrade Chen Yi unwaveringly upheld Marxism-Leninism and Mao Zedong Thought. He was resolutely loyal to Chairman Mao’s revolutionary line, dedicated and unyielding. Throughout the long years of revolutionary struggle, Comrade Chen Yi devoted his entire life’s work to the Party, to the people of the Northwest, and to every single one of us. Today, with profound sorrow, we pay tribute to Comrade Chen Yi.\"\n\nMilitary representative Huang Kecheng delivered the eulogy, his voice steady but heavy with grief. Then, supported by his secretary Guan Feng, Mao Zedong slowly made his way to the podium. His Zhongshan suit, its collar askew and fabric full of wrinkles, seemed to silently narrate the rush with which he had set aside all affairs to attend the memorial. Despite the disheveled appearance, there was a rare sense of sincerity in his presence. Unlike the usual formalities, Mao’s speech was deeply personal—stripped of political rhetoric, it was a reflection of shared memories. When he spoke of their time fighting side by side during the Red Army years, many of the old comrades in the room found themselves overwhelmed with emotion, tears silently streaming down their faces.\n\nAs the ceremony proceeded to the final farewell, the hall was filled with the sorrowful strains of mourning music, echoing through every corner. Some grieved in agony, others stood in silent despair. A long procession formed, moving forward slowly in a solemn, single-file line. Leading the queue was Liu Shaoqi, the first to step forward and offer his condolences to Zhang Qian. After expressing his sympathies, he introduced a new acquaintance.\n\n\"This is Comrade Zhou Yang,\" Liu said, gesturing toward the man beside him. \"He made a special trip back from Gansu for the service.\"\n\nZhou Yang, understanding the gravity of the moment, solemnly extended his hand. \"Madam Zhang, my deepest condolences.\"\n\nZhang Qian nodded weakly, acknowledging their respect.\n\nIn a quiet corner of the hall, a wheelchair sat still. In it was a frail and emaciated Zhou Enlai. Out of consideration for his health, the Central Committee had allowed him to attend the memorial as an observer rather than participating in the procession. Watching the crowd move forward one by one, their paths never intersecting with his, Zhou Enlai felt an unsettling sense of detachment. A chill, not from the weather but from within, crept over him.\n\n\"A remarkable performance,\" a subversive thought crossed his mind. But almost immediately, he rebuked himself.\n\n\"Sigh… Then what was my apology to Zhang Qian for?\"\n\nYet, Zhou Enlai had no time to dwell on these feelings. His mind was fixed on one thing—his long-planned retirement. Fixing his gaze on the host of the ceremony, Deng Xiaoping, he silently called for his attention. Deng Xiaoping noticed and approached him.\n\n\"Do you have any updates on what we discussed before?\" Zhou Enlai asked.\n\n\"I have already presented your request to Chairman Mao,\" Deng replied. \"But he hasn’t given any instructions yet. Right now, my priority is to get the discussion started… but there’s just too much going on lately.\"\n\n\"Make sure it happens,\" Zhou Enlai pressed."
 CPC_main_story_events.100.o: "\"It all depends on the Chairman's decision.\""
 CPC_main_story_events.101.t: "Breakthrough"
 CPC_main_story_events.101.d: "Chen Yi and Kang Sheng's memorial services had left the Central Committee utterly exhausted, to the point where no one even had the energy to attend this meeting about discussing their own retirement. The conference room was filled with yawns, expelling the stench of unbrushed teeth, mixed with the acrid smoke of burning tobacco, making the atmosphere unbearably unpleasant.\n\n\"The fact that the Chairman arranged this meeting shows that he sees the Premier’s proposal as a major issue. It also indicates that our Party is facing new circumstances in this new era, and we cannot afford to take this lightly. I hope everyone here treats this matter with due seriousness.\"\n\nDeng Xiaoping cautiously delivered his opening remarks before calling on the most unexpected speaker—Jiang Qing. It was her first time representing the highest leader's views in a major decision-making process. She had not only seen the pig run but was now getting to taste the meat.\n\n\"The Premier’s health is not something that can be decided by any individual. Even the doctors don’t have the final say. This is entirely up to the Party’s Central Committee. If the revolution demands that he remains, then he cannot retire. The Front relies on the Premier to handle every major and minor affair—if he steps down, what will the rest of the comrades do? The same principle applies to the Chairman. Anyone else can retire, but Chairman Mao cannot!\"\n\nIf stubbornness had become Mao Zedong’s last reliable weapon in his old age, then he had undoubtedly passed it on, in full, to Jiang Qing, who had been by his side day and night. Particularly, she had inherited his unwavering, iron-fisted style. However, Jiang Qing's words were not Mao’s words—absolute obedience was not necessary. While she was speaking, Bo Yibo and Liu Lantao quietly whispered to each other, their disdain barely concealed.\n\n\"She thinks we're all dead men, huh…\" Bo Yibo sneered.\n\nLiu Lantao waved a hand to signal him to stay quiet. The moment Jiang Qing finished, he immediately took the floor. Everyone’s eyes shifted to him; no one wanted any unexpected turns.\n\n\"The Premier’s perspective is worth considering. He believes that by stepping down and allowing younger cadres to rise, the base areas will achieve long-term development. If we expand on this logic, wouldn’t replacing all the elderly comrades who can no longer perform their duties with younger, more capable successors make our leadership even more stable and effective?\"\n\nAs soon as he said this, the room was filled with the sound of throats being cleared and coughs echoing from every corner. The representatives began running their own calculations in silence—no one took another puff of their cigarettes, no one sipped their tea, and even the service staff stood frozen in place by the water kettles. Then, Zhang Yunyi's coarse voice, as aggressive as an enraged ox, barreled through the tension:\n\n\"Some of these old comrades have been in their positions for over a decade. If they leave, there won’t even be a backbone left in their units—everything will have to be rebuilt from scratch. Won’t that just create more chaos?\"\n\nAt that moment, the room erupted into a cacophony of voices.\n\n\"A lot of them have already dumped all their work on their secretaries! They just drift from one office to another. The units function just fine without them,\" Huang Kecheng retorted, nearly out of breath.\n\n\"I don’t even use a secretary,\" Xu Shiyou chuckled, treating the debate as nothing more than a joke.\n\n\"I’ve worked for the revolution for decades, and now you tell me I should just step down? Where’s the logic in that?\" someone else grumbled.\n\nDeng Xiaoping, seeing that the situation was spiraling out of control, let out a silent sigh. He massaged his forehead and flipped through his documents, waiting for the commotion to settle. However, he failed to notice the simmering rage on Li Lisan’s face—until Li suddenly kicked his chair away and shouted:\n\n\"I’ll retire!\"\n\nThe room fell into stunned silence as Li Lisan stormed out, slamming the door behind him with a resounding bang that echoed through the hearts of everyone present. Chen Yun nudged Deng Xiaoping with his foot, then gestured toward the door Li had just walked through.\n\n\"Press him a little more, and this will all be settled.\"\n\n\"You mean, have him write a self-criticism?\" Deng asked.\n\n\"Yes,\" Chen Yun nodded. \"And make it in the name of Chairman Mao.\""
 CPC_main_story_events.101.o: "A deal delivered to your door."
 CPC_main_story_events.102.t: "Quick thinking"
 CPC_main_story_events.102.d: "Since the Central Committee convened the \"Retirement Meeting,\" a tense political atmosphere had engulfed all of Xi’an. At Lin Biao’s residence, the staff of the \"Lin Office\" remained as busy as ever, processing incoming information for their superior. Confidential secretary Yu Yunheng opened a document bag and was startled by what he read:\n\n\"Chairman Mao is stepping down!\"\n\n\"Stepping down from what? What is Chairman Mao stepping down from?\"\n\nHis reaction immediately drew the attention of the surrounding staff, who put down their work and crowded around him to see the document. There, in bold red characters, the notification stated: Chairman Mao had agreed to Premier Zhou Enlai’s proposal regarding the retirement of senior Party cadres and would also not seek re-election as Chairman of the Front.\n\n\"Huh?\"\n\"What’s going on?\"\n\"If Chairman Mao is stepping down, what happens to us?\"\n\"Is Vice Chairman Lin stepping down as well?\"\n\nA wave of panic spread through the office, and no one even noticed Ye Qun standing at the doorway. Hearing about the unusual commotion in the \"Lin Office,\" she had rushed over to check the situation, only to find the secretaries huddled together whispering among themselves. She immediately questioned them:\n\n\"What’s all this nonsense about stepping down? What are you all mumbling about?\"\n\n\"Director Ye, take a look at this.\"\n\nYu Yunheng respectfully handed her the notification with both hands. Ye Qun took a glance, and her face immediately changed. Without a word, she turned on her heels and rushed straight to Lin Biao’s study.\n\nUpon entering, she found Lin Biao still leisurely reviewing documents at his desk. Her frustration boiled over, and she snatched the pen from his hand, slammed the notification onto the desk, and pointed at it, saying, \"I told you to attend that meeting the other day! You were too lazy to go! Now look at what’s happened!\"\n\nLin Biao, seeing his wife’s fiery temper once again, wiped his hands with a handkerchief, took off his glasses with an air of irritation, and responded as if he had already anticipated the situation:\n\n\"So, Chairman Mao has agreed to Zhou Enlai’s retirement?\"\n\n\"Not just Zhou Enlai—Chairman Mao himself is stepping down!\"\n\n\"Oh…\"\n\nLin Biao glanced at the red-lettered notification and understood why Ye Qun was so agitated. To be honest, he himself felt somewhat at a loss. He had not expected the retirement issue to become this significant so quickly. But more importantly—how had Ye Qun received this information before he did?\n\nTo repay his ever-diligent wife, Lin Biao theatrically reached into his trouser pocket and pulled out a letter, folded several times. He unfolded it, smoothed it out, and placed it atop the notification.\n\n\"I didn’t attend the meeting, but I know everything that happened. This is the meeting record Wu Faxian wrote for me.\"\n\n\"You’re just putting on a front. How could you have known about Chairman Mao’s retirement before I did? Now tell me, what are we going to do about this?\"\n\nLin Biao’s mind raced, but he had no answer. \"Let things take their course,\" he blurted out.\n\n\"What? Are you really going to sit back and let Liu Shaoqi and Bo Yibo eat us alive? Do you even think about these things?\"\n\n\"Stop talking nonsense!\"\n\nHis throat dry, Lin Biao grabbed his teacup and took a sip to cool down. After a long silence, an idea finally took shape in his mind:\n\n\"Have Yang Dezhi prepare a list of the military district and service branch leaders and personally bring it to the Lin Office tomorrow afternoon. Add Yang Chengwu and Wu Faxian to the discussion—I need to meet with them to decide on retirement candidates.\"\n\n\"What about Ding Sheng?\"\n\n\"Who?\"\n\n\"The one you sent to Tibet earlier.\"\n\n\"If he wants to come, let him come. If not, then forget it.\"\n\nChairman Mao’s decision was final, but seeing that Lin Biao was not simply surrendering to fate, Ye Qun was satisfied. Having received her orders, she left the room with a smile, feeling triumphant. She secretly congratulated herself—if not for her, Lin Biao wouldn’t have made a decision so quickly."
 CPC_main_story_events.102.o: "Military affairs should be handled by the military leader."
 CPC_main_story_events.103.t: "Crazy Fall Wind."
 CPC_main_story_events.103.d: "\"In the past, the Chairman taught us to rid ourselves of dogmatism, but he never mentioned empiricism. Now, the main danger is that empiricism is hindering the Front’s development. Comrade Xiaoping handles daily affairs with the Chairman’s approval—perhaps he does things imperfectly in one way or another, but the old comrades must be more tolerant. They should not, out of habit, label him as a bad person.\"\n\nSince the retirement purge began, the Party had been thrown into turmoil. Those senior officials whom Deng Xiaoping had placed on the retirement list were unwilling to relinquish power. They either personally visited or sent emissaries on their behalf, repeatedly accusing Deng of unfair practices, and often went to Zhou Enlai’s hospital room to demand explanations. Fully aware that all the uproar stemmed from his decisions, Zhou dared not show the slightest negligence. As long as he remained conscious, he insisted on personally meeting each visitor—outwardly respectful but, in truth, seeking to interrogate him. Day after day of these verbal skirmishes drained the last vestiges of his energy.\n\nThat morning, as the nurse routinely drew back the hospital room’s curtains, Zhou Enlai awoke from a heavy sleep, his movements sluggish. He slowly opened his eyes, greeted by the deeply concerned gaze of Deng Yingchao.\n\n\"How do you feel today?\"\n\"Still weak...\"\n\"Yesterday, you wanted to see Luo Qingchang. He’s here now, waiting outside.\"\n\"Please, let him in.\"\n\nDeng Yingchao stepped to the door and ushered Luo Qingchang to Zhou’s bedside. Mustering his last reserves of strength, Zhou sat up with the help of the nurse. Seeing the Prime Minister’s sunken cheeks, Luo’s eyes immediately welled with tears. Zhou hadn’t expected his longtime subordinate to break down the moment they met, and so he tried to console him while inquiring about official matters.\n\n\"I never used to get sick... but now, this illness has delayed so much. Comrade Luo Qingchang, I called you here to ask—two days ago, I submitted my request. Has the Chairman approved it?\"\n\nLuo wiped his face and replied, \"The Chairman has not approved it yet. He says the Prime Minister is too exhausted and must rest.\"\n\n\"I thought as much.\" Zhou bowed his head, staring at the hospital bedsheet in disappointment. \"The way I am now, running around only creates more trouble for others. But I cannot put my mind at ease. The reports in newspapers and on the radio—they can’t stop me from wanting to see things with my own eyes… After all these days, I have realized one truth—the future belongs entirely to the younger generation. That is why I must go to the Central Party School to meet the new students.\"\n\nDeng Yingchao could no longer hold back. Leaning in close, she whispered into Zhou’s ear:\n\n\"You consider others your closest comrades-in-arms, but you must also consider yourself. I understand you, but you can’t keep destroying yourself like this.\"\n\n\"I have no time for personal matters anymore. I failed to take good care of the Party, and now my fellow comrades are pointing fingers at me. It weighs heavily on my heart. After meeting with the new students, I must also visit certain comrades to explain the situation.\"\n\nLuo Qingchang, seeing the unwavering resolve in Zhou’s expression, knew he could not dissuade him. Instead, he tried to lessen the burden on the Prime Minister’s mind:\n\n\"I will go speak to the Chairman again and try to persuade him...\"\n\nUpon receiving Luo’s reassurance, Zhou Enlai’s tense spirit finally loosened. He closed his eyes and suddenly collapsed into unconsciousness, sending Luo into a panic as he frantically pressed the emergency call button for the nurse’s station. The attending doctor rushed in and carefully examined Zhou, finally confirming that his vital signs were stable."
 CPC_main_story_events.103.o: "He will wake up."
 CPC_main_story_events.104.t: "Forever in Remembrance"
 CPC_main_story_events.104.d: "On the second floor of the hospital, Xi Zhongxun, Yang Chengwu, Lin Feng, and others had just escorted Zhou Enlai’s remains into the mortuary. After a brief farewell ceremony, they stood by the window, gazing down at the crowds of citizens gathered outside the hospital, unable to compose themselves.\n\nAt a nearby photography studio, grief-stricken people flooded through the doors, desperate to purchase a portrait of the deceased leader. A large photograph stood solemnly at the hospital gate, encased in a broad hardwood frame, with four golden characters inscribed at the top: \"People’s Premier.\" Below it, the ground was covered with flowers, cigarettes, alcohol, and other offerings left by mourners to express their sorrow. As the evening approached, more and more people arrived spontaneously after finishing work, carrying wreaths and personally shielding the burning incense and candles from the elements. Cars packed the roads surrounding the hospital, and the sound of honking filled the air.\n\nThen, the sound of synchronized footsteps sent a tremor through everyone’s hearts. Under the shroud of night, a unit of soldiers marched briskly to the scene. They set up roadblocks to separate the crowd from a small memorial tent and began carrying out the Central Command’s civil defense orders: cloaked in raincoats, they removed the wreaths, wrapped the framed portrait in a plastic cover, and prepared to transport it away. The offerings were swept into burlap sacks, and the mourners holding umbrellas to protect the candles were shooed away. Rain doused the candle flames, and as the people watched the soldiers at work, their grief quickly turned to rage.\n\n\"Why are you taking away the wreaths?\"\n\"Who gave you the order to do this?\"\n\nTheir sorrow erupted into fury. To protect the scene, the crowd surged forward, their cries, shouts, and curses mixing with the soldiers’ firm warnings. Some slipped on the rain-slicked pavement, and the chaos led to trampling. A few isolated soldiers, whether from the pushing or from something more deliberate, ended up with bruised and swollen faces. Clearly, this detachment had anticipated unrest—they swiftly pulled thick wooden batons from their vehicles and formed a barricade of bodies. A loudspeaker mounted on a military vehicle crackled to life:\n\n\"Comrades, the Central Committee fully understands your grief for Premier Zhou. However, today is not the official date for the memorial service. Please disperse in an orderly fashion. If you do not, the police will intervene to maintain order.\"\n\nThe announcement had no effect. The chaos persisted. A heavy brick hurtled through the air, smashing into the vehicle’s loudspeaker, filling the night with a piercing electrical buzz. The sound was like a gunshot signaling escalation—suddenly, stones rained down, clanking loudly against the military vehicles. The situation was reported to headquarters, and fifteen minutes later, orders arrived for the officers on the ground:\n\n\"Reinforcements have arrived. You are cleared to withdraw and prepare to disperse the crowd.\"\n\nZhou Enlai’s massive portrait, now forgotten, rested in a corner, rainwater streaking down his solemn face. Under his watchful gaze, the police swung their wooden batons into the crowd. Those deemed \"ringleaders\" were bloodied and dragged onto military trucks, while the rest of the people screamed, shielding their heads as they scattered in all directions. The disturbance—instigated by a handful of reactionary elements and enemy agents—was finally and completely suppressed. Mission accomplished."
 CPC_main_story_events.104.o: "I'll be waiting for everyone at the finish line."
 CPC_main_story_events.105.t: "Sichuan Summary Meeting"
 CPC_main_story_events.105.d: "\n\"Back in Jiangxi, the Red Army didn't support the 19th Route Army. Internally, it was blamed on Wang Ming’s leftist deviation. Now that Liu Wenhui has been driven into the base areas, Comrade Peng, do you have anything to say about it?\"\n\nThe Sichuan issue was originally supposed to be handled by the Guanzhong Military Region under Peng Dehuai’s command, coordinating with the Southwest Bureau to maintain Liu Wenhui’s presence. But now that the warlord infighting had disrupted the Central Committee's strategic plans, he could not escape responsibility. Under Lin Biao’s pointed questioning, Peng Dehuai rose from his seat, removed his green military cap adorned with a red star, and bowed slightly to acknowledge his failure.\n\n\"The battlefield defeat was my fault,\" Peng Dehuai admitted, a heavy cloud of frustration settling over his face. \"Six hours before the warlords launched their offensive, apart from Han Xianchu’s telegram, I received no reports from the border forces regarding Sichuan. This resulted in unclear intelligence on the Xikang army’s situation, misleading the Central Committee’s decision-making.\"\n\nHis self-criticism, however, did not satisfy Lin Biao. Perhaps, after taking over the work of the Military Commission, Lin’s temper had grown worse. Building on Peng's admission, he unleashed his uncontainable urge for a long-winded critique:\n\n\"The soldiers are new, their uniforms are new, but their thinking is still old. From the grassroots officers of the Guanzhong troops to the brigade and division commanders, they remain completely oblivious to changes beyond the base areas. They have no sense that we're still fighting in other regions. This kind of lazy thinking doesn’t come from the outside—from the old Kuomintang army—it’s our own minds that have ossified. If we only focus on surface-level issues and fail to truly strengthen ideological work, then our army will remain nothing more than wooden dummies, passively taking hits wherever they go.\"\n\nAfter delivering this long speech, Lin Biao wasn’t done. With a cryptic expression, he turned back to Peng Dehuai:\n\n\"Comrade Peng, think carefully—why was the Qinghai pacification not entrusted to the Guanzhong troops?\"\n\n\"That’s too harsh.\"\n\n\"Tomorrow, I’ll be at the Administrative Committee helping the Chairman secure votes. The directive to liberate Sichuan will arrive soon. I hope all agencies, all military units, and all senior comrades will cooperate.\"\n\nThis declaration stunned everyone in the room. Even Liu Bocheng, who rarely spoke, was visibly shaken.\n\n\"Securing votes? How can you go lobbying for votes?\"\n\n\"Liu Wenhui is about to address the Committee, pleading with the representatives in the hall to save Sichuan. The base areas must secure Sichuan, or else all of the Southwest Bureau’s construction efforts will have been in vain.\""
 CPC_main_story_events.105.o: "I'm only there as the whip. Nothing will happen."
 CPC_main_story_events.106.t: "Chasing the Sun"
 CPC_main_story_events.106.d: "Liu Yalou marched along the border, recalling Zhou Baozhong’s instructions. Two days prior, Liu, Zhou Baozhong, and Li Zhaolin had agreed to organize a team to cross the Greater Khingan Mountains via Mongolia and proceed to Shaanxi. Liu Yalou still vividly remembered Zhou Baozhong’s final words before departure:\n\n\"Yalou, you must explain to the Central Committee that the Northeast Anti-Japanese United Army (NAJUA) still exists, that we have not been defeated! As long as we continue fighting, we will liberate the Northeast, and we will liberate China!\"\n\nLeading his team, Liu Yalou carefully avoided the puppet army’s patrols. However, upon reaching the foothills of the Greater Khingan Mountains, they were unfortunately spotted. Several gunshots tore into the ground at their feet, while others struck the towering ancient trees of the forest. Seeing this, Liu Yalou lashed his whip and spurred his horse forward, urging his team to gallop at full speed into the mountains. Their horses panted heavily, their sweat forming a white mist in the cold air. They crossed swamps, bypassed rivers, and fortunately, the puppet troops did not pursue them too far. Liu Yalou glanced back to ensure they were not being followed, then pressed on. With a compass in one hand and a map compiled over the past decade by NAJUA soldiers, he carefully navigated their route toward Mongolia. The team marched westward, chasing the setting sun.\n\nThe hundred-strong unit moved through the forest. The neighing of their horses echoed across the snowy expanse, declaring their presence in this land of freedom. A Manchurian tiger pounced on a startled roe deer, only to retreat into the underbrush at the sound of approaching hoofbeats. The Manchukuo Army arrived to conduct a sweep, but their armored vehicles, trapped in the marshlands, forced them to abandon their pursuit. Steep mountains were traversed as if they were flat land; crossing rivers was second nature. When thirsty, they drank melted snow from their canteens; when hungry, they gnawed on rock-hard sorghum rice balls from their packs. When weary, they hummed \"On the Songhua River\" as they drifted into brief slumber.\n\nDays later, the team emerged from a valley, greeted by an open expanse. Following the course of a river, they soon found themselves before a vast lake where the sky met the water—it was Hulun Lake. The Mongolian interpreter accompanying them pointed ahead, saying that beyond the lake lay the territory of Red Mongolia. They were close. They were near the Central Committee. Liu Yalou thought to himself.\n\nThe unit followed the shoreline of Hulun Lake when suddenly—\"Bang! Bang!\" Two gunshots rang out in the distance. The team immediately took defensive positions, their eyes locked on the direction of the sound. Liu Yalou scanned the horizon and spotted a flag, red and blue, waving in the wind. As the soldiers beneath the banner approached, their features and insignia became clearer.\n\nThe August 1st insignia of the Chinese Red Army.\n\nThe interpreter stepped forward first, speaking on behalf of the group to demonstrate their friendly intentions. Liu Yalou smiled and called out:\n\n\"Comrade, we are Communists from the Northeast.\"\n\n\"Communists? From the Northeast?\" The leading Mongolian officer asked in hesitant Chinese, visibly skeptical.\n\nLiu Yalou handed over a letter from the NAJUA headquarters and snapped to attention, saluting the patrol leader."
 CPC_main_story_events.106.o: "\"I am Liu Yalou of the Northeast Anti-Japanese United Army. I need to report to the Central Committee of the Communist Party of China.\""
 CPC_main_story_events.107.t: "White Snow, red light"
 CPC_main_story_events.107.d: "\"I have built a monument for myself\nThat no hand of man can erect,\nA path to it shall never be overgrown\nBy the weeds of oblivion.\nIt proudly lifts its unyielding head\nHigher than the column of Alexander.\nNo, I shall not die!\nMy spirit in cherished verse\nShall escape decay,\nAnd outlive my own ashes.\nMy name shall echo through the ages,\nSo long as a single soul\nRemains beneath this moonlit sky...\"\n\nThis was one of Liu Yalou's favorite poems, and also the love poem he once recited with his beloved Suliwa in the moonlit woods of Moscow. He always felt as if the poem foretold his life’s fate. The days in Moscow still seemed close at hand—the same icy landscape, the same fervor burning within. Yet, the battle-worn soldiers surrounding him reminded Liu Yalou that he might never return to those days again.\n\nJust yesterday evening, a small detachment of the Anti-Japanese United Army launched a surprise raid on a Manchukuo military encampment at Tahe. This risky maneuver was necessitated by the Kwantung Army’s recent intensification of its blockade in northern Manchuria, forcing Liu Yalou’s unit to march relentlessly for days before finally securing a temporary foothold.\n\nIt was not a wasted effort—they managed to seize supplies. However, before the enemy could regroup, they had to push northward again, back to the main headquarters of the Anti-Japanese United Army.\n\nDuring the brief respite, Liu Yalou followed his usual habit: ordering his adjutant to gather all readable newspapers and magazines while he tuned a transistor radio, carefully adjusting the frequency in search of valuable intelligence.\n\nWhat he heard next left him utterly stunned.\n\n“This is Asahi News. According to our latest reports, the civil unrest in China, triggered by the Yasuda Crisis, has taken an unexpected turn. The Communist Party in the Northwest has supported Liu Wenhui’s forces in exploiting the chaos to launch an invasion into Sichuan and Chongqing, completely seizing control of both regions. This marks the first proactive military expansion by the Northwest Communists in over a decade. In response, the National Government of China has declared that it will never bow to the Communist bandits and is preparing a severe counteroffensive.\n\nThe Japanese government has also strongly condemned this act of defiance, accusing the Communist rebels of persistently maintaining an anti-Japanese stance and attempting to incite internal strife to overthrow the legitimate government of the Republic of China.\n\nWith this latest development following the Mongolian Civil War, could this signal the brewing of yet another large-scale conflict on Chinese soil? And what implications might this have for Japan? Stay tuned for expert analysis after this broadcast...”\n\nStill hunched over, sorting through the scattered newspapers, the adjutant suddenly felt a strong tug on his sleeve. He looked up to see Liu Yalou, his earlier exhaustion completely gone, now wearing an expression of sheer exhilaration.\n\n\"Hurry up and finish packing! We must head back immediately—this news needs to reach Commander Zhou at once!\""
 CPC_main_story_events.107.o: "The Party Central Committee is about to take big action!"
 CPC_main_story_events.108.t: "Long way"
 CPC_main_story_events.108.d: "\"The widespread 'lovesickness' that people speak of today—we call it 'pioneer’s disease.' Living collectively on these endless plains, so different from the city life before, some find it unbearable. But whenever I struggle, I think of my comrades who fought in the pacification war and press on in the battle against this affliction. Generations have dedicated themselves to this cause, even my parents, now in their seventies, are still locked in combat with our persistent enemy— the weeds that hinder our agricultural yields...\"\n\n\"Can you bear to send your elderly mother and newborn child to suffer on this untamed land? To that, I answer with a verse: 'Born as a child of Yamato, I shall be buried in the land of the imperial path.' I teach them that pioneering is not for the self, but for the nation, for future generations. That is why I joined the development corps, why I persisted as a youth, why I have fought until today...\"\n\nLying in his hospital bed, Zhang Weixian watched the footage captured by the Japanese, those images of the past flickering like a film reel before his eyes. Decades of postwar years unraveled in his mind like a slideshow, those years of so-called 'Imperial Manchurian Land Development.' Many who had lived through it—those who still longed for the black earth to be free—had already vanished.\n\nAnd those who remained, like him, had their souls ground down by time, moving forward only by the dull inertia of habit. \"Mediocrity perishes, yoked to the troughs and stables\"—time had only solidified this belief. Whether beneath the Blue Sky and White Sun, or the Red Field and White Star, both remained unforgotten, yet forever buried deep in his heart, like dust too heavy to stir.\n\nA failure may disguise himself as a victor and blend in among them. But then what? Those who betray their past can never quell the loneliness and emptiness within, and those who wear masks forever fear the day they are unmasked. Sooner or later, reckoning comes, doesn’t it? Just like that summer afternoon, when he did what he had to do to survive.\n\nThe moment a man steps into the wilderness, he can never return. He thought so, and his gaze fell upon the photograph on his bedside table—the young man he once was, and the child who was still innocent. That child must now be wandering through some nameless alley in an unknown city.\n\nWhere are you going? What are you searching for? (The telegraph machine hums to life...)\n\nAre you doomed to repeat my path? (.-- .)\n\nWill you meet the same fate as I did? (.- .-. .)\n\nWill you continue to eke out an existence in this era…? (-. .- .--- ..- .-)\n\nHe didn’t know. As night fell, he still didn’t know…\n\nDeep in the glowing lights of Harbin, a secret radio signal, broadcast from an underground station, cut through the freezing winds and drifted toward the distant northwestern frontier."
 CPC_main_story_events.108.o: "27220，12110，34127，24111，53014"
 CPC_main_story_events.108.tt: "Translation:\"We are §xthe Northeast Anti-Japanese United Army Headquarters§!, calling the Central Committee! — Liu Yalou Telegram\"\nThis will unlock a new §Ynational focus branch§!…"
 CPC_main_story_events.109.t: "Go home"
 CPC_main_story_events.109.d: "After receiving the telegram from Mongolia, Zhou Enlai immediately relayed the information to Mao Zedong and asked for his opinion. As Mao read Liu Yalou’s letter, he felt a sense of relief—partly because the spark of the Manchurian Provincial Committee still remained and partly because the revolutionary cause now had more possibilities. He then instructed Zhou Enlai to have Liu Yalou report to him as soon as he arrived.\n\nTwo days later, Liu Yalou’s small unit marched into the gates of Xi’an. Crowds lined the streets, holding banners that read \"Welcome to the Heroes of the Northeast Anti-Japanese Resistance\" as they paid their respects. Mao, Zhou, and other central leaders were already waiting outside the office building, ready to invite Liu Yalou inside for a briefing.\n\nInside the meeting room, in addition to Mao and Zhou, military leaders such as Lin Biao, Xu Xiangqian, and Peng Dehuai were present. They were all awaiting the report from this young commander who had emerged from the snowy forests of the Northeast.\n\nLiu Yalou, after organizing his documents, began his briefing on the current situation of the Northeast resistance against Japan.\n\"After the Germans invaded the Soviet Union, we, the Communist Party members who had been stranded in the USSR, were transferred to Irkutsk alongside the Soviet Central Committee. There, we regrouped with the exiled Northeast Anti-Japanese United Army.\"\n\nAfter summarizing the status of the Party members in the Soviet Union, he continued with the state of the Anti-Japanese struggle:\n\"Not long after our reunification, Japan launched an offensive into Outer Manchuria, and we were deployed to the front lines to resist. The Anti-Japanese United Army, fighting alongside the Red Army, engaged in brutal battles with Japanese and Manchukuo forces. However, as Irkutsk fell into turmoil and several anti-Soviet militias emerged in the surrounding areas, we lost contact with the Soviet Central Committee. From that moment on, our ammunition, weapons, and food supplies became severely limited, forcing us to withdraw and shift to guerrilla warfare against the Japanese.\"\n\nLiu Yalou then turned to the blackboard, drawing a detailed map of Northeast China and the former Soviet Far East, a landscape he had come to know by heart after years of relentless resistance. Pointing to the board, he continued:\n**\"To the north, we face White Russian forces that emerged after the Soviet collapse. To the south, the Japanese Army and Manchukuo's puppet forces have imposed a strict blockade, leaving our base areas confined to the forests and marshlands around Hailar, Miao Street, and Boli. These terrains are impassable for Japanese mechanized units, and even their infantry struggle due to their unfamiliarity with the landscape.\n\nTo sustain our forces and continue the fight, some of our comrades secretly infiltrated major cities south of the Heilongjiang River, establishing underground networks to secure medical supplies and other essentials for our base areas. Occasionally, we were even able to smuggle in weapons and ammunition. However, the Japanese crackdown has intensified, and we have now reached a long-term deadlock with the enemy.\"**\n\nAs Liu Yalou concluded his report, some officials whispered among themselves, while others sat in deep contemplation. The Northeast problem was undoubtedly a difficult one, and even the idea of sending aid through Mongolia seemed as perilous as walking on thin ice.\n\nAs the room remained silent, Mao Zedong was the first to speak.\n\"We can't just leave our comrades hanging here without reaching some conclusions. The situation in the Northeast is something we need to deliberate on carefully. For now, let’s allow our comrades from the Northeast to rest.\"\n\nWith that, he placed his hands on the table, stood up, and patted Liu Yalou on the shoulder."
 CPC_main_story_events.109.o: "\"Just go home. We can talk about it later if there's anything else.\""
 CPC_main_story_events.110.t: "Northeast Summary Meeting"
 CPC_main_story_events.110.d: "Liu Yalou was granted special permission to attend the Central Work Conference as a representative of the Northeast Anti-Japanese United Army (NAJUA). As he looked around the room, he saw the very faces that he had only ever seen in printed newspapers—now sitting at the conference table, preparing to draft a blueprint for the future of the Northeast revolution. Everything he was experiencing felt so vivid and undeniable that he momentarily lost his sense of reality, gripping the table to steady himself.\n\nOnce again, Mao Zedong was the first to initiate the discussion:\n\"Yesterday’s Central Committee meeting reached a consensus—we must support our revolutionary comrades in the Northeast. Now, the question has shifted to how we do it. That is to say, what methods should we use, where do we carve out a supply corridor, and what specific areas require support?\"\n\nLin Biao then stood up and walked over to the large map of the Northeast, raising his pointer to Manzhouli:\n\"After yesterday’s meeting, I gathered the comrades from the Military Commission for further discussions. We believe that if the NAJUA is to receive material aid from the Central Committee, the best option would be to consolidate its forces and withdraw toward the vicinity of Manzhouli. Specifically, the headquarters of the NAJUA could move westward to Choybalsan. The direct railway line from Ulaanbaatar would make resupply very convenient.\"\n\nLiu Shaoqi raised his hand to add:\n\"Previously, the railway from Ulaanbaatar was connected to the interior, but it did not go directly to Baotou. According to the comrades in the Ministry of Transport, expediting the construction to link Baotou with the existing railway may take six months to a year.\"\n\n\"As long as the railway can be connected, it’s not a major issue,\" Mao Zedong replied. \"Besides, we should also listen to the opinions of our comrades from the NAJUA. Comrade Yalou, what do you think?\"\n\nLiu Yalou hurriedly stood up, but Mao Zedong waved his hand with a smile:\n\"This isn’t a teacher calling on a student—just speak while seated.\"\n\nWith a smile, Liu Yalou saluted, then sat back down to organize his thoughts before speaking:\n\"Chairman, my views are fully aligned with Commander Zhou’s. Our priority is to re-establish direct contact with the Central Committee and restore organizational structure. Right now, the NAJUA has absorbed a significant number of former Soviet Red Army members as well as Korean guerrilla fighters. While all of them are committed to resisting Japan, their personal motivations and organizational relationships are quite varied. We hope to first consolidate our organization and unify ideological understanding, and then, on a voluntary basis, arrange for groups to withdraw westward in stages...\"\n\nSeveral hours later, the meeting concluded. As the representatives filed out of the room, Liu Yalou caught sight of Mao Zedong slowly pushing himself up from the table with both hands. Without thinking, he took a step forward and said:\n\"Chairman, you’ve grown so old...\"\n\n\"Aging, illness, and death are part of the natural order,\" Mao Zedong replied, patting Liu Yalou’s shoulder. Yet, his expression carried a hint of melancholy. \"I’m already in my seventies—if I didn’t look old, wouldn’t that make me some kind of monster?\"\n\nAfter a brief pause, Mao’s voice grew solemn:\n\"Comrade Yalou, please return and relay a message to Comrades Zhou Baozhong and Li Zhaolin. Tell them to trust this old man’s judgment. Over the years, we’ve fought guerrilla warfare across many fronts, and we’ve learned a few things. A Communist guerrilla army must always have a Central Committee and a base area—otherwise, it’s too easy to lose direction. You must make this clear to the other NAJUA comrades, but do not force anyone. After all, the Central Committee has never set foot in the Northeast, and we don’t know the actual situation there.\n\nI have a feeling that some fighters—especially the Koreans—will insist on staying in the east to continue their guerrilla struggle. We must respect their decision.\""
 CPC_main_story_events.110.o: "\"I understand. Please rest assured, Chairman.\""
 CPC_main_story_events.110.tt: "\nDev Note: More stories about §xunderground operatives§! and §Gresistance fighters§! beyond the Northwest will be presented to you in §YVersion 1.2: Castle Kingside§!."
 CPC_main_story_events.111.t: "Indian Issues Seminar"
 CPC_main_story_events.111.d: "Mao Zedong hesitated for a moment before firmly crushing the smoldering cigarette butt in the ashtray. Under the dim, buzzing incandescent light, the other elders in the room remained silent, their gazes fixed on the detailed map of India spread across the table. Stacks of newspapers in multiple languages surrounded them, each presenting different perspectives on India's political developments in recent years.\n\n\"One little flap of their wings, and we’re caught in a storm,\" Mao chuckled wryly. \"This afternoon, the comrades from the Foreign Ministry told me they had combed through years of newspapers from the U.S., Japan, and India. They’ve pieced together a fairly clear picture of what this CPI (Marxist-Leninist) is all about.\"\n\n\"The mainstream Communist Party in India embraced revisionism, choosing to engage in parliamentary struggles within a capitalist government. Some revolutionary fighters were dissatisfied and split off to form the CPI (Maoist), but it turned out that their central general secretary was a Trotskyist. Eventually, this led to the creation of the CPI (Marxist-Leninist), the faction we are dealing with now,\" Mao explained. \"They've established a few rural base areas in northern India, close to Tibet, and it seems they also have some legal front organizations as a political cover. They’ve even managed to win governing power in a few northern states.\"\n\n\"A clever strategy,\" Zhou Enlai remarked approvingly. \"They’re preparing for both possibilities—forming a united front government while also keeping the option of armed struggle open.\" He then paused before continuing, his tone more serious. \"The only problem is… they’re too small.\"\n\nThe room fell into heavy silence. The gap in strength between the CPI (ML) and the legitimate government of India was simply too vast.\n\nSupporting them might entangle the National Defense Front in prolonged conflict on the South Asian subcontinent, potentially exposing China’s revolution to dangers on multiple fronts. But refusing to support them? At this critical moment, when revolutionary movements across Asia needed solidarity, such hesitation might dishearten allies throughout Southeast Asia.\n\nThe cigarette smoke curled and stretched in the light, mirroring the tangled thoughts of the men at the table.\n\nAt last, Mao Zedong seemed to steel himself. He exhaled, tossed the remaining stub of his cigarette into the ashtray, and ground it out before declaring:\n\n\"I think…\""
 CPC_main_story_events.111.o1: "\"The Marxists serves as a hook. Call on them for a secret armistice.\""
 CPC_main_story_events.111.o1_tt: "Available due to the §YIndian§! §RPro-Japanese§! Stance.\nUpon accepting our proposal, §YIndia§! will §GCease To Interfere§! in Chinese internal affairs at the dawning of §xWar of Liberation§!"
 CPC_main_story_events.111.o2: "\"We negotiate with them on trade agreement. The card of CoI(ML) sweetens the deal.\""
 CPC_main_story_events.111.o2_tt: "Available due to the §YIndian§! §GNot Pro-Japanese§! Stance.\nUpon accepting our proposal, §YIndia§! will §GSubsume the Indian Communists§! into a Coalition Government. \nAt the same time, §mOutside Aids§! are made available from §YIndian Routes§!, bringing both of us fortunes of development."
 CPC_main_story_events.111.o3: "\"To Hell with them. The Comradery speaks for itself.\""
 CPC_main_story_events.111.o3_tt: "Availiable unconditioned.\nNo matter how §YIndia§! acts, we shall guide the §GCommunist Party of India(Marxist-Leninist)§! into their own base area to empower their struggle for the §xLiberation of all India§!."
 CPC_main_story_events.112.t: "Reply from India"
 CPC_main_story_events.112.d: "To the Respected Northwest Central Government of the National Defense Front of China and the Central Committee of the Communist Party of China:\n\nWe have received your message and sincerely acknowledge your significant efforts in the struggle for national independence and freedom. On behalf of the [IND.GetName] government, I, [IND.GetLeader], extend my highest regards to you. We are also willing to recognize your government as the sole legitimate government of China in an appropriate diplomatic setting, establish formal diplomatic relations, and express our support for your righteous resistance against Japanese fascism.\n\nWe appreciate your respect for our national sovereignty and internal affairs, as well as your willingness to persuade the CPI (Marxist-Leninist) to engage in our legal political process. Our nation has recently achieved unity, yet we face numerous internal challenges that urgently require reform. We are eager to seize every opportunity for mutual cooperation and foreign investment.\n\nAt present, the United States has established diplomatic relations with our country. If your esteemed government sees fit, we welcome a delegation from your side to Delhi, as we are willing to act as an intermediary to facilitate cooperation between your government and the United States. This would represent a major development opportunity for us as well.\n\nFurthermore, we look forward to formal negotiations with you to determine the political status of the CPI (Marxist-Leninist), as well as to resolve disputes concerning the territorial status of Arunachal Pradesh.\n\nWith my highest regards,\n[IND.GetLeader]\nHead of State of [IND.GetName]"
 CPC_main_story_events.112.o: "Proceed with Eagerness!"
 CPC_main_story_events.112.o_tt: "We will guide §Gthe CPI (Marxist-Leninist)§! to participate in the coalition government.\nAt the same time, we will be able to receive §mexternal aid§! from §YIndia§!, sharing opportunities for development.\n\nDev Note: More §Ydiplomatic maneuvering§! content will be presented in §YVersion 1.2: Castle Kingside§!."
 CPC_main_story_events.113.t: "Reply from India"
 CPC_main_story_events.113.d: "To the Esteemed Central Government of the Chinese National Defense Front and the Central Committee of the Communist Party of China,\n\nWe have received your communication and sincerely acknowledge the significant efforts your government has made in the pursuit of national independence and freedom. On behalf of the [AZH.GetName] government, I, [AZH.GetLeader], extend my highest regards to your administration.\n\nWe appreciate your respect for our nation’s sovereignty and your discernment in not taking the claims of the Communist Party of India (Marxist-Leninist) at face value. Our country has recently achieved unification, yet numerous internal issues urgently require reform. In these times, what we seek most is long-term and genuine peace.\n\nAlthough we remain a member of the military alliance within the Greater East Asia Co-Prosperity Sphere, we are willing to accept your proposal. Should your government launch a unification war, we commit to abstaining from any military actions within the Co-Prosperity Sphere. However, if external pressures from Japan force us into actions that might be detrimental to your interests outside the context of warfare, we hope for your understanding.\n\nAdditionally, we look forward to engaging in secret discussions with your government regarding the political status of the Communist Party of India (Marxist-Leninist), the territorial status of Arunachal Pradesh, and other relevant disputes.\n\nRespectfully,\n[AZH.GetLeader]\nHead of State of [AZH.GetName]"
 CPC_main_story_events.113.o: "A Backhand blow Negated."
 CPC_main_story_events.113.o_tt: "According to the terms of the treaty, when the §xLiberation War§! begins, India will §Grefrain from interfering§! in China's internal affairs.\n\nDev Note: More §Ydiplomatic maneuvering§! content will be presented in §YVersion 1.2: Castle Kingside§!."
 CPC_main_story_events.114.t: "Reply from India"
 CPC_main_story_events.114.d: "To the esteemed members of the Northwest Central Government of the Chinese National Defense Front and the Central Committee of the Communist Party of China:\n\nWe have received your telegram, and we firmly believe that your intention is to interfere in our internal affairs by leveraging the far-left terrorist organization, the Communist Party of India (Marxist-Leninist).\n\nWe hereby express our strong protest—India's domestic issues shall not be subjected to external intervention. We will never yield to your political coercion. Any attempt to exploit our internal matters to force our nation into concessions will be firmly rejected. Our national defense forces are fully prepared to resist any external subversive elements!\n\nWe urge you to abandon any illusions and cease meddling in our internal affairs immediately. Otherwise, we will have no choice but to exercise our legitimate and constitutional national defense rights. Should hostilities arise, the full responsibility will rest solely upon your side!"
 CPC_main_story_events.114.o: "Neither persuasion nor pressure will work—this is a lost cause, beyond saving!"
 CPC_main_story_events.114.o_tt: "We will guide the §GCPI (Marxist-Leninist)§! in establishing a revolutionary base, laying the foundation for the future §xliberation of all India§!.\n\nDev Note: More §Ydiplomatic maneuvering§! content will be presented in §YVersion 1.2: Castle Kingside§!."
 CPC_main_story_events.115.t: "Red Star in Ailao Mountain"
 CPC_main_story_events.115.d: "The Dian-Gui-Qian Border Column grew and expanded through mass struggles, persistently fighting behind enemy lines in the Southwest for many years. Its area of operations spanned across Western Guangxi, Southwestern and Northwestern Guizhou, as well as the entire province of Yunnan. In October 1949, following the outbreak of the Great Northwest Defense War and the rising anger of the Yunnan people against Long Yun's surrender, the people of Southeastern Yunnan launched an armed uprising under the leadership of the Chinese Communist Party in the Western Mountains region, marking the birth of this force.From its inception, the Border Column relied on the local ethnic minorities who had fought against the Japanese as its backbone, successfully crushing the siege of an enemy puppet security regiment and advancing southward. It went through a series of key engagements:The Battle of Machang,The capture of Shizong, A daring crossing of the Panjiang River,The fall of Guangnan County,An advance towards the Yunnan-Vietnam border, A strategic rendezvous with guerrilla forces along the Guangxi-Yunnan frontier for reorganization and training.By March 1950, under the directives of the Southwest Bureau of the CPC, the Guangxi-Yunnan Border Guerrilla Force was merged with various Guizhou and Yunnan guerrilla units, officially forming the People’s Liberation Army Dian-Gui-Qian Border Column. The force was structured into multiple guerrilla brigades and has since undergone significant expansion: Over 10,000 troops in total,\nLiberated more than 10 county capitals, Freed over 100 townships,Gained control over 2 million people, one-fifth of Yunnan’s total population,Established liberated and guerrilla zones covering one-fourth of the province.The high number of civilian firearms in Yunnan and the strong anti-Lu Han sentiment have fostered resilient militia forces, delivering frequent and heavy blows against the enemy. The Lu Han clique, seeing the Border Column as a grave threat, has launched multiple major offensives with counter-revolutionary forces in an attempt to annihilate it. Following the liberation of Sichuan, the Central Committee of the CPC issued an urgent directive to the Southwest Bureau, Yunnan Provincial Committee, and the Border Column, ordering them to: Utilize reinforcements from the Northwest, Sichuan, and Guangdong,Expand guerrilla operations as much as possible,Engage the enemy in mobile warfare where feasible,Compress the operational space of the puppet forces,Encircle and isolate enemy-controlled cities from the countryside,Secure key land and jungle supply routes along the Yunnan-Vietnam and Yunnan-Burma borders. As part of the broader strategy to advance the revolutionary cause in Southeast Asia, the Dian-Gui-Qian Border Column is poised to play a critical role in the next phase of operations."
 CPC_main_story_events.115.o: "A spark on the Yunnan-Guizhou Plateau."
 CPC_main_story_events.115.o_tt: "Dev Note: More storyline and gameplay content regarding the §YDian-Gui-Qian Border Column§! will be presented in §YVersion 1.2: Castle Kingside§!."
 CPC_main_story_events.116.t: "Ordinary day"
 CPC_main_story_events.116.d: "A thin layer of mist still enveloped the Tianshui Armament Factory as dawn broke. Lao Ma pulled back the curtains, seeing the factory’s pathways illuminated by the damp morning light. Sparrows hopped between tree branches, adding to the peaceful and serene atmosphere. The factory had built its own community, and though it wasn’t far from the city, life within the factory compound was self-contained and orderly.\n\nAfter breakfast in the factory’s cafeteria, Lao Ma made his way toward the workshop, ready to begin another workday. Inside, the machines roared as workers, fully equipped in their uniforms, had already begun their tasks. Lao Ma was assigned to the assembly line as a welder—not the most senior position, but still considered a skilled trade with a promising future in the factory. Every day, he and his colleagues followed the production process step by step, their attention fixed on machines and tools. Occasionally, lighthearted banter drifted through the air, breaking the monotony of the work.\n\nDuring the lunch break, the small green park within the factory compound became a place for relaxation. Outdoor fitness equipment was installed, and many workers exercised after their meal, recharging for the afternoon shift. The afternoon workload was slightly lighter than the morning’s, as Lao Ma and his colleagues systematically resolved any issues on the assembly line, gradually approaching the end of their shift. As the sun dipped lower, the rhythmic ticking of the clock edged toward 7 PM—the end of another workday.\n\nWhen the final bell rang, Lao Ma took off his work cap and left the workshop alongside his coworkers, chatting as they walked. Upon arriving at the apartment complex, he looked up at the newly constructed residential buildings, feeling a warmth in his heart. The factory had greatly improved living conditions, with expanding facilities that now included a supply cooperative, a hospital, and a cinema, covering nearly all of the workers' daily needs. The newly built gym and library had also become part of the workers' daily routine. On his way home, Lao Ma stopped by the supply cooperative to buy some fruit before stepping through his front door. His wife was busy cooking in the kitchen, and their son, having returned from the factory’s elementary school, was in the living room working on his homework.\n\nAs workers settled into their homes, the apartment windows lit up one by one, filling the night sky of the factory compound with a constellation of warm lights. Lao Ma enjoyed dinner with his wife and son, occasionally discussing work, sometimes talking about their child's studies and life.\n\nAnother ordinary day had passed, but for Lao Ma, such a simple life felt far happier than the past. Compared to the uncertain liberation of the East or the endless wartime propaganda, nothing mattered more than spending each day peacefully with his family.\n\nThe factory lights twinkled like stars in the night sky, and under their glow, Lao Ma’s life quietly continued."
 CPC_main_story_events.116.o: "The revolution must go on, but so must life."
 CPC_main_story_events.117.t: "Three important things"
 CPC_main_story_events.117.d: "Unlike the past when the department store on Yongxin Road was often deserted, today it was packed with eager shoppers. However, the store clerks had no concerns about inventory shortages, as the City Planning Commission had recently issued a \"Product Distribution\" directive. This ensured that not only were the shelves fully stocked, but the warehouse was also brimming with goods. Xiao Gao, a store clerk, skillfully processed purchases while carefully logging each customer’s shopping card. Meanwhile, customers beamed with excitement—after all, this was a rare shopping opportunity, and everyone was eager to acquire the \"Three Essential Items\"—a bicycle, a radio, and a sewing machine.\nXiao Wang pedaled his newly purchased bicycle to work at the newspaper office. The brand-new 28-inch bicycle, coated in a layer of reddish-brown anti-rust paint, gleamed under the sunlight. The crisp ringing of the bell echoed through the street as he playfully rang it multiple times, even though there was no one ahead—he simply enjoyed the thrill of riding his brand-new bike.\nIn the past, he had to rush to catch the morning bus—and if he missed it, he would be forced to wait a painfully long time for the next one. But now, things were different. With his own bicycle, he no longer had to worry about being late for work, nor did he have to waste time waiting for public transport. Whistling a tune, he rode through the streets, feeling the gentle breeze brushing against his face, while his round-framed glasses reflected the joyful glint in his eyes.\nIn a quiet alley in Chongqing, Grandpa Yang lay back in his reclining chair, reading the newspaper while listening to the radio—a gift from his son-in-law, who worked at a factory. The rich melodies of Sichuan opera traveled through the radio's antenna, accompanied by the crackling sound of static interference.\n\"My home lies within the Red Province, where eight brothers reunite under the Song banner…\"\nThe lyrics of \"Five Terraces Reunion\" flowed out of the speaker, the sound of gongs and drums striking clearly through the radio waves. Grandpa Yang couldn't help but murmur multiple \"Good!\"s—even though he wasn't at the opera house in person, he could vividly imagine the grandeur of the actors on stage, picturing the mesmerizing mask-changing performance of Sichuan opera.\nFolding away his newspaper, he poured himself a pot of hot tea, sipping leisurely while immersing himself in the performance. As he looked at his radio, he thought to himself, My son-in-law is truly impressive, getting me such a fine piece of technology.\n\"One day, I shall claim your life! I shall tear your wings and break your legs! I shall drink your blood to prove my strength!\"\nAs the opera concluded, thunderous applause erupted from the radio. Outside the radio, Grandpa Yang also clapped excitedly, exclaiming how exhilarating the performance was.\n\"Mom, I want a new dress!\" Little Liu whined at her mother once again, fully expecting another rejection.\n\"Alright, I'll make you a new one,\" Mother Liu unexpectedly agreed without hesitation this time.\nCarefully, she measured her daughter's size with a measuring tape, then pulled out a piece of navy blue fabric from the cabinet and began cutting. Once the fabric was ready, Mother Liu sat in front of her husband's newly purchased sewing machine and started stitching the dress together.\nHer foot pressed against the treadle, moving rhythmically, as the sewing needle pierced the fabric, drawing the thread back and forth.\nTwo days later, her daughter proudly wore the brand-new navy blue floral dress to school, her face beaming with joy. Seeing her daughter's happiness, Mother Liu also felt deeply content."
 CPC_main_story_events.117.o: "\"I need one bike too!\""
 CPC_main_story_events.118.t: "New industry for a new society"
 CPC_main_story_events.118.d: "Captain Yao's convoy was transporting small tractors produced in the city, following orders from the leadership to deliver them to the farm by the end of the day. He couldn't help but complain a little—the destination was far, and no matter how much progress had been made, the countryside could never be as comfortable as the city. But orders were orders, and whether he liked it or not, the job had to be done.\nThe trucks rumbled across a bridge, crossing the Wei River, and soon, they arrived at the farm.\n\"This is the countryside?\"\nCaptain Yao lit a cigarette, staring in surprise out the truck window.\nSurrounding the farm were a steel factory, a cement plant, and a fertilizer plant. Though much smaller than the ones in Xi’an, the machinery inside was still easily recognizable.\n\"This sure doesn’t look like the countryside,\" Yao thought.\nAfter unloading the tractors, he handed a cigarette to a nearby farmer who had come to help.\n\"When did you folks build all these factories? And how do you manage electricity for production?\"\nTaking a puff, the farmer replied,\n\"Oh, those? They were built two years ago when our village was turned into a cooperative farm. There's a small iron mine to the south, so we set up a small steel mill. To the north, the river has plenty of high-quality sand, so we built a cement plant. As for the fertilizer plant, well, with so many people working here every day, waste disposal was becoming a problem. Instead of letting it go to waste, we process it into fertilizer—it keeps us healthy and also helps with crop production.\"\nThe farmer led Captain Yao toward the cement plant, pointing to a small power station nearby.\n\"See that? That’s our power source. Engineers from the city came to help us build it. We buy coal from a nearby mine, which fuels the steam engines that drive the generators. We could use diesel engines, but that’d be wasteful—tractors need fuel too, you know.\"\n\"What do you do with all the steel you produce? Surely you don’t need that much just for farm tools?\"\nThe farmer exhaled a puff of smoke before answering:\n\"We send it to the city. The big steel factories there focus on making weapons, so they don’t have time for everyday goods. Most of the iron for civilian use actually comes from small factories like ours.\"\nCaptain Yao took in the scene before him. Factories in rural villages? That was something he hadn’t seen before.\nFrom a nearby school, the sound of children reading aloud in unison drifted through the air. A young man wearing glasses stood at the blackboard, teaching them how to read and write.\n\"A 'sent-down youth'?\" Yao thought.\n\"I see plenty of people my age in the village,\" Yao remarked, turning back to the farmer. \"Where are all the younger ones, like that teacher over there?\"\n\"A lot of them have gone to work in the city,\" the farmer explained. \"Mainly in construction—digging tunnels and putting up buildings. It doesn’t pay much, but at least they get free meals in the city.\"\nCaptain Yao nodded in agreement. He had indeed seen many young construction workers in Xi’an, especially digging air-raid shelters.\n\"I really should get out more,\" Yao thought to himself. \"Otherwise, I might just end up a frog at the bottom of a well.\""
 CPC_main_story_events.118.o: "Cities and rural areas are moving forward together."
 CPC_main_story_events.119.t: "Fire"
 CPC_main_story_events.119.d: "Lao Wu is an old worker at the chemical factory, and the materials allocated by the factory have become a stabilizing factor in his life. At the beginning of each month, the factory's supply station distributes essential goods such as rice, flour, cloth, and coal to everyone based on their \"work seniority\" and family size. Lao Wu’s family, consisting of five members, can receive 20 pounds of flour, 10 pounds of coal, and one roll of coarse cloth every time. The factory’s union also issues limited meat and oil coupons for each family, allowing Lao Wu’s family to enjoy a few meals with oil each month.\n\nAt the beginning of the month, Lao Wu, as usual, takes his material coupons and stands in the long line at the supply station. The people in front of him are all familiar faces, chatting and complaining about the cold weather, but their voices are full of satisfaction at the thought of receiving their goods. Lao Wu thinks to himself that, despite the tough conditions, life is still manageable with the support of the factory. While waiting in line, he strikes up a conversation with Lao Li beside him. Lao Li mentions that coal mining and transportation haven't been going smoothly recently, so the coal supply may be reduced this time. Lao Wu sighs but remains calm, continuing to wait patiently in line, reassured that the factory will take care of them.\n\nFinally, it’s his turn. Lao Wu hands his coal coupon to Xiao Liu at the counter. Xiao Liu weighs the coal and hands him a small bag of coal chunks, smiling as he says, \"Master Wu, there’s a little less coal today. We’ll have to conserve it, but you can come back in a few days for more.\" Lao Wu nods, takes the bag, and places the coal on his shoulder. Next is the cloth coupon. He plans to save this cloth to make a thick cotton jacket for his youngest son next month. This year, clothes for the children are scarce, and the factory has already sent out an initiative encouraging everyone to make cotton clothes themselves.\n\nWhen Lao Wu returns home, he pours the coal into the coal bin. His wife is already heating water on the stove, and the room warms up a little. She takes out the cloth coupon book and looks at the few cloth coupons she has saved. \"Let’s save up for two more months, and we’ll make new clothes for the children. Then they won’t be cold,\" she says. Lao Wu smiles and hands her the coarse cloth they received today. \"Let’s save a little more. The factory provides for us every month,\" he says.\n\nAt dinner, his wife steamed two white steamed buns and added a little oil to the cabbage left over from lunch, stewing it. Though simple, Lao Wu enjoys the meal. As they eat, the children complain about the cold. Lao Wu comforts them, saying, \"Be patient, the factory is applying for extra coal for us. We’ll be able to burn more fire soon.\" The children nod and stop their complaints.\n\nAfter dinner, Lao Wu stokes the fire in the coal stove and gathers his two sons around the table to study. The children are focused and attentive. The flames in the stove flicker, warming this small family of five."
 CPC_main_story_events.119.o: "In a few days, the fire in the stove will burn even brighter."
 CPC_main_story_events.120.t: "NO TIME"
 CPC_main_story_events.120.d: "Sheng Shicai hid in a bunker in Dihua, the sounds of gunfire outside gradually fading, replaced by the sound of footsteps pacing back and forth. \"There's an iron door here!\" said a voice from outside. Before long, the iron door was opened, and the Communist soldiers found Sheng Shicai hiding inside. \"General, we've found him!\" one soldier said. Sheng Shicai saw a long-time adversary approach, someone he hadn't seen for a while. The newcomer, like him, was no longer young, his face marked with white hair—it was Ma Zhongying.\n\n\"Long time no see, Sheng Shicai,\" Ma Zhongying said. \"Have you ever thought that, in the end, you’d fall into my hands?\"\n\nSheng Shicai did not answer this question. Instead, he asked Ma Zhongying for a match and a cigarette. Ma Zhongying handed him his cigarette case. Sheng Shicai took a cigarette, lit it, took a deep drag, and with a bitter smile, said to Ma Zhongying, \"Zhongying, after this Dihua city, it's yours. I advise you, cooperating with the Communists will not end well, I am an example!\" Sheng Shicai extinguished the cigarette, surrendering himself.\n\nIn the meeting room in Xi'an, the central leadership was overjoyed upon hearing the news of Sheng Shicai's capture, and immediately sent an order to the Xinjiang authorities to escort him to Xi'an. \"Finally, we’ve caught this old fox,\" Chen Yi said happily. \"We can avenge our fallen comrades!\" Mao Zedong's eyes also sparkled with joy; the long-awaited justice had finally arrived, and the burden on his heart was lifted.\n\nA few days later, Sheng Shicai was brought to Xi'an for trial. The trial was a public one, with microphones in front of the judge, prosecutor, and defendant so that the proceedings could be broadcast live. Aside from some minor details, Sheng Shicai did not deny his actions. He admitted all his crimes, calmly awaiting the court's judgment. Ultimately, the Xi'an People's Court found Sheng Shicai guilty of counter-revolutionary crimes, murder, and several other charges, sentencing him to death. Sheng Shicai raised no objections, stating that the court's verdict was just. He slowly left the court, awaiting his execution day.\n\nOn the day of the execution, out of humanitarian concern, the prison allowed Sheng Shicai to choose his last meal. He only ordered a baked flatbread. When the guard asked if he wanted anything else, Sheng Shicai replied, \"No, I've eaten enough in my life; I'm not missing anything now.\" After finishing the flatbread, Sheng Shicai was taken to an open area, a hood placed over his head. Through the slits in the fabric, he faintly saw the executioner slowly raise his gun. \"Bang!\" The sound of a gunshot rang out, and the warlord who had ruled Xinjiang for thirty years was removed from the stage of history."
 CPC_main_story_events.120.o: "The gentleman takes revenge, even if it takes ten years."
 CPC_main_story_events.121.t: "Turned over"
 CPC_main_story_events.121.d: "At dawn, the army horses lazily swished their tails, their energy drained. After breakfast, the regiment headquarters convened a \"Denunciation Meeting\" aimed at educating the newly reorganized liberated soldiers. The so-called liberated soldiers strolled in sluggishly in small groups, murmuring among themselves with an air of indifference. Suddenly, the canvas on the stage was pulled aside, revealing bold, striking characters:\n\n\"Denounce the Old Society! Denounce the Old Army! Denounce the Old Officers!\"\n\nAside from Commissar Li, who presided over the meeting, the stage was occupied only by the dejected former officers of the Nationalist Army, standing with bowed heads, awaiting judgment. In the crowd below, the liberated soldiers stared at their former superiors, their eyes still carrying traces of fear.\n\nClearing his throat, Commissar Li stepped forward and spoke in a commanding voice:\n\n\"Today’s denunciation is not just for the sake of it—it’s to help you understand the root of suffering for the poor and for soldiers. It is to make clear who the People's Liberation Army fights for, and who we carry our guns for! Some of you may think, ‘What does a Communist know about the hardships of the old army?’ Well, I came from the old army myself. When I was in military school, the instructors didn’t just curse at us—they beat us mercilessly and shouted, ‘Soldiers are made through punishment!’ Most of you here were living on the edge of survival, with no future ahead of you. You put on that yellow uniform out of sheer desperation!\"\n\nAs his words settled over the crowd, the atmosphere began to shift. The liberated soldiers, once hesitant, now found themselves drawn into deep thought.\n\n“I’ll speak!”\n\nA young man stepped up to the stage, his voice thick with a Hunan accent.\n\n“My family has been laboring under landlords for nine generations. My father was killed by traitors for joining a peasant movement. My mother… she was violated by the landlord and took her own life. The rest of my family starved to death. I was the only one left. Then the village head forced me to serve as a conscript in place of a landlord's son. They tied me up and dragged me to Sichuan.\n\nOn the way, a few of my fellow villagers fell sick from the harsh conditions. And what did the officers do? They simply cut their ropes and beat them to death on the roadside.\"\n\nHis voice grew sharper as he turned to point an accusing finger at one of the Nationalist officers.\n\n\"This one—‘Madman He’—he’s a real devil. If we didn’t march in perfect step, he made the whole company kneel. If we missed a shot in training, he’d whip us raw. Just six months ago, Little Dong couldn’t take it anymore and tried to run away. They caught him, stripped him naked, tied him to a post, and let every soldier stab him once—until he bled out!\"\n\nTears streamed down the young man’s face, his long-buried anguish breaking through in uncontrollable sobs.\n\nOne after another, cries of grief and rage spread through the crowd, igniting a roaring fire of resentment. The weight of years of oppression, the humiliation of being treated worse than cattle, all erupted in a collective wail that sent shivers down the spines of the trembling officers on stage.\n\nAfter the meeting, the young man sought out Commissar Li.\n\n\"Commissar, I want to join the Liberation Army. I want to help the poor,\" he said firmly.\n\nCommissar Li smiled.\n\n\"You did well up there, comrade. What’s your name?\""
 CPC_main_story_events.121.o: "\"My name is Lei Zhengxing!\""
 CPC_main_story_events.122.t: "Glory duty"
 CPC_main_story_events.122.d: "On Hill 326, entire rows of trees had been blasted into twisted, broken remnants. Lei Zhengxing—now known as Lei Feng—had changed his name upon entering military school, determined to be a vanguard for the Party and the people. After graduation, his first mission was to support operations in Burma, aiding in the crackdown on drug traffickers and guerrilla remnants of the puppet army.\n\nJust moments ago, Lei Feng had led two squads in a daring nighttime assault to reclaim Hill 326. But before they could even settle in, the enemy launched a counterattack, determined to seize the position. Dividing his remaining comrades into two fire teams, Lei Feng repelled wave after wave of enemy assaults. Darkness loomed, bullets whistled through the air, and one by one, his comrades fell. In the end, he realized he was the only one left.\n\nOut of bullets, out of grenades, Lei Feng fixed a bayonet to his rifle, steeling himself for a last stand in brutal hand-to-hand combat. Just then, an artillery shell screamed through the air, obliterating the remaining enemy troops in a deafening explosion. The blast wave sent Lei Feng sprawling into the dirt, unconscious.\n\nWhen he awoke, he found himself in a hospital bed, his body riddled with gunshot wounds. Despite his injuries, he immediately pleaded with the doctors to let him return to his unit. The hospital leadership refused outright:\n\n\"Absolutely not! You're covered in wounds. If you go back, you'll only be a burden to the troops. You need to transfer out of active duty.\"\n\nLei Feng, having miraculously survived, was tormented by thoughts of his fallen comrades. But even more than that, he longed to reunite with his fellow soldiers. No doctor’s orders could hold him back.\n\nA month later, once he could walk again, he went to the local office, hoping to hitch a ride back to his unit. But transportation wasn’t their responsibility—they could provide food and lodging, but not a way back. Left with no other option, Lei Feng took matters into his own hands.\n\nEvery day after meals, he roamed the main roads, stopping every passing vehicle to ask, \"Are you with the 3rd Division, 5th Regiment?\" His persistence paid off. Within a few days, he finally found a supply truck delivering uniforms for the 3rd Division. Without hesitation, Lei Feng climbed aboard, riding back to his unit.\n\nWhen he arrived, the division and regiment leaders were overjoyed. Gripping his hands tightly, they exclaimed:\n\n\"Lei Feng, we thought you were done for! You were so badly wounded—many of the officers and soldiers even wept for you. We never imagined you'd return. Incredible!\"\n\nIt was only then that Lei Feng learned he had single-handedly eliminated dozens of enemy troops and held the line until reinforcements arrived.\n\nA few days later, he was awarded the First-Class Combat Hero Medal by the central government. Six months later, as his health improved, he was personally received by central leadership and honored with the August 1st Medal.\n\nThough the accolades and recognition were immense, they weren’t what Lei Feng truly desired. In his diary, he repeatedly swore an oath to avenge the fallen comrades who had sacrificed their lives for his rescue:\n\n\"I must return to my unit. I will dedicate everything I have to the revolution, take down more enemy traitors, and seek justice for the countless fallen class brothers!\"\n\nUnable to withstand Lei Feng’s relentless determination, the division commander finally called him in:\n\n\"You keep pestering us to assign you a post, right? Well, the division headquarters needs a staff officer. Do you think you’re up for it?\""
 CPC_main_story_events.122.o: "\"Of course!\""
 CPC_main_story_events.123.t: "Glory choose"
 CPC_main_story_events.123.d: "In the People's Liberation Army, grassroots instructors have always been the vanguard of expanding the revolutionary ranks. Lei Feng, formerly Lei Zhengxing, had now become one of the most outstanding among them. After enlisting in the army and joining the Party, he was assigned to the 148th Division, 9th Regiment of the PLA, serving as the instructor for the 3rd Battalion’s machine gun company. During the ideological reform campaign, he consistently guided soldiers’ resentment toward the old system, earning him widespread praise from officers and enlisted men alike.\n\nOne day, the division and regiment political commissars summoned Lei Feng, informing him that he would be reassigned in an exchange with Instructor Wang of the 8th Company.\n\n\"The 8th Company’s denunciation campaign hasn’t been effective. Just two days ago, a group of their soldiers came to the regiment headquarters, demanding that their former company commander, Hong, be brought back to the unit for a public struggle session,\" the regimental commissar explained.\n\nThe divisional commissar, a seasoned political officer, analyzed the issue further: \"The 8th Company’s denunciation campaign failed to direct the soldiers’ hatred toward the old warlord system. When you arrive, you’ll need to restart parts of the movement and ensure that the focus is placed on the root of the problem.\"\n\nAs soon as Lei Feng arrived at the 8th Company, he was surrounded by soldiers, each voicing their grievances. Looking into their eyes, Lei Feng saw his own past self—the same frustration and bitterness, the same burning hatred for those who had directly oppressed them. He understood that this resentment had been ignited by the denunciation campaign, and rather than suppressing it, he needed to channel it constructively. He set aside other matters and began his work on their ideological reeducation.\n\n\"Was Hong the only officer in the old army who exploited and brutalized soldiers?\" he asked.\n\n\"Of course not!\" the soldiers shouted almost in unison.\n\n\"Then let me ask you—if any of you had risen to the rank of officer in the old army, would you have refrained from beating soldiers and embezzling rations?\"\n\nAt this, the soldiers fell silent.\n\nLei Feng did not press the question further. Instead, he patiently continued: \"All of us—including myself—have suffered because of the old system. As long as that system remained in place, higher ranks would always oppress the lower ones. If it wasn’t Commander Hong, it would have been Commander Zhang or Commander Li. If the old system persisted, many of the oppressed soldiers—if they ever managed to climb the ranks—might very well become the very 'Commander Hongs' they despise today. We denounce the old army not for personal revenge but to condemn the old social and military systems that enabled such oppression.\"\n\nMost of the soldiers began to calm down, but a few remained unconvinced.\n\n\"So you’re saying he bears no responsibility at all?\" one of them challenged.\n\n\"No!\" Lei Feng responded firmly. \"He is absolutely responsible, but the Communist Party has policies. Dealing with him harshly would not only fail to contribute to national liberation but could also have serious negative consequences. If we start persecuting officers who surrender, who will dare to defect to our side in the future? You must trust the Party to educate him, and you must believe that Commander Hong himself will come to acknowledge his mistakes and reform his thinking. As for his future, that will depend on his actions. But I dare say that if he returns after reeducation, he will not be the same Commander Hong as before.\"\n\nWith that, the soldiers finally relented, and the small crisis was peacefully resolved."
 CPC_main_story_events.123.o: "A transformation of heart and mind, a complete rebirth."
 #CPC_main_story_events.124.t: "Letter from the north"
 #CPC_main_story_events.124.d: "Almaty, the largest city in Kazakhstan, gleamed like a pearl at the foot of the Tian Shan mountains. A thin veil of mist draped over the peaks, lending an ethereal beauty to the landscape. Sunlight cascaded onto the snow-covered summits, reflecting dazzling brilliance, as if painting a masterpiece upon the heavens.\n\nInside an office building, Sergei finished organizing the military paperwork and began drafting a new training schedule. Suddenly, a series of hurried knocks echoed through the room.\n\n\"Come in!\" Sergei called out, his eyes still fixed on the documents before him.\n\nA young Kazakh man slipped through the door—it was Amir, a close friend. A wide grin spread across Amir’s face as he held up a newspaper.\n\n\"Sergei, take a look at today's headline!\" he said, handing over the paper.\n\nSergei took it with a hint of curiosity. Yet the moment he saw the bold and unmistakable headline, he immediately grasped its significance—at least for him.\n\n\"The CPC Unifies Xinjiang.\"\n\nSergei set aside his work without hesitation and penned a letter, entrusting someone to send it via telegram or courier. His words, carried by electric pulses and galloping hooves, traversed the Tian Shan, crossed the desert, and passed through Turpan.\n\nTwo weeks later, a reply lay on his desk. Inside the envelope, two sheets of paper—one in familiar yet distant Chinese, the other a Russian translation. His heart pounded as he picked up the Russian text and saw the sender’s name.\n\n\"To my dear son,\n\nThese words find you as if face-to-face. As I put pen to paper, countless emotions flood my mind, and I hardly know where to begin. It has been twenty years since our parting, and my heart has never ceased to worry for you, day and night. Now, upon hearing that you are safe and well, I feel a great weight lifted from my chest. Though mountains and rivers separate us, let this letter bridge the longing and distance that have stretched between us for so long.\n\nTwenty years have passed—once a young man, you have now reached maturity, bearing the scars of time. War and turmoil have cast a long shadow over both our country and our fates. The collapse of the Soviet Union left you adrift in Kazakhstan, and for so long, I had no word of your whereabouts. Now, at last, I receive your letter and learn of your resilience—how you have faced hardship alone in a foreign land, persevering through toil and determination. This, above all, brings me great comfort.\n\nThough Xinjiang has been liberated, the revolution is not yet complete. Countless comrades still sweat and strive for the cause. You have spent many years abroad and must have gained much experience and insight. Yet the world remains uncertain—please take good care of your younger siblings and look after Mother He. When the day comes that our country is fully united, we shall speak of your return.\n\nTake care of yourself, do not let the years wear you down. If fate allows, when the time is right, I will be here, waiting for our reunion.\n\nThe Long March was arduous, but even the longest journey must one day reach its end. Our family will meet again, of that I have no doubt.\""
 #CPC_main_story_events.124.o: "Signed by: Mao Zedong"
 CPC_main_story_events.125.t: "The Wanderer Returns Home"
 CPC_main_story_events.125.d: "The somber tone of the Emperor's surrender and the triumphant cheers of the Chinese people once again echoed across the globe via radio waves—from Dublin to Magadan, from Anchorage to Patagonia. This resounding message also reached Almaty, where it found its way into the study of Sergei—better known as Mao Anying.\n\nThe solemn yet resolute voice of He Ping proclaimed the establishment of a new China, his words reverberating through the room, filling the hearts of those inside—Mao Anying, Mao Anqing, and He Zizhen—with both joy and sorrow. Joy, for their long-held dream of a liberated China had finally come true, and the people had taken charge of their own destiny. Sorrow, for they had already learned through news broadcasts that Mao Zedong had passed away.\n\nTaking a deep breath, Mao Anying stood up and declared, \"Anqing, Mama He, I will write to the leadership immediately—it is time to go home!\"\n\nWithin half a day, official approval for their return was delivered to their home. The Kyzyl messenger who handed over the letter bore a bright smile, presenting another document alongside it: \"This is a letter from the Central Committee to the Communist Party of China. Comrade Sergei, please ensure that it reaches them. And my dear Chinese friend, my wandering comrade, I bid you farewell—it is time to go home.\"\n\nMao Anying grasped his friend’s hand tightly, his voice filled with gratitude and anticipation: \"This is not farewell forever. We will meet again!\"\n\nAs preparations for their journey home commenced, Mao Anqing packed their belongings while Mao Anying made his rounds, bidding farewell to comrades in the Party and the military.\n\n\"Keep in touch when you get back!\"\n\"Send us pictures of China!\"\n\"Give our regards to our Chinese comrades!\"\n\nThe Kazakh comrades, while celebrating Mao Anying’s return, expressed heartfelt farewells. After days of preparation, Mao Anying, along with his family, finally embarked on their journey home.\n\nUpon their arrival in Xi’an, news of their return had already reached the top leadership of the CPC, who had assembled outside the city to welcome them. As Mao Anying made his way through the crowd, he shook hands with the Party’s senior officials one by one.\n\nWith a deep sigh, he reflected, \"I already know about my father… But knowing that he lived to witness the founding of New China brings comfort—it is a greater blessing than the sorrow of our missed reunion.\"\n\nHis gaze lifted toward the city, and he added, \"I heard a statue of my father now stands in the heart of Xi’an…\""
 CPC_main_story_events.125.o: "\"…Once I settle in, I want to go see it immediately.\""
 CPC_main_story_events.126.t: "\"Old Friend.\""
 CPC_main_story_events.126.d: "The sweltering heat of New Delhi often left the locals dazed, their minds dulled by the oppressive sun. But to Chiang Ching-kuo, it was like a bitter tonic—one that only sharpened his senses with each passing day. The scorching weather constantly reminded him of Chongqing, of the days long gone—and of the homeland now burning beneath the rising sun.\n\nHe could still recall that final, humiliating chapter of the Chongqing government. Swept along by the tide of history, he had been nothing more than a drifting leaf. On that fateful escape flight, he had cast one last desperate glance at his motherland: a land battered by storms, its mountains and rivers in ruins, its once-proud Blue Sky and White Sun now sullied and shrouded in betrayal. And he, too, had been forced into exile, with no promise of return.\n\nAfter the war, the Americans had taken in these exiled remnants of the Kuomintang and, using them as a foundation, had established the so-called 'Provisional Government of the Republic of China' on their own soil. This recognition became the last lifeline for the Nationalists. Under U.S. direction, and in the name of Sun Fo as its nominal chairman—but with Soong Mei-ling truly pulling the strings—\"Free China\" was thus reborn.\n\nHad his father still been alive, would the Party and the nation have fallen to such depths? It was a question Chiang Ching-kuo no longer had the heart to ponder.\n\nEager to escape his mother’s ceaseless instructions, he had volunteered to join 'Minister of National Defense' Sun Li-jen in the Republic of India, where they worked to rebuild the Nationalist resistance. Their efforts bore fruit, thanks to Japan’s relentless greed and oppression. Over the years, more and more resistance fighters from occupied territories had joined their cause—patriotic youths, former loyalists of Chiang Kai-shek’s government, and military intelligence officers. Even within the puppet Nanjing regime and the warlord cliques, defectors emerged, eager to turn against their overlords.\n\nThis clandestine army, sworn to his command, was christened the 'Three Principles of the People Restoration Army'—the Sanminzhuyi Revival Army. They waited in the shadows, ever prepared to heed the call of the central leadership, to cleanse the Blue Sky and White Sun of its defilement, and to restore the rightful brilliance of the Three Principles of the People across China.\n\nAnd yet, old adversaries still remained.\n\nSeated across from him was one such figure—an old Communist, none other than Chen Yi.\n\n\"No need for formalities—I’m a soldier, not a diplomat,’ Chen said, leaning forward. ‘Chiang, it’s been a long time.\""
 CPC_main_story_events.126.o: "Old friend, new story."
 CPC_main_story_events.126.o_tt: "§m£GNG_chinese_nation_texticon KMT remnants§! exiled to oversea shall return to the Chinese Revolution in their unique fare in the §YUpdate 1.2§!."
 CPC_main_story_events.127.t: "Beneath the Millennial Tianshan"
 CPC_main_story_events.127.d: "This is a cold year, as cold as the winters of the past. But from a certain day onward, lights have been lit in this long night, accompanying those who have traveled thousands of miles to these mountains, welcoming the falling snow as they contribute to opening the road that will connect Xinjiang with the frontlines.\n\nChu Jialiang awoke from his sleep. He had just dreamt of countless vehicles passing over the very road he was helping to build. As he shook off sleep, he grabbed his cotton hat, muttered something about how much longer it would take, then wrapped himself in his thick coat and stepped outside.\n\nDawn was approaching, but everything still carried a grayish-blue hue. The water left outside his lodging hadn’t frozen over. He dipped his hand into the worn-out metal basin, grimacing at the icy sting as he splashed water onto his face.\n\nCrunch, crunch, crunch.\nOn the construction site, many workers were chewing on dry rations while swinging their pickaxes, digging small holes into the frozen soil. Jialiang, along with his comrades, worked until their bodies flushed warm from the exertion.\n\n\"Jialiang, what do you think we’ll have for lunch today?\"\n\"I don’t know. If you’re hungry, go hunt some fish or game from the lake or the woods—let the site have a proper meal for once.\"\n\nThough Jialiang spoke casually, he still turned to ask the lean-faced party secretary, not just about the food, but about whether his dream would come true.\n\nThe secretary simply called back, \"Lay down three more miles of road today, and I promise you’ll have hot food and warm wine.\"\nSome of the resting workers cheered in response before picking up their tools and returning to the front lines of labor.\n\nThe news had already arrived. Once this road was completed, convoys would immediately begin rolling into Xinjiang. Among the passengers would be soldiers, teachers, doctors, workers, and party cadres. They would bring stability and prosperity to the people of Xinjiang, paving the way for a brighter and more secure future."
 CPC_main_story_events.127.o: "For the people, let’s get over it."
 CPC_main_story_events.128.t: "Premier"
 CPC_main_story_events.128.d: "\"Just sit down directly, my legs aren't in great shape now, so I won't stand up.\"\nMao Zedong, who had always refused to acknowledge his old age, spoke unusually this time upon seeing Deng Xiaoping enter. \"How is Enlai now?\"\nDeng Xiaoping shook his head and replied, \"Overworked and exhausted. The doctors say the outlook isn't very good.\"\n\nFor a moment, silence filled the room. Mao fumbled around his body, searching for his cigarette case—only to recall that his secretary had hidden it long ago. He could only mock himself, \"Everyone thinks I’m too old now, and some believe I should step down quickly. But in my view, whether it's Liu Shaoqi, Lin Biao, Gao Gang, Bo Yibo, or Xi Zhongxun—they all lack that final touch.\"\n\nMao's sudden self-deprecation and his blunt assessment of other senior officials left Deng momentarily unsure of how to respond. He could only nod in agreement. Mao continued speaking, seemingly out of nowhere:\n\n\"In our current ranks, we certainly don’t have someone like Yan Song—a corrupt careerist who exploits the people—but we do have many officials resembling Xu Jie or Gao Gong.\"\n\nDeng acknowledged his words while inwardly wondering why Mao had suddenly brought up figures from the Ming Dynasty.\n\n\"Xu Jie was pragmatic and highly capable, but he was also greedy and merely served as a facade for the imperial court. 'He who does not plan for the whole will not succeed in a single part'—a government led by such a man would eventually collapse. Gao Gong, on the other hand, was eager for reform but too headstrong; he offended nearly all his colleagues and was ultimately dismissed. He had ability but lacked the political finesse to unite others and implement policies effectively.\"\n\nMao drew these two examples from Ming Dynasty history and pointed out their flaws.\n\n\"Our Party is, of course, far better than those landlords and bureaucrats—much cleaner and more disciplined. But many of our comrades either merely follow orders and keep the Party machinery running, like Xu Jie, or are too rigid and fail to unite people, like Gao Gong. Neither type is suitable to lead the revolution ahead or the future construction of the country.\"\n\nHearing these words, Deng Xiaoping was startled. Mao had never before so openly expressed his concerns about succession.\n\nDeng did not dare to speculate on whom Mao truly favored. Instead, he took a sip of tea and carefully asked, \"Then who does the Chairman suggest should lead the work ahead?\"\n\nMao, noticing Deng’s cautious inquiry, answered directly:\n\n\"To be honest, I don’t feel at ease handing things over to anyone else. A single directive from the Party, once passed down a couple of levels, gets distorted—wasn't that exactly what happened during the Great Leap Forward?\"\n\nDeng was secretly taken aback—Mao had never been so frank before.\n\n\"What our Party needs is a Zhang Juzheng—someone who can follow the established policies but also solve new problems and unite the majority.\"\n\nMao finally revealed the type of leader he sought and looked directly at Deng Xiaoping.\n\n\"Our Party, from now and forever, will function through collective decision-making. We have theorists like Zhang Chunqiao and Han Guang. In the provinces, we've also had many excellent cadres over the years—like Liu and Ji. But at the Central level, I only care about one thing—the Zhang Juzheng I just mentioned.\"\n\nSeeing Mao's solemn expression, Deng Xiaoping instinctively straightened his posture. \"The heavens are preparing a great task for this man.\" He was certain that Mao was about to announce something of great importance.\n\nMao handed Deng a volume of Ming history and a volume of Song history, saying:"
 CPC_main_story_events.128.o: "\"——I think you are more suitable.\""
 CPC_main_story_events.129.t: "Military Commission Meeting"
 CPC_main_story_events.129.d: "Lin Biao sat at the head of the table, looking at the generals on both sides. Many of them had commanded battles since the Red Army days, some even legendary figures with distinguished military achievements.\n\n\"This is a difficult matter,\" Lin Biao muttered under his breath. He glanced at the red-stamped document in his hands, contemplating how to persuade his comrades in front of him.\n\n\"Vice Chairman Lin, let’s begin.\" Seeing that Lin Biao had yet to speak, He Long, known for his straightforwardness, took the lead. The other generals nodded in agreement. Seeing their urging, Lin Biao seized the opportunity and said, \"In response to the Party Central Committee’s directive on cadre rejuvenation, our People's Liberation Army leadership must also undergo a process of rejuvenation. This means that some comrades here will need to retire.\"\n\nAs soon as the word \"retirement\" was spoken, the conference room erupted in an uproar:\n\n\"If we start implementing retirement in the PLA, it will disrupt normal command structures.\"\n\"What age group are we talking about for retirement? How large is the personnel gap?\"\n\"Our military is different from other departments. In civilian roles, younger people can take on more responsibilities with experience, but to be a general, one must have commanded a proper battle at scale!\"\n\nVoices clashed as the room buzzed with objections. Except for a few relatively younger officers, most opposed the Party's directive.\n\n\"When I became commander of the 4th Red Army, I was only 23. Young people are not incapable,\" Lin Biao said, using himself as an example to ease the tension. \"Many of you also went to the battlefield at a young age. Young people have drive and energy.\"\n\nDespite his words, many still refused to accept it, offering numerous reasons why they could not retire. Growing impatient, Lin Biao snapped, \"This is an order from the Party Central Committee, not my personal decision! If you have complaints, take them to the Central Committee! The Party commands the gun, and we, the People's Liberation Army, must obey all orders from the Central Committee!\"\n\nSuddenly, Peng Dehuai interjected, \"Then what about you, Lin Biao? Are you retiring?\"\n\n\"You’re only slightly younger than us. Many of us are still in good health, no worse than you.\"\n\nLin Biao countered, \"Whether I retire or not is up to the Central Committee to decide. If the Central Committee orders me to step down, I will naturally obey.\"\n\nTo prevent further pushback from the veteran commanders, Lin Biao decisively made a decision:"
 CPC_main_story_events.129.o: "\"Fine, dismiss!\""
 CPC_main_story_events.130.t: "Night meeting"
 CPC_main_story_events.130.d: "\nThe moon hung high in the night sky as Lin Biao invited He Long to his home for a late-night conversation. The two sat together, smoking as they talked about work.\n\nSuddenly, Lin Biao reached into a drawer and took out a box of tobacco. “Commander He, this is some tobacco I bought a while ago. But I rarely use a pipe to smoke. I see you often do, so I’d like to give this to you.”\n\nHe Long, sensing the odd atmosphere, didn’t take the tobacco. Instead, he asked, “You wouldn’t have called me here in the middle of the night just to talk about work and give me tobacco. Say it—what’s really going on?”\n\nLin Biao handed He Long a letter. As He Long unfolded it, the bold and flowing handwriting immediately told him it was from Chairman Mao. As he read, his expression shifted from confusion to sadness, then to anger. He demanded, “What did you say to Chairman Mao? Have you been whispering in his ear every day, telling him that I, Peng Dehuai, and the other old comrades are useless? And now you’re telling me to take the initiative to request retirement—what is this supposed to mean?”\n\n“It’s not me asking you to step down—it’s Chairman Mao,” Lin Biao corrected him. “This is the decision of Chairman Mao and the Central Committee, not mine. I hope you can understand.”\n\nHe Long stood up abruptly, his emotions surging. “You’re part of the Central Committee too, Lin Biao! You’re even the Vice Chairman of the Military Commission—how could your opinion not matter? I may be old, but I am not useless! What, are you trying to promote your young protégés in the military, control the Military Commission, and become the next Chiang Kai-shek?”\n\nHearing such an accusation, Lin Biao also stood up, his expression stern. “Comrade He Long, mind your words. Every promotion list was proposed by the Military Commission and approved by the Central Committee. Every vetting and assessment followed proper procedures. You have no right to portray the People's Liberation Army—our democratic army—as some personal force like Chiang Kai-shek's private army. If you are dissatisfied with the Central Committee's decision, you should appeal to them directly instead of slandering the People's Army.”\n\nHe Long sneered, his voice filled with bitterness. “I see, I see... You’re just handling things to serve your own goals. As long as you push all us old guys out, your future will be smooth sailing.” His hands trembled with a mix of helplessness and anger as he pulled out a piece of paper and a pen. “Fine. Chairman Mao’s orders—I will follow them.” He quickly wrote his resignation letter and handed it to Lin Biao.\n\nLin Biao once again extended the box of tobacco to He Long.\n\nHe Long waved it away. “Comrade Lin Biao, I hope you understand—being at the top is a lonely place, especially at the top of the Party. Keep the tobacco for yourself. You’ll surely smoke it someday. I’ll be waiting at the convalescent home to see how you burn through this box.”\n\nLin Biao nodded, and from his throat, he forced out a word:"
 CPC_main_story_events.130.o: "\"Thank you, He.\""
 CPC_main_story_events.131.t: "Acting career"
 CPC_main_story_events.131.d: "If Hollywood across the ocean ever had the chance to learn about these people’s stories, film history would likely feature a classic spy movie set in China’s Hainan. But for Pan Jianghan, decades of espionage work could simply be summarized as \"life\" in this place.\n\n\"Old Pan! Old Pan!\" A voice called from outside, cutting through the stormy night with clarity. Moments later, a middle-aged man, about the same age as Pan Jianghan, stepped in. \"Feng Shu—uh, I mean, Mr. Li’s notice has arrived. In half a month, a group of tourists from Japan will be arriving, and it’s our Haikou New District’s responsibility to host them.\"\n\nHere we go again. Every three months or so, another batch of Japanese visitors arrived—wealthy socialites from Tokyo, well-dressed politicians, or high-ranking colonial officials from Southeast Asia...\n\n\"Director Liu, from now on, you can’t call me Old Pan—you have to call me County Chief Zheng! And stop calling Feng Shuji by his old title—he's Mr. Li now.\" Pan Jianghan looked at Zhang Shiying—an old comrade, now past forty, but still lacking discretion.\n\n\"I can’t get used to it,\" Zhang sighed. \"Back when we were fighting guerrilla battles in the mountains, who would have thought things would turn out like this? Now, every so often, we have to bow and smile at those devils, even learn to speak their damn language.\"\n\nThe storm had raged for two days, but Haikou New District’s drainage system was efficient, so the streets remained mostly dry. Ten years of deep-cover operations had been excruciating. When the Ning-Chongqing merger happened, Feng Baiju spent two days locked in his room, staring silently at a map of the Hainan guerrilla zones, seeing no one except the soldier who brought him meals.\n\nThen, the Qiongya Column disappeared. Feng Baiju led the Red Army into the villages and towns, taking control of Hainan’s economic lifeline during the chaos. He became the head of the so-called “Hainan Local Maintenance Committee.”\n\nIt was a deception spanning every rural village and small town in Hainan. On the chessboard, the players were the Qiongya Column and the Empire of Japan—a high-stakes double act performed under the enemy’s very nose. There was no room for mistakes, no margin for error.\n\nAt first, everyone feared exposure, walking a tightrope where even the slightest misstep meant plunging into the abyss.\n\n\"When was the last time we received direct orders from the Central Committee?\" Zhang Shiying asked, gazing at the torrential rain outside.\n\n\"Back when we were told to go completely underground and maintain contact only with the South China Bureau. Since then, we’ve been fully committed to this performance.\"\n\nPan Jianghan set down his pen, finishing the document in front of him. He called in a messenger to deliver the beach arrangements to the service department. \"We need to pick up the pace. Have Xiao Chen and the others work overtime—those Japanese formalities are such a hassle.\"\n\n\"It’s exhausting. Every time we put on this act, we have to go all in.\" Zhang Shiying turned to look at Pan Jianghan, his comrade-in-arms for thirty years.\n\n\"Fighting a war isn’t easy. Neither is acting.\" They exchanged weary smiles.\n\n\"We’re only in our forties—why is our hair already turning white?\"\n\n\"Because white hair shines in the darkness,\" Pan Jianghan murmured. \"It gives people hope.\""
 CPC_main_story_events.131.o: "\"Screw you! You've been acting so long you're getting all poetic on me. Get back to work!\""
 CPC_main_story_events.131.o_tt: "Original story from Bilibili user(UID：349636826)."
 CPC_main_story_events.132.t: "Chili Powder on the Cat’s Back"
 CPC_main_story_events.132.d: "Spotlights shone on his face, making Chen Yun feel a bit drowsy. The Central Committee was holding a meeting today on \"Public-Private Partnership and Equity Recovery\"—a crucial step in the Socialist Industrial Plan of the Front. Chen Yun lifted the lid of his enamel cup, inhaling the strong aroma of tea. The tea polyphenols revived his slightly sleepy eyelids.\n\n\"Director Chen, all participants have arrived,\" his secretary whispered in his ear.\n\nMost of the attendees were national capitalists from Sichuan and Chongqing—some operated garment and salt factories in light industries, while others ran small ironworks in heavy industries.\n\n\"I see. Let's begin,\" Chen Yun nodded, finishing the tea in his cup. \"Friends, let’s not waste time and start the meeting.\"\n\nChen Yun briefly explained the purpose of the meeting—the socialist transformation of industry in the liberated areas. This meant the collective and state-owned restructuring of industries in Sichuan, Chongqing, and other regions that had yet to complete their transformation.\n\nThe attendees exchanged uncertain glances, unsure whether this was good or bad news.\n\n\"Collectivization? Nationalization?\" Some murmured while processing the idea. The quicker ones had already started sweating profusely, secretly shedding tears, realizing that their hard-earned businesses would soon be taken over by these 'red bandits.'\n\n\"Don't be so pessimistic,\" Chen Yun said with a reassuring tone, though inwardly, he scoffed at their reactions. \"Here’s our proposal: The government will regularly purchase your shares and pay interest. Of course, we won’t force anyone to sell, but if negotiations fall through, the funds earmarked for buying your shares will be used to build new factories instead. As the saying goes, 'Don’t let good water flow into others’ fields.' Once the new factories are up and running, the Front's procurement will prioritize them to ensure we recover our investment.\"\n\nWith this, Chen Yun addressed nearly all the key concerns, leaving the participants with no room for ambiguity. The capitalists, having little choice, began raising their hands in agreement, signaling their willingness to discuss the terms of equity acquisition.\n\nChen Yun clasped his hands together, covering the smile he could no longer suppress, thinking to himself, \"Chairman Mao’s method works best after all.\"\n\nA few days earlier, Mao Zedong had shared a joke with Deng Xiaoping and Liu Shaoqi—\n\nMao: \"Think about it—how do you make a cat eat chili powder?\"\nLiu: \"That's easy. Wrap the chili in fish and trick it into eating it.\"\nMao: \"Think harder. There's a better way.\"\nDeng: \"Just pry open the cat’s mouth and force it down.\"\nMao: \"Neither. The best way is to rub the chili powder on the cat's back.\"\nLiu and Deng: \"Why would you do that?\"\n\nMao Zedong leaned in closer and said:"
 CPC_main_story_events.132.o: "\"The cat feels uncomfortable, so of course, it will lick it off!\""
 CPC_main_story_events.133.t: "Cost Reduction and Efficiency Improvement"
 CPC_main_story_events.133.d: "Sunlight streamed through the thick glass, casting a golden glow on the factory’s straight, railway-like main avenue. The newly merged plant appeared more vibrant than ever—just one quarter after the steelmaking and rolling mills were combined, production efficiency had more than doubled. The new blast furnaces and rolling machines operated in perfect synergy. Steel billets, once transported several kilometers to the rolling mill, now moved directly via conveyor belts, eliminating unnecessary handling. The air still carried the sharp scent of iron and rust, but gone was the sluggish inefficiency of the past. \"Have you calculated how much diesel we save every day with this new integrated production line?\" the workshop director quipped while overseeing operations. The technician adjusted his glasses and replied, \"Not just diesel—this has completely eliminated an entire transportation team! As long as we keep things running smoothly, this production line’s efficiency is staggering!\"\n\nHowever, this newfound efficiency also brought an unwelcome consequence: some jobs and functions were now redundant. Previously, both plants had their own administrative teams, but after the merger, overlapping roles—such as HR, administration, logistics, and even technical support—had to be streamlined. While management tried to minimize layoffs through internal reassignment, many employees felt their roles and status had been diminished.\n\nA few reassigned middle managers gathered to vent their frustrations. Li, formerly the production scheduler at the steel mill, had been reassigned to the factory office, handling paperwork. Sitting at the meeting table, he muttered into his teacup, \"Synergy and efficiency? More like pushing us old guys out. ‘Optimizing management’? That’s just a fancy way of saying layoffs.\"\n\n\"Exactly,\" added Zhao, who had been the rolling mill’s equipment manager. After the merger, only one department head position remained, and he had lost the competition for it. Now, he was reassigned to oversee dormitory maintenance in the logistics unit. \"I’ve worked here for years—I know which pipes are prone to leaks, which valves always give trouble, better than any of these young engineers. And now? I’m fixing faucets in the dorms. The more I think about it, the angrier I get.\"\n\nLi scoffed, \"They only care about the young and the highly educated. Guys like us, who rely on hands-on experience, they think we’re ‘obsolete.’\"\n\nAs the evening approached, the sky outside the factory glowed red with the setting sun. The factory’s loudspeakers crackled to life, announcing today’s achievements: \"Today’s total output has reached an all-time high! Thank you all for your hard work!\" At that moment, the broadcast drowned out Li’s sigh and silenced Zhao’s brooding. The merger of the steel and rolling mills was a new beginning—on this pulsating steel artery, some strode forward with confidence, while others hesitated at the crossroads."
 CPC_main_story_events.133.o: "My job title has been promoted, what about you?"
 CPC_main_story_events.134.t: "A grain of dust in the era"
 CPC_main_story_events.134.d: "Strictly speaking, Lin Feng didn’t have a formal job at a factory, but he knew many electrical repair techniques, and it was this skill that allowed him to make a living, traveling all around the city for work. He loved life, got along well with his neighbors, and often helped fix electrical appliances for them. However, a few days ago, he was accused of being involved in a robbery case, though he knew nothing about it.\n\n\"Lin Feng, stop pretending!\" The interrogator coldly stared at him, placing one piece of evidence after another on the table. \"Several witnesses have stated they saw you at the radio factory site. Come clean, don’t think you can escape by lying!\"\n\nLin Feng was shocked and quickly shook his head. \"This is a misunderstanding, comrade! That day, I went to the housing district to fix a fan for a family; I never went anywhere else!\" But the interrogator clearly didn’t believe him, sneering, \"Do you think pretending to be innocent will get you off the hook? This is a crackdown—severe and swift! Confess for leniency, resist for harsher punishment, hurry up.\"\n\nLin Feng felt a fear he had never experienced before. His once warm home seemed to fade from his mind, the cold walls of the interrogation room closing in around him like a prison. The interrogation went on and on, his mind growing more and more muddled, to the point where he started doubting himself. How did it come to this? If convicted, the stigma would follow him for the rest of his life.\n\nThree days later, he was officially detained and sent to the Xi'an Detention Center. There, he met others who had also been accused. One of them, Xiao Li, was a street vendor who had been arrested after a witness \"identified\" him. Like Lin Feng, Xiao Li was unable to defend himself, and every time he spoke of his innocence, he would break down in tears. He told Lin Feng that very few people here could prove their innocence. The phrase \"severe and swift\" had become their nightmare—no one knew what their fate would be.\n\nA week later, Lin Feng’s mother was allowed to visit him. She looked haggard, her eyes swollen from crying. \"Son, I believe you didn’t do those things! I’ve been so anxious, I haven’t slept for nights!\" Her hands, covered in wrinkles, gripped his tightly, her eyes full of despair.\n\n\"Mom, I’m innocent!\" Lin Feng gritted his teeth, choking on his words. \"But I’m afraid… no one will believe me.\" His mother wiped away her tears, forcing a smile. \"Don’t be afraid, my child, I’ll find a way.\"\n\nIn the following days, his mother ran around, seeking out Lin Feng’s colleagues and neighbors, trying to prove his innocence. However, many people were afraid of being implicated and refused to speak up. Even those who were willing to testify were met with cold responses and were told, \"Don’t interfere.\" A month later, Lin Feng’s case finally went to trial. In court, the prosecution presented several testimonies, but their contents were vague, and even the exact time of the crime was unclear. Lin Feng repeatedly appealed about his whereabouts at the time, but the judge ignored him.\n\nIn the end, Lin Feng was sentenced to five years in prison, found guilty. He was sent to prison to serve his sentence.\n\nEvery morning, as he gazed out at the small patch of gray sky outside the prison window, his heart was filled with endless sorrow. The life he once knew seemed like a distant dream, and his mother’s visits were his only solace. Each time they met, his mother would tightly grasp his hand with trembling fingers, constantly telling him to hold on, that one day his innocence would be proven."
 CPC_main_story_events.134.o: "For an individual, this is a towering mountain."
 CPC_main_story_events.135.t: "Get Trust"
 CPC_main_story_events.135.d: "Lao Shen rubbed his sore shoulders and stood up from beside the rolling mill. The factory bell had just rung, signaling the end of the workday. He glanced at the large clock hanging high in the factory—its hands pointed to 7 p.m. For a moment, he felt disoriented. For years, he had been used to working until at least 9 p.m. before heading home. Now, with the new regulations in place, he found himself struggling to adjust.\n\nThe day the new policy was announced, the factory held an all-hands meeting. The factory director stood on the stage and loudly proclaimed, \"Starting next month, the mandatory labor period will be reduced to four hours per day. Work schedules must be properly arranged—no more arbitrary overtime! Comrades, this is not about relaxing standards, but about balancing work and rest to improve efficiency!\"\n\nMurmurs rippled through the crowd. The older workers whispered among themselves: \"Cutting two hours—can we still meet production quotas?\" \"What if we fall behind and get forced to work extra hours anyway?\" The younger workers, however, mostly looked pleased: \"Getting off two hours earlier every day means more time to rest!\" Lao Shen wasn't sure what to think. The long 14-hour workdays had turned his life into a monotonous routine—waking up at 6 a.m., rushing to catch the factory shuttle, completing eight hours of standard work, and then another six hours of so-called \"mandatory volunteer labor.\" This so-called \"volunteering\" was essentially forced—refusing to do it meant losing performance bonuses and missing out on recognition. By the time he got home, it was already late at night, leaving just enough time for a quick meal, washing up, and collapsing into bed.\n\nBut on the first day of the new policy, he immediately felt the difference. As usual, the workers started at 7 a.m. sharp, diving into their tasks without delay. With the upgraded equipment, Lao Shen’s rolling mill team saw a noticeable boost in efficiency—after eight hours, they had already completed their primary production goals. At 3 p.m., the factory entered the mandatory labor period. The workshop supervisor, as always, came to assign tasks: \"Lao Shen, you're in charge of inspecting the conveyor belts for wear today. Four hours should be plenty, right?\"\n\nLao Shen nodded, thinking to himself—before, this job would have dragged on until nightfall. True to the new system, by 6:30 p.m., the supervisor made his rounds, saw that most of the work was done, and waved them off: \"Alright, we're wrapping up! No need to drag it out!\"\n\nAt home, Lao Shen was surprised to find himself actually sitting at the dinner table with his son, instead of coming home to find the child already asleep. Over dinner, his wife teased him: \"Now that you're working two hours less each day, it looks like you'll have to relearn how to eat dinner with your son!\""
 CPC_main_story_events.135.o: "When officials lack consistent principles, the people lose their sense of security."
 CPC_main_story_events.136.t: "Tempered into Steel"
 CPC_main_story_events.136.d: "In the military factory, machines roared, and the air was thick with the scent of steel. Workers adjusted lathes, forged artillery, and contributed tirelessly to the revolutionary cause, striving for technological excellence with every hammer strike and calibrated measurement.\n\nAmidst the iron and fire, a quiet transformation was taking place among several ordinary workers. One of them, a young man named Li Deyong, had come from the countryside as an apprentice. His hands were rough, his skin darkened by machine oil and dust, but his aspirations soared beyond the factory walls—he dreamed of becoming a skilled technician and playing a role in the construction of the revolutionary base. Every evening after work, he attended night school, filling the gaps in his education and honing his machining skills. His perseverance paid off. Over time, Li Deyong grew from an inexperienced apprentice into a competent technical worker. Not only could he skillfully operate various machines, but he also began contributing to artillery design and refinement. In particular, his insights into precision control in bore machining earned him recognition, with engineers and seasoned craftsmen alike praising his meticulous approach and growing expertise.\n\nLi Deyong was not alone in his pursuit of excellence. His colleague, Old Zhang, a veteran worker from Yan’an, was well into his fifties yet remained as dedicated as ever. Having worked as a metallurgical technician in a steel mill, he had an intuitive grasp of metal properties. During one artillery adjustment session, he noticed inconsistencies in the thermal expansion of the barrel, which affected firing accuracy. He proposed a modification to the cooling process, and after numerous trials by the testing team, his method proved successful.\n\nAnother skilled worker was Lin Xia, a young woman whose strength and determination rivaled her male counterparts. She threw herself into her craft with unwavering commitment, mastering intricate manufacturing techniques within months. Her expertise lay in precision instrumentation. During a field test, persistent targeting discrepancies puzzled the technicians. With keen observation, Lin Xia identified an issue with the optical sights—floating lenses that caused deviations. She performed an on-the-spot adjustment, successfully rectifying the problem and ensuring accuracy.\n\nEach time a new batch of artillery barrels passed inspection and moved to the final assembly stage, the workers gathered to exchange insights and discuss technical details. In the crucible of revolution, these dedicated laborers—through their hands, intellect, and relentless perseverance—helped forge the strength of a new era."
 CPC_main_story_events.136.o: "A gathering of heroes."
 CPC_main_story_events.137.t: "Sustainable Planting"
 CPC_main_story_events.137.d: "Winter had passed, and spring had arrived—the season for planting spring wheat. Representatives from various cooperatives across northern Shaanxi, some as cooperative leaders and others as accountants, gathered at the Agricultural Bank of Yan’an to apply for low-interest loans for this year’s spring planting.\n\n“The interest rate is so low!” exclaimed Zhang, the director of Baihe Cooperative. “I remember before we overthrew the landlords, their loan interest rates could be as high as 50%.”\n\n“That’s right,” added Liu, the cooperative’s accountant. “The landlords’ interest rates were designed to suck the marrow from your bones, but the Communist Party’s interest rates… this is practically charity.” The other cooperative representatives nodded in agreement. Most were in their thirties or forties, and they still carried deep-seated memories of the ruthless exploitation they had experienced as children under the landlords.\n\n“Next!” called the bank clerk at the counter. Director Zhang stepped forward and handed over the necessary documents. “Comrade, this is our cooperative’s loan application for the year. We had a good harvest last year, so we don’t need too many seeds, and our loan request is relatively small.”\n\nThe bank clerk pulled out a thick record book and cross-checked Baihe Cooperative’s farmland data. Once everything was confirmed, she stamped the loan certificate and directed Zhang to another window to collect the funds.\n\nWith cash in hand, Zhang left the bank beaming with joy, counting the bills as he mentally calculated the number of seeds he needed to buy. He made his way to the agricultural market, carefully selecting seeds before loading four large sacks onto his donkey’s back. With a tug on the reins, he set off for Baihe Village.\n\n“Hee-yah! Hee-yah!” Zhang called out as he guided his donkey along the dirt road. By dusk, he had returned to the cooperative. Seeing that the sun had yet to set, he gathered the members and urged them to begin sowing the seeds immediately.\n\n“Director, when do we have to repay this loan?” a cooperative member asked.\n\nZhang raised two fingers. The member’s face tensed with worry. “Two months? Will we even have time to repay it?”\n\nZhang burst into laughter. “Two years! And it’s a low-interest loan with only a 3% rate!”\n\nThe gathered members gasped in disbelief—this was like manna from heaven.\n\n“Don’t be so surprised, comrades!” Zhang chuckled as he unloaded the sacks from the donkey’s back. “While there’s still daylight, let’s sow these seeds! The sooner we plant them, the sooner we’ll see the harvest!”\n\nWith that, a group of young men carried the seed sacks to the fields, carefully placing each seed into the soil. As the seeds were scattered, sweat and toil would transform them into a bountiful harvest, filling the bellies of countless people and laying the most fundamental foundation for all great aspirations."
 CPC_main_story_events.137.o: "Constant dripping wears away the stone; steady effort yields lasting rewards."
 CPC_main_story_events.138.t: "Everybody buies"
 CPC_main_story_events.138.d: "The \"Scientific Research Bonds\" were essentially a form of long-term savings, promising higher interest rates than regular banks upon redemption after liberation. Propagandist Ding Long, his throat dry from speaking all day, tirelessly explained this to farmers. This was already the fifth cooperative he had visited. Most farmers were unfamiliar with such bonds and remained wary. After all, newspapers frequently criticized the bureaucrats of the Nationalist-controlled regions for exploiting the people with various taxes and levies. Naturally, suspicions arose—was this so-called research bond just another disguised donation?\n\nHaving visited multiple cooperatives, Ding Long had grown accustomed to skeptical looks. After all, cooperative leaders and secretaries always found ways to persuade the farmers. He concluded his speech with a confident statement:\n\"Each bond has a backup record at the bank. Once the term ends, you can redeem both the principal and the accumulated interest. In other words, you’re lending money to the Party and the nation—you’re their creditor!\"\n\nWith that, he bid farewell to the local secretary and director before hurrying to the next village.\n\nThat evening, after finishing their work, the secretary and the director, accompanied by the local militia, went door to door persuading villagers to buy bonds, employing both emotional appeals and rational arguments.\n\"Look, I bought some, the director bought some, and so did all the militiamen and Party members. Even Old Li from the neighboring village—a notoriously stubborn man—bought some to support the Front's scientific development. Everyone is buying. Are you really the only one who wants to stand apart?\" The secretary's words sounded less like persuasion and more like an order.\n\nOld Zhang swallowed nervously and hesitantly responded, \"Let me discuss it with my wife first.\"\n\n\"They want to rob us blind!\" his wife fumed as soon as he mentioned it. \"We're poor peasants—where the hell do we have spare money? Just for the sake of their political achievements, they drag the militia along to pressure us—what kind of ‘mobilization’ is this?\"\n\nHer furious complaints rang through the wooden door, loud and clear for the secretary and his group outside.\n\n\"Not a single cent! I'm not buying anything!\" she continued, pointing toward the entrance. \"Those half-baked officials better not think they can squeeze money out of me. Go tell them to leave!\"\n\nOld Zhang turned pale. No matter what he did, he'd end up offending someone. Gritting his teeth, he forced a smile and went to the doorway.\n\n\"Secretary, you see, I'm just a poor peasant. I really don’t have any savings to spare—I just can’t buy any,\" he said, trying to sound as polite as possible.\n\nThe secretary shook his head and responded, \"Old Zhang, old Zhang… You need to have political awareness! If you buy some bonds, our cooperative might qualify as a model cooperative this year!\"\n\nThe back-and-forth continued until the secretary lost patience. With a dismissive wave, he finally said, \"Fine, fine, if you don’t want to buy, then don’t. Do as you please.\"\n\nAs the group walked away, the secretary turned to the director and muttered, \"Cut off his cooperative relief funds for the year. Let’s see if he still dares to act special.\""
 CPC_main_story_events.138.o: "Voluntary? Forced to be \"Voluntary\"!"
 CPC_main_story_events.139.t: "Do more, more gain?"
 CPC_main_story_events.139.d: "The work-point system, as the name suggests, is a method of allocating resources based on labor contributions. The central government aimed to implement this system within cooperatives, distributing surplus grain at the end of each year according to work points. This was intended to ease inflationary pressures while allowing cooperative members to benefit from a \"more work, more gain\" principle. The cooperative secretary carefully transcribed the central directive onto paper, attaching the detailed rules of the work-point system, and brought it to the village notice board.\n\nAs the secretary pinned the announcement to the board, villagers gathered to read and listen. \"From now on, surplus grain in our cooperative will be distributed through the work-point system,\" he explained. \"Every task performed in the cooperative will be assigned points, and at the end of the year, the grain will be distributed according to the number of work points earned—more work means more grain.\" Some villagers nodded approvingly. Hard work should be rewarded—this was much fairer than the previous flat distribution system. Some began mentally calculating which tasks they could take on to earn more points, while others smiled at the thought of providing better for their families. There was no time to waste—tools in hand, they tilled the fields and harvested grain with renewed vigor. The state’s share would be handed over, the collective’s portion secured, and the rest—well, that was theirs to earn.\n\nHard work and favorable weather made for a bountiful harvest, and as the Spring Festival approached, villagers lined up in anticipation, eager to see how their extra effort would be rewarded. Yet, reality had a way of disappointing expectations. \"This is all the surplus grain we have?\" Old Li squinted at the storehouse, disbelief in his voice. \"Didn’t we have a good harvest this year?\"\n\nAccountant Xiao Zhang explained, \"The harvest was good, but the county also increased its grain requisition.\" Though the granary was full, it was less than what villagers had expected. Murmurs rippled through the crowd—if there was less grain than anticipated, how much would each person actually receive?\n\nXiao Zhang carefully calculated the work points and announced the distribution results. The crowd erupted—not because there was an error, but because the outcome defied their expectations. Most villagers had earned high work points, but their efforts were so evenly matched that the final distribution was nearly identical to the previous years—despite the extra work. The system was fair, the math was correct, and the rules had been followed. Slowly, the discontent faded into silent acceptance, and one by one, the villagers collected their share.\n\nOld Li took his portion of grain to the supply and marketing cooperative, hoping to exchange it for money to buy fabric for a new coat. But when he saw how little money he received, he realized he couldn’t afford enough cloth. Frustrated, he walked away, swallowing a resentment that he couldn’t quite put into words."
 CPC_main_story_events.139.o: "If everyone works more, then no one has worked at all!"
 CPC_main_story_events.140.t: "Medal of Honor"
 CPC_main_story_events.140.d: "Flags fluttered as the soldiers who had liberated the Northeast marched in perfect formation through Tiananmen Square, their spirits high as they stepped in unison. Unit after unit stomped over discarded Japanese military flags strewn across Chang'an Avenue, receiving the inspection of the Party and the people. Citizens, students, and workers cheered enthusiastically, welcoming the triumphant return of their revolutionary heroes.\n\nAfter the parade, Lei Feng, honored as an outstanding representative of the officers and soldiers, stepped onto Tiananmen to deliver a speech. Swallowing nervously, he recalled the praise he had received from Lin Biao during an inspection: \"This young man should be nurtured well; he has great potential! When he returns to the mainland for commendation, let him take the stage to speak.\" If the commander said so, then I must take this seriously, Lei Feng thought to himself.\n\nAfter Lin Biao finished his speech on the Tiananmen platform, he gestured for Lei Feng to step forward. Taking the microphone, Lei Feng glanced at the sea of red flags waving beneath the gate and began in a resolute voice:\n\n\"Today, I am deeply honored to stand here as an outstanding representative of our officers and soldiers to share my thoughts on our victory. Just a few years ago, I was nothing more than a conscript in the Nationalist army, living in uncertainty from one day to the next. But after becoming a proud member of the People's Liberation Army, I found true freedom. Over these past few years in the PLA, I have learned so much. I have learned that strength comes from unity, wisdom from labor, action from ideology, and honor from the collective.\"\n\nThe students in the crowd, seeing that Lei Feng was barely older than themselves, began to cheer and call for him to share more about his experiences in the PLA.\n\nLei Feng continued: \"A drop of water will never dry up if it merges into the sea. Likewise, an individual is at their strongest when they dedicate themselves to a collective cause. The PLA embodies this strength, and the Communist Party is the guiding beacon that channels it. As a Communist Party member, I feel deeply honored because I have earned the privilege of dedicating everything I have to the cause of revolution and liberation. Every day since becoming a Party member, I have reminded myself: In work, I must follow the most dedicated comrades; in life, I must align myself with the humblest of our people. Only in doing so can I live up to the expectations of the people and contribute to the construction of socialism.\"\n\nThe young speaker’s passionate words stirred everyone in the square, capturing their admiration. Many in the crowd—directly or indirectly—began to see Lei Feng as a role model.\n\nHe went on to speak about his comrades, his fellow soldiers, and the ordinary people in the revolutionary base areas who had dedicated themselves to the cause. Finally, comparing himself to a simple yet indispensable screw, he concluded his speech with heartfelt conviction:\n\n\"For the freedom and happiness of all, I am willing to be a screw that holds everything together. A person’s life is limited, but the service to the people is infinite. I am determined to devote my finite life to the infinite cause of serving the people!\"\n\nThe crowd erupted into wave after wave of thunderous applause. Some students, elated and inspired, shouted:"
 CPC_main_story_events.140.o: "‘Studying for Leifeng!\""
 CPC_main_story_events.141.t: "The Wedge"
 CPC_main_story_events.141.d: "\"Sir, where do you think the Yellow River water comes from?\" Lin Chen, who had been crouching beside Xu Feng for a while, asked. However, Xu Feng remained fixated on the fire across the river and absentmindedly replied, \"The poems say it comes from the sky, and the scholars say the same, so it must be rain from above.\"\n\nStill unconvinced, Lin Chen pressed on, \"But how could there be so much rain? The water keeps flowing without end.\"\n\nXu Feng, finally breaking his focus, reached over and ruffled the young soldier's hair. \"Why do you care so much? Ask the intellectuals about it later.\" He knew Lin Chen was just trying to mask his nerves. Despite being young, Lin had proven himself in training, holding his own against the best in the squad—perhaps even in the regiment. But this was his first real operation. Feeling anxious was only natural.\n\nThe fire across the river continued to rage—it was the aftermath of the artillery bombardment on the enemy positions. Some shells had struck ammunition depots, setting off explosions that nearly obliterated the entire fortifications. Anyone left alive there likely had their organs ruptured by the concussive blast. Xu Feng could only hope that no allied troops had mistakenly infiltrated those doomed positions, and that the shattered fortifications contained fewer gruesome remnants of flesh and bone than expected.\n\nCrossing the river at night provided no real sense of security, especially with the enemy’s fires illuminating the waters. Yet, the soldiers in the river remained unnoticed. The enemy seemed more preoccupied with other matters, and their river defenses proved weaker than anticipated. The loss of men and time was far lower than what had been suffered in training exercises. At least in Xu Feng's unit, the worst casualties so far were a few comrades who froze in fear and sustained minor injuries. During earlier drills, entire platoons had been wiped out in simulated crossings.\n\nThey had once braced themselves for endless bunkers and machine-gun nests. But when they reached the shore, they found little resistance—just scattered remnants of enemy soldiers cowering within crumbling fortifications, their officers dead or missing, leaving them leaderless and trembling in fear, awaiting the inevitable purge.\n\nThe final phase required little effort. Over and over, they either shouted for surrender or placed explosive charges against the outer walls of the enemy’s bunkers, blowing them apart. When the last position was cleared, red flags were raised high over the captured strongholds, their fabric snapping sharply in the night wind. The enemy’s jagged-toothed banners were pulled down and tossed into the fire, burning long and slow.\n\nFrom landing sites across the river, signal horns echoed one after another. And on the far shore, torches began to flicker, scattered across the darkness like fireflies and distant stars."
 CPC_main_story_events.141.o: "The road ahead is now smooth."
 CPC_main_story_events.142.t: "Medal of Honor"
 CPC_main_story_events.142.d: "Time flowed slowly, thick and viscous like crude oil. The air was heavy with an almost suffocating stillness, and everyone around seemed trapped in helpless silence, their spirits weary, no longer adhering to their assigned posts with the discipline they once had.\nSergeant Zhao Zhijie of the Shanxi Provincial Defense Forces glanced at his wristwatch under the dim glow of dusk. It had been five minutes since the shift change was supposed to occur, yet no one had arrived. Almost every soldier in his squad turned their gaze toward him, then toward the distant mountains. They were waiting for his command, just as he was waiting for something—though he wasn’t sure what. A deep unease crept into his chest, an unfamiliar foreboding that made him long for the warmth and safety of his home. The eerie stillness of the wind that evening only heightened his growing fear.\nAs the watch’s hands crept forward another notch, the relieving unit finally arrived.\n“Hard work, brother.”\n“Yeah… no problem.” Zhao Zhijie returned the handshake absentmindedly. To be honest, he didn’t recognize the officer standing before him.\n“You new here?” he asked.\n“Yeah, just got transferred. The bandits have been getting out of hand lately, so headquarters sent us from—” The man spoke in a thick accent, but Zhao Zhijie was too distracted to process his words. Instead, his eyes scrutinized the soldiers behind the man, assessing their formation and composure. Only when his own troops fell into line, their expressions easing into relief, did he let go of his doubts and complete the handover. He led his men down the road toward the setting sun.\nThen, without warning, the air was split by a chorus of shrill whistles, followed by deafening explosions.\nZhao Zhijie’s head snapped toward the source—artillery shells rained down in the distance, thick clouds of smoke billowing over the frontline bunkers. More shells followed, pounding the positions relentlessly. Chaos erupted as soldiers dove for cover along the roadside, scrambling into craters and trenches. As soon as the barrage subsided, Zhao Zhijie wasted no time. His instincts screamed that something was terribly wrong. Without hesitation, he led his unit in a frantic rush back to their defensive line.\n“What’s the situation?!” he bellowed as he reached the bunker line.\nThe aging fortifications, long neglected, now teetered on the verge of collapse, riddled with cracks and blasted-open breaches. Shouts and cries filled the air. A disheveled soldier, his face smeared with dust, stumbled toward them, dressed as a quartermaster’s orderly but sobbing hysterically for a medic.\nZhao Zhijie didn’t hesitate—he ordered his troops to scatter into their secondary positions, then rushed after the so-called “orderly” into the command post, hoping to assist the wounded.\nBut the moment he stepped inside, the reality of the situation hit him like a sledgehammer.\nTwo rifles were already leveled at him.\nFrom the shadows, figures clad in deep green field uniforms emerged. One of them chuckled softly and spoke in a calm yet chilling voice.\n“Don’t move.”"
 CPC_main_story_events.142.o: "\"We are the People's Liberation Army Mountain Corps. Our army treats prisoners with kindness. Surrender immediately!\""
 CPC_main_story_events.143.t: "All that’s left behind is just an empty reputation"
 CPC_main_story_events.143.d: "The Presidential Palace, once draped in the humiliating blue-and-white sun emblem, now bore the liberating red, blue, and gold star banner as victorious soldiers marched through its gates. Citizens and students lined the streets, cheering the People's Liberation Army as they entered the city. With their guidance, soldiers pried open the armory, retrieved explosives, and followed Ji Dengkui to Meihua Mountain—the infamous resting place of Wang Jingwei.\n\n\"Comrades of the Liberation Army!\" A student leader hesitated momentarily before settling on the address. \"The traitor Wang Jingwei's tomb is right here. Please, destroy it! My brother died in his family's factory due to a work accident! Not only did he lose his life, but we received no compensation—nothing!\"\n\nAs one voice broke the silence, others followed in a cascade of grievances. Cries of injustice, of loved ones lost to oppression, filled the air. The crowd roared in unison, their anger mounting into a deafening chant: \"Blow it up! Blow it up!\"\n\nJi Dengkui raised his hands to calm the furious mass, forcing himself to speak over the clamor. \"Wang Jingwei was indeed a vile man—the very embodiment of the Kuomintang’s weakness, its dictatorship, its betrayal of democracy, freedom, and independence! The people of China, and we Communists, loathe such a regime. But comrades, this is a matter of historical significance. I must consult my superiors before taking any action, so I ask for your patience!\"\n\nWith haste, he composed a telegram, outlining the explosive situation at hand. Within half an hour, the response arrived from Xi’an: permission granted, with strict orders to oversee the demolition and ensure no harm came to the civilians.\n\nJi Dengkui held the telegram high and announced, \"The Central Committee supports your demand!\" A triumphant cheer erupted from the crowd. Students and citizens rushed forward, assisting the soldiers in carrying the explosives up the hill. The engineers assessed the structure, their electromagnetic detectors beeping steadily against the tomb's reinforced shell.\n\n\"Unbelievable,\" muttered one engineer. \"This entire tomb is lined with scrap steel. How much metal did this damned traitor waste?\"\n\nAfter some quick calculations, the engineers determined that 300 pounds of explosives would be needed. They meticulously placed the charges at key detonation points.\n\n\"Ladies and gentlemen, step back. Fragments don't discriminate,\" Ji Dengkui called out, leading the people to a safe distance.\n\nWith a thunderous boom, the tomb’s dome was blown apart, revealing Wang Jingwei’s coffin. Despite time and decay, the embalmed corpse bore a chilling resemblance to the man himself—the traitor who had modeled himself after Chiang Kai-shek in every way, even in death.\n\nFor a moment, there was silence. Then, from somewhere in the crowd, a piece of debris was flung at the exposed corpse. Then another. And another. Soon, a barrage of rubble rained down upon Wang Jingwei’s remains.\n\nThe soldiers and Ji Dengkui attempted to intervene, but the flood of long-suppressed rage was unstoppable. By the time the crowd dispersed, the body lay in ruins, just like the regime it had once served.\n\nJi Dengkui stood before the wreckage, taking in the scene—the shattered remains of a man despised by history, and the unrelenting fury of a people who had finally claimed their justice."
 CPC_main_story_events.143.o: "Save China in such way? BULLSHIT!"
 CPC_main_story_events.144.t: "Flower for sunrise"
 CPC_main_story_events.144.d: "The skies over Xi’an were clear and vast today, with a gentle breeze and pleasant temperatures—an ideal day for commemoration.\n\nMao Anying and Mao Anqing supported He Zizhen, while Li Na walked beside Jiang Qing. The family members of Mao Zedong, accompanied by a group of central officials, made their way toward the newly unveiled statue of Mao Zedong in the heart of the city. They came to lay flowers and pay their respects—more than a formal state funeral, this was a deeply personal gathering, a memorial service reserved for family and close comrades.\n\nThe ceremony was presided over by Liu Jianxun, who had been entrusted by the Politburo to compose and deliver a eulogy recounting Mao Zedong’s life in ten thousand words. Yet, to those present, even ten thousand words seemed woefully insufficient to encapsulate the journey of a leader who had witnessed and shaped eighty years of China’s tumultuous history. In ten years, twenty years—perhaps even fifty or a hundred years later—there would still be generations of young scholars who would dedicate themselves to studying and reinterpreting his legacy.\n\nThe floral tribute from the Central Committee was carried by two men: Mao Anying on the left, Mao Anqing on the right. They ascended the white marble steps of the statue’s pedestal. As their solemn footsteps echoed, a row of central officials dressed in mourning black bowed deeply, holding their position in silent reverence.\n\nPlacing the wreath at the foot of the towering statue, Mao Zedong’s two sons straightened their postures. Both had spent years in the Kazakh military, forging themselves into true revolutionary soldiers. Above the sea of bowed heads, Mao Anying and Mao Anqing raised their right hands and delivered a salute—executed with the precision of trained soldiers, embodying the discipline and devotion their father had instilled in them.\n\nIn that moment, as though carried by the wind, it seemed that every person present could hear his voice once more, his call imbued with the unmistakable Xiangtan dialect—A call that, more than anything else, encapsulated fifty years of struggle, revolution, and the very essence of the Communist Party’s mission:"
 CPC_main_story_events.144.o: "\"Long live the people!\""
 CPC_main_story_events.145.t: "Business"
 CPC_main_story_events.145.d: "The village market was bustling with activity, bathed in the golden hues of the setting sun. Stalls lined both sides of the road, with the lively chorus of hawkers calling out their wares filling the air. Master Zhao arrived at the market, weaving his way through the stalls, carefully selecting his purchases.\n\n\"Master Zhao, here again to buy vegetables?\" Aunt Zhang greeted him with a warm smile from behind her stall.\n\nCatching sight of her, Master Zhao nodded. \"Yes, here to pick up some vegetables.\" His eyes casually landed on a pile of fresh garlic scapes. Aunt Zhang, noticing his gaze, quickly grabbed a few and placed them on the scale, her voice as busy as her hands.\n\n\"Master Zhao, these garlic scapes are fresh today! Want to take some home?\"\n\n\"Alright, give me two,\" he replied, pointing at two particularly vibrant ones, their leaves lush and green. As she wrapped them up, Aunt Zhang chuckled, \"You always have an eye for the best ones. Every time you come by, you pick the finest!\"\n\nMaster Zhao’s eyes crinkled with amusement. \"I believe in quality. If I’m eating, I might as well eat well.\"\n\n\"You talk like you’re traveling miles to find a meal,\" Aunt Zhang teased while weighing the vegetables. \"A simple meal can still make life good, you know.\"\n\nThough unwilling to admit his age, Master Zhao humored her, saying, \"I suppose I’ve grown a bit picky with age. But these garlic scapes are really something—fresh and crisp, and they don’t cause any irritation.\"\n\n\"Flattery won’t work on me,\" Aunt Zhang scoffed, though the pride in her voice was unmistakable. \"My vegetables speak for themselves. Here, these potatoes are great too—firm and filling. You’re a regular, so take two as a little extra.\"\n\nMaster Zhao nodded in appreciation and added two potatoes to his bag. He reached into his pocket, pulled out a few paper bills, and handed them over. As he turned to leave, Aunt Zhang hurriedly stopped him.\n\n\"Master Zhao, you forgot your change! I can’t take extra from you in good conscience.\"\n\nBut he firmly insisted, his tone kind but resolute. \"You know I like doing things properly. If I’m taking two extra potatoes, I can’t just take them for free.\"\n\nThe two went back and forth for a moment, but ultimately, Aunt Zhang couldn’t win against Master Zhao’s persistence. She accepted the money with a reluctant smile.\n\n\"That’s how it should be,\" Master Zhao said, nodding in satisfaction as he secured his cloth bag. \"If you get any more good vegetables, save some for me!\"\n\nHumming a tune, Master Zhao made his way home, his bag of vegetables swinging at his side. Meanwhile, Aunt Zhang carefully counted the money before jotting down the sale in her ledger.\n\n\"Hmm… just fifty cents more, and then I can call it a day.\""
 CPC_main_story_events.145.o: "Mutual benefit"
 CPC_main_story_events.146.t: "Individual Farmer"
 CPC_main_story_events.146.d: "Chen Jinlong clenched a wheat stalk between his teeth, his eyes brimming with schadenfreude, while the brigade secretary's eyelid twitched incessantly as he stared at the newspaper.\n\nDuring the Great Leap Forward, village secretaries across the country, whether through persuasion or coercion, pushed most villagers to \"voluntarily\" join the cooperatives. Yet, there were always a few stubborn holdouts, and Chen Jinlong was one of them. But fate takes unexpected turns—after Liu Shaoqi initiated the anti-impetuousness policy, the rural collectivization movement steadied, reaffirming the principle of voluntarism and even encouraging individual household farming.\n\n\"The Party Central has always said it’s voluntary!\" Chen Jinlong pointed at the newspaper with a smug grin. \"Look, Secretary, I know you believe in the cooperative, and I don’t think it's bad either. But I’ve been farming on my own for years—I just can’t get used to communal meals. We’re all from the same village, after all. Let’s try to understand each other, eh?\"\n\nThe secretary could hear the mocking tone in Chen Jinlong’s voice, and irritation surged within him. But given that the policy now favored Chen’s stance, he had no ground to retaliate, so he tried to make his case instead: \"You’re not entirely wrong. But let’s be honest, you have a donkey. If you join the cooperative, it’d help boost everyone’s productivity. Why not reconsider? Bring your donkey and join us.\"\n\nSeeing that the secretary was not only trying to persuade him but also eyeing his donkey, Chen Jinlong scoffed. \"Forget it! I need that donkey to help buy my son a new pair of shoes. And don’t think I’ve forgotten about our little 'incident' from before.\"\n\nHe was referring to the time when the secretary, trying to pressure him into joining the cooperative, had some men trample his wheat fields at night.\n\n\"Let’s be clear about one thing,\" Chen Jinlong continued. \"As long as the Party doesn’t mandate that everyone must join, I’ll keep farming on my own! And if you keep messing with my fields, I swear I’ll slaughter my donkey for meat and go to the city to find work!\"\n\nThe secretary’s face turned red. Hands on his hips, his shiny bald head gleaming under the sun, he stood firm despite being a full head shorter than Chen. He shot back:\n\n\"Don’t get too comfortable! Maybe this year or next year you can stay out, but the year after that? Or the one after? You’ll have to join sooner or later! The Central Committee is just adjusting its pace—you think you can farm alone forever?\"\n\nWith that, he spun around and stormed off, spitting onto a pile of straw at the doorstep. Chen Jinlong crossed his arms and watched as the secretary disappeared into the distance.\n\nOnce the secretary was gone, Chen led his donkey out to plow the fields. The animal panted heavily, heaving as it pulled the iron plow, turning up rich, dark soil. After a long afternoon of toil, Chen took a deep breath, lit up a pipe of dry tobacco, and exhaled slowly. Looking at the neatly tilled earth beneath him, then glancing over at the cooperative’s fields, where villagers were still hard at work, he smirked to himself:\n\n\"Good thing I didn’t join the cooperative—otherwise, my donkey would’ve been worked to death by those poor relatives of mine.\""
 CPC_main_story_events.146.o: "When the pie is shared unevenly, someone always gets the smaller slice."
 CPC_main_story_events.201.t: "Hello, Vietnam?"
 CPC_main_story_events.201.d: "The streets remained as they always were, with people moving along the tracks of their daily lives, methodically beginning a new day of work—neither sorrowful nor joyful. The weather, like the bustling streets of Xi’an today, was utterly unremarkable.\n\nHowever, inside the Ministry of Foreign Affairs, the atmosphere was somber. Qiao Guanhua, usually cheerful, had put away his customary smile and solemnly read out the obituary of Ho Chi Minh.\n\nMost of those present were visibly shocked and began murmuring their thoughts.\n“What a shame.”\n“He was such a good man.”\n“At least he lived to see his country’s liberation.”\n\nTears welled up in Luo Guibo’s eyes as he recalled his time working in Vietnam and the warm, kind presence of Uncle Ho. Overcome with grief, he ran out of the office, shutting himself in the restroom to cry alone.\n\nUpon hearing the news, Zhou Enlai, too, wiped away tears in his office. He wasn’t just mourning the loss of a good friend to the Northwest; he was mourning for himself as well. A heavy sense of powerlessness weighed down on him.\n“When will I see China liberated?”\n\nThe office door opened, and Secretary Xiao He returned from meeting with Chairman Mao, carrying a thick stack of files in her arms—reports from the South China Bureau regarding Vietnam. Vietnamese Deputy Prime Minister Pham Van Dong was set to lead a delegation to the Northwest in a month, and he had raised three crucial issues that needed to be resolved through diplomatic discussions. Zhou Enlai had to prepare for the upcoming talks.\n\n“Chairman Mao has received the news of Ho Chi Minh’s passing,” Xiao He reported as she carefully placed the files on Zhou’s desk. “He wanted to smoke, but Dr. Fu didn’t allow it.”\n\nShe continued, “Chairman Liu said he will personally go to the train station to receive the Vietnamese delegation and has instructed Gansu Province to make the necessary preparations.”\n\nIt was only then that Zhou Enlai seemed to notice the mountain of files on his desk. He didn’t speak, but his trembling hands reached out to pull one from the pile. In doing so, he accidentally toppled the entire stack, sending documents cascading onto the floor.\n\nXiao He quickly stepped forward to gather them up, and as she did, she caught sight of the redness in Zhou’s eyes.\n\n“Premier, you’ve been crying.”\n\n“I’m sorry, Xiao He,” he admitted softly. “I just feel… overwhelmed.”\n\n“Shall I get you some water?” she asked, already opening the thermos. The sound of hot tea pouring filled the room as she handed him a full cup.\n\nZhou Enlai took a deep breath, drank every last drop, and finally steadied himself.\n\nAt last, regaining his composure, he began issuing directives for the work ahead."
 CPC_main_story_events.201.o: "\"Ask Comrade Luo Guibo to come to my place at 8 o'clock this evening.\""
 CPC_main_story_events.202.t: "Goodbye, Vietnam."
 CPC_main_story_events.202.d: "The convoy arrived at the square in front of the Xi’an Governmental Affairs Council, carrying the Vietnamese diplomatic delegation led by Pham Van Dong, Le Duan, and a group of grassroots Communist Party of Vietnam (CPV) members. Inside the reception hall, the delegation was greeted by Zhou Enlai, who had just set aside other work to personally meet them.\n\n\"Welcome! I heard from the comrades in charge of reception that you traveled all the way from southern Tibet, taking the route through Lanzhou before arriving here. That must have been quite a journey.\"\n\n\"Haha, nothing compared to the opportunity to meet with you. Chairman Ho used to say that no matter how many mountains and rivers lay between us, he always longed to see his Chinese comrades.\"\n\nHearing the name of the recently departed Ho Chi Minh, Zhou Enlai fell into a brief daze. The two had met in revolutionary Guangzhou and worked together in wartime Chongqing. The revolution had not yet fully succeeded, yet Ho was gone, leaving no chance for another reunion.\n\nPham Van Dong seemed to sense Zhou’s melancholy and cautiously asked, \"Premier Zhou, are you feeling tired? Should we…?\"\n\nZhou Enlai snapped out of his thoughts, waved his hand with a smile, and said, \"No, no, just reminiscing about past days with Comrade Ho. Though we never met again after Vietnam’s liberation, I can imagine how overjoyed he must have been.\" He gathered his thoughts and continued, \"Your first foreign visit since Chairman Ho’s passing is to Northwest China, which speaks volumes about the strong friendship between our two parties and peoples.\"\n\nPham Van Dong and Le Duan exchanged a glance—both were eager to conclude the meeting swiftly and return to Hanoi. \"You know, Vietnam has just been liberated, and we have an enormous task ahead in rebuilding. To be honest, we’re practically running out of rice.\"\n\nA burst of good-natured laughter filled the room. Zhou Enlai, hearing this, responded, \"Vietnam’s needs are something we are more than willing to assist with. However, Northwest China is also facing challenges.\" He paused in thought before resolutely adding, \"But we will do our best. The friendship forged in blood is more precious than anything else.\"\n\nPham Van Dong let out a deep breath of relief before continuing, \"There’s one more matter we wish to discuss with our Chinese comrades. Now that Chairman Ho has passed, we are preparing to elect a new leadership team. Premier Zhou, we’d like to hear your thoughts…\"\n\nAlthough neither he nor Le Duan wished for China to interfere in their internal affairs, given their long-standing alliance and China’s generous support, it seemed only proper to inform them. As he spoke, Zhou Enlai raised his hand slightly, signaling him to stop, before firmly stating, \"We are comrades and brothers. The Communist Party of China will not dictate matters within a friend’s own home. Comrade Jianying has also discussed this at length with Comrade Vo Nguyen Giap—our stance has always been consistent and clear.\"\n\nAt this moment, Le Duan spoke up. \"Premier Zhou, we must return to Vietnam soon to carry out our next phase of work. Let us not delay further. When the day of Asia’s revolutionary victory arrives, we shall meet again at the grand celebration.\""
 CPC_main_story_events.202.o: "\"Okay, okay, see you on the day of victory.\""
 CPC_9th_congress.16.t: "Great Harvest"
 CPC_9th_congress.16.d: "Today, Ren Youcheng and Liu Wenliang woke up earlier than ever before. According to Farm Secretary Zhang, a central work group was coming for an inspection, and the farm had to be in perfect condition, with everyone on high alert. Whenever officials arrived for a visit, Secretary Zhang would act as if they were preparing for battle.\n\nYawning, Liu Wenliang muttered, \"That old Zhang is at it again. My ears are about to sprout calluses from hearing 'everything must be perfect' a thousand times. We haven’t done anything wrong, what’s there to worry about?\"\n\nRen Youcheng patted Liu on the shoulder and joked, \"You're acting like a newlywed bride meeting the in-laws!\" The two exchanged glances and burst into laughter.\n\n“Comrades, the central work group leaders are about to arrive! Get ready!” Secretary Zhang, eyes fixed on the approaching convoy, began rattling off orders anxiously. Within moments, the convoy entered the farm, and the workers lined up neatly along the roadside, clapping in unison to welcome the guests.\n\nThese weren’t just any officials—among them were Ma Zhongying, Seypidin, and Wang Zhen, the leader of the central work group. Seeing the farm bustling with activity, Wang Zhen remarked, \"You've done a great job. When we first started reclaiming land here, we only had wooden plows. Now, you’re using tractors and diesel engines. This truly is a model farm, showcasing the strength of socialist agriculture in the northwestern frontier!\"\n\nThen, smiling, Wang Zhen turned to Secretary Zhang and asked, \"Comrade Secretary, may I randomly speak with a worker?\"\n\nSecretary Zhang froze for a moment. This was unexpected, but he couldn’t refuse a leader’s request. \"Of course, of course,\" he stammered. Wang Zhen glanced at the gathered workers and, by chance, picked Ren Youcheng. Secretary Zhang’s face turned pale—of all people, why choose someone who had been labeled a ‘black element’ and struggled during the Four Cleanups Movement?\n\n\"Youth, what’s your name?\" Wang Zhen asked with a friendly smile.\n\nRen Youcheng responded directly, \"My name is Ren Youcheng. I was classified as a ‘black element’ and struggled against during the Four Cleanups.\"\n\nOut of the corner of his eye, Ren Youcheng caught sight of Secretary Zhang’s nervous expression. He quickly adjusted his tone and continued, \"I believe I was criticized precisely because I still carried remnants of petit-bourgeois habits. Undergoing that struggle was a valuable education for people like me. Now, I live in a small room on the farm, using my middle-school education and engineering books to wind copper wire and build transformers. Would you like to see our workshop?\"\n\nIntrigued by the young man's unexpected response, Wang Zhen waved his hand enthusiastically. \"Certainly, certainly!\"\n\nRen Youcheng led the delegation to his small workshop. Pointing to a machine with a foot pedal, he explained, \"That’s a wire-winding machine. Liu Wenliang and I repurposed an old sewing machine, modifying the foot pedal to assist in winding the wire. It’s much faster than doing it by hand. Now, winding copper wire is as easy as flying a kite.\"\n\nWang Zhen nodded approvingly and started clapping. \"The creativity of the working masses is boundless! Education works, education works indeed!\"\n\nStanding nearby, Secretary Zhang finally let out a sigh of relief and discreetly gave Ren Youcheng a thumbs-up.\n\nAs the inspection wrapped up, Wang Zhen delivered a brief speech, highly praising the Red Flag Slope Farm as a model of socialist advancement. Finally, he announced some good news to all the workers."
 CPC_9th_congress.16.o: "It's a fine harvest this year in Xinjiang."
