 CPC_end_of_the_very_beginning: "A Wester So Fiery"
 CPC_end_of_the_very_beginning_desc: "Drum rolls, Cloud darkens. A most dire moment arrives - a harvest poor, an industrial breakdown, the failure to organize Qinghai socialist reformation has emboldened the KMT reactionaries of Ma Jiyuan, daring to rebel against us.\n\nYet we ride on. Okamura Yasuji didn't force us into submission back in 1949, Ma Lin and Ma Hongkui didn't shatter our lines back in 1956, neither shall Ma Jiyuan's lackey of KMT reactionaries!"
 CPC_northwest_crisis: "A Northwest in Direness"
 CPC_northwest_crisis_desc: "During the Great Leap Forward, certain cadres' \"left-leaning\" opportunism was exploited by the counterrevolutionary Northwest Kuomintang clique, led by Ma Jiyuan. They colluded to violently assassinate Comrade Peng Zhen and other senior Party members dispatched to oversee the socialist transformation in local regions. Their actions recklessly sabotaged the Party's and the Front's construction efforts. Driven by personal ambition, they ultimately betrayed the anti-Japanese coalition outright.\n\nThe betrayal of the Ma clique plunged the Front's anti-Japanese cause into a critical moment of survival. To the south, contact with Sichuan and Kangding was severed; to the north, the Mongolian and Manchurian puppet armies advanced aggressively; to the west, Qinghai rebelled against the Front, while Longbei opportunistically declared autonomy, aiming to establish itself as a regional power.\n\nOur anti-Japanese slogan calls for uniting all comrades in the resistance, but this does not mean yielding an inch to counterrevolutionaries. For the liberation of the nation, the only path forward is to eliminate the Ma factions one by one."
 CPC_conspiracy_resurfaces: "A Conspiracy Brewing"
 CPC_conspiracy_resurfaces_desc: "Opportunity waits for no one, and neither does crisis. When all sails are smooth, everything appears orderly, but once adversity strikes, problems come one after another. The rebellion of the Ma clique has left us overwhelmed, while years of chaotic infighting in Xinjiang remain an entangled mess. Now, with our attention stretched thin, various forces in Xinjiang are beginning to stir covertly. Civil war is foreseeable in the near future, and all sides are bound to conspire and probe each other, with the likes of Ma Hushan, Sheng Shicai, and other old Xinjiang warlords being particularly suspect."
 CPC_track_what_they_are_doing: "Track their movement"
 CPC_track_what_they_are_doing_desc: "Indeed, the Hetian Ma family harbors schemers and ambitious figures plotting in the shadows. The Xinjiang Bureau has relayed intelligence indicating that Ma Hushan is dissatisfied with the progressive actions of his brother-in-law, Ma Zhongying, and is planning to take action. It could be a coup, an attempt to sideline Ma Zhongying, or perhaps Ma Zhongying has already been swayed by him and is merely waiting for the right moment. The truth remains elusive, but one thing is certain: this matter must be thoroughly investigated. Under no circumstances can we allow Xinjiang to produce another Ma Jiyuan."
 CPC_track_what_they_are_doing_tt: "Issue an order to the §GXinjiang Bureau§! to closely monitor the movements of §lMa Hushan§! and the §lMa Generals' Association§!."
 CPC_recover_north_long: "Restore Direct Rule in North Gansu"
 CPC_recover_north_long_desc: "The North Gansu Special Region holds critical strategic value, serving not only as a base for the Xinjiang Defense Front to flank and strike the Ma bandit forces but also as the gateway to the Hexi Corridor, a vital route leading into Xinjiang. The rebellion of the Ma bandit forces has emboldened Ma Bukang's ambitions, as he has chosen to remain a passive observer during this critical upheaval.\n\nIn light of Ma Bukang, the military and political leader of the North Gansu Special Region, consistently evading and shirking his responsibility to suppress the Ma rebellion under various pretexts, the Central Committee has decided, after deliberation, to arrest Ma Bukang and place him in custody. Ma Guangyuan will temporarily assume command in Hezhou."
 CPC_restore_from_the_disaster: "Recover from the Rebellion"
 CPC_restore_from_the_disaster_desc: "The battles have subsided, and the surrounding situation of the NDF has shown significant improvement, alleviating concerns over survival and existential threats. With the reactionary rebellions suppressed, the focus of our work will now return to the task of socialist construction. Beyond rebuilding the provinces of Qinghai and Gansu and eliminating remaining bandit remnants, we must address the long-standing impoverishment and hardships in the Northwest. By achieving significant strides in development, we aim to lay a solid foundation for advancing into the counter-offensive stage of the Anti-Japanese War."
 CPC_everything_in_northwest_is_settled_tt: "The £GNG_chinese_nation_texticon §mrebellion§! has been quelled, and the £CPC_texticon §xParty's§! §Yday-to-day operations§! have resumed.\n\nThe £CPC_texticon §GNorthwest Bureau of the CPC§! mechanism will be unlocked.\nThe £CPC_texticon §GSouthwest Bureau§! mechanism will be unlocked."
 CPC_stability_first: "Call for Prudence"
 CPC_stability_first_desc: "The fragile economic foundation of the Northwest cannot withstand purely political campaigns that disregard the need for economic development. To avoid the losses to livelihoods caused by rash actions, we should preserve the kulak economy, refrain from expropriating middle peasants' land, and limit the scope of confiscating landlords' property. Land reform in newly liberated areas should proceed steadily and pragmatically."
 CPC_Strong_intervention: "Strongarm into Submission"
 CPC_Strong_intervention_desc: "The complete reform of the land system is one of the primary objectives of the New Democratic Revolution. We should center our mass movements around land reform, relying on farm laborers and poor peasants, uniting with middle peasants, restricting the kulaks, and protecting small and medium-sized industrial and commercial enterprises. The goal is to eliminate the landlord class and transform the feudal and semi-feudal land ownership system into a system of land ownership by the peasants."
 CPC_ease_the_relationship: "Ease the Tension"
 CPC_ease_the_relationship_desc: "The Front is situated in the northwest, where ethnic relations are highly intricate. Given the current circumstances, we should adopt a policy of appeasement to foster mutual understanding and respect among various ethnic groups. This approach aims to reduce misunderstandings and conflicts, thereby uniting the strength of all ethnicities to advance development and construction efforts."
 CPC_confirm_main_position: "Reassert Han Prerogative"
 CPC_confirm_main_position_desc: "The lessons of the rebellion remain vivid, and the chronic issues in southern Xinjiang require decisive measures. We should conduct extensive discussions, debates, and ideological education among Party members, cadres, and the masses, criticizing local nationalism and firmly adhering to the socialist path. At the same time, an appropriate anti-rightist struggle and internal Party rectification should be carried out to ensure the Party's leadership is effectively implemented in all minority regions."
 CPC_long_live_the_unity: "A Xibei United"
 CPC_long_live_the_unity_desc: "With the reconstruction of newly liberated areas and the conclusion of political work, the fragmented state of past united front efforts has become a thing of the past. The regional governments are now firmly united under the leadership of the central government, signifying not only a major victory in our strategic counteroffensive but also laying a solid foundation for the next phase of further development and construction."
 CPC_long_live_the_unity_trigger_tooltip: "The §Rshadows over Xinjiang§! have dispersed, and the §Yflames of war in Sichuan and Kangding§! have been extinguished."
 CPC_rebuild_trade: "Restart Foreign Trade"
 CPC_rebuild_trade_desc: "To overcome the challenges posed by economic blockades, we should promptly adjust our trade policies, actively expand domestic and international trade exchanges, and restore the Bureau of Supplies. The bureau will be responsible for the unified management of the Front's import-export trade, resources, and pricing, thereby achieving an economic breakthrough."
 CPC_oil_in_Lanzhou: "Lanzhou Oil & Chems"
 CPC_oil_in_Lanzhou_desc: "To alleviate the Front's insufficient refined oil production capacity and fill the technological gap in the petrochemical sector, the Central Committee has decided to develop Northwest oil fields and establish a refinery in Lanzhou."
 CPC_revisit_old_friends: "Rekindling old ties"
 CPC_revisit_old_friends_desc: "We share a profound bond with Liu Wenhui's Southwest Government, as both sides have been close comrades-in-arms during the Third United Front. The communication gaps caused by Ma Jiyuan's rebellion have now been completely resolved. Having assisted Liu Wenhui in achieving a monumental victory in unifying Sichuan, it is now time for him to fulfill his revolutionary commitments.\n\nMost of the reactionary leaders in Chengdu have been captured by the Xikang Army, while the Nationalist strongholds in Chongqing have fled inland. Liu Wenhui's officials have taken the lead in assuming control over local administrations. Over the next six months, the governments of Sichuan and Xikang will merge and restructure, abolishing warlord rule and returning a bright future to the people of Sichuan."
 CPC_push_collectivization: "Collectivise!"
 CPC_push_collectivization_desc: "Our cadres have already begun preliminary engagement with county governments across Sichuan. However, due to a shortage of personnel for southward operations, our influence on local governance remains limited in scope. Fortunately, we have another revolutionary organization we can rely on—our old friends from the Peasants and Workers' Union, founded by the late Huang Qixiang. The members of this organization have unanimously resolved to support our Party's work in local areas as dual-party members, aiding in rural reform and achieving the goal of land to the tiller.\n\nHowever, there is a faction that completely rejects the policies of the Northwest, wielding Nationalist propaganda materials to viciously attack our Party, Chairman Mao, and everything we stand for. With Sichuan now regarded by the Northwest as a newly liberated area, we have no reason to lose this political confrontation."
 CPC_evacuate_cities: "Reorganize the Cities"
 CPC_evacuate_cities_desc: "During the Nationalist rule, Sichuan suffered from prolonged administrative fragmentation, resulting in poor urban planning for major cities within the province. This led to a lack of essential infrastructure, disorganized cityscapes, and severe traffic congestion. Following the unification of provincial governance, the authority to plan and organize Sichuan's cities must be entrusted to representatives from the Northwest for centralized decision-making.\n\nAt the same time, to prevent potential retaliatory airstrikes from Japan or the Nationalist forces, we recommend that Liu Wenhui immediately prioritize the construction of urban air defense systems to ensure that such tragedies never occur again."
 CPC_everything_in_northwest_is_settled: "The Mongolian Question Resolved"
 CPC_everything_in_northwest_is_settled_desc: "The rebellion was quashed, allowing us to take a short break to carefully and conscientiously decide the direction of policy and carry out our next operation.\nHopefully, this rebellion will teach us some lessons."
 CPC_General_Ma: "The Karyu General Rides On"
 CPC_General_Ma_desc: "The ice and snow of the northern desert have already melted, and the schemes in the western regions have just been uncovered and defeated. At this opportune moment, we should inform General Ma to advance toward Dihua and carry out the complete liberation of Xinjiang."
 CPC_unite_ROS_1: "Mobilize the Uighurs"
 CPC_unite_ROS_1_desc: "Our Uyghur brothers, who control Northern Xinjiang, together with the Hotan Ma family, have formed a pincer movement against Sheng Shicai. Given the importance of the task of liberating Xinjiang, the Central Committee has decided to send a formal letter to Ili, ensuring that the reactionary Kuomintang forces fall into the inescapable net woven by the people of Xinjiang."
 CPC_add_our_chips: "Double the Bet"
 CPC_add_our_chips_desc: "The battles in Xinjiang are raging intensely, and both manpower and firearms are becoming increasingly scarce.\n\nThe Central Committee has decided to prepare a batch of supplies and deploy a certain number of troops to support our revolutionary comrades."
 CPC_support_xinjiang_brigade_1: "Support Xinjiang Brigade"
 CPC_support_xinjiang_brigade_1_desc: "Although the front has just restored order and corrected the chaos, supporting Xinjiang remains an unshirkable responsibility. Now that Sheng Shicai has shown his \"fist\" and exposed his \"chest,\" our strategy is to firmly hold his fist and deliver a decisive strike to his chest."
 CPC_unify_xinjiang: "Unify Xinjiang"
 CPC_unify_xinjiang_desc: "With the remaining reactionary forces completely expelled from Xinjiang, Southern and Northern Xinjiang will be integrated into a unified border region government under the guidance of comrades from the Xinjiang Bureau, enabling better restoration and development efforts."
 CPC_setting_old_scores_1: "Settling Old Scores"
 CPC_setting_old_scores_1_desc: "The Sheng family’s sins are beyond redemption, and the fate of the Ma family serves as a stark warning. While we bring the reactionary forces to justice, we must also pressure the Hetian Ma family and guide the Xinjiang Bureau to carry out grassroots work, ensuring that Xinjiang truly comes under the red flag."
 CPC_letter_to_Hetian: "Order to Hotan"
 CPC_letter_to_Hetian_desc: "The ice and snow of the northern desert have already melted, and the schemes in the western regions have just been uncovered and defeated. At this opportune moment, we should inform General Ma to advance toward Dihua and carry out the complete liberation of Xinjiang."
 CPC_unite_ROS_2: "Mobilize the Uighurs"
 CPC_unite_ROS_2_desc: "Our Uyghur brothers, who control Northern Xinjiang, together with the Hotan Ma family, have formed a pincer movement against Sheng Shicai. Given the importance of the task of liberating Xinjiang, the Central Committee has decided to send a formal letter to Ili, ensuring that the reactionary Kuomintang forces fall into the inescapable net woven by the people of Xinjiang."
 CPC_support_xinjiang_brigade_2: "Support Xinjiang Brigade"
 CPC_support_xinjiang_brigade_2_desc: "Although the front has just restored order and corrected the chaos, supporting Xinjiang remains an unshirkable responsibility. Now that Sheng Shicai has shown his \"fist\" and exposed his \"chest,\" our strategy is to firmly hold his fist and deliver a decisive strike to his chest."
 CPC_liberate_xinjiang: "Liberate Xinjiang"
 CPC_liberate_xinjiang_desc: "With the remaining reactionary forces completely expelled from Xinjiang, Southern and Northern Xinjiang will be integrated into a unified border region government under the guidance of comrades from the Xinjiang Bureau, enabling better restoration and development efforts."
 CPC_setting_old_scores_2: "Settling Old Scores"
 CPC_setting_old_scores_2_desc: "The Sheng family’s sins are beyond redemption, and the fate of the Ma family serves as a stark warning. While we bring the reactionary forces to justice, we must also pressure the Hetian Ma family and guide the Xinjiang Bureau to carry out grassroots work, ensuring that Xinjiang truly comes under the red flag."
 CPC_state_monopoly_of_purchasing_and_marketing: "Purchasing, marketing, in unification"
 CPC_state_monopoly_of_purchasing_and_marketing_desc: "The unified marketing and purchase are an effort by the Party Central Committee to support socialist industrial construction. Commune grain depots are required to sell surplus grain to the state at the central government's price, quantity, and variety. They can dispose of the unplanned grain by themselves after the surrender; the state plan ration supplies urban residents; non-state designated units are prohibited from selling without a permit."
 CPC_city_Su_Fan_movement: "Discount for Urban registered residence"
 CPC_city_Su_Fan_movement_desc: "Even during the Great Leap Forward, the scattered industries still absorbed more laborers than planned, employing more than 400,000 people in state-run factories in Shaanxi Province alone. Many employees had no labor tasks and became idle. The Party Central Committee decided to accept them as they were and to expand welfare coverage to maintain social stability.\nThe spouses and children of the employees of the enterprises who participated in the work could apply for urban hukou and live and study for three years before officially transferring them. During this period, if the three years cannot be completed due to force majeure, such as the death of a resident, etc., their stay or departure can be decided on a case-by-case basis upon confirmation by the local police station."
 CPC_PLA_announcement: "Declaration of the Chinese People's Liberation Army"
 CPC_PLA_announcement_desc: "The Chinese People's Liberation Army, having crushed the rebellion of the Ma Clique, has now launched a full-scale counteroffensive. Wherever our forces advance, the enemy flees in disarray, and the people erupt in jubilant celebration. Compared to a few years ago, the overall situation between the enemy and ourselves has undergone a fundamental transformation.\n\nComrades! We bear the most glorious mission in revolutionary history, and we must give it our all. The bright future of our motherland and the well-being of our fellow citizens depend on our struggle. All officers and soldiers of our army must always remember that we are the great People's Liberation Army, a force led by the great Communist Party of China. As long as we always follow the Party's directives, we are destined to achieve victory."
 CPC_PLA_reform_Mission_command: "Mission-Oriented Command Reform"
 CPC_PLA_reform_Mission_command_desc: "War is inherently uncertain. Therefore, senior commanders should grant subordinate units the autonomy to conduct operations, allowing them to fully exercise initiative, creativity, and flexibility. This approach ensures effective responses to the ever-changing complexities of the battlefield, enabling us to seize and maintain the initiative.\n\nFollowing this guiding principle, our military should promptly implement a command reform that focuses on clearly defining operational intentions, guidance, and objectives, without prescribing specific methods for accomplishing the tasks."
 CPC_PLA_reform_Centralized_command: "Centralized Command Reform"
 CPC_PLA_reform_Centralized_command_desc: "Our Party is the vanguard of the proletariat and the highest form of proletarian organization. It must lead all other organizations, including the military. Only by adhering to the centralized and unified leadership of the Party and coordinating the efforts of the Party, government, military, and civilians can we achieve victory in the War of Liberation.\n\nFollowing this guiding principle, our military should promptly implement reforms to establish clear command relationships, strengthen communication channels, and enable flexible adjustments to command methods."
 CPC_PLA_emphasize_military_democracy: "Emphasize Military Democracy"
 CPC_PLA_emphasize_military_democracy_desc: "During training, officers and soldiers engage in mutual teaching, and soldiers teach one another. In combat, various large and small meetings are held on the front lines within the company, focusing on specific combat missions. This approach mobilizes the involvement of soldiers, commanders, and all personnel, thereby enhancing the technical and tactical capabilities of the People's Liberation Army."
 CPC_PLA_newtype_reorg_movement: "The New Army Rectification Movement"
 CPC_PLA_newtype_reorg_movement_desc: "With the expansion of the liberated areas and the deepening of the land reform movement, a large influx of new social elements into the military has made the task of strengthening the army increasingly urgent.\n\nTo adapt to the demands of the war situation and the development of land reform and party rectification movements in the liberated areas, the Central Committee has decided to launch the New Army Rectification Movement. This initiative will focus on \"complaint expression,\" \"three investigations,\" and \"three rectifications\" to raise the political consciousness of newly enlisted soldiers."
 CPC_PLA_strengthen_military_staff_officer: "Strengthening the Staff Function"
 CPC_PLA_strengthen_military_staff_officer_desc: "To alleviate the shortcomings of centralized command, such as excessive dependence on higher levels, poor adaptability, and prolonged organizational response times, while improving the efficiency and quality of organizational decision-making, has made the importance of strengthening staff functions increasingly prominent.\n\nTo address this, the Central Committee has decided to enhance the qualifications of staff personnel, optimize the structure of staff organizations, and establish and improve staff systems."
 CPC_PLA_Regularization_of_the_PLA: "The Regularization of the People's Liberation Army"
 CPC_PLA_Regularization_of_the_PLA_desc: "From the era of the Eighth Route Army, we have relied on guerrilla warfare tactics to harass enemy rear positions in coordination with actions on the frontline battlefield. However, with the collapse of the frontline, the conditions for executing behind-the-enemy-lines guerrilla tactics no longer exist. In the foreseeable future, if we are to reignite the flames of resistance against the invaders, we will inevitably face direct confrontations with the enemy in the plains and hilly regions of the south. This necessitates our regularization to meet the demands of future anti-Japanese resistance."
 CPC_PLA_reorg_movement: "Strict military discipline"
 CPC_PLA_reorg_movement_desc: "Discipline is the key to victory, and strictness is the foundation of discipline. Only with strict discipline can the People's Army remain invincible.\n\nThe Three Main Rules of Discipline and Eight Points for Attention of the People's Army have been implemented for many years, though their content has varied slightly among different regions and units. A unified version is now formally issued. It shall serve as the standard, to be thoroughly taught and strictly enforced."
 CPC_PLA_emphasize_backend_construction: "Strengthen Rear Construction"
 CPC_PLA_emphasize_backend_construction_desc: "Stable logistical support is the cornerstone of smooth frontline operations. The Front should undertake comprehensive construction and preparation in areas such as the economy, transportation, communication, medical services, and material reserves in the military rear. This will enhance our army's overall defensive capabilities and wartime potential."
 CPC_PLA_military_academy_construction: "Military academy construction"
 CPC_PLA_military_academy_construction_desc: "At present, our army faces issues of irregular, unstandardized, and overly simplistic military academy education. Establishing a new batch of various institutions to train modern combat talent and forming a standardized military education system has become an urgent task in the development of the People's Army."
 CPC_PLA_regular_confrontation_exercises: "Routine Confrontation Exercises"
 CPC_PLA_regular_confrontation_exercises_desc: "In recent years, large-scale conflicts between our army and the enemy have been relatively rare. Our army should regularly conduct simulated attack and defense training exercises to enhance its responsiveness, identify, and resolve existing issues within the military."
 CPC_PLA_FOR_THE_FINAL_TRIUMPH: "For Final Victorty"
 CPC_PLA_FOR_THE_FINAL_TRIUMPH_desc: "Charge bravely and annihilate the enemy,\nShout loudly and awaken the people,\nCarry forward the fine traditions of the revolution,\nForge a modern revolutionary army,\nFor social well-being, for national survival,\nStrengthen unity and resolute struggle.\nRaise high the banner of independence and freedom for resistance and nation-building!\n\n— 1939, New Fourth Army Anthem"
 CPC_PLA_FOR_THE_NATIONAL_LIBERATION: "......For The China Liberation"
 CPC_PLA_FOR_THE_NATIONAL_LIBERATION_desc: "Our ranks march toward the sun,\nWith our feet upon the motherland’s soil.\nBearing the hopes of our nation,\nWe are an invincible force!\nWe are the valiant vanguard,\nWe are the people's armed strength.\nNever fearing, never yielding, always resisting,\nUntil we drive the invaders from our land,\nAnd the banner of freedom flies high!\n\n— 1939, *March of the Eighth Route Army*"
 CPC_message_from_east_mon: "Message from Xing'an"
 CPC_message_from_east_mon_desc: "Radio waves from the white mountains and black waters have brought thrilling news, yet how to handle this surviving spark has become a new challenge.\n\nThe Central Committee has decided that after gathering detailed information from the Anti-Japanese Allied Army representatives, a working conference will be convened to draft an action plan."
 CPC_rearrange_najua: "Reorganizing the Allied Army"
 CPC_rearrange_najua_desc: "Due to the harsh environment in which the Allied Army operates, the mixed composition of its members, and the difficulties in executing a westward retreat, the need for restructuring and reorganization of the army has become urgent.\n\nTherefore, the Military Commission recommends providing assistance and guidance for the reorganization of the Allied Army and organizing the westward retreat on a voluntary basis."
 CPC_rebuild_party_najua: "Rectify the Party Committee"
 CPC_rebuild_party_najua_desc: "For the sake of survival, after losing contact with the Central Committee, the Northeast Anti-Japanese United Army (NAJUA) had to drastically simplify political education while relocating to the relatively desolate Outer Manchuria. There, they allied with local Korean guerrilla forces and remnants of the Soviet Far Eastern Red Army.\n\nIt must be acknowledged that this was a necessary compromise. The NAJUA’s strategy was effective for surviving in the harsh yet perilous Outer Manchuria, but ultimately, it was not the correct path for the Communist Party to develop and mature.\n\nTherefore, we must conduct a thorough review and rectification of the Party organization within the NAJUA, ensuring that it eliminates the inevitable mistakes accumulated during its independent development period."
 CPC_corridor_between_yunnan_and_burma: "Yunnan-Burma Corridor"
 CPC_corridor_between_yunnan_and_burma_desc: "Burma, formerly a territory of British India, declared \"independence\" after the war with Japan's assistance, but in reality, it remains a puppet regime under Tokyo's control. According to reports from the Qiongya Column, a revolutionary armed force known as the \"Kachin People's Army\" has been operating in the eastern states of Burma for a long time and has been secretly receiving support from the Qiongya Column."
 CPC_victory_in_southeast_tt: "We have cast the dice engraved with the £CPC_texticon §Rhammer and sickle emblem§!, awaiting the verdict of §Yhistory and the people§!…"
 CPC_1968_mao_interior_ministry_desc: "Over the past few years, under the leadership of the Party, we have unified various systems across the entire Front. Finances have been centralized under a unified revenue and expenditure model, with allocations managed by the Central Committee. The counterinsurgency and counter-espionage struggles in the Northwest have gradually reformed public security departments at all levels, implementing the Fengqiao experience and improving the armed police system. The \"old, middle-aged, and young\" cadre structure has become the fundamental principle for leadership and talent cultivation, providing the Party and the Front with a large number of reliable and capable individuals. In terms of internal governance, we are now on par with any mainstream government."
 CPC_1968_liu_interior_ministry_desc: "Over the past few years, under the leadership of the Party, we have completed the professionalization of various systems across the entire Front. Finances have been centralized under a unified revenue and expenditure model, with allocations managed by the Central Committee. Police officers are now appointed with military ranks, streamlining administrative relations and clearly defining duties and responsibilities. Investments in education have been increased to cultivate expert cadres needed for national development, ensuring they serve as the backbone of leadership at all levels. In terms of internal governance, we are now on par with any mainstream government."
 CPC_1968_mao_industry_ministry_desc: "Over the past few years, the Front's primary fiscal expenditures have been directed towards rural areas, vigorously supporting commune and brigade enterprises. Rural industrialization has been advanced through the development of small-scale industries, while the \"Educated Youth Down to the Countryside\" movement has been utilized to enhance the quality of rural labor and the professionalization of industrial construction. Additionally, planned development of light industry has facilitated the proletarianization of the peasantry. Industrial production has been closely integrated with agricultural production, simultaneously meeting the daily needs of commune members while serving the Front’s large-scale industries and the socialist market."
 CPC_1968_liu_industry_ministry_desc: "Over the past few years, the Front’s primary fiscal priorities have been concentrated on investing in heavy industry. Small and medium-sized business owners were consolidated into large factories to develop economies of scale. The factory director responsibility system was implemented, strengthening the supervisory role of Party organizations. Labor competitions and production incentives were introduced, increasing the proportion of industry within the Front’s economy. As a result, numerous advanced socialist industrial and urban zones have been established, which in turn have supported agriculture through mechanization."
 CPC_1968_mao_agriculture_ministry_desc: "Only by first transforming the relations of production can we develop productive forces—farmers are actively committed to following the socialist path. The primary agricultural task has thus become the collectivization of communes to enhance productivity. The communes address the labor shortages and coordination issues faced by smaller cooperatives in constructing irrigation infrastructure. Mechanized farming and irrigated land have doubled annually, improving agricultural conditions and leading to a steady increase in grain production. Additionally, the communes have stabilized rural society, maintaining order in both production and daily life while generating funds to support the Front’s industrialization strategy."
 CPC_1968_liu_agriculture_ministry_desc: "Only by first transforming the relations of production can we develop productive forces, which necessitates further strengthening and refining the agricultural production responsibility system. These measures have corrected subjectivism in production guidance and egalitarianism in distribution. They have effectively mobilized farmers' enthusiasm for production, unlocked the potential of rural labor, and stimulated the rural market economy. As a result, agricultural production has rapidly recovered and developed, the vast majority of farmers have seen an increase in income, and the overall situation in rural areas continues to improve."
 CPC_military_reform_law_2_desc: "For the long-term development of £TER_texticon_PLA §Ythe Chinese People's Liberation Army§!, the £TER_texticon_NDF §YCentral Military Commission§! has assessed the situation and, based on the actual conditions of our military in the mid-1960s, formulated a comprehensive £TER_texticon_PLA §Ymilitary reform§! policy centered around §R“Centralized Command Reform”§!.\n\nThis reform emphasizes that the §xParty§! is the §Gvanguard of the proletariat§! and §Gthe highest form of proletarian organization§!, and it must lead all other organizations, including £TER_texticon_PLA §Ythe military§!. Only by upholding the Party’s centralized and unified leadership and coordinating the efforts of the §RParty§!, §Ggovernment§!, §Ymilitary§!, and §Scivilian§! sectors can we achieve the goal of §mmilitary modernization§!.\n\nAdditionally, our military reform will address §mmulti-branch specialization§!, §Ystrategic support integration§!, and §Rdisciplinary enforcement within the ranks§!. We firmly believe that these effective reform measures will enhance our military’s §Gcombat capabilities§!, help us §machieve modernization goals§!, and §Ssecure the final victory§! in the §xliberation of all China§!!."
 Agency_CPC: "Central Investigation Department"
 CPC_CD_easy_mode_1_tt: "After unlocking the §GNorthwest Bureau§! mechanism, all regional §Ysix major tasks§! will immediately reach §Gmax level§!."
 TER_MRC_phase_4_2_tt: "This option will have the following effects:\n\n- After the successful conclusion of the peace talks, §YInner Mongolia§! will remain under §GChinese§! control.\n\n- If §YMongolian Autonomous Region§! was previously chosen, this option will be §Runavailable§!.\n- If §YChina-Mongolian Federation§! was previously chosen, Inner Mongolia will be considered a §Yfederal territory§! and will have §Yunique territorial modifiers§!.\n- If §YEstablishing a Sovereign Republics Union§!, meaning §Yrecognizing Mongolia's independence§!, was previously chosen, then after the national liberation, Inner Mongolia's governance will be transferred to §Y[MON.GetFlag][MON.GetName]§!."
 CPC_phase_3_Lin_long: "Communist Party of China §F\n--------------\nPresident of the State: §LLin Biao§!\nChairman of the Central Committee: §LLin Biao§!\nMembers of the Politburo:\n§LLin Biao§!, §GZhu De§!, §YDeng Xiaoping§!, §YChen Yun§!, §R Zhou Yang§!, §GJiang Qing§!, §YXi Zhongxun§!, §GWang Renzhong§!, §GLiu Jianxun§!, §YWan Li§!, §GZhang Chunqiao§!, §LLi Zuopeng§!, §LWu Faxian§!, §LQiu Huizuo§!, §LXiao Jinguang§!\n\nGeneral Secretary of the Central Secretariat: §YDeng Xiaoping§!§!"
