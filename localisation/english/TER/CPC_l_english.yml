 CPC_cet_1: "Our Party's troops are not as good as they used to be. We must be careful!"
 CPC_cet_2: "With the resolution of the Xinjiang issue, we will get through the toughest period!"
 CPC_cet_3: "§xThis will undoubtedly make the already fraught ethnic relations between China and Mongolia even worse - if we want to use force against Mongolia, we had best make the requisite preparations.\n§!"
 CPC_cet_4: "The Mongolia issue will finally finish, §xwhatever it costs...§!"
 CPC_cet_5: "We no longer have the right to intervene in the future of Xinjiang, and we will devote our remaining energy to other matters."
