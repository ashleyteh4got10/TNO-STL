 CPC_punish_mao: "Intra-Party Disciplinary Action: §GMao's Faction§!"
 CPC_punish_mao_desc: "This faction is being disciplined, reflecting on their mistakes.\nIn addition, to curb the effects of this faction's poor decisions, §Y150M§! has been added to our Liquid Reserves."
