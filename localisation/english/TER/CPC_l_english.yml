 CPC_separatist_forces: "Separatist Force"
 CPC_unify: "Candidate for the United Front"
 CPC_reorganize_army: "Study New War Tactics"
 CPC_reorganize_army_desc: "After the Great War, the entire continent fell into recession, and the base was struggling. Poverty and prolonged war preparations caused unstoppable trauma to people. In addition, the armament and tactics are out of date and are also gradually being abandoned. The Party Central Committee is worried about the sudden response to the war now. I hope it is not too late for us to sharpen our guns."
 CPC_no_robbing: "Reiterate the Three Principles"
 CPC_no_robbing_desc: "The \"Three Disciplines and Eight Attention\" rules are actually very simple requirements, but our soldiers are not all saints. They have their own families to take care of, and if the army cannot provide for them, the soldiers have to find another way to make a living, such as taking some property from civilians (whether they are farmers or wealthy landowners). Repeated warnings can only have temporary effects, and cannot control behavior in the long term."
 CPC_catpture_return_to_the_public: "Turn In Seized Weapons"
 CPC_catpture_return_to_the_public_desc: "Strictly register the soldiers' loot, filling the record roll with detailed information on the place and time of seizure and the guarantor. If it is a found unclaimed item, it needs to be listed separately, approved the price, and paid at the price if the owner comes to claim it later."
 CPC_kill_one_as_warning: "Execute One, Warn a Hundred"
 CPC_kill_one_as_warning_desc: "Although the central government has repeatedly emphasized the need to strictly enforce military discipline, soldiers in our ranks openly defy the \"Three Disciplines and Eight Attention\" rules.\n\nOrders have already been issued: those who break the law as individuals will be severely punished, and those who commit offenses as a group will be strictly dealt with!"
 CPC_training_cavalry: "Train the Cavalrymen"
 CPC_training_cavalry_desc: "Cavalry temporarily trained units were confused in their fighting methods and were destroyed at first touch. We can only seek training by war, train while fighting, and select the best from the best."
 CPC_outflank_fight: "Outflank the Enemy"
 CPC_outflank_fight_desc: "As a rare mobile arm, cavalry is not main troop, but if used correctly, it can also surprise and win."
 CPC_cyclone_company: "The Tornado Company"
 CPC_cyclone_company_desc: "Through screening, we finally worked out a cavalry unit that can still fight, but this unique period of practice can not be continued but must be another long-term plan."
 CPC_kill_for_award: "Award Those Who Kill the Enemy"
 CPC_kill_for_award_desc: "Blank checks will only drag down the military discipline. So put aside false promises, treat soldiers as ordinary people who need to feed their families, and enforce the military reward and punishment system thoroughly. Anyone who kills one enemy can be reported centrally by the establishment and receive a reward of varying amounts."
 CPC_charge_for_award: "Award Those Who Charge First"
 CPC_charge_for_award_desc: "Anyone who dares to be the first to charge should also be honored, but someone must prove it."
 CPC_avant_garde_company: "Pioneer Company"
 CPC_avant_garde_company_desc: "We grouped veterans with long experience on the battlefield into a company or a platoon and turned them into a sharp knife to pierce the enemy's defense line."
 CPC_build_guns: "Intensify Rifle Production"
 CPC_build_guns_desc: "Fire up the boiler, burn red charcoal fire, and the arsenal to start work again."
 CPC_material_control: "Supply Restrictions"
 CPC_material_control_desc: "Cut off all supplies to Qinghai. Qinghai is barren and lacks our supplies, so let's see how long they can last."
 CPC_catch_up_with_work_and_time: "Beat the Clock, Seize Our Time"
 CPC_catch_up_with_work_and_time_desc: "The sudden war has made it difficult for us to cope with a such large demand for orders for a while, so make sure workers work overtime to complete the production target."
 CPC_demand_quantity_but_not_quality: "Quantity Over Quality"
 CPC_demand_quantity_but_not_quality_desc: "Currently, weapons production is only required to ensure the quantity. The quality can only take a back seat, which is helpless."
 CPC_stable_rear: "Stabilize Society"
 CPC_stable_rear_desc: "It was time to break the useless wartime system, tense up and unite the people, and convince them that the war with the Ma Clique was the first step to pry up the situation in China. Only victory could win the future of the base."
 CPC_send_more_sentries: "Dispatch More Guards"
 CPC_send_more_sentries_desc: "All villages and communes should beware of the reactionary propaganda and sabotage activities of the spies of the Ma's Army, intensify prevention and investigation, and report immediately when they encounter suspicious people."
 CPC_village_joint_insurance: "Joint-Defence Villages"
 CPC_village_joint_insurance_desc: "In each village, each commune, in proportion to the number of people in the armed forces, the formation of patrols on time and at various places patrol to fill the rear security forces."
 CPC_shot_the_first_bird: "Singing Bird Gets Shot"
 CPC_shot_the_first_bird_desc: "Each village and commune can set up a trial office on the spot to interrogate suspicious people before the police arrive to obtain information and deter the rest of the saboteurs."
 CPC_open_market_in_Bao_Tou: "Markets for Baotou"
 CPC_open_market_in_Bao_Tou_desc: "Baotou is necessary transportation at the border, but also the stay of business people. But in recent decades, the war blocked the commercial road several extinct. Now that we have opened the road to Mongolia, the next step should be to revive the Baotou market, encourage merchants to trade, and enrich the base's financial income."
 CPC_military_factory_in_Tian_Shui: "The Tianshui Armoury"
 CPC_military_factory_in_Tian_Shui_desc: "With Sichuan Midland liberated, the Central Comittee has decreed the arsenals in Northwestern hinterland be relocated to Tianshui and local ordnance depots and warehouses be built up so as to streamline logistics."
 CPC_quilt_factory_in_Xian_Yang: "Xianyang Clothing Factory"
 CPC_quilt_factory_in_Xian_Yang_desc: "Tianshan Mountains in Xinjiang are rich in water and grass, suitable for cotton cultivation and sheep grazing. The cotton and wool produced are essential raw materials for the textile industry and can be acquired to weave into clothes and hats. The expansion of the quilt factory is beneficial to both ourselves and each other."
 CPC_factories_in_Tong_Guan: "Tongguan Machine Factory"
 CPC_factories_in_Tong_Guan_desc: "Xi'an, the first significant city occupied by the Front, was economically affluent, industrially developed, surrounded by sublime mountains and passes that were easy to defend, and the closest to the mainland. Therefore, after the situation stabilized, the central government moved the scattered military factories in Shaanxi to Xi'an, concentrated them, and expanded them."
 CPC_Xian_university: "Xi'an University"
 CPC_Xian_university_desc: "After listening extensively to the suggestions of the educational community, the comrades in charge of the central government decided to establish a new university in Xi'an to train highly qualified personnel and integrate scientific research forces."
 CPC_field_investigation_movement: "Land Census"
 CPC_field_investigation_movement_desc: "Since the great chaos of the 1950s, we have not had time to update economic data for a long time, especially the farmland occupation in each county and village. The multiple forms of ownership are a mess, making it challenging to implement a unified policy and causing even more waste of resources, which is not conducive to development. It is necessary to find out the situation of the fields within three months so as not to delay production."
 CPC_dig_canals: "Digging Canals"
 CPC_dig_canals_desc: "Taohe and Huangshui are two important rivers of the Yellow River. Huangshui is in Qinghai, and Taohe flows through Qinghai and Gansu. Two rivers in history for a long time played a critical task in irrigation water. It is a pity that Ma Clique cannot manage to repair it. Now that the base has taken over this area, the heavy responsibility of governing water naturally falls. We should mobilize the local people, under the leadership of our party, to repair the river, eliminate the disaster, and develop production."
 CPC_seed_improvement: "Improving Our Crops"
 CPC_seed_improvement_desc: "Wheat, millet, sorghum, corn, and sweet potatoes, all of these are important food crops for us, and now, the intensive farming of peasants is no longer enough to increase yields for food, and the power of science is urgently needed to join. We have Soviet experts, and the agronomists among them will set up an institute to work with our researchers to improve crops."
 CPC_experiment_in_bend_of_Yellow_river: "The Ordos Loop Experiments"
 CPC_experiment_in_bend_of_Yellow_river_desc: "The constant flow of river sediment and ideal irrigation conditions have made it a thousand hectares of good land, a key farming area for the base area. Now, the Institute of Agricultural Research has come to the bond to select experimental fields for improved seeds, and the seedlings have been planted and are just waiting to blossom and bear fruit."
 CPC_say_goodbye_to_poor_base: "Goodbye, Poverty!"
 CPC_say_goodbye_to_poor_base_desc: "Although our base area is not too vast, the situation is highly complicated. In the newly liberated areas, because the liberation is still only a few months, six months, or a year away, the local land issue has not been effectively solved, and industry and commerce have not been reasonably adjusted. However, we have already passed through the most challenging times and stabilized almost a quarter of China. We believe that the Party is still vibrant and that reactionary forces have not ended the Chinese revolution."
 CPC_say_goodbye_to_Vasilevsky: "With the victory revolution of §YMongolia§!,§YMarshal Vasilevsky and his soldiers§! will leave west Mongolia, §Rfighting in the fragmented Russian regions§! - the future fate of Russia will be none of our business."
 CPC_block_barn: "Blockade Barns"
 CPC_designate_committee: "Designated Han Party Committees"
 CPC_designate_committee_desc: "If we continue to give up the right to appoint and dismiss local party committees after one rebellion, the party regime will never be indeed at peace!"
 CPC_committee_election: "Party committee recommended by local government"
 CPC_committee_election_desc: "We should not be trapped by identity differences and create unnecessary crisis of confidence in other ethnic groups. Since we can actively use democratic methods to establish local governments, there is no need for us to separately apply any rigid policy of regional ethnic autonomy.\nIt is the duty of communists to fulfill the principles of party democracy and to keep our promises to the people."
 CPC_Foreclosure_land: "Land Redemption"
 CPC_Foreclosure_land_desc: "The fragile economic base of the Northwest cannot withstand purely political campaigns that ignore the need for economic development, and specific local cadres have found that in those tribes that are too poor, landlords and tenant farmers have reconciled in the face of the pressure to survive and have built relationships that are dependent on each other. We should not break them up roughly but guide this business model to transform slowly."
 CPC_radical_land_reform_goal: "Coercive Reforms"
 CPC_radical_land_reform_goal_desc: "The peasants used the theory of \"karma\" to explain what the dictatorship of the proletariat is, but it is doubtful whether this is scientific.\nMoreover, our local cadres were happy to follow the \"public opinion\" to mobilize the poor peasants to fight against the landlords and did not set the standard of land distribution according to the local conditions, so it was inevitable that mistakes would occur."
 CPC_ineffectual_remedy: "A Stopgap Measure"
 CPC_ineffectual_remedy_desc: "One more gathering, one more risk of unrest. Immediately stop all religious activities. Seal off the mosques, confiscate all Islamic reactionary propaganda materials, and centrally destroy religious books and items. Eradicate the roots of reaction once and for all.\n\nHowever, this would consume too much government energy to resolve these issues."
 CPC_deny_allah: "Liberate the God"
 CPC_deny_allah_desc: "The Ma Clique's Rebellion is a lesson from the past - you can't use brute force to change people's minds.\n\nInstead, we should do a lot of persuasive and educational work with our Muslim compatriots - we do not deny morality, nor do we discourage the faithful from seeking a better life, but instead we make people realize the reactionary nature of religion as a tool of the ruling class to enslave the masses."
 CPC_political_honesty: "Political Honesty"
 CPC_political_honesty_desc: "Sincerely treating friends, which is the party's consensus, will lead us to harvest the best friendship."
 CPC_political_practicality: "Political Practicality"
 CPC_political_practicality_desc: "It is the party's consensus not to use those who do not benefit to us, and this will lead us to reap the most glorious victory."
 CPC_eighth_national_congress_tree: "8th Congress"
 CPC_new_land_reform: "New Land Reform"
 CPC_new_land_reform_desc: "Many newly liberated areas have not yet started land reform, and the Party Central Committee has issued instructions: Where land reform has finished, We must protect the peasants' right to use the land they have acquired. In areas where land reform has not been carried out, we must mobilize the peasants, peasant groups must be established, and through such steps as removing bandits and bullies, reducing rents and interest rates, and distributing land, the peasants must have their land"
 CPC_Cooperative: "Found Cooperatives"
 CPC_Cooperative_desc: "Under the leadership of the Party, a large number of cooperatives have been organized through various forms of mutual aid and cooperation to promote the collectivization of agriculture. We believe that this strategy is sound and practical. Given the current economic base of the liberated areas, we need to put forward a moderate proposal at the 8th National Congress that will not frustrate the peasants' enthusiasm."
 CPC_anti_rash_advance: "Anti-Adventurism"
 CPC_anti_rash_advance_desc: "Some comrades in the Party showed abnormal fanaticism and adventurism on the issue of agriculture. They thought that the Central Committee's decision of steady reform was \"not thorough enough\" and \"leaving opportunities for capitalist restoration\", which had been proved wrong by reality as early as the Great Leap Forward period, and the Central Committee decided to launch an anti-adventurous campaign in the Party during the Eighth Congress, focusing on combating the abnormal fanaticism and adventurism of these people."
 CPC_step_further: "Go a Step Further"
 CPC_step_further_desc: "Some comrades questioned our achievements in socialist construction, arguing that the Party should not be too hasty in collectivizing agriculture and that the most urgent task was to establish cooperatives first in the newly liberated areas. In short, we believe that these views are one-sided and can even be described as right-leaning and that we need to build on our existing agricultural achievements and propose at the 8th Congress a program to strike while the iron is hot and ride the wave of socialism in the base areas."
 CPC_cleaning_party: "The Four Cleanups"
 CPC_cleaning_party_desc: "The Four Clean-ups means clean politics, organization, economics, and thought. Some comrades in the Party believed that the Central Committee's decision to take advantage of the hot iron to pursue the victory was \"leftist\" and \"a reckless move that was too adventurous,\" which had been proved to be flawed since the liberation of Sichuan, and the Central Committee decided to launch the Four Clean-ups during the 8th Congress, focusing on combating the revolutionary pessimism of these people. "
 CPC_city_first: "Urban Primacy"
 CPC_city_first_desc: "Although our party is a worker-peasant alliance, we find that the old formulation of the Great Leap Forward Era of combining workers and peasants has resulted in \"workers and peasants together in poverty,\" and we will propose at the 8th National Congress to give priority to guarantee the livelihood of urban households.\nSuppose it is impossible to strengthen the industrial-agricultural scissors as the established national policy at the 8th National Congress and make one of our fists bigger and harder first. In that case, we think the dilemma of industrial-agricultural and poor will continue..."
 CPC_strengthen_central_plan_committee: "Strengthen Central Planning"
 CPC_strengthen_central_plan_committee_desc: "The Central Planning and Economic Committee is important for the Party and the front to guide the economic development of the liberated areas. At the 8th National Congress, we should strengthen the functions of the Central Planning Committee and plan the economic work of the newly liberated areas together."
 CPC_country_equals_to_city: "Bring the Cities to the Countryside"
 CPC_country_equals_to_city_desc: "Our party is a worker-peasant alliance, and in economic construction, it is right to follow the general program of workers and peasants. Therefore, we will continue to adhere to the fair policy of convergence between urban and rural residents in the 8th Congress, without specialization or differentiation."
 CPC_take_full_responsibility: "Bestowing Responsibility"
 CPC_take_full_responsibility_desc: "As the people's governments of the newly liberated large areas have only just been established, the Party and the Front do not yet have the capacity to establish complete and reliable economic organizations at the grassroots level, so we have to ask the people in the base areas to bear their profits and losses."
 CPC_make_money_first: "First, Make Money"
 CPC_make_money_first_desc: "According to an old saying, the purpose of the CPC can be loosely described as \"hiding wealth with the people. Only when people's lives are affluent can the Party and the front work better."
 CPC_accumulate_first: "First, Accumulation"
 CPC_accumulate_first_desc: "The National Defence Front is the heritage of the anti-Japanese national united Front. We must speed up industrial construction and strengthen our industrial accumulation capacity before the Front can accumulate enough strength to thrash the Japanese invaders and traitorous lackeys."
 CPC_national_autonomy: "National Autonomy"
 CPC_national_autonomy_desc: "In the past, the Party's ethnic and religious policies have deviated, culminating in the tragedy of the Ma Jiyuan rebellion. In the new era, we should adhere to the policy of ethnic autonomy and take practical action in exchange for the recognition and respect of the minority masses."
 CPC_culture_protection: "Cultural Protection"
 CPC_culture_protection_desc: "Recently, some ethnic minority people have taken advantage of the timing of the 8th National Congress to maliciously attack the Party Central Committee, attacking the Party Central Committee's ethnic policy as \"Great Hanism\" and \"dictatorship\".This small group of reactionaries must be deeply beaten up to deter other separatist forces!"
 CPC_rebuild_red_army: "Rebuild the Red Army"
 CPC_rebuild_red_army_desc: "The basis on which we liberated areas is the PLA, which is also an essential organization for the Party and the Front to assist the people in their productive work. We must clarify the positioning of the PLA in the new era so that it can better serve the people."
 CPC_lead_of_our_party: "Party Leadership"
 CPC_lead_of_our_party_desc: "Adhering to the leadership of the Party is the essential principle for us to accomplish the excellent task of reunifying China and the magic weapon for the perpetual revolutionary vitality of our front. In this new period, it is all the more important to adhere to the leadership of the Party on all shows and to respond to our future internal and external affairs with strict organizational discipline and great Maoism."
 CPC_break_the_sphere_lock: "Break the Blockade"
 CPC_break_the_sphere_lock_desc: "The blockade by Japan and its puppets once caused our front to fall into embarrassment and even on the verge of extinction. Still, we have not only survived, but our liberated areas have also expanded, we can break the blockade of the Co-Prosperity Sphere. In the new period, we have to put the critical task of breaking the blocking of the Co-Prosperity Sphere on our schedule."
 CPC_a_new_peak: "Reaching New Heights"
 CPC_a_new_peak_desc: "The 8th Congress will soon come to an end. The front has ushered in a new round of socialist climax. In the recent period, we will take Marxism-Leninism-Maoism as the theoretical core of the Party, hold high the three red flags do not fall, and muster all the energy to produce more and faster to reach socialism."
 CPC_phase_2_Mao_tree: "Chairman Mao's Policy"
 CPC_rural_commsearization: "Rural Collectivization"
 CPC_rural_commsearization_desc: "We have recovered from the setback of the Great Leap Forward. It is undeniable that implementing a full-scale people's commune under the historical conditions and economic base at that time brought some harmful effects. We recognized the mistakes, actively corrected them, and achieved economic recovery. Now it is time to rely on the people, mobilize the masses, focus on developing collectivization and meet the next socialist climax!"
 CPC_big_community_is_preferred: "Emphasize Large Communes"
 CPC_big_community_is_preferred_desc: "Found big community, turn to commune must be closely integrated with the current production, not only can not affect the current production but also to make this movement a considerable force to promote the production of a more significant leap forward. The scale of the organization of the community, for the time being, generally speaking, a township, a community, about two thousand households, is more appropriate in some places where the vast and sparsely populated countryside, there can be less than 2,000 families and several communities in one township. Some areas, according to the natural terrain conditions and product development needs, can also be merged from several townships into a township, a community of about 6,000 to 7,000 families. As for reaching 10,000 families or more than 20,000 families, do not go against it."
 CPC_wage_system: "Wage System"
 CPC_wage_system_desc: "Traditionally, farmers think that all the grain collected from their land should belong to them. However, after the collectivization of agriculture, the land is collectively owned, and labor is also collectively divided, so it is difficult for farmers to define which field is their own and which stone of grain is their own. As the labor motivation of each member was at stake, the commune management needed to settle wages for labor, assess wage levels, and issue fixed salaries according to the classes to avoid the proliferation of the erroneous idea of absolute egalitarianism among commune members."
 CPC_team_settlement: "Production Team Collaboration"
 CPC_team_settlement_desc: "Currently, the ownership system of the people's commune, in addition to the part directly owned by the commune, also includes the ownership system of production brigades and teams. It is the ownership system of production teams (in some places, production brigades, roughly equivalent to the former senior agricultural production cooperatives). Changing from basically production brigade ownership to communal ownership, as Chairman Mao pointed out, requires a more robust economics in the commune and a roughly balanced level of economic development of the various production brigades, which requires a development process."
 CPC_grain_hard_indicator: "Implement Firm Grain Quotas"
 CPC_grain_hard_indicator_desc: "The commune of collective labor has laid a solid foundation for the steady improvement of total grain production capacity, which has strongly supported the supply of agricultural products in the base area. In the plains, the average acreage yield is striving to reach 100 Kg; in the mountains, it is seeking to get 35 to 50 Kg. The proportion of wheat, millet, sorghum, etc. in grain production needs to be increased, and the absolute number of corn production, except in areas where cultivation is excessively concentrated, generally should not be reduced and also be prepared to replant some potato crops when necessary."
 CPC_farmers: "Encourage Part-Time Agriculture"
 CPC_farmers_desc: "The central government currently does not object to the commune planting other crops outside of the guaranteed completion of the grain production program to improve the livelihood of the commune members. At the same time, the central government encourages communes to explore side businesses, including forestry, baths, orchards, livestock farms, etc., making these enterprises an essential source of expanding communal accumulation for cultural and welfare projects such as commune-run schools and hospitals."
 CPC_factory_docking: "Promote Multi-Factory Cooperation"
 CPC_factory_docking_desc: "Every month, representatives of state-run factories go to the countryside and hold exchange meetings with representatives of commune members, throwing demand and supply at each other and engaging in direct material exchange."
 CPC_supply_and_marketing_agency: "Logistical Cooperatives"
 CPC_supply_and_marketing_agency_desc: "Supply and Marketing Cooperative is an essential part of the people's commune and is a transit point for transferring and exchanging various resources. The centralized purchase and sale of food depend on the supply and marketing agency, and urban goods distribution depends on the supply and marketing agency. We should expand the functions of the supply and marketing agency to further develop the exchange of materials between urban and rural areas, promote cooperation as the center of the agricultural production movement, and support the industrialization of the base areas."
 CPC_cancel_three_one: "Abolish \"Three Freedoms, One Guarantee\""
 CPC_cancel_three_one_desc: "Given the vast size of our base area and the existence of classes, various bourgeois, feudal, and decadent peasant ideologies are bound to emerge. The \"Three for one\" and \"work alone\" are the most prominent symbols. And now, the fierce class struggle has penetrated the part to eliminate the source of corruption wholly and immediately abolish the \"Three for one\" in production."
 CPC_socialist_education: "Socialist Education Movement"
 CPC_socialist_education_desc: "The problems to be solved by launching a socialist education campaign in the countryside were divided into two main areas.\nOne is to investigate and solve the new difficulties that have arisen after the completion of agricultural collectivization, to coordinate the coexistence between communes and the economic problems that have occurred within the communes. To clean up the various accounts since the establishment of the people's communes, to settle the old versions, and establish new ones.\nThe other one is the focus of this movement, \"clearing politics, economy, organization, and thought.\" Class struggle, a grasp of the spirit. To counter-revision and prevent counter-revolutionary usurpation of power, we should implement a long-term, extensive and far-reaching campaign in rural areas to liquidate all kinds of reactionary tendencies arising from the three years of economic difficulties."
 CPC_anti_corruption: "Fight Corruption!"
 CPC_anti_corruption_desc: "Anti-corruption is an essential initiative against corrupt elements. Along with the liberalization of the economy after the Great Leap Forward, some cadres are corrupt, and some are now being bribed to become accomplices of counter-revolutionaries with just three pounds of pork and a few packs of paper cigarettes and must be dealt with severely."
 CPC_abundance: "Fight Waste!"
 CPC_abundance_desc: "During the Great Leap Forward, the working group went to the countryside and found that the organizers of the senior commune did not know how to run the business and wasted food and materials at will, thus aggravating the labor apportionment among the society members and the central government decided to put an end to this phenomenon."
 CPC_bright_bureaucracy: "Fight Bureaucratism!"
 CPC_bright_bureaucracy_desc: "Bureaucracy has been a persistent problem in feudal society, even for us. It is necessary to launch an anti-bureaucracy campaign and crack down on those cadres who have developed the habit of \"officialdom.\""
 CPC_anti_revisionism: "Fight Revisionism!"
 CPC_anti_revisionism_desc: "Where do people get their correct ideas from? In social practice, the three practices of social production struggle, class struggle and scientific experiments. And many of our senior and middle-level cadres have forgotten the class struggle. This is not good.\nLeninism and Bukharinism were two \"knives\" that could be used to fight the enemy, but the Russians have thrown away both of them, and some of them have even taken them up to destroy the Soviet Union. This was the result of Bukharin's inattention to the revisionist tendencies in the Party, which led to the emergence of such counter-revolutionary ambitious people as Vasilevsky and Tukhachevsky.\nChairman Mao did not want the Party to go about learning from such people, to vilify Bukharin, but to act on the actual situation."
 CPC_new_name_word: "New Label: \"Capitalist-Roader\""
 CPC_new_name_word_desc: "There are severe and acute class struggles in both urban and rural China. After We completed the socialist transformation of the ownership system, the class enemies who opposed socialism tried to restore capitalism using \"peaceful evolution.\" The focus of the socialist movement is to rectify those in power in the Party who have taken the capitalist road and to consolidate further and develop socialist positions in urban and rural areas. As long as the Party continues to implement the decisions of the Party Central Committee on the socialist education movement more thoroughly and correctly and grasps the outline of class struggle and the system of the battle between the two roads of socialism and capitalism, it will not be challenging to find and clear the capitalists."
 CPC_socialist_agriculture: "Socialist Agriculture"
 CPC_socialist_agriculture_desc: "After basically defeating the capitalist economically, politically, and ideologically, the base developed a new basis for the relatively stable development of agricultural production by creating farmland construction on an unprecedented scale. After overcoming the right-leaning conservative ideology and breaking the bottleneck of agricultural technology, a situation of leaps and bounds in agricultural production emerged, with the output of farming products increasing exponentially, several times, dozens, and tens of times, which further promoted the liberation of people's minds. In the struggle for a good agricultural harvest, a great collaboration broke the boundaries of the community, township, and county, and militarization of organization, combat of action, and collectivization of life became an expected mass behavior.\nAll these achievements enable us to solemnly declare that a new socialist agricultural climax is coming to the whole base area with unstoppable momentum."
 CPC_equity_recovery: "Recovering Equity"
 CPC_equity_recovery_desc: "In 1955, the gradual public-private partnership transformation of private industry and commerce began in the base area, and we acquired the management rights of most of the enterprises. The capitalists still received year-end dividends (i.e., turnover) for their shares without compensation. Due to the United Front policy during the economic difficulties, the central government did not terminate the contracts according to the ten-year agreement, and this overhead continues to this day. Now that there is no place for the old or new bourgeoisie in the general line of socialist construction, it is imperative to outlaw the private economy and lay the groundwork for the next step in the base."
 CPC_industrial_collective: "Industrial Collectivization"
 CPC_industrial_collective_desc: "In the late 1940s, in response to possible invasion by the Wang False Regime and air raids, the central government decided to evacuate industries from Xi'an, Xianyang, Baoji, and Weinan, and since then, has experienced multiple turmoil's making it difficult for the central government to manage actual production in each area. Thanks to the end of the chaos, we can now have a clearer picture of the geographical distribution of factories and handicraft workshops. We are ready to consolidate most industries together and concentrate our economic strength."
 CPC_unified_production_criterion_Mao: "Uniform Production Standards"
 CPC_unified_production_criterion_Mao_desc: "The transformation of the public economy for the base has broken the industrial barriers. The future bottom may have to oversee dozens of hundreds of enterprises to produce together, the degree of socialization of production is getting higher and higher, the technical requirements are more and more complex, and production collaboration will become more extensive. Therefore, production standardization, standardization of social production activities, and the adoption of unified, scientific, and rigorous production guidelines are Vare."
 CPC_go_to_the_mountains_and_the_countryside: "Down to the Countryside"
 CPC_go_to_the_mountains_and_the_countryside_desc: "Even during the Great Leap Forward, scattered industries still absorbed more laborers than planned, with more than 400,000 people employed in state-run factories in Shaanxi Province alone. Many employees without labor assignments became idle. In contrast, there is more demand in the countryside, and these people should be called upon to build socialism in the country, to be re-educated by the poor peasants, and to exercise themselves."
 CPC_beating_exercise: "The \"Strike Hard\" Campaign"
 CPC_beating_exercise_desc: "Many young and robust laborers were stranded in urban factories, institutions, and schools during the Great Leap Forward period. Some of these harmful idle elements began to make a living by breaking the law. These hooligans, with the arrogant idea that \"Serious laws are not violated, but ordinary laws are always violated,\" have caused a significantly harmful impact on the social atmosphere and law and order. And women dare not walk at night, and parents dare not let their children go out on the street. The central government has made up its mind to rely on the masses of people to eradicate these black sheep."
 CPC_factory_community_construction: "Construct Industrial Communities"
 CPC_factory_community_construction_desc: "The factory-yard community, or urban people's commune, will become an instrument for transforming the old city and building the new socialist city, a unified organizer of production, exchange, distribution, and people's welfare, and a social organization that unites the government and the community. It is organized under the leadership of the party committee and active sponsorship of the masses of workers, with the workers' families and other working people as the main body and all others who voluntarily participate. It is centered on organizing production and, simultaneously, organizing various communal life welfare and service undertakings. It can significantly change the face of the city, especially the vast number of homemakers."
 CPC_labor_protection_compensation_Mao: "Workplace Safety Compensation"
 CPC_labor_protection_compensation_Mao_desc: "For workers, labor protection is the fundamental guarantee for their health maintenance, work efficiency improvement, and labor value creation. Various labor protection measures are developed to prevent work-related accidents and various occupational diseases according to the survival and development of the local economy."
 CPC_anti_economicist_black_wind: "Anti-Economism Movement"
 CPC_anti_economicist_black_wind_desc: "Many workers, misguided by economism and want of excessive welfare, attacked the Party Central Committee in face of most dire economic situation in the base area and viciously denigrated the general line of socialist construction under the leadership of Chairman Mao, which we severely criticized at that time.\nWhether the workers' demands and the labor system was reasonable is always open to discussion. However, as the socialist construction reach a new height, a renewed attempt of reactionaries baiting on the economist slogan \"Less Work and More Bucks\" threatens to derail the economic development. The revolutionary working class as well as the All-Union Labor Association of Xi'an have been mobilized against this economic sabotage, decrying its capitalist root."
 CPC_expand_product_release: "Expand Commodity Production"
 CPC_expand_product_release_desc: "The economic situation gradually improved to enrich the variety of urban residents' consumption and the proletariat's daily life of food and clothing. The central government decided to unblock the list of goods available on the shelves of the first state store in Baoji and the second state store in Xianyang, several people's favorite goods.\nThe government will issue \"shopping cards\" to the residents, the standard of issuance of a household one. Then each household resident is allowed to send one person with a card to enter the state store shopping according to the population ration."
 CPC_eliminate_three_major_differences: "End the Three Major Differences"
 CPC_eliminate_three_major_differences_desc: "Chairman Mao believed that in a socialist society, after the socialist transformation, We completed the ownership of the means of production. We must highlight proletarian politics. A new relationship between people in production and labor must be gradually established and developed. We must eliminate the differences between workers and peasants, between urban and rural areas, and between mental and physical work before we can finally complete the construction of socialism, prevent the restoration of capitalism, and lay the foundation of power for the liberation of the whole country."
 CPC_phase_2_Liu_tree: "Chairman Liu's Guidelines"
 CPC_cooperatives_lead_retail_investors: "From Cooperatives to Investors"
 CPC_cooperatives_lead_retail_investors_desc: "The transformation of the ownership system of the means of production is not a trivial matter, not an easy task, and cannot be messed with. The cry of \"eliminating exploitation\" and \"building socialism\" is a mistake of destroying production and fighting the masses.\nThe Central Committee has now decided that the general objective of establishing advanced cooperatives in agriculture in the base areas will remain unchanged. Still, the current situation does not allow us to further engage in so-called \"communism,\" so we should dissolve some of the poorly run agricultural cooperatives, especially those on the verge of bankruptcy and unable to eat, and allow the peasants to work alone for one or two years until the following year's harvest resumes. We can talk about collectivization again when production continues in the coming harvest."
 CPC_cooperatives_stand_up: "Prviate Cooperative Plots"
 CPC_cooperatives_stand_up_desc: "Marx said: \"Imaginary socialism is reactionary and wrong.\" Following Marx's conclusion, we have opposed the idea of agrarian socialism and the false theory of \"equal pay for equal work\" in a romantic, absolute egalitarian manner. \nThe peasants should be allowed to develop side businesses outside of collectivized farming and not be included in public food collection to improve their livelihood."
 CPC_trepall_the_purchase: "Initiate Unified Purchase and Sale"
 CPC_trepall_the_purchase_desc: "The unified marketing and purchase is an effort by the Party Central Committee to support socialist industrial construction. Commune grain depots are required to sell surplus grain to the state at the central government's price, quantity, and variety. They can dispose of the unplanned grain by themselves after the surrender; the state plan ration supplies urban residents; non-state designated units are prohibited from selling without a permit."
 CPC_retail_contract: "Household Responsibility"
 CPC_retail_contract_desc: "It's all in the hands of the people. We can only make real achievements and reflect the value of the policy. The people who oppose collectivization are just some poor farmers who are selfish and think they can make more money by themselves, and collectivization is slow. The backward concept of transformation can not be rushed, can not rely solely on administrative orders to oppress people, do not move on the \"revisionist\" hat people wear. The central government now allows this part of the people to separate from the cooperatives to work alone. The central government will set additional indicators of food collection."
 CPC_work_point_system: "Work Point System"
 CPC_work_point_system_desc: "According to each member's physical strength and skills, the labor grade is determined through collective evaluation and leadership review, and the total score is given. Then the work points are assessed according to labor time standards, length, and intensity. This practice breaks through the restrictions of age and gender, implements equal pay for equal work, and drives everyone to shared prosperity."
 CPC_pay_for_yourself: "Personal Quotas"
 CPC_pay_for_yourself_desc: "To deal with the independent farmers, we should build a responsibility system: \"Three for one within the production team, the householders are responsible for themselves, target for each person, unified management.\" "
 CPC_agricultural_bank: "Agricultural Bank "
 CPC_agricultural_bank_desc: "Establishing Agricultural Bank  is essential in strengthening support for agriculture in the base areas. It will be conducive to the good management and use of the funds of the Central Government in support of agriculture, to the effectiveness of the funds, the promotion of agricultural production, and the better implementation by the rural cooperatives and production teams of the policy of self-reliance, diligence, and thrift.\nThe local party committees and people's committees should strengthen the leadership of this work, especially at the beginning of the establishment period, and pay more attention to it; request all relevant departments and relevant units to work closely with them and give support from all aspects so that they can carry out their work smoothly; request the comrades of the Agricultural Bank to be conscientious, study humbly, study hard and work hard. There are many tasks to be established in the Agricultural Bank, which should be carried out gradually and intensively in a planned manner, depending on the situation. In the process of handing over the old and new institutions, We must pay attention to the convergence of work to prevent disconnection."
 CPC_rural_market: "Rural Markets"
 CPC_rural_market_desc: "All the scattered agricultural products and small handicrafts, all by the state commerce and supply and marketing cooperatives to organize the supply, is difficult to do thoroughly. Therefore, the correct use of market trade to supplement this form is permissible within a minimal area. Market trade in large and medium-sized cities should be some sporadic retail market of agricultural and sideline products. Those who sell goods in such calls should be peasants from the suburbs and nearby areas who come to the city to sell their products, small traders who are authorized to engage in some short-distance trafficking of fresh commodities, as well as city residents who sell household by-products and individual artisans who sell sporadic handicrafts."
 CPC_supply_and_marketing_cooperative: "Supply and Marketing Cooperatives"
 CPC_supply_and_marketing_cooperative_desc: "Supply and Marketing Cooperative is an important node of the state-run commercial distribution network and is a transit point for transferring and exchanging various resources. The unified purchase and sale of food depend on the centralization of supply and marketing agencies, and the business of urban and rural materials depends on the distribution of supply and marketing agencies. The functions of the supply and marketing agency are expanded further to develop the exchange of urban and rural materials, promote the movement to increase agricultural production centered on mutual aid and cooperation, and support the industrialization of the base areas."
 CPC_small_low_interest_loan: "Microlending"
 CPC_small_low_interest_loan_desc: "We will release funds from state support for agriculture to the private sector through loans. The allocation and use of these funds will be arranged and determined by the Party committees and people's committees at all levels within the targets allocated by the higher levels. The Agricultural Bank of China, by the state's plans, budgets, policies, and systems, will examine and verify each allocation, cost standard, and loan target as already determined and then allocate and lend. The agricultural fund management team, relevant competent departments, and the Agricultural Bank of China shall strictly supervise and inspect the use of funds for supporting agriculture, summarize experience at any time and reflect on the situation on time."
 CPC_research_bonds: "Research Bonds"
 CPC_research_bonds_desc: "For farmers, treasury bonds have several advantages over other financial instruments: savings bonds are issued by the Ministry of Finance on behalf of the central government, with high credit and guaranteed safety; fixed issue rates, tax-free interest, and stable returns; 30 yuan can be subscribed, the place of business is flexible, no risk evaluation is required before subscribing, and it is equally convenient to liquidate.\nFor the base, treasury bonds are an essential means of macroeconomic regulation and control, concentrating funds to protect people's livelihood, expand consumption and investment, and a more pressing matter - to provide sufficient funds for scientific research in the base."
 CPC_bureau_of_market_statistics: "Central Bureau of Statistics"
 CPC_bureau_of_market_statistics_desc: "Due to the growth of agricultural production, farmers, in completing the state unified purchase and distribution tasks, still a part of the surplus of agricultural and sideline products that need to sell. On the other hand, urban residents also have a need. Under such circumstances, the transfer and exchange of these commodities became inevitable. The central government set up the Bureau of Market Statistics to strengthen the unified arrangement of urban and rural bazaars, strengthen price supervision, strictly manage the types of listed products and prohibit the peddling of controlled materials and Class III products."
 CPC_acquisition_section: "Acquisitions Department"
 CPC_acquisition_section_desc: "Supply and Marketing Cooperative assumed part of the local administrative power, so the central government decided to set up a separate government department attached to the agency below, forming a subordinate relationship with the Bureau of Market Statistics and taking responsibility for specific matters.\nAcquisition Section was responsible for supervising the quality and quantity of purchased products, coordinating the supply and demand of materials in different regions, counting the amount of bank and supply and marketing agency cashiers, and supervising local governments to see if there were any unlawful acts of forcing farmers to sell their surplus products."
 CPC_price_section: "Pricing Department"
 CPC_price_section_desc: "Supply and Marketing Cooperative assumed part of the local administrative power, so the central government decided to set up a separate government department attached to the agency below, forming a subordinate relationship with the Bureau of Market Statistics and taking responsibility for specific matters.\nThe primary function of the Price Section is to balance general market prices and to monitor local governments for unlawful practices that force down prices and lead to the loss and waste of products."
 CPC_discount_deposit: "Reduced Deposits"
 CPC_discount_deposit_desc: "Agricultural Bank  should ensure the completion of the national plan to purchase the task (including unified purchase, purchase, and unplanned exchange) on the premise of taking the exchange price, bargaining, and other ways to actively purchase the production team and community members of the surplus products.\nSuppose a farmer's family has surplus products that we cannot finish. In that case, they can be transported to the county by the bank for valuation and acquisition, and then according to the different needs of the exchange, transported to the local supply and marketing agency for sale. Individual commodities suitable for state commerce can also be operated by state commerce."
 CPC_big_package_sale: "Large-Scale Sales"
 CPC_big_package_sale_desc: "The market business that cannot be undertaken by the supply and marketing agency and the village and town markets will be entirely undertaken by the state-run department stores. The quality of goods available in the market is the best in the state-run ones; there is no shortage of goods in the market in the state-run ones; the goods that are fashionable outside the base area are also available in the state-run ones."
 CPC_rural_new_economy: "The New Rural Economy"
 CPC_rural_new_economy_desc: "To better restore the economy, the economic policy of the base took a big step backward. However, these initiatives proved to be correct. The increase in food production has brought benefits to the peasant class, and the quality of life has improved considerably by saying goodbye to the tight times. The people's support and love are the most significant affirmation for us."
 CPC_equity_budget: "Recovering Equity"
 CPC_equity_budget_desc: "In 1955, the gradual public-private partnership transformation of private industry and commerce began in the base area, and we acquired the management rights of most of the enterprises. The capitalists still received year-end dividends (i.e., turnover) for their shares without compensation. Due to the United Front policy during the challenging economic times, the Central Government did not terminate the contracts according to the ten-year agreement, and this overhead continues to this day. Nowadays, the central government is still using the United Front as the primary point to implement a policy of buying these remaining shares at a discount, buying these shares that still exist in private hands at a low price."
 CPC_industry_combination: "Industrial Consolidation"
 CPC_industry_combination_desc: "In the late 1940s, in response to possible invasion by the Wang False Regime and air raids, the central government decided to evacuate industries from Xi'an, Xianyang, Baoji, and Weinan, and since then, has experienced multiple turmoils making it difficult for the central government to manage actual production in each area. Thanks to the end of the chaos, we can now have a clearer picture of the geographical distribution of factories and handicraft workshops. We are ready to consolidate most industries together and concentrate our economic strength."
 CPC_unified_production_criterion_Liu: "Uniform Production Standards"
 CPC_unified_production_criterion_Liu_desc: "The transformation of the public economy for the base has broken the industrial barriers. The future bottom may have to oversee dozens of hundreds of enterprises to produce together, the degree of socialization of production is getting higher and higher, the technical requirements are more and more complex, and production collaboration will become more extensive. Therefore production standardization, standardization of social production activities, and the adoption of unified, scientific, and rigorous production guidelines are vare."
 CPC_education_subsidy: "Education Subsidies"
 CPC_education_subsidy_desc: "To ease the pressure of education spending, the central government took into account the situation around the city through the urban compulsory education subsidy funds, the population base, financial difficulties, and private compulsory education accounted for a higher percentage of provinces to give appropriate reimbursement.\nLocal schools are strictly prohibited from delaying the allocation of funds, squeezing, misappropriation, retention, or withholding funds to ensure the regular operation of schools. "
 CPC_monitoring_working_hours_standards: "Supervise Working Hours Standards"
 CPC_monitoring_working_hours_standards_desc: "In the past, our Labor Law stipulated that all enterprises should implement the 10-hour work system. Still, the inspection by the leaders found it challenging to implement the policy of labor hours in a state of long-term preparedness. Although stipulating the 10-hour work system on paper, many enterprises would threaten with salary, treatment, and even dismissal, requiring workers to work 2-4 hours of involuntary overtime, which would not be counted as labor hours.\nTaking all aspects into consideration, the central government has reworked the Labor Law at this particular time, stipulating that enterprises can only implement a 12-hour workday and strictly prohibit overtime work in addition to labor hours. If there are cases where workers in an enterprise ask for voluntary overtime due to \"family difficulties,\" the local working group can, on behalf of the Party Central Committee, order the enterprise to set up an assistance fund to help workers relieve their difficulties."
 CPC_labor_protection_compensation_Liu: "Workplace Safety Benefits"
 CPC_labor_protection_compensation_Liu_desc: "For workers, labor protection is the fundamental guarantee for their health maintenance, work efficiency improvement, and labor value creation. Various labor protection measures are developed to prevent work-related accidents and various occupational diseases according to the survival and development of the local economy."
 CPC_medical_subsidies: "Medical Subsidies"
 CPC_medical_subsidies_desc: "Increase the number of medical subsidy funds, raise the maximum limit of employees' medical insurance, and implement the spirit of managing severe and chronic diseases to ensure the personal health of SOE employees.\nHospitalization of employees: the proportion of payment from the fund of tertiary medical institutions is 86%, and the balance of the individual out-of-pocket cost is 14%; the ratio of payment from the fund of secondary medical institutions is 89%, and the proportion of personal out-of-pocket payment is 11%; the balance of payment from the fund of primary medical institutions is 92%, and the proportion of individual out-of-pocket payment is 8%; the proportion of payment from the fund of community health service centers is 92%, and the proportion of individual out-of-pocket payment is 8%.\nEmployees' children's relatives who go to the doctor are also entitled to payment from the public medical fund but cannot exceed 30% of the general employee medical insurance amount."
 CPC_professional_skills_development: "Professional Skills Development"
 CPC_professional_skills_development_desc: "To deal with the uneven labor quality of enterprise workers, enterprises should strengthen the labor skills training of workers, provide targeted education services according to the workers' situation, orientate the post, and divide the work. Put an end to the problem of one person working, ten people watching the show, such harmful neglect of work."
 CPC_tempered_into_a_steel: "Tempered into Steel"
 CPC_tempered_into_a_steel_desc: "Having gained a series of building experiences, the people in our base areas are wiser, not more stupid; more cautious, not less cautious; more robust, not weaker. The cadres of the whole Party, the comrades of the entire Party, should be of one heart and mind. We should concentrate the strength of the revolutionary forces of the entire country, in human, material, and financial resources, and under the leadership of the Party Central Committee and Comrade Liu Shaoqi, overcome all difficulties and advance victoriously!"
 CPC_proposal_of_Huangyin: "The Southwestern Strategy"
 CPC_proposal_of_Huangyin_desc: "The main leader of SouthWest National Defence Front, recently commissioned Comrade Li Jingquan to make a speech on the Kham-Tibet issue at the General Assembly of the Political Affairs Committee, which was unanimously approved and adopted at the General Assembly. We believe that to break the blockade of the Co-Prosperity Sphere, it is necessary to recover the Tibetan region and open up a land route to connect with India and then through India to other anti-Japanese imperial forces in the world.\nThe Tibetan issue will become the primary focus of our current diplomatic efforts."
 CPC_meet_the_panchen: "Meet with the Panchen"
 CPC_meet_the_panchen_desc: "According to the news from the comrades stationed in Sikang and Tibet, the 10th Panchen Choekyi Gyaltsen seems to have expressed the idea of contacting and communicating with our front."
 CPC_armed_pilgrimage: "Armed Pilgrimage"
 CPC_armed_pilgrimage_desc: "After talking with Choekyi Gyaltsen, we learned that the Dalai and his sect in Lhasa had long been making things difficult for the Panchen in Gzhis Ka Rtse. The Dalai has even brutally and unreasonably prevented him and his followers from going to Lhasa for Hajj.\nPerhaps we can \"arm escort\" the Panchen to Lhasa..."
 CPC_obtain_buddhist_scriptures: "Ask to the West"
 CPC_obtain_buddhist_scriptures_desc: "After the liberation of Tibet, we will have the possibility of contacting the Free India authorities - despite being a member of the Co-Prosperity Sphere, Free India has traditionally been a small, independent kingdom not under the command of Tokyo, and they also own the ports in the Bay of Bengal region. This opens up the possibility of reaching out to other anti-Japanese imperial forces - as long as we are willing to offer some benefits to Free India ."
 CPC_belated_consult: "Belated Consultation"
 CPC_belated_consult_desc: "Years of strife has finally led to the Hainan Branch of our Party promptly reuniting with us.\nHainan Branch has informed us of the situation outlines on the shores of the South China Sea. Were we determined to breach from the Japanese isolation and establish relationship with international anti-fascist forces, we have to negate the blockade on the South China Sea."
 CPC_Unlock_SEA_GUI: "We will establish a secret link with our comrades in the §YHainan branch of the CPC.§! The interface §Yaffecting Southeast Asia§! is now available. Please check the £CPC_texticon §RSouth China Bureau§! on the top of the £CPC_texticon §xCPC National Congrass§! GUI"
 CPC_red_trace_in_jungle: "Red Footprints in the Jungle"
 CPC_red_trace_in_jungle_desc: "The Vietcong has formed storng ties with the Chinese People's Revolution since its founding. Despite the Japanese forcing our isolation, we have been determined in the cause of Nation Building against Japanese, developing consolidated base area by ourselves.\n\nWith our strength anew, we are determined to bear the burden of leadership in the struggle of All people of asia against imperialism. We shall aid the Vietnamese Comrades in their bid to overthrow the marionette and drive Japanese out of their homeland!"
 CPC_hell_in_pure_land: "\"Pure Land\" Turned Purgatory"
 CPC_hell_in_pure_land_desc: "Sources from the Khmer Communist Party say that Thai infantry seems to be appearing on the battlefield of the Cambodian civil war. Khmer Communist Party General Secretary Salot Sot has sent us a signal for help through Hainan - although the situation of the Cambodian civil war is far more chaotic than our estimation, we still must not give up this rare opportunity to dismember the Co-Prosperity Sphere and immediately send more volunteers to Cambodia."
 CPC_victory_in_southeast: "Victory in the Southeast"
 CPC_victory_in_southeast_desc: "Our work in Southeast Asia has already yielded gratifying results, and Red regimes have officially grown up in Southeast Asia like a mushroom. The conditions are ripe for the Hainan branch to remove its disguise and unite the sister regimes in Southeast Asia. The goal of dismembering the Southeast Asian rear resource sources of the Co-Prosperity Sphere has been achieved."
 CPC_indicate_of_Qiongzhou: "Direct Qiongzhou"
 CPC_indicate_of_Qiongzhou_desc: "Comrade Zhou Enlai gave a report on Southeast Asia at the General Assembly of the CPGAC, which emphasized that with the string of results we have achieved in our recent work, it would be feasible to resume contact with the Hainan branch. We could use Hainan as a pivot point to influence the situation in Southeast Asia.\nThe Southeast Asian issue will become the primary focus of our current diplomatic efforts."
 CPC_positive_contact: "A Positive Connection"
 CPC_positive_contact_desc: "After effort, we have established a more solid connection with the Hainan branch, and Comrade Feng Baikui indicated in a recent telegram that Hainan has worked in Southeast Asia for a long time and has developed several stable routes as well as an intelligence network throughout Southeast Asia that is readily available for use."
 CPC_overrun_in_southeast: "Multilateral Diplomacy in the Southeast"
 CPC_overrun_in_southeast_desc: "The situation in Southeast Asia was different from China's, which was the Co-Prosperity Sphere's main rear and was protected by the Japanese army and navy. If we wanted to seize benefits for Hainan in this area or to instigate an uprising of anti-Japanese forces, we would have to invest more political resources - we had to prepare for the total external goal of dismembering the Co-Prosperity Sphere."
 CPC_falling_leaves: "All Things Must Return"
 CPC_falling_leaves_desc: "The Party's work is divided into two fronts, the bright and the dark. Twenty years ago, to ensure that Xi'an did not fall into enemy hands, the Party controlled Xi'an at the expense of exposing the underground Front, which led to the work of the covert Front falling into a state of prolonged shock.\nWith the resumption of the Front's economic and organizational work, it is time to reactivate the work of the underground Front - this time, we will send a particular female comrade to Shanxi..."
 CPC_two_buddha_scramble: "Two Buddhas Contend"
 CPC_two_buddha_scramble_desc: "The Tibetan Choekyi Gyaltsen Panchen sent us a letter through a secret communication channel with his comrades in Kham. We learned that the Panchen had many disagreements with the Dalai on the Lhasa side, and the Dalai even obstructed the Panchen's pilgrimage to Lhasa, which undoubtedly gave us a perfect opportunity to issue a request to Lhasa in the joint name of Choekyi Gyaltsen and the Front to warn him of his shameless act of splitting Tibet."
 CPC_educated_youth_brigade: "Educated Youth Brigade"
 CPC_educated_youth_brigade_desc: "Despite instigating the Kachin People's Army (KPA) uprising, we find that the reactionary regime in Burma is still very vicious, and it is necessary to call on the youth to unite and form the Youth Brigade to send additional support to the KPA. "
 CPC_blood_in_country_of_buddhist: "Shining Blood in the Buddhists' Land"
 CPC_blood_in_country_of_buddhist_desc: "Sources from the Khmer Communist Party say that Thai infantry seems to be appearing on the battlefield of the Cambodian civil war. Khmer Communist Party General Secretary Salot Sot has sent us a signal for help through Hainan - although the situation of the Cambodian civil war is far more chaotic than our estimation, we still must not give up this rare opportunity to dismember the Co-Prosperity Sphere and immediately send more volunteers to Cambodia."
 CPC_debug_dec: "Debug Decisions of TER"
 CPC_debug_dec_desc: "FK BUG!"
 CPC_debug_1: "Activate Southeast Asia GUI"
 CPC_debug_2: "View Phase II Index (need to be used with any Phase II national policy tree debug decision)"
 CPC_debug_3: "View Phase I Index (need to be used with any Phase I national policy tree debug decision)"
 TNO_COUNTRY_INFO_BUTTON_TEXT_CPC: "For the people!"
 CPC_Hanzhong_construction: "Construction of Hanzhong"
 TER_HZ_desc: "Guided by the §GThree Red Flags§!, the people of the base area spent 20 years building §WXi'an§! into §Gan impregnable fortress§!. But it was not enough; the Northwest was still under the shadow of §Rnuclear war.§!\n\nWe are not afraid to anticipate the future course of the war in the worst possible way: the KMT reactionary regime colluded with the Japanese invaders to use §R atomic bombs§! to bombard the base areas. §WXi'an,§! the largest city in the base area, would bear the brunt of the bombing. To deal with the §Rworest situation§!, the Party Central Committee decided to start the §WHanzhong Fortress Project§!: within six to seven years, to build Hanzhong into the second central city of the base area.\n\nOnce §WXi'an§! was destroyed in a §Rnuclear strike§!, the base had to function as usual under the command of the §W\"second center\"§!. The Chinese people will not bow to the atomic bombs of the Japanese imperialists!"
 TER_HZ_info_detail: "§WAccording to the master plan of the late 1950s, Hanzhong§! will have §Ysix downtowns with different functions§!, excluding the old city already built. However, due to objective reasons such as the withering economy, the project of building Hanzhong has been delayed. Now that the war in the base area has subsided, we will mobilize all available construction resources to aid in building Hanzhong.\n\nAfter completing the §YBaoji-Hanzhong Highway and the repair of the Xi'an-Hanzhong Railway§! s projects, we will be in a position to begin construction of §Ydowntown areas§!, each of which will be constructed in §Y300 days§! , the functional focus of each §Ydowntown§! is not consistent, so please plan well. According to the overall planning goal, §Yevery 2 downtowns§! built will add §Y1 level of air defense artillery and radar station to the local area.§!\n\nFigure legend.\n§YThe yellow patterns§! are agricultural land\n§RThe red patterns§! are the main road\n§GThe Green patterns§! are secondary roads\n§FThe Grey patterns§! are the railroad\n§DThe Cyan patterns§! are buildings"
 CPC_HZ_1_dec: "Repair Baoji-Hanzhong Highway and Xi’an-Hanzhong railway."
 CPC_HZ_1_dec_desc: "We need to build a new Xi'an-Hanzhong railroad on the basis of the Xi'an-Lanzhou railroad, and refurbish the Baoji-Hanzhong highway, which was built during the Republican era, to expand the capacity for subsequent transportation of engineering machinery, construction materials, and other important materials to Hanzhong."
 CPC_HZ_unlock: "With the completion of the road and railroad repair, the construction of the §Ynew downtown area§! of Hanzhong will be officially launched."
 CPC_HZ_E1_dec: "Constructing §YSoutheast Downtown§!"
 CPC_HZ_E1_dec_desc: "In the planning case, the §YSoutheast Downtown§! area will assume the §Ygovernmental functions§! of Hanzhong."
 TER_HZ_E1_fin: "Construction of §YSoutheast Downtown§! has been completed."
 CPC_HZ_E2_dec: "Constructing §YNortheast downtown§!"
 CPC_HZ_E2_dec_desc: "In the planning, the §YNortheast Downtown§! area will assume the §Yindustry functions§! of Hanzhong."
 TER_HZ_E2_fin: "Construction of §YNortheast Downtown§! has been completed."
 CPC_HZ_W1_dec: "Constructing §YWest Inner Downtown§!"
 CPC_HZ_W1_dec_desc: "In the planning, the §YWest Inner Downtown§! area will assume the §YCitizen Services§! of Hanzhong."
 TER_HZ_W1_fin: "Constructing of §YWest Inner Downtown§! has been completed."
 CPC_HZ_W2_dec: "Constructing §YWest Outer Downtown§!"
 CPC_HZ_W2_dec_desc: "In the planning, the §YWest Outer Downtown§! area will assume the §YMilitary functions§! of Hanzhong."
 TER_HZ_W2_fin: "Constructing of §YWest Outer Downtown§! has been completed."
 CPC_HZ_N_dec: "Constructing §YNorth Downtown§!"
 CPC_HZ_N_dec_desc: "In the planning, the §YNorth Downtown§! area will assume the §YTrade and Warehousing functions§! of Hanzhong."
 TER_HZ_N_fin: "Construction of §YNorth Downtown§! has been completed."
 CPC_HZ_S_dec: "Constructing §YSouth Downtown§!"
 CPC_HZ_S_dec_desc: "In the planning case, the §YSouth Downtown§! area will assume the §YJudicial function§! of Hanzhong."
 TER_HZ_S_fin: "Construction of §YSouth Downtown§! has been completed."
 CPC_paternalism_party: "New Democratic Alliance"
 CPC_paternalism_party_long: "New Chinese Democratic Alliance "
 CPC_conservatism_party: "Revolutionary Committee - Democrats"
 CPC_conservatism_party_long: "Chinese Democratic Revolutionary Alliance  - Democratic Faction"
 CPC_progressivism_party: "Revolutionary Committee - Rural Faction"
 CPC_progressivism_party_long: "Chinese Democratic Revolutionary Alliance - Rural Reconstruction Faction"
 CPC_high_purchase_level_desc: "Although the Central Committee of the Party has repeatedly ordered not to rule with \"two accounts\": the central government has set targets, local government are not allowed to secretly increase the targets, to achieve \"over-achievement\".\nBut inevitably, our cadres still take various small actions either explicitly or implicitly to gain the attention of the central government, bringing considerable trouble to peasants' lives."
 CPC_Lin_Biao_go_up_the_mountain_desc: "As head of the PLA, Lin Biao's authority should have stopped within military. But the Party Central Committee had to promote a resolution that was not passed by the CPGAC, so that he was directing the work of government departments in his capacity as vice chairman of the Front.\nSuch a break with the principles of party discipline was not what Chairman Mao or Chairman Liu would have wanted, and it would have had unpredictable implications for the future."
 CPC_black_line_theory_desc: "Basically, the literary and artistic circles have not implemented Chairman Mao's literary and artistic theories, and have been dictated to by a black line of anti-Party and anti-socialism that is opposed to Chairman Mao's thought, which is a combination of bourgeois literary and artistic thought, modern revisionist literary and artistic thought and the so-called literature of the 1930s. Some people put forward the theory of \"creative works deviating from the scriptures\", that is, deviating from the scriptures of Marxism-Leninism and Mao Zedong Thought and the way of the people's revolutionary war. -- Jiang Qing"
 CPC_worthen_special_apply_desc: "Whenever the spearhead of the class struggle is pointed at the party itself, it seems that all the ensuing critical attacks are like bullets that can turn around, bypassing the party's body and flying haphazardly in all directions.\nYou do not want the old comrades of the Central Committee to smoke the herbal cigars made by the cigarette factory to moisten their lungs and clear their throats?\nDo you want to let Chairman Mao fill in his swimming pool so that he can only go to the Yan River to swim?\nDo you want to demolish Chairman Liu's favorite social dance hall?\nOFC I do."
 CPC_four_dishes_one_soup_desc: "For banquets, the limit should be set to four dishes plus one soup, while for meals in cafeterias, the limit should be of three dishes and one soup. The standard applies uniformly, from the highest echelons of central leadership to the grassroots level officials. They all should practice thrift for revolution."
 CPC_Bai_Yin_exp_desc: "Wang Guangmei, the wife of Chairman Liu Shaoqi, led a team of the Central Working Group to visit the Baiyin Chemical Factory in Ningxia personally, and solved the long-standing problem of Party governance, which had been centrally reflected by the working class, by exposing the historical problems of the factory and rectifying the organizational work. During the struggle, the workers were highly motivated and determined to complete the production tasks assigned by the Party Central Committee and deliver a satisfactory answer to the people of the whole base area."
 CPC_culture_rev_desc: "Beginning with the criticism of the reactionary Peking Opera \"Shenbaoxu\", the front began to take Chairman Mao's \"Speech at the Yan'an Symposium on Literature and Art\" as a guideline to strengthen revolutionary literary creation, courageously seize the lost cultural positions of the proletariat, and ensure that the people of the base area would be free from the spiritual pollution of the reactionary forces' degeneration and decay on."
 CPC_sky_changes_theory_desc: "The biggest problem is to prevent counter-revolutionary coups, prevent subversion, and prevent \"Next Fighting\". The fundamental problem of the revolution is the question of power. With the regime, the proletariat and the working people will have everything. Without the regime, everything is lost. The relations of production are of course the basis, but they can be changed, consolidated, and developed by seizing the regime. - Lin Biao"
 CPC_XIN_problem: "Xinjiang Crisis Breaks Out"
 CPC_sik_crisis_node_1: "Ma Zhongying was attacked!"
 CPC_sik_crisis_node_2: "The CPC is accused of \"colluding with Sheng Shicai\"!"
 CPC_sik_crisis_node_3: "Deputy of CPC was expelled!"
 TER_phase_2_end_tip: "Eventually, they will be §xgone§! - and the future of China is §Yuncertain§!..."
 CPC_eighth_national_congress: "The Eighth National Congress"
 CPC_eighth_national_congress_desc: "With the steady economic work in the base areas, the Party is not wallowing in the failures of the past, the Party organization and front still maintain the enthusiasm and vitality of the revolution, and the 8th Party Congress will be a congress, to sum up our past mistakes and achievements. It will be a starting point for our future journey to liberate China in magnificent waves!"
 CPC_sik_mon_over: "We have got through the toughest period"
 CPC_admit_phase_2_final_tree: "Preparations for the §YNinth National Congress of the Communist Party of China§! in 1968 will begin, and the §YNational Focus§! related to the Ninth Congress has been unlocked."
 CPC_1968_5_1_festival: "Labor Day"
 CPC_1968_5_1_festival_desc: "This year's International Labor Day is very significant, after five years of arduous construction struggle, the Front has made great progress in all aspects of politics, economics, and military, not only western China has been unified under our banner, but the revolutionary in Southeast Asia is also going on, on the occasion of this victorious leap forward, the Party and the Front decided: we will hold the Ninth National Congress of the Party during the year."
 CPC_1968_preparatory_conference: "Prepare for the Congress"
 CPC_1968_preparatory_conference_desc: "Now the Front has taken root and established its presence throughout the west of China, while social progress is made more and more rapidly. The Central Committee of the Party, believing that the whole Front has essentially completed its socialist reforms under the important [CPC.GetLeader] Thought, with socialist institutions already in place, achieving a decisive victory for the general political line. Thus, to complete the urgent task of consolidating these results, the Ninth National Congress must be convened. During a prepatory conference in Xi'an, Chairman [CPC.GetLeader] will lay out the main tasks and guiding ideology of the Congress, planning for deputies of all regions to participate and handling security work."
 CPC_1968_deputies_from_SIC: "Deputies from Sichuan"
 CPC_1968_deputies_from_SIC_desc: "Among the many border areas divided and ruled by the Front, Chuan has the best natural conditions and the most superior industrial base. The representatives of the Chuan Branch have many advanced insights in economic construction, and in the future when the whole country is liberated, the experience they have accumulated in Chuan will effectively guide the Front in receiving the Japanese industrial heritage and successfully completing the important task of industrializing the whole country."
 CPC_1968_deputies_from_QIN: "Deputies from Shaanxi"
 CPC_1968_deputies_from_QIN_desc: "As one of the earliest regions under our full control when we entered Xi'an in 1947, Shaanxi - especially the cities of Xi'an and Hanzhong - provided considerable experience to draw upon in our attempts to explore socialist construction and long-term anti-Japanese construction."
 CPC_1968_deputies_from_XIN_desc: "[CPC_1968_deputies_from_XIN_desc]"
 CPC_1968_deputies_from_XIK: "Deputies from Xikang"
 CPC_1968_deputies_from_XIK_desc: "Although the Sikang region has been under the hope of \"transforming the border into a hinterland\" in the hands of successive rulers, the brutal Han rule has only had a side effect on local development.Now that the Party's policy has achieved results among ethnic minorities."
 CPC_1968_deputies_from_QGN: "Deputies from the Northwest"
 CPC_1968_deputies_from_QGN_desc: "After the rebellion of the Ma Clique, the central government focused on mediating Han-Hui relations, formulating correct ethnic policies, and practicing the principle of ethnic equality, and now it is time to reap the harvest. We have resolved with the utmost sincerity this ethnic conflict that once drove the front into a desperate situation. Now that the various ethnic groups in the northwest are united and equal and close as one family, we will surely rely on the strong support of the people of all ethnic groups throughout the country to accomplish the great historical task of unification against Japan."
 CPC_1968_deputies_from_TIB: "Deputies from Tibet"
 CPC_1968_deputies_from_TIB_desc: "After the liberation of Tibet, the Tibetan people set off a vigorous socialist transformation movement, and in the week of advance contacts afterward, Premier Zhou Enlai would understand the difficult problems of present-day development in Tibet to make suitable adjustments to the transformation."
 CPC_1968_central_ministries: "Central ministries meeting"
 CPC_1968_central_ministries_desc: "After dealing with local affairs, Premier Zhou Enlai also had to summarize the situation with the leading cadres of the central government at all levels, and the ministries and commissions would make short debriefings to the Central Politburo and the Central People's Government Committee respectively to sum up the past development experience, learn the lessons of the past, and welcome the next socialist climax with full enthusiasm."
 CPC_1968_interior_ministry: "Ministry of the Interior"
 CPC_1968_interior_ministry_desc: "The Ministry of the Interior will present a report to the Central Committee on the great progress made by the Defence Front in internal affairs during the past four years of socialist construction."
 CPC_1968_industry_ministry: "Ministry of Industry"
 CPC_1968_industry_ministry_desc: "The Ministry of Industry will make a report to the Central Government on the great industrial progress made by the defence front during the past four years of socialist construction."
 CPC_1968_agriculture_ministry: "Ministry of Agriculture"
 CPC_1968_agriculture_ministry_desc: "The Ministry of the Agriculture will present a report to the Central Committee on the great progress made by the Defence Front in agriculture during the past four years of socialist construction."
 CPC_1968_foreign_ministry: "Department of Foreign Affairs"
 CPC_1968_foreign_ministry_desc: "The Ministry of Foreign Affairs and Trade will present a report to the Central Government on the great progress made by the defence front in foreign affairs during the past four years of socialist construction."
 CPC_1968_GOOD_NEWS: "Joyous News!"
 CPC_1968_GOOD_NEWS_desc: "To follow Chairman Mao is direction, to follow Chairman Mao is light, to follow Chairman Mao is victory. All the people and comrades of the Party, government and army in our base area love the Great Leader Chairman Mao infinitely, are infinitely loyal to the invincible Mao Zedong Thought, and infinitely support Chairman Mao's revolutionary line. We will act as Chairman Mao commands; we will follow the deployment of the Party Central Committee headed by Chairman Mao Zedong and Comrade Liu Shaoqi, and the victory of the Chinese Revolution belongs to us!"
 CPC_debug_4: "GUI of Hanzhong in debug"
 BOOKMARK_CPC_INFO: "§xNorthwest National Defence Front§!"
 BOOKMARK_CPC_INFO_DELAYED: "§FCopyrighted by §xThe New Order: The East is Red§! development team\n§LLuna Ex Montibus Orbitur§! version, newly released:\n§Y-Revamped content up to the §xNinth Congress§! with a large amount of content\n-Redid writing for side plots\n-Optimized most mechanics§!\n§W--------------\n\n£GFX_texticon_bookmark_CPC\n\n\n\n\n§!§FMightily upward the arrow flew, but it is said to strike ground all the same.\nThe void's force breaks my meditation. I can only seek to refine the gold and cinnabar.\n- Xia Yuanding, \"Moon Over the Xi River\"\n\nThirteen years prior, the National Defence Front mounted a tragic yet impressive effort in battle, proving to the world that the future of the Chinese Revolution was not being swallowed up by the savage beasts to the east. This tremendous victory brought her incomparable fame, but their reward for resisting fate would rapidly become a curse: virtue and prestige, which made their lands teem with 'worshippers.' These pilgrims, hiding disloyal thoughts, sought out the Great Northwest to pay their respects at 'court,' and so this once-hidden realm would find itself in karmic entanglement - in the end, weary under the burden, her confusion gave rise to errors, a collapse nearly unavoidable.\n\nWith this version, players will learn of the history that followed the National Defense Front's establishment thirteen years ago, understand the reasons for the crises that devastated the Northwest, and struggle furiously with but one goal in mind: for the liberation of the Chinese nation's oppressed common people, for the liberation of Asia's destitute masses, keep this last spark burning.\n\nThrow yourself into this section of history; goodbye, until we meet in a place without darkness.§!"
 TER_XJ_popular_will: "Popular will"
 TER_XJ_statename: "[?CPC_XJ_state^XJ_id.GetName]"
 CPC_XJ_working: "§YAnother decision§! is in process in this area"
 CPC_into_phase_2_mao: "The 8th Congress has come to a close, and there have been some personnel changes among the leaders of the §GCentral Committee.§! Please inspect the §Gnational§! or §Gdiplomatic§! panel, and click on the current §Gsub-ideology icon§! to view the §Gcurrent composition of the Central Committee.§!\n\n§GNorthwest National Defence Front§! is going to a new era, new §YFocus and Proposal§! will be unlocked, please inspect the §YFocus Tree§! and £CPGAC_texture_loc §GCentral People's Government Affairs Committee§!."
 CPC_into_phase_2_liu: "The 8th Congress has come to a close, and there have been some personnel changes among the leaders of the §mCentral Committee.§! Please inspect the §Gnational§! or §Gdiplomatic§! panel, and click on the current §Gsub-ideology icon§! to view the §mcurrent composition of the Central Committee.§!\n\n§GThe Chairman of the Front§! is §mLiu Shaoqi§! now, not §GMao Zedong§! anymore.\n\n§GNorthwest National Defence Front§! is going to a new era, new §YFocus and Proposal§! will be unlocked, please inspect the §YFocus Tree§! and £CPGAC_texture_loc §GCentral People's Government Affairs Committee§!."
 CPC_Wang_Kunlun: "Wang Kunlun"
 CPC_Lin_Biao_army_chief: "Lin Biao"
 CPC_deep_thinker: "Deep Thinker"
 CPC_Su_Yu_high_command: "Su Yu"
 CPC_psychological_tactics: "Psychological Tactics"
 CPC_Xu_Shiyou_high_command: "Xu Shiyou"
 CPC_moving_tiger: "Moving Tiger"
 CPC_Xu_Xiangqian: "Xu Xiangqian"
 CPC_Yang_Dezhi: "Yang Dezhi"
 CPC_Xu_Xiangqian_theorist: "Xu Xiangqian"
 CPC_Yang_Dezhi_high_command: "Yang Dezhi"
 CPC_special_force_expert: "Special Force Expert"
 CPC_modern_human_sea_tactics: "Modern Human Sea Tactics"
 CPC_Foreclosure_desc: "The reactionary propaganda of the Majestic Army deeply affected Qinghai and Gansu, and a large number of people had fear of the front men. We should maintain moderation, be kind to people, and implement revolutionary policies in a relatively moderate way. The Front decided to take a portion of its budget and use it to buy land in the hands of landlords in the land reform."
 CPC_radical_land_reform_desc: "Those Party cadres who were eager for development could not wait to drive to Qinghai and Gansu to take up their posts and direct the local people to carry out vindictive land reform work, even to the extent of disregarding the actual situation, which led to a chaotic situation of mass confrontation in many places. But the focus of the central government is not to correct the \"left-leaning\" mistakes but to revive the revolutionary enthusiasm of the masses through the land reform movement."
 CPC_1968_deputies_from_XIN_desc_2: "For many years, Xinjiang has been in a state of fragmentation, and individual saboteurs have deliberately created misunderstandings and unhappiness, widely propagated the contradictions between China and Hui and China and Wei, and created racial confrontation, resulting in the people of Xinjiang not accepting the Central Government's explanation and not obeying the Central Government's leadership for a long time. For a small number of saboteurs deliberately create ethnic contradictions and provoke the wrong idea of Xinjiang's independence, we must resolutely combat and annihilate them."
 CPC_phase_2_Mao_long: "Communist Party of China§F\n--------------\nChairman of the National Defence Front: §GMao Zedong§!\nChairman of the Central Committee: §GMao Zedong§!\nMembers of the Standing Committee of the Politburo: §GMao Zedong§!, §mLiu Shaoqi§!, §OZhou Enlai§!, §GZhu De§!, §YChen Yun§!, §YDeng Xiaoping§!, §GLin Biao§!, §mBo Yibo§!, §GGao Gang§!\nGeneral Secretary of the Central Committee's Secretariat: §YDeng Xiaoping§!§!\n"
 CPC_phase_2_Liu_long: "Communist Party of China§F\n--------------\nChairman of the National Defence Front: §mLiu Shaoqi§!\nChairman of the Central Committee: §GMao Zedong§!\nMembers of the Standing Committee of the Politburo: §GMao Zedong§!, §mLiu Shaoqi§!, §OZhou Enlai§!, §GZhu De§!, §mBo Yibo§!, §YChen Yun§!, §YDeng Xiaoping§!, §YXi Zhongxun§!\nGeneral Secretary of the Central Committee's Secretariat: §YDeng Xiaoping§!§!\n"
 CPC_vote_for_election_desc: "This is the first time we have handed over the power of appointing grassroots cadres to the people. Some comrades may say that this is too troublesome, and ordinary people do not understand the Party's lines and policies. It takes a long time to discuss everything with them before getting any results. However, given the current situation, we should not be too concerned about this. Doing so allows us to hear the most direct voices of ordinary people."
 CPC_hug_strongly_desc: "At the commendation meeting for outstanding citizens in Lanzhou, many Hui people were commended by the municipal government for reporting underground black dens, which symbolized the Party's significant achievements in thoroughly eradicating religious extremist forces. During the commendation process, the citizens warmly embraced Lanzhou Municipal Party Secretary Liu Lantao, with happy smiles on their faces."
 CPC_peace_is_first_desc: "Minority ethnic groups should implement ethnic autonomy in their respective concentrated areas. According to the population size and regional scale of each ethnic group, various ethnic autonomous institutions should be established. In places where multiple ethnic groups live together and within ethnic autonomous regions, each ethnic group should have a corresponding number of representatives in local government agencies.\n\nFrom now on, no matter what has happened in the past, let it go. It's time to unload the historical burden and prioritize harmony in all matters."
 CPC_together_forward_desc: "The Lanzhou Party History Research Group has compiled a book titled \"The History of Islam and Its Reactionary Nature,\" which is distributed as a required reading for re-education personnel. It is taught by teachers with outstanding teaching abilities. We believe that in the future, we will be able to clarify the Party's policies on religion and achieve reconciliation with our brotherly ethnic groups."
 CPC_purge_IMPRP_desc: "This is something we are most reluctant to see, but it is also something we have no choice but to do.\n\nIMPRP, as a reactionary organization advocating ethnic separatism, anti-socialism, and revisionism, has embarked on a path that goes against the Central Committee and Chairman Mao. If allowed to continue, it will inevitably lead to opposition and treason against the Party. The Party Central Committee has made a resolute decision to thoroughly eliminate these counter-revolutionary elements and dismantle the time bombs that have infiltrated our Front."
 CPC_Elimination_Mon_independence_advocate_desc: "Mongolian nationalist elements, Mneng Jiang traitors, Japanese spies, and the Zedenbal Mongolian revisionist elements have joined forces to vigorously oppose our Party's socialist line and have committed countless atrocities. Comrades, this is a struggle related to our survival in the face of hostile foreign forces. At this time, we must believe in the people, rely on the people, and submerge the reactionary elements in the vast sea of people's war. We must avenge our Han people who have died and make the Mongolian separatists pay back the blood they owe!"
 CPC_big_four_cleans_1_desc: "Our goal is to launch a large-scale socialist education campaign at the societal level through the \"Four Clean-ups,\" criticize right-leaning opportunism, critique bourgeois ideology, and thoroughly root out the \"four types of bad elements\" - landlords, rich peasants, counter-revolutionaries, and bad guys. Now, Party members and cadres in various localities have begun to convey the central government's decisions at the grassroots level, gaining widespread support from the peasant masses."
 CPC_big_four_cleans_2_desc: "Our goal is to launch a large-scale socialist education through the Four Clean-ups movement at the societal level, consolidate the achievements of agricultural collectivization, criticize right-wing opportunism, criticize bourgeois ideology, and thoroughly root out the four types of bad elements - landlords, rich peasants, counterrevolutionaries, and bad elements. Currently, the Four Cleanups movement has been widely implemented in rural areas, uncovering many anti-Party and anti-socialist elements, and achieving commendable results."
 CPC_big_four_cleans_3_desc: "Our goal is to launch a large-scale socialist education through the Four Clean-ups movement at the societal level, consolidate the achievements of agricultural collectivization, criticize right-wing opportunism, criticize bourgeois ideology, and thoroughly root out the four types of bad elements - landlords, rich peasants, counterrevolutionaries, and bad elements. Currently, the Four Cleanups movement is not just a rural movement, as it is also being vigorously implemented in urban areas. Major factories and units are closely followed Chairman Mao's revolutionary line and launched socialist education, completely sweeping out the four types of bad elements that have infiltrated the ranks."
 CPC_big_four_cleans_4_desc: "\"We should ALL IN Class struggle. Some members of the Party have become rightists, and there have been collapses from the branch level to the central level. This is a normal phenomenon of political metabolism, don't be afraid.\" - Mao Zedong\n\nOur goal is to launch a large-scale socialist education through the Four Cleanups movement at the societal level, criticize right-wing opportunism, criticize bourgeois ideology, and thoroughly root out the four types of bad elements - landlords, rich peasants, counterrevolutionaries, and bad elements. Now, the Four Cleanups movement has begun to target some members of the central government, who will soon face charges of \"revisionism\" and engage in self-criticism. From east to west, from south to north, from top to bottom, the Party has uncovered countless bad elements from all corners of the front line. We believe that this is the front line finally eliminating the long-standing toxins that have been troubling us.\""
 CPC_sting_operation_1_desc: "Our goal is to timely clean up corrupt elements within the government through Sufan, and to establish a diligent, honest, and simple work style for the people, educating the masses on what they should and should not do. Regarding the decision on anti-corruption, we have notified the members of the anti-corruption working group through small-scale briefings, and they will infiltrate the grassroots through covert visits, waiting for further instructions from the central."
 CPC_sting_operation_2_desc: "Our goal is to timely clean up corrupt elements within the front line through Sufan efforts, and to establish a diligent, honest, and simple work style for the people, educating the masses on what they should and should not do. The Sufan has already been deployed in some units and rural cooperatives, and the working groups sent by the central government are gradually uncovering the unknown corruption problems at the grassroots level. Some ordinary and senior criminals have revealed their true colors during the review and have been caught."
 CPC_sting_operation_3_desc: "Our goal is to timely clean up corrupt elements within the front line through Sufan, and to establish a diligent, honest, and simple work style for the people, educating the masses on what they should and should not do. After obtaining sufficient evidence, the working group began accusing cadres of serious ideological problems. As the interrogation progressed, the personnel involved became increasingly complex. This means that we can weave together an entire network of anti-socialist connections, which is conducive to completely eliminating the reactionary elements."
 CPC_sting_operation_4_desc: "\"You guys all say that the root of the reactionary forces in the front line lies at the grassroots, among the landlords and capitalists - this is just to shift the blame onto others. The masses have reported that the root of the reactionaries 'is up there,' and when faced with this situation, I will not show any mercy.\" - Liu Shaoqi\n\nOur goal is to timely clean up corrupt elements within the front line through Sufan, and to establish a diligent, honest, and simple work style for the people, educating the masses on what they should and should not do. The Sufan has been launched vigorously throughout the front line. Increasingly, more clues suggest that the reactionary ideology at the societal level comes from the high-ranking members of the Communist Party. The central working group has launched an investigation, and a group of Party cadres will be dismissed."
 CPC_1968_deputies_from_XIN: "Deputies from Xinjiang"
 CPC_1968_deputies_from_XIN_desc_1: "After the end of the Xinjiang Civil War, General Ma Zhongying had been the ruler of Xinjiang for several years. Now, he has come to Congress with great effort and together with the people of Xinjiang, showing his firm support for the reunification of the motherland. Xinjiang will undertake a more significant historical mission in the future planning of the Front, and we extend our highest respect to General Ma Zhongying and the Xinjiang people who have always supported us."
 CPC_debug_dec_11: "§xToo f**king slow, show the superevent now!§!"
 CPC_debug_dec_11_tt_for_joy: "As you wish.\n\nDeveloper's note: §xNuclear Program is really slow!§! After the official content is over, you can click on this decision in the arcade mode category. It should be regarded as canon. The final effect of the Nuclear Program GUI is consistent with this decision effect: We have prepared an event chain and a superevent for you, as well as a cool in-map nuclear explosion effect. You will receive a nuclear warhead and join the ranks of nuclear-armed countries, but you will not have the ability to launch nuclear weapons."
 CPC_trip_to_India_o6: "Reaching diplomatic agreements"
 CPC_trip_to_India_o6_desc: "Our proposal for the peaceful reunification of the two Indias has gained wide acceptance within the top echelons of the Indian government, and the delegation will take this opportunity to raise with the United States, through the U.S. Ambassador to India, the difficulties currently encountered in the base, as well as to demonstrate the enormous benefits of the Northwest National Defence Front to the U.S. Asia-Pacific strategy."
 CPC_trip_to_India_o71: "Receive U.S. Technical Specialist"
 CPC_trip_to_India_o72: "Receiving the U.S. Army Mission"
 CPC_trip_to_India_o73: "Building a land port between India and China"
 CPC_HZ.1.t: "Complain"
 CPC_HZ.1.d: "Easily in the clean ticket gate to noon, Li Wen is taking a meal ticket end of the lunch box and a few old friends played a meal sitting around a piece, squatting while eating and chatting.\n\n\"What do you think the central government to repair this train station so far away, take me, I have to go out every day before dawn, stomping and stomping bicycle, stomping two kilometers to the ground, every day so tired and exhausted, the central government why did not want to build this train station to the edge of the city it, which does not give us additional traffic jam.\"\n\n\"The central government also add to our traffic, I think you do not add to the central government is to make a contribution to socialism -\" dispatcher Zhao rang into his mouth stuffed a pile of white rice, \"the central government that deployment can be far-reaching, said what seven years to build Hanzhong What central departments, arsenal, hospitals, schools and so on all have to move over, not to cover the station far away, expecting our old downtown that little piece of land to all these things stuffed ah.\"\n\n\"Come on, net bragging, I think the most to build two...\" the whistle suddenly sounded, the rumble of the wheels running over the tracks drowned out the words of the group of northwestern men, the crowd hastily a few mouthfuls and a bite haphazardly steak clean bowl of rice, lying to the window to look at this is What is the car - the car can not see the head, the front of the car or red or blue or green cargo compartments lined up, but also some cargo compartments tied to the green cloth wrapped in strange shapes of large things - people who know the industry can see some clues, the bags are mostly cement red bricks, wrapped in green cloth The medium-sized things wrapped in green cloth are mostly engineering equipment such as winches, and some semi-trailer heads, as well as batches of packaged containers - I wonder how many things this train brought to Hanzhong.\n\nThe young and old looked at each other, and the group squinted at Li Wenzheng, who was lying on the window with his eyes wide open, like a living fool."
 CPC_HZ.1.o: "\"Is that for real!?\""
 CPC_HZ.3.t: "Workshop"
 CPC_HZ.3.d: "Wu Zengguang stared at the glass bottles in front of him, motionless like a statue, only glancing at the newly hung clock on the gray wall with his afterglow - the hands in the white light clearly informed him that there were still ten minutes to go. He was still staring at the steady stream of empty bottles sliding across the assembly line.\n\nHe had just fled from the White Zone to Hanzhong, just as the new factory opened in Hanzhong, with the intention of trying it out he walked into the new recruitment office of Hanzhong ad hoc, the cadres of the recruitment office was a conscientious person, seeing that he had fled to Hanzhong and was thin, he was put into this workshop to watch the blown glass for impurities - this was really not a physical job, but there was no room for error. But there is no room for error, from morning to night have to keep an eye on, once the mistake of what did not see the batch of glass bottles will be destroyed.\n\nBut Wu Zengguang did not care, compared to the old days in Yichang no land no food had to flee, all the way up and down to a full meal and a hungry meal, more than today tomorrow's death, this place is too safe: food and housing, the end of the month also pay, the factory also opened the workers night school, will organize sports activities - he has even learned how to He even learned how to play basketball, but Wu Zengguang never understood what he was looking at the blown glass bottles in the end.\n\n\"Bam\" a sound, Wu Zengguang's mind back to the present.\n\n\"Old Wu, what to do after work.\" Worker Xiao Xu came over, \"how about a trip to the factory entrance to the state-run store? I heard recently that finally into our factory soda.\"\n\nSoda? What soda? This workshop is not the production of glass bottles? Where did the water come from? And what is soda? How can there be gas in the water, it is not bubbles, and when it comes to bubbles, it is not tea froth, what is this with what...\n\nThe stunned, Wu Zengguang was pulled into the state store by Xiao Xu spent 50 cents to buy a bottle of Bing Feng soda, until the silky coolness through the palm into the heart, Wu Zengguang finally came back to his senses, he stared at the glass bottle for a while, although understand the workshop glass bottle was originally used to fill the soda, but Wu Zengguang never understood the orange liquid in the bottle and the word soda what is the connection, soda? Where is the gas? The froth on the surface of the water, it is not still tea froth?\n\nThe little Xu on the side seems to see his dilemma, unhurriedly pick open the bottle cap, snort, the bottle of liquid like boiling began to gush up.\n\n\"Never drank it? Nothing I did not know this stuff at first, expensive is expensive, but this stuff is really good to drink...\" Xiao Xu raised the bottle and tilted his head, but also made a special toast action, Wu Zengguang follow the example, key open the cap clutching the glass bottle to the throat a dunk-"
 CPC_HZ.3.o: "Cold to the core!"
 CPC_HZ.4.t: "New change in Hanzhong"
 CPC_HZ.4.d: "Li Wenzheng felt that Hanzhong was getting bigger and bigger, and the old downtown was gradually becoming connected with the railway station, and the first bus in the city had been opened - from ancient Hantai to the railway station and back, just in time for his daily commute, which seemed a bit out of place on the old bicycle at home. Of course, it's always good to have a bigger city, at least you don't have to wonder why the train station was built so far from the old downtown - Li Wenzheng's thoughts dispersed with the changing architecture outside the window.\n\nThe building in front of him is the General Administration of Food Storage office building; across the street is the Hanzhong Railway Station Farmers' Market, where he occasionally clutches some food stamps and meat tickets to buy some food to take home, and the chickens and ducks at the Farmers' Market are freshly killed. Sometimes he would run into people selling aquatic products here, but usually he couldn't squeeze into the crowds of people coming to the market - eating fish was still too much of a luxury for most inland residents.\n\nAfter the intersection, there is a radio tower on the block, which is said to house the Hanzhong Radio Station, but since he doesn't have the spare money to buy a radio, Li Wenzheng doesn't have any real feelings about this tallest building in Hanzhong. What he cares more about is the Hanzhong Railway Station restaurant under the radio tower, where the railway station staff came to gather for dinner a year ago, and he was very impressed with the fried beef - but it's obviously not possible for him to come here and spend money on dinner himself, a meal that would cost him half a month's salary he can't afford to eat.\n\nFurther ahead is the new warehouse of Hanzhong Railway Station, earlier the railway station was repaired not long before the construction of Hanzhong was ready to start, because there is no qualified warehouse in Hanzhong, many engineering materials and even winch cranes these engineering equipment can only be placed in the open, left to the wind and sun, the final statistics down, light tire leaks suspended the use of the truck there are at least 70, red bricks are at least 10,000 to 20,000 pieces can not be used, cement is No way to say - fortunately now there is a large enough warehouse, loading and unloading how much cargo does not matter.\n\n\"Attention, comrades, the next stop will be Hanzhong Railway Station, stand firm and hold on to it -\" the conductor's yell brought Li Wenzheng's scattered thoughts back to reality, and he had to guard the ticket gate at the railway station again. Now Li is convinced of one thing."
 CPC_HZ.4.o: "Hanzhong is really getting better."
 CPC_HZ.5.t: "Letter from the Trotskyist Wang Shiwei to Xiao Jun"
 CPC_HZ.5.d: " My friend, Xiao Jun:\n\nTwenty years ago, your loud drink in the synagogue is still fresh in my mind. \"What can we do if we let him speak?\" was so much more deafening than the denunciations of other mediocre people, and it has cheered me up to this day, making me believe that there is still hope on earth.\n\nRecently, there was a new young man who arrived at the labor farm, which made me marvel at the coincidence of fate in this world. He went to Peking University, like me, and came to the Northwest with the same passion, the same desire to live by words, and the same misfortune to be convicted by words. When we first met, his face was blue and purple, and he introduced himself to me as Liu Songluo, the name of a radish. Since then I have called him Xiao Liu, or just Song Luo - but according to the prison supervisor, his real name is Liu Shaotang, and he changed his name to Liu Song Luo because he particularly liked the word \"grass head\". After the introduction, Song Luo showed me a stiff smile like a corpse, making me shudder. I think, if you do not engage in some unique pursuit, he may break down to seek short term, right. With uneasy concern, I visited him every day at dinner time, just as you always did with me.\n\nIt has been almost a year since I was transferred from Xi'an Prison No. 4 to Hanzhong Labor Reform Farm. Thanks to the care of the Party Central Committee, I am living well here, and in difficult times the farm has homegrown vegetables to ensure that I do not go hungry. Speaking of radishes, now the autumn radishes are about to be harvested. Last night the leaders decided to add a meal to the canteen and allowed me to pull a few. The big white radishes are all growing beautifully, like fat dolls covered in mud, and you have to hold them with two hands to move them. I gave them to the kitchen to be washed and cleaned, and they were delicious raw or cooked. Holding a bowl of steaming radish soup, I suddenly realized why Song Luo took the plant as a spiritual support: the living would hate to avoid us rightists, the radish out of the soil can still be eaten by us regardless of good or bad, perhaps this is one of the few warmth in the labor farm. I can't help but laugh at the thought of this, while looking more at the neighboring table sitting gobbling up the pineal.\n\nI hope I'm not disturbing you, and I hope you are healthy and safe.\n\nLong live the Chairman Mao\nYour Friend Shiwei"
 CPC_HZ.5.o: "Withhold the letter and send it again after you change it."
 CPC_HZ.6.t: "Surprise"
 CPC_HZ.6.d: "After the Hanzhong campus of Shaanxi Normal University was officially opened, staff and students from all over the world gradually gathered. Xiao Jun, a literature lecturer transferred from Xi'an, and Yang Tai, secretary of the College of Literature, were arranged to live in the same staff room.\n\n\"Mr. Xiao, the organization arranged for me to live with you, and I believe you understand the intention. As the secretary of our college, I have to keep an eye on you at all times. Of course there are some academic issues that I have to ask you for advice, and I hope I can make progress with you.\"\n\nXiao Jun sarcastically shook hands with the other party and called out \"Secretary Yang\" without saying anything more.\n\nThe initial unfamiliarity made each of them maintain some restraint and try not to add trouble to each other's work. After a day's work, they would eat together in the evening and go for a walk together downstairs. But after a month, Yang Tai and Xiao Jun's relationship remained the same, and their feelings did not improve half a point. Xiao Jun could not get along with this \"petty bureaucrat\" because of the various criticisms he had been subjected to. He felt that he was despised by the organization, and he felt that this was a spy planted on his side. Therefore, whatever Yang Tai did, Xiao Jun would deliberately keep his distance from him.\n\nWhenever someone from the family came to Yang Tai to talk about work, regardless of the identity of the visitor, whether it was good or bad intentions, Xiao Jun would always run back to his bedroom in a flash and close the door to avoid it. As for Xiao Jun's own life, he did not let Yang Tai know at all. He was in the study pen walking non-stop, as long as Yang Tai walked in immediately closed the pages of the book, with an imperceptible alert eye sweep, insisted that Yang Tai invited to the study outside to talk about things. Letters are even more Xiao Jun's forbidden. On one occasion, Xiao Jun went home early from school because he had few classes that day, while Yang Tai worked overtime until late in the evening and helped Xiao Jun retrieve a letter he hadn't had time to pick up from the communication room when he left school. When he returned home, Xiao Jun saw the envelope in Yang Tai's hand at first glance, his face was instantly furious and he grabbed it with his hands and questioned Yang Tai if he had peeked at it. After double-checking to make sure it was all right, he left Yang Tai hanging, rushed into the study and locked the door.\n\n...Maybe Xiao Jun who walked out of the study again will be embarrassed to apologize to Yang Tai for his recklessness and impulsiveness, but if there is a next time, his anger will still erupt and repeat the scene as usual.\n\nHowever, some of Xiao Jun's doubts were correct, Yang Tai was indeed assigned to observe Xiao Jun's movements at all times and report back to the organization on time. Xiao Jun used strict defense to block various ways to latch on to the relationship, and on this month's report, Yang Tai wrote this comment to Xiao Jun: He is a wolf, who only knows how to defend himself excessively and forgets how to get along with people."
 CPC_HZ.6.o: "Will be better?"
 CPC_HZ.7.t: "Dragon Vein of Hanzhong- The First"
 CPC_HZ.7.d: "There were three workers smoking on the side of the street, and behind them was the recently completed West City of Hanzhong, and one of the old men pointed to the square box-like vent and said, \"You know what this thing is? Like a fucking chimney, but not on the roof, I do not know what to do.\"\n\n\"I'm not sure, but I heard that it is connected to an underground great wall, in order to dig this thing do not know how much manpower and material resources mobilized!\" Another worker replied mysteriously.\n\n\"So mysterious, build the royal tomb it.\" The old man laughed, \"is prepared for Chairman Mao, Chairman Liu, they will go down in the future a hundred years with the emperor to bless the people.\"\n\n\"Otherwise people say you vulgar it, the Japanese have not fought away net for others to consider the coffin gilding or not the obscure things, according to me, perhaps in the digging of the Qin Shi Huang's Dragon Vein, on this chimney, perhaps people digging the Dragon Vein prepared for the eye! Once the dragon line is excavated, when the First Emperor opens his eyes to give blessings, it will ensure our national luck for a hundred years!\" The two old workers chatted gaily, leaving Xiao Wu to the side.\n\nXiao Wu - as a slightly more civilized and younger-looking trainee among the three - could only helplessly follow and laugh bitterly, understanding that this was not a dragon vein of the First Emperor at all, but this \"chimney But this \"chimney\" did send him into a memory.\n\n\"I know what this thing is.\" Xiao Wu took a puff of dry smoke, \"I came to Hanzhong two years ago...\""
 CPC_HZ.7.o: "\"At that time-\""
 CPC_HZ.8.t: "Dragon Vein of Hanzhong- The Second"
 CPC_HZ.8.d: "The central government instructed that school students have the obligation to participate in social work, but the labor project Xiao Wu participated in was special. The Department of Architecture of Xi'an University selected 50 physically fit young students with civil engineering experience to come to Hanzhong to participate in a week of voluntary labor, but nothing was mentioned about what exactly they were going to do.\n\nIt was only when he saw red flags flying everywhere and tents pitched at the construction site of the new city of Hanzhong that he understood everything. The winches were rumbling and the workers were busy transporting earth and rocks out, obviously digging bomb shelters - everyone knew that there would be another battle between the front and Japan, and similar to Xi'an, the three defense projects were not left behind in Hanzhong.\n\nAfter a brief break in the morning, the students who participated in the volunteer work were put to work. They did not have the winches used in factories, but relied on a tripod at the mouth of the shaft, hanging pulleys and ropes, with a large basket at the end of the rope, which was filled with soil, materials and people going up and down, and then pulled the rope back and forth by human power.\n\nHanzhong's geography is good, digging holes in the underground will rarely encounter rocks, with steel picks, shovels can dig in, we do not feel tired, but feel very fun. Imitating the bridges in the tunnel warfare he was laughing and joking. But this is not without danger, he once witnessed a student because he did not know the depth of the wooden basket from the transport of soil fell off the stomach smashed out a big hole, a leading teacher down the well almost fell to the bottom, after climbing up hands have been full of blood.\n\nDespite the rudimentary construction conditions and the risk of accidents, to his surprise, the people of Hanzhong still actively transported bricks and stones by tricycle and bicycle to support the construction of the air defense fortifications.\n\n\"...This is what you call 'Hanzhong Dragon Vein', there is nothing to protect or not to protect the national luck -\" Xiao Wu smoked a puff of smoke."
 CPC_HZ.8.o: "\"-it's preserving our lives.\""
 CPC_phase_2_done_most_focuses: "Our work on §Gagricultural§!, §mindustrial§!, and §Ymilitary§! reforms and developments have temporarily come to a conclusion, and we now have the capability to shift our focus towards §xnuclear industry research.§!"
 CPC_NUKE_BEGINS: "Nuclear Beginnings"
 CPC_NUKE_BEGINS_desc: "After five years of arduous and extraordinary construction struggle, the front has made significant progress in various aspects of politics, economy, and military. After deliberation and research by the Party Central Committee, under the codename: §OProject§! §xDawn§!, it will be officially launched. This will be the path for our Party, our military, and our front to master the §xultimate power§!."
 CPC_NUKE_BEGINS_tt: "The new §xnuclear program§! panel is now accessible from the §YDecision§!."
 CPC_NUKE_select_a_manager: "Determine the Project Manager"
 CPC_NUKE_select_a_manager_desc: "The National Defence Science Commission has been formed, and we have selected a relatively young group of comrades with some cultural background to advance the nuclear program; now, it is time to choose a general director for the National Defence Science Commission."
 CPC_NUKE_expand_research_institute: "Expand the Institute"
 CPC_NUKE_expand_research_institute_desc: "The Science Commission recommended: a reorganization of the major universities in the front, where nuclear physics and materials science, which are directly related to the nuclear program, would be taken out separately in order to form a corresponding central research institute.\n\nThe central government instructed that the Xi'an Municipal Committee should fully cooperate with the Science and Technology Commission to complete the reorganization of the institutions and ensure that the relevant researchers would carry out their research normally."
 CPC_NUKE_select_college_talents: "Select Graduate Talents"
 CPC_NUKE_select_college_talents_desc: "From the reorganization of the birth of the relevant departments of the Northwestern Polytechnic University to select a number of political awareness of particularly high, professional quality of particularly hard talent, compiled into the list of nuclear program engineering personnel, this work is particularly important, need to be careful and cautious, must be firm sense of confidentiality."
 CPC_NUKE_verify_the_nuclear_theory: "Verify Theories of Nuclear Physics"
 CPC_NUKE_verify_the_nuclear_theory_desc: "Experts and scholars from the Northwest Defence Research Institute were brought together to re-evaluate and calculate the current mainstream nuclear physics theory to ensure that the subsequent project would progress smoothly."
 CPC_NUKE_select_a_experimental_site: "Choose a Test Site"
 CPC_NUKE_select_a_experimental_site_desc: "According to the experience of other nuclear powers in the world - especially the United States - nuclear test sites in general need these criteria: sparsely populated and stable climate.\n\nThe northwest region of China is a natural and high-quality site for nuclear testing, but we still need to carefully research and select the best of the best, so that nuclear testing does not disturb the normal production and life of the local people."
 CPC_NUKE_supporting_industries: "Centralize Relevant Industries"
 CPC_NUKE_supporting_industries_desc: "As an important strategic deterrent weapon, the atomic bomb is of strategic importance to national security. If a country does not have sufficient supporting industrial support, it cannot realize the research and manufacture of nuclear bombs, and it cannot have the capability of nuclear deterrence.\n\nTherefore, the importance of a centralized supporting industry in nuclear bomb research is irreplaceable. It is not only the foundation of nuclear bomb research and manufacturing, but also an important guarantee to ensure the quality and performance of nuclear bombs as well as national security."
 CPC_NUKE_searching_uranium_mine: "Prospect for Uranium Ore"
 CPC_NUKE_searching_uranium_mine_desc: "After exploration, we have identified a number of uranium-rich deposits in the Chuan Kang area, mainly in the southern region, such as Liangshan, Leshan, and Panzhihua. Special mining units should be organized to explore and dig"
 CPC_NUKE_day_by_day: "Day by Day, We Strive"
 CPC_NUKE_day_by_day_desc: "We are well aware that the possession of nuclear weapons cannot be achieved overnight, but we are still determined to rise to the challenge and work hard day and night to prove to the world that the Chinese people will not bow down to the atomic bombs of the Japanese imperialists! China's determination to resist is higher than a mountain, deeper than the sea, and more indestructible than a diamond."
 Member_of_the_United_Front: "Member of the United Front"
 Member_of_the_United_Front_desc: "After Chiang Kai-shek's Kuomintang government announced its unconditional surrender to the Japanese, the National Defence Front took up the banner of anti-Japanese resistance, calling for unity with everyone they could and the overthrow of the reactionary rule of imperialism in China under the leadership of the proletariat.\n\nAll members of the National Defence Front have come to realize the correctness of the united front with unprecedented unanimity, and have united under the banner of the CPC with unprecedented consciousness to fight for a new China that is independent, free, democratic, united, and progressive."
 Member_of_the_United_Front_international: "Member of the International Anti-Imperialist Front"
 Member_of_the_United_Front_international_desc: "The term anti-imperialist united front was first coined at the Seventh Congress of the 3rd International. In his latest theoretical writings, Comrade Mao Tse-tung hit the nail on the head when he said that the way to build a wider anti-imperialist united front is to unite all the fraternal peoples of East and South-East Asia who are oppressed by Japanese imperialism.\n\nThe Communist Party of China and other fraternal communist parties should consistently unite under the banner of Marxism-Leninism, stand up against the old order of Japanese imperialism, and fight for a new East Asia and a new world that is independent, free, democratic, unified, and progressive."
 CPC_MUF_tooltip_1: "--------------\n§YMember of the United Front§! under the leadership of the £CPC_texticon §RCommunist Party of China§!. §GThey have a very high degree of independent decision-making power§!, and the £CPC_texticon §RCPC§! must influence the §YMembers of the United Front§! through §Ylocal Party committees§! and §Yregional bureaus§!.\n--------------"
 CPC_MUF_tooltip_2: "--------------\n§YThe International Anti-Imperialist Front§! is an extension of the §Ytheory of the united front§!, members are communist regimes in East and Southeast Asia recognized by the £CPC_texticon §RCommunist Party of China.§!\n--------------"
 CPC_MUF_tooltip_3: "--------------\nAs the leader of the §YUnited Front§!, the £CPC_texticon §RCPC§! can influence the §YMembers of the United Front§! through §Ylocal Party committees§! and §Yregional bureaus§!."
 CPC_leader_of_united_front: "Leader of the United Front"
 CPC_leader_of_united_front_desc: "[CPC_leader_of_united_front_desc]"
 CPC_leader_of_united_front_desc_1: "Born from the embers of the War of Resistance, the United Front (along with the third KMT-CPC Cooperation) rose from the ruins of China's ashes once again, bringing the CPC the status of an invisible \"leader\"; since the de facto truce between China and Japan, the CPC had begun to send party committees to the western warlords in the name of the United Front to assist and \"guide\" the warlords in governing their territories. \n\nInitially, the United Front work went very well, and through land reform and sound production policies, the CPC quickly built up great popularity among the people; the whole of Western China seemed to have gathered enough energy to shake the sky and the earth. At the CPC's command, an anti-Japanese force would surely arise and rush through the passes to the east of Shaanxi...\n\nHowever, since the fifties, the socialist reform movement has been intensifying; this angered both the aging warlords and the hobbling peasants of the Northwest. As a result, in the fall of 1961, Ma Jiyuan led former subordinates of the Qinghai Ma and the Hui of Qinghai alike to declare war on the Northwest National Defence Front, rupturing the United Front. Now the United Front has finally come to a critical point of life-or-death struggle; once it is over, no one knows where the future of this loose alliance might lead..."
 CPC_leader_of_united_front_desc_2: "Born from the ashes of the War of Resistance, the 4th United Front rose out of the ashes of China's shadowy burnings, which brought the £CPC_texticon §RCommunist Party of China (CPC)§! the status of an invisible \"leader\". Despite the ups and downs along the way, the CPC has withstood the test and not only didn't wallow in the turmoil of the early sixties but also seized the opportunity to expand its anti-Japanese base. Instead, it seized the opportunity to expand its anti-Japanese base areas and properly dealt with several thorny problems. The fact that the CPC has achieved such success in the midst of the economic blockade by the Japanese imperialists is enough to impress the old warlords in the united front."
 CPC_contact_with_PFS: "Contact \"The People Alone Society\""
 CPC_contact_with_PFS_desc: "Founded in 1941 as a cultural association by Liu Wenhui, the Wei Min Union(Only for People Union) was run by a number of leading intellectuals as a response to Chiang Kai-shek's attacks on public opinion and was expected to merge with the China Democratic League(CDL) in 1945, but after the Armistice of '47, the CDL retreated to Xi'an, and the relationship between the two organizations was severed.\n\nDuring the past ten years, the Wei Min Union recruited members and developed underground organizations throughout Sichuan and Hong Kong, and it became the number one party under Liu Wenhui. Many of them were sympathetic to the Communist Party and relations with them should be developed. This approach was good for promoting the policies of the Northwest at the present time, and in the long run helped to consolidate the Southwest."
 CPC_stablish_market: "Steady the Markets"
 CPC_stablish_market_desc: "With the blockade of the lower reaches of the Yangtze River, Sichuan merchants can no longer go to the lower reaches of the business, which caused their confidence in business to suffer a serious blow, coupled with the past Northwest's hard-line approach to industrial and commercial transformation so that they have to shut down or flee with the money. The reduction in supply has caused local prices to soar, and the use of the army to force open the doors of stores is no longer effective. In order to avoid further loss of wealth, we should slowly establish a corridor for goods between Shaanxi and Sichuan, and open up trade between the two places, so as to stabilize the market and take what we need."
 CPC_expand_Cheng_Yu_railway: "To Build a Bridge"
 CPC_expand_Cheng_Yu_railway_desc: "In 1903, the Qing government proposed the construction of the Sichuan-Han Railway intention, the western section of the Chengdu-Chongqing Railway; in 1936, the National Government set up the Chengdu-Chongqing Railway Engineering Bureau, began construction the following year; in July 1937, due to the outbreak of the War of Resistance against Japan and the stoppage, only 14% of the completion of the project, an inch of steel rail unpaved. After the war of resistance against Japan, Sichuan warlords although they completed the construction of this section of the railroad, also negligent management and maintenance, for a long time in the state of can be available. In the recent war, this railroad exposed many problems and caused much trouble for the enemy. Now that we have control of this railroad, it is clear that we cannot repeat the mistakes of the past, and the expansion of the Chengdu-Chongqing Railway has become an important task in the construction of heavy industry."
 CPC_Ji_Fang: "Ji Fang"
 TER_Mongolia_Reunification_Conference: "Sino-Mongolian Peaceful Reunification Conference"
 TER_Mongolia_Reunification_Conference_desc: "Chairman Mao instructed: §G\"The Mongolian revolution and the oppressed classes of China's oppressed nations are interconnected. We warmly welcome Mongolian comrades to stand on the same front with us and form an iron chain to crush Japanese imperialism.\"§!\n\nWith our secret support, the Mongolian revolution has achieved gratifying success at this stage. According to the £CPGAC_texture_loc §GCentral People's Government Affairs Committee§! decision, we will hold a §GSino-Mongolian Peaceful Reunification Conference§! with the Mongolian People's Party in Baotou. In the next few months, we will conduct active consultations on various aspects of §Ythe problem of Sino-Mongolian reunification§!."
 TER_MRC_info: "Peaceful Reunification Conference Progress: [?MRC_total_progress|0Y]%\n--------------------\nThe peaceful reunification talks will have §Y5 main proposals§!. China and Mongolia have different attitudes towards each proposal, and the solutions put forward are also varied. Before the end of the proposal, we can spend §Gpolitical power§! to select an appropriate §Gsolution§!; different solutions have different effects on the §Yconference willingness§! of both parties, please choose the solution carefully to promote peaceful reunification!\n\nWhen all proposals §Ghave been discussed§!, and the §Yconference willingness§! of China and Mongolia are both §Ghigher than 75%§!, both China and Mongolia will receive the corresponding§Gnational spirit§! and §Gcorresponding effect§!, based on the §Ychoices that have been made§!.\n\nIf there is §Rno hope for peaceful reunification, or the cost is too high§!, you can choose at any time to §Ywithdraw from the talks§!, §Yrecognize Mongolia's independence§! or §Yunify Mongolia by force§!.\n\nPlease note that if in the end §Rthe necessary conditions for unification§! are not met, all national focuses of the §GPeaceful Unification Talks§! branch will be automatically cancelled, and §Rcorresponding measures taken§! based on your choice."
