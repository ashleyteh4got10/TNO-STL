 CPC_Yang_Yingcai_stories.12.t: "The Road Home - Xi'an, [GetYear]"
 CPC_Yang_Yingcai_stories.12.d: "Li Ne stormed into Yang Yingcai's office and sat down on the hospital bed.\n\n“What’s the matter?” Yang Yingcai didn’t even look up. She had recently been added as a member of the National Defense Front's editorial committee for surgical textbooks, responsible for drafting sections on battlefield disinfection and military surgical procedures. She was busy outlining her plans.\n\n“Dad’s been coughing badly these past few days. The health doctor told him to cut back on smoking, but he just won’t listen. Every day he’s holding a cigarette—smoking while walking, smoking during meetings, smoking while looking at maps and writing articles!”"
 CPC_funni.0.t: "Towards liberation"
 CPC_funni.0.d: "Test pilot Chow How Lam angrily confronted the technical director, questioning why a new aircraft, still riddled with flaws and only test-flown once, had been sent to the South Seas: \"That plane has only been tested once and is full of issues, yet you sent it to the South Seas military administration?\" Hot tea fogged up the director’s glasses as he crossed his legs and waved dismissively, \"Why worry? It's normal for a new plane to have issues. At worst, a few unlucky pilots might die. As long as the plane performs well on the frontlines, post-incident investigations can handle the rest.\" Chow How Lam’s eyes widened in disbelief at the sheer irresponsibility of the bespectacled man before her.\n\n\"Can’t you take some responsibility?\" The words burst out before she could stop them, but what followed was a storm of fury.\n\"You insubordinate woman! Watch your attitude. Don’t even think about a promotion this year!\" The director exploded, spitting out his words as he berated her. Around them, colleagues prudently lowered their heads, remaining silent. Humiliated and enraged, Chow How Lam suppressed her feelings. In Fujitsu, much like in Guangdong, hierarchies were strict, and a single rebuttal could lead to consequences far more severe than verbal abuse.\n\nAfter the tirade ended, Chow How Lam left the office without a word. She walked to the testing field, seeking solace by staring at the aircraft in the hangar. Through hard work and diligence, she had earned her place at a major corporation like Fujitsu, and her exceptional piloting skills had made her one of Guangdong’s few non-Japanese test pilots. Yet, as she looked at the aircraft and recalled the freedom of flying, a wave of sorrow hit her: the freedom in Guangdong didn’t seem to belong to Guangdong’s people.\n\n\"Did you hear? Chongqing's been taken over by the commies,\" nearby ground crew discussed recent news. Commies? The word lingered in Chow How Lam’s mind, sparking an unprecedented thought. Alarmed by her own idea, she hurriedly left the airport and returned home.\n\nSeeking true freedom, Chow How Lam unfolded a flight map, examining global routes and considering possible destinations for defection. The U.S., known as the land of freedom, was too far. Australia could be reached with a full fuel tank, but the radar systems of the Co-Prosperity Sphere were no joke. India seemed promising but required crossing the towering Himalayas, where the altitude alone would likely trigger radar detection. Finally, her gaze fell on a red-marked region—China's Northwest—and Chongqing, not yet marked red but recently taken by the Communists. The Communists? To Chow How Lam, this organization was utterly foreign. The Co-Prosperity Sphere's propaganda stations constantly vilified it, while underground broadcasts hailed it as the liberator destined to save China. Chongqing seemed like the best option—close, low risk, and, most importantly, a chance to escape the suffocating air of Guangdong.\n\nDays later, Fujitsu arranged for a new fighter jet to be flown directly to the South Seas for testing. Unsurprisingly, Chow How Lam was selected as the test pilot. She sat in the cockpit, donned her gear, and glanced at the half-filled fuel tank. \"It’s time,\" she thought. Skillfully, she lifted the plane into the air, heading south as instructed. But once airborne, she turned off all electronic equipment, banked sharply, and accelerated, flying low.\n\nAirport personnel frantically tried to contact her, but all efforts failed. Hugging the terrain, she soared over the Nanling mountains and soon reached Chongqing. Air-raid sirens blared across the city as residents scrambled into shelters. Her low-altitude flight made her difficult to target, with most anti-aircraft rounds missing her entirely, though one hit the tail, leaving a gaping hole. Switching to a public radio channel, she announced her intention to defect. After circling a few times, Chow How Lam landed at Chongqing Airport, where a group of armed soldiers immediately surrounded the plane. She opened the canopy, raised her hands, and addressed the approaching officer:"
 CPC_funni.0.o: "\"I've come to join the National Defense Front!\""
