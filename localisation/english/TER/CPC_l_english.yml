 CPC_funni.3.t: "Don't You Dare Plagiarize!"
 CPC_funni.3.d: "A rickshaw carried Natsuda Mamoru to the National Art Museum. After stepping down, he haggled loudly in broken Chinese with the rickshaw driver. Once the deal was settled and the driver sent away, he straightened his posture, adjusted the appointment letter he had purchased from the Ministry of Education, and strode into the museum, proudly taking his post as a visiting professor.\n\nBy arrangement of the school, Ke Linde was inexplicably assigned as Natsuda's assistant, essentially acting as his errand boy. Six months later, without Ke’s consent, Natsuda took a public service oil painting that Ke was working on for a deadline and submitted it under his own name. When Ke confronted him, Natsuda brazenly dismissed his objections: “Young man, you need to have a craftsman’s heart. Think about it—today you help me win an award, and when I break into the upper circles, I’ll naturally lift you up with me.”\n\nShameless! Ke cursed in his heart. Their argument escalated and eventually reached the courthouse. But two days before the trial, an unfamiliar man paid Ke a visit, threatening him outright: “Withdraw your lawsuit. Mr. Natsuda is a model figure of Sino-Japanese friendship. Your actions are detrimental to goodwill.”\n\nKe chuckled bitterly at the absurdity of the situation, but before he could respond, the stranger knocked him out cold with a heavy blow and dragged him away.\n\nThe next day, a signed withdrawal statement and an apology letter were delivered to the courthouse and Natsuda’s residence, respectively. The court processed the withdrawal as usual, canceling the lawsuit. As for Natsuda, he performed a grand display of \"magnanimity,\" publicly \"forgiving\" his assistant and advising him not to repeat his mistake.\n\nDrunk on his own arrogance, Natsuda boasted about the incident whenever he drank with his friends, vividly embellishing how he had \"taught a lesson\" to a student trying to \"steal\" his work. Meanwhile, the true victim, Ke Linde, was bedridden, recovering from his injuries. When he finally healed two months later, he discovered that aside from the ever-\"forgiving\" Natsuda, the other instructors now avoided him like the plague, fearing any association that might lead to trouble. Left with no other options, Ke was forced to swallow his pride and return to being Natsuda’s assistant, enduring the exploitation in silence.\n\nBut soon, a turning point arrived. After the Guofu Road Incident, the Nationalist Army imposed martial law across the city. Yet, the crackdown failed to suppress the rising tides of resistance.\n\nUnderground journalist Lin Yiba sought Ke out, bringing photographs of the event and pleading with him to create an anti-Japanese propaganda painting to be posted alongside the images. Burdened by years of oppression, Ke immediately agreed.\n\nTwo days later, a photograph and a painting appeared across the city's walls and alleyways. The photograph depicted the Nationalist Army brutally suppressing and expelling patriotic student protesters. The painting, in contrast, showed a robust man drawing a bow to shoot at the sun, accompanied by bold calligraphy: \"Unite as one, stand against foreign aggression!\"\n\nThe streets buzzed with conversation as laborers and breakfast-goers alike gathered around the images, denouncing the Nationalist government's shameless collusion with Japan.\n\nAs usual, Natsuda took a rickshaw to the museum. But as he prepared to haggle over the fare, the driver pulled out a copy of the propaganda poster and waved it in front of his face, staring at him with a peculiar expression.\n\nA chill ran down Natsuda’s spine.\n\nHe said nothing more, paid the fare in full, and hurried away."
 CPC_funni.3.o: "Sooner or later, your mask will be torn off."
 CPC_funni.3.o_tt: "A JOINT DECLARATION BY §mTNO:LAR§! AND §xTNO:TER§! TEAMS\n\nTHIS EVENT IS A REPLICA OF REAL LIFE EXPERIENCE FROM THEN §mLAR§!ICON ARTIST, NOW §xTER§!ICON ARIST §YUNCLE CHRIS§! AND HIS ICON §YA UNITED FRONT RESURGE§!. THE TEAMS CALL ON §YCOMMUNITY CREATORS§! TO PAY RESPECT TO THE §YAUTHOR§!'S WILL, SO AS TO PRESERVE §YAUTHORS§!' MOTIVATION OF CREATION."
 begin_civilwar_in_vietnam_tt: "Under our influence, the §GVietnamese communists§! will rise in resistance!\nWe will be able to dispatch §Y2 volunteer divisions§! to assist the local communists in liberating Vietnam."