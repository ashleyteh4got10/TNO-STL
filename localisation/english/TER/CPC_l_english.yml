 CPC_RBM_dummy_1: "Roaring Thunder, Falling Rain"
 CPC_RBM_dummy_1_desc: "The blockade led to frustration, frustration to adventurism, and adventurism created betrayal; rain amidst the mountains presaged a greater storm. The fallout from the Five-Year Development Plan brought the Communist Party back to reality; reactionaries, hearing this news on the wind, intensified their attacks both inside and out. Only calmly handling the most important matters first, compensating for their failures, regrouping after this setback could lead the Base Area out of this haze."
 CPC_RBM_dummy_2: "Hope for an Eastern Dawn"
 CPC_RBM_dummy_2_desc: "Mengjiang, Sichuan, and Chongqing were liberated; Shaanxi, Gansu, Ningxia, and Qinghai have undergone construction. After these years of painstaking labor, the Base Area's revolutionary project has finally known renewal and rapid progress. The path has been tortuous, but the future is bright. With the entire Front working together and exerting their strength, we have at last glimpsed the warmth of dawn's light at the end of this long, long road. To recognize our mistakes and have improved is truly what matters most. Now the Base Area is pacified as before, but we must remain cautious, productive during the day and watchful by night."
 CPC_RBM_dummy_3: "Abundance for the Masses"
 CPC_RBM_dummy_3_desc: "Along with industrialization, collectivization has steadily advanced; the assembly line has replaced manual labor, tractors replace the ox and plow, as the Base Area advances with vigor, taking large strides forward. We have completely dissipated the haze of the Great Leap Forward, striding forward with renewed confidence and mustered revolutionary strength. Liberation of the motherland is no longer just a slogan, but a target instead! Times have changed in the Base Area, and each day, each month, heralds a new dawn."
