 CPC_NWB_entry_tt: "Click to activate the £CPC_texticon  §RCommunist Party of China - NorthWest Bureau§! GUI"
 TER_NWB_generic_info: "£CPC_texticon §RCommunist Party of China– Central Northwest Bureau§!\n\n§YSix Major Tasks§!\nThe £CPC_texticon §RCentral Northwest Bureau§! oversees regions including §YGansu, Ningxia, and Qinghai§!. Since 1961, the provocations of the §eFeudal Warlord Reactionary Ma Jiyuan§! have caused §estrained interethnic relations§! in the Northwest, which has inflicted §eheavy losses§! on the Party's and the Front's anti-Japanese production efforts. Therefore, the £CPC_texticon §RCentral Northwest Bureau§! will prioritize restoring production and uniting the relations among the Han, Hui, Mongolian, Tibetan, and Uyghur ethnic groups for an extended period.\nIn response to practical production, living, and ethnic unity needs, the £CPC_texticon §RCentral Northwest Bureau§! tasks are divided into §YSix Major Tasks§!. These tasks can be completed through the interactive interface located at the upper right side of the £CPC_texticon §RCentral Northwest Bureau GUI§!. Each task consists of §Ythree levels§!, and completing all levels will increase §YRegional Unity by 1 level§!.\nSpecific bonuses related to the §YSix Major Tasks§! and §YUnity Level§! can be viewed on the §Yhexagonal display§! in the interaction area.\n\n§YRevolutionary Cradle§!\nShaanxi, Gansu, Ningxia, and Qinghai form the [CPC.GetFlag] §mNational Defense§! §VFront§! core region. Grassroots and mid-level cadres from the Northwest serve as a fundamental pillar of the £CPGAC_texture_loc §GPeople's Government§! across various base areas. As such, it is imperative to prioritize cultivating £CPC_texticon §GRevolutionary Cadres§! in this region.\nThe £CPC_texticon §RParty's§! work in §YLocal Bureaus§! requires substantial support and cooperation from £CPC_texticon §Gmid-level and grassroots cadres§!. If the number of Party members assigned to §Ya particular Local Bureau§! is §Yinsufficient§!, its §Yactual benefits§! will be §Rlower than§! its §Ytheoretical value§!, and §Gvice versa applies§!.\nPlease carefully allocate §YParty member distribution§! across the Local Bureaus and set the §YParty fee budget§! at the beginning of each year to fulfill the §Ylong-term developmental interests§! of the Front.\nDetailed information regarding the §Yneeds of each Local Bureau§! can be reviewed through the interaction interface."
 NWB_LD_L_tittle_1: "§Y[?NWB_acted_state.GetName]§!"
 NWB_LD_L_tittle_2: "Unity Level: Level [?NWB_acted_state:NWB_unity_level|0Y]\nNumber of Party Members in the Region: §Y[?NWB_acted_state:NCCPC_current_party_pop_in_state|2Y]§!K\nTotal Registered Party Members: §Y[?NCCPC_current_party_pop|2Y]§!K"
 NCCPC_current_party_pop_from_shaanxi_tt: "§YShaanxi§! is the §Gcore territory§! of the Central Northwest Bureau, with §YParty membership§! accounting for §Y0.5%§! of the total regional population.\n\nCurrent Party membership in this region: §Y[?CPC.NCCPC_current_party_pop_from_shaanxi|2Y]K§!"
 NWB_task_business_tt: "Task: §jRestore Commerce§!\n\nWhen §GMAX LEVEL§!, this region's GDP §Gincreases§! by §Y7.5%§!, and regional Unity Level §Gincreases§! by 1 level.\nClick to proceed with the task, each level upgrade requires §Y15 days§!."
 NWB_task_agriculture_tt: "Task: §nAgricultural Production§!\n\nWhen §GMAX LEVEL§!, the §YAgricultural Social Development Level§! of the front §nincreases§! by 5 points, and regionalUnity Level §Gincreases§! by 1 level.\nClick to proceed with the task, each level upgrade requires §Y15 days§!."
 NWB_task_infrastructure_tt: "Task: §YInfrastructure Construction§!\n\nWhen §GMAX LEVEK§!, this area §Ggains§! §Y1 level§! of infrastructure, and regional Unity Level §Gincreases§! by 1 level.\nClick to proceed with the task, each level upgrade requires §Y15 days§!."
 NWB_task_unity_tt: "General Task: §GUnite the People§!\n\nAt §GLevel 2§!, §Gwe will gain a core claim on this region’s key territory§! and §Greceive§! §Y1§! administrative building.\nAt §GLevel 4§!, this area §Ggains§! §Y15%§! regional mobilization speed.\nWhen §Gfully upgraded§!, the §Yparty membership number§! in this region will increase from §Y0.15%§! of the total population to §G0.3%§!.\nThis task progresses automatically through the completion of other tasks and does not require manual operation."
 NWB_task_education_tt: "Task: §OCultural Education§!\n\nWhen §GMAX LEVEL§!, this area §Ggains§! §Y1§! school, and the region's unity level §Gincreases§! by 1.\nClick to start this task. Each level upgrade requires §Y15 days§!."
 NWB_task_healthcare_tt: "Task: §m Medical and Health Services§!\n\nWhen §GMAX LEVEL§!, this area §Ggains§! §Y1§! hospital, and the region's unity level §Gincreases§! by 1.\nClick to start this task. Each level upgrade requires §Y15 days§!."
 NWB_task_security_tt: "Task: §lMaintain Public Order§!\n\nWhen §GMAX LEVEL§!, this area §Ggains§! §Y1§! prison, and the region's unity level §Gincreases§! by 1.\nClick to start this task. Each level upgrade requires §Y15 days§!."
