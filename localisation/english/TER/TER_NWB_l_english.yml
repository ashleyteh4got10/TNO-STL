 TER_NWB_modifier_0: "Northwest Bureau - Core Area"
 TER_NWB_modifier_0_desc: "Nearly 70% of the national pillar industries of the National Defense Front are concentrated in Shaanxi. Likewise, the Communist Party of China, which has cultivated its development in Shaanxi for years, regards it as the largest base for nurturing the next generation of cadres.\n\nIt is no exaggeration to say that Shaanxi is the §Yheartland§! of the future, §m\"Free China's§! §xlast hope\"§!. Whoever holds the power of administrative appointments within the Central Northwest Bureau will inevitably steer the course of §xChina’s revolutionary vessel§! through the surging tides of the future."
 TER_NWB_modifier_1: "Northwest Bureau - Jurisdiction"
 TER_NWB_modifier_1_desc: "The main jurisdiction of the Central Northwest Bureau primarily covers §YGansu, Ningxia, and Qinghai§!. In traditional Chinese discourse, these regions have long been considered the northwestern frontier of the Han domain, enduring centuries of ethnic discord. To this day, war has ravaged the land, leaving it desolate and sparsely populated—a true tragedy.\n\nNow that the Qinghai Ma Rebellion has been quelled, the immediate priority must be restoring production and stabilizing ethnic relations—§Rthere must be no further complications§!.\n\n§xShould the grievances of the Northwest's many peoples be reignited, the very fate of the Chinese Revolution may be lost forever.§!"
