 city_state_consumer_tt: "§GCivilian Production Model§!\n--------------------\nGain §G3%§! §GDevelopment Level§! each month.\n\n§YEach city§!, based on its §GDevelopment Level§!, will yield benefits such as §YGDP Growth§!, §YHealthcare Quality Societal Development,§! §YConsumer Goods Production§!, etc. For more details, please inspect the National Spirit labeled §YCommunist Party of China (CPC) - Southwest Bureau§!.\n\nAll currently-controlled §Ycities§! will have different benefits based on their §RMilitarization§!; inspect the National Spirit §YPLA - Southwest Corps§! for details."
 city_state_weapon_tt: "§RMilitary Production Model§!\n--------------------\nGain §G0.5%§! §GDevelopment Level§! each month.\nGain §G2.5%§! §RMilitarization§! each month.\n\nEach city will yield additional £tt_prod_unit §GProduction Units§!, §YIndustrial Expertise§!, and §YIndustrial Equipment§! to the National Defence Front, depending on its §GDevelopment Level§!.\n\nAll currently-controlled §Ycities§! will have different benefits based on their §RMilitarization§!; inspect the National Spirit §YPLA - Southwest Corps§! for details."
 mine_state_mine_tt: "§TFocus on Extraction§!\n--------------------\nExcept for the §LSouth Xikang Administrative Region§!:\nGain §G1.5%§! §GDevelopment Level§! each month.\nGain §G1.5%§! §RMilitarization§! each month.\n\n§YMining sites§! that adopt this strategy will yield benefits to §YIndustrial Expertise§!, §YIndustrial Equipment§!, §YResource Gain Efficiency§!, and more based on their §Glocal Development Level§!, as detailed in the National Spirit §YCPC - Southwest Bureau§!.\n\nAll currently-controlled §Ymining sites§! will have different benefits based on their §RMilitarization§!; inspect the National Spirit §YPLA - Southwest Corps§! for details."
 mine_state_trade_tt: "§GFocus on Trade§!\n--------------------\nExcept for the §LSouth Xikang Administrative Region§!: \nGain §G1.5%§! §GDevelopment Level§! each month.\nGain §G1.5%§! §RMilitarization§! each month.\n\n§YMining sites§! that adopt this strategy will yield benefits to §YGDP Growth§!, §YConsumer Goods Production§!, §YResource Gain Effiency§!, and more based on their §Glocal Development Index§!, as detailed in the National Spirit §YCPC - Southwest Bureau§!.\n\nAll currently-controlled §Ymining sites§! will have different benefits based on their §RMilitarization§!; inspect the National Spirit §YPLA - Southwest Corps§! for details."
 TER_SWB_balance_tooltip: "[TER_SWB_balance_tt]\n--------------------\n§YThe Main Focus of the Southwest Bureau§! is dependent on its §GDevelopment Level§!, §RMilitarization§!, and §Ysome special effects§!; you can check the details about the §YMain Focus of the Southwest Bureau§! through a §YNational Spirit§! on the panel."
