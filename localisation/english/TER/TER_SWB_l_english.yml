 TER_SWB_map_Pan_Zhihua_tt: "South Xikang"
 TER_SWB_map_Pan_Zhihua_tt_delayed: "The §RSouth Xikang Administrative Region§!, named as the Republic of China's §YXikang Province Third Administrative Region§!, arose from the consolidation of the §YYanbian, Ningnan, and Xichang§! counties. This area is both rich in mineral resources and densely populated, being an important source of metals, salt, and coal for the National Defence Front.\n\nAs the mineral veins in the region are concentrated around the §Gvillage of Panzhihua§!, the central government has instructed that over the next five to eight years, the §RSouth Xikang Administrative Region§! should, as much as possible, regard §GPanzhihua§! as its core and establish a number of mining towns with all due haste. This can spur the expansion and rapid growth of the local mining industry, and also §Galleviate the Front's issues finding mines.§!\n\nTypes of mineral deposits: §gIron§!, §LSalt§!, §sTin§!, §dNickel§!, §qLead and Zinc§!, §rCopper§!, and §RPhosphorus§!"
 Li_Fuchun_tt: "§YLi Fuchun§!\n--------------------\n£CPC_texticon  First Secretary of the §RSouthwest Bureau§!\n£TER_texticon_PLA  Political Commissar of the §RPLA§! Southwest Corps\n§GMao Zedong Thought§!\n--------------------\nLi Fuchun, a native of Changsha, Hunan Province, currently serves as the First Secretary of the Southwest Bureau of the CPC. The Southwest Bureau is a local department of the CPC stationed in Xikang; it is mainly responsible for the United Front's war against the old Kuomintang warlords in Sichuan and Xikang. It also directs the development of Sichuan and Xikang's industry and agriculture, among other tasks.\n\nLi Fuchun advocates for the §YMain Focus of the Southwest Bureau§! to be §Gcivil affairs§!, arguing that §Gfocusing on civil affairs§! would help §Gindustrial and agricultural production§! in the Southwest and enhance the §Geconomic strength§! of the National Defence Front."
 Han_Xianchu_tt: "§YHan Xianchu§!\n--------------------\n£TER_texticon_PLA  Commander of the §RPLA§! Southwest Corps\n£CPC_texticon  Secretary of the §RSouthwest Bureau§!\n§RStratocratic Communism§!\n--------------------\nHan Xianchu, a native of Huang'an, Hubei, is currently the commander of the Southwest Corps of the PLA, which is currently stationed in the area of Sichuan and Xikang, and has the important responsibility of handling southern security for the National Defence Front.\n\nHan Xianchu advocates for the §YMain Focus of the Southwest Bureau§! to be §Rmilltary affairs§!, arguing that §Rfocusing on military affairs§! would help the Southwest resist harassment by the §Rfalse ROC and its running-dog regimes§!, while also enhancing the §Rmilitary strength§! of the National Defence Front."
