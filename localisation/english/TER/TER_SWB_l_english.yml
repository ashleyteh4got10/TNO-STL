 CPC_SWB_adjust_balance_to_m: "It will cost §Y20§! Political Power to shift the Main Focus §Y5§!% towards §RMilitary Affairs§!. The §YAdjustment Button§! can't influence the Main Focus by more than §Y20%§!."
