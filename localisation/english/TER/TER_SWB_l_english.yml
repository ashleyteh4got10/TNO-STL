 Alert_SWB_focus_enabled: "The Southwest Bureau can now launch a new §YOperational Policy§!"
 Alert_SWB_focus_enabled_Desc: "The Southwest Bureau has no §YOperational Policy§!; click here to advance their work through the £CPC_texticon §RCPC - Southwest Bureau§!."
 TER_SWB_generic_info: "£CPC_texticon §RCommunist Party of China - Southwest Bureau§!\n\n§YOperational Policies of the Southwest Bureau§!\n-In the upper right section of the interface is the Southwest Bureau's distinct local focus. It allows an §YOperational Policy§! for these four areas of focus: §yXikang§!, §GSichuan§!, §RChongqing§!, or §VEast Sichuan§!. Different §YOperational Policies§! may also unlock different §Ycorresponding National Focus branches§! for the Southwest Bureau.\n\n§LUrban-Mining Development Overview§!\n-In the upper left section of the interface you can switch between two §LMap Modes§!: the §LMining Map Mode§! or the §LUrban Map Mode§!. In these different Modes, areas around Sichuan and Xikang will have different §LMajor Locations§! that can be viewed; each area has its own §GDevelopment Level§! and §RMilitarization§!, as well as a corresponding §YProduction Mode§! that can be swapped to.\n\n\nThe contributions of the £CPC_texticon §RCommunist Party of China - Southwest Bureau§! to the party and the Front can be seen directly through the following National Spirits: §YMain Focus of the Southwest Bureau§!, §YCommunist Party of China - Southwest Bureau§!, and §YChinese People's Liberation Army - Southwest Corps§!."
