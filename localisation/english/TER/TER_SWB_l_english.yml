 XIK_PLA_Southwest_corp_modifier_desc: "The Southwest Corps is stationed in the Sichuan-Xikang region, bearing a crucial responsibility in safeguarding the southern defense of the National Defense Front.\n\nCurrently, the Corps Commander is Comrade Han Xianchu, while the Political Commissar is Comrade Li Fuchun."