 XIK_Southwest_Bureau_modifier_desc: "The Southwest Bureau is a regional body of the Communist Party of China (CPC) stationed in Xikang, primarily responsible for coordinating the united front efforts with former Kuomintang warlords in Sichuan and Xikang, as well as overseeing industrial and agricultural development in the region.\n\nThe First Secretary of the Southwest Bureau is Comrade Li Fuchun, while the Second Secretary is Comrade Han Xianchu."
