 CPC_SWB_policy: "The Southwestern Strategy"
 CPC_SWB_policy_desc: "After the Ninth National Congress, the Southwestern and Northwestern National Defence Fronts were merged, but the task of the Southwest Bureau is not yet over; now the Central Committee has approved a new round of Operational Policies for the Southwest Bureau, and we must continue to devote ourselves to the construction of the Sichuan and Xikang area with all due passion and eagerness."
