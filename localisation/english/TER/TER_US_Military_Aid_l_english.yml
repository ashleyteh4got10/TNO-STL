TER_MOD_CPC.1.t: "Fly Tigers, Reborn"
TER_MOD_CPC.1.d: "The setting sun bathed Liangshan Airfield's runway in a blood-red hue. Squadrons of F-100 \"Super Sabre\"  roared into land, their wings carving silver-gray trails through the twilight. When Xu Tingze recognized the winged tiger emblem on the fuselage, his Adam's apple quivered—the Flying Tigers' warhawks had finally returned to their homeland.\n\nHis boots stumbled slightly as they met the asphalt's coarse texture. A flood of memories surged: Baishiyi Airfield in 1945, that storm-lashed night where tens of thousands of oil-paper umbrellas surged like a dark ocean under searchlights. U.S. MPs bellowed as they swung rifle butts, a mother's screams vanishing into engine thunder as she thrust her infant into a C-47's belly. The bloodied claw marks left by his countrymen on the transport plane's hatch still snaked through his nightmares across the Pacific.\n\nAt the flight school, the dull crack of an American instructor's baton against his control stick burned hotter than the San Antonio sun. The embezzling ration funds, the shameless smirk of the trainee commander—these chilled him deeper than the bone-numbing gales that howled through cockpits on winter nights.\n\nSuddenly, the airfield loudspeakers blared the \"Yellow River Cantata\". As brass notes pierced the clouds, Xu's fingers brushed the yellowed family letter in his pocket. The ancestral home in Zhuoshui Ancient Town might lie in ruins, yet what he truly yearned to see now was the faith—the unyielding belief that had let those straw-sandaled fighters with homemade rifles stall Japanese armored divisions in the Taihang Mountains."
TER_MOD_CPC.1.o: "Fly Tigers, Reborn!"

TER_MOD_CPC.2.t: "A New Toy"
TER_MOD_CPC.2.d: "Colonel Williams unfastened his olive-drab canvas bag and carefully extracted a metallic tube, placing it on the rough wooden table.\n\n\"Zhao, this might change your air defense situation,\" he said in stiff Chinese, tapping the English markings on the tube’s surface—XFIM-43\"RED EYE.\"\n\nZhao Zhenhua running his fingers over the cold metal. \"Colonel, what can this thing hit?\" \n\n\"Jets,\" the American grinned. \"And, of course, those damn helicopters—you’ve had your fair share of trouble with them before.\"\n\n\"Range?\" Zhao cut straight to the point.\n\n\"Three klicks, infrared guidance. Locks onto heat signatures—way better than eyeballing flak guns.\" Williams pulled out a stack of photos showing fireballs erupting over a desert range. \"Test data shows a sixty percent kill rate. Of course, that’s assuming your boys can haul it through the trenches.\"\n\nOutside, the shriek of an air-raid siren cut through the air. Both men fell silent until distant explosions rumbled. Zhao stared at the weapon’s dull gleam, then suddenly smirked.\n\n\"Colonel, you know what we’re best at?\"\n\nWithout waiting for an answer, he slung the \"Red Eye\" over his shoulder with a fluid motion, as if he’d drilled it a thousand times.\n\n\"Turning foreign toys,\" he patted the launcher, \"into the people’s iron fist.\"\n\n"
TER_MOD_CPC.2.o: "Good Hunting"

TER_MOD_CPC.3.t: "The \"Thing\" "
TER_MOD_CPC.3.d: "The conference room was thick with the scent of coffee and cigarettes. The beam of a projector cast a slide of the M50\"Ontos\" armored tracked anti-tank vehicle onto a canvas screen. Colonel Williams, the American military advisor, clenched a cigar between his teeth and tapped the outline of the turret with a pointer, his voice brimming with salesman-like enthusiasm:\n\n\"Gentlemen, this is the 'can opener' you need! Six 106mm recoilless rifles—firepower density equivalent to an entire artillery battery. Excellent road mobility. It can easily hunt down any Japanese armored target.\" \n\nZhao Zhenhua narrowed his eyes, his fingertips lightly drumming the table. The \"Ontos\" on the slide certainly looked imposing, but the thin hull armor and open gun positions made him frown. Does this thing, which looks like six bazookas welded onto a tractor chassis, really work?\n\n\"Colonel, what about its protection?\" Zhao asked, tapping the image with his pencil.\n\nWilliams' smile stiffened for a moment: \"Emphasizing mobility and firepower projection necessitates sacrificing some armor. Moreover, the HEAT rounds from the 106mm recoilless rifles can easily penetrate the front armor of Japan's most advanced Type 23 tank. Your forces could rely on tactical maneuvering—\" \n\n\"Meaning,\" Zhao interrupted, \"a single nearby HE shell burst could turn the entire crew into swiss cheese.\" He flipped open his notebook and pushed across several photos: wrecked Type 5 tanks amid the loess gullies, some piled with reinforcing sandbags, others fitted with additional armor. \"Besides, Gao Zongwu's lackeys have already started welding steel plates onto their old tanks.\" \n\nSilence fell over the tent. The projector hummed, and dust motes floated like frozen snowflakes in the beam of light.\n\n\"What we need,\" Zhao stated, glancing at the slide, \"is a tank capable of facing Japanese armor head-on, with balanced firepower, protection, and mobility... not...\" he paused, \"...a mobile fireworks launcher.\"\n\nWilliams' face turned purple with rage. As the PLA delegation rose to leave, he overheard someone mutter in Chinese: \"Do they think we're a scrap yard...?\" "
TER_MOD_CPC.3.o: "But what choice do we have?"