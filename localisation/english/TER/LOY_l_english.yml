 LOY_lu_han: "Lu Han"
 POLITICS_LOY_LU_HAN_DESC: "Lu Han, a Yi, was born in Zhaotong in 1895. At an early age, he studied military affairs with his own cousin, Long Yun. The years of peace passed by, and when the Japanese imperialists invaded, Lu Han fought the Japanese army with wit and cunning, defending his hometown from oppression, but this was far from enough to save the ineffectual Chiang Kai-shek's government. After the Yu Xiang Gui fiasco, Long Yun took the initiative to leave the Chongqing Central Committee behind and returned to Yunnan to defend himself under the banner of \"Protecting the Border and Safeguarding the People\".\n\nWhen the patriots gathered in front of the provincial government in Wuhuashan, harshly crusade against self-liberation Long Yun, Lu Han always see his cousin a smile, let him go. Not long, the crowd will slowly disperse. As time went by, the martial arts hall on the shores of Cuihu Lake had long since fallen into disuse, and the Lu Mansion, which was just across the lake from it, also closed its doors and refused to be rebuked by any outsiders - and the tide of anti-Japanese protests gradually faded with time.\n\nLong Yun died in 1960, and Lu Han, who had taken over the burden left by his cousin, became the head of a state. For more than a decade, Long and Lu have been positioned as \"local emperors\" in the ruling class of Yunnan, but if this part of the country is to continue, it will have to catch up with the trend of the times and become a trendsetter for the whole of China."
