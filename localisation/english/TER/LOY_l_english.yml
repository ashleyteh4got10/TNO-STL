 TER_SW_new_decisions: "[TER_SW_new_decisions_title]"
 TER_SW_new_decisions_desc: "[TER_SW_new_decisions_desc]"
 TER_SW_new_decisions_title_LOY: "Southwestern New Deal - Yunnan"
 TER_SW_new_decisions_title_GUZ: "Southwestern New Deal - Guizhou"
 TER_SW_new_decisions_title_GUX: "Southwestern New Deal - Guangxi"
 TER_SW_new_decisions_desc_LOY: "The \"New Deal\" was probably the sweetest word that came out of Lu Han's mouth, and he promised to make all Yunnanese live a prosperous life with plenty of food and clothing. So, to build such a happy land, he could shoot opponents in the street with submachine guns, send the army to break up CPPCC meetings, allow landlords to hang peasants who resisted taxes, and eliminate everything that disturbed the Long family. But nearly a decade has passed since the bloody killings. Now everyone was at peace and working hard to do their part in building an exemplary province.\n\nThe economy is recovering fast and Yunnan is just about alive, looking exceedingly uneventful in the vast post-war expanse of China. As the rain fell from the sky, washing away the filth from the streets, memories faded into legend, and diners in the teahouses even began to talk about the wise Marshal Long's protection of Yunnan from the Japanese invasion, savoring the foggy new tea with emotion."
 TER_SW_new_decisions_desc_GUZ: "The \"New Deal\" slogan was Wang Jingwei's appeal to the southwestern warlords to restore the economy, but for Guizhou its connotation seemed uninteresting and even threatening. Wang Jingwei had his eye on Guizhou, where the sky is not clear for three days and the land is not flat for three miles, so he used it exclusively to exile \"Chiang Kai-shek's loyalist remnants\". Nanjing would not devote any resources to this place, but only sought for these political outcasts to perish in the treacherous quagmire as soon as possible.\n\nHe Yingqin returned to his hometown in 1948 with his head down, having spent his life as a soldier fishing for the moon at the bottom of a well. At the age of 60, he wanted to bring something to the people, but after tasting failure many times, he simply let them be. But the examiners from Nanjing were picking and fussing, and such dismissive sidelining make He Yingqin's temper more and more perverse and withdrawn. He couldn't listen to anyone, and at every turn, he slammed glasses and cursed; he refused to let go of anything, whether it was chopsticks for eating or any form of power. He was like a defeated old dog snarling to protect what was left of his territory, and the \"New Deal\" just a stumbling block to his rule. Meanwhile, the situation in Guizhou continues to deteriorate under his uncompromising \"protection\"."
 TER_SW_new_decisions_desc_GUX: "When Xia Wei leaves 16 Wenming Road in Guilin on his bicycle every day, I wonder if he holds a grudge against the former owner of this official residence, Li Zongren, who absconded abroad.\n\nXia Wei knew what he wanted to do, he wanted to lead his hometown people to a better life. He also knew what he could and could not do, and often humbly consulted professionals. He sent agricultural improvement missions to the great mountains of Guangxi and encouraged private business in the cities. In order to listen to more suggestions, Xavier allowed free association within the territory and won people's support with his tolerant heart. After achieving industrial and agricultural growth, the economic expert unearthed tourism and made Japanese tourists give generously for the beautiful scenery of Guangxi - the Japanese were annoying, but the yen could make Guangxi thrive.\n\nThere is only one issue that Xia Wei will never concede, and that is obedience to Japan. As an anti-Japanese deviant in the Co-Prosperity Circle, the jackals coveting Guangxi will only increase with each passing day. After the establishment of Guangdong, Japanese companies could not be oblivious to their hostile neighbors, and Tokyo knew this well. In the Nanking Executive Yuan, the rhetoric against Xia Wei was growing. Lu Han, cynical of Xia Wei's achievements, kept releasing rumors, the worst of which outright called Xia Wei in collusion with the communists. When will the black tide of the times engulf the small boat of Guangxi? Frankly speaking, I don't know."
 TER_SW_great_suppress_bandits: "The Great Suppression of Bandits"
 TER_SW_great_suppress_bandits_desc: "[TER_SW_great_suppress_bandits_desc]"
 TER_SW_great_suppress_bandits_desc_LOY: "The southwestern provinces were plagued by banditry after the end of the Great War, with 900,000 bandits scattered in the ravines of the southwest. The provincial heads tried to integrate these rebellious people into their armies, but after emptying their coffers and failing to renew their votes, the crowds scattered back to the hills with their learned military skills to wreak havoc.\n\nLu Han would not give the bandits any good looks, especially after wasting Yunnan's money. As he did with the rebellious peasants, Lu Han sent his own troops into the Mourning Mountains to force out and capture the roaming bandits by cutting off their food. The heads of the bandit leaders were cut off and carried on flag poles to intimidate bandits elsewhere. The plowing of the mountains worked quickly, and the Yunnan army easily defeated bandits numbering up to 100,000, but Lu Han never understood why bandits always came after the plowing."
 TER_SW_great_suppress_bandits_desc_GUZ: "The southwestern provinces were plagued by banditry after the end of the Great War, with 900,000 bandits scattered in the ravines of the southwest. The provincial heads tried to integrate these rebellious people into their armies, but after emptying their coffers and failing to renew their votes, the crowds scattered back to the hills with their learned military skills to wreak havoc.\n\nThe bandits in Guizhou were the most vocal, occupying large areas outside the provincial capital and controlling familiar towns: Zunyi, Liupanshui, Bijie...They controlled taxes, blocked roads, and could even surround the caravans of blackmailing governors. He Yingqin had personally taken command and declared war on the bandits, but now began to try to co-exist with them. He gave formal official positions to the most powerful bandit leaders and entrusted them to control small groups of bandits. As long as they paid He Yingqin on time, the bandits were free to run the hills they were entrenched in. The banditry in Guizhou was thus muddled between solved and unresolved."
 TER_SW_great_suppress_bandits_desc_GUX: "The southwestern provinces were plagued by banditry after the end of the Great War, with 900,000 bandits scattered in the ravines of the southwest. The heads of the provinces wanted to integrate these rebellious people into the army, but after emptying their coffers and failing to renew their votes, the crowds scattered back to the mountains with their learned military skills to wreak havoc on one side.\n\nIn the face of banditry, Xia Wei attached more importance to grassroots mobilization, and the autonomy of Guangxi villages was high. As long as the land reform was used to bring in the peasants to form self-defense armies, they could enter to attack and retreat to defend, cutting off all the resources needed for bandits. Guilin's conscription office recruited a total of 180,000 local militia, and these peasants, with hoes in one hand and muskets in the other, cooperated with Guangxi's army to beat the bandits to the ground. And only by fighting and promoting pacification could the bandits be given suitable positions in the society, and eventually the old and cunning bandits were made to settle down and become legal citizens."
