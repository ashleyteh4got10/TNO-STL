 LOY_Long_Zehui_for: "Long Zehui"
 LOY_Long_Zehui_for_desc: "Foreign Minister\nAbsolutism\n------------\n§LLong Zehui is a veteran in the fight against the Japanese. He participated in the Battle of Tai'erzhuang and the war against Japan, watched the Japanese Empire ravage his hometown and witnessed countless comrades fall under the iron heel of the Japanese army. After the two sides negotiated peace and the war ended, Long Zehui breathed a sigh of relief - which only made him feel that he was surely committing treason. Yet he shook hands and cooperated with the Japanese, and the feeling of treason gradually faded, until he no longer had any concerns.\n\nRight now, Long Zehui is on the border, holding a sinecure, and fleeing responsibility during the cutthroat reorganization of the KMT government. More importantly, by staying here, he can stay far away from the Japanese officials who would force him to remember and reflect.\nPerhaps, in this place, Long Zehui can enjoy the tranquility that the past two decades have failed to grant him.§!"
