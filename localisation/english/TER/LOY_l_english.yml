 TER_SW_new_decisions_title_SIC: "The New Deal - Unify Sichuan and Chongqing"
 TER_SW_new_decisions_desc_SIC: "In the spring of 1946, famine struck Sichuan again. When meeting with provincial chairman Wang Zansu, Li Zongren said that Sichuanese would soon be able to eat American rice and white flour.\n\nIn 1947, Sichuan representative Wang Lingji's request to Japan for Sichuan troops to enter Chongqing and unify Sichuan was rejected.\n\nIn 1953, in his New Deal for Southwest China, Wang Ching-wei assured people living in Sichuan for generations that he would support the unification of Sichuan and the autonomy of the Sichuanese, and that he would compensate Chiang Kai-shek for the catastrophe he had brought to Sichuan through preferential policies.\n\nIn 1957, Deng Xihou, the Chairman of Sichuan Province, sent an open letter to the Nanjing authorities when he was critically ill, accusing the State Government of utilizing Zhang Qun to suppress the local government, and demanding that all Kuomintang institutions in Chongqing be removed, or else the \"unification of Sichuan and Chongqing\" would be an empty talk.\n\nIn 1962, the \"unity of Sichuan and Chongqing\" was still a political ideal."
 CPC_riot_in_Sichuan: "Mess in Chengdu"
 CPC_riot_in_Sichuan_desc: "Upon hearing the news that the Nationalists had given up resistance and that the Japanese were about to enter Sichuan, the citizens of Chengdu became enraged and took to the streets.\n\nHu Lian, the garrison commander, commanded his troops to blockade the streets, but the citizens lost all confidence in the KMT and began to besiege the military authorities, and the national army decisively chose to open fire to quell the rebellion. With Chen Cheng dead, Xue Yue as Commander-in-Chief incapable of controlling the Central Army, and Hu Lian lost in the chaos, the leaderless soldiers turned the riot into a burning of the city, and the fires burned for seven days, leaving Chengdu in ruins once again, just as it had been throughout history. However, the Japanese army did not stop the action, according to the established policy to drive into Chongqing, picking up the banner of \"maintaining order\".\n\nA series of tragedies gave the people of Sichuan a consensus: Chiang's regime must go, and Sichuan must be autonomous."