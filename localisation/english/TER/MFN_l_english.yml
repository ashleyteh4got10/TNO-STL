 MFN_Wu_Lanfu: "Wu Lanfu"
 MFN_Wu_Lanfu_desc: "Wu Lanfu, or 'Ulanhu,' is Mongolian through and through, but he has always been a devoted follower of the CPC. As a teenager, his studies were funded by several early Party figures, and the openness and goodwill of the Han Chinese earned Wu's trust. As the Japanese began their invasion of Inner Mongolia, he was assigned by the Party Committee to carry out activities in western Mongolia; at one point this lead to a revolutionary riot dealing a severe blow to the Japanese forces. Now that China is lost, the forces of CPC resistance have been stretched to their limit, and only Wu Lanfu is left – struggling bitterly to maintain his base in the Yin Mountains for more than a decade."