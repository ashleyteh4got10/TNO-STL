 SEA_a_PERFECT_hainan: "Local Means for Official Ends"
 SEA_a_PERFECT_hainan_desc: "General Tang Shengming's plan on Hainan is a unique one: One of local elites, aquaculture and tourism.\n\nThe Guidelines on Industry and Welfare of Hainan has clearly decreed that the profits from local aquaculture and tourism may deduct local taxation. Should the tax quota be fulfilled, further profits are then left out for local purposes. The financial devolution quickly draw attention from enthusiasted gentrys, leading to a quick recover of local economy and continued financial surplus, gaining General Tang reputation within the Nanjing Government."