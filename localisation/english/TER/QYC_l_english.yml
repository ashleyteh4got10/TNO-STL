 QYC_Feng_Baiju: "Feng Baiju"
 QYC_Feng_Baiju_desc: "The issue of Hainan is as complex and dramatic as its four-color flag: the Min, Li, Miao, and foreigners have staged countless farces over this South China Sea gem - and it should be said that Feng Baiju was intertwined with such farces, making his life equally complex and dramatic.\n\nOn the one hand, he lit the smoke of resistance in Hainan at the most searing moment of the Sino-Japanese war, leading an entire Qiongya column to write an epic of resistance with blood and bullets in Hainan; and on the other hand, when victory was almost impossible, he and his Qiongya column suddenly disappeared from the mountains and jungles of Hainan - and Hainan was thus smoothly and strangely The Japanese conquest was accepted.\n\nThe Japanese, who were so proud of themselves in Hainan, did not let the bandits go easily, so they posted a wanted notice, promising a number of oceans in exchange for Feng Baikui's head, and even ordered Li Ming Shuang, president of the Imperial Hainan Maintenance Association, to form a militia of three light villages.\n\nLi Ming Shuang naturally have to nod their heads and waist full of mouth \"ha ee\" to send away the governor of the South China Sea, Genda Minoru, and every time the Japanese leave the residence, his face will show a playful smile.\n\nYes, the Great Japanese Empire Hainan Maintenance Association, its other identity is the Chinese Communist Party Hainan Branch, and the President of the Maintenance Association Li Ming Shuang, that is, the branch secretary Feng Baikui.\n\nThis disguise was originally an extremely reckless venture, and almost all those in the know believed that Feng Baikui's move was bound to fail within three to five years, but the general recession in East Asia in the 1950s forced the entire co-prosperity sphere to a standstill - apparently there were few areas in the South China Sea more important than Hainan, and Japanese control and surveillance of Hainan has been relaxed ever since. The \"Li Ming Shuang\" and his \"Maintenance Association\" thus spent a period of peace and tranquility, even slightly comical.\n\nFeng Baikui knew that the play could not go on forever, and he and the Hainan branch had a lot of work to do ......"
 QYC_Henshin_tt: "§YHainan§! is §mno longer in disguise...§!"
