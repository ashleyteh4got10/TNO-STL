 SEA_a_PERFECT_pretender: "Hainan's Double Act"
 SEA_a_PERFECT_pretender_desc: "Roll up the red flag, hide the sickle, and remove the red star.\n\nTo survive under the nose of the enemy, Hainan launched a top-secret intelligence disguise. Now, the Hainan branch of the Chinese Communist Party has a more familiar name in the South China Sea region - \"Imperial Hainan Maintenance Association.\"\nThe organization replicated the Japanese overseas colonial government in its entirety, with each base cadre having a corresponding title; regularly reporting to the \"superior\" Southeast Asia governor, Minoru Genda, to say that \"all is well\"; building Japanese towns and training professional actors to deal with The \"local\" inspection teams and travelers.\n\nWe are serious about acting."
 QYC_paternalism_party: "IHMA"
 QYC_paternalism_party_long: "Imperial Hainan Maintenance Association"
 QYC_Tang_Shengming: "Tang Shengming"
 QYC_Tang_Shengming_desc: "Born into a wealthy and influential family in Hunan, Tang Shengming navigated the tides of power with remarkable finesse. Like Zhang Xueliang, he held the seed capital of the nation in his hands, waiting for the right moment to make a decisive investment in a promising future.\n\nHe had little regard for his own brother leading the Xiang faction, and thus contributed nothing to his cause. During the Northern Expedition, Tang lent troops and arms to Chiang Kai-shek and even assigned his personal guard unit to Dai Li to establish the Military Intelligence Bureau. As a result, after the Central Plains War, Tang never lacked money, indulging in extravagant pleasures along the Qinhuai River. This connection later led Chiang Kai-shek to assign him the task of infiltrating Wang Jingwei's regime during the war, waiting for the opportune moment to act.\n\nWith his beautiful wife in tow, Tang settled in Shanghai, where he easily integrated into the new elite simply through drinking, dining, and entertainment. Beneath the dazzling crystal chandeliers, they played cards and spoke in grandiose terms. When asked why he had joined Wang Jingwei, Tang replied with self-assured candor:\n\n\"I can't stand living in Chongqing. I just like Shanghai.\"\n\n§RBut then, Chongqing lost the war.§! His superiors vanished, the tides turned, and the undercover mission became a permanent reality.\n\nNow a prominent figure in Wang Jingwei’s government, Tang found old associates from Chongqing now seeking to curry favor with him. Luxury cars rolled in one after another, yet his true aspirations had already crumbled. Like any bureaucrat trying in vain to escape his fate, Tang petitioned Wang Jingwei for reassignment, hoping to be stationed anywhere but Nanjing, where he could retreat into the idle comforts of a foreign-style villa—a dream befitting his lifetime of indulgence.\n\n§RCommunist agent Pan Hannian§! saw an opportunity to help Tang out of his predicament and subtly probed him about resuming underground work. Tang, puffing on a thick Luzon cigar, blew a dry cloud of smoke into Pan’s face and scoffed:\n\n\"You say I sympathize with the Communists. It feels more like charity... You’re a man of great ambition, and I respect that, but we’re not the same kind of people.\"\n\nFaced with Tang’s curt refusal, Pan Hannian said no more. He calmly adjusted his brown hat, exuding an air of quiet confidence:\n\n§R\"We will work together, no doubt about it. You’ll hear from us within a month.\"§!\n\nFive days later, Zhou Fohai fulfilled Pan Hannian’s prophecy. Tang’s extensive connections—especially his deep ties with the Japanese Navy—caught Zhou’s attention, making him eager to win over this self-exiled intelligence officer. Summoning Tang in secret, Zhou entrusted him with a crucial mission: to retrieve the burning chestnuts from the fire and reclaim Hainan.\n\nWhen Tang arrived at the island paradise at the edge of the world, precisely one month had passed since Pan’s prediction. There, §Rcertain individuals§!, acting under Pan Hannian’s directives, approached Tang with an offer of cooperation: they would govern Hainan in his name, while he would continue playing the role of the island’s hero. Their spheres would remain separate, avoiding mutual interference.\n\nDefending the island from Japanese control brought Tang both fame and fortune, but what shocked him most was the sheer reach of the Communists’ influence. He accepted the arrangement—and in doing so, transformed. No longer did he complain about coarse food, berate his subordinates for their rough manners, or assume the airs of an entitled ruler.\n\nLaozi once said: \"I do nothing, yet the people enrich themselves. I remain still, yet the people transform themselves.\"\n\nThrough this hands-off collaboration, Chairman Tang Shengming’s southern jewel was poised for a grand future."
