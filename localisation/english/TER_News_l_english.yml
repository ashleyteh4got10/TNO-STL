l_english:
 WORLD_TER.1.t: "[Get_newspaper_header]End of the Mongolian Civil War"
 WORLD_TER.1.desc: "The head of the Mongolian People's Republic, Yumuga Zedenbal, has set a date to send an emissary to negotiate the terms of a ceasefire with the Mongolian leader, Prince Demchugdongrub, marking the end of the gunfire on the Asian steppe. The victorious citizens of Ulaanbaatar are taking to the streets to celebrate Mongolia's freedom and liberation.\n\nInstead of showing a solid repressive stance in the face of its revolutionaries, Puppet Mongolian lost its control over the north, acting as an unexpected ally of Japan."
 WORLD_TER.1.a: "A new East Asian landscape."
 WORLD_TER.2.t: "[Get_newspaper_header]Chinese democracy activist Wen Yiduo was killed"
 WORLD_TER.2.desc: "In an isolated alley with few pedestrians, a resident found the body of democracy activist Wen Yiduo in a pool of blood and reported it to the local police. The deceased had fiercely criticized Gao Zongwu in public during his lifetime for bringing about the great fall of sovereignty in China.\n\nSomeone forensically identified the body as having been shot in the back and once in the head, with bullets coming from two different directions and the murder weapon being a Browning pistol. What ultimately killed the victim was the gunshot wound to the head, which someone fired only after being placed against the back of the head.\n\nThe world was shocked by the brutality of the Kunming bloodbath, and Nanjing tasked the C.T.B. to arrive in Yunnan to investigate to solve the case as soon as possible."
 WORLD_TER.2.a: "What an atrocity."
 WORLD_TER.3.t: "[Get_newspaper_header]Gao Zongwu Arrived at Yokohama Port"
 WORLD_TER.3.desc: "In an atmosphere of deteriorating economic conditions, President Gao Zongwu of the Republic of China put aside the turbulent situation in the west and personally flew to Japan to discuss opening the country's business. This was the first time a Chinese leader had set foot on Japanese soil in twenty years.\n\nAt the airport, Gao Zongwu delivered a speech on the long-lasting friendship between the two countries and very modestly told Japanese Foreign Minister Ohhira Masayoshi that the purpose of his visit was to \"learn from the advanced things in Japan,\" hoping to bring the developed scroll back to China and her people."
 WORLD_TER.3.a: "Good luck!"
 WORLD_TER.4.t: "[Get_newspaper_header]China-Japan Reorientation Cooperation Relationship"
 WORLD_TER.4.desc: "After a series of intensive negotiations, China and Japan reached a bilateral tariff concession arrangement and signed a series of cooperation agreements. With the New Pact for Economic and Trade Cooperation as the core, China will hand over tariff rights to Japan for the port cities of Tianjin, Shanghai, and Xiamen in exchange for Japanese companies relocating inland to the mainland and receiving technical and financial support.\n\nJapanese representative Masayoshi Ohira said that China needs to create a more stable environment in order to take up its obligations for the development of the Co-Prosperity Sphere."
 WORLD_TER.4.a: "A fair contract, but an unfair deal."
 WORLD_TER.5.t: "[Get_newspaper_header]Chunru Lee suicided"
 WORLD_TER.5.desc: "This morning, the body of young Hong Kong journalist Chunru Lee was found by a neighbor in her apartment, with a half-eaten bottle of sleeping pills on her desk and a suicide note, the contents of which were sealed by Guangdong police and not made public.\n\nChunru Lee had been arrested by the authorities after working as an independent journalist investigating vicious murders in various parts of Guangdong during the occupation.\n\nSince the outbreak of the financial crisis, the Chinese in Guangdong have rekindled their hope for a better life. Chunru Lee volunteered as a civic opinion leader and campaigned for better treatment of the Chinese, but ROC and Japan Government ignored their demands. As a result, many have speculated that Li's suicide was motivated by heavy public trust and extreme spiritual devastation."
 WORLD_TER.5.a: "Next time, don't born in Honkon."
 WORLD_TER.6.t: "[Get_newspaper_header]Great Armed Conflict Breaks Out in Southwest China"
 WORLD_TER.6.desc: "A large-scale armed conflict broke out in southern Guangxi between local Guangxi troops and Japanese marines. Gao Zongwu hoped that Guangxi would immediately cease resistance and accept the leadership of the central government.\n\nJapan had sent additional naval fleet to support the war in Guangxi, claiming that the counter-insurgency was steadily progressing and the war would be quelled in a few days.\n\nMeanwhile, He Yingqin issued a statement of resistance against Yunnan to the whole country, which pointed out that Lu Han was mobilizing troops to invade Guizhou and condemned Lu Han for destroying the peaceful situation, but Nanjing did not respond.\n\nThere were also reports that Sichuan troops had crossed the Sichuan-Kangzhou border, and that before the war was launched, provincial chairman Huang Yin had issued a public statement hoping that Nanking would guarantee Sichuan's internal independence while maintaining economic cooperation, to which Nanking did not give a clear response.\n\nInternational commentators generally believe that this chaotic war in southwest China will be the worst disruption caused in East Asia since the Yasuda financial crisis, and that its final outcome still needs to be further assessed."
 WORLD_TER.6.a: "Ambitious guys."
 WORLD_TER.7.t: "[Get_newspaper_header]Large-scale protest break out in northern China"
 WORLD_TER.7.desc: "Since the Japanese invasion of Guangxi, demonstrations against the Kuomintang began in Beiping, Tianjin, Jinan, Qingdao, Tangshan and other cities.\n\nCitizens openly mourned the death of Hong Kong journalist Li Chunru, protested against the cooperation agreement between the Nanking government and the Japanese, raised popular demands such as \"Gao Zongwu stepping down\" and \"refusing to sign\", and publicly resolved to break away from the Nanking government.\n\nIn the face of the raging public sentiment in the north, the Nanjing government claimed that this was a rebellion instigated by a few traitors and reactionaries."
 WORLD_TER.7.a: "Let's see how long they can last."
 WORLD_TER.8.t: "[Get_newspaper_header]Beijing incident escalates conflict"
 WORLD_TER.8.desc: "The Kuomintang's rule in Beijing had come to an end, and the citizens had taken over the local government and persuaded the military in the area to join in the independence struggle.\n\nThe citizens were divided over whether to accept Gao Zongwu's negotiations, but Tangshan sent a message to Beijing that the KMT government in Hebei had announced severe punishments for all demonstrators, and that a large number of citizens had been beaten and imprisoned in plain clothes and then not heard from at all. This led to the majority support of radicals in the Citizens' Guild who were firmly opposed to negotiations, and a young teacher named Shourok became the leader of the protest movement, calling on the protesters to prepare for civil war and force Gao Zongwu to recognize North China's autonomy.\n\nNanking deeply regretted the fact that the negotiations were not accepted and blocked all news from Beijing."
 WORLD_TER.8.a: "I can't seem to find anything about the government's secret police in the news - can you?"
 WORLD_TER.9.t: "[Get_newspaper_header]Manchukuo Announces Beijing Intervention"
 WORLD_TER.9.desc: "A Japanese diplomatic spokesman said that the growing riots in Beijing, Tianjin, and Tang had become a threat to the stability of the Co-Prosperity Sphere, and after obtaining permission from the Nanjing government, the Manchukuo Concordia Association, together with the Kwantung Army, issued a declaration to suppress the riots.\n\nDue to the strict blockade by Nanjing, it is impossible to know the reaction of the citizens of Beijing, Tianjin, and Tang to the incident, or the civilian casualties in Beijing, Tianjin, and Tangshan."
 WORLD_TER.9.a: "Definitely not Puyi's decision."
 WORLD_TER.10.t: "[Get_newspaper_header]Japanese declare control of all of Guangxi"
 WORLD_TER.10.desc: "The war in Guangxi, which was noticed by the Co-Prosperity earlier, has subsided, and the 130th Division of the Expeditionary Army led by Hisakuniya has completely controlled the whole territory of Guangxi, and the prince himself has returned to Japan as a war hero and is preparing to attend the ceremony of awarding medals presided over by Emperor Hirohito.\n\nThe National Government had already planned to start reorganizing the government of Guangxi, and there was news that Prince Koyoomiya was willing to serve as the local governor of Guangxi, but the Japanese side responded that there was no such proposal."
 WORLD_TER.10.a: "After all, there is already Guangdong."
 WORLD_TER.11.t: "[Get_newspaper_header]Guangxi province chairmanship candidates out"
 WORLD_TER.11.desc: "After half a month of intense consultation, the candidate for the new Guangxi provincial chairman finally revealed his eyebrows, and General Duan Xiwen, who was born in Yunnan, would accept the appointment of the Nanking government and be sworn in at Guilin, Guangxi."
 WORLD_TER.11.a: "This is what Gao Zongwu gave Lu Han."
 WORLD_TER.12.t: "[Get_newspaper_header]Xia Wei Hosts Southwest Economic Summit"
 WORLD_TER.12.desc: "In order to address the negative impacts of the financial crisis, the Southwest China Economic Conference was organized in Liuzhou, led by Guangxi Province Chairman Xia Wei. Yunnan Province Chairman Lu Han, Sichuan Province Chairman Huang Yin and Guizhou Province Chairman He Yingqin were invited to attend the meeting, and each of the four parties started mutual aid negotiations on the provincial economies. Xia Wei was optimistic about the prospects for cooperation among the four southwestern provinces, but externally he re-emphasized that the economic predicament in the southwest did not require the intervention of Japanese companies."
 WORLD_TER.12.a: "Good Luck"
 WORLD_TER.13.t: "[Get_newspaper_header]The Southwest Summit was abruptly suspended!"
 WORLD_TER.13.desc: "After Gao Zongwu's special envoy arrived in Kunming, widespread speculation arose that Nanjing had used a gold yuan offensive to persuade Lu Han to abandon his allies and withdraw from the coalition. Alongside Lu Han, Huang Yin of Sichuan also agreed to exit, with both boarding separate flights back home on the same day. Meanwhile, He Yingqin had already returned to Guiyang due to internal political turmoil in Guizhou.\n\nGao Zongwu praised Lu Han for his role in \"preserving national unity\", while condemning Xia Wei for \"disrupting the stability and prosperity of the nation\", demanding that he abandon his illusions immediately. Xia Wei, in turn, reacted furiously to Gao’s accusations, declaring that Gao must pay the price for undermining the economic development of the Southwest. As a result, relations between Guangxi and Nanjing plummeted to an all-time low.\n\nAmid rising tensions, radical officers from Guangxi launched a surprise attack on a Japanese military base in Qinzhou. In response to Guangxi’s armed provocation, Gao Zongwu publicly declared a counterinsurgency operation, triggering an even greater shockwave throughout the Co-Prosperity Sphere."
 WORLD_TER.13.a: "Let's see who is patriot."
 WORLD_TER.15.t: "[Get_newspaper_header]Japanese Special Envoy Visits Lhasa"
 WORLD_TER.15.desc: "The Japanese monastic mission from Nishi Honganji Temple, which entered the Dawang region via Free India in the name of religious exchange, arrived in Lhasa yesterday. The Tibetan Buddhist community held a grand ceremony for this purpose and offered delicious hot tea to the Japanese monks.\n\nDuring the talks between the two sides, the Japanese side repeatedly mentioned the Japan-Tibet friendship founded by the hands of the living Buddha Anchin in the thirties and hoped that Japan could develop closer cooperation with Tibet. Tibetan leader Tenzin Gyatso expressed partial agreement that Tibet and Japan should continue to maintain peaceful and friendly relations.\n\nThere is widespread confusion in the outside world over the fact that Tibet has shown a move away from a neutral posture and has begun to adopt diplomacy with a bias."
 WORLD_TER.15.a: "Part ways"
 WORLD_TER.16.t: "[Get_newspaper_header]War on the plateau"
 WORLD_TER.16.desc: "In a surprise attack that caught Xikang off guard, the Tibetan army launched an attack on the Kangba region controlled by ex-KMT general Liu Wenhui.\n\nIn Kashgar's declaration of war, the head of government and religious leader Tenzin Gyatso described the conflict on the East Asian plateau as a war to recover the homeland and defend it, declaring, \"Neither China nor any other country can get its hands on Tibetan land.\"\n\nThe Republic of China has made no comment on the conflict and has remained silent on any talk of the war situation."
 WORLD_TER.16.a: "Japan was able to persuade the Buddha to kill."
 WORLD_TER.17.t: "[Get_newspaper_header]Tenzin Gyatso visit to Kolkata"
 WORLD_TER.17.desc: "Having just won the civil war, Tibetan leader Tenzin Gyatso personally led a mission to Calcutta to thank free India for its help in the war, making new diplomatic commitments to free Indian leader Chandra Bose, including unconditional support for free India's international status and hostility to Nehru on many fronts.\n\nSince Tenzin Gyatso's visit, his fellow religious leader, Dorje Khyentse, has expressed his opposition to recent developments in Tibet, arguing that Tibet should adopt a strategy of absolute neutrality in international relations and directly claiming that the Dalai has \"turned himself into a sacrifice for foreigners.”"
 WORLD_TER.17.a: "All \"sacrifices\" are relative."
 WORLD_TER.18.t: "[Get_newspaper_header]Tibet officially takes back the Dawang-Linzhi region"
 WORLD_TER.18.desc: "The Tibetan army had completely taken over the Dawang-Linzhi region, declaring that free India and Tibet had properly settled the legacy of British imperialism, another victory for Tenzin Gyatso's diplomatic tour. This sparked strong protests from Indian Prime Minister Nehru, who felt that the bridge of communication within India was being disregarded by military strongman Bose, and criticized Tenzin Gyatso's reckless move to disrupt the situation in South Asia without permission.\n\nIn the face of diplomatic criticism, Tibet set about restructuring its borders to consolidate its new territory, sending more troops to the border to prevent possible future military clashes. Meanwhile, reports of armed attacks at Indian border posts are increasing."
 WORLD_TER.18.a: "The Dalai apparently wants more."
 WORLD_TER.19.t: "[Get_newspaper_header]India-Tibet border conflict"
 WORLD_TER.19.desc: "On the western section of the border between Tibet and India, Indian border guards encountered physical provocation from Tibetan troops, which eventually developed into mutual shelling. Tibetan leader Tenzin Gyatso ordered Tibetan troops to enter the Ladakh region in the name of protecting the people along the border.\n\nPrime Minister Nehru of the Republic of India delivered a national address on the day of the conflict, calling for an all-India united response to the Tibetan invasion while sending more military reinforcements to the front line.\n\nDifferent voices were also heard within Tibet over the new conflict, with Banchen Chogyi Gyantsan calling on all sides to remain calm and resort to any means other than war to defuse the conflict. The Indian military believes that this is a disorienting message released by the Tibetan army after a frustrated test attack and that the Indian army will not take Choekyi Gyaltsen's comments lightly."
 WORLD_TER.19.a: "The war will not end easily."
 WORLD_TER.20.t: "[Get_newspaper_header]Tibet falls into division"
 WORLD_TER.20.desc: "Tibet is not gaining battlefield advantage in Ladakh, and the domestic economic situation is rapidly deteriorating with large numbers of refugees fleeing from across Tibet to mainland China and India. The military campaign was more exhausting than the Tibetan political hierarchy had expected, which sparked internal controversy. Choekyi Gyaltsen unilaterally announced the withdrawal of his troops and offered peace to the Republic of India, no longer supporting Tenzin Gyatso's aggression.\n\nFollowing Choekyi Gyaltsen's declaration, the Tibetan frontline army split, with some war-weary troops voluntarily disengaging from the battle and retreating to the rear. The Indian army took advantage of the situation and recovered the areas where the Tibetan army had advanced, maintaining the occupation line as it was before the conflict, and peace was restored in South Asia. Indian Prime Minister Nehru declared victory in the defensive war but did not comment on Tibet's unilateral truce.\n\nFaced with internal changes, Tenzin Gyatso held the Panchen primarily responsible for the defeat, and he banned Choekyi Gyaltsen from leaving Rikaze and outlawed his right to participate in politics and pilgrimage. This triggered Choekyi Gyaltsen's discontent and publicly led Rizkam to secede from the Lhasa regime."
 WORLD_TER.20.a: "Who will be the Savior of Tibet?"
 WORLD_TER.21.t: "[Get_newspaper_header] Chinese Civil War"
 WORLD_TER.21.desc: "The National Defence Front (NDF) regime in western China today issued the \"Defence Front's Message to the China\", marking the declaration that the tense situation in East Asia has finally come to a head.\n\nAlmost simultaneously, the Presidential Office of the Republic of China issued a general mobilization order for counter-insurgency and national salvation, and armies are moving towards Shanxi, Henan, Hubei, and other areas.\n\nJapan has convened an emergency imperial council, and its army and navy in China has also entered a state of readiness; by the oil crisis, Germany, the United States, Italy, and other official countries are currently silent on the situation in East Asia.\n\nSporadic news of the outbreak of conflict on the front line is spreading, and it is believed that fierce battles have broken out between the advance troops of the Chinese and Communist armies at Tongguan, Sanxia, and Daxian."
 WORLD_TER.21.a: "This is a duel between two destinies."
 WORLD_TER.22.t: "[Get_newspaper_header]New China Founded"
 WORLD_TER.22.desc: "China's civil war has officially come to an end, and the National Defence Front regime, which has just won the third domestic revolutionary war, held a grand rally in the ancient city of [CPC.Capital.GetName] today to celebrate the official establishment of the new [CPC.GetName].\n\nIn contrast to the enthusiastic atmosphere in [CPC.Capital.GetName], the world is still mired in the oil crisis, and few responded to the establishment of the new Chinese regime; some international observers pointed out that the third internal revolutionary war is only a part of the \"War of Liberation in East Asia\" as officially called by the ANRL, and that before the legacy of colonialism is completely eliminated, it will not be possible for the new Chinese regime to be established in the future. Some international observers pointed out that the Third Domestic Revolutionary War was only a part of what the ANRL officially called the \"War of Liberation of East Asia\", and that the ANRL would not rest until the legacy of colonialism was completely removed.\n\nAn emergency Imperial Council was reconvened in Tokyo, the contents of which were not disclosed, but there were reports that the Kwantung Army and Manchurian National Army had already built fortifications on their respective fronts, and that large quantities of strategic materials had been sent to the vicinity of Guangdong and the Beiping and Tianjin Ceasefire Line respectively."
 WORLD_TER.22.a: "I bet it's not over yet."
 WORLD_TER.23.t: "[Get_newspaper_header]Outbreak of the Third Sino-Japanese War"
 WORLD_TER.23.desc: "Armed conflict between the Chinese and Japanese armies on the front line in the Beiping and Tianjin area erupted this morning, three hours after the conflict broke out, the Japanese Cabinet, in conjunction with the War Ministry and the Ministry of Foreign Affairs, held an emergency press conference in which the Prime Minister of Japan [JAP.GetLeader] said, \"Regrettably, it seems that at present Japan's endeavors to strive for peace and co-prosperity in East Asia have been ruthlessly destroyed by the Communists and that China and Japan have entered a state of full-scale war, and we will do our utmost to defend the safety of our friends in Guangman, and the idea of pan-Asian co-prosperity cannot be trampled upon.\"\n\nFive hours after the outbreak of the conflict, the [CPC.GetName] Central Government and the Central Military Commission of the CPC broadcasted to the nation the \"Declaration on Continuing the Great Cause of the War of Resistance against Japan\", which attacked in strong terms the deep suffering caused by Japanese colonialism to East Asia and vowed to \"drive the Japanese imperialists out of the continent once and for all\"."
 WORLD_TER.23.a: "Is it the finale to the great war of forty years ago?"
 WORLD_TER.24.t: "[Get_newspaper_header]End of East Asian Liberation War"
 WORLD_TER.24.desc: "News of peace came from East Asia, where [CPC.GetName] and Japan each sent senior military representatives to sign a cease-fire agreement on the Yalu Riverfront, the contents of which were not officially disclosed by the two countries, but both sides have now ceased all hostilities. Based on the previous course of the war, China has essentially achieved complete control over the continental region of East Asia, and Japan has acquiesced in the destruction of its continental power.\n\nMost observers believe that Japan has become the first loser of the global Cold War and that in the future, a regional Cold War will be waged between the ANRL and the Co-Prosperity Sphere around areas such as the Kuril Islands, North Korea, and Taiwan, in a struggle for sovereignty over the relevant sea areas.\n\nIn spite of the clouds of the Cold War between China and Japan, an enthusiastic atmosphere of celebration swept across China and the rest of the world, with official and unofficial mass celebrations in Xi'an, Nanjing, and Wuhan, as well as left-wing civil society organizations around the world taking to the streets to celebrate the \"Success of the Anti-fascist Cause in East Asia\"."
 WORLD_TER.24.a: "Let's congratulate the winner."
 WORLD_TER.25.t: "[Get_newspaper_header]East Asian chaos \"calmed down\""
 WORLD_TER.25.desc: "The world was shocked by the news from Japan that Emperor Hirohito had signed an order allowing Japan to use any weapons without restriction on the battlefields of China, which were still in a state of war.\n\nAccording to reliable sources, some 350 nuclear warheads and more than 1,000 liters of chemical and biological weapons were dropped on northwest China on the same day the order was signed. The Japanese government has remained completely silent on the consequences of this order, and some observers have pointed out that in order to ensure that there are no consequences, Japan's bombing of the Northwest China region and the dropping of chemical and biological weapons is likely to become a regular practice, just as the German Luftwaffe's unrestricted bombing of the regions of West Africa and Russia during the Hitler era.\n\nEnvironmental experts estimate that Northwest China has become a de facto no man's land due to the combined effects of chemical and biological weapons and nuclear radiation and that other neighboring regions, including Central Asia and Mongolia, will face the threat of secondary disasters for a very long time to come. The United States announced that it would urgently convene a summit of the Security Council of the United States of America on \"Response to Japan's Atrocities in East Asia\" in OFN; Germany announced that it would deploy ballistic missiles in the Indian Ocean as soon as possible. The world situation is once again tense because of the destruction of northwest China."
 WORLD_TER.25.a: "Sooner or later, we're all going to hell."
 WORLD_TER.26.t: "[Get_newspaper_header]East Asian chaos calmed down"
 WORLD_TER.26.desc: "The Third Sino-Japanese War ended with the complete destruction of the Chinese resistance as the Japanese troops drove their army into the strategic areas controlled by the Communist regime such as Xi'an and Chungking.\n\nAccording to the follow-up plan revealed by the Japanese military, the former China region would be divided into several military and administrative regions \"to better serve the pan-Asian ideals and the well-being of the people of East Asia\", and a large number of Japanese army and navy generals, who had performed well in the war, were promoted to the heads of the military and administrative regions.\n\nWhile the other superpowers were not convinced of the endgame of the East Asian affair, they all coincidentally accelerated the process of deploying ballistic missiles on the front lines of geopolitical conflicts, and the world situation was once again tense because of the destruction of the Chinese resistance."
 WORLD_TER.26.a: "The central state is in pieces."
 WORLD_TER.27.t: "[Get_newspaper_header]Massive protests erupt in eastern China"
 WORLD_TER.27.desc: "Recently, sporadic protests have erupted in Beijing and Wuhan, where participants have expressed their dissatisfaction with the National Government's \"permanent discipline\" and \"oppressive reign of terror\" and have begun to organise marches.\n\nThe protests were also reportedly accompanied by commemorations of democracy activists who had died in China since the 1960s: portraits of people such as Wen Yiduo, Chu Anping, Yu Luoke, Li Chunru, and Xia Wei began to appear frequently in the marches.\n\nThe ROC government is still exercising restraint and appealing to the protests, but it cannot be ruled out that their iron horsemen will still drive into the streets filled with dissidents - as they did seven years ago in Guangxi and Beijing."
 WORLD_TER.27.a: "This is a re-enactment of the 1963 crisis."
 WORLD_TER.28.t: "[Get_newspaper_header]The National Convention of the Republic of China is held in Shanghai."
 WORLD_TER.28.desc: "The growing pro-democracy uprising in eastern China recently culminated in the gathering of representatives of pro-democracy activists in Shanghai for the \"National Convention of the Republic of China\".\n\nIt is reported that the Congress reached a series of consensus on proclaiming the establishment of the China Freedom Front, an alliance of self-governing cities; opposing the white terror of the ROC government; opposing Japanese colonialism and hegemonic aggression; supporting the Chinese people's struggle in their quest for democracy and freedom; and maintaining friendship with other democratic revolutionary forces.\n\nMost international observers believe that the \"other democratic revolutionary forces\" mentioned in the consensus of the National Day Congress may be the Communist regime in the West and the Asia National Revolutionary League(ANRL). Some observers have speculated that the Communist Party and ANRL are most likely secretly supporting and assisting the democratic forces in the east and have given some form of guarantee of independence."
 WORLD_TER.28.a: "The Dawn of the Chinese Revolution."
 WORLD_TER.29.t: "[Get_newspaper_header]Xi'an convenes National Committee of the Chinese People's Political Consultative Conference (CPPCC)"
 WORLD_TER.29.desc: "The Communist regime in western China recently held its CPPCC in Xi'an and invited a number of representatives of the democratic uprising in the east to participate in the talks.\n\nUnder the joint efforts of the CCP and the eastern democrats, the CPPCC reached a series of agreements: the eastern democratic representatives would join the ANRL advisory committee in an independent capacity; they would oppose the white terror of the ROC government; they would oppose the colonialist and hegemonic aggression of Japan; and they would support the Chinese people's struggle for democracy and freedom.\n\nMost international observations saw the convening of the CPPCC as an indication that the democratic forces in the east had chosen to accept the armed protection of the ARD. Against the backdrop of the intensifying nationalist-communist conflict, as we entered the 1970s, this choice by the Eastern democratic forces seemed to prove that the Chinese people had lost patience with the ROC government."
 WORLD_TER.29.a: "The Dawn of the Chinese Revolution."
 WORLD_TER.30.t: "[Get_newspaper_header]Anticipated Failure"
 WORLD_TER.30.desc: "The once-powerful pro-democracy uprising in eastern China ended in complete failure when the Republic of China (ROC) government issued a full-scale crackdown, with more than 70,000 people arrested in Beijing, Wuhan, and Leizhou by the time the ROC government issued its last crackdown order, and the number of arrests continues to grow.\n\nThe Communist regime in the west held rallies, publicly denouncing the \"anti-democratic and anti-peace\" atrocities of the Gao Zongwu government and calling on the people in the east to join the Communists in opposing the \"traitorous and traitorous regime\".\n\nHowever, in the face of the Communist Party's call, very few people in the east responded - since the suppression of the 1963 Beijing and Guangxi uprisings, large-scale repression and white terror have once again prevailed on the Chinese soil, and disappointment and political apathy are spreading rapidly among the people of eastern China, and the people of China are expressing their disappointment and their disillusionment with politics in a gesture that is almost self-extinguishing. expressing their disappointment and indifference to the communist regime in the west."
 WORLD_TER.30.a: "In expected."
 WORLD_TER.251.t: "End of Story"
 WORLD_TER.251.desc: "Perhaps, this is where the story ends.\n\nWe can no longer predict what the future holds for this world. After hope and passion collapse, all that remains are cold calculations and filthy intrigues.\n\nMaybe, heroes will still emerge from the wasteland.\nMaybe, the wasteland will one day give birth to a madman who will destroy the world.\nMaybe, the wasteland is just a wasteland, silently recovering at the pace of nuclear decay and the lifespan of biochemical plagues.\n\nWhatever fate befalls this land, once called the \"Great Northwest\", is no longer our concern.\n\nThe storyteller has closed their book.\nThe listeners have risen from their seats.\nMeaning ceases here. Time stands still.\n\nPerhaps, pressing ESC and leaving this absurd world is the best choice.\n\nThat way, we won’t have to lament the cold indifference of this timeline, and perhaps, the meaning we lost here can be found again—beyond this world."
 WORLD_TER.251.a: "Happy apocalypse, and I'll see you in the next save."
 WORLD_TER.31.t: "[Get_newspaper_header]Communist uprising in Northeast India"
 WORLD_TER.31.desc: "Although national unification has been achieved, recent developments in India have not followed the course many had hoped for.\n\nA militant organization calling itself the \"All-India United Liberation Front\" has launched a large-scale uprising in rural northeastern India, swiftly seizing control over the governments of multiple states.\n\nThe group’s leader, Charu Mazumdar, declared that the insurrection aims to end a century of ruthless oppression imposed by capitalist forces and local feudal elites upon the Indian people.\n\nIn response, the Indian government swiftly dismissed the incident as nothing more than another futile rebellion instigated by communists attempting to divide the nation. Officials stated that the government had already mobilized sufficient forces and that order in the northeast would soon be restored.\n\nHowever, many observers argue that the scale of the Communist uprising is a clear symptom of India’s flawed land policies, which have deepened class divisions across the nation, ultimately making such a rebellion inevitable. Regardless of the outcome, India’s future remains uncertain."
 WORLD_TER.31.a: "The South Asian giant has once again stumbled into the mire."
 WORLD_TER.32.t: "[Get_newspaper_header]Liu Wenhui Unified Sichuan"
 WORLD_TER.32.desc: "The Xikang warlord Liu Wenhui emerged as a dark horse in the Sichuan civil war, securing ultimate victory despite overwhelming odds in the early stages. With Chengdu and Chongqing now under his control, the Southwest of China has finally returned to peace since the outbreak of the Kham-Tibet War. The victor wasted no time in expelling all remaining Kuomintang institutions, and like the Guangxi warlord Xia Wei, his anti-Japanese stance is unmistakable.\n\nMeanwhile, Fujitsu Corporation has publicly released combat records from its Chongqing testing unit, along with evidence of firearms originating from the Northwestern regions. This confirms that the Xi’an authorities were key allies of Liu Wenhui, maintaining close ties with him throughout the conflict.\n\nCaught off guard by this sudden turn of events, the Chinese government has approved an emergency increase in the national defense budget. A government spokesperson declared that all hostile forces attempting to divide or betray the nation will face consequences."
 WORLD_TER.32.a1: "Welcome new friends!"
 WORLD_TER.32.a2: "The communists are truly relentless!"
 WORLD_TER.32.a3: "Warlords who take orders from the Communist Party..."
 WORLD_TER.33.t: "[Get_newspaper_header]Liu Shaoqi served as the leader of the National Defense Front"
 WORLD_TER.33.desc: "A message has emerged from China’s northwestern interior: The National Defense Front government, which remains steadfast in its resistance against Japan, has completed its leadership transition following the conclusion of the Communist Party Congress. Liu Shaoqi, the second-in-command of the Communist Party, has now begun his tenure.\n\nThe previous leader, Mao Zedong, restored order within the territories, expanded the Front’s control, and played a pivotal role as the chief strategist of the Sichuan civil war. However, Liu Shaoqi’s governance has garnered broader support due to his economic policies favoring livelihood improvements. Intelligence experts specializing in Communist affairs believe that this leadership change does not equate to a shift in power—Mao Zedong still holds ultimate veto authority, allowing the government to adjust certain policies while keeping final decisions in his hands. To maintain his leadership position, Liu Shaoqi must use his governance achievements to prove his competence to Mao Zedong.\n\nObservations so far suggest that the post-transition National Defense Front has shown no immediate signs of aggression toward the eastern regions. The Communist Party appears more focused on internal affairs, but this does not mean the Co-Prosperity Sphere can afford to relax."
 WORLD_TER.33.a1: "A Congress of Unity and Victory!"
 WORLD_TER.33.a2: "Have to prepare it."
 WORLD_TER.33.a3: "Interesting news."
 WORLD_TER.34.t: "[Get_newspaper_header]Mao Zedong continued to lead the National Defense Front"
 WORLD_TER.34.desc: "A message has emerged from China’s northwestern interior: The National Defense Front government, which remains steadfast in its resistance against Japan, has confirmed its new leader following the conclusion of the Communist Party Congress—Mao Zedong has been re-elected as the paramount leader of the Communist Party.\n\nUnder Mao Zedong’s leadership, order was restored within the territories, control was expanded, and he played a decisive role as the chief strategist of the Sichuan civil war. Through his exceptional governance and political acumen, he successfully neutralized both internal and external political opposition against him. Mao has made it clear that he will not tolerate any deviation from his established political directives.\n\nIntelligence experts specializing in Communist affairs believe that Mao places great emphasis on maintaining absolute loyalty within the Front and seeks to extend this loyalty beyond the current Communist-controlled territories.\n\nSo far, the post-transition National Defense Front has not exhibited any immediate signs of aggression toward the eastern regions. The Communist Party appears more focused on internal affairs, but this does not mean the Co-Prosperity Sphere can afford to lower its guard."
 WORLD_TER.34.a1: "A Congress of Unity and Victory!"
 WORLD_TER.34.a2: "Have to prepare it."
 WORLD_TER.34.a3: "Can't learn from it."
 WORLD_TER.35.t: "[Get_newspaper_header]Japanese cabinet falls"
 WORLD_TER.35.desc: "Today, shocking yet unsurprising news emerged from Tokyo: In response to the catastrophic defeat in the war against China and the subsequent loss of the mainland, the Japanese Prime Minister and his cabinet have announced their collective resignation.\n\nAccording to legal provisions, the Emperor will temporarily assume government leadership until a new cabinet is formed. A spokesperson from the Imperial Palace stated that the Emperor has not made any official remarks on the current crisis, only expressing his hope for national unity in the face of the Red menace. Meanwhile, a hardline governor, urgently appointed by the House of Peers, has already departed for Taiwan.\n\nAnalysts believe that following the geopolitical upheaval in East Asia, no nation is willing to mediate between Japan and the newly established states—it is now forced to face its grim fate alone. With the mainland, Japan’s postwar economic foundation, irrevocably lost, its so-called \"New Order\" has collapsed, leaving only a future of prolonged isolation and economic decline, awaiting the final harvest of this dying empire."
 WORLD_TER.35.a: "Land of the Rising Sun, Hour of the Oncoming Demon."
 WORLD_TER.36.t: "[Get_newspaper_header]East Asia chaos calmed down"
 WORLD_TER.36.desc: "Peaceful news has arrived from Nanjing: The Republic of China has officially quelled the internal unrest, and the communist regime that had entrenched itself in western China for decades has been completely annihilated.\n\nAt present, the National Government is swiftly deploying military police and administrative officials into the former communist-controlled regions, aiming for the full annexation of the Northwest, Xinjiang, and other reclaimed territories, while also integrating the industrial assets left behind by the communists. With the destruction of communist forces, the East Asia Anti-Communist Pact has fulfilled its mission—the National Government has formally announced its dissolution. This victory has greatly strengthened the government's prestige, allowing it to successfully reassert full military and political authority over the provinces.\n\nReports indicate that Japan has officially extended an invitation to the Chinese government, requesting the military and political leadership to attend a disarmament negotiation conference in Taipei. Some radical commentators argue that, with its military power at its peak after the suppression of internal unrest, the Republic of China has now gained considerable leverage at the negotiating table. As a result, this disarmament conference may not proceed as smoothly as Japan had originally anticipated."
 WORLD_TER.36.a: "Look upon the land today—whose dominion does it now belong to?"
 WORLD_TER.361.t: "Secret letter"
 WORLD_TER.361.desc: "Consulate in Taipei:\nWith the recent suppression of internal unrest and the restructuring of military and political authority across all provinces, we extend our congratulations to the consulate staff and wish you success in your duties during this time of victory.\n\nAs you are aware, Japan has formally invited the Central Government to Taiwan to discuss the withdrawal of Nationalist forces. In light of this, the following tasks are assigned to your office:\n\nIntelligence Coordination – Intelligence personnel will be arriving at your location for operational deployment. You are to ensure their full cooperation and provide any necessary assistance to facilitate their mission in Taipei.\n\nPresidential Address – You are to draft the President’s speech for the upcoming discussions. Follow standard protocol in preparing the document.\n\nCounterinsurgency Operations – It is possible that Japanese intelligence agencies will soon issue orders for the eradication of communist elements in Taiwan. You are to execute these orders with the utmost strictness.\n\nMilitary Deployment and Resource Coordination – Within the next three months, you must coordinate civilian shipping capacity and land resources. Our government has officially decided to station military forces in Taiwan for joint anti-communist defense efforts. The first wave of approximately 12,000 troops and accompanying equipment will be deployed to the island.\n\nIssued by: The Office of the President of the Republic of China"
 WORLD_TER.361.a: "A congratulatory card was attached to the letter.\nHowever, when exposed to a special light source, hidden intelligence information was revealed."