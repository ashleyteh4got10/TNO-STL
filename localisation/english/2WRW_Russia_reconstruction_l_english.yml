RUS_commie_oh_mother_russia: "Oh, Mother Russia,"
RUS_commie_union_and_strong: "United and Strong!"
RUS_commie_oh_mother_russia_desc: "She has endured too much suffering, her face etched by war and harsh winters, her children once displaced, searching for a glimmer of light in despair. From the thin ice of the Neva to the waves of the Amur, from the snowy peaks of the Caucasus to the Siberian taiga, this land has silently witnessed all sacrifices and resilience. Her people sowed seeds on ruins, sang in darkness, and with calloused hands, once again lifted her backbone. Mother Russia, she is more than just a territory…"
RUS_commie_union_and_strong_desc: "...She is the confluence of countless hearts, a steely will forged through tempering, a flame of hope rekindled at the end of despair. Former divisions have become bridges connecting one another, old wounds are now forming resilient medals. When the waters of the Volga and the Yenisei sing in unison, when the red star of the Kremlin and the lights of border outposts shine together, a united Russia is, with unstoppable momentum, returning to greatness. This greatness belongs to every son and daughter who has bled for her, sweated for her, and never given up. She is here, among our people."

