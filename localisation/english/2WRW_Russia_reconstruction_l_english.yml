 SWRW_RUS.8.t:0 "No Time to Waste"
 SWRW_RUS.8.d:0 "In the Ministry of Finance office in the capital, stacks of unusually tall financial reports caught the Minister of Economy's attention. Unlike usual, these reports, without exception, concerned local financial difficulties due to tax resistance:\nIn Nizhny Tagil, workers seized control of the arms factory, demanding an 'end to their exploitation through taxes'; in Barnaul, angry peasants used farm tools to drive away officials who came to collect grain taxes; in Magadan, merchants engaged in overseas trade formed a joint chamber of commerce, threatening the government to lower business taxes, or else they would resort to strikes and market closures.\nThough mentally prepared, these reports still threw Volpin and his team into a flurry of activity. As an economist, he was well aware of the deep-seated economic ailments of his homeland. The originally long-term, moderate reform plan was now precarious due to this crisis. But if a decisive and thorough tax reform was not carried out now, the nation's financial situation would face an unprecedented crisis.\nIndeed, he also knew that any reform would touch upon someone's interests, and voices of opposition would only increase. Thus, Volpin found himself in a dilemma: on one hand, the myriad citizens of the motherland had long suffered under burdensome tax policies, and rashly reducing their taxes might lead to the collapse of the financial system; on the other hand, the high-income groups in the country would undoubtedly try every means to resist paying taxes, and rashly increasing their taxes would certainly invite their counterattacks and retaliation...\nTime ticked by, second by second. Volpin could no longer hear the commotion in the office. His gaze fell upon the uneven and teetering scales on his desk. [RUS.GetName]'s financial system was slowing towards the abyss of collapse. He had to...\nAnd immediately, he made his final decision:"
 SWRW_RUS.8.a:0 "We should skim some fat off them."

 SWRW_RUS.9.t:0 "The Sin of Greed"
 SWRW_RUS.9.d:0 "Mr. Barannikov sat limply in the defendant's dock, his brow furrowed, a hint of unease in his eyes. The atmosphere in the courtroom was tense and solemn; the gazes of the judge and jury were all focused on him. Unlike usual, he wasn't wearing his dark suit; due to his hasty journey, he only had time to put on a shirt. He didn't look as vibrant as he usually did on television and in newspapers; his eyes were full of exhaustion.\n“Court is now in session…”\nNow, his palms were slightly sweaty from nervousness. The lawyer he had hired at great expense stood beside him, his voice firm and powerful, defending him. Barannikov listened to the lawyer's statement, feeling anxious. His Gaikin Group had supplied [RUS.GetName] with countless armaments, and of course, he had amassed immeasurable wealth. However, the implementation of the new tax policy was attempting to make him surrender his wealth, but for him, a man誰 money, this was absolutely impossible.\n“The defendant, Gaikin Group, by exploiting multiple tax loopholes…”\nHe began to seek various methods to evade it all. For this, he hired the best tax consultants, attempting to protect his assets. But no matter what, all efforts seemed futile—in the end, he still found himself in the defendant's dock.\n“Mr. Barannikov…”\nThe judge's questions were sharp and direct. Barannikov hesitated somewhat in his answers. His voice was low, occasionally stuttering due to nervousness. He had to avoid the judge's sharp gaze to find some inner peace.\nOutside the court, reporters gathered at the entrance, their camera flashes constantly flickering, trying to uncover all the details of this case that could arguably decide the future of the Republic. Inside, the spectators were also whispering, exchanging their views. As the trial proceeded, his mood grew heavier. He knew the chances of winning this silent war against the tax bureau were slim. A flicker of hesitation crossed his eyes, but it was quickly replaced by a determined expression. He still hoped, no, he *had* to find a glimmer of hope, absolutely could not let these scoundrels touch his property, absolutely not…\n“Silence!”\nEvidence continued to be presented, his hopes gradually shattering, his sanity slowly eroding—his property, his everything. From the expressions of the judge and jury, he knew it was irreparable. Barannikov's mood shifted from nervousness to despair, followed by endless rage. He could bear it no longer, stood up and shouted, like a monkey performing an impromptu act:\n“I’ve done so damn much for this country, damn it, how dare you treat me like this?!”\n“The defendant will remain silent! Please observe court discipline.”\nThe bailiff pressed him back into his seat. No one paid him any attention; everyone tensely awaited the final result:\n“It’s all over…”\nThey covered their faces and wept, crying out loud. The snowflakes they had created in the old era now roared and charged at them. The last shred of hope was extinguished with the judge's verdict.\n“The sentence is hereby pronounced…”\n“The court upholds the decision of the tax bureau. After the establishment of the Gaikin Group, Barannikov, through tax loopholes, allowed the Gaikin Group to evade billions in taxes, causing immeasurable losses to [RUS.GetName] and society. Therefore, the Gaikin Group must pay back taxes of approximately 1.3 billion rubles and a fine of approximately 700 million rubles, all to be paid in full within six months…”"
 SWRW_RUS.9.a:0 "They could only accept this outcome grimly."

 SWRW_RUS.10.t:0 "After the Dark Night..."
 SWRW_RUS.10.d:0 "Before the tax cuts, Andrei's life was full of hardship. Every day, he toiled in the coal mine, sweat soaking his work clothes. His face always wore a look of fatigue, his eyes revealing a helplessness towards life. His wages barely maintained his family's basic living, and the heavy tax burden made him feel suffocated.\n“How come the tax has gone up again?” Andrei complained at dinner, a hint of anxiety in his voice. His wife, Maria, listened silently, a worried look on her face. Their child, little Ivan, looked at them curiously, not understanding why his parents were always troubled by money. Andrei's brow was tightly furrowed, his eyes filled with worry about the future.\nTheir meals were always simple; an occasional piece of meat was a luxury. Andrei's shoes were long worn out, but he couldn't bear to buy new ones. Maria's clothes were always the same few, washed anúncios. Though life was simple, the high taxes always hung over their hearts, constantly extinguishing any warmth, suffocating them.\nLater, Andrei decided to join the tax resistance protests, hoping to change the situation through collective strength. On the day of the protest, he stood among the crowd, holding a banner, shouting slogans loudly. His eyes were determined, his voice full of hope.\n“We can't live like this anymore!” Andrei shouted, his voice echoing through the crowd. The loud voices spread like waves through the crowd, superimposing, eventually permeating the streets and alleys of Krasnoyarsk. At that moment, he felt an unprecedented strength, as if his voice could change the world. He felt his body filled with vitality, his heartbeat rising and falling with the waves. He felt he was no longer an ordinary coal miner, but a warrior fighting for justice and the future.\nAfter several tax resistance protests, the government finally decided to implement tax cuts for ordinary people. The day the news arrived, Andrei was working in the coal mine. When he heard the news, he could hardly believe his ears.\n“Really? Are the taxes really going down?” he asked his colleague excitedly, tears welling in his eyes. His voice trembled, but it was full of joy. His colleagues also responded excitedly; this was the fruit of their victory.\nNow, Andrei's life has undergone a tremendous change. He no longer needs to work overtime to pay taxes, and life is no longer as constrained as before due to high taxes. The improvement in quality of life also allows him more time and energy to spend with his family.\n“Look, Maria, we can finally buy Ivan the toy he’s always wanted,” Andrei said excitedly, holding his newly received wages, his voice full of happiness. Maria smiled at him, tears also welling in her eyes.\nOn the first weekend after the tax cuts, Andrei's family went for a picnic in the park early in the morning. Watching Ivan run on the grass, a long-lost smile reappeared on the couple's faces.\n“Dad, look, I caught a butterfly!” Ivan ran over excitedly, holding a colorful butterfly in his hand. Andrei and Maria looked at him, this little fellow filling their hearts with pride and happiness. Their smiles were so radiant, so sincere, as if all their troubles had vanished into thin air.\nCountless families like Andrei's were also enjoying this hard-earned leisure. The morning sunlight shone on their faces. Life, though not as beautiful as they had imagined, would never again be as laborious and tiring as before."
 SWRW_RUS.10.a:0 "...is the dawn."

 SWRW_RUS.11.t:0 "The Storm Abates, For Now"
 SWRW_RUS.11.d:0 "Inside the office, the lights were dim, only the faint glow from computer screens illuminated the room. To get [RUS.GetName]'s finances back on track as soon as possible, the Minister of Economy and his team had been working continuously for weeks. Everyone looked exhausted, but no one dared to slacken their efforts in the slightest.\nThe tables were piled high with documents and coffee cups. A map of Russia hung on the wall, with financially distressed regions marked in red. Outside, the night view of Moscow appeared exceptionally tranquil in the darkness. Pedestrians walked by rustling softly, completely unaware of the intense work underway in the nearby office.\nLong nights had left dark circles under the Minister's eyes. Though weary, his gaze remained firm. He understood that if they did not fight these difficulties to the death, only endless depression awaited the motherland.\n“Minister!” A startled cry suddenly rang out in the office. “Magadan’s report has finally been submitted! Their financial system can finally operate normally this month.”\n“We did it,” the Minister’s voice was hoarse, but joy was still evident. “Our reform measures are starting to take effect.”\nHe felt an unprecedented sense of accomplishment, but soon, a deep weariness washed over him again. He knew this was just the beginning; they still had a long way to go. Cheers erupted in the office; they knew what this report meant.\nThe Minister crossed off the last red circle on the map. Looking at the densely crossed-out red circles, thinking of how those wealthy merchants and dignitaries had finally shut their mouths, he now had enough funds for the next step of reform.\n“Have Magadan and other places recompile new financial reports and send them over. We need more precise data to guide our decisions,” the Minister emphasized. “We must ensure our reforms not only solve current problems but also lay a solid foundation for future development.”\n“We cannot stop here,” the Minister murmured. “The foundations of tax reform are still not solid enough. We need to keep moving forward, until we achieve final victory.”\nAfter a moment of silence, the Minister took out the tax reform plan that had been idle for some time. Although it had once been nearly scrapped due to this crisis, after much mending and patching, it was now ready to be reactivated.\n“Get [RUS.GetLeader] on the phone,” the Minister said. “Now we have to roll up our sleeves and give this country a resounding revolution.”"
 SWRW_RUS.11.a:0 "Everyone, back to your posts. We still have much to do."

 SWRW_RUS.12.t:0 "[RUS.GetName] Tax Reduction Act"
 SWRW_RUS.12.d:0 "Act Number: Republic Tax Law XXXX-XX\nSubmission Date: Month XX, XXXX\nSubmitting Body: Ministry of Finance of [RUS.GetName]\nPrimary Drafter: Volnin\nIntroduction\nGiven the current economic situation and the tax burden on citizens, the government of [RUS.GetName] has decided to formally implement tax reduction measures through legislation to stimulate economic growth, improve people's living standards, and optimize the tax structure. This act aims to reduce the tax burden on low- and middle-income groups while ensuring the stability of national finances.\nChapter One: Tax Reduction Goals and Principles\n1. Goals:\nAlleviate the tax burden on low- and middle-income families.\nPromote consumption and stimulate economic growth.\nEnhance the fairness and transparency of the tax system.\n2. Principles:\nFairness: Ensure the tax burden is fairly distributed among all social strata.\nTransparency: Simplify tax laws and improve the transparency of tax policies.\nSustainability: Ensure the long-term viability of tax policies without undermining national fiscal stability.\nChapter Two: Tax Reduction Measures\n…………\nChapter Three: Implementation and Supervision\n…………\nChapter Four: Supplementary Provisions\n1. Legal Effect:\nIn case of conflict between this act and existing tax laws, this act shall prevail.\nThe right to interpret this act belongs to the Ministry of Finance of [RUS.GetName].\n2. Amendment and Repeal:\nThis act may be amended or repealed by a decision of the State Duma based on economic development and fiscal needs.\nSubmitted by: Volnin\nDate: Month XX, XXXX"
 SWRW_RUS.12.a:0 "The Act is passed."

 SWRW_RUS.13.t:0 "The River of Funds Flows On..."
 SWRW_RUS.13.d:0 "Syktyvkar, during the years of the Komi Republic, was filled with violence, conspiracy, and madness. But now, it bathes in the morning sun. On the streets, people are burying the traces of Pandora's Box in the ruins of the past. As funds from [RUS.GetName] begin to flow into this war-torn city, people are dismantling the ubiquitous armories and fortifications along the streets, hope and determination re-emerging on their faces. In the future, Syktyvkar may not become Russia's most beautiful or prosperous city, but it will certainly not be like the city of the past.\nOmsk was almost entirely destroyed during the war, but it is now undergoing tremendous changes. Investment from [RUS.GetName] has not only greatly improved the city's appearance but also brought new industrial projects. The intense desire for revenge that once permeated the city is gradually fading. Thick black smoke once again billows from factory chimneys, and the roar of machinery proclaims the city's future to the heavens. Omsk's industrial heart is beating again, but unlike before, it no longer produces only guns and weapons for slaughter, but also rye bread to benefit the masses.\nTomsk, long neglected, is now ushering in its spring. Investment from [RUS.GetName] has allowed the city's cultural potential to be fully realized. In the city center, new buildings are rising one after another. Workers, free from tax burdens, labor diligently on construction sites. The roar of machinery intertwines with people's laughter, forming a harmonious symphony. Along the streets, newly planted trees are beginning to sprout tender green leaves, allowing this gray city to regain its true colors. Museums, libraries, and art centers, long unmaintained, have been revitalized, attracting tourists and scholars from all over the country. Though traces of the Central Siberian Republic are hard to find, Tomsk's cultural light is beginning to illuminate all of Russia.\nPetropavlovsk, a port city once overlooked due to its remote location and the departure of the Red Navy, has now finally caught the attention of the [RUS.GetName] government, which intends to develop it into Russia's new trade center and important naval port after Magadan. Large sums of money have repaired the facilities of the abandoned port, attracting ships and merchants from all over the world. On the port's docks, goods from the OFN, and even Japan and Germany, are piled high, with merchants busily trading. Not far away, the Pacific Fleet at the Petropavlovsk naval base is conducting exercises in full swing, preparing thoroughly for future contingencies. Perhaps people should believe that this once almost desolate city does not belong to pristine nature."
 SWRW_RUS.13.a:0 "...flowing towards a prosperous future."

 SWRW_RUS.14.t:0 "Banners on the Dnieper"
 SWRW_RUS.14.d:0 "The air in Kyiv was thick with dust, smoke, and a peculiar silence—the silence that falls when artillery has just ceased, and the living dare not yet speak loudly. Ivan leaned against the shell-pocked wreck of a BTR, wearily watching the grey sky. They had done it. From the frozen north, they had pushed south, across battlefields strewn with corpses, and now the banner representing a unified Russia finally flew over this ancient city. The radio repeatedly broadcast news of victory, proclaiming that the Ukrainian people had been liberated from 'forty years of brutal fascist bandit rule' and returned to the 'embrace of the great Slavic family.'\n\nSounded grandiose, Ivan thought. Just like something those political department types, who’d never smelled gunpowder, would write. But what he saw before him was far removed from the radio’s fervent paeans. No welcoming crowds with food and drink, no cheering throngs. Only faces, sallow and hollow-eyed, cautiously peering out from basements and crevices in the ruins. No joy on their faces, more like numbness, doubt, and a weariness that cut to the bone. They eyed Ivan and his comrades as they would a pack of bears that had just driven off wolves but might themselves be devourer.\n\nYesterday, Ivan’s squad, while clearing remnants of the enemy in a half-demolished apartment building, had found an old woman hiding in a closet. She clutched a faded, strangely embroidered cloth bundle, muttering to herself in a language he almost couldn't understand, yet found vaguely familiar. Not German, not Russian. When the soldiers tried to pull her out, she fast raised her head, a nearly extinguished spark in her cloudy eyes, and said in a hoarse but startlingly clear voice: “We are Ukrainians.”\n\nJust that one sentence. No thanks, no accusations, just a statement so simple it was almost stubborn. As if reminding them, and herself, that after the oppression of Germanization, the endless grain requisitions, the terror of the secret police, and the daily humiliations, some things, like tenacious grassroots under the black earth, had not died. Ivan had later seen hand-drawn trident symbols hidden in wall cracks in cleared houses, heard fragments of sad, off-key songs drifting from some window at night, their melodies definitely not from Moscow.\n\nThey had been ruled for forty years. Forty years, long enough for a generation to be born, grow up, and grow old. Their cities were renamed, their language forbidden in official use, their history altered or erased. Children were forced to learn German, singing songs praising another “Führer.” Wheat from the black earth was ceaselessly shipped to Germania, while locals often struggled on the brink of starvation. Ivan recalled reading about the “Holodomor” in history books, a tragedy of another era, but for many elderly people here, perhaps it was just a repetition in a different form.\n\nNow, they were “liberated.” Tanks rolled over squares once adorned with swastikas; new portraits replaced old ones. But looking at those silent, complex-eyed Ukrainians, Ivan suddenly felt a wave of confusion. How should history be remembered? Whose sacrifices should be eulogized? Whose suffering should be recounted? The memories carried by this land were far heavier, far more complex, than they had initially imagined. They had brought back the banner, but could they truly bring back those souls suppressed, distorted, and whispered about in the long, dark night?\n\nIvan sighed and re-shouldered his rifle. At least, the fighting was over. At least, they had come."
 SWRW_RUS.14.a:0 "Forty years whispering a name, even iron hooves could not crush."

 SWRW_RUS.15.t:0 "The First Brick on the Ruins"
 SWRW_RUS.15.d:0 "The morning mist had not yet dispersed, and sunlight struggled to penetrate the dust lingering over Kyiv, falling on the pitted cobblestones of Saint Andrew's Descent. The air was a mixture of damp earth, lime, and an indescribable scent of new beginnings. Once, this place echoed with the rhythmic tread of marching boots, sharp German commands, and occasional gunshots. Now, a different kind of symphony had taken its place—the clang of hammers striking stone, the rough chants of porters, the creak of temporary scaffolding, and... the whisper of hope.\n\n“Comrades, put your backs into it! This wall must be finished before nightfall!” shouted a foreman wearing an old, mortar-stained military cap, his voice booming. Beneath his feet lay a scene of devastation—collapsed walls, charred beams, scattered rubble. Just a few months ago, this was a battlefield. Now, it was a construction site. Men, mostly elderly veterans or young men who had just laid down their rifles, labored in silence and with focus. They passed bricks, mixed mortar, their movements clumsy yet imbued with an almost stubborn determination. Each brick laid seemed to declare to the dark past: We are back, and we will reclaim our home.\n\nNot far away, several women were painstakingly clearing debris with wicker baskets, their headscarves covering half their faces, revealing only eyes that were weary yet resilient. As they cleared, they spoke in low voices, an occasional suppressed sob heard, but more often, whispers of mutual encouragement. “Soon, Alyona, a few more baskets and we’ll see the foundation.” “Careful, Tamara, that stone isn’t stable.” They were clearing not just rubble, but the fragments of life buried by war—broken pottery, charred picture frames, rusted farm tools... Each item silently told a story forcibly interrupted.\n\nOccasionally, Russian soldiers in uniform would patrol by, their gazes sweeping over the busy crowd, their expressions complex. Some would stop, awkwardly helping to move a few bricks, earning a few heavily accented “thank yous.” Others merely watched in silence, as if contemplating the meaning of this reconstruction and their role in this land. The air was no longer filled with hostility, but with a cautious coexistence, a fragile understanding built upon common ruins.\n\nIn the distance, the Dnieper River flowed silently on, reflecting the gradually brightening sky and the city’s battered skyline. The road to reconstruction was long, and the painful memories were far from healed. But this first brick, this first chant, this first ray of sunlight piercing the dust, was like a seed falling upon the traumatized black earth. Perhaps, as their poet wrote…"
 SWRW_RUS.15.a:0 "“When the sleeper awakens, he shall find his fetters broken.”"

 SWRW_RUS.16.t:0 "Seeds Beneath the Black Earth"
 SWRW_RUS.16.d:0 "Petro's boots sank deep into the muddy black earth, each step making a dull squelch. The air mixed the dampness of the early spring thaw with an indescribable smell of rusted metal and decaying bones. Was this the granary they promised? This fabled land where a walking stick planted would supposedly sprout? He looked around; the fields were pockmarked with craters, like a face ravaged by smallpox. On the distant horizon, the twisted silhouette of a derelict tank stabbed at the leaden sky, a monument left from the last liberation, or perhaps the one before that? Who could even remember.\n\nInstructors from the city, in their clean uniforms, generously distributed seeds—small, shriveled grains in sacks الناس by faded, illegible Cyrillic letters. They patted Petro's shoulder, speaking passionately about 'Five-Year Plans,' 'agricultural modernization,' and 'contributing grain to the great motherland.' Petro just nodded, forcing a look of requisite gratitude and enthusiasm. He didn't tell the instructor that last autumn, in this very field, he had dug up an unexploded German aerial bomb that nearly sent his whole family to meet Hrut. Nor did he mention that the previous rulers had also promised tractors, only to deliver a pile of rusty parts and an incomprehensible German manual.\n\nNeighbor Ivan squatted at the edge of the field, rolling a cheap makhorka cigarette, watching Petro struggle with his ancestral, endlessly repaired wooden plow. “Petro,” Ivan exhaled a thick cloud of smoke, his voice like sandpaper, “they say this black earth has a spirit; it knows what you plant. Do you think it knows whether we’re planting hope now, or another crop of suffering?”\n\nPetro stopped, wiped the sweat from his brow, a mixture of soil and perspiration. “Who knows, Ivan,” he panted, “Maybe it only knows hunger. It’s been hungry for decades, and we’ve been hungry for decades. Now, someone says let us feed it, and then it will feed us. Sounds… fair.” His tone carried an almost numb sense of fatalism. Fair? On this land, 'fair' was a luxury.\n\nHe bent down, grabbed a handful of seeds from the cloth bag, the shriveled grains pricking his calloused palm. He looked at this land,hit countless times, a land that had devoured corpses, drunk blood, and borne too many broken promises. Unified. Yes, no more men in different uniforms shooting at each other here. That was progress, undoubtedly. Life was perhaps a little better, like the air by a winter fire, slightly warmer. But this land… it was so tired.\n\nPetro took a deep breath and scattered the seeds onto the turned earth. Black grains fell on black soil, silently. Would they sprout? Would they bear fruit? Or would they be washed away by the coming rains, or pecked clean by crows? No one knew. But he scattered the seeds anyway, because what else could he do? This was his land, no matter how much pain it carried."
 SWRW_RUS.16.a:0 "Sow... perhaps, it will sprout."
 SWRW_RUS.17.t:0 "Signed, Sealed, Can't Read It"
 SWRW_RUS.17.d:0 "Summer had barely settled in when a new face appeared in the village—a young man with thick glasses and a neat but slightly countrified uniform, calling himself a 'Land Relations Coordinator' sent from the district. He brought several stacks of brand-new documents reeking of ink, and an enthusiasm that sent a chill down Petro's spine. The coordinator gathered the villagers in front of the dilapidated village office, gushing about the new 'land to the tiller' policy, words hailing down on Petro's muddled head like hailstones: 'cadastral registration,' 'land use certificates,' 'collective responsibility linked to individual profit'...\nPetro was handed a stiff piece of paper, covered in dense Cyrillic script, and a bright red stamp depicting what looked like some kind of fierce bird. He looked at it sideways, then upright, brought it close to his eyes, then held it up to the sunlight, squinting. The letters danced before him like a swarm of drunken ants, performing an incomprehensible ballet. His rough fingers traced the paper's edge. This thing was thicker than a ration coupon, but far less substantial than a good scythe.\n“Petro Ivanovich!” The young coordinator clapped him on the shoulder, his smile as bright as the red star on Moscow's square. “Congratulations! Look! This piece of land, from now on, it belongs to you! Well, strictly speaking, it’s a long-term stable use right, but practically, it’s yours! Work hard for the great motherland!”\n“Mine?” Petro repeated numbly, his voice sounding like it came from a dry well. “What d’you mean? This land… hasn’t it always been me farming it? My pa farmed it, my grandpappy too. It was this piece when the Germans came, and this piece when the last liberators came. How’s it become mine now?” He pointed to the familiar patch of black earth nearby, just starting to show some green shoots. “Does this stamp on this paper make the stones in the field run away by themselves? Or will next year’s rain listen to my commands?”\nOld Ivan, puffing on his pipe nearby, muttered, “Careful, Petro. The Tsar used to say the land was his, then the commissar said the land was collective, now they say the land is yours. This land, eh, it’s like a disobedient wife. Nobody’s word counts, only God Almighty’s and your own strength.”\nPetro ignored Ivan's grumbling. He looked down at the 'certificate' again, trying to find some familiar trace in those twisted symbols—perhaps 'potato'? Or 'tax'? Nothing. He only recognized his own name, Petro Ivanovich, clumsily printed at the top. He suddenly felt a dizzying sense of absurdity. This land, soaked with the sweat, and occasionally the blood, of generations of his family, was now 'his' because of a piece of paper he couldn't read?\nHe looked up at the black field, the early summer wind carrying the scent of earth and grass. The land was still the same land, silent and stoic. Slowly, carefully, he folded the stiff paper and tucked it into the worn pocket of his shirt, right next to his heart. There, the paper's edges pressed against his skin through the coarse cloth. An unprecedented emotion, a mixture of immense confusion and a tiny, almost negligible… perhaps… hope? stirred in his numb heart like a newly sprouted seedling.\nWow… he really had land? Even if only a piece of paper he couldn't make heads or tails of said so."
 SWRW_RUS.17.a:0 "Well, now this mud finally has my name on it."
 SWRW_RUS.21.t:0 "The New 'Cooperative' Neighbors"
 SWRW_RUS.21.d:0 "The 'land certificate' had barely warmed in Petro's breast pocket when new developments arrived in the village. This time, it wasn't an enthusiastic young man, but a stern-faced, middle-aged man who spoke with a thick bureaucratic accent. His uniform collar was stiffer than the most presentable tablecloth in Petro's house. He summoned all the villagers who had received 'certificates' and announced a grand initiative called the 'Agricultural Production Cooperative Pilot Program.'\n“Comrades!” His voice echoed in the empty village hall, carrying an undeniable authority. “Individual farming is inefficient and cannot bear the heavy responsibility of revitalizing the motherland's granary! To increase output, share resources, and concentrate efforts on major tasks, we have decided to establish agricultural cooperatives! Everyone's land, tools, and even that lame old horse,” he pointed to old Ivan's animal tied to a tree, “will be uniformly managed by the cooperative, with distribution according to labor, more work means more reward!”\nPetro stood in the crowd, scratching his scalp vigorously, trying to make sense of the tongue-twisting words. Uniform management? Distribution according to labor? This sounded… awfully familiar. He remembered as a child, another group of men in different uniforms had said similar things, only then it was called a 'collective farm.' Then too, they talked about 'concentrating efforts.' And the result? The grain was indeed concentrated, but it all ended up on the grain requisition teams' trucks.\n“What?” Old Ivan was the first to jump up, his pipe almost falling to the ground. “My old horse may be lame, but it's mine! Why should it be uniformly managed by you? I ask you, if I want to leave a couple of potatoes for my grandson, do I have to submit a report?”\nThe middle-aged official pushed up his glasses, his face impassive. “Comrade Ivan Stepanovich, this is for the common good. The cooperative will uniformly provide seeds, fertilizer, and coordinate plowing times. At the end ofthe year, income will be calculated based on work points, ensuring fairness and justice, and you'll also get priority access to state-supplied agricultural machinery.” He paused, his tone becoming more emphatic. “Of course, we won't force comrades who are unwilling to join. It's just that… farmers outside the cooperative, in terms of resource allocation and agricultural product procurement prices, may… experience some differences.”\nA murmur of discussion rippled through the crowd. Petro looked at the land certificate in his hand, then at the patch of land that had just started to show some life, his mind a tangled mess. The 'his' land he had just received, barely warmed, was now to be 'cooperated'? Wasn't this just going back in a circle?\nBut then he thought, life had indeed gotten a bit better recently. The rationed flour, though unpalatable, was at least enough; the village road had been repaired, still a dirt road, but with fewer potholes; most importantly, he could sleep soundly at night. That young coordinator had even helped his son, little Vasya, get into primary school in the city…\nPetro scratched his head again. He still couldn't understand the convoluted ways of these city folk. Collective farm? Cooperative? It sounded like the big bad wolf in a new disguise. But… his stomach did feel a bit fuller than before. He sighed heavily and, like the other villagers, pressed his fingerprint onto another document he couldn't understand."
 SWRW_RUS.21.a:0 "Alright, a different way to play in the mud together."

 SWRW_RUS.22.t:0 "Divided Land, Familiar Taste"
 SWRW_RUS.22.d:0 "Mikhail, shouldering his oft-repaired old plow, trudged through the tilled black earth. The scent of spring finally overpowered the muddy odor of melting snow, carrying a faint, elusive fragrance of grass. Unlike previous years, the land beneath his feet, according to the red-headed document posted on the wall of the village cooperative, was now 'clearly allocated' for his family to cultivate. Of course, the lion's share of the harvest still had to go to the state, but at least, nominally, they had 'their own' land, instead of relying on the heavens and the whims of cadres for their yearly allotment.\nHis son, little Vasya, now almost as tall as Mikhail's shoulder, was no longer the little tyke who only knew to ask, 'Is life getting better?' He awkwardly followed his father, learning to sow a high-yield potato seed, supposedly 'scientifically cultivated.' The boy's strength had grown, and he could help quite a bit, though his movements were still clumsy, scattering seeds unevenly.\n“Dad,” Vasya panted, wiping sweat from his brow, “Uncle Yakov from the cooperative said if the harvest is good this year, we can get two extra bags of potatoes! Is it true?”\nMikhail straightened up,shock his aching back, and gazed at this endless stretch of his own land. “That’s what the paper says, son.” He paused, spat. “Whether we get it in hand, well, that depends on whether God—oh no, whether Comrade Lenin’s spirit in heaven blesses us, and also on whether that fat political commissar who collects the grain is in a good mood.”\nYes, there were changes. The village loudspeaker no longer blared wartime songs daily but started promoting the benefits of 'agricultural cooperation,' saying everyone was now the master of the land. The soup in the canteen was a little thicker, occasionally with a few specks of oil. A small shop had opened in town; though its shelves were mostly empty, at least there was the idea of it.\nBut Mikhail knew in his heart, this land was still the same land, the soil still the same soil. What to plant, how to plant it, was mostly decided from above. How much grain to hand over, how much to keep, were iron-clad regulations. The so-called 'reward for labor' was more like the few potatoes he used to secretly pocket, now allowed to be pocketed openly—provided, of course, you first completed your delivery quota.\nHe watched his son scatter seeds with an excitement, an almost faith-like fervor, and his heart was a mix of emotions. Perhaps for the young, this was hope? A tangible, visible hope, even if it was only a thin layer. Well, having hope was better than having none.\nMikhail gripped the plow handles again and shouted, “Put your back into it, boy! We have to finish this furrow before dark! Otherwise, there’ll be no potato pancakes for you at dinner!”"
 SWRW_RUS.22.a:0 "Potato pancakes are better than no pancakes."

 SWRW_RUS.23.t:0 "Smoke Rings by the Dnieper"
 SWRW_RUS.23.d:0 "The Kyiv dusk carried a scent of steel and dust, the setting sun struggling to paint the Dnieper golden, only to be sharply fragmented by the stark silhouettes of new Russian-style apartment buildings. Oleg sat at the wobbly table in his kitchen, a half-empty, almost label-less bottle of vodka and a saucer of darkly pickled cucumbers before him. His son, seventeen-year-old Sasha, was hunched over a brand-new history textbook, its pages exuding the smell of cheap ink.\n“Dad,” Sasha’s voice was hesitant, breaking the silence, “the book says… we are all an indivisible part of the great Russian nation, and past sufferings were due to separatist plots and foreign powers…” He looked up, his young face etched with confusion. “But Grandma always told me we were descendants of Cossacks, singing songs of Kyivan Rus…”\nOleg didn’t answer immediately, just poured himself a full glass of vodka and downed it, a satisfied yet bitter gurgle sounding in his throat. He rolled a coarse makhorka cigarette, lit it with a match, and took a deep drag, the smoke blurring his weather-beaten face. “Books,” he finally spoke, his voice hoarse, “books are written by victors, Sasha. Like bread distributed from the ration station—they give you what they give, and you eat it, whether it tastes like sawdust mixed with mud or not.”\n“But the teacher said national unity is the top priority, to forget past unpleasantness to build a strong new motherland…”\n“Build a motherland?” Oleg scoffed, ash falling onto his patched trousers. “We’ve been building motherlands all our lives. First, building for some mustachioed madman in the Polish mud, then ‘building’ for those waving tridents and shouting slogans in the ruins of Crimea, then later building for some big-bearded general in the rubble of Kharkiv… Now, we’re to build for the comrades from Moscow. Every construction means tearing down something old, forgetting some old names. They say it’s for unity, for strength.” He gestured out the window. “Look at that new Comrade Street. It used to be called Khreshchatyk. Your grandma used to take me there to buy Easter eggs. Now, there are only grey concrete slabs and uniform slogans.”\nSasha fell silent, his fingers unconsciously stroking the portrait of a leader he’d never seen, printed on the book’s page. “Then… what… what are we?” the boy asked softly, a question that seemed to have troubled him for a long time.\nOleg stubbed out his cigarette and lit another. He didn’t look at Sasha but gazed at the murky waters of the Dnieper. “What are we?” he repeated, his voice dropping. “We are people who plant potatoes, who drink vodka to keep warm, who secretly sing the songs of our ancestors in our hearts. We are people who remember Khreshchatyk Street. We are people who have watched flags change again and again, yet still survive on this black earth.”\nHe turned, his gaze fixing on his son, sharp as a tack. “Listen, Sasha,” he said, tapping his own chest with a rough finger, then pointing to Sasha, “the blood in your veins comes from this land. The first words you spoke were in the Kyiv accent. Never, ever forget that. Even if the whole world forgets, you yourself cannot forget. You are Ukrainian.”\nThe father and son remained silent for a long time. Outside, the sky had completely darkened, only scattered lights twinkling on the far bank of the Dnieper. Oleg picked up the cigarette pack from the table and offered one to Sasha. Sasha hesitated, then took it. Two crimson embers glowed in the dim kitchen, smoke curling, filling the silence."
 SWRW_RUS.23.a:0 "The waters of the Dnieper still flow to the Black Sea."

 SWRW_RUS.24.t:0 "Katyusha and Quotas"
 SWRW_RUS.24.d:0 "When Sasha returned from school, he saw a new, almost garishly colored poster pasted at the alley entrance. It depicted a buxom, robust Ukrainian mother with a standard smile, cradling three equally rosy-cheeked infants, against a backdrop of rolling wheat fields and towering factory chimneys. A huge slogan in bold Cyrillic letters read: “Hero Mothers—The Pride and Future of the Motherland!” Smaller text detailed the latest reward policy for families with three or more children—some extra cloth coupons, and perhaps priority in purchasing low-quality candies.\nAt dinner, the kitchen was filled with the bland smell of boiled cabbage. Sasha, absentmindedly poking at the potato chunks in his bowl, finally spoke up: “Dad, they put up new posters in the street, saying it’s glorious to have many children, that it’s a contribution to the country… The teacher also said we have too few people, the Germans, the Americans, they have many…”\nOleg, struggling to cut a hard loaf of black bread with a dull knife, paused. He picked up the half-empty vodka bottle from the table and poured himself another glass, the murky liquid sloshing. “Glorious,” he snorted, gulping down the alcohol. “Yes, glorious. As glorious as the collective farm tractors back then. They need manpower, Sasha. They need workers to fill the factories, soldiers to fill the barracks, enough people to shout ‘Hurrah!’ and wave flags.”\nHe twisted a cigarette butt between his fingers. “Your grandmother’s generation, she had seven, three survived. No one called it glorious then, only hard-fated, said they couldn’t raise them. Now they want your mother, want Marsha from next door, to pop out babies like chicks from eggs. Glorious? Those cloth coupons they give, are they enough to make diapers for a newborn? Enough to buy a sip of milk? They draw you a big pie flying in the sky and then make you chase it on an empty stomach.”\nOleg lit his cigarette, took a deep drag, smoke curling. “They say we’re not the womb of Europe. Sounds nice. But they want women to open their wombs, one after another, how is that different from a sow farrowing? Marsha is only in her early thirties, looks older than your grandmother. Her man? Died two years ago in a ‘peacekeeping mission,’ on some godforsaken border, couldn’t even find his bones. Now she’s raising five kids alone, by washing clothes for officers in exchange for some potatoes. Glorious? Bullshit glorious.”\nHe flicked his ash. “The country needs a future, Sasha. But a future isn’t born from quotas and slogans. It’s nurtured by hot soup, by warm boots, by being able to sleep soundly at night. Don’t believe those posters, kid. The wheat in the posters can’t be eaten, the children in the posters don’t cry.”\nSasha fell silent, looking down at the few lonely potatoes in his bowl. Outside the kitchen window, the night grew darker, and the distant factory chimneys continued to spew black smoke tirelessly into the boundless twilight."
 SWRW_RUS.24.a:0 "Children are the flowers of the future, but they need fertilizer, not quotas."
 SWRW_RUS.25.t:0 "Golden Ears in Black Earth"
 SWRW_RUS.25.d:0 "It was time again to sell grain to the state. Oleg stood by the dusty threshing floor, watching sack after sack of plump wheat being loaded onto creaking trucks. Under the sun, the golden ears of wheat piled up like mountains, dazzling the eyes. On the radio, a broadcaster with a sonorous, perfectly enunciated voice, was passionately announcing: “…Ukraine, the granary of our great motherland, has once again over-fulfilled its aid mission to the fraternal European nations! The fertile black earth has once again proven the superiority of the system! Golden waves of wheat will nourish the entire progressive world…”\nSasha was also nearby, helping to carry sacks, sweat soaking his thin shirt. He stopped to catch his breath, wiped the sweat and dust from his face, and walked over to his father. “Dad, we’ve harvested so much grain, we really are the ‘granary of Europe’!” His young face bore a trace of pride, similar to the broadcaster’s, infected by the grand narrative.\nOleg spat out the blade of grass he was chewing, his eyes complex as he watched the departing trucks laden with grain. “Yes, a granary. Someone else’s granary.” He pulled a crumpled cigarette pack from his pocket, took one out, and lit it. “Look at this wheat, Sasha, golden and beautiful. Know where it’s going? To Moscow, to Warsaw, to Prague, to Berlin—God knows where else. It’ll become decent white bread for those city folks, a garnish on their tables.”\n“But we’re helping fraternal nations, Dad. The book says this is internationalism…”\n“Internationalism?” Oleg let out a dry laugh, smoke escaping from between his teeth. “Yes, great internationalism. It means tightening your belt, taking the life-sustaining grain you dug out of your fields, and loading it onto trains for ‘brothers’ thousands of versts away, whose names you don’t even know. Then they give you a few certificates, call you a ‘labor model,’ and give you a few empty promises, saying tractors will arrive in the village next year—year after year.”\nHe pointed to their meager private plot. “What about our own land? After handing over the public grain each year, what’s left is barely enough to get us through to spring. Your mother still has to find ways to mix potatoes with flour to make bread. We are a granary? Ha! We are sacks for others to fill with grain; once filled, they’re carried away. Who cares if the sack is torn, or if it’s hungry?”\nOleg took a harsh drag from his cigarette. “Remember, Sasha, this black earth is our mother; it can feed us. But now, it has to feed others first. When it can feed us first, before ‘aiding fraternal nations,’ then that will be truly good times. Don’t be fooled by the slogans on the loudspeakers and the numbers in the newspapers.”\nThe trucks kicked up a cloud of dust and drove off, leaving behind an empty threshing floor and the fragrance of wheat straw. Father and son stood there silently, watching the convoy disappear over the horizon. Oleg threw his cigarette butt to the ground, crushed it with his boot, and pulled out another from his pocket, lighting it anew."
 SWRW_RUS.25.a:0 "Toiling the earth, feeding the world, starving ourselves."

 SWRW_RUS.26.t:0 "Dust and Echoes on the Great Dam"
 SWRW_RUS.26.d:0 "Zaporizhzhia, on the banks of the Dnieper. Taras's sweat dripped onto the scorching concrete, evaporating instantly. The deafening roar—concrete mixers, pile drivers, the howl of heavy trucks—had almost become part of his life. He couldn't remember how many years it had been; like ants, they toiled on this war-ravaged land, rebuilding the massive hydroelectric power station that was once the pride of the republic, later a victim of both sides' scorched-earth policies.\nNew flags fluttered over the construction site, and loudspeakers blared perpetually optimistic marches and speeches by leading comrades about 'electrification illuminating the future.' Taras was already numb to it. He remembered earlier times, as a child, when his father had also worked here. Then, people's eyes shone with light, believing every stone, every bag of cement, was adding to a brighter world. Later, that light was extinguished, accompanied by deafening explosions and the Dnieper's angry roar. His father didn't live to see that day.\nNow, they were back. With the same tenacious spirit, using equipment transported from 'fraternal republics' that often broke down, and with tens of thousands of rough hands like his own. The radio said this was a 'miracle of the people's will,' a 'powerful counterattack against fascist saboteurs.' Taras felt it was more like a struggle against themselves, against this unruly river, against that damned, ever-present past.\nHe and his fellow workers lived in temporary sheds, lit at night by dim bulbs—if they were lucky and the power was on. Watching the dam rise again day by day, like a grey scar across the river, Taras felt a strange emptiness. Where would this immense power flow? To light up Kyiv's neon nights, or to drive the gears of factories in distant borderlands? Perhaps both. But right now, he only felt the ache in his back, and the concrete dust that could never be completely washed away."
 SWRW_RUS.26.a:0 "The river will always flow, no matter where."

 SWRW_RUS.27.t:0 "Distant Bright Lights and Flickering Candles"
 SWRW_RUS.27.d:0 "On the outskirts of Poltava, Oksana once again skillfully tightened the base of a loose lightbulb. The dim yellow light flickered a few times and finally stabilized, barely illuminating her simple hut and the mending work spread out on the table. Outside, massive high-voltage power towers stood like steel giants, silently striding across the fields, extending thick cables towards a hazy distance—supposedly Poland, perhaps even further.\nThe radio was broadcasting the evening news, the announcer declaring in that distinctive, proud tone: “…This quarter’s electricity export quota has once again been over-fulfilled! Ukraine’s surging power is continuously being supplied to fraternal nations, strongly supporting the common prosperity of the Collective Security Treaty Organization…” Oksana snorted, paying no attention. She was more concerned about whether her electricity bill would go up again this month, and whether the village sawmill could operate normally tomorrow—the last power outage halted wood processing for half the village, leaving the men to grumble in the tavern.\nHer neighbor, old Ivan, leaning on his cane, came in to borrow some salt. “Did you hear, Oksana? All our electricity is going abroad; Moscow must be very bright!” A hint of sarcasm touched the old man’s wizened face. “And here? Hah, our lightbulbs are like fireflies, on and off. Truly, the fat flows to outsiders’ fields.”\nOksana handed him the salt cellar and sighed: “Uncle Ivan, say less. They say this is the bigger picture, a ‘strategic necessity.’ What do we common folk understand?” But in her heart, she thought of her child doing homework at night, having to huddle under the lightbulb, unable to see the book clearly from a little further away. And those power lines, supposedly carrying “surging power,” hummed overhead, sending light to people she would never meet. This must be what it felt like to be a granary, she mused. Empty stomach, watching the grain being shipped away, and now even the light had to be shared with others.\nShe fiddled with the mending thread, by that unstable light. The distant power towers were silent silhouettes in the night, steadfastly fulfilling their 'internationalist duty'."
 SWRW_RUS.27.a:0 "Currents know no borders, but darkness does."
 SWRW_RUS.28.t:0 "Zaporizhzhia Nuclear Power Plant"
 SWRW_RUS.28.d:0 "Levko stood a few hundred meters away from the massive concrete dome, feeling the ground beneath his feet vibrate slightly. The Zaporizhzhia Nuclear Power Plant, the republic's newest pride, or rather, its newest behemoth, was undergoing some critical tests. He was a young technician, transferred from Lviv, responsible for monitoring the pressure readings of the cooling system. Everything here exuded a sense of the future, and also a chilling unfamiliarity.\nThe site was teeming with people in white or grey uniforms, wearing badges with numbers and letters, their faces stern. Armed guards were stationed every few steps, and the barbed wire fences bore yellow and black radiation warning signs—that strange trefoil symbol, said to represent an invisible, intangible 'fire' that could kill you. Old workers privately called it the 'atomic will-o'-the-wisp.'\nLevko had received training, knew all the safety procedures, and understood what the Geiger counter readings meant. But he still couldn't completely shake off a sense of awe and a tinge of fear. This was entirely different from burning coal or damming a river. What they were taming was the power of the sun's core, the secret of stellar combustion. Propaganda posters depicted atomic energy as a gentle giant, capable of providing 'inexhaustible clean energy,' able to 'illuminate the entire republic overnight.'\nHowever, what was locked behind those clean control rooms and thick lead doors? Levko sometimes found himself staring at the silent, immense silhouette of the reactor during night shifts. It resembled a slumbering beast, its breathing steady, but you knew it could awaken at any moment and unleash devastating power. His colleagues sometimes joked that if they made an operational error, they would instantly become 'ashes of the state.' Behind the jokes lay an unspoken tension.\nToday's test seemed to be going smoothly; all readings were within normal ranges. Levko signed his name in the logbook, relieved. After work, he walked out of the plant area and saw the Dnieper River glistening in the sunset, smoke curling from a village炊 on the riverbank. Everything was peaceful and serene, as if this concrete and steel giant belonged to a different world. He didn't know what this 'peaceful atom' would ultimately bring to this land. The promised light, or a hidden shadow?\nHe pulled a crumpled cigarette pack from his pocket, lit one, and took a deep drag. The smell of tobacco temporarily overpowered the faint, disinfectant-like 'scientific' scent in the air."
 SWRW_RUS.28.a:0 "At least the reactor didn't sneeze tonight."
 SWRW_RUS.29.t:0 "The Dnieper's Embrace"
 SWRW_RUS.29.d:0 "Kyiv's night, for the first time, had a comforting, continuous expanse of lights. Along Khreshchatyk Street, twenty-year-old Yuri walked slowly. He had just finished his shift at the reconstruction site; though his body ached and the few rubles in his pocket jingled, his heart felt a strange, unprecedented sense of solidity.\nHe remembered his childhood, when the nights here belonged to silence, curfews, and fear. Windows had to be covered with thick black cloth; any sliver of light could attract patrols, or worse. Streetlights either didn't work or emitted a ghostly glow, making familiar streets seem alien. People spoke in hushed tones, their eyes filled with suspicion and weariness.\nLater, flags changed again and again, each time accompanied by new slogans, new promises, and new destruction and displacement. Yuri's father, a taciturn railway worker, never showed enthusiasm for any flag or any 'liberator,' merely quietly repairing bombed-out tracks, only to see them bombed again. Father often said: “It doesn't matter what sign they hang, Yuri, our life is just mending pots; one hole is plugged, another leaks.”\nBut now, something seemed genuinely different. The roadside cafes were lit with warm lights, and low conversations and the long-absent sound of a bandura drifted out. A few students in new, albeit drab but clean, school uniforms were gathered, laughing and discussing something, no longer whispering. Even the old beggar at the street corner had a few more coins in his can today.\nYuri walked to the Dnieper, leaning on the half-repaired granite railing. The river flowed silently in the night, the lights from the opposite bank reflecting on the water, shattered into a million golden scales. The air was filled with the river's dampness and the scent of freshly turned earth, free of the smell of gunpowder and the pervasive iron tang of fear that had lingered for years.\nHe remembered his grandmother's dying words, when he was just a child and didn't quite understand. Grandma held his hand, her cloudy eyes gazing at the ceiling, whispering in her thick Ukrainian accent: “Yurik, child… home, is home… no matter how many times it’s trampled, how many bowls are broken… as long as the roots are in the soil, it will always… grow back…”\nA girl in similar work clothes, her face equally tired but with a different kind of radiance, walked past him carrying a basket. Seeing him, she smiled a little shyly and quickened her pace. Yuri watched her figure disappear at the end of the dim streetlight.\nHe suddenly understood his grandmother's words. This land, this city, these people speaking with the same Kyiv accent as him—no matter how much suffering they had endured, no matter how many identities had been imposed upon them—this was home. Now, it seemed someone had finally remembered to sweep the courtyard, mend the roof, and make this home feel like a home again.\nThe road to reconstruction was long and arduous; his father's skepticism might still hold true. But tonight, standing by this timeless river, watching that awakening expanse of their lights, Yuri felt for the first time, truly, that they weren't just patching a hole, but re-embracing a scarred, yet finally warming, home. This was their time, a time to rediscover themselves.\nHe pulled the last crumpled cigarette from his pocket, hesitated, then put it back. Perhaps, he thought, it was time to quit some old habits too."
 SWRW_RUS.29.a:0 "This time, the river embraces both banks."
 SWRW_RUS.30.t:0 "Bayan Music and Mutton Soup in the Barracks"
 SWRW_RUS.30.d:0 "Night fell, and in a workers' barracks at a large reconstruction site on the outskirts of Moscow, the dim glow of a kerosene lamp barely dispelled the shadows in the corners, yet it couldn't drive away the pervasive smell of sweat, tobacco, and some rich food. In the center of the barracks, on a makeshift table cobbled together from several wooden crates, sat a large, steaming iron pot. Inside, potatoes and a few precious pieces of mutton tumbled, the source of the rich aroma.\nFour men of different complexions and accents sat around it, their faces etched with the day's fatigue, yet radiating a rare sense of relaxation.\n“Ivan, your skill is still unmatched, these potatoes are melting in my mouth!” said Rustam, a Tatar man, praising Ivan indistinctly as he chewed on a potato, a thumbs-up gesture punctuating his words.\nIvan, a typical robust Russian, grinned, revealing a few teeth yellowed by smoke. “Of course, look who cooked it! But Rustam, this mutton is your credit. If it weren't for your connections, getting this good stuff from our ‘Southern comrades,’ we’d be eat dry bread and cold water tonight.”\n“Hey, this is called resource integration, understand? Taras here got us good firewood, Giorgi exchanged for salt… We all chip in, that’s how we get by.” Rustam patted his chest, then pointed to the quietly smiling Ukrainian lad Taras, and to Giorgi, a Georgian, who was carefully carving something with a small knife.\nTaras smiled shyly and picked up the old bayan accordion beside him, testing a few notes. “So… shall I play a tune? To liven things up?”\n“Play! You must play!” Ivan waved his hand grandly. “Play ‘Katyusha,’ but make it cheerful, don’t play it like a funeral dirge!”\nMelodious notes filled the air. Though the accordion was somewhat out of tune and the player’s skill was far from exquisite, in this humble barracks, it sounded exceptionally moving. Giorgi stopped his work—he was carving a pair of small wooden figures, seemingly a couple dancing the Lezginka. He picked up a coarse earthenware bowl, filled it with mutton soup, and then filled bowls for the others one by one.\n“To…” Giorgi raised his bowl, his deep-set eyes twinkling in the lamplight. “To us still being able to sit together and drink soup, to this damned war finally being over, to us still being able to rebuild this land with our own hands… no matter where we come from.”\n“To being alive!” Ivan roared, clinking his bowl first.\n“To peace!” Rustam followed suit.\n“To home…” Taras said softly, the music never stopping.\nFour rough bowls clinked together with a dull thud, mingling with the melody of the bayan and the gurgling of the mutton soup in the pot. They came from different corners, spoke different dialects, worshipped different gods, and in chaotic times, had even suspected or fought each other. But now, on this ravaged yet revitalizing land, before a pot of hot mutton soup and an out-of-tune song, they were first and foremost workmates, brothers, people who moved bricks together for tomorrow. The road to reconstruction was long, longer than the Volga, but at least tonight, they had hot soup, music, and each other."
 SWRW_RUS.30.a:0 "Down this hot soup, and tomorrow we continue!"
 SWRW_RUS.31.t:0 "Tides and Ink"
 SWRW_RUS.31.d:0 "The air in Riga's port was thick with the smell of sea salt, diesel, and an inescapable dust of the past. Antonov, a young planner dispatched from Moscow, stood in the biting sea breeze, trying to pin a huge blueprint titled “Baltic Coast Reconstruction Zone – Phase One” onto several rusty oil drums. The wind was uncooperative, and a corner of the blueprint flapped noisily, like a flag unwilling to surrender.\nNearby, several Latvian dockworkers silently moved bags of cement unloaded from a cargo ship that looked as old as Antonov's grandfather. Their gazes passed over Antonov and his blueprint, out towards the grey Baltic Sea, their expressions complex and indecipherable, like the unpredictable weather of this region.\nAntonov knew how magnificent this plan was—new quays, modernized warehouses, efficient railway connections… The lines on the blueprint were neat, precise, filled with a rational beauty. But the reality was: the quays were pockmarked with war craters, warehouse roofs had either collapsed or were mere skeletons, and the only thing that looked reasonably sturdy was a concrete bunker built by the Germans, now a canvas for children's graffiti and a playground. The “skilled workforce” mentioned in the plan was currently communicating in a peculiar mix of Latvian, Russian, and German, and their efficiency… well, one could say it was full of improvisational artistry.\nHe sighed, using a stone to weigh down the unruly corner of the blueprint. This reconstruction plan was like this blueprint: beautiful, grand, but also fragile, liable to be blown detalhes by the harsh winds of reality at any moment."
 SWRW_RUS.31.a:0 "Where the ink dries, reality only begins to develop."
 SWRW_RUS.32.t:0 "Thawing Words"
 SWRW_RUS.32.d:0 "Tallinn, the cobblestone streets glistening with a damp chill after the rain. Irma, an old woman who had worked in a tailor shop for most of her life, was carefully climbing a creaking wooden ladder to her cluttered, almost forgotten attic. Outside, the laughter of children chasing each other mingled with the intermittent sounds of hammering from a distant construction site—these were sounds that had only recently reappeared in the city. In the past, children wouldn't laugh so loudly, and adults' footsteps were always hurried and cautious.\nForty years is long enough for fear to seep into the bones, to become an instinct. Irma remembered the men in grey uniforms, speaking harsh German, patrolling the streets; the dead silence of curfewed streets and occasional gunshots; neighbors disappearing silently, never to return; the forbidden books, forbidden songs, forbidden language whispered. Estonia's soul seemed frozen in amber, heavy and transparent.\nUnder an old leather suitcase in the attic, she found a small booklet wrapped in oilcloth. Unwrapping it revealed a yellowed, brittle poetry collection, its cover bearing the name of a national poet she had admired in her youth—a name no one had dared to mention publicly for decades. Her fingers trembled as she caressed the lead-printed words, the words that had sustained her through the long dark nights, the verses that sang of forests, seas, and freedom.\nShe sat on the dusty floor, reading silently by the dim light filtering through the small attic window. She read slowly, as if relearning each word, each syllable awakening dormant memories. She seemed to see her younger self again, reciting these poems with friends on the university lawn, the sky then seeming particularly blue, the possibilities of the future as expansive as summer clouds.\nLater… later everything changed. Friends either went into exile, fell silent, or disappeared. Only this poetry collection, like a tenacious seed, had endured the long winter in the dark soil.\nFrom downstairs came her granddaughter Lina's voice: “Grandma! Dinner's ready! What are you looking for up there?”\nIrma carefully closed the poetry book, rewrapped it in oilcloth, and hid it back under the suitcase. She stood up, brushing dust from her clothes. “Nothing, child,” she called towards the staircase, her voice a little hoarse, but warmer than before, “Just found some… old things.” She descended the stairs; outside, the sky had darkened, and lights flickered on at the distant construction site. Some wounds might never fully heal, but at least, frozen words were finally beginning to thaw quietly in her heart."
 SWRW_RUS.32.a:0 "Memories are like seeds, waiting for spring."
 SWRW_RUS.33.t:0 "The Sea Heeds No Reports"
 SWRW_RUS.33.d:0 "Murmansk dawn, carrying a salty and biting tang. Old fisherman Stepan and his two sons were struggling to haul a heavy fishing net onto their weather-beaten trawler, the 'Victory.' In the net, silver cod and a few struggling flounders thrashed about on deck. This was their catch from an entire night's work—not abundant, but enough to give the family hope, and much better than the days of sneaking out to sea during the war, terrified of German patrol boats.\n\n“Dad! Look at this one! It’s fat!” Youngest son Volodya excitedly held up a large, wriggling flounder, his face red from the cold, yet beaming with the joy of the catch.\n\nStepan nodded, spitting out the cigarette butt he was chewing. “Don’t dawdle, sort and pack them quickly. That uniformed小子 from the port authority will be here soon.” The 'uniformed小子' he referred to was the new government’s fisheries representative, a young man with glasses, who spoke in a bookish manner and always carried a folder full of numbers.\n\nSure enough, as soon as the boat docked, the young man appeared, followed by two rifle-carrying soldiers—a presence that made the other fishermen on the quay somewhat nervous. “Comrade Stepan Nikolayevich,” the young man pushed up his glasses and opened his folder, “According to the ‘Five-Year Plan for Sustainable Development of Northern Fisheries and Productivity Enhancement,’ your catch quota for today is… hmm… three hundred kilograms. Please cooperate with the inspection.”\n\nStepan glanced at the fish piled on deck, then at the form in the young man’s hand. A wry smile touched his swarthy face. “Comrade, you see, the wind was wrong today, the schools didn’t come. We worked all night and only got…”\n\n“Regulations are regulations, Comrade Stepan.” The young man interrupted him, his tone brooks no argument, though a hint of helplessness seemed to flicker in his eyes. “The plan requires precise data. Everyone must meet their targets. This is for the state, for the overall benefit.” He pointed to the distant cold storage warehouses and processing plants under construction. “Think about it, in the future, our fish can be transported to Moscow, to even farther places! Everyone will be able to eat fish!”\n\nStepan didn’t argue further. He silently worked with his sons to weigh and register the catch. Three hundred kilograms was the quota; they had achieved less than half of that today. The young man meticulously recorded the numbers, made a few checkmarks in his notebook, reminded them they had to “double their efforts” tomorrow, and then left with the soldiers.\n\nElder son Dmitry grumbled under his breath, “Dad, what kind of nonsense is this? The sea isn’t a factory; it can’t produce fish according to a plan.”\n\nStepan patted his son’s shoulder, picked up a torn net, and began expertly mending it. “The sea heeds no reports, son,” he said calmly, gazing at the churning grey waves of the Barents Sea. “It only gives what it’s willing to give. As for us, we just take it, mend our nets, and go out again tomorrow.” Sunlight pierced through the clouds, falling on the patched net and on the old man’s wrinkled face, reflecting a calmness that was neither joyous nor desperate."
 SWRW_RUS.33.a:0 "Tomorrow, the nets must still be cast into the sea."
 SWRW_RUS.34.t:0 "Forest Echoes"
 SWRW_RUS.34.d:0 "Static crackled from the radio as Lieutenant Sergeyev stubbed out his cigarette on the damp moss. The order was brief, cold, like the late autumn rain in Latvia: “Order: Sector 7-G, execute ‘Forest Combing’ operation. Known hostile armed unit, codename ‘Fox,’ active in the area. Objective: Search and clear. Repeat, search and clear. Over.”\nHere we go again. Sergeyev cursed inwardly but made no sound. The so-called 'Forest Brothers,' a fine name for a bunch of ghosts hiding in the woods. Sometimes they ambushed supply lines like real soldiers, other times they harassed villages like bandits. They knew this forest like a bear knows its den. And Sergeyev and his men, mostly greenhorns from the Volga steppes or Ural mining towns, had less sense of direction in this labyrinthine forest than a startled elk.\n“Boss,” Sergeant Major Petrovich sidled up, handing him a canteen filled with watered-down spirits, “Chasing ‘Foxes’ again? That ‘Badger’ last time gave us a hell of a run, and we lost two good men.” Petrovich was a veteran, his face etched with the annals of war, his eyes holding a world-weary fatigue.\n“Orders are orders, old Pet.” Sergeyev took a swig, the fiery liquid burning his throat. “The higher-ups said the Baltics must be ‘thoroughly stabilized.’ These ‘brothers’ in the woods are the last nails; they have to be pulled out.”\n“Stabilized?” Petrovich scoffed. “Pull out the nails, and there are still stones in the earth. We drove out the Germans, but to them, we’re occupiers too, just with different insignia. This job… it has no end.”\nSergeyev fell silent. He knew Petrovich was right. They had won the Great Patriotic War, driven the Nazis back to their homeland, but the ghost of war seemed to linger, merely changing its face, hiding in this gloomy forest. Each 'combing' felt like fighting his own shadow—exhausting, bloody, and never knowing when a cold shot might come from some tree hollow.\n“Check your gear! Move out in five!” Sergeyev shouted to his men, his voice echoing in the empty woods. “All of you, damn it, stay alert! Don’t let the forest mosquitoes suck you dry!” He tried to dispel the pervading gloom with coarse humor, but to little effect. The soldiers silently checked their weapons, their eyes vacant.\nMaybe this time they’d catch that damned 'Fox,' Sergeyev thought. Maybe this time fewer men would die. Maybe… He stopped thinking, just tightened his pack straps and was the first to step into the ever-thickening depths of the forest."
 SWRW_RUS.34.a:0 "Deep in the forest, only the wind answers."
 SWRW_RUS.35.t:0 "Embers in the Wolf's Den"
 SWRW_RUS.35.d:0 "“Target confirmed, coordinates Delta-9, enemy strongpoint, suspected 'Werewolf' remnant nest. Requesting artillery support, repeat, requesting artillery support. Over.” Second Lieutenant Kostya reported calmly into the radio, his voice devoid of any tremor, as if he were announcing today's lunch menu. He lay prone behind the ruins of a bombed-out farmhouse, flanked by several equally calm soldiers, observing a distant, well-camouflaged bunker through binoculars.\n\n'Werewolves'—the mess left behind by the Germans, a motley crew of diehard Nazis, local collaborators, or simply brainwashed fanatics. They weren't as elusive as the 'Forest Brothers,' but far more frenzied and cruel. Their attacks were often without warning and exceedingly vicious, leaving only scorched earth and dismembered corpses. Dealing with them involved no negotiation, no mercy, only complete 'zeroing out.'\n\nA few minutes later, a dull roar emanated from the distant artillery positions. Seconds later, a piercing shriek approached from afar, and the earth began to tremble. Orange fireballs erupted around the bunker, sending thick smoke and dust skyward. Kostya lowered his binoculars, rubbing his ears, which were numb from the concussion.\n\n“Fire mission complete. Alpha team, prepare to mop up. Beta team, flank cover. Maintain communications, watch for crossfire. Advance!” Kostya issued commands via his throat mic. The soldiers skillfully provided covering fire for each other, rapidly advancing towards the still-smoking target area.\n\nThe entry into the bunker was smoother than expected; resistance was minimal. The interior reeked of gunpowder, blood, and a nauseating stench of decay. Swastikas and unintelligible slogans were scrawled on the walls. In a corner, a few crates of German-made ammunition and canned food were piled next to several charred or dismembered bodies; SS collar tabs could still be faintly discerned on their tattered uniforms.\n\nA soldier kicked open a rickety iron door. Inside, a shockingly young, blond boy cowered in a corner, clutching a MP40 with a broken stock. Seeing the soldiers rush in, he let out an inhuman scream and tried to raise the useless weapon.\n\n“Target neutralized,” an old soldier’s voice sounded, accompanied by a crisp gunshot.\n\nKostya didn’t go in to look. He just stood at the entrance for a moment, listening to the sounds of searching and clearing from within. “Report to HQ, 'Siren' nest has been cleared, conducting battlefield assessment. Over.” He picked up the radio again, his voice still calm. The war was over, but cleaning up the garbage it left behind felt like an endless chore. He felt an inexplicable weariness, more profound than after a three-day forced march."
 SWRW_RUS.35.a:0 "Beneath the ashes, embers always remain."
 SWRW_RUS.36.t:0 "Familiar Strangers at the Street Corner"
 SWRW_RUS.36.d:0 "Anna Petrovna, carrying a tray of freshly baked rye bread, stood somewhat hesitantly at her neighbor's door. She had lived in this apartment building in Vilnius's Old Town for nearly thirty years. Neighbors had come and gone: pre-war Lithuanians, Soviet-era Russian cadres, German officers' families during the occupation... Now, a new Russian family had moved in; the husband was said to be an engineer transferred from Siberia.\nThe stairwell smelled of familiar borscht, mixed with the scent of newly painted walls. Anna took a deep breath and knocked. A woman her own age opened the door, her face etched with the weariness of a long journey and a hint of不易察觉 nervousness. “Hello,” Anna said in somewhat rusty but still fluent Russian, “I'm Anna, from next door. Welcome to the neighborhood. This is freshly baked bread, please try some.”\nThe hostess was momentarily愣住, then a grateful smile spread across her face. “Oh, thank you so much, Anna Petrovna! Please come in, come in! I'm Natasha, and this is my husband, Ivan.” A middle-aged man, similarly weathered by hardship, emerged from inside, awkwardly wiping oil stains from his hands.\nThe room was simple, sparsely furnished, but tidily kept. A brand-new map hung on the wall, with several place names circled in red: Moscow, Leningrad, and Omsk, the city they had just left. “You must have had a tiring journey,” Anna said, placing the bread on the table, “Coming from so far away.”\n“Yes,” Ivan sighed. “We packed up and left as soon as we got the transfer orders. They said engineers were needed here, for… for reconstruction.” He looked out the window at the familiar church spires and the slightly unfamiliar streets. “Vilnius is a good place, it’s just… a bit different.”\nAnna understood what he meant. For old residents like her, the city changed its face under different flags, each time meaning a redefinition of identity. And for ‘newcomers’ like Ivan and Natasha, they were both builders sent by the victors and strangers needing to put down new roots in this land. Russian was being taught in schools again, street signs had been changed, and newspapers daily propagandized the “great Russian family of nations” and “brotherly friendship.” Yet the Lithuanian old lady selling flowers downstairs looked at her much the same way she had looked at the German occupiers.\n“It will be alright,” Anna said softly, unsure if she was comforting her new neighbors or herself. “Slowly, everyone has to learn to live again.”\nNatasha poured her a cup of hot tea. “I hope so,” she said in a low voice. “The children really like the park here.”\nPerhaps that was where hope lay, Anna thought. Children’s worlds were always simpler. Maybe their generation could truly find a new identity on this ancient land, one belonging to Russians and to everyone, unburdened by the heavy baggage of the past."
 SWRW_RUS.36.a:0 "Time either dilutes everything or deepens the scars."
 SWRW_RUS.37.t:0 "Leaflets in the Wind"
 SWRW_RUS.37.d:0 "Maris, a tram conductor in Riga, was listlessly watching the familiar streetscape outside his window. A light rain had just fallen, freshening the air, and the leaves of the chestnut trees lining the street were a vibrant green. The tram clanged past Freedom Monument Square—the statue symbolizing Latvian independence, which, after being defaced and restored under various regimes, now stood in its original form again, albeit with a few indelible scars on its base.\nThis morning, new propaganda posters had appeared all over the city. Their style was bright, their colors vivid, a stark contrast to the gloomy, oppressive German posters or the stiff, formulaic Soviet slogans of the past. One poster depicted a blonde girl and a dark-haired boy holding hands, running through a sunlit wheat field, with the new Russian flag and the Kremlin's spires in the background. Another showed workers and peasants (their attire quite local in character) smiling broadly, holding hammers, sickles, and gears, with the slogan: “You are a citizen of a free country! Let us build a prosperous homeland together!”\nThe tram reached a stop, and several workers, just off their shift, boarded. They grumbled about new factory regulations while quietly discussing the new posters. “Freedom? Whose freedom?” an older worker muttered. “The Germans left, the Russians came again. Same soup, different bowl.”\n“But it’s different this time, isn’t it?” a younger one countered. “I hear we’ll be able to elect our own mayor, and the newspapers can even criticize bureaucrats a bit.”\n“Sounds good,” the old man shook his head. “Let’s see when it actually happens. Freedom, that’s not something you get just by pasting up a few pictures.”\nMaris listened silently, not interjecting. He had experienced too many ‘liberations.’ The Soviets came, saying they were liberating them from the bourgeoisie. The Germans came, saying they were liberating them from the Bolsheviks. Now, new Russians had come, saying they were “citizens of a free country.” What color was freedom, really? Was it the bright, vivid color of the posters, or was it like his own faded, washed-out old uniform—grey, and tinged with an unspoken weariness?\nA gust of wind blew, and a few leaflets, from who knows where, landed on the tram tracks. They bore slogans similar to the posters, along with some clauses about new civic rights and duties. Maris watched them get run over by the wheels, turning into a blurred pulp. Perhaps, this time it really was different? Perhaps freedom wasn't just a color, but the right, after everything, to show even a little bit of green, like the chestnut leaves outside his window now? He didn't know. He could only, as usual, pull the cord to signal departure and continue his daily routine."
 SWRW_RUS.37.a:0 "The sky before dawn is always the most confusing."
 SWRW_RUS.38.t:0 "Preliminary Assessment Report on the Industrial Status of the Baltic Coastal Region"
 SWRW_RUS.38.d:0 "To: Responsible Comrades, Baltic Coastal Provisional Administrative Committee\nFrom: Kovalev, Section Two, Regional Economic Development Department, Central Planning Bureau\nSubject: Preliminary Assessment of Industrial Potential in Your Region and Subsequent Work Directives\nComrades,\n\nThe preliminary assessment report on the industrial facilities in your region has been received. After initial study by our bureau, the relevant spirit is conveyed as follows:\n\nThe assessment team's report indicates that the region possesses certain industrial potential, particularly in port transshipment and some heavy industries left behind or modified by the Germans. This is largely consistent with the Central Committee's expectations. However, it must be clearly recognized that severe war damage, outdated technology, labor shortages, and chaotic standards are also prominent issues. These are serious obstacles hindering the region's integration into the overall national economic plan. Overcoming these obstacles is your committee's current overriding task.\n\nThe Central Committee expects you to, with a high degree of revolutionary enthusiasm and a pragmatic attitude, immediately begin repairing key infrastructure (especially the ports of Riga, Tallinn, Klaipėda, and railway lines), rectifying the labor force and submitting skill assessment data, and standardizing production, to lay a solid foundation for subsequent larger-scale investment and construction. Regarding specific investment directions and resource allocation, the Central Committee will make unified arrangements based on the detailed plan you submit next and the overall national needs.\n\nDo not wait or rely on others; take a proactive stance. Subsequent instructions will be issued separately."
 SWRW_RUS.38.a:0 "For the great reconstruction. Central Planning Bureau, Kovalev"
 SWRW_RUS.39.t:0 "Gears and Amber"
 SWRW_RUS.39.d:0 "The former 'Radiotehnika' factory, once the pride of Riga, had transformed into a larger, noisier, and somehow… stranger behemoth. The vast workshops were expanded, swallowing several nearby alleys and a defunct amber workshop. Towering chimneys tirelessly belched thick smoke, dyeing the sky an industrial grey. On the assembly lines, conveyor belts ran ceaselessly, emitting a monotonous, deafening hum. The air reeked of machine oil, solder, and sweat.\n\nAldis, an old artisan who had crafted amber jewelry for generations, was now an assembly worker on one of these lines. His once nimble fingers, capable of polishing a rough piece of amber into a translucent work of art, now fumbled to press standardized plastic knobs into equally standardized radio casings. The movements were repetitive, mechanical, as if he himself had become part of the machine.\n\n“Hurry up, Aldis! Don’t fiddle around like a sissy!” the foreman bellowed, a burly Russian with a thick accent. “This batch is due in Voronezh this afternoon! If we don’t meet the quota, nobody gets a bonus!”\n\nAldis sighed and quickened his pace. He didn’t miss the past; under German rule, his small workshop had long since closed. Survival was enough. Now, at least, there was work, a fixed ration of black bread, and occasional dried fish. But as he looked at the identical radio casings on the assembly line, he always felt something was missing. The amber pieces he once meticulously carved, each with its unique pattern and luster, were like individual souls. Now, everything was standardized, centralized, for efficiency, for that grand 'Plan.'\n\nDuring his lunch break, he secretly took out a small piece of unsubmitted rough amber from his pocket, gently caressing its warm surface with his fingertips. Sunlight, filtering through the grimy window, seemed to ignite a tiny golden spark within the small piece of amber, a remnant of a bygone era."
 SWRW_RUS.39.a:0 "A gear might turn the world, but it cannot polish the soul's luster."
 SWRW_RUS.40.t:0 "Red Lines on the Sea Chart"
 SWRW_RUS.40.d:0 "The 'Victory' dropped anchor fifteen nautical miles offshore. Captain Stepan spat out his cigarette butt and squinted at the horizon. The weather was good today; seagulls circled overhead, a sign of possible fish schools. But his brow was furrowed.\n“Dad, we can’t go any further west,” elder son Dmitry said, pointing to a brand-new sea chart with red dashed lines. “Look, this is the new boundary of the ‘Third Fishing Zone.’ Any further and we’re in the Second Zone, and we don’t have a permit for that.”\nStepan snorted but said nothing. He had fished these waters his whole life. When did he ever need someone to tell him with red lines where the fish were and where they weren’t? Fish don’t read maps! But now, everything had changed. New regulations, new zonal demarcations, and those inspectors in their brand-new patrol boats, dressed in crisp uniforms, constantly scribbling in their notebooks. They said it was for “scientific management,” “sustainable development,” for the “national interest.”\n“But old Jonas said yesterday there were fish aplenty in the Second Zone, like rain!” younger son Volodya chimed in. “They hauled in a full net yesterday!”\n“Shut up, Volodya!” Dmitry glared at him. “Do you want the inspectors to impound our boat? Old Anders’ boat crossed the line just a little last time and got fined a hefty sum!”\nStepan sighed and picked up his binoculars, fruitlessly scanning the grey expanse of the sea. The sea was still the same sea, churning for decades, merciless and generous. Only now, there were many invisible lines on its surface, and visible grey patrol boats crisscrossing. He didn’t know if these red lines and forms would increase the catch, but he knew freedom had diminished. He waved his hand: “Haul in the nets. Let’s see what luck we have today.” The nets were slowly winched up, containing only a few small fish and a mass of slimy seaweed."
 SWRW_RUS.40.a:0 "The sea remains silent, but the rules ashore have multiplied."
 SWRW_RUS.41.t:0 "Sighs in the Canteen"
 SWRW_RUS.41.d:0 "Thursday, 'Weekly Fish Day' again. The communal canteen of Tallinn's Twelfth Textile Factory reeked of a strong, indescribable fishy smell, mixed with the bland aroma of boiled potatoes. Canteen cook Ilena was listlessly stirring a large pot of murky, viscous 'fish soup' with a huge ladle, in which floated a few suspicious white fish chunks and grey potato pieces.\n\n“Aunt Ilena, could the fish soup today… er… have a bit more salt?” a young female worker asked cautiously, holding her tray.\nIlena, her face smudged with grease and sweat, managed a wry smile. “Silly girl, salt is also rationed according to the plan! Besides, no matter how much salt you add, this fish will taste the same.” She was referring to the mountains of frozen cod blocks piled in the warehouse—supposedly “the fruits of over-fulfilled tasks by comrades in the Northern Fisheries Zone.” Fresh they were, but that persistent sea-fish smell, no amount of cooking could get rid of it.\n\nA propaganda poster hung on the wall, depicting a beaming chef (in a chef’s uniform a hundred times cleaner than Ilena’s) holding a platter of seemingly golden-crisp fried fish garnished with lemon slices. The slogan beside it read: “Fish is nutritious, aiding national construction!” Workers queued silently, taking their portions of the fish soup and black bread, which bore no resemblance to the poster. Some were expressionless, some frowned, and others tried to hide the fish chunks with their black bread, drinking only the watery soup.\n\n“Back in the day,” an old worker in the corner said softly to his companion, while blowing on his scalding fish soup, “right after the war, having anything to eat was good enough. Now, at least we get ‘meat’ weekly, even if it’s fish…” He paused, prodding a piece of mushy fish in his bowl with his spoon. “Just don’t know if this fish came from the Baltic Sea, or from some planning committee’s head.” This drew a suppressed chuckle from his companion. Ilena heard it, merely shook her head, and continued stirring the large pot of fish soup, which carried both the national plan and the workers’ stomach acid."
 SWRW_RUS.41.a:0 "The plan fills the stomach, but not the palate."
 SWRW_RUS.42.t:0 "Seaside Sanatorium"
 SWRW_RUS.42.d:0 "Jūrmala beach, fine sand, green pine forests, a cool sea breeze. Valentin, a model tractor driver from Ryazan Oblast, stood somewhat awkwardly by the sea in brand-new, ill-fitting beach shorts. It was his first time seeing the sea, and his first time receiving a unit-awarded “Ten-Day Trip to the Baltic Seaside Sanatorium.” The brochure said it was a “workers’ paradise, a haven for physical and mental relaxation.”\n\nThe sanatorium itself was an imposing building in the Soviet neoclassical style, formerly a holiday villa for high-ranking German officers, it was said. The rooms were clean and tidy, and the food was much better than the factory canteen. Mornings were scheduled with gymnastics and “health lectures,” and afternoons could be spent strolling by the sea or participating in organized volleyball matches. Everything was orderly, filled with “organized care.”\n\nOnly… Valentin always felt something was amiss. Apart from them—the “advanced workers” from various places and their families—there were hardly any locals on the beach. Occasionally, a few Latvian children played in the distance, eyeing this group of “tourists” in uniform sanatorium attire with a mixture of curiosity and detachment. The shops had few goods, yet prices were not cheap, and the shopkeepers’ attitudes were hardly enthusiastic. Traces of hastily painted-over German slogans could still be seen on the sanatorium walls.\n\nAt night, he drank home-brought vodka with Ivan, a miner from Kursk, who shared his room. “Old Ivan,” Valentin said, looking out at the dark sea, “do you think this place is really as good as the posters say? I always feel… it’s a bit desolate.”\n\nIvan, after a drunken burp, exhaled a smoke ring. “Good or not, isn’t it all a state benefit? Free food and lodging, and we get to see the sea. Much better than being down in the mines. As for desolate…哼, the Germans only left a few years ago, it’s good enough that it’s recovered this much. Wait a few years, when we’ve completely rebuilt it, then it’ll be a real paradise!” He clapped Valentin firmly on the shoulder. “Don’t think so much, come, drink! To health! To the motherland!”\n\nValentin raised his glass and clinked it with Ivan’s. Perhaps Ivan was right; he should enjoy this rare holiday and not overthink. But gazing at the vast, silent Baltic Sea shimmering silver under the moonlight, he couldn’t help wondering, what was this sea like in the memories of the local people?"
 SWRW_RUS.42.a:0 "Footprints on the sand, of varying depths."
 SWRW_RUS.43.t:0 "Shadows in the Black Cat Café"
 SWRW_RUS.43.d:0 "The cobblestone streets of Riga's Old Town had been newly repaired, and the medieval buildings lining them had their facades carefully restored, adorned with fresh bilingual street signs in Russian and Latvian. In the newly opened 'Black Cat Café,' under soft lighting, several young people conversed in low tones, the air filled with the aroma of coffee and a faint scent of tobacco. A few modernist paintings (approved by the cultural department) hung on the walls, and a gramophone in the corner played a melodious Soviet light music piece. Everything seemed so calm, orderly, and full of hope for a new life.\n\nYelena, a freshman studying history at Riga University, sat by the window with her classmate Andris. Yelena was from Moscow, full of curiosity about this ancient city imbued with exotic charm. Andris was a local; his grandfather had once been a famous lawyer in the city.\n\n“It’s incredible, isn’t it, how quickly things have changed?” Yelena mused, stirring her coffee. “Before I came, I saw photos, and this place was all rubble.”\n\n“Yes, they work fast,” Andris said softly, his gaze sweeping over the ‘excessively’ perfect guildhall outside the window. “It’s like magic, covering up all the old scars.”\n\n“Isn’t that good?” Yelena asked, puzzled. “Saying goodbye to the past, welcoming the future, that’s what we should be doing.”\n\nAndris fell silent for a moment, taking a sip of his coffee. “Perhaps. It’s just that sometimes, I feel they’re covering up more than just scars.” He lowered his voice. “Did you know? This café used to be a German security service outpost. The basement… many bad things happened there.” He pointed to an inconspicuous vent in the corner. “A friend of my grandfather, a poet, was taken from here and never came back.”\n\nYelena followed his gaze to the smooth wall and a brightly colored landscape painting. That cheerful Soviet music continued its tireless loop. She suddenly found the coffee a bit off-tasting. This revitalized city, like a meticulously dressed beauty, was beautiful yet carried an imperceptible chill. The erased histories, the concealed memories, had they truly vanished? Or did they, like the shadows in the basement, still lurk beneath this glamorous surface?"
 SWRW_RUS.43.a:0 "Beneath new paint, old marks still whisper."
 SWRW_RUS.44.t:0 "Beach Umbrellas on the Sand"
 SWRW_RUS.44.d:0 "On Jūrmala beach, a few new, brightly colored beach umbrellas were sporadically set up. Beneath them sat tourists, mostly model workers from inland Russian factories and their families, dressed in unaccustomed swimwear, their skin slightly sunburned, faces alight with novelty and a touch of reserve. Seagulls circled overhead, their familiar, long calls echoing.\n\nAnna, an old Latvian woman selling homemade amber bracelets and shell trinkets at a beach stall, silently arranged her wares as she watched the scene. These tourists were different from the German officers of wartime, and different too from the匆匆 Soviet commissars of the early days. They awkwardly learned to enjoy the sun and sea breeze, cautiously exchanged rubles for the not-so-exquisite souvenirs at her stall, and even offered thanks in broken Latvian.\n\nThe aroma of coffee wafted from the newly opened state-run café nearby, where several uniformed waiters were wiping the windows. In the distance, the clanging sounds of construction could be heard; a larger sanatorium, capable of hosting foreign friends, was supposedly being built.\n\n“Everything is getting better, isn’t it?” the uncle selling smoked fish at the next stall whispered to Anna in Latvian. Anna nodded, looking at a little Russian girl excitedly picking up a seashell, then at the distant grey-blue Baltic Sea. Yes, at least there were umbrellas on the beach now, and the laughter of tourists, instead of barbed wire and the boot prints of patrolmen. That was enough, for now."
 SWRW_RUS.44.a:0 "Under the sun, some things are quietly growing."
 SWRW_RUS.45.t:0 "A Sailor's Dream"
 SWRW_RUS.45.d:0 "The port, like an awakened giant, throbbed with the clang of steel, the roar of machinery, and the resonant shanties of sailors. Sixteen-year-old Mikhail, newly arrived from an inland village to report to this sprawling base in Tallinn, stared wide-eyed. He had never seen so many ships—though most looked rust-eaten, some still in dry dock being hammered and banged, like patients awaiting some mysterious surgery. But he also saw several new, grey-painted patrol boats cruising the harbor, and in the distance, a massive gantry crane, supposedly capable of building submarines, was under construction.\n\n“New kid, eh?” an old sailor, polishing a deck gun, grinned at his bewildered look, revealing tobacco-stained teeth. “Don’t just stand there gawking. Report to your political commissar. Be late, and you’ll get your arse kicked!”\n\n“Yes, Comrade!” Mikhail saluted, somewhat awkwardly but with enthusiasm. “I… I came to be a sailor! I want to be on the biggest ship! To defend our coastline!”\n\nThe old sailor’s smile faded slightly. He patted Mikhail’s thin shoulder. “Good lad, got ambition. But the navy ain’t just about standing on deck admiring the view. First, learn how to polish this damned brass cannon until it reflects your silly face.” He pointed to a nearby pile of potatoes. “Or go help in the galley first, tonight’s dinner depends on you.”\n\nMikhail wasn’t discouraged in the least. To wear this blue-and-white striped sailor’s shirt, to breathe this air thick with sea salt and machine oil, to see these steel behemoths representing national power—he was already content. He imagined himself standing on a mighty warship, riding the waves, sending any daring enemy to the bottom of the sea. Yes, that was his dream! Even if it started with peeling potatoes, he would set sail!"
 SWRW_RUS.45.a:0 "The sea is calling, in the name of steel and steam."
 SWRW_RUS.46.t:0 "Conversation on a Park Bench"
 SWRW_RUS.46.d:0 "The evening glow gilded the park next to Riga's Freedom Square with a warm golden hue. Two figures, a man and a woman, no longer young, sat side by side on a bench, silently watching children chase each other by the fountain, their laughter like silver bells. New streetlights had come on, illuminating the freshly paved paths and neatly trimmed flowerbeds. The clanging of a passing tram and faint radio music from a distant window drifted through the air.\n\n“Big changes, aren't there?” he spoke first, his voice somewhat hoarse, like an old, unused bellows. “Remember what it used to be like here? Curfews, patrols, and…” He paused, not continuing.\n\n“I remember,” she said softly, her gaze fixed on the tall Freedom Monument in the center of the square, its surface showing faint traces of repair. “Back then, the sky was always grey, even children didn't dare laugh out loud.” She pulled her scarf tighter, though the weather wasn't particularly cold. “It's better now, look at those children, how joyfully they run.”\n\n“Yes, at least we're not starving. There are more things in the shops too, though you still have to queue.” He took a cigarette pack from his pocket, hesitated, then put it back. “I hear wages are going up again next month, for engineers and technicians.”\n\n“Mm-hmm,” she responded. “My son works at that new factory. He says it's very busy, but the pay is decent.”\n\nThey fell silent again, only the children's laughter and the distant city bustle flowing in the air. A breeze blew, carrying a hint of early autumn coolness.\n\n“Do you think… if Alexei could see it now, what would he think?” he suddenly asked, his voice much lower.\n\nHer body trembled almost imperceptibly. Her gaze, fixed on the distance, became somewhat misty. “He… he always said, one day it would be better. One day, we could sing freely in the square, without fear of prying ears.” Her eyes welled up, but she fought back the tears. “He waited his whole life…”\n\nHe too fell silent. He took out the cigarette pack again, this time lighting one, taking a deep drag. The smoke slowly dissipated in the golden twilight. The children continued to laugh and play, the tram continued to clang, and life seemed to be flowing towards a better direction, with an almost dull resilience.\n\nHe looked at this companion beside him, so familiar yet somewhat strange. Decades of hardship had etched similar lines on their faces, and also separated them with too many unspoken stories.\n\n“By the way,” he suddenly spoke, with a hint of bewilderment, “did we… know each other before? Who were you again?”\n\nShe turned her head, tears finally sliding silently down her cheeks, yet her face wore a smile of release, a smile that held infinite."
 SWRW_RUS.46.a:0 "A name, and us, who lived on."
 SWRW_RUS.47.t:0 "Belarusian Reconstruction Committee Work Directive"
 SWRW_RUS.47.d:0 "To: Comrade Director, Belarusian Provisional Reconstruction Committee\n\nFrom: Belov, Section Four, Reconstruction Guidance Office, Central Planning Bureau\n\nSubject: Preliminary Instructions for Initiating the First Phase of Reconstruction Work in the Belarusian Region\n\nComrade Director,\nPreliminary instructions regarding the reconstruction work in the Belarusian region are hereby issued. The Central Committee places great hope in your committee, expecting you to rapidly reverse the difficult situation in the region caused by long-term devastation by fascist bandits and their puppet regimes.\n\nThe current top priorities are: One, to comprehensively assess and report on infrastructure damage, especially transportation, energy, and communication networks in key cities like Minsk and Gomel. Two, to inventory and register remaining industrial facilities and agricultural resources, establish a baseline, and provide a basis for subsequent planning. Three, to immediately begin restoring crucial livelihood guarantees, stabilize social order, particularly food supply and basic medical care. Four, in coordination with security departments, to resolutely eliminate remaining hostile elements and sabotage activities.\n\nThe Central Committee is well aware of the arduous tasks and limited resources, but the heroic spirit and indomitable perseverance demonstrated by the Belarusian people during the Great Patriotic War are our invaluable assets in overcoming all difficulties. It is imperative to fully mobilize and rely on the masses, using limited resources where they are most needed. Initial aid supplies (including construction materials, seeds, medical supplies) will be allocated progressively starting next month.\n\nPlease have your committee promptly submit a detailed status report and a draft work plan for the first phase (the next six months). Subsequent support will be arranged based on specific circumstances and the overall national unified plan. Remember, efficiency and stability are equally important."
 SWRW_RUS.47.a:0 "Central Planning Bureau, Sergei Belov"
 SWRW_RUS.48.t:0 "New Life in the Cowshed"
 SWRW_RUS.48.d:0 "The morning mist had not yet dissipated when the 'Red Star' collective farm on the outskirts of Brest awoke. Masha, the farm's veterinary assistant, was carefully examining a calf born just a few days ago. This little black-and-white fellow was the twelfth new life welcomed by the farm in recent months, and the fifth Masha had personally delivered.\n\nThe cowshed was still the same old cowshed. The Germans had requisitioned it during the occupation, and some faint German graffiti still remained in the corners. The roof leaked, and the hay on the floor wasn't thick enough. But at least, with fewer cows, it felt more spacious. Moreover, in a corner were piled several sacks of feed printed with unfamiliar Cyrillic letters—supposedly “high-protein nutritional supplements” allocated from above. Though the cows were initially reluctant to eat it, their milk yield did increase afterward.\n\n“Look at you, little one, quite sturdy!” Masha gently patted the calf's back, and the calf affectionately nuzzled her hand. “When you grow up, you’ll help us produce more milk and till more land.” Her voice was full of hope, as if she were looking at her own child.\n\nOld Ivan, the farm chairman, limped over, holding a chipped enamel mug. “Comrade Masha, take a break, have some hot tea.” He handed her the mug and looked at the group of calves milling around their mothers, a rare smile on his face. “A good omen, these little ones. It feels like the whole farm has come alive since they arrived.”\n\n“Yes, Comrade Chairman,” Masha took the mug, the warmth dispelling some of the chill. “It's just that the cows' milk is still not quite enough. If only we could get more good feed, or… or introduce a few high-yield breeding cows.”\n\n“We will, Comrade Masha, we will have them all.” Old Ivan gazed eastward, towards the rising sun, and also towards Minsk and Moscow. “Everything is slowly getting better. We lost so much, but as long as these little ones can be born and grow up, there’s hope for these days.”"
 SWRW_RUS.48.a:0 "Every moo echoes the land's desire."
 SWRW_RUS.49.t:0 "Medals in a Glass Case"
 SWRW_RUS.49.d:0 "In central Minsk, a renovated building, its facade still bearing some scars of war, once again displayed the sign “Belarusian History Museum.” Irina, a young history graduate now working as a museum guide, was leading a small group of visiting students.\n\nThe exhibition hall was spacious and bright, impeccably clean. But the exhibits seemed somewhat… sparse. Many glass cases were empty or contained only photocopies of photos and documents. War and looting had taken too much. Irina focused her explanation on the “Great Patriotic War and the Belarusian People’s Resistance” section. Here, rusty rifles, scorched military uniforms, crude radios used by partisans, and a few Red Star medals that had survived the war were displayed.\n\n“Class, please look,” Irina pointed to a “Partisan of the Great Patriotic War” medal resting on a velvet cushion, her voice clear and tinged with deliberately suppressed emotion. “This medal belonged to a hero named Vasily. During the German occupation, he and his comrades fought under the harshest conditions, disrupting enemy transport lines and protecting our compatriots. Every forest in Belarus was a fortress of their resistance.”\n\nA small boy in the front row raised his hand: “Teacher, why were the Germans so bad?”\n\nIrina paused, choosing her words carefully. “Because… they were blinded by an evil ideology called ‘Fascism.’ They believed they were a superior race and could freely oppress and enslave other nations. But history has proven that justice will eventually triumph over evil. Our great motherland and heroic people ultimately crushed the fascist bandits.”\n\nThe narrative was standardized, emphasizing resistance, sacrifice, ultimate victory, and the current rebirth under a unified banner. Cruel details of the war, complex motives of collaborators, and policy vacillations during different periods… these were carefully omitted or simplified. History, like the museum itself, always selectively displayed the parts it wished to be seen.\n\nAt the end of the tour, Irina saw an elderly, white-haired man standing alone before Vasily’s medal display case, silent for a long time, his shoulders trembling slightly. She didn’t approach him. Some memories, museum glass cases cannot fully contain."
 SWRW_RUS.49.a:0 "History is wiped clean, but still feels rough to the touch."
 SWRW_RUS.50.t:0 "'Red Star' Breeding Pigs Arrive at the Farm"
 SWRW_RUS.50.d:0 "The state-run pig farm on the outskirts of Gomel was having a big day. Several new GAZ trucks carefully drove into the farm area, stopping in front of the newly built, whitewashed pigsties. The truck doors opened, and amidst excited chatter and the oinking of pigs, a group of plump, glossy-coated 'Large White pigs' were herded out.\n\n“Comrades, look!” The farm manager, a short, stout but energetic middle-aged man, waved his arms at the workers and technicians. “This is the superior ‘Ukrainian Large White’ breed imported from our Ukrainian brothers! High yield! Disease resistant! Fast growing! With them, our Belarusian pork production will surely skyrocket!”\n\nA technician, holding a notebook, carefully recorded the number and characteristics of each breeding pig, occasionally prodding those that seemed listless with a small stick. “Comrade Manager, long-distance transport has affected them considerably. They need to be quarantined and observed immediately, and their nutrition supplemented.”\n\n“Of course, of course! Comrade, these precious darlings are in your hands!” The manager thumped his chest in assurance. “Feed will be plentiful! Veterinarians on call! We must ensure they adapt to their new home quickly and produce many offspring! We aim for our pork to be on the tables of Minsk and even Moscow by this time next year!”\n\nThe workers, with much ado, herded these 'foreign VIPs' into the clean, spacious new pigsties. These sties were built according to the latest 'scientific breeding standards,' a stark contrast to the old, low, damp pigpens nearby. Old Pyotr, a lifelong pig keeper, watched these white, plump, oinking newcomers, shaking his head, then nodding. He had raised local black-haired native pigs all his life; though they grew slowly, they were hardy and ate anything. These delicate 'Large Whites,' well-fed and well-housed, whether they could adapt to Belarusian conditions was truly uncertain.\n\nHowever, seeing the manager and technician's energetic demeanor, the new pigsties, and the truckloads of feed, a glimmer of hope also arose in Old Pyotr's heart. Perhaps, this time they could really make something of pig farming? At least, more pigs meant more meat, and life should get a little better, shouldn't it?"
 SWRW_RUS.50.a:0 "New oinks herald a change on the dinner table."
 SWRW_RUS.51.t:0 "The Collective Farm's 'Tractor Symphony'"
 SWRW_RUS.51.d:0 "The 'Dawn' collective farm in the Vitebsk region was undergoing a transformation. The farm's size had tripled, incorporating several nearby scattered small farms. The endless fields were replanned, divided into neat, large plots of arable land. Most notably, several new, brightly red-painted tractors had replaced most of the old oxen and draft horses, becoming the protagonists in the fields.\n\nAnton, once the owner of one of those small farms, was now the captain of the 'Dawn' farm's first tractor team. He sat high in the driver's seat, feeling the powerful vibrations of the diesel engine beneath him, the freshly turned black earth behind him exuding a refreshing aroma. This felt completely different from plowing with his old horse—faster, stronger, more… powerful. According to the plan, his team was responsible for plowing five hundred hectares today, a task unthinkable in the past.\n\n“Captain Anton!” The farm's technician, a young man with glasses, rode up on his bicycle, waving a form. “Maintain depth! The blueprint requires 25 centimeters! And control fuel consumption, don't exceed the quota!”\n\nAnton nodded, slightly adjusting the plow's depth. Centralized management had its pros and cons. The benefit was unified resource allocation, leading to higher efficiency. The drawback was more rules; everything had to follow the forms, lacking the carefree freedom of farming one's own land. On the adjacent plot, another tractor roared deafeningly. Its driver, a greenhorn, operated it somewhat clumsily, his furrows crooked.\n\nIn the distance, some old farmers, not yet fully adapted to collective life, led their emaciated old horses, which they were reluctant to hand over, tilling small, leftover patches of land. Their figures, set against the massive tractors, appeared small and lonely. Anton knew what they were thinking; he himself sometimes missed the old days of modest self-sufficiency. But times had changed. Fragmented small-scale farming couldn't feed so many people, nor could it support national reconstruction. Only by centralizing, by achieving scale, could they truly change their fate.\n\nThe tractors advanced tirelessly across the vast fields, their monotonous, powerful roar like a crude yet potent symphony of a new era."
 SWRW_RUS.51.a:0 "The roar of engines is the prelude to abandoning old ruts."
 SWRW_RUS.52.t:0 "Will Milk Flow Automatically?"
 SWRW_RUS.52.d:0 "“A miracle! It’s simply a miracle!” Farmwoman Zoya stared wide-eyed as the humming, silver-white machine skillfully attached itself to the cow’s udders, and then streams of white milk began to flow through the transparent pipes. “It… it can really milk itself?”\n\n“Of course, Aunt Zoya,” the white-coated technician beside her explained with a smile. “This is the latest model ‘Dawn’ electric milking machine. Not only is it fast, but it’s also more hygienic than manual milking and can reduce the incidence of mastitis. From now on, you won’t have to get up before dawn to milk each cow by hand. It saves time and effort!”\n\nZoya still found it hard to believe. She and her sisters, for generations, had milked cows by hand. It was a task requiring skill and patience, a sense of the cow’s mood, and the right amount of pressure. And now, this cold machine, plugged in, could automatically draw out the milk? She leaned closer; the machine pulsed rhythmically, and the cow seemed comfortable, leisurely chewing its cud.\n\n“With this treasure, our farm’s milk production can increase by at least thirty percent!” the farm secretary exclaimed excitedly nearby. “And it can guarantee quality! In the future, our milk might even be rated a ‘premium product’ and earn us extra bonuses!”\n\nZoya watched the milk flow through the pipes into a huge stainless steel collection tank, her feelings mixed. It was easier, yes, but she felt something was missing. In the past, when she milked, she would talk to the cows, hum songs, feel their warm bodies and trusting eyes. Now, between human and cow, there was a humming machine. Modernization was good, but would those old emotions and connections slowly disappear along with the calluses on her hands?"
 SWRW_RUS.52.a:0 "Machines bring efficiency, and also new distances."
 SWRW_RUS.53.t:0 "The Khatyn Forest Memorial"
 SWRW_RUS.53.d:0 "Khatyn Forest, a land that had witnessed too much bloodshed and suffering, now embraced a solemn moment. On the site of the village burned down by German invaders, a new memorial rose. The main sculpture depicted a mother cradling her dead child, and the pedestal was engraved with a concise, heavy line: “In memory of the Belarusian people who perished in the Great Patriotic War.”\n\nAutumn sunlight filtered through sparse leaves, falling on the crowd gathered for the unveiling ceremony. There were white-haired old partisans, their chests adorned with faded medals; children in new school uniforms, wearing red pioneer scarves; peasants from nearby villages, their faces solemn; and government officials and military representatives in crisp uniforms.\n\nAn old partisan, his voice trembling but still strong, stepped onto the makeshift podium. “Comrades, friends,” he scanned the crowd, his gaze sweeping over the land, overgrown with grass yet still exuding an aura of death. “We stand here to remember. To remember the innocent victims whose lives were taken by fascist beasts, to remember the martyrs who fought bravely to defend our homeland. The tragedy of Khatyn village is but a microcosm of countless tragedies in our Belarus. A quarter of our population! We lost a quarter of our compatriots!” His voice choked, and suppressed sobs rippled through the audience.\n\n“But,” he raised his voice, his eyes rekindling with fire, “we did not surrender! Our people resisted in the forests, in the swamps, under the enemy’s bayonets! We shed our blood, but we won the final victory! We drove the German aggressors from our land!”\n\n“Today, we stand on this reborn land to pay tribute to the fallen. Their sacrifice was not in vain! Behold, new villages are built, factory chimneys are smoking, children can study in peace again! We are building a strong, unified motherland! This is the best solace for the martyrs!”\n\nThe red cloth was slowly unveiled, revealing the mother statue’s sorrowful yet resolute face to the crowd. No one spoke, only the rustling of wind through the trees and the distant roar of tractors, symbolizing new life. This history was too heavy to forget, impossible to forget. But remembrance was for moving forward better."
 SWRW_RUS.53.a:0 "The fallen rest; the living march on."
 SWRW_RUS.54.t:0 "The Old Guardian of Belovezha"
 SWRW_RUS.54.d:0 "On the edge of the Białowieża Primeval Forest, autumn was in full swing. Forester Yuri Karpovich, a swarthy, taciturn old man, rode his equally aged horse along a barely visible path known only to him. He had worked here for nearly forty years, familiar with every tree, every ravine in the forest. He had seen Tsarist hunting parties, the fires of two world wars, Germans establishing a restricted zone here, and post-war partisans and mopping-up troops chasing each other through this wilderness.\n\nNow, the war was over, and the forest had returned to its ancient tranquility, broken only by the occasional sound of an axe and the distant hubbub of tourists. This vast forest had been declared a 'National Nature Reserve,' and Karpovich's duties had expanded from preventing poaching and fires to guiding tourists and stopping them from littering.\n\nThis morning, deep in the forest, he found a string of huge footprints and fresh droppings—European bison! These kings of the forest, nearly hunted to extinction during the war, were now slowly recovering in numbers. Karpovich carefully recorded the location and count, a sense of satisfaction welling up inside him. This forest was his lifelong charge; seeing it revitalized pleased him more than anything.\n\nHowever, troubles came with it. Yesterday, he caught two 'tourists' from Minsk who actually wanted to hunt wild boar in the forest with shotguns! It took Karpovich a great deal of effort to drag them to the management office. And those city folk who littered bottles and cans, they simply didn't understand the forest's fragility.\n\n“Protect nature… sounds nice,” Karpovich muttered to his old horse, which flicked its tail in agreement. “But if people’s hearts are rotten, even the best reserve is useless.” He sighed and continued his patrol. The forest was vast, quiet; it had witnessed too much human folly and greed, and also tenacious vitality. Perhaps, protecting this forest was also about guarding something more important."
 SWRW_RUS.54.a:0 "The forest is silent; it has seen too many rise and fall."
 SWRW_RUS.55.t:0 "The 'Salt' Underground"
 SWRW_RUS.55.d:0 "The landscape of the Soligorsk mining area was strikingly different from the pastoral scenes elsewhere in Belarus. Massive headframes towered into the sky, conveyor belts snaked like steel pythons, continuously transporting dark brown ore to the processing plant. A faint salty and chemical smell permeated the air. This was a potash mine, one of Belarus's 'underground treasures.'\n\nVadim, a young miner, had just finished his morning shift. He took off his dust-caked work clothes and washed the grime from his face, revealing a tired but still youthful countenance. In the shower room, he joked with his workmates, complaining about the stifling heat and noise underground, while also dreaming of going to the newly opened cinema in town after payday.\n\n“Heard the news? Production quotas are going up again next month!” a colleague said while toweling off. “They say Moscow is building new fertilizer plants and urgently needs our potash!”\n\n“Let them raise it,” another said nonchalantly. “More work, more pay, it’s better than when the Germans were here. Back then, no matter how much you worked, you were only half-full.”\n\nVadim said nothing. He remembered when his father worked in this mine as a child. Conditions were worse then, and safety accidents were frequent. His father always said they were exchanging their lives for the country's needs. Now, conditions had indeed improved considerably, with new ventilation equipment and stricter safety regulations. New workers' dormitories and a club had also been built in the mining area. But Vadim always felt that they were still exchanging their sweat, even their health, for the needs of those distant places.\n\nWalking out of the mine gate, the sunlight was somewhat dazzling. He saw several trains, laden with potash fertilizer, slowly departing for unknown destinations. This 'salt,' dug from deep beneath Belarusian soil, would nourish Russia's vast fields, turning into bread, into potatoes, into the cornerstone supporting the entire nation's reconstruction. Perhaps this was the meaning of his work? Vadim揉了揉 his aching shoulders and headed towards town. Tonight, he wanted to see that reportedly spectacular new movie."
 SWRW_RUS.55.a:0 "Underground treasures nourish hopes above ground."
 SWRW_RUS.56.t:0 "Gazing at the Other Shore"
 SWRW_RUS.56.d:0 "Private Timofey Ivanov, a farm boy from Penza Oblast, stood on the newly built border watchtower, the cold wind piercing his ill-fitting, thick greatcoat. This was his third month in Belarus, and his first time being assigned to this outpost, right next to 'the other side.' Barbed wire snaked below, new and glaring, and further out were minefields and freshly dug anti-tank ditches.\n\nNight had fallen. On his side of the land, there were only scattered lights from military barracks and the dim glow of distant villages. But looking west, across the silent river, he could see a continuous stretch of lights, and even faintly hear the roar of truck engines—that was German-controlled territory, once also part of their motherland.\n\n“See anything, kid?” asked old soldier Vasily from below the tower, as he rolled a cigarette. He had been here longer than Timofey had been a soldier and was said to have experienced the most brutal retreats.\n\n“Nothing, Uncle Vasily, just… the lights on the other side are quite bright,” Timofey answered, somewhat nervously.\n\n“Bright? Humph, German lightbulbs might be better, but their lives aren't necessarily comfortable.” Vasily exhaled a thick cloud of smoke. “Don’t be fooled by the lights, kid. The people over there are just like us, also hoping for dawn.” He paused, his voice dropping slightly. “We guard here to ensure that one day, our lights can also illuminate that side, instead of their darkness engulfing us.”\n\nTimofey gripped his rifle tighter; the cold steel gave him a sense of security. He no longer looked at the lights on the other bank but carefully observed the land before him—their land, slowly awakening. The wind seemed to carry the faint sound of tractors tilling at night from a distance, a sound that belonged to them."
 SWRW_RUS.56.a:0 "The border river is silent, flowing with waiting and vigilance."
 SWRW_RUS.57.t:0 "Craters in the Birch Forest"
 SWRW_RUS.57.d:0 "The breath of spring finally descended upon the Belarusian fields; melting snow formed meandering streams across the meadows. Sunlight, filtered through the newly emerged leaves of birch trees, cast dappled shadows. Alyona, a young woman working at a collective farm on the outskirts of Minsk, carried a basket, foraging for the first tender wild mushrooms at the edge of the woods. The air was filled with the fragrance of earth and grass.\n\nThis birch forest was as beautiful as a poem, tranquil and full of life. Alyona had played here since childhood, familiar with every tree, every berry bush. Yet she also knew how much pain lay buried beneath this tranquility. Not far away, a huge, moss-covered shell crater, like an ugly scar, marred the harmony of the landscape. During the war, fierce battles had taken place here; German tanks and Soviet artillery had repeatedly ravaged this woodland.\n\nShe bent down, carefully parting the fallen leaves, revealing several round, white mushrooms. Just then, she heard a low rumble in the distance—not thunder, but… the sound of machines. Several military trucks, painted green and hauling heavy machinery, slowly drove past the edge of the woods along a newly built dirt road, leaving two deep ruts behind.\n\nAlyona stood up, watching the trucks disappear at the other end of the forest. She knew those machines were bound for the western border, to build new defensive fortifications. To prevent the iron hooves of war from trampling this beautiful land again, people were erecting new barriers of steel and concrete. This made her feel secure, yet also carried a hint of inexplicable loss. This beautiful birch forest, it held so much—nature's gifts, the scars of war, and now, the imprint of preparations for conflict."
 SWRW_RUS.57.a:0 "Verdant green, yet unable to conceal the land's memories."
 SWRW_RUS.58.t:0 "Concrete and Makhorka"
 SWRW_RUS.58.d:0 "“Hey! Andrei! Stop fucking spacing out, hand me that bag of cement! Yes, the one under your arse!”\n\nForeman Slava’s roar was still clearly audible above the deafening noise of the concrete mixer. Andrei, a young man fresh out of Ryazan technical school, scrambled to lift the heavy bag of cement and stumbled over to the workers pouring the bunker roof. Sweat soaked his shirt, concrete powder clung to his face, making him look like a ghost just emerged from a flour sack.\n\nThis was a top-secret national defense construction site somewhere on the western border of Belarus. As far as the eye could see, rolling hills and massive, newly excavated earthworks dominated the landscape. Hundreds upon hundreds of workers, soldiers, and engineers bustled about like ants, pouring concrete, tying rebar, laying cables. According to the huge blueprint posted on the wall, a vast underground fortress complex would be built here, equipped with the latest artillery, missile silos, and command centers, purported to withstand “any scale of ground attack.”\n\nDuring the lunch break, Andrei sat with a few fellow workers on a newly poured concrete bunker, sharing black bread and dried salted fish. “Fucking exhausting,” complained a muscular man with a tank tattooed on his arm. “Can’t even see a woman in this damn place. At night, it’s either drinking or playing cards.”\n\n“Quit whining, Misha,” another, slightly older worker said, rolling a makhorka cigarette. “We’re lucky to be working here. Heard this is the country’s most important project, directly related to whether we can stop the Germans. We sweat a bit more now, so we bleed less later.”\n\nAndrei ate his bread in silence. He had studied bridge engineering, expecting to repair bridges over the Dnieper after graduation, but instead, he was assigned to this godforsaken place to dig holes. Every day, he faced cold concrete, deafening noise, and Foreman Slava’s incessant shouting. But he also knew in his heart that the old worker was right. He had seen the ruins left by the war with his own eyes, heard elders recount the humiliation and fear of occupation. If this concrete could really prevent all that from happening again, then no matter how hard or tiring, it was worth it.\n\nHe looked up and saw on the distant horizon the silhouette of a new missile silo slowly taking shape against the setting sun, like a silent, resolute finger pointing west."
 SWRW_RUS.58.a:0 " A spade of earth, a single brick; building a wall, and also resolve."
 SWRW_RUS.59.t:0 "Pravda: The Alarm Bell Tolls Loudly"
 SWRW_RUS.59.d:0 "Headline: With Steel Will, Forge the Nation's Barrier—Commemorating the Painful Lessons of the Great Patriotic War\n\n\n\nLast night's west wind, sweeping through the streets and alleys of Minsk, brought not biting cold, but the warmth of rebuilding homes. Factory chimneys stand tall again, tractors sing in the fields, classrooms echo with children's reading. The banner of victory flies high above the republic, the dawn of peace seemingly illuminates this land ravaged by suffering.\n\nHowever, comrades, friends! We must not indulge in the current tranquility and forget the unforgettable pain! We must not forget how, in the not-too-distant past, the iron heel of fascism trampled our homeland, how barbaric flames engulfed our cities and villages! We must not forget what a terrible price Belarus, this heroic land, paid—a quarter of the population sacrificed! Every inch of land is soaked with the blood of martyrs and the tears of the innocent!\n\nForty years of tyranny, forty years of humiliation! The lessons of history are like an alarm bell that must toll loudly in each of our hearts! “Past experience, if not forgotten, is a guide for the future.” We paid a bloody price for lack of preparation; our families were shattered because of the enemy's brutality. Such tragedies must never be allowed to happen again!\n\nYes, we achieved a great victory, driving the invaders from our borders. But the threat from the West has not been eliminated; the ambition of imperialism still exists. They may be dormant for now, but their wolfish ambition to covet our land and attempt to subvert our cause has never changed!\n\nTherefore, we must, with hundredfold vigilance and thousandfold effort, turn our western frontier, turn our heroic Belarus, into an indestructible steel barrier! We must arm our army with the most advanced weapons, defend our borders with the strongest fortifications! We must make every soldier a vigilant sentry, make every inch of land an insurmountable grave for invaders!\n\n“Never again shall we be invaded!” This is not just a slogan; it is our solemn promise to the fallen martyrs, our historical responsibility to future generations, an iron oath forged with blood and life! Let the alarm bell toll loudly, let our will be like steel! For the eternal consolidation of the motherland, for the lasting peace, for our free and happy life, be always prepared!"
 SWRW_RUS.59.a:0 "Belarus stands at the forefront, never retreating."
 SWRW_RUS.60.t:0 "The Last Potatoes"
 SWRW_RUS.60.d:0 "Lyuba looked at the lonely plate of boiled potatoes on the dinner table, then at the three children sitting around it—their little faces full of longing as they stared at the meager amount of food. Her husband Alexei, the tractor driver who used to be as strong as a bear, was now thinner too, silently smoking a cigarette.\n\nThis winter was particularly harsh. Last year's harvest was decent, but most of the grain was requisitioned under the pretext of 'supporting frontline construction.' The town's factories were the same; workshops that originally produced farm tools and daily necessities were now converted to making military parts. Machines roared day and night, but the workers' rations grew smaller and smaller.\n\n“Mama, I want a little more…” her youngest son Sasha whispered.\n\nLyuba stroked his head tenderly, picking the largest potato from the plate and putting it in his bowl. “Eat, Sasha, eat more and grow tall.” She herself had no appetite.\n\nThe neighbor's son, only seventeen, was drafted last month and sent to the western border. The boy's mother cried for days. Everyone knew the country was preparing for a possible war; the 'military-first policy' was mentioned daily in the newspapers. Sacrifices were necessary for the country's security, to avoid being bullied by the Germans again. She understood the rationale, but seeing her children's sallow faces, seeing her husband's increasingly gaunt shoulders, her heart ached as if gripped by something painful.\n\nAfter dinner, Alexei silently took out his tools and began repairing the old tractor that had accompanied him for years. “Heard they’re organizing ‘voluntary labor’ in the spring to help the army build fortifications,” he said in a low voice. “At home… I’m relying on you.”\n\nLyuba nodded without speaking. She walked to the window, gazing at the silent, moonlit village outside. Faint bugle calls seemed to drift from the direction of the military camp. Security was important, but what about life? Must they live like this for the sake of supposed security? She didn't know the answer, only that tomorrow's potatoes might be even fewer."
 SWRW_RUS.60.a:0 "To make the shield strong enough, we tightened our belts."
 SWRW_RUS.61.t:0 "Bunkers and Lullabies"
 SWRW_RUS.61.d:0 "On the western outskirts of Minsk, near the new defense line, the nights were exceptionally quiet, but also exceptionally… oppressive. Irina gently rocked the baby in her arms, humming an old Belarusian lullaby. Her husband Peter, an engineer, worked in the huge underground command center nearby, codenamed 'Bear's Den,' and hadn't been home for almost a month.\n\nOutside the window, faint concrete outlines could be seen under camouflage netting on the distant hills, and searchlight beams occasionally swept across the night sky. During the day, the roar of construction machinery and the commands of drilling soldiers often filled the air. They said this place was the nation's strongest shield, built to protect ordinary people like her and her child.\n\nIrina knew Peter's work was important and arduous. But every time he returned, he seemed more silent and tired, a kind of anxiety she couldn't understand in his eyes. He said it was heavily guarded inside, isolated from the world, like living in a giant steel can. He said it was safe there, indestructible.\n\nBut Irina didn't feel very safe. Living on the edge of this giant 'fortress,' she always felt surrounded, not by enemies, but by the cold walls they had built themselves and the ubiquitous watchful eyes. Neighbors spoke in lower voices, and children were told not to go near the military restricted zones. An invisible tension seemed to permeate the air, making even the lullaby's melody feel heavy.\n\nThe baby in her arms finally fell asleep, breathing evenly and peacefully. Irina carefully placed him in the cradle. She went to the window, gazing at the massive fortifications looming faintly in the darkness. Could they really bring safety? Or did they merely weld the fear and shadow of war deeper into their lives?"
 SWRW_RUS.61.a:0 "Within high walls, is it peace, or a cage?"
 SWRW_RUS.62.t:0 "The Veteran's Rifle"
 SWRW_RUS.62.d:0 "Dust swirled on the training ground as a group of fresh-faced recruits in brand-new uniforms practiced shooting. Gunshots echoed, but stray bullets clearly outnumbered hits. Old instructor Dmitri Pavlovich, a veteran who had lost an arm at Stalingrad, paced back and forth behind the line, leaning on his cane, his brow furrowed.\n\n“Worthless! A bunch of worthless maggots!” he finally roared, his voice hoarse yet powerful. “Is that how you shoot? Are you trying to tickle the enemy? Are your eyes on your arse?!” The recruits flinched, ceasing fire.\n\n“Listen up, lads!” Pavlovich strode to the firing line, snatching a rifle from a recruit. His movements were somewhat clumsy, but his eyes were sharp as a hawk’s. “Do you think war is a game? Think the enemy will stand still for you to aim?” He took a deep breath, seemingly recalling something. “Let me tell you, back then, in the summer of ’41, when the Germans fired the first shot, many of us hadn’t even held a rifle! Many didn’t even know which way to run!”\n\nHis voice dropped, filled with visceral pain. “My company, one hundred and twenty good lads, half were gone the first day! They didn’t even see what the enemy looked like! Planes swarmed like locusts, tanks rolled over us like monsters! We weren’t prepared, we were caught completely off guard! Rivers of blood, lads! Do you know what that feels like?”\n\nDead silence fell over the training ground, only the wind whistling across the empty field. The recruits looked at the tears and fire flickering in the one-armed veteran’s eyes, seemingly feeling the suffocating weight of that disaster.\n\n“Now,” Pavlovich raised the rifle again, steady as a rock despite having only one arm, “we have time to prepare, we have enough weapons, we have strong fortifications! We’ve learned our lesson! We must not be like headless flies again when the first shot is fired! Every bullet in your hands could decide a comrade’s life, decide whether we can defend the homeland behind us! Did you all hear me clearly?!”\n\n“Yes, Instructor!” The recruits’ answer was uniform and loud, filled with unprecedented determination. Pavlovich nodded, handed the rifle back to the recruit. “Now, reload! Aim properly! Remember, we are no longer the unprepared army of the past!”"
 SWRW_RUS.62.a:0 "This time, we load first."
 SWRW_RUS.63.t:0 "The Air Raid Drill"
 SWRW_RUS.63.d:0 "At precisely three o'clock in the afternoon, the shrill, piercing sound of air raid sirens abruptly filled the skies over Gomel. People on the streets paused for a moment, then began moving methodically towards the nearest underground shelters. It wasn't a real air raid, just a routine weekly drill. But even knowing it was a drill, the familiar, heart-stopping sound still made many hearts skip a beat.\n\nMikhail, a shop assistant at a state-run store, expertly locked the shop door, grabbed the first-aid kit hanging on the wall, and hurried towards the corner subway station entrance—which also served as the designated public shelter. He saw his neighbor, old Anton, supporting his frail wife with difficulty as they slowly descended the stairs. A group of Young Pioneers in red scarves, led by their teacher, walked in neat lines, their small faces showing some nervousness but no panic.\n\nThe subway platform had been temporarily converted into a shelter. The lighting was dim, the air somewhat stuffy. People leaned against each other, sitting or standing, talking in low voices. A few soldiers maintained order, their expressions serious but not hostile. Propaganda posters adorned the walls, illustrating how to identify different types of bombs and how to perform self-rescue during an air raid.\n\n“Another drill,” Mikhail heard someone nearby complain softly. “It’s been peaceful for so many years, why still do this? Could the Germans really attack again?”\n\n“Shh! Be careful!” another person immediately hushed him. “The newspaper says imperialism’s ambition to destroy us has not died! We must always remain vigilant! Have you forgotten the lesson of Khatyn?”\n\nMikhail didn’t join their discussion. He just leaned against the cold wall, silently observing it all. This state of “always being prepared” had become a part of their lives. It was reflected in the weekly siren drills, in the content about patriotism and national defense in children’s textbooks, in the increasing number of military recruitment posters on the streets, and in the subconsciously lowered voices and solemn expressions when people talked about the “western border.”\n\nPeace was real; factories were producing, shops were open, people were falling in love, marrying, having children. But the shadow of war had never truly dissipated; it lingered like a lurking ghost, constantly hanging over this land that had just risen from the ruins. Half an hour later, the short whistle signaling the all-clear sounded. People breathed a sigh of relief, gradually emerging from the subway station back into the sunlight, continuing their unfinished work and lives. As if nothing had happened, yet as if something had quietly been etched into everyone’s bones."
 SWRW_RUS.63.a:0 "The string remains taut, waiting for the moment."
 SWRW_RUS.64.t:0 "Song Beneath the Cranes"
 SWRW_RUS.64.d:0 "In the center of Minsk, former ruins were being replaced by a forest of giant cranes and scaffolding. Vadim, a young construction worker, stood with his colleagues high on the scaffolding, securing prefabricated concrete panels. The sun was dazzling; the air filled with the smell of new cement, welding sparks, and workers' sweat. Below, the streets bustled with traffic, newly paved asphalt roads glistened darkly, and brand-new trolleybuses glided silently past, their windows reflecting the rising Soviet-style apartment buildings and glass-fronted public buildings on either side.\n“Hey, Vadim! What are you daydreaming about? Pass that rebar over here!” the foreman shouted.\n\nVadim snapped back to reality, handing over a heavy bundle of rebar. “Foreman, do you think… when this building is finished, we’ll really get to live in new apartments?” he asked, wiping sweat from his brow, a little uncertainly. He still lived with his parents and sister in an old, repeatedly repaired building on the outskirts.\n“Nonsense! It was in the newspaper! Priority allocation for us builders!” The foreman grinned, showing white teeth. “When this ‘Victory’ Avenue is finished, my old woman will be able to plant flowers on the balcony! I’ll invite you over for a housewarming drink then!”\n\nThe workers burst into good-natured laughter. In the distance, singing drifted over—a group of children in red scarves, led by their teacher, were visiting the construction site. They sang songs about construction, about the future, their clear, bright voices cutting through the site's noise. Vadim paused his work, listening for a moment. He imagined the future; perhaps in this very building he was helping to construct, his own children could sing so carefree.\n\nThe crane’s boom slowly rose, lifting a huge wall panel high into the air, as if stitching the final wound of this city reborn from fire, and also outlining the shape of the future."
 SWRW_RUS.64.a:0 "Brick by brick, laying the foundation for tomorrow."
 SWRW_RUS.65.t:0 "Concerto of Field and Chimney"
 SWRW_RUS.65.d:0 "In Brest Oblast, Andrei Petrovich, chairman of the 'October Harvest' collective farm, was arguing loudly into the phone, his face flushed red: “What? Half the tractors are being transferred again? To support the expansion of some… ‘Second Chemical Plant’? Can you eat chemical plants? Spring plowing is about to start! We were counting on them to plant more grain!”\n\nA bored bureaucratic voice came from the other end: “Comrade Andrei, these are orders from the Central Committee! Industrialization is the priority task! Chemical plants produce fertilizer, which ultimately increases grain yields! You need to see the bigger picture!”\n\nAndrei almost slammed the phone down in anger. The bigger picture? His bigger picture was the hundreds of hungry mouths on the farm and the meager grain reserves left in the warehouse after handing over most of last year's harvest! City factories were important, sure, but if crops couldn’t grow in the fields, what use was more fertilizer?\n\nAfter hanging up, he paced irritably in his office. Outside the window lay the freshly plowed black earth, exuding a moist aroma; the few remaining tractors moved slowly. Further in the distance, several towering chimneys pierced the horizon—the sign of the newly built 'Second Chemical Plant,' relentlessly spewing greyish-white smoke into the sky day and night.\n\nJust then, the farm’s technician, a young graduate from the agricultural college, rushed in excitedly. “Comrade Chairman! Good news! The higher-ups have approved our trial of ‘straw return’ and ‘scientific crop rotation’ technologies! They say it can improve soil fertility without needing much fertilizer!”\n\nAndrei was愣住 for a moment. He looked at the light shining in the young man's eyes, then at the vast fields and distant chimneys outside the window. Maybe… maybe there really was a way for the fields and chimneys to stop competing for resources, and instead, jointly play a concerto of development? His tightly knitted brow finally relaxed slightly."
 SWRW_RUS.65.a:0 "Between the furrow and the assembly line, searching for that delicate balance."
 SWRW_RUS.66.t:0 "Not Just Potato Peels Anymore"
 SWRW_RUS.66.d:0 "Nadezhda carefully added a small spoonful of white sugar to her daughter Katya’s teacup, watching the crystalline granules slowly dissolve. Katya’s eyes widened in surprise as she looked at her mother: “Mama, today… can we use sugar?”\n\n“Of course, my little beet,” Nadezhda smiled, stroking her daughter’s hair. “Today is Papa’s payday, and he brought this back too!” She took a tin box decorated with colorful candy wrappers from the cupboard—it contained fruit candies newly produced by the Gomel Candy Factory, something seen only during New Year or when hosting important guests in the past.\n\nHer husband Mikhail, the old lathe operator who had diligently worked at the bearing factory for twenty years, sat at the table watching his wife and daughter, a contented smile on his face. He remembered the hard times: war, famine, rationing, never knowing where the next meal would come from. In the most difficult times, they even had to boil potato peels to stave off hunger. His daughter Katya had barely tasted sweetness growing up.\n\nBut now, things were truly different. Though far from wealthy, at least they no longer worried about starving. The shop shelves slowly held more items: fabric, soap, even occasionally a bit of sausage. Last year, they moved into a new apartment allocated by the factory; it was small, but had a separate kitchen and bathroom, and heating in winter. Mikhail’s wages had also increased twice; though not much, it was enough for Nadezhda to occasionally buy Katya a piece of fruit candy.\n\n“Papa,” Katya unwrapped a candy wrapper, popped the shiny sweet into her mouth, and closed her eyes happily, “this is really sweet!”\n\nMikhail watched his daughter’s contented face, his heart filled with warmth. The shadow of poverty had not completely disappeared, and the burdens of life remained heavy. But at least, they could now taste a little sweetness. For this small sweetness, for the hope that his daughter could eat candy every day in the future, he felt all the hardship was worthwhile."
 SWRW_RUS.66.a:0 "The taste of life is quietly sweetening."
 SWRW_RUS.67.t:0 "Flags on Victory Square"
 SWRW_RUS.67.d:0 "Minsk, Victory Square. Bright sunshine, colorful flags fluttering. Tens of thousands gathered here for the grand rally celebrating the 'Exhibition of Belarusian Liberation and Reconstruction Achievements.' Majestic marches blared from loudspeakers, and honor guards in brand-new uniforms marched past with crisp, powerful steps. On the viewing stands sat government officials, military generals, labor models, and representatives from 'fraternal republics.'\n\nIn the center of the square, on a temporary platform, Belarus's 'glorious achievements' in reconstruction were displayed: models of new tractors produced by the Minsk Tractor Works, photos of BelAZ heavy trucks, ore samples from the Soligorsk Potash Plant, and beautiful linen cloth with national patterns woven by female textile workers. Detailed descriptions accompanied each exhibit, emphasizing how, under the Party's leadership, the Belarusian people overcame difficulties, relied on their own efforts, and achieved world-renowned successes.\n\nSixteen-year-old Viktor and his classmates were also squeezed into the crowd, excitedly waving small flags. Their teacher told them to be proud of being part of the 'great Belarus.' Watching the imposing soldiers, the gleaming machine models, and listening to the impassioned speeches from the loudspeakers, Viktor indeed felt a surge of hot blood. He was proud of the rebirth of the land beneath his feet, moved by the toil of the builders.\n\nHowever, an elderly woman with white hair standing beside him just watched quietly, her eyes showing no excitement, only a complex and profound emotion. Viktor noticed a strip of black mourning cloth peeking from her sleeve. Perhaps, for her, the square's hustle and bustle and colorful flags could not completely cover the recent wounds and losses.\n\nThe climax of the rally arrived. A huge red flag slowly rose above the square, and the crowd erupted in thunderous applause and cheers. Shouts of “Hurrah! Hurrah!” echoed through the sky. Viktor shouted along, believing the future must be bright, great. Yet, within that greatness, there seemed to be some subtle, heavy echoes belonging to the past."
 SWRW_RUS.67.a:0 "Beneath the banner, lies glory, and also undried tears."
 SWRW_RUS.68.t:0 "Whispers in the Library"
 SWRW_RUS.68.d:0 "The newly built National Library of Belarus, spacious and bright, filled with the scent of books. Huge glass windows let the afternoon sun into the reading room, illuminating the young students hunched over their desks. Only the rustling of turning pages and the occasional deliberately suppressed cough broke the silence.\n\nSvetlana, a university student studying linguistics, was immersed in a newly published anthology of modern Belarusian poetry. This was unthinkable just a few years ago. Back then, many native writers' names were taboo, and bookstores were filled with monotonous propaganda pamphlets and leader's quotations. Now, although censorship still existed, at least some of their own voices were beginning to be allowed expression again.\n\nShe read a poem describing the morning in her hometown, the language simple yet beautiful, evoking childhood memories. She looked up and saw the reading room filled with faces as young as hers, engrossed in thick scientific works or quietly discussing literature, their eyes shining with the light of knowledge and aspiration for the future. Yes, a new era was dawning, full of opportunities and possibilities, as if after all the dust had settled, the sun had finally broken through the haze.\n\n“Hello, may I sit here?” a soft voice interrupted her thoughts. It was a boy about her age, clutching several thick philosophy books.\n\n“Of course,” Svetlana smiled, moving her books aside.\n\nAfter sitting down, the boy hesitated, then asked in a low voice, “Are you reading Kupala?”\n\nSvetlana looked up in surprise. “You know him too?”\n\nThe boy smiled, a sly glint in his eyes. “Of course, though many of his works still can’t be found in the library.” He leaned closer, his voice even lower. “But, I have some friends… we privately exchange some ‘interesting’ things. Would you like to join?”\n\nSvetlana’s heart beat a little faster. She knew what this ‘private exchange’ meant, and the risks involved. But looking at the mixture of passion, rebellion, and idealism shining in the boy's eyes, she felt an inexplicable attraction. Perhaps, the real ‘brilliance’ came not only from the officially sanctioned light, but also from those sparks of warmth and thought quietly passed around in corners?"
 SWRW_RUS.68.a:0 "As pages turn, ideas begin to flow silently."
 SWRW_RUS.69.t:0 "Returning Footsteps"
 SWRW_RUS.69.d:0 "At the end of the dusty road lay the village on the outskirts of Vitebsk he had left decades ago. Alexei Petrovich, a limping veteran with frost-tipped hair, finally stood under the old, crooked willow tree at the village entrance—exactly as he remembered it, only the trunk was thicker, the branches more lush. The war, and the long, distant 'service' after the war, had consumed almost his entire life. Now, he was back, wearing a faded old uniform and carrying a heart both weary and filled with trepidation.\n\nThe village had changed. Many low adobe houses were gone, replaced by rows of whitewashed new brick houses with brand-new television antennas on their roofs. Children in clean clothes chased a leather ball in the mud, their laughter crisp and loud, seemingly memory-less of war and hunger. The rhythmic chugging of a tractor drifted from the distance—the direction of the collective farm where he had toiled in his youth. The air carried the mixed scent of freshly baked bread and hay, the smell of peacetime.\n\nHe walked slowly down the village's only main road, his steps somewhat unsteady. Passing the once-familiar neighbors' houses, now occupied by faces he didn't recognize, they cast curious and friendly glances his way, but no one recognized him as the young lad who had left from here. He couldn't even find his old family home; a brand-new village club stood in its place, movie posters and agricultural technology promotion flyers pasted on its door.\n\nEverything was so unfamiliar, yet faintly shadowed with familiarity. Like himself—the blood of this land still flowed in his veins, but his soul was long etched with indelible grooves of time and experience, somewhat out of step with the thriving scene before him. He felt like a ghost, hovering between past and present.\n\nHe found a stone on the riverbank near the village and sat down, watching the setting sun paint the clouds crimson, also dyeing the quietly flowing river red. Several young people, carrying farm tools, walked past him laughing and talking, heading towards the village. One of them saw him, hesitated, then stopped and asked in a local Russian accent, “Uncle, are you… visiting relatives? It's getting dark, would you like to come to my place for some hot tea?”\n\nAlexei looked up, seeing the young, simple, vibrant face contrasting sharply with his own clouded, weary eyes. He opened his mouth to say something, but found his throat choked. Home… he was finally home. But was this still his home? Could he still integrate into this land that was striving forward, seemingly having forgotten him?\n\nHe took a deep breath of the air, filled with the smell of earth and cooking smoke, and slowly nodded. Perhaps this was the so-called 'leap of faith'—believing that this land could accept not only scars but also returning, faltering souls."
 SWRW_RUS.69.a:0 "The land beneath his feet, both destination and starting point."

 SWRW_RUS.71.t:0 "Guiding Opinions on Carrying Out Reconstruction Work in Ukrainian Territory"
 SWRW_RUS.71.d:0 "To: Responsible Comrades at all levels of the Ukrainian Reconstruction Committee\nFrom: Radchenko, Ukrainian Affairs Office, Central Restoration and Development Committee\nSubject: Directives and Principles for Initiating the First Phase of Reconstruction Work in the Ukrainian Region\nComrades,\nFollowing the latest directives from the Central Committee, the following guiding opinions on reconstruction work in the Ukrainian region are hereby issued: Ukraine, our former 'breadbasket,' fraternal land, having suffered long and brutal rule and destruction by fascist bandits and their running dogs, is in dire need of reconstruction, with widespread devastation and destitution. The complexity, arduousness, and importance of its reconstruction work cannot be overemphasized. Primary tasks: One, swiftly restore key infrastructure in central cities like Kyiv, Kharkiv, and Dnipropetrovsk, especially transportation, power supply, and communication systems, ensuring economic arteries are unblocked in the shortest possible time. Two, comprehensively inventory agricultural resources, register land, tally farm tools and livestock, and formulate detailed recovery plans for spring planting and autumn harvest; the grain issue is of paramount importance. Three, consolidate remaining industry, particularly coal mines and metallurgical enterprises in the Donbas region, prioritizing the production of materials needed for repairs. Four, stabilize social order, soothe public sentiment, and severely crack down on all hostile activities that disrupt reconstruction and create division. Five, pay special attention to identifying and eliminating the residual toxins of the German occupation colonial rule period, rebuilding a healthy social atmosphere and national identity. The Central Committee fully understands the difficulties you face but firmly believes that the heroic Ukrainian people possess boundless strength. Initial supplies of seeds, fertilizer, medical materials, and basic construction materials will be gradually dispatched following this directive. Your committee is requested to immediately organize forces, conduct in-depth research based on the principle of seeking truth from facts, and promptly submit more detailed status reports and specific work plans. Remember, speed is important, but quality is paramount; rebuild homes, but more importantly, unite hearts."
 SWRW_RUS.71.a:0 "Let the Dnieper once again surge with the waves of construction."
 SWRW_RUS.72.t:0 "German Lesson Beneath the Street Sign"
 SWRW_RUS.72.d:0 "On the cobblestone streets of Lviv's Old Town, several adolescents gathered around a newly installed bilingual street sign, pointing and chattering curiously. Above was the Ukrainian “Rynok Square,” below it a smaller line in Russian, and even further down, faint Gothic German letters, “Marktplatz,” could be discerned beneath a layer of scraped-off paint. Sunlight bathed the ancient stone buildings, structures that had witnessed the changing of too many flags.\nSuddenly, a young man wearing a red armband, a member of the “Team for Eliminating Fascist Remnants,” approached. “Little comrades, what are you looking at?” he asked with a smile.\n“Uncle, what does the German writing underneath mean?” a bold child asked, pointing at the blurry imprint.\nThe young man’s smile froze for a second, then his expression turned serious. “That’s the language of the invaders, the filthy mark left by the fascist bandits who oppressed our Ukrainian people! We scraped it off, just like we drove them away! Now, only the languages of our fraternal nations are here!”\nThe children nodded, seemingly understanding, yet not quite. Just then, an old cobbler sitting nearby looked up and muttered in heavily accented Ukrainian, “Scraped off the letters, can’t scrape off the days…” His voice was low, but loud enough for the young man to hear.\nThe young man’s face flushed red. He wanted to retort, but looking at the old man’s weathered face, he eventually just snorted and turned to inspect the next street sign. The children scattered too, resuming their game of chasing pigeons. Only the new street sign, and the historical traces beneath it that couldn't be completely erased, stood silently at the street corner, bathed in sunlight and the gazes of passersby."
 SWRW_RUS.72.a:0 "New paint can cover old marks, but memories seep through the cracks."
 SWRW_RUS.73.t:0 "The First Furrow"
 SWRW_RUS.73.d:0 "The vast black earth of Poltava finally welcomed its tractor. Oksana, a swarthy peasant woman with strong arms, was awkwardly but excitedly driving a 'Belarus' brand tractor, newly assigned to the village. It was her first time operating this iron beast that belched black smoke and roared loudly. Behind her, the plow turned over the dark, glistening soil, releasing a refreshing fragrance, as if a giant who had slept too long was finally stretching.\nHer husband Petro, leading several young men, followed behind, scattering high-yield wheat seeds supposedly transported from the 'Center.' During the war, this fertile land was either forced to grow industrial raw materials needed by the Germans or simply lay fallow. Petro himself had been captured and forced to build fortifications for the Germans, escaping death by a hair's breadth. Now, being able to sow wheat again on his own (though now called collective farm) land felt like a dream.\n“Oksana! Slow down! Don’t bury the seeds too deep!” Petro shouted towards the tractor, a smile on his face. Oksana waved back at him, the tractor's roar drowning out her reply.\nIn the distance, village elders and children stood on the field ridges, watching the scene. A white-haired old woman made the sign of the cross, muttering words, seemingly praying for this year's harvest. Several children chased the dust kicked up by the tractor, playing joyfully. The sun was warm, the sky blue; the traumatized land was reawakening with life. Though tools were scarce, seeds not quite plentiful, and tractor drivers needed training, the first furrow had been plowed, the seeds of hope had been sown."
 SWRW_RUS.73.a:0 "The black earth is silent, awaiting the echo of harvest."
 SWRW_RUS.74.t:0 "New Look for the 'Liberator' Monument"
 SWRW_RUS.74.d:0 "In the center of Kyiv, the massive granite obelisk erected by the Germans to commemorate their 'liberation of Ukraine from the Bolsheviks' was now shrouded in scaffolding and canvas. Workers were busy hammering and chiseling on it, occasionally sending down fragments of stone. A crowd of onlookers had gathered, pointing and discussing the spectacle.\n“Finally, they’re tearing it down!” exclaimed an old man with white hair, leaning on his cane excitedly. “Having this thing standing here is just bad luck! A damn monument left by the German devils!”\n“I heard they’re modifying it, not tearing it down,” corrected a man nearby who looked like an intellectual, speaking in a low voice. “The authorities plan to convert it into the ‘Monument to Victory in the Anti-Fascist War,’ keeping the main structure, knocking off the Nazi symbols, and replacing them with statues of our heroes.”\n“Modify? Humph, same soup, different bowl!” The old man was clearly unconvinced. “If you ask me, they should blow it up! Into pieces! Let those fascists see who the real masters are!”\n“Old man, you can’t say that,” the intellectual pushed up his glasses. “This is also part of history. Keeping it as a negative example, to remind future generations not to forget past suffering, isn’t that better?”\nA low murmur of discussion arose from the crowd; clearly, both views had supporters. Some felt complete destruction was necessary for catharsis, while others believed modification and repurposing held more meaning. But regardless, the monument symbolizing humiliation and oppression was about to change its appearance, which in itself was a gesture of victory. Under the setting sun, the silhouettes of workers moved across the massive monument, the sound of hammering like a belated, jarring yet powerful funeral march for the dark era gone by."
 SWRW_RUS.74.a:0 "Chisel off the eagle, carve the five-pointed star."
 SWRW_RUS.75.t:0 "Cranes on Khreshchatyk Street"
 SWRW_RUS.75.d:0 "Kyiv's Khreshchatyk Street, once hailed as the 'most beautiful street in the Soviet Union,' was almost leveled during the war. Now, it had transformed into a gigantic construction site. Crane arms swung through the air, trucks laden with bricks and cement shuttled back and forth, welding sparks flew, and the sounds of hammering, chanting, and roaring machinery blended into a noisy yet vibrant symphony of reconstruction.\nSvetlana, a young female engineer wearing a hard hat and holding blueprints, stood before the frame of a newly erected building, gesturing to several dust-covered construction workers. “The reinforcing steel specifications for this load-bearing wall must be correct! And those prefabricated panels over there, the joints must align perfectly! Safety first, but quality must also be guaranteed!” Her voice was clear and firm, standing out remarkably on a predominantly male construction site.\nShe came from Kharkiv, one of the first technical personnel to respond to the national call and participate in Kyiv's reconstruction. The scene before her both excited her and filled her with immense pressure. The Kyiv on the blueprints was magnificent, imbued with neoclassical grandeur and aspirations for the future. But the reality was widespread devastation, material shortages, a lack of skilled workers, and sometimes frustrating bureaucratic delays.\nYet, every time she saw a wall being built, a floor slab hoisted into place, saw this street visibly rising from the ruins, a tremendous sense of pride surged in her heart. They were not just building houses; they were rebuilding the soul of a city, redrawing the future skyline for a nation that had suffered greatly.\nIn the evening, workers left the site in twos and threes. Svetlana stayed behind alone, carefully checking the day's progress against the blueprints. The setting sun's rays bathed the unfinished building frames, casting long shadows. She could almost see the near future, when this street would once again be brightly lit, where people would stroll, shop, and laugh, as if the war had never happened."
 SWRW_RUS.75.a:0 "Brick by brick, building not just structures, but hope."
 SWRW_RUS.77.t:0 "Procurement Prices at the Market"
 SWRW_RUS.77.d:0 "Chernihiv's open-air market was bustling with a long-lost liveliness. The sun shone brightly, and along the muddy paths, stalls displayed a variety of farm produce: freshly dug potatoes, crisp cabbages, homemade pickled cucumbers, and a few live chickens flapping their bound feet. Farmers hawked their wares while bargaining with city dwellers who came to purchase.\nUncle Oleg, an old farmer who had tilled the land his entire life, was in particularly high spirits today. Sacks filled with this year's wheat harvest sat before him. Beside him, a young man in uniform was diligently writing in a notebook. He was a grain procurement officer sent by the new government.\n“Comrade Oleg, this batch of wheat is good quality. According to the latest procurement price, the total is… this many rubles.” The young man finished his calculations and handed over a wad of crisp new banknotes.\nOleg took the money, carefully counted it twice, an incredulous smile spreading across his face. “This much? It’s… nearly double what the Germans gave last year!” Last year, the Germans had only been willing to exchange a few nearly worthless 'Occupation Zone Marks' for his grain, at ridiculously low prices, practically daylight robbery. If he hadn't secretly hidden some, he and his family would have starved long ago.\n“This is the state’s new policy,” the young man said with a smile. “Reduce the burden on farmers, raise procurement prices, encourage everyone to grow more grain, sell more grain. Life will get better and better.” He also told Oleg that there might be new subsidies for fertilizer and farm tools this autumn.\nOleg was so moved he could barely speak, just nodded repeatedly. He carefully tucked the money into his coat, feeling its weight—not just the weight of banknotes, but the weight of hope for life. Other farmers gathered around, chattering, asking about the new policies, their faces all lit with a similar, long-lost ease and anticipation. The market's clamor seemed even more cheerful."
 SWRW_RUS.77.a:0 "The sweat of the black earth finally yields weighty rubles."
 SWRW_RUS.78.t:0 "Train to Kharkiv"
 SWRW_RUS.78.d:0 "Inside the overcrowded third-class carriage, the air was thick, filled with the smells of sweat, smoke, and cheap food. Nineteen-year-old Natasha tightly clutched a patched old bundle containing all her belongings. Leaning against the window, she watched the familiar Ukrainian countryside scenes flash by—endless fields, scattered villages, solitary poplar trees. This was the place she grew up, but she was leaving it for a distant, unfamiliar big city—Kharkiv.\nMost passengers in the carriage were like her, young people heading to the city seeking opportunities. They either excitedly discussed their aspirations for future factory life or stared blankly out the window, their faces tinged with apprehension about the unknown. Recruitment posters plastered the village notice boards: Kharkiv's tractor factory, Dnipropetrovsk's steel mill, Kyiv's construction sites… all summoning young labor. The city offered jobs, higher wages, electric lights, cinemas, and… the future.\nNatasha’s parents didn't want her to leave; village life, though poor, was stable. But Natasha didn’t want to spend her whole life tending a few meager acres, repeating the life of her ancestors. She wanted to see the outside world, learn a skill, live… a different life. The radio announced daily that the country needed builders, that cities needed young people.\nThe train let out a long whistle and began to slow down. Outside the window, low farmhouses gradually gave way to towering chimneys and factory buildings. Kharkiv had arrived. Natasha took a deep breath and squeezed off the train with the crowd. The platform thronged with people, the noise deafening. She felt a little dizzy, but mostly excited. This was the city, full of opportunities, and also full of challenges. She didn’t know if she could gain a foothold here, but she knew she couldn't go back."
 SWRW_RUS.78.a:0 "The train speeds ahead, carrying departing footsteps and city dreams."
 SWRW_RUS.79.t:0 "Argument in the Tavern"
 SWRW_RUS.79.d:0 "In a small tavern by the Dnieper River in Dnipropetrovsk, smoke filled the air and voices buzzed. Several steelworkers, just off their shift, sat around a greasy table, drinking cheap beer, eating black bread and salted fish, loudly arguing about something.\n“I say, Vasyl, you’re wrong!” a burly man with a beard slammed his fist on the table. “Why say we Russians coming here are the same as the Germans? We are the liberators who drove them out!”\n“Liberators?” Vasyl, sitting opposite him, a middle-aged man with sharp eyes and a Ukrainian accent, sneered. “Yes, drove out the wolf, and in came the bear. Before, it was German soldiers on the streets, now it’s your patrols; before, swastikas on the walls, now it’s similar Russian flags; before, we had to learn German, now we have to learn Russian… What’s different?”\n“How is it not different?!” the bearded man flared up. “We brought factories! We brought jobs! We didn’t treat you like slaves like the German devils did! We are all brothers in the great Slavic family!”\n“Brothers?” Vasyl raised his glass and drained it. “Some ‘brothers’ don’t quite treat us as their own. My son was punished at school by that teacher from Moscow just for speaking a few words of Ukrainian! In your newspapers, how many articles are about our Ukrainian heroes? Isn’t it always praising yourselves!”\n“That… that’s a minority situation!” The bearded man was somewhat at a loss for words. “The policy is good, it’s just that people below implement it wrongly… Besides, let the past be past, isn’t it good for everyone to build a new life together now?”\n“The past?” Vasyl’s eyes grew deep and sorrowful. “Some things cannot be forgotten. The Great Famine, the purges, and… the war. This land of ours has shed too much blood, both red and black.”\nSilence fell in the tavern, only the faint sound of a distant radio drifting in. Several young men at the next table seemed to have overheard their argument, exchanging complex glances. Rebuilding trust, forging identity, was far more difficult than repairing a bombed-out bridge."
 SWRW_RUS.79.a:0 "Scars may heal, but they still ache when touched."
 SWRW_RUS.80.t:0 "Meeting by the Mill"
 SWRW_RUS.80.d:0 "The old mill at the village entrance had been cleaned up, whitewashed anew, and adorned with a wooden sign reading “’Common Plowing’ Agricultural Production Cooperative.” Inside the mill, a dozen villagers, men and women, young and old, sat around a long wooden table, intensely discussing something. Scattered on the table were several rough blueprints and notebooks filled with numbers.\n“I think we should turn that low-lying land into a fish pond first!” said Ivan, the cooperative leader, a shrewd and capable former partisan. “Fish farming yields quick results; we can distribute dividends by the end of the year!”\n“No!” someone immediately objected—it was Mikhailo, an experienced old farmer. “That land, though low-lying, has good soil. If we just repair the irrigation ditch, we can grow good vegetables! It’s more reliable than fish farming!”\n“How much labor does repairing the ditch require? How much time? By the time it’s done, the day lily buds will have withered!” Ivan slammed the table.\n“Fish farming is risky! If disease strikes, not a single one will be left!” Mikhailo retorted stubbornly.\n…The debate lasted a long time. Everyone wanted to contribute to the cooperative's development, but their ideas differed. This was a cooperative formed spontaneously by the villagers; the land still belonged to individual families, but tools, livestock, and labor could be shared, with income distributed according to work. It was a new thing, different from the past small-scale farming where everyone fended for themselves, and also different from the state-imposed collective farms. Everyone was exploring, full of enthusiasm, but also full of uncertainty.\nFinally, Anna, the most respected old teacher in the village, stepped in to mediate. “Comrades, stop arguing. How about this: we can use the low-lying land to raise ducks first; it requires less investment and yields quick returns. Meanwhile, everyone contributes some labor to slowly repair the irrigation ditch. By next spring, we can plant vegetables. This way, we don't delay either task. How about it?”\nEveryone looked at each other, finding this compromise feasible. Thus, the new plan was scribbled crookedly into the notebook. Outside, the setting sun slowly descended, casting a warm, hopeful glow on this newly started cooperative."
 SWRW_RUS.80.a:0 "Many hands make light work; the flame may not rise straight, but it always brings warmth."
 SWRW_RUS.81.t:0 "Gifts of the Earth"
 SWRW_RUS.81.d:0 "Olena knelt on the field ridge, scooped up a handful of loose, damp black earth, and inhaled its scent deeply. It was a unique aroma, a blend of humus, rainwater, and plant roots—the smell of life, the distinctive fragrance of this Ukrainian black soil. For centuries, this land had nourished her ancestors and buried her relatives. It had generously offered golden waves of wheat and silently endured the ravages of war.\nHer fingers felt the warmth and power of the soil. Spring had arrived; it was planting season. In the distance, the collective farm's tractors were working, emitting a rhythmic roar. Her husband and son were also busy in the fields, their figures appearing small yet incredibly determined against the vast landscape.\nAfter the war, everything was slowly recovering. Although life remained arduous, and fertilizer and seeds still needed planned distribution, at least the land had returned to the hands of the cultivators, no longer forced to lie fallow or grow alien crops to satisfy the greedy demands of distant empires.\nOlena stood up, brushing the dirt from her knees. She took a handful of plump sunflower seeds from a cloth bag and carefully scattered them onto the freshly plowed soil. She knew that with diligent cultivation, this magical black earth would never fail them. It would once again bloom with golden flowers, bear heavy fruit, like a loving mother selflessly nurturing her children.\nThe wind blew across the fields, carrying the scent of cooking smoke from the distant village. Olena straightened her back, gazing at the boundless fields and the azure sky, her heart filled with peace and an ancient, earth-rooted sense of solidity."
 SWRW_RUS.81.a:0 "Beneath the black earth pulses an unceasing life."
 SWRW_RUS.82.t:0 "Oath Before the Blast Furnace"
 SWRW_RUS.82.d:0 "The massive blast furnace once again spewed fiery molten iron, bathing the entire workshop in an orange glow. Amidst the deafening roar, sweat-drenched workers operated huge mechanical arms, transporting searing steel ingots to the next process. The Azovstal Steel Plant in Mariupol, an industrial behemoth nearly destroyed in the war, was stubbornly regenerating from the ruins.\nAndrei, an experienced furnace master, stared intently at the leaping flames in the furnace mouth, judging the temperature by years of experience. His face was blackened by the intense heat, his arms covered in old scars. During the war, he had led workers to continue production under German shelling until being forced to evacuate at the last moment. Now, he was back, back to the place where he had dedicated most of his youth.\nReconstruction was exceptionally difficult. Much equipment was destroyed or removed by the Germans, workshops were reduced to rubble, and skilled colleagues were dead or scattered. They started almost from scratch, clearing debris, repairing machines, reassembling the workforce. But no one complained; everyone held a suppressed determination.\n“Master Andrei!” a young apprentice ran over, shouting excitedly. “The first batch of qualified molten steel is out! Tested and approved!”\nA smile finally touched Andrei’s tense face. He nodded, pumping his fist vigorously. This wasn't just a batch of molten steel; it was the resurrection call of Azovstal, the hope for Ukraine's heavy industry revival. He could already envision tractors made from their steel racing across fields, new bridges and buildings constructed, weapons forged to defend the homeland.\nThe end-of-shift whistle blew. Workers, dragging their weary bodies, walked out of the workshop, covered in grease and iron filings, yet their eyes shone with light. Andrei stood before the blast furnace, gazing at the ceaselessly flowing molten iron, silently making an oath in his heart: He must make this factory stronger than before, must ensure Ukrainian steel once again supports the nation's spine."
 SWRW_RUS.82.a:0 "The body of steel, reforged in fire."
 SWRW_RUS.83.t:0 "Forest of Chimneys"
 SWRW_RUS.83.d:0 "From Donetsk to Zaporizhzhia, then to Dnipropetrovsk, across the vast expanse of eastern Ukraine, factory chimneys were rising again like bamboo shoots after rain, forming a unique 'forest of chimneys.' The daytime sky was often shrouded in smoke of various colors, while nights were illuminated by the glare of blast furnaces and coking plants. This was the heartland of Ukrainian heavy industry, the engine of national reconstruction.\nIn the iron ore mines of Kryvyi Rih, giant excavators tirelessly gnawed at mountains rich in iron ore. At the Kharkiv Tractor Plant, newly assembled tractors lined the factory square, awaiting shipment across the country. On the dam of the Dnieper Hydroelectric Station, engineers nervously repaired generators damaged by the war.\nSergei, a specialist from the Central Planning Bureau responsible for coordinating production plans among factories, sat on a jolting train, traveling through this vibrant industrial zone. His briefcase bulged with reports, charts, and applications. Every factory lacked funds, equipment, skilled workers, raw materials… problems piled up like mountains. But every time he saw the rising factory buildings, the determined yet weary expressions on the workers' faces, the train cars loaded with coal, ore, and steel, a strong sense of mission surged within him.\nThey were building a powerful industrial base, one capable of supporting national security, improving people's lives, and realizing the dream of modernization. This process might be accompanied by pollution, inefficiency, and various problems, but the overall direction was clear, the forward march resolute. As the train passed a large chemical plant belching thick smoke, Sergei opened the window and took a deep breath of the air, pungent with chemical odors. This, he thought, was the smell of progress."
 SWRW_RUS.83.a:0 "Machines roar, Ukraine's heart beats anew."
 SWRW_RUS.84.t:0 "Order to Initiate Reconstruction Work in the Caucasus Region"
 SWRW_RUS.84.d:0 "To: Responsible Comrades, Caucasus Special Administrative Region (Provisional) Reconstruction Steering Group\nFrom: Makarov, Fifth Office, Southern Bureau, Central Restoration and Development Committee\nSubject: Order to Immediately Initiate the First Phase of Restoration and Reconstruction Work in the Caucasus Region\nTo all Comrades of the Steering Group:\nGiven that the Caucasus region has been liberated from fascist bandits and their vassals, according to unified directives from the Central Committee, it is hereby ordered that the first phase of restoration and reconstruction work in the region begin immediately. The Caucasus region holds a unique geographical position, possesses a complex ethnic composition, and has long suffered from brutal rule and war devastation. The reconstruction task is extremely arduous and profoundly significant. Current core tasks include: One, rapidly conduct a thorough assessment of the damage to the Baku oil fields, Georgian manganese mines, and major transportation routes (especially the Trans-Caucasian Highway and Railway), submit a report, and clarify repair priorities. Two, inventory regional agricultural potential, register land and livestock conditions, and immediately begin preparations to restore subtropical crop cultivation and mountain animal husbandry. Three, organize forces to repair or rebuild basic livelihood facilities in key cities (such as Tbilisi, Baku, Sochi), ensure basic supplies, and stabilize public sentiment. Four, resolutely eliminate remaining hostile armed elements (including but not limited to partisans, former collaborator forces), maintain social order, and strictly prevent sabotage activities. Five, in carrying out the work, pay close attention to the complex local historical legacy issues and ethnic sentiments, and cautiously advance various policies. The Central Committee understands the difficulties involved; subsequent resources will be gradually coordinated. Act immediately, without delay!"
 SWRW_RUS.84.a:0 "The snow mountains bear witness; we vow to rejuvenate this land."
 SWRW_RUS.85.t:0 "Echoes in the Valley"
 SWRW_RUS.85.d:0 "The mules of the geological survey team struggled up the rugged mountain path, their hoofbeats echoing in the vast valley. Artyom, a young geologist from Moscow, wrestled with a crumpled topographical map and a compass, sweat soaking his hairline. Beside him walked his taciturn local guide, an old Georgian named Giorgi, who watched Artyom's clumsy efforts with a faint, almost imperceptible smile mingling pity and mockery.\n“Young man, did the map not tell you that stones also speak?” Giorgi finally broke the silence, his voice as clear as a mountain stream. “Following the sheep’s path is usually more reliable than following the path drawn in ink.”\nArtyom flushed slightly, lowering the map. “Uncle Giorgi, the report says this area has rich manganese and copper deposits, vital for the country's reconstruction. We must find the precise location of the veins.”\nThe old man said no more, merely pointing towards a distant rock face of a slightly darker hue. “My grandfather’s grandfather dug stones from that area, for the Tsar’s cannonballs. Later, for Bukharin’s tanks. And later still… for the Germans’ airplanes.” He sighed. “The mountain stones don’t recognize flags; they only recognize the hands that dig them. You came, so they serve you. When you leave…”\nArtyom followed the old man’s pointing finger. The rock face glowed with a metallic sheen in the setting sun. This magnificent and ancient mountain range generously held the lifeblood of industry, yet it had also impassively witnessed the coming and going of too many conquerors. They were here to take, in the name of the state and the plan, for that grand 'reconstruction' goal. But these mountains, these stones, seemed to have their own unyielding rhythm."
 SWRW_RUS.85.a:0 "Wealth lies hidden deep, awaiting the digging hand, regardless of its origin."
 SWRW_RUS.86.t:0 "Wind off the Caspian"
 SWRW_RUS.86.d:0 "Baku, the wind always carries a thick, oily smell that even the breeze from the Caspian Sea cannot fully dissipate. Derelict old drilling rigs from the 'Nobel Brothers' era stood like rusted skeletons along the shore, forming a strange contrast with the newly repaired, smoke-belching new derricks nearby.\nEngineer Leonid Sokolov, an experienced petroleum expert, stood beside a huge, pitted oil storage tank, gesturing to a group of local Azerbaijani workers, trying to explain a new valve installation plan. His Russian was peppered with a few stiff Azerbaijani words, while the workers watched him with eyes mixing curiosity, skepticism, and weariness.\n“This new pressure valve, it’s the latest model allocated from… above!” Sokolov strained to make his voice heard over the noise of the derrick repairs nearby. “Installing it will increase efficiency, and also… make things safer!”\nAn old worker, his face smeared with oil, wearing a headscarf, asked in a thick accent: “Safe? When the Germans occupied, nobody cared if we were safe; the wells caught fire every few days. Now you’re here. The oil is the same oil, but our lives… are they still our lives?”\nSokolov was momentarily speechless. He knew war and occupation had left deep scars and distrust among the people here. Rebuilding the oil fields wasn’t just about repairing machines and pipelines; it was also about mending hearts. He pointed to the derricks working in the distance: “Old man, look, we are trying to make everything better. The country needs oil, just like a person needs blood. You have experience, we have technology (though much of it is newly learned too). Let’s work together. Baku’s oil will flow again, and life will get better too.”\nThe old worker looked at him silently, then slowly nodded. Perhaps he believed his words, or perhaps simply because, other than working, they had no other choice. The Caspian wind blew past, carrying more roaring sounds of restarting machinery from deep within the oil fields."
 SWRW_RUS.86.a:0 "Can black gold wash away red memories?"
 SWRW_RUS.88.t:0 "Sanatorium Vouchers by the Sea"
 SWRW_RUS.88.d:0 "On the beaches of Sochi, a scattering of people appeared, dressed in various swimsuits (mostly old-style Soviet one-piece suits or homemade beach shorts). They cautiously dipped their feet into the cool Black Sea water, uttering cries of surprise or complaint. In the distance, several formerly luxurious, now slightly dilapidated sanatoriums were undergoing exterior painting and repairs.\n\nMargarita, a waitress working in a local state-run restaurant, was somewhat impatiently serving a table of a 'sanatorium delegation' from Siberia. Most were miners or factory labor models, here on state-awarded sanatorium vouchers, curious about everything, yet also carrying a simple reserve. They always chose the cheapest dishes when ordering, and even hesitated to share a bottle of kvass amongst themselves.\n\n“Comrade, another bottle of kvass!” shouted a loud-voiced miner. Margarita acknowledged and turned to fetch it. She remembered during the German occupation, this place was also filled with 'recuperating' people, but they were impeccably uniformed, arrogant German officers and their mistresses. They spent lavishly and lorded over the locals.\n\nThe people arriving now were different; they were 'one of us,' the 'working people.' Yet Margarita always felt a distance. They came from the remote Russian heartland, spoke with accents she wasn't used to, marveled at the Black Sea's palm trees and warm climate. While she and her family had endured too much turmoil and hardship on this beautiful land, always somewhat skeptical of the 'sunshine, beaches, workers' paradise' depicted in propaganda posters.\n\nOutside the restaurant window, several children chased the waves. The sun was bright, the sea blue. Perhaps, letting people from different places come here to see the sea, relax a bit, was a good thing in itself. At least, it was much better than hearing cannons."
 SWRW_RUS.88.a:0 "The waves of the Black Sea wash upon the sands of different eras."
 SWRW_RUS.89.t:0 "Dots on the Map"
 SWRW_RUS.89.d:0 "The geological survey report lay spread out on the table in the temporary headquarters in Grozny, marked with dense symbols and lines in different colored pencils. An official with thinning hair peered through a magnifying glass at several red dots marked on the map near the Chechen mountains.\n“So, Comrade Petrenko, are you certain these marks represent… oil?” He looked up, asking the weary-eyed geology team leader beside him, who wore mud-caked survey gear.\n“Reasonably certain, Comrade Director,” Petrenko rubbed his eyes. “Based on our preliminary drilling samples and geological analysis, this area contains significant underground oil and gas reserves. The volume could be… quite substantial.”\nThe official’s eyes lit up. “Substantial? Excellent! Excellent! This means we’ve found a new energy base besides Baku! This is a huge boost for the reconstruction of the Caucasus and the entire country!” He rubbed his hands excitedly. “We must immediately organize forces, intensify exploration, and formulate an extraction plan as soon as possible!”\nPetrenko hesitated for a moment. “Comrade Director, the situation might be… somewhat complex. These areas are mountainous, rugged terrain, with difficult access. Moreover… the local inhabitants, mainly Chechens, they seem… unwelcoming towards our exploration activities. Some team members reported hearing gunshots at night, and some equipment was inexplicably damaged.”\nThe official’s excitement instantly faded, replaced by a gloomy expression. “Unwelcoming? Humph, this is our country’s land; the underground wealth belongs to all the people! What right do they have to be unwelcoming?” He rapped the table. “Comrade Petrenko, your task is to find oil, not handle local relations! Security issues will naturally be handled by comrades responsible for security. You just need to tell me, can the oil be extracted!”\nPetrenko looked at the bright red dots on the map, seeming to see the black oil that might gush forth in the future, and also sensing the unpredictable conflicts and troubles that would inevitably follow."
 SWRW_RUS.89.a:0 "Underground wealth often comes hand-in-hand with surface strife."
 SWRW_RUS.90.t:0 "Trucks Towards the Mountains"
 SWRW_RUS.90.d:0 "A convoy of dusty trucks moved slowly along the winding mountain roads, their beds crammed with immigrant families from central Russia. They carried all their possessions—tightly bound bedding rolls, creaking old wooden chests, and a few chickens stuffed into cages. Children's faces pressed against the gaps in the truck's sideboards, curiously and timidly gazing at the unfamiliar, rolling Caucasus mountains outside.\nValentina held her young son tightly, her heart filled with both anticipation and anxiety about the future. Government propagandists had depicted the Caucasus as a sunny, fertile land awaiting settlers to cultivate. They said there was fertile land to be distributed, new factories needing workers, and the state provided resettlement subsidies. For them, who scraped a living from the soil back in Ryazan and saved barely a few rubles year-round, this seemed like a godsend.\nHowever, when the trucks rolled into a somewhat dilapidated Dagestani village, they weren't greeted by the enthusiastic scenes depicted in the posters. Some local villagers in traditional clothing stood by the roadside, eyeing these 'outsiders' with a scrutinizing, less than friendly gaze. The air was filled with the smell of unfamiliar language and food. The village houses were mostly low and old, far from the 'modernized new countryside' described in the propaganda.\nThe official in charge of resettlement, a Russian cadre who also looked somewhat weary, led them to a row of newly erected, rather basic wooden plank houses. “Comrades, you’ll stay here for now,” he said, pointing at the houses. “Land and job placements are being coordinated and will be arranged soon. Everyone must foster unity with the local comrades, help each other, and jointly build our great homeland!”\nValentina looked at the unfamiliar mountains, unfamiliar people, unfamiliar houses, her heart filled with panic. Was this truly the new homeland they dreamed of? Could they put down roots here? She didn't know. She only knew they couldn't go back."
 SWRW_RUS.90.a:0 "The new homeland: a promise, and an unknown migration."
 SWRW_RUS.91.t:0 "Whispers in the Market"
 SWRW_RUS.91.d:0 "Tbilisi market: noisy, crowded, filled with the mixed scents of various spices, grilled meat, and cheap tobacco. Nikolai (colleagues privately called him 'Nik,' but he preferred Nikolai Ivanovich, though his official title was merely an inconspicuous field agent for the Ministry of Internal Affairs) was pretending to casually select some local cheese. His task was to gather clues about 'unstable sentiments'—in plain terms, to overhear what the common folk were grumbling about privately.\n\nHe wore civilian clothes, trying hard to look like an outsider newly arrived and curious about everything. An old Georgian man with a white beard, wearing a traditional chokha, eyed him sharply, then asked in broken, heavily accented Russian: “Also… German?”\n\nNik flinched, nearly dropping the cheese. He quickly scanned his surroundings; thankfully, no one had noticed. “Old man,” he said, keeping his tone as calm as possible, “the Germans were driven out long ago. It’s a new era now.”\n\nThe old man snorted, said nothing more, but continued to observe him with those world-weary eyes, full of suspicion and an indescribable fatigue. “The flag changed, the people changed,” the old man muttered after a while, as if to himself, or perhaps to Nik. “But for us stones, it doesn't matter which way the wind blows; we still get worn down.”\n\nNik didn't reply. He knew arguing was pointless. To many locals, these Russians from the 'Center' seemed no different from the previous German occupiers—both represented external power and the inability to control their own destiny. He paid, took the cheese, and silently squeezed out of the crowd. The market remained bustling, but the question “Are you also a Nazi?” stuck in his mind like a small thorn, pricking a long-numb corner of his heart. This job… was really getting tiresome.\n\n"
 SWRW_RUS.91.a:0 "Labels change easily; scars do not."
 SWRW_RUS.92.t:0 "Hunter in the Fog"
 SWRW_RUS.92.d:0 "Dense morning fog filled the Chechen valley, visibility less than ten meters. Nik and his small squad trudged through the slippery mountain path, everyone exceptionally tired and vigilant. Last night's intelligence indicated that a small group of 'nationalist militants' (the official term now, sounded more… formal than 'bandits' or 'rebels') might be hiding in a nearby abandoned aul (mountain village).\n\n“Boss, in this damned weather, you can’t even see a goat, let alone a person,” a young private complained, his breath condensing into white mist in the cold air.\n\n“Shut up, Arseny!” Nik snapped in a low voice, his eyes fixed on the looming mountain shadow ahead. “Weather like this is exactly when things happen easily. Keep your eyes peeled!” He himself felt a wave of irritation. These damn mountain paths were more convoluted than a woman's thoughts, and those 'militants' knew the terrain like wolves knew their territory. Every operation felt like searching for a needle in a haystack, and the needle could bite back at any moment.\n\nHe remembered his younger days fighting Germans in the Belarusian forests—crawling through woods like this, constantly on edge. Only then, he was the prey; now he was the hunter. Ironically, the feeling of pursuing and being pursued was so similar. Always battling fear, fatigue, and ubiquitous danger.\n\nReaching a ridge, the local guide (a taciturn man with a scar on his face) suddenly stopped, pointing towards a wisp of faint smoke visible where the fog thinned slightly below. “There,” he said, just two words.\n\nNik immediately gave a hand signal. The squad quickly dispersed, forming an encirclement, then began cautiously moving downhill. Through the fog, only the faint outlines of a few ruined stone houses were visible. The air carried the smell of damp firewood burning, and… a faint, elusive scent of gunpowder. They knew the prey might be ahead."
 SWRW_RUS.92.a:0 "Fog thick, path slippery; the hunter is also the hunted."
 SWRW_RUS.93.t:0 "Gunsmoke in the Air"
 SWRW_RUS.93.d:0 "As they approached the abandoned aul, the fog lifted slightly. Nik and his men saw several figures moving among the stone houses, seemingly carrying weapons. Without warning, without shouting, almost reflexively, both sides opened fire nearly simultaneously.\n\nGunshots shattered the silence in the valley, startling a flock of crows. Bullets whizzed past Nik's ear, striking the rock beside him, sending chips flying. He immediately hit the ground, firing towards where he remembered seeing the figures flash.\n\nThe firefight was brief and fierce. The enemy clearly hadn't expected them so soon, and their firepower was inferior. After a few exchanges, the gunfire gradually subsided. Nik signaled two soldiers to scout ahead while he and the rest provided cover.\n\nShortly after, the soldiers reported back: the enemy seemed to have retreated, leaving behind two bodies, some scattered ammunition, and a still-warm campfire. “Damn it, they got away again!” young Private Arseny cursed, kicking an empty shell casing on the ground.\n\nNik examined the scene. The dead wore tattered traditional clothing; their weapons were old Mosin-Nagants and a captured German pistol. Some leftover dry rations and several blurry leaflets were scattered on the ground, printed with Chechen script he couldn't read and a portrait he didn't recognize. They wanted to fight a guerrilla war, but clearly lacked training and equipment.\n\n“Collect anything useful, the bodies… dispose of them on site,” Nik ordered emotionlessly. He looked at the layered mountain ranges in the distance, knowing this was only a temporary calm. These people, like unkillable rats, hid in these mountains, ready to pop out again at any moment. “We might have more experience, better weapons,” he thought, “but they have these mountains, and… some kind of rage we can’t understand.” He felt a profound weariness, not just physical."
 SWRW_RUS.93.a:0 "Gunsmoke clears, only the mountains remain silent."
 SWRW_RUS.94.t:0 "Lists in the Office"
 SWRW_RUS.94.d:0 "Grozny, temporary office of the Ministry of Internal Affairs. The air hung heavy with the smell of cheap tobacco and musty, accumulated files. Nik stared despairingly at a thick pile of dossiers. These were lists of 'collaborators' and interrogation records inherited from the German occupation period and the local puppet regime—a confusing tangle of truth and falsehood.\n\nHis task was to sift through this material and determine who were the 'heinous criminals who must be purged,' who were the 'opportunists who could be reformed and utilized,' and who were the 'coerced or uninformed ordinary people who could be overlooked.' It was a hot potato, deciding the fates of countless individuals. The slightest mistake could create new injustices or let real dangers slip through.\n\nThe phone on his desk rang. It was his superior. “Nikolai Ivanovich,” a dispassionate voice came through the line, “when will the processing recommendations for the former officials of the ‘Mountain Autonomous Government’ be ready? The higher-ups are pressing hard; a preliminary list must be submitted next week.”\n\n“Working on it urgently, Comrade Director,” Nik rubbed his throbbing temples. “There’s too much disorganized material, many testimonies contradict each other, verification takes time.”\n\n“Time waits for no one, Ivanovich!” The voice on the other end sharpened. “Stability is the top priority! We need to clear out those ‘unstable elements’ as soon as possible! Of course, pay attention to tactics, try to divide and disintegrate, avoid expanding the crackdown unnecessarily and causing needless panic. The specifics… handle them yourself. In short, next Monday morning, I want that list on my desk!”\n\nThe phone clicked dead. Nik looked at the mountain of files before him, each recording the fate of individuals struggling to survive in the complex land of the Caucasus under shifting regimes. Some had groveled to survive, some had betrayed compatriots for profit, some had drifted along in despair, some might have genuinely believed in the Nazi 'New Order'… How could he, with the pen in his hand, draw the line between life and death? He felt a sense of powerlessness and weariness."
 SWRW_RUS.94.a:0 "Behind every file hides a soul difficult to judge."
 SWRW_RUS.95.t:0 "A Knock at the Door in the Night"
 SWRW_RUS.95.d:0 "Late at night, in a silent alley in Grozny, several sharp, low knocks sounded. The oil lamp inside flickered; a pale-faced middle-aged man looked towards the door in terror. His wife gripped his arm tightly, her body trembling uncontrollably.\n\nA low, calm voice came from outside, speaking standard Russian: “Aslan Magomedov? Open the door, Ministry of Internal Affairs.”\n\nThe man took a deep breath, forcing himself to remain calm. “What is it?”\n\n“Routine questioning, open the door quickly!” The voice grew impatient.\n\nThe man hesitated, then finally opened the bolt with trembling hands. Two plainclothes men in black leather jackets stood outside. One was Nik, the same agent who had been studying files in the office during the day. His eyes were cold, expressionless.\n\n“Come with us,” Nik said curtly.\n\n“I… what have I done?” the man stammered.\n\n“You’ll find out when you get there.” The other plainclothes agent stepped forward, grabbing the man’s arm assertively.\n\n“No! Let him go! He hasn’t done anything!” The man’s wife screamed, rushing forward, only to be roughly pushed aside.\n\nNik ignored the woman’s cries, simply motioning for his colleague to take the man away. The man was pushed and shoved, stumbling down the stairs, disappearing into the night. Only the woman’s desperate sobs and the flickering light of the oil lamp remained in the alley.\n\nNik leaned against the cold wall, lighting a cigarette. The next name on the list was across town. This was his third 'target' tonight. He didn’t know what their ultimate fate would be—trial? Labor camp? Or… something else? He only knew this was his job, the price necessary to maintain 'stability,' or rather, the price paid by others. He exhaled a ring of smoke, the haze blurring his face in the darkness."
 SWRW_RUS.95.a:0 "The night is deep; knocks echo throughout the city."
 SWRW_RUS.96.t:0 "Sparks on the Viaduct"
 SWRW_RUS.96.d:0 "A massive viaduct connecting two cliffs in the Georgian mountains was under intense construction. At night, the site blazed with lights, bright as day. Blinding arcs of electric welding periodically flashed across the night sky, accompanied by a sizzling sound, turning the workers on the bridge deck into dancing silhouettes.\n\nPavel, an experienced welder, was fully focused on joining two enormous steel beams. Sparks flew, and waves of searing heat washed over him. Wearing a thick protective mask, he could only see the dazzling melting point at the weld seam through the dark glass. This job required exceptional skill and concentration; the slightest error could not only compromise the structure's quality but also endanger lives.\n\nThis bridge was a key node in the “Caucasus Transport Artery Modernization and Transformation” plan. Once completed, it would significantly shorten travel time between the mountainous region and the outside world, facilitating the transport of goods and people. During the day, he could see the deep valley and winding river below the bridge—a magnificent but also daunting view.\n\nDuring a break, Pavel removed his mask, revealing a face covered in sweat and grime. He took a coarse porcelain mug of scalding hot tea from a coworker. “Damn hard work,” he panted. “The wind in these mountains is too strong, always blowing the flame askew.”\n\n“Tell me about it,” said the coworker, a young man from Smolensk. “But the boss said there’ll be bigwigs cutting the ribbon at the opening ceremony next month! We’ll get to show our faces then!”\n\nPavel chuckled but said nothing. He didn't care much about bigwigs cutting ribbons. He just hoped this bridge would stand strong, making travel easier for the mountain folk, so children wouldn't have to cross mountains to get to school. To have personally welded such a bridge spanning a chasm was pride enough for him."
 SWRW_RUS.96.a:0 "The steel dragon is crossing the chasm."
 SWRW_RUS.97.t:0 "Ski Slopes Under the Five Rings"
 SWRW_RUS.97.d:0 "Sochi, construction site of the Rosa Khutor ski resort, a scene of feverish activity. Brand-new cable car pylons were being installed, the outlines of wide ski slopes had already taken shape, and several modern-looking athlete apartments and hotels were rising rapidly. In the distance, the Black Sea sparkled under the sun.\n\nProject Chief Engineer Viktor Andreyevich held a huge roll of blueprints, effusively explaining to a group of officials from Moscow and locals: “…According to International Olympic Committee standards, the vertical drop and gradient of this downhill ski slope fully meet requirements! And here, this will be our main stadium, capable of holding fifty thousand spectators; the opening and closing ceremonies will be held here! We are confident that in 1988, we will present to the world a brand new, vibrant Sochi, a modernized, open…”\n\nThe officials nodded frequently, their faces beaming with excitement and pride. Hosting the Winter Olympics was not just a sporting event; it was an excellent opportunity to showcase the national image, attract investment, and promote development. Huge promotional billboards already stood at the entrance to the site, featuring a cute mascot (a brown bear named 'Misha,' although suspiciously similar to the Summer Olympics one?) and the vibrant five-ring logo.\n\nHowever, amidst the optimistic atmosphere, there were also discordant notes. The local official responsible for land acquisition and relocation complained in a low voice to Viktor: “Comrade Engineer, the mountain land occupied by the ski resort has been the traditional grazing ground for local mountain folk for generations. Compensation hasn't been fully paid yet, and some people are rather agitated…” The official responsible for material supply looked worried: “Comrade Viktor, that batch of snowmaking machines imported from Japan is still stuck at customs; we can’t get the foreign exchange quota approved…”\n\nViktor waved his hand somewhat impatiently. “Difficulties are temporary, comrades! We must look at the long term! Think about it, when the Olympics are successfully held, the eyes of the whole world will be focused here! These minor problems can always be solved! The key is, we cannot delay the project progress! In 1988, Sochi must amaze the world!” He pointed to the magnificent main stadium on the blueprint. “For this goal, all sacrifices are worthwhile!”\n\n"
 SWRW_RUS.97.a:0 "Before the ski slopes are built, some things must first be leveled."
 SWRW_RUS.98.t:0 "Goblets and Roast Lamb"
 SWRW_RUS.98.d:0 "In the center of Tbilisi, the newly restored opera house glittered with lights. A grand reception celebrating the 'initial completion of reconstruction' in the Caucasus region was underway. Melodious Georgian traditional music echoed beneath crystal chandeliers. Officials and military officers in crisp uniforms, along with a few local 'advanced representatives' dressed in national costumes looking slightly awkward, mingled, holding champagne glasses, exchanging pleasantries and toasts.\n\nThe banquet hall's long tables groaned under the weight of abundant food: fragrant roasted whole lamb, various types of Khachapuri (cheese bread), colorful salads, and Georgian red wine, said to be Stalin's personal favorite. Everything seemed harmonious, prosperous, imbued with the spirit of 'brotherly unity and friendship among all nations.'\n\nNikolai Ivanovich (our old friend Agent Nik) was also invited to this reception, a sort of commendation for his recent 'effective stabilization work.' He stood in a corner holding a glass of red wine, feeling somewhat out of place observing the scene. Just a few weeks ago, he was interrogating 'unstable elements' in some dusty mountain region, and now he was supposed to celebrate the 'initial completion of reconstruction' with these elegantly dressed people.\n\nHe saw an old man with a wrinkled face, wearing a traditional Azerbaijani robe, surrounded by several officials, holding his wine glass somewhat bewilderedly. This old man was reportedly the chairman of a model collective farm. Nik then saw a young man in a new suit with slicked-back hair, effusively presenting the grand blueprint of some 'joint venture' to a high-ranking official, his eyes gleaming with shrewd calculation.\n\nThe music remained melodious, glasses clinked continuously. Reconstruction was real; factories were running, roads were extending, living standards were indeed improving. But Nik always felt that beneath this harmonious surface, various complex, unresolved undercurrents still surged. Where had the people he sent away gone? What were the true thoughts deep within the hearts of these 'united' nations? He took a sip of red wine; it was full-bodied, yet carried an indescribable bitterness."
 SWRW_RUS.98.a:0 "Glasses raised, shadows hide where lights gleam brightest."
 SWRW_RUS.99.t:0 "New Faces at the University"
 SWRW_RUS.99.d:0 "The campus of Yerevan State University buzzed with youthful energy. Restored classroom buildings had clean, bright windows, and students walked in twos and threes along tree-lined paths, clutching books, passionately discussing something in Armenian and Russian. Notice boards were plastered with flyers for lectures, club activities, and recruitment drives for 'supporting frontier construction.'\n\nIn a large lecture hall in the History Department, a visiting professor from Leningrad (or perhaps it wasn't called that anymore) was teaching a course on “The Common History and Future Prospects of Russia’s Peoples.” The students below were a diverse mix: local Armenian youth, many children of recent immigrants from various parts of Russia, and even a few exchange students from Georgia and Azerbaijan.\n\nThe professor's voice was loud and infectious: “…Comrades, students! We must recognize that the future of the Caucasus, indeed the future of the entire nation, lies in the unity and fusion of all nationalities! The barriers and prejudices of the old era must be thoroughly discarded! Within the framework of a unified, strong nation, we must respect each other's cultural traditions, leverage our respective strengths, and jointly create a brand new, prosperous ‘New Caucasus’!”\n\nSitting in the back row, Armen, a native Yerevan lad, listened while doodling in his notebook with a pencil. He admitted that life was indeed much better than before; at least there was no more fear of war and scarcity. The university also had many new faces, bringing new ideas and vitality. But sometimes, hearing those overly grand and monolithic slogans still made him feel a little uncomfortable. His grandfather had told him that Armenia had its own unique history and suffering, not simply covered by the term 'brotherly nation.'\n\nAfter class, Armen walked out of the lecture hall with a Russian girl named Olga. Olga had recently moved here with her engineer father and was curious about everything in Yerevan. “Armen, do you think that ‘New Caucasus’ the professor talked about can really be achieved?” she asked curiously.\n\nArmen shrugged, gazing at the hazy outline of Mount Ararat in the distance. “Who knows?” he said. “Maybe. At least, we can discuss it now in the same classroom.” Sunlight fell on their young faces. The future, like a newly opened book, was full of unknowns, but not entirely dark."
 SWRW_RUS.99.a:0 "Same desks, different historical echoes."
 SWRW_RUS.101.t:0 "Sunset on the Bench"
 SWRW_RUS.101.d:0 "The golden glow of sunset flowed like melted honey over the rooftops of Tbilisi, dyeing the peaks of the distant Caucasus snow mountains a magnificent crimson. The meticulously renovated city center park, with newly planted roses blooming profusely in flowerbeds, filled the air with a faint sweet fragrance. On a bench sat two silent figures.\n\nThey were Nikolai Ivanovich and the weary shadow within his own heart. No, there was no one beside him; the bench was empty, just him, having just finished a day of tedious yet crucial paperwork, or perhaps a secret interrogation, or maybe just a mundane street patrol. He loosened the button at his collar; the cheap fabric felt rough against his skin. The park was quiet, save for the distant, bell-like laughter of children and the cooing of pigeons, along with the background hum of the city gradually quieting down in the twilight.\n\nThe report stated: “First phase of reconstruction work in the Caucasus region successfully completed. Social order is stable, economic activity has resumed orderly, people's living standards have significantly improved, ethnic relations are fundamentally harmonious…” He had personally signed several such reports. Numbers don't lie, do they? The mileage of repaired roads, the number of newly built schools, the increase in power generation, the decrease in crime rates… Yes, compared to the ruins and chaos of a few years ago, everything looked much better. People's faces no longer constantly wore fear and despair, and shop shelves were much fuller. The lights at night were indeed brighter. This was undeniable.\n\nHe took out a cigarette, lit it, and took a deep drag. Through the swirling smoke, he saw an old veteran with a cane hobbling past, a few old medals faintly visible on his chest. He saw a young couple walking by, huddled together, whispering in Georgian he couldn't understand. He saw several workers in similar uniforms walking past, laughing and talking, discussing tomorrow's shifts and canteen food.\n\nLife went on, with an almost stubborn tenacity, continuing amidst the rubble and new concrete. This land had absorbed too much blood, witnessed too many flag changes; it had its own ancient soul, difficult to be completely 'reconstructed.'\n\n“Hey, Nik,” a voice seemed to whisper in his heart—perhaps a hallucination from the day's fatigue, perhaps the last murmur of a forgotten interrogatee—“do you think… our children… what will happen to them in the future?”\n\nWho cares. He scoffed inwardly, with a uniquely Russian blend of weary, cynical dark humor. I haven’t had a proper relationship in almost twenty years myself, where would I get children? To hell with children. Screw them.\n\nHe felt as if someone had really been sitting next to him just now, but had now vanished like smoke. Who was it? The ‘collaborator’ he interrogated this afternoon? The ghost of the ‘partisan’ killed in the mountains yesterday? Or… some younger version of himself, who still believed in something?\n\nWhatever, hahaha. He chuckled softly, dryly. Did it matter? Not anymore.\n\nThe sun completely sank behind the distant mountains; the last glimmer of light vanished from the horizon. Park streetlights lit up one by one, casting dim yellow halos. Tomorrow was another day, new reports, new tasks, new… life. Who cares, the sun will always rise. He stood up, brushed the cigarette ash from his clothes, and walked towards his small, safe apartment."
 SWRW_RUS.101.a:0 "So be it. Goodnight, Caucasus."
 SWRW_RUS.102.t:0 "The Horn Sounds from the Red Walls"
 SWRW_RUS.102.d:0 "The ancient red walls of the Kremlin reflected a deep, resolute light under the rising morning sun. Snow had not yet completely melted, but a hint of thaw could already be sniffed in the air. In a newly renovated hall, still smelling faintly of fresh paint, the indicator light on a radio lit up. A steady, clear voice, tinged with barely concealed weariness yet full of strength, carried through the airwaves across the vast land just emerging from war and division, even crossing borders to reach a world still reeling.\n\n“Peoples of all Russia! Friends around the world! Brothers and sisters!”\n\n“We have experienced a night as deep as the abyss. The iron heel of fascism trampled our homeland; the bayonet of division pierced our heart. Hunger, fear, humiliation, fratricide… these words were once the footnotes of our lives. Too many lost their homes, lost loved ones, lost hope. We once thought this great land would forever sink into darkness.”\n\n“But!” The voice suddenly rose, carrying a long-suppressed cry. “We did not surrender! The soul of Russia is indomitable! From the frozen Arctic tundra to the rolling waves of the Don, from ravaged Smolensk to Kazan city that has seen empires rise and fall, the people never gave up! Partisan bonfires burned in the forests, factory machines roared under artillery fire, mothers fed children with their last piece of black bread, soldiers built a great wall with their flesh and blood!”\n\n“Today, we stand here, beneath the red walls of the Kremlin, to declare to the world: the division is over! Tyranny has been overthrown! A unified Russia is reborn from the flames!”\n\n“Yes, we are scarred and devastated. The path of reconstruction is long and arduous. But we are no longer alone, no longer divided! Cities will be rebuilt, villages will be revitalized, factories will roar again, fields will yield harvests once more! We must heal the wounds, mend the fissures, allow all people living on this land, regardless of ethnicity or faith, to enjoy peace, dignity, and sustenance!”\n\n“We extend our hands to the world—not in supplication, but in invitation! Inviting all forces that cherish peace and oppose oppression to join us in building a better future! Let the bells of the Kremlin toll the dawn of a new era! Russia has awakened!”\n\nStirring music swelled from the radio, replacing the powerful voice. In distant villages, in newly reopened factories, in makeshift refugee camps, countless people paused their work, listening silently, tears glistening in their eyes—perhaps from sorrow, perhaps from excitement, perhaps… both."
 SWRW_RUS.102.a:0 "The dawn on the horizon has pierced the long night."
 SWRW_RUS.103.t:0 "The Broadcast Van on the Dirt Road"
 SWRW_RUS.103.d:0 "On a dusty dirt road, a GAZ truck painted with a striking red slogan (“State Care Delivered Home”) crawled slowly like a clumsy beetle. A large loudspeaker was mounted on its roof, and inside the cabin sat several young people in uniform, looking somewhat tired. They were members of the newly formed 'Urban-Rural Liaison Propaganda Work Team.' Their mission was to bring the 'voice from the Center' and some scarce supplies (mainly salt, soap, matches, and propaganda leaflets) to remote villages far from main roads, almost forgotten.\n\nToday, they were headed to a small village called 'Muddy Hollow'—the name itself indicated the road conditions. The truck got stuck several times, forcing the team members to get out and push, getting covered in mud. The young team leader, Ilya, a passionate recent graduate from a pedagogical institute, felt a bit apprehensive looking out at the seemingly endless, somewhat desolate fields and scattered thatched huts. The 'close urban-rural integration, workers and peasants advancing hand-in-hand' described in textbooks seemed quite distant from the reality before him.\n\nFinally, the truck swayed into Muddy Hollow. The village was quiet, except for a few skinny dogs barking warily. Some villagers in tattered clothes peeked out from their houses, observing these 'city folk' with a mixture of curiosity, numbness, and slight mistrust.\n\nIlya cleared his throat, turned on the loudspeaker on the roof, and began playing a pre-recorded broadcast: “Fellow villagers of Muddy Hollow! The Party and the state have not forgotten you! We bring you care and warmth…” The broadcast was enthusiastic, promising a wonderful future life: new roads, new schools, tractors, fertilizer…\n\nThe villagers gradually gathered, but mostly stood at a distance, listening silently. A white-haired old woman walked forward tremblingly, clutching an egg in her hand. “Kind people, can I trade this for some salt? Haven’t had salt at home for almost a month.”\n\nIlya quickly had a team member bring out salt, firmly refusing the old woman’s egg. “Grandma, this is distributed free by the state!” He tried hard to make his smile look sincere. The distribution of supplies was somewhat chaotic but quickly became orderly. The children were happiest; they received a small bar of soap, finding it incredibly novel.\n\nSupplies distributed, broadcast finished. The truck started up again, heading to the next, even more remote village. Ilya looked back at Muddy Hollow and the villagers standing at the entrance watching them leave, his feelings mixed. The supplies they delivered might only alleviate hardship for a few days, and the promises in the broadcast sounded rather distant. But at least, they had come, brought information, made contact, breaking the long-standing isolation. Perhaps that was the meaning of it all."
 SWRW_RUS.103.a:0 "The longest road is the one to people's hearts."
 SWRW_RUS.104.t:0 "Prosthetics and the Rehabilitation Center"
 SWRW_RUS.104.d:0 "On the outskirts of Minsk, a rehabilitation center converted from old military barracks filled the air with the smell of disinfectant and the faint sounds of various apparatus. It housed veterans and ordinary civilians who had lost limbs or suffered other severe disabilities during the war.\n\nSeryozha, a young man in his early twenties, was gritting his teeth, trying to walk with his new, somewhat clumsy prosthetic leg. Sweat trickled down his forehead; each step felt like walking on knives. His left leg had been blown off by a German grenade during street fighting in Kyiv. When he woke up, he was already in a rear hospital, the leg that once let him run and play football gone forever.\n\nAnna, a technician at the rehab center (whose husband had also died at the front), patiently supported him, encouraging him. “Try again, Seryozha! Step steady, yes, like that! You’re doing great!” Anna’s voice was gentle yet firm.\n\nIn the next room, several older veterans were learning to write or do simple crafts with prosthetic hands. One man, formerly a sniper, now struggled to thread a needle with a hook-like prosthesis. An atmosphere mixing pain, frustration, and stubborn hope permeated the air.\n\nAt night, Seryozha lay on his dormitory bed, staring blankly at the ceiling. Outside the window came the sounds of other rehabilitants moving about and occasional suppressed sobs. He missed his leg, missed the feeling of running, missed playing football with his buddies. He also feared the future. What could a one-legged man do? Could he still find work? Could he still marry and have children?\n\nAnna came in, bringing him a cup of warm milk. “Can’t sleep?” she asked softly.\n\nSeryozha nodded.\n\n“Don’t lose heart, Seryozha,” Anna sat beside his bed. “You’re still young; losing a leg isn’t the end of the world. The country needs you, maybe not on the battlefield, but in the factories, in the fields, you are needed. They’ll teach you new skills here, fit you with the best prosthetics. You will stand up again, live again.” Her eyes shone with sincerity and a strength born only from enduring hardship.\n\nSeryozha looked at Anna, then at the cold prosthetic leg beside his bed. Maybe she was right. The pain was real, the loss eternal, but life had to go on. Tomorrow, he would continue practicing walking, step by step, relearning how to stand on this land."
 SWRW_RUS.104.a:0 "Even with faltering steps, one must walk towards tomorrow."
 SWRW_RUS.106.t:0 "Shanties by the River"
 SWRW_RUS.106.d:0 "The icy wind off the Volga River blew through the makeshift shantytown on its banks, bringing biting cold. Varvara tightened the threadbare man's coat around her, trying to wrap her little son Ivan, huddled in her arms, more closely. They came from the distant Ural region, where terrible conflict and famine had occurred. They fled westward, hoping to find a livelihood in this land said to have 'restored order.'\n\nPeople from all directions gathered here: Russian refugees like themselves, Central Asian nomads caught up in the war, Jewish survivors lucky enough to escape German concentration camps, and some unidentified drifters with wary eyes. They spoke different languages, had different pasts, their only commonality being poverty, hunger, and uncertainty about the future.\n\nA fierce argument erupted from a nearby shack, apparently over a bit of firewood for heating. Varvara lowered her head, daring not to look. Order here was fragile; conflicts often broke out. The official relief station was overcrowded, and the distributed food was far from enough. She didn't know how much longer they could hold on here. Her husband had died of illness on the escape route; now only she and Ivan were left, relying on each other.\n\nThe sound of footsteps approached. A government worker in uniform, looking equally exhausted, came over, holding a registration book. “Name? Where from? Any special skills?” he asked robotically, without even looking up at Varvara.\n\nVarvara gave her name and origin. As for skills… she shook her head; she only knew farming and housekeeping. The worker made a few marks in his book, then pointed towards a huge complex spewing black smoke in the distance. “Report there tomorrow. The city textile factory needs workers. They provide food, maybe housing too.” Without waiting for Varvara’s thanks, he hurried off to the next shack.\n\nVarvara stared at the massive factory complex, her heart filled with both fear and a glimmer of hope. Go to a factory? She had never been inside one, didn't know what it was like. But at least, there would be food, a place to stay, maybe… maybe Ivan could survive."
 SWRW_RUS.106.a:0 "On this land, survival comes first."
 SWRW_RUS.107.t:0 "The Roar of the Textile Mill"
 SWRW_RUS.107.d:0 "The textile mill workshop was deafening; thousands of old looms operated simultaneously, creating a roar like a waterfall. The air was thick with cotton lint, machine oil, and sweat. Varvara, along with dozens of other newly arrived female workers, was learning to operate these complex and dangerous-looking machines under the guidance of an expressionless female foreman.\n\nBroken threads had to be quickly retied, jammed shuttles immediately dealt with. The slightest carelessness could result in fingers being injured by the moving machinery. This was incredibly difficult for Varvara; she was used to the openness of the fields and the solidity of the earth, while everything here made her feel dizzy and oppressed. Sweat streamed down her cheeks, mixing with cotton lint, itchy and uncomfortable.\n\nThe Tatar girl next to her, also new, seemed even less adapted, having already broken several shuttles and been harshly scolded by the foreman, her eyes red. Varvara wanted to comfort her, but the immense noise drowned out even her own voice.\n\nTwelve hours of work each day, with only a half-hour break for meals. Food consisted of black bread, vegetable soup, and occasionally a tiny bit of salted fish. The dormitory was a large open room where dozens squeezed together, the air foul, snores constant. Wages were very low, barely enough for her and Ivan to survive.\n\nBut this was the best place she could find. At least, there was a roof over their heads, regular food rations, and Ivan had been placed in the factory nursery. Although conditions there were also basic, at least he was safe. Remembering the hungry, precarious days in the riverside shanty, she gritted her teeth and continued to focus on the rapidly operating machine before her. She had to learn, had to endure."
 SWRW_RUS.107.a:0 "The machines devour thread, and also time."
 SWRW_RUS.108.t:0 "Relocation Notice"
 SWRW_RUS.108.d:0 "Varvara had just finished her shift and dragged her exhausted body back to the crowded dormitory when she saw a new notice posted on the wall. She couldn't read, so she grabbed a Russian girl from the same dorm who could. “Zoya, what does this say?”\n\nZoya read it to her: “Notice: To support key national construction projects and optimize labor resource allocation, upon decision by higher authorities, a portion of the staff and dependents from this factory will be transferred to work at the newly built Kuzbass Integrated Iron and Steel Works in… Siberia. The list of transferred personnel is as follows…”\n\nThe list was long. Zoya read for quite a while before finally reaching Varvara’s name.\n\n“Go… to Siberia?” Varvara’s heart sank. She had just found a semblance of stability here, and now she was to be uprooted again, sent to that legendary land of ice, snow, and desolation? “Why me?”\n\n“The notice says priority is given to… uh… personnel with ‘simple social connections, no local ties.’” Zoya looked at her with some sympathy. “Also, comrades with experience in rural life and ability to endure hardship will be prioritized…”\n\nVarvara understood. A widow like her, with a child, no relatives, was precisely the easiest target for ‘optimized allocation.’ She felt as if she were back on the road fleeing, helpless, pushed forward by an immense force towards a completely unknown direction.\n\n“Can I refuse to go?” she asked, trembling.\n\nZoya shook her head. “The notice says this is the nation’s need, a glorious task. Refusal… will have serious consequences.”\n\nThat night, Varvara held Ivan close, unable to sleep. She didn’t know what Siberia was like, how dangerous the steel mill work would be, whether they could adapt to the climate. She only knew they were on the move again. She hugged her son tightly, as if he were the only real thing she could hold onto."
 SWRW_RUS.108.a:0 "The vastness of the land sometimes means nowhere to run."
 SWRW_RUS.109.t:0 "Ghost in the Cellar"
 SWRW_RUS.109.d:0 "“Is it clear inside?” Captain Petrov wiped sweat from his brow, asking the two soldiers who had just emerged from the cellar of the abandoned farmhouse. This was a small village not far from Moscow; intelligence suggested a fugitive former low-ranking officer of the SS 'Wiking' Division might be hiding here.\n\n“Report, sir! Empty! Just some moldy potatoes and a few dead rats,” one soldier replied, dusting himself off.\n\nPetrov frowned. This was the third location they had searched based on that unreliable tip-off. The war had been over for so long, yet these Nazi remnants were like ghosts, either long gone or hidden deeper than rabbits. Capturing them was pure luck.\n\n“Let’s move out,” he waved his hand, about to give the order to leave, when suddenly a faint noise came from the depths of the cellar. Everyone instantly tensed, raising their weapons.\n\n“Who’s there?! Come out! Or we’ll shoot!” Petrov cried sharply.\n\nAfter a long moment, an extremely emaciated, ragged old man, almost unrecognizable as human, emerged from the darkness, hands raised above his head, trembling violently. His eyes were vacant, muttering incomprehensible words, seemingly German, yet perhaps not.\n\nThe soldiers immediately subdued him. A search revealed only a blurry photograph, apparently of family, tucked in his inner pocket, with a few illegible letters written on the back.\n\n“Who is he? Is he the one we’re looking for?” Petrov asked the accompanying local guide, a taciturn old hunter.\n\nThe old hunter examined him closely, then shook his head. “Doesn’t look like it. Seems like a madman who’s been hiding in the woods for a long time, maybe some straggler German soldier, or… someone else.”\n\nPetrov looked at this ghost-like captive, feeling a wave of annoyance. “Take him, hand him over to the higher-ups for processing,” he said. Whether a genuine Nazi remnant or a pitiful relic of the war, it no longer mattered. What mattered was completing the mission, erasing these ‘unstable elements’ from the map."
 SWRW_RUS.109.a:0 "Ghosts of war sometimes wear the most ragged clothes."
 SWRW_RUS.110.t:0 "Echoes Beneath the Geologist's Hammer"
 SWRW_RUS.110.d:0 "“So, Dmitri Ivanovich, can you really knock tanks out from under this rock?” Private Sasha asked, rubbing his freezing hands, looking at the bearded geologist before him, who looked like he’d just emerged from a bear’s den. They stood on a remote slope in the Ural Mountains, the biting wind making their faces sting.\n\nDmitri Ivanovich didn’t answer directly. He caressed the mineral sample glistening with metallic luster with his rough fingers, his eyes blazing with the fervor of a believer who had found the Holy Grail. “Tanks? Sasha, my boy, this is much more potent than tanks! This is nickel, this is tungsten, good stuff for making cannon barrels and armor-piercing shells! With this, our ‘Iron Fist’ can smash the turtle shells of those Western capitalists and Eastern samurai!” He pulled out his ancestral silver flask, took a large swig of homemade spirit, and choked, tears streaming.\n\n“The war is over, Professor,” Sasha cautiously reminded him. “We need tractors and reinforcing bars for building houses now.”\n\n“War never truly ends, Sasha! Not as long as imperialism and exploitation exist!” The geologist waved his hammer, spittle flying. “We will turn every stone here into a bullet aimed at the enemy! We will make these sleeping mountains contribute their final treasures to our great motherland!” He looked around; only the howling wind and a few other soldiers, equally freezing and bewildered, were present.\n\n“But… we barely have enough trucks to haul these stones down the mountain,” Sasha muttered.\n\n“We will have them! Everything will be provided!” The geologist waved his hand grandly, as if a steel torrent could immediately flow into the valley at his command. “The report will state: Discovery of strategic-grade rare metal deposits! Enormous potential! Recommend extraction at all costs! For the strength of the motherland!” He shouldered his hammer like a victorious general. “Let’s go! Back for hot soup! Tomorrow, we dig again! For our great… well… just dig!”"
 SWRW_RUS.110.a:0 "The mountain knows, the stone knows, why we toil here."
 SWRW_RUS.111.t:0 "German Letters in the Mine Pit"
 SWRW_RUS.111.d:0 "The mining area south of Tula was once an important coal supplier for the 'Reichskommissariat Moskowien.' Now, the creak of the mine hoist sounded again, only the faces operating the machinery and digging coal underground were Russian. Boris, a former tractor driver, now the mine's production dispatcher, frowned over an old mine map marked bilingually in German and Russian.\n\n“These damn Germans dug really deep,” an old miner, his face covered in coal dust, peered over. “Some tunnels, even they didn't know where they led, like rat holes.”\n\n“Orders from above are to restore production in all usable seams,” Boris sighed. “Doesn’t matter who dug it; it’s our country’s wealth now. But look at this map, many places are marked ‘Dangerous’ or ‘Flooded,’ and some even have skulls drawn… Who dares go down?”\n\nA young engineer nearby whispered, “I heard from the technical department that when the Germans retreated, they might have tampered with some abandoned tunnels… set traps or… something else.”\n\nBoris’s heart tightened. This mine wasn't just about coal; it could also harbor danger. “Strengthen safety inspections!” he ordered immediately. “Anyone going down must go in pairs, carry gas detectors! Report any suspicious findings immediately! We’re here to mine coal for national construction, not to be buried alive for the German devils!”\n\nThe miners’ expressions turned serious too. They knew this land beneath their feet, even after liberation, still held the shadows and dangers of war. Every descent was not just a struggle with rock and coal seams, but also a gamble against a dark history. Mining lamps flickered in the dark tunnels, illuminating faint German letter markings on the mottled rock walls, seeming to silently narrate past evils and present risks."
 SWRW_RUS.111.a:0 "The coal mined is black, but we burn it for light."
 SWRW_RUS.112.t:0 "Poplars by the Riverbank"
 SWRW_RUS.112.d:0 "On the middle reaches of the Volga River, construction of a massive dam was in full swing. Bulldozers, excavators, and heavy trucks moved ceaselessly, transforming the riverbank into a giant construction site. According to the plan, a huge artificial lake would form here, and downstream, a powerful hydroelectric power station would be built, providing electricity and irrigation water for the surrounding industry and agriculture.\n\nOld fisherman Ivan Kuzmich sat in his small boat, casting his net for the last time. His little wooden hut, along with the entire fishing village inhabited for generations, would soon be submerged by the rising river waters. The government gave them some compensation money, promised to allocate new houses in a newly built resettlement site, and said they could raise fish in the reservoir later.\n\nBut he still couldn't let go. Couldn't let go of this river that had nurtured him and his ancestors, couldn't let go of the old poplar trees by the bank that had watched him grow up, couldn't let go of the misty water vapor at dusk and the calls of returning water birds. All this would soon sink beneath the water, becoming a new blue area on a map and a power generation figure.\n\nDeafening explosions echoed from the distance; the engineering team was clearing the riverbed. Ivan sighed and began hauling in his net. It held only a few small fish, some weeds, and silt. He looked at the murky river water and the rapidly rising concrete dam on the opposite bank, feeling empty inside.\n\nHe knew the country needed electricity, needed water conservancy, needed development. Personal feelings and nostalgia seemed insignificant before the grand slogan of 'transforming nature to benefit the people.' But he just couldn't understand why it had to be this way. Couldn't they leave a little more space for the river and the people living by it? Oars cut through the water, carrying the old man and his last catch, slowly rowing towards his disappearing home. The old poplar trees swayed in the wind, as if bidding a final farewell."
 SWRW_RUS.112.a:0 "The river changes course, can human hearts follow?"
 SWRW_RUS.113.t:0 "New Landmarks Under the Cranes"
 SWRW_RUS.113.d:0 "Central Moscow, areas once ravaged by war, were now transforming at an astonishing pace. Giant cranes, like steel giraffes, hoisted prefabricated concrete components onto the skeletons of modern high-rises rapidly ascending. Wide avenues were being paved, and new metro lines were under intense construction.\n\nAnna Ivanovna, an elderly saleswoman who had worked in a nearby department store for decades, passed through this vast construction site every day on her way to and from work. She remembered what it looked like before the war—the elegant old buildings, the small alleys full of life. The war turned them into heaps of rubble. Now, the rubble was cleared, replaced by these square, clean-lined, seemingly identical new buildings.\n\n“How grand!” exclaimed Lena, her young colleague walking with her, her eyes sparkling with anticipation for the future. “I heard there will be cinemas, ice rinks, and even shops selling foreign goods here later! When it's finished, we must come and see!”\n\nAnna just smiled without speaking. She admitted the new buildings looked more 'modern,' and were more spacious and bright. Saying goodbye to those dark, damp old houses was a good thing. Yet, she always felt these new buildings lacked something—lacked the charm that came with time and human touch. Walking on these wide, straight, but similar streets, she sometimes felt a sense of unfamiliarity and disorientation.\n\nShe missed the old Moscow, a bit crowded, a bit chaotic, but full of the vibrancy of life. The Moscow where you could buy freshly baked hot bread from a corner shop, where you could chat with neighbors while hanging laundry in the courtyard. Now, everything was becoming bigger, faster, more… standardized. Was this progress? Perhaps. But in her heart, a small part always yearned for those marks of the past Moscow, forever erased by cranes and bulldozers."
 SWRW_RUS.113.a:0 "A new city is rising; where will it lead?"
 SWRW_RUS.114.t:0 "Guitar Sounds on the Arbat"
 SWRW_RUS.114.d:0 "Arbat Street was slowly awakening. Some storefronts were repainted, sporting new signs—a state-run bookstore, a cooperative café, even a small gallery labeled 'Art Salon,' though the works displayed inside were mostly landscapes and 'mainstream' portraits.\n\nIn the evening, a young man with long hair and old jeans sat on a bench by the street, strumming a chipped old guitar and singing softly to himself. He sang a folk ballad tinged with melancholy and confusion, the lyrics subtly hinting at loss, searching, and uncertainty about the future. His voice wasn't loud, nor his technique particularly refined, but the slightly husky voice and sincere emotion drew a few passersby to stop and listen.\n\nAmong them were workers just off shift, students in uniform, and a man with glasses carrying a briefcase who looked like an intellectual. No one spoke; they just listened quietly. The guitar sounds and singing drifted on the early summer evening breeze, mingling with the distant car horns and pedestrians' chatter, creating a somewhat strange yet intensely real Arbat twilight scene.\n\nA plainclothes man in a grey trench coat with sharp eyes (perhaps responsible for maintaining order, perhaps something else) stood nearby for a while, ultimately did nothing, and turned away.\n\nThe young man finished his last song, strummed a final, lingering chord. No one applauded, but the intellectual-looking man stepped forward and dropped a few small-denomination rubles into his open guitar case. “Well sung,” he said quietly. “Haven't heard a song like that in a long time.” The young man looked up, giving him a shy, grateful smile. Night deepened, the neon lights of Arbat Street began to flicker, illuminating this ancient street searching for its new voice."
 SWRW_RUS.114.a:0 "Beyond the main melody, there are always soft refrains."
 SWRW_RUS.115.t:0 "Whispers by the Neva"
 SWRW_RUS.115.d:0 "“Petrograd… no, Leningrad… what should it be called now?” Yevgeny Andreyevich, a white-haired old professor, stood in the restored Palace Square, gazing at the Admiralty spire opposite, blackened by war but still standing tall, muttering to himself. The city’s name, like its fate, had changed several times amidst the storms of history. Now, official circles seemed inclined to restore the old name 'Saint Petersburg,' but for the older generation like him, who had endured the Siege and starvation, the name 'Leningrad' was already fused with the city's soul, unforgettable.\n\nHis student, a lively girl named Katya, took his arm. “Professor, don’t dwell on it so much. A name is just a symbol. What matters is that the city is being reborn, isn’t it? Look, the shops on Nevsky Prospekt are open, the theaters are staging performances again!”\n\nYevgeny nodded. Yes, the city was repairing the scars of war at an astonishing speed. Bombed bridges were reconnected, church spires sheared off by shells were being scaffolded, and tour boats reappeared on the Neva. Yet he always felt that beneath this surface of recovery lay an unspoken weariness and neglected grievances.\n\nCompared to the resources poured into the capital, Moscow, this hero city seemed to receive too little attention. Many important cultural heritage sites were being restored slowly, research institutions remained underfunded, and the aftereffects of the Siege—both physical and psychological—were far from adequately addressed. “Moscow celebrates victory, plans a magnificent future,” he sighed inwardly, “but do they still remember how much blood we shed here, how much hunger and cold we endured?”\n\nKatya seemed to sense his thoughts. “Professor, a few days ago the university organized us to lay flowers at Piskaryovskoye Memorial Cemetery,” she said softly. “We won’t forget. This city is always our pride.”\n\nYevgeny looked at the girl's clear, determined eyes, feeling a flicker of warmth. Perhaps hope lay with these young people. They hadn’t lived through the darkest years, but they carried the city's memory and spirit. As long as memory survived, as long as the Neva flowed silently, the cry of Saint Petersburg (or Leningrad) would eventually be heard."
 SWRW_RUS.115.a:0 "The river remembers every ebb and flow."
 SWRW_RUS.116.t:0 "Whispers in the Laboratory"
 SWRW_RUS.116.d:0 "Zelenograd, the area outside Moscow designated as the future 'Science City.' In a newly built laboratory, its windows still covered with protective film, several young engineers huddled around a computer prototype imported (or rather, dismantled and copied) from a 'friendly country,' arguing in low voices.\n\n“This logic gate design is clearly flawed! Signal interference is too severe!” exclaimed a young man with thick glasses and messy hair, waving a sheet covered in complex circuit diagrams.\n\n“But Volodya, we don't have a better alternative! Imported components are too expensive, and impossible to get! We can only make do with existing domestic components and try to improve them!” countered a slightly older, seemingly calmer engineer.\n\n“Make do? Can ‘making do’ create world-class chips? Can it catch up with the Americans and Japanese? The order from above is strict: we must produce results quickly, achieve the ‘Silicon Dream’!” Volodya's face flushed red.\n\nThe laboratory head, a taciturn middle-aged expert said to have worked at a top-secret nuclear physics institute, walked over and patted Volodya’s shoulder. “Calm down, comrades. You eat an elephant one bite at a time; you walk a path one step at a time. Our foundation is weak, we started late, that’s a fact. But we have brains, we have drive, and… the full support of the state.” He pointed to the slogan on the wall: “Self-Reliance, Strive for Strength, Overtake World Advanced Levels!”\n\n“But what good are slogans? The equipment isn't good enough, the materials aren't good enough, even a stable power supply isn't guaranteed!” Volodya remained unconvinced.\n\n“That’s precisely why we need to create the conditions, overcome the difficulties!” the head stated firmly. “When we developed the atomic bomb back then, conditions were much worse, didn't we succeed? What the Japanese can do, why can’t we Russians do it? We might not be able to completely copy their path, but we can forge our own!” His words held an undeniable confidence and resilience.\n\nThe engineers gradually calmed down, gathered around the prototype again, and began discussing improvement plans. Outside, new laboratory buildings were under construction. The setting sun cast a golden hue over this land brimming with hope and challenges."
 SWRW_RUS.116.a:0 "In the binary world, getting from 0 to 1 is not easy."
 SWRW_RUS.117.t:0 "Gazing from Mamayev Kurgan"
 SWRW_RUS.117.d:0 "On the banks of the Volga, Mamayev Kurgan. The colossal statue 'The Motherland Calls,' having undergone restoration, once again raised its sword high, standing on the city's commanding height, overlooking the hero city reborn from rubble below—Volgograd.\n\nRetired old worker Ivan Petrovich climbed this hill every week, visiting this quiet memorial cemetery where countless martyrs lay buried. He would place a bouquet of wildflowers (secretly picked from the park) before an unmarked soldier's grave, then sit on the stone steps nearby, silently smoking a cigarette, gazing at the city below and the winding Volga.\n\nHe knew almost everyone buried here—not by name, but by their stories. They were his comrades-in-arms, his neighbors, his relatives. They fought and died on this land, exchanging their lives for the city's present day. The city below had changed greatly; new factories were built, new residential areas appeared, streets widened. Newspapers reported that Volgograd was becoming an important national industrial and transportation hub, with a bright future.\n\nBut Ivan always felt that the city's voice seemed somewhat forgotten. People talked more about production targets, construction plans, new policies from Moscow, the wonderful future life. Discussions about steadfastness, sacrifice, and the indomitable spirit this city represented seemed to be diminishing. Children knew about the Battle of Stalingrad, but did they know what it felt like to starve, freeze, and face death here back then? Did they know that under every stone in this city might lie the bones of heroes?\n\nHe sometimes whispered to those unmarked graves, as if chatting with old friends. Telling them about the changes below, sharing his worries. The wind sighed across the hill, like the responding voices of the departed souls. Volgograd could not just be an industrial city; it should forever be a beacon of the Russian national spirit. Its voice—that voice of sacrifice, resilience, and unyielding spirit—should be forever remembered, forever proclaimed."
 SWRW_RUS.117.a:0 "The river flows east; the heroes' names never fade."
 SWRW_RUS.118.t:0 "Debate Over Textbooks"
 SWRW_RUS.118.d:0 "Moscow Ministry of Education, meeting room of the History Textbook Compilation Committee. The atmosphere was somewhat tense. Tables were piled high with historical documents, archival excerpts, and draft textbooks. The committee members—venerable historians, political officers from the military, and officials from the Ministry responsible for ideology—were engaged in a fierce debate over the narrative approach for the section on the 'Great Patriotic War and National Unification' in the new primary and secondary school history textbooks.\n\n“I believe we must truthfully reflect the brutality of the war, including our initial heavy losses and certain command errors,” said an old professor wearing reading glasses, his tone earnest. “Only by facing history squarely can we draw genuine lessons.”\n\n“Truthfully reflect?” A military officer with stars on his shoulder boards frowned. “Does that mean also writing about the routs and defections of certain units? About the chaos in the rear and certain erroneous decisions? This will shake the younger generation’s confidence in our cause! I believe we should focus more on heroism, the people’s resistance, and the final great victory!”\n\n“But excessive beautification of history is equally dangerous!” countered another scholar from a university. “That will make us forget past sufferings and repeat mistakes! We cannot only talk about victory without talking about the cost!”\n\n“The cost must be mentioned, but the main theme must be bright, positive, and uplifting!” The Ministry official responsible for ideology tapped the table, trying to control the situation. “History serves the present! Our primary task now is to unite the people, consolidate unity, stimulate patriotic enthusiasm and the drive to build the nation! The textbook must reflect this!”\n\nThe debate reached an impasse. How to narrate that complex period, filled with both pain and glory? What should be remembered, what should be downplayed, and what should be reinterpreted? This was not just an academic question, but a political issue concerning national identity and the future direction. Sunlight streamed through the windows, but the air in the meeting room felt heavy. The final draft would profoundly affect an entire generation’s understanding of the past, and their imagination of the future."
 SWRW_RUS.118.a:0 "In the river of history, we all seek our own reflection."
 SWRW_RUS.119.t:0 "Symphony of the Assembly Line"
 SWRW_RUS.119.d:0 "In a newly built, massive consolidated factory in the Ural region, several different production lines were operating at an unprecedented scale and efficiency. From raw material input to finished product output, various stages were precisely calculated and connected, forming a grand and complex industrial panorama. Equipment and workers originally scattered among several smaller surrounding factories were concentrated here under unified management and production.\n\nIgor, formerly a key technician in one of those small factories, was now the section chief of this brand-new bearing production line. Standing in the elevated control room, he overlooked the busy yet orderly assembly line below. The roar of machinery, the rotation of conveyor belts, the friction of metal—all merged into a unique symphony of the industrial age.\n\nThe benefits of centralization were obvious: unified procurement of raw materials reduced costs; standardized production processes improved efficiency and product quality; centralized worker management facilitated training and deployment. The numbers on the reports were dazzling; output climbed steadily, and the defect rate continued to fall. Higher leadership was very satisfied and had already designated this place as a 'model of industrial modernization reform.'\n\nBut Igor also harbored some hidden worries. Back in the small factory, everyone knew each other, like a big family; problems could be discussed and solved at any time. Now, with hundreds or thousands of workers, mostly strangers, and multiple management levels, the stench of bureaucracy was growing stronger. A small technical innovation idea required reporting through layers of hierarchy; by the time approval came, it was too late. Workers felt more like replaceable parts on an assembly line than living human beings. The 'workshop spirit,' full of human warmth, that existed in the old small factories was disappearing.\n\nHe saw a young worker being harshly reprimanded by the team leader for an operational error; people nearby lowered their heads, pretending not to see. Igor frowned and picked up his walkie-talkie: “Team Leader Three, pay attention to your work methods; be patient when guiding new comrades.” Efficiency had improved, but the distance between people seemed to have widened. Was this really the 'modernization' they wanted? He didn't know. He only knew that this symphony of the assembly line would continue to roar."
 SWRW_RUS.119.a:0 "The giant machine turns, emitting a regular, cold sound."
 SWRW_RUS.120.t:0 "Nylon Stockings at the Market"
 SWRW_RUS.120.d:0 "Izmaylovo Market, once merely a place to exchange black bread and potato peels, now seemed magically revitalized. Sunlight streamed through the repaired glass roof, illuminating dazzling stalls: piles of sausages (though mostly made of potato flour and unidentified meat, they at least looked like sausages), vividly colored, almost unreal printed fabrics, and… heavens, brand new nylon stockings!\n\nOld tailor Yevgeny Pavlovich, his hands trembling, picked up a pair of gossamer-thin silk stockings, examining them carefully against the sunlight. He could hardly believe his eyes. Just a few years ago, forget nylon stockings, even finding a decent piece of cotton thread was difficult. Back then, people wore patched old uniforms, made ropes from birch bark, and burned furniture for heating in winter. And now… shop windows displayed radios and new-style kettles, brightly painted small cars (though still few, and mostly state-owned) drove on the streets, even the black bread from the neighboring bakery seemed less gritty than before.\n\n“What’s wrong, old man?” Sasha, the young lad selling second-hand army boots nearby, sauntered over, a cigarette dangling from his lips. “Fancied this women’s stuff? Planning to buy it back for your old lady as a surprise?”\n\nYevgeny put down the stockings, shaking his head, then nodding. “Yes, Sasha, a surprise… and a shock.” He touched his own coat, still bearing several patches. “It all came so quickly, so fast it makes one anxious. Yesterday we were digging for food in the rubble, today we can buy nylon stockings? This money… is it real? These goods… where did they suddenly appear from?”\n\nSasha shrugged. “Who cares! As long as there’s money to be made, goods to sell, and life goes on, right? The higher-ups said this is an ‘economic miracle’! It’s because we Russians are hardworking, and the state policy is good! You should be happy, old man!”\n\nYevgeny looked at Sasha’s young, carefree face, then at the bustling crowd in the market, their faces mixture of hope and bewilderment. Maybe Sasha was right; life was indeed getting better, so fast it felt like an unreal dream. Factories were hiring, wages were rising, once-empty shelves were slowly being filled. What lay behind this ‘miracle’? A smarter plan, harder labor, or… some other force he didn't know? He stopped thinking about it. He took out the crumpled rubles he had saved for months, carefully counted out a few bills, and bought the nylon stockings. Perhaps his old wife would be genuinely happy wearing them. In this world that felt almost too good to be true, a little bit of small, real happiness was always good."
 SWRW_RUS.120.a:0 "Perhaps we can really expect buttered bread tomorrow?"
 SWRW_RUS.121.t:0 "Gazing at the Stars"
 SWRW_RUS.121.d:0 "The main building of the restored Moscow State University regained its imposing yet somewhat oppressive silhouette in the evening glow. The red star atop the spire had been polished anew, gleaming faintly in the twilight.\n\nAndrei, a third-year architecture student, sat with his classmate Olga on the steps of the square before the main building, rapidly sketching the lines of this behemoth in his sketchbook.\n\n“It’s incredible, isn’t it?” Olga paused her pencil, sighing. “It’s so tall, so vast, like a mountain. Building it back then must have cost countless manpower and resources.” Her tone held both admiration and an subtle complex emotion.\n\n“Yes,” Andrei also put down his pencil, leaning back against the cool stone steps. “My grandfather participated in its construction. He said conditions were extremely harsh then; many people collapsed from exhaustion on the site.” He paused. “Later… the Germans came. They supposedly used it as one of their important command posts too. You can still find bullet holes and traces of graffiti on the walls now, though they’ve been carefully repaired.”\n\nThese 'sister' buildings, along with several other towers scattered across Moscow, stood like silent giants, witnessing the city’s, and indeed the country’s, most turbulent, glorious, and painful years. They were symbols of an era’s ambition, embodiments of powerful will, and also the crystallization of countless ordinary people’s sweat and even blood. Now, the war was over, flags had changed, yet they still stood there, like huge, indelible question marks left by history.\n\n“The teacher said there are plans now to convert some of them into luxury hotels or office buildings, to attract foreign investment,” Olga said softly. “Do you think… it’s appropriate?”\n\nAndrei didn’t answer immediately. He gazed up at the spire piercing the clouds, the star atop it shining exceptionally bright in the deepening night sky. “Who knows,” he finally said. “Maybe they no longer need to represent a certain ideology or a certain leader. Maybe they can just be… buildings. Part of the city skyline, reminding us where we came from, and also where we need to go.” He picked up his pencil again. “At least, they’re still there, for us to look up at.”\n\n"
 SWRW_RUS.121.a:0 "Through hardship, to the stars..."
 SWRW_RUS.122.t:0 "I Have Returned, Mother"
 SWRW_RUS.122.d:0 "Vadim, thirty-six years old, former infantry sergeant, now… someone who could finally be called a 'Moscow resident.' He stood on Red Square, surrounded by the bustling crowd, the smooth cobblestones beneath his feet. Pigeons fluttered around him; the melodious bells of St. Basil's Cathedral chimed from its onion domes in the distance. Warm sunlight bathed his face, dispelling the last lingering chill from the Siberian POW camp.\n\nTwenty years. Twenty whole years. He had left Moscow a young lad, full of patriotic fervor, following his unit westward, and then… came the rout, encirclement, capture. In icy Siberia, amidst endless hard labor and hunger, he almost believed he would never return. Moscow became a distant, hazy, yet incredibly warm dream in his memory. There was the courtyard where he played as a child, the taste of his mother’s borscht, the riverbank where he first secretly held a girl's hand.\n\nNow, he was back. But the Moscow before him was both familiar and strange. Red Square was still there, the Kremlin walls still imposing, but the colors of St. Basil’s seemed faded, bearing scars from shrapnel. The GUM department store windows were no longer empty, displaying some colorful goods he had never seen before. People on the streets dressed more neatly, their expressions less perpetually tense, but deep in their eyes seemed hidden scars they preferred not to touch.\n\nHe walked aimlessly along familiar streets, trying to find his childhood home. The narrow alley was still there, but the original wooden house was gone, replaced by a brand new, seemingly characterless Khrushchev-era building. He stood before that building for a long time, until a curious child ran up and asked whom he was looking for.\n\nHe didn't answer, just slowly turned and walked towards the Moscow River. The river still flowed quietly, reflecting the outlines of buildings under repair and newly constructed ones on both banks. The river breeze touched his face, carrying the city's unique scent—a mixture of dust, car exhaust, and the气息 of some new life.\n\nHe reached the riverbank, took off the old army boots that had carried him across half of Russia, and stepped barefoot onto the cool earth. The soil was soft yet firm. He slowly bent down, reached out his hands, covered in calluses and scars, and gently touched the ground beneath his feet.\n\nThis was it. No matter what it had become, no matter how much suffering it had endured, this was home. This was Moscow, the heart of Russia, the place he had dreamed of for twenty years.\n\nHe looked up, at this familiar yet strange river before him, at this city awakening, striving to escape its nightmare. He knew too much had been lost, never to be recovered. His youth, his comrades, the home in his memory… But at least, he was back. He was alive. This land still existed.\n\nHe took a deep breath, as if wanting to inhale the very essence of this land into his lungs. Then, he opened his arms, as if to embrace the river, the city, this land, so weathered yet so resilient. Like a long-lost child finally falling into his mother’s embrace, tears streamed silently, soaking the earth beneath his feet, the earth that held all his memories and hopes. He hugged this earth, as if having made a firm resolution. He would live here, watch this city truly recover, make up for those lost years."
 SWRW_RUS.122.a:0 "Where the heart finds peace, that is home."
