 SWRW_RC_sidebar_tt: "Germany has inflicted indelible harm upon our nation and people. Tens of millions of children from the great Slavic family were unable to return home for thirty years. Now, we have finally reclaimed our homeland. However, the road to revival is long and arduous. After 30 years of colonization, national identity within the former German Generalgouvernements is waning. Moreover, the Germans have left us with a troublesome mess—millions of Germans stranded within our borders. We must carefully consider their fate.\n\n§RIf we fail to handle these matters within a certain timeframe, the consequences will be catastrophic!§!"
