l_english:
RUS_commie_reconstruction: "The Motherland is Finally Reunited!"
RUS_commie_reconstruction_desc: "We have succeeded.\n\nThe once-unrivaled millennium-old empire lies crushed beneath our heel, and the Motherland has reclaimed her final piece of the puzzle. The former minor warlord has finally become the legitimate heir to Mother Russia. The Russian people, through their courage and sacrifice, have shown the world that no one can ignore our strength any longer.\n\nNow, tens of millions of Slavic sons and daughters have returned to their homeland, united under one banner. We have endured great hardships, and finally, we have become a unified union!"
RUS_commie_no_time_to_wait: "No Time to Wait"
RUS_commie_no_time_to_wait_desc: "The entire nation rejoices, buoyed by the achievements of the Great Patriotic War. A wind of complacency seems to have swept through our government—of course, we have reasons to be proud, but we cannot afford to stagnate. Unemployment, turmoil, displacement, and poverty in Russia are far from resolved. Ethnic tensions are escalating, with growing separatist tendencies among Belarusians, Ukrainians, Estonians, Latvians, Lithuanians, Georgians, Azerbaijanis, and other minorities. The immense cost of maintaining security in newly recovered territories strains our finances. Millions of Germans still remain in the Baltics, the Caucasus, West Russia, Belarus, and Ukraine. A significant portion of them have become part of Russia through the Nazis' dirty schemes. If we do not handle this issue properly, it will become a huge hidden danger for our future. We do not wish for a day when the Germans within our borders rise up in rebellion."
RUS_commie_independent_ssr: "An Independent and Equal Union"
RUS_commie_independent_ssr_desc: "We are liberators, not another colonial power cloaked in shining armor. We must acknowledge our history; ethnic issues have always been one of the greatest considerations in Russian policy. During the old Tsarist era, most of Russia's land was soaked in the blood of Russian soldiers and the conquered. Under the old Soviet Union, this situation improved somewhat, yet they still failed to fundamentally resolve the complex and intractable ethnic contradictions Russia faced. Thus, after the collapse of central authority in Bukharin's Soviet Union, these suppressed minorities immediately took up arms and became local bandits.\n\nWe will not repeat their mistakes. The tyranny of the Germans has already caused too much suffering for the people within the former Russian territories. Although the situation for Russians is by no means better, we should still respect their choices, letting them decide for themselves whether to join our country, become a part of us, or to be free and independent, becoming a member of our greater family."
RUS_commie_unity_and_strong_union: "A United and Strong Union"
RUS_commie_unity_and_strong_union_desc: "The Great Patriotic War is merely a phased victory—just as we could reclaim lost territories, the Germans could potentially cross Belarus and Lithuania again. Even if this possibility is minuscule, we absolutely cannot overlook any threat. The border with Germany will become a permanent front line. The people there will be protected by walls of steel, and the next generation there will no longer live in the shadow of Germany as their predecessors did twenty years ago. For the safety of all Slavic sons and daughters, the independence of these minorities can be put aside for now. Not to mention, these lands are our rightful territories—as long as we can manage ethnic contradictions well and try to keep the opposition from being too clamorous, there won't be any major problems.\n\n§WWe shall be more united, we shall be stronger!§!"
RUS_commie_reconstruct_and_develop: "Reconstruction and Development"
RUS_commie_reconstruct_and_develop_desc: "In any society, people always strive for a better tomorrow. This desire is especially strong for Russia, which is in dire need of rebuilding. We won the Great Patriotic War, but look at our people. Their daily labor has reached its limit, and much of what they produce is not for themselves—products must be sent to support the front lines. Although this is a necessary sacrifice, the people have suffered too much. Countless fine young men fell on the eve of dawn, poverty and turmoil have returned…\n\nUndoubtedly, our foremost task now is reconstruction and development. We not only need to restore the territories we held before 1975 but also to save the devastated people in the newly recovered areas from hunger and suffering. As long as we do well, all difficulties will melt away, and our people will finally have a chance to breathe."
