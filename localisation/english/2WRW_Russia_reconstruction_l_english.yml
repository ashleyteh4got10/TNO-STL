 RUS_democratic_fair_election_desc: "§WFor a long time, due to the protracted turmoil within the Russian Republic, we have failed to organize an effective electoral process, thereby plunging our democratic regime into a long-term predicament of one-party dominance and rampant corruption. To combat the strong domestic opposition and autocratic forces, the Fair Election Act was born.\n\nThe Fair Election Act aims to ensure fairness, transparency, and equality in the electoral process of the Russian Republic. By optimizing electoral procedures and popularizing election facilities, it seeks to expand voter participation across the country. Simultaneously, it encourages ordinary citizens to participate in political financing to reduce the manipulation of the electoral process by so-called 'big money donors.' Furthermore, by establishing policies prohibiting discrimination, it optimizes the voting rights of historically marginalized groups in Russia, ensuring their votes are counted in the final results. An independent commission will also be established to oversee the voting process in various constituencies to prevent partisan manipulation.\n\nAdmittedly, democracy is not achieved overnight, but the Fair Election Act will be the first step for the Russian Republic towards this goal, even as opposing voices and other challenges grow ever louder."
 RUS_democratic_DEI_desc: "§WAs a nascent nation, Russia has suffered immense societal rifts due to continuous wars and long-term division. The Diversity, Equality, and Inclusion Act aims to mend these rifts and forge a new Russia that is diverse, equal, and inclusive.\n\nDiversity will advocate for attention to individual differences, encompassing aspects such as race, gender, age, religion, physical ability, and more, thereby imbuing the entire nation with a richer tapestry of colors.\n\nEquality is not simply about treating everyone the same, but about fully considering individual differences and needs. Through fair policies, systems, and resource allocation, it ensures everyone has equal opportunities for development and is committed to eliminating systemic barriers caused by factors like race and gender.\n\nInclusion focuses on creating an environment where everyone feels respected, accepted, and valued. Regardless of their background, everyone can freely express their views, fully utilize their talents, and possess a strong sense of belonging and happiness in their motherland."
 RUS_democratic_clean_water_desc: "§WOnce upon a time, in the single-minded pursuit of economic and industrial development, the health of the Russian Republic's water resources was greatly neglected, eventually rapidly growing into the foremost environmental problem threatening national development.\n\nAs part of the environmental transformation plan, the Water Pollution Control Act will once again focus on Russia's water resource health. Through strict pollutant discharge controls and wetland protection measures, it will forcibly reduce industrial and domestic wastewater pollution of rivers and lakes, ultimately aiming for most water bodies to recover to a state 'fit for fishing and swimming.'\n\nFurthermore, the Water Pollution Control Act grants citizens the right to public lawsuits, thereby strengthening law enforcement and promoting the fulfillment of environmental responsibilities by government and enterprises."
 RUS_democratic_green_industry_desc: "§WTo restore blue skies to a nation long shrouded in smog, industry—the steel heart that sustains every nation—must don a green mantle.\n\nThe Green Industry Act, as a core component of Russia's largest-ever environmental transformation plan, will, on one hand, significantly reduce the technological transformation costs for high-carbon industries such as steel and chemicals through tiered tax credits and direct government appropriations. On the other hand, it will establish principles of technological neutrality and dynamic adjustment mechanisms, ensuring both corporate autonomy in choosing emission reduction paths and periodic optimization of policy effectiveness.\n\nConsidering the significant proportion of heavy industry in Russia's industrial system, the Green Industry Act also proposes the establishment of corresponding industrial regulatory agencies to ensure the smooth implementation of the plan, and will first conduct pilot projects in certain industrial sectors to explore the feasibility of green transformation in those areas.\n\n"
 RUS_democratic_free_religious_desc: "§WThe land of Russia is so vast—for this reason, it encompasses people of various religious beliefs, but the ensuing wars and oppression once eradicated this religious flourishing.\n\nThe core merit of the Religious Freedom Restoration Act lies in its pioneering establishment of a 'strict scrutiny standard,' providing unprecedented judicial protection for religious freedom in Russia. The act requires the Republic's government to prove that any restriction on religious practice simultaneously meets two rigid conditions: first, the existence of a 'compelling government interest' (such as public safety, a top-priority reason), and second, that the measures taken must be the 'least restrictive means.' This significantly raises the legal threshold for government intervention in religious activities and allows religion to flourish again under government supervision.\n\n"
 RUS_democratic_immigration_freedom_act_desc: "§WAs the diplomatic situation of the Russian Republic improves, Russia no longer needs to protect itself through closure as in the past. Therefore, the newly introduced Immigration and Nationality Act marks a historic turning point in Russia's immigration policy.\n\nFirstly, the Immigration and Nationality Act abolishes discriminatory restrictions based on ideology against places like Germany and Japan, promoting Russia's transition towards a multicultural society. Secondly, the 'family-based immigration preference' system will encourage foreign relatives of citizens to immigrate to the country, thereby ensuring the stability of immigrant communities. Lastly, it establishes occupational immigration categories, particularly opening channels for highly skilled talents to attract more scientific researchers to settle here.\n\nFurthermore, the Immigration and Nationality Act will incorporate 'refugee asylum' as a permanent provision, allowing the acceptance of political asylum seekers to help more people living in dire straits find a place of refuge.\n\n"
 RUS_democratic_fair_work_desc: "§WUndoubtedly, the great victory of the Russian Republic is inseparable from its millions of working people, who dedicated everything to their motherland yet still struggled to support their families on meager salaries.\n\nThe Fair Labor Act, based on the modern labor-capital ethic that 'labor value must receive reasonable consideration,' reshapes modern labor-capital relations through systematic institutional design and constructs a threefold protection mechanism for laborers, namely:\n\nEstablishing a national minimum wage standard and overtime pay system;\n\nImplementing strict child labor prohibitions, forcibly reducing the labor participation rate of children under 14, fundamentally changing Russia's human capital development model;\n\nNewly establishing a federal labor inspection system, authorizing the Ministry of Labor to directly recover wage arrears and implement punitive damages.\n\nIn addition, it includes a 'dynamic scope expansion' mechanism, which can gradually incorporate vulnerable groups such as agricultural workers and domestic service workers into its protection through subsequent revisions, thereby genuinely increasing the proportion of benefiting laborers.\n\n"
 RUS_democratic_anti_spy_desc: "§WAs threats from all sides increase, the newly passed National Security Act has become a solid shield for the Russian Republic to defend its national security.\n\nThe National Security Act categorizes threats to the Russian Republic as follows:\n\nOne, internal political problems such as social unrest caused by political entities like trade unions and Nazi remnants.\n\nTwo, geopolitical strategic competition issues such as foreign interference and espionage infiltration.\n\nThree, international issues such as public security management problems caused by immigration and transnational organized crime.\n\nIn response to these numerous threats, the Russian Republic will adopt different countermeasures, resorting to force if necessary to defend national security.\n\nFurthermore, the National Security Act emphasizes that the definition of 'threats' in the act can be further revised and delineated according to future political situations.\n\n"
 RUS_democratic_sp_med_desc: "§WFor a democratic nation, the proliferation of communism is disastrous. If the Russian Republic is to salvage the situation before it becomes completely uncontrollable, it must confront the threat from communism directly.\n\nThe Special Amendment to Address the Communist Threat separately lists the infiltration of communist political entities such as trade unions as an ideological struggle问题 that poses a great threat to the state. It grants the government powers that can transcend most legal restrictions when facing such threats, and special agencies should be established in relevant departments to adopt unconventional measures against it.\n\nFurthermore, if any bills related to such threats still need to be passed, a newly formulated political process will be used to ensure precise and swift strikes against communism.\n\n"
 RUS_democratic_sp_edu_desc: "§WGiven the current special circumstances, the Special Anti-Espionage Amendment has to push this ideological struggle to its peak.\n\nThe Special Anti-Espionage Amendment conducts surgical strikes against communism through political, economic, and cultural aspects, while defining any activity related to communism as espionage activity that threatens national security.\n\nPolitically, it comprehensively bans existing communist political entities such as trade unions and political parties, destroys their previously established political framework, and makes related adjustments to relevant political proposals. Economically, it makes corresponding adjustments to existing economic policies deemed to have 'communist' leanings, and confiscates and adjusts the assets of former communist political entities. Culturally, it strictly prohibits any political claims related to communism and weakens the presence of communism in the education sector to ensure it does not affect young people.\n\nRegrettably, although the democratization process is thereby hindered, this is also an inevitable path to the future.\n\n"
 RUS_democratic_anti_comm_desc: "§WThe National Security Act has thoroughly dismantled the original framework of trade unions, leading to a situation where the rights and interests of workers localities are no longer guaranteed as before. The Union Organization Act will be a compensatory measure for all this.\n\nThe Union Organization Act emphasizes that past communist forces had too profound an influence on trade unions, and excessive union autonomy led to the over-suspension of social production. Therefore, new unions will be reorganized under government supervision and will have more privileges revoked than before, to ensure that workers can continue to maintain the normal operation of society while effectively expressing their demands.\n\nAt the same time, the Union Organization Act repeatedly emphasizes that new unions must operate under government approval and licensing; otherwise, their actions will be deemed illegal.\n\n"
 RUS_democratic_new_union_desc: "§WAs part of the plan to counter communism, the Special Medical Security Act will implement stricter punitive measures against communists and their sympathizers.\n\nThe Special Medical Security Act legally deprives this group of the right to medical security. The government identifies them through screening and adds them to the blacklists of various hospitals, prohibiting hospitals from providing services to them, but retains their right to be rescued in case of life-threatening injuries.\n\nOf course, after passing government review, this group can reapply to the government to regain the right to medical security.\n\n"
 RUS_democratic_big_antispy_desc: "§WSimilar to the Special Medical Security Act, the Special Education Act also targets communists and their sympathizers.\n\nThe Special Education Act strictly restricts the educational rights of this group and their descendants. The government identifies them through screening and adds them to the blacklists of various schools, prohibiting schools from providing services to them or establishing special educational institutions that only offer limited education to them. Individuals currently receiving education will be forcibly expelled from their educational institutions.\n\nSimilarly, after passing government review, this group can reapply to the government to regain the right to education.\n\n"
 RUS_democratic_worker_power_desc: "§WAlthough the Fair Labor Act provides workers with sufficient security guarantees, due to the weak legal awareness of workers, many of their rights have not been effectively implemented. The Worker's Rights Act will fill this gap.\n\nThe Worker's Rights Act moves away from traditional empowerment thinking and instead stimulates workers' enthusiasm for rights protection by transforming the social atmosphere. Through forward-looking institutional design, it constructs a more comprehensive labor rights protection system.\n\nAs an important entity in the entire process, trade unions will be given more resources by the government to cultivate workers' awareness of rights protection, while expanding their rights to avoid excessive constraints from enterprises. At the same time, a special channel for rights protection will be opened for workers, reducing the troublesomeness of rights protection. Finally, a strict enterprise review system will be established; the government will place enterprises that fail to effectively protect workers' rights under key observation and impose huge fines.\n\n"
 RUS_democratic_union_union_desc: "§WToday's facts prove that trade unions are entirely beneficial to Russia's economic development. However, if we want to fully tap into all the potential of trade unions, current policies are far from sufficient. The Union Autonomy Act will provide a larger stage for trade unions.\n\nThe Union Autonomy Act, on the basis of previous policies, grants trade unions complete independence. The relationship between the government, enterprises, and trade unions will transform into one of cooperation and supervision. Union leadership will no longer be forcibly composed of government or enterprise members but will encourage workers to vote for their own leaders. The issue of inter-union federation will also be relaxed. The state will establish a national general trade union responsible for maintaining relations with trade unions.\n\nHowever, considering that the development of trade unions in the Russian Republic is not yet mature, the government will still exercise limited management over trade unions after the implementation of the Union Autonomy Act, until most trade unions can achieve complete autonomy and assume the responsibility of safeguarding workers' rights and social fairness and justice.\n\n"
 RUS_democratic_improve_work_enviro_desc: "§WIf nature is considered the carrier of society, then people are the framework that constitutes the entire society. If we only focus on environmental issues while neglecting human health, then social development will be difficult to sustain. The Occupational Safety and Health Act is determined to change this situation, and its core primarily involves the following three points:\n\nOne, establish a 'bio-psycho-social' full-dimensional risk assessment framework, compelling enterprises to monitor multiple indicators such as physical environment and chemical exposure quarterly, complemented by a dynamic threshold adjustment mechanism.\n\nTwo, set up a 'Joint Environmental Improvement Fund,' incentivizing enterprises through tax breaks to invest more profits in upgrading protective facilities, while requiring enterprises to equip corresponding work environment risk assessment personnel.\n\nThree, grant laborers the 'right to disconnect'—the right to refuse overtime after work hours; violators will be required to compensate laborers with substantial damages.\n\nThe purpose of the Occupational Safety and Health Act is not merely to achieve laborer health; in the government's long-term vision, this will lay the cornerstone for the future soaring development of enterprises.\n\n"
 RUS_democratic_work_wage_desc: "§WAfter the promulgation of the Fair Labor Act, the further implementation of labor-capital relations still faces difficulties due to the actual circumstances of some enterprises.\n\nThe National Labor Relations Act, based on the Fair Labor Act, is still founded on the modern labor-capital ethic that 'labor value must receive reasonable consideration.' It aims to construct a more flexible and balanced labor-capital relations governance system. Its core advantage lies in its so-called 'dual-track collective bargaining' framework, which both preserves traditional industry-level bargaining to ensure basic rights and innovatively establishes enterprise-level flexible negotiation space, enabling high-tech enterprises to customize special terms such as equity incentives. For enterprises facing excessive practical difficulties, they can apply for government subsidies to compensate for deficiencies in labor-capital relations.\n\nIn the government's conception, after strengthening the labor side in labor-capital relations, by compensating for the capital side's deficiencies in this regard, a win-win balance can be found in labor-capital relations.\n\n"
 RUS_democratic_fair_work_re_desc: "§WAfter the groundwork laid by the Worker's Rights Act, the Union Autonomy Act, the Equal Employment Opportunity Act, the Occupational Safety and Health Act, and the National Labor Relations Act, the Russian Republic has established a relatively complete labor law system. The Revised Fair Labor Act, as the culmination of all the above, will become a labor law truly in line with the national conditions of the Russian Republic.\n\nThe Revised Fair Labor Act addresses the various shortcomings of the previous Fair Labor Act of the Russian Republic from five aspects: minimum security standards, collective bargaining system, anti-discrimination protection network, occupational safety system, and flexible adaptation mechanism. Its design, which prevents both 'social failure' and 'institutional rigidity,' establishes a new type of labor atmosphere where labor and capital achieve a win-win situation, and society and individuals complement each other.\n\nAs an important symbol of the Russian Republic's march towards further democratization, the Revised Fair Labor Act will serve as a foundation upon which a new Russia, fair, democratic, and free, will be built by its laborers, marching towards her true future.\n\n"
 RUS_democratic_new_union_new_desc: "§WIn the Russian Republic's revitalized union system, collective labor rights have received unprecedented protection and strengthening. Unions now flourish under the aegis of the Revised Fair Labor Act, ensuring all labor activities align with national economic development goals. Through legislation, unions have gained greater bargaining power, able to directly participate in and supervise enterprise decisions, guaranteeing workers fair wages and safe working environments. This system not only enhances production efficiency but also ensures the overall well-being of the working class, enabling the unions of the Russian Republic to play a core role in maintaining social stability and promoting economic progress."
 RUS_democratic_road_road_desc: "§WMuch of the Russian Republic's territory is vast and desolate, with few transportation arteries connecting the nation. To strengthen nationwide exchange, the ambitious government, emulating the United States of America's highway network, has established a vast urban expressway network stretching from Moscow to Magadan.\n\nIn the Russian government's plan, all road resources will be uniformly dispatched by the National Transportation Center. The arteries radiating from Moscow to its west will reconnect the economic lifelines of the Russian Republic, once again firmly stitching the entire nation together—as one, no longer separate.\n\n"
 RUS_democratic_internet_desc: "§WRussia, vast and rich. Unfortunately, her vastness brings inconvenience. Her wide lands are like a bloated body; any modern means of transport seems but a slowly crawling maggot upon it—nothing, it seems, can establish a high-speed channel across her, except...\n\nThe Internet.\n\nFor the Russian Republic of yore, the internet seemed so out of reach, a product only world powers could possess. But times have changed. As the Russian Republic stands at the center of the 'World Island,' her financial and material resources are sufficient to support a massive 'Internet' project, catching up with the global pace.\n\nThe 'Internet' project has been incorporated into future core strategic engineering, as an important technological tool to promote national economic development and construction. Its development must strictly follow the principles of 'production priority, collective sharing,' ultimately shaping a 'super brain' for the Russian Republic that will astound the entire world.\n\n"
 RUS_democratic_fast_urbaniztion_desc: "§WIn the future plans of the Russian Republic, the word 'efficiency' has undoubtedly become the center of planning. Both industry and agriculture require a strong heart to drive them—labor, technology, and capital are the components of this heart, and what can truly shape it is none other than a modern and prosperous city.\n\nThis is precisely why the government has chosen to accelerate urbanization. If the Russian Republic wants to wholeheartedly embrace the future, she must shape every tiny speck of light on her land—bright and shining on the nighttime Earth.\n\n"
 RUS_democratic_industry_reform_desc: "§WHow to evaluate Russia's industry—it can be called 'a body with only industrial bones but no flesh and blood.' If the Russian Republic wants to 'both maintain industrial bones and grow flesh and blood,' then...\n\nIn the 'Industrial Reform Plan,' the development of heavy and light industries is systematically repositioned as a strategic project that 'balances technological upgrading with improving people's livelihood.' Heavy industry departments will implement 'military-civilian integration' reforms; all military enterprises must shift part of their production capacity to civilian machinery manufacturing, with unions establishing relevant departments to supervise the transition process. Simultaneously, light industry development will adopt a 'demand-oriented' principle, producing goods according to the actual conditions of various regions.\n\nWhen, on some future day, Russia's industry can find a perfect balance, the entire nation will fear no risks and face all storms with composure.\n\n"
 RUS_democratic_green_industry_check_desc: "§WA steel body with flesh and blood cannot withstand the aging from nature. Therefore, a sustainable development model must be an indispensable part of Russian industry.\n\nFrom the perspective of the 'Green Industry Inspection Plan,' winning this environmental war requires real-time state supervision and direct union oversight. But more importantly, it demands voluntary compliance from enterprises—from emission reduction effectiveness to resource recycling rates, no meticulous corner can be overlooked. In this society-wide battle to protect blue skies and green waters, this might be the last chance for Russia's countless future generations.\n\nAll this is like cutting away a piece of necrotic flesh from a healthy body: compared to the short-term pain of excision, facing the necrosis of all muscles is far more terrifying.\n\n"
 RUS_democratic_new_industry_community_desc: "§WTo build a city with more character and prospects, traditional urban spatial patterns must be abandoned, and 'industrialized communities' will be an indispensable part of this city.\n\nIn the 'industrialized community' envisioned by the Russian Republic, the traditional factory model will be completely restructured into a new type of industrial community integrating 'production-life-ecology.' Each industrial community will be centered around a core factory, integrating residential areas, technical schools, and ecological farms within a radius of several kilometers, forming self-sufficient social production units.\n\nAnd when these social production units are connected in series, they will create an unparalleled industrial feast.\n\n"
 RUS_democratic_new_technology_community_desc: "§WTechnology—as the primary productive force—now faces the risk of becoming detached from production: seemingly advanced research achievements, after countless experiments and procedures, become expensive and useless stacks of waste paper in factories, and the costly resources spent on them become worthless.\n\nIn the 'High-Tech Community' plan, higher education and industrial innovation are restructured into an integrated 'study-research-production-application' system led by worker collectives. Each community consists of three core components: higher education institutions, joint innovation centers, and technology transfer agencies. Its operational mechanism emphasizes the rapid transformation of research achievements into feasible practical labor outcomes through worker collectives, thereby allowing 'higher education to truly return to its labor origins.'\n\n"
 RUS_democratic_liber_gender_desc: "§WIn Russia, disadvantaged groups still face unfair treatment in employment. To weave an anti-discrimination protection network for society, the Equal Employment Opportunity Act came into being.\n\nThe Equal Employment Opportunity Act prohibits employment discrimination based on ethnicity, religion, age, gender (including pregnancy), or nationality. It advocates for equal pay for equal work for men and women and allows collective lawsuits for wage disparities. It requires enterprises to provide 'reasonable accommodation' for disabled and elderly employees. Simultaneously, pregnancy is considered a temporary disability, and employers must provide equivalent paid sick leave or adjust working conditions for them. Furthermore, for individuals of different religious beliefs and nationalities, enterprises are required to provide special care for these groups."
 RUS_democratic_cyberpunk_desc: "§WThe Russian Republic is experiencing a glorious era known as 'Cyberpunk 1977,' where the fusion of technology and capital has given birth to a superficially glamorous utopia: neon-lit skyscrapers pierce the clouds; expansive and developed highway networks connect all corners; advanced and powerful internet networks cover the entire nation...\n\nUnder this wave of technological optimism, the Russian Republic stands at the pinnacle of the world—her economy is prosperous, her culture is flourishing, her system is democratic and just, her people are jubilant. If there is any other nation in the world that can rival her brilliance,恐怕 even the United States of America would find it hard to distinguish itself.\n\nEven though Pandora's Box stirs restlessly beneath the endless prosperity, what does it matter? Let the Russian Republic seize the treasures it offers and rush headlong into the future, heedless of all else! This is Russia's century!\n\nDance to the steps of a ternary rhythm! The world will count the beat for you! United and great Russia!"

