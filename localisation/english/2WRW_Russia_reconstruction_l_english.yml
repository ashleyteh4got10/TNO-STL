 RUS_commie_the_polic_problem_desc: "The smoke of war has not yet cleared, the banner of unity has just been planted across the land, but hidden in the shadows of the Kremlin are specters more intractable than any foreign enemy. Factional strife, old grievances unsettled, and a power structure in dire need of rebuilding. How to truly bind this land, scarred by division, into a single rope? This is the first, and perhaps most difficult, test перед the new regime. The slightest misstep, and the ruins of yesterday's warlords will breed the poisonous weeds of tomorrow's internal feuds."
 RUS_commie_law_and_order_desc: "The era of rampant warlords left behind not only ruins but also deeply ingrained lawlessness. Bandits still roam the countryside, black market transactions persist despite prohibitions, and scattered weapons threaten the peace of every corner. Rebuilding order requires not only mending broken buildings but also reconstructing shattered rules. Police need to patrol the streets, courts need to sound their gavels, and prisons need to hold criminals. Restoring the state's monopoly on violence is the prerequisite for all construction."
 RUS_commie_constitution_desc: "On a blank sheet of paper, almost burnt to ashes by war, we will redraw Russia's legal foundations. This fundamental law will define the boundaries of power, clarify citizens' rights and obligations, and shape the form of the state. It will determine whether the people hold the reins or if 'guides' will ride the horse for them. Every word weighs more than a thousand pounds; every compromise could bequeath a century of woes. This is an engineering of the soul; when pen is put to paper, one must have the courage to face history."
 RUS_commie_CSTO_desc: "A single hand cannot clap, especially in a perilous world surrounded by powerful neighbors. Russia's revival depends on the support and cooperation of allies. Should we reactivate old military alliance frameworks, huddling together with ideologically similar nations? Or should we start anew, building new types of partnerships more aligned with current interests? Or perhaps, seek a delicate balance between the two major blocs? Our choice will not only concern national defense and security but will also determine the new Russia's role and status on the world stage."
 RUS_commie_slavery_huh_desc: "In certain dark corners, on lands trampled by extremism and barbaric rule, the value of 'human' has been debased to dust. Forced labor, human trafficking, even blatant slavery... these remnants of the warlord era must be thoroughly eradicated. In the name of the state, in the form of law, we solemnly declare: on this reborn land, no one shall be enslaved, all citizens are born equal and enjoy inalienable dignity. This is not merely righting old wrongs; it is laying the first brick for the moral foundation of the new Russia."
 RUS_commie_special_action_committe_desc: "To ensure the implementation of our political measures, Comrade Andropov of the KGB is preparing to establish a new organization. This organization, subordinate to the KGB and personally managed by Comrade Andropov, aims to eliminate resistance to policy implementation, strengthen central control over localities, and eradicate corruption and societal ills. At the same time, the Special Action Committee will also delve into the grassroots to understand the drawbacks of reform measures and promote their better implementation."
 RUS_commie_civil_rights_act_desc: "What does the word 'citizen' truly mean? Besides the right to vote and freedom of speech, what other rights are sacred and inviolable? The right to freedom from fear, the right to freedom from want, the right to freedom of belief, the right to freedom from discrimination... A comprehensive Civil Rights Act will be one of the most precious gifts the new Russia bestows upon its people. It will, in legal language, promise that the state not only demands obligations from its citizens but will also guarantee their basic dignity and well-being."
 RUS_commie_northern_beacon_desc: "Now, reforms have shown initial success. Although there are still various problems within our cities, they are much better than before. With the increase in civil rights, Russia's international appeal is significantly rising. Even the most pessimistic believe that Russia's rise is just around the corner.\n\nAnd we, too, will become a beacon on the world island, illuminating the peoples of the entire world."
 RUS_commie_land_of_beauty_desc: "Oh, my motherland, how beautiful!\n\nOur policy of freedom of cultural publication is enabling further development of our societal culture, and the fact is, people love these things! Cinemas are always packed, television viewership ratings are hitting new highs. In the future, we might even be able to compete with the Co-Prosperity Sphere and export our works to their market!"
 RUS_commie_glory_of_country_desc: "Glory to Russia, our motherland!\n\nAfter initially pacifying internal political problems, our motherland is thriving. Nothing is more delightful than the greatness of the motherland.\n\nPerhaps, we can slightly shift our focus and turn our work приоритет towards social and economic construction?"
 RUS_commie_home_of_socialism_desc: "Our banner is red, our ideals rooted in the great cause of liberating all humanity. Though the road is tortuous, even once teetering on the brink of annihilation, the goal of building a socialist homeland has never wavered. Now, we must redefine the nature of this land: public ownership of the means of production, distribution according to labor (or ultimately according to need), and the working class as masters of the house. Specific models can be discussed, paths can be innovated, but the core values of socialism must guide us like the North Star."
 RUS_commie_land_of_braver_desc: "This land has witnessed too much suffering and has also nurtured unparalleled courage. From the princes who resisted the Mongol invasion to the partisans in the Great Patriotic War, and to the ordinary people rebuilding their homes today, Russia has never lacked brave hearts. We must shape this tenacious, fearless spirit into a new national soul. Through propaganda, education, and artistic creation, let every Russian be proud to be a part of this 'Land of the Brave.'"
 RUS_commie_party_politic_desc: "The boisterous square needs order; the fervent public opinion needs guidance. A unified nation cannot rely solely on the leader's command; it also needs a stable political structure to bear it. Is it to establish a united and efficient vanguard, concentrating all forces at one point? Or to allow a diversity of voices, stumbling forward through consultation and checks and balances? The choice not only concerns power distribution but will also profoundly define the future political hue and social pulse of Russia."
 RUS_commie_single_party_state_desc: "To avoid repeating the tragedy of division, to focus all our strength where the people need it, a strong and unified leading core is necessary. However, this does not mean autocracy; we allow for differing opinions within the party, but we will maintain the unity of our line through democratic consultation. This is the superiority of democratic centralism. Some believe democracy is merely a group of people bickering around a conference table, wasting national resources and time—however, we will prove to them with facts: on the contrary, the democratic system is the most excellent and efficient of all systems."
 RUS_commie_allow_other_party_desc: "Russia's voice should not be singular. Different regions, different classes, different nationalities—their demands deserve to be heard, their interests deserve to be represented. Under a unified program, we will allow various social groups to express themselves. Even if, in the short term, a consultative system makes disputes unavoidable, this is precisely what our democratic system requires—and, the unity of the entire society is a nation's greatest strength."
 RUS_commie_prepare_for_election_desc: "The ultimate source of power: bayonets, or ballots? If the latter is chosen, then the path to the polling station must be paved. Registering voters, delineating constituencies, establishing rules, allowing (perhaps limited) campaigning... all these are tedious but necessary steps to transform 'popular mandate' from a slogan into reality. This is undoubtedly a gamble—a gamble on the people's choice, a gamble on the new regime's stability. Once the bow is drawn, there's no turning back the arrow."
 RUS_commie_meeting_freedom_desc: "Not just newspapers and books, but conversations in streets and alleys, complaints in factory canteens, debates in university classrooms... how much freedom should these everyday words enjoy? Is 'dissent' equivalent to 'subversion'? Is 'criticism' equivalent to 'betrayal'? Defining the boundaries of speech is an extremely delicate art; it tests the wisdom of rulers and shapes the mentality of society's members. Is it to be a chorus of silence, or a hundred schools of thought contending?"
 RUS_commie_press_rights_desc: "In what kind of soil should the seeds of thought sprout? Carefully nurtured and uniformly pruned in a greenhouse? Or freely growing in the wild, a hundred flowers blooming? The degree of control over newspapers, books, and radio will directly reflect the new regime's confidence and magnanimity. Is it to allow critical voices, even if harsh and sharp? Or to permit only a chorus of praise, to ensure the 'correctness' of public opinion guidance? The scent of ink will be permeated with freedom or oppression."
 RUS_commie_unions_desc: "Factory chimneys are smoking again, and with them, the power of workers is re-gathering. The construction of the new Russia cannot be separated from the hands of millions of laborers. So, what role should the unions representing their interests play? Should they become a force for equal bargaining with capital (whether state-owned or private), safeguarding workers' rights? Or should they become an assistant to the state in mobilizing production and managing labor, ensuring the smooth execution of economic plans? The worker's hammer, in whose hands it is held, will determine many things."
 RUS_commie_religious_problem_desc: "The Orthodox cross has stood on Russian land for a thousand years, a symbol of faith and once a pillar of power. After decades of suppression and chaos, its role in the new era has become ambiguous. Is it to be regarded as backward superstition, to be further restricted or even outlawed? Or to acknowledge its status as a cultural tradition and a spiritual solace for some, allowing its existence within a certain framework? Or, to attempt to bring it under state management? This question touches the souls of countless people."
 RUS_commie_state_atheism_desc: "Religion is the opium of the people, a hotbed of obscurantism, an accomplice of old-era oppression! The new Russia must be a scientific, rational, progressive nation, and cannot tolerate these mystical things continuing to poison people's minds. Churches should be converted into museums or warehouses; priests should undergo labor reform in factories. Only by severing this spiritual shackle can the people truly stand up and embrace the bright future of materialism."
 RUS_commie_laicism_desc: "Perhaps, faith is a personal matter. As long as the church behaves itself, does not interfere in politics, and does not challenge state authority, then let those souls in need of solace find their peace under the church domes. Forced suppression will only create opposition and resentment. Granting limited tolerance might better secure social harmony and the obedience of believers. Let God's things be God's, and Caesar's things be Caesar's."

