 RUS_commie_the_great_social_desc: "“Russia, whither flyest thou? Answer me! ... She gives no answer.\nThe bells on the troika jingle wondrously;\n\nThe air is torn to shreds and roars like wind;\n\nEverything on earth is flying past, and other nations and states, looking askance, make way for her and draw aside…”\n\nThus the poet once questioned, filled with confusion and hope for the fate of his motherland. Now, we must answer with action: Russia will strive towards a “Great Society”! Here, it is not merely about national strength, but more importantly, the people's happiness; not just material abundance, but more importantly, spiritual enrichment; not just the absence of war, but more importantly, the possession of justice, freedom, and opportunities for every individual to fully develop. This, this is the ultimate goal for which we fight, the dazzling prospect worth all sacrifices."
 RUS_commie_social_revolution_desc: "The clamor of war has faded, yet profound societal changes are just beginning. What we are to undertake is a Soviet revolution that touches the very soul: to break the shackles of the old era, ensure that women can hold up half the sky, enable the children of workers and peasants to enter university classrooms, provide for the sick, and care for the elderly. This is not merely an institutional reform, but a reaffirmation of the ideal of 'equality for all,' shaping a society truly belonging to the working people."
 RUS_commie_modern_social_desc: "Farewell to dirt roads and oil lamps; welcome the age of electrification and asphalt roads. Modernization is not just the roar of factories, but also the songs from radios, the light critérios from windows at night, and convenient transportation connecting urban and rural areas. We must thoroughly pull Russia out of the shadows of the past, allowing her to re-emerge among the nations of the world with a brand new, vibrant face. This is a reward for the people's hard work and a symbol of national strength."
 RUS_commie_community_actions_desc: "Though the gears of the state machinery are large, they struggle to reach every minute corner of life. The establishment of Community Action Committees aims to devolve power and bring decision-making closer to the people. From repairing neighborhood roads to organizing mutual-aid nurseries, from solving heating problems to enriching cultural life, let the community become a vibrant, organic entity. The people best understand their own needs; let them build their homes with their own hands."
 RUS_commie_crime_act_desc: "The reconstruction of order cannot stop at slogans. A comprehensive Anti-Crime Act will provide law enforcement with more potent weapons to severely crack down on theft, robbery, organized crime, and other acts破坏 social tranquility. We will increase investment in police forces and reform judicial procedures to ensure that criminals have nowhere to hide and receive due punishment. A peaceful living environment is the most basic right of citizens, and the state must guarantee it."
 RUS_commie_community_no_hungry_desc: "Hunger is the nightmare of the old era and must not reappear in the new Russia. The state will establish a strong food reserve system, improve the distribution network from field to table, ensure stable prices, and guarantee sufficient supply. Let every citizen, whether in the city or the countryside, be free from the fear of hunger. A full stomach is the bottom line for survival and the foundation for all development."
 RUS_commie_healthcare_for_everyone_desc: "Health is the people's most precious asset, and the state has the responsibility to protect it. We will establish a universal healthcare system: popularize basic medical services, build a network of modern hospitals, train sufficient medical personnel, and ensure the supply of medicines. Regardless of wealth or status, every citizen facing illness will receive timely and effective treatment. A healthy nation is essential for building a strong country."
 RUS_commie_education_state_desc: "A towering edifice rises from level ground; a strong nation begins with strong grassroots education. We will invest substantial resources to improve school conditions in rural and remote areas, enhance teacher salaries and qualifications, and update teaching content and methods. We will ensure that every child, regardless of background, receives a fair and high-quality primary education. Only with a solid foundation can the edifice of the future stand tall."
 RUS_commie_high_education_act_desc: "Talent is the nation's most fundamental resource. The new education act will ensure that every school-age child can receive basic compulsory education, eradicate illiteracy, and popularize knowledge. Simultaneously, we will vigorously develop higher education and vocational technical education to cultivate professionals needed by the country in all walks of life. Knowledge changes destiny; education illuminates the future. Investing in education is investing in Russia's tomorrow."
 RUS_commie_city_runs_well_desc: "The clamor has subsided, and order prevails. After unremitting efforts, our major cities have resumed normal operations. Water and power supplies are stable, traffic flows smoothly, public security is good, and municipal services are efficient. Citizens can work and live with peace of mind. Cities are no longer collections of problems but symbols of stability and progress. 'All is well' – this is the simplest and most powerful affirmation of our reconstruction achievements."
 RUS_commie_urbanization_accelerate_desc: "New factories need workers, and new construction needs manpower. To accelerate the industrialization process, the state will encourage and guide the population to concentrate in cities. We will provide better employment opportunities, more complete infrastructure, and richer cultural life, making cities powerful magnets for talent and wealth creation. The tide of urbanization will propel Russia onto the fast track of modernization."
 RUS_commie_city_nights_desc: "When night falls, the city should not descend into silence and darkness. Bright streetlights will illuminate every street, safe parks will provide places for residents to rest, and planned lighting will outline the contours of buildings. Let the nighttime city also be full of vitality and charm, making late-returning workers feel safe and families enjoying strolls feel comfortable. The city's nightscape is a mirror reflecting the quality of life."
 RUS_commie_engine_stabled_desc: "After high-speed operation, steady control is even more necessary. The engine of economic development has entered a stable operational state. Growth is no longer a wild surge but a sustained, healthy, rhythmic advance. We have successfully managed the inertia of development, avoiding the risks of overheating and loss of control. A strong and stable economic foundation has been firmly laid."
 RUS_commie_engine_boosted_desc: "The great flywheel has begun to turn, and faster and faster. Factories are at full horsepower, mine output is surging, and freight traffic on the railways is bustling. The engine of the national economy has been ignited, and with unprecedented power, it is driving Russia to accelerate towards prosperity. The growth curve is no longer a gentle climb, but a steep ascent!"
 RUS_commie_nights_of_russia_desc: "§YLike birds, song after song,\nSongs fly over the Soviet land.\n\nSinging in cities and fields,\n\nLife has become better,\nLife has become happier!§!"
 RUS_commie_future_is_come_desc: "The once distant vision now unfolds beneath our feet. Roads connect, factories operate, cities revive, and order is rebuilt. We have watered the ruins with our sweat, and the seeds of hope have sprouted. Though challenges remain, we can proudly say: that era of fragmentation and despair is over. Russia's future is not an ethereal dream; it is here, within reach."
 RUS_commie_russia_city_desc: "Farewell to a past of rubble and muddy streets; our cities need rebirth. Systematic planning will replace temporary repairs: modernized water and heating systems, efficient urban public transport networks, sturdy and comfortable new residential areas, and essential green parks. Let cities not only be centers of production but also livable, safe, and vibrant homes. Moscow, Leningrad, and all cities will radiate with new splendor."
 RUS_commie_sports_night_desc: "The city's night should not belong solely to darkness and danger. We will light up the courts and organize 'Midnight Sports Meets' to provide a healthy outlet for restless youth. Basketball, football, street dance... let sweat replace alcohol, and team spirit dispel the shadows of street gangs. Let youth shine in competition, not be consumed on misguided paths. This is not just sports; it's an investment in the future."
 RUS_commie_what_keeps_us_together_desc: "Having endured calamity and fragmentation, by what means do we re-coalesce into a whole? Is it shared memories of suffering, common hatred for aggressors, a shared vision for the future, or the thousand-year culture flowing in our veins? Through education, propaganda, and cultural construction, the state will rediscover and reshape the meaning of 'Russian,' forging a sense of community that transcends regions and factions. Unity begins with identity."
 RUS_commie_fight_to_poverty_desc: "Poverty, the most stubborn cancer left by war, is a festering wound on the social body. We cannot tolerate fellow citizens starving or lacking clothing within our unified land. The state will mobilize all resources to declare war on poverty: providing basic living security, creating employment opportunities, improving education and medical conditions, and ensuring every Russian can enjoy dignity and hope. This war, we must win."
 RUS_commie_min_wage_desc: "The sweat of laborers deserves a dignified life. The state will enact and enforce minimum wage standards, ensuring every full-time worker can earn a remuneration sufficient for basic needs. Bid farewell to abject poverty and exploitation, and let diligent work become a reliable ladder to a decent life. This is an affirmation of labor's value and a cornerstone of social fairness."
 RUS_commie_work_hours_desc: "Machines need maintenance, and people need rest even more. Endless overtime only exhausts laborers' energy, ultimately harming efficiency and health. The state will strictly regulate legal working hours, safeguarding workers' right to rest. Eight hours for work, eight hours for rest, eight hours for oneself and family. Healthy laborers build a healthy nation."
 RUS_commie_social_revolution_act_desc: "The new era calls for a new social contract. The New Revolutionary Society Act will systematically eradicate the dregs of the old era and establish progressive social norms: guaranteeing freedom of marriage, opposing domestic violence, strengthening protection for minors, and encouraging social mutual aid. It will, in legal form, solidify our pursuit of a just, equal, and civilized society, laying the foundation for the social life of the new Russia."
 RUS_commie_tech_reborn_desc: "To fall behind is to be beaten; technology is the engine of national strength. We must rebuild the scientific research system destroyed by war, invest heavily in basic science and applied technology research, and cultivate a new generation of scientists and engineers. From precision instruments to heavy machinery, from bioengineering to information technology, Russia must catch up and secure a place in future technological competition. Innovation will be the key driving force for revival."
 RUS_commie_colorful_culture_desc: "Spiritual nourishment is equally indispensable. While rebuilding materially, we must revive Russia's rich and colorful cultural life. Theaters will once again stage classics and new works, galleries will showcase talented creations, libraries will be filled with intellectual treasures, and cinemas will tell our own stories. Encourage creation, support exchange, and let the prosperity of culture and art become a dazzling landscape of the new era in Russia."
 RUS_commie_green_social_desc: "While rebuilding our homeland, we must not forget to protect Mother Nature who nourishes us. The era of indiscriminate logging must end, polluted rivers need治理, and city air should be fresh. We will vigorously promote afforestation, establish stricter industrial emission standards, and protect precious natural environments. A green Russia is a truly sustainable home."
 RUS_commie_equal_social_desc: "Equality is a sacred principle inscribed on our banner. Whether male or female, whether Russian or of other brotherly nationalities, whether worker or peasant, all should enjoy equal rights, dignity, and opportunities. We will continue to fight against all forms of discrimination and privilege, striving to build a society that truly embodies fairness and justice, allowing all members to shine."
 RUS_commie_open_social_desc: "Seclusion only leads to stagnation and backwardness. On the premise of national security, Russia will embrace the world with a more confident and open stance. We will encourage foreign trade and cooperation, promote cultural and academic exchanges, and welcome friendly visitors. Let fresh air in, let the world understand the real Russia, and let Russia better integrate into the global trend of development."
 RUS_commie_great_social_law_desc: "Finally, it is done. We have overcome countless difficulties and finally achieved the great society dreamed of for centuries. The new system will shape the face of Russian society for decades to come. We are now in an era of peace, the people are happy and prosperous, and they have full confidence in the system. Thanks to a series of policies, even the poorest communities of the past are no longer impoverished, all due to our great social reform plan."

