 TNO_menupic_tooltip_1: "§FFrom Heaven's Peak arise §Lthe bright moon,§! boundless the clouds and the sea.\nTen thousand miles blows the wind, past the §OJade Gate§! to the west.§!"
 TNO_menupic_tooltip_2: "§F§xWe Han§! marched to Baideng Pass, §mbarbarians§! surveyed the Qinghai Lake.\nFrom §Vthis campaign's battlefield,§! we have yet seen none return.§!"
 TNO_menupic_tooltip_3: "§F§xThe garrisons§! gaze on the border towns, §Rfaces bitter with longing for home.§!\nFrom their towers this night, their wives §Rsigh with emotion.§!§!"
 TER_version_intro_tt: "§LLuna Ex Montibus Oritur§!\n\n§L\"Moon Over the Mountains\"§!, or Luna Ex Montibus Oritur, is a piece of military music for the flute and drums dating back to the Han dynasty. Its tune was quickly adopted by the northern barbarians, and often sung by the §xHan soldiers§! §Ostationed in the Northwest.§! Often accompanied by grand drums and golden cymbals in addition to bili, whistle, and bamboo flutes, its air is majestic yet desolate; it invokes §Rthe garrisons' long yearning to return, the sorrowful departures that haunt their hearts.§! Its lyrics have been lost since the Wei and Jin dynasties, but during the Southern Liang dynasty poems were again composed to the same tune. At the height of the Tang dynasty, Li Bai wrote his own §L\"Moon Over the Mountains\"§!; this version, of grandiose origin, is the standard to this day.\n\nCorresponding TNO version: §WOperation Deep Freeze - Ver.1.x.x§!"
 TER_version_intro_tt_delayed: "§FFrom Heaven's Peak arise the bright moon,\nBoundless the clouds and the sea.\nTen thousand miles blows the wind,\nPast the Jade Gate to the west.\nWe Han marched to Baideng Pass,\nBarbarians surveyed the Qinghai Lake.\nFrom this campaign's battlefield, \nWe have yet seen none return.\nThe garrisons gaze on the border towns, \nFaces bitter with longing for home.\nFrom their towers this night, \nTheir wives sigh with emotion."