 BJC_Yu_Luoke_desc: "His father is a Japanese student working as an engineer for a Japanese hydroelectric power plant and earns a good income. He did not disappoint his parents, getting excellent grades from elementary to high school. However, a threshold came down from the sky the year he went to college. All Chinese working in Japanese companies had to send their children to Japan for higher education, and they were not allowed to attend Chinese universities.\n\nBoth father and son understood the meaning behind this order. Japan is not the same as in the past. Japan is so attractive to Chinese talents that they can never return to China once they go to Japan. So he decided to give up his qualification, face society, and make a living. He worked as a waiter, an apprentice, a substitute teacher for a night school, and finally, as a librarian for a high school library. He began to think about why, in any era, the workers at the bottom of the hierarchy are as lowly as dirt.\n\nHe wrote down his thoughts in a book, and a colleague read it and called him \"brainwashed\" by \"red thoughts.\" He has already started writing articles for some journals."
