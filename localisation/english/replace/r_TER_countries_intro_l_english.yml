 CPC_CountryInfo_Content.1: "Philosophy of Existence"
 CPC_CountryInfo_Content_desc.1: "\n\n\n\n\n\n£TER_CPC_Countryinfo_1_1\n\n\n\n\n\n\n\n\"Shanxi people should rule Shanxi, for it is their duty to guard the land.\" – Yan Xishan, 1941\n\nIn March 1939, although a spring wind blew, it could not rescue the nation and its land from dark clouds above.\n\nShanxi Province was captured by the Japanese in two-thirds, the remaining one-third, the Eight Road Army took away half, as the leader, Yan Xishan, only cowered in the southwest of Shanxi, the whole day frowned. Japanese invasion makes him worry, behind the Communist Party to \"assassinate\" is even more worried. Shaanxi Qiu Lin, the Communist Party, and the representatives of the two parties gathered at the conference table, the Communist Party wants Yan Xishan to recognize the fact that the Eighth Route Army opened up the Taihang Mountains base area, and not fear the Kuomintang may launch a wave of anti-communist. After listening to Bo Yibo's offer to \"continue to maintain cooperation\", Yan Xishan only felt his scalp tingling, his heart a sickness. But what qualifications did he have to bargain in front of the Communists who were determined to resist Japan? To save some face, he had to tell a small fable without a head: \"Do not think that your new car is fast, my old car is slow. The new car is fast, it turns over fast. The old car is slow but goes steadily.\"\n\nCompared to the Eighth Route Army, Chiang Kai-shek is a poisonous and ruthless total snake and scorpion. Last winter's Nanyue military conference, Chongqing governor He Yingqin to the second war zone issued strategic counter-attack instructions, but the armament and rations have not increased. And stationed in Suisi Fu Zuoyi proposed \"local training, local food\" request, Chiang Kai-shek is not allowed on the grounds of \"compassion for the people\", replaced by 100,000 central armies stationed in southern Jin, food, and provisions to the Yellow River crossing, the name is joint defense, but for surveillance. It seems that this winter, the Jinsui army and inevitably some consumption sacrifice. In private, Yan Xishan more than once to his subordinates directly reveal his state of mind: \"three eggs are broken two, you ask me how to do!\" Perhaps the \"anti-Japanese\" is just a ragged Demoiselle, neither shelter from the wind and rain, nor eat, not to mention the preservation of this part of Shanxi.\n\nIn early 1940, the winter offensive was thwarted, and just when he was discouraged, Itagaki Shoushiro sent a letter to Yan Yiting, Yan Xishan's nephew, on behalf of the pseudo governor of Shanxi, supporting Yan Xishan to break ties with Chongqing and switch to the Japanese side to rule Shanxi and jointly prevent the Communist Party. Yan Yiting weighed the matter and found it feasible, as for his uncle's idea, it was clear in his mind. The negotiations between the two sides progressed rapidly, and by the middle of 1940, Zhao Chengshou, commander of the Seventh Army Group in Shanxi, in the capacity of Yan Xishan's plenipotentiary, held secret talks with Nanshan Hideyoshi, representative of the North China Front Army, in Fenyang to discuss various matters after Yan Xishan had left Chiang and rebelled against the Communists. The Japanese Army restrained its desire to recruit Yan Xishan to regain the throne of Shanxi, allowing him to sit on his everything (even the army), and all members of Yan's family were also rewarded. The talks ended with Yan Xishan's full agreement to join Japan. It is hard to imagine that if Japan's sincerity had been a little more shallow, or if Yan had been more deeply influenced by anti-Japanese generals, the Fenyang talks would have ended without a hitch.\n\nAt the beginning of 1941, perhaps the Hundred Regiment War launched by the Eighth Route Army completely stimulated Yan Xishan, he could not see the Communist Party growing a bigger and bigger threat to himself, so he sent a letter of denunciation to Chongqing, condemning Chiang Kai-shek's \"crime\" of indulging the Communist Party and stubbornly resisting Japan, and led a group of followers to fly to Taiyuan by plane."
 CPC_CountryInfo_Content.2: "Second in Asia..."
 CPC_CountryInfo_Content_desc.2: "\n\n\n\n\n\n£TER_CPC_Countryinfo_1_2\n\n\n\n\n\n\n\n\"Dear Chairman Chiang, it is with the deepest sorrow that I hand in my letter of resignation ...... I sincerely hope that the Chairman will be able to look for a more outstanding military talent outside of me, as I am incapable of turning the tide of the war in Burma or saving the lives of more than 100,000 Chinese lads ...... I am deeply guilty ...... Please let me say goodbye to you for the last time ......\" - -Stewart, 1943\n\nIn 1942, Du drove into Burma with a 100,000-strong expeditionary force at a time when the Allied Coalition in Burma was a bad book.\n\nThe British in Southeast Asia, as landlords, had no hospitality at all, were arrogant and complacent, did not recognise the lessons of continental Europe, and continued to adopt appeasement rather than active defence against Japanese aggression, attempting to preserve their colonies through peace talks. As for the treatment of allies, Britain only had eyes for itself. For the sake of \"national dignity\", Alexander, the commander of the British army in Burma, ignored the imminence of the war and wasted a week to fight with Stilwell, the new American commander in the battlefield, for the right to command, thus causing disorders in the chain of command.\n\nOn the other hand, the Americans, anxious about the tragic loss of Pearl Harbor, attached great importance to the Allied forces in Southeast Asia, and their military advice was closer to the situation on the battlefield.\n\nBefore entering Burma, Chiang Kai-shek generously authorised to hand over the command of the Expeditionary Force to the British, and Du Yuming only cooperated with the British. However, Du himself synthesised his own situation after arriving in Burma and concluded that the British army from top to bottom did not want to fight at all, and that their orders might get the expeditionary force killed, so the expeditionary force could only listen more to our Chinese own words (or Stilwell's) under the premise of not damaging the alliance relationship as much as possible.\n\nBut it was easy to jump to conclusions and hard to carry them out, and the war situation was soon at the point of total collapse.\n\nIn January 1942, Thailand joined the Japanese camp, providing it with military rights of passage and supplies, and large numbers of Japanese troops poured into Burma from the east along the coastline, quickly taking the Burmese capital, Rangoon, within a week in conjunction with naval landings. In March, Alexander ordered Du Yuming to fill the expeditionary force with troops to cover the retreat of the British, and the Chinese took the beautiful battle of Tonggu, but the unauthorised withdrawal of the British left the expeditionary force in a desperate situation. Finally, in May, Japan routed the British troops on the right side of Mandalay and surrounded the Expeditionary Force trapped in central Burma with a surprise attack behind enemy lines. Du Yuming was forced to order the expeditionary force to split into three groups and break out to the north. Tens of thousands of expeditionary soldiers were trapped in the dense forests of northern Burma, where the water was steaming and the roads were long and the mountains were high.\n\nIn 1943, in order to co-ordinate the anti-fascist alliance after the collapse of the Soviet Union, the Allied Powers decided to hold a summit-level meeting in Wellington, New Zealand, to which Chiang Kai-shek was invited as a Chinese leader. At the meeting, the British government did not review the failure of the series of battles in Southeast Asia, and Churchill did not care about Burma at all. He naturally blamed the Chinese army for its weakness, and repeatedly conveyed the view that China was incapable of cooperating with the Allies in the war to the American President Dewey, and hoped to abandon Chiang Kai-shek on the grounds of the deterioration of the situation in the region: \"If the Yunnan-Burma Highway is lost, the promises that we have made to China will be empty promises! promises made to China would all be empty promises, so we might as well return our attention to the European continent.\"\n\nDewey did not immediately agree to Churchill's request in the light of the overall situation, but it was also clear to the United States that there was nothing it could do to support the Chinese resistance. Chiang Kai-shek and the pleas for help he carried were dealt with coldly amidst a round of applause."
 CPC_CountryInfo_Content.3: "Lonely Endurance"
 CPC_CountryInfo_Content_desc.3: "\n\n\n\n\n\n£TER_CPC_Countryinfo_1_3\n\n\n\n\n\n\n\n\"Peng Dehuai said that he basically carried out the correct line of the Party Central Committee in the war of resistance in North China. I don't quite agree; the word 'basically' should be taken out.\" --Liu Bo Cheng, 1943\n\nThe evaluation of the Hundred Regiments War runs through the revolutionary history of the CPC: the more victorious the revolution, the higher the praise within the Party; the more the revolution fails, the more the Party denigrates it. This is both a barometer of the Chinese revolution and a personal tragedy of Peng Dehuai's character.\n\nAs the Japanese occupation zone expanded, the weakness of the Japanese army's shortage of troops gradually became apparent. Direct control of the occupied areas became impossible, and the Japanese military began to use the lines of communication as the centre and the fortresses as the fulcrum, dividing and encircling the countryside, blockading and restricting the development of the base areas.\n\nIn 1939, Nie Rongzhen, in his report \"Enemy Situation in the Jinchahi Border Region\", believed that breaking up the Japanese lines of communication would be the main task of the base area in the next two years, i.e., breaking the cage. Before the Hundred Regiments War, the Eighth Route Army in the southern Hebei and eastern Jindong areas had already conducted as many as 1,500 breakthrough battles against lines of communication, which generally boosted the confidence of the commanding levels. Calls for a total defeat of the Japanese invasion and a general decisive battle also emerged slowly in the base areas. The Kuomintang's anti-Communist campaign, which stigmatised the Eighth Route Army as a \"wandering army\", also contributed to Yan'an's future war plans.\n\nIn the face of noisy public opinion inside and outside, the straightforward Peng Dehuai proposed to the Party Central Committee that he organise a large-scale battle. Voted on by all Central Committee members, Peng's proposal was unanimously approved. From August 1940 to February of the following year, after the Zhengtai railway breakthrough battle, the second offensive and winter anti-sweeping, a total of 470 kilometres of railways, 1500 kilometres of highways, uprooting the strongholds of 290, seriously thwarted the Japanese transport blockade of the strategic concept. Chiang Kai-shek sent a commendation order to the Eighth Route Army, and Yan'an was in a state of jubilation.\n\nBut was that the end of the story? No.\n\nYan Xishan claimed that the Communists were forced to surrender to Japan by their growing ambitions to annex themselves. This was a traitor's falsehood, but it was a refutation of the KMT's \"alliance with the Communists\" argument, and it became an unbridgeable rift in the united front. After the defeat at Zhongtiao Mountain, there was no more national army north of the Yellow River. At the same time, Germany's invasion of the Soviet Union was victorious, Japan's invasion of Southeast Asia was unstoppable, and the Allies were unable to provide strong support to the Chinese battlefield - thus enabling the Japanese to deploy more frontline troops to participate in the security war in North China, and the situation in the rear of the battlefield deteriorated rapidly. In spite of the great victories, the successive defeats were difficult to anticipate in Yan'an.\n\nIn 1941, Okamura Ningji, the newly arrived commander of the North China Dispatch, quickly adjusted his strategy by adding a crucial step - the creation of a no-man's land. The use of force to coerce the people in the demarcated area to relocate to the area under the actual control of the Japanese army was accompanied by armed purges, completely destroying the economic base in the no-man's-land and weakening the ability of the base area to recover. After a grate sweep, even if the Japanese retreated and the Eighth Route Army reoccupied the area, the base area, which had lost its source of supply, would be difficult to recover and could only be completely abandoned. This type of purging caused serious difficulties to the base areas of Taihang, Chahar and Jinchahi. In particular, the Iron Wall Sweep that began on 1 May 1942 caused the most affluent base area of Jizhong to fall into the hands of the enemy, which was an incalculable loss to the Eighth Route Army.\n\nObjectively speaking, it was not the fault of Peng Dehuai and the Hundred Regiments War that the base area shrunk significantly in several sweeps by Okamura Ningji from 1941 to 1942, but the war situation would not be reversed by one or two victories.\n\nIn February 1942, Mao Zedong launched a political campaign called \"Rectification\" to purge defeatism and improve the quality of party members. In contrast to the underlying logic, however, the higher-ups wanted to clear up historical issues and unify their thinking during the rectification campaign. Peng Dehuai received an order from the Central Government to return from the front to Yan'an for a meeting. There were no crowds of flowers upon his arrival, only accusations in his face. Launching the Hundred Regiments War became his guilt, \"military adventurism\", \"Primakov line\", \"ambitious\" and so on hat squarely on his head. Ordinary members of the noise Peng Dehuai can be ignored, so that he was angry that no one in the centre to help him refute, on the groundless attacks completely let it go, as if he called himself back to be scolded for this.\n\nOpen the whole session of criticism, out of the venue Peng Dehuai finally breathed a mouthful of fresh air, full of stifled stomach not spit out: \"hiding in the back command small fish and shrimp to me to add nausea, what kind of thing.\" The speaker has no intention, the listener has the intention, behind Mao Zedong's face \"swish\" to black, without saying a word aside Peng Dehuai, into the vast crowd."
 CPC_CountryInfo_Content.4: "Insult to Injury"
 CPC_CountryInfo_Content_desc.4: "\n\n\n\n\n\n£TER_CPC_Countryinfo_1_4\n\n\n\n\n\n\n\n\"The Central Plains meeting, the hearts and minds of the people are scattered, I should also prepare early ...... Hold the determination that I would rather die than meet with Wang's rebellion.\" -- Chiang Kai-shek, 1944\n\nIn Chiang Kai-shek's mind, the Japanese invasion was a golden opportunity for him to unify China. Communist, Northeast, Northwest, Gui, Dian, and Sichuan ...... The opponents would fall one by one in the war, and he himself would become a saint in history, the winner who laughs at the end. It was this mercenary trade-off that allowed him to build a psychological breakwater of resistance to the end. The dream-starved Chiang Kai-shek thus sold his comrades in the trenches one by one to the Japanese mouth, feeding the enemy and moving. Therefore, after the war against Japan entered the endless phase of stalemate, the Chongqing government or Chiang's central army could hardly do anything, at least when Japan returned to the Chinese battlefield with the Pacific victory, Chiang did not care much.\n\nAt the end of 1943, although the U.S. warships kept bumping into the absolute defense circle of Japan, the collapse of the Soviet Union allowed Japan to lift the defense of Manchuria - the Kwantung Army, in cooperation with the mainland dispatch force, had lined up 30 divisions, 2 tank divisions, 15 mixed brigades, and 1 flight division within the Great Wall with a total of 850,000 troops to implement the Omotesai's plan to enter Shaanxi and San Francisco in 1942. In 1942, the \"No. 5\" battle plan was proposed to enter Shaanxi, Three Gorges, and annihilate the Chinese resistance.\n\nAt this time, Jiang Dingwen, who was at the front line in Henan, received information about the large-scale movement of Japanese troops on the north bank of the Yellow River, and repeatedly sent telegrams to Chongqing requesting to strengthen the defense, but they were all called back with the reason of \"nothing more, do not add disturbance\". Jiang Dingwen wanted to cry, he also understood in his heart: the central government has not been able to squeeze money to support the front. Worried, he could only get on a car and run along the Yellow River under the bloody sun, reminding the engineers over and over again to dig the river fortifications deeper and deeper ......\n\nIn April 1944, the war came on time and the Japanese army was divided into three routes to attack the five provinces of Shaanxi, Henan, Hubei, Hunan, and Guangxi. From Tongguan in the north to Guilin in the south, the cold and merciless artillery fire knocked the Central Plains into pieces little by little. Henan National Army lost 300,000 soldiers in a month, and the whole territory of Henan fell; Changsha in the hands of the proud and arrogant Xue Yue fell into the hands of the Japanese in less than a week, 250,000 defenders immediately collapsed; Hengyang defenders vowed to resist to the death, surrounded by the Japanese held on twenty days after the surrender of the ammunition, the loss of more than 30,000 people; Guangxi in Gui Yue Jiang allied forces totaling 200,000, in the face of the Japanese invasion only know to run away, losing ground humiliated division, a month lost the provincial capital Guilin ...... was in Chongqing war general counsel Bai Chongxi received a war report of a big defeat, lamented: \"Since the war, not seen defeat such as this.\" On the other side, Japanese commander Okamura Ningji rubbed his hands excitedly and said to the staff officers around him, \"I see that the Chinas incident will be completely resolved in this year.\"\n\nFaced with the defeat of the entire eastern troops like a mountain, compared to the all-day burning brow jumping up and down He Yingqin, Chiang Kai-shek was incomparably calm. Neither when the subordinates fell tea cup scolding, nor openly explain everything. It seems to be prepared in advance for the arrival of disaster. In this period of sluggishness, Secretary Chen Brei is difficult to meet Chiang Kai-shek in his residence, if asked where Chairman Chiang is, are said to inspect the Chuan Kang highway to go.\n\nThe road from Sichuan to Xikang is a plan that has been on the government's desk since the Qing Dynasty. Since the Republic of China, Liu Xiang, the king of Sichuan, and Liu Wenhui, the clique of Xikang, sent engineers to inspect the terrain and build a 151-kilometer road from Chengdu to Ya'an in four years' time after the two families had agreed to make peace. Now the war situation has signs of the next world, Chongqing has become the front line, the national government continued to retreat to the west, a small water pipe between the provincial capital alone is not enough to link the two provinces, temporary hold the Buddha's feet to urge the expansion of transport routes - Chiang Kai-shek is very concerned about this matter, every three to five days, he threw away the matter at hand, pulling a few cronies in a car in Chengya road to urge the construction progress. Liu Wenhui had to dress up all day to welcome Chairman Chiang's motorcade in formation. The embargo on intelligence led to Chiang Kai-shek always mysteriously disappearing and then mysteriously appearing every time he traveled in the eyes of ordinary people.\n\nAt a time when the war situation was unmanageable, the head's on-again, off-again appearance could only convey one signal: he was going to slip away! The ordinary people who lived under the constant threat of Japanese invasion and who hated and feared the wartime system were ignited by the fires of ignorance, and from time to time there were outbursts of students in Chongqing and Kunming, accusing the two leaders (Chiang Kai-shek and Long Yun) of not doing their best to resist Japan, one fleeing and the other surrendering. The anger of the students spread to the barracks and stirred up a thousand waves among the soldiers who had lost their homes, especially those from the northeast, the two lakes, and Jianghuai, including the Central Army, on which Chiang's system relied survival. As a minister, Zhang Qun went to the barracks to offer condolences and was smashed out with mud and rocks. The army was scattered, and the anger of the people was hard to be appeased, Chiang still did not openly indicate his plans, he wanted to put all his energy into operating the Great Southwest, and wait until the day the central government moved away as if all misunderstandings would be solved, but unfortunately, the plain angry soldiers did not give him the opportunity.\n\nOn this day, the convoy drove on the Chuan Kang Highway again. Chiang Kai-shek was in the head car turned a corner, a military truck rocket speed head-on, landslide a loud sound, and the head car flew down the cliff. The back of the convoy collectively braked, the second car Chen Cheng looked at the ground debris like a fool, the neck stretched long, like clutching the neck of a large white goose.\n\nChiang Kai-shek and the driver bodyguard died on the spot, and the driver of the accident died on the spot. The locomotive department was collectively accountable, and access to the outward transfer records uncovered the accomplices who applied for the outward transfer. In the face of torture, several murderers appeared very frank, yelling in a Hunan accent: \"Chiang old dog to run, do not resist the Japanese we will get him dead!\"\n\nThe mastermind behind the assassination, everyone pointed to the old man Tang Shengzhi of Hunan. Some say he took revenge on Chiang Kai-shek to clear his name of abandoning Nanking; others say he took revenge for the people of Nanking. However, Dai Li investigated thoroughly from the beginning to the end, but besides finding out that Tang Shengzhi had collusion with the Communists, he did not find any evidence to arrange the assassination. In order to recover the situation, Dai did not immediately declare Tang Shengzhi innocent, but only continued the isolation examination and strictly blocked the news. For the next month, there was no progress in the assassination case. The murderers put a large group of party officials under torture, but anyone with a discerning eye could see that this was a haphazard confession, and the testimony was completely disorganized. Dai was getting scared, was the truth right in front of his eyes, to begin with? No one wanted to believe that the whole assassination was just a few junior soldiers committing a crime of passion and running over Chairman Chiang at their own whim, it was ridiculous!\n\nThat said, Chiang Kai-shek is dead after all, and died so fantastically, so who will pick up the task to fight against the Japanese?"
 CPC_CountryInfo_Content.5: "Hit When We Were Down"
 CPC_CountryInfo_Content_desc.5: "\n\n\n\n\n\n£TER_CPC_Countryinfo_1_5\n\n\n\n\n\n\n\nAs Chiang Kai-shek's preferred successor, Chen Cheng seemed to have the right to inherit everything from Chiang Kai-shek, his position, prestige, and power, but this goal was so far out of reach.\n\nWith the death of Chiang Kai-shek, the greatest political support for Chiang's officials collapsed, and the National Government, which had been built on the basis of personal loyalty, gradually disintegrated. For the ruling faction, the end was only a matter of time, but for those outside the Chiang clique, the golden locks were unlocked, and they could not hold back their excitement, eager to take the biggest slice of the remaining power of the Chongqing government. In a word, no one really accepted the continued rule of Chiang's henchmen. As rumors of Chen Cheng's eligibility for succession swirled in the wind, so did opposition.\n\nJapan astutely caught this subtle change, and agents of Kenji Doihara immediately presented Yunnan warlord Long Yun with a great gift: a plan to resolve the Yunnan secession, developed by Chief of General Staff Chen Cheng in the spring of 1944. Chen Cheng planned to mobilize troops in Yunnan to enter Burma in the winter of 1944 to fight with the British. When Yunnan's defenses were empty, the Central Army could march into Kunming, place Long Yun under house arrest, and then ask Lu Han to reorganize the Yunnan government to make it completely subservient to the Central Government. This plan was not implemented because Japan failed to launch the \"No. 5\" war plan, and now it was on the desk of Yunnan President Long Yun in its original form.\n\nHe first suspected that Lu Han and Chungking were conspiring against him, so he sent someone to call his cousin to his house and scolded him for \"betraying his master and seeking glory and ingratitude. Then he dropped the plan to the ground and ordered Lu Han to pick it up and see what he had done. The company's main business is to provide a wide range of products and services to the public.\nLong Yun cross-examined, \"How do you prove it?\"\nLu Han patted his chest and said, \"If elder brother must suspect me, I will immediately resign from all my public positions, hand over my army and go into exile overseas, anyway, elder brother has also uncovered Chongqing's conspiracy, and I can leave with peace of mind.\"\nHearing this, Long Yun hated a long sigh: \"Really people do not harm the tiger's heart, the tiger has the intention to hurt people.\"\n\nPut down the suspicion of Long Lu two people looked at the wall clock, the hour hand pointed to 12 o'clock, the clock struck. At this time the kitchen has prepared lunch, Lu Han and he sat opposite, a command, large plates and small bowls all over the table. In the course of a meal, the two Yunnan heads made a pact at the table to break away from Chongqing and become independent and autonomous.\n\nChen Cheng didn't want to let Jiang's leadership go down the drain, but reality forced him to share the hot power with others. Long Yun's treasonous act was passed to Chen Cheng, and the text of the severance was word-for-word heartbreaking. His stomach hurt even more, so much so that he was sent to the emergency room for resuscitation. After an operation, Chen Cheng lay in a clean white ward, hitting his eyes to look out the window, the gray haze made him physically and mentally exhausted. But the outside world was still hot on his heels, eager to know who would be the next head of the national government. At that moment, a man made a surprise visit. He was dressed in military uniform, wearing sunglasses, with a steady gait and a sunken face, this person is the leader of the Gui warlord system - Li Zongren.\n\nLi Zongren into the ward without ceremony, sitting directly opposite the hospital bed, take off the sunglasses, two arms to the armrest, looking straight at Chen Cheng's withered face, opened his mouth and asked, \"Do you know what kind of chaos outside?\"\nChen Cheng shook his head.\n\"What are you prepared for when Long Yun defected?\"\nChen Cheng shook his head again.\n\"Who can meet the Japanese attack on western Hubei?\"\nChen Cheng shook his head again.\nLi Zongren laughed contemptuously, picked up his teacup and took a sip of water, cleared his throat and said, \"I'll help you, do you want it?\"\nThis sentence is like a loud bell, around Chen Cheng's brain for more than a dozen revolutions to respond. He also wanted to be tenacious one last time, to Li Zongren spoke of \"people and\" -\n\"The party does not support you, and the people do not necessarily support you, why do and u suffer?\"\nLi Zongren did not answer immediately, nd smiled, put on the sunglasses and stood up and said, \"This will be the only public discupursuit tomorrow they will meet, discuss together, maybe it will work.\"\nSaying that, Li Zongren turned around and was about to leave.\n\"This is not what you mean, right.\" Chen Cheng to pursue in the end, who gave Li Zongren the courage to take his place.\nLi Zongren stood in the doorway, not looking back: \"After you were hospitalized, Jiansheng advised me, saying that if I were the chairman, the situation of the war would not be better, so I came to inform you today.\"\nAfter saying that, Li Zongren raised his head and went away. "
 CPC_CountryInfo_Content.6: "A Step Ahead"
 CPC_CountryInfo_Content_desc.6: "\n\n\n\n\n\n£TER_CPC_Countryinfo_1_6\n\n\n\n\n\n\n\nIf you are not in your position, you are not in charge. Now the chairman of the committee is He Yingqin, who was approached to report news of Japan dropping the atomic bomb on the United States. --Bai Chongxi, 1945\n\nThe brotherly Bai Chongxi (Jiangsheng) advised Li Zongren to run for the head of the Kuomintang only to preserve national unity, but it was the political situation that really pushed Li to run - for himself.\n\nLi Zongren was not only a representative of Guangxi, but also a nationally acclaimed anti-Japanese star, with an indelible medal on his chest - the Great Victory of Taierzhuang. When Chiang Kai-shek's army was crushed by the fierce offensive, and the morale was falling, a kind of crisis on the verge of extinction was felt by the patriotic sentiment of the people, and the newspapers were full of memories of Li Zongren's glorious achievements. This sentiment even infected the grassroots figures of Chiang Kai-shek's faction, most of whom would not or dare not oppose Li Zongren's march to the top. The first time I saw him, I was able to get to the top.\n\nAs long as Li Zongren force to save the people in the fire, he is the first national hero in the history of the world. However, the chaos of this infighting as a starting point, can everything go well towards the end?\n\nWhen Li Zongren left the hospital, Chen Cheng immediately organized a counterattack, he was not recovered from a serious illness in the ward to pass out an order to change personnel. Chen Cheng in the name of He Yingqin ordered Bai Chongxi back to his own military district, not to intervene in the military, hollowed out the power of Bai Chongxi in the military commission. He then added Hu Lian and Huang Wei to the staff corps to divide the command of the Gui officers. At the same time, Luo Guangwen was appointed as the commander of the Chongqing police, taking over the defense of the accompanying capital area, and strictly forbidding the Gui army from entering Sichuan to eliminate the risk of military mutiny. All orders bypassed Li Zongren's eyes and went straight to myself. Bai Chongxi received the order to return to the front line in Guangxi, but naively think that they want to serve as the commander-in-chief of the counter-attack on Guangxi, did not have time to say goodbye to Li Zongren packed a bag overnight and rushed to Guiyang. But to the ground is like into the ice cellar, completely isolated up, not allowed to communicate with the outside world, Li Zongren also can not see him. There is no counterattack, only retirement with duty. Chen Cheng felt relieved that the team behind Chiang Kai-shek was still stubborn. Li Zongren rely on public opinion to complete the \"forced Palace\", but not many people in the Kuomintang is willing to cut the seat with Chen Cheng for him. Li Zongren could give orders, but the final implementation was not in his hands. Li Zongren became the president of the KMT in March 1945, which was his only victory.\n\nDuring those six months while the KMT was bickering internally, the Japanese were suddenly quiet, with no military action, no large-scale bombing, and an eerie calm on the battlefield. As the threat of war eased, the Nationalist infighting intensified, but the Japanese did have their own business to attend to, such as receiving the German envoy. 1944 saw Germany on the verge of total conquest of Europe, which made Japan, mired in Asia and the Pacific, impatient to end the war. To this end, the German ambassador Stammer brought great news: Germany, after helping Italy to end the war in Africa, would solve the greatest difficulties for Japan - those of America.\n\nSometime at 00:00 on July 4, 1945, under the darkness of night, a German strategic bomber took off from the Japanese aircraft carrier Shinano and flew serenely for eight hours before dropping an atomic bomb on the Hawaiian island of Oahu against the rising sun. The bomb, once again, destroyed Pearl Harbor, and the Americans lost all their chips and left the World War table in disgrace.\n\nThe news of the \"super bomb\" did not make much of a ripple on the East Asian continent; it was news of America's withdrawal from the war that shook their morale. Zhang Fakui sent the report of the atomic attack to Bai Chongxi, who had apparently been so disturbed by his life under house arrest that he scanned the report and brushed it aside, picking up the kettle and going to water the flowers.\n\nThe fact that the United States withdrew from the war in style, leaving behind the not-so-chic Chongqing government, was enough to make the pro-Japanese faction in the Kuomintang extremely mocking of Li Zongren. Like Chiang Kai-shek, Wang Jingwei jumped up and down in his office when he learned that the U.S. had abandoned Chungking, and then arranged a national address on the theme of \"total victory over white aggression\".\n\nLi Zongren's government was in disarray. The plan to improve Sino-American relations and get foreign aid was completely lost. The Party's internal constraints and the house arrest of Bai Chongxi made him unable to command other officials and troops. He began to realize clearly that he was no match for Chiang Kai-shek - this statement was reminded by Chen Bulei. Japan could concentrate its efforts on letting go of China, and after a major victory against the Communists in northern China, refocused its attention on the fight to bring down the Chongqing government. in 1943, Japan had been repulsed by the fortifications of the western defensive line, but now Japan had brought in heavy German bombers to destroy these reinforced concrete fortifications in one fell swoop. At this time, the KMT High Command was close to paralysis and was ignorant of the changes in the battlefield. The western defensive line of Ord was supposed to be in the hands of Chen Cheng, which was handed over to Xue Yue after his hospitalization. Xue Yue, a defeated Japanese general, posed the already cracked Tien Fu method of warfare and watched as his corps was divided and surrounded. The second Battle of Euxie saw the complete collapse of the Central Army and the infinite defensibility of the accompanying capital, Chongqing. Chen Cheng, who was in the hospital, learned of the battle and died of vomiting blood in an emergency.\n\nChen Cheng's death marked the disintegration of the Kuomintang, Song Ziwen and Kong Xiangxi in time to roll away a large amount of public money to exile in the United States, Sun Ke gathered members of the Executive Yuan to besiege Li Zongren ineffective resistance to the war. Everyone went crazy, it became apparently fashionable to put a price tag on selling one's soul to Japan, no one wanted to bury this government, no one wanted to make a big profit at the end, didn't you!\n\nAt night, Chongqing airport, the bright full moon shone on two hurried people who climbed into a plane in a panic and took off from the runway without the tower's permission, resolutely leaving the land plunged into destruction - Li Zongren and Bai Chongxi escaped."
 CPC_CountryInfo_Content.7: "Rising to the Top"
 CPC_CountryInfo_Content_desc.7: "\n\n\n\n\n\n£TER_CPC_Countryinfo_2_1\n\n\n\n\n\n\n\nThe Japanese, who had won a major victory in the Pacific, were in no hurry to advance their own front on the East Asian continent, but watched with interest as the Chinese Kuomintang, with whom they had been entangled for decades, sank down in endless disputes of internal strife.\n\nIn the silent but not yet armistice year of 1946, with the departure of Long Yun, Li Zongren, and Bai Chongxi, the leaderless KMT almost lost the ability to command the real local warlords. In the midst of the chaos, the strategists of the Kuomintang, the Communists, and Japan all looked to Xi'an, a strategic hotspot in the heart of China's map.\n\nSince the death of Chiang Kai-shek, Xi'an under Hu Zongnan had lost its ability to liaise with the Chungking Central Committee and had become a de facto semi-independent military region. The Japanese were the first to realise that they could peacefully seize control of Xi'an and then suppress the Communist forces. The North China Army sent Nanyama Hideyoshi, the negotiator who had succeeded in persuading Yan Xishan to surrender, to offer Hu Zongnan the post of commander of the Northwest Front Army of the North China Autonomous Government of Prevention of Communism, but Hu Zongnan refused to accept it in the face of the high official position; almost at the same time, Chen Lifu, who was the provisional president of the KMT, who had finally emerged from the civil turmoil to temporarily lead the party, immediately sent a letter to Xi'an on behalf of the Central Committee of the KMT. The KMT Central Committee in the name of Xi'an sent eleven telegrams requesting Hu Zongnan to listen to the command of Chongqing; even Mao Zedong in the kiln in Yan'an in the north sent a letter pleading with Hu Zongnan to continue to adhere to the anti-Japanese stance, not to lose their footing in the ancient world, clouds and so on.\n\nHu Zongnan's true thoughts at the core of the storm, although not known to outsiders, but also easy to deduce: Yan Xishan \"jade in front\", he is bound to Xi'an city and the city of millions of people tied to their own interests in the balance, from all sides of the benefits of mooching enough oil before they can rest. Hu Zongnan on the one hand to the defence of Xi'an as a blackmail repeatedly asked Chongqing to cede power and support money and food, on the other hand, he did not deny the united front request of the north of Shaanxi Province, wrote a perfunctory nature of the letter in an attempt to a few good words to the Communist Party to send off.\n\nMao Zedong, who had been treated with such contempt, tore up Hu's careless reply, and this wishy-washy attitude reminded the already wary Mao of Yan Xishan, who had said almost the same thing many years earlier but had eventually turned to Japan and got away with it.\n\nThe Communists, who had already been deceived by Yan Xishan once, were the first to take notice. Peng Dehuai was ordered to deploy troops to Bashui, ready to push into Fuping, while the underground front travelled around Xi'an and beyond to gather and pass on information about the city's defences with almost enough activity to reveal its existence.\n\nIn 1947, the Xi'an underground party withdrew from Xi'an after delivering a large amount of information on Xi'an's defence to the base area. Half a day later, Peng Dehuai, Xi Zhongxun and others led their troops from Bashui to the south, and captured Fuping within five hours. At the same time, He Long led an ambush army suddenly appeared in Tongchuan and marched south, Peng He two armies in a pincer attack from the north and east direction to attack Xi'an.\n\nThe result of the battle was very tragic, including Hu Zongnan who was killed by a stray bullet hitting his brain stem, the Xi'an garrison lost more than 3,000 men in half a day's fighting, and the Communists succeeded in seizing control of Xi'an with the red flag planted on Xi'an's ancient city tower.\n\nChongqing, which only learnt of the change of hands a day later, was thunderstruck, but there was nothing it could do: the Communists' action had clearly proved that the Second Nationalist-Communist Co-operation had broken down, and that in the eyes of the Communists, the Kuomintang was no longer qualified to continue to lead the war of resistance."
 CPC_CountryInfo_Content.8: "The Capitals Converge"
 CPC_CountryInfo_Content_desc.8: "\n\n\n\n\n\n£TER_CPC_Countryinfo_2_2\n\n\n\n\n\n\n\nThe capture of Xi'an was a fact, and the direct price paid by the Communists was not a terrible one - the Central Military Commission (CMC) had drawn up a plan of action as early as the autumn of 1946, which was followed, and the victory came as no surprise, with the Eighth Route Army paying the price of just over 1,200 casualties.\n\nBut the indirect cost was a frown on Mao Zedong's face in Yan'an: a forced attack on Xi'an was tantamount to a firefight between the Communist and Chinese armies, which meant that the Second Sino-Communist Co-operation had collapsed. Despite the significance of the city to the Communist Party, it still needed to unite the anti-Japanese forces - and this time, of course, the Communist Party would not cede the leadership of the anti-Japanese forces.\n\nWith this in mind, Zhou Enlai and Deng Xiaoping took off from Xi'an and travelled to Chongqing in an attempt to mend relations.\n\nMao Zedong did not pin all his hopes on the Chongqing talks, knowing that it was only a matter of time before the KMT, which had been in internal turmoil for several years and had no external support, surrendered to the enemy. Therefore, the Central Military Commission (CMC) issued an urgent order in the early spring of 1947 that all the units of the Eighth Route Army and the New Fourth Army of the National Revolutionary Army (NRA) were to be integrated into four major corps: the Jinsui Anti-Japanese Army (JSAJA) under the leadership of He Long, the Northern China Anti-Japanese Army (NCAJA) under the leadership of Liu Bo Cheng, the Shandong Anti-Japanese Army (SHOJA) under the leadership of Lin Biao, and the Northwest Anti-Japanese Army (NWAJA) under the leadership of Peng Dehuai; as well as four smaller corps: the Longdong Corps, the Central Plains Corps, the Jiangsu-Huaiai Corps, and the Southern Corps.\n\nThe army's reorganisation was so effective that the guerrilla armies scattered all over the country were re-formed, but it also dealt a blow to the fragile nerves of the KMT in Chongqing, where Chen Lifu aggressively slapped the theatre report in front of Zhou Enlai, accusing the Communists of \"taking advantage of the resistance to threaten the Republic of China's survival\" and \"swimming without striking\", just as Yan Xishan had said. \"Zhou Enlai saw that the peace talks were not going to be successful. Seeing that there was no hope for peace talks, Zhou Enlai secretly left Chongqing by land and returned to Xi'an that night.\n\nThe failure of the Chongqing negotiations marked the complete breakdown of the Second Nationalist-Communist Co-operation. This failure was anticipated by the Military Commission, at the same time Zhou Enlai and Deng Xiaoping returned to Xi'an, the Central Military Commission decided to disengage from the National Revolutionary Army (NRA), merging the former Eighth Route Army and the former New Fourth Army into the Chinese People's Liberation Army (PLA), with the chain of command and the regimentation remaining unchanged. Shrinking its defences, it returned to the west of the Yellow River and prepared to continue to persevere in the prolonged war of resistance.\n\nThe Chongqing Nationalist Party, which had aggressively kicked out the Communists, was about to meet its final fate."
 CPC_CountryInfo_Content.9: "Life or Death - 1"
 CPC_CountryInfo_Content_desc.9: "\n\n\n\n\n\n£TER_CPC_Countryinfo_2_3\n\n\n\n\n\n\n\nChen Lifu, who had been honoured with the presidency of the Kuomintang, was faced with a situation of unparalleled decline: the Axis powers were essentially victorious, the Republic of China no longer had any foreign aid, Long Yun had left Chungking, Bai Li had absconded abroad, and he himself had kicked out the Communist Party....... What was once seen as an impossible option now seemed to be an evil that had to be done... -Perhaps it is time to sit down and talk with Nanking.\n\nChen Lifu on his position in the Nanjing side is very confident: speaking of history, he is Zhou Fohai's direct superior, Nanjing government bureaucrats in at least 30% had been his old troops; speaking of the status quo, he is the president of the Kuomintang, is currently the de facto head of the Republic of Chongqing, led by himself to talk with Nanjing, resistance will not be too great. So, after half a month of hesitation, a telegram was sent from his residence: Ming language, destination is the Nanjing Presidential Palace.\n\nWang Jingwei welcomed the telegram, and soon the two parties agreed to hold armistice and peace talks in Hue, Vietnam, under Japanese supervision. The negotiation process went exceptionally well, so much so that Mao Zedong, who had heard of the Ninh-Chongqing merger, finally just reluctantly made the comment, \"Ten years of resistance, ten days of talks.\"\n\nThe Hue peace talks had an extremely far-reaching impact on the post-war situation, with the Ning and Chongqing Kuomintang signing the Hue Agreement in Hue as a symbol, the Second World War formally drew to a close, and the rising sun slowly rose in the Western Pacific Ocean, illuminating China's tattered and burnt-out ruins, and bringing a brand-new post-war order to the whole of East Asia.\n\nBut all this did not stop the Chinese Nationalist Party, and Chongqing bureaucrats, eager to \"return the old capital to the old capital,\" began to leave for Nanjing to participate in the preparations for the upcoming Seventh National Congress of the Nationalist Party of China, including Chen Lifu, who had been promised the post of Minister of Finance. Chongqing Party Headquarters, destined for Chongqing Airport, where he would board a plane for Nanjing to attend the congress - as he should have done.\n\nOne thirty-six minutes in the afternoon, the \"Buick\" car drove through a hillside downhill sharp bend, sitting in the car Chen Lifu's family only felt a large bumps and noises, did not produce suspicion, but then the \"Buick\" car brake failure, sitting in the rear of the car Chen Lifu Chen Lifu and his family were immediately taken by the car rushed straight down the hill, to be found by the search and rescue team burning wreckage of the vehicle, Chen Lifu's family, along with the driver has been all gas dead.\n\nThis is like Chiang Kai-shek general bizarre death but did not cause many ripples in the party, the investigation team hastily concluded that \"Buick\" sedan usually negligent maintenance of the conclusions of the disciplinary Chen Lifu's domestic servants will be dismissed. This can not help but let the party know the stakes will point the finger at Zhou Fohai: Chen Lifu of Zhou Fohai, just like the Northern Song Dynasty Emperor Huizong Qinzong of Zhao Jian, if Zhou Fohai still want to preserve their own party in the Nanjing government, then Chen Lifu will be the optimal solution. However, the death of this little Ming King deeply shocked the rest of the Chongqing bureaucrats, even those who knew the inside story also decided to keep their mouths shut, and this kind of silence made the prestige of the party in Nanjing rise to an unprecedented height: it seems that this \"Republic of China\" will be led by President Wang Jingwei towards a \"Pan-Asian Co-Prosperity Tomorrow\". It seems that this \"Republic of China\" will be led by President Wang Jingwei towards \"a better tomorrow for Pan-Asian Co-Prosperity\"."
 CPC_CountryInfo_Content.10: "Life or Death - 2"
 CPC_CountryInfo_Content_desc.10: "\n\n\n\n\n\n£TER_CPC_Countryinfo_3_1\n\n\n\n\n\n\n\n\"Many of the Communist soldiers who entered the city were children in their teens who would shy away at the sight of strangers; others were undoubtedly peasants, looking around with wide eyes in awe at the prosperity of the provincial capital. There was no imagined looting or rape in the city, and these soldiers would not even take food and water offered by the residents.\" --Documentation of a Japanese spy, 1947\n\nOn a bright sunny day, Peng Dehuai rode into the city of Xi'an on a high-headed horse leading a column of the Eighth Route Army, and the Chinese Communist Party gained its first major city since the revolution. After the formation of the Xi'an Municipal People's Government, the Party Central Committee chose Comrade Xi Zhongxun, who was born in Shaanxi, to be the Chairman of the Military Management Committee of Southern Shaanxi Province and the Mayor of Xi'an, taking office on the same day, after taking into account various factors.\n\nHowever, the Communists had no experience in managing large cities. Xi Zhongxun's face never showed a smile as he shouldered this heavy burden. He took Jia Tuofu, Fang Zhongyu and Zhao Boping with him and rushed to Xi'an, running around in the dark and in the daytime to research and learn from various authorities. As the Japanese invasion of Guanzhong was imminent and the people in the city were in a state of panic, the first task of the Military Management Committee was to restore urban production and support the front line. In response, Xi Zhongxun submitted an extremely conservative proposal to Mao Zedong: First, clean up the ruling Kuomintang institutions cautiously, arrest work as accurate as possible, do not involve too extensive. Second, not to confiscate private business and industry on a large scale, and encourage capitalists to continue to operate. Third, prohibit peasants from entering the cities to arrest or struggle against landlords. IV. Do not be too busy organizing workers for the struggle to improve their livelihood. V. It is strictly forbidden to destroy any public or private means of production and waste the means of living.\n\nTo Mao Zedong, Xi Zhongxun's program was even more reactionary than the resolutions that bound the land reform during the anti-Japanese period. Allowing capitalists to continue to operate? Such words would come out of the mouth of the Communist Party? Especially when Xi Zhongxun also accused some of the Eighth Route Army fighters of encouraging the Ersatz to attack private homes and execute the urban upper class, Mao's head rose and ached at the sight - Xi Zhongxun was appointed in the hope that he would bring the revolution to the big cities and make the people spontaneously embrace the Communist Party. But now Xi Zhongxun denounced all these as \"two-slip movement\", and said that in order to stabilize order and restore production, the party members and the people's army into the city should protect the capitalists, how unreasonable! But reason temporarily quelled the anger, Mao Zedong wanted to get the views of other comrades. He tentatively pushed Xi Zhongxun's report to Zhu De, Ren Bishou and Liu Shaoqi, asking the three of them to express their opinions. Ren Bishi and Zhu De agreed, saying that Xi's report was \"insightful\" and an important lesson for future Communist takeovers of cities. Liu Shaoqi was tactful enough to oppose Xi's report, but he knew very well that Xi would be approved by the others. Faced with the disagreement, Mao Zedong, who was far away in Yan'an, also hesitated, and wanted to seek more advice to get at least a reply in his favor.\n\nBut time waited for no one, and the situation in Xi'an no longer allowed the central government to pull and discuss. There was a mass exodus of citizens, factories were shut down, stores were closed, schools were closed, beggars were begging in the streets, and police stations received hundreds of reports every day. Xi Zhongxun made an immediate decision, falsely claiming that his report had been approved by the central government, and asked the propaganda section to immediately communicate the Communist Party's policy to all sectors of society. The effect of the propaganda was not immediate, but the city began to recover, and people slowly stopped fleeing and went home to await the Communist Party's next arrangement. The city government gained the trust of the citizens by providing relief and fighting crime, enabling the Party to mobilize effectively. The Eighth Route Army was stationed throughout the city to protect factories, schools and residential areas from destruction. City defense was also in full swing, with families digging bomb shelters and concealing hospitals and warehouses. Xi Zhongxun accomplished the task of taking over the city with great success, ending half a month of chaos in Xi'an. He took half a day out of his busy schedule and went to comfort the workers of Xi'an flour mill. When he saw the workers' fervent production, a smile appeared on his face and he forgot to pat the flour piled into a small mountain. "
 CPC_CountryInfo_Content.11: "Into Xi'an"
 CPC_CountryInfo_Content_desc.11: "\n\n\n\n\n\n£TER_CPC_Countryinfo_3_2\n\n\n\n\n\n\n\nSino-Soviet relations have always been one of the main lines of China's foreign relations, and the relationship between the Communist Party of China and the Soviet Union has been the main line within that line. Ironically, in the history of Sino-Soviet relations, whenever the CPC tended to obey the instructions of the Comintern, it was often plunged into life-and-death dangers; and whenever the CPC tended to make decisions on its own, the future of the revolution was bright instead.\n\nAs a representative of dogmatism, which Mao Zedong later severely criticised, Wang Ming was a powerful figure in the party during the Revolutionary War. He was the representative of the CPC to the Comintern, and also served as a member of the Comintern's Executive Committee and Presidium. He not only participated directly in the Comintern's research and decision-making on the question of the Chinese revolution, but also became one of the members of the Comintern leading the world revolutionary movement. Although Bukharin repeatedly emphasised that he respected the autonomy of the CCP, the hardliners in the USSR were very supportive of Wang Ming's leftist ideology, which made the international directives to the CCP very confusing and inconsistent, and the confusing international directives led to the confusing guiding ideology of the CCP - which directly led to the Fifth Counter-Siege and the Fifth Cold War. This directly led to the CPC Central Committee's political inconsistencies during the Fifth Anti-Siege Period, which resulted in the devastation of the Red Army, and the CPC had to withdraw from the Gan and Min bases to start the Long March.\n\nThe Zunyi Conference and a series of meetings in the south-western part of the Long March refuted the disastrous consequences of Wang Ming's chaotic instructions and confirmed Mao's leadership of the Party, while Bogu and Otto Braun (Li De) were said to have been internally responsible for the Fifth Counter-insurgency.\n\nIn 1937, Wang Ming returned to China as secretary of the Yangtze River Bureau and gave a \"How to Continue the National War of Resistance and Strive for Victory? a lengthy report. The report made some correct comments on the issue of insisting on uniting the Kuomintang to fight the war, but at the same time, it also erased the difference in principle between the two lines of resistance of the Kuomintang and the Communist Party, did not talk about the principle of independence and autonomy of the Party in the united front, emphasised that \"everything should be done through the united front\", and emphasised the need for the Kuomintang and the Communist Party to \"take joint responsibility for, and lead together\". \"the central issue today is to fight against Japan\"; proposed to establish a \"truly unified command, discipline, armament, supply and battle plan\"; and \"a unified national defence force for the whole of China\". He proposed to establish a \"truly unified command, unified discipline, unified armament, unified supply and unified battle plan\", a \"unified national defence force for the whole of China\"; he despised the guerrilla war led by the Party. At this time, Wang Ming's position in the Comintern had not yet been terminated, which made him regard himself as the spokesman of the Comintern, and his report naturally influenced many participants and was endorsed by the majority of comrades attending the meeting. Mao, on the other hand, continued to emphasise the principle of independence and autonomy in the united front at the meeting, insisted on the guerrilla war approach, and argued that there was a question of who attracted whom between the KMT and the Communists. Due to the resistance of Mao and others, Wang Ming's misguided views failed to result in a resolution at the conference - and this led to a deep feud between Wang Ming and Mao.\n\nThings changed in 1941: when the Germans captured Moscow, the Central Committee of the Communist Party of the Soviet Union (CPSU) had to retreat east of the AA line; in the same year, Stalin's faction broke with Bukharin's centre, and with much of the important legacy of the CPSU, including Lenin's body, intercepted in Tyumen, and Bukharin outright disappeared, the Supreme Soviet was forced to continue its retreat eastwards. However, the general collapse of the USSR had become irreversible, and not only did the Tyumen government declare independence, but soon after, intellectuals in the Tomsk region also declared the independence of Central Siberia as a democratic republic with a liberal democratic representative system. The Supreme Soviet, which had long since lost its credibility, was left in a state of flux and finally settled in Irkutsk, where, although still nominally intact as the Central Committee of the Communist Party of the Soviet Union (CPSU), the USSR, together with the Comintern, could no longer communicate with the outside world - the big brother of the world revolution had disappeared.\n\nThe total collapse of the USSR brought about an extremely serious mood of defeatism in the CCP. In order to clean up the mood of defeatism, as well as to ideologically purge the chaotic remnants of the Soviet intervention, Mao Zedong made a report entitled \"Transforming Our Learning\" at the meeting of senior cadres in Yan'an, and the Rectification Movement was officially launched.\n\nThe Rectification Movement focused on two targets: the \"Trotskyist Cancellationists\" and the \"Stalinist Revisionist Line\". The former was represented in the base area by Vitaly Primakov, a military adviser who had been commissioned by the International Committee to help China in 1925. As a soldier, he could only be regarded as a sympathiser of the Trotskyist line, although he belonged to Tukhachevsky's faction within the Red Army, which saved the CCP a great deal of effort. After sending him to Shandong to assist Lin Biao in running the enemy base and warning him not to interfere in the CCP's political decisions, Mao turned his full attention to the latter - Wang Ming, a \"left\" opportunist and the face of Stalinist revisionism in the Party. Wang Ming was immediately dismissed from the central government, but he was retained as a member of the Central Committee, in accordance with the policy of \"preventing those who are sick from being sick from being sick\".\n\nAs the 1950s progressed, Primakov was able to remain in the General Staff as the only Soviet adviser left in China, playing a major role in the reorganisation of the PLA, as he was not involved in Communist Party affairs. In contrast, Wang Ming's situation was much bleaker, as he lost his election to the Central Committee at the Seventh National Congress due to the loss of the party's base of support, and only barely managed to retain his position as an alternate member of the Central Committee after Mao Zedong's persuasive mobilisation. Apart from his position as an alternate member of the Central Committee, he was only one of the editors-in-charge of the Jiefang Daily, and his speech was strictly limited. The only guarantees of his position, the Supreme Soviet and the Comintern, were completely lost in the Central Siberian War, and no radio signals from the fragmented Russian regions reached Xi'an since 1956 - thus, the dispute between the local faction and the \"Soviet faction\" in the history of the CCP finally ended with the \"Soviet faction\" in the form of a dispute between the local faction and the \"Soviet faction\". Thus, the dispute between the local faction and the \"Soviet faction\" in the history of the CCP finally ended with the complete victory of the local faction."
 CPC_CountryInfo_Content.12: "Fading Friends"
 CPC_CountryInfo_Content_desc.12: "\n\n\n\n\n\n£TER_CPC_Countryinfo_3_3\n\n\n\n\n\n\n\nIn discussing the origins of the National Defence Front, it is necessary to mention the Communist-led Xi'an Conference of 1952 and its product: the Platform of the Chinese National Defence Front.\n\nAfter the merger of Ningyu and Chongqing in 1947, the anti-Japanese faction of the KMT had no choice but to deny the Nanjing KMT, and Zhu Shaoliang, the then director of the Northwest Regiment, announced the reorganisation of the KMT with Lanzhou as its centre, and the central base of the anti-Japanese faction of the KMT was officially shifted from Chongqing to Lanzhou. Despite the continuation of the central organisation, the military and political power of the NWKP at this time was in fact held by Ningma leader Ma Hongkui, which caused Zhu Shaoliang to feel doubly constrained.\n\nWhile the central committee of the KMT in the northwest was at a loss, the communists in the neighbourhood seemed to be in a position of strength: in 1944, the revolution broke out in the north of Xinjiang, and the pro-republican Tepui government led by Ma Zhongying and the Communist Party of Xinjiang led by Abdukrim Abbasov attacked Sheng Shicai from the north and the south and besieged him in the vicinity of Dihua, thus putting an end to the Sheng family's rule of the KMT in Xinjiang; and in 1949 the chairman of Xikang, Liu Wenhui, announced by telegram the acceptance of the leadership of the Communist Party of the northwest.  In Zhu Shaoliang's view, from west to east, from south to north, he seemed to be completely surrounded by the \"Red Bandits\" that the KMT once scoffed at, do they really have the ability to gather the entire western region to regain the banner of the anti-Japanese?\n\nWith such apprehension, in the early spring of 1952, Zhu Shaoliang tentatively sent a telegram to Yan'an, in which he explained in earnest words his own regrets of being restrained by the Ningma and Qingma warlords and failing to fight against the Japanese, \"I am looking forward to Mao, Zhu, and Zhou to send troops to help me to restore the sovereignty of Lanzhou, and I will definitely bring up a brigade to join the anti-Japanese cause.\n\nMao Zedong was very happy to receive this telegram, the initial reorganisation of the Chinese People's Liberation Army did not show the front soon in Peng Dehuai, He Long and others led by Yinchuan into Wuwei, the two sides in Tianshui, Wuwei, Lanzhou outskirts of the city broke out in a number of fierce battles, all to the defeat of the side of the Ma Hongkui to the end, deeply difficult to stop the pace of the Communist army agreed to lay down their arms and surrender, the remaining troops were integrated by the People's Liberation Army! --It seems that the Northwest Kuomintang and the Communists are in love with each other and will soon join hands to fight for the country.\n\nAfter removing the internal obstacles, in May of the same year, at Mao Zedong's initiative, the Xi'an Conference was held, to which western military and political leaders such as Liu Wenhui, Zhu Shaoliang, and Ulanhu were invited, and the National Defence Front regime formally came to the stage of history with the signing of the \"Programme of the Chinese National Defence Front\". This programme also meant that the \"short-lived\" Third Nationalist-Communist Co-operation had finally begun.\n\nAt this time, the National Defence Front's sphere of influence encompassed almost all of Western China, and its vow to continue the war shook the entire Co-Prosperity Sphere, and soon the National Defence Front was subjected to an even harsher economic blockade and infiltration by the enemy and the hypocrites. Faced with the economic blockade, in 1956, the Central Committee of the Communist Party of China (CPC) adopted the \"Resolution on the Great Leap Forward\", which attempted to reach a rapid socialist climax in the base areas based on the theory of \"regional climax\" of Bolshevism - however, all the energetic people overlooked one thing. However, all the energetic people overlooked a time bomb hidden in Qinghai.\n\nThe leader of Qinghai, Ma Jiyan, passively accepted the leadership of the KMT Central Committee in the Northwest China and acquiesced in the signing of the 1952 Programme, but he was not just an ordinary warlord who was content to remain in the corner of Qinghai. After Ma Hongkui's surrender, Ma Jiyan in fact became the most powerful person in charge of the defence of the western part of the National Defence Front (NDF), and he quickly dispatched the Qingma army to Lanzhou and Longbei to grasp the key points of the region, but he adopted a nonchalant \"obedience and paralysis\" strategy towards the Communists, which was very successful, and by the end of 1955, the military and government of Lanzhou had fallen into the hands of the Ma family army once again. By the end of 1955, the military administration of Lanzhou once again fell into the hands of the Ma's army. Zhu Shao-liang, disillusioned, accepted the invitation of the Central Political Affairs Committee and went to Xi'an to participate in politics as a representative of the Kuomintang, and the actual power of the Kuomintang in the Northwest China fell into the hands of Ma Ji-yin.\n\nThe tide of the Great Leap Forward continued, and the red winds continued to approach Ma Jiyan's Gansu and Qinghai in a fiery manner, which made him feel an unprecedented sense of crisis - in 1958, the Central Committee of the Communist Party of China (CPC) dispatched Peng Zhen as a delegate to Lanzhou to supervise socialist transformation, and Ma Jiyan finally couldn't bear the radical Communist Party policies. Ma Jiyan finally couldn't stand the radical policies of the Communist Party and ordered his men to execute Peng Zhen in his sleep on a dark and windy night. This was undoubtedly an extremely risky decision, and the Central Committee of the Communist Party of China (CPC), which had learnt of Peng Zhen's murder, was extremely angry. At the behest of Mao and Zhou, Wei Lihuang and others took the lead in setting up a new Central Committee of the Kuomintang (KMT) in Xi'an, and through this \"Central Committee\", it resolved to expel Ma Jiyan's membership of the Party.\n\nAt the beginning of 1959, feeling the crisis, Ma Jiyan took away a large amount of provisions from Lanzhou and withdrew to Golmud, ordered the army to guard Xining, Xingchuan and other strategic places, declared autonomy from the National Defence Front, set up the regime of \"People's Salvation Army\", and formally broke with the Communist Party. At the same time, the National Defence Front passed a resolution to set up the Chinese Democratic Revolutionary Alliance, which absorbed most of the former leftist members of the KMT, and since then the KMT was completely banned - the short-lived Third Nationalist-Communist Co-operation had finally died in a cloud of suspicion, and it was clear to all that it was only a matter of time before both sides went to war."
 CPC_CountryInfo_Content.13: "A Gobi Oasis"
 CPC_CountryInfo_Content_desc.13: "\n\n\n\n\n\n£TER_CPC_Countryinfo_3_4\n\n\n\n\n\n\n\nXinjiang plays an extremely special role in the process of the Chinese revolution - the Soviet Union, the CPC, the KMT, and the Ma Clique ...... all the forces trying to ask for the Central Plains or dominate the Northwest are all eyeing this place.\n\nSheng Shicai came from the Northeast Army, originally under Zhang Xueliang, because the September 18th Incident was blocked by the Japanese in the North Manchuria region, could not withdraw to Guanzhou and Zhang Xueliang, under no circumstances, Sheng Shicai to the Soviet Union to ask for help to try to take the Siberian Railway to Xinjiang, to return to Shanxi-Gansu bypassing the road to contact on Zhang Xueliang. The USSR agreed to Sheng Shicai's request out of its interest: if a pro-Soviet person could be chosen to control Xinjiang, it would be beneficial to Russia's interests in Central Asia.\n\nThe Soviet Union and Sheng Shicai thus embarked on an uneasy cooperation. Several Soviet Red Army regiments joined Sheng Shicai in 1933 when the \"4-12\" incident broke out in Xinjiang, the Northeastern Volunteer Army and the White Russia Army united to fight against Jin, and soon swept the whole territory and overthrew Jin Shuren's brutal rule with strong combat power. Sheng Shicai, who had a heavy army in hand, returned to Dihua, and was elected by all parties as the Xinjiang temporary border governor; Liu Wenlong, director of the Department of Education, was elected as the Xinjiang temporary provincial chairman. in December, Sheng Shicai was suspected of plotting a rebellion against Liu Wenlong, his whole family was placed under house arrest, and his resignation was forced, and Zhu Ruicai, a sickly old bureaucrat, was as the chairman of the province. From then on, Sheng Shicai took control of the supreme power in Xinjiang. In March of the following year, Zhu Rui Edward died of illness, Sheng Shicai took over the post of provincial chairman, completely from behind the scenes to the front of the stage, began the dictatorship of Xinjiang.\n\nIn 1934, Ma Zhongying led his troops into the southern frontier, led by the new 36th Division of ferocious fighting force, the troops pointed directly to Dihua. Both sides fought several times, and Sheng Shicai gradually out of strength, a vaguely decadent trend, just when Ma Zhongying was advancing, the Soviet Union suddenly reached an agreement with Sheng Shicai aid, a large number of aid arms sent by land to Dihua, and the Soviet Union's Red Army even personally went to the field to quickly routed Ma Zhongying's offensive.\n\nThe overwhelmed Ma Zhongying finally agreed to negotiate with Sheng Shicai, and under the supervision of the USSR, Ma Zhongying agreed to lead his team to sit in southern Xinjiang as a \"special autonomous region\" of the Xinjiang government, Xinjiang has since been formally unified. In response to Sheng Shicai's secret request, and to draw in Ma Zhongying to prevent Sheng Shicai from threatening his interests, the Soviet Union invited Ma Zhongying to \"go to the Soviet Union for further training and study\" in 1936, and Ma Zhongying readily agreed to give his troops to his brother-in-law, Ma Hushan, and CPC Underground Party adviser Zhang Yashao, among others, to lead. From then, until 1941, Sheng Shicai implemented an enlightened authoritarian system in Xinjiang, supporting the mainland's anti-Japanese efforts while restoring production, and it seemed that Xinjiang had since found the optimal solution for peaceful and stable development.\n\n--However, the situation in the surrounding world changed drastically, and in the early forties, the Soviet Union fell into a state of total collapse and disconnection. For Xinjiang, this could only mean one thing: Sheng Shicai's \"enlightened dictatorship\" no longer had any support, and the Uyghurs, Kazakhs, and Hui could overthrow it anytime. Against this background, in 1942 Sheng Shicai sent a secret telegram to Ma Bufang, offering him resources and power in exchange for his secret support, and the first thing Ma Bufang planned for Sheng Shicai was to purge the Communists.\n\nIn 1943, the situation within the Xinjiang government changed drastically, Chen Tanqiu Mao Zemin and others in key positions were suddenly arrested and secretly executed by Sheng Shicai on September 27th, and his black hand was even extended to the southern border for a time, attempting to arrest Zhang Yashao and other CCP advisors under Ma Zhongying's command, but in the end, due to concerns about the Ma Zhongying's ministry once again rose to launch the Northern Expedition, and was unsuccessful. However, Sheng Shicai's butchery knife was not only aimed at Ma Bufang but also at the Communist Party. However, Sheng Shicai's butchery was not limited to the CPC. Between 1943 and 1944, Sheng Shicai arrested more than 200 pro-Communist left-wing intellectuals of the Uyghur and Kazakh ethnic groups and executed one-third of them.\n\nThe enraged Uyghurs finally exploded, and in 1944, with Abdukrim Abbasov as the representative of the Communist Party and Dalelikhan Sugulbayev as the commander of the Uyghur armed forces, Altay and Tacheng took the lead in announcing that they would break away from Sheng Shicai's government to establish an autonomous state, which would be known as the Democratic Republic of Xinjiang. The Supreme Soviet, which was very dissatisfied with Sheng Shicai's clearing of communism, secretly sent Ma Zhongying back to southern Xinjiang to set up the Hetep government in southern Xinjiang, cutting off Sheng Shicai's contact with Ma Bufang, and the two communist regimes, one in the north and one in the south, quickly pressed forward, and Sheng Shicai's actual control was soon reduced to a minimal area.\n\nHowever, the seeds of nationalism were sown by the Northern Xinjiang riots initiated by the Uyghur left-wing - the Pan-Turkic elements in the Northern Xinjiang riots declared their autonomy from the Northern Frontier government in Kashgar in 1948, and Sheng Shicai took the opportunity to recapture the areas of Ili and Aksu, thus cutting off the land route between the Pan-Turkic elements and the Northern Xinjiang, and Xinjiang was finally plunged into chaos and chaos in 1956. In 1956, Pan-Turkic terrorists infiltrated into Tacheng, where the Second Congress of Communist of Xinjiang was being held, and launched an attack in retaliation for the expulsion and cleansing of Pan-Turkicists by the Uyghur left-wing, in which Abbasov was killed in an exchange of gunfire, and his legacy was inherited by Seypidin Azizi, thus making the future of the revolution in Xinjiang even more confusing."
 CPC_CountryInfo_Content.14: "Here and Elsewhere"
 CPC_CountryInfo_Content_desc.14: "\n\n\n\n\n\n£TER_CPC_Countryinfo_4_1\n\n\n\n\n\n\n\n\"The Leninist thesis that revolutions tend to culminate in certain regions and then gradually spread to the whole country is very much in line with the present situation in the north-western base areas. The difference between the Communist Party and other parties lies in the fact that we are a party of revolution, and that every step the revolution pushes forward brings us one step closer to seizing national victory.\" --Liu Shaoqi, 1949\n\nWhen military action became impossible, it was difficult as a government to use the war as a reason to freeze the society under its rule, even though it demanded that many wartime institutions be retained. People's minds were changing, and the Communist Party had to be the first to grasp the pulse of the times, to come up with a ruling policy, and to set off a social revolution. During the ten years of war, Yan'an did not enact too extreme a programme to change the relations of production. Now that the war was over for the time being, it was time to continue what the Communist Party should do.\n\nOn 15 March 1949, the Chinese Industrial and Commercial Unification Association (CICUA) was in Xi'an, inviting factory owners, businessmen and bankers from Shaanxi and Gansu to register. At the opening meeting, which was held in a hidden clubhouse on the outskirts of Xi'an in order to prevent bombing by the Wangcai, Mayor Xi Zhongxun announced the Party's decision to co-operate with the \"leading industrialists and businessmen\", hoping that the \"enlightened gentlemen\" would work hard to defend China's future under the Front's rule. China's future. The smokescreen of co-operation is released to enlist the wealthy class, so that they can get hold of the inside story of the industrial and commercial sector, so that they can drive the resources in the hands of the exploiters. This \"one step back, two steps forward\" approach followed Mao's instructions and was the practice of the New Democratic Line he proposed in the early 1940s.\n\nAt the same time as the co-operation was reached, the siege of public opinion against the capitalists began at the social level. Revolutionary rallies could not be held under the threat of air raids, and the provincial party funded the installation of loud speakers in every street to broadcast the suppression of the traitorous counter-revolution by area. It was often noticed that those counter-revolutionaries named for suppression were usually capitalists who ran businesses or factories, bad guys who would use all sorts of tactics to thwart Party policies, jeopardise the security of the base areas and destroy the lives of the people. After the offences were read out, gunshots followed.\n\nThe future of the new society was bright, and the shootings of the new society were horrible. Gradually the bad comments were transferred from those real criminals to the general capitalists. These capitalists felt as if their backs were against the wall, fearing that the sky was the limit. When they asked for help from the Communist Party cadres who entered their factories, they were always reassured with the unfaltering tone, \"You haven't broken the law, the Communist Party won't wrong a good person.\"\n\nThe revolutionary movement pushed the trade unions into the enterprises and, in the name of the Party, absorbed the masses of workers and led the economic struggle. With the Communist Party in the background, the workers' demands were usually given the green light all the way to the boardroom due to the capitalists' ideology of making a mountain out of a molehill. The workers' lives improved, the capitalists broke the bank, business production went up, and the Party organisation penetrated into every aspect of the city. In the period after peace, the Communist Party opened up the city to co-operation and win-win situations.\n\nThe Communist Party, as the founding member of the National Defence Front had to get through to other members, and receiving activities took up most of Mao's time in 1949, so it was often necessary to smile in front of a crowd and then shake the hand of a visitor. In this way, Mao Zedong was closer than ever to the standard of a saint - following his heart and not overstepping his bounds - and became a sign that the Communist Party was hitting its stride. It was precisely because of his tolerant and kind face that Ma Hongkui, who was chairman of the Nationalist Party in Ningxia, was willing to visit Shaanxi.\n\nBut Mao lost his temper internally on more than one occasion, feeling that there was little difference between the reception activities and the parade, which was a put and take anyway. He wanted to see more direct revolutionary action, such as land reform.\n\nForty-seven and forty-eight were two consecutive years of disaster, with drought and locusts taking turns to attack Shaanxi's loess land, and a significant portion of the crop went extinct. Grain production in 1947 alone plummeted to less than 40% of its level in the same year, and by the following spring people began to flee the famine in various parts of the country. General relief was no longer helpful, and hunger prompted peasants in some villages to begin attacking landlords and seizing the surplus grain of the rich, a phenomenon keenly captured by Shaanxi chairman Gao Gang, who was to push the situation a little further.\n\nIn mid-1948, Gao Gang proposed to the CCP Central Committee the idea of disaster relief: there was an opportunity in the crisis to use the surplus grain in the hands of the rich to alleviate financial pressures and food shortages, and to implement the land reform policy - a multi-purpose means of achieving the revolution and production at the same time. Mao Zedong, who was present at the working conference, agreed with this view, while Zhou Enlai told other central leaders, \"Land reform has not only a political purpose, but is also the basis for the peasants to live and preserve their lives.\" At a subsequent mobilisation meeting in Xi'an to fight against the enemy and provide relief, Gao Gang conveyed to representatives of rural cadres from all over the country that the root cause of the famine was not a natural disaster, but the lack of land in the hands of the peasants was the main problem. When these cadres returned to their hometowns with the central government's instructions, the whole of Shaanxi was abuzz in an instant, as if they had seen a bright lighthouse in the darkness. All the peasants were full of energy, and they were on their hands and knees comparing with the cadres to see which piece of land they wanted.\n\nThe disaster intensified the peasants' desire for land, and during the autumn harvest of 1948, the agrarian reform movement burst into flames like a mountain fire. Gao Gang personally supervised the work, and in less than three months commanded millions of peasants who had lost their land or had less land as a result of the disaster to divide equally the arable land of the entire Shaanxi province. In order to survive, the peasants tended their new, hard-won fields, unconditionally trusting that the distribution of surplus grain, reclamation and replanting would see them through the famine, and on New Year's Day 1949, the central government's slogan was, \"If production rises by an inch, the revolution will be invincible\". Grain production in this year was also like the slogan of the New Year, quickly recovered to the level of the previous years, the development of things here will tell people two things: 1. man will win; 2. listen to the Communist Party and Chairman Mao.\n\nDuring the spring ploughing season of 1950, when Mao Zedong visited the farmers on the outskirts of Xi'an, he was warmly welcomed by the farmers, who all said, \"Chairman Mao has given us land, and is really our saviour.\" Mao was happier than ever to hear the heartfelt praise, and he favoured the idea of a well-deserved leader over the image he had created for his foreign affairs performances, to the exclusion of the peasants' old notion of a \"good emperor\". This was also the first time that Mao associated revolutionary action with his status: as long as the revolutionary fervour continued to grow, he was invincible."
 CPC_CountryInfo_Content.15: "Transformation"
 CPC_CountryInfo_Content_desc.15: "\n\n\n\n\n\n£TER_CPC_Countryinfo_4_2\n\n\n\n\n\n\n\n\"Constrained by the enemy's blockade policy, the pace of economic construction in the base areas over the past seven years has been slow. Comrades should be clear that the current development is only a small step in the Long March, and that a higher wave of revolution awaits us.\" --Gao Gang, 1953\n\nGao Gang met Mao Zedong in a life-threatening accident. In the 1930s, internal conflicts within the Communist Party in Northwest China spawned into a political murder, and Gao Gang was put in a sack by his own comrades and tortured and nearly died in a black prison buried underground. Upon the arrival of the Party Central Committee in northern Shaanxi, Mao Zedong immediately put a stop to the plot and freed the man who had not yet been executed. That day, in the light of day that shone into the dungeon, Gao Gang knelt at the feet of Mao's emissary and sobbed with emotion.\n\nGao Gang and Liu Shaoqi's paths to the top were similar. Mao Zedong treated them as up-and-comers to be cultivated and sent to various places to train and spread their wings. They also supported Mao's internal party motions at different times, enabling him to survive two political crises in 1937 and 1940. But instead of fostering a collegial relationship between these two men, they grew further apart because of some prejudices.\n\nThe land reform was a radical political mobilisation that brought all peasants under the rule of the Communist Party and allowed the establishment of a Communist government in every rural area. But Bo Yibo pointed out in his 1950 report on rural land in southern Shaanxi that the mere distribution of land broke the feudal land ownership system, but the essence was still private ownership of land. As a result, the countryside began to be rapidly capitalised, with the concentration of land in the hands of a few faster than ever before, and the widespread emergence of indentured agricultural labourers - the hired labourer receiving a dry wage and the employer taking all the output and trying to liquidate it in the city - was a major factor in the development of the countryside.\n\nCommunist methods of land management also clashed with rural capitalism. The Communist Party could not force peasants to change the purpose of their production, which was their freedom as peasants, and the land reforms expanded this freedom. Because of the criteria for land distribution, farmers did not dare to expand their production beyond the boundaries of the land they had been given, but instead hoped that the winds of agrarian reform would blow over sooner rather than later.\n\nAgriculture ended its growth early in 1950, followed by two flat years, with no surge or sharp decline. While land reform solved old problems, new ones emerged, and Liu Shaoqi and Gao Gang had different views on the new ones.\n\nLiu Shaoqi saw rural capitalism as a bait to stimulate agriculture in the base areas. Letting rural self-employment (or rich peasants) develop naturally for a few years now would provide both a material basis for future public ownership transformation and political leverage for the Communist Party.\n\nGao Gang turned to a completely opposite angle. During his local investigations, he discovered a special phenomenon: in some villages, production would be divided into two distinct types: one was what Liu Shaoqi referred to as the rich peasants, who expanded their production with themselves in the centre, and the other was the poorly-run peasants who, in an attempt to resist the rich peasants, spontaneously merged and farmed together to ensure their survival. Gao Gang believed that the latter had \"broken the boundaries of private ownership\" and was \"pure socialism\", and that the former should be banned and the latter supported.\n\nFaced with Gao Gang's view, Liu Shaoqi pointed out: \"Mutual assistance among peasants is only a short-term means of coping with the crisis, which is a reflection of the backwardness of the agricultural economy, and a far cry from the public ownership system of socialism. Once the crisis is over, peasant mutual aid will automatically disintegrate and return to the individual. Rich peasants and mutual aid coexist, and there is no such thing as cancelling the former and retaining the latter.\"\n\nThe quarrel over agriculture had not yet ended when a new conflict broke out between Gao Gang and Liu Shaoqi.\n\nIn 1952, when Li Lisan was inspecting the trade union of the Xi'an Hengbao Transportation Company, he made this speech to the workers, \"At present, the Party still adopts the strategy of struggle and solidarity towards private enterprises, so many things within the enterprises can't be done in a comprehensive manner, which needs to be supplemented by the trade union set up by the comrades of the workers who rely closely on them.\"\n\nHaving just returned from Mongolia with urban management talent, he was not well informed about the political climate in Shaanxi. Before delivering his speech, Li Lisan had approached Liu Shaoqi to weigh his words. Liu Shaoqi told him, \"Now that we are waging united war against the capitalists, there is a danger that we will ignore the demands of the workers. When Xi Zhongxun took over Xi'an at that time, he restricted the labour movement, and Chairman Mao didn't say anything, but he was not happy about it. So there's nothing wrong if you want to mobilise the labour movement in the cities, the workers are supposed to have an organisation of their own opinions.\"\n\nBut Li Lisan's sudden entry made Xi Zhongxun feel a little uncomfortable; the Xi'an government had been laying the groundwork everywhere for two long years, and what it needed now was to work in tandem to promote production and make fewer problems. Originally, public enterprises into the market and private enterprises to compete for profits on the bourgeoisie resistance, every step forward is very difficult, and now Li Lisan borrowed the trade unions as the subject of the initiative to stir up labour conflicts to disrupt the deployment of the deployment, can not be tolerated. So he sent the situation in Xi'an to Gao Gang, and also noted the story of Li Lisan looking for Liu Shaoqi's \"collusion\". When Gao Gang got the material, he immediately arranged for his men to write out their views on trade unions and packaged them for Chairman Mao. Desperate to win the previous argument, Gao Gang here directly elevated Li Lisan's views on trade unions to the level of \"anti-Party\".\n\nKnowing that Xi Zhongxun had informed him of his speech, Li Lisan, fearing that someone might add to his speech and misinterpret it, wrote a lengthy report on the trade unions, explaining his positive views on \"independent trade unions\", but it was not expected that he would be further convicted of the offence. In Mao's view, it was one thing not to allow the workers' movement and another not to allow the Party to lead it. The situation in the countryside had changed, and the cities could not afford to make any more mistakes. \"Obedience\" was more important than \"revolution\", and he resented Li Lisan's suggestion that the Party could not replace the trade unions in fulfilling their obligations. Mao Zedong himself wrote an article refuting Li's \"Theory of Trade Union Independence\", saying that Li Lisan had neglected the leadership of the Communist Party and had alienated the relationship between the Party and the workers. Mao supported Gao Gang's judgement on Li Lisan due to his outstanding performance in the land reform work, and Liu Shaoqi also made a review as a result."
 CPC_CountryInfo_Content.16: "Rushing Ahead"
 CPC_CountryInfo_Content_desc.16: "\n\n\n\n\n£TER_CPC_Countryinfo_4_3\n\n\n\n\n\n\nSome people prefer to be verbal revolutionaries rather than true revolutionaries. They speak eloquently, but when the revolution actually arrives, they jump around obstructing it like annoying flies.”\n—Gao Gang, 1952\nIn 1952, to lay the groundwork for future agricultural policies, Mao Zedong instructed Liu Shaoqi to convene a Central meeting, calling together as many key figures as possible. Though the meeting’s stated purpose was agriculture, it began with a severe handling of Li Lisan’s line errors.\nEarlier that year, Li Lisan had visited the Xi’an Transportation Company, where he delivered a speech to the workers:\n\"At present, the Party maintains a dual approach to private enterprises—both struggle and unity. This means that many internal issues within these enterprises cannot be fully addressed by the Party alone, making it necessary to rely on the trade unions established by the workers as a supplement.\"\nHaving just returned from Mongolia, Li Lisan was unaware of the political climate in Shaanxi. Before his speech, he had consulted Liu Shaoqi about the wording. Liu had advised him:\n\"Right now, we are forming a united front with capitalists, which may lead to neglecting workers' demands. When Xi Zhongxun took over Xi’an, he restricted labor movements—Chairman Mao didn’t openly oppose it, but he was displeased. So if you want to mobilize the workers in urban areas, there’s no problem—after all, workers should have their own organizations to express their opinions.\"\nHowever, Li Lisan’s sudden intervention made Xi Zhongxun uneasy. The Xi’an municipal government had spent two years carefully laying the groundwork for economic integration, and now, their priority was industrial production—not political disruption. Public enterprises were already struggling against private competition, making every step forward difficult. But now, by deliberately stirring labor-capital tensions under the banner of trade unions, Li Lisan was upending Xi’s plans. Unable to tolerate this, Xi reported the situation to Gao Gang, also noting that Li Lisan had consulted Liu Shaoqi beforehand—suggesting possible collusion.\nA day later, when Li Lisan learned that Xi had reported his speech, he feared misinterpretation and wrote a lengthy report on labor unions, emphasizing the importance of \"independent trade unions.\" However, rather than clearing his name, it only solidified his guilt.\nTo Mao Zedong, not allowing labor movements was one thing, but not allowing the Party to lead labor movements was something else entirely. The countryside was already undergoing change; the cities could not afford to go astray. Additionally, Mao found Li Lisan’s assertion that the Party could not replace unions in fulfilling their duties deeply objectionable. Mao personally penned a rebuttal, accusing Li of undermining Party leadership and sowing discord between the Party and the working class.\nWith Mao’s instructions, the meeting turned into a public denunciation of Li Lisan. Gao Gang, in his signature authoritative style, dominated the room, using the opportunity to launch an attack on Liu Shaoqi. He bluntly accused Liu of implementing a right-leaning rural policy, favoring rich peasants and stifling the enthusiasm of poor and middle peasants for collective farming.\nHaving already endured criticism, Li Lisan sat grim-faced, but he refused to stay silent. He retorted:\n\"Rural agriculture still depends entirely on manpower and animal labor—there’s no Soviet machinery to support us. How can you talk about agricultural collectivization without considering objective conditions?\"\nLiu Shaoqi also found Gao Gang’s accusations laughable. Did I personally teach the farmers to stop producing? he thought. He knew the meeting wouldn’t lead to any real conclusions—it was just a stage for Gao Gang to assert dominance—so he had no intention of engaging with him. Shaanxi was firmly in the hands of the Northwest faction, while he was an outsider with little influence here. If Li Lisan wanted to step into the line of fire first, let him.\nBut Gao Gang wasn’t interested in Li Lisan—he outright dismissed him and demanded that Liu Shaoqi respond directly.\nRepresenting Liu, Bo Yibo countered:\n\"Since when is feeding and clothing the farmers considered a 'rich peasant line'? Are you saying there’s a fixed poverty threshold, and crossing it makes one a capitalist?\"\nSeeing Bo Yibo engage, Gao Gang became even more aggressive:\n\"After land reform, landlords are gone—this is a once-in-a-lifetime opportunity to collectivize agriculture! It’s only because of your delay that the base areas’ agricultural progress has stalled. Didn’t you yourself say we should push Shaanxi into a revolutionary upsurge? We have 800,000 Party members in the Northwest—300,000 of them are now rich peasants. Can we still call this the Communist Party?\"\nEmboldened, Gao Gang suddenly lashed out at Bo Yibo, calling him an opium dealer unfit to give orders. At this, Zhou Enlai slammed the table:\n\"Gao Gang, you’d better take that back! That’s slander!\"\nBy now, the meeting had completely deviated from its original agenda. Gao Gang found himself besieged by Zhou Enlai, Bo Yibo, Peng Zhen, and others, while Li Lisan sat stiffly to the side. When Bo Gu and Zhang Wentian tried to mediate, Gao Gang turned on them as well, branding them capitulators. Meanwhile, Xi Zhongxun, unable to get a word in, could only watch as Gao Gang stormed ahead.\nRealizing the chaos, Zhu De sent his wife, Kang Keqing, to report to Mao Zedong:\n\"The meeting is completely out of control.\"\nUpon hearing this, Mao dispatched two representatives—Lin Biao and Deng Xiaoping. Entering the pressure-cooker of a conference hall, they relayed Mao’s opinion:\n\"The immediate task in the base areas is to consolidate revolutionary order, not regress to the chaos of the Kuomintang era. The Party will not tolerate rightist deviations.\"\nSpeaking on Mao’s behalf, Deng Xiaoping gave a lengthy speech:\n\"The debate between Comrade Shaoqi and Comrade Gao Gang is an internal matter, and neither side is entirely right or wrong. We should not hastily elevate this to a question of political lines. The progress in the base areas is the result of collective efforts, and we must not discredit each other’s contributions. However, some of Comrade Gao Gang’s points are worth reflecting upon.\"\nWith Mao effectively backing Gao Gang, the meeting ended in discord. It was now clear that Gao Gang would wield considerable influence in future policymaking. However, after the meeting, Mao privately summoned Xi Zhongxun for a one-on-one discussion.\nLater that evening, Xi brought a millet cake to visit Gao Gang, using the opportunity to discuss the day’s events over drinks. After a few bites of cake and several glasses of liquor, Xi spoke candidly:\n\"There's an old saying—‘When the moon is full, it begins to wane.’ You’re standing at the peak right now, but be careful not to fall and break your back. Chairman Mao told me that many comrades in the Party have serious concerns about you—you need to take this seriously.\"\nGao Gang appreciated Xi’s advice, but his resolve was unwavering:\n\"After the defeat of the War of Resistance, everyone in the Party lived in fear. The base areas were on the brink of collapse—there was no certainty of tomorrow. I’m not the kind of person who drifts along aimlessly, waiting forever to see the revolution succeed. I can’t afford to wait. As for what others think of me—that’s not my concern.\"\nXi hesitated before quietly revealing:\n\"I… I’ve been removed. I’m no longer Mayor of Xi’an.\"\n\"There are always gains and losses. Ultimately, we cannot betray the Chairman’s trust.\"\nWith those words, the two men silently raised their cups, downed their liquor in one motion, and watched as the wild geese disappeared into the evening sky."
 CPC_CountryInfo_Content.17: "Squabbles for Glory"
 CPC_CountryInfo_Content_desc.17: "\n\n\n\n\n\n£TER_CPC_Countryinfo_4_2\n\n\n\n\n\n\n\n\n\"Due to the enemy's blockade policies, the pace of economic development in the base areas has indeed been slow over the past seven years. Comrades must understand that our current progress is but a small step in a long march—greater revolutionary waves still await us.\"\n—Gao Gang, 1953\n\nGao Gang and Mao Zedong met at a life-and-death juncture. In the 1930s, a political assassination erupted within the Shaanxi Communist Party, leading to Gao Gang being thrown into a sack and imprisoned in a pitch-dark dungeon, where he suffered brutal torment. When the Party Central Committee arrived in northern Shaanxi after the Long March, Mao Zedong immediately put an end to the indiscriminate arrests and killings, rescuing all wrongfully imprisoned comrades. That day, as daylight seeped into the dim prison, Gao Gang knelt at the feet of Mao’s envoy, tears streaming down his face.\n\nGao Gang's path to the upper echelons mirrored that of Liu Shaoqi—they were both outstanding Party cadres who rose through sheer ability. Mao Zedong placed great emphasis on nurturing these rising stars, assigning them various tasks to refine their skills. At different times, both played pivotal roles in supporting Mao’s party initiatives, helping him navigate through difficulties. They both rose to prominence during the Rectification Movement—Gao Gang became the leader of the Northwest faction, while Liu Shaoqi took charge of Party ideology. However, despite their similar trajectories, they failed to develop a working friendship. Instead, cognitive biases led them down diverging paths.\n\nAfter the Land Reform Movement, Shaanxi established a solid foundation—all farmers were brought under Communist rule, and every village had at least one Party branch. As Bo Yibo noted in his land reform report, feudal land ownership had been dismantled, and rural areas were advancing rapidly toward agricultural capitalism—meaning land was privately owned, hired labor became common, and production was oriented toward accumulation. However, the Party’s land management policies clashed with agricultural capitalism. The Party sought to intervene in farmers’ production, suppress grain prices, and accelerate accumulation, which led to passive resistance from some farmers. Due to land distribution standards, those who had received land were reluctant to expand production, adopting a cautious approach to investment. Agricultural growth stagnated after the Northwest Defense War of 1950, followed by two consecutive years of unremarkable yields. The question of how to achieve increased production became a critical economic issue that had to be resolved before the upcoming Party Congress.\n\nA prolonged debate between Liu Shaoqi and Gao Gang ensued over agricultural policy. Their arguments grew so heated that they began accusing each other of disloyalty. In one particularly intense closed-door meeting, they nearly escalated their disputes to the level of ideological correctness. At that meeting, Bo Yibo delivered a speech advocating \"following the Chairman’s directives and continuing to rely on the middle peasants for development.\" However, Gao Gang immediately rebuked Bo, claiming that he was objectively fostering exploitative practices, deviating severely from Mao's instructions, and veering toward rightist tendencies.\n\nMao Zedong had already taken notice of how grassroots Party members in rural areas, engrossed in production, were neglecting revolutionary work. With his far-reaching vision, the Chairman repeatedly expressed concerns that during the \"semi-capitalist\" phase, the Party's stance might gradually soften. He frequently referenced the mutual aid movements of the Yan’an era at model worker conferences, as if depicting a budding socialism. Gao Gang astutely picked up on these signals, using them as justification to oppose Bo Yibo.\n\nLiu Shaoqi was not oblivious to these nuances, but he had his own considerations—he worried that a sudden shift in policy would create excessive uncertainty and believed that acknowledging the status quo would help consolidate support among the more conservative Northwest cadres. Moreover, Mao had not firmly mandated a shift in policy—his scattered remarks certainly reflected his sentiments, but without formal discussion, they had no procedural basis for implementation. However, should Mao decide to push the matter into formal discussion, Liu would be the first to raise his hand in support.\n\nAs an arbiter, Mao Zedong did not excessively favor either side. Though the protracted debate was increasingly tiresome, he still attempted to mediate between Gao and Liu. During the Central Economic Conference, while criticizing Zhou Enlai’s \"lax work attitude,\" Mao denounced mid-level cadres who harbored pessimism toward rural socialism, setting the tone for future policies in alignment with Gao Gang's perspective. Later, he promoted a batch of comrades from outside Shaanxi into the central government, predominantly those from the Ji-Lu-Yu region, aiming to merge offices and enhance unity.\n\nFrom late 1952 to 1953, the Party's Third Plenary Session passed resolutions initiating socialist agricultural transformation, making it the centerpiece of the Five-Year Development Outline. However, the plan sparked considerable controversy in the Nationalist-controlled territories (Qinghai, Ningxia, and Gansu). Ma Hongkui insisted that reforms should be handled autonomously by the provincial government, using the opportunity for personal gain. In Lanzhou, Kuomintang chairman Zhu Shaoliang claimed that the policy faced fierce resistance, while in Qinghai, Ma Jiyuan not only distorted the reforms but also issued open challenges. The Party Central Committee entrusted Feng Yuxiang with overseeing negotiations and supervision in Lanzhou on behalf of the CPPCC, but the results were underwhelming.\n\nBy early 1954, in the second year of agricultural transformation, collectivization had led to increased grain production in traditional farming areas but had shown little effect in newly cultivated and pastoral regions. These areas, mostly located along provincial borders and minority territories, were believed within the Party to be facing ethnic conflicts and Kuomintang sabotage. Mao Zedong remarked: \"At this stage, class struggle within the national revolution is irreconcilable. The Party must fully support workers, peasants, and progressive intellectuals, organizing them to launch an offensive against the Kuomintang.\" A wave of democratic activism erupted in Yinchuan, Ningxia, where provincial legislators publicly denounced Ma Hongkui for profiteering and oppressing the people.\n\nIn 1955, Japan invaded Mongolia, prompting Shaanxi to form an alliance with Mongolia, while Fu Zuoyi launched an anti-Communist purge in Suiyuan, severely impacting the Northwest Trading Company. Yan Xishan intensified his political infiltration into Shaanxi, encouraging villages affected by collectivization policies to flee. To alleviate mounting pressures, Peng Dehuai suggested that the PLA be deployed to support economic development and adjust defensive zones to block enemy infiltration along the border. However, conflict with Ma’s forces reignited over joint command issues—Ma Jiyuan relocated his headquarters to Lanzhou, acting as the de facto military and political leader of the Northwest. He unilaterally granted Ma Chengxiang’s forces the title of \"41st Group Army,\" signaling a growing alignment between the two Ma factions.\n\nBy the summer of 1956, in the third year of the Five-Year Plan, Zhou Enlai and Gao Gang once again clashed over whether the transformation strategy should prioritize \"consolidation\" or \"leap forward.\" Gao argued that the Five-Year Outline had set its targets too low—given that objectives had been met within two and a half years, they should be raised, and the Party should take a firmer stance against Kuomintang non-cooperation. Zhou Enlai acknowledged that plans could not keep pace with changes and that revolutionary forces had been underestimated, but he cautioned that Gao was overstating existing achievements. This time, Liu Shaoqi remained neutral in the debate: \"Without class struggle, we cannot break the constraints of the old production relations, let alone discuss socialism.\" Mao Zedong concluded: \"We cannot hope to earn the bureaucratic bourgeoisie’s sympathy by standing still. Just as we once pressured Chiang Kai-shek to resist Japan, we must now pressure the Kuomintang hardliners to submit to the revolution.\""
 TER_tips_in_opening_screen_tt: "§xTNO: TER Ver.1.1.0§!\n§LLuna Ex Montibus Oritur§!\n----------\nCopyright: The New Order: The East is Red (including its English and Moomin mod, hereinafter collectively referred to as the \"Module\") may contain copyrighted material.\n\nAny material used in this module that may be copyrighted is for the purpose of exposing the dangers of extremist ideologies such as Fascism and Nazism. The module does not currently, nor will it in the future, attempt to profit from copyrighted material. Therefore, the module believes that the use of these materials meets the criteria of \"proper citation\" as stipulated in Chapter 2, Article 24 of the Copyright Law of the People's Republic of China, \"fair use\" as stipulated in 17 U.S.C. § 107, and the corresponding legal standards in other jurisdictions. and the corresponding legal standards in other jurisdictions.\n\nIf you wish to use copyrighted material for purposes other than \"proper citation\" (or the equivalent legal standard in your jurisdiction), you should obtain permission from the copyright owner."
 CPC_CountryInfo_Content.18: "A Burning Anger"
 CPC_CountryInfo_Content_desc.18: "\n\n\n\n\n\n£TER_CPC_Countryinfo_4_4\n\n\n\n\n\n\n\n\"At the formation of the Front, the Central Committee carried out extensive neighborly unity propaganda, believing that as long as we adopted a sincere posture, our former enemies would open their hearts and cooperate with us—this principle is still upheld as a fundamental policy by some frontline comrades. But as Chairman Mao has said, counter-revolutionaries will not fall unless they are struck down. Reality demands that we abandon illusions and show no mercy to the enemies within the Front!\"\n—Liu Shaoqi, 1956\n\nThe National Defense Front was an anti-Japanese united front led by the Communist Party under the principles of New Democracy. However, from 1950 to 1955, the right-wing faction of the Kuomintang displayed staunch resistance to the revolution. As agricultural collectivization deepened in Shaanxi, discontent among landlords outside the province reached its peak, providing the Kuomintang in Ningxia with a pretext to defy central orders. In response, Shaanxi dispatched a Central Work Group into Longnan and Ningxia, bypassing provincial governments to oversee land reform, winning enthusiastic support from local farmers.\n\nInfuriated, Ma Hongkui simultaneously accused the Communist Party of sabotaging cooperation while sealing off borders and ordering agents to assassinate Party cadres—actions that sparked outrage within the Party. At a military conference, Peng Dehuai volunteered to defend the base areas, though He Long voiced concerns about weakening eastern defenses: \"A hasty offensive against Ningxia will alert the surrounding enemies.\" Gao Gang added his own concerns: \"Mobilizing demobilized soldiers after committing the army to economic support will undermine reconstruction efforts.\" However, new intelligence from the Ningxia Provincial Committee (Ma Mingfang) turned the situation around: \"If we introduce an appropriate reform plan, we can secure internal support within the province to overthrow Ma Hongkui together.\"\n\nIn the end, Peng Dehuai revised his strategy and secured Mao Zedong's approval: the People's Liberation Army (PLA) would adopt a \"bluff and internal disintegration\" approach, coordinating with the Ningxia Provincial Committee to incite an uprising and completely eradicate Ma Hongkui’s reactionary regime.\n\nThe operation began with Wei Lihuang persuading the Gansu authorities, creating a pincer movement between the PLA and Nationalist forces in eastern Gansu. This forced the local warlord, Ma Hongbin, to accept military restructuring, thereby isolating Ma Hongkui. Meanwhile, inside Ningxia, the Communist Party organized a peasant self-defense force to repel Ma Hongkui’s crackdowns. Reports of Ma's rural atrocities spread to Yinchuan, sparking protests from students and victims demanding his resignation—protests that were promptly suppressed.\n\nIn reality, after Chongqing’s surrender, Ma Hongkui struggled financially without central funding, anxiously appealing to Xi’an for subsidies. The Communist Party attempted to use monetary incentives to secure his cooperation, but his selfishness led him to miss every opportunity for compromise, ultimately driving him down a path of utter reaction.\n\nAs soon as the PLA entered Ningxia, the counter-encirclement campaign achieved a decisive victory. Peng Dehuai struck a major blow against Ma’s forces in Guyuan, shaking Ma Hongkui’s inner circle. \"If we keep fighting, we’ll be finished,\" his subordinates warned. Facing imminent defeat, Ma Hongbin, in his capacity as Gansu’s provincial chairman, called Ma Hongkui, urging him to submit to Communist orders. Unexpectedly, Ma Hongkui broke down sobbing over the phone: \"I cannot abandon the land our ancestors left us!\" His response enraged Ma Hongbin, who scolded him for failing to recognize the shifting tides.\n\nAs the government fractured, Ma Hongkui was abandoned. In the ensuing political compromise, Ningxia formed a coalition government comprising the Communist Party, democratic parties, social elites, and religious figures. Yet, as everyone celebrated the downfall of a tyrant, none foresaw that the revolutionary fervor of New Democracy would soon be shattered.\n\nJust before Ningxia's liberation, Liu Shaoqi delivered a confidential report to Mao Zedong, candidly admitting that a political and economic crisis had been escalating in the base areas since 1955:\n\nTo sustain a prolonged struggle, Shaanxi had squandered enormous manpower, resources, and invaluable time, urgently needing recovery.\nThe bourgeois democratic factions were not genuinely welcoming the revolution—they were conspiring to form an opposition party, and as the economy deteriorated, they would only grow stronger.\nThe Party was failing to grasp the changing political landscape, with some comrades succumbing to bourgeois temptations and straying from Marxist principles.\nThe Communist Party had led the National Defense Front under New Democracy, but now a decisive purge was necessary to consolidate power.\nHe strongly supported Mao’s renewed emphasis on class struggle and the implementation of the dictatorship of the proletariat.\nMao Zedong agreed with Liu’s report but chose not to publicize it immediately. Ningxia’s political structure was still unstable, and the Central Committee could not afford to alarm potential adversaries. Given the complex realities, Mao temporarily approved the relatively moderate reform proposal put forward by the Ningxia Provincial Committee, led by Ma Mingfang, focusing primarily on land redistribution. However, the landlord class and religious elites exploited the policy’s compromises to maintain their hold on land ownership. By leveraging personal connections, they secured agreements with government leaders to solidify their privileged status.\n\nThis reformist approach also introduced internal challenges for the Communist Party itself—some members became ideologically complacent, rejected Marxist principles, and even engaged in corruption and bribery, suppressing legitimate demands from the masses.\n\nFarmers, deprived of the land they had been promised, placed their hopes in the PLA to forcibly enforce redistribution. Most soldiers, driven by simple sentiments, carried out land reform policies with military force. This led to stark contrasts—Ningxia’s northern regions, outside direct military control, lagged in reform compared to the southern regions, where the PLA was present. However, this militarized reform process was derided by democratic figures as \"New Warlordism.\"\n\nAs the Ningxia issue resurfaced on the Party’s agenda, it confirmed Mao’s fears of intensifying class struggle and Party degeneration, leaving him restless. A single misstep in the revolution could lead to cascading failures—Ningxia’s Provincial Committee had to be corrected without delay.\n\nAs Mao flipped through Peng Dehuai’s reports, he noted that the PLA’s counterintelligence operations had extended into land reform, integrating into grassroots mass movements. He inquired whether the Central Committee planned to maintain the status quo or take alternative measures.\n\nAt the work conference, Gao Gang and Liu Shaoqi jointly proposed granting Peng Dehuai full authority over Ningxia, replacing Ma Mingfang with Xi Zhongxun. Moreover, the provincial committee was ordered to implement immediate rectifications before Xi’s arrival—no delays would be tolerated.\n\nWhen Xi Zhongxun arrived at Peng Dehuai’s office carrying the Central Committee’s directives, he casually glanced at the table and saw it covered with telegrams from Chairman Mao. Every message pointed to a singular conclusion: \"The Ningxia situation is extremely urgent.\"\n\nUnder Peng Dehuai’s leadership, Ningxia implemented a series of comprehensive and stringent reform policies. At the same time, internal rectification efforts warned all cadres to remain highly vigilant against any form of capitalist deviation.\n\nPolitically, Mao Zedong placed great expectations on Ningxia. Past experiences were becoming obsolete, and he was on the verge of entering a second golden age of theoretical development, comparable to the Yan’an Rectification Movement. He sought to extend Ningxia’s reform model to every corner of the Northwest. He aspired to unify communist ideals with the grand cause of the War of Resistance. He wanted to personally draft a magnificent blueprint for the proletariat."
 CPC_CountryInfo_Content.19: "The Great Leap Forward"
 CPC_CountryInfo_Content_desc.19: "\n\n\n\n\n\n£TER_CPC_Countryinfo_4_5\n\n\n\n\n\n\n\n\"Work hard for a year and completely transform the backward landscape.\"\n—Gao Gang, 1957\n\n\"Guiding hundreds of millions of farmers in the base areas onto the socialist path is a top-priority and honorable task.\"\n—Liu Shaoqi, 1957\n\n\"The green grass sways in the wind, the Tao River glistens in golden light. Braving the elements brings us joy, the louder the songs, the fatter the sheep.\"\n—Slogan from the Dasanchuan construction site, 1958\n\nFor the past three years, Gao Gang had actively embraced Mao Zedong’s vision of accelerating the revolution, working tirelessly to prove himself. Finally, his ambitions were rewarded—he was elevated to the position of the fourth-ranking member of the Central Committee, second only to Mao, Zhou, and Liu, while the newly promoted Deng Xiaoping ranked behind him.\n\nIn October 1957, the 11th Plenary Session of the 7th Central Committee was held in Xi’an, marking the first official gathering of the three provinces of Shaanxi, Gansu, and Ningxia. At the meeting, Gao Gang was the first to deliver good news: \"Under the warm care of the Central Committee and Chairman Mao, Ningxia’s socialist transformation has achieved remarkable success, setting a leading example.\" Immediately afterward, Zhou Enlai announced the new Five-Year Development Outline, officially launching the Great Leap Forward Movement and the division of labor plan centered around Gao Gang:\n\nGao Gang’s Great Leap Forward strategy—Prioritizing heavy industry, implementing \"leap-style\" industrialization to enhance manufacturing capacity in the Northwest. Expanding state-owned enterprises to dominate the market, gradually reducing the space for private enterprise, and accelerating the nationalization of commerce and industry. Concentrating production resources in developed regions, prioritizing urban development.\n\nLiu Shaoqi’s Great Leap Forward strategy—Strengthening grassroots Party committees, rectifying Party discipline, purging \"passive elements\" and corruption among local cadres, and reinforcing the authority of local Party organizations to ensure flawless policy implementation in newly liberated areas. Additionally, bolstering the Party’s united front efforts, ensuring that every province, city, and county establishes a united front work organization.\n\nIn Shaanxi and Gansu, land reform was nearly complete, and cooperative farms had already been piloted. The focus was now on deepening collectivization by establishing advanced cooperatives. Rural communities were mobilized to manage village communes, centralize land and production resources, set unified production targets, and enhance agricultural output through large-scale collective labor and improved farming techniques. Wealthy peasants and landlords who opposed collectivization were targeted as class enemies, their complete eradication deemed essential for achieving a bountiful harvest.\n\nThe second phase centered on industrialization and infrastructure. Gao Gang spearheaded the economic planning for the new Five-Year Plan, concentrating efforts on building the industrial base of the Northwest, particularly in energy, metallurgy, and transportation. In northern Shaanxi, coal mining was expanded, while major water conservancy projects were launched. Railways and highways linking Shaanxi, Gansu, and Ningxia were to be constructed, alongside the establishment of heavy industry bases for machinery and chemical production across the provinces.\n\nAmong the numerous ambitious projects, one stood out as the top priority—the Tao River Reconstruction Project. The Guanzhong-Longdong region had suffered from persistent drought, and local populations had long demanded a solution. However, repeated discussions under the Lanzhou National Government had failed to yield results. After Ma Hongbin joined the National Defense Front in the 1950s, the Gansu Water Resources Bureau revisited the project but ultimately shelved it, citing \"Gansu’s economic underdevelopment, frequent natural disasters, and complex ethnic relations as reasons to proceed with caution.\"\n\nTo break the deadlock, the Central Committee appointed Zhou Lin to take over local governance. Soon after, the Tao River, Wei River, and the yet-to-be-realized Huangshui River projects were all launched, collectively known as the Northwest Dasanchuan Project. These projects were lifelines for millions living along the riverbanks, the foundation for economic development, and a flagship political achievement for the Communist Party. Mao Zedong privately issued an ironclad directive to Gao Gang: \"Even if the factories aren’t built, you must dig the canal for me!\"\n\nWith materials secured for the Tao River project, a single order from the Central Committee set the construction site ablaze with activity as workers fervently took up their tools.\n\nIn 1958, the first year of the Great Leap Forward, Mao Zedong and the Party leadership were brimming with hope for a bright future. Under Communist leadership, the movement was met with overwhelming enthusiasm from the masses. In the base areas, particularly in agriculture and infrastructure, rapid progress appeared to be made, new factories sprouted like mushrooms after the rain, and the entire region seemed on the cusp of a dramatic transformation.\n\nYet, beneath this atmosphere of boundless optimism, problems quietly emerged. Driven by eagerness for quick results and excessive optimism, many projects lacked scientific rigor and feasibility. However, short-term gains temporarily masked these underlying issues. People remained steadfast in their belief: The Communist Party could bring socialism to this barren land.\n\nBy 1959, signs of economic discord began to surface. Many projects either failed to meet expectations, progressed sluggishly, or resulted in massive resource waste. Collectivization did not yield the expected surge in production; reckless land reclamation and over-farming led to a decline in per-unit crop yields, triggering raw material shortages along the expanding production chains. Simultaneously, an excessive amount of essential goods was funneled into uncertain large-scale projects at the expense of civilian needs, leading to shortages in many areas and dealing a severe blow to fragile local economies.\n\nThen, in 1960, the crisis erupted in full force. Take the Tao River Project under Zhou Lin’s leadership—due to drastic reductions in food rations, a wave of labor desertions swept through the workforce, with the escape rate soaring from 6% in 1959 to 14% in 1960. Worsening living conditions led to humans and livestock sharing quarters, providing a breeding ground for infectious diseases. Epidemics spread across construction sites, yet there were no sufficient medical supplies to treat the sick.\n\nVoices questioning the Great Leap Forward began to emerge—but their fate was all too predictable. Gao Gang had prepared countermeasures. During the 1960 \"Anti-Rightist\" Movement, investigations into the Tao River Project alone uncovered nine anti-Party groups among county committees, with over 200 Party members exposed as serious rightists—the numbers among the general population were even higher.\n\nAmid the catastrophe, Gao Gang made a self-serving move, leveraging his authority to divert resources meant for disaster relief and economic recovery toward his own construction projects. He justified this as \"mobilizing vast forces to support the front line,\" but how many still believed him?\n\nDiscontent toward Gao Gang within the Party erupted like a volcano. Meanwhile, Liu Shaoqi projected an image of supporting the Great Leap Forward while maintaining a sense of moderation—unlike Gao Gang’s ruthless approach. Liu successfully reorganized local Party structures, building relationships with a network of Northwest-born cadres. His grassroots-friendly image won him widespread support, and it was only a matter of time before he launched his counteroffensive."
 CPC_CountryInfo_Folder.105: "Embers"
 CPC_CountryInfo_Content.20: "Embers"
 CPC_CountryInfo_Content_desc.20: "\n\n\n\n\n\n£TER_CPC_Countryinfo_4_5\n\n\n\n\n\n\n\n\"Within the intricate factions of the CCP, Lin Biao has emerged as a rising force. Mao Zedong no longer allows Peng Dehuai to continue as the highest military leader, replacing him with Lin. Does this suggest that since the Party adjusted its policies, Mao has been trapped in a crisis of trust, desperately trying to maintain the army’s loyalty to the point where he cannot even tolerate a general with a rebellious temperament?\"\n—Japanese North China Tokkō Report, 1961\n\nThe Fall of Gao Gang\nHad Gao Gang remained calm and reflected on his actions after the disaster, Mao Zedong’s authority within the Party might have been enough to protect him. However, as one of the Party’s leaders, he completely lost his composure when faced with challenges. When local complaints arose, he tried to silence them; when the Central Committee voiced concerns, he resorted to private threats. His reckless and immature behavior deeply disappointed Mao Zedong. The unexpected rebellion of Ma Jiyuan ultimately sealed Gao Gang’s fate—Mao had no choice but to \"weep as he executed his own general.\"\n\nAt a time when the Communist Party was trapped in a quagmire, Ma Jiyuan raised his banner in revolt, leading his forces to capture Lanzhou. Liu Shaoqi’s close ally, Peng Zhen, was tragically killed, while Gansu’s Second Secretary, Rao Shushi, fled in disgrace back to Xi’an. What raised suspicions was that Peng Zhen’s death was nowhere to be found in Rao Shushi’s official report—it was Wei Lihuang, who had held his ground, who reported the situation to the Central Committee.\n\nA Party investigation uncovered private communications between Rao Shushi and Gao Gang, along with other evidence. The conclusion was damning: Rao Shushi, driven by personal grievances over policy disagreements with Peng Zhen, deliberately failed to warn him of the approaching rebel forces, leading to his convoy falling into enemy hands. The key issue, however, was Gao Gang's inaction—he stood by and did nothing as the relationship between the two men deteriorated, failing to mediate the dispute.\n\nGao Gang’s reputation was now irreparably destroyed—there was no need for further deliberation. Mao Zedong summoned him in person, his anger barely contained as he roared:\n\n\"Get out! The farther you go, the better! I never want to see you again!\"\n\nThe purge did not stop with Gao Gang. His downfall dragged down Xi Zhongxun and the entire Northwest cadre faction, all of whom were stripped of their positions and thrown into prison under rigorous investigation. They bore the full blame for every failure since the Great Leap Forward, though some would later be reinstated a year later through Deng Xiaoping’s intervention.\n\nThe Crisis of the Party Leadership\nThe situation within the Central Committee had already pushed Mao Zedong to his limit, but fate was relentless in dealing him blow after blow. Without Xi Zhongxun’s assistance, Peng Dehuai found himself increasingly frustrated. He simply could not understand how Mao had allowed things to deteriorate so badly (though this was a question many dared not ask).\n\nPeng gathered a collection of materials detailing the failures of the Great Leap Forward, hoping to present them at the upcoming military conference in an attempt to convince Mao to adjust his hardline stance.\n\nDuring the meeting, tension filled the air as Peng Dehuai spoke.\n\n\"If this continues, comrades won’t be able to carry out their work.\"\n\nMao, silent up until this point, finally raised his head slightly.\n\n\"Which comrade can’t work? Let him stand up so I can take a look.\"\n\nThe room fell into dead silence. Every official present, including Mao himself, lowered their heads, shifting awkwardly to avoid eye contact.\n\nFinally, Zhou Enlai spoke up, breaking the unbearable tension:\n\n\"We’re not saying that Peng shouldn’t lead the troops, only that we hope he speaks less in the future. Gao Gang’s mistakes have just been dealt with, and for the sake of Party unity, we cannot afford any further missteps.\"\n\nPeng Dehuai’s face darkened. He knew exactly who was orchestrating this spectacle. Though the room remained silent, the weight of the moment pressed heavily upon every person present.\n\nYet he refused to back down. His voice was firm, resolute.\n\n\"I represent the soldiers. I must speak.\"\n\nThe suffocating stillness returned. This time, it was as if the entire room was waiting for Mao’s response.\n\nBut Mao Zedong never even looked up. From the very beginning, his demeanor had been detached, as though he were lost in another world. When it became clear that the meeting could not proceed, he abruptly stood up, wordlessly pushed open the door, and walked out.\n\nThe End of an Era\nThe moment Mao left, the tension shattered. All eyes turned to Peng Dehuai, filled with blame and resentment.\n\nPeng felt a mixture of rage and humiliation. He had spoken not for himself, but for the soldiers, for the Party, for the revolution—yet here he stood, utterly alone.\n\nAfter a long silence, he exhaled sharply and muttered:\n\n\"I’ve made things difficult for everyone. But I have one last request—at least let the children go to battle in new uniforms. The supplies are already prepared.\"\n\nThat night, thousands of PLA soldiers were redeployed.\n\nThe vanguard, clad in brand-new green military uniforms, moved in perfect unison beneath the cold moonlight. The red stars on their caps gleamed like embers against the darkness.\n\nThey marched forward, stepping over the smoldering remnants of past failures, ready to face the battles ahead.\n\nBut this time, Peng Dehuai was no longer their leader."
 CPC_CountryInfo_Content.21: "Gameplay Features"
 CPC_CountryInfo_Content_desc.21: "The New Order: §xThe East Is Red§! Ver.1.1.0 §LLuna Ex Montibus Oritur§!\nGameplay Features\n-Play as the §mNational Defence§! §VFront§! government and stage a recovery from the Northwest. Amidst the §Scrises§! of the §mCold War§!, develop into a mighty force that can shatter £GNG_japanese_frustration_texticon §jJapanese imperialism§!.\n-A total of §Y12§! custom mechanics across 10 years of in-game content.\n-A large number of hand-crafted §Ygraphical elements§! and §Yflavorful events§!.\n\n----Changes in the §LLuna Ex Montibus Oritur§! version\n-The plot of the §SFirst and Second Stage§! has been reworked (7 years)\n-Newly-added £CPC_texticon §RNorthwest Bureau of the Central Committee§! and £TER_texticon_NDF §RCentral Military Commission§! mechanics (and an internally-developed §xnuclear research mechanic§!).\n-Rework of the £CPGAC_texture_loc §GCentral People's Government Affairs Committee§! mechanic.\n\n----AI Changes\n-Interactions with new mechanics made more §Yreliable§!.\n-§RAI opponents§! have received appropriate §Geconomic growth curves§!.\n-Fixed issues with AI National Focuses.\n\n----Miscellaneous Changes\n-Updated for TNO version §LOperation Deep Freeze§!.\n-Completed and updated all events, and extended the §mYang Yingcai§! storyline.\n-GFX updates."