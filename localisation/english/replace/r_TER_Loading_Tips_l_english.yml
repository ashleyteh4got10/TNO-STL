l_english:
 LOADING_TIP_4: "§BIf the Kuomintang can exist for one day, China will also exist for one day. If there is no Kuomintang in China today, there will be no new China. \n- Tao Xisheng, 1948§!"
 LOADING_TIP_12: "§BIt is not difficult for a person to do something good, but it is difficult to always do good and never bad in one's life.\n- Mao Zedong, 1940§!"
 LOADING_TIP_19: "§BDon't do the slightest evil; don't avoid the most insignificant good.\n- Liu Bei, 223§!"
 LOADING_TIP_25: "§BIt is not easy to restore China from her silent years, just as it is not easy to order a dead man by saying, \"Come alive!\"\n- Lu Xun, 1927§!"
 LOADING_TIP_26: "§BA man is not finished when he is defeated; he is truly finished when he gives up.\n- Richard Nixon, 1962§!"
 LOADING_TIP_27: "§BThere are no gods to be worshipped other than Germany itself.\nIt is fervent faith, hope, and love for Germany that counts.\n- Adolf Hitler, 1935§!"
 LOADING_TIP_28: "§BTherefore, if we want our people to have a deep love for the country, we must first make them have a deep knowledge of the country's past history. If we want our people to truly improve our country, we must first have a true understanding of our country's past history.\n- Qian Mu, 1931§!"
 LOADING_TIP_30: "§BThere is only one way for Japan to conquer China, that is, to hang back and completely stop invading China and in turn conquer the heart of the Chinese nation.\n- Hu Shi, 1930§!"
 LOADING_TIP_35: "§BWhen ember smoke sighs over sad poverty, I spread out the despairing ashes stubbornly, and write with fair snowflakes: \"believe in the future!\"\n- Shi Zhi, 1968§!"
 LOADING_TIP_37: "§BThe country has suffered so much, and society been in great turmoil; all I witnessed these 20 years made me suffer.\nInstead of living uselessly and harming state affairs, I would rather confess that I have no more utility and end my worthless life.\n- Chen Bulei, 1947§!"
 LOADING_TIP_43: "§BMe, betray my country?! Our lands were not lost because of me!\nInstead, I am losing my personal history and reputation, bound by infernal determination, to reclaim China's lands from the Japanese.\n- Wang Jingwei, 1940§!"
 LOADING_TIP_47: "§BIs true virtue far from me? I desire it and it arrives.\n- Confucius§!"
 LOADING_TIP_50: "§BIn today's life, the government business is on the ninth heaven, while the peasants and workers are in the ninth hell.\n- The peasants, suffering from drought still need to pay for food, and the workers working all day long so that the wealth can be gathered in the hands of some elites.\n- Liang Shuming, 1953§!"
 LOADING_TIP_53: "§BWe have this confidence: the power of the people will prevail, and justice cannot be wiped out, for the truth endures eternal!\n- Wen Yiduo, 1962§!"
 LOADING_TIP_56: "§BI ask you, all workers and peasants in China: apart from the small amount of money you are given every month to live hand-to-mouth, have you ever made any decision? What have you been the master of?\nI speak poorly, but you are mastered by others, even when you marry.\n- Chu Anping, 1965§!"
 LOADING_TIP_58: "§BThe arrogant do not long endure: They are like a dream one night in spring.\n The bold and brave perish in the end: They are as dust before the wind.\n- Heike Monogatari§!"
 LOADING_TIP_62: "§BIn China, the Chinese must firmly implement the policy of carrying out a mass peasant movement to seize the land. To adopt any other strategy is now a crime.\n- Nikolai Bukharin, 1927§!"
 LOADING_TIP_75: "§BWe too shall make a vow: may all humanity enjoy an upright happiness.\n- Lu Xun, 1926§!"
 LOADING_TIP_79: "§BEveryone says that Shanghai people are bad, but bad in a measured way.\nShanghai people are obsequious, chase trends, would dirty themselves to catch fish; however, because they know the art of handling others, they do not act flamboyantly.\n- Eileen Chang, 1943§!"
 LOADING_TIP_82: "§BDon't Dump the Trash!\n- Lev Trotsky, 1927§!"
 LOADING_TIP_86: "§BGenerally speaking, the amount of knowledge is an objective criterion. Still, it is difficult to say how objective it is when self-made words are also included in the category of knowledge.\n- Wang Xiaobo, 2019§!"
 LOADING_TIP_90: "§BWI pace through a long, long, and solitary rainy alley. I hope to come upon a girl like lilacs, distressed and grudging.\n- Dai Wangshu, 1927§!"
 LOADING_TIP_97: "§B\"We must learn the Japanese language because we have to deal with Japan.\"\nIn the future, when the Japanese soldiers come to Beiping...we can then say \"Konichiwa\" instead of \"Nin Laila!\"...how convenient!\n- Liu Bannong, 1931§!"
 LOADING_TIP_130: "§BThe idea of home is not very relevant to me, but when people talk about it, my heart quickens!\nEven before that land became Japan's, \"home\" was no longer there for me.\n- Xiao Hong, 1937§!"
 LOADING_TIP_138: "§BTAs modern Chinese, at least we have one special privilege: to watch with open eyes the antics of comic-show national politics, each worse than the last!\n- Zou Taofen, 1933§!"
 LOADING_TIP_171: "§BFor people who are not satisfied with the status quo, taking a step back to think only closes the way forward.\nFor if a step back only teaches you how to retreat, and reversing is your specialty, further thought becomes impossible: how can one change track?\n- Zhang Kebiao, 1933§!"
 LOADING_TIP_203: "§BRecently Hitler of Germany ordered the people to vote for him as president, and that is precisely what happened.\nIf he wants to be or do something, he can decide it by himself, with no need to ask others.\n- Ouyang Shan, 1934§!"
 LOADING_TIP_222: "§BTo fight for your freedom is to fight for the freedom of our country. To fight for your own dignity is to fight for the dignity of our country as well.\n- Hu Shih, 1949§!"
 LOADING_TIP_227: "§BOur position is most dangerous at this time. If we do not take care to promote Nationalism and unite 400 million people into one stable nation, China will be in danger of losing its country and its race.\n- Sun Yat-sen, 1924§!"
 LOADING_TIP_232: "§BHope can be neither affirmed nor denied. Hope is like a path in the countryside: originally there was no path – but as more people walk, a way appears.\n- Lu Xun, 1921§!"
 LOADING_TIP_263: "§BThe theater does not dare to ask for tickets from these people: the soldiers, the Japanese, the mechanical bureaucrats. They may buy tickets all on their own, but we dare not check.\n- Hou Baolin, 1959§!"
 LOADING_TIP_284: "§BYou go and accomplish the simple task [of warfare]; I'll undertake the heavy duty [of collaboration].\n- Wang Jingwei, 1938§!"
 LOADING_TIP_285: "§BNothing is more precious than independence and liberty.\n- Ho Chi Minh, 1966§!"