 autonomy_japan_residence_of_governor_general: "Government-General"
 autonomy_japan_residence_of_governor_general_tt: "§LThe Governor-General's Office (Sōtokufu) should be regarded as a domestic administrative unit of the Greater Japanese Empire, equivalent to the prefectures of the Home Islands, rather than as a nominally sovereign state within the Co-Prosperity Sphere. This colonial administrative system was established during the Taishō era. Although modern Japan prefers to achieve its colonial expansion goals through economic control and proxy wars, the Governor-General system has nevertheless persisted in certain strategic regions.§!"
 autonomy_china_special_administrative_region_tt: "§LA Yuan-Controlled Municipality is a province-level administrative division within the Republic of China, based on the Republic Year 38 (1949) \"Organic Law on Municipalities,\" which stipulates: Any particular economic or population threshold having been reached by a given city, it should be organized into a Directly-Governed Municipality; it is at the command and under the supervision of the Executive Yuan, and is subordinate entirely to central and higher-level government regulations.\n\nYuan-Controlled Municipalities were thus set up, distinguishing wealthy, populous, and developed cities from the peripheral areas that surrounded them. Nanjing thus strengthened its control and oversight, managing their bureaucracies with special attention paid to their defense and budget. The Yuan-Controlled Municipalities also represent central authority, and their respective provinces (particularly those they were carved out from) have an obligation to turn their local economies to the task of these cities' development. This low-level institutional reform was one of Wang Jingwei's first attempts, in his later years, to reverse the trend of local independence.§!"