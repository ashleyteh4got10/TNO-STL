 CAM_Norodom_Sihanouk: "Norodom Sihanouk"
 POLITICS_NORODOM_SIHANOUK_DESC: "Sihanouk was on pins and needles every time he sat on the throne of his predecessor, as a prince who ascended to the throne at the point of a Japanese bayonet and fears his country's loss.\n\nFortunately, the sheer poverty of Cambodia made the Japanese Empire avert its gaze from her dream-hungry eyes: no Japanese bombs were dropped here during the Great War. The ancestral homeland has remained peaceful and quiet, hidden in the dense forest...if we put aside the Thai invasion of the northern provinces.\n\nDuring his twenty years of rule, Sihanouk did his best to forge a network of ties within the Co-Prosperity Sphere and secure a good deal of foreign trade for his country in the face of his implacable overlord, Japan. Foreign exchange flowed into the national treasury on its slowly meandering course, and these gifts, like spring rain, slowly fed the countryside of Cambodia.\n\nBut a servant is a servant. After all, Sihanouk cannot disobey his master's orders, even if they are unreasonable..."
