 TNO_CountryClosing_credits_0: "§WDev team§!\nTeam Leader:雾岛小枝\n\nStory Supervisor:233、雾岛小枝\n\nCode Superivsor:Crys7aL_L1nE\n\nGameplay Supervisor:233、Crys7aL_L1nE、雾岛小枝\n\nCommunity Manager:Crys7aL_L1nE、雾岛小枝\n\nArt Group-Icon:Chuny_、Dafid25、芙兰朵露多诺娃、FullyAutomaticCirnoBot、普通的苏联人、人畜无害的魔女、克里斯伯伯、雾岛小枝、人生如夢、穿林北腿常凯申\n\nArt Group-CRT GUI＆research tree:Crys7aL_L1nE、FullyAutomaticCirnoBot\n\nMusic Team:bipedalisticpig（Game theme composition）、Crys7aL_L1nE（Super event music）、雾岛小枝（Super event music）\n\nWriters Group:233、Crys7aL_L1nE、Chef Kang、普通的苏联人、尴尬中的自语、Mortis、KangNi、SpringBridgeM1917A2、笠少仔、尝尝酒酒、Oktinner逆旅、镰刀锤子布、SCARFACE、雾岛小枝、ZhouFengMing\n\nCo-developer:Ashley、超人、Die_Zero、INGSOC、Makerd、马桶、晋人、Mr.Cellophane、旧事、Socialist闲汉、苏油田、十一月三十一、Beer Mengzi\n\nEnglish localization team:火星方阵（Leader）、RexNatura、sendhelp、ZhouFengMing\n\nSpecial thanks:TNO DEVTEAM, TNO Chinese localization team, TNO:BNW ASIA TEAM, TNO:LAR, 馀生、TNO:LAR、苍山如海、子夜余生、赤潮：雨打芭蕉\n\nSpecial thanks:Aliusars、渤海湾冲浪里、灿然辉光、麻吉、Matsuo_Basho、Sakuya（虚空）、TaikangRW（太康）、馍羽、TQR、Volkov_su55、信选组组长、Layefe（拉菲）、SiberiaThea\n\nFromer member:"
 TNO_CountryClosing_credits_1: "§WEx-members§!\n§LF1end, Lev Trotsky in 2049§!\n\nDon't dump the garbage! -Lev Trotsky, 1927"
 TNO_CountryClosing_epilogue_CPC_end_people_dem: "Ten years ago, none could predict that the §xCommunist Party§!, bottled up to the west of Tong Pass, would unexpectedly take a leading role in the completion of the majestic sixty-year National Revolution - yet they have persevered, securing the Revolution's ultimate victory. \n\nEven though the curtain has fallen over too many tales, the Revolution is §Gtriumphant§! after it all. §SPeople's Democracy§! - a form distinct from the Soviet §Rsocialist model§! - §Gsprouts and takes root§! across ground unspeakably devastated; surging with the power of thunder in spring, the old Republic's hollow sixty-year-old slogan of §C\"equal and democracy\"§! has been instilled and made foremost in the thoughts of the newest generation of Chinese citizens. \n\nIt is [GetYear]; the dark waves of §xSino-§!§jJapanese§! §Yconflict§! that surged from the western Pacific have crashed upon the shore, but within the halls of the Congress, the §Rnew generation of leftist politicians§! feel only jubilation as they map out the blueprint for the future of the nascent Republic. §SPeople's Democracy§! has only begun; as the great and inevitable tides of socialism swell, the Republic transforms and builds while China draws near to §Gthe grand vision of profound dreamers§!...a §xProletarian Democracy§!.\n--------------------\nWe thank you for playing! You have now reached the end of the content for §xThe New Order: The East is Red§!§Y Ver. 1.1: Luna Ex Montibus Oritur§!, and accomplished the §SPeople's Democracy ending§!. All the work that goes into this mod is thanks to our team, but without you playing it, it would be worthless. You can join our Discord community through the link in The East is Red's Steam Workshop page. "
 TNO_CountryClosing_epilogue_CPC_end_party_mao: "Ten years ago, none could predict that the §xCommunist Party§!, bottled up to the west of Tong Pass, would unexpectedly take a leading role in the completion of the majestic sixty-year National Revolution - yet they have persevered, securing the Revolution's ultimate victory. \n\nEven though the curtain has fallen over too many tales, the Revolution is §Gtriumphant§! after it all. \n §GChairman Mao's§! disciples walk unhurriedly along the ancient walls of [CPC.Capital.GetName], the pinnacle of all authority in China. As they survey the unspeakably devastated ground, what ambitions are foremost in their minds remain unknown. What is known is that, one way or another, it is §Gthey§! who will work to complete §GChairman Mao's§! unrealized dream. \n\nIt is [GetYear]; the dark waves of §xSino-§!§jJapanese§!§Y conflict§! that surged from the western Pacific have crashed upon the shore, and this time, the §xCommunist Party of China§! has lead the Chinese people to be wholly confident in their own §Gcertain triumph§!.\n--------------------\nWe thank you for playing! You have now reached the end of the content for §xThe New Order: The East is Red§!§Y Ver. 1.0: Sic Semper Tyrannis§!, and accomplished the §GParty Authority - Maoist ending§!. All the work that goes into this mod is thanks to our team, but without you playing it, it would be worthless. You can join our Discord community through the link in The East is Red's Steam Workshop page. "
 TNO_CountryClosing_epilogue_CPC_end_party_liu: "Ten years ago, none could predict that the §xCommunist Party§!, bottled up to the west of Tong Pass, would unexpectedly take a leading role in the completion of the majestic sixty-year National Revolution - yet they have persevered, securing the Revolution's ultimate victory. \n\nEven though the curtain has fallen over too many tales, the Revolution is §Gtriumphant§! after it all. \n§mChairman Liu's§! disciples walk unhurriedly along the ancient walls of [CPC.Capital.GetName], the pinnacle of all authority in China. As they survey the unspeakably devastated ground, what ambitions are foremost in their minds remain unknown. What is known is that, one way or another, it is §mthey§! who will work to complete §mChairman Liu's§! unrealized dream. \n\nIt is [GetYear]; the dark waves of §xSino-§!§jJapanese§!§Y conflict§! that surged from the western Pacific have crashed upon the shore, and this time, the §xCommunist Party of China§! has lead the Chinese people to be wholly confident in their own §mcertain triumph§!.\n--------------------\nWe thank you for playing! You have now reached the end of the content for §xThe New Order: The East is Red§!§Y Ver. 1.1: Luna Ex Montibus Oritur§!, and accomplished the §mParty Authority - Liu Faction ending§!. All the work that goes into this mod is thanks to our team, but without you playing it, it would be worthless. You can join our Discord community through the link in The East is Red's Steam Workshop page. "
 TNO_CountryClosing_epilogue_CPC_end_lin_coup: "The revolution may triumph, yet its progress go far from smoothly; indeed, none can truly say why the politically uninvolved §LLin Biao§! ascended the high throne of authority over China. Perhaps it was because he was repeatedly forced to step in and take charge to reconcile §Rdisruptive factionalists§!, stirring disgust within him; perhaps it was his role in seeing §Rdivided popular sentiment§! that spurred his despair. It would seem that §LLin Biao§! has long endured silently, but now at last strides forth. This time, he will personally take center stage - §xChina§! will inevitably follow his guidance and direction to achieve §Lhis ideal future§!.\n\nIt is [GetYear]; the dark waves of §xSino-§!§jJapanese§!§Y conflict§! that surged from the western Pacific have crashed upon the shore. §LChairman Lin Biao§! guides the £TER_texticon_PLA §RPeople's Liberation Army§! well to withstand any invasion and prepare against enemies, vowing to §Lsafeguard victory§!.\n--------------------\nWe thank you for playing! You have now reached the end of the content for §xThe New Order: The East is Red§!§Y Ver. 1.1: Luna Ex Montibus Oritur§!, and caused §LLin Biao's Resentment§!. All the work that goes into this mod is thanks to our team, but without you playing it, it would be worthless. You can join our Discord community through the link in The East is Red's Steam Workshop page. "
 TNO_CountryClosing_epilogue_CPC_end_all_gone: "Snow lies upon the battered and bruised northwestern earth. It covers up the reality of land where not even grass grows, and death is heavy in the air. The whirlwind has rushed on, swirled amidst jade pines, danced amid the boundless wilderness. Everywhere, the shreds of humanity are choked by dust. \n\nThe story of §xFree China's last defenders§! has now reached its end. Elsewhere in the globe, §mAmerica§!, due to §eJapan§! baring its fangs, begins to urgently summon an emergency meeting of the OFN Security Council. §oGermany§! has declared the accelerated deployment of ICBMs in the Indian Ocean. §VThe Great Northwest's ruins§! echo as this deranged world §xmoves towards its end§!.\n\nIt is [GetYear]; sixty years after it began, §xChina's dream of liberation§! is consigned to §othe ashes of history§!.\n--------------------\nWe thank you for playing! You have now reached the end of the content for §xThe New Order: The East is Red§!§Y Ver. 1.1: Luna Ex Montibus Oritur§!, and caused §VThe Annihilation of the Great Northwest§!. All the work that goes into this mod is thanks to our team, but without you playing it, it would be worthless. You can join our Discord community through the link in The East is Red's Steam Workshop page. "
 TNO_CountryClosing_epilogue_CPC_end_collapse: "The revolution has not triumphed. After the oppressive boots of the §jImperial Japanese Army§! stamped down upon Xi'an and Chongqing, the §xdream of independent liberty§! kept in the hearts of the Chinese people for sixty years has vanished entirely. Perhaps, §xChina§! must reluctantly accept its role as a §ehistorical construct§!.\n\nThe story of §xFree China's last defenders§! has now reached its end. Elsewhere in the globe, §mAmerica§!, due to §eJapan§! baring its fangs, begins to urgently summon an emergency meeting of the OFN Security Council. §oGermany§! has declared the accelerated deployment of ICBMs in the Indian Ocean. §VChina's shattered pieces§! echo as this deranged world §xmoves towards its end§!.\n\nIt is [GetYear]; sixty years after it began, §xChina's dream of liberation§! is consigned to §othe ashes of history§!. \n--------------------\nWe thank you for playing! You have now reached the end of the content for §xThe New Order: The East is Red§!§Y Ver. 1.1: Luna Ex Montibus Oritur§!, and permitted §VChina's Eternal Subjugation to the Japanese Boot§!. All the work that goes into this mod is thanks to our team, but without you playing it, it would be worthless. You can join our Discord community through the link in The East is Red's Steam Workshop page. "
 TNO_CountryClosing_epilogue_CPC_end_RGOC: "The revolution has not triumphed, as the §mNational Revolutionary Army§! strangles §Cequality, democracy, freedom§! and the §xdream of liberation§! to the west of Tong Pass. The future of the Chinese people shall become one §mlong and arduous road§!.\n\nThe story of §xFree China's last defenders§! has now reached its end, but the §SRepublic of China's§! story may still continue. As they muster their energy for the Taipei Summit, the whole world holds their breath: singing songs of victory, how will the §mRepublic of China§! face the forty-year scourge that is the §jEmpire of Japan§!?\n\nIt is [GetYear]; sixty years after it began, §xChina's dream of liberation§! must now go down §ma different road§!.\n--------------------\nWe thank you for playing! You have now reached the end of the content for §xThe New Order: The East is Red§!§Y Ver. 1.1: Luna Ex Montibus Oritur§!, and caused §xChina's Dream of Liberation§! to turn in §mAnother Direction§!. All the work that goes into this mod is thanks to our team, but without you playing it, it would be worthless. You can join our Discord community through the link in The East is Red's Steam Workshop page. "