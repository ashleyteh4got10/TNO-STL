 MON_Gelekdorjiin_Demid: "Gelekdorjiin Demid"
 MON_Gelekdorjiin_Demid_desc: "In his youth, Demid traveled far and wide, working under countless employers and witnessing firsthand the backwardness and decay of Mongolian society.\n\nWhen the revolution broke out, he volunteered for the People’s Army, fighting against the \"Mad Baron\" and Chinese interventionist forces. His bravery in battle earned him party membership, and soon after, the People’s Revolutionary Party sent him to the Soviet Union for further training. Upon his return, he became the right-hand man of General Secretary Genden, overseeing military development.\n\nIn 1936, under Demid’s command, the Mongolian forces played a crucial role in repelling the Japanese invasion, earning him the title of the Republic’s First Marshal.In 1939, the Soviet Communist Party summoned Genden and Amar, Mongolia’s top party and government leaders, to Irkutsk, placing them under three months of isolation and interrogation under the pretext of \"investigating errors in leadership.\"Three months—more than enough time for a coup to be planned and executed.\n\nBut Demid, keeping a watchful eye on the pro-Russian factions at home, crushed the conspiracy before it could take root.When Genden returned, pale and broken, he confided in Demid, detailing the Soviets' threats and coercion:\"They don’t want a true Bolshevik, only a loyal dog that obeys their every command.\"Faced with Genden’s fate and a failed coup attempt, the true Bolsheviks of Mongolia began to question their path.For ten years, ideological debates had drained their energy, leaving them with nothing to show—so much so that Moscow mocked them, saying ‘the nomads' construction is no construction at all.’\n\nDemid realized that Mongolia needed more than ideological victories—it needed real results.During negotiations for the Mongol-Soviet Alliance Treaty, he stopped rejecting every Soviet demand outright, instead learning to bargain—hoping to exchange a shift in stance for the urgent aid Mongolia desperately needed.And it worked.\nBelieving Demid had finally submitted, the Soviets threw a few scraps his way, offering Mongolia just enough resources to survive.As for Genden—he was sent once more to Ukraine for \"observation and study\".He never returned.\nDuring the German invasion of the USSR, a large number of exiled Mongolian leaders were captured and perished in Nazi concentration camps.Demid never forgot this blood debt—he held the Soviet Union accountable.When the Soviet war machine lay in ruins, he uncorked an old bottle of liquor, drinking alone, swallowing the bitterness, the pain, and the rage.But the world left no time for mourning.A new wound was about to open.\nThe cries of Japanese warplanes filled the skies—the invaders were at Mongolia’s doorstep.\nAs Japan trampled upon Mongolia’s southern and eastern brothers, Demid led his people through their darkest hour.The desire for national unity and independence had never burned brighter.The proud Red Mongolia would never submit."
 MON_Daryzavyn_Losol: "Daryzavyn Losol"
 MON_Daryzavyn_Losol_hog: "Daryzavyn Losol"
 MON_Daryzavyn_Losol_hog_desc: "§YChairman of the Government and Chairman of the Finance Committee\n$communist_bolshevism_subtype$§!\n§F------------§!\n\n§FAs a child, Losol was sent to a monastery by his family to become a monk.After the establishment of the Bogd Khanate, he fought as a protector-monk in the army against foreign invaders.It was within the military ranks that he connected with fellow revolutionaries, eventually becoming one of the seven founding members of the Mongolian People's Party and later representing Mongolia at the Comintern Congress in the Far East.Upon returning home, Losol formally renounced monastic life, taking up the mantle of government leadership for years to come.\n\nIn 1936, Losol, alongside Demid, co-authored the official party history of the Mongolian People's Party, deliberately downplaying the Soviet Union’s role in the revolution.When Genden was exiled, leaving the party leaderless, Losol leveraged his seniority and prestige to block the Soviet advisors' attempt to install Choibalsan as supreme leader. Instead, he threw his full support behind Demid as General Secretary, ensuring that Mongolia remained in Mongolian hands.\n\nFor Losol, there was no limit to the pursuit of national sovereignty.Mongolia’s revolution was a socialist revolution, but it was also a Mongolian revolution—a revolution that determined the nation's future.And for that reason, he would never allow \"professional revolutionaries\" from the outside to interfere.§!"
 MON_Sonombaljiryn_Buyannemekh: "Sonombaljiryn Buyannemekh"
 MON_Sonombaljiryn_Buyannemekh_eco: "Sonombaljiryn Buyannemekh"
 MON_Sonombaljiryn_Buyannemekh_eco_desc: "§YChairman of the Education Committee\n$communist_national_communism_subtype$§!\n§F------------§!\n§FSonombaljiryn Buyannemekh was born in a poverty-stricken family that could barely support him; when he was 5, a wealthier household adopted him. His adoptive parents regarded him as their own, sparing no effort to raise this child, hoping that once he grew up he would become a notable scholar of great renown. However, in school Buyannemekh became inspired by revolutionary ideas and joined the People's Party; his rewriting of the Internationale into Mongolian spread widely, eventually even becoming the Republic's national anthem. \n\nIn 1927, just 25 years old, Buyannemekh became Chairman of the Party Committee in the capital, Ulaanbataar. In speeches made at the Party Congress, he was praised highly; he had never imagined that, as an intellectual, he could participate so deeply in politics. Using his influence, Buyannemekh supported reforming the romanization of Mongolian. However, after Moscow prevented the romanization movement from proceeding in the country, they both openly and secretly promoted Bukharin's pan-Slavic assimilationism; ultimately, under Russian influence, Mongolia would come to use the Cyrillic alphabet. \n\nTo unify Mongolia's national culture, he turned towards compromise in the 40s, agreeing to adopt the Russian method of spelling Mongolian. This led him to ultimately take a firm stance and join the ranks of Demid's anti-Russian faction, supporting a modern national revolution adapted to Mongolia.§!"
 MON_Sonomyn_Avardzed: "Sonomyn Avardzed"
 MON_Sonomyn_Avardzed_for: "Sonomyn Avardzed"
 MON_Sonomyn_Avardzed_for_desc: "§YChairman of the Diplomatic Committee\n$$communist_national_communism_subtype$§!\n§F------------§!\n§FJust as the army fights on the battlefield, the diplomatic corps of the Mongolian People's Republic operates in a similarly ruthless environment, often facing bloodshed and relentless suppression. Due to Mongolia’s inherent weakness, seasoned diplomats frequently disappear after official visits to the Soviet Union under various pretexts of patriotic misconduct. With the Japanese invasion, those dispatched to negotiate with Japan faced even graver dangers, as assassinations became an ever-present threat.\n\nYet, for every fallen martyr, a new generation rises to take their place. Compared to other veteran revolutionaries born in the early years of this century, Avarze stands out—ascending to the nation’s diplomatic leadership at just forty, making him one of the youngest yet most capable figures in politics. His unyielding commitment to Mongolia’s fundamental interests ensures that no diplomatic gambit under his watch will ever compromise the nation's sovereignty—a quality highly valued by Demid.§!"
 MON_Sereenen_Givaapil: "Sereenen Givaapil"
 MON_Sereenen_Givaapil_sec: "Sereenen Givaapil"
 MON_Sereenen_Givaapil_sec_desc: "§YChief of the People's Army General Staff & Chairman of the Industrial Committee\n$communist_national_communism_subtype$§!\n§F------------§!\n§FJiwapil is a stern officer, his severity stemming largely from his unwavering devotion to communism.\n\nIn 1932, the internal security forces he organized were tasked with suppressing a counter-revolutionary uprising led by the lamas. Afterward, to evade responsibility for provoking the rebellion, former General Secretary Genden scapegoated Jiwapil as a \"leftist extremist\" and exiled him to the Soviet Union for further study. While abroad, Jiwapil furiously penned a letter to the Party's central leadership:\n\n\"If I am guilty, then punish me for a real crime. But do not cast me away like the Russian fascists do.\"\n\nRegretful upon receiving the letter, Genden later recalled Jiwapil under the pretext of needing economic expertise, appointing him to oversee state enterprises. Under his leadership, these enterprises flourished—battlefield discipline proved invaluable in transforming the nomadic work ethic and fostering skilled industrial labor.\n\nAfter the collapse of the Soviet Union, a liberated Demid personally apologized to Jiwapil on Genden’s behalf and reinstated him to military command. Jiwapil, never one to shy away from duty, embraced Demid’s trust without hesitation. Just as he had written a decade prior: \"If the Japanese imperialists ever dare invade Mongolia, I will ride to war without a moment’s hesitation to defend my homeland.\"§!"
 MON_leader: "Leader"
 MON_hidden_sick: "An Unspoken Illness"
 MON_hidden_sick_desc: "The Mongolian people are a 'weak and small' nationality, economically, politically, and culturally dependent on attaching themselves to some other group. The lands conquered under Genghis Khan fractured rapidly, and so modern Mongolia must walk a tightrope.\n\nThe question of which path to pursue, to unite with China or with the Soviet Red Army, has provoked recurring disagreements within the Party. Misconceptions led to prejudice, prejudice led to positions being hardened. Following the policy of Sino-Mongolian cooperation, our comrades' disagreements have become an infestation - one the Central Committee is powerless to contain.\n\nOnly ending the Japanese puppets, liberating the Mongolian people, establishing a Mongolian federation, and achieving national unity can we hope to resolve this dispute, achieving true unity beneath the blue sky and white clouds of the steppe."
 MON_we_are_still_friend: "A Vow to Be Fulfilled"
 MON_we_are_still_friend_desc: "Grim circumstance compels us to adopt a line of collaboration with the CPC to resist Japan, with a military advisory group headed by Gao Gang taking part in decision-making and coordinating operations. We have also allowed Communist Party organizers to enter southern Mongolia and supply arms to rebels, aiding our troops by taking pressure off the front line.\n\nWe deeply wish for our Chinese comrades to understand this: that Mongolia and China respect each other's territorial integrity, will fight alongside each other as comrades and partners; with the CPC, we will resist Japanese imperialism, dedicating our blood to the eternal memory of our kinship."
 MON_bloody_field: "Bloodied Fields"
 MON_bloody_field_desc: "Ever since our nation obtained independence, the relationship between Mongolia and the Soviet Union has been rather cold. Nonetheless, when this relationship disappeared, the blood transfusion of foreign aid disappeared with it, sending our country rapidly towards collapse. The people's army made immense sacrifices, but was powerless against Japan's invasion.\n\nThe Soviet Union's Red Army troops stationed here wandered about western Mongolia making a tremendous effort to resist the Japanese, teaching our officers the basics of understanding armored warfare, which captivated them. As a result, they worshipped the Russian army's might more than ever, looking down on the senior officers who had seen territory and battles lost left and right. As our military becomes restless, they may well try to take their place."
 WORLD.16509.d: "Demchugdongrub, the military and political leader of the Mongolian steppes, has died of a severe case of viral gastroenteritis after weeks of agonizing illness.\n\nHis name remains a striking mark in Mongolian history—once hailed as the prince who briefly unified Inner and Outer Mongolia with Japanese support, but ultimately remembered for his incompetent rule, which led to the communist uprising of the early 1960s and once again fractured the Mongolian nation.\n\nSome denounce him as a mere puppet of Japan; others praise him as a champion of Pan-Mongolism.\n\nBut regardless of how history will judge him—Demchugdongrub is dead.\n\nDespite his status as head of state, his funeral was somber and sparsely attended. The highest-ranking Japanese official present was only the ambassador to Nanjing.\n\nNow, with the passing of the old prince, all eyes turn to his successor—Prince Dugursulong, who has officially ascended to the throne."