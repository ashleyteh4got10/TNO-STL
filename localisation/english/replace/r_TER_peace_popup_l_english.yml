l_english:
 TNO_PEACE_POPUP_FLAVOR_MEN: "Wide Heaven, sparse geese;\nthe moon falls, the mountains grow thin."
 TNO_PEACE_POPUP_FLAVOR_MON: "And now the barbarians shall not ride forth."
 TNO_PEACE_POPUP_FLAVOR_QIN: "Only traces remain."
 TNO_PEACE_POPUP_FLAVOR_XIN: "Though the tortoise blessed with magic powers lives long,\nIts days have their allotted span."
 TNO_PEACE_POPUP_FLAVOR_ETR: "Becoming loose are my clothes yet I regret not,\nFor I languish and suffer for her willingly."
 TNO_PEACE_POPUP_FLAVOR_SIC: "When the ancestral pioneer the region reclaimed,\nHow distant into the past was the times."
 TNO_PEACE_POPUP_WAR_CONSLUSION_TRCW_WIN: "In the course of the §VGrand East Asian Liberation War§!, §Y[CPC.GetNameWithFlag]§! defeated the illegitimate regime of §Y[losing_country.GetNameWithFlag]§!, and another step has been taken towards the §xdream of liberation§!."
 TNO_PEACE_POPUP_WAR_CONSLUSION_TRCW_WE_FUCK_JAP: "The §VGrand East Asian Liberation War§! saw §Y[CPC.GetFlag] [CPC.GetName]§! endure, victorious; as §rJapanese imperialism§! is forced to withdraw back to the Home Islands, the §xdream of liberation§! has finally been realized."
 TNO_PEACE_POPUP_WAR_CONSLUSION_TRCW_WE_GET_FUCKED: "The §VEast Asian chaos§! has ended in a victory for §Y[JAP.GetFlag] [JAP.GetName]§!, and §xChina§! is smashed into pieces; exposed to the sun, a corpse lies prone on East Asia's soil, while the §xdream of liberation§! is nowhere to be seen."
 TNO_PEACE_POPUP_FLAVOR_MEN_TRCW: "If you, uncle, have land and a tomb, why am I being asked for permission?"
 TNO_PEACE_POPUP_FLAVOR_SHX: "The crimes of Ling and Wei Lü are treated by Heaven."
 TNO_PEACE_POPUP_FLAVOR_LOY: "Broken monuments illuminate the setting sun, hidden in mist. "
 TNO_PEACE_POPUP_FLAVOR_KIS: "The master is caught out a hundred feet up a ladder, and the ladder will soon depart. "
 TNO_PEACE_POPUP_FLAVOR_CHI: "Because there aren't benevolent and righteous policies, there have indeed been changes in the offensive and defensive situation."
 TNO_PEACE_POPUP_FLAVOR_GNG: "To things that change in an instant, and things that won't for all eternity."
 TNO_PEACE_POPUP_FLAVOR_MAN: "If a man was to die, and then flees, he lacks control over his life; who dares trust him?"
 TNO_PEACE_POPUP_FLAVOR_CPC: "Those who know me know my pain. Those who do not question my actions. Oh gods in blue Heaven above, reveal what sort of a man I am!"
 TNO_PEACE_POPUP_FLAVOR_TRCW_JAP: "We too shall make a vow: may all humanity enjoy an upright happiness."
 TNO_PEACE_POPUP_WAR_CONSLUSION_TRCW_LOSE_BY_NUKE: "Despite the devastation of the Oil Crisis, the fangs of §jJapanese imperialism§! have been fully revealed; §etoxic radiation§! has destroyed the §fGreat Northwest§!, while the §xdream of liberation§! has been utterly shattered."
 TNO_PEACE_POPUP_WAR_CONSLUSION_TRCW_LOSE_BY_RGOC: "The §VEast Asian chaos§! has ended with §Y[CHI.GetFlag] [CHI.GetName]§! crushing its rebels; the §SChinese nation's§! §xcause of liberation§! must now travel down §myet another fork in the road§!."