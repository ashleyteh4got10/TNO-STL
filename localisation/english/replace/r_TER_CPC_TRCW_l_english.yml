l_english:
 TRCW_info_tt: "§VThe Great Asian People's Liberation War§! has begun, and all §Gliberated zones§! have now transitioned into §Ywartime readiness§!, under the unified command of the §RCentral Military Commission§! and the §GCentral Frontline Committee§!, overseeing all military and political affairs of the total war.\n---------------\n- §YWar Index System§!\nThe overall progress of the war is quantified through the interface's §YWar Index§!, which includes:\n\n§fIntensity of Air Attack§! – Reflecting the extent of destruction in liberated zones caused by enemy air raids.\n§nContamination Level§! – Representing the severity of biological warfare contamination inflicted by the enemy.\nThe §YWar Index§! can be mitigated through §Ywartime policies§!. A §Rhigher§! §YWar Index§! indicates §Rgreater damage§! to our rear bases. If it reaches a critical threshold, §xunpredictable severe consequences§! will ensue.\n\n- §YTheater Mechanism§!\nOn this interface's map, the country is divided into §Ynumerous theaters§!, which are further categorized into:\n§GLiberated Zones§!: Theaters where all §Ysub-regions§! are fully controlled by §Gfriendly forces§!.\n§REnemy-Occupied Zones§!: Theaters where all §Ysub-regions§! are fully controlled by §Renemy forces§!.\n§OContested Zones§!: Theaters where §Renemy§! and §Gfriendly§! forces each hold at least one §Ysub-region§!.\nThe §YWar Index System§! applies only to §GLiberated Zones§!, with further details accessible through the interactive interface below.\n\n§YEvery 15 days§!, we will receive §Gcore claims§! on all newly §Gliberated§! territories."
 TRCW_info_warpoint_tt: "§YWar Index System§! Details\n--------------------\n§YIntensity of Air Attack§! & §nContamination Level§!\nThe actual monthly growth rates of §fIntensity of Air Attack§! and §nContamination Level§! are determined by the weighted average of all §GLiberated Zones§!.\n\nThe §Ywartime modifiers§! for both the §GRear Front§! and the §OForward Front§! are dictated by the regional focal points of all §GLiberated§! territories. By default, all regional focal points are set to Balanced. Additionally, the §Ywartime modifiers§! will be §Rpercentage-reduced§! by the average values of §fBombardment Intensity§! and §nContamination Level§!.\n\n§GRear Front§! Modifiers\nWeekly Stability Change: [?CPC.CPC_TRCW_modifier_weekly_st|+=%]\nProduction Efficiency Cap: [?CPC.CPC_TRCW_modifier_production_cap|+=%]\nProduction Efficiency Growth: [?CPC.CPC_TRCW_modifier_production_growth|+=%]\nAdditional £tt_prod_unit Production Units: [?CPC.CPC_TRCW_modifier_PUs|+0]\n\n§OForward Front§! Modifiers\nUnit Attack: [?CPC.CPC_TRCW_modifier_attack|=%+]\nUnit Defense: [?CPC.CPC_TRCW_modifier_defence|=%+]\nUnit Organization: [?CPC.CPC_TRCW_modifier_org|=%+]\nUnit Organization Recovery: [?CPC.CPC_TRCW_modifier_org_regain|=%+]\nReinforcement Rate: [?CPC.CPC_TRCW_modifier_support_rate|=%+]\n\n§fAir Defence and Nuclear Defencen§! (§fIntensity of Air Attack§!: [?CPC.CPC_TRCW_total_bomb_progress|=2-]%)\nMaximum Regional Building Capacity: [?CPC.CPC_TRCW_modifier_buildings_cap|=%+]\nFree Infrastructure Repairs: [?CPC.CPC_TRCW_modifier_free_fix|+=%]\nAdditional Consumer Goods Demand: [?CPC.CPC_TRCW_modifier_consumer_needs|-=%]\n\n§nEpidemic Control & Public Health§! (§nContamination Level§!: [?CPC.CPC_TRCW_total_bio_progress|=2-]%)\nMonthly Manpower Growth: [?CPC.CPC_TRCW_modifier_monthly_manpower|+=%]\nRecruitable Military-Age Population: [?CPC.CPC_TRCW_modifier_suitable_manpower|+=%]\nMonthly Healthcare Development Rate: [?CPC.CPC_TRCW_modifier_soc_dev_medical|+=2]"
