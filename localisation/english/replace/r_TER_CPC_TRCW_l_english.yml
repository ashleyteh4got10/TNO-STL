 CPC_TRCW_warzone_btn_1_tt: "Mobilize Militia\n--------------------\n§Y1§! §YMilitia Division§! will be immediately deployed to the designated war zone. All §YMilitia Divisions§! will be §Ydisbanded§! after the war ends.\n\nCost: £command_power §Y20§! Command Power, §Y4,300§! Manpower\n\nRestrictions:\nEach war zone may only initiate §Yone§! war zone action per month.\nThis action can only be executed in §GRear War Zones§!."
 CPC_TRCW_warzone_btn_2_tt: "Mobilize Production\n--------------------\n§Y300§! units of §YInfantry Equipment§! will be immediately added to the stockpile.\n§Y100§! units of §YSupport Equipment§! will be immediately added to the stockpile.\n§Y75§! units of §YArtillery§! will be immediately added to the stockpile.\n\nCost:\n£pol_power §Y20§! Political Power\n§Y0.5%§! War Support\n\nRestrictions:\nEach war zone may only initiate §Yone§! war zone action per month.\nThis action can only be executed in §GRear War Zones§!."
