 MAN_Kwantung_Army_TER: "Kwantung"
 MAN_Kwantung_Army_TER_desc: "The implementation of the Security Ordinance has established the Kwantung Army as the sole military authority in the Northeast Region. On the surface, it appears to be merely a part of the Imperial Japanese Army, but such a perception is overly simplistic and superficial. In reality, the relationship between the Manchukuo government and its Japanese \"overlords\" is deeply intertwined, with mutual integration at every level. For instance, every Manchukuo minister is assigned a Japanese vice minister, ensuring that any proposals detrimental to Japanese interests are filtered out, thereby solidifying Japan’s absolute authority over Manchukuo.\n\nHowever, internal divisions exist within the Kwantung Army, which can be categorized into two factions: the Manchurian faction and the Orthodox faction. The former consists of Manchukuo military forces and moderate elements within the Japanese Army, while the latter is composed of hardliners whose ideology traces back to totalitarianism and the era of National Spiritual Mobilization. The 1955 Military Cooperation Law, which reinforced the Kwantung Army’s command authority over the Manchukuo military, further strengthened the Orthodox faction’s influence."
 CPC_TRCW_GNG_Riots_GUI: "§xGuangdong uprising§!"
 TER_TRCW_GNG_Riots_Info_Normal_tt: "§VFor decades, the uprising forces of £GFX_GNG_Guangdong_texticon §SGuangdong§! have endured relentless oppression, deepening ethnic strife, and an exploitative social order.§! Now, £GNG_rioters_texticon §uthey§! demand change.\n\nThe £GNG_CCL_texticon §VCCL§! has mobilized the £GNG_chinese_nation_texticon §iChinese§!, while the £GNG_zhujin_texticon §EZhujin§! have rallied under the £GNG_GFT_texticon §nGFT§!. Both organizations receive varying degrees of support from the £CPC_texticon §GSouth China Bureau of the Communist Party of China§!. Their level of radicalism and aggression is determined by their £GNG_riot_strength_texticon §eStrength§! and £GNG_riot_radicalism_texticon §xRadicalism.§!\n\nWe must carefully control the §Yscale and intensity of the uprising§!, maintaining high £GNG_riot_radicalism_texticon §xradicalism§! and £GNG_riot_strength_texticon §estrength§! while avoiding excessive provocation of £GNG_japanese_frustration_texticon §jJapan§!, lest we risk §xlosing control of the Guangdong situation and sacrificing countless workers in vain.§!\n\nKey Considerations:\n\nIf a faction’s £GNG_riot_radicalism_texticon §xRadicalism§! falls below §Y25%§!, the £GFX_GNG_Guangdong_texticon §SPuppet Guangdong Government§! may attempt to negotiate §Stheir submission.§!\nIf a faction’s £GNG_riot_strength_texticon §eStrength§! falls below §Y25%§!, the £GFX_GNG_Guangdong_texticon §SPuppet Guangdong Government§! may launch a suppression operation to §Spermanently neutralize them.§!"
