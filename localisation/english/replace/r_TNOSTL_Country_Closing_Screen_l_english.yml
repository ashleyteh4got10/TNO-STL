l_english:
 TNO_CountryClosing_left_title: "From this point on,\na wisp of dusk descends upon the New Order..."
 TNO_CountryClosing_select_btn_epilogue_text: "Epilogue"
 TNO_CountryClosing_select_btn_epilogue_tt: "§WIn the end, what more is there to say?§!"
 TNO_CountryClosing_select_btn_credits_text: "Credits"
 TNO_CountryClosing_select_btn_credits_tt: "§WWe are the development team of §xThe New Order: The Long March§!. We sincerely thank you for playing this mod, and hope you enjoyed it!§!"
 TNO_CountryClosing_epilogue_CPC_end_people_dem: "Ten years ago, no one would have expected that the §xCommunist Party§! blockaded west of Tongguan would become the ultimate protagonist of a mighty sixty-year people's revolution——but they persevered, and achieved the final victory of the people's revolution.\n\nThough there have been too many endings already, in the end the revolution §Gtriumphed§!, and §SPeople's Democracy§!——this §Rmodel of socialism§! distinct from the Soviet Union's——is §Gtaking root§! on this war-torn land, and, with the force of rolling spring thunder, deeply implanting the old Republic's sixty years of empty §C'equality and democracy'§! slogans into the hearts of this generation of Chinese people.\n\nIt is the year [GetYear], and the dark clouds of a §xSino§!§j-Japanese§!§YCold War§! are rolling in from the Western Pacific, yet inside the Great Hall, the jubilant §Rnew generation of left-wing politicians§! are drawing up blueprints for the future of the newborn republic——§SPeople's Democracy§! is only the beginning, and the republic will surely reach §Gthe lofty goals they have long dreamed of§! amid the magnificent socialist transformation and construction——§xproletarian democracy§!.\n--------------------\nThank you for playing! At this point, you have completed the full content of §xThe New Order: The Long March§!'s §xThe New Order: The East Is Red§! §YVer.1.1: Guanshan Moon§!, and achieved the §SPeople's Democracy ending§!. Of course, the tremendous amount of work in the mod is thanks to our team and the TER team, but without your playing, it would all be for nothing. You can find and join our Discord community on the Steam Workshop page for The East Is Red!"
 TNO_CountryClosing_epilogue_CPC_end_party_mao: "Ten years ago, no one would have expected that the §xCommunist Party§! blockaded west of Tongguan would become the ultimate protagonist of a mighty sixty-year people's revolution——but they persevered, and achieved the final victory of the people's revolution.\n\nThough there have been too many endings already, in the end the revolution §Gtriumphed§!, and the disciples of §GChairman Mao§! slowly walked along the ancient gate tower of [CPC.Capital.GetName] to the high platform of China's power, gazing out over this war-torn land——what ambitions they harbor in their hearts remains unknown for now, but one thing is certain: §GChairman Mao§!'s unfulfilled long-cherished wish will be realized by §Gthem§!.\n\nIt is the year [GetYear], and the dark clouds of a §xSino§!§j-Japanese§!§YCold War§! are rolling in from the Western Pacific, and this time, under the leadership of the §xCommunist Party of China (CPC)§!, the Chinese people firmly believe that they §Gwill surely triumph§!.\n--------------------\nThank you for playing! At this point, you have completed the full content of §xThe New Order: The Long March§!'s §xThe New Order: The East Is Red§! §YVer.1.1: Guanshan Moon§!, and achieved the §GParty Power ending - Maoist faction§!. Of course, the tremendous amount of work in the mod is thanks to our team and the TER team, but without your playing, it would all be for nothing. You can find and join our Discord community on the Steam Workshop page for The East Is Red!"
 TNO_CountryClosing_epilogue_CPC_end_party_liu: "Ten years ago, no one would have expected that the §xCommunist Party§! blockaded west of Tongguan would become the ultimate protagonist of a mighty sixty-year people's revolution——but they persevered, and achieved the final victory of the people's revolution.\n\nThough there have been too many endings already, in the end the revolution §Gtriumphed§!, and the disciples of §mChairman Liu§! slowly walked along the ancient gate tower of [CPC.Capital.GetName] to the high platform of China's power, gazing out over this war-torn land——what ambitions they harbor in their hearts remains unknown for now, but one thing is certain: §mChairman Liu§!'s unfulfilled long-cherished wish will be realized by §mthem§!.\n\nIt is the year [GetYear], and the dark clouds of a §xSino§!§j-Japanese§!§YCold War§! are rolling in from the Western Pacific, and this time, under the leadership of the §xCommunist Party of China (CPC)§!, the Chinese people firmly believe that they §mwill surely triumph§!.\n--------------------\nThank you for playing! At this point, you have completed the full content of §xThe New Order: The Long March§!'s §xThe New Order: The East Is Red§! §YVer.1.1: Guanshan Moon§!, and achieved the §mParty Power ending - Liu faction§!. Of course, the tremendous amount of work in the mod is thanks to our team and the TER team, but without your playing, it would all be for nothing. You can find and join our Discord community on the Steam Workshop page for The East Is Red!"
 TNO_CountryClosing_epilogue_CPC_end_lin_coup: "The revolution may have triumphed——but the revolution's development may not have been smooth sailing: no one knows why §LLin Biao§!, who had already resolved to stay away from politics, ascended to the highest throne of China's power. Perhaps it was the §Rchaotic political arena§! that repeatedly needed him to come out of retirement to mediate that stirred his disgust, or perhaps the §Rloss of popular support§! caused by mismanagement that disappointed him. In any case, §LLin Biao§!, who had bided his time for years, finally made his move; this time, he stepped to the front of the stage himself——§xChina§! will surely follow his guidance toward §Lthe future he envisioned§!.\n\nIt is the year [GetYear], and the dark clouds of a §xSino§!§j-Japanese§!§YCold War§! are rolling in from the Western Pacific. Under the guidance of §LChairman Lin§!, £TER_texticon_PLA §RPeople's Liberation Army (PLA)§! is ready to resist all invading enemies, sworn to §Ldefend the victory§!.\n--------------------\nThank you for playing! At this point, you have completed the full content of §xThe New Order: The Long March§!'s §xThe New Order: The East Is Red§! §YVer.1.1: Guanshan Moon§!, and §Lincurred Lin Biao's dissatisfaction§!. Of course, the tremendous amount of work in the mod is thanks to our team and the TER team, but without your playing, it would all be for nothing. You can find and join our Discord community on the Steam Workshop page for The East Is Red!"
 TNO_CountryClosing_epilogue_CPC_end_all_gone: "Snow spreads over the scarred land of the Northwest, covering the barren truth and then sinking into a heavy death. A whirlwind suddenly arises, sweeping up jade trees, soaring above the boundless wilderness, pervading this suffocating world.\n\nThe story of §xthe last resistance of Free China§! comes to an end here. Looking out at the world, §mthe United States§! is hastily organizing an OFN Security Council summit because §eJapan§! has bared its fangs, while §oGermany§! has announced it will accelerate the deployment of intercontinental missiles in the Indian Ocean region——§Vthe destruction of the Great Northwest§! seems to have sounded the prelude to this mad world's §xcoming to an end§!.\n\nIt is the year [GetYear]; sixty years have passed, and §xthe dream of China's liberation§! has utterly turned to §oashes of history§!.\n--------------------\nThank you for playing! At this point, you have completed the full content of §xThe New Order: The Long March§!'s §xThe New Order: The East Is Red§! §YVer.1.1: Guanshan Moon§!, and §Vlet the Great Northwest die completely§!. Of course, the tremendous amount of work in the mod is thanks to our team and the TER team, but without your playing, it would all be for nothing. You can find and join our Discord community on the Steam Workshop page for The East Is Red!"
 TNO_CountryClosing_epilogue_CPC_end_collapse: "The revolution did not triumph. As the iron heels of the §jImperial Japanese Army§! trampled into Xi'an and Chongqing, the §xdream of independence and freedom§! that had lingered in the hearts of the Chinese people for a full sixty years completely vanished. Perhaps §xChina§! will thereby become §ea historical term§!.\n\nThe story of §xthe last resistance of Free China§! comes to an end here. Looking out at the world, §mthe United States§! is hastily organizing an OFN Security Council summit because §eJapan§! has bared its fangs, while §oGermany§! has announced it will accelerate the deployment of intercontinental missiles in the Indian Ocean region——§VChina's total disintegration§! seems to have sounded the prelude to this mad world's §xcoming to an end§!.\n\nIt is the year [GetYear]; sixty years have passed, and §xthe dream of China's liberation§! has utterly turned to §oashes of history§!.\n--------------------\nThank you for playing! At this point, you have completed the full content of §xThe New Order: The Long March§!'s §xThe New Order: The East Is Red§! §YVer.1.1: Guanshan Moon§!, and §Vlet all of China fall completely under the Japanese army's iron heel, with no chance of ever rising again§!. Of course, the tremendous work with TER in the mod is thanks to our team, but without your playing, it would all be for nothing. You can find and join our Discord community on the Steam Workshop page for The East Is Red!"
 TNO_CountryClosing_epilogue_CPC_end_RGOC: "The revolution did not triumph. The §mNational Revolutionary Army§! strangled the §Cequality, democracy, and freedom§! §xdream of liberation§! west of Tongguan, and the future of the Chinese nation §mfaces a long and arduous road§!.\n\nThe story of §xthe last resistance of Free China§! comes to an end here, but the story of §Sthe Chinese nation§! may well continue. The Taipei Summit is imminent, and the whole world is waiting to see: in what posture will the triumphantly returning §mRepublic of China§! face the §jEmpire of Japan§! that has towered above it for forty years?\n\nIt is the year [GetYear]; sixty years have passed, and §xthe dream of China's liberation§! has at last walked into §ma divergent path§!.\n--------------------\nThank you for playing! At this point, you have completed the full content of §xThe New Order: The Long March§!'s §xThe New Order: The East Is Red§! §YVer.1.1: Guanshan Moon§!, and led §xthe dream of China's liberation§! toward §manother direction§!. Of course, the tremendous work with TER in the mod is thanks to our team, but without your playing, it would all be for nothing. You can find and join our Discord community on the Steam Workshop page for The East Is Red!"
 TNO_CountryClosing_credits_0: "TNO:STL development team\n§WCurrent members§!\n\n§GChief planners: Ju Xueli, Milk Tea, Hayase Yuuka\n§GPlanners: Unknown Netizen from Fontaine, Haomin, Little Cucumber, Tianteng Qianxi\n§GArtists: A-Hao, Darjeeling-chan, Starlight Secretary, Guo Baorou\n§GWriters: Grand Marshal, Heng, Little Cucumber, Little Postman, Tianteng Qianxi\n§GProgrammers: Ju Xueli, Milk Tea, Tianteng Qianxi, Heng, olele114, Entityback, Haomin, Gewalthaufen, GdanskInPolska\n§GTesters: Used Fifteen Tons of Coal, Kalis Tarius§!\n§GSpecial thanks: Chief Designer, sergey taboritsky, Qiuqi, Zhuoqingke, Qianlu, Mengqinglong, LuckySmartPlayer, concored55\n§x— and to you, who have supported us all this time.§!\n\n"
 TNO_CountryClosing_credits_1: "Afterword\n\n--------------------\n\nMember: Tianteng Qianxi\n\nHello everyone, my name is Tianteng Qianxi. I wonder, did you all enjoy playing this modpack?\n\nLooking back on when I joined The Long March, all I had in hand was a half-finished The East Is Red expansion. At the time I had planned to apply it to The New Order: The East Is Red, but since the East Is Red's chief planner had other arrangements, I decided to release it as a standalone expansion——though it kept being shelved because I couldn't find an artist for a long time.\n\nLater, I heard about The New Order: The Long March, so I joined it with that half-finished work. After discussions within the team, I spent a month on code compatibility and the reset of some GUI and national spirits, and finally completed this expansion. This expansion is The Long March's Northeast Bureau content. It has become independently produced content for The Long March, and has received a fairly good reception, which makes me very honored. In addition, thank you to the other members of The Long March development team, especially the art members for their great support.\n\n"
 TNO_CountryClosing_credits_2: "Special Thanks\n\nAuthor of the TNO Tank Design expansion and its adaptation for The New Order: The East Is Red\nThe New Order: Falling Rain of the New Moon development team\nThe New Order: Light Comes from Lake Baikal development team\nQiuqi Library"
 TNO_CountryClosing_credits_3: ""