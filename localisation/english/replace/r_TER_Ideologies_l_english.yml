 communist_liu_shaoqi_thought_subtype: "Liu Shaoqi Thought"
 communist_tibet_secret_socialism_subtype: "Tibetan Socialism"
 communist_liu_shaoqi_thought_subtype_desc: "In terms of its origins, Liu Shaoqi's thought is a continuation of Mao Zedong's, underpinned by a constant adaptation of indigenous Chinese Marxist principles that eventually became a product of the times. Unlike Mao, who focused on destroying the old order, Liu Shaoqi was more inclined to explore the ways in which the Communist Party could run the state. The moral-centric tendencies exhibited by Mao during the Rectification Movement of the 1940s were inherited by Liu Shaoqi and presented in theoretical writings that made conservative peasants willing to accept Communist rule. Likewise, the authority of the Party is unquestionable with Liu Shaoqi, but this is not the whole of Liu Shaoqi's thought.\n\nThe underlying logic of Liu Shaoqi's thought is that people have different consciousnesses when they are in different environments, and that it is more advantageous to use verifiable historical experience to inspire the people to introspect than to force others to accept new ideas. This vernacular communism would not be rejected as \"alien\", but rather would be internalized as the innate brand of a people, more conducive to the Communist Party's leadership of the proletariat in revolutionary struggle.\n\nInternationally, Liu Shaoqi's ideas often influence established Communist parties, both above and below ground, to facilitate the integration of Communist ideas with the local population. "
 communist_tibet_secret_socialism_subtype_desc: "In accepting the theoretical doctrines imported into Tibet by the Chinese Communist Party, Panchen began to seek a form of reconciliation between Buddhism and Marxism to ensure the survival and continuity of Tibetan Buddhism and wrote a book to deliver a satisfactory answer to Yan'an -\n\nThe Buddha said that all beings are equal and that the universal desire is to liberate all sentient beings. If we reinterpret this statement from a popular humanistic point of view, that is, Sakyamuni Buddha is in favor of the equality of all people, everyone has the right to freedom and emancipation; and if people want to be liberated and abandon their worries, they must cut off the worldly appearance, and money and goods are naturally included, so Buddhists advocate the economic system of sharing the means of living, such as 'giving without boredom.' Therefore, Buddhists support the financial system of sharing the standards of living, such as 'giving without endlessness'; Buddhists preach the cause and effect of karma, meaning that different activities produce different results, thus revealing the social relations of people. In summary, Buddhist thought is consistent with socialist principles and is a doctrine in the service of the proletariat.\n\nTheoreticians within the CPC insisted that the so-called \"Buddhist socialism\" was only a delaying tactic of the religious forces to cope with the socialist transformation, revealing incompleteness in every way, and putting forward the demand for \"economic revolution\" in a trenchant manner. Liu Shaoqi believed that this idea could eliminate the suspicion and fear of the Tibetan people toward the Yan'an and was conducive to united front work and social stability."
 progressivism_rural_construction_subtype: "Rural Reconstruction Movement"
 liberalism_He_Shang_liberalism_subtype: "The River Elegy"
 progressivism_rural_construction_subtype_desc: "China is a country of peasants, so educated people cannot leave the peasants behind to talk about national politics.\n\nIn the 1920s and 1930s, the country's political order was in turmoil, cliques were in the frequent war, bandits were everywhere, and the vast countryside was constantly the battleground of civil war and the target of banditry; floods and droughts were frequent, affecting a vast area and a large number of people; the dumping of commodities in the free market further aggravated the bankruptcy of small farmers. This all-around economic calamity was unprecedented for all generations of peasants and caused the unimaginable tragedy. Along with economic backwardness came cultural ignorance and political dysfunction. These vast pits need to be filled artificially to build a modern state.\n\nThe rural construction movement focused on rural issues from point to point, including political reform, culture, education, improvement and promotion of science and technology, health care, organization of cooperatives, change of customs, self-defense and security, etc. At that time, it was often summarized as \\"politics, education, wealth and health,\\" i.e., many rural construction schools eventually converged into the same connotation, The rural construction movement."
 liberalism_He_Shang_liberalism_subtype_desc: "Hu Shih said, \"To fight for your personal freedom is to fight for the freedom of your country; to fight for your own personality is to fight for the personality of your country. Now that he is dead, his promise has gone bankrupt as well. The end of the Political Tutelage has brought about dictatorship, a loud slap in the face of the Chinese people: the Pan-Asian Democracy is a complete fraud. Between the cracks of the mainstream ideology, a wave of rebellious thinking spread through the university classrooms of northern China -\n\nBlamed on geography, sparking changes in China is a hard chore. China is an inward \"Yellow Civilization\" with its roots in the great rivers and the vast territories, and its rich agricultural conditions make the Chinese inherently lack the subjective desire to interact with the outside world, as evidenced by the construction of the Great Wall. As a result, China became more and more conservative, ignorant, worshipping the past, and willing to be lagged behind, and was eventually defeated by Japan, the first to learn from the Western civilizations.\n\nFor China, the Pan-Asian theory advocated by Japan is just the shackle that prevents China from self-improvement and true salvation. How to solve that, then? The Yellow River cannot be redeemed, China must abandon the East Asian identity and learn from the sea-oriented \"Blue Civilization\", learn from the American Democracy and build a free economy, so as to activate China's sleepy people and re-establish itself among the nations of the world.\n\nPerhaps no one cares what \"freedom\" and \"democracy\" actually means, especially in a society where politics are quite sensitive and everyone is silent. But the theory of River Elegy tells the people not to follow blindly, but to express their demands and open the gap of contradiction, then all changes will be made."
 communist_workerism_subtype_desc: "Workerism, or Marxist autonomism, is a term that encapsulates an ideology that, despite its youth, is large and profound - workerists were frequently seen on the streets of Italy in the early 1960s, and the overwhelmed autonomous workers' groups in Guangdong during the Asian economic crisis brought on by the 1963 Yasuda crisis The idea was spontaneously developed by autonomous groups of workers in Guangdong during the 1963 Asian economic crisis brought about by the Yasuda crisis.\n\nThe early core of workerism consisted of a small group of Marxist intellectuals who critically revised the Marxist interpretations that had been popular among communists since Lenin's time. The central idea of workerism was that the traditional communist idea that \"the class struggle of the working class is a response to the development of capitalism\" was a reversal of history. According to workerists, capitalist development is a response to the struggle of exploited workers.\n\nThus, the working class is the \"passive engine\" of capitalist development, and all revolutionary tactics must be spontaneously generated and driven by the workers themselves while preventing the corrupting interference of §Rbourgeois collaborationist trade unions§! and excluding the exploitative so-called §Rvanguard parties§!. The workers' movement believed that the working class should refuse to unite with the so-called §R\"progressive\" or \"sympathetic\" bourgeoisie§! - that it must stand on its own feet and seize power. The working class must stand on its own feet and take power by its forces. To accomplish this goal, it must rely on violent revolution and tight grassroots organization. At present, workerism is alive and well and has attracted a large number of young students and workers whose political enthusiasm has not yet been extinguished with its new articulation of communism.\n\nThe workerists are convinced that the communist theories of the old era can no longer save the bleeding and wailing world from the iron boots of the new order - they will smash all the old organizations and start from scratch to organize a real working class fighting force."
 communist_mao_zedong_thought_TER_subtype: "Mao Zedong Thought"
 communist_mao_zedong_thought_TER_subtype_desc: "Born out of Leninism, Mao Zedong Thought was relatively independent while being heavily imbued with Bolshevism - an independence that stemmed from the rejection of partly dogmatic Soviet Marxism. In other words, Mao and other communist thinkers shared the same ultimate ideals and differed mainly in their methods.\n\nForged by a long internal revolutionary war, Mao found that China was far from the ideal place for revolution as defined by Marx, and he had to expand his interpretation of the concept of the \"proletariat\" to focus the revolution on the broadest group of people in China: the peasants (which included sharecroppers, who were totally dependent on the landlord class, as well as peasants and yeomen with small holdings of land). The completion of the \"agrarian revolution\" was the main goal of the Chinese Revolution at the time, after which the vanguard had to follow up with other means (at that time, not yet defined) to bring about the birth of socialism.\n\nWith the defeat of China as its demarcation, the ensuing fifteen years of regional governance laid out the two phases of Mao Zedong Thought. Faced with a new dilemma, Mao followed the Bolshevist idea of \"Regional Diffusion\" - forming a high tide of socialism within the regime, followed by its expansion to the whole country following changes in the external situation. Changes in productive relations became the main goal, and the General Line for Socialist Construction, the Industrial Leap Forward, and Agricultural Co-operation were injected into Mao Zedong Thought as the \"Three Red Flags,\" which became its guiding principles.\n\nDespite various deviations in implementation and the crisis of trust that resulted, Mao Zedong Thought and its founder are still regarded as valuable assets of the CPC. Some even believe in the universality of Mao's ideas and their ability to influence and liberate millions of people in backward countries who share the same situation as the Chinese."
 Econ_Subtype_Revolutionary_Transitional_System: "Revolutionary Economy"
 Econ_Subtype_Revolutionary_Transitional_System_desc: "At the time of the revolution's initial victory, differences in levels of development resulted in the coexistence of multiple economic components. Therefore, the revolutionary government needs to provide adequate guidance to advance all the backward economic bases in the dominated area to the \"eve of dawn\", i.e., to complete the change of social ownership. The means of guidance, not least the residual warmth of capitalism, but also the new growth factors, are summarised in what is known as the Revolutionary Transitional Economy (RTE).\n\nAccording to Marxists, this economic system is temporary and unstable. It may move forward to develop advanced relations of production, or it may fall back to the pre-revolutionary state."
 communist_pan_huism_subtype: "Pan-Huiism"
 communist_pan_huism_subtype_desc: "To compete with Sheng Shicai's Six Great Policies, the stranded Communist Party of Xinjiang helped Ma Zhongying to design a blend of Marxist ideology and Islam. Due to the complexities of national contradictions, this Hui warlord's resulting ideology was derided by non-Hui nationalities in Xinjiang and Sheng Shicai as \"Dunganism\" or \"Pan-Huiism\".\n\nPan-Huiism inherited Marx and Lenin's theory of class struggle; it admits the inevitable nature of abolishing private ownership of the means of production, opposing capitalist and imperialist oppression. On the other hand, its founder, Ma Zhongying, stressed Islam's role and believed the rejuvenation of Allah would bring about a new world.\n\nAlthough Communist Party members must renounce belief in any religion, Pan-Huiists are not necessarily required to turn away from Islam. Having stepped through this gateway to revolutionary teachings, they conduct themselves with dignity; they take away a more austere and plain doctrine from the hadith of the Prophet, extinguishing the flashy but hollow trappings that formerly characterized religious indulgence. Other Muslims criticize their heresy as false interpretation of the scriptures, damaging to their own Lord's intent, but the Pan-Huiists simply reply: a Muslim whose life is halal is unlike a heathen, and does not aim to hold property or control others.\n\nPan-Huiists never refer to themselves as such; it arose as a multilateral compromise, and as the revolution develops it shall gradually wither away, replaced as communism is finally ushered in. "
 communist_peoples_democracy_subtype_desc: "What does People's Democracy ultimately represent? Everyone who seeks to answer this question must pore over old books and research deeply - but for the average person, People's Democracy is an extension of the popular front concept, a new theory that has developed from the anti-fascist united front of the Cold War. Marxist-Leninists may note the strenuous effort to expand the united front to socialist movements during the Seventh Congress of the Third International, stressing anti-fascist zeal and the limits of class compromise. Left-communists staunchly maintain that a socialist democracy is the essence of true socialism, that democracy and socialism have a fundamentally unbreakable connection.\n\nThese debates over People's Democracy are in some ways representative of its very nature: vanguards criticize it on the basis of class compromise; even though the Communist Party oversees all government functions, this system has not yet implemented communist class struggle. Libertarians eye it with cool disdain, concerned that with the proletariat's rights being \"represented\" by a vanguard party, only an empty shell of democratic pretensions will remain. And so \"People's Democracy\" gradually emerges through this process of debate: a transitional democratic system in which a proletarian vanguard party stands at the fore, uniting the majority of society's \"progressive anti-fascist classes\". Perhaps it will develop onwards, ultimately reaching a proletarian democracy, the ideal communist society; perhaps it will stagnate, treading the revisionist path of class compromise. Perhaps it will be totally negated: assuming more duties, it will finally deprive the proletariat of their right to participate in politics.\n\nWhat is the future of the system of People's Democracy? Perhaps it is only the will of the people that can etch a reply onto the pages of history. "