l_english:
 CPC_Wang_Hongwen_THE_CHAMPION: "Wang Hongwen-The CHAMPION"
 POLITICS_WANG_HONGWEN_DESC: "\"I don't know how you did it, but he's here in Yan'an!\"\n\n\"So, what's the cost?\"\n\n\"The entire Northwestern region can't handle such an intense modification of reality, and it would turn into a wasteland. We're doomed!\"\n\n\"Reality modification? Come on, I think you're trying to mess with me.\"\n\n\"Okay, I apologize if you feel offended.\"\n\n\"Never mind that, why is he here?\"\n\n\"He's a placeholder for testing the wasteland effect, preparing for the upcoming version of the Liberation War. If you're familiar with the code, you might be able to summon the real Liberation War super event. Of course, as the content improves, you probably won't see him in the next major version.\"\n\n\"Why him specifically?\"\n\n\"First, it's a personal interest, and second, his portrait was available when we needed a placeholder for the wasteland effect. Okay, have fun playing the next saved game. Goodbye!\""
 TER_SAVE_THIS_FUCKING_WORLD.1.t: "Wang Hongwen has backed like a thunderbolt."
 TER_SAVE_THIS_FUCKING_WORLD.1.d: "Wang Hongwen has backed like a thunderbolt."
 TER_SAVE_THIS_FUCKING_WORLD.1.o: "Wang Hongwen has backed like a thunderbolt."
 TER_SAVE_THIS_FUCKING_WORLD_NEWS.1.t: "[Get_newspaper_header]CHAMPION IS HERE"
 TER_SAVE_THIS_FUCKING_WORLD_NEWS.1.d: "The slight disturbance in Xi'an was the beginning of everything. Sporadic intelligence was received from the outside world, despite previously operating only within its own space. Exceptionally advanced twenty-eighth generation semi-deep space folding fighters had begun visiting ancient, almost forgotten China and launching attacks against any foreign reactionary forces. Their purpose and mission are now clear. We now know that Communist China is fully loaded and ready to go, having restored the survey beacon datalink and reactivated those reconnaissance outposts that were abandoned when they retreated to the current border. Intelligence indicates that they intend to return to the worldwide chessboard. Space and air carrier formations are assembling, the military has issued call-up orders, and the mysteriously appearing factories are once again roaring. The Communist China are beginning to bet their eyes on the world beyond the borderline -\n\nNow, the entire planet is focused on the same question: Who will be the first mantling curse when the once-sleeping giant decides to restore its old glory?"
 TER_SAVE_THIS_FUCKING_WORLD_NEWS.1.o: "I don't care you."
 CPC_debug_dec_10: "Wang Hongwen has backed like a thunderbolt."
 CPC_debug_dec_10_desc: "He may be cool, but messing around with debug decisions is not so cool for §xyou§! :("