 SIC_Liu_Wenhui_desc: "Liu Wenhui's life is like the sea that only rises once, and after the tide falls, he is farther and farther away from the shore that he longs for.\n\nIn the midst of the warlords' chaos, Liu Wenhui was the simplest of men: used and discarded by everyone. He was used by his classmates, in the war to expel the Beiyang proxy warlords, Deng Xihou unsuspectingly allowed Liu Wenhui to integrate his old troops, and then dismembered Liu Wenhui's troops with an order relying on this relationship; he was used by his nephew, Liu Xiang's career many times rely on his uncle's advice, but when Tian Songyao, Deng Xihou, his uncle, he decisively fell into the well, stepped on his uncle to pave a step to the throne of Sichuan leaders. But when Tian Songyao and Deng Xihou turned against him, he fell on his own sword and stepped on the steps paved by his uncle to become the leader of Sichuan.\n\nIn 1931, Liu Wenhui, who had become the head of the army, imagined that he would be the Qin Shi Huang who unified Sichuan, but after 1933, he was the Duke of Qi Huan who was not assisted by Guanzhong, and he was mercilessly imprisoned in the cold palace of Xikang by those who had once been close to him, and he did not hear of his life or death.\n\nThis made Liu Wenhui more or less numb.\n\nIn 1947, when the Chongqing government was about to meet its end, and everyone in Sichuan was in danger, Liu Wenhui had always hoped to return to the reassuring Sichuan family and seek a little shelter. But each time he was roughly escorted out of the conference room by Huang Yin's guards, pushed to the ground, and rolled in the dirt. Chengdu did not welcome Liu Wenhui at all, and only wanted him to die of old age in the snowy mountains of Xikang.\n\nLiu Wenhui, who had been ostracized, was as frightened as a lost dog, and the gentle image of Zhou Enlai began to appear in his mind. For him, the Communist Party became a more reliable ally than any of his fellow countrymen. When all the warlords kicked out the Communists, seized the provincial government and went to the peak of their lives, Liu Wenhui, who had been at the bottom of the valley, dialed up the secret radio station in Ya'an, and came to his door to express his willingness to lead Xikang to the revolution and accept the leadership of the Communist Party, only to return to Chengdu, the place that he longed for, someday.\n\nAt the time of the storm, Liu Wenhui, dragging his decaying body, thought about another fight, even if his wave could reach the edge of the shore a little?"
 XIK_Huang_Yin: "Huang Yin"
 XIK_Huang_Yin_desc: "Many of Sichuan's military and political leaders are living fossils from the Xinhai Revolution, and their biographies have to repeat the history of the Republic of China's beginnings, and Huang Yin was no exception. Born in 1890, he joined the League of Alliance during his high school years, and as a young man he enrolled in the army officers' school in Baoding, where he became a classmate of Deng Xihou, another future leader of Sichuan. After graduating, he returned to Sichuan to serve as a staff officer to the governor, and when the Protectorate War broke out in 1917, Huang Yin was promoted to brigadier general at the age of only twenty-seven and stationed in the provincial capital of Chengdu.\n\nWith its relatively independent geography and its territory divided into units of varying sizes by high mountains and deep ravines, Sichuan was a province that could easily break away from the eastern regime and was prone to internal divisions. This led the Nationalists and the Beiyang government to manipulate the warlords in the province to wage their own proxy wars in order to fight for Sichuan. As a small warlord, Huang Yin always kept pace with his old classmate and superior Deng Xihou during the chaos of the 1920s and 1930s, and eventually survived.\n\nThe Kuomintang (KMT) had been taking steps to encroach on Sichuan Province in an attempt to take full control of the province. However, in the early years of the Republic of China, there was a strong voice in Sichuan calling for \"autonomy for the Sichuanese\", trying to prevent Sichuan from becoming a slave girl for outsiders, and after the July 7th Incident in 1937, Chiang Kai-shek was finally able to use the anti-Japanese excuse to move the Sichuan army out of his hometown, and bring the Central Army into Sichuan. Huang Yin and the Sichuan army under his command were one of the few units that remained in central Sichuan, and were regarded by his fellow townsmen and old friends as the basis of their fight against Chiang Kai-shek, and were given extremely high expectations of him.\n\nIn 1946, there was a great famine in Sichuan, and nine of the ten rooms in the territory were empty. Pan Wenhua, who had been living at home for years due to illness, took the unprecedented initiative to find Huang Yin and urge him to fire Chen Cheng's Central Army. Huang Yin still have concerns about this, said to wait a little longer. But at this time, Deng Xihou suddenly appeared outside the door, into the room with a heavy face, said to Huang Yin: \"This day, we can not resist.\"\n\nHuang Yin finally made up his mind to abandon the Kuomintang, but history played a hell of a joke on him - the Central Army launched a massacre in Chengdu, only because the citizens of Chengdu demanded that the Kuomintang withdraw from Sichuan. In this Sino-Japanese war, Sichuan was like a fool who jumped off a cliff of his own accord, falling to pieces and dying.\n\nThe crimes committed by the Kuomintang against Sichuan were too numerous to mention, and all the hatred prompted Huang Yin to accept Japan's peace offer. The days of shedding blood for outsiders should have ended long ago, and Sichuan should only listen to its own people!"
