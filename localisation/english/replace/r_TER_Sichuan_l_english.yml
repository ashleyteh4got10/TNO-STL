 CHQ_Shen_Gan_Duo_You: "How Dare You Drink More?"
 CHQ_Shen_Gan_Duo_You_desc: "Since Chongqing was established as a municipality in 1954, the city’s banquet tables have seen a steady influx of high-ranking officials from Nanjing, toasting and exchanging drinks. These officials, arriving with central government assets, generally held ranks one level higher than the local Chongqing bureaucrats. Yet, they displayed great enthusiasm for the city—especially when it came to explaining why Chongqing had historically been independent from Sichuan.\n\nThrough cultural maneuvering, they fostered a sense of division between the local and the outsider. As Sichuanese officials were gradually squeezed out, the vacant positions awaited those with the right connections. Whether willingly indulging in this shared feast or having the rewards forcibly stuffed into their hands, most Chongqing officials accepted the central government's benefits, save for a handful of deeply rooted figures who chose to resign rather than partake.\n\nNow, the only thing left between Chongqing and Sichuan is resentment over an unequal split—let alone any meaningful private ties. Their endless squabbles may irritate the central authorities, but Chongqing can no longer stand alongside Sichuan against them. The Nanjing officials, once raising their glasses in feigned camaraderie, now drink themselves into a stupor without needing a single toast.\n\nLeft behind, the Chongqing bureaucrats, burdened with mixed emotions, silently stare into their cups, their gaze empty."
 CHQ_Fujitsu_consultant: "Guangdong Technical Advisors - Fujitsu"
 CHQ_Fujitsu_consultant_desc: "Thanks to years of postwar political turmoil, Chongqing secured investment and trade rights later than Yunnan, Guizhou, and Sichuan, yet it has experienced the fastest growth and the deepest foreign cooperation. This success is largely attributed to the city's rapid stabilization after its establishment as a municipality, which fostered a favorable business environment.\n\nApproaching the issue from his own expertise, Mayor Fang Xianqi chose Japanese corporation Fujitsu as a key technical partner, welcoming corporate advisors to participate in urban development planning. Meanwhile, local financial institutions eagerly received these highly specialized foreign investors, mitigating potential losses by securing external financing.\n\nThanks to Chongqing’s sincerity, Fujitsu has shared some of its cutting-edge technologies and business strategies with local business representatives.\n\nToday, Fujitsu operates multiple research institutes in Chongqing, while the city has become one of Fujitsu’s key markets."
 CHQ_Jiangcheng_test_group: "Jiangcheng Testing Group"
 CHQ_Jiangcheng_test_group_desc: "To address the Chongqing insurgency, both the Chongqing Municipal Government and the Pacification Office were established simultaneously. Initially, Hakka military officer Su Shaowen served as both Director of the Pacification Office and Chief Administrator. However, due to his overly conciliatory tactics, Nanjing deemed him to be harboring bandits for personal leverage, stripped him of his authority over the municipal government, and ordered him to focus solely on counterinsurgency operations.\n\nMeanwhile, the Communist forces from the north continuously attempted to infiltrate Chongqing, disguising themselves as government officials, seizing control of rural areas, and rallying scattered remnants of enemy troops to oppose the city government, placing our forces in repeated danger.\n\nFollowing Fujitsu’s entry into Chongqing, Mayor Fang Xianqi persuaded Su Shaowen with both reason and sentiment, convincing the military command to cooperate with corporate partners. As a result, frontline troops were assigned as weapons testers for new military technology.\n\nWith enhanced weaponry, soldiers gained higher survivability and greater combat effectiveness—an undeniable benefit for all."
 CHQ_Fang_Xianqi: "Fang Xianqi"
 CHQ_Fang_Xianqi_desc: "In 1912, Fang Xianqi was born into a scholarly family in Fuzhou, Fujian. Amidst the turbulent years of warlord conflicts, he completed his studies at Shanghai Jiao Tong University and began working at the Zhejiang Provincial Telephone Bureau. During the Second Sino-Japanese War, Fang left his family, who chose to stay behind, and followed Chiang Kai-shek to the relocated capital of Chongqing—after all, a rootless talent could take root anywhere. Diligently, he devoted himself to surveying and laying down communication networks in the rear area. However, the cessation of hostilities between China and Japan interrupted his work, as all former government personnel had to await instructions from Nanjing before resuming their duties.\n\nWith a purely pragmatic mindset and a hint of unyielding pride, Fang Xianqi signed his name on the list of personnel awaiting reassignment. Thanks to his solid professional skills and the blessing of his family's reputation, he was appointed as the mayor of Suzhou, quickly adapting to his new role. His outstanding performance earned him a personal meeting with Chen Bijun, the wife of Wang Jingwei, who subtly hinted at recruiting him. Faced with an opportunity for rapid promotion, Fang kept his distance. He had no intention of becoming an even bigger collaborator under Wang Jingwei’s faction, nor did he possess the broad-mindedness to resign and return home in reconciliation with himself. Instead, he simply sought a place where he could fully showcase his talents. Sensing the young man's true aspirations, Chen Bijun's nephew, Chen Chunpu, thoughtfully recommended Fang for the highly coveted position of mayor of Chongqing. In 1956, Fang Xianqi returned to a now-stabilized Chongqing.\n\nThe local officials in Chongqing collectively greeted this \"man from the central government\" with zero tolerance and zero trust. To break the ice, advance municipal development, and win public support, Fang leveraged his connections with former Wuhan mayor Zhang Renli to negotiate favorable shipping policies between Chongqing and Hubei. He also held private talks with Chongqing’s financial tycoon Pan Changyou, securing the latter’s backing by granting him the largest domestic supplier bid. In 1959, Fang facilitated a partnership between Guangdong Fujitsu and the city of Chongqing. His personal admiration played a significant role in this decision—having long respected the engineering background of Masaru Ibuka, he saw making Chongqing one of Fujitsu’s first major clients as an excellent choice.\n\nA decade after the smoke of war had dissipated, Fang Xianqi, like a kite severed from its string, gently entwined himself around the rootless giant tree that was Chongqing. Bulldozers rumbled as they toppled century-old village communes, making way for newly planned government roads. Under the night sky, Chongqing once again bustled with traffic, shining brilliantly."