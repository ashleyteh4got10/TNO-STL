l_english:
 Asia_National_Revolutionary_League: "Asian National Revolutionary League"
 econ_sphere_name_tab_CPC: "Asian Economic Cooperation Community"
 econ_sphere_name_long_CPC: "Asian Economic Cooperation Community"
 econ_sphere_name_CPC: "Asian Economic Cooperation Community"
 ANRL_Leader: "Leader of the Asian National Revolution"
 ANRL_Leader_effect: "[!ANRL_Leader]"
 ANRL_Leader_desc: "Over the past 30 years, the Communist Party of China (CPC) has chosen the path of revolution and has become the fountainhead of many revolutions in Asia, and has been honored with the well-deserved title of \"Leader of the Asian National Revolution\".\n\nThe independence and freedom of the Asian peoples were constantly threatened by the Japanese Empire, and the new nations that emerged from the fires of revolution needed to be united against the invasion of imperialism, which was imminent. In order to eradicate pan-Asian colonialism and for the eternal happiness of the Asian people, the Communist Party of China gathered the Communist Parties of various countries together in Vietnam and signed the Hanoi Agreement to establish the Asia National Revolutionary League(ANRL).\n\n§x\"All countries and peoples who have been invaded, controlled, interfered with, and bullied by the Japanese Empire, unite and defeat our common enemy!\"§!"
 ANRL_Core_member: "Full Member State of the ANRL"
 ANRL_Core_member_effect: "[!ANRL_Core_member]"
 ANRL_Core_member_desc: "Core state defence:§G+10%§!\nGDP Growth Rate Boost: §Y5%§!\n\nThe ANRL is committed to the independent development of Asian nations. Any independent country in Asia that is inclined towards socialism can apply for membership in the Union by submitting an application to the League, and after a period of investigation, it will be granted the status of a full member. Full members have full rights within the League and can participate in the highest level of decision-making, manage daily affairs and initiate or command joint military operations.\n\nIn order to distinguish them from members and leaders with less than full rights status, full members are sometimes referred to as independent members."
 ANRL_sub_member: "Limited Member State of the ANRL"
 ANRL_sub_member_effect: "[!ANRL_sub_member]"
 ANRL_sub_member_desc: "Core state defence:§G+10%§!\nGDP Growth Rate Boost: §Y5%§!\n\nDue to the inexperience of emerging countries in governance, and while respecting their national sovereignty, they would enter \"limited\" status by applying for regulation, after which an independent member State would be granted the right to mentor in order to externally mentor and assist the regulated State.\n\nThe duration of the application for supervision cannot be less than one year or more than five years, and the supervised status is automatically lifted at the end of the implementation period. The regulated State may also apply for discharge within one month of the commencement of implementation, and thereafter for more than one year of implementation. The duration of supervision proposed by the prospective member state cannot exceed its own assessment period.\n\nIn the event of a conflict between the regulated country and the guiding country during the supervision process, the regulated country can submit an appeal to the Supervisory Arbitration Conference, which will be adjudicated by the disinterested member state. In the Arbitration Conference, the regulated state has the same status as an independent member state."
 ANRL_observer: "Associate Member of the ANRL"
 ANRL_observer_effect: "[!ANRL_observer]"
 ANRL_observer_desc: "GDP Growth Rate Boost: §G+2.5%§!\n\nWhen an independent Asian country submits an application for membership in the Union, the full members of the League will collectively consider whether to accept it or not and when a majority of the members are in favor of the application, it will become an associate member and will enter a period of investigation. During this period, associate members do not enjoy the same rights and status as full members, but their actions are in most cases not subject to the League's control and they may enjoy preferential treatment in certain economic agreements.\n\nThe period of investigation is determined jointly by the full member States and the associate member States and may not exceed five years. At the end of the period of study, they are automatically admitted to the League and become full members."
 ANRL_puppet: "Special Administration of the ANRL"
 ANRL_puppet_effect: "[!ANRL_puppet]"
 ANRL_puppet_desc: "Core state defence:§G+10%§!\nGDP Growth Rate Boost: §Y10%§!\n\nSAA are not independent members of the ANRL but are local provisional bodies established by the member countries in their territories, which usually include one or several provinces and are named after geographical locations.\n\nIn a state of war or preparedness, the zone government enables the authorities to plan and rebuild effectively, maintain regional stability, and eliminate Japanese influence.\n\nThe member States have the right to communicate with each other for the purpose of the SAA, but the sovereignty of the Special Administration is ultimately vested in the authorities of the country in which it is established, and no other member State can interfere with it. SAAs are not independent members of the ANRL but are local provisional bodies established by the member countries in their territories, which usually include one or several provinces and are named after geographical locations."
 Kyoeiken_EAACP: "Co-Prosperity Sphere - East Asian Anti-Communist Agreement"
 Kyoeiken_EAACP_Leader: "East Asian Anti-Communist Agreement - Republic of China"
 Kyoeiken_EAACP_Leader_effect: "[!Kyoeiken_EAACP_Leader]"
 Kyoeiken_EAACP_Leader_desc: "In response to the rapidly changing situation in Asia, under the framework of the Co-Prosperity Sphere, the Republic of China (ROC), together with the four provincial governments of Yunnan-Guizhou-Guizhou-Shanxi, signed the East Asian Anti-Communist Agreement (EAACP) in Nanjing.\n\nThe CPC-KMT conflict, a dark thread running through China's modern history, was about to surface and set off huge waves. Fortunately, thanks to the generosity of Japan, the military power of the ROC is recovering rapidly, but time is still quite limited, and the Nationalist government in Nanjing must quickly regroup enough forces to counter the Communist forces in the west, or else §xthe Republic of China's sixty years of difficult national fortunes will be devoured by the fury of the Communists...§!"
 Kyoeiken_EAACP_CHI_warlord: "East Asian Anti-Communist Agreement - Chinese Warlord"
 Kyoeiken_EAACP_CHI_warlord_effect: "[!Kyoeiken_EAACP_CHI_warlord]"
 Kyoeiken_EAACP_CHI_warlord_desc: "In response to the rapidly changing situation in Asia, under the framework of the Co-Prosperity Sphere, the Republic of China (ROC), together with the four provincial governments of Yunnan-Guizhou-Guizhou-Shanxi, signed the East Asian Anti-Communist Agreement (EAACP) in Nanjing.\n\nUnless there was an extremely imminent external threat, it would have been harder than ever to get the warlords and the Nanjing government to screw together - but the CPC did it, and all the warlords who had cut off the autonomy of their provinces came to Nanjing in droves due to pressure from the west, and the signing of the EAACP allowed the Republic of China to once again be \" unification\" - although it was no doubt difficult for these warlords to take orders from others, compared to the raging §xCPC§! the face of the Nanjing KMT Central Committee immediately appeared §Gkind and benevolent§!."
 TNO_Cold_War_Victory_ID_501: "Third Sino-Japanese War"
 ANRL_federation_member: "ANRL - Federated Member"
 ANRL_federation_member_effect: "[!ANRL_federation_member]"
 ANRL_federation_member_desc: "Core Territory Defense: §G+10%§!\nGDP Growth Rate Increase: §Y5%§!\n\nWithin the ANRL, non-dominant member states of federal nations receive the same economic benefits as full members but do not hold full political rights.\n\nANRL members may send independent representatives to attend ANRL Assemblies and express their views, but decision-making authority on major issues and military command within the ANRL remains in the hands of their federal dominant member state."
 Sphere_special_administrative_region: "Yuan-Controlled Municipality of the Republic of China"
 Sphere_special_administrative_region_effect: "[!Sphere_special_administrative_region]"
 Sphere_special_administrative_region_desc: "A Yuan-Controlled Municipality is a province-level administrative division within the Republic of China, based on the Republic Year 38 (1949) \"Organic Law on Municipalities,\" which stipulates: Any particular economic or population threshold having been reached by a given city, it should be organized into a Directly-Governed Municipality; it is at the command and under the supervision of the Executive Yuan, and is subordinate entirely to central and higher-level government regulations.\n\nYuan-Controlled Municipalities were thus set up, distinguishing wealthy, populous, and developed cities from the peripheral areas that surrounded them. Nanjing thus strengthened its control and oversight, managing their bureaucracies with special attention paid to their defense and budget. The Yuan-Controlled Municipalities also represent central authority, and their respective provinces (particularly those they were carved out from) have an obligation to turn their local economies to the task of these cities' development. This low-level institutional reform was one of Wang Jingwei's first attempts, in his later years, to reverse the trend of local independence."
 Sphere_residence_of_governor_general_GGC: "Imperial Governor-General's Office §F\n\nAccording to £GNG_japanese_frustration_texticon §jThe Japan-Korea Annexation Treaty§! and its subsequent legal provisions, the defense of Korea is currently under the jurisdiction of the £GNG_japanese_frustration_texticon §jIJA 17th Area Army§!.§!"
 Sphere_residence_of_governor_general_GGC_effect: "[!Sphere_residence_of_governor_general_GGC]"
 Sphere_residence_of_governor_general_GGC_desc: "The Governor-General's Office (Sōtokufu) should be regarded as a domestic administrative unit of the Greater Japanese Empire, equivalent to the prefectures of the Home Islands, rather than as a nominally sovereign state within the Co-Prosperity Sphere. This colonial administrative system was established during the Taishō era. Although modern Japan prefers to achieve its colonial expansion goals through economic control and proxy wars, the Governor-General system has nevertheless persisted in certain strategic regions.\n\nAfter the signing of the Japan-Korea Annexation Treaty, Japan’s supervisory administration in Korea, the Residency-General (统监府), was reorganized into the Governor-General of Korea, which was placed directly under the authority of the Emperor. This marked the beginning of Japan’s uninterrupted colonial annexation of the Korean Peninsula—officially framed under the policy of \"Naeseon Ittai\" (Japan-Korea Unity)."
 Sphere_residence_of_governor_general_TWN: "Imperial Governor-General's Office §F\n\nAccording to £GNG_japanese_frustration_texticon §jThe Taiwan Army Headquarters Ordinance§! and its subsequent legal provisions, the defense of Taiwan is currently under the jurisdiction of the £GNG_japanese_frustration_texticon §jIJA 10th Area Army§!.§!"
 Sphere_residence_of_governor_general_TWN_effect: "[!Sphere_residence_of_governor_general_TWN]"
 Sphere_residence_of_governor_general_TWN_desc: "The Governor-General's Office (Sōtokufu) should be regarded as a domestic administrative unit of the Greater Japanese Empire, equivalent to the prefectures of the Home Islands, rather than as a nominally sovereign state within the Co-Prosperity Sphere. This colonial administrative system was established during the Taishō era. Although modern Japan prefers to achieve its colonial expansion goals through economic control and proxy wars, the Governor-General system has nevertheless persisted in certain strategic regions.\n\nAmong all of Japan's overseas colonies, Taiwan has the longest history under Japanese rule, making it the most deeply assimilated into the Empire. Seventy years under the Rising Sun, and now, the glorious moment of Taiwan’s complete annexation is within reach.Onlookers need not concern themselves too much with how the local Taiwanese population perceives this inevitable historical process. After all, in the face of the state machinery of the world’s great powers, the thoughts and sentiments of mere commoners are of little consequence."