 STATE_2413: "Hanzhong"
 state_lore_initials.385: "HNZ"
 state_lore_name.385: "Hanzhong"
 state_lore_desc.385: "Hanzhong lies in southern Shaanxi Province, positioned between Qin and Shu, with the towering Qinling Mountains to the north and the endless Bashan Mountains to the south. The Han River, flowing through the region, has formed vast fertile valleys, making it a land of abundance since ancient times. Known as “Tianhan” (Heavenly Han), Hanzhong has long been regarded as a strategic and prosperous land.\n\nAs early as the Warring States period, the State of Chu established a county administration here, naming it Hanzhong. During the Chu-Han Contention at the fall of the Qin Dynasty, Liu Bang captured Xianyang, forcing Qin’s King Ziying to surrender in person. Fearing Liu Bang’s growing power, Xiang Yu exiled him to Hanzhong, far from the Guanzhong heartland. Liu Bang, though initially outraged, followed the advice of Xiao He, biding his time and strengthening his foothold in Hanzhong. With the legendary strategy of \"Openly repairing the plank roads, while secretly crossing Chencang,\" he launched a surprise offensive, conquered the Three Qins, and within five years, forced Xiang Yu to his final defeat at the Wu River, unifying China.\n\nDuring the War of Resistance Against Japan, the shifting military situation once again made Hanzhong a crucial rear stronghold. The Nationalist government established the Hanzhong Field Headquarters, reinforcing Northwest defenses and securing Chongqing, the wartime capital. The influx of military institutions led to a population surge, and under the framework of national defense, industrial and urban expansion accelerated.\n\nFollowing the Communist takeover of Shaanxi, Hanzhong’s strategic role was further solidified. The Xi'an-Baoji Railway became a lifeline, ensuring a steady flow of supplies westward into Xikang, enabling Liu Wenhui’s forces and the PLA's Southwest Corps to hold their ground in the rugged Hengduan Mountains.\n\nNow, as the grand political landscape shifts once more, Hanzhong has become the final defensive stronghold of the Northwest National Defense Front. In the foreseeable future, it is poised to shine once again in history as the second center of China’s liberation struggle."
 state_lore_name.376: "Wanzhou"
 state_lore_desc.376: "As the Imperial Japanese Army closed in on Chongqing, the last stronghold of Chiang Kai-shek’s Nationalist government, the city of Wanzhou stood as the northern shield, halting the invaders’ advance toward the wartime capital.\n\nThe bloody Battle of Wanzhou raged for seven full days and nights. Nearly every able-bodied man and woman took up arms, joining the Nationalist forces in a desperate struggle to halt the enemy’s assault on Chongqing.\n\nTens of thousands perished in the fierce fighting. Blood ran like rivers through the streets of Wanzhou.\n\nYet, in the end, the defenders received only a single radio message—an order to surrender.\n\nIt was betrayal.\n\nThose who survived the battle have never forgotten that betrayal.\n\nThe people of Wanzhou despise the treacherous collaborators who groveled before their Japanese masters, but they resent even more the bastards who wasted their blood in vain—Chiang Kai-shek, the Nationalists, and all their lingering remnants.\n\nFor them, China must be liberated—but that liberation will never belong to the Blue Sky and White Sun."
 state_lore_name.382: "Xining"
 state_lore_desc.382: "For over two thousand years, Xining has stood as a vital trade hub on the edge of the Hexi Corridor and a formidable fortress against foreign invaders—once against nomadic tribes of the past, and now against rebels of the present.\n\nLandmarks such as the sacred Kumbum Monastery of Tsongkhapa and the Dongguan Grand Mosque give Xining profound significance to many non-Han ethnic communities in the surrounding regions.\n\nSince 1928, when Qinghai was officially carved out from Gansu, Xining’s unique geographical position solidified its role as the provincial capital, as well as a key stronghold for the Ma clique warlords.\n\nBy 1949, with the formation of the Western Anti-Japanese United Front, Xining emerged as a self-governing jewel within the Northwest National Defense Front.\n\nUnlike the bustling metropolises of Lanzhou and Xi’an, Xining is neither a city of flashing lights nor a crossroads of endless crowds.\n\nYet, in its quiet resilience, it draws in those seeking both security and freedom, standing as a symbol of unwavering strength in the vast and rugged west."
 state_lore_name.412: "Zhanjiang"
 state_lore_desc.412: "Zhanjiang, once known as Guangzhou Bay, was a quiet fishing village until France recognized its strategic value, controlling access to the Leizhou Peninsula. Seeing its potential, the French leased it as a free port, renaming it Fort-Bayard—their only colony in China.\n\nDuring the War of Resistance, Guangzhou Bay became one of the few safe harbors protected by foreign powers, attracting waves of refugees and briefly flourishing as a result. However, when the French government surrendered to Japan, the refugee tide quickly receded, and its prosperity vanished just as fast.\n\nUnder the Guangdong Agreement, Zhanjiang and Hainan officially fell under Nanjing’s jurisdiction. Yet, the city was nothing more than an isolated outpost, far beyond Nanjing’s reach.\n\nSoon, Zhanjiang became a hotbed of dissent and rebellion, and during the crisis of 1950, the warlords of the Southwest seized the opportunity. Under the guise of \"pacification,\" they expelled Nanjing’s appointed officials and took control of the city.\n\nSince then, Zhanjiang has remained firmly in warlord hands.\n\nAs the only major port in the Southwest, Zhanjiang has benefited from economic prosperity, drawing in desperately needed resources and investment.\n\nThere is no doubt—Zhanjiang is a pillar of the Southwest’s autonomy, and its influence will only continue to grow, even if certain external powers may resent its rise."
 state_lore_name.413: "Haikou"
 state_lore_desc.413: "Haikou's history dates back to the Song Dynasty, long serving as the gateway to China’s southernmost province and a strategic stronghold guarding access to the South China Sea.\n\nDue to its critical location, Hainan has long drawn the attention of imperialist powers. Yet, by a stroke of fortune, the infighting among foreign empires prevented the island from falling under colonial rule—until the Empire of Japan seized it, plunging the region into an era of unprecedented darkness and bloodshed.\n\nAfter the Southern China Crisis and the signing of the Guangdong Agreement, Japan’s Imperial Navy was forced to transfer control of Hainan to the Nationalist government, given the precarious situation unfolding within China.\n\nNow, with Guangdong province largely under the sway of Japanese forces and local warlords, Hainan remains the last bastion of Nanjing’s authority in the south.\n\nIn a bid to win over the people of Guangdong, Nanjing has allowed Hainan to function as a \"Special Administrative Region,\" granting it limited self-governance.\n\nToday, Haikou serves as the capital of Hainan SAR and is one of the busiest transit ports in the Republic of China.\n\nYet, beneath its prosperity, the silent masses remain.\n\nThey have never forgotten the scars left by imperialist rule, nor have they forgiven the traitors who not only turned a blind eye to tyranny—but betrayed their own country in its darkest hour."
 state_lore_name.380: "Wuwei"
 state_lore_desc.380: "Wuwei, an ancient city, with its thousand-year history, has witnessed countless triumphs and upheavals.\n\nIn the past, when it was still known as Liangzhou, it served as a key stronghold against the Xiongnu and a crucial hub along the Silk Road.\n\nTime has passed, yet the Han Dynasty’s Flying Horse and the Western Xia royal tombs still stand, whispering tales of a city once bathed in the splendor of the Tang Dynasty.\n\nAfter the liberation of the Northwest, Wuwei—east of Lanzhou, south of Xining, north of Yinchuan and Inner Mongolia, and westward to Xinjiang—became a vital transportation hub for the entire region.\n\nWith the mass migration of settlers from Shaanxi Province, the city is slowly reclaiming the prosperity it once enjoyed in the golden age of the Silk Road."
 JAP_showa_emperor_ter: "Emperor Showa"
 JAP_showa_emperor_ter_desc: "Emperor Shōwa, known by his given name Hirohito, was molded into a symbol of imperial continuity, military fortune, national stability, and social progress.\n\nYet, from the moment he ascended the throne, he showed little interest in political affairs—perhaps because he had already resigned himself to the irreversible crimes of the Empire.\n\nAs the Japanese retreat and defeat on the East Asian continent led to the collapse of the cabinet and the shaking foundations of the Co-Prosperity Sphere, the spoils of past victories—once built upon military triumphs—were now torn apart by the vengeful spirits of the fallen.\n\nTo preserve the Empire, Emperor Hirohito reluctantly seized the power and responsibility he had spent a lifetime avoiding, taking control from the failed Imperial Rule Assistance Association. In his own name, he sought to unite a crumbling empire once more.\n\nBut can he truly succeed?\n\n§R\"The Red Calamity surges like a flood, drowning all of Asia—how can I, the Emperor, ensure the survival of the Divine Land and honor the spirits of my ancestors?\"§!\n\n(The \"Red Calamity\" refers to the wave of communist uprisings.)"
 WORLD_CAM.8.d: "As the final echo of Japan’s campaign to crush communist uprisings across East Asia, the Empire has enacted its ultimate solution for Indochina—launching a full-scale offensive against the communist regimes of Vietnam, Cambodia, and Burma, under the pretense of \"liberating the people from communist oppression.\"\n\nThe three nations, remnants of the defunct Asian Revolutionary Alliance, have issued a joint declaration, condemning Japan’s imperialist aggression and vowing never to surrender in their struggle for freedom.\n\nYet, whether the Indochinese nations wish to surrender or not may no longer matter.\n\nThey stand on the brink of being overwhelmed by a superpower’s crushing force, and with no path of retreat, they face one final choice—returning to underground resistance may be an option, but Japan is certain to escalate its crackdown across Indochina, tightening its iron grip to eradicate communism once and for all.\n\nAs it stands, the days of freedom for the people of Indochina are now numbered."