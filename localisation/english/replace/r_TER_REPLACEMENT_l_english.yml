l_english:
 JAP_CountryInfo_Content_desc.4: "Despite the heroic efforts of the §Q\"United Nations\"§! in Asia - the Chinese states, Britain and its Empire and America - they could not hope to match the war machine inside the Home Islands. Despite resounding reverses by the American Navy and the Anglo-Chinese forces drawing the overextended IJA forces to bloody stalemate, it was all for naught. The unexpected death of §QChiang Kai-shek§! left the Chongqing regime with no will to resist, and it eventually bowed to the Empire; §CMao Zedong§! led the §CCPC§! and the remnants of the resistance in the northwest.\n\nAmerica was the last to kneel to the combined forces of the Axis. Despite the two navies dealing crushing blow for blow, America was isolated. Yet, the worst was to come. On one sunny morning over Pearl Harbour, a singular bomb was dropped on Hawaii that would gouge a deep scar across the face of humanity. §VForever§!."
 GNG_Product_Cycle_Market.76.desc: "It had started so well.\n\nNanjing, Beiping, and Shanghai had been interlinked and computerized almost as straightforwardly as it would have been in the Home Islands. Ningbo and Fuzhou had presented some difficulties, but they could be covered with the enhanced budget granted after the Port of Shanghai almost doubled its daily loading capacity in a matter of months.\n\nBut Taiyuan and Guilin had dashed those hopes to pieces. Apparently the damned barbarian warlords refused to understand that all they had to do was cooperate with the Centre, and it would help them reap more in taxes. Even if they cooperated, the question remained of how even to maintain the accounts - some parts of the country still used bookkeeping systems from the Qing era, whilst others simply adopted the Japanese method wholesale. In Yunnan, the question devolved even further to who was even in charge of the cities and towns - Taiyuan and Xi'an said one thing, Kunming said another, and meanwhile someone had already stolen the cables, wires, and computers.\n\nIbuka Masaru pressed his eyes shut, and once again reduced the problem to numbers, limits, and constraints. Focusing on inner China obsessively would be a total loss - but some advantages had been reaped. At considerable expense, Fujitsu had essentially become a key component of the government's administration - something that would certainly help in negotiations back at the Three Pearls. And one could always interpret this as an investment that could lead to more in the future. An investment..."
 guangdong_commonRiots.203.desc: "\"Consul-General, you of all people should understand the mess I'm in! I've got a country that wants to kill itself, a few cities on fire, a legislature that hates me - forgive me that I can't work miracles, but I'm doing the best I can, yes?\"\n\n\"It's not good enough. Not even close.\" [GNG.GetLeader] crumpled in his seat, looking out at the hazy sunset falling over the skyscrapers. The smoke in the air scattered the light, turning it into vibrant hues of flickering reds and oranges, a neon sendoff to a neon city. \"Tokyo is now so anxious; the situation in China is changing dramatically, there are wars and riots everywhere, the KMT and CPC armies are fighting fiercely, from Shanxi to Wuhan, from Guizhou to Kunming, and the flames of war may soon reach Guangdong. Those grown-ups in Tokyo are itching to send troops to protect Guangdong, Chief Executive, and I can't blame them.\" The tinny sound of exhaled smoke pierced the pause in words. \"Do you have a plan?\"\n\n\"Of course, I have a plan.\" Of course he did. Even if it wasn't going as he'd hoped, even if it was slow to progress, even if it wasn't working as he thought - wasn't working at all, he had a plan. The very thought of someone thinking he didn't have a plan made him scowl in frustration. \"Takashima-\"\n\n\"Consul-General, please.\"\n\n\"No, Takashima. Listen to me. We've been speaking for years, yes? You know what I have had to deal with in running this city. You know, damn it, with Nagano and the Chinese and everyone else breathing down my neck for the last decade, keeping anything under control here is difficult. Now it's taking longer than I thought it would, I know that, but tell them that whatever they do, sending the IJA in is - they might as well nuke the Pearl River. Keep them away from that.\"\n\nA long pause. Finally, Takashima's weary voice crackled again. \"I've told them that you have things under control. Please, please, please make sure that that's the case sooner rather than later.\""
 guangdong_sonyOC.14.desc: "\"It's too late to talk about avoiding layoffs. Our district just had two hundred people made redundant.\"\n\nChun surveyed the drawn, exhausted faces of the Guangdong Federation of Tradesmen's executive council, an inescapable gloom pushing them all deeper into their seats. They were working ceaselessly to keep the independent Zhujin afloat. But where was the Chief Executive? The pressure from Matsushita, Fujitsu, and Hitachi was relentless - and neither Sony, nor Cheung Kong, his own employer, seemed able to stop them.\n\nTo say they were disappointed would be inaccurate, Chun thought. They all felt foolish to have trusted Morita in the first place.\n\n- - -\n\n\"Officer Hayashi!\" Yoshiko called out in Japanese, waving Lam over to her table in the crowded bar, before switching to Cantonese. \"Can I get you anything? I hear you're on double shifts.\"\n\n\"Beer sounds nice,\" Lam grunted, hardly bothering with formality with her. \"Everyone's stretched thin. Nobody wants a repeat of Yasuda -\"\n\n\"That's exactly what's happening though, isn't it?\" Yoshiko handed Lam his beer, her fingertips slightly blue from the chill. \"Jobless people crowding the alleys, protestors in the streets.\"\n\n\"It might be worse.\" Lam nearly drained his glass before turning towards Yoshiko. \"We're seeing new graffiti. Something about a Chinese 'committee' for change - a group we're never heard of. And we keep seeing more and more of it. People aren't just desperate, Yasukawa - they're angry. And ever since the Nanjing government fell into civil unrest- \""
 chi.1.d: "The history of China is a complex one. Perhaps the most ancient civilization known to man, China has both dominated and been held under the boot. As the moon waxes and wanes, so does China, and currently the nation has suffered under decades of embarrassment, the so-called century of humiliation. But as rebels seized Nanjing and the Qing Dynasty came to its end, hope abounded. Hope for a new republican state where the Han controlled China. Hope for a true, lasting peace, where warlords no longer threatened the sanctity of life and every man was free.\n\nThe liberties and vices of the Roaring 20's came to a sudden stop with a coordinated Japanese invasion. The twin stars of the Chinese Revolution, the Kuomintang, and the Communist Party, chose to join forces in the face of the Japanese invasion, but with the withdrawal of the United States from the Asian theater of war and the strange death of Chiang Kai-shek, the faltering Chongqing government fell into the hands of Li Zongren, and the regime ultimately collapsed, leaving the CPC to lead the remnants of a united front that continued to struggle in the northwestern part of the country.\n\nThe remnants of the old party fell or retreated, but the wheell of history continued to turn. Former KMT loyalist turned Japanese collaborator Wang Jingwei began negotiations with the Japanese, but found out that they had no other intentions but to make China a colony. Japan swiftly dismantled the old government and created a new Chinese Republic in its place, one that would be more open to \"cooperation\". Wang Jingwei resigned to his fate and died, knowing that he had betrayed his country and ushered in another era of humiliation.\n\nThe majority of China still begrudgingly supports the Japanese regime. Even if they weren't granted national self-determination, the Japanese have kept China from falling back into the anarchy of two decades prior. While warlords still run rampant on the peripheries, many trust in the status quo for continued stability, and some even profit. Old KMT members who defected now enjoy cushy sinecures and positions of power, regardless of merit...\n\nChina remains shackled to the Japanese yoke in countless ways. The Japanese make no attempt to hide the massive sway they hold over every aspect of China. The Chinese military is deeply connected to the IJA, armed with nothing but rifles dating back to the last war, seeing little action but counter-insurgency operations. The Japanese government has slowly lifted the harshest restrictions, but they still leech on our resources and our people. Much of the government's funds that were hoped to be used to industrialize and improve welfare have been slashed for Japanese projects - as a result, China remains a largely deindustrialized and pitiful colony. Additionally, Guangdong and Manchuria, two of the most developed regions of China, remain tightly in the grip of the Japanese, despite the sheer amount of wealth it could bring to the Chinese government. Its currency is also pegged to the Japanese Yen, with Chinese banks and companies controlled by Japan."
 chi.5.d: "The fall of Chongqing ended the Republic of China, and brought about extreme restrictions on China's military, backed by Japanese power. These restrictions have not yet been lifted, yet the Japanese have seen fit to gradually pull out of China, leaving our poorly trained, poorly equipped garrisons to handle the many insurgencies - as well as the Chinese Communist threat from the Northwest.\n\nTimes have changed since the fall of the late great Republic however, and our state can no longer sustain these irrational restrictions. Gao Zongwu now sees fit to produce a \"Secret Army\", one of which will be disguised as a 'Special Police Force' and will never officially exist in our reorganized republic, yet one which will serve our state nonetheless. President Gao himself will be the one and only head directly in charge of this 'Police Force'. Every connection our President has made will be put into developing this secret force, so, that one day, their knowledge and power may guide us to the final liberation, and help us free every son and daughter of our homeland."
 chi.6.d: "Modernization, the great project of modern China, is a risky one. The Japanese will try to undermine our every move once they realize our ambitions, especially the ambitions that require more autonomy for the legitimate Chinese state, which is not to mention Gao Zongwu's Secret Army, the creation of which can never be known by the foreign imperialists, lest our efforts become undone by the Imperial Army.\n\nThankfully, the odds are not entirely stacked up against us. The outbreak of the Cold War and efforts made by previous Chinese officials have forced the Japanese to retreat all army units from our territory and reduce their forces by nearly half. However, some government bureaus in China remain dominated by Japanese officials, and these bureaus may, sooner or later, sniff out our plans.\n\nTo prevent such from happening, Gao Zongwu shall utilise the newly founded NSB to hide our plans for the rise of China. Only a select few officials will know of our dream for a modern China and the creation of our Secret Army, lest the hand around our throat finally clamps shut."
 chi.477.d: "We arranged a meeting with the elder of a small village, a veteran. Even when he was about to welcome a familiar face, he still put on the tattered uniform. This is his home, and he wants it to stay that way.\n\nNanjing Crisis? Don't mention this to me. Gao Zongwu, the Japanese sycophant, allowed them to take whatever they asked for, and gave even more. At least he did make them leave. Before the Japanese came to take over, you must know that our place was just a peaceful little village. Mao and his cadres came, but they didn't force us to do much. As long as we didn't cause trouble, the Communists wouldn't suddenly arrest us. But strangely, I later became really interested in communism. I think radical changes are needed to bring an end to this era. Maybe in another world, our aims can be successful. But in our world, there was no drastic change, yet the Japanese invasion came all the same. In short, I joined the army, joined the United Front, and tried my best to deal with the Japanese and the puppet troops who collaborated with the enemy. But now, it seems that we are the traitors, collaborating with the enemy and betraying our country. \n\nHe smiled grimly at this.\n\nI thought there wouldn't be much change. Isn't it impossible for the zaibatsus to exploit every village in the mountains? Well, do it they did. Our town used to be a quiet farming town, but now it has become a coal town. People from all over the Co-Prosperity Sphere come here. Gao Zongwu drove them away eventually, but the scars remained. The mines are still being mined; I suspect they will continue to be mined forever. At the end of it, all the foreign miners have left, and the spirit of our village has still remained."
 CHI_small_army_TER_1: "Rehabilitated Military"
 CHI_small_army_TER_1_desc: "The growing threat of the Chinese Communists was finally recognised by our Japanese suzerain, after they brazenly marched out to invade Chengdu and Chongqing, and we are now partially allowed to get on with the task of reorganising our internal defences - thanks to Japan's influx of troops, our army's fighting strength is gradually being restored."
 CHI_small_army_TER_2: "Setting the Tiger Free"
 CHI_small_army_TER_2_desc: "Thanks to the increasingly severe Red Asia Crisis and the threat of the Chinese Communist Party, Japan finally allowed the National Army to rearm. Even though army integration is still under strict Japanese surveillance, we nonetheless took a big step forward in national defence autonomy."
 CHI_small_army_TER_tt: "Now the §mRepublic of China's Army§! can be trained and recruit new units."
 WORLD.16605.desc: "The Oil Crisis continues to destabilise global society, and East Asia has fallen victim to civil war. The latest blow is to the stability of the corporatocratic State of Guangdong in southern China.\n\nIn the aftermath of massive economic turmoil brought about as part of a global descent into chaos, the anger that has long built up in its ethnically segregated society has finally exploded into violent anti-Japanese, anti-corporation protests. Martial law has been declared, though so far it has not prevented a near-total breakdown of order in many cities.\n\nThe Chief Executive has released a communiqué indicating his intent to maintain order. It is not clear how successful—if at all—he will be."
 chi.471.t:0 "Wuhan Arsenal"
 chi.471.d:0 "He is a middle-aged worker, his palms deeply ingrained with the marks of gunpowder.\n\nA blacksmith by trade, he swung his hammer, forging weapons that bore witness to countless storms of blood and fire.\n\n\"I used to work at an arsenal—it even made the newspapers. And let me tell you, that wasn’t just any ordinary place.\"\n\n\"The Japanese owner who ran the factory kept Chinese workers as slave labor. I don’t know how many, but one of my good friends and another colleague never got paid a single cent. Every night, they slept on straw mats in an old building outside the factory. Me? I was lucky enough to be considered a proper worker—I could still go home to my family at night. They weren’t so fortunate.\"\n\n\"There’s one day from my time at the Wuhan Arsenal that I’ll never forget.\"\n\n\"That morning, a lot of my coworkers didn’t show up—later, I found out they were all slave laborers. But one man did. He walked in grinning from ear to ear, like he was about to retire the next day. Then, he stepped into the Japanese owner’s office—and BOOM! The whole place exploded.\"\n\n\"He must’ve stolen a grenade from the factory. Damn shame the Japanese boss survived.\"\n\n\"After that, he cracked down even harder on the slaves, worked them to the bone for years, until they wasted away to nothing. I was too damn naive back then—I thought they were just on a diet. Diet, my ass! How many people died in that factory?\"\n\n\"You probably hear stories like this all the time in your interviews, but I still have to say it—the government was too damn weak.\"\n\n\"In the end, they didn’t even arrest that Japanese bastard—they just kicked him out of China. The families of the dead? The compensation they got was barely enough to buy a decent coffin.\"\n\n\"Deep inside the ruins of Wuhan Arsenal, his body is still buried in the ashes.\""
 chi.479.d:0 "He was wiping down his motorized bicycle, preparing to head back into downtown Nanjing, when we found him.He turned to greet us, revealing a deep scar across his forehead.He agreed to the interview, but only under anonymity.\n\n\"Everything changed after the crisis. Maybe it’s just me, but honestly, we haven’t managed to set a damn thing right since.\"\n\"When this whole mess started, I got mixed up with a political gang—a bunch of young guys and a few older ones. Politically speaking, we were pretty left-leaning. But after one of our guys got hanged for painting anti-Japanese graffiti, we just fell apart. It was a dirty, rotten thing to do.\"\n\"Sometimes, I feel like all their political talk was just a cover for running dope. But back then? Back then, I thought I was somebody. Hell, I even almost got shot once when I ran from the cops.\"\n\"Now, I’m back on the straight and narrow, but some things just don’t come back. The past? Maybe I still feel a little bit of it sometimes. That feeling… that…\"\n\n(Writer’s Note: Halfway through our conversation, he started picking up his pace, walking away. After telling us to fuck off, we let him go.)"
 speerphase3.13.desc: "Report on the State of Japan\nMinistry of Foreign Affairs\n\nThe Empire of Japan is beginning to fracture. Since the revolutionary storms of the 1960s, the Greater East Asia Co-Prosperity Sphere has shown clear signs of decline.\n\nWith the outbreak of the Third Sino-Japanese War, an unprecedented China is rising anew, presenting Japan with challenges unlike any before. Our analysis indicates that this Red China will become the greatest adversary to Japan’s vision of an Asian order, signaling that the internal and external stability of the Co-Prosperity Sphere is now in collapse.\n\nWe recommend strengthening diplomatic and trade relations with the Free Nations Bloc—especially with the United States. Compared to Japan, the political environment in the U.S. remains stable, its economy is vast and still growing, and leveraging this relationship can serve to expand our national interests. The U.S. also possesses a surplus of raw materials and manufactured goods, which we could secure for our benefit.\n\nAdditionally, China remains a nation with vast untapped manpower and significant industrial potential, presenting broad economic opportunities. However, the ideological stance of Red China bears striking similarities to the Bolshevism we once faced.\n\nAt this stage, we do not recommend establishing diplomatic relations with China.\n\nFor a detailed analysis of Sino-Japanese relations, refer to pages 1 to 15.\n\nEnd of page."
 speerphase3.13.a: "It seems that the downfall of Pan-Asianism is now within sight."
 jap_oil.2.d: "\"General, we've received a report from the 38th Army. Another attack has occurred along the Guangxi border—this time, it was the Viet Cong. The headquarters of the 103rd Division states that this assault is clearly a probing offensive launched by the Asian Revolutionary Alliance in Southeast Asia. They are requesting reinforcements from command.\"\n\nThe general waved his hand dismissively, letting the report fall back into the towering stack of urgent dispatches piling up on the desk of the Southeast Area Army Command.\n\nWith China engulfed in civil war and Guangdong completely cut off from communications, now even Indonesia seemed at risk of slipping from Japan’s grasp. The Imperial Army faced problems on all fronts.\n\nOil supplies were running dangerously low, and redeploying reinforcements from across Asia was no simple task.\n\nFor a long while, the general’s adjutant sat anxiously, waiting in silence. Then, at last, the general issued his orders.\n\n\"Transfer Borneo’s oil reserves to Fangchenggang immediately. Then commence an airstrike. If the fuel isn’t enough, siphon whatever we need from the Navy. If it still isn’t enough, start draining the fuel tanks from trucks and civilian vehicles. The bombing must begin within two hours.\"\n\n\"Also, deploy the 21st Independent Mixed Brigade to Guangxi to compensate for our frontline losses. The brigade was only recently reorganized, but I trust in the spirit of the Imperial Army’s soldiers. Once the oil reserves arrive, we will crush these damn communists and drive the Viet Cong back into the jungle.\"\n\nThe adjutant hesitated, his face uneasy.\n\n\"But sir, what about our frontline troops? Won't they be caught in the blasts?\"\n\nThe general’s expression remained cold.\n\n\"They must learn to adapt. From this moment on, all uprisings must be crushed with absolute severity. No exceptions.\""
 jap_oil.2.a: "They will get used to the smell of burning bodies."
