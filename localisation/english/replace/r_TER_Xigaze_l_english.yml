 TIB_AZH_1950_border_memorandum: "1950 Tibet-India Border Memorandum"
 TIB_AZH_1950_border_memorandum_tt: "The memorandum stipulates that the §RMcMahon Line§! is not in effect, but the §GKashag government asserts§! it remains in place."
 TIB_AZH_1950_border_memorandum_desc: "The Tibet-India boundary dispute has an ancient origin, though it can be traced to the British Raj when their diplomats delineated the \"McMahon Line\" - but evidently, whether the Tibetan Kashag or the Republic of China to its east, they never truly considered this boundary to be legitimate.\n\nAs the United Kingdom's imposition seemed unreliable, all parties involved could hardly avoid brandishing swords and rifles once more to assert their claims in this dispute. At the time, India was independent and still undivided, overflowing with might and potential; they sent five thousand elite troops to seize and garrison Arunachal Pradesh. The Republic of China, however, had only just finished §Rbeing battered by the elements in its south and northwest§!. They had to assemble the remnants of the National Revolutionary Army; the Tibetan forces, dissolute and facing a language barrier, were stationed to garrison the fiery Indian assault. These militaries seemed diametrically opposed in strength, and it seemed as if this border conflict would end in a great victory for India-\n\nBut alas, the struggle was not yet over, and the goddess of victory had not shown her face to India after all. Planning to appease the Republic of China and win over the Kashag while expanding the Sphere's influence inland, Japan chose to ensure the signing of the Yangoon Memorandum by inviting representatives from Nanjing, Lhasa, and New Delhi to sign this resolution on the border. \n\nNaturally, this was the source of great Chinese gratitude towards Japan; the Fifth Reting Rinpoche, who went to sign in person, twirled his prayer beads as he wrote his signature and repeatedly expressed his appreciation to the Japanese representatives. This prompted some hidden discontent amongst the temples of Tibet; if these worldly affairs polluted his karma, disrupting his serene contemplation, what would come of it? "
 AZH_TIB_1950_border_memorandum: "1950 Tibet-India Border Memorandum"
 AZH_TIB_1950_border_memorandum_tt: "The memorandum stipulates that the §RMcMahon Line§! is not in effect, but the §Gcustomary boundary§! remains in place."
 AZH_TIB_1950_border_memorandum_desc: "The Yangoon memorandum shamed all of India, with the Afghanistan War and the country's division into two weakening her further. This once-mighty country, a great elephant that once towered over the subcontinent of South Asia, now leans on the roof of the world to prop itself up; as their countrymen bare their daggers across the cease-fire line, New Delhi and Calcutta have already exhausted their energy, causing them to put any boundary disputes with their northern neighbor to one side momentarily. \n\nBut while Indian representatives abandoned their plans to recapture Arunachal Pradesh, perhaps if the timing was right, they could gesture to their §Rmost loyal servants§! to seize the moment and rise in revolt."