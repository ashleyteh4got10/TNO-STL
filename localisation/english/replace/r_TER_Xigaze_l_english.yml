 XGZ_Qogyi_Gyacan: "Choekyi Gyaltsen"
 Qogyi_Gyacan_DESC: "Choekyi Gyaltsen was born in a poor peasant family in Wendu Township, Zunhua County, Qinghai Province, under the common name of Gombo Tsetan, and his fate changed at a young age with the passing of the Ninth Panchen. In 1944, a year when the Chongqing government was in the Central Plains, and the soldiers were falling like mountains, the seven-year-old Kumbum Tsetan was recognized as the reincarnation of the previous living Buddha by the divination and séance guidance of the Rikaze Khenpo Conference Hall. A group of monks wearing purple and gold robes took him from his home to the Tal Monastery to be ordained and given the Dharma name \"Choekyi Gyaltsen\".\n\nThe Tibetan Kashag government has always maintained an uneasy relationship with the Nationalist government. Within the Kashag there is political and religious strife between the two major living Buddha lineages. Especially since the fall of the Republic of China, the Panchen in Shigatse has been subjected to the influence of the Dalai Lama from Lhasa. Therefore, the Panchen lineage has always been in close contact with the Chinese rulers to gain foreign support for their position in Tibet. This became an important reason why the Kashag government expelled the 9th Panchen.\n\nAfter Choekyi Gyaltsen succeeded him as the Living Buddha, it became clear that he still had not escaped the predicament in which the Ninth Panchen had found himself. Although he could cope with the unwarranted questioning from Lhasa by concentrating on his scriptures and reining in his political aspirations, the changing world beyond the Tibetan plateau made it increasingly difficult for Choekyi Gyaltsen to stand alone. But the changing world beyond the Tibetan plateau made it increasingly difficult for Choekyi Gyaltsen to stand alone. An overwhelming torrent was coming toward him."
 XGZ_now_is_ours: "We will §munite§! with §YPanchen Choekyi Gyaltsen§!, who has been secretly transferred to §YChamdo§!, to prepare for the §Gliberation of Tibet§!."
