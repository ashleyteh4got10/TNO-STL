 CHI_conservatism_party_long: "Kuomintang - Lushan Faction"
 CHI_state_of_emergency_against_the_Communist_Rebellion: "State of Emergency Mobilization against Rebellion"
 CHI_state_of_emergency_against_the_Communist_Rebellion_tt: "§RThen-President Gao Zongwu released a presidential order, declaring a general mobilization over the ensuing days to suppress rebellion, with special priority to the suppression of communist bandits!§!"
 CHI_state_of_emergency_against_the_Communist_Rebellion_desc: "The war is imminent, and the soldiers on the western border have long been ready to respond. We must devote the entire nation to fighting the Red Bandits. Though we are not unprepared, our defences are crumbling under the onslaught, and thousands of people are fleeing in panic, flocking to the coast just to get away from the bloody battlefield. This is a time of crisis, and you need to work harder! President Gao has declared a period of counter-insurgency mobilisation, and we will use all our strength to eliminate the communists!"
 CHI_national_mobilisation: "National Mobilization"
 CHI_national_mobilisation_desc: "In order to be more effective against the communists, the whole country must be mobilised. We have to make sure that the army has enough men to defeat the communists in the west; we have to make sure that the back factories can produce enough weapons to support the soldiers on the front line; and we have to make sure that all obstacles to victory will be eliminated. With these issues resolved and out of the way, our regime will have no more enemies."
 CHI_total_martial_law: "Total Martial Law"
 CHI_total_martial_law_desc: "The front is in chaos, and the rear cannot be more chaotic. President Gao has issued a general martial law decree for the Republic of China, which will be administered by the Martial Law Command in divisions throughout the country. We must strike hard at all those who disturb the peace and thoroughly stabilise the people in the rear."
 CHI_all_out_attack: "Total Advance"
 CHI_all_out_attack_desc: "The time has finally come to test the results of these years we've spent. Trained soldiers, experienced officers, efficient command, united warlords. President Gao has only one order, \"March towards the fallen areas and free the people there\", and victory will be ours!"
 CHI_Execution_of_communist_spies: "No Red Spies Left Behind"
 CHI_Execution_of_communist_spies_desc: "We've stabilised the rear, but it's not enough. The bandits and spies in the shadows are still plotting revolution, and we must dig them out. If we don't take direct and decisive action, our country will be in deep water."
 CHI_NSA_site_overloaded_operation: "National Security Agency's Overload Operation"
 CHI_NSA_site_overloaded_operation_desc: "Spies are operating everywhere in the country, but there's no reason we can't do the same. There is no need to hold back at the last moment. All the regional action squads of the National Security Agency in the bandit areas have officially launched operations non-stop. We must attack the communist bandits with the greatest intensity possible."
 CHI_Communist_atrocities: "Communist Atrocities"
 CHI_Communist_atrocities_desc: "The rumours that have been circulating for 30 to 40 years about communist wives and child-eating redheads no longer have any deterrent effect on the public. Only by launching a new propaganda campaign to inform the public of the atrocities committed by the communists in Sichuan and Qinghai, where they looted people's property and \"owned it by the communists\", can we truly deter the public and arouse their indignation in defence of the country."
 CHI_Southwest_experience: "The Southwest's Experience"
 CHI_Southwest_experience_desc: "The Southwest has always been a place of turmoil, whether it was the great banditry campaign that spanned the 1950s and 1960s or the Guangxi rebellion a few years ago, and because of that we have accumulated a wealth of combat experience. What we need to do now is to pass on the south-west experience to the whole army, so that they can become experts in resisting the communists."
 CHI_Solidarity_for_victory: "Faithful Solidarity Brings Victory"
 CHI_Solidarity_for_victory_desc: "It is now a critical time in the war, and everyone must do their part if they have a part to play. The secret agents will be incorporated into the army, the President and Premier will go to the front, and the whole country must be united; only then will we be able to fight for victory."
 CHI_share_the_same_hatred_Promoting_national_unity: "United Anger Against a Common Enemy"
 CHI_share_the_same_hatred_Promoting_national_unity_desc: "China and Japan have enjoyed deep friendship since ancient times, and the interests of the two countries are the same; we have only one enemy, the Communist Party of China. By carrying out extensive Sino-Japanese co-operation and jointly defending ourselves against the Communists, all kinds of assistance from Japan will follow, greatly enhancing our Sino-Japanese friendship."
 CHI_without_slacking: "Slacking is Forbidden!"
 CHI_without_slacking_desc: "By now, both in the front and in the rear, there are people who show a slack demeanor; as long as we hold on, everything is still quite manageable, and the communists are not unbeatable."
 CHI_Defend_the_Three_Principles_of_the_People_at_all_costs: "Spare No Expense, Defend the Three Principles!"
 CHI_Defend_the_Three_Principles_of_the_People_at_all_costs_desc: "If the situation is not quickly reversed, then the future and destiny of the Republic founded on the Three Principles, which such a vast number of revolutionary martyrs defended with their blood, is under serious threat!"
 CHI_Defend_the_Three_Principles_of_the_People_at_all_costs_tt: "§RDefeat the mighty, revitalize China, harmony among nations, great power draws near!§!"