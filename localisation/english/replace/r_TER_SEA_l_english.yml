 KPA_Thakin_Than_Tun_desc: "The life of Thakin Than Tun was deeply intertwined with General Aung San and Thakin Soe.\n\nAung San was a seasoned politician, shaped by years of struggle.\nThakin Soe was a fiery revolutionary, driven by unyielding passion.\nThan Tun, though familiar with both paths, resembled more a gentle poet than a hardened fighter.\n\nUnder the nationalist alliance that united Burma’s resistance, different factions emerged, overlapped, and clashed, entangled in a web of shifting identities and allegiances. With his sharp intellect and eloquent writing, Than Tun was entrusted by Aung San to handle the alliance’s propaganda efforts. The Communist Party of Burma, too, eyed him for his Marxist inclinations, leaving an open seat in its ranks.\n\nYet, when it came to Japan, Burma—like India—was torn apart by irreconcilable divisions. As cooperation with Japan became the dominant stance, Thakin Soe rejected the alliance, forming the Red Flag Communist Party and calling upon workers and peasants across Burma to overthrow Japanese rule.\n\nBefore leaving, he left Than Tun with one parting remark:\n\"Even collaboration with British imperialists is better than siding with Japanese fascists.\"\n\nThan Tun gave no response. Through his ties with Aung San, he hoped to fight his last battle from within the alliance.\n\nIn 1949, under Japanese direction, Aung San and U Nu joined other parties in banning separatist activities and launched a brutal purge against the communists. Many party members perished under the guns of betrayal, including Than Tun’s younger brother, who was still studying in Japan.\n\nAs blood splattered onto Than Tun, he found himself standing at a crossroad of fate.\n\nHe had one last chance—to kneel before Aung San and become his loyal pawn once more.\nAfter all, they were relatives.\n\nBut when police raided Than Tun’s home, they found nothing but an empty house.\n\nWith the help of sympathetic officers, Than Tun and his comrades fled north, racing toward the small border town of Mong La, where the Red Flag Communists—the radical exiles of the left—made their last stand.\n\nThere, at the edge of the jungle, Than Tun encountered a group of Chinese soldiers.\n\nTheir uniforms were tattered, their red-star patches stitched from a single strip of cloth, but in the emerald green of the jungle, the crimson mark shone bright.\n\nThey introduced themselves as the Yunnan-Guangxi Border Guerrilla Force, an underground group connecting anti-Japanese resistance cells hidden deep in the mountains.\n\nWhen they asked if Than Tun was willing to join, he took a rifle, loaded a single round into the chamber, and answered:\n\n\"I am ready to fight.\""
 KPA_democratic_union: "United Democratic Armies"
 KPA_democratic_union_desc: "The Communist Party of Burma has worked to enlarge its liberation front, uniting with many progressive forces into the United Democratic Armies. Together, they work to overthrow the dictatorial regime of Aung San. Beneath their promise of democracy and independence, many autonomous local armies representing ethnic-minority militants have joined in this dream, preserving outward harmony with the base area. Karen, Arakan, and other militant groups have united to join our side and become part of our front.\n\nAfter passing through a period of training and ideological education, the United Armies have overcome difficulties arising from their variable quality and are now qualified for revolutionary efforts."
 KPA_announcement_in_prison: "The Prison Manifesto"
 KPA_announcement_in_prison_desc: "In 1949, the Aung San regime began to wantonly persecute communists, and the Fourth Secretary Thakin Ba Tin along with many other party members were tragically imprisoned. Launching a savage assault on the reactionary regime, Thakin led his comrades in a bold struggle against the enemy from inside the prison, releasing the \"Prison Manifesto\" document to guide the actions of party members:\n1. Completely annihilate Japanese imperialism and its running dogs; \n2. Refuse to back down from the correct line, advance towards armed struggle;\n3. Persist in leading the working class, implement land reform;\n4. Establish a United Front from the bottom up."
 KPA_red_guardian: "Red Guards"
 KPA_red_guardian_desc: "Chairman Thakin Than Tun has adopted many tragically bereaved orphans from all across Burma, of many nationalities. Attending devotedly to the Chairman, these children have grown up as unreservedly loyal communist fighters, treating him as their true father. Referring to themselves as 'Red Guards', they vow their life and blood for the sake of defending the red regime, piercing the hearts of revolutionary traitors and class enemies like steel blades."
