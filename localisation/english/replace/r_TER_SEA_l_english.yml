l_english:
 SEA_equipment_support_from_QYC: "Support from Hainan"
 SEA_equipment_support_from_QYC_desc: "Long before we raised the flag, the §GQiongya column§! was secretly training fighters and replenishing our armaments.\n\nToday, we have abundant granaries, and strong troops and victory is already beckoning us.\n--------------\nWhen the idea is effective, we will get buff:\n§WMonthly Rifle Acquisition:§!§G500§!\n§WMonthly support equipment acquisition:§!§G500§!\n§WMonthly artillery acquisition:§!§G300§!\n§WMonthly anti-tank equipment acquisition:§!§G300§!\n§WMonthly motorized equipment acquisition:§!§G400§!"
 CRC_communist: "Cambodia"
 CRC_communist_DEF: "Cambodia"
 CRC_communist_party: "Cambodian Front - Red Elements"
 CRC_communist_party_long: "Cambodian People's Front - Communist Party of Kampuchea"
 CRC_Pol_pot: "Pol Pot"
 CRC_Pol_pot_desc: "Formerly known as Sarot Sau, Pol Pot was the son of a squire in Cambodia's Kampong Thom province and the son of an aristocrat who grew up in the countryside - his cousin was a consort of the King of Cambodia. Thanks to his family environment, Bobu was able to complete his studies in his home town and succeeded in obtaining a place to study in France.\n\nThe passionate years in France had left these exuberant Cambodian students immersed in the Vichy regime, and they were dazzled by a steady stream of politicians' speeches, the most eye-catching of which was the French Populist. This blanket condemnation of the urban \"exploitation\" of the countryside stirred a fire in Charlotte Sau's heart, urging him to intensify his studies and serve his country.\n\nBut among others, Bobo was not a tireless student who worked early in the morning and late at night. His best friend, Insali, said that he was \"a frequent absentee\", \"the earliest in the dormitory, woke up the others and then did not study\"; he was obsessed with collecting all kinds of French knickknacks, for which he spent a lot of money on scholarships; he was the most noisy in the political debates, but was not at all interested in other things. The only redeeming feature was Bobb's dislike of male-female relationships, for which some students were deported by the Vichy government for \"violating racial decrees\".\n\nUpon his return, Bobu did not receive an offer of employment from Prince Sihanouk and was excluded from the admission list due to poor grades. Refusing to calm his restlessness, however, he began selecting Cambodian opposition parties and joined the Communist Party of Kampuchea (CPC) without hesitation.\n\nWithin the party, he claimed to be well versed in Marxism-Leninism, but in meetings and discussions, Bobu was often clumsy and his poor knowledge base was obvious. But he would always criticize his comrades, who beat him at words, for being \"full of foreigners\" and for having \"lost their nationality from head to toe\". The Ankara in Bobu's hands was the foundation of his party's survival, and led to his ruthless hand reaching for the General Secretary's chair."
 CRC_Khieu_Samphan: "Khieu Samphan"
 KPA_communist: "Kachin People's Liberation Front"
 KPA_communist_DEF: "the Kachin People's Liberation Front"
 KPA_communist_party: "CPB"
 KPA_communist_party_long: "Communist Party of Burma"
 KPA_Thakin_Than_Tun: "Thakin Than Tun"
 KPA_BUR: "Union of Burma"
 KPA_BUR_DEF: "the Union of Burma"
 KPA_fuck_off_the_drugs: "Wipe Out Narcotics!"
 KPA_fuck_off_the_drugs_desc: "British and Japanese imperialists planted the poppy in Burmese soil, and drug production spread like a plague until it became an unavoidable fact for the entire base area. According to incomplete statistics, the base area receives nearly 40% of its income from these poisoned fruits.\n\nThe extent of the wealth it provides means that for many party members, 'drug prohibition' is a taboo phrase, something they turn a deaf ear to (although others even traffic it themselves). Comprehensive drug prohibition is at the core of our party's policy, and we must adopt thunderous methods of attacking the narcotics industry for the sake of a new society for all Burma's peoples."
 KPA_storm_coming: "Leave..."
 KPA_storm_coming_desc: "After the collapse of Aung San rule, the ad hoc resistance front lost its raison d'être and the enthusiasm for unity waned, as we had foreseen.\n\nWith each step forward in the revolution, the class struggle became more and more acute. Some people benefited from the revolution, others were disillusioned. Capitalists, landlords, armed minorities, intellectuals and even a part of the peasantry, some of the worst intentions were bringing these people together and weaving them into a counter-revolutionary net that was closing in on the revolutionary regime from all sides.\n\nAll are looking for their ultimate position, and we believe that the Burmese revolution is impregnable and invincible ......"
 VIN_Ngo_Dinh_Diem: "Ngo Dinh Diem"
 SEA_VIN_paternalism_party: "Viet National League"
 SEA_VIN_paternalism_party_long: "Lien Minh Dan Toc Viet Nam"
 VIN_village_consolidation: "The Consolidated Hamlet Plan"
 VIN_village_consolidation_desc: "To isolate the communists from the peasants, the General Staff has designed a set of \"consolidated hamlets\" based on the North China Security Campaign.\n\nThese function as a fully enclosed village defense system in which the village was surrounded by bamboo spears and wooden fences, prohibiting people from entering or leaving. Our soldiers will also be stationed in the town, always ready to fight."
 VIN_buddhism_disaster_in_1965: "The Dharmic Crisis of At Ty"
 VIN_buddhism_disaster_in_1965_desc: "The Christian State Decree has provoked the discontent of monks and Buddhist adherents throughout the country, who are demonstrating in the streets and destabilizing the country.\n\nOur security forces have already taken action to close monasteries, detain monks, dispersing and arresting members of the unruly mob. "
 VIN_irritating_royalty: "The Eternally Nagging Royals"
 VIN_irritating_royalty_desc: "Prime Minister Ngo Dinh Diem had shoved aside several royal candidates during his election campaign, and his decision to appoint fellow clan members to key positions in the government displaced many members of the royal family. Now, many of Prime Minister Ngo's administrative initiatives are being blocked by members of the royal family. This political dilemma will continue for quite some time - until Prime Minister Ngo stabilizes the situation."
 VIN_irritating_JAPANESE_FUCK_YOU: "The Irritating Japanese Advisors"
 VIN_irritating_JAPANESE_FUCK_YOU_desc: "We had hoped that the Japanese Empire would share with us their advanced combat experience, but so far, these Shōwa staff officers have not brought much progress to the SDF. They despise our Vietnamese soldiers and have no fundamental knowledge to teach our Vietnamese officers; they command the war room and only know how to fight blindly, then blame us for the failure of the operation. The military have had enough of this unwarranted contempt."
 VIN_national_self_defence_force: "Vietnamese Self-Defence Force"
 VIN_national_self_defence_force_desc: "While the communists were rampaging, the Japanese Empire only allowed us to keep just the right size of troops to maintain law and order until the bandits became rampant, when they suddenly allowed us to mobilize soldiers on our own."
 VIN_a_LITTLE_BIT_of_corruption: "Corruption's Faint Glow"
 VIN_a_LITTLE_BIT_of_corruption_desc: "After Prime Minister Ngo was sworn in, many of his relatives found their way into the government. These relatives lived very well indeed: German cars, Chinese chefs, Filipino servants, and the most ostentatious furniture from Japan.\n\nOf course, these are only their superficial luxuries. No one knows how much money the Ngo clan members made for themselves behind the scenes."
 VIC_fatherland_front: "Vietnamese Fatherland Front"
 VIC_fatherland_front_desc: "The Mat tran To quoc Viet Nam (MTTQ), or Vietnamese Fatherland Front, is the second-largest Red organization in Vietnam, after our party. It includes many left-wing human rights groups that accept the leadership of the Party and help us communicate with various social strata to ensure the implementation of the united front policy."
 VIC_under_the_dense_forests: "Beneath an Ocean of Forests"
 VIC_under_the_dense_forests_desc: "The northern part of our country is covered with endless mountains and hills, where primeval forests overpower earth and sky alike, offering a shadowy cloak. These are our natural garments of invisibility, protecting our people, our soldiers, and our factories from the threat of enemy bombing."
 VIC_Ho_Chi_Minh_lane: "Ho Chi Minh Trail"
 VIC_Ho_Chi_Minh_lane_desc: "Starting from the Mu Gia Pass in Quang Tri Province, Vietnam, the Ho Chi Minh Trail stretches 600 kilometers southward through Laos, Cambodia, and back to Vietnam again, entering the Western Plains. This treacherous, intricate mountain road has served as the lifeline of our guerrilla forces. By utilising this attack route, the enemy could not detect our strategic intentions and thereby we secured excellent conditions for the liberation of the south."
 VIC_live_off_the_fat_of_the_land: "Living off the Mountains"
 VIC_live_off_the_fat_of_the_land_desc: "Although we could enrich our logistics through maritime supply lines, assembling the various raw materials needed for production at our base still remains difficult. For this reason, we have set up a geological exploration team to search for mines. At the same time, we have refined our excavation techniques not to waste a single bit of ore."
 VIC_adapt_the_bomber: "Study the Bombings, Time it to Perfection"
 VIC_adapt_the_bomber_desc: "The prolonged revolutionary war has allowed us to understand the pattern of Japanese bombing. We have formulated our schedule accordingly, and as long as there are no accidents, we can simply treat the Japanese planes as one big heap of scrap metal"
 VIC_military_adviser_from_QYC: "Advisors from Qiongya"
 VIC_military_adviser_from_QYC_desc: "The Hainan branch of the Chinese Communist Party has offered us strong support, regularly dispatching advisory groups to the base so they could assist us in training our troops. The Party Central Committee paid these revolutionary comrades 500 kilograms of rice per month as wages."
 VIC_comrades_from_the_north: "Northern Comrades' Arrival"
 VIC_comrades_from_the_north_desc: "When the rice is ripe, a \"nobleman\" wearing a short-sleeved shirt, a bamboo helmet and sunglasses leads a team of people carrying goods into the Viet Minh-controlled areas with a hiking stick; this man was none other than the General Secretary of the Southern Bureau of the CPC, Ye Jianying.\n\nSince 1947, the CPC had been preparing for the establishment of the Southern Bureau in response to the looming military defeat, so that they could liaise with the anti-Japanese forces south of the mainland, including the Viet Minh. By disguising his identity, Ye Jianying became one of the leading black market traders among the Chinese in Guangdong. After regularly purchasing essential supplies, he brought them to the Viet Minh base through the Hainan networks to carry out trade. Moreover, Ye Jianying was able to bring funds from the Viet Minh base to Guangdong for turnover.\n\nThe CPC brought not only money but also military experts. An advisory group consisting of Wei Guoqing, Zhu Huyun, Lu Shaowu, Xiao Xiangrong, and others infiltrated the Viet Minh from the 100,000 mountains of Guangxi to help them build an army to fight against the Japanese invaders.\n\nAlthough the Viet Cong and the CPC forged a fifteen-year friendship side-by-side, this constrained assistance drew the resentment of some \"protectionist\" members of the Vietnamese Communist Party; this was a coordinated opposition that could spread quickly after the Viet Minh's situation improved, bringing less-than-cheerful cooperation between China and Vietnam.\n-------------------\nAdd §G1£tt_prod_unit PU§! for Viet Minh."
 VIC_victory_in_lang_son: "The Great Victory of Lang Son"
 VIC_victory_in_lang_son_desc: "With the assistance of Communist Party general Wei Guoqing, Viet Minh Commander-in-Chief Vo Nguyen Giap orchestrated the Summer and Autumn Border Campaign, which resulted in the first major military victory over Japan. Within weeks, Viet Minh forces defeated the 5th Division of the 38th Army and captured the city of Lang Son, forcing a Japanese retreat to Hong Ky. This unexpected victory caught Japan off guard and stirred the Vietnamese public, who now turned against an imperial government incapable of handling the crisis. While the government was falling apart, the Viet Minh accelerated its expansion and continued to fight the two great empires, Japan and Vietnam."
 VIC_20_years_of_resistance: "Twenty Years' Resistance"
 VIC_20_years_of_resistance_desc: "Since 1941, when the 8th Conference of the Central Committee of the Communist Party of Vietnam resolved to establish the Viet Minh and raise the banner of righteousness against Japanese and French imperialism, we have persistently resisted for more than twenty years. In the past twenty years, under the strong leadership of the Viet Cong, the Viet Minh has repelled successive invasions by Japan and Thailand, expanded its base areas, and grown into a force to be reckoned with in the Indochinese peninsula. We have persistently resisted for twenty years, and as long as the imperialists and Japanese invaders remain, we will resist without fear for another twenty years!"
 SEA_Yang_Wenming: "Duong Van Minh"
 VIN_final_party_long: "Emergency Military Cabinet"
 VIN_final_party: "Emergency Military Cabinet"
 SEA_news.1.t: "[Get_newspaper_header]Japan's Navy Ministry Issues Security Statement"
 SEA_news.1.desc: "In response to the unknown situation on the Indochina Peninsula, the Japanese government has established the South Pacific Defence Command under the Navy's leadership. A fleet of destroyers sailed into the South China Sea from the port of Labuan in North Borneo.\n\nThe Declaration stated that the security situation of the South Seas countries remained under control. The Declaration also sent a message to Vietnamese Prime Minister Ngo Dinh Diem, urging him to eliminate the communist insurgency in the north as soon as possible and advising Japanese nationals not to travel to Vietnam soon."
 SEA_news.1.a: "I especially like the phrase \"under control\"."
 SEA_news.2.t: "[Get_newspaper_header]Vietnam's Buddhist Calamity"
 SEA_news.2.desc: "Prime Minister Ngo Dinh Diem signed the Christian State Decree declaring Catholicism the dominant religion in Vietnam, and launched a campaign to purge Buddhism. This state policy created a massive crisis for the faith of indigenous Buddhists.\n\nIn Saigon, the military and police ordered the closure of monasteries and the violent dispersal of monks and worshippers holding Feast-of-All-Souls ceremonies, leading to numerous protests and brawls on the capital's streets."
 SEA_news.2.a: "An example of what not to do."
 SEA_news.3.t: "[Get_newspaper_header]Viet Minh Announces Capture of Hanoi"
 SEA_news.3.desc: "The political turmoil in Saigon provided a perfect opportunity for the Viet Minh to attack. In less than a week, the Viet Minh captured Hanoi, an important city in northern Vietnam.\n\nNgo Dinh Diem's unruly approach to government and the deteriorating anti-communist situation have infuriated the Japanese government, and Japanese envoys arrived in Hue the very night the Viet Minh captured Hanoi for urgent talks with the Vietnamese top brass."
 SEA_news.3.a: "The old master couldn't keep it together."
 SEA_news.4.t: "[Get_newspaper_header]Vietnam War Expands"
 SEA_news.4.desc: "According to reliable information, Viet Minh troops have arrived in Hue, the capital of Vietnam. Japan has launched a special military operation to reach an agreement with Vietnam on sending military personnel, and Japan will send tens of thousands of Japanese soldiers to the battlefield in Vietnam.\n\nIt is also reported that Lu Han, the Chairman of Yunnan Province, responded to the call of his Japanese masters and officially declared war on the Viet Minh."
 SEA_news.4.a: "(Turns the page) Let's see, anything else?"
 SEA_news.5.t: "[Get_newspaper_header]Vietnam's Prime Minister Ngo Dinh Diem Killed"
 SEA_news.5.desc: "Ngo Dinh Diem, the prime minister of Vietnam, was arrested by Japanese special forces, tortured, and then shot. The new government was temporarily reinstated by Bao Dai at the behest of the Japanese envoy and placed under the collective control of a military council.\n\nNgo Dinh Diem was an arrogant, eagle-eyed politician, from forcing Emperor Bao Dai to retire to his palace to establishing a Christian state religion, all of which testified to his desire to hold total authority; naturally, this hindered Japanese influence over the Vietnamese government. Of course, Ngo Dinh Diem's greatest blunder was his failure to properly handle the communist rebellion, which plunged Japan into a mire, a war from which it could not escape."
 SEA_news.5.a: "Angered beyond reason, they killed a villain."
 SEA_news.6.t: "[Get_newspaper_header]Viet Cong Attack Lu Han of Yunnan"
 SEA_news.6.desc: "While returning from the front to his rear command post, a group of guerrillas suddenly appeared and attacked Lu Han's convoy. After a fierce battle, the escort repelled the sneak attackers, and though Lu Han was seriously wounded, Japanese military spokespeople did not disclose any details of his injuries.\n\nChinese troops have slowly withdrawn from the Sino-Vietnamese border, and Kunming has unilaterally declared that it will no longer be involved in the affairs of the Vietnam War."
 SEA_news.6.a: "Hey, why not heal and come back?"
 SEA_news.7.t: "[Get_newspaper_header]Ngo Dinh Diem Becomes Prime Minister of Vietnam"
 SEA_news.7.desc: "After a standard, secretive competition, Ngo Dinh Diem, in his late sixties, has finally risen above other Vietnamese notables. The prime minister, from central Vietnam's Quang Binh province, publicized his political goals of opposing communism and defending the Vietnamese nationhood when he was sworn in.\nNgo Dinh Diem and his brother Ngo Dinh Nhu advocate \"Asian Personalism,\" an eccentric ideology rooted in Catholic philosophy that calls for social revolution. They were few but powerful, and there have been growing fears that the Catholics would take over the country entirely; the most extreme suggests it would be a catastrophe for Buddhism, which has been rooted in Vietnam for centuries.\n\nThe election of Ngo Dinh Diem as prime minister was confirmed in Japan, without opposition."
 SEA_news.7.a: "Time to handle it, once and for all."
 SEA_news.8.t: "[Get_newspaper_header]Thai-Cambodian War"
 SEA_news.8.desc: "The upsetting changes in the situation in Southeast Asia, especially the frequent victories of communist forces, have made the Thai government furious. In today's press conference, a military spokesman publicly declared that \"Japan's security guarantees for allies such as the Indochina Peninsula are just empty words.\"\n\nWithout any response from Nagatachō, Japan's seat of government, Thailand has openly withdrawn from the Co-Prosperity Sphere and mobilized its troops to eliminate the \"red bandits\" on the peninsula personally."
 SEA_news.8.a: "Everything should be on its own."
 SEA_news.9.t: "[Get_newspaper_header]RASA Joins Thai-Cambodian War"
 SEA_news.9.desc: "Faced with the Thai offensive, the Red Siem Reap Army did not form an effective resistance, and the defenses collapsed. After the fall of Phnom Penh, the top leader of the Red Siem Reap Army, Pol Pot, fled into the mountains of northern Cambodia, and special envoys were sent by the Red Siem Reap Army to start secret talks with the Vietnamese leader Le Phuong; what kind of agreement the negotiations came to is unknown to us. The Vietnamese and Burmese armies already stand mobilized at the border to launch military operations against Thailand."
 SEA_news.9.a: "Bringing in others on the way out."
 SEA_news.10.t: "[Get_newspaper_header]RASA Repels Thai Invasion"
 SEA_news.10.desc: "After an invasion lasting weeks, Thailand failed to achieve any of its strategic objectives, losing both the Cambodian Security War and the all-out war against the enemy on all sides. The war has devastated Thailand's fragile economy, with high inflationary debt and fierce anti-war sentiment in the country, as marching crowds demand an end to the war and a better life for the people.\n\nUnder much pressure, Thailand has sent negotiators to reach a consensus with Vietnam, Burma, and Cambodia to discuss a ceasefire agreement, a complete withdrawal of Thai troops from Cambodia, and a commitment to pay a certain amount of war reparations to the three countries.\n\nIntriguingly, the top leader representing the Cambodian government at the meeting was not Pol Pot but Khieu Samphan. According to outside sources, this may be related to the private agreement reached between Cambodia and Vietnam during the war."
 SEA_news.10.a: "Congratulations to the victor."
 SEA_news.11.t: "[Get_newspaper_header]Revolutionary Alliance of Southeast Asia Forms"
 SEA_news.11.desc: "Hainan Island in the South China Sea declared its independence from Japan, and its leader Feng Baiju visited Hanoi immediately after the end of the civil war in Viet Nam and established an international organization called the \"Southeast Asian Revolutionary Alliance\" together with Burma and Cambodia. The communist regime in northwestern China strongly supported this and congratulated \"the people of Southeast Asia on their liberation\".\n\nA spokesman for the Japanese Ministry of Foreign Affairs immediately said at a press conference that the Japanese government had no comment on the changing situation in Southeast Asia, despite news that the Imperial Japanese Navy was trying to pass a proposal in the Diet to strengthen its patrols in the South China Sea. This non-committal attitude triggered a heated argument within the Japanese government and among people from all walks of life in Japan."
 SEA_news.11.a: "We're truly speechless..."
 SEA_news.12.t: "[Get_newspaper_header]Civil War in Cambodia"
 SEA_news.12.desc: "In the chaotic situation of Southeast Asia, sporadic news from Cambodia is outlining to the world the whole picture of this bloody fight: the long-dormant Communist Party of Kampuchea (CPC) has raised its troops in Phibunsongkham (Battambang province), and its troops are directly aimed at Phnom Penh; and the Khmer Rouge, led by Sam Yok Seng, has declared its insurrection in Kratie; and the supreme commander of the Cambodian army, General Lon Nol, has declared that Cambodia has entered into a state of emergency, and that a curfew and light control measures will be imposed in major cities such as Phnom Penh and Sihanoukville. With immediate effect, Phnom Penh, Sihanoukville and other major cities implemented curfew and light control measures.\n\nAs a result, there is no doubt that Cambodia has been plunged into the quagmire of a tripartite civil war. The Ministry of Foreign Affairs of Japan expresses its grave concern over the current situation in Cambodia, appeals to all parties to the civil war to exercise restraint, protects the legitimate interests of the Japanese nationals in Cambodia and emphasizes time and again that it will be possible for the Imperial Japanese Army and Navy to \"clear up the chaos in Southeast Asia completely before the situation is irreversible\"."
 SEA_news.12.a: "Just bragging! They're raking it in, in Guangdong."
 SEA_revolution_league: "Revolutionary Alliance of Southeast Asia"
 CRC_normal_communist_party: "CPK"
 CRC_normal_communist_party_long: "Communist Party of Kampuchea"
 TER_SEA_Huanan_Bureau.1.t: "Memorandum - Proposal for the Establishment of the South China Bureau (excerpt)"
 TER_SEA_Huanan_Bureau.1.d: "Central Committee of the Party and Chairman Mao.\n\nJapan's use of the atomic bomb to bomb Pearl Harbor to force the United States out of the war has caused the situation of the war in China to continue to develop in a negative direction, and our Party organizations and democratic regimes established in various places are facing serious threats from the Japanese and the Japanese as well as from Chungking. Party cadres and military commanders at all levels must be fully prepared mentally to deal with possible future changes.\n......\nWe collectively propose to the Central Committee that, on the premise of avoiding unnecessary sacrifices, the Party organizations established by the CPC Central Committee in various places be retained and local branch offices be set up for unified management, so as to conform to the trend of long-term struggle against the enemy.\n......\nGuangdong and the surrounding provinces will be plunged into long-term darkness and isolation, but we should not overestimate the reactionary forces and belittle our own efforts to the point of losing confidence in our future prospects. We need cadres at all levels in the South China Bureau to persevere in the struggle, preserve cadres and armed forces, and make long-term plans - to set the resolve to bury our heads in the sand for eight or ten years, to disperse existing forces and turn them into nails firmly planted in the enemy's rear.\n\nLiu Shaoqi, Zhu De, Zhou Enlai, Ren Bishi, Dong Biwu"
 TER_SEA_Huanan_Bureau.1.o: "X July 1945"
 TER_SEA_Huanan_Bureau.2.t: "Memorandum - Missions in 1946"
 TER_SEA_Huanan_Bureau.2.d: "Party Central Committee, Chairman Mao and Liu, Zhu, zhou, Central Committee and Military Commission.\n\nThe South China Bureau has not fulfilled the task of unifying Xia Wei and therefore, in accordance with the Central Committee's instructions, has changed its objective to understand and consolidate the anti-Japanese base in South China and to prepare for a protracted struggle. At the stage of development of the mass movement in the two regions, our general strategic policy is to create as much as possible a nation-wide anti-imperialist united front to aggregate and unite all possible, though unreliable, shaky forces in the struggle against the common enemy, the Japanese imperialists and their lackeys.\n\nAlthough Xia Wei explicitly rejected the common anti-Japanese proposal brought by the Central Committee, he did not expel our Party's organization in Guangxi, and in most cases, he would \"open the net\" on the issue of mass movement. This is the kind of cooperation that Xia Wei wants, and we can surely seize this opportunity to strengthen the united front.\n\nThe Dongjiang Column and the Jiangzuo Column had already established long-term contacts with the Southern Bureau. With the prospect of the Nationalist government in Chongqing making peace with Japan, the Southern Anti-Japanese Guerrillas are facing a serious situation of being comprehensively besieged by the Japanese and the counterfeit forces. Therefore, the immediate task was to consolidate the armed forces we could master in the shortest possible time, move to safety in time, and jump out of the enemy's encirclement.\n\nSouth China Bureau\n\nSecretary Ye Jianying, Wei Guoqing, Lu Shaowu, Xiao Xiangrong"
 TER_SEA_Huanan_Bureau.2.o: "X December 1945"
 TER_SEA_Huanan_Bureau.3.t: "Memorandum - Contact Viet Minh"
 TER_SEA_Huanan_Bureau.3.d: "TO Party Central Committee and Central Committee and Military Commission.\n\nThe Vietnam Independence League, an anti-Japanese revolutionary organization founded by Vietnamese communists Ho Chi Minh, Vu Yuanjia, and others, had secretly infiltrated China in 1943 in the hope of establishing contact with Chiang Kai-shek's government but was arrested by the Kuomintang authorities and released to return to China after Chiang's death.\n\nYesterday, the Shantou Urban Engineering Department and the Guangdong-Fujian Hanjiang Column reported to the South China Bureau that Comrade Hu would again try to establish contact with the Chinese anti-Japanese regime, hoping to receive economic and military support from the Chinese government. We responded that we must ask Comrade Ho Chi Minh to visit the anti-Japanese democratic regime led by us and arrange for Comrades Wei Guoqing and Lu Shaowu to make preliminary contacts to prevent sabotage actions by the Kuomintang surrender faction and the Japanese and the Fake.\n\nWe are prepared to include the Vietnamese revolution in the anti-Japanese struggle of the South China Bureau, and devote our efforts to assisting the Vietnam Independence League to open up base areas on the Guangxi-Vietnam border and to hold the Japanese army in the direction of the Indochina Peninsula in check. In this way, the anti-Japanese forces in Guangxi and Guangdong developed over a longer period of time and formed a north-south echo with Vietnam in the regional situation. There are many advantages to establish relations with the Vietnamese anti-Japanese forces under Ho Chi Minh's leadership, and we now look forward to the Military Commission's instructions on our views.\n\nLi Bishan, Secretary of Shantou Party Committee to South China Bureau"
 TER_SEA_Huanan_Bureau.3.o: "X August 1946"
 TER_SEA_Huanan_Bureau.4.t: "Memorandum - Qiongya Column MIA"
 TER_SEA_Huanan_Bureau.4.d: "To Central Military Commission.\n\nAfter the Hainan Party Committee completes its infiltration mission, the Central Committee will lose contact with the Qiongya Column and thereafter liaison matters will be handled unilaterally by the South China Bureau.\n\nIn addition, Japan forced Nanking to abolish the KMT headquarters in Hainan and establish a \"special zone\" (temporarily handed over to the Chinese). The South China Bureau thought that this was a test operation for the Japanese to colonize China and an opportunity for our Party to penetrate the ruling hierarchy in Hainan, and hoped that the Central Committee would give instructions.\n\nSouth China Bureau\n\nSecretary Ye Jianying and Xiao Xiangrong"
 TER_SEA_Huanan_Bureau.4.o: "January X, 1947"
 TER_SEA_Huanan_Bureau.5.t: "Memorandum - The Japanese Split Guangdong and the South China Bureau's Response"
 TER_SEA_Huanan_Bureau.5.d: "To Party Central Committee, Vice President Liu Shaoqi.\n\nThe Nanking government signed the Guangdong Protocol with Japan, ceding all sovereignty over Guangdong Province and establishing a pseudo regime at Japan's request, making it clear that Japan has full colonial ambitions for China.\n\nAll comrades of the South China Bureau believe that preserving our strength is still our most urgent task at the moment and that we should not rashly launch an armed uprising and over-expose the fragile Party organization. We should use more meticulous political work and use economic struggle as the main means to penetrate all aspects of Guangdong society and develop the masses in order to accomplish the task of rooting out the grassroots within five years.\n\nSouth China Bureau\n\nSecretary Ye Jianying and Xiao Xiangrong"
 TER_SEA_Huanan_Bureau.5.o: "X October 1950"
 TER_SEA_Huanan_Bureau.6.t: "Memorandum-Resolution on Assistance in Establishing the Base Areas in North Vietnam"
 TER_SEA_Huanan_Bureau.6.d: "TO Ye Jianying of the South China Bureau and forwarded to the Military Advisory Mission for Vietnam.\n\nAfter the Southern Bureau meeting in 1948 resolved to provide military support to the Viet Minh against the Japanese and French empires, my delegation and the comrades in charge of the Southern Bureau opened the Fangcheng-Lang Son land route, contacted the comrades of the Central Committee of the Viet Minh, provided the necessary materials and instructed training for the Viet Minh guerrilla fighters, and planned to open up revolutionary bases in the Cao Bang area in secret.\n\nAfter a year of development, the Party organizations in South China were slowly recovering, the Hainan branch was rich in financial and material resources; the economy of the Japanese Empire was in post-war recession, and the control of the pro-Japanese government in Vietnam was rapidly declining; the internal and external favorable factors greatly strengthened the confidence and ability of the Viet Minh comrades to resist Japan. In particular, we planned the summer-autumn border war and achieved the Lang Son victory, the first military victory of the Viet Minh against the Japanese Empire, which effectively deterred the pro-Japanese government of Vietnam.\n\nAt present, the Viet Minh comrades have penetrated into Lang Son, Dien Bien Phu, and other areas, taking such means as planning peasant uprisings, ambushing the Japanese army and attacking the Vietnamese army, and gradually advancing into Hanoi, and the Vietnamese imperial government is on the verge of collapse.\n\nMission Commander Wei Guoqing and Chief of Staff Lu Shaowu"
 TER_SEA_Huanan_Bureau.6.o: "June X, 196X"
 TER_SEA_Huanan_Bureau.7.t: "Memorandum - Status of Development of Pseudo Regime in Guangdong"
 TER_SEA_Huanan_Bureau.7.d: "Sender: Ye Xiao Ma, South China Bureau\n\nTo: Central Committee of the Communist Party of China\n\nAfter the signing of the Guangdong Protocol in 1950, the Japanese Empire forcibly separated our Guangdong region from the Wang False Republican Government and established a pseudo \"Guangdong State\", which was the second artificial colonial state established by the Japanese Empire in China.\n\nPolitically, the pseudo-Guangdong was an experimental regime of colonial capitalism of the Japanese empire, and its head of state was called the \"Chief Executive\", who was appointed by the Japanese empire and is now Sadayoshi Suzuki. For details of the Japanese monopoly, see the second point of this article.\n\nEconomically, the entire economic lifeline of Pseudo-Guang was held by four Japanese monopolies, namely Yasuda (representative director: Takuji Matsuzawa), Sony (president: Akio Morita), Matsushita (president: Masaru Matsushita), and Fujitsu (president: Fukuda Inoue), except for Yasuda, which was mainly engaged in financial and banking business, the other three enterprises mainly focused on electrical manufacturing and electronic technology research.\n\nAs the military needs of Pseudo-Guangdong were borne by the Japanese Empire, only a small number of local police and Kenpeitai units were left in Guangdong for basic security.\n\nFourth, diplomatically, because the Guangdong Protocol was the most unequal treaty of all times, the pseudo-Republic of China was indifferent to the pseudo-Guangdong. The current Consul General of the Pseudo-Republic of China in Canton is Song Zhiguang, formerly a member of our Party and an officer of the Enemy Work Department of the Political Department of the First Division of the New Fourth Army, who has lost contact with the Party organization since 1946. The current Consul General of the Japanese Empire in Canton is Ichiro Takashima, and the military representative is Shigeto Nagano.\n\nV. Other aspects, since 1956, the pseudo-Guangdong population census has added a new ethnic group called \"Zhujin\", and after detailed analysis, we conclude that the Japanese Empire is trying to create the so-called \"Chinese Zhujin contradiction\" by dividing the ethnic identity of our middle-class Chinese compatriots, and This is a sinister and malicious intention to create traitors, so we need to pay more attention to the movement of this group in the future."
 TER_SEA_Huanan_Bureau.7.o: "June X, 1961"
