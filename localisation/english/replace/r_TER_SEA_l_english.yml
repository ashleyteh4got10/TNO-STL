 SEA_equipment_support_from_QYC_2_desc: "Long before we raised the revolution, the §GQiongya Column§! secretly trained our soldiers and supplied us with weapons and equipment.\n\nNow, with abundant resources. Victory must be ours.\n--------------\nDuring the effectiveness of this Spirit, we receive the following bonuses:\n§WMonthly rifle: §!§G500§!\n§WMonthly support equipment: §!§G500§!\n§WMonthly artillery: §!§G300§!\n§WMonthly anti-tank equipment: §!§G300§!\n§WMonthly motorized equipment: §!§G400§!"
 TER_SEA_Huanan_Bureau.8.t: "Memorandum - A Transcript"
 TER_SEA_Huanan_Bureau.8.d: "Location: Private residence of Ma Man-Kei\nParticipants: Li Ka-shing, Stanley Ho, Ma Man-Kei\n(The conversation begins after initial greetings and the guests are seated.)\nMa: In these times, we shouldn't overly concern ourselves with origins. If you're born here, you're from Guangdong, and Cheung Kong is our Guangdong enterprise. I admire the youth for their ambition and vigor.\nLi: During Fujitsu's siege, without Brother Ho's protection, I wouldn't be where I am today. I'm yet to repay these past kindnesses, and now I'm even more honored by Uncle Man's praise. Allow me to offer a toast to you first.\nHo: Uncle Man, being a close friend of Uncle Yin and a prominent businessman in Macau during the Japanese occupation, understands the challenges we faced.\n(All three raise their glasses in a toast.)\nMa: Exactly. Stanley, your return to Macau was made possible by Uncle Yin's assistance, and you must meet his expectations. Share with Ka-shing some rules from the Macau business community back then.\nHo: Upon arriving in Macau, my life is forfeit to all; Macau hotels are forbidden from hosting Hong Kong gamblers;  Hong Kong gamblers can't travel on Hong Kong ships to gamble in Macau…\nLi: A clear intent to prevent Brother Ho from operating in Macau.\nMa: Now you see the extent of effort Uncle Yin and I exerted to safeguard you all, huh?\nHo: Uncle Wan, I raise my glass to you once more.\n(They toast again.)\nMa: Returning to business matters, Ka-Shing, with your Japanese associates now in the Guangzhou LegCo, what are your plans?\nHo: (speaking before Li) Uncle Man, we have no intentions… as you said, the LegCo is dominated by the Japanese, and we Chinese shouldn't… well, it's not our place to be among hanjians…\nMa: (taking a bite) My passion has matured into a clear vision. As the Japanese integrate, it's crucial we take charge and seek power to shape our future. Remember the elders' contributions and seize the opportunities they've given. Your generation must step up to safeguard our interests and ensure a peaceful retirement for us.\nLi: My Japanese friend Akio is ready to sponsor my entry into the Legislative Council, though my assets fall short. If Uncle Man approves, I'd be honored to help fulfill your aspiration.\nMa: Excellent, Ka-Shing. Consider the Macau Chamber of Commerce your second home. Bring any business challenges to me; I'll never refuse help in times of trouble, barring crimes.\nLi: I'm deeply grateful for Uncle Man's support.\n(They toast once more.)\nHo: (whispering as he excuses himself from the table) Wasn't Uncle Man strongly opposed to the Japanese? His sudden change of heart is strange… (remainder omitted)\nNote: The conversation was captured on a Sony tape recorder with clear audio quality, allowing for distinct identification of Li and Ho's voices. Suitable for archival backup.\nSignatories: Ye Jianying, Ma Man-Kei\nDistribution: South China Bureau of the Standing Committee, filed in the Secretariat's Classified Archives Room of the South China Bureau."
 TER_SEA_Huanan_Bureau.8.o: "Recording time: 1960.X.XX 19:00-21:00"
 TER_SEA_Huanan_Bureau.9.t: "Memorandum-Application for Restoration of Party Membership of Song Zhiguang"
 TER_SEA_Huanan_Bureau.9.d: "Chairman Mao and Liu, Zhu, Zhou:\n\nAfter the Central Committee's instruction telegram on agreeing to try to re-engage with Song Zhiguang was received, we picked out an acquaintance from within the South China Bureau who was a close friend of Song's in the Political Department of the First Division of the New Fourth Army to act as an informant and sent him to lurk in the Chinese neighborhoods frequented by Song Zhiguang. After Song showed up on the street, he went up and deliberately pretended to bump into each other in close proximity, revealing his real face, while signaling Song to follow him with a code that only the two of them understood. Song immediately understood and followed alone with the people around him with the excuse of meeting \"old friends\". In a remote wood, the two of them recognized each other frankly and openly, and Song hugged each other excitedly, saying that they had not seen each other for many years and never thought they would be reunited alive. After determining that Song did not mean any harm, we asked him in detail about his specific experiences over the years, which are summarized as follows:\n\nSong said that in '47 the New Fourth Army retreat from behind enemy lines when they were in the unit of the squad was ambushed by the fake army to strike the team was completely scattered, he was also wounded fainted and faked death, the enemy mistakenly thought killed in action. When he woke up, the group had completely left, and he lost contact with the Party's army. After returning to the city, he tried to reconnect with the organization, but at that time, the underground system in the White Zone had been completely destroyed, and the Wang Fake regime was actively suppressing the internal resistance, so he searched in vain. Unfortunately, there were no Party members in Russia at the time, and he returned without success. Regarding his relationship with the Nanking authorities, Song said that the Nanking authorities seemed to be aware of his true identity, but never expressed it, and now they had sent him to Guangdong, probably hoping that he would act as a tool to destabilize the situation there. Now that he has finally re-engaged with the organization, he is willing to obey the organization's arrangements and will be able to return immediately.\n\nBased on the opinions of the people concerned and our long-term observation, Song Zhiguang was and still is a loyal member of the Communist Party. Even in the enemy camp, he still strives to find the Party organization and actively contacts to help the poor Chinese in his daily life, which shows that he is not a traitor who sells his country for glory or something like that.\n\nSigned: Ye Jianying, Xiao Xiangrong\n[Get_CPC_Huanan_write_back]"
