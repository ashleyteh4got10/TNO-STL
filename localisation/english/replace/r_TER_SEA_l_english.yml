 CPC_ANRL_events.1.t: "Breaking"
 CPC_ANRL_events.1.d: "The outbreak of the Thai-Cambodian War was undoubtedly a major test for the nascent Revolutionary Alliance of Southeast Asia, and perhaps also for Deng Xiaoping's personal ability. From the time he stepped into the office of the Secretariat early in the morning, the Secretariat had been handing himself a steady stream of telegrams from Hainan, Vietnam, and Burma. In order to make clear what happened in Southeast Asia in the past two days, he even had to ask someone to send a map of the whole of the South China Peninsula to lay on the floor tiles of his office, and then sat on it and began to take a pen to mark everywhere. The dense stream of information gradually formed a complete chain of events, spread out in front of him--\n\nThe Thai army had captured Phnom Penh in a very short time almost like nobody's business; the Cambodian Communist Party top brass had not been captured, but had moved to the deep north and into Vietnam in preparation for seeking aid from the A.R.U. - however, the Viet Cong, with whom the Communist Party of Vietnam had a history of bad blood, had disarmed all the Cambodian Communist Party troops that had been forced to pull back into Vietnam and expelled Ieng Sary, a matter that had ruffled the feathers of Pol Pot was greatly annoyed and sent seven telegrams to Hainan in protest. Feng Baiju intended to mediate, but the level of the dispute between the two parties is too high, just a Hainan branch secretary of the sea does not have the right to unauthorized decision, he had to Xi'an power request the Central Committee of the Communist Party of China to mediate the conflict between the Vietnamese and Cambodian Communist Party.\n\nAnd late at night, Deng Xiaoping's brain is still running at high speed, thinking about both the Northwest can retreat, but also to preserve the hard-won fruits of the revolution in Southeast Asia - until the door knocking on the door is getting heavier and heavier.\n\nHe pulled the door open with some displeasure, \"I've already told you I'm here tonight-\"\n\nHis voice suddenly trailed off when he raised his eyes - the visitor was Mao's secretary.\n\n\"Secretary Deng, Chairman Mao has asked you to make a trip to his place as soon as possible.\""
 CPC_ANRL_events.1.o: "\"Copy that, going now.\""
 CPC_ANRL_events.2.t: "Night Talk"
 CPC_ANRL_events.2.d: "Deng Xiaoping pushed open the door to Mao Zedong's room, \"Chairman, what can I do for you?\"\n\nAs soon as the words left his mouth, he skimmed his eyes and saw Chen Yi sitting on the sidelines.\n\n\"Enlai has gone to Hanzhong to do research, so the central government's tasks for this period of time are on you, hard work, I called you here tonight mainly to discuss the recent events in Southeast Asia - please ask Chen to tell us about the news from the Foreign Ministry.\" Mao Zedong sat behind his desk, clutching a document in his hands, and raised his eyes.\n\nChen Yi took a deep breath and stood up from the sofa, \"The General Secretary of the Burmese Communist Party, Deqin Danton, has asked for assistance from our Ministry of Foreign Affairs, Thailand has instigated an armed rebellion in Burma's Karen State, along with reactionary warlords in the old liberated area of Kachin, the situation is temporarily out of control, and we are expected to give military assistance.\"\n\nThe words just fell, Deng Xiaoping nodded: \"There is also news from Hainan that the Vietcong-Cambodian communists are in conflict and want to ask the central government to mediate.\"\n\n\"Southeast Asia has been in a lot of chaos lately.\" Mao Zedong put down the document in his hands, \"ASEAN was established not long ago, and will accept the challenge of Thailand, what is the 'boss of Southeast Asia'...\"\n\nThe two men responded in a chorus.\n\n\"...is essentially a paper tiger.\" Mao Zedong turned, \"Thailand is not engaged in what 'Thai rejuvenation' Well, but these years around are a few reactionary military head of the family infighting, I do not see what rejuvenation in this reasoning, in my opinion, Thai-Cambodian war stalemate will not be more than three months.\"\n\nDeng Xiaoping's brain turned fast, responded at once: \"What the President means is that our gaze should be more...\"\n\n\"Look farther ahead!\" Mao Zedong said at this point has been hard to hide his inner excitement, stood up himself, \"This period of time since the action in Southeast Asia has shaken the weakest link in the chain of Japanese imperialism, the next will be a good time for our party to unite and lead up the other communist parties in Southeast Asia, and set off a communist movement in Asia!\"\n\nDeng Xiaoping and Chen Yi glanced at each other and mutually understood what Chairman Mao meant."
 CPC_ANRL_events.2.o: "\"When the Premier returns, we'll organize a formal meeting of the central government.\""
 CPC_ANRL_events.3.t: "Today in meeting"
 CPC_ANRL_events.3.d: "Deng Xiaoping was speaking eloquently as he stood in front of the huge full map of the Central and Southern Peninsulas, and although the disparity in form made him look a little out of place in front of such a large map, the various responsible comrades of the Central Committee present should not have cared about this, and as Deng spoke, all began to think of a bright and unlimited future - a time when the Chinese Communist Party led the revival of the international communist movement.\n\n\"...To summarize, we believe that the time is ripe for our party to take the lead in establishing an international communist camp and that in view of the current international situation, the close unity of the communist parties of the countries of East and Southeast Asia is necessary for our overall goal of defeating Japanese imperialism and liberating East Asia .\" As soon as the words left his mouth, a tidal wave of applause resounded throughout the hall.\n\nMao Zedong stood up and continued with Deng Xiaoping's words, \"Comrade Xiaoping has pretty much said what I wanted to say, so I will raise two points. First, this alliance is to be built for the purpose of overthrowing Japanese imperialism and for the liberation of the oppressed peoples of Asia, so it should be called the 'Asia National Revolutionary League(ANRL)'; second, this alliance is necessary for our overall goal of defeating Japanese imperialism and liberating East Asia. The second point is that this alliance is not built solely for the purpose of defeating Japanese imperialism. Even after we have passed the hurdle of the war of liberation, our comrades in the Party have to see that there are still many other forms of imperialism in the world, including the Nazi imperialism of Germany and the liberal imperialism of the United States, and that the burden of the Party will become heavier and heavier with the growing strength of the revolution. heavier and heavier, and the young comrades among us must be prepared to lead our Party and this Union in the future, sticking to the revolutionary line, to the anti-imperialist line, and to the people's line.\"\n\nThe crowd applauded again, deeply impressed."
 CPC_ANRL_events.3.o: "The Ministry of Foreign Affairs is going to be busy."
 CPC_ANRL_events.4.t: "A New View of Hanoi"
 CPC_ANRL_events.4.d: "As soon as the train entered the station, through the windows, Wu Xiuquan saw rows of red flags fluttering in the wind, and crowds of people cheering the CPC delegation - of course, the most important thing was the familiar sickle symbol, which could be seen everywhere, and which, since 1917, has had a special magical power: no matter where the proletarians are, as long as they see the golden emblem of the sickle crossed with the hammer, there will definitely be the Communist Party - the party of the proletariat, the party of the people. Wherever the proletarians were, if they saw the golden emblem of the crossed sickles and hammers, there was bound to be a communist party - the party of the proletarians, the party of the people.\n\nFrom the window he could see some uniformed-looking delegates standing quietly waiting on the platform with flowers in their hands, and one of the generals at the head of the group was well-marked and about the same age as himself.\n\n\"The one in the lead should be Wu Yuanjia, known as the Tiger of Dien Bien Phu, there's no excuse for fighting, it's this one.\" Luo Changqing came to Wu Xiuquan's side and gave a thumbs up, \"He studied at the Yunnan Lecture Hall, counting that he should be an alumnus of General Zhu.\"\n\nWu Xiuquan nodded, \"I still remember when the news of their victory in the summer and fall border battles reached Yan'an, the President was quite excited and took the newspaper around to praise Wu Yuanjia for being a tiger general, and Wei Guoqing for being a good military advisor...\" As soon as his voice fell, he looked like he remembered something: \"Speaking of Wei Guoqing, it seems that the comrades representing the South China Bureau didn't come over?\"\n\n\"This time is a big negotiation, so only to ask the central government to send a plenipotentiary delegation to come, I heard that Secretary Ye Secretary Xiao Secretary they are still with Ma Wanqi in the black market in Guangdong Macao to do what to do...do real estate and home appliances business, but also to go around to collect Guangdong's intelligence, but also to assist in Hainan Secretary Feng that piece of offshore defense...messy, to come also have no time.\"\n\nTwo people laughed, this time the train whistle issued a long sound, two people's feet shook, the train then stopped.\n\nThe two looked at each other, nodded and walked to the door that was about to open."
 CPC_ANRL_events.4.o: "They believe that there will be welcome flowers outside the door."
 CPC_ANRL_events.5.t: "Break in meeting"
 CPC_ANRL_events.5.d: "The meeting on the establishment of the military alliance has just ended, Wu Xiuquan and Luo Changqing put away the documents they just signed and walked out of the hall.\n\nOutside the assembly hall is the Hanoi Revolution Square, which is still under construction, a crane is slowly lowering a sapling, and from the steps of the assembly hall you can still see from afar the workers righting the sapling and patting the soil.\n\n\"Lao Luo you know what comes to mind.\" Wu Xiuquan's footsteps slowed down a bit, \"looking at these saplings I immediately recalled the Xiang Ji Xuan Zhi written by Gui Youguang.\"\n\n\"There are loquat trees in the court, my wife's hand planted in the year of her death also...\" Luo Changqing subconsciously recited this paragraph, Wu Xiuquan immediately picked up the last sentence, \"...Now it is already pavilion like a cover.\"\n\nAfter a long moment of silence, Wu Xiuquan pointed to the saplings that had just been planted in the distance in Hanoi's Revolutionary Square, \"Do you think those things will also be able to pavilion like a cover?\"\n\nLuo Changqing sighed, \"We may not necessarily see that day.\" The two looked at each other and smiled at each other.\n\n\"How is the first creation of the ANRL not like these saplings, we are the ones who planted the saplings of the Asian Revolution with our own hands.\" Wu Xiuquan's face seemed to have overflowed with a proud smile."
 CPC_ANRL_events.5.o: "\"Let our children and grandchildren enjoy the shade of green!\""
 CPC_ANRL_events.6.t: "Miles of Journey..."
 CPC_ANRL_events.6.d: "The Internationale resounded through Hanoi, all the preparatory agendas of the newborn Asia National Revolutionary League(ANRL)e had been successfully completed, and today was the day of celebration when it was formally declared to the world.\n\nWu Xiuquan had long been unable to hold back his excitement, he could even imagine that ten thousand miles away in Yan'an, Chairman Mao and the others must also be listening to the real-time broadcast of the congress, he clutched the speech document in his hand and listened carefully to the simultaneous translation of the speech of the congress moderator, Lai Shoot, in his headphones.\n\n\"...This Congress authorizes the specially appointed plenipotentiary of the Central Committee of the Communist Party of China: comrade Wu Xiuquan, to read the Declaration of the Asia National Revolutionary League(ANRL). All rise and shout: proletarians of the world unite!\"\n\nChinese, Vietnamese, Cambodian, and Burmese slogans now erupted in a frenzy of passionate fervor - but Wu Xiuquan couldn't hear anything else; he could only hear his heartbeat, his footsteps, and his breath.\n\nSurrounded by applause and slogans, Wu Xiuquan walked up to the speaker's platform with his head held high."
 CPC_ANRL_events.6.o: "...Begins Now"
 CPC_ANRL_events.7.t: "Declaration of the Asia National Revolutionary League(ANRL)"
 CPC_ANRL_events.7.d: "Since the widespread emergence of revolutionary movements in the countries of South-East Asia, the situation in Asia has changed significantly, and the vast number of peoples oppressed and exploited by Japanese imperialism are rising up against the cruel rule of the invaders. In the face of this situation, the Contracting Parties believe that it is necessary to establish an anti-imperialist alliance comprising all the revolutionary countries of Asia in order to overthrow the Co-Prosperity Sphere, which is a prison for all the peoples of Asia. With this purpose as the core, the Contracting Parties sent their plenipotentiaries and, after consensus, formally agreed to establish the ANRL as follows.\n\nI. The primary goal of the States Parties is to overthrow the colonial rule of the Japanese Co-Prosperity Sphere and liberate the peoples of Asia through revolutionary struggle. Anyone who colludes with Japanese imperialism shall be the common enemy of the Contracting Parties, and at the same time the Contracting Parties shall be willing to maintain normal exchanges with neutral countries on the basis of respect for the sovereignty and independence of each country, non-interference in its internal affairs, and coexistence on an equal footing.\nThe States Parties shall consult each other on all important international issues of common interest in the spirit of strengthening solidarity and mutual assistance among the revolutionary countries.\nIII. In the event of an armed attack in Asia by any State or group of States against the Contracting States, all Contracting States shall exercise the right of self-defense, individually or collectively, and render full support to the attacked State in all reasonable forms available to it, including the dispatch of armed forces.\nThe States Parties shall establish a Joint Command Center for the purpose of unifying and coordinating the cooperation and collaboration of the States in the military activities concerned, and each State shall be represented in the Joint Command Center in order to assume its responsibilities.\nThe States Parties shall establish a permanent political consultative body responsible for the day-to-day work of the Alliance and for considering, approving and implementing proposals from the States. Each State Party shall be represented on the Political Consultative Body.\nThe States Parties shall respect each other's territorial integrity, sovereignty and independence, refrain from interfering in each other's internal affairs, help each other in the economic and military fields, unite as one, and give active assistance to the anti-imperialist forces of other countries in their struggle for the complete liberation of the Asian nation.\n\nSigned on behalf of the States Parties by: China: Ngo Xiuquan; Vietnam: Vu Won Kha; Myanmar: Dechen Thanh Dung; Cambodia: Khieu Samphan[GET_MLY_Chin_Peng]"
 CPC_ANRL_events.7.o: "Rise up, people who don't want to be slaves!"
 GET_MLY_Chin_Peng: "; Malaya: Chin Peng"
 CPC_ANRL_foundation: "It has been 60 years, the §xend game§! of  §Ganti-imperialist liberation cause of Asia§!, §Yis coming now§!"
 CPC_ANRL_events.8.t: "[Get_newspaper_header]Great change in East Asia"
 CPC_ANRL_events.8.d: "Today the situation in Asia has turned upside down. In Hanoi, Vietnam, the Communist Parties of Southeast Asia signed a joint declaration to form a new international organization, the Asia National Revolutionary League, declaring its intention to challenge the Japanese Empire on the West Pacific and to liberate the oppressed and exploited people of Asia.\n\nAs the situation changed drastically, the government of Laos withdrawed from the Co-Prosperity Sphere to maintain neutrality, an untenable situation that infuriated the Tokyo.\n\nThe Chinese government has expressed strong concern over the events in Southeast Asia, and Nanking has sent a diplomatic note to Japan requesting a Sino-Japanese talk to discuss the security issues."
 CPC_ANRL_events.8.o: "Something is breaking, but I can't tell."
 CPC_ANRL_events.9.t: "[Get_newspaper_header]Escalation of confrontation in East Asia"
 CPC_ANRL_events.9.d: "\"Red scourge\" is the buzz word in the press in China, and along with it the anxiety of the Chinese government.\n\nThe Sino-Japanese talks were progressing at a rapid pace, and [JAP.GetLeader] said that the Chinese government should take up the responsibility of maintaining peace and prosperity in Asia as soon as possible, and strengthen its domestic security forces to prevent Communism from continuing to victimize the people of Asia.\n\nIn order to consolidate the domestic armed forces against the \"Red Scourge\", the Nanjing authorities issued an order to recall the provincial affairs, and the warlords from different parts of the country left their provinces, which they had ruled for decades, to go to Nanjing and sign the \"Anti-Communist Agreement\". The Agreement required all local armies to register with the central government and to relocate their commands to the capital Nanjing.\n\nFaced with a threat that could not be ignored, Nagata-cho made the following adjustments to China's finances: China was allowed an unlimited extension of repayment of Japan's national debt with interest forgiveness, and the leasing and sale of ordnance by Japanese companies was opened up. Such favorable terms demonstrated its determination to stifle communism."
 CPC_ANRL_events.9.o: "Can't the Japanese do it themselves? Could they..."
