 CRC_Khieu_Samphan_desc: "Khieu Samphan was born in 1931 in Svay Rieng Province, the son of a local magistrate. A naturally gifted child, he won a scholarship to study in Japan at the age of twenty, majoring in economics. With a secure path to a government position upon his return, his future seemed bright and promising.\n\nBut fate had other plans—hell lay just beneath his feet.\n\nIn his graduation thesis, Khieu Samphan exposed Cambodia’s unfair treatment in trade relations with Japan, filling his work with indignant critiques. His Japanese professor, displeased by the accusations, reported him to the authorities. And just like that, the brilliant young student became a casualty of Pan-Asian unity. His degree was revoked, and upon returning home, Khieu Samphan faced relentless humiliation at the hands of Cambodian authorities, all to appease their Japanese patrons.\n\nSeeing his son struggle to find his path, his father sent him law books from their hometown, hoping he would study diligently and one day follow in his footsteps. But Khieu Samphan had already lost interest in working for the government. Instead, he took up a modest teaching job, instructing students in history and Japanese at an obscure middle school, while studying law on the side to represent the poor in minor legal cases for spare change.\n\nHis name soon became a fixture in anti-government newspapers, drawing the ire of plainclothes enforcers who frequently harassed him in his rented room. His students grew accustomed to seeing their teacher walk into class with fresh bruises, his face perpetually marked in shades of purple and red.\n\nThe yellowed pages of old newspapers bore evidence of his anti-Japanese stance, catching the attention of a mysterious underground organization that sought to recruit him. But the frailty of a bookish intellectual left him hesitant—he would never betray the resistance, but he also clung to his fragile existence in Phnom Penh, struggling forward one step at a time.\n\nSoon, fate made the choice for him.\n\nWhen an anti-government uprising erupted, Khieu Samphan was immediately placed on a hit list as a high-risk target. With death looming over him, he abandoned his tiny home in Phnom Penh, fleeing in a desperate, dazed escape into the mountains, where he finally embraced the guerrilla fighters.\n\nFrom a powerless scholar scraping by in the city to a liberation soldier wreathed in the light of freedom, Khieu Samphan had been reborn—and with that rebirth, all his past suffering faded away."
 CRC_avengers_from_the_past: "Yesterday's Foes"
 CRC_avengers_from_the_past_desc: "Whether it's the republicans or the \"United Homeland Resistance Forces\", so many fools have been lured onto the rocks by the promise of a Khmer Empire, each one trapped by the sweet words of invaders and accomplishing nothing.\n\nIn the last century, to drive out the Vietnamese, Cambodia invited the French.\nIn the 1940s, to drive out the French, Cambodia invited the Japanese.\nIn the 1950s, to drive out the Japanese, Cambodia invited the Thais.\nI don't understand why we must return to this cycle time and time again; it is our karma. How many heads must the guerrilla bands get until they can earn a motherland without internal hunger and starvation, without external humiliation?\n\nI am tired, and wish only to rest."
 CRC_secret_garden: "The Secret Garden"
 CRC_secret_garden_desc: "To conceal the organization, protect the leader, and repel reactionary forces, a strict set of secrecy protocols and code names was implemented in daily operations.\n\nThe base of operations was given a secret codename: \"Angkar\" (meaning \"The Organization\"), while guerrilla fighters and cadres were referred to as \"Black Shirts\" (after the color of their uniforms). The leader’s location remained entirely unknown, issuing commands through five trusted liaison officers, who then relayed orders downward through a strict chain of command—each level faithfully executing directives without deviation.\n\nRegarding the source of these orders, all members were strictly forbidden from questioning, tracing, or disclosing any information.\n\nThe Vietnamese Red Party, which cooperated with the leadership, often criticized this near-autocratic structure, urging the leader to grant more authority to the guerrilla command. But we pay no heed to their objections.\n\nThis unorthodox but highly effective system makes it difficult for the enemy to gather intelligence, ensures the combat readiness of our forces, and greatly enhances our ability to wage guerrilla warfare on a broad scale."
 CRC_avengers_from_the_future: "Tomorrow's Grievances"
 CRC_avengers_from_the_future_desc: "After achieving national victory, Pol Pot wasted no time launching a massive purge, leading to the merciless deaths of countless non-Khmers—Thai communities in Battambang, Vietnamese along the lower Mekong, Japanese and Chinese residents in Phnom Penh… His insane actions provoked an equally ruthless response—the Thai military invasion came right on schedule, and soon after, Pol Pot was overthrown by the Vietnamese Red Party for his \"ideological mistakes.\"\n\nI fought tooth and nail in front of our Chinese comrades, ensuring that Cambodia narrowly escaped becoming a Vietnamese puppet state. Zhou Enlai personally assured me that once the international situation stabilized, the Vietnamese army would withdraw. He also issued a stern warning against the reckless killings and mass arrests conducted by Cambodian guerrilla forces.\n\nTo preserve proletarian solidarity, we were forbidden from resenting our Vietnamese comrades. The Burmese Communist Party was even assigned as a supervisory body to enforce this directive.\n\nYet, bloodshed continued to unfold every day. The very soldiers sent to stop the atrocities often joined in the violence themselves.\n\nMust we launch another purge—executing Cambodia’s most loyal veterans, just to fulfill an order from the Chinese?\n\nI sink into an abyss of deep, inescapable doubt.\n\nPerhaps cruelty and isolation are the only answers the Khmer people truly desire."
 CRC_secret_garden_get_fucked: "A Plundered Paradise"
 CRC_secret_garden_get_fucked_desc: "The provinces of Battambang and Siem Reap are a land that has given rise to many bands of guerrilla fighters, supporting the development of many base areas. But now the Thai army has made this place uninhabitable, retreating and leaving behind countless buried land mines - a crime beyond all measure. On the other hand, the Viet Cong's \"ideological work\" has used this as an excuse to begin infiltrating Cambodia's government and army, such that behind every minister and every officer is a Vietnamese man...thinking of the bigger picture.\n\nA \"truly independent homeland\" is already beyond our reach. Outsiders turn through our inner workings as they please, while the lasting wounds inflicted by war have worsened the condition of both our politics and military. As hunger begins to devour our people alive, we can confidently declare that our government may well be worse than the Republic we inherited."
