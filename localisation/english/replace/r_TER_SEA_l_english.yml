 VIN_idea_viet_minh_desc: "Spread out any map of the world and it will say that the Empire of Vietnam is a united country ruled by a central government in Hue. Yet one only has to step into the Vietnamese countryside to realize that there are neither police nor Japanese soldiers on patrol, but only the armed forces of the Vietnam Independence League, or Viet Cong. Having fought against the French in 1941 to gain independence, the Viet Minh was now targeting both the Vietnamese government and the Japanese army stationed there. Led by two charismatic leaders, Ho Chi Minh and Truong Chinh, the Viet Minh received a great deal of aid from all over the country and even from abroad, some of which came from the Communist Party of China. Although the Viet Minh's activities became less frequent in the 1950s, they were waiting for the right moment to take advantage of the government's weakening to launch what they called the §Rrevolution§!..."
 POLITICS_HO_CHI_MINH_DESC: "The man known throughout the world as Ho Chi Minh was also known as \"Nguyen Sang Kung\" and \"Uncle Ho\", in addition to 50 to 200 pen names. Little is known about his private life, except that he was born in central Vietnam in 1890 and trained in Marxist politics in France and Russia. However, all Vietnamese - even his enemies - knew him as an accomplished poet who was fluent in many languages, and whose poems, written in Chinese characters and Mandarin characters, could be easily read and listened to by almost all Vietnamese.\n\nBut now after more than twenty years of struggle, people know him better than ever before. First the struggle with France, then with Vichy France, and finally with Japan - Ho Chi Minh knew very well that it was all the same kind of imperialism. He would never throw up his hands and surrender, even if the situation was critical. Ho Chi Minh opened up a liberated area in North Vietnam and sent underground workers all over the country. At this time he was not just a leader, but a nightmare for the Japanese and Vietnamese governments, with seemingly endless mysteries to solve. In the eyes of his enemies, he was like a mythical hero.\n\nBut Ho Chi Minh was old enough to know that, even as Japan's grip on Asia was weakening, he knew that his time was up and that he might never again see Vietnam standing proudly as an independent nation in Southeast Asia. Uncle Ho was a household name in the Vietnamese folklore and was loved by all. But who will the people follow after he is gone?"
