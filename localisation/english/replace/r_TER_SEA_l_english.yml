 SEA_news.13.t: "[Get_newspaper_header]Vietnamese military and police begin operations"
 SEA_news.13.desc: "In Vietnam, news has been received that military and police forces have begun a campaign to clear villages throughout the country and enforce a curfew in the northern region at the direction of Hue, a move that the Diem government has described as \"an effort to purge the Communist poison and to strengthen the security and anti-communist consciousness of the Vietnamese peasantry\".\n\nHowever, further reports indicated that within a week of the operation, the government had arrested at least 2,000 \"rural Communist suspects,\" most of whom were believed to be Buddhist monks, and the Diem government's move appeared to be a precursor to a larger political campaign. -But the target appears to be a different one."
 SEA_news.13.a: "Two Goals in one."
