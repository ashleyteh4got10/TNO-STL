 POLITICS_NGO_DINH_DIEM_DESC: "Diem's family fortunes took a sharp turn for the better from his father's generation, when the family began to serve the emperor. A simple sense of national duty led Ngo's father to forego the opportunity to study at a seminary, but he remained a devout Catholic, and this religious faith was passed on to his third son, Ngo Dinh Diem.\n\nThe family marriage gave Diem the status of a member of the gentry and brought him into the upper echelons of Vietnamese society at an early age. Compared to his father, Diem was more narrow-minded and arrogant. Born a thousand times more noble than the rest of the country, Diem always thought of himself as far-sighted and intelligent. For him, Vietnam was a country in the palm of his hand. He neither understood nor cared to look deeply into the people who also grew up in the land. Those foolish men and women in the poor countryside who kneeled and worshipped Buddha statues could not even enter Ngo's eyes.\n\nIf someone interfered with his work, Diem's heart was as painful as if it had been run over by a hydraulic press, and he would have to explode all the hard thorns in his body to get a bruise all over his body. This was true of his colleagues, of the royal family, of the French or the Japanese. During his years in the government, with his family's power and political demands for \"national sovereignty,\" Diem made a lot of contacts and offended a lot of people.\n\nWas Vietnamese national independence important? Yes, it is. What constitutes independence? Vietnam is only independent if Diem says so.\n\nNgo Dinh Diem was asked, \"Don't you find it boring and tedious to run around for the sake of power in your life? Ngo immediately spoke at length about being a native Vietnamese from his family traditions, then about the glorious years of opposing the French colonial invasion, and finally about his own expectations of his father and brother and his mission to revive the Vietnamese nation, so his struggles were not boring, and were never boring. After listening sparingly to the plausible platitudes, so that people really can not catch the point to follow up, but only in Diem's smiling face under the eyes of the snappy departure.\n\nThis is another good show."
