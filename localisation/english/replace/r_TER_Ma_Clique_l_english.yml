 QIN_allah_bless_desc: "Allah, I turn towards You in prayer. May You pity the pain of mortals and smash darkness with a sword of freedom...\nAllah, I turn towards You in prayer. May You wield righteousness and make return the triumphs of Your messenger, spreading Your teachings...\nAllah, I turn towards You in prayer. May Your immaculate broom sweep away my uncertainty, showing the path to the future..."
 QIN_save_land_people_desc: "Over the past decade, the Communist Party has directly attempted to wipe out the Ma Clique from the Northwest and make itself the champion. But they underestimated the bold spirit of the Northwest; horselike, she unhesitatingly threw off the roughness of their coarse and callous governance, leading the people towards her real masters - the Ma family.\n\nThe Hui hope we can shield them, the Han hope for the restoration of the Republic's glory. These paths are different, but through careful planning, the cause of defending the border's people could achieve two goals at once, uniting them all beneath the flag of the People’s National Salvation Army and advancing our battle for the party and nation.\n\nFortune and skill alike favor us. As for the inherent advantage that is ours by geography - we must seize it from the communist bandits. "
 QIN_two_ma_struggle_desc: "Ma Chengxiang is Ma Buqing's son-in-law, and was groomed to be his successor. But Ma Bufang opposed Ma Chengxiang's family, seizing his elder brother's military authority and leaving Ma Chengxiang to the bitterness of an empty reward long denied him.\n\nFollowing Ma Bufang's assassination, Ma Chengxiang threw off his shackles and has continually challenged Ma Jiyuan's leadership, igniting armed revolt and worsening the Ma family's infighting. Ma Jiyuan knows the source of these developments and has tried to transform himself into a deity to rival Nezha, commanding troops at the front with one set of limbs and guarding against Ma Chengxiang at the same time. "
 QIN_kind_words_butter_no_parsnips_desc: "Over-conscription and logistical disorder have practically suffocated the barren land of Qinghai, with soldiers on the frontline starving day by day. One by one, the commoners' families will turn to petty theft, and from there may well develop into the flames of looting. As time goes by, the People’s National Salvation Army will one day harbor only the cries of geese flying over a desolate land.\n\nOrdering harsh purges, Ma Jiyuan has tried to restore military discipline, but the right to a full stomach is dear to every soldier - and some officers extort the people forcefully to try and muster enough grain. Since excessive enforcement would make the troops more disloyal still, we can only hope for the best and press on. "
 QIN_patchwork_of_rebels_desc: "Canceled tax exemptions, coercive enlistment, the mobilization of the whole country...it was still not enough, and the People's National Salvation Army demanded yet more.\n\nTo fight with all his might, Ma Jiyuan boldly proclaimed that every nationality in Qinghai was equal, and should smash the faces of the red bandits with their fists held high. That aside, Kazakh, Tajik, or Tibetan, the real reason they did not aim their guns in resistance and avenge their deep blood feud with the Ma family was a fear of death - fear of tyrannical abuse from the Ma family's cavalry, fear of being cut down by their recruiters."