 POLITICS_MA_JIYUAN_DESC: "Though the Northwest lands narrowly escaped enslavement under the Rising Sun, a generation had already given their lives in its defense. Their descendants, armed with broken, outdated weapons, continued to eke out an existence in the borderlands between the Loess Plateau and the Tibetan Plateau.\n\nAmong them was Ma Jiyuan, a young man burdened with his father’s great expectations—his name, after all, was derived from the famed Eastern Han general Ma Yuan.\n\nFollowing the untimely demise of Ma Bufang, Ma Jiyuan hastily inherited command over the remnants of the Qinghai Ma Clique, aligning with the Third United Front, where he fought alongside the Chinese Communists and the last remnants of the Northwest Kuomintang to resist the Japanese invasion. Yet, the mysterious and well-timed death of Ma Bufang cast a long, dark shadow over his mind—was it truly the Communists who assassinated his father, scheming to solidify their grip over the Northwest?\n\nA deep-seated suspicion toward the true intentions of the Communist Party festered within Ma Jiyuan, but he was not yet ready to break ties. After all, with the Japanese menace at their doorstep, there was no room for internal conflict. For now, he would endure—biding his time, waiting for the perfect moment.\n\nThat moment finally arrived when the Great Leap Forward sent shockwaves through Qinghai.\n\nMosques burned in raging flames, the starving masses grew skeletal, finances crumbled, and political tensions reached their breaking point—the Ma Clique was on the verge of rebellion. Enraged by the wailing grievances of his people, Ma Jiyuan made up his mind:\n\nChina would only find salvation under Allah if both the Communists and the Japanese were eradicated.\n\nFrom the walls of Golmud, he issued his fateful order—march eastward!\n\nThus, the \"People's Salvation Army\" was born, a disparate force of Ma Clique soldiers, rural bandits, Hui militias, and even a handful of religious \"Jihadists\", surging forward in a full-scale assault on the heart of the National Defense Front.\n\nAt first, the offensive was shockingly successful, even to Ma Jiyuan himself. However, as the People’s Liberation Army mounted counterattacks with growing effectiveness, the seeds of doubt began to take root.\n\nStanding in the Northwest, staring toward the pagoda of Yan’an, fear of defeat and uncertainty about the future, even if victory could somehow be achieved, gnawed at his soul.\n\nA storm was brewing over China—but when it struck, would he be the one to command it?"
