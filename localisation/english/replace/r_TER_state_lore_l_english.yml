l_english:
 state_lore_initials.124: "CHA"
 state_lore_name.124: "Changsha"
 state_lore_desc.124: "The area of Changsha has inhabited tens of thousands of years ago. Over the years, the city has witnessed the rise and fall, the rise and fall of numerous dynasties. In the late Qing Dynasty, Changsha was forced to open its doors to the outside world - first to Japan and then to other powers - due to the Treaty of Commerce and Shipping signed by the Qing government in Shanghai. After the Xinhai Revolution, Changsha remained a city with developed commerce and relatively weak industry.\n\nIt was also the hometown of Mao Zedong, the former stronghold of Chinese communists until the Kuomintang purge of 1927, which massacred thousands of \"communists\" and \"revolutionaries. During the Second Sino-Japanese War, Japan realized the strategic importance of Changsha as a significant transportation hub in southern China. Japan launched uninterrupted attacks on Changsha, and the Imperial Japanese Army launched four battles around the city. Due to the scorched earth tactics mistakenly executed by the Chinese army against the city in 1938 and the four protracted and brutal fighting, when the Japanese finally captured Changsha in 1944, the town was already devastated and disfigured.\n\nWhen Japan finally won the war in 1947, the city would take decades to erase the wounds of war.\n\nChangsha in the 1960s was different than it had been thirty or forty years earlier. Over the decades, Changsha has changed hands several times between forces and armies, and now the city is finally under the rule of a single government. The war's end may have brought hard-won peace to the city, but the scars of the Second Sino-Japanese War are still stark."
 state_lore_initials.125: "CHE"
 state_lore_name.125: "Chengdu"
 state_lore_desc.125: "As an ancient city with more than 4,000 years of history, Chengdu, the capital of Sichuan, has always had a pivotal position, because of its unique geographic environment of being isolated from the rest of the world and difficult to defend, it has been the preferred political center of all kinds of ruling regimes throughout the dynasties.\n\nDuring the Second Sino-Japanese War, the Nationalist Government transferred the central institutions to Sichuan, Chongqing as the temporary capital and military headquarters, Chengdu became the main military supplies and economic reconstruction of the revival of the base, in the majority of the people of Sichuan to provide strong logistical support for the War of Resistance against Japan, with a \"big backyard\" of the glorious distinction. Toward the end of the war, news of the surrender of the Nationalist regime to the Japanese swept through Chengdu, accompanied by mass starvation, and the indignant masses rushed into the streets in a full-scale clash with the Nationalists. In the midst of the public's cries and brutal violence, bullets overwhelmed the huge crowds, blood stained the blackened streets, and the ferocious flames danced in the darkness of the night, and when the smoke cleared the formerly prosperous metropolis was reduced to a sea of flames.\n\nAs the flames of the war faded, Chengdu, with its abundant manpower and resources, and because of the agreement between the Sichuan Provincial Government and the reorganized National Government, semi-subordinated to the new order of the Co-Prosperity Sphere, recovered at an astonishing speed after the war. However, the scars left by the past are still engraved in their bones, and the Sichuanese people have gradually formed a self-preservation mindset, and the isolation and autonomy of \"not knowing the Han Dynasty, regardless of the Wei and Jin Dynasties\" has been carried out in every aspect of their lives. Chengdu is far away from Nanjing, and has become the \"Peach Blossom Garden\" in the minds of many people who are neither willing to follow the new order nor have any intention of continuing to fight against the Japanese. Chengdu is far away from Nanjing and has become the \"Peach Blossom Garden\" in the minds of many people who neither want to follow the new order nor continue to fight against the Japanese. However, the wheel of history seems to have destined that Sichuan cannot be free from the world forever, and will definitely be involved in the current of the times with the changes of the situation."
 state_lore_initials.126: "CHO"
 state_lore_name.126: "Chongqing"
 state_lore_desc.126: "The sprawling, well-connected Chongqing is a metropolis in central China with a history of more than 3,000 years and was used by the Chiang family's national government during the Second Sino-Japanese War as a temporary war capital. At the time it was the general headquarters for Chinese and American military operations in China and Southeast Asia, and Chongqing suffered from heavy Japanese bombing. Although most of the citizens escaped to bomb shelters, the industrial facilities on the ground were severely damaged, and by the time the Japanese army moved into the city at the end of the war, there were very few industrial facilities left in Chongqing.\n\nOf course, the people of Chongqing were not indifferent to the ruins of their homes. Thanks to an abundance of resources from Sichuan and the mainland, and the unity of the local people, Chongqing was rebuilt at one of the fastest rates of any city in China. However, things were far from simple.\n\nBecause of the agreement with the Sichuan warlords, the reorganized national government could only rely on limited political means to maintain control over Chongqing. Continued dissatisfaction from Chengdu led to demands that Nanjing actually fulfill its promises of \"autonomy for the southwest\" and \"unity of Sichuan and Chongqing,\" leaving the national government with only minimal influence over Sichuan. Unlike other provinces such as Shanxi, the Nationalist government was more reluctant to give up Sichuan completely. The abundant manpower and natural resources from Sichuan would be a key piece of the puzzle for China's revitalization, and controlling Chongqing, and thus the entire Sichuan Basin was a must for any Chinese government that wanted to be in control of the big picture."
 state_lore_initials.127: "FUZ"
 state_lore_name.127: "Fuzhou"
 state_lore_desc.127: "Located at the mouth of the Min River, Fuzhou, the capital of Fujian Province, is an important seaside city in southern China with a history of more than 7,000 years. Since the 1911 Xinhai Revolution, Fuzhou, along with the rest of south China, has been the birthplace of the revolution. In 1933, the leftist anti-Chiang forces of the National Revolutionary Army established the Fujian People's Government, which soon collapsed due to the central government's blockade and the lack of support from the nearby Gan-Min Soviet.\n\nThe Second Sino-Japanese War broke out in 1937, and with it, Fuzhou entered a state of war. In early May 1938, the Japanese captured neighboring Xiamen, which threatened Fuzhou directly. The Chinese and Japanese fought another month-long naval and air battle in and around Fuzhou, but the city eventually fell into Japanese hands.\n\nUnlike other cities, the war had minimal impact on Fuzhou. Fuzhou had not experienced large-scale battles and quickly recovered from the war. It was also one of southern China's most important ports for the reorganized national government."
 state_lore_initials.128: "JIN"
 state_lore_name.128: "Jinan"
 state_lore_desc.128: "When China was forced into the international system in the 19th century, Jinan became an important area for all the powers to compete. Since the German occupation of Qingdao in 1898, Jinan and the whole of Shandong became a coveted area for Germany. During World War I, Japan tried to take over all German interests in Shandong, including the Jiaoji Railway, through Article 21 and secret deals with Britain and France. Still, the May Fourth Movement shelved this attempt. At the beginning of the war, Jinan became the focus of Japanese raids because of its important geographical location.\n\nAt the end of 1937, the Japanese army crossed the Yellow River and marched toward Jinan. The Chinese military chose to withdraw from Jinan and burned down the local government buildings and the Japanese consulate before starting. The withdrawal of the Chinese army created a severe power vacuum, and it was not until the Japanese military entered the city that a heavy hand was used to restore order there. Japan also used the local industrial facilities to serve the Japanese invasion.\n\nDespite the withdrawal of Japanese troops from Jinan after the war, the corrupt incompetence of the reorganized national government left Jinan, the pearl of East China, in the dust, and the backwardness and ubiquitous corruption of Jinan's governance severely hampered its all-around development."
 state_lore_initials.129: "TAI"
 state_lore_name.129: "Taiyuan"
 state_lore_desc.129: "Taiyuan developed into a manufacturing city in the early twentieth century, while she also earned profits from trade and commerce. After the chaos of the Xinhai Revolution, Taiyuan came under the control of the clique Yan Xishan. Under Yan's rule, Taiyuan industries flourished, and the Taiyuan Arsenal quickly became one of the largest arsenals in China.\n\nDuring the Second Sino-Japanese War, Yan Xishan and Communist general Zhu De organized a stubborn resistance in Taiyuan. The Japanese Army commented, \"Nowhere did the Chinese fight so tenaciously.\" At the end of 1937, the Japanese Army occupied Taiyuan and took full advantage of its various resources. The city of Taiyuan provided supplies for the Japanese Army, thus supporting one operation after another by the Japanese to clear the Communist bases. During this time, the resources and materials of the mountainous regions of Shanxi were fed into the Japanese war machine, and Taiyuan's development came to a standstill. However, due to its manufacturing importance, Taiyuan remained an important city that the new government intended to proceed to control.\n\nHowever, the increasingly chaotic situation there was not good for reorganizing the national government. Unable to establish a solid regime there, the Nanking government allied itself with Yan Xishan and gave him de facto control of the entire Shanxi province. When Yan Xishan died, Fu Zuoyi succeeded him and ruled Shanxi, but he was much more conservative than Yan Xishan. Although Taiyuan is still the central manufacturing town in China, other cities are growing. They have even more relatively long-term vision, and in comparison, it seems that they can catch up in a few days."
 state_lore_initials.130: "XIA"
 state_lore_name.130: "Xi'an"
 state_lore_desc.130: "As China entered the twentieth century, Xi'an became the only revolutionary town in the north. From Yuan Shikai to the Zhen Song Army, reactionary forces could not break Xi'an's backbone, and the chaos in China ended there.\n\nIt was here that Yang Hucheng, once the master of Xi'an, staged a military coup to force Chiang Kai-shek to stop the civil war and make all of China put aside its differences and unite with the outside world. But chaotic episodes remained: a plot was hatched to put Hu Zongnan on the throne of Xi'an, and Yang Hucheng was imprisoned in Nanking and killed in a massacre perpetrated by Japan.\n\nDuring Hu's time, Xi'an received a sizeable industrial base and population from the fallen areas in the East, but development was not the central theme. Caught between northern Shaanxi and Chongqing, Xi'an was both a stronghold for Chiang Kai-shek to spy on the Communists and a battleground for the spy war between the Communists and the state, giving a hint of coldness to piggyback on the fire of the typical resistance to Japan.\n\nIn 1944, the defeat of Yuxiang Gui and the violent death of Chiang Kai-shek brought tragedy to Xi'an. Xi'an, which had lost its central command, was like a kite with a broken string and no one to rely on, and the city was full of wind and rain. The Japanese artillery could penetrate the Tongguan Pass, and the invasion was imminent. The anxious Communists quickly took over Xi'an at the cost of exposing their underground organization.\n\nJapan could bomb this thousand-year-old city at any time, and Xi'an, the only major city in Communist hands, could not let the invaders destroy this hard-earned golden apple. Since the Communists took over the town, a civil defense project called \"deep digging\" never stopped. As CPC evacuated the city, CPC dug strategic air-raid shelters beneath all the buildings in Xi'an, CPC filled factories with anti-aircraft guns, CPC turned government buildings into arsenals, and temples were converted into hospitals. Homes were filled with soldiers...The Communists wanted to return the favor with a heavily armed fortress: China's determination to resist was higher than the mountains, more profound than the sea, and more impregnable than diamonds. More impregnable than diamond."
 state_lore_initials.131: "WUH"
 state_lore_name.131: "Wuhan"
 state_lore_desc.131: "Although the city's existence as a political entity dates back only to 1927, when the Kuomintang government merged Hanyang, Hankou, and Wuchang, millions of people have called the three towns their hometowns since they were settled there in 1500 BC.\n\nWuhan has been in the spotlight of Chinese politics since 1911 when the world-shaking Wuchang Uprising broke out, and in 1937 it became the capital of China and thus the main target of the Japanese offensive in the Second Sino-Japanese War. In the massive Battle of Wuhan, millions of Chinese soldiers and civilians fought to defend the city, but the Japanese still had the upper hand, and Wuhan fell in late 1938. The war ended with a Japanese victory, and Wuhan was left as a pile of rubble.\n\nIt would take years and decades of effort to rebuild the city back to its pre-war state. Today, Wuhan is the only city in China untouched by uprisings and unrest, and it remains one of the most important cities for the Chinese government."
 state_lore_initials.132: "XUZ"
 state_lore_name.132: "Xuzhou"
 state_lore_desc.132: "Xuzhou is a mega-city in Jiangsu province and has been a place of contention for soldiers since ancient times. During the Xinhai Revolution, fierce battles broke out in Xuzhou, which soon fell into the hands of Zhang Xun, who has been entrenched here ever since. When the Northern Expeditionary Army arrived in Jiangsu, the Nationalist government waged a tug-of-war with the local cliques and the Beiyang army, finally capturing Xuzhou at the end of 1927. Xuzhou was the key to the Nationalist government's continued control of the lower Yellow River.\n\nIn 1938, the Second Sino-Japanese War broke out, and the Japanese army reached Xuzhou, leaving the Chinese high command in panic. The defense of Xuzhou was quite hasty, and although the Nationalist Army achieved some early victories in several battles, the situation was ultimately irreversible. Chiang Kai-shek had to order a full-scale retreat. To cover the retreating troops, the Nationalists blew up the Yellow River barrier, and the ensuing 1938 Yellow River flood destroyed most of Xuzhou and nearby towns.\n\nMore than twenty years after the terrible flood that flattened Xuzhou, the city has become a pearl of the North China Plain again, but the wounds of the Second Sino-Japanese War are still far from healed. The economy of the reorganized national government had not taken off, and it was difficult for Xuzhou to revive or even surpass its pre-war economic level."