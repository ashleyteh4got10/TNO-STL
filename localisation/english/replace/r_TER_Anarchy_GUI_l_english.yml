l_english:
 TNO_Anarchy_CPC_hell_tt: "§fThe Great Northwest§!"
 TNO_Anarchy_CPC_hell_tt_delayed: "China's history is so long, so long that thirty years is only like a lonely waterdrop in the river; even if it contains the bitterness of mass bleeding, it is still so ordinary, just like others, and its taste is no greater than a glass of freshly cooled plain boiled water.\n\nThe Savior of forgetfulness will soon descend upon the  scorched earth, for all those moving words of those who struggled, those faces and voices weighs heavily in your mind, the quicksand will bury them all on the fastest pace until the end of time. No need to regret that you did not know the names of these rebels, there are so many things on earth you don't have to know, eat as usual, sleep as usual, the sun rises as usual, the people who still have a breath have long understood that to resist is stupid as hell.\n\nSnowflakes rest on the scarred earth of the Great Northwest, covering the reality of barren death and then sink into it. The whirlwind strikes in, rolling up the jade trees, rise in the boundless wilderness, filling this suffocating earth.\n\n§mYeah, that is snow, the solitude, the raindrops long dead, the deceased spirit rest within.§!"
 CPC_eternal_damage_1: "Eternal Ruins"
 CPC_eternal_damage_1_desc: "No one is responsible for the disaster, and the Great Northwest has passed away without hearing the cries and mourning of those who followed.\n\nThe nuclear explosion destroyed the cities, the radiation killed the lands and lives. Even people with some brain damage are not so shameful as to claim that this place is suitable for living and needs to be developed. The ending of this land has been published in academic journals by Japanese experts who set foot in the northwest wearing protective clothing for researchers to explore.\n\nSkulls rest upon blood and tears of the victims, piled layer after layer upon the barren fields, all of them witnesses the apocalypse. In a few decades or centuries, perhaps the GOD will place life on this land once more, until then, the unfinished business could be done."
 CPC_eternal_damage_2: "No Cure"
 CPC_eternal_damage_2_desc: "No one is responsible for this disaster, the Great Northwest has died, not to hear the cries and mourning of the future.\n\nIn ancient China, cremation was seen as a bad omen, unless a plague hit and countless people perished, that' the time when the deceased were hastily burned and buried, but the cremation around the clock was unprecedented in history. Time to discuss why the Chinese failed to save themselves from the pestis and cholera, perhaps because of the ineptitude of modern medicine, but that means nothing to the dead.\n\nSkulls rest upon blood and tears of the victims, piled layer after layer upon the barren fields, all of them witnesses the apocalypse. In a few decades or centuries, perhaps the GOD will place life on this land once more, until then, the unfinished business could be done."
 ZXB: ""
 ZXB_DEF: "the Anarchic Zone of Northwest China"
 ZXB_ADJ: "Anarchic"
 CPC_eternal_damage_3: "Scorched Earth"
 CPC_eternal_damage_3_desc: "The war has inflicted wounds on the land of China that will probably not be healed for another centuary.\n\nThe black of ruins and the black-yellow of scorched earth have become the dominant colours of the land that was once known as the \"Middle Kingdom\" - a land that is almost certain to face famine and death in the next few days if something is not done about it.\n\nThe people of the land were still struggling to survive, and perhaps one day they would be able to tear themselves away from the despairing status quo - but not now."
 CPC_eternal_damage_4: "Corroded Ruins"
 CPC_eternal_damage_4_desc: "The war has inflicted wounds on the land of China that will probably not be healed for another centuary.\n\nThe land of plenty that was Sichuan, once fertile and abundant, now lacks even a single blade of grass; the southwestern rainforests, once full of vitality, are nothing but withered trees and dead leaves; the marketplaces, once teeming with voices and life, are now the site of corpses scattered across the land...\n\nThe people of the land were still struggling to survive, and perhaps one day they would be able to tear themselves away from the despairing status quo - but not now."