l_english:
 POLITICS_GLN_DESC: "John Glenn's meteoric rise to the presidency came as a surprise to observers of the normally cautious and conservative Republican-Democrats. Only six years after his final trip to space and initial foray into politics, the new commander in chief faces a situation with more possibility than any president in recent memory. While Germany and Japan struggle to keep their empires afloat, Glenn is looking to the stars.\n\nTo nobody's surprise, the Glenn administration has chosen to prioritize spaceflight and the race to conquer the final frontier. The first man in space and the first astronaut to hold political office, Glenn invested heavily in aerospace companies during his time as Governor of Ohio, a trend which is likely to continue. With America's advances in missile and rocket technology, a trip to the moon is not out of reach. And once the moon is conquered, who knows where NASA could go next?\n\nBut Glenn did not just win political office because of his fame. A successful program of welfare reform as Governor of Ohio has gained him the support of both elderly and impoverished voters, and put to rest claims by his opponents that Glenn has his head in the stars.\n\nWhile Glenn will not neglect America in favor of the space program, those who know him privately can tell what his goals truly are. He only speaks about Köllner's moon landing with measured restraint, giving the public a dispassionate and clearly rehearsed line, but his first budgetary requests have made his intentions clear: Glenn's America will return to the stars. Failure is not an option."
 WORLD.7120.t: "[Get_newspaper_header]John Glenn Inaugurated as President of the United States"
 WORLD.7120.desc: "The Republicans today celebrate their return to power, with former astronaut John Glenn securing victory over the incumbent National Progressive Party to become the next president. In his inauguration speech, Glenn praised the unique spirit of the American people, encouraging all Americans to dare to dream big and strive for greatness.\n\nThe first American in orbit, it would seem Mr. Glenn's heart never truly left the great beyond. He has vowed to push America forward in the Space Race, promising massive funding increases to NASA and elaborated on extravagant mission plans to once and for all put America ahead of the fascists in the realm above. Critics call him an idealist who intends to throw away money on unnecessary passion projects, but many others cheer on his bold vision, and hope that he might usher America, and the world, into a new age of science."
 WORLD.7120.a: "Bah! Space belongs to the Reich!"
 WORLD.7120.b: "Perhaps their wild space adventures will keep them busy?"
 WORLD.7120.c: "May they boldly go where none have gone before!"
 WORLD.7120.d: "The Americans reach for the stars."
 WORLD.7620.t: "[Get_newspaper_header]John Glenn Secures Second Term"
 WORLD.7620.desc: "John Glenn vowed to shoot for the Moon, and it seems that he has stuck the landing. After a successful first term which saw many prestigious feats of space flight and popular domestic policies, the former astronaut-turned-president has secured a second term for his administration.\n\nGlenn's push for space exploration shows no sign of slowing down, with even more ambitious missions on the books at an empowered and well-funded NASA. Critics argue that the president is sinking too much money into 'vanity projects,' while Republican-Democrats hope that their continued push for internal development and social security nets will be enough to keep the people on their side."
 WORLD.7620.a: "Get your head out of the clouds!"
 WORLD.7620.b: "Get your head out of the clouds!"
 WORLD.7620.c: "On to the Red Planet?"
 WORLD.7620.d: "On to the Red Planet?"
