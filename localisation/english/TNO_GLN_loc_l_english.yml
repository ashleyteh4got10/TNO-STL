 BOOKMARK_NOVOSIBIRSK_USA: "§xUnited§!§W States of §!§BAmerica§!"
 BOOKMARK_NOVOSIBIRSK_USA_DELAYED: "§OAdded in the §!Next Ten Years§O version:§!\n\n§YGlenn's 1976 Election Term extends playable timeline to 1984§!\n\nAll-new GFX interface and narrative text\n\nDynamic nuclear, warfare, and political mechanics\n\nLead America from lunar defeat to Martian triumph within eight years§!\n§W--------------\n\n\n£GFX_texticon_bookmark_USA\n\n\n\n\n§FIn 1962, President Nixon's executive order nearly dismantled §mNASA§F. As America's first orbital astronaut, §WJohn Glenn§F was devastated, vowing to resurrect his cosmic vision.\n\nIn 1964, §WGlenn§F launched a high-profile campaign for governor, ultimately securing a Senate seat from Ohio. He bided his time, preparing his ultimate ascent.\nWhen the §ONational Progressive Convention§F collapsed in 1976, §WJohn Glenn§F recognized his moment. Declaring his presidential bid, he aimed to reclaim America's destiny: revitalizing §mNASA§F and charging toward the §eNew Frontier§F.§!"
 USA.GLN_flavor.1.t:0 "Stellar Dreams"
 USA.GLN_flavor.1.desc:0 "He soared in his rocket ship above the Earth. As he gazed through the capsule window at the continents stretched out beneath him, he realized just how small mankind truly was. It occurred to him that if every human being had the opportunity to see what he could see - how insignificant all the struggles and wars and vendettas were - the world might finally know peace. A peace where everyone could work towards the advancement of science, prosperity and-\n\nA sudden ringing cut across his psyche, and he was jolted from a dream of days past. Sitting sluggishly awake from his sadly earthbound bed, he fumbled for the telephone on his bedside cabinet and pulled the receiver to his ear. "John Glenn, speaking - way too early in the morning might I add."\n\nA panicked voice came across the line. "John, it's James. Have you heard the news?"\n\nGlenn rubbed the sleep out of his eyes and replied "James Edwin Webb, I have not even got out of bed yet. Be more specific-"\n\n"They're defunding NASA!"\n\nA hastily-made coffee and frantic flip through the morning paper later, and John Glenn felt a wrench in his gut as he faced the prospect of his life's work being all for naught. "So what, the Germans got to the moon first and that just means space is over? What can we do? They can't just give up on the future!"\n\n"Nixon's already made his mind up. He wants to move the money over to the military and other 'practical projects'". Webb paused as Glenn made an outraged intake of breath. "I really don't think there's anything that can stop him at this point. I'm sorry, John."\n\nGlenn felt himself back in the reverie of space flight. The government could not let the dream of space be but a dream. America had to live to see the stars. "Nothing we can do? We'll see about that.""
 USA.GLN_flavor.1.a:0 "Some men still dream."
 USA.GLN_flavor.2.t:0 "In Defence of the Stars"
 USA.GLN_flavor.2.desc:0 "John Glenn stood before an assembled mass of scientists, engineers, science-enthusiasts and journalists. He had already spoken with a few people and shared in their frustration at NASA's situation, talked about his experiences as an astronaut, and even signed a couple of autographs. Now, he needed to make a big splash.\n\n"I had just been having a pleasant dream about my last mission, when my good friend James Webb woke me with the news. I was distraught, to say the least, to know that the government was giving up on the future of space travel. Partly because the thought of never going up there myself again is saddening to consider, but that's not the only reason.\n\n"By ending our involvement in space, President Nixon has given up. He has accepted stagnation and decline, abandoning the stars to the fascist powers. He says we 'lost' the space race, but as long as the stars still shine space will never be lost. I implore that the President reconsider his options. The future of America, and the human species as a whole, lies above us."\n\nAbout twenty minutes later, Glenn made his closing remarks, and was greeted with raucous applause. He felt satisfied that his words had hit their mark, and with so many journalists in attendance tomorrow's papers would carry them further still. Yet he still felt defeated. His words alone would not be enough to save NASA.\n\nIf American space travel was to have a future, it would need a voice to represent it in the halls of power. John Glenn had never been one for politics, but as he thought on it, he realised that political office may be his best course of seeing his dream fulfilled. As he drove home, he recalled that Ohio's governorship was up for election in a few months. It was an almost crazy thought, and yet..."
 USA.GLN_flavor.2.a:0 "An astronaut in office?"
 USA.GLN_flavor.3.t:0 "John Glenn Wins the Ohio Gubernatorial Race!"
 USA.GLN_flavor.3.desc:0 "At the end of a nail-biting election that literally came down fractions of a percent, untested politician John Glenn has been elected governor of Ohio for the Republican wing of the R-D Party. A popular figure among Middle Americans and a household name from his auspicious career as America's most prominent astronaut, Glenn's victory has cemented the political ambitions that began when he gave a major speech criticizing Nixon's decision to defund NASA.\n\nFor now, Glenn sits in the Ohio Statehouse planning his next move, thinking in decades. With his popular support and now his political foothold as governor, there is practically no limit to how far his ambition can take him. Already he imagines himself in the White House, and begins to set into motion his glacial plan to get there and change the fate of America forever. Even if such a goal would yet be so far away.\n\nThe phone rings. He picks it up, knowing Nixon to be on the other line, and accepts the President's gritted congratulations with magnanimity. Glenn knew he could deal with Nixon and his ilk. Nobody could stand in his way to the Presidency."
 USA.GLN_flavor.3.a:0 "One giant leap."
