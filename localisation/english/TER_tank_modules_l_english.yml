l_english:
 
 TER_unique_37_Type98:0 "37 mm Type 98"
 TER_unique_37_Type98_desc:0 "37 mm Type 98 Tank Gun. "
 TER_unique_37_Type100:0 "37 mm Type 100"
 TER_unique_37_Type100_desc:0 "37 mm Type 100 Tank Gun. "
 TER_unique_47_Type1:0 "47 mm Type 1 Tank Gun"
 TER_unique_47_Type1_desc:0 "The 47 mm Type 1 tank gun is a Japanese dedicated anti-tank gun to improve the anti-tank capability over the 37mm Type 94."
 TER_unique_75_Type90:0 "75 mm Type 90 Field Gun"
 TER_unique_75_Type90_desc:0 "The 75 mm Type 90 field gun was adopted in 1930 meant to replace the older Type 38.It also saw limited use on some Japanese Armored Vehicle."
 TER_unique_76_M32:0 "76 mm M32 Tank Gun"
 TER_unique_76_M32_desc:0 "76mm M32 was the first U.S. tank gun equipped with a bore evacuator. Its purpose was to clear the gun tube after firing. "
 TER_unique_90_Mk3:0 "90 mm Cockerill Mk.3"
 TER_unique_90_Mk3_desc:0 "The 90 mm Cockerill is a light weight, low pressure gun, intended to be mounted on light tanks and wheeled armored vehicles."
 TER_unique_105_LRF:0 "105 mm LRF"
 TER_unique_105_LRF_desc:0 "Low Recoil Force (LRF) version of the 105 mm rifled gun, intended to be mounted on light tanks and wheeled armored vehicles."
 TER_unique_90_M3A1:0 "90 mm M3A1 Tank Gun"
 TER_unique_90_M3A1_desc:0 "The 90mm M3A1 tank gun is based on 90mm M2 AA gun, housing a muzzle brake and bore evacuator, which slightly increases penetration power."
 TER_unique_90_M41:0 "90 mm M41 Tank Gun"
 TER_unique_90_M41_desc:0 "The 90 mm M41 is an improved version of the M3A1, it had a higher muzzle velocity, using new ammunition loaded to produce higher chamber pressures."
 TER_unique_106_M40x6:0 "106 mm M40 Recoilless Rifle(x6)"
 TER_unique_106_M40x6_desc:0 "The M40 recoilless rifle is a lightweight, portable, crew-served 105 mm weapon intended primarily as an anti-tank weapon."
 TER_unique_90_T208:0 "90 mm T208 Tank Gun"
 TER_unique_90_T208_desc:0 "The 90 mm T208 is an American smooth bore tank gun.Can fire High velocity APFSDS round with good penetration."
 TER_unique_105_Type83:0 "105 mm Type 83 Tank Gun"
 TER_unique_105_Type83_desc:0 "The Type 83 is a Chinese produced variant of the T210 105 mm smoothbore gun.The muzzle velocity of the round was 1740 m/s, with an armor penetration of 152 mm at 60 degrees at 2000 yards."
 TER_unique_120_M256:0 "120 mm M256 Tank Gun"
 TER_unique_120_M256_desc:0 "The 120 mm M256 is an American smooth bore tank gun, a high velocity, quick-firing, accurate, direct fire weapon used primarily against enemy tanks and hard targets."
 TER_Unique_155_T180:0 "155 mm T180 Tank Gun"
 TER_Unique_155_T180_desc:0 "A lighter weight version of the 155mm Gun T7, the gun developed for the Heavy Tank T58. Firing HEAT through this gun."
 
 TER_Unique_IFV_76_D56T:0 "76.2 mm D-56T Tank Gun"
 TER_Unique_IFV_76_D56T:0 "The D-56T is an anti-tank gun of 76.2mm calibre. It can fire five types of rounds, using a manual loader system."
 TER_Unique_IFV_85_D58:0 "85 mm D-58(2A22) Cannon"
 TER_Unique_IFV_85_D58_desc:0 "The 85mm D-58 cannon was equipped with a two-plane stabilizer and a loading mechanism. "
 TER_Unique_MBT_100_D10T:0 "100 mm D-10T Tank Gun"
 TER_Unique_MBT_100_D10T_desc:0 "The D-10T tank gun is a 100mm rifled cannon, known for its high muzzle velocity, strong armor-piercing capability, and simple, reliable design."
 TER_Unique_MBT_100_2A24:0 "100 mm D-54TS(2A24) Cannon"
 TER_Unique_MBT_100_2A24_desc:0 "Based on the D-10, it is a tank gun made by increasing the charge load and increasing the chamber and barrel pressure to enhance performance."