l_english:
 SE_TRCW_D: "A just cause has many helpers; \nan unjust one finds few followers.\n- Mencius"
 SE_TRCW_A: "The Red Flag waves."
 SE_SOUTHWESTERN_CHINA_WAR: "Southwestern War"
 TNO_SE_SOUTHWESTERN_CHINA_WAR: "Southwestern War"
 SE_SOUTHWESTERN_CHINA_WAR_D: "Those who drag on an ignoble existence will catch a vague glimpse of hope amid the pale bloodstains, while true fighters will advance with greater resolution.\n- Lu Xun"
 SE_SOUTHWESTERN_CHINA_WAR_A: "Heaven is with me!"
 SE_TRCW: "East Asian Liberation War"
 TNO_SE_TRCW: "East Asian Liberation War"
 SE_TER_WE_HAVE_GOTTEN_THE_NUKE: "Miss Autumn"
 TNO_SE_TER_WE_HAVE_GOTTEN_THE_NUKE: "Miss Autumn"
 SE_TER_WE_HAVE_GOTTEN_THE_NUKE_D: "A remarkable beauty lies in the North.\nWith just one glance, she can captivate a city or a country.\nSince such beauty is rare, why not let both fall for her?\n- Li Yannian"
 SE_TER_WE_HAVE_GOTTEN_THE_NUKE_A: "Rising higher still"
 SE_TRCW_good: "East Asian Liberation War"
 TNO_SE_TRCW_good: "East Asian Liberation War"
 SE_TRCW_bad: "East Asian Liberation War"
 TNO_SE_TRCW_bad: "East Asian Liberation War"
 SE_TRCW_good_D: "If a man in the morning hears the true Way,\nhe may die in the evening without regret.\n- Confucius"
 SE_TRCW_good_A: "The Red Flag waves."
 SE_TRCW_bad_D: "One's character emerges from fate, \none's fate descends from Heaven.\n- Confucius"
 SE_TRCW_bad_A: "The Red Flag waves."
 SE_CHINA_REUNIFIED_GOOD: "East Asia Reborn"
 TNO_SE_CHINA_REUNIFIED_GOOD: "East Asia Reborn"
 SE_CHINA_REUNIFIED_GOOD_D: "The endless streams of people, the bright and colourful flags, the hoarse and mournful slogans, continue to boil in the streets and over the streets of the ancient homeland, and the majestic steps continue to march on and on - and on and on...\n- Yang Mo"
 SE_CHINA_REUNIFIED_GOOD_A: "From ashes, new life."
 SE_CHINA_REUNIFIED_BAD: "Eternal East Asia"
 TNO_SE_CHINA_REUNIFIED_BAD: "East Asia's Eternal Rest"
 SE_CHINA_REUNIFIED_BAD_D: "Every time I see this empty car drive by, I can't help but watch it disappear into the distance. What this car should carry, I've never thought about it.\n- Mori Ogai"
 SE_CHINA_REUNIFIED_BAD_A: "From ashes, new life."
 SE_CHINA_REUNIFIED_NORMAL_MAO: "East Asia Revived"
 TNO_SE_CHINA_REUNIFIED_NORMAL_MAO: "East Asia Revived"
 SE_CHINA_REUNIFIED_NORMAL_MAO_D: "He was hidden by the crowd, yet I saw him again. It's as if I'll forever see his delicate, thin frame flickering in and out of view among the people. He used his faintly shimmering, slightly moist eyes to caress so many.\n- Ding Ling"
 SE_CHINA_REUNIFIED_NORMAL_MAO_A: "From ashes, new life."
 SE_CHINA_REUNIFIED_NORMAL_LIU: "East Asia Revived"
 TNO_SE_CHINA_REUNIFIED_NORMAL_LIU: "East Asia Revived"
 SE_CHINA_REUNIFIED_NORMAL_LIU_D: "Countless red flags with shining gold stars, beckoning back and forth in front of his eyes, gradually dissolving into brightest red...The corner of his mouth moved slightly, and he smiled at last towards the sea of victorious flags.\n- Luo Guangbin and Yang Yiyan"
 SE_CHINA_REUNIFIED_NORMAL_LIU_A: "From ashes, new life."
 SE_CHINA_COLLAPSED: "East Asia's Eternal Rest"
 SE_CHINA_COLLAPSED_D: "Great is the virtue of our Emperor, who pacifies all four corners of the earth.\nWho punishes traitors, roots out evil men, and with profitable measures brings prosperity.\n- The Qin Inscriptions at Langya"
 SE_CHINA_COLLAPSED_A: "Could the dawn melt a millenium of snow?"
 SE_CHINA_IS_IN_HELL: "East Asia's Cinders Put Out"
 TNO_SE_CHINA_IS_IN_HELL: "East Asia's Cinders Put Out"
 SE_CHINA_IS_IN_HELL_D: "Flowers and fog come at night, are gone by dawn;\nOften I dream of spring, but it leaves no trace.\n- Bai Juyi"
 SE_CHINA_IS_IN_HELL_A: "Could the dawn melt a millenium of snow?"
 SE_TER_RGOC_WIN: "The Twilight Path of East Asia"
 TNO_SE_TER_RGOC_WIN: "The Twilight Path of East Asia"
 SE_TER_RGOC_WIN_D: "\"Sell it! Sell it! I await the buyer.\"\n——Confucius"
 SE_TER_RGOC_WIN_A: "Long and Arduous Road."