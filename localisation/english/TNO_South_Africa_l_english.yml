 HDV_SAF.223.a: "The end of a lion of liberalism."

 HDV_SAF.224.t: "Back to Work"
 HDV_SAF.224.desc: "Graaff opened the doors to his office with a quiet smile. He had once doubted that he would ever make it this far, especially after the chaos and hell of the South African War, yet here he was again. De Villiers Graaff, Prime Minister of South Africa, for another five years. As he stepped toward his desk, piled high with papers as always, a look of satisfaction spread across his face. How could he ever have doubted himself, or the well-oiled political machine that supported him? The United Party, in one form or another, had governed the nation since 1934, and it would continue to do so. No Boer uprising, no German war, and no conservative splitters had managed to stop him, and none ever would.\n\nHe turned to the window behind his desk, which offered a clear view of Table Mountain, glowing in the light of the setting sun. The Prime Minister's smile deepened, filled with quiet pride. This country, his country, with its sweeping landscapes and natural beauty, still stood as a beacon of liberty in the Dark Continent. The proud spirit of the British Empire remained alive here, unbroken. South Africa had reclaimed its rightful place beside the Allies, where it had always belonged. In truth, neutrality had only been a delay of the inevitable German assault.\n\nOutside, Cape Town glimmered in the orange light of dusk. People went about their evening as if the war were already a distant memory, something for historians to study. Graaff wondered how history would remember him and his party. Surely it would be with respect. The pages of South African history would, he thought, speak of him as a legend, perhaps even an equal to Jan van Riebeeck.\n\nBut his work was not finished. His story was still unfolding, and the nation had once again called upon him to guide it toward a brighter future. That was his task, his calling, and his home.\n\n\"South Africa forever.\""
 HDV_SAF.224.a: "He sat down at his desk and got back to work."

 HDV_SAF.225.t: "The Moment of Truth"
 HDV_SAF.225.desc: "The clock slowly ticked up to the full hour. Eight o'clock in the evening seemed so close and yet so far. For the first time in modern history, the dominant party system that had continued the United Party's complete grip on power in South Africa since 1934 seemed to be cracking. Its conservative wing had split off to form its own party, while on the left, the Progressive Party seemed booming, seemingly making it an inevitability that the United Party would be knocked from the throne it had sat on for decades.\n\nIn three different places in Cape Town, the three different parties gathered to see who would win. The Conservative splitters under Vause Raw, the United Party still led by Sir De Villiers Graaff and the Progressive Party under Harry Schwartz were waiting for the full hour when the truth would be revealed about the heavily contested election.\n\nWhen that time finally came; the nation all turned to their TV's, the lesser fortunate in community TV halls, and those below by radio to listen to the news announcer's finely accented upper class English.\n\n"The S.A.B.C. exit poll for the elections of [?global.date.GetDateStringNoHourLong] are in. Taken across the land in key constituencies that will decide the fate of our nation for the next five years, this exit poll indicates that due to a surge in support for the New Conservative Party..."
 HDV_SAF.225.a: "The United Party has lost its majority."

 HDV_SAF.226.t: "A Victory for Decency"
 HDV_SAF.226.desc: "Cheers and celebrations erupted as the results continued to roll in, with Vause Raw in the middle of the room, celebrating. General Bernard Montgomery stood by looking happy, still dressed in his full uniform, though he had retired for the very last time only recently.\n\nThe United Party had lost its majority while remaining the nation's biggest political party, but its composition had been forcibly changed, as the NCP mainly ran in districts opposed to the more progressive wing of the party, delivering a crippling blow to Eglin's progressives. Div would be on his way out, Eglin too, and the new leadership of the UP would come to form a coalition with him.\n\nThe Progressive Party, the uppity, naive lot they were, had been soundly rejected by the nation, leaving only the NCP and UP as serious political parties that could wisely lead the nation. Sure, Raw had missed his chance to become Prime Minister, but the fickle tide of progressivism had smashed upon the rocks of the NCP and scattered afterwards.\n\nOnly a strong, firm, and conservative government could lead this nation forward, and already Vause was thinking up demands he could make of the United Party to make sure that South Africa would truly remain a White man's nation."
 HDV_SAF.226.a: "A turn to the right is on the cards."

 HDV_SAF.227.t: "End of a Career"
 HDV_SAF.227.desc: "The elections in South Africa had come with one gut-wrenching conclusion: the United Party had no clear majority. While not an absolute sign of defeat at the moment, per se, the harrowing news swept around the ranks of the voters of the United Party, leaving behind only concern mixed with just a bit of depression.\n\nJacobus Strauss walked in De Villiers Graaff's private room behind the stage without knocking, with a thin smile on his face as he glanced at the Prime Minister. Eglin had barely held on to his seat, and with Div failing to uphold the party, Strauss would lead the party, and thus the nation, in no time.\n\nThe Prime Minister was perched on his leather chair, still, in absolute silence. He flickered through the provided electoral data, creasing its sides over and over again, rechecking it to hope that it wasn't true, that there was some form of error. But it spoke all too clearly; the New Conservative Party had taken away his majority. It was over, not for the party, but for Div's career, that much is certain." He turned to look at Strauss, and the two men suddenly were locked into a silent battle of stares.\n\n"Get out, Jacobus. I have nothing to say to you."\n\n"Well, I do have something to say to you. You lost, you failed, now exit with some grace before I have to go and humiliate you in public. Actually, yes, do stick around, that will be much more enjoyable for me after all." Strauss walked out and slammed the door shut, leaving Div there alone, listening to the echo of the door slam fade away.\n\nThe Prime Minister flicked his lighter over the front of a cigarette, took a drag of it, and turned in his swivel chair to face the window that looked out over the city around the building. First, he had fought a struggle to keep the Union of South Africa together, and now, he had to struggle to keep a United Party together, and in that, he had failed. There was no doubt in his mind that his political career was now over, and he should take a bow and pursue a polite exit before his party would aggressively show him the door. It was just a darned shame that Strauss would end up being the next Prime Minister instead of someone else, but there was nothing he could do about that now."
 HDV_SAF.227.a: "Time to retire back to his vineyard."

 HDV_SAF.228.t: "Back To Reality"
 HDV_SAF.228.desc: "The Progressive Party had taken a blow. It had not just lost, but the country seemed to have backed the Conservatives instead. Not only had the Progressive Party failed to gain any seats, but their potential allies in the progressive wing of the United Party had taken a great blow as well. In effect, this was enough to fully sideline progressivism as an idea, leaving it off even worse than before.\n\nWhile the crowds thinned somewhat, the party stuck together even though the dark clouds hanging over them were most apparent. In this moment, Harry wondered to himself if he had been naive in hoping for a turnaround for his party and thus his nation. A step forward, adapting to the reality on the ground and not the dogmas of fat oafs like Raw, who spent time lecturing people on how things should be. But that man whom Harry so despised would be in government, and he would be left with no other choice but to figure out some way to hold back the influence of the NCP.\n\nBut what truly was worst of all was that he had allowed himself to hope. To hope for a chance, a turnaround, a new start, none of which they got. It truly was the hope that he had that was now killing him inside. Quietly, he cursed himself for daring to believe and not just settling for modest expectations."
 HDV_SAF.228.a: "Their fate would turn one day, but it was not today."

 HDV_SAF.229.t: "The Correct Timing"
 HDV_SAF.229.desc: "The longer the evening dragged on, the quieter it got at the United Party Headquarters. It had become apparent that the New Conservative Party, founded by Vause Raw and cheerleaded by General Bernard Montgomery, had caused the United Party to lose its majority of seats in parliament. While the UP would still be in government, it would now have to strongly contend with the wishes of its conservative coalition partner. For most people at the UP, they wondered, but Div had already made up his mind as he ascended to the stage and took up a place in front of the television cameras.\n\n"Fellow South Africans." He paused for a moment to give a polite nod. "I want to start with congratulating the New Conservative Party and its leader, Vause Raw, on their victory tonight. The people of South Africa have spoken, and they have decided to turn in a conservative direction. Hopefully, soon we can begin negotiations with the NCP to form the next government and continue to build a prosperous future for our nation."\n\nAnd then, dead air followed. Div glanced around the room, to his colleagues, to the members of the media, and back into the camera without saying a word for ten seconds. The photo cameras continued to click as Div's tongue awkwardly moved his tongue around in his mouth. It was simply the best move for him, as a politician, to take this drastic step, no matter how much it hurt to do so.\n\n"But I will not be a part of that." He put his hands on the lectern. "I have decided to retire from politics altogether and resign as leader of the United Party, stepping down now that my task is completed. When I was chosen as Prime Minister in 1956, I vowed to bring the modern era to South Africa, and our nation still stands as a beacon of freedom and prosperity in an Africa that is rapidly changing. Then came the war, and the great existential struggle against the Germans as they goose-stepped southwards towards the Cape, thinking of an easy conquest. But no, no, they would not crush South Africa, and with help from our friends and allies in the Organization of Free Nations, we stood firm against the tides of darkness."\n\n"It has been an honour being your Prime Minister for these turbulent years, and I am proud to know that South Africa has become all the better for it. I know that I leave this nation in fine hands, and look forward to a proper retirement in my vineyard. Good night, and God bless you and your families." With a final nod to the camera, Div walked off to the back rooms rather quickly, and some claimed to even see him get a bit teary-eyed before the door closed and the room erupted in conversation."
 HDV_SAF.229.a: "A long career in service to the nation finally ended."

 HDV_SAF.230.t: "A Long Overdue Retirement"
 HDV_SAF.230.desc: "For decades, regarded within South African political circles as one of the most capable men in the halls of government, Deputy Prime Minister and Minister of Education Jan Hendrik Hofmeyr has announced his retirement from political life. While this comes as a surprise to much of the public, it's an open secret to those with the right connections that Hofmeyr's health has been in decline for some time. Renowned as a thorough and brilliant administrator, his retirement has naturally been carefully prepared for and planned over the course of months, ensuring a smooth transition, and now the time has finally come to pass. \n\nAdored by the liberal stalwarts that have always formed the core of his support, even Hofmeyr's political opponents, who certainly did not love his inflexibility, must admit a grudging admiration for his adherence to his principles. Even among his fellow Afrikaners, few of whom share his liberal sentiments, there is a sort of quiet respect for his administrative and educational achievements.\n\nMany worry that the end of his political career, inevitable though it is, will result in greater difficulty for the United Party, particularly when it comes to the development of effective policies and the rallying of its base to support its agenda. Despite his concerns, and after a long and distinguished career in public service, Hofmeyr now steps aside to make way for a new generation of United Party leadership. He entrusts them with the task of building upon his legacy, hoping they will use it as a foundation to forge a more liberal and progressive future for South Africa. Only time will tell whether that hope proves well placed."
 HDV_SAF.230.a: "The end of a lion of liberalism."

 HDV_SAF.231.t: "Looking Back"
 HDV_SAF.231.desc: "To say this day had been coming for a long while would have been stating the obvious. When you enter political office, you also know that one day you will leave it, either by fate or by force. Div's time in office had been instrumental in building South Africa up into a modern, advanced nation that now rested under the security umbrella of the Organization of Free Nations. When he came to power in 1956, South Africa had been on the right track, but he did not doubt that his leadership had been instrumental in really pushing the nation forward towards a much better future. Having led the nation through its most difficult existential crisis and coming out victorious in the defence of South Africa, apparently, had not been enough to convince the electorate, who had decided to take away the United Party's majority and force them into a coalition to keep power.\n\nDiv knew deep down that he could hold on and continue to lead the United Party forward, but it was clear that his time in politics was coming to an end, and he was better off bowing out gracefully and passing the torch to the next generation.\n\nToday was his final day as Prime Minister of South Africa, and he had insisted upon cleaning out his office himself, gathering up family photos, private notes, and other such tidbits. From his well-organised paperwork he left behind to the cleaning of the rubbish bin in the corner, Div found some solace in doing it all himself while listening to the radio in the background discussing the day's events. All his personal belongings had been placed in one box that he had placed next to the door. He paused for a moment, reconsidering his decision. The United Party had lost, but not decisively so, and his decision to leave had been his own. He could still turn this around, stay right here, and fight on for his political future with a fervent speech to the nation.\n\nBut he knew one thing above all. History does not look fondly upon those who stay long after their time is up, and to stay on would be quite a risky endeavour, to say the least. He was going to miss the power, influence, and prestige granted to him by the position of Prime Minister, but this was for the best."
 HDV_SAF.231.a: "And with a heavy heart, he closed the door behind him."

 HDV_SAF.232.t: "Prime Minister Strauss"
 HDV_SAF.232.desc: "Vause Raw was the one speaking to the journalists while the new prime minister had already taken hold of his office, the smile on his face simply unshakable. Ten years, ten years it had taken him to finally sweep Div aside and take the position he had been denied in 1956. While the fat, bloated blob of his coalition partner was talking to the press outside, Strauss was getting his hands on the levers of state, beginning to set up directives to his different cabinet members and getting used to the position he had been denied for an entire decade long.\n\nGlancing around his office Jacobus was already planning changes in his mind; perhaps to modernize the it and change its style to something that fit him better. Consequently, that would further wipe away any semblance of Div's remaining influence here.\n\nBut more importantly, South Africa would have to truly assert itself further, becoming the dominant force in the wider region versus the crumbling ambitions of the Germans. At the same time, South Africa must also become a key member of the OFN in the struggle for liberty versus tyranny. South Africa would tie together the whole organization geographically, serving as the anchor point for the OFN in Africa, and totally intertwine with the markets of the free world.\n\nAt the same time, Strauss planned to crack down hard on the African National Congress, rooting out the organization in full to restore stability now that the OBW had been defanged during the war.\n\nIt was as he was looking through the cabinet layers that he found a letter emblazoned with a writing he recognized. De Villiers Graaff's last message to him, so it seemed. With a frown on his face, Strauss ripped open the letter and read it."
 HDV_SAF.232.a: "To Jacobus Nel Strauss"

 HDV_SAF.233.t: "A Letter From Div"
 HDV_SAF.233.desc: "Strauss,\n\nTradition dictates that every Prime Minister of South Africa shall send a private note to the next holder of the office. As such, it is for that reason alone that I have left behind this letter in your new office, though I doubt you will read it.\n\nWhen you lost the leadership election in '56, I had assumed that you would take well to that fact, even when I generously offered you the position of foreign minister in my next cabinet. Unfortunately, not so soon after did I come to hear more and more about your misgivings about me, a permanent tendency to bring out the knives the moment anything negative could be attributed to me. I should have had you removed from your position by then, but I figured that it would be bad for party unity. Alas, it seemed like your petty, small-minded plotting would continue after that. Now, you are to be Prime Minister, but it will not be the glorious time you envision it to be for yourself.\n\nVause Raw is out for your head, and the moment momentum moves towards him, he will drop you and the United Party like a rock and try to take your office for himself. What would history think of Prime Minister Strauss afterwards? A small note in the history books, coming right after the Prime Minister who modernized the nation and guided it through its darkest days and greatest crisis.\n\nIf I were to give you any advice, it would be to exit your office gracefully before you humiliate yourself.\n\nSigned, "
 HDV_SAF.233.a: "£SAF_div_signature"

