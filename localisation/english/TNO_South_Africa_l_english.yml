 SAF_National_Modernization_Plan: "The National Modernization Plan"
 SAF_National_Modernization_Plan_desc: "Following the inauguration of the United Party in 1934, its ministers stressed the importance of using the previously untapped wealth from our nation, for our nation. The National Modernization Plan has syphoned every last mineral extracted from our rich lands for exports into the OFN and Pakt. Utilizing our neutrality, cutting-edge equipment and technology from the best of the two powers have launched our previously agricultural industry into one of immense affluence.\n\nExtensive funding has been allocated to both industrial machinery and higher education for our young, training them to become a far more well educated workforce overall. While South Africa is not yet a centre of innovation, its developmental push forward has been nothing but promising."
