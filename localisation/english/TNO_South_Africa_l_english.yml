 #USAC_leader: "Home of the United South African Command"
 #USAC_leader_desc: "South Africa has benefitted greatly from the inheritance of the British exiles, leading to a wealth of millitary and naval experience being transfered to the Cape. WIth the new times of neutrality leaving South Africa without any proper allies, steps were taken to tend to the defence not only of South Africa, but also of the wider Southern African region that it now lorded over. The United South African Command Organization represents the next big step in South African millitary development, founded in 1948 under the leadership of prime minister Jan Smuts. USAC stands ready to defend the Cape and all its protectorates from the German menace that lurks in the north."
 #USAC_member: "Member of the United South African Command"
 #USAC_member_desc: "While ostensibly a member of a military alliance as the name states publicly, a signatory to United South African Command Organization that is not named South Africa is a puppet state who's military is under strict control of the South African government and heavily reliant upon support received from South Africa to uphold it's interests in the wider region. The founding text of USAC makes it the truth of the matter rather clear stating in the clearest terms the complete dominance of S.A. in this organization, and its member millitaries are trained and equipped by South African standards."

