 SAF_harder_mode: "§IHÜTTIG'S VENGEANCE§!"
 SAF_difficulty_category_desc: "For a more challenging, drawn out, and flavorful experience for §YSOUTH AFRICAN WAR§!, it is recommended that you enable the extra difficulty modes. These will increase the strength of the Afrika Schild nations to create a much §xharder§! South African  War.\n\nStarting with §YHEIA SAFARI§! your enemies will be noticably stronger, but still very much doable. §OCAPE UNDER FIRE§! definitly ramps up the difficulty you will face in the defence of South Africa and eventually turning the tables on the Afrikaner Volkstaat and the RK's. And finally there is §IHÜTTIG'S VENGEANCE§!, a no holds barred experience which will most definitly push South Africa to the brink of oblivion as the German forces march on the Cape with an unholy fury. §hOnce any of the difficulty modes have been selected, they cannot be disabled again.§!\n\nThese decisions will disappear one year from game start."
