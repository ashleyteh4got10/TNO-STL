 HDV_SAF.84.t: "A letter from Div"
 HDV_SAF.84.desc: "Dear Vause,\n\nCongratulations on your electoral achievement, it must not have been easy to found a party and instantly lead it to great success in these elections. As you ascend to the role of Prime Minister, I must caution you on what it entails to lead this fine nation and how to move it forward.\n\nSouth Africa is a nation steeped in tradition, a proud descendant of the British empire, and continues to be led by fine gentlemen like you to this very day. Yet it would be unwise to completely persist in the status quo that you so fiercely advocate for. To be a good Prime Minister means to be adaptable, and flexible to the ever-changing times before you are caught off guard.\n\nIn hindsight I had done too little to prepare for the war, hoping in vain that the Germans would prove to be a decent, honorable people and not a brutal horde out for world domination. I was unwilling to adapt to the changing times, and it nearly destroyed South Africa as a result.\n\nI have no doubt that you will make a fine Prime Minister, as long as you keep your eyes open and stay on your feet. Flexibility and pragmatism are, after all, the finest traits of a British gentleman.\n\nShould you need further advice on matters, I will always be available to assist.\n\nSigned,"
 HDV_SAF.84.a: "Sir De Villiers Graaff, 2nd Baronet"

 HDV_SAF.85.t: "A letter from Div"
 HDV_SAF.85.desc: "Dear Jacobus,\n\nCongratulations on managing to form a coalition with Raw's New Conservative Party and gaining the position of Prime Minister as a result. This must be very satisfying for you, to finally achieve what you have been working towards since you lost to me in 1956. I've known all along that you've been trying to take my place ever since then, and now you've finally pulled it off after the United Party has been defeated in the latest elections. I don't envision you were looking forward to a coalition with Vause and his staunch conservatives, but that is your problem now, not mine.\n\nNow it is your time to make your mark upon the nation, and I have little doubt that you will have an easy time at it now that the greatest crisis in this nation's history has already been settled by yours truly. It has been a pleasure of many years ordering you around, but alas, all good things must come to an end.\n\nShould you need further advice upon matters, you can consult Vause or any more of his treasonous splitters, I am sure he will be as eager to work with you as he was with me.\n\nSigned,"
 HDV_SAF.85.a: "Sir De Villiers Graaff, 2nd Baronet"

 HDV_SAF.86.t: "A letter from Div"
 HDV_SAF.86.desc: "Dear Colin,\n\nCongratulations on forming your coalition with the Progressive Party, I wish you the best of luck in leading the United Party forward into a new era. While we are now safe from German domination through conquest, it is not as if being subjects of the Americans is much better if we do not staunchly defend our interests.\n\nI have noticed over your period as minister of defense not just a tendency towards progressivism but a long-term interest in advancing the interests of the Americans in South Africa. While cooperation with Washington will be key for our future, it is up to you to defend South Africa from merely becoming an economic puppet state of the Americans.\n\nWe should be a key and equal member of the OFN, and I hope that you can strike a fine balance there that keeps our economic options open. Trade ties with the rest of the OFN and South America should be promoted to provide alternatives and reduce American leverage overall. They are now our friends, security partners, and allies, but should never become our overlords which may occur if you are not vigilant. I wish you and your progressive allies the best of luck in leading the nation.\n\nShould you need further advice on matters, I will always be available to assist.\n\nSigned,"
 HDV_SAF.86.a: "Sir De Villiers Graaff, 2nd Baronet"

 HDV_SAF.87.t: "A letter from Div"
 HDV_SAF.87.desc: "Dear Harry,\n\nCongratulations on your shocking victory in the recent elections. It has been another indicator of how suddenly and quickly political winds can change in a nation to see a small party like yours move forward into the political mainstream and thus into government. It is clear that your proposals for a more progressive nation have caught root and thus now you will have your chance to reshape the nation in that direction.\n\nHowever, as much as the most dangerous crisis in South Africa's history has passed, its aftermath will stay with us for far longer. The nation is not as stable as we both may wish it to be, and too radical reforms in any direction may end up destabilizing the nation once again.\n\nI would caution you to make modest reforms that will end up lasting in the long term rather than take strong strides that may lead toward a backlash that can end up undoing them. During my time in office, I have sought to balance the interests of both the conservative and progressive sides of my party to great success and kept the nation stable until the violent Afrikaner extremists attacked our fine land, and I would recommend to you above all modesty in your political affairs as Prime Minister of South Africa,\n\nShould you need further advice on matters, I will always be available to assist.\n\nSigned,"
 HDV_SAF.87.a: "Sir De Villiers Graaff, 2nd Baronet"

