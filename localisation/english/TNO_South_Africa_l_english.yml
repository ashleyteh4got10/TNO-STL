# SAF_Respond_to_the_riots: "Respond to the Riots"
# SAF_Respond_to_the_riots_desc: "The situation in the country is getting out of hand, if we don't respond soon there is no telling what might happen. There are currently two proposals for dealing with the crisis on the table, we will have to pick one"
# SAF_Meet_their_demands: "Meet their Demands"
# SAF_Meet_their_demands_desc: "The first proposal on the table comes from our diplomatic core. It involves something many in our government are hesitant to do, negotiation with the protesters. While we have previously refused to discuss the matter with the ANC, it might be time for a policy change on this matter"
# SAF_Send_In_The_army: "Send in the Army"
# SAF_Send_In_The_army_desc: "The second proposal on the table comes from the military and their supporters in the government. The proposal argues that negotiation with the protesters would quickly get out of hand, and proposes that if we give them an inch, they will take a mile. Thus the proposal recommends the tried and tested method of sending the army in to restore order"
# SAF_Declare_Martial_Law: "Declare Martial Law"
# SAF_Declare_Martial_Law_desc: "In order to ensure the safety of the country, the military has requested that martial law is declared until the crisis ends. The military argues that they do not have the powers that they need in order to deal with these protesters efficiently and that to carry on this matter may cause the situation to spiral out of our control."
# SAF_Mobalize_Reserves: "Mobilize the Reserves"
# SAF_Mobalize_Reserves_desc: "Due to the widespread and chaotic nature of the riots, it would be prudent to mobilize our reserve divisions in order to more effectively manage the situation. This would also allow us to distribute our most elite units across the nation more effectively due to the extra manpower it grants us."
# SAF_Mass_Arrests: "Mass Arrests"
# SAF_Mass_Arrests_desc: "Our informants inside the ANC have given us the current location of the leaders of the organization. As they are clearly guilty of inciting violence and bloodshed on a national scale there is only one prudent action to take, to arrest the leadership of the ANC and their affiliates."
# SAF_Enter_Negotiations: "Enter Negotiations with the ANC"
# SAF_Enter_Negotiations_desc: "The time has come for the official start of our negotiations with the ANC. While many within the government are against this action, it remains one of the few peaceful ways we have of potentially solving this crisis."
# SAF_Stand_Down_Army: "Stand down the Army"
# SAF_Stand_Down_Army_desc: "While their loyalty to South Africa is without question, a minority of military commanders have proven themselves over-eager to keep the peace. To avoid any ugly accidents it would be prudent to nip such problems in the bud before they grow."
# SAF_Start_Reform: "Start the Process of Reform"
# SAF_Start_Reform_desc: "After many days and nights of negotiations, we have finally managed to provide a plan that is to the ANCs satisfaction. While the road ahead may be long and hard, it is always necessary to strive for improvement. The first steps are always the hardest"
# SAF_Crisis_Averted: "Crisis Averted?"
# SAF_Crisis_Averted_desc: "By whatever means we have used it appears that the worst is over, the aftermath of these few months will echo throughout our nation for years to come."


 SAF_south_africas_situation: "South Africa's Situation"
 SAF_south_africas_situation_desc: "South Africa is slowly falling into chaos. Civil strife and political gridlock are everywhere, and society itself is slowly fracturing into warring factions, each vying for control of the state: the mere fact that we are a monarchy without a King shows how deep our indecision is. No matter our efforts in mending the rift, every inch of the bridge we build is immediately torn down by those who would only gain from our suffering.\n\nSouth Africa is on the brink of total collapse, and only a miracle can keep it whole. However, in these dark times, few remain brave enough to hope..."
 SAF_the_issues_we_face: "The Issues We Face"
 SAF_the_issues_we_face_desc: "Our country is deeply divided. As the Germans like to say, there is a "racial question": the whites, be it Anglos or Boers, are heavily outnumbered by the natives, who are almost entirely deprived of political representation. Despite our government's recent efforts to improve their standing, the Africans still live in poverty and without even basic services.\n\nOur reforms, however, have caused another drift, this time within the white community: the Boers, descendants of the first Dutch colonists, deeply believe in racial segregation, and think that what we are doing will only grant the "coloured" the chance to rebel against their masters.\n\nThis brings us to the most pressing issue: the Germans are funneling support to the National Party. The three Reichskommissariats claim they do it "to protect fellow Aryans of Dutch descent against runaway slaves and to establish peaceful relations on their southern borders", but everyone knows that the Boers are the perfect tool to add South Africa to their list of colonies...\n\nNo matter what, South Africa will endure. We must!"
 SAF_the_monarchy_debate: "The Monarchy Debate"
 SAF_the_monarchy_debate_desc: "The most divisive issue among the white community is indeed the debate between monarchy and republic. This seemingly political question, in truth, hides a much deeper division running across the entire country like an untended, festering wound: on one hand, we wish to hold the country together in the face of changing times, relying on the monarchy to mend differences and find common purpose with the force of our traditions.\n\nOn the other, the National Party wishes to subvert our beautiful land into a bad copy of Germany, a racially segregated society where millions live in poverty and fear, and a republican regime is what they need: they know they hold the majority among the whites, enabling them to force through their so-called "reforms". Can't the Boers see the error in their ways? Can't they see that Germany is falling apart because they did what the Hertzog is now trying to do? We can't be the only rational ones in this continent!"
 SAF_the_african_national_congress: "The African National Congress"
 SAF_the_african_national_congress_desc: "The ANC along with their more radical cousin the Pan African Congress is probably the greatest long-term threat to our stability. While the Boers are currently more dangerous, this Pan-African vanguard is slowly building up its forces the more our country is plunged into instability. Despite our benevolent rule, many Africans still complain that society is still largely segregated: the army, the civil service, politics and even the economy are dominated by the white minority. For them, both Anglos and Boers are the enemy just because we are white.\n\nEvery day, more and more join this organization. Should we fail to conquer their trust with our actions, the African National Congress will surely try to gain true freedom for their people. With force."
 SAF_schedule_a_referendum: "Schedule a Referendum"
 SAF_schedule_a_referendum_desc: "Despite our attempts at killing the motion supported by the National Party for a referendum on the monarchy, the opposition resorted to total obstruction of the Parliament to force our hand. After almost a week of gridlock, when the people started taking the streets in protest, we caved, and accepted to vote their proposal in exchange for the return of stability.\n\nWe shouldn't have done that. Now, the radicals are causing even more chaos than before, and our hands are tied by our own decision: we dance to their cacophony, and we ourselves choose the score. We have tried everything to delay the vote in the last months, but the NP threatened us just as they did before, and officially disavowing the consultation would be the final nail in South Africa's coffin. We MUST schedule the referendum, we can only pray we win..."
 SAF_referendum_decisions_tt: "§YWe will gain decisions regarding the referendum and the popular support of the opposing factions.§!"
 SAF_a_plan_for_the_future: "A Plan for the Future"
 SAF_a_plan_for_the_future_desc: "The future looks grim enough as it is, and we need to plan so that the situation doesn't get even worse. The matter of the black majority is especially pressing, but it could also become an opportunity: if we managed to secure their support by enacting sweeping reforms, reminding them that the true enemy is the NP, we could present a united front against them and their German backers, winning the referendum by a landslide with the African vote.\n\nHowever, not all are in favor of this proposal. There are those, even within our government, who believe in reconciliation with the National Party in the name of a "Government of the Civilized" against the native threat; from their point of view, the best way to win the Afrikaan vote would be a crackdown against rebel Blacks, followed by a general strengthening of the police to guarantee order.\n\nThere is no more time to delay: we need to make a choice now."
 SAF_maintain_the_status_quo: "Maintain the Status Quo"
 SAF_maintain_the_status_quo_desc: "In the end, the rebellious natives are the biggest threat to our stability. Therefore, a comprehensive effort shall be undertaken to ensure that the ANC isn't allowed to grow more powerful, and that the current state of affairs is maintained. The civilized and educated will remain in control of South Africa for the good of everyone, and this will hopefully sway the Boers towards supporting our government: after all, why give your country to the Germans when the current government is able to protect our way of life just as much?"
 SAF_further_investigate_the_anc: "Further Investigate the ANC"
 SAF_further_investigate_the_anc_desc: "The African National Congress has a widespread web of contacts, members and safe houses, with which they plan to set South Africa on fire from within. We already have enough enemies outside, and we can't afford the luxury of having a snake in our bosom: we shall order the Bureau of State Security to conduct further investigations over the ANC known members, to try and find who their leaders are and where they hide, knowing their location we will strike them with an iron fist. In our hopes, this will cripple the Congress, and the interruption of new members and funds will weaken it enough to prevent them from causing too much harm."
 SAF_restrict_their_protests: "Restrict Their Protests"
 SAF_restrict_their_protests_desc: "As expected, radicals pushed the Africans to take to the streets in open disapproval of our politics of order. This cannot be allowed: the police will receive strict orders to prevent any protest from taking place, using the appropriate amount of strength to disperse the crowd. We may not be like the Germans, but even our government understands the value of order above chaos, and we won't allow restless natives to further plunge our already shaken country into civil strife.\n\nEffective immediately, from today all gatherings of more than 10 Blacks are forbidden! All transgressors will pay a fine or be sent to the mines for half a year!"
 SAF_who_is_leading_them: "Who is Leading Them?"
 SAF_who_is_leading_them_desc: "Our first concern should be taking out the leaders of the protests. The immense majority of Africans are indolent and unorganized, incapable of carrying forward their plans unrest without being lead by a small core of educated radicals: if we managed to arrest the highest in rank of the ANC, terrorists like Tambo and Mandela, the rest would slowly wither like a plant whose roots have been severed.\n\nWe should start immediately with our surveillance, increase the number of informants, open more space in our maximum security prisons, so that we can strike at the best moment, and behead their entire rebellion in one, swift blow!"
 SAF_who_is_funding_them: "Who is Funding Them?"
 SAF_who_is_funding_them_desc: "Our preliminary investigations have revealed that the African National Congress possesses surprising amounts of funds, making them much more organized and supplied than we believed possible. Most black people within South Africa are very poor, and the few wealthy ones surely wouldn't be able to afford this much, but it's a start: arresting one or two black businessmen whose tax returns show holes, and questioning them with the proper instruments, could lead us somewhere.\n\nStill, this will only be the start: who is giving so much money to the ANC? The Germans are the primary suspects, even if funding a black resistance movement would retort against them mere seconds after our fall, they would not resist the chance of weakening the only bulwark keeping them from grabbing the whole continent for their Führer.\n\nJust like the old saying: Follow the Rand..."
 SAF_who_is_supporting_them: "Who is Supporting Them?"
 SAF_who_is_supporting_them_desc: "Looking into the source of their money isn't enough. There are surely people, external to the organization, who are willing to help them with information and protection, which is perhaps even worse than money.\n\nWhile time will be needed to have a clear view, many investigators point to the National Party: who else would gain support from a strong ANC? It would prove to the people that apartheid and racial segregation are necessary to keep order.\n\nWe should focus our efforts into uncovering those Boers who are helping the Congress and show to all our people their crimes against South Africa, they would rather burn our country than let us win the coming referendum."
 SAF_crack_down_on_their_publications: "Crack Down on Their Publications"
 SAF_crack_down_on_their_publications_desc: "It is widely known that the African National Congress operates its own propaganda machine, encompassing both licit newspapers and clandestine printing presses. Of course, the former present the ANC as a force of peace, willing to work with the whites for the betterment of South Africa, while the latter encourage the black population to join the militant arm of their organization, to free all natives once and for all from white tyranny.\n\nIt's clear that both kinds of propaganda are dangerous, as they are a cunning way to hide their true nature to the government's eyes, while plotting behind our shoulders to strike at the right moment! Effective immediately, all newspapers run by blacks are to be subjected to the newly established "censorship committee", and our investigators will find and destroy all secret publications. This should prevent the Congress from seeking new members..."
 SAF_broadcast_anti_anc_propaganda: "Broadcast Anti-ANC Propaganda"
 SAF_broadcast_anti_anc_propaganda_desc: "In order to fight fire with fire, we'll build up our own propaganda machine! Government-run newspapers and radio transmissions will begin a media offensive against the African National Congress, painting its leaders as ruthless revolutionaries who don't care about killing innocents and sacrificing their own people to achieve that travesty they call "independence", which in truth is only to be subservient to another master.\n\nWe shall rally the whites against the black menace, and make it so that even the natives will come to fear and despise their own kind. Some say that what we're doing would make Goebbels proud, but unlike the Germans, we are protecting freedom, not squashing it!"
 SAF_radicalize_the_anc: "Radicalize the ANC"
 SAF_radicalize_the_anc_desc: "In our effort to protect South Africa from instability, we must constantly be battle-ready. With the tensions rising to unheard levels and several irresponsible radicals pushing our country's African majority to violence, we could be called to defend our nation sooner than we might expect. Should things go even worse, we can't expect the police to keep order, therefore the UDF must be fully equipped, mobilized and ready to take the streets in the event of an attack by armed rogue Coloureds.\n\nWe will show the Boers that we don't need to betray our country like the National Front to maintain order..."
 SAF_army_on_high_alert: "The Army on High Alert"
 SAF_army_on_high_alert_desc: "As those who would seek to dismantle our union from within grow ever bolder and increasingly violent, we must be wary of the limitations of our security forces. Day by day they grow ever more stretched, struggling to cope with the deadly challenges they are now faced with.\n\nWe must admit that our security forces will soon be unable to cope with the pressures placed upon them. The army must be placed upon high alert, ready to deploy domestically to keep the peace. It's not what the army is designed to do, and the average private is far from properly trained to do the job of a police officer, but we may soon have little other choice."
 SAF_reinforce_the_police: "Reinforce the Police"
 SAF_reinforce_the_police_desc: "How can we protect order and stability, when our policemen are armed with only batons and handguns, and our opponents employ rifles and bombs? We can't always send in the army: if we want to keep the peace, the police must be properly equipped to re-establish it with the proper amount of force. Lethal, if necessary.\n\nProtected vehicles and military-grade weapons such as SMGs and stun grenades should give our peacekeepers the edge they need to prevail over any ANC terrorist: let's see if they are foolish enough to attempt a full-scale uprising!"
 SAF_specialized_riot_training: "Specialized Riot Training"
 SAF_specialized_riot_training_desc: "While our police are now well-equipped to take care of armed bands, there's another pressing issue. Since we can't simply open fire on unarmed demonstrators, we need to devise tactics to counter any possible situation from protests degenerating into spontaneous revolts.\n\nCrowd-control equipment such as hydrants and tear gas, and the use of specialized riot training should ensure we are able to disperse even large manifestations without them turning into a bloodbath, which would only weaken us further."
 SAF_the_anc_pacified: "The ANC Pacified"
 SAF_the_anc_pacified_desc: "Finally, our latest reports are much better than the previous ones. The African National Congress appears to have lost a great degree of influence over the black population, and the Boers seem at least content with our measures. Thanks to the expanded and improved police, all protests from ANC sympathizers have been broken down, and the streets are now safe for everyone.\n\nWhile the most pressing matters for our nation, such as the referendum, still loom over the horizon, there's no doubt our reforms have ensured a rise in stability and popularity for our government."
 SAF_talk_with_the_anc: "Talk With the ANC"
 SAF_talk_with_the_anc_desc: "After long considerations, we have come to the realization that the greatest enemy to all of South Africa is the National Party and their plans to turn the country into a German satellite, both diplomatically and politically. There can be no place for them and their segregationist views in our country!\n\nOf course, we need allies in the struggle to come, and the African National Congress is the best candidate; they would be the ones who would suffer the most under the Boer and German boot, after all. If we managed to convince them to cooperate with us, in exchange for sweeping reforms, we would surely enlist their aid against the would-be slavers, and dramatically reduce tensions within the country. To this end, we need to open talks with the ANC immediately."
 SAF_sit_down_with_tambo: "Sit Down with Tambo"
 SAF_sit_down_with_tambo_desc: "Oliver Tambo is one of the most prominent members of the ANC, and a deep believer in a peaceful road towards freedom. His proposals for a full integration of the black majority into the South African nation are moderate enough to be acceptable for our political establishment, but still radical enough to motivate his followers.\n\nOur officials will make contact with him to listen to his proposed reforms, and we shall treat him as if he was the de facto leader of the Council, thus helping him gather more support for his cooperative approach."
 SAF_support_moderate_anc_elements: "Support Moderate ANC Elements"
 SAF_support_moderate_anc_elements_desc: "The African National Congress is deeply divided between a moderate wing and the extremist one, and it is in our best interest that the moderates win. To this end, we shall support men such as Oliver Tambo and Nelson Mandela, who are willing to negotiate over the more radical elements of the organization: secret funds and some piloted scandals should be enough to help them without revealing ourselves.\n\nOn a broader scale, we shall focus our propaganda efforts towards cooperation and slow but steady reform, especially aiming the message at the more integrated members of society, such as the Coloureds and the Indian community, who are more willing to sit down and talk than the average black community. Given enough time, we should see a steady rise in moderate sentiments over radicalism: from there, we can find common ground for further cooperation."
 SAF_rally_their_support: "Rally Their Support"
 SAF_rally_their_support_desc: "As the ANC is aligning itself more and more with the more moderate elements, we can start a proper propaganda effort aimed at securing their support. Members from our cabinet will start officially meeting leaders from the Congress to discuss potential avenues for reforms, and our newspapers and radio programs will emphasize the importance of cooperation against the German threat, especially in the coming referendum.\n\nThe time for neutrality is now over: we shall see our country set on the road for a better future, with or without the National Party. People of South Africa! The time has come to unite, whites and blacks without distinction, against our true enemy! We shall live freely together, and beat back those who truly oppressed all of you!"
 SAF_release_political_prisoners: "Release Political Prisoners"
 SAF_release_political_prisoners_desc: "Our detention facilities are full of ANC members who were arrested while spreading their propaganda or sabotaging factories owned by white industrialists. With the exception of those who committed serious crimes such as murder, we shall grant amnesty to all political prisoners belonging to the Congress, as a show of good will towards the future.\n\nOf course, this move will cost us a lot and draw criticism from all conservative elements even among the Anglo community, therefore we expect that the movement's leaders will repay us in kind, and support us even more in the face of the coming storm."
 SAF_weaken_their_radicals: "Weaken Their Radicals"
 SAF_weaken_their_radicals_desc: "Even though the moderate wing of the ANC has gained the upper hand within the organization, extremists such as the PAC still try to gather followers and regain control. We can't let them ruin what we are building together: a new approach is needed, more... direct than before. From now on, all our media will openly express the government's support for cooperation with the African National Congress, and our intention to approve still unspecified "reforms" to better the lives of all South Africans, be they whites or black.\n\nThe final message will be clear: moderation ensures reforms, extremism will only achieve death and suffering for everyone. Also, we shall paint the radicals within the Congress as unwilling pawns for the Boers at best, and covert agents from the Reich at worst, further ruining their image in the face of the people."
 SAF_agree_to_limited_reforms: "The Winds of Change"
 SAF_agree_to_limited_reforms_desc: "The time has come to make our alliance with the African National Congress official. We shall release a joint statement between our cabinet and the organization's leadership that a new age for South Africa has dawned, and that the time of apartheid and racial segregation is finally over. To cement the bond, we shall reveal a precise list of reforms to be implemented in the following weeks.\n\nEven though the final agreement was much more limited than what the ANC proposed to us at the beginning, it is still sure to cause an uproar, and ruin any chance at reconciling with more right wing elements in the white community. They will surely try to block the motion, but the Prime Minister will resort to emergency legislation to force it through.\n\nAs the Romans said: alea iacta est."
 SAF_ban_extremist_armed_organizations: "Ban Extremist Armed Organizations"
 SAF_ban_extremist_armed_organizations_desc: "Now that we have fully committed to our reforms, we need to start weakening our potential adversaries. It is widely known that the Boers have formed several paramilitary groups, sometimes even with the help of mercenaries from Zentralafrika: officially they patrol the roads and farms "to protect their homes from terrorist attacks", but we know that they are conducting terror attacks, beating and even killing people who speak up against segregation, to keep them under their boot with the fear of bloody retaliation.\n\nWhile we may have tolerated this in the past due to our weakness, now the balance has shifted, and the time has come for retribution. Effective immediately, all armed organizations are to be disbanded, and possession of firearms shall be limited to handguns. Of course, we know they will never surrender their secret weapon caches, but this will at least give us an excuse to send the police to crack down hard on their armed militias."
 SAF_africans_in_the_civil_service: "Africans in the Civil Service"
 SAF_africans_in_the_civil_service_desc: "As part of the reforms we promised to the ANC, the civil service shall be made fully open to everyone, with no limits or discrimination whatsoever. As a show of good will, we will appoint several prominent members from the Council in high-ranking positions so that they can work more closely with our cabinet. This move is sure to show all Africans that we are keeping faith to our word, and support for our government will soar among the native community.\n\nWe will also start a program to pair these newcomers with experienced white workers to not only make them learn faster their new trade but also bridge our racial divide."
 SAF_African_Rifles_Regiment: "The African Rifles Regiment"
 SAF_African_Rifles_Regiment_desc: "It is becoming increasingly clear that the Boers are planning for something much worse than mere political subversion. We need all able-bodied men we can count on for the coming storm, and the time has come for the Africans to do their part in the defence of a freedom that will soon be theirs too: currently, the UDF is fully segregated, with blacks forbidden from joining in command roles, but this will change.\n\nEffective immediately, all armed forces are fully open with no distinction of ethnicity, and discrimination will be strictly forbidden and the Royal African Rifles, the country's first all-black infantry divisions will be formed and equipped. Of course, we expect that Africans will enlist en masse: surely they don't wish for our government to be overthrown by someone with a keen preference for slavery and concentration camps..."
 SAF_rights_for_tribal_lands: "Rights for Tribal Lands"
 SAF_rights_for_tribal_lands_desc: "South African native majority is not a monolithic block as many think, within them there are many tribal nations like Bechuanaland and Zululand, each following their own traditions and living within their ancestral lands.\n\nWe shall sign treaties with local rulers, formally granting them autonomy within their tribal territories and promising never to touch their lands, in exchange for their loyalty, and perhaps the promise of support should anything befall South Africa, by gathering the tribal nations we manage to gather allies amongst the country's African majority and secure the United Party's place at the country's first universal elections."
 SAF_deracialize_education: "Deracialize Education"
 SAF_deracialize_education_desc: "Black children are used to learning with well-placed insults and slaps to their social standing: they are enrolled in different schools than their white peers, are blocked from higher education, and are even barred from speaking their own language while whites are given preference for everything. Even textbooks adamantly teach that the white race is indeed superior, with most courses, from history to the sciences, containing countless references to racial theories.\n\nOf course, this needs to change. The schooling system will be overhauled: fair treatment will be ensured for everyone regardless of ethnicity. All references to race and segregation will be expunged from textbooks and courses. Native African languages such as Zulu and Xhosa will be taught alongside English and Afrikaans and any teacher or school official disagreeing with the reforms will be fired from his or her position.\n\nTimes have changed, and the best way to change with them is by teaching children that we are all equal. No more black or white, only South African."
 SAF_the_tensions_calmed: "Votes for All the Folks"
 SAF_the_tensions_calmed_desc: "This is it. Our boldest move so far, and the one which may change the course of history for our country. By granting equal voting rights to all citizens of South Africa, with no regard to their ethnicity, the balance of power will never be the same. We know that we are making ourselves a minority inside our own country and de facto renouncing political dominance, but we are confident that the ANC will keep their end of the deal.\n\nMore than anything, this will give us the weapon we need to win the referendum. We no longer need to bargain for a few thousands votes from Afrikaaner moderates: now we have not hundreds, not thousands, but millions of new electors who will surely vote in our favor. We have won this battle, we can only hope we will stand together for the next one..."
 SAF_maintaining_our_neutrality: "Maintaining Our Neutrality"
 SAF_maintaining_our_neutrality_desc: "South Africa saved itself from German supremacy by carefully playing its cards and refusing to recognize either Elizabeth or Edward as the legitimate monarch. After the war, we of course kept close relationships with the USA as fellow member of the Allies even though we never joined the OFN, but it is necessary that we keep at least a cordial relation with our northern neighbors from the Pakt.\n\nAs the old order starts collapsing, we need to maintain our neutrality now more than ever, or risk being dragged into a conflict we have no hope of surviving. Our diplomatic efforts will focus on reassuring all parties that South Africa is a neutral nation, and won't take part in any hostile move towards any of the world powers. We can only hope this will save us..."
 SAF_reassure_the_americans: "Reassure the Americans..."
 SAF_reassure_the_americans_desc: "The Americans are our closest trade partners, and have taken a protective approach towards us since the last war. Of course, they are worried about the referendum and the rising instability within our country, but we need to reassure them that everything is under control. Even though we still refuse all of their offers to join the OFN, this doesn't mean we can't be friends in democracy.\n\nA trade delegation will soon depart for Washington, and they will bring the usual salutes and assurances to the Americans that South Africa plans to remain a free and democratic nation for a long time. We will assure Mr. Nixon that this whole continent won't fall in the hands of the Germans."
 SAF_and_the_germans: "...And the Germans"
 SAF_and_the_germans_desc: "In order to keep cordial relationships with Germany, we have agreed long ago to have an eye of regard for their "fellow Aryan brothers", the Boers, who descend from Dutch colonists. While this might have to change in the near future in light of the growing disloyalty of the Boer community, this doesn't mean that we are hostile towards the Reich or its possessions in Africa.\n\nTo cement our neutral standing, we shall send delegations to both Germania and the Reichskommissariats, in the hope of ensuring their non-aggression towards us. It's always difficult to understand what the Germans do these days: with their political situation slowly worsening, it's as if there are several Reichs, each with its own agenda, any of them able to make their troops move south. This is very worrying..."
 SAF_rebuff_their_diplomats: "Rebuff Their Diplomats"
 SAF_rebuff_their_diplomats_desc: "As expected, both the USA and the Reich have tried to make us join their alliances. With the old order crumbling with every passing day, they are trying to strengthen themselves for the coming storm, and are enlisting all possible help. Predictably, our envoys have returned from their missions carrying a truckload of offers, proposals, help promises, and subtle threats, to ensure we'd choose one of them over the rest.\n\nOf course, we'll do no such thing. Our neutrality is paramount for our survival, as we are too divided within to be able to properly fight an outside enemy: therefore, we shall politely refuse all their offers, and remind them that we have a policy of open doors towards everyone. In addition, we'll let slip that, should any of the great powers try to meddle in our internal affairs too much, we would be forced to seek aid from the others..."
 SAF_fortify_just_in_case: "Fortify, Just In Case"
 SAF_fortify_just_in_case_desc: "It has become clear to us that the world is on the brink of another major crisis, and our neutrality may serve us very little, as it did for Belgium and the Netherlands during the last war. Perhaps we should do something more to ensure that we have a chance of survival in case the Germans march south.\n\nThe UDF High Command has proposed to us a plan to protect ourselves against the rabid wolves circling us: a ring of defences will be built along our northern borders coupled with a fortified perimeter around the Cape where we will have our last stand with our backs against the sea. Some call our concerns unfounded and the plan will be a mere waste of money, but it can be the salvation of our country if the panzers' armoured wheels start spinning."

 SAF_for_south_africa: "For South Africa"
 SAF_for_south_africa_desc: "With our internal problems solved, or at least contained for the time being, we can begin addressing the more pressing concerns coming from both within and without our country. There's so much to be done for the good of our country, and we finally have the means to do it!\n\nForward into the future! For South Africa!"

 #South African War tree - FINAl VERSION V1.111111111111112 .png .jpeg .finalversions.2.1.0 oh God so much more stuff to write
 
 SAF_declare_martial_laws: "Declare Martial Law"
 SAF_declare_martial_laws_desc: "There is no time to wait, and we must immediately declare a full on state of martial law, suspending the normal civillian life that is now deeply under threat by this great civil war. Already rumours are flying of further secret plots by the National Party and their OBW plotters. To defend our freedoms, we must suspend some of them for the sake of national security, no, national survival.\n\nAt the same time, the United Party will publicly vow to restore these rights and freedoms once this war is won. Martial law is an ugly business, but it is one that is a price worth paying to ensure that the light will keep shining on the Cape."
 SAF_ofn_care_packages: "OFN Care Packages"
 SAF_ofn_care_packages_desc: "Our friendship with the Organization of Free Nations has always been distant, but very friendly nonetheless. Despite our neutrality, our hidden alignment with Washington will come in handy now as we immediately ask for aid in this time of crisis. All ties with Germania are severed, now and forever as we stand to quickly join the Organization of Free Nations in our united struggle against national socialism!\n\nWe have already recieved word that the Americans are quickly starting an airbridge to Cape Town with the most vital kinds of millitary supplies, with other members of the OFN also having already vowed support via care packages. We need to hold on, because more help will be on the way, it merely needs to get here."
 SAF_call_in_the_conscripts: "Call in the Conscripts"
 SAF_call_in_the_conscripts_desc: "There can be no restraint in calling up conscripts for the war, to call back retired veterans, and to reach out to retired commanders to quickly begin building up our army. All limits and restrictions on soldiers will be revoked, all those who were not able to make the cut before will now be called up, and national training camps will immediately begin operation. Many of them will only have the time to be taught the basics, and then unfortunately will have to learn the way to fight this war during this war."
 SAF_emergency_defenses: "Emergency Defenses"
 SAF_emergency_defenses_desc: "We have to stop the push of the Volkstaat, at any cost. The civilian construction industry will quickly be suspended any work on civillian matters, and be put to work building hastily assembled defence lines across the nation. Even soldiers will have to be put to work with shovels to dig in.\n\nSure, these emergency defences won't stand up agianst a full assault, but right now what's most important is to win time for everything else to get into order. Not just land, but time itself is vital in war, and we shall delay the onslaught as much as we can. In the future, then we will turn the tide."
 SAF_emergency_defenses_tt: "Will built §Yforts§! in §WPort Elizabeth§!, §WEast London§!, §WNewcastle§!, §WDurban§!, and the provinces surrounding §WCape Town§!."
 SAF_bomb_shelters: "Bomb Shelters"
 SAF_bomb_shelters_desc: "We must do all we can to defend our people, to defend our women and children against this horrible, unjust war. In every city, in every town, there should be emergency measures enacted to build bomb shelters, retrofit basements and stock up on supplies so that people can safely hide away when danger approaches. Local governments shall take charge in organizing local safe places while nationwhide pamphlets will help people with preparing for what they can do when the war comes to their city."
 SAF_seize_german_assets: "Seize German Assets"
 SAF_seize_german_assets_desc: "Did they really think they could get away with trying to conquer us like that? The Germans have invested in South Africa before the war, and with the full backing and security of the Americans, all German assets within South Africa will be seized by force. Not only does this give a short-term benefit to the state, but it will be a welcome boost to our war economy. It does raise a curious point at least: why would the Germans first invest in South Africa to later try and seize it by force?\n\nPerhaps the German RK's had planned this without oversight from Germania. As for the assets themselves, they will be auctioned off to the right bidders, loyalist businessmen, and investors who have sided with South Africa during the war, and perhaps our new American friends would want to put in a bid as well."
 SAF_our_valiant_people: "Our Valiant People"
 SAF_our_valiant_people_desc: "It is well known that the Union of South Africa was internally divided, not just between its different peoples but even between the countryside and the cities, and so on. Yet the universal truth remains that in the face of such a great danger, such a great evil as the German invasion that threatens the freedom of all that people will unite. Now is the time to call our people to arms, to praise them for their valliant hard work and appeal to the best of them in the darkest of days\n\nPeople will all rally around the flag, progressives, conservatives, Whites, Coloured, and Natives all alike standing side by side against the heinous invaders from the north. As the fire rages outside; the burden of war and struggled is shared by all South Africans and our valiant people will come out victorious"
 SAF_defectors_saboteurs: "Saboteurs"
 SAF_defectors_saboteurs_desc: "Local knowledge is an irrefutable advantage in war. To know which routes are safe, and which ones are risky. The ins and outs of factories and facilities from which the enemy wages war upon the good people of South Africa. The location of munitions storages; millitary bases; supply depots and more are all kinds of information that can be just as effective in war as sending troops forward into battle.\n\nFor the battle is in fact waged in front of, in the middle of, and behind the front lines. Those who turn away from the hideous lie of the Volkstaat and their German puppetmasters can come in very useful by being sent back to deliver as much damage from within. With their supply lines damaged and disrupted they will eventually break under all the pressure placed upon them from all sides, and that will help us achieve victory."
 SAF_our_nation_in_flames: "Our Nation in Flames"
 SAF_our_nation_in_flames_desc: "South Africa, our land, is now engulfed in the inferno of war. We are facing many enemies, especially those beyond our own borders, as well as within. A coup by the Ossewabrandwag with most of the National Party being fully complicit, and the loss of the Witwatersrand and the Transvaal to the invaders. All of South Africa's wealth, people, and resources must be mobilized for a great and just war to defend our nation, reclaim our land, and to defend our Union against those who would see it subjugated to the Germans in stead. It is no longer possible for us to stand by and watch as these horrible things happen.\n\nLet us meet the challenge and shrink not from fear. The only choice we have now is to fight for our lives and for our land. For South Africa!"
 SAF_cooperate_with_american_companies: "Cooperate with American Companies"
 SAF_cooperate_with_american_companies_desc: "The United States is a superpower not only thanks to their skills at warfare but also because of the wealth of their trade. With their advantages, our country can benefit not only in peace but in war.\n\nThe companies and their coffers must be convinced that there is much for them to see in South Africa and that the only way of them accessing our vast natural resources is if the Germans are beaten back. Let's show these Americans that we are willing to cooperate with them.\n\nIf we are successful, then their mighty economy can keep us in the fight against the Nazis!"
 SAF_purchase_american_guns: "Purchase American Guns"
 SAF_purchase_american_guns_desc: "Our nascent local arms industry might be able to support the needs of a small army fighting against an insurgency, but it doesn't have the output capability to produce the quantity of weapons required to equip the number of divisions we must field to sop the invading Germans, luckily, this is one more problem we can count on our allies in America to solve:\n\nWe can be included in the Pentagon's Foreign Military Sales Program, thousands of American made M-16 assault rifles can be delivered to us immediately and go straight from their crates to the hands of our soldiers, while we will only start paying for them when the war is over."
 SAF_request_additional_troops: "Request Additional Troops"
 SAF_request_additional_troops_desc: "The first wave of American support has saved our Dominion from ruin when they arrived but that was not enough to end the war, now the war has turned into a slow stalemate that the longer it goes on, the more we bleed. Now we desperate need something to break the balance of this conflict and quickly tip the scales in our favors as our own men are dropping dead or wounded in ever growing numbers each day.\n\nThe arrival of new American divisions to be deployed to the frontlines will be the element we need to reorganize our forces behind and start going on the offensive, only stopping when we take Léopoldville!"
 SAF_american_army_training: "American Army Training"
 SAF_american_army_training_desc: "Our Union Defence Force was trained in the British school of combat, putting great importance in entrenchment, lines of defence, unit discipline and on a rigid command structure. While this might have worked half a century ago on the fields of Flanders, we cannot hope to defeat the modern and mobile German Military with their bold lightning warfare tactics if we fight just like we did at the Somme.\n\nAmerican trainers coming straight from the West Point Military Academy will be teaching our officers on how to fight a modern war: Combined Arms tactics, Maneuver Warfare, Close Air Support, and a modern Command and Control structure. The quicker we put their instructions to good use, the quicker we will win this war."
 SAF_air_and_naval_support: "Air And Naval Support"
 SAF_air_and_naval_support_desc: "Our Defence Force is fighting on against the German pests on the soil of Africa but we cannot fight effectively if we cannot keep the skies clear and if we cannot secure the waters around our country.\n\nLet us make great use of our ally's strength in the air and on the seas, use their fighter jets to intercept the Luftwaffe's bombers, their naval ships to seize the Schild's commerce, their helicopters to evac our wounded and their B-52s to make the enemy fear us even as far as in Léopoldville. With the help of the Americans' exceptional machines, our boys can challenge the German invaders much more effectively."
 SAF_our_roaring_skies: "Our Roaring Skies"
 SAF_our_roaring_skies_desc: "The fight in the skies has begun, and while the South African Air Force is fighting like lions, it is most definitly struggling against the German onslaught in the skies. With no domestic air production ongoing, we are left but with one clear choice: to import American planes and quickly get them into the fight against the colonial Luftwaffe. Only then can we start to turn the tide in the air and secure the skies over the Cape. Hopefully raw numbers will help compensate for the lack of experience of our new pilots being sent into the fray of battle far above the battlefields of the South African War."
 SAF_total_air_supremacy: "Total Air Supremacy"
 SAF_total_air_supremacy_desc: "To win on land, we must first dominate the skies. No expenses can be spared in getting new planes imported from abroad and new pilots trained on them. Our choice is clear: once again American airplanes shall bring us victory in the skies that we can then turn around in close air support for the troops fighting on the ground. With how great the distances are in Africa, a proper air force is absolutely vital to handle reconnaissance, supply, troop transport and bombardment, which can only ever happen when we have total Air Supremacy over the Germans."
 SAF_the_cia: "The CIA"
 SAF_the_cia_desc: "There can be no doubt about it that a war such as this is fought both above board on the battlefield and below board in the meeting rooms. Before the war, BOSS had already been busy cooperating with the Americans in secret (with full approval of Prime Minister but no more secrecy is needed as the CIA is fully invited in and offered the finest offices in Cape Town to help them get to work on the secret side of this war. Sabotage, intelligence work, and even assasinations are all being worked up by the boys from Langley, backed by up by the exiles of the SAS who are more ready than ever to get even with the Jerries."
 SAF_selling_them_the_war: "Selling Them The War"
 SAF_selling_them_the_war_desc: "We are the only country on the continent standing against the Nazi menace. We are the only ones keeping them from overtaking Africa and putting their sights on America, in one more conquest for ideology and for their greed.\n\nBut some parts of the American public are not happy with how the war is going and want the withdrawal of their forces, it is our responsibility to make them see reason. Let's start a propaganda campaign for them to know that if they bring their men home and the Germans take South Africa today, tomorrow they will be fighting the Führer's minions right on their doorstep."
 SAF_american_tech: "American Tech"
 SAF_american_tech_desc: "The United States is eager to give us some of their best to our Nation. They are willing to share with us the technology behind their latest armored cars, their finest planes and helicopters, and their most advanced gadgets.\n\nSuch gifts must be used extensively and to try to extract the maximum potential advantage. The Germans are going to be shocked when they see how far we can go with these American tools."
 SAF_american_talent: "American Talent"
 SAF_american_talent_desc: "Our American allies have some interesting proposals to bring to the table. They think that the war's course can be turned against the Nazis if we put to use these innovative tactics.\n\nThey say that conducting raids into the enemy's territory and deploying highly trained soldiers in small units to achieve unconventional objectives, creative use of our ships to interdict German logistics and innovative employments of the Air Force will put us on higher ground. Let's consider what our friends have to say."
 SAF_american_armour: "American Armor"
 SAF_american_armour_desc: "Nothing can beat the multiple pupose power of a good tank, but South Africa has never really specialized much in producing our own tanks. Plans have arisen to base a tank of a British design from one of the finest British exiles, but not much progress has been made in turning the Centurion into the Olifant so far.\n\nAs such, we will have to reach into our purse and get the newest and finest in American tank warfare brought to the Cape. Thankfully the Americans are more than happy to increase their arms exports to us and at the same time defend the cause of freedom."
 SAF_we_need_more: "We Need More"
 SAF_we_need_more_desc: "The Nation of South Africa is grateful for the support our allies, especially the United States, give to our troops. The war will be over someday, but it would be better to see an end to it sooner.\n\nOne way to achieve that is to seek more of what they have. Our troops and our people, would surpass the Germans in the battlefield and in peace if only we could get our hands on these brand new achievements.\n\nSouth Africa must obtain more support, and rightly so!"
 SAF_ofn_cooperation: "OFN Cooperation"
 SAF_ofn_cooperation_desc: "Now that the entire Organization of Free Nations has backed us, the time has come to fully go ahead and coordinate most, and if not every aspect with our allies so that they may bring their full force to bear. With direct involvement of high up members of the OFN we can push forward in common planning and better mutual utilization of South Africa's logistics systems. While it may be the most underrated part of the war, and certainly the least appealing to the common man, there is nothing that can beat a solidly planned through logistics system adapted to the needs of a grand army at war. Bring on the supplies, bring on the soldier, South Africa's defence is planned out to the hilt!"
 SAF_the_hidden_war: "The Hidden War"
 SAF_the_hidden_war_desc: "Knowing they aren't able to defeat us and our American allies by fighting fair, the German invader has exploited the divisions in our country to weaken our will to fight. Spearheaded by the traitor Albert Hertzog and armed to the teeth with German weapons and equipment, armed terrorist militias are terrorizing loyal citizens, murdering Army recruiters, raiding our supply lines, laying landmines on our roads and ambushing our troops.\n\nThis so-called 'Hidden Front' is taking its toll not only on our men, supplies and morale but also to the spirits of our allies back in the United States, who begin to question their presence in our continent. It must be stopped, we have already beaten them twice and will do it again, no matter if they call themselves Kommandos or Werwolfs."
 SAF_shatter_the_schild: "Shatter the Schild"
 SAF_shatter_the_schild_desc: "The German Reich's presence in Africa is a giant with feet of clay. Sprawling from Gabon to Mozambique, their colonial empire can seem impressive at first glance, but that couldn't be further from the truth. Being run by three bickering dictators unable to work together, over-reliant on indolent mercenary troops and plagued with anti-colonial insurgents and bandits lurking around every German garrison.\n\nWe will turn those rebels into the demise of the Nazi invader just like they tried to do with us, the Germans don't have the experience in fighting bush wars as we have and still fight like they are in Europe, small bands of armed discontent Africans will pin entire divisions away from the front line and make the arrogant Reichskommissars lose their sleep at night. They sew the wind when they armed Hertzog's traitors, now they will reap the whirlwind when we arm African partisans in their domain."
 SAF_strike_the_balance: "Strike the Balance"
 SAF_strike_the_balance_desc: "There is no right answer, and thus we should pursue a mixed strategy of dealing with both defending our own lands against the rising insurgency and at the same time to begin breaking up the Africa shield by beginning deep covert operations against them. Sure, it will not be as effective as the other two choices but spreading our bets is the best option going foward to leave no option off the table."
 SAF_strike_the_balance_tt: "Unlocks decisions to gain the benefits of §Gboth§! the §Y$SAF_shatter_the_schild$§! and §Y$SAF_focus_on_counterinsurgency$§! focuses §Yafter some time§!."
 SAF_our_just_cause: "Our Just Cause"
 SAF_our_just_cause_desc: "What more of a just cause can there be than the defence of a nation, the defence of a land and a people. Everybody knows that we didn't start this fire, it was always burning when the OBW was lurking, but it was them who set South Africa ablaze. Now everyone in South Africa must be rallied to the cause, and the world must know of it as well. Time to raise our shield, steady our grip, and to throw everything into this great struggle for the fate of South Africa. The Cape shall never fall as long as good South Africans still stand proud in the face of terror!"
 SAF_our_american_allies: "Our American Allies"
 SAF_our_american_allies_desc: "We cannot fight this war alone, surrounded by all sides by the invading German armies, our only hope comes from the sea. The United States are the only country that stood out to help us in these times of trouble when it seems the whole world is against us and defeat is at the door.\n\nRight now in Washington, Pentagon officials are talking about an Airlift to bring the most needed weapons and supplies to the Cape by American cargo planes, those weapons arriving will greatly raise our odds of surviving the assault and make these German invaders will hesitate to keep advancing."
 SAF_psuedo_operations: "Pseudo Operations"
 SAF_psuedo_operations_desc: "An unorthodox way of waging war is becoming popular amongst our officers, especially within former British refugee circles named the pseudo-operations. The brainchild of Colonel Ron Reid-Daly, these operations consists of sending commando units augmented with deserters and "turned" POWs wearing SS uniforms for intelligence gatherings and covert operations like raids, subversion, sabotage, and assassinations.\n\nDaly's men, aided by discontent Anglo elements of the SS will act as to create the maximum confusion on the enemy's deepest rearguard. The Queen's Men will now take revenge for what the Hun did to our Africa."
 SAF_defectors_into: "Defectors Into..."
 SAF_defectors_into_desc: "The life of a Kommando on the South African bush is hard: bugs, booby traps, heat, hunger and the constant patrols by American choppers means that every wrong step could mean their last. Guerrilla warfare is not only a war against the enemy but also a war within every fighter. A war we should encourage the Boers to lose.\n\nOur American allies have requested our help in a psychological warfare project codenamed Wandering Soul. Using special radio broadcasts, we may convince both Boer insurgents and African SS to lay down their arms and surrender to our units, winning battles without firing a shot."
 SAF_defectors_soldiers: "...Soldiers"
 SAF_defectors_soldiers_desc: "No way about it, what we need most of all is men in uniform. We've got the equipment, we've got the supply systems, the ammo and the tanks, but what we need is more. Any who turn to our side shall be given the finest equipment, the best support, and extensive training to then be sent back to seal this struggle in our favour. Anyone who weakens our enemy shall be honoured, respected, and forever lionized as true defenders of South African freedom!"
 SAF_the_propaganda_war: "The Propaganda War"
 SAF_the_propaganda_war_desc: "While the war may be tough and hard-fought, none will bat an eye about it without some proper coverage. Without broadcasting our fight to the entire world, we may be crushed under the weight of foes without even being noticed. The people watching at home and the observers abroad must know the effort our men put to preserve the liberty and the freedom of South Africa and continue the struggle daily. They must know the stakes at hand, and why our dear nation is under such massive threat.\n\nTo properly show the true nature of our conflict, we shall ensure all news reporters and cameramen are assigned to our army groups to witness side-by-side with our soldiers the true nature of the conflict. We must capitalize on their reports by using them as propaganda to boost morale and inspire other nations to help our cause. We shall tell the world that South Africa is fighting for the safety of its existence, the safety of its people and country, and for the safety of the ideals of liberty, truth, and justice in Africa.\n\nWar can be won on the battlefield, but also won on tape."
 SAF_focus_on_counterinsurgency: "Focus on Counterinsurgency"
 SAF_focus_on_counterinsurgency_desc: "The problem of Hertzog's henchmen terrorizing our countryside and harassing our supply lines is becoming more serious than it was previously expected, it seems that just the SAP and army MP units coupled with light infantry formations are just not enough to rip the problem in the bud, we need something more.\n\nWith the help from our American allies we will form the Civil Operations and Revolutionary Development Support Program, codename CORDS, a special project with the aim of not only finding and eliminating the armed NP insurgents but also quashing their political organizations and turning the rural Afrikaner population from terrorism enablers into loyal subjects of Her Majesty."
 SAF_identifying_insurgents: "Identifying Insurgents"
 SAF_identifying_insurgents_desc: "While the Fireforce is an effective method of eliminating the enemy's armed Kommandos, battlefield maneuvers are not capable of damaging the National Party's extensive network of political and logistical support they have throughout the countryside, no matter how many armed Boers do we eliminate, there will always be a snake in our fields if the National Party's political wing is still standing.\n\nThe Americans have devised a plan for eliminate the threat of the insurgent, seek them out and execute them, based on a wide network of informants in Boer communities. At the tip of the spear of the so-called Project Phoenix is a unit made of patriotic Afrikaner trackers drawn from the Queen's Guard named Koevoet, crowbar, who will pry the terrorist away from the unarmed Boer population and lead them straight to our hands."
 SAF_win_the_villages: "Strategic Hamlet Program"
 SAF_win_the_villages_desc: "Even with all our effort the National Party still holds a significant degree of control of our Afrikaner population and through sympathy or fear they manage to convince many of them to keep supplying their Kommandos, we need drastic measures.\n\nThe Americans are proposing the Strategic Hamlet Initiative, heavily fortified villages where we will move our rural Boer population to keep them isolated from the insurgents while the war is still going on\n\nWe were pushed to our limits by Hertzog's dirty tactics, now we will resort to the strategy that was proved effective the last time the Boers took up arms and make the Traitor's worst fears come true: Hertzog will see the children of the Afrikaner Volk being put behind barbed wire fences just like he once was."
 SAF_south_africa_indivisible: "South Africa Indivisible"
 SAF_south_africa_indivisible_desc: "South Africa shall never fall! We stand strong and united in conviction! No matter how many times the National Party tries to tear us apart from within, our loyal citizens stand together as one and crush those Boer serpents by the heel! No matter how many troops, whether Germans or Boers, swarm our borders, our loyal soldiers shall send them packing to Johannesburg and the Congo! South Africa shall never bend to Germans nor Boers! South Africa shall always stand loyal to the crown and shall never, ever, bow down to a false ruler! May God bless the monarch and country to defend us from the infernal demons! Long live South Africa! Long live the United Party! Long live the Queen!"
 SAF_beat_back_the_invaders: "Beat Back the Invaders"
 SAF_beat_back_the_invaders_desc: "This is our land! We cannot let the Germans take it over and we shall not give it to them as long as there is one honest South African still standing.\n\nThe Nazis and their treasonous pets at the NP think that they could conquer us. We will prove them wrong! South Africa shall prevail with all the might of the free nations and the blood of patriotic men supporting us in our fight to the death.\n\nIn the blue sky and on the deep seas, over our mountains and upon the great plains, South Africa will remain united! South Africa shall be free!"
 SAF_form_the_SASF: "Form the SASF"
 SAF_form_the_SASF_desc: "The legacy of the SAS and its performance in the Second World War still capture the imagination of many of those who read about it. The time has come to found our own special forces, the South African Special Forces group or SASF in short. Luckily, we happen to have several key figures in the SAS who managed to evade capture by the Germans and take up work under BOSS.\n\nWith the war ongoing, no time can be wasted in setting up our own elite forces and sending them to the most dangerous, yet most important operations to break the Afrika Schild from within. Those on the Prime Minister's Secret Service will remain bonded to the legacy of this conflict forever."
 SAF_death_from_above: "Death From Above"
 SAF_death_from_above_desc: "Vast lands, vast terrains, and vast regions are now ablaze with combat, but it is hard for most people to truly understand the scope and scale of this continent, and thus this conflict. The great difference from the Second World War is that the helicopter has come into it's own as an instrument of war.\n\nEspecially this war, with its massive scope and reach, air assault forces will end up making a great difference, to the point where the Germans surely would complain about them being overpowered and unbalanced. But in this grand conflict, we must use every means at our disposal to win it."
 SAF_second_to_none: "Second to None"
 SAF_second_to_none_desc: "The experience of the veterans, the most modern techniques and equipment, all the funding anyone could ever need and it all brought together into one force, one group that shall stand far above any and all competition. Slowly but surely, the SASF will break the German ability to fight this war. And afterwards, there shall only be stories told of South Africa's greatest heroes, who truly were, second to none."
 SAF_armaments_production_board: "Founding ARMSCOR"
 SAF_armaments_production_board_desc: "South Africa's millitary industrial complex has never really existed, more focussed purely upon the free market, local industrialists, and foreign imports to handle such affairs which had been the cheapest option. Now, however, this has come to seriously weaken South Africa during it's greatest crisis, and thus we will need to set up one organization to push forward the creation of a true MIC.\n\nThe Armaments Corporation of South Africa will serve as our key coordination point and industrial enterprise at the same time to retool civillian factories into milltary ones, as well as coordinate resources, funding, and approval of every bit of millitary production on domestic soil. The best advantage of this all is that we will end up as a new industrial powerhouse, profiting of both domestic benefits as well as opening millitary unit exports."
 SAF_armaments_production_board_tt: "Add §Y$SAF_springboks_march$§!, which grants:\n$MODIFIER_INDUSTRIAL_CAPACITY_FACTOR$: [?0.025|+2%]\n$free_production_units_modifier$: [?4|+=1]"
 SAF_everything_accounted_for: "Eradicating Red Tape"
 SAF_everything_accounted_for_desc: "Forms? Regulations? Pollution limits? Planning requirements? What on Earth are you talking about, the Germans are invading! We don't have time for frilly peace time kinds of thinking when we stand on the verge of oblivion. Time to throw out every last piece of red tape and limits and restrictions that make for a civilized society. We must move fast, and break everything needed to throw more force into the defence of the Cape.\n\nThere will be discord over this, but none of that matters much when the alternative is being slaves to the Germans and their Volksstaat puppet state. If anyone wishes to complain about it, they will be able to do so after the war is over."
 SAF_everything_accounted_for_tt: "Modify §Y$SAF_springboks_march$§! by\n$MODIFIER_ATTRITION$: [?SAF_springboks_march_attrition_temp|=-%1]\n$MODIFIER_PRODUCTION_LACK_OF_RESOURCE_PENALTY_FACTOR$: [?SAF_springboks_march_resource_penalty_temp|=-%2]"
 SAF_american_machine_tools: "Importing American Machinery"
 SAF_american_machine_tools_desc: "South Africa has never been a great industrial power despite the protectionist measures employed by the government, and while our industry is adequate it simply can not hold up in this do or die situation. New American machinery will have to be imported en masse to build up whole new factories. The Americans are more then willing to essentially ship over entire factories from start to finish, as long as we keep paying for it. Debt is temporary, but death is forever. Keep the diamonds and gold flowing to Washington, and let the American machinery come in without stopping!"
 SAF_american_machine_tools_tt: "Modify §Y$SAF_springboks_march$§! by\n$MODIFIER_INDUSTRIAL_CAPACITY_FACTOR$: [?SAF_springboks_march_factory_output_temp|=+%2]\n$free_production_units_modifier$: [?SAF_springboks_march_free_pus_temp|=+1]"
 SAF_the_merchant_marine: "The Merchant Marine"
 SAF_the_merchant_marine_desc: "South Africa has had a great inheritance from the British empire, and our merchant marine is still staffed by plenty of figures that were pushed into exile with the complete collapse of Britain. Not just a wealth of ships, but experienced sailors travelled to the Cape and made it their home. Now our merchant marine provides an absolute lifeline for our nation, as they keep the connections to the rest of the Free World open and going.\n\nWe need to quickly buy ships from abroad to strengthen our system of convoys, enabling us to properly suppply all the troops and forces fighting on the coast while also making us able to import more and more of every single thing that we need to fight this war."
 SAF_the_merchant_marine_tt: "Modify §Y$SAF_springboks_march$§! by\n$MODIFIER_CONVOY_RETREAT_SPEED$: [?SAF_springboks_march_convoy_retreat_temp|=+%2]"
 SAF_a_modern_war_machine: "A Modern War Machine"
 SAF_a_modern_war_machine_desc: "It has cost the nation a lot, cash, labour, goods, damage, and suffering, but what has arisen is nothing less than spectacular. Pushed to the brink by the heinous and treacherous attack upon our nation, South Africa has struck back, reforming it armed forces and millitary industrial complex into a smooth running machine that soon enough will decisively decide the battle for Africa. Soon enough, it shall be South Africa who will come to dominate the southern half of the continent."
 SAF_a_modern_war_machine_tt: "Modify §Y$SAF_springboks_march$§! by\n$MODIFIER_PRODUCTION_FACTORY_MAX_EFFICIENCY$: [?SAF_springboks_march_prod_eff_cap_temp|=+%2]"
 SAF_using_the_terrain: "Using the Terrain"
 SAF_using_the_terrain_desc: "" #TLL TODO
 SAF_field_reconnaissance: "Field Reconnaissance"
 SAF_field_reconnaissance_desc: "In any conflict, but especially one as great as this, vision is key. Reconaissance is such a vital factor that it helps tilt entire battles in the favor of those who have the best maps combined with the best knowledge of the enemy. In how vast of a conflict it is, it is astoundingly easy to get lost, or to loose sight of the enemy and thus we will have to invest greatly in upgrading the Reconaissance efforts of our troops so that we can bring that edge to the fight and crush the enemy with superior intelligence and superior forces combined."
 SAF_increase_our_conscription: "Increase Our Conscription"
 SAF_increase_our_conscription_desc: "South Africa is the last state devoted to the freedom and unity of those who reside in it in this whole continent, despite this there are still those who prefer to stay at home instead of joining our ranks in the fights for freedom, encouraging those still at home to join the ranks will win us this war.\n\nEvery person of age and ability must realize that they do their part! We cannot continue fighting as volunteers. We cannot beg our allies to do all the fighting for us! No!\n\nWe must begin calling more of our people to the fight! Though this shall be a sacrifice of one of our liberties, it is better to fight to keep on living than to die as slaves to tyranny!"
 SAF_women_in_the_military: "Women in the Military"
 SAF_women_in_the_military_desc: "The Dominion should not depend on men alone. In this war, it is time for the women to do their part, to understand that they too must prepare for sacrifice.\n\nDespite all fearing the wounds of war, there is no choice left but to encourage our daughters to shed their blood and their sweat just as our sons have.\n\nSouth Africa is a land for all, and if we wish to truly be victorious against our foes, then we must permit our women to have a part in that victory."
 SAF_reinstate_the_cape_corps: "Reinstate the Cape Corps"
 SAF_reinstate_the_cape_corps_desc: "The Cape Corps was originally the only part of the millitary that allowed both the Cape Corps and the Indian peoples of South Africa to serve in the South African millitary, and to try and obtain a better life for themselves and their families. Disbanded after the end of the Second World war, now there is no better time to reinstate it and to call up those who would give their life and labour in defence of the Union. The need is high, and we will have to reach into our purse to secure plenty of new and loyal soldiers to be trained up to defend South Africa in it's greatest crisis."
 SAF_conscript_black_south_africans: "Conscript Black South Africans"
 SAF_conscript_black_south_africans_desc: "How far have we fallen, how desperate is our need that we must conscript the Natives of South Africa. Everybody knows that this is a measure of desperation only, to put guns in the hands of Natives and then to train them is to await a revolt in the future, surely. Already protests have sprung up against this measure, but the Prime Minister's decree stands. Plenty of labourers shall be avaiable to join the army for a solider is much better paid than any kind of Native worker, but when the need is high, then there are no alternatives remaining. All we can hope is that they keep their guns trained on the Germans."
 SAF_technological_innovation: "Technological Innovation"
 SAF_technological_innovation_desc: "Our universities have been turned into research centers working closely with our military and arms industry and fully dedicated to developing new ways to get our boys any advantage they can get in the field. Right now, a task force has been established to modernize and refine the equipment of our Infantry with aims of improving the troops performance in battle.\n\nAnd to make their efforts easier, we must give them all our support."
 SAF_militarize_our_economy: "Militarize Our Economy"
 SAF_militarize_our_economy_desc: "The tense peace we had with the Germans is shattered by their invasion of our Dominion with their war dogs pouring over the border, the economy of our nation must be transformed into something that can sustain our every effort to beat them back, from a nation of farmers and miners South Africa will become a nation of soldiers and gunsmiths!\n\nWe will organize it so that it may keep our people fed, our soldiers armed, our vehicles running and our allies confident in our commitment to seeing victory over any and all enemy forces."
 SAF_matter_of_delivery: "A Matter of Logistics"
 SAF_matter_of_delivery_desc: "No matter how glorious the combat troops are, no matter how modern their tanks are and how much everyone is motivated for war and victory, it doesnt matter a thing if there is no supply of ammunition, food, fuel, spare parts and much much more. Everything must be done to invest in a robust logistical system of supply for our troops so that we can keep them fighting on the great distances and in the difficult terrains they have to be in to complete this great struggle against the Germans.\n\nAs the saying goes, amateurs talk strategy, winners talk logistics. "
 SAF_the_light_shines_on: "The Light Shines On"
 SAF_the_light_shines_on_desc: "They could not frighten us. They could not terrorize us. And they will never ever break us. South Africa is now fully devoted to this war, this sacred war of defence against the oncoming tide of endless grey sludge moving southward. In the face of the darkness, the last light in Africa shines on, its torch burning the hordes of torturers and slavers. Soon enough a great light shall shine over the continent and cleanse it of the dark forces that keep it in chains."
 
