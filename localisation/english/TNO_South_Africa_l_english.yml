 HDV_SAF.77.t: "Looking Back"
 HDV_SAF.77.desc: "To say this day had been coming for a long while would have been stating the obvious. When you enter the office, you also know that one day you will leave it, either by fate or by force. Div's time in office had been instrumental in building South Africa up into a modern, advanced nation that now rested under the security umbrella of the Organization of Free Nations. When he came to power in 1956 South Africa had been on the right track, but he did not doubt that his leadership had been instrumental in really pushing the nation forward towards a much better future. Having led the nation through its most difficult existential crisis and coming out victorious in the defense of South Africa had not been enough to convince the electorate who had decided to take away the United Party's majority and forced them into a coalition to keep power.\n\nBy then, he knew that he could hold on and continue to lead the United Party forward, but it was clear that his time in politics was coming to an end, and he was better off bowing out gracefully and passing the torch to the next generation.\n\nToday was his final day as Prime Minister of South Africa, and he had insisted upon cleaning out his office himself, gathering up family photos, private notes, and other such tidbits. From the well-organized paperwork he left behind to the cleaning of the rubbish bin in the corner, Div found some solace in doing it all himself while listening to the radio in the background discussing the day's events. All his personal belongings had been placed in one box that he had placed next to the door. He paused for a moment, reconsidering his decision. The United Party had lost, but not decisively so and his decision to leave had been his own. He could still turn this around, stay right here, and fight on for his political future with a fervent speech to the nation.\n\nBut he knew one thing above all. History does not look fondly upon those who stay long after their time is up, and to stay on would be quite a risky endeavor, to say the least. He was going to miss the power, influence, and prestige granted to him by the position of Prime Minister, but this was for the best."
 HDV_SAF.77.a: "And with a heavy heart he closed the door behind him"

