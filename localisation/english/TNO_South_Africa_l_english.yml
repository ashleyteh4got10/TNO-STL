 #Events

 SAF.1.t: "Scheduling the Referendum"
 SAF.1.desc: "February 2nd, 1964"
 SAF.1.a: "The monarchists are sure to win!"

 SAF.2.t: "Republicans Win South African Referendum"
 SAF.2.desc: "Cape Town (AP) - The United Party of South Africa suffered a major defeat when a referendum to declare the South African Federation a republic was approved by voters. The proposal, endorsed by the opposition National Party, would eliminate the federation's placement under the British crown, cutting the last official ties with the British Empire.\n\nThe referendum proved highly controversial, with support breaking down entirely on ethnic and political lines. Many Afrikaners supported the referendum, while those of British heritage opposed it. Political faults were also ruptured, with Prime Minister De Villiers Graaff campaigning heavily against the referendum, while the opposition headed up the ultimately successful campaign for it.\n\nMany referendum supporters accused the ruling United Party of heavy handed tactics to suppress the vote, while frequent allegations of racism have plagued the republican campaign. A sizable minority of support for the referendum was from extremist right-wing Boer nationalists, such as the Boer Kommando, who saw it as a necessary step to removing the English-dominated United Party from power. Despite the victory, many of these groups are arming and organizing, claiming that the United Party will try to subvert the will of the people and keep the monarchy in power."
 SAF.2.a: "Nothing ever gets better..."

 SAF.3.t: "Monarchists Win South African Referendum"
 SAF.3.desc: "Cape Town (AP) - The United Party of South Africa enjoyed a major victory when a referendum to declare the South African Federation a republic was rejected at the ballot box. The proposal, endorsed by the opposition National Party, would have eliminated the federation's placement under the British crown, cutting the last official ties with the British Empire.\n\nThe referendum proved highly controversial, with support breaking down entirely on ethnic and political lines. Many Afrikaners supported the referendum, while those of British heritage opposed it. Political faults were also ruptured, with Prime Minister De Villiers Graaff campaigning heavily against the referendum, while the opposition campaigned heavily to get it passed..\n\nMany referendum supporters accused the ruling United Party of heavy handed tactics to suppress the vote, while frequent allegations of racism have plagued the republican campaign. A sizable minority of support for the referendum was from extremist right-wing Boer nationalists, such as the Boer Kommando, who saw it as a necessary step to removing the English-dominated United Party from power. Despite their defeat, many of these groups are arming and organizing, claiming that the United Party had committed widespread fraud to silence broad republican support."
 SAF.3.a: "At least we won."

