 increase_advisor_force: "Escalate troop numbers!"
 increase_advisor_force_desc: "The situation in South Africa has necessitated the need for further military intervention - it would be wise for us to expand our numbers on the ground. However, we risk the possibility of increased public discontent and further straining our resources."
 initiate_policing_action: "Initiate a policing action"
 initiate_policing_action_desc: "The relatively non-conventional nature of the war in South Africa necessitates the need for us to police areas even beyond the front lines. Search for weapon stashes, guerrilla hideouts, ammunition dumps - and liquidate them, we can't risk getting enveloped on multiple fronts."
 increase_policing_action: "Increase our policing forces"
 increase_policing_action_desc: "The guerrilla situation has become untenable for our current forces to handle - there's just one village, one ammunition dump, one guerrilla camp too many. We should therefore increase our policing forces - with all the public risks it entails."
