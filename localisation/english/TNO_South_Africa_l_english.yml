 HDV_SAF.94.t: "Nationwide Strikes"
 HDV_SAF.94.desc: "It started small, with reports coming in of Native workers laying down work and striking for better working conditions in a mine near Johannesburg, but soon enough, this strike had spread all across the country as many, many Natives suddenly joined in. Somehow, the disjointed, decentralized groups of the ANC had gathered enough influence to suddenly flatline South Africa's economic growth and shake its economy, all on the same day.\n\nDiv was being swamped with reports and information of a nationwide strike spreading further and further, with any attempts to suppress the news being completely overpowered by the sheer size of it all. No doubt that in the vast crowds of striking miners, drivers, clerks and other vital worker groups the ANC members would be anonymously embedded to keep herding the workers to uphold the strikes.\n\nWhat was certain that these strikes were going to seriously undermine not just South Africa, but also the United Party (and thus his) reputation to uphold law and order. Even worse, due to the sheer size of the strikes, it would take time to use a carrot and stick approach to deal with them. Div noted to himself that they had taken the ANC for granted and focused too much on the OBW, but that wasn't going to be a mistake that he was going to make again.\n\nPrime Minister Graaff had already begun to plan on how to break up these nationwide strikes when the phone rang, and with some dread and hesitation, he picked it up."
 HDV_SAF.94.a: "Mister Opppenheimer, what can I do for you today?"

 HDV_SAF.95.t: "REPORT ON SUSPICIOUS INCREASE IN OBW ACTIVITY"
 HDV_SAF.95.desc: "The OSSEWABRANDWAG has been detected moving people back and forth across the border to OSTAFRIKA during a weekend by roping in complicit Afrikaner border guards across a 10-kilometer section. By the time this gap in our border security was identified, these individual guards had fled across the border to OSTAFRIKA to join the OWB directly. An investigation into these matters will be rigorously conducted, but it remains an uncomfortable fact that whatever the OBW was trying to achieve here has likely been achieved without too much issue.\n\nTOBRUK indicates movements by truck have been spotted at OBW encampments all across OSTAFRIKA, with the focal point lying near BEITBRIDGE, as well as secondary activity near KOMATIPOORT, with activity rapidly subsiding once BOSS's attention was drawn to the matter, with no doubt plenty of attempts to remove any evidence.\n\nNo noticeable connections between the NATIONAL PARTY and the OWB appear to be involved in this matter, leaving us to conclude that the NP was no active party in this affair but individual Afrikaner sympathies for the OBW will nevertheless be involved.\n\nRotations and shuffles of border personnel will have to occur, along with a prioritization of a majority of Anglo soldiers to guard the border to prevent further Afrikaner OBW sympathizers from opening our borders at an opportune time for the enemy.\n\n\n\nFOR SOUTH AFRICA'S SECURITY."
 HDV_SAF.95.a: "What are those bastards in exile planning?"

 HDV_SAF.96.t: "A Queen in Africa"
 HDV_SAF.96.desc: "Cape Town awoke to a sight unseen in living memory. The city did not merely prepare; it gleamed. Every window was polished to a mirror shine, every street swept until it seemed to glow beneath the morning sun. Banners stretched across the avenues like bridges of colour, the Union Jack stitched together with the blue, white, alongside the orange, white and blue of South Africa's own flag, a union of cloth that said more than a thousand speeches ever could.\nFrom balconies and rooftops, tens of thousands leaned forward, the air thick with the murmur of anticipation. The Queen's car glided past like something from a painting, her figure haloed against the shadow of Table Mountain. Flowers spilt from window boxes, bunting hung like lace across boulevards, and the soldiers standing guard might have been statues, immaculate, polished, impossibly still. Even the air seemed to shimmer, as though the city itself were holding its breath in reverence and awe.\nIt was not just a procession. It was a statement. Every salute was sharp enough to cut the air. Every cheer, though drilled into perfect unison, still carried a raw edge of pride. Even the cathedral bells seemed louder, brighter, as though they too wished to be part of the pageantry. The harbour guns thundered in distant salute, their echoes rolling across the bay like the voice of history itself, solemn and triumphant.\n\nAnd so Cape Town stood poised as the heart of the Commonwealth, a living diorama of loyalty and splendour. For at least one day, the city was not merely South African, but Imperial. The streets dared the Reich to watch, dared the world to doubt. Here, amidst the flowers, the flags, and the fanfare, the Crown did not just reign. It ruled, and for a fleeting moment, the Empire breathed again, proud and defiant beneath the African sun."
 HDV_SAF.96.a: "Long live the Queen!"
 
 HDV_SAF.125.t: "Anointed Before the World"
 HDV_SAF.125.desc: "Inside the hushed nave of St. George's Cathedral, the atmosphere shifted from triumph to solemnity. The streets outside still echoed with the cheers of morning, but within those stone walls, there was only silence, heavy and sacred. Cameras perched discreetly in the aisles hummed as they broadcast the ceremony to millions across the world. The soft whirr of cameras mingled with the faint rustle of robes as the congregation rose.\nThousands watched as Elizabeth, clothed in robes heavy with tradition, was led to the ancient chair prepared for her anointing. Sunlight filtered through stained glass, casting fractured rainbows across the polished marble floor. The ritual echoed that of Westminster, down to the music, the prayers, and the gilded regalia carried in trembling hands. Bishops intoned scripture while the scent of incense curled upward into the vaulted ceiling, mingling with the dust of empire. The marble floor caught the glow of candlelight and reflected it like molten gold. Soldiers of the guard stood motionless beneath the banners of the Commonwealth, their bayonets gleaming like quiet oaths renewed.\nWhen the crown touched her brow, silence fell, complete, absolute, before the pipes swelled in an anthem, and the congregation answered with a roar of "God Save the Queen." It was a sound that seemed to shake the stones themselves, ancient faith meeting modern defiance.\nIt was more than a coronation. It was a declaration, the Commonwealth endures, the Queen reigns, and no edicts from Berlin or mutterings from the Volkstaat would erase her sovereignty. In that moment, every lens and microphone carried not just an image of ritual, but the living heartbeat of an Empire refusing to die, a realm reborn in defiance and memory, reminding the world that loyalty still had a throne, and a name."
 HDV_SAF.125.a: "Broadcast it to the world."

 HDV_SAF.97.t: "In Defiance of Hypocrisy"
 HDV_SAF.97.desc: ""Oh, so you all think you're so much better, eh? The saviours of Afrika, stupid puppets of the Jews, you all are. Washington pulls the strings and the Cape obeys." The old Englishman standing in front of the impromptu scaffold had found his fury in his last moments on this earth. "Disgusting maggots, all of you. You think America will help you uphold the White race in South Africa? No, they will be your undoing, and soon enough you will be the ones slaving away on plantations!"\n\nThe South African soldiers preparing his execution looked at him with a stone-faced look of disgust. The decision to execute the plantation owner had come not long after they had stumbled upon his plantation and the display of what looked to be mutilated corpses of several Natives. Next to the box with the rotting, decaying corpses was a sign with the words "HARD WORK GUARANTEES SECURITY". Even a quick glance at it revealed extensive torture inflicted upon these people, or, as it was more likely, these enslaved people. Asking around from those who had been forced to work here on this Ostafrikan plantation revealed widespread abuse and torture.\n\nFrom the scaffold , the plantation owner looked down upon his executioners with nothing but hate. How dare they place judgment on them, as if South Africa were in any way a beacon of prosperity or justice? "So, this is how you plan to uphold your people, eh? Grovelling before the international Jews in Washington, hoping to keep the table scraps you have before the communists take you over from within, and-" A firm punch to the guts pushed out the air from his lungs as he buckled. Right away, the two soldiers next to him wrapped the rope around his neck firmly, so firmly that he struggled to speak, reduced to just a hoarse screech and a death glare.\n\nAs the chair under him was kicked away, he squirmed for quite a bit before death took him. While the soldiers looked on with grim faces, the men and women who had the misfortune of having been enslaved by this man could only cheer. For them, life was looking up, and soon enough, they would become proper citizens of the new South Africa, where things could only ever get better."
 HDV_SAF.97.a: "Or so it seemed at the time, at least"

 HDV_SAF.98.t: "Playing With Fire"
 HDV_SAF.98.desc: ""Coast is clear." Private Abraham said as he gave a signal, telling his partner to advance towards the warehouse's entrance. His partner, Private David, darted across the warehouse and to a small section of supply where a polished set of M9 Flamethrowers was located. "Bingo!" David whispered as he snagged one off the shelf. He snuck back to Abraham, showing him the delicate design of the flamethrower. Their eyes shone with curiosity as they took in every detail.\n\nBut two had felt that their satisfaction had yet to be met, so they took the weapon outside for "testing". Once outside, they found a desolate area behind the warehouse and began firing off the fine piece of American Equipment. With Abraham's help, David equipped the weapon and marched forward. "Alright, Abraham, you ready?" David said, brimming with excitement. "Yeah, just try not to burn the damn base down," Abraham replied timidly, taking cautionary steps back. David began a countdown as he got ready to squeeze the trigger, expecting a huge amount of fire to be released from the weapon, "One, Two, and Three!" He pulled the trigger, and nothing came out.\n\nDavid felt that practically all the anticipation he had died immediately following the disappointment. "Dang it! Is this thing broken or what?" he said, frustratingly trying to search for anything on the weapon that was blocking its usage. "Give it here, I'm sure you mistakenly got a dud," Abraham said as he wrestled the flamethrower away from his hands. "There's no way that's a dud, I'm sure they would've tested its functionality before they shipped it here," replied David, still refusing to accept defeat. Abraham sighed at David's stubbornness and said, "David, if it makes you feel any better, I can try it again. But I'm telling you this is a dud." Abraham aimed the flamethrower forward, his index finger lay on the trigger; Ready to shoot at any moment.\n\n"You sure you don't wanna...y'know...move?" Abraham said to David, still standing in the line of sight of the flamethrower. "Well, according to you, it's a dud, so I should have nothing to worry about." David retorted with a slight grin. "Right," said Abraham before trying his luck with the flamethrower. He squeezed hard, thinking that the weapon would yet again fail, but contrary to his belief, A hellish orange flame quickly exited the nozzle of the flamethrower. The flame shot straight at David, who was caught off guard by the extreme amount of heat that had been emitted. A part of his uniform had begun to burn immediately after it had reached him. "So this is the power of American engineering..." David said, seemingly caught in a trance by the flames. "Idiot! Put out the flames before they spread!" Abraham shouted as he took off the flamethrower & rushed to put out the fire. They quickly returned the weapon after the incident and couldn't tell their company why they smelled like smoke & ash."
 HDV_SAF.98.a: "Play with fire, and get burnt!"

 HDV_SAF.99.t: "Unexpected Support"
 HDV_SAF.99.desc: "The room was almost quiet, if you ignored the low buzz coming from the ceiling fan. The men of the cabinet were sitting in silence, focused only on what was sprawled out before them. It was a current map of South Africa, covered in tiny markers and pieces. It was clear that the position South Africa found itself in wasn't an adequate one, but the cabinet dared not state the obvious truth. Graaf was the one to break the silence.\n\n"Every time I look at this map, I can't help but wonder..." He took a slight pause, exhausted from the whole situation. "How in the hell did we end up here?" He looked around the room as if he were expecting answers, but the men before him lay silent, Unable to give any meaningful response. Graaff took a deep breath and began taking out his cigar, "Christ help us—" before he could finish his sentence, a voice abruptly interrupted Graaff. "...All hope is not lost."\n\nEvery head in the room turned to Eglin, who now stood at his seat. "...What?" Graaff voiced in confusion, dropping his cigar on the table. Eglin articulated slowly, "All hope is not—" "No. I heard you, but I don't understand what exactly you're trying to get at." Graaf also stood up, getting increasingly angrier. "We have the Germans and the Volksstaat at our necks, slowly backing us into a corner. And if that wasn't enough, all of these goddamn movements are out in the streets protesting as if the war isn't tearing us up already!"\n\nEglin grinned. "Well, Mister Prime Minister, I was about to get to that. Reports are showing these movements are beginning to support us in the war." Eglin handed Graaf multiple reports showing a waning number of protests throughout South Africa and rising support from the African National Congress for the government. Graaf looked curiously before grinning back at Eglin and slightly chuckling. "At least they have got their priorities straight, they know they'll be enslaved if the Germans win here." Graaf lit his cigar before continuing, "But, I suppose this support could come in handy. For now, we can maintain our monitoring of the ANC, but enforcement can be dialed back.""
 HDV_SAF.99.a: "A temporary truce, but a welcome one"

 HDV_SAF.100.t: "Bombed into Submission"
 HDV_SAF.100.desc: "The hot climate of Africa had left the tent humid and stale. On the command table, Major Williams looked over at the map, colored in with contour and numbers. Broken off from the main attack, his task was to sweep for insurgents still within the countryside; a whole week's operation that had left few results until they found, upon sheer chance, they found the main foxhole of their enemy.\n\nA small village, hiding a crack company of Boers that harassed his forces repeatedly in the dark night across the week, lay just kilometres from them. Previously considered an enigma that stumped even the smartest of tacticians, the band of Boers would sabotage the South African forces under the cover of night and disappear into the village by daylight.\n\nNow, they would storm it and end this bloody farce.\n\n"Sir, A Company reports 4 killed and 6 wounded approaching the village. B Company's attack has stalled on the western side due to snipers."\n\nThe pencil started to vibrate in his hand as he slowly lost his patience. The Boers had left his forces exhausted and harassed at every turn; he had respected the law of war, he had abided by his morals, but was it really worth it? A minute of silence left the newsrunner hanging in an impatient anticipation.\n\n"Tell the troops to withdraw, and call for an artillery barrage. Tell them to level the entire village with 105mm shells. Ask them to follow up with Close Air Support bombing on their backline." A short squeal of protest left the messenger with a brick wall of resolution. "Look, son, there are good men dying out there just to preserve some brick and mortar houses. I am not going to waste any more just for a useless village. Call them in."\n\nThe radio worked overtime. Soon enough, the roar of big guns and jets echoed in the village, followed by the screams and yells of the dying. Grey dust, black smoke, and orange flames replaced the red brick and mortar houses.\n\nThe major looked at the devastation through the binoculars. The Boers had been shattered, and nothing was left of their resistance in the region."
 HDV_SAF.100.a: "So went the morals of war with them."

 HDV_SAF.101.t: "The Fall of Bloemfontein"
 HDV_SAF.101.desc: "The coarse, rubber wheels of American tanks, splashed by the dust of the savannah, scrunched upon the gravel roads that led into downtown Bloemfontein. Civilians, both lining the streets and peeping out the gaps in their shutters, cautiously gazed in silent and solemn lines at the OFN troops that flooded down their roads. The previous battle had left sharp dents in the helmets, machinery, and spirit of the soldiers, shown on their silent faces, but it had ultimately ended in a narrow OFN victory. And for the Boers and Germans, this was nothing short of a humiliation. While the war wasn't over quite yet, it was a major victory regardless. City after city had fallen, like grains of sand through Boer fingers, but this one was a big one. Of course, there was still the matter of the Reichskommisariats to the north, but that would be dealt with later.\n\nWhile Uncle Sam's soldiers rapidly went about restoring order in the city, South African and Dutch soldiers were put in charge of the prisoners, as well as soldiers who remained in the city prior to the Boer surrender. To Americans, the Boers were still seen as scum, indifferent to any other proxy they had slashed through, but to the South Africans and their Dutch comrades, they were so much worse than that.\n\n"On your feet, traitor," muttered a 20-something-year-old Capetonian soldier. As the prisoner began to push himself up from the gravel, the soldier's rifle came crashing down on his back.\n\n"Faster, you fucking maggot," the soldier barked as he let out his fury at the scrawny prisoner. "You know full well what you've done, selling yourself out for the Germans. How desperate were you? It doesn't matter," he continued, "We'll serve you the justice you deserve, regardless of how long it takes." The Boer shook the pebbles from his tattered boots in utter silence.\n\nHe beckoned one of his fellow brothers to his side, frog marching the prisoner off to a holding cell. As the soldiers patrolled their prisoners along the quiet streets, they halted at the sight of an American soldier on patrol. He stopped taking a close look at their uniforms, spotting their South African insignias. Silently, he nodded before moving along, knowing that whatever justice the Boer deserved, it would have to be carried out by those he betrayed."
 HDV_SAF.101.a: "Justice sees all"

 HDV_SAF.102.t: "The Battle of Porkchop Hill Part One"
 HDV_SAF.102.desc: "APR. 6 23:00 : An artillery barrage on "Pork Chop" Hill Fortifications has been initiated in order to send Boer men into defensive positions in trenches and bunkers. The Hill is quickly overrun by OFN forces. Isolated bunkers and pockets of trenches continued to be defended by the remaining soldiers. Boers organize attacks on nearby positions, placing pressure upon all positions.\n\nAPR. 7 04:30 - 15:00 : Boer Forces attack the hill, having reached primary fortifications but suffering large casualties (approx 50% or more). Continued artillery shelling causes the Boers to have to take shelter within existing fortifications. Boer Forces eventually take control of the bunkers and fortifications. Heavy Shelling leaves approximately 25-30 Boer Survivors in fortifications, forces retreat and are relieved by other groups due to heavy casualties.\n\nAPR. 7 23:00 : OFN Forces take artillery fire as they successfully re-take the hill, reaching trenches with some casualties. Additional Companies moved up the right flank of the hill to avoid artillery fire from Boers.\n\nAPR. 8 -01:30-04:20 : Boer forces begin a surprise attack during the early morning, inflicting heavy losses on companies present. While nearly overrun, counterattacks by other companies caught the Boer forces off guard on their flank and abruptly ended the assault. Attempts at seizing the hill continued through the night; however, no further ground was gained by such attacks.\n\nAPR. 8 - 07:15: Additional Companies reinforce existing companies on the Hill, clearing all remaining bunkers and trenches of Boer Forces, securing the hilltop.\n\nSUMMARY : Approximately 77,000 Artillery Shells were utilized in the seizure of the target. Approximately 125 Dead and 373 Wounded\n\n"
 HDV_SAF.102.a: "All this for one hill?"

 HDV_SAF.103.t: "Running to the River"
 HDV_SAF.103.desc: "Run, run as quickly as you can. Don't stop running. Do not stop running or you will die. Ignore the sound of the Germans in the distance, ignore the way you trip over the ground. Ignore everything but make as much distance as you can because it is the only thing that matters. \n\nPieter Kenyon van der Byl, Minister to the Union of Bechuanaland and once the most powerful man in the state, ran as though his life depended on it. Because it very much did. He had stayed in Gaborone as long as he could in order to make sure that no incriminating files could be found. However, he had stayed too long, and Pieter had to run. Though running seemed of little use as the east of the city was flooded and the road westwards had been occupied. The only thing he could do was to get across the lake.\n\nPieter could distantly hear the sounds of German shouting in the distance. Then he saw it, a boat, a canoe on the edge of the lake. He could see it being manned by an illiterate and boorish native, but that did not matter now; he just had to live. "Stop ! Let me in ! I'll give you money, thousands!" The boatman looked back, a look of recognition on his face. Then the eyes of the man hardened, and with a push, he set the canoe towards the lake, leaving van der Byl panting at the edge of the lake. \n\nFirst anger, then dread settled on Pieter's heart as he looked around. Then moments later, he heard a chuckle behind him. "Well, well, if it is not Herr van der Byll." Turning around, eyes wide, Pieter could see a German officer walking towards him, a coterie of soldiers behind him. "Let me go, please, I have a lot of money. Millions of dollars in foreign accounts. They can be yours if you get me to the border." However, Pieter's plea fell on deaf ears as the officer continued laughing. \n\n"Ah, Minister, for race traitors like you. There is no mercy." Panicked, Pieter turned towards the lake and splashed into the water."
 HDV_SAF.103.a: "He never saw the bullet"

 HDV_SAF.104.t: "End of the Line"
 HDV_SAF.104.desc: "The Afrikaner men were slumped like poorly placed decorations around the inside of the battle-scarred building, coughing and sniffling from the dust that trickled down from the ceiling tiles as bombs rained down nearby. Their torn-up and homemade uniforms bore even deeper rips and tears from fighting, mixed in amongst the demoralized and sweat-greased militia comrades. In their minds, from the underage boys who lied about their age to fight to the old and weary men who didn't belong anywhere near a war, only one thought ran through their heads - this was the end.\n\nOfficers and other higher-ranking members of the Afrikaner force paced about, trying to numb the sickening feeling of defeat and hunger in their stomachs that swirled with the emotional distress everyone shared. Some of the younger boys began crying for their mothers, the feeling of abandonment and regret ringing in their ears to the all-too-familiar tune of weeping. Their hope they once swelled for in the early days of the war, the pride they once felt, was dead.\n\nHowever, in the midst of their lamentable elegy, they began to hear the sound of... exclamation? Hooting and hollering? Shrills and shrieks? It couldn't be. Some who had the energy to stand had gathered around a shattered window to see the commotion. Riding atop their tanks were South African soldiers, waving their orange, white, and blue tricolor as they marched right into the final Afrikaner-held areas, completely uncontested, funneled into semi-formal conduct and sync, unable to stand still at the thrill of success. One man delivered an impromptu speech through the mock parade, spitting into a megaphone as he caricatured and mocked Albert Hertzog.\n\nHumiliation and agitation pressed against the men in the building, yet none had the energy to truly feel it. Numbness had hollowed them out. As the music waned, an officer slipped into the shattered remains of a bathroom and locked the door. A muffled gunshot rang out, followed by the dull thud behind its wooden frame. Not a single soldier flinched. No one spoke. They remained silent, drained of all emotion."
 HDV_SAF.104.a: ""Dead in the water, they wept in silence, awaiting what else fate brought them.""

 HDV_SAF.105.t: "A Last Letter"
 HDV_SAF.105.desc: "I wish I were home.\n\nI wish I were home and not in some darn tunnel on the other side of the world from you, mama. If you end up ever reading this, tell Marv he can have my records. I won't have much use for them where I'm ending up.\n\nJoey, I hope you don't end up blaming yourself for this whole thing. Yeah. I know you were faking that leg thing to keep yourself out. If I were smart, I'd have done the same. It wouldn't have been any use if we both ended up dead, and I'm the older of us, so I'll be damned if I'm gonna let my little brother decide he should have died in my place. One of us has to look after Mama after all this, right? I did get your letter. I hope that the lady you met is good to you.\n\nIf I'm honest with myself, I don't know if you'll end up seeing this. Hell, if anyone will. I guess I'm living in that narrow hope that this will end up being pulled out by someone from this place. I kinda gave up on coming home, mostly because of a few things I ended up doing myself. That's why I'm addressing this to you all.\n\nI can hear the Krauts on top of me, and it's only sooner or later that they either storm in here and shoot me dead, or the alternative I came up with:\n\nI managed to get a line out to the division, and the Artillery's about ready to hit the tunnel where I'm at. It'll take out a few Krauts too, so I guess it's a win-win for them. Hardly feels like winning where I'm at though.\n\nI guess this is what dying like a hero is supposed to feel like. If they try to tell you I died with valor or something, tell them where they can stick it, because I'm scared. I'm scared and I want to go h-\n\n"
 HDV_SAF.105.a: "The rest is caked in soil."

 HDV_SAF.106.t: "Refugees in the Night"
 HDV_SAF.106.desc: "The nights were quiet as the whole world turned to rest, the sweltering sun no longer hanging over Africa. It was a moment of escape from the hell that its leader called the "Greater African Reichsstaat" when its victims did not need to work the stringent work quotas, or worse. Even tyrants and murderers needed to sleep, and this is where Natives found what little relief there could be. Yet things were getting worse, and for many people the choice between death and fleeing was rather simple.\n\nEvery night, the South African border guards encountered exhausted refugees at the border, people with nothing but the few clothes they wore, while their bodies were thin and frail from underfeeding. What had been an infrequent occurrence had become a stream, and the border patrol was well equipped to deal with these desperate people who seemingly spoke unknown languages from the varied African languages of the continent or German, the language of their former slave masters. And these desperate people, strained and many on the verge of death, were the lucky ones.\n\nMany of the border guards were veterans of war. They had seen death, they had seen destruction, and many a burnt or ruined village, and nazi atrocities were widespread during the South African War. Yet even just seeing these people and hearing their stories, night after night, seemed to scar the souls of the poor men who were guarding the border. Stories of terror, of death on an almost industrial scale, and more horrors that defied any and all semblance of humanity travelled southwards and invoked deep feelings of sympathy from all involved.\n\nEven the most ardent segregationists in South Africa recoiled in horror at the apparent continent-wide genocide unfolding to the north. For those less entrenched in such beliefs, it was a moment that demanded reconsideration of their stance. For the Progressive Party, it was a call to decisive action—not only to help refugees find safety and resettlement within South Africa, but also to appeal to the nation's conscience. Through these stories of suffering, they had hoped to unleash empathy and guide the country toward a more humane, compassionate perspective.\n\nAfter all, who would possibly want to compare themselves to the German hellstate in the north?"
 HDV_SAF.106.a: "South Africa, the bastion of humanity"

 HDV_SAF.107.t: "The Abomination"
 HDV_SAF.107.desc: "Part of the duty of beginning the occupation of the sprawling lands was conducting an inventory. Teams were sent out to thoroughly assess the situation in the conquered territories of Ostafrika, where South Africa had established a temporary puppet state. The goal was simple: figure out what could be done with these lands without overextending themselves. No one in Cape Town was foolish enough to assume they could hold all of it indefinitely, but they could still exert economic influence.\n\nJack Rooiwater, an engineer from Durban, was dispatched to inspect Mozambique's electrical networks. What he discovered, however, left him utterly speechless. In fact, his first words upon stepping into a particularly notorious power plant were blunt and unmistakable:\n\n"What the fuck is this piece of shit?"\n\nBafflement washed over him as he navigated the chaotic interior. The plant was a monument to disorder: transformers stacked haphazardly, wiring tangled like spaghetti, and not a single safety precaution in sight. SS flags hung in silent testament to its creators, yet nothing explained the rationale behind the design—or lack thereof. Every step he took felt like walking on a powder keg, a disaster waiting for the slightest spark. Salvaging it would have required far more effort and resources than simply tearing it down.\n\nIn the end, Jack's report to his superiors was a single line: a scathing condemnation of the Reichskommissar's disastrous attempt at construction, now destined to be remembered only as a cautionary tale."
 HDV_SAF.107.a: "Total Loss - Immediate Demolition Required"

 HDV_SAF.108.t: "The Beginnings of a Chance"
 HDV_SAF.108.desc: "The Progressive Party had long been a minor presence in South African politics after the South African Labour Party had merged into the National Party. Occupying a few seats in Parliament, they were often overlooked but kept in the game of politics by the constant financial backing of Harry Oppenheimer. The support was of a partially selfish nature, making the Progressive Party come out far more liberal than one may expect, but no one doubted Oppenheimer's progressive ambitions. Everyone knew that new elections would be approaching, but things were different now, and everyone knew it. De Villiers Graaff's precious status quo was broken by the South African War, and the country itself felt like it was on the cusp of a grand new change. So the stories went in the Progressive Party headquarters as Harry Schwartz and Helen Suzman were meeting to discuss their strategy for the upcoming elections. What was different this time was that they were not specifically targeting merely some specific districts where they stood the best chance. With the explosion of the National Party and the split in the United Party, the conservatives and moderates seemed too busy fighting amongst themselves, which gave them an opportunity this time around that would give them the chance to finally start realizing some change in South Africa.With this came a new election strategy, as the party rushed to get candidates for pretty much every single seat they could get. They would present a united front offering a proper alternative vision to the seemingly endless stagnation that had led the nation to ruin, by the same old figures sitting in leadership monopolising power and drowning out any new ideas that the nation desperately needed.. With that alternative vision now in place, all that was left was to convince the voting public of it."
 HDV_SAF.108.a: "The times, they are a changing..."

 HDV_SAF.109.t: "REPORT ON THE LATEST OPERATIONS OF THE AFRICAN NATIONAL CONGRESS"
 HDV_SAF.109.desc: "The arrest and imprisonment of NELSON MANDELA did not seem to have dealt the blow against the AFRICAN NATIONAL CONGRESS as was intended. No significant disruptions of their operations have been noticed, owing to their more decentralized structure, which makes individual cells vulnerable to being cleaned up.\n\nWider attempts at suppression must continue, as well as the focus on identifying and imprisoning prominent leadership figures, to keep the ANC disjointed and unable to gather strength. Information granted by BLACK BOOK indicates that the current figure leading the ANC is OLIVER TAMBO. Highly intelligent for a Native, he was one of the few natives who was allowed into the UNIVERSITY OF FORT HARE alongside MANDELA, but having been expelled in 1942 for joining in a student strike, after which he led the ANC YOUTH LEAGUE until the ban on the entire organization in 1959.\n\nForeign support for the ANC is mainly provided by the CAMEROON AFRICAN STATE, who continue to spread the doctrine of PAN AFRICANISM across the entire African continent. In return, BOSS has sent support to FREE FRANCE to serve as a check against CAMEROON. A low-intensity conflict between the two forces has already been brewing and is likely to turn into a war for supremacy over WEST AFRICA.\n\nThe ANC, having been forced underground, began to set up a paramilitary wing called UMKHONTO WE SIZWE (SPEAR OF THE NATION) that is planning ARMED RESISTANCE against South Africa, but information on it remains currently elusive, and no serious occurrences have yet been ascribed to the UWS. Identifying UWS members and targeting their attempts at acquiring weaponry should be of the highest importance.\n\n\n\nFOR SOUTH AFRICA'S SECURITY."
 HDV_SAF.109.a: "The endless struggle continues on and on."

 HDV_SAF.110.t: "REPORT ON THE OSSEWABRANDWAG IN EXILE"
 HDV_SAF.110.desc: "In many ways, the expulsion of the OWB and its members into exile has had a counterproductive effect. Had they been properly broken up within our borders, that would have decisively dealt with the organization, but since their exile, they have settled all across the German colonies while remaining relatively close to the border. Reporting by LODESTONE and TOBRUK indicates continuous attempts at paramilitary training of all male OBW members of age, as well as OBW movements and deployments by truck. All of this is willingly enabled and directly supported by the Reichskommisar of Ostafrika, HANS HUTTIG\n\nMore troubling remains the informal networks between the OBW and the NATIONAL PARTY under ALBERT HERZOG. Direct proof of collaboration remains elusive, but the circumstantial evidence of these contacts remains extensive. OBW leader JOHANNES VAN RENSBURG, deputy leader BALTHAZAR VORSTER, and diplomatic envoy to the Germans ROBEY LEIBBRANDT maintain extensive connections in the Afrikaners, plenty of which hold sympathy to the OBW's calls for a VOLKSSTAAT.\n\nThere can be no doubt that ARMED STRUGGLE is the OBW's intention, backed by HUTTIG, yet any indication on timescale is not yet apparent. Propaganda measures by the OBW have a decent penetration into the Afrikaner citizens of South Africa, but it would be a mistake to see that it is uniformly supported. Plenty of Afrikaners are happy with the Union and see no reason to disrupt the peace with an armed struggle that would only ever strengthen the AFRICAN NATIONAL CONGRESS. Efforts must be taken to repulse any attempt by the OBW across the border, with additional defences being put in place in NORTHERN TRANSVAAL, and it is suggested to increase the military presence around PRETORIA as well as additional security measures around PRIME MINISTER GRAAFF and leading ministers of the UNITED PARTY. Geography has left PRETORIA exposed to any move across the border; thus, efforts should be undertaken in case of emergency to move all governmental functions to CAPE TOWN, with preparations for such a move already being initiated by BOSS.\n\n\n\nFOR SOUTH AFRICA'S SECURITY"
 HDV_SAF.110.a: "A storm is brewing on the horizon."

 HDV_SAF.111.t: "Waiting in the Wings"
 HDV_SAF.111.desc: "Watching through the window, Johannes van Rensburg could see hundreds of Afrikaners walking in lockstep with each other, marching like a well-oiled machine. The sight warmed his heart as he felt a deep sense of pride, but also a sense of responsibility. It was up to him to make sure that these young White men could live in freedom from their Anglo oppressors in South Africa.Feeling a hint of regret, van Rensburg turned to his guest. "As you can see, Her Baer, the men of the Ossewabrandwag are ready for the inevitable struggle. Continued support by the Ostafrikan government, then tens of thousands of soldiers could be ready for conflict if they are adequately supplied." As van Rensburg turned around, he could see the rest of the men gathered in the room, mostly members of the Ossewabrandwag but also several Ostafrikan official representatives who seemed to be smiling. "These men do indeed seem well-trained. I am sure that Herr Huttig would be more than willing to support your endeavours in South Africa."Hearing these words, van Rensburg could feel a sense of triumph. "You have chosen wisely, Herr Baer. Together, we will break the hold of the Anglo invader upon this land. For too long, your Germanic brethren, the Afrikaners, have been cast down. We tamed this land and brought it prosperity, then the British arrived and they took our rightful land from us. The British put us in camps and treated the natives as if they were more than animals. They cast us down, but soon the time will come for us to rise up once more."Rensburg smiled. "The Ossewabrandwag were exiled as villains, but we will return-""
 HDV_SAF.111.a: "As heroes"

 HDV_SAF.113.t: "A Work of Passion"
 HDV_SAF.113.desc: "Jack Winters was perhaps the luckiest man in the world, for his work was his hobby. Every day, he would show up at his job at Austral Armaments in Cape Town and get to work on designing new vehicles and weaponry, pen and paper in hand. Always having been a hard worker, with the outbreak of the war, he had whipped himself into a working frenzy to push forward a new prototype vehicle design.\n\nHis latest work, the Eland armoured car, was already seeing battle in the north, serving as a quick and mobile vehicle to outmaneuver German positions and deliver surprising strikes against weaker sections with its twin M1919 Browning machine guns or its main gun, the 90mm Denel GT-2. Alternatively, versions with a built-in 60mm K1 mortar were able to heavily barrage German fortified positions and deliver a surprising amount of firepower for a quick and nimble vehicle.\n\nBut Jack was thinking bigger, much bigger. South Africa would not become just some OFN servant state, like the Afrikaners would become the lackeys of the Germans; no, it would stand alongside them as a partner state able to defend itself in the long term. For that to happen, South Africa should be able to produce more, much more domestically.\n\nStarting off with the plans for the Centurion, a British-designed tank that was never brought to completion due to the German invasion, Jack began to modify it extensively, replacing as much as was possible with domestically produced alternatives. Kept to a reasonable level, he was convinced that South Africa could quickly make these drawings a reality, with the urgency of the war pressing down upon them."
 HDV_SAF.113.a: "He called it the Elephant"

 HDV_SAF.114.t: "With Apologies to the External Secretary"
 HDV_SAF.114.desc: "Dear External Secretary of Guangdong,\n\nGeography has always been a deciding factor in the success or failure of a nation. Although South Africa and the nation of Guangdong are separated by a great distance, trade between our two countries has steadily grown since Guangdong’s founding. For a time, the future of our bilateral relations seemed promising. Yet the geopolitical reality confronting South Africa has shifted dramatically. In the wake of the brutal attack upon our nation, our sole hope for survival now rests with the United States of America.\n\nWith such aid, however, come unavoidable conditions - chief among them a complete embargo on the entire Co-Prosperity Sphere, a measure born of the deepening geopolitical hostilities between the United States of America and the Empire of Japan. As such, from tomorrow, we shall close our ports to all ships from the Co Prosperity Sphere, and henceforth, all trade between our two nations will cease permanently. While the government of the Union of South Africa would still have been open to further development of bilateral trade relations, we ultimately have no choice but to pursue this embargo against you.\n\nI hope you have been adequately notified of this matter.\n\nSigned,\nJacobus Strauss\n"
 HDV_SAF.114.a: "Foreign Minister of the Union of South Africa"

 HDV_SAF.115.t: "The Boys in Blue"
 HDV_SAF.115.desc: "Sergeant Stefan B. Cawood took a short but furious scan at his men. They were policemen, not soldiers, yet here they were, defending an important cross junction near the city's suburbs from hordes of the enemy. Emptying all the weapon lockers in the cities' Police Stations, organizing themselves by rank and file, every man was armed with shotguns, old Lee-Enfields, or whatever guns they could lay their hands on, rusted or not. Throwing around a single lighter, almost out of fluid, he reminisced with a couple of his old colleagues who had crawled out of retirement to fight for the democratic cause. He had fought in the last war, lucky enough to escape captivity, only to be dragged back into the fray, now trapped behind a sandbag wall and sandwiched between abandoned houses and a looted police precinct.\n\nHe is snapped out of his reverie as a crack rang above his line of hearing, sending brick and mortar onto his blue fatigues. Whipping his head around the corner, he spotted them. The Boers had arrived. Throwing down his cigarette in frustration, he barked his orders as he was doused in another storm of red brick dust. The cacophony of gunfire followed. A Vickers armored car swung around the corner and opened fire, cutting down several of the rushing Boers. The engagement lasted for less than ten minutes, with Stefan barking orders throughout, but as the sun set, the Boers broke off, littering the street with corpses. It seems they had held the line, for now. The sun dipped into its chilling hibernation without any fanfare, shining the last of its life on the makeshift steel ration containers of biscuits and beef. Stefan slept with unease, knowing that the Boers would come back.\n\nThe next morning started with a hail of explosives. Jerked out of his sleep, Stefan found himself, as usual, caked in dust. The Vickers car swung around the corner and opened fire at the amassed group of Boers as usual, but this time, they weren't cut down. Swinging with too much force, it hurtled towards the other side of the road, ramming into a now abandoned office. The building collapsed in a cloud of dust and debris, the crack of gunfire echoing as the police, caught in disarray, fired back blindly. Behind the tattered sandbags, Stefan's cover exploded—sand spraying into the air like shattered glass. Realizing the hopelessness of the moment, he steeled himself, raised his whistle to his lips, and blew its shrill scream throughout the suburb. His voice ripped through the chaos, sharp and unyielding, commanding fresh orders into the madness: a hopeless retreat.\n\nHurling his rifle with him, moving off with several of his compatriots in disarray, he ran through the city streets, and only one question remained on his mind."
 HDV_SAF.115.a: "Where the hell is the army?"

 HDV_SAF.116.t: "Far from home"
 HDV_SAF.116.desc: "The news of the events in the British Isles had a great impact in South Africa, where many hoped for Britain to once again reclaim its freedom against the German tyranny, just as the South Africans were fighting to protect their freedom against the German colonies. Some didn't dare to hope, thinking about the failed uprising in '56 and knowing that the chances of the liberation of Britain would be slim at best. For others, it was another sign of the rising tide of the free world, driving back the oppressors that had so devastatingly crushed the free peoples of the world under the boot of tyranny.\n\nFor the cabinet of De Villiers Graaff, a very different emotion overpowered all others. Frustration. Had they been at peace now, then they could have sent everything they had, all material support possible to the British rebels, the entire fleet in exile returned home in one glorious armada, this time to liberate the British Isles from tyranny. Yet, as the brave rebels fought their own battle far away, there was nothing that South Africa could send but moral support, kind words, with not a single way to actually affect the outcome, which would have to be left up to the Americans and Canadians going to the limit for the cause of freedom.\n\nWhile South Africa would push back the tide, they would equally try to follow the fight going on in the British Isles, and for the first time in a long time, hope for a Free Britain that may once again shine a bright torch across the world."
 HDV_SAF.116.a: "Nothing else could be done."

 HDV_SAF.117.t: "The Fall of Cape Town"
 HDV_SAF.117.desc: ""Please, sir, my family and I have the money..." pleaded the man at the front of the line, shoving and thrashing through the sea of the panicked faces of his countrymen in a wired fence courtyard outside the tarmac of the Cape Town International Airport. "I'm sorry, sir, but the OFN forces have full use of the runway. There's nothing I can do."\n\n"What, they have full use of our runway so they can abandon us?!" shouted the man, the cry, clearly emulating the general consensus of the crowd. The OFN contingent left to guard the airport during the last of the evacuation had been fighting desperately to keep the Germans and Boers at bay, just outside the city, but hadn't had the time to consider the fate of its civilians. The two armed men guarding the hole in the fence, the only civilian entrance onto the tarmac, clenched their American M14's as they stared into the rising mob, but a loud boom of an artillery shell upon Table Mountain surely reminded them that this was the safer place to be.\n\nMinute by minute, the shouting of Cape Town's civilians had grown until it drowned out even the loudest of plane engines. Eventually, the guards could not hold on to order anymore, and the overwhelming tides of the crowd crashed down over the flimsy wire fences. Like a liquid rushing out of a cracked glass bottle, men, women, children, and suitcases began spilling out onto the black concrete. The man, with his wife around his shoulder and child by his hand, darted in front of the swelling crowd and towards the hind door of the last American transport aircraft. As its black jaws began to close meters away, and despite the shrieks of the soldiers inside, he launched them both over the edges of the metal flap before watching his wife's blue dress slip away from sight into the aircraft. A disoriented mother and son clambered onto the plexiglass back window to view their rapidly fading father as the aircraft pulled away.\n\nWiping the condensation away, the mother and child pressed their hands on the glass so that only the rapidly dwindling man remained within the gaps of their fingers. Tears welled in their eyes as they watched their husband and father fade further and further away into the black plain as only a single thought burned in the child's mind..."
 HDV_SAF.117.a: "Would they ever return?"

 HDV_SAF.118.t: "Another exercise in futility"
 HDV_SAF.118.desc: "Harry Schwarz straightened his crimson tie, a nervous reflex he had developed over many, many court cases. He had gotten quite effective at putting on a mask of confidence in court, which came in quite handy with cases as hopeless as this.\n\nHis client, the defendant, was one Wilson Jones. Age 19. Single. Black. Works at a local factory. No criminal record. Supposed crime? Attempting to bomb a Cape Town police station. Police had 'found' an undetonated explosive device hidden in a closet at the station, and Wilson had been seen in the vicinity. That was enough for them to arrest him on the spot and level terrorism charges against Wilson. Now, as Schwarz prepared to make his closing statements to the all white jury, all but sure to convict, he would have to make one last desperate appeal to protect his client. \n\n"The charges levied against my client, Mr. Jones, are very severe. The prosecution alleges that this man managed to sneak into the police station while holding a shoebox-sized explosive device, disable all the cameras and destroy their footage, break into the back of the station, and then get out all without being spotted until after he left. On top of all this, the prosecution has claimed in their case that he did this without help, alone, with no prior training or connections to any groups." \n\n"Now, ladies and gentlemen of the jury, I would like you to look at my client," Schwarz says as he points his arm dramatically at Jones, "and look at what you see. Wilson isn't some hardened criminal; he's just a boy. A very unfortunate boy who happened to be in the wrong place at the wrong time. He could have been any of your sons," he said, waving his hand at the jury, "walking down the street one night and just happened to be near the scene of a crime. I ask you to think about that when you make your verdict, of this innocent boy whose parents are here today in this courtroom, and I hope you will make the right decision."\n\nAnd think the Jury would, as they finished deliberating in 7 minutes. "We find the defendant, Mr. Wilson Jones...""
 HDV_SAF.118.a: "Guilty on all charges."

 HDV_SAF.119.t: "A House Divided"
 HDV_SAF.119.desc: "Div knew very well that this moment had been coming for a long while. For a long time, the three wings of the United Party had been arguing and debating with themselves, but stuck together despite their differences to govern the nation; the two opposing wings of the progressives and the conservatives had stuck together... until now. When Vause Raw, backed by several of the prominent conservative figures, entered his office unannounced, it was clear and apparent what was going to follow.\n\n"Vause, please spare me the speech and just get down to what you want." Div continued to sort out paperwork on his desk in a rather dismissive fashion.\n\n"This is exactly the kind of attitude that has forced me and my allies to split away from the United Party and form the New Conservative Party, which will be running against you and the pointless bleeding hearts you've allied yourself with." Vause glared at him.\n\n"What matters much more than that is political instability while we tend to South Africa's reconstruction," Div responded. "Is the NCP going to stay in government for the next period, or are we going to have a pointless political crisis in the midst of our reconstruction? How much foreign investment will we get to deal with the wounds inflicted upon our nation if the government immediately collapses after the peace? How will the people respond to you personally not taking your responsibility and giving this nation another crisis just after we survived another one? Wouldn't do well on your polling, now would it?"\n\nThere was a pause as the two men stared each other down, with Vause considering his options. "We will back the government for another year at most. After that, your time in politics will be through." \n\nDiv nodded. "Thank you." He went back to reading reports while the Conservatives left, the entire matter of their separation from the United Party being somewhat deflated for the moment. But if anything, they were not interested in more unrest, and soon enough, they would be able to push out the progressives from power and influence for good.""
 HDV_SAF.119.a: "The Divided Party, after all."

 HDV_SAF.120.t: "A dimming torch"
 HDV_SAF.120.desc: "It had been a good moment. A moment in time where things all seemed to look up and the entire world would rise against the Germans and shatter their tyranny once and for all. Where the torch of freedom, democracy, and the higher aspirations of Man would once again enlighten the world. But that moment had been temporary, and now Britain, Great Britain was once again chained, enslaved, and broken underneath the German heel.\n\nFor those who had longed to return to their true home, where the green fields and gentle rolling hills stretched far and wide, it was a bitter pill to swallow. There would be no glorious return from exile; if anything, it would now be permanent. And even that was still under threat from the Germans and their Boer puppets pushing in more and more. To say that the loss of a Free Britain was great, but in some sense, its actual impact remained muted.\n\nThe threat remained, the war carried on, and there was still a chance to really win it. The orange, white and blue flag still flew over the Cape, more aid continued to flow from the Americas, and more volunteers arrived day by day, resolute in their defence of South Africa.\n\nThe torch may have dimmed somewhat, yet the cause of liberty remains in the heart of every person that rose to resist and fight the Germans. None of them had been able to change Britain's fate, but perhaps they could still change South Africa's."
 HDV_SAF.120.a: "For South Africa was not yet lost"

 HDV_SAF.121.t: "A warm message from home"
 HDV_SAF.121.desc: "In any other case, the assortment of equipment would have been called outdated junk. In the case of South Africa, where any piece of equipment was useful in this massive, attritional conflict, it was most welcome. But what mattered most to the dockworkers in Cape Town was the message stamped on the side of the crates.\n\nA gift from Britain, now released from its chains to Germany, and defended by the American navy, and free to send aid. It was still a nation impoverished by 18 years of exploitation, enslavement, and subjugation, yet it saw fit to send material aid to the South African struggle. In a way, this would be the start of a rekindling of the relationship between the two nations, inexplicably linked by history and the common cause of freedom.\n\nNot that the people who would be equipped with these World War II rifles, old PIATs, and old uniforms would be very happy to receive them. Yet quantity had a quality of its own, and a division equipped with old British gear would fare much better than the hypothetical poor sods who would have to fight the Germans with sharpened sticks. In some fashion, this act of South Africa using British hand-me-downs would be merely a continuation of an age-old tradition ever since the Cape Colony was obtained by Britain in 1816.\n\nGermany had been driven back there, and now the courageous soldiers of the OFN would drive the Germans from Africa altogether."
 HDV_SAF.121.a: "The British send their regards"

 HDV_SAF.122.t: "A rebuke from London"
 HDV_SAF.122.desc: "10 Downing Street, London SW1A 2AA\n\nDear De Villiers Graaff,\n\nOn behalf of the Commonwealth of Britain, I have been consistently disturbed and disgusted with the role the government of South Africa has taken towards its native majority population. Since the dawn of the birth of your system that has enslaved them, it must be said that steps towards giving them their human right for total freedom must be taken. You have continued to mitigate the errors of this inhumane system under your time as Prime Minister, and unfortunately, for both the workers of the world and myself, I simply cannot permit Britain to interact with such a brutalist regime for any longer.\n\nThis is a matter of the provisions your administration has promised to the country, of which now must be applied to every South African, regardless of their race. I will not allow such continuation of systematic segregation to concur in and around the sphere of the Commonwealth between territories. The people of South Africa have mass wealth and social inequality, and cannot work, let alone exist, with the continuation of this repulsive racial hierarchy.\n\nShould this continue, Britain will sever ties with South Africa completely, should the dismantling of legalized segregation and implementing proper rights and concessions for your native citizens not occur. This is your formal first and formal last warning from the free world. The following sanctions and alienations, should you refuse, will be of the maximum we can administer to the nation\n\nI trust that you will give thought to your situation and make the right choice in this matter.\n\nRegards,\nP.M Jack Jones, Commonwealth of Britain."
 HDV_SAF.122.a: "The homeland has truly fallen"

 HDV_SAF.123.t: "BOSS is Watching"
 HDV_SAF.123.desc: "Field Report: Case 734 - St. Jude's Community Centre, Township Sector 3.\nOperative: K. Brandt.\n\nPreliminary surveillance confirms the subject location operates under the guise of a charitable community hall. Publicly, it provides literacy lessons and church-sponsored daycare. However, a pattern-of-life analysis reveals significant anomalies inconsistent with this cover. The Centre serves as a meeting point for a high volume of adult males who have no clear connection to its stated activities, including individuals previously flagged during labor actions on the Rand and known union affiliates. Their comings and goings, often after sundown, lack a consistent or plausible explanation.\n\nSpecific activities warrant closer scrutiny. A recent \"fundraiser for a new roof\" involved significant cash collection, but the funds were removed from the premises by a non-clerical associate within an hour. This format is a classic vector for untraceable financial support to subversive elements. Furthermore, a \"reading circle\" attended by several persons of interest was held last night. The literature present appeared to serve as props; the true focus was on hushed, intense discussions, held while unofficial lookouts monitored the street outside.\n\nThe cumulative evidence strongly suggests the Centre's innocent activities are a meticulously maintained front. It is my high-confidence assessment that the St. Jude's Community Centre functions as a significant local node for the banned African National Congress, used for covert meetings, fundraising, and dissemination of instructions. I am marking this case for escalation. I request authorization for elevated surveillance, to include the placement of listening devices and the initial vetting of potential informants."
 HDV_SAF.123.a: "Authorize the request. Leave no stone unturned."

 HDV_SAF.124.t: "A Campfire in the Night"
 HDV_SAF.124.desc: "The men sat under the stars in a rural Veld somewhere far away from civilization, grouped in a circle around a blazing campfire. The mood among these men was as dark as the night they inhabited; none could deny the things that they'd done and the unsatisfying outcome of the war. All of them showed some of the scars of war, the great excitement for victory, and the crushing pain of watching comrades perish on the battlefield while trying to hold against an impossible tide.\n\nOne man was missing an eye, the gaping wound covered up by a bandage. Their uniforms, if they had them, were ragged and showing real signs of wear and tear. Yet were you to look closer at these men, you could see their collective mood turn from depression into determination as distant looks turned into steely ones. The atmosphere of oppressive silence turned to a few shared whispers, and then into the sharing of war stories between these veterans of the South African War.\n\nAs the night passed on and new logs were tossed onto the campfire, a flame within the men began to burn as well. The subject changed once again to the future and what should be done about the racial Judas that was De Villiers Graaff and his government of Jew-infested bureaucrats in Cape Town. Crucified, burned, hanged, or perhaps simply just shot and deposited in the closest ditch.\n\nWhen the first signs of dawn arrived, all were making promises, vows, and a blood oath amongst brethren. The struggle was not yet done; for every single man present agreed to pick up their arms and fight once again, not in the open, but in a hidden war against South Africa. They would strike from the darkness until the entire foul remnant of the British Empire would finally crumble under its own weight."
 HDV_SAF.124.a: "To the bitter end."
 
 HDV_SAF.126.t: "REPORT ON THE GROSSAFRIKANER REICHSSTAAT"
 HDV_SAF.126.desc: "In an astounding turn of fate, HANS HUTTIG has forcibly seized control over all the German Reichskommissariats in Africa after killing WOLFGANG SCHENK of SÜDWEST and forcing SIEGFRIED MÜLLER of ZENTRAL to flee his RK in a plane filled with riches and hunting trophies. As can be assumed from the public denouncement by GERMANIA, this entire thing was not approved, and it leaves HUTTIG as a rogue actor in control of vast swathes of African land.\n\nIt is advised that any attempts at DEMOBILIZATION should PROCEED SLOWER and further support for border control of all kinds should be put in place; for we do not indicate what the out of control extremist HUTTIG really wants or is capable of. Reports of EXTREME VIOLENCE and MASS MURDER of Natives are omnipresent, while traumatized refugees speak of INSTITUTIONAL GENOCIDE.\n\n\This state; this Reichsstaat, stands entirely alone; facing total isolation, enormous overextension and a very small German minority at war with a much greater majority of Native peoples fighting for their lives. This state will not last; that is certain. What matters more is HOW MUCH DAMAGE CAN BE INFLICTED BY IT before it crumbles under its own weight. Problems on the border can be expected, as well as intense flows of people fleeing this GRAND GENOCIDE, so adequate facilities for those fleeing this so-called Reichsstaat should be prepared; as well as looking to put these people to work on RECONSTRUCTION. No one can expect to send these people back until the REICHSSTAAT collapses and the violence that shall follow is resolved. South Africa faces a great challenge, but it is without doubt that the horrific events up north are VERY GOOD FORR OUR INTERNATIONAL REPUTATION as a humanitarian nation seeking to protect the innocent.\n\n\n\nFOR SOUTH AFRICA'S SECURITY"
 HDV_SAF.126.a: "What the HELL is going on up there?"
 
 HDV_SAF.127.t: "The Pretoria Trials"
 HDV_SAF.127.desc: "A convoy of police trucks and vans pulled up to the Supreme Court in Pretoria, which several soldiers guarded under the OFN flag. Jeers greeted the captured Germans who got out of the vehicles, while armed policemen held onlookers at bay. The prosecutors and judges, having arrived slightly earlier, waited impatiently inside the courthouse as they prepared for a historic day. The court audience, sitting on the sides of the court, jeered as the accused entered the room.\nAs the Germans sat down in the courthouse, the Judge began his introductory speech: "Gentlemen, you are all standing on accusations of crimes against humanity, as well as funding the Boers in an unconventional war against South Africa." More jeers bellowed from the sides, but the Judge motioned for silence. He understood their feelings perfectly, but he needed to ensure civility.\n"Gentlemen, let me ask you this: do you plead guilty?" There was a brief pause as silence filled the room. Of course, everyone knew they were guilty; what they would try to argue wouldn't offer them any clemency, if any at all. "Not guilty", said the men as they sat defiantly, though to others they looked sickly. The best they could hope for was just short of the death penalty. Jeers roared more from the court audience.\nWatching from the back was Aitan Becker, one of the prosecutors handpicked to sit on this case, having years of legal experience. He also had relatives deeply affected by the war, so this was personal for him. Of course, he knew those lying weasels would try and lie to get out of it, but he knew that he had them cornered, and soon justice would be served."
 HDV_SAF.127.a: "Let the trials begin"
 
 HDV_SAF.128.t: "Steiner takes the Stand"
 HDV_SAF.128.desc: "Aitan was quiet as Rolf Steiner, one of the German higher ups who had run RK Zentralafrika, took his seat on the witness stand. After a routine introduction and swearing-in of the witness, the defence lawyer spoke up. "Mr Steiner, can you describe the events you witnessed whilst functioning as minister for the administration of Mr Müller ?"\n\nSteiner subtly adjusted his microphone and began to speak, eyes downcast.  "From my first day in Africa, I saw countless cruelties and abuses. The worst of them was when 'rebels' were picked straight from the street and tortured for information they did not have. Whilst being interrogated, the 'rebels' first had their left leg cut off and then their right leg whilst they were still alive, screaming whilst the soldiers asked for confessions. Then, when they eventually died, their skulls were placed on poles and shared as gifts... gifts."\n\nSteiner let out what sounded like a sob or a pained breath, though Aitan sincerely doubted any of it was real. "I wished to stop this needless cruelty, but I could not. I furiously scolded a group of soldiers engaging in this behaviour, and then Müller spoke to me and said. 'Steiner, sometimes a soldier has to have some fun while in this hellhole. If you don't have fun, you won't live long, so enjoy it while it lasts. It was the worst possible explanation for such acts against humanity; no real explanation at all."\n\nThe German then spoke with a more determined voice. "I just wanted to do my duty to my fatherland, not this. After everything, I just want to redeem myself. To find some shred of justice for those who suffered under the likes of Müller and Huttig, so my soul can rest easy for being forced to take part."\n\nAitan restrained himself from scowling. Of course, Steiner was lying; he was not the blameless victim that he was making himself out to be. He was in the belly of the beast, practically running its horrific abuses and unsanctioned murder sprees by mercenary groups of all kinds. But he was also one of the few officials who could provide testimony about what had happened in German Africa and thus make South Africa look pretty good on the international stage in comparison. Thus, when the judge turned to Aitan and asked, "Does the prosecution have any further questions?" Aitan only had one answer."
 HDV_SAF.128.a: ""No, your honor.""
 
 HDV_SAF.129.t: "One Man's Truth "
 HDV_SAF.129.desc: "Perhaps the most hated individual in Africa, Hans Hüttig, was now seated on the witness stand. The old man's head was raised with a look of pride and defiance as he looked at the prosecution and all of the public that looked at him. The judge spoke up. "Hans Hüttig, you have been accused of genocide, the illegal conscription of non-combatants and various violations of the conduct of war, what do you say in your defence ?"\n\nHüttig was quiet for a moment, considering his answer. In a low voice, he began speaking. "I have nothing that I should defend myself for." He spat and looked at the crowd. "The only thing I did wrong was to trust the traitors and buffoons amongst my ranks. My defeat was only due to the lack of Aryan spirit amongst those who called themselves German in Africa"\n\nThe voice of Hüttig slowly grew louder as he spoke; spittle came from every sentence. "If any of my soldiers had a spine, we would have cleansed Africa of its dark impurities a long time ago. All the filth would have worked itself to death long ago, and we would have crushed anyone who would have stood against the superior race. A new Lebensraum in Afrika would beckon to the good Aryan people of Germany, a new land to claim as our own."\n\nThe English translator was professionally relaying Hüttig's German ranting, even as a deathly quiet resounded through the courthouse. The deluded man was now all but screaming. "Now look at all of you, every single one of you are traitors to your race. You may know it or not, but every step you take drives you all deeper into the arms of the Jewish Bolsheviks. Your leaders are selling you out to American capitalism, and soon enough, you will all be enslaved by those unworthy to own this continent."\n\n"If you had all seen the truth of the Führer a better world would have awaited you. Yet here you all stand, chained by your false convictions and lies of equality and nobility. You all delude yourself into thinking your soft hands will tame this continent, whilst only a fist of iron will discipline it. You are slaves as much as the filth of Africa." With this final statement, Hüttig peered into the eyes of the crowd, his defiance unyielding. Everyone knew that only one fate awaited this monster when the trials came to an end."
 HDV_SAF.129.a: "Death"
 
 HDV_SAF.130.t: "A Day of Judgement"
 HDV_SAF.130.desc: "Prosecutor Aitan Becker watched with anticipation in his chest as the chief judge for the Pretoria Trials was preparing to proclaim the verdict of the tribunal. Aitan was fairly sure that he had enough evidence to bring these monsters down, but this was only due to Steiner's testimony. Technically, the defendants in this case could only be tried for war crimes, as opposed to mistreatment of the native population, as there was no established agreement on what 'crimes against humanity' meant.\n\nThe Judge began to speak. "Gentlemen, the tribunal has come to a verdict regarding the crimes of the following individuals-" A list of roughly 30 high-ranking German officers who had been captured was read off by the judge. "With the exception of Rolf Steiner, all individuals have violated Convention IV of the Hague Conventions of 1907."\n\n\The judge adjusted his glasses. "Due to Mr Steiner's cooperation and due to him having been judged to have committed no war crimes in person, Mr Steiner is considered innocent. He will be kept under protective custody for a period of at least 4 years as arranged by the Bureau of Strategic Services."\n\nA frown appeared on the Judge's face. "The defendants have been found guilty of numerous violations of Section II regarding the conduct of war and Section III regarding the treatment of occupied territories. Some of the more notable violations are the acts of pillaging, killing, surrendering soldiers, mistreatment of prisoners of war and the bombardment of unprotected settlements and religious sites."\n\n\"The military tribunal has agreed on the following sentences-" A list of sentences was then laid out. The vast majority of defendants, including Hans Hüttig, would be executed via hanging. A smaller number of defendants got life in prison; only Steiner was found not guilty of any crimes. As Aitan looked at the downcast faces and the defiant gaze of much of the SS men and German criminals there on trial, he could only think one thing."
 HDV_SAF.130.a: "Good riddance"
 
 HDV_SAF.131.t: "A Rally for Freedom"
 HDV_SAF.131.desc: "It was a quiet night in Port Elizabeth. Life went on as usual - people stumbled home from bars with friends, couples strolled through the newly rebuilt streets, and the city hummed softly under the glow of streetlights. Yet beneath the calm, a crucial meeting was underway. In the still-ruined sections of the city, ANC members gathered in secret, plotting their next steps in the struggle to liberate South Africa.\n\nOliver Tambo felt a deep unease. It was the largest ANC meeting since the end of the South African War, and so much could go wrong. He feared that BOSS might discover them at any moment, crushing their fevered dreams of liberation in mere minutes. The stakes had never been higher - today they would chart a course, make the final decisions on how they would operate from now on, and commit themselves fully to the struggle ahead.\n\nAs the members gathered in the dimly lit room, whispers hushed and eyes turned toward him. Every movement, every shadow outside the cracked windows made him tense. Taking a steadying breath, he stepped forward and began his speech, his voice low but unwavering, carrying the weight of hope and the urgency of their cause.\n\n"People of South Africa," he began, his voice strong and commanding, carrying through the tense room. "The threat of Nazi invasion is over, and now we must decide our next steps. We shall continue our cause and fight for our freedom guided by our principles. Only through this can we ensure-" \n\n"No."\n\nHis words were cut short as an unknown man suddenly emerged from the back of the crowd, moving quickly and deliberately. The room froze, people darting their eyes toward the intruder.\n\nIt was Nelson Mandela - bruised and marked by years of torment, but alive and standing with fierce defiance. "The time for half-measures and peaceful protests is over. We have let them punish us, we have let them beat us, and we have only answered with words. How has that changed anything? How has it made our lives better when they simply ignore us? It is time to show the will of the African people, to prove we can fight for our own. Stand with me, and let us take up the fight for our freedom!"\n\nThe crowd erupted. Oliver Tambo could only watch, awed, as his ally, once thought to be lost or dead, stood before them, igniting hope and courage. In that moment, the fight against oppression was no longer a distant dream; it was alive, burning fiercely in the hearts of those ready to claim their freedom."
 HDV_SAF.131.a: "A Dangerous Gamble"
 
 HDV_SAF.132.t: "Arm Their Rebels"
 HDV_SAF.132.desc: "The heat in the nave of the ruined missionary chapel was a physical weight, thick with the scent of rotting wood and damp earth. On the wall, the faded fresco of an angel watched them with chipped, indifferent eyes. Captain Venter of the UDF sat on an upturned ammunition crate, his clean uniform a stark contrast to the decay around him. His professionalism was a weapon in itself, cold and precise. Across from him, Commander Alves, leader of a local Angolan resistance cell, wore the weary look of a man who lived and slept in this very jungle. He was here out of desperation, and perhaps, a flicker of hope.\n\nVenter got straight to the point, tapping a location on a map spread across his knees. His Afrikaner accent was clipped and business-like. "Our intelligence confirms their supply convoys are weakest here. We provide you with the rifles, the mines, and the specific timetable. Your men do the rest. Together, we disrupt a common enemy." Alves, however, did not look at the map. His deep-set, tired eyes were fixed on the South African. He had not come here for a tactical briefing. "And after?" he asked, his voice low. "When your Germans are pushed back and your strategic objectives are met, what becomes of our fight? What becomes of Angola?"\n\nVenter folded the map with crisp, dispassionate movements, his face unreadable. His answer was a phrase memorized from a briefing in Pretoria, devoid of any human connection. "Our primary strategic objective is the long-term containment of German colonial influence in the region." The hope in Alves's eyes didn't just die; it was snuffed out, replaced with a cold, bleak clarity. He had come here to meet an ally but had found a quartermaster. His men's lives were not a contribution to their own freedom, but a line item on a South African budget.\n\nHe stood up abruptly, the scrape of his chair loud in the heavy silence. "Tell me, Captain," he said, his voice quiet but sharp as glass. "Does my life, or the lives of my men, mean anything to your superiors? Or are we just a distraction?" Without waiting for the answer he knew he would never get, Alves turned and vanished back into the jungle, leaving the captain alone with his maps and his crates of useless tools."
 HDV_SAF.132.a: "And some tools refuse to be used"
 
 HDV_SAF.133.t: "Maintaining the Military-Industrial Complex"
 HDV_SAF.133.desc: "The heat in the abandoned estancia hangar was suffocating, thick with the ghosts of rust and dry rot. Koos de Villiers, the South African, sat with a placid stillness that was more unnerving than any threat. He was an accountant in a war zone. Across a makeshift table, the local "General" postured, his gaudy uniform a stark contrast to the weary Kalashnikovs held by his nervous young guards. The deal had stalled on price, as it always did. With a small nod, Koos had his man pry open a crate, the screech of nails on wood echoing in the silence.\n\nThe General picked up an R1 rifle with a theatrical flourish, feigning an expert's eye as he examined the South African copy of the FAL. "These have seen combat," he sniffed, trying to reclaim leverage. "Used goods. My other suppliers offer newer models for a much better price." Koos let the silence hang for a moment. "Your other suppliers sell promises," he replied, his Afrikaner accent clipping the words with cold precision. "Their supply convoys have a habit of disappearing in territory held by men who dislike you. I am not selling rifles, General. I am selling the certainty that they will arrive. The price is for that guarantee."\n\nThis, they both knew, was the heart of the matter. The General could posture all he wanted, but his rivals were better armed, and Koos was the only reliable source in a fifty-mile radius. Koos leaned forward, his voice dropping but losing none of its edge. "My rifles have seen combat, yes. And they have won that combat. The question you should ask your other suppliers is not about the price. It is whether their new rifles will even fire."\n\nThe General's face tightened. The bluff had been called. After a long, tense moment, he slammed the weapon down. "Fine," he spat, the word dripping with resentment. "The money will be prepared." Their handshake was brief and hard, an agreement founded on nothing but a mutual, perfect understanding of desperate need."
 HDV_SAF.133.a: "A necessary partnership"
 
 HDV_SAF.134.t: "From One Union To Another"
 HDV_SAF.134.desc: "The Union was at war, split in half by the invaders from the...South? So did the story go of the American Civil War, exactly one hundred years ago. Now it was a different Union in a great civil war, on a different continent, in an entirely different era, but parallels were easily drawn between the two. Part of fighting the war was keeping up the morale of the troops and of the people of South Africa, and for that reason, one of the US Army's oldest organizations was sent to Cape Town for a grand performance. The First U.S. Army Band "Pershing's Own" was in their finest uniforms in the Alahambra Theatre on Adderley Street, ready for their public performance that would be broadcast on TV to both South Africa and the rest of the world.\n\nThe songs were old, older than the nation of South Africa ever was, but they resonated with those watching via TV and radio. With the American flag and the South African flag side by side hanging over them the First U.S. Army Band began to play American songs from the Civil War, their lyrics left intact and yet still they resonated with the audience made up from South African dignitaries and all of the OFN's ambassadors around the world\n\n"The Battle Hymn of the Republic", "Marching Through Georgia", "When Johny Comes Home Again" and the "The Union Forever" sparkled like never before to an audience that was not very familiar with these songs from across the Atlantic, yet they seemed to make an impact. In the very front row, Prime Minister De Graaff applauded loudly, being flanked by the American ambassador.\n\nTo complete the evening, the American anthem was performed, with everyone in the theatre standing up, those Americans present singing along. Finally, there was Die Stem van Suid Afrika, an Afrikaner anthem that served as the National Anthem followed by God Save the King to properly represent the Union of the White peoples of South Africa. After all,"
 HDV_SAF.134.a: "They were fighting for the Union"
 
 HDV_SAF.135.t: "REPORT ON CAMEROON"
 HDV_SAF.135.desc: "The implicit threat of the CAMEROON AFRICAN STATE remains contained for now by the WEST AFRICAN STATES, chiefly the remnants of FREE FRANCE centered around the region of the Ivory Coast on one side. On the other end is REICHSKOMMISARIAT ZENTRALAFRIKA, which fought an open conflict with the C.A.R. in the mid-50s that ended up in a stalemate that favoured the pan-africans, which further founded the legend of PAN AFRICANISM.\n\nThe CAMEROON AFRICAN STATE's capital is in Doala, where the state is gathering strength for future conflicts to spread its PAN AFRICAN IDEOLOGY by force. While the state formerly was isolated and weak, it has received support from THE EMPIRE OF JAPAN as a counterweight to both GERMAN and AMERICAN interests in West Africa. This is a MARRIAGE OF CONVENIENCE, with the C.A.R.'s socialist ideology being abhorred by the Japanese. Shortwave propaganda broadcasts from DOALA make it abundantly clear that in the long term, the C.A.R. intends to seek the total and full DESTRUCTION OF SOUTH AFRICA. It is key that additional support be sent to FREE FRANCE to ensure the continued containment of pan-Africanism. \n\n\n\nFOR SOUTH AFRICA'S SECURITY."
 HDV_SAF.135.a: "The Reds lay in wait in the north…"
 
 HDV_SAF.136.t: "REPORTS ON THE CRACKS IN OSTAFRIKA"
 HDV_SAF.136.desc: "REICHSKOMISARIAT OSTAFRIKA is perhaps the most fanatically led our enemies; and also the most poorly run. A butcher state, ran by HANS HUTTIG, an absolute fanatic with deep SS connections sent to fix a PATCHWORK STATE of stolen colonies belonging to Britain and Portugal originally. The only solution Huttig has to any issue is excessive violence, if not direct genocide which keeps different collaborator groups in line to oversee regions of Ostafrika in line.\n\nThis colony was intended for GERMAN SETTLEMENT, but only the totally insane would dare to make a place that is in a constant state of internal warfare their home. The Native populations have nothing to lose in the face of close to GENOCIDAL INTENT coming from Bouhlerstadt which will only be a valuable asset in further staying apart the pieces of OSTAFRIKA.\n\nThe collaborator groups come in two kinds;  ENGLISHMEN and PORTUGUESE, of which the former has strong sympathies for South Africa and the latter can easily be persuaded by preservation of their economic and political privileges to ensure CONTINUED CONTROL over these regions. Extensive contacts with both groups have been made already and both of them await liberation.\n\nWhile there should be some MILITARY SUPPORT sent to the Native groups fighting OSTAFRIKA from within, these groups hold no sympathies for us and will immediately turn against us once the conflict has ended. Priority should be given to covert support for the local collaborator groups to help push them away from Bouhlerstadt and keep the Natives in line\n\n\n\nFOR SOUTH AFRICA'S SECURITY."
 HDV_SAF.136.a: "All we need to do is kick in the door and the whole rotten structure will fall…"
 
 HDV_SAF.137.t: "The Fall of Bouhlerstadt"
 HDV_SAF.137.desc: "The delusion of making Africa a second homeland for the Germans has finally ended as the city of Bouhlerstadt, the dark heart of Ostafrika, has fallen. Despite fanatical, if not suicidal, resistance from the Afrikaner SS, the fight for the city has fallen, while combat on the outskirts of the city continues on.\n\nThe city, newly constructed as a perfect representation of aryan supremacy, now lies in ruins with heavy fighting and even suicidal attacks, with buildings being blown to delay the Union Defence Forces' relentless push onwards. The elaborate structures drawn up in hideously overblown Germanic style that line the streets emblazoned with swastika's are being roughly treated by the UDF with even controlled demolitions of non strategic buildings being ordered to seal the fate of his abominable city.\n\nPrime Minister De Villiers Graaff has proclaimed the fall of Bouhlerstadt as a great victory for South Africa and its OFN allies, telling the nation via a TV broadcast about the plans to completely dismantle the German holdings in Africa, one by one.\n\nThere is no clear information on the location of Hans Huttig and the other key figures running the Ostafrikan state; but it is assumed that they have retreated to the city of Dar Es Salaam because German resistance continues."
 HDV_SAF.137.a: "Tear down these walls!"
 
 HDV_SAF.138.t: "For the Union"
 HDV_SAF.138.desc: "The bottle of De Grendel wine was cracked open as Div looked over the latest reports on the collapse of the so-called Afrikaner Volksstaat and thus the full restoration of the Union of South Africa. Div took great pride in the red wine freshly delivered from his own vineyard located not too far north of Cape Town as he enjoyed a moment of victory in this great struggle.\n\nYet his mood soon soured as he read another piece of paper by BOSS; the recommendation for immediate imprisonment and punishing for prominent Afrikaners who collaborated with the OBW's slapdash Volksstaat and the coup against South Africa. While no man would ever doubt Div's loyalty to the Union, his sympathies for his people, the Afrikaners, were most certainly there. The Union of Afrikaner and Anglo people would be upheld, and he pulled out his pen to start striking through the names listed there who merely collaborated.\n\nThe heinous extremists of the Ossewabrandwag would all be severely punished, if not locked up for life…if they were going to be taken prisoner at all. Mistakes could happen, after all. But the others, the good, normal, hardworking Afrikaners that founded this country and helped it prosper, their names would be stricken from their list, and they would be kept in place.\n\nThe Union would not just survive militarily, but as a concept in people's minds as well, where heavy punishments for collaborators would only ever backfire and widen the divide between them. Already the tide had turned against the plotters in the OBW and the National Party, and what now remained was to push back the German colonies. The Union would hold, now that much was certain."
 HDV_SAF.138.a: "He shall do what he could to defend it."
 
 HDV_SAF.139.t: "The Capture of Windhoek"
 HDV_SAF.139.desc: "The capital of Germany's African airstrip has fallen. Despite insistent resistance on the ground and pressure from the air by the Sudwestafrikan air force the city and its key air facilities was captured relatively intact, de facto breaking German resistance in Namibia by heavily disrupting its logistics and seizing its capital city, a place of heavy German settlement that totally displaced the original inhabitants of the region.\n\nPrime Minister De VIlliers Graaff of the Union of South Africa has proclaimed it as a great victory that will end up being the undoing of the German grip on Africa's southeast and that the South African Air Force and other allied aircraft would soon be taking off from the major airbase outside Windhoek. At the same time he promised good treatment and a light hand for the German civilians which now found themselves under South African occupation, vowing to protect their property as well as could be done in a chaotic war situation.\n\nFurthermore he stated that any Germans would be free to remain in Namibia after the war's end, and that they could further expect a path towards South African citizenship for those who would not prefer to return to Germania upon the end of war and the return of peacetime.\n\nThere have been no reports of the capture of key leaders of RK Sudwest so it can be safely assumed that they have evacuated by air towards the city of Luanda, thousands of kilometers to the north. Only time will tell if the battle lines push northward to threaten that city as well."
 HDV_SAF.139.a: "We have it, now let's use it!"
 
 HDV_SAF.140.t: "The Fall of Durban"
 HDV_SAF.140.desc: "The City of Durban, the great heart of Natal, has fallen. Despite heavy resistance by Anglo loyalists who have always called the city home, the combination of Afrikaner Volkstaat militia and Ostafrikan SS troops has successfully taken the city of Natal after several days of heavy fighting.\n\nThe roads leaving towards the west are clogged with refugees as many fear retribution or at least heavy oppression by the fanatics that now dominate the city, which the locals often call Durb, as further resistance within the province of Natal seems to be crumbling quickly. The new commissioner of Durban installed by the OBW, Jaap Marais,, has already vowed to purge the city of its Jewish and cosmopolitan tendencies and instituted strict segregational policies as well as a tight evening clock.\n\nIn a speech broadcasted over the radio Reichskommisar Hans Huttig of Ostafrika has spoken of Natals importance to the Anglos of South Africa and how it will now become a city just for the Aryans and Afrikaners, at the same time vowing to destroy the Union of South Africa by his forces launch a final drive towards Cape Town and sealing its fate forever.\n\nPrime Minister De Villiers Graaff was not currently available for comment."
 HDV_SAF.140.a: "The heart of the Anglos in Natal, ripped out"
 
 HDV_SAF.141.t: "Our Next Steps"
 HDV_SAF.141.desc: ""Prime Minister." Bernard Montgomery gave the man who entered his commander's tent outside of Bouhlerstadt. "Welcome to Bouhlerstadt, or as it's called now, the city of Montgomery." The smile on his face was unshakable. "Here to see the hideous German architecture for yourself, I see."\n\nDiv ignored the comment and pushed on with the conversation. "Partially so, but mainly I am here to address the troops and keep up morale; the war is far from over."\n\n"Good, very good." The older man. "While you are here, I thought it worthwhile to discuss my next plans to finally chase the Germans from Africa for good." He motioned towards a nearby grand map of eastern Africa laid out on the table, using a pointer to aim directly at the Comoros Islands, located right between Madagascar and Dar Es Salaam. "We should push our naval advantage gained by seizing the capital of Ostafrika by not just applying further pressure northwards, but by organizing a tightly planned invasion of the Comoros islands here. According to our intelligence, the Comoros Islands serve as a minor naval base for the enemy, with most of its remaining naval facilities being in Dar es Salaam.\n\nIf you look at the location of the Comoros, it can not just serve as a key place to launch naval operations against the enemy, but also serve as a key place for South Africa to project power into Eastern Africa after the war. For those reasons, we must prepare a grand invasion, coordinated with both naval and air pressure to achieve victory and seize these islands as soon as possible." \n\nDiv looked at the distance from Bouhlerstadt to the Comoros and realized that there would be little chance to achieve any kind of surprise. A naval invasion of this size, this far away? He had his doubts…not least of all because South Africa had no experience with naval invasions. "And how are we going to actually achieve that, Bernard?" "
 HDV_SAF.141.a: ""All that is required is a plan, and a will to follow it.""
 
 HDV_SAF.142.t: "A Slice Of The Pie"
 HDV_SAF.142.desc: "Ostensibly, this was to be a routine meeting for establishing the Arms Corporation of South Africa, or ARMSCOR. Yet, the significance of this organization and its far-reaching implications quickly drew a remarkable turnout from South Africa's elite, the wealthiest and most influential figures, at the Yungsfeld military base in Cape Town. As Eglin surveyed the gathered industrialists, he wondered how many were motivated by the prospect of profiting from South Africa's expanded military budget, and how many were genuine patriots hoping to support the Cape's defense in their own way.\n\n"Gentlemen." The huddled talks came to a halt. "Let us get straight to business. The facts are clear to everyone here; this war is existential in nature, and our enemies are seeking to destroy our nation altogether. While our allies from across the world are sending support, South Africa will need to quickly begin domestic production for everything and anything that the army needs.\n\nARMSCOR will serve as a definitive connection between industry, the military, the government, and private financing to establish a proper military industrial complex on South African soil. The government's intent is not to merely do this for the duration of the war, but as a turning point in longer-term development of an MIC that can provide not just for our domestic needs, but facilitate weapons exports as well."\n\nHarry Oppenheimer, the richest man in South Africa (and thus the one with most to lose, as well) sat on the front row and spoke up. "That is fine and all, but the government should realize that in the shorter term, our capacity to turn our facilities to war production is limited, and we will need support with that, as well as the lost revenue from lost materials exports, hitting several of us rather harshly in this time of chaos. More than half of my mines are located within enemy territory, and it will  not be easy to facilitate all of this."\n\nColin answered resolutely. "Whatever support you need, you'll have it; whatever rules need to be scrapped, they will get done. Nothing will stand in the way of South Africa's defense. Use every resource at your disposal, because if the enemy prevails..." "
 HDV_SAF.142.a: "There will be nothing of us left"

 ###FLAVOUR EVENTS### TEX WAS HERE BITCH
 SAFWAR.SAFFlavour.1.t: "Hard Decisions"
 SAFWAR.SAFFlavour.1.desc: "Private Timothy Brooke counted eight other men hiding with him in the ramshackle apartment. One lost both his eyes, two carried bleeding stumps on their limbs, and four sported bullet wounds staining their khakis even with several layers of bandages plugging the bloody leaks.\n\nDoc rounded the list, scurrying from one corpse to another like a mother hen. A first aid slingbag swayed to and fro his side with a barren gape -- the morphine bottles and gauze packs it had carried lay scattered across the cramped domicile's floor. Some of them had been administered to the corpses littered about the street corner outside. At least the Jerries and their Bravo patsies halted their artillery barrage hours ago.\n\nThe orders from brass hours before that were simultaneously clear and vague: Hold out until relieved. Sarge must've asked himself when they can expect relief just as shrapnel skewered his brain into Halloween decor. At least his death was relatively quick. Painless, maybe. Timothy can't say the same for the poor sods the corpsman was trying so hard to keep alive. Combat fatigue can only numb so much of the pain.\n\nSo he asked the question again. "Doc," his hollow voice said, "Put them out already. You're running out of everything."\n\n"For the last time Tim," the medic hissed, "I can't just leave them out to die!"\n\n"They're already dead men sleeping. Just don't know it yet." None of the wounded stirred from their slumber. "Save what's left for tomorrow."\n\nThe night's silence settled between him and Doc, who had slumped against the wall with both hands on his face. It stretched out for who knew how long until Doc's puffed, bloodshot eyes locked with his. "I'll let you know," he whispered.\n\nWhen the moon hung overhead, seven shots broke the ruined city's fragile peace. And when sunrise brought with it a motorcade of friendlies and fresh supplies, a corpsman picked up an empty Colt and thrust the pistol to its weeping owner's hands."
 SAFWAR.SAFFlavour.1.a: "All for nothing, Brooke. All for nothing."
 SAFWAR.SAFFlavour.2.t: "A Little Spray"
 SAFWAR.SAFFlavour.2.desc: "If the Marines had the SS and Boer Kommandos, and the Air Force the Luftwaffe, Wesley Evans thought, then Logistics must too have an adversary. So like a genie, Africa had given them one. Case in point: the flying black devils buzzing about his ear. His neck bore a landmine of red swells itching harder than gonorrhea. No use swatting them out of the sky; the red swell shaped like his right ear served a painful, self-inflicted reminder.\n\nHe sighed, slumping against the drive wheel. The motor pool was ever under attack from three adversaries: boredom, heat, and mosquitoes. He'd learned to live with the first two. Now if there were only something to deal with the third once and for all-\n\n"Wes!" shouted Gary Murkowski. Evans tilted his head to the side. The half-naked American moseyed towards his truck with what looked like two spray cans on his hands. What did he want this time? He asked as much to his fellow trucker. "Well I heard you guys got a little fly infestation in these here parts," he shoved the can to a few inches away from Evans' face, "so I brought these from back home!"\n\nColour him surprised that an American would propose a potentially disastrous idea. "And I won't keel over from spraying this onto myself how?"\n\nMurkowski shrugged. "Don't knock it 'til you try it." Evans switched his gaze between the can and the American. Incidentally, the itch on his neck flared up at the same time. He bit his teeth and scratched the spot until his nails dug deeper into skin, leaving behind a trail of blood. The buzzing on his ears continued to taunt him. That does it!\n\n"Give me that," Evans spat, swiping the extra can off Murkowski's proffered hand. He pressed the release and sprayed lemon-scented aerosol on the dashboard, on the seats, and on his clothes and skin. He ran out of aerosol before he knew it -- but mercy of mercies, the buzzing stopped.\n\nWearing a wide, kak-eating grin, Murkowski said, "See? Told 'ya."\n\nEvans bathed in his newfound relief too much to do anything but glance at the can that saved his life."
 SAFWAR.SAFFlavour.2.a: ""DDT" said the cover in bright yellow text."
 SAFWAR.SAFFlavour.3.t: "The Bob Hope USO Christmas Show"
 SAFWAR.SAFFlavour.3.desc: ""Good morning, Youngsfield!"\n\nThe crowd explodes.\n\nThere's well over a thousand of them, GIs and blue suiters and their South African counterparts, spread out across a decommissioned Cape Town sports field. Young men, all clad in jumpsuits and birth control glasses. They're grinning, laughing, and slapping their buddies on the back.\n\nAnd they couldn't be more afraid.\n\nThat's what Bob Hope always sees on his tours, day in and day out. There'll be a photograph taken of this moment: Hope, dressed in slacks, a golf club in one hand like the Nixon voter he is, and a microphone on the other. Table Mountain in the background, some Swedish-American beauty off to the side getting ogled, the sun shining bright over Darkest Africa. Iconic. But right now, all Bob sees is the fear.\n\nSo he does what he does best. He cracks one-liners, pokes fun at the mess hall food and the military lingo, and he makes the soldiers proud to be there.\n\n"You know," he jokes, "they call this place the world's biggest distributor of Messerschmitt parts!"\n\nCue the cheers from the Air Force boys. The Marines start roaring when he translates "Semper Fidelis" as "Don't worry, Doc, just nail it back on!"\n\nAs he wears easy smiles for the crowd, he looks out at the signs some of them are holding. Hometowns, loved ones, the dates they plan on getting back. Some of them, he knows, will never make that date. And Bob Hope knows that he's in Cape Town to make them forget that.\n\nFor a moment, he almost does."
 SAFWAR.SAFFlavour.3.a: "Thanks for the memory."
 SAFWAR.SAFFlavour.4.t: "Life in Lephale"
 SAFWAR.SAFFlavour.4.desc: "For as long as the sun rose and the moon set, Lephale prospered as the nexus where so many peoples meet. The old white men of the south traded guns for Xhosa wheat in the village, as did the Zulu trading their fermented milk for the strange contraptions of new white men from the north. The elders had thus called their vantage in the land a blessing... but now, as the two eagles of West and North waged war, Lephale's blessing has become a curse.\n\nThe Boers came first. They took the village's goods despite their owners' protestations, cursed the "savages" who dared to resist, and left behind a garrison of armed men. Some left to seek redress in a nearby town, never to return. A few crept off to join their rebel brethren, take an eye for their lost tooth, but most stayed put. Life went on.\n\nNext came the Americans. The Boers fled before they arrived; to sate their disappointment, the new white men captured Lephale's remaining elders for "collaboration" and handed out bars of chocolate. A headstrong young man dared to speak out against their captors' unfair exchange, receiving a rifle butt to the face for his troubles. Some talked of fleeing to safer ground, but most stayed put. The white men will leave as they had before. Life went on.\n\nLast came the Germans. They wore black uniforms, skull-capped medals and cold faces. They took all that was left and ordered every man who can carry a gun onto the village center. Old and young cowered in their huts when they heard three distinct sounds: first, shouts in an alien tongue. Then gunshots. Then screaming.\n\nDays passed before the survivors emerged to gather their fathers and sons. Sapped of their strength, the survivors stayed put, and slept, and wept. Only the specter of famine forced them back to their farms and herds. But soon burnt huts were buttressed with fresh timbers; some huts were rebuilt wholesale.\n\nThe old died and laid beneath fertile earth. The boys became men, married the many women who survived with them. Lephala prospered anew. The wheel turned."
 SAFWAR.SAFFlavour.4.a: "Life went on."
 SAFWAR.SAFFlavour.5.t: "Silence in the Sky"
 SAFWAR.SAFFlavour.5.desc: "Isaak clambered up the steep slope of what felt like the tallest dune yet. He had been struggling towards the pillar of smoke on the horizon for hours. Now it was just beyond this mountain of sand. Dragging himself over the summit revealed the wreck: a downed Me-262 fighter jet, half-buried in the sand with its left wing torn off. He smiled -- this one he had just shot down. When he approached, the pilot dug at the inch-thick layer of fine desert sand surrounding the cracked cockpit dome. After what felt like an hour of digging, Isaac finally caught the pilot within. He looked even younger than Isaak, maybe, but he was covered in too much blood, sand and glass to tell.\n\nIsaak shattered the cockpit with a solid kick and grabbed the poor boy by the shoulders. He had barely pulled him out when the boy drew a sharp gasp. Isaak nearly jumped out of his boots, slipping off the jet's wing and inadvertently tossing the Nazi onto the Namib. He scrambled back up towards the undead German. "Wasser. Bitte," it rasped.\n\nThe South African barely had water to spare for himself; he had used up the majority of it on his trek to the Messerschmitt, and he had no interest in giving his last gulp to an S.S. draadtrekker. He ignored the German for the time being and rummaged through the cockpit for supplies: two bottles of Fanta soda, but no water. He hobbled back to the Nazi and gave him one bottle, which he eagerly drank. "Danke," he rasped, "bist du ein Buren... eh... Boer?"\n\nIsaak didn't speak German, but understood the Nazi well enough. Afrikaans would have to do for communication. "Nee," he said, "ek is Suid-Afrikaans. Uh... soek jy 'n sigaret?" The German nodded, and Isaak handed him a lit cigarette from his pocket pack. Gazing into the west as the sun set beneath a dune, he said, "Wirst du mich töten?" Isaak didn't understand him, so he shrugged. The German sighed, dragging his thumb across his throat in a cutting motion. "O," he said, not sure of the boy's proposition, "il jy hê ek moet?"\n\nThe boy definitely didn't understand the words, but he seemed to get the meaning. "Oh, noch nicht," he said, shaking his head, "Ich möchte zuerst den Sonnenuntergang beobachten." So the two boys watched the sun set over the Namib, the sky flaring into hues of orange then red then purple then blue. As the stars came the German passed, like a ripple on a silent sea."
 SAFWAR.SAFFlavour.5.a: "And again the Spirit of Pity whispered, "Why?""
 SAFWAR.SAFFlavour.6.t: "One Man Down"
 SAFWAR.SAFFlavour.6.desc: "It was hot. Humid. Smelled of rotting meat too.\n\nPrivate Adriaan opened his eyes and his stomach lurched at what it saw. Bodies strewn about, half-eaten by swarms of maggots and flies. Walls and floor stained with dark crimson splatters. A prison cell's stone grey walls and bars. "Anyone there?" he called out. Then his left arm stung, drawing a piercing shriek on his lips and memories from his mind. A battle with those filthy Boers and their Kraut friends. A blast to the side, shrapnel digging into his skin, screaming- and black and nothing else.\n\nThe door swung open as if on cue, revealing three men with batons. "Hello Adriaan," said one with false cheer. "Glad to see you're awake."\n\nCheer faded as a frown took its place. "Now face the wall."\n\nIn one hard swing, the blackjack struck Adriaan's back with a resounding crack. The prisoner yelled as he slumped a bloody heap on the bloody floor. Another swing, directly behind his head, and Adriaan saw black again.\n\nHe woke up the next day to haze on his vision and blistering sores stabbing at his every bit of skin. Hair stood on end as a baton struck the cell's iron bars. The three officers had returned, this time with a bowl of pap, smiles wide as they regarded his hobble towards the bowl. A baton swatted his hand away as it reached for food, cracking finger bone and drawing another bloody scream. Pap fell to the blood- and dirt-smeared floor with a wet smack.\n\nAdriaan stared into his captors' soulless eyes. His flashed for mercy the German bastards would never give him -- like a dying mouse toyed by cats before they descend for the feast.\n\nAs he slipped into black a third time, Adriaan knew he will never leave his cell."
 SAFWAR.SAFFlavour.6.a: "They caught another one."
 SAFWAR.SAFFlavour.7.t: "Flight of the FAC"
 SAFWAR.SAFFlavour.7.desc: ""For conspicuous gallantry and intrepidity in action at the risk of his life above and beyond the call of duty."\n\n"As a forward air controller, Capt. Wilbanks was pilot of a light reconnaissance aircraft conducting patrols near Pretoria when he received a distress signal from Capts. Benjamin Buckley and William Havelock. His immediate decision to enter their proximity revealed a numerically superior hostile force poised to surround the crash site of a Huey gunship. The Boer force, realizing that Capt. Wilbanks' discovery had compromised their position and ability to launch a surprise attack, immediately fired on the small aircraft with all available firepower. Meanwhile, they began encroaching upon the crash site while pinning Capts. Buckley and Havelock down with small arms fire from all sides."\n\n"Realizing that air rescue elements cannot arrive in time to evacuate the stranded pilots, and despite cognizance of both the limitations of his lightly armed, lightly armored aircraft and the enemy's overwhelming firepower, Capt. Wilbanks immediately assumed a covering, close support role. Flying through a hail of withering fire at treetop level, Capt. Wilbanks deterred the Boers' advance first with a salvo of white phosphorus rockets, then with rifle fire from the side window of his aircraft. Despite increasingly intense antiaircraft fire, Capt. Wilbanks continued to disregard his own safety and made repeated low passes over the enemy to divert their fire away from the crash site. His daring tactics allowed a rescue helicopter to successfully enter the combat zone and extract Capts. Buckley and Havelock to safety. During his final courageous attack to protect the withdrawing helicopter, Capt. Wilbanks was mortally wounded and his bullet-riddled aircraft crashed onto Boer lines."\n\n"Capt. Wilbanks' magnificent action saved two fellow pilots from certain injury or death. His unparalleled concern for his fellow man and his extraordinary heroism were in the highest traditions of the military service, and have reflected great credit upon himself and the U.S. Air Force."\n\n--Medal of Honor citation for Captain Hilliard A. Wilbanks, USAF."
 SAFWAR.SAFFlavour.7.a: "A Toast to Cobra-7."
 SAFWAR.SAFFlavour.8.t: "Oral Interview, Barnard L. Hayes, PFC, 2nd Recon Battalion"
 SAFWAR.SAFFlavour.8.desc: ""My mother raised me proper, as she used to call it - she said I'd never be like the boys who teased me at school for being from the poorer end of South Central, because I'd been raised to be better than them. Funny how that changed once I joined the Army, but I like to think of myself as a man of words, not of fists. At least, not when I'm off duty. Never expected to get myself into a situation like this, at any rate - I have three siblings at home, Lord knows I've built patience for each of them."\n\n"But those South Africans? Man, I thought dealing with my own brothers was an annoyance, but when I was off duty - I swear I was more on edge than in the damn foothills. There ain't nothing like finding out your own men got a tighter set of lips on them than the people you're trying to help. Listen, I know you're recording to try to document this - I just wanna say that I ain't trying to - uh - stereotype the whole damn country, it's just that - they got some Uncle Tomfoolery goin' on in there."\n\n"Hell, the reason I got in a scuffle - hope I held my own in there - was, well, I was trying to get a light on some R and R, in a coastal town I'd been rotated to, and I met soldiers from the 45th Battalion, S.A.A.F. I'd fought with them - well, my unit'd fought with them - for 2 months. I thought they'd recognize me for my tab when I hit them up for a light."\n\n"And you know what they told me? They pointed to the damn Zulu soldiers down the street and told me this part of town was - well - whites only. Damn the Afrikaans to hell - I didn't come here fighting stupid lily-white powderboys so I could get lip from them off-duty."\n\n"And I don't regret what I did next, either - I'm Recon, remember? Learnt Zulu as part of translation duties. I'm damn glad I did, too. The look on those Zulu faces - I should've lit my cigarette with that. Heh! And they say black skins hide the heart...""
 SAFWAR.SAFFlavour.8.a: "I've never met a nice South African."
 SAFWAR.SAFFlavour.9.t: "My Vacation"
 SAFWAR.SAFFlavour.9.desc: "Dear teacher, my last vacation was not the way I thought it would be. On one Saturday, my mother woke me up really early in the morning, I argued with her, as I wished to sleep more but she told me to pick up my backpack and fill it with clothes because the Afrikaners were coming to hurt us and we must flee. I didn't understand it, Mr. Christiaan from the bakery is Afrikaner and he always treated me very kindly, if those Afrikaners are as nice as Mr. Christiaan, why should we run from them? But then father told me she was wrong, we are not running from anyone, we are going in a train trip to the sea.\n\nThe train was very crowded, and many people looked very scared. Some were crying, including my mother, but my father took me to the window and sat there with me watching the view. We saw many wonderful animals, many springboks and gazelles, we even saw a lion! I had some pleasant dreams that night dreaming of the sea.\n\nWhen we arrived at the Cape everyone was smiling, we were finally going to leave the train, I was really anxious to finally see the sea for the first time, I looked out of the window and there was a mass of people waiting for us, maybe they would prepare a welcome party. But then a man climbed on a bench and spoke to the crowd "These Kaffirs won't come off in our station." and everybody started yelling and spitting at us, calling us dirty animals, I don't know why. One of them threw a rock at the train windows, hitting my face. I started crying when I saw my blood on the rock and then my father gave me a strong hug, telling me everything will be fine, that very moment the train started moving again and we escaped the angry people.\n\nWhen the train stopped, we finally arrived in the camp my father promised us, I've have never camped before so I was very happy, but I still have to get used to sleeping on the floor, it's so much harder than on a bed. These were my vacations, teacher, I like camping..."
 SAFWAR.SAFFlavour.9.a: "But I'm upset I still didn't go to the sea."
 SAFWAR.SAFFlavour.10.t: "Ghosts of the Jungle"
 SAFWAR.SAFFlavour.10.desc: "The arrival of the Australian contingent to the OFN's South African "advisor" group was treated as something of an after thought both by American planners and their Afrika-Schild counterpart. Australia's small army was not expected to contribute much more than help in stabilizing the front line. Its small special force command would equally be helpful in supporting American operations.\n\nThis perception of the men from down under proved entirely inadequate. Boer insurgents in conflict zones found themselves stalked by Australian commandos. African SS divisions walking into contested territories would be repelled not by the industrial might of the American bomber fleet, but by ambushes, sabotage and misdirection. German officers that initially cursed the cowardice of their African underling soon grew to fear the shadows where any number of Australian infantrymen might be hiding.\n\nThe lessons learned by Australia in the waning days of the Pacific war in the jungles of southeast Asia are proving their relevance to modern conflicts. Faced with the Japanese onslaught and faltering help from the United Kingdom at the time, Australian commanders learned to do more with less. Information gathering was often left to company level officers, encouraging cooperation with local leaders. In effect, many Australian companies operate as extremely well equipped insurgencies.\n\nDespite interest and analysis by both sides of the conflict, the strategies of the Australian army are not a panacea. Having been developed as a method to compensate for Australia's smaller army and industry, these methods do not help the OFN much in holding vast amounts of territory. Nor have the Australians found as much cooperation from African locals than from south east Asians dreading Japanese troops. But the Aussie's grit and courage have certainly added to the Schild's misery in the sectors they share."
 SAFWAR.SAFFlavour.10.a: "Advance Australia Fair!"
 SAFWAR.SAFFlavour.11.t: "A Return Home"
 SAFWAR.SAFFlavour.11.desc: "A disillusioned, tired American veteran returned to his home in a city somewhere in America on a grim, overcast day. Inspecting the place, he found himself lucky that some bastard hadn't come in and looted it while he was gone the way his enthusiasm had been taken away. He had left feeling energetic, enthusiastic, and proud of his country and armed forces. But the quagmire in Malaya - the deaths of his friends, the shortages, the brain-dead, insensitive officers - had first embittered and then radicalized him.\n\nIn his mailbox he found the usual: advertisements, newspapers, propaganda. But then he found something else. A draft notice for the goddamned South African War. When he read that, he hit his table in rage. It wasn't enough for the President, was it, that he'd bled and suffered on one front. So now he had to go to another fucking shithole. "Damn it all," he cursed, "not this fucking bullshit again."\n\nAs he stopped unpacking and prepared to go off on another useless goddamned war, he looked at the day's newspaper to see just what his involvement in that last hellhole had gotten him. The newspaper said that the communist Chin Peng - who had been on the frontlines against Japan these last twenty years - had ended up in charge of Malaya.\n\n"That's good, at least," the veteran thought. Chin Peng and that Gus Hall character were more and more appealing the more he thought about it. Hall's talk about ending oppression, breaking the corporations and bringing radical equality for everyone in America made good sense to him. "Hell, if he manages to pull it off, maybe I'll be proud of my country again," he said."
 SAFWAR.SAFFlavour.11.a: "So he went about sharing this news to everyone who wanted to hear it."
 SAFWAR.SAFFlavour.12.t: "A Return Home"
 SAFWAR.SAFFlavour.12.desc: "A disillusioned, tired American veteran returned to his home in a city somewhere in America on a grim, overcast day. Inspecting the place, he found himself lucky that some bastard hadn't come in and looted it while he was gone the way his enthusiasm had been taken away. He had left feeling energetic, enthusiastic, and proud of his country and armed forces. But the quagmire in Malaya - the deaths of his friends, the shortages, the brain-dead, insensitive officers - had first embittered and then radicalized him.\n\nIn his mailbox he found the usual: advertisements, newspapers, propaganda. But then he found something else. A draft notice for the goddamned South African War. When he read that, he hit his table in rage. It wasn't enough for the President, was it, that he'd bled and suffered on one front. So now he had to go to another fucking shithole. \"Damn it all,\" he cursed, \"not this fucking bullshit again.\"\n\nAs he stopped unpacking and prepared to go off on another useless goddamned war, he looked at the day's newspaper to see just what his involvement in that last hellhole had gotten him. The newspaper said that the traditionalist Yeop Mahidin - a patriotic defender of traditional Malayan values - had ended up in charge of Malaya. Below that there was an editorial from the leader of the Sovereigns praising the Malayan decision.\n\n\"That's good, at least,\" the veteran thought. Yeop Mahidin and that Yockey character were more and more appealing the more he thought about it. Yockey's talk of bringing about an America that was fair and just only to those who were truly loyal to it made good sense to him. \"Hell, if he manages to pull it off, maybe I'll be proud of my country again,\" he said."
 SAFWAR.SAFFlavour.12.a: "So he went about sharing this news to everyone who wanted to hear it."


 ###ENDING EVENTS
 HDV_SAF.200.t: "The Moment of Truth"
 HDV_SAF.200.desc: "The clock slowly ticked up to the full hour. Eight o'clock in the evening seemed so close and yet so far. For the first time in modern history, the dominant party system that had continued the United Party's complete grip on power in South Africa since 1934 seemed to be cracking. Its conservative wing had split off to form a new party, while on the left, the Progressives were surging, making it seem inevitable that the United Party would be toppled from the throne it had occupied for decades.\n\nIn three different places in Cape Town, the three different parties gathered to see who would win. The Conservative splitters under Vause Raw, the United Party still led by Sir De Villiers Graaff and the Progressive Party under Harry Schwarz were waiting for the full hour when the truth would be revealed about the heavily contested election.\n\nWhen that time finally came; the nation all turned to their TVs, the lesser fortunate in community TV halls, and those below by radio to listen to the news announcer's finely accented upper class English.\n\n"The S.A.B.C. exit poll for the elections of [?global.date.GetDateStringNoHourLong] are in. Taken across the land in key constituencies that will decide the fate of our nation for the next five years, this exit poll points at one clear winner, and that is..."
 HDV_SAF.200.a: "The Progressive Party!"

 HDV_SAF.201.t: "Sweet, Sweet Champagne"
 HDV_SAF.201.desc: "The atmosphere within the Progressive Party headquarters was disturbingly tense, accompanied by an eerie silence that permeated the room, only broken by the analog clock, which loudly announced the passage of each second. Inside, party leader Harry Schwarz and his closest allies sat in an agglomeration of leather chairs, twiddling their thumbs at the single television in front of them.\n\nWhen the words were finally spoken out loud, there was a brief silence in the air, only to be ripped by a shrill declaration of victory, and the room burst into spontaneous cheering, as the people in the room began celebrating in earnest. But Harry simply sat in silence, hyperfixated on a reverie of the turbulent tenure ahead. He ran the calculations in his head, coming to a quick series of conclusions. If he could manage to form a coalition agreement with the battered United Party, he could become Prime Minister, even though that would mean having to water down parts of his policies to keep the United Party's moderate wing on board. The sore feelings between the NCP and the UP would also help make it much more likelier that the gentlemen of the UP would be more agreeable to make a deal with him.\n\nThen the realization had hit him; he had done it. They had done it, the scrappy Progressive Party had risen higher and higher against the towering titan of the UP, and now would be able to change South Africa for the better, finally.\n\nThe future prime minister could finally relax, as he properly joined the vibrant celebration with the members of his future cabinet."
 HDV_SAF.201.a: "A new dawn for a new South Africa"

 HDV_SAF.202.t: "End of a Career"
 HDV_SAF.202.desc: "The elections in South Africa had come with one gut-wrenching conclusion: the United Party no longer held a clear majority. While not an outright sign of defeat, at least not yet, the harrowing news rippled through the ranks of the United Party's supporters, gripping them with the fear that this might mark the end of the South Africa they had known. What had been planned as a night of celebration became subdued, the once-eager festivities dimmed by a quiet, creeping sense of loss.\n\nAn aide rushed to De Villiers Graaff's private room behind the stage, knocking frantically on the door before falling through it. The Prime Minister was perched on his leather chair, still, in absolute silence. Giving no words to the aide, he flickered through the provided electoral data, creasing its sides over and over again, rechecking it to hope that it wasn't true, that there was some form of error. But it spoke all too clearly; there was no mistake, there was no clear majority in the electorate. The Progressive Party had bested him, and that was that.\n\n"Sir...is there anything we can do for you? I mean, helpwise or any-" stammered the aide.\n\n"Just get out," Graaff responded curtly. The aide kept glancing back at Graaff as she walked away, giving one final glance of worry as she shut the door. Outside, the discourse between party members could be heard from where he sat, listening to the muffled talks of men and women discussing the possible future of the battered United Party, his United Party.\n\nAs the soft clacking of the assistant's heels dissipated into the humming of the office, the Prime Minister flicked his lighter over the front of a cigarette, took a drag of it, and turned in his swivel chair to face the window that looked out over the city around the building. First, he had fought a struggle to keep the Union of South Africa together, and now, he had to struggle to keep a United Party together, and in that, he had failed. There was no doubt in his mind that his political career was now over, and he should take a bow and pursue a polite exit before his party would aggressively show him the door."
 HDV_SAF.202.a: "Time to retire back to his vineyard"

 HDV_SAF.203.t: "A Bitter Awakening"
 HDV_SAF.203.desc: "The crowds at the NCP rally thinned quickly once reality hit them. The people who left first, fairweather friends of Vause Raw and his conservative movement, had quickly exited after the humiliating defeats continued to roll in, with Bernard Montgomery being at the front of the pack to distance himself politically as well as physically from the man who led South Africa's right to a stunning defeat that doomed them to the opposition, so it seems.\n\nThe heavyset party leader adjusted his glasses, looking at all the people coming and going, and decided to scramble over to a nearby buffet table to grab something to eat for himself, quietly stewing about the disgraceful performance. Had he truly misread his moment, had his work not been good enough? He was sure that the threat of the ANC rabblerousers beginning their nefarious work once again would be enough to scare people into voting NCP, but instead the weak minded Progressive Party, even more insufferable than Eglin and co., was going to lead the nation now.\n\nTonight, he would wallow in his failure, hold a humiliating speech accepting the defeat, and head home right after. But tomorrow, tomorrow, he would get up and get to work. There was no doubt in his mind that the pencil-necked idiot Schwarz would destroy himself and his movement once the reality of governance hit him, and that moment would be perfect for the NCP to take the reins and consolidate power once again.\n\nAll he had to do was wait for his political opponents to ruin themselves and soon enough things would turn around, and all those who walked away now would come to regret it in the end."
 HDV_SAF.203.a: "He would be in power in five years, or less..."

 HDV_SAF.204.t: "The Correct Timing "
 HDV_SAF.204.desc: "The longer the evening dragged on, the quieter it became at United Party Headquarters. What had begun with cautious optimism had given way to an uneasy silence. It was now clear that the Progressive Party, under Harry Schwarz, had stripped the United Party of its parliamentary majority. There were murmurs and speculations, assumptions hastily drawn from the numbers trickling in; truthfully, no one really knew what would come next for the battered old party. Most within the UP simply waited, hollow-eyed and uncertain, wondering what the morning would bring. But Div already knew. As he ascended the stage and faced the harsh white glare of the television lights, his mind was settled.\n\n"Fellow South Africans." He paused, offering a polite nod before continuing. "I want to begin by congratulating the Progressive Party and its leader, Harry Schwarz, on their remarkable victory tonight. The people of South Africa have spoken, and they have chosen to place their trust in a more progressive government. In the coming days, I hope we can begin constructive negotiations with the Progressive Party to form the next government and continue building a prosperous future for our nation and its people."\n\nHe stopped. The room fell into a heavy silence. Cameras clicked softly in the background. Div's gaze drifted from his colleagues to the press, then back to the dark lenses of the television cameras. Ten long seconds passed. His jaw shifted, his tongue pressing nervously against his teeth. The words he was about to say would end a career — but it was, he told himself, the right thing to do.\n\n"But I will not be a part of that." His hands gripped the lectern. "I have decided to retire from politics altogether and to resign as leader of the United Party, stepping down now that my task is complete."\n\nHe drew a breath, his voice softening as he continued. "When I was chosen as Prime Minister in 1956, I vowed to bring the modern era to South Africa. And today, our nation still stands as a beacon of freedom and prosperity in an Africa that is rapidly changing. Then came the war - the great existential struggle against the Germans as they goose-stepped south toward the Cape, believing the conquest would be easy. But no. No, they would not crush South Africa. We stood firm against the tides of darkness, and we kept the last light in Africa shining brightly."\n\nHe straightened slightly, his voice steady now. "It has been an honour to serve as your Prime Minister through these turbulent years, and I am proud to know that South Africa is stronger for it. I leave this nation in capable hands and look forward to a well-earned retirement among the vines of my vineyard." He gave one last nod toward the cameras. "Good night, and God bless you - and your families."\n\nWith that, Div turned and walked off the stage. The cameras continued to click, capturing the image of a man who had given his farewell to power, and to an era that had quietly ended."
 HDV_SAF.204.a: "A long career in service to the nation finally ended."

 HDV_SAF.205.t: "A Long Overdue Retirement"
 HDV_SAF.205.desc: "For decades, regarded within South African political circles as one of the most capable men in the halls of government, Deputy Prime Minister and Minister of Education Jan Hendrik Hofmeyr has announced his retirement from political life. While this comes as a surprise to much of the public, it's an open secret to those with the right connections that Hofmeyr's health has been in decline for some time. Renowned as a thorough and brilliant administrator, his retirement has naturally been carefully prepared for and planned over the course of months, ensuring a smooth transition, and now the time has finally come to pass. \n\nAdored by the liberal stalwarts that have always formed the core of his support, even Hofmeyr's political opponents, who certainly did not love his inflexibility, must admit a grudging admiration for his adherence to his principles. Even among his fellow Afrikaners, few of whom share his liberal sentiments, there is a sort of quiet respect for his administrative and educational achievements.\n\nMany worry that the end of his political career, inevitable though it is, will result in greater difficulty for the United Party, particularly when it comes to the development of effective policies and the rallying of its base to support its agenda. Despite his concerns, and after a long and distinguished career in public service, Hofmeyr now steps aside to make way for a new generation of United Party leadership. He entrusts them with the task of building upon his legacy, hoping they will use it as a foundation to forge a more liberal and progressive future for South Africa. Only time will tell whether that hope proves well placed."
 HDV_SAF.205.a: "The end of a lion of liberalism."

 HDV_SAF.206.t: "Looking Back"
 HDV_SAF.206.desc: "To say this day had been a long time coming would be obvious. When you enter public office, you know that one day you will leave it, whether by fate or by force. Div's time in office had been instrumental in building South Africa into a modern, advanced nation, now safely resting under the security umbrella of the Organization of Free Nations. When he came to power in 1956, South Africa had already been on the right track, but he did not doubt that his leadership had driven the nation further toward a brighter future. Having led the country through its most difficult existential crisis and emerging victorious in its defense, apparently, had not been enough to convince the electorate, who had stripped the United Party of its majority and forced it into a coalition to retain power.\n\nNow, he would bow out gracefully and pass the torch to a new generation who might rebuild the United Party to its former glory.\n\nToday was his final day as Prime Minister of South Africa, and he had insisted on cleaning out his office himself, gathering family photos, private notes, and other mementos. From the neatly stacked paperwork he left behind to the emptied rubbish bin in the corner, Div found a quiet solace in doing it all alone, the radio murmuring in the background about the day's events. His personal belongings sat packed neatly in a single box beside the door. For a moment, he hesitated, reconsidering. The United Party had lost, but not decisively, and his decision to leave had been his own. He could still turn back, stay on, and fight for his political future in the next election.\n\nBut he knew one thing above all: history does not look kindly on those who linger after their time has passed. He would miss the influence, the power, and the prestige that came with the office of Prime Minister, but he knew this was, truly, for the best."
 HDV_SAF.206.a: "And with a heavy heart, Div closed the door behind him"

 HDV_SAF.207.t: "Prime Minister Schwarz"
 HDV_SAF.207.desc: "The studio had been seen many times before by countless viewers, but for the first time, someone else sat in that chair behind the desk, addressing the South African people. A relative unknown, a fringe figure on the sides of politics for years, smiled at the people at home.\n\n"Fellow South Africans."\n\n"A different wind is blowing on the Cape, after many years of a continuous status quo. First, the war brought great suffering to our lands, shaking us from the foolish illusion that neutrality in the face of injustice was a solution. But we met that challenge head-on, and have stood firm against the separatists and their puppet masters. Now, with the return of peace, a great opportunity awaits us. Not merely to reconstruct the old South Africa, but to build a newer one that can reach ever greater heights. A land of hope and opportunity, a land where every citizen is treated with dignity and respect. Where chaos has no root to grow between the conversations of different people, and poverty is a thing of the past.\n\nOur path forward is a just one, based upon respect for all men despite our many differences, where a stable and free economy will bring prosperity to all. Our future is an open one, with our fates now forever intertwined with the Organization of Free Nations. The free world beckons us with opportunities that neutrality had denied us, and those brave men who gave their lives to defend our freedom shall never be forgotten.\n\nLet us all raise the torch of freedom, and build a truly free nation that is not ignorant to injustice, but fights with all its might to make life better for all South Africans."
 HDV_SAF.207.a: "Orange, White, and Blue, the colours of freedom"

 HDV_SAF.208.t: "A Letter From Div"
 HDV_SAF.208.desc: "Dear Harry,\n\nCongratulations on the success of the coalition talks, the office is yours, justly deserved after such an unexpected yet broad victory in these last elections. South Africa has given you a unique chance to make a great difference, and I would strongly recommend that you make good on it even though we do staunchly disagree on plenty of political matters.\n\nDespite your victory, many good and honest South Africans are concerned about the many different reforms that you have spoken about. This nation is, in nature, a conservative one, and even though the pendulum has swung towards you, it can just as easily swing back in the opposite direction. Were you to move too rashly in these matters or push too far, you shall find soon enough that the nation will turn against you. Modesty and stability are great things that help keep this nation prosperous, and too great a change can very much end up being this nation's undoing, if not entirely so.\n\nShould you need further advice on matters, I will always be available to offer any advice you need.\n\nSigned,"
 HDV_SAF.208.a: "£SAF_div_signature"

 HDV_SAF.209.t: "The Moment of Truth"
 HDV_SAF.209.desc: "The clock slowly ticked up to the full hour. Eight o'clock in the evening seemed so close and yet so far. For the first time in modern history, the dominant party system that had continued the United Party's complete grip on power in South Africa since 1934 seemed to be cracking. It's conservative wing had split off to form a new party, while on the left, the Progressives were surging, making it seem inevitable that the United Party would be toppled from the throne it had occupied for decades.\n\nIn three different places in Cape Town, the three different parties gathered to see who would win. The Conservative splitters under Vause Raw, the United Party still led by Sir De Villiers Graaff and the Progressive Party under Harry Schwartz were waiting for the full hour when the truth would be revealed about the heavily contested election.\n\nWhen that time finally came; the nation all turned to their TV's, the lesser fortunate in community TV halls, and those below by radio to listen to the news announcer's finely accented upper class English.\n\n"The S.A.B.C. exit poll for the elections of [?global.date.GetDateStringNoHourLong] are in. Taken across the land in key constituencies that will decide the fate of our nation for the next five years, this exit poll indicates that due to a surge in support for the Progressive Party..."
 HDV_SAF.209.a: "The United Party has lost it's majority."

 HDV_SAF.210.t: "Sweet, Sweet Champagne "
 HDV_SAF.210.desc: "The atmosphere within the Progressive Party headquarters was disturbingly tense, accompanied by an eerie silence that permeated the room, only broken by the analog clock, which loudly announced the passage of each second. Inside, party leader Harry Schwartz and his closest allies sat in an agglomeration of leather chairs, twiddling their thumbs at the single television in front of them.\n\n When the words were finally spoken out loud, there was a brief silence in the air, only to be ripped by a shrill declaration of victory, and the room burst into spontaneous cheering, as the people in the room began celebrating in earnest. But Harry simply sat in silence, hyperfixated on a reverie of the turbulent tenure ahead. He ran the calculations in his head, coming to a quick series of conclusions. If he could manage to form a coalition agreement with the battered United Party, he could become Prime Minister, even though that would mean having to water down parts of his policies to keep the United Party's moderate wing on board. The sore feelings between the NCP and the UP would also help make it much more likely that the gentlemen of the UP would be more agreeable to make a deal with him.\n\nThen the realization had hit him; he had done it. They had done it, the scrappy Progressive Party had risen higher and higher against the towering titan of the UP, and now would be able to change South Africa for the better, finally.\n\nThe future prime minister could finally relax, as he properly joined the vibrant celebration with the members of his future cabinet."
 HDV_SAF.210.a: "Progressivism ascends to the public stage."

 HDV_SAF.211.t: "End of a Career"
 HDV_SAF.211.desc: "The elections in South Africa had come with one gut-wrenching conclusion: the United Party had no clear majority. While not an absolute sign of defeat at the moment, per se, the harrowing news swept around the ranks of the voters of the United Party, leaving behind only concern mixed with just a bit of depression.\n\nColin Elgin walked to De Villiers Graaff's private room behind the stage, knocking frantically on the door and calmly stepping in. The Prime Minister was perched on his leather chair, still, in absolute silence. He flickered through the provided electoral data, creasing its sides over and over again, rechecking it to hope that it wasn't true, that there was some form of error. But it spoke all too clearly; the Progressive Party had taken away his majority. It was over, not for the party, but for Div's career, that much is certain." He turned to look at Elgin, who tried to speak but was cut off.\n\n"Here to claim your prize, I see? No, don't even try to deny it, you're here about the position of leader of the United Party, aren't you?"\n\n"I was not intending to request it this quickly. I came to see how you were doing."\n\n"Terrible, obviously. However, I prefer you over Strauss any day of the week, so I'll make sure to back you for the UP's new leader after I have left the position of Prime Minister. Now, leave me, I have much to think about."\n\nThe Prime Minister flicked his lighter over the front of a cigarette, took a drag of it, and turned in his swivel chair to face the window that looked out over the city around the building. First, he had fought a struggle to keep the Union of South Africa together, and now, he had to struggle to keep a United Party together, and in that, he had failed. There was no doubt in his mind that his political career was now over, and he should take a bow and pursue a polite exit before his party would aggressively show him the door."
 HDV_SAF.211.a: "Time to retire back to his vineyard."

 HDV_SAF.212.t: "A Disappointing Result"
 HDV_SAF.212.desc: "The crowds at the NCP rally thinned after the results rolled in. The people who left first, fairweather friends of Vause Raw and his conservative movement, yet at the same time there appeared to be still a fight left in the crowd with Bernard Montgomery sticking around telling glorious stories about his work in leading the defense of South Africa.\n\nThe heavyset party leader adjusted his glasses, looking at all the people coming and going, and decided to scramble over to a nearby buffet table to grab something to eat for himself, silently frustrated about the below mediocre performance. Had he truly misread his moment, should he have done more campaigning in rural areas? He was sure that the threat of the ANC rabblerousers beginning their nefarious work once again would be enough to scare people into voting NCP, but instead the weak minded Progressive Party, even more insufferable than Eglin and co., had been the one to dethrone the UP in the way he planned to.n\nTonight, he would wallow in his failure, hold a humiliating speech accepting the defeat, and head home right after. But tomorrow, tomorrow, he will get up and get to work. There was no doubt in his mind Eglin would end up biting off more than he could chew, and that exact moment would be perfect for the NCP to take the reins and consolidate power once again.\n\nAll he had to do was wait for his political opponents to ruin themselves, and soon enough things would turn around for the new Conservative Party."
 HDV_SAF.212.a: "The party had missed its chance, but there would be another day."

 HDV_SAF.213.t: "The Correct Timing"
 HDV_SAF.213.desc: "The longer the evening dragged on, the quieter it became at United Party Headquarters. What had begun with cautious optimism had given way to an uneasy silence. It was now clear that the Progressive Party, under Harry Schwartz, had stripped the United Party of its parliamentary majority. There were murmurs and speculations, assumptions hastily drawn from the numbers trickling in; truthfully, no one really knew what would come next for the battered old party. Most within the UP simply waited, hollow-eyed and uncertain, wondering what the morning would bring. But Div already knew. As he ascended the stage and faced the harsh white glare of the television lights, his mind was settled.\n\n"Fellow South Africans." He paused, offering a polite nod before continuing. "I want to begin by congratulating the Progressive Party and its leader, Harry Schwartz, on their remarkable victory tonight. The people of South Africa have spoken, and they have chosen to place their trust in a more progressive government. In the coming days, I hope we can begin constructive negotiations with the Progressive Party to form the next government and continue building a prosperous future for our nation and its people."\n\nHe stopped. The room fell into a heavy silence. Cameras clicked softly in the background. Div's gaze drifted from his colleagues to the press, then back to the dark lenses of the television cameras. Ten long seconds passed. His jaw shifted, his tongue pressing nervously against his teeth. The words he was about to say would end a career — but it was, he told himself, the right thing to do.\n\n"But I will not be a part of that." His hands gripped the lectern. "I have decided to retire from politics altogether and to resign as leader of the United Party, stepping down now that my task is complete."\n\nHe drew a breath, his voice softening as he continued. "When I was chosen as Prime Minister in 1956, I vowed to bring the modern era to South Africa. And today, our nation still stands as a beacon of freedom and prosperity in an Africa that is rapidly changing. Then came the war - the great existential struggle against the Germans as they goose-stepped south toward the Cape, believing the conquest would be easy. But no. No, they would not crush South Africa. We stood firm against the tides of darkness, and we kept the last light in Africa shining brightly."\n\nHe straightened slightly, his voice steady now. "It has been an honour to serve as your Prime Minister through these turbulent years, and I am proud to know that South Africa is stronger for it. I leave this nation in capable hands and look forward to a well-earned retirement among the vines of my vineyard." He gave one last nod toward the cameras. "Good night, and God bless you - and your families."\n\nWith that, Div turned and walked off the stage. The cameras continued to click, capturing the image of a man who had given his farewell to power, and to an era that had quietly ended."
 HDV_SAF.213.a: "A long career in service to the nation finally ended."

