 ### Legacy of Rhodes / Mining Mechanic ###
 SAF_diamonds_from_sierra_leon: "The Legacy of Rhodes"
 SAF_diamonds_from_sierra_leon_desc: "[getDiamondsFromSierraDesc]"
 SAF_diamonds_from_sierra_leon_desc_peace: "\n\n£GFX_SAF_mines\n\n\n\n\nThe discovery of diamonds in Kimberley, nearly a century ago, transformed our country from a nation of farmers into a nation of miners. Since then, settlers from around the world have come to the Cape in pursuit of dreams of endless wealth; however, the modern mining industry is no place for adventurers.\n\nThe De Beers corporation, founded by Cecil Rhodes and now managed by Harry Oppenheimer from Cape Town, has complete control over the extraction and trade of these precious stones. By collaborating closely with De Beers, we have opened up opportunities within both the OFN (Organziation of Free Nations) and the Einheitspakt's economies and trade networks. This partnership also provides us with the necessary funding for the costly yet successful National Development Plan.\n\nAt the same time, maintaining our neutrality is a delicate matter. The Germans, in particular, are quite unhappy with the government's subtle but evident pro-OFN stance and that of the United Party. If German dissatisfaction were to escalate to the point where they decided to withdraw their investments, we would lose numerous opportunities, which could significantly hinder our economic growth. It is crucial to foster good relations with Germany, as its increasing anger poses a real threat to our current economic golden age."
 SAF_diamonds_from_sierra_leon_desc_war: "\n\n£GFX_SAF_mines\n\n\n\n\n\nWar has come to South Africa, and as the country balances on the edge of destruction, the mining operations continue without interruption. Diamond exports continue but right now it is paramount to invest in our direct defense. It is now abundantly clear that the Boers and their German allies seek to completely conquer our nation. Now is the time to make use of our greatest asset and put it to work by investing in our people, our military, our fortifications, and our infrastructure all to serve the war effort.\n\nSouth Africa shall stand against the tide of tyranny, united in the defense of our homeland."
 SAF_diamonds_from_sierra_leon_desc_postwar: "\n\n£GFX_SAF_mines\n\n\n\n\n\nThe South African war has been a giant disaster, but it is one that has been overcome. As the nation moves towards peacetime the process of reconstruction begins. Now limited to just neutral markets and the OFN, the export of South Africa's mineral wealth stands to grow beyond what it was pre-war through a rapid project of revitalizing the economy through intensive domestic, government, and foreign investment.\n\nSouth Africa is a new frontier and safe haven for OFN investment, linking the United States and the Caribbean with Australia and New Zealand, with its ports soon bustling with trade once again. The nation is a diamond in the rough, waiting to be polished to a shine by the magic of global investment and trade."
