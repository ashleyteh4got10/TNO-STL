 ## Leader Descs ##
 POLITICS_VILLIERS_GRAAFF_DESC: "Succeeding his father's position as the Baronet of Cape Town, De Villiers Graaff discovered whether he liked it or not, he was destined to enter the ring of South African politics. Working his way from the lower echelons as a member of the House of Assembly, his hard labor and commitments eventually paid off, elected to lead the United Party in '56 in a close victory over Jacobus Strauss. It seemed to Graaff that his almost supernaturally uncontested ascension to power as Prime Minister was preordained to succeed, to keep the fine balance between opposing forces both internally and externally.\n\nEver since his appointment, Graaff has worked tirelessly to maintain the balancing act that preserved the fragile equilibrium of South Africa, and that of his own United Party which over time, lives less and less up to its name. Yet the last six years have shown Graaff how to effortlessly manoeuvre the nation towards a steadily blossoming prosperity. Without a proper vision getting in the way of his politics, Graaff has shifted to the left and to the right for whatever was needed to keep the status quo going for just a little bit longer.\n\nHowever, not everything can be fixed with a pleasant speech and a well-thought-out compromise, and so, the nation continues to move towards a violent resolution of a long-suppressed discontent; South Africa has never teetered closer towards a collision course. Both the Boers and the ANC are becoming restless, becoming a more radical and dangerous threat to the government with every passing day. The Germans await at the border, sharpening their claws for when they can dig into the fresh meat of the Cape Colony, threatening to destroy the very precious liberty of its people who have just achieved the vote. Prime Minister De Villiers Graaff must steer his nation on the correct course and prepare accordingly for the approaching storm, lest all his hard-worked effort be destroyed in one fell swoop."
 POLITICS_VILLIERS_GRAAFF_DESC_2: "Not a moment passed after the violent outbreak of the South African War before Div began to attempt to maneuver things to his own political advantage. The advocate of complete neutrality dropped it in an instant the first reports of the Afrikaner onslaught came in, immediately turning to America as its savior while the German colonies in the north prepared for war.\n\nIn some sense, the war has been a disaster, but ever the maneuverable, flexible, vision-less figure, De Villiers Graaff immediately moved to use the opportunities given by the war. Appealing to the greater values of liberty, and the threat from enslavement by the Afrikaners and their German allies, De Graaff moves to stand above his party and his nation as the beacon of enlightenment calling the free world to defend the flawed democracy in South Africa. Any mistakes and misgivings of the past were brushed over, as every South African is called to the defense of the nation.\n\nWith his popularity skyrocketing as loyalists rally to the cause, and the Coloured and Black populations of South Africa feel the seriousness of the situation De Graaff shifts into the position of a Prime Minister at war, still on top of everything... as long as the war effort holds up."
 POLITICS_VILLIERS_GRAAFF_DESC_3: "Despite all odds, De Villiers Graaff still holds the position of Prime Minister of South Africa with his term approaching a decade overall. Challenges on the left, challenges on the right, the Boers, the ANC, and even all the might of Nazi Germany could not stop Div from holding on to power as the United Party's dominance of South African politics continues into the post-war period.\n\nSouth Africa has been wounded, shattered, and injured, yet it never broke. Through pragmatic military reforms, intense amounts of capital spent on its defense, and of course, incredible amounts of aid and support by the United States of America the Cape still has the Orange, White, and Blue flying high over it to this day. The position of neutrality is gone for good, now South Africa (and Div with it) finds itself as the newest member of the Organization of Free Nations, and America's influence now reaches far and wide. A new era of South African history approaches, and many wonder if the United Party's time in power is coming to an end with new and old forces beginning to make moves against it.\n\nFor as much as South Africa has changed, De Villiers Graaff has not. While his hair has begun to gray and his face shows ever deeper lines, the charismatic, pragmatic, vision-free figure has once again bounced back from a crisis to firmly pull the strings in the Rainbow Nation just like he did when he took office in 1956. And the same as it ever was, the only thing that matters to the United Party is one simple question.\n\nWhat will it take to keep Div in power for another five years?"

 POLITICS_CONNIE_MULDER_DESC: "Connie Mulder is a disillusioned man. For years, he worked to bring the National Party to power, first as a councilman, then as a mayor, and finally, as an officer during the war. Even more so, he was one of the Transvaal Boer's most pro-German politicians, staunchly opposing any expansion of American influence into South Africa. Yet for all of this, he now leads the revolt against those he wished to see rule.\n\nMulder watched in horror as the Afrikaner Volkstaat which he helped bring about was torn apart between its slavish loyalty to Hüttig's regime in Bouhlerstadt, the ceaseless native resistance to its existence, and the extremists in the Volksraad. Slowly but surely, the former teacher established connection with United Party politicians, knowing full well the regime couldn't last. Then came the overthrow of Hertzog, and it was worse than Mulder imagined.\n\nWhen the fragile government collapsed in the face of Malan's coup, Mulder was the only man with connections to both Boer loyalists and United Party politicians, and so he was unanimously elected President of a restored South Africa, with all three votes. In a sense, Mulder is little more than a puppet for the special interests who back his government, whose ultimate end is to restore the pre 1964 constitution. However, he also personifies the factionalism that the reborn South African state suffers from: As a lifelong segregationist, he is at odds with the remnants of the United Party who wish to use the war as an opportunity to end the practice once and for all."
 POLITICS_TAFFY_WILLIAMS_DESC: "Only the most insane of men would attempt to actively insert themselves into the hellish nightmare that was Hüttig's Africa. One such man was Taffy Williams.\n\nAfter briefly serving in the Zentalafrikan wars during the 1950s, Williams returned to Europe for service by HMMLR during the English Civil War, missing out on the first two South African Wars due to the American blockade. However, Harry Oppenheimer's need for loyal mercenaries to protect the DeBeers-Anglo corporation, and now, to prop up his new "Republic," ensured the Englishman's return to the battlefields south of the Sahara.\n\nSmuggled into Mozambique in the aftermath of the second South African War, Williams was made head of the "DeBeers Protection Forces," an organization that has now become synonymous with the South African Army. In collaboration with McCain's men, also founded by DeBeers-Anglo, Williams effectively protected the company's assets from retribution by the SS until news of Hüttig's death came.\n\nFollowing plans carefully laid by Oppenheimer, William's mercenaries easily toppled the disintegrating German administration, installing what is nominally a Republic with Oppenheimer as President. However, it is obvious that the government is little more than a front for corporate dominance, and that, for the moment, it is Taffy Williams, and not the President, who calls the shots."

 POLITICS_JANIO_THE_TERRIBLE_DESC: "Jânio da Silva Quadros Y Leche de Santa Maria de Aragon como estás muchos Huevos the First of South America is the very definition of the enlightened monarchs often unseen in the modern age. Originally a Brazilian waxer from Mexico, the shifting tides of the silicon dreams brought him washed ashore close to Cape Town where Jânio first started to work as a competitive racist at the Ferrari factory in Potchefstroom, rising to be Europe's best racist after winning the Monaco Grand Prix of 1952.\n\nWith his two eyes, four ears, and one mustache Jânio da Silva Quadros Y Leche de Santa Maria de Aragon como estás muchos Huevos returned to his new home victorious only to find it divided more and more between the different peoples in this land, with the matter of the monarchy being extremely divisive. With his trophy in hand, he marched upon Parliament and demanded to be declared Emperor of South America. Everyone clapped for Jânio da Silva Quadros Y Leche de Santa María de Aragón como estás muchos Huevos and declared Jânio da Silva Quadros Y Leche de Santa María de Aragón como estas muchos Huevos to be the rightful Emperor, even renaming the country after him.\n\nSouth Africa is no more, now it is South America under the divine rule of Emperor Jânio the First. Long live the emperor, and long may he stare with both eyes in different directions."
 
 ## Minister Descs ## HDV
 SAF_Jan_Hendrik_Hofmeyr_hog_desc: "§YDeputy Prime Minister\nProgressive Liberalism§!\n--------------\nBrought up a progressive, Jan Hendrik Hofmeyr has always been a fervent loyalist to the ideology even if it meant battling against the tides of his own people. Although his fellow Boers may have turned away from the United Party leaving him stranded and alone, Hofmeyr has remained strong loyalist, consolidating his position on the left flank of the party. Albeit this role is not an envious position by any means, Hofmeyr has continued to advocate for a mild and progressive solution to the internal bickering and strife within South Africa.\n\nYet at the same time, he remains an advocate of peaceful segregation, a belief as strong as his dedication to the torch of freedom. As the pressure from the north mounts upon South Africa, Hofmeyr will continue to push for a pragmatic approach towards the ANC, whether it aligns with the wishes of his fellow Boers or not."
 SAF_Vause_Raw_eco_desc: "§YEconomy Minister\nPaternalistic Conservatism§!\n--------------\nThe proper conservative British traditions still hold stock in South Africa, even if it is no longer a Dominion or a member of the Commonwealth.\n\nVause Raw is a proud continuation of that very tradition which divides South Africa. No matter the cost, Raw has sacrificed everything for the precious status quo while blocking out the ever increasing noise of change.\n\nIt pains him to have to play nice with the German corporations while conducting trade with the Pakt, yet Vause has deemed it to be a righteous and necessary aspect of the South Africa orthodoxy. Regardless of how loud or even worse violent the cacophony of change may get, Vause will just block his ears and close his eyes, and pray for the best."
 SAF_Jacobus_Strauss_for_desc: "§YForeign Minister\nLiberal Conservatism§!\n--------------\nWho cares about a silver medal? Who remembers people who come in second, the runners-up? No one. Jacobus Strauss lost his bid for leadership to De Villiers Graaf in a contentious inner-party election. As a compromise with the people who had voted for Strauss, he was promoted to foreign minister instead.\n\nHis moment had passed, and now working a job he despises, Strauss patiently bides his time for Graaff to make the fatal mistake which would deliver his well-deserved victory. Until then Strauss is stuck balancing between the Yank and the Jerry, desperately trying to keep the diplomatic house of cards that is South Africa together lest all his efforts go to waste."
 SAF_Colin_Eglin_sec_desc: "§YMinister of Defense\nProgressive Liberalism§!\n--------------\nThe pipeline from soldier to commander to politician is a staple of South African politicians, and Colin Eglin is one of the key representatives of this historic tradition. Being one of the stauncher opponents of Apartheid and the Boers' pull towards authoritarianism, Eglin has committed himself to what he sees as the defence of South African liberty and prosperity.\n\nEven as Graaff and Strauss limit the nation with their cowardly neutrality, paralysed with the fear of offending the Germans, Eglin has worked to modernize and strengthen the South African forces within the limitations that had been placed upon him. An internal reformist who never breaks the rules of the system in which he works, his push for a better South Africa will continue until either he or his nation perishes."

 SAF_Jan_Hendrik_Hofmeyr_hog_2_desc: "§YDeputy Prime Minister\nProgressive Liberalism§!\n--------------\nJan just doesn't understand what happened. Had he been so disconnected from his people that he could not foresee their absolute treason? He had worked tirelessly to try and uphold the interests of the Afrikaners within the United Party, while also trying to push things in the right direction.\n\nBut all efforts had failed, and now he was left with nothing but trying to salvage the horrible situation. A peace-loving intellectual forced to lead the United Party through the war, Hofmeyr knows he is out of his depth but, nevertheless, continues the struggle for a free South Africa."
 SAF_Vause_Raw_eco_2_desc: "§YEconomy Minister\nPaternalistic Conservatism§!\n--------------\nHow dare they! How dare they, these roughshod traitors in the north betray South Africa. Of course, the Boers could never be trusted, no, they should have their right to vote taken away just like the Blacks. But first things first, the complete devastation of the delusion that the Boers would have their own state. They lost against the British twice, and now Vause would ensure that the third time would be the final defeat.\n\nWorking day and night to whip the war economy forward, Vause Raw feels nothing but a great drive to defend his South Africa, where the spirit of Great Britain still lives, unbroken by the German menace."
 SAF_Jacobus_Strauss_2_for_desc: "§YForeign Minister\nLiberal Conservatism§!\n--------------\nOf course, South Africa had fallen into a civil war. Of course, the Germans were moving in the north, eager to join the conflict. And of course, the nation was undefended against the oncoming storm. What else could have happened under the witless, pointless, courage-free leadership of the weathervane Prime Minister?\n\nStrauss knows very well why this all happened, and yet the man responsible for it all still leads his United Party, a place that should have been his. Now is the time to begin preparing to reclaim his rightful place as Prime Minister while operating as South Africa's foreign minister, making connections with the Americans and other key figures within the party to try and secure support for himself."
 SAF_Colin_Eglin_sec_2_desc: "§YMinister of Defense\nProgressive Liberalism§!\n--------------\nColin Eglin has suddenly become the most important minister in Graaff's cabinet, and it is a task he doesn't shy away from. With spending on the defense surging and the Americans coming in to help South Africa in this crisis, the sleepiest post has become absolutely vital.\n\nAny attempts to keep pushing De Villiers Graaff to accept a more progressive stance are on hold as Eglin moves to defend South African freedom, and at the same time let in as much American influence into South Africa as he can so that the Americans will end up being a force for good in the nation. The torch of liberty shall shine on, and Eglin shall be its bearer."

 SAF_Jan_Hendrik_Hofmeyr_hog_3_desc: "§YDeputy Prime Minister\nProgressive Liberalism§!\n--------------\nTo say that the war has taken the most out of Jan Hendrik Hofmeyr has been an understatement. His health has come under serious pressure, and by the end of the war, he knew very well that his retirement would be coming soon.\n\nNevertheless, he has done his duty for the nation without a moment of doubt and is now looking to pass on the leadership of the liberal wing of the United Party to Eglin while preparing to wrap up his lifelong political career."
 SAF_Vause_Raw_eco_3_desc: "§YEconomy Minister\nPaternalistic Conservatism§!\n--------------\nThe matter is settled. South Africa remains, despite all efforts by the Boers and the Huns to destroy it, the spirit of South Africa remains unbroken. But Vause has no time to celebrate as he plans to split away from the United Party, taking with him quite a few of the fine Anglo gentlemen to build a new party.\n\nThe New Conservative Party shall be a real force in South African politics, hopefully helping push back against the weak-minded liberal progressives that seek to hand this nation over to the ANC rabble. South Africa had always been British, and so it shall stay."
 SAF_Jacobus_Strauss_for_3_desc: "§YForeign Minister\nLiberal Conservatism§!\n--------------\nNow is the time to finish the final preparations before Strauss gets his chance to lead South Africa. While the air-headed idiot goes to hold more empty speeches on TV, Strauss is seeking support from key figures to finally secure leadership of the United Party.\n\nWith tentative backing from both Henry Oppenheimer and some half-baked support from the American ambassador, he stands ready to make his move and retake the rightful title that De Villiers Graaff had stolen from him."
 SAF_Colin_Eglin_sec_3_desc: "§YMinister of Defense\nProgressive Liberalism§!\n--------------\nOne task is complete, and now it is time to get back to what needs to be done. Colin stands ready to push the progressive wing of the United Party forward to finally achieve further reforms to the nation. A conduit for American influence in South Africa, Eglin hopes to move South Africa forward with help from Uncle Sam.\n\nThe new Union Defence Forces will be shaped according to American standards, with American equipment and American support, forever ready to defend the Cape against any who would threaten it. Sooner or later, South Africa would carry forth the torch of freedom to all its people and not just the lucky few."

 #Post-War
 #Very conservative
 SAF_Jacobus_Strauss_hog_vc_desc: "§YDeputy Prime Minister\nLiberal Conservatism§!\n--------------\nSo close, yet so far. Finally, De Villiers Graaff has retired after the loss of the elections of the New Republic Party, and Jacob is the undisputed leader of his United Party, only to be beaten in the election by the conservative splitters led by Vause Raw and his stupidly named New Conservative Party. The role of Prime Minister has passed him by, and now he has merely risen to be a coalition member and head of Government in Raw's government.\n\nBehind the mask of a gentleman politician with an affinity for diplomacy lies nothing but seethe and disgust, for he has been denied his rightful place once again, now playing second fiddle to a fat oaf and his gerontocracy. But Strauss knows full well that the game is not yet over, and he just has to switch targets to try and bring down Vause Raw once and for all."
 SAF_Piet_Koornhof_for_vc_desc: "§YForeign Minister\nAnocracy§!\n--------------\nThe smallest member of the new governing coalition, the VredesAfrikaner Party, is what remained of those Afrikaners who remained loyal to South Africa. In a twist of fate, the Afrikaner man finds himself to be the moderate in a cabinet of Anglo hardliners who seem dead set on nothing more, nothing less than the status quo to create a nation frozen in time forever, led by British gentlemen.\n\nWhile Koornhof now finds himself as a proper member of the new conservative coalition his influence remains limited to trying to strengthen South Africa's links abroad with both the OFN and with neutral nations which provide valuable opportunities for trade and investment while at the same time trying to polish away any foreign misgivings on how the Black majority is treated in the divided nation of South Africa."
 SAF_Cyril_Radcliffe_eco_desc: "§YEconomy Minister\nFree Market Conservatism§!\n--------------\nAn outstanding gentleman from the British Exile class, Cyril Radcliffe, the 1st Viscount Radcliffe, had been an influential civil servant working under the United Party, never quite seeking to get too involved in politics, but rather to serve the nation dutifully. Yet when Vause called him requesting him to join him in splitting from the ever more divided United Party, he joined the New Conservative Party as its chief economic advisor and organiser.\n\nBut with the shocking electoral victory and the rise to power of Vause Raw, Cyril now finds himself as Minister of the Economy and Infrastructure, left to continue the process of reconstruction after the South African War. "
 SAF_Bernard_Montgomery_sec_desc: "§YMinister of Defense\nNational Conservatism§!\n--------------\nMost people would quietly head for retirement by now, but Bernard Montgomery has found a new leash on life that he simply can't let go of. His efforts to help the defence of the nation from the German onslaught, followed by his tireless campaigning for Vause Raw and his New Conservative Party, have brought spectacular results as a conservative wave washes over the Cape.\n\nOld British traditions have been defended, and they shall stand as the firm foundations of the nation forever. While there are many who objected to his appointment due to his highly advanced age, Bernard simply was too influential to be denied the position and thus continues to influence any and all defence policy on the southern shores of Africa."

 POLITICS_VAUSE_RAW_DESC: "South Africa stands, and at the peak of its power is the Right Honourable Gentleman Vause Raw, the fiercest defender of the British Elite in South Africa. The Status quo shall hold, and under enlightened British leadership, South Africa shall remain forevermore as it was.\n\nA divided, segregated nation where the Anglo reigns supreme over the Afrikaner, the Black, and the Coloured, all played against each other in an eternal game of divide and conquer, just as the British Empire had done long ago. The progressive, weak-minded, foolish liberals have been dealt a decisive blow as their appalling appeals to apathetic appeasement and ascendance of abundant anarchist Africans are amended and abolished.\n\nThe firm hand of the British gentlemen class once ruled the world, and it may do so again. Promising a return to the good old days of stability and order,r Vause and his allies seek to permanently strengthen the system of internal security and further restrict the few rights of the Black majority. And not even the Coloured citizens, tainted by the sins of their ancestors, shall be spared as the gentlemen class of the Cape prepares to take away the rights of the Coloured minority and toss them into the Black underclass, where they belong.\n\nSouth Africa's tale has now been told, and whatever may happen beyond this point is left up to the mists of time."

 #Conservative
 SAF_Vause_Raw_hog_desc: "§YDeputy Prime Minister\nPaternalistic Conservatism§!\n--------------\nIt had been a good showing, but not good enough to secure a dominant degree of seats in parliament for Vause Raw to finally claim the Prime Minister's office. Instead, he found himself in a mostly familiar situation of having to attempt to push the United Party to the right, except with a different person leading. But the progressives had been dealt quite a blow with NCP representatives kicking several of them from their seats, and his influence could not as easily be marginalised as it had been before.\n\nThe New Conservative Party now stands as an influential organisation ready to take up the reins of power in South Africa as a true force in politics. Vause Raw may have missed the chance to govern as Prime Minister, but his influence in politics remains significant and his determination only ever more emboldened."
 SAF_Stephen_Melville_sec_desc: "§YMinister of Defense\nChristian Conservatism§!\n--------------\nWhile the process of forming a coalition between the United Party, the New Conservative Party and the VredesAfrikaner Party had gone relatively smoothly, there had been one serious hiccup. The position of Minister of Defence had been vigorously claimed by Sir Bernard Montgomery, the Lion of South Africa and its finest defender. The man and his qualities were not in doubt, but his age most certainly was. After a long, drawn-out conflict over the position Strauss offered to hand Vause and his conservatives the minister of economy, while the United Party would appoint one of its own to the minister of defence.\n\nStephen Alexander Melville had been one of the first pilots in the new South African Air Force, and his position continued to rise. After serving in command of several air wings in the Second World War, he had become the undisputed figure leading the South African Air Force, which absorbed the remnants of the RAF after the war's end. His appointment as Minister of Defence was the natural climax to a lifetime of defending South Africa."
 SAF_Piet_Koornhof_for_desc: "§YForeign Minister\nAnocracy§!\n--------------\nThe smallest member of the new governing coalition, the VredesAfrikaner Party, is what remained of those Afrikaners who remained loyal to South Africa. With the conservatives having a strong showing in the latest elections, Koornhof was able to secure a position in a government that roughly aligned with his own beliefs as a moderate conservative figure.\n\nWhile Koornhof now finds himself as a proper member of the new liberal conservative coalition his influence remains limited to trying to strengthen South Africa's links abroad with both the OFN and with neutral nations which provide valuable opportunities for trade and investment while at the same time trying to polish away any foreign misgivings on how the Native majority is treated in the divided nation of South Africa."

 POLITICS_JACOBUS_STRAUSS_DESC: "Jacobus Gideon Nel Strauss had always been ready for leadership. Ever since he was young, he had idolised Prime Minister Jan Smuts and had been close with his family to the degree where he was considered an adopted son of the Smuts family. Mentored by the greatest politician South Africa had known, he became Minister of Agriculture, one of the most trusted members of the Smuts government that lasted until 1950. Shuffling through a few less popular party leaders, the party held a decisive vote in 1956 which just, ever so closely saw Strauss losing to De Villiers Graaff.\n\nEver since then, he had bided his time, waiting, plotting and organising to achieve the position of power. With the strong, yet not decisive decision of the United Party, De Villiers Graaff finally saw fit to concede leadership of the United Party, and soon enough, Strauss slid into the role unopposed as a decade of preparations finally paid off.\n\nIt had not been as easy to form a coalition with the conservative wing of the United Party having split off, yet in some sense things are back to as they were within the newly formed government coalition to keep the National Party out of power things mostly returned to how they had been except for the United Party edging a bit more towards the right with several of its leading progressive figures getting voted out of parliament. While Vause Raw is now a major player in politics once again, it is Jacobus Strauss who truly stands on top in the Springbok nation. And now, after all that, he is the undisputed leader of the United Party, Prime Minister of South Africa, and on his way to becoming a worthy successor to Jan Smuts.\n\nSouth Africa's tale has now been told, and whatever may happen beyond this point is left up to the mists of time."

 #Status Quo
 SAF_Jacobus_Strauss_hog_sq_desc: "§YDeputy Prime Minister\nLiberal Conservatism§!\n--------------\nNo, Jacobus Strauss has never been a quitter. A determined operator, a diplomatic gentleman and an adept negotiator, his determination in stealthily taking down De Villiers Graaf has never once been revered. And yet now, as he gets closer to power with Jan Hofmeyr's retirement, Jacobus is smart enough to see that Graaff's hold on the party is now near absolute. With his plans remaining secretive, Strauss is now flexible to switch strategies.\n\nRather than subtly undermining Graaff, it had now become a mere waiting game while he assumed the position of the party's Crown Prince, waiting in the wings for the King to finally step aside. Jacobus Strauss would be the Prime Minister of South Africa one day, but that would not be today. At least he didn't have to hold foolish phone calls with the German ambassador any more."
 SAF_Abba_Eban_for_desc: "§YForeign Minister\nProgressive Liberalism§!\n--------------\nAbba Solomon Meir Eban is a prominent member of South Africa's Jewish community, which escaped the ravages of the war and its ensuing genocide through sheer distance away from Germania on the Southern tip of Africa. Working as a British intelligence officer in the Middle East during the war, the unfortunate outcome of the war had him return to his homeland of South Africa to serve with the newly founded BOSS, as well as holding positions within South Africa's foreign office, mixing espionage with diplomacy.\n\nWhile his leanings are progressive, some rumours have arisen that Graaff had him appointed as South Africa's foreign minister specifically to spite the Germans who had once tried to destroy him. Other rumours speak of him using connections relating to his intelligence links or his heritage to secure the role of foreign minister, yet in the end, neither rumour turned out to be true. A reliable, personable, loyal man with a knack for diplomacy, Abba Eban turned out to simply be the best man for the job."
 SAF_Colin_Eglin_sec_4_desc: "§YMinister of Defense\nProgressive Liberalism§!\n--------------\nSo things didn't end up changing after all, no movement towards the progressive side of the United Party or a surge of the Progressive Party that would force the United Party to turn towards the light. De Villiers Graaff would still be Prime Minister, ten years after he started his reign, and Colin Eglin would still be Defence Minister.\n\nWhat matters more is what has changed, for the Conservative wing of the United Party split off, leaving Eglin with much more influence than Vause Raw for he is still a key part of the government. His options right now are limited, but Eglin has already had plenty of experience with pushing his agenda from his position as Defence Minister"

 POLITICS_VILLIERS_GRAAFF_DESC_4: "When he was first elected to lead the United Party, people doubted Div. Every time new elections approached or the two wings of his own party clashed, people doubted Div. When the greatest existential crisis struck South Africa, a civil war turned foreign war of conquest, people doubted Div. And finally, when the new elections were called and new challenges on the right and the left arose stronger than ever, people doubted Div.\n\nAnd now there are no doubters any more. Nowhere inside or outside South Africa does anyone doubt in the slightest that Sir De Villiers Graaf, 2nd Baronet, holds undisputed power in South Africa. Now free to continue his rule for another five years, any who thought there would be a new wind blowing in South Africa is mistaken. Forever in the middle, Div has found the perfect balance of power, and no one will ever again dare to knock him off it. For as long as he sees fit, he shall continue to lead his party and his nation towards a brighter future for the people who have been selected to receive the blessings of the ever-expanding wealth of the nation. Forevermore, the Orange, White and Blue flag shall fly over the Cape, and for as long as he wishes to, De Villiers Graaff shall carry on to lead his nation onward.\n\nSouth Africa's tale has now been told, and whatever may happen beyond this point is left up to the mists of time."

 #Progressive
 SAF_Harry_Schwarz_hog_desc: "§YDeputy Prime Minister\nProgressivism§!\n--------------\nHarry Schwarz had long been seen as an afterthought in South African politics, with his Progressive Party never being able to find widespread success until now. Denounced in equal measure for his Jewish heritage and his strong progressive credentials, Schwarz has always been the second biggest boogieman for the Afrikaners, right after the ANC. But it was their rash foolishness in starting the civil war that finally enabled Schwarz and his Progressive Party to become kingmakers in parliament, negotiating with the United Party to form a Progressive Liberal coalition.\n\nWhile not being able to immediately push for complete equal rights and the dismantling of all measures built up by the conservatives due to his coalition partner's timidness and a tight electoral lead over the opposition, the path towards a better South Africa has just been opened"
 SAF_Helen_Suzman_for_desc: "§YForeign Minister\nProgressivism§!\n--------------\nHelen Suzman has always been an outspoken advocate for the poor and downtrodden of South Africa, fighting for those who suffered under the oppressive enforcement of the status quo by the United Party and the Afrikaners. But now, after ten years as a member of Parliament for Schwarz's progressive party, she can finally start to make a real difference within South Africa.\n\nWell, to be precise, outside of it. With the division of ministerial posts between the Progressive and the United Parties, the slot of Foreign Minister fell towards the Progressive Party, which, after a moment, assigned Helen to fill it. With a heavy heart, Helen prepares for the role of foreign minister, knowing full well that her colleagues at home are making great strides for the cause of a better South Africa"
 SAF_Jan_Steytler_sec_desc: "§YMinister of Defense\nProgressive Liberalism§!\n--------------\nSome may argue that Jan Steylter doesn't exactly have the makings for a minister of defence with his history of serving as a military doctor in the Second World War and working as a surgeon on the western side of the Cape province, suggesting him for Minister of Health in the new Schwarz cabinet. Yet, as it is in politics, things never quite go how they are planned, and Jan was assigned as Minister of Defence instead.\n\nThe soldier turned doctor, turned politician, is up for the task that lies before him to reform South Africa's army to a modern force that can stoutly defend the borders of the nation while at the same time becoming an integral part of the OFN, collaborating with all of its international partners on national security. Yet, as could also be expected, Steytler has begun to funnel investments towards South Africa's medical corps."
 SAF_Zach_de_Beer_eco_desc: "§YEconomy Minister\nMarket Liberalism§!\n--------------\nWith the split of the conservatives from the United Party, space has arisen for new, slightly more progressive liberals to take up positions of influence. Zach De Beer is one of them, a member of the influential De Beers family who holds a significant stake in the diamond mining company named after them. After becoming the youngest member of the United Party to be voted into parliament at the age of 24, he now immediately claims the record of the youngest minister of the economy as well.\n\nHis connections within his family and with Oppenheimer mean that the steady continuation of liberal business interests dominates the nation, while his progressive leanings lead him to begin pushing for a fairer treatment of the Black majority within South Africa, knowing full well that change will not come easily, but it is a fight worth fighting for."

 POLITICS_COLIN_EGLIN_DESC: "A new wind washes over the Cape, and a new Prime Minister stands to begin the challenging process of building a new South Africa. After the rise of the Progressive Party to become the second biggest party in South Africa and the marginalisation of the conservatives, De Villiers Graaff finally saw the writing on the wall and retired, leaving Defence Minister Colin Eglin to rise to power as the newest Prime Minister of South Africa.\n\nHaving fought on the side of freedom in the Second World War and afterwards rising through the ranks of the United Party to become minister of defence throughout the South African War, Colin Eglin is a tested veteran of both warfare and politics who nevertheless wholeheartedly advocates for a more progressive South Africa that makes constant motion towards equality for all. Though anyone who would think that the radical reforms are around the corner would be mistaken with Eglin's party and its majority still lean on moderate progressives and what remains of it's conservative wing. But the path forward is open, and Prime Minister Eglin stands ready.\n\nSouth Africa's tale has now been told, and whatever may happen beyond this point is left up to the mists of time."

 #Very Progressive
 SAF_Colin_Eglin_hog_desc: "§YDeputy Prime Minister\nProgressive Liberalism§!\n--------------\nHaving fought on the side of freedom in the Second World War and afterwards rising through the ranks of the United Party to become minister of defence throughout the South African War, Colin Eglin is a tested veteran of both warfare and politics who nevertheless wholeheartedly advocates for a more progressive South Africa that makes constant motion towards equality for all.\n\nWith the shocking loss of the election to the progressive party, De Villiers Graaf has finally seen the light and has gracefully passed on leadership of the party to its progressive wing under Colin Eglin. A new coalition was formed shortly after, and now Eglin is finally able to see through his progressive, yet also very liberal vision for South Africa under the leadership of Prime Minister Schwarz."
 SAF_Ray_Swart_eco_desc: "§YEconomy Minister\nProgressive Liberalism§!\n--------------\nThe position of Minister of the Economy and Infrastructure was a contentious one, yet it never really threatened the cordial negotiations between Colin Eglin and Harry Schwarz. In the end, it was the Progressive Party that was allowed to fill the position and Ray Swart, a long-term loyal member of the party.\n\nA progressive lawyer who is somewhat wary of the influence of the large companies that hold great sway in the nation, which nevertheless have sided with the progressives, Swart can now start to make reforms to help tackle the great economic inequality in the nation. But what has taken decades to build up will take time to tear down once again, and with a fervently entrenched opposition, Swart's opportunities are still surprisingly limited, for now at least."

 POLITICS_HARRY_SCHWARZ_DESC: "How far hard work, fate, and a bit of luck can bring someone. Harry Schwarz came to Africa as a baby, a child of Jewish parents who had decided to leave on the eve of Adolf Hitler's rise to power. Being raised speaking only German, he faced great isolation as a youth, the memory of which stayed with him his entire life.\n\nHis parents struggled to offer him a life out of poverty. Studying on a government grant, he spent much time with his fellow student Nelson Mandela and later assisted in the (futile) defence of Mandela against his charges of terrorism. Always having been a progressive voice, the dithering of the United Party and their appeasement of the Afrikaners led him to found the Progressive Party in 1948, which long remained but a marginal force in the nation's politics until now. After winning a shocking victory and becoming the largest party in Parliament, Harry Schwarz was able to form a coalition with the United Party that would isolate both the conservatives and the Afrikaners to the opposition. As much as his opponents may rant and rave about him, Schwarz now has an open path to finally bring about that fair and equal nation of South Africa that he has long been dreaming of all his life.\n\nSouth Africa's tale has now been told, and whatever may happen beyond this point is left up to the mists of time."

