 #TLL pre-war stuff

 SAF_lean_towards_the_ofn: "Lean Towards the OFN"
 SAF_lean_towards_the_ofn_desc: "The British Empire may be dead, but its effects are still highly relevant to this day. The OFN is in most cases, the remnants of old-world governments that got destroyed or places that were simply out of the way of the German and Japanese attacks. If not that, then they were British colonies, or dominions like South Africa once was.\n\nLeaning a bit more towards the OFN can help secure more lines of American investments and improvements to our economy while the American consumer market is perhaps the biggest in the entire world. Surely, it should not be hard to sell our fine South African products to the USA after enough effort has been put into strengthening ties with the Americans."

 SAF_a_new_year_on_the_cape: "A New Year on the Cape"
 SAF_a_new_year_on_the_cape_desc: "South Africa has been in the midst of a quiet elegy since the dismal failure of the Second World War. Buoyed by waves of exiles from the fallen British Lion and wider British Empire in Africa, the United Party was able to permanently sideline the opposition. A solidified electoral coalition backs the United Party's mandate while keeping both the Afrikaners of the National Party and the Native majority of the population out of power.\n\nThe status quo of a White minority rule and extensive racial segregation, while not properly institutionalised in the form of Apartheid in technical terms, has held firm ever since creation of the nation.\n\nBut something big is brewing underneath the surface, and across the borders which will soon overturn South Africa's hallowed status quo..."

 SAF_a_party_united: "A Party United..."
 SAF_a_party_united_desc: "The United Party has been in power since 1934, though it split in 1942 into the National Party and the United Party. A liberal coalition of the Anglo population with a minority of Afrikaner figures involved the party remains firmly in charge of the nation with no real challenges to power.\n\nThat is not to say that the party is a monolith of unity, however. The United Party roughly is composed of three smaller parties. The Progressives, the Pragmatists, and the Conservatives. The Progressives under Colin Eglin and Jan Hendrik Hofmeyr seek to slowly but surely advance towards a better treatment of the Native population and to promote cooperation between the different races. The Conservatives, under Vause Raw, simply seek to continue the status quo of White supremacy, Coloured Collaboration, and Native labor for all eternity. Finally, the pragmatists are led by the Prime Minister, De Villiers Graaff who simply seeks to ensure a continuation of power and influence of the Anglo of South Africa, eager to bend and shift to whatever position is needed to keep it all going."

 SAF_a_nation_divided: "...and A Nation Divided"
 SAF_a_nation_divided_desc: "South Africa's internal divisions continue to grow day by day. Not only are the suppressed Natives continuing to organize under the African National Congress, but also more militant organizations as Umkhonto we Sizwe have begun violent sabotage and asssasination actions. On the opposite side, the Afrikaners may seem somewhat satisfied with their lot in life but that doesn't quite account for the hardliners who agitate against the Anglo government day after day.\n\nAnd lurking across the Ostafrikan border is the banned Ossewabrandwag organization led by the National Socialist Afrikaner Johannes van Rensburg, seemingly forming stronger paramillitary units. The influence of the German Reichkommisariats on the border seems to extend further into the Springbok Nation day after day. The many different peoples of South Africa are on the move, and the nation is beginning to polarize further and further with no end in sight."

 SAF_the_national_party: "In The Parliament"
 SAF_the_national_party_desc: "Since its founding in 1914, the National Party of South Africa has been the political force of the Afrikaner citizens of the nation who seek to institute a hard line on racial segregation under the name of Apartheid. Founded by J.B.M Hertzog, his son Albert Hertzog (famous for vehemently opposing the television) continues to lead the party which has been kept out of power by the United Party ever since the two parties split in 1942 and has a steady, unchanging even, voter base of all the people in South Africa which consider themselves to be Afrikaners.\n\nBut simple demographics mean that the National Party will never again win an election and the Anglo leadership in Cape Town can continue to rule unopposed, occasionally granting the National Party a win from time to time to appease them. It has become increasingly clear that the Afrikaners remain captive within South Africa unless they were to take up arms and force their independence from this nation that has chained their freedom to suppress the freedoms of others."

 SAF_the_anc: "On The Streets"
 SAF_the_anc_desc: "About a third of South Africa belongs to the privileged classes of Whites, Indians, and Cape Coloured. The other two-thirds are left without a vote or a voice and with only the worst of lands available to them. Their labor and hard work are vital to the economy that takes from them and only hands them enough to carve out a meager, but stable existence. But time carries on, and injustices that used to be normal before are becoming less and less accepted as the world slowly moves on.\n\nThe African National Congress is a banned organization that continues to win strength for the cause of national liberation of the Native population of South Africa and the establishment of a socialist state on the Cape. Its leadership continues to gain strength, with key figures such as Oliver Tambo, Nelson Mandela, and Chris Hani beginning to organize against the White supremacist government of the United Party"

 SAF_referendum_on_the_monarchy: "The Voice Of The People"
 SAF_referendum_on_the_monarchy_desc: "Due to internal and external pressure, the position of Monarch of the Union of South Africa has remained empty between 1945 and 1962, with many more people wondering what the point of this empty throne even is. Rather than picking between Elizabeth and Edward, the throne of South Africa remains empty, forever in stasis. For as long as it has existed, the National Party has sought to abolish the monarchy for good.\n\nDue to the dominant political position of the United Party, the issue has been extended indefinitely as no vote to abolish or hold a referendum would ever pass the Parliament of the Union of South Africa, until now that is. Vause Raw, the ardent monarchist and leader of the United Party's conservatives has decided that enough is enough and that a referendum should be held once and for all to shut up the endless complaints of the National Party. After all, it should be easy for the government to win this referendum, right?"

 SAF_better_call_div: "Better Call Div"
 SAF_better_call_div_desc: "De Villiers Graaff has been Prime Minister of South Africa since narrowly winning the leadership elections of the United Party in 1956. A charismatic gentleman of Afrikaner descent, he has nevertheless become the centerpiece of the United Party, and thus the government, and thus the nation. Nicknamed Div by those closest to him, he has been pushing forward with modernizing South Africa and upholding its neutrality in the rapidly intensifying Cold War at all costs.\n\nBut even he senses that the internal tensions are beginning to increase, with both the National Party and the ANC becoming ever more restless and seeking new ways to bring about their ideal version of South Africa. There is no time to wait as the 6th year of De Graaff's time in power arrives, and much will have to be done to secure the future for the continued United Party leadership of South Africa."

 SAF_law_and_order: "Law and Order"
 SAF_law_and_order_desc: "Three fifths of South Africa are the restless natives who form a cornerstone of our economy, but are shut out from gaining any of its benefits, the cornerstone of which being the de facto ban on owning land. The other third works to contain them, using their labour and stopping them from getting out of line with a harsh hand and a fine tuned policing system.\n\nWith the continued rise of the highly dangerous and subversive African National Congress, more will have to be done to ensure that law and order is not disrupted by protests, strikes, or even violence. Only United Party leadership over the wild, untamed masses of Natives will keep South Africa safe and prosperous, and with a good dose of law and order the safety of the state shall remain strong."

 SAF_bad_apples: "Bad Apples"
 SAF_bad_apples_desc: "The National Party remains ever an opponent of the good British civilization that had been so generous to grant them civilization and development. The easiest way to undermine their appeal against the monarchy is simple, to compare them to the Ossewabrandwag extremists that still persist across the border with Ostafrika. The links between the National Party and the OBW should be emphasized and connected, linking this vote to one between moderate monarchists and national socialist extremists. One bad apple ruins the batch, and the OBW's hardline approach isn't actually popular amongst most of the Boers despite the organization claiming to be the one true representative of the Afrikaner people.\n\nCertainly, calling our opposition nazis is a unique and impressive way of debating that should be frequently utilized to make it far more effective and to undermine them all together."

 SAF_between_three_eagles: "Between Two Eagles"
 SAF_between_three_eagles_desc: "Since the end of the Second World War, the world has been divided between the three superpowers, each of the three reaching beyond all world's oceans to affect matters on every single content. The clashes between Germania, Washington and Tokyo may have been reduced from open war to a battle of culture, influence, politics and economics but it rages onward without end affecting all smaller nations. While the leadership of South Africa's United Party clearly lean towards the Organization of Free Nations, the nation itself walks a path of neutrality.\n\nTrade with the German colonies to the north and technology imports from Germany's megacompanies have done much good in modernizing the nation, yet across the borders lies the exiled Afrikaner National Socialist organization named the Ossewabrandwag that reportably continues to gain strength under German supervision, the threat of which can not be underestimated."

 SAF_on_the_streets: "Reaching Out to the Afrikaners"
 SAF_on_the_streets_desc: "Afikaner politicians have been increasingly concerned about the large number of ANC activists on the streets and in our cities. The ANC's activity has been escalating in recent months and their terror attacks are getting bolder. The Afrikaners claim that the ANC is a massive danger to national security and that they must be swiftly and harshly dealt with.\n\nNow we shall address their concerns, mostly to stop the radicalist danger of the ANC, but also to assuage the incessant complaining of the Afrikaners. The police shall receive the go ahead to escalate attacks on the ANC to shut down their local organizations with a ruthless, violent approach. Let's hope that we can solve both two problems with one move on the chess board."

 SAF_the_good_ones: "The Good Ones"
 SAF_the_good_ones_desc: "The natives remain an everlasting threat to South Africa's stability and prosperity. Still in a primitive state of mind, they will need to be uplifted first before any further advancements to their lot in life (hypothetically) could be made. But as much as the more radical elements of the ANC and it's militant wing should be fought with all our might, there may be a few good ones open to a good conversation and kept satisfied with some bread crumbs and small continuous reforms that never threaten our enlightened status quo as much.\n\nWhile it may infuriate the Boers and especially the OBW hardliners, they were never going to be satisfied in the first place, so why bother? We could have some conversations with the mildest of ANC members and do the mildest of reforms to appease them for the moment. At the same time, this should strengthen our position in the short term by doing a double approach of carrot and stick to the Native problem."

 SAF_rabble_rousers: "Rabble-Rousers"
 SAF_rabble_rousers_desc: "The ANC and its ilk are communist rabble rousers. Dangerous insurgents out to disturb the peace, burn our farms and steal the great future of South Africa. No good can ever come of them, and their status as illegal should be maintained to the strictest sense. No attmept at outreach will satisfy these greedy communists, no, all that needs to be done is a harsh hand is cracking down on these wild rabble rousers who threaten to steer South Africa astray.\n\nWorking in hand with the police force and the army, the government shall strike back against the unruly crowds, restoring peace and order in the Springbok nation at any cost. There will be no place for these wild crowds to roam, they will be put back into their place with a rigid response in stead."

 SAF_in_the_hearts: "In the Hearts..."
 SAF_in_the_hearts_desc: "The African continent is in its darkest moment, especially South Africa. As Germania's arm stretches further south, the last light of democracy requires the support of its people more than ever. But, division between creeds and quarreling between partisan lines has made us weak, and so we must act now.\n\nInvoking patriotic fervor within not just the people, but the armed forces, the workers, the men and women who serve South Africa must be accomplished for us to endure against the tide of the Reich. We must remind them that liberty, and South Africa itself, is a precious thing, and must be protected at all costs.\n\nUnity is paramount to our survival as a nation. Let us make sure that everyone, no matter what affiliation, what creed, or what social class they may be, remembers that in their heart."

 SAF_gold_for_germania: "Gold for Germania"
 SAF_gold_for_germania_desc: "Outside of diamond exports gold is the other great export that South Africa has. The amount of gold mines spread around the country provide a steady amount of wealth based upon not just exports to the superpowers, but also stored in the Central Bank in Cape Town to help ensure further foreign loans by serving as a collateral for the nation's loans.\n\nWith handling exports though and South Africa's neutrality strict limits on exports have been established, sending equal amounts of gold to Washington as to Germania as a further expression of neutrality. But with the madman in Ostafrika becoming more and more relentless, it is wise to shift the balance towards the Germans, making clear the value of having South Africa as a peaceful trading partner."
 
 SAF_ig_farbens_wisdom: "IG Farben's Wisdom"
 SAF_ig_farbens_wisdom_desc: "South Africa may have plenty of raw materials to spare and the beginnings of a larger domestic industrial complex, but that complex will require more than just steel and chromium to keep going. Our shortage is in both institutional knowledge of chemistry as well as production facilities should be handled by working together with the gigantic German chemical concern to help cover this blindspot in our industrial production.\n\nWith both grand tax incentives and connections to our universities, new connections should be built up to create a grand chemical complex in East London that will end up providing us with the plastics and other specialised supplies we need while giving IG Farben a healthy profit on their investment."

 SAF_daimler_benz_finest: "Daimler-Benz's Finest"
 SAF_daimler_benz_finest_desc: "As conflicted and troubled as the German Reich's reputation may be with the wider world, no one can deny that the quality of their industrial goods is well known. Part of the biggest exports of the world are German cars constructed by the massive Daimler-Benz conglomerate which has rapidly absorbed most of Europe's carmakers into its grasp.\n\nWhile efforts have been undertaken to build up South Africa's domestic industries producing cars is still far away, and thus it would be better to facilitate imports of both German trucks to populate the extensive new road network we have been building.\n\nOn top of that, we could add on a purchase of a small amount of German infantry fighting vehicles to supplement our current numbers, mainly intended to be used against riots."

 SAF_and_minds: "...and Minds"
 SAF_and_minds_desc: "Blind patriotism is simply not enough, though. There are a growing few of the influential social class, the politicians, the intelligentsia, the administrators, who are dissatisfied with our cause for one reason or another. Some have even seen this nation as doomed, with our fate being under the jackboot of the Reich.\n\nThat defeatist mentality must be turned over immediately. We must give them assurances that we look after their best interests, and convince them to our cause, through any means necessary. A little "quid pro quo" is required, for it is apparent that before they lend us their support, that they require a couple of concessions, something more than assurances..."

 SAF_in_our_labour_lies_growth: "In Our Labour, Lie Our Growth"
 SAF_in_our_labour_lies_growth_desc: "Much of the United Party's grip on power comes from the South African economic miracle, and both the opposition and internal divisions are kept at bay as long as the line stays in the green. While there are plenty of misgivings from all sides about the Prime Minister's indecisiveness and inability to commit, no one is mistaken about the momentous growth that the nation has experienced ever since the end of the second world war.\n\nBuoyed by waves of British exiles and trade deals with the Germans and the Americans, South Africa continues a path of rigorous modernization. What is left unspoken however is that a lot of this growth lies upon the exploited cheap labour of the Native majority. There is still much more development and expansion possible, especially further inland where the hidden wealth of South Africa awaits to be found underneath the surface."

 SAF_southern_connection: "Southern Connection"
 SAF_southern_connection_desc: "The American South is a grand region, and while perhaps there are plenty of places that are not that wealthy overall there is great expertise to be found in extraction and farming that the African South could very much use. But above all, in the American South we can find people who are of a similar character to that in South Africa, of frontiersmen who turned wild lands into prosperous realms.\n\nA grand advertising campaign should be launched targeted at attracting the good people of the Southern United States to the Cape, with plots of good land in targeted regions to be granted to the new immigrants. Not to mention that with more White people arriving on the Cape our hold over the other races will become much stronger."
 
 SAF_learn_to_read_and_write: "The Cape's Brightest Minds"
 SAF_learn_to_read_and_write_desc: "Only the White population of South Africa is mentally capable enough to handle the highest level of education and advancement. This is how it always has been and always will be. Every White citizen, no matter how poor and not well socially connected his or her parents are, should be permitted to study at a South African university without encurring debt, enabling the Whites worthy of academic pursuits the opportunity to rise higher.\n\nIn this way, equality of outcomes (within the White population) shall increase, and more highly educated Whites will assist in leading the other races of the Nation towards a better future."
 
 SAF_transvaal_mines: "Transvaal's Mines"
 SAF_transvaal_mines_desc: "While efforts are underway to highly diversify and modernise the South African economy the foundation of much of our exports and thus our wealth is in mining. Diamonds, Iron, Chromium and of course Gold are extracted from the ground, transported to our ports and shipped off to the world markets that are ever greedy for natural resources. In return, knowledge and modern equipment is imported that will form the foundation for a better future based upon a better developed economy.\n\nBut for now, the first step to greater economic progress is to further the extraction of mineral resources and to intensify the search for further deposits of valuable materials. South Africa is a vast land, and somewhere out there there will be more wealth waiting underground, waiting for the first excavators to arrive and dig up the treasures underneath."

 SAF_natals_naval_yards: "Natal's Naval Yards"
 SAF_natals_naval_yards_desc: "South Africa's rail and road connections may have expanded greatly since the end of the Second World War, but our nation still lacks a proper mercantile fleet. Our reliance upon our inherited fleet from the British empire has left us with a rapidly ageing fleet of ships and crews that are left uncompetitive overall in the modern shipping environment.\n\nBy granting subsidies for our less developed dockyards and tax relief specifically for domestic shipping conglomerates, great strides can be made in the state of our trading fleets. To top it all off, smaller shipbuilding and shipping companies should be nudged towards fusing into greater entities to remain competitive on the world's markets."
 
 SAF_a_happy_smile: "A Happy Smile"
 SAF_a_happy_smile_desc: "Unlike the horrific colonies to the North, South Africa is an enlightened nation that does seek to take care for its lesser fortunate peoples. If discontent is allowed to grow, strikes and riots would follow and the power of the communist malcontents and ANC rabble rousers would expand quickly.\n\nA greater fraction of the budget will be directed towards the matter of healthcare, to keep our working class working and to hopefully put a smile on their face, content with their lives as they are now. And if that doesn't really work, perhaps it could at least quiet the unrest for a good while."

 SAF_the_defense_bill: "The Defense Bill of 1963"
 SAF_the_defense_bill_desc: "Now that we have looked after our domestic and economic issues, perhaps it is time we revisit the neglected public sector, the military. Having gained a major boost by the exiled ships and planes from the British Empire, the military has not been a major priority since the end of the 40's However, the recent increase in tensions with Ostafrika have pushed the United Party to take action to improve our deterrence through military power.\n\nA comprehensive bill shall be assembled to tackle issues within the military with extensive funding for both our land, air, and naval forces to further dissuade the Germans up north from beginning a new conflict. Surely heavy enough deterrence should work in ensuring a lasting peace in Africa."

 SAF_the_legacy_of_britain: "The Legacy of Britain"
 SAF_the_legacy_of_britain_desc: "Despite her defeat in the Second World War, Britain's legacy still remains alive amongst the South African Navy which is its direct inheritor. Extensive remnants of the Royal Navy escaped to South Africa, where they found refuge far beyond the reach of the continuous expansion of the Axis powers.\n\nThese warships still remain afloat in our waters seventeen years later. Her officers, aged and experienced in exile, now serve the Union of South Africa. The British Empire may be gone, but South Africa still proudly carries on it's legacy in Africa. With an experienced core and a well sized inheritance in ships, new funding should help revitalize the South African Navy into a competent, somewhat modernized force."

 SAF_lesson_from_the_atlantic: "Lessons from the Atlantic"
 SAF_lesson_from_the_atlantic_desc: "Submarines have been the scourge of the seas, especially the German U-boats which wreaked havoc on our convoys in the seas across the Atlantic during the second world war. Based on the experiences of our naval commanders and the use of sonar, anti-submarine mortars and convoy tactics South Africa should focus on securing its international connections to the wider world.\n\nWith such a massive amount of our imports being delivered by sea, and the path around Cape being an essential global trade route between both halves of the world, mastering anti-submarine warfare can keep vital supply lifelines open in case of conflict."

 SAF_the_cruiser_question: "The Cruiser Question"
 SAF_the_cruiser_question_desc: "Ever since the introduction of battlecruisers onto the vast oceans of the globe, nations have used them as a way to supplement firepower on land, without investing the excessive strain on resources to build clearly oversized battleships and dreadnoughts which quickly fall to the overpowering might and reach of naval aviation.\n\nCruisers have proved to be a cheaper way to replace heavier ships, whilst retaining naval range and superiority, without the significant loss of firepower and increased speed. Providing not just anti-ship firepower but also the ability to provide vital firing support to troops fighting along the shore, a modern cruiser force would be great in further deterrence."

 SAF_a_green_water_navy: "A Green Water Navy"
 SAF_a_green_water_navy_desc: "South Africa may stand alone in it's neutrality, but this also means that its navy does not have to reach too far. To patroll her own waters and guard her own shores, and not need to reach beyond that. A navy finally moving on from the the 40's into the modern age, utilizing the newest advances in naval technology to make a shining green water navy. While there is much to be done, the South African Navy proudly sails around the Cape down to Prince Edward island.\n\nWhile the unthinkable is still far away, if there ever were to be a conflict South Africa will be ready for it."

 SAF_every_man_a_gun: "More Men in Uniform"
 SAF_every_man_a_gun_desc: "The increasing tensions between us and the German Reichskomissariates have increased calls for modernizing every aspect of our military. While equipment improvements and modernization of both our navy and air force are a good start, nothing of that holds any relevance as long as there are no soldiers to provide the manpower our modern military needs.\n\nAmongst the various needs to shore up our national defence, the key aspect is to expand the standing force and swell the reserves with new conscripts, ensuring that manpower needs are met in the unlikely case of a crisis."

 SAF_masters_of_ours_skies: "Masters of Our Skies"
 SAF_masters_of_ours_skies_desc: "No army can achieve victory without an airforce. The South African Air Force traces its history all the way back to the First World War where General Jan Smuts set up domestic training of pilots and laid the groundwork for the future of South African Aviation. Like our navy, the influx of airplanes from the RAF by the end of the war brought to South Africa an experienced core of airmen with experience, faced with only modest ground infrastructure.\n\nWhile we have decent enough ground infrastructure for the SAAF more can be done to set up the ground compartment of our aerial supremacy, through expanded radar and anti air positions. Finally, new airports and training facilities will need to be constructed around the nation to help modernize South African millitary aviation and truly make us the masters of our own skies!"

 SAF_new_pilots_jets: "New Pilots, New Jets"
 SAF_new_pilots_jets_desc: "The Royal Air Force may have fallen however her experience has been passed on in a proper fashion. Lessons such as the need for extensive pilot training and keeping up to date with aircraft designs have not been neglected but funding for modernization of our air force has been historically mild at best.\n\nAs our flying aces of yesteryear reminisce flying in Spitfires and Hurricanes and scrambling in a moment's notice to defend Britain, a new generation of domestically born pilots will bear the torch in their place with their new jet aircraft, ready to do the same as their forebears this time in defence of South Africa"

 SAF_no_main_benefactor: "No Main Benefactor"
 SAF_no_main_benefactor_desc: "Our neutrality remains paramount, despite our strong cultural and linguistic ties to the Organization of Free Nations. Rather than purchasing American weaponry at a premium, it is better to spread out our purchases of arms amongst various different nations while at the same time granting contracts to our various domestic suppliers on top of that. Balancing these different types of weapons and ammunition will be a chore for our maintenance staff - however, that is far less imporant than maintaining our neutrality in the world's affairs."

 SAF_liberty_comes_with_bullets: "Liberty Comes With Bullets"
 SAF_liberty_comes_with_bullets_desc: "America is the last bastion of freedom on this earth, and while neutrality was a healthy position for South Africa to take, everyone knows that the United Party heavily favours the Organization of Free Nations over the Unity Pakt in all matters. Neutrality only ever was a position taken to appease the Boers and the Germans who now controlled most of Africa\n\nWhile it will be more expensive then obtaining weapons from various different suppliers, buying from Uncle Sam brings political benefits as well as reducing overhead for our maintenance crews. South Africa's friendship with the Americans has been slightly strained since the end of the war, and this can help us bring more influence in Washington as well as a good source of millitary equipment of all kinds."

 SAF_speed_as_a_substitute: "Speed as a Substitute"
 SAF_speed_as_a_substitute_desc: "While it may not always be as visible on a map Africa is a gigantic continent often misrepresented by different projections. South Africa is a vast land, and the Reichskommissariats are simply massive in scale. While the power and armour of a tank is a great combination, plenty of manoeuvrable open terrain means that speed can become a true force multiplier.\n\nLeaning into mechanized units, modern armoured cars and infantry fighting vehicles can lend our troops an increase in speed, trading armour for sheer speed and offroad manoeuvrability that can enable the SADF to strike and move with great speed and when the enemy strikes back our forces will have been long gone, out cruising the steppes looking for their next target."

 SAF_the_real_deal: "The Real Deal"
 SAF_the_real_deal_desc: "Tanks have always been essential to warfare ever since the end of the First World War, punching through defensive lines and outmanoeuvring enemy formations to lead towards a decisive defeat. There is no real substitute for a modern line of main battle tanks in providing a key element of the South African Defence Force.\n\nInvesting in upgrading our current tank force as well as laying the future groundwork for a proper modern tank design that can be produced domestically should provide us with not just short term improvements, but a healthy long term path towards the future of armoured warfare."

 SAF_our_bastion_north: "Our Bastion North"
 SAF_our_bastion_north_desc: "Bechuanaland lies on the frontline, surrounded on all sides but south by the Reichskomissariates. In such circumstances a proper frontline defence of the entire region is quite simply impossible in the case of a conflict. Therefore, the best option that can be pursued is to fortify the reigon around the capital of Bechuanaland, Gaborone.\n\nWhile supporting our local Bechuanaland troops can help, it can not make a difference if they are in fact able to hold a more fortified position in key locations. Our bastion north shall stand firm, keeping both the ANC and the OBW out of the region entirely."

 SAF_the_revolutionary_war_doctrine: "The Algerian War Doctrine"
 SAF_the_revolutionary_war_doctrine_desc: "A deal with the Germans would be entirely off the table, but perhaps we could speak with the French in stead as a sort of proxy. The French have had plenty of experience dealing with counterinsurgency fighting in Algeria as well as experience fighting in the deserts. In the case of a hypothetical conflic with the Germans (which is deeply unlikely to happen, the colonies are swamped in inner conflict) combat in the desert would definitly be involved, and thus it might be worth sending over a few officers over to Algiers to learn the ways of dealing with countering insurgents as well as a hypothetical enemy in the desert. "

 SAF_star_spangled_officer_corps: "Star-Spangled Officer Corps"
 SAF_star_spangled_officer_corps_desc: "Why would we even pretend as if we are entirely neutral? The Germans know it, the Japanese know it, our natural and true alignment is with the United States of America, and we shouldn't be concerned about the repercussions of further expanding ties with America. Connections with the Americans should be expanded, especially in education of our up and coming officers who should be sent off en masse towards West Point and Langley to learn how the Americans do war. While our strategies will remain our own, there is no harm in gaining experience of different perspectives.\n\nAs for the Germans, we will simply let them know that we have always been in open contact with the Americans and it doesn't indicate any further drift of South Africa into the American sphere, we have the SADC after all."

 SAF_between_two_eagles: "A Tri-Polar World"
 SAF_between_two_eagles_desc: "The interests of Germany and America in South Africa go far back with Kaiser Wilhelm backing the Afrikaners in their struggle against the British Empire. While it has been sixty years hence and the Union of South Africa has been thriving ever since the end of the Boer Wars the connection between the Germans and the Afrikaners have grown, personified by Johannes van Rensberg, the most ardent pro-German Afrikaner hardliner in exile in Ostafrika.\n\nOn the other hand, the American influence in South Africa lies mainly on the Cape, where the sentiments lean strongly towards the long gone British Empire and the wider Commonwealth of Nations, yet the realities of the balance mean that the government has moved towards holding up a strict policy of neutrality, leaving the nation to balance in between the two very hungry eagles that tower over South Africa.\n\nFinally, there is Japan, far away but still relevant to South Africa. Attempts to reach out to the Co Prosperity Sphere could help with opening new markets to export to and of course, the ability to import industrial goods to further push our national modernization plan."

 SAF_black_boots: "Black Boots"
 SAF_black_boots_desc: "As much as there are strong disagreements with the German colonies in the north, we share a common enemy. The communists and pan Africanists make impossible demands for political and economic equality between the races which would surely lead South Africa into a ruinous period of chaos. Our slippery opponents make use of the massive land border between our nations to move back and forth, evading detection.\n\nA mutual intelligence agreement between us and the Reichskommissariats will help stamp out the rebel forces and political organisers near the borders by making it much harder for them to continue evading detection. As long as the matter stays quiet, much good will be achieved in preserving law and order."

 SAF_green_dollars: "Green Dollars"
 SAF_green_dollars_desc: "Keeping the trade flowing is vital, and cosying up with the Americans seems like a good next step. The time has come to visit Washington and try to make deals with the Americans, the main purpose of which is to lower the American tariffs on South African diamonds.\n\nOf course, on our side we will have to return the favour by agreeing to exclusively equip the South African Defence Forces with American equipment. While of good quality and well renowned, American equipment is more expensive then it would be buying from other neutral nations. Still, it would be a price to pay for being able to further corner the American market on diamonds and bring back the greenbacks to the Cape."

 SAF_our_enemies_closer: "Imperial Counterterrorism"
 SAF_our_enemies_closer_desc: "Ever since the Japanese Empire conquered most of Asia they have been fighting a relentless, eternal war against rebels of all sorts and kinds. Across varied terrains and in many different countries the armies and secret police of the Co-Prosperity Sphere reign with an iron hand, upholding law and order.\n\nCooperation with the Japanese intelligence services and learning from these techniques could help with keeping down the ANC and eventually working towards the complete dismantlement of these wild rabble rousers. While both the Germans and Americans will be displeased with our cooperation, we are a neutral force in the Cold War and can make deals with whoever we would like."

 SAF_bygone_empire: "Gold for Germania"
 SAF_bygone_empire_desc: "Outside of diamond exports gold is the other great export that South Africa has. The amount of gold mines spread around the country provide a steady amount of wealth based upon not just exports to the superpowers, but also stored in the Central Bank in Cape Town to help ensure further foreign loans by serving as a collateral for the nation's loans.\n\nWith handling exports though and South Africa's neutrality strict limits on exports have been established, sending equal amounts of gold to Washington as to Germania as a further expression of neutrality. But with the madman in Ostafrika becoming more and more relentless, it is wise to shift the balance towards the Germans, making clear the value of having South Africa as a peaceful trading partner."

 SAF_millitary_nazi: "Daimler Benz's Finest"
 SAF_millitary_nazi_desc: "As conflicted and troubled as the German Reich's reputation may be with the wider world, no one can deny that the quality of their industrial goods is well known. Part of the biggest exports of the world are German cars constructed by the massive Daimler-Benz conglomerate which has rapidly absorbed most of Europe's carmakers into its grasp.\n\nWhile efforts have been undertaken to build up South Africa's domestic industries producing cars is still far away, and thus it would be better to facilitate imports of both German trucks to populate the extensive new road network we have been building.\n\nOn top of that, we could add on a purchase of a small amount of German infantry fighting vehicles to supplement our current numbers, mainly intended to be used against riots."
 
 SAF_economic_nazi: "IG Farben's Wisdom"
 SAF_economic_nazi_desc: "South Africa may have plenty of raw materials to spare and the beginnings of a larger domestic industrial complex, but that complex will require more then just steel and chromium to keep going. Our shortage is in both institutional knowledge of chemistry as well as production facilities should be handled by working together with the gigantic German chemical concern to help cover this blindspot in our industrial production.\n\nWith both grand tax incentives and connections to our universities, new connections should be built up to create a grand chemical complex in East London that will end up providing us with the plastics and other specialised supplies we need while giving IG Farben a healthy profit on their investment."
 
 SAF_the_mutual_friendship_compact: "Communicating with the Commonwealth"
 SAF_the_mutual_friendship_compact_desc: "America is the great power of the OFN, yet the nations of Australia, New Zealand, and Canada can become vital parts of our a balanced economic strategy. While we have not yet joined the Commonwealth, we should do our best to establish personal contacts in these countries, hoping that this kinship will help secure trade deals and cooperation.\n\nAt the same time, our links to the British empire should be remembered and honored, while still keeping an appropriate distance for the sake of upholding our neutrality. Let the names of those who died while defending the Orange-White-Blue flag be etched into marble, and granted a most honorable resting place"
 SAF_the_mutual_friendship_compact_countries_tt: "(§Y[AST.GetFlag][AST.GetName]§!, §Y[CAN.GetFlag][CAN.GetName]§!, §Y[NZL.GetFlag][NZL.GetName]§!, §Y[WIN.GetFlag][WIN.GetName]§!):"

 SAF_uncle_antonio: "Uncle António"
 SAF_uncle_antonio_desc: "Iberia is the fifth great power, and its reach goes all the way from Europe to across the African continent. One of the only remaining relevant colonial powers, Spain and Portugal hold respectable influence in Africa, and even more so combined as the Iberian Union. With the belligerent Germans threatening the security of their colonies, and the deteriorating relations with Rome, Iberia has slowly turned to Washington, and their alignment is something that we can benefit from.\n\nSouth Africa and Iberia can be argued to be similar in their goals; to distance themselves from Europe's new order. Cooperating with the Iberians can help us in achieving greater national security and economic independence from the Pakt, and perhaps it is time we take advantage of these shared sentiments to pursue warmer relations with the Iberian Union, however annoyed Germania will be."

 SAF_tying_up_loose_ends: "Tying Up Loose Ends"
 SAF_tying_up_loose_ends_desc: "The economy is growing rapidly, the ingrates in the ANC are dealt with, and the incursions by the OBW have been clamped down upon. De Villiers Graaff can look back with satisfaction at his consensus building defence of the status quo. Matters externally have been dealt with, and now the time has come to start dealing with the growing clash within the party\n\nIt seems that not even the successes and growth brought under Graaff's leadership can calm the two hotheads of the party. Vause Raw, head of the staunch conservatives and Colin Eglin, the up and coming leader of the liberal faction of the United Party continue to clash on the direction of the party and how the Native peoples should be treated with any degree of reform wanted by the liberals shut down by Raw's conservatives. It is time for the Prime Minister to step and find a healthy compromise on this difficult matter, one which will satisfy neither side, but be acceptable to both."
 

# SAF_work_with_tribal_elites: "Work with Tribal Elites"
# SAF_work_with_tribal_elites_desc: "Divide and conquer has always been a foundation of stable government, especially one outnumbered two to one by the locals. The ANC seeks to unite all Native peoples under their banner, a monolith of Black power that will march on Cape Town and force the good people of South Africa to institute the horrid system of communism. But there is still a good opportunity to divide the Natives in between themselves, by appealing back to the older divisions within.\n\nWorking with the Tribal elites, we can try to foster beneficial cooperation between these leaders while further emphasizing tribal identities. Soon enough they will be clashing again like old, tribes clashing with tribes, and the ANC will not be able to unite a critical mass, making them vulnerable to being broken up themselves."

# SAF_enforce_native_homelands: "Enforce Native Homelands"
# SAF_enforce_native_homelands_desc: "The so-called Homelands are part of a system of segregation that keeps large groups of natives on their assigned lands (these lands easily being the worst regions of land in the nation). But the promise of a better life continues to draw more and more Natives towards the cities of South Africa, bringing crime and trouble along with them. So far, the enforcement of these Homelands has been lax, but the line in the sand will have to be drawn.\n\nThose who find themselves in the cities will have to properly identify themselves, and those who refuse or have no identification will be transported back to the closest homeland to prevent a critical mass of Natives from forming. Only a strict line on this policy will ensure a stable future for South Africa."

 SAF_expand_the_prison_networks: "Expand the Prison Networks"
 SAF_expand_the_prison_networks_desc: "The United Party has invested much in upholding law and order in the Springbok nation, guarding against those who would even slightly threaten the eternal status quo. But with the unrest within the nation steadily growing, an extension to our networks of prisons and detainment cells nationwide will have to be expanded to meet the expanding need to contain troublemakers.\n\nWith new prisons built nationwide, no criminal shall escape justice! Those who stand in the way of peace and prosperity will be removed from society, to protect the stability of our nation. Not to mention the chilling effect that our new prison network will have on those who would seek to protest and cause trouble in the first place."

# SAF_reinforce_the_police: "Our Boys in Blue"
# SAF_reinforce_the_police_desc: "While building prisons can help, it is the constable in the field that makes all the difference in upholding peace around the nation. While the police in South Africa have been well funded and staffed with both White and Coloured citizens, things can always be always better.\n\nHigher standards should be demanded of the entire system of policing, and new forms of training should be instituted nationwide to quickly break up riots and strikes. Rigid discipline, trained riot police, and further funding should help keep criminals and Natives alike in line."

# SAF_prison_labor_benefits: "Servitude Paramount"
# SAF_prison_labor_benefits_desc: "Putting people in jail protects people from society, yet it remains a financial burden on the state. Thankfully the new Prison Labour Act will ensure that those who have fought against law and order will be forced to repay their debt to society by being forced to work in prison.\n\nThis new pool of labor is even cheaper than the Natives and hopefully teaches those who had strayed from the status quo the benefits of hard work. Best of all, these workers cannot strike, nor seek to find employment elsewhere, ensuring a steady supply of cheap working hands for our expanding industries."

# SAF_import_heavier_equipment: "Import Heavier Police Equipment"
# SAF_import_heavier_equipment_desc: "The ANC lurks in the shadows, organizing its military wing under the name uMkhonto weSizwe, or Spear of the Nation. With the threat of sabotage, riots, and expensive strikes, the police will have to be strengthened not just with training but also with equipment. A degree of militarization will do the police well, and with that comes new equipment that originally was intended only for use by militaries.\n\nNew police cars, and better-equipped armored cars combined with modern support equipment can help coordination and organization and help the police move around much quicker than they could before. When there is unrest, the South African police will be swift in arriving, and even swifter in cracking down and beginning mass arrests."

# SAF_expanding_racial_bureaucracy: "Expanding Racial Bureaucracy"
# SAF_expanding_racial_bureaucracy_desc: "The division of races in South Africa remains a bureaucratic process. People will have to be registered, and given identification, and the movement of people will be logged properly. Through the bureaucratic process, control over the Native people of South Africa is categorized, structured, and enforced. Benefits are granted and taken according to the system of collaboration with the current government, and those who try to change things are kept in place by a machine consistent with paper and red tape.\n\nA further expansion of the system of racial bureaucracy will help keep the status quo. More bureaucrats, more layers of organization, more red tape and confusion for the Natives, and more control shall be guaranteed with every Rand invested in new government offices nationwide"

# SAF_africas_brightest_star: "Africa's Brightest Star"
# SAF_africas_brightest_star_desc: "Africa is a large continent, but it is a continent enslaved by the Germans, by the Italians, by the Iberians, and by local dictators. Only in South Africa is the democratic tradition upheld and the wealth of the nation more equally spread around than in the rest of despotic Africa (excluding the Natives, of course). With a free press, a well-educated population and the right of ownership enshrined in the constitution South Africa is a liberal nation (excluding the nationwide segregation, of course) and a booming economy as trade with all three superpowers exports the mineral wealth of the nation and imports machinery and modernization.\n\nMuch of the United Party's grip on power comes from this economic miracle, and both the opposition and internal divisions are kept at bay as long as the line stays in the green. There is still much to win and much to develop, especially deeper inland where the hidden wealth of South Africa awaits to be found."

# SAF_intensify_extraction: "Harness The Riches Below"
# SAF_intensify_extraction_desc: "While efforts are underway to highly diversify and modernize the South African economy the foundation of much of our exports and thus our wealth is in mining. Diamonds, Iron, Chromium, and of course, Gold are extracted from the ground, transported to our ports, and shipped off to the world markets that are ever greedy for natural resources. In return, knowledge and modern equipment are imported that will form the foundation for a better future based upon a better-developed economy.\n\nBut for now, the first step to greater economic progress is to further the extraction of mineral resources and to intensify the search for further deposits of valuable materials. South Africa is a vast land, and somewhere out there will be more wealth waiting underground, waiting for the first excavators to arrive and dig up the treasures underneath."

# SAF_investing_in_our_ports: "Harvest The Riches Above"
# SAF_investing_in_our_ports_desc: "As we have learned from the British empire, the ports and sea lanes provide the key connection to the developed economies of the world as trade provides the biggest underpinning of our national wealth. While road and rail networks leading to the shores of South Africa have been well developed and expanded, our port facilities themselves have begun to fall behind.\n\nA new round of subsidies and private investments should be prepared to modernize not just the port of Cape Town, but also Port Elizabeth, East London, Durban, George, and even the small port in Port Nolloth will all be expanded with modern equipment and new staff training, as well as better connections to the national transport networks ensuring that the flow of goods in and out of the nation is no longer impeded."

# SAF_invest_in_coloured_education: "Education For All"
# SAF_invest_in_coloured_education_desc: "The Coloured and Indian population of South Africa has widespread access to a high school education which helps them fit in the middle of the societal pyramid in South Africa. In a feedback loop between the United Party and the Coloured population of South Africa, the people have gotten access to rights and chances that the Native population can only ever think of while continuing to vote UP and uphold the racial pyramid of inequality.\n\nBut among these populations, there are still individuals who would be suited to rise even higher, and they should be granted the opportunity to pursue studies at a university level. By establishing and investing in a series of universities purely for the Coloured and Indian population of South Africa we can further improve the workforce's level of education without risking them getting too many rebellious thoughts and causing issues down the line."

# SAF_public_universities_for_whites: "South Africa's Finest"
# SAF_public_universities_for_whites_desc: ""
 
# SAF_attract_further_settlers: "Attract Further Settlers"
# SAF_attract_further_settlers_desc: "Demographics are a force of their own, and as long as the number of Natives does not continue to rise in proportion to the proper citizens of South Africa proper control will be guaranteed. While we are not part of the OFN, we are free to try and attract more White immigrants with extensive advertisements in the whole Organization of Free Nations.\n\nBy both giving out free land and even paying for the trips and freely sorting out all the bureaucracy for these new immigrants, we can help shift the demographics of both the nation and the voting public in our favor. And if needed, we can even be generous and let in some decently educated immigrants from India, after all playing them against the Native population shouldn't be a problem."

# SAF_national_tourism_campaign: "A National Tourism Campaign"
# SAF_national_tourism_campaign_desc: "The age of mass tourism has arrived, and South Africa is sitting on a metaphorical goldmine (in addition to the real ones). With a mild climate, incredible nature, and views of all kinds, the call for safari and the welcoming, well-developed cities on the shoreline will form an irresistible temptation to wealthy tourists from both the OFN and other, neutral countries. The formation of a large tourism industry should be established through two types of intensive efforts.\n\nFirst, the establishment of new airports and fuel subsidies for airlines which connect us to the wider world to bring down the price tourists pay to come to South Africa. And second, much effort should be put into organizing large tourism campaigns in selected nations in both the OFN and neutral nations all aimed at drawing the wealthiest of tourists to South Africa, who will be happy to spend on an exclusive vacation to the pearl of Africa."

 SAF_rerouting_rivers: "Subsidise Irrigation Networks"
 SAF_rerouting_rivers_desc: "Diversifying the economy from extraction to agriculture may not seem like much of a change, but South Africa has plenty of arable land and potentially arable land that can become as much of a resource as the diamonds in the ground. With several rivers flowing through our lands and suitable climates for a variety of crops, the potential for further agriculture and farms inland remains high.\n\nBut to achieve that, the first need is to handle irrigation to distribute both rain and river water to the arable lands of South Africa. With dams, canals, and other aspects of water infrastructure secured the new farms will provide the basis for fantastic harvest after harvest."

 SAF_the_roads_to_wealth: "The Roads to Wealth"
 SAF_the_roads_to_wealth_desc: "The foundation of any economy is infrastructure. The greater the capacity to move goods and people around the nation and to freely import and export the richer the nation becomes. All roads in South Africa connect to Cape Town, but outside of the major cities inland, the connections in the inner region of South Africa could be much better.\n\nThe Great African Road project will open even the smallest village inland to the magic of asphalt roads and the logistic miracle of trucks connecting them to the wider nation. The more interconnected the inland of South Africa is, the more opportunities open up both for the local inhabitants and the adventurous entrepreneur who stands ready to invest deeper in the inner regions of the Springbok nation."

# SAF_a_fine_balance: "A Fine Balance"
# SAF_a_fine_balance_desc: "South Africa is officially neutral, though it is widely (unofficially) apparent that it leans somewhat towards the OFN. Still, trade with the German colonies to the north and the European mainland remains a key facet of the South African export economy, not to mention trade with neutral nations and even the Co-Prosperity Sphere.\n\nComing with this neutrality is the need to balance the interests of all nations that South Africa trades with. This will ensure that while most will be displeased that South Africa is not on their side, these nations will continue to trade and invest in South Africa."

# SAF_reassure_the_americans: "Reassure the Americans"
# SAF_reassure_the_americans_desc: "The American stance towards South Africa has always been one of friendship, trying to pull it into the OFN through both trade and societal links. Outside of the Boers, the vast majority of the South African voting public leans somewhat or even strongly towards friendship and even alliance with the Americans, the sole superpower of the Free World.\n\nBut we continue to develop relationships with both of their rivals, and Germania and Tokyo both have a diplomatic and economic presence within the nation which irks the United States to no end. While publicly the nation remains adamantly neutral, below the table the intelligence cooperation with the Americans is quite extensive, and through these hidden channels, we can assure the government in Washington that South Africa would never act against their interests."

# SAF_and_the_germans: "Appease the Germans"
# SAF_and_the_germans_desc: "The hot breath of the National Socialist menace has always breathed down our neck ever since the end of the Second World War. The barbaric Huns had conquered Europe, and through shrewd diplomacy and inheriting much of the British empire South Africa was able to preserve its independence whereas most of Africa became axis colonies.\n\nWhile the Boers have continued to have warm relations with the Germans, the government in Cape Town is only interested in keeping things lukewarm and pragmatic. Eager to keep open the trade lanes to Europe and eager to keep the exports of raw materials and imports of manufactured goods going uninterrupted, yet unwilling to go any further than that. All along, the relationship has been based upon appeasement, ready to break at a moment's notice once it becomes too inconvenient for Cape Town"

# SAF_trade_links_with_neutral_nations: "Trade Links with Neutral Nations"
# SAF_trade_links_with_neutral_nations_desc: "The great advantage of neutrality is that you can trade with all blocks without ever becoming too reliant upon a single one. Due to our central location in the world and the value of our gold and diamond exports, many nations are willing to trade with us. Day after day, ships from distant lands come to the shores of South Africa and link the mines inland with wealthy customers abroad.\n\nWhile the unaligned nations of the world may not be the greatest of economies, they are still valuable trading partners with which we should invest in further diplomatic ties which can only ever help with extending the vast trading network that has South Africa at its heart."

 SAF_my_friend_pedro: "My Friend Pedro"
 SAF_my_friend_pedro_desc: "In South America, the nation of Brazil is the biggest economy around, and like us is also neutral, yet slightly aligned with the OFN. It is also an economy with an abundance of natural resources that are extracted and then exported to the world's markets. But they are also in the process of industrializing, and there are still resources that they lack that South Africa can provide.\n\nWhile the Argentinians may be dismayed by our diplomatic approach to Brazil, it still remains the move that makes the most sense to expand the trade links with them. The increase in trade will not be significant yet, but the more Brazil industrializes, the more South Africa will benefit from exporting to it."

# SAF_looking_east: "Looking East"
# SAF_looking_east_desc: "The Republic of India is the most populous of neutral nations, containing a vast population and large amounts of land. While its development has not yet taken a great leap, its massive population means that there is a critical mass of development that makes it a nation worth trading with and talking to.\n\nThe other advantage is the connection through the collaborationist Indian minority in South Africa which we can choose to grow somewhat without causing further issues. By bringing over their distant relatives of our people and hopefully also many educated Indians the ties between our nations can become unbreakable, while also providing a new and compliant workforce."

 SAF_no_shame_in_that: "Talking to Tokyo"
 SAF_no_shame_in_that_desc: "The Germans and the Americans are directly and deeply involved in South Africa's affairs, while the third superpower remains distant by geography and by trade volume. It is time to take a new step in improving this relationship with the Far East and to try and establish connections with the wider Co-Prosperity Sphere. The first step to that is to send our foreign minister, Marais Steyn to establish personal contacts there.\n\nWhile geography dictates that the trade between our lands may never end up massive, the more customers there are for our goods, the more we benefit. And it isn't like the two superpowers hanging over us can do anything about us, after all, we are a neutral nation, and always will be!"

 SAF_the_african_dirty_war: "Greetings from Guangdong"
 SAF_the_african_dirty_war_desc: "Following Steyn's visit to the Home Islands, the logical choice is to visit the "nation" of Guangdong. A corporate state carved out of the Chinese mainland, it is an artificial state where the Japanese electronics companies have their personal playground, and the corporations fully dominate the state. But this state is ever greedy for natural resources, and its exports are the kind of high-quality electronics and equipment that we need to continue the national modernization plan laid out by the Prime Minister.\n\nSteyn will do his best to make contact with key business figures, offering them access to a wealth of mineral resources that will keep the factories in Koshu running and at the same time promising them a quickly upcoming market of companies and consumers on the southern tip of Africa"

 SAF_the_iron_arteries: "The Iron Arteries"
 SAF_the_iron_arteries_desc: "The train connections in South Africa have expanded from simple connections inland to extensive connections spreading further and further across the land. The mineral wealth of South Africa flows from the deep inland mines all the way down to the coast to secure export to the world's markets. With the importance of the coastal regions increasing with the arrival of the British exiles, a new coast line has been constructed that will run along the entire coast from Springbok to Richards Bay\n\nBut more can be done to faciliate connections deeper inland to ever increase the flow of goods and people and thus help facilitate further economic development like railways always end up doing. With an extensive rail network our ability to grow will be limitless!"

# SAF_our_australian_brothers: "Our Brothers in Australia"
# SAF_our_australian_brothers_desc: "Maybe it is best to balance out our geopolitical needs with a visit to the land down under. A strong member of the Organization of Free Nations and not to mention a brother nation to the righteous Anglo peoples of South Africa, a visit to Canberra is the logical choice for a continuation of Steyn' trip in the Far East.\n\nNot only can we spend time there placating the OFN but further trade relations with everywhere and anywhere will always be good to pursue. The distance between Australia and South Africa is not that vast compared to the alternatives, and soon enough plenty of ships will travel through the empty region of the Indian Ocean."

# SAF_south_africa_vs_the_world: "South Africa Versus the World"
# SAF_south_africa_vs_the_world_desc: "The Springbok is nothing if not a nimble animal, able to move rapidly across the steppes and jump high into the air to show its strength to possible predators as a difficult target to hunt. Like its national animal, South Africa has been all over the earth to make contacts and to set up trade deals with various nations increasing its profile as a stable and safe haven for trade and investment.\n\nRegardless of what internal strife there is to be found in South Africa, things are going great internationally. And as we all know, the good times never end and the party goes on, and on!"

# SAF_in_defense_of_unity: "In Defense of Unity"
# SAF_in_defense_of_unity_desc: "The internal unrest that is gripping the nation seems to continue unabated. Our national Unity, and thus our prosperity is under threat by the ever more rebellious Boers and the communist usurpers of the ANC. The smuggling activity on the German border seems to increase while Hertzog's tone in Parliament grows ever more militant as a response to the permanent sidelining of the Boers.\n\nFurther internal actions will have to be taken to try and appease the Boers, while all avenues of protest of the ANC will be restricted or even taken away altogether. While most of the United Party is no fan of this degree of authoritarianism, everyone is well aware of the destabilization that has developed over the last year. Once more, into the breach to defend South Africa."

# SAF_cracking_down_on_militias: "A Firm Gesture"
# SAF_cracking_down_on_militias_desc: "The apparent increase in militia activity and training amongst the Boers has increased. Under the name of "upholding local law and order" widespread Boer militias have taken up arms and begun training. In some sense that would not be as bad as these groups can help enforce order in more rural regions, but it continues to be a dangerous undermining of the United Party's authority.\n\nWith reducing the right of private gun ownership and a ban on the formation and training of militia troops, it is sadly true that the entire thing will not be stamped out for good, for the Boers will continue to find a way around this ban. Still, it should be made clear that vigilantism will not be tolerated any longer."

# SAF_loyalist_militias: "A Lenient Hand"
# SAF_loyalist_militias_desc: "Two can play that game, and this fire will be fought with another fire. The matter of the Boer militia can't just be reversed with a new law that would bring in new restrictions on these armed groups.\n\nOur only option that will achieve success is to sponsor our own Anglo militias whose presence will put up pressure on the Boers and the ANC alike. Should there be any local troubles, the locals will know best how to handle them. With the increasing tension on our Northern border, it is best to be prepared for the worst."
 SAF_loyalist_militias_tt: "§YSix Militia Divisions will be raised at Western Cape§!"

# SAF_compliments_to_the_voortrekkers: "Compliments for the Voortrekkers"
# SAF_compliments_to_the_voortrekkers_desc: "The main complaint the Boers have is about how they have been sidelined politically and feel highly underappreciated. While we will not impede our political dominance, perhaps a charm offensive over the radio waves (since many Boers refuse to have a television) will help hold things together by showing the Afrikaners.\n\nBy organizing more radio broadcasts in Afrikaans and invoking the glorious history of the Boers in opposing the Natives who lived in this land (while also downplaying the everlasting conflicts between the Boers and the British empire) we should be able to convince the Boers to continue being on our side, one united front against the Pan African threat."

 SAF_create_a_red_scare: "The Red Scare"
 SAF_create_a_red_scare_desc: "The ideals of hideous Soviet Communism are antithetical to the South African way of life, and while the Soviet Union has been shattered by the German Reich, the ghost of Lenin still wanders through Africa. It offers delusions of freedom to the Natives, not knowing full well the evil tyranny that shall follow. Communism leads to famine and oppression of all for the benefit of the so-called equal party elites and the destruction of South Africa altogether.\n\nAll around the nation, the people should be instructed to be vigilant of those evil reds and those who would seek to upend the status quo. The ANC, the South African Communist Party, the Pan African Congress, all of them and their associated organizations are hives of communist activity and should be fought against by all good South Africans. And hopefully, as a side effect of this propaganda campaign, both the Boers and the Germans will look more favorably upon us."

# SAF_strengthen_oversight_on_unions: "Strengthen Oversight on Unions"
# SAF_strengthen_oversight_on_unions_desc: "Looking into the source of their money isn't enough. There are surely people, external to the organization, who are willing to help them with information and protection, which is perhaps even worse than money.\n\nWhile time will be needed to have a clear view, many investigators point to the National Party: who else would gain support from a strong ANC? It would prove to the people that apartheid and racial segregation are necessary to keep order.\n\nWe should focus our efforts into uncovering those Boers who are helping the Congress and show to all our people their crimes against South Africa, they would rather burn our country than let us win the coming referendum."

# SAF_contain_the_masses: "The Containment Conjecture"
# SAF_contain_the_masses_desc: "Two-thirds of South Africa are the restless natives who form a cornerstone of our economy but are shut out from gaining any of its benefits. The other third works to contain them, using their labor and stopping them from getting out of line with a harsh hand and a fine-tuned system of Native containment and management.\n\nWith the continued rise of the highly dangerous and subversive African National Congress, more will have to be done to ensure that law and order is not disrupted by protests, strikes, or even violence. Only United Party leadership over the wild, untamed masses of Natives will bring South Africa to prosperity and keep things as they have always been in South Africa, a grand state of inequality."

# SAF_strengthen_domestic_military_production: "Strengthen Domestic Millitary Production"
# SAF_strengthen_domestic_military_production_desc: "With the increase in tensions, it only makes sense to offer subsidies to our domestic military-industrial complex, giving our domestic producers of both small arms and other vital equipment for the army the stability to expand. Combined with guarantees on buying up a steady amount of future production.\n\nUnfortunately, while this will be more reliable than the alternative, it will be expensive now and in the future. Quality, and most of all, a more independent military-industrial complex will repay itself in the future in the distant case that diplomacy breaks down."

# SAF_intensify_weapons_imports: "Intensify Weapons Imports"
# SAF_intensify_weapons_imports_desc: "The answer to our military needs is simple: further purchases of military equipment from the superpowers, split in such a way that neither of the sides will be dismayed. American and German weaponry will be imported by sea, and shipment after shipment of small arms will be delivered to equip the army of South Africa."

# SAF_the_south_african_lion_roars: "The South African Lion Roars"
# SAF_the_south_african_lion_roars_desc: "The challenge has been met; unrest has been averted. While tensions on our northern border may continue, the United Party has successfully dealt with the domestic challenges of the day. The ANC has been properly shown their place, and the Boers will continue to complain yet to undertake no action, after all, our government operates in the interests of all Whites, not just the Anglo-Saxon peoples of South Africa.\n\nBut South Africa is even looking abroad to establish new connections and friendships with neutral nations and superpowers alike. The balance of power and diplomacy holds firmly, peace and prosperity reigns and everything couldn't be better. Let the good times roll and may the sun never set upon South Africa!"

# SAF_lean_towards_the_pakt: "Lean Towards the Pakt"
# SAF_lean_towards_the_pakt_desc: "Giving some advantages to the German Reich could be a smart option with regards to not just financial gain, but political as well. Ties to Germania could feed right back into applying diplomatic pressure to have the Reich help with matters related to the RK's and their support for the Boers.\n\nIt wouldn't make sense for Germany to deepen trade relations with us and then have their colonies continue to agitate for Boer independence, so hopefully, we can achieve some change through trade by furthering relations with the German Reich."

 SAF_prepare_anti_air_systems: "Prepare Anti-Aircraft Systems"
 SAF_prepare_anti_air_systems_desc: "South Africa has not been a battlefield since 1902, and technology has moved on since then. It was never thought that air defenses would be needed. Yet, it now seems more and more likely that a war could kick off which would leave our nation undefended from the air.\n\nIt is always good to be more prepared, and effort should be put into building anti-air defenses just in case. Certainly, though, nothing is ever going to happen, and things will be just fine." 

 SAF_the_age_of_helicopters: "The Age of the Helicopter"
 SAF_the_age_of_helicopters_desc: "After many years as a novelty, the helicopter has become a huge element of modern warfare. Crossing into enemy lines, handling rapid response actions, and rapid movement despite a lack of infrastructure makes helicopters invaluable to winning this conflict.\n\nThankfully, we can lean in on the American experience with their helicopter forces and develop their own. Not to mention that the American companies would be happy to provide us with the equipment we need, for a rather steep price."

 SAF_request_additional_guns: "Request Additional Guns"
 SAF_request_additional_guns_desc: "Throwing manpower at the problem is useless if we can't properly equip our troops. If we are to win, this victory must never be pyrrhic, and what is needed more than a mass of poorly armed soldiers is a medium group of well-equipped, well-trained divisions instead.\n\nMore than men, or money, we need weaponry, equipment, ammunition, uniforms, planes, tanks, and all kinds of material goods that we need to keep our troops supplied and going far outrank our needs rather than money or manpower. It is best to ask for a new round of lend-lease and to quickly get this new American material to the front."

 SAF_request_american_loan: "Request American Loans"
 SAF_request_american_loan_desc: "While the oncoming German horde from the north is terrifying, far more terrifying is the gap on our budget sheet. Incomes are down, expenditures are up, and everything is committed to winning. Yet the economic reality of South Africa's war economy is one that still obeys the permanent logic of the budget balance.\n\nMore than anything else, we need a loan to keep our economy going. There will be no good in achieving military victories only to have South Africa falling apart domestically leading directly to further divisions and military weaknesses. Since this is in the interests of the Americans to keep us in the fight, it should not be difficult to have Congress greenlit a new financial aid package."
 
 SAF_intelligence_cooperation: "Intelligence Cooperation"
 SAF_intelligence_cooperation_desc: "Siding with the Americans has also come with one great advantage. And while there is still some distrust between us due to the distance we have kept from the OFN since the end of the Second World War as well as concerns over German operatives within the nation that have been sent here before the war.\n\nYet more and more cooperation between the CIA and our own Bureau of State Security continues to grow as information is exchanged between the two services on all sorts of subjects in service with the war. BOSS does not yet match up to the CIA's reputation so it would be wise to let the Americans into our operations in the north."
 
 SAF_raid_the_leftovers: "Raid the Leftovers"
 SAF_raid_the_leftovers_desc: "Everyone knows how serious this war has become, but it has become an existential conflict for South Africa. Every resource must be used in the defense of the nation, and nothing can get in the way of that.\n\nWhile American supplies keep coming in, it is still not enough. Every old, outdated weapon in our inventory will at least help us arm one person more, even if it is done poorly. A bullet fired from a M1917 Enfield will still kill a German to this day, just like our fathers did in the First World War"

 SAF_logistics_by_train: "Logistics by Train"
 SAF_logistics_by_train_desc: "South Africa's train network has grown rapidly since the end of the Second World War, and in this conflict, it can still provide great help in supplying troops and keeping the logistics flowing from the coast to the battlefield.\n\nInvesting in our train lines in critical sections that slow down our logistics the most will help keep the flow of goods and people moving without issue. As a bonus, this expanded train network would help South Africa's further development once the war is over."
 SAF_logistics_by_train_tt: "Modify §Y$SAF_springboks_march$§! by\n$modifier_production_speed_rail_way_factor$: [?SAF_springboks_march_railway_speed_temp|=+%2]"

 SAF_bring_out_the_convoys: "Bring out the Convoys"
 SAF_bring_out_the_convoys_desc: "Trucks are the more flexible way of handling logistics, with roads being easy to construct and transport across router dirt roads making it possible to get close to the battle.\n\nWe should request that our American allies send over new trucks and maintenance support so that we can fully motorize our logistics system, as well as make sure that our troops have more options to move around by trucks overall."
 
 SAF_reborn_under_fire: "Reborn under Fire"
 SAF_reborn_under_fire_desc: "South Africa has changed rapidly over the last few years, as the nation itself continues to resist the German onslaught. The great test of this conflict is not completed, but the nation and its allies still stand firm.\n\nReborn under fire, South Africa pushes onward north, finally united and ready for battle. American aid continues, while the nation itself has fully adjusted to the needs of the war.\n\nForward, forward for South Africa!"

 SAF_postwar_tree: "Post-War Tree"

 SAF_the_aftermath: "The Aftermath"
 SAF_the_aftermath_desc: "The guns have fallen silent, and the diplomats have completed the negotiations. After this period of great pain, suffering, and crisis, South Africa still stands. Battered, but not broken as a member of the free world. So many men had given their lives from all around the world to defend South Africa's existence, and the plans to conquer the entire nation had shattered for good.\n\nBut as the borders are secured and the existential struggle is now over the internal issues that had been kept at bay will now rear their heads in an ever more intensive way. The division in the United Party grows, and those who still call themselves South African will be seeking quick and decisive answers for their many troubles. The reconstruction of South Africa must begin as soon as possible"
 SAF_the_aftermath_tt: "Completing this focus will disable §YThe Legacy of Rhodes§! and other decision mechanics "

 SAF_pacifying_remnants: "Pacifying the Remnants"
 SAF_pacifying_remnants_desc: "The South African war has been extremely chaotic, and its effects will linger on for an exceptionally long time. Yet its most short-term effects are remnants of the enemy and general bandits and criminal organizations that have secured an enormous influence on certain towns and villages. Before the army can be demobilized and everything can return to normal the final remnants will need to be flushed out and struck down.\n\nA nationwide search and destroy operation will be initiated, supported by information from locals as well as the now well-established information networks to tackle this problem with force. Once the pacification is complete, the next steps can be taken in getting things back on track."

 SAF_cleaning_up: "Cleaning Up"
 SAF_cleaning_up_desc: "The wrecks of burned vehicles litter roads. Entire neighborhoods burned down, the remnants of several soldiers left to decompose in the sun while many people have been internally displaced, refugees within their own nation. Minefields need to be disarmed, and the rail bridges lost in the conflict will have to be rebuilt.\n\nThe scars inflicted upon our country will eventually heal, as the people return home to try and make something of their lives once again. Cleaning efforts will now begin in earnest, and entire communities will come together to rebuild afterward."

 SAF_demobilization: "Demobilization"
 SAF_demobilization_desc: "The lengthy process of winding down our armed forces has come as the veterans who made it through this great struggle can finally be sent home. Operating in steps, the process of demobilization will help bring our economy back to life as the people will return to their homes.\n\nStill, a professional defensive core of veterans will remain to ensure that such a humiliating defeat such as the first defense against the Boer onslaught can never happen again. Our northern borders remain a point of contention that will have to be manned and defended properly."

 SAF_nationalize_german_assets: "Nationalize German Assets"
 SAF_nationalize_german_assets_desc: "Did they really think they could get away with trying to conquer us like that? The Germans have invested in South Africa before the war, and with the full backing and security of the Americans, all German assets within South Africa will be seized by force. Not only does this give a short-term benefit to the state, but it will also further end all trade with the Germans.\n\nAs for the assets themselves, they will be auctioned off to the right bidders, loyalist businessmen, and investors who have sided with South Africa during the war, and perhaps our new American friends would want to put in a bid as well."

 SAF_ofn_trade_initiatives: "OFN Trade Initiatives"
 SAF_ofn_trade_initiatives_desc: "South Africa now holds a key geographic position within the OFN, the rightward link between America and Australia. With German trade closed and our new position as one of America's main allies being in place all limitations in trade between us will have to be removed.\n\nNot just trade, but above all, we need foreign investment to help bring our economy back to life and help bring forth a better future for South Africa. A reduction in business taxes will do well in enticing American companies to settle here, as well as reward those entrepreneurs who lead the development of our economy."

 SAF_american_military_standards: "American Military Standards"
 SAF_american_military_standards_desc: "The process of modernizing our army according to American ideas has been happening during the war, but now it should be finalized. Not only should we request the continuation of the training programs and the intelligence support, but also immediately begin phasing out our equipment to be solely made in the OFN.\n\nThe stockpiles of captured and pre-owned German equipment should all be sold off internationally while any domestic military initiatives should be retooled to meet American standards. Finally, the Americans should be granted permanent air and naval bases along the coast to further consolidate our national defense."

 SAF_promote_anglo_immigration: "Promote Anglo Immigration"
 SAF_promote_anglo_immigration_desc: "The OFN is in general, an organization of Anglo-Saxon Heritage between the Americans, and the British colonies that are united within it. By renouncing our neutrality and joining their side, South Africa can become an attractive destination for immigration from the OFN.\n\nDemographics are a force of their own, and if we are to stay on top of South Africa we need to have more non-Black people settling the land to help contain the numbers. Not only should there be a settlement in South Africa be advertised, but new arrivals of the right standing should be given help to get started. Even immigration from neutral countries should be opened with limitations to further pad the demographic numbers of the correct types of people."

 SAF_a_legacy_restored: "A Legacy Restored"
 SAF_a_legacy_restored_desc: "South Africa was a backwater under the Dutch and a backwater under the Boers. Only when the British arrived did the modern era come to these lands, of radio and railway, of progress and growth. British leadership is what made South Africa, and the people fully realize the importance of this connection even after the British empire had ended.\n\nThe people of this great nation (with some nudging from the United Party) have rightfully decided to restore this old legacy and reconnect with our brother peoples of the Commonwealth.\n\nLong live the Queen, long live Queen Elizabeth the Second of the Commonwealth of Nations!"

 SAF_reach_out_to_the_commonwealth: "Reach out to the Commonwealth"
 SAF_reach_out_to_the_commonwealth_desc: "America is the great power of the OFN, yet the nations of Australia, New Zealand, and Canada can become vital parts of our new economic strategy. With our glorious return to the Commonwealth, we should do our best to establish personal contacts in these countries, hoping that this Royal Diplomacy will help secure trade deals and cooperation.\n\nAt the same time, our links to the British empire should be remembered and honored, and the lives of all those who defended South Africa should be honored with grand monuments. Let the names of those who died while defending the Orange-White-Blue flag be etched into marble, and granted a most honorable resting place"

 SAF_reach_out_to_the_commonwealth_alt: "Reach out to the Commonwealth"
 SAF_reach_out_to_the_commonwealth_alt_desc: "America is the great power of the OFN, yet the nations of Australia, New Zealand, and Canada can become vital parts of our new economic strategy. With our glorious return to the Commonwealth, we should do our best to establish personal contacts in these countries, hoping that this Royal Diplomacy will help secure trade deals and cooperation.\n\nAt the same time, our links to the British empire should be remembered and honored, and the lives of all those who defended South Africa should be honored with grand monuments. Let the names of those who died while defending the Orange-White-Blue flag be etched into marble, and granted a most honorable resting place"

 SAF_the_people_have_spoken: "The People Have Spoken"
 SAF_the_people_have_spoken_desc: "As much as it stings, the vote in opposition to the monarchy must be honored. To turn our backs on the outcome risks delegitimizing our government and handing a great propaganda triumph to our enemies. While our alliance with the OFN is secure and established for the long term the royal ties are now forever broken.\n\nFrom now on, the Union of South Africa shall be a republic. Yet it shall forever remember and treasure our Anglo-Saxon heritage, and we will remain connected to our brother peoples in the OFN. Hopefully, the Canadian government will not look too harshly upon us in the future for staying true to the outcome of the referendum."

 SAF_treasonous_voters: "Treasonous Voters"
 SAF_treasonous_voters_desc: "Weakness, that's what it would be to accept the outcome of this sham referendum. To count the votes of the Boers who voted against the monarchy en masse would be an absolute travesty. Why should the votes of those who declared war upon peace, stability, and prosperity matter in the slightest?\n\nThere can be no doubt about the real outcome of the referendum for those who had always stayed loyal to South Africa, the vote to remain loyal to our shared history as a part of the Commonwealth would have been won without issue. Everyone knows it, and no appeal shall change this. South Africa shall remain in the Commonwealth of Nations, and it shall have a Queen."

 SAF_your_vote_actually_matters: "Your Vote Actually Matters!"
 SAF_your_vote_actually_matters_desc: "Fine, you got your way. The monarchy has been abolished, and that old link to our glorious past as a Dominion of the British Empire is now lost for good. Those who voted surely get to relish in their victory, but it's clear that there is also an opportunity for the United Party in this.\n\nUsing the referendum's outcome and our acceptance of it as a starting point for promoting the party as one that is held responsible by the will of the people and deeply listens to the people of South Africa. Let everyone know just how much the UP respects the voices of everyone with a grand propaganda push so everyone knows it."

 SAF_call_for_elections: "Call for Elections"
 SAF_call_for_elections_desc: "The economy is starting to grow, roads are cleared, and the nation is making great strides in the reconstruction. Now safely under the wing of Uncle Sam, South Africa is looking to prosper once again.\n\nThere is no better time to call an early election and secure another term for the United Party. Things have drastically changed from the last time South Africans supported the party, but with enough work and preparations, and some very special help the United Party should be able to come back on top, still led by none other than Prime Minister De Villiers Graaf."

 SAF_problems_left_unsolved: "Problems Left Unsolved"
 SAF_problems_left_unsolved_desc: "South Africa still stands. Injured, yes, but the Orange, White and Blue flag still flutteres high over the cape. As much as the existential threat has now passed, South Africa still stands at a crossroads with several growing internal issues having been addressed\n\nMeanwhile, the United Party's name grows hollower over time as the wings resume fighting one another, and the ANC remains a force to be reckoned with. The events north of the border will continue to influence the nation, and the limits of the current system become more and more apparent. Will the UP manage to stay in charge, or will the ANC finally achieve a peaceful transition of power? Will South Africa come together, split up, or fall into a disaster just as great as the South African War?\n\nWell, that's a story for another day."
 SAF_problems_left_unsolved_tt: "§fThe Elections will be held. The die is cast"

 # NEW WAR TREE - PRELIMINARY LOCALIZATION BY FIVE
 
 SAF_south_african_war_focus: "The Great Catastrophe Begins"
 SAF_south_african_war_focus_desc: "The United Party government may have survived the attempted coup, but will it survive the war? From all sides the Ossewabrandwag radicals march across the borders and intelligence reports indicate that the German colonies to the north are preparing for an intervention as well. With the seat of government moved to Cape Town and a rapid mobilization of the nation for war, Prime Minister De Villiers Graaff stands at the head of a war government, quickly assembled from those who stayed loyal to the Cape rather then side with the traitorous extremists that proclaim themselves to be defenders of the Afrikaner Volksstaat\n\nThings will be chaotic as lines of defence are drawn up, men mobilized and the call goes out to all the people of the Union of South Africa to rally to our defence. We have to hold untill the Americans and the wider OFN arrive and then turn the tide."
 
 SAF_start_the_propaganda_wave: "Launching our Propaganda Efforts"
 SAF_start_the_propaganda_wave_desc: "Just as vital as the people fighting to defend the Cape and the freedom of South Africa is the battle fought via information. The Ministry of Information will be massively expanded to begin spreading information to both domestic and foreign audiences. Domestically, the need to emphasize our glorious defence of our freedom against the oncoming horde of evil national socialists. All South Africans must, shall, and will resist in the face of this ever-growing danger, and a hundred years later they will still say that this was our finest hour.\n\nOur foreign propaganda will be mostly pointed at the nations inside the OFN to emphasize the direness of our situation and the need to support South Africa. The wounds of the defeat still linger in the minds of many people and will serve as a good breeding ground for support for an Allied intervention against the Germans. Now is their first real chance to get even, or perhaps even get vengeance upon the Reich and to aid in the noble cause of the defence of the Cape and the people of the Union of South Africa."
 
 SAF_exceptional_measures: "A More Gentle Hand"
 SAF_exceptional_measures_desc: "Everything should be done to win the war. Everything, even that was once unpalatable and still is to many is but internal segregationist measures will have to be relaxed, as we have far greater problems. If anything, the war should only heighten our support with the Native majority because they know very well the fate they face if the war is lost. Slavery, and genocide even, as is frequently practiced in Ostafrika hangs over their head. Any issues they have against us, and especially the ANC has pale in comparison compared to the menace coming in the north.\n\nAs part of wider wartime measures we should offer these people some minor concessions while emphasizing our role as their last defence against the horrors up north. While the ANC are a stubborn, rebellious bunch, it is certain that they will not undermine us while the war is going on. At least, not while enslavement and death hangs over their heads."
 
 SAF_war_economy: "Shifting to a War Economy"
 SAF_war_economy_desc: "A war is not just fought with armies and soldiers, but also with guns and butter too. An army that isn't supplied, simply can't fight and will fall to the enemy. Over the years since Second World War ended and the British exiles arrived, South Africa has massively grown stronger and wealthier, and we can capitalize upon that wealth to aid in our defence. While the United Party abhors totalism and absolute government control over the economy, such extremes may be needed to ensure victory in the war.\n\nOur entire economy shall be moved over to a more centralized form as the government takes strong steps to push all means, private and public, towards the cause of the war. The factories shall be shifted over to provide for the ever-growing needs of the army, and Minister Wall shall oversee the transformation of our economic system to fight the war. Perhaps at the very end of this dark tunnel, these changes can even lead to greater growth after the war is over."

 SAF_Bloemfontein_blues: "Bloemfontein Blues"
 SAF_Bloemfontein_blues_desc: "Right now, the Union Defence Forces are of paramount importance and coordinating with Defence Minister Eglin is needed. Plans are being drawn up for a massive expansion of the all wings of our armed forces, land, army, and sea. Luckily, the Prime Minister and Eglin are close friends despite their political disagreements and will work through the problem with vigor.\n\nOH GOD NEED SECOND PARAGRAPH"
 
 SAF_brown_menace: "A Matter of Intelligence"
 SAF_brown_menace_desc: "The Beuro Of State Security, or BOSS for short, has served as our main intelligence agency since its foundation in 1949. Staffed with both experienced British operatives who were part of the SOE, MI5 or MI6 before the fall of Britain. Alongside them, a new generation of South African intelligence officers have provided a good base of spycraft to aid in the security of the Springbok nation\n\nBut now, times are radically different, and a grand expansion and more then doubling of funding will be required to ensure that the war isn't just won in the deserts and jungles, but in the seedy alleyways and deep behind enemy lines as well. Sir John Sinclair has lead BOSS for the last seven years, and stands ready to do his duty to defend South Africa, knowing full well that he could make a difference now that he couldn't in the defence of Britain."
 
 SAF_the_last_light: "The Last Light"
 SAF_the_last_light_desc: "South Africa is a free and liberal democracy, a developed nation of free people unique in Africa, a continent riddled with colonies and communists. The world should know all about our struggle against the evil of the German invaders and their Afrikaner puppets being used to try and conquer our beautiful nation and this message should be sent out not just publicly, but across diplomatic channels as well to nations likely to be sympathetic to us.\n\nSteyn will at the same time commence a tour of the OFN, to discuss matters of vital support of our conflict with our newfound allies in the Organization of Free Nations, hopefully bringing back plenty of pledges of support from the free peoples of this earth."
 
 SAF_orange_loyalists: "Orange Loyalists"
 SAF_orange_loyalists_desc: "To simply say that this is a war between Afrikaners and Anglo's would be a gross simplification of the conflict. Assuming that all Afrikaners support the OBW's mad revolt is simply wrong, and there are many who oppose these people who brought war directly to their homes. There is an opportunity here to turn these people against the Afrikaner puppet state of the Germans by promoting sabotage and even guerilla war to help undermine the Volksstaat. Luckily BOSS is well underway in establishing networks and reaching out to those people most likely deemed to be the moderate civillians within the Volksstaat willing to take covert and less than covert actions against the OBW dictatorship."
 
 SAF_native_rebels: "The Enemies of my Enemy"
 SAF_native_rebels_desc: "No one in their right mind would think about arming the Pan Africna Native groups that oppose our way of life entirely, but times are definitely desperate enough that some effort should be taken to fan the flames that have long been burning inside the Reichskommissariats. Care should be taken to contact and supply these forces with weapons and let them do the rest themselves, yet to not empower them as much as to have them be a problem later. Hopefully both sides can fight a lot and tire themselves out in such a way.\n\nAs for our allies in waiting in Rhodesia, no expense should be spared to get them all the support they can recieve in their struggle to liberate their homeland. Contact with the Capricorn Brigade has been well established and their fight in undermining the German occupiers continues."
 
 SAF_the_fight_goes_on: "Striking Their Supply Lines"
 SAF_the_fight_goes_on_desc: "The next move against the Volksstaat and their puppetmasters is to undermine their logistics, weakinening their attacks into South Africa and helping us turn the tide. Several operatives have moved into key positions to bomb the Volksstaat's logistics networks such as trains and bridges and supply depots. Unfortunately however, the enemy will be able to repair the damage within a reasonable amount of time, leaving this as a temporary opportunity and assaults should be coordinated with these temporary effects in mind."
 
 SAF_recruiting_people: "Mass Mobilization"
 SAF_recruiting_people_desc: "South Africans to arms! South Africans to arms! Let the ranks of the Union Defence Forces swell with the young and the willing first, and right after that with the conscripted men carrying out their sacred duty of national defence. All around the Cape and Natal volunteers are taking up arms locally and joining the war effort but more is needed. Above all a proper structure for a grand mobillization of large amounts of men to be armed by the surge in weapons imported from abroad and produced domestically\n\nAbove all, war will do them good, shape them into strong men and soldiers that will form the backbone of the Union upon their return from defeating the enemy and shattering him entirely. Our best and brightest will step up to the challenge and stand firm. For the Union, for Victory, for Security, and for Liberty, South Africans to arms!"
 
 SAF_millitary_acadamy: "Utilizing Our Veterans"
 SAF_millitary_acadamy_desc: "Our pool of older veterans from the Second World War is extensive, and still has a lot of experience to share with the newer generation. Without delay, those experienced in the realities of war yet are too old to take part in it again should be called up to lead the establishing of training efforts and setting up a widely expanded training regimen, expanding our national officer education and serving as well experienced advisors to support training efforts for the many people who have never carried a gun in their lives. As for those who are able and willing, they should be called up to take up higher positions within our army as officers and commanders. Let no experience be lost as the old soldiers of Britain are out to finally get even with the Germans."
 
 SAF_at_the_war_factory: "Handing out Millitary Contracts"
 SAF_at_the_war_factory_desc: "South Africa has always held to the belief in free markets as the way to guide a nation towards prosperty even when the world seemed to turn away more and more towards authoritarian systems and heavy state control over the economy. Yet in these desperate times we have no option but to heavily intervene in our economy and invest all we have saved for the defence of South Africa, involving massive expansion of our state companies and setting up economic restrictions.\n\nThe most important aspect we can do outside of restrictions is to let the money flow with extensive millitary contracts to all domestic companies to pump out everything the army could possibly need. All factories will be reworked to put out more and more bullets, guns, and trucks to be sent directly north. On top of winning us the war, this expanded industrial base will help us in the future when peace returns to the Cape."
 
 SAF_battle_keeps_going: "Road and Rail, Docks and Airports"
 SAF_battle_keeps_going_desc: "General Montgomery has always been an eternal (and annoying) advocate of the matter of logistics, advocating for more road and rail connections to supply South Africa's north better. But now we are at the stage where supplies are flowing in from abroad but held at bay by lacking connections preventing things from flowing up north. Artillery without shells can't fire, men with empty stomachs can't march, and not a single tank will move without fuel making to the front. We have the defensive advantage, but supplies remains botltenecked unless drastic actions are taken.\n\nRail, road, docks, airports, transport hubs, logistics systems, all of it will have to be expanded with great haste to win the war just as much as how our soldiers are performing on the battlefield. Here we have the advantage as opposed to the more overextended RK's, and as long as the OFN continues to back us the flow of supplies north will keep everything going without interruption."
 
 SAF_to_win_the_war: "To win the war"
 SAF_to_win_the_war_desc: "Victory awaits! Victory right around the corner. The first excitement of the war is over, things have normalized somewhat. Now the time is here to turn the tide as the OFN arrives in force and South Africa is rapidly mobilizing its people and economy for war while on the battlefield the relentless march of the enemy has been stopped by the immovable and loyal defenders of South Africa. Soon we will set foot on their lands and move to cleanse Africa from all occupying forces. Here on the Cape, the tide will finally turn against the gray menace and their arrogance will be their undoing."
 
