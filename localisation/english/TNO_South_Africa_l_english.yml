 ### Internal Affirs Mechanic ###
 # UI
 SAF_internal_affairs: "Internal Affairs"
 SAF_internal_affairs_explainer: "§gThis mechanic represents the political state of affairs in South Africa. There are 4 values: §KANC§! Power, §OOBW§! Power, §IMonarchy§! Support, and §RChaos§!.\n\n§KANC§! & §OOBW§! Power: Power level of the §KAfrican National Congress§! and §OOssewabrandwag§!.\nIf §KANC§! Power hits §Y100%§!, South Africa will face widespread industrial strikes organized by the ANC.\nIf §OOBW§! Power hits §Y100%§!, the OBW will take the chance to steal weaponry in preparation for a potential §Ropen rebellion§!.\n\n§IMonarchy§! Support: How many South Africans are expected to vote in favor of the monarchy when the referendum is held. If §IMonarchy§! Support is §Yover 50%§!, the referendum is highly likely to end in South Africa §Ymaintaining the monarchy§!.\n\n§RChaos§!: A measure of disorder within the South African political system. As §RChaos§! increases, you will face escalating economic penalties and §KANC§! and §OOBW§! power will increase quicker. There is also a §YBase§! §RChaos§! level (indicated by the yellow bar within the progress bar), which will increase with time as the South African political situation deteriorates. It is very difficult to keep §RChaos§! below your §YBase§! §RChaos§! for long.§!"
 SAF_IA_Chaos_text: "§RChaos§! - §W[?SAF_Chaos|2]%§!"
 SAF_IA_Base_Chaos_tt: "§YBase§! §RChaos§!: §W[?SAF_Chaos_bound|2]%§! \n\nIf §RChaos§! is less than the §YBase§! §RChaos§! level, the §RChaos§! §YWeekly Rate§! will increase by §Y1.00%§! per week until §RChaos§! is equal to or greater than the §YBase§! §RChaos§! level.\n\nOnce §RChaos§! rises to or surpasses the §YBase§! §RChaos§! level, the §RChaos§! §YWeekly Rate§! will be reset to §Y1.00%§!.\n\nReductions in §RChaos§! will be §Yless effective§! when the value after reduction would be less than the §YBase§! §RChaos§! level."

 SAF_IA_currently_selected: "§WCurrently Selected:§! [SAF_IA_GetCurrentSelection]"
 SAF_IA_none_name: "§gNone§!"

 SAF_IA_ANC_name: "§KAfrican National Congress§!"
 SAF_IA_ANC_tt: "§KAfrican National Congress§!\nPower: [?SAF_ANC_power|W2]%\n--------------\n§KThe African National Congress (ANC)§! was established in 1912 and is considered the first official liberation movement in Africa. Initially, it consisted of a gathering of Native elites and religious professionals. It evolved into a broader mass movement in the early 1950s, when §Ka new generation of leaders§!, including Nelson Mandela, Oliver Tambo, and Walter Sisulu, emerged.\n\nFollowing the signing of its §MFreedom Charter in 1955§!, §Kthe ANC§! faced severe repression from §Jthe United Party§!, leading the organization to go underground. Despite being fully banned in 1960, §Kthe ANC§! continued to gain support nationwide from those who were oppressed. In response to the ongoing suppression, §Kthe ANC§! founded an armed wing called §GuMkhonto weSizwe§!, which is in the early stages of organization and armament for the struggles that lie ahead.\n\nDespite §Jthe United Party's§! efforts to dismantle §Kthe African National Congress§!, §Kthe ANC§! continues to grow in strength and influence as calls for equality become increasingly louder."
 SAF_IA_ANC_tt_delayed: "[SAF_IA_GetANCInteractionAllowed]"
 SAF_IA_ANC_tt_delayed_deny: "You must complete the focus §YOn The Streets§! to deal with the §KAfrican National Congress§!."
 SAF_IA_ANC_tt_delayed_allow: "§WClick§! to deal with the §KAfrican National Congress§!."

 SAF_IA_Monarchy_name: "§IThe Monarchy§!"
 SAF_IA_Monarchy_tt: "§IThe Monarchy§!\nSupport: [?SAF_monarchy_support|W2]%\n--------------\nUnofficially, §Ithe throne of South Africa§! remains vacant, as the nation exhibits a noncommittal indifference towards both §XElizabeth II in Canada§! and §bEdward VII in Britain§!. Nevertheless, even the most isolated hermit in Siberia is aware that the government and the people overwhelmingly support §XElizabeth II and the Commonwealth.§!\n\nOn the other hand, many §OAfrikaners§! who despise the monarchy are increasingly eager to realize their vision of a true republic in the Cape, free from foreign influences. The time has come for §JSouth Africa§! to determine the future of its §Ivacant throne§!, its international relationships, and possibly the future of the Union itself, as both sides of the conflict prepare for the referendum scheduled for late 1963. Despite all the uncertainties surrounding §Ithe vacant throne§!, its eventual dissolution §Zis not yet a foregone conclusion...§!"
 SAF_IA_Monarchy_tt_delayed: "[SAF_IA_GetMonarchyInteractionAllowed]"
 SAF_IA_Monarchy_tt_delayed_deny: "You must complete the focus §YThe Voice Of The People§! to deal with the §IThe Monarchy§!."
 SAF_IA_Monarchy_tt_delayed_allow: "§WClick§! to deal with the §IThe Referendum on the Monarchy§!."

 SAF_IA_OBW_name: "§OOssewabrandwag§!"
 SAF_IA_OBW_tt: "§OOssewabrandwag§!\nPower: [?SAF_OBW_power|W2]%\n--------------\n§OThe Ossewabrandwag (Ox Wagon Sentinel)§! was founded in 1939, approximately 100 years after the first Afrikaners left the Cape Colony in search of a future away from British control. However, §Sthe British§! were not satisfied with merely taking the Cape from §Othe Afrikaners§!, and soon, the few §OAfrikaner republics§! were conquered by them as well. Nevertheless, the idea of §Oa Volksstaat§!, a true Afrikaner homeland, never faded. §OThe Ossewabrandwag§! became its staunchest defender.\n\nDuring World War II, §Othe OBW§!, led by §,Johannes van Rensburg§!, engaged in acts of sabotage. After the war, its members were §Vsent into exile§!, but they continued §jto grow in strength§!, preparing paramilitary forces. As unrest among §OAfrikaners§! increased, fueled by a perception that §SAnglo leadership§! was sidelining them, the §OOBW§! found a larger support base composed of sympathizers and militiamen willing to fight for the idea of §Othe Volksstaat.§!"
 SAF_IA_OBW_tt_delayed: "[SAF_IA_GetOBWInteractionAllowed]"
 SAF_IA_OBW_tt_delayed_deny: "You must complete the focus §YBetween Two Eagles§! to deal with the §OOssewabrandwag§!."
 SAF_IA_OBW_tt_delayed_allow: "§WClick§! to deal with the §OOssewabrandwag§!."

