 SAF_debug_category: "§uSouth§! §WAfr§!§Qica§! Debug"
 SAF_debug_category_desc: "Very special thanks to the original TNO §OS§!§WA§!§QF§! team and\nthe §OHeldenvolk§! team (§JAriandel, Voyteck, Alyosha, Edgar Harford, West Indies Patriot, Punkradio, Manuun, Dafid25, Krumtum and Ewatta§!) for making this update possible in the first place.\n\nAnd thanks to all different people who supported me and helped me out from the start at §XRevolution at Sunset§!, splitting off into §OHeldenvolk§!, and then to §b2WRW§! into §TRequiem§!. Could not have done it without your support.\n\nAnd finally, I'd like to give §ngreat thanks to you§!, §Ythe player§!, and §Ythe community§! for supporting this mod, it really does make a difference for the team.\n\nI hope you have as much fun playing South Africa as all of us together had while making it!\n\n§T~ Number Five Great Power§!\n\n\n§SI've travelled this old world of ours from Barnsley to Peru\nI've had sunshine in the arctic and a swim in Tinbuktu\nI've seen unicorns in Burma and a Yeti in Nepal\nAnd I've danced with ten foot pygmies in a Montezuma hall\nI've met the King of China and a working Yorkshire miner\nBut I've never met a nice South African.\n\nNo, he's never met a nice South African\nAnd that's not bloody surprising man\n'Cause we're a bunch of arrogant bastards\nWho hate black people\n\nI once got served in Woolies aften less than four week's wait\nI had lunch with Rowan Atkinson when he paid and wasn't late\nI know a public swimming bath where they don't piss in the pool\nI know a guy who got a job straight after leaving school\nI've met a normal merman and a fairly modest German\nBut I've never met a nice South African.\n\nNo, he's never met a nice South African\nAnd that's not bloody surprising man\n'Cause we're a bunch of talentless murderers\nWho smell like baboons§!\n\nCURRENT PROGRESSIVISM STANCE: [SAF_Society_progressivism_stance_tt]\ncurrent value of progresivism (just to bu sure ur not dumb): [?SAF_society_progressivism]"
