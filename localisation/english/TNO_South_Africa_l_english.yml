#  SAF_SOG_category: "Studies and Observations Group"
 SAF_SOG_category_desc: "The Studies and Observations Group is a team of highly experienced American intelligence and paramilitary operatives working under the wing of the CIA. Led by retired Air Force officer Edward Lansdale, they have operated in the shadows all over the globe, supporting and crushing countless insurgencies and rebellions to protect the American way of life. Their arrival in South Africa may be a benefit to our struggle against the Nazis, but wherever the SOG goes, trouble tends to follow."
