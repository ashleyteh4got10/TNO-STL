 SAF_Sao_Tome_base: "Build the São Tomé Air Base"
 SAF_Sao_Tome_base_desc: "São Tomé and Principe is a calm, underdeveloped backwater off the coast of Iberian Guinea. At least, until the Iberians came to an agreement with us to use it as a refueling and supply station. Since then, it has been a vital stop for transport ships and warships alike - in addition to its close proximity to Reichskommissariat Zentralafrika, allowing for reconnaissance and covert operations behind enemy lines to expand."
 SAF_Guine_training: "Train our Troops in Bissau"
 SAF_Guine_training_desc: "Africa is a vast, diverse battleground for our boys on our ground to fight in. Unfortunately, it's rather hard to find ideal approximations to acclimatise our troops within the United States itself. Fortunately, our quasi-allies, the Iberians, have agreed to open up their facilities in the tropical colony of Bissau in order to acclimatise our troops for the steaming jungles of Mozambique and the Congo. While not entirely able to acclimatise our troops for all African biospheres, we would have to make do for now."
