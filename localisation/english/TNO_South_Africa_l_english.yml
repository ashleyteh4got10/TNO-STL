 HDV_SAF.236.t: "End of a Career"
 HDV_SAF.236.desc: "The elections in South Africa had come with one gut-wrenching conclusion: the United Party had no clear majority. In fact, they weren't even the biggest party! The harrowing news swept around the ranks of the members of the United Party, leaving behind only concern mixed with just a bit of depression.\n\nJacobus Strauss walked in De Villiers Graaff's private room behind the stage without knocking, with a thin smile on his face as he glanced at the Prime Minister. Eglin had barely held on to his seat, and with Div failing to uphold the party, Strauss would likely lead the party into a coalition with the NCP.\n\nThe Prime Minister was perched on his leather chair, still, in absolute silence. He flickered through the provided electoral data, creasing its sides over and over again, rechecking it to hope that it wasn't true, that there was some form of error. But it spoke all too clearly; the New Conservative Party had taken away his majority. It was over, not for the party, but for Div's career, that much is certain. The door to his office opened and Jacobus stepped inside, slamming it shut behind him. Div turned to look at Strauss, and the two men suddenly were locked into a silent battle of stares.\n\n"Get out, Jacobus. I have nothing to say to you."\n\n"Well, I do have something to say to you. You lost, you failed, now exit with some grace before I have to go and humiliate you in public. Actually, yes, do stick around, that will be much more enjoyable for me after all." Strauss walked out and slammed the door shut, leaving Div there alone, listening to the echo of the door slam fade away.\n\nThe Prime Minister flicked his lighter over the front of a cigarette, took a drag of it, and turned in his swivel chair to face the window that looked out over the city around the building. First, he had fought a struggle to keep the Union of South Africa together, and now, he had to struggle to keep a United Party together, and in that, he had failed. There was no doubt in his mind that his political career was now over, and he should take a bow and pursue a polite exit before his party would aggressively show him the door. It was a darned shame that Strauss would end up leading the United Party, but there was nothing he could do about that now."
