 #SAF_mass_produce_propaganda_desc: "Hertzog's National Party has betrayed you! For years they have plotted, funneling illegal weapons across our borders, inciting domestic revolts, and refusing to participate in elections. Surely they were scared that the people would reject their cowardly ideas. Now, against all heart and reason, they have pounced! We must not stand idly by! Our home will never be simply another Reichskommissariat. South Africa's vast natural beauty, as well as its splendor, belong to all Afrikaners! Not a decrepit tyrant in Germania or a traitorous cancer tolerated far too long. For our homes, our families, we must fight until our dying breath. The Dominion; a last bastion of continental liberty, must survive!\n\nMessages such as these are being mass produced to raise morale amongst both civilian and military communities."
