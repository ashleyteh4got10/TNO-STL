 #SAF_the_south_african_military: "The South African Military"
 #SAF_the_south_african_military_desc: "Our armed forces are the instruments of our state's security. In a war such as this, it is our obligation to not only sustain all of them but to improve them In the air, on the ground, or upon the seas, South Africa must fight to be victorious against any threats to our sovereignty.\n\nOur troops are our shield and our sword. And they will fight as their fathers have fought in the wars before. No matter the cost, no matter how long this war may go on, South Africa will prevail."
