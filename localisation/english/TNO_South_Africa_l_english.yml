 ### Ideas ###
 SAF_Boer_Viet_Cong: "The Boer Kommando Rising"
 SAF_Boer_Viet_Cong_desc: "Armed Afrikaner paramilitary groups aren't a new phenomenon in South African history. However, many of these groups, bolstered by strong public support and RK influence, are conducting operations in South African territory with the goal of overthrowing the government. We must deal with this problem, or a free South Africa will cease to exist."
 SAF_The_Empty_Throne: "The Empty Throne"
 SAF_The_Empty_Throne_desc: "Whilst South Africa officially still has a monarchy, in reality the throne has remained empty since the death of King George VI. With the government never having recognised either Edward VIII or Elizabeth II out of a desire to antagonize neither the OFN nor the Einheitspakt, the position of the monarch has remained in limbo for nearly a decade. Whilst the government has so far remained unwilling to budge on the issue, public opinion is increasingly asking why South Africa continues to have a monarchy at all."
 SAF_Desperate_Neutrality: "Desperate Neutrality"
 SAF_Desperate_Neutrality_desc: "Despite attempts by both the Germans and the Americans to pull the nation into their economic and military sphere, South Africa has strongly pursued a policy of complete neutrality in the Cold War. The nation has been lucky to inherit a lot of British military remnants and exiles after the end of the Second World War but chose to neglect its armed forces to focus purely on its economic development.\n\nConsequently, the South African army, navy, and air force are slowly decaying into a token force, and with no sense of military urgency South Africa sleeps at the wheel as the threat coming from the north grows stronger and stronger..."
 SAF_Desperate_Neutrality_tt: "Military Experience Gain: §R-100%\nCannot train units, disband units, or edit unit templates.§!\n§RGreatly decreases§! §Ymaximum§! and §Yminimal investment§! in §Yarmy funding§!.\n§RGreatly decreases§! §Ymaximum§! and §Yminimal investment§! in §Ynaval funding§!."
 SAF_Divided_Nation: "Divided Nation"
 SAF_Divided_Nation_desc: "South Africa has been quiet since the Second World War ended, with the United Party firmly in charge of the nation since 1934. Electorally strengthened by empowering the Coloured population and a boost in the Anglo population due to British exiles, the illusion of stability has become more and more fragile over time.\n\nThe suppressed Black majority population continues to call for equality and majority rule under the ANC while on the other end, the Boers cry out for the right to suppress anyone who is not white under the moniker of Apartheid. With the ever-stronger meddling in South African affairs by the German RKs in the north, the internal divisions grow to threaten the nation."
 SAF_Divided_Nation_2: "Divided Nation"
 SAF_Divided_Nation_2_desc: "South Africa has been quiet since the Second World War ended, with the United Party firmly in charge of the nation since 1934. Electorally strengthened by empowering the Coloured population and a boost in the Anglo population due to British exiles, the illusion of stability has become more and more fragile over time.\n\nThe suppressed Black majority population continues to call for equality and majority rule under the ANC while on the other end, the Boers cry out for the right to suppress anyone who is not white under the moniker of Apartheid. With the ever-stronger meddling in South African affairs by the German RKs in the north, the internal divisions grow to threaten the nation."

 SAF_Uncle_Sam_Arrives: "Uncle Sam Arrives"
 SAF_Uncle_Sam_Arrives_desc: "Hope is not lost yet, America and the OFN came to our rescue! With the might of the Free World and the arsenal of democracy on our side, we will defeat the Boers and their damned German allies."
 SAF_SOG_advisors: "SOG Advisors"
 SAF_SOG_advisors_desc: "The Americans, who have been a greater aid to us already than we would like to admit, have sent their SOG group to us. The Spec Ops Study and Observation Group are here to help bolster our own troops against the superior forces of the Afrika-Schild. Their expertise in unconventional warfare will transform our forces into a creative army, which will be able to quickly react to the stratagems of our enemy. No longer will we waste precious lives in pointless defences. Instead, our men will blend into the landscape they know so well and strike out only when they know they can win. Let the Germans come for now, we will envelop their armies and drive them out soon enough."

 SAF_CONTINUED_RESISTANCE: "Continued Resistance"
 SAF_CONTINUED_RESISTANCE_desc: ""
 SAF_Cape_Town_Massacre: "The Cape Town Massacre"
 SAF_Cape_Town_Massacre_desc: "The Cape Town Massacre has forever stained our hands with blood! The already unrestful populace is extremely angered at such a violent act. They've been preparing, amassing, and calling for all to protest on the streets.\n\nAll around, people holding signs gather near local government buildings and some of the few policing forces we have refuse to stop this treacherous act.\n\nOur road to recovery will be a herculean task."
 SAF_Army_Deployed: "Army Deployed"
 SAF_Army_Deployed_desc: "After the treacherous display from the police officers, it shows that we must take even further action to quell the Boers and their incitement of unrest. We must deploy our armed forces to areas of high resistance and continue the policing efforts employed.\n\nWhile the populace will become more aggressive due to this seemgingly hostile action, it is necessary to ensure the stability of South Africa."
 SAF_ANC_Riots: "National Party Protests"
 SAF_ANC_Riots_desc: "Protests and strikes called by the National Party have erupted across the nation have crippled our economy, something has to be done."
 SAF_icelandic_support_staff: "Icelandic Support Staff"
 SAF_icelandic_support_staff_desc: "The Icelandic Government has sent over a small envoy of highly trained doctors and nurses to help instruct and aid our young medics. Iceland possesses one of the most advanced healthcare systems, so their experienced systems and procedures used will be taught to us.\n\nWith this, we hope we can prevent more deaths whether on the battlefield or on the homefront."
 SAF_our_darkest_hour: "Our Darkest Hour"
 SAF_our_darkest_hour_desc: "As the Germans and Boers begin to overwhelm the country, this is most certainly the darkest hour in the life of our young republic. The situation may look bleak, yet despite the challenge now face we shall fight on and we shall never surrender!"
 SAF_boer_insurgency: "Boer Insurgency"
 SAF_boer_insurgency_desc: "The Boers plan to fight a protracted war once more, striking us the further we push into their territory. Our efforts to uproot their hideouts and warding off their raids have borne little fruit."
 SAF_boer_insurgency2: "Boer Insurgency"
 SAF_boer_insurgency2_desc: "The Boers plan to fight a protracted war once more, striking us the further we push into their territory. Our efforts to uproot their hideouts and warding off their raids have borne little fruit."
 SAF_surprise_attack: "Surprise Attack!"
 SAF_surprise_attack_desc: "When the Ossewabrandwag took up arms en masse against the South African state, we were caught with our pants down. They moved swiftly and unexpectedly in organizing themselves into a ramshackle state with an organized militia, fully capable of dealing crippling blows to our forces. We are still reeling from the shock.\n\nWithout a doubt, we must step back and re-organize our efforts before we proceed, else we risk being blindsided by the Ossewabrandwag once more."
 SAF_Coluna_Infernal: "Iberian Counterinsurgency Units"
 SAF_Coluna_Infernal_desc: "Portugal produced perhaps one of the finest self-trained guerrilla fighters the world has ever seen. Their years of experience, ruthless methods and knowledge of the terrain have proven tremendously effective in hunting down Boer insurgents in the African Bush, earning them nicknames such as 'Os Terriveis', 'A Coluna Infernal', the 'Terrible Ones', and the 'Troops from Hell'"
 SAF_Coluna_Infernal_2: "Iberian Counterinsurgency Units"
 SAF_Coluna_Infernal_2_desc: "Portugal produced perhaps one of the finest self-trained guerrilla fighters the world has ever seen. Their years of experience, ruthless methods and knowledge of the terrain have proven tremendously effective in hunting down Boer insurgents in the African Bush, earning them nicknames such as 'Os Terriveis', 'A Coluna Infernal', the 'Terrible Ones', and the 'Troops from Hell'"
 SAF_USLANTCOM_benefits: "Benefits of USLANTCOM"
 SAF_USLANTCOM_benefits_desc: ""
 SAF_chaos_behind_lines: "Chaos Behind Our Lines"
 SAF_chaos_behind_lines_desc: "Missing material caches, wrong coordinates, massive supply issues, random surprise attacks. These problems started to appear pretty recently, and as consequence the frontline has become much harder to control. If we cannot turn the situation quickly enough, this chaos will overwhelm our army."
 SAF_American_training: "American Training"
 SAF_American_training_desc: "With the war in full swing, America brought over material support and military advisors to support our army. We can use the expertise coming from the strongest military in the world so our troops can learn the modern art of war on the field of battle."
 SAF_Unconventional_Tactics: "Unconventional Tactics"
 SAF_Unconventional_Tactics_desc: "As the war endures, we find ourselves under ever increasing pressure from the combined forces of the Reichskommissariats and the Boer insurgency. To counter these pressures, we have developed a plethora of robust and unconventional stratagems to employ against the Germans and Boers. Ambushes. Insurgency. Psychological warfare. Fighting behind their lines. Every step closer our enemies take towards our borders will make them grow ever more fearful of what tricks the South Africans have up their sleeves. More often than not, our foes find their ranks already noticeably depleted by the time they reach the lines of conventional battle."
 SAF_Unconventional_Tactics_2: "Unconventional Tactics"
 SAF_Unconventional_Tactics_2_desc: "As the war endures, we find ourselves under ever increasing pressure from the combined forces of the Reichskommissariats and the Boer insurgency. To counter these pressures, we have developed a plethora of robust and unconventional stratagems to employ against the Germans and Boers. Ambushes. Insurgency. Psychological warfare. Fighting behind their lines. Every step closer our enemies take towards our borders will make them grow ever more fearful of what tricks the South Africans have up their sleeves. More often than not, our foes find their ranks already noticeably depleted by the time they reach the lines of conventional battle."
 SAF_Unconventional_Tactics_half: "Unconventional Tactics"
 SAF_Unconventional_Tactics_half_desc: "As the war endures, we find ourselves under ever increasing pressure from the combined forces of the Reichskommissariats and the Boer insurgency. To counter these pressures, we have developed a plethora of robust and unconventional stratagems to employ against the Germans and Boers. Ambushes. Insurgency. Psychological warfare. Fighting behind their lines. Every step closer our enemies take towards our borders will make them grow ever more fearful of what tricks the South Africans have up their sleeves. More often than not, our foes find their ranks already noticeably depleted by the time they reach the lines of conventional battle."
 SAF_Unconventional_Tactics_half_2: "Unconventional Tactics"
 SAF_Unconventional_Tactics_half_2_desc: "As the war endures, we find ourselves under ever increasing pressure from the combined forces of the Reichskommissariats and the Boer insurgency. To counter these pressures, we have developed a plethora of robust and unconventional stratagems to employ against the Germans and Boers. Ambushes. Insurgency. Psychological warfare. Fighting behind their lines. Every step closer our enemies take towards our borders will make them grow ever more fearful of what tricks the South Africans have up their sleeves. More often than not, our foes find their ranks already noticeably depleted by the time they reach the lines of conventional battle."
 SAF_Unconventional_Tactics_RK: "Unconventional Tactics"
 SAF_Unconventional_Tactics_RK_desc: "On the open battlefield, our forces had no trouble whatsoever with the outdated army of South Africa. We were able to quickly overrun them in similar fashion to the Second World War. However, recent developments have given us more trouble than we would like to admit. The South Africans are beginning to utilize methods of warfare that we had not anticipated. The enemy now hides, making full use of their landscape to avoid direct confrontation. We now face ambushes and traps rather than conventional battles. Our soldiers are struggling to adapt to this dramatic shift in the war. Unless we can adjust equally as quickly, we suspect that the fight will rage on for longer than we could have anticipated."
 SAF_Unconventional_Tactics_RK_2: "Unconventional Tactics"
 SAF_Unconventional_Tactics_RK_2_desc: "It seems that sudden ambushes and concealed explosives were the least of our concerns. Even as our troops begin to adjust to guerrilla warfare, the South Africans have begun changing their tactics one again. Ambushes are starting to take place behind the lines, focusing on our supply columns and bases. The men are suffering mentally from the constant raids too, as no matter where they are, the chance of an attack becomes increasingly common. The structure of South African divisions are shifting too. When captured, they have nothing of value to tell us, as their units now operate independently from their own high command. We must meet this problem head on."
 SAF_Unconventional_Tactics_RK_3: "Unconventional Tactics"
 SAF_Unconventional_Tactics_RK_3_desc: "The days of swift victory over South African soldiers seem like an almost distant memory now. Now we find only new and frustrating surprises on the front lines and behind them. Our troops might take several miles of ground in a day, only to be driven back by their camp being set ablaze during the night. The issues with supplies continue, as the South Africans always seem to know which routes we are using, as we discover when our trucks detonate mines buried in the dirt. Even our air force now useless, as trying to bomb underground targets is a gamble at best. What scant few casualties we inflict pales in comparison to what the South Africans inflict with each of their raids. Nowhere is safe now, and there is very little we can do about it."
 SAF_Caribbean_support_staff: "Caribbean Research and Support Staff"
 SAF_Caribbean_support_staff_desc: "Scientists and engineers may be all the West Indies can offer to support us in our fight, but they have performed to a standard of excellence in their tasks assigned. Under their watch, roads which lay incomplete for months were finished in weeks, kinks both known and heretofore unknown in the Force's weaponry were summarily ironed out, and techniques were introduced which improved our research labs' productivity by leaps and bounds. We are quite indebted to the West Indies for the exemplary individuals they have sent in our aid."
 SAF_sao_tome: "The São Tomé Lease"
 SAF_sao_tome_desc: "São Tomé and Principe is a calm, underdeveloped backwater off the coast of Iberian Guinea. At least, until the Iberians came to an agreement with us to use it as a refueling and supply station. Since then, it has been a vital stop for transport ships and warships alike - in addition to its close proximity to Reichskommissariat Zentralafrika, allowing for reconnaissance and covert operations behind enemy lines to expand."
 ANG_USN_Blockade: "American Patrolled Waters"
 ANG_USN_Blockade_desc: "The Sixth Fleet of the United States Navy diligently sets sail upon the seas of South Africa. Whilst officially present upon a "humanitarian endeavor", the vessels of the Sixth Fleet are ever vigilant over South African waters. Any incursions that we may have hoped to make into South African seas would now be doomed to a cold rest upon the ocean bed."

 SAF_lessons_first_civil_war: "Lessons of the First Civil War"
 SAF_lessons_first_civil_war_desc: "Back during the South African War, attacks by Boer guerillas were a constant and traumatizing occurrence, cutting down units with little more than a half dozen men. Now though, with the Volkstaat's collapse, the tables have turned. The tactics of the Boers shall now be their, as well as the rest of our enemies', worst nightmares, just as it was ours."
 SAF_wraak: "Wraak"
 SAF_wraak_desc: "We've been through a lot. Our nation first suffered siege and fell under the grip of the Germans. Then, under the Boers, our people were forced out, made to either die in camps further north or forced to labor in the cities we used to call home. While we've dragged through the mud and back, we're still kicking. There is an apt word to describe the feelings we harbor towards our enemies that can be taken from their own dictionary: "Wraak", or in English, revenge."
 SAF_dissident_military: "Dissident Military"
 SAF_dissident_military_desc: "The military of the reestablished South African Republic is far from some of the organized and cohesive military units that surround it. Its ranks comprise members from both sides of the last civil war, and as a result disputes and fights amongst ranks are a common sight. This has hindered the military from acting in a cohesive manner, limiting combat effectiveness."

