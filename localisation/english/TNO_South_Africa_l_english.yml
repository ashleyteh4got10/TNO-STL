 HDV_SAF.71.t: "Hell in the North"
 HDV_SAF.71.desc: "Once again, all of them were in attendance hanging over a large map of the entire Southern half of Africa as if the war had not ended at all. But rather than discuss troop movements or the latest arrival of volunteers to the war, all of them were reading through reports of what was happening across the northern border.\n\nJan Hofmeyr sank into his chair, suddenly feeling very old as he looked over the initial reports. He had always known that Ostafrika was a terror state, a black blot of murder, violence, and institutional genocide but that something like this could happen was absolutely beyond him. Huttig had killed the other two Reichskommisars and had annexed their lands to form one mega-state, and the reports coming in from stories told by many refugees made it clear just what kind of hell was occurring there. He pulled off his glasses and just sat there in a daze as the reports kept rolling in.\n\n"There is no way that this abomination on the map is going to last." Graaff spoke up with a resolute tone. "Look at it, all that being administered by a genocidal German, Huttig something, it's going to fall apart in the end. Even the Germans themselves have pulled support, what a farce. They spent all that effort trying to conquer us and it blew up in their faces." A thin smile appeared on his lips that got somewhat wider. "What I'd give to be a fly on the wall in the Fuhrer's office, to feel Africa slipping from your grasp and there is nothing you can do about it."\n\n"How can you smile, when you know what kind of hell on earth is happening to the north?" Jan glanced at him with dismay.\n\n"Jan." Div put his hand on his shoulder. "It means that we are safe, and South Africa is safe from the Germans forevermore. That great, hellish black blob on the map is already on the way out, and the Germans will not be able to salvage anything from it. As terrible as it is, there are serious upsides to it." Div glanced at Eglin with a stern stare.\n\n"I take it we should slow down the rate of demobilization, and further move to secure our borders. As for the refugees, we need to let in as many as we can and try to resettle them in appropriate locations. There is no way to justify invading this hell state, the nation is tired of war. At least we can help as many people as possible to escape from there."
 HDV_SAF.71.a: "Stand your ground, and wait for it to fall"

 HDV_SAF.72.t: "Hell in the North"
 HDV_SAF.72.desc: "Once again, all of them were in attendance hanging over a large map of the entire Southern half of Africa as if the war had not ended at all. But rather than discuss troop movements or the latest arrival of volunteers to the war, all of them were reading through reports of what was happening across the northern border.\n\nJan Hofmeyr sank into his chair, suddenly feeling very old as he looked over the initial reports. He had always known that Ostafrika was a terror state, a black blot of murder, violence, and institutional genocide but that something like this could happen was absolutely beyond him. Huttig had killed the other two Reichskommisars and had annexed their lands to form one mega-state, and the reports coming in from stories told by many refugees made it clear just what kind of hell was occurring there. He pulled off his glasses and just sat there in a daze as the reports kept rolling in.\n\n"There is no way that this abomination on the map is going to last." Graaff spoke up with a resolute tone. "Look at it, all that being administered by a genocidal German, Huttig something, it's going to fall apart in the end. Even the Germans themselves have pulled support, what a farce. They spent all that effort trying to conquer us and it blows up in their faces." A thin smile appeared on his lips that got somewhat wider. "And those stupid idiots in Pretoria who got their freedom only to be chained to this hell state, well, they got what they deserved in the end."\n\n"How can you smile, when you know what kind of hell on earth is happening to the north?" Jan glanced at him with dismay.\n\n"Jan." Div put his hand on his shoulder. "It means that we are safe, and South Africa is safe from the Germans forevermore. That great, hellish black blob on the map is already on the way out, and the Germans will not be able to salvage anything from it. As terrible as it is, there are serious upsides to it. And of course, the Boers are in far greater trouble than us, even though they won the war." Div glanced at Eglin with a stern stare.\n\n"I take it we should slow down the rate of demobilization, and further move to secure our borders. As for the refugees, we need to let in as many as we can and try to resettle them in appropriate locations. There is no way to justify invading this hell state or the Boer puppet chained to it, the nation is tired of war. At least we can help as many people as possible to escape from there.""
 HDV_SAF.72.a: "If only there was a term for enjoying the misery of others."

 HDV_SAF.73.t: "The Portuguese Connection" #Not in use because HDV_SAF.30 was scrapped.
 HDV_SAF.73.desc: "The [1674.owner.GetAdjective] ambassador sat down with the Prime Minister who had courteously greeted him. Relationships between the two nations had steadily grown ever since Iberia sent aid and even troops to defend South Africa. With the final establishment of borders, South Africa now controlled quite a bit of Mozambique, a former Portuguese colony that the Germans had stolen about 15 years ago. Immediately, as expected the [1674.owner.GetAdjective] government had immediately filed a request to have the land returned to them, something that Div was confident that the Americans would disapprove of. Yet trade with [1674.owner.GetNameDef] seemed a promising idea and further security collaboration between South Africa and [1674.owner.GetNameDef] could be a beneficial idea to both, despite their ideological differences. Luckily, Graaff had come up with a scheme to make everything work and keep everyone happy in the end.\n\n"Mister Ambassador, thank you for joining me. I have read your request to have your colonies returned to you, and unfortunately, I must decline it. South Africa will continue to administer these lands from here on out, for the sake of connected stability overall."\n\nAs the ambassador stood up to protest Div raised his hand. "However." He paused for effect. "South Africa is and remains a nation that respects the will of the free market, and of property ownership free from unlawful seizure. This territory and its assets were unfairly stolen from your people, seized by the same German menace that right afterward tried to destroy South Africa altogether. As such, South Africa will return any land, factories, and other assets as long as their previous owners can provide adequate proof of ownership."\n\nGraaff gave the ambassador a bit of a nod. "You can inform your government that we will be more than lenient on the evidence side of things, provided that we can sign a comprehensive trade and investment agreement in the near future. I believe that further cooperation between our nations will be most beneficial and profitable and wish to convey my warmest sympathies to your government. Mozambique is now and shall be South African land, but no one will get in the way of your economic interests there.""
 HDV_SAF.73.a: "Neocolonialism arrives to Mozambique"

