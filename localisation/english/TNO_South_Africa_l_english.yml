 SAF_american_companies_deal: "Deal With American Companies"
 SAF_american_companies_deal_desc: "In our struggle against tyranny and darkness, material aid is of vital importance. We must begin making overtures for foreign support, and American corporations are an obvious choice. Outside of the German sphere and friendly to our way of life, we should be able to strike up an amiable arrangement."
 SAF_buy_american_guns: "Purchase American Guns"
 SAF_buy_american_guns_desc: "As our working relationship with the OFN increases in scope, it has become possible to purchase American arms en masse. They may charge a steep price, but each rifle in the hands of our boys is one the fascists cannot have!"
 SAF_tech_support_industry: "Request American Industrial Research"
 SAF_tech_support_industry_desc: "Perhaps the most well known quality of the United States, beyond its natural splendor, is its industrial potential. American advisors may be called abroad, bringing their vast technical knowhow to the factories of the Cape. We must redouble our production efforts and find innovative ways to reach peak efficiency!"
 SAF_tech_support_infantry: "Request American Military Research"
 SAF_tech_support_infantry_desc: "While we are a proud nation, there is only so much we can do. We may call American military theorists to our nation. If we can analyse our doctrinal and equipment failures as they occur, we may just stand a chance against these bastard invaders."
 SAF_american_companies_deal_big: "Award a Major Contract"
 SAF_american_companies_deal_big_desc: "Our war has attracted many interested parties abroad. If we were to bestow a major military contract, we might discover new innovations. The price will surely be steep for a nation at war, but the benefits just make that an acceptable loss."
 SAF_buy_american_guns_big: "Purchase a Large Shipment of American Guns"
 SAF_buy_american_guns_big_desc: "Like a hungry monster, the war demands more and more from our people. We must supplement our ailing reserves with a larger shipment of guns."
