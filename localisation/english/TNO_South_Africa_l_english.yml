 SAF_rebuilding_saf: "The Reconstruction of South Africa"
 SAF_rebuilding_saf_desc: "South Africa has been broken in many places, torn up by shelling, arson, and terrorism. Right now, a mass reconstruction program is taking place to fix these miseries. Military governors with emergency powers are being dispatched across South Africa to coordinate the responses in various localities. South Africa will recover from this disaster, and it will recover stronger and more united than before."
