y upon those who stay long after their time is up, and to stay on would be quite a risky endeavour, to say the least. He was going to miss the power, influence, and prestige granted to him by the position of Prime Minister, but this was for the best."
 HDV_SAF.240.a: "And with a heavy heart, he closed the door behind him."

 HDV_SAF.241.t: "Prime Minister Raw"
 HDV_SAF.241.desc: "The man of the hour, the most influential politician in South Africa, proudly took centre stage surrounded by different journalists from all around the world. The smile on his face was simply unshakable, dressed in his finest bespoke suit as he basked in the glorious attention, while Strauss had quietly entered the building behind him to get to work or something, it didn't really matter anyhow. Raw waved his hands to get the hustle and bustle to quiet down, and it did.\n\n"Ladies and gentlemen, South Africa has spoken, and it has spoken ever so clearly. While the United Party was once straying towards the foolish idea of endless concessions to those who seek to debase our standards. South Africa is a place of gentlemen working together for a better tomorrow that will uphold our traditions and our way of life.\n\n"The threat of the Ossewabrandwag has been dealt with, but the endless rabble-rousers of the African National Congress are still looking to push their heinous communist vision on South Africa. We will stand firm in the face of this threat and dismantle them with a firm and decisive hand. Only then will true stability return to the Cape, and only then can we all prosper.""
 HDV_SAF.241.a: "There will be order on the Cape."

 HDV_SAF.242.t: "A Letter From Div"
 HDV_SAF.242.desc: "Dear Vause,\n\nCongratulations on your electoral achievement; it must not have been easy to found a party and instantly lead it to great success in these elections. As you ascend to the role of Prime Minister, I must caution you on what it really entails to lead this fine nation and how to move it forward.\n\nSouth Africa is a nation steeped in tradition, a proud descendant of the British Empire, and it still continues to be led by fine gentlemen like you to this very day. Yet it would be unwise to completely persist in the harsher measures that you so fiercely advocate for. To be a good Prime Minister means to be adaptable and flexible to the ever-changing times, before you are caught off guard, and the United Party has proudly resisted any and all calls to institute the Apartheid plans of the National Party since the year 1948.\n\nIn hindsight, I had done too little to prepare for the war, hoping in vain that the Germans would prove to be a decent, honourable people and not a brutal horde out for world domination. I was unwilling to adapt to the changing times, and it nearly destroyed South Africa as a result.\n\nI do not doubt that you will make a fine Prime Minister, as long as you keep your eyes open and stay on your feet. Flexibility and pragmatism are, after all, the finest traits of a British gentleman.\n\nShould you need further advice on matters, I will always be available to offer advice.\n\nSigned,"
 HDV_SAF.242.a: "£SAF_div_signature"

