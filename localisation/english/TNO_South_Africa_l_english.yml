 HDV_SAF.80.t: "A Gentleman Victorious"
 HDV_SAF.80.desc: "The room was as silent as could be as the election results were read out on South Africa One, the English-language television network. Once the number of seats won by the United Party was read out guaranteeing another stable majority despite the conservatives splitting from the party, the room burst out in cheers and celebrations with De Villiers Graaff in the center. Anything else didn't matter at the moment, like the gains made by the other parties against the UP, the party would go on for another five years.\n\nIn front of the television cameras, Div was lifted in the air by the crowd, with his nickname being shouted over and over. Champagne corks flew in the air, and orange, white, and blue confetti rained down everywhere. After the moment of excitement had passed Div was carefully lowered down and took up place in front of the microphones.\n\n"To people of South Africa." He paused for effect. "I thank you for your support for me and the United Party. The times have not been easy, and it has been a great struggle to defend ourselves. But freedom still reigns, and we still shine on as the finest, richest, and freest nation in the entire continent of Africa!"\n\n"Here, on the cape, our ancestors have settled and built up a paradise that shall remain free forevermore, and it is the United Party that has led you to prosperity and shall do so for five years more! And as your Prime Minister, I assure you, that all shall be right in this nation. The reconstruction must be completed, and beyond that shall lie a new golden age where we hit heights that others can only dream of. To South Africa!""
 HDV_SAF.80.a: "The First Gentleman shines on"

