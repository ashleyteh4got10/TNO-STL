  # Ending Slides
 HDV_CountryClosing_epilogue_SAF_ANC_OFN_Ending: "South Africa was victorious, not just keeping the Boers in line but also pushing back the Germans. From the Cape to Quelimane to Windhoek, South Africa now controls a vast amount of land, bigger than what could ever be imagined before. But as peace returns, everyone knows that it can only be temporary. Overextended in the control of large territories, the Cape now governs vast regions with many different people living within them, all demanding their freedom rather than being part of the Rainbow Nation.\n\nEven Graaff knows that this cannot be held together, and the United Party's time in power is coming to an end as majority rule will certainly mean that the ANC peacefully rises to power, to try and handle the decolonization of the vast new South African territory. Thus, the great game of trying to decolonize these areas without chaos or violence breaking out. The nation can ill afford to get involved in another conflict and thus it will have to come down to a tenuous period of decolonization. If the house of cards is not properly lowered piece by piece, the whole thing may collapse once again." #temp till it gets reviewed
 HDV_CountryClosing_epilogue_SAF_ANC_Pakt_Ending: "South Africa survives, shattered, shrunken, yet still alive. With the mighty armies of the Shield standing high, the Boers have ripped themselves from South Africa to chain themselves to the Germans. Yet the Cape still stands, and any attempt to destroy South Africa has been refuted and destroyed. Peace has returned to South Africa, and a new day rises where the nation moves towards equal opportunity for all and a move towards majority rule.\n\nThe United Party stands to lose power in the upcoming elections to the ANC, yet it seems to be something that will help bring more stability in the long term as new opportunities open for the Rainbow Nation." #temp till it gets reviewed
 HDV_CountryClosing_epilogue_SAF_ANC_Tie_Ending: "South Africa still stands. Those who had sought not just to split it apart, but conquer it have failed, and their machinations have completely become undone. Although South Africa is unified in the technical sense, the split between the people who make up the nation remains unsolved. Through force, the Boers have been kept in line while being greatly weakened by the conflict. But weakened does not mean finished, as the Boers will as always seek to again take control over South Africa.\n\nBut the transition towards fair and equal majority rule has been taken and the date of the election draws closer and closer. As much as there is great unease in the United Party over the fact that they stand to lose power, the overwhelming sense that this could bring more long-term stability to the nation that has long been divided pushes the process forward." #temp till it gets reviewed
 HDV_CountryClosing_epilogue_SAF_Racism_OFN_Ending: "South Africa was victorious, not just keeping the Boers and the ANC in line but also pushing back the Germans. From the Cape to Quelimane to Windhoek, South Africa now controls a vast land, bigger than what could ever be imagined before. But as peace returns, everyone knows that it can only be temporary. Vastly overstretched in control of grand territories, the Cape now governs vast regions with many different people living within, all calling for a different kind of freedom from the kind that South Africa offers.\n\nEven Graaff knows that this can't be held together, not with all the armies of the world, and thus the great game of trying to decolonize these areas without chaos or violence breaking out. The nation can ill afford to get involved in another conflict and thus it will have to come down to a tenuous period of decolonization. If the house of cards is not properly lowered piece by piece, the whole thing may collapse once again." #temp till it gets reviewed
 HDV_CountryClosing_epilogue_SAF_Racism_Pakt_Ending: "South Africa survives, shattered, shrunken, yet still alive. With the mighty armies of the Shield standing high, the Boers have ripped themselves from South Africa to chain themselves to the Germans. Yet the Cape still stands, and any attempt to destroy South Africa has been refuted and crushed. Though peace has returned, the nation's citizens mourn the loss of their once-bright hope for a truly egalitarian state, which was suppressed into obscurity in the 1960s. The remaining state continues to suffocate any thoughts of change, benefiting the minority Anglo and Coloured populations while crushing dissents with unprecedented force. However, with South Africa now a full member of the OFN, unignorable pressure from inside and out mounts upon the United Party to finally move towards equality and majority rule. But that rule is nowhere to be seen on South Africa's horizon. And so, as De Villiers Graaff sits in his dilapidated office, only one phrase reverberates through his head, over and over again: has anything really changed at all, Prime Minister?"
 HDV_CountryClosing_epilogue_SAF_Racism_Tie_Ending: "South Africa still stands. Those who had sought not just to split it apart, but conquer it have failed, and their machinations have completely become undone. Although South Africa is unified in the technical sense, the split between the people who make up the nation remains unsolved. Through force, the Boers and the ANC have been kept in line while being greatly weakened by the conflict. But weakened does not mean finished, as both sides seek to again take control over South Africa and the game of power continues like it did before.\n\nBut the United Party stands on the verge of a split, while the American pressure will surely ramp up over time to push the transition towards majority rule. But De Villiers Graaff is nothing but flexible and is already trying to scheme out how to secure his power in the new age" #temp till it gets reviewed



