 SAF.210.t: "The De Villiers Cabinet"
 SAF.210.d: "In the name of the monarch of South Africa, I hereby appoint the following as members of the cabinet in the government run in their name.\n\nDeputy Prime Minister: J.F.H Hofmeyr\nMinister of Defence: Colin Eglin\nMinister of External Affairs: Jacobus Strauss\nMinister of Finance: Vause Raw\nMinister of Agriculture and Forestry: Senator H. G. Swart\nMinister of Economic Development: Frank Waring\nMinister of Education: Ray Swart\nMinister of Interior Affairs: Patrick Wall\nMinister of Justice: Harry Lawrence\nMinister of Labor: Henry Tucker\nMinister of Lands and Irrigations: Douglas Mitchell\nMinister of Mines: Senator Steenkamp\nMinister of Native Affairs: Margaret Ballinger\nMinister of Cape Coloured Affairs: Abe Bloomberg\nMinister of Posts and Telegraphs: Radlyffe Cadman\nMinister of Public Works: J. D. Opperman \nMinister of Transport: Pieter Graham Van Byl\nMinister of Welfare: Zach de Beer \nMinister of Public Health: Douglas Smit\n\nChief of the General Staff: Hendrik Klopper\nChief of the Union Defence Force: Charles Fraser\nChief of the Air Force: Fritz Theron\nChief of the South African Naval Forces: Hendrik Biermann"
 SAF.210.a: "£SAF_div_signature"

 # Events (HDV_SAF)
 HDV_SAF.1.t: "A Tapestry Unfolding"
 HDV_SAF.1.desc: "The desk of De Villiers Graaff was remarkably more organized than normal even as today (and most other days) it was swamped with correspondence. Overlooking the many intelligence reports, cabinet notes, political summaries, and two newspapers that were sprawled across his desk was the Prime Minister of South Africa going about his usual work of re-gluing the nation that seemed to fall further apart by the day back together.\n\nDespite the Prime Minister's ability to miraculously walk a neutral path between two wildly opposing forces, this particular week saw two especially violent forces crashing down upon him with more magnitude than he had ever seen before.\n\nOn account of one pile of intelligence reports stacked on his right side describing the ever increasing economic links between the Afrikaners and the Germans to the north, Graaff decided it was in his best interests to deal with the growing militarism of the Afrikaners in a way that could end it all. After all, Afrikaner militias continued to swell in size while the tone of the political debate surround it seemed to harden more and more.\n\nOn the other side of his desk was another stack of papers concerning the African National Congress, an organization that sought to stand up for the underprivileged African and Bantu inhabitants of South Africa. However as of recent, an ever-growing group of militants and extremists who seeking to undermine the peace, stability and the precious status quo that Graaff had spent many years carefully building up had infiltrated the very heart of the ANC. Graaff then decided it would be best if he dealt with this instead for the sake of the peace in South Africa.\n\nStanding up to reach the telephone beyond the infestation of documents in front of him, his foot slid upon a loose report underneath his chair; the Prime Minister's flailing arms came crashing down onto the mountain of papers causing a shower of beige and white to come spilling off each side of his desk. Picking himself up and slumping back into his chair, Graaff knew at that moment he would have to eventually choose a side to favour, regardless of the violence it would cause, for the sake of himself and his office cleaner."
 HDV_SAF.1.a: "So much for an organized desk."

 HDV_SAF.2.t: "The Gentlemen on the Left"
 HDV_SAF.2.desc: "Deputy Prime Minister Jan Hendrik Hofmeyr, a loyalist Afrikaner, adjusted his glasses and smiled as Defense Minister Colin Eglin entered his office. The two men firmly shook hands and Hofmeyr offered his partner in politics something to drink. Despite the very different lives they both had lived, both men were very much upon same page. Hofmeyr was an intellectual turned politician whereas Eglin had been a soldier serving all across Africa in the Second World War, after which he took up politics to represent the interests of South Africa's veterans.\n\nYet both of them had a common cause: to push forward moderate progressive measures to ensure national stability which were heavily at odds with the more conservative wing of the party who staunchly defended the current status quo. In the middle of the two wings stood Prime Minister De Villiers Graaff, a visionless figure holding both flanks of the party together through a pragmatic, ideology-free method of balancing everyone's interests.\n\n"You know him best, Jan. Is he really going to try and appease the National Party long after we all know it did not stop Hitler? In fact, it only ever enabled him. If the British and French had gone to war with him in 38', we could have been saved from all of this misery." Eglin remarked with a bitter undertone.\n\n"I've been doing my best to preach for a pragmatic approach towards our problems, but he remains a slippery eel, not willing to do more than token reforms to try and appease both sides."\n\n"Even when the Germans are openly supporting and arming the Ossewabrandwag across the border? He knows that as well as we do!"\n\n"Graaff sits in the middle, but once he finally realizes that the status quo can't just hold and more is needed than fruitlessly appeasing the Afrikaners I am sure that he will come over to our side. Without a shred of sincerity, of course, but if that is what gets things done...""
 HDV_SAF.2.a: ""Then let's get it done.""

 HDV_SAF.3.t: "The Gentleman on the Right"
 HDV_SAF.3.desc: "Vause Raw was the main figure on the United Party's right flank or he called himself, "a South African from proper British stock". Raw had made it his mission to uphold the traditional position of the white British elite that has decisively ruled South Africa since the end of the Second Boer War in 1902. While he did not necessarily agree with Graaff's wishy-washy, colorless approach to politics, he nevertheless supported the Prime Minister since his effectiveness and efficiency in protecting the interests of the ruling elite was well established. At least, so it had been in the past, but he and everyone around him knew that the situation on the ground was getting ever worse. The Ossewabrandwag continued to cause trouble despite their exile whereas the communists in the ANC seemed to be able to thrive despite serious efforts taken to suppress them.\n\nIn his mind, there only was one proper course of action, to decisively act against the Native upstarts who preached such falsehoods as equal rights, land redistribution, and an end to segregation. At the same time, this would once and for all prove to the Afrikaners that their interests were also best represented by the United Party and in one swoop secure the nation from this creeping period of crisis that now seemed to be upon them. The voices of secession would be silenced for good by decisive action against the upstart rabbles and dissident communists! It was a foolproof plan that only an idiot wouldn't consider putting into action.\n\nAfter all, there is nothing more important than keeping up law and order, no matter the price paid for it. Both the Africans and the Afrikaners would learn their proper places at the same time, working underneath the wise leadership of the Anglos who's rightful claim to forever dominate these lands would be upheld with firm force."
 HDV_SAF.3.a: "Keep calm and carry on."

 HDV_SAF.4.t: "And Below"
 HDV_SAF.4.desc: ""Yes, Ambassador... No, Ambassador... We can sort it out, Ambassador... Certainly, Ambassador..." The call dragged on and Jacobus Strauss did his best to keep his patience with the German Ambassador's demands. "No, Ambassador, that was not our intention. Certainly not, we are upholding only our right as a neutral nation to-."\n\nHis promotion to Foreign Minister of the Union of South Africa was more a case of De Graaff throwing him a bone after Strauss lost the leadership election to him rather than him having an ambition of having to hear about Germania's complaints. Now he was stuck playing the monotonous game of neutrality, trying to balance the tug of war between two superpowers each with deep claws into South Africa. Trade and investment by one was then countered by trade and investment from the other and in the middle South Africa seemed to thrive as the economy boomed and the nation developed rapidly.\n\n"Thank you, Mr. Ambassador. Good day." He slammed the phone down on the stand and leaned back with a subdued grunt of frustration. The game of diplomacy was one he had gotten quite good at, but it stung to have to deal with the complaints of the Germans and Americans alike.\n\nHe glanced up at his assistant who walked into the room. "The Prime Minister is calling on line one, sir."\n\nStraus gave her a nod and the assistant left the room. With a frustrated glare, he stared at his phone, took a deep breath, and then picked it up for what seemed to be the millionth time today."
 HDV_SAF.4.a: ""How can I help you, Prime Minister?""

 HDV_SAF.5.t: "Law and Order"
 HDV_SAF.5.desc: "The smallest conference room in Cape Town had been stuffed with all of the United Party's politicians, every one of them wondering why on earth Villiers de Graaff had called the meeting such a ridiculous way. Graaff upon raising the question on how to handle the developing crisis on the Cape. The day's central debate between the different flanks of the party however were meticulously watched by the Prime Minister who did not engage much in the debate. The surprisingly gentlemanly debate between Eglin and Wall that lasted carried on for too long was broken when finally Graaff raised his voice. "Enough!" And the entire room went silent.\n\nHe rose from his chair. "It is abundantly clear that the ANC cannot be reasoned with. Their radicalization continues with no end in sight and we are all well aware of how deeply the communists have infiltrated their ranks, hoping to turn South Africa into a totalian Marxist dictatorship. This nation is a union of two peoples, the Afrikaners and the Anglo's, and everyone else should know their place in life and stick to it."\n\n"Only a hardline crackdown against the ANC, its allies, supporters, and operatives will bring peace to South Africa. Raw nodded with great approval, while Hofmeyr backed out of the room, not bothering to listen to the rest of the Prime Minister's speech.\n\n"We need to invest everything in strengthening our internal security operations, halt their protests, undermine their operations, and show once and for all exactly who is in charge of this nation. With their concerns eased by our actions, the National Party's belligerence will end up fading out once again. I ask you all to participate in this plan for our people and South Africa! Only quick, decisive action against the ANC will help bring stability to our nation.""
 HDV_SAF.5.a: "And with that, Hofmeyr's dreams were crushed by the applause of his own party."

 HDV_SAF.6.t: "Steering Into the Iceberg"
 HDV_SAF.6.desc: "Hofmeyr took off his glasses and rubbed his eyes. He felt disoriented, frustrated, and in despair over Graaff's announcement of a nationwide hardline crackdown on the ANC, something that if anything was going to only end up widening the crevasses that seemed to spread throughout the nation without end. Violence would only ever beget violence, and now it seemed like the pragmatist in charge had completely lost the plot.\n\nHe decided that this was too much, and he would have no part of this foolish path towards disaster. With the utmost conviction, he grabbed pen and paper and began to write a formal letter of resignation that laid out in formal, yet damming language how Graaff's machinations would only ever work to spread chaos, violence, and even war itself. Not just war, but civil war, and, he added, that South Africa had know inclination what the Germans might do when the country tatters on the edge of destruction. He doubted if he could prevent it, but at least he would not put his name under this horrific mistake. As he had expected, Eglin entered looking as frustrated as him. He sat down opposite him, glancing at what he was writing. "What are you doing?"\n\n"Writing my resignation, effective immediately. Villiers Graaff has lost his mind, and I am not going to be held responsible for what may follow."\n\n"What? No, that is the wrong way to go about it. If you resign, you won't have any political influence anymore, and you can't steer the nation away from this disaster. As frustrating as it is, we must stay in place to try and get Graaff to walk back more and more of this. The moment his plan falls apart, we stand ready to immediately pick up the pieces and get to fixing this. Jan, you must stay in place and work this from the inside, for the people of South Africa." lin reached for the letter and tore it to pieces before forcibly shoving it in the trash can to the right.\n\n"We can still fix this, Jan, it will just take a lot of hard work to do so.""
 HDV_SAF.6.a: "Progress is never easy, but always worthwhile."

 HDV_SAF.7.t: "The Threat Abroad"
 HDV_SAF.7.desc: "The smallest conference room in Cape Town had been stuffed with all of the United Party's politicians, every one of them wondering why on earth Villiers de Graaff had called the meeting such a ridiculous way. Graaff upon raising the question on how to handle the developing crisis on the Cape. The day's central debate between the different flanks of the party however were meticulously watched by the Prime Minister who did not engage much in the debate. The surprisingly gentlemanly debate between Eglin and Wall that lasted carried on for too long was broken when finally Graaff raised his voice. "Enough!" And the entire room went silent.\n\nHe rose from his chair. "It is now abundantly clear that the Ossewabrandwage is dead set upon a violent separation, spurred on by the Ostafrikan government who coddles them in exile. It is true that the ANC is a deep and everlasting concern, but I don't see them reaching leading ever growing armed millitia's. The threat from the Osssewabrandwag is deeply serious, and their influence continued to grow."\n\nRaw stared him down with a frustrated glare, while a thin grin came across Hofmeyr's face. "The OBW, white as they may be, have decided on a path of violent treason against South Africa itself and will have to be dealt with absolute force. I ask you all to participate in this plan for our people and South Africa! Only dealing with the OBW will help bring stability to the nation.""
 HDV_SAF.7.a: "And with that, Vause's concerns grew ever more."

 HDV_SAF.8.t: "An Idiot in a Suit"
 HDV_SAF.8.desc: "It was the biggest nonsense that Vause Raw had ever heard. Focussing on the OBW in the north over the threat that reached deep into the entire country? De Villiers Graaff had finally lost his mind, the slippery, slimy idiot must have had his head filled with the babbling of that detatched idiot Hofmeyr. How could the Prime Minister think that this would even fix the problems with the Native majority? While he despised the OBW as much as the rest of the United Party, they simply did not have the numbers or power to make any serious difference unlike an awakened mass of Natives that would rip down the established order.\n\nImmediately he began to consider splitting away from the United Party. He knew he could get plenty of like-minded associates to form a new party that would continue to uphold the current state of things in a proper, civilized way.\n\nYet would that not just end up empowering the National Party, the treacherous lot up north that seem so eager to work with the German enemies of Anglo Civilization? The idea of weakness in front of the Afrikaners put him off the idea for now. As displeased as he was by De Villiers Graaf's turn to appeasement, he refused to hand the advantage to the parliamentary opposition who were seemed as much as a concern to South Africa as the ANC was. After all, as idiotic as the progressives were they did indeed back the instrument of Anglo power that was the United Party.\n\nFor now, he would stay in place and see how things work out. After all..."
 HDV_SAF.8.a: ""A true gentleman should never act rashly""

 HDV_SAF.9.t: "A Problem Contained"
 HDV_SAF.9.desc: "De Villiers Graaff was a contented man. His decision to strike the ANC with decisive action had paid off dividends. The ANC was on the run, or locked up, or further withering away from a moderate path which would be their undoing in the end. Now they had become terrorists, demagogues, and extremists, who would only further legitimize the police and military treatment of them.\n\nOne section of papers finished; he pushed it aside to focus on the latest state of the Afrikaners. The more he read, the more concerned he got. Did these people not realize he was cracking down on their behalf, so they no longer needed to secede from South Africa at all? But while the ANC had changed by a lot, the Afikaners seemed to act as if nothing had changed, as if all the orders he had enforced meant nothing to them. Hertzog continued to hold speeches against him and the VP, while reports of German interference and support of the Boer militias continued unabated.\n\nUngrateful, that's what they were. South Africa had served their interests just as well as those of the British but apparently, they were consumed with bitterness of the loss of their independence in 1902. A lifetime ago, and yet here they were continuing to gather strength against the state, dead set on ripping the nation apart to become German puppets, at best. Their slaves, at worst.\n\nThe creeping, frustrating feeling of having made a mistake by focusing on the ANC, not the Afrikaners. Not that he would ever admit it to anyone. Graaff leaned back in his chair, his unease calming as a smirk crept across his face. He would figure this out, and continue to play the ANC and the Boers off each other, just like he did with the two superpowers that were trying to turn his nation into another pawn on the chessboard of geopolitics"
 HDV_SAF.9.a: "Whether things rise or drop, De Villiers Graaff will be on top."

 HDV_SAF.10.t: "Adaptations"
 HDV_SAF.10.desc: "Patrick Wall glared at the Prime Minister in silence, waiting to hear whatever foolish policy he had conjured up now. The smiling snake in a suit sat behind his desk reaching for a set of folders and sliding them across the table. "Wall...with the changes to our voting system, the ANC will be an electoral force to be reckoned within 1965."\n\n"By your hand." Wall immediately leaned forward and pointed his finger in an accusatory fashion, his weight shifting forward. "By your choice."\n\n"Yes." Without changing his expression, Graaff continued unabated. "And with that in mind, the United Party will have to field Coloured candidates in the next election to secure a key voting block for the long term, ensuring that they will be voting VP in the future instead of forming their own political party, or even worse, siding with the ANC. With that in mind, I have already instructed a further expansion of our outreach program and further development aid for Coloureds, on top of making sure that we will have more of them in local government positions as well. Here are the folders of several promising candidates for the next elections."Graaff relaxed into his chair preparing for the useless and futile retort from Wall.\n\n"You weak-minded pathetic... you have gone too far with all of this, and there are many more of us in the Party who think exactly the same! Surrendering this nation to them, what a disaster that would be! You can have my resignation, from my position, and from the party as well." Wall spat back.\n\n"I am securing the party's power in the New South Africa. The Coloureds are only a means to that end. Now, you can split off, take as many as you like, and end up handing over power to the National Party, I honestly do not care. Or you can stay, and continue to take part in this government, pushing your cause as members of our United party. It is best to be part of the power structure, instead of standing outside with no recourse to whatever may follow..." He took Wall's frustrated silence as the end to a successful meeting. "Have a pleasant day, Patrick. Thank you for coming.""
 HDV_SAF.10.a: "It was progress, but safe, incremental, and controlled."

 HDV_SAF.11.t: "The Prime Minister Speaks"
 HDV_SAF.11.desc: "The Prime Minister's words were broadcasted around the nation, by both television and radio, heralding an audience of millions of different people from across his country.\n\n"Fellow South Africans. The nation finds itself in a moment of crisis, and thus the government has made drastic decisions for the sake of the benefit of all. We have begun to heavily crack down upon the African National Congress and the web of communist infiltrators that back it."\n\n"Temporary restrictions upon assemby in specific regions will be heavily enforced, and our efforts to root out these dark webs of marxists and totalitarians shall be intensified."\n\n"At the same time, the system of local militias will come to be disbanded. Only the police, overseen by democratically elected politicians will be there to protect the communities and cities of our fine nation. I want to emphasize to everyone that vigilantism is a crime and any who partake in it will be swiftly and definitively dealt with."\n\n"Thank you, and good night." As he finished his speech, Graaff smiled, fully confident that his oratory skills would once again sway the peoples of South Africa to the side of the United Party."
 HDV_SAF.11.a: "Only time will tell."

 HDV_SAF.12.t: "An End to Neutrality"
 HDV_SAF.12.desc: "Where there once was a system, neatly organized by source and date, was now only chaos. A swamp of papers with seemingly no beginning or end inhabited Graaff's desk, whose mind was equally as messy and disorganized. The man sitting behind the desk had deep swelling bags under his eyes and even though he had tried to hide it, to everyone around him, he seemed to have aged ten years in about ten days. The phone on his desk frantically screamed, but the Prime Minister left it to pierce the air with its shrill accusatory jabs. Everything he had worked for, everything he and his Party had achieved, and within just one day, now it had all come to naught as the Afrikaners were overrunning the entire country. This wasn't just about secession, no, this was about conquering the entire nation of South Africa for the Germans.\n\nAnother round of ringing, and De Villiers Graaff picked up the phone. On the other side was Eglin, sounding about as distressed as he was. "Prime Minister, I wanted to let you know that the German colonies are moving to join the war on the side of the Afrikaners, attested to by them moving their forces southward. We are doing our best, but at this point, our only hope is being rescued by the Americans. For now, all we can do is hold back the oncoming Afrikaners long enough for the Yankees to show up."\n\n"How long do we have?"\n\nA moment of silence fell, making Graaff doubt for a moment that the connection was lost. Then, finally, there was a response from Eglin. "I don't know."\n\n"Thank you." Graaff said before slamming the phone down. He hesitated for a moment, in a semi-lucid state, his eyes glued to the phone which dangled by its cord. There was nothing left of South Africa's precious neutrality, and now all he could do was get to on his knees and beg the Americans to come to the rescue against the oncoming German onslaught. Any attempt to contain the situation was deemed by the Afrikaners and South Africa as a failure, leaving everything in doubt.\n\nHe had always prided himself on his capacity to keep his options as open as could be only to pick the best one out of them, but now he did not have any other choice left. With a heavy heart, he snatched the now dented phone from the air and punched in the number of the American Embassy. While waiting for the man on the other side to pick up, Graaff braced himself for the conversation ahead."
 HDV_SAF.12.a: ""About time Prime Minister!""
 
 HDV_SAF.13.t: "One hell of a view"
 HDV_SAF.13.desc: "The jungle trees passed by at a great pace as the continuous drumming of the helicopter's blades continued without end. The American-supplied helicopter with the flag of South Africa quickly painted on it was making its way northward for a surprise strike against an Ostafrikan supply depot. The entire crew was tense, except for one member who seemed to be paradoxically Zen in the moment of great tension before all hell would break loose\n\nin the right door gunner's seat, Richard Rinders gazed over the impressive display of the jungle before them. In the distance, he could see the Indian Ocean beckoning to him, the sun rising over the waves in the east making for a lovely spectacle. For a moment, just a moment in this hellish war he saw true beauty. It was almost like he could see the sea in motion, glistening against the rising sun indicating the start of another day. His eyes were locked on the sea in the distance, and he couldn't help but smile\n\nsound of small arms fire whizzing by immediately woke him up, as the Heli swayed to the right to dodge incoming fire. Immediately Richard checked his M60 and then opened fire, trying to focus on aiming but through the chaos of the situation ended up spraying randomly across the vista that he so adored. Regaining his focus, he opened fire upon a car driving across a jungle road and seemingly ripped it to shreds\n\n"ETA FIVE MINUTES!" The pilot screamed from the front of the Heli. Richard swept some sweat from his eyebrow as the tension once again bore down upon him. He glanced back to the sea, only to find that their direction had changed, and he couldn't see it any longer. Instead, he checked his gun and then readied himself for what was to come."
 HDV_SAF.13.a: "A simple moment in time, never forgotten"

 HDV_SAF.14.t: "Clearing Day"
 HDV_SAF.14.desc: "Anthony Vickers glanced at the soldiers coming and going into the armory that he had guarded for five years now. He was aware of how critical the situation was on the front, and how much of an existential war this had become for South Africa with the interference of the Afrika Schild. The first wave of withdrawals from "his" armory had come just before the war kicked off with the increase of tensions. The second came when the Schild kicked in, and entire rooms of weapons were cleared out and shipped off by rail.\n\nBut today's events were absurd, no doubt about it. While the armory had been severely depleted, it still had its oldest weapons, practically relics in storage kept from the Boer wars and World War I. Mauser C96's, Kar 98, Lee-Enfields, he could even see a Colt Single Action Army gun from the old West be loaded into a crate and then shipped off\n\nAt some point, he couldn't resist and loudly spoke up against the corporal who oversaw the complete clearing of his armory. "What good is that old junk going to do in this war? 60-year-old guns are not going to cut it in the face of modern German weaponry."\n\n"We're in the middle of equipping militias, anything that can still shoot is good enough. Now stop staring at us, get to carrying boxes, and help us get this thing done already!" Reluctantly Anthony got to work while feeling sorry for the poor sods who would have to go to war while wielding only relics and leftovers"
 HDV_SAF.14.a: "A sign of desperation"

 HDV_SAF.15.t: "Silence"
 HDV_SAF.15.desc: "The patrol approached the clearing in the jungle silently, with the point man moving through the trees to try and get a clear view of what was there when the smell of cooking hit him. Not cooking no, meat, jerky, barbeque, something of the sort. Glancing from behind a tree into the open space he could see the remnants of what used to be a village, burnt to the ground. Several mounds of ashes indicated where houses once stood, and the white bones poking through the soot indicated that the people within had been burned alive.\n\nThere was a central fire pit to the right where the charcoal rains of an unknown number of people lay in twisted, horrific remnants. Above all, what struck the patrolman was the silence of it all. Perhaps he had gone suddenly deaf, but he simply couldn't hear a thing around here, not even the buzzing of flies or the sounds of the jungle. Sound had long left his place, the voices of those who lived here silenced by the servants of a system of death and destruction.\n\nIn about ten seconds, he overlooked the entire thing and then turned back to his patrol group with a quick pace. He glanced at his fellow soldiers with a strange, distant look in his eyes as he came up with the next course of action. "We're going to move around this clearing. No hostiles, but you do not want to see what has happened here. Mark it as a grave on the map, and let's get the hell out of here."
 HDV_SAF.15.a: "Requiescat in pace"

 HDV_SAF.16.t: "Supply and Demand"
 HDV_SAF.16.desc: "As an ever-strong advocate for a free market, De Villiers Graaff was well aware of his situation. For many years South Africa had managed to play the Americans against the Germans for its benefit, managing relationships with the Fuhrer's cronies in the north and the American companies that operated on South African soil to create a fine (and very profitable) balance. But now, the ungrateful Afrikaners and their Schild puppet masters had thrown everything overboard to try and take over all of South Africa in this horrific war.\n\nHe no longer had a choice in the matter of picking his partners. The Americans would have to save South Africa, but at the same time, they would be able to push their major advantage in all economic negotiations. The demand for American support in this existential war was unending, and they could easily reduce the supply of support to any level they saw fit. All of which left him in a horrible negotiating position.\n\nSo here he was, selling off bits and pieces of his economy to the Yankees to try and shore up support and keep the lend-lease coming into the Cape. The only strategy he had left was to cooperate with the American businessmen who frequented his office nowadays to ensure their entanglement in South African affairs. This in turn would have these influential figures lobby the government for more direct support so as not to lose their investments in the case of a German victory.\n\nAs much as he regretted selling out, the alternative was far worse. The laws of supply and demand were harsh and painful, but much better than having a German jackboot forever pressed down upon South Africa."
 HDV_SAF.16.a: "The price of victory"

 HDV_SAF.17.t: "The Next Front"
 HDV_SAF.17.desc: "The South African Department of Communication had been hastily slapped together once the true scope of the war came in. Artists, writers, government officials, and bureaucrats all work in an old newspaper publishing plant in Cape Town to tackle a very vital front of the war, namely the propaganda side of things.\n\nThe DoC was the true place where information was gathered, assessed, given the right spin, and then sent out to the world to try and strengthen South Africa's position...or at least the perception of it. Evidence of Afrikaner and German atrocities was gathered up, given commentary, and then sent out to the International news media day after day, their enemies gleefully providing them with enough evidence of why the South African cause was just and honorable.\n\nAt the same time, any mistakes were polished and repackaged, and if that was not possible simply suppressed, with any trace of evidence destroyed for good. The printing press was running 24/7 to produce posters and pamphlets that would be distributed around the nation all of which proclaimed the glory of the South African army and the nation while the major newspapers and radio stations all had representatives there. The final arm of course was television and cinema newsreels which showed the South African view directly to the South African people. The Department of Communication could not change the reality on the ground, but it could change the perception of it amongst the wider public, which was a power all of its own."
 HDV_SAF.17.a: "Information is the greatest weapon of all"

 HDV_SAF.18.t: "Heading down the Road"
 HDV_SAF.18.desc: "The truck rushed down the backroad at a great pace, bouncing up and down with the bumps in the road. All in all, it was not exactly comfortable, but Truus Vroetman accepted the situation. In the back, she had critical supplies for the front, or so she was told by her commander. It was still strange for her to think of herself in a military structure, but when the call came out for women to join the Army Supply Corps in supportive roles she nevertheless answered the call.\n\nNot because she felt driven to the defense of her nation, no, two other things pushed her to move. The wage offered was quite good, and she planned to keep at this job for a while to help pay her bills. Secondly, she was hoping to run into her husband Leanard somehow. It was a fool's errand with how large the front was, but perhaps there would be some luck shining on her to talk to him in person, and not have to wait for his next letter to arrive.\n\nSuddenly, the road in front of her seemed to break open as machine gun fire from above ripped through it. Truus tried to hit the brakes, but moments later the bullets shredded the cabin and ignited the equipment stored in the back. By sheer luck, Truus had not been hit, but the fire behind her seemed to spread rapidly. As much as the truck was starting to slow down, she could feel that she did not have enough time to wait for it to stop fully. Acting on instinct she opened the car door and jumped out while the truck continued to travel down the road now fully ablaze.\n\nCovered in scratches and minor injuries, Truus rolled to a stop on the grass next to the road, letting out a moan of pain and agony. Slowly she got up, glancing at the fireball moving forward in the distance that exploded with great force. The shockwave knocked her back, off balance as she fell in the grass.\n\nBreathing heavily and completely disoriented, Truus could do nothing but look up at the sky as the world seemed to quiet down around her."
 HDV_SAF.18.a: "Risk, Reward, Regret"

 HDV_SAF.19.t: "Displacement"
 HDV_SAF.19.desc: "The truck stopped, and soon after the back doors opened a soldier glanced at the assortment of villagers that had been huddled inside the back of it. "Come out, welcome to homes." The soldier said, in a broken version of IsiZulu, the language of the Zulu. From the looks on their faces, they were not happy at all. Who would be, after being forced off the homeland of your ancestors, dragged to a fortified village a few hours away?\n\nThe group of them climbed out to look out at a hastily constructed village, with a palisade and small defenses around it. One of the houses was even missing part of the roof and everything seemed shoddily built from the cheapest materials possible. On both ends of the village stood a watch tower manned by two soldiers overlooking everything with a gun in hand.\n\nAs the eldest figure of the group tried to once again argue with the soldier the man merely responded with a glare and a point at one of the groups of houses. He stepped back and watched them unload whatever sparse goods they had and highly reluctantly take occupation of the hut. The looks on their faces and the tones of how they spoke made it abundantly clear to the soldiers what they thought of the entire situation.\n\nHe knew that his whole program was a sham, something that had been hollowed out somewhere in the chain of command and a half-baked idea to put into poor execution with the expected outcome to be disastrous in the end. Everyone on the ground knew it but the higher-ups did not care about the reality of what was happening.\nBut orders were orders, thus here he was, trying to make something of a short-sighted policy cooked up by half-wits far away in Cape Town. With the matter of getting the new arrivals settled for now, he decided to resume his patrol of the hamlet, the frustration on his face matching that of the Hamlet's displaced occupants."
 HDV_SAF.19.a: "Complaining would not change anything, after all"

 HDV_SAF.20.t: "The American Solution"
 HDV_SAF.20.desc: "The map was definitely in need of replacement after being drawn on several times already, but commander Jack Lewison felt that one more go at it wouldn't be a problem. Hovering over the map of German Sudwestafrika he had marked out the approximate locations of German strongpoints on the road towards the small port town of Lüderitz. Glancing at his American counterpart sitting across the table, eyes hidden behind sunglasses and sipping an American beer from a can. He began to lay out his plan on how to take the town, marking down movements as he worked through his plans.\n\n"We should move north to cut the road from Aus to Lüderitz, and as soon as our supply situation allows it, we should move left around the town to encircle it fully."\n\nThere was a bit of a laugh from the American, who lowered the can and shook his head. "Jackie, Jackie, you're still thinking all wrong about it. We're near the shore and I've got a direct line to the Fleet and the Air Force. Here's the new plan." He grabbed the marker and drew a straight line from the south towards Lüderitz.\n\n"We're just going to bomb everything standing between us and this city from the sea, land, and air until Fritz croaks. No need to sacrifice our guys when we can just smash them with 155 mm over and over." He put the cap on the marker and chucked it in the middle of the map"
 HDV_SAF.20.a: "And thats how it's done"

 HDV_SAF.21.t: "Racial Bureaucracy"
 HDV_SAF.21.desc: "Richard Falkinson stared at Patric Meleta with a smile, the Caucasian inspector glancing at the Coloured bureaucrat in a rather smug fashion. "I know what you're doing, Patric." He shoved several files across the table, with notes and markings on them, in all caps "RACES CHANGED" over them. "You thought no one would figure out about you giving Blacks the Coloured race registration, do you? Did you really think you'd get away with breaking the law?"\n\n"Breaking the law?!" Patric pushed back, knowing full well the jig was up. "These people look like me, for God's sake, but for some reason, they don't get the same rights as me, it's an absolute outrage. I'm only doing what is correct and fair."\n\nRichard leaned forward, staring him down. "You're a criminal, falsifying records and defrauding the state." Yet, right after that he leaned back and went right back to smiling. "You think you're some kind of hero, some kind of savior? Well then, that's going to cost you. From now on, you'll give me an envelope containing cash that's worth 20 percent of your monthly wage, and I will let your pathetic heroism slip by. Or I can expose you and testify against you where after you can enjoy a lovely vacation stay at Robben Island for the next five years. Best make up your mind soon before I leave to file a report directly to the right people."\n\nPatric remained dead silent, eyes locked in with Richard with a quiet, subdued fury. He wanted to scream at the man, but he knew that it would do no good. After about ten seconds he gave Richard a very small, subdued nod.\n\n"Well then, it was a pleasure doing business with you. I'm expecting my first envelope next week." Richard stated in a mocking tone, as he gathered up his evidence and left the room leaving behind a deeply frustrated man. Yet Patric was relieved that he could continue to do the right thing, even when it would now cost him dearly."
 HDV_SAF.21.a: "The price of principles"

 HDV_SAF.22.t: "Distant Visions"
 HDV_SAF.22.desc: "After much development in the scientific field, South Africa has clearly emerged from the murky waters of technological obscurity, yet it has done so in it's own peculiar and unique way. The blooming televised landscape has grown immensely powerful while remaining as divided as the country that they broadcast to. Originally introduced in 1952, following the wider example of the more advanced nations of the world, TV sets began broadcasting a singular government controlled channel in the evenings. State newscasts were followed by both imported British and American television programs greatly bolstering support for these powers in South Africa's fractured Anglo-majority.\n\nMeanwhile, in the lands of the Afrikaners, the television is seen as one of its greatest threats, especially by Albert Hertzog who frequently denounces television as a great evil that would strengthen modern and anti-Afrikaner values in South Africa. The Afrikaner firebrand insists the effect of the "British misinformation" on children, the less developed, and other races, thus emphasizing the importance that it should be opposed with great vigor.\n\nFor the Coloureds, meanwhile, access to television continues to grow over time with both private purchases of television as a prestige product as well as communal television access in community centers in the poorer regions, allow people of any status to be able to still follow the latest TV program or hear the United Party's version of the news where the government is always portrayed in a positive light.\n\nFinally, for the native people of South Africa, television remains a luxury that few have only heard of but have had little access to. Some communities pool money together to purchase a television but for most of them, the state-controlled radio would have to do. Pirate radio broadcasts by the ANC popped up from time to time, continuously pursued by a government, eager to stamp out different voices.\n\nFor as much as television has been fought against and restricted, it had already made its mark on South Africa as a unique staple on its inhabitants lives and will continue to do so for the foreseeable future."
 HDV_SAF.22.a: "A microcosm of the nation"

 HDV_SAF.23.t: "People of Colour"
 HDV_SAF.23.desc: "Coloureds, so their Caucasian overlords called them. People of mixed races of both European, Indian, Khoisan, and even Indonesian heritage had come into being because of South African history being a wild tapestry of different peoples coming in from across the world. Mainly living in the western side of South Africa and the Cape region the Coloureds took up a special ranking within the arbitrarily enforced racial ranks of South Africa. Separate from the black population, the Coloureds made up much of South Africa's lower to middle class. Factory workers, shopkeepers, lower-level bureaucrats, and farmers, the Coloureds made up a key group within South Africa.\n\nThe great advantage of this artificial classification of many different people was that they were allowed greater privileges than the black population. They had the vote but could only elect white parliament members which didn't always serve their goals all that well, while locally a few coloured politicians were elected to councils in the Cape region.\n\nNevertheless, it was clear that the ruling elite of South Africa did see them as an ally against the ANC with specific outreach organizations and even a well-funded government program to advocate for the material interests of the Coloured people serving as another support base for the Verenigde Party. After all, if these people were able to thrive without really threatening the power base of the VP, everyone would benefit from this cooperation in the end. Except, of course, those who were classified differently and excluded from these benefits on purpose."
 HDV_SAF.23.a: "A not great, not terrible life"

 HDV_SAF.24.t: "Paperwork"
 HDV_SAF.24.desc: "The hand walked across the intelligence report about the situation in the north and stopped at the date. Once spotted, it grabbed the file and placed it in the proper location. Div's good old system of organizing paperwork on his desk was finally restored to what it was.\n\nThe hectic days were over, and life could return to normal. Well, normal, perhaps not. Many things had changed since the Afrikaners first attacked, chief among them was the fact that he was now under the American Eagle's wing, and pressure from Washington on matters of equality was growing by the day.\n\nThe demographics simply were not on his side, and he was left now figuring out how to keep on to his power during peacetime that he so firmly had managed during wartime. At war, the United Party, and the countries' ranks closed in this great struggle for their freedom, but now that it was settled, they would quickly drift back to the division that would make staying in power more complicated than it was before.\n\nWith his current term of office coming to an end, there was only one way to go about it. To quickly and efficiently kickstart the reconstruction of South Africa and lead into a new election right after the first positive results were visible.\n\nAfter all, all that mattered to him was whatever it took to stay in power."
 HDV_SAF.24.a: "Time to pick up the pieces"

 HDV_SAF.25.t: "Mopping Up"
 HDV_SAF.25.desc: "The American M113 rushed through the savannah flatlands north of the cape, skidding across the landscape at high speed. Inside, the six soldiers were all dressed in American outfits and wielding American guns, yet all of them were South African, born and raised.\n\nUp in the distance, a large half-destroyed farmhouse came into view. It seemed unremarkable and abandoned yet soon enough a crack of gunshots rang out from the upper floors. The vehicle's gunner immediately opened fire, spreading a hail of bullets across the farmhouse, focused on its upper floors. With a screech, the vehicle came to a halt and the men rushed out the back, moving to flank the farmhouse from both the left and right while the M113 itself started up again and pushed forward to try and draw away fire.\n\nThere was shouting and cursing in Afrikaans as tense gunfights commenced in the building. However, one of the soldiers did not directly enter from the side, moving further along to the back of the building where he could see three armed people sprinting from the back. Unfortunately for them, Micheal Longstreet was a farm boy who had grown up as a hunter and it was not that difficult of a shot.\n\nThe first of the runners fell over, his scream of agony clearly heard. The second tried to zig-zag but was too predictable and keeled over when Mike pulled the trigger an extra two times. The third looked back at his fallen companions and suddenly stopped running. He dropped his gun, raising his hands over his head, and turned around to face Mike.\n\nMike looked the man right in the eye, looking him over. An older fellow, perhaps in his fifties with his hair turning grey stared back at him. He motioned the man to approach him with his right hand while keeping his rifle aimed with one hand. As the older man got closer Mike finally spotted his red, white, and black armband on his right arm."
 HDV_SAF.25.a: "Another easy shot"

 HDV_SAF.26.t: "Open Doors"
 HDV_SAF.26.desc: "Retooling the South African Department of Communication to peacetime was not complicated, as the need to push domestic and foreign propaganda remained strong. When the order from above came in to begin promoting immigration into South Africa as their next priority, it did not take long for the OFN and selected neutral countries such as India to be flooded by advertising about South Africa as the next golden frontier.\n\nA land lush with fertile farmland, gold, and diamonds, with much more land still to be settled and developed where the down on their luck could find a new life. A free land, that had stood firm against the onslaught of Nazism and would now rise as a Phoenix in the south. A new life awaits you in South Africa, the chance to begin again in a golden land of opportunity and adventure.\n\nOf course, the thing that was not said was that this new immigration initiative was merely just another power play by the United Party to stack the deck demographically against the majority Black population. Immigrants from the wrong racial groups would find sudden bureaucratic barriers pop up, making their entry into the country far less likely or even silently impossible while everyone else was let through without issue.\n\nIt was apparent though that the push was a success as new waves of immigrants seemed to arrive to the Cape week after week, hoping to build a better future for themselves in this distant land."
 HDV_SAF.26.a: "A new land of opportunity"

 HDV_SAF.27.t: "A Delivery of Steel"
 HDV_SAF.27.desc: ""One hundred rand?" The Coloured farmer glanced with great frustration at the White owner of the scrapyard located just north of Eastern London. "I have a damaged tank for you, with some work it can even be restored and sold off to the army, and you want to pay me just one hundred rand for it." It was simply outrageous; he had put all this effort into tying this tank to his tractor and hauling it over here only to get rebuffed with a sum he thought far too small.\n\nThe owner meanwhile took another glance at the tank, its side profile showing two hits having gone through it and killed its occupants, of which several remnants remained within the husk of the vehicle.\n\n"It's not as easy to get anything usable out of these tanks as everyone seems to think. I need to clean it, cut it open, break it down into little bits, and find out what there is even a market for. Now, here's what we'll do, either I take this thing off your hands for one hundred rands, or you can fuck off and haul this big pile of trash elsewhere where I don't have to stare at it."\n\n"Two hundred." The farmer retorted immediately.\n\n"One twenty, take it or leave it."\n\nWith a glance back at the gaping hole in the side, he bit his lips, let out a sigh, and then shook the man's hand.\n\nImmediately the man's behavior changed to a sort of faux, hollow politeness as he motioned to the building located in the center of the scrapyard. "Come on into my office, my friend, and let's sort out some paperwork and you then can be on your way back home one hundred and twenty rand richer.""
 HDV_SAF.27.a: "Tanks into ploughshares"

 HDV_SAF.28.t: "Demobilization"
 HDV_SAF.28.desc: "Adriaan Voormann walked through his home village of Bruinerweg for the first time in three years. It had been a long hellish time far away and alone from his Truus. As he turned the corner, he saw with great relief that the house was still intact just as he had left it to meet the call of his country.\n\nHe pulled out his key and opened the front door, the smile on his face never quite stopping. He had exchanged regular letters with his wife while he was at the front lines which had kept the loneliness at bay, but his heart had been waiting for this moment for a long time.\n\n"Truus? Truus! Truus, I am home!" With great excitement, he stepped into the kitchen, yet the moment was broken when his wife rather than embrace him quickly turned away, averting her gaze in an almost panicked way. He could hear her breathe heavily, and she seemed to shake in distress.\n\n"What? What is wrong, Truus? I am home, it's me. Adriaan, I am back home for good." Slowly, Truus turned around showing her face to him, and how horrifically one side of it had been scarred. Her destroyed right eye was covered up with an eyepatch and she burst into regretful tears.\n\n"TRUUS!" Immediately he stepped forward, embracing her and hugging her tight, whispering nothing but sweet things in her ears. After she had calmed down a bit more, she still wouldn't look at him, shame overtaking her.\n\n"Truus." He forced her to look at him, her one blue eye still coated in tears. "I will always love you, no matter what happens. I have always loved you, in good or bad times, till death do us part.""
 HDV_SAF.28.a: "Happy endings do happen sometimes"

 HDV_SAF.29.t: "Declaring an Outcome"
 HDV_SAF.29.desc: "Loud complaints turned into protests, which then turned into riots. The moment the Prime Minister's speech had finished, unrest broke out in several places in the nation which was answered in force by the riot police.\n\nOne executive decision, the outcome of the referendum on the monarchy had been declared null and void. The votes of those who had soon after committed to a course of treasonous secession would not be counted towards the result, leaving the result decisively in favor of the monarch. This was immediately followed up with an announcement that Queen Elizabeth the Second would be reinstated as the rightful monarch of the Union of South Africa.\n\nYet in most cities, townships, and villages in South Africa the outcome was celebrated. Any empathy for the Afrikaners that had thrown the nation into its greatest crisis in its history was minimal and the Prime Minister's statement that "Treason invalidates representation" was accepted to wide acclaim.\n\nMany hoped that the matter would now be settled for good, though the way it happened would perhaps lead to this issue being brought back into the forefront later down the line."
 HDV_SAF.29.a: "God save the Queen, God save South Africa"

 #HDV_SAF.30.t: "SCRAP"
 #HDV_SAF.30.desc: "SCRAP"
 #HDV_SAF.30.a: "SCRAP"

 HDV_SAF.31.t: "Nazionalization"
 HDV_SAF.31.desc: "For twenty years, South Africa had balanced between the two superpowers, keeping open and neutral relations with both America and Germany. Yet like many other things in the South African war, or as it was coming to be called by some the "War of the Homeland", had brought great change to the nation.\n\nAll ties with Germany would forever be broken, and the northern border would become one filled with barbed wire and proper defenses so nothing like what had happened in 1963 could ever happen again. It had been profitable to trade with the Reichskommissariats in the north and ship raw materials to Germania, but those very profitable ties had forever been broken.\n\nThe bad news did have one upside to it though. The German investments in South Africa no longer had any connection to their owners, and with the severing of ties (and the permanent military presence of the American eagle) the new "Nationalization of Hostile Property" act was passed through the parliament would seize all German investments and sell them off to the highest bidder. The quickly called "Nazionalisation" swept through the nation, shutting down companies and properties, and quickly selling them off on an auction attended by major companies from around the OFN, as well as domestic ones.\n\nEveryone knew that this was the last windfall of a long and profitable relationship between Germany and South Africa, the final way to profit off the neutral diplomacy of the past."
 HDV_SAF.31.a: "The Germans reaped what they sowed"

 HDV_SAF.32.t: "The Beacon of Liberty"
 HDV_SAF.32.desc: "If there were any big winners in this conflict, it was Colin Eglin. The minister of defense had been working together with the Commandant General of the Union Defense Force Hendrik Klopper to not just win the war, but to at the same time modernize the entire UDF to American standards. Letting in as much American influence into South Africa would end up with the Americans then being able to leverage that influence to ensure that the UP would have to take more progressive measures down the line.\n\nThe preparations for the modernization of the UDF had been going on in the background during the war, and now with the grand demobilization and the shrinking of the army to a more normal size all outdated elements could finally be swept away.\n\nOld equipment was to be scrapped; retirements to be forced upon those figures in the military who were opposed to the American approach. At the same time grand training efforts by the Americans were set up to train the current and next generation of South African soldiers in American warfare, and hopefully to spread the good American values amongst those who would defend the nation's freedom with their lives if need were.\n\nThe final section of American influence was all in equipment and weaponry. Contracts were signed for long-term deals with plenty of American companies while South African defense companies were trying to break into the wider OFN market"
 HDV_SAF.32.a: "An all new, All American Military"

 HDV_SAF.33.t: "Choosing our Specialization"
 HDV_SAF.33.desc: "placeholder pick one option"
 HDV_SAF.33.a: "Desert"
 HDV_SAF.33.b: "Hills"
 HDV_SAF.33.c: "Jungles"

 HDV_SAF.34.t: "A Veteran at Peace"
 HDV_SAF.34.desc: "The farmstead surrounded by swaths of grapefields, an hour north of the Cape, hosted a family that had come over from the British Isle just before its collapse. Preferring a South African climate rather then one of Canada, the family peacefully integrated with the locals and had been living with them ever since. The grandfather of the family was a moustached older man, a military veteran of both the First and Second World Wars with a lifetime of experience that he gladly passed on to the South African Union Defence forces until his retirement in 1958.\n\nNow, he had finally earned the time to spend with his cherished family, and the time to begin the grueling yet satisfying work on his autobiography. With an enthusiastic swoop of the pen, he crafted a riveting, thrilling story of a man rising in the world; first serving in the Great War, he battled through each engagement with inspiring ferocity before being gravely wounded by a sniper near Méteren. Climbing against all adversity, he returned to lead a unit just two decades later, his natural talents allowing him to scale the military ranks with ease.\n\nDespite his best efforts, the Second World War was a bitter and sorrowful defeat. Here he handed out nothing but scornful insults to those who he considered guilty of Britain's complete collapse in the face of the Nazi menace while he stuck, helpless in Africa.\n\nIn his opinion, though, the final section of his book was a complete letdown. Exiled, he described a career in rebuilding the Union Defence Forces, before finally falling into a pityful retirement. His story ended there, with a whimper of a blank, trackless, colorless non-ending as he retired to his family's farmstead after a lifelong career of serving the lion, even after it had fallen."
 HDV_SAF.34.a: "His time was through, so it seemed."

 HDV_SAF.35.t: "A Cancelled Retirement"
 HDV_SAF.35.desc: "There was a loud knock on the door to Div's office right as the Prime Minister was trying to read up on the developing situation in Pretoria, and the violent assaults executed against the people of South Africa by the Boers, spurred on by their German allies. He raised an eyebrow as he was not expecting anyone at the moment, least of all the figure that barged into his office without waiting for a response.\n\nA mustached old man, at least 70 years old from how thin he looked, wearing an old British uniform and decorated Baret from the Second World War stepped into the Prime Minister's office with large, energetic strides. He turned to face the PM, giving him a polite nod while staring him right in the eyes.\n\n"Prime Minister de Graaff." The man began. "I have never stopped following developments regarding the Boers and their schemes. This whole thing has been horribly mismanaged, and the situation is only getting worse and worse. Clearly, you need someone with a lifetime of experience to take control of the defense of South Africa, and that is why I am here to request to serve South Africa once again."\n\nThe memories of this man came flooding back. An unpleasant, tactless figure with a tendency to aggravate his colleagues and attempt to hog the spotlight for any and all achievements that may or may not have been his own. Ever since his exile from the British Isles he had served in the Union Defense forces as a commander, having retired 4 years ago to the relief of quite a few of his colleagues. Div had his doubts if this man really would do much good in returning to command. "I'm not quite sure if that would be the right thing to do at your age, Bernard."\n\n"I'm 77 years old, not dead, Div. Now are you going to let me aid in defending the nation, or not?"\n\nWith a quiet sigh, and a lack of better options in the moment, he nodded at the retired general. "Welcome back, General Montgomery.""
 HDV_SAF.35.a: "An unpleasant man, but needed right now"

 HDV_SAF.36.t: "Back in the Saddle"
 HDV_SAF.36.desc: "Time waits for no man; Bernard knew it very well. Seventy-seven years on this earth, and how much he had seen and done. But now, in the last phase of his life, he could really start to feel the toll of time on his body and mind after he had entered his retirement. He considered his mind to be as sharp as ever, yet his body seemed to slowly decline over time. Things seemed ever so slowly, and ever so subtly chafe at him with back pain being a frequent occurrence.\n\nYet as he returned to his calling, he felt more energy and more determination than he had felt in the last five years. Now was his time to not just defend South Africa, but to deliver a great blow against the Germans as well. Above all, this would be his time to write a glorious ending to his biography. Overcoming the struggles of old age, returning from his retirement, and becoming the savior of South Africa, now that was what was to happen.\n\nAs long as Bernard Montgomery lived, so did the spirit of Britain, and now he could hopefully contribute towards the liberation of his homeland. With every German and Boer swept aside by the glorious forces of South Africa, the weaker the Germans would become in the end. Without their colonies in Africa, they would lose massively in influence, and South Africa would remain free forevermore.\n\nAnd in the Greenmarket square in Cape Town shall stand a bronze statue of Bernard Montgomery, the brilliant general who overcame all troubles to lead the nation to victory in its greatest catastrophe."
 HDV_SAF.36.a: "His tale, as told by himself"

 HDV_SAF.37.t: "An Appropriate Epilog"
 HDV_SAF.37.desc: "The smile on his face was unmistakable. The man, now approaching his 80th birthday, had finished his biography. He was finally able to type THE END on his typewriter which had served him through the long process of finishing his literary magnum opus. He pulled the sheet from the top, and placed it in a folder, to be sent off to his publisher soon enough. It was a masterpiece, a legendary tale that would stand the test of time just as he had. There was no doubt in his mind that it would become a bestseller, after all, who wouldn't want to hear the tale of South Africa's savior?\n\nAs he leaned back with a glass of wine in his hand, Bernard Montgomery could only smile as his vindication was complete. Over the years, many doubted him, second-guessed him and argued against him, and much more. From the medics who left him to die in a field hospital in Belgium, only to find their patient still alive in the morning. From Patton, who was to blame for the loss of his homeland foolishly tried to divert blame to him. And from the Boers and Germans, who had openly and repeatedly mocked him for his age as he returned to save South Africa.\n\nAnd all who had ever bet against Monty had lost. His achievements were undeniable, and now were carved into the lore of history, as written by himself. With his thin hands, he wrapped up the folder with the final section of his biography and shut it tight, moving it to the right end of the table.\n\nHis story was done."
 HDV_SAF.37.a: "An eternal legacy"

 HDV_SAF.38.t: "A British Partnership"
 HDV_SAF.38.desc: "The imported American car stopped near the homestead, and the rather finely dressed corpulent man with glasses stepped out. After a moment of waiting, the man of the house stepped outside with narrowed eyes.\n\n"Field Marshal Montgomery?" Vause Raw asked with a smile on his face. "It is a pleasure to meet you, do you have a few minutes to talk?" The two of them moved to the back porch where both shared a glass of wine, the old soldier eyeing up the politician with a sense of unease. Vause wiped some sweat from his brow with a handkerchief and then spoke up.\n\n"I have been following your career for a long time, and I am here to ask for your help, for the sake of South Africa, one more time." Montgomery seemed to light up, leaning forward slightly with a thin smile on his face.\n\n"And how would that be, exactly?"\n\n"De Villiers Graaff is spent, even when he doesn't admit it. I have been considering it for long enough, but now I have decided to split from the United Party before the upcoming elections to form a proper conservative party, named the New Conservative Party. The United Party needs to be pushed to the right, and the only way to do that is a proper party that takes care of the interests of the Anglo peoples of South Africa. I wanted to ask you if you could not only endorse the NRP but become the face of it for the campaign. With your reputation, it would do the conservative cause a lot of good, especially with the many veterans who served under you."\n\nIt did not take Monty long to consider the offer. "I am always happy to serve the good cause, to the very end." The two men shook hands and started to make further plans over a new glass of wine."
 HDV_SAF.38.a: "The conservatives make their move"

 HDV_SAF.39.t: "The King of Diamonds"
 HDV_SAF.39.desc: "It is fair to say that Harry Oppenheimer is a contentious figure. Entrepreneur, philanthropist, and former United Party politician, the head of the de Beers and Anglo-American mining cooperation was well known as the nation's richest man with no real equal. It was well known that he had sympathies for the African National Congress and supported it and other progressive causes, yet he happily worked with the current government to represent the interests of both of his companies.\n\nYet to his enemies, the most radical of Afrikaner, Oppenheimer was as much as the devil seeking to subjugate the entire nation. The derogatory term the Ossabranwag have for him is Geldmag, the power of money, and references to his Jewish heritage remain abundant in far right Afrikaner propaganda, which seems evermore influenced by the Germans. Having converted to the Anglican church along with his father in 1930, Henry has been at work to consolidate a corporate mining and extraction empire that remains dominant in the world's gold mining trade and of course South Africa's absolute pride, diamonds.\n\nWhile he has left his job as a politician for the United Party to lead his family's companies he remains deeply involved, supporting both the United Party, the Progressive Party, and several legal initiatives closely related to the ANC. With his connections stretching far and wide, Henry remains a key player in South African politics, eager to see the nation find some inner peace.\n\nBut all the while, his empire is built on cheap black labor and brutal monopolist practices that have left him in charge of two companies that make up about a quarter of the nation's GDP. Key to South Africa's development, Henry's ambitions are never quite complete as mineral exports continue to form a key pillar of the nation's economy, and there is still much more wealth to find underneath the steppes of South Africa."
 HDV_SAF.39.a: "The house always wins"

 HDV_SAF.40.t: "A Warm Welcome for Dow Chemical"
 HDV_SAF.40.desc: "Marais Steyn cut the red ribbon in front of the entrance of the new Chemical complex built by the American mega-corporation Dow Chemical. A polite applause followed as the news cameras focused on the handshake between South Africa's foreign minister and Dow's chief executive officer who had come all the way from America to attend the opening. held speeches about the great opportunities the new complex would bring to South Africa and how further cooperation between Dow and the South African government could bring great benefits to both.\n\nAll the while, the smile on Steyn's face never faded owing to the success of the buisiness deal with the American company. Glancing at the complex behind him he could see only opportunity for the nation. It had taken a long time to get a deal done but all that work paid off. Now here he was standing in front of the cameras, grabbing the eye of the people of South Africa as a real leader, raising his domestic profile further.\n\n."
 HDV_SAF.40.a: "Let's not talk about the pollution though."

 HDV_SAF.41.t: "An Inevitable Conclusion"
 HDV_SAF.41.desc: ""The position of the African National Congress has completely collapsed." Commander of the Union Defense Force Hendrik Klopper commented as he motioned on the map to illustrate. "They will not stop resisting, of course, but their direct control of Natal and Ghazni has completely been broken by the German onslaught."\n\nGraaff glanced at the map and smiled, gently sipping from a glass of wine from his own vineyard. "Well then, that is one less problem for the time being. I don't reckon that the Germans will go easy on them, and the smart ones will be running to our lines. What were they thinking even, somehow hoping to beat two modern armies with a rag-tag rabble armed with stolen weapons."\n\nEglin bit his lip for a moment before speaking up. "They were taking up arms for their people, Div, fighting for what they believed in." Div glanced at him with clear disapproval of his defense minister, his leanings always having been clear, yet his competency and approval of the Americans meant that he had to keep him in place, even though he would have preferred someone with less sympathies for the rebellious Black population of South Africa.\n\n"They sided against South Africa and got exactly what they deserved for it. Let's hope that they took as many Afrikaners as possible with them in their futile struggle."\n\nEglin did not respond, shortly after excusing himself from the war meeting. His face however spoke volumes with resentment for the Prime Minister."
 HDV_SAF.41.a: "A gentlemen's disagreement"

 HDV_SAF.42.t: "The Captured Traitor"
 HDV_SAF.42.desc: ""Why don't you spare me your smug smile and just get it over with." Hertzog was chained up against the wall and glared at De Villiers Graaff who had travelled to see the arch traitor, South Africa's Benedict Arnold, in person. "You can try all you want, we will never stop fighting for our freedom, our right to have our own country which was so brutally taken away by the British invaders. No amount of smooth-talking compromises will make any of that right."\n\nDiv stared at him, enjoying the moment quite a bit before returning with a rebuttal. "You would have been nothing more than a German vassal state, none of that so-called freedom would have been yours. South Africa offered you the option to dominate your own lands, to have that autonomy and prosperity as well and all of you threw it away out of spite, too blind to see the disaster you brought upon yourselves. Your Volkstaat is in ruins, and the Germans will not be strong enough to restore it."\n\n"As long as one Afrikaner still breathes, we will fight you and your Jewish American puppet masters to the very end. I have nothing more to say to you, now leave me be, you vile serpent."\n\nDiv let out a bit of a sigh, hoping that the Afrikaner firebrand had perhaps learned anything in defeat. It seemed hopeless though, as the man who had spent years railing against something as benign as television would never change his ways.\n\nHe stepped away from the call and glanced at the guards. It was time to make a quick executive decision on what to do with Albert Hertzog."
 HDV_SAF.42.a: "Take him out back"
 HDV_SAF.42.b: "Send him to Robben Island"

 HDV_SAF.43.t: "Nobody's Burial"
 HDV_SAF.43.desc: "No, they didn't get why they had to do this job, or why they were out here in the middle of nowhere. One moment they were relaxing at their base, watching an American Western on TV, the next Jack Winters and Dreef Vanderwiel were driving a truck with one single solitary corpse into the middle of nowhere. Their instructions were strict and precise, to bury the corpse somewhere remote and then forget where it was buried.\n\nAfter about an hour or so of driving alongside a dirt road, the two of them had had enough of it. The two stopped the transport truck and got out, both grabbing a shovel. After finding a place away from being seen by the road they got to work digging a proper grave. Then came the most disgusting part, to drag the corpse from the back of the van to its final resting place.\n\nIt was someone in a fancy-looking suit and shoes, his hands tied behind his back, along with a bag over his head that had been strapped on tight, apparently after he had been executed by firing squad considering the bloody holes in the chest. The corpse stank like hell, and the two of them quickly paced to the grave where they ignobly tossed the corpse in.\n\nTo Jack's surprise, Dreef then leaned down into the grave, easily getting the corpse's fancy-looking footwear off the corpse "What the fuck are you doing, mate??"\n\n"Taking a bonus for myself for this bullshit job. Not like he's going to have any further use for them." He wiped some dirt from the shoes and smiled. "Either they fit me, or I'll get something for selling them. Now come on, let's finish burying him so we can get back to base.""
 HDV_SAF.43.a: "And thus ends the tale of Albert Hertzog"

 HDV_SAF.44.t: "The First Day"
 HDV_SAF.44.desc: "To say that Albert Hertzog's first day on Robben Island would be quiet was a major understatement. Everyone knew very well who he was, his identity being impossible to keep under wraps. The prison wardens who dared to look down upon him as if he was one of those rebellious ANC upstarts, the supportive looks from the other imprisoned Afrikaners, and of course the long stares of hatred from those who he had tried to violently subjugate.\n\nAll the while Albert did not flinch or seem intimidated in the slightest by the crowd that seemed to jeer at the leader of the Afrikaner Volkstaat now chained like a common criminal. His conviction had never wavered, no, this was just a temporary setback. Soon enough the Germans would come crashing down upon this weak, pathetic state propped up by the Americans and the Aryan superiority would be proven once again.\n\nAs he stepped into his modest cell he glanced at the prison warden, a rather rotund man who had escorted him from the front gate directly to his cell.\n\n"Mr. Hertzog, welcome to your new home here." He said sarcastically. "I expect no further trouble from you, or we will end up moving you to the Black wing of this fine establishment and I'm sure they will be very gentle with you. There is no doubt that the other Afrikaners here will look up to you, and I expect you to assist in keeping them in line. If you work with me, I can make your stay here a lot easier, perhaps."\n\nThere was no response but a determined glare from the Afrikaner firebrand.\n\n"Think about it. And until then, enjoy your stay on Robben Island, Albert." With a laugh, the warden locked the prison cell and walked away, leaving Hertzog only with his thoughts filled with nothing but resentment."
 HDV_SAF.44.a: "One more famous prisoner"

 HDV_SAF.45.t: "Betting the Odds"
 HDV_SAF.45.desc: "Bernard wasted no time in updating the Prime Minister on the current situation on the front, the latest developments regarding supply and logistics, and of course boasting about his latest results.\n\n"So, turning to the Afrikaners." Graaff turned. "What do we know about their status? Sure, they have their German backers, but I don't assume it's going to be very easy domestically for them considering just how much of their population is now in chains. We should try to stir the pot and see what happens then."\n\n"I am not too overly concerned about the Boers, it's the German colonies who are the real threat. We should easily be able to capitulate the Boers before July this year, but I don't foresee the rest of the war being that easy."\n\n"July? Now?"\n\n"Very much so." Monty smiled rather confidently.\n\n"I doubt that we can crack them so quickly, but if you're so sure about it, how about we bet on it? If you can get them before July, I'll hand you one of those American B-52 bombers." Graaff was clearly joking, and yet Montgomery immediately held out his hand to shake it. Out of gentlemanly habit, he shook the Lieutenant General's hand with a bit of an awkward smile.\n\n"July it is then."\n\nBy the time the old commander had left the Prime Minister's office, Div had forgotten all about it, yet Montgomery had completely fixated upon the bet, readjusting his focus on taking down the Boers first."
 HDV_SAF.45.a: "Time for a bit of a gamble"

 HDV_SAF.46.t: "A Bet Won"
 HDV_SAF.46.desc: "Div glanced at Montgomery walking into his office with a stride in his step and a confident, very smug smile. He forced himself to smile, wondering what was going on. The so-called Afrikaner Volkstaat had collapsed, now it was just the Germans fighting the war alongside Boer remnants.\n\n"Prime Minister." Monty saluted. "Do you happen to know what month it is?"\n\n"Pardon?" Graaff stared at him in complete disbelief. "It's [GetMonth].\n\nThe commander's smile grew even more. "[GetMonth], eh? Well, that's before July, and the Boers have completely collapsed. I'll have my B-52 now, Prime Minister, after all a bet is a bet, and I won."\n\n"I beg your pardon, what on earth are you talking about?"\n\n"Oh, don't go backing out of this bet now, Div, you know very well I won fair and square. This is ridiculous, we even shook on it right in this office. I had expected much better of you, Prime Minister."\n\nVague memories of that event emerged in the Prime Minister's mind, where he had made a joke about betting on the war and Montgomery had taken it absolutely seriously. The stare on his face turned a bit pained as now he had to either choose between Montgomery possibly turning into even more of a problem or passing over one airplane to the old coot. It was better to stay on his better side, considering how well he had performed so far.\n\n"Now then, Prime Minister." Montgomery put both hands on his desk and leaned forward."
 HDV_SAF.46.a: "Where's my B-52?"

 HDV_SAF.47.t: "A Bet Lost"
 HDV_SAF.47.desc: "July had come and the foolish Boers were still standing. Silently, Montgomery was fuming as his plans had not delivered the decisive result against the Boers that he had sought. They persisted in this foolish endeavor, their crusade of treason, their utter idiocy in siding with the Germans who sought to subjugate them.\n\nMost important to him, he had lost his bet with De Villiers Graaff, and wouldn't be able to claim his prize of getting a plane for himself. Not that he specifically wanted to own a B-52, but it was about the glory of victory. If only he'd have crushed the Boers faster, then he would have a fantastic story to tell and of course, a wonderful little prize he could use to fly around later.\n\nBut now, he had nothing, and the war dragged on and on. It didn't seem likely to be resolved any time soon, but Monty quickly brushed off his personal defeat to try and focus on the next offensive that would finally silence the Voortrekkers for good."
 HDV_SAF.47.a: "Let's hope Div forgot all about it."

 HDV_SAF.48.t: "Disagreements"
 HDV_SAF.48.desc: "Hendrik Klopper rubbed his temples, staring in great frustration at the British man standing opposite him. Why didn't he just stay retired, that would have made things a lot smoother, but this decrepit fossil from a long bygone age with a loudmouth simply could not resist another attempt at glory.\n\n"Klopper, you know bloody well that you're taking too many risks with this maneuver." Montgomery jutted the map, drawing a line. "If you keep taking risks like these, we're going to end up with no army left before the war is over. Are you trying to end up in history as the man who destroyed South Africa?"\n\n"You and your cowardly hyperbole." Klopper spat back. "Nothing risked, nothing gained. You would prefer to just sit on your bum and do nothing until everything turns your way! The war can't wait for your whims, Montgomery."\n\n"We don't have the supply to move this fast and you know it. If you want to end up throwing away good men's lives for your search for glory, go ahead and do it, and soon enough we won't have the strength to keep resisting these bastards, and we'll have to completely let this nation be dominated by the Americans. Every good South African that dies is one less that can resist the German tide!"\n\nThe argument carried on in circles for about an hour long, the old dislike between the two men rekindled by close contact once again. At least Klopper took solace that he wasn't the only person who had issues with Montgomery. Sadly, he didn't have the authority to send him back into retirement, but if he could just keep the man from constantly overstepping the boundaries placed before him things wouldn't be half as bad."
 HDV_SAF.48.a: "Montgomery: In defeat, unbeatable; in victory, unbearable"

 HDV_SAF.49.t: "Reichswerke in Pretoria"
 HDV_SAF.49.desc: "Albert Hertzog waved to the crowd that was standing near the Pretoria train station. The train from Ostafrika, widely marked with swastikas on the side, pulled into the station. Moments later the doors opened and the first of the newly bought Reichswerke tractors rolled off the train roaring loudly and spitting out plenty of smoke. The driver stopped the vehicle and got off it to shake hands with Hertzog to widespread applause.\n\nThis was only the first delivery of Germany's finest farming equipment, purchased from the highly reputable company Reichswerke, the company that was the steel heart of the Reich's power. There had been attempts by the Americans, sniveling greedy cowards as they were, to try and break into the lucrative Afrikaner market, but every good Afrikaner knew very well that the Yankees simply couldn't be trusted.\n\nEven if it had been cheaper to purchase American, or Japanese even, to purchase German goods would further strengthen the Aryan peoples of the world and keep the lesser races in line. More and more trains and trucks flowed between Ostafrika and Johannesburg than ever before while internal trade with the rest of South Africa seemed to noticeably slow over time. Even though it was still South Africa on maps of the world, the Afrikaner were definitely moving more and more into the German sphere."
 HDV_SAF.49.a: "German engineering, Afrikaner expertise."

 HDV_SAF.50.t: "The Bureau of State Security"
 HDV_SAF.50.desc: "Like many British exiles, Sir John Alexander Sinclair had left Britain in the chaotic final days of the nation's collapse. Having served in the British military all his life, the stain of defeat and the inability to safeguard his homeland from destruction had continued.\n\nLeft with the choice of where to make his home in exile, he headed to South Africa to try and continue the struggle against the Germans there, but the only thing that followed for him was an ignoble peace. Unable to find a place in the shrunken post-war military of South Africa he served as the head of police in Cape Town and immediately began to work establishing a network of informants and contacts to try and build up an intelligence network that would help serve South Africa since the nation itself had always leaned on the British intelligence networks that now were no more.\n\nAfter a period of establishing himself in South Africa, he was finally able to pursue his goal in the open, to establish a proper intelligence service for the nation that followed proper British principles. The Bureau of State Security had now become integral to keeping the peace and the balance within the nation, with operatives in and outside of South Africa providing intelligence reports to the Prime Minister.\n\nYet BOSS was loyal to one man, and one man only. The pro-OFN slant of the organization was noticeable to everyone, and with some reluctance, Sinclair vows to uphold the neutrality of the nation, while remaining quite cooperative with the CIA behind the back of De Villiers Graaff."
 HDV_SAF.50.a: "On South Africa's Secret Service"

 HDV_SAF.51.t: "Out in the Open"
 HDV_SAF.51.desc: "As much as this war was a chaotic, messy struggle some things were made a lot easier. There was no more need for John Sinclair and BOSS to keep their cooperation with the Central Intelligence Agency under wraps, as the clandestine ties quickly intensified more and more. With the urgency of the situation and the intensive commitment of the Americans, a lot could get done rather quickly.\n\nNot only did information flow between the two agencies, but so did operatives, networks, techniques, and money. BOSS was undergoing a period of rapid expansion, having been given a blank cheque by Graaff to do whatever it took to aid in the defense of the nation. Like chemotherapy, Sinclair had gotten to work on rooting out any German influence in the nation, while at the same time making plans to begin evermore intense operations to disrupt the Boers and the Schild alike.\n\nFinally, Sinclair was able to strike back at Germany, and finally, he could make a proper difference. Quietly, he hoped that his efforts could somehow make up for having failed his homeland so many years ago. Thankfully, South Africa did not have to fight alone, and the direct line to Langley had always stayed open. After so many years of building up BOSS into a formidable operation, now all his hard work would be rewarded."
 HDV_SAF.51.a: "A special intelligence relationship"

 HDV_SAF.52.t: "Festivities and Farewells"
 HDV_SAF.52.desc: "The war had been an existential struggle, a difficult, expensive, bloody, and far too long. Yet despite all the difficult odds, the allied forces had come out of it victorious, with South Africa and its newfound (or in some perspective, old) allies having achieved a good victory over the Shield. Like a wave of men and materiel once flowed from the Cape north, now the different volunteers and armies marched South to head home, leaving the reinvigorated South African army behind to guard its homeland.\n\nBut before that all happened there was one more massive party in Cape Town. Under the view of film cameras from the entire OFN a massive parade was held, with the collective armies of the OFN and the South African marching one after the other with military vehicles in the middle. With this glorious moment of celebration and the many more that followed, the war had reached its conclusion and the forces of the free world had achieved a great victory over the grey tide that once threatened to devour the entire world.\n\nThe various ambassadors had all gathered as well as most of the United Party's top brass who had the privilege of viewing the attempt between De Villiers Graff and Bernard Montgomery subtly trying to be the center of attention in front of the cameras.\n\nAfter that day, the different armies left South Africa one by one, to head home victorious and satisfied that they made a great difference in the struggle to defend the free world."
 HDV_SAF.52.a: "The parting of the ways, and passing into history"

 HDV_SAF.53.t: "The Long Journey Home"
 HDV_SAF.53.desc: "The news of the ceasefire on terms dictated by the Pakt was a tough pill to swallow for the people who had lost colleagues, and friends, or even had injured themselves for the cause of a free South Africa. The Boers had won their freedom as a voluntary puppet state of Germania, and South Africa had been split in half.\n\nQuite a few people had reasoned that if nothing had been done the entire nation could have ended up being conquered by the German colonies in the north though no one could know for sure. What was certain was that the mood overall was mixed at best. Peace had returned to South Africa, and for the many people who had come here to volunteer or were sent here by their nations, it meant an end and a journey homeward.\n\nLike a wave of men and materiel once flowed from the Cape north, now the different volunteers and armies marched South to head home. By ship and by plane, the soldiers of the OFN returned home, a scant few deciding to stay behind and make a new home in South Africa.\n\nThough for the people of the Cape itself, the return of peace was celebrated, it was mostly a modest, private affair. The horrors of war had now ended, and work on rebuilding their homeland could now begin.\n\nFor those who left South Africa, they took with them memories of a grand adventure with a disappointing ending. For many of them, the things that happened on the battlefields of Africa would stay with them for a lifetime."
 HDV_SAF.53.a: "The parting of the ways, and passing into history"

 HDV_SAF.54.t: "Inspection Day"
 HDV_SAF.54.desc: "The soldiers saluted as the three men walked past them. In a row, Hendrik Klopper, head of the UDF, John Sinclair, head of BOSS, and Colin Eglin, the minister of Defense inspected a group of motorized infantry, all of which had chosen to stay in the army even after the conflict had ended (for a noticeable pay increase). One could be mistaken and think that these were American soldiers if not for the orange, white, and blue emblazoned on their outfits.\n\nBut all of them were speaking English, wearing uniforms imported from America, wielding American weapons, and standing in front of a parked American IFV. Colin glanced at the spectacle of it and smiled, his plan to try and heavily Americanize the UDF a success, with great help from both men who walked alongside him. In some sense, the war had been a boon to South Africa, as finally all toxic German influence could be removed from the Cape with a rigorous multi-year dismantlement effort.\n\nNot to mention the fact that quite a few stockpiles had been left behind by the Americans as a gift, or perhaps as insurance against any further attempts to attack the nation or simply because it wasn't worth shipping older equipment back home. Lend-Lease had come to an end, but the equipment remained. American support for South Africa had tapered off, yet intelligence and training operations continued at a significant level.\n\nAnd as for the German equipment bought before the war's start, or captured during it, Colin was able to easily convince Graaff to sell it all off on the wider international market as a further final rejection of anything and everything German in South Africa."
 HDV_SAF.54.a: "Organized by the Free Nations"

 HDV_SAF.55.t: "Div up North"
 HDV_SAF.55.desc: "Ever the gentlemen, De Villiers Graaff never let his hosts in Ottawa notice his displeasure. The last time he had left South Africa was for the war in North Africa where he had learned to adjust to the dry heat of the desert. But now he found himself in Canada, leading a high-end diplomatic mission to further re-establish personal and business connections with the Commonwealth of Nations that had been lost under the period of neutrality post-war.\n\nIn truth, he noticed a degree of skepticism from his hosts since he was one of the key advocates and guardians of that distance and neutrality between South Africa and the remnants of the British Empire, but that was nothing that a bit of old charm couldn't handle. Backing up that charm was the promise of further access to South Africa's mineral wealth and the grand extension of trade.\n\nAll the while during the trip Graaff spent his time meeting with representatives of the Canadian government, with exiles from the Isles, and of course, with several business leaders hoping to strike investment deals to try and help rebuild South Africa. Yet the weather was terrible, wet, and cold all the way even on the day when he was privileged to have a meeting with Her Majesty the Queen herself.\n\nHe smiled, he joked, and he shook hands and chatted about reconstruction plans, all the while wishing he was back home instead as wind and rain battered against the windows of the royal residence."
 HDV_SAF.55.a: "For how much longer would the trip last again?"

 HDV_SAF.56.t: "Call for Elections"
 HDV_SAF.56.desc: "On both TV and radio, the announcement of new elections went out. The original date had been rudely disrupted by some German ruffians launching a war of conquest, and a new date had been scheduled for a little under a year from now.\n\nIn another standard, confident speech Prime Minister De Villiers Graaff dressed in one of his finest suits discussed the events of the war, the promising outcome of the reconstruction works, and how the United Party would continue to bring back real growth and advancement to South Africa as he sought another term of office.\n\nThere were quite some complaints going around the nation afterward about the scheduling of the date lying too far into the future and how the United Party was stretching out their current term of office a bit longer but overall, the process of preparing for the new elections had begun.\n\nPosters were printed, new parties were organized, and security measures were prepared to ensure a smooth process which would hopefully end in another term of office for the United Party which had in effect governed the nation since 1934.\n\nBut with the rise of the New Conservative Party on the right and the Progressive Party on the left of the UP real competition was in the cards. For now, the Afrikaners in South Africa were represented only by the Afrikaner Vrede Party of Piet Koornhof which looked up be a minor competitor at best."
 HDV_SAF.56.a: "Hey, c'mon go to the polls"

 HDV_SAF.57.t: "-"
 HDV_SAF.57.desc: "-"
 HDV_SAF.57.a: "-"

 HDV_SAF.58.t: "A Rusting Inheritance"
 HDV_SAF.58.desc: "South Africa's navy never had much priority for the Royal Navy ruled the waves from Halifax to Perth, and the nation was merely a convenient resupply point and African trade hub for the British empire. If one would have assumed that after the shocking defeat and collapse of that empire and the sudden independence of South Africa, the navy would have become a priority, one would be mistaken.\n\nSouth Africa had inherited a significant amount of Britain's commercial and military fleets as many sailors left without a home and found their way to South Africa rather than settling down in Australia or Canada. And while the United Party had done its best to welcome them and help them get settled, the ships that they brought along were never a huge priority.\n\nWhat was good in 1943 had become behind the times in 1962 as the ships that were once the pride of the Royal Navy strained against the merciless decay caused by time itself. Hugo Hendrik Biermann was the poor sod in charge of trying to keep the South African navy afloat under a shoestring maintenance budget knowing full well that if the nation would have to use its fleet it would come up short.\n\nYet despite these circumstances, the other part of the inheritance still remained relevant. Technical expertise, organizational institutional knowledge, and a large pool of naval veterans to call upon, if the need was high, meant that while the South African Navy currently lay mostly dormant, it could still rise to a good height once again if called upon."
 HDV_SAF.58.a: "South Africa ignores the waves"

 HDV_SAF.59.t: "Rust, Retirement, Renewal"
 HDV_SAF.59.desc: "Hugo Biermann was coming to the end of his career in the South African Navy, but his task was not yet done. He had much to do before he was satisfied with passing over the baton to the next leader of the nation's navy.\n\nThe war had marked a clear need to revitalize the navy and with generous American assistance replace British World War 2 hand-me-downs with American ones from the post-war period. Only a few ships were turned into museum ships to commemorate the legacy, and everything else went off to be dismantled for scrap. The degree of rust and decay meant that the money they received for the old fleet was minimal yet at least now the revitalized navy would have a proper maintenance budget.\n\nSouth Africa would now become a proper member of the Organization of Free Nations helping patrol the shores of Africa and keeping the trade lines open between the American east coast and Australia that would form the lifeblood of the South African economy."
 HDV_SAF.59.a: "South Africa guards the waves"

 HDV_SAF.60.t: "Rain"
 HDV_SAF.60.desc: "The landscape was twisted with the scars of war and filled with endless explosive craters. The dark clouds hung over the battlefield shrouding out any view of the sun with heavy rain pouring down, obscuring the view. In one of these craters, two figures could vaguely be seen lying there. Pinned under the corpse of the man who had tried to rescue him lay the young Bernard Montgomery, unable to find the strength to push the corpse off.\n\nThe gunshot wounds in his chest and knee burned, and with no relief in sight all he could do was wait in agony. This memory had long haunted him, and even in old age sometimes his nightmares would take him back to the fields of Flanders to let him lie there in the pouring rain, smelling the disgusting stench of rotting corpses and the ever-encompassing smothering of dirt. No amount of squirming or screaming would make a difference and having been here quite a few times before Monty had long given up any ideas of trying to escape this place.\n\nInstead, he lay there with his eyes closed, waiting for it all to pass. The worst part always was that silence that the real moment didn't have. There were no screams of men at war or the roaring thunder of artillery shots landing nearby, no there was nothing and only the ever-encompassing sound of rain until there was absolutely nothing left.\n\nBernard awoke in a cold sweat, immediately leaping awake and deciding to forgo any further sleep for the night as he got up to do work. He could not change the past, but perhaps, no, most definitely if he worked hard enough, he could turn the tide of this war. The war was not yet lost, and now it was up to him to win it still."
 HDV_SAF.60.a: "All or Nothing"

 HDV_SAF.61.t: "A Decent Afrikaner"
 HDV_SAF.61.desc: "History would debate it, but for Piet Koornhof it was quite clear what had happened. He had not left the National Party, no, the National Party had gone insane and left him to start a civil war against South Africa. His South Africa, his homeland. Merely for being not as radical, in fact, being flexible towards the ANC instead of a hardline rejection and dehumanization had isolated him from his fellow Afrikaners.\n\nYet for those who did not want to go along with this violent madness now, they had no one to speak for them but the utter madmen and murderers that call themselves the National Party. It did not take him long to realize what had to be done. For the sake of dignity and South Africa, Koornhof would have to found a new party for the Afrikaners, one that would bring back peace and represent their interests in this changing land in a proper way.\n\nSomehow, he would find a way to return to peace and quiet, and with his new Vredesafrikaner Party, Koornhof would try to balance a steady and decent course for his homeland that now was in flames for the stubbornness of his people, whipped on and deluded by the Germans to try and serve their heinous cause of total domination. For as much as Koornhof had misgivings about the Anglo elites in Cape Town, they were at least open to reason and negotiation as opposed to the faraway overlords in Germania."
 HDV_SAF.61.a: "For Peace, Prosperity, and Freedom!"

 HDV_SAF.62.t: "A Work of Passion"
 HDV_SAF.62.desc: "Jack Winters was perhaps the luckiest man in the world, for his work was his hobby. Every day he would show up at his job at Austral Armaments in Cape Town and get to work on designing new vehicles and weaponry pen and paper in hand. Always having been a hard worker with the outbreak of the war he had whipped himself into a working frenzy to push forward new prototype vehicle design.\n\nHis latest work, the Eland armored car already was seeing battle in the north, serving as a quick and mobile vehicle to outmaneuver German positions and deliver surprising strikes against weaker sections with its twin M1919 Browning machine guns or its main gun, the 90mm Denel GT-2. Alternatively, versions with a built-in 60mm K1 mortar were able to heavily barrage German fortified positions and deliver a surprising amount of firepower for a quick and nimble vehicle.\n\nBut Jack was thinking bigger, much bigger. South Africa would not become just some OFN servant state like the Boers would become the lackeys of the Germans, no it would stand alongside them as a partner state able to defend itself in the long term. For that to happen South Africa should be able to produce more, much more domestically.\n\nStarting with the plans for the Centurion, a British-designed tank that never was brought to completion due to the German invasion Jack began to modify it extensively, replacing as much as possible with domestically produced alternatives. Kept to a reasonable level, he was convinced that South Africa could quickly make these drawings a reality, with the urgency of the war pressing down upon them."
 HDV_SAF.62.a: "He called it the Elephant"

 HDV_SAF.63.t: "The New Arrivals"
 HDV_SAF.63.desc: "South Africa was able to survive the Second World War by a thread, preserving its freedom after an intense conflict and pursuing a course of strict neutrality to deter any German attempt to take the nation by force. But the British empire was broken for good, and now only its remnants remained, finding its way to the formerly British colonies that still remained free.\n\nSouth Africa had been no different, and many had found their way to the Cape where they were welcomed by the United Party. Sailors were marooned from home, colonial administrators had lost their colony, exiles from the British Isles themselves, and loyalists from India, all of them finding a new home on the southern tip of Africa. The South African navy was made up of British sailors, on British ships left over from the Second World War and the Union Defense Force had an influx of experienced commanders that helped shape it.\n\nThe United Party meanwhile gained a significant expansion of voters and supporters, helping them steadily secure power again and again over their rivals in the National Party. The nation itself gained not just the remnants of the British navy, but also the educated, wealthy, and connected elites from the colonies which greatly helped its economic development.\n\nYet despite this heavily pro-OFN group, the nation kept its neutrality high as a means to keep the peace internally, and externally as well. Many of the exiles openly advocate for joining the OFN yet the pull itself is not great enough to truly sway the United Party into taking that step. Far from it, De Villiers Graaff has done his best to promote neutral sentiments in the nation to help bring stability to the nation. South Africa would be neutral, and trade with all, and that would be that."
 HDV_SAF.63.a: "A new home, and a new outlook"

 HDV_SAF.64.t: "As Simple as That"
 HDV_SAF.64.desc: ""Well then, gentlemen, we're shutting it down." The meeting of the cabinet ground to a halt regarding the latest accusations by the German ambassador about the strong lean towards trade with the OFN as compared to that with Germany. Graaff had hoped to keep a very profitable neutrality going while still leaning towards the Americans which seemed to be the stronger power overall.\n\nBut clearly, that balance had been broken since the Germans came with new demands after the size of South Africa's connections with the Americans had been revealed. To all the people in the room, these terms were unacceptable, not merely leaning towards Germania but instead almost becoming an economic vassal of the Unity Pakt.\n\nAfter considering it for a moment, De Villiers Graaff spoke up. "I entered neutrality to keep trade open with the Germans and their vassals in the north, but no meaning of that word means surrendering our economy to these Hunnic plunderers. I am not happy with having to have the Americans with much leverage over us but I'm sure that Nixon's terms will be better than Hitler's. The time has come to end all trade with the Germans and to side with the Americans economically."\n\nHe wrote down instructions on a piece of paper and handed them to Steyn who kept a neutral look, giving a polite nod to the Prime Minister while grumbling under his breath about the barrage of telephone calls with ambassadors and diplomatic protests and threats from the German side of things. Immediately he tried to counter some of that pressure on Graaff with a final remark.\n\n"You know that Hertzog is going to have a field day with this in Parliament right, considering how much they trade with Ostrafrika already?"\n\n"Hertzog?" Graaff huffed. "The man can whip himself and his Afrikaners into a frenzy over the matter of television, it doesn't matter what we end up doing, that scrawny little man will end up complaining about it as if it's the end of days. If I were to grant him independence tomorrow, he would still find a way to complain about it, so let him complain." Graaff stood up and prepared to leave when he turned to face Steyn once again.\n\n"Oh, and make clear that the Americans know that we're not going to join their OFN, and they should have no illusions about any such thing happening, ever.""
 HDV_SAF.64.a: "Goodbye Germania, Hello Washington"

 HDV_SAF.65.t: "A Calm Day in Parliament"
 HDV_SAF.65.desc: "Albert Hertzog stepped up to the stand with the microphone that broadcasted the events of the South African Parliament to the nation, his weathered pale hand cramping onto his notes about the suspension of trade with Germany which he placed on the lectern. His eyes glanced across the room and locked on De Villiers Graaff who gave him a polite nod. Both men knew very well that there was nothing behind the gesture, as their fervent dislike for one another went further and further.\n\n"Meneer Spreker." erzog began to speak in Afrikaans, and thus the language of the bilingual Parliament switched back to the Dutch-descended language as opposed to the United Party's English. "Yesterday the government has decided to unilaterally suspend trade with Germany and its African possessions rather than try to solve this matter in a diplomatic fashion." Some mild boos went up from the government's side of Parliament, but they quickly died down.\n\n"Not only does this violate the neutrality that this nation has sworn to under the Neutrality Act of 1946, but it has also unilaterally trampled on the rights of the Afrikaner lands who are deeply reliant upon trade through the port of Lourenço Marques by the circumstances of geography. In one act, the Government has once again shown that it holds no actual morals nor respect for the hard-working Afrikaners who have built this nation. My only question to the Prime Minister is how long it shall be before he breaks his agreements once again?" With applause on the left side of the room, Hertzog sat down, allowing De Villiers Graaff to take the stand.\n\n"Mister Speaker." Graaff gave a quick nod to the speaker sitting behind him. "When I was sworn in as Prime Minister, I also swore to defend this nation and its interests against any foreign force. No superpower shall subjugate this nation politically or economically. Not Tokyo, Not Washington, and not Germania shall tell us what to do. The terms offered by the German ambassador were not just outrageous, they were a covert attempt at economic subjugation and that is precisely why we stopped trading with them. It was an action, like all my actions, taken in the defense of the Union of South Africa.""
 HDV_SAF.65.a: "A chorus of booing and applause carried on throughout the day"

 HDV_SAF.66.t: "A Prince Abroad"
 HDV_SAF.66.desc: "The ethereal silence of the savannah was fractured by a single shot that rang out upon the dry plains. Weaving and whistling through the dry African air, it eventually found its mark, shattering the skull of the wildebeest that effortlessly toppled over with a soft thud. The hit was accompanied ceremoniously by polite applause from the several IGW agents that guarded Prince Bernhard van Lippe-Biesterfeld of the Netherlands on his safari trip to South Africa.\n\nAlthough there had been complaints both from Germania and Washington about the contents of his trip, his diplomatic contact, Villers De Graaff had characteristically succeeded in the Sisyphean task of appeasement, quieting both. Thanks to the Prime Minister's diligent efforts and being escorted by a local hunting guide and five heavily guarded officers of Informatiegroep Wilhelmina, the Prince traveled across the picturesque plains of South Africa without a single hitch. He even had time to develop a more recent passion; when he wasn't out shooting the wildlife, he was out shooting the countryside with his new Philips film camera.\n\nHowever, the diplomatic part of his trip wasn't going as well as his hunting. Not only were his meetings with prominent politicians and exiles he knew back from his chaotic days in London dull, but his reception in the lands of the Afrikaners was also mild at best. His attempts to play up his ancestral and linguistic connections between the Dutch and the Afrikaners seemed to have an impact at least, but Bernhard was well aware that in actuality, the greater scheme of things didn't change much for these people who seemed to idolize Germany more than their Dutch roots.\n\nAnd then there was the matter of his German origins, which to some remained a vector for treason even with his continued commitment to the Dutch cause in exile for the last twenty-two years of his life. Yet none of them understood Bernhard for who he was. He wouldn't betray the Free Dutch even if he had been fully German. Why would he ever turn off the money tap from milking favors and making corrupt deals at home for the abhorrent hellhole that his original homeland had become? Why would he ever give up a lifetime of praise, power, and cash for minimal return? Let the tongues of the gossipers wag, for the Prince had long made up his mind on where he stood in the world." 
 HDV_SAF.66.a: "Ship this back home, will you Abe?"

 HDV_SAF.67.t: "A Pleasant Retirement"
 HDV_SAF.67.desc: "The older man leaned over his typewriter, enjoying the view of the setting sun in his estate in the Western cape. He reached into his pocket and pulled out a pipe, lighting it and just watching the sunset in the west with a good sense of satisfaction. It had not been easy leaving home behind, traveling across the ocean to settle down in South Africa where he had been born long ago, even before it was a dominion or a part of the British Empire.\n\nThe son of a bank manager in Bloemfontein in the Orange Free state, he had left the region before he had any memories of it. And when he returned to the place of his birth as a grown man, he found nothing to connect to there, settling down in the Cape instead with his wife while his children found new professions in South Africa as well.\n\nAfter returning to work as a linguistics professor at the University of Cape Town he was able to retire early in 1958 due to his books becoming a runaway success across the OFN and neutral nations. The words he had written had reached a wide audience, taking them to the fantasy mythology he had painstakingly constructed after many years of dedicated work on his legendarium and the fantasy stories told within it.\n\nEver since the publication of the Return of the King, he had seen mainstream success to the degree that he had to have his number taken out of the phone book. His wife Edith meanwhile had been incredibly proud of his achievements and had supported him in any way she could.\n\nJ.R.R. Tolkien had finally found a bit of inspiration and turned back to his typewriter, where he would sit in front of for the rest of the evening as he continued his literary work."
 HDV_SAF.67.a: "So little time, so much more stories to tell."

 HDV_SAF.68.t: "The Fall of Cape Town"
 HDV_SAF.68.desc: ""Please sir, my family and I have the money..." pleaded the man at the front of the line, shoving and thrashing through the sea of the panicked faces of his countrymen in a wired fence courtyard outside the tarmac of the Cape Town International Airport. "I'm sorry sir, but the OFN forces have full use of the runway. There's nothing I can do-."\n\n"What, they have full use of our runway so they can abandon us?!" shouted the man, the cry, soon becoming the general consensus of the crowd. The OFN contingent left to guard the airport during the last of the evacuation had been fighting desperately to keep the Germans and Boers at bay, just outside the city, but hadn't had the time to consider the fate of its civilians. The two armed men guarding the hole in the fence, the only civilian entrance onto the tarmac, clenched their American M14's as they stared into the rising mob, but a loud boom of an artillery shell upon Table Mountain surely reminded them that this was the safer place to be.\n\nMinute by minute, the shouting of Cape Town's civilians had grown until it drowned out even the loudest of plane engines. Eventually the guards could not hold on to order anymore, and the overwhelming tides of the crowd crashed down over the flimsy wire fences. Like a liquid rushing out of a cracked glass bottle, men, women, children and suitcases began spilling out onto the black concrete. The man, with his wife around his shoulder and child by his hand, darted in front of the swelling crowd and towards the hind door of the last American transport aircraft. As its black jaws began to close meters away, and despite the shrieks of the soldiers inside, he launched them both over the edges of the metal flap before watching his wife's blue dress slip away from sight into the aircraft. A disoriented mother and son clambered onto the plexi-glass back window to view their rapidly fading father as the aircraft pulled away.\n\nWiping the condensation away, the mother and child pressed their hands on the glass so that only the rapidly dwindling man remained in the crevices of their hands. Tears welled in their eyes as they watched their husband and father fade further and further away into the black plain as only a single thought burned in the child's mind..."
 HDV_SAF.68.a: "Would they ever return?"

 HDV_SAF.69.t: "The Matter of the Chief Justice"
 HDV_SAF.69.desc: "South Africa's Constitutional Court is the highest authority in the land, and with the retirement of Chief Justice Henry Allan Fagan a week ago the position has come free. According to the constitution, the Prime Minister has the right to appoint the next Chief Justice which would take a prominent role in shaping the judiciary for the next four years. Out of the possible candidates, three likely candidates could take up the role.\n\nThe first is a more progressive, liberal figure named Oliver Schreiner which would appease the United Party's progressive wing, the second is a more moderate figure closer to De Villiers Graaff named Newton Thompson. Finally, the last option is another attempt to appease the Afrikaners by appointing one of their own in Lucious Cornelius Styen, someone very critical of British legal influences in South Africa's legal system."
 HDV_SAF.69.a: "Appoint the progressive"
 HDV_SAF.69.b: "Appoint the moderate"
 HDV_SAF.69.c: "Appeasement always works!"

