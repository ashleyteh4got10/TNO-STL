 SAF_end_martial_law: "End Martial Law"
 SAF_end_martial_law_desc: "The war is over, and the need for martial law is now over. As promised when it was first enacted, Prime Minister Villiers Graaff has seen to it that the Martial Law Act of 1964 is immediately revoked and normal civillain life is to resume as it was before.\n\nThis however doesn't mean that any limitations on extremist literature from banned groups such as the ANC are to be tolerated and attempts to undermine their spread shall continue with BOSS leading further attempts to undermine the foreign connections that underpin these structures. For the common citizen, it shall be a relief to that life has returned to normal, though the war has most definitly brought great change to the Cape."
 
 SAF_the_lessons_of_the_war: "The Lessons of the War"
 SAF_the_lessons_of_the_war_desc: "South Africa's armed forces are now one of the few who have been engaged in full and direct combat with modern German formation (and older ones). There is no better time to not just compile and share the wisdom of modern warfare and how to tackle the fight with the Nazi menace, but also to make sure these lessons are shared extensively with our allies in the Organization of Free Nations.\n\nReports from the war, documentation, observations, and extensive discussions with the commanders who led the war effort on a tactical and on a strategic level shall be compiled into proper form and then dispensed. While the army is bound to shrink down now, the experience of this war shall be cherished and sustained as the foundation of the future of the Union Defence Forces."
 
 SAF_the_coronation: "The Coronation"
 SAF_the_coronation_desc: "The National Party may have gotten their referendum, and their war, but they will never stop the Crown! Now that the matter of the war has been settled, the referendum can be fully ignored and discarded. In stead, in a great ceremony, perhaps the greatest ceremony in the nation's history Queen Elizabeth the Second of Great Britain and the Commonwealth has been invited to Cape Town to formally be crowned Queen of South Africa.\n\nWhile the treacherous republicans are forever silenced, the whole nation shall see on television a coronation that shall inspire new and long lasting waves of Royalism on the Cape. Here, now and forever South Africa declares itself part of the Commonwealth, gratefully being a part of the true British monarchy and upholding Queen Elizabeth the second as our rightful and just ruler."
 
 SAF_our_vast_new_lands: "Our Vast New Lands"
 SAF_our_vast_new_lands_desc: "While this was not really our intention to expand our borders, merely to uphold the Union, the victorious outcome of the war has left us in control of vast new lands, expanding South Africa to a size we have never quite seen before. While a great boon to the nation, it also comes as a great new burden as these lands will have to be managed and controlled properly, lest the weeds of instabilty take root and grow to threaten the nation's unity once again.\n\nFrom Windhoek to Laurenço Marques South Africa dominates, but the former colonial structures that kept the peace in these places are rapidly unraveling, and if there isn't action taken quickly, the vast new lands we have will collapse. The good news is everyone in the United Party is well aware of just how much the German colonies suffered under overextension, and thus there is broad support for solving this matter quickly."
  
 SAF_speeding_on_the_savannah: "Speeding on the Savannah"
 SAF_speeding_on_the_savannah_desc: "With all the great lands added to our territory that will need oversight as well as millitary presence to deal with extremist remnants and those who seek to disturb the peace. But there is no way about it, that to cover such ground South Africa will be required to set up a purposefully nimble, mobile force adapted to the local and varied kinds of terrains that can be found within our Union. There is no real need for vast tank armies any more in the forseeable future, but what is needed is a fighting force that runs on wheels as quickly move around the land.\n\nThis however doesnt mean that such a mobile force will be unable to deliver a decisive blow for it shall be heavily armed. Wherever there is trouble, not only shall rapid response forces be delivered by land, but extensive helicopter formations shall also be established to back them up."
 SAF_speeding_on_the_savannah_tt: "2 Mechanized divisions will be spawned in Cape Town."

 SAF_inviting_international_investors: "Inviting International Investors"
 SAF_inviting_international_investors_desc: "Economic activity in the New Territories will have to be restored quickly, so that the benefits of our expansion can be reaped. However, we can't pull this off alone with all the costs of the war weighing heavily upon our economy. Thankfully, there will be more than enough willing investors to pick up where the Germans left off. Extensive mineral resources, cash crop plantations and other extraction networks will be quickly put back to work, with those working there being offered moderately improved working conditions if only to shut them up and make us look good especially compared to their previous masters.\n\nGreat assets taken from the Germans shall be put up for sale at a discount to invite all kinds of allied companies to come in and set up shop to get a slice of these profits while we further solidify our economic networks in the north."
 
 SAF_a_deal_with_the_deutsch: "A Deal With the Deutsch"
 SAF_a_deal_with_the_deutsch_desc: "To throw out all the Germans from Namibia is to invite disaster and chaos into these lands, which our Pan-African foes will surely make good use of. Unfortunately, we will have to be very pragmatic with our approach to those Germans in these lands. While they will be removed from Rhodesia and Mozambique, we will freely let the Germans settle in Namibia while offering them the vote and some autonomy in return for permanently securing all of Südwest for the Cape. Their numbers are not great enough to really influence any electoral outcomes, but their control over the region surely will solidfy our grip.\n\n This will be controversial with both our allies, and our people, but this is the price that will have to be paid to consolidate the hold on Namibia. While ties between Namibia and Germany will be severed, the Germans in Namibia will be able to keep their assets and their power, just under the wise management of South Africa."
 
 SAF_rhodesia_returns: "Rhodesia Returns" 
 SAF_rhodesia_returns_desc: "Rhodesia had been stolen from the collapse of the British empire in 1945, but now finally with the turning of the tide and victory in the South African war this fine province has been added to South Africa, as it always should have been. The Rhodesian people have suffered for years under German occupation, being unable to really do more but uphold themselves above the masses of natives that live there. No more, as South Africa shall extend a hand towards our Rhodesian brothers and restore their freedoms in full, making Rhodesia a proper province which shall of course without fail vote for the United Party to return the favor, further solidifying our electoral dominance.\n\nBoth sides have much to gain by this, and financial and political support shall be given to the Rhodesians to ensure their quick rise to complete dominance over the region, now deeply and forever intertwined with the Cape." 
 
 SAF_matters_in_mozambique: "Matters in Mozambique"
 SAF_matters_in_mozambique_desc: "Language. It is the foundational barrier between South Africa and Mozambique. While we can half understand the Germans, and the Rhodesians speak proper English, Mozambique still speaks Portugese which leaves us with much problems in trying to actually run it. We will in stead have found a puppet republic, staffed by those who left Mozambique for South Africa before and merely hold full economic dominance over the region in stead of adding it to the nation.\n\nFirst a reconstruction effort will be needed with a promise of elections in the future, while we move as much of the Retournado's into the region as well as offer some economic influence to the Iberians to integrate the region into our economic networks, without the hassle of having to direclty govern a grand mass of people who don't speak English at all."
 SAF_matters_in_mozambique_tt: "Elections will be held in Mozambique and the Reconstruction Government shall end."

 SAF_tying_it_all_together: "Tying It All Together"
 SAF_tying_it_all_together_desc: "With political matters mostly being settled, there still remains the bigger, yet also more simple way to handle the integration of our new lands. Infrastructure of all kinds should be heavily invested in, to not just tiethese lands not just politically to the Cape, but also economically. Enemy airbases can be repurposed into airports, docks and coastal facilities can be renovated, while new rail connections open up the remote inlands of Africa even further. The grandest thing to tackle however, is the road system overal which is far too simplistic and lacking in proper and extensive highways to reach more obscure regions.\n\n This will be a massive undertaking, expensive and take lots of time, but let there be no doubt about the immediate as well as long term return on investment. From these iron and asphalt links shall arise a permanent boon for the nation of South Africa!"
 
 SAF_claim_the_higher_ground: "Claim the Higher Ground"
 SAF_claim_the_higher_ground_desc: "The matter of perception can do much for us, and our side of the South African War is perhaps the most just war in history. A glorious defence of the Union, of freedom, and of hope against the dark forces of National Socialist Colonialism that sought to drown Africa in endless pain and misery. But there we those who resisted, and for the first time since 1945 the grey tide of misery and death that is National Socialism was turned back, and then driven from Africa for good.\n\nHere we stand, not just a victors of the war, but moral victors, just in their actions. The world should know of South Africa's sacrifice, the blood spilled to defend the cause of freedom in Africa. It can only ever do us good to espouse our moral victory over evil, and extensive efforts to spread such a message worldwide shall be set up so all freedom loving people of this Earth will know of the Good we have done."
 
 SAF_exposing_atrocities: "Exposing Atrocities"
 SAF_exposing_atrocities_desc: "The SS has done us a great favor by being the bloodthirsty beasts they were, the evidence of the suffering and death they inflicted is everywhere to be seen, with the scars on the lands and the scars on the people they violently enslaved still remain for us to document. Germany shall have no grand reputation as a saviour, but as horrific slavers and sadists who seemed to even be in a competition to inflict only suffering. Archeologists and reports in tow will descend upon the former Ostafrikan lands to document the camps, the graves, and all aspects of the horrific past and expose the Germans for what they are.\n\nAt the same time, this shall make us look like the righteous liberators of these lands, and thus the ones best to manage these lands as well."
 
 SAF_cover_up_excesses: "Cover Up Excesses"
 SAF_cover_up_excesses_desc: "War is a messy affair, no one can deny that. While research on German brutality is ongoing, several reports on missteps against Native civillians have emerged. While not of an institutional nature, these incidents and excesses are in fact something that can totally undermine our efforts abroad and at home to claim the moral high ground. Thankfully, plenty of opportunities have arosen to cover up the evidence of these excesses of war, like destroying evidence and even framing some of it on the brutal, cruel German opressors that we vanquished from these lands. While the public effort to blame the Germans for all shall be going on, behind closed doors the archives of the war shall be selectively burnt and destroyed so that the fact inconvenient to the history we are writing today shall never see the light at all."
 
 SAF_reintegrating_the_afrikaner_lands: "Reintegrating the Afrikaner Lands"
 SAF_reintegrating_the_afrikaner_lands_desc: "This was was fought to defend the Union. A union of Afrikaner and Anglo, a Union of two great and powerful peoples who united to form South Africa in the year 1902. While there are some who call for vengeance and retribution to be inflicted upon the Afrikaners, the Prime Minister knows better. As an Afrikaner himself, he shall see to it that the rights and lands are restored to the Afrikaners and peace and prosperity is quickly returned so that the Union will last, and not rip itself apart by feeding into a cycle of vengance between Anglo and Afrikaner. The idea of the Volksstaat shall be wiped away not by a hard hand, but an open palm and an invite to return to normal society. Of course, because of security reasons, the former core lands of the Volksstaat shall be denied the vote for one election only."
 
 SAF_the_pretoria_trials: "The Pretoria Trials"
 SAF_the_pretoria_trials_desc: "The time has come to conclude the wrap-up of this war by actually putting the criminals and murderers on trial. They shall not be given a show trial, but given proper representation and a chance to defend themselves even though the evidence against them is overwhelming. Publicly documented and with full press access, the key instigators and operators of the German Reichskommissariats (read: those that were able to be captured without fleeing or comitting suicide) will be put on trial.\n\nThe German grip over Africa shall end here, in Pretoria where true justice is delivered in full view of the world. The Pretoria Trials shall go into history as a great defence of humanity and the final judgement of evil, with South Africa as the defender of all that is good."
 
 SAF_guarding_the_north: "Guarding the North"
 SAF_guarding_the_north_desc: "The war may be won, but the Germans linger on in the North, and it is certain that they may try to start another conflict to reclaim their lost glory and thier lost lands. The only way to dissuade any such thing from happening is to properly fortify our northern border, extensive as it is, by setting up a proper system of fortifications and bases in the northern regions that can quickly respond to any trouble. While it is unfeasible to fortiy the entire long land border between us and what remains of the RK's attempts should be made to dissuade our enemies from crossing the border once again.\n\nSouth Africa was not ready when they crossed the border before, but now, we will never be overrun again."
 SAF_guarding_the_north_tt: "Fortifications will be built along the northern borders of South Africa and Mozambique."

 SAF_prioritzing_mobile_forces: "Prioritizing Mobile Forces"
 SAF_prioritzing_mobile_forces_desc: "With all the great lands added to our territory that will need oversight as well as millitary presence to deal with extremist remnants and those who seek to disturb the peace. But there is no way about it, that to cover such ground South Africa will be required to set up a purposefully nimble, mobile force adapted to the local and varied kinds of terrains that can be found within our Union. There is no real need for vast tank armies any more in the forseeable future, but what is needed is a fighting force that runs on wheels as quickly move around the land.\n\nThis however doesnt mean that such a mobile force will be unable to deliver a decisive blow for it shall be heavily armed. Wherever there is trouble, not only shall rapid response forces be delivered by land, but extensive helicopter formations shall also be established to back them up."
 
 SAF_reintegrating_the_afrikaner_lands_2: "Reintegrating the Afrikaner Lands"
 SAF_reintegrating_the_afrikaner_lands_2_desc: "This was was fought to defend the Union. A union of Afrikaner and Anglo, a Union of two great and powerful peoples who united to form South Africa in the year 1902. While there are some who call for vengeance and retribution to be inflicted upon the Afrikaners, the Prime Minister knows better. As an Afrikaner himself, he shall see to it that the rights and lands are restored to the Afrikaners and peace and prosperity is quickly returned so that the Union will last, and not rip itself apart by feeding into a cycle of vengance between Anglo and Afrikaner. The idea of the Volksstaat shall be wiped away not by a hard hand, but an open palm and an invite to return to normal society. Of course, because of security reasons, the former core lands of the Volksstaat shall be denied the vote for one election only."
 
 SAF_bases_for_the_americans: "Bases for the Americans"
 SAF_bases_for_the_americans_desc: "The Americans now hold a deep and vested interest in South Africa's future, and we should invite them in to all of our new lands to set up both naval operations and normal millitary bases from Durban to Windhoek and back to Laurenco Marques. American stationing should be welcomed, and several millitary bases that will now be in excess will be handed over to the Americans for a minor fee. We now find ourselves part of the Organization of Free Nations, and we shall guarantee our future security with the full backing of Uncle Sam. Never again shall South Africa stand alone, and now with permanent American bases spread across our lands any SS fool up north will think twice, if not thrice before starting trouble."
 
 SAF_the_union_stands: "The Union Stands"
 SAF_the_union_stands_desc: "Wounded, but not broken. Stretched, but not shattered. Separated, but united once again. The Union Forever! South Africa has been faced with its greatest test, and it has overcome it. Our borders are secure once again, and the Volksstaat has been decisively broken for good. While we were unable to take the fight to the Germans, nevertheless, the struggle has been won for the defence of the Union held. The cockroaches of the OBW have once again fled across the border, but there can be no doubt that their influence has been crushed by this defeat.\n\nBut the Union that entered into this war is vastly different from the Union that left it, while our economy has vastly changed, the natives remain restless and much of our cities and homes lie in ruin. While the Union stands, it has been weakened and injured, and now rapid action must be undertaken to rebuild the Union of South Africa. To heal the wounds of the conflict, that put brother against brother, city against city, and people against people. No more, for the Union stands, and it shall stand forever more!"
 
 SAF_funding_reconstruction: "Funding Reconstruction"
 SAF_funding_reconstruction_desc: "There is no way about it, reconstruction will have to be funded and funded in full. We must now take the effort to quickly rebuild the nation so we can outshine and overtake the Germans in the north economically. It is certain that they will eventually fall, while South Africa will remain the Last Light in Africa, but no time can be wasted on this. Taxes will have to be raised across the board, with the promise that every cent shall be invested in our national reconstruction, with the wounds of the past quickly fading in the face of a grand material effort to rebuild houses, to rebuild cities, and to truly rebuild the nation. To keep the peace, these tax increases shall only be active for five years to prevent any real unrest. We all must do our part in this, and soon enough prosperity shall return like never before!"
 
 SAF_maintaining_the_military_industrial_complex: "Maintaining the Military Industrial Complex"
 SAF_maintaining_the_military_industrial_complex_desc: "The millitary shall be brought down to an appopriate level matching a new cautious peacetime, with the oldest elements being eliminated to create a modern and lean force, still far greater than anything that came before. On the side of the newly founded industrial complexes to supply that army action must be taken to slightly downsize it but nevertheless keep it sustained and active as a industry worthy of being invested and supported. Export markets for our weaponry will have to be found in the Free World, but perhaps some deals can also be made with neutral countries. Since the war has shown the value of South African weaponry and arms, certainly there shall be buyers around the world who sure will be interested in ARMSCOR's finest."
 
 SAF_boss_is_watching: "BOSS is Watching"
 SAF_boss_is_watching_desc: "The Beuro of State Security is another key beneficiary of the war, having faced a key role in turning the tide against the German invader with extensive intelligence efforts that reached far behind the German lines. With the return of peace however, it would be foolish to downsize our intelligence apparatus with the threat in the north perhaps temporarily being turned back, but still ever lingering. The risk of enemy intelligence operations coordinating with remnants of the OBW that stayed behind, as well as sympathizers that could still hold some positions within local governments, is too great to just be ignored. Not to mention the extremists of the African National Congress that continue to heavily organize the Natives on a local level. South Africa shall be safe under the watchfull eyes of BOSS."
 
 SAF_deal_with_collaborators: "Deal With Collaborators"
 SAF_deal_with_collaborators_desc: "Many traitors have fled, but there are still plenty that we were able to arrest or deal with, not to mention those figures who openly collaborated with the Ossewabrandwag. We will have to take our time to purge local governments in the north from OBW sympathizers and collaborators, rooting out any networks within the government that may still remain before we can properly reintegrate the Afrikaner homelands into our Union. Denazification will have to take place to cleanse the stench of those who would have chained this nation to the menace of Germania, while new people will be appointed to uphold key roles in these lands."
 
 SAF_border_fortifications: "Border Fortifications"
 SAF_border_fortifications_desc: "They may have been pushed back, but the Germans linger on in the North, and it is certain that they may try to start another conflict to reclaim their lost glory. The only way to dissuade any such thing from happening is to properly fortify our northern border, extensive as it is, by setting up a proper system of fortifications and bases in the northern regions that can quickly respond to any trouble. While it is unfeasible to fortiy the entire long land border between us and what remains of the RK's attempts should be made to dissuade our enemies from crossing the border once again.\n\nSouth Africa was not ready when they crossed the border before, but now, we will never ever be overrun again"
 SAF_border_fortifications_tt: "Fortifications will be built along the northern borders of South Africa."

 SAF_arm_their_rebels: "Arm Their Rebels"
 SAF_arm_their_rebels_desc: "There is no doubt that the SS and other German organizations will still try to use the remnants of the OBW against us, and we should counter that by using their own internal divisions as well give support to and coordinate with rebel groups. Plenty of unhappy natives, as well as discord between the different groups of Germans provides a healthy basis of operations for the long term undermining of any and all German presence to the north of us. Of course, caution will have to be applied so that those that we arm don't turn their weapons upon us once they obtain their freedom..."
 
 SAF_our_place_in_the_free_world: "Our Place in the Free World"
 SAF_our_place_in_the_free_world_desc: "Trade with the Unity Pakt, hideous though it may have been, was a major driver of South Africa's growth between 1945 and 1963. With our fate solidly aligned with that of the Organization of Free Nations, we can now engage in a serious deepening of contacts and friendships with our newfound allies while the bleeting and threats coming from Germania can safely be ignored as we hide behind the shield of our true friends, the Americans.\n\nNow is the time to undertake grand diplomatic efforts to reach out to our newfound friends, restore old connections and links. Above all, we should secure new opportunities for South African buisinesses, intertwining our economy with those of our closest allies and quickly filling the gap in trade that the Germans have left behind. New opportunities await now that we have finally abandoned the false notion of neutrality for good."
 
 SAF_postwar_Canada_Britain: "Our Royal Connection"
 SAF_postwar_Canada_Britain_desc: "South Africa values its connection with the Royals strongly, and already the refendum has been discarded as a misstep if not a trojan horse that was brought upon this nation by the Ossewabrandwag. We must immediatly reach out to the Commonwealth, and of most importance is not just talking to the Royal Family and restoring their rightful rule over South Africa, but to also use these connections to set up further trade links between our nations. Everything runs on connections, after all, and this one we should be extensively using. Our first step shall be to restore a proper Govenor General to South Africa, appointed by Her Majesty Elizabeth the Second to once again take up symbolic oversight over our nation."
 
 SAF_postwar_Australia: "Coming From a Land Down Under"
 SAF_postwar_Australia_desc: "The Commonwealth of Australia is the bulwark of freedom in Oceania, resisting the Co Prosperity Sphere and being a core member of the OFN. Our famillial ties go back to the old days of the Empire, but our trade with Australia has never been much of a priority in general. This will have to change, as we reach out towards the Land Down Under, where the women and the men plunder their own mineral wealth.\n\nWhile our crossover in exports will mean that our capacity to do too much profitable trade will unfortunately be limited, there is a gain to be made, if only one tries hard enough to find one."
 
 SAF_postwar_Dutch: "The Exiles with Expertise"
 SAF_postwar_Dutch_desc: "One may overlook the Kingdom of the Netherlands as a small nation reduced to be even smaller in exile, but size belies their importance. Cut off from many opportunities, they have had to hyperspecialize in specific fields to gain a competetive advantage, chiefly among them petrochemicals under Royal Dutch Shell and consumer and millitary electronics under Philips Electronics N.V.\n\nIf South Africa is to truly thrive it will need to open itself up for foreign expertise to be deployed here. The more we can learn off the Dutch, the stronger we shall become. Luckily, we can leverage our relationship with the Dutch having started the colony of South Africa, and by sending some Afrikaner diplomats over we shall surely be able to secure more foreign investment."

 SAF_postwar_USA: "The Home of Liberty"
 SAF_postwar_USA_desc: "The United States of America may have been struggling in the past, but no one can deny that it is a true superpower, and with the cold war continuing to heat up it is good that we are now safely under the wing of the Americans. Trade contacts with America have already been strong before, but now we will need to not only focus our efforts towards the Americans, but as well as their entire wider sphere of economies that are in deep connection with the United States of America. But first, on to the Big Apple, and on to Texas, and on to Florida to lay ever deeper connections with the land of the dollar.\n\nAmerican technology and American machinery will power a second wave of the National Modernization Plan, while South African gold and diamonds shall pay for it all!"
 
 SAF_signing_the_treaty_of_pretoria: "Signing the Treaty of Pretoria"
 SAF_signing_the_treaty_of_pretoria_desc: "It is done. South Africa, the Union of South Africa is broken in half, and perhaps it shall not remain as a Union any more. The Afrikaner hardliners have won, and forced us to split our nation in half and cede the north to the vile extremists of the OBW who will spend no time in turning that part of our nation into a Germanophile hellhole that will run itself into the ground. Nevertheless, to bring peace and preserve what we can, the humiliating act of accepting defeat must be done.\n\nPrime Minister De Villiers Graaff shall travel to Pretoria under heavy guard to sign the peace treaty with the Afrikaner Volksstaat, recognizing their "independence" and revoking any claims to their lands. With the threat to fully occupy the nation, no real alternatives could be found, and this was the only way to make the best of a horrible situation. The Union is no more, but now we must tend to what is left."
 
 SAF_prisoner_exchange: "Prisoner Exchange"
 SAF_prisoner_exchange_desc: "With the closing of this war, so must the prisoners be exchanged between both sides. Valuable members of the OBW and the traitorous National Party will be sent north to join the hellhole of a Volksstaat, while our valuable people will return home to a nation ripped in half. At least those righteous defenders of the Cape will see their home again, but it remains a bitter affair to see traitors be given freedom they never deserves."
 
 SAF_the_new_border: "The New Border"
 SAF_the_new_border_desc: "With the new borders drawn, so must new defences be drawn. With the resurgent OBW dominating up there, the borders will have to be defendend especially since it has been proven without a shred of doubt that the Germans are a hideous, treacherous people who will certainly try again. But we shall be prepared this time, and we shall not be overrun this time! Our new border will be fortified, it will be upheld with strict force and it will serve as a decisive barrier that will break any attempt to cross it. Guard posts, machine guns, anti air guns, more and more shall be brought to the border and extensively dug in."
 
 SAF_shrinking_the_budget: "Shrinking the Budget"
 SAF_shrinking_the_budget_desc: "There is no way about it. We lost, and we lost a lot of valuable land, labour, and resources. There is no way the current budget is sustainable, even when we shrink down the army to it's pre-war size (which is unfeasble due to the needs of our defence. Cuts will have to be made, to fit our new circumstances. It will not be popular, it will not be liked, but there are little other choices left to us to straighten out our finances so that we may once again start to build up some real prosperity for ourselves. While forever weakened, South Africa is not yet down, and it is not yet defeated. We must take the hit, and prepare for a different future. Our war with the Volkstaat must now become an economic competition, disprove their system by outgrowing it. Perhaps, in the long distant future, the impoverished Afrikaner in the north shall look South at his loyalist bretheren and be in envy."
 
 SAF_requesting_american_aid: "Requesting American Aid"
 SAF_requesting_american_aid_desc: "There is no way about it: we must directly ask the Americans for help. There is no doubt that there will be a price to be paid for American assistance: to drop our protectionism of South African industry and let the Americans in. It is certain that plenty of South African industries kept alive by protectionism will be crushed by the American behemoths, but we have little choice on that. Our industry may suffer, but our exports certainly shall not. Income, funds, and exports are needed to rebuild South Africa and put the pathetic, isolated Volksstaat to shame.\n\nThus our only recourse is to go to Washington, ask for aid and support and in return truly bend the knee to Uncle Sam, letting us become a full on outpost of American capitalism rather then the South African model we have so long tried to build."
 
 SAF_american_bases_galore: "American Bases Galore"
 SAF_american_bases_galore_desc: "With South Africa being pushed to the brink, we had one nation step in to defend us, leading a great alliance of Free Nations in the defence of the Cape. Now, we are greatly weakened, wounded, and cut in half, but our American friends will still stand with us. We know for sure that the defence of South Africa will now fall under the wings of the American eagle, but that comes with not just joining the OFN but inviting an extensive millitary prescence by turning over millitary bases and naval bases over to the Americans and the rest of the OFN.\n\nIt stings to hand over old, respected historical bases, but with the Americans putting boots on the ground the Volksstaat and their puppetmasters surely must think twice before starting something again."

 SAF_embracing_our_anglo_heritage: "Our Anglo Heritage"
 SAF_embracing_our_anglo_heritage_desc: "There can be no doubt about it. Everyone knows it, it hangs in the air. The Afrikaners betrayed the Anglo's, brother against brother as Afrikaners move north and Anglo's trapped up north travel to side with their brothers here. The Union is dead, shattered, and gone, and what must now arise is a Commonwealth instead. Afrikaans should be reduced in importance with government communication be put into English in stead.\n\nSouth Africa's fate is set, and is now, and shall forever be an Anglo nation, white and proud upon the land colonized by our ancestors."
 
 SAF_maintaining_our_union: "Our Sacred Union"
 SAF_maintaining_our_union_desc: "This is not how it ends, for the Union still stands. In the face of the onslaught, in the face of treason and betrayal and the great invasion, there still is a Union of South Africa on the Cape. Our Afrikaner brothers, those who remained loyal, they fought and died to defend this union. Our Prime Minister remains an Afrikaner, and there are still plenty of Afrikaners in government and in leadership. For those who suffered and died, for those we shall uphold and defend our Union of Afrikaner and Anglo.\n\nFor the Union of South Africa, forever more!"

 SAF_resume_pan_african_crackdowns: "Resume Pan African Crackdowns"
 SAF_resume_pan_african_crackdowns_desc: "Now that things are settled we can resume our campaign about the extremists of the African National Congress who forever continue to advocate for universal voting which would be the end of South Africa as we know it. While we have given them some leeway in the busy days of the war, with the return of peace the internal war upon these rabble-rousers will have to be continue. When they are silenced, true peace will return to the Cape as everyone once again knows their right place in life."

