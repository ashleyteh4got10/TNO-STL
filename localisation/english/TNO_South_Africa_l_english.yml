 SAF_Rhodes_hitler_tt: "§YPakt Anger§! is a measure of how upset the Germans are with South Africa's cooperation with the §MOFN§!. If we are to get too close with the §MOFN§!, there is a chance that the Germans will §Rcut off trade and embargo us§! along with the rest of their sphere. If we seek to avoid German ire, we must choose our actions carefully."
